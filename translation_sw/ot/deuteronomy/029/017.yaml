  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: sw
  text: Asije kuwako miongoni mwenu mwanamume au mwanamke, ukoo au kabila, ambaye moyo wake unageuka leo kutoka kwa Yahwe, Mungu wetu, ili aende kuitumikia miungu ya mataifa yale. Wala asije kuwako miongoni mwenu mzizi unaozaa sumu na pakanga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mzizi unaozaa nyongo na pakanga.” Neno la Kiebrania רֹאשׁ linaweza kumaanisha nyongo au kitu chenye sumu; hapa huenda linarejelea kwa ujumla mazao yenye sumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן יֵשׁ בָּכֶם
  choice: Isiwepo miongoni mwenu
  rationale: Muundo huu wa tahadhari unaonyesha hatari inayopaswa kuzuiwa, huku ukisikika kwa kawaida katika Kiswahili.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: mwanamume au mwanamke
  rationale: Huhifadhi kwa wazi jozi ya jinsia iliyotajwa katika Kiebrania.
- source_word: מִשְׁפָּחָה
  choice: ukoo
  rationale: Katika mazingira haya ya kijamii na agano, neno hili linamaanisha kundi pana la watu wenye undugu, si familia ndogo ya nyumbani tu.
- source_word: שֵׁבֶט
  choice: kabila
  rationale: Hapa neno hilo linataja kitengo cha kikabila ndani ya Israeli.
- source_word: לְבָבוֹ פֹנֶה
  choice: moyo wake leo unageuka na kumwacha
  rationale: Kitenzi kishirikishi kinaweza kuonyesha hatua inayoendelea au inayoanza; 'unageuka' huhifadhi wazo hilo, na 'kumwacha' huweka wazi mwelekeo wa kujitenga na Yahwe uliomo katika מֵעִם.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: ili kwenda kuitumikia
  rationale: Huhifadhi tendo la kwenda pamoja na kusudi la kuitumikia miungu mingine.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: miungu ya mataifa yale
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya rejeo kwa miungu ya mataifa yaliyotajwa.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: mizizi inayozaa sumu na pakanga
  rationale: Huhifadhi sitiari ya mzizi na maneno mawili yanayoeleza mazao yake mabaya; 'sumu' huwasilisha maana pana ya רֹאשׁ, na 'pakanga' ni jina la mmea mchungu unaokusudiwa na לַעֲנָה.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina la Mungu la herufi nne moja kwa moja; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Je, kugeuka kwa moyo ni jambo lililokamilika au linaloendelea?
  choice: moyo wake leo unageuka
  alternative: moyo wake leo umegeuka
  rationale: Umbo shirikishi פֹנֶה linaacha uwezekano wa mchakato unaoanza au unaoendelea, kwa hiyo halijafanywa kuwa tendo lililokamilika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa tahadhari umerudiwa kama katika Kiebrania. Neno “pakanga” limehifadhiwa kwa usahihi wa taswira ya mmea, huku tanbihi ikieleza mbadala wa neno linaloweza kuwa gumu.
