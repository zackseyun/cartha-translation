base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: sw
  text: Nami niliwaongoza kwa miaka arobaini jangwani. Mavazi yenu hayakuchakaa yakiwa juu yenu, wala kiatu chako hakikuchakaa mguuni pako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinabadilika kutoka wingi kwenda umoja katika kishazi cha mwisho; kihalisi, “kiatu chako hakikuchakaa kutoka juu ya mguu wako.” Huenda umoja huo unaielekezea Israeli kama taifa moja au umetumiwa kwa maana ya kila mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: niliwaongoza
  rationale: Kitenzi cha Kiebrania ni cha kisababishi, kihalisi ‘niliwafanya mwende’; katika muktadha huu ‘niliwaongoza’ ni Kiswahili cha kawaida kinachoeleza uongozi wa Mungu katika safari ya jangwani.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: ‘Jangwa’ linaweza kumaanisha eneo kame au pori lisilokaliwa; hapa linatumika kwa mazingira ya safari ya Israeli na ni neno la kawaida katika Kiswahili cha Biblia.
- source_word: בָּלוּ / בָלְתָה
  choice: hayakuchakaa / hakikuchakaa
  rationale: Kitenzi בלה hapa kinaeleza mavazi na kiatu kuharibika kwa kutumiwa kwa muda mrefu; ‘kuchakaa’ ni neno la asili na sahihi katika Kiswahili.
- source_word: שַׂלְמֹתֵיכֶם
  choice: mavazi yenu
  rationale: Neno hili linarejelea kwa upana vitu vinavyovaliwa. ‘Mavazi’ ni la heshima, la sasa, na halifanyi maana iwe finyu kama ‘kanzu’ au ‘joho.’
- source_word: מֵעֲלֵיכֶם
  choice: mwilini mwenu
  rationale: Kihalisi ni ‘kutoka juu yenu’; kwa mavazi yanayovaliwa, ‘mwilini mwenu’ huwasilisha picha hiyo kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: נַעַלְךָ
  choice: kiatu chako
  rationale: Nomino iko katika umoja na ina kiambishi cha nafsi ya pili umoja. ‘Kiatu’ ni neno pana na la kawaida la Kiswahili kwa kifaa cha mguuni, likihifadhi umoja wa maandishi.
- source_word: מֵעַל רַגְלֶךָ
  choice: mguuni pako
  rationale: Kihalisi ni ‘kutoka juu ya mguu wako’; ‘mguuni pako’ ni namna ya asili ya kusema kuwa kiatu hakikuchakaa kilipokuwa kikivaliwa.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Hili ni fungu la muda; ‘kwa miaka arobaini’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Kubadilika kutoka wingi (‘ninyi/mavazi yenu’) kwenda umoja (‘kiatu chako/mguu wako’)
  choice: 'Kudumisha umoja katika kishazi cha mwisho: ‘kiatu chako ... mguuni pako’'
  alternative: 'Kulainisha kwa wingi: ‘viatu vyenu ... miguuni mwenu’'
  rationale: Kiebrania hubadilika wazi kutoka viambishi vya wingi kwenda vya umoja. Huenda Israeli inaelekezwa kama taifa moja au umoja umetumiwa kwa maana ya kila mmoja; tafsiri haipaswi kuamua kimya kimya kati ya uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nami’ huunganisha mstari na muktadha uliotangulia; sentensi mbili zinasaidia usomaji wa kawaida. Badiliko la wingi kwenda umoja limehifadhiwa na kufafanuliwa katika tanbihi.
