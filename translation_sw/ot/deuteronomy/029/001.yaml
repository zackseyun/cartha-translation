  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה אֶל כָּל יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אַתֶּ֣ם רְאִיתֶ֗ם אֵ֣ת כָּל אֲשֶׁר֩ עָשָׂ֨ה יְהוָ֤ה לְ/עֵֽינֵי/כֶם֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: sw
  text: Musa akawaita Waisraeli wote, akawaambia[a], “Mmeona mambo yote ambayo Yahwe alifanya mbele ya macho yenu katika nchi ya Misri, kwa Farao, kwa watumishi wake wote, na kwa nchi yake yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya Farao, dhidi ya watumishi wake wote, na dhidi ya nchi yake yote.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo katika muktadha ili kuonyesha kwamba matendo ya Yahwe nchini Misri yalikuwa hukumu dhidi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Kitenzi קרא katika muktadha huu kina maana ya kuwaita watu wakusanyike; “akawaita” ni cha kawaida na hakiongezi urasmi usio lazima.
- source_word: כָּל יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Hili ni jina la pamoja la taifa la agano. “Waisraeli wote” ni Kiswahili cha kawaida na huonyesha wazi kuwa Musa aliwaita watu wote wa Israeli.
- source_word: רְאִיתֶם
  choice: Mmeona
  rationale: Kauli timilifu ya Kiebrania inarejelea mambo ambayo wasikilizaji walikuwa wameyaona na ambayo bado yalikuwa na umuhimu kwao; “mmeona” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika matini.
- source_word: לְעֵינֵיכֶם
  choice: mbele ya macho yenu
  rationale: Nahau hii inasisitiza kuwa matendo hayo yalionekana waziwazi na watu wenyewe; tafsiri hii huhifadhi taswira ya Kiebrania na inaeleweka kwa urahisi.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Tafsiri hii huhifadhi neno המארץ, “nchi,” lililotajwa wazi katika Kiebrania.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: kwa Farao, kwa watumishi wake wote, na kwa nchi yake yote
  rationale: Kihusishi לְ kinachorudiwa kinaonyesha walengwa au walioathiriwa na matendo ya Yahwe. “Kwa” ni tafsiri ya karibu inayohifadhi uwezekano wa maana bila kuamua kimya kimya kwamba lazima iwe “dhidi ya”; maana hiyo ya kimuktadha imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha na cheo.
- issue: Mwelekeo wa matendo ya Yahwe kwa Farao, watumishi wake, na nchi yake
  choice: kwa Farao, kwa watumishi wake wote, na kwa nchi yake yote
  alternative: dhidi ya Farao, dhidi ya watumishi wake wote, na dhidi ya nchi yake yote
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha walengwa wa tendo, huku muktadha ukiruhusu maana ya hukumu dhidi yao. Matini kuu huhifadhi usemi mpana, na tanbihi inaonyesha tafsiri ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Muundo wa simulizi ni wa kawaida na unaeleweka kwa wasomaji wengi, huku urudiaji wa “kwa” na nahau “mbele ya macho yenu” vikihifadhi vipengele muhimu vya Kiebrania.
