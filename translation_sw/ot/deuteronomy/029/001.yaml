  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Musa anawaita Israeli wote, anawaambia, na kauli ya “mmeona” pamoja na “mbele ya macho yenu” inahifadhi ushuhuda wao wa moja kwa moja. “Kwa Farao ... na kwa nchi yake yote” hudumisha utata wa kihusishi לְ bila kulazimisha maana ya “dhidi ya” katika matini kuu.'
  naturalness: Kiswahili ni sanifu, cha asili, na kina hadhi inayofaa simulizi la kibiblia. “Musa akawaita Waisraeli wote, akawaambia” na “mbele ya macho yenu” ni miundo iliyo wazi na ya kawaida. Urudiaji wa “kwa” unakubalika kwa kuwa unaakisi urudiaji wa Kiebrania na kuleta uwazi.
  terminology: “Yahwe” ni toleo linalokubalika la Kiswahili la jina יהוה na linatimiza uamuzi wa kuhifadhi jina badala ya cheo. Majina “Musa,” “Waisraeli,” “Misri,” na “Farao” ni ya kawaida katika Kiswahili Sanifu. Tanbihi inaeleza kwa kiasi kinachofaa uwezekano wa maana ya kimuktadha bila kuibana matini kuu.
