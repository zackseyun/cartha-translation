base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: sw
  text: Na mataifa yote yatasema, “Kwa nini Yahwe ameitendea nchi hii hivi? Kwa nini hasira hii kubwa inayowaka?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini ukali huu mkubwa wa hasira?”
    reason: Tafsiri mbadala rasmi zaidi ya חֳרִי הָאַף, ambayo inaweza kueleza kuwaka au ukali wa hasira.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Na ... yatasema
  rationale: Kitenzi cha hali timilifu kilichounganishwa kwa וְ kinaeleza mwitikio wa mataifa utakaotokea katika muktadha huu wa kinabii; kwa hiyo wakati ujao unafaa katika Kiswahili.
- source_word: כָּל הַגּוֹיִם
  choice: mataifa yote
  rationale: גּוֹיִם hapa ni mataifa ya kigeni yatakayoiona hukumu ya nchi; “mataifa yote” huhifadhi maana ya jumla na ya kisiasa-kijamii.
- source_word: עַל מֶה
  choice: Kwa nini
  rationale: Nahau hii inauliza sababu; “kwa nini” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: עָשָׂה יְהוָה כָּכָה לָאָרֶץ הַזֹּאת
  choice: Yahwe ameifanyia nchi hii hivi
  rationale: Muundo huu huhifadhi kitendo kilichofanywa kwa nchi na maana ya כָּכָה, “hivi/namna hii,” kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa kuandikwa “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: Kwa nini hasira hii kubwa inayowaka?
  rationale: “Kwa nini” huhifadhi swali la sababu, huku “inayowaka” ikidumisha taswira halisi ya joto au kuwaka iliyomo katika חֳרִי; muundo wa swali usio na kitenzi kikuu pia unaakisi ufupi wenye nguvu wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la agano; “Yahwe” hulihifadhi kama jina bila kulibadilisha kuwa cheo.
- issue: Taswira ya hasira inayowaka
  choice: hasira hii kubwa inayowaka
  alternative: ukali huu mkubwa wa hasira
  rationale: Tafsiri kuu inadumisha sitiari ya חֳרִי inayohusiana na kuwaka au joto, bila kuipunguza kuwa ukali pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ameifanyia nchi hii hivi” ni cha kawaida na hudumisha uhusiano wa kisarufi wa tendo kwa nchi; taswira ya hasira inayowaka imehifadhiwa kwa uwazi.
