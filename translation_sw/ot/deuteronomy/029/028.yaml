base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: sw
  text: Mambo yaliyofichwa[a] ni ya BWANA, Mungu wetu; lakini mambo yaliyofunuliwa ni yetu na ya watoto wetu milele, ili tuyatende maneno yote ya sheria hii[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo ya siri.”
    reason: lexical_alternative
  - marker: b
    text: “Sheria hii” pia inaweza kutafsiriwa “mafundisho haya”; katika Kumbukumbu la Torati neno hili linahusu mafundisho ya agano ambayo Musa aliweka mbele ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: mambo yaliyofichwa
  rationale: Kivumishi-tendo cha hali ya kutendwa kimetumiwa kama nomino ya wingi. Tafsiri hii inadumisha wazo la mambo yaliyofichwa kwa wanadamu bila kuyafanya lazima yawe mafumbo ya kiibada.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: ni ya BWANA, Mungu wetu
  rationale: Kiambishi ל־ hapa kinaonyesha umiliki. Jina la agano יהוה limetafsiriwa kwa mtindo wa Kiswahili uliozoeleka kuwa “BWANA,” huku “Mungu wetu” ikihifadhi namna ya agano ya kumtaja.
- source_word: וְהַנִּגְלֹת
  choice: lakini mambo yaliyofunuliwa
  rationale: Ingawa וְ kwa msingi ni “na,” hapa inaunganisha vifungu vinavyotofautishwa, hivyo “lakini” huonyesha utofauti huo kwa Kiswahili cha kawaida. Hali ya kutendwa ya גלה imehifadhiwa.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: ni yetu na ya watoto wetu
  rationale: Kitenzi cha umiliki kinadokezwa katika Kiebrania na kimewekwa wazi kwa Kiswahili. בנים katika muktadha huu wa agano inawahusu watoto au wazao kwa ujumla, si wana wa kiume peke yao.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Hii ni tafsiri ya kawaida na fupi ya usemi unaoonyesha kudumu bila mwisho uliowekwa katika muktadha.
- source_word: לַעֲשׂוֹת
  choice: ili tuyatende
  rationale: 'Nomino-kitenzi yenye ל־ inaonyesha kusudi: mambo yaliyofunuliwa yametolewa kwa kusudi la kutii. “Ili” huonyesha kusudi hilo wazi.'
- source_word: אֵת כָּל דִּבְרֵי
  choice: maneno yote ya
  rationale: “Maneno” inadumisha msisitizo halisi wa דִּבְרֵי juu ya masharti yaliyosemwa ya agano badala ya kuyafafanua kwa upana zaidi.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: sheria hii
  rationale: תורה inaweza kumaanisha mafundisho au maagizo, lakini katika muktadha wa agano wa Kumbukumbu la Torati, “sheria” ni neno linalotambulika na linalofaa, huku tanbihi ikihifadhi maana pana zaidi.
theological_decisions:
- issue: Upeo wa mambo “yaliyofichwa” na “yaliyofunuliwa”
  choice: Aya inatofautisha mambo yaliyo kwa Mungu na ufunuo wa agano uliopewa Israeli kwa ajili ya utiifu, bila kufafanua makundi hayo kikamilifu.
  alternative: Kuifanya aya kuwa kanuni pana kuhusu mafumbo yote ya Mungu, au kuiwekea mipaka ya baraka na laana za agano pekee.
  rationale: Tafsiri inadumisha utofauti wa jumla uliomo katika Kiebrania na kusudi la utiifu, lakini haisuluhishi kimabavu mambo ambayo maandishi yenyewe hayajayataja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu kati ya “yaliyofichwa” na “yaliyofunuliwa” umehifadhiwa, pamoja na mpangilio wa umiliki na kusudi la utiifu.
