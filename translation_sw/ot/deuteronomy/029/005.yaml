base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: sw
  text: Hamkula mkate, wala hamkunywa divai na kileo[a], ili mpate kujua kwamba mimi ni Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kinywaji chenye kulevya.” Neno la Kiebrania linamaanisha kwa upana kinywaji kikali kilichochachushwa, si lazima aina moja maalumu ya kinywaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: mkate
  rationale: Maana ya msingi ni “mkate.” Ingawa neno hili wakati mwingine linaweza kumaanisha chakula kwa ujumla, maana halisi inafaa hapa na inadumisha utofautishaji na divai na kileo.
- source_word: אֲכַלְתֶּם
  choice: hamkula
  rationale: Kauli ya wakati uliopita inasimulia kwa njia ya kawaida uzoefu wa Israeli jangwani.
- source_word: יַיִן
  choice: divai
  rationale: Hii ndiyo maana ya kawaida ya neno la Kiebrania, na muktadha hauhitaji kulipanua.
- source_word: שֵׁכָר
  choice: kileo
  rationale: “Kileo” ni neno la kawaida na pana kwa kinywaji chenye kulevya, hasa kilichochachushwa, bila kulibana kuwa aina moja maalumu kama bia.
- source_word: שְׁתִיתֶם
  choice: hamkunywa
  rationale: Kauli ya wakati uliopita inafaa katika muhtasari huu wa mambo yaliyowapata wasikilizaji.
- source_word: לְמַעַן
  choice: ili
  rationale: “Ili” huonyesha kusudi au matokeo yaliyokusudiwa kwa Kiswahili cha kawaida na fasaha.
- source_word: תֵּדְעוּ
  choice: mpate kujua
  rationale: Baada ya “ili,” usemi huu unaonyesha matokeo yaliyokusudiwa bila kuondoa uwezekano wa maana ya kusudi au matokeo uliomo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna inayotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huu ni uwasilishaji wa moja kwa moja wa muundo wa umilikaji unaoonyesha uhusiano wa Mungu na watu wake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kuliweka kama cheo, huku likifuata tahajia ya kawaida ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Wala” huunganisha vikanushi viwili kwa mtiririko wa asili. Alama ya tanbihi imewekwa baada ya “kileo,” ambako neno la Kiebrania linalofafanuliwa linapatikana.
