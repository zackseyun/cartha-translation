id: DEU.29.20
reference: Deuteronomy 29:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: sw
  text: Yahwe atamtenga mtu huyo kutoka katika makabila yote ya Israeli ili apatwe na maafa, kulingana na laana zote[a] za agano zilizoandikwa katika kitabu hiki cha sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “laana za kiapo za agano.” Neno la Kiebrania linaweza kumaanisha hasa laana za agano zilizotamkwa kwa kiapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: atamtenga mtu huyo
  rationale: Hifili ya בדל pamoja na kiambishi cha nafsi ya tatu ya kiume inaonyesha kumtenga mtu fulani kutoka kwa kundi; kuongeza “mtu huyo” kunafanya rejeleo la kiwakilishi lieleweke kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: לְרָעָה
  choice: ili apatwe na maafa
  rationale: Katika muktadha huu רָעָה ni matokeo mabaya ya hukumu ya agano, si uovu wa kimaadili; usemi huu unaonyesha kusudi au matokeo ya adhabu kwa Kiswahili cha asili.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka katika makabila yote ya Israeli
  rationale: מן inaonyesha kutengwa kwake kutoka katika jumuiya pana ya makabila ya Israeli.
- source_word: כְּכֹל
  choice: kulingana na ... zote
  rationale: כְּ inaonyesha ulinganifu wa hukumu hiyo na masharti yote ya laana yaliyoandikwa.
- source_word: אָלות
  choice: laana zote
  rationale: אָלָה humaanisha laana, hasa laana inayothibitisha kiapo katika mazingira ya agano; “laana” ni wazi katika matini kuu, huku maana ya kiapo ikihifadhiwa katika tanbihi.
- source_word: הַבְּרִית
  choice: za agano
  rationale: בְּרִית ni agano linalofunga pande zinazohusika, neno la kawaida na lenye hadhi katika Kiswahili cha Biblia.
- source_word: הַכְּתוּבָה
  choice: zilizoandikwa
  rationale: Kivumishi tendwa kinahusishwa kwa kawaida na “laana zote” katika Kiswahili, kikihifadhi maana ya yaliyorekodiwa katika kitabu.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: katika kitabu hiki cha sheria
  rationale: סֵפֶר hapa inaweza kuwa kitabu au hati-kunjo, na תּוֹרָה ni sheria/mafundisho ya agano; “kitabu hiki cha sheria” ni tafsiri iliyo wazi na ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina la Mungu moja kwa moja; kulitaja “Yahwe” kunahifadhi jina la agano bila kulibadili kuwa cheo.
- issue: Aina ya hukumu katika לְרָעָה
  choice: ili apatwe na maafa
  alternative: kwa uovu
  rationale: Muktadha unazungumzia adhabu na maangamizi yanayotokana na laana za agano, si kwamba Yahwe anamtenga mtu huyo kwa ajili ya uovu wa kimaadili.
- issue: Maana ya אָלות katika agano
  choice: laana
  alternative: laana za kiapo
  rationale: “Laana” ni ya kawaida na wazi katika matini kuu, lakini tanbihi inahifadhi uwezekano kwamba neno hilo linataja mahususi laana zilizoambatanishwa na kiapo cha agano.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umehifadhi uhusiano wa Kiebrania: kutengwa kutoka katika makabila yote, kisha kusudi la kupatwa na maafa. Tanbihi [a] ipo katika matini kuu.'
