  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: sw
  text: Ndipo watakaposema, “Ni kwa sababu waliliacha agano la Yahweh, Mungu wa baba zao[a], alilofanya nao alipowatoa kutoka nchi ya Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Mungu wa mababu zao.”'
    reason: Tofauti hii inaonyesha njia nyingine ya kutafsiri אֱלֹהֵי אֲבֹתָם kwa Kiswahili, huku maandishi makuu yakihifadhi kwa karibu zaidi neno la Kiebrania linalomaanisha 'baba'.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Ndipo watakaposema
  rationale: Muundo huu unaendeleza mfuatano wa majibu katika muktadha na kuhifadhi maana ya wakati ujao kwa Kiswahili cha kawaida.
- source_word: עַל אֲשֶׁר
  choice: Ni kwa sababu
  rationale: Kirai hiki kinatanguliza sababu ya yaliyotokea kwa nchi; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: עָזְבוּ
  choice: waliliacha
  rationale: Kitenzi kinaonyesha kuliacha agano kwa kukosa uaminifu, si kuondoka mahali tu. 'Waliliacha' ni cha sasa, kinachoeleweka, na kinaendana kisarufi na 'agano'.
- source_word: בְּרִית
  choice: agano
  rationale: '''Agano'' ndilo neno la kawaida la kibiblia kwa uhusiano wa lazima uliowekwa kati ya Mungu na watu wake, na lina uzito unaofaa kuliko ''makubaliano''.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: Mungu wa baba zao
  rationale: Tafsiri hii inahifadhi muundo wa Kiebrania na rejeo lake la kiume kwa baba wa ukoo.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: alilofanya nao
  rationale: Kiebrania hutumia nahau ya 'kukata agano'; Kiswahili cha kawaida husema 'kufanya agano', hivyo maana imehifadhiwa bila tafsiri ngumu ya neno kwa neno.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: alipowatoa
  rationale: Kiambishi בְּ pamoja na kitenzi-jina kina maana ya wakati hapa; 'alipowatoa' huonyesha kwa kawaida wakati wa tukio.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Pamoja na 'kuwatoa', kirai hiki huleta maana ya kutoka ndani ya nchi ya Misri na kuhifadhi usemi kamili wa chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; 'Yahweh' hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Usemi wa ukoo אֱלֹהֵי אֲבֹתָם
  choice: Mungu wa baba zao
  alternative: Mungu wa mababu zao
  rationale: Kiebrania ni cha jinsia ya kiume na kinarejelea baba wa ukoo; tafsiri kuu inahifadhi hilo bila kulifanya neno kuwa lisiloonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi 'Ndipo watakaposema' unaendeleza mtiririko wa kinabii, na 'waliliacha agano' huepuka lugha ya kizamani huku ukihifadhi uzito wa kutokuwa waaminifu kwa agano.
