base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: sw
  text: Wakaenda wakaitumikia miungu mingine na kuiinamia—miungu ambayo hawakuijua na ambayo Mungu hakuwa amewagawia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miungu ambayo haikugawiwa kwao.” Kiebrania kina kitenzi cha umoja chenye kiima kisichotajwa wazi, ambacho huenda kinamrejelea Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: Neno הלך kimsingi humaanisha ‘kwenda/tembea.’ ‘Wakaenda’ linahifadhi mfuatano wa Kiebrania bila kuufasiri kupita kiasi.
- source_word: וַיַּעַבְדוּ
  choice: wakaitumikia
  rationale: Kitenzi עבד humaanisha kwa kawaida ‘kutumikia.’ Tafsiri hii inadumisha tofauti na tendo la kuinama linalotajwa baadaye.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo maana ya moja kwa moja ya אֲחֵרִים katika muktadha huu; ‘miungu ya kigeni’ ingeongeza wazo ambalo halijaelezwa wazi hapa.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: na kuiinamia
  rationale: שׁחה inaonyesha kuinama au kujitupa chini mbele ya mwingine. ‘Kuiinamia’ huhifadhi taswira hiyo na ni lugha ya kawaida, yenye hadhi.
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: miungu ambayo hawakuwa wameijua
  rationale: ידע hapa inaweza kuhusisha zaidi ya kufahamu kuwapo kwa kitu; ‘hawakuwa wameijua’ hudumisha uwezekano wa maana ya uhusiano au uzoefu.
- source_word: וְלֹא חָלַק לָהֶם
  choice: na ambayo yeye hakuwa amewagawia
  rationale: חלק humaanisha kugawa au kupangia sehemu. Kitenzi cha Kiebrania kiko katika umoja wa kiume bila kiima kilichotajwa; ‘yeye’ hulifanya hilo lieleweke huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions:
- issue: Kiima kisichotajwa cha kitenzi cha umoja חָלַק
  choice: ‘ambayo yeye hakuwa amewagawia,’ ambapo ‘yeye’ inaelekea kumrejelea Mungu
  alternative: ‘ambayo hawakuwa wamegawiwa’
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu, umoja wa kiume, bila kiima kilichotajwa wazi. Muktadha unaunga mkono Mungu kuwa mtendaji, lakini kwa kuwa hilo si wazi kisarufi, uwezekano wa kauli isiyotaja mtendaji umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, ya kawaida na yenye hadhi. Kistari kirefu kinaunganisha maelezo ya pili ya ‘miungu’ kwa uwazi bila kubadili muundo wa hoja.
