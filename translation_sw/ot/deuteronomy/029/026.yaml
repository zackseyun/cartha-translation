  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בָּ/אָ֣רֶץ הַ/הִ֑וא לְ/הָבִ֤יא עָלֶ֨י/הָ֙ אֶת כָּל הַ/קְּלָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֥פֶר הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: sw
  text: Basi hasira ya Yahweh ikawaka dhidi ya nchi hiyo, naye akailetea laana yote iliyoandikwa katika kitabu hiki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Nahau ya Kiebrania inaonyesha hasira kali kwa taswira ya kuwaka. Tafsiri hii inadumisha taswira hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: בָּאָרֶץ הַהִוא
  choice: dhidi ya nchi hiyo
  rationale: Katika muundo huu, kihusishi ב kinaonyesha kile ambacho hasira inakielekea; “dhidi ya” linaeleza wazi mwelekeo wa hukumu.
- source_word: לְהָבִיא עָלֶיהָ
  choice: naye akailetea
  rationale: Kitenzi kisicho na kikomo kinaonyesha matokeo au kusudi la hasira ya Yahweh. Kuongeza “naye” kunamfanya Yahweh abaki kuwa mtendaji wazi katika Kiswahili.
- source_word: כָּל הַקְּלָלָה
  choice: laana yote
  rationale: Kiebrania kina nomino ya umoja yenye maana ya ujumla mzima. “Laana yote” kinahifadhi umoja huo na wazo la ukamilifu bila kuibadili kimya kuwa wingi.
- source_word: הַכְּתוּבָה
  choice: iliyoandikwa
  rationale: Hii inawakilisha moja kwa moja umbo la kutendwa la Kiebrania na kudumisha uzito wa maandishi ya agano.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: katika kitabu hiki
  rationale: סֵפֶר inaweza kuwa kitabu, hati, au gombo; “kitabu” ndiyo tafsiri iliyo wazi na ya kawaida zaidi katika muktadha huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano moja kwa moja. “Yahweh” linahifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Je, כָּל הַקְּלָלָה ni laana nyingi au laana moja kwa maana ya ujumla?
  choice: laana yote
  alternative: kila laana
  rationale: Muundo wa Kiebrania ni wa umoja wenye kibainishi na unaweza kuonyesha jumla nzima ya laana. Tafsiri ya umoja inalinda umbo hilo na haiondoi uwezekano wa maana ya pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha taswira ya hasira kuwaka, lakini kiwakilishi “naye” kinatumika ili mtendaji wa kuleta laana awe wazi na sentensi isikike kawaida kwa msomaji wa Kiswahili.
