source:
  edition: WLC
  text: לְמַ֣עַן הָקִֽים אֹתְ/ךָ֩ הַ/יּ֨וֹם ל֜/וֹ לְ/עָ֗ם וְ/ה֤וּא יִֽהְיֶה לְּ/ךָ֙ לֵֽ/אלֹהִ֔ים כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/כַ/אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: sw
  text: ili leo awathibitishe kuwa watu wake[a], naye awe Mungu wenu, kama alivyowaambia na kama alivyowaapia mababu zenu[b]—Abrahamu, Isaka na Yakobo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na muundo wa Kiebrania, “kuwa watu kwa ajili yake.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “baba zenu”; yaani, mababu Abrahamu, Isaka na Yakobo.
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo, na ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: leo awathibitishe
  rationale: Hifili ya קום hapa ina maana ya kuwafanya wasimame imara au kuwathibitisha katika hadhi ya agano; wingi wa Kiswahili unaonyesha kwamba ‘wewe’ wa Kiebrania unalenga Israeli kwa jumla.
- source_word: לוֹ לְעָם
  choice: kuwa watu wake
  rationale: Huhifadhi dhana ya kuwa mali ya Mungu katika uhusiano wa agano kwa Kiswahili cha kawaida.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: naye awe Mungu wenu
  rationale: Ni namna ya asili ya kutoa kauli ya agano, huku ‘naye’ ikihifadhi mkazo wa וְהוּא.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: kama alivyowaambia
  rationale: ‘Aliwaambia’ huhifadhi maana ya msingi ya דבר bila kuibadili kuwa ‘aliahidi,’ kwa kuwa kiapo kinatajwa kando katika kishazi kinachofuata.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: na kama alivyowaapia
  rationale: נשבע humaanisha kuapa; muundo huu pia huonyesha wazi kwamba kiapo kilielekezwa kwa mababu.
- source_word: לַאֲבֹתֶיךָ
  choice: mababu zenu
  rationale: Katika muktadha huu neno linawarejelea moja kwa moja Abrahamu, Isaka na Yakobo; ‘mababu’ ni la asili na sahihi katika Kiswahili.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: Abrahamu, Isaka na Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili; alama ya mstari mrefu inaonyesha kwamba majina hayo yanafafanua ‘mababu zenu.’
theological_decisions:
- issue: Kauli ya agano
  choice: watu wake … Mungu wenu
  alternative: watu kwa ajili yake … Mungu kwenu
  rationale: Utoaji uliochaguliwa ni wa kawaida katika Kiswahili na unahifadhi uhusiano wa pande mbili wa agano bila kuondoa uzito wake.
- issue: Umoja wa pamoja katika Kiebrania
  choice: 'wingi wa Kiswahili: awathibitishe … wenu'
  alternative: 'umoja: akuthibitishe … wako'
  rationale: Kiwakilishi cha umoja katika Kiebrania kinaihutubia Israeli kama jumuiya moja. Wingi ni wa asili katika Kiswahili na unaepusha dhana potovu ya kwamba mtu mmoja binafsi ndiye anayelengwa.
- issue: Utambulisho wa ‘mababu’
  choice: Abrahamu, Isaka na Yakobo wanafafanua mababu wanaokusudiwa
  alternative: mababu kwa maana pana ya wahenga wote
  rationale: Majina yanayofuata yanaweka wazi kwamba hapa rejeo ni kwa wazee wa ukoo waliotajwa, bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa kauli ya agano, huku wingi ukitumiwa kwa sababu anayehutubiwa ni Israeli kwa jumla.
