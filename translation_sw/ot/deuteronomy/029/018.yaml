base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: sw
  text: Na itakuwa kwamba mtu atakaposikia maneno ya kiapo hiki[a], atajibariki moyoni mwake akisema, “Nitakuwa na amani, ingawa ninaenenda katika ukaidi wa moyo wangu”—ili kufutilia mbali kilichoshiba maji pamoja na kilicho na kiu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “laana hii.” Neno la Kiebrania linaweza kumaanisha kiapo kinachoambatana na laana.
    reason: alternative_reading
  - marker: b
    text: 'Au huenda: “ili kufutilia mbali nchi yenye maji pamoja na nchi kavu,” yaani, kuharibu vyote bila ubaguzi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: kiapo
  rationale: Neno אָלָה linaweza kumaanisha kiapo chenye masharti ya laana. “Kiapo” linafaa katika kirai “maneno ya kiapo hiki,” huku tanbihi ikihifadhi uwezekano wa “laana.”
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: atajibariki moyoni mwake
  rationale: Huhifadhi umbo la kujirejelea la kitenzi na kejeli ya mtu anayejihakikishia baraka moyoni licha ya onyo la agano.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: Nitakuwa na amani
  rationale: “Amani” hapa inajumuisha hali njema na usalama bila kuibana maana kuwa usalama wa kimwili pekee.
- source_word: שְׁרִרוּת לִבִּי
  choice: ukaidi wa moyo wangu
  rationale: “Ukaidi” unaonyesha ugumu wa nia na uasi unaokusudiwa katika onyo hili la agano.
- source_word: לְמַעַן סְפוֹת
  choice: ili kufutilia mbali
  rationale: “Ili” huhifadhi uhusiano wa kusudi au matokeo yaliyokusudiwa, na “kufutilia mbali” huwasilisha maana ya uharibifu ya ספה katika muktadha huu.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: kilichoshiba maji pamoja na kilicho na kiu
  rationale: Tafsiri hii huhifadhi picha na utata wa Kiebrania kati ya kilichojazwa maji na kilicho na kiu, badala ya kuamua kimya kwamba vinamaanisha aina mbili za ardhi.
theological_decisions:
- issue: Maana ya lugha ya adhabu ya agano katika הָאָלָה
  choice: Kiapo katika matini kuu, huku “laana” ikitajwa katika tanbihi
  alternative: laana
  rationale: Neno linaweza kumaanisha kiapo kinachoambatana na laana. Chaguo hili huhifadhi wazo la tamko la agano bila kuficha nguvu yake ya adhabu.
- issue: Tafsiri ya nahau tata הָרָוָה אֶת־הַצְּמֵאָה
  choice: Kuhifadhi picha ya kilichoshiba maji na kilicho na kiu
  alternative: nchi yenye maji pamoja na nchi kavu
  rationale: Nahau hii ina utata wa kweli. Matini kuu haiifungii katika tafsiri moja, na tanbihi inatoa uwezekano unaohusisha ardhi na kuharibiwa kwa vyote bila ubaguzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ninaenenda” huhifadhi sitiari ya mwenendo wa maisha; kirai cha mwisho kimeachwa na utata wake wa kimakusudi, huku tanbihi ikitoa tafsiri ya wazi zaidi.
