  text: גָּפְרִ֣ית וָ/מֶלַח֮ שְׂרֵפָ֣ה כָל אַרְצָ/הּ֒ לֹ֤א תִזָּרַע֙ וְ/לֹ֣א תַצְמִ֔חַ וְ/לֹֽא יַעֲלֶ֥ה בָ֖/הּ כָּל עֵ֑שֶׂב כְּֽ/מַהְפֵּכַ֞ת סְדֹ֤ם וַ/עֲמֹרָה֙ אַדְמָ֣ה ו/צביים אֲשֶׁר֙ הָפַ֣ךְ יְהוָ֔ה בְּ/אַפּ֖/וֹ וּ/בַ/חֲמָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: sw
  text: Nchi yake yote ni kiberiti na chumvi, mahali palipoteketea[a]. Haipandwi wala haioteshi, na mmea wowote hauoti humo, kama kupinduliwa kwa Sodoma na Gomora, Adma na Seboimu, ambazo Yahwe alizipindua katika hasira yake na ghadhabu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwako.”
    reason: Neno la Kiebrania linaweza kutaja tendo la kuwaka au hali ya nchi iliyoteketezwa.
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: kiberiti na chumvi
  rationale: Hutaja vitu halisi vinavyoashiria nchi iliyoharibiwa na kuwa tasa; ‘kiberiti’ na ‘chumvi’ ni maneno ya kawaida na yanayoeleweka katika Kiswahili cha sasa.
- source_word: שְׂרֵפָה
  choice: nchi iliyoungua
  rationale: Nomino hii inaweza kueleza mwako au hali ya kuteketezwa. Katika muktadha huu, ‘nchi iliyoungua’ huwasilisha kwa lugha ya kawaida matokeo ya moto bila kuondoa taswira yake.
- source_word: לֹא תִזָּרַע וְלֹא תַצְמִחַ
  choice: Haipandwi wala haichipushi
  rationale: ‘Haipandwi’ hudumisha kauli ya kutendwa ya Kiebrania, na ‘haichipushi’ huiacha nchi kuwa mtendaji wa kisarufi anayeshindwa kuotesha mimea.
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: na mmea wowote hauoti humo
  rationale: עֵשֶׂב inaweza kumaanisha majani au mimea kwa upana. ‘Mmea wowote’ linafaa katika maelezo ya utasa kamili wa nchi.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: kama ... yalivyopinduliwa—miji ambayo ... aliipindua
  rationale: ‘Kupindua’ huhifadhi uhusiano wa kileksika kati ya nomino na kitenzi cha mzizi הפך, huku ‘miji’ ikifafanua kwa kawaida majina manne ya mahali.
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: Sodoma na Gomora, Adma na Seboimu
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: kwa hasira yake na ghadhabu yake
  rationale: Maneno haya mawili yanahifadhi uzito na msisitizo wa jozi ya Kiebrania bila kutafsiri kihalisi sitiari ya pua au joto.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Namna ya kueleza hukumu dhidi ya miji minne
  choice: yalivyopinduliwa ... aliipindua
  alternative: yalivyoangamizwa ... aliiangamiza
  rationale: ‘Kupindua’ hudumisha urudiaji wa mzizi הפך na taswira ya Kiebrania, bila kuongeza maelezo ya namna ya hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi fupi zimetumiwa kuwasilisha mfululizo wa maelezo ya Kiebrania kwa uwazi. ‘Humo’ hurejelea nchi, na dash hutenganisha ulinganisho na kishazi kinachoeleza miji hiyo.
