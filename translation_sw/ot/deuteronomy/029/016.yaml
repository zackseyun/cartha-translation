  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: sw
  text: nanyi mliviona vitu vyao vya kuchukiza[a] na sanamu zao[b], mbao na mawe, fedha na dhahabu, zilizokuwa miongoni mwao[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “machukizo yao.” Neno la Kiebrania linaonyesha vitu vinavyochukiza sana, mara nyingi vitu vinavyohusiana na ibada ya sanamu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “sanamu” ni neno la dharau kali; huenda lina kidokezo kichafu kinachozifananisha na kinyesi.
    reason: lexical_alternative
  - marker: c
    text: Au, “zilizokuwa pamoja nao.” Hapa “wao” inarejelea mataifa ambayo Israeli ilipita katika nchi zao.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: nanyi mliviona
  rationale: Kitenzi cha nafsi ya pili wingi kinaendeleza masimulizi ya Musa kwa watu. Wakati uliopita unaonyesha tukio walilolishuhudia, na kiunganishi kinaendeleza mtiririko wa sentensi iliyotangulia.
- source_word: שִׁקּוּצֵיהֶם
  choice: vitu vyao vya kuchukiza
  rationale: Neno hili linaonyesha vitu vinavyochukiza sana, hasa vinapohusiana na ibada ya sanamu. Tafsiri hii ni wazi kwa msomaji wa sasa na inadumisha nguvu yake ya kuhukumu.
- source_word: גִּלֻּלֵיהֶם
  choice: sanamu zao
  rationale: Hurejelea sanamu kwa neno lenye dharau kali. “Sanamu” linabainisha kitu kinachorejelewa, huku maana kali zaidi ikielezwa katika tanbihi.
- source_word: עֵץ וָאֶבֶן
  choice: za mbao na mawe
  rationale: Majina haya yanaeleza vifaa ambavyo sanamu au vitu hivyo vilitengenezwa. Muundo wa “za” unaunganisha orodha hiyo na vitu vilivyotajwa.
- source_word: כֶּסֶף וְזָהָב
  choice: za fedha na dhahabu
  rationale: Maneno haya yanaendeleza orodha ya vifaa. Kurudia “za” kunafanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: zilizokuwa miongoni mwao
  rationale: Kishazi hiki kinaonyesha kuwa vitu hivyo vilikuwapo kati ya mataifa yaliyotajwa katika muktadha, bila kudokeza kwamba Waisraeli ndio waliovimiliki.
theological_decisions:
- issue: Jinsi ya kutafsiri maneno mawili ya dharau kuhusu ibada ya sanamu
  choice: vitu vyao vya kuchukiza na sanamu zao
  alternative: machukizo yao na sanamu zao za kudharauliwa
  rationale: Tafsiri inadumisha maneno mawili tofauti ya Kiebrania na nguvu yake hasi bila kuyaunganisha kuwa wazo moja wala kuongeza ufafanuzi wa kimadhehebu.
- issue: Kirejeleo cha kishazi אֲשֶׁר עִמָּהֶם
  choice: zilizokuwa miongoni mwao
  alternative: zilizokuwa pamoja nao; zilizokuwa mali yao
  rationale: Muktadha unaelekeza kishazi kwa mataifa ambayo Israeli ilipita katika nchi zao. Uteuzi huu unaacha wazi kama maana kuu ni kuwapo au kumilikiwa, huku ukiepuka kudokeza kuwa sanamu hizo zilikuwa za Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unabaki kuwa sehemu ya sentensi inayoendelea, kwa hiyo mstari unamalizika kwa kistari kirefu.
