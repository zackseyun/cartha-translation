  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: sw
  text: ili uingie katika agano la Yahweh Mungu wako, na katika kiapo chake[a], ambavyo Yahweh Mungu wako anafanya nawe leo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiapo chake chenye laana.” Neno la Kiebrania linaweza kumaanisha kiapo kinachojumuisha adhabu au laana za agano.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “anakata [agano] nawe leo.” Hii ni nahau ya Kiebrania yenye maana ya kufanya agano.
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: ili uingie
  rationale: Muundo huu unaonyesha kusudi au matokeo. Pamoja na בְּרִית, kitenzi עבר hakizungumzii kuvuka mahali halisi, bali kuingia katika wajibu wa agano.
- source_word: בִּבְרִית
  choice: katika agano
  rationale: Neno בְּרִית linamaanisha agano; Kiswahili cha kawaida husema ‘kuingia katika agano.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehifadhiwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Huu ni muundo wa umilikaji wenye kiambishi cha nafsi ya pili umoja: ‘Mungu wako.’'
- source_word: וּבְאָלָתוֹ
  choice: pamoja na kiapo chake
  rationale: אָלָה linaweza kumaanisha kiapo chenye masharti ya adhabu au laana. ‘Kiapo chake’ ni tafsiri pana na inayoeleweka, huku maana ya laana ikihifadhiwa katika tanbihi.
- source_word: כֹּרֵת
  choice: analifanya
  rationale: Kauli ya Kiebrania כרת ברית ni, kihalisi, ‘kukata agano,’ lakini maana yake ya kawaida ni kufanya agano. ‘Analifanya’ ni Kiswahili cha asili katika muktadha huu na kinaonyesha tendo linalofanyika wakati huo.
- source_word: עִמְּךָ
  choice: nawe
  rationale: Ni tafsiri ya kawaida ya עם pamoja na kiambishi cha nafsi ya pili umoja.
- source_word: הַיּוֹם
  choice: leo
  rationale: ‘Leo’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יהוה
  choice: Yahweh Mungu wako
  alternative: BWANA Mungu wako
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. Kulihifadhi kama ‘Yahweh’ kunatofautisha jina hilo na cheo ‘Bwana.’
- issue: Iwapo אָלָה litaje laana waziwazi katika matini kuu
  choice: kiapo chake
  alternative: kiapo chake chenye laana; laana yake
  rationale: Neno hilo linaweza kujumuisha kiapo na adhabu au laana zake. Matini kuu imetumia maana pana ‘kiapo,’ na tanbihi imehifadhi maana ya laana bila kuondoa utata uliopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘kuingia katika agano’ ni wa kawaida na unaeleweka; ‘pamoja na’ husaidia kuunganisha agano na kiapo bila kudokeza mwendo halisi. Kistari kirefu kinaonyesha kwamba kishazi cha mwisho kinafafanua agano linalofanywa leo.
