base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: sw
  text: Nao kizazi kijacho[a]—watoto wenu watakaoinuka baada yenu—pamoja na mgeni atakayekuja kutoka nchi ya mbali, watasema watakapoona mapigo ya nchi hiyo na magonjwa yake[b] ambayo Yahweh ameiletea:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kizazi cha baadaye.” Hapa haimaanishi lazima kizazi cha mwisho kabisa.
    reason: lexical_alternative
  - marker: b
    text: Au, “maradhi yake.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “ambayo Yahweh ameifanya nchi hiyo iwe mgonjwa ndani yake”; pia yaweza kutafsiriwa, “ambayo Yahweh ameitesa ndani yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: watasema
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja, kinatanguliza wahusika wawili waliounganishwa—kizazi kijacho na mgeni. Wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: kizazi kijacho
  rationale: Kirai hiki humaanisha kizazi cha baadaye, si lazima kizazi cha mwisho kabisa.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: watoto wenu watakaoinuka baada yenu
  rationale: Huhifadhi picha ya kuinuka kwa kizazi kinachofuata; בנים hapa inaweza kumaanisha watoto au wazao kwa ujumla.
- source_word: וְהַנָּכְרִי
  choice: pamoja na mgeni
  rationale: נכרי ni mtu wa taifa au nchi nyingine. 'Mgeni' ndilo neno la kawaida la Kiswahili katika muktadha huu, na 'pamoja na' huonyesha wazi kuwa ni mhusika wa pili.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: kutoka nchi ya mbali
  rationale: Tafsiri ya kawaida inayohifadhi wazo la umbali wa kijiografia.
- source_word: וְרָאוּ
  choice: watakapoona
  rationale: Muundo huu huonyesha wakati au mazingira yanayosababisha wao kusema, kwa hiyo kishazi cha wakati kinafaa katika Kiswahili.
- source_word: מַכּוֹת
  choice: mapigo
  rationale: Neno linaweza kumaanisha mapigo au maafa ya kuadhibu; 'mapigo' huhifadhi taswira na muktadha wa laana za agano.
- source_word: תַּחֲלֻאֶיהָ
  choice: magonjwa yake
  rationale: Huhifadhi sitiari ya nchi iliyoathiriwa na magonjwa; 'maradhi yake' pia inawezekana.
- source_word: חִלָּה
  choice: ameiletea
  rationale: Katika muktadha huu kitenzi cha kisababishi kinaonyesha kwamba Yahwe ndiye aliyeisababishia nchi hali hiyo. 'Ameiletea' ni ya asili katika Kiswahili, huku tanbihi ikihifadhi usemi halisi wa 'kuifanya iwe mgonjwa'.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: בָּהּ
  choice: nchi hiyo
  rationale: Kiwakilishi kinarejelea nchi. Kurudia 'nchi hiyo' katika maelezo ya tanbihi huondoa utata wa rejeleo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu; 'Yahwe' hulihifadhi moja kwa moja badala ya kulitafsiri kwa cheo.
- issue: Upeo wa בְּנֵיכֶם
  choice: watoto wenu
  alternative: wana wenu / wazao wenu
  rationale: Katika muktadha wa kizazi kijacho, neno la Kiebrania linawahusu watoto au wazao kwa ujumla, wala si wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Mistari ya katikati hutenga maelezo ya 'watoto wenu' bila kuvunja mtiririko; sentensi inaishia kwa nukta mbili kwa sababu usemi unaendelea katika mstari unaofuata.
