  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: sw
  text: 'Leo ninyi nyote mmesimama mbele za Yahwe Mungu wenu: wakuu wenu, makabila yenu,[a] wazee wenu na maafisa wenu—kila mwanamume wa Israeli.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakuu wa makabila yenu.” Kiebrania kinaweza kueleweka kama orodha, “wakuu wenu, makabila yenu,” au maneno hayo mawili yanaweza kuunganishwa.
    reason: alternative_reading
  - marker: b
    text: Kiebrania ni kihalisi “kila mwanamume wa Israeli,” usemi wa kugawa mmoja mmoja; maana ya jumla inaweza kusemwa pia “wanaume wote wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִצָּבִים
  choice: mmesimama
  rationale: Kauli ya hali katika Kiebrania inaonyesha jumuiya iliyokusanyika ikiwa imesimama mbele za Mungu; “mmesimama” huhifadhi hali hiyo ya sasa kwa Kiswahili cha kawaida.
- source_word: הַיּוֹם
  choice: leo
  rationale: Huhifadhi msisitizo wa wakati kwa njia fupi na ya asili.
- source_word: כֻּלְּכֶם
  choice: ninyi nyote
  rationale: Huwasilisha wazi msisitizo kwamba kusanyiko lote linahusika.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Ni usemi wa kawaida na wenye heshima unaomaanisha kuwa katika uwepo wa mtu, hapa katika mazingira ya agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika matini badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni tafsiri ya moja kwa moja ya nomino pamoja na kiambishi cha nafsi ya pili wingi.
- source_word: רָאשֵׁיכֶם
  choice: wakuu wenu
  rationale: “Wakuu” huwasilisha sitiari ya “vichwa” kwa Kiswahili cha asili huku ikimaanisha viongozi bila kuamua kimyakimya kama neno linalofuata linapaswa kuunganishwa nalo.
- source_word: שִׁבְטֵיכֶם
  choice: makabila yenu
  rationale: Huhifadhi maana ya kawaida ya neno na muundo wa orodha uliowekwa katika matini ya Kimasora.
- source_word: זִקְנֵיכֶם
  choice: wazee wenu
  rationale: Ni istilahi ya kawaida kwa wazee wenye nafasi ya kijamii na kiutawala katika Israeli.
- source_word: שֹׁטְרֵיכֶם
  choice: maafisa wenu
  rationale: Katika mazingira ya kiutawala ya Kumbukumbu la Torati, neno hili humaanisha maafisa au watendaji bila kulazimisha kazi maalumu zaidi.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: kila mwanamume wa Israeli
  rationale: Huhifadhi nomino ya kiume ya umoja na matumizi yake ya kugawa mmoja mmoja, badala ya kuifanya kuwa kauli isiyoonyesha jinsia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya kijinsia כֹּל אִישׁ יִשְׂרָאֵל
  choice: kila mwanamume wa Israeli
  alternative: kila mtu wa Israeli au Israeli wote
  rationale: Neno אִישׁ ni la kiume na limetumiwa kwa maana ya kugawa mmoja mmoja. Tafsiri huhifadhi uainisho huo, bila kukanusha kwamba mistari inayofuata inataja pia makundi mengine ya kusanyiko.
- issue: Uhusiano wa רָאשֵׁיכֶם na שִׁבְטֵיכֶם
  choice: wakuu wenu, makabila yenu
  alternative: wakuu wa makabila yenu
  rationale: Mpangilio na lafudhi za Kimasora zinaweza kuwakilishwa kama orodha, lakini muunganiko wa kiidioma “wakuu wa makabila yenu” pia unawezekana; tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mpangilio rasmi wa kusanyiko la agano, lakini imetumia “wakuu” badala ya tafsiri ngumu ya kihalisi “vichwa.” Alama za tanbihi zimewekwa mahali zinapohusika moja kwa moja.
