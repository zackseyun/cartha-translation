base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: sw
  text: watoto wenu wadogo[a], wake zenu, na mgeni aliye katikati ya kambi yako[b], kuanzia anayekata kuni zako hadi anayechota maji yako,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wenu.” Neno la Kiebrania טַף humaanisha hasa watoto wadogo au walio chini ya uangalizi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mgeni mkazi aliye katikati yenu.” Neno la Kiebrania גֵּר humaanisha mgeni mkazi anayeishi ndani ya jumuiya, si mtu anayepita tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: watoto wenu wadogo
  rationale: Neno טַף humaanisha hasa watoto wadogo, na wakati mwingine walio chini ya uangalizi; tafsiri hii inadumisha maana yake halisi kuliko neno pana ‘watoto’ pekee.
- source_word: נְשֵׁיכֶם
  choice: wake zenu
  rationale: Katika muktadha wa kusanyiko la agano, maana ya kawaida ya נָשִׁים yenye kiambishi cha umilikaji ni wake.
- source_word: וְגֵרְךָ
  choice: na mgeni anayeishi
  rationale: גֵּר ni mgeni mkazi anayeishi ndani ya jumuiya, si msafiri anayepita tu. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi hali yake ya kijamii.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: anayeishi katikati ya kambi yako
  rationale: Tafsiri hii inawakilisha אֲשֶׁר waziwazi na kuhifadhi taswira ya mahali iliyo katika בְּקֶרֶב, huku ikisomeka kwa kawaida.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: kuanzia anayekata kuni zako
  rationale: מִן pamoja na עַד huonyesha wigo. Umbo la kitenzi ‘anayekata’ linahifadhi nguvu ya hali ya kushiriki ya חֹטֵב; ‘kuni’ ni maana ya kawaida ya עֵץ katika kazi hii.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: hadi anayechota maji yako
  rationale: שֹׁאֵב ni hali ya kushiriki inayomaanisha kuchota maji. ‘Hadi’ inawakilisha עַד katika usemi wa wigo.
theological_decisions:
- issue: Wigo wa kijamii wa kusanyiko la agano
  choice: Orodha inajumuisha watoto wadogo, wake, mgeni mkazi, na wafanyakazi wanaofanya kazi za kawaida.
  alternative: Kuufanya mstari uwahusu Waisraeli wa kikabila pekee, au kuyachukulia makundi ya wafanyakazi kuwa mafumbo tu.
  rationale: Maana ya wazi ya Kiebrania ni orodha pana ya waliokuwapo katika kusanyiko. Tafsiri haipaswi kupunguza wigo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari ni mwendelezo wa sentensi iliyoanza katika aya iliyotangulia, hivyo umeanza kwa herufi ndogo na kuishia kwa koma. Mabadiliko ya umilikaji kutoka wingi (‘wenu’, ‘zenu’) hadi umoja (‘yako’, ‘zako’) yamehifadhiwa kwa sababu yapo katika Kiebrania.
