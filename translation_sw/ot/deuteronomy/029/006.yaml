  text: וַ/תָּבֹ֖אוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יֵּצֵ֣א סִיחֹ֣ן מֶֽלֶךְ חֶ֠שְׁבּוֹן וְ/ע֨וֹג מֶֽלֶךְ הַ/בָּשָׁ֧ן לִ/קְרָאתֵ֛/נוּ לַ/מִּלְחָמָ֖ה וַ/נַּכֵּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: sw
  text: Mlipofika mahali hapa[a], Sihoni mfalme wa Heshboni na Ogu mfalme wa Bashani walitoka kutukabili vitani, nasi tukawapiga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nanyi mkafika mahali hapa.” Muundo wa simulizi wa Kiebrania unaweza kutafsiriwa kama mfululizo rahisi wa matukio au kwa kuonyesha uhusiano wa wakati.
    reason: lexical_alternative
  - marker: b
    text: Au, “tukawashinda.” Kitenzi cha Kiebrania kwa maana halisi ni “tukawapiga,” na mara nyingi hutumiwa kumaanisha kushindwa kwa adui vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: Mlipofika
  rationale: Ni Qal wayyiqtol nafsi ya pili wingi ya בוא. Muundo wa wakati unaunganisha kwa kawaida kufika kwa watu na hatua inayofuata, huku maana ya mfululizo wa matukio ikibaki.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: מָקוֹם ni ‘mahali’; ‘mahali hapa’ ni Kiswahili cha kawaida na cha moja kwa moja katika muktadha huu.
- source_word: וַיֵּצֵא
  choice: walitoka
  rationale: Qal wayyiqtol ya יצא humaanisha kutoka. Wingi umetumiwa kwa sababu wahusika wawili, Sihoni na Ogu, ndio wanaotenda.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihoni mfalme wa Heshboni
  rationale: Majina yameandikwa kwa maumbo yanayotumika kwa kawaida katika Kiswahili cha Biblia, na cheo cha kifalme kimetafsiriwa moja kwa moja.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: na Ogu mfalme wa Bashani
  rationale: Muundo huu unafuatana na kifungu kinachomtaja Sihoni na kuhifadhi ulinganifu wa Kiebrania.
- source_word: לִקְרָאתֵנוּ
  choice: kutukabili
  rationale: Katika muktadha wa kijeshi, לִקְרָאתֵנוּ inaashiria kutoka ili kukutana nasi kwa uhasama. ‘Kutukabili’ ni ya asili na haiongezi wazo la ziada.
- source_word: לַמִּלְחָמָה
  choice: vitani
  rationale: מִלְחָמָה humaanisha vita au mapigano. ‘Vitani’ huonyesha kwa ufupi na kwa kawaida kwamba walitoka ili kupigana.
- source_word: וַנַּכֵּם
  choice: nasi tukawapiga
  rationale: Hiphil wayyiqtol nafsi ya kwanza wingi ya נכה yenye kiambishi cha nafsi ya tatu wingi. ‘Tukawapiga’ huhifadhi taswira halisi ya kupiga na katika muktadha wa vita inaweza kumaanisha kuwashinda.
