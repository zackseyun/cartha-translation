translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Kutukabili vitani’ ni usemi wa asili wa kijeshi; majina Sihoni, Heshboni, Ogu, na Bashani yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili.
