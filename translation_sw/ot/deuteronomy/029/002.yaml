lexical_decisions:
- source_word: הַמַּסּוֹת
  choice: majaribu
  rationale: Katika muktadha huu neno linamaanisha matukio ya kujaribu au kuthibitisha, si kushawishi mtu atende dhambi. “Majaribu” ni neno la kawaida la Kiswahili linaloweza kueleza hali hizo, huku tanbihi ikifafanua maana iliyokusudiwa.
- source_word: הַגְּדֹלֹת
  choice: makubwa
  rationale: Kivumishi hiki kinaonyesha ukubwa na uzito wa majaribu; “makubwa” ni tafsiri ya kawaida na yenye hadhi.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: ambayo macho yako yaliona
  rationale: Muundo huu unahifadhi usemi wa Kiebrania unaosisitiza kwamba wasikilizaji walikuwa mashahidi wa moja kwa moja.
- source_word: הָאֹתֹת
  choice: ishara
  rationale: “Ishara” linaonyesha matendo yaliyokuwa na maana ya kimungu na ni sawa la kawaida la אוֹת katika muktadha huu.
- source_word: וְהַמֹּפְתִים
  choice: na maajabu
  rationale: “Maajabu” linafaa kwa matendo ya ajabu yanayoambatana na “ishara,” bila kufafanua kupita kiasi jinsi yalivyotendeka.
- source_word: הַגְּדֹלִים
  choice: makubwa
  rationale: Neno hili linadumisha msisitizo wa Kiebrania juu ya ukubwa wa ishara na maajabu.
- source_word: הָהֵם
  choice: yale
  rationale: Kiwakilishi hiki cha kuonyesha kinarejelea kwa msisitizo ishara na maajabu yaliyotajwa; “yale” ni cha asili katika Kiswahili kwa nomino hizi za ngeli tofauti zinapounganishwa.
