  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: sw
  text: Lakini Yahwe hajawapa moyo wa kujua[a], wala macho ya kuona, wala masikio ya kusikia, mpaka leo hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Naye Yahwe hajawapa moyo wa kujua, na macho ya kuona, na masikio ya kusikia, mpaka leo hii.”'
    reason: Kiunganishi וְ kinaweza kutafsiriwa kwa uratibu wa kawaida (“naye/na”) badala ya kupewa nguvu ya kupingana (“lakini”); pia marudio ya וְ yanaweza kuhifadhiwa kwa “na” badala ya “wala.”
lexical_decisions:
- source_word: וְלֹא
  choice: Lakini ... haja-
  rationale: Kiunganishi kinaendeleza hotuba huku kikionyesha tofauti na mambo ambayo Israeli alikuwa ameyaona katika muktadha uliotangulia. “Lakini” huleta wazi nguvu hiyo ya kupingana katika Kiswahili cha kawaida.
- source_word: נָתַן
  choice: hajawapa
  rationale: Kauli timilifu ya Kiebrania inaeleza hali iliyotokea na ambayo bado ina umuhimu hadi wakati unaotajwa. Wakati timilifu hasi wa Kiswahili unawasilisha vizuri hali hiyo inayoendelea mpaka “leo hii.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililotumiwa katika matini ya Kiebrania.
- source_word: לֵב לָדַעַת
  choice: moyo wa kujua
  rationale: “Moyo” huhifadhi taswira ya Kiebrania, ambayo inahusu ufahamu na mwelekeo wa ndani, huku “kujua” ikihifadhi maana ya moja kwa moja ya kitenzi ידע bila kuibana kuwa akili pekee.
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: wala macho ya kuona
  rationale: Baada ya kitenzi hasi, “wala” ni uratibu wa asili katika Kiswahili na huonyesha kuwa hata macho ya kuona hayakutolewa. Taswira ya chanzo imehifadhiwa.
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: wala masikio ya kusikia
  rationale: Ulinganifu wa moyo, macho na masikio umehifadhiwa, pamoja na nahau ya kibiblia ya kusikia kwa utambuzi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Hii ni tafsiri ya kawaida na wazi ya muda unaoendelea kufikia siku inayozungumziwa.
theological_decisions:
- issue: Utendaji wa Mungu katika kukosa kwa Israeli ufahamu
  choice: Aya inasema moja kwa moja kwamba Yahwe hajawapa uwezo wa ndani wa kujua, kuona na kusikia mpaka siku hiyo.
  alternative: Kauli hiyo inaweza kueleweka kwa maana ya Mungu kutowawezesha au kutowaruhusu kufikia ufahamu huo, au kama hukumu ya agano inayoeleza hali yao bila kufafanua uwajibikaji wa binadamu.
  rationale: Matini ya Kiebrania inahusisha kutotolewa huko moja kwa moja na Yahwe. Tafsiri haipaswi kuifanya iwe kushindwa kwa binadamu pekee, wala kuingiza ufafanuzi wa kimfumo usiotolewa na aya. Taswira ya moyo, macho na masikio inadumisha mvutano wa kitheolojia uliomo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “moyo wa kujua, macho ya kuona, masikio ya kusikia” umehifadhiwa kwa sababu ni wazi kwa msomaji wa kawaida na unabeba taswira ya chanzo. “Yahwe” limetumiwa kama jina binafsi la Mungu.
