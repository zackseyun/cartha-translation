translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiwakilishi ‘ninyi’ kimetumiwa kwa msisitizo wa wingi uliopo katika muktadha, na badiliko kati ya ‘tulivyo-’ na ‘mli-’ limehifadhiwa kama lilivyo katika Kiebrania.
