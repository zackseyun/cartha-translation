  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: sw
  text: Kwa maana ninyi mnajua jinsi tulivyoishi katika nchi ya Misri, na jinsi tulivyopita katikati ya mataifa mliyopitia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na yale tuliyopitia miongoni mwa mataifa mliyopitia.” Muundo wa Kiebrania unaweza kumaanisha namna walivyopita au mambo waliyokumbana nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa kauli iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְדַעְתֶּם
  choice: ninyi mnajua
  rationale: Kauli timilifu ya Kiebrania hapa inaeleza ujuzi wa sasa unaotokana na mambo ambayo wasikilizaji wameyashuhudia; wakati wa sasa unawasilisha maana hiyo kwa kawaida.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: jinsi tulivyoishi
  rationale: Muundo huu unaelekeza kwenye hali au namna ya maisha waliyoijua wasikilizaji. Tafsiri hii ni ya kawaida kuliko uhamishaji wa neno kwa neno usioeleweka.
- source_word: יָשַׁבְנוּ
  choice: tulivyoishi
  rationale: Kitenzi ישב hapa kina maana ya kukaa au kuishi mahali; ‘kuishi’ linafaa zaidi kwa ukaaji wao nchini Misri.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Inadumisha usemi kamili wa Kiebrania ‘nchi ya Misri’ kwa lugha ya asili ya Kiswahili.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: na jinsi tulivyopita
  rationale: Inawasilisha uzoefu au namna ya kupita bila kuongeza wazo la mateso ambalo halijasemwa wazi; uwezekano wa ‘yale tuliyopitia’ umehifadhiwa katika tanbihi.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: katikati ya mataifa
  rationale: בקרב humaanisha ‘katikati ya’ au ‘miongoni mwa’; pamoja na kitenzi cha mwendo, ‘katikati ya’ huonyesha kupita baina yao.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: גוים hapa ni mataifa au makundi ya watu; ‘mataifa’ huepuka kuingiza matumizi ya baadaye ya kidini ya neno ‘Wamataifa.’
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: ambayo mlipita katikati yao
  rationale: Inahusisha kishazi rejeshi na ‘mataifa’ na kudumisha badiliko la Kiebrania kutoka ‘tulipita’ hadi ‘mlipita,’ huku ikieleweka wazi kwa Kiswahili.
