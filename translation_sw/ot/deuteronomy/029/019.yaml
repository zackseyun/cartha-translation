  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: sw
  text: Yahweh hatakuwa tayari kumsamehe, kwa maana hapo hasira ya Yahweh na wivu wake vitawaka dhidi ya mtu huyo, na kila laana[a] iliyoandikwa katika kitabu hiki itatua juu yake, naye Yahweh atalifuta jina lake kutoka chini ya mbingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila laana ya kiapo”; neno la Kiebrania linaweza kumaanisha laana inayotamkwa katika muktadha wa kiapo cha agano, si laana ya kawaida tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבֶה
  choice: hatakuwa tayari
  rationale: Kitenzi kinaonyesha kutaka au kuwa tayari, si kutokuwa na uwezo; usemi huu unahifadhi nguvu ya hiari.
- source_word: סְלֹחַ לוֹ
  choice: kumsamehe mtu huyo
  rationale: סלח humaanisha kusamehe au kuondolea hatia katika muktadha wa agano; kurejeza 'mtu huyo' huweka marejeo wazi katika Kiswahili.
- source_word: כִּי אָז
  choice: kwa maana ndipo
  rationale: Huhifadhi pamoja maana ya kutoa sababu na ya wakati au matokeo.
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: hasira ya Yahweh ... utakapowaka
  rationale: Nahau ya Kiebrania husema hasira 'itavuta moshi'; 'kuwaka' ni Kiswahili cha kawaida kinachodumisha picha ya hasira kali iliyochochewa bila tafsiri isiyo ya kawaida ya 'moshi'.
- source_word: קִנְאָתוֹ
  choice: wivu wake
  rationale: Katika muktadha wa hukumu ya agano, neno hili linaonyesha wivu wenye bidii wa kudai uaminifu; 'wivu' ndilo chaguo la moja kwa moja na linaloeleweka.
- source_word: בָּאִישׁ הַהוּא
  choice: dhidi yake
  rationale: Kiambishi ב pamoja na hasira kinaeleweka kwa kawaida kama kuelekezwa dhidi ya mtu huyo; kiwakilishi kinazuia urudiaji mzito baada ya kumtaja.
- source_word: וְרָבְצָה בוֹ
  choice: itatua juu yake
  rationale: רבץ kwa msingi ni kulala au kujilaza; 'kutua juu yake' huhifadhi picha ya laana inayomjia na kubaki juu yake.
- source_word: כָּל הָאָלָה
  choice: kila laana
  rationale: Neno אָלָה hapa ni laana katika mazingira ya kiapo cha agano; maana hiyo ya ziada imewekwa katika tanbihi.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: iliyoandikwa katika kitabu hiki
  rationale: סֵפֶר inaweza kuwa kitabu au hati-kunjo; 'kitabu' ni Kiswahili cha sasa kinachofaa muktadha huu.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: atalifuta jina lake
  rationale: Huhifadhi nahau ya kufuta jina, inayodokeza kuondoa kumbukumbu au uzao wa mtu.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: kutoka chini ya mbingu
  rationale: Huhifadhi usemi wa kawaida wa Kiebrania kuhusu kuondolewa duniani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Taswira ya kibinadamu ya hukumu
  choice: Kutafsiri hasira na wivu wa Yahweh kuwa 'utakapowaka.'
  alternative: Hasira ya Yahweh na wivu wake 'utakapotoa moshi.'
  rationale: Kiebrania kina taswira hai ya hasira inayotoa moshi. 'Kuwaka' huwasilisha kwa Kiswahili cha kawaida ukali na kuchochewa kwa hasira bila kuongeza nadharia kuhusu hisia za Mungu.
- issue: Rejeo la umoja wa kiume
  choice: Kumrejelea 'mtu huyo' na baadaye 'yake.'
  alternative: Kumrejelea kwa lugha isiyoonyesha jinsia pekee.
  rationale: הָאִישׁ הַהוּא ni umoja wa kiume na katika muktadha humrejelea mvunja-agano mmoja; tafsiri haifuti umbo hilo.
- issue: Istilahi ya laana ya agano
  choice: Kutumia 'kila laana' katika matini na kueleza maana ya kiapo katika tanbihi.
  alternative: Kila laana ya kiapo.
  rationale: '''Laana'' inaeleweka kwa urahisi, huku tanbihi ikihifadhi maana rasmi ya kiapo cha agano bila kuifanya sentensi kuu kuwa nzito.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi uzito wa onyo la agano, jina Yahweh, na taswira za hasira, laana inayotua, na jina kufutwa.
