lexical_decisions:
- source_word: וְלֹא
  choice: Wala si
  rationale: Muundo huu unahifadhi kiunganishi na ukanushi wa Kiebrania, huku ukionyesha kwa Kiswahili fasaha utofautishaji na maneno yanayotangulia.
- source_word: אִתְּכֶם לְבַדְּכֶם
  choice: pamoja nanyi peke yenu
  rationale: Kirai hiki kinaonyesha kwamba wale waliokuwapo hawakuwa wao tu waliohusishwa; ‘peke yenu’ huhifadhi maana ya upekee.
- source_word: אָנֹכִי כֹּרֵת
  choice: ninafanya
  rationale: Kitenzi cha Kiebrania kwa maana halisi ni ‘ninakata,’ lakini ‘kufanya agano’ ndiyo nahau ya kawaida na ya wazi katika Kiswahili. Wakati wa sasa unaendeleza thamani ya umbo la participle katika muktadha.
- source_word: הַבְּרִית הַזֹּאת
  choice: agano hili
  rationale: ‘Agano’ huhifadhi uzito wa kisheria na kitheolojia wa בְּרִית katika Kumbukumbu la Torati.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: na kiapo hiki
  rationale: אָלָה inaweza kumaanisha kiapo chenye adhabu ya laana. ‘Kiapo’ kinafaa katika matini kuu, huku ‘laana’ ikihifadhiwa kama maana mbadala katika tanbihi.
theological_decisions:
- issue: Maana ya אָלָה katika muktadha wa agano
  choice: kiapo
  alternative: laana
  rationale: Neno hili linaweza kuelekeza kwenye kiapo cha kuthibitisha agano au kwenye laana inayofungamana na kukivunja. Matini kuu inatumia ‘kiapo,’ lakini tanbihi inahifadhi ‘laana’ ili kutokuondoa mvutano huo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. Mpangilio wa Kiebrania umehifadhiwa kadiri inavyowezekana bila kufanya sentensi kuwa ngumu; ‘pamoja nanyi peke yenu’ husisitiza upekee wa hadhira iliyopo.
