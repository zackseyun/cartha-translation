  text: Wala mimi sifanyi agano hili[a] na kiapo hiki[b] nanyi peke yenu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kiebrania husema, “ninakata agano hili”; “ninafanya agano hili” ni namna ya kawaida ya kuwasilisha nahau hiyo kwa Kiswahili.
