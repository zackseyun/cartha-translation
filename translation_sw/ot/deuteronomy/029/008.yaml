  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: sw
  text: Kwa hiyo, yashikeni maneno ya agano hili na kuyatenda, ili mtende kwa hekima katika yote mnayofanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili mfanikiwe katika yote mnayofanya.”
    reason: Neno תַּשְׂכִּילוּ linaweza kumaanisha kutenda kwa hekima au kufanikiwa.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kwa hiyo, yashikeni
  rationale: Kitenzi שׁמר katika muktadha wa agano humaanisha kushika au kutii masharti. “Yashikeni” ni lugha ya kawaida ya kibiblia ya Kiswahili na inadumisha nguvu ya agano; “Kwa hiyo” linaonyesha uhusiano wa kimantiki na yaliyotangulia.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: maneno ya agano hili
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania bila kubadili “maneno” kuwa ufafanuzi finyu zaidi kama “masharti.”
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: na kuyatenda
  rationale: Kiambishi cha ngeli katika “kuyatenda” kinarejelea “maneno” yaliyo katika wingi, kama kiwakilishi cha wingi אֹתָם katika Kiebrania. Usemi huu unaonyesha kuyaweka maneno hayo katika matendo.
- source_word: לְמַעַן
  choice: ili
  rationale: “Ili” linaonyesha kusudi au matokeo kwa lugha ya kawaida na fasaha ya Kiswahili.
- source_word: תַּשְׂכִּילוּ
  choice: mtende kwa hekima
  rationale: Hifili ya שׂכל inaweza kumaanisha kutenda kwa hekima na pia kufanikiwa kutokana na mwenendo huo. Maandishi makuu yanadumisha moja kwa moja wazo la kutenda kwa hekima, huku maana ya kufanikiwa ikihifadhiwa katika tanbihi.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: katika yote mnayofanya
  rationale: Usemi huu wa asili unaonyesha eneo lote la matendo yao; tafsiri ya Kiswahili inadumisha maana pana ya כָּל.
theological_decisions:
- issue: Uhusiano kati ya hekima na mafanikio katika תַּשְׂכִּילוּ
  choice: mtende kwa hekima
  alternative: mfanikiwe
  rationale: Neno la Kiebrania linaweza kuelekeza ama kwenye mwenendo wa hekima ama kwenye mafanikio yanayotokana nao. Tafsiri kuu haifanyi ahadi hii kuwa fundisho pana la mafanikio ya mali, na tanbihi inadumisha maana mbadala halisi ya neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yashikeni” na “kuyatenda” yanadumisha lugha ya agano na urejeo wa wingi wa “maneno,” huku sentensi ikibaki wazi kwa msomaji wa kawaida.
