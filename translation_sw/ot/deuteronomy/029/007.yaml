translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida na kinachoeleweka. Muundo wa simulizi ‘Nasi tuka-’ unaendeleza mfuatano wa matendo, huku majina ya makabila yakitolewa kwa namna ya asili katika Kiswahili.
