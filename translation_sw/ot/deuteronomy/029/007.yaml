  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: sw
  text: Nasi tukaichukua nchi yao na tukawapa nchi hiyo kuwa urithi kwa Wareubeni, Wagadi, na nusu ya kabila la Manase.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: tukaichukua
  rationale: Kitenzi לקח katika simulizi kina maana ya kawaida ya ‘kuchukua.’ Kiambishi -i- kinarejelea ‘nchi’; ‘kuteka’ kingesisitiza zaidi muktadha wa vita kuliko kitenzi chenyewe.
- source_word: אַרְצָם
  choice: nchi yao
  rationale: אֶרֶץ hapa ni eneo lililokuwa la wafalme walioshindwa; ‘nchi yao’ ni tafsiri ya kawaida na iliyo wazi katika muktadha wa eneo.
- source_word: וַנִּתְּנָהּ
  choice: na kuwapa
  rationale: נתן ni ‘kutoa/kupa.’ Kiswahili cha kawaida humtaja mpokeaji kwa kiambishi -wa-; kitu kinachotolewa, yaani nchi, kinaeleweka kutokana na sentensi. Hii huepuka muundo mzito wa ‘tukaitoa kwao.’
- source_word: לְנַחֲלָה
  choice: iwe urithi
  rationale: נַחֲלָה ni milki inayorithiwa au mgao wa urithi, hasa kuhusu ugawaji wa nchi. ‘Iwe urithi’ huhifadhi wazo hilo kwa Kiswahili cha kawaida.
- source_word: לָראוּבֵנִי
  choice: watu wa kabila la Reubeni
  rationale: Nomino ya kabila katika umoja inatumika kwa maana ya kundi. Kiswahili hutumia kwa kawaida ‘watu wa kabila la Reubeni’ ili kuonyesha maana hiyo ya kijumla bila utata.
- source_word: וְלַגָּדִי
  choice: watu wa kabila la Gadi
  rationale: Kama ilivyo kwa Reubeni, umbo la jina la mtu wa kabila lina maana ya kijumla; ‘watu wa kabila la Gadi’ ni la kawaida na wazi.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: nusu ya kabila la Manase
  rationale: חֲצִי שֵׁבֶט ni ‘nusu ya kabila.’ Ingawa הַמְנַשִּׁי ni umbo la jina la mtu wa Manase, Kiswahili cha kawaida hutaja kabila kwa jina ‘Manase.’
