base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: sw
  text: Basi Yahweh akawang’oa kutoka nchi yao kwa hasira[a], kwa ghadhabu, na kwa ghadhabu kuu, akawatupa katika nchi nyingine, kama ilivyo leo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawang’oa kutoka katika nchi yao.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama siku hii,” nahau yenye maana ya “kama ilivyo leo” au “kama inavyoonekana leo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: akawang’oa
  rationale: Kitenzi נתשׁ huonyesha kung’oa au kuondoa kwa nguvu. “Akawang’oa” kinahifadhi taswira ya watu kung’olewa kutoka katika nchi yao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: מֵעַל אַדְמָתָם
  choice: katika nchi yao
  rationale: Ingawa muundo wa Kiebrania ni karibu na “kutoka juu ya ardhi yao,” katika muktadha wa agano na uhamisho, “katika nchi yao” ni Kiswahili cha kawaida kinachoeleza kuondolewa kwao humo.
- source_word: בְּאַף
  choice: kwa hasira
  rationale: אַף maana yake ya msingi ni pua, lakini hapa ni nahau ya hasira. “Kwa hasira” huwasilisha maana yake ya kimuktadha.
- source_word: וּבְחֵמָה
  choice: kwa ghadhabu kali
  rationale: חֵמָה huashiria ghadhabu inayowaka au kali. Usemi huu unatofautisha neno hilo na maneno mengine ya hasira katika mlolongo.
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: na kwa ukali mwingi
  rationale: קֶצֶף ni ghadhabu au ukali, na גָּדוֹל huongeza ukubwa wake. “Ukali mwingi” huhifadhi kilele cha mlolongo bila kurudia neno lilelile.
- source_word: וַיַּשְׁלִכֵם
  choice: akawatupa
  rationale: שלך maana yake ni kutupa. “Akawatupa” ni ya moja kwa moja na huhifadhi nguvu ya hukumu iliyo katika kitenzi.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: katika nchi nyingine
  rationale: Kirai hiki kinaonyesha kupelekwa uhamishoni ndani ya nchi tofauti.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Hii ni nahau inayoelekeza kwenye hali inayoonekana wakati wa msemaji; tafsiri hii ni ya kawaida huku ikihifadhi rejeo la siku ya sasa.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi kwa kulitohowa.
- issue: Mkusanyiko wa maneno ya ghadhabu
  choice: kwa hasira, kwa ghadhabu kali, na kwa ukali mwingi
  alternative: kwa hasira, ghadhabu, na hasira kuu
  rationale: Kiebrania kinakusanya maneno matatu yanayokaribiana ili kusisitiza hukumu. Tafsiri inadumisha mkusanyiko huo badala ya kuyafanya kuwa wazo moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya kung’olewa, nguvu ya kutupwa uhamishoni, na mlolongo wa maneno ya ghadhabu vimehifadhiwa.
