base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: sw
  text: BWANA, Mungu wako, atakuinulia nabii kama mimi kutoka miongoni mwako[a], kutoka kwa ndugu zako. Mtamsikiliza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katikati yako, yaani, kutoka kwa Waisraeli wenzako.” Neno la Kiebrania lililotafsiriwa “ndugu” ni la wingi wa kiume, lakini hapa linawarejelea Waisraeli kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Agano Jipya baadaye hutumia mstari huu kumhusu Masihi; hata hivyo, Kiebrania hapa husema tu “nabii kama mimi.”
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: nabii
  rationale: Neno hili humaanisha mtu anayesema kwa niaba ya Mungu. Kiswahili hakihitaji kibainishi cha kutotambulisha ili kudumisha umoja usiotajwa kwa jina.
- source_word: מִקִּרְבְּךָ
  choice: kutoka katikati yako
  rationale: Huhifadhi maana halisi ya kwamba nabii huyo atatoka ndani ya jumuiya ya Israeli, si kutoka nje.
- source_word: מֵאַחֶיךָ
  choice: kutoka kwa ndugu zako
  rationale: Huhifadhi istilahi ya Kiebrania ya undugu iliyo katika wingi wa kiume; katika muktadha huu inawahusu Waisraeli wenzake kwa ujumla.
- source_word: כָּמֹנִי
  choice: kama mimi
  rationale: Hutoa kwa uwazi ulinganisho wa moja kwa moja na Musa bila kuongeza utambulisho ambao mstari wenyewe hautaji.
- source_word: יָקִים לְךָ
  choice: atakuinulia
  rationale: Kitenzi cha Hiphil cha קום hapa kina maana ya kumleta au kumweka mtu kwa kusudi fulani; ‘atakuinulia’ huhifadhi taswira ya chanzo na maana ya kwamba anainuliwa kwa ajili ya Israeli.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: ‘Yahwe’ linawakilisha jina la agano יהוה badala ya kulibadilisha kuwa cheo; kirai chote ni cha kawaida na kinachoeleweka katika Kiswahili.
- source_word: אֵלָיו תִּשְׁמָעוּן
  choice: Ni yeye mtakayemsikiliza
  rationale: Muundo huu wa Kiswahili huonyesha msisitizo wa ‘yeye’ na nguvu ya wajibu ya kitenzi, huku ‘kusikiliza’ ikihifadhi uwezekano wa maana ya kusikia kwa makini na kutii bila kuibana kuwa ‘kutii’ pekee.
theological_decisions:
- issue: Je, ‘nabii kama mimi’ itafsiriwe kwa umahususi wa Kimasihi?
  choice: Maandishi makuu yanabaki na ‘nabii kama mimi,’ bila kuongeza cheo au utambulisho wa Kimasihi.
  alternative: ‘yule Nabii’ au tafsiri inayomtaja Masihi moja kwa moja
  rationale: Kiebrania chenyewe hakina kibainishi kinachomaanisha ‘yule Nabii’ wala hakimtaji Masihi moja kwa moja. Tafsiri inadumisha usemi wa mstari, huku matumizi yake ya baadaye katika Agano Jipya yakielezwa katika tanbihi.
- issue: Maana wakilishi ya ‘ndugu’
  choice: Kutumia ‘ndugu zako’ katika maandishi makuu na kufafanua maana ya kijumuiya katika tanbihi.
  alternative: ‘Waisraeli wenzako’
  rationale: ‘Ndugu zako’ huakisi neno la undugu la Kiebrania na pia ni la kawaida katika Kiswahili; tanbihi huondoa uwezekano wa kulielewa kuwa ndugu wa familia moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa kuwa wa kawaida katika Kiswahili huku ukidumisha umoja wa ‘wako/yako’ unaomwelekea Israeli kama jumuiya na wingi wa ‘mtakayemsikiliza’ unaowaelekea watu. ‘Ni yeye’ huleta msisitizo wa אֵלָיו bila kufanya sentensi kuwa ngumu.
