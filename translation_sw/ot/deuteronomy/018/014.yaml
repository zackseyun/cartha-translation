source:
  edition: WLC
  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: sw
  text: Kwa maana mataifa haya ambayo unayanyang’anya nchi yao[a] huwasikiliza watabiri wa ishara[b] na wapiga ramli; lakini wewe, Yahweh, Mungu wako, hakukupa jambo kama hilo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unayoyafukuza” au “unayoyatwaa kuwa milki yako.” Kitenzi cha Kiebrania kinaweza kujumuisha kutwaa nchi na kuwanyang’anya waliokuwa wakiimiliki.
    reason: lexical_alternative
  - marker: b
    text: “Watabiri wa ishara” ni watu waliotafuta au kufasiri ishara ili kutabiri mambo.
    reason: cultural_note
  - marker: c
    text: 'Kiebrania kihalisi: “lakini wewe, si hivyo alivyokupa Yahweh, Mungu wako.” Kinachotolewa hakitajwi wazi; “jambo kama hilo” hurejelea desturi hizo za uaguzi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kwamba mstari huu unatoa sababu au maelezo ya makatazo yaliyotangulia.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: mataifa haya
  rationale: Ni tafsiri ya kawaida na iliyo wazi kwa makundi yasiyo ya Israeli yanayotajwa katika muktadha.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אוֹתָם
  choice: unayoyamiliki kwa kuwanyang’anya wenyeji
  rationale: Kitenzi ירשׁ hapa kinahusisha kutwaa milki pamoja na kuwaondoa waliokuwa wakiimiliki; usemi huu unaweka pande zote mbili wazi bila kukifanya kuwa urithi wa kawaida.
- source_word: אֶל מְעֹנְנִים
  choice: huwasikiliza watabiri wa ishara
  rationale: מְעֹנְנִים ni watu wanaotafuta au kufasiri ishara za kutabiri; tafsiri hii ni ya sasa na inaeleweka kuliko istilahi adimu.
- source_word: וְאֶל קֹסְמִים
  choice: na wapiga ramli
  rationale: קֹסְמִים ni watendaji wa uaguzi; ‘wapiga ramli’ ni usemi wa kawaida wa Kiswahili unaotofautisha kundi hili na watabiri wa ishara.
- source_word: יִשְׁמָעוּ
  choice: huwasikiliza
  rationale: Inahifadhi maana ya msingi ya ‘kusikia/kusikiliza’ na hapa inadokeza kuyafuata kwa makini maneno yao.
- source_word: וְאַתָּה לֹא כֵן
  choice: lakini wewe ... si hivyo
  rationale: Kiebrania kina usemi wa mkato unaosisitiza tofauti kati ya mataifa hayo na Israeli; wazo la ‘hivyo’ linaendelezwa katika kishazi kinachofuata.
- source_word: נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako hakukupa kufanya hivyo
  rationale: ‘Hakukupa’ huhifadhi kitenzi נתן, huku ‘kufanya hivyo’ kikikamilisha sentensi ya Kiswahili kwa kurejelea desturi zilizotajwa bila kuigeuza moja kwa moja kuwa ‘hakukuruhusu.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Yambwa iliyodokezwa baada ya ‘hakukupa’
  choice: hakukupa kufanya hivyo
  alternative: hakukuruhusu kufanya hivyo
  rationale: Kiebrania hakitaji yambwa wazi. Tafsiri iliyochaguliwa inahifadhi kitenzi ‘kutoa’ na kukamilisha maana kwa kurejelea matendo yaliyotangulia, bila kuifanya kauli kuwa fomula ya ruhusa pekee.
- issue: Uhusiano kati ya kutwaa nchi na kuwanyang’anya wenyeji
  choice: unayoyamiliki kwa kuwanyang’anya wenyeji
  alternative: unayoyafukuza / unayoyamiliki
  rationale: ירשׁ inaweza kuangazia kutwaa milki au kuwanyang’anya waliotangulia; tafsiri kuu inaonyesha mvutano huo badala ya kuchagua upande mmoja kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Watabiri wa ishara’ na ‘wapiga ramli’ hutofautisha maneno mawili ya Kiebrania bila kutumia istilahi za kitaalamu zisizozoeleka. Alama zote za tanbihi zimewekwa katika matini kuu.
