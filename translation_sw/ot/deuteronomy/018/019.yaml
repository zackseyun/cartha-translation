  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: sw
  text: Na mtu ambaye hatasikiliza maneno yangu atakayoyasema nabii huyo kwa jina langu, mimi mwenyewe nitamdai hesabu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mimi mwenyewe nitadai kutoka kwake.” Kiebrania husema kihalisi, “nitadai kutoka kwake”; yambwa haijatajwa wazi, ikimaanisha kwamba Mungu atamwajibisha kwa kukataa kuyasikiliza maneno ya nabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Na
  rationale: Huendeleza matokeo ya ahadi iliyotangulia kwa Kiswahili cha kawaida bila kuongeza kifungu kizito kama ‘itakuwa kwamba’.
- source_word: הָאִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume katika umoja, hapa ina maana wakilishi ya mtu yeyote; ‘mtu’ ni sahihi na ya kawaida katika Kiswahili.
- source_word: לֹא יִשְׁמַע אֶל
  choice: hatayasikiliza
  rationale: ‘Kusikiliza’ huhifadhi wazo la kusikia pamoja na kuitikia, bila kulifafanua moja kwa moja kuwa ‘kutii’.
- source_word: דְּבָרַי
  choice: maneno yangu
  rationale: Huhifadhi wingi na usemi wa Mungu wa nafsi ya kwanza.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: ambayo nabii huyo atasema
  rationale: Kiima cha kitenzi ni nabii aliyeahidiwa katika muktadha uliotangulia; kukitaja huzuia utata usio wa asili katika Kiswahili.
- source_word: בִּשְׁמִי
  choice: kwa jina langu
  rationale: Ni nahau ya kawaida ya kibiblia inayohifadhi maana ya kusema kwa mamlaka na uwakilishi wa Mungu.
- source_word: אָנֹכִי
  choice: mimi mwenyewe
  rationale: Huwasilisha mkazo wa kiwakilishi huru cha Kiebrania.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: nitamdai hesabu
  rationale: Huwasilisha uwajibikaji wa kimahakama kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi umbo la karibu zaidi na Kiebrania.
theological_decisions:
- issue: Aina ya hatua ya Mungu dhidi ya anayekataa maneno ya nabii
  choice: mimi mwenyewe nitamdai hesabu
  alternative: mimi mwenyewe nitakitaka kutoka kwake
  rationale: Tafsiri inaonyesha kwamba Mungu atamwajibisha mtu huyo bila kubainisha aina au kiwango cha adhabu ambacho maandishi yenyewe hayakitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na ya kinabii-kisheria; ‘nabii huyo’ hutegemea muktadha wa mstari uliotangulia na kufanya marejeo ya kiwakilishi yawe wazi.
