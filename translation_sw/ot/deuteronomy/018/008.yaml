  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: sw
  text: Watakula sehemu sawa[a], mbali na mapato yake kutokana na kuuza mali ya urithi wa familia yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbali na kile anachopokea kwa kuuza mali za familia”; Kiebrania cha kirai cha mwisho ni kigumu, na huenda kinarejelea kwa ujumla zaidi mapato yanayohusiana na nyumba ya mababu zake.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: mafungu yaliyo sawa
  rationale: Kirai hiki kwa namna ya nahau humaanisha fungu kama fungu, yaani mafungu sawa. 'Mafungu yaliyo sawa' kinaeleza wazi usawa wa mgao.
- source_word: יֹאכֵלוּ
  choice: watakula
  rationale: Kitenzi hiki humaanisha moja kwa moja 'kula' na hapa kinahusu kutumia riziki waliyogawiwa makuhani. Tafsiri ya moja kwa moja inadumisha taswira halisi ya Kiebrania.
- source_word: לְבַד
  choice: mbali na
  rationale: Neno hili huonyesha kitu kilicho tofauti na au cha nyongeza kwa kile kilichotajwa; 'mbali na' ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: מִמְכָּרָיו
  choice: kile anachopata kwa kuuza
  rationale: Neno linaweza kutaja mauzo au mapato ya mauzo. Usemi huu unaonyesha maana inayowezekana bila kuibana iwe fedha pekee.
- source_word: עַל הָאָבוֹת
  choice: mali ya urithi wa familia yake
  rationale: Kirai hiki kihalisi kinahusiana na 'mababa' lakini ni kifupi na kigumu kisintaksia. Katika muktadha huu huenda kinarejelea mali au haki zinazotokana na ukoo wa mtu.
theological_decisions:
- issue: Maana ya kirai cha mwisho מִמְכָּרָיו עַל הָאָבוֹת
  choice: Kinarejelea mapato ya pekee yanayotokana na kuuza mali ya urithi wa familia, ambayo ni nyongeza kwa fungu sawa la huduma ya ukuhani.
  alternative: Huenda kikamaanisha kile anachopokea kwa kuuza mali za familia, mapato yanayohusiana kwa ujumla na nyumba ya mababu zake, au haki alizo nazo kwa mujibu wa jamaa za mababu.
  rationale: Kiebrania cha sehemu hii kimebanwa na kinaweza kufasiriwa kwa njia kadhaa. Tafsiri kuu inatoa maana inayolingana vizuri na muktadha, huku tanbihi ikihifadhi kutokuwa na uhakika kwa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mafungu yaliyo sawa' ni wazi kwa wasomaji wa kawaida; 'mali ya urithi wa familia' inaeleweka zaidi kuliko istilahi ya kitaalamu kama 'mali ya ukoo,' huku tanbihi ikihifadhi utata wa Kiebrania.
