  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י הֵיטִ֖יבוּ אֲשֶׁ֥ר דִּבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: sw
  text: Kisha Yahweh akaniambia, “Wamesema vizuri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akaniambia
  rationale: Wayyiqtol ya אמר inaendeleza mfululizo wa simulizi. “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, na “akaniambia” huwakilisha kwa kawaida kusema kuelekezwa kwa msemaji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: אֵלָי
  choice: -ni- katika “akaniambia”
  rationale: Kihusishi אֶל pamoja na kiambishi cha nafsi ya kwanza umoja maana yake ni “kwangu”; katika Kiswahili maana hiyo huwasilishwa kwa kawaida na kiambishi yambwa “-ni-” katika “akaniambia.”
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: Wamesema vizuri
  rationale: Kifungu hicho kwa muundo wa karibu zaidi ni “wamefanya vizuri walichosema,” lakini hapa הֵיטִיבוּ hutathmini usemi wao. “Wamesema vizuri” ni Kiswahili cha asili kinachohifadhi pongezi hiyo bila kufanya sentensi kuwa ngumu.
- source_word: דִּבֵּרוּ
  choice: wamesema
  rationale: Piel timilifu ya דבר inaonyesha tendo la kusema lililokamilika; “wamesema” linafaa katika muktadha huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo, huku “Yehova” likiwa umbo jingine la jadi la unukuzi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa kawaida kwa simulizi. Hakuna tanbihi iliyoongezwa kwa sababu tanbihi ya Kiingereza iliyopewa haipatani na mahali pa alama [a] katika matini yake: alama iko baada ya “to me,” lakini maelezo yanahusu kifungu “They have spoken well.”'
