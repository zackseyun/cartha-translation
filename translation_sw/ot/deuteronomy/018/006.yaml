source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: sw
  text: Na ikiwa Mlawi atatoka katika mojawapo ya miji yako, kutoka mahali popote katika Israeli[a], ambako anaishi kama mgeni, naye akaja kwa hamu yote ya nafsi yake[b] mahali atakapochagua Yahweh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “kutoka katika mojawapo ya malango yako, kutoka Israeli yote.” Hapa “malango” yanawakilisha miji au makazi ya raia.
    reason: cultural_note
  - marker: b
    text: Au, “kwa tamanio lote la nafsi yake” / “kwa hamu yote ya moyo wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Inaendeleza sheria iliyotangulia na kuanzisha hali ya masharti kwa Kiswahili cha kawaida.
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Nomino ya pekee yenye aina ya jumla katika sheria; Kiswahili hakihitaji kibainishi kinacholingana na 'the'.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: katika mojawapo ya miji yako
  rationale: Neno 'malango' linatumika kimetonimia kumaanisha miji au makazi; 'miji' huwasilisha maana hiyo kwa uwazi katika Kiswahili cha sasa.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: kutoka mahali popote katika Israeli
  rationale: Huwasilisha maana ya mgawanyo—kutoka eneo lolote ndani ya Israeli—bila Kiswahili kisicho cha kawaida cha tafsiri ya neno kwa neno.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: ambako anaishi kama mgeni
  rationale: Kitenzi גור kinaashiria kukaa kama mgeni au mtu asiye na makazi ya urithi; tafsiri hii huhifadhi wazo hilo bila kumfanya awe mgeni wa taifa jingine.
- source_word: וּבָא
  choice: naye akaja
  rationale: Huhifadhi kurudiwa kwa kitenzi cha kuja na kuonyesha hatua inayofuata katika sharti.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: kwa shauku yote ya nafsi yake
  rationale: Huhifadhi uzito wa hamu kamili ya ndani na neno נֶפֶשׁ, huku ikibaki wazi kwa msomaji wa kawaida.
- source_word: אֶל הַמָּקוֹם
  choice: mahali
  rationale: Chanzo kinasema tu 'mahali'; hakiongezi wazi 'patakatifu' au 'mahali pa ibada'.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: atakapochagua Yahweh
  rationale: Wakati wa baadaye unalingana na יִבְחַר, na jina la agano יְהוָה limetolewa kama 'Yahweh'.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; 'Yahweh' huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa 'mahali'
  choice: mahali
  alternative: mahali pa ibada / patakatifu
  rationale: Ingawa muktadha unahusu kituo cha ibada kitakachochaguliwa, mstari wenyewe unasema tu 'mahali'; tafsiri haipaswi kufanya maana iliyodokezwa kuwa ya wazi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa sasa. Muundo wa kisharti na marudio ya kuja yamehifadhiwa; metonimia ya 'malango' imewasilishwa kwa maana yake katika matini kuu na kufafanuliwa katika tanbihi.
