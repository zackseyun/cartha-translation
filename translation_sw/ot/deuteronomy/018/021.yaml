source:
  edition: WLC
  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: sw
  text: Nawe ukisema moyoni mwako, “Tutajuaje neno[a] ambalo Yahwe hakulinena?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujumbe” au “jambo.” Neno la Kiebrania davar linaweza kumaanisha neno, ujumbe, au jambo; katika muktadha huu wa unabii, “neno” linafaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Nawe ukisema
  rationale: Muunganiko huu unaendeleza hoja ya muktadha na kuanzisha hali inayowezekana. Kiswahili ‘Nawe ukisema’ ni cha kawaida na kinadumisha uhusiano huo bila kuongeza maana ya upinzani.
- source_word: תֹאמַר
  choice: ukisema
  rationale: Kitenzi hiki cha nafsi ya pili umoja wa kiume kinamwelekeza moja kwa moja Mwisraeli anayewakilisha wasikilizaji; muundo wa ‘uki-’ unafaa katika kishazi cha sharti.
- source_word: בִּלְבָבֶךָ
  choice: moyoni mwako
  rationale: Hifadhi taswira ya Kiebrania ya moyo kuwa kitovu cha mawazo ya ndani; ni nahau ya Kiswahili inayoeleweka bila kuibadili kuwa ‘akilini’ au ‘kimoyomoyo.’
- source_word: אֵיכָה נֵדַע
  choice: Tutajuaje
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida swali la kutaka kujua njia ya kutambua jambo, huku ukihifadhi wingi wa nafsi ya kwanza.
- source_word: הַדָּבָר
  choice: neno
  rationale: Katika muktadha wa unabii, דָּבָר hasa ni tamko au ujumbe unaodaiwa kutoka kwa Mungu. ‘Neno’ linafaa zaidi, huku uwezekano mpana wa ‘ujumbe’ au ‘jambo’ ukitajwa katika tanbihi.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: ambalo ... hakulinena
  rationale: Kishazi hiki kinarekebisha ‘neno’ na kuuliza ikiwa Yahwe ndiye aliyelitamka. ‘Kulinena’ ni lugha yenye hadhi na ya sasa inayofaa kwa tamko la kinabii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo kama ‘BWANA.’
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu wa agano katika maandishi ya chanzo bila kulibadilisha kuwa cheo; tahajia hii inafuata matamshi ya kawaida ya Kiswahili.
- issue: Maana ya הַדָּבָר katika muktadha wa unabii
  choice: neno
  alternative: ujumbe au jambo
  rationale: ‘Neno’ linaacha wazi upana wa neno la Kiebrania lakini hapa linaeleweka kuwa tamko la kinabii. Tanbihi inahifadhi maana nyingine zinazowezekana bila kuzilazimisha katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha asili na chenye hadhi. Muundo ‘moyoni mwako’ umehifadhi nahau ya chanzo, na ‘Tutajuaje’ hutoa swali la moja kwa moja kwa lugha inayoeleweka kwa urahisi.
