base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: sw
  text: 'Hili ndilo fungu ambalo makuhani wana haki ya kulipokea kutoka kwa watu, yaani kutoka kwa wale wanaotoa dhabihu[a]: iwe ni ng’ombe au kondoo, mtu huyo atampa kuhani bega[b], mashavu mawili[c], na tumbo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarudia mzizi uleule wa neno la dhabihu kwa msisitizo; kwa tafsiri ya karibu kabisa, “wale wanaochinja dhabihu.”
    reason: lexical_alternative
  - marker: b
    text: Neno linalotafsiriwa “bega” maana yake ya msingi ni “mkono”; hapa linamaanisha mguu wa mbele au sehemu ya bega la mnyama.
    reason: lexical_alternative
  - marker: c
    text: Au “mataya mawili.” Umbo la neno la Kiebrania linaonyesha vitu viwili.
    reason: lexical_alternative
  - marker: d
    text: Kwa mapokeo mengine, “sehemu ya ndani ya tumbo.” Neno la Kiebrania humaanisha tumbo la mnyama, lakini sehemu hususa inayokusudiwa imefafanuliwa kwa njia tofauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: fungu ambalo makuhani wana haki ya kulipokea
  rationale: Katika muktadha huu wa sheria na ibada, neno hili linaonyesha sehemu iliyowekwa kuwa haki ya makuhani, si hukumu kwa maana ya kawaida. Kauli hii ni ya asili katika Kiswahili na inaweka wazi kuwa ni fungu linalowastahili.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Wingi wa Kiebrania umehifadhiwa; uhusiano na fungu unaonyeshwa kwa kauli ya Kiswahili ‘fungu ambalo makuhani wana haki ya kulipokea.’
- source_word: מֵאֵת הָעָם
  choice: kutoka kwa watu
  rationale: Hii inafuata maana ya moja kwa moja ya Kiebrania bila kuongeza utambulisho ambao haukutajwa wazi katika kirai hiki.
- source_word: מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: kutoka kwa wale wanaotoa dhabihu
  rationale: Kauli hii ni ya kawaida na inayoeleweka katika Kiswahili. Urudiaji wa mzizi wa Kiebrania umeelezwa katika tanbihi kwa kuwa kuurudia moja kwa moja kungeleta Kiswahili kisicho cha asili.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: iwe ni ng’ombe au kondoo
  rationale: Inawakilisha aina mbili za mnyama zilizotajwa na kudumisha muundo wa uchaguzi wa Kiebrania. ‘Ng’ombe’ ni neno la kawaida kwa שׁוֹר katika muktadha huu; ‘kondoo’ ni tafsiri rahisi na ya kawaida ya שֶׂה hapa.
- source_word: וְנָתַן
  choice: mtu huyo atampa
  rationale: Kitenzi cha Kiebrania ni umoja na kinamhusu kila mtoa dhabihu mmoja mmoja. ‘Mtu huyo’ huondoa utata wa kiwakilishi katika Kiswahili huku ikihifadhi umoja huo.
- source_word: לַכֹּהֵן
  choice: kuhani
  rationale: Umoja wa Kiebrania umehifadhiwa. Katika Kiswahili, ‘atampa kuhani’ hutoa maana ya kuhani anayepokea fungu hilo bila kulazimisha matumizi ya kiashiria kisicho cha lazima.
- source_word: הַזְּרֹעַ
  choice: bega
  rationale: Ingawa maana ya msingi ni ‘mkono,’ katika anatomia ya mnyama na ugawaji wa nyama ya dhabihu neno hili humaanisha sehemu ya mguu wa mbele au bega. ‘Bega’ ni wazi kwa msomaji wa kawaida.
- source_word: הַלְּחָיַיִם
  choice: mashavu mawili
  rationale: Umbo la Kiebrania ni la jozi; ‘mawili’ linaonyesha wazi idadi hiyo. Neno linaweza pia kueleweka kuwa mataya, jambo lililoonyeshwa katika tanbihi.
- source_word: הַקֵּבָה
  choice: tumbo
  rationale: Neno hili humaanisha tumbo la mnyama. ‘Tumbo’ ni la kisasa na linaloeleweka zaidi kuliko istilahi za kale au za kitaalamu kupita kiasi.
