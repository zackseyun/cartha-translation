  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: sw
  text: kama vile ulivyomwomba BWANA Mungu wako huko Horebu siku ya kusanyiko, ukisema, “Nisisikie tena sauti ya BWANA Mungu wangu, wala nisiuone tena moto huu mkubwa, nisije nikafa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: kama vile ulivyomwomba
  rationale: Huwasilisha maana ya ombi ambalo watu walimwelekezea BWANA; katika Kiswahili cha kawaida, “kumwomba” ni ya asili zaidi kuliko kufuata kihalisi muundo wa Kiebrania wenye מֵעִם.
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la agano limetafsiriwa kwa desturi pana ya Biblia za Kiswahili, kwa herufi kubwa ili kulitofautisha na cheo cha kawaida.
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: Jina la mahali limetoholewa kwa umbo linalotambulika katika Kiswahili; “huko” linaonyesha mahali pa tukio kwa mtiririko wa kawaida.
- source_word: בְּיוֹם הַקָּהָל
  choice: siku ya kusanyiko
  rationale: “Kusanyiko” linaonyesha mkutano wa taifa mbele za Mungu bila kuongeza tafsiri ya kimadhehebu.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: Nisisikie tena
  rationale: Kitenzi אָסַף pamoja na kitenzi-jina hapa kina maana ya kutofanya jambo tena; Kiswahili hiki ni wazi na cha kawaida.
- source_word: וְאֶת הָאֵשׁ הַגְּדֹלָה הַזֹּאת לֹא אֶרְאֶה עוֹד
  choice: wala nisiuone tena moto huu mkubwa
  rationale: Huhifadhi msisitizo wa kurudiwa kwa “tena” na kiunganishi hasi, huku mpangilio ukiwa wa asili katika Kiswahili.
- source_word: וְלֹא אָמוּת
  choice: nisije nikafa
  rationale: 'Ingawa muundo wa Kiebrania ni wa kuunganisha, katika muktadha huu unaeleza matokeo yanayoogopwa: kifo kutokana na kusikia sauti na kuuona moto.'
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” linafuata matumizi mapana na yenye hadhi katika Biblia za Kiswahili, bila kuingiza msimamo wa kimadhehebu.
- issue: Uhusiano wa kishazi וְלֹא אָמוּת na maombi yaliyotangulia
  choice: nisije nikafa
  alternative: wala nisife
  rationale: Muktadha unaonyesha kwamba watu wanaomba wasisikie wala kuona tena kwa hofu ya kufa; “nisije nikafa” huonyesha kusudi au matokeo yanayoepukwa bila kubadili hoja ya kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imeendeleza utegemezi wake kwa mstari uliotangulia, kama ilivyo katika chanzo.
