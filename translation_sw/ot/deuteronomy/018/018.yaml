base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: sw
  text: Nitawainulia nabii kama wewe kutoka miongoni mwa ndugu zao[a]. Nitatia maneno yangu kinywani mwake, naye atawaambia yote nitakayomwamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka miongoni mwa jamaa zao” au “kutoka miongoni mwa Waisraeli wenzao”; Kiebrania, kwa maana halisi, “kutoka miongoni mwa ndugu zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: nabii
  rationale: Neno la kawaida la Kiswahili kwa mtu anayesema kwa niaba ya Mungu; haliongezi utambulisho maalumu ambao Kiebrania hakijautaja hapa.
- source_word: אָקִים לָהֶם
  choice: nitawainulia
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba Mungu atamsimamisha au kumteua nabii kwa ajili yao, huku ukihifadhi picha ya Kiebrania ya ‘kumwinua.’
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: kutoka miongoni mwa ndugu zao
  rationale: ‘Kutoka miongoni mwa’ huwasilisha מִקֶּרֶב kwa usahihi, na ‘ndugu zao’ huhifadhi lugha ya ujamaa ya אֲחֵיהֶם bila kuifasiri moja kwa moja kuwa ‘Waisraeli wenzao.’
- source_word: כָּמוֹךָ
  choice: kama wewe
  rationale: Huhifadhi kwa ufupi ulinganisho wa moja kwa moja na Musa.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: Nitatia maneno yangu kinywani mwake
  rationale: Huhifadhi sitiari dhahiri ya kumpa nabii maneno ya Mungu, kwa lugha ya Kiswahili iliyo ya kawaida na yenye hadhi.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: naye atawaambia
  rationale: ‘Atawaambia’ ni usemi wa asili wa Kiswahili unaowasilisha tendo la kusema kwao katika muktadha huu wa ujumbe wa kinabii.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: yote nitakayomwamuru
  rationale: Huwasilisha ukamilifu wa כָּל אֲשֶׁר na hali ya baadaye ya agizo la Mungu bila kuongeza maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Ikiwa nabii aliyeahidiwa anatajwa hapa kuwa Masihi kwa njia ya moja kwa moja
  choice: Maandishi yanabaki na kauli ‘nabii kama wewe’ bila kumtambulisha zaidi.
  alternative: Kuitafsiri kwa namna inayomtaja moja kwa moja Masihi, au kuifanya wazi kuwa ni mfululizo wa manabii.
  rationale: Mstari wenyewe haumtambui nabii huyo waziwazi zaidi ya kusema atakuwa kama Musa. Tafsiri kwa hiyo inadumisha uwezekano na mvutano wa kitheolojia uliomo katika maandishi.
- issue: Maana ya kindugu ya אֲחֵיהֶם
  choice: ndugu zao
  alternative: jamaa zao; Waisraeli wenzao
  rationale: ‘Ndugu zao’ huhifadhi picha ya asili ya ujamaa. Tanbihi inaeleza upana wa maana katika muktadha bila kuubadilisha usemi wa chanzo katika maandishi makuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘nitawainulia’ na sitiari ‘kinywani mwake’ huhifadhi ladha ya maandishi ya kinabii bila kuwa mgumu; ‘atawaambia’ hutoa mtiririko wa asili wa Kiswahili.
