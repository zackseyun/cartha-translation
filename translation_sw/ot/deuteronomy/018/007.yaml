  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: sw
  text: basi anaweza kuhudumu kwa jina la Yahwe Mungu wake,[a][c] kama ndugu zake wote Walawi[b] wanaosimama huko mbele ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye atahudumu.” Umbo la kitenzi cha Kiebrania linaweza kueleweka kuwa linatoa ruhusa au kuwa kauli ya moja kwa moja ya wakati ujao katika muktadha huu wa sheria.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “ndugu zake,” yaani, Walawi wenzake.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania YHWH, jina la Mungu ambalo kwa desturi limetafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: basi anaweza kuhudumu
  rationale: Kitenzi cha Kiebrania katika Piel kinaonyesha huduma ya kidini ya Mlawi. “Kuhudumu” ni ya kawaida na yenye heshima; “basi” huendeleza matokeo ya sharti la mstari uliotangulia, na “anaweza” huonyesha ruhusa bila kuficha kwamba umbo la Kiebrania pia linaweza kueleweka kama kauli ya moja kwa moja ya wakati ujao.
- source_word: בְּשֵׁם
  choice: kwa jina la
  rationale: Hii ni nahau ya kawaida ya kutenda kwa mamlaka ya jina au kwa kuliitia jina; “kwa jina la” ni Kiswahili cha asili na wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo kama “BWANA,” hivyo jina binafsi katika matini linahifadhiwa.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Huhifadhi wazi kiambishi milikishi cha Kiebrania bila kuongeza tafsiri.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: kama ndugu zake wote Walawi
  rationale: Huhifadhi ulinganisho, neno la kindugu la kiume, na ufafanuzi wa Kiebrania kwamba ndugu hao ni Walawi.
- source_word: הָעֹמְדִים
  choice: wanaosimama
  rationale: Huhifadhi maana ya moja kwa moja ya עמד, ingawa katika mazingira ya ibada kusimama huko kunaweza pia kudokeza kuwa tayari kwa huduma.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali pa ibada palipotajwa katika muktadha; “huko” ni sawa na ya asili katika Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni ulinganifu wa karibu na nahau ya Kiebrania ya kuwa mbele au katika uwepo wa Mungu, na inafaa katika mazingira ya ibada.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni YHWH. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha na cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
- issue: Nguvu ya kitenzi וְשֵׁרֵת katika sheria hii
  choice: anaweza kuhudumu
  alternative: atahudumu
  rationale: Muktadha wa sheria unaunga mkono maana ya ruhusa, lakini umbo la Kiebrania linaweza pia kutolewa kama kauli ya moja kwa moja ya wakati ujao. Tanbihi huhifadhi uwezekano huo.
- issue: Neno la kindugu אֶחָיו
  choice: ndugu zake
  alternative: Walawi wenzake
  rationale: “Ndugu zake” huhifadhi taswira ya kindugu ya Kiebrania, huku neno linalofuata “Walawi” likifafanua kwamba wanaorejelewa ni Walawi wenzake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuhudumu” kinaeleweka kwa wasomaji wa kawaida na kinafaa kwa huduma ya kidini; “mbele za Yahwe” hudumisha mtindo wa heshima bila kuwa wa kizamani kupita kiasi.
