base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: sw
  text: Lakini nabii ambaye kwa kiburi[a] atanena kwa jina langu neno ambalo sikumwamuru kulinena, au ambaye atanena kwa jina la miungu mingine—nabii huyo lazima afe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayethubutu kunena kwa majivuno.” Kitenzi cha Kiebrania kinaonyesha kuvuka mipaka kwa makusudi na kwa kiburi.
    reason: lexical_alternative
  - marker: b
    text: Au, “anapaswa kufa” au “atauawa.” Kiebrania kinatoa hukumu ya kifo kwa maneno mafupi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Huonyesha tofauti yenye nguvu kati ya nabii halali aliyetajwa kabla na nabii anayevuka mamlaka yake.
- source_word: אֲשֶׁר יָזִיד לְדַבֵּר
  choice: ambaye kwa kiburi atanena
  rationale: Kitenzi יָזִיד kinaonyesha kufanya jambo kwa makusudi kwa kujikinai au kuvuka mipaka kwa kiburi. Muundo huu ni wa asili katika Kiswahili na unahifadhi uzito wa kimaadili na kisheria.
- source_word: לְדַבֵּר דָּבָר
  choice: atanena ... neno
  rationale: Unahifadhi uhusiano wa kitenzi na nomino katika Kiebrania, huku 'kunena neno' ikiwa lugha yenye hadhi na inayoeleweka.
- source_word: בִּשְׁמִי
  choice: kwa jina langu
  rationale: Ni nahau ya kawaida ya Kiswahili kwa dai la kusema kwa mamlaka au uwakilishi wa Mungu.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: neno ambalo sikumwamuru kulinena
  rationale: Inahifadhi kishazi husishi, amri ya Mungu, na kiwakilishi kinachomrejelea nabii bila kuongeza maelezo yasiyokuwamo.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: au ambaye atanena
  rationale: Ingawa ו inaweza kumaanisha 'na', hapa inaunganisha makosa mawili mbadala; 'au' huonyesha wazi kwamba kila moja peke yake linastahili hukumu iliyotajwa.
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: kwa jina la miungu mingine
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayoonyesha kudai mamlaka ya miungu mingine.
- source_word: וּמֵת
  choice: lazima afe
  rationale: Huonyesha kwa ufupi hukumu ya kisheria ya kifo bila kuongeza wazi utaratibu wa kuuawa, ambao haujaelezwa katika umbo hili.
- source_word: הַנָּבִיא הַהוּא
  choice: nabii huyo
  rationale: Huwasilisha kwa kawaida nomino yenye kiashiria na msisitizo wa kumtambulisha nabii husika.
theological_decisions:
- issue: Rejeo la jina la Mungu katika usemi wa nafsi ya kwanza
  choice: kwa jina langu
  alternative: kwa jina la BWANA
  rationale: Kiebrania ni usemi wa moja kwa moja wa Mungu katika nafsi ya kwanza. Kuhifadhi 'langu' huepuka kuingiza jina la Mungu mahali ambapo mstari wenyewe una kiwakilishi.
- issue: Mfumo wa adhabu ya kifo
  choice: lazima afe
  alternative: atauawa
  rationale: Kiebrania kinatoa hukumu ya kifo kwa ufupi, lakini hakisemi wazi katika umbo hili kwamba tendo ni la kusababisha kifo. 'Lazima afe' huhifadhi nguvu ya lazima ya kisheria bila kubainisha utaratibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kunena' kimetumiwa kwa usemi wa kinabii kwa sababu kinaeleweka na kuhifadhi mtindo mzito wa kifungu; sentensi imebaki wazi kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vipengele vinavyohusika.
