  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י ב֗/וֹ בָּחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/כָּל שְׁבָטֶ֑י/ךָ לַ/עֲמֹ֨ד לְ/שָׁרֵ֧ת בְּ/שֵׁם יְהוָ֛ה ה֥וּא וּ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: sw
  text: Kwa maana Yahwe Mungu wako amemchagua kutoka katika makabila yako yote ili yeye na wanawe wasimame na kuhudumu kwa jina la Yahwe siku zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “daima.” Kwa maana halisi, Kiebrania kinasema “siku zote”; hapa usemi huo unaonyesha mwendelezo wa huduma ya kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya maagizo yaliyotangulia kwa njia ya kawaida na yenye heshima katika Kiswahili.
- source_word: בּוֹ בָּחַר
  choice: amemchagua
  rationale: Kitenzi pamoja na kihusishi chake kinamaanisha kumchagua mtu; kauli ya wakati timilifu inaonyesha uchaguzi uliofanyika na ambao bado una uzito.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la agano יְהוָה limetoholewa kuwa Yahwe, huku אֱלֹהֶיךָ likitafsiriwa moja kwa moja.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: kutoka katika makabila yako yote
  rationale: Inaonyesha kuchaguliwa kutoka miongoni mwa makabila ya Israeli bila kupanua maana.
- source_word: לַעֲמֹד
  choice: ili asimame
  rationale: Inahifadhi taswira halisi ya kusimama katika huduma ya kikuhani na pia kusudi linaloonyeshwa na infinitivi ya Kiebrania.
- source_word: לְשָׁרֵת
  choice: na kuhudumu
  rationale: Katika muktadha huu neno linahusu huduma ya kikuhani; ‘kuhudumu’ ni la kawaida na mahususi kuliko ‘kutumikia’ pekee.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahwe
  rationale: Inahifadhi wazo la huduma inayofanywa chini ya jina na mamlaka ya Yahwe bila kulifafanua kupita kiasi.
- source_word: הוּא וּבָנָיו
  choice: yeye na wanawe
  rationale: Kiebrania kinataja wana wa kiume, kwa kuwa muktadha ni urithi wa huduma ya kikuhani.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Ni tafsiri ya karibu na ya kawaida ya usemi wa Kiebrania, wenye maana ya huduma inayoendelea daima.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Lugha ya urithi wa kikuhani
  choice: yeye na wanawe
  alternative: yeye na watoto wake
  rationale: בָּנָיו ni ‘wanawe’ na muktadha unahusu mwendelezo wa huduma ya kikuhani kupitia wazao wa kiume; maana hiyo haipaswi kufanywa isiyo na jinsia.
- issue: Muda wa huduma ya kikuhani
  choice: siku zote
  alternative: milele; daima
  rationale: Tafsiri hii inahifadhi usemi halisi wa Kiebrania na mvutano wake wa kimuktadha, bila kuamua kimya-kimya kama unamaanisha umilele usio na mwisho au mwendelezo wa kudumu wa huduma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa ‘asimame na kuhudumu’ umehifadhi lugha halisi ya huduma ya kikuhani, na ‘wanawe’ huhifadhi jinsia iliyotajwa katika chanzo.
