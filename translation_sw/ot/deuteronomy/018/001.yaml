  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: sw
  text: Makuhani Walawi—yaani, kabila lote la Lawi—hawatakuwa na fungu wala urithi pamoja na Israeli. Watakula sadaka za Yahwe zinazotolewa kwa moto[a], yaani urithi wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za chakula za Yahwe.” Neno la Kiebrania linahusu sadaka zinazotolewa kwa moto, ingawa si lazima sadaka nzima iteketezwe.
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi katika “urithi wake” huenda kikamrejelea Lawi kama kabila linalotajwa kwa umoja. Linganisha Kumbukumbu la Torati 18:2, ambako Yahwe anasemekana kuwa urithi wao. Muundo wa mstari huu pia unaweza kueleweka kuwa sadaka za Yahwe ndizo urithi huo.
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: Makuhani Walawi
  rationale: Kirai hiki kinawatambulisha makuhani kuwa Walawi; tafsiri hii ni fupi, ya kawaida, na haifanyi makuhani na Walawi kuwa makundi mawili yasiyohusiana.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: yaani, kabila lote la Lawi
  rationale: Neno כָּל linasisitiza kuwa agizo linahusu kabila lote. “Yaani” linaonyesha uhusiano wa ufafanuzi uliopo katika mpangilio wa Kiebrania bila kuufanya kuwa sentensi mpya.
- source_word: חֵלֶק וְנַחֲלָה
  choice: sehemu wala urithi
  rationale: Katika kishazi hasi, “wala” ni Kiswahili cha asili kinachohifadhi jozi ya maneno yanayohusu fungu au mali iliyogawiwa.
- source_word: עִם יִשְׂרָאֵל
  choice: pamoja na Israeli
  rationale: Kirai hiki kinaonyesha kuwa Lawi hatapata mgao wa pamoja na makabila mengine ya Israeli.
- source_word: אִשֵּׁי יְהוָה
  choice: sadaka za Yahwe zinazotolewa kwa moto
  rationale: אִשִּׁים huhusiana na sadaka zinazotolewa kwa moto. Ufafanuzi huu huepuka kudokeza kwamba sadaka nzima lazima iteketezwe, kwa kuwa sehemu zake zingeweza kuwa chakula cha makuhani.
- source_word: וְנַחֲלָתוֹ
  choice: na urithi wake
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu umoja. “Wake” kinahifadhi umoja huo na pia utata wa rejeo lake badala ya kulibadili kimya kimya kuwa “wao” au kulitaja wazi kuwa la Yahwe.
- source_word: יֹאכֵלוּן
  choice: Watakula
  rationale: Hali ya kitenzi katika sheria hii inaeleza mpango au haki ya kudumu; “watakula” ni ya asili na huunganisha vitu vyote viwili vinavyofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יְהוָה; “Yahwe” hulitaja moja kwa moja bila kulibadili kuwa cheo.
- issue: Rejeo la “urithi wake”
  choice: Kudumisha kiwakilishi cha umoja kisichofafanuliwa
  alternative: urithi wao / urithi wa Yahwe
  rationale: Kiambishi וֹ ni cha umoja, lakini rejeo lake linaweza kueleweka kwa namna tofauti katika muktadha. Tafsiri haipaswi kulazimisha suluhisho la kiteolojia; tanbihi inaonyesha uhusiano na Kumbukumbu la Torati 18:2.
- issue: Uhusiano kati ya sadaka na “urithi wake”
  choice: na urithi wake
  alternative: yaani, urithi wake
  rationale: וְ kwa kawaida ni kiunganishi “na,” ingawa uhusiano wa ufafanuzi unawezekana. Kutumia “na” kunahifadhi muundo na utata wa chanzo badala ya kuamua kwamba kishazi cha pili lazima kiwe ufafanuzi wa kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Wala” limetumiwa kwa ulinganifu wa asili katika kishazi hasi; vistari virefu vinatenga maelezo ya “kabila lote la Lawi.” Jina “Yahwe” limehifadhiwa kwa mujibu wa ushahidi wa chanzo.
