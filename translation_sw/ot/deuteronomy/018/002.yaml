  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: sw
  text: Wala hatakuwa na urithi miongoni mwa ndugu zake[a]; Yahwe ndiye urithi wake, kama alivyomwambia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamaa zake.” Kiebrania kinasema “ndugu zake,” likimaanisha Waisraeli wenzake, hasa watu wa makabila mengine.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama alivyosema kwake.” Kitenzi cha Kiebrania ni neno la kawaida la “kusema” au “kunena”; “kama alivyomwahidi” inawezekana kwa maana inayodokezwa, lakini ni tafsiri yenye ufafanuzi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: urithi / urithi wake
  rationale: Katika muktadha wa ugawaji wa nchi katika Kumbukumbu la Torati, neno hili lina maana ya sehemu inayorithiwa au iliyogawiwa. Kurudia “urithi” katika vifungu vyote viwili kunaakisi marudio ya Kiebrania na kuhifadhi maana ya kisheria kuhusu nchi pamoja na maana ya kimajazi kuhusu Yahwe.
- source_word: בְּקֶרֶב
  choice: miongoni mwa
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau בְּקֶרֶב אֶחָיו, ikionyesha nafasi yake kati ya watu wa kundi lilelile.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Kiebrania kinasema kihalisi “ndugu zake.” Katika muktadha, hawa ni Waisraeli wenzake, hasa makabila mengine; “ndugu zake” huhifadhi umbo na uhusiano wa matini bila kufafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: הוּא
  choice: ndiye
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo. “Ndiye” huonyesha kwa kawaida na kwa uwazi mkazo kwamba Yahwe mwenyewe ndiye urithi wake.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: kama alivyomwambia
  rationale: דִּבֶּר ni kitenzi cha kawaida cha kusema au kunena. “Kama alivyomwambia” ni Kiswahili cha asili kinachohifadhi maana hiyo bila kuongeza kwa tafsiri dhana mahsusi ya ahadi.
theological_decisions:
- issue: Kirejeo cha viwakilishi vya umoja “yeye/wake”
  choice: Umoja umehifadhiwa kama urejeo wa jumla au wa uwakilishi kwa Mlawi au kuhani wa Kilawi.
  alternative: Viwakilishi vinaweza kumrejelea Lawi kama babu wa kabila, au kila kuhani mmoja mmoja kwa maana ya mgawanyo.
  rationale: Muktadha wa karibu unawahusu makuhani Walawi na kabila la Lawi, huku Kiebrania cha Biblia kikitumia mara nyingi umoja kwa kundi linalowakilishwa. Tafsiri haibani urejeo huo katika ufafanuzi mmoja.
- issue: Maana ya “Yahwe ndiye urithi wake”
  choice: Kauli ya agano iliyo ya kimajazi imehifadhiwa bila kuipanua.
  alternative: Kufafanua kuwa Yahwe ndiye sehemu ya Walawi badala ya ardhi.
  rationale: Matini inasema kwa ufupi kwamba Yahwe mwenyewe ndiye urithi. Kuiacha hivyo huhifadhi uzito na mvutano wake wa kitheolojia bila kuingiza maelezo yasiyotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Wala hatakuwa” huunganisha mstari huu na muktadha uliotangulia; “ndiye” huhifadhi mkazo wa הוּא. Alama zote za tanbihi zimewekwa katika matini kuu.
