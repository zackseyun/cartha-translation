base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: sw
  text: Utakapoingia katika nchi ambayo Yahweh Mungu wako anakupa, usijifunze kufanya sawasawa na machukizo ya mataifa yale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama machukizo ya mataifa yale.” Kihusishi cha Kiebrania kinaweza kuonyesha ulinganisho au kutenda kwa kufuata namna fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Utakapo-
  rationale: Katika muktadha huu neno hili linaanzisha hali ya wakati inayotangulia katazo; muundo wa ‘utakapoingia’ ni wa kawaida na wa asili katika Kiswahili.
- source_word: בָּא אֶל־הָאָרֶץ
  choice: utakapoingia katika nchi
  rationale: Kitenzi cha Kiebrania kinaonyesha kuingia kunakotarajiwa, na ‘nchi’ huhifadhi maana ya kijiografia na ya agano inayotumiwa katika Kumbukumbu la Torati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo huu una kiambishi cha nafsi ya pili umoja na unaonyesha umilikaji moja kwa moja.
- source_word: נֹתֵן לָךְ
  choice: anakupa
  rationale: Kauli ya wakati wa sasa huonyesha tendo linaloendelea au lililo karibu kutimizwa kutoka kwa mtazamo wa msemaji.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: usijifunze kutenda
  rationale: Muundo hasi ni katazo kwa mtu mmoja; ‘kutenda’ hudumisha upana wa kitenzi bila kukifupisha kuwa desturi maalumu pekee.
- source_word: כְּתוֹעֲבֹת
  choice: kufuatana na machukizo
  rationale: Kihusishi כְ kinaweza kuonyesha kufuata namna au ulinganisho. ‘Kufuatana na’ kinatoa maana kuu ya kufuata matendo hayo, huku tanbihi ikihifadhi uwezekano wa ulinganisho; ‘machukizo’ hudumisha uzito wa kimaadili na kidini wa neno la Kiebrania.
- source_word: הַגּוֹיִם הָהֵם
  choice: mataifa yale
  rationale: ‘Mataifa’ linafaa kwa makundi ya watu yanayozungumziwa, na ‘yale’ linaakisi kiashiria cha mbali cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la agano la Mungu moja kwa moja; kulitaja kama ‘Yahweh’ huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Uzito wa neno תּוֹעֵבָה
  choice: machukizo
  alternative: matendo ya kuchukiza
  rationale: ‘Machukizo’ huhifadhi nguvu ya hukumu ya kimaadili na kidini bila kuyafafanua mapema kuwa aina fulani tu ya matendo kabla ya mistari inayofuata.
- issue: Maana ya kihusishi כְ katika כְּתוֹעֲבֹת
  choice: kufuatana na machukizo
  alternative: kama machukizo
  rationale: Maana kuu hapa ni kufuata namna ya matendo hayo, lakini Kiebrania kinaweza pia kusikika kama ulinganisho; tanbihi inalinda uwezekano huo badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Katazo limetolewa kwa umoja kama katika Kiebrania. Neno ‘machukizo’ limehifadhiwa kwa uzito wake wa kimaadili na kidini.
