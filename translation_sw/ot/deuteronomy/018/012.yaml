id: DEU.18.12
reference: Deuteronomy 18:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: sw
  text: Kwa maana kila mtu anayefanya mambo haya ni chukizo kwa Yahwe, na kwa sababu ya machukizo haya, Yahwe Mungu wako anawafukuza[a] mbele yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anawanyang’anya milki yao”; kitenzi cha Kiebrania kinaweza kusisitiza kuyafanya mataifa yapoteze umiliki wa nchi, pamoja na kuyafukuza.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya makatazo yaliyotangulia na kuunganisha sentensi kwa Kiswahili cha kawaida.
- source_word: תוֹעֲבַת יְהוָה
  choice: ni chukizo kwa Yahwe
  rationale: Inadumisha uzito wa neno תוֹעֵבָה na kueleza kwamba mtu huyo ni mwenye kuchukiza machoni pa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha moja kwa moja jina la agano יהוה kwa namna inayotambulika katika Kiswahili.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: kila mtu anayefanya mambo haya
  rationale: Inahifadhi maana ya ujumla ya כָּל pamoja na kitenzi-shirikishi, kwa lugha ya kawaida na wazi.
- source_word: וּבִגְלַל
  choice: na kwa sababu ya
  rationale: Inaonyesha wazi msingi wa hukumu inayofuata.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: machukizo haya
  rationale: Inadumisha uhusiano wa kileksika na neno la umoja ‘chukizo’ mapema katika aya na kurejelea matendo yaliyokatazwa.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Inahifadhi kiambishi cha nafsi ya pili umoja kinachomwelekezea Israeli moja kwa moja.
- source_word: מוֹרִישׁ אֹתָם
  choice: anawafukuza
  rationale: Hifili ya ירש katika muktadha huu humaanisha kuyaondoa mataifa katika nchi; ‘anawafukuza’ ni ya asili na inaeleweka vizuri, huku maana mbadala ya kuwanyang’anya milki ikitajwa katika tanbihi.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi taswira ya mataifa kuondolewa mbele ya Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Mhusika anayeitwa chukizo
  choice: kila mtu anayefanya mambo haya ni chukizo kwa Yahwe
  alternative: kila afanyaye mambo haya humchukiza Yahwe
  rationale: Muundo huu unahifadhi madai yenye nguvu ya kirai nomino תוֹעֲבַת יְהוָה bila kuyapunguza kuwa maelezo ya hisia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku ukidumisha uzito wa lugha ya kimaadili na ya agano katika chanzo.
