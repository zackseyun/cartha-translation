    reason: lexical_alternative
  - marker: b
    text: “Kwa kujidai” hapa humaanisha kunena kwa majivuno na kwa makusudi bila mamlaka ya Yahweh.
    reason: cultural_note
  revision_rationale: The revision replaces the adversative connector with a neutral conditional continuation and renders presumptuous speech as self-assertive, unauthorized speech. It otherwise preserves the draft’s faithful wording, register, repeated lexical link, and footnote anchor placement.
