- from: Nabii anaponena kwa jina la Yahweh, lakini jambo[a] hilo lisitukie wala kutimia, hilo ndilo jambo ambalo Yahweh hakulinena. Nabii huyo amelisema kwa kiburi[b]; usimwogope.
  to: Nabii anaponena kwa jina la Yahweh, na jambo[a] hilo lisipotokea wala kutimia, hilo ndilo jambo ambalo Yahweh hakulinena. Nabii huyo amelisema kwa kujidai[b]; usimwogope.
  rationale: The revision replaces the adversative connector with a neutral conditional continuation and renders presumptuous speech as self-assertive, unauthorized speech. It otherwise preserves the draft’s faithful wording, register, repeated lexical link, and footnote anchor placement.
