  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: sw
  text: Nabii anaponena kwa jina la Yahweh, na jambo[a] hilo lisipotokea wala kutimia, hilo ndilo jambo ambalo Yahweh hakulinena. Nabii huyo amelisema kwa kujidai[b]; usimwogope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno.” Neno la Kiebrania דָּבָר linaweza kumaanisha ujumbe uliotamkwa na pia jambo au tukio lililotabiriwa.
    reason: lexical_alternative
  - marker: b
    text: “Kwa kujidai” hapa humaanisha kunena kwa majivuno na kwa makusudi bila mamlaka ya Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: יְדַבֵּר הַנָּבִיא
  choice: Nabii anaponena
  rationale: Wakati wa hali ya masharti katika Kiebrania umetafsiriwa kwa muundo wa Kiswahili unaoeleza kisa cha jumla. Kiswahili hakina kibainishi kinacholingana moja kwa moja na הַ-, hivyo “nabii” linaweza kumaanisha nabii anayezungumziwa katika kisa hicho bila kulifanya kundi lote la manabii kuwa mhusika mmoja maalumu.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahweh
  rationale: Huhifadhi dai la kusema kwa mamlaka ya jina la Mungu na kulitaja jina la agano יְהוָה kama Yahweh badala ya kulibadili kuwa cheo.
- source_word: הַדָּבָר
  choice: jambo
  rationale: דָּבָר hapa linahusisha ujumbe uliotamkwa na jambo lililotabiriwa. “Jambo” linaweza kubeba pande zote mbili na limerudiwa ili kudumisha mshikamano wa matini.
- source_word: וְלֹא יִהְיֶה ... וְלֹא יָבֹא
  choice: lisitukie wala kutimia
  rationale: Huhifadhi vitenzi viwili vya Kiebrania vinavyosisitiza kwamba yaliyosemwa hayajatokea wala kufikia utimizo.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: ambalo Yahweh hakulinena
  rationale: Huhifadhi tendo la kusema na kiambishi cha yambwa kinachorejelea jambo hilo, bila kuongeza maelezo ya kitheolojia yasiyo katika mstari.
- source_word: בְּזָדוֹן
  choice: kwa kiburi
  rationale: זָדוֹן linaashiria majivuno ya makusudi na kujitanguliza bila mamlaka. “Kwa kiburi” ni Kiswahili cha kawaida na chenye uzito unaofaa; tanbihi inafafanua maana mahususi ya muktadha.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: usimwogope
  rationale: Amri hasi ya nafsi ya pili umoja imetolewa kwa ufupi na kwa nguvu ya kisheria, ikionyesha kutotishwa na nabii huyo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina jina la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Kipimo cha dai la kinabii
  choice: Kutojirudia kwa jambo lililotabiriwa kunaonyesha kwamba Yahweh hakulinena
  alternative: Kuipanua aya kuwa kanuni kamili kuhusu kila namna ya unabii
  rationale: Tafsiri inabaki katika kipimo kinachotajwa wazi na aya—kutotimia kwa ujumbe na kuzungumza kwa kiburi—bila kuingiza mafundisho mapana yasiyotamkwa hapa.
- issue: Maana ya בְּזָדוֹן
  choice: kwa kiburi
  alternative: kwa kujiamini; kimakosa
  rationale: Neno linaonyesha hatua ya makusudi na ya majivuno, si kosa lisilo la kukusudia wala kujiamini kwa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa leo lakini unadumisha urudiaji wa “jambo,” vitenzi viwili vya kutotimia, na uzito wa amri ya mwisho.
