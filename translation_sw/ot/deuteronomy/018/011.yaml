  text: au mtu anayefanya uchawi wa kufunga[a], au mtu anayemwendea mpatanishi wa mizimu[b] au mchawi[c], au mtu anayewauliza wafu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayenena maneno ya uchawi.” Kiebrania ni, kwa tafsiri halisi, “anayefunga kifungo”; nahau hiyo hurejelea tungo au kitendo cha kichawi.
    reason: lexical_alternative
  - marker: b
    text: Au “anayeliuliza roho ya mfu.” Neno la Kiebrania linaweza kumaanisha roho ya mfu au mtu anayetumiwa kuwasiliana nayo.
    reason: lexical_alternative
  - marker: c
    text: Au “mjuzi wa mambo ya mizimu.” Neno hili humaanisha mtendaji wa maarifa ya kichawi na mara nyingi huambatana na neno la Kiebrania kwa “mpatanishi wa mizimu.”
    reason: lexical_alternative
  - marker: d
    text: Au “anayeshauriana na wafu” au “anayewatafuta wafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: mtu anayefunga hirizi
  rationale: Nahau hiyo inarudia mzizi wenye maana ya kufunga au kuunganisha na katika orodha hii inahusu kitendo cha kichawi. “Kufunga hirizi” ni usemi wa kawaida wa Kiswahili unaodokeza uchawi wa kufunga bila kutumia lugha ya kubuniwa.
- source_word: שֹׁאֵל אוֹב
  choice: mtu anayemwendea mwaguzi wa mizimu
  rationale: אוֹב inaweza kumaanisha roho ya mfu au mtu anayetumiwa kuwasiliana nayo. Tafsiri hii inaonyesha tendo la kutafuta habari kwa mpatanishi wa mizimu huku tanbihi ikihifadhi uwezekano wa kuuliza mzimu moja kwa moja.
- source_word: יִדְּעֹנִי
  choice: mchawi
  rationale: Neno hili humaanisha mtaalamu wa maarifa ya kichawi na mara nyingi huambatana na אוֹב. “Mchawi” ni neno la kawaida na linaloeleweka, ingawa tanbihi inaeleza maana mahususi zaidi ya mjuzi wa mambo ya mizimu.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: mtu anayetafuta habari kwa wafu
  rationale: דֹרֵשׁ hapa ni kutafuta au kuomba habari, na אֶל הַמֵּתִים ni kwa wafu. Ufafanuzi mdogo wa “habari” unafanya tendo la kutafuta ushauri kwa wafu lieleweke kwa Kiswahili bila kudai namna yake.
- source_word: וְ
  choice: au
  rationale: Ingawa kiunganishi kwa kawaida ni “na,” katika mfululizo huu wa makatazo kinafanya kazi ya kutenganisha aina mbalimbali za watendaji; “au” ni ya asili katika Kiswahili.
theological_decisions:
- issue: Kutafsiri istilahi za uchawi bila kuingiza dhana za baadaye au za hadithi za kubuni
  choice: Kutumia istilahi za kawaida—“hirizi,” “mwaguzi wa mizimu,” na “mchawi”—na kuweka tofauti za maana katika tanbihi.
  alternative: Kutumia istilahi za kijadi au tafsiri za neno kwa neno kama “afungaye kifungo,” “mwenye pepo,” au “mjuzi.”
  rationale: Mstari unataja matendo yaliyokatazwa ya uchawi na kutafuta habari kwa wafu. Istilahi za kawaida zinafikisha kusudi la matini, huku tanbihi zikihifadhi utata halisi wa אוֹב na יִדְּעֹנִי bila kufafanua ontolojia ya roho zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaendeleza orodha ya mstari uliotangulia kwa “au.” Istilahi zimechaguliwa kwa uelewekaji wa kawaida, huku utata wa maneno ya Kiebrania ukihifadhiwa katika tanbihi.
