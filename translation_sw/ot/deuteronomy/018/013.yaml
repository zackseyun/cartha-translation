review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the injunction and the divine name, but “mbele za” (“before/in the presence of”) does not translate the Hebrew preposition עִם, which is “with.” The relational sense should be retained without making the Swahili unnatural.
  naturalness: “Utakuwa mkamilifu mbele za …” is idiomatic biblical Swahili, but it changes the stated relation. “Uwe mkamilifu katika uhusiano wako na …” is natural Standard East African Swahili and expresses the covenantal relational force of the Hebrew.
  terminology: “Yahwe, Mungu wako” is appropriate. “Mkamilifu” is a viable broad rendering of תָּמִים, provided the note gives the morally focused alternative “asiye na lawama” and does not imply sinless perfection.
  issues:
  - severity: medium
    issue: The phrase “mbele za” replaces עִם.
    rationale: The Hebrew explicitly uses עִם (“with”), not a preposition meaning “before.” Though “mbele za” is idiomatic in traditional Bible phrasing, it narrows and alters the relational wording of the source.
  - severity: low
    issue: The footnote’s “mwenye moyo wote” is more interpretive than the lexical alternatives.
    rationale: Wholeheartedness fits the context but is an interpretive contextual expression. The note should first give direct lexical alternatives such as “asiye na lawama” and “kamili.”
  revised_text: Uwe mkamilifu katika uhusiano wako na Yahwe, Mungu wako.[a]
