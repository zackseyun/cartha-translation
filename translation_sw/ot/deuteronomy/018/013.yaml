- from: Utakuwa mkamilifu mbele za Yahwe Mungu wako.[a]
  to: Uwe mkamilifu katika uhusiano wako na Yahwe, Mungu wako.[a]
  rationale: The revision preserves the injunction while rendering the relational force of עִם in idiomatic Swahili. “Mkamilifu” retains the breadth of תָּמִים; the footnote supplies alternatives without resolving the term into a claim of sinless perfection.
