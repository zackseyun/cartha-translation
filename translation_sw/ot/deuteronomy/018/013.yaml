  text: You shall be blameless with Yahweh your God[a].
translation:
  language: sw
  text: Uwe mkamilifu katika uhusiano wako na Yahwe, Mungu wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asiye na lawama” au “kamili” katika uhusiano wako na Yahwe, Mungu wako.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: mkamilifu
  rationale: Neno hili huonyesha ukamilifu, uadilifu, au kutokuwa na dosari. Katika muktadha wa kukataa uaguzi na matendo ya uchawi, “mkamilifu” linahifadhi upana na mvutano wa neno la Kiebrania bila kulifafanua tu kuwa kutokuwa na dhambi.
- source_word: תִּהְיֶה
  choice: utakuwa
  rationale: Ni kitenzi cha Qal imperfect nafsi ya pili umoja wa kiume, chenye nguvu ya agizo hapa. “Utakuwa” kinadumisha muundo na sauti ya agano ya Kiebrania.
- source_word: עִם
  choice: mbele za
  rationale: Kwa kawaida עִם humaanisha “pamoja na,” lakini katika Kiswahili “mkamilifu pamoja na Yahwe” si usemi wa kawaida na unaweza kupotosha. “Mbele za” huonyesha uhusiano na mwenendo katika uwepo wa Mungu kwa namna ya asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Katika rejeo hili la agano kwa Yahwe, nomino hii yenye kiambishi cha nafsi ya pili umoja humaanisha Mungu mmoja wa Israeli.
theological_decisions:
- issue: Maana ya תָּמִים katika himizo la agano
  choice: mkamilifu kwa maana ya uadilifu na moyo usiogawanyika mbele za Mungu
  alternative: asiye na lawama; mwenye moyo wote kwa Yahwe
  rationale: Muktadha wa Kumbukumbu la Torati 18:9–14 unadai uaminifu kamili kwa Yahwe kinyume na uaguzi na uchawi. “Mkamilifu” huhifadhi maana pana ya neno bila kudai wazi kutokuwa na dhambi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mbele za” ni usemi wa asili zaidi kuliko tafsiri ya moja kwa moja “pamoja na” katika sentensi hii.
