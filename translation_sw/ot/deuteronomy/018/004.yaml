base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: sw
  text: Utampa malimbuko[a] ya nafaka yako, ya divai yako mpya[b], na ya mafuta yako, na sehemu ya kwanza ya sufu inayokatwa kutoka kwa kundi lako[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya kwanza ya nafaka yako, divai yako mpya, na mafuta yako.”
    reason: lexical_alternative
  - marker: b
    text: “Divai mpya” hutafsiri neno la Kiebrania ambalo mara nyingi hutumiwa kwa divai iliyotengenezwa karibuni.
    reason: cultural_note
  - marker: c
    text: Au, “sehemu ya kwanza ya sufu inayonyolewa kutoka kwa kundi lako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: malimbuko / sehemu ya kwanza
  rationale: Neno hili huonyesha sehemu ya mwanzo au ya kwanza. “Malimbuko” linafaa kwa nafaka, divai, na mafuta yanayotolewa, huku “sehemu ya kwanza” ikiwa ya kawaida zaidi kwa manyoya yaliyokatwa.
- source_word: דָּגָן
  choice: nafaka
  rationale: Ni neno pana linalotaja mazao ya nafaka, wala si aina moja tu ya zao.
- source_word: תִּירוֹשׁ
  choice: divai mpya
  rationale: Neno hili kwa kawaida hurejelea divai iliyotengenezwa karibuni; “divai mpya” huhifadhi tofauti hiyo kwa Kiswahili kinachoeleweka.
- source_word: יִצְהָר
  choice: mafuta
  rationale: Hurejelea mafuta mapya, kwa kawaida mafuta ya zeituni katika mazingira ya Israeli ya kale. “Mafuta” huakisi upana wa neno la Kiebrania bila kuongeza maelezo yasiyotajwa wazi.
- source_word: גֵּז
  choice: manyoya yaliyokatwa
  rationale: Neno linaweza kumaanisha manyoya yaliyonyolewa au zao la tendo la kunyoa. Tafsiri hii inaonyesha wazi kitu kinachotolewa.
- source_word: צֹאן
  choice: kundi lako
  rationale: Neno hutaja kwa pamoja mifugo midogo, hasa kondoo na mbuzi. “Kundi lako” huhifadhi maana ya jumla bila kuibana iwe kondoo pekee.
- source_word: תִּתֶּן לּוֹ
  choice: Utampa
  rationale: Muundo huu una nguvu ya agizo la kisheria. “Utampa” ni wa asili na wenye uzito wa maagizo katika Kiswahili.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi לּוֹ (“-mpa”)
  choice: Kiwakilishi cha umoja kimehifadhiwa katika “Utampa.”
  alternative: Kutaja wazi “kuhani” au kuelekeza zawadi kwa kundi lote la makuhani.
  rationale: Muktadha wa karibu unaonyesha kuwa mpokeaji ni kuhani, lakini mstari wenyewe unatumia kiwakilishi cha umoja. Kutokitaja jina hapa kunahifadhi umbo na kiwango cha ubainisho cha maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kusomeka. “Malimbuko” huhifadhi msamiati wa utoaji wa mazao bila kulazimisha tafsiri ya kimadhehebu, na “manyoya yaliyokatwa” huepuka utata usio wa lazima wa neno “manyoya” peke yake.
