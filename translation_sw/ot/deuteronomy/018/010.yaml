base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: sw
  text: Asipatikane miongoni mwenu mtu yeyote anayempitisha mwanawe au binti yake katika moto[a], anayefanya uaguzi, anayetabiri mambo yajayo[b], anayefasiri ishara[c], au anayefanya uchawi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayemchoma mwanawe au binti yake motoni,” au “anayemtoa mwanawe au binti yake kuwa dhabihu katika moto.” Kiebrania kinasema kihalisi, “anayesababisha mwanawe au binti yake apite katika moto.”
    reason: alternative_reading
  - marker: b
    text: Neno hili la Kiebrania lina maana isiyo hakika; linaweza pia kutafsiriwa “anayefanya utabiri” au “anayechunguza nyakati.”
    reason: lexical_alternative
  - marker: c
    text: Au, “anayefanya uaguzi kwa ishara.”
    reason: lexical_alternative
  - marker: d
    text: Au, “anayefanya ulozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: Asipatikane miongoni mwenu
  rationale: Kauli ya Kiebrania iliyokanushwa ina nguvu ya katazo kuhusu jambo lisiloruhusiwa katika jumuiya ya agano. “Miongoni mwenu” ni Kiswahili cha kawaida na wazi katika muktadha huu.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: anayempitisha mwanawe au binti yake katika moto
  rationale: Hifili ya עבר ina maana halisi ya kusababisha apite. Tafsiri hii inahifadhi usemi wa Kiebrania bila kuamua kimya-kimya kama ibada hiyo ilikuwa kuchoma au kutoa mtoto kuwa dhabihu.
- source_word: קֹסֵם קְסָמִים
  choice: anayefanya uaguzi
  rationale: Kirai cha kitenzi-jina pamoja na nomino yenye mzizi uleule kinaeleza shughuli ya uaguzi kwa msisitizo. “Kufanya uaguzi” ni wazi na cha kawaida katika Kiswahili.
- source_word: מְעוֹנֵן
  choice: anayetabiri mambo yajayo
  rationale: Neno hili la Kiebrania lina maana yenye utata na limetafsiriwa kwa namna mbalimbali. Chaguo hili linaeleza desturi ya kutafuta au kudai kujua yatakayokuja, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: מְנַחֵשׁ
  choice: anayefasiri ishara
  rationale: Kitenzi hiki huhusishwa na kutafuta maana ya ishara kama msingi wa uaguzi. Tafsiri hii inakitofautisha na neno pana zaidi la uaguzi lililotangulia.
- source_word: מְכַשֵּׁף
  choice: anayefanya uchawi
  rationale: Partisipu ya Pieli inaashiria kujihusisha na matendo ya kichawi. “Kufanya uchawi” ni usemi wa kawaida, unaoeleweka, na unaolingana kisarufi na vipengele vingine vya orodha.
theological_decisions:
- issue: Asili ya katazo kuhusu mtoto na moto
  choice: Kuhifadhi usemi “anayempitisha mwanawe au binti yake katika moto” katika matini kuu.
  alternative: “Anayemchoma mwanawe au binti yake motoni” au “anayemtoa mwanawe au binti yake kuwa dhabihu katika moto.”
  rationale: Muktadha unakemea ibada ya kipagani iliyohusisha watoto na moto, lakini mstari huu kwa Kiebrania unasema kihalisi ‘kusababisha apite katika moto’ bila kufafanua hapa kila hatua ya ibada. Kuhifadhi usemi huo huepuka kuondoa utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya partisipu umehifadhiwa kwa kurudia “anaye-”. “Mwanawe” hapa humaanisha mtoto wake wa kiume, kwa kulinganishwa na “binti yake.”
