base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: sw
  text: Pia alimwasi Mfalme Nebukadneza[a], aliyemwapisha kwa Mungu; akaifanya shingo yake kuwa ngumu[b] na kuufanya moyo wake kuwa mgumu, akikataa kumrudia Yahwe, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyemfunga kwa kiapo mbele za Mungu.” Kiebrania kinaweza kukazia ama tendo la kumwapisha ama uzito wa kiapo hicho mbele za Mungu.
    reason: lexical_alternative
  - marker: b
    text: “Kufanya shingo kuwa ngumu” ni nahau ya Kiebrania inayomaanisha kukataa kwa ukaidi kutii au kubadilika.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Pia
  rationale: Inaendeleza simulizi kwa kuongeza kosa lingine la Sedekia kwa Kiswahili cha kawaida.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: alimwasi Mfalme Nebukadneza
  rationale: Kitenzi 'aliasi' pamoja na yambwa humtaja wazi mtawala ambaye uasi ulielekezwa kwake.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵאלֹהִים
  choice: ambaye alikuwa amemwapisha kwa jina la Mungu
  rationale: Hifili ya שׁבע humaanisha kumsababisha mtu aape; 'kwa jina la Mungu' huwasilisha kwa kawaida nguvu ya בֵאלֹהִים bila kuamua kwamba maana pekee ni 'mbele za Mungu'.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: Alifanya shingo yake kuwa ngumu
  rationale: Inahifadhi sitiari ya Kiebrania ya ukaidi, huku tanbihi ikiifafanua kwa msomaji wa sasa.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: kuufanya moyo wake kuwa mgumu
  rationale: Katika muktadha wa kukataa kumrudia Mungu, kitenzi cha kuutia nguvu moyo kina maana hasi ya kuufanya ukaidi.
- source_word: מִשּׁוּב אֶל יְהוָה
  choice: akikataa kumrudia Yahwe
  rationale: Muundo wa מִן pamoja na kitenzi-jina unaonyesha kujizuia au kukataa kurudi; tafsiri hii ni ya asili katika Kiswahili na huhifadhi wazo la kurudi kwa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni uwasilishaji wa kawaida na sahihi wa muundo wa Kiebrania.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia jina binafsi la agano; 'Yahwe' hulitofautisha na cheo 'Bwana' bila kuingiza msimamo wa dhehebu.
- issue: Maana ya moyo kufanywa imara
  choice: kuufanya moyo wake kuwa mgumu
  alternative: kuutia nguvu moyo wake
  rationale: Muktadha wa uasi na kukataa kurudi unaipa אמצ maana hasi ya ukaidi, lakini haiondoi uwajibikaji wa mhusika kwa tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya shingo imehifadhiwa kwa sababu ya uzito wake wa kibiblia na imefafanuliwa katika tanbihi; sentensi ya mwisho imetolewa kwa mtiririko wa asili wa Kiswahili.
