  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa vifungu unaendeleza mfululizo wa vitenzi vya Kiebrania bila kuingiza kiunganishi cha upinzani kisichokuwamo katika chanzo.
