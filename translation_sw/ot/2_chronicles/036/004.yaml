source:
  edition: WLC
  text: וַ/יַּמְלֵ֨ךְ מֶֽלֶךְ מִצְרַ֜יִם אֶת אֶלְיָקִ֣ים אָחִ֗י/ו עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יוֹאָחָ֤ז אָחִי/ו֙ לָקַ֣ח נְכ֔וֹ וַ/יְבִיאֵ֖/הוּ מִצְרָֽיְמָ/ה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: sw
  text: Mfalme wa Misri akamweka Eliakimu, ndugu ya Yoahazi, kuwa mfalme juu ya Yuda na Yerusalemu, akalibadili jina lake kuwa Yehoyakimu. Neko[a] akamchukua Yoahazi, ndugu ya Eliakimu, akampeleka Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Nekho; jina hili pia huandikwa Neko.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: akamweka ... kuwa mfalme
  rationale: Hifili ya מלך ina maana ya kusababisha mtu awe mfalme au kumweka katika ufalme. Usemi huu wa Kiswahili unaonyesha kwamba mfalme wa Misri ndiye aliyemweka Eliakimu madarakani.
- source_word: אֶלְיָקִים אָחִיו
  choice: Eliakimu, ndugu yake
  rationale: Inahifadhi uhusiano wa kindugu ulioelezwa katika Kiebrania. Kulingana na muktadha, kiwakilishi hiki kinamhusu Yoahazi.
- source_word: עַל־יְהוּדָה וִירוּשָׁלַם
  choice: atawale Yuda na Yerusalemu
  rationale: עַל katika muktadha wa kumweka mfalme inaonyesha eneo la utawala. Kiswahili cha 'atawale' ni cha asili zaidi kuliko tafsiri ya moja kwa moja 'juu ya' huku kikihifadhi maana.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ יְהוֹיָקִים
  choice: akalibadili jina lake kuwa Yehoyakimu
  rationale: Nahau ya Kiebrania inaeleza kubadilishwa kwa jina; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: לָקַח
  choice: akamchukua
  rationale: לקח kimsingi ni 'kuchukua.' Tafsiri hii haiongezi kwa wazi wazo la kukamata kwa nguvu ambalo halijasemwa moja kwa moja na kitenzi.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: akampeleka Misri
  rationale: Kiambishi cha mwelekeo katika מִצְרָיְמָה kinaonyesha mwendo kuelekea Misri. 'Akampeleka Misri' ni usemi wa kawaida wa Kiswahili na unaonyesha kwamba Neko alimtoa na kumfikisha huko.
- source_word: נְכוֹ
  choice: Neko
  rationale: Huu ni uandishi wa jina unaoeleweka kwa urahisi katika Kiswahili; tanbihi inataja umbo linaloandamana kwa karibu zaidi na matamshi ya Kiebrania.
