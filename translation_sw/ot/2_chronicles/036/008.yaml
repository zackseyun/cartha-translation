  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהֽוֹיָקִ֜ים וְ/תֹֽעֲבֹתָ֤י/ו אֲשֶׁר עָשָׂה֙ וְ/הַ/נִּמְצָ֣א עָלָ֔י/ו הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר מַלְכֵ֥י יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: sw
  text: Matendo mengine ya Yehoyakimu, machukizo aliyoyatenda, na yale yaliyopatikana dhidi yake[a]—tazama, yameandikwa katika Kitabu cha Wafalme wa Israeli na Yuda. Kisha Yehoyakini mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yale yaliyopatikana kumhusu.” Usemi wa Kiebrania unaweza kurejelea kwa ujumla mambo yaliyogunduliwa kuhusu Yehoyakimu, ingawa “dhidi yake” inafaa zaidi muktadha hasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: Matendo mengine ya Yehoyakimu
  rationale: Katika muhtasari wa kifalme, דִּבְרֵי humaanisha kwa upana matendo au matukio ya utawala; “matendo mengine” ni Kiswahili cha kawaida na huhifadhi wazo la yaliyosalia.
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: machukizo aliyoyatenda
  rationale: “Machukizo” huhifadhi uzito wa tathmini ya kimaadili au ya ibada uliomo katika תֹּעֲבוֹת, huku “aliyoyatenda” ikitoa kishazi cha Kiebrania kwa uwazi.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: na yale yaliyopatikana dhidi yake
  rationale: Usemi huu unaweza kumaanisha mambo yaliyogunduliwa kumhusu au dhidi yake. “Dhidi yake” inafaa muktadha hasi bila kuufanya usemi kuwa shtaka rasmi la kisheria.
- source_word: הִנָּם כְּתוּבִים
  choice: tazama, yameandikwa
  rationale: “Tazama” huhifadhi msisitizo wa הִנָּם unaoelekeza fikira kwenye kumbukumbu iliyoandikwa; upatanisho wa ngeli unarejelea matendo, machukizo, na mambo yaliyopatikana.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Kitabu cha Wafalme wa Israeli na Yuda
  rationale: Hili ni rejeo lenye sura ya jina la kumbukumbu; herufi kubwa katika “Kitabu” inaonyesha kazi hiyo ya kichwa bila kuongeza utambulisho usiotajwa.
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: Kisha Yehoyakini mwanawe akatawala mahali pake
  rationale: “Akatawala mahali pake” ni fomula ya kawaida ya Kiswahili kwa urithi wa kifalme; “Kisha” huonyesha mwendelezo wa simulizi unaobebwa na wayyiqtol.
theological_decisions:
- issue: Maana ya וְהַנִּמְצָא עָלָיו
  choice: yale yaliyopatikana dhidi yake
  alternative: yale yaliyopatikana kumhusu
  rationale: Muktadha wa machukizo unaunga mkono maana hasi, lakini Kiebrania hakifungi uwezekano mpana zaidi; tanbihi inalinda utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo wa muhtasari wa kifalme umehifadhiwa bila ukale usio wa lazima; majina yametolewa kwa maumbo ya kawaida ya Biblia ya Kiswahili.
