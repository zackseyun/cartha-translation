base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: sw
  text: 'Katika mwaka wa kwanza wa Koreshi, mfalme wa Uajemi, ili neno la Yahweh lililonenwa kwa kinywa cha Yeremia litimie, Yahweh aliichochea roho ya Koreshi, mfalme wa Uajemi; naye akaifanya itangazwe katika ufalme wake wote, na pia kwa maandishi, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַת
  choice: Katika mwaka wa kwanza
  rationale: Ni fomula ya wakati; kiunganishi ו hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili hapa.
- source_word: לְ/כ֨וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס
  choice: wa Koreshi mfalme wa Uajemi
  rationale: Huhifadhi fomula ya kutaja mwaka kwa jina la mtawala na cheo chake kwa Kiswahili cha kawaida.
- source_word: לִ/כְל֥וֹת דְּבַר יְהוָה
  choice: ili neno la Yahweh ... litimie
  rationale: Infinitivu inaonyesha kusudi au matokeo ya kutimizwa kwa neno la kinabii, si kumalizika tu.
- source_word: בְּ/פִי יִרְמְיָהוּ
  choice: lililonenwa kwa kinywa cha Yeremia
  rationale: Huhifadhi taswira halisi ya Kiebrania ya ujumbe wa Mungu kupitia kinywa cha nabii huku ikifanya uhusiano wake na 'neno' uwe wazi kwa Kiswahili.
- source_word: הֵעִיר
  choice: aliamsha
  rationale: Kitenzi kina maana ya kuamsha au kuchochea; 'aliamsha' huhifadhi sitiari ya chanzo bila kuifafanua kupita kiasi.
- source_word: אֶת רוּחַ כּוֹרֶשׁ
  choice: roho ya Koreshi
  rationale: Huhifadhi neno רוּחַ na uwezekano wake wa kumaanisha hali au msukumo wa ndani wa Koreshi.
- source_word: וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ
  choice: akatangaza katika ufalme wake wote
  rationale: Ni tafsiri ya kawaida ya nahau ya Kiebrania ya kueneza sauti au tangazo katika milki yote.
- source_word: וְ/גַם בְּ/מִכְתָּ֖ב
  choice: na pia akaandika
  rationale: Hutoa kwa Kiswahili cha asili tofauti kati ya tangazo la kutolewa na kuwekwa kwake katika maandishi.
- source_word: לֵ/אמֹֽר
  choice: 'akisema:'
  rationale: Ni utangulizi wa kawaida wa maneno ya moja kwa moja yanayoendelea katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia wazi Tetragramatoni; 'Yahweh' huhifadhi jina binafsi la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya רוּחַ ya Koreshi
  choice: roho ya Koreshi
  alternative: nia ya Koreshi
  rationale: Neno 'roho' huhifadhi upana na mvutano wa asili kati ya hali ya ndani, nia, na msukumo, bila kuamua kuwa ni jambo la kisaikolojia tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya tendo la Yahweh ili iwe rahisi kusomeka bila kupoteza mfuatano wa Kiebrania. Hakuna tanbihi iliyohitajika; maana ya nahau ya 'kwa kinywa cha Yeremia' imehifadhiwa ndani ya matini.
