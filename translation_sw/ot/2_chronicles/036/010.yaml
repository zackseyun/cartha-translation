base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: sw
  text: Mwaka ulipofika zamu yake[a], Mfalme Nebukadneza akatuma amlete Yehoyakini Babeli, pamoja na vyombo vya thamani vya nyumba ya Yahwe[b]. Kisha akamweka Sedekia, ndugu yake[c], kuwa mfalme juu ya Yuda na Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwaka uliporudi.” Huu ni usemi unaomaanisha mwaka ulipofikia kipindi chake cha kurudi au kugeuka; hapa haujataji wazi majira fulani.'
    reason: lexical_alternative
  - marker: b
    text: Au “vitu vya thamani vya nyumba ya Yahwe.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “ndugu yake.” Sedekia alikuwa jamaa wa karibu wa kifalme wa Yehoyakini; kwa usahihi zaidi, alikuwa ami yake, yaani ndugu wa baba yake.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: Mwaka ulipogeuka
  rationale: Huhifadhi taswira ya Kiebrania ya mwaka kurudi au kugeuka bila kuamua kimya-kimya kwamba lazima ilikuwa majira ya kuchipua.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: alituma watu wakamleta
  rationale: Muundo huu wa kawaida wa Kiswahili huonyesha kwamba mfalme alituma wajumbe au maafisa, nao wakamleta Yehoyakini, huku ukihifadhi mfuatano wa vitenzi vya Kiebrania.
- source_word: בָבֶלָה
  choice: Babeli
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea Babeli; kitenzi “wakamleta” tayari hutoa maana ya kuelekea mahali hapo kwa Kiswahili.
- source_word: כְּלֵי חֶמְדַּת
  choice: vyombo vya thamani
  rationale: “Vyombo” linafaa kwa vifaa vya hekalu, na “vya thamani” huwasilisha maana ya vitu vinavyotamaniwa, vinavyothaminiwa, au vya thamani.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi usemi halisi “nyumba” na jina la agano יְהוָה badala ya kulibadili kuwa cheo.
- source_word: וַיַּמְלֵךְ
  choice: akamweka ... kuwa mfalme
  rationale: Huwasilisha kwa kawaida maana ya kisababishi, yaani kumfanya au kumteua mtu atawale kama mfalme.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Huhifadhi neno la Kiebrania, ambalo linaweza kutumiwa kwa jamaa wa karibu, huku maelezo ya ukoo yakitolewa katika tanbihi.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: juu ya Yuda na Yerusalemu
  rationale: Huhifadhi kwa karibu usemi wa kutawala juu ya eneo la Yuda na mji wake mkuu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina maalumu la Mungu, YHWH. “Yahwe” hulitambulisha kama jina badala ya kulibadili kuwa cheo, na ni tahajia ya Kiswahili inayosomeka kwa kawaida.
- issue: Uhusiano wa Sedekia na Yehoyakini katika אָחִיו
  choice: ndugu yake, pamoja na tanbihi ya ufafanuzi
  alternative: mjomba wake; jamaa yake
  rationale: Matini yenyewe inasema “ndugu yake.” Tafsiri hailazimishi ufafanuzi wa ukoo ndani ya mstari, bali huhifadhi mvutano huo na kueleza kwamba Sedekia alikuwa hasa mjomba wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi. Jina “Yahwe” limetumiwa kwa יְהוָה; “nyumba” limehifadhiwa badala ya “hekalu,” na utata wa “ndugu yake” umeachwa katika matini na kufafanuliwa kwa tanbihi.
