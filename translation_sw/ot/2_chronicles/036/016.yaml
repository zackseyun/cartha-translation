id: 2CH.36.16
reference: 2 Chronicles 36:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: sw
  text: Lakini waliendelea kuwadhihaki wajumbe wa Mungu[a], kuyadharau maneno yake, na kuwakejeli manabii wake, mpaka ghadhabu ya Yahwe ilipoinuka dhidi ya watu wake, hata hapakuwa na dawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malaika wa Mungu.” Hapa muktadha unaunga mkono sana “wajumbe,” yaani, watu waliotumwa na Mungu, kwa sababu kishazi kinachofuata kinataja “manabii wake.”
    reason: lexical_alternative
  - marker: b
    text: Au “hapakuwa na uponyaji,” au “hali haikuweza kuponywa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: waliendelea
  rationale: Pamoja na vitenzi vinavyofuata katika umbo la participle, neno hili linaonyesha tendo lililoendelea au lililorudiwa katika simulizi la wakati uliopita.
- source_word: מַלְעִבִים
  choice: kuwadhihaki
  rationale: Kitenzi kinaonyesha kuwafanyia wengine mzaha wa dharau; “kuwadhihaki” ni Kiswahili cha kawaida kinachohifadhi uzito huo.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: wajumbe wa Mungu
  rationale: Ingawa מַלְאָךְ inaweza kumaanisha mjumbe au malaika, muktadha na ulinganifu na “manabii wake” unaelekeza kwa wajumbe wa kibinadamu waliotumwa na Mungu.
- source_word: וּבוֹזִים דְּבָרָיו
  choice: kuyadharau maneno yake
  rationale: בזה hueleza kukataa kwa dharau, na wingi wa דְּבָרָיו umehifadhiwa kwa “maneno yake.”
- source_word: וּמִתַּעְתְּעִים בִּנְבִיאָיו
  choice: kuwakejeli manabii wake
  rationale: “Kuwakejeli” linaonyesha dhihaka ya kudharau huku likitofautisha kwa kiasi usemi huu na “kuwadhihaki” wa kishazi cha kwanza.
- source_word: עַד עֲלוֹת חֲמַת יְהוָה
  choice: mpaka ghadhabu ya Yahwe ilipoinuka
  rationale: “Ilipoinuka” hufuata picha ya kitenzi עלה na kuhifadhi wazo la ghadhabu kufikia hatua ya hukumu.
- source_word: בְּעַמּוֹ
  choice: dhidi ya watu wake
  rationale: Katika muktadha wa ghadhabu, kihusishi בְּ kinaonyesha wale ambao hukumu ilielekezwa kwao.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: hata hapakuwa na dawa
  rationale: מַרְפֵּא inaweza kuwa uponyaji au dawa. “Hapakuwa na dawa” ni usemi mfupi na wa kawaida unaoonyesha kwamba hali haingeweza tena kurekebishwa.
theological_decisions:
- issue: Wanaorejelewa na “wajumbe wa Mungu”
  choice: Wajumbe wa kibinadamu wa Mungu
  alternative: Malaika wa Mungu
  rationale: Kutajwa kwa “manabii wake” katika kishazi kinacholingana kunaonyesha kwamba hawa ni wajumbe wa kinabii, si lazima viumbe wa mbinguni; tanbihi inadumisha uwezekano wa kimsamiati.
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יְהוָה; “Yahwe” hulitambulisha kama jina badala ya kulibadilisha kuwa cheo.
- issue: Mwisho wa nafasi ya kuponywa
  choice: hapakuwa na dawa
  alternative: hapakuwa na uponyaji; hali haikuweza kuponywa
  rationale: Usemi huu unahifadhi taswira ya מַרְפֵּא bila kufafanua kimadhehebu namna au wakati ambapo hukumu ikawa isiyozuilika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa matendo matatu ya dharau na marudio ya “mpaka/hata” umehifadhiwa ili kuonyesha kuongezeka kwa uasi na kufikia kwa hukumu.
