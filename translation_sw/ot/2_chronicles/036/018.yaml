  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: sw
  text: Vyombo vyote vya nyumba ya Mungu, vikubwa na vidogo, na hazina za nyumba ya Yahweh, na hazina za mfalme na maafisa wake—vyote hivyo alivipeleka Babeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל כְּלֵי
  choice: vyombo vyote
  rationale: Katika muktadha wa uporaji wa hekalu, כְּלִי humaanisha vifaa au vyombo vya ibada kwa upana; “vyombo” ni neno la kawaida na lenye hadhi linalohifadhi upana huo.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Huhifadhi tamathali ya Kiebrania kwa ukaribu bila kuifafanua moja kwa moja kuwa “hekalu,” ingawa muktadha unaonyesha hivyo.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: vikubwa na vidogo
  rationale: Huhifadhi jozi ya Kiebrania inayojumuisha vyombo vya kila ukubwa au hadhi, huku upatanisho wa kisarufi wa Kiswahili ukirejelea “vyombo.”
- source_word: וְאֹצְרוֹת
  choice: pamoja na hazina
  rationale: אֹצָר inaweza kumaanisha hazina au ghala la hazina; kwa kuwa vitu hivi vilipelekwa Babeli, “hazina” inaeleweka kwa kawaida kuwa mali zilizohifadhiwa humo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi jina la agano יְהוָה na pia taswira halisi ya “nyumba” katika Kiebrania.
- source_word: וְשָׂרָיו
  choice: na za maafisa wake
  rationale: שָׂרִים ni neno pana kwa watawala, wakuu, au wenye vyeo; “maafisa” ni Kiswahili cha sasa kisicholibana kwa maana ya wana wa kifalme.
- source_word: הַכֹּל
  choice: vyote hivyo
  rationale: Ni usemi wa kujumlisha tena orodha nzima iliyotangulia na kuhifadhi mkazo wa Kiebrania.
- source_word: הֵבִיא בָבֶל
  choice: Akavileta Babeli
  rationale: Kitenzi cha umoja kina mhusika aliyedokezwa na muktadha, yaani Nebukadneza; kiambishi “-vi-” kinarejelea kwa kawaida vitu vyote vilivyoorodheshwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umewekwa wa kawaida kwa Kiswahili kwa kutanguliza kitenzi, huku “vyote hivyo” mwishoni ikihifadhi marudio yenye mkazo ya Kiebrania.
