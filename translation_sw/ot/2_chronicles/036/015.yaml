  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: sw
  text: Yahwe[a], Mungu wa mababu zao, aliwatumia wajumbe wake tena na tena[b], kwa sababu aliwahurumia watu wake na makao yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Kiebrania ni YHWH, jina binafsi la Mungu; mara nyingi hutafsiriwa “BWANA.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “akiamka mapema na kutuma,” nahau inayoonyesha kutuma kwa bidii na kwa kurudia-rudia.'
    reason: lexical_alternative
  - marker: c
    text: Yaani, hekalu, lililotazamwa kuwa mahali pa Mungu kukaa kati ya watu wake.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha moja kwa moja jina la Mungu YHWH badala ya kulibadili kuwa cheo; umbo hili linaeleweka katika Kiswahili sanifu.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa mababu zao
  rationale: Ni tafsiri ya karibu na ya kawaida inayohifadhi rejeo la kihistoria na la agano kwa mababu wao.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: aliwatumia ... kwao
  rationale: Kitenzi kinamaanisha kutuma; wajumbe ndio waliotumwa kwa watu hao. Kiswahili hakihitaji kuongeza kitu kisichotajwa kama ‘neno’.
- source_word: בְּיַד מַלְאָכָיו
  choice: wajumbe wake
  rationale: Nahau ya Kiebrania ‘kwa mkono wa’ huonyesha njia au wakala. Katika Kiswahili, muundo wa moja kwa moja ni wa kawaida zaidi na unaepuka kudokeza mkono halisi.
- source_word: מַלְאָכָיו
  choice: wajumbe wake
  rationale: Muktadha unaelekeza kwa wajumbe wa kibinadamu, hasa manabii, bila kulazimisha maana ya malaika wa mbinguni.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: tena na tena
  rationale: Nahau halisi ya ‘kuamka mapema na kutuma’ huonyesha bidii, uharaka na kurudia-rudia. ‘Tena na tena’ huwasilisha maana hiyo kwa Kiswahili cha sasa, huku taswira ya Kiebrania ikielezwa katika tanbihi.
- source_word: כִּי חָמַל
  choice: kwa sababu aliwahurumia
  rationale: חמל huonyesha huruma inayomsukuma mtu kutosababisha madhara; ‘alihurumia’ ni ya asili na huhifadhi sababu ya kutuma wajumbe.
- source_word: עַל עַמּוֹ
  choice: watu wake
  rationale: Baada ya kitenzi ‘kuhurumia,’ Kiswahili hutumia yambwa moja kwa moja bila kihusishi kinacholingana na עַל.
- source_word: מְעוֹנוֹ
  choice: makao yake
  rationale: Neno hilo humaanisha mahali pa kukaa. Hapa linarejelea hekalu, lakini ‘makao’ huhifadhi lugha ya uwepo wa Mungu bila kuibadili moja kwa moja kuwa ‘hekalu.’
theological_decisions:
- issue: Wajumbe wake ni akina nani?
  choice: Wajumbe wa kibinadamu, hasa manabii
  alternative: Malaika wa mbinguni
  rationale: Muktadha wa onyo la Mungu kwa Yuda kabla ya hukumu unaonyesha huduma ya manabii. ‘Wajumbe’ huhifadhi maana ya neno bila kuingiza viumbe wa mbinguni.
- issue: Rejeo la ‘makao yake’
  choice: Kuhifadhi usemi ‘makao yake’
  alternative: Kulitaja moja kwa moja kuwa ‘hekalu lake’
  rationale: Kiebrania kinahusianisha huruma ya Mungu kwa watu wake na mahali pa uwepo wake. Tafsiri ya ‘makao’ inahifadhi uhusiano huo na tanbihi inafafanua rejeo la hekalu.
- issue: Maana ya ‘kuamka mapema na kutuma’
  choice: Kuitafsiri kama kutuma tena na tena
  alternative: Kuhifadhi maneno halisi ‘kuamka mapema na kutuma’ katika matini kuu
  rationale: Hii ni nahau inayosisitiza bidii na kurudia kwa Mungu, si lazima taarifa kwamba aliamka asubuhi. Tafsiri kuu inatoa maana yake, na tanbihi inahifadhi taswira ya asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kusomeka kwa watu wa kawaida. Nahau ya Kiebrania imetolewa kwa maana yake katika matini kuu, huku taswira yake ikihifadhiwa katika tanbihi.
