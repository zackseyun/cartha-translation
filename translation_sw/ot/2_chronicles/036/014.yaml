reference: 2 Chronicles 36:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: sw
  text: Tena wakuu wote wa makuhani na wa watu walizidi sana kukosa uaminifu[a], kwa kufuata machukizo yote ya mataifa. Wakaitia unajisi nyumba ya Yahweh[b], ambayo alikuwa ameiweka wakfu katika Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walizidisha ukosefu wao wa uaminifu.”
    reason: Muundo wa Kiebrania unatumia kitenzi na nomino yenye mzizi uleule ili kusisitiza kuongezeka kwa uvunjaji wa uaminifu.
  - marker: b
    text: “Yahweh” ni unukuzi wa jina la Mungu YHWH.
    reason: Kufafanua matumizi ya jina la Mungu katika matini kuu.
lexical_decisions:
- source_word: גַּם
  choice: Tena
  rationale: Inaendeleza simulizi na kuonyesha kuwa jambo hili linaongezwa kwa yaliyotangulia.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: viongozi wote wa makuhani na watu
  rationale: שָׂרֵי humaanisha viongozi au wakuu; muundo huu unawatofautisha viongozi wa makuhani na watu kwa ujumla bila kuugeuza kuwa cheo cha kiufundi.
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: walizidi sana kukosa uaminifu
  rationale: Muungano wa kitenzi na nomino yenye mzizi uleule unasisitiza kuongezeka kwa tendo la kuvunja uaminifu. Kiswahili hiki ni cha kawaida na kinadumisha uzito wa uasi wa kiagano.
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: kwa kufuata machukizo yote ya mataifa
  rationale: כְּכֹל huonyesha kufanana au kuenenda kulingana na desturi hizo; 'kwa kufuata' huwasilisha kwamba mwenendo wao uliiga matendo yenye kuchukiza ya mataifa.
- source_word: וַיְטַמְּאוּ
  choice: wakaitia unajisi
  rationale: Katika muktadha wa hekalu, kitenzi hiki huonyesha kuharibu usafi wa kidini na kimaadili; 'kutia unajisi' ni istilahi ya Kiswahili iliyo wazi na yenye uzito unaofaa.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: ‘Nyumba’ inadumisha sitiari ya Kiebrania badala ya kuibadili moja kwa moja kuwa ‘hekalu,’ huku muktadha ukiweka maana wazi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu YHWH limeandikwa kwa unukuzi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: ambayo alikuwa ameitakasa huko Yerusalemu
  rationale: Kishazi hiki kinarejelea nyumba na kueleza kuwa Yahweh alikuwa ameitenga iwe takatifu Yerusalemu.
theological_decisions:
- issue: Maana ya uvunjaji wa uaminifu katika מָעַל
  choice: kukosa uaminifu
  alternative: kutenda kwa hila; kufanya kosa
  rationale: Neno lina uzito wa kuvunja uaminifu kwa Mungu katika muktadha wa agano na ibada. ‘Kukosa uaminifu’ huhifadhi upana huo bila kuufanya kuwa kosa la kisheria tu.
- issue: Uwakilishi wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina binafsi la Mungu, YHWH. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa כְּכֹל na machukizo ya mataifa
  choice: kwa kufuata
  alternative: kama machukizo yote ya mataifa; kulingana na machukizo yote ya mataifa
  rationale: Kihusishi kinaweza kuonyesha kufanana au kufuata mfano. Tafsiri kuu inaonyesha mwenendo unaolingana na desturi hizo, huku tanbihi ikihifadhi uwezekano wa kulinganisha moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Walizidi sana kukosa uaminifu’ ni ya asili zaidi kuliko muundo wa moja kwa moja wa ‘kuzidisha ukosefu wa uaminifu,’ huku tanbihi ikihifadhi umbo hilo. ‘Kutia unajisi’ na ‘nyumba ya Yahweh’ hudumisha msamiati wa ibada na taswira ya Kiebrania.
