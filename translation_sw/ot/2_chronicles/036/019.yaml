source:
  edition: WLC
  text: וַֽ/יִּשְׂרְפוּ֙ אֶת בֵּ֣ית הָ/אֱלֹהִ֔ים וַֽ/יְנַתְּצ֔וּ אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/כָל אַרְמְנוֹתֶ֨י/הָ֙ שָׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל כְּלֵ֥י מַחֲמַדֶּ֖י/הָ לְ/הַשְׁחִֽית־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: sw
  text: Wakaiteketeza nyumba ya Mungu[a], wakaubomoa ukuta wa Yerusalemu, wakayateketeza kwa moto majumba yake yote, na wakaviharibu vitu vyake vyote vya thamani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Mungu.” Kiebrania kinasema kihalisi “nyumba ya Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vyombo vyake vyote vya thamani” au “vifaa vyake vyote vilivyothaminiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: Wakaiteketeza
  rationale: Kitenzi שׂרף katika Qal kina maana ya kuchoma au kuteketeza. Umbo la mfululizo wa simulizi limewakilishwa kwa kiambishi “waka-”.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Tafsiri ya moja kwa moja ya usemi wa Kiebrania ni “nyumba ya Mungu.” Katika muktadha huu inarejelea hekalu, lakini “nyumba” inadumisha taswira ya chanzo.
- source_word: וַיְנַתְּצוּ
  choice: wakaubomoa
  rationale: נתץ humaanisha kubomoa au kuangusha jengo; “kubomoa” ni ya kawaida na inafaa kwa ukuta.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: ukuta wa Yerusalemu
  rationale: Umoja wa Kiebrania umehifadhiwa kwa “ukuta,” ukimaanisha mfumo wa ukuta wa mji kwa ujumla.
- source_word: אַרְמְנוֹתֶיהָ
  choice: majumba yake yote
  rationale: אַרְמוֹן inaweza kumaanisha jumba la kifalme au jengo kubwa lenye ngome. “Majumba” ndiyo maana ya kawaida na inayofaa katika maelezo ya kuharibiwa kwa mji.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: wakayateketeza kwa moto
  rationale: Kirai “kwa moto” kinahifadhi בָאֵשׁ, ingawa wazo la moto tayari limo katika “kuteketeza,” na hivyo kudumisha msisitizo wa Kiebrania.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: vitu vyake vyote vya thamani
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu, huku מַחֲמַד ikionyesha kitu cha kutamaniwa au cha thamani. “Vitu ... vya thamani” ni Kiswahili cha kawaida na hakibani maana kuwa vyombo vya ibada pekee.
- source_word: לְהַשְׁחִית
  choice: kuviharibu
  rationale: Kitenzi-jina hiki kinaonyesha kusudi au matokeo ya uharibifu. Kiswahili kimekiunganisha kama tendo lingine katika mfululizo bila kulazimisha tofauti hiyo yenye utata.
