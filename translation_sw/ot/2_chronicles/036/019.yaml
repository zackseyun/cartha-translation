translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Mfululizo wa “waka-” unaakisi mwendo wa matendo katika Kiebrania, huku istilahi pana “vitu” ikihifadhi upana wa כְּלִי.
