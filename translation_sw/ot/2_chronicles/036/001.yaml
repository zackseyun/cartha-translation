  text: וַ/יִּקְחוּ֙ עַם הָ/אָ֔רֶץ אֶת יְהוֹאָחָ֖ז בֶּן יֹאשִׁיָּ֑הוּ וַ/יַּמְלִיכֻ֥/הוּ תַֽחַת אָבִ֖י/ו בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: sw
  text: Kisha watu wa nchi wakamchukua Yehoahazi mwana wa Yosia, wakamweka kuwa mfalme huko Yerusalemu badala ya baba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa kawaida.” Usemi wa Kiebrania “watu wa nchi” unaweza kumaanisha wakazi wa nchi hiyo na, katika baadhi ya mazingira, kundi fulani la kijamii miongoni mwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakamchukua
  rationale: Kitenzi לקח hapa kinaonyesha kumchukua au kumteua mtu kwa kusudi fulani; tafsiri hii haiongezi dhana ya kutumia nguvu ambayo haijaelezwa.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Tafsiri ya karibu na muundo wa Kiebrania inahifadhi uwezekano wa kumaanisha wakazi kwa jumla au kundi maalumu la kijamii bila kuamua maana finyu kimya kimya.
- source_word: יְהוֹאָחָז
  choice: Yehoahazi
  rationale: Jina limetoholewa kwa namna inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: mwana wa Yosia
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa kifamilia.
- source_word: וַיַּמְלִיכֻהוּ
  choice: wakamweka kuwa mfalme
  rationale: Hifili ya מלך ina maana ya kumsababisha mtu awe mfalme; usemi huu ni wazi na hauongezi tendo la kutawaza ambalo halikutajwa.
- source_word: תַחַת אָבִיו
  choice: badala ya baba yake
  rationale: תחת hapa inaonyesha kuchukua nafasi katika urithi wa ufalme, si kuwa chini ya baba yake.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kiambishi ב kinaonyesha mahali; 'huko' huifanya sentensi ya simulizi isomeke kwa kawaida katika Kiswahili.
