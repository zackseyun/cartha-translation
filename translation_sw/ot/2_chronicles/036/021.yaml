id: 2CH.36.21
reference: 2 Chronicles 36:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ/מַלֹּ֤אות דְּבַר יְהוָה֙ בְּ/פִ֣י יִרְמְיָ֔הוּ עַד רָצְתָ֥ה הָ/אָ֖רֶץ אֶת שַׁבְּתוֹתֶ֑י/הָ כָּל יְמֵ֤י הָשַּׁמָּ/ה֙ שָׁבָ֔תָה לְ/מַלֹּ֖אות שִׁבְעִ֥ים שָׁנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: sw
  text: ili kutimiza neno la Yahweh lililonenwa kwa kinywa cha Yeremia,[a] mpaka nchi ilipofurahia Sabato zake.[b] Siku zote za ukiwa wake, ilishika Sabato,[c] ili kutimiza miaka sabini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupitia Yeremia.” Kiebrania ni, kihalisi, “kwa kinywa cha Yeremia.”
    reason: lexical_alternative
  - marker: b
    text: Au “mpaka nchi ilipopokea” au “ilipofidia” Sabato zake; maana ni kwamba nchi ilipata pumziko la Sabato ambalo haikuwa imepewa. Maneno haya yanakumbusha onyo la agano kuhusu nchi kufurahia Sabato zake wakati wa uhamisho (tazama Walawi 26:34–35).
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: 'Au “ilipumzika.” Kiebrania huhifadhi mchezo wa maneno: “Sabato zake … ilishika Sabato.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: ili kutimiza
  rationale: Infinitivi yenye לְ inaonyesha kusudi au matokeo. “Kutimiza” huhifadhi wazo la kulifanya neno la kinabii litokee, na pia huruhusu kurudiwa kwa kitenzi hicho mwishoni mwa mstari.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: “Neno” huhifadhi nguvu ya usemi wa kinabii na uhusiano wake na kutimizwa kwake; jina la agano יְהוָה limetoholewa kuwa “Yahweh.”
- source_word: בְּפִי יִרְמְיָהוּ
  choice: lililonenwa kwa kinywa cha Yeremia
  rationale: Huhifadhi taswira halisi ya Kiebrania, “kwa kinywa cha,” huku nyongeza ya “lililonenwa” ikifanya nahau hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: רָצְתָה
  choice: ilipofurahia
  rationale: Katika muktadha huu nchi ndiyo kiima na Sabato zake ndizo yambwa; neno linaonyesha nchi kupokea au kufurahia pumziko la Sabato lililokuwa limekosekana.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Muktadha unarejelea nchi ya Yuda, si dunia nzima.
- source_word: אֶת שַׁבְּתוֹתֶיהָ
  choice: Sabato zake
  rationale: Wingi wa Kiebrania umehifadhiwa, na kiwakilishi “zake” kinaonyesha kwamba Sabato hizo ni za nchi.
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: Siku zote za ukiwa wake
  rationale: Usemi huu unahusu kipindi chote ambacho nchi ilikuwa imeachwa ukiwa; “wake” huweka wazi kuwa ukiwa ni wa nchi.
- source_word: שָׁבָתָה
  choice: ilሽika Sabato
  rationale: “Ilishika Sabato” huhifadhi uhusiano wa kimakusudi kati ya nomino שַׁבְּתוֹתֶיהָ na kitenzi שָׁבָתָה, badala ya kuufanya kuwa pumziko la kawaida tu.
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: ili kutimiza miaka sabini
  rationale: Huhifadhi kurudiwa kwa לְמַלֹּאות na muda wa kinabii wa miaka sabini bila kuamua kupita kiasi ikiwa usemi unaonyesha kusudi au matokeo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la pekee la Mungu, si cheo tu. “Yahweh” huhifadhi jina hilo kwa kulitohoa moja kwa moja.
- issue: Kuhifadhi teolojia na mchezo wa maneno wa Sabato katika שַׁבְּתוֹתֶיהָ / שָׁבָתָה
  choice: Sabato zake … ilishika Sabato
  alternative: mapumziko yake … ilipumzika
  rationale: Kiebrania kinaunganisha kwa makusudi Sabato za nchi na tendo lake la kupumzika wakati wa uhamisho. Kutumia “Sabato” katika sehemu zote mbili huweka wazi uhusiano huo na onyo la agano bila kuugeuza kuwa pumziko la kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kinabii “neno la Yahweh” na urudiaji wa “kutimiza” umehifadhiwa. “Yeremia” ni umbo lililozoeleka katika Kiswahili. “Ilishika Sabato” limetumiwa kimakusudi ili kuhifadhi mchezo wa maneno wa Kiebrania.
