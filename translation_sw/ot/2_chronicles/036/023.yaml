    rationale: “na awe” baada ya kirai nomino si muundo wa kawaida wa baraka katika Kiswahili. Bila kiunganishi hicho, “Yahwe, Mungu wake, awe pamoja naye” huwasilisha kwa wazi usomaji wa benedictory/jussive unaopendelewa na muktadha.
