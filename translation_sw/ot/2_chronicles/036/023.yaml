  to: 'Koreshi, mfalme wa Uajemi, asema hivi: “Yahwe[a], Mungu wa mbinguni, amenipa falme zote za dunia, naye ameniagiza nimjengee nyumba Yerusalemu, ulioko Yuda. Yeyote miongoni mwenu aliye wa watu wake—Yahwe, Mungu wake, awe pamoja naye[b]—naye apande[c].”'
  rationale: 'Marekebisho yanaondoa usemi usio wa asili na usio sahihi kiuhusiano katika “aliye wa watu wake wote,” bila kulazimisha tafsiri ya dhehebu au kutatua zaidi ya inavyohitajika ubanaji wa Kiebrania. Pia yanaweka kishazi cha mwisho katika Kiswahili sahihi cha baraka: Yahwe ndiye kiima cha “awe pamoja naye,” kisha mwitikio wa mwaliko unaendelea kwa “naye apande.” Alama za tanbihi zote zimehifadhiwa na tanbihi b imelinganishwa na matini iliyorekebishwa.'
