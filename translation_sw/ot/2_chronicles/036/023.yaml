source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: sw
  text: 'Koreshi, mfalme wa Uajemi, asema hivi: “Yahwe[a], Mungu wa mbinguni, amenipa falme zote za dunia, naye ameniagiza nimjengee nyumba Yerusalemu, ulioko Yuda. Yeyote miongoni mwenu aliye wa watu wake—Yahwe, Mungu wake, awe pamoja naye[b]—naye apande[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahwe ni jina binafsi la Mungu linalowakilishwa na herufi nne za Kiebrania YHWH.
    reason: divine_name
  - marker: b
    text: Au, “Yahwe, Mungu wake, yuko pamoja naye.” Kiebrania kinaweza kueleweka kama taarifa, ingawa katika muktadha huu maana ya baraka inaelekea kufaa zaidi.
    reason: alternative_reading
  - marker: c
    text: Yaani, apande kwenda Yerusalemu. Katika Biblia, “kupanda” ni usemi wa kawaida wa kwenda katika mji huo mtakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni fomula ya kawaida ya kutangaza ujumbe au amri; wakati uliopo unafaa katika tangazo la kifalme.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Koreshi mfalme wa Uajemi
  rationale: Koreshi na Uajemi ni maumbo yaliyozoeleka katika Kiswahili cha Biblia na historia.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: falme zote za dunia
  rationale: Hapa אֶרֶץ ina maana pana ya ulimwengu wa kisiasa, si nchi ya Yuda pekee.
- source_word: נָתַן לִי
  choice: amenipa
  rationale: Wakati timilifu unaonyesha tendo lililokwisha ambalo matokeo yake yanaendelea katika mamlaka ya Koreshi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Mungu wa mbinguni
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili unaowakilisha muundo wa Kiebrania.
- source_word: וְהוּא פָקַד עָלַי
  choice: naye ameniagiza
  rationale: פָקַד hapa humkabidhi mtu jukumu kwa mamlaka; 'ameniagiza' ni wazi na ya asili bila kuongezea wadhifa.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: nimjengee nyumba
  rationale: Neno בַיִת ni 'nyumba'; limedumishwa badala ya kufasiriwa moja kwa moja kuwa 'hekalu'.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: huko Yerusalemu, ulioko Yuda
  rationale: Kiwakilishi cha mahali 'huko' kinaifanya sentensi iwe ya asili, huku kishazi husishi cha Kiebrania kikidumishwa.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Yeyote miongoni mwenu aliye wa watu wake wote
  rationale: Muundo uliobanwa wa Kiebrania unaeleweka kama mwaliko kwa yeyote aliye sehemu ya watu wake; Kiswahili hiki kinadumisha neno 'wote' na uhusiano wa uanachama.
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: Yahwe Mungu wake na awe pamoja naye
  rationale: Katika muktadha huu kishazi kinaeleweka kwa kawaida kuwa baraka au ombi, si taarifa tambarare.
- source_word: וְיָעַל
  choice: na apande
  rationale: Kitenzi cha kupanda kinadumisha nahau ya kibiblia ya kwenda Yerusalemu na nguvu ya mwaliko/amri.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; 'Yahwe' hulidumisha kama jina binafsi.
- issue: Maana ya בַיִת
  choice: nyumba
  alternative: hekalu
  rationale: Kiebrania kinasema 'nyumba.' Muktadha unaonyesha kuwa ni nyumba ya Mungu, yaani hekalu, lakini tafsiri kuu inadumisha taswira ya chanzo.
- issue: Nguvu ya יְהוָה אֱלֹהָיו עִמּוֹ
  choice: 'baraka/ombi: “Yahwe Mungu wake na awe pamoja naye”'
  alternative: 'taarifa: “Yahwe Mungu wake yuko pamoja naye”'
  rationale: Muktadha wa mwaliko wa kurudi Yerusalemu unapendelea maana ya baraka, ingawa Kiebrania hakina kitenzi kilichoandikwa na kinaweza kusomwa kama taarifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tangazo la kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mwisho umewekewa vistari virefu ili baraka isomwe kama kishazi kinachoambatana na mwaliko, bila kuficha ubanaji wa Kiebrania.
