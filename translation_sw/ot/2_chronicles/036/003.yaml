translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi wenye “akamwondoa” na “akaitoza” ni wa kawaida katika maandiko ya kihistoria. “Madarakani” huweka wazi maana ya kisiasa inayowezekana sana katika muktadha, na tanbihi huhifadhi upana halisi wa kitenzi cha Kiebrania.
