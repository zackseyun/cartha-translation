base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: sw
  text: Naye mfalme wa Misri akamwondoa huko Yerusalemu, na akaitoza nchi talanta mia moja za fedha na talanta moja ya dhahabu.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwondoa madarakani” au “akampeleka mbali.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwondoa mtu katika cheo au kumchukua kutoka mahali pake.
    reason: alternative_reading
  - marker: b
    text: Au, “akaipiga nchi faini.” Kitenzi hiki hurejelea kutoza adhabu ya fedha.
    reason: lexical_alternative
  - marker: c
    text: Talanta ilikuwa kipimo kikubwa cha uzani; kipimo hiki cha kale kimehifadhiwa bila kubadilishwa kuwa kipimo cha kisasa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: akamwondoa madarakani
  rationale: Kitenzi סור katika kausativi humaanisha kumwondoa au kumpeleka mbali. Katika muktadha huu wa kifalme, “kumwondoa madarakani” huwasilisha hatua dhidi ya mfalme kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya kumpeleka mbali.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa muundo wa umilikaji, bila kuingiza jina la Farao lisilotajwa katika mstari huu.
- source_word: בִּירוּשָׁלָם
  choice: huko Yerusalemu
  rationale: Kihusishi ב hapa kinaonyesha mahali. “Huko Yerusalemu” ni cha asili katika simulizi na kinaweza kuhusishwa na tendo la kumwondoa.
- source_word: וַיַּעֲנֹשׁ
  choice: akaitoza
  rationale: Kitenzi ענשׁ kinaweza kumaanisha kuweka adhabu ya fedha au faini. Kwa kuwa kiasi cha fedha kinafuata, “akaitoza” huonyesha wazi dai la kifedha bila kulifafanua kupita kiasi kuwa kodi ya kawaida.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: אָרֶץ hapa inaelekeza kwa nchi au ufalme wa Yuda, si dunia kwa ujumla.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: talanta mia moja za fedha
  rationale: Kipimo cha kale כִּכָּר kinahifadhiwa kama “talanta” badala ya kubadilishwa kuwa kipimo cha kisasa; idadi mia moja imetolewa wazi.
- source_word: וְכִכַּר זָהָב
  choice: na talanta moja ya dhahabu
  rationale: Umoja wa kipimo umehifadhiwa wazi kwa “talanta moja,” sambamba na maandishi ya Kiebrania.
