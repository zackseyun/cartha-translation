id: 2CH.36.17
reference: 2 Chronicles 36:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: sw
  text: Kwa hiyo Mungu akamleta dhidi yao mfalme wa Wakaldayo[a], naye akawaua vijana wao wa kiume kwa upanga ndani ya nyumba yao takatifu. Hakumhurumia[c] kijana wa kiume wala bikira[b], mzee wala mzee sana. Mungu akawatia wote mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme wa Wababeli”; Kiebrania, “Wakaldayo.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia neno “bikira,” yaani mwanamke kijana ambaye ni bikira.
    reason: lexical_clarification
  - marker: c
    text: Au, “Hakuwasaza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: akamleta dhidi yao
  rationale: Hifili ya עלה pamoja na עַל ina maana ya kusababisha mtu aje dhidi ya wengine katika muktadha wa kijeshi. Kiswahili hiki kinahifadhi maana ya kisababishi bila kuwa kizito.
- source_word: מֶלֶךְ כשדיים
  choice: mfalme wa Wakaldayo
  rationale: כשדים ni Wakaldayo kwa maana ya moja kwa moja; katika muktadha huu jina hilo pia linaweza kurejelea Wababeli.
- source_word: וַיַּהֲרֹג
  choice: naye akawaua
  rationale: Kitenzi kinamaanisha kuua. Kiunganishi hiki kinaonyesha wazi kwamba mfalme ndiye aliyetenda tendo hilo.
- source_word: בַּחוּרֵיהֶם
  choice: vijana wao
  rationale: בחור humaanisha vijana wa kiume walio katika nguvu za ujana. Katika sentensi hii, 'vijana wao' ni ya kawaida na muktadha unaweka wazi kundi linalokusudiwa.
- source_word: בַּחֶרֶב
  choice: kwa upanga
  rationale: Hii ni tafsiri ya kawaida ya kifungu cha chombo kilichotumiwa kuua.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: ndani ya nyumba yao takatifu
  rationale: Inahifadhi picha halisi ya 'nyumba ya patakatifu pao' kwa Kiswahili cha kawaida na kusisitiza unajisi wa mahali patakatifu.
- source_word: וְלֹא חָמַל
  choice: Hakumhurumia
  rationale: חמל huunganisha huruma na tendo la kumwacha mtu hai. 'Hakumhurumia' huhifadhi nguvu yake ya kihisia; 'hakumsaza' ni uwezekano mwingine.
- source_word: בָּחוּר וּבְתוּלָה
  choice: kijana wa kiume wala bikira
  rationale: בחור ni kijana wa kiume, na בתולה humaanisha hasa mwanamke kijana ambaye hajaolewa na ambaye ni bikira. Tofauti hiyo imehifadhiwa.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: mzee wala mkongwe
  rationale: Maneno mawili ya Kiebrania yanataja hatua zinazokaribiana za uzee, huku יָשֵׁשׁ ikisisitiza uzee mkubwa zaidi. 'Mzee' na 'mkongwe' huhifadhi urudufu huo wa kimakusudi.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: Mungu akawatia wote mkononi mwake
  rationale: Nahau ya 'kutia mkononi' humaanisha kuwaweka chini ya mamlaka yake. 'Wote' inaelekezwa kwa watu waliotajwa, na kumtaja Mungu kunaondoa utata wa viwakilishi ambao Kiswahili kingeweza kuleta.
theological_decisions:
- issue: Mtendaji wa kitenzi cha kwanza na cha mwisho
  choice: Mungu ndiye aliyemleta mfalme na kuwatia watu mkononi mwa mfalme.
  alternative: Kutumia 'yeye' katika vifungu vyote na kuacha marejeo yategemee muktadha.
  rationale: Vitenzi vya Kiebrania vina mtendaji wa nafsi ya tatu umoja wa kiume, ambaye anatambulishwa na muktadha uliotangulia kuwa BWANA. Katika Kiswahili, 'yeye' mwishoni ingeweza kueleweka kimakosa kuwa mfalme; kwa hiyo 'Mungu' limetumiwa ili kuhifadhi marejeo ya muktadha bila kuongeza fundisho jipya.
- issue: Maana ya חמל katika hukumu
  choice: Hakumhurumia
  alternative: Hakumsaza
  rationale: Neno linaweza kusisitiza ama kutokuwa na huruma ama kutomsaza mtu kwa sababu ya huruma. Tafsiri kuu inahifadhi kipengele cha huruma, huku mbadala ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Nyumba yao takatifu' huhifadhi taswira ya Kiebrania kuliko kutumia tu 'hekalu.' Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
