revisions:
- from: Kwa hiyo akamleta dhidi yao mfalme wa Wakaldayo[a], naye akawaua vijana wao kwa upanga ndani ya nyumba yao takatifu. Hakumhurumia kijana wa kiume wala bikira[b], mzee wala mkongwe[c]. Mungu akawatia wote mkononi mwake.
  to: Kwa hiyo Mungu akamleta dhidi yao mfalme wa Wakaldayo[a], naye akawaua vijana wao wa kiume kwa upanga ndani ya nyumba yao takatifu. Hakumhurumia[c] kijana wa kiume wala bikira[b], mzee wala mzee sana. Mungu akawatia wote mkononi mwake.
  rationale: The revision preserves the Hebrew causative action and its contextual divine subject, explicitly retains the young men in the first clause, and uses a clearer expression for the second, intensified old-age term. It also relocates the compassion/spare alternative to the verb it interprets and clarifies the lexical note on bikira without adding an unwarranted cultural definition.
