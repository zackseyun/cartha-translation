  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: sw
  text: Yehoyakimu alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, naye akatawala miaka kumi na moja Yerusalemu. Alifanya yaliyo maovu machoni pa Yahwe, Mungu wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni nahau ya Kiebrania ya kutaja umri. Tafsiri hii inatoa maana yake kwa Kiswahili cha kawaida bila kunakili kwa ugumu usemi ‘mwana wa miaka.’
- source_word: יְהוֹיָקִים
  choice: Yehoyakimu
  rationale: Jina limetoholewa kwa tahajia inayofaa mfumo wa sauti na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Kiambishi בְּ pamoja na umbo la מָלַךְ huonyesha wakati wa kuingia katika ufalme; usemi huu ni wa asili na wazi katika Kiswahili.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: naye akatawala miaka kumi na mmoja
  rationale: Kitenzi מָלַךְ humaanisha kutawala au kuwa mfalme. ‘Akatawala’ ni fasaha katika taarifa ya muda wa utawala.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Hiki ni kishazi cha mahali; ‘huko’ kinaelekeza kwa kawaida mahali ambako utawala ulifanyika.
- source_word: וַיַּעַשׂ הָרַע
  choice: Alifanya yaliyo maovu
  rationale: Tafsiri hii inadumisha nguvu ya kitenzi ‘alifanya’ na hukumu ya kimaadili ya הָרַע kwa Kiswahili cha kawaida.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Usemi huu unahifadhi taswira ya Kiebrania huku ukieleweka kwa Kiswahili kama tathmini kutoka kwa mtazamaji anayetajwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo; ‘Yahwe’ ni umbo linalofaa tahajia ya Kiswahili.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kinamrejelea Yehoyakimu na kinahifadhi uhusiano unaoelezwa katika chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi YHWH. Kulitohowa kama ‘Yahwe’ kunalihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wazi na wa kisasa. Muundo wa taarifa ya kifalme umehifadhiwa bila kuwa wa kikale au mgumu.
