  text: Jehoahaz was twenty-three years old when he became king[a], and he reigned three months in Jerusalem.
translation:
  language: sw
  text: Yoahazi alikuwa na umri wa miaka ishirini na mitatu alipoanza kutawala[a], naye akatawala Yerusalemu kwa miezi mitatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “alikuwa mwana wa miaka ishirini na mitatu”—nahau ya kawaida ya Kiebrania ya kutaja umri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁל֧וֹשׁ וְעֶשְׂרִ֛ים שָׁנָ֖ה
  choice: alikuwa na umri wa miaka ishirini na mitatu
  rationale: Hii ni nahau ya kawaida ya Kiebrania inayomaanisha umri. Kiswahili cha sasa hueleza maana hiyo kwa kawaida kwa kusema ‘alikuwa na umri wa miaka ...’.
- source_word: יוֹאָחָז
  choice: Yoahazi
  rationale: Jina limeandikwa kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili na inayolingana na matamshi ya Kiswahili.
- source_word: בְּמָלְכ֑וֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati alipoingia katika utawala; ‘alipoanza kutawala’ ni wa asili na wazi katika Kiswahili.
- source_word: וּשְׁלֹשָׁ֣ה חֳדָשִׁ֔ים
  choice: kwa miezi mitatu
  rationale: Kirai cha muda kinaelezwa kwa Kiswahili cha kawaida kwa ‘kwa miezi mitatu’.
- source_word: מָלַ֖ךְ
  choice: akatawala
  rationale: Katika taarifa za kifalme, kitenzi hiki humaanisha kutawala kama mfalme; ‘akatawala’ ni kifupi na cha kawaida.
- source_word: בִּירוּשָׁלִָֽם
  choice: huko Yerusalemu
  rationale: Kihusishi cha Kiebrania kinaonyesha mahali. ‘Huko Yerusalemu’ kinaeleza eneo hilo kwa Kiswahili cha kawaida.
