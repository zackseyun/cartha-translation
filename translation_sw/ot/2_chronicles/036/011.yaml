  text: Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem.
translation:
  language: sw
  text: Sedekia alikuwa na umri wa miaka ishirini na moja alipoanza kutawala; naye alitawala kwa miaka kumi na moja huko Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na mmoja
  rationale: Katika kauli ya Kiebrania kuhusu umri, בֶּן pamoja na idadi humaanisha kuwa mtu alikuwa na umri fulani; Kiswahili cha sasa hueleza jambo hili kwa kawaida kwa ‘alikuwa na umri wa miaka ...’.
- source_word: צִדְקִיָּהוּ
  choice: Sedekia
  rationale: Jina limetolewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati wa kuanza kwa utawala wake; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: kwa miaka kumi na mmoja
  rationale: Idadi hii inaonyesha muda wa utawala, na ‘kwa miaka’ huwasilisha muda huo kwa Kiswahili cha kawaida.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi hiki humaanisha kutawala kama mfalme; ‘alitawala’ ni kifupi, cha asili, na hakihitaji kurudia neno ‘mfalme’.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo la Kiswahili lililozoeleka, huku kihusishi cha mahali kikieleweka ndani ya muundo ‘alitawala Yerusalemu’.
