  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: sw
  text: Akafanya yaliyo mabaya machoni pa Yahwe, Mungu wake. Hakujinyenyekeza mbele ya Yeremia nabii, aliyenena kutoka kinywani mwa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “aliyenena kwa agizo la Yahwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Akafanya yaliyo maovu
  rationale: Kauli hii ya kawaida ya Kiebrania inamaanisha kufanya mambo yaliyo maovu. Muundo wa Kiswahili ni wa asili huku ukiendeleza simulizi.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi taswira ya Kiebrania ya kutathmini jambo kwa mtazamo wa mtu, na ni nahau inayoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Huhifadhi kiambishi cha umilikaji kinachosisitiza kwamba Yahwe alikuwa Mungu wake.
- source_word: לֹא נִכְנַע
  choice: hakujinyenyekeza
  rationale: 'Nifali hapa ina maana ya kujirejelea au hali ya kati: Sedekia alikataa kujishusha na kutii.'
- source_word: מִלִּפְנֵי
  choice: mbele ya
  rationale: Huwakilisha kwa ufupi uhusiano na Yeremia, ambaye mbele yake Sedekia alipaswa kujinyenyekeza.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: nabii Yeremia
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na huhifadhi jina pamoja na wajibu wake wa kinabii.
- source_word: מִפִּי יְהוָה
  choice: aliyesema kwa kinywa cha Yahwe
  rationale: Kiebrania hakina kitenzi wazi katika kifungu hiki, lakini uhusiano wake na nabii unadokeza kunena. Tafsiri hii huhifadhi taswira halisi ya kinywa na mamlaka ya ujumbe wa kinabii.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la agano; kulitohowa kama “Yahwe” hulitofautisha na cheo na kuhifadhi marejeo ya moja kwa moja ya chanzo.
- issue: Uhusiano wa maneno מִפִּי יְהוָה na Yeremia
  choice: Yanaeleza kwamba Yeremia alisema kwa kinywa cha Yahwe
  alternative: Yanaweza kutafsiriwa kiidioma kuwa Yeremia alisema kwa agizo la Yahwe
  rationale: Muundo wa Kiebrania unaunganisha Yeremia nabii na chanzo cha ujumbe wake. Taswira ya “kinywa” imehifadhiwa bila kuondoa maana ya mamlaka ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau za chanzo zimehifadhiwa pale zinapoeleweka, bila kufanya sentensi kuwa ngumu.
