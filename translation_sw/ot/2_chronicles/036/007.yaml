base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: sw
  text: Nebukadneza pia alileta baadhi ya vyombo vya nyumba ya Yahweh Babeli, kisha akaviweka katika hekalu lake[a] huko Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jumba lake la kifalme,” kwa sababu neno la Kiebrania linaweza kumaanisha hekalu au jumba la kifalme kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/כְּלֵי
  choice: pia ... baadhi ya vyombo
  rationale: וּ huendeleza simulizi kwa maana ya nyongeza, na מִן ina nguvu ya sehemu; Kiswahili cha asili kinaeleza hilo kwa “pia ... baadhi ya vyombo.”
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Huhifadhi taswira halisi ya Kiebrania “nyumba ya Yahweh” kwa lugha inayoeleweka, bila kuibadili kimya kuwa “hekalu.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: הֵבִיא ... לְ/בָבֶל
  choice: alichukua ... na kuvipeleka Babeli
  rationale: Hiphil ya בוא inaonyesha kuvifikisha vyombo mahali panapolengwa. Muundo huu wa Kiswahili unaonyesha wazi kuwa vilichukuliwa na kupelekwa Babeli.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadneza
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili na linafaa kwa wasomaji wa Afrika Mashariki.
- source_word: וַ/יִּתְּנֵם
  choice: kisha akaviweka
  rationale: נתן hapa ina maana ya kuweka vitu mahali fulani; “akaviweka” ni ya kawaida na sahihi, huku “kisha” ikionyesha hatua inayofuata katika simulizi.
- source_word: בְּ/הֵיכָל/וֹ
  choice: katika hekalu lake
  rationale: הֵיכָל inaweza kumaanisha hekalu au jumba la kifalme. Muktadha wa vyombo vitakatifu unaunga mkono “hekalu,” huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: בְּ/בָבֶל
  choice: huko Babeli
  rationale: בְּ ni ya mahali; “huko Babeli” ni Kiswahili cha kawaida na huepuka kurudia kwa namna nzito.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הֵיכָל kuhusu jengo la Nebukadneza
  choice: hekalu lake
  alternative: jumba lake la kifalme
  rationale: Kwa sababu vyombo vya nyumba ya Yahweh vinawekwa katika jengo la Babeli, maana ya mahali pa ibada inaelekea kufaa zaidi; hata hivyo, neno lenyewe linaweza pia kutaja jumba la kifalme, hivyo uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku maana ya sehemu katika מִכְּלֵי, jina Yahweh, na utata wa הֵיכָל vikihifadhiwa.
