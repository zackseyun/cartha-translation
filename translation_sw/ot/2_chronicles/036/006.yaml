translation:
  language: sw
  text: Nebukadneza, mfalme wa Babeli, akamjia, akamfunga kwa pingu za shaba ili ampeleke Babeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa minyororo ya shaba” au “kwa vifungo vya shaba.” Neno la Kiebrania linarejelea vizuizi vya shaba vilivyowekwa ili kumfunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: akapanda dhidi yake
  rationale: Nahau hii katika muktadha wa kijeshi inaonyesha kusonga dhidi ya mtu. Tafsiri hii inadumisha taswira ya kuelekea juu iliyo katika kitenzi עָלָה, huku ikionyesha wazi uhasama bila kuongeza wazo la shambulio kamili.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadneza
  rationale: Hili ni umbo la jina linalotambulika na kutumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Kirai hiki kinamtambulisha Nebukadneza kwa cheo chake cha kifalme kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וַיַּאַסְרֵהוּ
  choice: akamfunga
  rationale: Kitenzi אָסַר humaanisha kumfunga mtu, hasa mfungwa; uchaguzi huu ni wa moja kwa moja na unaafikiana na kifaa cha kumzuia kinachotajwa baadaye.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: kwa pingu za shaba
  rationale: Neno hili linarejelea vifaa vya shaba vya kumzuia mfungwa. “Pingu za shaba” ni Kiswahili cha sasa na halisi, bila kuamua kimya-kimya kama vilikuwa minyororo au vifungo vya miguu.
- source_word: לְהֹלִיכוֹ
  choice: ili ampeleke
  rationale: Hifili ya הלך hapa ina maana ya kumsababisha mtu aende; katika muktadha huu ni kumsafirisha mateka hadi mahali palipotajwa.
- source_word: בָּבֶלָה
  choice: Babeli
  rationale: He ya mwelekeo inaonyesha kwamba Babeli ndiyo mahali alipokusudiwa kupelekwa; kitenzi “ampeleke” tayari hubeba maana ya kuelekea huko, hivyo kihusishi cha ziada hakihitajiki kwa Kiswahili asilia.
