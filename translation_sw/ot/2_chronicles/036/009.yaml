base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: sw
  text: Yehoyakini alikuwa na umri wa miaka minane alipoanza kutawala[a], naye akatawala huko Yerusalemu kwa miezi mitatu na siku kumi. Alifanya yaliyo mabaya machoni pa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika 2 Wafalme 24:8 imeandikwa “miaka kumi na minane” badala ya “miaka minane.”
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: alikuwa na umri wa miaka minane
  rationale: Nahau ya Kiebrania kwa umri, kihalisi ‘mwana wa miaka minane,’ imetafsiriwa kwa Kiswahili cha kawaida bila kubadili idadi iliyo katika matini ya WLC.
- source_word: יְהוֹיָכִין
  choice: Yekonia
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotumiwa kwa kawaida katika mapokeo ya Biblia za Kiswahili.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo wenye ב unaonyesha wakati wa kuanza utawala; tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: kwa miezi mitatu na siku kumi
  rationale: Hutoa muda wa utawala kwa uwazi na kwa mpangilio wa matini ya Kiebrania.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki ndicho usemi wa kawaida wa Kiswahili kwa mtu kutenda kama mfalme.
- source_word: בִּירוּשָׁלָם
  choice: huko Yerusalemu
  rationale: Kihusishi cha mahali kimetolewa kwa Kiswahili cha kawaida; ‘huko’ huunganisha mahali na taarifa ya muda kwa ufasaha.
- source_word: וַיַּעַשׂ הָרַע
  choice: Alifanya yaliyo maovu
  rationale: Huhifadhi wazo la kufanya kile kilichotathminiwa kuwa kiovu, badala ya kulifanya kuwa sifa ya jumla tu ya tabia.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini mbele za Mungu kwa usemi unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo kama ‘BWANA.’
theological_decisions:
- issue: Tofauti ya umri ikilinganishwa na 2 Wafalme 24:8
  choice: Kudumisha ‘miaka minane’ katika matini kuu
  alternative: miaka kumi na minane
  rationale: Matini ya WLC iliyotolewa inasema miaka minane. Tofauti na kifungu sambamba haijapatanishwa kimya kimya, bali imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji wa Biblia bila kuwa wa kizamani; tofauti ya kimatini imehifadhiwa kwa tanbihi.
