id: 2CH.36.20
reference: 2 Chronicles 36:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֶּ֛גֶל הַ/שְּׁאֵרִ֥ית מִן הַ/חֶ֖רֶב אֶל בָּבֶ֑ל וַֽ/יִּהְיוּ ל֤/וֹ וּ/לְ/בָנָי/ו֙ לַ/עֲבָדִ֔ים עַד מְלֹ֖ךְ מַלְכ֥וּת פָּרָֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: sw
  text: Akawapeleka uhamishoni Babeli wale walionusurika upanga; nao wakawa watumwa[a] wake na wa wanawe mpaka ufalme wa Uajemi ulipoanza kutawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi.” Neno la Kiebrania linaweza kumaanisha watumishi au watumwa, lakini hapa muktadha wa ushindi na uhamisho unaunga mkono “watumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Akawapeleka uhamishoni
  rationale: Kitenzi גלה katika kausativi kinaeleza kuwahamisha watu kwa nguvu. Kauli hii ni ya kawaida kwa Kiswahili na inahifadhi wazo la kupelekwa uhamishoni.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: wale waliosalia wasiuawe kwa upanga
  rationale: Kirai hiki kihalisi kinahusu waliosalia kutokana na upanga, yaani watu waliookoka katika mauaji ya vita. Tafsiri hii inaeleweka kwa urahisi bila kupoteza picha ya upanga.
- source_word: אֶל בָּבֶל
  choice: Babeli
  rationale: Hili ni jina la mahali walikopelekwa; mwelekeo tayari unaonyeshwa na kitenzi 'akawapeleka'.
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: nao wakawa watumwa wake na wa wanawe
  rationale: עֲבָדִים inaweza kumaanisha watumishi au watumwa. Katika muktadha wa ushindi, kuhamishwa kwa nguvu, na kutiishwa chini ya mfalme wa Babeli, 'watumwa' linaonyesha vizuri hali yao ya kulazimishwa.
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: mpaka ufalme wa Uajemi ulipoanza kutawala
  rationale: מְלֹךְ ni hali ya kutawala au kuanza kutawala. Muundo huu wa Kiswahili unaonyesha kikomo cha wakati kwa njia ya asili huku ukihifadhi ufalme wa Uajemi kuwa mtendaji wa utawala.
theological_decisions:
- issue: Hali ya waliotekwa iliyoelezwa kwa עֲבָדִים
  choice: watumwa
  alternative: watumishi
  rationale: Neno la Kiebrania lina maana zote mbili, lakini muktadha wa vita, utekaji, uhamisho wa lazima, na kutiishwa na dola unaunga mkono 'watumwa.' Maana mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la kihistoria. Neno 'Uajemi' limetumiwa kwa Persia, na semikoloni inatenganisha uhamisho na matokeo ya kutiishwa.
