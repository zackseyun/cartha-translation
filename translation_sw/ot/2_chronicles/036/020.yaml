  to: Akawapeleka uhamishoni Babeli wale walionusurika upanga; nao wakawa watumwa[a] wake na wa wanawe mpaka ufalme wa Uajemi ulipoanza kutawala.
  rationale: 'A safe idiomatic correction replaces the awkward rendering of “the remnant from the sword” with “wale walionusurika upanga.” No other change is needed: the verse retains the Hebrew sequence, the coercive force of exile, the historically appropriate terminology, and the lexical-alternative footnote.'
