  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: sw
  text: Yothamu akalala na baba zake[a], nao wakamzika katika mji wa Daudi. Kisha Ahazi mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya nahau, “alikufa.” Kiebrania kinasema “akalala na baba zake,” kauli ya kawaida ya kifalme kuhusu kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Katika kauli ya kifalme kuhusu kifo, kitenzi hiki ni nahau inayomaanisha kufa. ‘Akalala’ kinahifadhi taswira na kauli ya Kiebrania bila kuifasiri moja kwa moja kuwa ‘akafa.’
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Hii inahifadhi nahau ya kawaida ya ukoo wa kifalme; ‘baba zake’ hapa huwarejelea waliomtangulia katika ukoo.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: nao wakamzika
  rationale: Kiebrania kina kitenzi cha wingi katika hali ya kutenda. ‘Nao’ huwasilisha mtendaji asiyeainishwa kwa njia ya kawaida katika Kiswahili.
- source_word: בְּעִיר דָּוִיד
  choice: katika Mji wa Daudi
  rationale: Ni jina maalumu la mahali; herufi kubwa katika ‘Mji’ husaidia kuonyesha matumizi hayo.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya urithi wa kifalme, neno hili linaonyesha kuanza na kuendesha utawala wa kifalme; ‘akatawala’ ni la kawaida na fasaha.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa kurithi ufalme, maana ni kwamba Ahazi alimrithi Yothamu katika cheo na utawala.
- source_word: יוֹתָם
  choice: Yothamu
  rationale: Umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: אָחָז
  choice: Ahazi
  rationale: Umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Huhifadhi wazi uhusiano wa mwana na baba katika taarifa ya urithi.
