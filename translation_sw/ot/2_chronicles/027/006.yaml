base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: sw
  text: Hivyo Yothamu akawa na nguvu, kwa sababu aliweka njia zake sawa mbele za BWANA, Mungu wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: akawa na nguvu
  rationale: Kitenzi hiki kina maana ya kuwa hodari au kuimarika; katika muktadha wa mafanikio ya utawala wa Yothamu, “akawa na nguvu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הֵכִין דְּרָכָיו
  choice: aliweka njia zake sawa
  rationale: הֵכִין hapa huonyesha kuweka imara, kupanga, au kuelekeza mwenendo kwa uthabiti. Usemi huu wa Kiswahili unadumisha picha ya “njia” huku ukieleza kwamba Yothamu aliuelekeza mwenendo wake ipasavyo.
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  choice: mbele za BWANA, Mungu wake
  rationale: “Mbele za” huhifadhi usemi wa Kiebrania unaoonyesha kuishi katika uwepo na chini ya tathmini ya Mungu; jina la agano יהוה limetolewa kwa desturi ya Kiswahili kama “BWANA.”
theological_decisions:
- issue: Uhusiano kati ya nguvu za Yothamu na mwenendo wake mbele za Mungu
  choice: kwa sababu aliweka njia zake sawa mbele za BWANA
  alternative: kwa sababu alijiandaa kuenenda mbele za BWANA
  rationale: כִּי inaonyesha sababu, na הנין דרכיו inalenga jinsi alivyouelekeza na kuuthibitisha mwenendo wake. Tafsiri haiongezi madai kwamba matendo yake yalistahili baraka, bali inadumisha uhusiano wa sababu ulio katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kishairi “njia zake” umehifadhiwa kama sitiari ya mwenendo wa maisha.
