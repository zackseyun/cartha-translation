  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: sw
  text: Matendo mengine ya Yothamu[a], vita vyake vyote na mwenendo wake[b]—tazama—vimeandikwa katika Kitabu cha Wafalme wa Israeli na Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo mengine kuhusu Yothamu”; nahau ya Kiebrania hapa inarejelea kumbukumbu ya matendo au shughuli zake.
    reason: lexical_alternative
  - marker: b
    text: “Mwenendo wake” pia inaweza kutafsiriwa “njia zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Matendo mengine ya Yothamu
  rationale: Katika muhtasari wa kifalme, דִּבְרֵי ni nahau inayorejelea matendo au mambo ya mfalme, si maneno yake tu; 'matendo mengine' ni Kiswahili cha kawaida na sahihi kwa fomula hii.
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: vita vyake vyote
  rationale: מִלְחָמוֹת ni wingi unaotaja vita au mapambano; 'vita vyake vyote' ni tafsiri ya moja kwa moja bila kuongeza wazo la kampeni za kijeshi.
- source_word: וּדְרָכָיו
  choice: na mwenendo wake
  rationale: Ingawa דֶּרֶךְ kihalisi ni 'njia,' hapa wingi wake unahusu jinsi alivyoishi au kujiendesha. 'Mwenendo wake' huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: הִנָּם
  choice: tazama, yameandikwa
  rationale: הִנָּם ina nguvu ya kuonyesha na kusisitiza. 'Tazama' huihifadhi, huku upatanisho wa 'yameandikwa' ukirejelea matendo, vita na mwenendo kwa pamoja.
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: yameandikwa katika Kitabu
  rationale: Kihalisi ni 'yameandikwa juu ya kitabu/卷,' lakini Kiswahili cha kawaida hutumia 'katika kitabu' kwa rejeo la kumbukumbu iliyoandikwa.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Wafalme wa Israeli na Yuda
  rationale: Hili ni jina la kumbukumbu inayotajwa; muundo huu unaakisi mnyororo wa hali ya umilikaji wa Kiebrania kwa uwazi.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia ulinganifu mwafaka: imehifadhi mkazo wa ''tazama'' na maana ya fomula ya kihistoria, huku ikitoa nahau za Kiebrania kwa Kiswahili kinachoeleweka kwa urahisi.'
