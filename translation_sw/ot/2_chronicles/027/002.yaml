source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: sw
  text: Alifanya yaliyo sawa machoni pa Yahwe, sawasawa na yote aliyoyafanya Uzia, baba yake, isipokuwa kwamba yeye hakuingia katika hekalu la Yahwe.[a] Lakini watu bado walitenda kwa ufisadi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuingia ndani ya hekalu la Yahwe.” Inaelekea kifungu hiki kinamtofautisha Yothamu na Uzia, ambaye aliingia hekaluni kinyume cha sheria (tazama 2 Mambo ya Nyakati 26:16–21).
    reason: cross_reference
  - marker: b
    text: Au, “watu bado walikuwa wakijiharibu” au “watu waliendelea kutenda kwa ufisadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Alifanya yaliyo sawa
  rationale: Kivumishi chenye kibainishi kinatumika kama nomino, yaani, ‘jambo lililo sawa.’ Kiswahili hiki ni cha kawaida na kinahifadhi tathmini ya maadili ya Kiebrania.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Hifadhi taswira ya nahau ya Kiebrania inayomaanisha jambo kuwa sawa kwa tathmini ya Yahwe; usemi huu unaeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo, na umbo ‘Yahwe’ linafuata tahajia ya kawaida ya Kiswahili.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: kama vile Uzia baba yake alivyofanya katika mambo yote
  rationale: Kifungu kinaonyesha kuwa matendo yake yalifuata kielelezo cha baba yake kwa ujumla; mpangilio huu ni wa asili katika Kiswahili huku ukihifadhi wazo la ukamilifu la כֹל.
- source_word: רַק
  choice: isipokuwa kwamba
  rationale: Neno hili linaweka kikomo kwa ulinganisho uliotangulia na Uzia, hivyo ‘isipokuwa kwamba’ linaonyesha uhusiano huo wazi.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: hakuingia katika hekalu la Yahwe
  rationale: בוא pamoja na אֶל hapa ina maana ya kuingia ndani. ‘Hekalu’ linafaa kwa הֵיכָל katika muktadha huu.
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: Lakini watu bado walitenda kwa ufisadi
  rationale: וְעוֹד huonyesha hali iliyoendelea, na pia tofauti kati ya mwenendo wa mfalme na wa watu. Umbo la kushiriki מַשְׁחִיתִים linaweza kueleza mwenendo wa ufisadi bila kutaja wazi kitu walichoharibu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Uhusiano wa Yothamu na kosa la Uzia hekaluni
  choice: Kifungu kinasema tu kwamba hakuingia hekaluni, huku tanbihi ikieleza muktadha unaowezekana
  alternative: Kutafsiri moja kwa moja kuwa hakuingia hekaluni isivyo halali
  rationale: Kitenzi chenyewe hakisemi ‘isivyo halali.’ Muktadha wa 2 Mambo ya Nyakati 26:16–21 unaonyesha tofauti inayokusudiwa, lakini maana hiyo haipaswi kuongezwa kimya kimya katika matini kuu.
- issue: Maana ya מַשְׁחִיתִים
  choice: walitenda kwa ufisadi
  alternative: walikuwa wakijiharibu; waliendelea kuharibu
  rationale: Hiphil inaweza kueleza kutenda kifisadi, kujiharibu, au kusababisha uharibifu. Tafsiri kuu inaacha mtendwa bila kutajwa kama ilivyo katika Kiebrania, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Nahau ‘machoni pa Yahwe’ imehifadhiwa kwa kuwa ni wazi na huakisi taswira ya chanzo. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika, si baada ya jina la Yahwe.
