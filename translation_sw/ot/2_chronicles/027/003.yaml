base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: sw
  text: Alijenga lango la juu la nyumba ya Yahwe, na kwenye ukuta wa Ofeli akajenga sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafanya kazi nyingi za ujenzi” au “akajenga kwa wingi” kwenye ukuta wa Ofeli.
    reason: Kirai לָרֹב kinaeleza wingi au ukubwa wa kazi ya ujenzi, bila kubainisha sehemu au miundo tofauti.
lexical_decisions:
- source_word: בָּנָה
  choice: alijenga / akajenga
  rationale: Kitenzi hiki kwa kawaida humaanisha kujenga. Muktadha haulazimishi maana mahususi zaidi ya ‘kujenga upya.’
- source_word: שַׁעַר
  choice: lango
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa lango la jiji au la hekalu katika muktadha wa usanifu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi taswira halisi ya Kiebrania, ‘nyumba ya Yahwe,’ bila kuibadili moja kwa moja kuwa ‘hekalu.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: הָעֶלְיוֹן
  choice: la juu
  rationale: Kivumishi hiki kinatambulisha mahali pa lango; ‘la juu’ ni wazi na la kawaida katika Kiswahili.
- source_word: וּבְחוֹמַת
  choice: na kwenye ukuta wa
  rationale: Kihusishi ב katika muktadha huu kinaonyesha eneo ambako kazi ya ujenzi ilifanywa; ‘kwenye’ ni cha asili na hakibani maana kuwa lazima juu ya uso wa ukuta.
- source_word: הָעֹפֶל
  choice: Ofeli
  rationale: Ni jina la eneo lililoinuka na lenye ngome huko Yerusalemu; limetoholewa badala ya kutafsiriwa.
- source_word: לָרֹב
  choice: sehemu nyingi
  rationale: Kirai hiki kinaonyesha wingi au ukubwa wa kazi ya ujenzi. ‘Akajenga sehemu nyingi’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa tafsiri yenye kusisitiza ukubwa wa kazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. ‘Yahwe’ huhifadhi jina hilo, kwa tahajia inayofaa Kiswahili, badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa ‘nyumba ya Yahwe’ unahifadhi lugha ya chanzo; ‘Ofeli’ limetoholewa kama jina la mahali. Kiashirio cha tanbihi kimewekwa baada ya kirai kinachohusika nacho.
