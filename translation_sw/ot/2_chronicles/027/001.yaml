  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יוֹתָ֣ם בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְרוּשָׁ֖ה בַּת צָדֽוֹק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: sw
  text: Yothamu alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, naye alitawala miaka kumi na sita huko Yerusalemu. Mama yake aliitwa Yerusha, binti ya Sadoki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni nahau ya Kiebrania ya kutaja umri; Kiswahili cha kawaida na wazi hutumia ‘alikuwa na umri wa miaka ...’.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati wa kuanza kwake kuwa mfalme; ‘alipoanza kutawala’ ni wa asili na unaendana na fomula ya miaka ya utawala.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi hiki kinamaanisha kutekeleza utawala wa kifalme, wala si kuwa na cheo cha mfalme tu.
- source_word: בִּירוּשָׁלָם
  choice: huko Yerusalemu
  rationale: Kihusishi ב kinatumika kwa mahali; ‘huko Yerusalemu’ ni usemi wa kawaida katika Kiswahili.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida fomula ya Kiebrania inayosema kihalisi ‘na jina la mama yake lilikuwa’.
- source_word: יְרוּשָׁה
  choice: Yerusha
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בַּת צָדוֹק
  choice: binti ya Sadoki
  rationale: Usemi huu unatambulisha ukoo wa upande wa mama kwa njia ya kawaida katika Kiswahili.
