lexical_decisions:
- source_word: עָרִים
  choice: miji
  rationale: Wingi wa עִיר humaanisha makazi ya mjini; “miji” ni tafsiri ya kawaida na ya asili katika muktadha wa ujenzi wa kifalme.
- source_word: בָּנָה
  choice: alijenga
  rationale: Kitenzi hiki humaanisha moja kwa moja “kujenga”; wakati uliopita unafaa simulizi hili la kihistoria.
- source_word: בְּהַר יְהוּדָה
  choice: katika nchi ya vilima ya Yuda
  rationale: הַר hapa ina maana ya eneo la kijiografia lenye vilima au milima, si mlima mmoja; usemi huu ni wazi katika Kiswahili cha sasa.
- source_word: חֳרָשִׁים
  choice: maeneo yenye misitu
  rationale: Neno hili hurejelea maeneo yenye miti mingi, misitu, au vichaka; “maeneo yenye misitu” huhifadhi maana ya eneo bila kudokeza lazima misitu mikubwa.
- source_word: בִּירָנִיּוֹת
  choice: ngome
  rationale: Neno hili humaanisha majengo yaliyoimarishwa kwa ulinzi; “ngome” ni la kawaida, lenye heshima, na linafaa muktadha wa kijeshi.
- source_word: מִגְדָּלִים
  choice: minara
  rationale: Hii ndiyo maana ya kawaida ya neno hilo, na hapa yaelekea ni minara ya ulinzi.
