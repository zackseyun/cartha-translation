  yaml_path: translation/ot/2_chronicles/027/008.yaml
  text: He was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem.
translation:
  language: sw
  text: Alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, naye akatawala miaka kumi na sita huko Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni kauli ya kawaida ya Kiebrania ya kutaja umri. Kiswahili cha asili hutumia ‘alikuwa na umri wa miaka ...’ badala ya tafsiri sisisi ‘mwana wa miaka ...’.
- source_word: הָיָה בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Kauli hii inaonyesha umri wake wakati alipoingia katika utawala; ‘alipoanza kutawala’ huwasilisha maana hiyo ya wakati kwa Kiswahili cha kawaida.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: miaka kumi na sita
  rationale: Ni uwasilishaji wa moja kwa moja wa idadi na nomino kwa mpangilio wa kawaida wa Kiswahili.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki humaanisha kutawala akiwa mfalme. ‘Akatawala’ ni fasiri fupi na ya kawaida inayoendeleza simulizi.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi בִּ־ kinaonyesha mahali. ‘Huko Yerusalemu’ ni usemi wa asili wa Kiswahili, huku jina la mahali likibaki wazi.
