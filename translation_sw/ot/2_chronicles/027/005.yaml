  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: sw
  text: Alipigana dhidi ya mfalme wa Waamoni na akawashinda. Mwaka huo Waamoni wakampa talanta mia za fedha, kori elfu kumi za ngano, na elfu kumi za shayiri.[a] Waamoni wakamlipa kiasi hicho pia katika mwaka wa pili na wa tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakirudii neno “kori” kabla ya “shayiri”; kipimo hicho kinaeleweka kutoka kwa fungu la ngano.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: alipigana dhidi ya
  rationale: Katika muktadha wa vita, kitenzi hiki pamoja na עִם humaanisha kupigana na mtu kama adui. “Dhidi ya” huondoa uwezekano wa kueleweka kuwa walipigana upande mmoja.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: mfalme wa Waamoni
  rationale: בְּנֵי עַמּוֹן ni jina la kawaida la watu wa Amoni; “Waamoni” ni namna ya asili na iliyo wazi katika Kiswahili.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: akawashinda
  rationale: Katika muktadha wa kijeshi, חזק pamoja na עַל huonyesha kupata ushindi au nguvu juu ya adui, si kuwa na nguvu za mwili tu.
- source_word: וַיִּתְּנוּ לוֹ
  choice: wakampa
  rationale: Huhifadhi maana ya msingi ya נתן, “kutoa/kumpa,” bila kuingiza mapema zaidi dhana ya kodi, ingawa muktadha unaonyesha malipo ya ushuru.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: talanta mia za fedha
  rationale: כִּכָּר ni kipimo cha kale cha uzito kinachotambulika kwa kawaida katika tafsiri za Biblia kama “talanta.”
- source_word: כֹּרִים
  choice: kori
  rationale: כֹּר ni kipimo cha kale cha vitu vikavu. Uhamishaji wa jina kama “kori” huhifadhi kipimo mahususi bila kukibadili kwa makadirio yasiyo hakika ya kisasa.
- source_word: חִטִּים
  choice: ngano
  rationale: Hii ndiyo maana ya kawaida ya neno hilo.
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: na kori elfu kumi za shayiri
  rationale: Ingawa Kiebrania hakirudii neno “kori,” kipimo hicho kinaeleweka kutoka fungu lililotangulia; kukiongeza katika Kiswahili hufanya kiasi hicho kieleweke kwa kawaida.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: wakamlipa kiasi hicho
  rationale: Kitenzi השיב kina maana ya msingi ya kurudisha, lakini hapa kinarejelea kutoa tena kiasi kilekile cha ushuru. “Wakamlipa kiasi hicho” huwasilisha maana ya kimuktadha kwa uwazi.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: pia katika mwaka wa pili na wa tatu
  rationale: Huonyesha kwamba malipo yale yale yalirudiwa katika kila mmoja wa miaka miwili iliyofuata.
