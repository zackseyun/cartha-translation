base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: sw
  text: 'Ndipo Walawi wakasimama: Mahathi mwana wa Amasai, na Yoeli mwana wa Azaria, kutoka kwa wazao wa Kohathi; na kutoka kwa wazao wa Merari, Kishi mwana wa Abdi, na Azaria mwana wa Yehaleli; na kutoka kwa Wagershoni[a], Yoa mwana wa Zima, na Edeni mwana wa Yoa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa wazao wa Gershoni.” Kiebrania hapa kinatumia jina la ukoo kwa maana ya kundi zima, badala ya kurudia muundo wa awali wa “wazao wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakasimama
  rationale: Kitenzi קום hapa kinaanzisha tendo la kuitikia agizo la mfalme. “Wakasimama” ni cha kawaida na kinahifadhi maana ya msingi bila kuongeza wazo lisilo wazi la mahali walipokwenda.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la לְוִיִּם.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: kutoka kwa wazao wa Kohathi
  rationale: Neno בְּנֵי kwa maana halisi ni “wana wa,” lakini katika orodha hii linaonyesha ukoo. “Wazao wa Kohathi” hutoa maana hiyo wazi na kwa Kiswahili cha kawaida.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: na kutoka kwa wazao wa Merari
  rationale: Muundo wa ukoo uliorudiwa katika Kiebrania umehifadhiwa, huku “wazao” likionyesha kuwa hawa ni watu wa ukoo wa Merari.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: na kutoka kwa Wagershoni
  rationale: Nomino ya ukoo ya umoja katika Kiebrania imetumika kwa maana ya kundi zima; “Wagershoni” ni muundo wa asili wa Kiswahili kwa watu wa ukoo huo.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika majina haya ya nasaba, “mwana wa” ndilo tafsiri ya moja kwa moja na ya kawaida.
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: Mahathi; Amasai; Yoeli; Azaria; Kishi; Abdi; Yehaleli; Yoa; Zima; Edeni
  rationale: Majina yametoholewa kwa tahajia na matamshi yanayofaa Kiswahili, kwa kufuata kwa karibu maumbo ya Kiebrania.
