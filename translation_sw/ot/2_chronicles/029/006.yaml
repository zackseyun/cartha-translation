base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: sw
  text: Kwa maana baba zetu hawakuwa waaminifu[a], wakatenda yaliyo maovu machoni pa Yahweh, Mungu wetu. Walimwacha, wakageuza nyuso zao kutoka makao ya Yahweh[b], wakatoa kisogo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliasi kwa hiana” au “walitenda bila uaminifu.” Kitenzi cha Kiebrania huonyesha kuvunja uaminifu, mara nyingi katika mambo ya agano au ibada.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kutoka katika makao ya Yahweh.” Neno hilo pia linaweza kutafsiriwa “hema,” lakini hapa linarejelea hekalu kama makao ya Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kihalisi, “wakatoa kisogo.” Nahau hii inaonyesha kugeuka kwa kukataa au kuasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: walitenda bila uaminifu
  rationale: Kitenzi hiki huonyesha kuvunja uaminifu, hasa katika uhusiano wa agano au ibada. Kauli hii ni ya kawaida katika Kiswahili cha sasa na inadumisha uzito wa kosa hilo.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Pamoja na kitenzi עשה, usemi huu humaanisha kufanya mambo yaliyo maovu; tafsiri hii ni wazi na ya asili katika Kiswahili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Inahifadhi sitiari ya Kiebrania na kueleza kwamba matendo hayo yalihukumiwa kuwa maovu na Yahweh.
- source_word: וַיַּעַזְבֻהוּ
  choice: Walimwacha
  rationale: עזב hapa inaonyesha kumwacha Mungu katika maana ya kidini na ya uhusiano; ‘walimwacha’ ni ya moja kwa moja na ya kawaida.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: wakageuza nyuso zao mbali
  rationale: Inahifadhi picha ya kugeuza nyuso kwa makusudi huku ‘mbali’ ikifanya mwelekeo wa tendo hilo uwe wazi kwa Kiswahili.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: mbali na makao ya Yahweh
  rationale: מִשְׁכָּן ni mahali pa kukaa. Katika muktadha huu inarejelea hekalu kama makao ya Yahweh, si lazima hema la kukutania la jangwani.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: kumpa kisogo
  rationale: Huu ni usemi wa picha unaomaanisha kugeuka kwa kukataa au kuasi. ‘Kumpa kisogo’ ni nahau ya asili ya Kiswahili inayodumisha picha hiyo.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, YHWH. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya מִשְׁכָּן katika muktadha wa hekalu
  choice: makao ya Yahweh
  alternative: hema la Yahweh au patakatifu pa Yahweh
  rationale: ‘Makao’ huhifadhi maana ya msingi ya neno na kuepuka kudokeza kimakosa kwamba hapa panazungumziwa hema la jangwani, huku rejeleo likiwa hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na picha za nyuso na kisogo zimehifadhiwa bila kufanya lugha iwe ngumu au ya kizamani.
