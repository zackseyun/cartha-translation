base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: sw
  text: Walianza kutakasa siku ya kwanza ya mwezi wa kwanza. Siku ya nane ya mwezi huo walifika kwenye ukumbi wa kuingilia[a] wa Yahwe. Kisha wakaitakasa nyumba ya Yahwe kwa siku nane, nao wakamaliza siku ya kumi na sita ya mwezi wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, baraza la mbele la Yahwe.
    reason: Neno אוּלָם linaweza kumaanisha ukumbi, baraza, au sehemu ya mbele ya kuingilia hekaluni.
lexical_decisions:
- source_word: וַיָּחֵלּוּ לְקַדֵּשׁ
  choice: Walianza kazi ya kutakasa
  rationale: Muundo huu unaonyesha mwanzo wa tendo la ibada bila kulazimisha kutaja kitu ambacho hakijatajwa wazi katika kishazi cha Kiebrania. ‘Kutakasa’ linafaa kwa kuondoa unajisi na kuiweka hekalu kwa matumizi matakatifu.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: siku ya kwanza ya mwezi wa kwanza
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya nahau ya tarehe ya Kiebrania.
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: walifika kwenye ukumbi wa kuingilia wa Yahwe
  rationale: אוּלָם ni ukumbi au baraza la mbele la hekalu. ‘Walifika kwenye’ huhifadhi mwelekeo wa לְ bila kudai zaidi kwamba waliingia ndani kabisa.
- source_word: וַיְקַדְּשׁוּ אֶת בֵּית יְהוָה
  choice: Wakaitakasa nyumba ya Yahwe
  rationale: ‘Nyumba ya Yahwe’ huhifadhi usemi wa chanzo unaomaanisha hekalu, na ‘kutakasa’ hudumisha uhusiano wa kileksia na קדשׁ katika sehemu ya kwanza ya aya.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: kwa muda wa siku nane
  rationale: Kifungu hiki kinaonyesha muda wa kazi; usemi huu ni wa asili katika Kiswahili na haudokezi kwamba kazi hiyo ilikamilika kabla ya siku hizo nane.
- source_word: כִּלּוּ
  choice: wakimaliza
  rationale: כלה katika kauli hii humaanisha kukamilisha kazi; ‘wakimaliza’ ni fupi na ya kawaida katika masimulizi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la agano, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya קדשׁ katika utakaso wa hekalu
  choice: kutakasa
  alternative: kuweka wakfu
  rationale: Muktadha unahusu kuondoa unajisi hekaluni na kulirudisha kwa matumizi matakatifu. ‘Kutakasa’ huhifadhi pande zote mbili kwa kiasi bora kuliko kuchagua tu wazo la kuweka wakfu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Tarehe zimeelezwa kwa muundo wa kawaida wa Kiswahili, na jina ‘Yahwe’ limetumika kwa uthabiti.
