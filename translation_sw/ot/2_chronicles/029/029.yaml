  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: sw
  text: Walipomaliza kutoa dhabihu[a], mfalme na wote waliokuwapo pamoja naye wakapiga magoti na kusujudu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “walipomaliza kupandisha.” Katika muktadha huu maana yake ni kumaliza kutoa dhabihu, yaani sadaka ya kuteketezwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kuabudu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama au kujilaza chini kwa heshima; hapa tendo hilo linafanyika katika ibada ya hekalu.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  choice: Walipomaliza
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaanzisha kishazi cha wakati; “walipomaliza” ni Kiswahili cha kawaida kinachoonyesha mfuatano wa matukio.
- source_word: לְ/הַעֲל֑וֹת
  choice: kutoa dhabihu
  rationale: Kitenzi hiki kihalisi kina maana ya “kupandisha,” lakini katika muktadha wa ibada ya hekalu kinahusu kutoa dhabihu, ambayo moshi wake hupanda. Neno la Kiebrania halitaji hapa kitu kinachotolewa, hivyo “dhabihu” linaeleza muktadha bila kurudia waziwazi “sadaka ya kuteketezwa.”
- source_word: כָּרְעוּ
  choice: wakapiga magoti
  rationale: Kitenzi כרע humaanisha kupiga au kukunja goti. Tafsiri hii inaonyesha mkao wa mwili na kuitofautisha na tendo linalofuata la kusujudu.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kibainishi; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: וְכָל הַנִּמְצְאִים אִתּוֹ
  choice: na wote waliokuwapo pamoja naye
  rationale: Kauli ya kutendwa ya מצא hapa humaanisha watu waliokuwapo au waliohudhuria. Usemi huu ni wa asili na wazi katika Kiswahili.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: na kusujudu
  rationale: שחה huonyesha kuinama au kujilaza chini kwa heshima na, katika muktadha huu, kwa ibada. “Kusujudu” huhifadhi tendo la mwili na maana yake ya kiibada bila kulifanya kuwa sawa na kupiga magoti.
theological_decisions:
- issue: Maana ya שחה katika mazingira ya ibada ya hekalu
  choice: kusujudu
  alternative: kuabudu
  rationale: Muktadha unaonyesha wazi kuwa tendo hilo ni la ibada, lakini kitenzi chenyewe pia hubeba maana halisi ya kuinama au kujilaza chini. “Kusujudu” huhifadhi kwa pamoja tendo la mwili na heshima ya kiibada, huku tanbihi ikitaja uwezekano wa “kuabudu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Dhabihu” linafaa kwa mazingira ya hekalu, na “kusujudu” ni neno linaloeleweka kwa tendo la mwili lenye maana ya ibada.
