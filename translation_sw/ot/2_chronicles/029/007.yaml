  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: sw
  text: Pia walifunga milango ya ukumbi wa kuingilia[a], wakazizima taa, hawakufukiza uvumba, wala hawakutoa sadaka ya kuteketezwa katika mahali patakatifu[b] kwa Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukumbi wa mbele”; neno la Kiebrania אוּלָם linamaanisha ukumbi wa kuingilia Hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika eneo takatifu”; neno la Kiebrania linaweza kumaanisha sehemu takatifu ya Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Pia
  rationale: Inaunganisha matendo haya na mashtaka yaliyotangulia na kuhifadhi nguvu ya kuorodhesha makosa.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: milango ya ukumbi wa kuingilia
  rationale: אוּלָם ni ukumbi wa mbele wa Hekalu; usemi huu ni wa kawaida na unaeleweka kuliko istilahi ya kiusanifu isiyozoeleka.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: wakazizima taa
  rationale: Kitenzi kinaonyesha kuzimwa kwa taa halisi zilizotumiwa katika huduma ya Hekalu.
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: hawakufukiza uvumba
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa kitendo maalumu cha ibada cha kuchoma uvumba ili moshi wake upande.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: wala hawakutoa sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi maalumu ya sadaka inayoteketezwa; umoja wa Kiebrania umehifadhiwa huku kitenzi cha Kiswahili kikieleza tendo la kuitoa.
- source_word: בַקֹּדֶשׁ
  choice: katika mahali patakatifu
  rationale: Neno קֹדֶשׁ linaweza kutaja sehemu au eneo takatifu la Hekalu bila kulazimisha mgawanyo mahususi zaidi.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: kwa Mungu wa Israeli
  rationale: Kihusishi kwa kinaonyesha kwamba sadaka ilielekezwa na kuwekwa wakfu kwa Mungu wa Israeli.
theological_decisions:
- issue: Istilahi za ibada ya Hekalu
  choice: 'Kuhifadhi matendo mahususi: kufukiza uvumba, kutoa sadaka ya kuteketezwa, na kutenda katika mahali patakatifu'
  alternative: Kutumia lugha pana kama ‘kuabudu’ au ‘kutoa sadaka’
  rationale: Aya inataja kwa usahihi huduma za Hekalu ambazo ziliachwa; lugha pana ingeficha uzito wa kihistoria na wa kiteolojia wa uzembe huo.
- issue: Idadi ya sadaka katika וְעֹלָה
  choice: sadaka ya kuteketezwa
  alternative: sadaka za kuteketezwa
  rationale: Kiebrania kimetumia nomino ya umoja, ambayo inaweza kuwa ya jumla; umoja umehifadhiwa bila kuondoa uwezekano wa kurejelea desturi hiyo kwa ujumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. ‘Ukumbi wa kuingilia’ huepuka maana ya kisasa ya baraza, na ‘mahali patakatifu’ huhifadhi upana wa neno la Kiebrania. Alama [b] imewekwa baada ya kirai kinachohusika, yaani ‘mahali patakatifu’.
