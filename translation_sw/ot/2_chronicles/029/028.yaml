base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: sw
  text: 'Kusanyiko lote lilikuwa likisujudu, huku wimbo ukiimbwa[a] na tarumbeta zikipigwa. Yote hayo yaliendelea mpaka sadaka ya kuteketezwa ilipomalizika.


    [a] Kiebrania kina neno “wimbo” pamoja na umbo la kitenzi linalomaanisha kuimba; kihalisi, “wimbo ukiimba.” Hapa limetafsiriwa kwa njia ya kawaida zaidi, “wimbo ukiimbwa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno “wimbo” pamoja na umbo la kitenzi linalomaanisha kuimba; kihalisi, “wimbo ukiimba.” Hapa limetafsiriwa kwa njia ya kawaida zaidi, “wimbo ukiimbwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָּהָל
  choice: kusanyiko
  rationale: Neno hili linamaanisha jumuiya iliyokusanyika kwa ajili ya ibada. “Kusanyiko” linadumisha maana ya kundi lililokusanyika bila kuingiza dhana ya dhehebu.
- source_word: מִשְׁתַּחֲוִים
  choice: lilikuwa likisujudu
  rationale: Kitenzi kinaonyesha tendo la mwili la kuinama au kujilaza kwa ibada. “Kusujudu” ni neno la kawaida na lenye heshima linalohifadhi tendo hilo.
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: wimbo ukiimbwa
  rationale: Kiebrania kihalisi kina “wimbo” pamoja na umbo la kitenzi cha kuimba. Kauli tendwa ya Kiswahili inaeleza maana hiyo kwa ufasaha bila usemi usio wa kawaida, “wimbo ukiimba.”
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: tarumbeta zikipigwa
  rationale: Usemi unaonyesha tarumbeta zikiendelea kupigwa. “Zikipigwa” ni Kiswahili cha kawaida kwa upigaji wa ala hizi; “za fedha” halijaongezwa kwa kuwa halipo wazi katika mstari huu.
- source_word: הַכֹּל
  choice: yote hayo
  rationale: Hutumika kwa muhtasari kurejelea matendo yote ya ibada yaliyotajwa.
- source_word: עַד לִכְלוֹת
  choice: mpaka ... ilipomalizika
  rationale: Muundo huu unaonyesha wakati ambapo matendo hayo yalifikia mwisho; kishazi kamili ni cha kawaida katika Kiswahili.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida la kibiblia kwa sadaka iliyoteketezwa kabisa juu ya madhabahu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kuendelea (“lilikuwa likisujudu,” “ukiimbwa,” “zikipigwa”) umehifadhi hali ya matendo yaliyokuwa yakiendelea hadi sadaka ilipomalizika.
