  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: sw
  text: na kutoka kwa wana wa Elizafani[a], Shimri na Yeueli; na kutoka kwa wana wa Asafu, Zekaria na Matania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “wana wa” linaweza kumaanisha pia wazao au watu wa ukoo, si lazima watoto wa kiume wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: na kutoka kwa
  rationale: Huhifadhi kiunganishi pamoja na kihusishi na muundo wa orodha unaoendelea kutoka mstari uliotangulia.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika orodha za ukoo; kulingana na muktadha inaweza pia kumaanisha wazao au watu wa ukoo.
- source_word: אֱלִיצָפָן
  choice: Elisafani
  rationale: Jina limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: שִׁמְרִי
  choice: Shimri
  rationale: Jina limenukuliwa kwa umbo linalokaribia Kiebrania na linalosomeka kwa Kiswahili.
- source_word: ו/יעואל
  choice: na Yeueli
  rationale: Maandishi ya konsonanti ויעואל yanaunga mkono Yeueli kuliko Yeieli; kiunganishi ו kimetafsiriwa.
- source_word: בְּנֵי אָסָף
  choice: wana wa Asafu
  rationale: Huhifadhi msemo wa ukoo au kundi unaomhusisha Asafu kama babu au mkuu wa kundi.
- source_word: זְכַרְיָהוּ
  choice: Zekaria
  rationale: Umbo la jina lililozoeleka katika Kiswahili.
- source_word: וּ/מַתַּנְיָהוּ
  choice: na Matania
  rationale: Umbo la jina lililozoeleka katika Kiswahili, huku kiunganishi kikihifadhiwa.
