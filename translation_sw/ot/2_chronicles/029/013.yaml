translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inahifadhi urudiaji sambamba wa orodha ya Kiebrania. Tanbihi ya pili ya Kiingereza haikuingizwa kwa sababu alama yake imewekwa baada ya Asafu ilhali maelezo yake yanahusu Yeueli, na hivyo ingepotosha. Umbo Yeueli limetokana moja kwa moja na ויעואל.
