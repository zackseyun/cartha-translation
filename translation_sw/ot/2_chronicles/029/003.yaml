base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: sw
  text: Katika mwaka wa kwanza wa utawala wake, katika mwezi wa kwanza, alifungua milango ya nyumba ya Yahwe na akazitia imara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akazikarabati,” yaani, akairudisha milango hiyo katika hali nzuri au imara tena.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: alifungua
  rationale: Kiswahili huonyesha nafsi katika kiambishi cha kitenzi; kwa hiyo kiwakilishi huru “yeye” hakihitajiki hapa isipokuwa kama msisitizo wa Kiebrania ungehitaji kuonyeshwa wazi.
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: Katika mwaka wa kwanza wa utawala wake
  rationale: Hii ni tafsiri ya kawaida na ya asili ya usemi unaotaja mwaka wa kwanza wa kutawala kwake kama mfalme.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: mwezi wa kwanza
  rationale: Hutoa maana ya moja kwa moja ya kipindi kinachotajwa bila kuongeza jina la mwezi lisilokuwamo katika matini.
- source_word: פָּתַח
  choice: alifungua
  rationale: Kitenzi hiki kina maana ya kawaida ya kufungua, nayo inafaa moja kwa moja kwa milango.
- source_word: דַּלְתוֹת
  choice: milango
  rationale: Neno linarejelea milango au mabawa ya milango, si malango ya mji; “milango” ni Kiswahili cha kawaida na sahihi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi taswira ya Kiebrania, huku “Yahwe” ikiwakilisha jina la Mungu lililoandikwa katika matini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia “Yahwe” inafaa mfumo wa sauti na maandishi wa Kiswahili.
- source_word: וַיְחַזְּקֵם
  choice: na kuitengeneza milango hiyo
  rationale: Piel ya חזק kimsingi ni kuimarisha au kufanya imara. Katika muktadha wa kurejesha milango ya hekalu, “kuitengeneza” huwasilisha kwa lugha ya kawaida hatua ya kuifanya iwe imara na katika hali nzuri tena. “Milango hiyo” imerudiwa ili kuepusha kiwakilishi cha yambwa kueleweka kana kwamba kinarejelea nyumba.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu YHWH moja kwa moja. Kulitaja kama “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Maana ya וַיְחַזְּקֵם kuhusu milango
  choice: kuitengeneza milango hiyo
  alternative: kuiimarisha milango hiyo
  rationale: Muktadha unaunga mkono tendo la ukarabati, lakini maana ya msingi ya “kuimarisha” ni halisi na imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka mpangilio wa nyakati wa Kiebrania na imerudia “milango hiyo” kwa uwazi wa kisarufi. Alama ya tanbihi imewekwa baada ya tendo linalohusika, si baada ya “utawala wake.”
