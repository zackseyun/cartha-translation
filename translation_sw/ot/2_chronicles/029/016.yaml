base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: sw
  text: Ndipo makuhani wakaingia katika sehemu ya ndani ya nyumba ya BWANA ili kuitakasa. Wakatoa uchafu wote walioukuta katika hekalu la BWANA na kuupeleka kwenye ua wa nyumba ya BWANA. Kisha Walawi wakaupokea ili kuupeleka nje kwenye Bonde la Kidroni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: ndani ya sehemu ya ndani ya nyumba ya BWANA
  rationale: Neno לִפְנִימָה linaonyesha kuingia ndani zaidi; tafsiri hii huhifadhi msisitizo huo bila kudai kwa uhakika sehemu mahususi ya jengo.
- source_word: לְטַהֵר
  choice: ili kuitakasa
  rationale: Kitenzi טהר hapa kina maana ya kuondoa unajisi wa kiibada na kufanya hekalu kuwa safi/takatifu kwa matumizi yake.
- source_word: כָּל הַטֻּמְאָה
  choice: uchafu wote
  rationale: טֻמְאָה linaweza kumaanisha unajisi au vitu vinavyotia unajisi. 'Uchafu' ni ya kawaida na inaweza kubeba maana ya hali pamoja na vitu vilivyoondolewa.
- source_word: בְּהֵיכַל יְהוָה
  choice: katika hekalu la BWANA
  rationale: הֵיכָל hapa hurejelea jengo la hekalu, tofauti na matumizi mapana ya 'nyumba ya BWANA' katika vifungu vinavyozunguka.
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: nje, kwenye Bonde la Kidroni
  rationale: נַחַל inaweza kumaanisha bonde la kijito au kijito; jina linalotumiwa kwa kawaida katika Kiswahili ni 'Bonde la Kidroni,' huku חוּצָה ikihifadhiwa wazi kama 'nje'.
theological_decisions:
- issue: Maana ya טֻמְאָה katika utakaso wa hekalu
  choice: uchafu wote
  alternative: unajisi wote
  rationale: Tafsiri haibani maana kuwa uchafu wa kawaida pekee wala hali ya kiibada pekee; muktadha wa kuvitoa vitu unaonyesha uchafu au vitu vinavyotia unajisi.
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: Imetumiwa desturi pana ya tafsiri za Biblia za Kiswahili ya kuwakilisha Tetragramatoni kwa 'BWANA,' bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mtiririko wa vitenzi umewekwa wa asili kwa simulizi la Kiswahili, huku tofauti kati ya 'nyumba ya BWANA,' 'hekalu,' na 'ua' ikihifadhiwa.
