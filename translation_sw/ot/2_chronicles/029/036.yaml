base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: sw
  text: Hezekia na watu wote wakafurahi kwa sababu ya mambo ambayo Mungu alikuwa amewaandalia watu[a]; maana jambo hilo lilitokea kwa ghafula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa Mungu alikuwa amewatayarisha watu”; au, “kwa sababu Mungu alikuwa ameliweka imara jambo hili kwa ajili ya watu.”
    reason: Kiebrania kinaweza kueleweka kuwa Mungu aliwatayarisha watu wenyewe, aliandaa mambo kwa ajili yao, au aliliweka imara jambo hili kwa manufaa yao.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: akafurahi
  rationale: Kitenzi שׂמח kinaonyesha furaha; ‘akafurahi’ ni Kiswahili cha kawaida, cha hadhi, na kinafaa katika simulizi.
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekia
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: וְכָל הָעָם
  choice: pamoja na watu wote
  rationale: Muundo huu unaonyesha wazi kuwa Hezekia na jamii yote walishiriki katika furaha hiyo.
- source_word: עַל
  choice: kwa sababu ya
  rationale: Baada ya kitenzi cha kufurahi, עַל hutaja sababu au tukio lililosababisha furaha.
- source_word: הֵכִין
  choice: alikuwa amewaandalia
  rationale: Hifili ya כון inaweza kumaanisha kuandaa, kufanya tayari, au kuthibitisha. ‘Kuwaandalia’ huhifadhi hapa wazo la maandalizi yaliyofanywa kwa manufaa ya watu.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno hilo linamtaja Mungu wa Israeli.
- source_word: לָעָם
  choice: watu
  rationale: 'ל־ inaeleweka kwa kawaida kuwa ya manufaa: Mungu aliwaandalia watu jambo fulani, bila kudai kwamba watu wenyewe ndio waliotayarishwa.'
- source_word: כִּי
  choice: maana
  rationale: כִּי inaanzisha maelezo ya sababu ya furaha yao.
- source_word: בְּפִתְאֹם
  choice: kwa ghafula
  rationale: Hueleza jambo lililotokea bila kutarajiwa na kwa haraka; ‘kwa ghafula’ linafaa katika sajili ya simulizi la kibiblia.
- source_word: הָיָה הַדָּבָר
  choice: jambo hilo lilitokea
  rationale: דָּבָר ni pana na hapa inahusu tukio lote la kurejeshwa kwa ibada; tafsiri haifafanui zaidi ya chanzo.
theological_decisions:
- issue: Jinsi Mungu alivyohusika katika maandalizi
  choice: Mungu alikuwa amewaandalia watu
  alternative: Mungu alikuwa amewatayarisha watu; au Mungu alikuwa ameliimarisha jambo hili kwa ajili ya watu
  rationale: Kiebrania הֵכִין ... לָעָם kinaweza kueleweka kuwa Mungu aliandaa jambo kwa manufaa ya watu, aliwatayarisha watu, au alilithibitisha jambo kwa ajili yao. Matini kuu inafuata kwa karibu matumizi ya ל־ ya manufaa na kuepuka kudai moja kwa moja kwamba watu wenyewe ndio walioandaliwa; tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. ‘Pamoja na’ huondoa utata wa kisintaksia, na tanbihi huhifadhi upana halisi wa הֵכִין ... לָעָם.
