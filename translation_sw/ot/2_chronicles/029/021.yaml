  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: sw
  text: Wakaleta mafahali saba, kondoo dume saba, wana-kondoo saba, na mbuzi dume saba kama dhabihu ya dhambi kwa ajili ya ufalme, mahali patakatifu, na Yuda. Naye akawaagiza wana wa Aroni, makuhani, wawatoe dhabihu juu ya madhabahu ya Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Wakaleta
  rationale: Kitenzi hiki kinaendeleza simulizi na kueleza kuletwa kwa wanyama wa dhabihu; “wakaleta” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: פָרִים
  choice: mafahali
  rationale: Katika orodha ya dhabihu neno hili humaanisha ng’ombe dume wanaofaa kutolewa; Kiebrania cha mstari huu hakitaji umri wao waziwazi.
- source_word: אֵילִים
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kondoo wa kiume katika muktadha wa dhabihu.
- source_word: כְבָשִׂים
  choice: wana-kondoo
  rationale: Neno la Kiebrania linarejelea kondoo wachanga; “wana-kondoo” ni la asili na haliongezi jinsia ambayo haijaelezwa wazi hapa.
- source_word: צְפִירֵי עִזִּים
  choice: mbuzi dume
  rationale: Kirai hiki kinabainisha mbuzi wa kiume.
- source_word: לְחַטָּאת
  choice: kuwa dhabihu ya dhambi
  rationale: Katika muktadha wa ibada, חַטָּאת ni aina maalumu ya dhabihu, si dhambi kama dhana tu.
- source_word: עַל הַמַּמְלָכָה
  choice: kwa ajili ya ufalme
  rationale: עַל katika muktadha huu huonyesha kwamba dhabihu ilitolewa kwa niaba au manufaa ya ufalme; usemi huu ni wazi na wa kawaida.
- source_word: הַמִּקְדָּשׁ
  choice: mahali patakatifu
  rationale: מִקְדָּשׁ hurejelea eneo takatifu la ibada; tafsiri hii huhifadhi maana yake bila kulifanya tu kuwa jengo la hekalu.
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: wana wa Aroni, makuhani
  rationale: Muundo huu huhifadhi uhusiano wa kifamilia na maelezo ya kazi yao ya ukuhani.
- source_word: לְהַעֲלוֹת
  choice: wawatoe juu ya
  rationale: Katika matumizi ya dhabihu, עלה humaanisha kutoa dhabihu madhabahuni; kiwakilishi “wa-” kinarejelea wanyama waliotajwa.
- source_word: מִזְבַּח יְהוָה
  choice: madhabahu ya Yahweh
  rationale: Hii ni tafsiri ya kawaida ya muundo tegemezi, huku jina la agano יְהוָה likitolewa kama “Yahweh”.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: dhabihu ya dhambi
  alternative: sadaka kwa ajili ya dhambi
  rationale: Hapa neno linataja aina ya dhabihu ya ibada. “Dhabihu ya dhambi” huhifadhi kategoria hiyo bila kuongeza maelezo ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Orodha ya wanyama na marudio ya “saba” yamehifadhiwa. “Naye” inadumisha mabadiliko ya mhusika yaliyomo katika Kiebrania bila kumtaja kwa jina lisilotolewa katika mstari huu.
