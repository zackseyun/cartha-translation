  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: sw
  text: Ndipo Mfalme Hezekia na viongozi wakawaambia Walawi wamsifu Yahweh kwa maneno ya Daudi na ya Asafu mwonaji[a]. Basi wakamsifu kwa furaha[b], na wakainama na kuabudu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na maneno ya Daudi na ya Asafu mwonaji.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maana halisi, “hadi furaha” au “kuifikia furaha”; maana inaelekea kuwa kwamba sifa zao ziliambatana na kufurahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: wakawaambia
  rationale: Ingawa kitenzi hiki kimsingi ni ‘alisema,’ muundo unaofuatwa na lengo la kitendo unaonyesha agizo; ‘wakawaambia’ ni ya asili bila kuongeza ukali wa ‘wakaamuru.’
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: Mfalme Hezekia na viongozi
  rationale: שׂרים hapa ni viongozi wenye mamlaka; ‘viongozi’ ni Kiswahili cha sasa na hakidokezi kwamba lazima wawe wana wa kifalme.
- source_word: לְהַלֵּל לַיהוָה
  choice: wamsifu Yahweh
  rationale: הלל katika mazingira ya ibada ni ‘kusifu,’ na jina la agano יהוה limetolewa kama ‘Yahweh.’
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: kwa maneno ya Daudi na ya Asafu mwonaji
  rationale: ‘Kwa maneno’ huhifadhi upana na utata wa בְּדִבְרֵי bila kuifanya moja kwa moja ‘nyimbo’; ‘mwonaji’ ni cheo cha kinabii cha חֹזֶה.
- source_word: עַד לְשִׂמְחָה
  choice: kwa furaha
  rationale: Kirai cha Kiebrania ni kisicho cha kawaida, kwa maana halisi ‘hadi/kuifikia furaha’; ‘kwa furaha’ huwasilisha kwa Kiswahili hali iliyoambatana na sifa huku tanbihi ikihifadhi umbo la chanzo.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: wakainama na kuabudu
  rationale: 'Vitenzi viwili tofauti vimehifadhiwa: cha kwanza kinaonyesha kuinama kwa heshima, na cha pili kitendo cha kuabudu.'
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa kuinama na kuabudu katika kishazi cha mwisho
  choice: 'vitendo viwili vilivyoratibiwa: ‘wakainama na kuabudu’'
  alternative: 'kitendo kimoja kilichounganishwa: ‘wakainama kwa ibada’'
  rationale: Kiebrania kina vitenzi viwili tofauti; kuvihifadhi huepuka kufuta tofauti kati ya ishara ya mwili na tendo la ibada.
- issue: Maana ya בְּ katika ‘kwa maneno ya Daudi na ya Asafu’
  choice: kwa maneno ya
  alternative: kulingana na maneno ya
  rationale: ‘Kwa’ huacha wazi kama maneno hayo yalikuwa chombo/maudhui ya sifa au mwongozo wake, badala ya kulazimisha tafsiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walawi,’ ‘Asafu,’ na ‘mwonaji’ ni istilahi zinazoeleweka katika muktadha wa Biblia. Muundo unaendelea kwa urahisi huku ukihifadhi urudiaji wa kusifu na vitendo viwili vya mwisho.
