id: 2CH.29.25
reference: 2 Chronicles 29:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד אֶת הַ/לְוִיִּ֜ם בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ בִּ/נְבָלִ֣ים וּ/בְ/כִנֹּר֔וֹת בְּ/מִצְוַ֥ת דָּוִ֛יד וְ/גָ֥ד חֹזֵֽה הַ/מֶּ֖לֶךְ וְ/נָתָ֣ן הַ/נָּבִ֑יא כִּ֧י בְ/יַד יְהוָ֛ה הַ/מִּצְוָ֖ה בְּ/יַד נְבִיאָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: sw
  text: Akawaweka Walawi katika nyumba ya Yahwe, wakiwa na matoazi, vinubi na zeze, kulingana na agizo la Daudi, la Gadi, mwonaji wa mfalme[a], na la Nathani nabii. Kwa maana agizo hilo lilitoka kwa Yahwe kupitia manabii wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwonaji” hutafsiri cheo cha Kiebrania חֹזֶה, ambacho ni tofauti na “nabii,” ingawa kazi hizo zilihusiana kwa karibu.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya moja kwa moja zaidi: “kwa mkono wa Yahwe lilikuwa agizo hilo, kwa mkono wa manabii wake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Akawaweka
  rationale: Hifili ya עמד ina maana ya kuwafanya Walawi wasimame au wachukue nafasi zao kwa huduma. “Akawaweka” ni ya asili katika Kiswahili na huhifadhi tendo la kuwaweka mahali pa huduma.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la kikabila na la huduma ya ibada.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi kwa uwazi usemi rasmi wa Kiebrania “nyumba ya Yahwe”; “hekalu la Yahwe” lingewezekana lakini si la moja kwa moja kwa kiwango hiki.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: בִּמְצִלְתַּיִם
  choice: wakiwa na matoazi
  rationale: Beth hapa huonyesha vifaa vilivyotumiwa. “Matoazi” ni neno la kawaida la Kiswahili kwa ala hizi zinazogonganishwa.
- source_word: בִּנְבָלִים וּבְכִנֹּרוֹת
  choice: vinubi na zeze
  rationale: Maneno ya Kiebrania yanataja aina mbili tofauti za ala za nyuzi. Majina ya Kiswahili yanazitofautisha, huku yakikubali kwamba ulinganishaji kamili na ala za kisasa hauna uhakika.
- source_word: בְּמִצְוַת דָּוִיד
  choice: kulingana na agizo la Daudi
  rationale: Kirai hiki huonyesha kwamba mpangilio ulifuata mamlaka au maelekezo yaliyotolewa; “kulingana na” ni Kiswahili cha sasa na cha heshima.
- source_word: גָּד חֹזֵה הַמֶּלֶךְ
  choice: Gadi, mwonaji wa mfalme
  rationale: “Mwonaji” huhifadhi neno חֹזֶה na kulitofautisha na נָבִיא, ingawa kazi hizo zilihusiana kwa karibu.
- source_word: נָתָן הַנָּבִיא
  choice: Nathani nabii
  rationale: Ni tafsiri ya moja kwa moja ya jina pamoja na cheo chake.
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu inayoeleza kwa nini maagizo ya Daudi, Gadi na Nathani yalikuwa na mamlaka.
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: lilitoka kwa Yahwe kupitia manabii wake
  rationale: Nahau inayorudiwa “kwa mkono wa” huonyesha chanzo na njia ya upatanishi. Tafsiri hii ya asili huhifadhi Yahwe kama chanzo na manabii kama waliolifikisha.
theological_decisions:
- issue: Uhusiano kati ya mpangilio wa ibada wa Daudi na mamlaka ya Mungu
  choice: Agizo hilo linaonyeshwa kuwa lilitoka kwa Yahwe na kufikishwa kupitia manabii wake, huku Daudi, Gadi na Nathani wakitajwa katika utekelezaji wake.
  alternative: Kulielewa kuwa sera ya kifalme ya Daudi tu ambayo baadaye ilipewa uhalali wa kidini.
  rationale: Kishazi כִּי בְיַד יְהוָה הַמִּצְוָה בְּיַד נְבִיאָיו kinamtaja Yahwe wazi kuwa chanzo cha agizo na manabii kuwa njia ya kulifikisha; tafsiri haifuti viwango hivi viwili vya utendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Nyumba ya Yahwe” imedumisha taswira ya chanzo; “matoazi, vinubi na zeze” ni msamiati wa ibada unaoeleweka na unaotofautisha ala zilizotajwa.
