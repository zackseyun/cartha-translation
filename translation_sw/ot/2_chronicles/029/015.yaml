id: 2CH.29.15
reference: 2 Chronicles 29:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּֽאַסְפ֤וּ אֶת אֲחֵי/הֶם֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבֹ֥אוּ כְ/מִצְוַת הַ/מֶּ֖לֶךְ בְּ/דִבְרֵ֣י יְהוָ֑ה לְ/טַהֵ֖ר בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: sw
  text: Wakawakusanya ndugu zao, wakajiweka wakfu, kisha wakaja kwa amri ya mfalme, kwa maneno ya Yahwe,[a] ili kuitakasa nyumba ya Yahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa amri ya mfalme iliyolingana na maneno ya Yahwe.” Kiebrania kina maneno “kwa maneno ya Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu la Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת־אֲחֵיהֶם
  choice: Wakawakusanya ndugu zao
  rationale: Kitenzi אסף kina maana ya kukusanya, na אֲחֵיהֶם ni kihalisi “ndugu zao.” Muktadha unaonyesha kuwa hawa ni Walawi wenzao, lakini tafsiri inadumisha istilahi ya undugu iliyopo katika Kiebrania.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: wakajiweka wakfu
  rationale: Umbo la hitpaeli la קדשׁ hapa linaeleza kujitenga na kujiandaa kwa huduma takatifu. “Kujiweka wakfu” ni Kiswahili cha sasa kinachoeleweka na kinachofaa katika muktadha wa ibada.
- source_word: וַיָּבֹאוּ
  choice: kisha wakaja
  rationale: Kitenzi בוא kimsingi ni “kuja.” “Kisha” linaunganisha mfuatano wa matendo kwa Kiswahili cha kawaida bila kuongeza wazo la kuingia ambalo halijasemwa moja kwa moja.
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: kwa amri ya mfalme
  rationale: Kirai hiki kinaonyesha kwamba walitenda kwa kufuata agizo la kifalme. “Kwa amri ya mfalme” ni cha asili na chenye heshima katika Kiswahili.
- source_word: בְּדִבְרֵי יְהוָה
  choice: kwa maneno ya Yahwe
  rationale: Tafsiri hii inadumisha kihusishi בְּ na wingi דִּבְרֵי. Uhusiano sahihi wa kirai hiki na amri ya mfalme una uwezekano wa kueleweka kwa zaidi ya njia moja, kwa hiyo tanbihi inahifadhi utata huo.
- source_word: לְטַהֵר
  choice: ili kuitakasa
  rationale: Pieli ya טהר katika muktadha wa hekalu humaanisha kusafisha au kutakasa kiibada. “Kuitakasa” inaonyesha kusudi na uzito wa kidini wa tendo hilo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Hii inadumisha usemi halisi wa Kiebrania “nyumba ya Yahwe,” huku tanbihi ikifafanua kwamba kinachokusudiwa ni hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama “Yahwe,” namna ya Kiswahili ya kuandika jina hilo, badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יהוה lenyewe. “Yahwe” hulihifadhi kama jina binafsi na ni umbo linalofaa kifonolojia katika Kiswahili.
- issue: Uhusiano wa בְּדִבְרֵי יְהוָה na amri ya mfalme
  choice: kwa amri ya mfalme, kwa maneno ya Yahwe
  alternative: kwa amri ya mfalme iliyolingana na maneno ya Yahwe
  rationale: Kiebrania kinaweza kuonyesha kwamba amri ya mfalme ilitolewa kwa msingi au kwa mamlaka ya maneno ya Yahwe. Tafsiri kuu inafuata muundo wa chanzo kwa karibu, na tanbihi inaonyesha maana laini inayowezekana bila kuufunga utata.
- issue: Istilahi ya undugu אֲחֵיהֶם
  choice: ndugu zao
  alternative: Walawi wenzao
  rationale: Kiebrania kinatumia neno la undugu, ingawa muktadha unawatambulisha kama Walawi. Kuhifadhi “ndugu” huepuka kuingiza ufafanuzi wa kimuktadha ndani ya matini yenyewe.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa ulinganifu bora: unahifadhi istilahi za chanzo na utata wa kirai בְּדִבְרֵי יְהוָה, huku ukitumia mtiririko wa kawaida wa Kiswahili.'
