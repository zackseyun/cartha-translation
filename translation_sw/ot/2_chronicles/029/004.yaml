lexical_decisions:
- source_word: וַיָּבֵא
  choice: Kisha akawaleta
  rationale: Hifili ya בוא ina maana ya kusababisha waje, yaani kuwaleta; “Kisha” linaonyesha mfuatano wa simulizi unaowakilishwa na wayyiqtol.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida na lililo wazi kwa כהנים katika Kiswahili.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Huwatambulisha watumishi wa hekalu wa kabila la Lawi, waliotofautishwa hapa na makuhani.
- source_word: וַיַּאַסְפֵם
  choice: akawakusanya
  rationale: Kitenzi אסף pamoja na kiambishi cha nafsi ya tatu wingi humaanisha kuwakusanya au kuwaweka pamoja; “akawakusanya” ni cha asili na kinafaa mkutano huu rasmi.
- source_word: לִרְחוֹב
  choice: katika uwanja
  rationale: רחוב hapa ni eneo pana la wazi au uwanja wa umma, si lazima barabara kwa maana ya kisasa.
- source_word: הַמִּזְרָח
  choice: wa upande wa mashariki
  rationale: מזרח humaanisha mashariki; muundo huu wa Kiswahili unaacha wazi kiasi iwapo ni uwanja wa mashariki au uwanja ulioko upande wa mashariki.
