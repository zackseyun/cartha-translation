  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: sw
  text: Kisha akawaleta makuhani na Walawi, akawakusanya katika uwanja wa upande wa mashariki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uwanja wa mashariki.”
