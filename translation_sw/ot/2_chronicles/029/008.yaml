  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִי֙ קֶ֣צֶף יְהוָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם וַ/יִּתְּנֵ֤/ם ל/זועה לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה כַּ/אֲשֶׁ֛ר אַתֶּ֥ם רֹאִ֖ים בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: sw
  text: Kwa hiyo ghadhabu ya Yahwe ikawajia Yuda na Yerusalemu, naye akawafanya kuwa kitu cha kutisha[a], cha ukiwa, na cha kupigiwa miluzi ya dharau[b], kama mnavyoona kwa macho yenu wenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hofu kuu”; neno la Kiebrania humaanisha kitu kinachosababisha mtu kutetemeka au kuingiwa na hofu.
    reason: lexical_alternative
  - marker: b
    text: Au “kitu cha kuzomewa”; usemi wa Kiebrania hasa unarejelea kupigwa miluzi ya dharau na watazamaji wanapoona maangamizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: ghadhabu
  rationale: Neno hili linaonyesha hasira kali ya Mungu katika hukumu; “ghadhabu” ni la heshima na lenye nguvu kuliko “hasira” pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: וַיְהִי ... עַל
  choice: ikawajia
  rationale: Muundo huu unaonyesha ghadhabu iliyowafikia au kuja juu ya Yuda na Yerusalemu; “ikawajia” ni Kiswahili cha kawaida na huhifadhi wazo la kuanza kwa hukumu.
- source_word: וַיִּתְּנֵם
  choice: akawafanya kuwa
  rationale: Katika muundo wa נתן pamoja na ל, kitenzi kinaeleza hali ambayo waliwekwa au kufanywa wawe nayo; tafsiri hii inaweka wazi matokeo hayo.
- source_word: לְזוֹעָה
  choice: kitu cha kutisha
  rationale: Nomino hii huashiria kitu kinachosababisha mtu kutetemeka au kuingiwa na hofu; “kitu cha kutisha” huwasilisha athari hiyo kwa watazamaji.
- source_word: לְשַׁמָּה
  choice: ukiwa
  rationale: Ni neno la kawaida la hukumu linaloonyesha kuachwa tupu na kuharibiwa; “ukiwa” ni sahihi na linaeleweka kwa urahisi.
- source_word: וְלִשְׁרֵקָה
  choice: kitu cha kuzomewa
  rationale: Neno hilo linataja mlio wa dharau unaotolewa na watazamaji mbele ya maangamizi; “kuzomewa” huwasilisha tendo hilo na maana yake ya kejeli kwa Kiswahili cha sasa.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: kama mnavyoona kwa macho yenu wenyewe
  rationale: Usemi huu una msisitizo wa ushahidi unaoonekana moja kwa moja; “kwa macho yenu wenyewe” huhifadhi msisitizo huo.
theological_decisions:
- issue: Kudumisha ukali wa lugha ya hukumu ya Mungu
  choice: ghadhabu ya Yahwe ikawajia ... naye akawafanya kuwa kitu cha kutisha, ukiwa, na kitu cha kuzomewa
  alternative: hasira ya Yahwe ilikuwa juu yao ... naye akawaacha katika uharibifu na aibu
  rationale: Kiebrania kinaeleza hukumu ya agano kwa lugha kali na ya wazi. Tafsiri inahifadhi ghadhabu ya Mungu na fedheha ya hadharani bila kuzipunguza wala kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa vitu vitatu vya hukumu umehifadhiwa, huku “kitu cha kuzomewa” kikitoa kwa njia ya kawaida picha halisi ya שרקה na dharau inayohusishwa nayo.
