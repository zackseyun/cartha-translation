id: 2CH.29.11
reference: 2 Chronicles 29:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: sw
  text: Wanangu, sasa msilegee,[a] kwa maana Yahwe amewachagua ninyi kusimama mbele zake,[b] kumhudumia, na kuwa wahudumu wake na wafukizaji wa uvumba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “msiwe wazembe” au “msipuuze wajibu wenu.”'
    reason: lexical_alternative
  - marker: b
    text: “Kusimama mbele zake” ni usemi wa kikuhani unaomaanisha kuhudumu katika uwepo wa Mungu.
    reason: cultural_note
  - marker: c
    text: 'Au: “wale wanaotoa uvumba.” Kitenzi cha Kiebrania kinahusu kusababisha sadaka itoe moshi na katika muktadha huu kinaelekea kutaja uvumba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: Wanangu
  rationale: Huhifadhi wito wa kifamilia wa neno la Kiebrania, huku ikiwa njia ya kawaida na yenye heshima ya kuwataja wanaume walio chini ya mamlaka ya mzungumzaji katika Kiswahili.
- source_word: אַל תִּשָּׁלוּ
  choice: msilegee
  rationale: Katika muktadha huu kitenzi kinamaanisha kulegea au kupuuza wajibu, si kudanganyika. Kauli hii ni ya kawaida na inabeba nguvu ya onyo.
- source_word: בָכֶם בָּחַר יְהוָה
  choice: Yahwe amewachagua ninyi
  rationale: Neno “ninyi” linaonyesha mkazo uliowekwa kwa walengwa katika mpangilio wa Kiebrania; wakati timilifu wa Kiswahili unaonyesha uchaguzi uliofanywa ambao bado una matokeo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לַעֲמֹד לְפָנָיו
  choice: kusimama mbele zake
  rationale: Huhifadhi taswira halisi ya Kiebrania na pia nahau ya kikuhani ya kuhudumu katika uwepo wa Mungu.
- source_word: לְשָׁרְתוֹ
  choice: kumhudumia
  rationale: Huwasilisha huduma rasmi ya ibada inayokusudiwa na שׁרת katika muktadha wa hekalu.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים
  choice: kuwa wahudumu wake na wafukizaji wa uvumba
  rationale: 'Huhifadhi kwa kadiri inayowezekana ulinganifu wa majukumu mawili yaliyoelezwa kwa maumbo ya kushiriki katika Kiebrania: wahudumu na wanaofukiza uvumba.'
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu. Kulitaja kama “Yahwe” huhifadhi tofauti kati ya jina hilo na cheo “Bwana” bila kuongeza tafsiri ya kimadhehebu.
- issue: Maana ya kusimama mbele za Yahwe
  choice: Kuhifadhi usemi “kusimama mbele zake”
  alternative: kumtumikia mbele zake
  rationale: Usemi huo una maana ya huduma ya kikuhani, lakini tafsiri halisi inaeleweka kwa Kiswahili na maelezo ya tanbihi huhifadhi maana ya kimuktadha bila kuifunga ndani ya maandishi.
- issue: Uhusiano kati ya מְשָׁרְתִים na מַקְטִרִים
  choice: 'Majukumu mawili yanayolingana: “wahudumu wake na wafukizaji wa uvumba”'
  alternative: wahudumu wake wanaofukiza uvumba
  rationale: Muundo wa Kiebrania unaweza kusomwa kama majukumu mawili yaliyounganishwa. Tafsiri iliyochaguliwa haiufanyi wajibu wa kufukiza uvumba kuwa maelezo tu ya neno “wahudumu”.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa sauti. “Msilegee” ni ya kawaida kuliko nomino nzito kama “msiwe na uzembe,” na “mbele zake” hudumisha hadhi ya usemi wa ibada. Neno “wafukizaji” si la mazungumzo ya kila siku, lakini linaeleweka na linafaa kwa jukumu maalumu la hekaluni.
