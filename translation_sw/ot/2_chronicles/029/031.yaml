  text: וַ/יַּ֨עַן יְחִזְקִיָּ֜הוּ וַ/יֹּ֗אמֶר עַתָּ֨ה מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה גֹּ֧שׁוּ וְ/הָבִ֛יאוּ זְבָחִ֥ים וְ/תוֹד֖וֹת לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבִ֤יאוּ הַ/קָּהָל֙ זְבָחִ֣ים וְ/תוֹד֔וֹת וְ/כָל נְדִ֥יב לֵ֖ב עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: sw
  text: Ndipo Hezekia akajibu, akasema, “Sasa mmejiweka wakfu kwa Yahwe[a]. Karibieni, mlete dhabihu na sadaka za shukrani nyumbani mwa Yahwe.” Kusanyiko likaleta dhabihu na sadaka za shukrani, na kila aliyekuwa na moyo wa hiari akaleta sadaka za kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, Kiebrania kinasema, “mmejaza mikono yenu kwa ajili ya Yahwe,” nahau inayomaanisha kuwekwa au kujiweka wakfu kwa huduma takatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu, akasema
  rationale: Inahifadhi mtindo wa simulizi wa Kiebrania wa kuunganisha ‘akajibu’ na ‘akasema,’ huku ikibaki ya kawaida katika Kiswahili.
- source_word: מִלֵּאתֶם יֶדְכֶם לַיהוָה
  choice: mmejiweka wakfu kwa Yahwe
  rationale: Kirai hiki, ambacho kwa neno halisi ni ‘mmeijaza mikono yenu,’ ni nahau ya kuwekwa au kujiweka wakfu kwa huduma takatifu. Tafsiri ya maana inaeleweka kwa wasomaji wa sasa, huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: גֹּשׁוּ
  choice: Karibieni
  rationale: Kitenzi kina maana ya kusogea au kuja karibu, hasa katika muktadha wa ibada. ‘Karibieni’ ni agizo la asili na lenye heshima katika Kiswahili.
- source_word: זְבָחִים
  choice: dhabihu
  rationale: Ni neno pana kwa sadaka zinazochinjwa; ‘dhabihu’ ni istilahi ya kawaida na sahihi katika Kiswahili cha Biblia.
- source_word: תוֹדוֹת
  choice: sadaka za shukrani
  rationale: Hutaja dhabihu au sadaka zinazotolewa kwa shukrani; tafsiri hii inaonyesha kusudi na aina yake ya kiibada.
- source_word: לְבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: Inahifadhi taswira ya Kiebrania ya ‘nyumba ya Yahwe’ badala ya kuibadilisha kuwa ‘hekalu,’ na katika muktadha inaeleza mahali sadaka zilipoletwa.
- source_word: הַקָּהָל
  choice: Kusanyiko
  rationale: Hurejelea jamii iliyokusanyika kwa ibada; ‘kusanyiko’ ni neno wazi na la sasa.
- source_word: כָל נְדִיב לֵב
  choice: kila aliyekuwa na moyo wa hiari
  rationale: Inahifadhi rejeo la Kiebrania kwa moyo na wazo la utayari wa kujitolea bila kulazimishwa.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Ni istilahi ya dhabihu zinazoteketezwa kabisa; tafsiri hii ni ya kawaida na inatofautisha aina hii na dhabihu zilizotajwa awali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה. ‘Yahwe’ linawakilisha jina hilo moja kwa moja bila kulibadilisha kuwa cheo.
- issue: Maana ya nahau מִלֵּאתֶם יֶדְכֶם
  choice: mmejiweka wakfu
  alternative: mmeijaza mikono yenu
  rationale: Nahau hii inaweza kuhusishwa na kuwekwa rasmi katika huduma takatifu au kujiweka wakfu. Katika muktadha huu tafsiri ya maana ni wazi, lakini tanbihi huhifadhi usemi halisi na kutotatua zaidi ya maandishi iwapo ni kuwekwa rasmi au kujitolea kwa ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umehifadhiwa bila kufanya sentensi kuwa nzito; istilahi za ibada zimetafsiriwa kwa maneno yanayoeleweka kwa wasomaji wa kawaida.
