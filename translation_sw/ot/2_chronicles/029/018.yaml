base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: sw
  text: Kisha wakaingia ndani mahali alipokuwa Mfalme Hezekia, wakasema, “Tumeitakasa nyumba yote ya Yahweh, madhabahu ya sadaka ya kuteketezwa pamoja na vyombo vyake vyote, na meza ya safu za mikate[a] pamoja na vyombo vyake vyote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “meza ya mikate ya wonyesho,” yaani, meza ya mikate iliyopangwa mbele ya Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: wakaingia ndani
  rationale: Kielezi hiki kinaonyesha mwendo kuelekea ndani; usemi huu ni wa kawaida katika Kiswahili na unafaa kwa kuingia ili kutoa taarifa kwa mfalme.
- source_word: טִהַרְנוּ
  choice: tumeitakasa
  rationale: Katika muktadha wa hekalu, kitenzi hiki kinamaanisha utakaso wa kiibada. Wakati timilifu unaonyesha tendo lililokamilika lenye matokeo ya sasa.
- source_word: בֵּית יְהוָה
  choice: nyumba yote ya Yahweh
  rationale: Huhifadhi taswira halisi ya Kiebrania ya hekalu kuwa ‘nyumba’ ya Yahweh, huku ‘yote’ ikiwakilisha כָּל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: מִזְבַּח הָעוֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Ni istilahi inayoeleweka kwa madhabahu iliyotumiwa kwa sadaka iliyoteketezwa yote.
- source_word: כֵּלָיו
  choice: vifaa vyake vyote
  rationale: Katika ibada ya patakatifu, neno hili linahusu vyombo na zana mbalimbali; ‘vifaa’ ni pana na ya kawaida katika Kiswahili.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: meza ya safu za mikate
  rationale: הַמַּעֲרֶכֶת hurejelea mpangilio au safu; katika istilahi hii ya hekalu, kinachopangwa mezani ni mikate. Tafsiri hii ni wazi kwa msomaji wa sasa bila kupoteza taswira ya safu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la agano. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: meza ya safu za mikate
  alternative: meza ya mikate ya wonyesho
  rationale: Chaguo kuu linaonyesha maana ya mpangilio au safu na kutaja mikate inayodokezwa na istilahi ya ibada; tanbihi inahifadhi jina jingine la jadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo wa orodha ya Kiebrania umehifadhiwa, huku ‘pamoja na’ ikitumiwa kuifanya sentensi isomeke kwa kawaida.
