  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: sw
  text: Akafanya yaliyo sawa machoni pa Yahwe, sawasawa na yote aliyofanya Daudi baba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Daudi babu yake” au “Daudi, babu wa ukoo wake”; hapa “baba” linaonyesha ukoo wa kifalme, wala si kwamba Daudi alikuwa baba yake wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Kitenzi cha Kiebrania ni namna ya kawaida ya kusimulia tukio linalofuata. Kiambishi “-ka-” kinaendeleza simulizi kwa Kiswahili cha asili.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino, yaani jambo lililo sawa au nyofu. “Yaliyo sawa” ni usemi wa kawaida na huhifadhi maana ya tathmini ya maadili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi sitiari ya Kiebrania ya kutathmini jambo kwa mtazamo wa mtu fulani, huku ikiwa usemi unaoeleweka kwa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כְּכֹל אֲשֶׁר
  choice: kama yote
  rationale: Huhifadhi wazo la kulinganisha mwenendo wake na matendo yote ya Daudi.
- source_word: עָשָׂה
  choice: aliyofanya
  rationale: Kishazi cha wakati uliopita kinaonyesha matendo ya Daudi yaliyokuwa kielelezo cha mwenendo unaotajwa.
- source_word: דָּוִיד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אָבִיו
  choice: baba yake
  rationale: Huhifadhi neno la kifamilia lililo katika Kiebrania; katika muktadha wa kifalme linaweza kumaanisha babu au babu wa ukoo, jambo linalofafanuliwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, hivyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Maana ya “Daudi baba yake” kuhusiana na Hezekia
  choice: Kudumisha usemi wa kifalme “Daudi baba yake” katika andiko kuu
  alternative: Daudi babu yake / Daudi babu yake wa ukoo
  rationale: Neno la Kiebrania אָב linaweza kumaanisha baba wa moja kwa moja au babu wa ukoo. Hapa linaonyesha ukoo wa kifalme; tanbihi huhifadhi maana hiyo bila kuondoa lugha ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sitiari “machoni pa” na usemi wa ukoo “baba yake” zimehifadhiwa kwa uaminifu kwa chanzo.
