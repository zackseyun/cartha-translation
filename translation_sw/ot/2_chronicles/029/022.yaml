base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: sw
  text: Kisha wakachinja ng’ombe[a], na makuhani wakapokea damu na wakanyunyiza kwenye madhabahu[b]. Wakachinja kondoo dume na wakanyunyiza damu kwenye madhabahu. Wakachinja wanakondoo na wakanyunyiza damu kwenye madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania ni jina la pamoja la mifugo ya jamii ya ng’ombe; katika muktadha huu wengine hutafsiri ‘mafahali.’
    reason: lexical_alternative
  - marker: b
    text: Au ‘wakairusha damu dhidi ya madhabahu’ au ‘wakanyunyiza damu juu ya madhabahu.’ Kitenzi cha Kiebrania kinaonyesha damu ikiwekwa kwa nguvu katika tendo la ibada, si kunyunyizwa kidogo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: wakawachinja
  rationale: Katika muktadha wa dhabihu, שׁחט humaanisha kuchinja kwa kusudi la ibada, si kuua tu.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: בקר ni jina la pamoja la mifugo ya jamii ya ng’ombe; tafsiri hii haiwekei jinsia ambayo Kiebrania hakuitaji hapa.
- source_word: וַיְקַבְּלוּ
  choice: wakaipokea
  rationale: קבל kimsingi ni ‘kupokea’; hapa makuhani wanaipokea damu ili waitumie katika tendo la ibada.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa כהנים katika Kiswahili cha Biblia.
- source_word: הַדָּם
  choice: damu
  rationale: Tafsiri ya moja kwa moja ya דם, ikirejelea damu ya wanyama waliotolewa dhabihu.
- source_word: וַיִּזְרְקוּ
  choice: kuirusha
  rationale: Katika taratibu za dhabihu, זרק hueleza kuipeleka damu kwa nguvu kwenye madhabahu. ‘Kuirusha’ huhifadhi nguvu ya tendo kuliko ‘kuinyunyiza,’ ambalo linaweza kueleweka kuwa tendo jepesi.
- source_word: הַמִּזְבֵּחָה
  choice: kwenye madhabahu
  rationale: Kiishio cha mwelekeo katika Kiebrania kinaonyesha mwendo kuelekea madhabahu, huku muktadha ukidokeza damu ilifikishwa kwenye sehemu yake.
- source_word: הָאֵלִים
  choice: kondoo dume
  rationale: אילים humaanisha kondoo dume kwa wazi.
- source_word: הַכְּבָשִׂים
  choice: wanakondoo
  rationale: כבשים katika orodha ya dhabihu kwa kawaida humaanisha kondoo wachanga; ‘wanakondoo’ ni neno la kawaida na sahihi.
