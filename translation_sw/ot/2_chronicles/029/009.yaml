base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: sw
  text: Na tazama[a], baba zetu wameanguka kwa upanga, na wana wetu, binti zetu na wake zetu wako utumwani[b] kwa sababu ya jambo hili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “angalia.” Neno la Kiebrania linavuta fikira kwa msisitizo kuelekea kauli inayofuata.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “katika utekwaji.”
    reason: literal_rendering
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Kiunganishi וְ kimehifadhiwa kwa “Na,” huku “tazama” kikitoa msisitizo wa kiashiria הִנֵּה kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: נָפְלוּ
  choice: wameanguka
  rationale: Huhifadhi taswira ya kitenzi נפל, ambacho katika muktadha huu kinaashiria kufa kwa vita bila kuondoa tamathali ya Kiebrania.
- source_word: אֲבוֹתֵינוּ
  choice: baba zetu
  rationale: Huhifadhi neno mahususi la undugu la Kiebrania badala ya kulipanua kuwa “mababu zetu” au “wazee wetu.”
- source_word: בֶּחָרֶב
  choice: kwa upanga
  rationale: Ni ulinganifu wa kawaida wa nahau ya Kiebrania inayoeleza kifo cha vurugu kwa silaha.
- source_word: וּבָנֵינוּ
  choice: na wana wetu wa kiume
  rationale: “Wana wa kiume” huweka wazi utofauti wa בנים na “binti” wanaotajwa mara baada yake.
- source_word: וּבְנוֹתֵינוּ
  choice: binti zetu
  rationale: Ni ulinganifu wa moja kwa moja unaohifadhi kundi tofauti lililotajwa katika Kiebrania.
- source_word: וְנָשֵׁינוּ
  choice: na wake zetu
  rationale: Katika orodha hii ya kifamilia yenye kiambishi cha umilikaji, “wake zetu” ndilo chaguo lenye usahihi wa kimuktadha.
- source_word: בַּשְּׁבִי
  choice: wako utumwani
  rationale: Nomino yenye kihusishi inaeleza hali ya kuwa mateka; “wako utumwani” ni Kiswahili cha kawaida na huwasilisha hali hiyo.
- source_word: עַל זֹאת
  choice: kwa sababu ya jambo hili
  rationale: Huonyesha sababu inayorejelea hali ya kutokuwa waaminifu iliyotangulia na matokeo yake.
theological_decisions:
- issue: Maneno ya undugu yenye jinsia katika tangazo la hukumu
  choice: baba zetu ... wana wetu wa kiume, binti zetu na wake zetu
  alternative: mababu zetu ... watoto wetu na wanawake wetu
  rationale: Kiebrania kinataja makundi mahususi ya kifamilia; tafsiri imehifadhi tofauti hizo bila kuzifanya kuwa makundi ya jumla.
- issue: Uhusiano wa sababu katika עַל זֹאת
  choice: kwa sababu ya jambo hili
  alternative: juu ya hili
  rationale: Muktadha unaonyesha kuwa maafa hayo ni matokeo ya kosa lililotajwa, lakini “jambo hili” halifafanuliwi zaidi ili kuepuka kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya heshima lakini ya sasa. “Na tazama” huhifadhi msisitizo wa usemi wa Kiebrania; “wameanguka kwa upanga” huhifadhi taswira yake ya makusudi, na orodha ya kifamilia imeachwa wazi na mahususi.
