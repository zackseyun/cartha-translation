  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: sw
  text: Makuhani peke yao walikuwa wachache sana, nao hawakuweza kuwachuna wanyama wote wa sadaka za kuteketezwa. Kwa hiyo ndugu zao, Walawi, wakawasaidia[a] mpaka kazi ilipomalizika na mpaka makuhani walipojitakasa. Kwa maana Walawi walikuwa wanyoofu wa moyo zaidi[b] katika kujitakasa kuliko makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wakawatia nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa na moyo wa dhati zaidi.” Kiebrania kinakazia unyofu au uaminifu wa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno linaonyesha tofauti na jambo lililotangulia; “Lakini” ni ya asili katika Kiswahili na bado inadokeza kuwa tatizo hasa lilikuwa uchache wa makuhani.
- source_word: לִמְעָט
  choice: walikuwa wachache mno
  rationale: Pamoja na kitenzi היה, kirai kinaonyesha idadi isiyotosha, si uchache wa kawaida tu.
- source_word: לְהַפְשִׁיט
  choice: kuwachuna ngozi wanyama
  rationale: Kitenzi kinamaanisha kuondoa ngozi ya mnyama wa dhabihu. Kutaja “wanyama” kwa uwazi hufanya Kiswahili kiwe cha kawaida bila kubadili maana.
- source_word: הָעֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Hili ni neno la kawaida la dhabihu iliyoteketezwa yote; tafsiri hii ni sahihi na inaeleweka katika Kiswahili cha Biblia.
- source_word: וַיְחַזְּקוּם
  choice: wakawasaidia
  rationale: Maana halisi ni ‘wakawatia nguvu,’ lakini katika muktadha huu inamaanisha kuwapa msaada wa vitendo ili kukamilisha kazi. “Wakawasaidia” ni Kiswahili cha asili; maana halisi imehifadhiwa katika tanbihi.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Huhifadhi neno la kifamilia la Kiebrania na hapa linaelekeza kwa Walawi wenzao katika huduma ya hekalu.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: mpaka kazi ilipomalizika
  rationale: Huwasilisha kwa kawaida muda ulioendelea hadi kazi ilipokamilika.
- source_word: יִתְקַדְּשׁוּ
  choice: walipojitakasa
  rationale: Katika mazingira ya kikuhani, kitenzi cha hitpael kinaonyesha kujitayarisha kwa utakaso wa ibada kwa ajili ya huduma takatifu.
- source_word: יִשְׁרֵי לֵבָב
  choice: walikuwa wanyofu zaidi moyoni
  rationale: Huhifadhi taswira ya Kiebrania kuhusu unyofu au uaminifu wa ndani pamoja na nguvu ya ulinganisho.
- source_word: לְהִתְקַדֵּשׁ מֵהַכֹּהֲנִים
  choice: katika kujitakasa kuliko makuhani
  rationale: Kiambishi מן kinaonyesha ulinganisho. Muundo huu wa Kiswahili unahifadhi ulinganisho kati ya Walawi na makuhani bila kuufanya kuwa madai mapana kuhusu ukuhani wote.
theological_decisions:
- issue: Asili ya ulinganisho kati ya Walawi na makuhani
  choice: Walawi walikuwa wanyofu zaidi moyoni katika kujitakasa kuliko makuhani.
  alternative: Walawi walikuwa wepesi zaidi au wenye bidii zaidi kujitakasa kuliko makuhani.
  rationale: יִשְׁרֵי לֵבָב inaelekeza hasa kwenye unyofu au uaminifu wa ndani, si kasi au utayari wa kiutendaji pekee. Ulinganisho umehifadhiwa bila kuupanua kuwa hukumu dhidi ya ukuhani kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida huku istilahi za dhabihu na wazo la kujitakasa kwa huduma takatifu zikihifadhiwa.
