  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּגִּ֨ישׁוּ֙ אֶת שְׂעִירֵ֣י הַֽ/חַטָּ֔את לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/קָּהָ֑ל וַ/יִּסְמְכ֥וּ יְדֵי/הֶ֖ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: sw
  text: Kisha wakawaleta wale mbuzi dume wa sadaka ya dhambi mbele ya mfalme na kusanyiko, nao wakaweka mikono yao juu ya mbuzi hao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema, “wakaweka mikono yao juu yao.” Kiima cha “wakaweka” kwa kawaida hurejelea mfalme na kusanyiko, labda wakitenda kupitia wawakilishi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: wakawaleta karibu
  rationale: Hifili ya נגשׁ humaanisha kuleta karibu au kuwasilisha. Kauli hii inadumisha wazo la kuwasogeza wanyama mbele katika mazingira ya dhabihu na ni ya asili katika Kiswahili.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: wale beberu wa sadaka ya dhambi
  rationale: שְׂעִירֵי ni mbuzi wa kiume, ambao kwa Kiswahili cha kawaida huitwa beberu; הַחַטָּאת hapa ni sadaka inayotolewa kwa ajili ya dhambi, si dhambi yenyewe.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Katika muktadha huu wa ibada, neno hili linaonyesha kuwa wanyama waliwasilishwa mbele ya mfalme na kusanyiko.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: mfalme na kusanyiko
  rationale: קָהָל ni jumuiya iliyokusanyika. “Kusanyiko” ni neno wazi lisiloingiza maana maalumu ya dhehebu.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: nao wakaweka mikono yao
  rationale: סמך pamoja na “mikono” katika ibada ya dhabihu hueleza tendo la kiibada la kuweka mikono juu ya mnyama. Kiwakilishi “nao” kinaelekeza kwa wahusika waliotajwa karibu zaidi bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: עֲלֵיהֶם
  choice: juu ya hao beberu
  rationale: Kiwakilishi cha Kiebrania kinawarejelea beberu. Kurudia nomino katika Kiswahili kunazuia utata wa “juu yao,” ambao ungeweza kueleweka kana kwamba unawahusu mfalme na kusanyiko.
theological_decisions:
- issue: Maana ya חַטָּאת katika mazingira ya dhabihu
  choice: sadaka ya dhambi
  alternative: dhambi
  rationale: Katika matumizi ya kikuhani na ya dhabihu, חַטָּאת mara nyingi ni sadaka inayohusiana na dhambi. Kutajwa kwa beberu wanaoletwa na kuwekewa mikono kunathibitisha maana hiyo hapa.
- issue: Wanaorejelewa na kiima cha “wakaweka mikono yao”
  choice: Mfalme na kusanyiko ndio warejelewa wa kawaida zaidi, labda wakitenda kupitia wawakilishi
  alternative: Makuhani ndio walioweka mikono juu ya beberu
  rationale: Waliotajwa karibu zaidi ni mfalme na kusanyiko, na “mikono yao” kwa kawaida huwarejelea wao kwa pamoja. Tafsiri haiongezi “mfalme na kusanyiko” katika kishazi cha pili, hivyo inadumisha kiwango cha utata wa Kiebrania; tanbihi inaeleza uwezekano wa tendo kufanywa kupitia wawakilishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Beberu” limetumiwa kutaja mbuzi wa kiume kwa usahihi; “kusanyiko” huepuka rangi maalumu ya kidhehebu. Nomino “beberu” imerudiwa mwishoni ili kuondoa utata wa kawaida wa viwakilishi katika Kiswahili.
