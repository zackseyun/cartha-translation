- from: Kisha wakawaleta karibu wale beberu wa sadaka ya dhambi mbele ya mfalme na kusanyiko, nao wakaweka mikono yao juu ya hao beberu.[a]
  to: Kisha wakawaleta wale mbuzi dume wa sadaka ya dhambi mbele ya mfalme na kusanyiko, nao wakaweka mikono yao juu ya mbuzi hao.[a]
  rationale: Revision improves idiomatic Swahili and makes the goats, rather than the king and assembly, unambiguously the object of the hand-laying. It retains the Hebrew’s implicit subject in the final clause and explains the likely referent only in the footnote.
