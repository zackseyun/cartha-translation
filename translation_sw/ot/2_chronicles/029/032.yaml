  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: sw
  text: Idadi ya sadaka za kuteketezwa ambazo kusanyiko lilileta ilikuwa ng’ombe sabini, kondoo dume mia moja, na wanakondoo mia mbili. Wote hao walikuwa kwa ajili ya sadaka ya kuteketezwa kwa BWANA.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: sadaka za kuteketezwa
  rationale: Neno עֹלָה linamaanisha sadaka inayoteketezwa kabisa; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Biblia.
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: Huwakilisha kundi la watu waliokusanyika kama jumuiya bila kuongeza wazo lisilotajwa la kikabila au kitaasisi.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: Ni jina la jumla la ng’ombe; chanzo hakitumii neno mahususi linalomaanisha mafahali pekee, hivyo jinsia haijaongezwa.
- source_word: אֵילִים
  choice: kondoo dume
  rationale: Hutofautisha kondoo dume waliokomaa na wanakondoo wanaotajwa baadaye.
- source_word: כְּבָשִׂים
  choice: wanakondoo
  rationale: Hutoa maana ya kondoo wachanga na kudumisha utofauti wa orodha ya wanyama.
- source_word: יהוה
  choice: BWANA
  rationale: Hufuata desturi pana ya Kiswahili ya kuwakilisha jina la agano la Mungu kwa herufi kubwa, bila kuingiza matamshi yenye utata katika matini kuu.
theological_decisions:
- issue: Uwakilishaji wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: BWANA ni namna inayotambulika sana katika Biblia za Kiswahili na inadumisha heshima pamoja na desturi ya uingizwaji wa jina; matamshi kamili ya jina la Kiebrania hayana uhakika.
- issue: Jinsia ya בָּקָר
  choice: ng’ombe
  alternative: mafahali
  rationale: Neno la chanzo ni la jumla kwa kundi la ng’ombe. Kutafsiri “mafahali” kungebainisha jinsia ambayo aya yenyewe haibainishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Sentensi mbili zimetumiwa ili orodha ndefu isomeke kwa urahisi bila kupoteza uhusiano wa kimantiki wa Kiebrania.
