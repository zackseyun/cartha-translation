source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ לְ/הַעֲל֥וֹת הָ/עֹלָ֖ה לְ/הַ/מִּזְבֵּ֑חַ וּ/בְ/עֵ֞ת הֵחֵ֣ל הָֽ/עוֹלָ֗ה הֵחֵ֤ל שִׁיר יְהוָה֙ וְ/הַ/חֲצֹ֣צְר֔וֹת וְ/עַ֨ל יְדֵ֔י כְּלֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: sw
  text: Ndipo Hezekia akaamuru sadaka ya kuteketezwa itolewe juu ya madhabahu. Wakati sadaka ya kuteketezwa ilipoanza kutolewa, wimbo wa Yahwe[a] ukaanza pia, pamoja na tarumbeta na kwa kutumia vyombo vya muziki vya Daudi, mfalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wimbo kwa Yahwe.” Kiebrania kinasema moja kwa moja, “wimbo wa Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: akaamuru ... itolewe
  rationale: Ingawa וַיֹּאמֶר kwa kawaida ni ‘akasema,’ muundo wake pamoja na kitenzi-jina chenye לְ hapa una nguvu ya agizo. Kiswahili ‘akaamuru ... itolewe’ huwasilisha agizo hilo kwa lugha ya kawaida bila kudai kwamba kitenzi וַיֹּאמֶר peke yake humaanisha ‘kuamuru.’
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sadaka inayoteketezwa yote, na linafaa katika muktadha wa ibada.
- source_word: לַמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Huwasilisha kwa uwazi mahali sadaka ilipotolewa na kudumisha maana ya kihusishi cha Kiebrania.
- source_word: הֵחֵל ... הֵחֵל
  choice: ulipoanza ... ukaanza pia
  rationale: Kurudia ‘anza’ kunahifadhi urudiaji wa kimakusudi wa kitenzi cha Kiebrania na kuonyesha matukio hayo mawili yaliyoanza kwa wakati mmoja.
- source_word: שִׁיר יְהוָה
  choice: wimbo wa Yahwe
  rationale: Muundo wa moja kwa moja ‘wimbo wa Yahwe’ huhifadhi uhusiano wenye uwezekano wa kueleweka kama umiliki, uhusiano wa kiibada, au kuelekezwa kwa Yahwe, bila kuamua kimya-kimya maana moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: הַחֲצֹצְרוֹת
  choice: tarumbeta
  rationale: Neno hili humaanisha tarumbeta za ibada; ‘tarumbeta’ ni neno la kawaida na haliongezi habari ya kwamba zilikuwa za fedha, ambayo haijasemwa hapa.
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: na kwa kutumia vyombo vya muziki vya Daudi
  rationale: Nahau וְעַל יְדֵי inaonyesha njia au kifaa kilichotumiwa. ‘Vyombo vya muziki’ huweka wazi maana ya כְּלֵי katika muktadha huu wa uimbaji na ibada.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Cheo cha kifalme kimetafsiriwa moja kwa moja na kwa mtindo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi jina hilo bila kulibadilisha kuwa ‘BWANA.’
- issue: Maana ya שִׁיר יְהוָה
  choice: wimbo wa Yahwe
  alternative: wimbo kwa Yahwe
  rationale: Kiambatano cha Kiebrania hakisemi wazi ikiwa ni wimbo unaomhusu, unaomhusu kwa umiliki wa kiibada, au unaoelekezwa kwa Yahwe. Tafsiri kuu inahifadhi muundo huo; maana ya kuelekezwa kwake imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya kwanza imetumia muundo wa agizo unaoeleweka kwa urahisi; sentensi ya pili imedumisha urudiaji wa ‘anza’ uliopo katika Kiebrania. ‘Vyombo vya muziki’ huondoa utata usiofaa wa neno ‘vyombo’ katika muktadha huu.
