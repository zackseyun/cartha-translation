  text: וַ/יַּֽעַמְד֤וּ הַ/לְוִיִּם֙ בִּ/כְלֵ֣י דָוִ֔יד וְ/הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְרֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: sw
  text: Kisha Walawi wakasimama wakiwa na vyombo vya muziki vya Daudi[a], na makuhani wakiwa na tarumbeta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyombo vya muziki vilivyokuwa vya Daudi.” Maneno ya Kiebrania yanaweza kumaanisha vyombo vilivyokuwa mali ya Daudi, vilivyoagizwa naye, au vilivyohusishwa naye.
    reason: lexical_alternative
  - marker: b
    text: Yaani, tarumbeta za ibada zilizotumiwa na makuhani. Mahali pengine zinaelezwa kuwa za fedha, lakini aya hii haisemi hivyo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: Kisha ... wakasimama
  rationale: Muundo wa kusimulia unaendeleza tukio kwa hatua inayofuata. ‘Kisha ... wakasimama’ ni Kiswahili cha kawaida kinachohifadhi maana ya msingi ya עמד, yaani kusimama au kuchukua nafasi.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi la kikabila na la huduma la Walawi; udhahiri wa Kiebrania unaeleweka kwa jina hili katika muktadha.
- source_word: בִּכְלֵי דָוִיד
  choice: wakiwa na vyombo vya muziki vya Daudi[a]
  rationale: Ingawa כְּלִי lina maana pana ya chombo au kifaa, muktadha wa ibada na muziki unaonyesha kuwa ni vyombo vya muziki. Muundo ‘vya Daudi’ unahifadhi uhusiano mpana wa Kiebrania bila kuamua kama vilikuwa mali yake, vilitengenezwa kwa agizo lake, au vilihusishwa naye.
- source_word: וְהַכֹּהֲנִים
  choice: na makuhani
  rationale: Tafsiri ya moja kwa moja inayohifadhi kiunganishi na kundi la pili linaloratibiwa na Walawi.
- source_word: בַּחֲצֹצְרוֹת
  choice: wakiwa na tarumbeta[b]
  rationale: חֲצֹצְרוֹת ni tarumbeta zilizotumiwa na makuhani katika ibada. Neno ‘fedha’ halijaongezwa kwa kuwa halipo katika aya hii.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya ‘wakiwa na’ yanaweka wazi muundo sambamba wa makundi mawili na pia yanawakilisha kitenzi kinachoeleweka katika sehemu ya pili ya sentensi ya Kiebrania.
