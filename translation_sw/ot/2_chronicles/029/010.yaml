  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: sw
  text: Sasa nimekusudia moyoni mwangu kufanya agano[a] na Yahwe, Mungu wa Israeli, ili hasira yake kali ituondokee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kukata agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Kielezi hiki kinaonyesha uamuzi wa Hezekia wa wakati huu na umuhimu wake wa haraka.
- source_word: עִם לְבָבִי
  choice: nimekusudia moyoni mwangu
  rationale: Nahau ya Kiebrania inaeleza nia au azimio la ndani; tafsiri hii huhifadhi taswira ya moyo kwa Kiswahili cha kawaida.
- source_word: לִכְרֹת בְּרִית
  choice: kufanya agano
  rationale: Ingawa Kiebrania husema kihalisi ‘kukata agano,’ ‘kufanya agano’ ndiyo nahau ya kawaida na iliyo wazi katika Kiswahili.
- source_word: לַיהוָה
  choice: na Yahwe
  rationale: Katika muktadha wa kufanya agano, lamed humtambulisha mshirika wa agano; ‘na’ ni ya asili katika Kiswahili. Jina la agano יהוה limetafsiriwa ‘Yahwe.’
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hiki ni cheo cha moja kwa moja kinachomtambulisha Mungu wa taifa la Israeli.
- source_word: וְיָשֹׁב מִמֶּנּוּ
  choice: ili ... ituondokee
  rationale: Kiunganishi na kitenzi hapa vinaweza kueleza matokeo yanayotarajiwa au kusudi; ‘ili ... ituondokee’ ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: חֲרוֹן אַפּוֹ
  choice: hasira yake kali
  rationale: Kirai kinaonyesha hasira yenye nguvu au inayowaka; ‘hasira yake kali’ ni wazi na cha heshima katika Kiswahili cha sasa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Uhusiano kati ya kufanya agano na kuondoka kwa hasira
  choice: ili hasira yake kali ituondokee
  alternative: na hasira yake kali itatuondokea
  rationale: Muundo wa Kiebrania unaweza kubeba kusudi au matokeo yanayotarajiwa, si lazima ahadi ya matokeo ya moja kwa moja. ‘Ili’ huhifadhi mvutano huo bila kudai zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Taswira ya moyo imehifadhiwa, huku nahau isiyo ya kawaida ya ‘kukata agano’ ikitafsiriwa kwa njia ya asili.
