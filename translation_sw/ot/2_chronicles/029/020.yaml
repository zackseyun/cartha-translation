base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: sw
  text: Ndipo Mfalme Hezekia akaamka mapema, akawakusanya viongozi wa mji, kisha akapanda kwenda kwenye nyumba ya Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyumba ya YHWH.” YHWH ni jina la Mungu; katika tafsiri za jadi mara nyingi hutafsiriwa “BWANA.”'
    reason: Hufafanua kwa usahihi jina la Kiebrania na desturi ya kulitafsiri, bila kudokeza usomaji mbadala wa chanzo.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: akaamka mapema
  rationale: Hifili ya שׁכם huonyesha kuamka au kuanza shughuli mapema asubuhi. “Akaamka mapema” ni Kiswahili cha kawaida na kinahifadhi maana ya wakati.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: Mfalme Hezekia
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi cheo cha mfalme pamoja na jina lake.
- source_word: וַיֶּאֱסֹף
  choice: akawakusanya
  rationale: Katika muktadha huu אָסַף humaanisha kuwaleta watu pamoja; kiambishi cha yambwa “-wa-” kinaonyesha wazi kwamba waliokusanywa ni viongozi.
- source_word: שָׂרֵי הָעִיר
  choice: viongozi wa mji
  rationale: שָׂרִים hapa ni wenye mamlaka ya kiraia. “Viongozi” huepuka kudokeza kwamba walikuwa wana wa kifalme au wakuu wa kurithi huku ikibaki wazi kwa msomaji wa kawaida.
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: עָלָה ni “kupanda.” Usemi huu unahifadhi taswira ya kupanda kuelekea mahali patakatifu bila kuibadili kuwa “akaenda” tu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri hii inahifadhi usemi halisi wa Kiebrania “nyumba ya YHWH” badala ya kuufafanua moja kwa moja kuwa “hekalu,” na inalitoa jina la agano la Mungu kama jina.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana Tetragramatoni יְהוָה moja kwa moja. “Yahwe” ni umbo linaloeleweka katika Kiswahili na linahifadhi jina hilo; tanbihi inataja desturi nyingine ya kulitafsiri kuwa “BWANA.”
- issue: Maana ya בֵּית יְהוָה
  choice: nyumba ya Yahwe
  alternative: hekalu la Yahwe
  rationale: “Nyumba” inahifadhi sitiari ya chanzo na haitatui kimya kimya usemi huo kwa neno la ufafanuzi “hekalu,” ingawa katika muktadha unarejelea hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Viunganishi “ndipo” na “kisha” vinaweka mfuatano wa vitendo wazi; “akapanda kwenda” kinadumisha taswira ya Kiebrania.
