base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
translation:
  language: sw
  text: 'Na kutoka kwa wana wa Hemani: Yehueli na Shimei; na kutoka kwa wana wa Yeduthuni: Shemaya na Uzieli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: Na kutoka kwa
  rationale: Kiunganishi וּ kinaendeleza orodha ya mstari uliotangulia, hivyo “Na kutoka kwa” kinahifadhi mtiririko wa nyongeza wa Kiebrania.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Hii ni tafsiri ya moja kwa moja ambayo katika muktadha wa nasaba au vikundi inaweza pia kumaanisha wazao au washiriki wa ukoo.
- source_word: הֵימָן
  choice: Hemani
  rationale: Jina limetoholewa kwa kufuata namna ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: יחואל
  choice: Yehueli
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la konsonanti la Kiebrania; tofauti za mapokeo ya Kiingereza hazihitaji tanbihi katika Kiswahili.
- source_word: וְשִׁמְעִי
  choice: na Shimei
  rationale: Kiunganishi kimehifadhiwa ili kudumisha muundo wa orodha, na jina limetoholewa.
- source_word: יְדוּתוּן
  choice: Yeduthuni
  rationale: Jina limetoholewa kwa namna inayoeleweka na wasomaji wa Kiswahili.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina limetoholewa kutoka Kiebrania bila kutegemea umbo la Kiingereza.
- source_word: וְעֻזִּיאֵל
  choice: na Uzieli
  rationale: Kiunganishi cha mwisho kimehifadhiwa na jina limetoholewa kwa namna ya kawaida ya Kiswahili.
