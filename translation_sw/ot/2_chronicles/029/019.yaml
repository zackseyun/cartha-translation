id: 2CH.29.19
reference: 2 Chronicles 29:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: sw
  text: Na vyombo vyote ambavyo Mfalme Ahazi alivitupa kando[a] wakati wa utawala wake, alipokosa uaminifu[b], tumevitayarisha na kuviweka wakfu; na tazama, viko mbele ya madhabahu ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliviacha bila kutumiwa” au “alivipuuzia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika tendo lake la kuvunja uaminifu.” Neno la Kiebrania linasisitiza kosa la kuvunja uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: vyombo
  rationale: Katika muktadha wa hekalu, neno hili pana linamaanisha vifaa au vyombo vilivyotumiwa katika ibada; “vyombo” ni la kawaida na wazi kwa Kiswahili.
- source_word: הִזְנִיחַ
  choice: alivitupa kando
  rationale: Kauli hii inaonyesha tendo la kuviacha au kuviondoa katika matumizi, si kutovitunza tu. “Alivitupa kando” inadumisha uzito wa tendo hilo.
- source_word: בְּמַלְכוּתוֹ
  choice: wakati wa utawala wake
  rationale: Kirai hiki kina maana ya wakati, yaani katika kipindi ambacho Ahazi alikuwa mfalme.
- source_word: בְּמַעֲלוֹ
  choice: alipokosa uaminifu
  rationale: מַעַל huonyesha uvunjaji wa uaminifu, hasa kwa Mungu. Kauli ya kitenzi ni ya asili katika Kiswahili na inadumisha maana hiyo ya kimaadili na kidini.
- source_word: הֵכַנּוּ
  choice: tumevitayarisha
  rationale: Kitenzi hiki hapa humaanisha kuvifanya viwe tayari kwa matumizi tena.
- source_word: וְהִקְדָּשְׁנוּ
  choice: na kuviweka wakfu
  rationale: Hii inaeleza kuvitenga kwa matumizi matakatifu katika ibada ya hekaluni.
- source_word: וְהִנָּם
  choice: na tazama, viko
  rationale: “Tazama” inadumisha nguvu ya neno la Kiebrania linalovuta fikira kwa hali na mahali vilipo vyombo hivyo.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: mbele ya madhabahu ya Yahwe
  rationale: “Mbele ya” ni tafsiri ya kawaida ya mahali, nayo Yahwe inawakilisha jina la Mungu lililoandikwa moja kwa moja katika maandishi ya Kiebrania.
theological_decisions:
- issue: Maana ya בְּמַעֲלוֹ
  choice: alipokosa uaminifu
  alternative: katika kosa lake la kuvunja uaminifu
  rationale: Neno hili halisemi kosa la jumla tu, bali huvuta fikira kwa kuvunja uaminifu kwa Mungu. Tafsiri iliyochaguliwa ni wazi bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina maalumu la Mungu, יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. “Vyombo,” “kuweka wakfu,” na “madhabahu” yanafaa kwa muktadha wa hekalu na yanaeleweka kwa wasomaji wa kawaida.
