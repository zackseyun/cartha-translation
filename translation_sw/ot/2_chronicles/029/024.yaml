  text: וַ/יִּשְׁחָטוּ/ם֙ הַ/כֹּ֣הֲנִ֔ים וַֽ/יְחַטְּא֤וּ אֶת דָּמָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה לְ/כַפֵּ֖ר עַל כָּל יִשְׂרָאֵ֑ל כִּ֤י לְ/כָל יִשְׂרָאֵל֙ אָמַ֣ר הַ/מֶּ֔לֶךְ הָ/עוֹלָ֖ה וְ/הַ/חַטָּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: sw
  text: Makuhani wakawachinja, kisha wakaipaka damu yao kwenye madhabahu[a] ili kufanya upatanisho kwa ajili ya Israeli yote, kwa sababu mfalme alikuwa amesema kwamba sadaka ya kuteketezwa na sadaka ya dhambi[b] zilikuwa kwa ajili ya Israeli yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaitumia damu yao kuitakasa madhabahu”; kitenzi cha Kiebrania kinaweza kumaanisha kutekeleza ibada ya utakaso au ya sadaka ya dhambi.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya utakaso.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: wakawachinja
  rationale: Katika muktadha wa dhabihu, שׁחט humaanisha kuchinja mnyama kwa ajili ya dhabihu; kiambishi cha wingi kinawarejelea mabeberu wa mstari uliotangulia.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: wakaitia damu yao juu ya madhabahu
  rationale: Kauli hii inaeleza kitendo cha kikuhani cha kuitumia damu madhabahuni katika ibada ya sadaka ya dhambi. Tafsiri hii inadumisha kitendo halisi bila kudai kuwa damu yenyewe ndiyo sadaka.
- source_word: לְכַפֵּר
  choice: ili kufanya upatanisho
  rationale: כפר katika muktadha wa dhabihu hueleza tendo la kufanya upatanisho; neno hili la kawaida la kibiblia linahifadhi uzito wa kiibada na kitheolojia.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: kwa ajili ya Israeli yote
  rationale: עַל pamoja na כפר huwaonyesha wale wanaonufaika na tendo la upatanisho.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya dhabihu hizo kuwahusu Israeli wote.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: mfalme alikuwa amesema kwamba ... zilikuwa kwa ajili ya Israeli yote
  rationale: Mpangilio huu wa Kiswahili unaeleza kwa kawaida nia ya mfalme iliyotangulia na kudumisha maana ya Kiebrania.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno linalotumika kwa dhabihu iliyoteketezwa madhabahuni.
- source_word: וְהַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika muktadha huu חַטָּאת ni jina la aina ya dhabihu. 'Sadaka ya dhambi' ni tafsiri iliyo wazi na inayotambulika, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya istilahi za dhabihu zinazohusiana na חטא/חטאת
  choice: sadaka ya dhambi katika matini kuu
  alternative: sadaka ya utakaso
  rationale: Istilahi ya Kiebrania inaweza kusisitiza kushughulikia dhambi au kutakasa kutokana na unajisi. Matini kuu inatumia istilahi inayoeleweka kwa urahisi, lakini tanbihi inadumisha maana mbadala bila kuondoa mvutano wa kifasiri.
- issue: Kitendo cha damu madhabahuni
  choice: wakaitia damu yao juu ya madhabahu
  alternative: wakaitumia damu yao kuitakasa madhabahu
  rationale: Hiphil ya חטא katika ibada inaweza kueleweka kuwa kutekeleza ibada ya utakaso/sadaka ya dhambi. Tafsiri kuu inaonyesha kitendo halisi na kuacha maana hiyo pana katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. 'Madhabahu,' 'upatanisho,' na majina ya dhabihu yametumiwa kwa uthabiti wa istilahi za kibiblia; sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili.
