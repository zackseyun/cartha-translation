  text: יְחִזְקִיָּ֣הוּ מָלַ֗ךְ בֶּן עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ אֲבִיָּ֖ה בַּת זְכַרְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: sw
  text: Hezekia alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, naye akatawala miaka ishirini na tisa huko Yerusalemu. Mama yake aliitwa Abiya, binti ya Zekaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekia
  rationale: Umbo hili la jina linatumika kwa kawaida katika tafsiri za Kiswahili na linawakilisha jina la Kiebrania bila kulitafsiri maana yake.
- source_word: מָלַךְ
  choice: alipoanza kutawala
  rationale: Tukio la kwanza linaeleza kuingia kwake katika ufalme; usemi huu ni wa asili katika Kiswahili na unaonyesha maana ya kuanza kuwa mfalme.
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni tafsiri ya kawaida ya nahau ya Kiebrania ya kutaja umri, badala ya kuiga muundo wake neno kwa neno.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: akatawala miaka ishirini na tisa
  rationale: Kauli hii inaeleza muda wa utawala wake kwa Kiswahili cha kawaida na kwa usahihi.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi kinaonyesha mahali palipokuwa kitovu cha utawala; 'huko' ni ya asili baada ya kitenzi cha kutawala.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Ni uwasilishaji wa Kiswahili wa kawaida wa fomula ya Kiebrania inayosema jina la mama yake.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Unukuzi huu unafuata matumizi yaliyozoeleka ya majina ya Biblia katika Kiswahili.
- source_word: בַּת
  choice: binti ya
  rationale: Hapa neno hilo linaonyesha uhusiano wa kizazi, yaani kwamba Abiya alikuwa binti wa Zekaria.
- source_word: זְכַרְיָהוּ
  choice: Zekaria
  rationale: Hili ndilo umbo la jina lililozoeleka katika Kiswahili cha Biblia.
