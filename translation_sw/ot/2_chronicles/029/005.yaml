base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: sw
  text: Naye akawaambia, “Nisikilizeni, enyi Walawi. Sasa jitakaseni, na itakaseni nyumba ya Yahweh, Mungu wa baba zenu. Ondoeni unajisi[a] kutoka mahali patakatifu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uchafu unaonajisi”; neno la Kiebrania linamaanisha kile kinachofanya mahali patakatifu kuwa najisi.
    reason: lexical_alternative
  - marker: b
    text: Au “kutoka patakatifu,” yaani, kutoka katika eneo la hekalu lililotengwa kuwa takatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: Nisikilizeni
  rationale: Amri yenye kiambishi cha nafsi ya kwanza umoja; ni mwito wa moja kwa moja na wa kawaida katika Kiswahili cha sasa.
- source_word: הַלְוִיִּם
  choice: enyi Walawi
  rationale: Ni neno la kuwaita moja kwa moja watu wa kabila na huduma ya Lawi; “enyi” huonyesha wazi usemi wa moja kwa moja.
- source_word: עַתָּה
  choice: Sasa
  rationale: Huhifadhi maana ya wakati wa sasa na msukumo wa kuanza tendo bila kuongeza dhana ya haraka kupita ilivyo katika Kiebrania.
- source_word: הִתְקַדְּשׁוּ
  choice: jitakaseni
  rationale: Kauli ya kujirejelea ya mzizi קדשׁ; “jitakaseni” huonyesha maandalizi yao kwa huduma takatifu.
- source_word: וְקַדְּשׁוּ
  choice: na kuitakasa
  rationale: Huhifadhi mzizi uleule wa Kiswahili uliotumiwa katika “jitakaseni,” kama Kiebrania kinavyorudia mzizi קדשׁ, huku kitu cha tendo kikiwa nyumba ya Yahweh.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Tafsiri ya karibu ya usemi “nyumba ya YHWH”; haibadili usemi huo moja kwa moja kuwa “hekalu.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu linalowakilishwa na tetragramatoni יְהוָה badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Huhifadhi usemi wa agano na maana ya moja kwa moja ya אבות katika muktadha huu.
- source_word: וְהוֹצִיאוּ
  choice: Ondoeni
  rationale: Kauli hii ya kusababisha kutoka ina maana ya kuondoa kitu kinachonajisi mahali patakatifu; “ondoeni” ni ya kawaida na sahihi katika Kiswahili.
- source_word: הַנִּדָּה
  choice: unajisi
  rationale: Katika muktadha wa kulisafisha hekalu, neno hili huelekea kumaanisha hali au vitu vinavyonajisi patakatifu, si uchafu wa kawaida tu.
- source_word: מִן הַקֹּדֶשׁ
  choice: kutoka mahali patakatifu
  rationale: קֹדֶשׁ hapa inaelekea kutaja eneo takatifu; tafsiri hii huhifadhi maana hiyo bila kuamua kwa lazima kwamba ni hekalu lote.
theological_decisions:
- issue: Uwakilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano יְהוָה, si cheo; “Yahweh” hulihifadhi kama jina binafsi.
- issue: Maana ya kujitakasa na kuitakasa nyumba
  choice: jitakaseni, na kuitakasa
  alternative: jiwekeni wakfu, na kuiweka wakfu
  rationale: Mzizi mmoja wa Kiswahili umetumiwa kwa vitendo vyote viwili ili kuhifadhi urudiaji wa קדשׁ. Katika muktadha huu kutakaswa kunahusisha maandalizi ya Walawi na kuondolewa kwa unajisi hekaluni, bila kufafanua zaidi taratibu ambazo aya haitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nisikilizeni, enyi Walawi” ni mwito wa moja kwa moja; “nyumba ya Yahweh” huhifadhi taswira ya Kiebrania. Sentensi imegawanywa kabla ya “Ondoeni” ili maagizo yasomeke kwa uwazi bila kubadili uhusiano wake wa kimaana.
