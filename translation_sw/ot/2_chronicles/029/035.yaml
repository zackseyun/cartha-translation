  edition: WLC
  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: sw
  text: Sadaka za kuteketezwa pia zilikuwa nyingi, pamoja na mafuta ya sadaka za amani[a] na sadaka za kinywaji kwa ajili ya sadaka za kuteketezwa. Hivyo, huduma ya nyumba ya Yahweh ikawekwa katika utaratibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: pia
  rationale: Inaonyesha wazo la nyongeza linalounganisha sentensi hii na muktadha uliotangulia, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: עֹלָה
  choice: sadaka za kuteketezwa
  rationale: Ingawa neno la Kiebrania liko katika umbo la umoja, hapa limetumika kwa maana ya jumla; wingi unafaa kwa sababu sadaka hizo zilikuwa nyingi.
- source_word: לָרֹב
  choice: zilikuwa nyingi
  rationale: Ni tafsiri ya asili ya Kiswahili inayoonyesha kiasi kikubwa.
- source_word: בְּחֶלְבֵי
  choice: pamoja na mafuta ya
  rationale: Katika muktadha wa dhabihu, חלב ni sehemu za mafuta zilizotolewa kwa Mungu; 'pamoja na' huonyesha uhusiano wa vitu vilivyoambatana.
- source_word: הַשְּׁלָמִים
  choice: sadaka za amani
  rationale: Inahifadhi jina la kundi hili la dhabihu bila kulifungamanisha na fasiri finyu zaidi; 'sadaka za ushirika' imeonyeshwa katika tanbihi kama uwezekano mwingine.
- source_word: וּבַנְּסָכִים
  choice: na sadaka za kinywaji
  rationale: נְסָכִים ni matoleo ya kimiminika yaliyomiminwa; usemi huu ni wazi na wa kawaida katika Kiswahili cha Biblia.
- source_word: לָעֹלָה
  choice: kwa ajili ya sadaka za kuteketezwa
  rationale: Inaonyesha kwamba sadaka za kinywaji zilihusiana na sadaka za kuteketezwa zilizotajwa.
- source_word: וַתִּכּוֹן
  choice: ikawekwa katika utaratibu
  rationale: Kitenzi כון hapa kinaonyesha huduma kuwekwa tayari na katika hali inayofaa; tafsiri hii huhifadhi maana hiyo bila kuongeza moja kwa moja wazo la 'kurejeshwa.'
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: huduma ya nyumba ya Yahweh
  rationale: Inahifadhi muundo wa maneno na maana ya ibada au utumishi wa hekalu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawakilisha moja kwa moja jina la agano יהוה badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yana Tetragramatoni moja kwa moja; 'Yahweh' huhifadhi jina hilo kama jina binafsi la Mungu.
- issue: Maana ya neno la kidini שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: '''Sadaka za amani'' huhifadhi istilahi ya aina hii ya dhabihu, huku tanbihi ikionyesha tafsiri nyingine halali bila kuamua kimya kwamba ushirika pekee ndio kiini chake.'
- issue: Maana ya וַתִּכּוֹן baada ya kuvurugika kwa huduma ya hekalu
  choice: ikawekwa katika utaratibu
  alternative: ikaanzishwa tena
  rationale: Kiebrania kinaweza kueleza kuthibitishwa, kutayarishwa, au kupangwa kwa uthabiti. Chaguo hili huhifadhi maana ya msingi bila kuingiza wazi zaidi wazo la urejesho kuliko maandishi yanavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Istilahi za dhabihu zimewekwa wazi kwa msomaji wa kawaida, huku muundo wa ibada wa maandishi ya Kiebrania ukihifadhiwa.
