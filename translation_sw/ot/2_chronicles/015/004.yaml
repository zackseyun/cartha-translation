base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: sw
  text: Lakini katika dhiki yao[a] walimrudia Yahwe, Mungu wa Israeli; wakamtafuta, naye akapatikana kwao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata umbo la Kiebrania kwa karibu zaidi: “katika dhiki yake”; umoja huo unamtaja Israeli kwa maana ya jamii nzima.'
    reason: lexical_alternative
  - marker: b
    text: 'Au, kwa kusisitiza utayari wa Mungu kujibu: “naye akakubali wao wampate.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: walimrudia
  rationale: Kitenzi שׁוּב humaanisha kurudi au kugeuka tena. Ingawa kitenzi cha Kiebrania kiko katika umoja, hapa Israeli inaelezwa kwa maana ya jumla, na vitenzi vinavyofuata viko katika wingi; hivyo wingi wa Kiswahili unaweka wazi rejeo hilo la pamoja.
- source_word: בַּצַּר לוֹ
  choice: katika dhiki yao
  rationale: צַר hapa ni hali ya taabu au dhiki. Kiwakilishi cha umoja katika maandishi ya Kiebrania kinaielekea Israeli kama jamii moja; Kiswahili cha wingi kinapatana kwa ufasaha na vitenzi na viwakilishi vinavyofuata.
- source_word: עַל יְהוָה
  choice: walimrudia Yahwe
  rationale: עַל pamoja na שׁוּב hapa hueleza kumgeukia au kumrudia mtu. 'Walimrudia' ni usemi wa kawaida unaobeba wazo la kurejea kwa Mungu baada ya kuwa mbali naye.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi 'Yahwe' badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa umilikaji, inayohifadhi utambulisho wa Yahwe kuwa Mungu wa Israeli.
- source_word: וַיְבַקְשֻׁהוּ
  choice: wakamtafuta
  rationale: בקשׁ inapokuwa na Mungu kama mtendewa humaanisha kumtafuta kwa kumwelekea na kutaka msaada au ushirika wake; 'wakamtafuta' ni fupi, ya kawaida, na ya uaminifu kwa chanzo.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: naye akapatikana kwao
  rationale: Nifali ya מצא ina maana ya 'kupatikana.' Tafsiri ya hali ya kutendwa inahifadhi moja kwa moja muundo na utata wa Kiebrania bila kuamua kimyakimya kiwango ambacho usemi huo unasisitiza utendaji wa Mungu.
theological_decisions:
- issue: Umoja wa kijamii dhidi ya wingi katika kifungu cha kwanza
  choice: 'Kutumia wingi: ''katika dhiki yao walimrudia'''
  alternative: 'Tafsiri rasmi zaidi: ''katika dhiki yake alirudi'''
  rationale: Israeli inatajwa kama jamii moja kwa umoja, lakini vitenzi vinavyofuata ni vya wingi. Wingi ni wa kawaida zaidi katika Kiswahili huku tanbihi ikihifadhi umbo halisi la chanzo.
- issue: Utendaji wa Mungu katika וַיִּמָּצֵא לָהֶם
  choice: '''naye akapatikana kwao'''
  alternative: '''naye akakubali kupatikana kwao'' au ''akajidhihirisha kwao'''
  rationale: Hali ya kutendwa ya Kiebrania inaweza kueleweka kwa kuhusisha utayari wa Mungu kupatikana, lakini maandishi hayasemi hilo wazi kwa kitenzi cha kuruhusu. Tafsiri kuu inahifadhi mvutano huo, na tanbihi inaonyesha uwezekano wa maana yenye kusisitiza utendaji wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Dhiki' inafaa kwa muktadha wa kibiblia bila kuwa ya kizamani; 'walimrudia' huwasilisha kwa kawaida wazo la kurejea kwa Mungu. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
