  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: sw
  text: Taifa moja lilipondwa na taifa jingine, na mji mmoja ulipondwa na mji mwingine, kwa maana Mungu aliwafadhaisha[a] kwa kila aina ya dhiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwatia katika machafuko.”
    reason: Kitenzi הֲמָמָם kinaweza kusisitiza kuwafanya wachanganyikiwe au kuwa katika machafuko, badala ya fadhaa kwa ujumla.
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: lilipondwa
  rationale: Kitenzi cha Pual kinaonyesha kuvunjwa au kupondwa kwa nguvu. “Lilipondwa” kinahifadhi ukali wa picha ya Kiebrania bila kuongeza wazo la kuangamizwa kabisa.
- source_word: גוֹי בְּגוֹי
  choice: taifa moja ... na taifa jingine
  rationale: Muundo huu unaonyesha taifa likishambuliwa na taifa jingine. Kutaja “moja” na “jingine” kunafanya usemi wa mgawanyo wa Kiebrania uwe wa kawaida na wazi katika Kiswahili.
- source_word: וְעִיר בְּעִיר
  choice: na mji mmoja na mji mwingine
  rationale: Huu ni muundo sambamba na kifungu cha mataifa; kitenzi kilichotangulia kinaeleweka pia hapa, huku ufupi wa asili ukihifadhiwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatanguliza sababu ya maangamizi yaliyoelezwa kabla yake.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi, kitenzi chake ni cha umoja na muktadha unamtaja Mungu mmoja.
- source_word: הֲמָמָם
  choice: aliwafadhaisha
  rationale: Mzizi המם unaweza kumaanisha kusababisha fadhaa, vurugu, au kuchanganyikiwa. “Aliwafadhaisha” ni Kiswahili cha sasa kinachohifadhi tendo la Mungu na upana wa maana.
- source_word: בְּכָל צָרָה
  choice: kwa kila aina ya dhiki
  rationale: Kihusishi kinaonyesha njia au mazingira ya tendo, na כָּל ina nguvu ya ujumla; “kila aina ya dhiki” ni usemi wa kawaida unaowasilisha maana hiyo.
theological_decisions:
- issue: Uhusika wa Mungu katika majanga
  choice: Mungu ametajwa wazi kuwa ndiye aliyewafadhaisha.
  alternative: Mungu aliruhusu wafadhaishwe.
  rationale: Kiebrania kina kitenzi tendaji chenye Mungu kama mtendaji. Tafsiri haipaswi kupunguza uhusika huo na kuufanya ruhusa tu, wala kuongeza maelezo ya kiteolojia yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa “moja ... jingine” umetumiwa ili kufanya jozi za mgawanyo ziwe za kawaida katika Kiswahili huku usambamba wa Kiebrania ukidumishwa.
