  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: sw
  text: Lakini maeneo ya juu ya ibada hayakuondolewa kutoka Israeli. Hata hivyo, moyo wa Asa ulikuwa kamili siku zake zote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: mahali pa juu pa kuabudia
  rationale: Neno hili humaanisha maeneo ya ibada yaliyokuwa kwenye miinuko au yaliyoitwa hivyo hata bila kuwa juu; nyongeza ya “pa kuabudia” huweka maana wazi kwa msomaji wa leo bila kuamua hapa aina ya ibada iliyofanywa.
- source_word: לֹא סָרוּ
  choice: hapakuondolewa
  rationale: Kauli ya kutendwa inawasilisha kwa kawaida kwamba maeneo hayo hayakuondoshwa, huku ikihifadhi wingi wa maana wa kitenzi cha Kiebrania unaoweza pia kumaanisha kwamba hayakutoweka.
- source_word: שָׁלֵם
  choice: mkamilifu
  rationale: Huhifadhi wazo la moyo kuwa mzima au usiogawanyika, bila kulipanua moja kwa moja kuwa kutokuwa na dhambi au kuwa “umejitolea kikamilifu.”
theological_decisions:
- issue: Tathmini ya moyo wa Asa licha ya mahali pa juu kubaki
  choice: moyo wa Asa ulikuwa mkamilifu
  alternative: moyo wa Asa ulijitoa kikamilifu
  rationale: “Mkamilifu” hudumisha mvutano wa maandishi kati ya kushindwa kuondoa mahali pa juu na tathmini chanya ya moyo wake, bila kueleza kupita kiasi namna ukamilifu huo ulivyoonekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumika ili mtiririko uwe wa asili huku kiunganishi רַק kikielezwa kwa “Hata hivyo.”
