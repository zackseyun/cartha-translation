base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: sw
  text: Akatoka kumlaki Asa, akamwambia, “Nisikilizeni, Asa, na Yuda yote, na Benyamini! Yahwe yuko pamoja nanyi wakati mko pamoja naye. Mkimtafuta, mtampata[a]; lakini mkimwacha, atawaacha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata umbo la Kiebrania kwa karibu zaidi: “atapatikana kwenu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: Akatoka kwenda kumlaki Asa
  rationale: Kitenzi יצא kinaendeleza simulizi kwa maana ya ‘akatoka,’ na לִפְנֵי baada ya kitenzi cha mwendo hapa inaeleweka kwa kawaida kuwa kwenda kumlaki Asa, si kusimama tu mbele yake.
- source_word: שְׁמָעוּנִי
  choice: Nisikilizeni
  rationale: Ni amri ya wingi yenye kiambishi cha nafsi ya kwanza umoja. ‘Nisikilizeni’ ni Kiswahili cha sasa, cha moja kwa moja, na kinadumisha uzito wa kauli ya kinabii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: yuko pamoja nanyi ... mko pamoja naye
  rationale: Kurudia ‘pamoja na’ kunahifadhi ulinganifu na usawaziko wa usemi wa Kiebrania.
- source_word: בִּהְיוֹתְכֶם
  choice: wakati mko
  rationale: Muundo huu unaonyesha hali inayoendelea kwa wakati mmoja na unaweka wazi sharti la uhusiano bila kulifanya kuwa kauli ya muda mfupi tu.
- source_word: תִּדְרְשֻׁהוּ
  choice: Mkimsaka
  rationale: דרש katika muktadha wa uhusiano wa agano humaanisha kumtafuta Mungu kwa moyo na mwenendo, si kumuuliza habari tu.
- source_word: יִמָּצֵא לָכֶם
  choice: mtampata
  rationale: Ingawa umbo la Kiebrania ni la kutendwa (‘atapatikana kwenu’), ‘mtampata’ ni usemi wa kawaida na wazi katika Kiswahili na unawasilisha matokeo yale yale bila kuongeza wazo kwamba Mungu analazimishwa kupatikana. Umbo la karibu zaidi na sarufi ya chanzo limewekwa katika tanbihi.
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: mkimwacha, atawaacha
  rationale: Kurudia kitenzi ‘-acha’ kunahifadhi urudiano wa Kiebrania na maana ya kuacha uaminifu wa uhusiano.
theological_decisions:
- issue: Urudiano wenye masharti katika lugha ya agano
  choice: Yahwe kuwa pamoja na watu kunaelezwa sambamba na wao kuwa pamoja naye; kumtafuta au kumwacha kunafuatiwa na matokeo yanayolingana.
  alternative: Kufanya masharti haya yawe maelezo ya hisia au uzoefu tu, bila uzito wa uhusiano wa agano.
  rationale: Kiebrania kina vifungu dhahiri vya masharti na lugha ya kurudiana. Tafsiri inadumisha mvutano huo bila kuamua masuala mapana ya kitheolojia kuhusu kudumu katika imani au kuasi.
- issue: Kauli ya kutendwa katika יִמָּצֵא לָכֶם
  choice: mtampata, huku tafsiri ya karibu zaidi na umbo la kutendwa ikitolewa katika tanbihi
  alternative: atawaruhusu mmwone
  rationale: Chanzo kinasema ‘atapatikana’ lakini hakisemi wazi ‘atawaruhusu.’ Kwa hiyo tafsiri haiongezi kwa siri wazo la ruhusa ya kimungu, wala haiondoi ukweli kwamba Mungu ndiye anayepatikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na ina uzito wa hotuba ya kinabii bila kutumia msamiati wa kale usio wa lazima.
