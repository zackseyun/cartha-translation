  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: sw
  text: Na hapakuwa na vita mpaka mwaka wa thelathini na tano wa utawala wa Asa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka mwaka wa 35 wa kutawala kwa Asa.” Baadhi ya wafafanuzi huelewa hesabu hii kwa mfumo mpana zaidi wa mpangilio wa nyakati, badala ya kuhesabu miaka ya utawala wa Asa pekee, ili kuipatanisha na vifungu vinavyohusiana.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: Wala hapakuwa na vita
  rationale: Muundo wa Kiebrania ni kishazi cha kuwapo kilichokanushwa. Kiswahili cha kawaida husema “hapakuwa na vita”; “wala” linaunganisha sentensi hii na habari iliyotangulia huku likidumisha ukanushi.
- source_word: עַד
  choice: mpaka
  rationale: Neno hili linaonyesha kikomo cha kipindi ambacho hakikuwa na vita.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: mwaka wa thelathini na tano
  rationale: Huu ni usemi wa mwaka wa utawala; Kiswahili huutoa kwa namba ya mpangilio.
- source_word: לְמַלְכוּת
  choice: wa utawala wa
  rationale: Katika kauli ya kuhesabu miaka ya mfalme, מַלְכוּת humaanisha kipindi cha kutawala, si eneo la ufalme.
- source_word: אָסָא
  choice: Asa
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Kauli ya wakati ikilinganishwa na mpangilio wa matukio ya Asa katika vifungu vinavyohusiana
  choice: Kutafsiri moja kwa moja kuwa “mwaka wa thelathini na tano wa utawala wa Asa.”
  alternative: Kuuhesabu mwaka huo kwa mfumo mpana zaidi wa matukio, kama vile tangu kugawanyika kwa ufalme, au kurekebisha namba ili kupatanisha vifungu.
  rationale: Maandishi ya Kiebrania yanahusisha wazi mwaka wa thelathini na tano na utawala wa Asa. Tafsiri haipaswi kutatua kimya kimya mvutano wa mpangilio wa matukio kwa kubadili maana iliyo wazi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hapakuwa na vita” ni usemi wa kawaida na wazi; “utawala” hufikisha maana ya kipindi cha mfalme kutawala bila kuingiza ufafanuzi wa kimadhehebu.
