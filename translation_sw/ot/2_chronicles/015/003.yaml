lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: Kwa muda mrefu
  rationale: Kirai hiki ni cha muda; tafsiri hii ni ya kawaida katika Kiswahili na huwasilisha maana ya siku nyingi bila kuwa ngumu.
- source_word: לְיִשְׂרָאֵל
  choice: Israeli ilikuwa
  rationale: Herufi ל inaonyesha hali inayohusu Israeli; Kiswahili huhitaji kitenzi kishirikishi ili kueleza hali hiyo kwa kawaida.
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: bila Mungu wa kweli
  rationale: Muundo wa Kiebrania unaweza kumaanisha kihalisi ‘Mungu wa kweli/ukweli’; katika muktadha huu, ‘Mungu wa kweli’ ni wa kawaida na hudumisha tofauti na ibada isiyo ya kweli.
- source_word: כֹּהֵן מוֹרֶה
  choice: kuhani anayefundisha
  rationale: מוֹרֶה ni umbo la kitendo linaloonyesha kazi inayoendelea ya kufundisha; kishazi hiki ni wazi na cha kawaida kuliko ‘kuhani mfundishaji.’
- source_word: תּוֹרָה
  choice: mafundisho
  rationale: Neno hili lina wigo wa maana unaojumuisha mafundisho, maelekezo, na sheria. ‘Mafundisho’ huhifadhi upana huo na linaendana na jukumu la kuhani la kufundisha.
theological_decisions:
- issue: Maana na uainisho wa אֱלֹהֵי אֱמֶת
  choice: Mungu wa kweli
  alternative: Mungu wa ukweli; Mungu mwaminifu
  rationale: Tafsiri iliyochaguliwa humtambulisha Mungu wa Israeli kwa kawaida bila kuficha kwamba אֱמֶת pia inaweza kuonyesha ukweli au uaminifu; uwezekano huo umewekwa katika tanbihi.
- issue: Tafsiri ya תּוֹרָה
  choice: mafundisho
  alternative: sheria; Torati; maelekezo
  rationale: Katika muktadha wa kuhani anayefundisha, neno linaweza kuwa pana kuliko sheria iliyoandikwa pekee. ‘Mafundisho’ huepuka kupunguza maana bila sababu, huku tanbihi ikihifadhi tafsiri nyingine halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Urudiaji wa ‘bila’ umehifadhiwa ili kuonyesha mkazo na muundo sambamba wa Kiebrania.
