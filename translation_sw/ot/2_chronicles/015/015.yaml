  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: sw
  text: Yuda yote ilifurahia kiapo hicho[a], kwa sababu walikuwa wameapa kwa moyo wao wote na walimtafuta kwa mapenzi yao yote. Nao wakampata, na Yahwe akawapa pumziko pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kiebrania, “akapatikana nao.”
    reason: Huhifadhi hali ya kutendwa ya kitenzi cha Kiebrania; maandishi makuu hutumia usemi wa kawaida wa Kiswahili.
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ כָל־יְהוּדָה
  choice: Yuda yote ikafurahia
  rationale: Kauli hii inamtaja Yuda kwa maana ya pamoja, yaani watu au ufalme wake; umoja wa kisarufi katika Kiswahili unaendana na jina hilo la pamoja huku ukihifadhi maana ya furaha ya jumuiya.
- source_word: עַל הַשְּׁבוּעָה
  choice: kiapo hicho
  rationale: עַל pamoja na kitenzi cha kufurahi huonyesha jambo lililosababisha au lililokuwa lengo la furaha. 'Kufurahia kiapo hicho' ni Kiswahili cha kawaida na huunganisha kiapo na muktadha uliotangulia.
- source_word: בְכָל לְבָבָם נִשְׁבָּעוּ
  choice: walikuwa wameapa kwa moyo wao wote
  rationale: Usemi 'kwa moyo wao wote' huhifadhi picha ya Kiebrania ya kujitoa kwa ukamilifu; wakati uliotangulia unaonyesha kuwa kuapa ndiko kulikosababisha furaha.
- source_word: וּבְכָל רְצוֹנָם בִּקְשֻׁהוּ
  choice: na kumtafuta kwa nia yao yote
  rationale: רָצוֹן hapa hueleza utashi au nia ya hiari. 'Kwa nia yao yote' ni ya asili katika Kiswahili na hudumisha ulinganifu na 'kwa moyo wao wote' bila kuibadili kuwa kielezi pekee.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Naye akapatikana nao
  rationale: 'Huhifadhi kwa karibu hali ya Niphal na uhusiano wa לָהֶם. Tafsiri hii pia hulinda mvutano wa kifungu: Yahwe ndiye aliyetafutwa na pia ndiye aliyepatikana, bila kuongeza wazi wazo la kwamba ''alijiruhusu'' kupatikana.'
- source_word: וַיָּנַח יְהוָה לָהֶם
  choice: Yahwe akawapa pumziko
  rationale: Hiphil ya נוח ina maana ya kusababisha wapumzike au kuwapa pumziko. 'Akawapa pumziko' huhifadhi mada ya kibiblia ya utulivu na usalama unaotolewa na Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa badala ya kubadilishwa kuwa cheo; 'Yahwe' ni umbo linalosomeka kwa kawaida katika tahajia ya Kiswahili.
- source_word: מִסָּבִיב
  choice: pande zote
  rationale: Ni usemi wa kawaida wa Kiswahili unaoeleza pumziko au usalama kutoka kila upande.
theological_decisions:
- issue: Jinsi ya kutafsiri וַיִּמָּצֵא לָהֶם kuhusu kupatikana kwa Mungu
  choice: Naye akapatikana nao
  alternative: Naye akawaruhusu wampate
  rationale: Muundo wa Kiebrania ni wa hali ya kutendwa na unaweza kueleweka kitheolojia kuwa Mungu alikubali kupatikana. Maandishi makuu yanahifadhi muundo na utata huo; tanbihi inaeleza tafsiri yenye maana ya kuruhusu bila kuifanya kuwa pekee.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, יהוה. Kulitohowa kama 'Yahwe' huhifadhi tofauti kati ya jina hilo na cheo 'Bwana'.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza mfuatano wa Kiebrania. 'Nia yao yote' huepuka uzito wa 'mapenzi yao yote' na utata wa kimapenzi wa 'tamaa yao yote'; 'pumziko pande zote' hudumisha msamiati wa kitheolojia wa Mambo ya Nyakati.
