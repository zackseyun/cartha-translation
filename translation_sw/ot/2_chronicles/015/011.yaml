base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: sw
  text: 'Siku hiyo walimtolea Yahweh dhabihu kutoka katika nyara[a] walizokuwa wameleta: ng’ombe mia saba na kondoo elfu saba.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali walizoteka vitani.” Neno la Kiebrania linamaanisha mali iliyotwaliwa kama nyara za vita.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha kwa upana zaidi mifugo midogo ya kundi, yaani kondoo na mbuzi, si kondoo peke yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: walimtolea ... dhabihu
  rationale: Kitenzi זבח katika muktadha huu kinamaanisha kuchinja au kutoa wanyama kama dhabihu. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya ibada.
- source_word: לַיהוָה
  choice: kwa Yahweh / walimtolea Yahweh
  rationale: Kihusishi ל huonyesha anayepokea dhabihu. Muundo wa Kiswahili ‘walimtolea Yahweh dhabihu’ unaonyesha hilo wazi, huku jina la agano יהוה likitafsiriwa kwa ‘Yahweh’.
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya kishazi hiki cha wakati katika Kiswahili cha sasa.
- source_word: מִן הַשָּׁלָל
  choice: kutoka katika nyara
  rationale: שָׁלָל ni mali au wanyama waliotwaliwa vitani. ‘Nyara’ ni neno fupi, lenye hadhi, na linaloeleweka katika muktadha huu.
- source_word: הֵבִיאוּ
  choice: walizokuwa wameleta
  rationale: Muundo huu unaonyesha kwamba nyara zilikuwa tayari zimeletwa kabla ya kutolewa kwa dhabihu.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: בָּקָר ni jina la jumla la mifugo ya jamii ya ng’ombe; ‘ng’ombe’ ni neno la kawaida na halibani maana kuwa maksai pekee.
- source_word: שְׁבַע מֵאוֹת
  choice: mia saba
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi hiyo.
- source_word: וְצֹאן
  choice: na kondoo
  rationale: צֹאן humaanisha mifugo midogo ya kundi, hasa kondoo na mbuzi. ‘Kondoo’ ni tafsiri ya kawaida na nyepesi kusoma, huku upana wa neno la Kiebrania ukielezwa katika tanbihi.
- source_word: שִׁבְעַת אֲלָפִים
  choice: elfu saba
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa asili katika Kiswahili bila kuondoa uhusiano wa dhabihu na nyara zilizoletwa.
