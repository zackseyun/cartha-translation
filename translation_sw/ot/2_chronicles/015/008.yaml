  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: sw
  text: Asa aliposikia maneno haya na unabii wa Odedi nabii[a], alijipa moyo, akaondoa vitu vya kuchukiza kutoka nchi yote ya Yuda na Benyamini, na kutoka miji ambayo aliteka katika nchi ya vilima ya Efraimu; kisha akaifanya upya madhabahu ya Yahweh, iliyokuwa mbele ya ukumbi wa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “unabii wa Odedi nabii.” Baadhi ya wafafanuzi na mijadala ya uhakiki wa maandishi huunganisha maneno haya na Azaria mwana wa Odedi anayetajwa katika muktadha unaozunguka.'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo huu wenye kitenzi-jina unaanzisha kishazi cha wakati; “aliposikia” ni Kiswahili cha kawaida kinachohifadhi mfuatano wa simulizi.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: Katika muktadha huu דְּבָרִים hurejelea ujumbe uliotangulia, hivyo “maneno haya” linafaa kuliko “mambo haya.”
- source_word: וְהַנְּבוּאָה
  choice: na unabii
  rationale: “Unabii” huhifadhi maana ya neno נְבוּאָה na uhusiano wake na ujumbe wa kinabii bila kuufafanua kupita kiasi.
- source_word: עֹדֵד הַנָּבִיא
  choice: wa Odedi nabii
  rationale: Maandishi ya Kiebrania yaliyotolewa yanamtaja Odedi nabii. Tafsiri haioanishi kimya kimya na Azaria mwana wa Odedi katika muktadha unaozunguka.
- source_word: הִתְחַזַּק
  choice: alijipa moyo
  rationale: Hifili ya kujirejelea hapa inaonyesha kwamba Asa alipata ujasiri na kuimarika katika kuitikia ujumbe; “alijipa moyo” ni ya asili na hudumisha wazo hilo.
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: akaondoa vitu vya kuchukiza
  rationale: שִׁקּוּצִים mara nyingi hurejelea vitu vinavyochukiza, hasa vya ibada ya sanamu. “Vitu vya kuchukiza” ni wazi huku kikundi cha vitu kikibaki bila kubanwa zaidi ya chanzo.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: katika nchi yote ya Yuda na Benyamini
  rationale: “Nchi” huwasilisha eneo au himaya inayokusudiwa na אֶרֶץ; “katika” ni ya asili baada ya kitenzi “akaondoa” katika Kiswahili.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: na katika miji aliyokuwa ameiteka katika nchi ya vilima ya Efraimu
  rationale: לכד ni “teka,” na מֵהַר אֶפְרָיִם hapa inaeleweka kijiografia. “Nchi ya vilima ya Efraimu” ni wazi kwa msomaji wa kawaida.
- source_word: וַיְחַדֵּשׁ
  choice: akaifanyia upya
  rationale: Pieli ya חדשׁ inamaanisha kufanya upya au kurejesha. “Akaifanyia upya” huhifadhi upana huo bila kuibana kuwa kukarabati tu.
- source_word: מִזְבַּח יְהוָה
  choice: madhabahu ya Yahweh
  rationale: Muundo milikishi umetafsiriwa moja kwa moja, na jina la agano יְהוָה limeandikwa “Yahweh.”
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: iliyokuwa mbele ya ukumbi wa Yahweh
  rationale: אוּלָם ni ukumbi wa mbele wa hekalu; “ukumbi” ni neno la kawaida na lenye hadhi, nalo “mbele ya” huhifadhi uhusiano wa mahali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, YHWH. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Mvutano wa kimaandishi kuhusu “Odedi nabii”
  choice: 'Maandishi makuu yanafuata WLC: “Odedi nabii”'
  alternative: “Azaria mwana wa Odedi” au uoanishaji mwingine unaotegemea muktadha
  rationale: Maandishi yaliyotolewa yanasema עֹדֵד הַנָּבִיא. Mvutano na muktadha unaozunguka haujatatuliwa kwa kubadili maandishi makuu, bali umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa sentensi umerahisishwa kwa kuweka sentensi mbili ili usomeke vizuri, bila kuondoa mfuatano wa matendo. Jina “Yahweh” limetumiwa kwa יְהוָה, na alama ya tanbihi [a] imewekwa katika maandishi makuu.
