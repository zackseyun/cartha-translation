base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: sw
  text: Lakini ninyi, iweni hodari, wala mikono yenu isilegee,[a] kwa maana kuna thawabu kwa kazi yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikono yenu isiwe dhaifu.” Nahau ya Kiebrania humaanisha kupoteza nguvu, moyo, au azimio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Lakini ninyi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinasisitiza utofautishaji na muktadha uliotangulia; Kiswahili hiki ni cha asili na huhifadhi msisitizo huo.
- source_word: חִזְקוּ
  choice: iweni hodari
  rationale: Amri ya wingi inahimiza uimara na ujasiri; ‘iweni hodari’ ni wazi, ya heshima, na ya kawaida katika Kiswahili sanifu.
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: wala mikono yenu isilegee
  rationale: Tafsiri hii inadumisha picha halisi ya mikono inayolegea huku ikieleweka kama kupoteza nguvu, moyo, au azimio.
- source_word: כִּי יֵשׁ
  choice: kwa maana kuna
  rationale: כִּי inatoa sababu ya himizo, na יֵשׁ ni kauli ya kuwapo; ‘kuna’ haiongezi wakati ujao ambao haukutajwa moja kwa moja.
- source_word: שָׂכָר
  choice: thawabu
  rationale: Neno hili linaweza kumaanisha malipo au ujira; ‘thawabu’ linafaa kwa muktadha mpana wa himizo bila kuifanya kauli iwe malipo ya kibiashara tu.
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: kwa ajili ya kazi yenu
  rationale: Huhifadhi maana ya kazi, tendo, au juhudi inayohusishwa na thawabu bila kufafanua zaidi ya maandishi.
theological_decisions:
- issue: Asili ya lugha ya malipo
  choice: kwa maana kuna thawabu kwa ajili ya kazi yenu
  alternative: kwa maana kazi yenu italipwa
  rationale: Kauli ya Kiebrania inathibitisha kuwapo kwa thawabu lakini haielezi fundisho kamili kuhusu kustahili, wokovu, au kuhesabiwa haki. Tafsiri huhifadhi ahadi hiyo bila kuingiza mfumo wa kiteolojia usiotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Picha ya ‘mikono kulegea’ imehifadhiwa kwa kuwa inaeleweka na inalinda nahau ya chanzo; tanbihi hufafanua maana yake pana.
