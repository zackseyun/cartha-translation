base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: sw
  text: Na katika nyakati hizo hakukuwa na amani kwa yeyote anayetoka wala kwa yeyote anayeingia[b], kwa sababu machafuko mengi[a] yaliwapata wakaaji wote wa nchi mbalimbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ghasia kubwa”; neno la Kiebrania linaweza kumaanisha machafuko, mkanganyiko, au taharuki.
    reason: lexical_alternative
  - marker: b
    text: Usemi “kutoka na kuingia” ni nahau ya Kiebrania inayomaanisha shughuli za kawaida za kwenda na kurudi, hasa kusafiri au kushiriki shughuli za hadharani.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: Na nyakati hizo
  rationale: Huhifadhi kishazi cha wakati na wingi wa עִתִּים kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֵין שָׁלוֹם
  choice: hapakuwa na amani
  rationale: Neno שָׁלוֹם linaweza kumaanisha amani, hali njema, au usalama; “amani” ni pana na muktadha unaonyesha ukosefu wa usalama.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: kwa mtu aliyetoka wala kwa mtu aliyeingia
  rationale: Huhifadhi jozi ya vitenzi na maana yake ya jumla. “Wala” ni ya asili katika sentensi hasi ya Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huonyesha wazi uhusiano wa kisababishi.
- source_word: מְהוּמֹת רַבּוֹת
  choice: machafuko mengi
  rationale: מְהוּמָה linaweza kuonyesha vurugu, mkanganyiko, taharuki, au ghasia; “machafuko mengi” hudumisha upana huo bila kubainisha kupita kiasi.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: yaliwapata wakaaji wote wa nchi mbalimbali
  rationale: “Yaliwapata” huwasilisha kwa Kiswahili cha asili wazo la machafuko kuwa juu ya watu au kuwafikia. Wingi הָאֲרָצוֹת umehifadhiwa kwa “nchi mbalimbali” ili kuepuka maana ya nchi moja tu.
