  rationale: The revision changes only the relative-verb aspect from completed past (‘aliyetoka/aliyeingia’) to generic ongoing action (‘anayetoka/anaeingia’), matching the Hebrew participles. It also adds ‘katika’ for a smooth temporal opening. Footnote anchors and content are retained.
