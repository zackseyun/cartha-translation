id: 2CH.15.12
reference: 2 Chronicles 15:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: sw
  text: Nao wakaingia katika agano la kumtafuta Yahweh, Mungu wa baba zao,[a] kwa moyo wao wote na kwa nafsi yao yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Mungu wa mababu zao—Mungu wa agano ambaye waliowatangulia walimwabudu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: wakaingia katika agano
  rationale: Kitenzi בוא pamoja na בַבְּרִית ni usemi wa kuingia katika wajibu wa agano, si mwendo wa kimwili tu. Kiswahili hiki ni cha kawaida na kinahifadhi tendo hilo la kiagano.
- source_word: לִדְרוֹשׁ
  choice: kumtafuta
  rationale: Katika muktadha wa kidini na wa agano, דרש humaanisha kumtafuta Mungu kwa kujitoa kwake, wala si kuuliza habari tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Tafsiri hii inahifadhi muundo na lugha ya kiume ya Kiebrania, huku ikimaanisha Mungu aliyeabudiwa na mababu wao.
- source_word: בְּכָל לְבָבָם
  choice: kwa moyo wao wote
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha utashi na utu wa ndani kwa ukamilifu.
- source_word: וּבְכָל נַפְשָׁם
  choice: na kwa nafsi yao yote
  rationale: נפשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. 'Nafsi yao yote' huhifadhi msamiati wa kiagano na wazo la kujitoa kikamilifu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. Kulihamisha kama 'Yahweh' huhifadhi tofauti kati ya jina hilo na cheo cha 'Bwana'.
- issue: Lugha ya ukoo katika אֲבוֹתֵיהֶם
  choice: baba zao
  alternative: mababu zao
  rationale: Kiebrania kinasema kihalisi 'baba zao.' Chaguo hili linahifadhi umbo la chanzo; tanbihi inaeleza kuwa hapa inawahusu waliowatangulia katika ukoo na imani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo 'wakaingia katika agano' umechaguliwa kwa sababu ni wa asili zaidi kuliko tafsiri ya neno kwa neno, huku 'moyo' na 'nafsi' zikihifadhi jozi ya kiagano ya Kiebrania.
