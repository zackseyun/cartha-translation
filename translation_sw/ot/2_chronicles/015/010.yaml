  text: Basi wakakusanyika Yerusalemu katika mwezi wa tatu, mwaka wa kumi na tano wa utawala wa Asa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: Basi wakakusanyika
  rationale: Kitenzi cha Kiebrania ni Niphal katika mfuatano wa masimulizi. “Wakakusanyika” ni Kiswahili cha kawaida kinachohifadhi maana ya watu kujikusanya pamoja, huku “Basi” ikiendeleza mtiririko wa simulizi.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: katika mwezi wa tatu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati wenye namba ya mpangilio.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: mwaka wa kumi na tano
  rationale: Katika fomula ya kuhesabu miaka ya utawala, kihusishi cha Kiebrania kinatafsiriwa kiasili kwa Kiswahili kwa usemi huu wa wakati.
- source_word: לְמַלְכוּת אָסָא
  choice: wa utawala wa Asa
  rationale: מַלְכוּת hapa humaanisha kipindi cha kutawala kwa mfalme, si eneo la ufalme; “utawala wa Asa” ni wazi na linafaa katika tarehe ya kifalme.
