base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/001.yaml
  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: sw
  text: Roho wa Mungu akamjia Azaria mwana wa Odedi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho wa Mungu alikuwa juu ya Azaria mwana wa Odedi.”
    reason: Mbadala huu huhifadhi kwa karibu zaidi muundo wa Kiebrania הָיְתָה עָלָיו, ambao unaweza kueleweka kama hali badala ya tukio la kuja.
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: Azaria
  rationale: Kiunganishi וַ kinaendeleza simulizi na kinaakisiwa kwa umbo la kitenzi “akamjia”; jina la mtu limetoholewa kwa matumizi ya kawaida ya Kiswahili cha Biblia.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hapa בֶּן ina maana yake ya kawaida ya uhusiano wa moja kwa moja wa baba na mwana, si maana pana ya mzao.
- source_word: עוֹדֵד
  choice: Odedi
  rationale: Jina limetoholewa kwa namna ya kawaida na inayotamkika kwa wasomaji wa Kiswahili.
- source_word: הָיְתָה עָלָיו
  choice: akamjia
  rationale: Ingawa kwa muundo wa karibu ni “alikuwa juu yake,” katika muktadha wa kinabii usemi huu una nguvu ya tukio—Roho alimjia mtu kwa ajili ya ujumbe au uwezeshaji. “Akamjia” ni Kiswahili cha asili kinachohifadhi nguvu hiyo.
- source_word: רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: Katika muktadha huu usemi huo unamtaja Roho wa Mungu anayemwezesha Azaria kusema kinabii. Muundo wa Kiswahili “Roho wa Mungu” unaonyesha maana mahsusi bila kuongeza madai yaliyo nje ya kifungu.
theological_decisions:
- issue: Je, רוּחַ אֱלֹהִים itafsiriwe kama nguvu/roho isiyo ya kibinafsi au kama Roho wa Mungu?
  choice: Roho wa Mungu
  alternative: roho ya Mungu; roho kutoka kwa Mungu
  rationale: Mfumo huu wa Mwandishi wa Mambo ya Nyakati unatambulisha uvuvio na uwezeshaji wa kinabii. “Roho wa Mungu” huakisi vizuri maana inayowezekana zaidi ya Kiebrania bila kufafanua kupita kiasi namna ya nafsi ya Roho katika mstari huu.
- issue: Je, הָיְתָה עָלָיו inaeleza tukio au hali endelevu?
  choice: akamjia
  alternative: alikuwa juu yake
  rationale: Muktadha unapendelea mwanzo wa uwezeshaji wa kinabii, lakini muundo wa Kiebrania unaweza pia kusomwa kwa hali tuli; kwa hiyo tafsiri hiyo mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya Maandiko. “Akamjia” huendeleza simulizi kwa kawaida; “mwana wa” ni wazi kwa msomaji wa kawaida. Herufi kubwa katika “Roho” inaendana na rejeo mahsusi kwa Roho wa Mungu.
