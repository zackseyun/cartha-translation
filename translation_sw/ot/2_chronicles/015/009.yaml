  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֗ץ אֶת כָּל יְהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/גָּרִים֙ עִמָּ/הֶ֔ם מֵ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וּ/מִ/שִּׁמְע֑וֹן כִּֽי נָפְל֨וּ עָלָ֤י/ו מִ/יִּשְׂרָאֵל֙ לָ/רֹ֔ב בִּ/רְאֹתָ֕/ם כִּֽי יְהוָ֥ה אֱלֹהָ֖י/ו עִמּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: sw
  text: Naye akawakusanya watu wote wa Yuda na Benyamini, pamoja na wakaaji wageni waliokuwa pamoja nao, waliotoka Efraimu, Manase, na Simeoni. Kwa maana watu wengi kutoka Israeli walikuwa wamejiunga naye[a] walipoona kwamba Yahwe Mungu wake alikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuwa wamehamia upande wake”; kihalisi, “walikuwa wameangukia kwake.” Nahau ya Kiebrania inaonyesha kwamba walihamisha uaminifu wao na kujiunga na Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: akawakusanya
  rationale: Kitenzi קבץ hapa kina maana ya kuwakusanya watu pamoja; “akawakusanya” ni cha kawaida na kinadumisha muundo wa simulizi.
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: watu wote wa Yuda na Benyamini
  rationale: Majina ya makabila na maeneo yanawakilisha watu wake. Kuongeza “watu” kunafanya maana iwe wazi na ya kawaida katika Kiswahili bila kubadili rejeleo.
- source_word: הַגָּרִים עִמָּהֶם
  choice: wale waliokaa miongoni mwao kama wageni
  rationale: גרים ni watu waliokaa katika eneo lisilo lao la asili. Hapa wanatoka makabila mengine ya Israeli, kwa hiyo tafsiri hii huepuka kuwafanya waonekane lazima kuwa wageni wasio Waisraeli.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: waliotoka Efraimu, Manase, na Simeoni
  rationale: Kiambishi מִן kinaonyesha walikotoka; “waliotoka” huunganisha asili yao kwa uwazi na kundi lililotangulia.
- source_word: נָפְלוּ עָלָיו
  choice: walikuwa wamejiunga naye
  rationale: Nahau ya Kiebrania, kihalisi “walikuwa wamemwangukia,” inaonyesha kuhamisha utii na kujiunga na upande wa Asa. “Walikuwa wamejiunga naye” ni ya asili na inaacha tanbihi ihifadhi taswira halisi na uzito wa kisiasa.
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: watu wengi kutoka Israeli
  rationale: לָרֹב inaonyesha wingi; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: בִּרְאֹתָם
  choice: walipoona
  rationale: Muundo wa infinitivu wenye ב unaonyesha hali au wakati uliosababisha tendo lao; “walipoona” hudumisha mtiririko wa simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: Mungu wake alikuwa pamoja naye
  rationale: Tafsiri ya moja kwa moja inadumisha wazo la uwepo na msaada wa Mungu bila kulifafanua kupita matini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina binafsi la agano; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuwa Mungu alikuwa “pamoja naye”
  choice: Mungu wake alikuwa pamoja naye
  alternative: Mungu wake alikuwa upande wake
  rationale: Usemi wa moja kwa moja huhifadhi uwezekano wa maana ya uwepo na msaada wa Mungu bila kuufinya kuwa msaada wa kisiasa au kijeshi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Wale waliokaa miongoni mwao kama wageni” limetumiwa kwa kuwa watu hao wanatajwa kuwa walitoka katika makabila mengine ya Israeli, hivyo “wageni” pekee lingeweza kupotosha. Sentensi imegawanywa mara mbili ili iweze kusomeka kwa urahisi bila kuvunja uhusiano wa kisababishi.
