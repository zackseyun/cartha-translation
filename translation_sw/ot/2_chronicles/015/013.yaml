base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: sw
  text: Na yeyote ambaye hangemtafuta BWANA[a], Mungu wa Israeli, alipaswa kuuawa, tangu aliye mdogo hadi aliye mkubwa[b], tangu mwanamume hadi mwanamke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe.” Kitenzi cha Kiebrania kinaweza pia kutafsiriwa kwa urahisi, “hakumtafuta,” lakini muktadha ni sharti la kiapo cha agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “tangu aliye wa chini kabisa hadi aliye mkuu kabisa.” Nahau ya Kiebrania inaonyesha watu wote katika jumuiya bila ubaguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Na yeyote ambaye
  rationale: Muundo huu unaonyesha kila mtu bila ubaguzi; “yeyote ambaye” ni Kiswahili cha kawaida na huhifadhi upeo wa kishazi cha Kiebrania.
- source_word: לֹא יִדְרֹשׁ
  choice: hangemtafuta
  rationale: דרשׁ katika muktadha wa kidini na wa agano humaanisha kumtafuta Mungu. Umbo lenye hali ya sharti linafaa katika taarifa hii ya masharti ya kiapo.
- source_word: לַיהוָה
  choice: BWANA
  rationale: Jina la agano יהוה limetafsiriwa kwa desturi ya Kiswahili kama “BWANA”; tanbihi huhifadhi mbadala wa kulitaja kama Yahwe.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii inawakilisha moja kwa moja muundo wa umilikaji unaomtambulisha kuwa Mungu wa Israeli.
- source_word: יוּמָת
  choice: alipaswa kuuawa
  rationale: Hophal ya מות ni ya kutendwa yenye maana ya kusababishwa kufa, yaani kuuawa. “Alipaswa” huonyesha sharti la kiapo linalosimuliwa ndani ya masimulizi.
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: tangu aliye mdogo hadi aliye mkubwa
  rationale: Nahau hii huonyesha jumuiya yote kwa kuunganisha ncha mbili; “mdogo” na “mkubwa” hazifungwi kwa umri pekee, bali zinaweza pia kuhusisha hadhi.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: tangu mwanamume hadi mwanamke
  rationale: Tafsiri hii huhifadhi jozi ya umoja ya Kiebrania na kuonyesha kwa msisitizo kwamba sharti liliwahusu jinsia zote.
theological_decisions:
- issue: Kuwasilisha adhabu kali ya agano bila kuipunguza au kuipanua
  choice: 'Kuhifadhi wazi adhabu ya kuuawa: “alipaswa kuuawa.”'
  alternative: Kutafsiri “angekufa” au kueleza kama kutengwa na jumuiya.
  rationale: יוּמָת husema wazi kusababishwa kufa, si kufa tu kwa ujumla wala kutengwa kwa mfano. Tafsiri inapaswa kuacha ukali wa taarifa ya Mwandishi wa Mambo ya Nyakati kama ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtindo wa kisheria wa kiapo na ukali wa adhabu bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
