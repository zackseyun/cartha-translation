base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/018.yaml
  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: sw
  text: 'Akaleta ndani ya nyumba ya Mungu vitu vilivyowekwa wakfu vya baba yake na vitu vyake vilivyowekwa wakfu: fedha, dhahabu, na vyombo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו
  choice: vitu ambavyo baba yake alikuwa ameviweka wakfu
  rationale: Neno קֹדֶשׁ hapa linaonyesha vitu vilivyotengwa kwa matumizi matakatifu au kutolewa kwa Mungu. Kauli ya Kiswahili inaeleza maana hiyo kwa kawaida bila kudai kwa uhakika kwamba vilikuwa 'zawadi' pekee.
- source_word: וְקָדָשָׁיו
  choice: na vitu ambavyo yeye mwenyewe alikuwa ameviweka wakfu
  rationale: Kiambishi cha umilikaji kinaelekezwa kwa mhusika wa kitenzi, yaani Asa; kurudia kauli hiyo kunahifadhi ulinganifu wa Kiebrania na kutofautisha vitu vyake na vya baba yake.
- source_word: בֵּית הָאֱלֹהִים
  choice: ndani ya nyumba ya Mungu
  rationale: Tafsiri ya moja kwa moja na iliyozoeleka, ikirejelea hekalu bila kulazimisha neno 'hekalu' mahali ambapo chanzo kinasema 'nyumba ya Mungu'.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: fedha, dhahabu na vyombo
  rationale: Inadumisha orodha ya chanzo. כֵּלִים ni neno pana kwa vyombo au vifaa; 'vyombo' linafaa katika muktadha wa hazina ya hekalu.
theological_decisions:
- issue: Maana ya vitu vilivyo vitakatifu
  choice: vitu ... alivyokuwa ameviweka wakfu
  alternative: zawadi takatifu za baba yake na zawadi zake mwenyewe
  rationale: Chanzo kinaweza kumaanisha mali iliyowekwa wakfu, si lazima zawadi kwa maana nyembamba. 'Kuweka wakfu' huhifadhi uhusiano wake na Mungu na matumizi matakatifu bila kuongeza aina maalumu ya utoaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umerahisishwa kwa kiasi ili sentensi isomeke kwa kawaida, huku maana na ulinganifu wa chanzo ukihifadhiwa.
