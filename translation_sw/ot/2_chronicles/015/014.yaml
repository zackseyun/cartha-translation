  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: sw
  text: Nao wakamwapia Yahweh kwa sauti kubwa, kwa kelele, kwa tarumbeta na kwa pembe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “shofari,” yaani pembe za kupuliza, mara nyingi pembe za kondoo dume; andiko linazitofautisha na “tarumbeta” zilizotajwa kabla yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: wakamwapia
  rationale: Nifali ya שׁבע hapa ina maana ya kula au kufanya kiapo. “Wakamwapia” ni usemi mfupi na wa kawaida unaoonyesha kwamba Yahwe ndiye aliyeapiwa.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Kihusishi ל־ kinamtaja yule ambaye kiapo kilielekezwa kwake, na jina la agano יהוה limetoholewa kuwa “Yahwe.”
- source_word: בְּקוֹל גָּדוֹל
  choice: kwa sauti kubwa
  rationale: Huu ni usemi wa kawaida wa Kiebrania unaomaanisha usemi wenye nguvu unaosikika wazi; “kwa sauti kubwa” ni Kiswahili cha asili na kinachohifadhi msisitizo wa sauti.
- source_word: וּבִתְרוּעָה
  choice: kwa kelele
  rationale: תְּרוּעָה inaweza kumaanisha ukelele, mwangwi wa kushangilia, au sauti ya mwito. “Kwa kelele” huhifadhi wazo la sauti ya pamoja bila kuamua kimkimya kwamba ilikuwa ya vita au ya furaha.
- source_word: וּבַחֲצֹצְרוֹת
  choice: kwa tarumbeta
  rationale: חֲצֹצְרוֹת ni tarumbeta ny直efu za metali zilizotumiwa katika ibada na mikusanyiko ya Israeli. “Tarumbeta” ni tafsiri ya kawaida na inayoeleweka.
- source_word: וּבְשׁוֹפָרוֹת
  choice: kwa pembe
  rationale: שׁוֹפָרוֹת ni ala za kupuliza zilizotengenezwa kwa pembe, tofauti na tarumbeta zilizotajwa kabla yake. “Pembe” huhifadhi tofauti hiyo kwa lugha rahisi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la ibada. Kurudiwa kwa “kwa” kunadumisha mkusanyiko wa sauti na ala katika Kiebrania. Neno “kelele” limeachwa bila kivumishi ili kutohusisha kwa lazima furaha au vita.
