id: 2CH.15.16
reference: 2 Chronicles 15:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: sw
  text: Hata Maaka, mama wa Mfalme Asa, Asa alimwondoa katika cheo cha malkia mama, kwa sababu alikuwa ametengeneza sanamu ya kuchukiza[b] kwa ajili ya Ashera[a]. Asa akaikata sanamu yake ya kuchukiza, akaipondaponda, kisha akaiteketeza kwa moto katika Bonde la Kidroni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ashera” linaweza kumaanisha mungu wa kike au alama ya ibada iliyohusishwa naye.
    reason: cultural_note
  - marker: b
    text: Au “kitu cha kutisha” au “sanamu ya machukizo.” Neno la Kiebrania hurejelea kitu cha ibada chenye kuchukiza au kutisha.
    reason: lexical_alternative
  - marker: c
    text: Au “katika kijito cha Kidroni” au “katika korongo la Kidroni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Hata
  rationale: 'Inaonyesha nyongeza yenye msisitizo: mageuzi ya Asa yalimfikia hata mtu wa karibu wa familia ya kifalme.'
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Jina limenukuliwa kwa tahajia ya kawaida na inayosomeka katika Kiswahili.
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: mama yake Mfalme Asa
  rationale: Inahifadhi uhusiano wa kifamilia na hadhi ya kifalme kwa mpangilio wa kawaida wa Kiswahili; neno la Kiebrania linaweza pia kumaanisha nyanya katika matumizi ya nasaba.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: alimwondoa katika cheo cha mama wa mfalme
  rationale: Kitenzi kinamaanisha kuondoa, na katika mazingira ya kifalme גְּבִירָה ni hadhi rasmi ya mama wa mfalme; tafsiri haiongezi dhana maalumu zaidi ya utaratibu wa kuvuliwa cheo.
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: kwa sababu alikuwa ametengeneza ... kwa ajili ya Ashera
  rationale: Kishazi kinaeleza sababu ya kuondolewa kwake, huku 'Ashera' ikihifadhi uhusiano wenye utata kati ya mungu wa kike na alama yake ya ibada.
- source_word: מִפְלָצֶת
  choice: sanamu ya kuchukiza
  rationale: Neno linaashiria kitu cha ibada chenye kutisha au kuchukiza. 'Sanamu' inaeleweka kutokana na kitu hicho kukatwa, kupondwa na kuchomwa.
- source_word: וַיִּכְרֹת
  choice: akaikata
  rationale: Kitenzi ni kukata au kukata chini; 'akaikata' ni cha asili na hakilazimishi umbo mahususi la kitu hicho.
- source_word: וַיָּדֶק
  choice: akaipondaponda
  rationale: Huwasilisha kuvunjwa au kusagwa kuwa vipande vidogo.
- source_word: וַיִּשְׂרֹף
  choice: akaiteketeza kwa moto
  rationale: Huwasilisha wazi tendo la kuchoma na kuharibu.
- source_word: בְּנַחַל קִדְרוֹן
  choice: katika Bonde la Kidroni
  rationale: נחל inaweza kumaanisha kijito, korongo au bonde la mto wa msimu; 'Bonde la Kidroni' ni usemi wa kijiografia unaoeleweka kwa wasomaji wa sasa.
theological_decisions:
- issue: Maana ya אֲשֵׁרָה
  choice: Ashera
  alternative: nguzo ya Ashera; mahali pa miti pa ibada
  rationale: Jina linahifadhi mazingira ya dini ya kale na kutatua kwa kiasi kidogo tu utata wa iwapo neno linamtaja mungu wa kike au alama yake ya ibada. Dokezo linaeleza uwezekano huo.
- issue: Cheo גְּבִירָה
  choice: mama wa mfalme
  alternative: malkia mama; mwanamke mkuu wa ikulu
  rationale: Katika muktadha wa kifalme wa Yuda, cheo hicho humaanisha hadhi ya mama wa mfalme, ingawa mhusika wa nasaba angeweza kuwa nyanya aliyeshika nafasi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi umehifadhi kasi ya simulizi ya Kiebrania, na istilahi za kiibada zimefafanuliwa bila kuingiza msimamo wa dhehebu.
