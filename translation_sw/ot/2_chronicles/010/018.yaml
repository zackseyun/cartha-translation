base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: sw
  text: Ndipo Mfalme Rehoboamu akamtuma Hadoramu[a], aliyekuwa msimamizi wa kazi ya kulazimishwa. Lakini wana wa Israeli[b] wakampiga kwa mawe, naye akafa. Naye Mfalme Rehoboamu akajitia nguvu kupanda gari la farasi ili akimbilie Yerusalemu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Hadoramu”; simulizi linalofanana katika 1 Wafalme 12:18 lina “Adoramu.”'
    reason: alternative_reading
  - marker: b
    text: Au, “Waisraeli.” “Wana wa Israeli” ni nahau ya Kiebrania inayolitaja taifa la Israeli.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kwa maana halisi zaidi: “akajitia nguvu kupanda gari ili akimbilie Yerusalemu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akamtuma
  rationale: Ni tafsiri ya kawaida ya שלח katika simulizi, na kiambishi cha mtendwa kinamtaja Hadoramu kwa njia ya asili katika Kiswahili.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Mfalme Rehoboamu
  rationale: Mpangilio huu wa cheo kabla ya jina ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: הֲדֹרָם
  choice: Hadoramu
  rationale: Linawakilisha moja kwa moja umbo la jina lililo katika maandishi ya Kiebrania ya Mambo ya Nyakati; tofauti ya 1 Wafalme imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: aliyekuwa msimamizi wa kazi ya kulazimishwa
  rationale: מַס hapa ni huduma ya kazi iliyotozwa kwa lazima, si kodi ya fedha tu; usemi huu ni wazi kwa msomaji wa sasa.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: wakampiga kwa mawe
  rationale: Kiswahili hiki kinaeleza wazi njia ya mauaji na kwa kawaida hakihitaji kurudia kitenzi na nomino kwa mtindo wa 'wakampiga kwa mawe kwa jiwe'.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa karibu nahau ya Kiebrania; tanbihi inaeleza kuwa ni jina la taifa, yaani Waisraeli.
- source_word: וַיָּמֹת
  choice: mpaka akafa
  rationale: Katika muktadha, matokeo ya kupigwa kwa mawe ni kifo; 'mpaka' huunganisha tendo na matokeo kwa Kiswahili cha asili bila kubadili tukio.
- source_word: הִתְאַמֵּץ
  choice: akajikaza
  rationale: Hitpaeli ya אמץ ina wazo la kujitia nguvu au kufanya jitihada; 'akajikaza' huhifadhi wazo hilo bila kuibadili kuwa kitenzi cha kuharakisha.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: kupanda gari
  rationale: עלה pamoja na מֶרְכָּבָה humaanisha kupanda gari la farasi; usemi huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: ili akimbilie Yerusalemu
  rationale: נוס ina maana ya kukimbia ili kujiokoa; 'akimbilie' huonyesha kukimbia kuelekea mahali pa usalama.
