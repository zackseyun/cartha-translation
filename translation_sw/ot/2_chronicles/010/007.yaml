base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: sw
  text: Wakamwambia, “Ukiwatendea mema watu hawa, ukawapendeza[a] na kusema nao maneno mazuri, basi watakuwa watumishi wako siku zote[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukawaonyesha kibali.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwapendeza au kuwatendea kwa kibali.
    reason: lexical_alternative
  - marker: b
    text: Au “watakutumikia daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: Ukiwatendea mema watu hawa
  rationale: Usemi huu unaonyesha kuwa au kutenda kwa manufaa ya watu. ‘Kuwatendea mema’ ni Kiswahili cha kawaida kinachofaa katika muktadha wa utawala na hakibani maana iwe wema wa tabia pekee.
- source_word: וּרְצִיתָם
  choice: ukawafurahisha
  rationale: Katika muktadha huu kitenzi kinaweza kueleza kuwafanya watu wapendezwe au kuwatendea kwa kibali. ‘Ukawafurahisha’ linaendeleza ushauri wa kuwapata watu kwa hatua za upatanisho; maana nyingine imehifadhiwa katika tanbihi.
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: na kusema nao maneno mazuri
  rationale: Tafsiri hii inadumisha nomino ‘maneno’ na sifa ‘mazuri,’ pamoja na wazo la kuelekeza maneno hayo kwa watu, kwa Kiswahili cha kawaida.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: watakuwa watumishi wako
  rationale: Katika muktadha huu עֲבָדִים inaeleza raia wanaomtii na kumtumikia mfalme. ‘Watumishi’ huhifadhi muundo wa nomino bila kuingiza wazo lisilohitajika la utumwa wa mali.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi taswira ya Kiebrania ya ‘siku zote’ na maana ya huduma inayoendelea.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo umefanywa wa kawaida bila kupoteza marudio na uhusiano wa mawazo katika Kiebrania.
