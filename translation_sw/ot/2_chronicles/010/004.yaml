base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: sw
  text: Baba yako aliifanya nira yetu kuwa ngumu[a]. Basi sasa, tupunguzie kazi ngumu ya baba yako[b] na nira yake nzito aliyotuwekea, nasi tutakutumikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliifanya nira yetu kuwa kali” au “aliifanya nira yetu kuwa nzito.”
    reason: lexical_alternative
  - marker: b
    text: “Kazi” hapa inaweza kumaanisha kazi ya kulazimishwa au wajibu uliowekwa juu ya watu chini ya utawala wa mfalme; pia inaweza kutafsiriwa “utumishi.”
    reason: cultural_note
lexical_decisions:
- source_word: הִקְשָׁה
  choice: aliifanya ... kuwa ngumu
  rationale: Kauli ya kusababisha katika Kiebrania imehifadhiwa kwa ‘aliifanya ... kuwa’; ‘ngumu’ inaonyesha ukali wa nira bila kubadili sitiari kuwa mzigo.
- source_word: עֻלֵּנוּ
  choice: nira yetu
  rationale: ‘Nira’ huhifadhi picha halisi ya עֹל na maana yake ya kitamathali ya utawala au wajibu mzito.
- source_word: הָקֵל
  choice: tupunguzie
  rationale: Ombi ni kwamba Rehoboamu apunguze uzito wa kazi na nira; ‘tupunguzie’ ni Kiswahili cha kawaida na huonyesha wazi wale wanaonufaika.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: kazi ngumu ya baba yako
  rationale: עֲבֹדָה inaweza kumaanisha kazi au utumishi. ‘Kazi ngumu’ ni ya kawaida na yenye kueleweka, huku tanbihi ikifafanua muktadha wa wajibu uliowekwa na mfalme.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: na nira yake nzito
  rationale: Huhifadhi sitiari inayorudiwa na kutafsiri כָּבֵד moja kwa moja kuwa ‘nzito’.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: aliyotuwekea
  rationale: ‘Aliyotuwekea’ ni usemi wa kawaida unaodumisha picha ya nira iliyowekwa juu ya watu bila kuongeza ufafanuzi usiotajwa.
- source_word: וְנַעַבְדֶךָּ
  choice: nasi tutakutumikia
  rationale: Hutoa kwa kawaida ahadi ya watu ya kumtumikia mfalme ikiwa atawapunguzia wajibu huo.
