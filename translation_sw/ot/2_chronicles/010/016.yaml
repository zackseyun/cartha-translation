base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: sw
  text: Kwa kuwa mfalme hakuwasikiliza, Israeli wote walimjibu mfalme, wakisema, “Tuna sehemu gani katika Daudi? Hatuna urithi katika mwana wa Yese. Enyi Israeli, kila mtu hemani kwake! Sasa angalia nyumba yako, Daudi.” Israeli wote wakaenda mahemani mwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “mahemani mwao.” Kauli ya kwenda hemani ni nahau ya kutawanyika na kwenda mahali pa kila mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: kuwasikiliza
  rationale: Katika muktadha huu kitenzi kina maana ya kusikiliza kwa kuitikia au kukubali ombi lao, si kusikia sauti tu.
- source_word: וַיָּשִׁיבוּ
  choice: walimjibu
  rationale: Muundo huu wa Kiebrania una maana ya kutoa jibu; ‘walimjibu’ ni Kiswahili cha kawaida na sahihi.
- source_word: חֵלֶק
  choice: sehemu
  rationale: ‘Sehemu’ huhifadhi sitiari ya kuwa na fungu au ushirika katika utawala wa Daudi.
- source_word: נַחֲלָה
  choice: urithi
  rationale: ‘Urithi’ huhifadhi maana ya kifamilia na ya agano inayohusiana na fungu na ukoo.
- source_word: בְּבֶן יִשַׁי
  choice: katika mwana wa Yese
  rationale: ‘Katika’ huhifadhi kwa kadiri inayosomeka nahau ya Kiebrania ya kuwa na fungu au maslahi katika ukoo wa Daudi.
- source_word: אִישׁ לְאֹהָלֶיךָ
  choice: Kila mtu arudi hemani kwake
  rationale: Nomino ya umoja imetumiwa kwa maana ya kugawa kwa kila mmoja; ‘kila mtu’ ni ya asili katika Kiswahili, huku ‘arudi’ ikifafanua mwito wa kutawanyika unaodokezwa na nahau.
- source_word: רְאֵה בֵיתְךָ
  choice: iangalie nyumba yako mwenyewe
  rationale: Kauli hii ni agizo kwa Daudi ajishughulishe na nyumba au nasaba yake mwenyewe; tafsiri inadumisha picha ya nyumba na nguvu ya kufukuza.
- source_word: לְאֹהָלָיו
  choice: hemani kwao
  rationale: Kiebrania kina umoja wa kimofolojia baada ya jina la pamoja ‘Israeli wote’; Kiswahili hutumia ‘kwao’ kwa maana ya mgawanyo bila kupoteza picha ya hema.
theological_decisions:
- issue: Nomino ya kiume ya mgawanyo אִישׁ
  choice: Kila mtu
  alternative: Kila mwanamume
  rationale: Katika mwito huu אִישׁ imetumiwa kwa mgawanyo, yaani kila mmoja wa watu wa Israeli, wala si lazima kusisitiza jinsia. ‘Kila mtu’ huhifadhi maana hiyo ya pamoja kwa Kiswahili cha kawaida bila kuongeza dai lisilo wazi katika muktadha.
- issue: Kauli ya kisiasa ya kuukataa ukoo wa Daudi
  choice: Tuna sehemu gani katika Daudi? Hatuna urithi katika mwana wa Yese.
  alternative: Hatuna sehemu katika Daudi wala urithi kwa mwana wa Yese.
  rationale: Maswali na sitiari za ‘sehemu’ na ‘urithi’ zimehifadhiwa ili kutobadili kauli ya kihistoria na ya kiagano kuwa kauli ya kisiasa ya kisasa.
- issue: Maana ya בֵיתְךָ
  choice: nyumba yako
  alternative: nasaba yako
  rationale: ‘Nyumba’ inadumisha utata halisi kati ya nyumba ya Daudi kama jambo lake mwenyewe na nyumba yake kama ukoo wa kifalme; ‘nasaba’ ingefunga maana mapema mno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa hotuba ya kishairi umehifadhiwa, lakini nahau zimewasilishwa kwa namna inayoeleweka kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusu kurudi hemani.
