  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: sw
  text: Lakini wana wa Israeli waliokuwa wakiishi katika miji ya Yuda, Rehoboamu akatawala juu yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli waliokuwa wakiishi katika miji ya Yuda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Lakini wana wa Israeli
  rationale: בְּנֵי יִשְׂרָאֵל limetafsiriwa kwa ukaribu kuwa “wana wa Israeli,” kwa kuwa hapa linaweza kutaja watu wa Israeli waliobaki katika miji ya Yuda. Kiunganishi וּ kimetolewa kuwa “Lakini” ili kuonyesha tofauti na uasi unaotajwa katika muktadha uliotangulia.
- source_word: הַיֹּשְׁבִים
  choice: waliokuwa wakiishi
  rationale: Kirai cha kitenzi-shirikishi cha ישב kinaonyesha hali endelevu ya kukaa mahali; “waliokuwa wakiishi” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: בְּעָרֵי יְהוּדָה
  choice: katika miji ya Yuda
  rationale: Hili ni kirai cha mahali kinachotaja miji iliyo katika eneo la Yuda.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: מלך katika muktadha huu humaanisha kutumia mamlaka ya kifalme. “Akatawala” ni usemi wa asili wa Kiswahili na unaendana na mtiririko wa simulizi.
- source_word: עֲלֵיהֶם
  choice: juu yao
  rationale: Kihusishi עַל pamoja na kiambishi cha nafsi kinaonyesha watu waliokuwa chini ya utawala wa Rehoboamu; “juu yao” kinahifadhi muundo huo.
- source_word: רְחַבְעָם
  choice: Rehoboamu
  rationale: Jina la mtu limetoholewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
