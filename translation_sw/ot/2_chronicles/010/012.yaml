  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi “Basi … wakamjia” umehifadhi mtiririko wa kifungu bila kuwa mgumu kupita kiasi.
