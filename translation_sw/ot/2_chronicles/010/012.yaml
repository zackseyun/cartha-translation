base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: sw
  text: 'Basi Yeroboamu na watu wote wakamjia Rehoboamu siku ya tatu, kama mfalme alivyosema: “Nirudieni[a] siku ya tatu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Rudini kwangu.”
    reason: Usemi mbadala wa kimtindo wa שׁוּבוּ אֵלַי; una maana ileile katika muktadha huu.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakamjia
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kufika kulingana na mtazamo. Pamoja na אֶל רְחַבְעָם, “wakamjia Rehoboamu” kinaeleza kwa kawaida kwamba walikwenda mahali alipokuwa.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וְכָל הָעָם
  choice: na watu wote
  rationale: עָם hapa ni kundi lote lililokuwa pamoja na Yeroboamu, si lazima kusanyiko rasmi.
- source_word: אֶל רְחַבְעָם
  choice: Rehoboamu
  rationale: Katika muundo “wakamjia Rehoboamu,” kiambishi -ji- huwasilisha maana ya kuelekea kwa mtu iliyomo katika אֶל.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya kirai cha wakati; haiongezi ufafanuzi usiotajwa katika Kiebrania.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Inaonyesha kwamba walitenda sawasawa na agizo la mfalme lililotangulia.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: mfalme alivyokuwa amesema
  rationale: דבר ni kitenzi cha kawaida cha kusema au kunena. Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba maneno hayo yalikuwa yamesemwa kabla.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika Kiswahili, alama ya nukta mbili huanzisha kwa ufasaha yaliyosemwa moja kwa moja bila kulazimisha neno “akisema,” huku kazi ya לֵאמֹר ikihifadhiwa.
- source_word: שׁוּבוּ אֵלַי
  choice: Nirudieni
  rationale: שׁוּב pamoja na אֵלַי humaanisha kurudi kwa mzungumzaji. “Nirudieni” ni agizo la wingi, la kawaida na fupi katika Kiswahili.
