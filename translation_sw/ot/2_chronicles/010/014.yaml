base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: sw
  text: Akazungumza nao kufuatana na shauri la wale vijana, akisema, “Nitaifanya nira yenu iwe nzito zaidi, nami nitaongeza juu yake. Baba yangu aliwaadhibu kwa mijeledi, lakini mimi nitawaadhibu kwa nge.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa mijeledi ya nge,” yaani, mijeledi yenye ncha kali au miiba; Kiebrania kinasema kihalisi “kwa nge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Akazungumza nao
  rationale: דבר ni kitenzi cha kawaida cha kusema au kuzungumza. Hapa kinatanguliza jibu la Rehoboamu, lakini ‘akazungumza nao’ kinabaki karibu na Kiebrania bila kuongeza maana ya kujibu.
- source_word: כַעֲצַת הַיְלָדִים
  choice: kufuatana na shauri la wale vijana
  rationale: עֵצָה ni shauri, na כ inaonyesha kuwa maneno yake yalifuata shauri hilo. הַיְלָדִים hapa ni washauri vijana, si watoto wadogo.
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  choice: Nitaifanya nira yenu iwe nzito zaidi
  rationale: Hifili ya כבד ina maana ya kufanya kitu kiwe kizito. Kwa kuwa nira tayari ipo, ‘nzito zaidi’ huonyesha ongezeko linalokusudiwa huku ikihifadhi sitiari ya nira.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: nami nitaiongezea
  rationale: יסף pamoja na עַל humaanisha kuongeza juu ya kitu. Kiambishi cha ‘-i-’ kinarejelea nira na kuhifadhi picha ya Kiebrania bila kuibadili kuwa ‘mzigo’.
- source_word: יִסַּר אֶתְכֶם
  choice: aliwaadhibu
  rationale: יסר inaweza kumaanisha kutia nidhamu, kuonya kwa adhabu, au kuadhibu. Katika tishio hili la kifalme linalohusisha mijeledi, ‘aliwaadhibu’ ni ya kawaida na inaonyesha nguvu ya muktadha.
- source_word: בַּשּׁוֹטִים
  choice: kwa mijeledi
  rationale: שׁוֹט ni mjeledi au chombo cha kuchapia; ‘mijeledi’ ni neno wazi na la kawaida katika Kiswahili.
- source_word: בָּעֲקְרַבִּים
  choice: kwa nge
  rationale: Neno hili kihalisi ni ‘nge.’ Picha hiyo kali imehifadhiwa katika matini kuu, huku uwezekano wa kurejelea mijeledi yenye miiba ukifafanuliwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa usemi wa moja kwa moja na sitiari za ‘nira’ na ‘nge’ zimehifadhiwa; maneno ya kizamani yameepukwa.
