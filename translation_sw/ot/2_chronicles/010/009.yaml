  source_fidelity: Tafsiri inawasilisha kwa uaminifu swali la Rehoboamu kuhusu ushauri wa kujibu ombi la watu. “Mnashauri nini, ili tuwajibu...” hutoa vizuri maana ya נוֹעָצִים na וְנָשִׁיב דָּבָר, na “nira ambayo baba yako alitutwika” huhifadhi picha na maana ya עֹל pamoja na tendo la kuweka mzigo juu yao.
