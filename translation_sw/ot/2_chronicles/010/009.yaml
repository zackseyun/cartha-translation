  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: sw
  text: Akawaambia, “Mnashauri nini, ili tuwajibu watu hawa ambao wameniambia, ‘Punguza nira[a] ambayo baba yako alitutwika’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Punguza mzigo ambao baba yako alitutwika.” Kiebrania kinatumia neno linalomaanisha kihalisi “nira,” likiwa mfano wa kazi nzito au utawala unaokandamiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Akawaambia
  rationale: Muundo huu wa masimulizi unaendeleza mtiririko wa wayyiqtol na kwa kawaida unajumuisha wazo la kusema kwao.
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Mnashauri nini
  rationale: Kitenzi יעץ hapa kinauliza ushauri wa watu hao; tafsiri hii ni ya kawaida na inahifadhi maana ya kushauriana.
- source_word: וְנָשִׁיב דָּבָר
  choice: ili tuwajibu
  rationale: Usemi wa Kiebrania unamaanisha kurudisha jibu. Kiunganishi kinaeleweka kwa muktadha kuwa cha kusudi, na Kiswahili hiki kinaepuka tafsiri sisisi isiyo ya kawaida ya 'kurudisha neno.'
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עָם ni nomino ya jumla yenye umoja katika Kiebrania, 'watu hawa' ndiyo njia ya kawaida na yenye heshima katika Kiswahili.
- source_word: דִּבְּרוּ אֵלַי לֵאמֹר
  choice: ambao wameniambia
  rationale: Kauli hii inahusisha maneno yao ya awali na mashauriano ya sasa; 'wameniambia' huwasilisha kwa kawaida utangulizi wa nukuu bila kurudia 'wakisema.'
- source_word: הָקֵל מִן הָעֹל
  choice: Punguza nira
  rationale: Amri הָקֵל ina maana ya kufanya iwe nyepesi au kupunguza, na עֹל ni nira halisi inayotumiwa hapa kama mfano wa kazi au utawala mzito.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: ambayo baba yako alitutwika
  rationale: '''Kutwika'' huonyesha kwa ufasaha kuwekwa kwa mzigo juu ya watu na kuhifadhi picha ya nira pamoja na maana ya shinikizo lililowekwa juu yao.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa heshima lakini unaoeleweka kwa urahisi. Picha ya 'nira' imehifadhiwa katika matini, huku maana yake ya kimfano ikifafanuliwa katika tanbihi.
