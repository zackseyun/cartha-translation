id: 2CH.10.8
reference: 2 Chronicles 10:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: sw
  text: Lakini aliacha ushauri ambao wazee walikuwa wamempa, akashauriana na vijana waliokuwa wamekua pamoja naye na ambao walisimama mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliomhudumia.” Maneno “walisimama mbele yake” ni msemo wa kifalme unaoweza kumaanisha kumhudumia mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: aliacha
  rationale: Kitenzi עזב humaanisha kuacha au kutupilia mbali. “Aliacha” kinadumisha maana ya msingi bila kuongeza kwa wazi wazo la kukataa, ingawa muktadha unaonyesha kwamba hakufuata ushauri huo.
- source_word: עֲצַת הַזְּקֵנִים
  choice: ushauri ambao wazee walikuwa wamempa
  rationale: עֵצָה ni “ushauri,” na זְקֵנִים hapa ni wazee wenye jukumu la washauri. Muundo huu ni wa kawaida katika Kiswahili na unawakilisha pia אֲשֶׁר יְעָצֻהוּ.
- source_word: וַיִּוָּעַץ
  choice: akashauriana na
  rationale: Kauli ya Kiebrania hapa inaonyesha kuingia katika mashauriano; “akashauriana na” ni ya asili na inaonyesha kwamba aliomba au kubadilishana ushauri nao.
- source_word: הַיְלָדִים
  choice: vijana
  rationale: Ingawa neno linaweza kutaja watoto au wavulana, hapa linawahusu watu wa rika la mfalme waliokua pamoja naye; “vijana” huepuka kuwafanya waonekane kuwa watoto wadogo.
- source_word: גָּדְלוּ אִתּוֹ
  choice: waliokuwa wamekua pamoja naye
  rationale: Maneno haya yanaeleza malezi au ukuaji wao wa pamoja kabla ya tukio hili.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: ambao walisimama mbele yake
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania. Katika mazingira ya kifalme, msemo huo unaweza pia kumaanisha kumhudumia au kuwa mhudumu wake, jambo linaloelezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wenye heshima. Kiunganishi “Lakini” kinahifadhi utofautishaji wa simulizi, huku taswira ya msemo wa ikulu ikibaki katika matini kuu na maana yake ya kimuktadha ikifafanuliwa katika tanbihi.
