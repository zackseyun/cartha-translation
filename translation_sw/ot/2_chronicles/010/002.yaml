base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: sw
  text: Yeroboamu mwana wa Nebati aliposikia—kwa kuwa alikuwa Misri, ambako alikuwa amemkimbia Mfalme Sulemani[a]—Yeroboamu alirudi kutoka Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “ambako alikuwa amekimbia kutoka mbele ya Mfalme Sulemani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: aliposikia habari hiyo
  rationale: Muundo huu unaanzisha kishazi cha wakati katika simulizi. Kiebrania hakitaji wazi alichosikia; “habari hiyo” huonyesha kwamba muktadha ndio unaokamilisha maana bila kuibainisha zaidi.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, na uhusiano wa jina la baba umetafsiriwa moja kwa moja.
- source_word: וְהוּא בְמִצְרַיִם
  choice: wakati huo alikuwa Misri
  rationale: Kishazi hiki hutoa taarifa ya usuli; “wakati huo” ni cha asili katika Kiswahili na kinaonyesha hali iliyokuwapo aliposikia.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: ambako alikuwa amekimbilia ili kumwepuka Mfalme Sulemani
  rationale: אֲשֶׁר hurejelea Misri kama mahali, בָּרַח huonyesha kukimbia, na מִפְּנֵי katika muktadha huu huonyesha kumkimbia au kumwepuka Sulemani. Tafsiri hii ni ya asili bila kupoteza wazo la tishio au kuwapo kwake.
- source_word: וַיָּשָׁב
  choice: alirudi
  rationale: Katika muktadha huu שוב humaanisha kurudi mahali, si kutubu au kurejeshwa.
- source_word: מִמִּצְרָיִם
  choice: kutoka Misri
  rationale: Kihusishi מן kinaonyesha mahali alikotoka.
