  text: וַ/יְדַבְּר֣וּ אִתּ֗/וֹ הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֡ר לָ/עָם֩ אֲשֶׁר דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵ/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: sw
  text: 'Nao wale vijana waliokua pamoja naye wakamwambia, “Hivi ndivyo utakavyowaambia watu waliokuambia, ‘Baba yako aliifanya nira yetu kuwa nzito, lakini wewe utupunguzie nira hiyo.’ Hivi ndivyo utakavyowaambia: ‘Kidole changu kidogo[a] ni kinene kuliko kiuno[b] cha baba yangu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa uhalisi, “Udogo wangu ni mnene kuliko kiuno cha baba yangu”; msemo huu kwa kawaida hueleweka kuwa “Kidole changu kidogo ni kinene kuliko kiuno cha baba yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “viuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: wale vijana
  rationale: Ingawa neno hili linaweza kumaanisha watoto au wavulana, hapa linawahusu vijana wa rika la Rehoboamu waliokua pamoja naye, si watoto wadogo.
- source_word: גָּדְלוּ אִתּוֹ
  choice: waliokua pamoja naye
  rationale: Kirai hiki kinaonyesha kwamba walilelewa na kukomaa pamoja naye; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: כֹּה תֹאמַר
  choice: Hivi ndivyo utakavyowaambia
  rationale: Hii ni fomula ya kuanzisha maneno ya kuagizwa, na uchaguzi huu unahifadhi nguvu yake ya maelekezo kwa Kiswahili cha kawaida.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: Baba yako aliifanya nira yetu kuwa nzito
  rationale: Neno 'nira' linahifadhi sitiari halisi ya Kiebrania, huku 'kuwa nzito' likiwasilisha mzigo mkali uliowekwa juu ya watu.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: utupunguzie nira hiyo
  rationale: Kitenzi kinaomba mzigo upunguzwe kutoka juu yao. Kiswahili hiki ni cha asili, kinaendeleza sitiari ya nira, na hakiongezi kiungo cha mwili kisichotajwa katika chanzo.
- source_word: קָטָנִּי
  choice: Kidole changu kidogo
  rationale: Kiebrania kwa uhalisi kina maana ya 'udogo wangu' au 'kidogo changu,' lakini katika msemo huu linaeleweka kiidioma kuwa kidole kidogo; tanbihi inahifadhi umbo la uhalisi.
- source_word: עָבָה
  choice: ni kinene kuliko
  rationale: Neno hili linaonyesha unene, na kiambishi cha ulinganisho katika Kiebrania kinahitaji maana ya 'kuliko.'
- source_word: מִמָּתְנֵי אָבִי
  choice: kiuno cha baba yangu
  rationale: מָתְנַיִם hurejelea eneo la kiuno au viuno. 'Kiuno' ni wazi na cha kawaida katika Kiswahili cha sasa, huku tanbihi ikitaja chaguo jingine linalowezekana.
theological_decisions: []
