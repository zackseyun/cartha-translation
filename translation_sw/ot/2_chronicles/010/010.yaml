  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Sitiari ya 'nira' imehifadhiwa, na usemi wa kujigamba umepewa kwa namna ya asili bila kupunguza ukali wake.
