id: 2CH.10.15
reference: 2 Chronicles 10:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: sw
  text: Kwa hiyo mfalme hakuwasikiliza watu, kwa maana mgeuko huo wa mambo ulitoka kwa Mungu,[a] ili Yahweh athibitishe neno lake alilokuwa amesema kupitia Ahiya Mshiloni kwa Yeroboamu mwana wa Nebati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana sababu hiyo ilitoka kwa Mungu.” Neno la Kiebrania linaweza kumaanisha mgeuko, hali ya mambo, au maendeleo yaliyosababisha jambo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: kuwasikiliza
  rationale: Katika muktadha huu maana ni kuyatilia maanani maombi ya watu, si kusikia sauti tu; ‘kuwasikiliza’ ni Kiswahili cha kawaida bila kufasiri kwa nguvu kuwa ‘kuwatii.’
- source_word: נְסִבָּה
  choice: mgeuko huo wa mambo
  rationale: Nomino inaweza kumaanisha mgeuko, hali, au maendeleo yenye kusababisha jambo. ‘Mgeuko huo wa mambo’ huhifadhi picha ya matukio kugeuka bila kuufanya usemi kuwa dhahania mno.
- source_word: מֵעִם הָאֱלֹהִים
  choice: ulitoka kwa Mungu
  rationale: Kirai kinaonyesha chanzo au asili ya tukio; ‘ulitoka kwa Mungu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili linaonyesha kusudi; ‘ili’ ni la asili na wazi katika Kiswahili.
- source_word: הָקִים
  choice: alithibitishe
  rationale: Hifili ya קום hapa ni kusimamisha imara, kuthibitisha, au kutekeleza. ‘Alithibitishe’ linafaa kwa kitu ‘neno lake’ na halibani maana kuwa utimilizo pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: דְּבָרוֹ
  choice: neno lake
  rationale: Hii ni tafsiri pana na ya kawaida inayoruhusu msomaji kulitambua kama tamko la kinabii bila kulibana kuwa ‘ahadi.’
- source_word: בְּיַד
  choice: kupitia
  rationale: Nahau hii huonyesha wakala au njia ya ujumbe; ‘kupitia’ linaonyesha nafasi ya Ahiya kama mjumbe kwa Kiswahili cha kawaida.
- source_word: הַשִּׁלוֹנִי
  choice: Mshiloni
  rationale: Kivumishi cha asili au uhusiano na Shilo kimetolewa kwa umbo la Kiswahili linalomtaja mtu wa Shilo.
- source_word: בֶּן נְבָט
  choice: mwana wa Nebati
  rationale: Hili ni umbo la kawaida la Kiswahili kwa jina la ukoo wa baba.
theological_decisions:
- issue: Usababishaji wa Mungu na tendo la mwanadamu
  choice: mfalme hakuwasikiliza watu ... mgeuko huo wa mambo ulitoka kwa Mungu
  alternative: sababu hiyo ilitoka kwa Mungu
  rationale: Kiebrania kinataja kukataa kwa mfalme kuwa tendo halisi la mwanadamu huku kikihusisha chanzo cha mgeuko wa matukio na Mungu. Tafsiri inadumisha mvutano huo bila kusema zaidi ya matini kwamba Mungu ndiye aliyemlazimisha mfalme kukataa.
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ina jina binafsi la Mungu, kwa hiyo limetoholewa kama ‘Yahweh’ badala ya kubadilishwa na cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata kwa karibu mantiki ya Kiebrania huku ukitumia mpangilio wa asili wa Kiswahili.
