base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: sw
  text: Basi wakatuma wakamwita[a]. Yeroboamu na Israeli wote wakaja, wakazungumza na Rehoboamu, wakisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakatuma ujumbe kumwita.” Kiebrania hakitaji wazi kilichotumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: wakatuma watu
  rationale: Kitenzi cha Kiebrania kinaacha kitu kilichotumwa bila kutajwa; katika Kiswahili, ‘wakatuma watu’ huwasilisha kwa kawaida kitendo kinachodokezwa na muktadha, huku tanbihi ikihifadhi uwezekano wa tafsiri isiyobainisha wajumbe.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: wakamwita
  rationale: Muundo קרא + ל hapa una maana ya kumwita au kumwagiza mtu aje; ‘wakamwita’ ni wa kawaida na unaendeleza mfuatano wa matendo.
- source_word: וַיָּבֹא
  choice: wakaja
  rationale: Ingawa kitenzi cha Kiebrania ni umoja na Yeroboamu ndiye mhusika mkuu, Kiswahili huhitaji upatanisho wa wingi kwa kiima ‘Yeroboamu na Israeli wote.’
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Yeroboamu na Israeli wote
  rationale: Inahifadhi usemi wa kitaifa ‘Israeli wote’ badala ya kuufanya tu ‘Waisraeli wote.’
- source_word: וַיְדַבְּרוּ אֶל
  choice: wakazungumza na
  rationale: Huwakilisha דבר אל kwa lugha ya asili ya Kiswahili na kudumisha kitendo cha kuzungumza kinachotangulia maneno ya moja kwa moja.
- source_word: לֵאמֹר
  choice: wakisema,
  rationale: Inahifadhi muundo wa Kiebrania unaoanzisha maneno ya moja kwa moja katika mstari unaofuata.
