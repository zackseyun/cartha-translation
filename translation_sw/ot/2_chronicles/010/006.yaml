base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: sw
  text: Kisha Mfalme Rehoboamu akashauriana na wazee waliokuwa wakisimama mbele ya Sulemani, baba yake,[a] alipokuwa bado hai, akisema, “Mnanishauri vipi niwajibu watu hawa?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Msemo “kusimama mbele ya” unaweza pia kumaanisha kumhudumia au kuhudumu mbele yake katika nafasi rasmi.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “mnanashaurije kulijibu neno kwa watu hawa?” Hii ni nahau ya Kiebrania yenye maana ya kutoa jibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: akawataka ushauri
  rationale: Nifali ya יעץ hapa inaonyesha kutafuta ushauri kutoka kwa wengine. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha wazi kwamba mfalme aliwaomba wamsaidie kwa ushauri.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Neno זקנים linamaanisha wanaume wazee wenye nafasi ya uongozi au ushauri; “wazee” ni tafsiri ya moja kwa moja na inayofaa muktadha.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: waliokuwa wakisimama mbele ya
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania, huku tanbihi ikieleza kuwa msemo huo unaweza kumaanisha kuhudumu rasmi mbele ya mfalme.
- source_word: שְׁלֹמֹה אָבִיו
  choice: Sulemani baba yake
  rationale: Mpangilio huu unafuata kwa karibu muundo wa Kiebrania na unasomeka kwa kawaida katika Kiswahili.
- source_word: בִּהְיוֹתוֹ חַי
  choice: alipokuwa hai
  rationale: Kirai hiki kinaonyesha kipindi ambacho Sulemani alikuwa bado anaishi, bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Mnanashauri
  rationale: Kitenzi hiki kinauliza ushauri wao kuhusu namna ya kujibu. Muundo umeunganishwa na “niwajibu” ili kutoa swali la kawaida na wazi kwa Kiswahili.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: niwajibu nini
  rationale: Maana halisi ni kurudisha neno, lakini katika muktadha huu ni nahau ya kutoa jibu. “Niwajibu nini” ni ya asili katika Kiswahili na inahifadhi lengo la swali.
- source_word: לָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עם ni nomino ya umoja ya kijamii, Kiswahili cha kawaida hutumia “watu hawa” kwa kundi linalorejelewa hapa.
