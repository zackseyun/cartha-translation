  text: So Israel has been in rebellion against the house of David to this day[a].
translation:
  language: sw
  text: Hivyo Israeli imeendelea kuasi dhidi ya nyumba ya Daudi mpaka leo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Israeli iliasi dhidi ya nyumba ya Daudi.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa wakati uliopita (“iliasi”) au, kwa kuzingatia maneno “mpaka leo,” kwa kusisitiza hali iliyoendelea (“imeendelea kuasi”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: imeendelea kuasi
  rationale: Kitenzi פשע katika muktadha huu wa kisiasa humaanisha kuasi mamlaka. Kauli hii, pamoja na ‘mpaka leo,’ inaonyesha uasi ulioanza zamani na hali yake iliyoendelea.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hapa jina hili linamaanisha makabila ya kaskazini kama jumuiya, yakitofautishwa na nasaba ya Daudi; jina lenyewe limehifadhiwa bila ufafanuzi wa ziada katika matini.
- source_word: בְּבֵית דָּוִיד
  choice: dhidi ya nyumba ya Daudi
  rationale: Baada ya פשע, kihusishi ב kinaweza kumtaja anayelengwa na uasi. ‘Nyumba ya Daudi’ huhifadhi maana ya nasaba ya kifalme.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni nahau ya kawaida inayoonyesha kuwa hali hiyo iliendelea hadi wakati wa mwandishi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Imeendelea kuasi’ huwasilisha kwa lugha ya kawaida hali inayoendelea, huku tanbihi ikihifadhi uwezekano wa tafsiri ya wakati uliopita.
