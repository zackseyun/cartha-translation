  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲנֵ֥/ם הַ/מֶּ֖לֶךְ קָשָׁ֑ה וַֽ/יַּעֲזֹב֙ הַ/מֶּ֣לֶךְ רְחַבְעָ֔ם אֵ֖ת עֲצַ֥ת הַ/זְּקֵנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/013.yaml
  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: sw
  text: Naye mfalme akawajibu kwa ukali, na Mfalme Rehoboamu akaliacha shauri la wazee.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: akawajibu
  rationale: Kitenzi ענה kina maana ya kujibu, na kiambishi cha nafsi ya tatu wingi kinaonyesha wazi kwamba aliwajibu wao.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Tafsiri ya moja kwa moja ya nomino yenye kibainishi; katika Kiswahili, muktadha unatosha kuifanya iwe bayana bila neno tofauti la kibainishi.
- source_word: קָשָׁה
  choice: kwa ukali
  rationale: Ingawa kwa umbo ni kivumishi chenye maana ya 'gumu/kali,' hapa kinatumika kueleza namna mfalme alivyojibu; 'kwa ukali' ni Kiswahili cha kawaida na huhifadhi nguvu ya jibu.
- source_word: וַיַּעֲזֹב
  choice: akaliacha
  rationale: עזב humaanisha kuacha au kutupilia mbali. 'Akaliacha' huhifadhi picha ya kuacha shauri bila kuongeza ufafanuzi usiokuwamo katika chanzo.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Mfalme Rehoboamu
  rationale: Muundo huu unamtambulisha mfalme kwa jina; 'Mfalme Rehoboamu' ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: עֲצַת
  choice: shauri
  rationale: עצה hapa ni ushauri au shauri lililotolewa kwa mfalme. 'Shauri' linafaa kwa sajili ya simulizi na mazingira ya washauri wa kifalme.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: זקנים hapa huonyesha wazee wenye hadhi na jukumu la kutoa shauri, si wanaume wenye umri mkubwa tu; 'wazee' huhifadhi maana hiyo katika mazingira ya Afrika Mashariki.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Muundo wa sentensi umefuata mfuatano wa Kiebrania kwa namna ya asili katika Kiswahili; hakuna tanbihi inayohitajika kwa kuwa mbadala za kileksika hazibadili maana kwa kiwango muhimu.
