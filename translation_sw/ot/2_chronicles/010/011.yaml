base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: sw
  text: Sasa, baba yangu aliwatwika nira nzito, lakini mimi nitaongeza nira yenu. Baba yangu aliwaadhibu kwa mijeledi, lakini mimi nitawaadhibu kwa nge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, yawezekana, “kwa mijeledi ya nge,” yaani, mijeledi yenye ncha kali au kulabu; Kiebrania kinasema moja kwa moja, “kwa nge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס עֲלֵיכֶם עֹל כָּבֵד
  choice: aliwatwika nira nzito
  rationale: Kitenzi cha Kiebrania kinaeleza kusababisha mtu aubebe mzigo. ‘Kuwatwika nira nzito’ ni Kiswahili cha asili kinachohifadhi picha halisi ya nira na uzito wake.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: nitaongeza nira yenu
  rationale: Huhifadhi wazo la kuongeza nira badala ya kulibadili waziwazi kuwa ‘mzigo’ au ‘utawala,’ huku likibaki rahisi kueleweka kwa Kiswahili cha sasa.
- source_word: יִסַּר
  choice: aliwatia adabu / nitawatia adabu
  rationale: ‘Kutia adabu’ huwasilisha tendo la kuadhibu kwa kusudi la kurudiisha nidhamu, bila kutumia lugha ya kizamani.
- source_word: בַּשּׁוֹטִים
  choice: kwa mijeledi
  rationale: ‘Mijeledi’ ni neno la kawaida na sahihi kwa vifaa vya kupigia vinavyotajwa na שׁוֹטִים.
- source_word: בָּעֲקְרַבִּים
  choice: kwa nge
  rationale: Kiebrania kinasema moja kwa moja ‘nge.’ Maana inayowezekana ya mijeledi mikali yenye ncha imewekwa katika tanbihi badala ya kuingizwa moja kwa moja katika matini.
