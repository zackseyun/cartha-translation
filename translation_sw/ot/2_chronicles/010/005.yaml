translation:
  language: sw
  text: Akawaambia, “Rudini kwangu baada ya siku tatu[a].” Basi watu wakaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana halisi, “Bado siku tatu, kisha mrudi kwangu.”
