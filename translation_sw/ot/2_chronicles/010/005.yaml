lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Akawaambia
  rationale: Muundo huu wa kawaida wa masimulizi unawasilisha kwa Kiswahili kwa njia ya asili tendo linalofuatana la kusema kwao, bila kuongeza maana ya kiunganishi.
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: baada ya siku tatu
  rationale: Kirai cha Kiebrania kina maana halisi ya ‘bado siku tatu’; katika muktadha wa agizo la kurudi, Kiswahili ‘baada ya siku tatu’ kinaeleza kwa kawaida kipindi cha kusubiri kabla ya kurudi.
- source_word: וְשׁוּבוּ אֵלָי
  choice: Rudini kwangu
  rationale: Kitenzi ni agizo la wingi la שוב, nalo linaelekezwa kwa mzungumzaji kupitia אֵלַי; ‘Rudini kwangu’ huhifadhi yote mawili kwa lugha ya kawaida na yenye heshima.
- source_word: וַיֵּלֶךְ הָעָם
  choice: Basi watu wakaondoka
  rationale: ‘Basi’ linaonyesha mwendelezo wa matokeo katika simulizi, na ‘wakaondoka’ linaeleza kwa kawaida kwamba watu waliondoka baada ya kupewa agizo.
