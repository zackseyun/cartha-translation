  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: sw
  text: Azaria, kuhani mkuu, akamgeukia, na makuhani wote pia; na tazama, alikuwa na ugonjwa wa ngozi[a] kwenye paji la uso wake. Basi wakamtoa humo kwa haraka[b]. Yeye mwenyewe pia akaharakisha kutoka[c], kwa sababu Yahweh alikuwa amempiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ugonjwa wa ngozi” hapa hutafsiri neno la Kiebrania linalotumiwa katika sheria za kikuhani kuhusu hali nzito iliyomfanya mtu kuwa najisi; si lazima liwe sawa kabisa na ukoma wa kisasa (ugonjwa wa Hansen).
    reason: cultural_note
  - marker: b
    text: Au, “wakamfukuza kutoka humo.” Kitenzi cha Kiebrania kinaweza kuonyesha kumwondoa mtu kwa dharura, ama kwa kumlazimisha ama kwa kumsababisha afanye haraka.
    reason: lexical_alternative
  - marker: c
    text: Au, “alilazimishwa kutoka.” Umbo la Kiebrania linaweza kusisitiza kwamba alisukumwa au alihimizwa kuondoka, ingawa muktadha pia unaruhusu maana ya kwamba yeye mwenyewe aliharakisha kutoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: wakamgeukia
  rationale: פנה pamoja na אֶל inaeleza kugeuka na kuelekea upande wa mtu. Kitenzi cha umoja kinachotangulia kiima ambatani katika Kiebrania kimetafsiriwa kwa wingi katika Kiswahili kwa sababu Azaria na makuhani wote ndio wanaotenda.
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: Azaria kuhani mkuu
  rationale: כֹהֵן הָרֹאשׁ ni kihalisi kuhani aliye mkuu au kichwa cha makuhani. 'Kuhani mkuu' ni usemi wa kawaida wa Kiswahili na haiongezi maelezo yasiyokuwamo katika mstari.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: הִנֵּה huonyesha ugunduzi wa ghafla na kuupa usimulizi uhai; 'na tazama' huhifadhi kazi hiyo ya kisanaa.
- source_word: מְצֹרָע
  choice: alikuwa na ugonjwa wa ngozi
  rationale: Neno hili hutumiwa katika sheria za utakaso kwa hali ya ngozi inayomfanya mtu kuwa najisi. Tafsiri hii haidai kimakosa kwamba hali hiyo ilikuwa lazima iwe ugonjwa wa Hansen unaoitwa ukoma leo.
- source_word: בְּמִצְחוֹ
  choice: kwenye paji la uso wake
  rationale: Hii inaeleza mahali ambapo hali hiyo ilionekana; 'kwenye' ni Kiswahili cha kawaida na wazi kwa alama iliyoonekana juu ya ngozi.
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: wakamtoa humo kwa haraka
  rationale: Hifili ya בהל inaweza kumaanisha kumsababisha mtu aharakishe au kumwondoa kwa dharura. Tafsiri hii huhifadhi dharura bila kusisitiza kupita kiasi kwamba walitumia nguvu.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: Yeye mwenyewe pia akaharakisha kutoka
  rationale: נִדְחַף inaweza kueleza kusukumwa au kuendeshwa kwa nguvu, lakini katika muktadha inaonyesha pia kwamba Uzia mwenyewe alifanya haraka kuondoka. Tanbihi huhifadhi uwezekano wa maana ya kutendwa.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: kwa sababu Yahweh alikuwa amempiga
  rationale: Katika muktadha huu נגע si kugusa tu, bali ni kumpiga au kumletea adhabu. Wakati timilifu wa Kiswahili unaonyesha kuwa tendo hilo lilikuwa tayari limetokea walipomwona.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa badala ya kubadilishwa kuwa cheo, hivyo utambulisho wa jina la agano unabaki wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. 'Yahweh' hulihifadhi kwa namna ya moja kwa moja.
- issue: Iwapo כֹהֵן הָרֹאשׁ ni cheo maalumu zaidi ya maneno yenyewe
  choice: kuhani mkuu
  alternative: kuhani wa cheo cha juu au mkuu wa makuhani
  rationale: Tafsiri iliyochaguliwa ni ya kawaida na yenye heshima katika Kiswahili, huku ikibaki karibu na maana ya 'kuhani aliye mkuu' bila kuingiza tofauti ya kimadhehebu.
- issue: Utambulisho wa מְצֹרָע kama ugonjwa wa kisasa
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: Neno la Kiebrania ni istilahi ya hali inayohusiana na sheria za unajisi wa kikuhani na si lazima lilingane moja kwa moja na ugonjwa wa Hansen. Tanbihi inahifadhi muktadha huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mwendo wa haraka wa simulizi kwa viambishi vya mfululizo vya 'ka-', huku 'na tazama' ikihifadhi mshangao wa ghafla wa maandishi ya Kiebrania. Maneno ya kitabibu yamewekwa kwa lugha inayoeleweka na maelezo ya kitamaduni yametolewa katika tanbihi.
