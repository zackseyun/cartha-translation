translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima, na unaosomeka kwa urahisi. Miundo ya vitenzi vya mfululizo (‘akatoka akapigana … akavunja … akajenga’) inadumisha mwendo wa masimulizi ya Kiebrania.
