  text: וַ/יֵּצֵא֙ וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֔ים וַ/יִּפְרֹ֞ץ אֶת ח֣וֹמַת גַּ֗ת וְ/אֵת֙ חוֹמַ֣ת יַבְנֵ֔ה וְ/אֵ֖ת חוֹמַ֣ת אַשְׁדּ֑וֹד וַ/יִּבְנֶ֣ה עָרִ֔ים בְּ/אַשְׁדּ֖וֹד וּ/בַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: sw
  text: Akatoka akapigana na Wafilisti, akavunja[a] ukuta wa Gathi, ukuta wa Yabne, na ukuta wa Ashdodi. Kisha akajenga miji katika eneo la Ashdodi[b] na miongoni mwa Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akatoboa ukuta” au “akafanya mwanya katika ukuta.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “katika Ashdodi”; jina hilo linaweza kumaanisha mji wenyewe au eneo linalouzunguka.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Akatoka
  rationale: Kitenzi יצא humaanisha ‘kutoka.’ ‘Akatoka’ kinadumisha mfuatano wa simulizi bila kuongeza wazo la kijeshi ambalo halijasemwa wazi.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: akapigana na Wafilisti
  rationale: Nifali ya לחם hapa ina maana ya kupigana au kufanya vita. Kiswahili ‘kupigana na’ ni cha kawaida na kinaonyesha wazi upande aliopigana nao.
- source_word: וַיִּפְרֹץ
  choice: akavunja
  rationale: פרץ ikiwa na ukuta kama yambwa inaweza kumaanisha kuvunja, kutoboa, au kufanya mwanya. ‘Akavunja’ ni lugha ya kawaida na haidai kwa lazima kwamba ukuta wote ulibomolewa kabisa.
- source_word: חוֹמַת
  choice: ukuta wa
  rationale: Nomino ya Kiebrania iko katika umoja na imerudiwa kwa kila mji; kwa hiyo umoja ‘ukuta wa’ umedumishwa kila mara.
- source_word: גַּת
  choice: Gathi
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mji wa Gath.
- source_word: יַבְנֶה
  choice: Yabne
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania badala ya kutumia umbo la baadaye la Kigiriki, Jamnia.
- source_word: אַשְׁדּוֹד
  choice: Ashdodi
  rationale: Hili ni umbo la Kiswahili linalotambulika la jina la mahali Ashdod.
- source_word: וַיִּבְנֶה עָרִים
  choice: akajenga miji
  rationale: בנה ni ‘kujenga,’ si lazima ‘kujenga upya’; עָרִים ni wingi, ‘miji.’
- source_word: בְּאַשְׁדּוֹד
  choice: katika eneo la Ashdodi
  rationale: Kwa kuwa miji kadhaa haiwezi kwa urahisi kujengwa ndani ya mji mmoja, usemi huu unaeleweka kiasili kuwa eneo au wilaya inayohusishwa na Ashdodi. Tanbihi inadumisha uwezekano wa tafsiri halisi ‘katika Ashdodi.’
- source_word: וּבַפְּלִשְׁתִּים
  choice: na miongoni mwa Wafilisti
  rationale: Kiebrania kinatumia jina la watu, si jina la nchi. ‘Miongoni mwa Wafilisti’ kinadumisha tofauti hiyo huku kikieleza mahali.
