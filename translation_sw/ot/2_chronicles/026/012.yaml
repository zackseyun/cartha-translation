  language: sw
  text: Jumla ya wakuu wa jamaa waliohusika na mashujaa hodari ilikuwa elfu mbili na mia sita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa jamaa
  rationale: Kirai hiki kinawataja viongozi wa vikundi vya kifamilia au koo; “wakuu wa jamaa” ni Kiswahili cha kawaida na chenye hadhi kuliko tafsiri ya neno kwa neno “vichwa vya baba.”
- source_word: לְגִבּוֹרֵי חָיִל
  choice: za mashujaa hodari
  rationale: Katika muktadha wa kijeshi, גִּבּוֹרֵי חַיִל humaanisha wapiganaji mashujaa na wenye uwezo. Kiambishi לְ kinaweza kuonyesha uhusiano wa wakuu hao na kundi la mashujaa; “za” hudumisha uhusiano huo kwa Kiswahili bila kuufafanua kupita kiasi.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: elfu mbili na mia sita
  rationale: Hutoa idadi ya Kiebrania kwa namna ya kawaida na wazi katika Kiswahili.
