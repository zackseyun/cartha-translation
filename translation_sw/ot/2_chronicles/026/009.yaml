base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: sw
  text: Uzia akajenga minara katika Yerusalemu, kwenye Lango la Kona, kwenye Lango la Bondeni, na kwenye Pembe,[a] akazifanya imara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye Kona”; neno la Kiebrania linaweza kumaanisha pembe, kona, au mahali ukuta wa ngome unapogeuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akajenga
  rationale: Kitenzi בנה humaanisha ‘kujenga’; umbo la kisimulizi linaendelezwa kwa ‘akajenga.’
- source_word: עֻזִּיָּהוּ
  choice: Uzia
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: מִגְדָּלִים
  choice: minara
  rationale: Nomino ya wingi מִגְדָּלִים humaanisha minara; dhana ya kuifanya imara imeachwa kwa kitenzi cha mwisho.
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Kiambishi ב ni cha mahali hapa; ‘huko Yerusalemu’ ni Kiswahili cha kawaida katika usimulizi.
- source_word: עַל
  choice: kwenye
  rationale: Katika muktadha wa malango na ngome za mji, עַל inaonyesha mahali; ‘kwenye’ haidai kwamba minara ilikuwa moja kwa moja juu ya malango.
- source_word: שַׁעַר הַפִּנָּה
  choice: Lango la Pembeni
  rationale: Hili ni jina la lango la mji. ‘Pembeni’ linatofautisha jina hili na הַמִּקְצוֹעַ inayotajwa baadaye huku likihifadhi wazo la upande au kona.
- source_word: שַׁעַר הַגַּיְא
  choice: Lango la Bondeni
  rationale: גַּיְא humaanisha bonde; ‘Lango la Bondeni’ ni jina la mahali lililo wazi na la kawaida.
- source_word: הַמִּקְצוֹעַ
  choice: Pembe
  rationale: Nomino hii inaweza kumaanisha pembe, kona, au sehemu ambako ukuta unageuka. ‘Pembe’ inadumisha maana ya kiufundi ya sehemu ya ngome bila kuichanganya na jina la Lango la Pembeni.
- source_word: וַיְחַזְּקֵם
  choice: naye akaifanya imara
  rationale: Katika muktadha wa ulinzi wa mji, piel ya חזק humaanisha kuimarisha. Kiambishi cha wingi ‘-ם’ kwa kawaida kinarejelea minara; Kiswahili hutumia umoja wa ngeli kwa ‘minara’ katika ‘akaifanya.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisimulizi ulio wazi na wenye hadhi. Majina ya maeneo yameandikwa kwa herufi kubwa kama majina maalumu. Alama ya tanbihi [a] imewekwa mara moja baada ya neno linalohusika.
