base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: sw
  text: Uzia akalala pamoja na baba zake, nao wakamzika pamoja na baba zake katika shamba la maziko lililokuwa la wafalme, kwa maana walisema, “Yeye ni mwenye ukoma.[a]” Kisha Yothamu mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye ana ugonjwa wa ngozi.” Neno la Kiebrania linamtaja mtu aliyeathiriwa na צָרַעַת, hali ambayo huenda ilikuwa pana kuliko ukoma wa kisasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: akalala pamoja na baba zake
  rationale: Nahau ya kifalme ya Kiebrania inaashiria kifo. Tafsiri hii inadumisha picha ya ‘kulala’ na kauli ya ‘baba zake’ bila kuifupisha kuwa ‘akafa.’
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: nao wakamzika
  rationale: Kitenzi cha Kiebrania ni cha kutenda katika wingi, huku watendaji wakiwa hawajatajwa; ‘nao’ inadumisha hali hiyo.
- source_word: בִּשְׂדֵה הַקְּבוּרָה אֲשֶׁר לַמְּלָכִים
  choice: katika shamba la maziko lililokuwa la wafalme
  rationale: ‘Shamba la maziko’ linahifadhi picha halisi ya שָׂדֶה, na ‘lililokuwa la wafalme’ linaonyesha umiliki au uhusiano unaoonyeshwa na לַמְּלָכִים bila kuamua zaidi kama lilimilikiwa au lilitengwa kwa matumizi yao.
- source_word: כִּי אָמְרוּ
  choice: kwa maana walisema
  rationale: כִּי hapa inatoa sababu ya mahali alipozikwa; ‘kwa maana’ ni kiunganishi cha kawaida cha maelezo katika simulizi yenye hadhi.
- source_word: מְצוֹרָע
  choice: mwenye ukoma
  rationale: Hii ni tafsiri ya jadi, fupi na inayotambulika, lakini tanbihi inaeleza kuwa neno la Kiebrania linaweza kumaanisha aina pana zaidi ya ugonjwa wa ngozi kuliko ukoma wa kitabibu wa kisasa.
- source_word: וַיִּמְלֹךְ יוֹתָם בְּנוֹ תַּחְתָּיו
  choice: Kisha Yothamu mwanawe akatawala mahali pake
  rationale: ‘Akatawala’ linaendana na taarifa ya urithi wa ufalme, na ‘mahali pake’ linahifadhi wazo la kuchukua nafasi lililo katika תַּחְתָּיו.
theological_decisions:
- issue: Maana ya מְצוֹרָע kuhusiana na istilahi za kiibada na kitabibu
  choice: Yeye ni mwenye ukoma
  alternative: Yeye ana ugonjwa wa ngozi
  rationale: מְצוֹרָע humaanisha mtu aliyeathiriwa na צָרַעַת, kundi ambalo huenda ni pana kuliko ugonjwa wa Hansen unaoitwa ukoma leo. Matini kuu inadumisha usemi wa jadi, huku tanbihi ikizuia kueleweka kama utambuzi mahususi wa kitabibu wa kisasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi la kihistoria na hadhi ya kifalme. Nahau ya Kiebrania ‘akalala pamoja na baba zake’ imehifadhiwa, ingawa maana yake katika muktadha huu ni kwamba Uzia alikufa. Muundo ‘nao wakamzika’ unadumisha watendaji wasiotajwa wazi katika chanzo.
