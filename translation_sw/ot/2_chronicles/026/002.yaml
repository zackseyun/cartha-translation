  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: sw
  text: Yeye aliijenga Elothi na kuirudisha kwa Yuda, baada ya mfalme kulala pamoja na baba zake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuirejesha kwa Yuda.”
    reason: lexical_alternative
  - marker: b
    text: “Kulala pamoja na baba zake” ni nahau ya Kiebrania inayomaanisha kufa.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: aliyeijenga
  rationale: Kitenzi hiki kwa kawaida humaanisha ‘kujenga.’ Ingawa muktadha unaweza kudokeza kujenga upya, wazo hilo halijaelezwa wazi katika neno lenyewe.
- source_word: אֵילוֹת
  choice: Elothi
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likihifadhi umbo la jina la Kiebrania katika kifungu hiki.
- source_word: וַיְשִׁיבֶהָ
  choice: kuirudisha
  rationale: Umbo la Hiphil la שוב lina maana ya kusababisha irudi; kiambishi cha kike kinarejelea Elothi. Katika muktadha huu, maana ni kuirejesha chini ya mamlaka ya Yuda.
- source_word: לִיהוּדָה
  choice: kwa Yuda
  rationale: Kihusishi ל kinaonyesha upande au mwenye kupokea urejeshaji. ‘Kwa Yuda’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: אַחֲרֵי שְׁכַב
  choice: baada ya ... kulala
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ya kulala inayotumiwa kuhusu kifo badala ya kuifafanua moja kwa moja kuwa ‘kufa.’
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Chanzo kinasema ‘mfalme,’ si jina lake; tafsiri inahifadhi namna hiyo ya kumtaja.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na babu zake
  rationale: Katika kauli hii ya Kiebrania kuhusu kifo, אָבוֹת humaanisha waliotangulia katika ukoo. ‘Babu zake’ ni ya asili na yenye heshima katika Kiswahili, huku tanbihi ikifafanua nahau nzima.
