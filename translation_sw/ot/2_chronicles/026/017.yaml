base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: sw
  text: Kuhani Azaria akaingia baada yake, na pamoja naye walikuwa makuhani themanini wa Yahweh, wanaume mashujaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaume wa nguvu.” Nahau ya Kiebrania בְּנֵי חָיִל inaweza kumaanisha wanaume wenye nguvu, ujasiri, au ushujaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: akaingia nyuma yake
  rationale: בוא inaweza kumaanisha kuja, kwenda, au kuingia; katika muktadha huu Azaria anamfuata mfalme ndani, hivyo “akaingia nyuma yake” huonyesha mwendo na ufuatano bila kuongeza mahali pasipotajwa katika mstari.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: Azaria kuhani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na הַכֹּהֵן linamtambulisha kwa wadhifa wake.
- source_word: וְעִמּוֹ
  choice: na pamoja naye walikuwa
  rationale: Kirai cha Kiebrania hakina kitenzi kilicho wazi; “walikuwa” kinaongezwa kwa ufasaha wa Kiswahili bila kubadili maana ya kuandamana.
- source_word: כֹּהֲנִים לַיהוָה
  choice: makuhani wa Yahweh
  rationale: לַ hapa huonyesha uhusiano au huduma kwa Yahweh; “makuhani wa Yahweh” ni ya moja kwa moja na ya kawaida.
- source_word: שְׁמוֹנִים
  choice: themanini
  rationale: Ni tafsiri ya moja kwa moja ya idadi.
- source_word: בְּנֵי חָיִל
  choice: watu mashujaa
  rationale: Nahau hii huonyesha watu wenye nguvu, ujasiri, au ushujaa. “Watu mashujaa” ni Kiswahili cha asili na huhifadhi rejeleo la wanaume katika muktadha wa makuhani hawa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina maalumu la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya בְּנֵי חָיִל
  choice: watu mashujaa
  alternative: watu wenye nguvu
  rationale: Kirai kinaweza kusisitiza nguvu, uwezo, au ujasiri. Muktadha wa kuingia ili kumkabili mfalme unaunga mkono “mashujaa,” lakini uwezekano wa “wenye nguvu” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “akaingia nyuma yake” huhifadhi kwa kawaida ufuatano wa simulizi; “pamoja naye walikuwa” huweka wazi kirai cha kuandamana.
