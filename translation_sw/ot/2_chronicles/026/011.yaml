  text: וַ/יְהִ֣י לְ/עֻזִּיָּ֡הוּ חַיִל֩ עֹשֵׂ֨ה מִלְחָמָ֜ה יוֹצְאֵ֧י צָבָ֣א לִ/גְד֗וּד בְּ/מִסְפַּר֙ פְּקֻדָּתָ֔/ם בְּ/יַד֙ יעואל הַ/סּוֹפֵ֔ר וּ/מַעֲשֵׂיָ֖הוּ הַ/שּׁוֹטֵ֑ר עַ֚ל יַד חֲנַנְיָ֔הוּ מִ/שָּׂרֵ֖י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: sw
  text: Uzia alikuwa na jeshi la wapiganaji, waliokuwa wakitoka kwenda vitani kwa vikosi, kwa idadi ya walioandikishwa[a], chini ya usimamizi wa Yeuel[b], mwandishi, na Maaseya, afisa, chini ya mamlaka ya Hanania, mmoja wa majemadari wa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hesabu ya mkusanyiko wao.” Neno la Kiebrania linamaanisha kuhesabiwa au kuandikishwa rasmi kwa wanajeshi.
    reason: lexical_alternative
  - marker: b
    text: Jina hili limeandikwa יעואל (Yeuel) katika maandishi ya Kiebrania hapa; katika mapokeo ya Kiingereza wakati mwingine huwasilishwa kama Jiel au Jeuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: jeshi
  rationale: Katika muktadha huu wa kijeshi, neno hili linamaanisha kikosi cha kijeshi, si mali wala ushujaa kwa maana ya jumla.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: la kupigana vita
  rationale: Hueleza jeshi lenye uwezo na jukumu la kupigana; Kiswahili hiki ni cha kawaida na kinabaki karibu na maana ya kirai cha Kiebrania.
- source_word: יוֹצְאֵי צָבָא
  choice: lililotoka kwenda vitani
  rationale: Kirai hiki humaanisha kutoka kwa ajili ya huduma au mapigano ya kijeshi; hapa muktadha wa jeshi lililopangwa kwa vikosi unaunga mkono ‘kwenda vitani.’
- source_word: לִגְדוּד
  choice: kwa vikosi
  rationale: Katika muktadha wa upangaji wa jeshi, גְּדוּד inahusu vitengo au vikosi, bila kulazimisha maana finyu ya makundi ya wavamizi.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: kulingana na idadi yao katika orodha ya jeshi
  rationale: Huhifadhi wazo la kuhesabiwa na kuandikishwa rasmi kwa wanajeshi kwa Kiswahili kinachoeleweka kwa urahisi.
- source_word: בְּיַד
  choice: kwa uongozi wa
  rationale: Nahau hii inaonyesha wakala au usimamizi wa kiutawala, si mkono halisi.
- source_word: הַסּוֹפֵר
  choice: mwandishi
  rationale: סֹפֵר ni mwandishi rasmi au katibu; ‘mwandishi’ ni tafsiri ya wazi, huku muktadha ukionyesha cheo chake cha kiutawala.
- source_word: הַשּׁוֹטֵר
  choice: afisa
  rationale: Neno hili humaanisha mtendaji rasmi wa utawala au jeshi; ‘afisa’ linafaa katika muktadha huu wa kijeshi.
- source_word: עַל יַד
  choice: chini ya mamlaka ya
  rationale: Hapa nahau hii inaonyesha ngazi ya juu ya usimamizi katika muundo wa mamlaka.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: mmoja wa majemadari wa mfalme
  rationale: שַׂר inaweza kuwa mkuu, afisa, au jemadari; muktadha wa jeshi unaelekeza kwenye ‘jemadari,’ huku muundo wa Kiebrania ukionyesha kuwa Hanania alikuwa mmoja wao.
- source_word: יעואל
  choice: Yeuel
  rationale: Huu ni uwasilishaji wa karibu wa namna jina lilivyoandikwa katika maandishi ya Kiebrania ya mstari huu, badala ya kufuata kimya kimya mapokeo yanayotumia Yeieli.
