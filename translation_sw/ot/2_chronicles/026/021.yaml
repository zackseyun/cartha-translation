base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: sw
  text: Mfalme Uzia alikuwa na ugonjwa wa ngozi[a] mpaka siku ya kufa kwake; naye aliishi katika nyumba iliyotengwa[b], akiwa na ugonjwa wa ngozi, kwa kuwa alikuwa ametengwa na nyumba ya Yahweh. Naye Yothamu mwanawe alisimamia nyumba ya mfalme na kuwahukumu watu wa nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linataja hali ya ngozi ya kibiblia ambayo si lazima iwe ukoma unaotambuliwa katika tiba ya kisasa.
    reason: lexical_scope
  - marker: b
    text: Kiebrania kina kirai kisicho wazi ambacho kwa maana halisi kinaweza kutafsiriwa ‘nyumba ya uhuru’; huenda kinamaanisha makao ambako Uzia aliishi akiwa ametengwa kwa sababu ya hali yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצֹרָע
  choice: alikuwa na ugonjwa wa ngozi
  rationale: Neno la Kiebrania linamaanisha mtu mwenye צָרַעַת, hali ya kibiblia ambayo haipaswi kulinganishwa moja kwa moja na ukoma wa kisasa. Tafsiri hii inaeleweka na haibainishi utambuzi wa kitabibu usiothibitishwa.
- source_word: בֵּית הַחפשות
  choice: nyumba ya pekee
  rationale: Kirai hiki kigumu kinaonekana kumaanisha makao yaliyotengwa ambako Uzia aliishi mbali na maisha ya kawaida ya kifalme na ya ibada. ‘Nyumba ya pekee’ ni ya asili katika Kiswahili huku tanbihi ikihifadhi maana halisi isiyo wazi.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: alikuwa ametengwa na nyumba ya Yahwe
  rationale: Kitenzi גזר hapa kina wazo la kukatwa au kutengwa. ‘Ametengwa’ kinaonyesha kunyimwa kwake nafasi ya kuingia hekaluni bila kudokeza kwamba aliuawa au kuondolewa katika jumuiya kwa kila namna.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi taswira halisi ya ‘nyumba’ na jina la agano יְהוָה; katika muktadha huu nyumba hiyo ni hekalu.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: alisimamia nyumba ya mfalme
  rationale: Kirai kinaonyesha usimamizi wa nyumba au ikulu ya kifalme. ‘Alisimamia’ ni Kiswahili cha kawaida na hakibainishi cheo mahsusi ambacho matini haitaji.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: kuwahukumu watu wa nchi
  rationale: Huhifadhi maana ya msingi ya שׁפט, huku katika muktadha ikiruhusu pia dhana pana ya kutawala na kusimamia haki.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Tafsiri ya moja kwa moja huhifadhi uwezekano kwamba kirai kina maana ya watu kwa ujumla au kundi la kijamii na kisiasa, bila kulibana kuwa ‘watu wa kawaida’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ hulitambulisha kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kutengwa na nyumba ya Yahwe
  choice: alikuwa ametengwa na nyumba ya Yahwe
  alternative: alikuwa amekatiliwa mbali na nyumba ya Yahwe
  rationale: Tafsiri iliyochaguliwa inahifadhi uzito wa kufungiwa nje ya hekalu, lakini haiongezi dai kwamba Uzia alitengwa kabisa na watu wa agano au na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. ‘Yothamu’ linafuata kwa karibu umbo la jina la Kiebrania יוֹתָם. Maneno ya kawaida kama ‘aliishi,’ ‘alisimamia,’ na ‘kuwahukumu’ yanaepuka uchakavu bila kupoteza uzito wa matini.
