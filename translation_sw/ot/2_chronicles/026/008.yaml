base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: sw
  text: Waamoni wakampa Uzia ushuru, na umaarufu wake ukaenea mpaka mahali pa kuingia Misri[a], kwa maana alikuwa amezidi kuwa na nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mahali pa kuingia Misri” huenda ikamaanisha eneo la kuikaribia Misri au eneo la mpakani mwake.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: Waamoni
  rationale: Ni jina la kawaida la Kiswahili kwa watu wa taifa la Amoni.
- source_word: מִנְחָה
  choice: ushuru
  rationale: Katika muktadha wa kisiasa wa taifa kumpa mfalme mali, neno hili lina maana ya ushuru wa kutambua mamlaka, si sadaka ya ibada wala zawadi ya kawaida.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: umaarufu wake ukaenea
  rationale: Kirai halisi ni ‘jina lake likaenda,’ lakini hapa ‘jina’ humaanisha sifa au umaarufu; tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo la kuenea.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: mpaka njia ya kuingia Misri
  rationale: Hudumisha taswira ya Kiebrania ya kuifikia au kuikaribia Misri bila kulazimisha maana kuwa mpaka rasmi pekee.
- source_word: הֶחֱזִיק
  choice: alikuwa amekuwa na nguvu
  rationale: Muundo wa Hiphil hapa unaeleza kuwa Uzia alikuwa amepata au akawa na nguvu; hali hiyo ndiyo sababu ya umaarufu wake kuenea.
- source_word: עַד לְמַעְלָה
  choice: nyingi sana
  rationale: Ni usemi wa kuongeza kiwango cha nguvu kwa namna ya juu mno; ‘nguvu nyingi sana’ ni Kiswahili cha kawaida na chenye hadhi.
