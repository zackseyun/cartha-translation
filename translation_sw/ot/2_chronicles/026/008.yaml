  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ushuru’ huonyesha muktadha wa kisiasa, huku ‘umaarufu wake ukaenea’ ikitoa maana ya nahau ya Kiebrania kwa lugha inayoeleweka kwa urahisi.
