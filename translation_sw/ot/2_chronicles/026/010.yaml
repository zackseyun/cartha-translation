  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: sw
  text: Alijenga minara[a] nyikani na akachonga mabirika mengi, kwa maana alikuwa na mifugo mingi katika nchi ya chini[b] na nchi tambarare. Alikuwa na wakulima na wakuzaji wa mizabibu milimani na katika ardhi yenye rutuba[c], kwa maana aliipenda ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “minara ya ulinzi.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, Shefela, eneo la vilima vya chini huko Yuda.
    reason: cultural_note
  - marker: c
    text: Au, “huko Karmeli,” ikiwa neno hilo linaeleweka kuwa jina la mahali.
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: minara
  rationale: Neno hilo humaanisha minara; muktadha unaweza kuruhusu ‘minara ya ulinzi,’ lakini kazi hiyo haijaelezwa wazi katika Kiebrania.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר inaweza kuwa nyika, eneo lisilokaliwa sana, au eneo la malisho; ‘nyikani’ haidokezi ukame mkali bila sababu.
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: kuchimba mashimo mengi ya kuhifadhia maji
  rationale: Kitenzi hudokeza kuchimba au kuchonga, na בֹּרוֹת hapa ni mashimo ya kukusanya na kuhifadhi maji, si lazima visima vyenye chemchemi.
- source_word: מִקְנֶה רַב
  choice: mifugo mingi
  rationale: מִקְנֶה ni jina la jumla la wanyama wanaofugwa, hivyo halipaswi kufinywa kuwa ng’ombe pekee.
- source_word: שְׁפֵלָה
  choice: nchi ya chini
  rationale: Ni eneo la vilima vya chini upande wa Yuda; tafsiri hii ya maana inaeleweka kwa urahisi kuliko kuacha jina la kijiografia bila maelezo.
- source_word: מִישׁוֹר
  choice: nchi tambarare
  rationale: Neno hilo hutaja eneo lililo sawa au uwanda; ‘nchi tambarare’ ni ya kawaida na haibani maana kuwa nyanda za juu.
- source_word: אִכָּרִים
  choice: wakulima
  rationale: Huwataja wafanyakazi wa kilimo, hasa walimaji wa udongo.
- source_word: כֹרְמִים
  choice: wakuzaji wa mizabibu
  rationale: Huwataja watu wanaotunza na kulima mizabibu; usemi huu ni wa sasa na unaweka umahususi wa neno.
- source_word: בֶּהָרִים
  choice: milimani
  rationale: הָרִים inaweza kumaanisha milima au vilima; ‘milimani’ ni usemi mpana na wa kawaida katika Kiswahili.
- source_word: בַּכַּרְמֶל
  choice: katika ardhi yenye rutuba
  rationale: Katika muktadha huu כַּרְמֶל yaelekea ni jina la kawaida la ardhi yenye rutuba badala ya jina maalumu Karmeli, ingawa yote mawili yanawezekana.
- source_word: אֹהֵב אֲדָמָה
  choice: aliipenda ardhi
  rationale: Tafsiri hii inadumisha picha halisi ya kupenda ardhi bila kuifafanua kupita kiasi kuwa alipenda shughuli ya kilimo.
