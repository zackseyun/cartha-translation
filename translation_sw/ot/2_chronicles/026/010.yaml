translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa ili kuonyesha muundo wa Kiebrania: mifugo ilikuwa katika nchi ya chini na tambarare, huku wakulima na wakuzaji wa mizabibu wakiwa milimani na katika ardhi yenye rutuba. Alama zote za tanbihi zimewekwa kwenye matini kuu.'
