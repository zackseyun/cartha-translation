  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: sw
  text: Katika Yerusalemu akatengeneza vifaa[a] vilivyobuniwa na mbunifu stadi, ili viwekwe juu ya minara na kwenye pembe, kwa ajili ya kurusha mishale na mawe makubwa. Umaarufu wake ukaenea mbali[b], kwa maana alipata msaada wa ajabu[c] mpaka akawa mwenye nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mitambo” au “vifaa vilivyobuniwa”—yaani, vifaa vya kijeshi vilivyokusudiwa kutumiwa juu ya minara na kwenye pembe za ngome.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “jina lake likatoka mpaka mbali.”
    reason: lexical_alternative
  - marker: c
    text: Matini haimtaji wazi aliyemsaidia, ingawa muktadha unaashiria msaada wa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: mitambo
  rationale: Neno hili linamaanisha vitu vilivyobuniwa au mifumo ya kiufundi. “Mitambo” ni Kiswahili cha kawaida kinachofaa katika muktadha wa vifaa vya kijeshi bila kubainisha teknolojia kuliko maandishi yanavyoruhusu.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: iliyobuniwa na mafundi stadi
  rationale: Maneno yenye mzizi unaohusiana yanakazia ubunifu wa makusudi wa mbunifu au fundi. Usemi huu unawasilisha ustadi wa kubuni na kutengeneza kwa Kiswahili cha asili.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: juu ya minara na kwenye pembe za ukuta
  rationale: מִגְדָּלִים ni minara, na פִּנּוֹת ni pembe. “Za ukuta” huweka wazi muktadha wa ngome bila kubadili pembe kuwa aina mahususi ya jengo la kijeshi.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: kwa ajili ya kurusha mishale na mawe makubwa
  rationale: Kitenzi ירה kinatawala mishale na mawe na kina maana ya kupiga au kurusha. “Kurusha” kinaweza kutumika kwa vyote viwili na huhifadhi muundo mfupi wa Kiebrania.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: Sifa zake zikaenea mbali
  rationale: Kifungu halisi “jina lake likatoka” ni nahau ya kuenea kwa sifa au umaarufu. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: alisaidiwa kwa njia ya ajabu
  rationale: Muundo wa Kiebrania unaonyesha msaada wa ajabu na unamwacha msaidizi bila kutajwa. Kauli tendwa ya Kiswahili inahifadhi jambo hilo.
- source_word: עַד כִּי חָזָק
  choice: mpaka akawa na nguvu
  rationale: Kifungu kinaonyesha kiwango au matokeo yaliyofikiwa kutokana na msaada; “akawa na nguvu” ni wazi na kinafuata maana ya maandishi.
theological_decisions:
- issue: Mhusika aliyemsaidia mfalme
  choice: 'Kuachwa bila kutajwa katika matini kuu: “alisaidiwa kwa njia ya ajabu”'
  alternative: 'Kutaja wazi msaada wa Mungu, kwa mfano: “BWANA alimsaidia kwa njia ya ajabu”'
  rationale: Kiebrania hakimtaji msaidizi katika kishazi hiki, ingawa muktadha mpana unaelekeza kwa msaada wa Mungu. Kauli tendwa inalinda maana ya mstari wenyewe bila kuingiza mhusika ambaye hakutajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mitambo” imetumiwa kwa upana ili kuepuka kuhusisha silaha mahususi ya kale ambayo maandishi hayaitaji. Alama zote za tanbihi zimewekwa katika matini kuu.
