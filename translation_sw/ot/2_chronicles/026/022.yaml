  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: sw
  text: Matendo mengine ya Uzia[a], tangu ya mwanzo hadi ya mwisho, aliandika nabii Isaya mwana wa Amozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “maneno ya Uzia, ya kwanza na ya mwisho.” Hapa “maneno” ni usemi wa Kiebrania katika kumbukumbu za kifalme, unaomaanisha matukio au matendo ya utawala wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: mengine
  rationale: Katika muundo huu wa muhtasari wa kifalme, neno hili linaonyesha yaliyosalia; “mengine” ni Kiswahili cha kawaida na fasaha katika “matendo mengine.” Kiunganishi וְ hakihitaji kutafsiriwa kwa neno la ziada mwanzoni mwa sentensi.
- source_word: דִּבְרֵי
  choice: matendo
  rationale: Ingawa maana ya msingi ni “maneno” au “mambo,” katika kauli za kumbukumbu za wafalme neno hili hurejelea matukio na matendo ya utawala wa mfalme.
- source_word: עֻזִּיָּהוּ
  choice: Uzia
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili na linaakisi jina lililo katika aya hii.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: ya mwanzo na ya mwisho
  rationale: Tafsiri hii inahifadhi jozi ya Kiebrania na kuonyesha matendo katika kipindi chote cha utawala bila kuifafanua kupita kiasi.
- source_word: כָּתַב
  choice: yaliandikwa
  rationale: Kauli tendwa ni ya asili katika Kiswahili hapa na bado inawasilisha moja kwa moja maana ya “aliandika,” huku Isaya akitajwa wazi kuwa mwandishi.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: nabii Isaya mwana wa Amozi
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili, unahifadhi cheo cha kinabii, jina la mtu, na utambulisho wa ukoo.
theological_decisions:
- issue: Maana ya דִּבְרֵי katika muundo wa kumbukumbu za kifalme
  choice: matendo
  alternative: maneno; mambo
  rationale: Muktadha unahusu kumbukumbu ya utawala wa mfalme, hivyo “matendo” huwasilisha maana inayokusudiwa; tanbihi huhifadhi maana halisi zaidi.
- issue: Uhusiano wa “ya mwanzo na ya mwisho” na kumbukumbu za Uzia
  choice: Kauli imeachwa ikiwa na upana wa asili
  alternative: tangu mwanzo hadi mwisho
  rationale: “Ya mwanzo na ya mwisho” inafuata umbo la chanzo na haiongezi ufafanuzi usio lazima kuhusu namna kumbukumbu hizo zilivyogawanywa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Matendo mengine” ni ya asili kuliko tafsiri ya moja kwa moja “maneno mengine” katika muktadha huu wa kihistoria.
