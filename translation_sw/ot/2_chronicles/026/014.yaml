base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: sw
  text: Uzia akawaandalia jeshi lote ngao, mikuki, kofia za vita, mavazi ya kinga ya mwili, pinde, na mawe ya kombeo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe kwa ajili ya kombeo.” Kiebrania kihalisi, “mawe ya kombeo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן לָהֶם לְכָל הַצָּבָא
  choice: akawaandalia jeshi lote
  rationale: Kauli hii inaonyesha Uzia alihakikisha vifaa vinakuwa tayari kwa ajili yao; kirai kinachofuata kinabainisha kuwa ‘wao’ ni jeshi lote. Kiswahili hiki huwasilisha maana hiyo kwa uwazi bila kudai kwamba Uzia mwenyewe alivitengeneza.
- source_word: מָגִנִּים
  choice: ngao
  rationale: Neno la kawaida la Kiswahili kwa vifaa hivi vya kujikinga vitani.
- source_word: רְמָחִים
  choice: mikuki
  rationale: Tafsiri pana na ya kawaida ya silaha ndefu za kuchoma zinazotajwa hapa.
- source_word: כּוֹבָעִים
  choice: kofia za vita
  rationale: Katika orodha ya silaha neno hili linamaanisha kofia za kujikinga kichwa; ‘za vita’ huonyesha matumizi bila kuongeza kwamba lazima zilikuwa za chuma.
- source_word: שִׁרְיֹנוֹת
  choice: mavazi ya kujikinga mwili
  rationale: Neno linamaanisha mavazi ya kinga ya kiwiliwili. Kauli hii ni wazi kwa wasomaji wa sasa na haibainishi bila ushahidi aina maalumu ya utengenezaji, kama vile pete za chuma.
- source_word: קְשָׁתוֹת
  choice: pinde
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya silaha hizi.
- source_word: אַבְנֵי קְלָעִים
  choice: mawe ya kombeo
  rationale: Hufuata kwa karibu muundo wa Kiebrania, ‘mawe ya kombeo,’ na ni kauli ya asili inayoeleweka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha imewekwa kwa mtiririko rahisi; istilahi za kijeshi zimechaguliwa kwa uwazi bila kutumia maneno ya kizamani au kubainisha nyenzo na muundo ambao Kiebrania hakitaji.
