base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: sw
  text: Alifanya yaliyo sawa machoni pa Yahwe[a], sawasawa na yote aliyofanya Amazia, baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele za Yahwe.”
    reason: Hii ni tafsiri mbadala ya sitiari ya Kiebrania בְּעֵינֵי, huku ikihifadhi jina יְהוָה.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Alifanya
  rationale: Umbo la wayyiqtol la עשה linaendeleza simulizi. Kiswahili hakihitaji kuanza na kiunganishi “na” hapa.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Pamoja na עשה, neno hili lina maana ya kufanya jambo lililo sawa au adilifu. “Yaliyo sawa” ni Kiswahili cha kawaida na huhifadhi tathmini ya kimaadili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi sitiari ya Kiebrania inayoonyesha tathmini kwa mtazamo wa mtu fulani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כְּכֹל אֲשֶׁר
  choice: kama yote
  rationale: Huwasilisha ulinganifu na pia nguvu ya jumla ya כֹל kwa Kiswahili cha asili.
- source_word: עָשָׂה
  choice: aliyofanya
  rationale: Kishazi rejeshi cha Kiswahili kinaonyesha matendo ya Amazia yaliyokuwa kielelezo cha matendo yanayosimuliwa.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Huu ndio umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אָבִיו
  choice: baba yake
  rationale: Muktadha humtambulisha Amazia kuwa baba halisi wa Uzia, si babu au babu wa zamani.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; tanbihi inatoa namna ya jadi ya kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “machoni pa” umehifadhi sitiari ya chanzo bila kufanya sentensi kuwa ngumu.
