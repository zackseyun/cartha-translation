  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: sw
  text: Lakini alipozidi kuwa na nguvu, moyo wake ukainuka kwa kiburi hata ikamletea maangamizi. Akakosa uaminifu kwa Yahwe, Mungu wake, akaingia katika Hekalu la Yahwe ili kufukiza uvumba juu ya madhabahu ya uvumba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: Lakini alipokuwa na nguvu
  rationale: 'Muundo wenye כְּ una maana ya wakati hapa: alipokuwa au alipozidi kuwa na nguvu. Tafsiri hii ni ya kawaida na inaendeleza uhusiano wa wakati na matokeo.'
- source_word: גָּבַהּ לִבּוֹ
  choice: moyo wake ukainuka kwa kiburi
  rationale: Neno kwa neno ni ‘moyo wake ukawa juu.’ Kuongeza ‘kwa kiburi’ kunafanya nahau hiyo ieleweke kwa msomaji wa sasa bila kuondoa taswira ya moyo kuinuka.
- source_word: עַד לְהַשְׁחִית
  choice: mpaka akajiletea uharibifu
  rationale: Kirai kinaweza kueleza matokeo ya kiburi chake, yaani uharibifu au kuangamia. ‘Akajiletea uharibifu’ huonyesha kwamba mwenendo wake ulimfikisha kwenye madhara bila kubainisha zaidi namna ya uharibifu huo.
- source_word: וַיִּמְעַל
  choice: Akakosa uaminifu
  rationale: מעל humaanisha kuvunja uaminifu, hasa katika uhusiano wa agano. ‘Kukosa uaminifu’ ni wazi na hakina ladha ya lugha ya kizamani.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: kwa Yahwe, Mungu wake
  rationale: Baada ya מעל, בְּ humtaja yule ambaye uaminifu umevunjwa kwake. Kiswahili ‘kukosa uaminifu kwa’ ni muundo wa kawaida na sahihi.
- source_word: הֵיכַל יְהוָה
  choice: Hekalu la Yahwe
  rationale: הֵיכָל katika muktadha huu ni jengo takatifu la hekalu. ‘Hekalu’ ni neno la kawaida na lililo wazi katika Kiswahili.
- source_word: לְהַקְטִיר
  choice: ili kufukiza uvumba
  rationale: Katika muktadha wa ibada, Hifili ya קטר humaanisha kuchoma au kutoa uvumba. ‘Kufukiza uvumba’ ni usemi wa kawaida wa Kiswahili kwa tendo hilo.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: madhabahu ya uvumba
  rationale: Hili ni jina la madhabahu iliyotengwa kwa ajili ya uvumba; tafsiri hii ni wazi na inafuata muundo wa Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה. ‘Yahwe’ linawakilisha jina hilo moja kwa moja badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עַד לְהַשְׁחִית
  choice: mpaka akajiletea uharibifu
  alternative: mpaka akatenda kwa upotovu
  rationale: Muundo unaweza kueleweka kuwa matokeo mabaya au kutenda kwa uharibifu. Muktadha wa simulizi na maana ya matokeo unaunga mkono ‘akajiletea uharibifu,’ huku tafsiri hiyo ikiacha aina kamili ya uharibifu bila kubainishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Nahau ya Kiebrania kuhusu moyo kuinuka imehifadhiwa na kufafanuliwa kwa ‘kwa kiburi.’ Jina ‘Yahwe’ limetumika moja kwa moja.
