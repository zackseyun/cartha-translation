base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: sw
  text: Uzia alikuwa na umri wa miaka kumi na sita alipoanza kutawala[a], naye akatawala miaka hamsini na miwili Yerusalemu. Jina la mama yake lilikuwa Yekolia[b], kutoka Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakati alipoanza kutawala” au “wakati wa kutawazwa kwake.”'
    reason: lexical_alternative
  - marker: b
    text: Jina hili linaweza pia kuandikwa Yekilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: alikuwa na umri wa miaka kumi na sita
  rationale: Hii ni tafsiri ya asili ya nahau ya Kiebrania inayotaja umri, bila kufuata kwa ugumu muundo wa ‘mwana wa miaka kumi na sita.’
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Kishazi hiki kinaonyesha wakati Uzia alipoingia katika utawala; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki kinaeleza kutenda kazi ya kifalme kwa kipindi kilichotajwa.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: miaka hamsini na miwili
  rationale: Huu ndio mpangilio wa kawaida wa namba hiyo katika Kiswahili cha sasa.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi cha mahali kimetafsiriwa kwa Kiswahili cha kawaida, huku ‘huko’ ikirejelea mahali pa utawala.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii inawasilisha kwa lugha ya asili fomula ya Kiebrania ‘jina la mama yake lilikuwa.’
- source_word: יכיליה
  choice: Yekolia
  rationale: Jina limeandikwa kwa namna inayokaribia konsonanti za Kiebrania na inayosomeka kwa urahisi katika Kiswahili.
- source_word: מִן יְרוּשָׁלִָם
  choice: alikuwa mwenyeji wa Yerusalemu
  rationale: מִן hapa inaonyesha asili au mji alikotoka mama yake; ‘mwenyeji wa’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
