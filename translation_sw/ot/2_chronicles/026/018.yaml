  text: וַ/יַּעַמְד֞וּ עַל עֻזִּיָּ֣הוּ הַ/מֶּ֗לֶךְ וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹא לְ/ךָ֣ עֻזִּיָּ֗הוּ לְ/הַקְטִיר֙ לַֽ/יהוָ֔ה כִּ֣י לַ/כֹּהֲנִ֧ים בְּנֵי אַהֲרֹ֛ן הַ/מְקֻדָּשִׁ֖ים לְ/הַקְטִ֑יר צֵ֤א מִן הַ/מִּקְדָּשׁ֙ כִּ֣י מָעַ֔לְתָּ וְ/לֹֽא לְ/ךָ֥ לְ/כָב֖וֹד מֵ/יְהוָ֥ה אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: sw
  text: Wakampinga Mfalme Uzia[a] na kumwambia, “Si kazi yako, Uzia, kumfukizia BWANA uvumba, bali ni kazi ya makuhani, wana wa Aroni, waliowekwa wakfu kufukiza uvumba. Ondoka katika patakatifu, kwa maana umetenda kwa kukosa uaminifu[b]; wala jambo hili halitakuletea heshima kutoka kwa BWANA Mungu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakasimama dhidi ya Mfalme Uzia” au “Wakakabiliana na Mfalme Uzia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “umekosa uaminifu” au “umetenda kosa dhidi ya kilicho kitakatifu.” Kitenzi cha Kiebrania huweza kumaanisha kuvunja uaminifu, hasa katika jambo takatifu au la agano.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kwa neno halisi ni, “wala si kwako kwa heshima kutoka kwa BWANA Mungu,” usemi wa mkato unaomaanisha kwamba tendo hili halitamletea heshima kutoka kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: Wakampinga
  rationale: Nahau hii inaonyesha kusimama dhidi ya mtu kwa upinzani. “Wakampinga” ni Kiswahili cha kawaida na hudumisha nguvu ya tendo bila kudokeza kwamba walisimama karibu naye tu.
- source_word: עֻזִּיָּהוּ הַמֶּלֶךְ
  choice: Mfalme Uzia
  rationale: Mpangilio wa cheo kabla ya jina ni wa kawaida katika Kiswahili.
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: Si haki yako ... kumfukizia
  rationale: Muundo wa Kiebrania unahusu haki au jukumu linalomstahili mtu. Kauli hii huhifadhi katazo bila kuligeuza kuwa istilahi ya kisasa ya kiutawala.
- source_word: לְהַקְטִיר לַיהוָה
  choice: kumfukizia BWANA uvumba
  rationale: Katika muktadha huu, kitenzi kinamaanisha kufukiza uvumba kama tendo la ibada kwa YHWH. Muundo huu ni wa kawaida na huonyesha anayelengwa na tendo hilo.
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: kazi hiyo ni ya makuhani, wana wa Aroni
  rationale: Hufanya wazi kwamba jukumu hilo limetengwa kwa makuhani wa ukoo wa Aroni, huku ikihifadhi jina rasmi “wana wa Aroni.”
- source_word: הַמְקֻדָּשִׁים
  choice: waliowekwa wakfu
  rationale: Hueleza hali yao ya kutengwa rasmi kwa huduma takatifu kwa lugha ya heshima na inayoeleweka.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: Ondoka katika mahali patakatifu
  rationale: מקדש inaweza kutaja patakatifu au eneo takatifu la hekalu bila kulazimisha maana finyu ya chumba cha ndani pekee.
- source_word: מָעַלְתָּ
  choice: umetenda kwa kukosa uaminifu
  rationale: מעל huonyesha kuvunja uaminifu, hasa katika jambo takatifu au la agano; ni nzito kuliko kosa la kawaida lakini haiongezi istilahi ya kimadhehebu.
- source_word: וְלֹא לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים
  choice: wala jambo hili halitakuletea heshima kutoka kwa BWANA Mungu
  rationale: Kishazi cha Kiebrania ni cha mkato. Tafsiri hii huweka maana yake wazi kwa Kiswahili cha kawaida na kuhifadhi kwamba heshima inayozungumziwa hutoka kwa BWANA Mungu.
theological_decisions:
- issue: Jukumu la kufukiza uvumba limetengwa kwa ukuhani wa Aroni
  choice: Aya inasema kwamba kufukiza uvumba kwa BWANA ni kazi ya makuhani, wana wa Aroni, waliowekwa wakfu kwa kazi hiyo.
  alternative: Kuifanya aya kuwa kauli ya jumla kuhusu viongozi wa ibada bila kutaja jukumu maalumu la ukuhani wa Aroni.
  rationale: Kiebrania kinataja moja kwa moja tendo la kufukiza uvumba na makuhani wana wa Aroni; tafsiri inahifadhi mpaka huo maalumu bila kuupanua kuwa fundisho la jumla.
- issue: Uzito wa neno מָעַלְתָּ
  choice: Uzia ametenda kwa kukosa uaminifu katika jambo takatifu.
  alternative: Uzia amefanya kosa dogo la utaratibu tu.
  rationale: Katika muktadha wa ibada, מעל huonyesha ukiukaji mzito wa uaminifu au wa utaratibu mtakatifu, si hitilafu ndogo tu.
- issue: Maana ya kishazi cha mwisho kilicho cha mkato
  choice: Tendo hili halitamletea Uzia heshima kutoka kwa BWANA Mungu.
  alternative: 'Kudumisha neno kwa neno muundo usio kamili: “wala si kwako kwa heshima kutoka kwa BWANA Mungu.”'
  rationale: Kiebrania huacha baadhi ya vipashio vikieleweka. Kiswahili kinahitaji kuvifanya wazi, lakini tafsiri haiongezi wazo la adhabu au fedheha ambalo halijasemwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “BWANA” limetumiwa kwa jina la agano YHWH. “Mahali patakatifu” huepuka kulazimisha maana finyu ya chumba maalumu ndani ya hekalu. Muundo wa moja kwa moja wa hotuba na katazo umehifadhiwa.
