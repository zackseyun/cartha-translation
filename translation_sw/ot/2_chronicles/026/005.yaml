base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: sw
  text: Akaendelea kumtafuta Mungu katika siku za Zekaria[a], aliyekuwa na ufahamu katika maono ya Mungu; na maadamu alimtafuta Yahweh[b], Mungu alimfanikisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyefundisha kuhusu kumcha Mungu.” Usemi wa Kiebrania ni mgumu; kwa maana halisi zaidi, maandishi ya Masora yanasema, “aliyekuwa na ufahamu katika maono ya Mungu.”
    reason: alternative_reading
  - marker: b
    text: Au, “na katika siku alipomtafuta Yahweh.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: Akaendelea kumtafuta Mungu
  rationale: Muundo wa היה pamoja na kitenzi-jina unaonyesha tendo au desturi iliyoendelea. “Akaendelea kumtafuta Mungu” ni Kiswahili cha asili na huhifadhi maana ya kujitoa na kumtegemea Mungu, si kuuliza habari tu.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: katika siku za Zekaria
  rationale: Huhifadhi usemi wa wakati wa Kiebrania kwa lugha iliyo wazi na yenye hadhi.
- source_word: הַמֵּבִין
  choice: aliyekuwa na ufahamu
  rationale: Kitenzi-shirikishi cha בין kinaonyesha kuwa na ufahamu au utambuzi; tafsiri hii haiongezi dhana ya kufundisha ambayo haijasemwa wazi.
- source_word: בִּרְאֹת הָאֱלֹהִים
  choice: katika maono ya Mungu
  rationale: Herufi na irabu za Masora zinaelekeza kwenye kuona au maono. Ingawa usemi ni mgumu, “maono ya Mungu” huweka karibu maana hii bila kuibadili kimyakimya kuwa “kumcha Mungu.”
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: na maadamu alimtafuta Yahwe
  rationale: “Maadamu” huwasilisha kipindi chote kilichotawaliwa na kumtafuta Yahwe na pia uhusiano wake na mafanikio yanayofuata, kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: Mungu alimfanikisha
  rationale: Hifili ya צלח inaonyesha Mungu ndiye aliyesababisha afanikiwe; “alimfanikisha” ni fupi, wazi, na huhifadhi usababishaji huo.
theological_decisions:
- issue: Maana ya usemi mgumu בִּרְאֹת הָאֱלֹהִים
  choice: Zekaria alikuwa na ufahamu katika maono ya Mungu
  alternative: Zekaria alikuwa na ufahamu katika kumcha Mungu, au alifundisha watu kumcha Mungu
  rationale: Usomaji wa Masora unaunga mkono maana inayohusiana na kuona au maono. Tofauti inayohusiana na kumcha Mungu imehifadhiwa katika tanbihi ili kutatua kwa lazima jambo ambalo Kiebrania chake ni kigumu.
- issue: Uhusiano kati ya kumtafuta Yahwe na kufanikiwa
  choice: na maadamu alimtafuta Yahwe, Mungu alimfanikisha
  alternative: na katika siku alipomtafuta Yahwe, Mungu alimfanikisha
  rationale: “Maadamu” hudumisha maana ya kipindi kinachoendelea na matokeo yake bila kudai kwamba mafanikio yalipatikana kwa ustahili wa kibinadamu; Mungu bado ndiye mtendaji anayemfanikisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akaendelea,” “maadamu,” na “alimfanikisha” ni miundo inayoeleweka kwa wasomaji wa kawaida huku ikihifadhi mwendelezo, uhusiano wa wakati, na usababishaji wa Mungu katika Kiebrania.
