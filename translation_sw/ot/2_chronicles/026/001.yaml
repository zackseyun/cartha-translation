base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: sw
  text: Kisha watu wote wa Yuda wakamchukua Uzia[a], aliyekuwa na umri wa miaka kumi na sita, wakamweka kuwa mfalme badala ya Amazia baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “wakamchagua Uzia.” Kitenzi cha Kiebrania kihalisi ni “wakamchukua,” lakini hapa kinahusu hatua ya watu ya kumweka kwenye ufalme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakamchukua
  rationale: Kitenzi לָקַח maana yake ya msingi ni ‘chukua.’ Tafsiri hii inadumisha lugha ya Kiebrania; katika muktadha huu tendo hilo linahusu kumteua au kumwinua Uzia kuwa mfalme.
- source_word: כָּל עַם יְהוּדָה
  choice: watu wote wa Yuda
  rationale: Hii inawakilisha moja kwa moja mkazo wa kifungu juu ya jumuiya yote ya watu wa Yuda.
- source_word: עֻזִּיָּהוּ
  choice: Uzia
  rationale: Uzia ni umbo la kawaida la Kiswahili la jina עֻזִּיָּהוּ lililotumiwa katika mstari huu.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: aliyekuwa na umri wa miaka kumi na sita
  rationale: Nahau ya Kiebrania, kihalisi ‘naye alikuwa mwana wa miaka kumi na sita,’ imetafsiriwa kwa Kiswahili cha kawaida bila kulazimisha maana ya concessive kama ‘ingawa.’
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: wakamweka kuwa mfalme
  rationale: Hifili ya מָלַךְ ina maana ya kumfanya mtu awe mfalme. ‘Wakamweka kuwa mfalme’ ni wazi na haiongezi tendo la kutawaza kwa taji ambalo halikutajwa wazi.
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika muktadha wa urithi wa kifalme, תַּחַת humaanisha kuchukua nafasi ya mwingine.
- source_word: אָבִיו אֲמַצְיָהוּ
  choice: Amazia baba yake
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi uhusiano wa kifamilia pamoja na jina la mtu.
