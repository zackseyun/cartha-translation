reference: 2 Chronicles 26:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּזְעַף֙ עֻזִּיָּ֔הוּ וּ/בְ/יָד֥/וֹ מִקְטֶ֖רֶת לְ/הַקְטִ֑יר וּ/בְ/זַעְפּ֣/וֹ עִם הַ/כֹּהֲנִ֗ים וְ֠/הַ/צָּרַעַת זָרְחָ֨ה בְ/מִצְח֜/וֹ לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ בְּ/בֵ֣ית יְהוָ֔ה מֵ/עַ֖ל לְ/מִזְבַּ֥ח הַ/קְּטֹֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: sw
  text: Ndipo Uzia akakasirika. Alikuwa na chetezo mkononi ili afukize uvumba; naye alipokuwa amewakasirikia makuhani, ugonjwa wa ngozi[a] ukatokea ghafula kwenye paji la uso wake mbele ya makuhani, ndani ya nyumba ya Yahwe, kando ya madhabahu ya uvumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ukoma. Neno la Kiebrania צָרַעַת linaweza kumaanisha kwa upana zaidi ugonjwa mbaya wa ngozi au hali ya ngozi inayomtia mtu unajisi, wala si lazima ukoma wa kisasa (ugonjwa wa Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: akakasirika
  rationale: Kitenzi kinaonyesha kuingia katika hali ya hasira; umbo la simulizi “akakasirika” ni la kawaida na haliongezi kiwango cha hasira kisicholazimishwa na maandishi.
- source_word: עֻזִּיָּהוּ
  choice: Uzia
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: מִקְטֶרֶת
  choice: chetezo
  rationale: Ni chombo cha kufukizia uvumba katika ibada; “chetezo” ni neno fasaha na linaloeleweka katika muktadha huu.
- source_word: לְהַקְטִיר
  choice: ili afukize uvumba
  rationale: Infinitivu inaonyesha kusudi, na “kufukiza uvumba” linaeleza tendo la kiibada kwa Kiswahili cha kawaida.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: alipokuwa amewakasirikia makuhani
  rationale: Kirai kinaweka mazingira ya wakati na kuelekeza hasira yake kwa makuhani bila kuzidisha nguvu ya neno.
- source_word: הַצָּרַעַת
  choice: ugonjwa wa ngozi[a]
  rationale: צָרַעַת lina wigo mpana kuliko ugonjwa wa Hansen unaoitwa ukoma katika matumizi ya kisasa; tafsiri hii huepuka utambuzi wa kitabibu usiolazimishwa na maandishi.
- source_word: זָרְחָה
  choice: ukatokea ghafula
  rationale: Kitenzi kwa maana ya msingi ni “kungʼaa/kuchomoza,” lakini hapa kinaonyesha kujitokeza kwa wazi na kwa ghafla kwa ugonjwa kwenye paji la uso.
- source_word: בְמִצְחוֹ
  choice: kwenye paji la uso wake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali ugonjwa ulipoonekana.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: mbele ya makuhani
  rationale: Huhifadhi maana ya tukio kutokea katika uwepo na machoni pa makuhani.
- source_word: בְּבֵית יְהוָה
  choice: ndani ya nyumba ya Yahwe
  rationale: Huhifadhi taswira ya Kiebrania ya “nyumba” huku ikitambulisha mahali kuwa patakatifu pa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: kando ya madhabahu ya uvumba
  rationale: Muundo wa vihusishi umebanwa katika Kiebrania; “kando ya” huwasilisha kwa uwazi uhusiano wa mahali bila kudai kwa lazima kwamba tukio lilitoka kwenye madhabahu.
theological_decisions:
- issue: Maana ya צָרַעַת
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: Neno la Kiebrania linaweza kumaanisha hali mbalimbali nzito na zinazonajisi za ngozi, si lazima ugonjwa wa Hansen wa kisasa. Tanbihi inadumisha tafsiri ya jadi bila kuifanya kuwa utambuzi pekee.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, hivyo limetoholewa badala ya kubadilishwa kuwa cheo.
- issue: Uhusiano wa mahali katika מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: kando ya madhabahu ya uvumba
  alternative: kutoka kando ya madhabahu ya uvumba
  rationale: Kiebrania kimebanwa na kinaweza kueleweka kwa namna zaidi ya moja; tafsiri ya mahali ndiyo iliyo wazi zaidi bila kulazimisha wazo kwamba ugonjwa ulitoka madhabahuni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Chetezo,” “kufukiza uvumba,” na “madhabahu” huhifadhi muktadha wa ibada; sentensi imegawanywa baada ya tendo la hasira ili iwe ya asili na rahisi kusomeka.
