  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: sw
  text: Mungu akamsaidia dhidi ya Wafilisti, dhidi ya Waarabu walioishi katika Gur-Baali, na dhidi ya Wameuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wamaoni.” Huenda jina hili la kabila katika Kiebrania likarejelea kundi linalohusiana au jina mbadala la kundi hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: akamsaidia
  rationale: Kitenzi עזר chenye kiambishi cha nafsi ya tatu umoja wa kiume humaanisha kwamba Mungu alimsaidia Uzia; muundo wa “aka-” unaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Hapa neno hili ni jina la kawaida la Mungu wa Israeli katika simulizi; Kiswahili hakihitaji kutafsiri kibainishi cha Kiebrania kando.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha wa msaada wa kijeshi, kihusishi hiki kinaonyesha wale waliokuwa upande wa upinzani.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la watu.
- source_word: הערביים
  choice: Waarabu
  rationale: Jina hili la watu linarejelea makundi ya Uarabuni; “Waarabu” ni Kiswahili cha sasa, cha wazi na cha kawaida.
- source_word: הַיֹּשְׁבִים
  choice: walioishi
  rationale: Kauli hii ya kishirikishi ya ישב inaonyesha kukaa au kuishi mahali na hapa inawafafanua Waarabu.
- source_word: בְּגוּר בָּעַל
  choice: Gur-Baali
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa; wazo la kuishi “katika” mahali linaeleweka kiasili bila kuongeza kihusishi kabla ya jina hilo.
- source_word: הַמְּעוּנִים
  choice: Wameuni
  rationale: Utohozi huu unafuata umbo la konsonanti la Kiebrania מעונים; utambulisho kamili wa kundi hilo hauna uhakika, kwa hiyo uwezekano mwingine umehifadhiwa katika tanbihi.
