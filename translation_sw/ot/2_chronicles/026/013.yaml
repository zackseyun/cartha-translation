  yaml_path: translation/ot/2_chronicles/026/013.yaml
  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: sw
  text: Chini ya amri yao kulikuwa na jeshi la askari 307,500[a], wapiganaji wenye nguvu, ili kumsaidia mfalme dhidi ya adui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Chini ya mamlaka yao kulikuwa na jeshi, askari 307,500, wafanyao vita.” Matini kuu imetafsiri nahau za kijeshi za Kiebrania kwa Kiswahili cha kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Chini ya amri yao
  rationale: Nahau עַל יָדָם katika muktadha huu wa kijeshi inaonyesha usimamizi au mamlaka, si mkono halisi. ‘Chini ya amri yao’ ni Kiswahili cha kawaida na sahihi.
- source_word: חֵיל צָבָא
  choice: jeshi la askari
  rationale: Muungano huu wa maneno unamaanisha kikosi cha kijeshi. ‘Jeshi la askari’ unaweka wazi kwamba idadi inayofuata ni ya wapiganaji bila kuiga kwa ugumu muundo wa Kiebrania.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 307,500
  rationale: Hii ndiyo jumla ya moja kwa moja ya tarakimu za Kiebrania, iliyoandikwa kwa namna ya kisasa na rahisi kusoma.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: waliopigana vita
  rationale: Kwa karibu ni ‘wafanyao vita’; tafsiri hii inahifadhi tendo la kupigana bila kuongeza wazo lisilotajwa wazi la kupata mafunzo ya kijeshi.
- source_word: בְּכֹחַ חָיִל
  choice: kwa nguvu kubwa
  rationale: Maneno haya yanasisitiza nguvu na uwezo mkubwa wa kijeshi. ‘Kwa nguvu kubwa’ ni ya asili katika Kiswahili na haiingizi sifa ya ziada isiyotajwa.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: ili kumsaidia mfalme
  rationale: עזר humaanisha kusaidia; muundo wa kusudi umehifadhiwa kwa ‘ili kumsaidia.’
- source_word: עַל הָאוֹיֵב
  choice: dhidi ya adui
  rationale: Katika muktadha wa msaada wa kijeshi, עַל inaonyesha upinzani dhidi ya adui.
