translation:
  language: sw
  text: Alitenda maovu, kwa sababu hakuuelekeza moyo wake kumtafuta Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “hakuutayarisha moyo wake kumtafuta Yahwe.”'
    reason: Neno הֵכִין linaweza kumaanisha kuandaa, kuweka imara, au kuelekeza.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרָע
  choice: Akatenda yaliyo maovu
  rationale: Muundo huu unatoa tathmini ya kimaadili ya Kiebrania kwa Kiswahili cha kawaida, huku kiambishi cha simulizi katika וַיַּעַשׂ kikionyeshwa kwa “Aka-”.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa neno hili linaeleza sababu ya kutenda kwake maovu.
- source_word: לֹא הֵכִין לִבּוֹ
  choice: hakuwa ameuelekeza moyo wake
  rationale: Hiphil ya כון ina wazo la kuandaa, kuweka imara, au kuelekeza. “Kuuelekeza moyo” ni usemi wa asili unaoonyesha azimio la ndani bila kupoteza picha ya moyo.
- source_word: לִדְרוֹשׁ
  choice: kumtafuta
  rationale: דרשׁ inapomhusu Mungu humaanisha kumtafuta kwa kujielekeza kwake, ibada, au kutaka mwongozo wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa namna ya matamshi ya Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya kutouandaa moyo
  choice: hakuwa ameuelekeza moyo wake
  alternative: hakuwa ameutayarisha moyo wake
  rationale: Tafsiri iliyochaguliwa inahifadhi wazo la nia na azimio la ndani. Haidai kwamba tatizo lilikuwa hisia tu au ukosefu wa maarifa, na tanbihi inaweka wazi maana mbadala ya karibu zaidi na umbo la Kiebrania.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina la agano moja kwa moja; “Yahwe” hulitambulisha kama jina binafsi bila kuligeuza kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa msomaji wa kawaida. “Akatenda” hudumisha mwendelezo wa simulizi, na “moyo” huhifadhi taswira ya Kiebrania ya utu wa ndani, nia, na azimio.
