  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: sw
  text: Basi Mfalme Rehoboamu akatengeneza ngao za shaba mahali pa zile[a], akazikabidhi kwa wakuu wa walinzi[b] waliokuwa wakilinda lango la jumba la mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, badala ya ngao za dhahabu ambazo Shishaki alikuwa amechukua (tazama mstari uliotangulia).
    reason: cross_reference
  - marker: b
    text: 'Kiebrania: “wakimbiaji”; huenda ni walinzi wa mfalme au wajumbe waliotumikia pia kama walinzi wa jumba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה hapa kina maana ya kutengeneza au kufanya; “akatengeneza” ni cha kawaida na kinafaa kwa ngao.
- source_word: תַּחְתֵּיהֶם
  choice: mahali pa zile
  rationale: Kirai hiki kinaonyesha uingizwaji na kinarejelea ngao za dhahabu zilizochukuliwa katika mstari uliotangulia.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: ngao za shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha shaba au bronzi; “shaba” ni neno la kawaida la Kiswahili katika muktadha huu bila kuondoa uwezekano wa aloi ya bronzi.
- source_word: וְהִפְקִיד עַל יַד
  choice: akazikabidhi kwa
  rationale: Hifili ya פקד pamoja na עַל יַד inaonyesha kuweka kitu chini ya uangalizi au mamlaka ya mtu; “akazikabidhi kwa” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: שָׂרֵי
  choice: wakuu
  rationale: שָׂרֵי humaanisha viongozi au maofisa; “wakuu” linafaa kwa viongozi wa kikosi hiki bila kudai cheo maalumu zaidi.
- source_word: הָרָצִים
  choice: walinzi
  rationale: Kihalisi ni “wakimbiaji,” lakini katika mazingira ya kifalme neno hilo hutaja watumishi waliokuwa wakifanya kazi ya wajumbe na walinzi wa mfalme; maana halisi imehifadhiwa katika tanbihi.
- source_word: הַשֹּׁמְרִים
  choice: waliokuwa wakilinda
  rationale: Kauli-shirikishi inaonyesha wajibu wao wa kuendelea kulinda.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: lango la jumba la mfalme
  rationale: פֶּתַח ni mlango au lango, na בֵּית הַמֶּלֶךְ hapa ni makao ya kifalme; “jumba la mfalme” ni wazi na la asili.
