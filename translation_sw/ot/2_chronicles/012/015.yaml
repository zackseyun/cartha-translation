id: 2CH.12.15
reference: 2 Chronicles 12:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: sw
  text: Matendo ya Rehoboamu, ya kwanza na ya mwisho, je, hayakuandikwa katika kumbukumbu za Shemaya nabii na Ido mwonaji, kwa habari ya kuorodheshwa kwa nasaba?[a] Kulikuwa na vita kati ya Rehoboamu na Yeroboamu siku zao zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kumbukumbu za nasaba,” au “kwa ajili ya kuorodheshwa kwa nasaba.” Kirai cha Kiebrania ni kigumu na huenda kinaeleza namna au kusudi la habari za chanzo zinazohusishwa na Ido.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: Matendo ya Rehoboamu
  rationale: Katika muhtasari wa kifalme, דִבְרֵי humaanisha mambo au matendo ya utawala, si maneno yaliyosemwa tu. “Matendo” ni ya kawaida na yanafaa katika muktadha huu.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: ya kwanza na ya mwisho
  rationale: Huhifadhi muundo wa Kiebrania na kueleza matendo ya kipindi chote cha utawala bila kuongeza ufafanuzi usiotajwa.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Huhifadhi swali la balagha la fomula ya kutaja chanzo cha maandishi.
- source_word: בְּדִבְרֵי
  choice: katika kumbukumbu za
  rationale: Hapa neno hilo linahusu nyaraka au masimulizi yaliyoandikwa; “kumbukumbu” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַנָּבִיא
  choice: nabii
  rationale: Tafsiri ya kawaida ya נָבִיא.
- source_word: הַחֹזֶה
  choice: mwonaji
  rationale: Huhifadhi cheo tofauti cha kinabii kinachotumiwa katika Kiebrania, bila kukichanganya na “nabii.”
- source_word: לְהִתְיַחֵשׂ
  choice: kwa habari ya kuorodheshwa kwa nasaba
  rationale: Kitenzi kinahusu kuhesabiwa au kuandikishwa kwa nasaba. Kirai cha Kiebrania ni kigumu, hivyo tafsiri hii huhifadhi uhusiano huo bila kuamua kwa uhakika ikiwa inaeleza namna au kusudi la kumbukumbu.
- source_word: וּמִלְחֲמוֹת
  choice: Kulikuwa na vita
  rationale: Kiebrania kina kirai nomino, lakini Kiswahili huhitaji zaidi prediketa iliyo wazi; hii ni nyongeza ndogo ya kisarufi bila kubadili maana.
- source_word: כָּל הַיָּמִים
  choice: siku zao zote
  rationale: Huhifadhi nahau ya Kiebrania, ikimaanisha muda wote wa maisha au tawala zao katika muktadha huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na tofauti kati ya “nabii” na “mwonaji” zimehifadhiwa. Alama ya tanbihi imewekwa baada ya kirai kigumu kinachohusika moja kwa moja.
