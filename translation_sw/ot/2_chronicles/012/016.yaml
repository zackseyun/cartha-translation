base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: sw
  text: Rehoboamu akalala pamoja na mababu zake, akazikwa katika Mji wa Daudi.[a] Kisha Abiya mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akalala pamoja na mababu zake,” ni msemo wa kawaida unaomaanisha kwamba alikufa na kujiunga na ukoo wa waliomtangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: akalala pamoja na mababu zake
  rationale: Inahifadhi tamathali ya kawaida ya Kiebrania kuhusu kifo cha mfalme na kujiunga na ukoo wa waliomtangulia; sentensi inayofuata kuhusu kuzikwa inaweka maana wazi.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Kauli ya kutendwa inaakisi moja kwa moja umbo la Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: בְּעִיר דָּוִיד
  choice: katika Mji wa Daudi
  rationale: Ni jina la mahali linalotambulika katika Biblia; herufi kubwa zinaonyesha matumizi yake kama jina maalumu.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Huwasilisha kwa lugha ya kawaida tendo la kushika utawala wa kifalme katika taarifa ya urithi wa kiti cha enzi.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Hufuata umbo la jina la Kiebrania lililo katika aya hii, tofauti na umbo jingine Abiyamu linalopatikana kwingine.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya uhusiano wa kifamilia.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Huhifadhi kwa karibu nahau ya Kiebrania inayomaanisha kumrithi mtu katika utawala.
