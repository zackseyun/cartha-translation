base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: sw
  text: Kila mara mfalme alipoingia katika nyumba ya Yahweh, walinzi[a] walikuja na kuzibeba[b], kisha wakazirudisha katika chumba cha walinzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “wakimbiaji,” yaani walinzi wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: Kiambishi “-zi-” katika vitenzi hivi kinarejelea ngao za shaba zilizotajwa katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: kila mara ... alipoingia
  rationale: Nahau hii inaonyesha tukio lililorudiwa. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya ‘wakati wowote’.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Neno בַּיִת ni ‘nyumba’ na hapa ni jina la kawaida la hekalu; kutafsiri ‘nyumba’ kunahifadhi usemi wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi ‘Yahweh’.
- source_word: הָרָצִים
  choice: walinzi
  rationale: Ingawa maana ya msingi ni ‘wakimbiaji,’ katika mazingira ya kifalme neno hili linataja kikosi cha walinzi wa mfalme. ‘Walinzi’ huwasilisha kazi yao kwa uwazi.
- source_word: וּנְשָׂאוּם
  choice: kuzibeba
  rationale: Kiambishi cha ngeli ‘-zi-’ kinarejelea ngao za shaba zilizotajwa katika mstari uliotangulia; ‘kubeba’ linaonyesha kuzipeleka kwa matumizi ya sherehe.
- source_word: וֶהֱשִׁיבוּם
  choice: wakazirudisha
  rationale: Hifili ya שׁוב hapa ina maana ya kusababisha vitu virudi mahali vilipohifadhiwa. ‘Wakazirudisha’ ni sahihi na ya kawaida.
- source_word: תָּא
  choice: chumba
  rationale: Neno hili linamaanisha chumba au sehemu ndogo iliyofungwa. ‘Chumba cha walinzi’ kinahifadhi muundo na maana ya kirai cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano, יְהוָה. ‘Yahweh’ hulitambulisha kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi, huku usemi ‘nyumba ya Yahweh’ ukihifadhi taswira ya Kiebrania. Viambishi vya ngeli katika ‘kuzibeba’ na ‘wakazirudisha’ vinaonyesha wazi kwamba kinachorejelewa ni ngao.
