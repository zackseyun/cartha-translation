  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: sw
  text: Ndipo viongozi wa Israeli[a] na mfalme wakajinyenyekeza, wakasema, “Yahwe ni mwenye haki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “viongozi wa Israeli.” Katika muktadha huu, wengine huelewa maneno haya kuwa yanawahusu hasa viongozi wa Yuda chini ya Rehoboamu, lakini andiko lenyewe linasema “Israeli.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: wakajinyenyekeza
  rationale: Kitenzi hiki katika kauli ya Nifali kinaonyesha kwamba waliitikia onyo la kinabii kwa kujishusha na kukubali kuwa chini ya hukumu ya Mungu. ‘Wakajinyenyekeza’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kujishusha kwa hiari.
- source_word: שָׂרֵי
  choice: viongozi
  rationale: Neno hili linaweza kumaanisha wakuu, maafisa, au watawala. ‘Viongozi’ linaeleweka kwa urahisi katika Kiswahili cha sasa na linafaa kwa watu wenye mamlaka katika muktadha huu.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanasema wazi ‘Israeli.’ Ingawa muktadha wa kihistoria unahusu utawala wa Rehoboamu katika Yuda, tafsiri haibadilishi jina hilo ili kulinganisha simulizi kwa njia ya kimafafanuzi.
- source_word: וְהַמֶּלֶךְ
  choice: na mfalme
  rationale: Hii inatafsiri kirai kilichounganishwa moja kwa moja na kuonyesha kwamba mfalme ametajwa pamoja na viongozi lakini anatofautishwa nao.
- source_word: וַיֹּאמְרוּ
  choice: wakasema
  rationale: Umbo hili linaendeleza mfuatano wa simulizi. Kiambishi cha nafsi katika ‘wakasema’ kinaonyesha wazi kwamba viongozi na mfalme ndio waliosema.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Katika kauli hii neno linaeleza uadilifu wa Yahwe, hasa kuwa hukumu yake ni ya haki. ‘Mwenye haki’ huhifadhi uzito wa kimaadili na wa kiagano bila kuifanya kauli kuwa maelezo marefu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’ Hili ndilo umbo la kawaida la Kiswahili la jina hilo.
theological_decisions:
- issue: Kuhifadhi jina la Mungu au kulibadilisha kuwa cheo
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina יהוה moja kwa moja. ‘Yahwe’ huhifadhi jina binafsi la Mungu badala ya kuliwakilisha kwa cheo.
- issue: Iwapo ‘Israeli’ ibadilishwe kuwa ‘Yuda’ kwa sababu ya muktadha wa kihistoria
  choice: Israeli
  alternative: Yuda
  rationale: Maandishi ya Kiebrania yanasema ‘Israeli.’ Kutumia ‘Yuda’ kungeondoa mvutano uliomo katika andiko na kuingiza ufafanuzi ndani ya tafsiri.
- issue: Maana ya צַדִּיק katika kukiri hukumu ya Mungu
  choice: mwenye haki
  alternative: ni wa haki; yuko sahihi
  rationale: Kauli hiyo inakiri uadilifu wa Yahwe katika hukumu. ‘Mwenye haki’ huhifadhi maana pana ya kimaadili na ya kiagano, badala ya kuifanya kuwa madai finyu kwamba tu yuko sahihi katika tukio hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. ‘Ndipo’ na vitenzi vya mfululizo ‘wakajinyenyekeza, wakasema’ vinawasilisha mwendelezo wa simulizi kwa kawaida. Alama ya tanbihi imewekwa baada ya ‘Israeli,’ ambako suala linalofafanuliwa linatokea.
