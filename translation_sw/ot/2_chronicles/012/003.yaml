base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: sw
  text: akiwa na magari ya vita 1,200 na wapanda farasi 60,000; nao watu waliokuja pamoja naye kutoka Misri hawakuhesabika[a]—Walibya, Wasuki[b], na Wakushi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, idadi yao haikuhesabika; tafsiri ya neno kwa neno ni, “hapakuwa na hesabu ya watu.”
    reason: lexical_alternative
  - marker: b
    text: “Wasuki” ni jina la kundi la watu ambalo utambulisho wake kamili haujulikani kwa hakika; pia linaweza kunakiliwa “Wasukiyim.”
    reason: cultural_note
  - marker: c
    text: Au “Waethiopia”; hata hivyo, “Wakushi” linaakisi kwa usahihi zaidi jina la Kiebrania la watu na eneo la Kushi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: akiwa na magari ya vita 1,200
  rationale: Kiambishi בְּ katika orodha hii ya kijeshi kinaonyesha vikosi alivyokuwa navyo. Neno רֶכֶב hapa linamaanisha magari ya kukokotwa yaliyotumiwa vitani; ‘magari ya vita’ ni wazi na la kawaida katika Kiswahili.
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: na wapanda farasi 60,000
  rationale: פָּרָשִׁים humaanisha askari waliopanda farasi. ‘Wapanda farasi’ linaeleweka kwa urahisi na haliongezi maelezo yasiyokuwamo katika Kiebrania.
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: nao watu ... hawakuwa na hesabu
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania, yaani kwamba umati huo haukuweza kuhesabika, huku עָם likitafsiriwa kwa maana yake ya msingi ‘watu’ badala ya kulifanya moja kwa moja kuwa ‘jeshi.’
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: waliokuja pamoja naye kutoka Misri
  rationale: Hii inawasilisha kwa njia ya kawaida uhusiano wa watu hao na Shishaki pamoja na mahali walikotoka.
- source_word: לוּבִים
  choice: Walibya
  rationale: Jina hili la kabila kwa kawaida linahusishwa na watu wa Libya; ‘Walibya’ ni jina linalotambulika katika Kiswahili sanifu.
- source_word: סֻכִּיִּים
  choice: Wasuki
  rationale: Utambulisho kamili wa kundi hili haujulikani. ‘Wasuki’ linanakili jina la Kiebrania bila kudai utambulisho maalumu usio na uhakika.
- source_word: כּוּשִׁים
  choice: Wakushi
  rationale: ‘Wakushi’ linadumisha jina la kihistoria na kijiografia Kushi badala ya kulilinganisha moja kwa moja na Waethiopia wa maana ya kisasa.
