  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: sw
  text: Ikawa, ufalme wa Rehoboamu ulipoimarishwa, naye alipoimarika, aliiacha sheria ya Yahwe[a]—na Israeli yote pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafundisho ya Yahwe.” Neno la Kiebrania torah linaweza kumaanisha “sheria” au “mafundisho,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: Ikawa, ... ulipokuwa umeimarika
  rationale: Muundo huu unaweka mazingira ya wakati ya simulizi kwa Kiswahili cha kawaida; כון hapa inaonyesha utawala uliokuwa umethibitika na kuimarika.
- source_word: מַלְכוּת רְחַבְעָם
  choice: ufalme wa Rehoboamu
  rationale: “Ufalme” kwa kawaida huweza kumaanisha eneo na utawala wa mfalme; jina limetoholewa kwa umbo linalotumika sana katika Biblia za Kiswahili.
- source_word: וּכְחֶזְקָתוֹ
  choice: naye alipokuwa amepata nguvu
  rationale: Kifungu kinaonyesha hali ya Rehoboamu baada ya kupata nguvu au uthabiti; “amepata nguvu” ni cha asili na hakifafanui kupita kiasi ikiwa nguvu hizo zilikuwa za kijeshi, kisiasa, au usalama.
- source_word: עָזַב
  choice: aliiacha
  rationale: “Aliiacha” ni lugha ya sasa na yenye uzito unaofaa kwa kuacha uaminifu kwa maagizo ya Mungu, bila kutumia neno la kizamani.
- source_word: תּוֹרַת יְהוָה
  choice: sheria ya Yahwe
  rationale: Katika muktadha huu wa agano na historia, “sheria” ni tafsiri inayoeleweka vizuri ya תּוֹרָה, huku tanbihi ikihifadhi maana mbadala ya “mafundisho.” Jina la Mungu limetafsiriwa “Yahwe.”
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: —na Israeli yote pamoja naye
  rationale: Muundo mfupi unadumisha msisitizo wa Kiebrania kwamba Israeli ilishiriki naye katika kuiacha sheria, bila kubadili “Israeli” kuwa “Yuda.”
theological_decisions:
- issue: Maana ya “Israeli yote” baada ya ufalme kugawanyika
  choice: Israeli yote
  alternative: Yuda yote; watu wake wote
  rationale: Nyakati inaweza kutumia “Israeli” kwa watu wa agano waliohusishwa na ufalme wa Rehoboamu. Tafsiri inadumisha neno la Kiebrania na kutatua kwa lazima upeo wake wa kihistoria.
- issue: Upeo wa maana ya תּוֹרָה
  choice: sheria
  alternative: mafundisho; Torati
  rationale: “Sheria” inafaa katika muktadha wa uasi wa agano, lakini tanbihi inahifadhi uwezekano halisi wa maana pana ya “mafundisho.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa wakati umewekwa wazi bila kuwa wa kikale; kishazi cha mwisho kimeachwa kifupi ili kuhifadhi nguvu ya matini ya Kiebrania.
