base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his servants[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: sw
  text: Kwa maana watakuwa watumwa wake, ili wajue kunitumikia mimi[a] na kutumikia falme za nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwabudu mimi ... na kutumikia falme za nchi.” Neno la Kiebrania lililotafsiriwa “kunitumikia” na “kutumikia” linaweza kumaanisha pia ibada, utumishi, kazi, au hali ya kutumikishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya hatua ya Mungu iliyotajwa katika muktadha uliotangulia.
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: watakuwa watumwa wake
  rationale: Muundo wa Kiebrania unaonyesha kuingia katika hali hiyo. Katika muktadha huu עֲבָדִים inahusu kutiishwa chini ya Shishaki, hivyo “watumwa” huonyesha uzito wa utumwa wa kisiasa kuliko “watumishi.”
- source_word: וְיֵדְעוּ
  choice: ili wajue
  rationale: Kitenzi hiki kinaweza kuonyesha kusudi au matokeo katika muktadha huu; “wajue” huhifadhi maana ya msingi ya ידע pamoja na wazo la kujifunza kwa uzoefu.
- source_word: עֲבוֹדָתִי
  choice: kunitumikia mimi
  rationale: עֲבוֹדָה inaweza kumaanisha utumishi, kazi, au ibada. Muundo wa kitenzi ni wa kawaida zaidi katika Kiswahili na bado unaruhusu maana pana ya kumtumikia Mungu, ikiwemo ibada na utii.
- source_word: וַעֲבוֹדַת
  choice: na kuzitumikia
  rationale: Kurudia kitenzi “kutumikia” kunahifadhi ulinganifu wa kimakusudi kati ya kumtumikia Mungu na kuzitumikia falme za kigeni.
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: falme za nchi mbalimbali
  rationale: Huhifadhi wingi na maana ya kisiasa ya tawala nyingi za kigeni; “mbalimbali” hufanya wingi wa nchi usikike kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Iwapo עֲבוֹדָה inayomhusu Mungu itafsiriwe kwa maana maalumu ya “ibada” au kwa maana pana ya “kutumikia”
  choice: kunitumikia mimi
  alternative: ibada yangu
  rationale: Aya inalinganisha utii kwa BWANA na kutiishwa chini ya falme za kidunia. “Kunitumikia” huhifadhi maana za ibada, utii, na uaminifu bila kuibana istilahi hiyo kwenye ibada ya kidini pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. “Watumwa” limetumiwa kwa sababu muktadha ni kutiishwa kisiasa, huku urudiaji wa “kutumikia” ukihifadhi mchezo wa kimakusudi wa neno la Kiebrania.
