id: 2CH.12.9
reference: 2 Chronicles 12:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: sw
  text: Basi Shishaki, mfalme wa Misri, akapanda kuishambulia Yerusalemu. Akatwaa hazina za nyumba ya Yahwe[a] na hazina za nyumba ya mfalme[b]. Alitwaa kila kitu; pia akatwaa ngao za dhahabu ambazo Sulemani alikuwa ametengeneza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Yahwe.”
    reason: Neno בַּיִת kwa maana ya msingi ni 'nyumba,' lakini usemi huu hapa unalitaja hekalu.
  - marker: b
    text: Au, “ikulu ya mfalme.”
    reason: Usemi wa Kiebrania ni 'nyumba ya mfalme,' ambao katika muktadha huu unamaanisha ikulu.
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: akapanda kuishambulia Yerusalemu
  rationale: Kitenzi עלה pamoja na עַל katika muktadha wa kijeshi humaanisha kupanda au kusonga dhidi ya mji. Tafsiri hii inadumisha wazo la kupanda huku ikieleza wazi kusudi la kijeshi kwa Kiswahili cha kawaida.
- source_word: שִׁישַׁק
  choice: Shishaki
  rationale: Jina limetoholewa kwa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Hii inawakilisha moja kwa moja cheo cha Shishaki na nchi aliyotawala.
- source_word: אֹצְרוֹת
  choice: hazina
  rationale: Neno linaweza kumaanisha mali zilizohifadhiwa au mahali pa kuzihifadhi. 'Hazina' inadumisha upana huo wa maana kwa Kiswahili na inafaa kwa mali za hekalu na ikulu zilizotekwa.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri hii inadumisha kwa karibu usemi wa Kiebrania na ulinganifu wake na 'nyumba ya mfalme'; hapa inarejelea hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa Tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Inadumisha muundo halisi na ulinganifu wa kifasihi na 'nyumba ya Yahwe'; kimuktadha ni ikulu.
- source_word: אֶת־הַכֹּל לָקָח
  choice: Alitwaa kila kitu
  rationale: Kishazi hiki cha kurejelea jumla ya nyara kinasisitiza ukamilifu wa alichotwaa; Kiswahili hiki ni wazi na cha asili.
- source_word: מָגִנֵּי הַזָּהָב
  choice: ngao za dhahabu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya ngao zilizotengenezwa kwa dhahabu.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: ambazo Sulemani alikuwa ametengeneza
  rationale: Wakati timilifu unaonyesha kwamba Sulemani alizitengeneza kabla ya Shishaki kuzitwaa.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. 'Yahwe' linahifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Ulinganifu wa 'nyumba ya Yahwe' na 'nyumba ya mfalme' umehifadhiwa; maelezo ya maana za kimuktadha yametolewa katika tanbihi. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
