source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: sw
  text: Basi Mfalme Rehoboamu akajiimarisha huko Yerusalemu, akatawala.[a] Rehoboamu alikuwa na umri wa miaka arobaini na mmoja alipoanza kutawala, naye akatawala miaka kumi na saba huko Yerusalemu, mji ambao Yahwe alikuwa ameuchagua kutoka miongoni mwa makabila yote ya Israeli ili aweke jina lake humo. Mama yake aliitwa Naama, Mwamoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akathibitika huko Yerusalemu, akatawala.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa na nguvu au kuthibitika imara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: akajiimarisha
  rationale: Kitenzi hiki katika hitpaeli kina maana ya kujifanya imara au kujiimarisha. Katika muktadha huu kinaonyesha Rehoboamu akiimarisha mamlaka yake, si nguvu za mwili tu.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Huhifadhi mwendelezo wa simulizi bila kuongeza kwamba ndipo hasa alianza kutawala.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo wenye ב na kitenzi-jina unaonyesha wakati wa kuingia madarakani; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina binafsi la Mungu, YHWH, badala ya kulibadilisha kuwa cheo kama “BWANA”.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: ili aliweke jina lake humo
  rationale: Huhifadhi usemi halisi wa agano na hekalu bila kuufafanua kimadhehebu kuwa uwepo au kukaa kwa Mungu.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa makabila yote ya Israeli
  rationale: מן inaonyesha kuchaguliwa kwa mji kutoka katika jamii nzima ya makabila ya Israeli.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Ni Kiswahili cha kawaida na cha heshima kinachowasilisha kwa usahihi taarifa ya jina la mama yake.
- source_word: הָעַמֹּנִית
  choice: mwanamke Mwamoni
  rationale: Kivumishi cha Kiebrania ni cha kike na kinataja asili ya Naama; “mwanamke Mwamoni” ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na kufuata tahajia ya kawaida ya Kiswahili.
- issue: Usemi wa kuchaguliwa kwa Yerusalemu ‘ili aliweke jina lake humo’
  choice: Kudumisha usemi halisi kuhusu kuweka jina
  alternative: ili athibitishe uwepo wake humo; ili jina lake likae humo
  rationale: Tafsiri haipanui usemi huu kuwa fundisho maalumu kuhusu namna ya uwepo au kukaa kwa Mungu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Rehoboamu, Yerusalemu, Israeli, Naama na Yahwe.'
