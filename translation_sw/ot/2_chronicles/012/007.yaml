  text: וּ/בִ/רְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר יְהוָ֨ה אֶל שְׁמַֽעְיָ֧ה לֵ/אמֹ֛ר נִכְנְע֖וּ לֹ֣א אַשְׁחִיתֵ֑/ם וְ/נָתַתִּ֨י לָ/הֶ֤ם כִּ/מְעַט֙ לִ/פְלֵיטָ֔ה וְ/לֹא תִתַּ֧ךְ חֲמָתִ֛/י בִּ/ירוּשָׁלִַ֖ם בְּ/יַד שִׁישָֽׁק־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: sw
  text: Yahweh alipoona kwamba wamejinyenyekeza, neno la Yahweh likamjia Shemaya, likisema, “Wamejinyenyekeza; sitawaangamiza, bali nitawapa wokovu kidogo[a], na ghadhabu yangu haitamwagwa juu ya Yerusalemu kwa mkono wa Shishaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitawapa kuponyoka kidogo” au “nitawaachia waokokaji wachache.” Kirai cha Kiebrania ni kifupi na huenda kikasisitiza uokozi wenye mipaka badala ya kuangamizwa kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִרְאוֹת
  choice: alipoona
  rationale: Muundo wa ב pamoja na kitenzi-jina cha ראה unaanzisha kishazi cha wakati. ‘Alipoona’ ni Kiswahili cha kawaida kinachohifadhi mpangilio wa matukio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limeandikwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: נִכְנָעוּ
  choice: wamejinyenyekeza
  rationale: Niphal ya כנע katika muktadha huu inaonyesha kujishusha au kujitiisha kwao wenyewe baada ya onyo la kinabii.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: neno la Yahweh likamjia
  rationale: Huu ni msemo wa kawaida wa kinabii; ‘likamjia’ huhifadhi taswira ya neno kumfikia nabii na ni ya asili katika Kiswahili.
- source_word: לֹא אַשְׁחִיתֵם
  choice: sitawaangamiza
  rationale: Hiphil ya שׁחת hapa humaanisha kuharibu au kuangamiza katika muktadha wa hukumu.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: bali nitawapa nafuu kidogo
  rationale: Kirai cha Kiebrania ni kifupi na kinaweza kumaanisha kuponyoka, ukombozi wa kiasi, au kuachwa kwa waokokaji. ‘Nafuu kidogo’ ni ya asili na inaonyesha kwamba hukumu imepunguzwa lakini haijaondolewa kabisa.
- source_word: תִתַּךְ חֲמָתִי
  choice: ghadhabu yangu haitamwagwa
  rationale: Taswira halisi ya kumwaga ghadhabu imehifadhiwa kwa lugha inayoeleweka na yenye hadhi.
- source_word: בִּירוּשָׁלַם
  choice: juu ya Yerusalemu
  rationale: Ingawa kihusishi cha Kiebrania ni ב, katika msemo wa kumwaga ghadhabu Yerusalemu ndiye mlengwa, hivyo ‘juu ya’ ni ya asili.
- source_word: בְּיַד שִׁישָׁק
  choice: kwa mkono wa Shishaki
  rationale: Msemo wa Kiebrania unaonyesha chombo au wakala wa hukumu; tafsiri hii huhifadhi taswira hiyo na bado inaeleweka katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo; unukuzi ‘Yahweh’ unalihifadhi bila kulibadilisha kuwa cheo.
- issue: Kiwango cha uokozi katika כִּמְעַט לִפְלֵיטָה
  choice: nafuu kidogo
  alternative: kuokoka kidogo au waokokaji wachache
  rationale: Maandishi yanaacha wazi ikiwa msisitizo ni uokozi wenye mipaka au idadi ndogo ya waokokaji. Tafsiri kuu hudumisha wazo la kupunguzwa kwa hukumu, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo ya kinabii na taswira ya ‘kumwaga ghadhabu’ imehifadhiwa bila kufanya sentensi iwe nzito; utata halisi wa פְלֵיטָה umeonyeshwa katika tanbihi.
