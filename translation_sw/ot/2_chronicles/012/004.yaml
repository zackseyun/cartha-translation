  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: sw
  text: Akateka miji ya Yuda yenye ngome, akafika mpaka Yerusalemu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasonga mbele mpaka Yerusalemu.” Kiebrania kinasema kihalisi “akafika mpaka Yerusalemu,” kikisisitiza kwamba baada ya kuteka miji ya Yuda yenye ngome, alifika hadi Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: Akateka
  rationale: Kitenzi לכד katika muktadha wa vita humaanisha kutwaa au kuteka; “kuteka” ni Kiswahili cha kawaida na huhifadhi maana ya kijeshi.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: miji yenye ngome
  rationale: Kirai hiki hutaja miji iliyoimarishwa kwa ulinzi. “Miji yenye ngome” ni wazi na sahihi kuliko “ngome” pekee, kwa kuwa עָרֵי hutaja miji.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: iliyokuwa ya Yuda
  rationale: ל hapa huonyesha umilikaji au uhusiano wa kisiasa; “ya Yuda” huhifadhi hilo bila kuifanya maana kuwa ya kijiografia tu.
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: akafika mpaka Yerusalemu
  rationale: בוא pamoja na עַד huonyesha kufika hadi kikomo fulani. “Akafika mpaka Yerusalemu” hahitimishi kwamba aliingia au aliuteka mji.
