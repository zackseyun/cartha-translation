  text: וַ/יְהִ֞י בַּ/שָּׁנָ֤ה הַֽ/חֲמִישִׁית֙ לַ/מֶּ֣לֶךְ רְחַבְעָ֔ם עָלָ֛ה שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָ֑ם כִּ֥י מָעֲל֖וּ בַּ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: sw
  text: Ikawa katika mwaka wa tano wa Mfalme Rehoboamu, Shishaki mfalme wa Misri akaja dhidi ya Yerusalemu, kwa sababu walikuwa wamekosa uaminifu kwa BWANA.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wamevunja uaminifu kwa BWANA,” au “walikuwa wamemsaliti BWANA.” Kitenzi cha Kiebrania kina maana ya kuvunja uaminifu, hasa uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni utangulizi wa kawaida wa masimulizi unaoendeleza mtiririko wa habari bila tafsiri ngumu ya neno kwa neno.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: katika mwaka wa tano wa Mfalme Rehoboamu
  rationale: Hii ni namna ya kawaida na ya wazi ya Kiswahili ya kutaja mwaka wa utawala wa mfalme.
- source_word: עָלָה ... עַל
  choice: akaja kuishambulia
  rationale: Katika muktadha wa kijeshi, muundo huu unaonyesha kusonga dhidi ya mahali kwa nia ya uadui. 'Kuishambulia' ni Kiswahili cha asili, ingawa kinasema wazi zaidi maana inayodokezwa na nahau ya Kiebrania.
- source_word: שִׁישַׁק
  choice: Shishaki
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: mfalme wa Misri
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hapa kinatoa sababu ya uvamizi katika maelezo ya kitheolojia ya mwandishi.
- source_word: מָעֲלוּ
  choice: walikuwa wametenda kwa kukosa uaminifu
  rationale: Kitenzi kina maana ya kuvunja uaminifu au wajibu wa agano; uchaguzi huu unahifadhi wazo la tendo la usaliti wa uhusiano.
- source_word: בַּיהוָה
  choice: kwa YAHWEH
  rationale: Kiambishi ב pamoja na מעל humtaja yule ambaye uaminifu kwake umevunjwa. Jina la agano limewasilishwa kama YAHWEH.
theological_decisions:
- issue: Uvamizi kuelezwa kuwa matokeo ya kuvunjwa kwa uaminifu kwa agano
  choice: kwa sababu walikuwa wametenda kwa kukosa uaminifu kwa YAHWEH
  alternative: kwa sababu walikuwa wamemkosea YAHWEH / walikuwa wamevunja uaminifu kwa YAHWEH
  rationale: Tafsiri inahifadhi wazi uhusiano wa kisababishi ambao mwandishi anaweka kati ya uvamizi na kutokuwa waaminifu kwa YAHWEH, bila kuugeuza kuwa maelezo ya kisiasa pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ikawa' huhifadhi mtindo wa kisimulizi wa maandiko; 'akaja kuishambulia' huwasilisha kwa uwazi nahau ya kijeshi. Alama ya tanbihi [a] imewekwa katika matini kuu.
