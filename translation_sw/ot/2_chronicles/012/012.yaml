base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: sw
  text: Alipojinyenyekeza, hasira ya Yahweh ikamwacha, ili Yahweh asimwangamize kabisa; na pia katika Yuda kulikuwa na mambo mema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mambo mema.” Usemi huu ni mpana na unaweza kurejelea hali, matendo, au mambo mengine yenye kusifiwa katika Yuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: Alipojinyenyekeza
  rationale: Kiambishi בְּ pamoja na kitenzi-jina kina maana ya wakati, ‘alipo/wakati alipo.’ Muundo wa hitpaeli wa כנע hapa unaonyesha kwamba Rehoboamu alijinyenyekeza mwenyewe.
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: hasira ya Yahweh ikamwondokea
  rationale: אַף ina maana ya ‘hasira’ katika nahau hii, na שׁוב pamoja na מִן huonyesha hasira ikigeuka na kuondoka kwake. ‘Ikamwondokea’ ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo bila kufasiri zaidi kuwa Yahweh ‘alighairi.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: ili asimwangamize kabisa
  rationale: Kikanushi pamoja na kitenzi-jina kinaonyesha kusudi au matokeo ya kuondoka kwa hasira. לְכָלָה hukazia uangamizi kamili; kiwakilishi cha yambwa kinamrejelea Rehoboamu katika muktadha.
- source_word: וְגַם בִּיהוּדָה
  choice: tena, katika Yuda
  rationale: וְגַם huongeza hoja nyingine, na בִּיהוּדָה ni usemi wa mahali.
- source_word: הָיָה דְּבָרִים טוֹבִים
  choice: kulikuwa na mambo mema
  rationale: דְּבָרִים ni neno pana linaloweza kumaanisha mambo, hali, au matendo. ‘Mambo mema’ huhifadhi upana huo bila kuubana kuwa maadili, ustawi, au matendo fulani pekee.
theological_decisions:
- issue: Kuwasilisha hukumu na rehema ya Mungu bila kupunguza mojawapo
  choice: hasira ya Yahweh ikamwondokea, ili asimwangamize kabisa
  alternative: Yahweh akaghairi, wala hakumwangamiza kabisa
  rationale: Kauli iliyochaguliwa inahifadhi ukweli wa hasira ya Mungu na kupunguzwa kwa hukumu baada ya Rehoboamu kujinyenyekeza, bila kudokeza kwamba matokeo yote ya hukumu yaliondolewa.
- issue: Upeo wa ‘mambo mema’ katika Yuda
  choice: katika Yuda kulikuwa na mambo mema
  alternative: hali katika Yuda ilikuwa nzuri
  rationale: Kiebrania hakibainishi ikiwa hayo yalikuwa matendo mazuri, hali nzuri, au mambo mengine yenye kusifiwa; tafsiri inadumisha utata huo halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida; ‘ikamwondokea’ huhifadhi picha ya hasira kugeuka kutoka kwa Rehoboamu, na ‘mambo mema’ huhifadhi upana wa Kiebrania.
