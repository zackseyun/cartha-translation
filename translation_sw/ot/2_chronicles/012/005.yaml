id: 2CH.12.5
reference: 2 Chronicles 12:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: sw
  text: 'Ndipo nabii Shemaya akaja kwa Rehoboamu na maofisa wa Yuda waliokuwa wamekusanyika Yerusalemu kwa sababu ya Shishaki[a]. Akawaambia, “Yahweh asema hivi: ‘Ninyi mmeniacha, kwa hiyo mimi pia nimewaacha mikononi mwa Shishaki.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mbele ya Shishaki,” yaani, kwa sababu ya Shishaki au kwa kumwogopa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַעְיָה הַנָּבִיא
  choice: Ndipo nabii Shemaya
  rationale: Kiunganishi kinaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida. Jina na cheo vimetolewa kwa mpangilio wa asili wa Kiswahili.
- source_word: בָּא אֶל רְחַבְעָם
  choice: akaja kwa Rehoboamu
  rationale: בוא אל inaonyesha kufika alikokuwa Rehoboamu; “akaja kwa” ni usemi wa kawaida unaodumisha mtazamo wa simulizi.
- source_word: וְשָׂרֵי יְהוּדָה
  choice: na maofisa wa Yuda
  rationale: שׂרים hapa ni viongozi wenye mamlaka ya kisiasa; “maofisa” huepuka maana finyu ya wana wa kifalme.
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: waliokuwa wamekusanyika Yerusalemu
  rationale: Niphal inaeleza kukusanyika kwao, na Kiswahili hutumia mahali pa matokeo “Yerusalemu” kwa ufasaha.
- source_word: מִפְּנֵי שִׁישָׁק
  choice: kwa sababu ya Shishaki[a]
  rationale: Kirai hicho kihalisi ni “kutoka mbele ya Shishaki,” lakini katika muktadha kinaonyesha kwamba uvamizi au tishio lake ndilo lililosababisha wakusanyike; tanbihi inadumisha taswira na uwezekano wa hofu.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Hii ni fomula ya kawaida ya ujumbe wa kinabii, na jina la agano יְהוָה limetoholewa kuwa “Yahweh.”
- source_word: עֲזַבְתֶּם אֹתִי
  choice: Ninyi mmeniacha
  rationale: עָזַב hubeba maana ya kuacha au kutelekeza, hasa katika uhusiano wa agano. “Mmeniacha” ni ya sasa, ya heshima, na inaeleweka kwa urahisi.
- source_word: וְאַף אֲנִי עָזַבְתִּי אֶתְכֶם
  choice: kwa hiyo mimi pia nimewaacha
  rationale: “Kwa hiyo ... pia” huonyesha mwitikio unaolingana na tendo lao, huku kitenzi kilekile “acha” kikihifadhi ulinganifu wa balagha.
- source_word: בְּיַד שִׁישָׁק
  choice: mikononi mwa Shishaki
  rationale: Nahau ya “mkono” inaonyesha kutiwa chini ya mamlaka au uwezo wa mtu; wingi wa kinahau “mikononi mwa” ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la pekee la Mungu, si cheo tu. “Yahweh” hulihifadhi kama jina la agano bila kulibadilisha kuwa cheo.
- issue: Ulinganifu wa hukumu katika עזב
  choice: “mmeniacha ... nimewaacha”
  alternative: “mmenitelekeza ... nimewatia chini ya mamlaka”
  rationale: Kutumia kitenzi kilekile mara zote mbili kunahifadhi ulinganifu wa kauli ya hukumu, bila kuficha uzito wa Mungu kuwaacha chini ya mamlaka ya Shishaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa ili hotuba ya kinabii isomeke kwa urahisi; taswira ya “mkono” imehifadhiwa katika nahau asilia ya Kiswahili “mikononi mwa.”
