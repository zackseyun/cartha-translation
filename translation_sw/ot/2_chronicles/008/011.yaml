  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: sw
  text: Naye Sulemani akampandisha binti ya Farao kutoka Jiji la Daudi hadi kwenye nyumba aliyomjengea, kwa maana alisema, “Mke wangu hataishi katika nyumba ya Daudi, mfalme wa Israeli, kwa sababu maeneo ambamo sanduku la Yahweh limefika ni matakatifu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “kwa sababu wao ni watakatifu, ambao sanduku la Yahweh limewafikia.” Kirejelewa cha wingi hakijatajwa wazi; huenda kinamaanisha maeneo yaliyohusishwa na nyumba ya Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלָה
  choice: akampandisha
  rationale: Hifili ya עלה ina maana ya kumpeleka au kumpandisha juu; “akampandisha” huhifadhi mwelekeo wa mwendo kwa Kiswahili cha kawaida.
- source_word: מֵעִיר דָּוִיד
  choice: kutoka Jiji la Daudi
  rationale: Ni usemi wa moja kwa moja wa kijiografia; herufi kubwa inalitambulisha kama jina maalumu la eneo.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: mpaka katika nyumba aliyokuwa amemjengea
  rationale: בַּיִת limetafsiriwa “nyumba” badala ya kufafanuliwa kuwa “ikulu”; wakati wa kitendo unaonyesha nyumba ilikuwa imekwisha kujengwa kwa ajili yake.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: Mke wangu hataishi
  rationale: Katika muktadha huu אִשָּׁה ni “mke,” na ישׁב inaeleza kuishi au kukaa mahali. Tafsiri hii ni ya kawaida bila kupanua kauli kuwa inawahusu wanawake wote.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: katika nyumba ya Daudi, mfalme wa Israeli
  rationale: “Nyumba” huhifadhi maana ya msingi ya בַּיִת, huku apposition ya “mfalme wa Israeli” ikionyeshwa wazi kwa koma.
- source_word: קֹדֶשׁ הֵמָּה
  choice: ni patakatifu
  rationale: Kiswahili hutumia ngeli inayolingana na nomino iliyodokezwa “mahali.” Dhana kuu ya utakatifu imehifadhiwa.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: mahali ambapo sanduku la Yahweh limefika
  rationale: Kiebrania kina viwakilishi vya wingi bila kutaja wazi nomino inayorejelewa. Kiswahili “mahali” linaweza kurejelea eneo moja au maeneo kwa ujumla na huepuka kulazimisha ufafanuzi usio wazi katika matini; tanbihi inaeleza umbo la Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Kirejelewa kisichotajwa cha viwakilishi vya wingi katika sababu ya utakatifu
  choice: “mahali ambapo ... ni patakatifu,” huku wingi wa Kiebrania ukielezwa katika tanbihi
  alternative: “maeneo ambayo ... ni matakatifu” au tafsiri halisi yenye muundo usio wa kawaida
  rationale: Matini inasema kihalisi kwamba “wao” ni watakatifu na sanduku liliwafikia, lakini haitaji nomino ya wingi. “Mahali” ni ya asili na inaweza kubeba urejeleaji wa eneo au maeneo bila kuficha tatizo la kisarufi, ambalo limewekwa wazi katika tanbihi.
- issue: Maana ya אִשָּׁה katika kauli ya Sulemani
  choice: mke
  alternative: mwanamke
  rationale: Muktadha unamhusu binti ya Farao kama mke wa Sulemani; “mke” huepuka kuifanya kauli kuwa marufuku ya jumla kwa wanawake wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akampandisha” huhifadhi mwelekeo wa mwendo; “mpaka katika” hufanya mwisho wa mwendo usikike kwa kawaida. Alama ya tanbihi imewekwa baada ya sentensi inayohitaji ufafanuzi.
