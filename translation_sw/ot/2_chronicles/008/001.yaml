  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: sw
  text: Ikawa, mwishoni mwa miaka ishirini, Sulemani alikuwa amejenga nyumba ya Yahwe na nyumba yake mwenyewe,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikulu yake.” Kiebrania kinasema kihalisi “nyumba yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha hatua mpya katika simulizi; “Ikawa” ni usemi wa heshima, mfupi, na unaoeleweka katika Kiswahili cha Biblia bila kuongeza maana.
- source_word: מִקֵּץ עֶשְׂרִים שָׁנָה
  choice: baada ya miaka ishirini
  rationale: Kirai kinaonyesha kufikiwa kwa mwisho wa kipindi cha miaka ishirini. “Baada ya miaka ishirini” ni Kiswahili cha kawaida na sahihi zaidi kuliko tafsiri ya neno kwa neno “mwishoni mwa miaka ishirini.”
- source_word: אֲשֶׁר בָּנָה
  choice: ambayo katika hiyo Sulemani alikuwa amejenga
  rationale: Kiwakilishi kinahusisha kipindi cha miaka ishirini na kazi ya Sulemani ya kujenga; wakati timilifu unaonyesha ujenzi uliokuwa umekamilika kufikia wakati huo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi neno la Kiebrania בַּיִת badala ya kulifasiri moja kwa moja kuwa “hekalu,” na “Yahwe” huwakilisha jina la Mungu יְהוָה.
- source_word: בֵּיתוֹ
  choice: nyumba yake mwenyewe
  rationale: Kiambishi cha umilikaji kinamhusu Sulemani. “Mwenyewe” huonyesha wazi tofauti kati ya nyumba ya Yahwe na nyumba ya Sulemani, bila kubadili neno kuwa “ikulu” katika matini kuu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בֵּיתוֹ kuhusu makao ya Sulemani
  choice: nyumba yake mwenyewe
  alternative: ikulu yake
  rationale: Ingawa muktadha unaweza kumaanisha ikulu, Kiebrania kinasema kihalisi “nyumba yake.” Matini kuu inadumisha upana huo wa maana, huku uwezekano wa “ikulu” ukielezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki kuwa sehemu ya sentensi inayoendelea katika aya zinazofuata, kama ilivyo katika chanzo.
