base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: sw
  text: Ndipo Sulemani akamtolea Yahweh sadaka za kuteketezwa juu ya madhabahu ya Yahweh, ambayo alikuwa ameijenga mbele ya ukumbi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baraza la kuingilia.” Neno la Kiebrania linamaanisha ukumbi wa kuingilia hekaluni.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: הֶעֱלָה
  choice: akamtolea
  rationale: Hifili ya עלה pamoja na sadaka humaanisha kutoa sadaka; umbo hili linaonyesha kitendo cha kumtolea Yahweh bila kulazimisha taswira ya kupandisha.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Neno עֹלָה humaanisha sadaka inayoteketezwa madhabahuni; tafsiri hii ni wazi na imezoeleka katika Kiswahili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kiambishi cha yambwa katika “akamtolea” kinawakilisha ל ya kuelekeza au kuweka wakfu, huku jina la agano יהוה likihifadhiwa kama Yahweh.
- source_word: עַל מִזְבַּח יְהוָה
  choice: juu ya madhabahu ya Yahweh
  rationale: Inahifadhi uhusiano wa mahali wa עַל na muundo wa umilikaji wa Kiebrania kwa lugha ya kawaida.
- source_word: אֲשֶׁר בָּנָה
  choice: ambayo alikuwa ameijenga
  rationale: Wakati timilifu unaonyesha kwa kawaida kwamba kujenga madhabahu kulitangulia tendo la kutoa sadaka.
- source_word: לִפְנֵי הָאוּלָם
  choice: mbele ya ukumbi
  rationale: “Mbele ya” ni tafsiri ya moja kwa moja ya mahali, na “ukumbi” hutaja sehemu ya kuingilia hekalu bila kuwa ya kitaalamu kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida, huku istilahi za ibada na usanifu zikibaki wazi kwa msomaji wa kawaida.
