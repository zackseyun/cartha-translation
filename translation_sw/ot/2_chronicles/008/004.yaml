lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Umbo la wayyiqtol la בנה linaonyesha tendo la wakati uliopita katika mfululizo wa simulizi; kiambishi “aka-” ni cha kawaida na cha asili katika masimulizi ya Kiswahili.
- source_word: תַּדְמֹר
  choice: Tadmori
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kubadilishwa kuwa Palmyra, ambalo ni jina la baadaye.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר humaanisha eneo la nyika au jangwa; “jangwani” ni fasaha hapa na linafaa kwa mazingira ya kijiografia.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: miji yote ya kuhifadhia bidhaa
  rationale: Kirai hiki kinaeleza miji iliyotumiwa kuhifadhi akiba au vifaa. Tafsiri hii ni wazi kwa msomaji wa sasa bila kudai kwamba vilivyohifadhiwa vilikuwa hazina pekee.
- source_word: אֲשֶׁר בָּנָה
  choice: aliyoijenga
  rationale: Kishazi rejeshi kinarejelea “miji”; upatanisho wa ngeli katika Kiswahili unatoa “aliyoijenga.”
- source_word: בַּחֲמָת
  choice: katika Hamathi
  rationale: Kihusishi ב kina maana ya “katika” hapa, huku jina la mahali likitoholewa kama Hamathi. Tafsiri hii haifungi iwapo kinachokusudiwa ni mji wenyewe au eneo lake.
