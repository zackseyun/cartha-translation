  - severity: low
    issue: Kiunganishi/preposition ya Lebanoni haijawekwa wazi katika orodha ya maeneo.
    rationale: Kiebrania husema “katika Yerusalemu na katika Lebanoni.” Kuandika “katika Yerusalemu na Lebanoni” ni Kiswahili cha kawaida na huzuia utata mdogo wa orodha.
