base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: sw
  text: na Baalati, na miji yote ya maghala[a] iliyokuwa ya Sulemani, na miji yote ya magari ya vita, na miji ya wapanda farasi[b], na kila kitu ambacho Sulemani alitamani kujenga[c] katika Yerusalemu na Lebanoni, na katika nchi yote chini ya utawala wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miji ya akiba,” “miji ya mahitaji,” au labda “miji ya hazina.”
    reason: lexical_alternative
  - marker: b
    text: Au “miji ya farasi”; kwa kawaida neno la Kiebrania humaanisha wapanda farasi au askari wapanda farasi.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “kila tamanio la Sulemani, ambalo alitamani kulijenga”; usemi wa nomino na kitenzi vyenye mzizi mmoja unaosisitiza tamanio au furaha yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: Baalati
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: miji ya maghala
  rationale: Kirai kinamaanisha miji iliyotumiwa kuhifadhi akiba au mahitaji; 'miji ya maghala' ni ya asili na wazi kwa Kiswahili cha sasa.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: iliyokuwa ya Sulemani
  rationale: Inahifadhi wazo la milki au umiliki bila kulifafanua kupita maandishi ya Kiebrania.
- source_word: עָרֵי הָרֶכֶב
  choice: miji ya magari ya vita
  rationale: רֶכֶב katika muktadha huu inarejelea magari ya kukokotwa yaliyotumiwa katika jeshi; tafsiri hii ni wazi kuliko 'magari' pekee.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: miji ya wapanda farasi
  rationale: פָּרָשִׁים kwa kawaida ni wapanda farasi au askari wapanda farasi, si farasi wenyewe; uchaguzi huu unahifadhi tofauti hiyo.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: kila kitu ambacho Sulemani alitamani
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya muundo wa nomino na kitenzi vyenye mzizi mmoja, huku tanbihi ikionyesha msisitizo wa asili.
- source_word: לִבְנוֹת
  choice: kujenga
  rationale: Kitenzi kinamaanisha kujenga; hakuna msingi wa lazima wa kukitafsiri 'kujenga upya'.
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo la kawaida la Kiswahili; 'huko' huunganisha kwa asili orodha ya maeneo.
- source_word: וּבַלְּבָנוֹן
  choice: Lebanoni
  rationale: Jina la kijiografia limetolewa kwa umbo la kawaida la Kiswahili, huku kiunganishi cha orodha kikieleweka katika sentensi.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: katika nchi yote aliyotawala
  rationale: Inahifadhi vipengele vya eneo na mamlaka ya מֶמְשָׁלָה kwa Kiswahili fasaha na kinachoeleweka.
