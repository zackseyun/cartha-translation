source:
  edition: WLC
  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: sw
  text: Nao miji ambayo Huramu[a] alikuwa amempa Sulemani, Sulemani aliijenga upya[b], akawakalisha humo watu wa Israeli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Huramu; kimapokeo: Hiramu.'
    reason: alternative_reading
  - marker: b
    text: Au “aliijenga.” Kitenzi cha Kiebrania kinaweza kumaanisha “kujenga” au, katika muktadha huu, “kujenga upya/kurekebisha.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: Nao miji
  rationale: Kiunganishi וְ pamoja na nomino yenye uambishi wa uainisho huendeleza simulizi huku kikianzisha jambo jipya; “Nao miji” ni mtiririko wa kawaida wa Kiswahili na huiweka miji kama mada ya sentensi.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Ni kiwakilishi rejeshi kinachoanzisha kishazi kinachoifafanua “miji”; upatanisho wa ngeli unahitaji “ambayo.”
- source_word: נָתַן
  choice: alikuwa amempa
  rationale: Kitenzi hiki katika kishazi cha kurejelea tendo la awali kinaonyesha kwamba Huramu alimpa Sulemani miji kabla ya ujenzi unaosimuliwa.
- source_word: חוּרָם
  choice: Huramu
  rationale: Jina la Kiebrania חוּרָם limetoholewa moja kwa moja kuwa “Huramu,” badala ya kutumia umbo la kimapokeo “Hiramu.”
- source_word: לִשְׁלֹמֹה
  choice: Sulemani
  rationale: Kiambishi לְ kinamtambulisha Sulemani kuwa mpokeaji; katika Kiswahili maana hiyo inaonyeshwa na muundo “amempa Sulemani.”
- source_word: בָּנָה
  choice: aliijenga upya
  rationale: Maana ya msingi ni “kujenga,” lakini kwa kuwa miji hiyo tayari ilikuwapo na ilikuwa imetolewa kwa Sulemani, muktadha unaelekea kwenye kuijenga tena au kuirekebisha. Tanbihi inahifadhi uwezekano wa tafsiri ya msingi “aliijenga.”
- source_word: אֹתָם
  choice: aliijenga
  rationale: Kiwakilishi cha yambwa kinarejelea “miji”; Kiswahili hutumia kiambishi cha yambwa cha ngeli ya miji, -i-.
- source_word: וַיּוֹשֶׁב
  choice: akawakalisha
  rationale: 'Hifili ya ישׁב ina maana sababishi: Sulemani aliwafanya watu wakae humo. “Akawakalisha” inadumisha maana hiyo kwa Kiswahili cha kawaida.'
- source_word: שָׁם
  choice: humo
  rationale: Kielezi hiki kinarejelea ndani ya miji iliyotajwa; “humo” ni rejeleo la mahali linalofaa zaidi kuliko “huko” katika muktadha huu.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Kihalisi ni “wana wa Israeli,” lakini hapa usemi huo unamaanisha Waisraeli kwa ujumla, si wanaume pekee. “Watu wa Israeli” huwasilisha maana ya jamii nzima, huku tanbihi ikihifadhi umbo halisi.
