base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: sw
  text: 'kulingana na wajibu wa kila siku wa kutoa dhabihu[a], kama alivyoamuru Musa, kwa ajili ya Sabato, miandamo ya mwezi, na sikukuu zilizowekwa mara tatu kwa mwaka: Sikukuu ya Mikate Isiyotiwa Chachu, Sikukuu ya Majuma[b], na Sikukuu ya Vibanda[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na utaratibu wa kila siku”; kihalisi, “kulingana na jambo la siku katika siku yake.”
    reason: lexical_alternative
  - marker: b
    text: Sikukuu ya Majuma baadaye iliitwa “Pentekoste” katika matumizi ya Kigiriki.
    reason: cross_reference
  - marker: c
    text: Au, “Sikukuu ya Makao”; Kiebrania, “Vibanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: kulingana na wajibu wa kila siku
  rationale: Nahau hii, ambayo kihalisi ni ‘jambo la siku kwa siku yake,’ inaeleza kile kilichotakiwa kufanywa kila siku. ‘Wajibu wa kila siku’ ni Kiswahili cha kawaida kinachohifadhi maana ya masharti ya ibada.
- source_word: לְהַעֲלוֹת
  choice: wa kutoa dhabihu
  rationale: Katika muktadha wa ibada, kitenzi hiki humaanisha kupandisha au kutoa sadaka. Kutaja ‘dhabihu’ kunaweka wazi muktadha bila kudai kwamba ni aina moja tu ya dhabihu.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: kama alivyoamuru Musa
  rationale: Tafsiri hii ni ya kawaida na yenye heshima, huku ikihifadhi Musa kuwa chanzo cha amri inayorejelewa.
- source_word: לַשַּׁבָּתוֹת
  choice: kwa ajili ya Sabato
  rationale: Kihusishi kinaonyesha nyakati au matukio ambayo dhabihu hizo zilitolewa; ‘kwa ajili ya’ linafaa katika orodha hii ya kalenda ya ibada.
- source_word: וְלֶחֳדָשִׁים
  choice: mwandamo wa mwezi
  rationale: Katika lugha ya kalenda ya ibada, neno hili linarejelea maadhimisho ya kuanza kwa mwezi, yaani mwandamo, si miezi kwa ujumla.
- source_word: וְלַמּוֹעֲדוֹת
  choice: sikukuu zilizowekwa
  rationale: Neno la Kiebrania lina maana ya nyakati zilizoteuliwa; hapa majina yanayofuata yanaonyesha kuwa ni sikukuu zilizowekwa.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: mara tatu kwa mwaka
  rationale: Ni usemi wa asili na ulio wazi katika Kiswahili, unaowakilisha moja kwa moja idadi na kipindi.
- source_word: בְּחַג הַמַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Jina hili linatafsiri kwa uwazi maelezo ya Kiebrania ya sikukuu hiyo na linatumia istilahi inayoeleweka katika Kiswahili.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: Sikukuu ya Majuma
  rationale: Hili ndilo jina la moja kwa moja la Kiebrania. ‘Pentekoste’ ni jina la baadaye kutoka matumizi ya Kigiriki, kwa hiyo limewekwa katika tanbihi.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: Sikukuu ya Vibanda
  rationale: ‘Vibanda’ vinahifadhi picha halisi ya neno la Kiebrania סֻכּוֹת na ni jina wazi la sikukuu hiyo.
theological_decisions:
- issue: Majina ya sikukuu tatu za hija za Israeli
  choice: Sikukuu ya Mikate Isiyotiwa Chachu / Sikukuu ya Majuma / Sikukuu ya Vibanda
  alternative: Majira ya Pasaka / Pentekoste / Sikukuu ya Makao
  rationale: Maandishi ya Kiebrania yanataja sikukuu hizo moja kwa moja. Majina yaliyochaguliwa yanahifadhi maana za Kiebrania kwa lugha wazi bila kuingiza majina ya baadaye; majina mbadala yanatajwa katika tanbihi inapofaa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inahifadhi muundo wa aya kama kipande kinachoendelea kutoka muktadha uliotangulia. Istilahi za kalenda ya ibada zimetafsiriwa kwa uwazi, huku tanbihi zikihifadhi maana halisi na majina mbadala ya jadi.
