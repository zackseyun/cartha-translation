base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: sw
  text: 'Hawa ndio waliokuwa wakuu wa maafisa[a] wa Mfalme Sulemani: watu mia mbili na hamsini, waliokuwa na mamlaka juu ya watu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasimamizi”; neno la Kiebrania linawahusu maafisa waliowekwa chini ya mamlaka ya mfalme.
    reason: lexical_alternative
  - marker: b
    text: Au “waliowasimamia watu” au “waliokuwa na madaraka juu ya watu”; kitenzi kinaweza kumaanisha kutumia mamlaka katika shughuli za utawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio waliokuwa
  rationale: Hutambulisha kundi katika simulizi la kihistoria; wakati uliopita unasikika kwa kawaida katika Kiswahili na ndio unaofaa muktadha.
- source_word: שָׂרֵי
  choice: wakuu
  rationale: Neno hili linaonyesha viongozi wenye cheo juu ya maafisa wengine bila kulifanya jukumu lao kuwa la kijeshi pekee.
- source_word: הַנְּצִיבִים
  choice: maafisa
  rationale: Katika muktadha huu, neno linawahusu watu waliowekwa katika madaraka ya kifalme. “Maafisa” ni la kawaida na pana; “wasimamizi” limehifadhiwa katika tanbihi kama uwezekano mwingine.
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: wa Mfalme Sulemani
  rationale: Huwasilisha kwa ufupi na kwa kawaida uhusiano wao na mfalme.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: watu mia mbili na hamsini
  rationale: Hutoa idadi ya maafisa kwa Kiswahili cha kawaida; “watu” imeongezwa kwa uwazi bila kubadili maana.
- source_word: הָרֹדִים
  choice: waliokuwa na mamlaka
  rationale: Kitenzi רדה kinaweza kumaanisha kutawala au kutumia mamlaka. Hapa kauli hii inaonyesha mamlaka ya kiutawala bila kudokeza lazima ukandamizaji.
- source_word: בָּעָם
  choice: juu ya watu
  rationale: Kwa kuandamana na רדה, kihusishi kinaonyesha wale ambao mamlaka ilitekelezwa juu yao; “watu” ndilo neno lililo wazi katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Tafsiri inalinda maana ya kiutawala na kutohusisha bila sababu mamlaka hiyo na kazi ya kulazimishwa.
