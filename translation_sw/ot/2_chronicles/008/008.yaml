base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: sw
  text: Miongoni mwa wazao wao waliobaki baada yao katika nchi—wale ambao Waisraeli hawakuwa wamewaangamiza[a]—Solomoni aliwaweka chini ya kazi ya lazima[b] mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao wana wa Israeli hawakuwa wamewaangamiza.” Kiebrania husema “wana wa Israeli,” jina la kawaida la taifa la Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “kazi ya kulazimishwa.” Neno la Kiebrania hurejelea kazi ya lazima iliyowekwa na mamlaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: Kutokana na wazao wao
  rationale: Ingawa בנים kwa msingi humaanisha ‘wana,’ katika muktadha huu wa vizazi ina maana pana ya wazao.
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: waliobaki baada yao
  rationale: Huhifadhi maana ya kubaki na uhusiano wa wakati unaoonyeshwa na אַחֲרֵיהֶם.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Ni tafsiri ya kawaida na ya asili ya הארץ katika muktadha huu.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: wale ambao Waisraeli hawakuwaangamiza
  rationale: Katika muktadha wa ushindi, כִּלָּה ina maana ya kuangamiza au kufutilia mbali; ‘Waisraeli’ ni namna ya kawaida ya Kiswahili ya kutaja taifa linaloitwa kihalisi ‘wana wa Israeli.’
- source_word: וַיַּעֲלֵם ... לְמַס
  choice: Solomoni aliwaweka katika kazi ya kulazimishwa
  rationale: Muungano huu unaeleza kitendo cha kiutawala cha kuwaweka watu chini ya utumishi wa lazima, si kupanda kwa maana halisi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni nahau ya kawaida ya Kiswahili inayoonyesha hali iliyoendelea hadi wakati wa mwandishi.
