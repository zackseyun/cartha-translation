  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: sw
  text: Kwa kufuata utaratibu wa Daudi baba yake[a], Solomoni aliweka makundi ya makuhani kwa ajili ya huduma yao, na Walawi kwa zamu zao, ili wasifu na kuhudumu mbele ya makuhani, kama ilivyohitajiwa kila siku[b]. Pia aliweka walinzi wa malango katika makundi yao, kwa kila lango; kwa maana ndivyo ilivyokuwa amri ya Daudi, mtu wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “baba” katika Kiebrania linaweza pia kutumiwa kwa mtangulizi wa ukoo au wa kifalme; hapa Daudi alikuwa baba wa Solomoni.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa jambo la siku katika siku yake,” yaani, kulingana na hitaji lililowekwa kwa kila siku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: aliweka
  rationale: Hifili ya עמד hapa ina maana ya kuwaweka watu katika nafasi au majukumu yaliyopangwa. “Aliweka” ni ya kawaida katika Kiswahili na inafaa muktadha wa upangaji wa watumishi wa hekalu.
- source_word: כְּמִשְׁפַּט
  choice: kwa kufuata utaratibu
  rationale: מִשְׁפָּט hapa ni kanuni au mpango uliowekwa, si hukumu ya mahakama. “Utaratibu” huwasilisha vizuri mpangilio rasmi wa huduma ya hekalu.
- source_word: דָּוִיד אָבִיו
  choice: Daudi baba yake
  rationale: Tafsiri hii inahifadhi neno la Kiebrania “baba,” ambalo katika nasaba ya kifalme linaweza pia kumaanisha babu au mtangulizi wa ukoo.
- source_word: מַחְלְקוֹת
  choice: makundi
  rationale: Neno hili linamaanisha vikundi rasmi vya makuhani na watumishi wengine vilivyopangiwa huduma. “Makundi” ni wazi kwa msomaji wa sasa kuliko istilahi ya kimapokeo isiyo ya kawaida.
- source_word: עַל עֲבֹדָתָם
  choice: kwa ajili ya huduma yao
  rationale: Kirai hiki kinaonyesha eneo la kazi walilopangiwa, hasa huduma takatifu ya hekaluni.
- source_word: מִשְׁמְרוֹתָם
  choice: zamu zao
  rationale: מִשְׁמֶרֶת linaweza kumaanisha lindo, jukumu au zamu iliyokabidhiwa. “Zamu zao” inafaa upangaji wa huduma wa Walawi huku ikihifadhi wazo la majukumu yaliyopangwa.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: ili wasifu na kuhudumu
  rationale: “Wasifu” huwakilisha הלל, na “kuhudumu” huhifadhi maana maalumu ya שרת katika huduma takatifu.
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: mbele ya makuhani
  rationale: נֶגֶד inaweza kumaanisha mbele ya, mkabala na, au katika uwepo wa. “Mbele ya makuhani” huhifadhi uhusiano huo bila kuufafanua kupita kiasi kuwa ushirikiano au utii.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: kulingana na wajibu wa kila siku
  rationale: Nahau hiyo, kihalisi “kwa jambo la siku katika siku yake,” inaelekeza kwenye mahitaji au wajibu uliopangwa kwa kila siku.
- source_word: הַשּׁוֹעֲרִים
  choice: walinzi wa malango
  rationale: Hawa ni watu waliokabidhiwa kulinda au kuhudumia malango ya hekalu. “Walinzi wa malango” ni wazi na sahihi katika Kiswahili cha sasa.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: kila kundi kwenye lango lake
  rationale: Muundo wa Kiebrania ni wa ugawaji, “lango kwa lango.” Tafsiri hii inaonyesha kwamba kila kundi lilipewa lango hususa.
- source_word: מִצְוַת
  choice: aliyokuwa ameamuru
  rationale: מִצְוָה ni amri yenye mamlaka. Muundo wa kitenzi “aliyokuwa ameamuru” unasomeka kwa kawaida katika sentensi ya Kiswahili na kuhifadhi nguvu ya amri.
theological_decisions:
- issue: Lugha ya kifalme na kinasaba katika “Daudi baba yake”
  choice: Kuhifadhi “baba yake” katika maandishi makuu
  alternative: Daudi babu yake / Daudi mtangulizi wake
  rationale: Kiebrania hutumia “baba” kwa babu wa ukoo au mtangulizi wa kifalme. Kuhifadhi neno hilo hulinda umbo na upana wa maana wa chanzo, huku tanbihi ikizuia kueleweka kuwa Daudi alikuwa baba mzazi wa Solomoni.
- issue: Uhusiano wa huduma ya Walawi na makuhani
  choice: mbele ya makuhani
  alternative: pamoja na makuhani / chini ya makuhani
  rationale: Chanzo kinasema נֶגֶד, ambacho hakibainishi moja kwa moja kama uhusiano ni wa ushirikiano au wa mamlaka. Tafsiri haipaswi kuingiza mpangilio wa kidhehebu ambao kifungu hakisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. “Utaratibu,” “makundi,” “zamu,” na “walinzi wa malango” ni maneno ya sasa na wazi. Jina “Solomoni” limewekwa wazi kwa sababu kiima cha kitenzi kinatokana na muktadha wa kifungu kilichotangulia; kufanya hivyo huondoa utata wa kawaida wa Kiswahili bila kubadili maana.
