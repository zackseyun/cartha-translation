  text: אָז֩ הָלַ֨ךְ שְׁלֹמֹ֜ה לְ/עֶצְיֽוֹן גֶּ֧בֶר וְ/אֶל אֵיל֛וֹת עַל שְׂפַ֥ת הַ/יָּ֖ם בְּ/אֶ֥רֶץ אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: sw
  text: Ndipo Sulemani akaenda Esion-geberi na Elothi[a], kwenye pwani ya bahari katika nchi ya Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Elothi pia huandikwa Elathi au Elati.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: הָלַךְ
  choice: akaenda
  rationale: Kitenzi hiki humaanisha kwenda au kusafiri; “akaenda” ni cha kawaida katika simulizi na hakiashirii bila sababu kwamba alienda kwa miguu.
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: Esion-geberi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa wasemaji wa Kiswahili, huku umbo lake la Kiebrania likidumishwa kwa karibu.
- source_word: וְאֶל אֵילוֹת
  choice: na Elothi[a]
  rationale: Kiunganishi na mwelekeo vinaeleweka kwa asili katika “na Elothi” baada ya kitenzi “akaenda”; tanbihi huhifadhi tahajia mbadala ya jina hilo.
- source_word: עַל שְׂפַת הַיָּם
  choice: kwenye pwani ya bahari
  rationale: Neno שְׂפָה hapa linamaanisha ukingo au pwani; usemi huu ni wazi na wa asili bila kupoteza maana ya mahali.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: katika nchi ya Edomu
  rationale: Tafsiri inahifadhi neno la Kiebrania אֶרֶץ, “nchi,” badala ya kulifupisha kuwa “Edomu” pekee.
