  to: Huramu akampelekea meli kwa njia ya watumishi wake[a], pamoja na watumishi wenye ujuzi wa bahari. Wakaenda pamoja na watumishi wa Solomoni mpaka Ofiri, wakachukua kutoka huko talanta mia nne na hamsini za dhahabu[b], wakazileta kwa Mfalme Solomoni.
