base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: sw
  text: Huramu akampelekea meli kwa njia ya watumishi wake[a], pamoja na watumishi wenye ujuzi wa bahari. Wakaenda pamoja na watumishi wa Solomoni mpaka Ofiri, wakachukua kutoka huko talanta mia nne na hamsini za dhahabu[b], wakazileta kwa Mfalme Solomoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwa mkono wa watumishi wake,” yaani, kupitia watumishi wake.
    reason: cultural_note
  - marker: b
    text: Talanta ilikuwa kipimo kikubwa cha uzito katika nyakati za kale; uzito wake halisi ulitofautiana kulingana na mahali na kipindi.
    reason: historical_measure
lexical_decisions:
- source_word: וַיִּשְׁלַח לוֹ חוּרָם
  choice: Huramu akampelekea
  rationale: Kitenzi שלח pamoja na kiwakilishi cha yule aliyepokea kinaelezwa kwa Kiswahili cha kawaida kama ‘akampelekea,’ huku mlengwa akieleweka kutokana na muktadha kuwa Solomoni.
- source_word: בְּיַד עֲבָדָיו
  choice: kwa njia ya watumishi wake
  rationale: Nahau ya Kiebrania ‘kwa mkono wa watumishi wake’ inaonyesha uwakala; ‘kwa njia ya’ ni ya asili zaidi katika Kiswahili na haiashirii kwamba meli zilibebwa mikononi.
- source_word: אֳנִיּוֹת
  choice: meli
  rationale: Muktadha ni safari ya baharini kwenda Ofiri; ‘meli’ ni neno la kawaida na linalofaa kwa vyombo vikubwa vya baharini.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: pamoja na watumishi waliokuwa na ujuzi wa bahari
  rationale: Tafsiri hii inahifadhi neno עֲבָדִים (‘watumishi’) na pia uzoefu wao wa mambo ya baharini, badala ya kulifupisha kuwa ‘mabaharia’ tu.
- source_word: אוֹפִירָה
  choice: mpaka Ofiri
  rationale: Kiambishi elekezi ־ָה kinaonyesha mwendo kuelekea Ofiri; ‘mpaka Ofiri’ ni usemi wa kawaida wa Kiswahili.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: talanta mia nne na hamsini za dhahabu
  rationale: Kipimo cha kale כִּכָּר kimehifadhiwa kama ‘talanta’ badala ya kupewa thamani ya kisasa yenye uhakika usiokuwapo.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: wakamletea Mfalme Solomoni
  rationale: Kiwakilishi cha yambwa katika ‘wakamletea’ kinamrejelea mfalme; dhahabu inayotolewa inaeleweka kutokana na sentensi iliyotangulia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa simulizi umetumia mfululizo wa vitenzi vya ‘-ka-’. ‘Watumishi’ limechaguliwa ili kuhifadhi upana wa maana ya עֲבָדִים bila kuamua kimuktadha kuwa walikuwa watumwa au waajiriwa.
