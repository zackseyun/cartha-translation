base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: sw
  text: Nao watu wote waliobaki kutoka kwa Wahiti, Waamori, Waperizi, Wahivi na Wayebusi, ambao hawakuwa wa Israeli—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Kirai hiki kinamaanisha jamii nzima ya watu wasio Waisraeli wanaotajwa hapa; ‘watu wote’ ni Kiswahili cha kawaida na sahihi.
- source_word: הַנּוֹתָר
  choice: waliobaki
  rationale: Kauli ya Kiebrania inaonyesha wale waliosalia; ‘waliobaki’ ni ya asili katika muktadha huu wa kihistoria.
- source_word: מִן
  choice: kutoka kwa
  rationale: Hapa kihusishi kinaonyesha asili au kutokana na makundi yaliyotajwa.
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: Wahiti, Waamori, Waperizi, Wahivi na Wayebusi
  rationale: Majina haya ya makabila yametolewa kwa maumbo ya kawaida ya Kiswahili; ingawa Kiebrania hutumia umoja wa kijumla, Kiswahili hutumia wingi hapa.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: ambao hawakuwa wa Israeli
  rationale: Tafsiri hii huhifadhi wazo la asili au uhusiano linaloletwa na מִן bila kulazimisha ufafanuzi finyu wa kikabila.
theological_decisions:
- issue: Maana ya kutokuwa ‘kutoka Israeli’
  choice: ambao hawakuwa wa Israeli
  alternative: ambao hawakuwa Waisraeli
  rationale: Chaguo kuu huhifadhi upana na mvutano wa kirai cha Kiebrania מִיִּשְׂרָאֵל badala ya kukifanya moja kwa moja kuwa jina la utaifa.
