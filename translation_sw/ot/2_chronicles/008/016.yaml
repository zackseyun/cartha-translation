base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: sw
  text: Hivyo, kazi yote ya Sulemani iliandaliwa[a], tangu siku ambayo msingi wa nyumba ya Yahwe uliwekwa mpaka kukamilika kwake[b]. Basi, nyumba ya Yahwe ikakamilika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliwekwa imara,” “ilipangwa,” au “iliwekwa sawa.” Kitenzi cha Kiebrania kinaweza kuwa na maana hizi.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “mpaka kukamilika kwake.” Kiambishi “kwake” katika Kiebrania kinaweza kurejelea nyumba au kazi.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: ikaandaliwa kwa utaratibu
  rationale: Kitenzi cha Kiebrania כון katika umbo hili kinaweza kumaanisha kuwekwa imara, kuandaliwa, au kupangwa. Katika muktadha huu kinajumlisha jinsi kazi yote ilivyoandaliwa na kutekelezwa kwa mpangilio hadi kukamilika.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: kazi yote ya Sulemani
  rationale: מְלָאכָה humaanisha kazi, shughuli, au mradi; hapa kinahusu jumla ya kazi ya ujenzi iliyosimamiwa na Sulemani.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: tangu siku msingi wa nyumba ya Yahwe ulipowekwa mpaka ilipokamilika
  rationale: Muundo huo unaonyesha kipindi chote kutoka kuwekwa kwa msingi hadi kukamilika. Kiswahili cha 'tangu ... mpaka ...' hutoa maana hiyo kwa uwazi bila kuondoa ugumu wa kiambishi katika כְּלֹתוֹ, unaoelezwa katika tanbihi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri ya karibu ya 'nyumba ya YHWH'; inahifadhi sitiari ya Kiebrania badala ya kuibadili kuwa 'hekalu,' ingawa hekalu ndilo linalorejelewa.
- source_word: שָׁלֵם בֵּית יְהוָה
  choice: nyumba ya Yahwe ikawa imekamilika
  rationale: שָׁלֵם hapa inaeleza hali ya nyumba kuwa kamili au kumalizika; 'ikawa imekamilika' ni Kiswahili cha kawaida kinachohifadhi matokeo yaliyosisitizwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu, YHWH, limetoholewa kama 'Yahwe' badala ya kubadilishwa kwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano YHWH. 'Yahwe' huhifadhi jina hilo na kulingana na mazoea ya Kiswahili ya kuandika jina hili.
- issue: Kirejeleo cha kiambishi katika כְּלֹתוֹ
  choice: nyumba ilipokamilika
  alternative: Sulemani alipoimaliza, au kazi ilipokamilika
  rationale: Nyumba ndiyo kirejeleo cha karibu zaidi na sentensi inayofuata inasisitiza kukamilika kwake; hata hivyo, Kiebrania kinaweza kueleweka kwa zaidi ya njia moja, kwa hiyo uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. 'Msingi ... ulipowekwa' ni usemi wa kawaida wa ujenzi; 'nyumba ya Yahwe' hudumisha taswira halisi ya Kiebrania. Marudio ya 'nyumba ya Yahwe' yamehifadhiwa kwa sababu sentensi ya mwisho ni hitimisho lenye msisitizo.
