  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: sw
  text: Akajenga Beth-horoni ya Juu na Beth-horoni ya Chini, miji yenye maboma[a], iliyokuwa na kuta, milango[b], na makomeo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miji iliyotiwa ngome.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “milango”; huenda ni milango ya malango ya miji yenye maboma.'
    reason: lexical_alternative
  - marker: c
    text: Au, “mapingo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Kitenzi בנה kinasimulia tendo lililopita la kujenga; hakilazimishi maana ya ‘kujenga upya,’ kwa kuwa maelezo ya uimarishaji yanafuata.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: Beth-horoni ya Juu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Waswahili, huku kivumishi kikionyesha mji wa sehemu ya juu.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Beth-horoni ya Chini
  rationale: Muundo huu unaenda sambamba na jina la kwanza na kutofautisha miji hiyo miwili kwa mahali ilipo.
- source_word: עָרֵי מָצוֹר
  choice: miji yenye ngome
  rationale: Kirai hiki kinaonyesha miji iliyoimarishwa kwa ajili ya ulinzi; ‘yenye ngome’ ni Kiswahili cha kawaida na huhifadhi maana ya kijeshi.
- source_word: חוֹמוֹת
  choice: iliyokuwa na kuta
  rationale: Neno hili linafafanua kinga za miji; umoja wa kirai unarejelea ‘miji’ kwa muundo wa Kiswahili wenye mtiririko wa kawaida.
- source_word: דְּלָתַיִם
  choice: milango
  rationale: Ingawa neno la Kiebrania kwa msingi humaanisha milango au milango miwili ya kufunguka, katika miji yenye ngome linaelekea kurejelea milango ya kwenye malango ya miji.
- source_word: וּבְרִיחַ
  choice: na makomeo
  rationale: בריח ni chuma au boriti ya kukomea mlango; ‘makomeo’ linaonyesha vifaa vya kuifungia milango kwa usalama bila kulichanganya na kufuli.
