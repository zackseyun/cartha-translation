  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: sw
  text: Lakini Sulemani hakumfanya yeyote miongoni mwa wana wa Israeli[a] kuwa mtumwa kwa ajili ya kazi yake[b], kwa maana wao walikuwa watu wa vita, wakuu wa maafisa wake[c], wakuu wa magari yake ya vita na wapanda farasi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, Sulemani hakumweka yeyote kati yao katika utumwa kwa ajili ya kufanya kazi yake.
    reason: lexical_clarification
  - marker: c
    text: Neno la Kiebrania linalotafsiriwa “maafisa” huenda linamaanisha maafisa wa kijeshi wa ngazi ya juu au wasaidizi wa makamanda; cheo chake hasa hakijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי יִשְׂרָאֵל
  choice: Lakini ... miongoni mwa wana wa Israeli
  rationale: Muunganiko unaonyesha utofautishaji na watu wasio Waisraeli waliotajwa katika mstari uliotangulia. “Wana wa Israeli” huhifadhi namna ya usemi wa Kiebrania, huku “miongoni mwa” ikifanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: לֹא נָתַן שְׁלֹמֹה לַעֲבָדִים
  choice: Sulemani hakumfanya yeyote ... kuwa mtumwa
  rationale: Usemi huu unamaanisha kuwaweka watu katika hali ya utumwa au kazi ya kitumwa. Umoja wenye “yeyote” ni njia ya kawaida ya Kiswahili ya kueleza kwamba hakumweka hata mmoja wao katika hali hiyo.
- source_word: לִמְלַאכְתּוֹ
  choice: kwa ajili ya kazi yake
  rationale: Neno linahusu kazi aliyoagiza Sulemani; tafsiri hii ni pana, wazi, na ya kawaida.
- source_word: כִּי הֵמָּה
  choice: kwa maana wao walikuwa
  rationale: Hutanguliza sababu ya Waisraeli kutofanywa watumwa na hudumisha msisitizo wa kiwakilishi cha Kiebrania.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: watu wa vita
  rationale: Huhifadhi nahau ya Kiebrania na kuonyesha jukumu lao la kijeshi bila kuibana maana kuwa cheo maalumu.
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: wakuu wa maofisa wake
  rationale: שָׂרֵי ni “wakuu wa,” huku שָׁלִישׁ ni istilahi isiyo na uhakika kamili inayoweza kumaanisha afisa wa ngazi ya juu au msaidizi wa kijeshi. Tafsiri hii huhifadhi muundo huo bila kudai cheo mahususi.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: wakuu wa magari yake ya vita
  rationale: Huwataja waliokuwa na mamlaka juu ya magari ya vita ya mfalme; “magari ya vita” hutofautisha wazi רֶכֶב na magari ya kawaida ya kisasa.
- source_word: וּפָרָשָׁיו
  choice: na wapanda farasi wake
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya askari waliopigana wakiwa juu ya farasi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi la kihistoria ulio wa heshima lakini unaoeleweka kwa urahisi. “Mtumwa” limetumiwa badala ya “mtumishi” ili kutoficha hali ya kazi ya kitumwa katika muktadha. Muundo “wakuu wa maofisa wake” unahifadhi tofauti kati ya שָׂרֵי na istilahi tata שָׁלִישָׁיו.
