base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: sw
  text: Nao hawakukengeuka kutoka katika amri ya mfalme kuhusu makuhani na Walawi katika jambo lolote, wala kuhusu hazina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maghala.” Neno la Kiebrania linaweza kumaanisha hazina au maghala ya kuhifadhia vitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: hawakukengeuka
  rationale: Kitenzi סור humaanisha kugeuka kando, kuondoka, au kukengeuka. “Hawakukengeuka” kinahifadhi taswira ya Kiebrania na kueleza kutopotoka kutoka katika amri.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: amri ya mfalme
  rationale: מִצְוָה hapa ni agizo au amri; “amri ya mfalme” ni usemi wa kawaida na wenye heshima katika muktadha huu wa kiutawala.
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: kuhusu makuhani na Walawi
  rationale: עַל hapa inaonyesha jambo linalohusika na amri, si lazima mamlaka juu ya makundi hayo. “Kuhusu” huhifadhi maana hiyo bila kuifafanua kupita kiasi.
- source_word: לְכָל דָּבָר
  choice: katika jambo lolote
  rationale: Katika sentensi hasi, usemi huu unamaanisha kwamba hawakupotoka katika jambo hata moja.
- source_word: וְלָאֹצָרוֹת
  choice: wala kuhusu vyumba vya hazina
  rationale: אֹצָרוֹת inaweza kumaanisha hazina au mahali pa kuhifadhia mali na bidhaa. “Vyumba vya hazina” linafaa kwa mazingira ya usimamizi wa hekalu; “wala” huonyesha kwa kawaida upeo unaoendelea wa kauli hasi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo wa Kiebrania umehifadhiwa kadiri ulivyo wa asili katika Kiswahili, huku “wala” likitumika kuendeleza kauli hasi.
