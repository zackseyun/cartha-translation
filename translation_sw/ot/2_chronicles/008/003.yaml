lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך kimsingi humaanisha ‘kwenda.’ Ingawa muktadha ni wa kijeshi na kisiasa, kitenzi chenyewe hakitaji wazi kushambulia; hivyo ‘akaenda’ linaacha tendo linalofuata lieleze matokeo.
- source_word: חֲמָת צוֹבָה
  choice: Hamath-soba
  rationale: Majina haya mawili yanafanya kazi pamoja kama jina la mahali. Umbo ‘Hamath-soba’ linahifadhi muundo huo kwa Kiswahili bila kudai kwa hakika uhusiano wa ‘Hamath ya Soba.’
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: akaitawala
  rationale: Nahau חזק על ina wazo la kuwa na nguvu juu ya, kushinda, au kupata mamlaka juu ya kitu. Katika muktadha wa kampeni ya kifalme, ‘akaitawala’ linaeleza kwa lugha ya kawaida matokeo ya kisiasa na kijeshi huku tanbihi ikihifadhi maana halisi na tafsiri nyingine zinazowezekana.
