  yaml_path: translation/ot/2_chronicles/009/014.yaml
  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: sw
  text: Mbali na yale yaliyoletwa na wafanyabiashara wasafiri na wachuuzi, wafalme wote wa Arabia na watawala wa nchi walimletea Sulemani dhahabu na fedha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: wafanyabiashara wasafiri
  rationale: Kirai hiki kinamaanisha watu wanaosafiri kwa shughuli za biashara; tafsiri hii hutofautisha kundi hili na wachuuzi wanaotajwa baadaye.
- source_word: הַסֹּחֲרִים
  choice: wachuuzi
  rationale: Neno hili humaanisha wafanyabiashara au wachuuzi; ‘wachuuzi’ linadumisha utofauti wa kileksia na kundi la kwanza.
- source_word: עֲרַב
  choice: Arabia
  rationale: Katika muktadha huu jina hili linaeleweka kuwa jina la eneo au watu wa Arabia, kama tafsiri nyingi za 2 Nyakati 9:14 zinavyoonyesha.
- source_word: פַחוֹת הָאָרֶץ
  choice: watawala wa nchi
  rationale: פַחוֹת ni watawala wa kiutawala; ‘watawala’ ni neno la kawaida na lenye hadhi, huku הָאָרֶץ ikibaki ‘nchi’ bila kuamua kimya kimya nchi gani.
- source_word: מְבִיאִים
  choice: walimletea
  rationale: Kauli endelevu ya Kiebrania katika simulizi hili imetolewa kwa wakati uliopita wa Kiswahili; kiambishi ‘-m-’ kinaweka wazi kuwa Sulemani ndiye mpokeaji.
