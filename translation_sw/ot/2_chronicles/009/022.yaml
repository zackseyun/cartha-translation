  text: Mfalme Sulemani akawapita wafalme wote wa dunia kwa utajiri na hekima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: akawapita
  rationale: Katika muundo huu wa kulinganisha wenye מִן, kitenzi גדל kinaonyesha kuwa Sulemani alikuwa mkuu kuliko wengine. “Akawapita” ni Kiswahili cha kawaida kinachoeleza kuwazidi katika mambo yaliyotajwa.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Muundo huu unahifadhi cheo na jina kwa mpangilio wa kawaida na wenye heshima katika Kiswahili.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: wafalme wote wa dunia
  rationale: Ingawa אֶרֶץ inaweza kumaanisha “nchi” au “dunia,” hapa upeo mpana wa kulinganisha wafalme unaunga mkono “dunia.”
- source_word: לְעֹשֶׁר
  choice: kwa utajiri
  rationale: לְ hapa inaonyesha jambo au kipengele ambacho katika hicho Sulemani aliwapita wengine; “kwa utajiri” ni usemi wa asili katika Kiswahili.
- source_word: וְחָכְמָה
  choice: na hekima
  rationale: “Hekima” ni tafsiri ya moja kwa moja ya חָכְמָה, na kihusishi “kwa” kinaeleweka kuwa kinatawala nomino zote mbili katika “kwa utajiri na hekima.”
