  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: sw
  text: Tena watumishi wa Hiramu na watumishi wa Sulemani, waliokuwa wameleta dhahabu kutoka Ofiri, walileta mbao za algumu[a] na mawe ya thamani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aina kamili ya mbao zinazotajwa kwa neno hili la Kiebrania haijulikani kwa uhakika; pia huitwa “almugu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “jiwe la thamani,” katika umoja; huenda umoja huo umetumiwa kwa maana ya jumla kumaanisha mawe ya thamani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Tena
  rationale: Neno hili linaendeleza simulizi na kuongeza jambo jingine; “Tena” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: עַבְדֵי חירם וְעַבְדֵי שְׁלֹמֹה
  choice: watumishi wa Hiramu na watumishi wa Sulemani
  rationale: Katika muktadha huu wa kifalme, עֲבָדִים humaanisha watu walio katika utumishi wa wafalme; kurudia “watumishi” kunadumisha ulinganifu wa Kiebrania.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: waliokuwa wameleta dhahabu kutoka Ofiri
  rationale: Kishazi hiki kinawatambulisha watumishi hao kwa tendo lililotangulia tendo kuu la kuleta mbao na mawe; umbo hili la Kiswahili linaonyesha uhusiano huo wa wakati kwa kawaida.
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: mbao za algumu
  rationale: Aina kamili ya mti inayotajwa haijulikani kwa uhakika. “Mbao” inafaa kwa bidhaa iliyosafirishwa, na “algumu” linahifadhi jina la Kiebrania bila kudai utambulisho wa kibotania usio na uhakika.
- source_word: וְאֶבֶן יְקָרָה
  choice: na mawe ya thamani
  rationale: Ingawa “jiwe” liko katika umoja kwa umbo la Kiebrania, hapa linaeleweka kwa maana ya jumla; wingi ni wa kawaida zaidi katika orodha hii ya bidhaa.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili: Hiramu, Sulemani na Ofiri.'
