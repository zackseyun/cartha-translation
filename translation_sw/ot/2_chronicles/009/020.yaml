id: 2CH.9.20
reference: 2 Chronicles 9:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: sw
  text: Vyombo vyote vya kunywea vya Mfalme Sulemani vilikuwa vya dhahabu, na vyombo vyote vya Nyumba ya Msitu wa Lebanoni[a] vilikuwa vya dhahabu safi[b]. Fedha haikuhesabiwa kuwa kitu chochote katika siku za Sulemani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikulu ya Msitu wa Lebanoni,” jina la jengo maalumu la kifalme.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “dhahabu iliyofungwa”; hii ni nahau ambayo kwa kawaida hueleweka kuwa dhahabu safi au iliyosafishwa.
    reason: lexical_alternative
  - marker: c
    text: Au “Fedha haikuhesabiwa kuwa na thamani yoyote katika siku za Sulemani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: vyombo vya kunywea
  rationale: Neno כְּלֵי ni pana kuliko vikombe pekee, na מַשְׁקֵה linafafanua matumizi ya kunywea; tafsiri hii ni ya kawaida na haiibani maana.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni jina la moja kwa moja la metali hiyo, na limerudiwa kama katika Kiebrania.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Nyumba ya Msitu wa Lebanoni
  rationale: Hili ni jina la jengo maalumu la kifalme. “Nyumba” linaakisi בֵּית bila kuongeza kwa lazima tafsiri ya “ikulu.”
- source_word: זָהָב סָגוּר
  choice: dhahabu safi
  rationale: Muunganiko huu ni nahau inayoeleweka kuwa dhahabu yenye ubora wa juu au iliyosafishwa; “dhahabu safi” ni Kiswahili cha asili na wazi.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: Fedha haikuhesabiwa kuwa kitu chochote
  rationale: Kauli hii inabaki karibu na muundo wa Kiebrania na kuonyesha kutokuwa na umuhimu kwa fedha bila kufafanua kupita kiasi kwamba haikuwa na thamani kabisa.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: katika siku za Sulemani
  rationale: Inahifadhi nahau na mtazamo wa kihistoria wa Kiebrania bila kuibadili kuwa “wakati wa utawala,” ambalo ni fafanuzi zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa sentensi na marudio ya “vyombo vyote” na “dhahabu” yanahifadhi msisitizo wa chanzo. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
