base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: sw
  text: Kulikuwa na ngazi sita za kukifikia kiti cha enzi, na kigoda cha dhahabu cha kuwekea miguu[a] kilichounganishwa na kiti hicho. Kulikuwa na sehemu za kuegemezea mikono pande zote mbili za mahali pa kuketi, na simba wawili walisimama kando ya sehemu hizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “njia panda au ngazi ya dhahabu iliyounganishwa na kiti hicho.” Neno la Kiebrania כֶּבֶשׁ linaweza kueleweka kwa njia tofauti, ingawa “kigoda cha kuwekea miguu” linafaa katika muktadha wa kiti cha enzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: ngazi sita za kukifikia kiti cha enzi
  rationale: Katika maelezo ya muundo wa kiti cha enzi, neno hili linamaanisha hatua za kupandia. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha kusudi la ngazi hizo.
- source_word: כֶּבֶשׁ
  choice: kigoda cha kuwekea miguu
  rationale: Katika muktadha wa kiti cha enzi, maana hii inafaa kama kifaa cha kutegemezea miguu. Hata hivyo, neno la Kiebrania linaweza pia kumaanisha njia panda au ngazi, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
- source_word: בַזָּהָב
  choice: cha dhahabu
  rationale: Huwasilisha kwa ufupi kwamba kifaa hicho kilikuwa cha dhahabu, bila kuongeza dai lisilokuwamo kuhusu kama kilikuwa dhahabu tupu au kilifunikwa nayo.
- source_word: מָאֳחָזִים
  choice: kilichounganishwa
  rationale: Kitenzi kishirikishi cha hali ya kutendwa kinaonyesha kuwa kifaa hicho kilikuwa kimeshikizwa au kuunganishwa na kiti cha enzi. Kiswahili kimelinganishwa kisarufi na 'kigoda' kwa ufasaha.
- source_word: יָדוֹת
  choice: sehemu za kuegemezea mikono
  rationale: Ingawa maana halisi ni 'mikono,' katika muktadha wa samani neno hilo hurejelea sehemu za kiti ambako mikono huegemezwa.
- source_word: מִזֶּה וּמִזֶּה עַל מְקוֹם הַשָּׁבֶת
  choice: Pande zote mbili za mahali pa kuketi
  rationale: Kauli hii ya asili inaonyesha mpangilio wa pande mbili kando ya sehemu ya kukalia; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: אֲרָיוֹת עֹמְדִים
  choice: simba wawili walisimama
  rationale: Huhifadhi maelezo ya moja kwa moja kwamba simba hao walikuwa katika hali ya kusimama, bila kuongeza wazi kwamba walikuwa sanamu, jambo linalodokezwa tu na muktadha.
- source_word: אֵצֶל הַיָּדוֹת
  choice: kando ya sehemu hizo
  rationale: Neno אֵצֶל linaonyesha ukaribu. 'Sehemu hizo' hurejelea kwa uwazi sehemu za kuegemezea mikono zilizotajwa mara moja kabla yake.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Sentensi imegawanywa mara mbili ili maelezo ya muundo wa kiti yawe wazi. 'Kiti cha enzi' limetumiwa kwa istilahi ya kifalme, na maelezo ya sehemu za kuegemezea mikono yametolewa kwa lugha ya kawaida ya kisasa.
