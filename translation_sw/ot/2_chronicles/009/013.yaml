  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: sw
  text: Uzito wa dhahabu iliyomjia Sulemani kwa mwaka mmoja ulikuwa talanta mia sita sitini na sita za dhahabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyoletwa kwa Sulemani”; Kiebrania kinasema kihalisi “iliyomjia Sulemani,” bila kutaja aliyeileta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ulikuwa
  rationale: Muundo huu unaendeleza simulizi na kuunganisha kiima ‘uzito’ na kiasi kilichotajwa; Kiswahili hakihitaji kiunganishi cha mwanzo hapa.
- source_word: מִשְׁקַל הַזָּהָב
  choice: Uzito wa dhahabu
  rationale: מִשְׁקַל humaanisha uzito hasa, si thamani au kiasi kwa ujumla; kirai hiki ni cha asili na wazi katika Kiswahili.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: iliyomjia Sulemani
  rationale: Kitenzi בוא kinasema kihalisi kwamba dhahabu ‘ilikuja’ kwa Sulemani bila kutaja aliyeileta; ‘iliyomjia’ huhifadhi kutotajwa kwa mtendaji.
- source_word: בְּשָׁנָה אֶחָת
  choice: kwa mwaka mmoja
  rationale: Hueleza jumla iliyopatikana katika kipindi cha mwaka mmoja kwa Kiswahili cha kawaida.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: mia sita sitini na sita
  rationale: Huwakilisha kwa usahihi idadi 666 kwa mpangilio wa kawaida wa Kiswahili.
- source_word: כִּכְּרֵי זָהָב
  choice: talanta ... za dhahabu
  rationale: ‘Talanta’ ni istilahi ya kawaida ya kibiblia kwa kipimo hiki kikubwa cha uzito; kurudia ‘za dhahabu’ kunafuata msisitizo wa maandishi ya Kiebrania.
theological_decisions:
- issue: Uwezekano wa kuipa 666 maana ya kiishara
  choice: Idadi imetafsiriwa moja kwa moja kama kiasi cha kihistoria cha uzito.
  alternative: Kuashiria uhusiano wa kiishara na matumizi mengine ya 666 katika Biblia.
  rationale: Aya yenyewe haitafsiri idadi hiyo kiishara; kuingiza maana hiyo kungezidisha kile kinachosemwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Iliyomjia’ ni ya kawaida na huhifadhi kutotajwa kwa mtendaji katika Kiebrania; ‘talanta’ imehifadhiwa kama kipimo cha uzito cha kale.
