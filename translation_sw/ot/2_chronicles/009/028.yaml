  text: And they were importing horses for Solomon from Egypt and from all the lands[a].
translation:
  language: sw
  text: Nao walikuwa wakimletea Sulemani farasi kutoka Misri na kutoka nchi zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Nao walikuwa wakitoa farasi kutoka Misri kwa ajili ya Sulemani, na kutoka nchi zote.” Kitenzi cha Kiebrania kwa maana halisi ni “kusababisha watoke/kuwatoa,” lakini hapa kinahusu kuwaleta kwa njia ya biashara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: walikuwa wakimletea
  rationale: Kitenzi cha Kiebrania katika Hiphil kwa maana halisi ni ‘kusababisha watoke/kuwatoa.’ Katika muktadha huu wa biashara, ‘walikuwa wakimletea’ kinaeleza kwa Kiswahili cha kawaida usambazaji wa farasi kwa Sulemani, huku wingi wa kiima kisichotajwa ukihifadhiwa kwa ‘wa-’.
- source_word: סוּסִים
  choice: farasi
  rationale: Nomino ya wingi inayomaanisha farasi; katika Kiswahili umbo ‘farasi’ linaweza kuwa umoja au wingi kulingana na muktadha.
- source_word: מִ/מִּצְרַיִם
  choice: kutoka Misri
  rationale: Kihusishi מן kinaonyesha chanzo au asili ya farasi.
- source_word: לִ/שְׁלֹמֹה
  choice: wakimletea Sulemani
  rationale: Kihusishi ל kinaweza kumaanisha ‘kwa’ au ‘kwenda kwa.’ Muundo ‘kumletea Sulemani’ unaonyesha kwa kawaida kwamba alikuwa mpokeaji au mnufaika wa farasi hao.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: na kutoka nchi zote
  rationale: כָּל pamoja na wingi wa אֶרֶץ huonyesha maeneo au mataifa mengi kwa upana. ‘Nchi zote’ ni ya kawaida na yenye heshima katika Kiswahili, bila kufinya maana kuwa mataifa ya kisiasa tu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wakimletea’ ni ya kawaida kuliko tafsiri halisi ‘walikuwa wakitoa,’ na inaweka wazi muktadha wa usambazaji bila kubadili chanzo cha farasi. Alama ya tanbihi [a] imewekwa katika matini kuu.
