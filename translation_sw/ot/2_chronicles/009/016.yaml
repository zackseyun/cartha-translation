  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: sw
  text: Tena alifanya ngao mia tatu za dhahabu iliyopigwa kwa nyundo[a]; dhahabu mia tatu[b] ilitumika kwa kila ngao. Mfalme akaziweka katika Nyumba ya Msitu wa Lebanoni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhahabu iliyopigwa na kuwa nyembamba.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “mia tatu za dhahabu” kwa kila ngao, bila kutaja kipimo.
    reason: lexical_alternative
  - marker: c
    text: Nyumba ya Msitu wa Lebanoni ni jina la jengo maalumu la kifalme; pia yaweza kutafsiriwa “ikulu ya Msitu wa Lebanoni.”
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: ngao
  rationale: Neno מָגֵן humaanisha ngao; “ngao” ni neno la kawaida na wazi katika Kiswahili cha sasa.
- source_word: זָהָב שָׁחוּט
  choice: dhahabu iliyofuliwa kwa nyundo
  rationale: שָׁחוּט hapa inaeleza dhahabu iliyofanyiwa kazi kwa kuipiga, huenda hadi kuwa mabamba membamba. Kauli hii inaonyesha njia ya kuitengeneza kwa lugha ya kawaida.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: kiasi cha shekeli mia tatu za dhahabu
  rationale: Kiebrania kinasema kihalisi “mia tatu za dhahabu” bila kutaja kipimo. “Shekeli” imetolewa wazi kwa msaada wa kifungu sambamba cha 1 Wafalme 10:17, huku tanbihi ikihifadhi hali ya matini ya Kiebrania.
- source_word: יַעֲלֶה עַל
  choice: kilitumika kwa
  rationale: Kauli ya Kiebrania ina picha ya kiasi hicho “kupanda juu ya” kila ngao, yaani kuwekwa au kutumiwa juu yake. “Kilِtumika kwa” ni Kiswahili cha asili kinachowasilisha maana bila kudai kwamba ngao ilikuwa dhahabu tupu.
- source_word: הַמָּגֵן הָאֶחָת
  choice: kila ngao
  rationale: Ingawa umbo la Kiebrania ni la umoja, katika muktadha lina maana ya kugawa kiasi hicho kwa kila ngao mojamoja.
- source_word: וַיִּתְּנֵם
  choice: akaziweka
  rationale: נתן pamoja na mahali hapa humaanisha kuweka; kiambishi “-zi-” kinarejelea ngao.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Jumba la Msitu wa Lebanoni
  rationale: Hili ni jina la jengo maalumu la kifalme. “Jumba” ni la asili zaidi kwa jengo la kifalme kuliko “nyumba,” huku herufi kubwa zikionyesha kuwa ni jina maalumu.
