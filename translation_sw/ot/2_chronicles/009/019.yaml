  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: sw
  text: Na simba kumi na wawili walikuwa wamesimama pale juu ya zile ngazi sita[a], upande huu na upande ule. Kitu kama hicho hakikuwa kimetengenezwa katika ufalme wowote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Simba kumi na wawili walisimama pale kwenye zile ngazi sita, mmoja kila upande.”
    reason: Kiebrania kinaweza kueleweka kuwa simba walipangwa mmoja kila upande, labda wawili kwa kila ngazi, jumla yao wakiwa kumi na wawili.
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: Na simba kumi na wawili
  rationale: Huhifadhi kiunganishi na idadi ya simba kwa mpangilio wa kawaida wa Kiswahili.
- source_word: עֹמְדִים שָׁם
  choice: walikuwa wamesimama pale
  rationale: Kauli ya hali inatoa picha endelevu ya simba waliowekwa katika eneo la kiti cha enzi.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: juu ya zile ngazi sita
  rationale: מַעֲלוֹת hapa ni ngazi za kupandia kwenye kiti cha enzi; 'juu ya' hufuata maana ya עַל bila kuamua kwa undani mahali pa kila simba.
- source_word: מִזֶּה וּמִזֶּה
  choice: upande huu na upande ule
  rationale: Huhifadhi picha halisi ya pande mbili na ulinganifu wa mpangilio.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Kitu kama hicho hakikuwa kimetengenezwa
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya upekee iliyo katika ujenzi wa Kiebrania wa kutendwa.
- source_word: לְכָל מַמְלָכָה
  choice: kwa ajili ya ufalme wowote
  rationale: 'Huwasilisha ulinganisho wa jumla: hakuna ufalme uliokuwa umetengenezewa kitu cha namna hiyo.'
