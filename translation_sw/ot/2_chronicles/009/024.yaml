translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya Kiebrania umehifadhiwa, na utata wa maneno מִנְחָה, שְׂלָמוֹת, נֵשֶׁק, na בְשָׂמִים umeelezwa bila kuufunga kwa maana moja isiyo na uhakika.
