base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: sw
  text: 'Nao walikuwa wakileta, kila mmoja zawadi yake[a]: vitu vya fedha, vitu vya dhahabu, mavazi[b], silaha[c], manukato[d], farasi na nyumbu, mwaka baada ya mwaka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mmoja toleo lake” au “kila mmoja ushuru wake.” Neno la Kiebrania linaweza kumaanisha zawadi, toleo, au ushuru; katika muktadha huu wa kifalme huenda linarejelea zawadi za heshima au ushuru.
    reason: lexical_alternative
  - marker: b
    text: Au, “majoho.”
    reason: lexical_alternative
  - marker: c
    text: Au, “zana za kivita” au “mavazi ya vita.”
    reason: lexical_alternative
  - marker: d
    text: Au, “viungo” au “vitu vya kunukia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: walikuwa wakileta
  rationale: Kivumishi-tendo cha Kiebrania katika muktadha huu kinaonyesha tendo la kawaida au linalorudiwa; usemi huu unaonyesha uletaji wao wa kila mwaka.
- source_word: אִישׁ מִנְחָתוֹ
  choice: kila mmoja zawadi yake ya ushuru
  rationale: אִישׁ imetumiwa kwa maana ya kila mtu mmoja mmoja. מִנְחָה hapa ni kitu kinacholetwa kwa mfalme; 'zawadi ya ushuru' huhifadhi dhana ya zawadi na pia muktadha wa wajibu wa kifalme bila kuamua maana kwa kupita kiasi.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: vyombo vya fedha, vyombo vya dhahabu
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu kilichotengenezwa. 'Vyombo' ni tafsiri ya kawaida na pana katika orodha hii.
- source_word: וּשְׂלָמוֹת
  choice: mavazi
  rationale: Neno hili humaanisha vitu vya kuvaliwa, huenda mavazi ya nje yenye thamani; 'mavazi' halibainishi aina isiyothibitishwa.
- source_word: נֵשֶׁק
  choice: silaha
  rationale: Neno linaweza kutaja silaha au zana za kijeshi; 'silaha' ni wazi na ya kawaida katika Kiswahili.
- source_word: וּבְשָׂמִים
  choice: viungo
  rationale: Katika muktadha wa zawadi za kifalme, neno hili hurejelea vitu vyenye harufu au viungo vya thamani; 'viungo' ni neno la kawaida huku uwezekano wa 'manukato' ukibainishwa katika tanbihi.
- source_word: סוּסִים וּפְרָדִים
  choice: farasi na nyumbu
  rationale: Hizi ni visawe vya moja kwa moja na vya kawaida vya Kiswahili.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Nahau hii huonyesha kurudiwa kwa tendo kila mwaka; usemi huu ni wa asili katika Kiswahili na huhifadhi dhana hiyo.
