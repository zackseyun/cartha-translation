translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa na hadhi inayofaa maandiko. ‘Kiti cha enzi’ kimetumiwa badala ya ‘kiti’ ili kudhihirisha matumizi ya kifalme; kiambishi cha mfululizo ‘aka-’ kinaakisi mfuatano wa vitenzi vya Kiebrania.
