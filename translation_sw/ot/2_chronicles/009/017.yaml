  yaml_path: translation/ot/2_chronicles/009/017.yaml
  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: sw
  text: Mfalme akatengeneza kiti cha enzi kikubwa cha pembe za ndovu[a], akakifunika kwa dhahabu safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “kiti cha enzi cha jino”; usemi huu unamaanisha kiti cha enzi cha pembe za ndovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה katika muktadha huu humaanisha kutengeneza; ‘akatengeneza’ ni Kiswahili cha kawaida na huendeleza simulizi.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino hii ina kibainishi na inamtaja mfalme anayejulikana katika muktadha; Kiebrania kinatumia cheo badala ya jina.
- source_word: כִּסֵּא
  choice: kiti cha enzi
  rationale: כִּסֵּא hapa ni kiti cha kifalme, hivyo ‘kiti cha enzi’ huonyesha maana hiyo wazi na kwa lugha ya kawaida.
- source_word: שֵׁן
  choice: pembe za ndovu
  rationale: Ingawa שֵׁן kwa msingi humaanisha ‘jino,’ katika usemi huu humaanisha pembe za ndovu kama nyenzo ya kiti.
- source_word: גָּדוֹל
  choice: kikubwa
  rationale: גָּדוֹל inaweza kuonyesha ukubwa na pia fahari; ‘kikubwa’ huhifadhi maana ya moja kwa moja bila kuongeza wazo lisilotajwa.
- source_word: וַיְצַפֵּהוּ
  choice: akakifunika
  rationale: Umbo la piel la צפה humaanisha kukifunika au kukipamba kitu kwa tabaka la nyenzo; pamoja na dhahabu, ‘akakifunika’ ni wazi na asilia.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Huu ni ulinganifu wa moja kwa moja na wa kawaida kwa dhahabu isiyo na mchanganyiko.
