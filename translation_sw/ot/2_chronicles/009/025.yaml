base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: sw
  text: Solomoni alikuwa na mazizi elfu nne ya farasi na magari ya vita[a], na wapanda farasi elfu kumi na mbili[b]. Aliwaweka katika miji ya magari ya vita, na wengine pamoja na mfalme huko Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vibanda elfu nne vya farasi na magari ya vita”; neno la Kiebrania אֻרְיוֹת linaweza kumaanisha mazizi au vibanda vya farasi.
    reason: lexical_alternative
  - marker: b
    text: Sehemu inayolingana katika 1 Wafalme 4:26 inasema “mazizi elfu arobaini,” lakini hapa Mambo ya Nyakati inasema “elfu nne.”
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Solomoni alikuwa na
  rationale: Muundo wa Kiebrania היה + ל unaonyesha umiliki; Kiswahili cha kawaida hutumia ‘alikuwa na’.
- source_word: אַרְבַּעַת אֲלָפִים
  choice: elfu nne
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya idadi hiyo.
- source_word: אֻרְיוֹת
  choice: mazizi
  rationale: Neno hilo linamaanisha sehemu au nyumba za kuhifadhia farasi; ‘mazizi’ ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: kwa ajili ya farasi na magari ya vita
  rationale: Tafsiri hii inahifadhi nomino zote mbili na kueleza kwa kawaida matumizi ya mazizi hayo; ‘magari ya vita’ hutofautisha רכב na magari ya kawaida ya kisasa.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: na ... elfu kumi na mbili
  rationale: Utoaji wa moja kwa moja wa idadi hiyo katika mpangilio wa kawaida wa Kiswahili.
- source_word: פָּרָשִׁים
  choice: wapanda farasi
  rationale: Neno linamaanisha watu wanaopanda farasi; tafsiri hii ni ya moja kwa moja kuliko istilahi ya kijeshi yenye tafsiri pana zaidi.
- source_word: וַיַּנִּיחֵם
  choice: Aliwaweka
  rationale: Kitenzi kinamaanisha kuwaweka au kuwapa mahali; ‘aliwaweka’ huhifadhi upana wa maana bila kuongeza dhana maalumu ya kijeshi.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: katika miji ya magari ya vita
  rationale: Huhifadhi uhusiano wa nomino wa Kiebrania na kueleza kwamba hiyo ilikuwa miji iliyohusishwa na magari ya vita.
- source_word: וְעִם הַמֶּלֶךְ
  choice: na pamoja na mfalme
  rationale: Hufuata usemi wa Kiebrania bila kuongeza wazi ‘baadhi yao,’ ingawa mgawanyo huo unaeleweka katika muktadha.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo lake la kawaida la Kiswahili; ‘huko’ linaunganisha mahali kwa mtiririko wa sentensi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Magari ya vita’ limetumiwa badala ya ‘magari’ pekee ili kuzuia picha ya magari ya kisasa. Alama zote za tanbihi zimewekwa katika matini.
