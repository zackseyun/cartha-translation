lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: alitawala
  rationale: Kitenzi מלך katika muundo huu wa kisimulizi kinaeleza utawala wa kifalme uliopita; “alitawala” ni Kiswahili cha kawaida na cha heshima katika muktadha huu.
- source_word: שְׁלֹמֹה
  choice: Solomoni
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: בִירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Kihusishi ב kinaonyesha mahali; “huko Yerusalemu” kinaonyesha kwa kawaida mahali ambapo Solomoni alitawala.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: juu ya Israeli yote
  rationale: עַל pamoja na מלך huonyesha mamlaka juu ya taifa; tafsiri hii inadumisha maana ya Israeli kama jumuiya nzima bila kuibadili kuwa “Waisraeli wote.”
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Kirai hiki kinaonyesha muda wa utawala; Kiswahili hutumia “kwa miaka arobaini” kwa muda huo.
