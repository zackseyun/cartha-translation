base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: sw
  text: Naye akampa mfalme talanta mia moja na ishirini za dhahabu, manukato mengi sana, na mawe ya thamani. Na kabla ya hapo, hayakuwa yamewahi kuwapo manukato kama yale ambayo malkia wa Sheba alimpa Mfalme Sulemani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baadaye hayakuwahi kuwapo tena manukato kama yale ambayo malkia wa Sheba alimpa Mfalme Sulemani.” Kiebrania kinaweza kueleweka kuwa manukato hayo hayakuwa na mfano hadi wakati huo, au kwa maana pana zaidi kuwa zawadi hiyo haikupata mfano tena katika kumbukumbu ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Naye akampa
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi; “Naye akampa” ni Kiswahili cha kawaida kinachohifadhi mwendelezo huo.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: talanta mia moja na ishirini za dhahabu
  rationale: כִּכָּר ni kipimo cha uzito kinachojulikana kwa kawaida katika tafsiri za Biblia kama “talanta”; mpangilio huu wa namba ni wa kawaida katika Kiswahili.
- source_word: וּבְשָׂמִים
  choice: manukato
  rationale: Neno hili linamaanisha vitu au viungo vyenye harufu nzuri; “manukato” linafaa kwa jumla hii ya zawadi za thamani bila kuibana maana kuwa aina moja tu.
- source_word: לָרֹב מְאֹד
  choice: mengi sana
  rationale: Kirai hiki husisitiza wingi mkubwa; “mengi sana” ni wazi, cha asili, na kinahifadhi msisitizo.
- source_word: וְאֶבֶן יְקָרָה
  choice: na mawe ya thamani
  rationale: Ingawa “jiwe” liko katika umoja katika Kiebrania, limetumika kwa maana ya jumla; wingi ni wa kawaida zaidi katika orodha hii ya zawadi kwa Kiswahili.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: Kamwe hayakuwa yamekuwapo manukato kama yale
  rationale: Muundo huu unakanusha kuwapo kwa manukato yanayolingana na yale; wakati timilifu unaonyesha ulinganisho unaotazama kipindi kilichotangulia.
- source_word: אֲשֶׁר נָתְנָה מַלְכַּת שְׁבָא
  choice: ambayo malkia wa Sheba alimpa
  rationale: Kishazi hiki kinabainisha manukato yasiyokuwa na mfano, huku kiwakilishi cha yambwa katika “alimpa” kikirejelea Mfalme Sulemani.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Huu ndio mpangilio wa kawaida na wenye hadhi wa cheo pamoja na jina katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa, na wenye hadhi. “Manukato” limechaguliwa badala ya neno linaloweza kudokeza viungo vya chakula pekee. Alama ya tanbihi imewekwa baada ya dai linalohusu kutokuwa na mfano kwa manukato, ambalo ndilo linalofafanuliwa na tanbihi.
