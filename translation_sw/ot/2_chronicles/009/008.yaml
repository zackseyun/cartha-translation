id: 2CH.9.8
reference: 2 Chronicles 9:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: sw
  text: Na abarikiwe Yahwe, Mungu wako,[a] ambaye alipendezwa nawe na kukuweka juu ya kiti chake cha enzi ili uwe mfalme kwa ajili ya Yahwe, Mungu wako. Kwa sababu Mungu wako aliipenda Israeli, ili kuifanya idumu milele,[b] alikuweka kuwa mfalme juu yao, ili utekeleze haki na uadilifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe, Mungu wako, na abarikiwe.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kina kiambishi cha umoja: “ili kuifanya idumu milele,” kikirejelea Israeli kama taifa moja; kinaweza pia kueleweka kwa maana ya watu wa Israeli kwa pamoja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: na abarikiwe
  rationale: Muundo huu wa kutakia baraka unaonyesha ombi au tamko la heshima. Kiswahili cha sasa hutumia kwa kawaida ‘na abarikiwe’ katika kauli ya aina hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania.
- source_word: חָפֵץ בְּךָ
  choice: aliyependezwa nawe
  rationale: Linawasilisha maana ya kufurahia au kupendezwa na mtu kwa lugha ya kawaida na yenye heshima.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: kukuweka juu ya kiti chake cha enzi
  rationale: Linahifadhi taswira muhimu kwamba mfalme amewekwa juu ya kiti cha enzi kinachotajwa kuwa cha Mungu.
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: uwe mfalme kwa ajili ya Yahwe Mungu wako
  rationale: ‘Kwa ajili ya’ linadumisha uhusiano wa uwakilishi na kusudi bila kuufafanua kupita maandishi.
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: Kwa sababu Mungu wako aliwapenda Israeli
  rationale: Beth hapa linaeleweka vizuri kwa maana ya sababu, na wingi wa ‘aliwa-’ huichukulia Israeli kuwa watu kwa pamoja.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: ili awathibitishe milele
  rationale: Kiambishi cha Kiebrania ni umoja wa kisarufi lakini kinarejelea Israeli kama taifa au watu kwa pamoja; Kiswahili cha kawaida huruhusu rejeo la wingi kwa watu hao.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: alikuweka kuwa mfalme juu yao
  rationale: Katika muktadha wa kutawazwa, נתן ina maana ya kumweka au kumteua mtu katika nafasi ya kifalme.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: ili utekeleze haki na uadilifu
  rationale: ‘Utekeleze’ linaonyesha wajibu wa kifalme wa kutawala kwa hukumu ya haki, huku nomino mbili tofauti zikihifadhiwa.
theological_decisions:
- issue: כִּסְאוֹ (‘kiti chake cha enzi’) na ufalme wa Sulemani
  choice: kiti chake cha enzi
  alternative: kiti cha enzi cha kifalme bila kusisitiza kuwa ni cha Yahwe
  rationale: Kiwakilishi cha nafsi ya tatu kinarejelea Yahwe na kudumisha wazo la Mwandishi wa Mambo ya Nyakati kwamba mfalme wa ukoo wa Daudi anatawala chini ya mamlaka ya Mungu.
- issue: Uhusiano wa לְהַעֲמִידוֹ לְעוֹלָם na upendo wa Mungu pamoja na kumweka mfalme
  choice: Kwa sababu Mungu wako aliwapenda Israeli, ili awathibitishe milele, alikuweka...
  alternative: Kwa sababu Mungu wako aliwapenda Israeli na alitaka kuwathibitisha milele...
  rationale: Muundo wenye ‘ili’ unahifadhi kishazi cha kusudi cha Kiebrania bila kuongeza kitenzi ‘alitaka’; pia unaacha mvutano halisi kuhusu uhusiano wake wa kisintaksia na upendo wa Mungu au kumweka mfalme.
- issue: צְדָקָה katika kauli ya kifalme
  choice: uadilifu
  alternative: haki
  rationale: Kwa kuwa מִשְׁפָּט tayari imetafsiriwa ‘haki,’ ‘uadilifu’ huhifadhi tofauti ya istilahi mbili katika jozi ya kifalme ‘haki na uadilifu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha urudiaji wa ‘Mungu wako’ na taswira ya ‘kiti chake cha enzi.’ Jina la Mungu limetolewa kama ‘Yahwe’ kufuatana na maandishi ya chanzo. Alama zote za tanbihi [a] na [b] zimewekwa katika maandishi makuu.
