    text: Au, “Yahwe, Mungu wako, na abarikiwe.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kina kiambishi cha umoja: “ili kuifanya idumu milele,” kikirejelea Israeli kama taifa moja; kinaweza pia kueleweka kwa maana ya watu wa Israeli kwa pamoja.'
    reason: lexical_alternative
