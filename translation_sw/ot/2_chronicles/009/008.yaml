revisions:
- from: Yahwe Mungu wako na abarikiwe,[a] yeye aliyependezwa nawe na kukuweka juu ya kiti chake cha enzi uwe mfalme kwa ajili ya Yahwe Mungu wako. Kwa sababu Mungu wako aliwapenda Israeli, ili awathibitishe milele,[b] alikuweka kuwa mfalme juu yao, ili utekeleze haki na uadilifu.
  to: Na abarikiwe Yahwe, Mungu wako,[a] ambaye alipendezwa nawe na kukuweka juu ya kiti chake cha enzi ili uwe mfalme kwa ajili ya Yahwe, Mungu wako. Kwa sababu Mungu wako aliipenda Israeli, ili kuifanya idumu milele,[b] alikuweka kuwa mfalme juu yao, ili utekeleze haki na uadilifu.
  rationale: The revision makes the opening blessing formula idiomatic in Standard East African Swahili, clarifies apposition in the divine name/title, and renders the singular Hebrew object for Israel as a collective singular. It retains the source’s infinitival syntax and does not settle beyond the text whether the establishment phrase is linked chiefly to God’s love or to Solomon’s appointment.
