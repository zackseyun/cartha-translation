translation:
  language: sw
  text: Nao wafalme wote wa dunia walitafuta kufika mbele ya Sulemani[a] ili kusikia hekima yake, ambayo Mungu alikuwa ameweka katika moyo wa Sulemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “waliutafuta uso wa Sulemani,” nahau inayomaanisha walitafuta kufika mbele yake au kuonana naye.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: Nao wafalme wote wa dunia
  rationale: “Nao” huendeleza simulizi kwa kawaida; “wafalme wote wa dunia” huhifadhi usemi mpana wa Kiebrania katika muktadha wa sifa ya Sulemani kati ya mataifa.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: walitafuta kuonana na Sulemani
  rationale: Usemi halisi ni “walikuwa wakiutafuta uso wa Sulemani,” yaani kutafuta kufika mbele yake au kupata nafasi ya kuonana naye. Tafsiri hii ni ya kawaida katika Kiswahili bila kupoteza maana ya kusudi lao.
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: ili kuusikia hekima yake
  rationale: Kitenzi-jina kinaonyesha kusudi. “Kuusikia hekima yake” hudumisha usemi wa chanzo, yaani kusikia hekima ikionyeshwa katika maneno ya Sulemani.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: ambayo Mungu alikuwa ameweka moyoni mwake
  rationale: Ingawa נָתַן kwa msingi ni “alitoa/alitia,” pamoja na “moyoni mwake” Kiswahili cha kawaida husema “aliweka moyoni.” Wakati timilifu unaonyesha kuwa hekima hiyo ilikuwa tayari imetolewa na Mungu.
theological_decisions:
- issue: Mungu ndiye chanzo cha hekima ya Sulemani
  choice: ambayo Mungu alikuwa ameweka moyoni mwake
  alternative: ambayo Mungu alikuwa amempa
  rationale: Tafsiri iliyochaguliwa inahifadhi tendo la Mungu na pia picha ya Kiebrania ya moyo kama kitovu cha ufahamu na utu wa ndani, bila kuifanya kauli kuwa utoaji wa jumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuonana na” ni usemi wa kawaida unaowasilisha nahau ya Kiebrania; tanbihi huhifadhi picha yake halisi.
