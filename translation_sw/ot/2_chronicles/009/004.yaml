id: 2CH.9.4
reference: 2 Chronicles 9:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד מְשָׁרְתָ֜י/ו וּ/מַלְבּֽוּשֵׁי/הֶ֗ם וּ/מַשְׁקָי/ו֙ וּ/מַלְבּ֣וּשֵׁי/הֶ֔ם וַ/עֲלִיָּת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה ע֛וֹד בָּ֖/הּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: sw
  text: chakula cha meza yake, mpangilio wa viti vya watumishi wake, jinsi wahudumu wake walivyosimama na mavazi yao, wabeba vikombe wake na mavazi yao, na ngazi aliyotumia kupanda kwenda katika nyumba ya Yahwe[a], malkia akakosa pumzi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata kifungu sambamba katika 1 Wafalme 10:5, “sadaka za kuteketezwa alizotoa katika nyumba ya Yahwe.” Maandishi ya Kiebrania hapa yanaelekea zaidi kumaanisha “ngazi au njia aliyopandia.”
    reason: alternative_reading
  - marker: b
    text: Kwa Kiebrania, “hakukuwa tena na pumzi ndani yake,” nahau inayoonyesha kwamba alistaajabu sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: chakula cha mezani pake
  rationale: מַאֲכָל ni chakula au riziki ya kuliwa. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha picha halisi ya chakula kilichoandaliwa mezani mwa mfalme.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: mahali watumishi wake walipoketi
  rationale: מוֹשָׁב inaweza kumaanisha mahali pa kuketi au mpangilio wa viti. Kauli hii inaonyesha mpangilio wa watumishi wa kifalme bila kuwalazimisha kueleweka kama watumwa.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: jinsi wahudumu wake walivyosimama
  rationale: מַעֲמַד ina wazo la kusimama au kuwa katika kituo fulani, na מְשָׁרְתָיו ni wahudumu waliomhudumia mfalme. Tafsiri inadumisha tofauti yao na watumishi waliotajwa kabla.
- source_word: מַלְבּוּשֵׁיהֶם
  choice: mavazi yao
  rationale: Neno hilo linamaanisha mavazi au nguo; “mavazi” ni neno la sasa, lenye heshima na linalofaa mazingira ya kifalme.
- source_word: מַשְׁקָיו
  choice: wanyweshaji wake
  rationale: Katika mazingira ya ikulu, neno hili linawahusu watu waliokuwa na jukumu la kumhudumia mfalme vinywaji. “Wanyweshaji” huepuka kuingiza cheo cha kisasa kisicholingana kabisa na utamaduni huo.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: ngazi aliyopandia kwenda katika nyumba ya Yahwe
  rationale: Kwa maandishi ya Kimasora, עֲלִיָּה hapa hueleweka kwa kawaida kuwa njia ya kupandia au ngazi. Tafsiri kuu inafuata ushahidi huu, huku usomaji wa sadaka za kuteketezwa katika kifungu sambamba ukihifadhiwa katika tanbihi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: בֵּית ni “nyumba,” na jina la agano יְהוָה limetolewa kwa Kiswahili kama “Yahwe.”
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: Hakubakiwa na pumzi
  rationale: רוּחַ inaweza kumaanisha pumzi, roho au upepo. Hapa ni nahau ya mshangao mkubwa; tafsiri inadumisha picha halisi ya Kiebrania badala ya kuibadili moja kwa moja kuwa maelezo ya hisia.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יְהוָה. “Yahwe” hulitambulisha kama jina maalumu na haliongezi maana ya cheo ambayo haijaandikwa hapa.
- issue: Maana ya עֲלִיָּתוֹ katika muktadha wa nyumba ya Yahwe
  choice: ngazi aliyopandia
  alternative: sadaka za kuteketezwa alizotoa
  rationale: Maandishi ya Kimasora katika 2 Mambo ya Nyakati 9:4 yanaunga mkono “kupandia/ngazi,” lakini kifungu sambamba katika 1 Wafalme 10:5 kimesababisha mapokeo ya usomaji unaohusu sadaka. Utata huo haujatatuliwa kimya kimya bali umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na picha halisi za mazingira ya ikulu zimehifadhiwa; nahau ya mwisho imeachwa karibu na Kiebrania na kufafanuliwa katika tanbihi.
