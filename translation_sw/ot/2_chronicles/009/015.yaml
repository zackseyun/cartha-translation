translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kueleweka kwa msomaji wa kawaida; ‘ngao kubwa’ huhifadhi utofauti wa neno la Kiebrania, na tanbihi huweka wazi kwamba kipimo cha shekeli hakikutajwa moja kwa moja katika maandishi.
