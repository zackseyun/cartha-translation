base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: sw
  text: Mfalme Sulemani akatengeneza ngao kubwa mia mbili za dhahabu iliyopigwa; shekeli mia sita[a] za dhahabu iliyopigwa ziliwekwa juu ya kila ngao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja moja, “mia sita za dhahabu iliyopigwa ziliwekwa juu ya ngao ile moja.” Kiebrania kinadokeza kipimo cha uzito; neno “shekeli” limeongezwa ili kuweka maana wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה humaanisha ‘kufanya/kutengeneza’; ‘akatengeneza’ kinafaa kwa utengenezaji wa ngao na kinaendeleza masimulizi kwa njia ya kawaida ya Kiswahili.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Mfalme Sulemani
  rationale: Hiki ndicho kiswahili cha kawaida na cha heshima kwa cheo cha kifalme kikifuatiwa na jina.
- source_word: מָאתַיִם צִנָּה
  choice: ngao kubwa mia mbili
  rationale: צִנָּה kwa kawaida ni ngao kubwa ya kulinda sehemu kubwa ya mwili, tofauti na aina ndogo ya ngao; ‘ngao kubwa’ inalinda utofauti huo.
- source_word: זָהָב שָׁחוּט
  choice: dhahabu iliyofuliwa
  rationale: שָׁחוּט hapa hueleza dhahabu iliyopigwa na kutandazwa kwa ajili ya kutengeneza au kufunika ngao; ‘iliyofuliwa’ ni usemi mfupi na wenye hadhi katika muktadha wa ufundi wa metali.
- source_word: שֵׁשׁ מֵאוֹת
  choice: mia sita
  rationale: Ni tafsiri ya moja kwa moja ya namba hiyo.
- source_word: יַעֲלֶה עַל
  choice: ziliwekwa kwenye
  rationale: Kiebrania kina picha ya kiasi cha dhahabu ‘kwenda juu ya’ ngao. ‘Ziliwekwa kwenye’ ni Kiswahili cha kawaida kinachohifadhi wazo la dhahabu kutumiwa juu ya ngao bila kudai kwa uhakika kwamba iliifunika yote.
- source_word: הַצִּנָּה הָאֶחָת
  choice: kila ngao
  rationale: Ingawa kwa neno moja moja ni ‘ngao ile moja,’ katika hesabu hii usemi huo ni wa mgawanyo na kwa kawaida humaanisha kiasi kilichotumiwa kwa kila ngao.
- source_word: '[kipimo kinachodokezwa baada ya שֵׁשׁ מֵאוֹת]'
  choice: shekeli
  rationale: Kiebrania hakitaji wazi kipimo baada ya ‘mia sita,’ lakini muktadha unadokeza uzito wa dhahabu. ‘Shekeli’ huweka maana wazi huku tanbihi ikionyesha kuwa neno hilo limejazwa.
