base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: sw
  text: Ndipo akamwambia mfalme, “Habari niliyoisikia katika nchi yangu kuhusu maneno yako na hekima yako ilikuwa ya kweli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo akamwambia
  rationale: Kauli hii inaendeleza mfuatano wa simulizi. ‘Ndipo’ na kitenzi cha masimulizi ‘akamwambia’ ni Kiswahili cha kawaida kinachohifadhi mtiririko huo.
- source_word: אֶל־הַמֶּלֶךְ
  choice: mfalme
  rationale: Katika Kiswahili, ‘akamwambia mfalme’ humtaja kwa kawaida na kwa wazi yule aliyeambiwa, bila kuhitaji kutafsiri kihusishi cha Kiebrania neno kwa neno.
- source_word: אֱמֶת הַדָּבָר
  choice: Habari ... ilikuwa ya kweli
  rationale: Katika muktadha huu דָּבָר ni taarifa au habari iliyosikiwa, na muundo huu unaeleza kwa Kiswahili cha asili kwamba taarifa hiyo ilikuwa ya kweli.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: niliyoisikia
  rationale: Hii ni tafsiri ya kawaida ya kishazi rejeshi, huku upatanisho wa ‘-yo-’ ukirejelea ‘habari.’
- source_word: בְּאַרְצִי
  choice: katika nchi yangu
  rationale: Inahifadhi wazi maana ya mahali pamoja na kiambishi cha nafsi ya kwanza umoja.
- source_word: עַל־דְּבָרֶיךָ
  choice: kuhusu maneno yako
  rationale: דְּבָרֶיךָ inaweza kumaanisha maneno, mambo, au shughuli zako. ‘Maneno yako’ ndiyo tafsiri ya moja kwa moja na inadumisha upana fulani wa maana bila kuingiza wazo la mafanikio lisilotajwa wazi.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: na hekima yako
  rationale: Ni tafsiri ya moja kwa moja, ya asili, na inadumisha mada kuu ya hekima katika kifungu hiki.
