  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Swali la balagha la Kiebrania limehifadhiwa, pamoja na tofauti kati ya ‘nabii’ na ‘mwonaji.’
