source:
  edition: WLC
  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: sw
  text: Matendo mengine ya Sulemani, tangu mwanzo hadi mwisho, je, hayakuandikwa katika kumbukumbu za Nathani nabii,[a] katika unabii wa Ahiya Mshilo, na katika maono ya Ido mwonaji kuhusu[b] Yeroboamu mwana wa Nebati?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno ya Nathani nabii” au “habari ya Nathani nabii.” Neno la Kiebrania linaweza kumaanisha maneno yaliyosemwa au kumbukumbu iliyoandikwa; hapa huenda linarejelea chanzo cha maandishi.
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya,” na huenda “dhidi ya Yeroboamu mwana wa Nebati.” Kihusishi cha Kiebrania kina maana kadhaa zinazohusiana; “kuhusu” kinafaa zaidi katika muktadha huu wa kutaja chanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: Matendo mengine ya Sulemani
  rationale: Katika fomula za muhtasari wa kifalme, דִּבְרֵי hurejelea kwa upana matendo au mambo ya mfalme, si maneno yake pekee. ‘Matendo mengine’ ni Kiswahili cha kawaida kinachoeleza yaliyosalia katika simulizi.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: tangu mwanzo hadi mwisho
  rationale: Usemi huu unahusu kipindi chote cha historia ya Sulemani; tafsiri hii ni ya asili na inadumisha maana yake jumuishi.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Hii inadumisha muundo wa swali la balagha unaotumiwa katika fomula ya kutaja vyanzo, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: katika kumbukumbu za Nathani nabii
  rationale: Katika muktadha wa kutaja chanzo cha maandishi, דִּבְרֵי inaelekea kumaanisha habari au kumbukumbu zilizoandikwa. ‘Katika’ huwasilisha kwa kawaida uhusiano na chanzo hicho.
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: unabii wa Ahiya Mshilo
  rationale: נְבוּאָה ni ‘unabii’; ‘Mshilo’ ni namna ya kawaida ya Kiswahili ya kuonyesha kwamba Ahiya alitoka Shilo.
- source_word: וּבַחֲזוֹת יֶעְדּוֹ הַחֹזֶה
  choice: na katika maono ya Ido mwonaji
  rationale: חֲזוֹת humaanisha maono ya ufunuo, na ‘mwonaji’ hudumisha tofauti ya cheo חֹזֶה na נָבִיא, ‘nabii.’
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: kuhusu Yeroboamu mwana wa Nebati
  rationale: עַל inaweza kumaanisha ‘kuhusu,’ ‘juu ya,’ au katika mazingira fulani ‘dhidi ya.’ Katika orodha hii ya vyanzo, ‘kuhusu’ inafaa zaidi kama utambulisho wa mada bila kuficha uwezekano mwingine, ambao umeonyeshwa katika tanbihi.
