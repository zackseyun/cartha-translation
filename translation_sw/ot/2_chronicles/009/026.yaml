lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: alitawala
  rationale: Muundo wa kitenzi היה pamoja na kivumishi-tendaji מוֹשֵׁל unaeleza hali ya kutawala wakati uliopita; ‘alitawala’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: בְּכָל הַמְּלָכִים
  choice: juu ya wafalme wote
  rationale: Baada ya משל, kihusishi בְּ kinaonyesha wale waliokuwa chini ya mamlaka yake; ‘juu ya’ huhifadhi maana ya ukuu juu ya wafalme wengine.
- source_word: מִן הַנָּהָר
  choice: kuanzia ule Mto[a]
  rationale: Kiebrania kinasema kihalisi ‘Mto’; ‘ule Mto’ huhifadhi namna hiyo ya rejeo bila kuingiza jina Eufrate katika matini kuu.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: mpaka nchi ya Wafilisti
  rationale: Tafsiri hii ni ya wazi, ya asili, na inabaki karibu na usemi wa Kiebrania unaoonyesha upeo wa eneo.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: na mpaka mpaka wa Misri
  rationale: גְּבוּל ni mpaka wa eneo; urudiaji wa ‘mpaka’ unaeleweka katika Kiswahili kwa kuwa neno la kwanza ni kihusishi na la pili ni nomino.
