  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: sw
  text: Naye alitawala juu ya wafalme wote, kuanzia ule Mto[a] hadi nchi ya Wafilisti, na hadi mpaka wa Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ule Mto” huenda unarejelea Mto Eufrate, rejeo la kawaida la kijiografia katika Biblia ya Kiebrania.
