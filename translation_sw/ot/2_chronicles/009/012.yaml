  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַ֖ד אֲשֶׁר הֵבִ֣יאָה אֶל הַ/מֶּ֑לֶךְ וַֽ/תַּהֲפֹ֛ךְ וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: sw
  text: Mfalme Sulemani akampa malkia wa Sheba kila alichotamani, chochote alichoomba, zaidi ya yale aliyokuwa amemletea mfalme.[a] Kisha malkia akageuka, akaenda nchini kwake[b], yeye pamoja na watumishi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbali na yale aliyokuwa amemletea mfalme.” Kauli ya Kiebrania inaweza kueleweka kuwa inatofautisha zawadi za Sulemani na zawadi ambazo malkia alikuwa amemletea.
    reason: lexical_alternative
  - marker: b
    text: Au, “akarudi, akaenda nchini kwake.” Kiebrania kinasema kihalisi, “akageuka, akaenda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: akampa
  rationale: Kitenzi hiki kwa kawaida humaanisha kutoa au kumpa mtu kitu; “akampa” ni cha kawaida na kinafaa katika muktadha wa zawadi.
- source_word: מַלְכַּת שְׁבָא
  choice: malkia wa Sheba
  rationale: Cheo kimetafsiriwa kwa Kiswahili, huku jina la mahali likihifadhiwa kama Sheba, jina linalotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: כָּל חֶפְצָהּ
  choice: kila alichotamani
  rationale: חֵפֶץ inaweza kumaanisha tamaa, mapendezi, au kitu kinachotamaniwa. Kauli hii ni ya asili katika Kiswahili na inaonyesha vitu alivyovitaka bila kuwa nzito.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: chochote alichoomba
  rationale: Hufafanua kwamba malkia alipokea mambo aliyoyaomba; “chochote” huhifadhi upana wa usemi wa Kiebrania.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: zaidi ya yale aliyokuwa amemletea mfalme
  rationale: מִלְּבַד inaweza kuonyesha jambo lililo kando ya au la nyongeza. “Zaidi ya” huhifadhi maana hiyo ya kulinganisha/kuongeza, huku tanbihi ikitaja uwezekano wa “mbali na.”
- source_word: וַתַּהֲפֹךְ
  choice: akageuka
  rationale: Hii ndiyo maana ya karibu ya kitenzi; pamoja na “akaenda nchini kwake” inaonyesha kuondoka na kurudi bila kufuta taswira ya simulizi la Kiebrania.
- source_word: וַתֵּלֶךְ לְאַרְצָהּ
  choice: akaenda nchini kwake
  rationale: Kauli hii huhifadhi mwendo kuelekea nchi yake bila kuongeza wazi wazo la kurudi, ambalo linabaki kuwa tafsiri inayowezekana kutokana na muktadha.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: yeye pamoja na watumishi wake
  rationale: Katika msafara wa kifalme, “watumishi” ni neno pana na la kawaida; maandishi hayalengi kufafanua hadhi yao ya kijamii kwa undani.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Mfuatano wa vitenzi vya wakati uliopita kwa kiambishi “aka-” unadumisha mtiririko wa simulizi. Utata wa מִלְּבַד na maana ya וַתַּהֲפֹךְ umehifadhiwa kwa tanbihi badala ya kuamuliwa kimyakimya.
