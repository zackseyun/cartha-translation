translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Merikebu’ hudumisha mazingira ya safari ndefu za baharini, na tofauti kati ya ‘zikienda Tarshishi’ katika kutajwa kwa kwanza na ‘merikebu za Tarshishi’ katika kutajwa kwa pili imehifadhiwa.
