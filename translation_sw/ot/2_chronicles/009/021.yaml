  text: כִּֽי אֳנִיּ֤וֹת לַ/מֶּ֨לֶךְ֙ הֹלְכ֣וֹת תַּרְשִׁ֔ישׁ עִ֖ם עַבְדֵ֣י חוּרָ֑ם אַחַת֩ לְ/שָׁל֨וֹשׁ שָׁנִ֜ים תָּב֣וֹאנָה אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ נֹֽשְׂאוֹת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קוֹפִ֖ים וְ/תוּכִּיִּֽים־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: sw
  text: Kwa maana mfalme alikuwa na merikebu zilizokuwa zikienda Tarshishi pamoja na watumishi wa Huramu. Kila baada ya miaka mitatu, merikebu za Tarshishi zilikuwa zikija, zikiwa zimebeba dhahabu, fedha, pembe za ndovu, nyani na tausi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kasuku”; utambulisho wa istilahi hii ya Kiebrania hauna uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaanzisha maelezo yanayoonyesha sababu au msingi wa utajiri wa mfalme katika muktadha, huku kikidumisha mtiririko wa simulizi.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: mfalme alikuwa na merikebu
  rationale: Kirai cha Kiebrania chenye maana halisi ya ‘merikebu kwa/za mfalme’ kinaonyesha umilikaji; Kiswahili cha kawaida hutumia ‘alikuwa na’.
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: zilizokuwa zikienda Tarshishi
  rationale: Muundo wa kitenzi pamoja na jina la mahali unaeleweka kwa kawaida kuwa unaonyesha safari yenye Tarshishi kama kituo chake.
- source_word: עִם עַבְדֵי חוּרָם
  choice: pamoja na watumishi wa Huramu
  rationale: Neno עֲבָדִים hapa linawahusu watu waliokuwa katika utumishi wa kifalme wa Huramu, bila kusisitiza hali ya utumwa.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: Mara moja kila baada ya miaka mitatu
  rationale: Hii ni tafsiri ya kawaida na wazi ya usemi wa wakati unaojirudia.
- source_word: תָּבֹאנָה
  choice: zilikuwa zikija
  rationale: Kitenzi kisichokamilika kinaonyesha tendo lililokuwa likijirudia katika simulizi la wakati uliopita.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: merikebu za Tarshishi
  rationale: Muundo huu wa nomino umehifadhiwa; unaweza kuonyesha merikebu zilizohusishwa na Tarshishi au biashara yake, bila kulazimisha maana kwamba zilitoka huko.
- source_word: נֹשְׂאוֹת
  choice: zikiwa zimebeba
  rationale: Hueleza mizigo ambayo merikebu hizo zilikuwa zikisafirisha zilipokuja.
- source_word: זָהָב וָכֶסֶף
  choice: dhahabu, fedha
  rationale: Majina ya kawaida ya bidhaa hizi; kiunganishi cha orodha kimetolewa kwa mtindo wa asili wa Kiswahili hadi bidhaa ya mwisho.
- source_word: שֶׁנְהַבִּים
  choice: pembe za ndovu
  rationale: Hili ni jina la asili na linaloeleweka la bidhaa ya ivory katika Kiswahili.
- source_word: וְקוֹפִים
  choice: nyani
  rationale: Neno hilo linaweza kumaanisha jamii ya tumbili au sokwe; ‘nyani’ ni neno pana na la kawaida linalofaa katika orodha hii.
- source_word: וְתוּכִּיִּים
  choice: tausi
  rationale: Utambulisho wa mnyama au ndege huyu wa Kiebrania hauna uhakika; ‘tausi’ ni tafsiri ya kimapokeo, huku uwezekano mwingine ukionyeshwa katika tanbihi.
