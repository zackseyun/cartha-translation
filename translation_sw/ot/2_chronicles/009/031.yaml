  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: sw
  text: Sulemani akalala pamoja na baba zake[a], nao wakamzika katika Mji wa Daudi, baba yake. Rehoboamu mwanawe akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akalala pamoja na baba zake,” usemi wa kawaida wa kifo na maziko miongoni mwa mababu zake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Huhifadhi nahau ya Kiebrania inayotumia kulala kama usemi wa kawaida kuhusu kufa, bila kuibadilisha moja kwa moja kuwa “akafa”.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Hufuata kwa karibu usemi wa kifalme wa Kiebrania na kuhifadhi mwangwi wake wa kibiblia; tanbihi inafafanua kuwa unahusu kufa na kuungana na waliotangulia.
- source_word: וַיִּקְבְּרֻהוּ
  choice: nao wakamzika
  rationale: Kitenzi cha Kiebrania ni cha wingi katika hali tendaji, chenye kiambishi cha yambwa; Kiswahili kinaweza kuacha watendaji bila kutajwa kwa majina.
- source_word: בְּעִיר דָּוִיד
  choice: katika Mji wa Daudi
  rationale: Ni jina la mahali linalotambulika katika matumizi ya kibiblia; herufi kubwa zinaonyesha kuwa ni jina maalumu.
- source_word: אָבִיו
  choice: baba yake
  rationale: Daudi anaelezwa kwa uhusiano wake na Sulemani; “baba” ndiyo maana ya moja kwa moja katika muktadha huu.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kuwa mfalme au kutawala katika taarifa ya urithi wa ufalme.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Huwasilisha wazo la urithi au kuchukua nafasi ya mtawala aliyetangulia kwa kufuata kwa karibu muundo wa Kiebrania.
