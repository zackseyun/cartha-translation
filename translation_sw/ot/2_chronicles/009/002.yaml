lexical_decisions:
- source_word: וַיַּגֶּד
  choice: akamjibu
  rationale: Kitenzi נגד kimsingi humaanisha ‘kumwambia’ au ‘kutangaza,’ lakini katika muktadha wa malkia kumjaribu Sulemani kwa maswali magumu, ‘akamjibu’ huwasilisha maana inayokusudiwa kwa Kiswahili cha kawaida.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: maswali yake yote
  rationale: דבר inaweza kumaanisha ‘neno,’ ‘jambo,’ au ‘kitu.’ Muktadha unaonyesha kwamba ni mambo au maswali ambayo malkia alimletea Sulemani; tanbihi inahifadhi tafsiri halisi zaidi.
- source_word: נֶעְלַם
  choice: lililofichika
  rationale: Hali ya Niphal ya עלם ina maana ya kuwa limefichika au kusitirika. ‘Lililofichika’ inadumisha taswira ya Kiebrania bila kuibadili kuwa ‘lililomshinda.’
- source_word: דָּבָר
  choice: jambo
  rationale: Nomino hii hapa ni jambo au kitu chochote; pamoja na ukanushaji, ‘hakuna jambo’ ni usemi wa asili na sahihi wa Kiswahili.
- source_word: מִשְּׁלֹמֹה
  choice: kwa Sulemani
  rationale: Kihusishi מן pamoja na נעלם humtaja mtu ambaye jambo limefichika kwake. ‘Kwa Sulemani’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: ambalo hakumweleza
  rationale: Kishazi hiki kinasema kwamba hakuna jambo lililofichika kwa Sulemani ambalo hakumjulisha malkia. ‘Hakumweleza’ linafaa katika muktadha wa kufafanua majibu, huku tanbihi ikihifadhi maana ya moja kwa moja ya ‘kumwambia.’
