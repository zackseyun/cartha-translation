  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: sw
  text: Malkia wa Sheba alisikia kuhusu umaarufu wa Sulemani[a], akaja Yerusalemu ili amjaribu Sulemani kwa mafumbo[b], akiwa na msafara mkubwa sana na ngamia waliobeba manukato, dhahabu nyingi sana, na mawe ya thamani. Alipomjia Sulemani, alizungumza naye kuhusu yote yaliyokuwa moyoni mwake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “habari kuhusu Sulemani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maswali magumu.”
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “yote yaliyokuwa moyoni mwake,” yaani mawazo, maswali, na mahangaiko yote aliyokuwa nayo.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: umaarufu
  rationale: Katika usemi wa kusikia שֵׁמַע ya mtu, neno hili humaanisha habari au sifa zilizoenea kumhusu. “Umaarufu” ni Kiswahili cha kawaida kinachoonyesha kwamba habari za Sulemani zilikuwa zimeenea, huku tanbihi ikihifadhi uwezekano wa “habari.”
- source_word: לְנַסּוֹת
  choice: ili amjaribu
  rationale: Kitenzi נסה hapa kinaonyesha kumtia Sulemani katika jaribio la kiakili, si kumshawishi atende dhambi. “Amjaribu” kinafuatana kwa kawaida na mafumbo yaliyotumiwa katika jaribio hilo.
- source_word: בְחִידוֹת
  choice: kwa mafumbo
  rationale: חִידוֹת ni mafumbo, vitendawili, au maswali yenye utata. “Mafumbo” ni neno la Kiswahili lenye hadhi na upana unaofaa katika mazungumzo ya kifalme; tanbihi inaonyesha maana mbadala ya maswali magumu.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Ingawa Kiebrania kina kihusishi ב, baada ya kitenzi cha mwendo mahali hapa panaeleweka kuwa mwisho wa safari. Kiswahili hutumia kwa kawaida “akaja Yerusalemu” bila kihusishi cha ziada.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: na msafara mkubwa sana
  rationale: חַיִל inaweza kumaanisha nguvu, jeshi, mali, au kundi la watu. Katika muktadha wa safari yenye ngamia na zawadi za kifahari, “msafara mkubwa sana” huwasilisha vizuri kundi kubwa lililoandamana naye bila kulifanya kwa lazima kuwa jeshi.
- source_word: בְּשָׂמִים
  choice: manukato
  rationale: Neno hili linataja vitu vyenye harufu nzuri, kama vikolezo au mafuta yenye harufu. “Manukato” linafaa kwa muktadha huu wa zawadi za kifalme na huepuka kuifanya maana kuwa viungo vya kupikia pekee.
- source_word: לָרֹב
  choice: nyingi sana
  rationale: Usemi huu unaonyesha wingi mkubwa wa dhahabu. “Dhahabu nyingi sana” ni wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: אֶבֶן יְקָרָה
  choice: mawe ya thamani
  rationale: Ingawa umbo la Kiebrania ni la umoja, usemi huo hutumiwa kwa maana ya jumla katika orodha hii. Wingi wa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: alizungumza naye
  rationale: דבר pamoja na עִם huonyesha kuzungumza pamoja na mtu na inaweza kudokeza mazungumzo ya pande mbili. “Alizungumza naye” huhifadhi maana hiyo.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: kuhusu yote yaliyokuwa moyoni mwake
  rationale: Usemi huu unahusu mawazo, maswali, na mahangaiko yote aliyokuwa nayo. “Moyoni mwake” huhifadhi taswira ya Kiebrania badala ya kuifupisha kuwa akili au mawazo tu.
