  to: Malkia wa Sheba alisikia kuhusu umaarufu wa Sulemani[a], akaja Yerusalemu ili amjaribu Sulemani kwa mafumbo[b], akiwa na msafara mkubwa sana na ngamia waliobeba manukato, dhahabu nyingi sana, na mawe ya thamani. Alipomjia Sulemani, alizungumza naye kuhusu yote yaliyokuwa moyoni mwake[c].
