translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ndefu ya Kiebrania imegawanywa ili isomeke kwa urahisi bila kuondoa hatua zake kuu. “Msafara” na “manukato” ni maneno yanayoeleweka kwa wasomaji wa kawaida na yanafaa kwa mazingira ya kifalme.
