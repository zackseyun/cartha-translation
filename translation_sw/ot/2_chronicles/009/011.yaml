source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָֽ/אַלְגּוּמִּ֜ים מְסִלּ֤וֹת לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים וְ/לֹא נִרְא֥וּ כָ/הֵ֛ם לְ/פָנִ֖ים בְּ/אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: sw
  text: Mfalme alitengeneza kwa mbao za algumu[b] njia za kufikia[a] nyumba ya Yahweh na nyumba ya mfalme, na vinubi na vinanda kwa ajili ya waimbaji. Vitu kama hivyo havikuwa vimewahi kuonekana hapo awali katika nchi ya Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ngazi.” Neno la Kiebrania linaweza kumaanisha njia zilizojengwa za kufikia majengo au ngazi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “algumu.” Katika kifungu kinacholingana cha 1 Wafalme 10:12 mbao hizi huitwa “almugu.” Aina halisi ya mti haijulikani.'
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: mbao za algumu
  rationale: Hili ni jina adimu la mbao za thamani zilizoagizwa kutoka nje. Kwa kuwa aina halisi ya mti haijulikani, jina la Kiebrania limetoholewa badala ya kubashiri aina fulani ya mti.
- source_word: מְסִלּוֹת
  choice: njia za kupandia
  rationale: Kwa kawaida neno hili humaanisha njia iliyoinuliwa; katika muktadha wa majengo linaweza kumaanisha njia za kufikia jengo au ngazi. ‘Njia za kupandia’ ni ya asili katika Kiswahili na haiamui kwa uhakika zaidi ya ushahidi wa Kiebrania.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: kwa ajili ya nyumba ya Yahweh na nyumba ya mfalme
  rationale: ‘Nyumba’ huhifadhi maana ya moja kwa moja ya בַּיִת na nahau ya Kiebrania bila kuibadili kimya kuwa ‘hekalu’ au ‘ikulu.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi, Yahweh.
- source_word: כִנֹּרוֹת וּנְבָלִים
  choice: vinubi na vinanda
  rationale: Maneno haya yanataja ala mbili tofauti za nyuzi. Majina ya Kiswahili yanazitofautisha kwa lugha inayoeleweka, ingawa umbo kamili la ala za kale halijulikani.
- source_word: לַשָּׁרִים
  choice: kwa ajili ya waimbaji
  rationale: Umbo hili kutoka mzizi שׁיר linamaanisha moja kwa moja wale wanaoimba.
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים
  choice: Vitu kama hivyo havikuwa vimewahi kuonekana hapo awali
  rationale: Kauli hii huhifadhi maana ya kwamba vitu hivyo havikuwa na mfano uliowahi kuonekana, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: katika nchi ya Yuda
  rationale: Huhifadhi nomino ya wazi ‘nchi’ iliyopo katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘akatumia ... kutengeneza’ ili kutoa kwa njia ya kawaida muundo wa Kiebrania ‘akatengeneza kwa mbao,’ huku ‘pamoja na’ ikionyesha kuwa mbao hizo pia zilitumiwa kutengeneza ala. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
