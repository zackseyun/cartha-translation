  naturalness: Muundo "na mierezi iwe mingi" hausikiki kamili katika simulizi la Kiswahili, kwa kuwa unaonekana kama kauli ya matamanio bila kitenzi tawala. "Na akaifanya mierezi iwe mingi" ni wa asili, sambamba, na wenye hadhi ya kifasihi.
