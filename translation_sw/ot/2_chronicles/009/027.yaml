translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganisho wa Kiebrania umeelezwa kwa ‘nyingi kama’ ili maana ya wingi iwe wazi, na jina la eneo la kihistoria limehifadhiwa katika tanbihi.
