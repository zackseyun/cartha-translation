base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: sw
  text: Mfalme akaifanya fedha iwe nyingi kama mawe katika Yerusalemu, na akaifanya mierezi iwe mingi kama mikuyu katika nchi tambarare[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Shefela,” eneo la vilima vya chini vya Yuda, magharibi mwa nchi ya milima ya kati.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: akaifanya ... iwe nyingi
  rationale: Kitenzi hiki kwa msingi ni ‘aliweka/alitoa,’ lakini katika muktadha huu kinaonyesha kwamba mfalme alisababisha fedha na mierezi ipatikane kwa wingi. Muundo huu ni wa asili katika Kiswahili na huhifadhi maana hiyo.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: Hapa neno linamaanisha madini ya fedha, si lazima sarafu au pesa zilizotengenezwa.
- source_word: כָּאֲבָנִים
  choice: nyingi kama mawe
  rationale: Ulinganisho unahusu wingi na upatikanaji wa kawaida wa mawe, wala si kufanana kwa sura.
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Hii ni tafsiri ya mahali; ‘huko’ inaunganisha sentensi kwa lugha ya kawaida na yenye hadhi.
- source_word: הָאֲרָזִים
  choice: mierezi
  rationale: Wingi huu unaweza kurejelea miti ya mierezi au mbao zake kama bidhaa; ‘mierezi’ huhifadhi upana huo.
- source_word: כַּשִּׁקְמִים
  choice: kama mikuyu
  rationale: שִׁקְמִים ni mikuyu aina ya sycamore fig iliyokuwa ya kawaida katika eneo hilo; ‘mikuyu’ ni neno la Kiswahili linaloeleweka bila kuingiza spishi nyingine ya kisasa iitwayo sycamore.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: katika nchi ya vilima vya chini
  rationale: שְׁפֵלָה ni eneo maalumu la vilima vya chini magharibi mwa nchi ya milima ya kati ya Yuda. Tafsiri hii inaeleza sura ya eneo huku tanbihi ikihifadhi jina lake la kihistoria.
- source_word: לָרֹב
  choice: iwe mingi
  rationale: Kirai hiki hukazia wingi; maana yake imeunganishwa kwa kawaida katika ulinganisho wa mierezi na mikuyu.
