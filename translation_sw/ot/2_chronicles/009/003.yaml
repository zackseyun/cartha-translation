  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikulu aliyokuwa ameijenga.” Kiebrania kinasema “nyumba”; katika mazingira haya ya kifalme, huenda neno hilo linarejelea hasa ikulu ya Sulemani au majengo yake.
