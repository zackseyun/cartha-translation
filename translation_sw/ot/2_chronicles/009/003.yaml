lexical_decisions:
- source_word: וַתֵּרֶא
  choice: alipoona
  rationale: Muundo wa usimulizi unaendeleza simulizi na hapa una nguvu ya wakati; “alipoona” huunganisha sentensi hii kwa kawaida na mwendelezo wake katika mstari unaofuata.
- source_word: מַלְכַּת שְׁבָא
  choice: Malkia wa Sheba
  rationale: Mfuatano huu wa nomino humtambulisha malkia kwa nchi au eneo lake; “Malkia wa Sheba” ni Kiswahili cha kawaida na sanifu.
- source_word: אֵת
  choice: '[halijatafsiriwa kwa neno tofauti]'
  rationale: Ni alama ya yambwa tendwa katika Kiebrania, isiyo na neno linalolingana nayo moja kwa moja katika Kiswahili; kazi yake inaonekana katika mpangilio wa sentensi.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: hekima ya Sulemani
  rationale: Muundo wa umilikaji umetafsiriwa kwa kawaida katika Kiswahili. “Hekima” hapa inahusu ufahamu na uwezo wa Sulemani wa kupambanua mambo, si wingi wa maarifa pekee.
- source_word: וְהַבַּיִת
  choice: na nyumba
  rationale: בַּיִת kimsingi ni “nyumba.” Katika mazingira haya ya kifalme huenda ikamaanisha ikulu au majengo ya ikulu, lakini matini kuu imehifadhi maana pana ya neno la Kiebrania; uwezekano wa “ikulu” umetolewa katika tanbihi.
- source_word: אֲשֶׁר בָּנָה
  choice: aliyokuwa ameijenga
  rationale: Kishazi hiki kinarejelea “nyumba.” Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba ujenzi ulikuwa umekamilika kabla ya malkia kuuona.
