  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: sw
  text: Lakini sikuamini maneno yao mpaka nilipokuja na macho yangu mwenyewe yakaona. Na kumbe, sikuwa nimeambiwa hata nusu ya wingi wa hekima yako.[a] Umezidi habari niliyoisikia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukubwa wa hekima yako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Umeipita habari niliyoisikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: sikuamini
  rationale: Hifili ya אמן hapa humaanisha kukubali jambo kuwa la kweli au la kuaminika. ‘Sikuamini’ inafaa kwa mwitikio wa malkia kwa habari alizopewa.
- source_word: לְדִבְרֵיהֶם
  choice: maneno yao
  rationale: דבר kwa kawaida ni ‘neno’ au ‘jambo.’ ‘Maneno yao’ ni ya karibu na Kiebrania na katika muktadha yanaeleweka kuwa yale waliyoripoti.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: macho yangu mwenyewe yakaona
  rationale: Huhifadhi umbo na msisitizo wa Kiebrania, yaani uthibitisho wa moja kwa moja kwa kuona mwenyewe.
- source_word: וְהִנֵּה
  choice: na kumbe
  rationale: הִנֵּה huvuta fikira na kuonyesha mshangao. ‘Kumbe’ hutoa nguvu hiyo kwa Kiswahili cha sasa kwa njia ya asili.
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: wingi wa hekima yako
  rationale: מַרְבִּית inaweza kumaanisha wingi, ongezeko, au ukubwa. ‘Wingi wa hekima yako’ huhifadhi maana ya kiasi kikubwa bila kuifafanua kupita kiasi.
- source_word: הֻגַּד לִי
  choice: sikuwa nimeambiwa
  rationale: Hophal ya נגד ni kauli tendwa, ‘niliambiwa’ au ‘niliripotiwa.’ Wakati timilifu ‘sikuwa nimeambiwa’ unaonyesha habari ya kabla ya kuwasili kwake.
- source_word: יָסַפְתָּ עַל
  choice: umeipita
  rationale: יסף pamoja na על hapa huonyesha kuzidi au kwenda zaidi ya jambo. ‘Umeipita’ ni Kiswahili cha asili kinachoonyesha ulinganisho na habari iliyotangulia.
- source_word: הַשְּׁמוּעָה
  choice: habari
  rationale: שְׁמוּעָה ni jambo lililosikiwa, yaani habari au taarifa. ‘Habari’ ni neno la kawaida lisilodokeza kwamba taarifa hiyo ilikuwa uvumi usioaminika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Na kumbe’ limetumiwa badala ya ‘na tazama’ ili kuwasilisha mshangao wa הִנֵּה kwa usemi wa kawaida na wa asili. Viwakilishi vya nafsi vimeachwa katika umbo la kawaida la Kiswahili isipokuwa ‘mwenyewe,’ linalohifadhi msisitizo wa kuona kwa macho yake.
