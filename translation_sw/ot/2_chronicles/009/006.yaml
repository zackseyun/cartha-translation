  to: Lakini sikuamini maneno yao mpaka nilipokuja na macho yangu mwenyewe yakaona. Na kumbe, sikuwa nimeambiwa hata nusu ya wingi wa hekima yako.[a] Umezidi habari niliyoisikia.[b]
