translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Heri” huhifadhi mtindo wa sifa ya kifalme. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa; mpangilio wa sentensi unafuata kwa karibu muundo wa Kiebrania huku ukibaki wa asili katika Kiswahili.
