base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: sw
  text: Heri wanaume wako,[a] na heri watumishi wako hawa wanaosimama mbele yako daima[b] na kusikia hekima yako!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wako.” Neno la Kiebrania humaanisha wanaume; katika muktadha huu huenda linawarejelea watu wa ikulu ya mfalme.
    reason: lexical_alternative
  - marker: b
    text: “Kusimama mbele yako” ni usemi wa ikulu unaomaanisha kuhudhuria na kumtumikia mfalme.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heri
  rationale: Neno “heri” huonyesha hali ya kubarikiwa, kufanikiwa, au kuwa na hali inayotamanika; ni la kawaida na lenye hadhi katika Kiswahili bila kulazimisha maana kuwa furaha ya kihisia tu.
- source_word: אֲנָשֶׁיךָ
  choice: watu wako
  rationale: Ingawa neno la Kiebrania linaweza kumaanisha “wanaume wako,” katika mazingira ya ikulu linawarejelea watu wa mfalme au wahudumu wake. “Watu wako” ni Kiswahili cha asili na hakiongezi cheo mahususi kisichotajwa wazi.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika muktadha wa ikulu, neno hili linaonyesha wanaomtumikia mfalme; “watumishi” linafaa kuliko “watumwa,” ambalo lingesisitiza hali ya utumwa isiyolengwa hapa.
- source_word: אֵלֶּה
  choice: hawa
  rationale: Kiwakilishi hiki kinahifadhi nguvu ya kuonyesha watu waliopo au wanaorejelewa moja kwa moja.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: wanaosimama mbele yako
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania na pia nahau ya ikulu ya kuhudumu au kuhudhuria mbele ya mfalme.
- source_word: תָּמִיד
  choice: daima
  rationale: “Daima” huonyesha huduma yao ya kudumu au ya kawaida bila kudai lazima wawepo kila sekunde.
- source_word: וְשֹׁמְעִים
  choice: na kusikia
  rationale: Kitenzi cha Kiebrania kinaweza kuwa “kusikia” au “kusikiliza”; “kusikia” hudumisha upana huo na huendana na kitu chake, “hekima yako.”
- source_word: חָכְמָתֶךָ
  choice: hekima yako
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya hekima aliyo nayo na kuionyesha mfalme.
