base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: sw
  text: 'Hawa ndio waliomfanyia njama: Zabadi mwana wa Shimeathi, mwanamke wa Amoni, na Yehozabadi mwana wa Shimrithi, mwanamke wa Moabu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Kifungu hiki kinawatambulisha wahusika waliotajwa; muundo huu ni wa kawaida katika masimulizi ya Kiswahili na hauhitaji kurudia kiunganishi ‘na’ mwanzoni.
- source_word: הַמִּתְקַשְּׁרִים עָלָיו
  choice: waliomfanyia njama
  rationale: Kitenzi cha Kiebrania katika hitpaeli kinaonyesha watu walioungana katika njama, na עָלָיו humtaja mlengwa wa njama hiyo. Kiswahili hiki ni cha asili na kinahifadhi maana zote mbili.
- source_word: זָבָד
  choice: Zabadi
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida wa Kiswahili wa kuonyesha nasaba.
- source_word: שִׁמְעָת
  choice: Shimeathi
  rationale: Jina limetoholewa kutoka Kiebrania kwa kuzingatia matamshi na muundo wa Kiswahili.
- source_word: הָעַמּוֹנִית
  choice: mwanamke Mwamoni
  rationale: Umbo la Kiebrania ni la kike; kutaja ‘mwanamke’ kunaondoa utata na kuhifadhi jinsia iliyo wazi katika chanzo.
- source_word: וִיהוֹזָבָד
  choice: na Yehozabadi
  rationale: Kiunganishi na jina vimehifadhiwa, huku jina likitoholewa kwa mfumo unaofaa Kiswahili.
- source_word: שִׁמְרִית
  choice: Shimrithi
  rationale: Jina limetoholewa kutoka Kiebrania kwa umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: הַמּוֹאָבִית
  choice: mwanamke Mmoabi
  rationale: Umbo la Kiebrania ni la kike; tafsiri hii inabainisha kuwa Shimrithi alikuwa mwanamke wa Moabu.
