source:
  edition: WLC
  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: sw
  text: Nao wakaiacha nyumba ya Yahwe, Mungu wa baba zao, wakayatumikia Maashera[a] na sanamu. Basi ghadhabu ikaja juu ya Yuda na Yerusalemu kwa sababu ya hatia yao hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo za Ashera.” Neno la Kiebrania linarejelea vitu vya ibada vinavyohusishwa na Ashera, na huenda pia likadokeza mungu wa kike aliyeitwa Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: wakaiacha
  rationale: Kitenzi עזב kina maana ya kuacha au kutupa. “Wakaiacha” ni Kiswahili cha kawaida na katika muktadha huu kinaonyesha wazi kutokuwa waaminifu kwa Yahwe.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi usemi halisi wa Kiebrania, “nyumba ya Yahwe,” ambao katika muktadha unarejelea hekalu bila kulifanya tafsiri hiyo kuwa wazi kupita matini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Huhifadhi usemi wa kifamilia na wa agano katika Kiebrania kuliko tafsiri pana kama “Mungu wa mababu zao.”
- source_word: וַיַּעַבְדוּ
  choice: wakayatumikia
  rationale: עבד inaweza kumaanisha kutumikia au kuabudu. “Kutumikia” iko karibu na Kiebrania, huku muktadha wa kidini ukionyesha kuwa tendo hilo lilikuwa ibada.
- source_word: הָאֲשֵׁרִים
  choice: Maashera
  rationale: Umbo hili lililotoholewa huhifadhi wingi na hali mahususi ya kitamaduni ya neno hilo bila kuamua kama linamaanisha miungu ya kike, mifano yake, au vitu vya ibada vinavyohusiana na Ashera.
- source_word: הָעֲצַבִּים
  choice: sanamu
  rationale: Neno hili humaanisha sanamu za ibada na lina dhana hasi; “sanamu” ni wazi na la kawaida katika Kiswahili.
- source_word: וַיְהִי קֶצֶף
  choice: Basi ghadhabu ikaja
  rationale: Hutoa kwa Kiswahili cha asili matokeo yanayoonyeshwa na mfuatano wa simulizi, huku likihifadhi ufupi wa Kiebrania na kutotaja mwenye ghadhabu moja kwa moja.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: juu ya Yuda na Yerusalemu
  rationale: Huhifadhi taswira ya ghadhabu iliyowajia watu na maeneo hayo; “juu ya” ni ulinganifu wa karibu wa עַל katika muundo huu.
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: kwa sababu ya hatia yao hii
  rationale: Kiambishi ב kimetafsiriwa kwa maana ya kisababishi, na “hatia” huhifadhi dhana ya kuwajibika kimaadili; “hii” huhifadhi kiwakilishi cha kuonyesha זֹאת.
theological_decisions:
- issue: Mhusika mwenye ghadhabu
  choice: Ghadhabu imeachwa bila kuongezewa wazi kuwa ni “ya Mungu” au “ya Yahwe.”
  alternative: “Ghadhabu ya Yahwe ikaja” au “Mungu akawakasirikia.”
  rationale: Muktadha unaonyesha kuwa ni ghadhabu ya Mungu, lakini Kiebrania kinasema tu kwamba ghadhabu ilikuja. Tafsiri haiongezi mhusika ambaye matini imemwacha akiwa amedokezwa.
- issue: Maana ya אֲשֵׁרִים
  choice: Kutumia neno lililotoholewa “Maashera” katika matini kuu.
  alternative: “nguzo za Ashera” au “sanamu za Ashera.”
  rationale: Neno la Kiebrania linaweza kutaja vitu vya ibada vinavyohusishwa na Ashera na pia kuamsha wazo la mungu huyo wa kike. Kulitohowa kunahifadhi utata huo, na tanbihi inaeleza tafsiri ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Maashera” ni neno la kiufundi lisilo la kawaida, lakini limehifadhiwa ili kutoondoa utata wa kihistoria na wa kileksika; tanbihi inamsaidia msomaji wa kawaida.
