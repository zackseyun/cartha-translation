base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: sw
  text: Ndipo maafisa wote na watu wote wakafurahi, wakaleta michango yao na kuitupa ndani ya sanduku mpaka likajaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka walipomaliza.” Usemi wa Kiebrania unaweza kumaanisha kwa ujumla “mpaka kukamilika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: wakafurahi
  rationale: Kitenzi שמח kinaonyesha furaha; “wakafurahi” ni usemi wa kawaida na wenye hadhi unaofaa simulizi.
- source_word: כָל הַשָּׂרִים
  choice: maafisa wote
  rationale: שׂרים hapa ni wenye mamlaka au maafisa, si lazima wana wa kifalme; “maafisa” huepuka maana potovu ya “wakuu wa kifalme.”
- source_word: וְכָל הָעָם
  choice: na watu wote
  rationale: Tafsiri ya moja kwa moja inayohifadhi ujumla wa kundi lote.
- source_word: וַיָּבִיאוּ
  choice: wakaleta michango yao
  rationale: Kiwakilishi-yambwa hakikutajwa katika Kiebrania, lakini muktadha wa ukusanyaji wa fedha unaifanya “michango yao” kuwa ujazaji wa kawaida na wazi kwa Kiswahili.
- source_word: וַיַּשְׁלִיכוּ
  choice: na kuitia
  rationale: שלך kwa msingi ni kutupa au kuweka ndani. Katika Kiswahili, “kuitia ndani ya sanduku” huwasilisha kitendo cha kuweka michango humo kwa kawaida bila kudokeza kuitupa ovyo.
- source_word: לָאָרוֹן
  choice: ndani ya sanduku
  rationale: אָרוֹן hapa ni sanduku la kukusanyia michango, si Sanduku la Agano.
- source_word: עַד לְכַלֵּה
  choice: mpaka likajaa
  rationale: Usemi unaweza kumaanisha kufikia mwisho au ukamilifu. Muktadha unaruhusu sanduku kueleweka kuwa lilijazwa, lakini mbadala wa “mpaka walipomaliza” umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Kiima na maana ya עַד לְכַלֵּה
  choice: mpaka likajaa
  alternative: mpaka walipomaliza
  rationale: Kiebrania hakitaji wazi kiima cha hali ya kukamilika. Muktadha wa kutia michango sandukuni unaunga mkono kuelewa kwamba sanduku lilijaa, huku maana ya jumla ya kumaliza ikiendelea kuwa uwezekano halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo unahifadhi mwendo wa simulizi; tanbihi inalinda utata halisi wa mwisho wa mstari.
