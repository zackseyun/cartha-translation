  text: בֶּן שֶׁ֤בַע שָׁנִים֙ יֹאָ֣שׁ בְּ/מָלְכ֔/וֹ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: sw
  text: Yoashi alikuwa na umri wa miaka saba alipoanza kutawala, naye akatawala miaka arobaini huko Yerusalemu. Mama yake aliitwa Sibia, kutoka Beer-sheba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: alikuwa na umri wa miaka saba
  rationale: Hii ni njia ya kawaida na ya wazi ya Kiswahili ya kueleza fomula ya Kiebrania inayomaanisha kwamba alikuwa na miaka saba.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Kiambishi ב pamoja na umbo la kitenzi kinaonyesha wakati wa kuanza kwa utawala; tafsiri hii inatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki humaanisha kutawala au kuwa mfalme; “akatawala” huhifadhi nguvu ya kitenzi na mtiririko wa simulizi.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Ni matumizi ya kiambishi cha mahali; “huko” ni ya asili katika Kiswahili baada ya kutaja muda wa kutawala.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii ni tafsiri ya asili ya Kiswahili ya fomula “jina la mama yake lilikuwa,” huku ikihifadhi taarifa ileile.
- source_word: צִבְיָה
  choice: Sibia
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, likifuata konsonanti za Kiebrania צִבְיָה.
- source_word: מִבְּאֵר שָׁבַע
  choice: kutoka Beer-sheba
  rationale: Kiambishi מ־ kinaonyesha asili. Jina la mahali limehifadhiwa kwa utohozi unaotambulika na unaoakisi muundo wake wa sehemu mbili.
