base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: sw
  text: Basi wakafanya njama dhidi yake, wakampiga kwa mawe kwa amri ya mfalme, katika ua wa nyumba ya Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: wakafanya njama dhidi yake
  rationale: Katika muundo huu, קשר pamoja na עַל humaanisha kula njama dhidi ya mtu; tafsiri hii ni ya kawaida na hudumisha hatua ya pamoja yenye uadui.
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: wakampiga kwa mawe
  rationale: רגם humaanisha kumpiga mtu kwa mawe, na אֶבֶן hapa hutaja chombo cha tendo hilo. Kiswahili hiki ni cha asili na kinaonyesha wazi namna alivyauawa.
- source_word: בְּמִצְוַת
  choice: kwa amri ya
  rationale: מִצְוָה hapa ni agizo lenye mamlaka; usemi huu unadumisha uwajibikaji wa moja kwa moja wa mfalme.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Huhifadhi cheo kilichotumiwa katika Kiebrania bila kuingiza jina la Yoashi kutoka muktadha.
- source_word: בַּחֲצַר
  choice: katika ua
  rationale: חָצֵר ni eneo la wazi lililozungukwa katika jengo; 'ua' ni usemi wa kawaida wa Kiswahili unaofaa mazingira ya hekalu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi sitiari halisi ya 'nyumba' na kulitaja jina la agano יהוה kwa namna ya Kiswahili.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana Tetragramatoni moja kwa moja; 'Yahwe' hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inadumisha mpangilio wa sababu na mahali katika Kiebrania bila uradidi usio wa kawaida.
