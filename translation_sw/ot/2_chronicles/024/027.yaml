  to: Wanawe, matamko mengi dhidi yake[a], na kuweka msingi wa nyumba ya Mungu—tazama, mambo hayo yameandikwa katika Midrashi ya Kitabu cha Wafalme[b]. Naye Amazia mwanawe akatawala mahali pake.
