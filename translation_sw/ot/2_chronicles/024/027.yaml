base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: sw
  text: Wanawe, matamko mengi dhidi yake[a], na kuweka msingi wa nyumba ya Mungu—tazama, mambo hayo yameandikwa katika Midrashi ya Kitabu cha Wafalme[b]. Naye Amazia mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “ukubwa wa mzigo uliokuwa juu yake,” “wingi wa tamko dhidi yake,” au hata “ushuru mzito aliozwa.” Kirai cha Kiebrania ni kigumu, na neno מַשָּׂא linaweza kumaanisha “mzigo,” “tamko” au “unabii,” na katika baadhi ya miktadha mzigo uliowekwa juu ya mtu.
    reason: lexical_alternative
  - marker: b
    text: “Midrashi” hapa huenda inamaanisha kumbukumbu ya ufafanuzi, maelezo, au maandishi ya kufafanua yanayohusiana na Kitabu cha Wafalme.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: Wanawe
  rationale: Hutoa moja kwa moja nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja; kiunganishi cha Kiebrania kinaakisiwa na mtiririko wa orodha bila kuongeza kielezi cha wakati.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: unabii mwingi dhidi yake
  rationale: מַשָּׂא inaweza kumaanisha mzigo au tamko la kinabii; katika muktadha huu maana ya matamko ya kinabii dhidi ya mfalme inaeleweka vizuri, huku utata wa neno ukihifadhiwa katika tanbihi.
- source_word: וִיסוֹד בֵּית הָאֱלֹהִים
  choice: kuwekwa kwa msingi wa nyumba ya Mungu
  rationale: Huhifadhi maana ya mzizi יסד, yaani kuweka msingi au kuimarisha, bila kubadili moja kwa moja kuwa ‘kujenga upya’; ‘nyumba ya Mungu’ pia huhifadhi nahau ya Kiebrania.
- source_word: הִנָּם כְתוּבִים
  choice: tazama, mambo hayo yameandikwa
  rationale: ‘Tazama’ huhifadhi msisitizo wa הִנָּם; ‘mambo hayo’ huwezesha upatanisho wa kawaida wa Kiswahili kwa vipengele tofauti vilivyo katika orodha.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: katika Midrashi ya Kitabu cha Wafalme
  rationale: ‘Midrashi’ ni unukuzi unaoepuka kuamua kwa uhakika aina ya maandishi; maelezo ya maana yake yametolewa katika tanbihi.
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַחְתָּיו
  choice: Naye Amazia mwanawe akatawala mahali pake
  rationale: Ni tafsiri ya kawaida na ya asili ya fomula ya urithi wa kifalme.
