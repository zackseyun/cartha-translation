base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: sw
  text: Baada ya hayo, Yoashi alikusudia moyoni kuifanya nyumba ya Yahwe upya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kuirejesha katika hali nzuri, au kuikarabati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Hii ni alama ya mfuatano wa wakati inayoanzisha hatua mpya ya simulizi. Kiswahili hiki ni cha kawaida na huhifadhi mpito wa wakati bila kutafsiri kiufundi sana ‘ikawa baada ya hayo.’
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: Yoashi alikusudia moyoni
  rationale: Nahau ya Kiebrania inaeleza jambo lililokuwa moyoni mwa Yoashi, yaani nia yake ya ndani. ‘Alikusudia moyoni’ ni Kiswahili cha asili kinachohifadhi picha ya moyo bila kuongeza wazo la azimio kali kuliko maandishi yanavyodai.
- source_word: לְחַדֵּשׁ
  choice: kuifanya upya
  rationale: Kitenzi hiki humaanisha kufanya kuwa mpya tena, kufanya upya, au kurejesha. Katika muktadha wa jengo, ‘kuifanya upya’ huhifadhi upana wake kuliko ‘kuikarabati,’ ambalo linaweza kueleweka kuwa matengenezo pekee.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri hii huhifadhi usemi halisi ‘nyumba ya YHWH’ pamoja na maana yake ya kidini. Katika muktadha huu nyumba hiyo ni hekalu, jambo linalofafanuliwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi wa Kiswahili ‘Yahwe’ badala ya kubadilishwa na cheo ‘BWANA,’ hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadilisha kwa cheo, huku ‘Yehova’ likiwa umbo la kimapokeo lisiloakisi vizuri ushahidi wa matamshi ya kale.
- issue: Nguvu ya nia ya Yoashi katika הָיָה עִם לֵב יוֹאָשׁ
  choice: alokusudia moyoni
  alternative: aliazimia kabisa; alikuwa na nia
  rationale: Utoaji huu huonyesha nia ya ndani bila kudai kwamba nahau hiyo lazima iwe azimio kali lisilobadilika. Hivyo mvutano wa kiwango cha dhamira haujatatuliwa kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa kawaida kwa msomaji wa leo, huku ‘moyoni’ ikihifadhi taswira ya nahau ya Kiebrania. Jina ‘Yoashi’ linafuata umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
