translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi la kihistoria ulio wa kawaida na wenye hadhi. Jina la kale 'Aramu' limehifadhiwa. Muundo wa chanzo 'kutoka miongoni mwa watu' umeachwa ili kutofuta msisitizo au utata wake. Alama pekee ya tanbihi [a] imewekwa mahali pake katika maandishi.
