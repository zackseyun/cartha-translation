base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: sw
  text: Ikawa, mwaka ulipogeuka[a], jeshi la Aramu lilipanda kupigana naye. Wakaingia katika Yuda na Yerusalemu, wakawaangamiza wakuu wote wa watu kutoka miongoni mwa watu, kisha wakapeleka nyara zao zote kwa mfalme wa Dameski.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwishoni mwa mwaka”; nahau ya Kiebrania inahusu kugeuka kwa mwaka au mzunguko wa majira.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: wakati wa kugeuka kwa mwaka
  rationale: Neno תְּקוּפָה linaonyesha mzunguko au kugeuka kwa kipindi. Tafsiri hii inadumisha tamathali ya Kiebrania na rejeo lake la mabadiliko ya mwaka au majira.
- source_word: עָלָה עָלָיו
  choice: likapanda dhidi yake
  rationale: Katika muktadha wa kijeshi, עלה pamoja na עַל humaanisha kwenda au kupanda dhidi ya mtu ili kumshambulia. Kiswahili hiki kinahifadhi nahau ya chanzo.
- source_word: חֵיל אֲרָם
  choice: jeshi la Aramu
  rationale: חֵיל hapa ni jeshi au kikosi cha kijeshi. Jina Aramu linadumishwa badala ya kutumia jina la baadaye la kijiografia, Shamu/Siria.
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: Wakaingia Yuda na Yerusalemu
  rationale: בוא ni kuja au kuingia. Kwa jeshi linalofika katika maeneo hayo, 'wakaingia' ni ya kawaida na haiingizi maana ya ziada isiyomo katika kitenzi.
- source_word: וַיַּשְׁחִיתוּ
  choice: wakawaangamiza
  rationale: Hifili ya שׁחת humaanisha kuharibu au kuangamiza. Kwa kuwa kitu kinachotendewa ni watu, 'kuwaangamiza' huonyesha maangamizi makali, yanayoweza kuwa ya kuwaua.
- source_word: כָּל שָׂרֵי הָעָם
  choice: viongozi wote wa watu
  rationale: שָׂרִים ni watawala, wakuu, maafisa au viongozi. 'Viongozi' ni wazi kwa wasomaji wa sasa bila kudokeza kuwa walikuwa wana wa kifalme.
- source_word: מֵעָם
  choice: kutoka miongoni mwa watu
  rationale: מן pamoja na עָם huonyesha kutoka au kutengwa miongoni mwa kundi kubwa. Tafsiri inadumisha kirai hiki cha Kiebrania ingawa kinaonekana kuwa cha kusisitiza.
- source_word: וְכָל שְׁלָלָם
  choice: nyara zao zote
  rationale: שָׁלָל ni mali iliyotekwa vitani. 'Nyara' ni neno la kawaida na lenye hadhi katika simulizi la kihistoria; kiambishi cha umilikaji kinarejelea nyara walizotwaa wavamizi.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: wakapeleka ... kwa mfalme wa Damasko
  rationale: שׁלח ni kutuma au kupeleka. Katika Kiswahili, 'kupeleka nyara kwa mfalme' ni ya kawaida, na 'mfalme wa Damasko' humtambulisha mtawala mwenye makao yake huko.
