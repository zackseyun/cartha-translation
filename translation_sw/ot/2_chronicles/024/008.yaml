  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וַֽ/יַּעֲשׂ֖וּ אֲר֣וֹן אֶחָ֑ד וַֽ/יִּתְּנֻ֛/הוּ בְּ/שַׁ֥עַר בֵּית יְהוָ֖ה חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: sw
  text: Ndipo mfalme akaamuru,[a] nao wakatengeneza sanduku moja, wakaliweka nje kwenye lango la nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasema.” Katika muktadha huu maneno ya mfalme yana nguvu ya amri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akaamuru
  rationale: Kitenzi hiki kwa msingi humaanisha ‘akasema,’ lakini katika muktadha huu wa agizo linalotekelezwa mara moja, ‘akaamuru’ huwasilisha nguvu yake ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino yenye uainishaji; katika muundo huu wa Kiswahili ‘mfalme’ hutambulishwa wazi na muktadha.
- source_word: וַיַּעֲשׂוּ
  choice: wakatengeneza
  rationale: Kitenzi עשה hapa kinahusu kutengeneza kitu halisi. Kiima cha wingi kinaachwa bila kutajwa, kama kilivyo katika Kiebrania.
- source_word: אֲרוֹן אֶחָד
  choice: sanduku moja
  rationale: אֲרוֹן ni chombo au sanduku, si lazima Sanduku la Agano. ‘Moja’ huhifadhi אֶחָד na huenda ikasisitiza sanduku moja maalumu la kukusanyia michango.
- source_word: וַיִּתְּנֻהוּ
  choice: kuliweka
  rationale: נתן hapa ina maana ya kuweka kitu mahali; kiambishi ‘-li-’ hurejelea sanduku kwa njia ya kawaida ya Kiswahili.
- source_word: בְּשַׁעַר
  choice: langoni pa
  rationale: בְּ inaonyesha mahali. ‘Langoni pa’ ni Kiswahili cha asili kinachoonyesha eneo la kuwekwa kwa sanduku bila kulazimisha maana ya kuwa ndani ya lango.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri hii huhifadhi taswira halisi ya ‘nyumba’ badala ya kuifafanua moja kwa moja kuwa hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה linawakilishwa kwa umbo la Kiswahili ‘Yahwe,’ linalotambulika na kufaa kifonolojia katika Kiswahili.
- source_word: חוּצָה
  choice: nje
  rationale: Kielezi hiki kinaonyesha kwamba sanduku liliwekwa upande wa nje.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania lina jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku likitumia umbo linaloeleweka katika Kiswahili.
- issue: Maana ya אֲרוֹן katika muktadha huu
  choice: sanduku
  alternative: sanduku la agano
  rationale: Muktadha unaeleza chombo cha kukusanyia michango, si Sanduku la Agano; hivyo ‘sanduku’ huepuka kuingiza utambulisho wa kitheolojia ambao haupo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘sanduku moja’ umehifadhiwa ili kutafsiri אֶחָד wazi; ‘langoni pa nyumba’ ni wa asili na wenye hadhi.
