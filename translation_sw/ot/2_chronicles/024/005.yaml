  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: sw
  text: Basi akawakusanya makuhani na Walawi, akawaambia, “Nendeni katika miji ya Yuda, mkakusanye fedha[a] kutoka kwa Israeli wote ili kuitengeneza[b] nyumba ya Mungu wenu mwaka baada ya mwaka. Nanyi fanyeni haraka katika jambo hili.” Lakini Walawi hawakufanya haraka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pesa.” Neno la Kiebrania linamaanisha kihalisi fedha, nayo ilitumiwa kama pesa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili kuiimarisha.” Katika muktadha huu maana ni kuitengeneza au kuikarabati nyumba ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: akawakusanya
  rationale: Kitenzi קבץ hapa kinamaanisha kuwakusanya watu pamoja; umbo lenye kiambishi cha yambwa linaonyesha wazi kwamba waliokusanywa ni makuhani na Walawi.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: makuhani na Walawi
  rationale: Majina haya ya makundi mawili ya huduma ya hekalu yametajwa yote ili kudumisha tofauti iliyopo katika Kiebrania.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: Nendeni katika miji ya Yuda
  rationale: Kauli hii ya amri inaelekeza waende kwenye miji ya Yuda; Kiswahili hiki ni cha kawaida na kinadumisha mwelekeo wa safari.
- source_word: וְקִבְצוּ
  choice: mkakusanye
  rationale: Mzizi קבץ unarudiwa, lakini hapa yambwa ni fedha. ‘Kukusanya’ linafaa kwa ukusanyaji wa michango, na ‘mka-’ linaunganisha tendo hili na agizo la kwenda.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: kutoka kwa Israeli wote
  rationale: ‘Israeli’ limehifadhiwa kama jina la jumla la watu wa agano, bila kulipunguza kuwa Yuda pekee au kulifafanua kuwa eneo la kijiografia.
- source_word: כֶּסֶף
  choice: fedha
  rationale: ‘Fedha’ katika Kiswahili linaweza kumaanisha madini ya fedha na pia pesa, hivyo linahifadhi kwa kiasi kizuri maana halisi na matumizi yake ya kifedha.
- source_word: לְחַזֵּק
  choice: ili kuitengeneza
  rationale: Ingawa maana ya msingi ni ‘kuimarisha,’ katika muktadha wa jengo kitenzi hiki kinahusu kulifanya liwe imara tena kwa kulikarabati au kulitengeneza.
- source_word: בֵּית אֱלֹהֵיכֶם
  choice: nyumba ya Mungu wenu
  rationale: ‘Nyumba’ linadumisha sitiari rasmi ya Kiebrania badala ya kuibadili moja kwa moja kuwa ‘hekalu.’
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Nahau hii inaonyesha tendo linalorudiwa kila mwaka; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  choice: Nanyi mharakishe jambo hili
  rationale: Tafsiri hii inadumisha nguvu ya agizo na uharaka wake bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: Lakini Walawi hawakuharakisha
  rationale: Kurudia kitenzi ‘kuharakisha’ kunadhihirisha tofauti ya moja kwa moja kati ya agizo na kutolitimiza kwa Walawi.
theological_decisions:
- issue: Upeo wa ‘Israeli wote’
  choice: Kuhifadhi ‘kutoka kwa Israeli wote’ katika matini kuu
  alternative: kutoka kwa Wayuda wote; kutoka kwa watu wote wa Yuda
  rationale: Mwandishi wa Mambo ya Nyakati anaweza kutumia ‘Israeli’ kwa maana pana ya watu wa agano. Tafsiri haipaswi kuufupisha upeo huo na kuufanya Yuda pekee.
- issue: Maana ya ‘nyumba ya Mungu wenu’
  choice: nyumba ya Mungu wenu
  alternative: hekalu la Mungu wenu
  rationale: Neno ‘nyumba’ linahifadhi namna ya usemi wa chanzo na uhusiano wake wa kitheolojia bila kuondoa ukweli wa kimuktadha kwamba ni hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha marudio muhimu ya ‘kuharakisha’ na majina tofauti ya makuhani na Walawi. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
