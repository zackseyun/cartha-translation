  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: sw
  text: Baada ya Yehoyada kufa, wakuu wa Yuda[a] wakaja na kuinama mbele ya mfalme. Ndipo mfalme akawasikiliza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maofisa wa Yuda” au “viongozi wa Yuda.”
    reason: lexical_alternative
  - marker: b
    text: “Akawasikiliza” pia inaweza kuwa na maana ya “akawatii” au “akakubaliana nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת יְהוֹיָדָע
  choice: Baada ya Yehoyada kufa
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi mfuatano wa wakati bila kulazimika kutafsiri kiunganishi cha Kiebrania kwa neno tofauti.
- source_word: בָּאוּ
  choice: wakaja
  rationale: Kitenzi hiki cha kawaida cha mwendo kinadumisha mtazamo wa simulizi bila kuongeza mahali maalumu walipofika.
- source_word: שָׂרֵי יְהוּדָה
  choice: wakuu wa Yuda
  rationale: שָׂרִים inaweza kumaanisha wakuu, watawala, au maofisa. “Wakuu” ni lugha ya kawaida, yenye heshima, na haidokezi bila lazima kwamba wote walikuwa wana wa kifalme.
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: kuinama mbele ya mfalme
  rationale: Tafsiri hii inahifadhi tendo la kimwili la kujinyenyekeza mbele ya mwenye mamlaka bila kulifafanua moja kwa moja kuwa ibada.
- source_word: אָז
  choice: Ndipo
  rationale: “Ndipo” huonyesha hatua iliyofuata na uhusiano wake na tukio lililotangulia kwa mtindo wa asili wa simulizi la Kiswahili.
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: mfalme akawasikiliza
  rationale: Nahau שׁמע אל inaweza kumaanisha kusikiliza au kutii/kukubali ushauri. “Akawasikiliza” huhifadhi maana ya msingi na kuacha maana yenye nguvu zaidi ielezwe katika tanbihi.
theological_decisions:
- issue: Maana ya tendo la wakuu mbele ya mfalme
  choice: kuinama mbele ya mfalme
  alternative: kumsujudia mfalme; kumpa heshima mfalme
  rationale: Kitenzi cha Kiebrania kinaweza kueleza kuinama au kujilaza chini, na kulingana na muktadha huweza kuhusiana na heshima au ibada. Kwa kuwa hapa tendo linaelekezwa kwa mfalme wa kibinadamu, “kuinama mbele ya” huhifadhi tendo lenyewe bila kuingiza dhana ya ibada.
- issue: Nguvu ya maana katika kauli kwamba mfalme aliwasikiliza
  choice: akawasikiliza
  alternative: akawatii; akakubaliana nao
  rationale: Muktadha unaweza kudokeza kwamba mfalme alifuata walichotaka, lakini neno la Kiebrania pia linaweza kutafsiriwa kwa maana ya msingi ya kusikiliza. Tafsiri kuu haifungi uwezekano huo, na tanbihi inautaja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Jina Yehoyada limeandikwa kwa umbo linalotumika kwa kawaida katika tafsiri za Biblia za Kiswahili. Maneno ya kiibada yameepukwa mahali ambapo Kiebrania kinaweza kueleza kwa upana tendo la kuinama mbele ya mfalme wa kibinadamu.
