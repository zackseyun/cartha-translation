  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: inaonyesha mfuatano wa wakati baada ya kifo cha Yehoyada, ujio wa wakuu wa Yuda, tendo lao la kuinama mbele ya mfalme, na hatua inayofuata ya mfalme kuwasikiliza. Haiongezi mahali walikokwenda wala kufasiri kuinama kuwa ibada.'
