  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: sw
  text: Yehoyada akamtafutia Yoashi wake wawili[a], naye Yoashi akazaa wana na mabinti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ingawa uwezekano wake ni mdogo, “Yehoyada akachukua wake wawili, akazaa wana na mabinti,” ikiwa Yehoyada anaeleweka kuwa mhusika katika mstari wote.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ל֥וֹ
  choice: akamchukulia
  rationale: Kitenzi נשׂא pamoja na לּוֹ kinaonyesha kwamba Yehoyada alimchukulia huyo mtu wake, yaani alipanga au kupata wake kwa ajili yake. Kiswahili hiki ni cha asili na kinadumisha maana ya tendo kufanywa kwa niaba ya mwingine.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Jina limetoholewa kwa namna inayoendana na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: נָשִׁים שְׁתָּיִם
  choice: wake wawili
  rationale: Katika muktadha wa ndoa, נָשִׁים humaanisha wake, na idadi ya wawili imehifadhiwa wazi.
- source_word: וַיּוֹלֶד
  choice: naye akazaa
  rationale: Hifili ya ילד ikiwa na mhusika wa kiume humaanisha kuzaa au kupata watoto. 'Akazaa' ni usemi mfupi na wa kawaida wa Kiswahili; kiwakilishi 'naye' kinaelekeza kwa mtu ambaye Yehoyada alimchukulia wake, kulingana na muktadha, huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na mabinti
  rationale: Maneno ya Kiebrania yanataja wazi watoto wa kiume na wa kike, hivyo tofauti hiyo imehifadhiwa badala ya kutumia neno la jumla 'watoto'.
theological_decisions:
- issue: Mhusika anayerejelewa na kiwakilishi na kitenzi cha mwisho
  choice: Yehoyada alimchukulia Yoashi wake wawili, kisha Yoashi akazaa wana na mabinti.
  alternative: Yehoyada mwenyewe alioa wake wawili na akazaa wana na mabinti.
  rationale: Muktadha mpana unamhusu Yoashi, na לּוֹ ('kwa ajili yake') unaonyesha kwa nguvu kwamba Yehoyada alitenda kwa niaba ya Yoashi. Hata hivyo, kwa kuwa Yehoyada ndiye mhusika wa karibu aliyetajwa wazi, uwezekano wa kumwona kuwa mhusika wa sentensi yote umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Akamchukulia wake' ni usemi unaoeleweka wa kupanga au kupata wake kwa ajili ya mtu mwingine. 'Wana na mabinti' huhifadhi utofautishaji wa Kiebrania bila kuwa wa kizamani kupita kiasi.
