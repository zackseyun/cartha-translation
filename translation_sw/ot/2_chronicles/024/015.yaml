base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: sw
  text: Yehoyada akazeeka, akashiba siku, akafa. Alikuwa na umri wa miaka mia moja na thelathini alipokufa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: akazeeka
  rationale: Kitenzi hiki katika mfululizo wa masimulizi kinaonyesha kuendelea na kufikia uzee; “akazeeka” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Jina limeandikwa kwa namna inayofuata matamshi ya Kiebrania na desturi ya majina ya Biblia katika Kiswahili.
- source_word: וַיִּשְׂבַּע יָמִים
  choice: akawa ameshiba siku
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania, ambayo kwa maana huonyesha kwamba mtu ameishi maisha marefu na kamili.
- source_word: וַיָּמֹת
  choice: kisha akafa
  rationale: Hii ni tafsiri ya kawaida ya מות; “kisha” huonyesha mwendelezo wa matukio bila kulazimika kurudia kiunganishi kilekile.
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: alikuwa na umri wa miaka mia moja na thelathini
  rationale: Nahau halisi ya Kiebrania, “mwana wa miaka…,” imetolewa kwa muundo wa kawaida na wazi wa kutaja umri katika Kiswahili.
- source_word: בְּמוֹתוֹ
  choice: alipokufa
  rationale: Muundo huu unaeleza kwa kawaida wakati ambao umri uliotajwa ulifikia kikomo, huku ukihifadhi maana ya wakati ya kirai cha Kiebrania.
