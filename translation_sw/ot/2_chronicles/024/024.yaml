  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: sw
  text: Kwa maana jeshi la Aramu lilikuja likiwa na watu wachache[a], lakini Yahwe akalikabidhi jeshi kubwa sana mikononi mwao[b], kwa sababu walikuwa wamemwacha Yahwe, Mungu wa baba zao. Nao wakatekeleza hukumu dhidi ya Yoashi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “likiwa na idadi ndogo ya watu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “akalitia jeshi kubwa sana mikononi mwao,” nahau yenye maana ya kulitia chini ya mamlaka yao.
    reason: lexical_alternative
  - marker: c
    text: Au, “wakatekeleza hukumu juu ya Yoashi.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמִצְעַר אֲנָשִׁים
  choice: likiwa na watu wachache
  rationale: Kirai hiki huonyesha uchache wa idadi; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha utofauti na jeshi kubwa sana.
- source_word: חֵיל אֲרָם
  choice: jeshi la Aramu
  rationale: Katika muktadha huu חֵיל ni jeshi au nguvu ya kijeshi. Jina Aramu linafuata jina la Kiebrania badala ya kulitambulisha moja kwa moja na Siria ya kisasa.
- source_word: נָתַן בְּיָדָם
  choice: akalitia ... mikononi mwao
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania ya kukabidhi mtu au kundi chini ya mamlaka ya mwingine, huku ikieleweka kwa Kiswahili.
- source_word: חַיִל לָרֹב מְאֹד
  choice: jeshi kubwa sana
  rationale: חַיִל hapa ni jeshi, na לָרֹב מְאֹד inasisitiza ukubwa wake.
- source_word: עָזְבוּ
  choice: walikuwa wamemwacha
  rationale: Kitenzi kinaonyesha kuacha uaminifu kwa Mungu; umbo hili ni la kawaida na lenye uzito unaofaa katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Hii inadumisha lugha ya ukoo na agano iliyo katika Kiebrania.
- source_word: עָשׂוּ שְׁפָטִים
  choice: wakatekeleza hukumu
  rationale: Kirai kinaeleza matendo ya adhabu ya kimahakama. Kiswahili hutumia 'hukumu' kwa kawaida kama nomino ya jumla hata pale Kiebrania kinapotumia wingi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu, kwa hiyo tafsiri inalidumisha badala ya kuweka cheo mahali pake.
- issue: Ushindi wa Waaramu kama utekelezaji wa hukumu
  choice: Nao wakatekeleza hukumu dhidi ya Yoashi
  alternative: Nao wakamwadhibu Yoashi
  rationale: Tafsiri inadumisha lugha ya hukumu na uhusiano wake na tendo la Mungu la kulitia jeshi mikononi mwa Waaramu, bila kufafanua kupita kiasi jinsi hukumu hiyo ilivyotekelezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kisababishi na tofauti kati ya jeshi dogo la Aramu na jeshi kubwa lililoshindwa vimedumishwa.
