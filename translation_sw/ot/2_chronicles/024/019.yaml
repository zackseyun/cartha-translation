  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: sw
  text: Hata hivyo, aliwatuma manabii miongoni mwao ili kuwarudisha kwa Yahwe. Manabii hao wakawaonya[a], lakini hawakusikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakashuhudia dhidi yao.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoa onyo zito, na pia kinaweza kuwa na maana ya kushuhudia dhidi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם
  choice: aliwatuma manabii miongoni mwao
  rationale: Muundo huu unawasilisha tendo la kuwatuma manabii ndani ya jamii hiyo, kwa Kiswahili cha kawaida na cha asili.
- source_word: נְבִאִים
  choice: manabii
  rationale: Hili ndilo neno la kawaida na linalotambulika kwa נְבִאִים katika Kiswahili.
- source_word: לַהֲשִׁיבָם
  choice: ili kuwarudisha
  rationale: Hiphil ya שוב ina maana ya kusababisha warudi; “kuwarudisha” inadumisha nguvu hiyo ya kisababishi.
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: “Kwa” linaonyesha kurejea kwa Mungu, naye יְהוָה ametajwa kwa jina Yahwe kulingana na ushahidi wa maandishi na uamuzi wa mradi.
- source_word: וַיָּעִידוּ בָם
  choice: wakawaonya
  rationale: Hiphil ya עוד hapa inaweza kumaanisha kutoa onyo zito au kushuhudia dhidi ya watu. “Wakawaonya” ni ya asili katika Kiswahili, huku kidokezo kikihifadhi maana ya kimahakama.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: lakini hawakusikiliza
  rationale: Kitenzi kinaonyesha kutosikiliza au kutotilia maanani; muundo huu ni wazi na hauongezi kwa lazima wazo la kukataa kwa makusudi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linawakilisha jina la agano moja kwa moja bila kulibadilisha kuwa cheo, na linafuata uamuzi wa mradi uliotolewa.
- issue: Nguvu ya kinabii ya וַיָּעִידוּ בָם
  choice: wakawaonya, huku maana nyingine ikiwekwa katika kidokezo
  alternative: wakashuhudia dhidi yao
  rationale: Kiebrania kinaweza kuonyesha onyo zito na pia ushahidi dhidi yao. Maandishi makuu yanatumia Kiswahili cha asili, na kidokezo kinahifadhi uzito wa kimahakama bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Hata hivyo” linaendeleza tofauti na muktadha uliotangulia; “manabii hao” linaweka wazi mhusika wa kitenzi bila kubadili maana.
