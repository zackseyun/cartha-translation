  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: sw
  text: Walipoondoka kwake—kwa maana walimwacha akiwa na magonjwa mengi—watumishi wake walifanya njama dhidi yake kwa sababu ya damu ya wana wa Yehoyada, kuhani[a]. Wakamuua kitandani mwake, naye akafa. Wakamzika katika Jiji la Daudi, lakini hawakumzika katika makaburi ya wafalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “damu ya wana wa Yehoyada, kuhani.” Katika muktadha, huenda maneno haya yanamhusu hasa “mwana wa Yehoyada,” yaani Zekaria (24:20–22).'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: Walipoondoka kwake
  rationale: Muundo wa ב pamoja na kitenzi-jina una maana ya wakati, ‘walipoondoka’; מִמֶּנּוּ inaonyesha kuondoka mahali alipokuwa Yoashi.
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: kwa maana walimwacha akiwa na magonjwa mengi
  rationale: כִּי inaeleweka kwa maana ya sababu, na מַחֳלָיִם ni wingi unaomaanisha magonjwa au maradhi; tafsiri inahifadhi wingi wa Kiebrania bila kuugeuza kimya kuwa majeraha.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: watumishi wake walifanya njama dhidi yake
  rationale: Hitpaeli ya קשר hapa inaashiria kupanga njama kwa pamoja. עֲבָדָיו inaweza kumaanisha watumishi au maafisa wa kifalme; ‘watumishi wake’ ndiyo tafsiri ya moja kwa moja.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: kwa sababu ya damu ya wana wa Yehoyada kuhani
  rationale: בִּדְמֵי inaonyesha sababu inayohusiana na damu iliyomwagika au hatia ya damu. Wingi ‘wana’ unafuata kwa uaminifu maandishi ya Kimasora.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: Wakamuua kitandani mwake, naye akafa
  rationale: הרג ni ‘kuua,’ na עַל מִטָּתוֹ huonyesha kwamba aliuawa akiwa kitandani; kishazi kinachofuata kinahifadhi taarifa ya wazi kwamba alikufa.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: Wakamzika katika Jiji la Daudi, lakini hawakumzika katika makaburi ya wafalme
  rationale: Tafsiri inahifadhi tofauti kati ya kuzikwa katika Jiji la Daudi na kunyimwa maziko katika makaburi ya kifalme.
theological_decisions:
- issue: Wingi wa Kimasora ‘wana wa Yehoyada’ dhidi ya muktadha unaomtaja mwana mmoja, Zekaria
  choice: Maandishi makuu yanahifadhi ‘wana wa Yehoyada.’
  alternative: ‘mwana wa Yehoyada,’ yaani Zekaria (2 Mambo ya Nyakati 24:20–22)
  rationale: Chanzo cha Kiebrania kilichotolewa kina wingi. Muktadha unaweza kuelekeza kwa Zekaria peke yake, lakini mvutano huo haupaswi kusawazishwa kimya; hivyo ufafanuzi wa umoja umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walifanya njama’ ni ya kawaida na wazi; ‘Jiji la Daudi’ limetumiwa kama jina maalumu. Alama ya tanbihi [a] imewekwa mara baada ya kishazi kinachohusika.
