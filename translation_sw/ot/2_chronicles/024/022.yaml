base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: sw
  text: Lakini Mfalme Yoashi hakukumbuka fadhili[a] ambazo Yehoyada, baba yake[b], alikuwa amemtendea, bali akamuua mwanawe. Mwana huyo alipokuwa akifa, alisema, “Yahwe na aone na adai hesabu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu” au “upendo mwaminifu.”
    reason: lexical_alternative
  - marker: b
    text: Yehoyada hakuwa baba mzazi wa Yoashi; huenda hapa anaitwa baba kwa sababu ya jukumu lake la kumlea na kumlinda.
    reason: cultural_note
  - marker: c
    text: Kiebrania kinaweza pia kumaanisha, “Yahwe na aone na kulipiza.” Kitenzi hicho kinaweza kuonyesha kuchunguza kosa na kumdai mkosaji hesabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶסֶד
  choice: fadhili
  rationale: Neno חֶסֶד hapa linaonyesha wema wenye uaminifu ambao Yehoyada alimtendea Yoashi. “Fadhili” ni neno la kawaida na lenye uzito unaofaa, huku tanbihi ikihifadhi maana mbadala ya uaminifu.
- source_word: זָכַר
  choice: hakukumbuka
  rationale: Huhifadhi maana ya moja kwa moja ya kitenzi cha Kiebrania bila kuongeza wazi wazo la kutokuwa na shukrani, ingawa hilo linaeleweka katika muktadha.
- source_word: אָבִיו
  choice: baba yake
  rationale: Hufuata usemi wa Kiebrania. Kwa kuwa Yehoyada hakuwa baba mzazi wa Yoashi, tanbihi inaeleza uwezekano wa maana ya jukumu la baba au mlezi.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: bali akamuua mwanawe
  rationale: “Akamuua” ni tafsiri ya moja kwa moja na ya kawaida. “Bali” huonyesha kwa ufasaha tofauti kali kati ya fadhili za Yehoyada na tendo la Yoashi.
- source_word: וּכְמוֹתוֹ
  choice: Mwana huyo alipokuwa akifa
  rationale: Muundo wa Kiebrania una maana ya wakati, “alipokuwa akifa.” Kutaja “mwana huyo” huondoa utata wa kiwakilishi bila kubadili mhusika anayelengwa.
- source_word: יֵרֶא יְהוָה
  choice: Yahwe na aone
  rationale: Muundo huu wa Kiswahili unaonyesha ombi au mwito, si taarifa rahisi ya wakati ujao, na unahifadhi jina la Mungu lililo katika maandishi.
- source_word: וְיִדְרֹשׁ
  choice: na kudai hesabu
  rationale: Kitenzi דרש katika muktadha wa dhuluma kinaweza kumaanisha kuchunguza na kudai uwajibikaji. “Kudai hesabu” huwasilisha hukumu inayotakiwa bila kuibana maana iwe kisasi pekee.
theological_decisions:
- issue: Mwito wa mwisho wa mwana wa Yehoyada kwa Yahwe
  choice: Ombi kwamba Yahwe aone dhuluma na kudai uwajibikaji
  alternative: Ombi la kulipa kisasi moja kwa moja
  rationale: Kitenzi דרש kinaweza kuhusisha kuchunguza kosa, kudai hesabu, au kulipiza. Tafsiri haibani maana kuwa kisasi pekee, hivyo inadumisha mvutano wa kauli ya Kiebrania.
- issue: Utambulisho wa Yehoyada kama baba ya Yoashi
  choice: Kuhifadhi “baba yake” katika matini na kueleza katika tanbihi
  alternative: Kutafsiri moja kwa moja kuwa “mlezi wake”
  rationale: Maandishi yanatumia אָבִיו, lakini simulizi linaonyesha uhusiano wa kimalezi badala ya uzazi. Kuhifadhi neno la chanzo na kutoa maelezo huepuka kufuta taswira ya kibaba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Yahwe” limetumiwa kwa jina יהוה. Mpangilio wa sentensi umefanywa wa kawaida katika Kiswahili, na “Mwana huyo” limeongezwa kwa uwazi wa marejeo.
