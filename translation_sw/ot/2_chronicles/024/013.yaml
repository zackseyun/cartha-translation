base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: sw
  text: Basi mafundi wakafanya kazi, na kazi ya ukarabati ikasonga mbele kwa mikono yao; wakairejesha nyumba ya Mungu katika hali yake inayofaa na kuiimarisha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: mafundi wakafanya kazi
  rationale: Kirai cha Kiebrania ni cha kiidioma, kihalisi ‘watendaji wa kazi wakafanya.’ ‘Mafundi wakafanya kazi’ ni Kiswahili cha kawaida kinachowatambulisha waliohusika na ujenzi bila kuwa na uradidi usio wa asili.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: ukarabati ukaendelea
  rationale: אֲרוּכָה huweza kumaanisha uponyaji au urejesho; katika muktadha wa jengo ina maana ya ukarabati. Pamoja na עלה, kirai kinaonyesha kwamba kazi ilipiga hatua.
- source_word: בְּיָדָם
  choice: chini ya usimamizi wao
  rationale: Kihalisi ni ‘mikononi mwao.’ Hapa nahau hiyo inaeleza kwamba maendeleo ya kazi yalitokea kupitia juhudi au uangalizi wao; ‘chini ya usimamizi wao’ ni ya asili katika Kiswahili na inafaa muktadha wa mafundi.
- source_word: וַיַּעֲמִידוּ
  choice: wakairejesha
  rationale: Hifili ya עמד ni ‘kusimamisha’ au ‘kufanya isimame’; katika muktadha wa ukarabati inaeleza kulirudisha jengo katika hali thabiti.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hili ndilo tafsiri ya moja kwa moja ya jina la hekalu, na ni wazi katika Kiswahili cha kibiblia.
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: katika hali yake iliyokusudiwa
  rationale: מַתְכֻּנֶת inaweza kutaja mpangilio, umbo, kipimo, au hali iliyowekwa. Chaguo hili linaacha wazi kama kinachosisitizwa ni umbo la awali au hali inayofaa, bila kuamua zaidi ya maandishi.
- source_word: וַיְאַמְּצֻהוּ
  choice: na kuiimarisha
  rationale: Pieli ya אמץ humaanisha kutia nguvu au kufanya imara; ‘kuiimarisha’ inafaa moja kwa moja kwa jengo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Tafsiri inafuata usawazishaji mwafaka, ikihifadhi taswira ya nyumba ya Mungu na maana ya urejesho wa jengo huku ikiepuka Kiswahili cha kihalisi kisicho cha asili.
