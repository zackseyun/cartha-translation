source:
  edition: WLC
  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: sw
  text: 'Ndipo Roho wa Mungu akamvika[a] Zekaria, mwana wa Yehoyada, kuhani; naye akasimama juu ya watu na kuwaambia, “Mungu asema hivi: ‘Kwa nini mnazivunja amri za Yahwe, na hamfanikiwi?[b] Kwa sababu mmemwacha Yahwe, naye amewaacha ninyi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho wa Mungu akamjia Zekaria”; neno kwa neno, “akamvika Zekaria.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hamtafanikiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: Katika muktadha huu wa kuwezeshwa kwa nabii, kirai hiki kinamtaja Roho wa Mungu kama mtendaji wa kimungu, si msukumo wa kawaida tu.
- source_word: לָבְשָׁה אֶת
  choice: akamvika
  rationale: Kitenzi לבשׁ kina taswira halisi ya kuvaa au kuvika. ‘Akamvika’ inadumisha sitiari ya Kiebrania ya Roho kumfunika na kumwezesha Zekaria; maana ya kimuktadha imeelezwa katika tanbihi.
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: Zekaria mwana wa Yehoyada kuhani
  rationale: Majina yamenukuliwa kwa umbo la Kiswahili linalotambulika, na ‘kuhani’ linamhusu Yehoyada kulingana na muundo wa kirai cha Kiebrania.
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: akasimama mahali pa juu kuliko watu
  rationale: Tafsiri hii inadumisha maana ya mahali palipoinuka iliyo katika מֵעַל, huku ikiepuka kueleweka kana kwamba Zekaria alikuwa na mamlaka juu ya watu tu.
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: Mungu asema hivi
  rationale: Huu ni usemi rasmi wa kinabii; mpangilio huu ni wa asili na wenye hadhi katika Kiswahili cha sasa.
- source_word: לָמָה אַתֶּם עֹבְרִים אֶת מִצְוֹת יְהוָה
  choice: Kwa nini mnazivunja amri za Yahwe
  rationale: עבר inapohusishwa na amri humaanisha kuvuka mipaka yake au kuzikiuka. ‘Kuzivunja’ ni lugha wazi na ya kawaida yenye uzito wa kimaadili na wa agano.
- source_word: וְלֹא תַצְלִיחוּ
  choice: na hivyo hamfanikiwi
  rationale: Katika swali hili, kishazi kinaeleza matokeo ya kuvunja amri. Wakati wa kitenzi unaweza kueleweka kama hali ya sasa au matokeo yajayo; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: כִּי עֲזַבְתֶּם אֶת יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: Kwa sababu mmemwacha Yahwe, naye amewaacha ninyi
  rationale: Kurudiwa kwa kitenzi עזב kumehifadhiwa kwa ‘wacha,’ na ‘naye’ linaonyesha ulinganifu wa makusudi kati ya tendo lao na jibu lake.
theological_decisions:
- issue: Uwakilishi wa יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano יְהוָה moja kwa moja. ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  alternative: roho kutoka kwa Mungu
  rationale: Muktadha unaonyesha Mungu akimwezesha mjumbe wake kwa ajili ya tangazo la kinabii. Hata hivyo, tafsiri haiongezi maelezo ya kidhehebu kuhusu namna ya utendaji wa Roho.
- issue: Maana ya Mungu ‘kuwaacha’ watu
  choice: naye amewaacha ninyi
  alternative: naye atawaacha ninyi
  rationale: Wayyiqtol hapa inaeleza jibu la Mungu kwa kumwacha kwao. Kauli kamilifu inadumisha ulinganifu wa vitenzi bila kuamua kwamba ni ahadi ya wakati ujao pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. Sitiari ya Kiebrania ya Roho ‘kumvika’ Zekaria imehifadhiwa, huku tanbihi ikitoa maana yake ya kawaida. Jina la Mungu limetolewa kama ‘Yahwe,’ na ulinganifu wa ‘mmemwacha ... amewaacha’ umedumishwa.
