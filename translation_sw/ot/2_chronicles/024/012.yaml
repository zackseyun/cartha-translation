  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: sw
  text: Mfalme na Yehoyada wakawapa fedha hizo wale waliofanya kazi ya huduma ya nyumba ya Yahweh[a]. Nao wakawaajiri wakataji wa mawe na mafundi ili kuikarabati nyumba ya Yahweh, na pia mafundi wa chuma na shaba ili kuiimarisha nyumba ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hekalu la Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: wakawapa fedha hizo
  rationale: Kiambishi cha yambwa cha umoja kinarejelea fedha zilizokusanywa katika muktadha. Kiswahili cha kawaida huhitaji kutaja rejeleo hilo wazi; wingi katika kitenzi unafuata wapokeaji.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: wale waliokuwa wakifanya kazi ya huduma ya nyumba ya Yahweh
  rationale: Huhifadhi muundo wenye tabaka wa Kiebrania bila kuongeza dhana isiyotajwa wazi ya usimamizi.
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: Nao wakawaajiri
  rationale: Muundo wa היה pamoja na kitenzi shiriki unaonyesha tendo lililofanywa au kuendelea; 'wakawaajiri' ni Kiswahili cha asili katika muktadha huu.
- source_word: חֹצְבִים וְחָרָשִׁים
  choice: wachongaji wa mawe na mafundi
  rationale: חֹצְבִים ni wafanyakazi wanaokata au kuchonga mawe, huku חָרָשִׁים likiwa neno pana kwa mafundi stadi.
- source_word: לְחַדֵּשׁ
  choice: kuikarabati
  rationale: Katika muktadha wa jengo, piel ya חדש humaanisha kulifanya jipya tena; 'kuikarabati' huwasilisha urejeshaji kwa lugha ya sasa.
- source_word: לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: mafundi wa chuma na shaba
  rationale: Kirai kinawataja mafundi wanaofanya kazi kwa metali hizi bila kulazimisha utaalamu mwembamba zaidi.
- source_word: לְחַזֵּק
  choice: kuiimarisha
  rationale: Hutoa maana ya kufanya jengo liwe imara, inayofaa kwa kazi ya kurekebisha hekalu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu; 'Yahweh' hulihifadhi kama jina na kuepuka kulibadilisha kuwa cheo.
- issue: Maana ya בֵּית יְהוָה
  choice: nyumba ya Yahweh
  alternative: hekalu la Yahweh
  rationale: '''Nyumba ya Yahweh'' hufuata sitiari ya Kiebrania kwa karibu, ingawa katika muktadha inamaanisha hekalu.'
