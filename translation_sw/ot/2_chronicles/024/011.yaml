  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: sw
  text: Kila sanduku[a] lilipoletwa na Walawi kwa usimamizi wa mfalme, na walipoona kuwa ndani yake mlikuwa na fedha nyingi, mwandishi wa mfalme na afisa wa kuhani mkuu walikuja, wakatoa vyote vilivyokuwa ndani ya sanduku, kisha wakalichukua na kulirudisha mahali pake. Ndivyo walivyofanya siku baada ya siku, nao wakakusanya fedha[b] nyingi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza pia kurejelea “Sanduku la Agano”; hapa linamaanisha sanduku la kukusanyia matoleo, si Sanduku la Agano.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha “fedha” kama metali au “pesa”; katika muktadha huu linarejelea pesa zilizokusanywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: sanduku
  rationale: Katika muktadha huu ni chombo cha kukusanyia matoleo, si Sanduku la Agano. ‘Sanduku’ ni neno la kawaida na wazi katika Kiswahili cha sasa.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: ukaguzi wa mfalme
  rationale: Neno hili linaweza kuonyesha uangalizi, usimamizi, au ukaguzi rasmi. Katika muktadha wa kuleta sanduku ili kiasi cha fedha kishughulikiwe na maafisa, ‘ukaguzi wa mfalme’ huonyesha hatua ya kiutawala bila kudai kwamba mfalme mwenyewe alikagua.
- source_word: בְּיַד הַלְוִיִּם
  choice: na Walawi
  rationale: Nahau ya Kiebrania inaonyesha wahusika waliolileta sanduku; Kiswahili cha kawaida hutumia ‘na Walawi’.
- source_word: וְכִרְאוֹתָם
  choice: walipoona
  rationale: Muundo huu ni kishazi cha wakati. Kiwakilishi cha wingi kimeachwa bila kufafanuliwa zaidi, kama kilivyo katika Kiebrania.
- source_word: רַב הַכֶּסֶף
  choice: ndani yake mlikuwa na fedha nyingi
  rationale: כֶּסֶף inaweza kuwa fedha kama metali au pesa. ‘Fedha’ hudumisha maana zote mbili na sentensi inaeleza wingi wa kilichokuwa sandukuni.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: mwandishi wa mfalme
  rationale: Hili ni cheo cha kiutawala cha mwandishi au katibu wa kifalme; ‘mwandishi wa mfalme’ huhifadhi sura ya kihistoria ya cheo hicho.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: afisa wa kuhani mkuu
  rationale: Mfuatano wa nomino unaonyesha afisa aliyekuwa chini ya kuhani mkuu, bila kutaja kwa uhakika cheo chake maalumu.
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: wakatoa vyote vilivyokuwa ndani ya sanduku
  rationale: Kitenzi kinaonyesha kuliondolea sanduku yaliyomo. Usemi huu ni wa asili zaidi kuliko kusema ‘walilimwaga sanduku’ na haubadili tendo lenyewe.
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: wakalichukua na kulirudisha mahali pake
  rationale: Mfuatano wa vitenzi unaonyesha kulibeba au kulichukua sanduku na kisha kulirejesha mahali pake.
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: Ndivyo walivyofanya siku baada ya siku
  rationale: Nahau hii inaonyesha tendo lililorudiwa kila siku.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: wakakusanya fedha nyingi sana
  rationale: Tafsiri hii inaonyesha tendo la kukusanya na wingi mkubwa uliosisitizwa na לָרֹב.
