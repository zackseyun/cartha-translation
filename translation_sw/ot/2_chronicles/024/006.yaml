base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: sw
  text: Ndipo mfalme akamwita Yehoyada mkuu, akamwambia, “Kwa nini hukuwaagiza Walawi walete kutoka Yuda na Yerusalemu ushuru wa Musa, mtumishi wa BWANA, na wa kusanyiko la Israeli, kwa ajili ya hema la ushuhuda?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: mkuu
  rationale: Neno hili linamtambulisha Yehoyada kama mwenye cheo cha uongozi; tafsiri ‘mkuu’ huhifadhi ufupi na kutotaja wazi cheo ambacho Kiebrania hakikibainishi hapa.
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: hukuwaagiza Walawi
  rationale: Katika muundo huu, kitenzi kina maana ya kudai au kuwaagiza watu wawajibike; ‘kuwaagiza’ ni Kiswahili cha kawaida na kinaendana na jukumu la Walawi la kukusanya.
- source_word: מַשְׂאַת מֹשֶׁה
  choice: ushuru uliowekwa na Musa
  rationale: מַשְׂאַת hapa ni malipo/utozo uliotakiwa kwa ajili ya patakatifu. ‘Ushuru uliowekwa na Musa’ huonyesha kuwa Musa aliagiza utozaji huo, si kwamba fedha zilikuwa mali yake.
- source_word: אֹהֶל הָעֵדוּת
  choice: hema la ushuhuda
  rationale: Hii ni tafsiri ya moja kwa moja ya jina la hema takatifu, inayohifadhi istilahi ya kibiblia ‘ushuhuda’ bila kuibadili kuwa ufafanuzi.
theological_decisions:
- issue: Uhusiano wa Musa na kusanyiko katika kifungu וְהַקָּהָל לְיִשְׂרָאֵל
  choice: ushuru uliowekwa na Musa, mtumishi wa BWANA, pamoja na kusanyiko la Israeli
  alternative: ushuru wa Musa, mtumishi wa BWANA, na wa kusanyiko la Israeli
  rationale: Kiebrania ni kifupi na kigumu kisarufi. Tafsiri iliyochaguliwa inaelekeza ‘kusanyiko’ kwenye agizo la utozaji bila kudai kuwa kusanyiko lilimiliki ushuru; neno ‘pamoja’ huhifadhi ushiriki wake huku likiepuka fundisho la ziada.
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni utaratibu wa kawaida na wenye hadhi katika Biblia za Kiswahili kwa Tetragramatoni, na herufi kubwa hutofautisha jina hili na cheo cha kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umesawazishwa kwa usomaji wa kawaida huku istilahi za kibiblia ‘mtumishi wa BWANA’ na ‘hema la ushuhuda’ zikihifadhiwa.
