base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: sw
  text: Yoashi alifanya yaliyo sawa machoni pa Yahwe siku zote za Yehoyada kuhani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: alifanya
  rationale: Kitenzi עשה humaanisha ‘kufanya’; hapa kinaingia kwa kawaida katika kauli ‘alifanya yaliyo sawa.’
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: יָשָׁר hapa ni tathmini ya mwenendo wa mfalme. ‘Yaliyo sawa’ ni Kiswahili cha kawaida kinachohifadhi maana ya haki au unyoofu bila kuongeza maelezo.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Neno hili linahifadhi sitiari ya Kiebrania inayomaanisha tathmini kwa mtazamo wa mtu fulani; ‘machoni pa’ ni nahau inayoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: כָּל יְמֵי
  choice: siku zote za
  rationale: Tafsiri hii inafuata kwa karibu upeo wa wakati wa kauli ya Kiebrania na kubaki ya kawaida katika Kiswahili.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania huku likitumia tahajia inayoeleweka kwa wasomaji wa Kiswahili.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Cheo hiki kinamtambulisha Yehoyada kwa kazi yake; katika Kiswahili, ‘Yehoyada kuhani’ ni apposisheni ya asili na haihitaji kibainishi tofauti.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na ni umbo linalofaa kifonolojia katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo ‘machoni pa Yahwe’ umehifadhi sitiari ya asili; ‘siku zote za Yehoyada kuhani’ pia huhifadhi msisitizo wa muda wa Kiebrania.
