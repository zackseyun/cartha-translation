  text: וּֽ/כְ/כַלּוֹתָ֡/ם הֵבִ֣יאוּ לִ/פְנֵי֩ הַ/מֶּ֨לֶךְ וִֽ/יהוֹיָדָ֜ע אֶת שְׁאָ֣ר הַ/כֶּ֗סֶף וַ/יַּעֲשֵׂ֨/הוּ כֵלִ֤ים לְ/בֵית יְהוָה֙ כְּלֵ֣י שָׁרֵ֔ת וְ/הַעֲל֣וֹת וְ/כַפּ֔וֹת וּ/כְלֵ֥י זָהָ֖ב וָ/כָ֑סֶף וַ֠/יִּֽהְיוּ מַעֲלִ֨ים עֹל֤וֹת בְּ/בֵית יְהוָה֙ תָּמִ֔יד כֹּ֖ל יְמֵ֥י יְהוֹיָדָֽע־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: sw
  text: 'Walipomaliza, walileta fedha iliyobaki mbele ya mfalme na Yehoyada; na fedha hiyo ikafanywa kuwa vyombo kwa ajili ya nyumba ya Yahweh: vyombo vya huduma na vya kutolea[b], mabakuli, na vyombo vya dhahabu na fedha[a]. Nao waliendelea kutoa dhabihu za kuteketezwa katika nyumba ya Yahweh siku zote za Yehoyada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina kitenzi cha umoja na kiambishi cha yambwa cha umoja: “akaifanya.” Hakitaji wazi ni nani aliyefanya kazi hiyo.'
    reason: grammatical_ambiguity
  - marker: b
    text: Kiebrania kinasema kihalisi “vya kupandishia” au “vya kutolea”; kitu kilichotolewa hakikutajwa hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: Walipomaliza
  rationale: 'Muundo huu unaanzisha hali ya wakati: baada ya wao kumaliza kazi iliyotajwa katika muktadha. Kiswahili hiki ni cha kawaida na hakiongezi kitu kisichotajwa wazi.'
- source_word: שְׁאָר הַכֶּסֶף
  choice: fedha iliyobaki
  rationale: Neno כֶּסֶף linaweza kumaanisha fedha kama mali ya malipo au madini ya fedha. Kiswahili ‘fedha’ kinahifadhi uwezekano huo, unaofaa kwa kuwa mali hiyo ilitumika kutengeneza vyombo vya dhahabu na fedha.
- source_word: וַיַּעֲשֵׂהוּ
  choice: naye akaitengeneza
  rationale: 'Kitenzi na kiambishi cha yambwa viko katika umoja: ‘naye akaifanya/akaitengeneza.’ Tafsiri inadumisha umoja huo bila kumtaja fundi au mhusika mwingine ambaye Kiebrania hakumtaji wazi.'
- source_word: כֵלִים לְבֵית יְהוָה
  choice: vyombo kwa ajili ya nyumba ya Yahweh
  rationale: כֵלִים ni neno pana kwa vyombo au vifaa. ‘Nyumba ya Yahweh’ inadumisha msemo wa Kiebrania na jina la agano יְהוָה.
- source_word: כְּלֵי שָׁרֵת
  choice: vyombo vya huduma
  rationale: שׁרת hapa ni huduma ya ibada hekaluni. ‘Vyombo vya huduma’ ni wazi, cha heshima, na hakibani maana kwa aina moja ya chombo.
- source_word: וְהַעֲלוֹת
  choice: na vya kutolea
  rationale: Infinitivu hii ina maana ya kupandisha au kutoa, lakini yambwa lake halikutajwa. ‘Vya kutolea’ huonyesha matumizi ya kiibada bila kuingiza hapa ‘dhabihu za kuteketezwa,’ ambazo zinatajwa wazi baadaye.
- source_word: וְכַפּוֹת
  choice: mabakuli
  rationale: כַּפּוֹת ni vyombo vya ibada ambavyo umbo lake halijabainishwa kabisa; ‘mabakuli’ ni tafsiri pana na inayoeleweka.
- source_word: וּכְלֵי זָהָב וָכָסֶף
  choice: vyombo vya dhahabu na fedha
  rationale: 'Tafsiri hii inadumisha vifaa viwili vilivyotajwa wazi: dhahabu na fedha.'
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: Nao waliendelea kutoa dhabihu za kuteketezwa
  rationale: Muundo wa kitenzi pamoja na תָּמִיד unaonyesha tendo la kawaida na endelevu. ‘Waliendelea kutoa’ ni Kiswahili cha asili kinachohifadhi hali hiyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu יְהוָה moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Hali ya utoaji wa dhabihu katika kishazi cha mwisho
  choice: tendo lililoendelea siku zote za Yehoyada
  alternative: tendo la wakati uliopita lililosimuliwa kwa ujumla
  rationale: Muundo wa Kiebrania na תָּמִיד unaunga mkono desturi endelevu, lakini tafsiri haiongezi madai kuhusu mara ngapi dhabihu hizo zilitolewa.
- issue: Yambwa lisilotajwa baada ya וְהַעֲלוֹת
  choice: kutotaja kitu kilichotolewa
  alternative: kutaja dhabihu au dhabihu za kuteketezwa
  rationale: Kiebrania hakitaji yambwa katika sehemu hii; kwa hiyo tafsiri inaacha usemi ukiwa mpana na kuhifadhi mvutano huo hadi dhabihu za kuteketezwa zinapotajwa wazi baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. ‘Fedha’ imetumiwa kwa manufaa ya maana zake mbili zinazowezekana, yaani mali ya malipo na madini ya fedha. Muundo wa mwisho umefanywa wa asili kwa Kiswahili huku ukihifadhi mwendelezo wa ibada.
