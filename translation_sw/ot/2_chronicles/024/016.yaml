  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: sw
  text: Wakamzika katika Mji wa Daudi pamoja na wafalme[a], kwa sababu alikuwa ametenda mema katika Israeli, na kwa Mungu na nyumba yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa wafalme.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kwa Mungu na kwa nyumba ya Mungu, hekalu.
    reason: clarification
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: Wakamzika
  rationale: Kitenzi cha Kiebrania ni cha kutenda, wingi, kikiwa na kiambishi cha mtendwa wa kiume umoja. Kiswahili hiki kinahifadhi muundo huo huku waendaji wakibaki bila kutajwa.
- source_word: בְעִיר דָּוִיד
  choice: katika Mji wa Daudi
  rationale: Hili ni jina la mahali linalotambulika; 'Mji wa Daudi' ni usemi wa kawaida na wenye hadhi katika Kiswahili cha Biblia.
- source_word: עִם הַמְּלָכִים
  choice: pamoja na wafalme
  rationale: עִם humaanisha kimsingi 'pamoja na.' Katika muktadha wa maziko, usemi huu unaonyesha kwamba alizikwa katika ushirika au eneo la maziko la wafalme bila kudai kwa wazi zaidi ya Kiebrania.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya maziko yake ya heshima; 'kwa sababu' ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: עָשָׂה טוֹבָה
  choice: alikuwa ametenda mema
  rationale: Usemi huu unaeleza kutenda yaliyo mema au yenye manufaa. Wakati timilifu unaonyesha kwamba matendo hayo yalitangulia maziko yaliyotajwa.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Huhifadhi maana ya eneo au nyanja ambamo mema yake yalitendwa.
- source_word: וְעִם הָאֱלֹהִים
  choice: na kwa Mungu
  rationale: Ingawa עִם kwa kawaida ni 'pamoja na,' hapa mfululizo wa tathmini ya mema unaelekea kuonyesha mema yaliyohusiana na Mungu. 'Kwa Mungu' ni ya asili zaidi katika Kiswahili kuliko 'pamoja na Mungu' bila kufafanua sana uhusiano huo.
- source_word: וּבֵיתוֹ
  choice: na nyumba yake
  rationale: Kiambishi cha umilikaji kinahifadhiwa kama katika Kiebrania. Kirejeleo chake kinachowezekana zaidi ni Mungu, yaani nyumba ya Mungu, hekalu, lakini tafsiri kuu haipanui usemi huo.
theological_decisions:
- issue: Kirejeleo cha 'nyumba yake'
  choice: '''nyumba yake'' inarejelea nyumba ya Mungu, yaani hekalu'
  alternative: '''nyumba yake'' inarejelea nyumba ya Yehoyada mwenyewe'
  rationale: Nomino iliyo karibu ni 'Mungu,' na muktadha mpana unaeleza huduma ya Yehoyada kwa hekalu. Hata hivyo, kiwakilishi kinahifadhiwa katika matini kuu na ufafanuzi unawekwa katika tanbihi.
- issue: Uhusiano unaoonyeshwa na וְעִם הָאֱלֹהִים
  choice: mema aliyotenda kwa Mungu
  alternative: mema aliyotenda pamoja na Mungu
  rationale: Tafsiri ya neno kwa neno 'pamoja na Mungu' inaweza kusikika kama ushirika wa kutenda tendo lilelile. 'Kwa Mungu' inafaa zaidi na mfuatano wa mema aliyotenda katika Israeli na kuhusiana na nyumba ya Mungu, huku ikiepuka kuongeza fundisho lisilosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata kwa karibu mpangilio wa Kiebrania, lakini hutumia miundo ya kawaida ya Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
