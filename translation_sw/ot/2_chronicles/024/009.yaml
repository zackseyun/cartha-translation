base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: sw
  text: Nao wakatangaza katika Yuda na Yerusalemu kwamba watu walete kwa Yahweh mchango wa Mose, mtumishi wa Mungu, uliowekwa juu ya Israeli jangwani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchango uliowekwa” au “tozo ya Mose, mtumishi wa Mungu.” Neno la Kiebrania linaweza kumaanisha mchango uliokadiriwa au wajibu wa kutoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: wakatangaza
  rationale: Nahau hii, kwa maana halisi ‘wakatoa sauti,’ hapa inaonyesha tangazo la hadharani; ‘wakatangaza’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בִּיהוּדָה וּבִירוּשָׁלַם
  choice: katika Yuda na Yerusalemu
  rationale: Inahifadhi moja kwa moja maeneo ambako tangazo lilitolewa.
- source_word: לְהָבִיא
  choice: kwamba watu walete
  rationale: Infinitivu inaonyesha kusudi au yaliyomo katika tangazo; muundo huu ni wa asili katika Kiswahili na unaweka wazi kuwa watu ndio waliotakiwa kuleta.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Inatunza jina la agano יהוה kama jina maalumu badala ya kulibadilisha kuwa cheo.
- source_word: מַשְׂאַת
  choice: mchango uliowekwa
  rationale: Nomino inaweza kumaanisha mchango uliokadiriwa au wajibu wa kutoa. ‘Mchango uliowekwa’ huhifadhi wazo la mchango wa lazima bila kuufanya moja kwa moja kuwa kodi ya kisasa.
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: na Mose, mtumishi wa Mungu
  rationale: Inahifadhi uhusiano wa mchango huo na Mose pamoja na cheo chake cha kibiblia.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Tafsiri hii inahifadhi preposisheni עַל na uwezekano kwamba mchango huo ulikuwa wajibu uliowekwa juu ya Israeli, badala ya kuamua kimya kimya kuwa ulikuwa tu ‘kwa ajili ya Israeli.’
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: Ni tafsiri ya kawaida ya mazingira ya Israeli chini ya Mose, ikimaanisha eneo lisilokaliwa sana bila kulazimisha picha ya jangwa la mchanga.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina la Mungu; ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa mchango na Israeli katika עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  alternative: kwa ajili ya Israeli
  rationale: ‘Juu ya Israeli’ huhifadhi mvutano wa kisarufi na maana inayowezekana ya wajibu uliowekwa; ‘kwa ajili ya Israeli’ ingeweza kueleweka kama manufaa ya mchango na hivyo kuamua maana isiyo hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa wasomaji wa kawaida huku ikihifadhi uwezekano wa maana ya עַל na asili ya lazima ya מַשְׂאַת.
