  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: sw
  text: Kwa maana Athalia, yule mwanamke mwovu, na wanawe walivunja na kuingia katika nyumba ya Mungu na walivitumia vitu vyote vitakatifu vya nyumba ya Yahweh kwa ajili ya Mabaali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya moja kwa moja, “walivifanya vitu vyote vitakatifu vya nyumba ya Yahweh kwa ajili ya Mabaali.” Katika muktadha, huenda maana yake ni kwamba walivitwaa au walivitumia katika ibada ya Mabaali.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kihusishi hiki kinaanzisha sababu au maelezo ya agizo lililotangulia; “Kwa maana” ni cha kawaida na huhifadhi uhusiano huo.
- source_word: עֲתַלְיָהוּ
  choice: Athalia
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: הַמִּרְשַׁעַת
  choice: yule mwanamke mwovu
  rationale: Umbo la Kiebrania ni la kike na linamtaja Athalia kwa sifa ya uovu; “yule” hufanya kauli ya uambatano iwe ya kawaida katika Kiswahili.
- source_word: בָּנֶיהָ
  choice: wanawe
  rationale: Huhifadhi maana ya moja kwa moja ya “wana wake” kwa usemi mfupi na wa asili.
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: walivunja na kuingia katika nyumba ya Mungu
  rationale: פָרְצוּ ina wazo la kuvunja kwa nguvu au kufanya mwanya. Usemi huu unaonyesha kuvunja na kuvamia bila kuufanya kuwa uharibifu kamili wa jengo.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Huhifadhi taswira halisi ya Kiebrania na ulinganifu na “nyumba ya Yahweh” katika sehemu inayofuata.
- source_word: וְגַם
  choice: na
  rationale: Muundo wa sentensi tayari unaonyesha tendo la ziada; “na” ni laini na ya kawaida katika Kiswahili.
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: vitu vyote vitakatifu vya nyumba ya Yahweh
  rationale: קָדְשֵׁי ni vitu vilivyowekwa wakfu au vitu vitakatifu vya hekalu; tafsiri hii ni wazi kwa msomaji wa kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina, si kama cheo.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: walivitumia ... kwa ajili ya Mabaali
  rationale: Kitenzi עָשׂוּ kwa kawaida ni “walifanya,” lakini pamoja na vitu vya hekalu na לַבְּעָלִים kinaeleweka kwa kawaida kuwa walivielekeza au kuvitumia katika ibada ya Mabaali. Tanbihi huhifadhi uwezekano wa tafsiri ya moja kwa moja.
- source_word: בְּעָלִים
  choice: Mabaali
  rationale: Wingi wa Kiebrania umehifadhiwa; unaweza kumaanisha miungu, sanamu, au maumbo mbalimbali ya ibada ya Baali.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Wingi wa בְּעָלִים
  choice: Mabaali
  alternative: Baali au sanamu za Baali
  rationale: Wingi wa chanzo umeachwa wazi badala ya kusawazishwa kuwa jina la umoja au kufafanuliwa moja kwa moja kuwa sanamu.
- issue: Maana ya עָשׂוּ לַבְּעָלִים
  choice: walivitumia ... kwa ajili ya Mabaali
  alternative: walivifanya ... kwa ajili ya Mabaali
  rationale: Muktadha unaelekea kwenye kutumia au kuhamishia vitu vitakatifu katika ibada ya Mabaali, lakini maana ya msingi “walifanya” ni halisi na imehifadhiwa katika tanbihi ili kutoficha utata wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nyumba ya Mungu” na “nyumba ya Yahweh” zimehifadhiwa ili kuonyesha urudiaji wa chanzo. “Mabaali” ni wingi wa moja kwa moja unaohifadhi mvutano wa kihistoria na wa kiibada bila maelezo ya kimadhehebu.
