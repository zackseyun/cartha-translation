source:
  edition: WLC
  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: sw
  text: Lakini Yahwe hakutaka kuiangamiza nyumba ya Daudi, kwa sababu ya agano alilofanya na Daudi, na kama alivyosema kwamba angewapa Daudi na wanawe taa siku zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “siku zote”; katika muktadha huu usemi huo unaweza kueleweka kuwa “milele.” “Taa” ni sitiari inayoweza kumaanisha kuendelea kwa ukoo au utawala wa Daudi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Lakini ... hakutaka
  rationale: אָבָה huonyesha nia au kukubali kufanya jambo; “hakutaka” ni Kiswahili cha kawaida kinachohifadhi maana hiyo. Kiunganishi “Lakini” kinaonyesha tofauti na hukumu iliyotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לְהַשְׁחִית
  choice: kuiangamiza
  rationale: Hifili ya שׁחת hapa ina maana ya kuifikisha nyumba ya Daudi kwenye uharibifu; “kuiangamiza” huwasilisha nguvu hiyo wazi.
- source_word: בֵּית דָּוִיד
  choice: nyumba ya Daudi
  rationale: Huhifadhi nahau ya Kiebrania na mwangwi wake wa kibiblia, huku katika muktadha ikirejelea ukoo wa kifalme wa Daudi.
- source_word: לְמַעַן הַבְּרִית
  choice: kwa sababu ya agano
  rationale: לְמַעַן hapa huonyesha sababu au msingi wa tendo la Yahwe.
- source_word: כָּרַת ... לְדָוִיד
  choice: alilofanya na Daudi
  rationale: Nahau ya Kiebrania ya ‘kukata agano’ imetafsiriwa kwa Kiswahili cha kawaida ‘kufanya agano’; “na Daudi” huonyesha uhusiano wa wahusika wa agano.
- source_word: וְכַאֲשֶׁר אָמַר
  choice: na kwa kuwa alikuwa amesema
  rationale: Huhifadhi marejeo kwa neno la Mungu lililotangulia bila kulifafanua moja kwa moja kuwa ahadi.
- source_word: לָתֵת לוֹ נִיר
  choice: angempa ... taa
  rationale: “Taa” huhifadhi sitiari ya נִיר kuhusu kuendelea kwa ukoo au utawala wa Daudi badala ya kuibadilisha kuwa maelezo ya moja kwa moja.
- source_word: וּלְבָנָיו
  choice: yeye na wanawe
  rationale: Huonyesha Daudi na wanawe kama wapokeaji wa taa kwa Kiswahili cha asili, huku “wanawe” ikifuata maana mahsusi ya Kiebrania.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Ni usemi wa kawaida wa Kiswahili unaolingana kwa karibu na ‘siku zote’ katika Kiebrania, bila kulazimisha tafsiri yenye nguvu zaidi ya ‘milele.’
theological_decisions:
- issue: Sitiari ya kifalme ya נִיר katika muktadha wa agano la Daudi
  choice: taa
  alternative: nuru; nasaba ya kifalme
  rationale: “Taa” huhifadhi sitiari ya kibiblia kuhusu kuendelea kwa ukoo na utawala wa Daudi na haiondoi mvutano wake wa kiteolojia kwa maelezo ya moja kwa moja.
- issue: Upeo wa כָּל הַיָּמִים
  choice: siku zote
  alternative: milele
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania na kuacha muktadha uamue upeo wake badala ya kuufanya wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa kuwa wa kawaida kwa msomaji wa kawaida, huku nahau muhimu za kibiblia “nyumba ya Daudi” na “taa” zikihifadhiwa.
