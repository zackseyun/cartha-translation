revisions:
- from: Lakini Yahwe hakutaka kuiangamiza nyumba ya Daudi, kwa sababu ya agano alilofanya na Daudi, na kwa kuwa alikuwa amesema kwamba angempa yeye na wanawe taa siku zote.[a]
  to: Lakini Yahwe hakutaka kuiangamiza nyumba ya Daudi, kwa sababu ya agano alilofanya na Daudi, na kama alivyosema kwamba angewapa Daudi na wanawe taa siku zote.[a]
  rationale: Nimebadilisha “na kwa kuwa alikuwa amesema” kuwa “na kama alivyosema” ili kutafsiri kwa usahihi וְכַאֲשֶׁר אָמַר. Pia “angewapa Daudi na wanawe” hufanya walengwa wa ahadi waeleweke wazi kwa Kiswahili, bila kubadili maana ya “kwake na wanawe.” Maandishi mengine na tanbihi yamehifadhiwa.
