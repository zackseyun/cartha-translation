base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: sw
  text: Wakati wa utawala wake, Edomu iliasi mamlaka ya Yuda[a], nao wakajimweka mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “iliasi kutoka chini ya mkono wa Yuda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Katika siku zake
  rationale: Nahau ya wakati inataja kipindi cha utawala wa Yehoramu. Tafsiri hii inahifadhi usemi wa Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: פָּשַׁע
  choice: iliasi
  rationale: Katika muktadha huu wa kisiasa, kitenzi kinaonyesha kuasi au kujitenga na mamlaka, si kosa la kimaadili kwa ujumla.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali na taifa hilo.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: kutoka chini ya mkono wa Yuda
  rationale: Tafsiri inahifadhi taswira halisi ya Kiebrania ya kuwa chini ya mkono wa mwingine, yaani chini ya mamlaka yake; tanbihi inaeleza maana ya nahau hiyo.
- source_word: וַיַּמְלִיכוּ
  choice: wakajiwekea
  rationale: Hifili ya מלך hapa ina maana ya kumsimamisha mtu awe mfalme. 'Wakajiwekea' ni ya asili katika Kiswahili na huonyesha kwamba Waedomu wenyewe walimweka mfalme.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: mfalme
  rationale: Muundo wa 'wakajiwekea mfalme' kwa kawaida unajumuisha maana ya kumweka mfalme juu yao wenyewe bila kurudia maneno yasiyo ya lazima.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Chini ya mkono wa Yuda' huhifadhi taswira ya chanzo, huku tanbihi ikifafanua nahau hiyo. Ubadilishaji kutoka 'Edomu iliasi' hadi 'nao wakajiwekea' unatendea Edomu kwanza kama taifa kisha watu wake kama kundi, sawasawa na wingi wa kitenzi cha pili katika Kiebrania.
