source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: sw
  text: Walikuja dhidi ya Yuda, wakaingia kwa nguvu, wakachukua mali yote iliyokuwa katika ikulu ya mfalme, pamoja na wanawe na wake zake. Hakusalia na mwana yeyote isipokuwa Yehoahazi[a], mwanawe mdogo zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaelekea Yehoahazi ndiye yule anayeitwa Ahazia mahali pengine (linganisha 2 Wafalme 8:24–26; 2 Mambo ya Nyakati 22:1).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: Wakaishambulia Yuda
  rationale: Kitenzi עלה pamoja na ב katika muktadha huu wa kijeshi kinaonyesha kusonga dhidi ya eneo hilo. Tafsiri hii inaweka wazi shambulio bila kuongeza maelezo yasiyomo.
- source_word: וַיִּבְקָעוּהָ
  choice: na kuivamia
  rationale: בקע humaanisha kupasua au kuvunja na kuingia. Yuda ikiwa ndiyo yambwa, ‘kuivamia’ ni Kiswahili cha kawaida kinachoonyesha kuvunja ulinzi na kuingia kwa nguvu.
- source_word: וַיִּשְׁבּוּ
  choice: wakateka
  rationale: שבה hutaja kuteka au kuchukua mateka. Hapa inahusu mali na watu kwa pamoja, na ‘kuteka’ linaweza kubeba maana zote mbili katika muktadha huu.
- source_word: כָּל הָרְכוּשׁ
  choice: mali yote
  rationale: רכוש ni mali, vitu, au utajiri unaomilikiwa; ‘mali yote’ ni fasaha na pana vya kutosha.
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: iliyopatikana katika nyumba ya mfalme
  rationale: Tafsiri hii inadumisha maana ya נמצא, ‘iliyopatikana/iliyokuwamo,’ na usemi wa Kiebrania ‘nyumba ya mfalme,’ ambao katika muktadha unaweza kumaanisha jumba la kifalme.
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: pamoja na wanawe na wake zake
  rationale: גם inaongeza wana na wake katika vitu na watu waliotekwa; ‘pamoja na’ ni muunganisho wa asili katika Kiswahili.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: Hakubakiwa na mwana yeyote
  rationale: 'Kauli hii inaonyesha matokeo ya kutekwa: hakuna mwana aliyesalia kwake. Muundo wa Kiswahili ni wazi na wa kawaida.'
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Huutambulisha ubaguzi mmoja pekee, kwa hiyo ‘isipokuwa’ linaonyesha maana hiyo moja kwa moja.
- source_word: יְהוֹאָחָז
  choice: Yehoahazi
  rationale: Jina katika WLC limehifadhiwa katika matini kuu badala ya kubadilishwa kuwa Ahazia; utambulisho mbadala umeelezwa katika tanbihi.
- source_word: קְטֹן בָּנָיו
  choice: aliyekuwa mdogo kuliko wanawe wote
  rationale: קטן katika uhusiano wa kifamilia humaanisha mwenye umri mdogo zaidi, si mdogo kwa ukubwa wa mwili.
theological_decisions:
- issue: Jina la mwana wa Yehoramu aliyesalia
  choice: Kuhifadhi jina la MT ‘Yehoahazi’ katika matini kuu
  alternative: Kumtaja ‘Ahazia’ kwa kufuata vifungu sambamba
  rationale: Hili ni suala la utambulisho wa jina katika mapokeo ya matini, si fundisho la dhehebu. Kipaumbele cha chanzo cha Kiebrania kinahitaji ‘Yehoahazi’ ibaki katika matini, huku uwezekano wa kuwa ndiye Ahazia ukielezwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimefuata mfululizo wa vitendo vya Kiebrania kwa namna ya kawaida katika Kiswahili, huku istilahi za kijeshi zikieleweka kwa msomaji wa kawaida.
