id: 2CH.21.6
reference: 2 Chronicles 21:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: sw
  text: Akaenenda katika njia ya wafalme wa Israeli, kama walivyofanya watu wa nyumba ya Ahabu, kwa maana binti ya Ahabu alikuwa mke wake. Akafanya yaliyo maovu machoni pa Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Akaenenda katika njia
  rationale: Muundo huu unaeleza mwenendo wa maisha. Tafsiri hii inadumisha sitiari ya Kiebrania huku ikieleweka kwa Kiswahili cha heshima.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: wafalme wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya watawala wa ufalme wa kaskazini waliokuwa kielelezo cha mwenendo wake.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: kama walivyofanya watu wa nyumba ya Ahabu
  rationale: Kitenzi cha wingi עָשׂוּ kinaonyesha kwamba 'nyumba ya Ahabu' inatazamwa kwa maana ya watu wa jamaa au nasaba yake; kuongeza 'watu wa' hufanya upatanisho wa wingi uwe wa kawaida katika Kiswahili bila kuondoa sitiari ya nyumba.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu inayoeleza uhusiano wake na nyumba ya Ahabu.
- source_word: בַּת אַחְאָב
  choice: binti ya Ahabu
  rationale: Aya yenyewe inamtaja kwa uhusiano wake na Ahabu, bila kutumia jina lake; tafsiri inadumisha namna hiyo.
- source_word: הָיְתָה לּוֹ אִשָּׁה
  choice: alikuwa mke wake
  rationale: Muundo unaonyesha uhusiano wa ndoa uliokuwapo, si lazima mwanzo wa ndoa wakati huo.
- source_word: וַיַּעַשׂ הָרַע
  choice: Akafanya yaliyo maovu
  rationale: Kivumishi chenye kibainishi הָרַע kimetafsiriwa kama jambo lililo ovu; wingi wa Kiswahili 'yaliyo maovu' ni usemi wa kawaida unaokusanya matendo maovu.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Hii inadumisha nahau ya Kiebrania ya tathmini ya Mungu kwa Kiswahili kinachoeleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa umbo linalotumika na kueleweka katika Kiswahili, badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. 'Yahwe' hulihifadhi kama jina na ni umbo la Kiswahili linalolingana na matamshi yanayokubalika kitaaluma, bila kulibadilisha kuwa cheo.
- issue: Maana ya בֵּית אַחְאָב
  choice: watu wa nyumba ya Ahabu
  alternative: nasaba ya Ahabu; jamaa ya Ahabu
  rationale: Neno 'nyumba' linaweza kumaanisha jamaa au nasaba ya kifalme. Tafsiri inadumisha picha ya chanzo na, kwa 'watu wa', inaonyesha wazi kuwa kitenzi cha wingi kinawahusu walio katika nyumba hiyo bila kuifungia maana katika 'nasaba' pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sitiari za 'kuenenda katika njia' na 'machoni pa' zimehifadhiwa kwa kuwa zinaeleweka na zinabeba mtindo wa Kiebrania. Hakuna alama za tanbihi kwa sababu hakuna tanbihi iliyohitajika.
