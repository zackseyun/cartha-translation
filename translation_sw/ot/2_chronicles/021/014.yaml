base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: sw
  text: Tazama,[a] Yahweh anakaribia kuleta pigo kubwa juu ya watu wako, wana wako, wake zako, na mali yako yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama, Yahweh anawaletea ... pigo kubwa,” au, “Tazama, Yahweh ataleta ... pigo kubwa.” Umbo la kitenzi cha Kiebrania linaweza kuonyesha tendo linalokaribia, linaloendelea, au la wakati ujao; neno lililotafsiriwa “pigo” linaweza pia kumaanisha tauni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linadumisha nguvu ya neno la kuvuta fikira na uzito wa tangazo la kinabii kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linawakilisha moja kwa moja jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: נֹגֵף
  choice: yuko karibu kuwapiga
  rationale: Katika muundo wa הִנֵּה pamoja na kivumishi-tendo, tendo linaweza kuwasilishwa kama hukumu inayokaribia; Kiswahili hiki kinaonyesha ukaribu huo kwa namna ya kawaida.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: kwa pigo kubwa
  rationale: מַגֵּפָה inaweza kumaanisha tauni au pigo zito lililoletwa na Mungu. 'Pigo kubwa' huhifadhi upana wa maana bila kulazimisha kuwa ugonjwa pekee.
- source_word: בְּעַמֶּךָ
  choice: watu wako
  rationale: Herufi ב katika muundo huu inataja waathiriwa wa kupigwa; kiambishi cha yambwa katika 'kuwapiga' kinatoa Kiswahili cha moja kwa moja.
- source_word: וּבְבָנֶיךָ
  choice: wana wako
  rationale: בנים ni wingi wa kiume; 'wana wako' hudumisha rejeo hilo bila kulifanya kuwa 'watoto' kwa ujumla.
- source_word: וּבְנָשֶׁיךָ
  choice: wake zako
  rationale: Katika muktadha huu wa umilikaji, נָשִׁים ina maana ya wake, si wanawake kwa ujumla.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: na mali yako yote
  rationale: רְכוּשׁ hurejelea mali au vitu vinavyomilikiwa; 'mali yako yote' ni ya asili na pana katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina lenyewe; 'Yahweh' hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Nguvu ya נֹגֵף katika tangazo la kinabii
  choice: 'wakati ujao ulio karibu: ''yuko karibu kuwapiga'''
  alternative: 'wakati unaoendelea: ''anawapiga''; au wakati ujao sahili: ''atawapiga'''
  rationale: Muundo הִנֵּה pamoja na participle mara nyingi huonyesha tendo linalokaribia katika tangazo la kinabii. Tanbihi huhifadhi uwezekano wa tafsiri nyingine.
- issue: Maana ya מַגֵּפָה
  choice: pigo
  alternative: tauni
  rationale: Neno linaweza kueleza tauni au pigo/adhabu kali kutoka kwa Mungu. 'Pigo' hudumisha utata huo wa kileksika katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Tazama' linafaa kwa tangazo zito la kinabii; 'yuko karibu kuwapiga' ni la asili na linaonyesha hukumu inayokaribia. Orodha imedumishwa kwa uwazi na kwa mpangilio wa Kiebrania.
