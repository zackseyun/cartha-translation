base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: sw
  text: Nawe mwenyewe utapatwa na magonjwa mengi, pamoja na ugonjwa wa matumbo yako[a], mpaka matumbo yako yatoke kwa sababu ya ugonjwa huo, siku baada ya siku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viungo vyako vya ndani”; neno la Kiebrania hurejelea viungo vya ndani, hasa matumbo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “siku juu ya siku,” nahau yenye maana ya “siku baada ya siku” au “kwa siku nyingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nawe mwenyewe
  rationale: Kiwakilishi huru kinaweka mkazo wa moja kwa moja juu ya Yehoramu; “mwenyewe” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: בָּחֳלָיִם רַבִּים
  choice: utapatwa na magonjwa mengi
  rationale: Kirai cha Kiebrania kinaeleza hali ya kuandamwa na magonjwa mengi. Kiswahili hiki ni cha asili na kinahifadhi wingi wa magonjwa bila kuongeza maelezo yasiyokuwapo.
- source_word: בְּמַחֲלֵה
  choice: pamoja na ugonjwa
  rationale: Kihusishi ב kinaanzisha ugonjwa mahususi unaofafanua zaidi magonjwa yaliyotajwa. “Pamoja na” kinahifadhi uhusiano huo bila kukifanya kihusishi kiwe cha chanzo.
- source_word: מֵעֶיךָ
  choice: matumbo yako
  rationale: Neno מֵעֶה hurejelea viungo vya ndani, hasa matumbo. “Matumbo” ni neno la kawaida na lenye kueleweka katika muktadha huu.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: mpaka matumbo yako yatoke
  rationale: Tafsiri hii inahifadhi moja kwa moja picha kali ya matokeo ya ugonjwa na haisitiri maana ya kitenzi יצא, “kutoka.”
- source_word: מִן הַחֹלִי
  choice: kwa sababu ya ugonjwa huo
  rationale: 'Kihusishi מן hapa kinaonyesha sababu: matumbo yanatoka kutokana na ugonjwa huo.'
- source_word: יָמִים עַל יָמִים
  choice: siku baada ya siku
  rationale: Nahau hii huonyesha hali inayoendelea kwa siku zinazofuatana; “siku baada ya siku” ni usemi wa kawaida unaohifadhi maana hiyo.
