reference: 2 Chronicles 21:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם אֲ֠בִי/הֶם מַתָּנ֨וֹת רַבּ֜וֹת לְ/כֶ֤סֶף וּ/לְ/זָהָב֙ וּ/לְ/מִגְדָּנ֔וֹת עִם עָרֵ֥י מְצֻר֖וֹת בִּֽ/יהוּדָ֑ה וְ/אֶת הַ/מַּמְלָכָ֛ה נָתַ֥ן לִֽ/יהוֹרָ֖ם כִּי ה֥וּא הַ/בְּכֽוֹר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: sw
  text: Baba yao aliwapa zawadi nyingi za fedha, dhahabu, na vitu vya thamani,[a] pamoja na miji yenye ngome katika Yuda; lakini ufalme alimpa Yehoramu, kwa sababu alikuwa mzaliwa wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu bora” au “zawadi za gharama kubwa.” Neno la Kiebrania linaweza kumaanisha kwa upana vitu vya thamani au vilivyochaguliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: Baba yao aliwapa
  rationale: Muundo huu wa Kiswahili unawasilisha wazi mhusika, wapokeaji, na tendo la wakati uliopita katika mtiririko wa simulizi.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: zawadi nyingi
  rationale: Huhifadhi maana ya wingi na ni usemi wa kawaida katika Kiswahili cha sasa.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: za fedha, dhahabu
  rationale: Kiambishi לְ kinataja aina au makundi ya zawadi; 'za' ni muundo wa asili wa Kiswahili bila kubainisha kupita kiasi kama vitu hivyo vilitengenezwa kwa metali hizo au vilitolewa kama mali.
- source_word: וּלְמִגְדָּנוֹת
  choice: na vitu vya thamani
  rationale: Neno linaweza kumaanisha vitu bora, vya kuchaguliwa, au vya gharama. Katika muktadha wa zawadi za kifalme, tafsiri pana 'vitu vya thamani' inafaa kuliko maana finyu ya vyakula vitamu.
- source_word: עִם עָרֵי מְצֻרוֹת
  choice: pamoja na miji yenye ngome
  rationale: '''Pamoja na'' huhifadhi wazo la nyongeza, na ''miji yenye ngome'' ni Kiswahili cha kawaida kwa miji iliyoimarishwa kwa ulinzi.'
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Ni kishazi cha mahali kinachobainisha miji hiyo ilikokuwa.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: lakini ufalme alimpa Yehoramu
  rationale: Ingawa וְ kimsingi ni 'na,' hapa kuna utofautishaji wa wazi kati ya zawadi walizopewa ndugu wengine na ufalme aliopewa Yehoramu; 'lakini' huonyesha uhusiano huo kwa Kiswahili cha asili.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: kwa sababu alikuwa mzaliwa wa kwanza
  rationale: כִּי inatoa sababu, na 'mzaliwa wa kwanza' huhifadhi hadhi ya kifamilia inayotajwa na הַבְּכוֹר.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mpangilio 'ufalme alimpa Yehoramu' unadumisha msisitizo wa kifungu cha Kiebrania kwa kuweka ufalme mbele ya kitenzi. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
