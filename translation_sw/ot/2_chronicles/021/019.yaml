  text: וַ/יְהִ֣י לְ/יָמִ֣ים מִ/יָּמִ֡ים וּ/כְ/עֵת֩ צֵ֨את הַ/קֵּ֜ץ לְ/יָמִ֣ים שְׁנַ֗יִם יָצְא֤וּ מֵעָי/ו֙ עִם חָלְי֔/וֹ וַ/יָּ֖מָת בְּ/תַחֲלֻאִ֣ים רָעִ֑ים וְ/לֹא עָ֨שׂוּ ל֥/וֹ עַמּ֛/וֹ שְׂרֵפָ֖ה כִּ/שְׂרֵפַ֥ת אֲבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: sw
  text: Baada ya muda kupita, miaka miwili ilipotimia, matumbo yake[a] yakatoka kwa sababu ya ugonjwa wake, naye akafa kwa maradhi makali. Watu wake hawakumfanyia uchomaji[b] kama ule wa baba zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viungo vyake vya ndani.” Neno la Kiebrania hurejelea sehemu za ndani za mwili, hasa matumbo.
    reason: lexical_alternative
  - marker: b
    text: Huenda huu ulikuwa uchomaji wa manukato au vitu vingine kwa heshima ya marehemu, wala si kuchoma mwili wake; linganisha desturi za mazishi ya kifalme kwingine katika Mambo ya Nyakati.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: Baada ya muda kupita
  rationale: Nahau hii ya Kiebrania inaonyesha kupita kwa kipindi kisichotajwa kwa urefu; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: miaka miwili ilipotimia
  rationale: Hueleza kwamba hatua hii ya ugonjwa ilitokea mwishoni mwa kipindi cha miaka miwili.
- source_word: מֵעָיו
  choice: matumbo yake
  rationale: Neno hilo hurejelea viungo vya ndani, hasa matumbo; uchaguzi huu unaeleweka kwa urahisi na haupunguzi ukali wa tukio.
- source_word: יָצְאוּ מֵעָיו
  choice: matumbo yake yakatoka
  rationale: Kitenzi יָצָא kina maana yake ya kawaida ya ‘kutoka’; maelezo ya wazi na ya kutisha ya matini yamehifadhiwa.
- source_word: עִם חָלְיוֹ
  choice: kwa sababu ya ugonjwa wake
  rationale: Ingawa עִם kwa kawaida humaanisha ‘pamoja na,’ hapa inaeleza hali au sababu iliyoambatana na tukio.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: kwa maradhi makali
  rationale: Wingi wa nomino umehifadhiwa, na ‘makali’ huwasilisha uzito na uchungu unaodokezwa na kivumishi רָעִים.
- source_word: שְׂרֵפָה
  choice: uchomaji wa mazishi
  rationale: Huhifadhi wazo la kuwasha au kuchoma katika desturi ya kumheshimu marehemu bila kudai katika matini kuu kwamba mwili ulichomwa.
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: kama ule waliowafanyia baba zake
  rationale: Huhifadhi ulinganisho na heshima ya mazishi waliyopewa wafalme waliomtangulia, huku ‘baba zake’ ikifuata taswira ya Kiebrania.
theological_decisions:
- issue: Asili ya שְׂרֵפָה katika mazishi ya kifalme
  choice: uchomaji wa heshima katika mazishi, huenda wa manukato, bila kuutambulisha kuwa uchomaji wa mwili
  alternative: uchomaji wa maiti au ibada ya uchomaji isiyoelezwa
  rationale: Muktadha wa Mambo ya Nyakati unalinganisha heshima ya kifalme waliyopewa wafalme waliotangulia na ile aliyonyimwa Yehoramu. Matini kuu inabaki karibu na neno la Kiebrania, na tanbihi inaeleza uwezekano wa desturi hiyo bila kuufanya kuwa hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Maelezo makali ya ugonjwa hayajalainishwa. ‘Uchomaji wa mazishi’ umetumiwa pamoja na tanbihi ili kuhifadhi neno la chanzo na kutodai kwamba ulikuwa uchomaji wa maiti.
