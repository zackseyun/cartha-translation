  text: גַּם ה֥וּא עָשָֽׂה בָמ֖וֹת בְּ/הָרֵ֣י יְהוּדָ֑ה וַ/יֶּ֨זֶן֙ אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וַ/יַּדַּ֖ח אֶת יְהוּדָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: sw
  text: Yeye pia alijenga mahali pa juu pa kuabudia katika milima ya Yuda, akawafanya wakazi wa Yerusalemu wafanye ukahaba[a], na akaipotosha Yuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawafanya wakazi wa Yerusalemu wajiuze kama makahaba.” Kitenzi cha Kiebrania hutumia lugha ya ukahaba ambayo inaweza kumaanisha uasherati na pia kukosa uaminifu kwa Mungu kwa kuabudu miungu mingine.
    reason: lexical_alternative
  - marker: b
    text: Au, “akaifanya Yuda ipotee njia,” au “akaiondoa Yuda kutoka kwa BWANA.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Yeye pia
  rationale: 'Muundo huu unahifadhi msisitizo wa kiwakilishi pamoja na maana ya nyongeza: Yehoramu naye alifanya mambo hayo.'
- source_word: עָשָׂה בָמוֹת
  choice: alijenga mahali pa juu pa kuabudia
  rationale: Ingawa עשה kwa msingi ni ‘alifanya,’ inapokuwa na בָמוֹת inaashiria kuanzisha au kujenga maeneo ya ibada. ‘Mahali pa juu pa kuabudia’ ni wazi kwa msomaji wa sasa na huhifadhi maana ya maeneo hayo ya ibada.
- source_word: בְּהָרֵי יְהוּדָה
  choice: katika milima ya Yuda
  rationale: הרים inaweza kumaanisha milima au eneo la vilima. ‘Katika milima ya Yuda’ ni Kiswahili cha kawaida na kinahifadhi maelezo ya kijiografia bila kuongeza ufafanuzi usiotajwa.
- source_word: וַיֶּזֶן
  choice: akawafanya ... wafanye ukahaba
  rationale: Hii ni kausativi ya זנה, yenye picha halisi ya ukahaba lakini ambayo katika muktadha wa agano pia huonyesha kuasi kwa kidini. Tafsiri hii inadumisha picha kali ya Kiebrania badala ya kuifuta; tanbihi inaeleza upana wake.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: wakazi wa Yerusalemu
  rationale: Ni tafsiri sahihi, fupi, na ya kawaida ya ‘wakaao/wakazi wa Yerusalemu.’
- source_word: וַיַּדַּח אֶת יְהוּדָה
  choice: akaipotosha Yuda
  rationale: Katika kausativi, נדח hapa ni kusababisha Yuda ipotee njia au iachane na uaminifu wake. ‘Akaipotosha’ huonyesha tendo hilo bila kuongeza wazi ‘kutoka kwa BWANA,’ maneno ambayo hayapo katika mstari huu.
theological_decisions:
- issue: Ikiwa ukahaba ni wa kingono tu au pia ni mfano wa kuasi agano
  choice: Kudumisha neno ‘ukahaba’ katika matini na kueleza maana yake pana katika tanbihi
  alternative: akawafanya wakazi wa Yerusalemu waasi kwa kuabudu miungu mingine
  rationale: Muktadha wa mahali pa juu pa kuabudia unaonyesha uasi wa kidini, lakini picha ya Kiebrania inaweza pia kuibua uasherati halisi. Tafsiri haipaswi kuondoa kwa kimya utata huo.
- issue: Ikiwa kitu ambacho Yuda ilipotoshwa kutoka kwake kitajwe wazi
  choice: akaipotosha Yuda
  alternative: akaiondoa Yuda kwa BWANA
  rationale: Muktadha unaelekeza kwenye kuondoka kwa BWANA, lakini Kiebrania hakitaji wazi ‘kwa BWANA’ hapa. Matini kuu kwa hiyo inadumisha ufupi na ukosefu huo wa kitu kilichotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mahali pa juu pa kuabudia’ hufafanua istilahi ya kihistoria bila kuitambulisha moja kwa moja na dhehebu fulani; ‘ukahaba’ hudumisha picha ya Kiebrania na tanbihi huzuia isieleweke kwa maana ya kingono pekee.
