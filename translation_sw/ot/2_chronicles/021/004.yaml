base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: sw
  text: Yehoramu alipochukua mamlaka juu ya ufalme wa baba yake na kujiimarisha, aliwaua ndugu zake wote kwa upanga, na pia baadhi ya wakuu[a] wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafisa” au “viongozi.” Neno la Kiebrania linaweza kumaanisha wakuu wa utawala au maafisa wenye vyeo vya juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: alipoanza kutawala ufalme wa baba yake
  rationale: Katika muktadha wa kifalme, קום pamoja na עַל inaonyesha kuingia katika utawala na kuwa na mamlaka juu ya ufalme. Tafsiri hii ni ya asili katika Kiswahili na inahifadhi wazo la kutwaa utawala, bila kutumia picha isiyo ya kawaida ya ‘kuinuka juu ya ufalme.’
- source_word: וַיִּתְחַזַּק
  choice: na kujiimarisha
  rationale: Umbo la hitpaeli lina maana ya kujitendea; ‘kujiimarisha’ linahifadhi maana hiyo bila kuamua kim kimuktadha kama kuimarika huko kulikuwa hasa kwa kisiasa au kijeshi.
- source_word: וַיַּהֲרֹג אֶת כָּל אֶחָיו
  choice: aliwaua ndugu zake wote
  rationale: ‘Aliwaua’ ni lugha ya sasa na ya wazi, nayo ‘ndugu zake’ katika muktadha huu inarejelea ndugu zake wa kiume kama ilivyo katika Kiebrania.
- source_word: בֶּחָרֶב
  choice: kwa upanga
  rationale: Hii ni tafsiri ya kawaida ya kishazi cha Kiebrania kinachoonyesha chombo au njia ya kuua.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: pamoja na baadhi ya wakuu wa Israeli
  rationale: מִן lina maana ya sehemu ya kundi, kwa hiyo ‘baadhi ya’ ni muhimu. שָׂרִים inaweza kumaanisha wakuu, maafisa, au viongozi; ‘wakuu’ linafaa katika mazingira ya kifalme huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions:
- issue: Maana ya ‘Israeli’ katika ‘wakuu wa Israeli’
  choice: Israeli
  alternative: Yuda; taifa
  rationale: Jina ‘Israeli’ limehifadhiwa kama lilivyo katika chanzo. Mambo ya Nyakati linaweza kulitumia kwa maana pana ya watu wa agano au ukoo wa kifalme hata katika mazingira ya Yuda; tafsiri haipaswi kuondoa mvutano huo wa kihistoria na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘alipoanza kutawala … na kujiimarisha’ unaeleza mfuatano wa matukio kwa ufasaha bila kuongeza kiunganishi kisichokuwapo wazi katika chanzo. Alama ya tanbihi imewekwa baada ya ‘wakuu,’ neno ambalo tanbihi inalifafanua.
