translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi yenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umefanywa wa asili kwa Kiswahili huku mfuatano wa matukio na upana wa maana za kijeshi za Kiebrania vikihifadhiwa.
