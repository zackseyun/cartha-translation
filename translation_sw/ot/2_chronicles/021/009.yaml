base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: sw
  text: Basi Yehoramu akavuka pamoja na majemadari wake na magari yote ya vita yaliyokuwa pamoja naye. Kisha akainuka usiku, akawapiga Waedomu waliokuwa wamemzunguka, na majemadari wa magari ya vita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maofisa wa kikosi cha magari ya vita.” Kirai cha Kiebrania kinaweza kumaanisha hasa viongozi wa kikosi cha magari ya vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: akavuka
  rationale: Kitenzi עבר humaanisha kupita au kuvuka. “Akavuka” kinahifadhi wazo la mwendo bila kuongeza mahali alikoelekea au mbinu ya kijeshi isiyotajwa.
- source_word: שָׂרָיו
  choice: majemadari wake
  rationale: Katika muktadha huu wa kijeshi, שַׂר inaeleweka kwa kawaida kuwa viongozi au maofisa wa kijeshi; “majemadari” ni neno la kawaida na lenye hadhi.
- source_word: הָרֶכֶב
  choice: magari yote ya vita
  rationale: רֶכֶב inaweza kumaanisha magari ya vita kwa ujumla au kikosi chake. “Magari ya vita” ni wazi kwa msomaji wa kisasa na linafaa kwa mazingira ya kale.
- source_word: וַיְהִי קָם לַיְלָה
  choice: Usiku akaondoka
  rationale: Muundo wa Kiebrania unasimulia kwamba Yehoramu alichukua hatua usiku. “Akaondoka” ni Kiswahili cha asili kinachobeba maana ya kuinuka na kuanza kutenda bila uzito usio wa lazima wa fomula ya Kiebrania.
- source_word: וַיַּךְ
  choice: akawashambulia
  rationale: נכה ni kitenzi kipana cha kupiga au kushambulia. Katika pambano la kijeshi, “akawashambulia” ni cha asili na hakidai kwamba aliwashinda kabisa.
- source_word: אֱדוֹם
  choice: Waedomu
  rationale: Hapa jina la nchi linawakilisha watu au jeshi lake, kama inavyoonekana pia katika kitenzi na maelezo ya kuzunguka; “Waedomu” hufanya rejeleo hilo lieleweke kwa kawaida katika Kiswahili.
- source_word: הַסּוֹבֵב אֵלָיו
  choice: waliokuwa wamemzunguka
  rationale: Kirai elezi cha סבב kinaonyesha kuwa Waedomu walikuwa wamemzingira Yehoramu. Wakati timilifu “walikuwa wamemzunguka” unaonyesha hali iliyokuwapo kabla ya shambulio la usiku.
- source_word: שָׂרֵי הָרָכֶב
  choice: majemadari wa magari ya vita
  rationale: Tafsiri hii inafuata muundo wa Kiebrania kwa karibu na kuwaeleza viongozi waliohusishwa na magari ya vita, bila kuamua zaidi kama waliongoza magari yenyewe au kikosi kizima.
