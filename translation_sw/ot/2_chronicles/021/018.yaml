  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: sw
  text: Baada ya hayo yote, Yahwe akampiga kwa ugonjwa wa matumbo usioweza kuponywa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחֲרֵי כָּל זֹאת
  choice: Baada ya hayo yote
  rationale: Kirai hiki kinaonyesha mfuatano wa wakati na kurejelea kwa pamoja matukio yaliyotangulia. Katika Kiswahili, mwanzo huu ni wa asili bila kulazimisha kutafsiri וְ kwa neno tofauti.
- source_word: נְגָפ/וֹ
  choice: akampiga
  rationale: Kitenzi kinaonyesha pigo au dhiki iliyomfikia moja kwa moja kutoka kwa Mungu; ‘akampiga’ huhifadhi nguvu hiyo bila kubainisha namna ambayo Kiebrania hakibainishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja katika chanzo; umbo ‘Yahwe’ ni uhawilishaji unaotumika kwa kawaida katika Kiswahili.
- source_word: בְּ/מֵעָי/ו
  choice: katika matumbo yake
  rationale: מֵעֶה hapa hurejelea viungo vya ndani, hasa matumbo. Usemi huu ni wazi na wa kawaida katika Kiswahili cha kisasa.
- source_word: לָ/חֳלִי
  choice: kwa ugonjwa
  rationale: 'Kirai kinaeleza hali au matokeo ya pigo hilo: kupatwa na ugonjwa.'
- source_word: לְ/אֵין מַרְפֵּא
  choice: usioweza kuponywa
  rationale: Huwasilisha kwa Kiswahili cha asili maana ya kutokuwapo kwa uponyaji au tiba, bila kupunguza ukali wa hali hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina la agano יְהוָה, si cheo אֲדֹנָי; kwa hiyo jina lenyewe limehifadhiwa badala ya kubadilishwa kuwa cheo.
- issue: Wakala wa ugonjwa
  choice: Yahwe akampiga
  alternative: alipatwa na ugonjwa kwa ruhusa ya Yahwe
  rationale: Muundo wa Kiebrania humtaja Yahwe moja kwa moja kuwa mtendaji wa kitenzi; tafsiri hailegezi wala kufafanua zaidi uhusiano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imeweka sentensi kwa mtiririko wa kawaida huku ikihifadhi uwakala wa Mungu, sehemu ya mwili, na kutoponyeka kwa ugonjwa.
