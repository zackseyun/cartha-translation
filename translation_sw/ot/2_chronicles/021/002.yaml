base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: sw
  text: 'Alikuwa na ndugu zake, wana wa Yehoshafati: Azaria, Yehieli, Zekaria, Azariahu, Mikaeli, na Shefatia[b]. Hawa wote walikuwa wana wa Yehoshafati, mfalme wa Israeli[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema, “mfalme wa Israeli.” Yehoshafati hutambulika kihistoria zaidi kama mfalme wa Yuda; hapa Mambo ya Nyakati hutumia “Israeli,” huenda kwa maana pana ya watu wa agano.
    reason: alternative_reading
  - marker: b
    text: Jina la nne, “Azariahu,” lina tahajia tofauti katika Kiebrania na jina la kwanza, “Azaria”; tofauti hiyo imehifadhiwa hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֽ/וֹ אַחִים
  choice: Alikuwa na ndugu
  rationale: Muundo wa Kiebrania, kihalisi ‘na kwake kulikuwa na ndugu,’ ni nahau ya kuonyesha umilikaji. Kiswahili cha kawaida na sahihi ni ‘alikuwa na ndugu.’ Neno ‘ndugu’ hapa linaelekezwa na muktadha kwa ndugu zake wa kiume.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: wana wa Yehoshafati
  rationale: ‘Wana’ linadumisha mtindo wa nasaba na linaonyesha wazi kuwa hawa ni watoto wa kiume wa Yehoshafati.
- source_word: עֲזַרְיָה ... וַ/עֲזַרְיָהוּ
  choice: Azaria ... Azariahu
  rationale: Majina hayo mawili yana tahajia tofauti katika Kiebrania; umbo ‘Azariahu’ kwa jina la nne linahifadhi tofauti hiyo badala ya kuyafanya yafanane.
- source_word: כָּל אֵלֶּה
  choice: Hao wote
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaorejelea na kujumlisha watu waliotajwa katika orodha.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Tafsiri inafuata moja kwa moja maandishi ya Kiebrania, ambayo yanasema ‘mfalme wa Israeli,’ bila kuyapatanisha kimya kimya na cheo cha kihistoria ‘mfalme wa Yuda.’
theological_decisions:
- issue: Cheo cha Yehoshafati kama מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  alternative: mfalme wa Yuda
  rationale: Maandishi ya Kiebrania yanataja Israeli waziwazi. Ingawa Yehoshafati anajulikana kihistoria kama mfalme wa Yuda, kubadili kuwa ‘Yuda’ kungekuwa kupatanisha tafsiri na taarifa nyingine. ‘Israeli’ linahifadhi uwezekano wa matumizi mapana ya jina hilo kwa watu wa agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. Majina yameandikwa kwa maumbo yanayotambulika katika Kiswahili, huku tofauti muhimu ya Azaria/Azariahu ikihifadhiwa.
