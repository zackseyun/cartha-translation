  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בֶּן שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וּ/שְׁמוֹנֶ֣ה שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יֵּ֨לֶךְ֙ בְּ/לֹ֣א חֶמְדָּ֔ה וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֖א בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: sw
  text: Alikuwa na umri wa miaka thelathini na miwili alipoanza kutawala, naye akatawala huko Yerusalemu kwa miaka minane. Kisha akaondoka bila kuombolezwa[a]. Wakamzika katika Mji wa Daudi, lakini si katika makaburi ya wafalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kutamaniwa,” kwa kufuata kwa karibu zaidi maneno ya Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: alikuwa na umri wa miaka thelathini na miwili
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; Kiswahili cha kawaida hutumia muundo wa ‘kuwa na umri wa miaka...’.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu katika taarifa ya umri wa mfalme unaonyesha wakati alipoingia madarakani.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: akatawala ... kwa miaka minane
  rationale: מָלַךְ humaanisha kutawala au kuwa mfalme; muundo huu ni wa kawaida na wa wazi katika Kiswahili.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kiambishi mahali בִּ־ kimetafsiriwa kwa namna ya kawaida ya Kiswahili; ‘huko’ huonyesha mahali bila kubadili maana.
- source_word: וַיֵּלֶךְ
  choice: akaondoka
  rationale: Kitenzi hicho kihalisi ni ‘akaenda/akaondoka’ na katika taarifa hii kinatumika kama usemi wa staha kuhusu kifo. ‘Akaondoka’ huhifadhi usemi huo bila kuufafanua moja kwa moja kuwa ‘akafa’.
- source_word: בְּלֹא חֶמְדָּה
  choice: bila kuombolezwa
  rationale: חֶמְדָּה huhusu kutamani, kupendezwa au kuthamini. Katika muktadha wa kifo, kauli inaonyesha kuwa hakuacha huzuni au hisia ya kumpoteza; ‘bila kuombolezwa’ huwasilisha nguvu ya kimuktadha kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi maana ya karibu zaidi na maneno ya Kiebrania.
- source_word: וַיִּקְבְּרֻהוּ
  choice: Wakamzika
  rationale: Kitenzi cha wingi chenye kiambishi cha yambwa kimetafsiriwa kwa kiima kisichotajwa, kama kilivyo katika chanzo.
- source_word: בְּעִיר דָּוִיד
  choice: katika Mji wa Daudi
  rationale: Hili ni jina la mahali linalojulikana, kwa hiyo ‘Mji’ limeandikwa kwa herufi kubwa.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: lakini si katika makaburi ya wafalme
  rationale: קִבְרוֹת ni makaburi au mahali pa kuzikia; ‘makaburi’ ni neno la kawaida na linalofaa katika muktadha wa maziko ya kifalme.
theological_decisions:
- issue: Je, וַיֵּלֶךְ itafsiriwe wazi kuwa kifo?
  choice: akaondoka
  alternative: akafa
  rationale: Chanzo kinatumia kitenzi ‘akaenda/akaondoka’ kama usemi wa staha. Tafsiri haipaswi kuondoa taswira hiyo kwa kuifanya iwe kauli ya moja kwa moja kuliko Kiebrania.
- issue: Maana ya בְּלֹא חֶמְדָּה katika taarifa ya kifo
  choice: bila kuombolezwa
  alternative: bila kutamaniwa
  rationale: Chaguo kuu linaeleza kwa lugha ya kawaida kwamba kifo chake hakikusababisha huzuni au hisia ya kumpoteza. Chaguo la karibu zaidi na muundo wa Kiebrania limehifadhiwa katika tanbihi ili kutoficha upana wa maana wa חֶמְדָּה.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Usemi wa staha wa chanzo kuhusu kifo umehifadhiwa, na tanbihi inaonyesha maana ya karibu zaidi ya kifungu chenye utata.
