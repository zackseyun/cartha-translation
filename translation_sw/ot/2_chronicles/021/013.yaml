language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: sw
  text: bali umefuata njia ya wafalme wa Israeli, na umewafanya Yuda na wakaaji wa Yerusalemu wafanye ukahaba[a], kama nyumba ya Ahabu[b] ilivyowafanya wafanye ukahaba; tena umewaua ndugu zako wa nyumba ya baba yako, waliokuwa bora kuliko wewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “umewafanya Yuda na wakaaji wa Yerusalemu wafanye ukahaba.” Hii ni sitiari ya kinabii ya kutokuwa waaminifu kwa agano, mara nyingi kwa kuabudu miungu mingine.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Ahabu” hapa ni familia au nasaba ya kifalme ya Ahabu.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: umefuata njia
  rationale: Nahau ya Kiebrania ina maana ya kuenenda kwa kufuata mwenendo fulani. ‘Umefuata njia’ ni Kiswahili cha kawaida kinachohifadhi taswira ya njia bila kuwa kigumu.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: wafalme wa Israeli
  rationale: Muundo huu wa moja kwa moja unahifadhi tofauti muhimu ya kihistoria kati ya Israeli na Yuda.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: umewafanya Yuda na wakaaji wa Yerusalemu wafanye ukahaba
  rationale: Kitenzi זנה katika kauli ya kusababisha kinadokeza kuwafanya wengine wafanye ukahaba. Hapa ukahaba ni pia sitiari ya kinabii ya kutokuwa waaminifu kwa agano, hasa kwa kuabudu miungu mingine; tafsiri inahifadhi sitiari hiyo badala ya kuibana kuwa ‘ibada ya sanamu’ pekee.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: kama nyumba ya Ahabu ilivyowafanya wafanye ukahaba
  rationale: Tafsiri inarudia maana ya kusababisha iliyomo katika umbo la Kiebrania na kudumisha ulinganifu na kishazi kilichotangulia.
- source_word: בֵּית אַחְאָב
  choice: nyumba ya Ahabu
  rationale: ‘Nyumba’ huhifadhi usemi wa kibiblia unaomaanisha familia au nasaba ya kifalme; tanbihi inaeleza matumizi hayo.
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: ndugu zako wa nyumba ya baba yako
  rationale: Muundo huu unatambulisha ndugu hao kuwa watu wa jamaa ya kifalme ya baba yake na kuhifadhi uzito wa uhusiano wa kifamilia.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: waliokuwa bora kuliko wewe
  rationale: טובים pamoja na מן huonyesha ulinganisho. ‘Bora kuliko wewe’ ni wazi na haiongezi sifa mahususi ambayo Kiebrania hakuitaji.
- source_word: הָרָגְתָּ
  choice: umewaua
  rationale: Kitenzi kinamaanisha kuua. ‘Umewaua’ ni sawia na ya moja kwa moja, bila kuongeza hukumu ya kisheria iliyomo katika ‘umewaua kwa mauaji ya kukusudia.’
theological_decisions:
- issue: Nguvu ya kisitiari ya זנה katika muktadha wa uasi wa kifalme
  choice: Kutumia lugha ya ukahaba na kueleza katika tanbihi kwamba ni sitiari ya kutokuwa mwaminifu kwa agano.
  alternative: Kutafsiri moja kwa moja kuwa ‘ibada ya sanamu’ au ‘uasherati.’
  rationale: ‘Ibada ya sanamu’ ingefafanua sitiari kwa namna nyembamba kuliko neno la chanzo, ilhali ‘uasherati’ peke yake ingeweza kueleweka kama dhambi ya kingono tu. ‘Ukahaba’ huhifadhi taswira kali ya kinabii na tanbihi huzuia kutoeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakaaji’ ni neno la kawaida na linaloeleweka kwa watu wanaoishi mahali. Sentensi inadumisha sauti kali ya shtaka la kinabii huku tanbihi zikifafanua sitiari na maana ya ‘nyumba’ bila kuingiza msimamo wa dhehebu.
