  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: sw
  text: Yehoshafati akalala pamoja na mababu zake[a], akazikwa pamoja na mababu zake katika Mji wa Daudi. Kisha Yehoramu mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, akafa; kwa neno halisi, “akalala pamoja na mababu zake.” Hii ni nahau ya Kiebrania inayosema kwamba mtu alijiunga na waliomtangulia katika ukoo wake katika kifo na maziko.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: akalala pamoja na mababu zake
  rationale: Inahifadhi nahau ya Kiebrania ya taarifa za kifalme kuhusu kufa, huku Kiswahili kikiwa cha heshima na kinachoeleweka; tanbihi inaeleza maana yake.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi cha Kiebrania katika hali ya kutendwa.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: ‘Mababu’ humaanisha waliomtangulia katika ukoo na ni ya asili zaidi katika Kiswahili kuliko ‘baba zake’ katika muktadha huu.
- source_word: בְּעִיר דָּוִיד
  choice: katika Mji wa Daudi
  rationale: Inahifadhi jina la mahali linalotambulika katika Biblia huku herufi kubwa zikionyesha kwamba ni jina maalumu.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya urithi wa kifalme, neno hili linaeleza kwamba alianza kutawala akiwa mfalme; ‘akatawala’ ni la kawaida na fasaha kwa Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Inaonyesha wazi urithi wa utawala na kufuata kwa karibu maana ya Kiebrania.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Tahajia hii ya Kiswahili huhifadhi umbo la jina la Kiebrania na kuwezesha matamshi ya kawaida.
- source_word: יְהוֹרָם
  choice: Yehoramu
  rationale: Inawakilisha moja kwa moja umbo kamili la jina la Kiebrania יְהוֹרָם kwa tahajia inayofaa Kiswahili.
theological_decisions:
- issue: Maana ya nahau ‘kulala pamoja na mababu zake’
  choice: Nahau imehifadhiwa katika maandishi na kufafanuliwa kuwa inamaanisha kufa.
  alternative: Kutafsiri moja kwa moja ‘akafa.’
  rationale: Hii huhifadhi taswira na sauti ya kumbukumbu ya kifalme ya Kiebrania bila kumfanya msomaji akose maana iliyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la kifalme. Muundo wa mfululizo ‘akalala ... akazikwa ... akatawala’ unaakisi mwendo wa simulizi la Kiebrania bila kuwa mgumu.
