  yaml_path: translation/ot/2_chronicles/021/005.yaml
  text: Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: sw
  text: Yehoramu alikuwa na umri wa miaka thelathini na miwili alipoanza kutawala, naye akatawala miaka minane huko Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: alikuwa na umri wa miaka thelathini na miwili
  rationale: Hii ni nahau ya Kiebrania ya kutaja umri. Kiswahili sanifu na cha kawaida hueleza maana hiyo kwa muundo ‘alikuwa na umri wa miaka...’, si tafsiri halisi ‘mwana wa miaka...’.
- source_word: יְהוֹרָם
  choice: Yehoramu
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili, huku likihifadhi umbo kamili la jina la Kiebrania katika mstari huu.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: ב pamoja na kitenzi-jina na kiambishi cha nafsi huonyesha wakati wa kuingia kwake katika ufalme; ‘alipoanza kutawala’ ni Kiswahili cha asili na sahihi katika kanuni ya taarifa za kifalme.
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: miaka minane
  rationale: Ni kirai cha moja kwa moja kinachoonyesha muda wa utawala.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi kina maana ya kutawala au kuwa mfalme. ‘Akatawala’ kinafaa kwa muda uliotajwa na kuunganisha sentensi kwa kawaida katika Kiswahili.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi kinaonyesha mahali pa utawala. ‘Huko’ kinaonyesha mahali kwa Kiswahili cha kawaida bila kuongeza maana nyingine.
