source:
  edition: WLC
  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: sw
  text: Yahwe akachochea dhidi ya Yehoramu roho ya Wafilisti na ya Waarabu waliokuwa karibu na Wakushi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaiamsha” au “akaiinua.” Kitenzi cha Kiebrania kinaonyesha Yahwe akisababisha watu hawa wainuke kwa uhasama dhidi ya Yehoramu.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliokuwa kando ya Wakushi.” Maneno haya yanaelekea kueleza mahali Waarabu hao walipokuwa, yaani ujirani wao na Wakushi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: akachochea
  rationale: Kitenzi kinaonyesha Yahwe akiwainua au kuwasukuma watu hao waingie katika uhasama dhidi ya Yehoramu; “akachochea” ni Kiswahili cha sasa kinachohifadhi usababishaji huo wa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: עַל יְהוֹרָם
  choice: dhidi ya Yehoramu
  rationale: Katika muktadha wa uhasama, עַל ina maana ya kuelekezwa dhidi ya mtu.
- source_word: רוּחַ
  choice: roho
  rationale: “Roho” huhifadhi taswira na upana wa neno la Kiebrania, ambalo hapa linaweza kuashiria msukumo au mwelekeo wa uhasama bila kuufafanua kupita kiasi.
- source_word: הַפְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la kale katika Kiswahili cha Biblia.
- source_word: וְהָעַרְבִים
  choice: Waarabu
  rationale: Jina la kawaida la watu hawa katika Kiswahili; muktadha wa kihistoria huzuia lisichukuliwe moja kwa moja kuwa rejeo la kisiasa la kisasa.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: waliokuwa karibu na Wakushi
  rationale: Nahau עַל יַד hapa inaeleweka kiasili kwa maana ya mahali, yaani kuwa karibu na au kando ya Wakushi, kuliko kuwa chini ya mamlaka yao.
theological_decisions:
- issue: Yahwe kusababisha mataifa yenye uhasama yainuke dhidi ya Yehoramu
  choice: Yahwe akachochea roho yao dhidi ya Yehoramu
  alternative: Yahwe aliruhusu tu uhasama uliokuwapo ujitokeze
  rationale: Kitenzi cha Kiebrania kinamhusisha Yahwe moja kwa moja kama mtendaji. Tafsiri haipunguzi dai hilo kuwa ruhusa tu, wala haiongezi maelezo ya kitheolojia ambayo mstari hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “roho ya Wafilisti na ya Waarabu” umehifadhi taswira ya Kiebrania na pia umeonyesha wazi kuwa “roho” inahusishwa na makundi yote mawili.
