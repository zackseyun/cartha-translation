base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: sw
  text: 'Ndipo barua kutoka kwa Eliya nabii ikamjia, ikisema, “Yahweh, Mungu wa Daudi baba yako, asema hivi: Kwa sababu hukufuata njia za Yehoshafati baba yako, wala[a] njia za Asa mfalme wa Yuda,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “na.” Baada ya kukanusha, Kiswahili kwa kawaida hutumia “wala” kuonyesha kwamba hakufuata njia za Yehoshafati wala za Asa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: Ndipo barua ikamjia
  rationale: Muundo huu unaonyesha kuwa ‘barua’ ndiyo kiima cha kitenzi ‘ikaja,’ huku ‘ikamjia’ ikiwa Kiswahili cha kawaida na chenye kufuata mtiririko wa simulizi unaoletwa na waw.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: kutoka kwa nabii Eliya
  rationale: Jina la mtu limetolewa kwa umbo lake la kawaida katika Kiswahili, na cheo הַנָּבִיא kimetafsiriwa moja kwa moja kuwa ‘nabii.’
- source_word: לֵאמֹר
  choice: ikisema
  rationale: Hii inadumisha kazi ya fomula ya Kiebrania ya kutanguliza maneno yaliyonukuliwa na inafaa kwa barua yenye ujumbe.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni fomula ya kawaida ya kinabii. Wakati wa sasa ‘asema’ unawasilisha tangazo rasmi la Mungu kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo, kwa kufuata ushahidi wa maandishi ya Kiebrania.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: Mungu wa Daudi babu yako
  rationale: Katika muktadha wa nasaba ya kifalme, אָבִיךָ humaanisha mtangulizi wa ukoo, si baba wa moja kwa moja; ‘babu yako’ linaeleza uhusiano huo kwa lugha ya kawaida.
- source_word: תַּחַת אֲשֶׁר
  choice: Kwa sababu
  rationale: Kirai hiki kinaanzisha sababu ya hukumu inayofuata; ‘Kwa sababu’ kinatoa maana hiyo kwa uwazi bila uzito usio wa lazima.
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: hukufuata njia za
  rationale: ‘Kufuata njia za’ linahifadhi sitiari ya mwenendo wa maisha huku likiwa la kawaida zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ‘kutembea katika njia za.’
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: Yehoshafati baba yako
  rationale: Yehoshafati alikuwa baba wa moja kwa moja wa Yehoramu, kwa hiyo ‘baba yako’ linafaa hapa; jina limetolewa kwa umbo linalotambulika katika Kiswahili.
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: wala njia za Asa mfalme wa Yuda
  rationale: Baada ya kukanusha, ‘wala’ ni kiunganishi cha asili cha Kiswahili kinachoonyesha kwamba hakufuata njia za yeyote kati ya hao wawili. ‘Mfalme wa Yuda’ linatafsiri cheo moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi. ‘Yahweh’ linadumisha jina hilo badala ya kulibadilisha na cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Maana ya אָבִיךָ kuhusu Daudi
  choice: babu yako
  alternative: baba yako; babu yako wa zamani
  rationale: Hapa Daudi ni mtangulizi wa kifalme wa Yehoramu, si baba yake wa moja kwa moja. ‘Babu yako’ linafikisha matumizi mapana ya neno la Kiebrania kwa ukoo bila kudai uhusiano wa kizazi kimoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa kwa tamko la kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Sitiari ya ‘njia’ imehifadhiwa, huku kitenzi ‘kufuata’ kikifanya usemi uwe wa asili.
