  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: sw
  text: Basi Edomu ikaasi utawala wa Yuda mpaka leo[a]. Wakati huo Libna pia ikaasi utawala wake, kwa sababu alikuwa amemwacha Yahwe[b], Mungu wa mababu zake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “ikaasi kutoka chini ya mkono wa Yuda” na “kutoka chini ya mkono wake”; hii ni nahau ya kujiondoa chini ya mamlaka au utawala.
    reason: cultural_note
  - marker: b
    text: “Yahwe” ni jina binafsi la Mungu linalowakilishwa na herufi YHWH katika Kiebrania.
    reason: textual_or_name_note
  - marker: c
    text: Kishazi hiki cha sababu kinaweza kueleza hasa uasi wa Libna, au kwa upana zaidi uasi wa Edomu na Libna uliotajwa katika aya hii.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: ikaasi
  rationale: Katika muktadha wa kisiasa, kitenzi hiki humaanisha kuasi mamlaka au kujitenga na utawala. “Ikaasi” ni Kiswahili cha kawaida na huhifadhi uzito wa tendo hilo.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: utawala wa / utawala wake
  rationale: Nahau ya Kiebrania, kihalisi “kutoka chini ya mkono,” humaanisha kujiondoa katika mamlaka au udhibiti. “Utawala” huwasilisha maana hiyo kwa Kiswahili cha asili bila picha isiyoeleweka ya mkono.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina la ufalme na kabila hili katika Kiswahili.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Huhifadhi msemo wa muda unaoonyesha kwamba hali hiyo iliendelea hadi wakati wa mwandishi.
- source_word: אָז
  choice: Wakati huo
  rationale: Huonyesha wazi wakati unaohusishwa na uasi wa Edomu na husomeka kwa kawaida katika Kiswahili.
- source_word: לִבְנָה
  choice: Libna
  rationale: Unukuzi wa kawaida wa jina la mahali kwa Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huonyesha uhusiano wa kisababishi kwa uwazi, bila kuamua kimyakimya iwapo sababu hiyo inahusu uasi wa Libna pekee au matatizo yote yaliyotajwa.
- source_word: עָזַב
  choice: alikuwa amemwacha
  rationale: Huonyesha tendo lililotangulia na uzito wa kuvunja uaminifu kwa Mungu, kwa lugha ya kawaida ya Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa konsonanti YHWH katika Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Mungu wa mababu zake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya rejeo kwa Mungu aliyeabudiwa na waliomtangulia Yehoramu.
theological_decisions:
- issue: Kiwango cha sababu inayotolewa na kishazi cha mwisho
  choice: Kishazi “kwa sababu alikuwa amemwacha Yahwe” kimeachwa katika nafasi yake bila kuongeza ufafanuzi unaokifungamanisha kwa uasi mmoja tu.
  alternative: Kinaweza kueleweka kuwa kinaeleza uasi wa Libna hasa, au kwa upana zaidi misukosuko ya kisiasa iliyompata Yehoramu.
  rationale: Muundo wa Kiebrania unaacha upeo wa sababu ukiwa na kiasi fulani cha utata. Tafsiri inahifadhi mvutano huo badala ya kuutatua kimadhehebu au kifafanuzi.
- issue: Utambulisho wa mtendaji wa kuacha
  choice: “alikuwa amemwacha” humrejelea Yehoramu kwa kiwakilishi cha nafsi ya tatu.
  alternative: Jina “Yehoramu” lingeweza kuongezwa kwa ufafanuzi.
  rationale: Kiebrania chenyewe hakirudii jina; kudumisha kiwakilishi kunafuata maandishi huku muktadha ukibainisha mhusika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ya Kiebrania ya “chini ya mkono” imetafsiriwa kwa maana yake (“utawala”) ili mstari ueleweke kwa msomaji wa kawaida. Jina Yahwe limehifadhiwa, na utata wa upeo wa kishazi cha sababu umeelezwa katika tanbihi.
