  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: sw
  text: Ee Yahwe Mungu, usimkatae mtiwa-mafuta wako[a]; ukumbuke upendo wako wa kudumu kwa Daudi, mtumishi wako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “usigeuze uso wa mtiwa-mafuta wako.” “Mtiwa-mafuta wako” pia inaweza kutafsiriwa “Masihi wako” au, kulingana na muktadha, “mfalme wako.”
    reason: lexical_alternative
  - marker: b
    text: Au “ukumbuke rehema kwa Daudi, mtumishi wako,” au “ukumbuke uaminifu wako wa agano kwa Daudi, mtumishi wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Ee Yahwe Mungu
  rationale: YHWH imetafsiriwa kwa jina la agano ‘Yahwe,’ na אֱלֹהִים kwa cheo cha kawaida ‘Mungu’; ‘Ee’ huonyesha usemi wa moja kwa moja katika sala.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: usimkatae
  rationale: Nahau ya Kiebrania kwa maana halisi ni ‘usigeuze uso wa’; katika Kiswahili cha kawaida, ‘usimkatae’ huwasilisha maana yake wazi, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: מְשִׁיחֶךָ
  choice: mtiwa-mafuta wako
  rationale: Huhifadhi maana ya msingi ya neno katika muktadha wa kifalme bila kulifanya moja kwa moja kuwa cheo ‘Masihi’ wala kulibana kuwa ‘mfalme.’
- source_word: זָכְרָה
  choice: ukumbuke
  rationale: Ni ombi la moja kwa moja katika sala; umbo hili ni la kawaida na lenye heshima katika Kiswahili.
- source_word: לְחַסְדֵי דָּוִיד
  choice: upendo wako wa kudumu kwa Daudi
  rationale: חֶסֶד ina wazo la upendo mwaminifu na wa kudumu katika uhusiano wa agano. Kiwakilishi ‘wako’ kinaweka wazi kwamba, katika muktadha huu, Mungu ndiye chanzo cha upendo huo kwa Daudi, ingawa sintaksia ya Kiebrania imebanwa.
- source_word: דָּוִיד עַבְדֶּךָ
  choice: Daudi, mtumishi wako
  rationale: Tafsiri ya moja kwa moja na ya asili ya kirai cha ufafanuzi, ikionyesha hadhi ya Daudi mbele za Mungu.
theological_decisions:
- issue: Maana ya מְשִׁיחֶךָ katika sala ya kifalme yenye mwangwi unaoweza kuwa wa Kimasihi
  choice: mtiwa-mafuta wako
  alternative: Masihi wako; mfalme wako
  rationale: ‘Mtiwa-mafuta’ huhifadhi maana ya Kiebrania na muktadha wa mfalme wa ukoo wa Daudi, huku ikiacha wazi mwangwi mpana wa Kimasihi bila kuuingiza kwa nguvu katika mstari.
- issue: Mhusika na mwelekeo wa חַסְדֵי דָּוִיד
  choice: upendo wako wa kudumu kwa Daudi
  alternative: rehema kwa Daudi; matendo ya uaminifu ya Daudi
  rationale: Kirai cha Kiebrania kinaweza kueleweka kwa namna zaidi ya moja, lakini muktadha wa sala unaelekea kwenye uaminifu wa Mungu wa agano kwa Daudi. Tanbihi inataja mbadala ili kutoficha ubanifu wa asili.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Tafsiri inatumia ulinganifu bora: nahau ya ‘kugeuza uso’ imewasilishwa kwa ‘kukataa’ katika matini ili iwe wazi kwa msomaji wa kawaida, huku taswira ya Kiebrania ikibaki katika tanbihi. ‘Mtiwa-mafuta’ na ‘upendo wa kudumu’ huhifadhi msamiati wa kitheolojia bila kuingiza msimamo wa dhehebu.'
