base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: sw
  text: ili macho yako yawe wazi kuelekea nyumba hii mchana na usiku[a], kuelekea mahali uliposema utaliweka jina lako[b], ili usikie sala ambayo mtumishi wako anasali akielekea mahali hapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwe makini kwa nyumba hii.” Kiebrania husema kihalisi, “macho yako yawe wazi,” nahau inayoonyesha uangalifu wa daima.
    reason: lexical_alternative
  - marker: b
    text: “Kuweka jina lako” ni nahau ya hekalu inayorejelea uhusiano wa Mungu aliouchagua na mahali hapa; haimaanishi kwamba Mungu amefungiwa humo kihalisi.
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: macho yako yawe wazi
  rationale: Inahifadhi taswira halisi ya Kiebrania ya macho ya Mungu kuwa wazi, huku muundo wa ‘yawe’ ukitoa nguvu ya ombi katika muktadha.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: kuelekea nyumba hii
  rationale: ‘Kuelekea’ linaonyesha mwelekeo unaowasilishwa na אֶל na linafaa katika muktadha wa sala inayoelekezwa hekaluni.
- source_word: יוֹמָם וָלַיְלָה
  choice: mchana na usiku
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaodokeza uangalifu wa daima bila kufuta taswira ya vipindi viwili.
- source_word: אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם
  choice: uliposema utaliweka jina lako
  rationale: Inahifadhi nahau muhimu ya hekalu, ‘kuweka jina,’ na ‘utaliweka’ huwasilisha kwa Kiswahili cha kawaida yaliyomo katika tamko la Mungu.
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: ili uisikie sala
  rationale: ‘Ili’ huonyesha kusudi la infinitivi, na ‘uisikie sala’ huhifadhi nahau ya kibiblia ya Mungu kusikia sala.
- source_word: יִתְפַּלֵּל עַבְדְּךָ
  choice: mtumishi wako anasali
  rationale: Wakati wa sasa katika kishazi tegemezi unasomeka kwa kawaida na kutaja tendo la sala; ‘mtumishi’ linafaa kwa lugha ya unyenyekevu mbele za Mungu.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: akielekea mahali hapa
  rationale: Muundo huu unaonyesha wazi kuwa mtumishi anaelekeza sala yake upande wa mahali palipochaguliwa.
theological_decisions:
- issue: Lugha ya kibinadamu kumhusu Mungu katika ‘macho yako yawe wazi’
  choice: Kuhifadhi taswira ya macho yaliyo wazi
  alternative: ‘uwe makini na nyumba hii’ au ‘uiangalie nyumba hii’
  rationale: Kiebrania kinatumia taswira halisi ya mwili kueleza uangalifu wa Mungu. Kuihifadhi kunatunza uzito wa kishairi na mvutano wa kitheolojia wa matini.
- issue: Teolojia ya hekalu katika ‘kuweka jina lako’
  choice: Kuhifadhi nahau ‘utaliweka jina lako’
  alternative: ‘utafanya uwepo wako ukae huko’
  rationale: Nahau hii inaunganisha Mungu na mahali alipochagua bila kusema kwamba Mungu amefungiwa humo; ufafanuzi umewekwa katika tanbihi badala ya kuingizwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira na nahau kuu za Kiebrania zimehifadhiwa, huku tanbihi zikifafanua maana bila kuibana matini.
