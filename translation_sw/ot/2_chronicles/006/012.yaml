  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: sw
  text: Kisha akasimama mbele ya madhabahu ya Yahwe, mbele ya kusanyiko lote la Israeli, akanyoosha mikono yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akanyoosha viganja vyake”; msemo huu unaeleza kunyoosha mikono katika maombi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Kisha akasimama
  rationale: Kitenzi cha masimulizi kinaendeleza tukio; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida bila kuongeza maana mpya.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: mbele ya madhabahu ya Yahwe
  rationale: לִפְנֵי hapa huonyesha mahali aliposimama kuhusiana na madhabahu, na muundo wa umilikaji umehifadhiwa kwa uwazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa na cheo.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: akikabili kusanyiko lote la Israeli
  rationale: נֶגֶד huonyesha kuwa alikuwa mbele ya watu na amewaelekea; “akikabili” huepuka marudio yasiyo laini ya “mbele ya” huku ikihifadhi uhusiano wa kimahali. קהל ni jamii iliyokusanyika, hivyo “kusanyiko” linafaa katika simulizi hili.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: akanyoosha mikono yake
  rationale: פרש pamoja na כפים hueleza kunyoosha mikono kama ishara ya maombi. “Mikono” ni Kiswahili cha kawaida na cha asili zaidi kuliko tafsiri finyu ya “viganja,” ambayo imefafanuliwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה; kulitaja kama “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi inayofaa maandiko. “Akikabili” hudumisha tofauti kati ya לִפְנֵי na נֶגֶד bila kurudia “mbele ya” kwa namna nzito.
