  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: sw
  text: Umetimiza kwa ajili ya mtumishi wako Daudi, baba yangu, yale uliyomwambia[a]. Kwa kinywa chako ulisema, nawe kwa mkono wako umeyatimiza[b], kama ilivyo leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yale uliyomwahidi.” Kiebrania kinasema moja kwa moja, “yale uliyomwambia”; maana ya ahadi inaeleweka kutokana na muktadha wa kutimizwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kwa kinywa chako ... kwa mkono wako.” Hii ni njia ya Kiebrania ya kuweka sambamba neno Mungu alilosema na tendo lake la kulitekeleza.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: Umemtimizia
  rationale: Katika muktadha wa ahadi, kitenzi hiki kina maana ya kutunza kwa uaminifu na kutekeleza yale yaliyonenwa. Kiswahili ‘umemtimizia ... yale’ kinaonyesha kwamba Mungu ametenda alichomwambia Daudi.
- source_word: לְעַבְדְּךָ
  choice: mtumishi wako
  rationale: ‘Mtumishi’ ni neno la kawaida na lenye heshima katika lugha ya sala ya kifalme; hapa wazo la utumwa wa lazima halisisitizwi.
- source_word: דָּוִיד אָבִי
  choice: Daudi, baba yangu
  rationale: Mpangilio huu unafuata mfuatano wa Kiebrania na bado ni wa asili katika Kiswahili.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: yale uliyomwambia
  rationale: Huhifadhi usemi halisi wa Kiebrania, ‘yale uliyosema kwake,’ bila kuingiza moja kwa moja neno ‘uliyomwahidi’; muktadha wa kutimizwa unaonyesha maana ya ahadi.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Ulinena kwa kinywa chako
  rationale: ‘Ulinena’ lina sajili yenye heshima na huhifadhi taswira halisi ya kinywa, sambamba na ‘mkono’ katika kishazi kinachofuata.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: nawe umetimiza kwa mkono wako
  rationale: Kitenzi מלא katika nahau hii humaanisha kutimiza au kukamilisha. ‘Kwa mkono wako’ huhifadhi taswira ya tendo lenye matokeo inayolinganishwa na neno lililonenwa kwa kinywa.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Nahau hii inaelekeza kwenye uthibitisho wa sasa unaoonekana; ‘kama ilivyo leo’ ni Kiswahili cha kawaida na kinachokaribia muundo wa chanzo.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa viungo vya kibinadamu (‘kinywa’ na ‘mkono’)
  choice: Kuhifadhi maneno ‘kinywa’ na ‘mkono’ katika maandishi
  alternative: Kutafsiri maana kwa ‘ulisema’ na ‘umetekeleza’ bila kutaja viungo
  rationale: Mstari unalinganisha kwa makusudi neno la Mungu na tendo lake. Kuhifadhi taswira hizo kunadumisha nguvu ya balagha ya Kiebrania bila kuamua zaidi ya kile maandishi yenyewe yanachosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala ya kifalme. Muundo ni wa kueleweka kwa msomaji wa kawaida, huku usambamba wa ‘kinywa’ na ‘mkono’ pamoja na maana ya ahadi katika ‘aliyomwambia’ vikihifadhiwa.
