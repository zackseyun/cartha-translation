source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: sw
  text: na ikiwa watajitambua[a] katika nchi walikochukuliwa mateka, wakageuka na kukusihi katika nchi ya utekwa wao, wakisema, “Tumetenda dhambi, tumetenda upotovu, na tumetenda uovu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kiebrania, “watarudisha [jambo hilo] moyoni mwao,” nahau yenye maana ya kutafakari kwa kina au kulitia jambo moyoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: watajítambua
  rationale: Nahau hii kwa maana halisi ni ‘kurudisha moyoni mwao,’ yaani kutafakari kwa ndani mpaka watambue hali na kosa lao. ‘Watajitambua’ ni Kiswahili cha kawaida kinachowasilisha mgeuko huo wa ndani; tanbihi inahifadhi taswira ya Kiebrania.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: katika nchi walikochukuliwa mateka
  rationale: Kitenzi cha Niphal נשבה kinaonyesha kwamba walikamatwa na kupelekwa kama mateka. Tafsiri hii ni wazi na ya kisasa.
- source_word: וְשָׁבוּ
  choice: wakageuka
  rationale: שׁוּב inaweza kumaanisha kurudi kimwili au kumrudia Mungu kwa toba. ‘Wakageuka’ huhifadhi picha ya mwelekeo kubadilika bila kuifunga maana kwa istilahi ya kimafundisho ‘wakatubu.’
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: na kukusihi
  rationale: Hitpael ya חנן inaeleza kuomba kwa bidii ili kupata fadhili. ‘Kukusihi’ ni ya asili, yenye heshima, na inaonyesha uzito wa ombi.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: katika nchi ya utekwa wao
  rationale: שְׁבִי hutaja hali ya kuwa mateka. ‘Utekwa wao’ inadumisha hali hiyo halisi na uhusiano wake na nchi ya uhamisho.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni fomula ya kawaida inayotanguliza maneno ya ungamo.
- source_word: חָטָאנוּ
  choice: Tumetenda dhambi
  rationale: Ni ungamo la moja kwa moja; ‘kutenda dhambi’ ni tafsiri ya kawaida na sahihi.
- source_word: הֶעֱוִינוּ
  choice: tumetenda upotovu
  rationale: Hiphil ya עוה ina dhana ya kupotosha au kutenda kwa njia iliyopotoka. ‘Upotovu’ huhifadhi uzito na picha ya kupotoka kimaadili.
- source_word: וְרָשָׁעְנוּ
  choice: tumetenda uovu
  rationale: רשע hueleza kutenda kwa uovu au kuwa na hatia. ‘Tumetenda uovu’ inadumisha nguvu ya kitenzi na kukamilisha mlolongo wa ungamo.
theological_decisions:
- issue: Lugha ya toba katika mazingira ya utekwa
  choice: Kutafsiri וְשָׁבוּ kuwa ‘wakageuka.’
  alternative: ‘wakarudi’ au ‘wakatubu’
  rationale: Mstari unajumuisha kujitambua kwa ndani, kugeuka, kusihi, na kuungama. ‘Wakageuka’ huhifadhi uwezekano wa kurudi kimwili na wa kumrudia Mungu kiroho, bila kuamua kimya kimya kwamba neno hilo ni istilahi mahsusi ya toba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Utekwa’ na ‘upotovu’ hudumisha uzito wa ungamo bila kutumia lugha ya kizamani kupita kiasi. Alama ya tanbihi [a] imewekwa mara baada ya nahau iliyotafsiriwa.
