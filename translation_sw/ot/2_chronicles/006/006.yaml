reference: 2 Chronicles 6:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: sw
  text: Lakini nimechagua Yerusalemu ili jina langu liwe huko[a], nami nimemchagua Daudi awe juu ya watu wangu Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilichagua Yerusalemu ... nikamchagua Daudi.” Miundo ya vitenzi vya Kiebrania inaweza kutafsiriwa kwa wakati uliopita; “nimechagua” katika matini kuu inasisitiza kwamba uchaguzi wa Mungu uliowekwa unaendelea kuwa na nguvu katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: nimechagua / nimemchagua
  rationale: Kitenzi בחר humaanisha kuchagua. Wakati timilifu wa Kiswahili unaonyesha tendo la Mungu lililofanyika na ambalo matokeo yake yanaendelea katika muktadha.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ni jina la mahali, limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: לִהְיוֹת
  choice: ili ... liwe / awe
  rationale: Jina-kitenzi la היה linaonyesha kusudi au matokeo. Miundo hii ni ya kawaida katika Kiswahili na inalingana na ngeli za nomino husika.
- source_word: שְׁמִי
  choice: jina langu
  rationale: Tafsiri halisi inahifadhi nahau muhimu ya kiteolojia kuhusu jina la Mungu bila kuibadili kuwa 'uwepo wangu'.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinahifadhiwa wazi; 'huko' hurejelea Yerusalemu kwa kawaida katika Kiswahili.
- source_word: בְּדָוִיד
  choice: Daudi
  rationale: Baada ya בחר, kihusishi ב huonyesha mtu aliyechaguliwa; Kiswahili hutumia yambwa moja kwa moja, 'nimemchagua Daudi'.
- source_word: עַל
  choice: awe juu ya
  rationale: Huhifadhi kwa ukaribu maana ya mamlaka juu ya watu bila kuongeza kwa wazi 'mfalme' au 'atawale,' maneno ambayo hayapo katika Kiebrania.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: watu wangu Israeli
  rationale: Huhifadhi lugha ya agano na jina la taifa likiwa katika uhusiano wa ufafanuzi na 'watu wangu'.
- source_word: וְ
  choice: Lakini / nami
  rationale: Kiunganishi cha kwanza kinaonyesha utofautishaji na kauli hasi iliyotangulia, hivyo 'Lakini' kinafaa; cha pili kinaunganisha uchaguzi wa Daudi kwa mtiririko wa kawaida, hivyo 'nami'.
theological_decisions:
- issue: Teolojia ya hekalu katika usemi 'jina langu liwe huko'
  choice: Kuhifadhi usemi 'jina langu liwe huko.'
  alternative: Kusema 'uwepo wangu uwe huko' au 'pawe mahali ninapoabudiwa.'
  rationale: Kiebrania hutaja 'jina' la Mungu, usemi wenye maana ya agano na hekalu. Kuuhifadhi huepuka kuingiza ufafanuzi mpana wa kiteolojia katika matini.
- issue: Jukumu la Daudi katika 'awe juu ya watu wangu Israeli'
  choice: Kutaja mamlaka kwa ujumla kwa maneno 'awe juu ya.'
  alternative: Kusema 'awe mfalme juu ya' au 'awatawale.'
  rationale: Ingawa muktadha unahusu ufalme, Kiebrania cha aya hii hakitumii neno 'mfalme' wala kitenzi 'kutawala'; tafsiri kuu inahifadhi hali hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nahau ya Kiebrania 'jina langu liwe huko' imehifadhiwa, na alama ya tanbihi [a] imewekwa katika matini kuu.
