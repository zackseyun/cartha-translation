base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: sw
  text: Daudi, baba yangu, alikuwa na nia moyoni mwake ya kujenga nyumba kwa ajili ya jina la Yahwe[a], Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “nyumba kwa ajili ya jina la Yahwe”; huu ni usemi wa kawaida wa hekalu kama mahali panapohusishwa na jina la Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: alikuwa na nia moyoni
  rationale: Kirai hiki cha Kiebrania kinaeleza kusudi au nia iliyokuwa ndani ya mtu. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha taswira ya moyo badala ya kuibadili kuwa ‘akilini’ tu.
- source_word: דָּוִיד אָבִי
  choice: Daudi baba yangu
  rationale: Mpangilio huu unafuata mfuatano wa Kiebrania na bado unaeleweka vizuri katika Kiswahili.
- source_word: לִבְנוֹת
  choice: kujenga
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida ya kitenzi בנה katika muktadha huu.
- source_word: בַּיִת
  choice: nyumba
  rationale: Ingawa nyumba inayokusudiwa ni hekalu, neno la Kiebrania ni ‘nyumba.’ Kulihifadhi kunadumisha usemi wa kibiblia bila kufafanua zaidi ya matini.
- source_word: לְשֵׁם
  choice: kwa ajili ya jina la
  rationale: Huu ni usemi muhimu kuhusu hekalu na uhusiano wake na jina la Mungu. ‘Jina’ limehifadhiwa badala ya kufasiriwa kuwa ‘heshima’ au ‘sifa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa uhamishaji wa sauti badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya muundo wa Kiebrania.
theological_decisions:
- issue: Usemi wa hekalu בַּיִת לְשֵׁם יְהוָה
  choice: nyumba kwa ajili ya jina la Yahwe
  alternative: hekalu la Yahwe; nyumba kwa ajili ya heshima ya Yahwe
  rationale: Tafsiri iliyochaguliwa inadumisha maneno ‘nyumba’ na ‘jina,’ ambayo yana uzito wa kiteolojia katika Mambo ya Nyakati kuhusu uwepo wa Mungu na mahali panapohusishwa na jina lake, bila kuyafanya yamaanishe tu jengo la kidini au heshima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Usemi ‘alikuwa na nia moyoni’ umechaguliwa ili kuepuka muundo mgumu wa tafsiri ya neno kwa neno huku taswira ya moyo ikihifadhiwa.
