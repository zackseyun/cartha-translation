  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: sw
  text: Sasa basi, inuka, Ee Yahwe Mungu, uende mahali pako pa pumziko, wewe pamoja na sanduku la nguvu yako.[a] Makuhani wako, Ee Yahwe Mungu, na wavikwe wokovu, na waaminifu wako[b] wafurahie mema.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanduku la uweza wako” au “sanduku la mamlaka yako.”
    reason: lexical_alternative
  - marker: b
    text: Au “wacha-Mungu wako” au “watakatifu wako.”
    reason: lexical_alternative
  - marker: c
    text: Au “wafurahie wema wako.” Kiebrania kinasema tu “katika mema/wema,” bila kutaja wazi mwenye wema huo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa basi
  rationale: Huendeleza mtiririko wa sala na kuanzisha ombi lake la kilele kwa Kiswahili cha kawaida.
- source_word: קוּמָה
  choice: inuka
  rationale: Ni amri ya moja kwa moja inayohifadhi lugha ya sala ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: יְהוָה אֱלֹהִים
  choice: Ee Yahwe Mungu
  rationale: “Ee” huonyesha usemi wa kumwita anayeombwa, huku “Yahwe” ikihifadhi jina la agano lililo katika maandishi.
- source_word: לְנוּחֶךָ
  choice: uende mahali pako pa pumziko
  rationale: Kihusishi kinaonyesha mwelekeo kuelekea pumziko au makao yaliyotulia; “mahali pako pa pumziko” kinafaa katika muktadha wa hekalu na sanduku.
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: wewe pamoja na sanduku la nguvu zako
  rationale: Huhifadhi muundo na taswira ya sanduku linalohusishwa na nguvu za Mungu; “pamoja na” ni ya asili zaidi hapa kuliko “na” peke yake.
- source_word: כֹּהֲנֶיךָ
  choice: makuhani wako
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha umilikaji.
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: na wavikwe wokovu
  rationale: Huhifadhi sitiari ya kuvikwa na pia hali ya ombi; “wokovu” hubeba maana pana ya kuokoa au kukomboa.
- source_word: חֲסִידֶיךָ
  choice: waaminifu wako
  rationale: Neno hili linaonyesha watu wenye uaminifu na uchaji katika uhusiano wa agano; “waaminifu” ni la sasa na halileti maana maalumu ya baadaye ya “watakatifu.”
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: wafurahie mema
  rationale: Hutoa Kiswahili cha asili kwa maana ya kufurahia yaliyo mema bila kuongeza kiambishi cha umilikaji ambacho hakipo katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Kama בַטּוֹב ifafanuliwe kuwa wema wa Mungu
  choice: wafurahie mema
  alternative: wafurahie wema wako
  rationale: Ingawa muktadha unaweza kuelekeza kwenye wema wa Mungu, Kiebrania hakina kiambishi cha “wako”; tafsiri kuu inadumisha upana huo na mbadala umewekwa katika tanbihi.
- issue: Maana ya חֲסִידֶיךָ
  choice: waaminifu wako
  alternative: wacha-Mungu wako au watakatifu wako
  rationale: Chaguo kuu linaonyesha uaminifu na uchaji bila kuamua kwamba neno hilo ni cheo rasmi cha kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sala ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi na sitiari za pumziko, sanduku la nguvu, na kuvikwa wokovu zimehifadhiwa; utata wa “mema/wema” haujaondolewa.
