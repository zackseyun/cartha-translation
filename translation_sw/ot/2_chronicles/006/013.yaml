  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: sw
  text: Kwa maana Solomoni alikuwa ametengeneza jukwaa la shaba[a] na kuliweka katikati ya ua. Lilikuwa na urefu wa dhiraa tano, upana wa dhiraa tano, na kimo cha dhiraa tatu. Akasimama juu yake, kisha akapiga magoti mbele ya kusanyiko lote la Israeli, akanyoosha mikono yake kuelekea mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania כִּיּוֹר kwa kawaida humaanisha “beseni” au chombo cha kunawia, lakini hapa muktadha unaonyesha muundo wa shaba ulioinuliwa ambao Solomoni angeweza kusimama juu yake; kwa hiyo limetafsiriwa “jukwaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza maelezo yanayofafanua mahali na mkao wa Solomoni; “Kwa maana” inadumisha nguvu yake ya ufafanuzi.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: jukwaa la shaba
  rationale: Ingawa כִּיּוֹר kwa kawaida humaanisha birika au beseni, vipimo vilivyotajwa na tendo la Solomoni kusimama juu yake vinaonyesha hapa ni jengo lililoinuliwa kama jukwaa.
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: katikati ya ua
  rationale: עֲזָרָה ni ua wa hekalu, na בְּתוֹךְ inaonyesha kuwa kitu hicho kiliwekwa katikati yake.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: urefu wa dhiraa tano, upana wa dhiraa tano, na kimo cha dhiraa tatu
  rationale: Inahifadhi kipimo cha kale cha dhiraa huku ikitoa vipimo kwa Kiswahili cha kawaida na wazi.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: Akasimama juu yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kusimama juu ya jukwaa.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: kisha akapiga magoti
  rationale: Katika muktadha huu ברך humaanisha kupiga magoti, si kubariki; “kisha” huonyesha mfuatano baada ya kusimama juu ya jukwaa.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: mbele ya kusanyiko lote la Israeli
  rationale: “Kusanyiko” linafaa kwa קָהָל katika mazingira ya ibada ya hadhara, na “mbele ya” linawakilisha נֶגֶד.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: na kunyoosha mikono yake
  rationale: Ni usemi wa kawaida wa Kiswahili kwa ishara hii ya sala, huku ukidumisha wazo la kufungua au kutandaza mikono.
- source_word: הַשָּׁמָיְמָה
  choice: kuelekea mbinguni
  rationale: Kiishio cha mwelekeo katika Kiebrania kinaonyesha kuwa mikono ilielekezwa upande wa mbingu.
theological_decisions:
- issue: Maana ya כִּיּוֹר katika muktadha huu
  choice: Imetafsiriwa “jukwaa” kulingana na muktadha.
  alternative: beseni la shaba; kinara cha shaba
  rationale: Solomoni anasimama juu yake, na vipimo vyake vinaendana na jukwaa lililoinuliwa. Hata hivyo, maana ya kawaida ya neno la Kiebrania imeonyeshwa katika tanbihi ili kutoficha ugumu wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. “Dhiraa” imehifadhiwa kama kipimo cha kale; sentensi zimeundwa kwa mtiririko wa masimulizi unaoeleweka kwa wasomaji wa kawaida.
