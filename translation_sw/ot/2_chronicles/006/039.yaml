base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: sw
  text: basi usikie kutoka mbinguni, kutoka makao yako, sala yao na maombi yao ya rehema, uwatendee haki[a], na uwasamehe watu wako waliokutenda dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usimamie shauri lao,” au “utendee shauri lao haki.” Kwa maana halisi, Kiebrania kinasema, “ufanye hukumu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: basi usikie
  rationale: Katika muktadha wa sala, kitenzi hiki cha nafsi ya pili kina nguvu ya ombi kwa Mungu. “Basi” linaendeleza sharti la mistari iliyotangulia.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Hii ndiyo kauli ya kawaida ya Kiswahili kwa mahali pa Mungu, ingawa neno la Kiebrania lina umbo la wingi.
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  choice: kutoka mahali unapoishi
  rationale: Inahifadhi maana ya mahali palipowekwa kuwa makao, kwa lugha ya kawaida na yenye heshima.
- source_word: תְּפִלָּתָם
  choice: sala yao
  rationale: Umoja wa Kiebrania umehifadhiwa na unaweza kueleweka kama sala yao kwa ujumla.
- source_word: תְּחִנֹּתֵיהֶם
  choice: maombi yao ya rehema
  rationale: Neno hili linamaanisha maombi ya dhati yanayoomba fadhili au rehema, na hivyo linatofautishwa na “sala.”
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: uwatendee haki
  rationale: Nahau ya Kiebrania, kwa maana halisi “ufanye hukumu/kesi yao,” inaomba Mungu ashughulikie shauri lao kwa haki na kwa niaba yao.
- source_word: וְסָלַחְתָּ
  choice: na uwasamehe
  rationale: Hili ni neno la kawaida na wazi kwa msamaha wa Mungu.
- source_word: לְעַמְּךָ
  choice: watu wako
  rationale: Kiambishi cha yambwa katika “uwasamehe” kinawasilisha kwa kawaida uhusiano unaoonyeshwa na kihusishi cha Kiebrania.
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: ambao wamekutenda dhambi
  rationale: Kauli hii ya kawaida ya kibiblia inaonyesha kuwa dhambi yao ilielekezwa dhidi ya Mungu, huku hali timilifu ikihifadhi umuhimu wake wa sasa.
theological_decisions:
- issue: Lugha ya kimahakama katika מִשְׁפָּטָם
  choice: uwatendee haki
  alternative: usimamie shauri lao; utoe hukumu kwa ajili yao
  rationale: Tafsiri hii inadumisha wazo la Mungu kutenda kwa haki kwa niaba yao bila kuamua kimya kimya kama kitendo hicho ni kuwatetea tu au kutoa hukumu kwa maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa ombi katika sala umehifadhiwa, na tofauti kati ya sala ya jumla na maombi ya rehema imeonyeshwa.
