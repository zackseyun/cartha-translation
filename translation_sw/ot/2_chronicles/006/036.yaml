base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: sw
  text: Watakapokutenda dhambi—kwa maana hakuna mwanadamu asiyetenda dhambi—nawe ukawakasirikia na kuwatia mikononi mwa adui, nao watekaji wao wakawapeleka mateka kwenda nchi ya mbali au ya karibu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Watakapokutenda dhambi
  rationale: כִּי inaanzisha hali inayotarajiwa ndani ya sala, hivyo ‘watakapokuwa’/‘watakapo-’ ni ya asili kuliko ‘ikiwa’; חטא pamoja na ל inaonyesha dhambi inayotendwa dhidi ya Mungu.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: hakuna mwanadamu asiyetenda dhambi
  rationale: אָדָם limetumiwa kwa maana ya jumla ya binadamu. ‘Mwanadamu’ huhifadhi umoja wa Kiebrania na wakati huohuo hujumuisha wanadamu wote kwa Kiswahili cha kawaida.
- source_word: וְאָנַפְתָּ בָם
  choice: nawe ukawakasirikia
  rationale: Kitenzi אנף kinaonyesha hasira dhidi yao. Muundo wa ‘ukawakasirikia’ unaendeleza hali ya sentensi kwa Kiswahili bila kuongeza ukali usio lazima.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: na kuwatia mikononi mwa adui
  rationale: Kirai cha Kiebrania kina maana ya kuwaweka chini ya mamlaka ya adui; nahau hii ya Kiswahili huwasilisha maana hiyo wazi. Umoja usio bainifu wa אוֹיֵב umehifadhiwa kama ‘adui’.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: nao waliowateka wakawachukua mateka
  rationale: Tafsiri hii huhifadhi uhusiano wa kitenzi na nomino ya mzizi mmoja katika Kiebrania kwa urudiaji wa asili wa ‘teka/mateka’ na kueleza kupelekwa utumwani.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: hadi nchi ya mbali au ya karibu
  rationale: Huhifadhi utofautishaji mfupi wa Kiebrania kati ya nchi ya mbali na nchi ya karibu bila kubainisha mahali pa kupimia umbali.
theological_decisions:
- issue: אָדָם ya jumla katika kauli kuhusu dhambi ya wanadamu wote
  choice: hakuna mwanadamu asiyetenda dhambi
  alternative: hakuna mtu asiyetenda dhambi
  rationale: ‘Mwanadamu’ huonyesha wazi kwamba אָדָם hapa ni jina la jumla kwa jamii ya binadamu, si mwanamume pekee, huku ikihifadhi kauli katika umoja na uzito wake wa kimethali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Mistari mirefu kati ya vifungu inaonyesha kauli ya ufafanuzi bila kuondoa mvutano wa mfuatano wa masharti. Koma ya mwisho imehifadhiwa kwa kuwa mstari unaendelea katika aya inayofuata.
