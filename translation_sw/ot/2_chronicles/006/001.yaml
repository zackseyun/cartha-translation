  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: sw
  text: Ndipo Sulemani akasema, “Yahwe amesema kwamba atakaa katika giza nene[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wingu lenye giza.” Neno la Kiebrania linaweza kumaanisha wingu zito, utusitusi, au giza nene, hasa katika masimulizi ya Mungu kujidhihirisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati na mwendelezo wa simulizi; “Ndipo” huunganisha kauli ya Sulemani kwa kawaida na tukio lililotangulia.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: Sulemani akasema
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya utangulizi wa usemi katika simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אָמַר
  choice: amesema
  rationale: Kauli timilifu inaonyesha jambo lililosemwa ambalo lina umuhimu katika hali ya sasa; “amesema” ni ya kawaida katika Kiswahili na inahifadhi mwelekeo huo.
- source_word: לִשְׁכּוֹן
  choice: kwamba atakaa
  rationale: Kitenzi-jina chenye ל kinaeleza yaliyomo katika kauli ya Yahwe. Muundo wa Kiswahili wa usemi usio wa moja kwa moja, “kwamba atakaa,” ni wa asili na unadumisha maana ya kukaa au kufanya makao.
- source_word: בָּעֲרָפֶל
  choice: katika giza nene
  rationale: Neno hili linaweza kumaanisha wingu zito lenye giza, utusitusi, au giza nene. “Giza nene” linahifadhi hali ya kufichika inayohusishwa na udhihirisho wa Mungu bila kuifanya picha iwe ya hali ya hewa tu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko linatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya uwepo wa Mungu katika עֲרָפֶל
  choice: atakaa katika giza nene
  alternative: atakaa katika wingu lenye giza
  rationale: Tafsiri hii inadumisha mvutano wa kibiblia kati ya ukaribu wa Mungu na hali yake ya kufichika, bila kuamua kwamba neno hilo linamaanisha wingu la kawaida pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Muundo “Ndipo … akasema” ni wa kawaida katika simulizi, na “katika giza nene” huhifadhi uzito wa picha ya Kiebrania.
