base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: sw
  text: Sasa, Mungu wangu, tafadhali, macho yako yawe wazi, na masikio yako yawe tayari kusikia sala ya mahali hapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sala inayotolewa mahali hapa” au “sala kutoka mahali hapa.” Kiebrania kinasema kwa tafsiri ya karibu zaidi, “sala ya mahali hapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha wakati na mpito kinachoanzisha ombi la mwisho la Sulemani; “Sasa” ni ya kawaida na huhifadhi mpito huo.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kinaonyesha usemi wa moja kwa moja na uhusiano binafsi.
- source_word: יִהְיוּ נָא
  choice: tafadhali ... na yawe
  rationale: Umbo la ombi pamoja na נָא linaonyesha dua yenye unyenyekevu; “tafadhali ... na yawe” huhifadhi maana ya kusihi.
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: macho yako na yawe wazi
  rationale: Huhifadhi taswira halisi ya Kiebrania kuhusu uangalifu wa Mungu bila kuifafanua kupita kiasi.
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: na masikio yako yasikilize kwa makini
  rationale: קַשֻּׁבוֹת huonyesha kuwa tayari kusikia au kuwa makini; usemi huu ni wa asili katika Kiswahili na huhifadhi taswira ya kusikia sala.
- source_word: לִתְפִלַּת
  choice: sala ya
  rationale: Nomino ya umoja yenye ל inaelekeza uangalifu wa Mungu kwenye sala; muundo huu pia unahifadhi uhusiano wake na “mahali hapa.”
- source_word: הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya “this place,” ikirejelea mahali pa hekalu katika muktadha.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu macho na masikio ya Mungu
  choice: 'Kuhifadhi taswira halisi: “macho yako na yawe wazi, na masikio yako yasikilize kwa makini”'
  alternative: Kufafanua kuwa “utuangalie na usikilize”
  rationale: Kiebrania hutumia taswira ya viungo vya mwili kueleza uangalifu wa Mungu kwa sala. Kuihifadhi hudumisha uzito wa kifasihi na kitheolojia bila kulazimisha maelezo kuhusu hali ya mwili wa Mungu.
- issue: Uhusiano wa sala na mahali
  choice: “sala ya mahali hapa” katika matini, pamoja na tanbihi
  alternative: “sala inayotolewa mahali hapa” au “sala kutoka mahali hapa”
  rationale: Muundo wa Kiebrania ni mfupi na unaweza kueleweka kwa zaidi ya njia moja. Tafsiri kuu inafuata muundo huo, huku tanbihi ikihifadhi uwezekano wa maana za kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. Taswira ya macho na masikio imehifadhiwa; muundo wa “sala ya mahali hapa” umeachwa kwa makusudi ili kutatua utata wake katika tanbihi badala ya matini kuu.
