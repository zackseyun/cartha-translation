  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: sw
  text: Sala yoyote au dua yoyote itakayotolewa na mtu yeyote au na watu wako wote Israeli, kila mmoja akijua taabu yake mwenyewe na maumivu yake mwenyewe, na akinyosha mikono yake kuelekea nyumba hii—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  choice: sala yoyote
  rationale: כָּל katika muundo huu ina maana pana isiyoainishwa; “sala yoyote” ni ya asili na hudumisha upana huo.
- source_word: כָל תְּחִנָּה
  choice: dua yoyote
  rationale: תְּחִנָּה ni ombi la dhati la kuomba fadhili au rehema. “Dua” huitofautisha kwa kiasi na “sala” huku ikibaki lugha inayoeleweka.
- source_word: אֲשֶׁר יִהְיֶה
  choice: itakayotolewa
  rationale: Katika muktadha huu, kitenzi היה kinahusu sala au dua inayotokea au kutolewa; “itakayotolewa” huwasilisha tendo lililodokezwa kwa Kiswahili cha kawaida.
- source_word: לְכָל הָאָדָם
  choice: na mtu yeyote
  rationale: אָדָם hapa ni nomino ya umoja yenye maana jumuishi. Kiswahili “mtu yeyote” huhifadhi umoja na matumizi ya kijumla bila kuingiza jinsia isiyolazimishwa na maana.
- source_word: וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: au na watu wako wote Israeli
  rationale: Kirai kinapanua upeo kutoka kwa mtu mmoja hadi kwa jumuiya yote ya Israeli; “au” huonyesha mgawanyo huo kwa kawaida katika Kiswahili.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: kila mmoja akijua
  rationale: אִישׁ ina matumizi ya mgawanyo hapa; “kila mmoja” huonyesha kwamba kila mwombaji anajua hali yake binafsi.
- source_word: נִגְעוֹ
  choice: taabu yake mwenyewe
  rationale: נֶגַע inaweza kuwa pigo, tauni, au dhiki. “Taabu” ni pana vya kutosha kwa muktadha huu bila kuifanya lazima iwe ugonjwa wa kuambukiza.
- source_word: וּמַכְאֹבוֹ
  choice: na maumivu yake mwenyewe
  rationale: מַכְאוֹב hueleza maumivu au mateso; “maumivu” hudumisha upande wa hisia na kuitofautisha na “taabu.”
- source_word: וּפָרַשׂ כַּפָּיו
  choice: na kunyoosha mikono yake
  rationale: Hii ni nahau ya ishara ya kusali. Kiswahili cha asili husema “kunyoosha mikono,” badala ya kutaja viganja pekee.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: kuelekea nyumba hii
  rationale: אֶל hapa huonyesha mwelekeo wa mwili na sala upande wa hekalu; “kuelekea” huwasilisha hilo wazi.
theological_decisions:
- issue: Maana ya kijumla ya הָאָדָם katika umoja
  choice: mtu yeyote
  alternative: mwanadamu yeyote
  rationale: Katika muktadha huu אָדָם humaanisha mtu mmoja yeyote kwa matumizi ya kijumla. “Mtu yeyote” ni sahihi na ya kawaida katika Kiswahili, bila kupunguza upeo wake kwa wanaume pekee.
- issue: Upeo wa נֶגַע
  choice: taabu
  alternative: pigo
  rationale: Neno linaweza kurejelea pigo au dhiki kwa upana. Muktadha wa mtu kujua hali yake mwenyewe unaruhusu maana pana, hivyo “taabu” huepuka kulazimisha ugonjwa au hukumu maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza sentensi hadi mstari unaofuata, kwa hiyo mstari unamalizika kwa kistari kirefu.
