  to: Sala yoyote au dua yoyote itakayotolewa na mtu yeyote au na watu wako wote Israeli, kila mmoja akijua taabu yake mwenyewe na maumivu yake mwenyewe, na akinyosha mikono yake kuelekea nyumba hii—
