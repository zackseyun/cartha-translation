base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: sw
  text: Lakini Yahwe alimwambia Daudi baba yangu, “Kwa kuwa ulikuwa na nia ya kujenga nyumba kwa ajili ya jina langu[a], ulifanya vyema kuwa na nia hiyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kujenga hekalu kwa ajili ya jina langu.” Kiebrania kinasema kihalisi, “kujenga nyumba kwa ajili ya jina langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo; umbo hili ni la kawaida na linalosomeka katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: alimwambia
  rationale: Kitenzi אמר pamoja na kiambishi אֶל kwa kawaida huwasilishwa kwa Kiswahili kama ‘alimwambia’, ambacho ni cha asili kuliko ‘alisema kwa’.
- source_word: אָבִי
  choice: Daudi baba yangu
  rationale: Hudumisha wazi uhusiano wa kifamilia katika hotuba ya Sulemani.
- source_word: יַעַן אֲשֶׁר
  choice: Kwa kuwa
  rationale: Huanzisha sababu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הָיָה עִם לְבָבְךָ
  choice: ulikuwa na nia
  rationale: Nahau ya Kiebrania inaeleza kusudi la ndani; Kiswahili ‘kuwa na nia’ hutoa maana hiyo kwa uwazi bila taswira isiyo ya kawaida ya ‘kuwa pamoja na moyo wako’.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: kujenga nyumba kwa ajili ya jina langu
  rationale: ‘Nyumba’ huhifadhi maana ya msingi ya בַּיִת na usemi muhimu ‘kwa ajili ya jina langu’, bila kuufafanua kimya kimya kuwa hekalu.
- source_word: הֱטִיבוֹתָ
  choice: ulifanya vyema
  rationale: Huonyesha idhini inayodokezwa na Hiphil ya יטב kwa Kiswahili cha kawaida.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: kuwa na nia hiyo
  rationale: Huhifadhi kurudiwa kwa wazo la nia, huku ‘hiyo’ ikiunganisha kifungu cha mwisho na kusudi la kujenga lililotangulia kwa ufasaha wa Kiswahili.
theological_decisions:
- issue: Tafsiri ya בַּיִת לִשְׁמִי kuhusu hekalu
  choice: nyumba kwa ajili ya jina langu
  alternative: hekalu kwa ajili ya jina langu
  rationale: Kiebrania kinasema ‘nyumba’; kulihifadhi neno hilo pamoja na ‘jina langu’ hudumisha usemi wa kitheolojia bila kudokeza kwamba Mungu anafungiwa ndani ya jengo.
- issue: Taswira ya הָיָה עִם לְבָבְךָ
  choice: ulikuwa na nia
  alternative: ilikuwa moyoni mwako
  rationale: Katika muktadha huu usemi unahusu kusudi au azimio la Daudi. ‘Ulikuwa na nia’ ni wazi na wa asili kwa Kiswahili; njia mbadala huhifadhi sitiari kwa karibu zaidi lakini inaweza kusikika kama jambo lililofichika tu moyoni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi jina la Mungu na usemi ‘nyumba kwa ajili ya jina langu’, huku nahau ya moyo ikitafsiriwa kwa maana yake ya kawaida ya nia.
