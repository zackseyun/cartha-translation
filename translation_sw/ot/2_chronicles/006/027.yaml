  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶל הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַֽל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: sw
  text: basi usikie kutoka mbinguni[a], usamehe dhambi ya watumishi wako na ya watu wako Israeli, unapowafundisha njia njema wanayopaswa kuifuata, na ulete mvua juu ya nchi yako, ambayo umewapa watu wako kuwa urithi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usikie mbinguni.” Kihalisi, Kiebrania husema “usikie mbingu”; hii ni nahau ya Mungu kusikia kutoka makao yake ya mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: usikie ukiwa mbinguni
  rationale: Kiebrania kinasema kwa muundo wa nahau, kihalisi ‘usikie mbingu.’ Tafsiri hii inaonyesha kwamba Mungu anasikia akiwa katika makao yake ya mbinguni, huku tanbihi ikihifadhi uwezekano wa maana ‘kutoka mbinguni.’
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: usamehe dhambi
  rationale: Neno חטאת hapa linamaanisha dhambi au hatia; ‘usamehe dhambi’ ni usemi wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Ingawa עבד linaweza kumaanisha mtumwa, katika sala hii linawaeleza watu walio chini ya Mungu na wanaomtumikia, bila kusisitiza hali ya utumwa.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: na ya watu wako Israeli
  rationale: Kirai hiki kinaunganishwa na ‘ya watumishi wako’ kama wale ambao dhambi yao inaombewa msamaha.
- source_word: כִּי
  choice: unapowafundisha
  rationale: כִּי limewakilishwa kwa muundo wa wakati ‘unapo-’, unaoonyesha mazingira yanayoambatana na kusamehe na kurejesha mvua bila kulazimisha maana ya kisababishi.
- source_word: תוֹרֵם
  choice: unawafundisha
  rationale: Hifili ya ירה humaanisha kufundisha au kuelekeza, hasa kuhusu mwenendo unaofaa.
- source_word: אֶל־הַדֶּרֶךְ הַטּוֹבָה
  choice: njia njema
  rationale: Hii inadumisha picha halisi ya njia na ubora wake wa kimaadili bila kuifafanua kupita kiasi.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: wanayopaswa kuiendea
  rationale: Kutembea au kwenda katika njia ni sitiari ya mwenendo; ‘wanayopaswa’ huonyesha mwenendo unaotarajiwa katika muktadha huu.
- source_word: וְנָתַתָּה מָטָר
  choice: na ulete mvua
  rationale: נתן maana yake ya msingi ni kutoa, lakini ‘kuleta mvua’ ni Kiswahili cha kawaida kinachodumisha ombi kwamba Mungu aisababishe mvua ipatikane, bila kuongeza taswira nyingine.
- source_word: עַל־אַרְצְךָ
  choice: juu ya nchi yako
  rationale: 'Kivumishi kimilikishi cha Kiebrania kimehifadhiwa: nchi ni ya Mungu hata ingawa amewapa watu wake.'
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: uliyowapa watu wako iwe urithi wao
  rationale: נחלה ni urithi au milki iliyotolewa; muundo huu ni wa kawaida katika Kiswahili na unahifadhi wazo la nchi kama zawadi ya urithi.
theological_decisions:
- issue: Uhusiano wa כִּי na tendo la Mungu la kufundisha
  choice: 'Imetafsiriwa kwa maana ya wakati: ‘unapowafundisha.’'
  alternative: ‘kwa sababu unawafundisha’ au ‘kwa kuwa unawafundisha’
  rationale: Muktadha wa sala unaruhusu כִּי kueleza hali au wakati wa jibu la Mungu, lakini pia unaweza kusikika kuwa wa kisababishi. Tafsiri ya wakati inadumisha mtiririko wa kusikia, kusamehe, kufundisha na kutoa mvua bila kufanya dai kali zaidi la kisababishi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi umehifadhiwa kwa vitenzi vya utegemezi: ‘usikie,’ ‘usamehe,’ na ‘ulete.’'
