source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: sw
  text: basi usikie kutoka mbinguni, makao yako, usamehe, na umpe kila mtu kulingana na mwenendo wake wote, ambaye unaujua moyo wake—maana wewe peke yako unaijua mioyo ya wanadamu[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kwa maana halisi, “wana wa mwanadamu”; yaani, wanadamu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: usikie
  rationale: Katika muktadha wa ombi la Sulemani, kitenzi hiki kina nguvu ya ombi; ‘usikie’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Ingawa umbo la Kiebrania ni la wingi, ‘mbinguni’ ndilo neno la kawaida la Kiswahili kwa makao ya Mungu katika muktadha huu.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: makao yako
  rationale: Kifungu hiki humaanisha mahali palipowekwa pa kukaa; ‘makao yako’ ni cha asili na huhifadhi maana bila uzito usiohitajika.
- source_word: וְסָלַחְתָּ
  choice: usamehe
  rationale: Katika mfululizo wa maombi, umbo hili linaendeleza ombi badala ya kutoa taarifa ya wakati ujao.
- source_word: וְנָתַתָּה לָאִישׁ
  choice: na umpe kila mtu
  rationale: נתן ni ‘kutoa/kumpa,’ na אִישׁ hapa ina maana ya mgawanyo kwa kila mmoja; ‘kila mtu’ ni sahihi na ya kawaida katika Kiswahili.
- source_word: כְּכָל דְּרָכָיו
  choice: kulingana na mwenendo wake wote
  rationale: ‘Njia zake’ ni sitiari ya mwenendo, lakini ‘mwenendo wake wote’ huwasilisha maana hiyo wazi na kwa kawaida katika Kiswahili.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: kwa kuwa unaujua moyo wake
  rationale: Kishazi hiki kinaeleza msingi wa kumpa kila mtu sawasawa; ‘moyo’ huhifadhi dhana ya utu wa ndani, mawazo, na nia.
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: maana wewe peke yako unaijua
  rationale: ‘Maana’ huonyesha sababu, na ‘wewe peke yako’ huhifadhi msisitizo wa upekee wa Mungu katika kuijua mioyo.
- source_word: לְבַב בְּנֵי הָאָדָם
  choice: mioyo ya wanadamu
  rationale: Kiebrania ni halisi ‘moyo wa wana wa Adamu/mwanadamu,’ lakini maana yake ya kawaida hapa ni utu wa ndani wa binadamu wote; wingi ‘mioyo’ ni wa asili katika Kiswahili na unaafikiana na kila mtu aliyetajwa.
theological_decisions:
- issue: Usemi wa kibinadamu בְּנֵי הָאָדָם
  choice: wanadamu
  alternative: wana wa Adamu / wana wa mwanadamu
  rationale: Usemi wa Kiebrania unawahusu binadamu kwa ujumla. ‘Wanadamu’ huhifadhi upeo huo kwa Kiswahili cha kawaida, huku tanbihi ikionyesha muundo halisi na mbadala unaowezekana.
- issue: Maarifa ya Mungu kuhusu moyo
  choice: wewe peke yako unaijua mioyo
  alternative: wewe mwenyewe unaijua mioyo
  rationale: לְבַדְּךָ hudai upekee, si tu msisitizo wa kiwakilishi; ‘peke yako’ hulinda mvutano huo wa kiteolojia bila maelezo ya ziada.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi umehifadhiwa kwa vitenzi vya hali ya kutaka: ‘usikie,’ ‘usamehe,’ na ‘umpe.’ Alama ya tanbihi [a] imewekwa moja kwa moja baada ya ‘wanadamu.’'
