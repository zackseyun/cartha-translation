reference: 2 Chronicles 6:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: sw
  text: Tangu siku ile nilipowatoa watu wangu kutoka nchi ya Misri[a], sikuchagua mji wowote miongoni mwa makabila yote ya Israeli ili kujenga nyumba[b] ili jina langu liwe humo, wala sikumchagua mwanamume awe mtawala[c] juu ya watu wangu Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kuanzia siku ile nilipowatoa watu wangu kutoka nchi ya Misri, sijachagua...” Kauli timilifu za Kiebrania zinaweza kutafsiriwa kama wakati uliopita au kwa namna inayosisitiza hali iliyoendelea kutoka wakati huo hadi wakati unaozungumziwa.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa inarejelea hekalu; Kiebrania kinatumia neno “nyumba.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kiongozi” au “mkuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: Tangu siku ile
  rationale: Huonyesha mwanzo wa kipindi kinachohusiana na matendo yaliyokanushwa; ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa wakati.
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: nilipowatoa watu wangu katika nchi ya Misri
  rationale: Kitenzi cha Kiebrania ni cha kisababishi na kinarejelea tendo la Mungu la kuwatoa watu wake Misri.
- source_word: לֹא בָחַרְתִּי בְעִיר
  choice: sikuchagua mji wowote
  rationale: Katika sentensi kanushi, “mji wowote” huwasilisha wazi maana ya kutokuchagua hata mji mmoja.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: katika makabila yote ya Israeli
  rationale: Inahifadhi rejeleo la makabila yote ya Israeli kwa Kiswahili cha kawaida.
- source_word: לִבְנוֹת בַּיִת
  choice: ili kujenga nyumba
  rationale: בַּיִת maana yake ya moja kwa moja ni “nyumba”; neno hilo linahifadhi taswira na uzito wa usemi wa Kiebrania kuliko kutafsiri moja kwa moja kuwa “hekalu.”
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: ambamo jina langu lingekuwa
  rationale: Inahifadhi dhana ya jina la Mungu kuwapo huko bila kuongeza kitenzi cha kufasiri kama “kukaa” au kubadili “jina” kuwa “uwepo.”
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: wala sikumchagua mtu
  rationale: “Wala” huendeleza ukanushaji sambamba; “mtu” katika muktadha huu humrejelea mwanaume mmoja aliyechaguliwa kutawala.
- source_word: נָגִיד
  choice: mtawala
  rationale: Neno hili humaanisha mtu aliyewekwa katika mamlaka; “mtawala” ni wazi na lina nguvu inayofaa kuliko “kiongozi”.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: juu ya watu wangu Israeli
  rationale: Inahifadhi uhusiano wa mamlaka na pia usemi wa agano “watu wangu Israeli.”
theological_decisions:
- issue: Istilahi ya mahali patakatifu na lugha ya jina la Mungu
  choice: “nyumba” na “ambamo jina langu lingekuwa”
  alternative: “hekalu ambamo uwepo wangu ungekaa”
  rationale: Kiebrania chenyewe kinatumia “nyumba” na kusema kwamba jina la Mungu liwe huko. Tafsiri iliyochaguliwa haifafanui mapema mno uhusiano kati ya jina la Mungu, uwepo wake, na mahali patakatifu.
- issue: Wakati wa vitenzi vya kuchagua
  choice: “sikuchagua”
  alternative: “sijachagua”
  rationale: Kauli timilifu za Kiebrania zinaweza kueleweka kama matendo ya wakati uliopita ndani ya masimulizi. Kiswahili “sikuchagua” kinaendana vizuri na mfuatano wa kihistoria, huku tanbihi ikihifadhi uwezekano wa kusisitiza nguvu inayoendelea hadi wakati unaozungumziwa.
- issue: Utambulisho wa אִישׁ
  choice: “mtu” katika muktadha wa mtawala mwanaume
  alternative: “mwanamume”
  rationale: Kiswahili cha kawaida hutumia “mtu” kwa mtu mmoja, na muktadha wa kihistoria wa mtawala unaonyesha kuwa anayelengwa ni mwanaume; tanbihi ya ziada si lazima kwa kuwa maana haijafichwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo umewekwa wa asili bila kuwa mgumu; istilahi “nyumba” na “jina langu” zimehifadhiwa kwa sababu ya uzito wake wa kifasihi na kitheolojia.
