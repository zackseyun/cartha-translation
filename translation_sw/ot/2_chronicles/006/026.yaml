base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: sw
  text: Mbingu zitakapofungwa, wala mvua isinyeshe kwa sababu wamekutenda dhambi, nao watakaposali wakielekea mahali hapa, wakilikiri jina lako na kuacha dhambi yao kwa sababu unawanyenyekeza,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: Mbingu zinapofungwa
  rationale: Muundo wa wakati wenye kitenzi cha Nifali unamaanisha ‘wakati mbingu zinapofungwa/kuzuiliwa.’ Tafsiri hii huhifadhi taswira halisi ya mbingu zilizofungwa na inaeleweka katika muktadha wa mvua kuzuiliwa.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: kukawa hakuna mvua
  rationale: Hutoa kwa Kiswahili cha kawaida matokeo ya mbingu kufungwa, huku ikihifadhi maana rahisi ya kutokuwapo kwa mvua.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: kwa sababu wamekutenda dhambi
  rationale: כִּי ni ya kisababishi hapa, na לָךְ huonyesha kwamba dhambi imetendwa dhidi ya Mungu. ‘Wamekutenda dhambi’ ni Kiswahili cha kibiblia kinachoeleweka na cha heshima.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: nao wakiomba wakielekea mahali hapa
  rationale: אֶל huonyesha mwelekeo wa sala kuelekea hekalu, wala si kwamba mahali penyewe ndilo linaloombwa.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: wakalikiri jina lako
  rationale: Hifili ya ידה inaweza kumaanisha kukiri, kushukuru, au kusifu. Katika mfuatano wa dhambi, sala, na kugeuka, ‘kulikiri jina lako’ inafaa kimuktadha na huhifadhi ‘jina’ waziwazi.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: na kuacha dhambi yao
  rationale: שוב + מן ni kugeuka au kujiondoa katika dhambi. ‘Kuacha dhambi yao’ ni usemi wa asili unaohifadhi tendo la kugeuka bila kutumia istilahi ya kifundisho zaidi.
- source_word: כִּי תַעֲנֵם
  choice: kwa sababu unawajibu
  rationale: Kitenzi ענה kinaweza kumaanisha kujibu, lakini kwa uainishaji mwingine au muktadha mwingine kinaweza kumaanisha kutesa au kunyenyekeza. Usomaji wa ‘kujibu’ unafaa kwa muktadha wa sala, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya ענה katika kishazi cha mwisho
  choice: kwa sababu unawajibu
  alternative: kwa sababu unawatesa; au, kwa sababu unawanyenyekeza
  rationale: Muktadha wa karibu unaunganisha sala na jibu, hivyo ‘unawajibu’ inafaa. Hata hivyo, maana ya Mungu kuwatesa au kuwanyenyekeza ili wageuke inawezekana kileksika na haipaswi kufichwa; imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeachwa ikiishia kwa koma kwa sababu mstari huu ni kishazi tegemezi kinachoendelea katika mstari unaofuata. Taswira ya ‘mbingu kufungwa’ na ‘jina lako’ imehifadhiwa.
