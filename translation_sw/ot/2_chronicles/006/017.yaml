source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: sw
  text: Sasa basi, Ee Yahwe, Mungu wa Israeli, ulithibitishe neno lako ulilomwambia mtumishi wako Daudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ifanya ahadi yako iwe imara,” au “fanya neno lako lionekane kuwa la kweli.”
    reason: Hizi ni tafsiri mbadala za יֵאָמֵן; “neno lako” katika muktadha linaweza kueleweka kuwa ahadi.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha wakati na hatua mpya katika ombi la Sulemani; “Sasa” ni ya kawaida na wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu unaakisi wazi kirai cha uhusiano kinachomtambulisha Yahwe kuwa Mungu wa Israeli.
- source_word: יֵאָמֵן
  choice: na lithibitike
  rationale: Nifali ya אמן hapa ni ombi kwamba neno lililosemwa lionyeshwe kuwa imara na la kweli kwa kutimia; “na lithibitike” huhifadhi maana ya kutendewa au kuthibitika.
- source_word: דְּבָרְךָ
  choice: neno lako
  rationale: Huhifadhi nomino ya Kiebrania kwa uwazi; katika muktadha neno hilo ni ahadi, lakini tafsiri haifungi maana kwenye ufafanuzi huo pekee.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: ulilomwambia
  rationale: Katika Kiswahili, “neno ulilomwambia” ni ya asili kuliko “neno ulilolisema kwa,” huku ikihifadhi tendo la kusema na Daudi kama mpokeaji.
- source_word: לְעַבְדְּךָ
  choice: mtumishi wako
  rationale: “Mtumishi” inafaa kwa עבד katika mazingira ya kifalme na ya agano bila kuingiza dhana yenye uzito zaidi ya utumwa.
- source_word: לְדָוִיד
  choice: Daudi
  rationale: Jina la mtu limetolewa kwa umbo lake la kawaida katika Biblia ya Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina binafsi la Mungu. Kulihifadhi kama “Yahwe” huonyesha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa דְּבָרְךָ itafsiriwe kwa ufafanuzi kuwa “ahadi yako”
  choice: neno lako
  alternative: ahadi yako
  rationale: Muktadha unaonyesha kuwa ni ahadi kwa Daudi, lakini “neno lako” huhifadhi tamko halisi la chanzo na mvutano kati ya neno lililosemwa na kutimia kwake.
- issue: Maana ya יֵאָמֵן katika ombi
  choice: na lithibitike
  alternative: na liwe imara; na lionekane kuwa la kweli
  rationale: Chaguo hili linahifadhi ombi kwamba neno la Mungu liwekwe wazi kuwa thabiti kwa kutimizwa, bila kudokeza kwamba hapo awali halikuwa la kweli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “na lithibitike” umetumiwa kama ombi la heshima na la moja kwa moja.
