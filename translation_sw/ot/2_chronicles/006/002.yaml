lexical_decisions:
- source_word: בֵית זְבֻל
  choice: nyumba ya fahari
  rationale: Neno זְבֻל hapa linaonyesha makao ya juu, adhimu, au yenye hadhi. “Nyumba ya fahari” ni Kiswahili cha kawaida chenye heshima ambacho hakilazimishi maana ya mahali palipoinuka kijiografia.
- source_word: מָכוֹן
  choice: mahali
  rationale: Katika kishazi מָכוֹן לְשִׁבְתְּךָ, neno hili lina maana ya mahali palipowekwa au kuandaliwa kuwa makao; “mahali” hutoa maana hiyo kwa urahisi bila kuongeza dhana isiyo wazi katika chanzo.
- source_word: לְשִׁבְתְּךָ עוֹלָמִים
  choice: pa wewe kukaa milele
  rationale: Tafsiri hii huhifadhi usemi wa moja kwa moja unaomhusu Mungu pamoja na wazo la kudumu lililo katika עוֹלָמִים.
theological_decisions:
- issue: Kauli kwamba Mungu anakaa hekaluni milele
  choice: mahali pa wewe kukaa milele
  alternative: mahali pa makao yako ya milele
  rationale: Usemi wa chanzo umehifadhiwa bila kuufafanua kuwa unamaanisha uwepo wa kiishara pekee au kuweka mipaka juu ya uwepo wa Mungu. Hivyo mvutano wa kitheolojia katika muktadha unabaki wazi.
translation_notes:
