  source_fidelity: Muundo wa ombi na maana ya kimahakama vimehifadhiwa kwa jumla. Hata hivyo, “umtetee mwenye haki” inaweza kumaanisha kumwakilisha au kumlinda katika shauri, badala ya tendo la hakimu la kumtangaza kuwa yuko upande wa haki. Pia, “umlipize mwovu” inaweza kusikika kama kumlipa fidia; usemi wa kumrudishia mwenendo wake huhifadhi vizuri zaidi muundo na taswira ya Kiebrania.
  naturalness: 'Kiswahili cha rasimu kinaeleweka na kina register inayofaa kwa sala. Marekebisho yanapendekezwa ili kufanya uwiano wa vifungu vya hukumu uwe wazi na wa asili zaidi: kumrudishia mwovu mwenendo wake, na kumhesabia mwenye haki kuwa ana haki.'
  terminology: “Mwenye haki” ni tafsiri thabiti ya צַדִּיק. “Kumhesabia ... kuwa ana haki” huwasilisha kwa usahihi maana ya kimahakama ya הַצְדִּיק bila kuingiza maana ya kimadhehebu. “Mwenendo wake” huhifadhi maana pana ya דֶּרֶךְ kuliko “matendo yake” pekee.
