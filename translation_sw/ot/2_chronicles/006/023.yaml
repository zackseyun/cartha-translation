base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: sw
  text: 'basi usikie kutoka mbinguni, utende, na uwahukumu watumishi wako: kwa kumrudishia mwovu mwenendo wake juu ya kichwa chake[a], na kwa kumhesabia mwenye haki kuwa ana haki, ukimpa kulingana na haki yake.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “kwa kumpa njia yake juu ya kichwa chake”; hii ni nahau ya Kiebrania inayomaanisha kumrudishia mtu matokeo ya mwenendo wake katika hukumu.
    reason: cultural_note
  - marker: b
    text: Au, “na kumthibitisha mwenye haki.” Kitenzi cha Kiebrania ni istilahi ya kimahakama inayomaanisha kutangaza au kumtendea mtu kuwa yuko upande wa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: usikie kutoka mbinguni
  rationale: Katika lugha ya sala, kitenzi hiki humaanisha kusikia kwa makini na kuitikia. Kiswahili cha kawaida hutumia umoja “mbinguni,” ingawa umbo la Kiebrania ni wingi.
- source_word: וְעָשִׂיתָ
  choice: utende
  rationale: Kitenzi ni kipana, lakini hapa kinaeleza Mungu kuchukua hatua kufuatia kusikia sala; “utende” hudumisha ufupi na uzito wa chanzo.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: uwahukumu watumishi wako
  rationale: Muktadha ni wa kimahakama, kama inavyoonekana katika matokeo yanayolinganishwa kwa mwovu na mwenye haki.
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: umlipize mwovu
  rationale: Muundo huu unaonyesha malipo ya hukumu, yaani kumrudishia mwovu matokeo ya mwenendo wake.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: kwa kuyarejesha matendo yake juu ya kichwa chake
  rationale: “Njia yake” humaanisha mwenendo wake. “Matendo yake” huwasilisha maana hiyo kwa uwazi, huku “juu ya kichwa chake” ikihifadhi taswira ya Kiebrania.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: umtetee mwenye haki
  rationale: Katika muktadha huu wa mahakama, kitenzi humaanisha kutangaza au kumtendea mtu kuwa yuko upande wa haki. “Umtetee” huepuka kuingiza maana za baadaye za kiteolojia, ingawa linaweza pia kutafsiriwa “umhesabie mwenye haki kuwa ana haki.”
- source_word: לָתֵת לוֹ כְּצִדְקָתוֹ
  choice: kwa kumpa kulingana na haki yake
  rationale: Tafsiri hii inadumisha wazo la kumpa mtu kwa kadiri ya uadilifu au hali yake ya kuwa upande wa haki bila kuongeza wazi neno “thawabu.”
theological_decisions:
- issue: Maana ya kimahakama ya hukumu ya Mungu
  choice: Kutumia lugha ya kuhukumu, kumlipiza mwovu, na kumtetea mwenye haki.
  alternative: Kueleza kwa ujumla kuwa Mungu anatawala au anaingilia kati bila msisitizo wa mahakama.
  rationale: Vitenzi שׁפט na הצדיק pamoja na ulinganisho wa mwovu na mwenye haki vinaonyesha wazi mazingira ya hukumu.
- issue: Maana ya הצדיק
  choice: umtetee mwenye haki
  alternative: umhesabie mwenye haki kuwa ana haki
  rationale: “Umtetee” hutoa maana ya kimahakama ya kuthibitisha kuwa mtu yuko upande wa haki, bila kuingiza kimyakimya mfumo maalumu wa kidhehebu. Tanbihi huhifadhi tafsiri iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Miundo ya ombi “usikie… utende… uwahukumu” inafaa katika sala ya moja kwa moja kwa Mungu. Taswira ya “juu ya kichwa chake” imehifadhiwa na kufafanuliwa katika tanbihi.
