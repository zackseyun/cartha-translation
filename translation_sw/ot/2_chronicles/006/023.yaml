    rationale: “Kumlipa” inaweza kuwa na maana isiyo mahususi ya malipo. Kiebrania husema kumrudishia mwovu ‘njia/mwenendo wake’ juu ya kichwa chake; tafsiri iliyorekebishwa huhifadhi uhusiano huo wa urejesho wa hukumu.
