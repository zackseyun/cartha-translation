id: 2CH.6.18
reference: 2 Chronicles 6:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: sw
  text: Lakini je, kweli Mungu atakaa pamoja na wanadamu duniani? Tazama, mbingu, naam, mbingu za mbingu haziwezi kukutosha; sembuse nyumba hii niliyoijenga!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: kweli
  rationale: Katika swali la balagha, neno hili linaonyesha mshangao wenye uzito; “kweli” ni la kawaida na lenye heshima katika Kiswahili.
- source_word: יֵשֵׁב
  choice: atakaa
  rationale: Kitenzi kinaweza kumaanisha kuketi au kukaa mahali; hapa “atakaa” kinaeleza uwepo wa Mungu bila kulazimisha wazo la makao ya kudumu.
- source_word: אֶת הָאָדָם
  choice: pamoja na wanadamu
  rationale: אֵת hapa ina maana ya “pamoja na,” na אָדָם yenye kibainishi inawakilisha jamii ya binadamu kwa ujumla. “Wanadamu” huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: עַל הָאָרֶץ
  choice: duniani
  rationale: Ni usemi wa asili wa Kiswahili kwa maana ya kuwa juu ya dunia/katika ulimwengu huu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi wito wa kuelekeza fikira na uzito wa sala ya Sulemani.
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: mbingu, naam, mbingu zilizo juu kabisa
  rationale: Usemi wa pili ni wa kiwango cha juu sana, yaani “mbingu za mbingu.” Tafsiri hii huonyesha kuongezeka kwa msisitizo kwa lugha inayoeleweka.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: haziwezi kukutosha
  rationale: Kitenzi kina maana ya kuwa na nafasi au uwezo wa kutosha kumchukua mtu; “kukutosha” huonyesha kwamba hata mbingu zote hazina uwezo wa kumzunguka Mungu.
- source_word: אַף כִּי
  choice: sembuse
  rationale: 'Huonyesha hoja ya kutoka jambo kubwa kwenda dogo: ikiwa hata mbingu hazimtoshi Mungu, nyumba hii ndiyo zaidi haiwezi.'
- source_word: הַבַּיִת הַזֶּה
  choice: nyumba hii
  rationale: Huhifadhi neno halisi “nyumba,” ingawa katika muktadha linarejelea hekalu.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: niliyoijenga
  rationale: Ni uundaji wa asili wa Kiswahili unaoonyesha nyumba iliyokwisha kujengwa na Sulemani.
theological_decisions:
- issue: Maana ya אָדָם kama mwakilishi wa jamii yote ya binadamu
  choice: wanadamu
  alternative: mwanadamu
  rationale: Katika Kiswahili, wingi “wanadamu” unaonyesha wazi kwamba Mungu analinganishwa na jamii yote ya binadamu, huku “mwanadamu” ingeweza kueleweka kama mtu mmoja. Tofauti ya idadi ya kisarufi haiathiri maana wakilishi ya Kiebrania.
- issue: Uwepo wa Mungu kuhusiana na hekalu
  choice: atakaa pamoja na wanadamu
  alternative: ataishi pamoja na wanadamu
  rationale: '“Atakaa” huhifadhi upana wa יֵשֵׁב na mvutano wa kifungu: Mungu yupo pamoja na watu wake, lakini hawezi kufungiwa au kutoshelezwa na hekalu.'
- issue: Ukuu wa Mungu usioweza kuwekewa mipaka na nafasi
  choice: haziwezi kukutosha
  alternative: haziwezi kukuweka ndani yake
  rationale: Tafsiri iliyochaguliwa inasisitiza kwamba hata mbingu hazina uwezo wa kumchukua Mungu kikamilifu, bila kudai kwamba Mungu hayupo mbinguni au hekaluni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. “Naam” limetumiwa kuonyesha kuongezeka kwa msisitizo kati ya “mbingu” na “mbingu zilizo juu kabisa”; alama ya mshangao inafaa kwa mshangao wa swali na hoja ya mwisho.
