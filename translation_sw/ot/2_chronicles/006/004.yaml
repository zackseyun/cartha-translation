base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: sw
  text: Akasema[a], “Abarikiwe Yahwe, Mungu wa Israeli, aliyesema kwa kinywa chake kwa Daudi, baba yangu, na akatimiza yale aliyosema kwa mkono wake, akisema:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akasema, ‘Abarikiwe Yahwe, Mungu wa Israeli, ambaye alisema kwa kinywa chake kwa Daudi, baba yangu, na kwa mkono wake akatimiza.’” Kiebrania huhifadhi ulinganifu wa makusudi kati ya Mungu kusema kwa kinywa chake na kutenda kwa mkono wake.
    reason: Mbadala huu huhifadhi mpangilio wa karibu zaidi na Kiebrania; tafsiri kuu huweka wazi yambwa inayodokezwa katika kitenzi “akatimiza.”
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Kauli ya kawaida ya masimulizi inayodumisha mwendelezo wa Kiebrania bila kuongeza msisitizo wa wakati usiotajwa.
- source_word: בָּרוּךְ
  choice: Abarikiwe
  rationale: Inadumisha kauli ya baraka inayomwelekea Mungu, katika lugha yenye heshima na inayoeleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo huu wa umilikaji.
- source_word: דִּבֶּר בְּפִיו אֵת דָּוִיד אָבִי
  choice: aliyemwambia Daudi baba yangu kwa kinywa chake
  rationale: Kitenzi chenye kiambishi cha yambwa kinaonyesha Daudi kama aliyeambiwa; kutaja kinywa kunahifadhi taswira ya Kiebrania na ulinganifu wake na mkono.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: na kwa mkono wake ametimiza
  rationale: Inahifadhi ulinganifu wa kusema kwa kinywa na kutenda kwa mkono. Yambwa lisilotajwa wazi linaeleweka kuwa ni jambo alilosema.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni utangulizi wa kawaida wa maneno yanayonukuliwa katika mstari unaofuata.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya chanzo yanatumia jina binafsi la Mungu; kulinakili kama Yahwe hulihifadhi bila kulibadilisha kuwa cheo.
- issue: Taswira ya Mungu kusema kwa kinywa na kutimiza kwa mkono
  choice: Kuhifadhi viungo vyote viwili vya mwili katika tafsiri
  alternative: Kufupisha kuwa ‘aliyeahidi na kutimiza’
  rationale: Lugha ya Kiebrania ina ulinganifu wa makusudi kati ya neno na tendo; kuufupisha kungepoteza mvutano na taswira hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa hotuba ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘kwa kinywa chake ... kwa mkono wake’ umehifadhiwa kwa makusudi licha ya kutokuwa usemi wa kawaida kabisa, kwa sababu ni muhimu katika sanaa na maana ya mstari.
