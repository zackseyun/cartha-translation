base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: sw
  text: ili wakuogope na waenende katika njia zako siku zote wanazoishi katika nchi uliyowapa baba zetu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakuheshimu kwa kicho” au “wakuonee kicho.” Neno la Kiebrania linalotafsiriwa “kuogopa” hapa linahusisha heshima kuu inayoonekana katika utii.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa siku zote watakazoishi katika nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi au matokeo kwa Kiswahili cha kawaida na wazi.
- source_word: יִירָאוּךָ
  choice: wakuogope
  rationale: Huhifadhi maana pana ya kumwogopa Mungu, ambayo katika muktadha huu inahusisha kumcha kwa heshima na kumtii.
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: na kutembea katika njia zako
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu mwenendo wa maisha na uhusiano wa karibu kati ya kumcha Mungu na kuishi kwa kufuata njia zake.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: siku zote wanazoishi
  rationale: Huhifadhi usemi halisi wa wakati huku ukieleweka kwa Kiswahili; maana yake ni muda wote wa maisha yao.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha huu הָאֲדָמָה ni nchi waliyopewa mababu, si dunia yote; Kiswahili hakihitaji kuiga neno kwa neno usemi 'juu ya uso wa nchi'.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: uliyowapa baba zetu
  rationale: Hueleza kwa kawaida kwamba Mungu aliwapa mababu nchi hiyo; kiambishi cha wingi katika 'uli-yo-wa-pa' kinaweka wapokeaji wazi.
theological_decisions:
- issue: Maana ya ירא kuhusiana na utii wa agano
  choice: wakuogope
  alternative: wakuch[e] / wakuheshimu sana
  rationale: ‘Wakuogope’ huhifadhi uzito na upana wa neno la Kiebrania. Kishazi kinachofuata kuhusu kutembea katika njia za Mungu kinaonyesha kwamba si hofu tupu bali kumcha kwa heshima kunakoonekana katika utii.
- issue: Upeo wa הָאֲדָמָה
  choice: nchi
  alternative: dunia; ardhi
  rationale: Kishazi ‘uliyowapa baba zetu’ kinaonyesha kwamba inakusudiwa nchi ya ahadi, si dunia yote wala udongo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi ‘kutembea katika njia zako’ umehifadhiwa kama sitiari ya kibiblia iliyo wazi katika muktadha.
