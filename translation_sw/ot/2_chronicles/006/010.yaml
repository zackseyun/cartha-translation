  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: sw
  text: Yahweh ametimiza neno lake alilolisema[a]; nami nimechukua nafasi ya Daudi, baba yangu, na nimeketi kwenye kiti cha enzi cha Israeli, kama Yahweh alivyosema; nami nimeijenga nyumba kwa ajili ya jina la Yahweh[b], Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameliimarisha neno lake” au “amelitekeleza neno lake.” Kitenzi cha Kiebrania kwa maana halisi ni “amelifanya neno lake lisimame.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa ni hekalu. Kiebrania kinahifadhi usemi “nyumba kwa ajili ya jina la Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ametimiza
  rationale: Hifili ya קום ikiwa na ‘neno’ kama yambwa ina maana ya kulifanya neno lisimame, yaani kulitekeleza au kulitimiza. ‘Ametimiza’ ni Kiswahili cha kawaida na kinafaa kwa ahadi iliyosemwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika tetragramatoni limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: neno lake alilolisema
  rationale: Huhifadhi urudiaji wa mzizi דבר na usemi wa Kiebrania bila kuufasiri moja kwa moja kuwa ‘ahadi.’
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: nimechukua nafasi ya Daudi baba yangu
  rationale: תחת hapa huonyesha urithi wa kifalme, yaani kuwa katika nafasi ya Daudi. Kiswahili hiki ni cha asili kuliko tafsiri halisi ‘nimesimama chini ya’.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: na kuketi katika kiti cha enzi cha Israeli
  rationale: ‘Kuketi katika kiti cha enzi’ ni usemi wa kawaida wa kifalme na unaonyesha hali iliyotokana na kurithi ufalme.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: nimeijenga nyumba
  rationale: ‘Nyumba’ huhifadhi istilahi ya Kiebrania, huku tanbihi ikifafanua kwamba hapa ni hekalu.
- source_word: לְשֵׁם יְהוָה
  choice: kwa ajili ya jina la Yahweh
  rationale: Huhifadhi usemi muhimu wa kitheolojia kwamba nyumba imejengwa kwa ajili ya jina la Yahweh, bila kuudhoofisha kuwa ‘kwa heshima ya Yahweh.’
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Unukuzi ‘Yahweh’ huhifadhi jina binafsi lililo katika matini badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הַבַּיִת
  choice: nyumba
  alternative: hekalu
  rationale: Matini yenyewe inasema ‘nyumba’; tafsiri hii huhifadhi istilahi hiyo na tanbihi hufafanua rejeo lake.
- issue: Usemi לְשֵׁם יְהוָה
  choice: kwa ajili ya jina la Yahweh
  alternative: kwa heshima ya Yahweh
  rationale: Tafsiri rasmi kiasi huhifadhi dhana ya kibiblia ya ‘jina’ na haidokezi kwamba Mungu mwenyewe anafungiwa ndani ya jengo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa kwa usomaji wa kawaida, huku istilahi ‘neno,’ ‘nyumba,’ na ‘jina la Yahweh’ zikihifadhi uhusiano wa matini ya Kiebrania.
