  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: sw
  text: Na sasa, Ee BWANA, Mungu wa Israeli, timiza kwa ajili ya mtumishi wako Daudi, baba yangu, yale uliyomwambia uliposema, ‘Hutakosa mbele zangu mtu wa kuketi kwenye kiti cha enzi cha Israeli, ikiwa tu wanao wataishika njia yao kwa kutembea katika sheria yangu, kama wewe ulivyotembea mbele zangu.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמֹר ... אֵת אֲשֶׁר דִּבַּרְתָּ
  choice: mtimizie ... ahadi uliyompa
  rationale: Kwa Kiswahili cha kawaida, ‘itimiza ahadi’ huwasilisha kwa uwazi maana ya kumshikilia Daudi neno ambalo Mungu alimwambia; ‘linda neno’ ingekuwa ngumu na isiyo ya kawaida hapa.
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la agano limetafsiriwa kwa desturi pana ya Biblia ya Kiswahili kwa herufi kubwa, bila kuingiza matamshi yenye ubishi.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Hutakosa kamwe ... mtu
  rationale: Nahau ya Kiebrania, kwa halisi ‘hatakatiliwa mbali kwako mtu,’ humaanisha kwamba ukoo wa Daudi hautakosa mrithi wa kiume; Kiswahili hiki ni cha asili na kinahifadhi ahadi hiyo.
- source_word: כִּסֵּא יִשְׂרָאֵל
  choice: kiti cha ufalme cha Israeli
  rationale: Hufafanua kwamba ‘kiti’ ni ishara ya mamlaka ya kifalme, kwa lugha inayoeleweka kwa msomaji wa kawaida.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם לָלֶכֶת בְּתוֹרָתִי
  choice: watailinda njia yao kwa kutembea katika sheria yangu
  rationale: Muundo huu unahifadhi picha ya ‘njia’ na uhusiano wake na kutii sheria, bila kuubadili kuwa kauli ya jumla kuhusu mwenendo.
- source_word: לְפָנַי
  choice: mbele zangu
  rationale: Picha ya uwepo na uangalizi wa Mungu imehifadhiwa badala ya kufupishwa kuwa ‘kwa uaminifu.’
theological_decisions:
- issue: Uhusiano kati ya ahadi ya kifalme na sharti la utiifu
  choice: ikiwa tu wanao watailinda njia yao
  alternative: mradi wanao waishi kwa uaminifu
  rationale: ‘Ikiwa tu’ huhifadhi msisitizo wa sharti katika רַק אִם bila kulainisha mvutano kati ya ahadi ya Mungu na wajibu wa wazao wa Daudi.
- issue: Maana ya ‘sheria yangu’
  choice: sheria yangu
  alternative: mafundisho yangu
  rationale: Ingawa תּוֹרָה inaweza kumaanisha mafundisho, katika muktadha huu wa agano ‘sheria’ ndiyo tafsiri ya moja kwa moja na haitangulizi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala ya kifalme lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ee’ imetumiwa kwa mwito wa heshima; sentensi ndefu ya chanzo imehifadhiwa kwa mtiririko wa kawaida wa Kiswahili.
