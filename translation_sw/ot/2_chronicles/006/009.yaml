base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: sw
  text: Lakini wewe hutajenga nyumba[a]; bali mwana wako, atakayetokana nawe mwenyewe[b], ndiye atakayejenga nyumba kwa ajili ya jina langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu.” Kiebrania kinasema “nyumba,” jina la kawaida la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “atakayetoka viunoni mwako,” nahau inayomaanisha mzao wako wa moja kwa moja wa kimwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno hilo linaweka kizuizi dhidi ya kusudi lililotajwa kabla; “Lakini” linaonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: תִבְנֶה הַבָּיִת
  choice: hutajenga nyumba
  rationale: Hali ya wakati ujao yenye ukanushaji imewasilishwa kwa “hutajenga.” Kiswahili hakina kibainishi sawa na הַ, na muktadha tayari unaifanya nyumba inayokusudiwa ijulikane.
- source_word: כִּי
  choice: bali
  rationale: Baada ya kauli hasi, כִּי hapa inaanzisha kauli chanya inayotofautisha yule atakayejenga; “bali” linahifadhi ulinganisho huo.
- source_word: בִנְךָ
  choice: mwana wako
  rationale: Hili ni neno la moja kwa moja linalomtaja mwana wa mtu anayesemeshwa.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: atakayetoka katika mwili wako mwenyewe
  rationale: Kirai cha Kiebrania kinamaanisha mzao wa moja kwa moja wa kimwili. Tafsiri hii ni ya kisasa na wazi, huku “mwenyewe” ikidumisha mkazo wa uhusiano wa moja kwa moja.
- source_word: הוּא
  choice: ndiye
  rationale: Kiwakilishi huru kina mkazo; “ndiye” linaonyesha wazi kwamba mwana huyo, wala si Daudi, ndiye atakayejenga.
- source_word: יִבְנֶה הַבַּיִת
  choice: atakayeijenga nyumba
  rationale: Muundo wa wakati ujao umehifadhiwa, na kirejeshi “-i-” kinarejelea nyumba iliyokwisha tajwa bila kuongeza maana mpya.
- source_word: לִשְׁמִי
  choice: kwa ajili ya jina langu
  rationale: Usemi huu unaonyesha kwamba nyumba hiyo itawekwa wakfu kwa jina la Mungu na kulisimamia; tafsiri hii ni ya kawaida na inaeleweka kwa Kiswahili.
theological_decisions:
- issue: Istilahi ya hekalu
  choice: nyumba
  alternative: hekalu
  rationale: Kiebrania kinasema “nyumba,” ambalo ni jina la kawaida la hekalu katika muktadha huu. Kulihifadhi kunatunza taswira na uhusiano wa kimatini bila kuficha maana yake, ambayo imeelezwa katika tanbihi.
- issue: Nahau ya ukoo wa kimwili
  choice: katika mwili wako mwenyewe
  alternative: kutoka viunoni mwako
  rationale: Nahau hiyo inamaanisha uzao wa moja kwa moja wa kimwili. Chaguo kuu linaeleza maana yake kwa Kiswahili cha sasa bila kuingiza dai jingine la kiteolojia.
- issue: Mkazo wa הוּא
  choice: ndiye atakayeijenga
  alternative: atakayeijenga
  rationale: “Ndiye” linahifadhi mkazo wa kiwakilishi huru cha Kiebrania na tofauti kati ya Daudi na mwana wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. “Bali” na “ndiye” zinatunza utofautishaji na mkazo wa Kiebrania bila kufanya sentensi kuwa nzito; tanbihi zinafafanua istilahi ya hekalu na nahau ya uzao.
