  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: sw
  text: na wakurudie[a] kwa moyo wao wote na kwa nafsi yao yote katika nchi ya uhamisho wao, ambako walichukuliwa mateka, na waombe kuelekea nchi yao uliyowapa baba zao, na mji uliouchagua, na nyumba niliyoijenga kwa ajili ya jina lako,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakugeukie tena.” Katika muktadha wa agano, usemi huu unaweza pia kumaanisha kutubu na kumrudia Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: na wakurudie[a]
  rationale: Kitenzi שׁוּב pamoja na אֶל humaanisha kurudi au kumgeukia mtu. “Wakurudie” huhifadhi picha ya kurudi kwa Mungu huku muktadha ukiruhusu maana ya toba bila kuiingiza moja kwa moja katika matini.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: kwa moyo wao wote na kwa nafsi yao yote
  rationale: Huu ni usemi wa kujitoa kwa unyofu na kwa utu mzima. Jozi “moyo” na “nafsi” huhifadhi muundo na msisitizo wa Kiebrania.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: katika nchi ya uhamisho wao
  rationale: שְׁבִי hurejelea hali ya kuwa mateka. “Uhamisho wao” ni Kiswahili cha kawaida katika muktadha wa watu walioondolewa nchini kwao, huku kishazi kinachofuata kikieleza wazi kwamba walichukuliwa mateka.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: ambako walichukuliwa mateka
  rationale: Kitenzi שׁבה hapa ni tendo la kuwateka. Muundo wa kutendwa ni wa kawaida na wazi katika Kiswahili.
- source_word: וְהִתְפַּלְלוּ
  choice: na waombe
  rationale: Katika mfululizo huu wa masharti, kauli hii inaendeleza matendo yanayotarajiwa; “waombe” ni ya asili katika Kiswahili na inaendana na “wakurudie.”
- source_word: דֶּרֶךְ אַרְצָם
  choice: wakielekea nchi yao
  rationale: דֶּרֶךְ katika muktadha wa sala huonyesha upande au mwelekeo. “Wakielekea” huwasilisha tendo la kuomba kwa kuelekeza uso upande wa nchi yao.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: uliyowapa baba zao
  rationale: “Baba zao” huhifadhi lugha ya agano ya אָבוֹת na inaeleweka hapa kuwa mababu wao.
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: na mji uliouchagua
  rationale: Tafsiri hii huhifadhi uchaguzi wa Mungu bila kuongeza jina la Yerusalemu, ambalo halitajwi moja kwa moja katika mstari huu.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: na nyumba niliyoijenga kwa ajili ya jina lako
  rationale: “Nyumba” huhifadhi בַּיִת na maana yake ya hekalu katika muktadha. “Kwa ajili ya jina lako” huhifadhi usemi wa kiagano badala ya kuufafanua kupita kiasi.
theological_decisions:
- issue: Maana ya toba katika שׁוּב אֵלֶיךָ
  choice: wakurudie
  alternative: watubu mbele zako / wakugeukie tena
  rationale: Kitenzi kimsingi humaanisha kurudi au kugeuka. Katika sala hii kina maana inayohusiana na toba na kurejeshwa kwa uhusiano wa agano, lakini “wakurudie” huhifadhi upana huo badala ya kuufunga kwa neno la kitheolojia pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mstari umeachwa kama mwendelezo wa sentensi ya masharti kutoka mistari iliyotangulia, na koma ya mwisho inadumisha mwendelezo huo.
