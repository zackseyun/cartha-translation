review_pass:
  verdict: revise
  source_fidelity: 'Draft faithfully represents the Hebrew sequence: returning to God wholeheartedly, in the land of captivity, praying in the direction of the land, city, and house. However, “wakielekea nchi yao” can naturally suggest travelling toward the land rather than the required prayer orientation.'
  naturalness: The register is clear, standard East African Swahili and appropriately scriptural. “Waombe kuelekea nchi yao” is more idiomatic and unambiguously expresses directional prayer.
  terminology: “Wakurudie,” “moyo,” “nafsi,” “uhamisho,” “mateka,” and “nyumba ... kwa ajili ya jina lako” suitably preserve the source terms and their theological range. The footnote appropriately retains the repentance-related implication without placing it in the main text.
  issues:
  - severity: medium
    issue: “wakielekea nchi yao” may imply physical movement toward the land.
    rationale: Hebrew דֶּרֶךְ אַרְצָם specifies the direction in which they pray. In Swahili, the participial form wakielekea can be read as ‘while going/travelling toward,’ whereas kuelekea after waombe directly marks the orientation of the prayer.
  revised_text: na wakurudie[a] kwa moyo wao wote na kwa nafsi yao yote katika nchi ya uhamisho wao, ambako walichukuliwa mateka, na waombe kuelekea nchi yao uliyowapa baba zao, na mji uliouchagua, na nyumba niliyoijenga kwa ajili ya jina lako,
  revised_footnotes:
  - marker: a
    text: Au, “wakugeukie tena.” Katika muktadha wa agano, usemi huu unaweza pia kumaanisha kutubu na kumrudia Mungu.
    reason: lexical_alternative
  revision_rationale: Revised only the expression for prayer orientation. “Waombe kuelekea nchi yao” conveys that their prayers are directed toward the land, as in the Hebrew, without suggesting that they themselves are travelling there. The final comma is retained because the verse continues the conditional prayer from the preceding context.
