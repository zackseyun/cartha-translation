source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: sw
  text: Sikiliza maombi ya unyenyekevu ya mtumishi wako na ya watu wako Israeli wanapoomba wakielekea mahali hapa. Nawe usikie kutoka mahali pako pa kukaa, kutoka mbinguni; nawe utakaposikia, usamehe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: sikiliza / usikie / utakaposikia
  rationale: Mzizi unaorudiwa שׁמע umehifadhiwa kwa vitenzi vya kusikia/kusikiliza. “Sikiliza” ni ombi la kawaida kwa Kiswahili, “usikie” hudumisha nguvu ya dua, na “utakaposikia” huonyesha mfuatano unaoelekea kwenye kusamehe.
- source_word: תַּחֲנוּנֵי
  choice: maombi ya unyenyekevu
  rationale: Neno hili humaanisha maombi ya dhati yanayotafuta rehema au fadhili. Usemi huu unaeleweka kwa urahisi na huhifadhi hali ya mnyenyekevu ya mwombaji.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya kifalme kwa Mungu, maana ya heshima na uhusiano ndiyo iliyo mbele; “mtumishi wako” inafaa kuliko “mtumwa wako.”
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: na ya watu wako Israeli
  rationale: Kurudia “ya” kunaonyesha wazi kuwa maombi hayo ni ya mtumishi na pia ya watu wa Mungu, Israeli.
- source_word: יִתְפַּלְלוּ
  choice: wanapoomba
  rationale: Kitenzi humaanisha kuomba; hali ya kuelekea mahali fulani imewekwa katika kirai kinachofuata.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: wakielekea mahali hapa
  rationale: Kihusishi אֶל hapa kinaonyesha mwelekeo wa sala kuhusiana na hekalu, si kwamba waombaji lazima wawe ndani ya mahali hapo.
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  choice: kutoka mahali pako pa kukaa
  rationale: Tafsiri hii ni ya kawaida na wazi, nayo huhifadhi dhana ya mahali Mungu anapokaa.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Ingawa umbo la Kiebrania ni la wingi, katika muktadha huu Kiswahili cha kawaida hutumia “mbinguni.”
- source_word: סָלָחְתָּ
  choice: usamehe
  rationale: Kitenzi kinamaanisha kusamehe dhambi au hatia; “usamehe” ni wazi na kinafaa katika ombi hili.
theological_decisions:
- issue: Ukuu wa Mungu kupita uumbaji na teolojia ya hekalu
  choice: Sala inaelekezwa upande wa hekalu, lakini Mungu husikia kutoka mahali pake pa kukaa mbinguni.
  alternative: Kumweka Mungu katika hekalu pekee, au kulifanya hekalu kuwa ishara tu isiyo na nafasi halisi katika sala.
  rationale: 'Kiebrania kinadumisha mambo yote mawili: watu wanaomba wakielekea “mahali hapa,” lakini Mungu anasikia kutoka mbinguni. Tafsiri haiondoi mvutano huo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa marudio ya kusikia umehifadhiwa bila kufanya sentensi kuwa ngumu.
