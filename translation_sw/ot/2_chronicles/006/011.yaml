language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: sw
  text: Nami nimeweka humo sanduku, ambamo limo agano la Yahwe, ambalo Yahwe alifanya na wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Israeli.” Kiebrania kinasema “wana wa Israeli,” jina la kijumla la watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: nimeweka
  rationale: Kitenzi שׂוּם humaanisha ‘kuweka.’ Kauli timilifu ya Kiswahili inaonyesha tendo lililokamilika ambalo matokeo yake bado yapo.
- source_word: שָׁם
  choice: humo
  rationale: Kiashiria hiki kinarejelea mahali ndani ya hekalu palipotajwa katika muktadha; ‘humo’ ni cha kawaida na huonyesha mahali ndani.
- source_word: הָאָרוֹן
  choice: sanduku
  rationale: ‘Sanduku’ ni neno la kawaida la kibiblia kwa אָרוֹן katika muktadha wa sanduku la agano, bila kuongeza ‘la agano’ mahali ambapo Kiebrania hakufanyi hivyo moja kwa moja.
- source_word: אֲשֶׁר שָׁם
  choice: ambamo mna
  rationale: Muundo huu unaonyesha kwamba agano limo ndani ya sanduku. ‘Ambamo mna’ ni Kiswahili cha asili kinachohifadhi uhusiano huo wa mahali.
- source_word: בְּרִית יְהוָה
  choice: agano la Yahwe
  rationale: בְּרִית ni ‘agano,’ na jina binafsi יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר כָּרַת
  choice: alilofanya
  rationale: Kiebrania hutumia nahau ya ‘kukata agano’; Kiswahili cha kawaida husema ‘kufanya agano,’ hivyo maana inahifadhiwa bila kuhamisha nahau isiyo ya asili.
- source_word: עִם
  choice: na
  rationale: Katika muktadha wa kufanya agano, עִם huonyesha wahusika ambao agano lilifanywa nao.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata kwa karibu muundo wa Kiebrania na pia ni usemi unaoeleweka kwa wazao au taifa la Israeli. Maana ya kijumla imefafanuliwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: ‘Yahwe’ huhifadhi jina binafsi lililo katika matini ya Kiebrania badala ya kulibadilisha kwa cheo.
- issue: Maana ya kijumla ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watu wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi umbo la usemi wa Kiebrania, lakini katika muktadha huu ni jina la kijumla la watu wote wa Israeli, si wanaume pekee; jambo hilo limewekwa wazi katika tanbihi.
- issue: Agano kuwamo ndani ya sanduku
  choice: ambamo mna agano
  alternative: ambamo mna agano la Yahwe
  rationale: Matini inasema agano liko humo, huenda kwa kurejelea mbao zenye masharti ya agano. Tafsiri haiongezi ufafanuzi huo na hivyo huhifadhi lugha ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. ‘Nami nimeweka humo’ huunganisha mstari huu na hotuba inayoendelea; ‘ambamo mna’ ni muundo wa asili unaoonyesha yaliyomo ndani ya sanduku. Alama ya tanbihi imewekwa baada ya ‘wana wa Israeli,’ ambako tanbihi inahusika.
