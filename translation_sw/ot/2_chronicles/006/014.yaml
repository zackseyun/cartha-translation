source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: sw
  text: Akasema, “Ee Yahwe, Mungu wa Israeli, hakuna Mungu kama wewe mbinguni wala duniani, unayeshika agano na upendo wa kudumu[a] kwa watumishi wako wanaotembea mbele zako kwa mioyo yao yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unayeshika agano na uaminifu wa agano kwa watumishi wako.”
    reason: חֶסֶד katika muktadha huu linaweza kusisitiza uaminifu wa kudumu ndani ya agano, si upendo kwa maana nyembamba tu.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Akasema
  rationale: Huwakilisha kwa kawaida wayyiqtol ya kisimulizi inayoanzisha sala ya Sulemani bila kulazimisha tofauti ya wakati isiyomo wazi katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji wa jina la Mungu יהוה kwa tahajia ya kawaida ya Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni muundo wa kawaida na wa asili wa Kiswahili unaotambulisha uhusiano wa Yahwe na Israeli.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: hakuna Mungu kama wewe
  rationale: Huhifadhi kauli ya kutolinganishwa kwa Yahwe bila kuamua zaidi ya lazima ikiwa אֱלֹהִים hapa inapaswa kueleweka kama Mungu au miungu.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: mbinguni wala duniani
  rationale: Katika sentensi hasi, “wala” ni ya asili katika Kiswahili na huonyesha upeo wote wa mbingu na dunia.
- source_word: שֹׁמֵר הַבְּרִית
  choice: unayeshika agano
  rationale: Kitenzi kishirikishi kinaonyesha tabia endelevu ya Mungu; “kushika agano” huhifadhi sitiari na maana ya kuwa mwaminifu kwa agano.
- source_word: וְהַחֶסֶד
  choice: na kudumisha upendo thabiti
  rationale: חֶסֶד hubeba maana ya upendo wenye uaminifu na kudumu katika uhusiano wa agano. “Upendo thabiti” ni wazi kwa wasomaji wa sasa, huku “kudumisha” ikiifanya sentensi iwe ya asili bila kupoteza usambamba na kushika agano.
- source_word: לַעֲבָדֶיךָ
  choice: kwa watumishi wako
  rationale: “Watumishi” linafaa kwa muktadha wa ibada na uaminifu, na “kwa” huonyesha wale wanaonufaika na utunzaji wa agano na upendo wa Mungu.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: wanaotembea mbele zako
  rationale: Huhifadhi sitiari ya Kiebrania ya mwenendo wa maisha katika uwepo wa Mungu.
- source_word: בְּכָל לִבָּם
  choice: kwa moyo wao wote
  rationale: Huhifadhi umoja wa neno “moyo” wenye kiambishi cha wingi na kueleza kujitoa kwao bila kugawanyika.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la agano, kwa hiyo uhawilishaji “Yahwe” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya חֶסֶד katika muktadha wa agano
  choice: upendo thabiti
  alternative: uaminifu wa agano, fadhili, au rehema
  rationale: Kwa kuwa חֶסֶד limeunganishwa na “agano,” tafsiri inapaswa kubeba upendo pamoja na uthabiti wa uaminifu. Tanbihi inahifadhi uwezekano wa kusisitiza uaminifu wa agano.
- issue: Kauli אֵין כָּמוֹךָ אֱלֹהִים
  choice: hakuna Mungu kama wewe
  alternative: hakuna kama wewe miongoni mwa miungu
  rationale: Muundo uliochaguliwa unaeleza kutolinganishwa kwa Yahwe kwa Kiswahili cha asili bila kuingiza kwa lazima dai tofauti kuhusu hadhi ya miungu mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sala lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee” huhifadhi mwito wa sala; “wanaotembea mbele zako” huhifadhi sitiari ya chanzo badala ya kuibadilisha kabisa kuwa “wanaoishi kwa uaminifu.”
