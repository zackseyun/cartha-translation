source:
  edition: WLC
  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: sw
  text: Ikiwa watu wako Israeli watashindwa mbele ya adui kwa sababu wametenda dhambi dhidi yako[a], kisha wakarudi, wakalikiri jina lako[b], wakaomba na kusihi rehema[c] mbele zako katika nyumba hii,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakatubu.” Kitenzi cha Kiebrania pia kinaweza kuwa na maana ya kutubu katika muktadha wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au “wakalisifu jina lako” au “wakalishukuru jina lako.”
    reason: lexical_alternative
  - marker: c
    text: Au “kusihi fadhili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִנָּגֵף
  choice: watashindwa
  rationale: Katika muktadha wa vita, Nifali ya נגף inaeleza kupigwa au kushindwa na adui. “Watashindwa” ni Kiswahili cha kawaida kinachowasilisha matokeo hayo bila kutumia lugha ya kizamani.
- source_word: לִפְנֵי אוֹיֵב
  choice: mbele ya adui
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha kushindwa katika mapambano mbele ya adui, huku nomino ya umoja ikibaki bila kufanywa kuwa adui maalumu.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: kwa sababu wamekutenda dhambi
  rationale: כִּי hapa inaonyesha sababu ya kushindwa, na “kumtenda mtu dhambi” ni usemi wa kawaida wa Kiswahili unaoonyesha dhambi iliyoelekezwa dhidi ya Mungu.
- source_word: וְשָׁבוּ
  choice: kisha wakarudi
  rationale: שׁוב inaweza kumaanisha kurudi na, katika muktadha wa agano, pia kutubu. “Wakarudi” huhifadhi taswira pana ya kurudi bila kuifanya moja kwa moja kuwa istilahi ya kiteolojia.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: wakalikiri jina lako
  rationale: Hifili ya ידה inaweza kumaanisha kukiri, kusifu, au kushukuru. Katika muktadha wa kurudi baada ya dhambi, “kulikiri jina lako” huonyesha kumtambua Mungu na jina lake waziwazi huku tanbihi ikihifadhi uwezekano mwingine wa kileksia.
- source_word: וְהִתְפַּלְלוּ
  choice: wakaomba
  rationale: Hili ni neno la kawaida na la moja kwa moja la Kiswahili kwa tendo la kusali au kuomba; mwelekeo wa sala kwa Mungu unaelezwa na “mbele zako.”
- source_word: וְהִתְחַנְּנוּ
  choice: kusihi rehema
  rationale: Hitpaeli ya חנן inaonyesha dua ya dhati ya kutaka fadhili au rehema. “Kusihi rehema” ni ya asili, inaeleweka, na huhifadhi uzito wa ombi hilo.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Huhifadhi nahau ya uwepo wa Mungu na mwelekeo wa moja kwa moja wa sala kwake.
- source_word: בַּבַּיִת הַזֶּה
  choice: katika nyumba hii
  rationale: בית ni “nyumba,” na kirai hiki kinaonyesha wazi nyumba inayowekwa wakfu katika sala ya Sulemani bila kuingiza neno fasiri “hekalu.”
theological_decisions:
- issue: Maana ya kurudi au kutubu katika וְשָׁבוּ
  choice: wakarudi
  alternative: wakatubu
  rationale: Muktadha wa dhambi na kurejeshwa kwa agano unadokeza toba, lakini kitenzi cha Kiebrania kina maana pana ya kurudi. “Wakarudi” huhifadhi upana huo na mvutano wa kiteolojia bila kuufunga kwa istilahi moja.
- issue: Maana ya וְהוֹדוּ אֶת שְׁמֶךָ katika muktadha wa dhambi
  choice: wakalikiri jina lako
  alternative: wakalishukuru jina lako; wakalisifu jina lako
  rationale: Kitenzi ידה kinaweza kueleza kukiri, kusifu, au kushukuru. Muktadha wa kurudi baada ya dhambi unaunga mkono “kukiri,” lakini uwezekano wa sifa au shukrani umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sala ya kuweka wakfu lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa masharti na mfululizo wa vitenzi umehifadhiwa, pamoja na koma ya mwisho kwa kuwa mstari unaendelea katika sentensi inayofuata.
