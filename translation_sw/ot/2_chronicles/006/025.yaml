id: 2CH.6.25
reference: 2 Chronicles 6:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: sw
  text: basi, usikie kutoka mbinguni[a], usamehe dhambi ya watu wako Israeli, na uwarudishe katika nchi uliyowapa wao na baba zao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndipo utasikia kutoka mbinguni.”
    reason: Kitenzi cha Kiebrania kinaweza kueleweka kama ombi au kama kauli ya wakati ujao.
  - marker: b
    text: Au, “mababu zao.” Kiebrania kinasema “baba zao.”
    reason: ‘Baba’ katika muktadha huu inaweza kumaanisha waliotangulia katika ukoo.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: usikie
  rationale: Katika muktadha wa sala, kitenzi hiki kinaomba Mungu asikie kwa makini, huku jibu likidokezwa bila kuongezwa wazi. Hali ya ombi inafaa kwa mfululizo wa vitenzi vya Kiebrania katika mstari huu.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Ingawa umbo la Kiebrania ni la wingi, ‘mbinguni’ ni usemi wa kawaida wa Kiswahili unaoonyesha makao ya Mungu.
- source_word: סָלַחְתָּ
  choice: usamehe
  rationale: סלח ndicho kitenzi cha kawaida cha msamaha unaotolewa na Mungu; ‘samehe’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְחַטַּאת
  choice: dhambi
  rationale: Nomino ya umoja inatumika kwa dhambi ya Israeli kwa maana ya jumla; Kiswahili kinaweza kuhifadhi umoja huo kiasili.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Huhifadhi jina la agano ‘watu wako’ pamoja na jina maalumu ‘Israeli’ kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: uwarudishe
  rationale: Hifili ya שוב ina maana ya kusababisha warudi; ‘uwarudishe’ huhifadhi maana hiyo ya kisababishi.
- source_word: אֶל הָאֲדָמָה
  choice: katika nchi
  rationale: Katika muktadha huu wa agano na taifa, אֲדָמָה ni nchi waliyopewa Israeli, si udongo tu.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: uliyowapa wao na baba zao
  rationale: Huhifadhi vipokezi viwili vya tendo la kutoa na mwendelezo kati ya kizazi cha sasa na baba zao.
theological_decisions:
- issue: Nguvu ya vitenzi vya hali isiyotimilika katika sala
  choice: usikie … usamehe … uwarudishe
  alternative: utasikia … utasamehe … utawarudisha
  rationale: Katika sala hii, vitenzi vinaweza kueleweka kama maombi au kama matarajio ya jambo litakalotokea. Uundaji wa ombi unaendana kiasili na muktadha, huku tanbihi ikihifadhi uwezekano wa maana ya wakati ujao.
- issue: Tafsiri ya אֲבֹתֵיהֶם
  choice: baba zao
  alternative: mababu zao
  rationale: Kiebrania kinasema kihalisi ‘baba zao.’ Tafsiri hii inahifadhi usemi wa chanzo bila kuficha kwamba katika muktadha unaweza kurejelea waliotangulia katika ukoo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa sala lakini kinachoeleweka kwa urahisi. Muundo wa maombi umetumiwa kwa vitenzi vitatu vinavyofuatana, na ‘wao’ imehifadhiwa ili kuonyesha wazi vipokezi viwili katika kishazi cha mwisho.
