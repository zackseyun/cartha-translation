  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: sw
  text: Hata hivyo, uelekee sala ya mtumishi wako na ombi lake la rehema,[a] ee Yahweh Mungu wangu, ili usikie kilio[b] na sala ambayo mtumishi wako anasali mbele zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ombi lake la kibali.” Neno la Kiebrania humaanisha ombi la dhati la rehema au kibali.
    reason: lexical_alternative
  - marker: b
    text: Au, “kilio kikubwa.” Neno la Kiebrania linaweza kumaanisha kilio chenye sauti kubwa; hapa yaelekea ni kilio cha kuomba msaada katika sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Hata hivyo, uelekee
  rationale: Kitenzi פנה kimsingi humaanisha kugeuka au kuelekea upande fulani; hapa ni ombi kwa Mungu aielekee sala kwa kuisikiliza kwa kibali. ‘Hata hivyo’ huonyesha ombi linalofuata kauli zilizotangulia.
- source_word: תְּפִלַּת
  choice: sala
  rationale: Ni tafsiri ya kawaida na ya asili ya תפלה, huku ikitofautishwa na תחנה.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika lugha ya kifalme ya mtu anayemwomba Mungu, ‘mtumishi’ ni tafsiri ya kawaida na yenye heshima ya עבד.
- source_word: תְּחִנָּתוֹ
  choice: ombi lake la rehema
  rationale: תחנה ni ombi la dhati la kupewa kibali au rehema; ‘ombi la rehema’ huwasilisha maana hiyo wazi katika Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Huu ni muundo wa umilikaji wa moja kwa moja katika usemi wa kumwita Mungu.
- source_word: לִשְׁמֹעַ
  choice: ili usikie
  rationale: Kitenzi-jina hiki kinaonyesha kusudi la kumwelekea mwombaji; Kiswahili cha ‘ili usikie’ huonyesha uhusiano huo kwa kawaida.
- source_word: הָרִנָּה
  choice: kilio
  rationale: רנה inaweza kuwa kilio chenye sauti kubwa, na katika muktadha huu wa sala inaelekea kuwa kilio cha kuomba msaada.
- source_word: הַתְּפִלָּה
  choice: sala
  rationale: Kurudia ‘sala’ kunadumisha marudio na usambamba wa Kiebrania.
- source_word: מִתְפַּלֵּל
  choice: anasali
  rationale: Kauli ya wakati unaoendelea inaonyesha kitendo cha sala kinachoendelea wakati huo; ‘anasali’ ni ya asili katika Kiswahili.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Ni nahau ya kawaida inayomaanisha mbele ya Mungu au katika uwepo wake.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kuliwakilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ombi umefanywa wa asili kwa kutumia hali ya kutaka ‘uelekee’ na ‘usikie,’ huku taswira ya Mungu kuielekea sala, marudio ya ‘sala,’ na tofauti kati ya sala, ombi la rehema, na kilio zikihifadhiwa.
