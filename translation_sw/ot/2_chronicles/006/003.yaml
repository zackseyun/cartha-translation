  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu mtiririko wa Kiebrania: mfalme aligeuka, akalibariki kusanyiko lote la Israeli, na kusanyiko hilo lilikuwa limesimama. Marudio ya “kusanyiko lote la Israeli” yamehifadhiwa, na “huku” huwasilisha kwa usahihi kishazi cha hali kinachoambatana na tendo kuu.'
