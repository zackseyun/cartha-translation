base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/003.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: sw
  text: Kisha mfalme akageuka, akalibariki kusanyiko lote la Israeli[a], huku kusanyiko lote la Israeli likiwa limesimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkutano wote wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: akageuka
  rationale: Kirai hiki kwa neno moja moja ni ‘akageuza uso wake,’ lakini hapa ni nahau inayoeleza mfalme kugeuka kimwili. ‘Akageuka’ ni Kiswahili cha kawaida na sahihi bila kuongeza mwelekeo ambao haukutajwa.
- source_word: וַיְבָרֶךְ
  choice: akalibariki
  rationale: Kitenzi ברך humaanisha ‘kubariki’; kiambishi ‘-li-’ kinalirejelea kusanyiko na kuweka sentensi wazi na ya asili.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: קהל ni jumuiya iliyokusanyika. ‘Kusanyiko’ linafaa kwa mkutano huu wa hadhara na wa ibada, na ‘lote’ linawakilisha כָּל.
- source_word: עוֹמֵד
  choice: likiwa limesimama
  rationale: Umbo la participle linaonyesha hali iliyokuwa ikiendelea wakati mfalme alipobariki watu; ‘likiwa limesimama’ linaonyesha hali hiyo kwa Kiswahili cha asili.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: huku kusanyiko lote la Israeli likiwa limesimama
  rationale: Ingawa וְ ni ‘na,’ kishazi hiki kina kazi ya kueleza hali iliyokuwapo wakati wa tendo kuu. ‘Huku’ linaonyesha uhusiano huo bila kuondoa marudio yaliyomo katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘kusanyiko lote la Israeli’ yamehifadhiwa kwa kuwa yapo katika Kiebrania; nahau ya kugeuza uso imetafsiriwa kwa ufasaha kama ‘akageuka.’
