  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: sw
  text: Mtu akimkosea mwenzake, naye akawekewa kiapo[a] ili aapishwe, kisha akaja na kiapo hicho mbele ya madhabahu yako katika nyumba hii,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwekewa kiapo cha laana.” Neno la Kiebrania linaweza kumaanisha kiapo kinachoambatana na laana ikiwa kiapo hicho kitavunjwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא אִישׁ לְרֵעֵהוּ
  choice: Mtu akimkosea mwenzake
  rationale: Muundo huu unaonyesha sharti na kosa dhidi ya mtu mwingine. ‘Kumkosea’ huhifadhi uzito wa kimaadili wa חטא na ni Kiswahili cha kawaida katika uhusiano kati ya watu.
- source_word: וְנָשָׁא בוֹ אָלָה
  choice: naye akawekewa kiapo
  rationale: Kauli tendwa isiyotaja mtendaji inafaa kwa nahau ya Kiebrania ya kumwekea mtu wajibu wa kiapo katika mazingira ya hukumu.
- source_word: לְהַאֲלֹתוֹ
  choice: ili aapishwe
  rationale: Huhifadhi maana ya kisababishi ya kumfanya mtu aape bila kulazimisha kumtaja anayemwapisha.
- source_word: וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ
  choice: kisha akaja na kiapo hicho mbele ya madhabahu yako
  rationale: Kiswahili hiki cha kawaida kinaonyesha kwamba mtu anafika mbele ya madhabahu akiwa chini ya kiapo hicho, huku kikihifadhi kiapo kama sehemu dhahiri ya tendo.
- source_word: בַּבַּיִת הַזֶּה
  choice: katika nyumba hii
  rationale: ‘Nyumba’ inafuata neno la Kiebrania moja kwa moja na kuhifadhi namna hekalu linavyoitwa nyumba ya Mungu katika muktadha huu.
theological_decisions:
- issue: Maana ya kisheria ya אָלָה
  choice: kiapo katika matini kuu, huku wazo la laana inayoambatana nacho likielezwa katika tanbihi
  alternative: laana; kiapo cha laana
  rationale: Katika muktadha huu אָלָה ni kiapo cha kisheria kinachoweza kuambatana na laana iwapo aliyeapa atasema uongo. ‘Kiapo’ huweka wazi tendo la kuapishwa, na tanbihi huhifadhi maana ya adhabu ya laana bila kuondoa utata halisi wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mwenzake,’ ‘akawekewa kiapo,’ na ‘aapishwe’ ni maneno ya sasa yenye kufaa mazingira ya kisheria na kidini. Sentensi imeachwa na koma kwa kuwa mstari unaendelea katika aya inayofuata.
