source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: sw
  text: basi usikie kutoka mbinguni, kutoka makao yako, na utende sawasawa na yote ambayo mgeni atakuomba, ili mataifa yote ya dunia wayajue jina lako na wakuogope, kama watu wako Israeli wanavyokuogopa, na wajue kwamba jina lako limeitwa juu ya nyumba hii niliyoijenga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye ufafanuzi zaidi, “nyumba hii inabeba jina lako.” Nahau ya Kiebrania kihalisi ni “jina lako limeitwa juu ya nyumba hii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: usikie
  rationale: Katika muktadha wa sala, kitenzi hiki kinamaanisha kusikia kwa makini na kwa nia ya kuitikia; “usikie” ni cha kawaida na kinaacha tendo linalofuata lieleze mwitikio.
- source_word: מִן הַשָּׁמַיִם מִמְּכוֹן שִׁבְתֶּךָ
  choice: kutoka mbinguni, kutoka mahali unapoishi
  rationale: Huhifadhi marudio ya vihusishi na kutofautisha mbingu, makao ya Mungu, na nyumba iliyojengwa duniani.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: na utende yote ambayo ... atakuomba
  rationale: “Utende” hudumisha upana wa עשה, huku “atakuomba” ikiwasilisha kwa Kiswahili cha kawaida wazo la kumwita Mungu katika ombi.
- source_word: הַנָּכְרִי
  choice: huyo mgeni
  rationale: Katika muktadha huu ni mtu asiye Mwisraeli. “Mgeni” ni neno la kawaida la Kiswahili; kiashiria “huyo” kinaonyesha mtu aliyetajwa katika muktadha unaotangulia.
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: watu wote wa dunia
  rationale: “Dunia” inafaa kwa upeo wa ulimwengu wote; “watu” hapa ni jamii mbalimbali, si tu watu binafsi.
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: na wakuogope
  rationale: Huhifadhi nguvu ya lugha ya kumcha Mungu, ambayo hujumuisha hofu yenye heshima bila kuipunguza kuwa heshima pekee.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: kwamba nyumba hii ... inaitwa kwa jina lako
  rationale: Ni Kiswahili cha kawaida kinachohifadhi nahau ya Kiebrania ya jina kuitwa juu ya nyumba, bila kuibana iwe umiliki au uwepo pekee.
theological_decisions:
- issue: Lugha ya makao ya Mungu na hekalu
  choice: Kudumisha “kutoka mbinguni, kutoka mahali unapoishi” pamoja na “nyumba hii”
  alternative: Kufafanua kuwa “kutoka katika uwepo wako wa mbinguni”
  rationale: Andiko lenyewe linatofautisha makao ya Mungu mbinguni na nyumba duniani inayohusishwa na jina lake; tafsiri ya karibu haiashirii kwamba Mungu amefungiwa hekaluni.
- issue: Maana ya kumwogopa Mungu
  choice: “wakuogope”
  alternative: “wakuheshimu sana” au “wakuchaji”
  rationale: “Wakuogope” huhifadhi uzito na mvutano wa ירא, huku muktadha ukionyesha kuwa ni hofu ya kidini yenye heshima.
- issue: Nahau ya jina la Mungu kuitwa juu ya nyumba
  choice: “nyumba hii ... inaitwa kwa jina lako”
  alternative: “nyumba hii inalibeba jina lako”
  rationale: Chaguo kuu linabaki karibu na nahau ya chanzo; mbadala wa kufasiri zaidi umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. “Mbinguni” na “mahali unapoishi” ni vya kawaida; “utende” hudumisha upana wa kitenzi cha chanzo. Muundo umepangwa kwa sentensi moja ili kuhifadhi mtiririko wa sala.
