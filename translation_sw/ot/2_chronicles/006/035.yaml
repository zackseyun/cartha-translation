  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: sw
  text: basi usikie kutoka mbinguni sala yao na dua yao, na uwatendee haki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uitetee haki yao,” au “utekeleze hukumu yao.” Kiebrania kinasema kihalisi, “ufanye haki/hukumu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: basi usikie
  rationale: Katika sala hii, kitenzi hiki kina nguvu ya ombi linaloelekezwa kwa Mungu. “Basi” linaonyesha mwendelezo wa masharti yaliyotangulia.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, katika fomula hii ya sala humaanisha makao ya Mungu na hutafsiriwa kwa kawaida “mbinguni.”
- source_word: תְּפִלָּתָם
  choice: sala yao
  rationale: Ni neno la kawaida la sala; umoja wenye kiambishi cha wingi unaeleweka kwa maana ya pamoja.
- source_word: תְּחִנָּתָם
  choice: ombi lao la kuomba fadhili
  rationale: Neno hili huonyesha ombi la dhati la kupata neema au fadhili; tafsiri hii inahifadhi maana hiyo kwa Kiswahili kinachoeleweka.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: na uwatendee haki
  rationale: Kirai hiki ni halisi “ufanye hukumu/haki yao,” yaani Mungu achukue hatua ya kimahakama kwa niaba yao. “Uwatendee haki” ni ya asili katika Kiswahili na huhifadhi wazo la kuwatetea au kuwapatia haki.
theological_decisions:
- issue: Jibu la Mungu kwa sala linaloelezwa kwa lugha ya kimahakama
  choice: uwatendee haki
  alternative: uitetee haki yao; utekeleze hukumu yao
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, haki, dai la kisheria, au shauri. Tafsiri iliyochaguliwa haiondoi upana huo kabisa, bali inaonyesha kwamba Mungu anaombwa atende kwa haki kwa niaba yao bila kuingiza fundisho maalumu la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ombi “usikie ... uwatendee” unafaa kwa sala, huku “basi” likiunganisha mstari huu na hali iliyotajwa kabla.
