  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: sw
  text: Tena, kuhusu mgeni ambaye si wa watu wako Israeli, bali anakuja kutoka nchi ya mbali kwa sababu ya jina lako kuu, mkono wako wenye nguvu, na mkono wako ulionyoshwa—na watakapokuja[a] na kusali kuelekea nyumba hii[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hubadilika hapa kutoka umoja (“mgeni ... anakuja”) kwenda wingi (“wanakuja na kusali”), labda kwa sababu mgeni mmoja ametumiwa kuwakilisha wageni kwa jumla.
    reason: alternative_reading
  - marker: b
    text: Kihusishi cha Kiebrania kinaweza kutafsiriwa kihalisi “kwenda nyumba hii”; katika muktadha wa sala hii, kina maana ya kusali kuelekea nyumba hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: mgeni
  rationale: Katika muktadha huu, neno hili humaanisha mtu wa taifa jingine, asiye Mwisraeli. “Mgeni” ni neno la kawaida na lenye heshima katika Kiswahili; kishazi kinachofuata kinaondoa uwezekano wa kulielewa kama mtu asiyejulikana tu.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: ambaye si wa watu wako Israeli
  rationale: Huhifadhi wazi tofauti kati ya huyo mgeni na Israeli, wanaotajwa kuwa watu wa Mungu, kwa lugha ya kawaida ya Kiswahili.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: bali anakuja kutoka nchi ya mbali
  rationale: 'Kiunganishi kimetafsiriwa kwa maana ya utofautishaji baada ya kishazi hasi: huyo si wa Israeli, bali anatoka mbali. Wakati wa sasa wa jumla unafaa kwa kisa kinachowakilisha hali inayoweza kutokea.'
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: kwa sababu ya jina lako kuu
  rationale: Hapa לְמַעַן inaonyesha sababu au kichocheo cha kuja kwa mgeni. “Jina lako kuu” huhifadhi nahau ya Biblia kuhusu sifa na utambulisho wa Mungu.
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: mkono wako wenye nguvu
  rationale: Huhifadhi taswira halisi ya Kiebrania kuhusu matendo yenye nguvu ya Mungu badala ya kuibadili kuwa wazo dhahania.
- source_word: וּזְרוֹעֲךָ הַנְּטוּיָה
  choice: mkono wako ulionyoshwa
  rationale: Kiswahili kwa kawaida hutumia “mkono” kwa mkono au sehemu yake yote; usemi huu unahifadhi taswira ya nguvu za Mungu zinazotenda.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: nao watakapokuja na kusali
  rationale: Muundo wa wakati wenye “-kapo-” unaeleza vizuri hali inayotarajiwa katika ombi hili, huku “nao” ikihifadhi badiliko la Kiebrania kutoka umoja kwenda wingi.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: kuelekea nyumba hii
  rationale: Katika sala hii, אֶל ina maana ya mwelekeo wa sala. “Nyumba” huhifadhi neno la Kiebrania na maana yake ya kidini bila kulibadili moja kwa moja kuwa “hekalu.”
theological_decisions:
- issue: Badiliko kutoka umoja “mgeni ... anakuja” kwenda vitenzi vya wingi
  choice: Kuhifadhi badiliko hilo kwa “mgeni ... anakuja ... nao watakapokuja” na kulieleza katika tanbihi
  alternative: 'Kusawazisha sentensi yote iwe umoja: “atakapokuja na kusali”; au wingi: “wageni ... watakapokuja”'
  rationale: Kiebrania chenyewe hubadilika kutoka umoja kwenda wingi, huenda kikimtumia mgeni mmoja kama mfano unaowakilisha wageni kwa jumla. Tafsiri haipaswi kulifuta badiliko hilo kimya kimya.
- issue: Lugha inayomwelezea Mungu kwa taswira ya mwili
  choice: Kuhifadhi “mkono wako wenye nguvu, na mkono wako ulionyoshwa”
  alternative: Kufupisha kuwa “nguvu zako kuu”
  rationale: Taswira halisi ni sehemu ya lugha ya agano na ya ukombozi inayotumiwa kuhusu matendo ya Mungu; kuifanya dhahania kungepunguza uzito huo wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeachwa ikiendelea kwa koma kwa sababu wazo na ombi vinakamilishwa katika mstari unaofuata. Taswira za “jina,” “mkono wenye nguvu,” na “mkono ulionyoshwa” zimehifadhiwa.
