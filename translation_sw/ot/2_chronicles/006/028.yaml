source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: sw
  text: Ikiwa kutakuwa na njaa nchini, au tauni, au mazao kunyauka, au kugeuka manjano, au nzige, au wadudu waharibifu[a]; ikiwa adui zake wakimzingira katika nchi ya miji yake[b]; pigo lolote au ugonjwa wowote—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “wadudu waharibifu” linamaanisha mdudu anayeteketeza mazao; spishi yake kamili haijulikani, na huenda likamaanisha aina ya nzige.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “katika nchi ya malango yake.” Hapa “malango” yanawakilisha miji au miji midogo ya nchi.
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: njaa
  rationale: Katika orodha ya majanga, neno hili linamaanisha njaa kubwa inayoikumba nchi, si hisia ya kawaida ya kuwa na njaa.
- source_word: דֶּבֶר
  choice: tauni
  rationale: Neno hili hurejelea ugonjwa mkali wa kuambukiza unaoenea kwa watu wengi; “tauni” ni neno la Kiswahili linalofaa katika orodha hii ya majanga.
- source_word: שִׁדָּפוֹן
  choice: mimea kunyauka
  rationale: Neno hili linaeleza uharibifu wa mazao, mara nyingi kutokana na upepo mkavu au joto; tafsiri hii inaeleweka kwa urahisi bila kulazimisha kisababishi mahsusi.
- source_word: יֵרָקוֹן
  choice: kugeuka manjano
  rationale: Neno hili huonyesha kupauka au kugeuka manjano kwa mimea kutokana na ugonjwa; tafsiri inaweka wazi athari yake kwa mazao.
- source_word: אַרְבֶּה
  choice: nzige
  rationale: Katika muktadha wa uharibifu wa mazao, neno hili linamaanisha nzige wanaovamia kwa makundi.
- source_word: חָסִיל
  choice: wadudu waharibifu
  rationale: Utambulisho kamili wa mdudu huyu haujulikani; usemi mpana unaweka maana yake ya mdudu anayeteketeza mazao bila kudai spishi fulani.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: ikiwa adui zake watauzingira
  rationale: Kitenzi kina maana ya kumbana au kumzingira; katika muktadha huu wa kijeshi, “watauzingira” ni ya asili na sahihi.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: mji wowote nchini
  rationale: Kwa tafsiri ya maana, “malango” yanawakilisha miji yenye malango ndani ya nchi; usemi huu unawasilisha maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi taswira halisi.
- source_word: כָּל נֶגַע
  choice: pigo lolote
  rationale: נֶגַע ni neno pana kwa pigo au taabu nzito; “pigo” huhifadhi upana wake na kuliepuka kulirudia neno “tauni.”
- source_word: כָל מַחֲלָה
  choice: ugonjwa wowote
  rationale: Neno hili humaanisha ugonjwa kwa ujumla, na tafsiri hii ni ya kawaida na wazi.
