translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Orodha ya majanga imewasilishwa kwa urari wa kishairi; istilahi zisizo na utambulisho wa hakika zimeachwa kwa upana unaofaa, na mstari unaendelea kwa alama ya kistari kama katika muktadha wa sala.
