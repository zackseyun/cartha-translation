  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: sw
  text: Ikiwa watu wako watatoka kwenda vitani kupigana na adui zao kwa njia utakayowatuma, nao wakisali kwako wakielekea mji huu uliouchagua na nyumba niliyoijenga kwa ajili ya jina lako,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba” hapa ni hekalu ambalo Sulemani alilijenga kwa ajili ya jina la BWANA.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ikiwa
  rationale: Katika muktadha huu neno hili linaanzisha hali ya sharti katika sala ya Sulemani; “ikiwa” linaonyesha wazi muundo huo.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: watu wako watatoka kwenda vitani
  rationale: Huhifadhi maana ya msingi ya יצא, “kutoka,” pamoja na usemi wa kijeshi “kwenda vitani,” kwa Kiswahili cha kawaida.
- source_word: עַל אֹיְבָיו
  choice: kupigana na adui zao
  rationale: Ingawa kiambishi cha Kiebrania ni cha umoja kwa kupatana na nomino ya mkusanyiko “watu,” Kiswahili kwa kawaida hutumia wingi “zao.” Kitenzi “kupigana” kinaweka wazi uhusiano wa kijeshi unaoonyeshwa na עַל katika muktadha huu.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: kwa njia utakayowatuma
  rationale: “Njia” huhifadhi taswira halisi ya דרך, huku “utakayowatuma” ikihifadhi wazo la Mungu kuwaagiza na kuwaelekeza.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: nao wakakuomba
  rationale: Kitenzi התפלל pamoja na אֶל humaanisha kuelekeza sala kwa Mungu. “Kukuomba” ni usemi wa asili na wenye heshima katika Kiswahili.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: wakielekea upande wa mji huu
  rationale: דרך hapa inaonyesha mwelekeo wa kimahali wakati wa kusali. “Wakielekea upande wa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: uliouchagua
  rationale: Hurejelea moja kwa moja tendo la Mungu la kuuchagua mji huo bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִיתִי
  choice: na nyumba niliyoijenga
  rationale: “Nyumba” huhifadhi בית ya Kiebrania na maana yake ya kitheolojia, badala ya kubadilisha neno lenyewe kuwa “hekalu”; tanbihi hufafanua rejeo lake la kihistoria.
- source_word: לִשְׁמֶךָ
  choice: kwa ajili ya jina lako
  rationale: Huu ni usemi wa kawaida na ulio wazi wa kuonyesha kwamba nyumba hiyo iliwekwa wakfu kwa jina la Mungu, bila kufafanua kupita kiasi maana ya “jina.”
theological_decisions:
- issue: Sala kuelekezwa upande wa Yerusalemu na nyumba ya Mungu
  choice: 'Imehifadhiwa kama mwelekeo halisi wa kimahali: “wakielekea upande wa mji huu ... na nyumba.”'
  alternative: Kufasiri kwa maana ya jumla kuwa waliomba tu kwa kuurejelea mji na hekalu, bila mwelekeo wa kimwili.
  rationale: Kiebrania kinatumia lugha halisi ya דרך, “njia/mwelekeo,” katika teolojia ya sala ya Sulemani kuhusu mji na nyumba iliyochaguliwa. Tafsiri haiifanyi kuwa ya kiroho tu wala kuingiza hitimisho la baadaye la kimadhehebu.
- issue: Maana ya “nyumba”
  choice: Neno “nyumba” limehifadhiwa katika matini na kutambulishwa kuwa hekalu katika tanbihi.
  alternative: Kutafsiri בית moja kwa moja kuwa “hekalu.”
  rationale: “Nyumba” ni sawa na neno la chanzo na huhifadhi usemi “nyumba kwa ajili ya jina lako,” ilhali tanbihi hutoa ufafanuzi wa kihistoria unaohitajika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa sharti wa sala na mwelekeo halisi wa kuomba kuelekea mji na nyumba, huku ikitumia miundo ya kawaida kama “kwenda vitani,” “wakakuomba,” na “kwa ajili ya jina lako.”
