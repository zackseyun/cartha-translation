  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: sw
  text: Akaifunika nyumba[a] kwa mawe ya thamani ili kuipamba; nayo dhahabu ilikuwa dhahabu ya Parvaimu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu” badala ya “nyumba”; Kiebrania kinasema kihalisi “nyumba,” jina linalotumiwa mara nyingi kumaanisha hekalu katika Mambo ya Nyakati.
    reason: lexical_alternative
  - marker: b
    text: Parvaimu ni jina la mahali ambalo utambulisho wake haujulikani kwa hakika; kirai hiki kinaweza kumaanisha “dhahabu kutoka Parvaimu” au “dhahabu ya Parvaimu.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: Akaipamba
  rationale: Katika muktadha huu kitenzi kinaeleza kuipamba au kuifunika jengo kwa mawe ya thamani. ‘Akaipamba ... kwa’ ni Kiswahili cha kawaida kinachoonyesha matumizi ya mawe hayo kama mapambo bila kudokeza kwamba nyumba yote ilifunikwa kikamilifu.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Huhifadhi neno halisi la Kiebrania; katika Mambo ya Nyakati ‘nyumba’ hutumiwa kwa hekalu, jambo linalofafanuliwa katika tanbihi.
- source_word: אֶבֶן יְקָרָה
  choice: mawe ya thamani
  rationale: Nomino ya umoja ina maana ya kijumla hapa, hivyo wingi ni wa kawaida katika Kiswahili kwa vifaa vya mapambo.
- source_word: לְתִפְאָרֶת
  choice: ili iwe na fahari
  rationale: Kirai kinaonyesha kusudi la urembo au utukufu wa jengo. ‘Fahari’ huhifadhi wazo la uzuri wenye adhama bila kulifanya kuwa dai mahususi la kitheolojia.
- source_word: וְהַזָּהָב
  choice: nayo dhahabu
  rationale: ‘Nayo’ huonyesha mgeuko wa sentensi kuelekea kubainisha aina au asili ya dhahabu.
- source_word: זְהַב פַּרְוָיִם
  choice: dhahabu ya Parvaimu
  rationale: Muundo wa Kiebrania unaweza kuonyesha asili au uhusiano. ‘Dhahabu ya Parvaimu’ ni wa asili katika Kiswahili na unaacha kiwango fulani cha utata kuhusu mahali penyewe.
