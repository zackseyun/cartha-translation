translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida, huku ‘nyumba’ na ‘dhahabu ya Parvaimu’ vikihifadhi usemi na utata wa Kiebrania.
