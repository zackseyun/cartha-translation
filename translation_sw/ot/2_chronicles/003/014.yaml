base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: sw
  text: Akafanya pazia[a] la samawati, zambarau, nyekundu iliyokolea[b], na kitani nzuri; akalipamba kwa maumbo ya makerubi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitara.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nyekundu angavu.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “akawapandisha makerubi juu yake,” yaani, akalipamba kwa maumbo ya makerubi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: pazia
  rationale: Neno hili linamaanisha pazia la ndani lililotenganisha sehemu za patakatifu; “pazia” ni Kiswahili cha kawaida na kinachoeleweka vizuri.
- source_word: תְּכֵלֶת
  choice: nyuzi za rangi ya samawati
  rationale: Neno hilo linataja kitu kilichotiwa rangi ya samawati au samawati-zambarau katika vitambaa vya ibada; “nyuzi” inafaa katika orodha ya malighafi ya kutengeneza pazia.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Hii ndiyo tafsiri ya kawaida ya nyenzo yenye rangi ya zambarau yenye thamani kubwa.
- source_word: כַרְמִיל
  choice: nyekundu iliyokolea
  rationale: Neno linamaanisha nyenzo yenye rangi nyekundu iliyotiwa rangi; uchaguzi huu unaonyesha ukolezi wa rangi bila kulazimisha kivuli mahususi kabisa.
- source_word: בּוּץ
  choice: kitani safi
  rationale: בּוּץ ni kitani bora na laini, si kitani kwa ujumla; “kitani safi” ni usemi wa kibiblia unaoeleweka katika Kiswahili.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: akalipamba kwa maumbo ya makerubi
  rationale: Kwa maana halisi ni “akawapandisha makerubi juu yake,” lakini katika muktadha ni kuweka maumbo ya makerubi kwenye pazia. Tafsiri hii ni ya asili na haibainishi bila msingi kama yalifumwa au yalitariziwa.
- source_word: כְּרוּבִים
  choice: makerubi
  rationale: “Makerubi” huhifadhi istilahi ya kawaida ya kibiblia inayohusishwa na patakatifu na hekalu.
