source:
  edition: WLC
  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: sw
  text: Akasimamisha zile nguzo mbele ya ukumbi wa hekalu[a], moja upande wa kulia na nyingine upande wa kushoto. Akaiita ile ya kulia Yakini, na ile ya kushoto Boazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukumbi mkuu wa hekalu.” Neno la Kiebrania heikhal hapa linamaanisha ukumbi mkuu wa jengo la hekalu, si lazima eneo lote la hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Akasimamisha
  rationale: Hifili ya קום hapa ina maana ya kusababisha nguzo zisimame mahali pake; ‘akasimamisha’ ni ya kawaida na inafaa katika muktadha wa ujenzi.
- source_word: הָעַמּוּדִים
  choice: zile nguzo
  rationale: עַמּוּדִים ni nguzo za jengo; ‘nguzo’ ni neno la kawaida na linaloeleweka katika Kiswahili cha usanifu wa hekalu.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: mbele ya ukumbi wa hekalu
  rationale: הֵיכָל hapa ni ukumbi mkuu wa jengo la hekalu, si lazima eneo lote la hekalu; tafsiri hii pia huhifadhi maana ya mahali ya עַל־פְּנֵי.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: moja upande wa kulia na nyingine upande wa kushoto
  rationale: Huhifadhi maelekezo ya kawaida ya kulia na kushoto bila kuyabadilisha kuwa pande za dira ambazo hazikutajwa wazi katika Kiebrania.
- source_word: וַיִּקְרָא שֵׁם
  choice: Akaiita
  rationale: Hii ni tafsiri ya asili ya nahau ya Kiebrania ya kuita jina, na huruhusu muundo mfupi, wazi na wenye urari katika Kiswahili.
- source_word: הַיְמִינִי
  choice: ile ya kulia
  rationale: Hutoa maana ya kitu kilicho upande wa kulia na kurejelea nguzo kwa njia ya kawaida.
- source_word: יָכִין
  choice: Yakini
  rationale: Jina limenukuliwa kwa tahajia inayolingana na mfumo wa sauti wa Kiswahili na matumizi yaliyozoeleka katika Biblia za Kiswahili.
- source_word: הַשְּׂמָאלִי
  choice: ile ya kushoto
  rationale: Ni usemi wazi na sambamba na ‘ile ya kulia.’
- source_word: בֹּעַז
  choice: Boazi
  rationale: Jina limenukuliwa kwa umbo lililozoeleka katika mapokeo ya Biblia za Kiswahili.
