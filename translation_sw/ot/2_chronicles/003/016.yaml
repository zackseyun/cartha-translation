base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: sw
  text: Akatengeneza minyororo[b] katika patakatifu pa ndani[a], akaiweka juu ya vilele vya nguzo; pia akatengeneza mapambo mia moja ya umbo la makomamanga, akayaweka kwenye minyororo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika chumba cha ndani”; kwa mapokeo, “katika Patakatifu Zaidi.” Neno la Kiebrania humaanisha patakatifu pa ndani pa hekalu, ingawa wengine hulielewa hapa kwa upana zaidi kuhusiana na kazi ya mapambo.
    reason: alternative_reading
  - marker: b
    text: Au “kazi ya minyororo” au “taji za maua,” zikirejelea mapambo ya aina ya minyororo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: minyororo
  rationale: Neno hili linaonyesha mapambo yaliyofanana na minyororo. “Minyororo” huhifadhi maana halisi na linafaa pia linaporudiwa mwishoni mwa mstari; tanbihi inaonyesha uwezekano wa kuelewa kama kazi ya mapambo ya minyororo.
- source_word: בַּדְּבִיר
  choice: katika patakatifu pa ndani
  rationale: דְּבִיר kwa kawaida ni sehemu takatifu ya ndani ya hekalu. Tafsiri hii ni wazi, yenye heshima, na haifungi kifungu kwa jina la kimapokeo pekee.
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: juu ya nguzo
  rationale: Ingawa Kiebrania kinasema kihalisi “vichwa vya nguzo,” Kiswahili cha kawaida hutumia “juu ya nguzo” kueleza mahali hapo kwa ufasaha.
- source_word: רִמּוֹנִים
  choice: mapambo ... yenye umbo la makomamanga
  rationale: Katika muktadha wa mapambo ya hekalu, neno linamaanisha maumbo ya tunda la komamanga, si matunda halisi. Ufafanuzi huu huzuia utata usiohitajika.
- source_word: מֵאָה
  choice: mia moja
  rationale: Idadi imetafsiriwa moja kwa moja kwa Kiswahili sanifu.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: akayaweka kwenye minyororo
  rationale: Kiambishi בְּ hapa kinaeleweka kwa kawaida kuwa kinaonyesha kuambatanishwa na minyororo, huku “kwenye” kikiacha nafasi kwa wazo la kuunganishwa ndani ya mpangilio wa mapambo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. Muundo wa simulizi umehifadhiwa, huku “mapambo yenye umbo la makomamanga” ukifafanua kazi ya usanifu bila kupoteza taswira ya asili.
