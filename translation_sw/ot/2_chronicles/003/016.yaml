  source_fidelity: 'Tafsiri inafuata kwa jumla mpangilio na maudhui ya Kiebrania: minyororo, patakatifu pa ndani, vilele vya nguzo, makomamanga mia moja, na kuyaweka kwenye minyororo. Hata hivyo, tanbihi b imechanganya dondoo la mahali pa kuweka minyororo na mbadala wa maana ya שַׁרְשְׁרוֹת, na alama yake imefungwa kwenye “nguzo” badala ya “minyororo.”'
  naturalness: Kiswahili ni cha kawaida na cha heshima. “Juu ya vilele vya nguzo” ni sahihi zaidi kuliko “juu ya nguzo,” kwa kuwa huhifadhi bayana רֹאשׁ (“vilele/vichwa”).
