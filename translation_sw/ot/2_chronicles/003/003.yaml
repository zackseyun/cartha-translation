base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: sw
  text: 'Haya ndiyo misingi[a] ambayo Sulemani aliweka kwa ajili ya kujenga nyumba ya Mungu: urefu wake, kwa kipimo cha zamani, ulikuwa dhiraa sitini,[b] na upana wake dhiraa ishirini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huu ndio msingi ambao Sulemani aliweka kwa ajili ya kujenga nyumba ya Mungu.” Neno la Kiebrania linalotafsiriwa “misingi” au “msingi” lina ugumu fulani hapa; linaweza pia kueleweka kwa maana ya mpango au msingi wa ujenzi.
    reason: lexical_alternative
  - marker: b
    text: “Kwa kipimo cha zamani” huenda kunamaanisha kiwango cha zamani cha dhiraa.
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  choice: misingi ambayo Sulemani aliweka
  rationale: Kitenzi hiki cha mzizi יסד kina ugumu fulani katika muktadha huu. Tafsiri hii inadumisha wazo la kuweka msingi huku ikitambulisha vipimo vinavyofuata kwa Kiswahili cha kawaida.
- source_word: לִבְנוֹת
  choice: ili kujenga
  rationale: Kiambishi ל pamoja na kitenzi-jina kinaonyesha kusudi; “ili kujenga” ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii inafuata kwa karibu nahau ya Kiebrania bila kuibadili moja kwa moja kuwa “hekalu,” ingawa hapa nyumba hiyo ni hekalu.
- source_word: הָאֹרֶךְ
  choice: urefu wake
  rationale: Ni istilahi ya kawaida ya vipimo; “wake” huifanya sentensi ya Kiswahili iwe wazi na ya asili.
- source_word: אַמּוֹת
  choice: dhiraa
  rationale: Kitengo cha kale kinadumishwa badala ya kugeuzwa kuwa kipimo cha kisasa.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: kwa kipimo cha zamani
  rationale: Hii inaeleza kiwango cha kipimo bila kuamua kwa uhakika kwamba kilikuwa aina maalumu ya dhiraa.
- source_word: שִׁשִּׁים
  choice: sitini
  rationale: Namba ya urefu wa nyumba.
- source_word: וְרֹחַב
  choice: na upana wake
  rationale: “Wake” huleta ulinganifu wa asili na “urefu wake” katika Kiswahili.
- source_word: עֶשְׂרִים
  choice: ishirini
  rationale: Namba ya upana wa nyumba.
