- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: akawafunika kwa dhahabu
  rationale: Kitenzi צפה katika muktadha huu humaanisha kufunika kitu kwa tabaka la metali; tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili.
