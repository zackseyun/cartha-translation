  rationale: Huwakilisha usemi wa Kiebrania wenye maana ya sehemu takatifu kuliko zote, yaani chumba cha ndani kabisa cha hekalu, kwa istilahi ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: כְּרוּבִים שְׁנַיִם
  choice: makerubi wawili
