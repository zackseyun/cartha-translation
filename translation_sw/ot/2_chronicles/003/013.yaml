base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: sw
  text: Mabawa ya makerubi hawa yalikuwa yameenea dhiraa ishirini, nao walikuwa wamesimama kwa miguu yao, nyuso zao zikiielekea nyumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Hekalu.” Kiebrania: “nyumba,” jina lililotumiwa mara nyingi kumaanisha jengo la Hekalu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: Mabawa ya makerubi hawa
  rationale: Muundo huu unahifadhi uhusiano wa umilikaji wa Kiebrania na kiashiria 'hawa'; 'makerubi' ni istilahi ya kawaida ya Biblia katika Kiswahili.
- source_word: פֹּרְשִׂים
  choice: yalikuwa yamenyooshwa
  rationale: Kitenzi-shirikishi kinaeleza hali ya mabawa yaliyotandazwa au kunyoshwa, si lazima tendo linaloendelea wakati huo.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: kwa dhiraa ishirini
  rationale: Inahifadhi kipimo cha kale kilichotajwa moja kwa moja bila kuongeza neno la kipimo ambalo halimo wazi katika chanzo.
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: nao walisimama kwa miguu yao
  rationale: Kiwakilishi kilichosisitizwa kinaonyesha kuwa sasa maelezo yanawahusu makerubi wenyewe, na usemi huu unaeleza mkao wao wima kwa Kiswahili cha kawaida.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: nyuso zao zikielekea upande wa Hekalu
  rationale: ל־ inaonyesha mwelekeo; 'Hekalu' hutambulisha wazi jengo linalokusudiwa katika muktadha huu, huku tanbihi ikihifadhi maana halisi ya 'nyumba'.
theological_decisions:
- issue: Maana ya בַּיִת katika muktadha wa ujenzi wa hekalu
  choice: Hekalu
  alternative: nyumba
  rationale: Ingawa neno la Kiebrania kwa kawaida humaanisha 'nyumba,' hapa ni jina la kimuktadha la jengo la hekalu. Kiswahili 'Hekalu' huwasilisha rejeleo hilo kwa uwazi, na tanbihi huhifadhi usemi halisi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi; sentensi imeweka mtiririko wa maelezo ya usanifu bila kufuta hali ya kitenzi-shirikishi cha Kiebrania. Alama ya tanbihi imewekwa baada ya 'Hekalu' kwa kuwa tanbihi inahusu neno hilo.
