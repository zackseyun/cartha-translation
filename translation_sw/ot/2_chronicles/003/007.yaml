base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: sw
  text: Akaifunika nyumba[a] kwa dhahabu—boriti[b], vizingiti[c], kuta zake na milango yake—na akachonga[d] makerubi kwenye kuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu.” Kiebrania kinasema kihalisi “nyumba,” neno linalotumiwa hapa kwa jengo la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au “mihimili” au “viguzo.” Neno la Kiebrania linamaanisha mbao za kuhimili jengo bila kubainisha kwa uhakika aina yake.
    reason: lexical_alternative
  - marker: c
    text: Au “miimo ya milango” au “sehemu za chini za milango.” Maana mahususi ya neno la usanifu hapa si hakika.
    reason: lexical_alternative
  - marker: d
    text: Au “akatia nakshi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchonga au kutia nakshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: akaifunika ... kwa dhahabu
  rationale: Kitenzi hiki kinaonyesha kufunika jengo kwa tabaka la nyenzo; muundo huu wa Kiswahili unaeleza wazi kwamba dhahabu ndiyo iliyotumiwa.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Huhifadhi maana ya msingi ya Kiebrania, huku muktadha ukionyesha kwamba nyumba hiyo ni hekalu.
- source_word: הַקֹּרוֹת
  choice: mihimili
  rationale: Neno hilo linamaanisha mbao kuu za kushikilia jengo; “mihimili” ni pana na halilazimishi maana mahususi zaidi ya viguzo vya paa.
- source_word: הַסִּפִּים
  choice: vizingiti
  rationale: Hili ndilo jina la kawaida la sehemu za chini za miingilio, ingawa neno la Kiebrania linaweza kuhusisha sehemu nyingine za fremu ya mlango.
- source_word: קִירוֹתָיו
  choice: kuta zake
  rationale: Hutoa kwa kawaida wingi pamoja na kiambishi cha umilikaji kinachoirejelea nyumba.
- source_word: דַלְתוֹתָיו
  choice: milango yake
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya milango au mbao za milango.
- source_word: זָהָב
  choice: kwa dhahabu
  rationale: Kihusishi “kwa” kinaonyesha kwa Kiswahili kwamba dhahabu ndiyo nyenzo iliyotumika kufunika.
- source_word: וּפִתַּח
  choice: akachonga
  rationale: Kitenzi kinahusu kutengeneza nakshi kwa kuchonga; uchaguzi huu unafaa kwa mapambo yaliyowekwa kwenye kuta bila kuamua kwa ukali mbinu yake.
- source_word: כְּרוּבִים
  choice: makerubi
  rationale: Huhifadhi istilahi ya kibiblia ya viumbe wanaohusishwa na patakatifu badala ya kutumia maelezo ya kifasiri.
- source_word: עַל הַקִּירוֹת
  choice: kwenye kuta
  rationale: Hueleza mahali nakshi hizo zilipokuwa kwa Kiswahili cha kawaida.
