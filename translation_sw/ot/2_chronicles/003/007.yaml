translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mstari umehifadhi orodha ya sehemu za jengo, huku viambishi vichache vilivyo wazi vikisaidia mtiririko wa Kiswahili. Istilahi “makerubi” imetumiwa kwa sababu ni ya kawaida katika muktadha wa hekalu na haiongezi ufafanuzi wa kimadhehebu.
