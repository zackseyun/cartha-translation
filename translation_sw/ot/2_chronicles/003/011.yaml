base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: sw
  text: Urefu wa mabawa ya makerubi ulikuwa dhiraa ishirini. Bawa moja lilikuwa na urefu wa dhiraa tano, likifika[a] kwenye ukuta wa nyumba,[b] na bawa lingine lilikuwa na urefu wa dhiraa tano, likifika kwenye bawa la kerubi mwingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “likigusa.” Miundo ya vitenzi vya Kiebrania inaweza kusisitiza mgusano halisi, si kufika tu; maana hiyo inatumika pia kwa bawa linalofika kwenye bawa la kerubi mwingine.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa ni jengo la Hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: mabawa ya makerubi
  rationale: Muundo wa wingi umehifadhiwa. Neno “makerubi” ni umbo la kawaida la Kiswahili kwa viumbe hawa wa mbinguni; kiunganishi cha mwanzo hakikulazimishwa kwa kuwa mstari huu unasomeka kwa kawaida bila “na” ya mwanzo.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: Urefu ... ulikuwa dhiraa ishirini
  rationale: Huhifadhi nomino “urefu” na kipimo cha kale bila kukibadili kuwa kipimo cha kisasa. Mpangilio umebadilishwa kidogo ili sentensi iwe ya kawaida katika Kiswahili.
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: Bawa moja lilikuwa na urefu wa dhiraa tano
  rationale: Kiebrania kinatoa kipimo kwa ufupi bila kitenzi kamili; “lilikuwa na urefu wa” kinaweka maana hiyo wazi bila kuongeza wazo jipya.
- source_word: מַגַּעַת / מַגִּיעַ
  choice: likifika
  rationale: Kitenzi נגע hapa kinaweza kueleza kufika hadi sehemu fulani au kuigusa. “Likifika” kinafaa kwa maelezo ya jengo huku tanbihi ikihifadhi uwezekano wa mgusano halisi.
- source_word: לְקִיר הַבַּיִת
  choice: kwenye ukuta wa nyumba
  rationale: “Nyumba” hufuata maana ya msingi ya בַּיִת; katika muktadha huu ni jengo la Hekalu, jambo linalofafanuliwa katika tanbihi.
- source_word: וְהַכָּנָף הָאַחֶרֶת
  choice: na bawa lingine
  rationale: “Lingine” ni sawa ya moja kwa moja ya אַחֶרֶת na huepuka kutafsiri kwa kubana maana kuwa “la pili.”
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: kwenye bawa la kerubi mwingine
  rationale: Umoja wa “kerubi” na maana ya “mwingine” vimehifadhiwa, sambamba na Kiebrania.
