  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unadumisha urudiaji wa kitenzi חפה na pia kutotajwa wazi katika Kiebrania kwamba mitende na minyororo ilikuwa nakshi, huku maelezo ya chini yakifafanua uwezekano huo.
