base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: sw
  text: Aliifunika nyumba kubwa kwa mbao za mberoshi[a], akaifunika kwa dhahabu bora, na akaweka juu yake mitende na minyororo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho wa aina ya mti unaoitwa בְּרוֹשׁ katika Kiebrania unabishaniwa. Huenda ulikuwa mberoshi; pia mreteni au msonobari hupendekezwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi, “mitende na minyororo”; huenda haya yalikuwa maumbo au nakshi za mapambo zilizowekwa kwenye chumba.
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: nyumba kubwa
  rationale: Hutafsiri maana ya msingi ya ‘nyumba’ na ‘kubwa,’ huku ikihifadhi nahau ya usanifu inayolitaja jengo au chumba kikuu cha Hekalu.
- source_word: חִפָּה עֵץ בְּרוֹשִׁים
  choice: aliifunika ... kwa mbao za msunobari
  rationale: Kitenzi חפה humaanisha kufunika; katika muktadha huu mbao zilitumiwa kufunika sehemu ya jengo. ‘Msunobari’ ni tafsiri ya kawaida, ingawa utambulisho kamili wa aina ya mti haujulikani.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: akaifunika kwa dhahabu bora
  rationale: Inahifadhi kurudiwa kwa kitenzi ‘kufunika’ katika Kiebrania. ‘Dhahabu bora’ huwasilisha kwa kawaida maana halisi ya ‘dhahabu nzuri/ya hali ya juu’ bila kudai moja kwa moja kwamba ilikuwa dhahabu safi.
- source_word: וַיַּעַל עָלָיו
  choice: na kuweka juu yake
  rationale: Hapa muundo wa kisababishi wa עלה una maana ya kuweka au kuambatisha vitu kwenye uso; kauli hii ni ya kawaida na inaacha aina kamili ya uambatishaji wazi.
- source_word: תִּמֹרִים
  choice: mitende
  rationale: Neno lenyewe hutaja mitende, ingawa katika muktadha huu huenda lilimaanisha maumbo ya mapambo ya mitende; tafsiri ya moja kwa moja imehifadhiwa katika matini.
- source_word: שַׁרְשְׁרוֹת
  choice: minyororo
  rationale: Ni tafsiri ya moja kwa moja ya neno linaloweza kutaja minyororo au mapambo yenye umbo la minyororo.
