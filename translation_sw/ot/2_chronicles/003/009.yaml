base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/009.yaml
  text: And the weight of the nails was fifty shekels of gold[a], and he overlaid the upper rooms with gold.
translation:
  language: sw
  text: Na uzito wa misumari ulikuwa shekeli hamsini za dhahabu, naye akavifunika vyumba vya juu[a] kwa dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyumba vya orofa ya juu”; neno la Kiebrania linaweza kumaanisha kwa ujumla zaidi sehemu au vyumba vya juu vya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל
  choice: Na uzito
  rationale: Nomino מִשְׁקָל ina maana ya uzito au kipimo cha uzito; kiunganishi וּ kimetafsiriwa kwa “Na” ili kudumisha mwendelezo wa simulizi.
- source_word: לְמִסְמְרוֹת
  choice: wa misumari
  rationale: מִסְמְרוֹת ni misumari au vigingi. Katika muktadha wa ujenzi wa hekalu, “misumari” ndiyo maana inayofaa zaidi, na muundo “uzito wa misumari” ni wa kawaida katika Kiswahili.
- source_word: לִשְׁקָלִים חֲמִשִּׁים זָהָב
  choice: ulikuwa shekeli hamsini za dhahabu
  rationale: Kirai hiki kinataja kiwango cha uzito. “Shekeli hamsini za dhahabu” huhifadhi kipimo cha kale na kuonyesha kwamba uzito huo ulihusiana na dhahabu.
- source_word: וְהָעֲלִיּוֹת
  choice: vyumba vya juu
  rationale: עֲלִיּוֹת kwa kawaida humaanisha vyumba au sehemu za juu. “Vyumba vya juu” ni usemi wazi bila kubainisha zaidi usanifu ambao hauko wazi kabisa katika Kiebrania.
- source_word: חִפָּה זָהָב
  choice: akavifunika ... kwa dhahabu
  rationale: חפה hapa humaanisha kufunika kitu kwa tabaka la nyenzo nyingine. “Kuvifunika kwa dhahabu” ni Kiswahili cha kawaida kinachofaa katika maelezo ya mapambo ya hekalu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Muundo wa sentensi umefuata Kiebrania kwa karibu huku ukibaki wa kawaida katika Kiswahili. Alama ya tanbihi imewekwa baada ya “vyumba vya juu,” ambako tofauti ya kimsamiati inahusika.
