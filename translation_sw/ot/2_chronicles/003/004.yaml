base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: sw
  text: Ukumbi uliokuwa mbele ya hekalu ulikuwa na urefu wa dhiraa ishirini, sawa na upana wa hekalu, na kimo chake kilikuwa dhiraa mia moja na ishirini[a]. Akaifunika kwa ndani kwa dhahabu safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania yanasema kwamba kimo cha ukumbi kilikuwa “dhiraa mia moja na ishirini.” Maelezo yanayolingana katika 1 Wafalme 6:3 yanataja urefu na upana wa ukumbi lakini hayataji kimo hiki. Kwa hiyo, baadhi ya wafafanuzi hudhani kuwa huenda kuna tatizo la kimatini hapa; tafsiri hii inafuata Maandishi ya Kimasoreti kama yalivyohifadhiwa.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: ukumbi
  rationale: Neno אוּלָם linamaanisha ukumbi wa kuingilia ulio mbele ya jengo kuu; “ukumbi” ni neno la kawaida na linalofaa kwa muundo huu wa hekalu.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: uliokuwa mbele ya
  rationale: Kauli hii inaonyesha mahali ukumbi ulipokuwa kuhusiana na jengo, bila kuongeza wazo lisilotajwa la mwelekeo wake.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: ulikuwa na urefu wa dhiraa ishirini, sawa na upana wa hekalu
  rationale: Kiebrania kimefupisha uhusiano kati ya urefu wa ukumbi na upana wa jengo; “sawa na” huueleza kwa Kiswahili cha kawaida bila kuubadili.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: dhiraa ishirini
  rationale: “Dhiraa” huhifadhi kipimo cha kale badala ya kukibadili kuwa kipimo cha kisasa.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: na kimo chake kilikuwa dhiraa mia moja na ishirini[a]
  rationale: Tafsiri inafuata idadi iliyohifadhiwa katika Maandishi ya Kimasoreti na kutaja “dhiraa” wazi kwa uelewevu; tanbihi inaonyesha tatizo la kimatini linaloshukiwa na baadhi ya watafsiri.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: Akaifunika sehemu yake ya ndani
  rationale: Kitenzi צפה hapa kina maana ya kufunika au kutandaza uso kwa metali, na מִפְּנִימָה huonyesha upande wa ndani.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hii ni tafsiri ya moja kwa moja, ya kawaida na sahihi ya kirai cha Kiebrania.
