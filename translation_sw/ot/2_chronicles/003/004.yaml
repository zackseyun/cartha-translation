translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kawaida lakini wenye heshima. “Hekalu” limetumiwa kwa הַבַּיִת katika muktadha huu ili msomaji atambue jengo linalozungumziwa, huku vipimo vya kale vikihifadhiwa kwa neno “dhiraa.”
