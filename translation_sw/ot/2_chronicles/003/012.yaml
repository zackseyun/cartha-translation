base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: sw
  text: Bawa moja la kerubi mmoja lilikuwa na urefu wa dhiraa tano[a], likifikia ukuta wa nyumba[b]; nalo bawa lake lingine lilikuwa na urefu wa dhiraa tano, likigusa bawa la kerubi mwingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dhiraa moja ilikuwa karibu sentimita 45; dhiraa tano ni karibu mita 2.25.
    reason: cultural_note
  - marker: b
    text: “Nyumba” hapa ni jengo la Hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: כְנַף
  choice: bawa
  rationale: Katika maelezo ya makerubi wa Hekalu, maana halisi ya kiungo cha kurukia ndiyo inayokusudiwa.
- source_word: כְּרוּב
  choice: kerubi
  rationale: Nomino hii iko katika umoja na inamtaja mmoja wa wale makerubi wawili.
- source_word: אַמּוֹת חָמֵשׁ
  choice: dhiraa tano
  rationale: Kipimo cha kale kimehifadhiwa ili kudumisha usahihi na uthabiti wa vipimo vya jengo.
- source_word: מַגִּיעַ
  choice: likifika mpaka
  rationale: Usemi huu unaonyesha kwamba bawa lilienea hadi ukutani.
- source_word: קִיר הַבָּיִת
  choice: ukuta wa nyumba
  rationale: Tafsiri hii inahifadhi maana ya kawaida ya בַּיִת, huku muktadha ukionyesha kwamba nyumba hiyo ni jengo la Hekalu.
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: bawa lake lingine
  rationale: Kiwakilishi kimeongezwa kwa uwazi wa Kiswahili ili kuonyesha kwamba ni bawa lingine la kerubi yuleyule.
- source_word: דְּבֵקָה
  choice: likigusa
  rationale: Katika mpangilio huu wa jengo, neno linaeleza mgusano wa karibu kati ya mabawa bila kulazimisha wazo kwamba yalifungwa pamoja.
- source_word: הַכְּרוּב הָאַחֵר
  choice: kerubi mwingine
  rationale: Huhifadhi uhusiano wa jozi kati ya makerubi hao wawili.
