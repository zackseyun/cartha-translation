  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umewekwa wazi kwa kuongeza “moja” na “lake” pale panapohitajika, bila kubadili uhusiano wa mabawa na makerubi katika Kiebrania.
