  text: וַ/יַּ֜עַשׂ לִ/פְנֵ֤י הַ/בַּ֨יִת֙ עַמּוּדִ֣ים שְׁנַ֔יִם אַמּ֕וֹת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ אֹ֑רֶךְ וְ/הַ/צֶּ֥פֶת אֲשֶׁר עַל רֹאשׁ֖/וֹ אַמּ֥וֹת חָמֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: sw
  text: Mbele ya nyumba akatengeneza nguzo mbili, zenye urefu wa dhiraa thelathini na tano[a]; na taji lililokuwa juu ya kila nguzo lilikuwa na dhiraa tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “dhiraa thelathini na tano kwa urefu.” Katika 1 Wafalme 7:15, kila nguzo inaelezwa kuwa na kimo cha dhiraa kumi na nane. Kwa hiyo, wengine huelewa hapa kuwa ni urefu wa nguzo zote mbili kwa pamoja, nao wengine huona kuwa kuna ugumu katika matini.
    reason: cross_reference
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: Mbele ya nyumba
  rationale: Huhifadhi maana ya mahali ya לִפְנֵי na neno la Kiebrania הַבַּיִת, “nyumba,” katika muktadha wa hekalu bila kulifasiri zaidi ya lazima.
- source_word: עַמּוּדִים שְׁנַיִם
  choice: nguzo mbili
  rationale: “Nguzo” ni neno la kawaida na sahihi kwa vipengele hivi vya usanifu.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: zenye urefu wa dhiraa thelathini na tano
  rationale: Hutafsiri אֹרֶךְ kama “urefu,” bila kubadili kimya-kimya kuwa “kimo,” na huhifadhi kipimo cha kale cha dhiraa.
- source_word: הַצֶּפֶת
  choice: taji
  rationale: Katika muktadha wa usanifu, neno hili linamaanisha sehemu ya mapambo iliyo juu ya nguzo; “taji” ni neno la Kiswahili linaloeleweka kwa urahisi.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: lililokuwa juu ya kila nguzo
  rationale: “Juu” ni ya kawaida kwa רֹאשׁ linapotumiwa kuhusu kitu. “Kila nguzo” huonyesha uwezekano wa kiambishi cha umoja kutumiwa kwa maana ya kugawa kwa nguzo zote mbili.
- source_word: אַמּוֹת חָמֵשׁ
  choice: lilikuwa na dhiraa tano
  rationale: Hutoa kipimo kwa Kiswahili cha kawaida huku ikihifadhi dhiraa kama kipimo cha kale.
theological_decisions:
- issue: Je, dhiraa thelathini na tano ni urefu/kimo cha kila nguzo au jumla ya nguzo zote mbili?
  choice: Matini kuu inadumisha usemi wa Kiebrania “zenye urefu wa dhiraa thelathini na tano” bila kusema “kila moja” wala “kwa pamoja.”
  alternative: Kusema “kila moja ilikuwa na kimo cha dhiraa thelathini na tano” au kueleza kuwa hicho ni kipimo cha pamoja.
  rationale: Kiebrania kina ugumu wa kimatini linapolinganishwa na 1 Wafalme 7:15. Tafsiri haipaswi kuamua kimya-kimya suala ambalo chanzo hakiliweki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyumba” huhifadhi taswira ya Kiebrania kwa hekalu; “dhiraa” huhifadhi kipimo cha kale. Muundo umewekwa wazi na wa kawaida bila kuficha ugumu wa kipimo katika matini.
