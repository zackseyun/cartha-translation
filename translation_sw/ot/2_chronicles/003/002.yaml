translation:
  language: sw
  text: Alianza kujenga katika mwezi wa pili,[a] siku ya pili, katika mwaka wa nne wa utawala wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania husoma: “katika mwezi wa pili, katika ‘ya pili’”; neno “siku” halijaandikwa, lakini kirai cha mwisho kwa kawaida hueleweka kuwa “siku ya pili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Alianza
  rationale: Kitenzi hiki katika muktadha wa simulizi kinaonyesha kuanza kwa tendo. Kiswahili cha kawaida hakihitaji kuleta kiunganishi cha Kiebrania mwanzoni.
- source_word: לִבְנוֹת
  choice: kujenga
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kitenzi בנה.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: katika mwezi wa pili
  rationale: Kirai hiki kinataja mwezi ambao ujenzi ulianza na kinadumisha mpangilio wa chanzo.
- source_word: בַּשֵּׁנִי
  choice: siku ya pili
  rationale: Ordinali inayorudiwa ni usemi uliodondoshwa neno katika Kiebrania, na kwa kawaida inaeleweka kuwa siku ya pili ya mwezi.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: katika mwaka wa nne
  rationale: Ni mtindo wa kawaida wa kutaja mwaka wa utawala.
- source_word: לְמַלְכוּתוֹ
  choice: wa utawala wake
  rationale: Kirai hiki kinatumia kipindi cha kutawala kwake kama rejea ya tarehe; “utawala wake” ni Kiswahili cha asili na kinachoeleweka.
