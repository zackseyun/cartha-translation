id: 2CH.3.1
reference: 2 Chronicles 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: sw
  text: Ndipo Sulemani akaanza kuijenga nyumba ya Yahwe huko Yerusalemu, juu ya Mlima Moria[a], ambako Yahwe alikuwa amemtokea Daudi, baba yake, mahali pale palipoandaliwa na Daudi, kwenye uwanja wa kupuria nafaka wa Ornani, Myebusi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambako alikuwa amemtokea Daudi, baba yake.” Kiebrania hakumtaji kwa wazi aliyemtokea Daudi.
    reason: alternative_reading
  - marker: b
    text: Jina Ornani ndilo linalotumiwa katika Mambo ya Nyakati; linganisha umbo Arauna katika 2 Samweli 24:16, 18.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Ndipo ... akaanza
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi na kina maana ya kuanza; “Ndipo” na “akaanza” ni Kiswahili cha kawaida na cha asili katika masimulizi.
- source_word: לִבְנוֹת
  choice: kuijenga
  rationale: Kitenzi-jina chenye ל baada ya “akaanza” kinaelezwa kwa asili kwa “kuijenga”; kiambishi “-i-” kinarejelea nyumba.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi picha ya Kiebrania ya hekalu kuwa nyumba, badala ya kuifafanua moja kwa moja kuwa “hekalu”; jina la agano יְהוָה limeandikwa “Yahwe.”
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Hii ni tafsiri ya kawaida ya mahali, na “huko” huunganisha mahali hapo kwa kawaida na tendo la kujenga.
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: juu ya Mlima Moria
  rationale: Kirai hiki kinataja mlima maalumu; “Mlima Moria” ni umbo linaloeleweka na “juu ya” linafaa kwa eneo la mlima.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: ambako Yahwe alikuwa amemtokea Daudi baba yake
  rationale: Niphal ya ראה katika muktadha huu ina maana ya kutokea kwa mtu. Mahali panatajwa kwa “ambako,” na Yahwe amewekwa wazi kuwa mhusika anayeeleweka kutokana na muktadha.
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: mahali pale Daudi alipokuwa amepatayarisha
  rationale: Kiebrania ni kifupi na kigumu kisarufi, lakini muktadha unatambulisha eneo ambalo Daudi alikuwa amelitayarisha au kuliteua. Tafsiri hii ni wazi bila kuongeza maelezo yasiyokuwamo.
- source_word: בְּגֹרֶן
  choice: kwenye uwanja wa kupuria nafaka
  rationale: “Uwanja wa kupuria nafaka” ni maelezo ya kawaida na yanayoeleweka ya גֹּרֶן katika Kiswahili cha sasa.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Ornani, Myebusi
  rationale: Mambo ya Nyakati hutumia jina Ornani. “Myebusi” ni umbo la kawaida la Kiswahili linaloonyesha mtu wa jamii ya Wayebusi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano, kwa hiyo “Yahwe” hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
- issue: Mhusika wa נִרְאָה, ‘alitokea’
  choice: Yahwe alikuwa amemtokea Daudi
  alternative: ulikuwa umeonyeshwa kwa Daudi; alikuwa amemtokea Daudi
  rationale: Kitenzi cha Kiebrania hakitaji mhusika kwa wazi, lakini muktadha unaelekea kwa Yahwe kuwa ndiye aliyemtokea Daudi. Tanbihi huhifadhi uwezekano wa usomaji mwingine wa kisarufi.
- issue: Mhusika wa הֵכִין, ‘alitayarisha’
  choice: Daudi alipokuwa amepatayarisha
  alternative: alipokuwa amepatayarisha mahali pa Daudi
  rationale: Kirai cha Kiebrania kimebanwa na kinaweza kueleweka kwa namna zaidi ya moja. Muktadha wa eneo la uwanja wa Ornani unaunga mkono Daudi kama aliyetayarisha au kuteua mahali hapo, bila kuondoa kabisa ugumu wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. “Nyumba ya Yahwe” huhifadhi taswira halisi ya Kiebrania, huku “uwanja wa kupuria nafaka” ukitoa maana wazi kwa msomaji wa sasa. Muundo wa sentensi umefuata mwendo wa simulizi bila kuwa mzito kupita kiasi.
