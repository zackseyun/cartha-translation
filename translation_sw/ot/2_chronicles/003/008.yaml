base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: sw
  text: Akafanya Mahali Patakatifu Zaidi[a]. Urefu wake, kulingana na upana wa Hekalu,[b] ulikuwa dhiraa ishirini, na upana wake ulikuwa dhiraa ishirini. Akaifunika kwa dhahabu bora yenye uzito wa talanta mia sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Patakatifu pa Patakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Urefu wake ulikuwa sambamba na upana wa Hekalu.”
    reason: spatial_ambiguity
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: Mahali Patakatifu Zaidi
  rationale: Kirai hiki ni namna ya Kiebrania ya kuonyesha kiwango cha juu kabisa cha utakatifu na kinamaanisha sehemu ya ndani kabisa ya Hekalu. Tafsiri hii ni ya kawaida na inayoeleweka katika Kiswahili cha sasa.
- source_word: אָרְכּוֹ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: Urefu wake, kulingana na upana wa Hekalu
  rationale: עַל־פְּנֵי hapa inaeleza uhusiano wa vipimo au mpangilio wa sehemu hii na upana wa jengo la Hekalu. ‘Kulingana na’ huwasilisha maana hiyo bila kudai kwa uhakika zaidi ya ilivyo katika kirai cha Kiebrania.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: dhiraa ishirini
  rationale: Dhiraa ni kipimo cha kale kinacholingana na אַמָּה; kipimo asilia kimehifadhiwa badala ya kukibadili kuwa kipimo cha kisasa.
- source_word: וַיְחַפֵּהוּ
  choice: Akaifunika
  rationale: Katika muktadha wa ujenzi wa Hekalu, kitenzi חפה humaanisha kufunika uso wa kitu kwa nyenzo nyingine, hapa dhahabu. ‘Akaifunika’ ni wazi na ya asili katika Kiswahili.
- source_word: זָהָב טוֹב
  choice: dhahabu bora
  rationale: טוֹב inaonyesha ubora wa dhahabu. ‘Dhahabu bora’ haiingizi dai mahususi la usafi wa kimetali ambalo halijaelezwa wazi katika Kiebrania.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: yenye uzito wa talanta mia sita
  rationale: Herufi ל hapa inaelekea kuonyesha jumla ya kiasi. Kutaja uzito huweka wazi kwamba talanta ni kipimo cha uzito, si idadi ya vipande au thamani ya fedha.
theological_decisions:
- issue: Jina la sehemu ya ndani kabisa ya Hekalu
  choice: Mahali Patakatifu Zaidi
  alternative: Patakatifu pa Patakatifu
  rationale: Chaguo kuu linawasilisha kwa Kiswahili cha kawaida nguvu ya wingi wa Kiebrania unaotumika kama kiwango cha juu, huku tanbihi ikihifadhi namna ya karibu zaidi na muundo wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa ili vipimo vya usanifu visomeke kwa uwazi; vipimo vya kale ‘dhiraa’ na ‘talanta’ vimehifadhiwa.
