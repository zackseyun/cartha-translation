  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: sw
  text: Basi Yoashi, mfalme wa Israeli, akapanda; yeye na Amazia, mfalme wa Yuda, wakakabiliana[a] katika mji wa Beth-shemeshi, ambao ni wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakakutana uso kwa uso.” Nahau ya Kiebrania kihalisi ni “waliona nyuso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha ‘kupanda’ au ‘kwenda juu.’ Katika muktadha huu kinaeleza kusonga kwa Yoashi kuelekea mahali pa mapambano bila kuongeza waziwazi wazo la kijeshi ambalo halikutajwa moja kwa moja.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: wakakabiliana
  rationale: Nahau hii, ambayo kihalisi inahusisha kuonana nyuso, hapa inaeleza wafalme hao kukutana uso kwa uso kama wapinzani vitani. ‘Wakakabiliana’ ni Kiswahili cha kawaida kinachohifadhi maana ya muktadha; tanbihi inadumisha taswira halisi na uwezekano wa ‘wakakutana uso kwa uso.’
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: naye na Amazia
  rationale: Kiwakilishi הוּא kinamrejelea Yoashi na kuwatambulisha washiriki wote wawili. ‘Naye na Amazia’ kinahifadhi muundo na msisitizo huo bila kurudia jina la Yoashi.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: huko Beth-shemeshi
  rationale: Kihusishi ב kinaonyesha mahali pa tukio. ‘Huko’ ni cha asili katika simulizi ya Kiswahili, na jina la mahali limetoholewa kama Beth-shemeshi.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: ulio mali ya Yuda
  rationale: Muundo wa ל unaonyesha umiliki au mamlaka ya eneo, si tu kuwa ndani ya mipaka yake. ‘Ulio mali ya Yuda’ huhifadhi maana hiyo.
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: mfalme wa Israeli / mfalme wa Yuda
  rationale: Vyeo vya kifalme vimetafsiriwa moja kwa moja kwa Kiswahili sanifu na kwa ulinganifu.
