base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: sw
  text: Akaichukua dhahabu yote na fedha yote, vyombo vyote vilivyopatikana katika nyumba ya Mungu, vilivyokuwa pamoja na Obed-Edomu[a], hazina za nyumba ya mfalme, na watu waliowekwa kuwa dhamana[b]; kisha akarudi Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilivyokuwa chini ya uangalizi wa Obed-Edomu.” Kiebrania kinasema kihalisi, “pamoja na Obed-Edomu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi, “wana wa dhamana.” Usemi huu yaelekea unamaanisha watu walioshikiliwa kama dhamana, yaani mateka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: dhahabu yote na fedha yote
  rationale: Huhifadhi msisitizo wa כָּל (‘yote’) na kutaja kila metali kwa uwazi katika Kiswahili cha kawaida.
- source_word: כָּל הַכֵּלִים
  choice: vyombo vyote
  rationale: כֵּלִים ni neno pana kwa vifaa au vyombo; ‘vyombo’ linafaa kwa vitu vya nyumba ya Mungu bila kubana maana kupita kiasi.
- source_word: הַנִּמְצְאִים
  choice: vilivyopatikana
  rationale: Huwakilisha kitenzi-jina kinachoonyesha vitu vilivyokuwapo au kupatikana mahali hapo.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Ni tafsiri ya karibu ya usemi wa Kiebrania na haibadilishi kimya kimya kuwa ‘hekalu.’
- source_word: עִם עֹבֵד אֱדוֹם
  choice: vilivyokuwa kwa Obed-Edomu
  rationale: Huhifadhi maana ya msingi ya עִם, ‘pamoja na/kwa,’ huku Kiswahili kikionyesha uhusiano wa vyombo na Obed-Edomu; uwezekano wa kuwa chini ya uangalizi wake unaelezwa katika tanbihi.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: hazina za nyumba ya mfalme
  rationale: ‘Hazina’ huonyesha vitu vya thamani vilivyochukuliwa, na ‘nyumba ya mfalme’ hudumisha muundo wa chanzo ingawa inaweza kumaanisha ikulu.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: mateka waliokuwa dhamana
  rationale: Usemi halisi ‘wana wa dhamana’ ni mgumu; muktadha unaelekea kwa watu walioshikiliwa kama dhamana. Tafsiri hii ni wazi huku tanbihi ikihifadhi ugumu wa Kiebrania.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: kisha akarudi Samaria
  rationale: Husogeza simulizi mbele kwa kawaida na kuonyesha Samaria kuwa mahali alikorudi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa kugawa orodha kwa koma na kutumia ‘kisha’ katika hatua ya mwisho ya simulizi. Alama zote za tanbihi zimo katika matini kuu.
