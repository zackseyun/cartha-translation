base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: sw
  text: Ikawa, baada ya Amazia kurudi kutoka kuwapiga Waedomu, alileta miungu ya wana wa Seiri[a], akaiweka kuwa miungu yake. Akajisujudu mbele yao[b] na kuwapatia uvumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miungu ya watu wa Seiri.” Kiebrania kinasema, “miungu ya wana wa Seiri.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akainama kifudifudi mbele yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutoa mpito wa kawaida wa simulizi la Kiebrania bila kuongeza kielezi cha wakati kisichokuwapo katika chanzo.
- source_word: אַחֲרֵי בּוֹא
  choice: baada ya Amazia kurudi
  rationale: Ingawa בוא kimsingi ni ‘kuja’, muktadha wa kuja kutoka vitani unaelezwa kwa Kiswahili cha kawaida kama ‘kurudi’; maana ya mfuatano wa wakati inadumishwa.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: kutoka kuwashinda Waedomu
  rationale: נכה inaweza kumaanisha kupiga au kushinda. Hapa simulizi la kampeni ya kijeshi linaeleweka kwa kawaida kama kuwashinda, bila kudai kwamba kila Mwaedomu aliuawa.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: miungu ya wana wa Seiri
  rationale: Wingi ‘miungu’ unahitajika kwa miungu ya kipagani, na ‘wana wa Seiri’ huhifadhi tamko la undugu la Kiebrania; maana ya kawaida zaidi imewekwa katika tanbihi.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: kuisimamisha iwe miungu yake
  rationale: Hiphil ya עמד ina maana ya kusimamisha au kuweka. Kiswahili hiki huhifadhi kitendo cha kuweka sanamu na pia kuzichukua kuwa miungu yake.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: Akainama kifudifudi mbele yake
  rationale: השתחוה huonyesha kuinama au kujilaza chini; ‘kuinama kifudifudi’ hudumisha tendo la mwili na maana yake ya ibada bila kuifupisha kuwa ‘aliabudu’ tu.
- source_word: וְלָהֶם יְקַטֵּר
  choice: na kuifukizia uvumba
  rationale: Piel ya קטר hapa hurejelea kufukiza uvumba kwa miungu. Kiambishi cha ngeli ya ‘miungu’ kinafuata matumizi sanifu ya Kiswahili.
theological_decisions:
- issue: Maana ya אֱלֹהִים/אֱלֹהֵי inapohusu miungu ya kipagani
  choice: miungu
  alternative: viumbe vya kiungu
  rationale: Muktadha unahusu miungu au sanamu za Seiri ambazo Amazia alizifanya vitu vya ibada. ‘Miungu’ ndiyo tafsiri ya kawaida na hudumisha ukali wa uasi wake.
- issue: Kutafsiri השתחוה kama tendo la mwili au dhana ya ibada
  choice: akainama kifudifudi mbele yake
  alternative: akaiabudu
  rationale: Chanzo hutaja tendo halisi la kujinyenyekeza, ambalo katika muktadha ni ibada. Tafsiri iliyochaguliwa haiufichi wala kuupanua zaidi ya lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili bila kupoteza mfuatano wa matendo wa Kiebrania. ‘Yake/kuifukizia’ hutumia upatanisho wa ngeli wa neno ‘miungu’ kama inavyokubalika katika Kiswahili Sanifu.
