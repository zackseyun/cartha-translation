  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲמַצְיָ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הֲ/לֹא֙ הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: sw
  text: Matendo mengine ya Amazia, tangu mwanzo hadi mwisho[a], je, hayakuandikwa katika[b] Kitabu cha Wafalme wa Yuda na Israeli?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “maneno/mambo ya Amazia, ya kwanza na ya mwisho.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “juu ya Kitabu”; Kiswahili cha kawaida husema habari zimeandikwa “katika Kitabu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika muhtasari wa kifalme, דִּבְרֵי haimaanishi maneno pekee, bali mambo au matendo ya utawala; ‘Matendo mengine’ ni Kiswahili cha kawaida na chenye maana hiyo ya kihistoria.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Jina limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: tangu mwanzo hadi mwisho
  rationale: Usemi huu unahusu kipindi chote cha matendo ya mfalme; tafsiri hii ni ya asili katika Kiswahili huku ikidumisha maana ya ujumla.
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Swali la balagha linatarajia jibu la kukubali. Muundo huu unalihifadhi kama swali badala ya kuligeuza kuwa taarifa ya moja kwa moja.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kimsingi ni ‘juu ya,’ katika fomula hii ya rejea maana yake ya kawaida ni kwamba habari zimeandikwa katika kitabu.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: Wafalme wa Yuda na Israeli
  rationale: Mpangilio wa majina umefuata Kiebrania, na herufi kubwa zinaonyesha kuwa huu ni jina la hati inayorejelewa.
theological_decisions: []
