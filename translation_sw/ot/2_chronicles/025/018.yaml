translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na simulizi wazi. Urudiaji wa ‘Lebanoni’ na muundo wa ujumbe ndani ya ujumbe umehifadhiwa kwa sababu ni sehemu muhimu ya mfano wa Kiebrania.
