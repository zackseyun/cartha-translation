base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: sw
  text: Kisha Yoashi, mfalme wa Israeli, akatuma ujumbe kwa Amazia, mfalme wa Yuda, akisema, “Kichaka cha miiba[a] kilichokuwa Lebanoni kilituma ujumbe kwa mwerezi uliokuwa Lebanoni, kikisema, ‘Mpe mwanangu binti yako awe mke wake.’ Kisha mnyama wa porini aliyekuwa Lebanoni akapita na kukanyaga kichaka hicho cha miiba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbigili” au “mmea wa miiba.” Kiebrania kinataja mmea wenye miiba, lakini aina yake kamili haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: kichaka cha miiba
  rationale: Neno hilo linataja mmea wenye miiba ambao aina yake kamili haijulikani; ‘kichaka cha miiba’ ni Kiswahili cha kawaida na kinadumisha tofauti kati ya mmea mdogo na mwerezi mkubwa.
- source_word: הָאֶרֶז
  choice: mwerezi
  rationale: Hili ndilo jina la kawaida la mti wa cedar kwa Kiswahili, nalo linahifadhi picha ya ukubwa na nguvu.
- source_word: בַּלְּבָנוֹן
  choice: Lebanoni
  rationale: Muundo huu unaonyesha mahali ambako mimea na mnyama walikuwapo; katika sentensi hii Kiswahili hakihitaji kurudia kihusishi kabla ya jina hilo.
- source_word: שָׁלַח ... לֵאמֹר
  choice: akatuma ujumbe ... akisema
  rationale: Kuongeza ‘ujumbe’ huweka wazi kitu kilichotumwa kwa Kiswahili cha asili, huku ‘akisema’ ikihifadhi muundo wa Kiebrania.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Mpe mwanangu binti yako awe mke wake
  rationale: Hii inaeleza wazi ombi la ndoa kwa Kiswahili cha sasa bila kuongeza wazo la ziada la muungano wa kisiasa.
- source_word: חַיַּת הַשָּׂדֶה
  choice: mnyama wa mwituni
  rationale: Usemi huu unaashiria mnyama wa porini; ‘mnyama wa mwituni’ ni wa asili na unaeleweka kwa wasomaji wa Afrika Mashariki.
- source_word: וַתַּעֲבֹר
  choice: akapita
  rationale: Tafsiri hii inadumisha tendo rahisi la mnyama kupita bila kudokeza zaidi ya chanzo.
- source_word: וַתִּרְמֹס
  choice: akakanyaga
  rationale: Kitenzi hiki kinaonyesha kukanyaga kwa miguu na kinafaa kwa picha ya mnyama anayekanyaga mmea.
