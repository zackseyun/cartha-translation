base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/022.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: sw
  text: Basi Yuda akashindwa mbele ya Israeli, na kila mtu akakimbilia hemani kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: akashindwa
  rationale: Nifali ya נָגַף katika muktadha huu wa vita inaonyesha kushindwa na adui, si kupigwa kimwili tu. “Akashindwa” ni wazi na ya kawaida katika Kiswahili.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la ufalme wa kusini limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Usemi huu huhifadhi taswira ya Kiebrania ya kushindwa mbele ya mpinzani, huku ukiendelea kueleweka katika simulizi la vita.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la ufalme wa kaskazini limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: וַיָּנֻסוּ
  choice: akakimbilia
  rationale: Kitenzi נוּס humaanisha kukimbia ili kujiokoa; pamoja na mahali pa kuelekea, “akakimbilia” ni Kiswahili cha asili na hudokeza wazi kurudi hemani.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Umoja wa mgawanyo אִישׁ una maana ya kila mmoja. “Kila mtu” ni usemi wa kawaida wa Kiswahili na katika muktadha huu unawahusu wapiganaji.
- source_word: לְאֹהָלָיו
  choice: hemani kwake
  rationale: Usemi huu kihalisi unaelekeza kwenye hema la kila mmoja na pia ni nahau ya kutawanyika na kurudi mahali pake. “Hemani kwake” huhifadhi taswira hiyo bila kuifanya kuwa ‘nyumbani’ tu.
