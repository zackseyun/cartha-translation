id: 2CH.25.27
reference: 2 Chronicles 25:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ת אֲשֶׁר סָ֤ר אֲמַצְיָ֨הוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִיתֻ֖/הוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: sw
  text: Tangu Amazia alipoacha kumfuata Yahwe[a], walifanya njama dhidi yake huko Yerusalemu. Akakimbilia Lakishi, lakini wakatuma watu wamfuate huko Lakishi, nao wakamuua huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “aligeuka kutoka nyuma ya Yahwe”; hii ni nahau yenye maana ya kwamba aliacha kumfuata Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: Tangu
  rationale: Huonyesha mwanzo wa kipindi ambacho njama iliyofuata ilianza, kwa Kiswahili cha kawaida bila kuongeza neno lisilokuwapo la wakati kama ‘sasa’.
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: alipoacha kumfuata Yahwe
  rationale: Nahau ya Kiebrania ina maana ya kugeuka na kuacha kumfuata Yahwe, si kuondoka mahali kimwili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetolewa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: walifanya njama dhidi yake
  rationale: Muungano wa kitenzi na nomino unaeleza kupanga njama dhidi ya mtu; usemi huu ni wa asili na unaeleweka kwa wasomaji wa leo.
- source_word: וַיָּנָס לָכִישָׁה
  choice: Akakimbilia Lakishi
  rationale: Kitenzi kinaonyesha kukimbia hatari, na kiambishi cha mwelekeo katika jina Lakishi kinaonyesha kwamba alielekea huko.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: wakatuma watu wamfuate huko Lakishi
  rationale: Kiebrania kinasema kihalisi ‘wakatuma nyuma yake’; kuongeza ‘watu’ huweka wazi maana iliyodokezwa bila kubadili kitendo.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: nao wakamuua huko
  rationale: Umbo la kisababishi la מות linaonyesha kwamba walisababisha kifo chake kwa makusudi; ‘wakamuua’ ni usemi wa moja kwa moja na wa asili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina Tetragramatoni, yaani jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Maana ya kuacha kuwa ‘nyuma ya’ Yahwe
  choice: alipoacha kumfuata Yahwe
  alternative: alipogeuka kutoka nyuma ya Yahwe
  rationale: Tafsiri iliyochaguliwa huwasilisha maana ya nahau kwa Kiswahili bila kuficha kwamba mstari unazungumzia kuacha uaminifu wa kumfuata Yahwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Sentensi zimegawanywa ili zisomwe kwa urahisi, huku uhusiano wa wakati, njama, kukimbia na kuuawa ukihifadhiwa.
