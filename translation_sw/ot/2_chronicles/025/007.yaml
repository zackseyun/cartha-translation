base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: sw
  text: Lakini mtu wa Mungu akamjia, akisema, “Ee mfalme, jeshi la Israeli lisiende pamoja nawe, kwa maana Yahweh hayuko pamoja na Israeli, yaani wana wote wa Efraimu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waefraimu wote.” Kiebrania kinasema, “wana wote wa Efraimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hiki ni cheo cha kawaida cha mjumbe aliyepewa utume na Mungu; Kiswahili hakihitaji kibainishi cha kutokuwa maalumu.
- source_word: בָּא אֵלָיו
  choice: akamjia
  rationale: Kitenzi בוא pamoja na אֶל kinaonyesha kumwendea mtu; “akamjia” ni tafsiri fupi na ya asili.
- source_word: לֵאמֹר
  choice: na kusema
  rationale: Hutoa kwa Kiswahili cha kawaida fomula ya Kiebrania ya kutanguliza maneno yanayonukuliwa.
- source_word: הַמֶּלֶךְ
  choice: Ee mfalme
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja; “Ee mfalme” huhifadhi heshima na uzito wa usemi.
- source_word: אַל יָבֹא עִמְּךָ
  choice: lisiende pamoja nawe
  rationale: Ingawa בוא kimsingi ni “kuja,” hapa ni kuandamana na mfalme katika safari ya kijeshi; “kwenda pamoja nawe” ni ya asili katika muktadha huu, huku hali ya kukataza ikihifadhiwa.
- source_word: צְבָא יִשְׂרָאֵל
  choice: jeshi la Israeli
  rationale: צָבָא hapa humaanisha kikosi cha kijeshi, na umoja wa kisarufi umehifadhiwa katika “lisiende.”
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: kwa maana Yahwe hayuko pamoja na Israeli
  rationale: Kifungu hiki kinatoa sababu ya katazo, na עִם imetafsiriwa wazi kama “pamoja na.”
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: yaani, wana wote wa Efraimu
  rationale: “Wana wa Efraimu” huhifadhi taswira ya kifamilia ya Kiebrania; “yaani” huonyesha kuwa kifungu kinafafanua Israeli inayokusudiwa hapa bila kukifanya kuwa sentensi mpya.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; “Yahwe” hulitambulisha kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kutokuwapo kwa Yahwe “pamoja na” Israeli
  choice: hayuko pamoja na Israeli
  alternative: haiungi mkono Israeli
  rationale: Tafsiri ya moja kwa moja huhifadhi mvutano wa kitheolojia na haibani kauli hiyo kuwa msaada wa kijeshi pekee, ingawa huo ndio muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umewekwa kwa lugha ya kawaida ya kijeshi, huku usemi wa Kiebrania “wana wa Efraimu” ukihifadhiwa na kufafanuliwa katika tanbihi.
