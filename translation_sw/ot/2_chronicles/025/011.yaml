base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: sw
  text: Ndipo Amazia akajitia nguvu, akawaongoza watu wake, akaenda katika Bonde la Chumvi, na huko akawapiga wana wa Seiri[a] elfu kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu au wazao wa Seiri. Kiebrania kinasema kihalisi, “wana wa Seiri,” usemi wa kikabila na wa ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: akajitia nguvu
  rationale: Kauli ya kujirejelea katika Kiebrania inaonyesha Amazia alijiimarisha au alijipa nguvu. Tafsiri hii huhifadhi maana hiyo bila kuibana kuwa ujasiri wa moyoni pekee.
- source_word: וַיִּנְהַג אֶת־עַמּוֹ
  choice: akawaongoza watu wake
  rationale: Katika muktadha wa kijeshi, kitenzi kinaweza kumaanisha kuongoza au kuwaendesha watu. ‘Akawaongoza’ ni Kiswahili cha kawaida kisichoongeza maelezo ya mbinu za kijeshi.
- source_word: גֵּיא הַמֶּלַח
  choice: Bonde la Chumvi
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya jina la mahali; herufi kubwa zinaonyesha kuwa ni jina maalumu.
- source_word: וַיַּךְ
  choice: akawaua
  rationale: Kitenzi נכה kina wigo wa kupiga, kushinda, au kuua. Kutajwa kwa idadi ya waliopigwa na kutofautishwa kwao na mateka walio hai katika mstari unaofuata kunaunga mkono maana ya kuua hapa.
- source_word: בְּנֵי שֵׂעִיר
  choice: wana wa Seiri
  rationale: Huhifadhi tamko la Kiebrania lenye maana ya kikabila na kiukoo. Tanbihi inafafanua kuwa si lazima lieleweke kuwa watoto wa kiume wa mtu mmoja.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: elfu kumi
  rationale: Hii ndiyo njia ya kawaida na wazi ya kutafsiri kirai hiki cha idadi katika Kiswahili.
- source_word: וַאֲמַצְיָהוּ
  choice: Ndipo Amazia
  rationale: Kiunganishi kinaendeleza mfululizo wa simulizi; ‘Ndipo’ huonyesha hatua inayofuata kwa Kiswahili cha asili.
