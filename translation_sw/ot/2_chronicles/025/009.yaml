base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: sw
  text: Amazia akamwambia mtu wa Mungu, “Lakini tufanye nini kuhusu talanta mia moja[a] nilizowapa wanajeshi wa Israeli?” Mtu wa Mungu akamjibu, “Yahwe anaweza kukupa mengi zaidi ya hayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “talanta mia moja.” Mstari uliotangulia unaeleza kwamba zilikuwa talanta za fedha.'
    reason: cross_reference
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi cheo cha kawaida cha Kiebrania kwa mjumbe aliyepewa utume na Mungu bila kukibainisha kupita kiasi kuwa ‘nabii’.
- source_word: וּמַה לַּעֲשׂוֹת
  choice: Lakini itakuwaje kuhusu
  rationale: Katika muktadha Amazia anapinga agizo la kuwaondoa wanajeshi aliowakodi; usemi huu wa kawaida wa Kiswahili unaonyesha swali lake kuhusu fedha alizokwisha kutoa.
- source_word: מְאַת הַכִּכָּר
  choice: talanta mia moja
  rationale: כִּכָּר ni kipimo cha uzito kinachoitwa talanta. Neno ‘fedha’ halijaongezwa katika mstari wenyewe, kwa kuwa limetajwa katika mstari uliotangulia.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: wanajeshi wa Israeli
  rationale: Katika muktadha wa askari waliokodiwa, גְּדוּד hurejelea kikosi cha kijeshi; ‘wanajeshi’ ni wazi na asilia kwa wasomaji wa Kiswahili.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Yahwe anaweza kukupa
  rationale: Muundo wa Kiebrania unasisitiza uwezo au rasilimali za Yahwe za kutoa; tafsiri hii inawasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַרְבֵּה מִזֶּה
  choice: zaidi sana kuliko hizo
  rationale: הַרְבֵּה pamoja na מִן huonyesha ulinganisho wa wingi mkubwa; ‘hizo’ hurejelea talanta zilizotajwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Tetragramatoni limehifadhiwa badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Yahwe anaweza kukupa
  alternative: Yahwe anavyo vya kukupa
  rationale: Uchaguzi mkuu unaeleza kwa kawaida uwezo wa Yahwe wa kutoa, huku tanbihi ikihifadhi uwezekano wa kuelewa usemi huo kwa kusisitiza rasilimali alizo nazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Alama [a] imewekwa baada ya kiasi kinachofafanuliwa; tanbihi [b] haijawekwa kwa sababu rasimu ya maandishi haikuwa na alama hiyo.
