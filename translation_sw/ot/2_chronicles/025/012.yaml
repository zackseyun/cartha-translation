base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: sw
  text: Wana wa Yuda wakawateka watu elfu kumi wakiwa hai, wakawaleta juu ya jabali[a], wakawatupa chini kutoka juu ya jabali hilo, nao wote wakapasuka vipande-vipande[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mwamba” au “mwamba wenye mwinuko” (Kiebrania: selaʿ).'
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wote wakapasuliwa” au “wakavunjika vipande.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: wakawateka
  rationale: Katika muktadha wa vita, pamoja na חַיִּים, kitenzi hiki humaanisha kuwakamata watu kama mateka, si kurudi.
- source_word: חַיִּים
  choice: wakiwa hai
  rationale: Hueleza kwamba watu hao elfu kumi walitekwa bila kuuawa vitani.
- source_word: וַיְבִיאוּם
  choice: wakawaleta
  rationale: Hifili ya בוא kwa kawaida humaanisha ‘kuleta’; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לְרֹאשׁ
  choice: juu ya
  rationale: רֹאשׁ ni ‘kichwa’ kihalisi, lakini kuhusu umbo la ardhi humaanisha sehemu ya juu au kilele.
- source_word: הַסָּלַע / הַסֶּלַע
  choice: jabali
  rationale: סֶלַע humaanisha mwamba mkubwa au jabali lenye mwinuko; ‘jabali’ linafaa kwa tendo la kuwatupa watu kutoka juu yake.
- source_word: וַיַּשְׁלִיכוּם
  choice: wakawatupa chini
  rationale: שלך humaanisha kutupa; ‘chini’ huweka wazi mwendo unaodokezwa na maneno yanayofuata, ‘kutoka juu ya jabali.’
- source_word: נִבְקָעוּ
  choice: wakapasuka vipandevipande
  rationale: Nifali ya בקע humaanisha kupasuka, kupasuliwa, au kuvunjika. Usemi huu unaeleza kwa Kiswahili cha kawaida matokeo ya kuanguka kutoka juu bila kupunguza ukali wa simulizi.
- source_word: וְכֻלָּם
  choice: nao wote
  rationale: Inahifadhi kiwakilishi na maana ya ujumla kamili iliyo wazi katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa leo. Muundo wa vitenzi vyenye ‘waka-’ unahifadhi mfuatano wa matendo katika simulizi. Kiunganishi ‘nao’ badala ya ‘hivyo’ huepuka kuongeza dhana ya kusudi au matokeo isiyoelezwa moja kwa moja na uratibu wa Kiebrania.
