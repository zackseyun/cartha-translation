base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: sw
  text: Ikawa, alipokuwa akisema naye, mfalme akamwambia, “Je, tumekuteua kuwa mshauri wa mfalme?[a] Acha! Kwa nini wakupige?[b]” Ndipo nabii akanyamaza, akasema, “Ninajua kwamba Mungu amekusudia kukuangamiza,[c] kwa kuwa umefanya jambo hili, wala hukusikiliza ushauri wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, tumekufanya mshauri wa mfalme?”
    reason: ‘Kuteua’ na ‘kufanya’ zote zinaweza kuwasilisha נתן katika maana hii ya kumpa mtu wadhifa.
  - marker: b
    text: 'Kiebrania: “Kwa nini wakupige?” Mtenda ni wingi usioainishwa, huenda ni watu ambao wangemwadhibu kwa amri ya mfalme.'
    reason: Tanbihi inadumisha kutokutajwa kwa watendaji na huepuka kuamua bila msingi kama kipigo hicho kingemaanisha kuuawa.
  - marker: c
    text: Au, “Mungu amepanga [au, ameazimia] kukuangamiza.” Kitenzi cha Kiebrania kinahusiana na kutoa shauri au kupanga.
    reason: Huhifadhi maana pana ya יעץ na mwangwi wake na “ushauri wangu” mwishoni mwa mstari.
lexical_decisions:
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: Je, tumekuweka kuwa mshauri wa mfalme?
  rationale: 'Muundo unaeleweka vizuri kama swali la kukemea: kiambishi cha swali הַ, kisha ‘kuwa mshauri wa mfalme,’ na kitenzi chenye mtenda wa wingi ‘tumekuweka.’ Kiswahili hiki ni cha kawaida na hakibadili swali kuwa taarifa.'
- source_word: חֲדַל
  choice: Acha!
  rationale: Ni amri fupi na kali ya kumtaka nabii akome kusema. ‘Acha!’ ni ya sasa, ya asili, na ina nguvu inayolingana na muktadha.
- source_word: לָמָּה יַכּוּךָ
  choice: Kwa nini wakupige?
  rationale: Kitenzi kina mtenda wa wingi asiyeainishwa. Tafsiri inadumisha wingi huo na haiongezi kwa uhakika kwamba pigo hilo ni kuuawa, jambo ambalo mzizi נכה unaweza lakini si lazima uliseme hapa.
- source_word: יָעַץ אֱלֹהִים
  choice: Mungu amekusudia
  rationale: יעץ huhusu kutoa shauri au kupanga. Mungu akiwa mtenda na kuangamiza kukiwa kusudi, maana ya kimuktadha ni kwamba amefanya azimio au mpango; ‘amekusudia’ ni ya asili huku tanbihi ikihifadhi uwanja mpana wa maana.
- source_word: לְהַשְׁחִיתֶךָ
  choice: kukuangamiza
  rationale: Hiphil ya שׁחת inaonyesha kusababisha uharibifu. ‘Kukuangamiza’ ni ya moja kwa moja na yenye uzito unaofaa.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: kwa kuwa umefanya jambo hili
  rationale: כִּי ni ya kisababishi hapa, na ‘jambo hili’ huhifadhi rejeo la demonstrative bila kuongeza maelezo yasiyokuwapo.
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: wala hukusikiliza ushauri wangu
  rationale: שׁמע inaweza kumaanisha kusikia, kusikiliza, au kutii. ‘Hukusikiliza ushauri wangu’ huhifadhi maana ya kusikia na kuzingatia, pia ikidumisha uhusiano wa kimsamiati na עצה, ‘ushauri.’
theological_decisions:
- issue: Kusudi la Mungu katika יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  choice: Mungu amekusudia kukuangamiza
  alternative: Mungu amepanga/ameazimia kukuangamiza
  rationale: Kiebrania kinaonyesha hukumu ya Mungu kama kusudi lililoamuliwa kwa sababu ya tendo la mfalme na kukataa kwake kuusikiliza ushauri wa kinabii. Tafsiri hailainishi wala haielezi mvutano huo kwa fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Masimulizi yametumia mfuatano wa ‘aka-’ kwa mtiririko wa kawaida. Kauli fupi ‘Acha!’ inadumisha ukali wa mfalme. Viwakilishi na mtenda wa wingi asiyeainishwa vimeachwa bila ufafanuzi wa ziada ili kuhifadhi utata halisi wa chanzo.
