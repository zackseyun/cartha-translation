base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: sw
  text: Alifanya yaliyo sawa machoni pa Yahweh, lakini si kwa moyo mkamilifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “si kwa moyo wote” au “si kwa moyo ulio kamili.” Kiebrania kinasema “si kwa moyo kamili,” kikimaanisha kwamba hakujitoa kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Alifanya
  rationale: Waw-consecutive pamoja na kitenzi kisichotimilifu husimulia tendo la wakati uliopita; Kiswahili hakihitaji kuanza na “na” hapa.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino, yaani jambo lililo sawa au adilifu; “yaliyo sawa” ni Kiswahili cha kawaida kinachohifadhi tathmini ya maadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania inayomaanisha kwa kadiri ya tathmini au mtazamo wa Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: רַק
  choice: lakini
  rationale: Katika muktadha huu neno linaweka kikomo kinachokinzana na kauli chanya iliyotangulia; “lakini” huwasilisha tofauti hiyo kwa uwazi.
- source_word: לֹא
  choice: si
  rationale: Ni ukanushi rahisi unaohusishwa na kishazi cha namna.
- source_word: בְּלֵבָב שָׁלֵם
  choice: kwa moyo mkamilifu
  rationale: Huhifadhi sitiari ya moyo na maana ya moyo ulio kamili katika uaminifu au kujitoa, bila kudai kutokuwa na dhambi kabisa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi badala ya kuliweka kwa cheo.
- issue: Kiwango cha kujitoa kwa Amazia
  choice: si kwa moyo mkamilifu
  alternative: si kwa moyo wote; si kwa moyo usiogawanyika
  rationale: Tafsiri hii inadumisha mvutano wa andiko kati ya matendo yaliyokuwa sawa na kujitoa kwa ndani ambako hakukuwa kamili, bila kuongeza wazo kali zaidi la unafiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Machoni pa” huhifadhi nahau ya Kiebrania kwa namna inayoeleweka; “moyo mkamilifu” hudumisha sitiari na utata wake wa kimaana.
