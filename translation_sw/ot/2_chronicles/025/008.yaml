  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: sw
  text: Lakini ukienda[a], uwe hodari vitani; Mungu atakukwaza mbele ya adui[b], kwa maana Mungu ana uwezo wa kusaidia na wa kukwaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukienda, jitie nguvu kwa ajili ya vita,” au, “ukienda, ujionyeshe kuwa hodari vitani.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinarudia mzizi uleule: Mungu ana uwezo wa “kusaidia” na wa “kukwaza.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Lakini ikiwa
  rationale: Mchanganyiko huu wa chembe unaanzisha sharti lenye kutofautiana na agizo lililotangulia; ‘Lakini ikiwa’ linaonyesha vizuri ulinganifu huo.
- source_word: בֹּא אַתָּה
  choice: utaenda hata hivyo
  rationale: Kitenzi pamoja na kiwakilishi cha wazi kinakazia uamuzi wa kwenda licha ya onyo; ‘hata hivyo’ huonyesha mkazo huo kwa Kiswahili cha kawaida.
- source_word: עֲשֵׂה חֲזַק
  choice: jipe moyo
  rationale: Nahau hii ya kufanya/kuwa hodari ni himizo la kuwa thabiti na jasiri; ‘jipe moyo’ ni ya asili katika muktadha wa vita bila kuongeza wazo lisilokuwamo.
- source_word: לַמִּלְחָמָה
  choice: vitani
  rationale: Kihusishi kinaweza kuonyesha kusudi au mazingira; ‘vitani’ ni usemi wa kawaida na wazi hapa.
- source_word: יַכְשִׁילְךָ
  choice: atakufanya ujikwae
  rationale: Hifili ya כשל ina maana ya kusababisha mtu ajikwae au aanguke. Tafsiri hii inadumisha sitiari na uhusiano na mzizi unaorudiwa mwishoni mwa mstari.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa Kiebrania kina kibainishi, ‘Mungu’ ndiyo tafsiri ya kawaida na ya asili katika Kiswahili katika muktadha huu.
- source_word: לִפְנֵי אוֹיֵב
  choice: mbele ya adui
  rationale: Kirai kinaonyesha kuangushwa mbele ya au katika uwepo wa adui; tafsiri ya moja kwa moja inafaa kwa Kiswahili.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: Mungu ana uwezo
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza kwamba uwezo uko kwa Mungu, huku ikiandaa jozi ya vitenzi vinavyofuata.
- source_word: לַעְזֹר
  choice: wa kusaidia
  rationale: Ni tafsiri nyofu ya kitenzi-jina kinachoonyesha jambo ambalo Mungu ana uwezo wa kulifanya.
- source_word: וּלְהַכְשִׁיל
  choice: na wa kufanya mtu ajikwae
  rationale: Kurudia ‘kufanya ... ajikwae’ kunadumisha kurudiwa kwa mzizi כשל na usawaziko wa usemi kati ya kusaidia na kuangusha.
theological_decisions:
- issue: Utendaji wa Mungu katika kushindwa vitani
  choice: Mstari unasema moja kwa moja kwamba Mungu anaweza kumfanya mtu ajikwae na pia kusaidia.
  alternative: Kulainisha kauli ili kushindwa kuonekane kuwa kumeruhusiwa tu na Mungu kwa njia isiyo ya moja kwa moja.
  rationale: Kiebrania kinamtaja Mungu wazi kuwa mtendaji anayesababisha kujikwaa. Tafsiri inadumisha mvutano huo wa kiteolojia badala ya kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Jipe moyo vitani’ ni himizo la kawaida na linaloeleweka; ‘atakufanya ujikwae’ hudumisha sitiari na urudiaji wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
