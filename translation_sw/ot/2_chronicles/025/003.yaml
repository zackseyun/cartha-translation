  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: sw
  text: Utawala wake ulipokuwa umeimarika[a], aliwaua watumishi wake waliomuua mfalme, baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawala ulipokuwa umethibitika mikononi mwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ulipokuwa
  rationale: Muundo huu unaanzisha wakati wa tukio linalofuata; kishazi cha Kiswahili chenye “-lipo-” kinawasilisha uhusiano huo wa wakati kwa kawaida bila kuongeza neno lisilokuwamo kama “basi” au “sasa.”
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: Ufalme ulipokuwa imara chini ya mamlaka yake
  rationale: Katika muktadha huu חזק inaeleza kuimarika kwa utawala wa kifalme, na עליו inaonyesha kuwa ulikuwa chini ya udhibiti wake. Tafsiri hii ni ya kawaida katika Kiswahili na haihamishi kimakosa sitiari ya Kiingereza ya “in his hand.”
- source_word: הַמַּמְלָכָה
  choice: Ufalme
  rationale: Neno linaweza kumaanisha ufalme au utawala wa kifalme; “ufalme” ni pana na ya kawaida, huku muktadha ukibainisha mamlaka ya mfalme.
- source_word: וַיַּהֲרֹג
  choice: aliwaua
  rationale: Ni tafsiri ya moja kwa moja, wazi, na ya sasa ya tendo la kuua.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya ikulu, neno hili linaelekea kumaanisha watu waliokuwa katika utumishi wa mfalme; “watumishi” huepuka kudai bila msingi kwamba walikuwa watumwa au maofisa rasmi.
- source_word: הַמַּכִּים
  choice: waliokuwa wamemuua
  rationale: Kitenzi נכה hapa kinawatambulisha waliompiga mfalme kwa matokeo ya kifo. “Wamemuua” ni wazi na cha kawaida katika Kiswahili, ingawa kinarudia mzizi wa “ua” uliotumika katika kishazi kikuu.
- source_word: אֶת־הַמֶּלֶךְ אָבִיו
  choice: mfalme, baba yake
  rationale: Huhifadhi uhusiano wa apposition wa Kiebrania na kuweka wazi kwamba mfalme aliyeuawa alikuwa baba yake.
