base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: sw
  text: Kisha Amazia, mfalme wa Yuda, akafanya shauri, akatuma ujumbe kwa Yoashi mwana wa Yehoahazi, mwana wa Yehu, mfalme wa Israeli, akisema, “Njoo, tukabiliane uso kwa uso.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuonane uso kwa uso.” Nahau ya Kiebrania inasema kihalisi kuhusu kuonana nyuso; hapa huenda ikaashiria makabiliano ya moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: akafanya mashauri
  rationale: Nifali ya יעץ inaonyesha kutafakari au kushauriana kabla ya kuchukua hatua. ‘Akafanya mashauri’ ni Kiswahili cha heshima kinachohifadhi wazo hilo bila kubainisha washauri ambao hawatajwi.
- source_word: וַיִּשְׁלַח אֶל
  choice: akatuma ujumbe kwa
  rationale: Kiebrania kinasema kihalisi ‘akatuma kwa’; Kiswahili huhitaji kutaja kilichotumwa ili sentensi iwe ya kawaida. ‘Ujumbe’ haidai wazi kwamba wajumbe wengi walitumwa.
- source_word: יוֹאָשׁ בֶּן יְהוֹאָחָז בֶּן יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: Yoashi mwana wa Yehoahazi, mwana wa Yehu, mfalme wa Israeli
  rationale: Majina, nasaba kamili, na cheo vimehifadhiwa kama vilivyo katika chanzo; ‘mfalme wa Israeli’ inamrejelea Yoashi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki ni kiingizio cha kawaida cha usemi wa moja kwa moja katika simulizi.
- source_word: לְךָ
  choice: Njoo
  rationale: Amri hii hapa ni mwaliko wenye changamoto; ‘Njoo’ ni sawa ya asili na fupi katika muktadha.
- source_word: נִתְרָאֶה פָנִים
  choice: tukabiliane uso kwa uso
  rationale: Nahau hiyo inahusu kuonana nyuso, lakini katika muktadha huu inaashiria mkabiliano wa moja kwa moja. Tafsiri hii huhifadhi lugha ya ‘uso’ na nguvu ya changamoto.
