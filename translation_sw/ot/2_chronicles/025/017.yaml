translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. ‘Akafanya mashauri’ huhifadhi uzito wa deliberation; ‘tukabiliane uso kwa uso’ ni ya kawaida na hudumisha uwezekano wa kukutana moja kwa moja pamoja na tishio la mapambano.
