  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: sw
  text: Yoashi, mfalme wa Israeli, alimkamata Amazia, mfalme wa Yuda, mwana wa Yoashi, mwana wa Yehoahazi, huko Beth-shemeshi, akamleta Yerusalemu. Kisha akabomoa sehemu ya ukuta wa Yerusalemu kutoka Lango la Efraimu hadi Lango la Pembeni[a], kwa urefu wa dhiraa mia nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “lango linaloelekea” au “lango linageuka.” Maana kamili ya jina la Kiebrania haina uhakika; “Lango la Pembeni” hufuata utambulisho unaowezekana katika simulizi sambamba la 2 Wafalme 14:13.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: alimkamata
  rationale: Kitenzi hiki humaanisha kumtia mtu mikononi au kumchukua akiwa mateka. “Alimkamata” ni Kiswahili cha kawaida kinachofaa katika muktadha wa kijeshi bila kuongeza maelezo yasiyokuwamo.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: huko Beth-shemeshi
  rationale: Kiambishi ב hapa kinaonyesha mahali ambapo Amazia alikamatwa. “Huko” ni cha kawaida kwa jina la mahali, nalo jina limetoholewa kwa mwandiko unaosomeka kwa Kiswahili.
- source_word: וַיְבִיאֵהוּ
  choice: akamleta
  rationale: Hifili ya בוא kwa kawaida ni “kuleta.” Kiambishi cha nafsi ya tatu kimetolewa kwa “-m-,” kikimrejelea Amazia.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: akabomoa ukuta wa Yerusalemu
  rationale: פרץ katika muktadha wa ukuta humaanisha kuuvunja au kuufanyia pengo. “Akabomoa” ni wazi, ya asili, na inafikisha uharibifu wa ukuta.
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: kuanzia Lango la Efraimu hadi Lango la Pembeni
  rationale: Lango la kwanza ni jina maalumu la mahali. הַפּוֹנֶה kihalisi lina wazo la kugeuka au kuelekea upande fulani; “Lango la Pembeni” linafuata utambulisho unaowezekana wa lango hilo katika simulizi sambamba, huku tanbihi ikihifadhi maana halisi isiyo na uhakika.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: dhiraa mia nne
  rationale: Kiebrania kinataja kipimo moja kwa moja bila kuongeza neno “urefu.” “Dhiraa” ni istilahi ya kawaida ya kipimo hiki katika tafsiri za Biblia za Kiswahili.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: mwana wa Yoashi, mwana wa Yehoahazi
  rationale: Muundo huu unahifadhi vizazi vyote viwili vilivyotajwa katika Kiebrania bila kuvifanya kuwa ufafanuzi usiokuwamo katika matini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi na wenye hadhi. Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Sentensi inahifadhi mfuatano wa matendo na taarifa kamili ya ukoo katika chanzo.
