  to: Yoashi, mfalme wa Israeli, alimkamata Amazia, mfalme wa Yuda, mwana wa Yoashi, mwana wa Yehoahazi, huko Beth-shemeshi, akamleta Yerusalemu. Kisha akabomoa sehemu ya ukuta wa Yerusalemu kutoka Lango la Efraimu hadi Lango la Pembeni[a], kwa urefu wa dhiraa mia nne.
