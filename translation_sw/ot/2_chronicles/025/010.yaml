base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: sw
  text: Basi Amazia akawatenga askari wale waliokuwa wamemjia kutoka Efraimu, ili waende kwao. Wakawa na hasira kali sana dhidi ya Yuda[a], nao wakarudi kwao wakiwa na hasira kali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawa na hasira kali sana kwa Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: akawatenga
  rationale: Kitenzi בדל kimsingi humaanisha kutenga au kutenganisha. Katika muktadha huu Amazia aliwaondoa wanajeshi wa Efraimu katika jeshi lake na kuwaruhusu waondoke; “akawatenga” hudumisha maana ya msingi bila kuifanya sentensi kuwa ngumu.
- source_word: לְהַגְּדוּד
  choice: askari wale
  rationale: גְּדוּד humaanisha kikosi au kundi la kijeshi. “Askari wale” ni wazi na ya kawaida katika Kiswahili, na inawatambulisha watu wa kikosi hicho badala ya kutumia istilahi nzito ya kijeshi.
- source_word: אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: waliokuwa wamemjia kutoka Efraimu
  rationale: Muundo huu unaonyesha kuwa kikosi kilikuwa kimekwisha kuja kwa Amazia kabla ya kutengwa. “Waliokuwa wamemjia” huonyesha vizuri mfuatano huo wa matukio.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: ili waende kwao
  rationale: Kirai hiki kinaonyesha kusudi la kuwatenga. מילולית “mahali pao” huwakilishwa kwa Kiswahili cha kawaida na “kwao,” bila kulazimisha maana finyu ya nyumba zao binafsi.
- source_word: וַיִּחַר אַפָּם מְאֹד בִּיהוּדָה
  choice: wakawa na hasira kali sana dhidi ya Yuda
  rationale: Nahau ya Kiebrania husema hasira yao iliwaka sana, huku בִּיהוּדָה ikionyesha mlengwa wa hasira. Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi ukali na mwelekeo wa hasira.
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: wakarudi kwao
  rationale: שׁוב humaanisha kurudi. “Wakarudi kwao” ni tafsiri ya moja kwa moja na ya kawaida ya kitendo hicho.
- source_word: בָּחֳרִי אָף
  choice: wakiwa na hasira kali
  rationale: Kirai hiki huonyesha hasira yenye ukali iliyowaandama waliporudi. “Wakiwa na hasira kali” ni cha asili katika Kiswahili na hudumisha msisitizo wa maandishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Kwao” limetumiwa kwa maana ya mahali walikotoka, na marudio ya “hasira kali” yamehifadhiwa kwa kuwa maandishi ya Kiebrania yanasisitiza hasira yao mara mbili.
