  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: sw
  text: Wakambeba juu ya farasi[a], wakamzika pamoja na baba zake katika mji wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “juu ya wale farasi.” Kiebrania kinawataja farasi kwa wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Wakamchukua
  rationale: Kitenzi נשׂא hapa kina maana ya kubeba au kusafirisha mwili; “wakamchukua” ni Kiswahili cha sasa na cha kawaida kinachofaa muktadha huu.
- source_word: עַל הַסּוּסִים
  choice: juu ya farasi
  rationale: Huhifadhi kwa ukaribu kihusishi עַל na kutaja farasi kwa wingi bila kuingiza machela, gari, au njia nyingine ya usafiri ambayo haikutajwa katika Kiebrania.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: wakamzika
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya tendo la kumzika, pamoja na kiambishi cha yambwa cha nafsi ya tatu umoja.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Huhifadhi nahau ya Kiebrania na maana yake ya kifamilia na ya nasaba, badala ya kuifafanua moja kwa moja kuwa “mababu zake.”
- source_word: בְּעִיר יְהוּדָה
  choice: katika mji wa Yuda
  rationale: Hufuata moja kwa moja maandishi ya Kimasora yanayosema “mji wa Yuda,” bila kuyapatanisha na usemi unaojulikana zaidi wa “Mji wa Daudi.”
theological_decisions:
- issue: Kauli ya maziko na mahali pake
  choice: katika mji wa Yuda
  alternative: katika Mji wa Daudi; au katika Yuda
  rationale: Maandishi yaliyotolewa yanasema wazi “mji wa Yuda.” Tafsiri inalinda usomaji huo usio wa kawaida bila kuusahihisha au kuupatanisha na vifungu vingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi wenye vitenzi vinavyofuatana umehifadhiwa kwa “wakamchukua ... wakamzika.”
