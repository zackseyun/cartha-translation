  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: sw
  text: Ndipo hasira ya Yahweh ikawaka dhidi ya Amazia, naye akamtumia nabii ambaye alimwambia, “Kwa nini umeitafuta[a] miungu ya watu hao, ambayo haikuwaokoa watu wao kutoka mkononi mwako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umeiuliza” au “umeiomba shauri.”
    reason: Neno la Kiebrania linaweza kumaanisha kutafuta, kuuliza, au kuomba shauri kwa mungu.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Inahifadhi taswira ya nahau ya Kiebrania ya hasira kuwaka huku ikisikika kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linawakilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בַּאֲמַצְיָהוּ
  choice: dhidi ya Amazia
  rationale: Baada ya usemi wa hasira, kihusishi hiki kinaonyesha kuwa hasira ilielekezwa kwa Amazia.
- source_word: נָבִיא
  choice: nabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mjumbe wa kinabii.
- source_word: דָרַשְׁתָּ
  choice: umeitafuta
  rationale: Neno hili linahifadhi maana pana ya kumwelekea au kumtafuta mungu, bila kulazimisha maana nyembamba ya kuabudu au kutaka shauri.
- source_word: אֱלֹהֵי הָעָם
  choice: miungu ya watu hao
  rationale: Kiwakilishi “hao” kinaonyesha kwa kawaida kuwa ni watu waliotajwa katika muktadha, bila kuongeza jina la taifa lisilomo katika mstari.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: ambayo haikuwaokoa
  rationale: Tafsiri hii inasema kwamba miungu hiyo haikuwaokoa watu wao; haisemi kwa kuongeza kwamba haikuwa na uwezo wa kuwaokoa.
- source_word: עַמָּם
  choice: watu wao
  rationale: Inahifadhi kiambishi cha umilikaji cha wingi kinachorejelea miungu bila kuongeza neno “wenyewe.”
- source_word: מִיָּדֶךָ
  choice: kutoka mkononi mwako
  rationale: Inahifadhi taswira ya Kiebrania ya mkono kama mamlaka au nguvu, nayo inaeleweka katika Kiswahili cha kibiblia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya דָרַשׁ katika muktadha wa kidini
  choice: umeitafuta
  alternative: umeiuliza au umetaka shauri kwa miungu
  rationale: “Kutafuta” huhifadhi upana na mvutano wa neno la chanzo, ambalo linaweza kuhusisha kutaka mwongozo au kuielekea miungu kidini, bila kubainisha tendo kuliko Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa “hasira ... ikawaka” na “kutoka mkononi mwako” huhifadhi taswira muhimu za Kiebrania bila kuufanya mstari usieleweke. Alama ya tanbihi imewekwa baada ya kitenzi kinachofafanuliwa.
