base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: sw
  text: Lakini hakuwaua wana wao, kwa sababu ilikuwa imeandikwa katika Torati, katika Kitabu cha Musa, ambamo Yahwe aliamuru akisema, “Baba hawatauawa kwa sababu ya wana wao, wala wana hawatauawa kwa sababu ya baba zao; bali kila mtu atakufa kwa sababu ya dhambi yake mwenyewe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania: “Baba hawatakufa kwa sababu ya wana wao, wala wana hawatakufa kwa sababu ya baba zao.” Katika muktadha huu wa sheria, “kufa” kunamaanisha kuuawa kwa hukumu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת בְּנֵי/הֶם לֹא הֵמִית
  choice: Lakini hakuwaua wana wao
  rationale: וְ inaonyesha utofautishaji na kuuawa kwa wauaji katika mstari uliotangulia, hivyo ‘Lakini’ linafaa katika mtiririko. Hifili ya מות ina maana ya kusababisha mtu afe; katika muktadha huu wa hukumu, ‘hakuwaua’ ni Kiswahili cha kawaida na wazi. בְּנֵיהֶם imetafsiriwa ‘wana wao’ kwa uaminifu kwa nomino ya kiume ya Kiebrania.
- source_word: כִּי כַ/כָּתוּב
  choice: kwa sababu ilikuwa imeandikwa
  rationale: Kifungu hiki kinatoa sababu ya kitendo cha Amazia kwa kurejelea maandiko. Wakati uliopita ‘ilikuwa imeandikwa’ unalingana kwa kawaida na simulizi la Kiswahili bila kupoteza hali ya kudumu ya agizo.
- source_word: בַּ/תּוֹרָה בְּ/סֵפֶר מֹשֶׁה
  choice: katika Torati, katika Kitabu cha Musa
  rationale: ‘Torati’ ni neno la Kiswahili linalotambulika kwa תּוֹרָה na huhifadhi maana ya mafundisho au sheria ya Musa. Kurudiwa kwa ‘katika’ kunahifadhi muundo wa Kiebrania unaokitambulisha Kitabu cha Musa kama mahali agizo lilipoandikwa.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵ/אמֹר
  choice: ambamo Yahwe aliamuru akisema
  rationale: ‘Ambamo’ linaunganisha agizo na Torati/Kitabu cha Musa kwa Kiswahili cha asili. ‘Aliamuru akisema’ huhifadhi fomula ya kunukuu לֵאמֹר.
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים
  choice: Baba hawatauawa kwa sababu ya wana wao
  rationale: Ingawa kitenzi cha Kiebrania kwa umbo ni ‘hawatakufa,’ muktadha wa sheria ya adhabu unaonyesha kuuawa kwa mamlaka ya hukumu. ‘Kwa sababu ya’ linaonyesha uwajibikaji unaowakilishwa na עַל. Kiwakilishi ‘wao’ kinafanya uhusiano wa kifamilia uwe wazi katika Kiswahili.
- source_word: וּ/בָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: wala wana hawatauawa kwa sababu ya baba zao
  rationale: Muundo huu unaendeleza ulinganifu wa kisheria wa kifungu cha kwanza. ‘Wala’ ni kiunganishi cha kawaida cha Kiswahili baada ya kauli hasi, na ‘baba zao’ hufafanua uhusiano unaokusudiwa.
- source_word: כִּי אִישׁ בְּ/חֶטְא/וֹ יָמוּתוּ
  choice: bali kila mtu atakufa kwa sababu ya dhambi yake mwenyewe
  rationale: אִישׁ ina nguvu ya kugawa wajibu kwa kila mmoja; ‘kila mtu’ ni Kiswahili cha kawaida kisichoongeza kizuizi kisichokusudiwa. ‘Yake mwenyewe’ hudhihirisha uwajibikaji binafsi uliomo katika kiambishi cha umilikaji. Kitenzi cha wingi cha Kiebrania kinafuata maana ya mgawanyo, hivyo umoja wa Kiswahili unafaa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה. ‘Yahwe’ ni umbo linalofaa matamshi na tahajia ya Kiswahili huku likihifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kisheria ya לֹא יָמוּתוּ katika nukuu
  choice: hawatauawa
  alternative: hawatakufa
  rationale: Muktadha unahusu adhabu iliyotekelezwa na mfalme na unanukuu sheria ya kutowaua watu kwa kosa la jamaa zao. Tafsiri kuu inaweka wazi maana hiyo ya kimahakama, huku tanbihi ikihifadhi umbo halisi na uwezekano wa kisemantiki wa ‘kufa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Torati’ na ‘Kitabu cha Musa’ ni istilahi zinazotambulika; sentensi ya sheria imewekwa kwa ulinganifu wa wazi. Alama ya tanbihi [a] imewekwa baada ya nukuu nzima kwa kuwa inaeleza vifungu vyote viwili vya usemi wa kisheria.
