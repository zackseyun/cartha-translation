  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Amazia hakuwaua wana wa waliouawa katika mstari uliotangulia; sababu yake ni maandishi ya Torati katika Kitabu cha Musa; na nukuu ya sheria inadumisha ulinganifu wa baba/wana pamoja na kanuni ya uwajibikaji binafsi. “Hawatauawa” hufafanua kwa halali maana ya kimahakama ya יָמוּתוּ katika muktadha huu, ilhali tanbihi huhifadhi usemi wa karibu zaidi wa “hawatakufa.”'
