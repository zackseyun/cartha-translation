base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: sw
  text: Lakini watu wa kikosi ambao Amazia aliwarudisha ili wasiende pamoja naye vitani walivamia miji ya Yuda, kuanzia Samaria mpaka Beth-horoni, wakawaua watu elfu tatu miongoni mwao na kuteka nyara nyingi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: watu wa kikosi
  rationale: Kirai hiki kihalisi ni ‘wana wa kikosi’, lakini ni nahau inayomaanisha watu au askari wa kikosi. ‘Watu wa kikosi’ ni Kiswahili cha kawaida na hakiongezi wazo lisilo katika maandishi.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ
  choice: ambao Amazia alikuwa amewarudisha
  rationale: Hifili ya שוב hapa ina maana ya kusababisha warudi. ‘Alikuwa amewarudisha’ huonyesha kitendo kilichotangulia uvamizi.
- source_word: מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: wasiende pamoja naye vitani
  rationale: Muundo huu unaonyesha kwamba walizuiwa kuandamana na Amazia kwenda vitani. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi uhusiano huo.
- source_word: וַיִּפְשְׁטוּ
  choice: walivamia
  rationale: Katika muktadha wa kijeshi, פשט hueleza kuvamia au kufanya shambulio la ghafla. ‘Walivamia’ ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: בְּעָרֵי יְהוּדָה
  choice: miji ya Yuda
  rationale: עָרִים inaweza kumaanisha miji au miji midogo; ‘miji’ ni neno la kawaida na lenye hadhi katika muktadha huu.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: kuanzia Samaria mpaka Beth-horoni
  rationale: Muundo מן...ועד huonyesha mipaka ya eneo la uvamizi. ‘Kuanzia ... mpaka ...’ huwasilisha wazi upeo huo wa kijiografia.
- source_word: וַיַּכּוּ מֵהֶם
  choice: wakawaua watu ...
  rationale: Ingawa נכה kwa msingi ni ‘kupiga’, katika muktadha huu wa kijeshi pamoja na idadi ya wahanga inaonyesha kuua. ‘Wakawaua’ hutoa maana ya muktadha kwa uwazi bila nahau nzito.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: elfu tatu
  rationale: Ni tafsiri ya moja kwa moja ya idadi hiyo.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: na kuteka nyara nyingi
  rationale: Muundo wa mzizi mmoja unasisitiza wingi wa nyara. ‘Kutek(a) nyara nyingi’ ni usemi wa asili wa Kiswahili unaohifadhi msisitizo huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mwendo wa simulizi la Kiebrania huku ikitumia miundo inayoeleweka kwa urahisi. Jina Beth-horoni limeandikwa kwa namna iliyozoeleka katika matamshi ya Kiswahili.
