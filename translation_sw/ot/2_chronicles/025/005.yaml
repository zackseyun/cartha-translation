  text: וַ/יִּקְבֹּ֤ץ אֲמַצְיָ֨הוּ֙ אֶת יְהוּדָ֔ה וַ/יַּֽעֲמִידֵ֣/ם לְ/בֵית אָב֗וֹת לְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וּ/לְ/שָׂרֵ֣י הַ/מֵּא֔וֹת לְ/כָל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן וַֽ/יִּפְקְדֵ֗/ם לְ/מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וַ/יִּמְצָאֵ֗/ם שְׁלֹשׁ מֵא֨וֹת אֶ֤לֶף בָּחוּר֙ יוֹצֵ֣א צָבָ֔א אֹחֵ֖ז רֹ֥מַח וְ/צִנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: sw
  text: Kisha Amazia akawakusanya watu wa Yuda, akawapanga kwa nyumba za baba zao chini ya makamanda wa maelfu na makamanda wa mamia, kwa Yuda yote na Benyamini. Akawahesabu wale wenye umri wa miaka ishirini na kuendelea, akakuta wanaume vijana[a] 300,000, waliokuwa tayari kwenda vitani[b], wenye kushika mkuki na ngao kubwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaume bora” au “wanaume teule.” Neno la Kiebrania בָּחוּר linaweza kumaanisha kijana, lakini katika hesabu hii ya kijeshi huenda linakazia wanaume walio bora au wenye uwezo wa kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wanaotoka kwenda vitani”; hii ni nahau ya Kiebrania kuhusu watu waliostahili au waliokuwa tayari kwa huduma ya kijeshi.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania צִנָּה hutaja hasa ngao kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: akawakusanya
  rationale: Kitenzi קבץ humaanisha kukusanya; uchaguzi huu ni wa kawaida na unaonyesha tendo lenyewe bila kuongeza wazo lisilo wazi la gwaride rasmi la kijeshi.
- source_word: וַיַּעֲמִידֵם
  choice: kuwapanga
  rationale: Katika Hifili, עמד inaweza kumaanisha kusimamisha, kuweka, au kupanga. Hapa muktadha ni wa kuwaweka wanajeshi katika muundo wa kiutawala na kijeshi.
- source_word: לְבֵית אָבוֹת
  choice: kulingana na koo za baba zao
  rationale: Kirai hiki kinataja mgawanyo wa watu kwa jamaa au nyumba za ukoo wa upande wa baba. ‘Koo za baba zao’ ni wazi kwa msomaji wa sasa na huhifadhi muundo huo wa kijamii.
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: chini ya makamanda wa maelfu na makamanda wa mamia
  rationale: שׂרים ni viongozi au maofisa; ‘makamanda’ inafaa katika muktadha wa kijeshi, huku maelfu na mamia yakihifadhi ngazi za uongozi za Kiebrania.
- source_word: לְכָל יְהוּדָה וּבִנְיָמִן
  choice: katika Yuda yote na Benyamini
  rationale: Kirai kinaonyesha upeo wa zoezi la kupanga na kuhesabu katika Yuda na Benyamini; ‘katika’ ni ya asili kwa Kiswahili na hailazimishi maana nyembamba zaidi.
- source_word: וַיִּפְקְדֵם
  choice: Akawahesabu
  rationale: Katika muktadha wa kijeshi פקד humaanisha kuhesabu au kukagua walio tayari kwa huduma. ‘Akawahesabu’ ni wazi na matokeo ya sensa yanafuata mara moja.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: wale wenye umri wa miaka ishirini na kuendelea
  rationale: Hii ni kauli ya kawaida ya kuweka kiwango cha chini cha umri; tafsiri hii ni Kiswahili cha sasa na sahihi.
- source_word: וַיִּמְצָאֵם
  choice: akakuta
  rationale: מצא hapa inaleta matokeo ya kuhesabu. ‘Akakuta’ huunganisha kwa kawaida tendo la kuhesabu na jumla iliyopatikana.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 300,000
  rationale: Ni idadi ya moja kwa moja; tarakimu zinaeleweka kwa urahisi katika maandishi ya kisasa.
- source_word: בָּחוּר
  choice: wanaume waliochaguliwa
  rationale: בָּחוּר inaweza kumaanisha vijana au wanaume walio bora/teule. Katika sensa hii ya kijeshi, ‘waliochaguliwa’ huonyesha uwezo wao wa huduma bila kuficha maana mbadala, ambayo imewekwa katika tanbihi.
- source_word: יוֹצֵא צָבָא
  choice: walioweza kwenda vitani
  rationale: Kihalisi kirai hiki ni ‘wanaotoka kwenda vitani,’ nahau ya kustahili au kuwa tayari kwa huduma ya kijeshi. Tafsiri hii ni ya asili na bado inabaki karibu na taswira ya chanzo.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: kutumia mkuki na ngao kubwa
  rationale: אֹחֵז ni kushika au kumudu silaha katika muktadha huu. צִנָּה hutaja ngao kubwa hasa, kwa hiyo ukubwa wake umeelezwa katika matini.
