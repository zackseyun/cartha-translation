base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: sw
  text: Lakini Amazia hakusikiliza, kwa maana jambo hilo lilitoka kwa Mungu, ili awakabidhi mikononi mwa adui zao[a], kwa sababu walikuwa wameitafuta miungu ya Edomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mkononi.” Hii ni nahau yenye maana ya kuwakabidhi chini ya mamlaka ya mwingine. Maneno “adui zao” yanaeleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hakusikiliza
  rationale: Katika muktadha wa kukataa onyo au shauri, kitenzi hiki humaanisha kutii au kuzingatia, si kusikia sauti tu.
- source_word: מֵהָאֱלֹהִים הִיא
  choice: jambo hilo lilitoka kwa Mungu
  rationale: Kiwakilishi cha kike kinaelekea kurejelea hali au tukio lililotangulia. Kauli hii ni ya kawaida katika Kiswahili na inadumisha wazi uhusika wa Mungu bila kubainisha zaidi jambo linalorejelewa.
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili linaonyesha kusudi au matokeo yaliyokusudiwa; “ili” huwasilisha maana hiyo kwa ufupi na kwa ufasaha.
- source_word: תִּתָּם בְּיָד
  choice: ili awakabidhi mikononi mwa adui zao
  rationale: Muundo wa Kiebrania wa ‘kutoa mkononi’ ni nahau ya kumweka mtu chini ya mamlaka ya mwingine. “Awakabidhi mikononi” ni nahau ya asili ya Kiswahili; ‘adui zao’ imefafanuliwa kutokana na muktadha wa simulizi na imeelezwa katika tanbihi.
- source_word: דָרְשׁוּ
  choice: walikuwa wameitafuta
  rationale: Kitenzi kinaweza kumaanisha kumtafuta, kumwendea, au kutegemea mungu. “Kuitafuta” inadumisha upana wa maana ya chanzo bila kuibana kuwa kuabudu au kuuliza shauri pekee.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: miungu ya Edomu
  rationale: Huu ni uhusiano wa moja kwa moja unaotaja miungu iliyoabudiwa na Waedomu.
theological_decisions:
- issue: Uhusika wa Mungu katika kukataa kwa Amazia kusikiliza na kushindwa kwake
  choice: Aya inasema wazi kwamba jambo hilo lilitoka kwa Mungu na lilikuwa na kusudi la kuwakabidhi kwa adui kwa sababu ya kuigeukia miungu ya Edomu.
  alternative: Kauli hiyo ingeweza kulegezwa ili kumaanisha kwamba Mungu aliruhusu tu jambo hilo kwa njia ya uongozi wake.
  rationale: Kiebrania kinasema wazi ‘lilitoka kwa Mungu’ na kinatumia לְמַעַן kuonyesha kusudi au matokeo yaliyokusudiwa. Tafsiri inadumisha mvutano huo wa kiteolojia bila kuupunguza wala kuufafanua kupita maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Hakusikiliza” na “awakabidhi mikononi” ni miundo ya sasa na ya asili; tafsiri inadumisha uhusika wa Mungu na upana wa maana ya ‘kutafuta’ miungu.
