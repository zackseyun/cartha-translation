base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: sw
  text: Umesema, “Tazama, umeishinda Edomu, na moyo wako umekuinua ili ujivune.”[a] Sasa kaa nyumbani. Kwa nini ujitafutie maafa, ukaanguka, wewe pamoja na Yuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wako umekuinua ili ujitukuze,” au “ili upate utukufu.” Usemi wa Kiebrania unaweza kuonyesha majivuno au kujitafutia heshima baada ya ushindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Umesema
  rationale: Kauli timilifu ya Qal, nafsi ya pili umoja wa kiume, inaanzisha maneno yanayoripotiwa; wakati timilifu ni wa kawaida na wa asili katika Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Chembe hii ya kuonyesha na kusisitiza imetafsiriwa kwa neno la sasa lenye hadhi, bila kutumia mtindo wa kizamani.
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: umeishinda Edomu
  rationale: Katika muktadha wa kijeshi, Hifili ya נכה ina maana ya kupiga au kushinda. ‘Umeishinda’ inaweka wazi ushindi wa kijeshi kwa Kiswahili cha kawaida.
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: moyo wako umekuinua
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ambayo moyo humwinua mtu na hivyo kumfanya awe na majivuno.
- source_word: לְהַכְבִּיד
  choice: ukajivuna
  rationale: Katika karipio hili, kitenzi kinaonyesha kujitukuza au kutafuta utukufu baada ya ushindi. ‘Ukajivuna’ ni ya asili na huonyesha matokeo ya moyo kuinuliwa.
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: Sasa kaa nyumbani
  rationale: Amri ya kukaa katika nyumba ni nahau ya kubaki alipo badala ya kwenda vitani; ‘kaa nyumbani’ ni wazi na ya kawaida.
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: Kwa nini uchokoze maafa
  rationale: Hitpaeli ya גרה ina wazo la kuchochea au kuanzisha mapambano, na רעה hapa ni maafa au msiba, si uovu wa kimaadili.
- source_word: וְנָפַלְתָּ
  choice: ukaanguka
  rationale: Muundo huu unaonyesha matokeo yanayotarajiwa ya kuchokoza maafa. ‘Ukaanguka’ huhifadhi mtiririko wa onyo bila kuufanya utabiri usioepukika.
- source_word: אַתָּה וִיהוּדָה עִמָּךְ
  choice: wewe pamoja na Yuda
  rationale: Maneno haya yanasisitiza kwamba kuanguka kwa mfalme kungeihusisha pia Yuda.
