  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: sw
  text: Pia aliajiri kutoka Israeli wapiganaji hodari laki moja kwa talanta mia moja za fedha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mashujaa wenye nguvu” au “wanaume hodari wa vita.” Kirai cha Kiebrania humaanisha wanaume wenye uwezo wa kupigana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: aliajiri
  rationale: Kitenzi שׂכר katika Qal humaanisha kuajiri kwa malipo. “Aliajiri” ni tafsiri ya moja kwa moja bila kuongeza dhana ya wanajeshi mamluki.
- source_word: מִיִּשְׂרָאֵל
  choice: kutoka Israeli
  rationale: Kihusishi מן huonyesha chanzo; hapa Israeli ni ufalme wa kaskazini ambako askari hao walitoka.
- source_word: מֵאָה אֶלֶף
  choice: laki moja
  rationale: Hii ndiyo namna ya kawaida na ya asili ya kusema 100,000 katika Kiswahili.
- source_word: גִּבּוֹר חָיִל
  choice: mashujaa
  rationale: Kirai hiki humaanisha watu hodari na wenye uwezo wa kupigana. “Mashujaa” ni neno la kawaida la kijeshi katika Kiswahili, huku tanbihi ikihifadhi upana wa maana.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: kwa talanta mia moja za fedha
  rationale: Kihusishi ב hapa huonyesha bei au malipo. Tafsiri inahifadhi kipimo cha kale “talanta” bila kukigeuza kuwa kipimo cha kisasa.
