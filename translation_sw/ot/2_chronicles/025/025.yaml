base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: sw
  text: Amazia mwana wa Yoashi, mfalme wa Yuda, aliishi miaka kumi na mitano baada ya kifo cha Yoashi mwana wa Yehoahazi, mfalme wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “aliishi miaka kumi na mitano baada ya kifo cha Yoashi.” Maana yake ni kwamba Amazia aliendelea kuwa hai kwa miaka kumi na mitano baada ya Yoashi wa Israeli kufa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi חיה hapa kinaeleza kuendelea kuwa hai kwa muda uliotajwa. “Aliishi” ni tafsiri ya moja kwa moja na ya kawaida; wazo la kumzidi mwingine kwa kuishi linafafanuliwa katika tanbihi.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶן
  choice: mwana wa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutambulisha ukoo wa mtu.
- source_word: יוֹאָשׁ
  choice: Yoashi
  rationale: Umbo la jina linalotumika kwa kawaida katika Kiswahili; wafalme hao wawili wanatofautishwa kwa majina ya baba zao na falme zao.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Tafsiri ya kawaida na ya wazi ya cheo cha kifalme juu ya Yuda.
- source_word: אַחֲרֵי מוֹת
  choice: baada ya kifo cha
  rationale: Inahifadhi muundo wa Kiebrania wenye nomino “kifo” na kueleza mfuatano wa wakati kwa Kiswahili cha kawaida.
- source_word: יְהוֹאָחָז
  choice: Yehoahazi
  rationale: Unukuzi wa jina la Kiebrania unaolingana na mazoea ya majina ya Biblia katika Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Tafsiri ya kawaida na ya wazi ya cheo cha kifalme juu ya Israeli.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: miaka kumi na mitano
  rationale: Ni namna ya kawaida ya Kiswahili ya kutaja muda huo.
