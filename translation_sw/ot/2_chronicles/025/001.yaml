base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: sw
  text: Amazia alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, naye alitawala huko Yerusalemu kwa miaka ishirini na tisa. Mama yake aliitwa Yehoadani, naye alitoka Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri, kihalisi ‘mwana wa miaka ishirini na mitano.’ Kiswahili cha kawaida hutumia ‘alikuwa na umri wa miaka...’.
- source_word: מָלַךְ
  choice: alipoanza kutawala
  rationale: Katika matumizi ya kwanza, kitenzi kinaonyesha kutwaa ufalme katika fomula ya kutaja umri wa mfalme; ‘alipoanza kutawala’ ni sahihi na ya asili katika Kiswahili.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה
  choice: kwa miaka ishirini na tisa
  rationale: Kirai hiki kinataja muda wa utawala; ‘kwa’ huonyesha kipindi hicho kwa Kiswahili cha kawaida.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Katika matumizi ya pili, kitenzi kinahusu muda aliokuwa mfalme, hivyo ‘alitawala’ linafaa.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi kinaonyesha mahali pa utawala; ‘huko Yerusalemu’ ni usemi wa asili wa Kiswahili.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Huwasilisha kwa lugha laini ya kisasa maana ya ‘na jina la mama yake lilikuwa’ bila kupoteza habari.
- source_word: יְהוֹעַדָּן
  choice: Yehoadani
  rationale: Jina limetoholewa kwa tahajia inayofuata kwa karibu matamshi ya Kiebrania na kanuni za Kiswahili.
- source_word: מִירוּשָׁלָיִם
  choice: alikuwa mwenyeji wa Yerusalemu
  rationale: Kihusishi מִן kinaonyesha asili; katika muktadha huu ‘mwenyeji wa Yerusalemu’ hueleza kwa kawaida kwamba mama yake alitoka huko.
