source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֞ל יְחִזְקִיָּ֣הוּ הַ/מֶּ֗לֶךְ וִֽ/ישַֽׁעְיָ֧הוּ בֶן אָמ֛וֹץ הַ/נָּבִ֖יא עַל זֹ֑את וַֽ/יִּזְעֲק֖וּ הַ/שָּׁמָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: sw
  text: Ndipo Mfalme Hezekia na nabii Isaya mwana wa Amozi wakasali kuhusu jambo hilo, wakapaza kilio kuelekea mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea mbingu.” Nomino ya Kiebrania ina umbo la wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: wakasali
  rationale: Kitenzi hiki kwa kawaida humaanisha kusali. Ingawa kitenzi cha kwanza katika Kiebrania kiko katika umoja kabla ya kiima ambatano, Kiswahili cha kawaida hutumia wingi kwa Hezekia na Isaya kwa pamoja.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: Mfalme Hezekia
  rationale: Jina na cheo vimehifadhiwa kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וִישַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: nabii Isaya mwana wa Amozi
  rationale: Cheo, jina, na utambulisho wa ukoo vimehifadhiwa kwa lugha ya kawaida na yenye heshima.
- source_word: עַל זֹאת
  choice: kuhusu jambo hilo
  rationale: Kirai hiki kinaonyesha jambo lililowasukuma kusali. Tafsiri hii huhifadhi maana ya 'kuhusu jambo hili/hilo' bila kulazimisha uhusiano wa kisababishi pekee.
- source_word: וַיִּזְעֲקוּ
  choice: wakapaza kilio
  rationale: זעק huonyesha kilio cha dharura au cha kuomba msaada; 'wakapaza kilio' huhifadhi uzito huo kuliko 'wakaita'.
- source_word: הַשָּׁמָיִם
  choice: kuelekea mbinguni
  rationale: Hii ni lugha ya kawaida ya Kiswahili kwa kilio kinachoelekezwa juu, huku tanbihi ikitaja kwamba nomino ya Kiebrania ina umbo la wingi.
theological_decisions:
- issue: Mwelekeo wa kilio katika הַשָּׁמָיִם
  choice: kuelekea mbinguni
  alternative: kuelekea mbingu
  rationale: Tafsiri inaonyesha kilio kilichoelekezwa kwenye ulimwengu wa juu bila kuongeza wazi 'kwa Mungu,' jambo ambalo halisemwi moja kwa moja katika kirai hiki.
- issue: Maana ya עַל זֹאת katika muktadha wa sala
  choice: kuhusu jambo hilo
  alternative: kwa sababu ya jambo hilo
  rationale: Kiebrania kinaweza kueleweka kuwa jambo hilo ndilo lililohusu sala au lililoisababisha. 'Kuhusu jambo hilo' huhifadhi kwa upana zaidi uhusiano huo bila kuufanya wa kisababishi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku vyeo na utambulisho wa wahusika vikihifadhiwa.
