  source_fidelity: Tafsiri inahifadhi wahusika wote wawili, vyeo vyao, utambulisho wa Isaya kama mwana wa Amozi, tendo la kusali kuhusu jambo lililotajwa, na kilio cha dharura kilichoelekezwa mbinguni. Wingi wa Kiswahili katika “wakasali” ni wa kawaida na unaeleza vizuri kiima cha pamoja, licha ya umoja wa kitenzi cha kwanza cha Kiebrania.
