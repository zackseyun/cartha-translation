  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: sw
  text: Akaweka makamanda wa jeshi kuwaongoza watu, akawakusanya pamoja naye katika uwanja kwenye lango la mji, akawatia moyo[a] akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akazungumza na mioyo yao,” nahau yenye maana ya kusema kwa namna ya kuwatia moyo au kuwaimarisha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akaweka
  rationale: Katika muundo huu kitenzi kina maana ya kumweka mtu katika wadhifa au jukumu; “akaweka” ni cha kawaida na kinaendana vizuri na kirai “kuwaongoza watu.”
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: makamanda wa jeshi
  rationale: Kirai hiki kinawataja viongozi wa kijeshi; “makamanda wa jeshi” ni Kiswahili cha sasa, wazi na chenye hadhi.
- source_word: עַל הָעָם
  choice: kuwaongoza watu
  rationale: Kihusishi עַל katika muktadha wa kuwekwa madarakani huonyesha mamlaka au usimamizi. Tafsiri hii inaeleza uhusiano huo kwa Kiswahili cha asili.
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: akawakusanya mbele yake
  rationale: Huhifadhi tendo la kuwakusanya kwake Hezekia na kwa Kiswahili huonyesha kwamba aliwaita wakutane mahali alipokuwa.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: katika uwanja wa lango la mji
  rationale: רְחוֹב ni eneo la wazi au uwanja uliokuwa karibu na lango; usemi huu unahifadhi mazingira ya hadhara ya mji.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: akawatia moyo
  rationale: Nahau ya Kiebrania, kihalisi kusema ‘juu ya/kwa moyo,’ humaanisha kusema kwa namna ya kutia moyo au kuimarisha. Kiswahili “akawatia moyo” huwasilisha maana yake ya kawaida.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Ni utangulizi wa kawaida wa maneno ya moja kwa moja yanayofuata katika mstari unaofuata.
