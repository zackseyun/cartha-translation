base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: sw
  text: Ni mungu gani miongoni mwa miungu yote ya mataifa haya ambaye baba zangu walimweka wakfu kwa maangamizi[a], aliyeweza kuwaokoa watu wake kutoka mkononi mwangu, hata Mungu wenu aweze kuwaokoa ninyi kutoka mkononi mwangu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye baba zangu walimweka wakfu kwa maangamizi.” Kitenzi cha Kiebrania kinamaanisha kutenga kitu kwa ajili ya kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: Ni nani miongoni mwa miungu yote ya mataifa haya
  rationale: Muundo huu unawasilisha swali la kejeli na maana ya sehemu inayodokezwa na בְּכָל kwa Kiswahili cha kawaida, huku neno אֱלֹהֵי likitafsiriwa moja kwa moja kuwa “miungu” bila maelezo ya kiitikadi.
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: ambayo baba zangu waliyaweka kwa ajili ya kuangamizwa
  rationale: 'Kitenzi חרם kina maana nzito kuliko kushinda au kuharibu tu: kinadokeza kuweka kitu kwa kusudi la kuangamizwa. “Baba zangu” huhifadhi usemi halisi wa kifalme unaoweza kumaanisha watangulizi au mababu.'
- source_word: אֲשֶׁר יָכוֹל לְהַצִּיל אֶת עַמּוֹ
  choice: aliyeweza kuwaokoa watu wake
  rationale: Umoja katika “aliyeweza” na “watu wake” unafuata swali “ni nani” linalomtazama kila mungu mmoja mmoja. “Kuokoa” ni Kiswahili cha asili kwa נצל katika muktadha wa kukombolewa kutoka katika nguvu ya adui.
- source_word: מִיָּדִי
  choice: kutoka mkononi mwangu
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania ya mkono kama mamlaka au nguvu, nayo inaeleweka wazi kwa Kiswahili.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: hata Mungu wenu aweze
  rationale: “Hata ... aweze” huunganisha ulinganisho wa kejeli na huonyesha kutokuamini kwa msemaji, badala ya kuifanya sentensi kuwa taarifa rahisi ya wakati ujao.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: kuwaokoa ninyi
  rationale: Kitenzi נצל kimetafsiriwa kwa uthabiti kama “kuokoa”; kiwakilishi huru “ninyi” kimewekwa ili kusisitiza walengwa wa tisho hilo.
theological_decisions:
- issue: Maana ya חרם katika majivuno ya mfalme wa Ashuru
  choice: waliyaweka kwa ajili ya kuangamizwa
  alternative: waliyaangamiza kabisa
  rationale: Chaguo hili huhifadhi wazo la kutenga au kuweka kwa kusudi la maangamizi, badala ya kupunguza maana kuwa uharibifu wa kawaida. Tanbihi inaweka wazi maana hiyo bila kuingiza mafundisho yasiyotajwa katika mstari.
- issue: Kutaja miungu ya mataifa
  choice: miungu
  alternative: miungu inayoitwa hivyo / sanamu
  rationale: Kiebrania kinatumia אֱלֹהֵי moja kwa moja katika hotuba ya msemaji. Tafsiri haiongezi tathmini kama “inayoitwa hivyo,” wala haibadili neno kuwa “sanamu.”
- issue: Kutokuamini kwamba Mungu wa Yuda anaweza kuokoa
  choice: hata Mungu wenu aweze
  alternative: je, Mungu wenu ataweza
  rationale: Muundo teule huhifadhi hoja ya kejeli inayounganisha sehemu mbili za swali, bila kuthibitisha wala kukanusha madai ya msemaji kwa sauti ya mtafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa swali moja refu umehifadhiwa ili kuendeleza nguvu ya kejeli ya msemaji. “Kutoka mkononi mwangu” limehifadhiwa kama tamathali iliyo wazi katika Kiswahili.
