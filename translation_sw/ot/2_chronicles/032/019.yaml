  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: sw
  text: Nao wakasema dhidi ya Mungu wa Yerusalemu[a], kama walivyosema dhidi ya miungu ya mataifa ya dunia—miungu ambayo ni kazi ya mikono ya wanadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao wakasema kwa Mungu wa Yerusalemu kama walivyosema dhidi ya miungu ya mataifa ya dunia.” Kihusishi cha Kiebrania kinaweza kutafsiriwa moja kwa moja kuwa “kwa,” lakini muktadha unaonyesha maneno ya uhasama.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kazi ya mikono ya mwanadamu.” Hapa “mwanadamu” humaanisha wanadamu kwa ujumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Nao wakasema
  rationale: Kitenzi דּבר katika piel kina maana ya kawaida ya ‘kusema’ au ‘kunena.’ Kiunganishi ‘Nao’ kinaendeleza simulizi, huku muktadha na kihusishi kinachofuata vikionyesha kuwa maneno hayo yalikuwa ya uhasama.
- source_word: אֶל
  choice: dhidi ya
  rationale: Ingawa אֶל kwa kawaida humaanisha ‘kwa’ au ‘kuelekea,’ hapa muktadha wa dhihaka na kukufuru unahitaji usemi wa Kiswahili ‘kusema dhidi ya.’ Maana ya msingi zaidi imehifadhiwa katika tanbihi.
- source_word: אֱלֹהֵי יְרוּשָׁלִָם
  choice: Mungu wa Yerusalemu
  rationale: Umbo אֱלֹהֵי linaweza kuwa na maana ya umoja linapomtaja Mungu wa Israeli. Muktadha unamtofautisha Mungu huyo mmoja na miungu iliyotengenezwa na wanadamu.
- source_word: כְּעַל
  choice: kama walivyosema dhidi ya
  rationale: Tafsiri hii ya kiidiomu inaonyesha ulinganisho wa namna walivyomsema Mungu wa Yerusalemu na namna walivyoisema miungu ya mataifa, huku ikihifadhi hali ya uhasama katika muktadha.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: miungu ya mataifa ya dunia
  rationale: Hapa אֱלֹהֵי ina maana ya wingi. ‘Mataifa ya dunia’ ni Kiswahili cha kawaida kinachowasilisha upana wa עַמֵּי הָאָרֶץ, badala ya kuifanya sentensi ihusu nchi moja tu.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: kazi ya mikono ya wanadamu
  rationale: Usemi huu unaonyesha kwamba miungu hiyo ni vitu vilivyotengenezwa na watu. Tafsiri inahifadhi picha halisi ya Kiebrania na maana ya jumla ya הָאָדָם.
theological_decisions:
- issue: Ikiwa maneno yalielekezwa ‘kwa’ Mungu wa Yerusalemu au yalisemwa ‘dhidi ya’ Mungu huyo
  choice: dhidi ya
  alternative: kwa
  rationale: Muktadha wa karibu unaonyesha dhihaka na kukufuru kwa watumishi wa Senakeribu. ‘Dhidi ya’ huwasilisha nguvu ya uhasama ya kifungu bila kuongeza dai jingine la kiteolojia; maana halisi zaidi ya kihusishi imetajwa katika tanbihi.
- issue: Ikiwa אֱלֹהֵי יְרוּשָׁלִָם itafsiriwe kwa umoja au wingi
  choice: Mungu wa Yerusalemu
  alternative: miungu ya Yerusalemu
  rationale: Ingawa umbo hilo linafanana na wingi wa kimofolojia, אֱלֹהִים hutumiwa mara nyingi kwa maana ya umoja kumhusu Mungu wa Israeli. Tofauti iliyowekwa na mwandishi kati yake na miungu iliyofanywa kwa mikono ya wanadamu inathibitisha umoja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Dashibodi inabainisha kuwa kirai cha mwisho kinaielezea miungu ya mataifa, si Mungu wa Yerusalemu.
