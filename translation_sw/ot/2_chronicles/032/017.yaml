language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: sw
  text: 'Pia aliandika barua ili kumtukana Yahweh[a], Mungu wa Israeli, na kunena dhidi yake, akisema: “Kama vile miungu ya mataifa ya nchi mbalimbali haikuwaokoa watu wake kutoka mkononi mwangu, vivyo hivyo Mungu wa Hezekia hatawaokoa watu wake kutoka mkononi mwangu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumkashifu” au “kumdhihaki.” Kitenzi cha Kiebrania kina maana ya kutukana, kukashifu, au kuvunjia heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: Pia aliandika barua
  rationale: סְפָרִים katika muktadha huu ni barua zilizoandikwa; וּ inaendeleza simulizi na imewasilishwa kwa ‘Pia’.
- source_word: לְחָרֵף
  choice: za kumtukana
  rationale: חרף humaanisha kukashifu, kutukana, au kudhihaki kwa dharau. ‘Kumtukana’ linaonyesha wazi uhasama wa kauli hiyo bila kupunguza uzito wake.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo wa kisifa unamtambulisha Yahweh kuwa Mungu wa Israeli.
- source_word: וְלֵאמֹר עָלָיו
  choice: na kusema dhidi yake
  rationale: Katika muktadha huu עָלָיו inaonyesha maneno ya uhasama yanayoelekezwa dhidi ya Yahweh.
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: Kama vile miungu ya mataifa ya nchi mbalimbali
  rationale: כֵּ huanzisha ulinganisho; ‘nchi mbalimbali’ huwasilisha wingi wa הָאֲרָצוֹת kwa Kiswahili cha kawaida bila kupoteza maana.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: haikuwaokoa watu wake
  rationale: נצל katika Hiphil ni kuokoa au kukomboa kutoka hatarini; wakati uliopita unafaa madai kuhusu mataifa yaliyoshindwa tayari.
- source_word: מִיָּדִי
  choice: kutoka mkononi mwangu
  rationale: Hifadhi sitiari ya Kiebrania ya ‘mkono’ inayomaanisha mamlaka au nguvu ya mtu.
- source_word: כֵּן לֹא יַצִּיל
  choice: vivyo hivyo ... hatawaokoa
  rationale: כֵּן ni upande wa pili wa ulinganisho, na kurudia ‘kuokoa’ kunahifadhi usambamba wa kejeli.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: Mungu wa Hezekia
  rationale: Huhifadhi muundo na sauti ya dharau ya msemaji anayemwita Yahweh Mungu wa Hezekia.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Kiwakilishi kinarejelea watu wa Mungu wa Hezekia.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Dai la Senakeribu kuhusu Yahweh
  choice: Limehifadhiwa kama maneno ya moja kwa moja ya kejeli
  alternative: Kulainisha dai ili kuonyesha mapema kuwa ni la uongo
  rationale: Mstari unaripoti kwa makusudi kufuru ya mfalme; tafsiri haiidhinishi dai hilo wala kulisahihisha ndani ya nukuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya ‘mkono’ na usambamba wa sentensi ya kejeli vimehifadhiwa; ‘nchi mbalimbali’ hutumiwa kwa ufasaha wa kawaida.
