base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: sw
  text: 'Baada ya hayo, Senakeribu mfalme wa Ashuru aliwatuma watumishi wake Yerusalemu dhidi ya Hezekia mfalme wa Yuda na dhidi ya watu wote wa Yuda waliokuwa Yerusalemu, huku yeye akiwa dhidi ya Lakishi[a] na mamlaka yake yote pamoja naye[b], akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huku yeye akiwa mbele ya Lakishi” au “huku yeye akiwa ameizingira Lakishi.” Kiebrania husema kihalisi “juu ya/dhidi ya Lakishi,” usemi wa kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Au, “na utawala wake wote pamoja naye” au “na nguvu zake zote pamoja naye.” Neno la Kiebrania linaweza kumaanisha utawala, mamlaka, au eneo la utawala; katika muktadha wa kijeshi linaweza kudokeza nguvu zote zilizo chini ya amri yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha kawaida cha wakati kinachoendeleza mfuatano wa simulizi kwa Kiswahili cha asili.
- source_word: שָׁלַח
  choice: aliwatuma
  rationale: Hii ndiyo maana ya msingi ya kitenzi; kiambishi cha yambwa kinarejelea watumishi.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya kifalme neno hili linaweza kumaanisha watumishi au maafisa wa mfalme. 'Watumishi wake' linahifadhi upana wa neno la Kiebrania.
- source_word: יְרוּשָׁלַיְמָה
  choice: Yerusalemu
  rationale: He ya mwelekeo inaonyesha kwenda Yerusalemu; baada ya 'aliwatuma,' Kiswahili hakihitaji kihusishi cha ziada.
- source_word: וְהוּא עַל לָכִישׁ
  choice: wakati yeye mwenyewe alikuwa ameizingira Lakishi
  rationale: Kihusishi עַל pamoja na jina la mji katika muktadha wa kijeshi huonyesha msimamo wa uadui dhidi ya mji. 'Ameizingira' ni Kiswahili cha kawaida na kinaeleza maana ya kijeshi, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo wa Kiebrania.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: akiwa na jeshi lote lililokuwa chini ya mamlaka yake
  rationale: מֶמְשָׁלָה kimsingi ni utawala au mamlaka, lakini katika muktadha huu kitu kinachoandamana naye ni nguvu ya kijeshi iliyo chini ya utawala wake. Tafsiri hii ni wazi kwa msomaji bila kuondoa maana ya mamlaka.
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: ili wamkabili Hezekia ... na watu wote wa Yuda
  rationale: עַל inayorudiwa inaonyesha mwelekeo wa kiadui. 'Wamkabili' linafaa kwa ujumbe wa vitisho unaoelekezwa dhidi yao kuliko usemi usioegemea upande wowote.
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: waliokuwa Yerusalemu
  rationale: Kishazi hiki kinawatambulisha watu wa Yuda waliokuwapo Yerusalemu.
- source_word: לֵאמֹר
  choice: 'wakisema:'
  rationale: Ni utangulizi wa maneno ya moja kwa moja yanayofuata katika mstari unaofuata; koloni linafaa katika uakifishaji wa Kiswahili.
