translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo mrefu wa Kiebrania umegawanywa kwa vistari ili kudumisha mtiririko. Alama zote za tanbihi zimo katika matini kuu; [a] imewekwa baada ya 'Yerusalemu' karibu na kishazi inachofafanua, na [b] baada ya utangulizi wa usemi ili kubainisha kishazi cha jeshi/mamlaka.
