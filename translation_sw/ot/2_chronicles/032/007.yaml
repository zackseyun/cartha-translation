base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: sw
  text: Iweni hodari na jasiri. Msiogope wala msifadhaike mbele ya mfalme wa Ashuru, wala mbele ya umati wote ulio pamoja naye[a], kwa maana walio pamoja nasi ni wengi kuliko walio pamoja naye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jeshi lote lililo pamoja naye.” Neno la Kiebrania linaweza kumaanisha umati au kundi kubwa la wanajeshi katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa maana pamoja nasi ni zaidi kuliko pamoja naye.” Kiebrania kina ulinganisho mfupi ambao unafafanuliwa na mstari unaofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Iweni hodari na jasiri
  rationale: Vitenzi viwili vya amri vinaunda himizo la kawaida la kuwa imara na kuwa na moyo mkuu. Kauli hii ni ya asili na yenye hadhi katika Kiswahili cha sasa.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Msiogope wala msifadhaike
  rationale: ירא ni kuogopa, huku חתת katika muktadha huu ikieleza kuvunjika moyo au kufadhaika mbele ya tishio.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: mbele ya mfalme wa Ashuru
  rationale: Nahau מִפְּנֵי hapa ina maana ya kukabili uwepo au tishio la mtu; “mbele ya” huhifadhi taswira hiyo kwa Kiswahili kinachoeleweka.
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: umati wote ulio pamoja naye
  rationale: הָמוֹן inaweza kumaanisha umati au kundi kubwa, na katika muktadha wa vita inaweza pia kumaanisha jeshi. “Umati” huhifadhi upana wa neno bila kulibainisha kupita kiasi.
- source_word: עִמָּנוּ רַב מֵעִמּוֹ
  choice: walio pamoja nasi ni wengi kuliko walio pamoja naye
  rationale: 'Kiebrania kina ulinganisho mfupi usiotaja wazi wahusika: kihalisi, “pamoja nasi [ni] zaidi/kubwa kuliko pamoja naye.” Tafsiri hii huonyesha ulinganisho wa msaada au nguvu za pande mbili, huku tanbihi ikihifadhi uwezekano wa usomaji wa umoja.'
theological_decisions:
- issue: Ulinganisho wenye maneno yaliyodokezwa katika kishazi cha mwisho
  choice: walio pamoja nasi ni wengi kuliko walio pamoja naye
  alternative: aliye pamoja nasi ni mkuu kuliko aliye pamoja naye
  rationale: רַב iko katika umoja wa kisarufi, lakini kishazi ni kifupi na muktadha unalinganisha umati wa Ashuru na msaada wa upande wa Yuda. Mstari unaofuata unaeleza tofauti hiyo kwa kumtaja BWANA. Tafsiri kuu haileti mapema maelezo ya mstari unaofuata, na tanbihi huhifadhi usomaji wa umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Iweni hodari na jasiri” linafaa kwa himizo la kijeshi; “msifadhaike” huhifadhi nguvu ya kihisia bila kutumia lugha ya kizamani. Alama zote za tanbihi zimewekwa mahali zinapohusika.
