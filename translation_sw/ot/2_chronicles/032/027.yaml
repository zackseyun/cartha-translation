base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: sw
  text: Hezekia alikuwa na utajiri na heshima nyingi sana, naye akajenga maghala[a] ya kuhifadhia fedha, dhahabu, mawe ya thamani, manukato, ngao, na kila kitu cha kutamanika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyumba vya hazina.” Neno la Kiebrania linaweza kumaanisha mahali pa kuhifadhia vitu kwa ujumla au vyumba maalumu vya kuhifadhia hazina za kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au, “vyombo vyote vya thamani.” Usemi wa Kiebrania ni mpana na unaweza kujumuisha vifaa, vyombo, na vitu vingine vya thamani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: Hezekia alikuwa na
  rationale: Muundo wa Kiebrania wa kumiliki, kihalisi ‘kulikuwa kwa Hezekia,’ unasemwa kwa Kiswahili cha kawaida kuwa ‘Hezekia alikuwa na.’
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: utajiri mwingi sana na heshima kubwa sana
  rationale: ‘Utajiri’ huwasilisha mali nyingi, na ‘heshima’ huonyesha hadhi na fahari ya kifalme. Vivumishi tofauti vimetumiwa kwa ufasaha wa Kiswahili huku mkazo wa הַרְבֵּה מְאֹד ukihifadhiwa kwa ‘sana’ katika vipengele vyote viwili.
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: Akajitengenezea maghala
  rationale: ‘Akajitengenezea’ huhifadhi maana ya kufanya kwa ajili yake mwenyewe. אֹצָרוֹת inaweza kuwa maghala kwa ujumla au vyumba vya hazina; ‘maghala’ inafaa orodha pana ya vitu vinavyohifadhiwa.
- source_word: לְכֶסֶף וּלְזָהָב וּלְאֶבֶן יְקָרָה
  choice: kwa ajili ya fedha, dhahabu, mawe ya thamani
  rationale: ‘Kwa ajili ya’ huonyesha kazi ya maghala bila kulazimika kurudia kihusishi katika kila kipengele. Umoja wa אֶבֶן umetafsiriwa kwa wingi wa kijumla ‘mawe,’ ambao ni wa asili katika Kiswahili.
- source_word: וְלִבְשָׂמִים
  choice: manukato
  rationale: Neno hili linajumuisha vitu vyenye harufu nzuri, kama vikolezo au mafuta yenye harufu; ‘manukato’ ni neno pana na la kawaida katika muktadha huu wa hazina.
- source_word: וּלְמָגִנִּים
  choice: ngao
  rationale: מָגֵן humaanisha ngao hasa, si silaha au vifaa vya kijeshi kwa ujumla.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: na kila kitu chenye thamani
  rationale: כְּלֵי linaweza kumaanisha vyombo, vifaa, vitu, au mali mbalimbali, huku חֶמְדָּה ikidokeza kitu kinachotamaniwa au cha thamani. Tafsiri hii huhifadhi upana wa usemi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha imewasilishwa kwa mtiririko wa asili wa Kiswahili, huku kila kipengele cha Kiebrania kikihifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
