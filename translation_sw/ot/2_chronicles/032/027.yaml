  source_fidelity: Marekebisho yanahitajika ili kuonyesha kwa usahihi zaidi בְּשָׂמִים kama vitu vya kunukia/manukato na ili kuunganisha tanbihi b na usemi wa mwisho wa Kiebrania, si na ‘ngao.’ Tafsiri ya ‘maghala’ kwa אֹצָרוֹת inakubalika, huku tanbihi ikihifadhi uwezekano wa vyumba vya hazina.
