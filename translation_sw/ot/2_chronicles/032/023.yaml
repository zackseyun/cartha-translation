  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: sw
  text: Na watu wengi walikuwa wakileta sadaka kwa Yahweh huko Yerusalemu[a], na zawadi za thamani kwa Hezekia, mfalme wa Yuda[b]. Baada ya hayo, Hezekia akaheshimiwa sana machoni pa mataifa yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda Yerusalemu” au “katika Yerusalemu.” Kihusishi cha Kiebrania hapa kinaweza kuonyesha mahali panapoelekewa au mahali tendo lilipofanyika.
    reason: lexical_alternative
  - marker: b
    text: Au, “zawadi bora.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: watu wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinamaanisha watu wengi; kuongeza “watu” hufanya Kiswahili kiwe wazi na cha kawaida.
- source_word: מְבִיאִים
  choice: walikuwa wakileta
  rationale: Umbo la participle katika simulizi linaonyesha tendo lililokuwa likiendelea au kurudiwa.
- source_word: מִנְחָה
  choice: sadaka
  rationale: Kwa kuwa Yahweh ndiye anayepokea, neno hili lina maana ya sadaka ya kidini, bila kubainisha aina yake.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kiambishi kinaonyesha mpokeaji wa sadaka; jina la agano יְהוָה limetoholewa kuwa “Yahweh.”
- source_word: לִירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Katika muktadha huu, ל inaweza kueleweka kama kuelekea mahali au kuwa mahali; “huko Yerusalemu” ni ya asili huku tanbihi ikihifadhi uwezekano wa maana ya mwelekeo.
- source_word: מִגְדָּנוֹת
  choice: zawadi za thamani
  rationale: Neno linaonyesha vitu vya thamani au vilivyo bora vinavyotolewa kama zawadi, bila kuvifungia katika maana ya vyakula vitamu.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: kwa Hezekia, mfalme wa Yuda
  rationale: Hezekia ametajwa moja kwa moja kuwa mpokeaji wa zawadi, kisha cheo chake kinafuata kama ufafanuzi.
- source_word: וַיִּנַּשֵּׂא
  choice: akaheshimiwa sana
  rationale: Nifali hapa huonyesha kuinuliwa hadhi au sifa. Katika Kiswahili, “akaheshimiwa sana” hutoa maana hiyo kwa kawaida bila kudokeza kuinuliwa kimwili.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: machoni pa mataifa yote
  rationale: Hii inahifadhi nahau ya Kiebrania kuhusu hadhi yake ilivyoonekana na kutambuliwa hadharani na mataifa.
- source_word: מֵאַחֲרֵי כֵן
  choice: baada ya hayo
  rationale: Kirai hiki huonyesha wakati uliofuata matukio yaliyotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahweh” huhifadhi jina hilo bila kulibadili kuwa cheo.
- issue: Maana ya וַיִּנַּשֵּׂא kuhusu Hezekia
  choice: akaheshimiwa sana
  alternative: akainuliwa; akatukuzwa
  rationale: Muktadha unaeleza kupanda kwa hadhi yake mbele ya mataifa. “Akaheshimiwa sana” huepuka kuchanganya heshima ya mfalme na lugha ya ibada, huku ikihifadhi wazo la kuinuliwa kwa sifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Walikuwa wakileta” huhifadhi hali endelevu ya Kiebrania; “akaheshimiwa sana” ni ya kawaida zaidi kuliko tafsiri ya moja kwa moja “akainuliwa,” huku nahau “machoni pa” ikihifadhi ladha ya chanzo.
