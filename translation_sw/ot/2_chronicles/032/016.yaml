base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: sw
  text: Zaidi ya hayo, watumishi wake walisema dhidi ya Yahwe Mungu na dhidi ya Hezekia, mtumishi wa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wake walisema zaidi kuhusu Yahwe Mungu na kuhusu Hezekia, mtumishi wa Yahwe”; kihusishi cha Kiebrania wakati mwingine kinaweza kutafsiriwa kwa maana isiyo ya uadui, lakini hapa muktadha unapendelea “dhidi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: Zaidi ya hayo
  rationale: Inaendeleza simulizi na kuonyesha kwamba watumishi hao waliongeza maneno mengine kwa yale yaliyotangulia.
- source_word: דִּבְּרוּ
  choice: walisema
  rationale: Kitenzi hiki kwa kawaida humaanisha kusema au kunena; “walisema” ni Kiswahili cha kawaida na cha moja kwa moja hapa.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha wa kifalme neno hili linawahusu watu waliokuwa wakimtumikia mfalme wa Ashuru; “watumishi” huhifadhi upana wa neno bila kulibana kuwa “maafisa” wala kulitia nguvu kupita kiasi kuwa “watumwa.”
- source_word: עַל
  choice: dhidi ya
  rationale: Ingawa kihusishi hiki pia kinaweza kumaanisha “kuhusu,” muktadha wa maneno ya uadui na makufuru unapendelea maana ya “dhidi ya.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina binafsi la Mungu linalowakilishwa na tetragramu YHWH.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muungano “Yahwe Mungu,” Kiswahili hakihitaji kutafsiri kibainishi cha Kiebrania kwa neno tofauti; “Mungu” huhifadhi cheo kinachoambatana na jina.
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekia
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika Kiswahili cha Biblia.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Neno hili linamtaja Hezekia katika uhusiano wa huduma kwa Mungu; “mtumishi” linafaa kuliko “mtumwa,” ambalo lingeingiza mkazo wa hali ya kijamii usiolengwa hapa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kwa umbo la kawaida la Kiswahili.
- issue: Maana ya עַל baada ya דִּבְּרוּ
  choice: dhidi ya
  alternative: kuhusu
  rationale: Kihusishi chenyewe kinaweza kuwa cha upande wowote, lakini muktadha wa mashambulizi ya maneno dhidi ya Yahwe na Hezekia unapendelea maana ya uadui. Uwezekano wa maana ya upande wowote umehifadhiwa katika tanbihi.
- issue: Cheo cha Hezekia kama עַבְדּוֹ
  choice: mtumishi wake
  alternative: mtumwa wake
  rationale: Hapa neno hilo linaonyesha huduma na uaminifu wa mfalme kwa Mungu, bila kulazimisha maana ya utumwa wa kijamii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Zaidi ya hayo” huhifadhi mwendelezo na ongezeko la usemi, huku urudiaji wa “dhidi ya” ukidumisha usambamba wa Kiebrania.
