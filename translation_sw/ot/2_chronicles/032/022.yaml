  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: sw
  text: Basi Yahwe akamwokoa Hezekia na wakazi wa Yerusalemu kutoka mkononi mwa Senakeribu, mfalme wa Ashuru, na kutoka mkononi mwa wote[a]; naye akawaongoza pande zote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kutoka mkononi mwa wengine wote.” Kiebrania hakitaji wazi ni nani wanaokusudiwa na neno “wote”; huenda ni maadui au mamlaka nyingine zenye uhasama.
    reason: lexical_alternative
  - marker: b
    text: Au, “akawaongoza kila upande.” Wengine huuelewa usemi huu kwa maana pana ya kuwapa usalama pande zote.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: akamwokoa ... pamoja na
  rationale: Kitenzi ישׁע kinaonyesha kuokoa au kukomboa kutoka hatarini. Muundo huu wa Kiswahili unaonyesha kwamba Hezekia na wakazi wa Yerusalemu wote waliokolewa bila kulazimisha maana mahsusi ya ushindi wa kijeshi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kwa umbo la kawaida la Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: wakazi wa Yerusalemu
  rationale: Hii ni tafsiri ya asili na ya sasa ya Kiswahili kwa maana ya watu wanaokaa Yerusalemu.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Nahau ya Kiebrania imehifadhiwa kwa kuwa inaeleweka katika Kiswahili na huonyesha kuokolewa kutoka katika mamlaka au nguvu ya mtu.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Senakeribu, mfalme wa Ashuru
  rationale: Majina yametolewa kwa maumbo yanayotambulika katika mapokeo ya Kiswahili, huku cheo cha mfalme kikihifadhiwa.
- source_word: וּמִיַּד כֹּל
  choice: na kutoka mkononi mwa wote
  rationale: Kiebrania kinasema kwa kifupi 'wote' bila kutaja nomino inayohusika. Tafsiri haiongezi 'maadui' katika matini, hivyo utata wa chanzo unabaki.
- source_word: וַיְנַהֲלֵם
  choice: naye akawaongoza
  rationale: נהל kimsingi humaanisha kuongoza. Chaguo hili linahifadhi maana ya kileksika bila kuifafanua moja kwa moja kuwa kuwapa raha au usalama.
- source_word: מִסָּבִיב
  choice: pande zote
  rationale: Usemi huu wa kawaida wa Kiswahili huonyesha eneo linalozunguka au kila upande, huku ukiruhusu muktadha kudokeza ulinzi.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. Kulitohowa kama 'Yahwe' huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וַיְנַהֲלֵם מִסָּבִיב
  choice: naye akawaongoza pande zote
  alternative: naye akawapa usalama kila upande
  rationale: Tafsiri iliyochaguliwa hufuata maana ya kawaida ya נהל, 'kuongoza,' na haifanyi wazo linaloweza kudokezwa la usalama kuwa maana ya wazi katika matini.
- issue: Kitu kinachokusudiwa na כֹּל
  choice: wote
  alternative: maadui wengine wote
  rationale: Kwa kuwa nomino haikutajwa katika Kiebrania, matini kuu inahifadhi ufupi huo; tanbihi inaeleza uwezekano wa kimuktadha bila kuufanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ya 'kutoka mkononi mwa' imehifadhiwa, na utata wa vifungu וּמִיַּד כֹּל na וַיְנַהֲלֵם מִסָּבִיב umeonyeshwa kwa tanbihi.
