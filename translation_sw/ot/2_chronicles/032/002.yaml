  text: Hezekia alipoona kwamba Senakeribu alikuwa amekuja na kwamba nia yake ilikuwa kupigana dhidi ya Yerusalemu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno: “uso wake ulikuwa kwa vita dhidi ya Yerusalemu”; hii ni nahau inayomaanisha kwamba alikuwa ameazimia kupigana dhidi ya Yerusalemu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Kitenzi ראה katika mtiririko wa simulizi kina maana ya ‘aliona’; muundo wa Kiswahili ‘alipoona’ unaunganisha kwa kawaida tukio hili na yaliyomo aliyoyaona.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי hapa hutanguliza yaliyomo katika kile Hezekia alichokiona, hivyo ‘kwamba’ linafaa kisintaksia.
- source_word: בָא
  choice: alikuwa amekuja
  rationale: Qatal inaeleza hali iliyokuwapo wakati Hezekia alipoona; wakati timilifu wa awali unaonyesha kuwa kuja kwa Senakeribu kulitangulia kuona huko.
- source_word: סַנְחֵרִיב
  choice: Senakeribu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וּפָנָיו
  choice: nia yake ilikuwa
  rationale: Ingawa maana ya moja kwa moja ni ‘uso wake,’ katika nahau hii ‘uso’ huonyesha mwelekeo au azimio. ‘Nia yake ilikuwa’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai zaidi ya muktadha.
- source_word: לַמִּלְחָמָה
  choice: kupigana
  rationale: Nomino ‘vita/mapigano’ pamoja na nahau inayotangulia huonyesha kusudi la kijeshi; ‘kupigana’ ni usemi wa asili na wazi katika Kiswahili.
- source_word: עַל
  choice: na
  rationale: Katika Kiswahili, ‘kupigana na’ ndiyo njia ya kawaida ya kuonyesha uhasama unaoelekezwa dhidi ya mtu au mahali.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la jina la mahali lililozoeleka katika Kiswahili.
