reference: 2 Chronicles 32:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: sw
  text: Basi, msikubali Hezekia awadanganye, wala awashawishi kwa namna hii[a], wala msimwamini. Kwa maana hakuna mungu wa taifa au ufalme wowote ambaye ameweza kuwaokoa watu wake kutoka mkononi mwangu na mkononi mwa mababu zangu[b]. Sembuse Mungu wenu—hatawaokoa kutoka mkononi mwangu![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “awachochee” au “awavutie.”
    reason: lexical_alternative
  - marker: b
    text: Neno “mkono” hapa linamaanisha mamlaka au nguvu. “Mababu zangu” linaweza pia kumaanisha wafalme waliomtangulia.
    reason: cultural_note
  - marker: c
    text: Au “Kwa hakika Mungu wenu hatawaokoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaendeleza hoja ya msemaji na kuingiza himizo lake la papo hapo kwa Kiswahili cha kawaida.
- source_word: יַשִּׁיא
  choice: awadanganye
  rationale: Kitenzi kina maana ya kupotosha kwa udanganyifu; “danganya” ni wazi na cha kawaida katika muktadha huu.
- source_word: יַסִּית
  choice: awashawishi
  rationale: Hapa kinahusu Hezekia kuwavuta watu wakubali maneno yake. “Shawishi” hutofautisha wazo hili na udanganyifu wa kitenzi kilichotangulia huku tanbihi ikihifadhi maana mbadala za kuchochea au kuvutia.
- source_word: כָּזֹאת
  choice: kwa namna hii
  rationale: Inahifadhi rejeo kwa namna au maudhui ya ushawishi unaodaiwa.
- source_word: תַּאֲמִינוּ לוֹ
  choice: msimwamini
  rationale: Katika muktadha huu msemaji anawakataza watu wasikubali madai ya Hezekia kuwa ya kweli.
- source_word: לֹא יוּכַל
  choice: hakuna ... ambaye ameweza
  rationale: Wakati timilifu wa Kiswahili unaonyesha madai yanayotegemea mifano ya kihistoria ya ushindi uliopita.
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: hakuna mungu wa taifa au ufalme wowote
  rationale: Hutoa kwa Kiswahili cha asili dai la jumla kuhusu miungu ya mataifa na falme bila kubadili upeo wake.
- source_word: לְהַצִּיל
  choice: kuwaokoa
  rationale: “Okoa” linafaa kwa kuwaondoa watu katika nguvu ya adui katika muktadha wa tishio la kijeshi.
- source_word: מִיַּדִי וּמִיַּד אֲבוֹתָי
  choice: kutoka mkononi mwangu na mkononi mwa mababu zangu
  rationale: Inahifadhi sitiari iliyorudiwa ya “mkono” kama nguvu au mamlaka; “mababu” inaweza kujumuisha nasaba na watangulizi wa kifalme.
- source_word: אַף כִּי
  choice: Sembuse ... hatawaokoa
  rationale: '“Sembuse” linaonyesha hitimisho hasi lililotiwa nguvu: kwa hoja ya msemaji, Mungu wa Yuda hataweza zaidi ya miungu iliyotajwa.'
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa umbo la Kiebrania lina sura ya wingi, katika muktadha linamrejelea Mungu mmoja wa Yuda.
theological_decisions:
- issue: Rejeo la אֱלֹהֵיכֶם
  choice: “Mungu wenu” kwa umoja, akimaanisha Mungu wa Yuda/Israeli
  alternative: “miungu yenu” kwa wingi wa kimuundo
  rationale: Matumizi ya אֱלֹהִים kwa Mungu wa Israeli mara nyingi yana umbo la wingi lakini maana ya umoja; muktadha pia unaonyesha kuwa Mungu wa Yuda ndiye anayelengwa.
- issue: Hadhi ya dai kwamba Mungu hataokoa
  choice: Kuhifadhi dai hilo kama dhihaka ya msemaji wa Ashuru
  alternative: Kulainisha au kulisahihisha ili lilingane moja kwa moja na imani ya msimulizi
  rationale: Aya inanukuu tishio la adui. Tafsiri haipaswi kugeuza maneno ya mhusika kuwa uthibitisho wa msimulizi; tanbihi inazuia mkanganyiko bila kubadili matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa kwa usomaji rahisi, huku marudio ya “mkono” na msisitizo wa hoja ya msemaji yakihifadhiwa. “Sembuse” ni neno la kawaida linalobeba hoja ya kulinganisha iliyoimarishwa katika אַף כִּי.
