base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: sw
  text: Je, Hezekia hawapotoshi[a] ili mufe kwa njaa na kiu, akisema, ‘Yahwe Mungu wetu atatuokoa kutoka mkononi mwa mfalme wa Ashuru’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawadanganyi” au “hawashawishi mpotee.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwongoza mtu apotee au kumshawishi vibaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... ha-
  rationale: Muundo huu wa swali la balagha huhifadhi shtaka linalotarajia wasikilizaji wakubali.
- source_word: מַסִּית
  choice: hawapotoshi
  rationale: Kitenzi cha Kiebrania kina maana ya kumfanya mtu apotee au ashawishike vibaya; ‘kupotosha’ huhifadhi upana huo bila kukifinyanga kuwa udanganyifu tu.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: ili awaache mfe
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha kuwatoa watu waangamie, bila kuongeza wazi wakala mwingine wa kuwaua.
- source_word: בְּרָעָב וּבְצָמָא
  choice: kwa njaa na kiu
  rationale: Hutaja njia ya kufa katika hali ya kuzingirwa; ‘njaa’ inaweza kumaanisha upungufu mkubwa wa chakula na pia hali ya kuwa na njaa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu kwa umbo linalotumika na kutamkika kwa kawaida katika Kiswahili.
- source_word: יַצִּילֵנוּ
  choice: atatuokoa
  rationale: Katika muktadha huu kitenzi kinamaanisha kuokoa au kukomboa kutoka katika hatari ya kijeshi; ‘atatuokoa’ ni cha kawaida na wazi.
- source_word: מִכַּף
  choice: kutoka mkononi mwa
  rationale: Huhifadhi sitiari ya Kiebrania ya ‘mkono’ kwa mamlaka au udhibiti huku ikibaki ya kueleweka katika Kiswahili.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano lenyewe, si cheo; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Sauti ya dai kuhusu uokozi
  choice: Dai limehifadhiwa kama maneno yaliyonukuliwa ya Hezekia
  alternative: Kulieleza kama uthibitisho wa msimulizi
  rationale: Mstari unaripoti kwa kejeli shtaka la msemaji wa Ashuru; tafsiri haipaswi kuamua ndani ya mstari huu kama dai hilo litatimizwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa swali la balagha na kauli iliyonukuliwa umehifadhiwa; ‘awaache mfe’ ni wa kawaida zaidi kuliko tafsiri sisisi isiyo ya asili ya ‘awatoe mfe’.
