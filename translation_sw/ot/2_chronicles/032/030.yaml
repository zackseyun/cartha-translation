  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “Hezekia ndiye” unahifadhi msisitizo wa Kiebrania; istilahi za mfumo wa maji zimeelezwa kwa maneno ya kawaida badala ya lugha ya kitaalamu kupita kiasi.
