base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: sw
  text: Hezekia ndiye aliyeziba njia ya juu ya kutokea kwa maji ya Gihoni[a], akayaelekeza[b] chini kuelekea upande wa magharibi wa Jiji la Daudi. Hezekia akafanikiwa katika kazi yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chemchemi ya juu ya Gihoni.” Neno la Kiebrania linaweza kumaanisha mahali maji yanapotokea au, kwa maana pana zaidi, chemchemi au mtiririko wenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “akayapitisha katika mfereji” au “akayafanya yatiririke moja kwa moja.” Kitenzi cha Kiebrania hudokeza kuyaelekeza maji katika njia iliyonyooka.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָתַם
  choice: aliyeziba
  rationale: Kitenzi hiki humaanisha kufunga au kuziba uwazi; “kuziba” ni cha kawaida na kinafaa katika muktadha wa njia ya maji.
- source_word: מוֹצָא
  choice: sehemu ... ya kutokea
  rationale: Nomino hii inaonyesha mahali ambapo maji hutokea au hutiririka kutoka; tafsiri hii inaeleweka kwa urahisi bila kuamua kwamba ni chemchemi yenyewe.
- source_word: מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: sehemu ya juu ya kutokea kwa maji ya Gihoni
  rationale: Inahifadhi maana ya “juu” na uhusiano wa kirai na “maji ya Gihoni,” huku ikiepuka kufafanua kupita kiasi aina kamili ya sehemu hiyo ya maji.
- source_word: וַיַּישְּׁרֵם
  choice: akayaelekeza
  rationale: Katika hali ya kisababishi, mzizi ישר unaonyesha kuyafanya maji yaende katika njia iliyoelekezwa; “akayaelekeza” ni ya asili na haiongezi maelezo yasiyothibitishwa.
- source_word: לְמַטָּה מַּעְרָבָה
  choice: chini kuelekea upande wa magharibi
  rationale: Kauli hii inaonyesha mwendo wa kushuka na mwelekeo wa magharibi kwa pamoja.
- source_word: לְעִיר דָּוִיד
  choice: wa Jiji la Daudi
  rationale: Imeunganishwa na “upande wa magharibi” ili kuonyesha upande wa magharibi wa Jiji la Daudi, kama muktadha wa kijiografia unavyodokeza.
- source_word: וַיַּצְלַח
  choice: akafanikiwa
  rationale: Kitenzi kina maana ya kufanikiwa au kustawi; “akafanikiwa” ni cha kawaida na kinafaa kwa shughuli na miradi yake.
- source_word: מַעֲשֵׂהוּ
  choice: kazi yake yote
  rationale: Nomino ya umoja inaweza kutaja kwa ujumla shughuli zote alizofanya; Kiswahili hiki kinadumisha umoja huo na maana yake ya kijumla.
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: Hezekia ndiye
  rationale: Muundo huu wa Kiswahili unaonyesha msisitizo wa kiwakilishi pamoja na jina la mhusika kwa njia ya asili.
