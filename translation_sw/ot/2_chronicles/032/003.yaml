  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: sw
  text: Akashauriana na maafisa wake na mashujaa wake kuhusu kuyazuia maji ya chemchemi zilizokuwa nje ya mji, nao wakamsaidia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Akashauriana
  rationale: Kauli ya kutendeana ‘alishauriana’ inaonyesha kwa kawaida kwamba alitafuta na kufanya mashauri pamoja na wengine.
- source_word: שָׂרָיו
  choice: maafisa wake
  rationale: Katika mazingira haya ya utawala na kijeshi, ‘maafisa’ linafikisha maana pana ya viongozi wenye mamlaka bila kudokeza lazima kuwa walikuwa wana wa kifalme.
- source_word: גִבֹּרָיו
  choice: mashujaa wake
  rationale: ‘Mashujaa’ ni neno la kawaida na lenye heshima kwa watu hodari, hasa wapiganaji, na linahifadhi ladha ya kijeshi ya neno la Kiebrania.
- source_word: לִסְתּוֹם
  choice: kuhusu kuyaziba
  rationale: Muundo huu unaonyesha jambo lililojadiliwa na pia kusudi lake; ‘kuhusu kuyaziba’ ni Kiswahili cha asili baada ya ‘akashauriana’ na kinaeleza kuzuia kimwili vyanzo vya maji.
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: maji ya chemchemi
  rationale: Hili ni tumizi la kawaida la Kiswahili kwa maji yanayotoka katika chemchemi, na linafaa kwa mazingira ya kijiografia.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: zilizokuwa nje ya mji
  rationale: Kishazi hiki kinaonyesha wazi mahali chemchemi zilipokuwa, ng’ambo ya mipaka ya mji.
- source_word: וַיַּעְזְרֻהוּ
  choice: nao wakamsaidia
  rationale: Kitenzi kina maana ya moja kwa moja ya kumpa msaada; kiwakilishi ‘wao’ kinawarejelea maafisa na mashujaa.
