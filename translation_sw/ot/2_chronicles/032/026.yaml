source:
  edition: WLC
  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: sw
  text: Lakini Hezekia akajinyenyekeza kwa sababu ya kiburi cha moyo wake[a], yeye pamoja na wakazi wa Yerusalemu. Kwa hiyo, ghadhabu ya Yahweh haikuwajia katika siku za Hezekia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhusu kiburi cha moyo wake.” Kiebrania ni kihalisi “katika/kwa kimo cha moyo wake,” nahau inayomaanisha kiburi au majivuno ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: akajinyenyekeza
  rationale: 'Nifali hapa ina maana ya kujirejelea/kati katika muktadha: Hezekia aliitikia kwa kujishusha, si kwamba alifanywa mnyenyekevu tu.'
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: kwa sababu ya kiburi cha moyo wake
  rationale: גֹבַהּ ni ‘kimo/kuinuka’; ikiunganishwa na ‘moyo’ ni nahau ya kiburi cha ndani. ‘Kwa sababu ya’ inaeleza kwa Kiswahili cha kawaida uhusiano unaowezekana wa kisababishi wa בְּ.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלָם
  choice: yeye pamoja na wakazi wa Yerusalemu
  rationale: Kiima cha msisitizo הוּא kinamhusisha Hezekia waziwazi pamoja na wakaaji wa mji; ‘wakazi’ ni neno la kawaida na lenye heshima.
- source_word: קֶצֶף יְהוָה
  choice: ghadhabu ya Yahweh
  rationale: קֶצֶף hapa ni hasira kali ya Mungu katika hukumu; ‘ghadhabu’ huhifadhi uzito huo, na jina la agano יְהוָה limetoholewa kuwa ‘Yahweh’.
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: haikuwajia
  rationale: Nahau בוא על inaeleza jambo linalowajia watu; ‘haikuwajia’ ni ya asili na huhifadhi picha ya hukumu kuja juu yao bila kuongeza maana.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: katika siku za Hezekia
  rationale: Tafsiri hii ya kawaida huhifadhi rejeo pana la kipindi cha maisha au utawala wa Hezekia bila kulibainisha kupita maandishi.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, tetragramatoni יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Uhusiano wa unyenyekevu na kiburi katika בְּגֹבַהּ לִבּוֹ
  choice: kwa sababu ya kiburi cha moyo wake
  alternative: kuhusu kiburi cha moyo wake; katika kiburi cha moyo wake
  rationale: בְּ linaweza kueleweka kama kuonyesha sababu au jambo linalohusika. Matini kuu inatumia maana ya kisababishi iliyo ya asili katika muktadha wa toba, huku tanbihi ikihifadhi uwezekano mpana wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akajinyenyekeza,’ ‘wakazi,’ na ‘ghadhabu’ vinaeleweka kwa wasomaji wa kawaida huku vikidumisha uzito wa simulizi. Mgawanyo kuwa sentensi mbili unaboresha uwazi bila kubadili uhusiano wa matukio.
