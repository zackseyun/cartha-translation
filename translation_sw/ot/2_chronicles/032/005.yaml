  text: וַ/יִּתְחַזַּ֡ק וַ/יִּבֶן֩ אֶת כָּל הַ/חוֹמָ֨ה הַ/פְּרוּצָ֜ה וַ/יַּ֣עַל עַל הַ/מִּגְדָּל֗וֹת וְ/לַ/ח֨וּצָ/ה֙ הַ/חוֹמָ֣ה אַחֶ֔רֶת וַ/יְחַזֵּ֥ק אֶת הַ/מִּלּ֖וֹא עִ֣יר דָּוִ֑יד וַ/יַּ֥עַשׂ שֶׁ֛לַח לָ/רֹ֖ב וּ/מָגִנִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: sw
  text: Akajitia nguvu, akajenga upya ukuta wote uliokuwa umebomoka, na akauinua mpaka kwenye minara. Nje yake akajenga ukuta mwingine, akaimarisha Milo ya Mji wa Daudi[a], na kutengeneza silaha[b] na ngao nyingi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tuta la udongo,” “matuta,” au “ujazo” kwa neno “Milo”; huenda lilikuwa jengo la ulinzi au muundo wa kuimarisha sehemu fulani ya Yerusalemu.
    reason: lexical_alternative
  - marker: b
    text: Au “silaha za kurusha,” “vishale,” au “mikuki.” Neno la Kiebrania lina maana pana kuliko aina moja maalumu ya silaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: Akajitia nguvu
  rationale: Kauli ya kujirejelea ya kitenzi חזק inaonyesha kwamba Hezekia alijitia nguvu na kuchukua hatua kwa uthabiti; usemi huu unadumisha maana hiyo bila kuibana kuwa hisia ya ujasiri pekee.
- source_word: וַיִּבֶן ... כָּל הַחוֹמָה הַפְּרוּצָה
  choice: akajenga upya ukuta wote uliokuwa umebomoka
  rationale: Muktadha unaonyesha kurekebishwa kwa ngome iliyoharibika. “Akajenga upya” ni Kiswahili cha kawaida kinachoeleza urejeshaji, na “uliokuwa umebomoka” linaonyesha hali ya ukuta wenye sehemu zilizovunjika.
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: akauinua mpaka kwenye minara
  rationale: Kifungu cha Kiebrania kimebanwa na kinaweza kufasiriwa kwa njia zaidi ya moja. Tafsiri hii inaendeleza ukuta kuwa yambwa linaloeleweka kutoka kifungu kilichotangulia, bila kuamua kwamba minara mipya ndiyo iliyojengwa juu yake.
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: Nje yake akajenga ukuta mwingine
  rationale: לַחוּצָה huonyesha upande wa nje; kitenzi “akajenga” kimedokezwa na muktadha na kimewekwa wazi ili sentensi iwe ya kawaida katika Kiswahili.
- source_word: וַיְחַזֵּק אֶת הַמִּלּוֹא עִיר דָּוִיד
  choice: akaimarisha Milo ya Mji wa Daudi
  rationale: “Milo” limehifadhiwa kama jina la kihistoria kwa sababu kitu hasa kinachorejelewa hakijulikani kwa uhakika; “akaimarisha” linafaa katika muktadha wa kuimarisha ulinzi.
- source_word: שֶׁלַח
  choice: silaha
  rationale: Neno hili linaweza kurejelea silaha za kushambulia au kurusha za aina mbalimbali. “Silaha” linahifadhi upana huo kuliko kuchagua mkuki au mshale pekee.
- source_word: לָרֹב וּמָגִנִּים
  choice: na ngao nyingi sana
  rationale: לָרֹב huonyesha wingi mkubwa, na מָגִנִּים ni ngao; Kiswahili hiki ni wazi, cha kawaida, na chenye hadhi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye “aka-” umetumiwa kwa mtiririko wa matendo. Utata wa kifungu kuhusu ukuta na minara, pamoja na maana halisi ya Milo na aina ya silaha, umehifadhiwa badala ya kuamuliwa kupita ushahidi wa chanzo.
