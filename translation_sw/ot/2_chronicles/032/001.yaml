base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: sw
  text: Baada ya mambo hayo na uaminifu huo[a], Senakeribu mfalme wa Ashuru alikuja na kuingia Yuda. Akapiga kambi dhidi ya miji yenye ngome, akinuia kuzivunja kwa nguvu ili azijitwalie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na matendo hayo ya uaminifu,” au “na ukweli huo.” Neno la Kiebrania linaweza kumaanisha “ukweli” au “uaminifu”; hapa huenda linarejelea mwenendo wa uaminifu wa Hezekia uliosimuliwa kabla ya tukio hili.
    reason: lexical_alternative
  - marker: b
    text: Au, “akipanga kuzibomoa ili azijitwalie.” Kirai cha Kiebrania kinaeleza kusudi la Senakeribu la kuvunja miji hiyo yenye ngome kwa nguvu na kuiteka kwa manufaa yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: Baada ya mambo hayo
  rationale: Kirai hiki kinaonyesha mfuatano wa wakati na kurejelea mambo yaliyosimuliwa katika muktadha uliotangulia.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: na uaminifu huo
  rationale: אֱמֶת inaweza kumaanisha ukweli au uaminifu; hapa inaelekea kurejelea uaminifu wa Hezekia ulioonyeshwa katika matendo yaliyotangulia. Kiwakilishi 'huo' kinaunganisha wazo hilo na simulizi lililotangulia kwa Kiswahili cha kawaida.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Senakeribu mfalme wa Ashuru
  rationale: Jina limetoholewa kwa mtindo unaotumika katika Kiswahili cha Biblia, huku cheo na nchi zikitafsiriwa moja kwa moja.
- source_word: וַיָּבֹא בִיהוּדָה
  choice: alikuja na kuingia Yuda
  rationale: Inahifadhi kitenzi cha kuja pamoja na mwelekeo wa kuingia katika nchi ya Yuda.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: Akapiga kambi dhidi ya miji yenye ngome
  rationale: חנה pamoja na עַל huonyesha kupiga kambi kwa uhasama dhidi ya mahali; 'miji yenye ngome' ni usemi wazi na wa kawaida kwa vituo vya mijini vilivyoimarishwa.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: akinuia kuingia ndani yake kwa nguvu ili ajitwalie
  rationale: וַיֹּאמֶר hapa hueleza kusudi au nia, na בקע hutoa wazo la kupasua au kufanya mwanya kwa nguvu. אֵלָיו inaeleweka kwa namna ya manufaa au umilikaji, yaani kuiteka kwa ajili yake mwenyewe.
theological_decisions:
- issue: Maana ya אֱמֶת katika rejeleo la matendo yaliyotangulia
  choice: uaminifu
  alternative: ukweli; matendo hayo ya uaminifu
  rationale: Muktadha wa karibu unahusu mwenendo wa uaminifu wa Hezekia, lakini tanbihi inadumisha wigo halisi wa neno la Kiebrania bila kuufanya ufasiri huo kuwa wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kiebrania imegawanywa mara mbili ili kuboresha mtiririko bila kupoteza mfuatano wa matendo.
