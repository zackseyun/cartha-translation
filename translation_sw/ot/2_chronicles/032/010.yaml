  yaml_path: translation/ot/2_chronicles/032/010.yaml
  text: 'Thus says Sennacherib king of Assyria: On what are you trusting, that you remain under siege in Jerusalem?'
translation:
  language: sw
  text: 'Senaqueribu, mfalme wa Ashuru, anasema hivi: “Mnatumainia nini hata mnaendelea kukaa Yerusalemu, mkiwa mmezingirwa?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מָה אַתֶּם בֹּטְחִים
  choice: Mnatumainia nini
  rationale: Kiswahili cha kawaida na cha moja kwa moja kinachohifadhi swali kuhusu msingi wa tumaini lao.
- source_word: וְיֹשְׁבִים בְּמָצוֹר
  choice: hata mkaendelea kukaa ... wakati umezingirwa
  rationale: Kitenzi יֹשְׁבִים hapa kina maana ya kubaki au kuendelea kukaa, huku בְּמָצוֹר ikieleza hali ya kuzingirwa; tafsiri hii ni ya asili kwa Kiswahili bila kuongeza sababu isiyosemwa.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: סַנְחֵרִיב
  choice: Senaqueribu
  rationale: Umbo la jina linalotambulika katika mapokeo ya Biblia ya Kiswahili.
