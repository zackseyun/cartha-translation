source:
  edition: WLC
  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: sw
  text: “Upande wake kuna mkono wa nyama[a], lakini upande wetu yuko Yahwe, Mungu wetu, kutusaidia na kupigana vita vyetu.” Nao watu wakayategemea maneno ya Hezekia, mfalme wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu za kibinadamu.” Kiebrania kinahifadhi sitiari ya uwezo wa kibinadamu tu, kinyume na msaada wa Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Huhifadhi maana ya kuwa pamoja au upande wa mtu, na pia usambamba wa moja kwa moja na וְעִמָּנוּ, ‘pamoja nasi.’
- source_word: זְרוֹעַ בָּשָׂר
  choice: mkono wa nyama
  rationale: Huhifadhi sitiari ya Kiebrania inayowakilisha nguvu za kibinadamu zilizo dhaifu kwa kulinganishwa na msaada wa Mungu. Maana iliyo wazi zaidi, ‘nguvu za kibinadamu,’ imetolewa katika tanbihi.
- source_word: וְעִמָּנוּ
  choice: lakini pamoja nasi
  rationale: Ingawa וְ inaweza kutafsiriwa ‘na,’ hapa inaunganisha vifungu vyenye ulinganisho mkali; ‘lakini’ huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu, YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya usemi huu wa uhusiano wa agano.
- source_word: לְעָזְרֵנוּ
  choice: ili kutusaidia
  rationale: Kiambishi לְ pamoja na kitenzi-jina hapa kinaonyesha kusudi; ‘ili kutusaidia’ ni Kiswahili cha asili na wazi.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: na kupigana vita vyetu
  rationale: Huhifadhi muundo wa kitenzi na nomino zenye mzizi mmoja na pia kiambishi kinachoonyesha kuwa ni vita vya watu wa Yuda.
- source_word: וַיִּסָּמְכוּ
  choice: wakayategemea
  rationale: Kitenzi kina wazo la kujiegemeza juu ya kitu na, kwa maana ya kitamathali, kukitegemea au kukitumaini; hapa maneno ya mfalme ndiyo msingi wa ujasiri wa watu.
- source_word: עַל דִּבְרֵי
  choice: maneno ya
  rationale: Kitenzi ‘kutegemea’ tayari hubeba uhusiano unaoonyeshwa na עַל; ‘maneno ya’ huhifadhi wingi wa דִּבְרֵי bila kufanya Kiswahili kuwa kizito.
- source_word: יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Hezekia, mfalme wa Yuda
  rationale: Hutumia majina yaliyozoeleka katika Kiswahili na kuhifadhi cheo pamoja na ufalme wake.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kuweka cheo mahali pake.
- issue: Tofauti kati ya uwezo wa kibinadamu na msaada wa Mungu
  choice: lakini pamoja nasi yuko Yahwe Mungu wetu
  alternative: na pamoja nasi yuko Yahwe Mungu wetu
  rationale: Kiunganishi cha Kiebrania kinaweza kuwa cha kawaida, lakini muktadha unaweka wazi tofauti ya kimakusudi kati ya mkono wa nyama na uwepo wa Yahwe. ‘Lakini’ huonyesha nguvu hiyo bila kuongeza dai jipya.
- issue: Maana ya זְרוֹעַ בָּשָׂר
  choice: mkono wa nyama
  alternative: nguvu za kibinadamu
  rationale: Sitiari yenyewe imehifadhiwa ili kutopoteza mvutano wa picha kati ya nguvu za mwanadamu na msaada wa Mungu; maana yake imefafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa ‘pamoja naye’ na ‘pamoja nasi’ umehifadhiwa, na sitiari ya Kiebrania imeachwa katika matini huku ikifafanuliwa kwa tanbihi.
