base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: sw
  text: BWANA akamtuma malaika, ambaye aliwaangamiza mashujaa wote wenye nguvu, viongozi na maofisa katika kambi ya mfalme wa Ashuru. Basi mfalme huyo akarudi nchini mwake akiwa na aibu usoni. Alipoingia katika nyumba ya mungu wake, wazao wake mwenyewe wakamuua humo kwa upanga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa BWANA, kwa herufi kubwa.
- source_word: מַלְאָךְ
  choice: malaika
  rationale: Katika muktadha huu ni mjumbe wa Mungu wa mbinguni; neno la kawaida na linaloeleweka ni “malaika”.
- source_word: וַיַּכְחֵד
  choice: aliwaangamiza
  rationale: Kitenzi kina maana ya kufutilia mbali au kuharibu kabisa; “aliwaangamiza” hudumisha uzito wake.
- source_word: כָּל גִּבּוֹר חַיִל
  choice: mashujaa wote hodari
  rationale: Huwasilisha watu wenye uwezo na ushujaa wa kivita bila kupunguza nguvu ya kirai cha Kiebrania.
- source_word: וְנָגִיד וְשָׂר
  choice: viongozi na maofisa
  rationale: Maneno haya mawili yanataja vyeo vya uongozi vinavyokaribiana. Tafsiri hii huyatofautisha kwa kawaida bila kulazimisha mpangilio maalumu wa kijeshi ambao maandishi hayafafanui.
- source_word: בְּבֹשֶׁת פָּנִים
  choice: akiwa ameaibika
  rationale: Nahau ya Kiebrania ni “kwa aibu ya uso”; Kiswahili cha kawaida huwasilisha maana hiyo kwa “akiwa ameaibika”.
- source_word: וּמִיצִיאֵי מֵעָיו
  choice: baadhi ya wazao wake mwenyewe
  rationale: Kwa neno ni wale waliotoka katika viungo vyake vya ndani, yaani watoto au wazao wake. “Wazao wake mwenyewe” huhifadhi maana ya undugu wa moja kwa moja bila kuiga nahau isiyo ya kawaida katika Kiswahili.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: wakamuua ... kwa upanga
  rationale: Kwa neno ni “walimwangusha kwa upanga”; katika simulizi hili maana ya wazi ni kumuua kwa upanga.
theological_decisions:
- issue: Utambulisho wa malaika aliyetumwa na YHWH
  choice: malaika
  alternative: Malaika wa BWANA
  rationale: Maandishi yana מַלְאָךְ bila kifungu maalumu wala muundo “malaika wa YHWH”; hivyo hayahalalishi kumtambulisha kama mhusika maalumu wa kitheolojia.
- issue: Mungu wa mfalme wa Ashuru
  choice: mungu wake
  alternative: sanamu yake
  rationale: Chanzo kinasema אֱלֹהָיו, “mungu wake.” Kutafsiri “sanamu” kungeongeza ufafanuzi wa kitheolojia usiosemwa moja kwa moja.
- issue: Utambulisho kamili wa wauaji
  choice: baadhi ya wazao wake mwenyewe
  alternative: wanawe
  rationale: Kirai cha Kiebrania kinaonyesha waliotokana na mwili wake, lakini mstari huu wenyewe hautumii neno mahsusi “wana.” Tafsiri inahifadhi upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Muundo umefanywa wa kawaida kwa msomaji wa leo huku tofauti kati ya vyeo, nguvu ya tendo la malaika, na nahau za Kiebrania zikihifadhiwa kwa kiwango kinachowezekana.
