base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: sw
  text: Lakini Hezekia hakuitikia fadhili alizotendewa kwa kadiri iliyostahili[a], kwa sababu moyo wake ulijivuna. Kwa hiyo ghadhabu ikawajia yeye, Yuda na Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakurudisha kwa kadiri ya fadhili alizotendewa.” Usemi wa Kiebrania unamaanisha kwa upana kutoa mwitikio unaofaa kwa mema yaliyopokewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: kwa kadiri ya mema aliyotendewa
  rationale: Kirai hiki kinaonyesha mema au fadhili alizopokea Hezekia na kiwango cha mwitikio uliopaswa kuendana navyo. “Mema aliyotendewa” ni lugha ya kawaida na haibani maana kuwa shukrani ya maneno pekee.
- source_word: הֵשִׁיב
  choice: hakurudisha
  rationale: Hifili ya שוב hapa, ikiambatana na גמול, ina maana ya kurudisha au kutoa mwitikio unaostahili. “Hakurudisha” huhifadhi taswira ya kufanya marejezo bila kuifanya lazima iwe malipo ya fedha.
- source_word: גָבַהּ לִבּוֹ
  choice: moyo wake ulijivuna
  rationale: Nahau ya Kiebrania husema moyo wake ulikuwa juu, yaani alikuwa na kiburi. “Moyo wake ulijivuna” ni ya asili katika Kiswahili na huhifadhi kitovu cha ndani cha hali hiyo.
- source_word: קֶצֶף
  choice: ghadhabu
  rationale: Neno hili huonyesha hasira kali, mara nyingi katika muktadha wa hukumu. “Ghadhabu” huhifadhi uzito huo.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: ghadhabu ikamjia yeye
  rationale: Muundo wa Kiebrania unaonyesha ghadhabu kuwa juu yake au kumfikia. “Ikamjia” ni Kiswahili cha kawaida kinachoonyesha kutokea kwa hukumu bila kumtaja wazi mtendaji ambaye kifungu hakimtaji.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Yuda na Yerusalemu
  rationale: Haya ndiyo maumbo sanifu ya majina haya katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Kushindwa kwa Hezekia kuitikia mema aliyopokea
  choice: Hezekia hakutoa mwitikio unaolingana na mema aliyotendewa, bila kuufanya mwitikio huo kuwa shukrani ya maneno pekee.
  alternative: Hezekia hakushukuru kwa mema aliyotendewa.
  rationale: Kiebrania kina maana pana ya kutorudisha kwa kadiri ya mema aliyopokea; hakitaji tendo moja maalumu la ibada au shukrani.
- issue: Chanzo cha ghadhabu
  choice: 'Mtendaji ameachwa bila kutajwa wazi: “ghadhabu ikamjia.”'
  alternative: Ghadhabu ya BWANA ikamjia.
  rationale: Muktadha unaelekeza kwenye ghadhabu ya Mungu, lakini kifungu hiki chenyewe hakimtaji BWANA kama mhusika wa sentensi. Tafsiri inadumisha hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hakurudisha kwa kadiri ya” ni usemi unaoeleweka katika muktadha huu na huepuka dhana finyu ya malipo ya fedha; tanbihi inafafanua maana pana.
