base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: sw
  text: Nao waliwapigia kelele kwa sauti kubwa, kwa lugha ya Kiyahudi, watu wa Yerusalemu waliokuwa juu ya ukuta, ili kuwaogopesha na kuwatia hofu, kusudi wauteke mji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ בְקוֹל גָּדוֹל
  choice: wakapaza sauti
  rationale: Nahau hii ya kawaida ya Kiswahili huwasilisha kwa asili tendo la kuita au kusema kwa sauti kubwa.
- source_word: יְהוּדִית
  choice: kwa Kiyahudi
  rationale: Neno linataja lugha ya Yuda; tafsiri hii huhifadhi namna fupi ya chanzo bila kulazimisha jina mahususi zaidi kama Kiebrania.
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: ili kuwaogopesha na kuwatia hofu
  rationale: Huhifadhi vitenzi viwili vya kusababisha woga na mfadhaiko bila kuvifanya kuwa wazo moja.
- source_word: יִלְכְּדוּ אֶת הָעִיר
  choice: wauteke mji
  rationale: Kitenzi לכד katika muktadha wa vita humaanisha kuutwaa au kuuteka mji.
