translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kusudi mara mbili katika Kiebrania umehifadhiwa kwa “ili” na “kusudi.”
