  text: הֲ/לֹ֣א תֵדְע֗וּ מֶ֤ה עָשִׂ֨יתִי֙ אֲנִ֣י וַ/אֲבוֹתַ֔/י לְ/כֹ֖ל עַמֵּ֣י הָ/אֲרָצ֑וֹת הֲ/יָכ֣וֹל יָֽכְל֗וּ אֱלֹהֵי֙ גּוֹיֵ֣ הָ/אֲרָצ֔וֹת לְ/הַצִּ֥יל אֶת אַרְצָ֖/ם מִ/יָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: sw
  text: Je, hamjui yale ambayo mimi na baba zangu tumewatendea watu wote wa nchi mbalimbali? Je, miungu ya mataifa ya nchi hizo iliweza kweli kuiokoa nchi yao kutoka mkononi mwangu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mababu zangu” badala ya “baba zangu.” Kiebrania kinatumia lugha ya kifamilia ya nasaba ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: Je, hamjui
  rationale: Swali la balagha linatarajia jibu la kukubali; “Je, hamjui” ni la kawaida na linahifadhi nguvu ya Kiebrania.
- source_word: מֶה עָשִׂיתִי
  choice: yale ambayo ... tumewatendea
  rationale: Katika Kiswahili, “kuwatendea” huwasilisha kwa kawaida matendo yaliyofanyiwa watu; muktadha unaonyesha kuwa yalikuwa ya uadui bila kuongeza neno lisilokuwamo wazi katika chanzo.
- source_word: אֲנִי וַאֲבוֹתַי
  choice: mimi na baba zangu
  rationale: Huhifadhi lugha ya kifamilia na ya nasaba ya kifalme iliyo katika Kiebrania; tanbihi inaonyesha uwezekano wa maana ya “mababu/watangulizi.”
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: watu wote wa nchi mbalimbali
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya wingi wa nchi/maeneo bila kuibadili kuwa dunia yote.
- source_word: הֲיָכוֹל יָכְלוּ
  choice: iliweza kweli
  rationale: “Kweli” huonyesha msisitizo wa muundo wa kitenzi kisoukomo pamoja na kitenzi kamili katika swali la kejeli.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: miungu ya mataifa ya nchi hizo
  rationale: Huhifadhi rejeo la moja kwa moja kwa miungu ya mataifa hayo na mnyororo wa umilikaji kwa Kiswahili kinachoeleweka.
- source_word: לְהַצִּיל
  choice: kuiokoa
  rationale: Katika muktadha wa tishio la kijeshi, “kuokoa” hutoa maana ya kuponya au kukomboa kutoka hatarini.
- source_word: אֶת אַרְצָם
  choice: nchi yao
  rationale: Huhifadhi umoja wa pamoja wa Kiebrania, ukirejelea nchi ya kila taifa kwa ujumla.
- source_word: מִיָדִי
  choice: kutoka mkononi mwangu
  rationale: Huhifadhi sitiari ya Kiebrania ya mkono kama mamlaka au nguvu, nayo inaeleweka katika Kiswahili.
theological_decisions:
- issue: Rejeo la “miungu” katika majivuno ya mfalme mpagani
  choice: Kutafsiri אֱלֹהֵי moja kwa moja kuwa “miungu” bila maelezo ya ziada.
  alternative: “miungu inayoitwa hivyo”
  rationale: Mnenaji ni Senakeribu, anayelinganisha miungu ya mataifa aliyoyashinda na Mungu wa Yuda. Tafsiri inapaswa kuwasilisha dai lake bila kuingiza maoni ya kitheolojia ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maswali mawili ya kejeli na sitiari ya “mkono” umehifadhiwa.
