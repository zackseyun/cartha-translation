source:
  edition: WLC
  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: sw
  text: 'Je, si Hezekia mwenyewe aliyeondoa maeneo yake ya juu ya ibada na madhabahu zake, akawaambia Yuda na Yerusalemu hivi: ‘Mtasujudu mbele ya madhabahu moja tu, na juu yake mtafukiza uvumba[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtateketeza sadaka ili zitoe moshi.”
    reason: Kitenzi תקטירו kinaweza kutaja kufukiza uvumba au kufanya sadaka itoe moshi kwa kuiteketeza.
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, si
  rationale: Huanzisha swali la balagha linalotarajia kukubaliwa; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: Hezekia mwenyewe
  rationale: Kiwakilishi pamoja na jina kinatia mkazo; “mwenyewe” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: הֵסִיר
  choice: aliyeondoa
  rationale: Hutoa maana ya Hiphil ya סור, yaani kuondoa maeneo na madhabahu hizo.
- source_word: בָּמֹתָיו
  choice: mahali pake pa juu pa kuabudia
  rationale: Ni maeneo ya ibada yaliyoinuliwa au ya kienyeji. Kiambishi cha umilikaji “pake” kinahifadhi mtazamo wa msemaji kwamba maeneo hayo yalikuwa ya Mungu wa Yuda.
- source_word: מִזְבְּחֹתָיו
  choice: madhabahu zake
  rationale: Kinawakilisha wazi kiambishi cha umilikaji cha Kiebrania na kuhifadhi maneno ya kipolemiki ya msemaji.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: akawaambia Yuda na Yerusalemu hivi
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kitangulizi cha kauli bila marudio yasiyo ya kawaida ya “akisema.”
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: mbele ya madhabahu moja tu
  rationale: “Mbele ya” hufuata maana ya msingi ya לִפְנֵי, na “moja tu” huonyesha mkazo wa madhabahu moja katika shutuma ya kuifanya ibada iwe mahali pamoja.
- source_word: תִּשְׁתַּחֲווּ
  choice: mtasujudu
  rationale: Kitenzi hiki huonyesha kuinama au kujilaza chini katika ibada; “kusujudu” kinahifadhi tendo hilo la kimwili na maana yake ya kiibada.
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: na juu yake mtafukiza uvumba
  rationale: Katika muktadha wa ibada, Hiphil ya קטר mara nyingi humaanisha kufukiza uvumba, ingawa inaweza pia kumaanisha kuteketeza sadaka ili moshi wake upande; uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mtazamo wa msemaji katika viambishi vya umilikaji vya “mahali pa juu” na “madhabahu”
  choice: Kuhifadhi “pake” na “zake” kama maelezo ya msemaji Mwashuru
  alternative: mahali pa juu pa kuabudia na madhabahu hizo
  rationale: Viambishi vya Kiebrania viko wazi. Tafsiri hairekebishi ufahamu au mbinu ya kipolemiki ya msemaji, wala haifanyi maneno yake kuwa kauli ya msimulizi.
- issue: Lugha ya kuifanya ibada iwe katika madhabahu moja
  choice: Kutaja madhabahu moja tu bila kueleza mageuzi ya Hezekia katika matini kuu
  alternative: kuifafanua kuwa madhabahu ya Hekalu pekee
  rationale: Aya inanukuu shutuma ya adui, si maelezo ya kitheolojia ya msimulizi. Hivyo mvutano wa kihistoria na kitheolojia unabaki bila kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha ni wa kawaida; maneno ya ibada yamewekwa wazi bila kuongeza ufafanuzi wa kimadhehebu.
