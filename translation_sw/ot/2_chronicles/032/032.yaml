base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: sw
  text: Matendo mengine ya Hezekia na matendo yake ya uaminifu[a]—tazama, yameandikwa katika maono ya Isaya mwana wa Amozi, nabii, katika Kitabu cha Wafalme wa Yuda na Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matendo yake ya ushikamanifu” au “matendo yake ya uaminifu kwa agano.” Neno la Kiebrania linaweza kumaanisha wema wenye uaminifu, ushikamanifu, au uaminifu katika uhusiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika fomula ya muhtasari wa kifalme, דִּבְרֵי hurejelea matendo au mambo ya mfalme, na יֶתֶר huonyesha yaliyobaki au mengine.
- source_word: וַחֲסָדָיו
  choice: na matendo yake ya uaminifu
  rationale: חֶסֶד hapa inaeleza mwenendo wa Hezekia wenye uaminifu au utiifu wa dhati; tafsiri hii huhifadhi maana ya matendo halisi bila kulazimisha maana ya kiufundi ya agano.
- source_word: הִנָּם
  choice: tazama
  rationale: Neno hili huvuta fikira za msomaji kuelekea taarifa inayofuata; “tazama” huhifadhi msisitizo huo katika lugha yenye hadhi.
- source_word: בַּחֲזוֹן
  choice: katika maono
  rationale: חָזוֹן kimsingi humaanisha maono, ingawa hapa pia inaweza kutaja maandishi ya kinabii; maana ya msingi imehifadhiwa.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: nabii Isaya mwana wa Amozi
  rationale: Mpangilio huu ni wa kawaida na wa asili katika Kiswahili huku ukihifadhi jina, ukoo, na wadhifa wake.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: katika Kitabu cha Wafalme wa Yuda na Israeli
  rationale: Katika fomula hii ya marejeo ya maandishi, עַל huunganisha kumbukumbu hiyo na kitabu kinachotajwa; “katika” ni ya asili kuliko tafsiri ya moja kwa moja “juu ya.”
theological_decisions:
- issue: Maana ya חֶסֶד inapotumiwa kuhusu matendo ya Hezekia
  choice: matendo yake ya uaminifu
  alternative: matendo yake ya uaminifu kwa agano; matendo yake ya utiifu; matendo yake mema
  rationale: Chaguo hili huhifadhi wazo la ushikamanifu na uaminifu bila kuingiza madai ya kiufundi kuhusu agano ambayo muktadha hauyasemi wazi.
- issue: Uhusiano wa “maono ya Isaya” na “Kitabu cha Wafalme”
  choice: katika maono ... katika Kitabu
  alternative: katika maono ... yaliyo katika Kitabu; juu ya Kitabu
  rationale: Muundo wa Kiebrania unaweza kueleweka kama kurejelea maandishi ya Isaya yanayohusiana na au yaliyomo katika kitabu hicho. Tafsiri haiongezi kitenzi au ufafanuzi usiotajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” limetumiwa kuhifadhi nguvu ya uwasilishaji ya הִנָּם; alama ya tanbihi [a] imewekwa baada yake ili kuhusisha tanbihi na kirai kinachoeleza חֶסֶד katika sentensi hiyo.
