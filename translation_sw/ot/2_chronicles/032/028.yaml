  text: storehouses for the produce of grain[a], new wine, and oil, and stalls for all kinds of animals[c][b], and folds for the flocks.
translation:
  language: sw
  text: maghala[a] ya kuhifadhia mazao—nafaka, divai mpya[b], na mafuta—mazizi kwa ajili ya kila aina ya mifugo, na maboma[c] kwa ajili ya makundi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miji ya maghala”; neno la Kiebrania linaweza kumaanisha vituo vikubwa zaidi vya kuhifadhia, si maghala tu.
    reason: lexical_alternative
  - marker: b
    text: “Divai mpya” limetafsiri neno la Kiebrania תִירוֹשׁ (tirosh), ambalo katika orodha za kilimo mara nyingi hutofautishwa na maneno ya jumla zaidi ya divai.
    reason: lexical_alternative
  - marker: c
    text: Au “mazizi” au “maeneo yenye uzio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: maghala
  rationale: Katika muktadha wa kuhifadhi mazao, neno hili linaelekea kumaanisha majengo au vituo vya kuhifadhia. “Maghala” ni Kiswahili cha kawaida na hudumisha wingi wa neno la Kiebrania.
- source_word: תְבוּאַת
  choice: mazao
  rationale: Neno hili humaanisha mazao au mavuno ya kilimo. Muundo “ya kuhifadhia mazao” unaeleza kwa kawaida kazi ya maghala.
- source_word: דָּגָן
  choice: nafaka
  rationale: “Nafaka” ni neno pana na la kawaida kwa mazao ya jamii ya nafaka katika orodha za kilimo.
- source_word: תִירוֹשׁ
  choice: divai mpya
  rationale: Tafsiri hii inadumisha utofauti wa neno hili na maneno ya jumla zaidi ya divai, bila kuamua kwa undani kiwango cha uchachushaji.
- source_word: יִצְהָר
  choice: mafuta
  rationale: Katika utatu wa kawaida wa mazao, neno hili humaanisha mafuta, kwa kawaida mafuta ya zeituni. “Mafuta” yanafuata ufupi wa maandishi ya chanzo.
- source_word: אֻרָוֹת
  choice: mazizi
  rationale: Neno hili linataja sehemu za kuweka au kulishia wanyama. “Mazizi” linaeleweka kwa mifugo kwa ujumla na halibani maana kuwa vibanda vya farasi pekee.
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: kwa ajili ya mifugo ya kila aina
  rationale: Kurudiwa kwa בְהֵמָה kunaeleweka kwa maana ya ugawaji—kila aina ya mnyama wa kufugwa. Kiswahili hiki ni cha asili kuliko kurudia “mnyama na mnyama.”
- source_word: עֲדָרִים
  choice: makundi ya mifugo
  rationale: Neno hili huonyesha makundi ya wanyama, hasa kondoo au mbuzi. “Makundi ya mifugo” hudumisha upana wake bila kuyafanya kuwa kondoo pekee.
- source_word: אֲוֵרוֹת
  choice: maboma
  rationale: Neno hili humaanisha maeneo yaliyofungwa ambamo makundi ya mifugo huwekwa. “Maboma” ni neno la kawaida la Afrika Mashariki kwa vizuizi au maeneo hayo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari mirefu imetenganishwa kwa vistari virefu ili orodha ya mazao isichanganywe na sehemu za kuhifadhia mifugo. “Mifugo” limetumiwa badala ya “wanyama” kwa sababu בְּהֵמָה hapa linarejelea wanyama wa kufugwa.
