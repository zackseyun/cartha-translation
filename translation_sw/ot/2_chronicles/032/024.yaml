id: 2CH.32.24
reference: 2 Chronicles 32:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: sw
  text: Katika siku hizo, Hezekia aliugua hata akawa karibu kufa. Akamwomba Yahwe, naye akamjibu[a] na kumpa ishara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “akamwambia.” Kitenzi cha Kiebrania ni “alisema,” lakini hapa kinaonyesha jinsi Yahwe alivyoitikia sala ya Hezekia.
    reason: lexical_alternative
  - marker: b
    text: Au “ajabu” au “dalili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Katika siku hizo
  rationale: Ni usemi wa kawaida wa wakati unaohifadhi nahau ya Kiebrania kwa Kiswahili cha asili.
- source_word: חָלָה
  choice: aliugua
  rationale: Kitenzi kinaeleza Hezekia kuingia katika hali ya ugonjwa; “aliugua” ni wazi na cha kawaida.
- source_word: עַד לָמוּת
  choice: hata akawa karibu kufa
  rationale: Usemi huu unaonyesha ugonjwa mkali uliomfikisha karibu na kifo bila kudai kwamba alikufa.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: Akamwomba Yahwe
  rationale: “Kumwomba” ni usemi wa kawaida wa sala kwa Mungu, na “Yahwe” linawakilisha jina la agano יְהוָה.
- source_word: וַיֹּאמֶר לוֹ
  choice: naye akamjibu
  rationale: Kihalisi kitenzi ni “akamwambia,” lakini katika muktadha huu maneno ya Yahwe ni mwitikio kwa sala ya Hezekia; tanbihi inahifadhi maana ya moja kwa moja.
- source_word: מוֹפֵת
  choice: ishara
  rationale: Neno linaweza kumaanisha ishara, ajabu, au dalili; hapa ni ishara ya kuthibitisha aliyopewa Hezekia.
- source_word: נָתַן לוֹ
  choice: kumpa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kutoa pamoja na yambwa yake.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu mwenyewe; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Ikiwa וַיֹּאמֶר לוֹ itafsiriwe kihalisi au kwa maana ya kimuktadha
  choice: akamjibu
  alternative: akamwambia
  rationale: Muktadha unaonyesha kwamba Yahwe aliitikia sala ya Hezekia. Hata hivyo, kwa kuwa Kiebrania kinasema kihalisi “akamwambia,” uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa vitenzi umefanywa wa kawaida kwa simulizi ya Kiswahili, huku ukali wa ugonjwa, mwitikio wa Yahwe, na upana wa maana ya מוֹפֵת vikihifadhiwa.
