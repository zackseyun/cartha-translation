base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: sw
  text: Basi watu wengi wakakusanyika, wakaziba chemchemi zote na mkondo wa maji uliokuwa ukiutiririka katika nchi[a], wakisema, “Kwa nini wafalme wa Ashuru[b] waje wakute maji mengi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kijito kilichokuwa kikitiririka katika nchi.” Neno la Kiebrania linaweza kumaanisha mkondo wa maji, kijito, mto mdogo, au wadi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wafalme wa Ashuru.” Huenda wingi huo unarejelea mamlaka ya kifalme au nasaba ya Ashuru; tafsiri nyingine hutumia umoja, “mfalme wa Ashuru,” kulingana na muktadha wa kihistoria wa karibu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: watu wengi wakakusanyika
  rationale: Niphal ya קבץ inaonyesha watu kuja pamoja, na עַם רָב hapa ni kundi kubwa la watu, si lazima taifa kama kitengo cha kikabila.
- source_word: וַיִּסְתְּמוּ
  choice: wakaziba
  rationale: Kitenzi kina maana ya kufunga au kuzuia vyanzo vya maji; “kuziba” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: כָּל הַמַּעְיָנוֹת
  choice: chemchemi zote
  rationale: מַעְיָן ni chanzo cha maji kinachobubujika; “chemchemi” ni neno la kawaida na mahususi.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: kijito kilichokuwa kikitiririka
  rationale: נַחַל inaweza kuwa kijito, mto mdogo, au korongo la maji; kishirikishi הַשּׁוֹטֵף kinaonyesha mkondo uliokuwa ukitiririka. “Kijito” ni wazi katika matini kuu, huku uwezekano wa “wadi/korongo la maji” ukihifadhiwa katika tanbihi.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: katika nchi
  rationale: Kirai kinaonyesha mkondo uliokuwa ndani ya eneo hilo; “katika nchi” huhifadhi maana bila kuongeza wazo lisilo wazi la kuvuka nchi yote.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Hiki ni kishazi cha kawaida cha Kiebrania kinachoanzisha maneno yaliyonukuliwa.
- source_word: לָמָּה יָבֹאוּ
  choice: Kwa nini … waje
  rationale: Muundo wa swali la balagha unaonyesha kusudi la hatua yao; hali ya utegemezi “waje” ni ya asili katika Kiswahili.
- source_word: מַלְכֵי אַשּׁוּר
  choice: wafalme wa Ashuru
  rationale: Tafsiri inadumisha wingi ulio wazi katika Kiebrania badala ya kuubadili kimya kuwa umoja kwa sababu ya muktadha wa kihistoria.
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: wakute maji mengi
  rationale: “Wakute” huwasilisha kwa kawaida matokeo ya wao kuja, na “maji mengi” huhifadhi maana ya ugavi mwingi wa maji.
theological_decisions:
- issue: Wingi katika “wafalme wa Ashuru”
  choice: Wingi umehifadhiwa katika matini kuu.
  alternative: “mfalme wa Ashuru” kwa kuulinganisha na mfalme mmoja katika muktadha wa karibu.
  rationale: Kiebrania kinasema מַלְכֵי kwa wingi. Huenda wingi huo unarejelea mamlaka ya kifalme ya Ashuru au nasaba yake, lakini tafsiri haipaswi kuamua kimya jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Basi” linaendeleza simulizi; “wakaziba,” “chemchemi,” na “wakute maji mengi” ni maneno yanayoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa karibu na maneno yanayohusika, zikirekebisha mkanganyiko wa nafasi za alama katika safu ya mashauriano ya Kiingereza.
