base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: sw
  text: Pia alijengea miji, akawa na makundi mengi sana ya kondoo/mbuzi na ng’ombe, kwa maana Mungu alikuwa amempa mali[a] nyingi mno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utajiri” au “vitu/vimiliki.”
    reason: Mbadala wa kileksika wa רְכוּשׁ, neno linaloweza kumaanisha mali, utajiri, au vitu vinavyomilikiwa.
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: Pia alijijengea miji
  rationale: Muundo huu unaonyesha tendo lililomletea Hezekia manufaa au umiliki. ‘Alijijengea’ ni Kiswahili cha kawaida kinachowasilisha maana ya עָשָׂה לוֹ bila kulazimisha tafsiri finyu ya tendo hilo.
- source_word: וּמִקְנֵה צֹאן וּבָקָר
  choice: akawa na makundi ... ya kondoo na mbuzi, na ya ng’ombe
  rationale: מִקְנֶה ni mifugo inayomilikiwa; צֹאן ni mifugo midogo, hasa kondoo na mbuzi, na בָקָר ni ng’ombe. Kiswahili hiki ni wazi na cha asili kuliko kutafsiri nomino zote kwa kufuatana kwa namna ngumu.
- source_word: לָרֹב
  choice: mengi sana
  rationale: Kirai hiki kinaonyesha wingi mkubwa wa mifugo; ‘mengi sana’ kinaeleweka kwa urahisi na kuhifadhi msisitizo.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya wingi wa mali ya Hezekia.
- source_word: נָתַן לוֹ אֱלֹהִים
  choice: Mungu alikuwa amempa
  rationale: Kauli ya wakati uliopita timilifu kwa Kiswahili inaonyesha kwamba utoaji wa Mungu ndio uliotangulia na kueleza hali ya utajiri wa Hezekia.
- source_word: רְכוּשׁ רַב מְאֹד
  choice: mali nyingi mno
  rationale: רְכוּשׁ humaanisha mali au vitu vinavyomilikiwa, na רַב מְאֹד husisitiza ukubwa wa wingi. ‘Mali nyingi mno’ ni ya asili na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Chanzo cha ustawi wa Hezekia
  choice: Aya inasema wazi kwamba Mungu ndiye aliyempa Hezekia mali nyingi mno.
  alternative: Kutaja tu kwamba Hezekia alikuwa tajiri bila kuonyesha utendaji wa Mungu.
  rationale: Kifungu כִּי נָתַן לוֹ אֱלֹהִים kinataja moja kwa moja tendo la Mungu. Tafsiri hailipanui dai hilo kuwa fundisho la jumla kuhusu ustawi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kondoo na mbuzi’ hufafanua kwa usahihi wigo wa צֹאן, huku ‘mali’ ikihifadhi upana wa רְכוּשׁ. Hakuna tanbihi inayohitajika kwa aya hii.
