base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: sw
  text: Na hivyo, katika habari ya wajumbe wa maafisa wa Babeli, waliotumwa kwake kuulizia ishara[a] iliyotokea nchini, Mungu alimwacha ili kumjaribu na kujua yote yaliyokuwa moyoni mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ajabu” au “ishara ya ajabu.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “na kujua yote yaliyokuwa moyoni mwake” imedumishwa kama ilivyoandikwa. Wengine huielewa kuwa “ili kufunua” au “ili kuweka wazi” yaliyokuwa moyoni mwake.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Vivyo hivyo
  rationale: Inaendeleza simulizi kwa kuunganisha jambo hili na yaliyotangulia, huku ikihifadhi nguvu ya kiunganishi cha Kiebrania.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  choice: katika habari ya wajumbe wa wakuu wa Babeli
  rationale: מְלִיצִים hapa ni wapatanishi au wajumbe, na בְּ inaonyesha mazingira au jambo linalozungumziwa. ‘Katika habari ya’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: waliotumwa kwake
  rationale: Ingawa umbo la Kiebrania ni tendaji, katika muktadha huu linawatambulisha wajumbe kama watu waliotumwa kwa Hezekia; Kiswahili cha kutendwa kinatoa maana hiyo kwa kawaida.
- source_word: לִדְרֹשׁ
  choice: ili kuulizia
  rationale: Kitenzi hiki hapa kinamaanisha kutafuta habari au kufanya uchunguzi kuhusu jambo fulani, si kuuliza swali tu.
- source_word: הַמּוֹפֵת
  choice: ishara
  rationale: מוֹפֵת inaweza kuwa ishara, ajabu, au tukio lenye maana ya kinabii. ‘Ishara’ ni neno pana lisilolazimisha maana moja tu.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: iliyotokea katika nchi
  rationale: Kauli inaelekeza kwenye tukio mashuhuri lililotokea na kuwafanya Wababeli waulizie habari zake.
- source_word: עֲזָבוֹ הָאֱלֹהִים
  choice: Mungu alimwacha
  rationale: ‘Alimwacha’ ni tafsiri ya moja kwa moja lakini isiyotia nguvu kupita kiasi kama ‘alimtelekeza’; hivyo inadumisha mvutano wa simulizi.
- source_word: לְנַסּוֹתוֹ
  choice: ili kumjaribu
  rationale: נסה humaanisha kupima au kujaribu ili hali ya ndani ionekane; ‘kumjaribu’ ni Kiswahili cha kawaida katika muktadha huu.
- source_word: לָדַעַת
  choice: apate kujua
  rationale: Inahifadhi maana ya moja kwa moja ya ‘kujua’ na pia uhusiano wa kusudi katika sentensi, bila kuibadili kimya kimya kuwa ‘kufunua’.
- source_word: כָּל בִּלְבָבוֹ
  choice: yote yaliyokuwa moyoni mwake
  rationale: ‘Moyo’ katika Kiebrania unahusu utu wa ndani, kutia ndani nia na mawazo; nahau ya Kiswahili inadumisha taswira hiyo.
theological_decisions:
- issue: Mungu kumjaribu Hezekia na lugha ya Mungu ‘kujua’ yaliyokuwa moyoni mwake
  choice: Mungu alimwacha ili kumjaribu, apate kujua yote yaliyokuwa moyoni mwake
  alternative: Mungu alimwacha ili kumjaribu na kufunua yote yaliyokuwa moyoni mwake
  rationale: Kiebrania kinasema ‘kujua,’ si ‘kufunua.’ Tafsiri kuu inadumisha kauli hiyo na mvutano wake wa kiteolojia badala ya kuutatua kwa ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mtiririko wa simulizi na mvutano wa kiteolojia wa chanzo bila kutumia istilahi nzito zisizo za lazima.
