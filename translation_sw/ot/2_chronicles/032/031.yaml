  to: Na hivyo, katika habari ya wajumbe wa maafisa wa Babeli, waliotumwa kwake kuulizia ishara[a] iliyotokea nchini, Mungu alimwacha ili kumjaribu na kujua yote yaliyokuwa moyoni mwake.[b]
  rationale: Marekebisho yanaweka kiunganishi cha Kiswahili kinachoendelea na simulizi, yanaunganisha kwa uwazi makusudi mawili ya Mungu (‘kumjaribu na kujua’), na yanaondoa kutoka tanbihi tafsiri mbadala yenye nyongeza ya ‘kinabii.’ Maana, mtindo wa heshima, na mvutano wa kifungu cha Kiebrania vinahifadhiwa.
