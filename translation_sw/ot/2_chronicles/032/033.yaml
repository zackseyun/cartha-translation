base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: sw
  text: Hezekia akalala na baba zake, nao wakamzika kwenye sehemu ya juu ya makaburi ya wana wa Daudi.[a] Yuda yote na wakazi wa Yerusalemu wakampa heshima alipokufa. Kisha Manase mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makaburi ya wazao wa Daudi.” Hapa “wana wa Daudi” inamaanisha ukoo wa kifalme wa Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: akalala pamoja na baba zake
  rationale: Huhifadhi nahau ya kawaida ya Kiebrania kuhusu kifo katika taarifa za kifalme, huku muktadha wa maziko ukiweka maana wazi.
- source_word: וַיִּקְבְּרֻהוּ
  choice: nao wakamzika
  rationale: Kitenzi cha Kiebrania ni tendi katika wingi; tafsiri hii huhifadhi mtendaji asiyeainishwa badala ya kukifanya kitendwa.
- source_word: בְּמַעֲלֵה
  choice: sehemu ya juu ya
  rationale: Neno linaweza kumaanisha mpando au mahali pa juu; katika muktadha wa maziko, tafsiri hii huhifadhi maana ya kijiografia bila kubainisha isivyo lazima muundo wa eneo.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: makaburi ya wana wa Daudi
  rationale: Hufuata kwa karibu muundo wa Kiebrania na kuhifadhi rejeo la ukoo wa kifalme wa Daudi; tanbihi hufafanua maana pana.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: wakampa heshima
  rationale: Ni Kiswahili cha kawaida kinachowasilisha nahau ya Kiebrania, yaani kumfanyia mtu heshima.
- source_word: בְּמוֹתוֹ
  choice: alipokufa
  rationale: Hutoa maana ya wakati kwa uwazi na kwa Kiswahili cha kawaida katika muktadha wa heshima za kifo.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Yuda yote na wakazi wa Yerusalemu
  rationale: Huhifadhi upeo wa umma uliotajwa katika Kiebrania na kutumia istilahi ya sasa, yenye hadhi.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: Huwasilisha kwa kawaida kauli ya kurithi ufalme bila kuongeza habari isiyomo katika matini.
theological_decisions:
- issue: Nahau ya kifo katika taarifa ya kifalme
  choice: Kuhifadhi usemi “akalala pamoja na baba zake.”
  alternative: “alikufa” au “akafariki.”
  rationale: Nahau hii ni sehemu ya mtindo wa taarifa za kifalme katika Biblia na huhifadhi mwendelezo wa kifasihi bila kuficha maana, kwa kuwa maziko yanatajwa mara moja.
- issue: Upeo wa maana ya “wana wa Daudi”
  choice: Kuhifadhi “wana wa Daudi” katika matini na kufafanua katika tanbihi.
  alternative: “wazao wa Daudi.”
  rationale: Kiebrania kinasema kihalisi “wana wa Daudi,” lakini hapa usemi huo unaweza kuuhusu ukoo mpana wa kifalme wa Daudi. Tanbihi huhifadhi uwazi bila kuamua maana kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nahau ya Kiebrania umehifadhiwa pale unapoeleweka katika muktadha; sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili.
