source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: sw
  text: Na sasa mnasema kwamba mtajitia nguvu ili kuupinga ufalme wa Yahweh ulioko mkononi mwa wana wa Daudi[a][b]. Nanyi ni umati mkubwa, na pamoja nanyi mna wale ndama wa dhahabu ambao Yeroboamu aliwatengeneza kwa ajili yenu kuwa miungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnasema kwamba mtajionyesha kuwa wenye nguvu mbele ya ufalme wa Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mkononi mwa wana wa Daudi,” nahau inayoonyesha utawala au usimamizi kupitia ukoo wa Daudi.
    reason: cultural_note
  - marker: c
    text: Au, “kwa miungu.” Neno la Kiebrania ni la wingi na linawahusu kwa njia ya kipolemiki wale ndama waliokuwa sanamu za Yeroboamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: mnasema
  rationale: Kitenzi kishirikishi kinaonyesha usemi au kusudi la sasa; “mnasema” kinadumisha namna ya usemi wa Abiya bila kuugeuza moja kwa moja kuwa nia ya moyoni.
- source_word: לְהִתְחַזֵּק
  choice: mnaweza kujitia nguvu ili kuupinga
  rationale: Hitpaeli ya חזק huonyesha kujifanya imara au kujionyesha mwenye nguvu. Katika muktadha wa mapambano, tafsiri hii inadumisha wazo la nguvu huku ikieleza upinzani kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי
  choice: kuupinga
  rationale: Ingawa maana ya msingi ni “mbele ya,” hapa kishazi kinaeleza kukabiliana na ufalme katika mazingira ya kijeshi. Dokezo [a] linahifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo halisi.
- source_word: מַמְלֶכֶת יְהוָה
  choice: ufalme wa Yahweh
  rationale: Maneno haya yanaonyesha kwamba ufalme ni wa Yahweh; jina la agano יְהוָה limetolewa wazi kama “Yahweh.”
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: ulioko mkononi mwa wana wa Daudi
  rationale: Tafsiri inadumisha taswira ya Kiebrania ya kuwa “mkononi mwa” huku Kiswahili kikieleweka kuwa utawala huo unasimamiwa kupitia ukoo wa Daudi.
- source_word: הָמוֹן רָב
  choice: umati mkubwa
  rationale: Kishazi kinasisitiza wingi wao, hasa kama jeshi; “umati mkubwa” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: עֶגְלֵי זָהָב
  choice: wale ndama wa dhahabu
  rationale: Kiwakilishi “wale” kinaonyesha vitu vya ibada vinavyojulikana katika muktadha wa Yeroboamu, na “ndama wa dhahabu” ni usemi wazi wa Kiswahili.
- source_word: לֵאלֹהִים
  choice: wawe miungu
  rationale: Wingi wa אֱלֹהִים hapa unawahusu wale sanamu kama vitu vya kuabudiwa. Tafsiri inadumisha wingi na ukali wa shutuma za kifungu.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahweh” linadumisha jina la agano badala ya kulibadili kuwa cheo.
- issue: Ufalme wa Yahweh na utawala wa ukoo wa Daudi
  choice: ufalme wa Yahweh ulioko mkononi mwa wana wa Daudi
  alternative: ufalme wa Yahweh unaotawaliwa na wana wa Daudi
  rationale: 'Muundo huu unahifadhi mvutano wa kiteolojia: ufalme ni wa Yahweh, lakini uko mikononi mwa ukoo wa Daudi. Hauufanyi ukoo huo kuwa wenye ufalme kwa kujitegemea, wala haufuti wajibu wao wa kuusimamia.'
- issue: Hadhi ya ndama wa dhahabu
  choice: aliwatengenezea wawe miungu
  alternative: aliwatengenezea kwa ajili ya miungu
  rationale: Wingi wa Kiebrania umehifadhiwa kwa namna ya kipolemiki, bila kutambua sanamu hizo kuwa miungu halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo unafuata hoja ya hotuba ya Abiya, huku dokezo likihifadhi tafsiri halisi zaidi ya kishazi chenye utata לְהִתְחַזֵּק לִפְנֵי.
