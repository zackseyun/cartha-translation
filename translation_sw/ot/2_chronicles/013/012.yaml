id: 2CH.13.12
reference: 2 Chronicles 13:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: sw
  text: Tazama, Mungu ndiye aliye mkuu wetu, na makuhani wake wako pamoja nasi, wakiwa na tarumbeta za ishara ya vita ili kupiga ishara dhidi yenu. Enyi wana wa Israeli[a], msipigane na Yahwe, Mungu wa baba zenu, kwa maana hamtafanikiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Enyi Waisraeli.” Kiebrania kinasema “wana wa Israeli,” umbo la wingi wa kiume linalotumiwa hapa kuwaita Waisraeli moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha usemi kinachovuta fikira kwa msisitizo kuelekea maneno yanayofuata; “Tazama” ni la kawaida na lenye nguvu katika Kiswahili.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: Mungu yuko pamoja nasi mbele yetu
  rationale: “Mbele yetu” huhifadhi taswira ya Mungu kuwa kichwani au mstari wa mbele, ikidokeza uongozi bila kuifanya tafsiri kuwa maelezo tu.
- source_word: וְכֹהֲנָיו
  choice: na makuhani wake wako pamoja nasi
  rationale: Kiwakilishi cha nafsi ya tatu umoja kinamrejelea Mungu; kurudia “wako pamoja nasi” kunafanya muundo wa sentensi uwe wazi na wa asili kwa Kiswahili.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: wakiwa na tarumbeta za mlio wa vita
  rationale: חֲצֹצְרוֹת ni tarumbeta za ibada zilizotumiwa pia kutoa ishara, na תְּרוּעָה hapa ni mlio au ishara katika mazingira ya vita.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: ili kutoa ishara dhidi yenu
  rationale: Kitenzi cha Hiphil kinaonyesha kutoa mlio au ishara; “dhidi yenu” huhifadhi maana ya uhasama ya עֲלֵיכֶם katika muktadha huu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Enyi wana wa Israeli
  rationale: Huhifadhi namna ya moja kwa moja ya kuwaita watu na taswira halisi ya “wana,” huku “Enyi” ikifanya mwito huo kuwa wa kawaida katika Kiswahili.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: msipigane na Yahwe
  rationale: Ni katazo la moja kwa moja; baada ya kitenzi cha kupigana, “na” kwa kawaida humaanisha dhidi ya anayepiganwa naye katika Kiswahili.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Huhifadhi kauli ya agano inayowaunganisha walengwa na mababu zao.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: kwa maana hamtafanikiwa
  rationale: צָלַח katika Hiphil humaanisha kufanikiwa; tafsiri hii haibani maana kuwa ushindi wa kijeshi pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina la agano bila kulibadili kuwa cheo.
- issue: Maana ya uwepo wa Mungu בָרֹאשׁ
  choice: mbele yetu
  alternative: akiwa kiongozi wetu; akiwa kichwani mwetu
  rationale: “Mbele yetu” huhifadhi mvutano kati ya nafasi ya mstari wa mbele na uongozi, badala ya kuamua kwamba usemi huo unamaanisha uongozi pekee.
- issue: Namna ya kuwasilisha בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Uchaguzi huu huhifadhi umbo la kiume la Kiebrania na namna ya mwito wa kiagano; mbadala wa kawaida zaidi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi taswira ya Mungu kuwa mbele ya watu wake na imetenganisha nomino “tarumbeta za mlio wa vita” na kusudi la kutoa ishara dhidi ya adui.
