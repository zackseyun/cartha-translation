base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: sw
  text: Yeroboamu hakubaki na nguvu tena katika siku za Abiya. Yahwe akampiga[a], naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtesa” au “alimletea pigo.” Kiebrania kinasema tu kwamba Yahwe “alimpiga” Yeroboamu, bila kubainisha njia hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: hakubaki na nguvu
  rationale: Kirai hiki kinaonyesha kwamba Yeroboamu hakuendelea kuwa na nguvu au mamlaka. Tafsiri hii inahifadhi maana ya kubaki au kudumu na nguvu bila kuifafanua kuwa ushindi wa kijeshi pekee.
- source_word: עוֹד
  choice: tena
  rationale: Pamoja na ukanushi, neno hili lina maana ya ‘si tena’ au ‘hakudumu zaidi.’ Katika sentensi hii, ‘hakubaki na nguvu tena’ ni Kiswahili cha kawaida na wazi.
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: katika siku za Abiya
  rationale: Hii ni tafsiri ya karibu ya nahau ya Kiebrania inayomaanisha wakati wa maisha au utawala wa Abiya.
- source_word: וַיִּגְּפֵהוּ
  choice: akampiga
  rationale: Kitenzi נגף kinaweza kueleza pigo, tauni, mateso, au kushindwa. ‘Akampiga’ kinahifadhi upana wa neno hilo bila kubainisha njia ambayo haijaelezwa katika andiko.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika tetragramatoni limewasilishwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Hii inawasilisha kwa urahisi mfuatano wa masimulizi ya Kiebrania bila kulazimisha kauli ya wazi zaidi kuhusu namna pigo hilo lilivyosababisha kifo.
theological_decisions:
- issue: Asili ya tendo la Mungu katika וַיִּגְּפֵהוּ יְהוָה
  choice: Andiko linasema moja kwa moja kwamba Yahwe alimpiga Yeroboamu, kisha Yeroboamu akafa, bila kutaja njia ya pigo hilo.
  alternative: Yahwe alimletea ugonjwa au tauni; au alimwangusha mara moja vitani au kwa hukumu nyingine.
  rationale: Kiebrania kinamhusisha Yahwe moja kwa moja na pigo hilo, lakini hakisemi ikiwa lilikuwa ugonjwa, jeraha la vita, au njia nyingine. Tafsiri inaacha jambo hilo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kisimulizi; ‘hakubaki na nguvu tena’ ni wa kawaida kwa wasomaji huku ukihifadhi maana ya kirai cha Kiebrania. Alama ya tanbihi imewekwa baada ya ‘akampiga,’ ambako ufafanuzi wake unahusika moja kwa moja.
