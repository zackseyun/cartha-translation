base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: sw
  text: Abiya akaingia vitani akiwa na jeshi la wanaume 400,000 waliochaguliwa[a], wapiganaji mashujaa; naye Yeroboamu akajipanga kupigana naye akiwa na wanaume 800,000 waliochaguliwa, mashujaa hodari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alishiriki vitani.” Nahau ya Kiebrania, kwa tafsiri ya neno kwa neno, ni “akafunga vita.”
    reason: lexical_alternative
  - marker: b
    text: “Mashujaa hodari” hutafsiri usemi wa kijeshi wa Kiebrania unaomaanisha wapiganaji shupavu na wenye uwezo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: akaingia vitani
  rationale: Kitenzi אסר kwa kawaida humaanisha ‘funga,’ lakini katika nahau hii ya kijeshi pamoja na מִלְחָמָה humaanisha kujiingiza au kuanza kushiriki katika mapambano. ‘Akaingia vitani’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kutafsiri nahau kihalisi.
- source_word: בְּחַיִל
  choice: akiwa na jeshi
  rationale: חַיִל hapa ni nguvu ya kijeshi au jeshi, kama idadi ya askari inayofuata inavyoonyesha.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: mashujaa wa vita
  rationale: Kirai hiki kinaonyesha wapiganaji wenye nguvu na uzoefu; ‘mashujaa wa vita’ huhifadhi uzito na kazi yao ya kijeshi.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ בָּחוּר
  choice: 400,000 waliochaguliwa
  rationale: בָּחוּר katika muktadha huu huonyesha askari walioteuliwa au walio bora. Idadi inabaki kama ilivyo katika maandishi ya Kiebrania.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: akapanga jeshi lake kupigana naye
  rationale: עָרַךְ katika matumizi ya kijeshi ni kupanga askari katika safu za mapambano. Tafsiri hii huweka wazi maana ya mbinu ya kijeshi na uadui uliopo.
- source_word: גִּבּוֹר חָיִל
  choice: mashujaa hodari
  rationale: Usemi huu wa kijeshi humaanisha wapiganaji shupavu, wenye uwezo na nguvu; ‘mashujaa hodari’ ni wa asili na unaeleweka katika Kiswahili cha sasa.
