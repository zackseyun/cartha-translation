  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: sw
  text: Lakini sisi, Yahwe ndiye Mungu wetu, nasi hatujamwacha[a]. Makuhani wanaomtumikia Yahwe ni wana wa Aroni, nao Walawi wanatekeleza kazi yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatujamtelekeza.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “Walawi katika kazi,” yaani, wakifanya huduma waliyopangiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Lakini sisi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha ulinganisho wa kimuktadha kati ya Yuda na ufalme wa kaskazini; “Lakini sisi” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ingawa umbo la Kiebrania ni la wingi kisarufi, linamtaja Yahwe mmoja na hutumiwa kama cheo cha Mungu wa Israeli.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: nasi hatujamwacha
  rationale: Kitenzi עזב kinaweza kumaanisha kuacha au kutelekeza. Wakati timilifu wa Kiswahili unaonyesha uaminifu unaodaiwa kuendelea hadi sasa.
- source_word: מְשָׁרְתִים לַיהוָה
  choice: wanaomtumikia Yahwe
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha huduma ya kikuhani inayoendelea, huku ל ikimtaja yule anayetumikiwa.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Tafsiri hii inahifadhi kwa karibu usemi wa Kiebrania unaotaja ukoo wa kikuhani wa Aroni.
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: nao Walawi wanatekeleza kazi yao
  rationale: Kishazi cha Kiebrania ni kifupi, kihalisi “na Walawi katika kazi.” Kiswahili hiki kinaonyesha kwamba Walawi wanashughulika na huduma waliyopewa bila kuibana maana ya מְלָאכָה kupita kiasi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; kulitohowa kama “Yahwe” huhifadhi hadhi yake kama jina binafsi.
- issue: Nguvu ya wakati katika עֲזַבְנֻהוּ
  choice: hatujamwacha
  alternative: hatukumwacha
  rationale: Katika hoja ya Abiya, kauli hii inadai uaminifu unaoendelea, si tukio la wakati uliopita pekee; wakati timilifu wa Kiswahili huhifadhi maana hiyo.
- issue: Kishazi kifupi kuhusu kazi ya Walawi
  choice: wanatekeleza kazi yao
  alternative: wako katika kazi
  rationale: Kiebrania hakina kitenzi dhahiri katika kishazi hiki. Tafsiri iliyochaguliwa inaweka wazi kwa Kiswahili asilia kuwa Walawi wanafanya huduma yao, bila kutaja kazi maalumu ambayo chanzo hakijaitaja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa mstari unahifadhi utofautishaji wa “sisi,” jina Yahwe, ukoo wa Aroni, na ufupi wa kishazi kinachohusu huduma ya Walawi.
