  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֣קָם אֲבִיָּ֗ה מֵ/עַל֙ לְ/הַ֣ר צְמָרַ֔יִם אֲשֶׁ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי יָרָבְעָ֥ם וְ/כָל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: sw
  text: Ndipo Abiya akasimama juu ya Mlima Semaraimu[a], ulio katika nchi ya vilima ya Efraimu, akasema, “Nisikilizeni, Yeroboamu na Israeli yote!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulio katika milima ya Efraimu.” Maneno ya Kiebrania yanaweza kumaanisha nchi ya vilima ya Efraimu au eneo lake la milima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akasimama
  rationale: Katika masimulizi קום huweza kumaanisha kuinuka au kusimama; hapa “akasimama” ni ya kawaida na inafaa utangulizi wa hotuba bila kuongeza wazo la msimamo rasmi wa kijeshi.
- source_word: מֵעַל לְהַר
  choice: juu ya Mlima
  rationale: Mfuatano wa vihusishi unaeleza mahali Abiya aliposimama juu ya mlima; Kiswahili hiki kinatoa maana ya mahali kwa njia ya kawaida.
- source_word: צְמָרַיִם
  choice: Semaraimu
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: ulio katika nchi ya vilima ya Efraimu
  rationale: הַר hapa inaweza kuonyesha eneo la vilima au milima, si kilele kimoja tu; “nchi ya vilima” huwasilisha maana hiyo ya kijiografia kwa uwazi.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Huu ni utangulizi wa kawaida wa usemi katika masimulizi, ukiendelea kwa asili na kitenzi kilichotangulia.
- source_word: שְׁמָעוּנִי
  choice: Nisikilizeni
  rationale: Ni amri ya wingi yenye kiambishi cha nafsi ya kwanza umoja. “Nisikilizeni” ni kauli ya moja kwa moja, yenye nguvu na ya asili katika Kiswahili cha sasa.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Yeroboamu na Israeli yote
  rationale: Inahifadhi mwito wa moja kwa moja kwa mfalme na jina la taifa kama lilivyo katika Kiebrania, bila kulibadili kuwa maelezo ya kikabila pekee.
theological_decisions:
- issue: Tafsiri ya יִשְׂרָאֵל katika mazingira ya ufalme uliogawanyika
  choice: Israeli yote
  alternative: Waisraeli wote
  rationale: Kiebrania kinatumia moja kwa moja jina la taifa lenye uzito wa agano. “Israeli yote” huhifadhi mvutano wa kisiasa na kitheolojia wa mwandishi anapoliita kundi la ufalme wa kaskazini kwa jina kamili la kitaifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi ni mwepesi kusomeka, huku mwito wa Abiya ukibaki wa moja kwa moja na wenye nguvu.
