  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: sw
  text: Watu wasiofaa, wana wa Beliali[a], wakakusanyika kumzunguka, nao wakawa na nguvu kuliko Rehoboamu mwana wa Sulemani. Wakati huo Rehoboamu alikuwa kijana, dhaifu wa moyo, na hakuwa amejiimarisha dhidi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wahuni” au “watu waovu.” Usemi “wana wa Beliali” unaweza kumaanisha watu wasiofaa au waovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: wakakusanyika kumzunguka
  rationale: Kitenzi קבץ pamoja na עַל kinaweza kumaanisha kukusanyika kumzunguka mtu au dhidi yake. Muktadha unaonyesha watu hawa wakimzunguka Yeroboamu kama wafuasi, huku uhasama wao kwa Rehoboamu ukionekana katika kishazi kinachofuata.
- source_word: אֲנָשִׁים רֵקִים
  choice: watu wasiofaa
  rationale: רֵקִים maana yake ya msingi ni ‘watupu,’ lakini hapa ni usemi wa kuwadharau watu wasio na thamani au tabia njema. ‘Watu wasiofaa’ ni Kiswahili cha kawaida kinachobakiza hukumu hiyo.
- source_word: בְּנֵי בְלִיַּעַל
  choice: wana wa Beliali[a]
  rationale: Tafsiri ya karibu na muundo wa Kiebrania inahifadhi uwezekano kwamba Beliali imetumiwa kama jina lililofanywa nafsi au kama usemi wa uovu na kutofaa. Tanbihi inaeleza maana ya kiusemi.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: wakawa na nguvu kuliko
  rationale: Hitpaeli ya אמץ pamoja na עַל inaonyesha kuwa walijionyesha wenye nguvu dhidi ya Rehoboamu na wakamzidi nguvu. Tafsiri hii ni ya kawaida na inaweka wazi nguvu ya kulinganisha katika muktadha.
- source_word: נַעַר
  choice: kijana
  rationale: Neno linaweza kumaanisha mvulana, kijana, au mtu asiye na uzoefu. ‘Kijana’ huhifadhi kauli ya msemaji bila kuibadili moja kwa moja kuwa tathmini ya kutokuwa na uzoefu.
- source_word: רַךְ לֵבָב
  choice: dhaifu wa moyo
  rationale: Usemi huu kwa herufi ni ‘mwororo wa moyo,’ lakini katika muktadha wa kisiasa unaonyesha kukosa uthabiti au ujasiri, si huruma.
- source_word: וְלֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: hakuwa amejiimarisha dhidi yao
  rationale: Tafsiri hii inahifadhi wazo la kujitia nguvu na hali ya tendo lililokuwa halijafanyika, bila kuligeuza kuwa madai kwamba hakuwa na uwezo kabisa wa kuwapinga.
theological_decisions:
- issue: Maana ya בְּנֵי בְלִיַּעַל
  choice: wana wa Beliali
  alternative: wahuni; watu waovu; watu wasiofaa
  rationale: Kubakiza usemi wa karibu na Kiebrania huepuka kuamua kimya kimya kama ‘Beliali’ hapa ni jina lililofanywa nafsi au dhana ya uovu na kutofaa. Tanbihi inawapa wasomaji maana ya kiusemi.
- issue: Tathmini ya hali ya Rehoboamu katika וְלֹא הִתְחַזַּק
  choice: hakuwa amejiimarisha dhidi yao
  alternative: hakuweza kusimama dhidi yao
  rationale: Kiebrania kinasema kwamba hakujitia nguvu; hakisemi wazi kwamba hakuwa na uwezo. Tafsiri iliyochaguliwa inahifadhi tofauti hiyo na wajibu unaodokezwa na kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Dhaifu wa moyo’ na ‘amejiimarisha dhidi yao’ huhifadhi picha za Kiebrania kwa lugha ya sasa; ‘Beliali’ imebakizwa kwa sababu ya utata halisi wa usemi wa chanzo.
