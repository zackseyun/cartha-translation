  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: sw
  text: Yeroboamu mwana wa Nebati, mtumishi wa Sulemani mwana wa Daudi, akainuka na kumwasi bwana wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mtiririko huu wa masimulizi kinaanzisha hatua ya Yeroboamu ya kusimama dhidi ya mamlaka; “akainuka” huhifadhi nguvu hiyo bila kudokeza lazima hatua ya kijeshi.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya Biblia za Kiswahili, huku muundo wa ukoo ukitafsiriwa moja kwa moja.
- source_word: עֶבֶד
  choice: mtumishi
  rationale: Katika muktadha wa utawala wa kifalme, neno hili linaeleza uhusiano wa huduma na mamlaka kati ya Yeroboamu na Sulemani; “mtumishi” linafaa kuliko “mtumwa,” ambalo lingeweza kudokeza hali mahsusi isiyothibitishwa hapa.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Sulemani mwana wa Daudi
  rationale: Tafsiri hii huhifadhi majina na msisitizo wa nasaba ya kifalme uliomo katika Kiebrania.
- source_word: וַיִּמְרֹד
  choice: kumwasi
  rationale: Kitenzi מרד humaanisha kuasi mamlaka. “Kumwasi” ni Kiswahili cha kawaida na huonyesha wazi kwamba uasi ulimlenga mkuu wake.
- source_word: עַל אֲדֹנָיו
  choice: bwana wake
  rationale: אָדוֹן hapa humtaja Sulemani kama mwenye mamlaka juu ya Yeroboamu, si Mungu. “Bwana wake” huhifadhi maana ya uhusiano wa mamlaka, huku “mkuu wake” likibaki chaguo linalowezekana.
theological_decisions:
- issue: Tafsiri ya אֲדֹנָיו inayomhusu mwanadamu
  choice: bwana wake
  alternative: mkuu wake
  rationale: Rejeo ni kwa Sulemani, mkuu wa kibinadamu wa Yeroboamu, wala si jina au cheo cha Mungu. Herufi ndogo katika “bwana” husaidia kutofautisha matumizi haya na cheo cha kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “bwana wake,” badala ya baada ya jina Nebati.
