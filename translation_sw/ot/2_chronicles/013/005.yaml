base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: sw
  text: 'Je, hamjui kwamba Yahweh, Mungu wa Israeli, alimpa Daudi na wanawe ufalme juu ya Israeli milele kwa agano la chumvi[a]?


    [a] Huenda usemi huu unaonyesha agano lenye nguvu na la kudumu; linganisha Hesabu 18:19.

    [b] “Wanawe” hapa humaanisha ukoo wa kifalme wa Daudi, yaani nasaba yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda usemi huu unaonyesha agano lenye nguvu na la kudumu; linganisha Hesabu 18:19.
    reason: cultural_note
  - marker: b
    text: “Wanawe” hapa humaanisha ukoo wa kifalme wa Daudi, yaani nasaba yake.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: Je, hamjui
  rationale: Hili ni swali la balagha linalotarajia jibu la kukubali. Wingi wa nafsi ya pili umehifadhiwa katika “hamjui,” huku muundo ukiwa wa kawaida katika Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa muundo wa Kiebrania unaomtambulisha Yahweh kuwa Mungu wa Israeli.
- source_word: נָתַן מַמְלָכָה
  choice: alimpa ... ufalme
  rationale: “Alimpa” huhifadhi tendo la kihistoria la kutoa, na “ufalme” hapa huonyesha mamlaka ya kifalme juu ya Israeli, si eneo tu.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Kihusishi kinaonyesha kutawala taifa au watu wa Israeli.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili huhifadhi dai la kudumu la agano bila kulipunguza kuwa muda mrefu tu.
- source_word: לוֹ וּלְבָנָיו
  choice: uwe wake na wa wanawe
  rationale: Muundo huu wa Kiswahili unaeleza kwa uwazi kwamba ufalme ulitolewa kwa Daudi na ukoo wake wa kifalme, huku “wanawe” likihifadhi neno halisi la Kiebrania.
- source_word: בְּרִית מֶלַח
  choice: kwa agano la chumvi
  rationale: Taswira halisi ya nahau ya Kiebrania imehifadhiwa katika matini, na maana yake inayowezekana imefafanuliwa katika tanbihi.
theological_decisions:
- issue: Kudumu kwa ufalme wa Daudi
  choice: Kudumisha maneno “milele” na “agano la chumvi” kama yalivyo katika dai la kifungu.
  alternative: Kutafsiri kwa ufafanuzi kuwa “agano la kudumu.”
  rationale: Kiebrania kinaweka pamoja לְעוֹלָם na בְּרִית מֶלַח. Kuyahifadhi yote mawili kunatunza uzito wa lugha ya agano bila kuingiza hitimisho la kitheolojia lisilotajwa wazi hapa.
- issue: Maana ya “wanawe” katika muktadha wa kifalme
  choice: Kutumia “wanawe” katika matini na kueleza maana ya kiukoo katika tanbihi.
  alternative: Kutafsiri moja kwa moja kuwa “wazao wake” au “nasaba yake.”
  rationale: “Wanawe” huhifadhi usemi wa Kiebrania, ilhali tanbihi inasaidia msomaji kuelewa kwamba muktadha unahusu mwendelezo wa ukoo wa kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Dashi zimetumiwa kuonyesha wazi kwamba ufalme ulikuwa wa Daudi na wanawe bila kuondoa mpangilio na mkazo wa Kiebrania.
