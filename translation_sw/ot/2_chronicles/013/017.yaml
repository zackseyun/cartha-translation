base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: sw
  text: Abiya na watu wake wakawapiga pigo kubwa[a], na wanaume wateule laki tano wa Israeli wakaanguka wameuawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pigo kali” au “mauaji makubwa.” Kihalisi, kirai cha Kiebrania ni “pigo kubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: wakawapiga
  rationale: Kitenzi נכה katika muktadha wa vita humaanisha kupiga au kushambulia. “Wakawapiga” huhifadhi tendo halisi la kivita bila kutangulia kueleza matokeo, ambayo yanafuata katika kishazi cha pili.
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: Abiya na watu wake
  rationale: עַם ni “watu”; ingawa hapa ni wale waliokuwa pamoja naye vitani, “watu wake” huhifadhi upana wa neno la Kiebrania kuliko “jeshi lake.”
- source_word: מַכָּה רַבָּה
  choice: pigo kubwa
  rationale: Hii ndiyo tafsiri ya karibu ya kirai cha Kiebrania. Haichanganyi pigo lenyewe na taarifa inayofuata kuhusu waliouawa.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: wakaanguka wakiwa wameuawa
  rationale: נפל katika taarifa za vita ni “kuanguka,” na חֲלָלִים hubainisha kwamba walioanguka walikuwa wameuawa. Muundo huu huhifadhi vipengele vyote viwili vya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: מִיִּשְׂרָאֵל
  choice: wa Israeli
  rationale: Kirai hiki hutambulisha kundi walikotoka waliouawa, yaani Israeli.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: laki tano
  rationale: Hii ni namna ya kawaida na wazi ya Kiswahili ya kutaja 500,000, bila kubadili thamani ya namba iliyo katika matini.
- source_word: אִישׁ בָּחוּר
  choice: wanaume wateule
  rationale: בָּחוּר hapa huonyesha wanaume walioteuliwa au waliochaguliwa, hasa askari bora. “Wanaume wateule” huhifadhi maana hiyo bila kuongeza sifa ya ushujaa isiyotajwa moja kwa moja.
theological_decisions:
- issue: Idadi kubwa ya waliouawa katika simulizi la vita
  choice: Kudumisha idadi ya laki tano kama ilivyo katika matini ya Kiebrania.
  alternative: Kuichukulia kama lugha ya kutia chumvi, kuirekebisha, au kutafsiri אֶלֶף kuwa kikundi cha kijeshi.
  rationale: Mstari unatoa idadi hiyo moja kwa moja bila ishara ya kimatini ya kuipunguza au kuifanya ya mfano. Tafsiri inapaswa kuwasilisha ushahidi wa chanzo bila kutatua kimya kimya swali la kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakawapiga pigo kubwa” huhifadhi mwangwi wa makusudi wa mzizi wa Kiebrania; “wakaanguka wakiwa wameuawa” ni wazi zaidi kwa msomaji wa kawaida kuliko mtindo wa kishairi “wakaanguka wameuawa.”
