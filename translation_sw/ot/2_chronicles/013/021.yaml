  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֣ק אֲבִיָּ֔הוּ וַ/יִּ֨שָּׂא ל֔/וֹ נָשִׁ֖ים אַרְבַּ֣ע עֶשְׂרֵ֑ה וַ/יּ֗וֹלֶד עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ בָּנִ֔ים וְ/שֵׁ֥שׁ עֶשְׂרֵ֖ה בָּנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: sw
  text: Abiya akazidi kuwa na nguvu[a]. Akajitwalia wake kumi na wanne[b], akazaa wana ishirini na wawili na binti kumi na sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa hodari,” au, “akajiimarisha.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “akajitwalia wake kumi na wanne,” yaani, aliwaoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: akazidi kuwa na nguvu
  rationale: Kauli hii inaonyesha Abiya aliongezeka katika nguvu au akaimarika. Tafsiri hii ni ya kawaida katika Kiswahili na haibainishi bila msingi ikiwa nguvu hizo zilikuwa za kijeshi, kisiasa, au za aina nyingine.
- source_word: אֲבִיָּהוּ
  choice: Abiya
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים
  choice: akajitwalia wake
  rationale: Neno kwa neno ni ‘akajitwalia wake’; katika muktadha huu ni nahau yenye maana ya kuwaoa. Muundo huu unahifadhi pia wazo la לוֹ, ‘kwa ajili yake mwenyewe,’ huku tanbihi ikifafanua maana.
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: kumi na wanne
  rationale: Namba imefasiriwa moja kwa moja na kupatanishwa kisarufi na ‘wake.’
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Hifili ya ילד ikiwa na mtendaji wa kiume humaanisha kuzaa au kuwa baba wa watoto. ‘Akazaa’ ni Kiswahili cha sasa na cha kawaida katika taarifa za nasaba.
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: wana ishirini na wawili
  rationale: ‘Wana’ huhifadhi rejeo mahsusi kwa watoto wa kiume, na namba imepatana nayo kisarufi.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: na binti kumi na sita
  rationale: Tafsiri ya moja kwa moja inayohifadhi rejeo mahsusi kwa watoto wa kike.
theological_decisions:
- issue: Taarifa kuhusu kuwa na wake wengi
  choice: 'Kusimulia bila kuongeza hukumu ya kimaadili: ‘akajitwalia wake kumi na wanne.’'
  alternative: Kutumia ‘alioa wake kumi na wanne,’ au kuongeza kukubali au kukemea tendo hilo.
  rationale: Aya inaripoti tendo la Abiya na watoto wake bila kulisifu wala kulikemea waziwazi. Tafsiri haipaswi kuingiza hukumu ya kimadhehebu au ya kimaadili ambayo haikutamkwa katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Sentensi imegawanywa baada ya kishazi cha kwanza ili isomeke kwa urahisi, bila kupoteza mfululizo wa matendo katika Kiebrania.
