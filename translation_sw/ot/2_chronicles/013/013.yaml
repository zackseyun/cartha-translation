translation:
  language: sw
  text: Lakini Yeroboamu alikuwa amekipeleka kikosi cha kuvizia kuzunguka ili kiwafikie kutoka nyuma. Basi jeshi lake lilikuwa mbele ya Yuda, na kikosi cha kuvizia kilikuwa nyuma yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרָבְעָם
  choice: Lakini Yeroboamu
  rationale: Kiunganishi וְ kinaonyesha hapa hali inayokinzana na muktadha uliotangulia, hivyo limetafsiriwa 'Lakini'. 'Yeroboamu' ni umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: הַמַּאְרָב
  choice: askari wa kuvizia
  rationale: Nomino hii inaweza kumaanisha uviziaji au kikosi kilichowekwa kuvizia; muktadha wa watu waliokuwa nyuma ya Yuda unaunga mkono maana ya kikosi cha askari.
- source_word: הֵסֵב ... לָבוֹא מֵאַחֲרֵיהֶם
  choice: alikuwa ameuzungusha ... ili waje nyuma yao
  rationale: Hifadhi wazo la Yeroboamu kukipeleka kikosi kwa njia ya kuzunguka ili kitokee nyuma ya jeshi la Yuda.
- source_word: וַיִּהְיוּ
  choice: Hivyo, jeshi lake lilikuwa
  rationale: Kitenzi cha wingi kina mhusika anayeeleweka kutokana na muktadha—jeshi la Yeroboamu lililokabiliana na Yuda—na ametajwa wazi kwa Kiswahili cha kawaida.
