  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּפְנ֣וּ יְהוּדָ֗ה וְ/הִנֵּ֨ה לָ/הֶ֤ם הַ/מִּלְחָמָה֙ פָּנִ֣ים וְ/אָח֔וֹר וַֽ/יִּצְעֲק֖וּ לַ/יהוָ֑ה וְ/הַ/כֹּ֣הֲנִ֔ים מחצצרים בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: sw
  text: Watu wa Yuda walipogeuka, tazama, vita vilikuwa mbele yao na nyuma yao; wakamlilia Yahwe, nao makuhani walikuwa wakipiga tarumbeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: walipogeuka
  rationale: Kitenzi פנה katika muktadha huu kinaonyesha kugeuka na kugundua shambulio la nyuma; ‘walipogeuka’ ni ya kawaida na haiongezi maelezo yasiyokuwapo.
- source_word: יְהוּדָה
  choice: Watu wa Yuda
  rationale: Jina ‘Yuda’ linawakilisha kwa jumla watu au jeshi la Yuda. Kiswahili cha ‘Watu wa Yuda’ kinaweka maana hiyo wazi bila kuingiza neno maalumu ‘jeshi’ lisilotajwa moja kwa moja.
- source_word: וְהִנֵּה
  choice: kumbe
  rationale: ‘Kumbe’ linaonyesha ugunduzi wa ghafla na mshangao unaoletwa na הִנֵּה, kwa Kiswahili cha sasa na cha kawaida.
- source_word: הַמִּלְחָמָה פָּנִים וְאָחוֹר
  choice: walikuwa wanakabiliwa na vita mbele na nyuma
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba mapigano yaliwakabili kutoka pande zote mbili, huku ukihifadhi ‘mbele na nyuma’ ya Kiebrania.
- source_word: וַיִּצְעֲקוּ
  choice: Wakamlilia
  rationale: ‘Kumlilia’ huwasilisha kilio cha dharura kilichoelekezwa kwa Mungu, si kelele ya kawaida tu.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Linatamka jina la agano יהוה kwa namna iliyozoeleka katika Kiswahili na kulingana na mwongozo wa mradi.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa כֹּהֲנִים.
- source_word: מחצצרים בַּחֲצֹצְרוֹת
  choice: walikuwa wakipiga tarumbeta
  rationale: Muundo endelevu ‘walikuwa wakipiga’ unaakisi tendo linaloendelea la participo; ‘tarumbeta’ ni neno linaloeleweka kwa vyombo hivi bila kuongeza kwamba vilikuwa vya fedha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: ‘Yahwe’ huhifadhi jina la pekee la Mungu badala ya kulibadili kuwa cheo, na linafuata uamuzi uliotolewa wa mradi bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kumbe’ hudumisha uzito wa ugunduzi wa ghafla kwa njia ya asili; uratibu wa ‘nao’ unaonyesha tendo sambamba la makuhani bila kulifanya kuwa maelezo ya pembeni tu.
