id: 2CH.13.11
reference: 2 Chronicles 13:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: sw
  text: Nasi humtolea Yahweh dhabihu za kuteketezwa asubuhi kwa asubuhi na jioni kwa jioni, humfukizia uvumba wa manukato, na huweka mpangilio wa mikate[a] juu ya meza safi, pamoja na kinara cha dhahabu na taa zake, ili ziwashwe jioni kwa jioni; kwa maana tunashika agizo la Yahweh Mungu wetu, lakini ninyi mmemwacha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mikate ya wonyesho” au “mikate ya uwepo wa Mungu.” Kwa maana halisi, “mpangilio wa mikate.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: tunamtolea
  rationale: Kitenzi hiki katika muktadha wa dhabihu humaanisha kusababisha sadaka ipae kwa moshi; ‘tunamtolea’ ni Kiswahili cha kawaida kinachoonyesha tendo la kidini bila kulifanya kuwa kuchoma tu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetoholewa moja kwa moja ili kuhifadhi jina binafsi la Mungu katika maandishi ya Kiebrania.
- source_word: עֹלוֹת
  choice: dhabihu za kuteketezwa
  rationale: Hili ni neno la kawaida na lililo wazi kwa sadaka zilizoteketezwa madhabahuni.
- source_word: בַּבֹּקֶר בַּבֹּקֶר ... בָּעֶרֶב בָּעֶרֶב
  choice: kila asubuhi na kila jioni
  rationale: Marudio ya Kiebrania yana maana ya tendo la kila siku; muundo huu ni wa asili katika Kiswahili na huhifadhi hali ya ukawaida.
- source_word: וּקְטֹרֶת סַמִּים
  choice: uvumba wenye manukato
  rationale: Huwasilisha uvumba uliotengenezwa kwa vitu vya kunukia bila kutumia lugha ngumu isiyo ya kawaida.
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: mikate iliyopangwa
  rationale: Huhifadhi wazo halisi la mikate iliyowekwa kwa mpangilio, bila kuingiza istilahi ya kimapokeo moja kwa moja katika matini.
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: juu ya meza safi
  rationale: ‘Safi’ hapa linaweza kubeba maana ya usafi wa kiibada katika muktadha wa hekalu.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: kinara cha dhahabu pamoja na taa zake ili ziwake
  rationale: Hutaja kifaa na taa zake kwa uwazi, huku kishazi cha kusudi kikihifadhi kazi ya taa hizo.
- source_word: שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: sisi tunatimiza wajibu wa kumtumikia Yahweh
  rationale: Nahau ya Kiebrania kuhusu ‘kushika wajibu/ulinzi’ inaelezwa kwa Kiswahili cha kawaida kama kutimiza huduma waliyopewa, bila kuifanya iwe ulinzi wa kimwili.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: lakini ninyi mmemwacha
  rationale: Huhifadhi utofautishaji mkali kati ya uaminifu unaodaiwa na wa kwanza na kuachwa kwa Yahweh na wa pili.
theological_decisions:
- issue: Istilahi ya mikate ya hekaluni
  choice: mikate iliyopangwa
  alternative: mikate ya Wonyesho; mikate ya Kuwapo
  rationale: Kiebrania kinasisitiza mpangilio wa mikate. Tafsiri kuu inahifadhi picha hiyo, na istilahi za kimapokeo zinawekwa katika tanbihi ili zisipotee.
- issue: Uwakilishi wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מִשְׁמֶרֶת katika huduma ya hekalu
  choice: wajibu wa kumtumikia Yahweh
  alternative: agizo la Yahweh; ulinzi wa Yahweh
  rationale: Katika muktadha huu neno linahusu wajibu wa kikuhani na utunzaji wa ibada, si kitendo cha kulinda Mungu. Tafsiri hii hutoa maana ya nahau kwa Kiswahili cha asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nasi’ na ‘lakini ninyi’ zinahifadhi utofautishaji wa hotuba; sentensi imegawanywa kwa kiasi ili orodha ndefu ya ibada isomeke kwa urahisi.
