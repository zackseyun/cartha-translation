  naturalness: Kiswahili ni fasaha kwa kiasi kikubwa, lakini "tunatunza kinara" ni usemi usio wa asili kwa tendo linalokusudiwa. "Mikate ya Kuwapo" katika tanbihi pia haijakaa kiasili bila kubainisha kuwa ni kuwapo kwa Mungu.
  terminology: '"Yahweh," "dhabihu za kuteketezwa," na "uvumba wa manukato" zinafaa. "Meza safi" inaweza kubaki, ingawa muktadha wake ni usafi wa kiibada. "Tunashika agizo la Yahweh" huhifadhi vizuri zaidi istilahi ya מִשְׁמֶרֶת kuliko tafsiri ya kiufafanuzi.'
