base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: sw
  text: 'Abiya akamfuatia Yeroboamu, akautwaa kutoka kwake miji hii: Betheli pamoja na vijiji vyake, Yeshana pamoja na vijiji vyake, na Efroni pamoja na vijiji vyake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: akamfuatia
  rationale: Huwasilisha kwa lugha ya kawaida tendo la Abiya la kumwandama Yeroboamu baada ya vita.
- source_word: וַיִּלְכֹּד מִמֶּנּוּ
  choice: akamnyang'anya
  rationale: Huhifadhi maana kwamba Abiya aliiteka miji kutoka katika mamlaka ya Yeroboamu, bila kuongeza maelezo yasiyokuwamo.
- source_word: עָרִים
  choice: miji kadhaa
  rationale: Nomino ya wingi inaanzisha orodha ya miji iliyotekwa; 'kadhaa' ni ya kiasili katika Kiswahili na haidai kwamba orodha ni kamili.
- source_word: בְּנוֹתֶיהָ
  choice: vijiji vyake
  rationale: Kihalisi ni 'binti zake,' lakini katika jiografia ya kale humaanisha makazi madogo yaliyouzunguka na kuutegemea mji mkuu.
- source_word: בֵּית אֵל / יְשָׁנָה / עפרון
  choice: Betheli / Yeshana / Efroni
  rationale: Majina yamenukuliwa kwa maumbo yanayosikika kiasili katika Kiswahili huku yakibaki karibu na Kiebrania.
