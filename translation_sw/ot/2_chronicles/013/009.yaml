  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: sw
  text: Je, hamkuwafukuza makuhani wa Yahweh, wana wa Aroni na Walawi, na kujifanyia makuhani kama watu wa nchi? Yeyote anayekuja kuwekwa wakfu[a] kwa fahali mchanga na kondoo dume saba anakuwa kuhani wa vitu ambavyo si miungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kujaza mkono wake,” usemi wa kiufundi unaomaanisha kuwekwa wakfu au kuingizwa rasmi katika huduma ya ukuhani.
    reason: lexical_alternative
  - marker: b
    text: Pia yaweza kutafsiriwa “kwa ajili ya wasio miungu” au “wa miungu ya uongo”; Kiebrania kinakataa moja kwa moja kwamba vitu hivyo vya ibada ni miungu kweli.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, hamku-
  rationale: Huanzisha swali la kukemea linalotarajia jibu la kukubali; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: הִדַּחְתֶּם
  choice: hamkuwafukuza
  rationale: Hifili ya נדח ina maana ya kusababisha waondolewe au wafukuzwe; ‘kuwafukuza’ huhifadhi nguvu ya tendo hilo.
- source_word: כֹּהֲנֵי יְהוָה
  choice: makuhani wa Yahweh
  rationale: Huhifadhi wazi uhusiano wa makuhani na jina la agano יְהוָה.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Huhifadhi usemi rasmi wa ukoo unaotambulisha mstari halali wa ukuhani.
- source_word: וְהַלְוִיִּם
  choice: na Walawi
  rationale: Huwataja Walawi kama kundi tofauti pamoja na wana wa Aroni, kama ilivyo katika Kiebrania.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: na kujifanyia makuhani
  rationale: Huwasilisha maana ya kuwafanya au kuwaweka makuhani kwa ajili yao wenyewe, pamoja na kidokezo cha kujitumikia kilicho katika לָכֶם.
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: kama mataifa ya nchi nyingine
  rationale: Ni usemi wa asili unaorejelea jamii za mataifa mengine bila kuingiza neno lenye hukumu ya ziada kama ‘wapagani’.
- source_word: כָּל הַבָּא
  choice: Yeyote anayekuja
  rationale: Huhifadhi muundo wa umoja wenye maana ya mtu yeyote na ukosoaji wa urahisi wa kupata wadhifa huo.
- source_word: לְמַלֵּא יָדוֹ
  choice: kuujaza mkono wake
  rationale: Huhifadhi kwa ukaribu nahau ya kiufundi ya Kiebrania badala ya kuifafanua kimya kimya kama kujiweka wakfu; maana yake inaelezwa katika tanbihi.
- source_word: בְּפַר בֶּן בָּקָר
  choice: kwa fahali mchanga
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya usemi wa sadaka unaomaanisha fahali kijana kutoka kundini.
- source_word: וְאֵילִם שִׁבְעָה
  choice: na kondoo dume saba
  rationale: Hutaja moja kwa moja wanyama saba wa kiume waliotakiwa katika utaratibu huo.
- source_word: וְהָיָה כֹהֵן
  choice: anakuwa kuhani
  rationale: 'Huwasilisha matokeo ya utaratibu: mtu huyo hupata hadhi ya kuhani.'
- source_word: לְלֹא אֱלֹהִים
  choice: wa vitu ambavyo si miungu
  rationale: Huhifadhi ukali wa Kiebrania unaokataa kwamba vitu hivyo vya ibada ni miungu kweli, badala ya kulainisha kuwa ‘miungu ya uongo’.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Jina la agano limetajwa moja kwa moja katika matini; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya לְלֹא אֱלֹהִים
  choice: wa vitu ambavyo si miungu
  alternative: wa miungu ya uongo; kwa ajili ya wasio miungu
  rationale: Kiebrania kinakataa uungu halisi wa vinavyoabudiwa. Tafsiri iliyochaguliwa huhifadhi madai hayo ya kitheolojia bila kuyafanya kuwa lebo tu.
- issue: Nahau ya kuwekwa katika ukuhani לְמַלֵּא יָדוֹ
  choice: kuujaza mkono wake, pamoja na tanbihi ya ufafanuzi
  alternative: kujiweka wakfu; kuwekwa rasmi kuwa kuhani
  rationale: Matini yenyewe huhifadhi taswira ya nahau ya Kiebrania, huku tanbihi ikieleza kazi yake ya kiufundi bila kuamua zaidi ya ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la kukemea umehifadhiwa, na nahau ngumu ya kikuhani imeachwa katika matini kwa ukaribu na chanzo huku ikifafanuliwa katika tanbihi. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika, si baada ya ‘Yahweh’ au ‘Walawi’.
