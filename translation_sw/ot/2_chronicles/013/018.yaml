  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: sw
  text: Basi, wakati huo Waisraeli walitiishwa, nao watu wa Yuda wakawa na nguvu, kwa sababu walimtegemea Yahwe, Mungu wa baba zao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: walitiishwa
  rationale: Nifali ya כנע ina maana ya kutiishwa au kushushwa. Katika muktadha wa vita, “walitiishwa” huhifadhi hali ya kutendwa na matokeo bila kudai zaidi kwamba waliangamizwa kabisa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Katika Kiswahili cha kawaida, “Waisraeli” ni njia ya asili ya kuwataja watu wa Israeli; hapa muktadha unaonyesha majeshi ya ufalme wa kaskazini. Tafsiri ya moja kwa moja “wana wa Israeli” ingesikika isiyo ya kawaida na ingeweza kueleweka kuwa wanaume pekee.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Ni ulinganifu wa kawaida na ulio wazi wa kirai cha wakati katika simulizi.
- source_word: וַיֶּאֶמְצוּ
  choice: wakawa na nguvu
  rationale: Kitenzi אמץ hueleza kuwa na nguvu au kupata nguvu. Usemi huu huhifadhi maana ya msingi kuliko kutafsiri moja kwa moja matokeo yake kuwa “walishinda.”
- source_word: בְנֵי יְהוּדָה
  choice: watu wa Yuda
  rationale: Huhifadhi ulinganifu na watu wa Israeli kwa Kiswahili cha asili bila kubana maana iwe wanaume pekee.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaanzisha sababu ya watu wa Yuda kuwa na nguvu.
- source_word: נִשְׁעֲנוּ עַל
  choice: walimtegemea
  rationale: שען על kwa msingi ni “kuegemea juu ya,” na kwa maana ya kimajazi ni kutegemea. “Walimtegemea” ni ya kawaida na huhifadhi wazo la kumtegemea mtu kwa msaada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa tahajia iliyozoeleka katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Huhifadhi kwa karibu nomino ya kiume אָבוֹת pamoja na mwangwi wake wa kihistoria na wa agano; katika muktadha huu “baba” hurejelea mababu wa taifa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina lenyewe la Mungu. “Yahwe” hulihifadhi kama jina binafsi kwa tahajia ya kawaida ya Kiswahili bila kulibadilisha kuwa cheo.
- issue: Sababu ya nguvu za Yuda
  choice: kwa sababu walimtegemea Yahwe
  alternative: kwa sababu walimwamini Yahwe
  rationale: “Walimtegemea” huakisi kwa karibu sitiari ya שען על ya kuegemea au kutegemea, huku ikiweka wazi kwamba utegemezi wao kwa Mungu ndio uliotolewa kama sababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Basi” linaendeleza matokeo ya simulizi; “lakini” linaonyesha tofauti kati ya hali ya Israeli na ya Yuda. Tahajia “Yahwe” imetumiwa kama umbo la kawaida la Kiswahili.
