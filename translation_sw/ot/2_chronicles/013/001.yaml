translation:
  language: sw
  text: Katika mwaka wa kumi na nane wa utawala wa mfalme Yeroboamu[a], Abiya akawa mfalme wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika simulizi sambamba la 1 Wafalme 15:1, Abiya anaitwa “Abiyamu”; hapa Mambo ya Nyakati inatumia jina “Abiya.”
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: Katika mwaka wa kumi na nane wa utawala
  rationale: Hii ni fomula ya kutaja mwaka wa utawala. Kiswahili cha kawaida huhitaji neno “utawala” ili kuonyesha wazi kwamba miaka ya ufalme wa Yeroboamu ndiyo inayohesabiwa; “wa kumi na nane” hutoa maana ya kiidadi kwa njia ya asili.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: wa Mfalme Yeroboamu
  rationale: Katika fomula hii, לַמֶּלֶךְ humtaja mtawala ambaye mwaka wake wa utawala unahesabiwa. “Mfalme Yeroboamu” ni mpangilio wa kawaida wa cheo na jina katika Kiswahili.
- source_word: וַ/יִּמְלֹךְ
  choice: akawa mfalme
  rationale: Kitenzi מלך hapa kinaeleza kuingia katika ufalme. “Akawa mfalme” huhifadhi maana hiyo kwa lugha rahisi na ya sasa kuliko tafsiri inayoweza kumaanisha tu kwamba alitawala.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Jina la Kiebrania אֲבִיָּה limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili. Hili ndilo umbo la jina katika Mambo ya Nyakati, tofauti na umbo linalopatikana katika simulizi sambamba la Wafalme.
- source_word: עַל יְהוּדָה
  choice: juu ya Yuda
  rationale: Baada ya מלך, עַל huonyesha watu au eneo linalotawaliwa. “Juu ya Yuda” huhifadhi muundo na maana ya chanzo kwa Kiswahili kinachoeleweka.
