source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲבִיָּ֔ה וּ/דְרָכָ֖י/ו וּ/דְבָרָ֑י/ו כְּתוּבִ֕ים בְּ/מִדְרַ֖שׁ הַ/נָּבִ֥יא עִדּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: sw
  text: Matendo mengine ya Abiya, mwenendo wake na maneno yake, yameandikwa katika kitabu cha ufafanuzi[a] cha nabii Ido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitabu cha uchunguzi,” “maelezo,” au kwa ujumla “kumbukumbu.” Neno la Kiebrania ni midrash; hapa linamaanisha kazi iliyoandikwa ya uchunguzi au ufafanuzi, si lazima aina ya maandiko ya marabi iliyositawi baadaye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲבִיָּה
  choice: Matendo mengine ya Abiya
  rationale: Katika kauli za muhtasari kuhusu wafalme, דִּבְרֵי humaanisha kwa upana matendo au mambo yaliyotokea, si maneno tu. “Matendo mengine” ni Kiswahili cha kawaida kinachoonyesha sehemu iliyobaki ya habari hizo.
- source_word: וּדְרָכָיו
  choice: mwenendo wake
  rationale: Wingi wa דֶּרֶךְ wenye kiambishi cha umilikaji hapa unaelekea kumaanisha tabia au namna ya maisha. “Mwenendo wake” huwasilisha maana hiyo kwa lugha ya sasa na yenye heshima.
- source_word: וּדְבָרָיו
  choice: na maneno yake
  rationale: Kwa kuwa kifungu hiki kimetenganishwa na matendo na mwenendo, דְּבָרָיו hapa yaelekea kurejelea maneno au kauli za Abiya. “Maneno yake” huhifadhi upana wa neno la Kiebrania bila kulibana kuwa semi rasmi pekee.
- source_word: כְּתוּבִים
  choice: yameandikwa
  rationale: Hii ni tafsiri ya moja kwa moja ya umbo la kutendwa kutoka כתב, linaloonyesha kwamba habari hizo zimo katika maandishi.
- source_word: בְּמִדְרַשׁ
  choice: katika kitabu cha ufafanuzi[a]
  rationale: מִדְרָשׁ hapa ni kazi iliyoandikwa ya uchunguzi au ufafanuzi. “Kitabu cha ufafanuzi” kinaeleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi upeo wa maana na istilahi ya Kiebrania.
- source_word: הַנָּבִיא עִדּוֹ
  choice: cha nabii Ido
  rationale: Kifungu hiki kinahusianisha maandishi hayo na nabii Ido. Mpangilio huu ni wa asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha muundo wa muhtasari wa kihistoria, lakini “mwenendo wake” na “kitabu cha ufafanuzi” zimetumiwa ili maana ieleweke kwa wasomaji wa kawaida.
