  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: sw
  text: Waisraeli[a] wakakimbia kutoka mbele ya Yuda, naye Mungu akawatia mikononi mwa Yuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “katika mkono wao”; huu ni usemi unaomaanisha kuwa chini ya uwezo au udhibiti wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: wakakimbia
  rationale: Kitenzi נוּס katika muktadha wa vita kinaonyesha kukimbia au kurudi nyuma mbele ya adui; “wakakimbia” ni cha kawaida na wazi katika Kiswahili.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa muundo wa moja kwa moja ni “wana wa Israeli,” hapa ni usemi wa Kiebrania unaomaanisha watu wa Israeli. “Waisraeli” ni wa asili na haubadili rejeleo la kundi.
- source_word: מִפְּנֵי יְהוּדָה
  choice: mbele ya Yuda
  rationale: מִפְּנֵי huonyesha kukimbia mbele ya nguvu inayowakabili. “Mbele ya Yuda” huhifadhi picha na maana ya kijeshi bila kuongeza “watu” ndani ya kishazi hiki.
- source_word: וַיִּתְּנֵם
  choice: akawatia
  rationale: נתן pamoja na shamirisho “wao” humaanisha kwamba Mungu aliwaweka au aliwakabidhi chini ya mamlaka ya upande mwingine. “Akawatia” hukamilishwa kwa kawaida na usemi “mikononi mwa.”
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Chanzo kinatumia אֱלֹהִים, si jina la agano יהוה; kwa hiyo limetafsiriwa “Mungu,” wala si “BWANA.”
- source_word: בְּיָדָם
  choice: mikononi mwa watu wa Yuda
  rationale: Kiebrania kina “katika mkono wao,” nahau ya kuwa chini ya uwezo au udhibiti wa mtu. Kutaja “watu wa Yuda” huweka wazi kiwakilishi cha kundi kinachorejelea Yuda na kuzuia dhana kwamba Waisraeli walitiwa mikononi mwao wenyewe.
theological_decisions:
- issue: Utendaji wa Mungu katika matokeo ya vita
  choice: Mungu akawatia Waisraeli mikononi mwa watu wa Yuda
  alternative: Mungu akaruhusu waanguke mikononi mwa watu wa Yuda
  rationale: Kitenzi נתן kikiwa na Mungu kama mtendaji kinahusisha moja kwa moja matokeo ya vita na tendo la Mungu. Tafsiri hailegezi dai hilo kuwa ruhusa tu.
- issue: Utambulisho wa makundi ya agano
  choice: Waisraeli ... Yuda
  alternative: wana wa Israeli ... Yuda
  rationale: בְנֵי יִשְׂרָאֵל hapa ni jina la pamoja la Waisraeli. Kiswahili “Waisraeli” hutoa maana hiyo kwa usahihi na kwa mtindo wa kawaida, huku tafsiri halisi ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” huunganisha matukio kwa mtiririko wa simulizi, na “mikononi mwa” ni nahau ya kawaida ya Kiswahili inayowasilisha kwa uwazi maana ya mamlaka au udhibiti.
