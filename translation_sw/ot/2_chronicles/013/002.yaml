source:
  edition: WLC
  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: sw
  text: Alitawala kwa miaka mitatu huko Yerusalemu. Jina la mama yake lilikuwa Mikaya[a] binti Urieli kutoka Gibea. Kulikuwa na vita kati ya Abiya na Yeroboamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika simulizi sambamba la 1 Wafalme 15:2, mama ya Abiya anaitwa Maaka. Neno la Kiebrania linalotafsiriwa “binti” linaweza pia kumaanisha mzao wa kike wa kizazi cha baadaye; kwa hiyo, huenda masimulizi hayo yanafuata namna tofauti za kutaja majina au nasaba.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi hiki humaanisha kutawala au kuwa mfalme; “alitawala” ni usemi wa kawaida na wa heshima katika taarifa za kifalme.
- source_word: וְשֵׁם אִמּוֹ
  choice: Jina la mama yake lilikuwa
  rationale: Huu ni muundo wa kawaida wa kutaja nasaba, uliotafsiriwa kwa Kiswahili cha sasa bila kupoteza maana ya Kiebrania.
- source_word: מִיכָיָהוּ
  choice: Mikaya
  rationale: Hili ni umbo la Kiswahili la jina la Kiebrania lililo katika maandishi ya Mambo ya Nyakati.
- source_word: בַת אוּרִיאֵל
  choice: binti Urieli
  rationale: Muundo huu unataja moja kwa moja uhusiano wa kifamilia; tafsiri haipanui wala kuoanisha taarifa hiyo na simulizi jingine.
- source_word: מִן גִּבְעָה
  choice: kutoka Gibea
  rationale: Kihusishi מִן kina maana ya “kutoka” na hapa kinaonyesha mahali alikotoka Urieli au familia inayotajwa.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Kulikuwa na vita
  rationale: Huu ni ulinganifu wa kawaida wa kishazi cha Kiebrania “vita vilikuwapo,” bila kuongeza wazo la kuanza au kuendelea kwa vita.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na ...
  rationale: Huu ndio usemi wa kawaida wa Kiswahili unaoonyesha pande mbili zinazopingana.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Mambo ya Nyakati hutumia umbo אֲבִיָּה; “Abiya” hulihifadhi bila kuingiza umbo tofauti linalopatikana katika Wafalme.
theological_decisions:
- issue: Tofauti ya jina la mama ya Abiya kati ya Mambo ya Nyakati na simulizi sambamba katika Wafalme
  choice: Maandishi makuu yanadumisha “Mikaya binti Urieli kutoka Gibea” kama yalivyo katika Kiebrania cha 2 Mambo ya Nyakati 13:2.
  alternative: Kuoanisha jina hilo na Maaka katika 1 Wafalme 15:2, au kutafsiri “binti” moja kwa moja kuwa mjukuu au mzao.
  rationale: Tafsiri inapaswa kuwasilisha ushahidi wa maandishi haya bila kuficha tofauti iliyopo. Ingawa בַת linaweza kutumiwa kwa maana pana ya mzao wa kike, hapa maandishi yenyewe yanasema “binti”; uwezekano mwingine unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku taarifa ya Kiebrania na tofauti yake na simulizi sambamba vikihifadhiwa bila kuoanisha kimyakimya.
