base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: sw
  text: Abiya akalala pamoja na mababu zake, nao wakamzika katika Mji wa Daudi. Asa mwanawe akatawala badala yake. Katika siku zake, nchi ilipata utulivu[a] kwa miaka kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, nchi ikatulia kwa miaka kumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: akalala pamoja na mababu zake
  rationale: Inahifadhi taswira ya nahau ya Kiebrania inayosema kwamba mfalme alikufa na kujiunga na waliomtangulia, huku ‘mababu’ ikiwa wazi na ya asili zaidi katika Kiswahili cha sasa kuliko ‘baba zake’ katika muktadha huu.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: nao wakamzika
  rationale: Inadumisha kitenzi cha kutenda katika wingi chenye mtenda asiyeainishwa, badala ya kukibadili kuwa kauli ya kutendwa.
- source_word: בְּעִיר דָּוִיד
  choice: katika Mji wa Daudi
  rationale: Ni jina la mahali linalotambulika na linaakisi moja kwa moja muundo wa Kiebrania.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Kitenzi hiki kinawasilisha kuwa mfalme na kutawala kwa ufupi bila kuongeza wazo la kuanza lisilotajwa wazi.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Kinadumisha maana ya urithi wa utawala na kuchukua nafasi ya mtangulizi.
- source_word: בְּיָמָיו
  choice: Katika siku zake
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania bila kuufafanua moja kwa moja kuwa ‘wakati wa utawala wake.’
- source_word: שָׁקְטָה
  choice: ilipata utulivu
  rationale: Inaeleza hali ya kutosumbuliwa au kupumzika kwa nchi bila kuibana maana kuwa amani ya kisiasa pekee.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Ni tafsiri ya moja kwa moja inayoweza kumaanisha eneo au milki iliyokuwa chini ya Asa.
- source_word: עֶשֶׂר שָׁנִים
  choice: kwa miaka kumi
  rationale: ‘Kwa’ huonyesha muda kwa Kiswahili cha kawaida na kwa uwazi.
theological_decisions:
- issue: Nahau ya kifo ‘akalala pamoja na mababu zake’
  choice: Taswira ya kulala imehifadhiwa bila kuibadili kuwa ‘alikufa.’
  alternative: Abiya akafa na kuzikwa pamoja na mababu zake.
  rationale: Kiebrania kinatumia nahau ya kifalme ya kulala pamoja na mababu. Tafsiri haipaswi kuondoa taswira hiyo wala kuitumia kuthibitisha fundisho mahususi kuhusu hali ya wafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa msomaji wa sasa. ‘Mababu’ huepuka utata wa kisasa unaoweza kutokea kwa ‘baba zake,’ huku kikiwasilisha waliomtangulia katika ukoo. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika na tofauti ya kimsamiati.
