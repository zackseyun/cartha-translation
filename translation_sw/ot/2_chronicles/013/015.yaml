  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: sw
  text: Ndipo watu wa Yuda wakapiga kelele za vita; ikawa, watu wa Yuda walipopiga kelele za vita, Mungu akampiga Yeroboamu na Israeli wote mbele ya Abiya na Yuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: wakapiga kelele / walipopiga kelele
  rationale: Kitenzi רוע katika muktadha wa vita kinaonyesha kupiga kelele ya vita; marudio ya Kiebrania yamehifadhiwa.
- source_word: נָגַף
  choice: akawashinda
  rationale: Katika muktadha huu kitenzi kina maana ya kumshinda au kumpiga adui vitani. 'Akawashinda' ni Kiswahili cha kawaida na hakilazimishi wazo kwamba wote waliuawa.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Inahifadhi usemi wa Kiebrania unaoonyesha kwamba Mungu aliwashinda Yeroboamu na Israeli mbele ya Abiya na Yuda.
- source_word: אִישׁ יְהוּדָה
  choice: watu wa Yuda
  rationale: Ingawa umbo la Kiebrania ni la umoja wa mkusanyiko, maana yake hapa ni jeshi au watu wa Yuda; Kiswahili hutumia wingi kwa kawaida.
theological_decisions:
- issue: Mhusika wa ushindi
  choice: Mungu akawashinda
  alternative: Abiya na Yuda wakawashinda
  rationale: Kiebrania kinamtaja Mungu wazi kuwa ndiye mtendaji wa נָגַף, huku Abiya na Yuda wakiwa wale ambao ushindi ulitokea mbele yao.
- issue: Nguvu ya kitenzi נָגַף
  choice: akawashinda
  alternative: akawapiga chini
  rationale: Chaguo hili huhifadhi tendo la Mungu la kuleta kushindwa vitani bila kudai kwamba Yeroboamu na kila Mwisraeli waliangamizwa au kuuawa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa simulizi na marudio ya kupiga kelele yamehifadhiwa kwa ukaribu na chanzo.
