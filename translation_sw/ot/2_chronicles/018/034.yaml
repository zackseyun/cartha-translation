  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תַּ֤עַל הַ/מִּלְחָמָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וּ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הָיָ֨ה מַעֲמִ֧יד בַּ/מֶּרְכָּבָ֛ה נֹ֥כַח אֲרָ֖ם עַד הָ/עָ֑רֶב וַ/יָּ֕מָת לְ/עֵ֖ת בּ֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: sw
  text: Vita vikawa vikali siku ile, naye mfalme wa Israeli akaendelea kusimama ndani ya gari la vita, akikabili Aramu, mpaka jioni; akafa wakati jua lilipotua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa machweo” au “jua lilipozama.”
    reason: Njia mbadala za kutafsiri usemi wa Kiebrania לְעֵת בּוֹא הַשָּׁמֶשׁ.
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: Vita vikawa vikali
  rationale: Kitenzi עלה maana yake ya msingi ni ‘kupanda,’ lakini vita vinapokuwa kiima hapa kinaonyesha kuwa mapigano yaliongezeka kwa ukali. Usemi huu ni wa kawaida na wa wazi katika Kiswahili.
- source_word: בַּיּוֹם הַהוּא
  choice: siku ile
  rationale: Huhifadhi rejeo la wakati kwa Kiswahili cha kawaida bila kuongeza maelezo.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa umilikaji wa Kiebrania.
- source_word: הָיָה מַעֲמִיד
  choice: akaendelea kusimama
  rationale: Muundo wa היה pamoja na participle unaonyesha hali iliyoendelea. Ingawa Hiphil ya עמד inaweza kumaanisha kusimamisha au kuweka katika hali ya kusimama, muktadha unaeleza kwamba mfalme aliendelea kuwa wima; tafsiri hii haibainishi bila lazima kama alijitegemeza au alishikiliwa na wengine.
- source_word: בַּמֶּרְכָּבָה
  choice: ndani ya gari la vita
  rationale: ‘Gari la vita’ hutambulisha kwa uwazi מרכבה kama chariot ya kivita, si gari la kawaida la kisasa.
- source_word: נֹכַח אֲרָם
  choice: akielekea Aramu
  rationale: נֹכַח huonyesha kuwa mbele ya au kuelekeana na upande fulani. Jina Aramu limehifadhiwa badala ya kubadilishwa kuwa jina la watu.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hutoa kikomo cha wakati kwa njia ya kawaida na sahihi katika Kiswahili.
- source_word: וַיָּמָת
  choice: Akafa
  rationale: Husogeza simulizi mbele kwa kauli fupi na ya moja kwa moja.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: wakati jua lilipotua
  rationale: Huhifadhi wazo la wakati ambapo jua liliingia au lilitua, huku ikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Namna mfalme alivyoendelea kuwa wima ndani ya gari
  choice: akaendelea kusimama
  alternative: akaendelea kushikiliwa akiwa amesimama / akaendelea kujisimamisha
  rationale: Kiebrania kinaweza kueleweka kuwa mfalme aliwekwa au alidumishwa akiwa amesimama, lakini hakisemi wazi nani aliyemtegemeza. Tafsiri iliyochaguliwa huhifadhi hali inayoendelea bila kuamua suala hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Gari la vita’ limetumiwa kwa uwazi wa kihistoria, na ‘Aramu’ limehifadhiwa kama jina la mahali au ufalme.
