translation:
  language: sw
  text: Mikaia akasema, “Tazama, utaona siku hiyo utakapoingia katika chumba cha ndani[a] ili kujificha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “chumba ndani ya chumba”; yaweza kumaanisha chumba cha ndani zaidi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Mikaia
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili, nalo linawakilisha jina la Kiebrania kwa namna inayotambulika.
- source_word: הִנְּךָ
  choice: Tazama
  rationale: Neno hili linavuta fikira za msikilizaji na kusisitiza uhakika wa unabii; “Tazama” lina hadhi inayofaa na linaeleweka katika Kiswahili cha Biblia.
- source_word: רֹאֶה
  choice: utaona
  rationale: Ingawa kwa umbo ni neno endelevu, likifuata הִנְּךָ katika muktadha huu lina maana ya kinabii kuhusu jambo atakalolishuhudia Sedekia.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida wa wakati unaohifadhi rejeo la siku ya kutimia kwa unabii.
- source_word: אֲשֶׁר תָּבוֹא
  choice: utakapoingia
  rationale: Kiunganishi pamoja na kitenzi kinaonyesha wakati au mazingira ambayo Sedekia ataona ukweli wa maneno ya Mikaia.
- source_word: חֶדֶר בְּחֶדֶר
  choice: katika chumba cha ndani
  rationale: Kirai cha Kiebrania kinaweza kueleza kuingia ndani zaidi, katika chumba kilicho ndani ya kingine. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: לְהֵחָבֵא
  choice: ili kujificha
  rationale: Kitenzi kina maana ya kujisitiri au kujificha; umbo la kujirejelea “kujificha” linaonyesha wazi kuwa mhusika mwenyewe ndiye anayejificha.
