lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Ikawa, ... walipoona
  rationale: Muundo huu unaendeleza simulizi na kuonyesha wakati wa tukio kwa Kiswahili cha asili.
- source_word: שָׂרֵי הָרֶכֶב
  choice: wakuu wa magari ya vita
  rationale: שָׂרֵי ni viongozi wa kijeshi, na הָרֶכֶב hapa ni magari ya vita au kikosi chake.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: kwamba yeye hakuwa mfalme wa Israeli
  rationale: Kiebrania hakitaji kiima wazi, lakini kiambishi cha kiume katika מֵאַחֲרָיו kinaonyesha mtu aliyekuwa akifuatwa.
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: wakaacha kumfuata
  rationale: Neno kwa neno ni 'wakarudi kutoka nyuma yake'; katika muktadha wa mapambano ni nahau ya kuacha kumfuata au kumwandama.
