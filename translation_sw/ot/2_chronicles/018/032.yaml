  text: Ikawa, wakuu wa magari ya vita walipoona kwamba yeye hakuwa mfalme wa Israeli[a], wakaacha kumfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “wakarudi kutoka nyuma yake,” nahau inayomaanisha kwamba waliacha kumfuata au kumwandama.
