base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: sw
  text: Mjumbe aliyekwenda kumwita Mikaya akamwambia, “Tazama, maneno ya manabii yanamtabiria mfalme mema kwa sauti moja[a]. Tafadhali, neno lako na liwe kama mojawapo ya maneno yao, nawe useme mema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “kwa kinywa kimoja,” nahau yenye maana ya kusema kwa makubaliano kamili au kwa sauti moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: Mjumbe
  rationale: Katika muktadha huu ni mtu aliyetumwa kumwita Mikaya, si malaika.
- source_word: לִקְרֹא
  choice: kumwita
  rationale: Kitenzi hapa kina maana ya kumwita mtu aje mbele ya mfalme; ‘kumwita’ ni wazi na cha kawaida katika Kiswahili.
- source_word: לְמִיכָיְהוּ
  choice: Mikaya
  rationale: Hili ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi nguvu ya neno la kuelekeza usikivu kwa lugha yenye heshima na inayoeleweka.
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: manabii wanasema
  rationale: Muundo huu wa asili wa Kiswahili unawasilisha ‘maneno ya manabii’ bila kufanya sentensi kuwa nzito.
- source_word: פֶּה אֶחָד
  choice: kwa sauti moja
  rationale: Ni nahau ya Kiswahili inayoeleweka inayohifadhi picha ya kauli ya pamoja na maana ya kukubaliana kabisa.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: mambo mema kwa mfalme
  rationale: Hueleza kwamba ujumbe wao unampendelea au unamtabiria mema mfalme, huku ukihifadhi neno la msingi ‘mema’.
- source_word: וִיהִי נָא
  choice: Tafadhali, ... na liwe
  rationale: ‘Tafadhali’ pamoja na muundo wa kutakia ‘na liwe’ huonyesha ombi lenye kusisitiza kwa adabu.
- source_word: דְבָרְךָ
  choice: neno lako
  rationale: Umoja wa Kiebrania umehifadhiwa, ukimaanisha ujumbe wa kinabii kama kitu kimoja.
- source_word: כְּאַחַד מֵהֶם
  choice: kama la mmoja wao
  rationale: Kiwakilishi ‘la’ kinaonyesha wazi kuwa ulinganisho ni kati ya neno la Mikaya na neno la mmoja wa manabii hao.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: nawe useme mema
  rationale: Huhifadhi urudiaji wa ‘mema’ katika chanzo na kutoa himizo kwa Kiswahili cha kawaida.
