base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: sw
  text: Basi akaja kwa mfalme, naye mfalme akamwambia, “Mikaya, je, twende kupigana huko Ramoth-gileadi, au nijizuie?” Akamjibu, “Pandeni mkafanikiwe, nao watatiwa mikononi mwenu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kuzingatia muktadha unaozunguka maneno haya, huenda jibu la Mikaya ni la kejeli au dhihaka; hata hivyo, Kiebrania chenyewe hakionyeshi hilo waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Basi akaja
  rationale: Kitenzi hiki kinaendeleza mfululizo wa matukio katika simulizi; “Basi akaja” ni Kiswahili cha kawaida kinachohifadhi mwendelezo huo.
- source_word: מִיכָה
  choice: Mikaya
  rationale: Hili ni umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili kwa nabii huyu, na linamtambulisha tofauti na nabii Mika.
- source_word: הֲנֵלֵךְ
  choice: je, twende
  rationale: Huhifadhi swali la kutafakari katika nafsi ya kwanza wingi bila kulifanya kuwa amri.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Hili ni umbo la jina la mahali linalotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: לַמִּלְחָמָה
  choice: kupigana
  rationale: Katika muktadha huu, kusudi la kwenda Ramoth-gileadi ni kufanya vita; “kupigana” ni wazi na ya kawaida kwa msomaji wa sasa.
- source_word: אִם אֶחְדָּל
  choice: au nijizuie
  rationale: Huhifadhi mabadiliko ya makusudi kutoka “twende” ya wingi kwenda nafsi ya kwanza umoja, pamoja na maana ya kuacha au kujizuia.
- source_word: עֲלוּ
  choice: Pandeni
  rationale: Huhifadhi maana ya msingi ya kuelekea juu na pia umbo la amri kwa watu wengi.
- source_word: וְהַצְלִיחוּ
  choice: mkafanikiwe
  rationale: Kitenzi kinaeleza kupata mafanikio katika safari ya kijeshi; umbo hili ni la asili katika Kiswahili na linaendelea moja kwa moja kutoka kwa amri “Pandeni.”
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: nao watatiwa mikononi mwenu
  rationale: Huhifadhi kauli tendwa, kiima cha wingi kisichotajwa wazi, na nahau ya Kiebrania ya kutiwa mikononi mwa mtu, yaani chini ya mamlaka yake.
theological_decisions:
- issue: Ikiwa jibu la Mikaya lielezwe wazi kuwa la kejeli
  choice: Maneno chanya yamehifadhiwa katika matini bila kuongeza neno linalotaja kejeli.
  alternative: Kuongeza “kwa kejeli” au kubadili usemi ili dhihaka ionekane wazi.
  rationale: Muktadha mpana unaonyesha kuwa jibu hili huenda ni la kejeli, lakini Kiebrania chenyewe hakina alama ya wazi ya kejeli. Tanbihi inaeleza uwezekano huo bila kuondoa mvutano wa simulizi katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na hadhi inayofaa maandiko. Mabadiliko ya “twende” kwenda “nijizuie,” wingi wa “Pandeni,” na kauli tendwa ya mwisho yamehifadhiwa.
