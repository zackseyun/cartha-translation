  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: sw
  text: Basi mfalme wa Israeli akawakusanya manabii mia nne, wote wanaume, akawauliza, “Je, twende Ramoth-gileadi vitani, au nijizuie?” Wakasema, “Panda[a], na Mungu atauweka mikononi mwa mfalme[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Nenda ukashambulie.” Kitenzi cha Kiebrania kimsingi ni “panda,” lakini katika muktadha wa kijeshi kinaweza kumaanisha kusonga kwenda kushambulia.'
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “katika mkono wa mfalme.” Hii ni nahau ya kuwa chini ya uwezo au mamlaka ya mfalme. Maandishi hayasemi “mikononi mwako,” hivyo hayambainishi mfalme zaidi.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: akawakusanya
  rationale: Kitenzi קבץ humaanisha kukusanya au kuwakutanisha watu; “akawakusanya” ni cha kawaida na kinaonyesha tendo la mfalme.
- source_word: הַנְּבִאִים
  choice: manabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa נביאים, bila kuongeza tathmini kuhusu uhalali wa unabii wao.
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: wanaume mia nne
  rationale: Kiebrania kinataja wazi אִישׁ, “mwanamume,” baada ya hesabu; tafsiri inadumisha maelezo hayo.
- source_word: הֲנֵלֵךְ
  choice: Je, twende
  rationale: Umbo ni swali la nafsi ya kwanza wingi; “twende” linadumisha ushirikishwaji wa wengine katika swali.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Jina la mahali limetoholewa kwa namna inayoeleweka katika Kiswahili na inayohifadhi sehemu zake mbili.
- source_word: לַמִּלְחָמָה
  choice: kupigana na
  rationale: Katika muktadha huu wa kijeshi, muundo huu unaeleza kwa Kiswahili cha kawaida kusudi la kwenda dhidi ya mji, bila kulifanya neno kuwa “vita” kwa upana usio lazima.
- source_word: אִם אֶחְדָּל
  choice: au nijizuie
  rationale: Kitenzi ni nafsi ya kwanza umoja, tofauti na “twende”; tafsiri inadumisha badiliko hilo badala ya kulisawazisha.
- source_word: עֲלֵה
  choice: Panda
  rationale: עלה kimsingi ni “panda/nenda juu”; katika muktadha wa kijeshi linaweza kumaanisha kusonga kwenda kushambulia. “Panda” linahifadhi picha ya neno la chanzo.
- source_word: וְיִתֵּן
  choice: naye Mungu ataitia
  rationale: Kiebrania hakitaji yambwa wazi. Kiswahili kinahitaji rejeo linaloeleweka, hivyo Ramoth-gileadi limetajwa tena kama kile kitakachowekwa chini ya mamlaka ya mfalme.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa אֱלֹהִים lina umbo la wingi, kitenzi יִתֵּן ni cha umoja na muktadha unarejelea Mungu mmoja.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: mikononi mwa mfalme
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kuwekwa chini ya uwezo au mamlaka ya mtu. “Mikononi mwa” ni nahau ya kawaida ya Kiswahili, huku “mfalme” likibaki bila kubainishwa zaidi.
theological_decisions:
- issue: Mfalme anayerejelewa katika jibu la manabii
  choice: Kudumisha usemi “mfalme” bila kusema wazi ni mfalme gani
  alternative: Kutafsiri “mikononi mwako” au “mikononi mwa mfalme wa Israeli”
  rationale: Kiebrania kinasema הַמֶּלֶךְ, “mfalme,” wala si “wewe” au “mfalme wa Israeli.” Kutobainisha zaidi kunahifadhi sintofahamu ya maandishi na tofauti yake na 1 Wafalme 22:6.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Badiliko kutoka “twende” hadi “nijizuie” limehifadhiwa. “Mikononi mwa mfalme” ni usemi wa asili wa Kiswahili unaohifadhi nahau na kutobainishwa kwa mhusika katika Kiebrania.
