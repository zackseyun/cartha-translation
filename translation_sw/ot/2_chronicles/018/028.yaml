  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: sw
  text: Basi mfalme wa Israeli na Yehoshafati, mfalme wa Yuda, wakapanda kwenda Ramoth-Gileadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: wakapanda kwenda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu. Katika simulizi la safari kuelekea mahali, “wakapanda kwenda” huhifadhi wazo la mwendo wa kupanda bila kuongeza maana ya kijeshi isiyosemwa wazi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Hili ni jina la cheo cha kifalme katika hali ya muundo; tafsiri hii ni ya kawaida, wazi, na humrejelea mfalme anayejulikana katika muktadha.
- source_word: וִיהוֹשָׁפָט
  choice: na Yehoshafati
  rationale: Kiunganishi ו ni cha kujumlisha, nacho kimetafsiriwa “na”; jina limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo hiki kinamfafanua Yehoshafati. Kuwekwa kati ya koma kunahifadhi uhusiano wa ufafanuzi huku sentensi ikibaki ya kawaida katika Kiswahili.
- source_word: אֶל
  choice: kwenda
  rationale: Kihusishi kinaonyesha mwendo kuelekea mahali pa kufikiwa; katika muundo huu, “kwenda” huwasilisha kwa kawaida mwelekeo wa safari pamoja na kitenzi “wakapanda.”
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-Gileadi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa. Kistari huonyesha kwamba ni jina ambatani, huku “Gileadi” likifuata matumizi yanayotambulika katika Kiswahili.
