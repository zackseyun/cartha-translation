translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” linaendeleza mtiririko wa simulizi wa וַ bila kufanya uhusiano wa kimantiki kuwa mzito. Umoja wa kiima chenye wahusika wawili umeonyeshwa kwa “wakapanda.”
