  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: sw
  text: Yehoshafati akamwambia mfalme wa Israeli, “Tafadhali, tafuta leo neno la Yahwe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno kutoka kwa Yahwe.”
    reason: Hutoa uwezekano wa kisemantiki wa usemi wa Kiebrania katika muktadha wa kutafuta mwongozo wa kinabii, huku maandishi makuu yakihifadhi fomula “neno la Yahwe.”
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Ka- ya masimulizi inaendeleza mtiririko wa matukio, na kiambishi -mw- kinaonyesha kwa kawaida kwamba maneno yanaelekezwa kwa mfalme.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Hili ni tamko la kawaida na la moja kwa moja la cheo hicho katika Kiswahili.
- source_word: דְּרָשׁ
  choice: ulizie
  rationale: Katika muktadha wa kutafuta mwongozo wa kinabii, kitenzi hiki humaanisha kuuliza au kutafuta ujumbe kutoka kwa Mungu; “ulizie” kinawasilisha maana hiyo kwa lugha ya kawaida.
- source_word: נָא
  choice: Tafadhali
  rationale: Chembe hii hulainisha amri na kuifanya ombi; “Tafadhali” ni sawia ya asili katika Kiswahili cha sasa.
- source_word: כַיּוֹם
  choice: leo
  rationale: Kirai hiki kinatumika hapa kama kielezi cha wakati na kusisitiza kuuliza siku hiyo bila kuchelewa.
- source_word: אֶת דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: “Neno” linahifadhi istilahi ya kawaida ya ujumbe au tamko la Mungu, huku “la Yahwe” likifuata kwa karibu muundo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo linalofaa mfumo wa sauti na tahajia ya Kiswahili.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano moja kwa moja. Kulitaja kama “Yahwe” kunahifadhi tofauti kati ya jina binafsi na cheo bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Ikiwa דְּבַר יְהוָה ni tamko maalumu au ujumbe usiotajwa
  choice: neno la Yahwe
  alternative: ujumbe kutoka kwa Yahwe
  rationale: Muundo wa Kiebrania unaweza kueleweka kama fomula ya kinabii “neno la Yahwe,” lakini katika muktadha unaweza pia kumaanisha ujumbe ambao bado utaulizwa. Maandishi makuu yanahifadhi muundo huo, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni wa asili, na lugha ya kutafuta mwongozo wa kinabii imehifadhiwa bila kuwa nzito kupita kiasi.
