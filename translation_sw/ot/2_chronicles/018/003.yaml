base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: sw
  text: Ahabu, mfalme wa Israeli, akamwambia Yehoshafati, mfalme wa Yuda, “Je, utaenda pamoja nami mpaka Ramoth-gileadi?” Akamjibu, “Mimi ni kama wewe, na watu wangu ni kama watu wako[a], nami niko pamoja nawe vitani[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa Kiswahili cha kimtindo zaidi, “watu wako ni watu wangu.” Maneno ya Kiebrania yana muundo wa kulinganisha, kihalisi, “na kama watu wako, watu wangu.”
    reason: lexical_alternative
  - marker: b
    text: Kishazi cha mwisho ni cha mkato katika Kiebrania; kihalisi, “na pamoja nawe vitani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: Je, utaenda pamoja nami
  rationale: Kitenzi הלך pamoja na kiambishi cha swali הֲ na עִם kinauliza kama Yehoshafati ataandamana na Ahabu. ‘Utaenda pamoja nami’ ni Kiswahili cha kawaida na kinadumisha maana ya moja kwa moja ya mwendo.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa; umbo hili linafuata matumizi yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Mimi ni kama wewe
  rationale: Kauli hii inaonyesha mshikamano au usawa. Tafsiri hii inadumisha muundo wa kulinganisha wa Kiebrania bila kuufanya usemi kuwa mgumu.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: na watu wangu ni kama watu wako
  rationale: Kiebrania hakina kitenzi katika kishazi hiki. Kuongeza ‘ni’ kunafanya sentensi iwe wazi katika Kiswahili huku mpangilio na ulinganisho wa chanzo vikihifadhiwa.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: nami niko pamoja nawe vitani
  rationale: Kishazi cha Kiebrania ni cha mkato na hakina kitenzi kilichoandikwa. ‘Niko’ huwekwa ili kukamilisha Kiswahili, bila kuingiza wazi wakati ujao ambao haujaonyeshwa moja kwa moja katika chanzo.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: akamwambia ... Akamjibu
  rationale: Ingawa אמר limetumiwa mara zote mbili, muktadha unaonyesha swali na jibu. ‘Akamjibu’ ni Kiswahili cha asili kinachoweka wazi mtiririko wa mazungumzo bila kubadili yaliyosemwa.
