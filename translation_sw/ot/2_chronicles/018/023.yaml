base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: sw
  text: Ndipo Sedekia mwana wa Kenaana akakaribia, akampiga Mikaya shavuni, akasema, “Roho wa Yahwe alipitia njia gani kutoka kwangu ili aseme nawe?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: akakaribia
  rationale: Kitenzi נגשׁ kinaonyesha kumkaribia mtu; “akakaribia” ni cha kawaida na kinadumisha mwendo wa Sedekia katika mzozo huu.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Sedekia mwana wa Kenaana
  rationale: Majina yameandikwa kwa mfumo unaoeleweka katika Kiswahili, na uhusiano wa kifamilia umeonyeshwa moja kwa moja.
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: akampiga Mikaya shavuni
  rationale: נכה ni kitenzi kipana cha kupiga, na לֶחִי humaanisha shavu au sehemu ya taya; “shavuni” ni ya asili katika Kiswahili na inaendana na tendo la kumdhalilisha.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Ni njia gani
  rationale: Kauli hii ni swali la kejeli kuhusu njia ambayo Roho alipitia. Tafsiri hii inadumisha taswira ya njia bila kuwa nzito katika Kiswahili.
- source_word: עָבַר
  choice: aliyopitia
  rationale: עבר huonyesha kupita au kuvuka. “Aliyopitia” inadumisha taswira ya mwendo kutoka kwa msemaji mmoja hadi kwa mwingine.
- source_word: רוּחַ יְהוָה
  choice: Roho wa Yahwe
  rationale: Katika muktadha wa unabii, רוּחַ humrejelea Roho wa Mungu, si upepo wala hali ya moyo. “Yahwe” linadumisha jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: מֵאִתִּי
  choice: kutoka kwangu
  rationale: Kirai hiki huonyesha chanzo; kinadumisha madai ya kejeli ya Sedekia kwamba Roho alikuwa akinena kupitia kwake.
- source_word: לְדַבֵּר אֹתָךְ
  choice: ili kusema nawe
  rationale: Ingawa muundo wa Kiebrania si wa kawaida, maana katika muktadha ni kusema na au kwa Mikaya. “Kusema nawe” ni ya asili na haiongezi maana isiyokuwapo.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. “Yahwe” linawakilisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa רוּחַ katika muktadha wa kinabii
  choice: Roho
  alternative: roho; upepo
  rationale: Muktadha unahusu yule anayesema kupitia manabii, hivyo rejeleo ni Roho wa Mungu. Herufi kubwa husaidia kuonyesha rejeleo hilo bila kuondoa kejeli ya Sedekia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wazi na wa kisasa. Muundo wa swali umesawazishwa ili uwe wa kawaida katika Kiswahili, lakini taswira ya “njia” na “kupita kutoka kwangu” imehifadhiwa kwa sababu ndiyo kiini cha kejeli ya Sedekia.
