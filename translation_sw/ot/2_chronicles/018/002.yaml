base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: sw
  text: Baada ya miaka kadhaa, akashuka kwa Ahabu huko Samaria. Ahabu akamchinjia kondoo na ng’ombe wengi sana kwa ajili yake na kwa ajili ya watu waliokuwa pamoja naye. Kisha akamshawishi[a] apande kwenda kuishambulia Ramoth-gileadi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamchochea.”
    reason: Neno la Kiebrania linaweza kumaanisha kushawishi kwa nguvu, kuchochea, au kumvuta mtu afanye jambo.
  - marker: b
    text: 'Tafsiri halisi: “kwenda Ramoth-gileadi”; katika muktadha huu, ni kwenda kuushambulia mji huo.'
    reason: Tanbihi inadumisha muundo wa moja kwa moja wa Kiebrania huku matini kuu ikieleza maana ya kijeshi katika muktadha.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Inahifadhi maana ya kuelekea chini ya ירד na mwelekeo wa kijiografia kutoka Yuda kwenda Samaria.
- source_word: לְקֵץ שָׁנִים
  choice: Baada ya miaka kadhaa
  rationale: Ni Kiswahili cha kawaida kinachoeleza kupita kwa kipindi kisichotajwa idadi kamili, bila kushikilia kwa ugumu nahau ya Kiebrania ‘mwishoni mwa miaka’.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: kwa Ahabu huko Samaria
  rationale: Inaonyesha wazi kwamba alimwendea Ahabu, ambaye alikuwa Samaria.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: Ahabu akamchinjia
  rationale: זבח hapa yaelekea kueleza kuchinja wanyama kwa karamu ya ukarimu wa kifalme, si lazima dhabihu ya ibada. Kiambishi ‘-ia’ kinawakilisha לוֹ, ‘kwa ajili yake’.
- source_word: צֹאן וּבָקָר
  choice: kondoo na ng’ombe
  rationale: Ni majina ya kawaida na yanayoeleweka ya makundi haya ya mifugo.
- source_word: לָרֹב
  choice: wengi sana
  rationale: Inaonyesha kwa kawaida wingi mkubwa wa wanyama waliochinjwa.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: yeye pamoja na watu waliokuwa pamoja naye
  rationale: Inahifadhi maana pana ya עָם bila kuifanya kwa lazima iwe ‘wanajeshi’ au ‘msafara’.
- source_word: וַיְסִיתֵהוּ
  choice: akamshawishi
  rationale: ‘Kumshawishi’ hubeba wazo la kumvuta mtu akubali jambo; tanbihi inadumisha uwezekano mkali zaidi wa ‘kumchochea’ uliomo katika סות.
- source_word: לַעֲלוֹת
  choice: apande kwenda
  rationale: Inahifadhi picha ya Kiebrania ya ‘kupanda,’ huku Kiswahili kikiifanya safari hiyo isikike kwa kawaida.
- source_word: אֶל רָמוֹת גִּלְעָד
  choice: kwenda kuishambulia Ramoth-gileadi
  rationale: אֶל ni ‘kwenda/kuelekea,’ lakini muktadha wa kijeshi unaonyesha kwamba lengo lilikuwa kuushambulia mji; tanbihi inahifadhi muundo halisi zaidi.
