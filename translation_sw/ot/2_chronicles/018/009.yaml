source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: sw
  text: Mfalme wa Israeli na Yehoshafati, mfalme wa Yuda, walikuwa wameketi, kila mmoja juu ya kiti chake cha enzi, wakiwa wamevaa mavazi[a], na walikuwa wameketi katika uwanja wa kupuria, kwenye mlango wa kuingilia wa lango la Samaria; manabii wote walikuwa wakitoa unabii mbele yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwa wamevaa majoho.” Kiebrania kinasema kwa namna ya kawaida, “wakiwa wamevaa mavazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Mfalme wa Israeli
  rationale: Kiunganishi ו־ cha mwanzo kinaendeleza simulizi; hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili, kwa kuwa mtiririko wa muktadha hubeba dhima hiyo bila kuongeza neno la wakati kama “basi” au “sasa”.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: na Yehoshafati, mfalme wa Yuda
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na cheo cha kifalme kimehifadhiwa kama kirai cha ufafanuzi.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: walikuwa wameketi ... Walikuwa wameketi
  rationale: Kurudiwa kwa kitenzi katika Kiebrania kumehifadhiwa ili kuonyesha kwanza kuketi kwao kwenye viti vya enzi na kisha mahali tukio lilipofanyika.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: kila mmoja juu ya kiti chake cha enzi
  rationale: אִישׁ ina maana ya mgawanyo, “kila mmoja,” na כִּסֵּא katika muktadha wa wafalme ni kiti cha enzi, si kiti cha kawaida.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: wakiwa wamevaa mavazi
  rationale: Tafsiri hii inahifadhi maana ya kawaida ya maneno ya Kiebrania bila kuongeza kwamba mavazi hayo yalikuwa ya kifalme, jambo ambalo halijasemwa wazi.
- source_word: בְּגֹרֶן
  choice: katika uwanja wa kupuria
  rationale: גֹּרֶן ni eneo tambarare ambako nafaka ilipuriwa; “uwanja wa kupuria” ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: kwenye mwingilio wa lango la Samaria
  rationale: 'Kirai hiki kinahifadhi vipengele vyote vya mnyororo wa Kiebrania: mwingilio, lango, na Samaria.'
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: wakitoa unabii mbele yao
  rationale: “Kutoa unabii” huonyesha shughuli ya kinabii kwa upana zaidi kuliko “kutabiri,” ambalo katika matumizi ya sasa mara nyingi hueleweka hasa kama kusema yatakayotokea baadaye. “Mbele yao” huhifadhi maana ya uwepo wa wafalme.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “walikuwa wameketi” yamehifadhiwa kwa sababu yapo katika chanzo, ingawa sentensi imegawanywa ili ibaki ya asili katika Kiswahili.
