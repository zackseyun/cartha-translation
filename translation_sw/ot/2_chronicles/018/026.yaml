translation:
  language: sw
  text: 'mkawaambie, “Mfalme asema hivi: ‘Mtieni mtu huyu gerezani, na mlisheni mkate wa shida na maji ya shida[a] mpaka nitakaporudi salama.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate wa dhiki na maji ya dhiki,” yaani, chakula na maji ya mgao mdogo yanayohusishwa na kifungo na taabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: na kusema
  rationale: Kitenzi hiki cha nafsi ya pili wingi kinaendeleza amri iliyotangulia; ‘na kusema’ ni muundo wa kawaida na wa wazi wa Kiswahili katika mfululizo huu wa maagizo.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Mfalme asema hivi
  rationale: Huu ni mtindo rasmi wa kuwasilisha ujumbe wa kifalme; wakati wa sasa unafaa kwa agizo linalotangazwa kwa niaba ya mfalme.
- source_word: שִׂימוּ זֶה
  choice: Mtieni mtu huyu
  rationale: Kiwakilishi cha kuonyesha kinamrejelea Mikaya moja kwa moja na kwa namna yenye dharau kidogo; ‘mtu huyu’ huweka rejeo wazi bila kuongeza dharau isiyokuwamo.
- source_word: בֵּית הַכֶּלֶא
  choice: gerezani
  rationale: Ingawa kwa neno moja moja ni ‘nyumba ya kifungo,’ ‘gerezani’ ni tafsiri ya asili na iliyo wazi katika Kiswahili cha sasa.
- source_word: וְהַאֲכִלֻהוּ
  choice: na mpeni
  rationale: Muundo wa kisababishi una maana ya kumpa chakula au kumlisha; pamoja na vitu viwili vinavyofuata, ‘mpeni’ ni wa kawaida zaidi kwa Kiswahili.
- source_word: לֶחֶם לַחַץ
  choice: mkate wa shida
  rationale: Neno לַחַץ linaweza kuashiria shida, dhiki, au unyimwaji. ‘Mkate wa shida’ huhifadhi tamathali ya Kiebrania na wazo la mgao wa gerezani.
- source_word: וּמַיִם לַחַץ
  choice: maji ya shida
  rationale: Tafsiri sambamba na ‘mkate wa shida’ huhifadhi urari wa kishairi wa Kiebrania na wazo la mgao mdogo unaohusishwa na kifungo.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: mpaka nitakaporudi salama
  rationale: בְשָׁלוֹם hapa humaanisha kurudi kutoka vitani bila madhara. ‘Salama’ ni ya asili kwa Kiswahili na huhifadhi kejeli inayojitokeza katika muktadha.
