  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri na usemi rasmi wa mfalme umehifadhiwa; tamathali ya ‘mkate wa shida na maji ya shida’ imeachwa katika matini, huku tanbihi ikifafanua maana yake inayowezekana.
