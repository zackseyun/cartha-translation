  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: sw
  text: Ndipo roho akajitokeza, akasimama mbele ya Yahwe, akasema, “Mimi nitamshawishi[a].” Yahwe akamwambia, “Kwa njia gani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitamdanganya” au “nitamvuta.” Kitenzi cha Kiebrania kinaweza kumaanisha kushawishi, kuvuta, au kudanganya, kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: huyo roho
  rationale: Katika kikao hiki cha mbinguni, matendo ya kujitokeza, kusimama na kusema yanaonyesha kuwa רוּחַ humaanisha kiumbe wa kiroho, si upepo wala pumzi.
- source_word: וַיֵּצֵא
  choice: akajitokeza
  rationale: Ingawa יצא kimsingi ni ‘kutoka,’ hapa inaeleza roho anayesonga mbele ili ajitambulishe katika kikao; ‘akajitokeza’ ni ya kawaida na huhifadhi picha hiyo.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: akasimama mbele za
  rationale: Tafsiri hii huhifadhi moja kwa moja hali rasmi ya kusimama mbele ya mwenye mamlaka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa umbo la kawaida la Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֲפַתֶּנּוּ
  choice: nitamshawishi
  rationale: Kitenzi פתה kinaweza kuonyesha kushawishi, kuvuta au kudanganya. ‘Nitamshawishi’ huhifadhi upana wa maana na mvutano wa kifungu bila kutaja mapema mbinu inayofafanuliwa katika mstari unaofuata.
- source_word: בַּמָּה
  choice: Kwa njia gani?
  rationale: Swali linauliza njia au mbinu ambayo roho atatumia; usemi huu ni wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kuliwakilisha kwa cheo.
- issue: Uzito wa kimaadili wa פתה katika kikao cha mbinguni
  choice: nitamshawishi
  alternative: nitamdanganya au nitamvuta
  rationale: Mstari huu bado haujaeleza mbinu yenyewe. Tafsiri iliyochaguliwa huhifadhi utata wa kitenzi na mvutano wa kitheolojia, huku tanbihi ikionyesha uwezekano wa maana ya udanganyifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akajitokeza’ huwasilisha kwa kawaida mwendo wa roho kwenda mbele katika kikao, na ‘mbele za Yahwe’ huhifadhi hali rasmi ya tukio.
