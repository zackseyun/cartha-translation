  source_fidelity: 'Tafsiri inahifadhi vipengele vya msingi vya Kiebrania: jibu la kupinga (''Lakini''), jina Mikaya, fomula ya kiapo חַי יְהוָה, umilikaji katika ''Mungu wangu,'' na urejeleaji wenye msisitizo wa kile Mungu atakachosema. ‘Kama Yahwe aishivyo’ hutafsiri kwa uaminifu nguvu ya kiapo, na ‘hicho ndicho nitakachosema’ huwasilisha kiwakilishi rejeshi אֹתוֹ pamoja na ahadi ya nabii.'
  naturalness: Kiswahili ni sanifu, cha kawaida, na kina uzito unaofaa kwa kauli ya kiapo na unabii. Muundo ‘kile ambacho …, hicho ndicho …’ ni wa asili na unaeleweka wazi, ingawa una msisitizo wa kimakusudi unaolingana na matini.
