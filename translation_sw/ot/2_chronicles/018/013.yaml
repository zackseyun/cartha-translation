source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: sw
  text: Lakini Mikaya akasema, “Kama Yahwe aishivyo[a], kile ambacho Mungu wangu atasema, hicho ndicho nitakachosema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe yu hai; kile ambacho Mungu wangu atasema, hicho ndicho nitakachosema.”
    reason: Mbadala huu unafuata kwa ukaribu zaidi umbo la maneno ya Kiebrania, ingawa katika muktadha kauli hiyo hutumika kama kiapo.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akasema
  rationale: Kiunganishi cha simulizi hapa kinaendeleza habari huku jibu la Mikaya likipingana na shinikizo la mjumbe katika mstari uliotangulia; ‘Lakini’ huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: חַי יְהוָה
  choice: Kama Yahwe aishivyo
  rationale: Hii ni kauli ya kiapo ya Kiebrania. Tafsiri hii ni ya asili na yenye uzito katika Kiswahili, huku ikihifadhi nguvu ya kiapo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֵת אֲשֶׁר
  choice: kile ambacho
  rationale: Kirai hiki kinataja jambo ambalo Mungu atasema. ‘Kile ambacho’ ni wazi na pia kinaweza kurejelewa tena na kiwakilishi kinachofuata.
- source_word: יֹאמַר
  choice: atasema
  rationale: Kitenzi kisichotimilika kinaelekea kwa ujumbe ambao Mungu atatoa katika hali hii; wakati ujao unafaa kwa muktadha.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kimehifadhiwa wazi.
- source_word: אֹתוֹ
  choice: hicho ndicho
  rationale: Kiwakilishi kinachorejelea yaliyosemwa na Mungu kimehifadhiwa kwa msisitizo wa asili wa Kiswahili.
- source_word: אֲדַבֵּר
  choice: nitakachosema
  rationale: Hutoa ahadi thabiti ya Mikaya kwamba atasema ujumbe huo, kwa lugha ya kawaida na yenye heshima.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה katika kauli ya kiapo
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano lenyewe. ‘Yahwe’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Nguvu ya kauli חַי יְהוָה
  choice: 'Kauli ya kiapo: “Kama Yahwe aishivyo”'
  alternative: 'Kauli ya taarifa: “Yahwe yu hai”'
  rationale: Katika muktadha huu ni fomula ya kawaida ya kiapo cha Kiebrania. Tafsiri kuu inaonyesha nguvu hiyo, huku dokezo likihifadhi uwezekano wa kutafsiri maneno kwa muundo wa moja kwa moja zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa “hicho ndicho” umehifadhi msisitizo wa jibu la kinabii bila kuwa wa kimadhehebu.
