  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: sw
  text: Ndipo mfalme akamwambia, “Ni mara ngapi nikuapishe usiniambie lolote ila kweli kwa jina la Yahwe?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw ya mfululizo inaendeleza simulizi; “Ndipo” pamoja na kitenzi cha -ka- huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino hii ina kibainishi katika Kiebrania; muktadha wa Kiswahili humtambulisha kwa kawaida bila kulazimisha kutaja jina lake.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Ni mara ngapi
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha swali lenye hisia ya kuchoshwa na kurudiwa kwa jambo.
- source_word: מַשְׁבִּיעֶךָ
  choice: nikuapishe
  rationale: Hifili ya שבע humaanisha kumsababisha mtu aape au kumweka chini ya kiapo; “kuapisha” ni kitenzi sahihi na cha kawaida katika Kiswahili.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: usiniambie lolote ila kweli
  rationale: 'Baada ya tendo la kuapisha, muundo hasi pamoja na רַק unaweka mpaka: asiseme jambo jingine isipokuwa kweli. Kiswahili hiki huhifadhi ukanushi na upekee bila kuwa kigumu.'
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahwe
  rationale: Kirai hiki huonyesha mamlaka au msingi mtakatifu wa kiapo na usemi; “kwa jina la” ni Kiswahili cha asili katika muktadha huu, na Yahwe huhifadhi jina binafsi la Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo, huku “Yehova” likiwa umbo la baadaye.
- issue: Nguvu ya kiapo katika מַשְׁבִּיעֶךָ
  choice: nikuapishe
  alternative: nikusihi kwa kiapo
  rationale: Kitenzi cha Kiebrania katika hifili humweka Mikaya chini ya kiapo; tafsiri hii haiupunguzi usemi kuwa ombi la kawaida wala haiongezi maelezo ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “usiniambie lolote ila kweli” huhifadhi mvutano wa ukanushi na upekee uliomo katika Kiebrania.
