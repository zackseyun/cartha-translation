  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu maana ya Kiebrania: Yehoshafati ana utajiri na heshima kwa wingi, kisha anaingia katika uhusiano wa muungano kwa njia ya ndoa na Ahabu. Haidai kwamba Yehoshafati mwenyewe alimwoa mtu, wala haibainishi mpangilio wa familia ambao chanzo hakisemi.'
