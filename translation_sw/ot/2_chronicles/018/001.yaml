  text: וַ/יְהִ֧י לִֽ/יהוֹשָׁפָ֛ט עֹ֥שֶׁר וְ/כָב֖וֹד לָ/רֹ֑ב וַ/יִּתְחַתֵּ֖ן לְ/אַחְאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: sw
  text: Yehoshafati alikuwa na utajiri na heshima nyingi, naye akafanya muungano wa kindoa na Ahabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa jamaa ya Ahabu kwa njia ya ndoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיהוֹשָׁפָט
  choice: Yehoshafati alikuwa na
  rationale: Muundo wa Kiebrania unaonyesha kwamba Yehoshafati alikuwa na vitu vilivyotajwa; Kiswahili cha kawaida hutumia ‘alikuwa na’ bila kuongeza kiashiria cha wakati kisichokuwapo wazi katika chanzo.
- source_word: עֹשֶׁר וְכָבוֹד לָרֹב
  choice: utajiri na heshima nyingi
  rationale: עֹשֶׁר ni utajiri wa mali, כָבוֹד hapa ni heshima au hadhi ya kijamii, na לָרֹב huonyesha wingi mkubwa wa yote mawili.
- source_word: וַיִּתְחַתֵּן
  choice: akafanya muungano wa kindoa
  rationale: Kitenzi hiki katika hitpaeli kinaeleza kuingia katika uhusiano au muungano kupitia ndoa, wala hakisemi lazima kwamba Yehoshafati mwenyewe alimwoa mtu.
- source_word: לְאַחְאָב
  choice: na Ahabu
  rationale: Baada ya ‘muungano,’ kihusishi ‘na’ kinaonyesha kwa kawaida upande mwingine wa uhusiano huo katika Kiswahili.
theological_decisions:
- issue: Asili ya uhusiano wa Yehoshafati na Ahabu katika וַיִּתְחַתֵּן לְאַחְאָב
  choice: akafanya muungano wa kindoa na Ahabu
  alternative: akawa jamaa ya Ahabu kwa njia ya ndoa
  rationale: Tafsiri inaonyesha uhusiano wa kifalme ulioundwa kupitia ndoa bila kudai kwamba Yehoshafati mwenyewe ndiye aliyefunga ndoa hiyo, na bila kubainisha zaidi ya chanzo mpangilio halisi wa kifamilia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Tanbihi imewekwa baada ya kishazi kinachohusika, na alama yake [a] imo pia katika matini kuu.
