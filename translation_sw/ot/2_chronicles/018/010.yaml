base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: sw
  text: 'Kisha Sedekia mwana wa Kenaana akajitengenezea pembe za chuma, akasema, “Yahweh asema hivi: Kwa hizi utawapiga[a] Waaramu[b] kwa pembe mpaka waangamie.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawasukuma”; kitenzi cha Kiebrania humaanisha tendo la mnyama mwenye pembe la kupiga, kusukuma, au kuchoma kwa pembe.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Aramu”; jina hili linaweza kutaja nchi au watu wake. Hapa linaweza pia kutafsiriwa “Aramu” au, kwa jina la baadaye, “Siria.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: akajitengenezea
  rationale: Muundo wa Kiswahili wenye kiambishi cha kujirejelea na kitendea unaonyesha kwa njia ya kawaida kwamba Sedekia alizitengeneza kwa ajili yake mwenyewe.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Sedekia mwana wa Kenaana
  rationale: Majina yamenukuliwa kwa maumbo yanayoeleweka katika Kiswahili, huku uhusiano wa nasaba wa Kiebrania ukihifadhiwa kwa ‘mwana wa’.
- source_word: קַרְנֵי בַרְזֶל
  choice: pembe za chuma
  rationale: Huhifadhi moja kwa moja picha ya pembe zilizotengenezwa kwa chuma bila kuipanua kiufafanuzi.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Ni usemi wa kawaida na wenye hadhi katika Kiswahili unaohifadhi fomula ya ujumbe wa kinabii na jina la Mungu.
- source_word: בְּאֵלֶּה
  choice: Kwa hizi
  rationale: Kihusishi kinaonyesha chombo kinachotumiwa, na kiwakilishi cha wingi kinarejelea pembe.
- source_word: תְּנַגַּח
  choice: utawapiga kwa pembe
  rationale: Kitenzi kinamaanisha tendo la mnyama mwenye pembe la kupiga au kuchoma kwa pembe; tafsiri hii huhifadhi picha hiyo wazi katika Kiswahili.
- source_word: אֶת אֲרָם
  choice: Waaramu
  rationale: Ingawa jina la umoja ‘Aramu’ linaweza kutaja nchi au taifa kwa ujumla, kiambishi cha wingi katika כַּלּוֹתָם kinaelekeza kwa watu; ‘Waaramu’ ni ya asili katika muktadha huu.
- source_word: עַד כַּלּוֹתָם
  choice: mpaka uwaangamize kabisa
  rationale: Kitenzi כלה katika muktadha huu kinaonyesha kuwafikisha Waaramu mwisho au kuwaangamiza; muundo huu wa Kiswahili ni wazi na huhifadhi maana ya uharibifu kamili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano YHWH; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Kauli hiyo ni unabii wa kweli au madai ya Sedekia
  choice: 'Imeachwa kama dai la moja kwa moja la Sedekia: ‘Yahweh asema hivi’'
  alternative: Kuongeza maelezo kwamba huo ulikuwa unabii wa uongo
  rationale: Aya inanukuu dai lake bila maelezo ya tathmini ndani ya sentensi yenyewe; tafsiri haipaswi kuingiza hukumu ya kiufafanuzi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya kibiblia na hadhi ya usemi wa kinabii. ‘Akajitengenezea’ ni ya kawaida na sahihi kuliko ‘akatengeneza kwa ajili yake mwenyewe’; ‘utawapiga kwa pembe’ huepuka neno adimu huku ikihifadhi taswira halisi ya Kiebrania.
