  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: sw
  text: Akasema, “Nitatoka na kuwa roho ya uongo[a] katika vinywa vya manabii wake wote.” Naye akasema, “Utamshawishi[b], nawe pia utafanikiwa. Toka ukafanye hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho ya udanganyifu.”
    reason: lexical_alternative
  - marker: b
    text: Au “Utamdanganya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Nitatoka
  rationale: Kitenzi cha nafsi ya kwanza kinaonyesha hatua ambayo msemaji anakusudia kuchukua; “nitatoka” ni Kiswahili cha kawaida na huhifadhi wazo la kutoka.
- source_word: וְהָיִיתִי
  choice: na kuwa
  rationale: Huhifadhi maana ya predikati ya היה na, katika muktadha huu, huonyesha kuingia katika jukumu linalofuata bila kulazimisha ufafanuzi zaidi.
- source_word: לְרוּחַ שֶׁקֶר
  choice: roho ya uongo
  rationale: Kirai hiki humaanisha roho yenye sifa ya uongo au udanganyifu. “Roho ya uongo” ni cha moja kwa moja, cha asili, na huhifadhi mvutano wa simulizi.
- source_word: בְּפִי
  choice: katika vinywa vya
  rationale: Huhifadhi taswira halisi ya Kiebrania kuhusu uongo unaosemwa kwa vinywa vya manabii; wingi umetumiwa kwa Kiswahili kwa kuwa manabii ni wengi.
- source_word: כָּל נְבִיאָיו
  choice: manabii wake wote
  rationale: Hutoa maana kamili ya כָּל pamoja na kiambishi cha nafsi ya tatu; “wake” humrejelea Ahabu katika muktadha.
- source_word: תְּפַתֶּה
  choice: Utamshawishi
  rationale: פתה katika muundo huu inaweza kumaanisha kushawishi kwa hila au kudanganya. “Utamshawishi” huhifadhi upana huo, huku tanbihi ikionyesha maana yenye nguvu zaidi ya udanganyifu.
- source_word: וְגַם תּוּכָל
  choice: nawe pia utafanikiwa
  rationale: יכל hapa haionyeshi uwezo wa kinadharia tu, bali kwamba mpango utaweza kutekelezwa kwa mafanikio. “Utafanikiwa” ni Kiswahili cha asili na hakidokezi lazima kushinda upinzani.
- source_word: צֵא
  choice: Toka
  rationale: Amri hii hurudia kitenzi cha awali cha kutoka na huhifadhi mwangwi huo wa maneno.
- source_word: וַעֲשֵׂה כֵן
  choice: ukafanye hivyo
  rationale: Hiki ni kifungu cha amri kinachomaanisha kutenda kwa namna iliyopendekezwa; “ukafanye hivyo” huunganisha kwa kawaida amri ya kutoka na tendo linalofuata.
theological_decisions:
- issue: Ruhusa au agizo la Mungu katika maono yanayohusisha udanganyifu
  choice: Maneno yametafsiriwa moja kwa moja kama idhini na agizo kwa roho kutekeleza mpango wa udanganyifu ndani ya maono.
  alternative: Kulainisha lugha ili kuondoa au kupunguza wazo la kuhusika kwa Mungu katika udanganyifu.
  rationale: Kiebrania kinaonyesha wazi pendekezo la roho na jibu linalolikubali na kuliamuru litekelezwe. Tafsiri inapaswa kuhifadhi mvutano huu wa kiteolojia badala ya kuutatua kwa ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazungumzo ni rahisi kueleweka, huku taswira ya “vinywa vya manabii” na utata wa mhusika anayesema vikihifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
