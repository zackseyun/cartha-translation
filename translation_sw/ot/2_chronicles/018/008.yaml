translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Kiunganishi “Ndipo” kinadumisha mwendelezo wa simulizi bila kufanya sentensi kuwa nzito.
