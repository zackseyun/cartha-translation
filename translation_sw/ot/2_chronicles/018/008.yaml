  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֵ֖ר מיכהו בֶן יִמְלָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akamwita afisa mmoja[a] na kumwambia, “Mlete haraka Mikaya mwana wa Imla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “towashi mmoja” au “afisa mmoja wa ikulu”; neno la Kiebrania linaweza kumaanisha towashi kihalisi au, kwa maana pana zaidi, afisa wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Kitenzi קרא katika mfululizo wa simulizi kinaonyesha kwamba mfalme alimwita mtumishi ili ampe agizo; “akamwita” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huu ni muundo wa umilikaji unaomtambulisha msemaji; “mfalme wa Israeli” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֶל סָרִיס אֶחָד
  choice: ofisa mmoja
  rationale: סָרִיס inaweza kumaanisha towashi kihalisi au ofisa wa kifalme. Katika muktadha huu jukumu lake ni la mtumishi wa mfalme anayetumwa kutekeleza agizo, hivyo “ofisa” linafaa huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: וַיֹּאמֶר
  choice: na kumwambia
  rationale: Kitenzi cha kawaida cha usemi kimetafsiriwa kwa muundo wa Kiswahili unaounganisha kwa ufasaha kumwita ofisa na kumpa agizo.
- source_word: מַהֵר
  choice: Mlete haraka
  rationale: Amri מַהֵר inaonyesha uharaka. “Mlete haraka” ni agizo la asili katika Kiswahili na linaeleza kwa muktadha kwamba ofisa huyo alipaswa kumleta Mikaya.
- source_word: מיכהו
  choice: Mikaya
  rationale: “Mikaya” ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili kwa mhusika huyu.
- source_word: בֶן יִמְלָא
  choice: mwana wa Imla
  rationale: Ni usemi wa kawaida wa nasaba, uliotafsiriwa moja kwa moja na kwa Kiswahili cha asili.
