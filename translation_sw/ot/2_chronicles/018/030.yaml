  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּה֩ אֶת שָׂרֵ֨י הָ/רֶ֤כֶב אֲשֶׁר ל/וֹ֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת הַ/קָּטֹ֖ן אֶת הַ/גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: sw
  text: Mfalme wa Aramu alikuwa amewaamuru makamanda wa magari yake ya vita, akisema, “Msipigane na mtu yeyote, mdogo wala mkubwa, ila na mfalme wa Israeli peke yake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֲרָם
  choice: Mfalme wa Aramu
  rationale: Kiunganishi וּ kinaendeleza simulizi, lakini Kiswahili hakihitaji lazima kuanza kwa ‘Na’; ‘Aramu’ huhifadhi jina la mahali la Kiebrania.
- source_word: צִוָּה
  choice: alikuwa amewaamuru
  rationale: Kitenzi kina maana ya kuamuru; wakati timilifu uliopita unaonyesha kuwa agizo lilitolewa kabla ya matukio yanayosimuliwa katika muktadha.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: makamanda wa magari yake ya vita
  rationale: שָׂרֵי ni maofisa au makamanda, הָרֶכֶב hapa ni kikosi cha magari ya vita, na אֲשֶׁר לוֹ huonyesha kuwa yalikuwa yake au chini ya amri yake.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili ya kutambulisha maneno ya moja kwa moja.
- source_word: לֹא תִּלָּחֲמוּ אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: Msipigane na mtu yeyote, mdogo wala mkubwa
  rationale: Amri hasi imetafsiriwa kwa ‘Msipigane.’ Jozi ‘mdogo ... mkubwa’ ni msemo unaojumuisha kila mtu bila kujali cheo; kuongeza ‘mtu yeyote’ hufanya maana hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: ila na mfalme wa Israeli peke yake
  rationale: כִּי אִם huweka ubaguzi wenye ukomo (‘ila’), na לְבַדּוֹ husisitiza kuwa mfalme wa Israeli ndiye shabaha pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Magari ya vita’ ni wazi zaidi kwa msomaji wa kawaida kuliko ‘magari’ pekee. Msemo wa Kiebrania ‘mdogo wala mkubwa’ umehifadhiwa huku maana yake ya kijumla ikifafanuliwa kwa ‘mtu yeyote.’
