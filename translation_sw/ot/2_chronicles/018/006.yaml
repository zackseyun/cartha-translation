  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: sw
  text: Lakini Yehoshafati akasema, “Je, hapa hakuna tena nabii wa Yahwe[a], ili tumwulize?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “BWANA.” Kiebrania: YHWH, jina binafsi la Mungu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akasema
  rationale: Waw ya kisimulizi inaendeleza simulizi, lakini katika muktadha huu kauli ya Yehoshafati inatofautiana na makubaliano ya manabii waliotangulia; hivyo “Lakini” huwasilisha uhusiano wa kimuktadha kwa Kiswahili cha kawaida.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetoholewa kwa umbo linalotambulika na wasomaji wa Biblia ya Kiswahili.
- source_word: הַאֵין
  choice: Je, ... hakuna
  rationale: Muundo wa swali pamoja na ukanushi unauliza kwa kutazamia uwezekano wa jibu la kuthibitisha; “Je, ... hakuna” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: פֹּה
  choice: hapa
  rationale: Ni kielezi cha mahali, na “hapa” ndilo neno la kawaida na la moja kwa moja.
- source_word: נָבִיא
  choice: nabii
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa נָבִיא; umoja wa Kiebrania umehifadhiwa.
- source_word: לַיהוָה
  choice: wa Yahwe
  rationale: 'Lamed inaonyesha uhusiano au uwakilishi: nabii aliye wa Yahwe au anayesema kwa niaba yake. “wa Yahwe” ni fasaha na huhifadhi jina la agano lililo katika maandishi.'
- source_word: עוֹד
  choice: tena
  rationale: Katika muktadha, neno linauliza kama yupo nabii wa ziada zaidi ya wale waliokwisha kuulizwa. “tena” hudokeza hilo bila kulifanya neno “mwingine” kuwa wazi kupita Kiebrania.
- source_word: וְנִדְרְשָׁה
  choice: ambaye tunaweza kumwuliza
  rationale: Kitenzi דרשׁ hapa kinamaanisha kutafuta jibu kwa kumwendea nabii. Kohotativi ya nafsi ya kwanza wingi imewasilishwa kama hatua inayopendekezwa, kwa Kiswahili cha asili.
- source_word: מֵאֹתוֹ
  choice: kumwuliza
  rationale: Kiambishi cha nafsi kinamtaja mtu ambaye jibu linatafutwa kwake. Kiswahili huunganisha kwa kawaida wazo hilo katika kitenzi “kumwuliza”; maana ya kupata ujumbe kupitia nabii inaachwa itokane na muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi la agano badala ya kulibadilisha kwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
- issue: Nabii kama mpatanishi wa kuulizia mapenzi ya Mungu
  choice: ambaye tunaweza kumwuliza
  alternative: ili tumwulize kupitia kwake
  rationale: Kiebrania kinaweza kueleweka kama kumuuliza nabii, huku ikidokezwa kwamba jawabu la Mungu linatafutwa kupitia kwake. Matini kuu haiongezi wazi “Mungu” au “kupitia kwake,” hivyo haifafanui zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa urahisi wa kusomeka kwa sauti huku ikihifadhi swali la kukanusha, umoja wa “nabii,” na uwezekano kwamba עוֹד humaanisha “tena/bado” au kwa muktadha “mwingine.”
