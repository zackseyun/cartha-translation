  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: sw
  text: Ikawa kwamba makamanda wa magari ya vita walipomwona Yehoshafati, wakasema, “Huyu ndiye mfalme wa Israeli.” Basi wakamgeukia ili wapigane naye. Lakini Yehoshafati akapiga kelele, naye Yahweh akamsaidia; Mungu akawageuza mbali naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu aliwaelekeza mbali naye.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwageuza au kuwasogeza watu mbali na shabaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָרֶכֶב
  choice: makamanda wa magari ya vita
  rationale: Neno שָׂרֵי linaonyesha viongozi wa kijeshi, na הָרֶכֶב linataja kikosi cha magari ya vita. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha kisasa.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: Huyu ndiye mfalme wa Israeli
  rationale: Kauli hii isiyo na kitenzi inamtambulisha Yehoshafati kuwa ndiye waliyedhani kuwa lengo lao. “Huyu ndiye” ni usemi wa kawaida katika mazungumzo ya Kiswahili.
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: wakamgeukia
  rationale: Kitenzi סבב hapa kinaonyesha kwamba walibadili mwelekeo na kumfanya Yehoshafati kuwa shabaha yao. “Wakamgeukia” kinahifadhi mwendo huo wa uadui bila kudai kwa lazima kwamba walimzingira kabisa.
- source_word: לְהִלָּחֵם
  choice: ili wapigane naye
  rationale: 'Muundo wa kitenzi unaonyesha kusudi la kumgeukia: kuingia vitani dhidi yake.'
- source_word: וַיִּזְעַק
  choice: akapiga kelele
  rationale: זעק huonyesha kilio kikubwa, mara nyingi wakati wa dhiki. Tafsiri hii inahifadhi uzito wake bila kuongeza kwamba alimlilia Mungu moja kwa moja, jambo ambalo halijasemwa wazi katika kishazi hiki.
- source_word: וַיהוָה עֲזָרוֹ
  choice: Yahwe akamsaidia
  rationale: עזר humaanisha kusaidia, na jina la agano יְהוָה limetolewa kama “Yahwe.”
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: Mungu akawageuza waondoke kwake
  rationale: Hifili ya סות hapa inaonyesha Mungu akiwafanya waache kumlenga Yehoshafati na waondoke kwake. Tafsiri hii inaweka wazi matokeo na kuhifadhi utendaji wa Mungu bila kuingiza maana ya ushawishi wa kimaadili.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Ikawa ... walipomwona
  rationale: Huu ni mpito wa kawaida wa simulizi la Kiebrania. “Ikawa” huhifadhi mwendo wa simulizi bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Kutafsiri majina ya Mungu יְהוָה na אֱלֹהִים katika mstari mmoja
  choice: Yahwe ... Mungu
  alternative: BWANA ... Mungu
  rationale: Matini inatumia jina maalumu יְהוָה kisha jina la kawaida אֱלֹהִים. Kutofautisha “Yahwe” na “Mungu” kunahifadhi uchaguzi huo wa matini ya Kiebrania.
- issue: Ikiwa kilio cha Yehoshafati kielezwe wazi kuwa sala
  choice: Yehoshafati akapiga kelele
  alternative: Yehoshafati akamlilia Yahwe
  rationale: Ingawa muktadha unaunganisha kilio chake na msaada wa Yahwe, kishazi cha Kiebrania hakimtaji anayeelekezewa kilio. Tafsiri haiongezi jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Magari ya vita” limetumiwa badala ya istilahi ya kizamani, na uhusiano wa vishazi umehifadhiwa kwa mtiririko wa kawaida.
