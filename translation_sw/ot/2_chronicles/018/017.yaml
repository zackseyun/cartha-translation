  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akamwambia Yehoshafati, “Je, sikukuambia kwamba hatatabiri mema kunihusu, bali mabaya tu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Ndipo” pamoja na kitenzi cha masimulizi huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: אֶל יְהוֹשָׁפָט
  choice: akamwambia Yehoshafati
  rationale: אֶל humtambulisha anayeelekezewa maneno; kiambishi -mw- katika “akamwambia” huwasilisha uhusiano huo kwa Kiswahili cha asili, huku jina likitajwa bila cheo kama katika Kiebrania.
- source_word: הֲלֹא אָמַרְתִּי אֵלֶיךָ
  choice: Je, sikukuambia
  rationale: הֲלֹא huanzisha swali la balagha linalotarajia kukubaliwa; “sikukuambia” ni usemi wa kawaida unaohifadhi rejeo la wakati uliopita.
- source_word: לֹא יִתְנַבֵּא עָלַי
  choice: hatanitabiria
  rationale: Kitenzi cha wakati usiotimilika baada ya kauli ya wakati uliopita kinaonyesha jambo alilodai kuwa tabia au matarajio ya nabii; wakati ujao wa Kiswahili unafaa katika nukuu inayokumbukwa. Kiambishi -ni- kinawakilisha עָלַי, yaani unabii unaomhusu mfalme.
- source_word: טוֹב
  choice: mema
  rationale: Kivumishi kimetumika kama nomino; “mema” huhifadhi utofautishaji mfupi na “mabaya” na kinaeleweka kama mambo au habari njema.
- source_word: כִּי אִם
  choice: bali ... tu
  rationale: Muundo huu unaonyesha ubaguzi na utofautishaji wenye nguvu; “bali ... tu” ni wa asili na huhifadhi maana ya ‘isipokuwa’ au ‘bali pekee.’
- source_word: לְרָע
  choice: mabaya
  rationale: Huhifadhi ulinganifu wa kileksia wa טוֹב na רָע. Katika muktadha, neno linamaanisha matokeo mabaya au maafa yanayotabiriwa, si lazima uovu wa kimaadili.
theological_decisions:
- issue: Asili ya ujumbe uliotabiriwa
  choice: mema ... bali mabaya tu
  alternative: mambo mema ... bali maafa tu
  rationale: Utofautishaji wa Kiebrania kati ya mema na mabaya umehifadhiwa bila kuufanya kuwa dai kuhusu uovu wa kimaadili. Muktadha unaonyesha kwamba mfalme analalamika kuhusu unabii wa matokeo yasiyompendeza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida. Muundo “Je, sikukuambia kwamba...” unatoa swali la balagha kwa uwazi; “hatanitabiria mema” ni mfupi, wa asili, na unahifadhi mvutano wa maneno ya Kiebrania.
