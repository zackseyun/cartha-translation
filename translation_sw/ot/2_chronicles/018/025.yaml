  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akasema, “Mchukueni Mikaya, mkamrudishe kwa Amoni, mkuu wa mji,[a] na kwa Yoashi, mwana wa mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamanda wa mji.” Cheo cha Kiebrania kinaweza kumaanisha afisa wa kiraia au wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida huku ukihifadhi wazo la tendo linalofuata.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huhifadhi cheo kilichotumiwa katika Kiebrania badala ya kuingiza jina la Ahabu.
- source_word: קְחוּ
  choice: Mchukueni
  rationale: Amri ya wingi ya לקח humaanisha kumchukua mtu; neno hili haliongezi kwa lazima wazo la kumkamata kwa nguvu.
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hili la kibiblia.
- source_word: וַהֲשִׁיבֻהוּ
  choice: mkamrudishe
  rationale: Hiphil ya שוב hapa ina maana ya kusababisha mtu arudi; kiambishi -ka- kinaonyesha kwa kawaida mwendo na tendo linalofuata katika Kiswahili.
- source_word: אָמ֣וֹן
  choice: Amoni
  rationale: Hili ni umbo la Kiswahili linalosomeka kwa urahisi la jina Amon.
- source_word: שַׂר הָעִיר
  choice: mkuu wa mji
  rationale: שַׂר ni cheo chenye wigo mpana, kama mkuu, mtawala, afisa, au kamanda. “Mkuu wa mji” huhifadhi upana huo bila kuamua kwamba cheo hicho kilikuwa cha kiraia au kijeshi pekee.
- source_word: וְאֶל יוֹאָשׁ
  choice: na kwa Yoashi
  rationale: Huwakilisha kihusishi אֶל kilichorudiwa na kumtaja Yoashi kuwa mpokeaji wa pili.
- source_word: בֶּן הַמֶּלֶךְ
  choice: mwana wa mfalme
  rationale: Ni tafsiri ya moja kwa moja ya uhusiano ulioelezwa katika Kiebrania, bila kuufasiri moja kwa moja kuwa cheo cha “mwana-mfalme.”
