base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: sw
  text: 'Naye akasema, “Basi, lisikieni neno la Yahwe: Nilimwona Yahwe ameketi katika kiti chake cha enzi, na jeshi lote la mbinguni[a] limesimama upande wa kulia wake na upande wa kushoto wake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “makundi yote ya mbinguni,” au “jeshi lote la mbingu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Basi
  rationale: Huonyesha mpito wa kimantiki kutoka katika majibizano yaliyotangulia na ni wa kawaida katika Kiswahili cha sasa bila kupunguza uzito wa kauli ya kinabii.
- source_word: שִׁמְעוּ
  choice: lisikieni
  rationale: Ni amri kwa watu wengi; kiambishi cha ngeli ya ‘neno’ kinafanya usemi ‘lisikieni neno’ kuwa wa kawaida na wenye hadhi katika Kiswahili.
- source_word: דְבַר יְהוָה
  choice: neno la Yahwe
  rationale: Hudumisha fomula ya kinabii na maana ya msingi ya דָּבָר, huku jina la Mungu likitafsiriwa kwa unukuzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu linalowakilishwa na Tetragramatoni, kwa tahajia inayofaa Kiswahili.
- source_word: רָאִיתִי
  choice: Nilimwona
  rationale: Wakati uliopita unaendana na taarifa ya maono, na kiambishi cha yambwa hai kinamrejelea Yahwe.
- source_word: יוֹשֵׁב
  choice: ameketi
  rationale: Hueleza hali ya kuketi kwa Yahwe kwenye kiti cha enzi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: כִּסְאוֹ
  choice: kiti chake cha enzi
  rationale: Huwasilisha wazi taswira ya kifalme ya כִּסֵּא na kiambishi cha umilikaji.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: jeshi lote la mbinguni
  rationale: צָבָא ni kundi lililokusanyika au jeshi; tafsiri hii huhifadhi maana ya pamoja na muktadha wa baraza la mbinguni.
- source_word: עֹמְדִים
  choice: limesimama
  rationale: Kitenzi kinaafikiana na nomino ya pamoja ‘jeshi’ na kuhifadhi maana ya moja kwa moja ya hali yao.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: upande wake wa kulia na upande wake wa kushoto
  rationale: Huhifadhi mpangilio wa mahali na urudiaji uliopo katika Kiebrania bila kuongeza neno ‘mkono,’ ambalo halipo wazi katika matini.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה katika maono ambamo nabii anasema alimwona
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יְהוָה. ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, bila kuficha mvutano wa kauli kwamba nabii alimwona Yahwe.
- issue: Utambulisho wa צְבָא הַשָּׁמַיִם katika baraza la mbinguni
  choice: jeshi lote la mbinguni
  alternative: viumbe vyote vya mbinguni; makundi yote ya mbinguni
  rationale: Matini haitaji kwa undani washiriki hawa ni akina nani. ‘Jeshi’ huhifadhi maana ya pamoja na ya kijeshi ya צָבָא bila kuwafafanua kimadhehebu kuwa malaika pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa tangazo la kinabii umehifadhiwa, lakini sentensi imefanywa isikike kwa urahisi kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
