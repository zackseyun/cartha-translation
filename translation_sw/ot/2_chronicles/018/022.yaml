translation:
  language: sw
  text: Na sasa, tazama, BWANA ametia roho ya uongo kinywani mwa manabii hawa wako, na BWANA amenena mabaya juu yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huendeleza hoja na kuleta hitimisho la wakati huu kwa Kiswahili cha kawaida.
- source_word: הִנֵּה
  choice: tazama
  rationale: Huhifadhi wito wa msikilizaji aangalie kwa makini, kwa mtindo wenye hadhi.
- source_word: נָתַן
  choice: ametia
  rationale: Katika muundo huu wa Kiebrania maana yake ni kuweka au kutia kitu ndani ya mahali fulani.
- source_word: רוּחַ שֶׁקֶר
  choice: roho ya uongo
  rationale: Tafsiri ya moja kwa moja inayohifadhi utata wa 'roho' na uhusiano wake na uongo.
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: katika vinywa vya manabii wako hawa
  rationale: Wingi wa 'vinywa' unaafikiana kwa kawaida na manabii wengi na huhifadhi msisitizo wa 'hawa' na umilikaji 'wako'.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: ametangaza mabaya juu yako
  rationale: Kitenzi ni 'amesema/amenena'; 'ametangaza' huwasilisha kwa kawaida tamko la BWANA, huku 'mabaya' kikihifadhi upana wa רָעָה kuliko kulifunga kwa 'maafa' pekee.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya Biblia za Kiswahili ya kuwakilisha jina la agano kwa herufi kubwa.
theological_decisions:
- issue: BWANA kumtia roho ya uongo katika manabii
  choice: ametia roho ya uongo
  alternative: ameruhusu roho ya uongo
  rationale: Chanzo kinasema kwa uwazi נָתַן ('ametia/ameweka'), si 'ameruhusu'; tafsiri haipunguzi mvutano wa kiteolojia uliomo katika simulizi.
- issue: Maana ya רָעָה
  choice: mabaya
  alternative: maafa
  rationale: '''Mabaya'' huhifadhi uwezekano mpana wa hukumu, msiba, au jambo baya bila kuamua kwa ufafanuzi mwembamba.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. 'Basi sasa, tazama' huhifadhi mtiririko na msisitizo wa Kiebrania bila kuwa cha kizamani kupita kiasi.
