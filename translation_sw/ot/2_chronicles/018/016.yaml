base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: sw
  text: Akasema, “Niliwaona Israeli wote wametawanyika milimani kama kondoo ambao hawana mchungaji.[a] Yahweh akasema, ‘Hawa hawana mabwana[b]; kila mtu na arudi nyumbani kwake kwa amani.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo wa kawaida zaidi, “kama kondoo wasio na mchungaji.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mabwana.” Baadhi ya tafsiri hutumia umoja, “bwana,” kwa maana ya mtawala au kiongozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: wametawanyika
  rationale: Kitenzi hiki kinaonyesha watu waliotengana na kusambaa baada ya kushindwa; ‘wametawanyika’ ni Kiswahili cha kawaida kinachohifadhi taswira ya kijeshi na ya kichungaji.
- source_word: עַל הֶהָרִים
  choice: milimani
  rationale: Hii ni tafsiri ya kawaida ya mahali, inayowasilisha taswira ya Israeli waliotawanyika juu ya maeneo ya milima.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: kama kondoo ambao hawana mchungaji
  rationale: Muundo huu unahifadhi tashbihi na kishazi kamili cha Kiebrania, huku ukibaki wazi na wa asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: Hawa hawana mabwana
  rationale: ‘Mabwana’ huhifadhi wingi wa אֲדֹנִים na kuonyesha kwamba watu wameachwa bila uongozi baada ya kifo cha mfalme, bila kufanya neno hilo kuwa cheo cha Mungu.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: kila mtu na arudi nyumbani kwake
  rationale: ‘Na arudi’ huonyesha nguvu ya agizo au ruhusa katika usemi wa Mungu, na ‘kila mtu’ huhifadhi maana ya mgawanyo ya אִישׁ.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Hii ndiyo kauli ya kawaida ya Kiswahili inayohifadhi maana pana ya kurudi salama na kwa amani.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Idadi na maana ya אֲדֹנִים
  choice: mabwana
  alternative: bwana
  rationale: Wingi wa Kiebrania umehifadhiwa katika maandishi, lakini tanbihi inaonyesha kwamba unaweza kueleweka kwa maana ya pamoja kama ‘bwana’ au mtawala mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Milimani’ na ‘nyumbani kwake’ ni miundo ya kawaida isiyoondoa maana ya msingi; wingi usio wa kawaida kidogo katika ‘mabwana’ umehifadhiwa kwa sababu una ushahidi wa moja kwa moja katika Kiebrania.
