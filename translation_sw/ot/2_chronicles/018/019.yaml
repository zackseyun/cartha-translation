source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: sw
  text: Yahwe akasema[a], “Ni nani atakayemshawishi Ahabu, mfalme wa Israeli, ili apande na aanguke huko Ramothi-Gileadi?” Mmoja akasema hivi, na mwingine akasema vile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumdanganya” au “kumshawishi kwa hila.”
    reason: Kitenzi cha Kiebrania kinaweza kueleza ushawishi, uvutaji kwa hila, au udanganyifu kulingana na muktadha.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo, kwa tahajia inayoeleweka katika Kiswahili.
- source_word: יְפַתֶּה
  choice: atamshawishi
  rationale: Kitenzi hiki katika piel kinaweza kumaanisha kushawishi, kuvuta kwa hila, au kudanganya. ‘Kumshawishi’ kinadumisha wazo la kumsukuma Ahabu achukue hatua bila kuamua kimyakimya kwamba maana yake ni udanganyifu tu.
- source_word: אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: Ahabu mfalme wa Israeli
  rationale: Muundo wa kiambatisho cha cheo cha kifalme umehifadhiwa kwa Kiswahili cha kawaida na fasaha.
- source_word: וְיַעַל
  choice: ili apande
  rationale: Kiunganishi pamoja na kitenzi kisichotimilika kinaonyesha kusudi au matokeo yanayokusudiwa; ‘ili’ hutoa uhusiano huo kwa uwazi.
- source_word: וְיִפֹּל
  choice: na kuanguka
  rationale: Tafsiri halisi ya נפל ni ‘kuanguka.’ Katika muktadha wa vita inadokeza kushindwa au kufa, lakini lugha ya picha ya Kiebrania imehifadhiwa.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: huko Ramoth-gileadi
  rationale: ‘Huko’ ni ya kawaida kwa tukio linalotokea mahali palipotajwa; jina la mahali limetoholewa kwa namna inayosomeka katika Kiswahili.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: Mmoja akasema hivi, na mwingine akasema vile
  rationale: Nahau hii inaonyesha mapendekezo tofauti katika baraza; tafsiri hii ni ya asili na inadumisha urudiaji sambamba wa Kiebrania.
theological_decisions:
- issue: Kuhusika kwa Yahwe katika kuanguka kwa Ahabu
  choice: Kauli ya moja kwa moja kwamba Yahwe anauliza ni nani atakayemshawishi Ahabu imehifadhiwa.
  alternative: Kutumia kauli dhaifu kama ‘ni nani atakayemvutia’ au kusema Yahwe aliruhusu tu Ahabu ashawishiwe.
  rationale: Kiebrania kinamwonyesha Yahwe akianzisha shauri kwa mamlaka yake. Tafsiri haipunguzi uhusika huo, bali inadumisha mvutano wa kiteolojia wa kifungu.
- issue: Uzito wa kimaadili wa פתה
  choice: kumshawishi
  alternative: kumdanganya; kumpotosha; kumvuta kwa hila
  rationale: Muktadha unaelekea kwenye ushauri wa kupotosha unaompeleka Ahabu kwenye maangamizi, lakini kitenzi chenyewe kina wigo mpana. Maana mbadala zimewekwa katika tanbihi badala ya kufungia tafsiri kuu kwenye maana moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa baraza la mbinguni na mvutano wa kimaadili umehifadhiwa bila ufafanuzi wa kimadhehebu.
