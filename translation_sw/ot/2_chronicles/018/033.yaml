translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Gari’ limetumiwa katika muktadha unaoonyesha gari la vita; tafsiri imeepuka usemi usioeleweka ‘geuza mkono wako’ katika maandishi makuu huku ikiuhifadhi katika tanbihi. Utata wa לְתֻמּוֹ na wa istilahi za deraya umehifadhiwa kwa tanbihi.
