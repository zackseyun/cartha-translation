  terminology: “Deraya” na “dirii ya kifuani” ni istilahi zinazokubalika, huku tanbihi ikihifadhi kutokuwa hakika kwa istilahi za silaha. “Mwendesha gari la vita” ni sahihi zaidi kuliko “mwendesha gari” kwa רַכָּב. “Nimejeruhiwa” haliongezi kiwango cha jeraha ambacho Kiebrania hakikielezi wazi.
