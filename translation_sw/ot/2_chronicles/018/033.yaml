base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: sw
  text: Lakini mtu mmoja akavuta upinde bila kulenga shabaha maalumu[a], akampiga mfalme wa Israeli katika mwanya kati ya sehemu za deraya na dirii ya kifuani[b]. Mfalme akamwambia mwendesha gari la vita, “Geuza gari la vita[c], uniondoe katika mapigano[d], kwa maana nimejeruhiwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa unyofu wake” au “bila kusudi maalumu.” Neno la Kiebrania linaweza kumaanisha unyofu au kutokuwa na kusudi maalumu; hapa yaelekea mpiga upinde hakumlenga mfalme hasa.
    reason: lexical_alternative
  - marker: b
    text: Maneno ya Kiebrania yanayotaja sehemu hizi za deraya hayana uhakika. Huenda yakamaanisha “kati ya maungio ya deraya na dirii.” Jambo kuu ni kwamba mshale uliingia kwenye mwanya wa deraya ya mfalme.
    reason: cultural_note
  - marker: c
    text: Kwa maana halisi, “Geuza mkono wako.” Hii inaelekea kumaanisha kugeuza au kuelekeza gari la vita mbali na mapigano.
    reason: lexical_alternative
  - marker: d
    text: Kwa maana halisi, “uniondoe kambini.” Neno la Kiebrania linaweza pia kumaanisha jeshi au eneo la jeshi, na hapa linarejelea eneo la mapigano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Lakini mtu mmoja
  rationale: Kiunganishi וְ kinaendeleza simulizi huku kikileta tukio la kinyume lisilotarajiwa; אִישׁ ni mtu asiyeainishwa.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: akavuta upinde wake
  rationale: Hii ni nahau ya kuvuta upinde ili kurusha mshale; Kiswahili hiki ni cha kawaida na kinaeleweka.
- source_word: לְתֻמּוֹ
  choice: bila kulenga
  rationale: Neno linaweza kumaanisha kwa unyofu au bila kusudi maalumu. Katika vita hapa linaonyesha kwamba hakumlenga mfalme mahsusi, bila kudai kwamba mshale ulirushwa kiholela kabisa.
- source_word: וַיַּךְ
  choice: akampiga
  rationale: Kitenzi נכה humaanisha kupiga au kugonga; jeraha linalotokana na pigo hilo linatajwa baadaye.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: kwenye mwanya kati ya vipande vya deraya na dirii ya kifuani
  rationale: Maneno ya aina hizi za silaha hayana uhakika kamili, lakini picha ni ya mshale kuingia katika pengo kati ya sehemu za kinga ya mwili.
- source_word: לָרַכָּב
  choice: mwendesha gari
  rationale: Katika muktadha huu ni mtu anayeendesha gari la vita, si gari lenyewe.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: Geuza gari
  rationale: Maana halisi ni ‘geuza mkono wako,’ lakini katika muktadha ni amri ya kuligeuza au kuliondoa gari la vita kutoka eneo la mapigano.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: uniondoe katika mapigano
  rationale: מַחֲנֶה inaweza kuwa kambi, jeshi lililopiga kambi, au safu ya kijeshi; hapa mfalme anaomba aondolewe katika eneo la mapigano.
- source_word: כִּי הָחֳלֵיתִי
  choice: kwa maana nimejeruhiwa
  rationale: Ingawa חלה kwa kawaida huhusiana na kuwa mgonjwa au dhaifu, katika muktadha wa kupigwa na mshale humaanisha kujeruhiwa. Chanzo hakitamki wazi kiwango cha jeraha.
