revisions:
- from: Lakini mtu mmoja akavuta upinde wake bila kulenga[a], akampiga mfalme wa Israeli kwenye mwanya kati ya vipande vya deraya na dirii ya kifuani[b]. Mfalme akamwambia mwendesha gari, “Geuza gari[c], uniondoe katika mapigano[d], kwa maana nimejeruhiwa.”
  to: Lakini mtu mmoja akavuta upinde bila kulenga shabaha maalumu[a], akampiga mfalme wa Israeli katika mwanya kati ya sehemu za deraya na dirii ya kifuani[b]. Mfalme akamwambia mwendesha gari la vita, “Geuza gari la vita[c], uniondoe katika mapigano[d], kwa maana nimejeruhiwa.”
  rationale: Marekebisho yanabainisha kwamba chombo na dereva anayerejelewa ni wa gari la vita, hivyo kuzuia maana ya kisasa ya “gari.” Pia “bila kulenga shabaha maalumu” hueleza vyema kwamba upinde ulitumiwa bila kumlenga mfalme binafsi, huku ikihifadhi utata wa neno la Kiebrania katika tanbihi. Tanbihi zote na viambishi vyake vimehifadhiwa.
