reference: 2 Chronicles 18:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akamwambia Yehoshafati, “Bado yuko mtu mmoja ambaye kupitia kwake tunaweza kumuuliza Yahwe[a], lakini mimi ninamchukia, kwa sababu hanitabirii mema kamwe, bali mabaya siku zote. Yeye ni Mikaya mwana wa Imla.” Yehoshafati akasema, “Mfalme asiseme hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye kupitia kwake tunaweza kumtafuta Yahwe.”
    reason: Kitenzi דרשׁ kinaweza kumaanisha “kuuliza” ili kupata mwongozo au “kutafuta”; dokezo linahifadhi upana huo wa kimaana.
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: Bado yuko mtu mmoja
  rationale: Muundo huu unaonyesha kwamba amebaki mtu mmoja anayepatikana; “bado yuko mtu mmoja” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: ambaye kupitia kwake tunaweza kumuuliza Yahwe
  rationale: Katika muktadha wa kinabii, דרשׁ אֶת־יְהוָה humaanisha kutafuta jibu au mwongozo kutoka kwa Yahwe, huku מֵאֹתוֹ ikionyesha kwamba nabii ndiye mpatanishi wa kuuliza huko.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: lakini mimi ninamchukia
  rationale: Kitenzi timilifu kinaeleza msimamo ulioimarika na unaoendelea. Wakati wa sasa katika Kiswahili unawasilisha hali hiyo kwa kawaida, na “lakini” huonyesha tofauti ya kimuktadha.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: kwa sababu hanitabirii mema kamwe
  rationale: Hali ya kitenzi kishirikishi pamoja na ukanushi inaonyesha tendo la kawaida, si tukio la wakati huo tu. Kiambishi “-ni-” kinahifadhi maana ya עָלַי, yaani unabii unaomhusu mfalme.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: bali mabaya siku zote
  rationale: Maneno halisi “kwa mabaya siku zake zote” yanaeleza tabia ya unabii usiofaa kwake kila wakati. “Siku zote” huhifadhi nguvu ya כָל־יָמָיו bila kufanya Kiswahili kuwa kigumu.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: Mikaya mwana wa Imla
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika Kiswahili, na uhusiano wa ukoo “mwana wa” umehifadhiwa.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Mfalme asiseme hivyo
  rationale: Muundo wa kukataza אַל pamoja na kitenzi kisichotimilika umewasilishwa kwa tegemezi la kukataza. Kutumia “Mfalme” katika nafsi ya tatu kunahifadhi marekebisho ya heshima na yasiyo ya moja kwa moja ya Yehoshafati.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Maana ya unabii “mema” au “mabaya” kumhusu mfalme
  choice: hanitabirii mema kamwe, bali mabaya siku zote
  alternative: hatabiri yaliyo mema au maovu kimaadili
  rationale: Katika muktadha huu maneno hayo yanaeleza matokeo yanayompendeza au yasiyompendeza mfalme, lakini tafsiri inadumisha maneno “mema” na “mabaya” ili kutosuluhisha kabisa mvutano wa kimaadili uliomo katika kauli yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa heshima lakini unaoeleweka kwa urahisi. “Ndipo ... akamwambia” huendeleza mfuatano wa simulizi; kauli ya Yehoshafati imeachwa katika nafsi ya tatu ili kudumisha heshima yake kwa mfalme.
