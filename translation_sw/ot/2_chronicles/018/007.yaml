  source_fidelity: 'Tafsiri inafuata kwa uaminifu Kiebrania: mtu mmoja aliyebaki, kumwuliza Yahwe kupitia nabii huyo, chuki ya mfalme, unabii usio wa mema kwake bali wa mabaya daima, utambulisho wa Mikaya, na katazo la heshima la Yehoshafati. “Mabaya siku zote” huwasilisha vizuri usemi wa kiidiomu כָּל־יָמָיו לְרָעָה bila kufafanua kupita kiasi aina ya ‘mabaya.’'
  naturalness: Kiswahili ni sanifu, cha asili, na kina mtiririko mzuri wa masimulizi. “Mfalme asiseme hivyo” ni usemi wa heshima unaofaa kwa kauli ya Yehoshafati.
  terminology: “Yahwe” limetumiwa kwa uthabiti kama jina binafsi la Mungu. “Kutabiri mema/mabaya,” “mwana wa,” na majina Yehoshafati, Mikaya, na Imla yanafaa kwa rejista ya Biblia ya Kiswahili. Dokezo la chini linaeleza kwa usahihi upana wa דרשׁ katika muktadha huu.
