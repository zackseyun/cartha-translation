base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: sw
  text: Mfalme wa Israeli akamwambia Yehoshafati, “Mimi nitajibadilisha sura[a] niingie vitani, lakini wewe vaa mavazi yako.” Basi mfalme wa Israeli akajibadilisha sura, nao wakaingia vitani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa namna nyingine, “jibadilishe sura.” Umbo la Kiebrania ni fupi na linaweza kueleweka hivyo, lakini kauli inayofuata na tendo la mfalme wa Israeli vinaonyesha kwamba anazungumzia kujibadilisha sura yeye mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Mimi nitajibadilisha sura
  rationale: Ingawa umbo la Kiebrania ni fupi na linaweza kuonekana kama amri, muktadha—hasa kauli inayofuata, “lakini wewe vaa mavazi yako,” na taarifa kwamba mfalme wa Israeli ndiye aliyejibadilisha sura—unaonyesha kuwa mfalme anazungumzia kitendo chake mwenyewe. Kiswahili cha nafsi ya kwanza kinafikisha maana hiyo kwa kawaida.
- source_word: וָבֹא בַמִּלְחָמָה
  choice: niingie vitani
  rationale: Kitenzi בוא pamoja na בַמִּלְחָמָה kinaeleza kuingia katika mapigano. “Niingie vitani” ni Kiswahili cha kawaida na hudumisha mlolongo wa nia ya mfalme.
- source_word: וְאַתָּה
  choice: lakini wewe
  rationale: 'Kiwakilishi kimetumika kwa kusisitiza utofauti: mfalme wa Israeli atajificha kwa kubadili sura, lakini Yehoshafati atavaa mavazi yake ya kawaida yanayomtambulisha.'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: vaa mavazi yako
  rationale: Hii inatafsiri moja kwa moja wazo la kuvaa nguo zake bila kuongeza waziwazi neno “ya kifalme,” ambalo halimo katika Kiebrania, ingawa muktadha unaonyesha mavazi yanayomtambulisha kama mfalme.
- source_word: וַיָּבֹאוּ בַמִּלְחָמָה
  choice: nao wakaingia vitani
  rationale: Kitenzi cha wingi kinawahusu wafalme wote wawili walipoingia katika mapigano; “wakaingia vitani” ni simulizi la asili katika Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Tafsiri rasmi na ya kawaida ya cheo hiki, iliyodumishwa katika sehemu zote mbili.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili na linalofaa mofolojia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Kujibadilisha sura” limetumiwa badala ya lugha nzito au isiyo ya kawaida; “vitani” linafaa mtindo wa simulizi. Ufafanuzi “ya kifalme” haujaingizwa katika matini kwa sababu haujatajwa moja kwa moja katika Kiebrania.
