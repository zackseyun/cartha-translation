base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: sw
  text: Mikaya akasema, “Ikiwa kweli utarudi salama, basi Yahweh hakusema kupitia kwangu.” Kisha akasema, “Sikieni, enyi mataifa yote!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Mikaya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Ikiwa kweli utarudi
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi huongeza msisitizo; ‘kweli’ huuhifadhi kwa Kiswahili cha kawaida.
- source_word: בְּשָׁלוֹם
  choice: salama
  rationale: Katika muktadha huu neno linamaanisha kurudi bila kujeruhiwa; ‘salama’ ni wazi na la kawaida kuliko tafsiri sisisi ‘kwa amani.’
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Yahwe hakusema kupitia kwangu
  rationale: Kihusishi בִּי kina maana ya chombo au njia hapa; ‘kupitia kwangu’ huwasilisha wazi kwamba Mikaya anadai kuwa msemaji wa ujumbe wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: שִׁמְעוּ
  choice: Sikieni
  rationale: Amri ya wingi imehifadhiwa pamoja na uzito wa mwito wa kinabii.
- source_word: עַמִּים כֻּלָּם
  choice: enyi mataifa yote
  rationale: Wingi wa עַמִּים umehifadhiwa; ‘mataifa’ ni usemi wa kawaida wa Kiswahili kwa makundi ya watu katika mwito mpana wa kinabii.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; kulitohowa huhifadhi tofauti hiyo.
- issue: Msemaji wa kifungu cha mwisho
  choice: Mikaya anaendelea kuwa msemaji
  alternative: Kumwacha msemaji bila kubainishwa zaidi
  rationale: Kitenzi kinasema tu ‘akasema,’ na mtendaji wa karibu aliyetajwa ni Mikaya; tafsiri haitaji jina tena lakini mwendelezo wa kisarufi unabaki wazi.
- issue: Upeo wa עַמִּים katika mwito wa mwisho
  choice: mataifa yote
  alternative: watu wote
  rationale: Wingi wa Kiebrania unaashiria mwito mpana wa kinabii; ‘watu wote’ ungeweza kuficha wingi wa makundi ya watu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya usemi wa kinabii lakini kinachoeleweka kwa msomaji wa kawaida. ‘Salama’ limetumiwa kwa maana ya kurudi bila madhara; ‘Sikieni, enyi mataifa yote’ huhifadhi wingi na uzito wa mwito.
