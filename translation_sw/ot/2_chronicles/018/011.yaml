base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: sw
  text: Manabii wote walikuwa wakitabiri kwa namna hiyo, wakisema, “Panda kwenda Ramoth-gileadi, ukafanikiwe; Yahwe atautia mji huo mikononi mwa mfalme.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe ameutia mji huo mikononi mwa mfalme.” Umbo la Kiebrania linaweza kuwasilisha jambo la wakati ujao kana kwamba tayari limehakikishwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  choice: Manabii wote
  rationale: Huwakilisha kiunganishi cha simulizi pamoja na jumla ya kundi; katika Kiswahili, kuanza moja kwa moja na ‘Manabii wote’ ni kwa kawaida zaidi kuliko kuongeza ‘na’ isiyohitajika.
- source_word: נִבְּאִים
  choice: walikuwa wakitabiri
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, sawasawa na kishirikishi cha Kiebrania katika muktadha huu.
- source_word: כֵּן
  choice: kwa namna hiyo
  rationale: Hueleza namna ambayo wote walikuwa wakitabiri, bila kuongeza kwamba kila neno lao lilifanana kabisa.
- source_word: עֲלֵה
  choice: Panda uende
  rationale: Huhifadhi maana ya msingi ya ‘kupanda/kwenda juu’ na wakati huohuo husikika kwa kawaida katika agizo la kwenda mahali; ‘shambulia’ lingeongeza maana ya kijeshi isiyotajwa moja kwa moja na kitenzi.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Ni unukuzi unaotambulika kwa wasomaji wa Biblia ya Kiswahili na unaonyesha jina la mahali lenye sehemu mbili.
- source_word: וְהַצְלַח
  choice: nawe ufanikiwe
  rationale: Huhifadhi agizo la pili na maana ya kufanikiwa, badala ya kulibadili kuwa tu ahadi ya mafanikio.
- source_word: וְנָתַן יְהוָה
  choice: Yahwe atautia
  rationale: Wakati ujao huwasilisha matokeo yaliyohakikishwa katika kauli ya kinabii; tanbihi inadumisha uwezekano wa kusoma umbo timilifu kama tendo lililokwisha hakikishwa.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: mkononi mwa mfalme
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya kuwekwa chini ya mamlaka au udhibiti wa mfalme.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo; ‘Yahwe’ hulihifadhi bila kulibadili kuwa cheo.
- issue: Wakati na hali ya וְנָתַן katika unabii
  choice: atautia
  alternative: ameutia
  rationale: Katika muktadha wa maagizo yanayofuatiwa na ahadi, Kiswahili cha wakati ujao ni cha kawaida na huonyesha matokeo yanayotabiriwa. Hata hivyo, umbo la Kiebrania linaweza kuwasilisha ushindi kana kwamba tayari umehakikishwa, hivyo mbadala umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa tendo linaloendelea umehifadhiwa, pamoja na taswira ya ‘mkononi mwa mfalme.’ Kirejeshi ‘-u-’ katika ‘atautia’ kinarejelea mji wa Ramoth-gileadi, unaoeleweka kutokana na muktadha.
