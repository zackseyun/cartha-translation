source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: sw
  text: Katika mwaka wa thelathini na sita wa utawala wa Asa[a], Baasha mfalme wa Israeli akaja kupigana na Yuda, akajenga Rama ili kumzuia yeyote kwenda au kutoka kwa Asa, mfalme wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika mwaka wa thelathini na sita wa utawala wa Asa.” Hili linaleta mvutano wa kronolojia na taarifa za 1 Wafalme kuhusu Baasha. Baadhi huelewa miaka hii kuwa inahesabiwa tangu kugawanyika kwa ufalme, na wengine hupendekeza marekebisho ya matini ili kupatanisha tarehe hizo.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/שֵׁשׁ
  choice: Katika mwaka wa thelathini na sita
  rationale: Kirai chenye בִּ hutaja wakati; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לְ/מַלְכוּת אָסָא
  choice: wa utawala wa Asa
  rationale: מַלְכוּת hapa humaanisha kipindi cha kutawala kwa Asa; “utawala” huhifadhi maana hiyo kwa lugha ya kawaida.
- source_word: עָלָה ... עַל יְהוּדָה
  choice: alipanda dhidi ya Yuda
  rationale: עלה pamoja na עַל katika muktadha wa kijeshi humaanisha kusonga dhidi ya mahali; “alipanda dhidi ya” huhifadhi taswira ya Kiebrania bila kuongeza maelezo yasiyotajwa.
- source_word: וַ/יִּבֶן אֶת הָ/רָמָה
  choice: na kujenga Rama
  rationale: בנה maana yake ya msingi ni “kujenga.” Ingawa muktadha unaweza kudokeza kuimarisha ngome, tafsiri haiongezi wazo hilo moja kwa moja.
- source_word: הָ/רָמָה
  choice: Rama
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: לְ/בִלְתִּי תֵּת
  choice: ili asimruhusu
  rationale: Muundo huu huonyesha kusudi la kuzuia au kutoruhusu; tafsiri hii ni wazi na ya asili.
- source_word: יוֹצֵא וָ/בָא
  choice: kutoka au kuingia
  rationale: Jozi hii ya vitenzi huonyesha uhuru wa kwenda na kurudi; maneno halisi na mpangilio wa chanzo yamehifadhiwa.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: kwa Asa mfalme wa Yuda
  rationale: לְ huonyesha mwelekeo au uhusiano hapa; “kwa Asa” huhifadhi upeo wa usemi bila kufafanua kupita chanzo.
theological_decisions:
- issue: Mvutano wa mpangilio wa miaka kuhusu utawala wa Baasha katika Wafalme
  choice: Kuhifadhi katika matini kuu maneno ya Kimasoreti, “mwaka wa thelathini na sita wa utawala wa Asa”
  alternative: Kuhesabu mwaka wa thelathini na sita tangu kugawanyika kwa ufalme, au kusahihisha kuwa mwaka wa ishirini na sita wa Asa
  rationale: Kiebrania kinasema wazi “mwaka wa thelathini na sita ... wa utawala wa Asa.” Tatizo la mpangilio wa miaka halipaswi kusawazishwa kimya kimya; maelezo ya chini yanawasilisha mitazamo mingine kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “alipanda dhidi ya” umehifadhi nahau ya chanzo, huku “kujenga Rama” kikiepuka kuongeza wazi dhana ya kuimarisha ngome ambayo kitenzi chenyewe hailazimishi.
