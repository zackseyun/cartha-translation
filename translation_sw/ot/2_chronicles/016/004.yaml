base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: sw
  text: Ben-hadadi akamsikiliza Mfalme Asa, akawatuma makamanda wa majeshi yake dhidi ya miji ya Israeli. Nao wakashambulia Iyoni, Dani, Abel-maimu[a], na miji yote ya kuhifadhia akiba ya Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Abel-maimu” ndilo jina lililo katika maandishi ya Kiebrania hapa; wengine huitambulisha mji huu kuwa Abel-beth-maaka unaotajwa katika vifungu sambamba.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: akamsikiliza
  rationale: Katika muktadha huu, kitenzi kinaonyesha kwamba Ben-hadadi alisikia ombi la Asa na akalikubali kwa kuchukua hatua; “akamsikiliza” hudumisha maana zote mbili bila kudai moja kwa moja kwamba alimtii.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: makamanda wa majeshi yake
  rationale: “Makamanda” huonyesha viongozi wa kijeshi, huku “wa majeshi yake” ikiwasilisha kwa Kiswahili cha kawaida umiliki unaoonyeshwa na אֲשֶׁר לוֹ.
- source_word: עָרֵי יִשְׂרָאֵל
  choice: miji ya Israeli
  rationale: Hili ni rejeo la moja kwa moja la kijiografia na kisiasa kwa miji ya ufalme wa kaskazini.
- source_word: וַיַּכּוּ
  choice: wakaishambulia
  rationale: Katika simulizi la kijeshi, נכה inaweza kumaanisha kupiga au kushambulia. “Wakaishambulia” ni ya kawaida na inaeleza wazi hatua ya kijeshi dhidi ya miji iliyotajwa.
- source_word: עִיּוֹן
  choice: Iyoni
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: אָבֵל מָיִם
  choice: Abel-maimu
  rationale: Tafsiri inafuata moja kwa moja jina lililo katika maandishi ya Kiebrania hapa badala ya kulisawazisha na jina la kifungu sambamba.
- source_word: מִסְכְּנוֹת עָרֵי נַפְתָּלִי
  choice: miji yote ya maghala ya Naftali
  rationale: מִסְכְּנוֹת hurejelea mahali pa kuhifadhia akiba au vifaa. “Miji ya maghala” ni usemi unaoeleweka na unaofaa katika muktadha wa kijeshi na kiuchumi.
