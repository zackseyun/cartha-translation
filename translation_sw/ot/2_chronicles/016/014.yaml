base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: sw
  text: Wakamzika katika kaburi lake[a], alilokuwa amejichimbia katika Jiji la Daudi. Wakamlaza juu ya kitanda cha mazishi kilichokuwa kimejazwa manukato na aina mbalimbali za manukato yaliyochanganywa kwa ustadi wa mtengenezaji wa manukato. Kisha walifanya uchomaji mkubwa sana kwa ajili yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umbo la wingi, “makaburi yake,” ambalo huenda linamaanisha jengo au eneo lake la makaburi.
    reason: lexical_alternative
  - marker: b
    text: Huenda uchomaji huu ulikuwa wa manukato au vitu vingine vyenye harufu nzuri kwa heshima yake katika mazishi; si lazima usemi huu umaanishe kwamba mwili wake uliteketezwa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: Wakamzika
  rationale: Kitenzi קבר kina maana ya kumzika; umbo la masimulizi lenye kiunganishi limewasilishwa kwa “waka-” ili kuhifadhi mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: בְקִבְרֹתָיו
  choice: katika kaburi lake
  rationale: Ingawa Kiebrania kina umbo la wingi, katika muktadha huu linaweza kuelekeza kwenye jengo au eneo la makaburi ya kifalme; umoja ni wa kawaida zaidi kwa Kiswahili bila kubadili maana ya mahali alipozikwa.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: alilokuwa amejichimbia
  rationale: כּרה humaanisha kuchimba au kutoboa. “Amejichimbia” ni usemi wa asili unaohifadhi maana kwamba aliliandaa kwa ajili yake mwenyewe, bila kudai kwa lazima kuwa lilichongwa mwambani.
- source_word: בְּעִיר דָּוִיד
  choice: katika Jiji la Daudi
  rationale: Hili ni jina la mahali linalotambulika na linawasilishwa kwa namna wazi katika Kiswahili.
- source_word: וַיַּשְׁכִּיבֻהוּ
  choice: Wakamlaza
  rationale: Hifili ya שׁכב hapa ina maana ya kumweka mwili ulale; “wakamlaza” ni ya asili na inafaa katika muktadha wa mazishi.
- source_word: בַּמִּשְׁכָּב
  choice: juu ya kitanda cha mazishi
  rationale: מִשְׁכָּב kwa msingi ni mahali pa kulala, kitanda, au kochi. Muktadha wa mazishi unaelekeza kwenye kitanda cha kuwekea mwili; tafsiri hii inaeleweka kuliko istilahi adimu ya jeneza la wazi.
- source_word: אֲשֶׁר מִלֵּא
  choice: kilichokuwa kimejazwa
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu ya kiume bila mtendaji aliye wazi. Kauli tendwa ya Kiswahili inalenga hali ya kitanda kilichotayarishwa na haiongezi mtendaji.
- source_word: בְּשָׂמִים
  choice: manukato
  rationale: Neno hili hurejelea vitu vyenye harufu nzuri vilivyotumiwa katika utayarishaji wa mazishi. “Manukato” ni pana na rahisi kueleweka.
- source_word: וּזְנִים מְרֻקָּחִים
  choice: na aina mbalimbali za mchanganyiko wenye harufu nzuri
  rationale: זְנִים ni neno adimu linaloeleweka kama aina mbalimbali, nalo מְרֻקָּחִים hudokeza vitu vilivyochanganywa kwa ustadi. Tafsiri inaacha wazi kama vilikuwa marhamu, manukato, au mchanganyiko mwingine wa harufu.
- source_word: בְּמִרְקַחַת מַעֲשֶׂה
  choice: uliotayarishwa kwa ustadi wa mtengenezaji wa manukato
  rationale: Kirai kinaonyesha kazi ya kitaalamu ya kuchanganya manukato; “kwa ustadi” huhifadhi wazo la ufundi bila kuwa kizito.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: Kisha wakamwashia moto mkubwa sana kwa heshima yake
  rationale: Usemi wa Kiebrania ni kihalisi ‘wakafanya uchomaji mkubwa sana kwa ajili yake.’ Kiswahili hiki huhifadhi moto wa ibada ya mazishi huku ‘kwa heshima yake’ kikibainisha nguvu ya לוֹ bila kusema kuwa mwili wake uliteketezwa.
theological_decisions:
- issue: Maana ya moto wa mazishi
  choice: Moto mkubwa wa heshima katika mazishi, bila kusema kwamba mwili uliteketezwa
  alternative: Mwili wa Asa ulichomwa; au ulikuwa moto wa mazishi usioelezwa zaidi
  rationale: Aya kwanza inasema wazi kwamba Asa alizikwa na kulazwa mahali palipotayarishwa, halafu inataja uchomaji uliofanywa ‘kwa ajili yake.’ Muktadha unafaa na uchomaji wa manukato au vitu vyenye harufu kwa heshima ya mfalme, lakini chanzo hakitaji wazi kilichochomwa; tanbihi inalinda kutokamilika huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili isomeke kwa urahisi. “Kitanda cha mazishi” na “mtengenezaji wa manukato” ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi mazingira ya mazishi na ufundi wa kuchanganya manukato.
