  text: וְ/הִנֵּה֙ דִּבְרֵ֣י אָסָ֔א הָ/רִאשׁוֹנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֤/ם כְּתוּבִים֙ עַל סֵ֣פֶר הַ/מְּלָכִ֔ים לִ/יהוּדָ֖ה וְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: sw
  text: Tazama[a], matendo ya Asa, ya kwanza na ya mwisho, tazama, yameandikwa katika Kitabu cha Wafalme wa Yuda na Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “mambo ya Asa, ya kwanza na ya mwisho.” Hapa “matendo” linaonyesha maana ya usemi wa kihistoria wa Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta usikivu katika taarifa ya kuhitimisha; “Tazama” ni la heshima na linaeleweka katika Kiswahili cha Biblia bila kuongeza wazo la wakati lisilomo wazi katika Kiebrania.
- source_word: דִּבְרֵי אָסָא
  choice: matendo ya Asa
  rationale: Katika muundo huu wa muhtasari wa kifalme, דְּבָרִים humaanisha kwa upana mambo au matendo yanayomhusu mfalme, si maneno aliyosema tu.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: ya kwanza na ya mwisho
  rationale: Huhifadhi jozi halisi ya Kiebrania na upana wake, ikirejelea habari za kipindi chote bila kuibadili kimya kimya kuwa usemi mwingine.
- source_word: הִנָּם כְּתוּבִים
  choice: tazama, yameandikwa
  rationale: Huhifadhi kiashiria cha pili cha Kiebrania pamoja na kauli kwamba matendo hayo yanapatikana katika kumbukumbu iliyoandikwa.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kimsingi ni “juu ya,” katika fomula ya kurejelea maandishi Kiswahili cha kawaida husema “katika kitabu.”
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: Wafalme wa Yuda na Israeli
  rationale: Hutoa jina la kumbukumbu kwa uwazi bila kuongeza neno la kufasiri kama “kumbukumbu za mwaka” ambalo halijaandikwa moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Marudio ya “tazama” yamehifadhiwa kwa sababu yapo mara mbili katika maandishi ya Kiebrania; alama ya tanbihi [a] imewekwa katika matini.
