  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: sw
  text: Asa akalala na baba zake[a], akafa katika mwaka wa arobaini na moja wa utawala wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akalala na baba zake,” usemi wa kawaida wa kifo na maziko miongoni mwa mababu za mtu.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Neno hili linahifadhi picha ya Kiebrania ya kulala; halijafupishwa kuwa “akafa” kwa sababu kitenzi kinachofuata kinasema wazi kwamba Asa alikufa.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Hii inahifadhi kwa uwazi tamathali ya kifalme ya Kiebrania na maana yake ya kifamilia na kimnasaba. Tanbihi inaeleza kwamba “baba zake” hapa inawahusu waliomtangulia katika ukoo.
- source_word: וַיָּמָת
  choice: akafa
  rationale: Tafsiri ya moja kwa moja ya מות, ikidumisha kauli ya wazi ya kifo baada ya tamathali ya kulala pamoja na baba zake.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: katika mwaka wa arobaini na moja
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kutaja mwaka wa utawala unaohesabiwa kwa mpangilio.
- source_word: לְמָלְכוֹ
  choice: wa utawala wake
  rationale: Katika fomula hii ya tarehe ya kifalme, “utawala wake” ni Kiswahili cha kawaida na sahihi kwa kipindi ambacho Asa alitawala akiwa mfalme.
- source_word: אָסָא
  choice: Asa
  rationale: Umbo la jina linalotumiwa kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya usemi “akalala pamoja na baba zake”
  choice: Usemi wa asili umehifadhiwa, kisha maana yake ya kimuktadha imefafanuliwa katika tanbihi.
  alternative: Kutafsiri usemi huo moja kwa moja kuwa “alikufa” au “alipumzika pamoja na mababu zake.”
  rationale: Kiebrania kinatumia kwanza usemi wa kulala na halafu kinasema wazi “akafa.” Kuhifadhi zote mbili kunazuia kufuta uradidi wenye kusudi na hakuongezi dai la kiteolojia kuhusu hali ya wafu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi wa Kiebrania umehifadhiwa katika matini na kufafanuliwa kwa kifupi katika tanbihi.
