source:
  edition: WLC
  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: sw
  text: Ndipo Asa akatoa fedha na dhahabu kutoka katika hazina za nyumba ya Yahwe na za nyumba ya mfalme, akazituma kwa Ben-hadadi, mfalme wa Aramu[a], aliyekuwa akiishi Damasko, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Aramu”; kwa mapokeo, “Syria.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: akatoa
  rationale: Hifili ya יצא ina maana ya kutoa kitu kilichokuwa ndani; “akatoa” ni ya kawaida na inadumisha tendo halisi.
- source_word: כֶּסֶף וְזָהָב
  choice: fedha na dhahabu
  rationale: Maneno haya yanataja metali hizo mbili moja kwa moja, hivyo hayajumlishwi kuwa mali au hazina.
- source_word: מֵאֹצְרוֹת
  choice: kutoka katika hazina
  rationale: Ingawa Kiebrania kina umbo la wingi, Kiswahili kwa kawaida hutumia “hazina” kama jina la mahali au akiba bila kulazimisha “hazina mbalimbali”; maana ya vyanzo vya mali iliyohifadhiwa inadumishwa.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” inadumisha neno la Kiebrania na usambamba wake na nyumba ya mfalme; jina la agano יְהוָה linatolewa kama “Yahwe.”
- source_word: וּבֵית הַמֶּלֶךְ
  choice: na za nyumba ya mfalme
  rationale: Inadumisha usemi halisi “nyumba ya mfalme” na usambamba na “nyumba ya Yahwe”; “za” linarejelea hazina.
- source_word: וַיִּשְׁלַח
  choice: akazituma
  rationale: Kiambishi “-zi-” kinarejelea fedha na dhahabu, ambavyo Kiebrania imeviacha vieleweke kutokana na muktadha.
- source_word: אֶל בֶּן הֲדַד
  choice: kwa Ben-hadadi
  rationale: Jina la mtu limetoholewa kwa muundo unaoeleweka na uliozoeleka katika Kiswahili cha Biblia.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: “Aramu” linadumisha jina la asili badala ya kulibadilisha kuwa jina la baadaye la kijiografia, “Syria.”
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: aliyekuwa akiishi Damasko
  rationale: Muundo huu unaonyesha hali endelevu ya kitenzi-shirikishi cha Kiebrania na ni Kiswahili cha kawaida.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Ni utangulizi wa kawaida wa maneno ya moja kwa moja yanayofuata katika aya inayofuata.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la Mungu la herufi nne moja kwa moja. “Yahwe” linadumisha jina hilo la agano badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha mfululizo wa simulizi na koma ya mwisho kwa sababu maneno ya Asa yanaanza katika aya inayofuata.
