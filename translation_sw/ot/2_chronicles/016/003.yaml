  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/בֵ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּֽי לְ/ךָ֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֞ךְ הָפֵ֣ר בְּרִֽיתְ/ךָ֗ אֶת בַּעְשָׁא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: sw
  text: “Kuna mkataba kati yangu na wewe[a], na kati ya baba yangu na baba yako. Tazama, nimekutumia fedha na dhahabu. Nenda ukavunje mkataba wako na Baasha, mfalme wa Israeli, ili ajiondoe kwangu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agano” au “muungano” badala ya “mkataba” (Kiebrania בְּרִית); hapa muktadha ni mapatano ya kisiasa kati ya wafalme.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “naye apande kutoka juu yangu”; nahau hii yaelekea kumaanisha kwamba Baasha angeondoa shinikizo au hatua zake za kijeshi dhidi ya Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: mkataba
  rationale: Katika muktadha huu wa kidiplomasia kati ya wafalme, “mkataba” linaeleza kwa kawaida mapatano rasmi ya kisiasa; limetumiwa mara zote mbili ili kuhifadhi urudiaji wa Kiebrania.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: kati yangu na wewe, na kati ya baba yangu na baba yako
  rationale: Muundo sambamba na urudiaji wa “kati” umehifadhiwa kwa kuwa ni sehemu ya kauli rasmi ya kidiplomasia.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye fedha na dhahabu zilizotumwa; “Tazama” ni la sasa, lenye heshima, na lina nguvu ya uashiriaji ya neno la Kiebrania.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: nimekutumia fedha na dhahabu
  rationale: Kauli ya hali timilifu inaonyesha tendo lililokamilika lenye umuhimu wa sasa katika ujumbe huu wa kidiplomasia.
- source_word: לֵךְ הָפֵר
  choice: Nenda ukavunje
  rationale: Mfululizo huu wa vitenzi unaonyesha agizo la kwenda na kutekeleza tendo; “ukavunje” ni Kiswahili cha kawaida kwa kuvunja mkataba.
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: mkataba wako na Baasha
  rationale: Kiswahili hutumia “mkataba ... na” kueleza pande zinazohusika katika mapatano.
- source_word: וְיַעֲלֶה מֵעָלַי
  choice: ili ajiondoe kwangu
  rationale: Nahau halisi ya ‘kupanda kutoka juu yangu’ hapa inaelekea kumaanisha Baasha kuondoa shinikizo au hatua zake za kijeshi dhidi ya Asa.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Hili ndilo jina la cheo la kifalme lililo wazi na la kawaida katika Kiswahili.
