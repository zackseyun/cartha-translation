  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo rasmi wa kidiplomasia umehifadhiwa bila kutumia lugha ya kizamani. Alama zote za tanbihi zimewekwa katika matini kuu.
