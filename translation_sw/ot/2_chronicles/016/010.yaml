base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: sw
  text: Ndipo Asa akamkasirikia mwonaji huyo, akamtia katika nyumba ya kifungo[a], kwa sababu alimghadhibikia sana kwa jambo hilo. Wakati huo Asa akawakandamiza kwa ukatili baadhi ya watu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba ya mikatale”; usemi wa Kiebrania huenda unamaanisha mahali pa kifungo ambako wafungwa walizuiliwa kwa pingu au mikatale.
    reason: lexical_alternative
  - marker: b
    text: Au, “akawaponda” au “akawatendea vibaya”; kitenzi cha Kiebrania kina maana halisi yenye ukali na huonyesha mateso makali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: akamkasirikia
  rationale: Kitenzi hiki huonyesha hasira au kukerwa; ‘akamkasirikia’ ni Kiswahili cha kawaida kinachoendeleza mfuatano wa simulizi.
- source_word: הָרֹאֶה
  choice: mwonaji
  rationale: Neno hili ni jina la kale la kinabii lenye maana halisi ya mtu anayeona; ‘mwonaji’ huhifadhi tofauti yake na neno la jumla ‘nabii’.
- source_word: בֵּית הַמַּהְפֶּכֶת
  choice: nyumba ya kifungo
  rationale: Usemi wa Kiebrania si wazi kabisa, lakini katika muktadha unamaanisha mahali pa kumfungia mtu, huenda kwa pingu au mikatale. Tafsiri hii inaeleweka huku maelezo ya chini yakihifadhi uwezekano huo mahususi.
- source_word: בְזַעַף עִמּוֹ
  choice: alikuwa amemghadhibikia sana
  rationale: זַעַף huonyesha ghadhabu kali. Usemi huu ni wa asili na wenye hadhi katika Kiswahili, nao unaonyesha kwamba ghadhabu ya Asa ilielekezwa kwa mwonaji.
- source_word: עַל זֹאת
  choice: kwa jambo hilo
  rationale: Kirai hiki hurejelea jambo lililotangulia na kueleza sababu ya ghadhabu ya Asa.
- source_word: וַיְרַצֵּץ
  choice: akawakandamiza kwa ukatili
  rationale: Katika Piel, רצץ ina nguvu ya kuponda au kuvunja; inapowahusu watu hapa inaonyesha kuwatesa au kuwaonea kwa nguvu. ‘Akawakandamiza kwa ukatili’ huwasilisha ukali huo bila kudai kwamba walipondwa kihalisi.
- source_word: מִן הָעָם
  choice: baadhi ya watu
  rationale: מן limetumiwa kwa maana ya sehemu ya kundi, hivyo kifungu kinawahusu baadhi ya watu wala si watu wote.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya kirai hicho cha wakati.
