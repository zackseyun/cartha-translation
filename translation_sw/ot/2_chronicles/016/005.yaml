  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: sw
  text: Baasha aliposikia hayo, akaacha kuijenga Rama[a], akaisitisha kazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaacha kuiimarisha Rama”; Kiebrania kinamaanisha kusitisha kazi ya ujenzi au ya kuutia mji huo ngome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: aliposikia hayo
  rationale: Muundo huu wa Kiebrania unaanzisha kishazi cha wakati. Kiswahili cha kawaida hakihitaji kutafsiri וַיְהִי neno kwa neno kama “ikawa kwamba”; “aliposikia hayo” huonyesha wakati na mfuatano wa matukio. “Hayo” limedokezwa kutokana na habari iliyotangulia kwa sababu Kiebrania hakitaji wazi kitu kilichosikiwa.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: akaacha kuijenga
  rationale: Kitenzi חדל pamoja na מן na kitenzi-jina huonyesha kusitisha shughuli; “akaacha kuijenga” ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: אֶת הָרָמָה
  choice: Rama
  rationale: Hili ni jina la mahali. Kiambishi cha yambwa “-i-” katika “kuijenga” kinairejelea Rama kama mji uliokuwa ukijengwa au kuimarishwa.
- source_word: וַיַּשְׁבֵּת אֶת מְלַאכְתּוֹ
  choice: akaisitisha kazi yake
  rationale: Hifili ya שבת ina maana ya kufanya kitu kikome au kukisitisha. “Akaisitisha kazi yake” huhifadhi wazo la kisababishi kuliko “akaacha kazi,” huku מלאכה likitafsiriwa kwa neno la kawaida “kazi.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetolewa kwa vitenzi vinavyofuatana kwa “aka-,” bila kuiga kwa ugumu nahau ya Kiebrania “ikawa.”
