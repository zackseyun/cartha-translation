language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: sw
  text: Wakati huo, Hanani mwonaji alimjia Asa mfalme wa Yuda, akamwambia, “Kwa sababu ulimtegemea mfalme wa Aramu[a], wala hukumtegemea Yahwe Mungu wako, kwa hiyo jeshi la mfalme wa Aramu limeponyoka mkononi mwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Shamu.” Kiebrania kinasema “Aramu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni utangulizi wa wakati ulio wazi na wa kawaida katika Kiswahili; kiunganishi cha Kiebrania kimeingizwa katika mtiririko wa simulizi.
- source_word: חֲנָנִי הָרֹאֶה
  choice: Hanani mwonaji
  rationale: Jina limetoholewa kama Hanani, na רֹאֶה limetafsiriwa kwa cheo mahususi “mwonaji” badala ya neno pana zaidi “nabii.”
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: Kwa sababu ulimtegemea ... wala hukumtegemea
  rationale: “Kutegemea” huwasilisha utegemezi wa kisiasa na wa kiimani kwa Kiswahili cha kawaida, huku marudio ya kitenzi cha Kiebrania yakihifadhiwa.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: Aramu ni jina lililo katika maandishi ya Kiebrania; “Shamu” limewekwa kama mbadala katika tanbihi.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Jina la agano יְהוָה limetolewa moja kwa moja kama Yahwe, na kirai kizima kimehifadhiwa.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Huonyesha wazi kuwa kutoroka kwa jeshi ni matokeo ya kutomtegemea Yahwe.
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: jeshi la mfalme wa Aramu
  rationale: Katika muktadha huu חֵיל humaanisha jeshi au nguvu ya kijeshi; “jeshi” ni neno la kawaida na sahihi.
- source_word: נִמְלַט ... מִיָּדֶךָ
  choice: limeponyoka mkononi mwako
  rationale: “Limeponyoka” huonyesha tendo lililokamilika lenye matokeo ya sasa, na “mkononi mwako” huhifadhi taswira ya Kiebrania ya mamlaka au udhibiti.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu, hivyo “Yahwe” hulihifadhi moja kwa moja bila kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya utegemezi wa Asa na kutoroka kwa jeshi
  choice: kwa hiyo
  alternative: kwa sababu hiyo
  rationale: Kiunganishi עַל כֵּן kinaonyesha matokeo ya moja kwa moja katika shutuma ya Hanani bila kufafanua zaidi namna ya utendaji wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida lakini wenye hadhi. “Mwonaji” huhifadhi cheo maalumu cha kinabii, na “limeponyoka mkononi mwako” huhifadhi nahau ya chanzo kwa namna inayoeleweka.
