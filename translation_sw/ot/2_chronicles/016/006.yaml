base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: sw
  text: Kisha Mfalme Asa akawakusanya watu wote wa Yuda[a], nao wakaondoa mawe ya Rama na mbao zake, vifaa ambavyo Baasha alikuwa ametumia kujenga[b]. Asa akavitumia kujenga Geba na Mispa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawahamasisha watu wote wa Yuda”; kwa neno halisi, “akachukua Yuda yote.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, mawe na mbao ambazo Baasha alikuwa ametumia kuijenga Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: akawakusanya watu wote wa Yuda
  rationale: Kitenzi לָקַח kwa maana ya msingi ni ‘chukua,’ lakini katika muktadha huu mfalme aliwahamasisha au kuwakusanya watu wa Yuda kwa kazi. Tafsiri hii inaeleza nahau hiyo kwa Kiswahili cha kawaida, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: וַיִּשְׂאוּ
  choice: wakaondoa
  rationale: Kitenzi נשׂא hapa kinaeleza kuinua na kusafirisha vifaa vya ujenzi kutoka Rama; ‘wakaondoa’ ni usemi wa asili unaojumuisha kuvichukua kutoka mahali hapo.
- source_word: אַבְנֵי הָרָמָה
  choice: mawe ya Rama
  rationale: Muundo wa umilikaji wa Kiebrania unaunganisha mawe na ngome ya Rama. ‘Mawe ya Rama’ ni tafsiri ya karibu isiyoongeza ufafanuzi usiotajwa.
- source_word: עֵצֶיהָ
  choice: mbao zake
  rationale: Kiambishi cha umilikaji kinarejelea Rama, na עֵץ katika muktadha wa ujenzi inafaa kutafsiriwa ‘mbao’ kuliko ‘miti’ au ‘kuni.’
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: ambazo Baasha alikuwa ametumia kujenga
  rationale: Kishazi hiki kinaeleweka kuwa kinarejelea mawe na mbao ambazo Baasha alitumia katika ujenzi. Kiswahili hiki kinaweka uhusiano huo wazi bila kutaja kitu cha ujenzi ndani ya sentensi.
- source_word: וַיִּבֶן בָּהֶם
  choice: Asa akazitumia kujenga
  rationale: Kitenzi cha umoja kinamrejelea Asa, na kiwakilishi cha wingi kinarejelea mawe na mbao. Kurudia jina ‘Asa’ huondoa utata wa kiima katika Kiswahili.
- source_word: גֶּבַע
  choice: Geba
  rationale: Hili ni umbo la kawaida la kuandika jina hili la mahali kwa herufi za Kiswahili.
- source_word: הַמִּצְפָּה
  choice: Mispa
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili; kibainishi cha Kiebrania hakihitaji kutafsiriwa katika jina hili maalumu.
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na lugha ya heshima inayoeleweka kwa wasomaji wa kawaida. Tafsiri inafuata ulinganifu mwafaka: inafafanua nahau ya Kiebrania katika maandishi na kuhifadhi maana yake halisi katika tanbihi.'
