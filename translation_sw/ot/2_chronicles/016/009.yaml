  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: sw
  text: Kwa maana macho ya Yahwe hutembea huku na huku duniani kote ili kuwatia nguvu wale ambao moyo wao umeelekezwa kwake kikamilifu.[a] Umetenda kwa upumbavu katika jambo hili; kwa maana tangu sasa utakuwa na vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kujionyesha mwenye nguvu kwa ajili ya wale ambao mioyo yao haina lawama kwake.”
    reason: Kiebrania kinaweza kumaanisha Yahwe kuwapa nguvu au kujionyesha mwenye nguvu kwa ajili yao; pia שָׁלֵם inaweza kutafsiriwa “bila lawama,” ingawa hapa inaelekea kusisitiza moyo usiogawanyika.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano kwa umbo la Kiswahili linalosomeka kwa kawaida.
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: macho ya Yahwe huzunguka
  rationale: Linadumisha taswira ya macho ya Mungu yanayotembea huku na huku yakichunguza, kwa Kiswahili cha asili.
- source_word: בְּכָל הָאָרֶץ
  choice: duniani kote
  rationale: Kauli ina upeo wa ulimwengu mzima, si nchi ya Yuda pekee.
- source_word: לְהִתְחַזֵּק עִם
  choice: ili kuwatia nguvu
  rationale: Katika muktadha, kitenzi kinaweza kueleza tendo la Yahwe la kuwasaidia na kuwaimarisha watu hao; maana mbadala ya kujionyesha mwenye nguvu imewekwa katika tanbihi.
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: wale ambao moyo wao umeelekezwa kwake kikamilifu
  rationale: Linawasilisha moyo usiogawanyika na uaminifu kamili kwa Yahwe bila kudokeza ukamilifu usio na dhambi.
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: Umetenda kwa upumbavu katika jambo hili
  rationale: Ni karipio la moja kwa moja na la kawaida katika Kiswahili, likirejelea tendo la Asa.
- source_word: מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: tangu sasa utakuwa na vita
  rationale: Linatoa kwa uwazi nguvu ya wakati ujao ya muundo wa Kiebrania baada ya 'tangu sasa'.
theological_decisions:
- issue: Maana ya שָׁלֵם kuhusu moyo unaomwelekea Yahwe
  choice: uaminifu wa moyo mzima usiogawanyika
  alternative: moyo usio na lawama au mkamilifu kwake
  rationale: Muktadha unahusu kumtegemea Yahwe kwa uaminifu kamili, si kutokuwa na dhambi kabisa.
- issue: Upeo wa הָאָרֶץ
  choice: dunia yote
  alternative: nchi yote
  rationale: Kauli hii ina sauti ya jumla na ya ulimwengu wote kuhusu uangalizi wa Yahwe.
- issue: Nguvu ya לְהִתְחַזֵּק עִם
  choice: kuwatia nguvu
  alternative: kujionyesha mwenye nguvu kwa ajili yao
  rationale: Maana ya kuwasaidia kwa nguvu inafaa muktadha, huku umbo la kujirejelea likibaki uwezekano halisi wa Kiebrania na hivyo kuhifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya macho ya Yahwe imehifadhiwa; sentensi imewekwa wazi kwa wasomaji wa kawaida bila kuondoa utata halisi wa Kiebrania.
