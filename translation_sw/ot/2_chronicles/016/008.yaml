  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: sw
  text: Je, Wakushi na Walubi hawakuwa jeshi kubwa sana, lenye magari ya vita mengi sana na wapanda farasi wengi mno? Lakini ulipomtegemea Yahweh, akawatia mikononi mwako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... hawakuwa
  rationale: Muundo wa swali la balagha unaotarajia jibu la kukubali; Kiswahili hiki kinahifadhi nguvu hiyo.
- source_word: הַכּוּשִׁים
  choice: Wakushi
  rationale: Jina la watu limetoholewa kutoka Kushi ili kubaki karibu na jina la Kiebrania bila kulihusianisha kwa uhakika kupita kiasi na taifa la kisasa.
- source_word: וְהַלּוּבִים
  choice: na Walubi
  rationale: Jina la watu limetoholewa kutoka umbo la Kiebrania; utambulisho wa moja kwa moja na Walibya wa baadaye si lazima uwe wa hakika.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: hawakuwa jeshi kubwa sana
  rationale: חַיִל katika muktadha huu ni jeshi au nguvu ya kijeshi, na לָרֹב inaonyesha ukubwa au wingi wake.
- source_word: לְרֶכֶב
  choice: lenye magari ya vita
  rationale: רֶכֶב hapa hurejelea magari ya kivita; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: וּלְפָרָשִׁים
  choice: na wapanda farasi
  rationale: Tafsiri halisi na yenye picha wazi ya askari wanaopanda farasi.
- source_word: לְהַרְבֵּה מְאֹד
  choice: wengi mno
  rationale: Huhifadhi msisitizo mkubwa wa wingi, huku kisarufi ikirejelea magari ya vita na wapanda farasi kwa ujumla wa vifaa na vikosi vilivyotajwa.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: Lakini ulipomtegemea
  rationale: Kitenzi kina maana ya kumwegemea mtu kwa kutumaini au kutegemea msaada wake; 'ulipomtegemea' ni cha asili na huhifadhi mazingira ya ushindi. 'Lakini' huonyesha tofauti katika hoja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limehifadhiwa kwa utamkaji wa kawaida wa 'Yahweh' badala ya kubadilishwa kuwa cheo.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: aliwatia mkononi mwako
  rationale: Huhifadhi nahau ya Kiebrania ya kuwapa maadui chini ya mamlaka ya mtu, na inaeleweka kwa Kiswahili cha kibiblia chenye hadhi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; 'Yehova' ni umbo jingine la kimapokeo.
- issue: Uhusiano kati ya kumtegemea Yahweh na ushindi
  choice: ulipomtegemea Yahweh, aliwatia mkononi mwako
  alternative: kwa sababu ulimtegemea Yahweh, aliwatia mkononi mwako
  rationale: Muundo wa Kiebrania unaonyesha hali au wakati wa tendo hilo, na unaweza pia kudokeza sababu. Tafsiri ya 'ulipomtegemea' huhifadhi upana huo bila kuufanya uhusiano wa kisababishi kuwa wazi kuliko maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa, na istilahi za kijeshi zimewekwa wazi kwa msomaji wa kawaida.
