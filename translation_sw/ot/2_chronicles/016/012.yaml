source:
  edition: WLC
  text: וַ/יֶּחֱלֶ֣א אָסָ֡א בִּ/שְׁנַת֩ שְׁלוֹשִׁ֨ים וָ/תֵ֤שַׁע לְ/מַלְכוּת/וֹ֙ בְּ/רַגְלָ֔י/ו עַד לְ/מַ֖עְלָ/ה חָלְי֑/וֹ וְ/גַם בְּ/חָלְי/וֹ֙ לֹא דָרַ֣שׁ אֶת יְהוָ֔ה כִּ֖י בָּ/רֹפְאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: sw
  text: Katika mwaka wa thelathini na tisa wa utawala wake, Asa aliugua miguu; ugonjwa wake ukawa mbaya sana. Lakini hata alipokuwa mgonjwa, hakumtafuta Yahweh, bali aliwaendea waganga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakumwomba Yahweh msaada, bali waganga.” Kishazi cha Kiebrania kimefupishwa na kinatofautisha kumtafuta Yahweh na kuwaendea waganga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: aliugua
  rationale: Kitenzi hiki humaanisha kuwa mgonjwa au kudhoofika; “aliugua” ni Kiswahili cha kawaida na cha heshima kinachofaa muktadha.
- source_word: בְּרַגְלָיו
  choice: miguu
  rationale: רֶגֶל inaweza kumaanisha mguu au sehemu ya chini ya kiungo; “miguu” huhifadhi wingi na haibani maana kwa nyayo pekee.
- source_word: עַד לְמַעְלָה
  choice: ukawa mbaya sana
  rationale: Katika muktadha huu usemi huu unaonyesha kiwango kikubwa cha ugonjwa, si mwelekeo wa kwenda juu.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: ugonjwa wake / alipokuwa mgonjwa
  rationale: “Ugonjwa wake” hutafsiri nomino kwa kawaida; katika kutokea kwake mara ya pili, “alipokuwa mgonjwa” huepuka Kiswahili kisicho cha kawaida bila kupoteza maana.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: hakumtafuta Yahweh
  rationale: דרש inapomhusu Mungu hujumuisha kumtafuta au kumwendea ili kupata msaada au mwongozo; “kumtafuta” huhifadhi upana huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika maandishi ya Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: כִּי בָּרֹפְאִים
  choice: bali aliwaendea waganga
  rationale: Kishazi cha Kiebrania kimefupishwa, kihalisi kikielekea kuwa “bali kwa waganga.” Kuongeza kitenzi “aliwaendea” hufanya ulinganisho ueleweke kwa Kiswahili huku tanbihi ikihifadhi ufupisho na utata wa asili.
theological_decisions:
- issue: Ikiwa mstari unalaani matibabu yenyewe au kutomtafuta Mungu kwa Asa
  choice: Matini inasisitiza kwamba Asa hakumtafuta Yahweh, bali aliwaendea waganga.
  alternative: Mstari unakataza au unalaani matumizi yote ya waganga.
  rationale: Kiebrania kinaweka ulinganisho kati ya kutomtafuta Yahweh na kuwaendea waganga, lakini hakisemi wazi kwamba matibabu yote ni haramu. Tafsiri haipaswi kuingiza dai hilo.
- issue: Maana ya רֹפְאִים katika Kiswahili cha sasa
  choice: waganga
  alternative: madaktari
  rationale: Katika mazingira ya kale, “waganga” ni pana na sahihi zaidi kuliko “madaktari,” ambalo linaweza kudokeza taaluma ya kisasa. Hapa neno halimaanishi lazima waganga wa uchawi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Aliugua miguu” ni rahisi kueleweka; “waganga” limetumiwa kwa maana ya watu waliotibu magonjwa katika ulimwengu wa kale, bila kuingiza wazo la uchawi. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
