  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: sw
  text: Hofu ya Yahwe[a] ikazijia falme zote za nchi zilizozunguka Yuda, nazo hazikupigana vita na Yehoshafati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hofu kuu kutoka kwa Yahwe” au “kitisho cha Yahwe.” Maneno ya Kiebrania yanaweza kumaanisha hofu inayohusishwa na Yahwe; hapa huenda yanamaanisha woga aliouleta Yahwe juu ya falme zilizozunguka Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ikazijia
  rationale: Muundo huu unaonyesha kuanza kwa hali fulani. Katika Kiswahili, “ikazijia” ni ya asili kuliko tafsiri ya neno kwa neno “ikawa juu ya,” huku ikihifadhi wazo la hofu kuzipata falme hizo.
- source_word: פַּחַד יְהוָה
  choice: hofu ya Yahwe
  rationale: פַּחַד inaweza kumaanisha hofu, woga mkubwa, au kitisho. Muundo wa “hofu ya Yahwe” unahifadhi uwezekano wa hofu inayohusishwa na Yahwe au inayotoka kwake; muktadha unaelekeza hasa kwenye woga aliowaletea falme jirani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: falme zote za nchi
  rationale: Tafsiri hii inahifadhi nomino zote mbili, “falme” na “nchi,” kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: zilizokuwa kuzunguka Yuda
  rationale: Kifungu hiki kinazitambulisha falme za maeneo yaliyokuwa jirani na Yuda bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: nazo hazikupigana vita na
  rationale: Kitenzi נלחם pamoja na עִם hapa kina maana ya kupigana au kufanya vita na mtu. “Hazikupigana vita na” ni wazi na kinafaa katika muktadha wa kisiasa na kijeshi.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetoholewa kwa umbo linalotambulika na wasomaji wa Kiswahili.
theological_decisions:
- issue: Maana ya “hofu ya Yahwe” katika muktadha huu
  choice: Kudumisha muundo “hofu ya Yahwe,” huku muktadha ukidokeza woga uliotumwa au kusababishwa na Yahwe
  alternative: Hofu ya kumcha Yahwe kwa uchaji
  rationale: Katika simulizi hili la kijeshi na kisiasa, hofu hiyo inazuia falme jirani kuanzisha vita. Hata hivyo, tafsiri kuu haifungi kabisa uhusiano wa kisarufi wa maneno hayo; tanbihi inaonyesha maana mbadala zinazowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka urudiaji wa “falme” na “nchi” wa Kiebrania, huku ikitumia muundo wa asili wa Kiswahili. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
