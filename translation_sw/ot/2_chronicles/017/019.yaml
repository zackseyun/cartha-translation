  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: sw
  text: Hao ndio waliomtumikia mfalme, mbali na wale ambao mfalme alikuwa amewaweka katika miji yenye maboma kotekote Yuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hao ndio
  rationale: Kielezi hiki kinarejelea watu waliotajwa katika orodha iliyotangulia; “Hao ndio” ni kauli ya kawaida ya Kiswahili inayohifadhi dhima hiyo ya kurejelea.
- source_word: הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: waliomtumikia mfalme
  rationale: Kitenzi שׁרת kinaonyesha kutumikia au kuhudumu kwa uwezo rasmi. “Waliomtumikia” kinafaa katika muktadha huu wa kijeshi na kiutawala bila kuleta maana mahsusi ya kidini.
- source_word: מִלְּבַד
  choice: mbali na
  rationale: Kirai hiki kinatenganisha kundi lililotajwa na kundi jingine la askari waliowekwa mijini; “mbali na” huonyesha maana ya ‘pamoja na kundi jingine lisilohesabiwa hapa.’
- source_word: אֲשֶׁר נָתַן
  choice: ambao mfalme alikuwa amewaweka
  rationale: Ingawa נתן kimsingi ni ‘kutoa’ au ‘kuweka,’ hapa linahusu kuwaweka watu katika vituo vyao. “Alikuwa amewaweka” ni la asili na haliongezi umahususi usiokuwamo wazi katika neno la Kiebrania.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: katika miji yenye ngome
  rationale: Kirai hiki kinamaanisha miji iliyoimarishwa kwa ajili ya ulinzi. “Miji yenye ngome” ni Kiswahili wazi na cha kawaida.
- source_word: בְּכָל יְהוּדָה
  choice: kotekote Yuda
  rationale: Muundo huu unaonyesha usambazaji katika eneo lote la Yuda; “kotekote Yuda” huhifadhi maana hiyo kwa lugha ya asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Tafsiri inafuata kwa ukaribu muundo wa Kiebrania huku ikitumia mpangilio wa kawaida wa Kiswahili. Hakuna tanbihi iliyowekwa kwa kuwa maana ya ‘kuwaweka’ katika muktadha huu inaweza kuwasilishwa moja kwa moja bila kuondoa utata muhimu.
