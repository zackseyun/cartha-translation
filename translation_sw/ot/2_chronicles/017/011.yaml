base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: sw
  text: 'Nao baadhi ya Wafilisti[a] walikuwa wakimletea Yehoshafati ushuru na fedha kama mzigo[b]; Waarabu pia walikuwa wakimletea makundi ya kondoo na mbuzi: kondoo dume 7,700 na mbuzi dume 7,700.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa Wafilisti”; Kiebrania kinaweza kusisitiza chanzo badala ya maana ya sehemu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “fedha, mzigo”; yaani, fedha zilizobebwa kama ushuru.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: Nao baadhi ya Wafilisti
  rationale: מִן pamoja na jina la kabila inaweza kuonyesha chanzo, ‘kutoka kwa Wafilisti,’ au maana ya sehemu, ‘baadhi ya Wafilisti.’ Maana ya sehemu inasikika kwa kawaida katika Kiswahili, huku ikiepuka kudai kwamba kila Mfilisti alihusika.
- source_word: מְבִיאִים
  choice: walikuwa wakimletea
  rationale: Kitenzi kishirikishi cha Kiebrania kinaonyesha tendo lililoendelea au lililorudiwa; muundo ‘walikuwa wakimletea’ unawasilisha hali hiyo vizuri.
- source_word: מִנְחָה
  choice: ushuru
  rationale: Katika muktadha wa mataifa ya kigeni kumletea mfalme mali, neno hili linamaanisha ushuru wa kisiasa, si sadaka ya ibada.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: na fedha, mzigo mzima
  rationale: כֶסֶף ni ‘fedha’ na מַשָּׂא ni ‘mzigo.’ Kauli ‘mzigo mzima’ huhifadhi picha halisi ya kiasi cha fedha kilichobebwa na kueleweka kwa kawaida katika Kiswahili.
- source_word: גַּם הָעַרְבִיאִים
  choice: Waarabu pia
  rationale: Huhifadhi nguvu ya nyongeza ya גַּם na hutumia jina la kawaida la kisasa la kundi hilo.
- source_word: ל/וֹ צֹאן
  choice: walikuwa wakimletea mifugo
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; ‘mifugo’ linafaa kwa kuwa aina zake zinafafanuliwa mara moja baada yake.
- source_word: אֵילִים
  choice: kondoo dume
  rationale: Ni maana mahsusi ya kondoo wa kiume na ndiyo kauli ya kawaida na wazi katika Kiswahili.
- source_word: שִׁבְעַת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: 7,700
  rationale: Tarakimu hurahisisha kusoma idadi hiyo bila kubadili maana ya maandishi.
- source_word: וּ/תְיָשִׁים
  choice: mbuzi dume
  rationale: Neno la Kiebrania linataja mahsusi mbuzi wa kiume; tafsiri hii ni sahihi na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa tendo linaloendelea umehifadhiwa. Usemi ‘fedha, mzigo mzima’ umechaguliwa ili kuonyesha kwamba fedha hizo zilikuwa kiasi cha kubebwa kama ushuru bila kulazimisha ufafanuzi ndani ya kifungu.
