  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: sw
  text: bali alimtafuta Mungu wa baba yake, akaenenda kwa amri zake[a], wala hakufuata matendo ya Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana alimtafuta Mungu wa baba yake.” Kiunganishi cha Kiebrania kinaweza pia kutafsiriwa “kwa maana” au “kwa sababu”; “bali” hapa huonyesha tofauti na mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: “Israeli” hapa huenda ikarejelea ufalme wa kaskazini, tofauti na Yuda.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: bali
  rationale: Katika muktadha, kiunganishi kinaonyesha tofauti kati ya Yehoshafati na wafalme wa Israeli waliotajwa katika mstari uliotangulia. Tanbihi huhifadhi uwezekano wa maana ya sababu.
- source_word: לֵאלֹהֵי אָבִיו
  choice: Mungu wa baba yake
  rationale: Muundo huu huhifadhi umoja wa אָבִיו na kueleza kwa Kiswahili cha kawaida yule ambaye Yehoshafati alimtafuta.
- source_word: דָּרָשׁ
  choice: alimtafuta
  rationale: Kitenzi hapa kina maana ya kumwelekea Mungu kwa kujitoa na kutafuta mapenzi au msaada wake, si kuuliza habari tu.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: akaenenda katika amri zake
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania ya kuenenda kama mwenendo wa maisha, huku ikibaki wazi na yenye hadhi katika Kiswahili.
- source_word: וְלֹא כְּמַעֲשֵׂה
  choice: wala si kwa kufuata matendo ya
  rationale: Neno 'kufuata' hufanya ulinganisho wa mwenendo uwe wa kawaida katika Kiswahili bila kuondoa maana ya matendo au desturi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la chanzo linahifadhiwa bila kulipanua katika matini kuwa ufalme wa kaskazini; maelezo ya muktadha yanawekwa katika tanbihi.
theological_decisions:
- issue: Mrejelewa wa “Israeli”
  choice: Kuhifadhi “Israeli” katika matini
  alternative: ufalme wa Israeli wa kaskazini
  rationale: Kiebrania kinasema tu 'Israeli.' Ingawa katika muktadha huenda likarejelea ufalme wa kaskazini, kulipanua katika matini kungeondoa kiwango halisi cha uwazi wa chanzo.
- issue: Uhusiano wa כִּי na mstari uliotangulia
  choice: bali
  alternative: kwa maana / kwa sababu
  rationale: Muktadha unaonyesha utofautishaji, lakini maana ya sababu pia inawezekana kimsamiati; kwa hiyo mbadala huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya kibiblia 'akaenenda katika amri zake' imehifadhiwa; 'bali' na 'wala' huonyesha utofautishaji kwa mtiririko wa asili.
