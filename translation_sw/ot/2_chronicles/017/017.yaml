  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: sw
  text: 'Na kutoka Benyamini: Eliada, shujaa hodari, na pamoja naye watu laki mbili wenye pinde na ngao.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliobeba pinde na ngao,” au “waliojihami kwa pinde na ngao.” Kishiriki cha Kiebrania huonyesha watu waliokuwa na silaha hizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Na kutoka
  rationale: Muunganiko wa kiunganishi na kihusishi unaendeleza orodha na kutaja kundi jingine la kikabila.
- source_word: בִּנְיָמִן
  choice: Benyamini
  rationale: Jina la kabila limetolewa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
- source_word: גִּבּוֹר חַיִל
  choice: shujaa hodari
  rationale: Kirai hiki humaanisha mpiganaji mwenye nguvu na ushujaa; tafsiri hii ni ya asili, yenye heshima, na huhifadhi maana ya kijeshi.
- source_word: אֶלְיָדָע
  choice: Eliada
  rationale: Jina la mtu limenukuliwa kwa mwandiko unaofaa Kiswahili badala ya kutafsiriwa.
- source_word: וְעִמּוֹ
  choice: na pamoja naye
  rationale: Huhifadhi kiunganishi na muundo wa orodha unaomtaja kiongozi kisha askari walio chini yake.
- source_word: נֹשְׁקֵי קֶשֶׁת וּמָגֵן
  choice: wenye pinde na ngao
  rationale: Kitenzi-shirikishi נשק hapa huonyesha watu walio na silaha au walioandaliwa kwa silaha hizo; 'wenye' ni ya kawaida kwa Kiswahili na majina ya wingi yanaafikiana na kundi la watu.
- source_word: מָאתַיִם אָלֶף
  choice: laki mbili
  rationale: Hii ndiyo namna ya kawaida na wazi ya kusema watu mia mbili elfu katika Kiswahili.
