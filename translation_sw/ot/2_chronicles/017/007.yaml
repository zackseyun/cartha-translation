source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֨ת שָׁל֜וֹשׁ לְ/מָלְכ֗/וֹ שָׁלַ֤ח לְ/שָׂרָי/ו֙ לְ/בֶן חַ֨יִל֙ וּ/לְ/עֹבַדְיָ֣ה וְ/לִ/זְכַרְיָ֔ה וְ/לִ/נְתַנְאֵ֖ל וּ/לְ/מִיכָיָ֑הוּ לְ/לַמֵּ֖ד בְּ/עָרֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: sw
  text: Katika mwaka wa tatu wa utawala wake, aliwatuma maofisa wake[a]—Ben-Haili, Obadia, Zekaria, Nethaneli na Mikaya—wafundishe katika miji ya Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wake” au “viongozi wake”; neno la Kiebrania linaweza kumaanisha maofisa wa kifalme au wa utawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ
  choice: Katika mwaka wa tatu
  rationale: Hutoa kwa Kiswahili cha kawaida taarifa ya wakati katika mfululizo wa simulizi; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: לְמָלְכוֹ
  choice: wa utawala wake
  rationale: Hurejelea kipindi cha yeye kutawala akiwa mfalme; ‘utawala wake’ ni usemi wa asili na unaoeleweka katika Kiswahili.
- source_word: שָׁלַח
  choice: aliwatuma
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kutuma; kiambishi ‘-wa-’ kinawarejelea watu waliotajwa.
- source_word: לְשָׂרָיו
  choice: maofisa wake
  rationale: Neno שַׂר linaweza kumaanisha mkuu, kiongozi, au ofisa. Katika muktadha wa wajumbe wa kifalme waliopewa kazi, ‘maofisa’ linaeleza wajibu wao bila kudokeza kwamba walikuwa wana wa kifalme.
- source_word: לְבֶן חַיִל
  choice: Ben-Haili
  rationale: Ni jina la mtu, kwa hiyo limetoholewa badala ya kutafsiriwa.
- source_word: וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: Obadia, Zekaria, Nethaneli na Mikaya
  rationale: Majina ya watu yametoholewa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili huku yakifuata maumbo ya Kiebrania.
- source_word: לְלַמֵּד
  choice: wafundishe
  rationale: Hii ni hali ya kusababisha ya למד, yenye maana ya ‘kufundisha’; muundo wa kusudi ‘wafundishe’ ni wa asili baada ya ‘aliwatuma’.
- source_word: בְּעָרֵי יְהוּדָה
  choice: katika miji ya Yuda
  rationale: Kihusishi kinaonyesha mahali; tafsiri hii inadumisha maana ya wazi bila kuongeza wazo la ‘kotekote’ ambalo linaweza kudokezwa lakini halijasemwa moja kwa moja.
theological_decisions: []
