base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: sw
  text: 'Na hii ndiyo hesabu yao, kwa nyumba za baba zao: kwa Yuda, wakuu wa maelfu: Adna, mkuu, na pamoja naye mashujaa hodari mia tatu elfu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maandikisho yao” au “mpangilio wao wa waliohesabiwa.” Neno la Kiebrania laweza kurejelea hesabu, uandikishaji wa kijeshi, au mpangilio unaotokana na uandikishaji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: walioandikishwa
  rationale: Katika muktadha huu wa kijeshi, neno linaonyesha watu waliohesabiwa na kuandikishwa kwa ajili ya jeshi; uchaguzi huu ni wa kawaida katika Kiswahili na unaendana na orodha ya makamanda na idadi za askari inayofuata.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: kwa jamaa za baba zao
  rationale: Kirai hiki cha kiutawala na ukoo kinaonyesha mpangilio kulingana na koo za upande wa baba; 'jamaa za baba zao' ni wazi na cha heshima katika Kiswahili cha sasa.
- source_word: לִיהוּדָה
  choice: kwa Yuda
  rationale: Kinaitambulisha Yuda kama kundi ambalo makamanda na askari wanaofuata wanahusishwa nalo.
- source_word: שָׂרֵי אֲלָפִים
  choice: makamanda wa maelfu
  rationale: Ni cheo cha kijeshi cha viongozi wa vikosi vinavyohesabiwa kwa maelfu; 'makamanda' ni neno la sasa na linaloeleweka.
- source_word: עַדְנָה הַשָּׂר
  choice: Adna, kamanda
  rationale: Cheo kimetolewa kwa uwazi bila kuongeza kwamba alikuwa mkuu kuliko makamanda wengine, jambo ambalo Kiebrania hakilisemi moja kwa moja hapa.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Kirai hiki cha kijeshi kinamaanisha wapiganaji wenye nguvu, uwezo, na ushujaa; 'mashujaa hodari' kinatoa maana hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: mia tatu elfu
  rationale: Ni tafsiri ya moja kwa moja ya idadi 300,000.
