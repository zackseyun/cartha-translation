  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּגְבַּ֥הּ לִבּ֖/וֹ בְּ/דַרְכֵ֣י יְהוָ֑ה וְ/ע֗וֹד הֵסִ֛יר אֶת הַ/בָּמ֥וֹת וְ/אֶת הָ/אֲשֵׁרִ֖ים מִ/יהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: sw
  text: Moyo wake ukainuka katika njia za Yahwe[a]; tena akaondoa mahali pa juu na nguzo za Ashera[b] kutoka Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wake ukapata ujasiri katika njia za Yahwe.” Nahau ya Kiebrania inaweza kumaanisha moyo kuinuliwa au kutiwa ujasiri; katika muktadha huu maana yake ni chanya, si kiburi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Asherimu” au “vigingi vitakatifu.” Neno la Kiebrania linamaanisha vitu vya ibada vilivyohusishwa na ibada ya Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: Moyo wake ukainuka
  rationale: Huhifadhi sitiari ya Kiebrania ya moyo kuwa juu, huku muktadha wa kufuata njia za Yahwe ukionyesha kuwa hapa si lazima iwe kiburi.
- source_word: בְּדַרְכֵי יְהוָה
  choice: katika njia za Yahwe
  rationale: Huhifadhi nahau ya mwenendo wa maisha na jina binafsi la Mungu lililo katika matini ya Kiebrania.
- source_word: וְעוֹד
  choice: tena
  rationale: Neno hili linaonyesha tendo jingine la ziada na linasomeka kwa kawaida katika Kiswahili.
- source_word: הֵסִיר
  choice: akaondoa
  rationale: Huwakilisha moja kwa moja kausativi ya kitenzi סור bila kuzidisha maana kuwa aliangamiza kabisa.
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: Ni istilahi ya kawaida kwa maeneo yaliyotumiwa kwa ibada; inadumisha taswira ya neno la Kiebrania bila maelezo marefu ndani ya mstari.
- source_word: הָאֲשֵׁרִים
  choice: nguzo za Ashera
  rationale: Huwaelekeza wasomaji kwenye vitu vya ibada vilivyohusishwa na Ashera, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu umbo lake hasa.
- source_word: מִיהוּדָה
  choice: kutoka Yuda
  rationale: Hutoa kwa kawaida wazo la kuviondoa vitu hivyo katika eneo la Yuda.
theological_decisions:
- issue: Iwapo kuinuka kwa moyo kunaonyesha kiburi au ujasiri wa kujitoa kwa Mungu
  choice: Kuhifadhi sitiari ya ‘moyo ukainuka’ katika muktadha chanya
  alternative: Moyo wake ukapata ujasiri / moyo wake ukawa na kiburi
  rationale: Kirai chenyewe kinaweza kuwa na wigo wa kuinuliwa au kutiwa ujasiri, lakini ‘katika njia za Yahwe’ na tendo linalofuata vinauelekeza muktadha kuwa chanya. Tafsiri kuu haibadili sitiari kuwa ufafanuzi mmoja tu.
- issue: Utambulisho na umbo la אֲשֵׁרִים
  choice: nguzo za Ashera
  alternative: Asherimu / miti au vigingi vitakatifu
  rationale: Neno hilo linahusu vitu vya ibada vinavyohusishwa na Ashera, lakini umbo lake halijabainishwa kikamilifu; tanbihi inaweka wazi kutokuwa na uhakika huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sitiari ya Kiebrania imehifadhiwa katika sentensi kuu, na ufafanuzi umetolewa katika tanbihi.
