reference: 2 Chronicles 17:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: sw
  text: Kwa hiyo, Yahwe akauimarisha ufalme mikononi mwake, na Yuda yote ikampa Yehoshafati ushuru[a]. Akawa na utajiri na heshima nyingi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi,” “tunu,” au “sadaka.” Neno la Kiebrania minḥah lina maana hizo pia; hapa muktadha wa kifalme unaunga mkono “ushuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: akauimarisha
  rationale: Kitenzi כון katika Hiphil humaanisha kuufanya kitu kiwe imara au kukithibitisha. “Akauimarisha” kinaonyesha Yahwe aliufanya ufalme wa Yehoshafati kuwa thabiti bila kudokeza nguvu za kijeshi pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: הַמַּמְלָכָה בְּיָדוֹ
  choice: ufalme mikononi mwake
  rationale: “Ufalme” linaweza kutaja eneo la kifalme pamoja na mamlaka ya kutawala. Nahau ya Kiebrania “mkononi mwake” imehifadhiwa kwa umbo la kawaida la Kiswahili “mikononi mwake,” linalomaanisha chini ya mamlaka yake.
- source_word: וַיִּתְּנוּ כָל יְהוּדָה
  choice: Yuda yote ikampa
  rationale: Yuda imetumiwa kwa maana ya jumla kuwataja watu wote wa ufalme; kwa hiyo umoja wa kisarufi “ikampa” unafaa katika Kiswahili.
- source_word: מִנְחָה
  choice: ushuru
  rationale: Neno hili linaweza kumaanisha zawadi, tunu au sadaka, lakini katika muktadha wa watu kumpa mfalme mali baada ya ufalme wake kuimarishwa, “ushuru” linafaa zaidi.
- source_word: לִיהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina la Kiebrania limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: וַיְהִי לוֹ עֹשֶׁר וְכָבוֹד לָרֹב
  choice: Akawa na utajiri na heshima nyingi sana
  rationale: Nahau ya umilikaji וַיְהִי לוֹ imetafsiriwa kiasili kama “akawa na.” עֹשֶׁר ni utajiri, כָבוֹד katika muktadha huu ni heshima au hadhi, na לָרֹב huonyesha wingi mkubwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitohowa kama “Yahwe” hulihifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Maana ya כָבוֹד kwa mfalme
  choice: heshima
  alternative: utukufu
  rationale: Katika muktadha wa utajiri na hadhi ya kifalme, “heshima” linaonyesha cheo na kuthaminiwa kwa Yehoshafati bila kulifanya neno hili limaanishe kwa lazima utukufu wa kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Taswira ya ufalme kuwa “mikononi mwake” imehifadhiwa kwa kuwa ni nahau inayoeleweka katika Kiswahili. Alama ya tanbihi imewekwa baada ya “ushuru,” neno linalohusika na tanbihi.
