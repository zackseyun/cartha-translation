lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Kando yake
  rationale: Nahau hii kwa maana halisi ni ‘kwenye mkono wake’ na inaweza kuonyesha kuwa karibu naye au chini ya uongozi wake. ‘Kando yake’ huhifadhi maana ya uhusiano na nafasi bila kuamua kwa lazima cheo cha kijeshi.
- source_word: יְהוֹזָבָד
  choice: Yehozabadi
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili, huku konsonanti na mpangilio wa jina la Kiebrania vikihifadhiwa kwa kadiri inayowezekana.
- source_word: וְעִמּוֹ
  choice: na pamoja naye walikuwa
  rationale: Kihusishi kinaonyesha kuandamana au kushirikiana; ‘walikuwa’ imeongezwa ili sentensi iwe kamili na ya kawaida katika Kiswahili.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 180,000
  rationale: Namba imetolewa kwa tarakimu ili iwe rahisi kusoma katika orodha hii ya kijeshi.
- source_word: חֲלוּצֵי צָבָא
  choice: watu ... waliojiandaa kwa vita
  rationale: Kirai kinaeleza watu waliowekwa tayari au kuandaliwa kwa huduma ya kijeshi. Tafsiri hii ni ya asili katika Kiswahili na haibani maana iwe tu kubeba silaha.
