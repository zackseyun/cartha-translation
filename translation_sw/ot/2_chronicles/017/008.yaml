base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: sw
  text: 'Pamoja nao walikuwapo Walawi: Shemaya, Nethania, Zebadia, Asaheli, Shemiramothi, Yehonathani[a], Adonia, Tobia[b], na Tob-adonia[c]. Pamoja nao walikuwapo Elishama na Yehoramu, makuhani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umbo refu la jina, “Yehonathani”; tafsiri nyingine hutumia umbo fupi “Yonathani.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina umbo kamili “Tobiyahu”; “Tobia” ni umbo la kawaida la Kiswahili.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kina maneno “Tob Adonia,” ambayo huenda yakawa jina moja ambatani; tafsiri nyingine huyaandika kwa namna tofauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Pamoja nao walikuwapo
  rationale: Kirai hiki kinaonyesha watu walioandamana na kundi lililotajwa awali. Kitenzi “walikuwapo” kimeongezwa ili sentensi iwe ya kawaida na wazi katika Kiswahili.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Neno hili linawatambulisha wazi washiriki wa kundi la Kilawi.
- source_word: שְׁמַעְיָהוּ וּנְתַנְיָהוּ וּזְבַדְיָהוּ וַעֲשָׂהאֵל וְשְׁמִירָמוֹת
  choice: Shemaya, Nethania, Zebadia, Asaheli, Shemiramothi
  rationale: Majina yamenukuliwa kwa maumbo yanayoeleweka na yanayotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: יְהוֹנָתָן
  choice: Yehonathani
  rationale: Umbo hili linaakisi jina refu la Kiebrania lililo katika maandishi, badala ya kulifupisha kuwa Yonathani.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Hili ni umbo la kawaida la Kiswahili la jina hili la Kiebrania.
- source_word: טוֹבִיָּהוּ
  choice: Tobia
  rationale: Hili ni umbo la kawaida na linalotambulika kwa urahisi katika Kiswahili, ingawa Kiebrania kina kiambishi kamili cha kitheofori -yahu.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: Tob-adonia
  rationale: Ingawa maandishi ya Kimasora yana vipashio viwili, vinaelekea kutumika kama jina moja ambatani; kistari kinaonyesha yote mawili bila kuyachanganya na watu wawili.
- source_word: אֱלִישָׁמָע וִיהוֹרָם הַכֹּהֲנִים
  choice: Elishama na Yehoramu, ambao walikuwa makuhani
  rationale: Muundo huu unaweka wazi kwamba Elishama na Yehoramu ndio wanaotambulishwa kuwa makuhani.
theological_decisions:
- issue: Tofauti kati ya Walawi na makuhani
  choice: Orodha ya kwanza imetambulishwa kuwa ya Walawi, kisha Elishama na Yehoramu wametambulishwa tofauti kuwa makuhani.
  alternative: Kuwahesabu watu wote waliotajwa kuwa Walawi bila kulitenga kundi la mwisho la makuhani.
  rationale: Sintaksia ya Kiebrania inarudia “pamoja nao” kabla ya Elishama na Yehoramu na kisha kuwaita “makuhani”; hivyo tofauti ya makundi hayo mawili imehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Hawa” na “pia” vinasaidia mtiririko wa orodha bila kubadili uhusiano wa makundi katika Kiebrania. Alama zote za tanbihi zimewekwa baada ya majina yanayohusika, zikisahihisha kutolingana kwa alama katika safu ya ushauri ya Kiingereza.
