  text: וַ/יִּ֨תֶּן חַ֔יִל בְּ/כָל עָרֵ֥י יְהוּדָ֖ה הַ/בְּצֻר֑וֹת וַ/יִּתֵּ֤ן נְצִיבִים֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/עָרֵ֣י אֶפְרַ֔יִם אֲשֶׁ֥ר לָכַ֖ד אָסָ֥א אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: sw
  text: Akaweka majeshi katika miji yote ya Yuda yenye ngome, na akaweka vikosi vya ulinzi[a] katika nchi ya Yuda na katika miji ya Efraimu ambayo Asa, baba yake, alikuwa ameiteka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafisa waliowekwa,” “manaibu,” au “watawala.” Neno la Kiebrania נְצִיבִים linaweza kumaanisha maafisa walioteuliwa au vikosi/vituo vya kijeshi; muktadha wa kijeshi hapa unapendelea “vikosi vya ulinzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: akaweka majeshi
  rationale: Kitenzi נתן kina maana ya kuweka, na חַיִל katika muktadha wa miji yenye ngome humaanisha nguvu za kijeshi. “Akaweka majeshi” ni ya kawaida na inadumisha maana ya kuwapeleka wanajeshi katika vituo hivyo.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: katika miji yote ya Yuda yenye ngome
  rationale: Tafsiri hii inaonyesha wazi kwamba miji yenyewe ilikuwa imeimarishwa kwa ngome, huku ikihifadhi wingi na ujumla wa כָל.
- source_word: נְצִיבִים
  choice: vikosi vya ulinzi
  rationale: Neno hili linaweza kumaanisha maafisa waliowekwa rasmi au vituo/vikosi vya kijeshi. Muktadha wa majeshi, miji yenye ngome, na maeneo yaliyotekwa unapendelea maana ya kijeshi, lakini tanbihi inadumisha uwezekano wa maana ya kiutawala.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: katika nchi ya Yuda
  rationale: Neno אֶרֶץ linarejelea eneo lote la Yuda, si miji pekee; “nchi ya Yuda” hudumisha upana huo.
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: na katika miji ya Efraimu
  rationale: Hii inadumisha rejeleo la moja kwa moja la eneo la kikabila na kijiografia.
- source_word: אֲשֶׁר לָכַד
  choice: ambayo ... alikuwa ameiteka
  rationale: לכד hutumiwa kwa kuteka miji au maeneo. Wakati timilifu “alikuwa ameiteka” unaonyesha kuwa Asa aliiteka kabla ya hatua za Yehoshafati zinazosimuliwa hapa.
- source_word: אָסָא אָבִיו
  choice: Asa, baba yake
  rationale: Muundo huu unamtambulisha Asa kuwa baba ya mhusika mkuu; koma hufanya ufafanuzi huo usomeke kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. “Miji ... yenye ngome” na “vikosi vya ulinzi” ni maneno ya sasa yanayoeleweka bila kupoteza muktadha wa kijeshi. Kiashiria cha tanbihi kimewekwa moja kwa moja baada ya neno linalofafanuliwa.
