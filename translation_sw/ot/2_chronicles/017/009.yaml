base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: sw
  text: Walifundisha katika Yuda, na Kitabu cha Sheria ya Yahweh kilikuwa pamoja nao.[a] Wakazunguka katika miji yote ya Yuda na kufundisha miongoni mwa watu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hati-kunjo ya Sheria ya Yahweh.” Neno la Kiebrania linalotafsiriwa “Kitabu” linaweza kumaanisha maandishi katika umbo la hati-kunjo; “Sheria” pia linaweza kutafsiriwa “Mafundisho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na kuwafundisha watu.” Kiebrania kinasema kwa maana ya karibu zaidi, “kufundisha miongoni mwa watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: Walifundisha
  rationale: Piel ya למד humaanisha kufundisha; kitenzi hiki cha kawaida kinafaa katika sehemu zote mbili za aya.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Kihusishi בְּ hapa kinaonyesha mahali; wazo la kuenea maeneo mbalimbali linaelezwa baadaye kwa kutaja miji yote.
- source_word: וְעִמָּהֶם סֵפֶר
  choice: nao walikuwa na Kitabu
  rationale: Kifungu kisicho na kitenzi kinasema kihalisi kwamba kitabu kilikuwa pamoja nao. Muundo huu wa Kiswahili ni wa kawaida na unahifadhi uhusiano wa kuandamana.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: Kitabu cha Sheria ya Yahweh
  rationale: סֵפֶר ni maandishi yaliyokusanywa, kihistoria yakiwa pia hati-kunjo; תּוֹרָה katika muungano huu linarejelea sheria au mafundisho ya agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: וַיָּסֹבּוּ
  choice: Walizunguka
  rationale: סבב hapa inaonyesha kwenda sehemu mbalimbali kwa mzunguko.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: katika miji yote ya Yuda
  rationale: Pamoja na kitenzi cha mwendo, usemi huu unaonyesha kwamba walipitia miji yote; 'katika' ni Kiswahili cha kawaida kisicholazimisha picha ya kupenya ndani ya kila mji.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: na kufundisha miongoni mwa watu
  rationale: Kihusishi בְּ kimehifadhiwa kwa 'miongoni mwa,' kikionyesha mahali shughuli ya kufundisha ilipofanyika bila kukibadili kimya kimya kuwa kiambwa cha moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה; 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תּוֹרָה katika סֵפֶר תּוֹרַת יְהוָה
  choice: Sheria
  alternative: Mafundisho
  rationale: Katika muktadha huu, neno linaashiria mkusanyo wa sheria ya agano, ingawa maana pana ya 'mafundisho' inabaki kuwa uwezekano wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umefuatwa kwa ukaribu bila kuzalisha uradidi usio wa kawaida katika Kiswahili.
