  text: וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּ֑י/ו וַ/יִּתְחַזֵּ֖ק עַל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: sw
  text: Yehoshafati mwanawe akawa mfalme mahali pake, naye akajiimarisha dhidi ya Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Kitenzi hiki humaanisha kuanza au kuwa na utawala wa kifalme; ‘akawa mfalme’ ni Kiswahili cha kawaida na sahihi katika muktadha.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Nahau ya Kiebrania inaonyesha Yehoshafati alimrithi mtangulizi wake katika ufalme.
- source_word: וַיִּתְחַזֵּק
  choice: akajiimarisha
  rationale: Muundo wa kujirejelea unaonyesha alijifanya kuwa imara, yaani aliimarisha nafasi na uwezo wake.
- source_word: עַל יִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Katika muktadha wa mgawanyiko wa falme na hatua za ulinzi zinazofuata, עַל ina maana ya kuelekezwa dhidi ya Israeli, si kutawala juu yake.
theological_decisions:
- issue: Uhusiano wa Yehoshafati na Israeli katika kishazi cha mwisho
  choice: dhidi ya Israeli
  alternative: juu ya Israeli
  rationale: Ingawa עַל inaweza kumaanisha ‘juu ya,’ Yehoshafati alikuwa mfalme wa Yuda, si wa Israeli; muktadha unaofuata wa kuweka majeshi katika miji yenye ngome unaunga mkono maana ya kujilinda dhidi ya ufalme wa kaskazini.
translation_notes:
  register: Lugha ya kawaida, yenye heshima na iliyo wazi kwa wasomaji wa Kiswahili cha Afrika Mashariki. Jina ‘Yehoshafati’ limetumiwa kwa umbo linalotambulika katika mapokeo ya Biblia ya Kiswahili.
