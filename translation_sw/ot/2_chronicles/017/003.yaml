base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: sw
  text: Yahwe alikuwa pamoja na Yehoshafati, kwa sababu alifuata njia za awali za Daudi, baba yake,[a] wala hakuwatafuta Mabaali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia za kwanza za Daudi, baba yake.” Neno la Kiebrania linaonyesha mwenendo wa Daudi wa awali, huenda likiutofautisha na makosa yake ya baadaye. Hapa “baba” humaanisha mtangulizi katika nasaba ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu katika Tetragramatoni badala ya kulibadili kuwa cheo.
- source_word: וַיְהִי ... עִם
  choice: alikuwa pamoja na
  rationale: Ni Kiswahili cha kawaida kinachowasilisha uwepo na msaada wa Yahwe kwa Yehoshafati.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki hapa kinaeleza sababu ya Yahwe kuwa pamoja na Yehoshafati.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: alifuata njia
  rationale: Kiswahili hiki cha asili kinatunza taswira ya mwenendo bila ukakasi wa kusema ‘alitembea katika njia.’
- source_word: דָּוִיד אָבִיו
  choice: Daudi, baba yake
  rationale: Neno ‘baba’ linadumisha lugha ya nasaba ya Kiebrania; katika muktadha huu Daudi ni babu wa kifalme, si baba mzazi wa Yehoshafati.
- source_word: הָרִאשֹׁנִים
  choice: za awali
  rationale: Linaonyesha mwenendo wa Daudi wa kipindi cha mapema na kudumisha tofauti inayodokezwa na matendo yake ya baadaye.
- source_word: דָרַשׁ
  choice: kuwatafuta
  rationale: Linahifadhi upana wa kitenzi cha Kiebrania, ambacho katika muktadha wa kidini kinaweza kumaanisha kutafuta msaada, maelekezo, au ibada kwa mungu.
- source_word: לַבְּעָלִים
  choice: Mabaali
  rationale: Linadumisha wingi ulio wazi katika Kiebrania na kurejelea maumbo au madhehebu mbalimbali ya Baali.
theological_decisions:
- issue: Daudi kutajwa kuwa kielelezo licha ya makosa yake ya baadaye
  choice: njia za awali za Daudi
  alternative: njia za kwanza za Daudi
  rationale: 'Tafsiri inadumisha kikomo cha הָרִאשֹׁנִים: Yehoshafati analinganishwa na mwenendo wa Daudi wa awali, bila kudai kwamba matendo yake yote yalikuwa ya kuigwa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Alifuata njia’ ni ya kawaida zaidi kuliko tafsiri sisisi ‘alitembea katika njia.’ Jina Yehoshafati limetumiwa kwa umbo lililozoeleka katika Biblia za Kiswahili; ‘Mabaali’ linatunza wingi wa chanzo.
