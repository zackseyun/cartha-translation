  yaml_path: translation/ot/2_chronicles/017/015.yaml
  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: sw
  text: Chini ya amri yake alikuwa Yehohanani, jemadari;[a] pamoja naye walikuwa askari 280,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kando yake” au “chini ya mamlaka yake.” Nahau ya Kiebrania kihalisi inasema “juu ya mkono wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Chini ya uongozi wake
  rationale: Nahau ya Kiebrania, ambayo kihalisi ni ‘juu ya mkono wake,’ katika orodha hii ya kijeshi inaonyesha kuwa mtu alikuwa chini ya mamlaka au uongozi wa mwingine.
- source_word: יְהוֹחָנָן
  choice: Yehohanani
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na kanuni za tahajia na matamshi ya Kiswahili.
- source_word: הַשַּׂר
  choice: jemadari
  rationale: Neno שַׂר linaweza kumaanisha mkuu, afisa, au kamanda; katika muktadha huu wa kijeshi, ‘jemadari’ linaeleza kazi yake kwa kawaida.
- source_word: וְעִמּוֹ
  choice: naye alikuwa na askari
  rationale: Kihalisi ni ‘na pamoja naye’; kutaja ‘askari’ kunafanya dhana iliyodokezwa na orodha ya kijeshi iwe wazi katika Kiswahili bila kubadili idadi.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 280,000
  rationale: Hii inawakilisha moja kwa moja idadi ya laki mbili na themanini elfu kwa namna iliyo wazi na rahisi kusoma.
