id: 2CH.17.16
reference: 2 Chronicles 17:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: sw
  text: Chini ya amri yake alikuwa Amasia mwana wa Zikri, aliyejitoa kwa hiari kwa Yahweh[a]. Pamoja naye walikuwa mashujaa hodari 200,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyejitoa kwa hiari kwa ajili ya Yahweh.” Kauli ya Kiebrania inasisitiza kujitoa kwa hiari, na inaweza kumaanisha kujitoa kwa Yahweh au kwa ajili yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Chini ya amri yake
  rationale: Nahau hii katika orodha ya kijeshi inaonyesha kuwa mtu yuko chini ya mamlaka ya mwingine; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: עֲמַסְיָה בֶן זִכְרִי
  choice: Amasia mwana wa Zikri
  rationale: Majina yametoholewa kwa Kiswahili, na neno בֶן limehifadhiwa kwa uhusiano wa ukoo kwa kutumia ‘mwana wa’.
- source_word: הַמִּתְנַדֵּב
  choice: aliyejitoa kwa hiari
  rationale: Kauli ya Kiebrania inaonyesha tendo la hiari la mtu kujitoa mwenyewe; ‘aliyejitoa kwa hiari’ huhifadhi maana hiyo ya kujitolea binafsi.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kihusishi ל kinaweza kuonyesha mwelekeo wa kujitoa kwa Yahweh au kujitoa kwa ajili yake; ‘kwa Yahweh’ huhifadhi ufupi na kiasi cha uwazi wa maana ya asili.
- source_word: וְעִמּוֹ
  choice: Pamoja naye walikuwa
  rationale: Kirai hiki kinawatambulisha wanajeshi waliokuwa chini ya Amasia; kitenzi ‘walikuwa’ kimeongezwa ili sentensi iwe ya kawaida katika Kiswahili.
- source_word: מָאתַיִם אֶלֶף
  choice: 200,000
  rationale: Hii ndiyo thamani ya moja kwa moja ya idadi ya Kiebrania, yaani laki mbili.
- source_word: גִּבּוֹר חָיִל
  choice: mashujaa hodari
  rationale: Kirai hiki cha kijeshi huonyesha wapiganaji wenye nguvu, uwezo na ushujaa; ‘mashujaa hodari’ ni cha asili na chenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kujitoa kwa לַיהוָה
  choice: aliyejitoa kwa hiari kwa Yahweh
  alternative: aliyejitoa kwa hiari kwa ajili ya Yahweh
  rationale: Kihusishi ל kinaweza kueleweka kama kujielekeza na kujiweka wakfu kwa Yahweh au kama kutenda kwa ajili yake. Maandishi makuu yanahifadhi wazo la kujitoa kwake, huku tanbihi ikitaja uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Muundo wa kijeshi umewekwa wazi bila kupoteza ufupi wa mstari wa Kiebrania.
