  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nimeweka “huko Yerusalemu kulikuwa na” ili sentensi isomeke kwa kawaida huku ikidumisha tofauti kati ya shughuli katika miji ya Yuda na askari waliokuwa Yerusalemu.
