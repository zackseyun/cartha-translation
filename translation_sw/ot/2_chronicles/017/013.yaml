  text: And he had much work in the cities of Judah, and men of war, mighty men of valor, in Jerusalem.
translation:
  language: sw
  text: Alikuwa na shughuli nyingi katika miji ya Yuda, na huko Yerusalemu kulikuwa na askari, mashujaa hodari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: shughuli nyingi
  rationale: Neno מְלָאכָה kwa kawaida humaanisha kazi au shughuli; hapa kauli pana “shughuli nyingi” inadumisha maana ya maandishi bila kuibadili kuwa “mali nyingi,” maana ambayo si ya moja kwa moja.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: askari
  rationale: Kirai hiki kihalisi ni “watu wa vita”; “askari” ni Kiswahili cha kawaida na cha wazi katika muktadha wa jeshi.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Huhifadhi wazo la wapiganaji mashujaa wenye uwezo na ushujaa, bila kulazimisha maana finyu ya “utajiri” au cheo maalumu.
- source_word: הָיָה לוֹ ... בְּעָרֵי יְהוּדָה
  choice: Alikuwa na ... katika miji ya Yuda
  rationale: Muundo huu unafuata kwa karibu kauli ya Kiebrania ya kuwa na shughuli katika miji hiyo.
