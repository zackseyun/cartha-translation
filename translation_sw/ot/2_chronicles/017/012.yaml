base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: sw
  text: Yehoshafati akaendelea kuwa mkuu zaidi na zaidi, naye akajenga ngome[a] na miji ya kuhifadhia akiba[b] katika Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ngome kuu.” Neno la Kiebrania linamaanisha maeneo yaliyoimarishwa kwa ulinzi.
    reason: lexical_alternative
  - marker: b
    text: Au “miji ya maghala” au “miji ya ugavi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: akaendelea kuwa mkuu zaidi na zaidi
  rationale: Muundo huu wa Kiebrania unaonyesha ongezeko linaloendelea na lililofikia kiwango cha juu. Kiswahili hiki ni cha kawaida na kinahifadhi wazo la kuendelea kuongezeka katika ukuu bila kutafsiri kihalisi nahau ya ‘kwenda na kukua kuelekea juu.’
- source_word: וַיִּבֶן
  choice: akajenga
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi בנה katika simulizi.
- source_word: בִּירָנִיּוֹת
  choice: ngome
  rationale: Neno hilo linamaanisha maeneo au majengo yenye ulinzi imara. ‘Ngome’ ni neno la sasa na linaloeleweka, bila taswira ya majumba ya kifalme ya Ulaya inayoweza kuletwa na ‘kasri.’
- source_word: עָרֵי מִסְכְּנוֹת
  choice: miji ya kuhifadhia akiba
  rationale: Kirai hiki kinataja miji iliyotumiwa kuhifadhi vyakula, vifaa, au mahitaji mengine. Tafsiri hii inaeleza kazi ya miji hiyo kwa Kiswahili cha kawaida huku ikiacha aina ya akiba ikiwa wazi.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Kirai cha mahali kinachoonyesha eneo ambako ujenzi ulifanyika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Jina ‘Yehoshafati’ linafuata umbo linalotambulika katika matumizi ya Biblia ya Kiswahili. Muundo ‘akaendelea kuwa mkuu zaidi na zaidi’ unatoa kwa ufasaha hali ya kuongezeka mfululizo iliyo katika Kiebrania.
