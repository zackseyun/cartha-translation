base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: sw
  text: Basi kukawa na furaha kubwa Yerusalemu, kwa maana tangu siku za Sulemani mwana wa Daudi, mfalme wa Israeli, halijawahi kuwapo jambo kama hilo Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: Basi kukawa na
  rationale: Muundo wa simulizi unaendeleza matukio na kuonyesha matokeo ya yaliyotangulia; “Basi kukawa na” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: furaha kubwa
  rationale: Huhifadhi moja kwa moja maana ya nomino na kivumishi, ikijumuisha hisia na shangwe ya jumuiya bila kuongeza wazo la sherehe lisilotajwa wazi.
- source_word: בִּירוּשָׁלָם
  choice: Yerusalemu
  rationale: Kwa jina la mji, Kiswahili hutumia jina bila kihusishi cha “katika”; maana ya mahali inaeleweka kwa kawaida.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha maelezo yanayofafanua ukubwa wa furaha iliyotajwa.
- source_word: מִימֵי
  choice: tangu siku za
  rationale: Hueleza kipindi kinachoanzia wakati wa zamani hadi tukio la sasa la simulizi.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Sulemani mwana wa Daudi
  rationale: Hutoa majina katika maumbo ya Kiswahili yaliyozoeleka na kuhifadhi uhusiano wa kifamilia wa muundo wa Kiebrania.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huhifadhi utambulisho wa Sulemani kwa cheo chake katika apposition ya asili.
- source_word: לֹא כָזֹאת
  choice: halijawahi kuwapo jambo kama hilo
  rationale: Kiebrania kina maana halisi ya “si kama hili,” huku tukio au jambo likidokezwa na muktadha. Kiswahili kinahitaji kulitamka kwa njia ya kawaida; “jambo” ni neno pana lisilobainisha zaidi ya asili.
- source_word: בִּירוּשָׁלָם
  choice: Yerusalemu
  rationale: Marudio yamehifadhiwa ili kudumisha msisitizo na uundaji wa kifasihi wa mstari wa Kiebrania.
