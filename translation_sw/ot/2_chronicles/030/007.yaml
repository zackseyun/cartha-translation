base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: sw
  text: Msiwe kama baba zenu na ndugu zenu, waliokosa uaminifu kwa Yahwe, Mungu wa baba zao; naye akawatia katika hali ya ukiwa[a], kama mnavyoona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo la kutisha” au “jambo la kushangaza.” Neno la Kiebrania linaweza kumaanisha ukiwa na pia kitu kinachowafanya watazamaji waogope au kushangaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: Msiwe
  rationale: אַל pamoja na kitenzi kisichotimilika hutoa katazo. “Msiwe” ni katazo la moja kwa moja na la kawaida kwa watu wengi.
- source_word: כַאֲבוֹתֵיכֶם
  choice: kama baba zenu
  rationale: אָבוֹת inaweza kumaanisha baba au mababu. “Baba zenu” inadumisha mwangwi wa usemi wa agano na hapa inahusu vizazi vilivyotangulia.
- source_word: וְכַאֲחֵיכֶם
  choice: na ndugu zenu
  rationale: אָח inaweza kumaanisha ndugu wa karibu au watu wa ukoo mmoja. “Ndugu zenu” huhifadhi lugha ya kifamilia na mshikamano wa watu wa agano.
- source_word: מָעֲלוּ בַּיהוָה
  choice: waliokosa uaminifu kwa Yahwe
  rationale: מעל katika muktadha wa agano humaanisha kuvunja uaminifu au kutenda kwa hiana dhidi ya Mungu. Usemi huu ni wa asili katika Kiswahili na unahifadhi maana ya uhusiano wa agano.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Tafsiri hii inadumisha muundo wa jina la agano na mwangwi wa “baba zenu” uliotangulia.
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  choice: naye akawatia katika hali ya ukiwa
  rationale: נתן pamoja na לְשַׁמָּה huonyesha kuwa Mungu aliwaweka katika hali ya uharibifu mkubwa. “Akawatia katika hali ya ukiwa” ni Kiswahili cha kawaida zaidi kuliko kuwafanya watu wenyewe waitwe “ukiwa,” huku tanbihi ikihifadhi maana nyingine ya neno hilo.
- source_word: כַאֲשֶׁר אַתֶּם רֹאִים
  choice: kama mnavyoona
  rationale: Usemi huu unaelekeza kwenye ushahidi ulio wazi mbele ya wasikilizaji; “kama mnavyoona” ni mfupi, wa moja kwa moja, na wa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה. “Yahwe” hulitambulisha kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya kukosa uaminifu na hukumu ya Mungu
  choice: naye akawatia
  alternative: hivyo akawatia
  rationale: וַ huendeleza mfululizo wa matukio. “Naye” huhifadhi uhusiano huo bila kuongeza wazi wazo la kusudi au matokeo kwa kutumia “hivyo.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida, huku lugha ya kifamilia na ya agano ikihifadhiwa.
