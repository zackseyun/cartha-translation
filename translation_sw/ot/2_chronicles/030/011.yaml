  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: sw
  text: Lakini baadhi ya wanaume kutoka Asheri, Manase na Zabuloni walijinyenyekeza, wakaja Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Katika muktadha huu neno linaonyesha tofauti na dhihaka na kukataliwa kulikotajwa katika mstari uliotangulia; “Lakini” ni kiunganishi cha kawaida na cha wazi katika Kiswahili.
- source_word: אֲנָשִׁים
  choice: baadhi ya wanaume
  rationale: Nomino ni ya kiume, wingi, na katika muktadha inarejelea kundi dogo lisilotajwa idadi yake kutoka makabila hayo.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: kutoka Asheri, Manase na Zabuloni
  rationale: Vihusishi vinaonyesha asili yao katika makabila au maeneo hayo; majina yametolewa kwa maumbo yanayotambulika katika Kiswahili.
- source_word: נִכְנְעוּ
  choice: walijinyenyekeza
  rationale: Nifali ya כנע hapa inaweza kueleza kujishusha au kunyenyekea; tendo linalofuata la kwenda Yerusalemu linaunga mkono maana ya hiari ya kujinyenyekeza.
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Umbo la simulizi linaendeleza mfuatano wa matendo; “wakaja” ni la asili katika Kiswahili na hudumisha mtazamo wa simulizi kuelekea Yerusalemu.
- source_word: לִירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Kitenzi “kuja” kinaweza kufuatwa moja kwa moja na mahali panapolengwa katika Kiswahili, hivyo maana elekezi ya kihusishi cha Kiebrania inabaki wazi bila kuongeza “hadi” au “kwenda.”
theological_decisions:
- issue: Ikiwa נִכְנְעוּ ina maana ya hali ya kutendwa au tendo la hiari
  choice: walijinyenyekeza
  alternative: walinyenyekezwa / wakawa wanyenyekevu
  rationale: Muktadha unawaonyesha wakijibu mwito kwa kuja Yerusalemu, kwa hiyo maana ya kujishusha kwa hiari ndiyo inayofaa zaidi, bila kudai zaidi kuhusu chanzo cha ndani cha mwitikio huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “walijinyenyekeza, wakaja” ni wa asili na huhifadhi mfuatano wa simulizi wa Kiebrania.
