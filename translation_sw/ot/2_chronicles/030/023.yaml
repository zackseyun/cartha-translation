  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Kiwakilishi “i-” kinarejelea sikukuu inayojulikana kutokana na muktadha, bila kuongeza nomino isiyosemwa wazi katika mstari huu.
