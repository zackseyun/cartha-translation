  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: sw
  text: Sasa msifanye shingo zenu kuwa ngumu kama baba zenu. Mpeni BWANA mkono[a], na mje patakatifu pake, ambacho amekiweka wakfu milele. Mtumikieni BWANA, Mungu wenu, ili hasira yake inayowaka iwaondokee[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Jisalimisheni kwa BWANA” au “Jitiisheni kwa BWANA.” Kiebrania kinasema moja kwa moja “mpeni BWANA mkono,” nahau inayoweza kuonyesha kujisalimisha, kujitiisha, au kutoa ahadi ya uaminifu.
    reason: lexical_alternative
  - marker: b
    text: Au “na hasira yake inayowaka itawaondokea.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Neno hili ni kielezi cha wakati kinachomaanisha “sasa”; limetafsiriwa wazi kwa kuwa lipo katika matini ya Kiebrania.
- source_word: תַּקְשׁוּ עָרְפְּכֶם
  choice: msifanye shingo zenu kuwa ngumu
  rationale: Hifadhi picha halisi ya Kiebrania ya kufanya shingo kuwa ngumu, inayomaanisha ukaidi na kukataa kutii.
- source_word: כַּאֲבוֹתֵיכֶם
  choice: kama baba zenu
  rationale: “Baba” ni ulinganifu wa moja kwa moja wa neno la Kiebrania na hapa hurejelea vizazi vilivyowatangulia.
- source_word: תְּנוּ יָד לַיהוָה
  choice: Mpeni BWANA mkono
  rationale: Hifadhi nahau ya Kiebrania yenye maana ya kujisalimisha, kujitiisha, au kutoa ahadi ya uaminifu; ufafanuzi umetolewa katika tanbihi.
- source_word: לַיהוָה / יְהוָה
  choice: BWANA
  rationale: Hili ndilo neno la kawaida na lenye heshima katika Biblia za Kiswahili kwa jina la agano יהוה.
- source_word: מִקְדָּשׁוֹ
  choice: mahali pake patakatifu
  rationale: Huonyesha sehemu iliyotengwa kuwa takatifu bila kulibana neno hilo limaanishe jengo pekee.
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: amepatenga kuwa patakatifu milele
  rationale: Huonyesha tendo la kuweka wakfu au kutenga kwa utakatifu, huku לְעוֹלָם ikitafsiriwa kwa maana yake ya moja kwa moja, “milele.”
- source_word: וְעִבְדוּ
  choice: Mtumikieni
  rationale: Kitenzi עבד kinapotumiwa kuhusu Mungu kinajumuisha huduma ya ibada, lakini “mtumikieni” huhifadhi upana wake wa kiagano.
- source_word: וְיָשֹׁב מִכֶּם
  choice: ili ... iwaondokee
  rationale: Katika mfuatano wa maagizo, umbo hili linaonyesha matokeo yanayokusudiwa au kutarajiwa badala ya utabiri usio na sharti.
- source_word: חֲרוֹן אַפּוֹ
  choice: hasira yake inayowaka
  rationale: Hifadhi taswira ya joto au kuwaka katika nahau ya Kiebrania inayomaanisha hasira kali.
theological_decisions:
- issue: Maana ya nahau תְּנוּ יָד לַיהוָה
  choice: Mpeni BWANA mkono
  alternative: Jisalimisheni kwa BWANA; Jitiisheni kwa BWANA
  rationale: Matini kuu inahifadhi picha muhimu ya lugha chanzi, huku tanbihi ikieleza maana zake zinazowezekana bila kuamua kimadhehebu.
- issue: Nguvu ya וְיָשֹׁב baada ya maagizo
  choice: ili hasira yake inayowaka iwaondokee
  alternative: na hasira yake inayowaka itawaondokea
  rationale: “Ili” pamoja na hali tegemezi huwasilisha matokeo yanayotarajiwa ya kuitikia mwito huu bila kulifanya kuwa ahadi ya kimitambo isiyo na sharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Taswira kuu za Kiebrania zimehifadhiwa pale zinapoweza kueleweka, huku nahau yenye uwezekano wa kutatanisha ikifafanuliwa katika tanbihi.
