base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: sw
  text: Kusanyiko lote la Yuda likafurahi, pamoja na makuhani na Walawi, kusanyiko lote lililokuwa limekuja kutoka Israeli, wageni wakazi[a] waliokuwa wamekuja kutoka nchi ya Israeli, na wale waliokuwa wakiishi katika Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wageni waliokuwa wakiishi miongoni mwa Waisraeli.” Neno la Kiebrania גֵּרִים linamaanisha watu wasio wenyeji waliokaa miongoni mwa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: likafurahi
  rationale: Kitenzi שׂמח humaanisha kuwa na furaha. “Likafurahi” ni Kiswahili cha kawaida na kinadumisha maana ya tendo bila kuongeza wazo mahsusi la kusherehekea.
- source_word: כָּל קְהַל יְהוּדָה
  choice: kusanyiko lote la Yuda
  rationale: קהל ni jamii iliyokusanyika. “Kusanyiko” linaonyesha mkutano wa watu bila kulipa neno maana maalumu ya kikanisa.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi la Walawi, ambao hapa wanatajwa tofauti na makuhani.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: kusanyiko lote lililokuwa limekuja kutoka Israeli
  rationale: Kirai elezi הַבָּאִים kinawatambulisha waliotoka Israeli. “Lililokuwa limekuja” linafuata mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: הַגֵּרִים
  choice: wageni wakazi
  rationale: גֵּרִים ni watu wasio wenyeji waliokaa miongoni mwa Israeli. “Wageni wakazi” linadumisha kwa ufupi hali yao kama wageni na pia kama wakaaji, huku ufafanuzi zaidi ukitolewa katika tanbihi.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: waliokuwa wamekuja kutoka nchi ya Israeli
  rationale: אֶרֶץ יִשְׂרָאֵל ni eneo la kijiografia, kwa hiyo “nchi ya Israeli” linafaa na linaitofautisha na Yuda.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: wale waliokuwa wakiishi Yuda
  rationale: Kitenzi kishirikishi cha ישׁב kinaonyesha kuishi au kukaa mahali. Tafsiri hii ni ya kawaida na inadumisha maana hiyo endelevu.
