translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘waliendelea kuwacheka na kuwadhihaki’ umechaguliwa kuhifadhi hali endelevu ya dharau, huku ‘lakini’ ikionyesha tofauti kati ya juhudi za wajumbe na mwitikio wa watu.
