base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: sw
  text: Basi wale wajumbe walikwenda kutoka mji mmoja hadi mwingine katika nchi ya Efraimu na Manase, mpaka Zabuloni; lakini watu walikuwa wakiwacheka na kuwadhihaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia vitenzi viwili vya dharau: watu walikuwa wakiwacheka wajumbe na kuwadhihaki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: wale wajumbe
  rationale: Neno hili, kutoka mzizi wenye maana ya ‘kukimbia,’ humaanisha watu waliotumwa kupeleka ujumbe kwa haraka. ‘Wajumbe’ ni Kiswahili cha kawaida na hudokeza jukumu lao rasmi bila kuwafanya waeleweke tu kama wakimbiaji.
- source_word: עֹבְרִים
  choice: walikwenda
  rationale: Kishiriki hiki kinaonyesha kusafiri au kupita katika maeneo mbalimbali. ‘Walikwenda’ ni cha asili katika simulizi la Kiswahili na, pamoja na ‘kutoka mji mmoja hadi mwingine,’ kinahifadhi wazo la mwendo wao.
- source_word: מֵעִיר לָעִיר
  choice: kutoka mji mmoja hadi mwingine
  rationale: Hii ni njia ya asili ya Kiswahili ya kuonyesha safari ya kurudiwa-rudiwa kutoka mji hadi mji.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: katika nchi ya Efraimu na Manase, mpaka Zabuloni
  rationale: Tafsiri hii inahifadhi eneo walilopitia na kikomo cha safari kinachoonyeshwa na וְעַד.
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: waliendelea kuwacheka
  rationale: Katika muktadha huu kitenzi kinaonyesha kicheko cha dharau, si furaha ya kawaida. ‘Waliendelea’ pia huonyesha hali endelevu ya muundo היה pamoja na kishiriki.
- source_word: וּמַלְעִגִים בָּם
  choice: kuwadhihaki
  rationale: Neno hili linaonyesha kejeli na dharau. ‘Kuwadhihaki’ huhifadhi uzito wake na linaenda sambamba na ‘kuwacheka’ bila kufuta tofauti ya vitenzi hivyo viwili.
