base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: sw
  text: Ndipo makuhani Walawi[a] wakasimama na kuwabariki watu. Sauti yao ikasikiwa,[b] na sala yao ikafika kwenye makao yake matakatifu, mbinguni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makuhani, Walawi.” Kiebrania kinaweza kusomwa kwa namna inayowatambulisha makuhani hao kuwa Walawi.
    reason: lexical_alternative
  - marker: b
    text: Au “sauti yao ikasikilizwa,” ikidokeza kuwa Mungu aliwasikia.
    reason: alternative_reading
  - marker: c
    text: Au “kwenye makao yake matakatifu, kwenye mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakasimama
  rationale: Kitenzi קום hapa kinaonyesha kuinuka au kusimama ili kutenda tendo linalofuata. “Wakasimama” ni Kiswahili cha kawaida na huhifadhi picha halisi ya tendo hilo.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani, yaani Walawi
  rationale: Nomino hizo zinaeleweka vizuri kama ufafanuzi wa kundi moja, si lazima kama makundi mawili. “Yaani” huonyesha uhusiano huo kwa uwazi katika Kiswahili cha sasa bila kupoteza uwezekano wa tafsiri nyingine.
- source_word: וַיְבָרֲכוּ
  choice: wakawabariki
  rationale: ברך hapa ni kutamka baraka juu ya watu. “Kuwabariki” ni tafsiri fupi, ya kawaida, na inayofaa muktadha wa ibada.
- source_word: הָעָם
  choice: watu
  rationale: עָם kwa kawaida humaanisha “watu.” Neno hili haliongezi maelezo yasiyotajwa kuhusu kusanyiko.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: Sauti yao ikasikiwa
  rationale: Muundo wa Kiebrania ni wa kutendwa na unaweka “sauti yao” kuwa jambo lililosikiwa. Tafsiri hii haiongezi wazi mtendaji ambaye hakutajwa katika kishazi.
- source_word: תְפִלָּתָם
  choice: sala yao
  rationale: Nomino ya umoja yenye kiambishi cha wingi inaeleweka kama sala ya pamoja ya makuhani hao. “Sala yao” ni ya kawaida na yenye heshima.
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: katika makao yake matakatifu
  rationale: מָעוֹן ni mahali pa kukaa au makao. “Makao yake matakatifu” huhifadhi taswira ya mahali patakatifu pa Mungu, huku “katika” ikitoa Kiswahili cha asili kwa mwisho unaotajwa.
- source_word: לַשָּׁמָיִם
  choice: mbinguni
  rationale: Kirai hiki kinafafanua mahali yalipo makao matakatifu. “Mbinguni” ni Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa kuelewa mwelekeo wa sala.
theological_decisions:
- issue: Kumtaja Mungu wazi kuwa ndiye aliyeisikia sauti
  choice: 'Kudumisha kauli ya kutendwa: “Sauti yao ikasikiwa.”'
  alternative: “Mungu akaisikia sauti yao” au “BWANA akaisikia sauti yao.”
  rationale: Muktadha unaashiria kuwa Mungu ndiye aliyesikia, lakini Kiebrania hakimtaji wazi katika kishazi hiki. Kauli ya kutendwa huhifadhi namna ya matini na haiongezi jina lisilotamkwa.
- issue: Uhusiano kati ya makuhani na Walawi
  choice: 'Kuutafsiri kama ufafanuzi: “makuhani, yaani Walawi.”'
  alternative: “makuhani Walawi” au “makuhani na Walawi.”
  rationale: Muundo wa Kiebrania huenda unawatambulisha makuhani hao kuwa Walawi. Ufafanuzi huo huepuka kuunda makundi mawili tofauti bila kiunganishi, huku tanbihi ikihifadhi tafsiri mbadala.
- issue: Uhusiano wa “makao yake matakatifu” na “mbinguni”
  choice: “katika makao yake matakatifu, mbinguni”
  alternative: “mpaka kwenye makao yake matakatifu, mpaka mbinguni”
  rationale: “Mbinguni” inaweza kufafanua mahali yalipo makao hayo, lakini marudio ya kihusishi cha Kiebrania yanaweza pia kusisitiza mwelekeo. Matini kuu ni ya asili kwa Kiswahili, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi inayofaa simulizi la ibada. Kauli ya kutendwa na ufafanuzi wa kiambatisho vimehifadhiwa ili kutoondoa utata halisi wa Kiebrania.
