base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: sw
  text: Hezekia akawatia moyo[a] Walawi wote waliokuwa na ufahamu mzuri wa mambo ya Yahwe[b]. Nao wakala wakati wa sikukuu hiyo kwa siku saba, wakitoa dhabihu za amani[c] na wakimshukuru[d] Yahwe, Mungu wa baba zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “akazungumza juu ya moyo wa Walawi wote”; nahau hiyo inaweza pia kumaanisha kusema nao kwa fadhili, kuwafariji, au kuwatia moyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliokuwa na ufahamu mzuri kuhusu Yahwe,” “waliokuwa stadi katika mambo ya Yahwe,” au, kulingana na muktadha, “waliokuwa na ufahamu mzuri katika kumtumikia Yahwe.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kina istilahi inayoweza pia kutafsiriwa “dhabihu za ushirika” au “dhabihu za ustawi.”
    reason: lexical_alternative
  - marker: d
    text: Kitenzi hiki kinaweza pia kumaanisha “kuungama” au “kusifu”; katika muktadha huu huenda kinamaanisha kutoa shukrani katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: akawatia moyo
  rationale: Nahau ya Kiebrania, kihalisi ‘alisema juu ya moyo,’ humaanisha kusema kwa namna ya kutia moyo au kuimarisha. ‘Akawatia moyo’ ni Kiswahili cha kawaida na huhifadhi maana ya nahau hiyo.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kikabila na la huduma ya ibada linalotajwa hapa.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב
  choice: walioonyesha ufahamu mzuri
  rationale: Muundo wenye kitenzi na nomino za mzizi mmoja שׂכל unasisitiza ufahamu, busara, au ustadi unaodhihirishwa. Tafsiri hii haibani maana iwe kufundisha tu au kuwa stadi tu.
- source_word: לַיהוָה
  choice: katika mambo ya Yahwe
  rationale: Kiambishi ל kinaonyesha uhusiano au mwelekeo kwa Yahwe. Kauli hii ya Kiswahili inahifadhi upana huo kuliko kuifanya huduma ya hekaluni kuwa maana pekee.
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד
  choice: wakala vyakula vya sikukuu
  rationale: Kitenzi ni ‘kula’ na מוֹעֵד ni wakati uliowekwa au sikukuu. Kiswahili hakiwezi kusema kwa kawaida ‘kula sikukuu’; ‘vyakula vya sikukuu’ huhifadhi tendo halisi la kula na uhusiano wake na sikukuu bila kugeuza kishazi kuwa ‘waliadhimisha’ tu.
- source_word: שִׁבְעַת הַיָּמִים
  choice: kwa siku saba
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha muda ulioendelea.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: wakitoa dhabihu za amani
  rationale: ‘Dhabihu za amani’ huhifadhi istilahi ya aina maalumu ya dhabihu, huku tanbihi ikitaja maana mbadala za ushirika na ustawi.
- source_word: וּמִתְוַדִּים
  choice: na kumshukuru
  rationale: Hitpaeli ya ידה inaweza kumaanisha kukiri, kushukuru, au kusifu. Katika mazingira haya ya sherehe na ibada, kushukuru inafaa, lakini utata wa kileksika umehifadhiwa katika tanbihi.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Tafsiri hii huhifadhi usemi wa agano unaorejelea baba zao bila kuubadilisha kimyakimya kuwa usemi mpana zaidi wa ‘mababu.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יהוה lenyewe. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya ufahamu wa Walawi ביחס לַיהוָה
  choice: katika mambo ya Yahwe
  alternative: katika kumtumikia Yahwe
  rationale: Muktadha wa ibada unaunga mkono wazo la huduma, lakini kihusishi ל hakitaji huduma waziwazi. Tafsiri kuu inaacha uhusiano huo ukiwa mpana, na tanbihi inaonyesha uwezekano wa huduma au ustadi.
- issue: Maana ya וּמִתְוַדִּים katika ibada
  choice: kumshukuru
  alternative: kuungama au kumsifu
  rationale: Mazingira ya sikukuu na dhabihu yanaelekeza kwenye shukrani, lakini kitenzi hicho kinaweza pia kueleza kuungama au kusifu; tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imetumia ‘wakala vyakula vya sikukuu’ ili kuepuka usemi usio wa kawaida ‘wakala sikukuu,’ huku ikidumisha wazi tendo la kula lililo katika Kiebrania. Viambishi vya tanbihi [a]–[d] vimewekwa mara moja kila kimoja katika mahali panapohusika.
