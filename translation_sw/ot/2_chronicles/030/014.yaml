base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: sw
  text: Wakasimama, wakaondoa madhabahu zilizokuwa Yerusalemu, wakaondoa vifaa vyote vya kufukizia uvumba[a], wakavitupa katika Bonde la Kidroni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “madhabahu zote za uvumba,” “vichanja vyote vya kufukizia uvumba,” au “mahali pote pa kufukizia uvumba.” Neno la Kiebrania hurejelea miundo au vifaa vya ibada vinavyohusishwa na kufukiza uvumba.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “katika Nahal Kidroni”; neno hili linaweza kumaanisha kijito, korongo, au bonde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Wakasimama
  rationale: Kitenzi קום katika simulizi kinaanzisha hatua ya makusudi. “Wakasimama” ni cha kawaida na chenye hadhi, bila kulazimisha maana ya kwamba walikuwa wameketi.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: kuondoa / wakaondoa
  rationale: Hifili ya סור ina maana ya kuondoa au kutwaa. “Kuondoa” linafaa kwa matukio yote mawili na kudumisha urudiaji wa Kiebrania.
- source_word: הַמִּזְבְּחוֹת
  choice: madhabahu
  rationale: Hii ndiyo tafsiri ya kawaida ya wingi wa מִזְבֵּחַ; muktadha unaonyesha kuwa ni madhabahu za ibada zisizokubalika.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: zilizokuwa Yerusalemu
  rationale: Kishazi rejeshi kimehifadhiwa ili kutaja wazi mahali zilipokuwa madhabahu.
- source_word: הַמְקַטְּרוֹת
  choice: mahali pote pa kufukizia uvumba
  rationale: Nomino inayotokana na קטר inarejelea vifaa au maeneo ya ibada yaliyohusishwa na kufukiza uvumba. Tafsiri hii huhifadhi upana wa neno kuliko kulifanya bila shaka kuwa “madhabahu.”
- source_word: וַיַּשְׁלִיכוּ
  choice: wakapatupa
  rationale: שׁלך humaanisha kutupa. Kiambishi “pa-” kinarejelea kwa kawaida vitu vilivyotajwa kwa pamoja na kuonyesha kuviondoa kwa nguvu.
- source_word: לְנַחַל קִדְרוֹן
  choice: katika Bonde la Kidroni
  rationale: נחל inaweza kuwa bonde, korongo, au kijito cha msimu. “Bonde la Kidroni” ni wazi kwa wasomaji wa Kiswahili, huku tanbihi ikihifadhi uwezekano mwingine.
