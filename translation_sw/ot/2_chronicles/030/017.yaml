  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: sw
  text: Kwa maana watu wengi katika kusanyiko hawakuwa wamejitakasa[a]; nao Walawi walikuwa na jukumu la kuchinja wanyama wa Pasaka[b] kwa ajili ya wote ambao hawakuwa safi[c], ili kuwaweka wakfu[d] kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuwa wamejiweka wakfu.” Kiebrania hutumia lugha ya utakatifu au kuwekwa wakfu, ingawa usafi wa kiibada ndio suala la karibu katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “Pasaka”; hapa maana yake ni wanyama waliotolewa kuwa dhabihu za Pasaka.
    reason: lexical_alternative
  - marker: c
    text: Yaani, hawakuwa safi kiibada.
    reason: clarification
  - marker: d
    text: Kiebrania hakitaji wazi yambwa la “kuweka wakfu.” Huenda maana ni kuwaweka wakfu wanyama wa Pasaka kwa Yahwe; wengine huelewa kuwa kinachorejelewa ni watu wasiokuwa safi.
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: watu wengi katika kusanyiko
  rationale: Kirai hiki kinaonyesha idadi kubwa ya watu waliokuwa ndani ya jumuiya iliyokusanyika. ‘Kusanyiko’ ni neno la kawaida na lenye heshima kwa קָהָל katika muktadha huu wa ibada.
- source_word: הִתְקַדָּשׁוּ
  choice: hawakuwa wamejitakasa
  rationale: Katika muktadha wa Pasaka, kitenzi hiki kinahusu mtu kujiandaa kwa hali ya utakatifu unaohitajika katika ibada. ‘Kujitakasa’ ni Kiswahili cha kawaida kinachobeba maana ya utakaso wa kiibada bila kukifanya kiwe suala la usafi wa mwili tu; tanbihi huhifadhi uwezekano wa ‘kujiweka wakfu.’
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kikabila na la huduma ya ibada linalotajwa hapa.
- source_word: עַל שְׁחִיטַת
  choice: walishughulikia kuwachinjia
  rationale: עַל hapa huonyesha jukumu au usimamizi, na שְׁחִיטָה ni uchinjaji wa dhabihu. Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba Walawi walikuwa na jukumu la uchinjaji kwa niaba ya wasiokuwa safi.
- source_word: הַפְּסָחִים
  choice: wanyama wa Pasaka
  rationale: Wingi wa neno hili ni kihalisi ‘Pasaka,’ lakini hapa unarejelea wanyama waliotolewa kama dhabihu za Pasaka. ‘Wanyama wa Pasaka’ huepuka kudhani bila lazima kwamba wote walikuwa wana-kondoo, huku tanbihi ikieleza nahau ya Kiebrania.
- source_word: לְכֹל לֹא טָהוֹר
  choice: wale wote ambao hawakuwa safi
  rationale: טָהוֹר hapa inahusu usafi unaostahili kwa ibada. ‘Hawakuwa safi’ hudumisha lugha rahisi ya andiko, na tanbihi hufafanua kuwa usafi wa kiibada ndio unaokusudiwa.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: ili kuwaweka wakfu kwa Yahwe
  rationale: Kitenzi cha mzizi קדשׁ kinaeleza kusudi la kitendo kwa lugha ya kuweka wakfu. Kiwakilishi ‘wa-’ kimeelekezwa kwa wanyama wa Pasaka kama rejeleo la karibu zaidi, lakini tanbihi inaonyesha kwamba Kiebrania hakitaji yambwa waziwazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa umbo la kawaida la Kiswahili ‘Yahwe,’ badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Lugha ya קדשׁ katika muktadha wa Pasaka
  choice: Kutumia ‘kujitakasa’ kwa maandalizi ya watu na ‘kuweka wakfu’ kwa tendo linaloelekezwa kwa Yahwe.
  alternative: Kutumia lugha ya usafi wa kiibada pekee katika sehemu zote mbili, au ‘kujiweka wakfu’ katika sehemu ya kwanza.
  rationale: Muktadha unahusu kustahili kushiriki ibadani, lakini mzizi קדשׁ una maana pana ya utakatifu na kuwekwa wakfu. Chaguo hili linaweka tofauti kati ya kutokuwa safi na kuwekwa wakfu bila kupuuza uhusiano wao katika muktadha.
- issue: Yambwa lisilotajwa katika לְהַקְדִּישׁ לַיהוָה
  choice: Kuelewa ‘kuwaweka wakfu’ kuwa kunarejelea wanyama wa Pasaka.
  alternative: Kuelewa kuwa kunarejelea watu wasiokuwa safi, au kuacha yambwa bila kutajwa.
  rationale: Kiebrania hakitaji yambwa waziwazi. Wanyama wa Pasaka ndio rejeleo la karibu zaidi, na uchinjaji wao ndio tendo linaloelezwa; hata hivyo, tanbihi huhifadhi utata wa kisarufi badala ya kuficha uwezekano mwingine.
- issue: Uhusiano kati ya kutokujitakasa kwa watu na huduma ya Walawi
  choice: Kuunganisha vifungu kwa ‘nao’ baada ya nusu-koloni.
  alternative: Kutumia ‘kwa hiyo,’ ambayo ingeonyesha matokeo kwa uwazi zaidi.
  rationale: Kiunganishi cha Kiebrania ni cha kawaida na hakilazimishi uhusiano wa kimantiki wa ‘kwa hiyo.’ ‘Nao’ hudumisha mfuatano huo huku muktadha ukionyesha kwa nini Walawi walifanya kazi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia ‘nao’ badala ya ‘kwa hiyo’ ili kufuata kiunganishi cha Kiebrania bila kuongeza uhusiano wa sababu ulio wazi kuliko chanzo. ‘Walishughulikia kuwachinjia’ ni usemi wa kawaida unaoonyesha jukumu la Walawi na tendo lililofanywa kwa niaba ya watu wasiokuwa safi.
