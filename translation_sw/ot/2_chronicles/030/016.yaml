base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: sw
  text: Wakasimama mahali pao kwa utaratibu uliowekwa kwao, kulingana na sheria ya Musa, mtu wa Mungu. Makuhani walikuwa wakinyunyiza damu waliyoipokea kutoka kwa Walawi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kutoka mkononi mwa Walawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל עָמְדָם
  choice: Wakasimama mahali pao
  rationale: Kauli hii inaonyesha kwamba walichukua nafasi zao walizopangiwa katika huduma; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya kimahali.
- source_word: כְּמִשְׁפָּטָם
  choice: kwa utaratibu uliowekwa kwao
  rationale: Katika muktadha wa ibada, מִשְׁפָּט hapa ni utaratibu uliowekwa, si hukumu ya mahakama wala desturi ya hiari. Maneno haya yanaonyesha pia kiambishi cha nafsi katika neno la Kiebrania.
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: kulingana na sheria ya Musa
  rationale: תּוֹרָה hapa ni mafundisho au sheria ya Musa iliyoongoza utaratibu wa ibada. 'Sheria ya Musa' ni usemi wazi na unaotambulika kwa wasomaji wa Kiswahili.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hiki ni cheo cha kibiblia cha Musa; tafsiri ya moja kwa moja inadumisha uzito wake bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת הַדָּם
  choice: Makuhani walikuwa wakinyunyiza damu
  rationale: Katika ibada za dhabihu, זרק hueleza kuitumia damu kwa kuinyunyiza au kuirusha kwa utaratibu wa ibada. 'Kunyunyiza damu' ni Kiswahili cha kawaida cha muktadha huu na huepuka dhana ya kuitupa kiholela.
- source_word: מִיַּד הַלְוִיִּם
  choice: waliyoipokea kutoka kwa Walawi
  rationale: 'Kiebrania halisi ni ''kutoka mkononi mwa Walawi.'' Kitenzi ''waliyoipokea'' kinaweka wazi uhusiano unaodokezwa: Walawi waliwapa makuhani damu hiyo, bila kubadili tendo kuu la makuhani.'
theological_decisions:
- issue: Namna ya kueleza matumizi ya damu katika ibada
  choice: walikuwa wakinyunyiza damu
  alternative: walikuwa wakirusha damu
  rationale: Muktadha ni utekelezaji wa ibada kwa mujibu wa sheria ya Musa. 'Kunyunyiza' huwasilisha matumizi ya damu ya kiibada bila kuingiza madai ya kiteolojia yasiyosemwa katika mstari.
- issue: Uhusiano kati ya makuhani, damu, na Walawi
  choice: damu waliyoipokea kutoka kwa Walawi
  alternative: damu kutoka mkononi mwa Walawi
  rationale: Chanzo kina usemi mfupi na wa nahau. Tafsiri kuu inaeleza uhamishaji unaodokezwa, huku tanbihi ikihifadhi muundo halisi ili msomaji aone upeo wa maneno ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa msomaji wa kawaida, huku istilahi za ibada na cheo “mtu wa Mungu” zikidumishwa.
