translation:
  language: sw
  text: Watu wengi sana wakakusanyika Yerusalemu ili kuiadhimisha[a] Sikukuu ya Mikate Isiyotiwa Chachu katika mwezi wa pili; kusanyiko kubwa sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kuishika” au “ili kuifanya” Sikukuu ya Mikate Isiyotiwa Chachu; kihalisi, “kuifanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Nifali yenye waw ya masimulizi inaeleza watu kuja pamoja; “wakakusanyika” ni ya kawaida na huhifadhi mtiririko wa simulizi.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Umbo la jina la mahali lililozoeleka katika Kiswahili.
- source_word: עַם רָב
  choice: watu wengi sana
  rationale: Huhifadhi mkazo wa Kiebrania juu ya wingi wa watu kwa Kiswahili cha kawaida.
- source_word: לַעֲשׂוֹת
  choice: ili kuiadhimisha
  rationale: Ingawa kitenzi kwa msingi ni ‘kufanya,’ pamoja na sikukuu kina maana ya kuiadhimisha au kuishika; “kuiadhimisha” ni ya asili katika Kiswahili.
- source_word: חַג הַמַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: “Sikukuu” huwasilisha sherehe rasmi, na “Mikate Isiyotiwa Chachu” hueleza מַצּוֹת kwa uwazi bila kuongeza tafsiri ya kimadhehebu.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: katika mwezi wa pili
  rationale: Tafsiri ya moja kwa moja inayohifadhi taarifa muhimu ya wakati.
- source_word: קָהָל לָרֹב מְאֹד
  choice: lilikuwa kusanyiko kubwa sana
  rationale: “Kusanyiko” ni neno lisiloegemea lugha maalumu ya kikanisa, na “kubwa sana” huhifadhi nguvu ya usemi wa wingi uliokithiri.
