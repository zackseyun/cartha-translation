  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: sw
  text: Pia katika Yuda, mkono wa Mungu ulikuwa juu yao, akawapa moyo mmoja[a] ili watekeleze agizo la mfalme na maofisa, kulingana na neno la Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wenye umoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: Pia katika Yuda
  rationale: Inahifadhi maana ya kuongeza taarifa kuhusu Yuda kwa lugha ya kawaida na ya wazi.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: mkono wa Mungu ulikuwa juu yao
  rationale: Inahifadhi taswira ya Kiebrania ya mkono wa Mungu kama nguvu au ushawishi wake unaotenda kazi, bila kuibadili kuwa ufafanuzi wa kimadhehebu.
- source_word: לָתֵת לָהֶם לֵב אֶחָד
  choice: akawapa moyo mmoja
  rationale: Kitenzi chenye mhusika Mungu kinaeleza kusudi au matokeo ya mkono wake kuwa juu yao; ‘moyo mmoja’ inadumisha sitiari ya asili kuhusu azimio la pamoja.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: ili watekeleze agizo
  rationale: ‘Kutekeleza agizo’ ni Kiswahili cha sasa na cha asili kwa kutenda amri iliyotolewa katika mazingira ya kifalme na kiutawala.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: mfalme na maofisa
  rationale: שָּׂרִים hapa inaelekea kwa viongozi au maafisa wa utawala; ‘maofisa’ ni wazi kwa msomaji wa kawaida.
- source_word: בִּדְבַר יְהוָה
  choice: kulingana na neno la Yahwe
  rationale: Inawasilisha wazo la kupatana na neno la Yahwe, huku ikihifadhi uwezekano wa kisarufi wa uhusiano wa karibu na agizo lililotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Asili ya tendo la Mungu katika usemi ‘mkono wa Mungu ulikuwa juu yao’
  choice: Kuhifadhi kauli thabiti kwamba Mungu alitenda kazi na kuwapa umoja wa moyo.
  alternative: Kufifisha kuwa Mungu aliwasaidia tu, au kufafanua kwamba aliwalazimisha bila pingamizi.
  rationale: Andiko linahusisha wazi mwitikio wao wa pamoja na tendo la Mungu, lakini halielezi utaratibu wake kwa istilahi za baadaye za kiteolojia.
- issue: Uhusiano wa ‘kulingana na neno la Yahwe’ na agizo la mfalme na maofisa
  choice: Kuweka kishazi mwishoni kama katika chanzo, kikionyesha kwamba agizo hilo lilipatana na neno la Yahwe.
  alternative: Kukifunga moja kwa moja na kitendo cha kutekeleza, yaani ‘watekeleze ... kwa neno la Yahwe.’
  rationale: Muundo wa Kiebrania unaweza kuruhusu tofauti ndogo ya uambatishaji; mpangilio huu unafuata mfuatano wa chanzo bila kuongeza ufafanuzi usiotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ‘mkono wa Mungu’ na ‘moyo mmoja’ imehifadhiwa; ‘agizo’ na ‘maofisa’ zinatoa mazingira ya kifalme kwa lugha ya sasa.
