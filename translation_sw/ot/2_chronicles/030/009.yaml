base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: sw
  text: 'Kwa maana mtakaporudi kwa Yahwe, ndugu zenu na wana wenu[b] watapata huruma mbele ya wale waliowateka[a], nao watarudi katika nchi hii. Kwa maana Yahwe Mungu wenu ni mwenye neema na huruma, naye hataugeuza uso wake mbali nanyi[c], ikiwa mtarudi kwake.


    [a] Au, “watahurumiwa mbele ya wale waliowateka.”


    [b] Kiebrania kihalisi, “ndugu zenu na wana wenu”; maneno hayo yametajwa kwa jinsi ya kiume katika matini chanzi.


    [c] Kiebrania kihalisi, “hatauondoa uso wake kutoka kwenu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watahurumiwa mbele ya wale waliowateka.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “ndugu zenu na wana wenu”; maneno hayo yametajwa kwa jinsi ya kiume katika matini chanzi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kihalisi, “hatauondoa uso wake kutoka kwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: mtakaporudi kwa Yahwe
  rationale: Kitenzi שׁוּב kinaonyesha kurudi kwa Mungu katika uaminifu wa agano; “kurudi” pia huhifadhi mwangwi wa kitenzi hicho kinaporudiwa mwishoni mwa aya.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: ndugu zenu na wana wenu
  rationale: Huhifadhi maneno ya ukoo ya matini chanzi. “Wana” ni la asili katika Kiswahili, huku tanbihi ikibainisha kwamba Kiebrania kimetumia maumbo ya kiume.
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: watahurumiwa mbele ya wale waliowateka
  rationale: Muundo unaonyesha kwamba watakuwa watu wa kuhurumiwa machoni pa waliowateka. Kauli tendwa inaeleweka kwa urahisi katika Kiswahili bila kuondoa wazo la kuwapo mbele ya watekaji.
- source_word: שׁוֹבֵיהֶם
  choice: wale waliowateka
  rationale: Hutafsiri wazi kishiriki kinachowataja watu waliowachukua mateka.
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: nao watarudi katika nchi hii
  rationale: Huwasilisha matokeo ya huruma watakayoonyeshwa bila kuongeza wazi mtendaji ambaye matini haimtaji.
- source_word: חַנּוּן וְרַחוּם
  choice: mwenye neema na huruma
  rationale: 'Huhifadhi sifa mbili zinazohusiana lakini tofauti: kutoa fadhili na kuwa na huruma.'
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: hataugeuza uso wake mbali nanyi
  rationale: Huhifadhi taswira ya uso na maana ya Mungu kutowaacha au kutowakataa, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: ikiwa mtarudi kwake
  rationale: Huhifadhi sharti la matini na kurudia kwa mzizi שׁוּב, jambo muhimu katika msisitizo wa aya.
theological_decisions:
- issue: Lugha ya toba katika שׁוּב
  choice: kurudi kwa Yahwe / kurudi kwake
  alternative: kumgeukia Yahwe / kumgeukia
  rationale: “Kurudi” huhifadhi wazo la kurejeshwa kwa uaminifu wa agano na urudiaji wa mzizi wa Kiebrania bila kuingiza istilahi ya kimafundisho isiyokuwamo wazi katika aya.
- issue: Maneno ya ukoo yenye jinsi ya kiume
  choice: ndugu zenu na wana wenu
  alternative: ndugu zenu na watoto wenu
  rationale: Matini ya Kiebrania ina maneno ya kiume. Tafsiri kuu huyahifadhi kwa kiwango kinachowezekana katika Kiswahili, na tanbihi hueleza umbo la chanzi bila kudai kwamba walengwa mpana hawangeweza kujumuisha wengine.
- issue: Taswira ya uso wa Mungu
  choice: hataugeuza uso wake mbali nanyi
  alternative: hatawaacha / hatawakataa
  rationale: Taswira ya uso ina uzito wa uhusiano na agano; kuiacha katika matini kunahifadhi mvutano huo badala ya kuifafanua kwa hitimisho moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi mbili zinafuata muundo wa hoja wa Kiebrania. “Yahwe” limetumiwa kama jina binafsi; kauli “wale waliowateka” ni wazi zaidi kuliko nomino nzito “watekaji,” na taswira ya uso imehifadhiwa.
