  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: sw
  text: Kisha Hezekia akatuma ujumbe kwa Israeli yote na Yuda[a], na pia akaandika barua kwa Efraimu na Manase, waje kwenye nyumba ya Yahwe huko Yerusalemu ili waadhimishe Pasaka kwa Yahwe, Mungu wa Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Israeli yote na Yuda”; kihusishi cha Kiebrania kinaweza kuonyesha kwamba ujumbe ulitumwa kotekote katika maeneo hayo, na pia kwamba uliwaelekea watu wake.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya karibu, “kufanya Pasaka kwa Yahwe”; usemi wa Kiebrania “kufanya Pasaka” ni nahau ya kuadhimisha au kushika sikukuu hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma ujumbe
  rationale: Kitenzi chenyewe ni ‘akatuma,’ lakini muktadha unaonyesha mwito uliotumwa kwa watu; ‘akatuma ujumbe’ ni Kiswahili cha kawaida bila kubainisha isivyohitajika kwamba alituma wajumbe.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: kwa Israeli yote na Yuda
  rationale: עַל hapa inaonyesha walengwa au eneo lililofikiwa na ujumbe. ‘Kwa’ huonyesha wazi kwamba ujumbe uliwaelekea watu hao, huku tanbihi ikihifadhi uwezekano wa maana ya kuenea katika maeneo yote.
- source_word: אִגְּרוֹת כָּתַב
  choice: akaandika barua
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya mawasiliano yaliyoandikwa.
- source_word: עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: kwa Efraimu na Manase
  rationale: עַל pamoja na כָּתַב inaeleweka kuwa inaonyesha walengwa wa barua, yaani makabila au maeneo ya Efraimu na Manase.
- source_word: לְבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: Inahifadhi picha halisi ya Kiebrania ‘nyumba ya Yahwe’; ‘katika’ ni ya kawaida kwa mwendo wa kuingia au kufika mahali hapo katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: wamwadhimishie ... Pasaka
  rationale: Usemi halisi ‘kufanya Pasaka’ ni nahau ya kuiadhimisha sikukuu. ‘Kuadhimisha Pasaka’ ni Kiswahili cha sasa na kinachoeleweka.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: wamwadhimishie Yahwe, Mungu wa Israeli
  rationale: Kiambishi cha mtendewa katika ‘wamwadhimishie’ kinawakilisha לַיהוָה kwa njia ya asili, kikionyesha kwamba Pasaka inaadhimishwa kwa heshima ya Yahwe.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia wazi Tetragramatoni. ‘Yahwe’ huhifadhi jina la agano kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לַיהוָה katika kuadhimisha Pasaka
  choice: wamwadhimishie Yahwe
  alternative: waadhimishe Pasaka kwa Yahwe; waadhimishe Pasaka ya Yahwe
  rationale: Muundo huu unahifadhi mwelekeo wa ibada kwa Yahwe bila kuamua kupita kiasi kama לְ ni umilikaji au faida pekee; unaeleza kwa Kiswahili cha kawaida kwamba sikukuu inaadhimishwa kwa heshima yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa upya kidogo ili ‘Yahwe, Mungu wa Israeli’ ihusiane wazi na mwadhimisho wa Pasaka, huku maudhui yote ya Kiebrania yakihifadhiwa. Alama zote za tanbihi zimo katika matini kuu.
