base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: sw
  text: Wakachinja dhabihu ya Pasaka[a] siku ya kumi na nne ya mwezi wa pili. Makuhani na Walawi wakaona aibu, wakajitakasa, kisha wakaleta sadaka za kuteketezwa nyumbani kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Pasaka”; hapa neno hilo humaanisha mnyama au dhabihu ya Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Wakamchinja
  rationale: Kitenzi שׁחט humaanisha kuchinja mnyama, hasa katika muktadha wa dhabihu; “kuchinja” huhifadhi maana hiyo ya kiibada kwa Kiswahili cha kawaida.
- source_word: הַפֶּסַח
  choice: mwana-kondoo wa Pasaka[a]
  rationale: Neno hilo kwa umbo lake ni “Pasaka,” lakini hapa ni kitu kinachochinjwa, yaani mnyama wa dhabihu ya Pasaka. “Mwana-kondoo wa Pasaka” huweka rejeo wazi, huku tanbihi ikihifadhi usemi halisi wa Kiebrania.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: siku ya kumi na nne ya mwezi wa pili
  rationale: Huu ni usemi wa kawaida wa tarehe; “siku” imewekwa wazi kwa Kiswahili cha asili.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: Makuhani na Walawi
  rationale: Haya ni majina sanifu ya watumishi wa kikuhani na Walawi, ambao wametajwa kama makundi tofauti.
- source_word: נִכְלְמוּ
  choice: wakaaibika
  rationale: Niphal ya כלם inaonyesha kuona aibu au kufedheheka; “wakaaibika” ni ya moja kwa moja na inafaa mwitikio wao katika muktadha.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: wakajitakasa
  rationale: Umbo la kujirejelea la קדשׁ hapa linahusu kujitayarisha kwa utakaso wa kiibada. “Kujitakasa” ni la kawaida na linaeleweka bila kuondoa maana ya ibada.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: wakaleta sadaka za kuteketezwa
  rationale: עֹלוֹת ni dhabihu zinazoteketezwa kabisa; “sadaka za kuteketezwa” ni istilahi wazi na ya kawaida ya kibiblia.
- source_word: בֵּית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: Tafsiri hii huhifadhi taswira halisi ya “nyumba ya Yahweh” badala ya kuibadili kimafafanuzi kuwa “hekalu,” na kihusishi kinaonyesha walikozileta sadaka.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kujitakasa kwa makuhani na Walawi
  choice: wakajitakasa
  alternative: wakajiweka wakfu; wakajifanya watakatifu
  rationale: Muktadha unaonyesha maandalizi ya kiibada, lakini maandishi hayafafanui hatua walizochukua. “Wakajitakasa” huhifadhi maana ya kiibada bila kuongeza utaratibu usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi na hadhi ya lugha ya ibada. Mfuatano wa vitenzi vya “waka-” unaakisi mwendo wa simulizi la Kiebrania. Alama ya tanbihi imewekwa baada ya “mwana-kondoo wa Pasaka,” ambako ufafanuzi wake unahusika.
