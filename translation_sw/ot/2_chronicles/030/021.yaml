  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ בְנֵֽי יִ֠שְׂרָאֵל הַ/נִּמְצְאִ֨ים בִּ/ירוּשָׁלִַ֜ם אֶת חַ֧ג הַ/מַּצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וּֽ/מְהַלְלִ֣ים לַ֠/יהוָה י֣וֹם בְּ/י֞וֹם הַ/לְוִיִּ֧ם וְ/הַ/כֹּהֲנִ֛ים בִּ/כְלֵי עֹ֖ז לַ/יהוָֽה־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: sw
  text: Wana wa Israeli waliokuwapo Yerusalemu waliadhimisha Sikukuu ya Mikate Isiyotiwa Chachu kwa siku saba kwa furaha kubwa. Nao Walawi na makuhani wakamsifu Yahweh siku baada ya siku kwa ala za nguvu[a] kwa ajili ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ala zenye sauti kubwa.” Kiebrania kinasema kihalisi, “kwa ala za nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... אֶת חַג
  choice: waliadhimisha Sikukuu
  rationale: Katika muundo huu, kitenzi עשה pamoja na חַג humaanisha kuadhimisha au kushika sikukuu; “waliadhimisha” ni Kiswahili cha kawaida na wazi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa uwazi namna ya msemo wa Kiebrania, huku ikibaki yenye kueleweka katika Kiswahili cha kibiblia.
- source_word: הַנִּמְצְאִים בִּירוּשָׁלִַם
  choice: waliokuwapo Yerusalemu
  rationale: Ingawa kimsingi ni “waliopatikana,” hapa kishirikishi kinaonyesha wale waliokuwapo; tafsiri hii ni ya asili zaidi katika Kiswahili bila kubadili maana.
- source_word: חַג הַמַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Ni jina linaloeleweka la sikukuu hiyo na linaonyesha kwamba mikate haikutiwa chachu.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: kwa furaha kubwa
  rationale: Tafsiri ya moja kwa moja, ya kawaida, na yenye hadhi.
- source_word: יוֹם בְּיוֹם
  choice: siku baada ya siku
  rationale: Huwasilisha vizuri maana ya tendo lililorudiwa kila siku.
- source_word: בִּכְלֵי עֹז
  choice: kwa ala zenye nguvu
  rationale: Huhifadhi taswira isiyo ya kawaida ya Kiebrania, “ala za nguvu,” bila kuamua kimya-kimya kama nguvu hiyo inamaanisha sauti kubwa au ubora mwingine.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Katika sehemu ya mwisho, לְ yaweza kuonyesha kusudi au anayelengwa na huduma; “kwa ajili ya” ni ya asili kuliko kurudia “kwa Yahweh” baada ya “wakamsifu Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika herufi nne limetolewa kama jina binafsi, si kubadilishwa na cheo.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu; “Yahweh” huhifadhi hilo bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa בִּכְלֵי עֹז לַיהוָה na tendo la kusifu
  choice: kwa ala zenye nguvu kwa ajili ya Yahweh
  alternative: kwa ala zenye sauti kubwa wakimsifu Yahweh
  rationale: Muundo wa Kiebrania una utata kuhusu maana mahususi ya עֹז na kazi ya לְ. Tafsiri kuu huhifadhi wazo la nguvu, na tanbihi inaonyesha uwezekano wa “ala zenye sauti kubwa.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi. “Wana wa Israeli” huhifadhi msemo wa chanzo; “waliokuwapo” huepuka tafsiri ngumu isiyo ya asili ya “waliopatikana.”
