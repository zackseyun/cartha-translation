id: 2CH.30.5
reference: 2 Chronicles 30:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: sw
  text: Basi wakaweka azimio la kutangaza katika Israeli yote, kutoka Beer-sheba hadi Dani, kwamba watu waje Yerusalemu kuiadhimisha Pasaka kwa Yahweh, Mungu wa Israeli, kwa maana hawakuwa wameiadhimisha kwa idadi kubwa, kama ilivyoandikwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana si watu wengi waliiadhimisha sawasawa na ilivyoandikwa.” Kifungu cha Kiebrania kimebanwa na kinaweza kusisitiza ama idadi ndogo ya washiriki ama kutoadhimisha Pasaka kwa kufuata utaratibu ulioandikwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: wakaweka azimio
  rationale: Nahau hii, kihalisi ‘walisimamisha jambo,’ inaonyesha uamuzi rasmi uliowekwa na wenye mamlaka. ‘Wakaweka azimio’ ni Kiswahili cha kawaida chenye uzito wa kitawala.
- source_word: לְהַעֲבִיר קוֹל
  choice: la kutangaza
  rationale: Kihalisi ni ‘kuipitisha sauti’; katika muktadha huu ni kueneza tangazo rasmi. ‘Kutangaza’ hutoa maana hiyo kwa lugha ya asili na iliyo wazi.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: katika Israeli yote
  rationale: Inaonyesha kwamba tangazo lilienezwa katika eneo lote la Israeli.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: kutoka Beer-sheba hadi Dani
  rationale: Majina na msemo wa kijiografia unaojumuisha nchi yote, kusini hadi kaskazini, yamehifadhiwa.
- source_word: לָבוֹא
  choice: kwamba watu waje
  rationale: Kitenzi-jina kinaeleza yaliyomo katika tangazo. Kutaja ‘watu’ kunafanya sentensi iwe wazi bila kubadili rejeleo la jumla.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: kuiadhimisha Pasaka
  rationale: Kihalisi ni ‘kufanya Pasaka,’ lakini ‘kuiadhimisha Pasaka’ ndilo tamko la kawaida la Kiswahili kwa kutekeleza sikukuu hiyo.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi kinaeleza kwamba maadhimisho yanaelekezwa kwa Yahweh. ‘Kwa ajili ya’ ni cha kawaida na hakifanyi kifungu kisikike kana kwamba Pasaka ni mali tu badala ya tendo la ibada.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji.
- source_word: בִּירוּשָׁלָ͏ִם
  choice: Yerusalemu
  rationale: Katika Kiswahili, kitenzi ‘waje’ kinaweza kufuatwa moja kwa moja na mahali wanapokwenda, hivyo hakuna haja ya kuongeza kihusishi.
- source_word: כִּי לֹא לָרֹב עָשׂוּ
  choice: kwa maana hawakuwa wameiadhimisha kwa idadi kubwa
  rationale: לָרֹב inaelekea zaidi kueleza wingi au idadi kuliko muda. Tafsiri hii inaonyesha kuwa Pasaka haikuwa imeadhimishwa na watu wengi, huku tanbihi ikihifadhi ugumu wa uhusiano wake na kifungu kinachofuata.
- source_word: כַּכָּתוּב
  choice: kama ilivyoandikwa
  rationale: Kifungu hiki kinaelekeza kwenye masharti yaliyoandikwa ya Sheria na kinahifadhi namna fupi ya Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja. ‘Yahweh’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa כַּכָּתוּב na kifungu kinachotangulia
  choice: kama ilivyoandikwa, baada ya wazo la kutoadhimisha kwa idadi kubwa
  alternative: si wengi waliiadhimisha sawasawa na ilivyoandikwa
  rationale: Kiebrania kimebanwa na kinaweza kusisitiza ama idadi ndogo ya washiriki ama kutofuata utaratibu ulioandikwa. Matini kuu inafuata maana ya kawaida ya לָרֹב kuwa ya kiasi, na tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka mtiririko wa tangazo rasmi bila kutumia lugha nzito ya kisheria. Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
