id: 2CH.30.6
reference: 2 Chronicles 30:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: sw
  text: Basi wajumbe wakaenda kote Israeli na Yuda wakiwa na barua kutoka kwa mfalme na wakuu wake, kulingana na agizo la mfalme, wakisema, “Enyi wana wa Israeli, mrudieni Yahweh, Mungu wa Abrahamu, Isaka na Israeli[a], ili naye awarejee mabaki ya walionusurika yaliyosalia kwenu[b] kutoka mikononi mwa wafalme wa Ashuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Israeli,” si “Yakobo” kama ilivyo katika orodha inayojulikana zaidi.'
    reason: alternative_reading
  - marker: b
    text: 'Au: “mabaki yaliyoponyoka, yaliyosalia kwenu.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: הָרָצִים
  choice: wajumbe
  rationale: Ingawa neno hili kihalisi linahusiana na wakimbiaji, katika muktadha wa kupeleka barua za kifalme linamaanisha wajumbe rasmi; “wajumbe” ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: בָּאִגְּרוֹת
  choice: na barua
  rationale: Kiambishi ב kimetafsiriwa kwa maana ya kuandamana au kuwa na kitu; wajumbe walikwenda wakiwa na barua.
- source_word: מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: kutoka kwa mfalme na wakuu wake
  rationale: Hutoa maana ya kwamba barua zilitoka moja kwa moja kwa mfalme na maafisa wake bila kulazimisha nahau ya Kiebrania “kutoka mkononi mwa” mahali ambapo ingekuwa nzito kwa Kiswahili.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: kote Israeli na Yuda
  rationale: “Kote” huonyesha wazi kuwa wajumbe walizunguka katika maeneo yote mawili.
- source_word: וּכְמִצְוַת הַמֶּלֶךְ
  choice: kulingana na agizo la mfalme
  rationale: מִצְוָה hapa ni agizo la kifalme, si amri ya kidini kwa maana maalumu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Enyi wana wa Israeli
  rationale: “Wana” huhifadhi umbo la kiume la Kiebrania, na “Enyi” huifanya hotuba ya moja kwa moja iwe ya kawaida na yenye hadhi katika Kiswahili.
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: mrudieni Yahweh
  rationale: Kitenzi “mrudieni” huhifadhi wazo la kurudi kwa Mungu na pia ulinganifu wake na tendo la Mungu la kuwarudia katika kishazi kinachofuata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la agano lililo katika matini ya Kiebrania.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Mungu wa Abrahamu, Isaka na Israeli
  rationale: Matini ya Kiebrania inasema “Israeli,” si “Yakobo”; tafsiri haijapatanishwa kimyakimya na orodha iliyozoeleka zaidi.
- source_word: וְיָשֹׁב
  choice: ili naye awarudie
  rationale: Muundo baada ya agizo unaweza kuonyesha kusudi au matokeo. “Ili ... awarudie” huhifadhi hali hiyo pamoja na ulinganifu wa kurudiana, bila kuifanya kuwa ahadi ya lazima.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: mabaki ya watu walioponyoka na kubaki kwenu
  rationale: Usemi huu unahifadhi mawazo yote mawili ya kuponyoka na kusalia. “Mabaki ya watu” huweka wazi kuwa wanaorejelewa ni watu na hutoa Kiswahili cha kawaida.
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: kutoka mikononi mwa wafalme wa Ashuru
  rationale: Nahau “mikononi mwa” ni ya kawaida katika Kiswahili na huhifadhi picha ya kuwa chini ya mamlaka au nguvu za wafalme wa Ashuru.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ina jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi wazi.
- issue: Iwapo “Israeli” ipatanishwe na “Yakobo” katika orodha ya mababu
  choice: Mungu wa Abrahamu, Isaka na Israeli
  alternative: Mungu wa Abrahamu, Isaka na Yakobo
  rationale: Kiebrania cha mstari huu kinasema יִשְׂרָאֵל, yaani “Israeli,” kwa hiyo usomaji huo umehifadhiwa.
- issue: Nguvu ya וְיָשֹׁב baada ya agizo
  choice: ili naye awarudie
  alternative: naye atawarudia
  rationale: Tafsiri iliyochaguliwa huhifadhi uwezekano wa maana ya kusudi au matokeo na haibadili kishazi kuwa ahadi ya moja kwa moja isiyo na masharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtindo wa tangazo la kifalme, lakini nahau nzito zimefanywa za kawaida pale ambapo hilo halipotezi maana. Alama za tanbihi [a] na [b] zimewekwa kwenye vifungu vinavyohusika moja kwa moja.
