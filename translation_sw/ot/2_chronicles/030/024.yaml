base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: sw
  text: Kwa maana Hezekia, mfalme wa Yuda, alitoa kwa kusanyiko[a] mafahali elfu moja na wanyama elfu saba wa kundi; nao viongozi wakatoa kwa kusanyiko mafahali elfu moja na wanyama elfu kumi wa kundi; na makuhani wengi wakajiweka wakfu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya kusanyiko.” Kihusishi cha Kiebrania kinaweza kueleweka kwa njia zote mbili katika muktadha huu wa kutoa wanyama kwa ibada ya pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na uliotangulia kwa kutoa sababu au maelezo ya furaha na ushiriki wa kusanyiko.
- source_word: הֵרִים / הֵרִימוּ
  choice: alilipa / wakalipa
  rationale: Katika muktadha huu Hiphil ya רום humaanisha kutoa mchango kwa matumizi ya ibada ya pamoja; ‘kutoa kwa’ linaeleweka kwa Kiswahili cha kawaida bila kudokeza kitendo cha kuinua kihalisi.
- source_word: לַקָּהָל
  choice: kusanyiko
  rationale: קהל ni jumuiya iliyokusanyika. Muundo ‘kulipa kusanyiko’ unahifadhi maana ya kuelekeza mchango kwao, huku uwezekano wa ‘kwa ajili ya kusanyiko’ ukielezwa katika tanbihi.
- source_word: פָּרִים
  choice: mafahali
  rationale: Neno hili linaonyesha ng’ombe dume walioweza kutumiwa kama dhabihu.
- source_word: צֹאן
  choice: wanyama ... wa kundi
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; tafsiri hii inahifadhi upana huo kuliko ‘kondoo’ pekee.
- source_word: הַשָּׂרִים
  choice: viongozi
  rationale: שׂרים ni watu wenye cheo na mamlaka. ‘Viongozi’ ni lugha ya sasa na haidokezi lazima ukuu wa kifalme wa kurithi.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: makuhani ... wakajiweka wakfu
  rationale: Umbo la kirejeshi la קדשׁ linaonyesha makuhani walijitenga na kujiandaa kiibada kwa huduma.
- source_word: לָרֹב
  choice: wengi
  rationale: Kifungu hiki kinasisitiza idadi kubwa ya makuhani waliojiweka wakfu; ‘makuhani wengi’ ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Maana ya kujiweka wakfu kwa makuhani
  choice: wakajiweka wakfu
  alternative: wakajitakasa
  rationale: ‘Wakajiweka wakfu’ huhifadhi wazo la kujitenga na kujiandaa kwa huduma takatifu bila kulifanya neno hilo limaanishe usafishaji pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wanyama wa kundi’ limetumiwa kwa sababu צֹאן linaweza kuwahusisha kondoo na mbuzi.
