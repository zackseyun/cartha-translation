base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: sw
  text: Yahwe akamsikiliza Hezekia, akawaponya watu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamsikia Hezekia.” Katika muundo huu, kitenzi cha Kiebrania kinaweza kumaanisha kusikia au kusikiliza na kuitikia kwa kibali.
    reason: lexical_alternative
  - marker: b
    text: “Akawaponya” huenda ikamaanisha kwamba Yahwe aliondoa taabu au hukumu iliyohusiana na hali isiyofaa ya kiibada ya watu; si lazima irejelee ugonjwa wa mwili pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: akamsikiliza
  rationale: Kitenzi שׁמע kikifuatwa na אֶל hapa kinaonyesha si kusikia sauti tu, bali kumsikiliza mtu na kuitikia ombi lake kwa kibali. Muktadha ni sala ya Hezekia kwa ajili ya watu (mistari 18–19).
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa namna iliyo ya kawaida na inayoeleweka katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekia
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: וַיִּרְפָּא
  choice: akawaponya
  rationale: Kitenzi רפא kwa kawaida humaanisha kuponya. Neno hili linahifadhi taswira ya Kiebrania bila kuamua ikiwa uponyaji ulikuwa wa ugonjwa wa mwili pekee au kuondolewa kwa adhabu/taabu iliyohusiana na hali yao ya kiibada.
- source_word: הָעָם
  choice: watu
  rationale: עם hapa linarejelea jumuiya ya Waisraeli waliokusanyika; “watu” ni tafsiri ya kawaida, pana, na ya asili katika Kiswahili.
theological_decisions:
- issue: Maana ya Mungu “kuwaponya watu”
  choice: Kudumisha lugha ya uponyaji bila kuibana iwe uponyaji wa mwili pekee.
  alternative: “akawasamehe watu,” “akawaokoa watu na adhabu,” au “akawarejesha watu.”
  rationale: Muktadha unahusu watu waliokula Pasaka bila kujitakasa kikamilifu na sala ya Hezekia kwa ajili yao. Hata hivyo, maandishi yanatumia רפא, “ponya”; kwa hiyo tafsiri inahifadhi mvutano huo badala ya kuufafanua kwa fundisho jembamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo “akamsikiliza ... akawaponya” ni wa asili na unaakisi mfuatano wa simulizi ya Kiebrania.
