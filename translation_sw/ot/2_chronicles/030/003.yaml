  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: sw
  text: Kwa maana hawakuweza kuiadhimisha wakati huo, kwa sababu makuhani hawakuwa wamejiweka wakfu kwa kiwango cha kutosha[a], na watu hawakuwa wamekusanyika Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makuhani hawakuwa wamejiweka wakfu kwa idadi ya kutosha.” Usemi wa Kiebrania ni mfupi na unaweza kumaanisha kwamba kujiweka kwao wakfu hakukutosha au kwamba idadi ya makuhani waliojiweka wakfu haikutosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: hawakuweza
  rationale: Kitenzi kinaeleza uwezo; ukanushi huu unaonyesha kutoweza, si kutotaka tu.
- source_word: לַעֲשֹׂתוֹ
  choice: kuiadhimisha
  rationale: Kiwakilishi kinarejelea Pasaka katika muktadha. Kiswahili cha kawaida husema kuiadhimisha Pasaka; hii ni wazi kuliko tafsiri ya moja kwa moja ‘kuifanya’.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Kirai kinaelekeza kwenye wakati mahususi uliokuwa umepangwa kwa Pasaka bila kulazimisha neno ‘uliowekwa’ katika matini.
- source_word: הִתְקַדְּשׁוּ
  choice: hawakuwa wamejiweka wakfu
  rationale: Katika muktadha wa ibada, kitenzi cha hitpael kinaonyesha makuhani kujitayarisha kwa kujiweka wakfu; usemi huu ni wa heshima na unaeleweka.
- source_word: לְמַדַּי
  choice: vya kutosha
  rationale: Kielezi hiki humaanisha kwa kiwango au kiasi cha kutosha. Tafsiri inadumisha ufupi wa Kiebrania, huku tanbihi ikihifadhi uwezekano wa maana ya idadi.
- source_word: נֶאֶסְפוּ
  choice: hawakuwa wamekusanyika
  rationale: Niphal hapa inaeleza kukusanyika kwa watu; muundo huu ni wa asili katika Kiswahili.
- source_word: לִירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Ingawa לְ linaweza kuonyesha mwelekeo ‘kwenda Yerusalemu,’ baada ya ‘kukusanyika’ Kiswahili cha asili kinaweza kutaja mahali bila kihusishi; maana ya mahali walipokusanyika inabaki wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuiadhimisha’ hufanya rejeo la Pasaka lieleweke kwa kawaida; ‘kujiweka wakfu’ huhifadhi muktadha wa maandalizi ya ibada. Utata halisi wa לְמַדַּי umehifadhiwa kwa tanbihi.
