base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/002.yaml
  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: sw
  text: Ndipo mfalme, wakuu wake, na kusanyiko lote huko Yerusalemu wakaamua kuiadhimisha Pasaka katika mwezi wa pili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kuifanya Pasaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: wakaamua
  rationale: Kitenzi katika Niphal kinaonyesha kushauriana kulikofikia uamuzi. “Wakaamua” ni Kiswahili cha kawaida na, kwa kuwa wahusika wametajwa kwa pamoja, kinaonyesha kuwa ulikuwa uamuzi wao wa pamoja.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye uainisho; ingawa muktadha unamtambulisha kuwa Hezekia, mstari huu wenyewe unatumia cheo chake.
- source_word: וְשָׂרָיו
  choice: wakuu wake
  rationale: שָׂרִים ni watawala au maafisa wenye mamlaka. “Wakuu” ni neno la asili na lenye heshima katika Kiswahili, bila kudokeza kimakosa kwamba walikuwa wana wa kifalme.
- source_word: וְכָל הַקָּהָל
  choice: na kusanyiko lote
  rationale: קָהָל humaanisha jumuiya iliyokusanyika. “Kusanyiko lote” huhifadhi maana hiyo ya pamoja bila kuingiza maana maalumu ya dhehebu.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Hii ni tafsiri ya mahali iliyo ya kawaida na inayounganika kiasili na “kusanyiko lote.”
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: kuiadhimisha Pasaka
  rationale: Kihalisi ni “kuifanya Pasaka,” lakini huo ni msemo unaomaanisha kutekeleza maadhimisho ya Pasaka. “Kuiadhimisha Pasaka” ni Kiswahili cha sasa, wazi, na huhifadhi maana ya sikukuu bila ufafanuzi wa ziada.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: katika mwezi wa pili
  rationale: Ni tafsiri ya moja kwa moja ya kirai cha wakati. Umuhimu wa mwezi wa pili unaelezwa na muktadha, hivyo haujaongezwa ndani ya mstari.
theological_decisions:
- issue: Kutafsiri msemo wa kuadhimisha Pasaka bila kuongeza maelezo ya kiufafanuzi
  choice: kuiadhimisha Pasaka
  alternative: kuifanya Pasaka; kuishika Pasaka
  rationale: Msemo wa Kiebrania unamaanisha kutekeleza maadhimisho ya Pasaka. “Kuiadhimisha” ni ya kawaida na sahihi katika Kiswahili, ilhali “kuifanya” ni ngumu kueleweka na “kuishika” inaweza kusikika kama tafsiri ya kimapokeo kuliko usemi wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “wakaamua” unaonyesha uamuzi wa pamoja kwa uwazi, huku “wakuu” na “kusanyiko” vikihifadhi mazingira ya utawala na jumuiya ya Israeli.
