translation:
  language: sw
  text: Jambo hilo likaonekana kuwa sawa machoni pa mfalme na machoni pa kusanyiko lote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo hilo likawa sawa machoni pa mfalme na pa kusanyiko lote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: likaonekana kuwa sawa
  rationale: Kitenzi מן ישר katika wayyiqtol, pamoja na nahau בְּעֵינֵי, kinaonyesha kwamba jambo hilo lilionwa kuwa jema au lifaalo. Tafsiri hii ni ya kawaida katika Kiswahili huku ikihifadhi uwezekano wa maana ya moja kwa moja ‘likawa sawa’.
- source_word: הַדָּבָר
  choice: Jambo hilo
  rationale: דבר hapa ni ‘jambo’ au ‘shauri’ linalorejelea mpango uliotajwa katika muktadha. ‘Jambo hilo’ ni tafsiri ya moja kwa moja, rasmi, na yenye kueleweka bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Nahau ya Kiebrania ya kutathmini jambo imehifadhiwa kwa taswira inayotambulika pia katika Kiswahili.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Tafsiri ya moja kwa moja ya nomino yenye kibainishi; katika Kiswahili umaalumu unaeleweka kutokana na muktadha.
- source_word: וּבְעֵינֵי
  choice: na machoni pa
  rationale: Kurudiwa kwa nahau kumehifadhiwa ili kudumisha usambamba wa sentensi ya Kiebrania.
- source_word: כָּל
  choice: lote
  rationale: Huonyesha kwamba kusanyiko zima lilikubali tathmini hiyo; upatanisho wa kisarufi unafuata nomino ‘kusanyiko’.
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: קהל ni jumuiya ya watu waliokusanyika. ‘Kusanyiko’ ni neno la kawaida na lenye hadhi, bila kulifanya liwe istilahi mahususi ya kidhehebu.
