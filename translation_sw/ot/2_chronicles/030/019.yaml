base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: sw
  text: kila mtu aliyeuelekeza moyo wake kumtafuta Mungu, Yahweh, Mungu wa mababu zake, ingawa hakuwa ametakaswa kama ilivyotakiwa kwa ajili ya mahali patakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “patakatifu pa ibada.” Neno la Kiebrania קֹדֶשׁ hapa linaweza kumaanisha mahali patakatifu au patakatifu pa ibada katika muktadha wa ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: kila mtu ... moyo wake
  rationale: Muundo huu una nguvu ya kugawa kwa kila mtu mmoja mmoja; Kiswahili cha “kila mtu ... moyo wake” ni cha asili na kinadumisha umoja huo.
- source_word: הֵכִין
  choice: aliyeuelekeza
  rationale: Hifili ya כון hapa inaeleza kuuweka au kuuelekeza moyo kwa kusudi fulani. “Aliyeuelekeza moyo wake” ni usemi wa kawaida unaoonyesha mwelekeo wa ndani bila kuufanya kuwa maandalizi ya nje tu.
- source_word: לִדְרוֹשׁ
  choice: kumtafuta
  rationale: דרש ikiwa na Mungu kama yambwa humaanisha kumtafuta kwa ibada, kujitoa, au kutaka mwongozo wake. “Kumtafuta” inadumisha upana huo.
- source_word: הָאֱלֹהִים יְהוָה
  choice: Mungu, Yahweh
  rationale: 'Maneno haya yana uhusiano wa ufafanuzi: Mungu anayetafutwa anatambulishwa kuwa Yahweh. Jina la agano יְהוָה limetoholewa kuwa “Yahweh.”'
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: Mungu wa mababu zake
  rationale: Kiwakilishi cha umoja kinapatana na “kila mtu,” huku “mababu zake” kikidumisha rejeo la kihistoria na la agano.
- source_word: וְלֹא
  choice: ingawa ... haku-
  rationale: Kiunganishi hapa kinaonyesha hali inayokinzana na kumtafuta Mungu kwa moyo ulioelekezwa kwake. “Ingawa” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: כְּטָהֳרַת
  choice: hakujitakasa kama inavyotakiwa
  rationale: כְּ inaonyesha kufuata kiwango, na טָהֳרָה ni utakaso wa kiibada. Kauli hii inaweka wazi kutofuatwa kwa kiwango cha utakaso bila kupunguza uzito wa hali hiyo.
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Katika muktadha huu wa ibada, קֹדֶשׁ inaelekea kutaja eneo takatifu au patakatifu, ingawa maana ya “patakatifu” kama hekalu pia inawezekana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; “Yahweh” hudumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Mvutano kati ya nia ya moyo na kutotimiza utakaso wa kiibada
  choice: Kutafuta Mungu kwa moyo ulioelekezwa kwake kumewekwa pamoja na kutotakaswa kama ilivyotakiwa.
  alternative: Kufafanua kwamba nia njema iliondoa hitaji la utakaso, au kufanya uchafu wa kiibada ubatilishe kabisa utafutaji wa Mungu.
  rationale: Kiebrania kinaweka hali zote mbili sambamba bila kueleza hapa jinsi mvutano huo unavyotatuliwa; tafsiri haiongezi hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni sehemu ya sentensi inayoendelea kutoka mstari uliotangulia; umeachwa hivyo ili kudumisha sintaksia ya muktadha. “Aliyeuelekeza moyo wake” ni ya kawaida na huakisi kwa usahihi hali ya ndani iliyo katika Kiebrania.
