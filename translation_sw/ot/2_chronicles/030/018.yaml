base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: sw
  text: Kwa maana idadi kubwa ya watu—wengi wao kutoka Efraimu na Manase, Isakari na Zabuloni—hawakuwa wamejitakasa, lakini walikula Pasaka bila kufuata yaliyoandikwa.[a] Hata hivyo, Hezekia aliwaombea akisema, “Yahwe, aliye mwema, afanye upatanisho kwa ajili ya—”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno kwa neno, “si kama ilivyoandikwa.”
    reason: lexical_alternative
  - marker: b
    text: Sala inaendelea katika mstari wa 19; sentensi ya Kiebrania haijakamilika mwishoni mwa mstari huu.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: watu wengi sana—wengi
  rationale: Huhifadhi msisitizo wa Kiebrania kuhusu idadi kubwa ya watu bila kudai kwa lazima kwamba walikuwa wengi kuliko nusu.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: kutoka Efraimu na Manase, Isakari na Zabuloni
  rationale: Majina ya makabila yameandikwa kwa maumbo yanayotambulika katika Kiswahili, huku mpangilio wa chanzo ukihifadhiwa.
- source_word: לֹא הִטֶּהָרוּ
  choice: hawakuwa wamejitakasa
  rationale: Kitenzi cha kujirejelea kinaonyesha kwamba hawakuwa wamefanya utakaso wa kiibada uliotakiwa.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: walikula chakula cha Pasaka
  rationale: Hutoa Kiswahili cha kawaida kwa tendo la kula Pasaka bila kulibana kwa kuongeza kwamba kilikuwa mwana-kondoo, jambo ambalo halijasemwa wazi hapa.
- source_word: בְּלֹא כַכָּתוּב
  choice: bila kufuata yaliyoandikwa
  rationale: Huwasilisha kwa kawaida kwamba tendo lao halikupatana na maagizo yaliyoandikwa.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: aliwaombea
  rationale: Hueleza moja kwa moja sala iliyotolewa kwa niaba yao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הַטּוֹב
  choice: aliye mwema
  rationale: Kivumishi hiki kinamwelezea Yahwe na kimetolewa kwa Kiswahili cha asili bila kukifanya cheo maalumu.
- source_word: יְכַפֵּר
  choice: afanye upatanisho
  rationale: Huhifadhi lugha ya kiibada ya כפר katika mazingira ya Pasaka na utakaso, badala ya kuirahisisha kuwa ‘asamehe’.
- source_word: בְּעַד
  choice: kwa ajili ya—
  rationale: Kihusishi kinaishia bila shamirisho katika mstari huu; kistari kirefu huhifadhi sentensi ambayo inaendelea katika mstari wa 19.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; kulihifadhi kama jina hakubadili kuwa cheo.
- issue: Lugha ya kiibada ya כפר
  choice: afanye upatanisho
  alternative: awasamehe
  rationale: Muktadha wa Pasaka na utakaso unaunga mkono kuhifadhi dhana pana ya upatanisho bila kuifasiri tu kuwa msamaha.
- issue: Sentensi isiyokamilika mwishoni mwa mstari
  choice: kwa ajili ya—
  alternative: kwa ajili yao
  rationale: Shamirisho la בְּעַד linakuja katika mstari wa 19. Kutolitaja mapema huhifadhi muundo na mvutano halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mabano ya vistari virefu yanadumisha msisitizo wa orodha bila kuifanya sentensi kuwa nzito; istilahi za kiibada zimehifadhiwa kwa uwazi unaofaa wasomaji wa kawaida.
