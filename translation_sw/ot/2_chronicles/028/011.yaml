base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: sw
  text: Basi sasa nisikilizeni, na mwarudishe mateka mliowateka kutoka kwa ndugu zenu,[a] kwa maana hasira kali ya Yahwe iko juu yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli wenzenu.” Kiebrania kinasema “ndugu zenu,” kikitumia lugha ya undugu kwa watu wa taifa moja la agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha mpito wa haraka na wa kusisitiza katika hotuba; “Basi sasa” ni ya kawaida na yenye uzito katika Kiswahili.
- source_word: שְׁמָעוּנִי
  choice: nisikilizeni
  rationale: Amri hii inataka wasikilizaji watoe uangalifu, si kusikia sauti tu.
- source_word: וְהָשִׁיבוּ
  choice: mwarudishe
  rationale: Hifili ya שׁוב hapa ina maana ya kusababisha warudi; umbo la Kiswahili linaonyesha wazi kuwa waliochukuliwa mateka wanapaswa kurudishwa.
- source_word: הַשִּׁבְיָה
  choice: mateka
  rationale: Nomino hii ya pamoja inarejelea watu waliotekwa vitani; “mateka” ni fupi, wazi, na ya kawaida.
- source_word: אֲשֶׁר שְׁבִיתֶם
  choice: mliowateka
  rationale: Kishazi hiki kinawatambulisha mateka kuwa wale waliokamatwa na wasikilizaji, huku kikiendeleza mzizi wa maana ya kuteka.
- source_word: מֵאֲחֵיכֶם
  choice: kutoka kwa ndugu zenu
  rationale: “Ndugu zenu” huhifadhi lugha ya undugu ya Kiebrania na inaweza kwa kawaida kumaanisha watu wa taifa au jumuiya moja; tanbihi inaeleza upeo huo.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya amri kwa kiunganishi cha Kiswahili chenye uzito unaofaa.
- source_word: חֲרוֹן אַף
  choice: hasira kali
  rationale: Nahau ya Kiebrania inaonyesha hasira yenye joto na nguvu. “Hasira kali” ni Kiswahili cha kawaida kinachowasilisha ukali huo bila msemo usio wa asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kwa umbo la Kiswahili “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: עֲלֵיכֶם
  choice: iko juu yenu
  rationale: Huhifadhi taswira ya kihusishi על kwamba hasira iko juu yao, badala ya kuibadili moja kwa moja kuwa “dhidi yenu.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na ni utohozi unaofaa katika Kiswahili.
- issue: Maana ya “ndugu” katika muktadha wa watu wa agano
  choice: Kuhifadhi “ndugu zenu” katika matini na kufafanua kwa tanbihi
  alternative: Waisraeli wenzenu
  rationale: Kiebrania kinatumia wazi lugha ya undugu. Tafsiri kuu inaihifadhi bila kuficha maana pana ya kitaifa, ambayo imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa amri umewekwa wazi na wenye uharaka, huku lugha ya undugu na taswira ya hasira kuwa “juu” yao zikihifadhiwa.
