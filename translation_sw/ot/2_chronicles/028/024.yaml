base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: sw
  text: Ahazi akakusanya vyombo vya nyumba ya Mungu, akakata-kata vyombo vya nyumba ya Mungu. Akafunga milango ya nyumba ya BWANA, akajitengenezea madhabahu katika kila pembe ya Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: akakusanya
  rationale: Huwakilisha kwa uwazi tendo la kukusanya vitu pamoja.
- source_word: כְּלֵי
  choice: vyombo
  rationale: Neno hili linafaa kwa vifaa au vyombo vilivyotumiwa katika nyumba ya Mungu bila kubainisha aina ambazo hazikutajwa.
- source_word: וַיְקַצֵּץ
  choice: akavikata-kata
  rationale: Kitenzi kinaonyesha kukata vipande au kuharibu kwa kukata; uradidi wa Kiswahili unaonyesha ukataji wa vipande bila kuongeza maelezo yasiyokuwapo.
- source_word: וַיִּסְגֹּר
  choice: akaifunga
  rationale: Muundo huu ni wa kawaida katika Kiswahili kwa kufunga milango ya jengo na huonyesha kwamba matumizi ya nyumba hiyo yalizuiwa.
- source_word: מִזְבְּחוֹת
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa altare za ibada.
- source_word: בְּכָל פִּנָּה
  choice: katika kila pembe
  rationale: Hudumisha picha halisi ya madhabahu zilizowekwa katika sehemu mbalimbali za Yerusalemu.
theological_decisions:
- issue: Uwakilishi wa jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: BWANA kwa herufi kubwa hufuata desturi pana ya Biblia za Kiswahili ya kutofautisha יהוה na אֲדֹנָי, huku ikiepuka kuingiza msimamo wa kimadhehebu kuhusu matamshi.
- issue: Kurudiwa kwa 'vyombo vya nyumba ya Mungu'
  choice: Kurudia kirai kamili
  alternative: Kutumia kiwakilishi pekee katika kutajwa kwa pili
  rationale: Kurudiwa huko limo katika Kiebrania na kunasisitiza kosa la Ahazi dhidi ya vitu vya nyumba ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Mfuatano wa vitenzi umehifadhiwa, na urudiaji wa chanzo haujafutwa.
