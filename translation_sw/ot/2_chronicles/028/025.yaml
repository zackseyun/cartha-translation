base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: sw
  text: Katika kila mji wa Yuda[a], alitengeneza mahali pa juu pa kuabudia ili kufukiza uvumba kwa miungu mingine, na akamkasirisha Yahwe, Mungu wa mababu zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “katika kila mji na mji wa Yuda,” usemi unaosisitiza kwamba miji yote ya Yuda inahusika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: Katika kila mji wa Yuda
  rationale: Urudiaji wa Kiebrania עִיר וָעִיר una maana ya mgawanyo na ukamilifu; Kiswahili cha kawaida huwasilisha maana hiyo kwa njia ya asili kwa kusema ‘kila mji wa Yuda.’
- source_word: עָשָׂה בָמוֹת
  choice: alitengeneza mahali pa juu pa kuabudia
  rationale: עָשָׂה ni kitenzi kipana, hivyo ‘alitengeneza’ hakiongezi wazo mahususi la kujenga. בָּמוֹת humaanisha maeneo ya ibada yaliyojulikana kama mahali pa juu; nyongeza ‘pa kuabudia’ huweka wazi maana ya kiibada kwa msomaji wa kawaida.
- source_word: לְקַטֵּר
  choice: ili kufukiza uvumba
  rationale: Katika muktadha huu piel ya קטר inahusu kuchoma au kufukiza uvumba; ‘kufukiza uvumba’ ni usemi wa asili na wazi wa Kiswahili.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: kwa miungu mingine
  rationale: Hii inatafsiri moja kwa moja miungu iliyo tofauti na Yahwe bila kuongeza dhana ya kuwa ya kigeni.
- source_word: וַיַּכְעֵס אֶת יְהוָה
  choice: na hivyo akamkasirisha Yahwe
  rationale: Hiphil ya כעס ina maana ya kumsababisha mtu awe na hasira. ‘Akamkasirisha’ ni tafsiri fupi na ya kawaida; ‘na hivyo’ huonyesha uhusiano wa kitendo na matokeo bila kubadili maana.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Mungu wa babu zake
  rationale: Katika Kiswahili, ‘babu zake’ huweza kumaanisha mababu au watangulizi wake, na hivyo huwasilisha maana ya agano ya אֲבֹתָיו kwa lugha ya kawaida kuliko ‘baba zake,’ ambayo ingeweza kueleweka kuwa wazazi wa moja kwa moja tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina maalumu la Mungu, tetragramatoni, si cheo. ‘Yahwe’ hulihifadhi kama jina na ni tahajia ya kawaida ya Kiswahili.
- issue: Maana ya אֱלֹהֵי אֲבֹתָיו
  choice: Mungu wa babu zake
  alternative: Mungu wa baba zake / Mungu wa mababu zake
  rationale: ‘Babu zake’ huhifadhi uhusiano wa kihistoria na wa agano bila kudokeza kuwa kifungu kinawahusu baba wa karibu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mahali pa juu pa kuabudia’ kinaeleza istilahi ya kiibada bila kuifanya kuwa ya kimadhehebu; ‘Yahwe’ linahifadhi jina la Mungu. Alama ya tanbihi imewekwa mwishoni kwa kuwa tanbihi inaeleza kishazi cha kwanza na hivyo haisitishi mtiririko wa sentensi.
