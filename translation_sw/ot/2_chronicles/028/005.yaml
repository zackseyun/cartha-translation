reference: 2 Chronicles 28:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: sw
  text: Kwa hiyo Yahweh, Mungu wake, akamtia mikononi mwa mfalme wa Aramu[a], nao wakampiga, wakachukua kutoka kwake idadi kubwa ya mateka[b], na kuwapeleka Dameski. Pia alitiwa mikononi mwa mfalme wa Israeli, naye akampiga pigo kubwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mfalme wa Shamu”; Kiebrania: “Aramu.”'
    reason: lexical_alternative
  - marker: b
    text: Au “wakateka kutoka kwake mateka wengi.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “akampiga pigo kubwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: akamtia mikononi mwa
  rationale: Nahau hii inaonyesha kumweka mtu chini ya mamlaka ya mwingine. Kiswahili ‘kutia mikononi mwa’ huhifadhi taswira ya Kiebrania na pia husikika kwa kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Huhifadhi muundo wa umilikaji na uhusiano unaotajwa hata katika muktadha wa hukumu.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: Aramu ni jina la asili katika Kiebrania; ‘Shamu’ limetolewa katika tanbihi kama jina jingine linalotumiwa.
- source_word: וַיַּכּוּ בוֹ
  choice: Waaramu wakamshinda
  rationale: Kitenzi נכה kinaweza kumaanisha kupiga au kushinda. Katika muktadha huu wa vita na kuchukua mateka, ‘wakamshinda’ ni Kiswahili cha kawaida, huku kiima cha wingi kikieleweka kuwa majeshi au watu wa mfalme wa Aramu.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: wakachukua kutoka kwake mateka wengi
  rationale: שִׁבְיָה גְדוֹלָה inaweza kueleza kundi kubwa la mateka; tafsiri hii huwasilisha maana hiyo kwa uwazi bila kuongeza idadi maalumu.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: na kuwapeleka Dameski
  rationale: Yambwa lililoachwa wazi katika Kiebrania linarejelea mateka; kiwakilishi ‘-wa-’ kinahitajika katika Kiswahili cha kawaida.
- source_word: וְגַם ... נִתָּן
  choice: Pia alitiwa
  rationale: Huhifadhi nguvu ya nyongeza na kauli tendwa, ambayo inarudia wazo la kukabidhiwa chini ya mamlaka ya mwingine.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya cheo na jina la taifa.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: naye akamshinda vibaya sana
  rationale: Kwa muktadha wa kijeshi, מַכָּה גְדוֹלָה huonyesha pigo au kushindwa kukubwa. Kiswahili hiki ni cha asili; tanbihi huhifadhi taswira halisi ya ‘pigo kubwa.’
theological_decisions:
- issue: Uhusika wa Mungu katika kushindwa kwa Ahazi
  choice: Yahwe ndiye anayemtia Ahazi mikononi mwa wafalme wa kigeni, huku tendo la pili likielezwa kwa kauli tendwa.
  alternative: Kueleza matukio kama matokeo ya kisiasa au kijeshi pekee.
  rationale: Kiebrania kinatumia נתן mara mbili, kwanza kwa kumtaja Yahwe waziwazi na kisha kwa kauli tendwa. Tafsiri huhifadhi uhusika huo bila kuongeza maelezo ya kitheolojia yasiyosemwa.
- issue: Jinsi ya kutafsiri jina la Mungu
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina tetragramu יְהוָה. Kutumia ‘Yahwe’ huhifadhi jina binafsi badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umefanywa kuwa wa kawaida kwa wasomaji wa leo, huku taswira muhimu ya ‘mikononi mwa,’ jina Yahwe, kauli tendwa, na uwezekano wa maana za maneno ya kijeshi vikihifadhiwa katika matini au tanbihi.
