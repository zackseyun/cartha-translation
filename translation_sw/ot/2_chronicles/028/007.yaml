base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: sw
  text: Zikri, shujaa wa Efraimu,[a] akawaua Maaseya mwana wa mfalme, Azrikamu msimamizi wa nyumba ya kifalme,[b] na Elkana, aliyekuwa wa pili baada ya mfalme.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpiganaji hodari wa Efraimu” au “shujaa kutoka Efraimu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “msimamizi wa nyumba”; huenda “nyumba” hapa ni ikulu au kaya ya kifalme.'
    reason: lexical_alternative
  - marker: c
    text: Au “naibu wa mfalme” au “mtu wa pili kwa cheo baada ya mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: akawaua
  rationale: Kitenzi הרג humaanisha kuua; umbo la usimulizi “akawaua” linaeleweka kwa kawaida na linawahusisha watu watatu wanaotajwa.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili huku likibaki karibu na Kiebrania.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: shujaa wa Efraimu
  rationale: גִּבּוֹר inaweza kumaanisha shujaa, mpiganaji hodari, au mtu mwenye nguvu. “Shujaa wa Efraimu” ni ya asili na huhifadhi maana pana ya hadhi na uhodari.
- source_word: מַעֲשֵׂיָהוּ
  choice: Maaseya
  rationale: Jina la mtu limetoholewa kwa namna inayofaa matamshi ya Kiswahili.
- source_word: בֶּן הַמֶּלֶךְ
  choice: mwana wa mfalme
  rationale: Tafsiri hii inafuata muundo wa Kiebrania bila kuamua zaidi ya maandishi kama alikuwa mwana wa pekee.
- source_word: עַזְרִיקָם
  choice: Azrikamu
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa Kiswahili.
- source_word: נְגִיד הַבָּיִת
  choice: msimamizi wa nyumba ya kifalme
  rationale: נְגִיד humaanisha kiongozi au afisa mwenye mamlaka, na הַבָּיִת katika muktadha huu wa kifalme yaelekea ni nyumba ya mfalme, yaani ikulu au kaya ya kifalme. “Msimamizi” haibainishi cheo hicho kupita kiasi.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: aliyekuwa wa pili kwa mfalme
  rationale: מִשְׁנֶה humtaja mtu wa pili kwa cheo. Tafsiri hii huhifadhi uhusiano wa ngazi bila kuingiza cheo maalumu kisichotajwa katika maandishi.
