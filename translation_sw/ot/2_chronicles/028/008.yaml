base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: sw
  text: 'Wana wa Israeli wakachukua mateka laki mbili kutoka kwa ndugu zao[a]: wanawake, wana, na mabinti. Pia wakateka nyara nyingi kutoka kwao, wakaleta nyara hizo Samaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zao” au “Waisraeli wenzao.” Kiebrania kinasema “ndugu zao,” kikikazia uhusiano wao wa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: wakachukua mateka
  rationale: Kitenzi שבה kinaeleza kuwachukua watu mateka vitani; kauli hii inahifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Tafsiri hii ya karibu inalingana na lugha ya undugu inayofuata na kukazia kwamba mapambano yalikuwa ndani ya ukoo mpana wa Israeli.
- source_word: מֵאֲחֵיהֶם
  choice: kutoka miongoni mwa ndugu zao
  rationale: Neno אָח linaweza kumaanisha ndugu wa damu, jamaa, au watu wa taifa moja. “Ndugu zao” huhifadhi picha ya kifamilia na uzito wa kimaadili wa kifungu.
- source_word: מָאתַיִם אֶלֶף
  choice: watu laki mbili
  rationale: Hii ni namna ya kawaida na iliyo wazi ya kutaja 200,000 kwa Kiswahili; “watu” hufanya idadi ya makundi yanayofuata ieleweke bila kubadili maana.
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: wanawake, wana na mabinti
  rationale: Huhifadhi makundi yote matatu na tofauti za kijinsia zilizotajwa katika Kiebrania, bila kuyajumlisha yote kuwa “watoto.”
- source_word: שָׁלָל רָב ... הַשָּׁלָל
  choice: nyara nyingi ... nyara hizo
  rationale: “Nyara” ni mali inayotwaliwa vitani, na kurudia nomino hiyo hudumisha urudiaji wa Kiebrania.
- source_word: בָּזְזוּ
  choice: wakateka nyara
  rationale: Kauli hii ni ya asili katika Kiswahili na inaeleza kutwaa mali kama nyara za vita.
- source_word: לְשֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo jina la mahali linalotumika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Lugha ya undugu katika vita kati ya watu wa Israeli
  choice: ndugu zao
  alternative: jamaa zao / Waisraeli wenzao
  rationale: '“Ndugu zao” huhifadhi kwa makusudi mvutano wa kifungu: waliotekwa hawakuwa tu maadui wa kigeni bali watu wenye undugu na watekaji wao. Tanbihi inaonyesha upana wa maana bila kuufuta.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa “Wana wa Israeli” na “wana na mabinti” umehifadhiwa kwa ukaribu na chanzo, huku mpangilio wa sentensi ukifanywa kuwa wazi na wa kawaida kwa msomaji wa leo.
