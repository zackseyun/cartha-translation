id: 2CH.28.1
reference: 2 Chronicles 28:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: sw
  text: Ahazi alikuwa na umri wa miaka ishirini alipoanza kutawala, naye akatawala miaka kumi na sita huko Yerusalemu. Hakufanya yaliyo sawa machoni pa Yahwe kama Daudi, baba yake,[a] alivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “baba yake” humaanisha babu wa nasaba ya kifalme, yaani mtangulizi wa Ahazi katika ukoo wa kifalme, si baba yake wa moja kwa moja.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: alikuwa na umri wa miaka ishirini
  rationale: Hii ni kauli ya kawaida ya Kiebrania ya kutaja umri. Tafsiri hii inatoa maana yake kwa Kiswahili cha kawaida bila kunakili kihalisi usemi usio wa asili, ‘mwana wa miaka ishirini.’
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati Ahazi alipoingia katika ufalme. ‘Alipoanza kutawala’ ni wa kawaida na sahihi katika taarifa za wafalme.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki kinamaanisha kutenda kazi ya kifalme au kutawala, si kuwa na cheo cha mfalme tu.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Hiki ni kirai cha mahali kinachoonyesha makao ya utawala wake; ‘huko’ kinaunganisha sentensi kwa Kiswahili cha asili.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: Hakufanya yaliyo sawa
  rationale: Hii inahifadhi tathmini ya kimaadili ya kauli ya Kiebrania kwa lugha ya kawaida na yenye hadhi.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ya tathmini ya Mungu, huku ikisomeka kwa urahisi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kwa umbo la kawaida la Kiswahili ‘Yahwe,’ badala ya kubadilishwa na cheo.
- source_word: כְּדָוִיד אָבִיו
  choice: kama Daudi, baba yake, alivyofanya
  rationale: Maneno ‘alivyofanya’ yanaeleweka kutokana na kitenzi kilichotangulia na yanafanya ulinganisho uwe wazi. ‘Baba yake’ huhifadhi nahau ya kifalme ya Kiebrania, na tanbihi inaeleza kuwa Daudi alikuwa babu wa ukoo, si mzazi wa moja kwa moja.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kwa umbo linalofaa tahajia na matamshi ya Kiswahili badala ya kulibadilisha na cheo.
- issue: Maana ya אָבִיו (‘baba yake’) kuhusu Daudi
  choice: Kuhifadhi ‘baba yake’ katika maandishi na kufafanua katika tanbihi kuwa ni babu wa ukoo wa kifalme
  alternative: Kutafsiri moja kwa moja ‘babu yake wa ukoo’
  rationale: Nahau ya Kiebrania inaweza kumwita babu wa ukoo ‘baba.’ Kuhifadhi usemi huo kunaendeleza picha ya nasaba ya kifalme, huku tanbihi ikizuia dhana kwamba Daudi alikuwa mzazi wa moja kwa moja wa Ahazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa taarifa ya kifalme umewekwa kwa mtiririko wa asili wa Kiswahili, na tathmini ya kimaadili pamoja na sitiari ‘machoni pa Yahwe’ zimehifadhiwa.
