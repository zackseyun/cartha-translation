  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: sw
  text: Pia alifukiza uvumba katika Bonde la Ben-Hinomu, na akawateketeza wanawe katika moto[a], kwa kufuata machukizo ya mataifa ambayo Yahwe alikuwa ameyafukuza mbele ya Waisraeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawapitisha wanawe katika moto.” Kiebrania hapa kinasema kwa maana ya moja kwa moja zaidi, “akawateketeza wanawe katika moto.”
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: alifukiza uvumba
  rationale: Hifili ya קטר humaanisha kusababisha moshi wa ibada kupanda, na mara nyingi hasa kufukiza uvumba au kuteketeza sadaka. Katika muktadha huu, “alifukiza uvumba” ni usemi wa kawaida na ulio wazi bila kuongeza maelezo yasiyo katika kitenzi.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: katika Bonde la Ben-Hinomu
  rationale: Hili ni jina la mahali. “Ben-Hinomu” linahifadhi jina la Kiebrania kwa unukuzi na halileti maana za baadaye zinazohusishwa na Gehena.
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: akawateketeza wanawe motoni
  rationale: Hifili ya בער pamoja na “motoni” inaelekea kumaanisha kuwateketeza kweli. “Wanawe” huhifadhi wingi wa kiume wa בָּנָיו, huku “akawateketeza” ikihifadhi ukali wa usemi wa chanzo.
- source_word: כְּתוֹעֲבוֹת
  choice: kwa kufuata machukizo ya
  rationale: כְּ hapa huonyesha kufanana au kufuata kielelezo. “Kwa kufuata machukizo ya” ni Kiswahili cha asili kinachohifadhi hukumu kali ya kimaadili ya תועבות; hata hivyo, kinaweza kueleweka kuwa matendo yenye kuchukiza, si vitu tu.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno linarejelea mataifa yaliyokuwa yakikaa katika nchi. “Mataifa” ni tafsiri ya kawaida isiyobeba maana ya kidhehebu.
- source_word: הֹרִישׁ
  choice: alikuwa ameyafukuza
  rationale: Hifili ya ירש hapa ina maana ya kuwafanya wakaaji wa awali waondoke na kupoteza milki yao. “Ameyafukuza” ni wazi na ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: mbele ya Waisraeli
  rationale: Msemo מִפְּנֵי unaonyesha kuondolewa mbele ya au kutoka katika uwepo wa wengine. “Waisraeli” ni Kiswahili cha kawaida na cha asili kwa בְּנֵי יִשְׂרָאֵל katika rejeo hili la taifa.
theological_decisions:
- issue: Ikiwa maelezo ya dhabihu ya watoto yapunguzwe ukali kuwa “aliwapitisha wanawe motoni”
  choice: Maandishi makuu yanasema “akawateketeza wanawe motoni.”
  alternative: akawapitisha wanawe motoni
  rationale: Kiebrania kimetumia בער, si fomula iliyo wazi יותר ya “kupitisha motoni.” Tafsiri kuu kwa hiyo inahifadhi ukali wa maneno ya aya, huku tafsiri nyingine inayojulikana ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo umewekwa karibu na Kiebrania, lakini nahau zimefanywa za asili kwa Kiswahili. Alama ya tanbihi [a] imewekwa mara tu baada ya kifungu kinachohusika.
