  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: sw
  text: Nao Wafilisti walikuwa wamevamia miji ya Shefela na Negebu ya Yuda. Wakateka Beth-shemeshi, Aiyaloni, Gederothi, Soko pamoja na vijiji vyake, Timna pamoja na vijiji vyake, na Gimzo pamoja na vijiji vyake; nao wakaishi humo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Nao Wafilisti
  rationale: Jina la watu limetolewa kwa umbo la kawaida la Kiswahili, na kiunganishi cha Kiebrania kimehifadhiwa ili kuendeleza simulizi.
- source_word: פָּשְׁטוּ
  choice: walikuwa wamevamia
  rationale: Katika muktadha huu wa kijeshi, kitenzi kinaeleza uvamizi au mashambulizi ya ghafla. Wakati huu wa kitenzi unaonyesha tukio la usuli kabla ya kutajwa kwa miji iliyotekwa.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: miji ya Shefela na Negebu ya Yuda
  rationale: Shefela na Negebu yamehifadhiwa kama majina ya maeneo maalumu ya kijiografia badala ya kufasiriwa kwa maneno ya jumla kama “nchi tambarare” na “kusini.”
- source_word: וַיִּלְכְּדוּ
  choice: Wakateka
  rationale: Ni kitenzi cha kawaida cha kijeshi kinachoeleza kuitwaa miji kwa nguvu.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-shemeshi
  rationale: Jina la mahali limetoholewa kwa matamshi na tahajia zinazoeleweka katika Kiswahili.
- source_word: אַיָּלוֹן
  choice: Aiyaloni
  rationale: Jina la mahali limetoholewa kwa mfumo wa kawaida wa Kiswahili.
- source_word: הַגְּדֵרוֹת
  choice: Gederothi
  rationale: Jina hili la mahali limetoholewa badala ya kutafsiriwa.
- source_word: שׂוֹכוֹ
  choice: Soko
  rationale: Tahajia hii inawakilisha jina la mahali kwa urahisi katika Kiswahili; tofauti za “Soco” au “Sokoh” ni hasa tofauti za tahajia katika lugha nyingine.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: pamoja na vijiji vyake
  rationale: Maana ya moja kwa moja ni “binti zake,” lakini huu ni msemo unaorejelea vijiji au makazi madogo yaliyo chini ya mji mkuu. Tafsiri hii inatoa maana ya msemo kwa Kiswahili cha sasa.
- source_word: תִּמְנָה
  choice: Timna
  rationale: Jina la mahali limetoholewa bila kutafsiriwa.
- source_word: גִּמְזוֹ
  choice: Gimzo
  rationale: Jina la mahali limetoholewa bila kutafsiriwa.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: nao wakaishi humo
  rationale: Kitenzi kinaonyesha kwamba Wafilisti walikaa katika miji hiyo baada ya kuiteka. “Wakaishi humo” ni cha asili na hakiongezi maana isiyo wazi ya kuanzisha makazi mapya.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Majina ya maeneo maalumu yamehifadhiwa kwa utohozi, huku msemo wa Kiebrania “binti zake” ukitafsiriwa kwa maana yake ya kawaida, “vijiji vyake.” Hakuna tanbihi iliyowekwa kwa tofauti ya tahajia ya Soko kwa sababu si tofauti ya maana katika maandishi ya Kiebrania.
