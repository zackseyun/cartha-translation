source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: sw
  text: Ndipo wale watu waliokuwa wametajwa kwa majina wakasimama na kuwashughulikia mateka. Wakawavika kwa nguo kutoka katika nyara wale wote waliokuwa uchi miongoni mwao. Wakawavisha, wakawavalisha viatu, wakawalisha, wakawanywesha, wakawapaka mafuta, na wakawapandisha punda wote waliokuwa dhaifu miongoni mwao na kuwaongoza. Wakawapeleka Yeriko, mji wa mitende, kwa ndugu zao[a]; kisha wakarudi Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zao” au “Waisraeli wenzao.”
    reason: Neno la Kiebrania אֲחֵיהֶם lina maana ya msingi ya “ndugu zao,” lakini hapa linaweza kutumiwa kwa maana pana ya watu wa ukoo au taifa moja.
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: waliokuwa wametajwa kwa majina
  rationale: Kauli tendwa ya נקב pamoja na בְשֵׁמוֹת inaonyesha kwamba watu hao walitambulishwa waziwazi kwa majina. Tafsiri hii ni ya kawaida na haiongezi wazo lisiloelezwa moja kwa moja kwamba waliteuliwa rasmi.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: kuwashughulikia mateka
  rationale: Katika muktadha huu wa kuwatunza mateka, החזיק ב haimaanishi kuwakamata kwa uhasama, bali kuwachukua chini ya uangalizi na kuwahudumia. ‘Kuwashughulikia’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: מַעֲרֻמֵּיהֶם
  choice: wale wote waliokuwa uchi miongoni mwao
  rationale: Neno hili linawahusu watu waliokuwa uchi au waliovuliwa nguo ndani ya kundi la mateka. Muundo huu ni wa asili zaidi kuliko tafsiri sisisi kama ‘walio uchi wao.’
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: wakawavika nguo zilizotokana na nyara
  rationale: Kirai kinaonyesha kwamba nguo walizowapa zilitolewa katika nyara. Muundo huu unaweka wazi chanzo cha nguo bila kupanua maana.
- source_word: וַיַּלְבִּשׁוּם
  choice: wakawavika
  rationale: Tafsiri ya moja kwa moja ya kausativi ya לבשׁ; marudio yamedumishwa kwa sababu yapo pia katika Kiebrania na yanatilia mkazo huduma yao.
- source_word: וַיַּנְעִלוּם
  choice: wakawavalisha viatu
  rationale: Kitenzi kinahusu kuwapatia au kuwavalisha kitu cha miguuni. ‘Viatu’ ni neno la kawaida na halilazimishi aina maalumu isiyotajwa na maandishi.
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: wakawalisha, wakawanywesha
  rationale: Vitenzi hivi vya kausativi vinatafsirika kwa usahihi na kwa ufupi kwa vitenzi vya Kiswahili ‘kulisha’ na ‘kunywesha.’
- source_word: וַיְסֻכוּם
  choice: wakawapaka mafuta
  rationale: סוך hapa inaelekea kumaanisha kupaka mafuta kwa ajili ya kuwaburudisha au kuwatunza, si lazima tendo la sherehe. Tafsiri hii huhifadhi maana halisi bila kuingiza dhana ya kiibada.
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: wote waliokuwa dhaifu wakawasafirisha kwa punda
  rationale: נהל huonyesha kuwaongoza au kuwapeleka kwa uangalifu, huku כושל ikimaanisha anayejikwaa au kudhoofika. Katika muktadha huu, ‘kuwasafirisha kwa punda’ huonyesha kwa kawaida kwamba walio dhaifu walipelekwa wakiwa juu ya punda.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: Yeriko, mji wa mitende
  rationale: Hii ni lakabu ya Yeriko inayotafsiriwa kwa uwazi na kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya אֲחֵיהֶם katika muktadha wa undugu wa taifa
  choice: ndugu zao
  alternative: jamaa zao; Waisraeli wenzao
  rationale: אֲחֵיהֶם kwa umbo ni ‘ndugu zao,’ lakini katika muktadha inaweza kuashiria watu wa ukoo au taifa moja. Maandishi makuu yanadumisha sitiari ya kindugu, na tanbihi inaonyesha upana unaowezekana wa maana bila kuufunga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa msomaji wa kawaida wa leo. Mfululizo wa vitenzi vyenye ‘waka-’ umedumishwa ili kuakisi mwendo na msisitizo wa simulizi la Kiebrania. Tanbihi [a] imewekwa baada ya ‘ndugu zao,’ ambako inahusika kimaana.
