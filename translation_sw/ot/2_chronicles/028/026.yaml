  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari unahifadhi msisitizo wa הִנָּם kwa ‘tazama’ na mvutano wa kifungu cha wakati ‘wa mwanzo na wa mwisho,’ bila kuingiza ufafanuzi wa kimadhehebu.
