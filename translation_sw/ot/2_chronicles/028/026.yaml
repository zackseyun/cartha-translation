  text: וְ/יֶ֤תֶר דְּבָרָי/ו֙ וְ/כָל דְּרָכָ֔י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/026.yaml
  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: sw
  text: Matendo yake mengine na mwenendo wake wote, wa mwanzo na wa mwisho—tazama, yameandikwa katika Kitabu cha Wafalme wa Yuda na Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: Matendo yake mengine
  rationale: Katika muhtasari wa kifalme, דְּבָרָיו hurejelea mambo au matendo ya mfalme, si maneno yake tu. Kiswahili hiki ni cha kawaida na kinafaa muktadha wa kihistoria.
- source_word: וְכָל דְּרָכָיו
  choice: na mwenendo wake wote
  rationale: דְּרָכָיו, kihalisi ‘njia zake,’ hapa hueleza mwenendo au namna alivyoishi. ‘Mwenendo wake wote’ huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: wa mwanzo na wa mwisho
  rationale: Jozi hii inaonyesha kipindi chote cha utawala wake kwa mpangilio wa wakati. Tafsiri inadumisha umbo la Kiebrania bila kulainisha kuwa ‘tangu mwanzo hadi mwisho.’
- source_word: הִנָּם
  choice: tazama
  rationale: Neno hili lina msisitizo wa kuelekeza usikivu. ‘Tazama’ huhifadhi msisitizo huo na inafaa mtindo wenye hadhi wa taarifa hii ya kumbukumbu.
- source_word: כְּתוּבִים
  choice: yameandikwa
  rationale: Hii ni tafsiri ya moja kwa moja ya kitenzi-tendaji cha hali ya kutendwa, huku ikibaki ya kawaida katika fomula ya kutaja maandishi ya rejea.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni ‘juu ya,’ katika fomula ya kurejelea maandishi Kiswahili cha kawaida husema habari zimeandikwa ‘katika’ kitabu.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: cha Wafalme wa Yuda na Israeli
  rationale: Kirai hiki kinachukuliwa kama jina la hati ya chanzo inayotajwa na Mwandishi wa Mambo ya Nyakati, hivyo herufi kubwa zinatumika katika ‘Kitabu’ na ‘Wafalme.’
