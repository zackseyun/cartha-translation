  text: וַ/יְזַבֵּ֧חַ וַ/יְקַטֵּ֛ר בַּ/בָּמ֖וֹת וְ/עַל הַ/גְּבָע֑וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: sw
  text: Akatoa dhabihu na kufukiza uvumba mahali pa juu[a], juu ya vilima, na chini ya kila mti wenye majani mabichi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akatoa dhabihu na kuteketeza sadaka mahali pa juu, juu ya vilima, na chini ya kila mti wenye majani mabichi.”
    reason: Mbadala huu huhifadhi maana pana ya וַיְקַטֵּר, ambayo inaweza kumaanisha kufanya sadaka itoe moshi, si kufukiza uvumba pekee.
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Akatoa dhabihu
  rationale: Kitenzi זבח katika piel humaanisha kufanya au kutoa dhabihu. “Akatoa dhabihu” ni Kiswahili cha kawaida, wazi, na chenye hadhi.
- source_word: וַיְקַטֵּר
  choice: na kufukiza uvumba
  rationale: Kitenzi קטר katika piel mara nyingi humaanisha kufukiza uvumba, ingawa kinaweza pia kueleza kuteketeza sadaka ili moshi wake upande. Muktadha wa ibada unaunga mkono tafsiri ya kawaida “kufukiza uvumba,” huku maana pana ikihifadhiwa katika tanbihi.
- source_word: בַּבָּמוֹת
  choice: mahali pa juu
  rationale: במות ni neno la kiibada linalotaja maeneo ya ibada yaliyojengwa au kutumiwa kwa ibada. Kauli ya jadi “mahali pa juu” huhifadhi maana ya istilahi hiyo na mwangwi wake katika Agano la Kale bila kuifafanua moja kwa moja kuwa ibada ya kipagani.
- source_word: וְעַל הַגְּבָעוֹת
  choice: juu ya vilima
  rationale: גבעות ni vilima kwa maana ya kawaida. Tafsiri hii inatofautisha vilima halisi na istilahi ya kiibada “mahali pa juu.”
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: na chini ya kila mti wenye majani mabichi
  rationale: רענן hueleza mmea ulio mbichi, wenye uhai, au wenye majani mengi. “Mti wenye majani mabichi” ni kauli ya asili katika Kiswahili na huhifadhi taswira ya Kiebrania.
theological_decisions:
- issue: Kauli za maeneo yanayohusishwa na ibada isiyoruhusiwa
  choice: Kuhifadhi “mahali pa juu” na “chini ya kila mti wenye majani mabichi” bila kuziita moja kwa moja madhabahu za kipagani
  alternative: Kutafsiri kwa ufafanuzi kama “kwenye madhabahu za kipagani” au “kwenye vituo vya ibada ya sanamu”
  rationale: Kiebrania kinatumia lugha ya kawaida ya kiibada ambayo katika muktadha inaashiria ibada isiyoruhusiwa. Kuihifadhi huepuka kuingiza ufafanuzi wa kitheolojia ndani ya maneno yenyewe na kudumisha uhusiano na vifungu vingine vya Agano la Kale.
- issue: Maana pana ya וַיְקַטֵּר
  choice: “kufukiza uvumba” katika matini, huku uwezekano wa kuteketeza sadaka ukitajwa katika tanbihi
  alternative: “kuteketeza sadaka” katika matini kuu
  rationale: Kitenzi kinaweza kurejelea uvumba au moshi wa sadaka kwa upana. Tafsiri kuu inatumia maana iliyozoeleka na ya asili, lakini tanbihi huhifadhi utata halisi wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja. “Mahali pa juu” limetumiwa kama istilahi ya kiibada, huku “juu ya vilima” ikirejelea maeneo ya kijiografia.
