base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: sw
  text: Basi wale askari wakaacha mateka na nyara mbele ya maofisa na kusanyiko lote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jumuiya yote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mali iliyotekwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: wakaacha
  rationale: Kitenzi עזב hapa kinaonyesha kuwa askari waliachia mateka na nyara na kuziweka chini ya mamlaka ya viongozi na kusanyiko; “wakaacha” ni tafsiri ya kawaida isiyoongeza wazo la kuwatelekeza kabisa.
- source_word: הֶחָלוּץ
  choice: wale askari
  rationale: Neno hili linawataja watu waliokuwa wamejiandaa kwa vita. Katika muktadha huu “wale askari” ni Kiswahili cha kawaida na chenye kueleweka, huku “wale” likirejelea kundi lililotajwa katika simulizi lililotangulia.
- source_word: הַשִּׁבְיָה
  choice: mateka
  rationale: Ingawa nomino hii inaweza kumaanisha hali ya utumwa, hapa inawataja kwa uhalisi watu waliotekwa vitani; “mateka” huhifadhi maana hiyo.
- source_word: הַבִּזָּה
  choice: nyara
  rationale: Neno hili humaanisha mali iliyotwaliwa vitani. “Nyara” ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Kirai hiki huhifadhi maana ya mahali na pia tendo kufanywa hadharani katika uwepo wa wenye mamlaka na kusanyiko.
- source_word: הַשָּׂרִים
  choice: maofisa
  rationale: שׂרים hapa ni watu wenye mamlaka wanaosimamia jambo hili. “Maofisa” huepuka maana finyu ya wana wa mfalme au makamanda wa kijeshi pekee.
- source_word: כָל הַקָּהָל
  choice: kusanyiko lote
  rationale: קהל humaanisha jumuiya iliyokusanyika. “Kusanyiko lote” ni ya kawaida, pana, na haina maana finyu ya ibada pekee.
