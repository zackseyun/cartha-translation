  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: sw
  text: Alifuata njia za wafalme wa Israeli, na pia akatengeneza sanamu za kutupwa kwa ajili ya Mabaali.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania humaanisha hasa sanamu zilizotengenezwa kwa kutupwa, yaani kwa kumimina nyenzo iliyoyeyushwa katika kalibu.
