  - marker: b
    text: Kiebrania kina neno la wingi, “Mabaali,” ambalo huenda likarejelea maumbo au madhihirisho mbalimbali ya ibada ya Baali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: Alienda katika njia za
  rationale: Inahifadhi sitiari ya Kiebrania ya kwenda katika njia fulani, yaani kuishi au kutenda kwa kufuata mwenendo fulani, bila kuifafanua kupita kiasi.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: wafalme wa Israeli
  rationale: Ni uwasilishaji wa moja kwa moja wa muundo wa Kiebrania na unadumisha rejeo la kihistoria kwa wafalme wa ufalme wa Israeli.
- source_word: וְגַם
  choice: na pia
  rationale: Inaonyesha kwamba kutengeneza sanamu kulikuwa kosa la ziada baada ya kufuata njia za wafalme wa Israeli.
- source_word: מַסֵּכוֹת
  choice: sanamu za kusubu
  rationale: Neno hili linarejelea vitu vilivyotengenezwa kwa kumimina chuma kilichoyeyushwa katika kalibu; 'za kusubu' huhifadhi maana hiyo mahususi kuliko 'sanamu' peke yake.
- source_word: עָשָׂה
  choice: akatengeneza
  rationale: Kitenzi hiki cha kawaida kinawasilisha kwa kawaida tendo la kutengeneza sanamu hizo.
- source_word: לַבְּעָלִים
  choice: kwa ajili ya Mabaali
  rationale: Huhifadhi wingi ulio wazi katika Kiebrania na kuonyesha kwamba sanamu hizo zilihusishwa na maumbo au madhihirisho mbalimbali ya ibada ya Baali.
theological_decisions:
- issue: Wingi wa בְּעָלִים
  choice: Mabaali
  alternative: Baali; sanamu za Baali
  rationale: Kiebrania kina wingi dhahiri. 'Mabaali' hudumisha mvutano huo wa maandishi badala ya kuusawazisha kuwa jina la umoja.
- issue: Sitiari ya kutembea/kwenda katika njia kwa maana ya mwenendo
  choice: Alienda katika njia za wafalme wa Israeli
  alternative: Alifuata mienendo ya wafalme wa Israeli
  rationale: Chaguo hili linahifadhi taswira ya chanzo huku maana ya mwenendo ikibaki kueleweka katika Kiswahili cha kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Sanamu za kusubu' limetumiwa kuhifadhi wazo la sanamu zilizotengenezwa kwa kumimina chuma kilichoyeyushwa; 'Mabaali' linahifadhi wingi wa Kiebrania.
