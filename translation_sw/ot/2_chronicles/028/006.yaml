base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: sw
  text: Peka mwana wa Remalia aliwaua watu laki moja na ishirini katika Yuda katika siku moja[a]. Wote hao walikuwa wanaume mashujaa[b], kwa sababu walikuwa wamemwacha Yahwe[c], Mungu wa baba zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa siku moja.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa uhodari”; yaani, wanaume mashujaa.'
    reason: lexical_alternative
  - marker: c
    text: Au “walipomwacha Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: aliwaua
  rationale: Kitenzi הרג humaanisha kuua moja kwa moja; “aliwaua” ni Kiswahili cha kawaida na wazi.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Kihusishi ב hapa kinaonyesha mahali, yaani mauaji yalitokea katika ufalme au eneo la Yuda.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: watu laki moja na ishirini
  rationale: Hii ni idadi ya moja kwa moja; kuongeza “watu” kunafanya kishamirisho cha kitenzi kiwe wazi na cha asili katika Kiswahili.
- source_word: בְּיוֹם אֶחָד
  choice: kwa siku moja
  rationale: Hutafsiri muundo wa Kiebrania kwa njia ya asili na kuhifadhi msisitizo kwamba idadi hiyo iliuawa ndani ya siku moja tu.
- source_word: הַכֹּל
  choice: wote
  rationale: Neno hili linajumlisha watu waliouawa waliotajwa kabla yake.
- source_word: בְּנֵי חָיִל
  choice: mashujaa
  rationale: Kirai hicho, kihalisi “wana wa uhodari/nguvu,” hapa hurejelea wanaume hodari, hasa wapiganaji; “mashujaa” ni fasaha na kifupi.
- source_word: בְּעָזְבָם
  choice: kwa sababu walikuwa wamemwacha
  rationale: ב pamoja na kitenzi-jina inaweza kuonyesha sababu au wakati. Muktadha wa Mwandishi wa Mambo ya Nyakati unaunga mkono sababu, huku tanbihi ikihifadhi uwezekano wa maana ya wakati.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo “BWANA.”
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: Mungu wa baba zao
  rationale: Huhifadhi kirai cha kihistoria na kifamilia cha Kiebrania kinachotumiwa katika muktadha wa agano.
theological_decisions:
- issue: Maana ya בְּעָזְבָם kuhusiana na mauaji
  choice: 'sababu: “kwa sababu walikuwa wamemwacha”'
  alternative: 'wakati: “walipomwacha”'
  rationale: Muktadha unaonyesha msiba wa kijeshi kama matokeo ya kumwacha Mungu, lakini muundo wa Kiebrania unaweza pia kuwa wa wakati; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa wasomaji wa kawaida huku ikihifadhi jina Yahwe, lugha ya agano, na uwezekano wa kisababishi au wa wakati katika בְּעָזְבָם.
