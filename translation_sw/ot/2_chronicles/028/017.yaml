  text: The Edomites had also come and attacked Judah and carried away captives[a].
translation:
  language: sw
  text: Pia Waedomu walikuja, wakaishambulia Yuda na kuwachukua watu mateka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaipiga Yuda na kuchukua mateka.” Kiebrania kinatumia kitenzi cha kawaida cha kijeshi kinachomaanisha “kupiga,” pamoja na maneno yenye mzizi mmoja yanayohusu kuteka mateka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: Pia
  rationale: Katika muktadha huu, neno hili linaongeza uvamizi mwingine katika mfululizo wa mashambulizi dhidi ya Yuda.
- source_word: אֲדוֹמִים
  choice: Waedomu
  rationale: Wingi huu wa jina la watu unamaanisha watu wa Edomu, si nchi ya Edomu pekee.
- source_word: בָּאוּ
  choice: walikuja
  rationale: Kitenzi kinaeleza tukio lililokamilika; wakati uliopita wa Kiswahili unafaa katika simulizi hili.
- source_word: וַיַּכּוּ
  choice: wakaishambulia
  rationale: Ingawa maana ya msingi ni ‘kupiga,’ katika muktadha wa kijeshi ‘kuishambulia’ ni ya asili na haidai ushindi kamili ambao Kiebrania hakitaji wazi.
- source_word: בִיהוּדָה
  choice: Yuda
  rationale: Baada ya kitenzi ‘kuishambulia,’ Yuda hutumiwa kwa kawaida kama yambwa; kiambishi cha mahali au mwelekeo katika Kiebrania kinawasilishwa kiasili kwa muundo huu.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: na kuwachukua watu mateka
  rationale: Kitenzi na nomino vina mzizi unaohusiana na kuteka; tafsiri hii ya kawaida ya Kiswahili inahifadhi maana bila marudio yasiyo ya asili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo ‘walikuja, wakaishambulia’ unaendeleza mwendo wa simulizi, huku ‘watu mateka’ ikifafanua kwa urahisi kwamba waliochukuliwa walikuwa watu.
