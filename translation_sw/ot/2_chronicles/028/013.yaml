source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לָ/הֶ֗ם לֹא תָבִ֤יאוּ אֶת הַ/שִּׁבְיָה֙ הֵ֔נָּה כִּי֩ לְ/אַשְׁמַ֨ת יְהוָ֤ה עָלֵ֨י/נוּ֙ אַתֶּ֣ם אֹמְרִ֔ים לְ/הֹסִ֥יף עַל חַטֹּאתֵ֖י/נוּ וְ/עַל אַשְׁמָתֵ֑י/נוּ כִּֽי רַבָּ֤ה אַשְׁמָה֙ לָ֔/נוּ וַ/חֲר֥וֹן אָ֖ף עַל יִשְׂרָאֵֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: sw
  text: Nao wakawaambia, “Msiwalete mateka hapa! Kwa maana mnakusudia kuongeza kwenye dhambi zetu na hatia yetu, na hivyo kututia hatiani mbele za Yahwe[a]. Hatia yetu tayari ni kubwa, na ghadhabu kali[b] iko juu ya Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kirai kifupi ambacho pia kinaweza kutafsiriwa, “kutuletea juu yetu hatia inayotoka kwa Yahwe.” Kinaweza kusisitiza ama hatia mbele za Yahwe ama hatia na hukumu inayotoka kwake.
    reason: alternative_reading
  - marker: b
    text: Kiebrania ni “kuwaka kwa hasira,” nahau inayomaanisha ghadhabu kubwa sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: mateka
  rationale: Nomino hiyo inaweza kumaanisha hali ya utumwa au kundi la waliotekwa; katika amri ya kuwaleta hapa, maana halisi ni watu waliotekwa.
- source_word: הֵנָּה
  choice: hapa
  rationale: Ni kielezi cha mahali kinachoonyesha mwendo kuelekea walipo wasemaji; “kuwaleta ... hapa” ni Kiswahili cha kawaida.
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: kututia hatiani mbele za Yahwe[a]
  rationale: Kirai cha Kiebrania ni kifupi na kigumu. Tafsiri hii inaeleza kwa Kiswahili cha kawaida hali ya kuwajibika kwa hatia mbele za Yahwe, huku tanbihi ikihifadhi uwezekano wa msisitizo juu ya hatia au hukumu inayotoka kwa Yahwe na kuwa juu yao.
- source_word: אַתֶּם אֹמְרִים
  choice: mnakusudia
  rationale: Kihalisi ni “mnasema,” lakini katika muktadha huu usemi huo unaonyesha nia ya kufanya jambo, si kusema tu.
- source_word: לְהֹסִיף עַל
  choice: kuziongezea
  rationale: Inaonyesha kuongeza juu ya hali iliyopo tayari; kiambishi “-zi-” kinarejelea dhambi zilizo katika wingi.
- source_word: חַטֹּאתֵינוּ
  choice: dhambi zetu
  rationale: Neno la kawaida kwa matendo ya dhambi au makosa; wingi umehifadhiwa.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: hatia yetu / Hatia yetu tayari ni kubwa
  rationale: Neno hili linasisitiza hali ya kuwa na hatia au kuwajibika, tofauti na matendo yenyewe yanayotajwa kama “dhambi.” “Tayari” inaweka wazi hoja ya kuongeza hatia iliyokuwapo, bila kubadili maana ya msingi ya “kubwa.”
- source_word: וַחֲרוֹן אָף
  choice: ghadhabu kali[b]
  rationale: Ni nahau ya Kiebrania inayomaanisha ghadhabu yenye nguvu sana; “ghadhabu kali” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: עַל יִשְׂרָאֵל
  choice: iko juu ya Israeli
  rationale: “Juu ya” huhifadhi taswira ya Kiebrania ya ghadhabu inayomkalia Israeli na bado inaeleweka katika Kiswahili.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano YHWH; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: kututia hatiani mbele za Yahwe
  alternative: kutuletea hatia kutoka kwa Yahwe juu yetu
  rationale: Kirai kinaweza kusisitiza hatia yao katika uhusiano na Yahwe au hatia/hukumu wanayojiletea kutoka kwake. Maandishi makuu yanatumia Kiswahili kinachoeleweka, na tanbihi inahifadhi mvutano huo.
- issue: Utambulisho wa יִשְׂרָאֵל katika muktadha wa ufalme wa kaskazini
  choice: Israeli
  alternative: Efraimu / ufalme wa kaskazini
  rationale: Maandishi ya Kiebrania yanasema “Israeli”; jina hilo limehifadhiwa bila kufupisha maana yake ya kihistoria na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mateka,” “hatia,” na “ghadhabu” ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi tofauti za msamiati na uzito wa kifungu cha Kiebrania.
