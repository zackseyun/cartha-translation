reference: 2 Chronicles 28:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: sw
  text: Akaitolea miungu ya Damasko iliyompiga[a] dhabihu, akasema, “Kwa kuwa miungu ya wafalme wa Aramu[b] inawasaidia, nitaitolea miungu hiyo dhabihu ili inisaidie.” Lakini miungu hiyo ikawa sababu ya kumwangusha yeye na Israeli yote.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyokuwa ikimpiga” au “iliyokuwa ikimshinda.” Kitenzi kishirikishi cha Kiebrania kinaweza kueleza tendo lililokuwa likiendelea au sifa iliyohusishwa na miungu hiyo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “miungu ya wafalme wa Aramu”; neno “wafalme” liko katika wingi.'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kwa halisi zaidi: “nazo zikawa kwake za kumwangusha, na kwa Israeli yote.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Akaitolea dhabihu
  rationale: Kitenzi זבח kinaonyesha tendo la kutoa dhabihu; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: miungu ya Damasko
  rationale: אֱלֹהֵי ni wingi katika muktadha huu wa ibada ya sanamu; “Damasko” ni jina la mahali linalotumika kwa kawaida katika Kiswahili.
- source_word: הַמַּכִּים בּוֹ
  choice: iliyokuwa imemshinda
  rationale: Kirai cha Kiebrania kinaitambulisha miungu hiyo kuwa ndiyo, kwa mtazamo wa Ahazi, iliyompiga au kumshinda; wakati uliopita unaendana na simulizi, huku tanbihi ikihifadhi uwezekano wa tendo linaloendelea.
- source_word: כִּי
  choice: Kwa kuwa
  rationale: Hutambulisha sababu aliyotoa Ahazi kwa kitendo chake.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: miungu ya wafalme wa Aramu
  rationale: Tafsiri inahifadhi wingi wa neno מַלְכֵי, “wafalme,” bila kulainisha kuwa mfalme mmoja.
- source_word: מַעְזְרִים אוֹתָם
  choice: inawasaidia
  rationale: Kauli ya sasa huonyesha msaada ambao Ahazi alidhani miungu hiyo ilikuwa ikiwapa wafalme wa Aramu.
- source_word: לָהֶם אֲזַבֵּחַ
  choice: nitaitolea dhabihu
  rationale: Huhifadhi kusudi la baadaye la Ahazi la kuitolea miungu hiyo dhabihu.
- source_word: וְיַעְזְרוּנִי
  choice: ili inisaidie
  rationale: Muundo wa kusudi unaonyesha lengo la Ahazi, bila kuwasilisha msaada huo kama jambo ambalo kwa hakika lingetokea.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ
  choice: Lakini miungu hiyo ikawa sababu ya kuanguka kwake
  rationale: הכשיל katika Hifili ni kusababisha mtu ajikwae au aanguke; “lakini” huonyesha tofauti ya wazi kati ya tumaini la Ahazi na matokeo, ingawa kiunganishi cha Kiebrania ni waw.
- source_word: וּלְכָל יִשְׂרָאֵל
  choice: na kwa Israeli yote
  rationale: Kirai hiki kimeunganishwa na kuanguka kwa Ahazi na kinahifadhi upana wa athari kwa Israeli yote.
theological_decisions:
- issue: Je, miungu ya Damasko ilimshinda Ahazi kwa uhalisi, au hii ni tafsiri ya kipagani ya Ahazi?
  choice: Tafsiri inahifadhi maneno ya simulizi lakini muktadha wa “kwa maana alisema” unaonyesha mantiki ya Ahazi bila kuthibitisha kwamba miungu hiyo ilikuwa na nguvu halisi ya kimungu.
  alternative: Kufafanua moja kwa moja kwamba Ahazi alidhani miungu hiyo ndiyo iliyomshinda.
  rationale: Kiebrania kinatoa maelezo hayo kisha kinaripoti hoja ya Ahazi. Ni bora kuhifadhi mvutano na kejeli ya simulizi; sentensi ya mwisho inaonyesha kuwa ibada hiyo haikumletea msaada bali kuanguka.
- issue: Maana ya וְיַעְזְרוּנִי
  choice: “ili inisaidie,” kama kusudi alilokuwa nalo Ahazi.
  alternative: “nayo itanisaidia,” kama utabiri wa moja kwa moja.
  rationale: Muundo wa kusudi unafaa mantiki ya uamuzi wake na hauwasilishi msaada wa miungu kuwa jambo la hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio rasmi lakini unaoeleweka. “Dhabihu,” “miungu,” na “kuanguka” huhifadhi msamiati wa kidini na nguvu ya hukumu ya kifungu bila kuingiza msimamo wa dhehebu.
