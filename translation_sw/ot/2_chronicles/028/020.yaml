  text: וַ/יָּבֹ֣א עָלָ֔י/ו תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּ֥צַר ל֖/וֹ וְ/לֹ֥א חֲזָקֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: sw
  text: Ndipo Tiglath-Pileseri, mfalme wa Ashuru, akaja dhidi yake, akamletea dhiki[a], lakini hakumtia nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akambana.”
    reason: Neno la Kiebrania linaweza kueleza kumbana au kumsonga mtu, na pia kumsababishia dhiki kwa maana pana.
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: akaja dhidi yake
  rationale: Katika muktadha huu wa kisiasa na kijeshi, בוא על ina maana ya kumjia mtu kwa uhasama. Tafsiri hii inadumisha maana hiyo bila kuongeza kitendo mahsusi kama ‘kumshambulia’ ambacho hakijaelezwa moja kwa moja.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: Tiglath-Pileseri
  rationale: Hili ni umbo la jina la mfalme huyo linalosomeka kwa kawaida katika Kiswahili, huku likibaki kuwa unukuzi wa jina la asili.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa Kiebrania na hutumia jina la kawaida la eneo hilo katika Kiswahili cha Biblia.
- source_word: וַיָּצַר לוֹ
  choice: akamletea dhiki
  rationale: Kitenzi צרר hapa kinaweza kumaanisha kubana, kusumbua, au kusababisha dhiki. ‘Akamletea dhiki’ ni Kiswahili cha asili kinachowasilisha shinikizo la uhasama bila kulifinya kuwa kuzingira tu.
- source_word: וְלֹא חֲזָקוֹ
  choice: lakini hakumtia nguvu
  rationale: חזק hapa ina wazo la kumwimarisha au kumsaidia awe na nguvu. ‘Lakini’ linaonyesha kwa kawaida tofauti iliyopo kati ya dhiki aliyomletea na msaada ambao hakumpa, bila kubadili yaliyomo katika kishazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio unahifadhi mfuatano na tofauti ya vishazi vya Kiebrania; ‘dhidi yake’ inadumisha uhasama bila kuongeza maelezo ya kijeshi yasiyo wazi katika mstari.
