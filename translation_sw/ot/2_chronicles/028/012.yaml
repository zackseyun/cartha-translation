base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: sw
  text: 'Ndipo baadhi ya watu miongoni mwa viongozi wa wana wa Efraimu[a] wakasimama kuwapinga wale waliokuwa wakija kutoka jeshini: Azaria mwana wa Yehohanani, Berekia mwana wa Meshilemothi, Yehizkia mwana wa Shalumu, na Amasa mwana wa Hadlai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “baadhi ya watu miongoni mwa wakuu wa Waefraimu.” Kiebrania: “kutoka kwa wakuu wa wana wa Efraimu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakasimama
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaonyesha hatua ya uamuzi; “wakasimama” huhifadhi maana ya kusimama na, pamoja na “kuwapinga,” maana ya kuchukua msimamo wa upinzani.
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: baadhi ya watu miongoni mwa viongozi wa wana wa Efraimu[a]
  rationale: “Baadhi ya watu” huonyesha kundi lisilotajwa kwa ukamilifu, na “viongozi” huwasilisha maana ya kimajazi ya רָאשֵׁי kwa Kiswahili cha kawaida huku “wana wa Efraimu” ikihifadhi muundo wa Kiebrania.
- source_word: עַל
  choice: kuwapinga
  rationale: Pamoja na קום, kihusishi hiki kinaonyesha kusimama dhidi ya watu fulani; “kuwapinga” ni Kiswahili cha asili na huonyesha wazi tendo la kukabiliana nao bila kuongeza maelezo ya jinsi walivyofanya hivyo.
- source_word: הַבָּאִים מִן הַצָּבָא
  choice: wale waliokuwa wakitoka vitani
  rationale: Kirai kinawahusu wanajeshi waliokuwa wakija kutoka kwenye shughuli ya kijeshi. “Wakitoka vitani” ni usemi wa kawaida wa Kiswahili na huepuka usemi usio wa asili “kutoka kwa jeshi.”
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: Azaria ... Berekia ... Yehizkia ... Amasa
  rationale: Majina ya watu yamenukuliwa kwa maumbo yanayofaa mfumo wa sauti na desturi za majina ya kibiblia katika Kiswahili.
- source_word: בֶן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida wa nasaba katika Kiswahili na unalingana moja kwa moja na patronimu ya Kiebrania.
