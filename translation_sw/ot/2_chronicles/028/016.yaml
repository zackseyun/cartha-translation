  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: sw
  text: Wakati huo Mfalme Ahazi alituma kwa wafalme wa Ashuru ili wamsaidie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wafalme wa Ashuru”; baadhi ya tafsiri hutumia “mfalme wa Ashuru” ili kupatanisha usemi huu na hali ya kihistoria.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa wakati unaoweka tukio katika muktadha wa simulizi kwa Kiswahili cha asili.
- source_word: שָׁלַח
  choice: alituma ujumbe
  rationale: Kitenzi chenyewe ni ‘alituma’; kwa kuwa anayelengwa ametajwa kwa kihusishi na kusudi ni kuomba msaada, ‘alituma ujumbe’ huwasilisha maana ya muktadha kwa Kiswahili bila kudai kwamba wajumbe wametajwa wazi katika Kiebrania.
- source_word: הַמֶּלֶךְ אָחָז
  choice: Mfalme Ahazi
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kuunganisha cheo na jina la mtu.
- source_word: עַל
  choice: kwa
  rationale: Katika muundo huu pamoja na שׁלח, neno hili linaonyesha walikoelekezwa ujumbe au ombi, si uhasama dhidi yao.
- source_word: מַלְכֵי אַשּׁוּר
  choice: wafalme wa Ashuru
  rationale: Maandishi ya Kimasora yana wingi ‘wafalme’; wingi umehifadhiwa badala ya kusawazishwa na hali ya kihistoria inayotarajiwa.
- source_word: לַעְזֹר לוֹ
  choice: ili wamsaidie
  rationale: Kitenzi-jina chenye kiambishi cha nafsi kinaonyesha kusudi. Tafsiri hii ni wazi na ya kawaida, huku ikihifadhi kwamba msaada ulikusudiwa kwa Ahazi.
theological_decisions:
- issue: Iwapo wingi ‘wafalme wa Ashuru’ usawazishwe na mtawala mmoja wa Ashuru anayetarajiwa kihistoria
  choice: Kuhifadhi wingi wa Maandishi ya Kimasora katika matini kuu
  alternative: mfalme wa Ashuru
  rationale: Suala hili si la kimadhehebu, lakini ni tofauti halisi ya kimatini na kitafsiri. Kiebrania kilichopo kina wingi, hivyo matini kuu inaufuata; umoja umetajwa katika tanbihi kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Alituma ujumbe’ ni ya asili zaidi kuliko ‘alituma kwa’ katika Kiswahili, lakini tanbihi na maamuzi ya kileksika yanaweka wazi kwamba Kiebrania hakitaji wajumbe moja kwa moja.
