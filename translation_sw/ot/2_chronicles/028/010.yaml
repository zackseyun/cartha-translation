  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: sw
  text: Na sasa ninyi mnasema kwamba mtawatiisha watu wa Yuda na Yerusalemu[a] wawe watumwa wenu wa kiume na wa kike.[b] Lakini je, ninyi wenyewe pia mna hatia mbele za Yahwe Mungu wenu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “wana wa Yuda na Yerusalemu.” Kiebrania kinatumia usemi wa wingi wa kiume kuwarejelea watu hao kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtawatiisha ili wawe watumwa wa kiume na watumwa wa kike kwa ajili yenu wenyewe.”
    reason: lexical_alternative
  - marker: c
    text: Swali la mwisho limebanwa katika Kiebrania; kwa tafsiri ya karibu sana ni kama, “Je, si kweli kwamba ninyi wenyewe pia mna makosa mbele za Yahwe Mungu wenu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na maana ya wakati ya עַתָּה, huku ikianzisha karipio linalofuata kwa Kiswahili cha kawaida.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: watu wa Yuda na Yerusalemu
  rationale: Ingawa בְּנֵי kwa umbo ni ‘wana wa,’ hapa ni usemi wa kijumla unaowarejelea wakazi wa Yuda na Yerusalemu, si wanaume pekee.
- source_word: אַתֶּם אֹמְרִים
  choice: ninyi mnasema kwamba
  rationale: Kiwakilishi cha msisitizo אַתֶּם kimehifadhiwa kwa ‘ninyi,’ na kitenzi kishirikishi אֹמְרִים kinaonyesha dai au kusudi lao la sasa.
- source_word: לִכְבֹּשׁ
  choice: mtawatiisha
  rationale: כָּבַשׁ humaanisha kutiisha au kuweka chini ya mamlaka. Wakati ujao katika Kiswahili unaeleza jambo wanalosema kwamba watalifanya bila kuifanya kitenzi hiki chenyewe kimaanishe ‘kuwafanya watumwa.’
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: wawe watumwa wenu wa kiume na wa kike
  rationale: Muktadha ni wa watu waliotekwa na kulazimishwa kuwa mali ya washindi; ‘watumwa’ huonyesha hali hiyo kwa usahihi kuliko ‘watumishi,’ na tofauti ya jinsia katika nomino zote mbili imehifadhiwa.
- source_word: לָכֶם
  choice: wenu
  rationale: Kiambishi cha umilikaji kinaonyesha kwamba walikusudia kuwachukua mateka hao kwa matumizi na umiliki wao wenyewe.
- source_word: הֲלֹא רַק אַתֶּם עִמָּכֶם אֲשָׁמוֹת
  choice: Lakini je, ninyi wenyewe pia hamna hatia
  rationale: Kiebrania hapa kimebanwa na kina swali la balagha. Tafsiri hii huhifadhi karipio kwamba wao pia wana hatia, bila kudai kwa kupita kiasi jinsi רַק inavyohusiana na maneno mengine.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: mbele za Yahwe Mungu wenu
  rationale: לַיהוָה hapa huonyesha kuwajibika kwao kwa Mungu; ‘mbele za’ huwasilisha hatia yao machoni pake. Jina la agano יְהוָה limetafsiriwa ‘Yahwe.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ hulitambulisha kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya hali ya עֲבָדִים na שְׁפָחוֹת
  choice: watumwa wa kiume na wa kike
  alternative: watumishi wa kiume na wa kike
  rationale: Katika muktadha wa kutekwa vitani na kutiishwa kwa nguvu, ‘watumwa’ huonyesha hali ya kulazimishwa iliyo wazi katika kifungu bila kuipunguza kuwa huduma ya kawaida.
- issue: Nguvu ya swali la mwisho lililobanwa
  choice: ninyi wenyewe pia hamna hatia mbele za Yahwe
  alternative: je, si ninyi peke yenu mlio na makosa dhidi ya Yahwe
  rationale: Muundo wa Kiebrania una utata wa kisarufi, lakini muktadha unaonyesha wazi kwamba Odedi anawakumbusha Waisraeli hatia yao wenyewe. ‘Pia’ huhifadhi ulinganisho huo bila kutafsiri רַק kama ‘pekee’ kwa namna inayoweza kubadili hoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeundwa kwa uwazi kwa wasomaji wa kawaida, huku msisitizo wa ‘ninyi wenyewe,’ hali ya utumwa, jina ‘Yahwe,’ na ubano wenye utata wa swali la Kiebrania vikihifadhiwa.
