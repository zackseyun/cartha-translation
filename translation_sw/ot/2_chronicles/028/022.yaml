base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: sw
  text: Wakati alipokuwa katika dhiki, aliendelea kutokuwa mwaminifu kwa Yahweh—yeye, mfalme Ahazi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעֵת
  choice: Wakati
  rationale: Kirai hiki kinaweka mazingira ya wakati; “Wakati” ni cha kawaida katika Kiswahili na kinaunganika vizuri na kishazi kinachofuata.
- source_word: הָצֵר לוֹ
  choice: alipokuwa katika dhiki
  rationale: Muundo huu unaonyesha kwamba Ahazi alikuwa amebanwa au chini ya shinikizo. Tafsiri hii ni ya asili na inahifadhi maana ya hali ya dhiki.
- source_word: וַיּוֹסֶף
  choice: alizidi
  rationale: Kitenzi יסף pamoja na kitenzi-jina humaanisha kuongeza kufanya jambo au kuendelea zaidi. “Alizidi” kinadokeza mwendelezo na kuongezeka kwa mwenendo huo.
- source_word: לִמְעוֹל
  choice: kutenda kwa kukosa uaminifu
  rationale: מעל huonyesha kuvunja uaminifu, hasa kwa Mungu. Kauli hii inahifadhi tendo na uzito wake wa kidini bila kutumia neno la kizamani.
- source_word: בַּיהוָה
  choice: dhidi ya Yahweh
  rationale: Pamoja na מעל, kihusishi kinaonyesha yule ambaye uaminifu umevunjwa dhidi yake. Jina la agano יהוה limetolewa kama “Yahweh.”
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: —yeye, Mfalme Ahazi
  rationale: Kiwakilishi huru הוּא kina msisitizo. Kistari na “yeye” vinahifadhi utambulisho wenye msisitizo wa Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni, jina la agano la Mungu. “Yahweh” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Asili ya kukosa uaminifu kwa Ahazi
  choice: kutenda kwa kukosa uaminifu dhidi ya Yahweh
  alternative: kukosa tu uaminifu kwa ujumla; kufanya kosa la kiibada pekee
  rationale: מעל ina maana ya kuvunja uaminifu na hapa Yahweh ametajwa kama anayekosewa. Tafsiri haibani kosa hilo kuwa la kiibada pekee wala kuliondoa katika uhusiano wake na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida, huku msisitizo wa mwisho wa Kiebrania juu ya utambulisho wa Ahazi ukihifadhiwa.
