source:
  edition: WLC
  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: sw
  text: Kwa maana Ahazi alichukua sehemu ya mali[a] kutoka katika nyumba ya Yahwe, kutoka katika nyumba ya mfalme, na kutoka kwa wakuu[b], akampa mfalme wa Ashuru; lakini jambo hilo halikumsaidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “aligawanya” au “alitenga sehemu.” Katika muktadha huu maana ni kwamba Ahazi alichukua mali kutoka katika vyanzo hivi ili kumpa mfalme wa Ashuru.
    reason: lexical_alternative
  - marker: b
    text: Au “maafisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kwamba sentensi hii inafafanua sababu ya kauli iliyotangulia.
- source_word: חָלַק
  choice: alichukua vitu vya thamani
  rationale: Kitenzi kwa msingi kinaweza kumaanisha ‘kugawanya’ au ‘kutenga sehemu,’ lakini katika muktadha huu Ahazi aliondoa mali kutoka hekalu, ikulu, na kwa wakuu ili kumpa mfalme wa Ashuru. Tafsiri hii inaeleza tendo hilo kwa Kiswahili cha kawaida bila kulifanya kuwa uporaji wa kivita.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Inahifadhi taswira ya Kiebrania ya ‘nyumba’ na kulitaja jina la Mungu moja kwa moja.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Inadumisha ulinganifu wa maneno na ‘nyumba ya Yahwe’; katika muktadha ni makao au jumba la kifalme.
- source_word: הַשָּׂרִים
  choice: wakuu
  rationale: Neno hili linawahusu viongozi wenye mamlaka au maafisa wa ngazi ya juu; ‘wakuu’ ni pana, asilia, na linafaa katika simulizi la kifalme.
- source_word: וַיִּתֵּן לְמֶלֶךְ אַשּׁוּר
  choice: akampa mfalme wa Ashuru
  rationale: Ni uwasilishaji wa kawaida wa mfuatano wa simulizi; vitu vya thamani vilivyotajwa vinabaki kuwa yambwa linaloeleweka.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: lakini havikumsaidia
  rationale: Kishazi kinasema kwamba vitu alivyotoa havikumletea msaada alioutaka. Wingi ‘haviku-’ unarejelea vitu vya thamani vilivyotajwa katika tafsiri.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Je, malipo kwa Ashuru yalileta msaada?
  choice: lakini havikumsaidia
  alternative: lakini hayakuwa msaada kwake
  rationale: Inahifadhi hitimisho hasi la maandishi bila kufafanua aina ya msaada au sababu ya kushindwa kwake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Nyumba ya Yahwe’ na ‘nyumba ya mfalme’ zimehifadhi ulinganifu wa Kiebrania; ‘vitu vya thamani’ limeongezwa kwa ufafanuzi wa maana inayodokezwa na muktadha.
