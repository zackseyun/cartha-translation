base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: sw
  text: Kwa maana Yahwe aliishusha Yuda kwa sababu ya Ahazi, mfalme wa Israeli[a], kwa kuwa alisababisha hali ya ovyo katika Yuda[b], na akakosa uaminifu sana kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Ahazi, mfalme wa Israeli.” Ahazi alikuwa mfalme wa Yuda; kauli ya mwandishi wa Mambo ya Nyakati imehifadhiwa badala ya kusawazishwa.'
    reason: alternative_reading
  - marker: b
    text: Au “alitenda ovyo katika Yuda,” au “aliacha nidhamu katika Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: aliishusha
  rationale: Hifili ya כנע inaonyesha Yahwe aliifanya Yuda iwe katika hali ya chini. ‘Aliishusha’ ni ya asili katika Kiswahili na inadumisha maana sababishi bila kuifanya iwe ya kijeshi tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo, ili kudumisha jina binafsi katika matini chanzi.
- source_word: בַּעֲבוּר
  choice: kwa sababu ya
  rationale: Hapa kihusishi kinaonyesha sababu ya kushushwa kwa Yuda, si manufaa au kusudi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Matini ya Kiebrania inasema wazi ‘mfalme wa Israeli.’ Kauli hiyo imehifadhiwa badala ya kusawazishwa kihistoria kuwa ‘mfalme wa Yuda.’
- source_word: הִפְרִיעַ
  choice: alisababisha ukosefu wa nidhamu
  rationale: Hifili ya פרע inaweza kumaanisha kuachilia, kuondoa vizuizi, au kusababisha hali ya ovyo. Tafsiri hii inadumisha nguvu sababishi na wazo la kuvunjika kwa utaratibu huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: ב hapa inaonyesha eneo au nyanja ambamo tendo la Ahazi lilitokea.
- source_word: וּמָעוֹל מַעַל
  choice: na alitenda kwa kukosa sana uaminifu
  rationale: Muundo wa mzizi unaorudiwa unasisitiza מעל, yaani kukosa uaminifu au kufanya usaliti wa agano. ‘Sana’ inadumisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: בַּיהוָה
  choice: kwa Yahwe
  rationale: Pamoja na מעל, ‘kwa Yahwe’ huonyesha yule ambaye Ahazi hakumwonyesha uaminifu; muundo huu ni wa asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno yenye ‘dhidi ya.’
theological_decisions:
- issue: Ahazi kuitwa ‘mfalme wa Israeli’
  choice: Kudumisha kauli ya MT ‘Ahazi, mfalme wa Israeli’ katika matini kuu.
  alternative: Kutafsiri kwa kusawazisha kuwa ‘Ahazi, mfalme wa Yuda.’
  rationale: Ingawa kihistoria Ahazi alitawala Yuda, matini chanzi inasema ‘Israeli.’ Mambo ya Nyakati huenda ikatumia jina hilo kwa kusudi la kifasihi au kiteolojia; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha muundo wa sababu unaorudiwa katika Kiebrania, lakini inatumia mpangilio wa maneno unaoeleweka kwa urahisi. Jina ‘Yahwe’ limetumiwa kwa uthabiti.
