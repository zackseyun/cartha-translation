base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: sw
  text: Kulikuwa na nabii wa BWANA huko, jina lake Odedi. Akatoka kuwalaki jeshi lililokuwa likija Samaria, akawaambia, “Tazameni, kwa sababu BWANA, Mungu wa mababu zenu, alikuwa amekasirishwa na Yuda, aliwatia mikononi mwenu, nanyi mkawaua kwa ghadhabu iliyofika mpaka mbinguni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָבִיא לַיהוָה
  choice: nabii wa BWANA
  rationale: Huwakilisha kwa kawaida na kwa heshima uhusiano wa nabii huyo na YHWH; “BWANA” linafuata desturi iliyoenea ya Kiswahili kwa jina la agano.
- source_word: לִפְנֵי הַצָּבָא
  choice: kwenda kulikabili jeshi
  rationale: Katika muktadha wa kutoka kumlaki Odedi, maana ni kwenda mbele ya jeshi na kulisimamisha ili kusema nalo, si kutaja tu mahali aliposimama.
- source_word: הִנֵּה
  choice: Tazameni
  rationale: Huhifadhi alama ya kuvuta usikivu na inafaa kwa hotuba iliyoelekezwa kwa kundi.
- source_word: נְתָנָם בְּיֶדְכֶם
  choice: aliwatia mikononi mwenu
  rationale: Huhifadhi tamathali ya Kiebrania inayoonyesha Mungu kuwaweka Yuda chini ya mamlaka ya washindi.
- source_word: בְזַעַף
  choice: kwa ghadhabu
  rationale: Neno hili linaonyesha hasira kali au ukali wa kisasi, si tendo la kuua pekee.
- source_word: עַד לַשָּׁמַיִם הִגִּיעַ
  choice: iliyofika mpaka mbinguni
  rationale: Huhifadhi taswira ya uovu au ghadhabu kupanda hadi mbinguni, yaani kufikia kiwango kinachodai hukumu ya Mungu.
theological_decisions:
- issue: Uhusiano kati ya hasira ya BWANA na hatia ya jeshi la Israeli
  choice: Sentensi zinatofautisha Mungu kuwatia Yuda mikononi mwao na wao kuwaua kwa ghadhabu iliyopita kiasi.
  alternative: Kuonyesha mauaji yote kuwa utekelezaji usio na hatia wa hukumu ya Mungu.
  rationale: Chanzo kinashikilia pamoja enzi ya Mungu katika kushindwa kwa Yuda na lawama kwa ukatili wa washindi; “Lakini” linaweka wazi utofauti huo unaodokezwa na muktadha.
- issue: Rejeo la “Mungu wa mababu zenu” kwa Israeli ya kaskazini
  choice: Mungu wa mababu zenu
  alternative: Mungu wa baba zenu
  rationale: “Mababu” ni Kiswahili cha kawaida kinachoeleza vizazi vya kale na huhifadhi dai kwamba Israeli bado wanawajibika kwa Mungu wa agano wa mababu wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Biblia lakini kinachoeleweka kwa msomaji wa kawaida. “Odedi” limetumiwa kama umbo la kawaida la jina la Kiebrania עֹדֵד; “jeshi lililokuwa likija Samaria” huhifadhi mwelekeo wa chanzo bila kulifanya tayari limewasili.
