base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: sw
  text: Ahazi akalala pamoja na baba zake, nao wakamzika katika mji wa Yerusalemu, kwa sababu hawakumwingiza katika makaburi ya wafalme wa Israeli.[a] Hezekia, mwanawe, akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wafalme wa Israeli.” Kwa kuwa Ahazi alikuwa mfalme wa Yuda, baadhi huelewa maneno haya kuwa yanahusu makaburi ya kifalme ya wafalme wa ukoo wa Daudi, au wangetarajia kusoma “wafalme wa Yuda.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: akalala pamoja na mababu zake
  rationale: Huhifadhi nahau ya kawaida ya Kiebrania inayotumiwa katika taarifa za kifo cha mfalme, huku “mababu” ikieleza ukoo kwa Kiswahili cha kawaida.
- source_word: וַיִּקְבְּרֻהוּ
  choice: nao wakamzika
  rationale: Muundo wa kutenda wenye kiambishi cha nafsi ya tatu wingi umehifadhiwa, badala ya kutumia kauli tendwa.
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: mjini, huko Yerusalemu
  rationale: Huhifadhi vipengele vyote viwili vya Kiebrania—mahali ndani ya mji na utambulisho wake kuwa Yerusalemu—kwa mtiririko wa kawaida wa Kiswahili.
- source_word: הֱבִיאֻהוּ
  choice: hawakumwingiza
  rationale: Huhifadhi wazo halisi la kumpeleka mtu ndani ya mahali, bila kulibadili kuwa tu “hawakumzika.”
- source_word: לְקִבְרֵי
  choice: katika makaburi
  rationale: Katika muktadha wa maziko ya kifalme, “makaburi” linaeleza sehemu rasmi za kuzikia na ni neno la kawaida la Kiswahili.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: wafalme wa Israeli
  rationale: Hufuata moja kwa moja maandishi ya Kimasora, ambayo yanasema “Israeli,” bila kuyasawazisha kimuktadha kuwa “Yuda.”
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha urithi wa kiti cha ufalme na unaolingana na taarifa ya Kiebrania kuhusu mrithi.
theological_decisions:
- issue: Iwapo “wafalme wa Israeli” libadilishwe kuwa “wafalme wa Yuda” kwa sababu Ahazi alikuwa mfalme wa Yuda
  choice: Kudumisha “wafalme wa Israeli” katika matini kuu
  alternative: wafalme wa Yuda
  rationale: Maandishi ya Kimasora yanasema wazi “Israeli.” Tafsiri inapaswa kuhifadhi usomaji huo na mvutano wake wa kimuktadha badala ya kuusahihisha kwa dhana; tanbihi inaeleza jambo linaloweza kumtatiza msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya masimulizi ya Biblia lakini kinachoeleweka kwa urahisi. Nahau ya kifo “akalala pamoja na mababu zake” imehifadhiwa kwa kuwa ni wazi katika muktadha huu. Alama ya tanbihi imewekwa baada ya “Israeli,” ambako suala linalofafanuliwa linatokea.
