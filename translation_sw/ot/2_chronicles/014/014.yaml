base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: sw
  text: Pia wakazishambulia kambi za wafugaji,[a] wakateka kondoo na mbuzi wengi[b] pamoja na ngamia.[c] Kisha wakarudi Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mahema ya mifugo”; huenda maana yake ni kambi za wafugaji.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha kwa ujumla mifugo midogo, yaani kondoo na mbuzi.
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kiebrania kwa kawaida humaanisha “kuteka”; hapa wanyama walichukuliwa kama nyara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Pia
  rationale: Inaonyesha kwamba tendo hili linaongezwa kwa matendo yaliyotangulia katika simulizi.
- source_word: אָהֳלֵי מִקְנֶה
  choice: kambi za wafugaji
  rationale: Kiebrania halisi ni ‘mahema ya mifugo’; kirai hicho huenda kinamaanisha kambi za watu waliotunza mifugo. Tafsiri hii ni ya kawaida katika Kiswahili huku tanbihi ikihifadhi picha halisi.
- source_word: הִכּוּ
  choice: wakazishambulia
  rationale: Katika muktadha wa kijeshi, נכה humaanisha kushambulia au kupiga; ‘kushambulia’ linaeleza tendo dhidi ya kambi kwa Kiswahili cha kawaida.
- source_word: וַיִּשְׁבּוּ
  choice: wakachukua ... kuwa nyara
  rationale: שבה kwa msingi ni kuteka. Kwa kuwa vitu vilivyotekwa ni wanyama, ‘kuchukua kuwa nyara’ huwasilisha maana hiyo kwa usahihi na kwa lugha ya kawaida.
- source_word: צֹאן
  choice: makundi mengi ya kondoo na mbuzi
  rationale: צֹאן ni nomino ya jumla kwa mifugo midogo, hasa kondoo na mbuzi; tafsiri hii huepuka kuibana kimakosa iwe kondoo pekee.
- source_word: לָרֹב
  choice: mengi
  rationale: Huonyesha wingi mkubwa na kuunganishwa kwa kawaida na ‘makundi’ katika Kiswahili.
- source_word: וּגְמַלִּים
  choice: pamoja na ngamia
  rationale: Tafsiri ya moja kwa moja inayounganisha aina nyingine ya mifugo iliyotekwa.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Kisha wakarudi Yerusalemu
  rationale: ‘Kisha’ huonyesha hatua inayofuata ya simulizi, na jina la mahali limetolewa kwa umbo la kawaida la Kiswahili.
