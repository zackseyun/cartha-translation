language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אָסָ֜א אֶל יְהוָ֣ה אֱלֹהָי/ו֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֵֽין עִמְּ/ךָ֤ לַ/עְזוֹר֙ בֵּ֥ין רַב֙ לְ/אֵ֣ין כֹּ֔חַ עָזְרֵ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ כִּֽי עָלֶ֣י/ךָ נִשְׁעַ֔נּוּ וּ/בְ/שִׁמְ/ךָ֣ בָ֔אנוּ עַל הֶ/הָמ֖וֹן הַ/זֶּ֑ה יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אַ֔תָּה אַל יַעְצֹ֥ר עִמְּ/ךָ֖ אֱנֽוֹשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: sw
  text: Asa akamlilia Yahweh Mungu wake, akasema, “Yahweh, hakuna mwingine ila wewe awezaye kusaidia, awe mwenye nguvu au asiye na nguvu.[a] Tusaidie, Yahweh Mungu wetu, kwa maana tunakutegemea wewe, na kwa jina lako tumekuja dhidi ya umati huu. Yahweh, wewe ni Mungu wetu; usimruhusu mwanadamu akushinde.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwako si jambo kusaidia, iwe ni kwa wengi au kwa wasio na nguvu.” Kiebrania cha kishazi hiki ni kifupi na kinaweza kukazia idadi au nguvu.
    reason: alternative_reading
  - marker: b
    text: Au, “usimruhusu mwanadamu asimame dhidi yako,” au “asikuzuie.” Kitenzi cha Kiebrania hapa kinaweza pia kumaanisha kubaki na nguvu dhidi ya mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamlilia
  rationale: Katika muktadha wa sala, קרא אל huonyesha kumlilia Mungu kwa dharura, si kusema tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; linatoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָיו / אֱלֹהֵינוּ
  choice: Mungu wake / Mungu wetu
  rationale: Huhifadhi miundo ya umilikaji na lugha ya uhusiano katika sala.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: hakuna mwingine ila wewe awezaye kusaidia
  rationale: Hutoa maana ya kwamba msaada wa kweli unatoka kwa Yahweh pekee, huku ukitumia Kiswahili cha kawaida na chenye hadhi.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: kati ya mwenye nguvu na asiye na nguvu
  rationale: Huhifadhi utofautishaji wa Kiebrania bila kuamua kimya kimya kama רַב inasisitiza wingi au nguvu.
- source_word: עָזְרֵנוּ
  choice: Tusaidie
  rationale: Ni amri fupi na ya moja kwa moja yenye kiambishi cha nafsi ya kwanza wingi.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: kwa maana tunakutegemea wewe
  rationale: Kitenzi kina picha ya kujiegemeza, na ‘kutegemea’ huiwasilisha kwa Kiswahili cha asili.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: na kwa jina lako tumekuja
  rationale: Huhifadhi nahau ya kutenda chini ya mamlaka na kwa kumtegemea Mungu.
- source_word: הֶהָמוֹן הַזֶּה
  choice: umati huu
  rationale: הָמוֹן humaanisha kundi kubwa; muktadha wa kijeshi unajulikana bila kuongeza neno lisilokuwapo.
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: usimruhusu mwanadamu anayekufa akushinde
  rationale: Huwasilisha ombi kwamba binadamu asiweze kusimama dhidi ya Mungu au kumshinda, na ‘anayekufa’ huhifadhi udhaifu wa אֱנוֹשׁ.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; kulitohowa hulitofautisha na cheo.
- issue: Maana ya אֵין עִמְּךָ לַעְזוֹר
  choice: hakuna mwingine ila wewe awezaye kusaidia
  alternative: si jambo kwako kusaidia / hakuna tofauti kwako kusaidia
  rationale: Kiebrania ni kifupi na kigumu. Chaguo hili hufuata uwezekano wa upekee wa msaada wa Mungu bila kuficha uwezekano mwingine, ambao umewekwa katika tanbihi.
- issue: Maana ya אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: usimruhusu mwanadamu anayekufa akushinde
  alternative: mwanadamu anayekufa asikuzuie / asisimame dhidi yako
  rationale: Kitenzi עצר kina utata hapa. Katika sala ya vita, ‘akushinde’ hutoa maana ya kutoweza kwake binadamu kustahimili au kuwa na nguvu dhidi ya Yahweh, huku tanbihi ikihifadhi mielekeo mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sala ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania una utata katika vishazi viwili, hivyo maandishi makuu yanasomeka kwa ufasaha na tanbihi zinahifadhi tafsiri mbadala za kweli.
