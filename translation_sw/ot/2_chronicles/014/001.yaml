  text: וַ/יַּ֤עַשׂ אָסָא֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: sw
  text: Asa alifanya yaliyo mema na yaliyo sawa machoni pa Yahwe, Mungu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “machoni pa Yahwe,” nahau yenye maana ya “kwa mtazamo au hukumu ya Yahwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: alifanya
  rationale: Kitenzi עשה katika muundo huu wa kutathmini mwenendo kina maana ya kufanya au kutenda; “alifanya” ni Kiswahili cha kawaida kinachoendana na kirai kinachofuata.
- source_word: אָסָא
  choice: Asa
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: הַטּוֹב
  choice: yaliyo mema
  rationale: Neno lenye kiambishi cha uainisho, likiwa baada ya עשה na kuunganishwa na הַיָּשָׁר, linaeleza matendo au mwenendo wenye kutathminiwa kuwa mwema.
- source_word: וְהַיָּשָׁר
  choice: na yaliyo sawa
  rationale: Katika muktadha wa maadili, יָשָׁר humaanisha kilicho sawa au cha haki; “yaliyo sawa” ni cha asili na huhifadhi tathmini hiyo bila kuongeza wazo jingine.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Tafsiri hii huhifadhi sitiari ya Kiebrania huku nahau ikieleweka katika Kiswahili kuwa ni kwa mtazamo au hukumu ya mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: 'Ingawa אֱלֹהִים ina umbo la wingi, hapa inamtaja Mungu wa Israeli kwa maana ya umoja na ina kiambishi cha umilikaji cha nafsi ya tatu: “wake.”'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “yaliyo mema na yaliyo sawa” unaeleweka kwa urahisi na huhifadhi jozi ya tathmini iliyo katika Kiebrania; “machoni pa” huhifadhi sitiari ya lugha chanzi.
