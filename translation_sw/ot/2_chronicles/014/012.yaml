  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipashio vya Kiebrania: ufuatiliaji hadi Gerari, maangamizi ya Wakushi bila aliyesalia hai, kushindwa kwao mbele za Yahwe na mbele ya jeshi/kambi yake, na kuchukuliwa kwa nyara nyingi sana. Haiongezi tafsiri ya kiteolojia katika kiambishi cha מַחֲנֵהוּ.'
  naturalness: Kiswahili ni sanifu, cha kisasa, na kina hadhi inayofaa simulizi la Maandiko. “Waliwafuatilia mpaka Gerari,” “hakuna aliyebaki hai,” na “nyara nyingi sana” ni misemo iliyo wazi na ya asili. “Mbele za Yahwe” ni matumizi yanayokubalika katika rejesta ya Kibiblia.
  terminology: “Wakushi” huhifadhi rejeo la Kushi bila kuilinganisha isivyofaa na nchi ya Ethiopia ya kisasa; tanbihi inaweka mbadala wa jadi. “Yahwe” ni uwasilishaji unaokubalika wa jina la Mungu katika Kiswahili. “Jeshi lake” ni chaguo linalowezekana kwa מַחֲנֶהוּ, na tanbihi inahifadhi maana ya “kambi” pamoja na utata wa mrejelewa.
