id: 2CH.14.12
reference: 2 Chronicles 14:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּרְדְּפֵ֨/ם אָסָ֜א וְ/הָ/עָ֣ם אֲשֶׁר עִמּ/וֹ֮ עַד לִ/גְרָר֒ וַ/יִּפֹּ֤ל מִ/כּוּשִׁים֙ לְ/אֵ֣ין לָ/הֶ֣ם מִֽחְיָ֔ה כִּֽי נִשְׁבְּר֥וּ לִ/פְנֵֽי יְהוָ֖ה וְ/לִ/פְנֵ֣י מַחֲנֵ֑/הוּ וַ/יִּשְׂא֥וּ שָׁלָ֖ל הַרְבֵּ֥ה מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: sw
  text: Asa na watu waliokuwa pamoja naye waliwafuatilia mpaka Gerari, na Wakushi[a] wakaanguka hata hakuna aliyebaki hai, kwa maana walivunjwa mbele za Yahwe na mbele ya jeshi lake[b]. Kisha wakachukua nyara nyingi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu wa Kushi; katika tafsiri nyingine, “Waethiopia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kambi yake.” Neno la Kiebrania linaweza kumaanisha “kambi” au “jeshi.” Kiambishi “lake” kinaweza kueleweka kuwa kinarejelea jeshi la Asa, ingawa wengine hukichukulia kuwa kinarejelea jeshi la Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: waliwafuatilia
  rationale: Kitenzi רדף katika muktadha wa kijeshi humaanisha kuwafuata adui kwa lengo la kuwakamata au kuwashinda; “waliwafuatilia” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: עַד לִגְרָר
  choice: mpaka Gerari
  rationale: עַד pamoja na jina la mahali huonyesha kikomo cha ufuatiliaji; “mpaka Gerari” hutoa maana hiyo moja kwa moja.
- source_word: מִכּוּשִׁים
  choice: Wakushi
  rationale: כּוּשִׁים ni watu wa Kushi. “Wakushi” huhifadhi rejeo la kale la kikabila na kijiografia bila kulilinganisha moja kwa moja na Ethiopia ya leo.
- source_word: וַיִּפֹּל מִכּוּשִׁים
  choice: Wakushi wakaanguka
  rationale: נפל pamoja na מן inaeleza waliouawa miongoni mwa kundi hilo. Tafsiri hii huhifadhi taswira na muundo wa Kiebrania bila kuongeza idadi isiyotajwa.
- source_word: לְאֵין לָהֶם מִחְיָה
  choice: hata hakuna aliyebaki hai
  rationale: Kirai hiki kinaonyesha kwamba hakukuwa na uhai uliosalia miongoni mwao; usemi huu ni wa asili katika Kiswahili na huhifadhi ukamilifu wa kushindwa kwao.
- source_word: נִשְׁבְּרוּ
  choice: walivunjwa
  rationale: Neno hili katika hali ya kutendwa linaonyesha kuangamizwa au kushindwa kabisa kijeshi. “Walivunjwa” huhifadhi sitiari ya Kiebrania na uzito wake.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” huhifadhi usemi wa Kiebrania unaounganisha uwepo na nguvu za Mungu, huku “Yahwe” likihifadhi jina la agano lililo katika matini.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: na mbele ya jeshi lake
  rationale: מַחֲנֶה inaweza kumaanisha kambi au jeshi. Katika muktadha huu wa mapigano, “jeshi” huonyesha kikosi kinachopigana kwa ufasaha; tanbihi huhifadhi maana ya “kambi” na utata wa kiwakilishi.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: wakachukua nyara nyingi sana
  rationale: נשא שׁלל ni kuchukua mali iliyotekwa, na הַרְבֵּה מְאֹד inasisitiza wingi wake. “Nyara nyingi sana” ni ya kawaida, wazi, na huhifadhi msisitizo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu la herufi nne moja kwa moja. “Yahwe” hulitambulisha kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Mrejelewa wa kiambishi katika מַחֲנֵהוּ
  choice: “jeshi lake,” huku “lake” likielekea kwa Asa
  alternative: “kambi yake”; au jeshi/kambi ya Yahwe
  rationale: Asa ndiye mrejelewa wa karibu katika simulizi, na kauli inaweka sambamba ushindi mbele za Yahwe na mbele ya kikosi cha Asa. Hata hivyo Kiebrania hakiondoi kabisa uwezekano wa kukihusisha kiambishi na Yahwe, kwa hiyo utata huo umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Majina “Gerari,” “Wakushi,” na “Yahwe” yametumika kwa uwasilishaji wa asili wa Kiswahili na uaminifu kwa rejeo la kale.
