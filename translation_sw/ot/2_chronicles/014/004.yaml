base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: sw
  text: Akaondoa mahali pa juu na madhabahu za uvumba[a] kutoka katika miji yote ya Yuda, na ufalme ukawa na utulivu chini ya utawala wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “nguzo za jua.” Neno la Kiebrania linamaanisha vifaa vya ibada na katika baadhi ya miktadha huenda likahusiana na ibada ya jua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Akaondoa
  rationale: Hifili ya סור inaonyesha kusababisha vitu viondolewe; “akaondoa” ni ya moja kwa moja na haiingizi wazo la kufuta kwa amri rasmi.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: katika miji yote ya Yuda
  rationale: Kiswahili cha kawaida hutumia “kuondoa ... katika” kueleza mahali ambako vitu viliondolewa, huku “yote” ikihifadhi upeo wa כָּל.
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: Hili ni neno linalotambulika katika lugha ya Biblia kwa vituo vya ibada vilivyokuwa mara nyingi kwenye miinuko, na linahifadhi maana ya kihistoria bila kuvifanya tu kuwa “mahekalu.”
- source_word: הַחַמָּנִים
  choice: madhabahu za uvumba
  rationale: Neno hili hutaja vifaa vya ibada ambavyo maana yake kamili haijulikani kwa hakika; “madhabahu za uvumba” ni uwezekano unaoeleweka, huku tafsiri inayohusisha ibada ya jua ikihifadhiwa katika tanbihi.
- source_word: וַתִּשְׁקֹט
  choice: ukawa na utulivu
  rationale: שקט hueleza hali ya kutosumbuliwa au kuwa na utulivu; usemi huu hauzidishi maana kuwa lazima kulikuwa na mapatano ya kisiasa.
- source_word: הַמַּמְלָכָה
  choice: ufalme
  rationale: “Ufalme” ni tafsiri ya moja kwa moja na ya kawaida ya מַמְלָכָה katika muktadha huu.
- source_word: לְפָנָיו
  choice: chini ya utawala wake
  rationale: Ingawa kwa muundo wa maneno ni “mbele yake,” katika muktadha wa mfalme usemi huu unaeleweka kwa asili kuwa wakati au chini ya utawala wake; tafsiri hii ni wazi katika Kiswahili.
theological_decisions:
- issue: Aina ya vitu vya ibada vilivyoondolewa na Asa
  choice: Kutaja בָּמוֹת na חַמָּנִים kuwa mahali na vifaa halisi vya ibada bila kubainisha zaidi aina ya ibada hiyo.
  alternative: Kutafsiri חַמָּנִים moja kwa moja kuwa nguzo au sanamu zinazohusiana na jua.
  rationale: Aya inaeleza matengenezo dhidi ya vituo na vifaa vya ibada, lakini neno חַמָּנִים halithibitishi bila shaka kwamba vitu hivyo vilihusiana hasa na ibada ya jua. Tanbihi inalinda uwezekano huo bila kuufanya kuwa hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaosomeka kwa urahisi; “chini ya utawala wake” huwasilisha kwa kawaida maana ya kimuktadha ya לְפָנָיו, huku tanbihi ikihifadhi kutokuwa na uhakika kwa חַמָּנִים.
