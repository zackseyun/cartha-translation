  text: וַ/יֵּצֵ֨א אֲלֵי/הֶ֜ם זֶ֣רַח הַ/כּוּשִׁ֗י בְּ/חַ֨יִל֙ אֶ֣לֶף אֲלָפִ֔ים וּ/מַרְכָּב֖וֹת שְׁלֹ֣שׁ מֵא֑וֹת וַ/יָּבֹ֖א עַד מָרֵשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: sw
  text: Zera, Mkushi, akatoka dhidi yao akiwa na jeshi la elfu ya maelfu na magari ya vita mia tatu; akafika mpaka Maresha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: akatoka dhidi yao
  rationale: Katika simulizi la kijeshi, kitenzi hiki pamoja na kihusishi kinaonyesha kutoka kwenda kupigana nao; “dhidi yao” huweka wazi mwelekeo wa uhasama.
- source_word: זֶרַח הַכּוּשִׁי
  choice: Zera Mkushi
  rationale: “Mkushi” huhifadhi neno la Kiebrania la kikabila na kijiografia kwa usahihi zaidi kuliko tafsiri ya kimapokeo “Mwethiopia.”
- source_word: בְּחַיִל
  choice: akiwa na jeshi
  rationale: Hapa חַיִל linamaanisha jeshi au nguvu ya kijeshi, si mali wala ushujaa.
- source_word: אֶלֶף אֲלָפִים
  choice: maelfu elfu
  rationale: Usemi huu unaakisi kwa ukaribu muundo wa Kiebrania, “elfu ya maelfu,” huku ukiacha wazi kama idadi hiyo inakusudiwa kuwa hesabu kamili au usemi wa idadi kubwa sana.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: na magari mia tatu ya vita
  rationale: “Magari ya vita” ni Kiswahili cha kawaida na wazi kwa magari yaliyotumiwa vitani.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: akafika mpaka Maresha
  rationale: Neno עַד linaonyesha kufika hadi mahali fulani; “mpaka Maresha” huhifadhi maana hiyo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Jina la kikabila “Mkushi” limetumiwa badala ya “Mwethiopia” ili kuhifadhi istilahi ya Kiebrania; hakuna tanbihi ya pili iliyohitajika kwa sababu umbo hilo linaeleweka katika Kiswahili cha Biblia.
