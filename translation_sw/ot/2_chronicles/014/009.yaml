base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: sw
  text: Asa akatoka kwenda kumkabili[a], nao wakajipanga kwa ajili ya vita[b] katika Bonde la Sefatha huko Maresha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “mbele yake”; yaweza pia kutafsiriwa “kwenda kukutana naye” au “kwenda dhidi yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakapanga safu za vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא katika simulizi humaanisha kutoka au kwenda nje; “akatoka” ni Kiswahili cha kawaida na hakiongezi kwa lazima wazo la kuandamana kijeshi.
- source_word: לְפָנָיו
  choice: kwenda kumkabili
  rationale: Ingawa maana ya kimsingi ni “mbele yake,” katika muktadha wa jeshi linalokuja dhidi ya Asa, kirai hiki kinaonyesha kutoka kwenda kukutana nalo kwa mapambano. “Kumkabili” ni cha asili katika Kiswahili huku tanbihi ikihifadhi tafsiri ya moja kwa moja.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: wakajipanga kwa ajili ya vita
  rationale: ערך pamoja na מלחמה ni nahau ya kupanga vikosi tayari kwa mapigano. Tafsiri hii inaeleweka kwa urahisi na inadumisha wazo la kujipanga kivita.
- source_word: בְּגֵיא
  choice: katika Bonde la
  rationale: גיא humaanisha bonde au korongo; “Bonde” ni neno la kawaida na linafaa katika jina hili la mahali.
- source_word: צְפַתָה
  choice: Sefatha
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa wasemaji wa Kiswahili.
- source_word: לְמָרֵשָׁה
  choice: huko Maresha
  rationale: ל kabla ya jina la mahali hapa huonyesha uhusiano wa eneo na Maresha. “Huko Maresha” ni ya asili, bila kulazimisha maana ya “karibu na” ambayo pia yawezekana.
