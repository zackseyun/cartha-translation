  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: sw
  text: Akawaambia Yuda wamtafute BWANA, Mungu wa mababu zao, na kushika sheria na amri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akaamuru
  rationale: Katika muktadha huu, kitenzi cha kusema kina nguvu ya kutoa agizo; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה
  choice: kumtafuta BWANA
  rationale: ‘Kumtafuta’ huhifadhi wazo la kumwelekea Mungu na kutaka kumjua au kupata mapenzi yake; jina la agano יהוה limewakilishwa kwa desturi ya ‘BWANA’.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa mababu zao
  rationale: ‘Mababu zao’ ni lugha ya asili na yenye hadhi kwa waliotangulia katika ukoo, huku kiambishi cha nafsi kikihifadhi ‘wao’ ya Kiebrania.
- source_word: וְלַעֲשׂוֹת הַתּוֹרָה וְהַמִּצְוָה
  choice: na kushika sheria na amri
  rationale: Ingawa kimsingi ni ‘kufanya,’ katika Kiswahili ‘kushika sheria na amri’ huwasilisha kwa kawaida maana ya kuzitii na kuzitekeleza, huku umoja wa ‘amri’ ukihifadhi muundo wa chanzo.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ kwa herufi kubwa hufuata desturi pana ya Biblia za Kiswahili na kutofautisha jina la agano bila kuingiza msimamo wa kimadhehebu.
- issue: Uhusiano kati ya ‘sheria’ na ‘amri’
  choice: sheria na amri
  alternative: Sheria na maagizo
  rationale: Umoja na urudiaji wa kimakusudi katika chanzo umehifadhiwa badala ya kuunganisha istilahi hizo au kuufanya ‘amri’ kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na unaofuata sentensi ya Kiebrania bila kuwa mgumu.
