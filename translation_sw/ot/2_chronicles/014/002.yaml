base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: sw
  text: Akaondoa madhabahu za kigeni na mahali pa juu, akavunja nguzo za ibada, akakata Maashera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo za Ashera.” Neno la Kiebrania hurejelea vitu vya ibada vilivyohusishwa na ibada ya Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Akaondoa
  rationale: Kitenzi hiki katika muundo wa kusababisha kina maana ya kuondoa au kutwaa; “akaondoa” ni cha kawaida na kinaonyesha tendo la mageuzi bila kuongeza wazo la amri rasmi.
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: madhabahu za miungu ya kigeni
  rationale: Neno נֵכָר linaashiria kitu cha kigeni, na katika muktadha wa ibada linaelekea kumaanisha ibada isiyo ya Mungu wa Israeli. Kutaja “miungu” kunafanya maana hii ieleweke kwa Kiswahili na kuepuka dhana kwamba madhabahu zenyewe zilitoka nchi nyingine.
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: בָּמוֹת ni maeneo ya ibada ambayo mara nyingi yalikuwa miinukoni; “mahali pa juu” huhifadhi istilahi ya kibiblia bila kudai kwamba yote yalikuwa vilimani.
- source_word: וַיְשַׁבֵּר
  choice: akavunja
  rationale: שׁבר hapa huonyesha kuvunja kwa nguvu; “akavunja” ni ya asili na yenye uzito unaofaa.
- source_word: הַמַּצֵּבוֹת
  choice: nguzo za ibada
  rationale: מַצֵּבוֹת ni mawe yaliyosimamishwa yenye matumizi ya kidini. “Nguzo za ibada” hufafanua kazi yake kwa msomaji wa sasa bila kuamua umbo lake kwa undani kupita ushahidi.
- source_word: וַיְגַדַּע
  choice: kuikata
  rationale: גדע humaanisha kukata au kuangusha kwa kukata, hasa kitu cha mti; umoja wa kitenzi huendana na nomino ya Kiswahili “miashira” ya ngeli ya 4.
- source_word: הָאֲשֵׁרִים
  choice: miashira
  rationale: Hili ni umbo la Kiswahili lililotoholewa kutoka Ashera kwa vitu vya ibada vilivyohusishwa na mungu huyo wa kike. Linahifadhi upekee na utata wa istilahi ya Kiebrania kuliko kutafsiri moja kwa moja kuwa “nguzo.”
theological_decisions:
- issue: Maana ya הָאֲשֵׁרִים katika muktadha wa kuondoa ibada haramu
  choice: miashira
  alternative: nguzo za Ashera
  rationale: Neno linaweza kutaja vitu vya ibada vilivyohusishwa na Ashera, lakini ushahidi hauamui kwa uhakika kwamba vyote vilikuwa nguzo. Kutumia istilahi iliyotoholewa huhifadhi utata huo, huku tanbihi ikieleza maana yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Mahali pa juu” na “miashira” ni istilahi za kidini zinazohifadhi upekee wa maandishi; tanbihi inafafanua istilahi isiyo ya kawaida.
