  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: sw
  text: 'Asa alikuwa na jeshi: kutoka Yuda watu 300,000 waliobeba ngao kubwa na mikuki, na kutoka Benyamini watu 280,000 waliobeba ngao na kuvuta pinde. Wote hao walikuwa mashujaa hodari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיִל
  choice: jeshi
  rationale: Katika muktadha huu wa kuhesabu vikosi, neno hilo linamaanisha jeshi au nguvu ya kijeshi aliyoimiliki Asa, si mali au uhodari kwa maana ya jumla.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: waliobeba ngao kubwa na mikuki
  rationale: Kitenzi kinaonyesha askari walio na silaha hizo. צִנָּה ni ngao kubwa ya kujikinga mwili, tofauti na מָגֵן inayotajwa baadaye; רֹמַח ni mkuki.
- source_word: מִיהוּדָה
  choice: kutoka Yuda
  rationale: Kihusishi מִן kinaonyesha asili ya kikabila ya askari.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: watu 300,000
  rationale: Nambari imetolewa kwa tarakimu kwa usomaji rahisi; 'watu' huonyesha kwamba idadi ni ya askari bila kurudia neno hilo kwa uzito.
- source_word: נֹשְׂאֵי מָגֵן
  choice: waliobeba ngao
  rationale: מָגֵן ni ngao, ya aina tofauti na ngao kubwa צִנָּה iliyotajwa kwa kikosi cha Yuda.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: na kuvuta pinde
  rationale: Nahau ya Kiebrania kwa maana halisi inahusu kukanyaga au kupinda upinde ili kuutayarisha; katika muktadha huu inaeleza matumizi ya upinde. 'Kuvuta pinde' ni Kiswahili kinachoeleweka na kinahifadhi taswira ya kitendo.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: watu 280,000
  rationale: Utoaji wa moja kwa moja wa idadi kwa mtindo unaosomeka kwa urahisi.
- source_word: כָּל אֵלֶּה
  choice: Hao wote
  rationale: Ni muhtasari wa kawaida na wa asili katika Kiswahili, unaowarejelea askari waliotajwa.
- source_word: גִּבּוֹרֵי חָיִל
  choice: mashujaa hodari
  rationale: Kirai hiki cha kawaida cha kijeshi humaanisha wapiganaji wenye nguvu, ujasiri na uwezo. 'Mashujaa hodari' ni cha asili, chenye hadhi, na hakipotezi maana ya kijeshi katika muktadha.
theological_decisions:
- issue: Usemi wa kijeshi wenye jinsia katika גִּבּוֹרֵי חָיִל
  choice: mashujaa hodari
  alternative: wanaume mashujaa; wapiganaji hodari
  rationale: Muktadha unaonyesha wanajeshi wa kiume wa ulimwengu wa kale, lakini Kiswahili halihitaji kuongeza 'wanaume' ili kuwasilisha maana ya kirai. 'Mashujaa hodari' huhifadhi uhodari na hadhi ya kijeshi bila kuongeza taarifa ambayo haijasemwa kwa nomino tofauti katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mgawanyo wa vikosi vya Yuda na Benyamini, huku ikitofautisha ngao kubwa (צִנָּה) na ngao (מָגֵן). Hakuna tanbihi iliyohitajika; tanbihi ya Kiingereza inaonekana kuhusishwa kimakosa na 'mikuki' ingawa maelezo yake yanahusu גִּבּוֹרֵי חָיִל.
