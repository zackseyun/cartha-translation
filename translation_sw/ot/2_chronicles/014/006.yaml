source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: sw
  text: Akawaambia watu wa Yuda, “Tujenge miji hii na kuizungushia kuta na minara, malango na makomeo, maadamu nchi ingali mbele yetu.[a] Kwa maana tumemtafuta Yahwe Mungu wetu; tumemtafuta, naye ametupa pumziko pande zote.” Basi wakajenga na kufanikiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana nchi ingali mbele yetu,” yaani, nafasi bado ipo au nchi iko mbele yao bila kizuizi.
    reason: Kishazi kinaweza kueleweka kwa namna ya wakati au sababu, na nahau “mbele yetu” haibainishi moja kwa moja ikiwa inamaanisha nafasi iliyo wazi, umiliki, au kutokuwapo kwa tishio.
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Akawaambia watu wa Yuda
  rationale: Yuda hapa inatumika kimajazi kumaanisha watu wa ufalme huo. Kiswahili huhitaji wingi katika kitenzi ili maana hiyo iwe wazi na ya kawaida.
- source_word: נִבְנֶה
  choice: Tujenge
  rationale: Umbo la wingi la kwanza lina nguvu ya kuhimiza au kuonyesha azimio; “Tujenge” linaihifadhi bila kudokeza kwamba miji ilikuwa inajengwa upya.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: עָרִים ni makazi ya mjini, na mazingira ya uimarishaji yanaunga mkono “miji.”
- source_word: וְנָסֵב
  choice: na kuizungushia
  rationale: Hifili ya סבב hapa ina maana ya kuzungushia au kuwekea kitu kuzunguka; kauli hii inaunganika kwa kawaida na vifaa vya ulinzi vinavyofuata.
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: kuta na minara, malango na makomeo
  rationale: Orodha inataja miundo ya ulinzi wa miji. “Malango” yanafaa kuliko milango ya kawaida, na “makomeo” ni vyuma au miti ya kufungia malango.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: maadamu nchi ingali mbele yetu
  rationale: “Ingali” huhifadhi maana ya ‘bado,’ na “mbele yetu” huhifadhi nahau ya Kiebrania bila kuifafanua kupita kiasi kuwa nchi iko wazi, salama, au mikononi mwao.
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ
  choice: Kwa maana tumemtafuta Yahwe Mungu wetu
  rationale: דרשׁ inapomhusu Mungu hapa ni kumtafuta kwa kujitoa na kumtegemea, si kuuliza habari tu. כִּי limetafsiriwa kwa uhusiano wake wa kisababu.
- source_word: דָּרַשְׁנוּ
  choice: tumemtafuta
  rationale: Kurudiwa kwa neno hilo katika Kiebrania kunahifadhiwa kwa ajili ya mkazo.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: naye ametupa pumziko pande zote
  rationale: Kauli hii huhifadhi wazo la kupewa pumziko au nafuu kotekote bila kuongeza waziwazi maadui ambao hawatajwi katika kishazi.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: Basi wakajenga na kufanikiwa
  rationale: 'Jozi ya vitenzi inaonyesha matokeo: walijenga na shughuli yao ikafanikiwa. “Basi” linaonyesha mwendelezo wa matokeo kwa Kiswahili cha kawaida.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la konsonanti nne limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina la agano יְהוָה moja kwa moja. “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo wala kuchagua umbo la “Yehova.”
- issue: Maana ya kumtafuta Mungu katika דָרַשְׁנוּ
  choice: tumemtafuta
  alternative: tumemwuliza
  rationale: Katika muktadha huu kitenzi kinaweza kuhusisha kujitoa na kumtegemea Mungu, si kuuliza tu. Tafsiri haiongezi namna maalumu ya ibada wala msimamo wa kimadhehebu.
- issue: Chanzo cha pumziko la taifa
  choice: naye ametupa pumziko pande zote
  alternative: naye ametupumzisha kutokana na maadui wote waliotuzunguka
  rationale: Kishazi kinamhusisha Mungu moja kwa moja na pumziko, lakini hakitaji maadui waziwazi; kwa hiyo hawajaongezwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Lugha ni wazi kwa msomaji wa kawaida, huku “ingali mbele yetu” ikihifadhi nahau na utata halisi wa Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
