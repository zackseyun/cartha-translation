  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kiebrania: Asa anawahutubia watu wa Yuda; mwaliko wa wingi wa kwanza wa נִבְנֶה umehifadhiwa; orodha ya ngome imewasilishwa bila kuongeza maadui; urudufu wa “tumemtafuta” umebaki; na hitimisho linaonyesha kwamba walijenga na kufanikiwa. “Maadamu nchi ingali mbele yetu” huhifadhi kwa usalama maana ya wakati/nafasi na utata wa עוֹדֶנּוּ ... לְפָנֵינוּ.'
