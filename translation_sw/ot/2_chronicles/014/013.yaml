  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: sw
  text: Nao wakapiga miji yote ya kandokando ya Gerari, kwa maana hofu kuu ya Yahwe ilikuwa juu yao. Wakapora miji yote, kwa maana kulikuwa na nyara nyingi humo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: wakaipiga
  rationale: Kitenzi נכה katika muktadha wa vita kinaonyesha kuipiga na kuishinda miji kwa nguvu. “Wakaipiga” kinadumisha taswira ya Kiebrania bila kuongeza wazi kwamba miji au wakazi wake waliangamizwa kabisa.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: miji yote iliyozunguka Gerari
  rationale: Hii ni tafsiri ya kawaida na inayoeleweka ya miji iliyokuwa katika eneo linaloizunguka Gerari.
- source_word: פַּחַד יְהוָה
  choice: tisho la Yahwe
  rationale: פַּחַד hapa ni hofu kali iliyowapata watu katika mazingira ya vita, si uchaji wao kwa Mungu. “Tisho la Yahwe” linahifadhi uhusiano wa kirai cha Kiebrania na jina la Mungu bila kufafanua kupita kiasi kama lililotumwa naye au lililosababishwa na uwepo wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: עֲלֵיהֶם
  choice: lilikuwa limewaangukia
  rationale: Usemi huu wa Kiswahili unaonyesha hali nzito ya tisho iliyowapata wakazi wa miji hiyo, na unawasilisha kwa ufasaha maana ya Kiebrania ya kuwa juu yao.
- source_word: וַיָּבֹזּוּ
  choice: wakaipora
  rationale: בזז katika vita humaanisha kuchukua mali kwa nguvu kama nyara; “pora” ni neno la sasa, wazi na la kawaida katika Kiswahili.
- source_word: בִּזָּה רַבָּה
  choice: mali nyingi za kutekwa
  rationale: Kirai hiki kinaonyesha wingi wa mali iliyopatikana kama nyara za vita. Tafsiri hii ni ya kawaida na inaepuka marudio yasiyo ya lazima ya mzizi “pora.”
- source_word: בָהֶם
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea miji yote; kwa kuwa “miji” ni ngeli ya 4, “ndani yake” ndiyo upatanisho wa kawaida wa Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya פַּחַד יְהוָה
  choice: tisho la Yahwe
  alternative: hofu ya Yahwe
  rationale: Katika simulizi hili la vita, kirai kinaonyesha hofu kuu iliyowapata watu, si uchaji wa kidini. Hata hivyo, muundo wa “la Yahwe” unahifadhi kiasi cha kutobainika kwa uhusiano wa kisarufi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi mbili na urudiaji wa “miji yote” umehifadhiwa ili kufuata msisitizo wa maandishi ya Kiebrania.
