source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: sw
  text: Alijenga miji yenye ngome katika Yuda, kwa sababu nchi ilikuwa na utulivu, wala hakukuwa na vita vilivyomhusu[a] katika miaka hiyo, kwa sababu Yahweh alimpa pumziko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakukuwa na vita dhidi yake.” Nahau ya Kiebrania inaweza kueleweka kwa upana zaidi kuwa hapakuwa na vita vilivyomhusisha Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Alijenga
  rationale: Kitenzi cha masimulizi kinaendeleza tendo la Asa katika wakati uliopita; kuacha kiunganishi cha mwanzo kunaleta Kiswahili cha kawaida bila kupoteza maana.
- source_word: עָרֵי מְצוּרָה
  choice: miji yenye ngome
  rationale: Kirai hiki humaanisha miji iliyoimarishwa kwa ulinzi; ‘miji yenye ngome’ ni cha asili na kinaeleweka wazi katika Kiswahili.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Kihusishi kinaonyesha mahali ambako miji hiyo ilijengwa.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: nchi ilikuwa na utulivu
  rationale: שׁקט huonyesha hali ya kutosumbuliwa au kuwa tulivu; tafsiri hii huhifadhi wazo hilo na kusomeka kwa kawaida.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: wala hakukuwa na vita vilivyomhusu
  rationale: Nahau ya Kiebrania inaweza kumaanisha kwamba hapakuwa na vita vilivyomhusisha au kumkabili Asa. Kauli hii huhifadhi upana huo badala ya kuamua kimya kimya kuwa vita vilikuwa dhidi yake pekee.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: katika miaka hiyo
  rationale: Kirai cha wakati kinarejelea kipindi kinachosimuliwa.
- source_word: הֵנִיחַ ... לוֹ
  choice: alikuwa amempa pumziko
  rationale: Hifili ya נוח hapa humaanisha kumsababishia mtu hali ya pumziko au nafuu kutokana na migogoro. Wakati timilifu wa Kiswahili unaonyesha kuwa pumziko alilopewa ndilo lililowezesha hali iliyoelezwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linatolewa kama jina binafsi ‘Yahweh,’ si kwa kulibadilisha kuwa cheo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina la agano moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Pumziko kama tendo la Mungu
  choice: Yahweh alikuwa amempa pumziko
  alternative: Asa alikuwa na amani
  rationale: Muundo wa Kiebrania humtaja Yahweh wazi kuwa mtendaji aliyempa Asa pumziko; tafsiri inahifadhi msisitizo huo wa kitheolojia.
- issue: Uhusiano wa Asa na vita
  choice: vita vilivyomhusu
  alternative: vita dhidi yake
  rationale: Kihusishi עִם katika nahau hii hakilazimishi maana ya mashambulizi dhidi yake tu; kinaweza kuonyesha vita vilivyomhusisha kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Miji yenye ngome,’ ‘utulivu,’ na ‘pumziko’ huhifadhi taswira na msamiati mkuu wa Kiebrania bila kufanya sentensi kuwa ngumu.
