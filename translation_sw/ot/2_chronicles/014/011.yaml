id: 2CH.14.11
reference: 2 Chronicles 14:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּגֹּ֤ף יְהוָה֙ אֶת הַ/כּוּשִׁ֔ים לִ/פְנֵ֥י אָסָ֖א וְ/לִ/פְנֵ֣י יְהוּדָ֑ה וַ/יָּנֻ֖סוּ הַ/כּוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: sw
  text: Yahwe akawapiga Wakushi[a] mbele ya Asa na mbele ya Yuda, nao Wakushi wakakimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waethiopia.” Neno la Kiebrania ni jina la watu wa Kushi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: akawapiga
  rationale: Katika muktadha wa vita, kitenzi נָגַף huonyesha kuwapiga na kuwashinda maadui. “Akawapiga” huhifadhi nguvu na uhalisi wa tendo la Mungu bila kulifanya kuwa maelezo tambarare ya ushindi pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: הַכּוּשִׁים
  choice: Wakushi
  rationale: “Wakushi” huhifadhi jina la kabila/taifa la Kiebrania kwa usahihi zaidi kuliko kulihusianisha moja kwa moja na Ethiopia ya baadaye.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Katika taarifa hii ya vita, kifungu hiki kinaonyesha kwamba Wakushi walipigwa mbele ya, au walipokuwa wakikabiliwa na, Asa na Yuda. “Mbele ya” huhifadhi muundo na uwezekano huo wa maana.
- source_word: אָסָא
  choice: Asa
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hili la mtu.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hapa jina hilo linaweza kumaanisha watu au ufalme wa Yuda; “Yuda” huacha maana hiyo ya kijumla iamuliwe na muktadha.
- source_word: וַיָּנֻסוּ
  choice: wakakimbia
  rationale: Kitenzi נוּס humaanisha kukimbia ili kujiokoa. “Wakakimbia” ni lugha ya kawaida na yenye hadhi katika simulizi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova au BWANA
  rationale: Andiko linatumia moja kwa moja jina la Mungu יהוה. “Yahwe” huhifadhi jina hilo binafsi badala ya kuliweka kama cheo.
- issue: Nguvu ya tendo la Mungu katika וַיִּגֹּף
  choice: akawapiga
  alternative: akawashinda
  rationale: “Akawapiga” huhifadhi taswira ya tendo la moja kwa moja la Mungu na pia inafaa katika muktadha wa kijeshi, huku kukimbia kwa Wakushi kukionyesha matokeo ya kushindwa kwao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya maandiko. Urudiaji wa “mbele ya” umehifadhiwa ili kuakisi msisitizo wa Kiebrania, na kiunganishi “nao” kinaendeleza simulizi kwa kawaida.
