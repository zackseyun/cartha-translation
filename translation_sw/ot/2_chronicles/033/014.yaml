  to: Baada ya hayo, akajenga ukuta wa nje kwa ajili ya Mji wa Daudi, upande wa magharibi wa Gihoni bondeni, mpaka kwenye mwingilio wa Lango la Samaki[a]. Akaizunguka Ofeli[b][c] na kuufanya ukuta huo kuwa mrefu sana. Pia akaweka makamanda wa jeshi katika miji yote yenye ngome huko Yuda.
