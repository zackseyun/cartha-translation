base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: sw
  text: Baada ya hayo, akajenga ukuta wa nje kwa ajili ya Mji wa Daudi, upande wa magharibi wa Gihoni bondeni, mpaka kwenye mwingilio wa Lango la Samaki[a]. Akaizunguka Ofeli[b][c] na kuufanya ukuta huo kuwa mrefu sana. Pia akaweka makamanda wa jeshi katika miji yote yenye ngome huko Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuelekea kwenye mwingilio wa Lango la Samaki.” Muundo wa Kiebrania unaweza kuonyesha mahali ukuta ulipofikia au mwelekeo wake kuelekea langoni.
    reason: lexical_alternative
  - marker: b
    text: “Ofeli” ni jina la eneo lililoinuka katika Yerusalemu, labda kusini mwa eneo la hekalu.
    reason: cultural_note
  - marker: c
    text: Au, “akazingira Ofeli.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzunguka au kuzingira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni kiashiria cha mfuatano wa wakati; usemi huu ni wa kawaida na wa heshima katika masimulizi ya Kiswahili.
- source_word: בָּנָה חוֹמָה חִיצוֹנָה לְעִיר דָּוִיד
  choice: akaujengea Mji wa Daudi ukuta wa nje
  rationale: בנה ina maana ya msingi ya kujenga, bila kulazimisha maana ya kujenga upya. Kiambishi cha kutendea katika “akaujengea” kinawasilisha לְ kama ukuta uliokuwa kwa ajili ya Mji wa Daudi.
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: upande wa magharibi wa Gihoni bondeni
  rationale: מַעְרָבָה huonyesha upande au mwelekeo wa magharibi; נחל hapa inafaa kutafsiriwa kwa neno linaloeleweka kirahisi “bonde,” huku jina Gihoni likihifadhiwa.
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: mpaka kwenye mwingilio wa Lango la Samaki
  rationale: Muundo huu wa Kiebrania unaashiria mahali ukuta ulipofikia au ulipoelekea. “Mpaka kwenye mwingilio” ni Kiswahili cha kawaida, huku tofauti ya “kuelekea” ikihifadhiwa katika tanbihi.
- source_word: וְסָבַב לָעֹפֶל
  choice: Akauzunguka Ofeli
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya tatu, umoja, kiume, hivyo kisarufi kinaendeleza Manase kuwa mtendaji. Hata hivyo, katika muktadha kitendo hicho kinaeleza njia ya ukuta; uwezekano huo umeelezwa katika tanbihi.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: na kuufanya ukuta huo kuwa mrefu sana
  rationale: Kiambishi cha kike katika Kiebrania kinarejelea ukuta. Kurudia “ukuta huo” katika Kiswahili kunaondoa utata wa kiwakilishi na מְאֹד inawakilishwa na “sana.”
- source_word: שָׂרֵי חַיִל
  choice: makamanda wa jeshi
  rationale: Kirai hiki kinamaanisha viongozi wa kijeshi; “makamanda wa jeshi” ni cha sasa, wazi, na chenye hadhi bila kutumia istilahi ya kizamani.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: katika miji yote yenye ngome
  rationale: Tafsiri hii inaonyesha usambazaji katika miji yote iliyolindwa kwa ngome na ni ya kawaida katika Kiswahili sanifu.
