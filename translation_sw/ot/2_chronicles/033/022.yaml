id: 2CH.33.22
reference: 2 Chronicles 33:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: sw
  text: Alifanya yaliyo maovu machoni pa Yahweh, kama vile Manase baba yake alivyofanya. Amoni alitolea dhabihu sanamu zote zilizochongwa[a] ambazo Manase baba yake alikuwa ametengeneza, naye akazitumikia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vinyago.” Kiebrania hasa humaanisha sanamu zilizochongwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “akaziabudu.” Kitenzi cha Kiebrania kwa maana halisi ni “kutumikia,” na mara nyingi hutumiwa kuhusu huduma ya kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Alifanya yaliyo maovu
  rationale: Nahau ya Kiebrania עשה + הרע ina maana ya kufanya yaliyo maovu; muundo huu ni wa asili katika Kiswahili na huhifadhi tathmini ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi picha ya nahau ya Kiebrania huku ikieleweka kwa urahisi kuwa ni tathmini ya Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: kama vile ... alivyofanya
  rationale: Huwasilisha kwa Kiswahili cha kawaida ulinganisho wa mwenendo wa Amoni na ule wa baba yake.
- source_word: מְנַשֶּׁה אָבִיו
  choice: Manase baba yake
  rationale: Hufuata uhusiano wa maneno katika Kiebrania na kutumia tahajia ya jina iliyozoeleka katika Kiswahili.
- source_word: הַפְּסִילִים
  choice: sanamu za kuchongwa
  rationale: Neno פסילים linataja hasa sanamu zilizochongwa, si sanamu kwa maana ya jumla tu.
- source_word: אֲשֶׁר עָשָׂה
  choice: ambazo ... alikuwa ametengeneza
  rationale: Wakati timilifu hufafanua kwamba utengenezaji wa sanamu ulitangulia matendo ya Amoni.
- source_word: זִבַּח
  choice: alitolea dhabihu
  rationale: Katika muktadha wa ibada, זבח humaanisha kutoa dhabihu; kiambishi -lea huonyesha kwamba dhabihu zilitolewa kwa sanamu hizo.
- source_word: וַיַּעַבְדֵם
  choice: naye akazitumikia
  rationale: Huhifadhi maana ya msingi ya עבד, yaani kutumikia, huku muktadha ukionyesha huduma ya kidini.
- source_word: אָמֹון
  choice: Amoni
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano moja kwa moja; kulitohowa kuwa Yahweh hulitofautisha na cheo na kuhifadhi rejeo lake la kibinafsi.
- issue: Iwapo עבד katika muktadha wa ibada ya sanamu itafsiriwe ‘kutumikia’ au ‘kuabudu’
  choice: akazitumikia
  alternative: akaziabudu
  rationale: ‘Kutumikia’ hudumisha maana pana ya kitenzi cha Kiebrania; muktadha wa dhabihu unaonyesha wazi kwamba huduma hiyo ni ya kidini bila kulazimisha maana nyembamba zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ‘machoni pa’ imehifadhiwa kwa kuwa ni ya asili na huakisi picha ya Kiebrania. Majina yametolewa kwa maumbo ya Kiswahili ‘Manase’ na ‘Amoni’.
