id: 2CH.33.16
reference: 2 Chronicles 33:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: sw
  text: Kisha akaitengeneza upya madhabahu ya Yahwe, akatoa juu yake dhabihu za amani[a] na za shukrani, akawaambia watu wa Yuda wamtumikie Yahwe, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhabihu za ushirika.”
    reason: Neno שְׁלָמִים hutaja aina ya dhabihu ambayo inaweza kuelezwa kwa kuzingatia amani au ushirika; tanbihi inahifadhi uwezekano huo wa kileksia.
lexical_decisions:
- source_word: ו/יכן
  choice: akaitengeneza upya
  rationale: Hifili ya כון hapa, kwa kuzingatia muktadha wa madhabahu iliyokuwa imeondolewa au kunajisiwa, inaeleza kuirudisha katika hali yake inayofaa; usemi huu ni wa asili na wazi kuliko ‘akaitayarisha’.
- source_word: מִזְבַּח יְהוָה
  choice: madhabahu ya Yahwe
  rationale: Muundo huu wa umilikaji umetafsiriwa kwa Kiswahili cha kawaida, huku jina la agano יְהוָה likihifadhiwa kama ‘Yahwe’.
- source_word: וַ/יִּזְבַּח עָלָיו
  choice: akatoa juu yake dhabihu
  rationale: זבח huonyesha kutoa dhabihu, na ‘juu yake’ inarejelea madhabahu. Kiswahili hiki kinaweka wazi tendo la ibada bila kurudia maneno yasiyo ya lazima.
- source_word: זִבְחֵי שְׁלָמִים
  choice: dhabihu za amani
  rationale: Hili ni jina la aina maalumu ya dhabihu. ‘Dhabihu za amani’ linafuata kwa karibu neno שְׁלָמִים, huku tanbihi ikitaja maana mbadala ya ushirika.
- source_word: וְ/תוֹדָה
  choice: na za shukrani
  rationale: Katika muktadha huu תוֹדָה linaonyesha shukrani inayotolewa kwa njia ya dhabihu; ‘za shukrani’ huunganika kiasili na ‘dhabihu’ iliyotangulia.
- source_word: וַ/יֹּאמֶר לִיהוּדָה
  choice: akawaambia watu wa Yuda
  rationale: Kwa maana halisi ni ‘akaiambia Yuda’; hapa Yuda inawakilisha watu wake, hivyo ‘watu wa Yuda’ huepuka Kiswahili kisicho cha kawaida bila kuongeza wazo la amri kali lisilosemwa wazi na kitenzi.
- source_word: לַ/עֲבוֹד
  choice: wamtumikie
  rationale: עבד kuhusu Mungu ni kumtumikia, jambo linaloweza kujumuisha ibada lakini si lazima lipunguzwe kuwa tendo la kuabudu pekee.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa muundo wa Kiebrania, unaohifadhi utambulisho wa kiagano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עבד katika uhusiano na Mungu
  choice: wamtumikie
  alternative: wamwabudu
  rationale: ‘Kumtumikia’ huhifadhi upana wa maana ya kitenzi, unaojumuisha ibada na utii, bila kuifungia katika ibada ya kidini pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia ‘watu wa Yuda’ kufafanua metonimia ya Kiebrania kwa lugha ya kawaida, na imehifadhi istilahi ya kidini ‘madhabahu’ pamoja na jina ‘Yahwe’.
