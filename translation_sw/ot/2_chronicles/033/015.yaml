base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: sw
  text: Aliondoa miungu ya kigeni na sanamu[a] kutoka katika nyumba ya Yahweh, na madhabahu zote alizokuwa amejenga kwenye mlima wa nyumba ya Yahweh[b] na katika Yerusalemu; akazitupa nje ya mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfano wa ibada.” Neno la Kiebrania סֶמֶל linaweza kumaanisha sanamu au mfano unaotumiwa katika ibada.
    reason: lexical_alternative
  - marker: b
    text: Au “kwenye kilima cha nyumba ya Yahweh”; yaani, eneo la mlima wa hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Aliondoa
  rationale: Hifili ya סור hapa ina maana ya kusababisha vitu viondoke. ‘Aliondoa’ ni ya kawaida na inafaa katika muktadha wa marekebisho ya ibada.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: miungu ya kigeni
  rationale: Kirai hiki kinamaanisha miungu isiyo ya ibada ya Yahweh. ‘Miungu ya kigeni’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: הַסֶּמֶל
  choice: sanamu
  rationale: סֶמֶל inaweza kumaanisha sanamu au mfano wa ibada. ‘Sanamu’ linaonyesha wazi kuwa hiki ni kitu cha kidini kinachoabudiwa, huku tanbihi ikihifadhi uwezekano wa ‘mfano.’
- source_word: מִבֵּית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: בַּיִת katika kirai hiki inarejelea hekalu, lakini ‘nyumba ya Yahweh’ inahifadhi tamathali ya Kiebrania na inaeleweka katika muktadha.
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: pamoja na madhabahu zote
  rationale: Hii inatafsiri nomino ya wingi na כָּל kwa uwazi; ‘pamoja na’ inaunganisha kwa Kiswahili vitu vyote vilivyoondolewa.
- source_word: אֲשֶׁר בָּנָה
  choice: alizokuwa amejenga
  rationale: Muundo huu unaonyesha kwamba madhabahu hizo zilikuwa zimejengwa kabla ya kuondolewa.
- source_word: בְּהַר בֵּית יְהוָה
  choice: kwenye mlima wa nyumba ya Yahweh
  rationale: Tafsiri hii inahifadhi neno הַר, ‘mlima’ au ‘kilima,’ bila kulibadili kimya kimya kuwa istilahi fafanuzi ‘eneo la hekalu.’
- source_word: וּבִירוּשָׁלָם
  choice: na katika Yerusalemu
  rationale: Kirai hiki kinaonyesha eneo jingine la madhabahu, yaani Yerusalemu kwa upana zaidi ya mlima wa hekalu.
- source_word: וַיַּשְׁלֵךְ
  choice: akavitupa
  rationale: שלך inaonyesha utupaji wa nguvu au uondoaji mkali. Kiambishi ‘vi-’ kinarejelea kwa pamoja vitu vilivyotajwa kabla, ingawa Kiebrania hakitaji kiwakilishi cha yambwa waziwazi.
- source_word: חוּצָה לָעִיר
  choice: nje ya mji
  rationale: Kielezi cha mwelekeo pamoja na kirai cha mahali kinaonyesha kwamba vitu hivyo vilitupwa mpaka upande wa nje wa mipaka ya mji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika matini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ya Kiebrania ina Tetragramatoni moja kwa moja. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida kwa wasomaji wa leo. ‘Nyumba ya Yahweh’ na ‘mlima wa nyumba ya Yahweh’ zimehifadhiwa ili kufuata taswira ya Kiebrania; tanbihi zinafafanua mbadala bila kuondoa uwazi wa matini kuu.
