  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: sw
  text: Wala sitauondoa tena mguu wa Israeli[a] kutoka katika nchi niliyowateulia baba zenu, ikiwa tu watakuwa waangalifu kutenda yote niliyowaamuru, kwa kufuata sheria yote, maagizo na hukumu nilizowapa kupitia kwa Musa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “mguu wa Israeli”; hii ni nahau inayomaanisha kuwapo kwa Israeli katika nchi.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kwa mkono wa Musa,” yaani, kupitia kwa Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: sitauondoa tena
  rationale: Muundo wa kitenzi יסף pamoja na הסיר, ukiwa umekanushwa, unaonyesha kwamba tendo hilo halitafanywa tena; Kiswahili hiki ni cha kawaida na kinahifadhi maana ya wakati ujao.
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: mguu wa Israeli
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania, ambayo hapa ni nahau inayomaanisha kuwapo kwa Israeli katika nchi; tanbihi inafafanua nahau hiyo bila kuifuta katika matini.
- source_word: מֵעַל הָאֲדָמָה
  choice: kutoka katika nchi
  rationale: Katika muktadha wa nchi ya agano, הָאֲדָמָה inafaa kutafsiriwa ‘nchi’; kirai hiki kinaeleza kuondolewa kwa Israeli kutoka mahali walipokaa bila kutumia Kiswahili kisicho cha kawaida kama ‘kutoka juu ya nchi.’
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: niliyowateulia mababu zenu
  rationale: Hiphil ya עמד hapa ina wazo la kuweka au kuandaa kwa ajili ya mtu. ‘Niliyowateulia’ huonyesha uteuzi wa Mungu wa nchi kwa manufaa ya mababu, huku ‘mababu’ ikieleza kwa uwazi maana ya kihistoria ya אָבוֹת.
- source_word: רַק אִם
  choice: ikiwa tu
  rationale: Kirai hiki kinahifadhi sharti lenye nguvu la Kiebrania na kinasikika kwa kawaida katika Kiswahili.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: watakuwa waangalifu kutenda
  rationale: Muundo huu unamaanisha kushika kwa makini ili kutenda, si kujua tu; tafsiri hii huhifadhi uzito wa utiifu wa vitendo.
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: yote niliyowaamuru
  rationale: Tafsiri inadumisha jumla ya amri pamoja na kiambishi cha nafsi ya tatu wingi, ‘wa-’, kilichopo katika Kiebrania.
- source_word: לְכָל הַתּוֹרָה
  choice: kwa kufuata sheria yote
  rationale: Katika orodha hii ya kisheria, תּוֹרָה ina maana ya sheria au mafundisho ya agano. ‘Kwa kufuata’ huwasilisha uhusiano wa לְ na yale waliyoamriwa kufanya kwa Kiswahili cha kawaida.
- source_word: הַחֻקִּים
  choice: masharti
  rationale: ‘Masharti’ ni neno linaloeleweka katika Kiswahili cha sasa kwa maagizo yaliyowekwa, na linatofautishwa na sheria kwa ujumla na hukumu.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: Neno hili linahifadhi maana ya kisheria na kimahakama ya מִשְׁפָּטִים.
- source_word: בְּיַד מֹשֶׁה
  choice: nilizowapa kupitia kwa Musa
  rationale: Nahau ya Kiebrania ‘kwa mkono wa Musa’ huonyesha uwakala au upatanishi. ‘Kupitia kwa Musa’ hutoa maana hiyo wazi katika Kiswahili cha kisasa.
theological_decisions:
- issue: Kudumu kwa Israeli katika nchi kunakotegemea sharti
  choice: Ahadi ya kuendelea kukaa katika nchi imewasilishwa ikiwa na sharti halisi la utiifu.
  alternative: Kuieleza kama ahadi isiyo na sharti, au kulifanya sharti kuwa la balagha tu.
  rationale: Maneno רַק אִם yanaweka sharti wazi. Tafsiri inalihifadhi bila kuamua mijadala mipana ya kiteolojia kuhusu kudumu kwa agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ‘mguu wa Israeli’ imehifadhiwa kwa sababu ni ya asili na imefafanuliwa kwa tanbihi; miundo mingine imewekwa katika Kiswahili cha sasa ili kuepuka tafsiri ngumu ya neno kwa neno.
