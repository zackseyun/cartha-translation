  text: Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem.
translation:
  language: sw
  text: Amoni alikuwa na umri wa miaka ishirini na miwili alipoanza kutawala, naye alitawala huko Yerusalemu kwa miaka miwili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na miwili
  rationale: Nahau ya Kiebrania yenye maana halisi ya ‘mwana wa miaka ishirini na miwili’ imewasilishwa kwa nahau ya kawaida na wazi ya Kiswahili ya kutaja umri.
- source_word: אָמֹון
  choice: Amoni
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Kiambishi ב pamoja na kitenzi-jina cha מלך huonyesha wakati wa kuingia madarakani; usemi huu ni wa asili katika Kiswahili na unahifadhi maana hiyo.
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: kwa miaka miwili
  rationale: Kirai hiki kinaonyesha muda ambao utawala uliendelea; ‘kwa’ hufanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Katika muktadha huu, kitenzi kinaeleza kutenda kazi ya kifalme kwa kipindi fulani.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Jina la mahali limetoholewa kwa umbo la Kiswahili lililozoeleka; mahali pa utawala panaelezwa kwa muundo wa Kiswahili ‘alitawala Yerusalemu’.
