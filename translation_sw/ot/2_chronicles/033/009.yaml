source:
  edition: WLC
  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: sw
  text: Basi Manase akawapotosha watu wa Yuda na wakaaji wa Yerusalemu, hata wakatenda maovu kuliko mataifa ambayo Yahwe alikuwa ameyaangamiza mbele ya wana wa Israeli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli” au “watu wa Israeli.” Kiebrania: “wana wa Israeli.”'
    reason: Mbadala huu unaeleza maana ya kijumuiya ya usemi halisi wa Kiebrania.
lexical_decisions:
- source_word: וַיֶּתַע
  choice: akawapotosha
  rationale: Kitenzi cha Kiebrania katika Hifili kina maana ya kusababisha wengine wapotee au waende njia isiyofaa. “Akawapotosha” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: watu wa Yuda na wakaaji wa Yerusalemu
  rationale: “Yuda” hapa inawakilisha jumuiya ya watu; kuongeza “watu wa” huifanya maana hiyo iwe wazi na ya kawaida kwa Kiswahili, huku “wakaaji” ikitafsiri muundo wa Kiebrania unaomaanisha wale wanaokaa Yerusalemu.
- source_word: לַעֲשׂוֹת רָע
  choice: ili watende maovu
  rationale: Muundo huu unahifadhi uhusiano wa kusudi au matokeo katika infinitivu ya Kiebrania. “Kutenda maovu” ni usemi wa asili na wenye heshima katika Kiswahili.
- source_word: מִן הַגּוֹיִם
  choice: kuliko mataifa
  rationale: Kihusishi מִן hapa kinaonyesha ulinganisho. “Kuliko mataifa” huweka wazi kwamba matendo ya Yuda yalizidi uovu wa mataifa hayo.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno hilo linarejelea mataifa au makundi ya watu yaliyokuwapo katika nchi, si lazima dhana ya baadaye ya kidini ya “Wamataifa.”
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: ambayo Yahwe alikuwa ameyaangamiza
  rationale: Kitenzi השמיד ni chenye nguvu na humaanisha kuangamiza. Wakati uliotangulia unaonyesha kwamba tendo hilo lilikuwa limetokea kabla ya upotovu wa Manase unaosimuliwa.
- source_word: מִפְּנֵי
  choice: mbele ya
  rationale: Katika muktadha wa ushindi, nahau hii inaonyesha mataifa kuondolewa au kuangamizwa mbele ya Israeli. Tafsiri hii huhifadhi taswira ya Kiebrania bila maelezo ya ziada.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii ni tafsiri ya karibu ya usemi wa Kiebrania. Kwa kuwa una maana ya kijumuiya, tanbihi inatoa namna za kawaida zaidi za Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” huhifadhi jina binafsi la agano lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Usemi wa kijumuiya wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watu wa Israeli
  rationale: Tafsiri kuu huhifadhi muundo wa kiume wa Kiebrania wenye matumizi ya uwakilishi wa jumuiya; tanbihi inaweka wazi kwamba usemi huo unawahusu Waisraeli kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inafuata kwa karibu mantiki ya Kiebrania huku ikitumia “watu wa Yuda” ili kuepuka kuifanya nchi yenyewe ionekane kuwa kitu kinachopotoshwa.
