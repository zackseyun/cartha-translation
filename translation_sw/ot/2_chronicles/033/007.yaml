  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: sw
  text: Akaweka sanamu ya kuchongwa, sanamu ya kuabudiwa[a] aliyokuwa ameifanya, katika nyumba ya Mungu. Kuhusu nyumba hiyo, Mungu alikuwa amewaambia Daudi na Sulemani mwanawe, “Katika nyumba hii na katika Yerusalemu, ambayo nimeichagua kutoka miongoni mwa makabila yote ya Israeli, nitaliweka jina langu milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu ya kuchongwa ya sanamu ya kuabudiwa.” Kiebrania kinatumia maneno mawili yanayokaribiana kwa maana kwa sanamu ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Akaweka
  rationale: Kitenzi ‘kuweka’ ni cha kawaida na cha asili katika simulizi, na muundo wa ‘aka-’ unaendeleza mfuatano wa matukio wa wayyiqtol.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: sanamu ya kuchongwa, ile sanamu
  rationale: 'Tafsiri hii inafanya nomino zote mbili za Kiebrania zionekane: פֶּסֶל inaelezwa kwa ‘sanamu ya kuchongwa,’ na הַסֶּמֶל kwa ‘ile sanamu.’ Kurudiwa kunahifadhi msisitizo wa maneno yanayokaribiana bila kuyafanya neno moja.'
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyokuwa ametengeneza
  rationale: Muundo huu unaonyesha kwamba kutengenezwa kwa sanamu kulitangulia kitendo cha kuiweka, huku ukibaki wa kawaida katika Kiswahili.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: katika nyumba ya Mungu
  rationale: ‘Nyumba ya Mungu’ huhifadhi neno halisi בַּיִת na uhusiano wake na ‘nyumba hii’ katika kauli inayofuata; ‘hekalu’ lingeweza kueleza maana lakini lingeficha urudiaji huo.
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: Kuhusu nyumba hiyo, Mungu alikuwa amewaambia
  rationale: Mgawanyo huu wa sentensi unaonyesha wazi kwamba kauli ya Mungu inahusu nyumba hiyo na huepuka kishazi tegemezi kisicho cha asili katika Kiswahili.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: Daudi na Sulemani mwanawe
  rationale: Huhifadhi wote waliopokea kauli na kumtambulisha Sulemani kuwa mwana wa Daudi bila uzito usio wa lazima.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלִַם
  choice: Katika nyumba hii na katika Yerusalemu
  rationale: Huhifadhi jozi ya mahali—nyumba na mji—pamoja na kurudiwa kwa wazo la ‘nyumba.’
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ambayo nimeichagua kutoka miongoni mwa makabila yote ya Israeli
  rationale: Kishazi hiki kinaunganishwa kwa kawaida na Yerusalemu, nomino iliyo karibu zaidi, na ‘kutoka miongoni mwa’ huwasilisha maana ya מִכֹּל kwa Kiswahili sanifu.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: nitaliweka jina langu
  rationale: Huhifadhi tamathali halisi ya agano ya Mungu ‘kuweka’ jina lake badala ya kuifafanua kitheolojia.
- source_word: לְעֵילֹום
  choice: milele
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa muda usio na mwisho katika kauli hii.
theological_decisions:
- issue: Matumizi ya jina au cheo cha Mungu
  choice: Mungu
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana אֱלֹהִים, si יהוה; kwa hiyo ‘Mungu’ huhifadhi tofauti hiyo.
- issue: Tamathali ya theolojia ya hekalu
  choice: nitaliweka jina langu milele
  alternative: nitalifanya jina langu likae huko milele
  rationale: Kiebrania kinasema Mungu ataweka jina lake. Tafsiri inahifadhi tamathali hiyo bila kuifasiri kuwa kukaa au kuanzisha uwepo wake.
- issue: Kirejeo cha אֲשֶׁר בָּחַרְתִּי
  choice: Yerusalemu ndiyo inayorejelewa moja kwa moja
  alternative: nyumba hii na Yerusalemu kwa pamoja
  rationale: Yerusalemu ndiyo nomino iliyo karibu zaidi na kishazi hicho, na muktadha wa kibiblia huonyesha uchaguzi wa Yerusalemu; hata hivyo mpangilio wa Kiebrania unaweka nyumba na mji karibu sana. Tafsiri inaunganisha kishazi na Yerusalemu bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akaweka’ hudumisha mwendo wa simulizi; mgawanyo baada ya ‘nyumba ya Mungu’ huondoa utata wa kisarufi bila kupunguza yaliyomo. Alama ya tanbihi [a] imewekwa mara tu baada ya jozi ya maneno inayohusika.
