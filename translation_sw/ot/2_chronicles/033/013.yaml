base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: sw
  text: Akamwomba, naye akakubali kusihiwa naye[a], akasikia dua yake, na akamrudisha Yerusalemu kwenye ufalme wake[b]. Ndipo Manase akajua kwamba Yahwe ndiye Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaitikia ombi lake.”
    reason: lexical_alternative
  - marker: b
    text: “Kwenye ufalme wake” hapa inaweza pia kumaanisha “kwenye mamlaka yake ya kifalme,” yaani, alirejeshwa katika utawala wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: Akamwomba
  rationale: Kitenzi התפלל humaanisha kuomba; kiambishi cha yambwa “-mw-” kinadumisha kwamba Manase alimwelekea Mungu binafsi.
- source_word: וַיֵּעָתֶר לוֹ
  choice: naye akaitikia ombi lake
  rationale: Nifali ya עתר hapa huonyesha kwamba Mungu alikubali kusihiwa na akatoa jibu lenye kibali. “Akaitikia ombi lake” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kudokeza kwamba Mungu alishurutishwa.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: akasikia dua yake
  rationale: תחנה ni ombi la dhati la kutaka rehema au kibali. “Dua” huhifadhi uzito na mazingira ya sala, huku “akasikia” ikifuata usemi wa Kiebrania.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: akamrudisha Yerusalemu katika ufalme wake
  rationale: Hifili ya שוב humaanisha kusababisha arudi au kumrudisha. מלכות inaweza kumaanisha ufalme au mamlaka ya kifalme; tafsiri kuu inafuata muundo wa chanzo, na tanbihi inaeleza maana ya urejesho wa utawala.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: Ndipo Manase akajua
  rationale: “Ndipo” huonyesha mfuatano na matokeo ya matendo yaliyotangulia kwa Kiswahili cha masimulizi.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: kwamba Yahwe ndiye Mungu
  rationale: “Ndiye” huakisi msisitizo wa kiwakilishi הוּא kwa njia ya kawaida katika Kiswahili, bila kuongeza neno “pekee,” ambalo halipo wazi katika Kiebrania.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya ungamo כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: Yahwe ndiye Mungu
  alternative: Yahwe ni Mungu / Yahwe peke yake ndiye Mungu
  rationale: “Ndiye” huhifadhi msisitizo wa הוּא. Neno “peke yake” halijaongezwa kwa sababu, ingawa linaweza kuafikiana na teolojia pana, halijaandikwa wazi katika kifungu hiki.
- issue: Jibu la Mungu katika וַיֵּעָתֶר לוֹ
  choice: akaitikia ombi lake
  alternative: akakubali kusihiwa naye
  rationale: Tafsiri iliyochaguliwa inaonyesha jibu lenye kibali kwa ombi bila kuingiza madai ya jinsi hisia za Mungu zilivyobadilika; tanbihi huhifadhi muundo mbadala ulio karibu zaidi na nifali ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Msururu wa vitenzi “akaitikia … akasikia … akamrudisha” unahifadhi mtiririko wa matendo matatu ya Mungu katika Kiebrania. “Dua” imetumiwa kwa maana ya ombi la dhati kwa Mungu, si kama istilahi ya dhehebu fulani.
