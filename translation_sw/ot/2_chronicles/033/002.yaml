  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: sw
  text: Akafanya yaliyokuwa mabaya machoni pa Yahweh, sawasawa na machukizo ya mataifa ambayo Yahweh alikuwa ameyafukuza mbele ya wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “Waisraeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Akafanya yaliyo maovu
  rationale: Muundo huu unawasilisha tendo la masimulizi na kivumishi kilichotumiwa kama nomino, yaani ‘alifanya yaliyo maovu,’ kwa Kiswahili cha kawaida.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Nahau ya Kiebrania imehifadhiwa kwa namna inayoeleweka katika Kiswahili, ikionyesha tathmini ya Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כְּתוֹעֲבוֹת
  choice: kwa kufuata machukizo
  rationale: כְּ huonyesha kufanana au kufuata kielelezo; ‘kwa kufuata’ huleta maana ya mwenendo uliolingana na desturi hizo, huku ‘machukizo’ kikihifadhi uzito wa kimaadili na wa kiibada wa תּוֹעֵבָה.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno hilo linamaanisha makundi ya watu yasiyo ya Israeli yaliyokuwamo katika nchi.
- source_word: הוֹרִישׁ
  choice: alikuwa ameyafukuza
  rationale: Hifili ya ירשׁ hapa ina maana ya kuyaondoa au kuyafukuza mataifa kutoka nchini; wakati timilifu unaonyesha kuwa tendo hilo lilitangulia.
- source_word: מִפְּנֵי
  choice: mbele ya
  rationale: Huhifadhi nahau ya mahali inayotumika pamoja na tendo la kufukuza bila kuifanya sentensi kuwa nzito.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii huhifadhi usemi wa kifamilia na wa kiume wa Kiebrania; tanbihi inaonyesha maana yake ya kawaida kama jina la jamii nzima.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la chanzo linatumia jina la agano יהוה; kulitaja ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kijinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Chaguo kuu huhifadhi taswira ya kifamilia na umbo la kiume la chanzo, huku tanbihi ikifafanua kwamba usemi huo unaitaja jamii ya Waisraeli.
- issue: Nguvu ya neno תּוֹעֵבוֹת
  choice: machukizo
  alternative: matendo ya kuchukiza
  rationale: ‘Machukizo’ huhifadhi ukali wa hukumu ya kimaadili na uwezekano wa maana ya kiibada bila kuufanya usemi kuwa desturi za kawaida tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Usemi ‘machoni pa Yahweh’ umehifadhi sitiari ya Kiebrania, na ‘kwa kufuata machukizo’ umechaguliwa ili kuonyesha kufanana kwa mwenendo kwa Kiswahili cha asili.
