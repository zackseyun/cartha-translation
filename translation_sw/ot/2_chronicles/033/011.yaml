base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: sw
  text: Ndipo Yahwe akawaleta dhidi yao makamanda wa jeshi la mfalme wa Ashuru. Nao wakamkamata Manase kwa ndoano[a], wakamfunga kwa minyororo ya shaba, na kumpeleka Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ndoano moja”; neno la Kiebrania linaweza kumaanisha ndoano au miiba, na wengine hulielewa kwa upana zaidi kuwa kifaa cha kumzuia mateka.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: akawaleta dhidi yao
  rationale: Muundo wa kisababishi wa בוא unampa Yahwe utendaji wa moja kwa moja, huku עַל katika muktadha wa kijeshi ikimaanisha ‘dhidi ya’.
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: makamanda wa jeshi la mfalme wa Ashuru
  rationale: Ni usemi wa asili na wa sasa unaoonyesha viongozi wa kijeshi walio chini ya mfalme wa Ashuru.
- source_word: וַיִּלְכְּדוּ
  choice: wakamkamata
  rationale: לכד katika muktadha huu humaanisha kumtia mtu mikononi au kumkamata; ‘wakamkamata’ linafaa kwa kukamatwa kwa mfalme.
- source_word: בַּחֹחִים
  choice: kwa kulabu
  rationale: חֹחִים inaweza kutaja kulabu au miiba; hapa kulabu zinafaa kwa desturi ya kuwazuia au kuwaongoza mateka, lakini utata wake umehifadhiwa katika tanbihi.
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: wakamfunga kwa minyororo ya shaba
  rationale: אסר ni kufunga, na נְחֻשְׁתַּיִם hutaja vizuizi vya chuma cha shaba, yawezekana pingu au minyororo miwili; tafsiri hii ni wazi bila kuondoa kabisa asili ya kifaa.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: na kumpeleka Babeli
  rationale: Hifili ya הלך huonyesha kusababisha aende au kumpeleka, na he ya mwelekeo katika בָּבֶלָה inaonyesha kwenda Babeli.
theological_decisions:
- issue: Utendaji wa Mungu katika shambulio la Ashuru
  choice: Yahwe akawaleta makamanda dhidi yao
  alternative: Yahwe aliruhusu makamanda waje dhidi yao
  rationale: Kitenzi cha Kiebrania katika muundo wa kisababishi kinahusisha utendaji wa Yahwe moja kwa moja. Tafsiri haudhoofishi kauli hiyo kuwa ruhusa tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Makamanda’ ni wazi katika muktadha wa kijeshi; ‘minyororo ya shaba’ inaeleweka kwa wasomaji wa kawaida. Kiashiria cha tanbihi [a] kimewekwa mara tu baada ya neno linalohusika.
