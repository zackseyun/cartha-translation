base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: sw
  text: Matendo mengine ya Manase, sala yake kwa Mungu wake, na maneno ya waonaji waliosema naye kwa jina la Yahweh, Mungu wa Israeli—tazama, yameandikwa katika kumbukumbu za wafalme wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kitabu cha wafalme wa Israeli” au “katika taarifa za mwaka kwa mwaka za wafalme wa Israeli.” Mtindo huu wa Kiebrania wa kutaja chanzo hurejelea maandishi ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Matendo mengine ya Manase
  rationale: Katika muhtasari wa kifalme, דִּבְרֵי hurejelea mambo au matendo ya mfalme, si maneno yake tu; יֶתֶר huonyesha yaliyosalia baada ya yale yaliyosimuliwa.
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: sala yake kwa Mungu wake
  rationale: Huhifadhi viwakilishi vyote vya umilikaji na maana ya אֶל kama kuelekezwa ‘kwa’ Mungu.
- source_word: הַחֹזִים
  choice: waonaji
  rationale: Huhifadhi cheo mahususi cha kinabii badala ya kukisawazisha na neno la jumla ‘manabii.’
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: waliosema naye
  rationale: Kitenzi cha Kiswahili ‘kusema naye’ kinaeleza kwa kawaida kuwa waonaji walimwelekea Manase kwa ujumbe.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahweh
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi wazo la kusema kwa mamlaka na uwakilishi wa mwenye jina.
- source_word: הִנָּם
  choice: tazama
  rationale: Huhifadhi nguvu ya neno linalovuta fikira za msomaji kwenye chanzo kilichoandikwa.
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: yameandikwa katika kumbukumbu za wafalme wa Israeli
  rationale: Huu ni mtindo wa kunukuu chanzo cha kifalme; ‘yameandikwa’ huweka wazi maana iliyodokezwa, na ‘kumbukumbu’ hueleweka kwa wasomaji wa sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa wafalme katika rejeo la chanzo
  choice: wafalme wa Israeli
  alternative: wafalme wa Yuda
  rationale: Maandishi ya Kimasora yanasema ‘Israeli’; tafsiri hairekebishi wala kuoanisha usemi huo na ufalme wa Yuda.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Waonaji’ linahifadhi istilahi mahususi ya Kiebrania; ‘tazama’ lina ladha rasmi inayofaa mtindo wa mwandishi wa Mambo ya Nyakati.
