base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: sw
  text: Kwa maana alijenga tena mahali pa juu ambayo Hezekia, baba yake, alikuwa amebomoa. Akasimamisha madhabahu za Mabaali, akatengeneza nguzo za Ashera, akalisujudia jeshi lote la mbinguni na kulitumikia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: alijenga tena
  rationale: Muundo wa vitenzi שוב + בנה unaonyesha kurudia kujenga au kurejesha kile kilichoondolewa. “Alijenga tena” ni Kiswahili cha kawaida na huhifadhi maana hiyo bila kutafsiri vitenzi hivyo kwa namna ngumu ya moja kwa moja.
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: Hili ni jina la maeneo ya ibada yaliyokuwa mara nyingi kwenye miinuko. Tafsiri hii huhifadhi istilahi halisi ya kiibada badala ya kuifanya kwa ujumla kuwa “sanamu” au “mahekalu.”
- source_word: נִתַּץ
  choice: palipokuwa pamebomolewa
  rationale: Kitenzi hiki humaanisha kubomoa au kuvunja kabisa muundo. “Pamebomolewa” kinafaa kwa maeneo hayo na kinaonyesha tendo lililotangulia la Hezekia.
- source_word: יְחִזְקִיָּהוּ אָבִיו
  choice: Hezekia baba yake
  rationale: Mpangilio huu unafuata kwa karibu uhusiano wa majina katika Kiebrania na ni wa kawaida katika Kiswahili.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: akasimamisha madhabahu kwa ajili ya Mabaali
  rationale: הקים ni kusimamisha au kuweka, na umbo la wingi הבעלים limehifadhiwa kwa “Mabaali,” likirejelea maumbo, majina, au maonyesho mbalimbali ya Baali katika ibada za maeneo tofauti.
- source_word: אֲשֵׁרוֹת
  choice: nguzo za Ashera
  rationale: Neno hili linaweza kutaja vitu vya ibada vilivyohusishwa na mungu wa kike Ashera. “Nguzo za Ashera” linaeleweka na hudumisha uhusiano huo maalumu bila kuzifanya kwa ujumla kuwa sanamu za mbao.
- source_word: וַיִּשְׁתַּחוּ
  choice: akalisujudia
  rationale: Kitenzi kinaonyesha kuinama chini au kujitupa kifudifudi kwa heshima ya ibada. “Kusujudia” huhifadhi tendo hilo la kimwili na la kiibada, huku kitenzi kinachofuata kikibaki tofauti.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: jeshi lote la mbinguni
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya “jeshi” la anga. Katika muktadha huu inarejelea vitu vya angani vilivyoabudiwa, si lazima malaika.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: na kulitumikia
  rationale: עבד katika muktadha wa ibada humaanisha kutumikia kwa uaminifu wa kidini. “Kulitumikia” huhifadhi tofauti ya kileksia na “kulikusujudia.”
theological_decisions:
- issue: Kutaja kwa usahihi vitu vya ibada za kipagani
  choice: Kudumisha istilahi maalumu “mahali pa juu,” “Mabaali,” na “nguzo za Ashera”
  alternative: Kuzifanya kwa ujumla kuwa “sanamu,” “miungu ya uongo,” au “mahali pa ibada”
  rationale: Aya inataja kwa makusudi aina tofauti za uasi wa kidini. Istilahi maalumu huhifadhi maelezo ya kihistoria na ya kidini bila kuongeza muhtasari wa kitheolojia usiotajwa moja kwa moja.
- issue: Maana ya “jeshi lote la mbinguni”
  choice: Kulihifadhi kama usemi wa vitu vya angani vilivyoabudiwa
  alternative: Kulieleza kuwa malaika au kulitafsiri moja kwa moja kuwa nyota pekee
  rationale: Muktadha wa madhabahu za Mabaali na nguzo za Ashera unaelekeza kwenye ibada ya vitu vya angani. Hata hivyo, usemi mpana wa Kiebrania umehifadhiwa katika matini, na ufafanuzi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Sentensi zimegawanywa ili zisomeke kwa urahisi, lakini mfuatano wa matendo ya Kiebrania umehifadhiwa. Istilahi za kiibada zimeachwa kuwa maalumu na zimefafanuliwa kwa tanbihi badala ya kulainishwa katika matini.
