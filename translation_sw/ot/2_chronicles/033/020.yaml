base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: sw
  text: Manase akalala na baba zake, nao wakamzika katika nyumba yake.[a] Kisha Amoni mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika jumba lake la kifalme”; Kiebrania kinasema “katika nyumba yake,” neno ambalo katika muktadha wa kifalme linaweza kurejelea eneo la jumba la kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Huhifadhi taswira ya nahau ya Kiebrania inayotaja kifo kwa kusema mtu amelala, badala ya kuifafanua moja kwa moja kuwa ‘alikufa’.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Huhifadhi kwa ukaribu kauli ya kawaida ya kifalme ya Kiebrania; ‘baba zake’ hapa hurejelea waliomtangulia katika ukoo.
- source_word: וַיִּקְבְּרֻהוּ
  choice: nao wakamzika
  rationale: Huwakilisha muundo tendaji wa wingi wa Kiebrania wenye kiambishi cha yambwa ‘-hu’.
- source_word: בֵּיתוֹ
  choice: nyumbani mwake
  rationale: Ni Kiswahili cha kawaida na cha asili kwa maana ya msingi ya ‘katika nyumba yake,’ huku uwezekano wa kurejelea jumba la kifalme ukibainishwa katika tanbihi.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Hutoa kwa ufupi maana ya kushika utawala wa kifalme katika kauli ya urithi wa ufalme.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Huwasilisha maana ya kuchukua nafasi ya mtawala aliyetangulia katika muktadha wa urithi wa ufalme.
