translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Kauli ‘akalala pamoja na baba zake’ imehifadhiwa kama nahau ya kifo; tanbihi imewekwa baada ya ‘nyumbani mwake’ kwa sababu ndiyo sehemu inayohusu mbadala wa ‘jumba la kifalme’.
