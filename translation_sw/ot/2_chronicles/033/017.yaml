  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: sw
  text: Hata hivyo, watu waliendelea kutoa dhabihu mahali pa juu, lakini walimtolea Yahweh Mungu wao peke yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָל
  choice: Hata hivyo
  rationale: Huonyesha utofauti wa kukubali hali iliyobaki licha ya matengenezo yaliyotangulia; ni Kiswahili cha kawaida na chenye hadhi.
- source_word: עוֹד
  choice: waliendelea
  rationale: Katika muundo huu pamoja na kitenzi shiriki, huonyesha kwamba desturi hiyo ilikuwa bado inaendelea.
- source_word: הָעָם
  choice: watu
  rationale: Ni tafsiri ya kawaida ya kundi la taifa katika simulizi.
- source_word: זֹבְחִים
  choice: kutoa dhabihu
  rationale: Huwakilisha tendo la kutoa sadaka za dhabihu kwa uwazi na kwa lugha ya kawaida ya kibiblia.
- source_word: בַּבָּמוֹת
  choice: mahali pa juu
  rationale: Ni istilahi ya ibada inayorejelea vituo vya kienyeji vya ibada, mara nyingi vilivyokuwa sehemu zilizoinuka.
- source_word: רַק
  choice: lakini ... peke yake
  rationale: Huweka mpaka kwa yule aliyepokea dhabihu, si kwa mahali zilipotolewa, na huhifadhi maana ya kusahihisha au kuwekea kikomo.
- source_word: לַיהוָה
  choice: walimtolea Yahweh
  rationale: Kihusishi לְ kinaonyesha mpokeaji wa dhabihu; jina la agano יהוה limetoholewa kuwa Yahweh.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Muundo wenye kiambishi cha umilikaji hutafsiriwa kwa kawaida kuwa “Mungu wao.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya ibada katika mahali pa juu
  choice: Watu waliendelea kutoa dhabihu katika mahali pa juu, lakini dhabihu hizo zilielekezwa kwa Yahweh peke yake.
  alternative: Watu walitoa dhabihu katika mahali pa juu palipowekwa wakfu kwa Yahweh pekee.
  rationale: 'Mpangilio wa Kiebrania unaunganisha רַק לַיהוָה na mpokeaji wa dhabihu. Hivyo unabaki mvutano wa simulizi: mahali pa juu paliendelea kutumiwa, ingawa ibada haikuelekezwa kwa miungu mingine.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Waliendelea kutoa dhabihu” huwasilisha hali endelevu ya עוֹד pamoja na kitenzi shiriki. Kauli “walimtolea Yahweh Mungu wao peke yake” inaweka wazi kwamba kizuizi kinamhusu mpokeaji wa dhabihu, bila kuondoa mvutano kuhusu kuendelea kutumiwa kwa mahali pa juu.
