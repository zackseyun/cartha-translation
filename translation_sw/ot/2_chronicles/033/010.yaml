  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: sw
  text: Yahwe akasema na Manase na watu wake, lakini hawakusikiliza[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawakutia maanani” au “hawakuzingatia.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikiliza kwa makini kwa namna inayotarajiwa kuleta mwitikio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: alisema na
  rationale: Katika muktadha huu, דּבר katika piel pamoja na אֶל hueleza kusema na mtu. Kiswahili cha kawaida hutumia “alisema na” kwa njia ya asili kuliko “alinena kwa.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limeandikwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם pamoja na kiambishi cha nafsi ya tatu umoja humaanisha watu walio chini ya utawala wa Manase; “watu wake” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְלֹא
  choice: lakini ... hawaku-
  rationale: Ingawa וְ inaweza kuwa “na,” hapa inaonyesha tofauti kati ya Mungu kusema nao na wao kutosikiliza; “lakini” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: הִקְשִׁיבוּ
  choice: hawakusikiliza
  rationale: קשׁב katika hiphil humaanisha kusikiliza kwa makini, kutia maanani, au kuitikia. “Hawakusikiliza” ni wazi na huhifadhi wigo wa maana bila kulazimisha maana kamili ya kutotii.
theological_decisions:
- issue: Warejelewa wa kiima cha wingi katika הִקְשִׁיבוּ
  choice: Manase na watu wake kwa pamoja
  alternative: Watu peke yao, huku Manase akiwa ametajwa tu kama mpokeaji mwingine wa ujumbe
  rationale: Wapokeaji wawili, Manase na watu wake, wametajwa kabla ya kitenzi cha wingi. Tafsiri “hawakusikiliza” huhifadhi kiima hicho cha wingi bila kuongeza ufafanuzi usiokuwamo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa asili; “Yahwe” huhifadhi jina la Mungu, na “hawakusikiliza” huhifadhi maana pana ya kitenzi bila kuifanya moja kwa moja kuwa “hawakutii.”
