base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: sw
  text: Akajenga madhabahu kwa ajili ya jeshi lote la mbinguni katika nyua mbili za nyumba ya Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jeshi lote la anga.” Usemi wa Kiebrania unahusu vitu au nguvu za mbinguni zilizoabudiwa katika dini za kuabudu nyota na sayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Kitenzi hiki cha masimulizi kinaendeleza mfuatano wa matendo ya Manase; “akajenga” ni cha kawaida na cha asili katika simulizi la Kiswahili.
- source_word: מִזְבְּחוֹת
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa maeneo ya kutolea dhabihu au kufukizia uvumba; umbo lake linaweza kutumika kwa wingi kulingana na muktadha.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: kwa ajili ya jeshi lote la mbinguni
  rationale: “Kwa ajili ya” huonyesha kwamba madhabahu yalijengwa kwa heshima au ibada ya vitu hivyo. “Jeshi lote la mbinguni” huhifadhi taswira ya Kiebrania bila kuibana iwe nyota peke yake.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: katika nyua mbili
  rationale: Kiebrania kinataja kwa wazi nyua mbili; “nyua” ni neno la kawaida kwa maeneo yaliyo wazi ndani ya eneo la nyumba au hekalu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania “nyumba ya Yahweh” na kulitaja jina la Mungu moja kwa moja.
theological_decisions:
- issue: Maana ya צְבָא הַשָּׁמַיִם katika muktadha wa ibada
  choice: jeshi lote la mbinguni
  alternative: viumbe vyote vya mbinguni; vitu vyote vya angani
  rationale: Tafsiri iliyochaguliwa huhifadhi nahau na upeo wa usemi wa Kiebrania, ambao katika muktadha huu unahusu vitu au nguvu za mbinguni zilizoabudiwa, bila kuamua kimyakimya kwamba ni nyota pekee.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה; “Yahweh” hulitambulisha kama jina maalumu badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nyumba ya Yahweh” huhifadhi lugha ya chanzo; “nyua mbili” ni ya asili na sahihi katika mazingira ya hekalu.
