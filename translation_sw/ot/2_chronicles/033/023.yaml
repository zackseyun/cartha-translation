base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: sw
  text: Lakini hakujinyenyekeza mbele za Yahwe kama Manase, baba yake, alivyojinyenyekeza[a], kwa maana Amoni mwenyewe alizidisha hatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alivyojinyenyekeza mbele za Yahwe.”
    reason: Usomaji mbadala unaweka wazi maneno yanayoeleweka kutokana na kishazi kilichotangulia lakini hayarudiwi katika Kiebrania.
lexical_decisions:
- source_word: נִכְנַע
  choice: hakujinyenyekeza
  rationale: Nifali ya כנע hapa ina maana ya kujishusha au kujitiisha; “kujinyenyekeza” ni Kiswahili cha kawaida na kinafaa katika muktadha wa toba.
- source_word: מִלִּפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Nahau hii inaonyesha kuwa tendo hilo linafanyika mbele ya Mungu au katika uwepo wake; jina la agano יְהוָה limehifadhiwa kama “Yahwe.”
- source_word: כְּהִכָּנַע
  choice: kama ... alivyojinyenyekeza
  rationale: Muundo wa kulinganisha כְ pamoja na kitenzi-jina unaweka kujinyenyekeza kwa Manase kuwa kipimo cha kulinganisha, huku ukihifadhi urudiaji wa mzizi כנע.
- source_word: מְנַשֶּׁה אָבִיו
  choice: Manase baba yake
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unamtambulisha Manase kuwa baba ya Amoni.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha maelezo yanayofafanua tathmini iliyotangulia bila kuifanya kuwa tofauti ya kimantiki.
- source_word: הוּא אָמוֹן
  choice: Amoni mwenyewe
  rationale: “Mwenyewe” huhifadhi msisitizo wa kiwakilishi הוּא pamoja na jina la Amoni kwa Kiswahili cha kawaida.
- source_word: הִרְבָּה אַשְׁמָה
  choice: alizidi kuwa na hatia
  rationale: Usemi huu unawasilisha kuongezeka kwa hatia ya Amoni kwa lugha ya Kiswahili iliyo wazi, bila kuichukulia אַשְׁמָה kuwa sadaka ya hatia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano, tetragramatoni; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maneno yaliyodokezwa baada ya kujinyenyekeza kwa Manase
  choice: Kuacha “mbele za Yahwe” ikiwa inadokezwa
  alternative: Kurudia “mbele za Yahwe” baada ya “alivyojinyenyekeza”
  rationale: Kiebrania hakiyarudii maneno hayo wazi baada ya כְּהִכָּנַע, ingawa yanaweza kueleweka kutoka kishazi kilichotangulia; tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku urudiaji wa “kujinyenyekeza” na msisitizo wa “Amoni mwenyewe” vikihifadhi mkazo wa maandishi ya Kiebrania.
