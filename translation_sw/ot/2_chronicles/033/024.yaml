  text: Watumishi wake wakafanya njama dhidi yake, wakamuua ndani ya nyumba yake mwenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: wakafanya njama dhidi yake
  rationale: Kirai קָשַׁר עַל humaanisha kufanya njama dhidi ya mtu, hasa katika muktadha wa njama ya kumuua mfalme. Tafsiri hii ni ya kawaida na inadumisha maana ya uhasama wa kisiasa.
- source_word: עֲבָדָיו
  choice: Watumishi wake
  rationale: Katika mazingira ya kifalme, עֶבֶד inaweza kumaanisha watumishi wa mfalme au maofisa wake. “Watumishi wake” inafuata neno la Kiebrania bila kubainisha cheo au hali ya utumwa ambayo mstari hautaji wazi.
- source_word: וַיְמִיתֻהוּ
  choice: wakamuua
  rationale: Hifili ya מוּת ina maana ya kusababisha afe, yaani kumuua. Kiswahili cha kawaida “wakamuua” kinatoa maana hiyo kwa uwazi na kwa uzito unaofaa muktadha wa mauaji.
- source_word: בְּבֵיתוֹ
  choice: ndani ya nyumba yake mwenyewe
  rationale: בְּ inaonyesha mahali, “ndani ya,” na kiambishi cha umilikaji kinaonyesha kuwa ilikuwa nyumba yake. “Mwenyewe” ni msisitizo wa asili katika Kiswahili unaoonyesha ukaribu wa kushtua wa mahali bila kubadili maana.
