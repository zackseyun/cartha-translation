  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: sw
  text: Naye alipokuwa katika dhiki, alimwomba Yahweh, Mungu wake, amfadhili[a], akajinyenyekeza sana mbele za Mungu wa baba zake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimsihi Yahweh, Mungu wake” au “alitafuta fadhili za Yahweh, Mungu wake.” Hii ni nahau ya Kiebrania yenye maana ya kumsihi mtu au kutafuta fadhili zake.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Mungu wa baba zake.” “Mungu wa mababu zake” ni tafsiri nyingine inayowezekana, lakini matini kuu inahifadhi umbo la kiume lililopo katika chanzo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: Naye alipokuwa katika dhiki
  rationale: Muundo huu unaonyesha hali ya wakati, na kitenzi kinamaanisha kuingia katika hali ya kusongwa au kuteseka. “Katika dhiki” ni Kiswahili cha kawaida kinachohifadhi uzito wa hali hiyo.
- source_word: חִלָּה אֶת־פְּנֵי
  choice: alimwomba ... amfadhili
  rationale: Nahau ya Kiebrania, ambayo kihalisi inahusisha ‘kuulainisha/kutuliza uso wa,’ hapa ina maana ya kumsihi mtu au kutafuta fadhili zake. Kauli hii ni ya asili katika Kiswahili na huhifadhi wazo la ombi la unyenyekevu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limeandikwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha Kiebrania kinaonyesha umilikaji; tafsiri hii inatoa maana ya moja kwa moja.
- source_word: וַיִּכָּנַע
  choice: akajinyenyekeza
  rationale: 'Nifali ya כנע inaweza kueleweka kwa maana ya kujirejelea katika muktadha huu: Manase mwenyewe alijishusha kwa unyenyekevu.'
- source_word: מְאֹד
  choice: sana
  rationale: Neno hili linatilia nguvu kiwango cha kujinyenyekeza; “sana” ni la kawaida na wazi.
- source_word: מִלִּפְנֵי
  choice: mbele za
  rationale: Ingawa kihalisi ni ‘kutoka mbele ya uso wa,’ hapa ni nahau yenye maana ya kuwa mbele au katika uwepo wa mtu.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Mungu wa baba zake
  rationale: Tafsiri hii inahifadhi umbo la kiume lililo wazi katika chanzo pamoja na maana yake ya kihistoria ya agano.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina binafsi la Mungu badala ya kuliweka kama cheo.
- issue: Lugha ya mababu katika אֱלֹהֵי אֲבֹתָיו
  choice: Mungu wa baba zake
  alternative: Mungu wa mababu zake
  rationale: Kiebrania kinasema wazi ‘baba zake.’ Tafsiri kuu inahifadhi umbo hilo bila kulipanua kimya kimya kuwa lugha jumuishi.
- issue: Namna ya tendo katika וַיִּכָּנַע
  choice: akajinyenyekeza
  alternative: akanyenyekezwa
  rationale: Umbo la Nifali linaweza kuwa la kutendwa au la kujirejelea. Muktadha wa kumwomba Mungu unaunga mkono maana ya kujirejelea, huku uwezekano wa kisarufi wa ‘alinyenyekezwa’ ukibaki kutambuliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Dhiki,” “amfadhili,” na “akajinyenyekeza” ni maneno ya sasa lakini yenye hadhi inayofaa matini ya Maandiko.
