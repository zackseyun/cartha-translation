  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: sw
  text: Aliwapitisha wanawe katika moto katika Bonde la Mwana wa Hinomu[a]. Alifanya ubashiri, uaguzi na uchawi, akajihusisha na wapiga ramli na wenye kuwasiliana na roho[b]. Akazidisha kutenda yaliyo maovu machoni pa Yahweh na kumkasirisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana iliyo wazi zaidi, “aliwatoa wanawe dhabihu katika moto.” Nahau ya Kiebrania kwa neno kwa neno ni “aliwapitisha wanawe katika moto.”
    reason: lexical_alternative
  - marker: b
    text: Maneno ya Kiebrania yaliyotafsiriwa “wapiga ramli na wenye kuwasiliana na roho” yanahusu watu au desturi zinazohusishwa na kutafuta habari kutoka kwa wafu au roho.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: Aliwapitisha wanawe motoni
  rationale: Huhifadhi nahau halisi ya Kiebrania bila kuficha kwamba tendo hilo linaelekea kumaanisha ibada ya kuwatoa watoto dhabihu; maana hiyo ya wazi zaidi inaelezwa katika tanbihi.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: katika Bonde la Mwana wa Hinomu
  rationale: Tafsiri hii inaonyesha maana ya jina la mahali huku ikihifadhi jina Hinomu kwa unukuzi wa Kiswahili.
- source_word: וְעוֹנֵן
  choice: Alifanya ubashiri
  rationale: Neno hili linahusu kutafuta maarifa kwa ishara au nyakati. “Ubashiri” ni neno linaloeleweka na pia linatofautishwa kwa kiasi na “uaguzi” unaofuata.
- source_word: וְנִחֵשׁ
  choice: uaguzi
  rationale: Kitenzi hiki kinahusu kutafuta habari au mwongozo kwa ishara na mbinu za kiuganga; “uaguzi” ni tafsiri ya kawaida na pana inayofaa katika orodha hii.
- source_word: וְכִשֵּׁף
  choice: uchawi
  rationale: Hurejelea matumizi ya uchawi au ulozi; “uchawi” ni neno la kawaida, zito na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: akajihusisha na waaguzi wa mizimu na wenye pepo wa utambuzi
  rationale: Muundo wa Kiebrania ni mgumu kutafsiri neno kwa neno. “Akajihusisha na” halifungii maana katika kuwasiliana nao, kuwaajiri au kufanya desturi hizo mwenyewe. Majina yaliyotumiwa yanaonyesha uhusiano wa maneno hayo na kutafuta habari kutoka kwa wafu au roho.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: Akazidisha kutenda
  rationale: Huhifadhi wazo la wingi na kuendelea kupita kiasi katika muundo wa רבה pamoja na kitenzi-jina, lakini inabaki kuwa Kiswahili cha asili.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: yaliyo maovu machoni pa Yahweh
  rationale: Huhifadhi nahau ya tathmini “machoni pa” na kulitaja jina la agano יְהוָה kama Yahweh.
- source_word: לְהַכְעִיסוֹ
  choice: na kumkasirisha
  rationale: Huwasilisha maana ya kusababisha hasira bila kulazimisha kuamua kama kishazi hicho kinaonyesha kusudi pekee au matokeo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Kama maana ya kuwatoa watoto dhabihu iwekwe wazi katika matini kuu
  choice: Kuhifadhi nahau “aliwapitisha wanawe motoni”
  alternative: Aliwatoa wanawe dhabihu motoni
  rationale: Nahau hiyo inaashiria kwa nguvu ibada ya kuwatoa watoto dhabihu, lakini matini kuu huhifadhi namna ya usemi wa Kiebrania. Ufafanuzi ulio wazi zaidi umetolewa katika tanbihi.
- issue: Uhusiano wa kishazi לְהַכְעִיסוֹ na matendo yaliyotangulia
  choice: na kumkasirisha
  alternative: ili kumkasirisha
  rationale: Muundo wa Kiebrania unaweza kuonyesha kusudi au matokeo. “Na kumkasirisha” huhifadhi mvutano huo vizuri zaidi kuliko kudai kwa wazi kwamba kusudi lake pekee lilikuwa kumkasirisha Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa ili orodha ndefu isomeke kwa urahisi. “Akazidisha kutenda” imechaguliwa badala ya “alifanya maovu mengi” ili kuhifadhi nguvu ya muundo wa Kiebrania bila kuwa ngumu kupita kiasi.
