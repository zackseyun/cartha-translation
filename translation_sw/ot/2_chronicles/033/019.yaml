base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: sw
  text: Sala yake, na jinsi alivyojibiwa, na dhambi yake yote na kukosa kwake uaminifu, pamoja na mahali ambako alijenga mahali pa juu pa ibada na kusimamisha maashera[a] na sanamu za kuchongwa kabla hajajinyenyekeza—tazama, mambo hayo yameandikwa katika maandishi ya waonaji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo za Ashera.” Neno la Kiebrania linaweza kumaanisha vitu vya ibada vilivyohusishwa na Ashera.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika maandishi ya Hozai.” Neno la mwisho la Kiebrania huenda ni jina la mtu badala ya kumaanisha “waonaji.”
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: Sala yake
  rationale: “Sala” ni tafsiri ya kawaida, pana na ya asili ya neno תְּפִלָּה katika Kiswahili.
- source_word: הֵעָתֶר לוֹ
  choice: jinsi alivyosikilizwa
  rationale: Kauli hii inaonyesha kwamba sala yake ilipata jibu linalokubali. Tafsiri hii ni ya asili na haiongezi wazi mtendaji ambaye hajatajwa katika kishazi hiki.
- source_word: כָל חַטָּאתוֹ
  choice: dhambi yake yote
  rationale: Inahifadhi umoja wa Kiebrania unaotumika kwa maana ya jumla, huku ikionyesha ukamilifu wa kosa lake.
- source_word: מַעְלוֹ
  choice: kukosa kwake uaminifu
  rationale: מעל huonyesha kuvunja uaminifu, hasa katika uhusiano wa kidini au wa agano; usemi huu unaeleweka bila kutumia istilahi finyu ya kimadhehebu.
- source_word: בָּמוֹת
  choice: mahali pa juu pa ibada
  rationale: Hueleza vituo vya ibada vilivyojengwa sehemu mbalimbali; nyongeza “pa ibada” huzuia usemi kueleweka kama mahali palipoinuka tu.
- source_word: הָאֲשֵׁרִים
  choice: Maashera
  rationale: Unukuzi huu hauamui kwa uhakika umbo la vitu vya ibada vilivyohusishwa na Ashera; uwezekano wa “nguzo za Ashera” umewekwa katika tanbihi.
- source_word: הַפְּסִלִים
  choice: sanamu za kuchongwa
  rationale: Inahifadhi maana halisi ya vitu vya ibada vilivyochongwa badala ya kutaja kazi yake tu kuwa sanamu za miungu.
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: kabla hajajinyenyekeza
  rationale: Inatoa maana ya kujishusha au kujinyenyekeza iliyo katika muundo wa Kiebrania na inaacha uzito wa toba katika simulizi bila kuupanua.
- source_word: הִנָּם
  choice: tazama, mambo hayo
  rationale: “Tazama” huhifadhi nguvu ya neno la kuonyesha la Kiebrania, na “mambo hayo” huweka wazi marejeo yake katika Kiswahili.
- source_word: עַל דִּבְרֵי חוֹזָי
  choice: katika kumbukumbu za waonaji
  rationale: דברי katika muktadha huu inaweza kumaanisha maandishi au kumbukumbu, na חוֹזָי inaweza kueleweka kama rejeo kwa waonaji; usomaji wa jina la mtu “Hozai” umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Hali ya kujinyenyekeza kwa Manase katika הִכָּנְעוֹ
  choice: kabla hajajinyenyekeza
  alternative: kabla hajanyenyekezwa
  rationale: Muundo wa Kiebrania unaunga mkono maana ya kujirejelea au hali isiyo na mtendaji aliyetajwa. Hii inalingana na msisitizo wa simulizi bila kuamua zaidi jinsi tendo la Mungu na mwitikio wa Manase vinavyohusiana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. “Tazama” inadumisha mtindo wa mwandishi wa Mambo ya Nyakati; “mahali pa juu pa ibada” hutoa maana ya kiibada kwa uwazi. Alama zote za tanbihi zimewekwa kwenye maneno yanayohusika.
