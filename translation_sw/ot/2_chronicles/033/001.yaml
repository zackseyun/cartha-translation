base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/001.yaml
  text: Manasseh was twelve years old when he began to reign, and he reigned fifty-five years in Jerusalem.
translation:
  language: sw
  text: Manase alikuwa na umri wa miaka kumi na miwili alipoanza kutawala, naye akatawala huko Yerusalemu kwa miaka hamsini na mitano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: alikuwa na umri wa miaka kumi na miwili
  rationale: Hii ni kauli ya kawaida ya Kiebrania ya kutaja umri. Tafsiri hii ni ya asili katika Kiswahili na inahifadhi maana kamili.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina limetolewa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Katika taarifa hii ya kifalme, muundo huu unaonyesha wakati alipoingia madarakani; kauli hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: miaka hamsini na mitano
  rationale: Huu ndio mpangilio wa kawaida wa namba hiyo katika Kiswahili cha sasa.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki hapa kinamaanisha kutawala akiwa mfalme. Kiswahili 'akatawala' ni kifupi, cha kawaida, na kinafuata mtiririko wa simulizi.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi cha Kiebrania kinaonyesha mahali. 'Huko Yerusalemu' ni ya asili katika sentensi hii na hudumisha maana ya mahali.
