base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: sw
  text: Lakini watu wa nchi[b] wakawaua wote waliokuwa wamefanya njama dhidi ya Mfalme Amoni[a], kisha watu wa nchi wakamfanya Yosia, mwanawe, kuwa mfalme badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafanya-njama wote.”
    reason: lexical_alternative
  - marker: b
    text: “Watu wa nchi” ni usemi wa Kiebrania unaoweza kumaanisha wakazi wa nchi, huenda ukiwa pia na maana ya kijamii au kisiasa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: wakawaua
  rationale: Kitenzi נכה katika muktadha huu kinaonyesha kuwapiga kwa kusababisha kifo; ‘wakawaua’ ni Kiswahili cha kawaida na huweka wazi matokeo ya tendo.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Tafsiri hii inafuata usemi wa Kiebrania kwa uwazi na haibani maana yake kuwa tabaka fulani la kijamii; kidokezo kinaeleza uwezekano wa maana ya kijamii na kisiasa.
- source_word: כָּל הַקֹּשְׁרִים
  choice: wote waliokuwa wamefanya njama
  rationale: Kishiriki cha קשר kinawataja watu walioungana katika njama; muundo huu ni wa asili katika Kiswahili na huhifadhi wazo la kula njama.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: dhidi ya Mfalme Amoni
  rationale: עַל pamoja na קשר huonyesha mlengwa wa njama; ‘dhidi ya’ huwasilisha uadui huo wazi.
- source_word: וַיַּמְלִיכוּ
  choice: wakamtawaza ... kuwa mfalme
  rationale: Hifili ya מלך humaanisha kumfanya mtu kuwa mfalme. ‘Kumtawaza kuwa mfalme’ ni usemi wa kawaida wa Kiswahili, bila kulazimisha maelezo ya sherehe maalumu.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: Yosia mwanawe
  rationale: Muundo huu unamtambulisha Yosia kuwa mwana wa Amoni kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: badala yake
  rationale: Usemi huu huonyesha kwamba Yosia alimrithi Amoni katika ufalme.
- source_word: וַ
  choice: Lakini ... kisha
  rationale: ‘Lakini’ huonyesha tofauti na tendo la watumishi wa Amoni katika mstari uliotangulia, na ‘kisha’ huendeleza mfuatano wa matukio kwa Kiswahili cha asili.
