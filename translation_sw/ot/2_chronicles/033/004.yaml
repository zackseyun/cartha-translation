  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: sw
  text: Akajenga madhabahu katika nyumba ya Yahweh[a], ambayo Yahweh alikuwa amesema kuihusu[b], “Katika Yerusalemu jina langu litakuwa milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika hekalu la Yahweh.” Neno kwa neno, “katika nyumba ya Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “jina langu litakuwa milele”; linganisha usemi wa kawaida wa Biblia, “jina langu litakuwa huko milele.”'
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: Akajenga
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu umoja wa kiume, kina maana ya ‘alijenga.’ Kiambishi ‘Aka-’ kinaendeleza mfululizo wa simulizi na kuwakilisha וּ kwa Kiswahili cha asili.
- source_word: מִזְבְּחוֹת
  choice: madhabahu
  rationale: Ni wingi wa מִזְבֵּחַ, neno la kawaida kwa mahali pa kutolea dhabihu. ‘Madhabahu’ ni neno la kawaida la Kiswahili na linaweza kutumiwa kwa umoja au wingi kulingana na muktadha; hapa kitenzi na chanzo vinaonyesha wingi.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: בַּיִת maana yake halisi ni ‘nyumba,’ ingawa hapa inarejelea hekalu. ‘Nyumba ya Yahweh’ huhifadhi tamathali ya Kiebrania bila kuficha maana ya kihekalu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ ili kuhifadhi jina binafsi lililo katika matini, badala ya kulibadili kuwa cheo.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi hiki kinaunganisha kauli inayofuata na ‘nyumba ya Yahweh,’ kama muundo wa Kiebrania unavyofanya.
- source_word: אָמַר יְהוָה
  choice: Yahweh alikuwa amesema
  rationale: Wakati uliopita timilifu wa Kiswahili unaonyesha kwa kawaida kwamba kauli ya Yahweh ilitangulia tendo la kujenga, bila kudai kwamba Kiebrania kina umbo tofauti la wakati huo.
- source_word: בִּירוּשָׁלִַם
  choice: Katika Yerusalemu
  rationale: Tafsiri ya moja kwa moja ya kihusishi na jina la mahali; kuwekwa mwanzoni mwa nukuu kunahifadhi msisitizo na mpangilio wa Kiebrania.
- source_word: יִהְיֶה שְּׁמִי
  choice: jina langu litakuwa
  rationale: Huhifadhi maneno halisi ya Kiebrania bila kuongeza ‘huko,’ neno ambalo halipo katika mstari huu.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno hili huonyesha muda usio na mwisho au wa kudumu; ‘milele’ ni tafsiri ya kawaida, ya asili, na yenye uzito unaofaa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu moja kwa moja. ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadili kuwa cheo au kutumia namna nyingine ya matamshi.
- issue: Kama iongezwe ‘huko’ katika kauli kuhusu jina la Mungu
  choice: jina langu litakuwa milele
  alternative: jina langu litakuwa huko milele
  rationale: Neno ‘huko’ (שָׁם) halipo katika matini ya mstari huu. Tafsiri inalinda usemi mfupi na mvutano wake, badala ya kuupanua kwa kufuata vifungu vinavyofanana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘Akajenga’ unafaa simulizi la kihistoria; ‘nyumba ya Yahweh’ huhifadhi taswira ya chanzo, huku tanbihi ikifafanua kuwa ni hekalu. Usemi usio wa kawaida kidogo ‘jina langu litakuwa milele’ umehifadhiwa kwa sababu unaakisi matini ya Kiebrania bila kuongeza ‘huko.’
