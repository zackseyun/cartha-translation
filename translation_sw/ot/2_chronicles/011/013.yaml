base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: sw
  text: Nao makuhani na Walawi waliokuwa katika Israeli yote walijiweka upande wake, wakitoka katika maeneo yao yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakajitokeza mbele yake” au “wakasimama mbele yake.” Nahau ya Kiebrania inaweza kumaanisha kufika mbele ya Rehoboamu au kujiweka upande wake; muktadha unaunga mkono zaidi maana ya kuwa waaminifu kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים
  choice: Nao makuhani
  rationale: Kiunganishi וְ kinaendeleza simulizi, huku nomino yenye uainishaji ikirejelewa kwa njia ya kawaida ya Kiswahili bila kulazimisha matumizi ya kiashiria.
- source_word: וְהַלְוִיִּם
  choice: na Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kikuhani la Walawi, na kiunganishi kinahifadhi uratibu wa makundi hayo mawili.
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: waliokuwa katika Israeli yote
  rationale: Kirai hiki kinawatambulisha makuhani na Walawi waliokuwapo kote Israeli, si katika Yuda peke yake.
- source_word: הִתְיַצְּבוּ עָלָיו
  choice: wakasimama upande wake
  rationale: Hitpael ya יצב pamoja na עָלָיו inaweza kueleza kujitokeza au kusimama mbele yake, lakini muktadha unaelekea kwenye kujipanga kwa uaminifu upande wa Rehoboamu. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: מִכָּל גְּבוּלָם
  choice: kutoka katika maeneo yao yote
  rationale: גְּבוּל hapa ina maana ya maeneo au wilaya walimoishi, badala ya mistari ya mipaka yenyewe. “Maeneo yao yote” ni wazi na ya kawaida kwa wasomaji wa sasa.
theological_decisions:
- issue: Ikiwa kitendo kinaonyesha tu kufika mbele ya Rehoboamu au kumuunga mkono
  choice: wakasimama upande wake
  alternative: wakajitokeza mbele yake / wakasimama mbele yake
  rationale: Muktadha wa 2 Mambo ya Nyakati 11 unaonyesha uhamaji na uaminifu kwa Rehoboamu, hivyo maana ya kumuunga mkono ina uwezekano mkubwa; hata hivyo, utata halisi wa nahau ya Kiebrania umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa maandiko. “Walawi” ni istilahi iliyozoeleka, na “maeneo” huepuka dhana potofu ya kwamba walitoka kwenye mistari ya mipaka.
