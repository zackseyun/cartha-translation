id: 2CH.11.1
reference: 2 Chronicles 11:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: sw
  text: Rehoboamu alipofika Yerusalemu, aliwakusanya watu wa Yuda na Benyamini[a], wapiganaji 180,000 waliochaguliwa[b], ili kupigana na Israeli na kuurudisha ufalme kwa Rehoboamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyumba ya Yuda na Benyamini,” yaani jumuiya ya kikabila na kisiasa ya Yuda na Benyamini.'
    reason: lexical_alternative
  - marker: b
    text: Au “watu bora 180,000 wenye uwezo wa kupigana vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: alipofika
  rationale: Kitenzi בוא hapa kinaonyesha kuwasili kwa Rehoboamu Yerusalemu; ‘alipofika’ ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וַיַּקְהֵל
  choice: aliwakusanya
  rationale: Hiphil ya קהל humaanisha kuwakusanya au kuwaita watu pamoja; hapa muktadha ni wa kuandaa jeshi.
- source_word: אֶת־בֵּית יְהוּדָה וּבִנְיָמִן
  choice: watu wa Yuda na Benyamini[a]
  rationale: Neno בֵּית, kihalisi ‘nyumba,’ linataja jumuiya ya kikabila na kisiasa. ‘Watu wa’ huwasilisha maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi tamathali ya Kiebrania.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 180,000
  rationale: Namba imewasilishwa moja kwa moja kwa tarakimu ili isomeke kwa urahisi.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: wapiganaji 180,000 waliochaguliwa[b]
  rationale: בָּחוּר katika muktadha wa kijeshi inaweza kumaanisha watu walioteuliwa au walio bora, na עֹשֵׂה מִלְחָמָה humaanisha wenye kufanya vita. ‘Wapiganaji waliochaguliwa’ ni usemi fasaha unaobeba maana zote mbili.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: ili kupigana na Israeli
  rationale: Ingawa עִם kwa kawaida ni ‘pamoja na,’ pamoja na kitenzi cha kupigana inaonyesha upande unaopingwa. Kiswahili ‘kupigana na’ ni wazi na cha kawaida.
- source_word: לְהָשִׁיב אֶת־הַמַּמְלָכָה
  choice: kuurudisha ufalme
  rationale: Hiphil ya שוב ina maana ya kusababisha kitu kirudi; ‘kuurudisha ufalme’ huhifadhi picha hiyo ya kurejesha utawala.
- source_word: לִרְחַבְעָם
  choice: kwa Rehoboamu
  rationale: Kiambishi ל hapa humtaja mpokeaji au mnufaika wa kurejeshwa kwa ufalme.
theological_decisions:
- issue: Maana ya ‘Israeli’ baada ya kugawanyika kwa ufalme
  choice: Israeli
  alternative: makabila ya kaskazini
  rationale: Maandishi ya Kiebrania yenyewe yanatumia ‘Israeli’ kutaja upande uliopingana na Rehoboamu. Kulihifadhi jina hilo huepuka kuongeza maelezo ya kiufafanuzi au msimamo kuhusu uhalali wa upande huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Istilahi za kisiasa na kijeshi zimewasilishwa kwa lugha ya kawaida bila kupoteza maana ya pamoja ya makabila au utata halisi wa בָּחוּר.
