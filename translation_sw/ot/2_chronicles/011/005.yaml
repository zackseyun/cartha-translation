translation:
  language: sw
  text: Rehoboamu aliishi Yerusalemu, naye akajenga miji kwa ajili ya ulinzi[a] katika Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miji yenye ngome” au “miji kama ngome”; neno la Kiebrania linaweza kumaanisha ulinzi, ngome, au uimarishaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: aliishi
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kukaa, kuishi, au kubaki. Katika muktadha huu, “aliishi” ni Kiswahili cha kawaida kinachoonyesha kwamba Rehoboamu alikuwa na makao Yerusalemu bila kudokeza mwanzo wa makazi ambao haujatajwa.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hiki ni kishazi cha mahali; “Yerusalemu” ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: וַיִּבֶן
  choice: akajenga
  rationale: Kitenzi בנה humaanisha “kujenga.” Tafsiri hii inadumisha tofauti kati ya tendo la kujenga na kusudi la ulinzi linaloelezwa na kishazi kinachofuata.
- source_word: עָרִים
  choice: miji
  rationale: Wingi wa עִיר kwa kawaida ni “miji”; neno hili linafaa kwa jiografia ya kiutawala na kijeshi katika kifungu hiki.
- source_word: לְמָצוֹר
  choice: kwa ajili ya ulinzi
  rationale: מָצוֹר inaweza kuhusiana na ngome, uimarishaji, au ulinzi wakati wa kuzingirwa. “Kwa ajili ya ulinzi” huonyesha kusudi la miji hiyo kwa lugha ya kawaida bila kulazimisha maana moja iliyo mahususi zaidi.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Hiki ni kishazi cha mahali kinachoonyesha eneo ambako miji ilijengwa.
