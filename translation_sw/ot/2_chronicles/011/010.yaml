lexical_decisions:
- source_word: צָרְעָה
  choice: Sora
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אַיָּלוֹן
  choice: Aiyaloni
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Jina la mahali limetoholewa kwa umbo la Kiswahili linalotambulika.
- source_word: אֲשֶׁר
  choice: iliyoko
  rationale: Kiwakilishi hiki kinaanzisha maelezo ya mahali; umoja unarejelea orodha hiyo kama kundi la miji bila kulazimisha wakati ambao Kiebrania hakijaueleza wazi.
- source_word: בִּיהוּדָה וּבְבִנְיָמִן
  choice: katika Yuda na Benyamini
  rationale: Inahifadhi maana ya kijiografia au kikabila bila kuitafsiri kupita kiasi kuwa umiliki.
- source_word: עָרֵי מְצֻרוֹת
  choice: miji yenye ngome
  rationale: Hueleza miji iliyolindwa kwa ngome kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: na ... , ... na ...
  rationale: Kiunganishi kinaendeleza orodha kutoka mstari uliotangulia; Kiswahili cha kawaida hakihitaji kurudia “na” kabla ya kila jina.
theological_decisions:
- issue: Upeo wa kirai עָרֵי מְצֻרוֹת
  choice: Kukitenga kwa kistari kama muhtasari wa miji iliyoorodheshwa
  alternative: Kukifunga moja kwa moja na Hebroni pekee kwa koma
  rationale: Kirai cha mwisho kinaweza kuwa maelezo ya ujumla kuhusu miji katika orodha; kistari kinahifadhi kazi hiyo ya kimajumui bila kudai kwamba kinahusu Hebroni pekee.
