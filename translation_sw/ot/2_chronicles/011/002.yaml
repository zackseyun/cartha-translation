  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: likamjia
  rationale: Muundo wa masimulizi unaendeleza tukio linalofuata. Kiambishi -ka- kinaonyesha mfuatano wa matukio kwa Kiswahili cha kawaida bila kutumia tafsiri ngumu ya neno kwa neno kama ‘ikawa.’
- source_word: דְּבַר יְהוָה
  choice: Neno la Yahweh
  rationale: Huhifadhi muundo maalumu wa kinabii na uhusiano wa umilikaji katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: שְׁמַעְיָהוּ
  choice: Shemaya
  rationale: Jina limenukuliwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni cheo kinachotambulika cha mhusika wa kinabii; muundo huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Hutanguliza usemi wa moja kwa moja na kuhifadhi kwa karibu tashihisi ya neno linalosema.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
