  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: sw
  text: Rehoboamu akamweka Abiya mwana wa Maaka kuwa mkuu na kiongozi miongoni mwa ndugu zake[a], kwa maana alikusudia kumfanya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya ndugu zake”; kihusishi cha Kiebrania kinaweza kueleweka kuwa kinaonyesha ukuu wake katika uhusiano nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: akamweka
  rationale: Hifili ya עמד hapa ina maana ya kumweka mtu katika cheo au nafasi. “Akamweka” ni ya kawaida katika Kiswahili na inafaa pamoja na kijalizo “kuwa mkuu.”
- source_word: לָרֹאשׁ
  choice: kuwa mkuu
  rationale: רֹאשׁ, kihalisi “kichwa,” hapa inaonyesha cheo cha kwanza au ukuu. “Kuwa mkuu” huwasilisha hadhi hiyo kwa lugha ya sasa.
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: Abiya mwana wa Maaka
  rationale: Majina yameandikwa kwa maumbo yanayotambulika katika Kiswahili, na uhusiano wa kifamilia umehifadhiwa moja kwa moja.
- source_word: לְנָגִיד
  choice: kiongozi
  rationale: נָגִיד humaanisha mwenye nafasi ya uongozi au utawala. “Kiongozi” huepuka kuifanya tayari kuwa sawa na “mfalme,” cheo ambacho kifungu cha mwisho kinasema Rehoboamu alikusudia kumpa.
- source_word: בְּאֶחָיו
  choice: miongoni mwa ndugu zake
  rationale: ב inaweza kuonyesha nafasi ndani ya kundi au ukuu katika uhusiano nao. Tafsiri hii huhifadhi maana ya ndani ya kundi bila kulazimisha wazo la mamlaka ya moja kwa moja juu yao.
- source_word: כִּי
  choice: kwa kuwa
  rationale: כִּי hapa inatanguliza sababu ya kumweka Abiya katika cheo hicho.
- source_word: לְהַמְלִיכוֹ
  choice: alikusudia kumtawaza kuwa mfalme
  rationale: Muundo wa kitenzi unaonyesha kusababisha awe mfalme, na muktadha wa kishazi kifupi unaeleweka kama kusudi la Rehoboamu. “Kumtawaza kuwa mfalme” ni Kiswahili cha kawaida kinachoeleza tendo hilo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa urahisi. Maneno “mkuu, kiongozi” yamewekwa kama maelezo yanayofuatana ili kuhifadhi vipashio viwili vya Kiebrania, לָרֹאשׁ na לְנָגִיד, bila kuongeza kiunganishi kisichokuwapo katika chanzo.
