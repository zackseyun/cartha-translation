  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: sw
  text: Rehoboamu alimpenda Maaka, binti wa Absalomu,[a] kuliko wake zake wote na masuria wake wote, kwa maana alikuwa ameoa wake kumi na wanane na alikuwa na masuria sitini. Alizaa wana ishirini na wanane na binti sitini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “mzao wa kike wa Absalomu”; katika taarifa za nasaba, neno la Kiebrania linalotafsiriwa “binti” wakati mwingine linaweza kutumiwa kwa maana pana zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: alimpenda
  rationale: Kitenzi אהב kinaonyesha upendo au mapenzi; maana ya kulinganisha inaelezwa na kifungu kinachofuata, מִכָּל.
- source_word: בַת אַבְשָׁלוֹם
  choice: binti ya Absalomu
  rationale: בַת kwa kawaida ni ‘binti’. Ingawa katika nasaba inaweza kumaanisha mzao wa kike kwa upana zaidi, tafsiri kuu inahifadhi usemi wa Kiebrania.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: kuliko wake zake wote na masuria wake
  rationale: מִכָּל huonyesha ulinganisho, na ‘masuria’ huhifadhi tofauti ya kijamii iliyopo kati ya נָשִׁים na פִילַגְשִׁים.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha maelezo ya msingi yanayofafanua kauli iliyotangulia.
- source_word: נָשִׁים ... נָשָׂא
  choice: alikuwa ameoa wake kumi na wanane
  rationale: נשא pamoja na נשים ni nahau ya kuoa; ‘alikuwa ameoa’ ni Kiswahili cha kawaida na kinaonyesha tendo lililotangulia.
- source_word: פִּילַגְשִׁים
  choice: masuria
  rationale: ‘Masuria’ ni neno mahususi la Kiswahili kwa wanawake waliokuwa na hadhi ya wake wa daraja la pili, hivyo halifuti tofauti iliyomo katika Kiebrania.
- source_word: וַיּוֹלֶד
  choice: alizaa
  rationale: Kwa mhusika wa kiume, kitenzi hiki humaanisha kupata au kuzaa watoto; ‘alizaa’ ni usemi mfupi na wa kawaida unaoeleweka kutokana na kutajwa kwa wana na binti.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: wana ishirini na wanane
  rationale: Tafsiri ya moja kwa moja ya idadi na nomino בָּנִים.
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: binti sitini
  rationale: Tafsiri ya moja kwa moja ya idadi na nomino בָּנוֹת.
theological_decisions:
- issue: Utambulisho wa kinasaba wa Maaka kama ‘binti ya Absalomu’
  choice: Kudumisha ‘binti ya Absalomu’ katika maandishi makuu
  alternative: ‘mzao wa kike wa Absalomu,’ labda mjukuu wake
  rationale: Kiebrania chenyewe kinasema ‘binti,’ lakini matumizi ya kinasaba yanaweza kuwa mapana zaidi. Maandishi makuu hayatatui kimya kimya utata huo; tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wake’ na ‘masuria’ vinadumisha makundi mawili ya kijamii ya maandishi asilia; sentensi imegawanywa baada ya orodha hiyo ili isomeke kwa urahisi.
