  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo mfupi, wenye heshima na unaosomeka kwa urahisi. Majina ya mahali yametolewa kwa maumbo yanayofaa mfumo wa sauti wa Kiswahili. Tanbihi ya Kiingereza kuhusu ‘Tekoah’ haikuhamishwa kwa kuwa ni tofauti ya unukuzi wa Kiingereza, si tofauti ya maana katika chanzo cha Kiebrania.
