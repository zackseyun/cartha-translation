  text: And he built Bethlehem[a], Etam, and Tekoa.
translation:
  language: sw
  text: Akajenga Bethlehemu, Etamu na Tekoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Kitenzi בנה katika Qal wayyiqtol kwa kawaida humaanisha ‘kujenga.’ Muktadha unaonyesha miji ikiimarishwa, lakini mstari huu wenyewe hautumii kitenzi mahsusi cha ‘kuimarisha kwa ngome’; kwa hiyo ‘akajenga’ huhifadhi maana ya moja kwa moja bila kuongeza maelezo.
- source_word: אֶת
  choice: '[hakikutafsiriwa]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania na hakina neno huru linalohitajika katika Kiswahili.
- source_word: בֵּית לֶחֶם
  choice: Bethlehemu
  rationale: Ni jina la mahali; ‘Bethlehemu’ ni umbo lililozoeleka na kutambulika katika Kiswahili.
- source_word: עֵיטָם
  choice: Etamu
  rationale: Ni jina la mahali lililonukuliwa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: תְּקוֹעַ
  choice: Tekoa
  rationale: Ni jina la mahali; ‘Tekoa’ hunukuu jina la Kiebrania kwa uwazi na kwa namna ya asili katika Kiswahili.
- source_word: וְ...וְ...וְ
  choice: '..., ... na ...'
  rationale: Ingawa Kiebrania huunganisha vipashio kwa waw, orodha yenye koma na ‘na’ kabla ya kipashio cha mwisho ni ya kawaida na wazi katika Kiswahili cha sasa.
