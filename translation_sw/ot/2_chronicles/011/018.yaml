base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: sw
  text: Rehoboamu akamwoa Mahalathi, binti ya Yerimothi, mwana wa Daudi, na wa Abihaili, binti ya Eliabu, mwana wa Yese.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nasaba hii ya Kiebrania imebanwa; kwa maneno halisi ni: “Mahalathi mwana wa Yerimothi mwana wa Daudi, Abihaili binti ya Eliabu mwana wa Yese.” Huenda maana yake ni kwamba Mahalathi alitokana na nasaba zote mbili. Wengine humchukulia Abihaili kuwa jina jingine katika taarifa hii ya ukoo au, ingawa si uwezekano mkubwa, kuwa mke wa pili.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: akamwoa
  rationale: Nahau ya Kiebrania ina maana ya kumchukua mwanamke kuwa mke. “Akamwoa” ni Kiswahili cha kawaida na chenye hadhi kinachoeleza wazi uhusiano wa ndoa, huku “aka-” ikidumisha mwendelezo wa masimulizi.
- source_word: מָחֲלַת
  choice: Mahalathi
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: binti ya Yerimothi mwana wa Daudi
  rationale: Nakala ya Kiebrania ina בן, “mwana,” kabla ya Yerimothi, ingawa Mahalathi ni mwanamke. Muktadha unaelekea kuonyesha uhusiano wa binti; maelezo ya chini yanahifadhi ugumu halisi wa maandishi.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: na ya Abihaili binti ya Eliabu mwana wa Yese
  rationale: “Na ya” inaunganisha Abihaili na ukoo wa Mahalathi kama mzazi wake mwingine, huku ikihifadhi mtiririko wa majina na mahusiano ya ukoo katika Kiebrania.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa majina katika nasaba
  choice: Mahalathi anaelezwa kuwa binti ya Yerimothi na ya Abihaili.
  alternative: Abihaili ni jina la mke wa pili; au ni jina jingine katika taarifa hii ya ukoo.
  rationale: Kiebrania kimebanwa na kina utata, lakini nomino ya umoja “mke” na muundo wa taarifa ya nasaba vinaunga mkono zaidi kwamba mke mmoja, Mahalathi, ndiye anayetajwa, pamoja na nasaba ya pande zote mbili. Maelezo ya chini yanataja njia nyingine za kuelewa maandishi bila kuzificha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametoholewa kwa maumbo yanayoeleweka katika mapokeo ya Kiswahili cha Biblia. Sentensi kuu imewekwa wazi kwa usomaji wa kawaida, lakini utata wa Kiebrania umehifadhiwa katika tanbihi.
