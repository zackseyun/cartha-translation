base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: sw
  text: '“Mwambie Rehoboamu mwana wa Sulemani, mfalme wa Yuda, na uwaambie Israeli wote walio katika Yuda na Benyamini hivi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: Mwambie
  rationale: Kauli ya amri pamoja na kihusishi cha anayeelekezewa maneno imetafsiriwa kwa muundo wa kawaida wa Kiswahili unaohifadhi nguvu ya agizo.
- source_word: רְחַבְעָם
  choice: Rehoboamu
  rationale: Tahajia ya jina inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן שְׁלֹמֹה
  choice: mwana wa Sulemani
  rationale: Inahifadhi uhusiano wa ukoo unaoonyeshwa na mnyororo wa hali ya kutegemeana katika Kiebrania.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo cha kifalme kimetolewa kwa Kiswahili cha kawaida kama maelezo ya Rehoboamu.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: na Israeli wote
  rationale: Jina la taifa la agano ‘Israeli’ limehifadhiwa badala ya kubadilishwa kuwa ‘Waisraeli’; upatanisho wa ‘wote’ unaonyesha kuwa hapa jina hilo linawarejelea watu.
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: walio katika Yuda na Benyamini
  rationale: Kihusishi ב kinaonyesha mahali. Kishazi ‘walio katika’ kinafafanua kwa Kiswahili cha asili kwamba wanaoitwa Israeli hapa wanapatikana katika maeneo hayo mawili.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Kitenzi-jina hiki kinatanguliza ujumbe unaofuata. ‘Hivi:’ ni muundo wa sasa na wa kawaida wa Kiswahili unaounganisha agizo hili na nukuu ya mstari unaofuata.
theological_decisions:
- issue: Maana ya ‘Israeli’ baada ya kugawanyika kwa ufalme
  choice: Israeli wote walio katika Yuda na Benyamini
  alternative: Waisraeli wote wa Yuda na Benyamini
  rationale: Matini yenyewe hutumia jina ‘Israeli’ kwa kundi lililo katika maeneo hayo. Tafsiri imehifadhi jina hilo na maana ya mahali bila kulifanya kimya kimya kuwa utambulisho wa makabila pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘Mwambie ... na Israeli wote’ ni mfupi na wa kawaida; ‘hivi:’ hutanguliza moja kwa moja ujumbe wa mstari unaofuata.
