translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; sentensi ni fupi, yenye hadhi, na inafaa kwa taarifa ya ukoo. “Naye” huendeleza mtiririko wa simulizi, huku “akamzalia” ikiwasilisha kwa kawaida uhusiano wa mama, baba, na wana bila ufafanuzi wa ziada.
