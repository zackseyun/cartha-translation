  text: 'And she bore him sons: Jeush, Shemariah, and Zaham.'
translation:
  language: sw
  text: 'Naye akamzalia wana: Yeushi, Shemaria na Zahamu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Naye akamzalia
  rationale: Kitenzi cha Kiebrania kinaendeleza simulizi na kumweka mwanamke kuwa mtendaji. Muundo wa Kiswahili “akamzalia” ni wa kawaida katika taarifa za ukoo na unajumuisha pia maana ya לוֹ.
- source_word: לוֹ
  choice: -m- katika “akamzalia”
  rationale: Kihusishi ל pamoja na kiambishi cha nafsi humtaja baba ambaye mwanamke alimzalia; Kiswahili hueleza uhusiano huo kwa kiambishi cha yambwa katika “akamzalia.”
- source_word: בָּנִים
  choice: wana
  rationale: Neno la Kiebrania linamaanisha wana wa kiume, nao majina matatu yanayofuata ni ya wana wa kiume. “Wana” ni la asili na lenye hadhi katika muktadha wa ukoo.
- source_word: יְעוּשׁ
  choice: Yeushi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likihifadhi sauti kuu za jina la Kiebrania.
- source_word: שְׁמַרְיָה
  choice: Shemaria
  rationale: Jina limetoholewa kutoka Kiebrania kwa umbo la Kiswahili linalotambulika; sehemu ya mwisho -יה inawakilishwa kwa “-ia” bila kuliongezea maana isiyotajwa katika mstari.
- source_word: זָהַם
  choice: Zahamu
  rationale: Jina limetoholewa kwa kufuata sauti za Kiebrania na kuongezewa irabu ya mwisho ili litamkike kwa kawaida katika Kiswahili.
