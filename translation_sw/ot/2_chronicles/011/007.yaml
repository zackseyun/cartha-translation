  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: na
  rationale: וְ pamoja na kiashiria cha yambwa אֶת huendeleza orodha iliyoanza katika mstari uliotangulia. Kiswahili hakiwakilishi אֶת kwa neno maalumu, hivyo kiunganishi cha kawaida “na” kinatosha.
- source_word: בֵּית צ֥וּר
  choice: Beth-suri
  rationale: Hili ni jina la mahali. Limeendelezwa kwa unukuzi unaofaa matamshi na mazoea ya majina ya kibiblia katika Kiswahili, badala ya kutafsiri maana yake ya kihalisi.
- source_word: שׂוֹכ֖וֹ
  choice: Soko
  rationale: Hili ni jina la mji na limeandikwa kwa unukuzi wa moja kwa moja unaosomeka kwa Kiswahili; tofauti za tahajia katika lugha nyingine hazibadili utambulisho wa mahali.
- source_word: עֲדֻלָּֽם
  choice: Adulamu
  rationale: Jina hili la mahali katika Yuda limenukuliwa kwa umbo la Kiswahili linalosomeka kwa urahisi, bila kutafsiriwa maana.
theological_decisions: []
translation_notes:
  register: Kauli hii ni mwendelezo wa orodha ya miji kutoka mstari uliotangulia. Mtindo umehifadhiwa kuwa mfupi, rasmi kwa kiasi, na wa kawaida katika Kiswahili sanifu cha Afrika Mashariki.
