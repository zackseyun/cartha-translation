base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: sw
  text: Katika kila mji aliweka ngao na mikuki, akafanya miji hiyo iwe imara sana; na Yuda na Benyamini zikawa zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yuda na Benyamini zikawa zake.” Nahau hii inaweza kumaanisha kuwa walikuwa chini ya mamlaka yake au wa upande wake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר
  choice: Katika kila mji
  rationale: Urudiaji wa Kiebrania עִיר וָעִיר una maana ya kugawa kwa kila mmoja mmoja. Kiswahili cha kawaida huwasilisha maana hiyo kwa kawaida kwa kusema “katika kila mji,” bila urudiaji usio wa kawaida.
- source_word: צִנּוֹת
  choice: ngao
  rationale: Neno hili hutaja ngao, huenda ngao kubwa za kujikinga mwili; “ngao” ni wazi na haliongezi ukubwa ambao mstari huu hautaji moja kwa moja.
- source_word: וּרְמָחִים
  choice: na mikuki
  rationale: רְמָחִים ni neno la kawaida kwa mikuki; “mikuki” ni sawa ya asili katika Kiswahili cha sasa.
- source_word: וַיְחַזְּקֵם
  choice: akaifanya miji hiyo kuwa imara
  rationale: Kiwakilishi cha wingi kinaelekea kurejelea miji iliyotajwa katika muktadha, si ngao na mikuki. Ufasiri huu huweka rejeo wazi kwa Kiswahili huku ukihifadhi maana ya kuimarisha.
- source_word: לְהַרְבֵּה מְאֹד
  choice: sana
  rationale: Muundo huu unasisitiza kiwango kikubwa. “Sana” huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila usemi mzito usio wa asili.
- source_word: וַיְהִי לוֹ יְהוּדָה וּבִנְיָמִן
  choice: hivyo Yuda na Benyamini zikawa chini ya utawala wake
  rationale: Nahau ויהי לו inaweza kueleza umiliki, mamlaka, au utii. Katika muktadha wa kifalme, “chini ya utawala wake” huonyesha mamlaka ya Rehoboamu bila kudokeza kuwa watu au maeneo hayo yalikuwa mali yake binafsi.
theological_decisions:
- issue: Maana ya Yuda na Benyamini ‘kuwa zake’
  choice: zikawa chini ya utawala wake
  alternative: zikawa zake
  rationale: Muktadha unahusu mamlaka ya kisiasa ya mfalme. Chaguo hili huepuka kutatua kifungu kama umiliki binafsi huku likihifadhi wazo la kuwa chini ya mamlaka au utii wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya asili kwa wasomaji wa kawaida; kiwakilishi kisicho dhahiri katika “akawaimarisha” kimefafanuliwa kuwa kinarejelea miji. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
