base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: sw
  text: Akajiwekea makuhani kwa ajili ya mahali pa juu, kwa ajili ya mashetani wenye umbo la mbuzi[a], na kwa ajili ya ndama aliowatengeneza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbuzi” au “viumbe wa mfano wa mbuzi.” Neno la Kiebrania linaweza kumaanisha viumbe wenye sura ya mbuzi waliohusishwa na ibada isiyoruhusiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: akajiwekea
  rationale: Katika muundo huu, kitenzi kina maana ya kuteua au kuweka watu katika wadhifa; pamoja na לּוֹ, ‘akajiwekea’ huonyesha kwamba alifanya hivyo kwa manufaa na mfumo wake mwenyewe.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wenye wadhifa wa kikuhani.
- source_word: לַבָּמוֹת
  choice: kwa ajili ya mahali pa juu
  rationale: ‘Mahali pa juu’ huhifadhi maana ya maeneo ya ibada yaliyoinuka au vituo vya ibada vinavyoitwa בָּמוֹת katika Biblia.
- source_word: לַשְּׂעִירִים
  choice: kwa ajili ya mashetani wenye umbo la mbuzi
  rationale: Katika muktadha huu wa ibada, neno linaelekea kumaanisha viumbe au sanamu za kiibada zenye sura ya mbuzi, si mbuzi wa kawaida; maelezo haya yanafikisha maana bila kuondoa taswira ya Kiebrania.
- source_word: וְלָעֲגָלִים
  choice: na kwa ajili ya sanamu za ndama
  rationale: Ingawa neno lenyewe ni ‘ndama,’ hapa linarejelea vitu vilivyotengenezwa kwa ibada. ‘Sanamu za ndama’ hufanya rejeo hilo lieleweke katika Kiswahili cha kawaida.
- source_word: אֲשֶׁר עָשָׂה
  choice: alizokuwa ametengeneza
  rationale: Muundo huu unaunganisha kitendo cha kutengeneza vitu hivyo na uteuzi uliofuata wa makuhani; wakati timilifu huonyesha kwamba vilikuwa tayari vimetengenezwa.
theological_decisions:
- issue: Maana ya שְׂעִירִים katika muktadha wa ibada isiyoruhusiwa
  choice: mashetani wenye umbo la mbuzi
  alternative: mbuzi; viumbe kama mbuzi
  rationale: Orodha hii inahusu vituo na vitu vya ibada vilivyoanzishwa na Yeroboamu. Rejeo la viumbe au sanamu za kiroho zenye sura ya mbuzi linafaa zaidi kuliko wanyama halisi, lakini tanbihi huhifadhi uwezekano wa tafsiri halisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mpangilio wa orodha ya Kiebrania, huku ‘akajiwekea’ ikitoa kwa ufasaha wazo la kuteua makuhani kwa mfumo wake mwenyewe.
