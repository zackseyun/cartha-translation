base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: sw
  text: Kwa maana Walawi waliyaacha maeneo yao ya malisho[a] na milki yao, wakaenda Yuda na Yerusalemu, kwa sababu Yeroboamu na wanawe walikuwa wamewatenga wasiwe makuhani wa Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maeneo yao ya wazi” au “ardhi ya jumuiya.” Neno la Kiebrania linamaanisha ardhi ya wazi iliyohusishwa na miji yao.
    reason: lexical_alternative
  - marker: b
    text: Au “walikuwa wamewazuia kuhudumu kama makuhani wa Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: maeneo yao ya malisho
  rationale: Neno מִגְרָשׁ humaanisha eneo la wazi lililohusishwa na mji, hasa kwa ajili ya malisho. Tafsiri hii ni wazi na ya kawaida bila kulifanya kuwa ardhi ya malisho pekee bila tahadhari ya tanbihi.
- source_word: אֲחֻזָּתָם
  choice: ardhi zao walizomiliki
  rationale: אֲחֻזָּה hapa linaashiria milki au sehemu ya ardhi iliyoshikiliwa. Kauli hii ni ya kawaida zaidi kuliko “milki zao” na ni mahususi zaidi kuliko “mali zao.”
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: wakaenda Yuda na Yerusalemu
  rationale: Kitenzi הלך pamoja na ל kinaonyesha kwenda kuelekea mahali; “wakaenda” hudumisha mtazamo wa simulizi na mfuatano wa matukio.
- source_word: הִזְנִיחָם
  choice: walikuwa wamewakataa
  rationale: Hifili ya זנח inaweza kumaanisha kukataa, kutupilia mbali, au kutenga. “Waliwakataa” huhifadhi nguvu ya kukataliwa kwa watu, huku kishazi kinachofuata kikieleza athari yake katika huduma.
- source_word: מִכַּהֵן
  choice: wasihudumu kama makuhani
  rationale: מִן pamoja na umbo la kitenzi cha כהן huonyesha kuzuiwa au kuondolewa katika kutenda kazi ya ukuhani. Muundo huu ni wa kawaida katika Kiswahili na hudumisha maana hiyo.
- source_word: לַיהוָה
  choice: wa Yahweh
  rationale: Katika Kiswahili, “kuhudumu kama makuhani wa Yahweh” ni muundo wa kawaida unaoonyesha kwamba huduma yao ya ukuhani ilikuwa kwa Yahweh.
- source_word: כִּי ... כִּי
  choice: Kwa maana ... kwa sababu
  rationale: כִּי ya kwanza inaeleza sababu ya kauli iliyotangulia, na ya pili inaeleza sababu ya Walawi kuondoka. Kutumia viunganishi viwili tofauti kunafanya uhusiano huo uwe wazi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya הִזְנִיחָם katika kuondolewa kwa Walawi katika huduma
  choice: walikuwa wamewakataa wasihudumu kama makuhani
  alternative: walikuwa wamewatenga na huduma ya ukuhani
  rationale: Tafsiri kuu huhifadhi maana ya kukataliwa kwa Walawi wenyewe na pia matokeo yake ya kuzuiwa kuhudumu. Tanbihi inadumisha uwezekano wa kusisitiza zaidi kutengwa kwao rasmi katika huduma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. “Ardhi zao walizomiliki” imetumiwa badala ya “milki zao” ili ieleweke kwa urahisi bila kupoteza maana ya umiliki wa ardhi. Alama zote za tanbihi zimewekwa katika matini kuu.
