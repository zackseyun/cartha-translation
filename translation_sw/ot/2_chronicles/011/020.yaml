  text: וְ/אַחֲרֶ֣י/הָ לָקַ֔ח אֶֽת מַעֲכָ֖ה בַּת אַבְשָׁל֑וֹם וַ/תֵּ֣לֶד ל֗/וֹ אֶת אֲבִיָּה֙ וְ/אֶת עַתַּ֔י וְ/אֶת זִיזָ֖א וְ/אֶת שְׁלֹמִֽית־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: sw
  text: Baada yake, akamchukua Maaka, binti ya Absalomu[a], naye akamzalia Abiya, Atai, Ziza na Shelomithi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “binti ya Absalomu.” Katika nasaba, neno “binti” wakati mwingine linaweza kumaanisha mjukuu wa kike au mzao mwingine wa kike; kwa hiyo baadhi huelewa “mjukuu wa kike wa Absalomu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: Baada yake
  rationale: Kirai hiki kina kihusishi ‘baada ya’ pamoja na kiambishi cha nafsi ya tatu, umoja, kike; kinamrejelea mke aliyetajwa kabla.
- source_word: לָקַח
  choice: akamchukua
  rationale: Maana ya msingi ni ‘alichukua.’ Katika muktadha huu ni kumchukua mwanamke awe mke, lakini tafsiri inadumisha usemi wa Kiebrania bila kuufafanua zaidi ya chanzo.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: בַּת אַבְשָׁלוֹם
  choice: binti ya Absalomu
  rationale: Hii inafuata moja kwa moja neno la Kiebrania ‘binti.’ Hata hivyo, katika nasaba neno hilo linaweza kumaanisha mjukuu wa kike au mzao mwingine wa kike; uwezekano huo umeonyeshwa katika tanbihi.
- source_word: וַתֵּלֶד לוֹ
  choice: naye akamzalia
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba Maaka alimzalia Rehoboamu watoto.
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: Abiya, Atai, Ziza na Shelomithi
  rationale: Majina yametoholewa kwa maumbo ya kawaida ya Kiswahili; viashiria vya yambwa vinavyorudiwa katika Kiebrania havihitaji kuwakilishwa kimoja kimoja katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa nasaba katika kumwita Maaka ‘binti ya Absalomu’
  choice: Kudumisha ‘binti ya Absalomu’ katika matini kuu
  alternative: mjukuu wa kike wa Absalomu; mzao wa kike wa Absalomu
  rationale: Kiebrania kinasema wazi ‘binti,’ kwa hiyo matini kuu haifungi uwezekano wa maana halisi. Maana pana inayowezekana katika lugha ya nasaba imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Usemi ‘akamchukua’ umehifadhi nahau ya chanzo katika muktadha wa ndoa; alama ya tanbihi imewekwa baada ya dai la nasaba linalohusika.
