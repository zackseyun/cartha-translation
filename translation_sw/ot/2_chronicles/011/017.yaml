  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: sw
  text: Kwa hiyo wakauimarisha ufalme wa Yuda, wakamtia nguvu Rehoboamu mwana wa Sulemani kwa miaka mitatu, kwa sababu kwa miaka mitatu walifuata njia ya Daudi na Sulemani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: wakauimarisha
  rationale: Kitenzi חזק katika piel kina maana ya kufanya kitu kiwe imara. “Kuimarisha” huhifadhi maana hiyo bila kudokeza kwamba ilikuwa kazi ya kijeshi pekee.
- source_word: מַלְכוּת יְהוּדָה
  choice: ufalme wa Yuda
  rationale: Katika muktadha huu מַלְכוּת inarejelea ufalme kama jamii ya kisiasa iliyo chini ya mfalme, ingawa neno hilo pia linaweza kumaanisha mamlaka ya kifalme.
- source_word: וַיְאַמְּצוּ
  choice: kumtia nguvu
  rationale: אמץ katika piel humaanisha kumfanya mtu awe na nguvu, kumwimarisha, au kumtia moyo. “Kumtia nguvu” ni ya kawaida katika Kiswahili na inadumisha tofauti ndogo ya kitenzi cha kwanza bila kuibadili maana.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Rehoboamu mwana wa Sulemani
  rationale: Majina yametolewa kwa tahajia iliyozoeleka katika Kiswahili, na uhusiano wa mwana na baba umehifadhiwa moja kwa moja.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: kwa miaka mitatu
  rationale: Muundo wenye ל unaonyesha muda. Kirai hicho kimedumishwa mara mbili kwa kuwa kurudiwa kwake katika Kiebrania kunasisitiza uhusiano kati ya muda wa kuimarishwa na muda wa mwenendo wao.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inaanzisha sababu ya matendo yaliyotajwa mwanzoni mwa aya.
- source_word: הָלְכוּ בְּדֶרֶךְ
  choice: walifuata njia
  rationale: Nahau ya Kiebrania ya ‘kutembea katika njia’ inaeleza mwenendo. “Walifuata njia” ni Kiswahili cha asili kinachohifadhi taswira ya njia na kueleza maana yake kwa uwazi.
- source_word: דָּוִיד וּשְׁלֹמֹה
  choice: Daudi na Sulemani
  rationale: Majina yametolewa kwa maumbo yao yaliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Tathmini ya ‘njia ya Daudi na Sulemani’
  choice: Kudumisha nahau hiyo bila kuipanua kuwa dai la uaminifu wao wa maisha yote au haki kamili.
  alternative: “Walimtii BWANA kwa uaminifu kama Daudi na Sulemani.”
  rationale: Aya inatoa tathmini chanya kwa kipindi maalumu cha miaka mitatu, lakini haisemi kwamba mwenendo wa Daudi na Sulemani ulikuwa mkamilifu katika maisha yao yote. Tafsiri haiongezi maelezo ya kitheolojia yasiyomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa “miaka mitatu” kumehifadhiwa kwa sababu ni sehemu yenye kusudi katika Kiebrania; vitenzi viwili vya kuimarisha vimetofautishwa kwa kawaida kuwa “kuimarisha” na “kutia nguvu.”
