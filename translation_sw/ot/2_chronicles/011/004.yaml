base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: sw
  text: 'Yahwe asema hivi: “Msipande wala msipigane na ndugu zenu.[a] Kila mmoja arudi nyumbani kwake, kwa maana jambo hili limetoka kwangu.”[b] Basi wakayasikiliza maneno ya Yahwe, wakarejea, wakaacha kwenda kupigana na Yeroboamu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndugu zenu”; usemi huu unasisitiza kwamba wale waliokuwa upande wa pili walikuwa Waisraeli wenzao.'
    reason: cultural_note
  - marker: b
    text: 'Au: “kwa maana jambo hili ni kutoka kwangu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Au: “wakarejea, wakaacha kwenda kwa Yeroboamu.” Katika muktadha huu walikuwa wakielekea kupigana naye, ndiyo maana imetafsiriwa “kwenda kupigana na Yeroboamu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahwe asema hivi
  rationale: Inawasilisha kwa lugha ya kawaida na yenye heshima fomula rasmi ya mjumbe wa kinabii, huku ikilitaja jina la Mungu lililo katika Kiebrania.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Msipande wala msipigane
  rationale: ‘Kupanda’ inadumisha kitenzi cha Kiebrania עלה, ambacho hapa kinaweza kuashiria kusonga kwenda vitani; ‘msipigane’ linaweka wazi katazo la vita bila kuunganisha vitenzi hivyo viwili.
- source_word: עִם אֲחֵיכֶם
  choice: na ndugu zenu
  rationale: Kiswahili hutumia ‘kupigana na’ kwa maana ya kupigana dhidi ya mtu. ‘Ndugu’ inadumisha msisitizo kwamba wapinzani wao ni Waisraeli wenzao.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Kila mmoja arudi nyumbani kwake
  rationale: Hutoa maana ya ugawaji ya אִישׁ kwa Kiswahili cha kawaida na kudumisha agizo la kila mtu kurudi kwake.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: kwa maana jambo hili limetoka kwangu
  rationale: Inahifadhi dai kwamba jambo hilo limetokana na Mungu, bila kufafanua zaidi namna ya usababishaji wake.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: wakayasikiliza maneno ya Yahwe
  rationale: ‘Kusikiliza’ linaweza kujumuisha kusikia na kutii; tendo linalofuata linaonyesha kwamba walitii.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: wakarudi, wasiende dhidi ya Yeroboamu
  rationale: Inadumisha wazo la kugeuka na kuacha safari, huku ‘dhidi ya’ ikionyesha muktadha wa uadui. Tanbihi inalinda uwezekano wa tafsiri ya moja kwa moja ‘kwenda kwa Yeroboamu.’
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: ‘Yahwe’ linawakilisha jina la agano lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Usababishaji wa kimungu katika מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: jambo hili limetoka kwangu
  alternative: jambo hili ni kutoka kwangu; jambo hili limetendeka kwa sababu yangu
  rationale: Tafsiri inadumisha kauli ya wazi kwamba jambo hilo limetokana na Mungu, lakini haiongezi maelezo ya kimafundisho kuhusu jinsi Mungu alivyolisababisha au kuliamuru.
