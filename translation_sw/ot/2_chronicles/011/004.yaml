  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa kinabii na tofauti kati ya ‘kupanda’ na ‘kupigana’ zimehifadhiwa, huku tanbihi zikionyesha maana mbadala halisi bila kuamua kimya kimya utata wa maandishi.
