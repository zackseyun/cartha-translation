source:
  edition: WLC
  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: sw
  text: Baada yao, kutoka makabila yote ya Israeli, wale walioelekeza mioyo yao[a] kumtafuta Yahwe, Mungu wa Israeli, walikuja Yerusalemu[b] ili wamtolee Yahwe, Mungu wa baba zao, dhabihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa karibu: “walioutoa moyo wao”; nahau hiyo humaanisha kuelekeza au kujitoa kwa moyo kumtafuta Yahwe.'
    reason: lexical_alternative
  - marker: b
    text: Au “walikwenda Yerusalemu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuja” au “kwenda,” kutegemea mtazamo wa simulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: Baada yao
  rationale: Huhifadhi maana ya mfuatano unaounganisha mstari huu na watu waliotajwa katika mstari uliotangulia; kiunganishi cha Kiebrania kinaweza kuwasilishwa kwa kawaida katika Kiswahili bila kuongeza “na” mwanzoni.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka katika makabila yote ya Israeli
  rationale: Huwasilisha chanzo cha watu hao na upeo kamili wa makabila ya Israeli kwa Kiswahili cha kawaida.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: walioelekeza mioyo yao
  rationale: Nahau hiyo, ambayo kwa karibu ni ‘walioutoa moyo wao,’ inaonyesha kuelekeza nia na dhamira kwa kusudi la kumtafuta Mungu. “Walioelekeza mioyo yao” ni ya asili na haiiongezei maana ya dhehebu.
- source_word: לְבַקֵּשׁ
  choice: kumtafuta
  rationale: Katika muktadha wa kidini, kitenzi hiki kinamaanisha kumwelekea Mungu na kutafuta ushirika au mapenzi yake, si kutafuta habari tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya muundo unaomtambulisha Yahwe kuwa Mungu wa Israeli.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: walikuja Yerusalemu
  rationale: בוא inaweza kumaanisha kuja au kwenda kutegemea mtazamo wa simulizi. “Walikuja” hufuata mtazamo ulioelekezwa Yerusalemu huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: לִזְבּוֹחַ
  choice: kumtolea Yahwe dhabihu
  rationale: Infinitivu inaonyesha kusudi la safari. Muundo huu wa Kiswahili unaweka wazi kwamba dhabihu ilitolewa kwa Yahwe bila kuongeza aina ya dhabihu.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Huhifadhi neno la kiume “baba” katika usemi wa kiagano badala ya kulipanua kimyakimya kuwa “mababu” au “wahenga.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni. “Yahwe” huhifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo, bila kudai uhakika zaidi kuhusu matamshi ya kale kuliko ushahidi unavyoruhusu.
- issue: Usemi wa kiagano אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  alternative: Mungu wa mababu zao
  rationale: Kiebrania kinasema kihalisi “baba zao.” Tafsiri iliyochaguliwa huhifadhi umbo hilo la kiume na mwangwi wa usemi wa kiagano.
- issue: Mwelekeo wa kitenzi בוא
  choice: walikuja Yerusalemu
  alternative: walikwenda Yerusalemu
  rationale: Kitenzi cha Kiebrania kinaweza kutafsiriwa “kuja” au “kwenda” kulingana na mahali pa mtazamo. Matini kuu inatumia mtazamo wa Yerusalemu, na tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi inahifadhi mfuatano wa Kiebrania kwa kiasi kinachosomeka vizuri, jina “Yahwe,” na usemi wa kiagano “Mungu wa baba zao.”
