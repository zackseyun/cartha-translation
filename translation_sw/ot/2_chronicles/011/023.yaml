base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: sw
  text: Naye akatenda kwa busara, akawagawa baadhi ya wanawe katika maeneo yote ya Yuda na Benyamini, katika miji yote yenye ngome.[a] Akawapa chakula tele, akawatafutia wake wengi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kueleweka kuwa aliwatawanya au aliwaweka baadhi ya wanawe katika miji yenye ngome katika maeneo mbalimbali ya Yuda na Benyamini; hakimaanishi kwamba kila mwana alipelekwa kila mahali.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “akatafuta wake wengi.” Maana inayowezekana ni kwamba aliwatakia au aliwapangia wanawe ndoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: akatenda kwa busara
  rationale: Hifili ya בין hapa inaonyesha kutenda kwa ufahamu au utambuzi; katika muktadha wa mipango ya kifalme, usemi huu wa Kiswahili ni wa asili kuliko tafsiri ya moja kwa moja ‘akaelewa.’
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: akawagawa baadhi ya wanawe
  rationale: פרץ pamoja na maeneo yanayofuata inaelekea kueleza kuwatawanya au kuwaweka wana katika sehemu mbalimbali kwa kusudi. ‘Baadhi ya wanawe’ huonyesha maana ya sehemu inayoweza kubebwa na מן bila kudai kwamba kila mwana alitumwa kila mahali.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: katika maeneo yote ya Yuda na Benyamini
  rationale: אֲרָצוֹת hapa ni maeneo au sehemu za kiutawala ndani ya Yuda na Benyamini, si nchi tofauti.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: katika miji yote yenye ngome
  rationale: מְצֻרוֹת hueleza miji iliyoimarishwa kwa ngome; ‘miji yenye ngome’ ni Kiswahili cha kawaida na sahihi.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: Akawapa chakula tele
  rationale: מָזוֹן ni chakula au mahitaji ya kujikimu, na לָרֹב huonyesha wingi. ‘Chakula tele’ ni kifupi, cha asili, na huhifadhi maana halisi.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: akawatafutia wake wengi
  rationale: שׁאל kimsingi ni kuomba, kutaka, au kutafuta. Katika muktadha huu inaelekea kumaanisha kupanga au kutafuta ndoa kwa ajili ya wanawe; kiwakilishi cha watendewa kinatokana na muktadha.
