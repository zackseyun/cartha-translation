  text: וַ/יְחַזֵּ֖ק אֶת הַ/מְּצֻר֑וֹת וַ/יִּתֵּ֤ן בָּ/הֶם֙ נְגִידִ֔ים וְ/אֹצְר֥וֹת מַאֲכָ֖ל וְ/שֶׁ֥מֶן וָ/יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: sw
  text: Aliimarisha ngome, akaweka ndani yake makamanda na akiba za chakula, mafuta, na divai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: Aliimarisha
  rationale: Kauli ya piel ya חזק inaonyesha kuyafanya maeneo hayo yawe imara au salama zaidi; “aliimarisha” huhifadhi tendo hilo bila kurudia dhana ya ngome.
- source_word: הַמְּצֻרוֹת
  choice: maeneo yenye ngome
  rationale: Neno hili linaweza kumaanisha maeneo yaliyoimarishwa, ngome, au vituo vya ulinzi. “Maeneo yenye ngome” ni Kiswahili cha kawaida na hakibainishi kupita kiasi ukubwa wa kila eneo.
- source_word: וַיִּתֵּן בָּהֶם
  choice: akaweka humo
  rationale: נתן pamoja na ב hapa ina maana ya kuwaweka watu au vitu ndani ya maeneo hayo; “humo” huonyesha wazi maana ya mahali.
- source_word: נְגִידִים
  choice: makamanda
  rationale: Katika muktadha wa ngome na ulinzi, נְגִידִים inaelekea kumaanisha viongozi au maafisa wenye mamlaka; “makamanda” huwasilisha vizuri wajibu wao wa kijeshi.
- source_word: וְאֹצְרוֹת
  choice: pamoja na akiba za
  rationale: אֹצָרוֹת inaweza kumaanisha maghala au vitu vilivyohifadhiwa. Kwa kuwa yanayofuata ni mahitaji ya chakula, “akiba za” huwasilisha kwa kawaida vifaa vilivyowekwa tayari.
- source_word: מַאֲכָל
  choice: chakula
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno la jumla linalomaanisha chakula au vyakula vya matumizi.
- source_word: שֶׁמֶן
  choice: mafuta
  rationale: “Mafuta” ni tafsiri ya kawaida; huenda hasa yakawa mafuta ya zeituni, lakini chanzo hakilazimishi ubainishaji huo.
- source_word: יָיִן
  choice: divai
  rationale: “Divai” ni tafsiri sahihi na ya kawaida ya יָיִן katika muktadha huu.
