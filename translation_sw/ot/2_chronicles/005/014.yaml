base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: sw
  text: Nao makuhani hawakuweza kusimama ili kuhudumu kwa sababu ya lile wingu, kwa maana utukufu wa Yahwe uliijaza nyumba ya Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Mungu.” Kiebrania ni “nyumba ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: hawakuweza
  rationale: Kitenzi kinaonyesha uwezo; muundo hasi “hawakuweza” ni wa kawaida na sahihi katika Kiswahili.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Ni tafsiri ya moja kwa moja ya nomino hii ya wingi yenye maana ya makuhani wa hekalu.
- source_word: לַעֲמוֹד
  choice: kusimama
  rationale: Inahifadhi taswira halisi ya עמד bila kuongeza wazo lisilotajwa wazi, kama vile kuendelea kusimama.
- source_word: לְשָׁרֵת
  choice: kuhudumu
  rationale: Katika muktadha wa ukuhani na hekalu, neno hili linaonyesha kutekeleza huduma takatifu; “kuhudumu” ni la kawaida na lenye heshima.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Hapa kihusishi kinaonyesha sababu ya makuhani kutoweza kusimama.
- source_word: הֶעָנָן
  choice: lile wingu
  rationale: Kionyeshi “lile” huonyesha wingu maalumu linalotajwa katika muktadha huku kikihifadhi maana ya nomino yenye uanishi.
- source_word: כִּי
  choice: kwa maana
  rationale: Kinaanzisha maelezo ya sababu ya kauli iliyotangulia.
- source_word: מָלֵא
  choice: ulikuwa umeijaza
  rationale: Muundo huu wa Kiswahili unaeleza hali iliyokuwapo kutokana na utukufu kuijaza nyumba, na unafaa kwa qatal katika muktadha huu.
- source_word: כְבוֹד יְהוָה
  choice: utukufu wa Yahwe
  rationale: Inahifadhi uhusiano wa nomino katika Kiebrania na kulitaja jina la Mungu moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la Kiswahili la jina la agano YHWH, badala ya kulibadili kuwa cheo kama “BWANA.”
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Ni tafsiri ya karibu ya maneno ya Kiebrania na ni ya kueleweka katika Kiswahili; “hekalu la Mungu” ni tafsiri ya kimuktadha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. “Yahwe” huhifadhi jina hilo badala ya kutumia cheo, bila kuingiza fundisho la dhehebu.
- issue: Uhusiano kati ya wingu na utukufu wa Yahwe
  choice: Kuhifadhi sentensi ya sababu bila kusema kwamba wingu lenyewe ni sawa kabisa na utukufu
  alternative: Kulieleza wingu kuwa utukufu wa Yahwe
  rationale: Kiebrania kinasema makuhani walishindwa kusimama kwa sababu ya wingu, kisha kinaeleza kuwa utukufu wa Yahwe uliijaza nyumba. Tafsiri haipaswi kuondoa utofauti huo wa kisemantiki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kuhudumu” kinafaa kwa huduma ya kikuhani, na “nyumba ya Mungu” kinahifadhi usemi halisi wa Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
