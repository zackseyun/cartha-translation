  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: sw
  text: Katika sanduku hakukuwa na kitu chochote isipokuwa vibao viwili ambavyo Musa aliweka ndani yake[a] huko Horebu, mahali ambapo Yahwe alifanya agano na Waisraeli[b] walipotoka Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kwa kawaida humaanisha “kutoa,” lakini hapa kinarejelea kuviweka vibao ndani ya sanduku.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Ndani ya sanduku hamkuwa na kitu chochote isipokuwa
  rationale: Muundo huu wa Kiswahili unatoa kwa kawaida hali ya kutokuwapo pamoja na kizuizi cha רַק, bila kupunguza msisitizo kwamba vibao hivyo pekee ndivyo vilivyokuwamo.
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: vibao viwili
  rationale: ‘Vibao’ ni tafsiri ya moja kwa moja na inayoeleweka ya לֻחוֹת; neno ‘vya mawe’ halijaongezwa kwa kuwa halipo wazi katika mstari huu.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: ambavyo Musa aliweka humo
  rationale: Ingawa נָתַן kwa kawaida humaanisha ‘kutoa,’ katika muktadha wa vitu vilivyomo ndani ya sanduku inaeleza kuviweka humo. ‘Humo’ huweka wazi uhusiano wa mahali kwa Kiswahili cha kawaida.
- source_word: בְּחֹרֵב
  choice: huko Horebu
  rationale: Jina la mahali la Kiebrania limehifadhiwa kama Horebu badala ya kulinganishwa kimyakimya na Sinai; ‘huko’ ni kiashiria cha mahali kinachofaa katika Kiswahili.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: mahali ambapo Yahwe alifanya agano na
  rationale: כָּרַת pamoja na dhana ya agano ni nahau ya kufanya agano. Neno ‘agano’ limetajwa wazi kwa Kiswahili kwa sababu ndilo jambo linalodokezwa na Kiebrania, na kishazi husomwa kwa kawaida kuwa kinarejelea Horebu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ni umbo la kawaida na la kijumla katika Kiswahili cha kisasa kwa watu wa Israeli; tafsiri rasmi zaidi ‘wana wa Israeli’ imehifadhiwa katika tanbihi.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: walipotoka Misri
  rationale: Muundo wa wakati wa Kiebrania umetolewa kwa kishazi cha Kiswahili ‘walipotoka,’ kinachorejelea wazi tukio la kutoka Misri.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Kishazi אֲשֶׁר כָּרַת יְהוָה עִם na agano lisilotajwa kwa nomino
  choice: mahali ambapo Yahwe alifanya agano na
  alternative: ambalo Yahwe alifanya na; ambapo Yahwe alikata na
  rationale: Kitenzi כָּרַת katika muktadha huu kinadokeza nahau ya ‘kufanya agano,’ ingawa nomino בְּרִית haijaandikwa. ‘Mahali ambapo’ hufuata uwezekano wa kawaida kwamba אֲשֶׁר inarejelea Horebu, huku ikiepuka usemi usio wa kawaida wa ‘kukata agano’ katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi mtiririko wa kifungu cha Kiebrania, huku nahau zisizo za kawaida katika Kiswahili zikitolewa kwa ulinganifu bora.
