base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: sw
  text: Nao Walawi waimbaji—wote, Asafu, Hemani, Yeduthuni, wana wao na ndugu zao—walikuwa wamevaa kitani nzuri, wakiwa na matoazi, vinubi[a] na vinanda, wamesimama mashariki ya madhabahu[b]; pamoja nao walikuwapo makuhani mia moja na ishirini waliokuwa wakipiga tarumbeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ala zinazofanana na vinubi”; tofauti kamili kati ya ala za nyuzi za kale zinazotajwa hapa haijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Au “upande wa mashariki wa madhabahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: Walawi waimbaji
  rationale: Muundo huu wa kawaida wa Kiswahili unatambulisha Walawi kwa jukumu lao la kuimba na kuhifadhi hali bainifu ya Kiebrania.
- source_word: לְכֻלָּם
  choice: wote
  rationale: Neno hili linajumuisha viongozi waliotajwa pamoja na wana wao na ndugu zao.
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: Asafu, Hemani, Yeduthuni
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: wana wao na ndugu zao
  rationale: Huhifadhi maneno ya kifamilia ya chanzo bila kuyapanua kuwa jamaa kwa ujumla.
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: walikuwa wamevaa kitani safi
  rationale: Kitani safi huwasilisha nguo ya kitani yenye ubora iliyotumika katika mazingira matakatifu au ya kifalme.
- source_word: בִּמְצִלְתַּיִם
  choice: wakiwa na matoazi
  rationale: Matoazi ni jina la kawaida la ala hizi za kugonganisha katika Kiswahili.
- source_word: וּבִנְבָלִים
  choice: vinubi
  rationale: Kinubi ni kisawe cha kimapokeo cha נבל, ingawa utambulisho kamili wa ala hiyo ya kale hauna uhakika.
- source_word: וְכִנֹּרוֹת
  choice: zeze
  rationale: Zeze hutofautisha כִּנּוֹר na נבל katika orodha hii ya ala za nyuzi, huku ikitoa jina linaloeleweka kwa msomaji wa Kiswahili.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: wamesimama upande wa mashariki wa madhabahu
  rationale: Hutoa kwa kawaida maana ya mahali bila kudai kwa lazima umbali au nafasi maalumu zaidi.
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים
  choice: pamoja nao walikuwapo makuhani 120
  rationale: Kitenzi cha kuwapo kinaongezwa kwa ufasaha wa Kiswahili, huku idadi na uhusiano wa kuandamana vikihifadhiwa.
- source_word: מחצררים בַּחֲצֹצְרוֹת
  choice: waliokuwa wakipiga tarumbeta
  rationale: Kitenzi kishirikishi kinaonyesha tendo lililokuwa likiendelea, na tarumbeta ni jina wazi la חֲצֹצְרוֹת.
