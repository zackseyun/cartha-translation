lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi cha mfululizo wa kisimulizi kutoka בוא kinaonyesha tukio linalofuata; “wakaja” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: כֹּל
  choice: wote
  rationale: Neno hili linawahusisha wazee wa Israeli kwa ujumla na kuhifadhi maana kamili ya mkusanyiko huo.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wote wa Israeli
  rationale: “Wazee wa Israeli” ni usemi wa kawaida unaowatambulisha viongozi rasmi wa taifa; “wote” hutafsiri כֹּל.
- source_word: וַיִּשְׂאוּ
  choice: wakalibeba
  rationale: Katika muktadha huu נשׂא ina maana ya kuchukua na kusafirisha sanduku; “kubeba” ni wazi na ya kawaida. Kiambishi “-li-” kinakubaliana na nomino “sanduku.”
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kikabila na la huduma linalotajwa na לְוִיִּם.
- source_word: אֶת הָאָרוֹן
  choice: sanduku
  rationale: Katika muktadha wa hekalu, אָרוֹן linarejelea sanduku la agano, lakini maandishi ya mstari huu yanasema tu “sanduku”; hivyo ufafanuzi kamili hauongezwi katika mstari mkuu.
theological_decisions:
- issue: Utambulisho wa “sanduku”
  choice: Kutafsiri “sanduku” pekee katika mstari mkuu.
  alternative: sanduku la agano
  rationale: Kiebrania cha mstari huu kina הָאָרוֹן tu, yaani “sanduku.” Ingawa muktadha unadhihirisha kuwa ni sanduku la agano, tafsiri kuu haiingizi maneno yasiyopo katika mstari; ufafanuzi unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Basi” na viambishi vya mfululizo “waka-” vinatoa mtiririko wa kawaida wa kisimulizi bila kufanya lugha kuwa ya kizamani.
