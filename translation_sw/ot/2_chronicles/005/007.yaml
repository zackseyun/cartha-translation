base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: sw
  text: Ndipo makuhani wakalileta sanduku la agano la Yahweh mahali pake, katika chumba cha ndani cha nyumba, katika Mahali Patakatifu Zaidi[a], chini ya mabawa ya makerubi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Patakatifu pa Patakatifu.”
    reason: Mbadala huu huakisi kwa karibu zaidi muundo halisi wa Kiebrania קֹדֶשׁ הַקְּדָשִׁים.
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: wakalileta
  rationale: Hifili ya בוא ina maana ya kuleta. Kiambishi -li- kinarejelea “sanduku” na muundo wa -ka- unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye uainifu; katika Kiswahili uainifu unaeleweka kutokana na muktadha.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Inahifadhi mnyororo wa uhusiano wa Kiebrania na kuweka wazi kwamba sanduku hilo linahusiana na agano la Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, hivyo kutunza matumizi ya Tetragramatoni katika matini chanzo.
- source_word: מְקוֹמוֹ
  choice: mahali pake
  rationale: Kiambishi cha nafsi kinarejelea sanduku. Kauli hii ni ya asili na haiongezi wazo la “mahali palipopangwa” ambalo halijasemwa wazi.
- source_word: דְּבִיר הַבַּיִת
  choice: patakatifu pa ndani pa nyumba
  rationale: דְּבִיר ni chumba cha ndani kabisa cha jengo la hekalu chenye kazi takatifu. “Nyumba” inadumisha בַּיִת badala ya kuibadili kimafafanuzi kuwa “hekalu.”
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: Patakatifu Zaidi
  rationale: Muundo huu wa Kiebrania unaonyesha kiwango cha juu kabisa cha utakatifu. Tafsiri hii ni wazi na ya kawaida kwa msomaji wa sasa.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: chini ya mabawa ya makerubi
  rationale: Inafuata maana ya moja kwa moja ya kihusishi na nomino zake; “makerubi” ni utohozi wa kawaida wa viumbe hao wa mbinguni.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la herufi nne moja kwa moja. “Yahweh” huhifadhi jina hilo kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa קֹדֶשׁ הַקְּדָשִׁים
  choice: Patakatifu Zaidi
  alternative: Patakatifu pa Patakatifu
  rationale: Chaguo kuu linaeleza wazi nguvu ya muundo wa Kiebrania unaotumika kama kiwango cha juu, huku tanbihi ikihifadhi tafsiri ya kimuundo iliyo ya jadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “Patakatifu Zaidi,” badala ya baada ya “mahali pake.”
