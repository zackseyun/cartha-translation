base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: sw
  text: Mfalme Sulemani na kusanyiko lote la Israeli waliokuwa wamekusanyika mbele yake[a], mbele ya sanduku, walikuwa wakitoa dhabihu za kondoo[b] na ng’ombe, ambao hawakuweza kuhesabiwa wala kuorodheshwa kwa sababu ya wingi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wamekusanyika pamoja naye.” Usemi wa Kiebrania unaweza kumaanisha kusanyiko lililokusanyika mbele ya Sulemani au pamoja naye.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “kondoo” lina maana pana zaidi ya mifugo midogo, ikiwemo kondoo na mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: ‘Kusanyiko’ linaonyesha jumuiya iliyokusanyika, na ni neno la kawaida la Kiswahili lisiloweka maana maalumu ya kidhehebu. ‘Lote’ linaakisi כָל.
- source_word: הַנּוֹעָדִים
  choice: waliokuwa wamekusanyika
  rationale: Kauli hii inaonyesha watu waliokutana na ambao walikuwapo katika tukio hilo; muundo huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: עָלָיו
  choice: mbele yake
  rationale: Huhifadhi uhusiano wa kimahali unaowezekana katika Kiebrania, huku tanbihi ikitaja uwezekano wa kuelewa ‘pamoja naye.’
- source_word: לִפְנֵי הָאָרוֹן
  choice: mbele ya sanduku la agano
  rationale: ‘Mbele ya’ ni tafsiri ya moja kwa moja ya usemi wa mahali. ‘Sanduku la agano’ ni jina linaloeleweka kwa kawaida katika Kiswahili kwa sanduku hili takatifu, ingawa ‘agano’ halijaandikwa wazi katika kishazi hiki.
- source_word: מְזַבְּחִים
  choice: walikuwa wakitoa dhabihu
  rationale: Muundo endelevu unaakisi tendo lililokuwa likiendelea, na ‘kutoa dhabihu’ ni Kiswahili cha kawaida na wazi.
- source_word: צֹאן וּבָקָר
  choice: kondoo na ng’ombe
  rationale: Ni tafsiri ya kawaida na inayoeleweka; hata hivyo צֹאן ni pana zaidi na inaweza kuhusisha mbuzi, jambo linalobainishwa katika tanbihi.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: ambazo hazingeweza kuhesabiwa wala kujulikana idadi yake
  rationale: Huhifadhi vitenzi viwili vinavyokaribiana kimaana na msisitizo wake, bila kutengeneza urudiaji usio wa asili katika Kiswahili.
- source_word: מֵרֹב
  choice: kwa sababu ya wingi wake
  rationale: Huonyesha wazi sababu ya kutoweza kuhesabu wanyama hao.
theological_decisions:
- issue: Utambulisho wa הָאָרוֹן
  choice: sanduku la agano
  alternative: sanduku
  rationale: Katika muktadha huu ni sanduku takatifu la agano; usemi wa kawaida wa Kiswahili husaidia utambuzi. Hata hivyo, neno la Kiebrania lenyewe hapa linasema tu ‘sanduku.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha mwendo wa simulizi na marudio ya msisitizo wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
