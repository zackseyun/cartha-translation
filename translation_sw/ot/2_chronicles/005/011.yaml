  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: sw
  text: Ikawa makuhani walipotoka Patakatifu—kwa maana makuhani wote waliokuwapo walikuwa wamejitakasa, bila kufuata zamu zao[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kuzingatia migawanyiko yao,” yaani, bila kufuata vikundi vya kawaida vya zamu za makuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Ikawa ... walipotoka
  rationale: Muundo huu unaonyesha tukio linalofuata katika simulizi na wakati wa kutoka; ni Kiswahili cha kawaida kinachohifadhi mtiririko wa Kiebrania.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Neno la kawaida la Kiswahili kwa watumishi wa kikuhani katika hekalu.
- source_word: מִן־הַקֹּדֶשׁ
  choice: Patakatifu
  rationale: Katika muktadha wa hekalu, neno hili linataja eneo takatifu, si sifa ya utakatifu kwa ujumla.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutoa maelezo ya hali iliyotangulia na kuhifadhi nguvu ya kifafanuzi ya kiunganishi.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: makuhani wote waliokuwapo
  rationale: Huwasilisha kwa kawaida maana ya makuhani wote waliokuwa pale au waliopatikana kwa huduma hiyo.
- source_word: הִתְקַדָּשׁוּ
  choice: walikuwa wamejitakasa
  rationale: Kauli ya kujirejelea inaonyesha maandalizi ya kiibada ambayo makuhani walijifanyia kabla ya huduma.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: bila kufuata zamu zao
  rationale: מַחְלְקוֹת hapa ni vikundi au zamu zilizopangwa za makuhani; usemi huu unaeleza kwamba mpangilio wa kawaida wa zamu haukufuatwa katika tukio hili.
theological_decisions:
- issue: Istilahi ya maandalizi ya kiibada ya makuhani
  choice: walikuwa wamejitakasa
  alternative: walikuwa wamejiweka wakfu
  rationale: “Wamejitakasa” huhifadhi uhusiano wa moja kwa moja na mzizi wa utakatifu na kauli ya kujirejelea, huku muktadha ukionyesha kuwa ni utakaso wa kiibada, si dai pana kuhusu ukamilifu wa maadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Patakatifu” limetumiwa kama jina la eneo la hekalu. Sentensi inaachwa wazi mwishoni kwa sababu mstari unaendelea kisintaksia katika mstari unaofuata.
