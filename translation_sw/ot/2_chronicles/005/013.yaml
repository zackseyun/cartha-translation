  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: sw
  text: 'Ikawa kwamba wapiga tarumbeta na waimbaji walikuwa kama mtu mmoja[a], wakitoa sauti moja kwa kumsifu na kumshukuru Yahweh; nao walipopaza sauti kwa tarumbeta, matoazi, na vyombo vya muziki, huku wakimsifu Yahweh: “Kwa maana yeye ni mwema; kwa maana upendo wake thabiti[b] ni wa milele,” nyumba, nyumba ya Yahweh, ikajawa na wingu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa kwa umoja.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania hesed linaweza kumaanisha upendo mwaminifu na wa agano; pia limetafsiriwa “rehema” au “fadhili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa kwamba
  rationale: Huwasilisha mwanzo wa tukio katika simulizi bila kutumia lugha ya kizamani.
- source_word: כְאֶחָד
  choice: walikuwa kama mtu mmoja
  rationale: Huhifadhi taswira ya Kiebrania ya watu wengi kutenda kwa umoja na inaandaa kutajwa kwa ‘sauti moja.’
- source_word: לְהַשְׁמִיעַ קוֹל אֶחָד
  choice: wakitoa sauti moja
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la kufanya sauti moja iliyoungana isikike.
- source_word: לְהַלֵּל וּלְהוֹדוֹת
  choice: kwa kumsifu na kumshukuru
  rationale: Hutofautisha wazi tendo la kusifu na tendo la kutoa shukrani.
- source_word: בַחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: kwa tarumbeta, matoazi na vyombo vya muziki
  rationale: ‘Matoazi’ ni neno la kawaida kwa cymbals, na ‘vyombo vya muziki’ huwasilisha kwa kawaida maana ya vyombo vilivyotumiwa katika uimbaji.
- source_word: חַסְדּוֹ
  choice: upendo wake thabiti
  rationale: Huhifadhi maana pana ya hesed kama upendo mwaminifu na wa kudumu, badala ya kuupunguza kuwa hisia au huruma pekee.
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: nyumba, yaani nyumba ya Yahweh, ikajaa wingu
  rationale: Huhifadhi urudiaji wa ‘nyumba’ kama ufafanuzi wenye mkazo na kutunza kutokuwa maalumu kwa ‘wingu.’
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH; ‘Yahweh’ hulitambulisha kama jina badala ya cheo.
- issue: Maana ya חֶסֶד katika kauli ya ibada
  choice: upendo wake thabiti ni wa milele
  alternative: rehema zake ni za milele
  rationale: ‘Upendo thabiti’ huhifadhi pamoja uaminifu, kudumu na wema wa agano uliomo katika neno hili bila kulifungamanisha na ufafanuzi finyu wa kimadhehebu.
- issue: Uhusiano wa kauli ‘Kwa maana yeye ni mwema...’ na tendo la kusifu
  choice: kutumia alama ya nukta mbili bila kuongeza ‘wakisema’
  alternative: wakimsifu Yahweh na kusema
  rationale: Kiebrania huunganisha kauli hiyo na kusifu lakini hakitumii kitenzi cha kusema; nukta mbili hufanya uhusiano ueleweke bila kuongeza kitenzi kisichotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mrefu wa sentensi umehifadhiwa kwa kiasi ili kuonyesha mfululizo wa ibada unaofikia kujazwa kwa nyumba na wingu, huku semikoloni na nukta mbili zikisaidia usomaji wa kawaida.
