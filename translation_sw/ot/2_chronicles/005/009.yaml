base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: sw
  text: Wakazirefusha fito hizo, hata ncha za fito zikonekana zikitokeza kwenye Sanduku mbele ya patakatifu pa ndani[a], lakini hazikuonekana kutoka nje; na zipo huko mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya Patakatifu Zaidi.”
    reason: Neno la Kiebrania דְּבִיר linaweza kumaanisha ‘patakatifu pa ndani’ au kuitwa ‘Patakatifu Zaidi.’
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: Waliirefusha
  rationale: 'Huhifadhi hali ya kisababishi ya kauli ya Kiebrania na kiima chake cha wingi kisichotajwa kwa jina: ‘waliifanya iwe mirefu/waliirefusha.’'
- source_word: הַבַּדִּים
  choice: mipiko
  rationale: ‘Mipiko’ ni neno la Kiswahili linaloeleweka kwa fito zinazotumiwa kubebea kitu, hapa Sanduku la Agano.
- source_word: רָאשֵׁי הַבַּדִּים
  choice: ncha zake
  rationale: Ingawa רָאשֵׁי kihalisi ni ‘vichwa,’ katika maelezo ya mipiko humaanisha ncha zake.
- source_word: מִן הָאָרוֹן
  choice: zikitokeza kwenye Sanduku
  rationale: 'Hueleza uhusiano wa mahali unaoonyeshwa na מִן: ncha zilionekana zikitoka au kuchomoza kutoka mahali Sanduku lilipokuwa, bila kudai jinsi mipiko ilivyowekwa.'
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: mbele ya patakatifu pa ndani
  rationale: ‘Patakatifu pa ndani’ ni maelezo ya wazi ya דְּבִיר, na ‘mbele ya’ huwasilisha uhusiano wa mahali wa עַל־פְּנֵי.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: lakini hazikuonekana kutoka nje
  rationale: Huhifadhi utofautishaji kati ya kuonekana karibu na patakatifu pa ndani na kutoonekana kutoka nje.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: nayo iko huko mpaka leo
  rationale: Umoja wa kitenzi cha Kiebrania umehifadhiwa kwa rejeo la jumla kwa mipiko kama kitu kilichopo huko, huku ‘mpaka leo’ ikiwasilisha mtazamo wa wakati wa mwandishi.
