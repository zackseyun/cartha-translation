  to: 'Nao wakapandisha sanduku, Hema la Kukutania, na vyombo vyote vitakatifu vilivyokuwa ndani ya hema; makuhani Walawi[a] wakavipandisha vyote.


    [a] Au, kwa karibu zaidi: “makuhani, Walawi.”'
  rationale: Marekebisho yanaondoa kiambishi cha umoja kwenye kitenzi cha kwanza ili sanduku, hema, na vyombo vyote visomwe kwa pamoja kama yambwa za tendo, kama katika Kiebrania. Sehemu ya pili hutumia “vyote” kufafanua kuwa tendo la makuhani Walawi lahusu vitu vyote vilivyotajwa. Tanbihi imehifadhiwa na kuboreshwa kimtindo.
