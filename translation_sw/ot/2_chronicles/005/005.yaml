translation:
  language: sw
  text: 'Nao wakapandisha sanduku, Hema la Kukutania, na vyombo vyote vitakatifu vilivyokuwa ndani ya hema; makuhani Walawi[a] wakavipandisha vyote.


    [a] Au, kwa karibu zaidi: “makuhani, Walawi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi: “makuhani, Walawi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: wakalipandisha / wakavipandisha
  rationale: Kitenzi עלה katika Hifili kina maana ya kufanya kitu kipande au kukipeleka juu. “Kupandisha” huhifadhi mwelekeo wa safari kuelekea Hekalu; viambishi vya yambwa vinapatana kwa kawaida na “sanduku” na vitu vilivyotajwa.
- source_word: הָאָרוֹן
  choice: sanduku
  rationale: Kiebrania kinasema tu “sanduku,” bila kuongeza “la agano”; tafsiri haiongezi ufafanuzi usiokuwapo katika mstari huu.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hii ni tafsiri ya moja kwa moja na iliyozoeleka ya jina la mahali ambapo Mungu alikutana na watu wake; herufi kubwa zinaonyesha kuwa ni jina maalumu.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: vyombo vyote vitakatifu
  rationale: כְּלִים ni neno pana kwa vyombo, vifaa, au vitu vinavyotumiwa; “vyombo” ni la kawaida na linafaa katika mazingira ya ibada, huku “vitakatifu” likiakisi הַקֹּדֶשׁ.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: vilivyokuwa ndani ya hema
  rationale: Kishazi hiki kinaeleza mahali vyombo hivyo vilipokuwa. “Ndani ya hema” ni Kiswahili cha asili na hurudia kwa ufupi neno “hema” la kishazi kilichotangulia.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  rationale: Kauli hii inatambulisha makuhani kuwa Walawi bila kudokeza kwamba Walawi wote walikuwa makuhani. Tanbihi inahifadhi muundo wa Kiebrania wa kuweka majina hayo sambamba.
theological_decisions:
- issue: Maana na uhusiano wa הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani Walawi
  alternative: makuhani, Walawi
  rationale: “Makuhani Walawi” ni Kiswahili cha kawaida kinachotambulisha kundi la makuhani kwa asili yao ya Kilawi bila kufuta tofauti kati ya makuhani na Walawi kwa jumla. Kwa kuwa muundo wa Kiebrania unaweza kutafsiriwa kwa namna ya sambamba, tafsiri ya neno kwa neno zaidi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Urudiaji wa “wakalipandisha/wakavipandisha” umehifadhiwa ili kuakisi urudiaji wa Kiebrania, na viambishi vya yambwa vimewekwa kulingana na nomino zake.
