reference: 2 Chronicles 5:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: sw
  text: Ndipo Sulemani akawakusanya huko Yerusalemu wazee wa Israeli, wakuu wote wa makabila, na wakuu wa nyumba za baba za wana wa Israeli[a], ili kulipandisha sanduku la agano la Yahwe kutoka mji wa Daudi, yaani Sayuni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” usemi unaohifadhi utambulisho wao wa kizazi na wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “ambao ni Sayuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יַקְהֵיל
  choice: akawakusanya
  rationale: Hifili ya קהל humaanisha kusababisha watu wakusanyike; umbo hili linaonyesha wazi kwamba Sulemani ndiye aliyewaita pamoja.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Huhifadhi jina la kundi rasmi la viongozi bila kulipanua kwa maelezo yasiyomo katika chanzo.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: wakuu wote wa makabila
  rationale: Katika muktadha huu מַטּוֹת ni makabila, na רָאשֵׁי inaonyesha watu waliokuwa wakuu wao.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: viongozi wa jamaa za mababu
  rationale: Kifungu kinarejelea viongozi wa vitengo vya ukoo vinavyotokana na mababu; tafsiri hii ni ya asili kwa Kiswahili huku ikihifadhi muundo wa kijamii wa Kiebrania.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: za wana wa Israeli
  rationale: Huhifadhi usemi wa Kiebrania unaosisitiza utambulisho wa kizazi na agano, badala ya kuufanya tu kuwa jina la kawaida la taifa.
- source_word: אֶל יְרוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Pamoja na kitenzi cha kukusanya, huonyesha mahali walikokusanywa kwa Kiswahili cha asili.
- source_word: לְהַעֲלוֹת
  choice: ili kulipandisha
  rationale: עלה hapa inaeleza kulipeleka sanduku juu kuelekea Yerusalemu; kiambishi li- kinapatana na nomino sanduku.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahwe
  rationale: Huhifadhi mnyororo wa umilikaji wa Kiebrania na maana ya agano kwa uwazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu katika maandishi ya chanzo badala ya kulibadilisha kuwa cheo.
- source_word: מֵעִיר דָּוִיד
  choice: kutoka Mji wa Daudi
  rationale: Ni usemi wa mahali ulio wazi na wa moja kwa moja; herufi kubwa inaonyesha jina maalumu la eneo.
- source_word: הִיא צִיּוֹן
  choice: yaani, Sayuni
  rationale: Hutoa ufafanuzi wa kiambatisho unaoutambulisha Mji wa Daudi kuwa Sayuni bila kuongeza hitimisho jingine.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kina Tetragramatoni yenyewe; “Yahwe” huhifadhi jina la agano kwa umbo linalotambulika katika Kiswahili.
- issue: Muundo wa ukoo katika לִבְנֵי יִשְׂרָאֵל na הָאָבוֹת
  choice: wana wa Israeli na jamaa za mababu
  alternative: Waisraeli na familia za Israeli
  rationale: Muktadha unahusu mpangilio rasmi wa makabila na koo. Tafsiri iliyochaguliwa huhifadhi lugha ya kizazi na muundo wa ukoo bila kuifanya kuwa dai pana zaidi ya andiko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa sentensi umewekwa wa asili kwa Kiswahili huku orodha ya viongozi, lugha ya ukoo, mwelekeo wa kulipandisha sanduku, na ufafanuzi wa Sayuni vikihifadhiwa.
