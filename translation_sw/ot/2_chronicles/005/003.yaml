  text: And all the men of Israel assembled before the king at the feast, that is, in the seventh month.
translation:
  language: sw
  text: Wanaume wote wa Israeli wakakusanyika mbele ya mfalme wakati wa sikukuu, yaani, katika mwezi wa saba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: wanaume wote wa Israeli
  rationale: Kirai hiki kinamtaja kila mwanamume wa Israeli; tafsiri hii huhifadhi umbo la umoja lenye maana ya jumla katika Kiswahili cha kawaida.
- source_word: וַיִּקָּהֲלוּ
  choice: wakakusanyika
  rationale: Kitenzi cha Kiebrania kinaeleza kukusanyika kama kusanyiko; ‘wakakusanyika’ ni cha asili na sahihi katika muktadha huu.
- source_word: אֶל הַמֶּלֶךְ
  choice: kwa mfalme
  rationale: Kihusishi אֶל hapa kinaonyesha kuelekea au kufika mbele ya mfalme; ‘kwa mfalme’ ni usemi wa kawaida wa Kiswahili usiodai kwamba walikuwa ndani ya kitu fulani.
- source_word: בֶּחָג
  choice: wakati wa sikukuu
  rationale: בְּ lina maana ya wakati katika muktadha huu, na חַג ni sikukuu ya kidini; jina mahususi la sikukuu halitajwi katika mstari.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: yaani, katika mwezi wa saba
  rationale: הוּא hapa linafafanua wakati uliotajwa kuwa mwezi wa saba. ‘Yaani’ huhifadhi uhusiano huo wa ufafanuzi bila kutaja sikukuu kwa jina.
