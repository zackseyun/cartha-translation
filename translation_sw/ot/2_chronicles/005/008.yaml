base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: sw
  text: Nao makerubi walikuwa wakitandaza mabawa yao juu ya mahali pa sanduku[a], nao makerubi wakafunika sanduku pamoja na miti yake ya kubebea kutoka juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya nafasi ya sanduku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa wamenyoosha
  rationale: Pamoja na kitenzi-shirikishi פֹּרְשִׂים, היה huonyesha hali au mkao unaoendelea; Kiswahili cha hali timilifu kinaeleza kwamba mabawa yalikuwa yamenyooshwa.
- source_word: הַכְּרוּבִים
  choice: makerubi
  rationale: Neno hili lililozoeleka katika Kiswahili cha Biblia linahifadhi jina la viumbe hawa wanaohusishwa na kiti cha enzi na patakatifu.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: wamenyoosha mabawa yao
  rationale: פרשׂ hapa humaanisha kutandaza au kunyoosha; ‘mabawa yao’ ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: juu ya mahali pa sanduku
  rationale: Tafsiri hii inadumisha neno מָקוֹם, ‘mahali,’ bila kulirahisisha kuwa ‘juu ya sanduku,’ ambalo limetajwa wazi katika kishazi kinachofuata.
- source_word: וַיְכַסּוּ
  choice: wakalifunika
  rationale: כסה kwa kawaida humaanisha kufunika; kiambishi ‘-li-’ kinarejelea sanduku kwa njia ya kawaida katika Kiswahili.
- source_word: עַל הָאָרוֹן וְעַל בַּדָּיו
  choice: sanduku na miti yake ya kubebea
  rationale: בַּדִּים ni miti iliyotumiwa kulibeba sanduku; usemi huu ni wazi zaidi kuliko ‘fimbo’ au neno la kizamani.
- source_word: מִלְמָעְלָה
  choice: kutoka juu
  rationale: Huhifadhi maana ya mwelekeo au mahali pa kufunika iliyo katika umbo lenye kiambishi מִן.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Makerubi’ na ‘sanduku’ hudumisha istilahi za hekalu zinazoeleweka kwa wasomaji wa Biblia; ‘miti yake ya kubebea’ hufafanua kwa kawaida kazi ya בדים.
