reference: 2 Chronicles 5:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: sw
  text: Hivyo, kazi yote ambayo Sulemani alikuwa ameifanya kwa ajili ya nyumba ya Yahweh ikakamilika. Kisha Sulemani akaingiza vitu vitakatifu vya Daudi baba yake[a], pamoja na fedha, dhahabu na vyombo vyote; akaviweka katika hazina za nyumba ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu ambavyo Daudi baba yake alikuwa ameviweka wakfu” au “vitu vilivyowekwa wakfu vya Daudi baba yake.”
    reason: Neno קָדְשֵׁי linaweza kumaanisha vitu vitakatifu au vitu vilivyotengwa na kuwekwa wakfu kwa matumizi matakatifu.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: ikakamilika
  rationale: Kitenzi מן־שלם kinaonyesha kwamba kazi ilifikia ukamilifu; “ikakamilika” ni Kiswahili cha kawaida kinachohifadhi hali hiyo ya matokeo.
- source_word: כָּל הַמְּלָאכָה
  choice: kazi yote
  rationale: מְלָאכָה hapa inahusu mradi mzima wa kujenga na kuandaa nyumba ya Yahweh, hivyo “kazi yote” ni pana na ya asili.
- source_word: לְבֵית יְהוָה
  choice: kwa ajili ya nyumba ya Yahweh
  rationale: “Nyumba” huhifadhi taswira ya בַּיִת, na “kwa ajili ya” huonyesha kusudi la לְ־. Jina la agano יְהוָה limetolewa kama “Yahweh.”
- source_word: וַיָּבֵא
  choice: akaingiza
  rationale: Hifili ya בוא ina maana ya kuleta au kuingiza ndani; muktadha ni kuhamisha vitu hadi ndani ya hazina za hekalu.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: vitu vitakatifu vya Daudi baba yake
  rationale: קָדְשֵׁי hurejelea vitu vilivyotengwa kwa matumizi matakatifu. Tafsiri ya moja kwa moja imehifadhiwa, huku maana ya “vilivyowekwa wakfu” ikitolewa katika tanbihi.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: fedha, dhahabu
  rationale: Majina haya yanataja mali hizo kama sehemu tofauti za orodha; Kiswahili hakihitaji kurudia kiunganishi au kibainishi ili kuhifadhi maana hiyo.
- source_word: כָּל הַכֵּלִים
  choice: vyombo vyote
  rationale: כֵּלִים ni neno pana kwa vifaa au vitu vya matumizi; “vyombo” linafaa katika muktadha wa vifaa vya nyumba ya Mungu.
- source_word: נָתַן
  choice: akaviweka
  rationale: נתן hapa ina maana ya kuweka vitu mahali pa kuhifadhiwa; kiambishi “-vi-” kinarejelea vitu vyote vilivyotajwa.
- source_word: בְּאֹצְרוֹת
  choice: katika hazina
  rationale: אֹצָר inaweza kumaanisha chumba au mahali pa kuhifadhia mali. “Hazina” katika umbo hili la Kiswahili linaweza kurejelea maeneo ya kuhifadhi bila kulazimisha picha isiyo ya lazima.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Huhifadhi taswira ya “nyumba” na pia tofauti ya majina ya Mungu iliyopo katika Kiebrania kati ya יְהוָה mwanzoni na אֱלֹהִים mwishoni.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia jina la agano moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Kutofautisha בֵּית יְהוָה na בֵּית הָאֱלֹהִים katika mstari mmoja
  choice: nyumba ya Yahweh; nyumba ya Mungu
  alternative: kutafsiri zote mbili kuwa hekalu
  rationale: Kutunza semi zote mbili kama zilivyo huepuka kusawazisha kimya kimya tofauti ya maandishi ya chanzo.
- issue: Maana ya קָדְשֵׁי
  choice: vitu vitakatifu
  alternative: vitu vilivyowekwa wakfu
  rationale: Neno linaweza kusisitiza ama hadhi takatifu ya vitu ama tendo la kuviweka wakfu. Maandishi makuu yanahifadhi umbo la moja kwa moja, na tanbihi inaleta maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetolewa kwa viambishi vya mfululizo “ika-/aka-”. Taswira ya “nyumba” imehifadhiwa badala ya kubadilishwa kuwa “hekalu,” na tofauti kati ya “Yahweh” na “Mungu” imeachwa wazi.
