base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: sw
  text: Waisraeli waliokuwapo wakaadhimisha Pasaka wakati huo, na Sikukuu ya Mikate Isiyotiwa Chachu kwa siku saba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakaadhimisha
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha ‘kufanya,’ kinapotumiwa kuhusu Pasaka au sikukuu humaanisha kuitunza au kuiadhimisha. ‘Wakaadhimisha’ ni Kiswahili cha kawaida na chenye hadhi katika muktadha huu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ni jina la pamoja la watu wa Israeli; ‘Waisraeli’ ni tafsiri ya asili na iliyo wazi katika Kiswahili cha kisasa.
- source_word: הַנִּמְצְאִים
  choice: waliokuwapo
  rationale: Katika muktadha huu neno linaonyesha wale waliokuwa mahali hapo, si kwamba walikuwa ‘wamepatikana’ kwa maana ya kawaida.
- source_word: הַפֶּסַח
  choice: Pasaka
  rationale: Hapa neno linarejelea maadhimisho ya Pasaka kwa ujumla, wala si lazima mnyama wa dhabihu pekee.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Hii inawakilisha moja kwa moja maana ya kirai cha wakati bila kuongeza wazo lisilotajwa wazi la wakati uliowekwa.
- source_word: חַג הַמַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: Hili ni jina linaloeleweka la sikukuu hiyo na linaonyesha kwa usahihi mikate isiyo na chachu.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kirai hiki kinaonyesha muda wa kuadhimishwa kwa sikukuu, na ‘kwa siku saba’ ni mtindo wa kawaida wa Kiswahili.
