  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: sw
  text: 'Yosia akawapa watu[a] mifugo midogo—wana-kondoo na mbuzi wachanga—hao wote kwa ajili ya sadaka za Pasaka[b], kwa wote waliokuwapo: mifugo midogo elfu thelathini, pamoja na ng’ombe elfu tatu. Wanyama hao walitoka katika mali ya mfalme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “wana wa watu”; yaweza pia kutafsiriwa “watu wa kawaida.”'
    reason: lexical_alternative
  - marker: b
    text: Au “hao wote kwa ajili ya Pasaka.” Neno la Kiebrania “Pasaka” liko katika wingi na huenda linamaanisha kwa pamoja wanyama au sadaka za Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: akawapa
  rationale: Hifili ya רום hapa ina maana ya kutoa au kuchangia mali kwa matumizi ya wengine. “Akawapa” ni ya kawaida na haidokezi kwamba Yosia mwenyewe aliwatoa wanyama hao kuwa dhabihu.
- source_word: לִבְנֵי הָעָם
  choice: watu
  rationale: Ingawa tafsiri ya neno kwa neno ni “wana wa watu,” katika muktadha huu usemi huo unawataja watu wa kawaida walioshiriki, si wanaume pekee. “Watu” ni Kiswahili cha asili na kinahifadhi maana pana.
- source_word: צֹאן כְּבָשִׂים וּבְנֵי עִזִּים
  choice: wanyama kutoka katika kundi—wana-kondoo na wana-mbuzi
  rationale: צֹאן ni jina la jumla la mifugo midogo, kisha maandishi yanabainisha wana-kondoo na wana-mbuzi. Muundo huu unahifadhi jina la jumla na ufafanuzi unaofuata.
- source_word: הַכֹּל לַפְּסָחִים
  choice: wote kwa ajili ya sadaka za Pasaka
  rationale: Wingi פְּסָחִים hapa unaelekea kuwataja kwa pamoja wanyama au sadaka za Pasaka. “Sadaka za Pasaka” huonyesha kazi yao katika ibada bila kutumia tafsiri isiyo ya kawaida ya “Pasaka nyingi.”
- source_word: לְכָל הַנִּמְצָא
  choice: kwa wote waliokuwapo
  rationale: Kitenzi katika umbo la Nifali hapa kinamaanisha watu waliopatikana au waliokuwapo katika kusanyiko. “Waliokuwapo” ni wazi na cha kawaida.
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: Jumla yao ilikuwa elfu thelathini, pamoja na ng’ombe elfu tatu
  rationale: Kauli hii inatoa hesabu ya wanyama wa kundi na kisha ng’ombe. Mgawanyo huu unaifanya hesabu ieleweke bila kubadili idadi.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: Wanyama hao walitoka katika mali ya mfalme
  rationale: רְכוּשׁ humaanisha mali au vitu vinavyomilikiwa. Kutaja “wanyama hao” huweka wazi rejeleo la kiwakilishi cha Kiebrania.
