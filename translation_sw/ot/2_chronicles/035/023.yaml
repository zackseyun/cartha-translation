  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: sw
  text: Wapiga mishale wakampiga Mfalme Yosia, naye mfalme akawaambia watumishi wake, “Niondoeni hapa, kwa maana nimejeruhiwa vibaya sana.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niondoeni hapa, kwa maana nimeumia vibaya sana.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa dhaifu, mgonjwa, au kuumia vibaya; hapa muktadha wa vita unaunga mkono maana ya “kujeruhiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַיֹּרִים
  choice: Nao wapiga mishale wakampiga
  rationale: Kitenzi ירה katika muktadha huu wa vita kinamaanisha kupiga kwa mishale, na הַיֹּרִים ni wapiga mishale. Kiswahili ‘wakampiga’ kinaonyesha kuwa Yosia ndiye aliyelengwa na kupatwa na mishale bila kurudia neno ‘mishale’ kwa namna isiyo ya kawaida.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: Mfalme Yosia
  rationale: Herufi ל inaonyesha mlengwa wa tendo la kupiga; katika Kiswahili uambishaji wa ‘wakampiga’ humweka Mfalme Yosia moja kwa moja kama mtendewa.
- source_word: הַעֲבִירוּנִי
  choice: Niondoeni hapa
  rationale: Hiphil ya עבר ina maana ya kumhamisha au kumwondoa mtu. ‘Niondoeni hapa’ ni ombi la kawaida na wazi la kuondolewa katika eneo la mapigano, bila kudai mahsusi kwamba alibebwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya amri ya Yosia kwa mtindo wa moja kwa moja na wenye hadhi.
- source_word: הָחֳלֵיתִי מְאֹד
  choice: nimejeruhiwa vibaya sana
  rationale: חלה kwa msingi inaweza kumaanisha kuwa dhaifu au mgonjwa, lakini baada ya kupigwa na wapiga mishale katika vita inaelekea kumaanisha kujeruhiwa vibaya. מְאֹד inasisitiza ukali wa hali hiyo.
