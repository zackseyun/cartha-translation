base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: sw
  text: Jiandaeni kwa kuzingatia nyumba za baba zenu[a], kulingana na migawanyo yenu[b], kama ilivyoagizwa katika maandishi ya Daudi, mfalme wa Israeli, na katika maandishi ya Sulemani mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, makundi ya kifamilia ya ukoo wa upande wa baba katika Israeli.
    reason: lexical_alternative
  - marker: b
    text: “Migawanyo” inaweza pia kutafsiriwa “zamu,” hasa inapohusu mpangilio wa makuhani au Walawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: Jiandaeni
  rationale: Hifili ya amri, wingi, ya כון hapa inadai kujitayarisha au kujiweka tayari; “Jiandaeni” ni Kiswahili cha kawaida na kinafaa katika muktadha wa maandalizi ya ibada.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: kwa kufuata jamaa zenu za ukoo
  rationale: בֵית אָבוֹת ni vikundi vya kijamii vilivyotokana na nyumba au ukoo wa baba. “Jamaa zenu za ukoo” huwasilisha muundo huo wa kifamilia kwa Kiswahili kinachoeleweka bila kudokeza majengo halisi.
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: kwa kufuata migawanyo yenu
  rationale: מַחְלְקוֹת ni migawanyo au vikundi vilivyopangiwa zamu, hasa vya makuhani au Walawi. “Migawanyo” huhifadhi maana pana, huku tanbihi ikitaja uwezekano wa zamu.
- source_word: בִּכְתָב
  choice: kama ilivyoagizwa katika maandishi ya
  rationale: כְּתָב ni maandishi au hati; ב־ hapa yaelekea kuonyesha kufuata maagizo yaliyoandikwa. Tafsiri hii inaweka wazi kazi ya maandishi hayo bila kuyaacha kuwa marejeo yasiyoeleweka.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: Daudi mfalme wa Israeli
  rationale: Inahifadhi jina na cheo cha kifalme kwa mtindo mfupi na wa kawaida wa Kiswahili.
- source_word: וּבְמִכְתַּב
  choice: na katika maandishi ya
  rationale: מִכְתָּב pia hurejelea maandishi au hati. Kishazi cha kwanza tayari kinaonyesha wazo la agizo, hivyo hapa muundo mfupi huepuka urudiaji mzito.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: Sulemani mwanawe
  rationale: Huwasilisha kwa ufupi kwamba Sulemani ni mwana wa Daudi, kama ilivyo katika Kiebrania.
