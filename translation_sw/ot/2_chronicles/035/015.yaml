  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: sw
  text: Nao waimbaji[a], wana wa Asafu, walikuwa katika vituo vyao kulingana na agizo la Daudi, Asafu, Hemani, na Yeduthuni, mwonaji wa mfalme[b]. Nao walinzi wa malango walikuwa katika kila lango. Hawakuwa na haja ya kuondoka katika huduma yao[c], kwa sababu ndugu zao Walawi waliandaa kwa ajili yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanamuziki.” Hata hivyo, neno la Kiebrania linamaanisha hasa wale wanaoimba.
    reason: lexical_alternative
  - marker: b
    text: Maneno “mwonaji wa mfalme” kwa kawaida zaidi yanamhusu Yeduthuni.
    reason: syntactical_attachment
  - marker: c
    text: 'Kiebrania pia kinaweza kutafsiriwa kwa nguvu zaidi: “Hawakupaswa kuondoka katika huduma yao.” Hata hivyo, kishazi kinachofuata kinaunga mkono maana kwamba hawakuwa na haja ya kuondoka, kwa sababu Walawi waliandaa kwa ajili yao.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: waimbaji
  rationale: Neno hili linatokana na kitenzi cha kuimba na katika muktadha wa huduma ya hekalu linamaanisha watu waliokuwa na jukumu la kuimba; “waimbaji” ni sahihi kuliko neno pana zaidi “wanamuziki.”
- source_word: בְּנֵי אָסָף
  choice: wana wa Asafu
  rationale: Tafsiri ya moja kwa moja ni “wana wa Asafu”; hapa inaweza kumaanisha ukoo au kundi la waimbaji lililohusishwa na Asafu, lakini usemi wa Kiebrania umehifadhiwa.
- source_word: עַל מַעֲמָדָם
  choice: walikuwa katika vituo vyao
  rationale: מַעֲמָד ni mahali au nafasi rasmi aliyopangiwa mtu; “vituo vyao” linafaa kwa mpangilio wa huduma ya hekalu.
- source_word: כְּמִצְוַת
  choice: kulingana na agizo la
  rationale: מִצְוָה hapa ni maelekezo yenye mamlaka; “agizo” linaonyesha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: mwonaji wa mfalme
  rationale: חוֹזֶה ni cheo cha mtu anayepokea maono; “mwonaji” huhifadhi tofauti yake ya kileksika na neno la jumla zaidi “nabii.”
- source_word: הַשֹּׁעֲרִים
  choice: walinzi wa malango
  rationale: Katika mazingira ya hekalu hawa ni watu waliopewa jukumu la kusimamia na kulinda malango; usemi huu ni wazi na wa asili kwa wasomaji wa Kiswahili.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: kwenye kila lango
  rationale: Muundo wa kurudia una maana ya ugawaji, yaani watu walikuwapo katika kila lango moja moja.
- source_word: אֵין לָהֶם לָסוּר
  choice: Hawakuwa na haja ya kuondoka
  rationale: Muundo אֵין pamoja na kitenzi-jina unaonyesha kutokuwapo kwa ulazima au sababu ya kuondoka; kishazi kinachofuata kinaeleza kwa nini.
- source_word: מֵעַל עֲבֹדָתָם
  choice: katika huduma yao
  rationale: עֲבֹדָה katika muktadha wa hekalu ni huduma au wajibu rasmi, si kazi ya kawaida tu.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: ndugu zao Walawi
  rationale: Kiebrania kinataja wazi “ndugu zao” na kisha “Walawi”; tafsiri inahifadhi uhusiano huo bila kuugeuza kuwa usemi usioonyesha jinsia.
- source_word: הֵכִינוּ לָהֶם
  choice: waliwaandalia mahitaji yao
  rationale: הכין ni kuandaa au kufanya tayari. Kwa kuwa kitu kilichoandaliwa hakitajwi, “mahitaji yao” hutoa Kiswahili cha asili bila kubainisha kuwa kilikuwa chakula au kitu kingine.
theological_decisions:
- issue: Kihusishi cha kisintaksia cha “mwonaji wa mfalme”
  choice: 'Maneno hayo yanamhusu Yeduthuni: “Yeduthuni, mwonaji wa mfalme.”'
  alternative: Yanaweza kueleweka kwa upana kuwa yanahusiana na orodha nzima ya watu waliotajwa kabla yake.
  rationale: Kirai cha umoja חוֹזֵה הַמֶּלֶךְ kinafuata moja kwa moja jina la umoja Yeduthuni, hivyo kwa kawaida hufanya kazi kama maelezo yake.
- issue: Nguvu ya maneno אֵין לָהֶם לָסוּר
  choice: Yanamaanisha hawakuwa na haja ya kuondoka, wala si hasa kwamba walikatazwa kuondoka.
  alternative: “Hawakupaswa kuondoka katika huduma yao.”
  rationale: Kishazi cha sababu kinachofuata—Walawi waliwaandalia—kinaunga mkono maana ya kutokuwa na ulazima wa kuacha vituo vyao, huku uwezekano wa maana yenye nguvu zaidi ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametolewa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili. Muundo wa sentensi umegawanywa kwa uwazi, huku urudiaji wa “Nao” ukihifadhi mtiririko wa simulizi la Kiebrania.
