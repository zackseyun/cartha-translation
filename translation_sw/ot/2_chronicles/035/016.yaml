  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: sw
  text: Hivyo siku hiyo, huduma yote ya Yahwe ikawekwa tayari ili kuadhimisha Pasaka na kutoa sadaka za kuteketezwa juu ya madhabahu ya Yahwe, kulingana na amri ya Mfalme Yosia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: ikawekwa tayari
  rationale: 'Kauli hii huhifadhi maana ya hali ya kutendwa na matokeo ya כון katika Niphal: huduma iliandaliwa na kuwekwa katika utaratibu unaofaa. Ni Kiswahili cha kawaida na wazi katika muktadha wa maandalizi ya Pasaka.'
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: huduma yote ya Yahwe
  rationale: עֲבוֹדָה hapa inahusu huduma au kazi ya ibada hekaluni. Neno “huduma” linadumisha upana wa maana bila kuiwekea mipaka kuwa kazi ya makuhani pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kudumisha jina binafsi lililo katika matini ya Kiebrania.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha wakati maalumu unaoonyeshwa na kirai cha Kiebrania.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: kuadhimisha Pasaka
  rationale: Kitenzi עשה pamoja na “Pasaka” ni nahau ya kutekeleza au kuishika sikukuu hiyo. “Kuadhimisha Pasaka” ni wazi na cha kawaida katika Kiswahili cha sasa.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: na kutoa sadaka za kuteketezwa
  rationale: Hii ni nahau ya kawaida ya dhabihu inayomaanisha kuzitoa sadaka zinazoteketezwa kabisa. Tafsiri hii ni ya asili katika Kiswahili na inadumisha wingi wa עֹלוֹת.
- source_word: עַל מִזְבַּח יְהוָה
  choice: juu ya madhabahu ya Yahwe
  rationale: Kirai hiki kinadumisha mahali ambapo sadaka zilitolewa na uhusiano wa madhabahu na Yahwe.
- source_word: כְּמִצְוַת
  choice: kulingana na amri
  rationale: מִצְוָה hapa ni agizo maalumu la mfalme. “Kulingana na amri” hudumisha umbo la nomino na uhusiano wa moja kwa moja na muktadha.
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: Mfalme Yosia
  rationale: Mpangilio huu wa cheo kabla ya jina ni wa kawaida katika Kiswahili na humtambulisha mhusika kwa usahihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini ya Kiebrania inatumia jina יהוה moja kwa moja. “Yahwe” linadumisha jina hilo la agano badala ya kulibadilisha kuwa cheo kama “Bwana”.
- issue: Maana ya עֲבוֹדַת יְהוָה
  choice: huduma ya Yahwe
  alternative: ibada kwa Yahwe
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa upana kuwa huduma inayohusiana na Yahwe, hasa kazi za ibada hekaluni. “Huduma ya Yahwe” hudumisha upana huo bila kuamua kimya kimya kwamba ni tendo la ibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mtiririko wa Kiebrania huku ukitumia nahau za asili za Kiswahili.
