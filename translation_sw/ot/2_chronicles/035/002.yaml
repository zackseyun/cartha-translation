  text: וַ/יַּעֲמֵ֥ד הַ/כֹּהֲנִ֖ים עַל מִשְׁמְרוֹתָ֑/ם וַֽ/יְחַזְּקֵ֔/ם לַ/עֲבוֹדַ֖ת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: sw
  text: Akawaweka makuhani katika zamu zao[a] na kuwatia nguvu[b] kwa ajili ya huduma ya nyumba ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika makundi yao ya huduma,” “kwenye vituo vyao,” au kwa tafsiri ya karibu zaidi, “juu ya zamu zao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwatia moyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Akawaweka
  rationale: Hifili ya עמד hapa ina maana ya kuwaweka watu katika nafasi walizopangiwa; “akawaweka” ni ya asili na haiongezi wazo la uteuzi rasmi lisilolazimishwa na neno.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כהנים; katika muktadha huu kundi hilo limetambulishwa wazi.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: katika zamu zao
  rationale: מִשְׁמָרוֹת inaweza kumaanisha zamu, vituo, au makundi ya huduma. “Katika zamu zao” huhifadhi picha ya mipango rasmi ya huduma ya Hekalu bila kuifupisha kuwa majukumu kwa ujumla.
- source_word: וַיְחַזְּקֵם
  choice: na kuwatia nguvu
  rationale: Pieli ya חזק inaweza kumaanisha kuimarisha, kutia nguvu, au kutia moyo. “Kuwatia nguvu” huhifadhi maana yake ya msingi pamoja na uwezekano wa msaada au moyo aliowapa.
- source_word: לַעֲבוֹדַת
  choice: kwa ajili ya huduma
  rationale: עֲבוֹדָה hapa ni kazi au huduma ya kidini inayofanywa katika nyumba ya Yahweh; “huduma” ni pana, ya asili, na inafaa muktadha.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania “nyumba” na kulitaja jina la agano יְהוָה kama Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la pekee יְהוָה. “Yahweh” hulitofautisha na cheo “Bwana” na kufuata mwongozo wa POB bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Maana ya וַיְחַזְּקֵם katika huduma ya Hekalu
  choice: kuwatia nguvu
  alternative: kuwatia moyo
  rationale: Kiebrania kinaweza kuonyesha kuimarishwa kwa uwezo au kutiwa moyo. Tafsiri kuu huhifadhi upana huo, huku maana mbadala ikibainishwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Zamu” huhifadhi mpangilio wa huduma wa muktadha; “nyumba ya Yahweh” huhifadhi sitiari ya asili badala ya kuifafanua moja kwa moja kuwa Hekalu.
