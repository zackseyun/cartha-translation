  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: sw
  text: Katika mwaka wa kumi na nane wa utawala wa Yosia, Pasaka hii iliadhimishwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pasaka hii ilishikwa”; kwa maana ya karibu zaidi, “Pasaka hii ilifanywa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: Katika mwaka wa kumi na nane
  rationale: Muundo huu wa Kiebrania ni taarifa ya wakati. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi kwa usahihi mwaka unaotajwa.
- source_word: לְ/מַלְכוּת יֹאשִׁיָּהוּ
  choice: wa utawala wa Yosia
  rationale: Neno מַלְכוּת hapa linahusu kipindi cha Yosia kutawala kama mfalme. ‘Utawala wa Yosia’ ni Kiswahili cha asili na kinafaa kwa kanuni ya kutaja miaka ya utawala.
- source_word: נַעֲשָׂה
  choice: iliadhimishwa
  rationale: Kitenzi hiki kihalisi kina maana ya ‘ilifanywa,’ lakini kinapotumiwa pamoja na Pasaka kinamaanisha kutekeleza au kuadhimisha Pasaka. ‘Iliadhimishwa’ ni wazi na cha kawaida bila kuongeza wazo lisilokuwamo katika matini.
- source_word: הַ/פֶּסַח
  choice: Pasaka
  rationale: ‘Pasaka’ ni neno la Kiswahili lililozoeleka kwa פֶּסַח na halihitaji nyongeza ya ‘sikukuu,’ ambayo haijaandikwa hapa.
- source_word: הַ/זֶּה
  choice: hii
  rationale: Kiwakilishi hiki elekezi kinarejelea Pasaka mahususi iliyoelezwa katika muktadha uliotangulia.
