base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: sw
  text: Konania, Shemaya na Nethaneli, ndugu zake, pamoja na Hashabia, Yeieli na Yozabadi, wakuu wa Walawi, waliwachangia Walawi wanyama elfu tano kwa ajili ya dhabihu za Pasaka[a], na ng’ombe mia tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana halisi kina “kwa ajili ya Pasaka” katika wingi, yaani “kwa ajili ya Pasaka nyingi.” Yaelekea kinamaanisha wanyama waliotengwa kwa ajili ya maadhimisho ya Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כונניהו
  choice: Konania
  rationale: Jina limetoholewa kwa namna ya kawaida na inayosomeka kwa Kiswahili.
- source_word: וּשְׁמַעְיָהוּ וּנְתַנְאֵל אֶחָיו
  choice: Shemaya na Nethaneli, ndugu zake
  rationale: Neno אֶחָיו limetafsiriwa moja kwa moja kuwa ‘ndugu zake’; linaweza kumaanisha ndugu wa kuzaliwa au jamaa wa karibu wa kiume, na kiwakilishi chake cha umoja kimehifadhiwa.
- source_word: חֲשַׁבְיָהוּ וִיעִיאֵל וְיוֹזָבָד
  choice: Hashabia, Yeieli na Yozabadi
  rationale: Majina yametoholewa kwa tahajia inayofaa mfumo wa sauti wa Kiswahili.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: wakuu wa Walawi
  rationale: ‘Wakuu’ linaonyesha nafasi rasmi ya uongozi bila kutumia lugha ya kizamani au kuongeza cheo kisichotajwa.
- source_word: הֵרִימוּ לַלְוִיִּם
  choice: waliwapa Walawi
  rationale: Katika muktadha huu Hiphil ya רום ina maana ya kutoa mchango; ‘waliwapa’ ni ya asili katika Kiswahili na inaonyesha Walawi kuwa wapokeaji.
- source_word: לַפְּסָחִים
  choice: kwa ajili ya dhabihu za Pasaka
  rationale: Wingi wa פֶּסַח hapa unaelekea kumaanisha wanyama waliotengwa kwa maadhimisho ya Pasaka, si sikukuu nyingi; ‘dhabihu za Pasaka’ linafikisha maana ya kiibada bila kudai kuwa wote walikuwa wana-kondoo.
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: wanyama elfu tano ... na ng’ombe mia tano
  rationale: Kiebrania kinataja idadi ya kwanza bila kurudia aina ya mnyama, kisha kinataja ng’ombe mia tano tofauti. Tafsiri inazuia kuzichanganya idadi zote kuwa ng’ombe 5,500 huku ikiacha aina ya kundi la kwanza bila kubainishwa zaidi ya chanzo.
theological_decisions:
- issue: Aina ya wanyama elfu tano
  choice: wanyama elfu tano kwa ajili ya dhabihu za Pasaka
  alternative: kondoo na mbuzi elfu tano
  rationale: Mstari wenyewe hautaji wazi ‘kondoo na mbuzi’ katika idadi ya kwanza. Ingawa muktadha unaweza kuelekeza huko, tafsiri haijaingiza maelezo hayo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha ya majina imerahisishwa kwa viunganishi vya asili vya Kiswahili, na tofauti kati ya wanyama elfu tano na ng’ombe mia tano imehifadhiwa.
