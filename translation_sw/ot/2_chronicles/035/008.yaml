base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: sw
  text: Nao maafisa wake wakatoa mchango wa hiari kwa ajili ya watu, makuhani, na Walawi. Hilkia, Zekaria, na Yehieli, viongozi wa nyumba ya Mungu, waliwapa makuhani wanyama 2,600 kwa ajili ya dhabihu za Pasaka[a] na ng’ombe 300.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “kwa ajili ya Pasaka, 2,600.” Wingi wa neno la Kiebrania unaweza kumaanisha wanyama au dhabihu zilizotolewa katika maadhimisho ya Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: Nao maafisa wake
  rationale: Neno שָׂרִים humaanisha wakuu, watawala au maafisa. “Maafisa” linafaa katika muktadha huu wa viongozi wa utawala na linaeleweka kwa Kiswahili cha sasa.
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: wakatoa kwa hiari
  rationale: Muungano wa נְדָבָה na הֵרִימוּ unaonyesha mchango wa hiari. Kauli hii ni ya kawaida kwa Kiswahili na inadumisha wazo la kutoa bila kulazimishwa.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: kwa ajili ya watu, makuhani na Walawi
  rationale: Herufi ל inayorudiwa inaonyesha walengwa wa mchango. “Kwa ajili ya” linaonyesha kuwa maandalizi yalifanywa kwa manufaa yao.
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: Hilkia, Zekaria na Yehieli
  rationale: Majina yametoholewa kwa maumbo yanayotambulika na yanayofaa katika Kiswahili cha Biblia.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: viongozi wa nyumba ya Mungu
  rationale: נָגִיד humaanisha kiongozi, mkuu au msimamizi. “Viongozi” linaacha cheo chao kikiwa pana kama ilivyo katika Kiebrania, na “nyumba ya Mungu” linadumisha jina la hekalu lililotumiwa katika chanzo.
- source_word: לַפְּסָחִים אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: wanyama 2,600 kwa ajili ya dhabihu za Pasaka
  rationale: Wingi פְּסָחִים hapa unaelekea kurejelea kwa njia ya kimetonimia wanyama au dhabihu za maadhimisho ya Pasaka. Kutaja “wanyama” kunafanya kitu kinachohesabiwa kiwe wazi bila kupoteza uhusiano wake na dhabihu za Pasaka.
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: na ng’ombe 300
  rationale: בָּקָר ni jina la jumla la mifugo ya jamii ya ng’ombe; “ng’ombe” ni pana na la kawaida kuliko neno linaloweza kumaanisha madume pekee.
