base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: sw
  text: 'Matendo mengine ya Yosia, na uaminifu wake[a], kama ilivyoandikwa katika Torati ya Yahweh:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fadhili zake,” “upendo wake mwaminifu,” au “uaminifu wake kwa agano.” Neno la Kiebrania linaweza kumaanisha wema, uaminifu, au uaminifu kwa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: mengine
  rationale: Katika muundo huu wa muhtasari wa kifalme, neno hili huelekeza kwenye sehemu iliyobaki ya habari; “mengine” ni ya kawaida na wazi kwa Kiswahili.
- source_word: דִּבְרֵי
  choice: matendo
  rationale: Ingawa kimsingi linaweza kumaanisha “maneno” au “mambo,” katika fomula za historia ya wafalme linarejelea matendo na matukio ya utawala.
- source_word: יֹאשִׁיָּהוּ
  choice: Yosia
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: וַחֲסָדָיו
  choice: na matendo yake ya uaminifu
  rationale: חֶסֶד inaweza kuonyesha wema, uaminifu, au utiifu wa agano. Katika tathmini hii ya kifalme, “matendo yake ya uaminifu” ni ya asili na huhifadhi uzito wa uaminifu bila kufungia maana katika tafsiri moja tu.
- source_word: כַּכָּתוּב
  choice: kama yalivyoandikwa
  rationale: Huwasilisha maana ya “kulingana na yaliyoandikwa” kwa Kiswahili cha kawaida, huku upatanisho wa kisarufi ukirejelea matendo.
- source_word: בְּתוֹרַת
  choice: katika Torati ya
  rationale: Hapa תּוֹרָה inarejelea maandishi yenye mamlaka ya sheria/mafundisho ya Musa; “Torati” ni istilahi ya kawaida ya kibiblia katika Kiswahili na huepuka maana finyu ya sheria moja moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Maana ya חֶסֶד inapomhusu Yosia
  choice: matendo yake ya uaminifu
  alternative: matendo yake ya upendo mwaminifu; matendo yake ya utiifu; wema wake
  rationale: Muktadha unahusu maisha ya Yosia yakipimwa kwa Torati ya Yahweh. Tafsiri hii huhifadhi wazo la uaminifu na kuacha uwezekano mpana wa wema au uaminifu wa agano uelezwe katika tanbihi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Kutumia “Yahweh” huhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandishi ya kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya nukta mbili imehifadhiwa kwa sababu mstari huu unaendelea katika sentensi ya muhtasari wa kifalme.
