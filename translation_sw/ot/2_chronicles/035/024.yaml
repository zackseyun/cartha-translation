  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Gari la vita’ limetumiwa kwa chariot ili kuepuka picha ya gari la kisasa; viambishi vya mfululizo ‘waka-’ vinadumisha mwendo wa simulizi la Kiebrania.
