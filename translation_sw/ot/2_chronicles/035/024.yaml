  text: וַ/יַּֽעֲבִירֻ֨/הוּ עֲבָדָ֜י/ו מִן הַ/מֶּרְכָּבָ֗ה וַֽ/יַּרְכִּיבֻ/הוּ֮ עַ֣ל רֶ֣כֶב הַ/מִּשְׁנֶה֮ אֲשֶׁר ל/וֹ֒ וַ/יּוֹלִיכֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קִבְר֣וֹת אֲבֹתָ֑י/ו וְ/כָל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם מִֽתְאַבְּלִ֖ים עַל יֹאשִׁיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: sw
  text: Basi watumishi wake wakamwondoa katika gari la vita, wakamweka katika gari la pili alilokuwa nalo[a], kisha wakampeleka Yerusalemu. Akafa na kuzikwa katika makaburi ya baba zake. Yuda yote na Yerusalemu wakaomboleza kwa ajili ya Yosia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “gari la yule wa pili.” Maana kamili ya usemi huu haiko wazi; huenda ikimaanisha gari la pili la Yosia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: wakamwondoa
  rationale: Hifili ya עבר inaonyesha kumhamisha kutoka mahali pamoja kwenda pengine; katika muktadha huu watumishi wanamtoa Yosia katika gari lake.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno hili linaweza kumaanisha watumishi, wahudumu, au maafisa; hapa ‘watumishi wake’ ni pana na linafaa kwa waliokuwa wakimhudumia mfalme vitani.
- source_word: הַמֶּרְכָּבָה
  choice: gari la vita
  rationale: מֶרְכָּבָה ni gari linalovutwa na farasi; ‘gari la vita’ linaeleweka vizuri katika muktadha wa mapigano na hulitofautisha na gari la kisasa.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: wakamweka katika
  rationale: Hifili ya רכב humaanisha kumfanya mtu apande; kwa Yosia aliyejeruhiwa, ‘wakamweka katika’ huonyesha kitendo cha kusaidiwa bila kudokeza kwamba alipanda mwenyewe.
- source_word: רֶכֶב הַמִּשְׁנֶה
  choice: gari la pili
  rationale: Tafsiri hii inabaki karibu na usemi wa Kiebrania ‘gari la pili’ bila kuamua kimya kwamba lazima lilikuwa gari la akiba.
- source_word: אֲשֶׁר לוֹ
  choice: alilokuwa nalo
  rationale: Kishazi hiki kinaonyesha kuwa gari hilo lilikuwa mali au katika matumizi ya Yosia; usemi huu ni wa kawaida katika Kiswahili.
- source_word: וַיּוֹלִיכֻהוּ
  choice: wakampeleka
  rationale: Hifili ya הלך hapa inaonyesha kumsafirisha mpaka mahali palipotajwa, yaani Yerusalemu.
- source_word: וַיָּמָת
  choice: akafa
  rationale: Ni simulizi la moja kwa moja la kifo cha Yosia, likitafsiriwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: וַיִּקָּבֵר
  choice: kuzikwa
  rationale: Nifali ya קבר ina maana ya kutendwa, yaani ‘alizikwa’; muundo ‘akafa na kuzikwa’ ni wa asili na huhifadhi maana hiyo.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: katika makaburi ya baba zake
  rationale: Huhifadhi wingi wa ‘makaburi’ na usemi wa kifamilia ‘baba zake,’ unaoweza kurejelea mababu wa kifalme.
- source_word: וְכָל יְהוּדָה וִירוּשָׁלִַם
  choice: Yuda yote na Yerusalemu
  rationale: Huhifadhi uhuishaji wa eneo na mji kama jamii nzima iliyoomboleza, bila kuongeza ‘wakazi wa’ ambako hakupo wazi katika maandishi.
- source_word: מִתְאַבְּלִים
  choice: wakaomboleza
  rationale: Ingawa umbo ni shirikishi na linaweza kudokeza hali inayoendelea, katika simulizi la Kiswahili ‘wakaomboleza’ ni la kawaida na huwasilisha tendo la maombolezo kwa uwazi.
