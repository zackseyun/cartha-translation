base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: sw
  text: Baada ya mambo hayo yote, Yosia alipokwisha kuiandaa nyumba[a], Neko mfalme wa Misri akapanda kwenda kupigana huko Karkemishi, kando ya Mto Frati. Yosia naye akatoka kwenda kukutana naye[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Hekalu.
    reason: clarification
  - marker: b
    text: Au, “akatoka kwenda kumkabili.” Katika muktadha huu wa kijeshi, kirai hicho kinaweza kumaanisha kutoka dhidi yake.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: ameiandaa
  rationale: Kitenzi hiki katika kausativi kina maana ya kuandaa, kuweka tayari, au kuthibitisha. “Ameiandaa” kinakaribia maana ya msingi bila kuifanya kauli ihusu ujenzi au ukarabati pekee.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Neno la Kiebrania ni “nyumba,” na katika muktadha wa Mambo ya Nyakati linarejelea Hekalu. Maana hiyo imefafanuliwa katika tanbihi bila kubadili neno la chanzo katika matini kuu.
- source_word: עָלָה
  choice: akapanda kwenda
  rationale: Tafsiri hii inahifadhi maana ya kawaida ya “kupanda/kwenda juu,” huku “kwenda” ikiifanya kauli ya safari ya kijeshi isikike kwa kawaida katika Kiswahili.
- source_word: לְהִלָּחֵם
  choice: kwenda kupigana
  rationale: Kitenzi kinaonyesha kushiriki katika vita; “kupigana” ni wazi, cha sasa, na hakiongezi maelezo yasiyokuwamo katika chanzo.
- source_word: בְּכַרְכְּמִישׁ
  choice: huko Karkemishi
  rationale: Kiambishi ב hapa kinaeleweka kwa maana ya mahali, yaani mapigano yalifanyika Karkemishi, si dhidi ya mji wenyewe.
- source_word: עַל פְּרָת
  choice: kando ya Mto Frati
  rationale: Kirai hiki kinaonyesha eneo la Karkemishi kuhusiana na Frati. “Kando ya” ni Kiswahili cha kawaida na huepuka dhana ya kuwa juu ya uso wa mto.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: akatoka kwenda kukutana naye
  rationale: Kirai kinaweza kumaanisha kutoka ili kumlaki, kukutana naye, au—katika muktadha wa kijeshi—kumkabili. Matini kuu inadumisha usemi usioamua wazi uhasama, na tanbihi inaonyesha maana ya kijeshi inayowezekana.
