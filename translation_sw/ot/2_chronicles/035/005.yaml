base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: sw
  text: Na simameni mahali patakatifu kwa kufuata migawanyo ya jamaa za upande wa baba za ndugu zenu[a], wana wa watu, na mgawanyo wa jamaa ya upande wa baba kwa Walawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Waisraeli wasio Walawi; kwa neno halisi, “wana wa watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: Nanyi simameni
  rationale: Kitenzi ni agizo la wingi; kiunganishi וְ kinaendeleza maagizo yaliyotangulia. “Nanyi simameni” ni agizo la moja kwa moja na la kawaida katika Kiswahili.
- source_word: בַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Kihusishi pamoja na nomino yenye kibainishi kinaonyesha eneo takatifu ambamo Walawi walipaswa kusimama, bila kulibainisha kupita kiasi kuwa chumba fulani.
- source_word: לִפְלֻגּוֹת
  choice: kulingana na migawanyo ya
  rationale: Nomino ina maana ya migawanyo au makundi yaliyopangwa; “kulingana na” linaonyesha kwamba walipaswa kujipanga kwa kufuata migawanyo hiyo.
- source_word: בֵּית הָאָבוֹת
  choice: jamaa za upande wa baba
  rationale: Kirai kinataja vitengo vya ukoo vilivyohesabiwa kwa upande wa baba. Tafsiri hii ni wazi kwa msomaji wa sasa kuliko tafsiri neno kwa neno “nyumba za baba,” huku ikihifadhi muundo wa kijamaa.
- source_word: לַאֲחֵיכֶם
  choice: za ndugu zenu
  rationale: Kinawaunganisha Walawi na Waisraeli wenzao kwa lugha ya undugu na kueleza jamaa hizo kuwa za ndugu zao.
- source_word: בְּנֵי הָעָם
  choice: wana wa watu
  rationale: Tafsiri ya karibu huhifadhi usemi halisi wa Kiebrania na tofauti yake na Walawi; tanbihi inafafanua maana ya kimuktadha.
- source_word: וַחֲלֻקַּת
  choice: na kulingana na mgawanyo wa
  rationale: Ingawa “kulingana na” haijarudiwa wazi katika Kiebrania, inachukuliwa kutoka kishazi cha kwanza na kuonyesha ulinganifu wa mpangilio kwa Kiswahili cha kawaida.
- source_word: בֵּית אָב
  choice: jamaa ya upande wa baba
  rationale: Umoja umehifadhiwa kama kitengo kimoja cha kiukoo kilichopangwa kwa upande wa baba.
- source_word: לַלְוִיִּם
  choice: kwa Walawi
  rationale: Kihusishi לְ kinaonyesha kwamba mgawanyo huo unawahusu Walawi; “kwa Walawi” huhifadhi uhusiano huo bila kuufanya kimakosa kuwa umilikaji wa lazima.
theological_decisions:
- issue: Lugha ya undugu na utambulisho wa kijamii
  choice: Kuhifadhi “ndugu zenu” na “wana wa watu” katika matini kuu
  alternative: “Waisraeli wenzenu” au “watu wa kawaida”
  rationale: Kiebrania hutumia lugha ya undugu na usemi halisi “wana wa watu” katika mpangilio wa kikabila. Tafsiri imehifadhi mvutano huo badala ya kuubadilisha kuwa istilahi ya kitabaka au ya kidhehebu; maana ya kimuktadha inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Jamaa za upande wa baba” limetumiwa badala ya “nyumba za baba” ili kueleza kitengo cha ukoo kwa uwazi. Usemi usio wa kawaida “wana wa watu” umehifadhiwa kwa sababu ni wa makusudi katika chanzo na umefafanuliwa kwa tanbihi.
