  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: sw
  text: Lakini Neko akatuma wajumbe kwa Yosia, akisema, “Nina shughuli gani nawe, ee mfalme wa Yuda? Leo siji kupigana nawe, bali dhidi ya nyumba ambayo niko vitani nayo.[a] Mungu ameniagiza niharakishe. Acha kumpinga Mungu aliye pamoja nami, ili asikuangamize.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhidi ya mahali pa vita vyangu,” au “dhidi ya nyumba/nasaba au ufalme ambao niko vitani nao.” Kirai cha Kiebrania ni kigumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni wawakilishi wa kibinadamu waliotumwa na Neko, si malaika.
- source_word: מַה לִּי וָלָךְ
  choice: Nina shughuli gani nawe
  rationale: Nahau hii inaonyesha kwamba msemaji hataki kuhusika au kugombana na anayezungumziwa; tafsiri hii ni ya kawaida kwa Kiswahili na haiongezi uhasama.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: Leo siji kupigana nawe
  rationale: Kiebrania kimeacha kitenzi wazi, lakini muktadha wa kijeshi unaonyesha kwamba Neko hakuwa akimshambulia Yosia siku hiyo.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: dhidi ya ufalme ninaopigana nao
  rationale: Neno בֵּית kwa kawaida ni ‘nyumba,’ lakini hapa huenda linamaanisha nyumba ya kifalme, nasaba, au milki inayolengwa vitani. ‘Ufalme’ huwasilisha maana inayowezekana kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi ugumu wa kirai.
- source_word: וֵאלֹהִים
  choice: Mungu
  rationale: Ingawa umbo אֱלֹהִים linaweza kuwa la wingi, kitenzi cha umoja אָמַר kinaelekeza kwa rejeleo la umoja.
- source_word: לְבַהֲלֵנִי
  choice: nifanye haraka
  rationale: Mzizi בהל hapa unaonyesha kuharakishwa kwa dharura; usemi huu ni wazi na wa asili katika Kiswahili.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: Acha kumpinga Mungu
  rationale: Nahau hii inamtaka Yosia aache kuzuia au kupinga tendo la Mungu.
- source_word: אֲשֶׁר עִמִּי
  choice: aliye pamoja nami
  rationale: Inahifadhi dai la Neko kwamba Mungu yuko pamoja naye bila kufafanua zaidi namna ya uwepo au msaada huo.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: ili asikuangamize
  rationale: Baada ya onyo, אַל huonyesha matokeo yanayopaswa kuzuiwa. ‘Kuangamiza’ huhifadhi uzito wa kitenzi.
theological_decisions:
- issue: Rejeleo la אֱלֹהִים katika maneno ya Neko
  choice: Mungu, kwa umoja
  alternative: mungu au miungu
  rationale: Kitenzi cha umoja kinaunga mkono maana ya umoja, na simulizi la mstari unaofuata linawasilisha maneno ya Neko kuwa yametoka kwa Mungu. Tafsiri haiongezi utambulisho mwingine usiotajwa hapa.
- issue: Maana ya בֵּית מִלְחַמְתִּי
  choice: ufalme ninaopigana nao
  alternative: nyumba ya vita vyangu; mahali pa vita vyangu; nyumba au nasaba ninayopigana nayo
  rationale: Kirai cha Kiebrania ni kigumu na hakina rejeleo hakika. ‘Ufalme’ kinafaa katika muktadha wa vita, lakini tanbihi inaonyesha kwamba ‘nyumba,’ nasaba, au mahali pia yanawezekana.
- issue: Dai kwamba Mungu yuko pamoja na Neko
  choice: aliye pamoja nami
  alternative: aliye upande wangu; aliye pamoja nami katika jambo hili
  rationale: Tafsiri ya moja kwa moja inadumisha mvutano wa kitheolojia wa dai la mfalme wa kigeni bila kulipanua au kulidhoofisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina ‘Neko’ na ‘Yosia’ yamewekwa wazi badala ya viwakilishi ili kuepuka utata katika mstari unaosimama peke yake. Muundo wa hotuba umehifadhi onyo kali na dai la Neko bila kuingiza msimamo wa kimadhehebu.
