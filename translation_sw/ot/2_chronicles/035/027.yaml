base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: sw
  text: Matendo yake[a], ya kwanza na ya mwisho, tazama[b], yameandikwa katika Kitabu cha Wafalme wa Israeli na Yuda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno yake” au “mambo yake”; neno la Kiebrania linaweza kumaanisha maneno, mambo, au matendo. Katika muhtasari huu wa kifalme, “matendo” linafaa zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina “tazama,” neno la kusisitiza na kuvuta fikira kwenye chanzo kilichoandikwa.
    reason: lexical_alternative
  - marker: c
    text: Au “katika hati-kunjo ya Wafalme wa Israeli na Yuda.” Neno la Kiebrania linalotafsiriwa “kitabu” linaweza pia kumaanisha hati-kunjo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: Matendo yake
  rationale: Katika muhtasari huu wa kifalme, דְּבָרִים inahusu mambo au matendo ya mfalme yaliyorekodiwa; “matendo” ni ya asili na wazi kwa msomaji wa Kiswahili, huku uwezekano wa “maneno” au “mambo” ukihifadhiwa katika tanbihi.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: ya kwanza na ya mwisho
  rationale: Huhifadhi mtindo wa kawaida wa Mambo ya Nyakati unaoeleza kipindi chote cha historia ya mtu, kuanzia mwanzo hadi mwisho.
- source_word: הִנָּם
  choice: tazama
  rationale: Huhifadhi chembe ya Kiebrania ya kuvuta fikira na kusisitiza kwamba kumbukumbu hizo zipo katika chanzo kilichotajwa.
- source_word: כְּתוּבִים
  choice: yameandikwa
  rationale: Ni tafsiri ya moja kwa moja ya kauli tendwa ya כתב na inafaa katika usemi wa kurejelea kumbukumbu zilizoandikwa.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kimsingi ni “juu ya,” Kiswahili cha kawaida husema habari zimeandikwa “katika kitabu.” סֵפֶר inaweza pia kumaanisha hati-kunjo.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Wafalme wa Israeli na Yuda
  rationale: Hili linachukuliwa kama jina la kumbukumbu iliyonukuliwa na mwandishi; “wa Israeli na Yuda” huunganisha majina yote mawili kwa njia ya kawaida ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya heshima, ya sasa, na inayoeleweka kwa urahisi. Muundo wa kifalme wa “ya kwanza na ya mwisho” na msisitizo wa “tazama” umehifadhiwa bila kuongeza kiunganishi cha wakati kisichopo katika Kiebrania.
