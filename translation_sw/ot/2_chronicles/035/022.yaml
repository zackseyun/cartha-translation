base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: sw
  text: Lakini Yosia hakuugeuza uso wake kutoka kwake[a]; badala yake, alijibadilisha sura ili apigane naye. Hakuyasikiliza maneno ya Neko yaliyotoka kinywani mwa Mungu[b], naye akaja kupigana katika Bonde la Megido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakujiondoa kwake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka kinywani mwa Mungu.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “katika Uwanda wa Megido.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: hakumgeuzia uso wake
  rationale: Inahifadhi taswira ya nahau ya Kiebrania ya kugeuza uso, huku ikieleweka kwa Kiswahili cha kawaida. Maana ya kimuktadha ni kwamba Yosia hakujiondoa wala kuachana na Neko.
- source_word: כִּי
  choice: badala yake
  rationale: 'Katika muktadha huu neno linaeleza hatua iliyo kinyume na kugeuka: Yosia alijibadilisha sura na kwenda kupigana. ''Badala yake'' huwasilisha uhusiano huo kwa uwazi.'
- source_word: לְהִלָּחֵם בּוֹ
  choice: ili apigane naye
  rationale: Muundo unaonyesha kusudi. Katika Kiswahili, 'kupigana naye' humaanisha kupigana dhidi yake kwa njia ya kawaida na isiyo na utata katika muktadha huu.
- source_word: הִתְחַפֵּשׂ
  choice: alijibadilisha sura
  rationale: Kitenzi cha Hitpael humaanisha kujifanya asitambulike au kujificha kwa kubadili mwonekano. Usemi huu ni wa asili na unaeleweka kwa wasomaji wa kisasa.
- source_word: שָׁמַע אֶל
  choice: hakuyasikiliza
  rationale: Huhifadhi maana pana ya kusikiliza au kutii bila kulazimisha maana finyu zaidi ya 'kutii.'
- source_word: דִּבְרֵי נְכוֹ
  choice: maneno ya Neko
  rationale: Ni tafsiri ya karibu na ya kawaida; 'ujumbe' ungeongeza ufafanuzi usiotajwa moja kwa moja.
- source_word: מִפִּי אֱלֹהִים
  choice: yaliyotoka kinywani mwa Mungu
  rationale: Inahifadhi nahau ya Kiebrania na dai la mwandishi kwamba chanzo cha maneno ya Neko kilikuwa Mungu, bila kueleza namna ufunuo huo ulivyotokea.
- source_word: וַיָּבֹא
  choice: naye akaja
  rationale: Hufuata kitenzi cha Kiebrania kwa karibu na kuendeleza mtiririko wa simulizi.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: katika Bonde la Megido
  rationale: בִּקְעָה ni bonde pana au uwanda wa bondeni. 'Bonde la Megido' ni wazi, la asili, na linafaa kama jina la eneo.
theological_decisions:
- issue: Iwapo maneno ya Neko yanaonyeshwa kuwa yalitoka kwa Mungu kweli
  choice: Matini kuu yasema kuwa maneno ya Neko yalitoka 'kinywani mwa Mungu.'
  alternative: Inawezekana kutafsiri kwa ufupi 'yalitoka kwa Mungu'; baadhi ya wafafanuzi pia hutilia shaka dai la Neko.
  rationale: Mstari wenyewe unawasilisha Mungu kuwa chanzo cha maneno hayo. Tafsiri inadumisha dai hilo na mvutano wake wa kiteolojia bila kulipunguza au kulitatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira muhimu ya Kiebrania imehifadhiwa pale ilipo ya maana; miundo mingine imetolewa kwa Kiswahili cha asili.
