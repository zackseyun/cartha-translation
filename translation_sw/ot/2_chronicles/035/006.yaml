base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: sw
  text: Chinjeni mnyama wa Pasaka[a], jitakaseni, na fanyeni matayarisho kwa ajili ya ndugu zenu, ili watende kulingana na neno la Yahweh kupitia Musa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “Pasaka.” Hapa neno la Kiebrania linaweza kumaanisha dhabihu ya Pasaka kwa ujumla, lakini katika muktadha huu linamrejelea mnyama anayechinjwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kwa mkono wa Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: Chinjeni
  rationale: Kitenzi שׁחט humaanisha kumchinja mnyama, hasa katika muktadha wa dhabihu; “chinjeni” kinahifadhi maana hiyo ya kiibada.
- source_word: הַפָּסַח
  choice: mnyama wa Pasaka
  rationale: Neno hilo kwa asili ni “Pasaka,” lakini hapa linamtaja mnyama wa dhabihu anayechinjwa. “Mnyama wa Pasaka” huepuka kudai kwamba lazima alikuwa mwana-kondoo pekee.
- source_word: וְהִתְקַדְּשׁוּ
  choice: jitakaseni
  rationale: Muundo wa kujirejelea unaonyesha kujiweka tayari kwa ibada takatifu; “jitakaseni” ni usemi wa kawaida na wenye uzito wa kidini katika Kiswahili.
- source_word: וְהָכִינוּ לַאֲחֵיכֶם
  choice: kuwaandalia ndugu zenu
  rationale: Kitenzi kina maana ya kutayarisha au kuweka tayari, huku kitu kinachoandaliwa kikiwa hakijatajwa wazi. Muundo huu wa Kiswahili unahifadhi hilo na kuonyesha walengwa wa maandalizi.
- source_word: לַעֲשׂוֹת
  choice: ili watende
  rationale: Infinitivu inaonyesha kusudi la maandalizi. Muktadha unaelekeza kwa ndugu zao kama watendaji, ingawa Kiebrania hakitaji kiima wazi.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahweh
  rationale: “Neno” huhifadhi usemi wa Kiebrania huku “sawasawa na” likionyesha kufuata agizo lenye mamlaka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi “Yahweh,” badala ya kulibadilisha kuwa cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: lililotolewa kwa mkono wa Musa
  rationale: Nahau ya Kiebrania inamaanisha kwamba Musa alikuwa mpatanishi wa neno hilo. Tafsiri inahifadhi taswira ya “mkono” huku ikifanya uhusiano wake na “neno” uwe wazi kwa Kiswahili.
theological_decisions:
- issue: Lugha ya kifamilia yenye jinsia katika לַאֲחֵיכֶם
  choice: ndugu zenu
  alternative: Waisraeli wenzenu
  rationale: “Ndugu” linaweza kufuata neno la Kiebrania bila kupanua wazi rejeo kuwa jumuiya yote; katika Kiswahili pia linaweza kueleweka kwa upana kulingana na muktadha.
- issue: Jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; kwa hiyo “Yahweh” linahifadhi tofauti hiyo.
- issue: Kiima cha לַעֲשׂוֹת
  choice: ili watende
  alternative: ili mtende
  rationale: Infinitivu ya Kiebrania haitaji kiima wazi. Uhusiano wa karibu na “ndugu zenu” unaunga mkono “watende,” lakini uwezekano wa kuhusisha Walawi wanaoagizwa hauondolewi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. “Kwa mkono wa Musa” limehifadhiwa kama nahau ya kibiblia, huku “lililotolewa” likisaidia ufafanuzi wa kisintaksia.
