id: 2CH.35.18
reference: 2 Chronicles 35:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: sw
  text: Pasaka kama hiyo haikuwa imewahi kuadhimishwa katika Israeli tangu siku za nabii Samweli,[a] wala hakuna mfalme yeyote wa Israeli aliyewahi kuadhimisha Pasaka kama ile ambayo Yosia aliiadhimisha, pamoja na makuhani, Walawi, Yuda yote, Waisraeli waliokuwapo,[b] na wakazi wa Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakuna Pasaka kama hii iliyokuwa imeadhimishwa katika Israeli tangu siku za nabii Samweli.”
    reason: Mpangilio huu mbadala unafuata kwa karibu zaidi mpangilio wa maneno ya Kiebrania huku ukihifadhi maana ileile ya msingi.
  - marker: b
    text: Kwa neno kwa neno, “Israeli iliyokuwapo”; maana yake ni watu wa Israeli waliokuwapo katika maadhimisho hayo.
    reason: Kiebrania kinatumia jina la pamoja “Israeli” katika umoja pamoja na neno linalomaanisha aliyepatikana au aliyekuwapo.
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה
  choice: imeadhimishwa / ameadhimisha / aliadhimisha
  rationale: Kitenzi עשה kinapotumiwa pamoja na פֶסַח humaanisha kuiadhimisha au kuishika Pasaka, si kuitengeneza. Kauli tendwa katika sehemu ya kwanza na kauli tendaji baadaye zimehifadhiwa.
- source_word: פֶסַח
  choice: Pasaka
  rationale: Hapa neno hili linahusu maadhimisho yote ya Pasaka, wala si mnyama wa dhabihu peke yake; “Pasaka” ni istilahi ya kawaida na yenye upana unaofaa.
- source_word: כָּמֹהוּ
  choice: kama hiyo
  rationale: Kiambishi kinarejelea Pasaka iliyotajwa, yaani maadhimisho hayo ya Pasaka.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kihusishi kinaonyesha eneo au taifa kwa ujumla; “katika Israeli” kinahifadhi maana hiyo.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: Tangu siku za nabii Samweli
  rationale: מִן pamoja na “siku” huonyesha mwanzo wa kipindi kinacholinganishwa; “tangu siku za” ni Kiswahili cha kawaida.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא עָשׂוּ
  choice: wala hakuna yeyote kati ya wafalme wa Israeli aliyekuwa ameadhimisha
  rationale: Muundo wa Kiebrania “wote ... si” una maana ya “hakuna hata mmoja.” Tafsiri hii inaepuka Kiswahili chenye utata huku ikihifadhi ukanushaji wa jumla.
- source_word: אֲשֶׁר עָשָׂה יֹאשִׁיָּהוּ
  choice: ile ambayo Yosia aliadhimisha
  rationale: “Ile ambayo” huendeleza kwa kawaida ulinganisho wa Pasaka, na “aliadhimisha” huakisi nahau ya עשה + פסח.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: pamoja na makuhani, Walawi
  rationale: Makundi haya ni washiriki wa maadhimisho pamoja na Yosia. “Pamoja na” huonyesha uhusiano huo kwa Kiswahili cha kawaida bila kuyatenga na tendo.
- source_word: וְכָל יְהוּדָה
  choice: Yuda yote
  rationale: Hili ni jina la taifa kwa maana ya jumla; “Yuda yote” ni fupi na la kawaida.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: Waisraeli waliokuwapo
  rationale: Ingawa Kiebrania kinatumia jina la pamoja “Israeli” katika umoja, maana katika muktadha ni watu wa Israeli waliopatikana au waliokuwapo katika sherehe. Uundaji huu ni wa asili katika Kiswahili.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: na wakazi wa Yerusalemu
  rationale: Hii ni tafsiri ya kawaida ya usemi wa Kiebrania unaowataja watu wanaokaa mjini.
theological_decisions:
- issue: Ulinganisho wa kihistoria na Pasaka za awali
  choice: Aya inasema kwamba tangu siku za Samweli hakukuwa na Pasaka kama ya Yosia, bila kufafanua kama ulinganisho huo ni wa ubora, upekee, au kiwango katika kila jambo.
  alternative: Kuisoma kama dai kamili kwamba hapakuwa na maadhimisho yoyote yaliyolingana nayo kwa namna yoyote tangu Samweli mpaka Yosia.
  rationale: Kiebrania chenyewe kinalinganisha maadhimisho na kisha kuwataja wafalme wa Israeli. Tafsiri inahifadhi dai hilo na mvutano wake bila kuingiza upatanisho na Pasaka nyingine, kama ile ya Hezekia, wala kulifanya dai kuwa maalumu kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuadhimisha Pasaka” ni nahau ya sasa na ya asili; majina “Samweli,” “Yosia,” “Walawi,” na “Yerusalemu” yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili.
