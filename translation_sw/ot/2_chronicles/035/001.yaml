  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: sw
  text: Yosia akaadhimisha Pasaka kwa ajili ya Yahweh huko Yerusalemu, nao wakamchinja mnyama wa Pasaka[a] siku ya kumi na nne ya mwezi wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Pasaka.” Hapa neno hilo linamaanisha mnyama aliyechinjwa kwa ajili ya Pasaka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akaadhimisha
  rationale: Ingawa kitenzi hiki kimsingi humaanisha ‘alifanya,’ kinapotumiwa pamoja na פֶּסַח humaanisha kutekeleza au kuadhimisha Pasaka.
- source_word: פֶּסַח
  choice: Pasaka
  rationale: Katika matumizi ya kwanza, neno hili linataja maadhimisho ya Pasaka kwa ujumla.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kihusishi ל kinaonyesha kwamba maadhimisho hayo yalielekezwa au kuwekwa wakfu kwa Yahweh.
- source_word: בִירוּשָׁלַםִ
  choice: huko Yerusalemu
  rationale: Hii ni tafsiri ya kawaida ya mahali inayotumia jina la Kiswahili la mji.
- source_word: וַיִּשְׁחֲטוּ
  choice: wakamchinja
  rationale: ‘Kuchinja’ huwasilisha kwa usahihi tendo la kumuua mnyama katika muktadha wa ibada kuliko neno la jumla ‘kuua.’
- source_word: הַפֶּסַח
  choice: mnyama wa Pasaka[a]
  rationale: Katika matumizi ya pili, ‘Pasaka’ humaanisha kwa mkato mnyama aliyechinjwa kwa Pasaka. ‘Mnyama wa Pasaka’ hufanya rejeo hilo lieleweke bila kubainisha kuwa alikuwa mwana-kondoo, jambo ambalo halijasemwa wazi hapa.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: siku ya kumi na nne
  rationale: Hii ndiyo namna ya kawaida na wazi ya kutaja tarehe hiyo kwa Kiswahili.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ya mwezi wa kwanza
  rationale: Kirai hiki kinaonyesha mwezi ambao siku ya kumi na nne ilikuwa ndani yake.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi wenye ‘aka- / waka-’ unaunganisha matendo kwa kawaida. Tafsiri huepuka kuongeza ‘mwana-kondoo,’ kwa kuwa aina ya mnyama haitajwi wazi katika mstari huu.
