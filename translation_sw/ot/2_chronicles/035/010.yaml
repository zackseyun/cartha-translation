base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: sw
  text: Hivyo huduma ikawekwa tayari[a]; makuhani wakasimama katika nafasi zao[b], nayo Walawi wakasimama kwa migawanyo yao[c], kama mfalme alivyoamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikawekwa kwa utaratibu” au “ikaanzishwa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mahali pao pa kusimama”; yaani, katika nafasi walizopangiwa.
    reason: lexical_alternative
  - marker: c
    text: Au “katika migawanyo yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: ikawekwa tayari
  rationale: Kitenzi כון hapa kina maana ya kuwekwa katika hali ya utayari au kupangwa. Kauli hii ni ya kawaida katika Kiswahili na inafaa muktadha wa maandalizi ya ibada ya Pasaka.
- source_word: הָעֲבוֹדָה
  choice: ibada
  rationale: Katika muktadha wa hekalu, עֲבוֹדָה hurejelea huduma takatifu ya kuabudu. “Ibada” ni neno la kawaida na lenye heshima, bila kuingiza istilahi nzito ya baadaye.
- source_word: וַיַּעַמְדוּ
  choice: wakasimama
  rationale: Huwakilisha moja kwa moja tendo la kusimama au kuchukua mahali pa kazi; vifungu vinavyofuata vinafafanua mpangilio wao.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno sanifu la Kiswahili kwa כֹּהֲנִים katika muktadha wa ibada.
- source_word: עַל עָמְדָם
  choice: katika nafasi zao
  rationale: Nahau hiyo inaashiria mahali pao pa kusimama au nafasi walizopangiwa. “Katika nafasi zao” ni wazi na ya asili kwa Kiswahili.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Jina sanifu la kundi la kikabila na la huduma ya ibada.
- source_word: עַל מַחְלְקוֹתָם
  choice: katika zamu zao
  rationale: מַחְלְקוֹת ni vikundi au migawanyo iliyopangiwa huduma. “Zamu” huonyesha kwa ufupi vikundi vilivyopangwa kwa huduma, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya “migawanyo.”
- source_word: כְּמִצְוַת
  choice: kama ... alivyoamuru
  rationale: Muundo huu wa kitenzi ni wa asili katika Kiswahili na unaonyesha kwamba mpangilio ulifuata agizo mahususi.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Tafsiri ya moja kwa moja ya jina lenye uainisho, likimrejelea mfalme anayejulikana katika muktadha.
theological_decisions:
- issue: Istilahi ya huduma takatifu katika עֲבוֹדָה
  choice: ibada
  alternative: huduma; kazi ya ibada
  rationale: Muktadha ni taratibu za Pasaka hekaluni. “Ibada” huhifadhi maana ya shughuli takatifu bila kuifanya kuwa kazi ya kawaida wala kuingiza mfumo maalumu wa kiliturujia.
- issue: Nahau za mpangilio wa makuhani na Walawi
  choice: katika nafasi zao ... katika zamu zao
  alternative: mahali pao ... kulingana na migawanyo yao
  rationale: Maneno yaliyochaguliwa yanaonyesha mpangilio rasmi wa wahudumu kwa Kiswahili cha sasa, huku tanbihi zikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kusomeka kwa sauti, huku istilahi za hekalu na mpangilio wa huduma zikibaki wazi.
