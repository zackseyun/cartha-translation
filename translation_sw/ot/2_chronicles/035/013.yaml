source:
  edition: WLC
  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: sw
  text: Wakaipika dhabihu ya Pasaka kwa moto kama ilivyoagizwa[a]. Wakazichemsha sadaka takatifu katika vyungu, masufuria makubwa, na mabakuli, kisha wakazipeleka kwa watu wote haraka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana maalumu zaidi, “wakaichoma dhabihu ya Pasaka kwa moto.” Kitenzi cha Kiebrania kinaweza kumaanisha “kupika” kwa upana, lakini sheria ya Pasaka ilitaka nyama iokwe kwa moto badala ya kuchemshwa (taz. Kutoka 12:8–9).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: wakaipika
  rationale: Kitenzi בשׁל kinaweza kumaanisha kupika kwa upana au kuchemsha. Hapa kirai ‘motoni kama ilivyoagizwa’ kinaonyesha njia iliyotakiwa ya kuandaa Pasaka bila kulazimisha maana finyu ndani ya kitenzi chenyewe.
- source_word: הַפֶּסַח
  choice: dhabihu ya Pasaka
  rationale: Katika muktadha wa kupikwa, neno hili linarejelea mnyama wa dhabihu ya Pasaka, si sikukuu peke yake. ‘Dhabihu ya Pasaka’ huweka wazi maana hiyo bila kuongeza kwamba alikuwa mwana-kondoo, jambo lisilotajwa moja kwa moja hapa.
- source_word: בָּאֵשׁ
  choice: motoni
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba dhabihu iliandaliwa kwa moto.
- source_word: כַּמִּשְׁפָּט
  choice: kama ilivyoagizwa
  rationale: Hutoa maana ya utaratibu uliowekwa kisheria kwa Kiswahili cha sasa kilicho wazi na cha heshima.
- source_word: וְהַקֳּדָשִׁים
  choice: sadaka takatifu
  rationale: Muktadha unaonyesha vitu vilivyowekwa wakfu kwa ajili ya dhabihu, tofauti na dhabihu ya Pasaka iliyotajwa kwanza.
- source_word: בִּשְּׁלוּ
  choice: wakazichemsha
  rationale: Vyombo vinavyotajwa baada ya kitenzi vinaunga mkono maana maalumu ya kuchemsha na kuonyesha tofauti na dhabihu ya Pasaka iliyoandaliwa motoni.
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: katika vyungu, masufuria makubwa, na mabakuli
  rationale: Maneno haya yanawakilisha aina tatu za vyombo vya kupikia au kuandalia chakula; ukubwa wa דְּוָדִים umeonyeshwa kwa ‘masufuria makubwa,’ huku umbo kamili la צֵלָחוֹת likibaki lisilo hakika.
- source_word: וַיָּרִיצוּ
  choice: kisha wakawapelekea ... haraka
  rationale: Kitenzi kinaonyesha mwendo wa haraka au kuharakisha utoaji; tafsiri hii ni ya kawaida na huhifadhi dhana ya uharaka.
- source_word: לְכָל בְּנֵי הָעָם
  choice: watu wote
  rationale: Kirai hiki cha Kiebrania ni nahau inayowarejelea watu kwa ujumla, si wana wa kiume peke yao.
theological_decisions:
- issue: Mvutano unaoweza kuonekana kati ya בשׁל na sheria ya Pasaka inayotaka nyama iokotwe kwa moto
  choice: Kutumia kitenzi kipana ‘kupika’ katika sehemu ya kwanza na kuacha ‘motoni kama ilivyoagizwa’ ieleze njia halali ya maandalizi.
  alternative: Kutafsiri moja kwa moja ‘wakaichoma’ au kutumia ‘kuchemsha’ katika sehemu zote mbili.
  rationale: Kifungu chenyewe kinatofautisha Pasaka iliyoandaliwa motoni na sadaka nyingine zilizochemshwa katika vyombo. Uamuzi huu huhifadhi tofauti hiyo na pia upana wa kitenzi cha kwanza.
- issue: Kirejelewa cha הַקֳּדָשִׁים
  choice: Kukichukulia kuwa sadaka nyingine zilizowekwa wakfu, tofauti na dhabihu ya Pasaka.
  alternative: Kukichukulia kuwa vyakula vyote vitakatifu, ikiwemo dhabihu ya Pasaka.
  rationale: Muundo wa sentensi na njia tofauti za maandalizi vinaonyesha utofautishaji kati ya Pasaka na sadaka takatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Dhabihu ya Pasaka’ hufafanua kirejelewa cha kiibada bila kuongeza aina ya mnyama ambayo haijatajwa wazi katika mstari huu.
