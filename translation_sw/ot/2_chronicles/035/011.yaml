  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: sw
  text: Wakaichinja sadaka ya Pasaka[a], nao makuhani wakainyunyiza damu kutoka mikononi mwao[b], huku Walawi wakichuna ngozi za wanyama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnyama wa Pasaka.” Kiebrania hapa hurejelea mnyama wa sadaka aliyechinjwa kwa ajili ya Pasaka.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka mikononi mwao.” Kitenzi cha Kiebrania ni neno la kawaida la ibada kwa matumizi ya damu madhabahuni; linaweza pia kumaanisha kuirusha damu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, Walawi walikuwa wakiondoa ngozi za wanyama wa sadaka waliokuwa wamechinjwa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Wakaichinja
  rationale: Kitenzi שׁחט humaanisha kuchinja mnyama, hasa katika muktadha wa dhabihu; “kuchinja” huhifadhi maana hiyo ya kiibada kwa Kiswahili cha kawaida.
- source_word: הַפָּסַח
  choice: sadaka ya Pasaka
  rationale: Hapa פֶּסַח ni mnyama wa Pasaka anayechinjwa, si sikukuu peke yake. “Sadaka ya Pasaka” huepuka kuifanya kuwa mwana-kondoo mmoja tu, kwa kuwa muktadha mpana unaweza kuhusisha wanyama wa sadaka.
- source_word: וַיִּזְרְקוּ
  choice: wakainyunyiza damu
  rationale: Katika ibada za madhabahuni, זרק ni tendo la makuhani la kuiweka damu kwa kuirusha au kuinyunyiza. “Kunyunyiza damu” ni usemi unaoeleweka na uliozoeleka katika Kiswahili cha Biblia, huku tanbihi ikifafanua namna ya tendo.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watumishi wa kikuhani katika hekalu.
- source_word: מִיָּדָם
  choice: waliyopewa nao
  rationale: Kihalisi ni “kutoka mkononi mwao.” Usemi huu unaonyesha kwamba makuhani walipokea damu kutoka kwa wale waliokuwa wakichinja, bila kutumia muundo mzito wa Kiswahili.
- source_word: וְהַלְוִיִּם מַפְשִׁיטִים
  choice: huku Walawi wakichuna ngozi za wanyama
  rationale: Kitenzi kishirikishi kinaonyesha tendo lililokuwa likiendelea wakati huohuo. Katika muktadha huu פשט ni kuondoa ngozi za wanyama waliochinjwa; kutaja “wanyama” huweka maana wazi kwa msomaji wa kawaida.
theological_decisions:
- issue: Mhusika wa kiwakilishi katika מִיָּדָם (“kutoka mkononi mwao”)
  choice: Damu ilipewa makuhani na wale waliokuwa wakichinja.
  alternative: Kuitafsiri kihalisi tu kuwa “kutoka mikononi mwao,” jambo ambalo linaweza kueleweka kana kwamba ni mikono ya makuhani wenyewe.
  rationale: Mfuatano wa ibada na sarufi ya kifungu unaelekea kwa wale waliokuwa wakichinja kama waliowapa makuhani damu. Tanbihi inadumisha uwazi kuhusu jambo hili bila kuingiza fundisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “huku ... wakichuna” unaonyesha matendo yaliyotokea kwa wakati mmoja; istilahi za ibada zimefafanuliwa kwa tanbihi bila kuufanya mstari kuwa mzito.
