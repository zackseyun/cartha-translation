  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַחַ֗ר הֵכִ֤ינוּ לָ/הֶם֙ וְ/לַ/כֹּ֣הֲנִ֔ים כִּ֤י הַ/כֹּהֲנִים֙ בְּנֵ֣י אַהֲרֹ֔ן בְּ/הַֽעֲל֛וֹת הָ/עוֹלָ֥ה וְ/הַ/חֲלָבִ֖ים עַד לָ֑יְלָה וְ/הַ/לְוִיִּם֙ הֵכִ֣ינוּ לָ/הֶ֔ם וְ/לַ/כֹּהֲנִ֖ים בְּנֵ֥י אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: sw
  text: Baadaye wakajiandalia wao wenyewe na kuwaandalia makuhani[a], kwa sababu makuhani, wana wa Aroni, walikuwa wakishughulika na kutoa sadaka ya kuteketezwa na sehemu za mafuta mpaka usiku. Hivyo Walawi wakajiandalia wao wenyewe na kuwaandalia makuhani, wana wa Aroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawaandalia wao”; kiwakilishi cha Kiebrania chenyewe hakionyeshi wazi kwamba kinawarejelea watendaji, lakini muktadha unaashiria kwa nguvu kwamba Walawi walijiandalia chakula chao pia, pamoja na kuwaandalia makuhani. Jambo hili linahusu sehemu zote mbili zenye maneno “wao wenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Baadaye
  rationale: Inaonyesha tendo lililofuata baada ya maandalizi yaliyotajwa katika mstari uliotangulia.
- source_word: הֵכִינוּ
  choice: wakajiandalia ... na kuwaandalia
  rationale: Hifili ya כון ina maana ya kuandaa au kuweka tayari; muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba maandalizi yalifanywa kwa ajili ya Walawi wenyewe na pia makuhani.
- source_word: לָהֶם
  choice: wao wenyewe
  rationale: Kiwakilishi cha Kiebrania si cha kujirejelea kwa umbo lake, lakini muktadha unaelekea kumaanisha Walawi walijiandalia mahitaji yao wenyewe.
- source_word: וְלַכֹּהֲנִים
  choice: na kuwaandalia makuhani
  rationale: Kishazi kinaonyesha kundi jingine lililoandaliwa mahitaji; kurudia kitenzi kunafanya Kiswahili kiwe wazi na cha kawaida.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kinaanzisha sababu iliyowafanya Walawi wawaandalie makuhani.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: makuhani, wana wa Aroni
  rationale: Inahifadhi usemi wa ukoo wa Kiebrania na kubainisha makuhani wanaokusudiwa.
- source_word: בְּהַעֲלוֹת
  choice: walikuwa wakishughulika na kutoa
  rationale: Muundo wa kuendelea unaonyesha shughuli iliyodumu na iliyowazuia makuhani kujiandalia.
- source_word: הָעוֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi ya kawaida na sahihi ya dhabihu aina ya עֹלָה.
- source_word: וְהַחֲלָבִים
  choice: na sehemu za mafuta
  rationale: Katika muktadha wa dhabihu, neno linamaanisha vipande maalumu vya mafuta vilivyotolewa madhabahuni, si mafuta kwa ujumla.
- source_word: עַד לָיְלָה
  choice: mpaka usiku
  rationale: Inahifadhi kikomo cha muda kinachoingia au kufikia wakati wa usiku.
- source_word: וְהַלְוִיִּם
  choice: Hivyo Walawi
  rationale: Kiunganishi kinarejelea tendo kuu baada ya maelezo ya sababu; “Hivyo” huonyesha kwa kawaida matokeo hayo katika Kiswahili.
theological_decisions:
- issue: Mhusika anayerejelewa na לָהֶם
  choice: wao wenyewe, yaani Walawi
  alternative: wao / kwa ajili yao bila kubainisha mrejelewa
  rationale: Ingawa kiwakilishi chenyewe si cha kujirejelea waziwazi, mhusika wa tendo na kurudiwa kwa sentensi mwishoni mwa mstari vinaunga mkono maana kwamba Walawi walijiandalia wenyewe; tanbihi inalinda uwezekano wa tafsiri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya dhabihu imewekwa wazi bila kuongeza kwamba kilichoandaliwa kilikuwa chakula ndani ya matini kuu, kwa kuwa hilo linadokezwa na muktadha lakini halitajwi moja kwa moja katika Kiebrania.
