  to: Yeremia akamwombolezea Yosia; nao waimbaji wote wa kiume na wa kike humtaja Yosia katika nyimbo zao za maombolezo mpaka leo. Wakazifanya kuwa desturi ya kudumu katika Israeli; nazo zimeandikwa katika Maombolezo.[a]
