base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: sw
  text: Yeremia akamwombolezea Yosia; nao waimbaji wote wa kiume na wa kike humtaja Yosia katika nyimbo zao za maombolezo mpaka leo. Wakazifanya kuwa desturi ya kudumu katika Israeli; nazo zimeandikwa katika Maombolezo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nyimbo za maombolezo,” ikiwa maneno haya yanarejelea nyimbo za maombolezo kwa ujumla badala ya mkusanyo maalumu ulioitwa Maombolezo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: akaomboleza
  rationale: Kitenzi קונן humaanisha kutoa au kuimba ombolezo kwa ajili ya aliyekufa. “Akaomboleza” ni Kiswahili cha kawaida kinachohifadhi maana bila kuamua kama Yeremia alitunga au aliimba ombolezo hilo.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: kwa ajili ya Yosia
  rationale: Pamoja na kitenzi cha kuomboleza, עַל humtaja aliyefiwa au anayeliliwa; “kwa ajili ya Yosia” ni ya asili katika Kiswahili.
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: waimbaji wote wa kiume na wa kike
  rationale: Maumbo haya yanamaanisha waimbaji, si wakuu. Tofauti ya jinsia iliyo wazi katika Kiebrania imehifadhiwa.
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: humtaja ... mpaka leo
  rationale: Ingawa אמר kimsingi ni “kusema,” muktadha wa waimbaji na maombolezo unaonyesha kutaja kwa kuimba au kukariri. Hali ya mazoea “humtaja” huonyesha desturi iliyoendelea mpaka wakati wa mwandishi.
- source_word: בְּקִינוֹתֵיהֶם
  choice: katika nyimbo zao za maombolezo
  rationale: קִינוֹת ni maombolezo au nyimbo za huzuni kwa ajili ya wafu. Kirai hiki ni wazi kwa msomaji wa kawaida na huhifadhi mazingira ya uimbaji.
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: Wakazifanya kuwa desturi ya kudumu katika Israeli
  rationale: חֹק inaweza kuwa sheria, agizo, au desturi iliyowekwa. Katika muktadha huu, “desturi ya kudumu” ni ya asili na haidokezi lazima sheria rasmi ya kiserikali.
- source_word: וְהִנָּם כְּתוּבִים
  choice: nazo zimeandikwa
  rationale: Kiunganishi “nazo” huelekeza fikira kwenye maombolezo yaliyotajwa na kutoa msisitizo wa הִנֵּה kwa Kiswahili cha asili bila kutumia “tazama” kwa namna ngumu.
- source_word: עַל הַקִּינוֹת
  choice: katika Maombolezo
  rationale: Inaweza kurejelea mkusanyo maalumu unaojulikana wa nyimbo za maombolezo; herufi kubwa huonyesha usomaji huo huku tanbihi ikihifadhi uwezekano wa maana ya jumla.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Maombolezo” limetumiwa badala ya msamiati adimu zaidi; mpangilio wa sentensi umehifadhi mtiririko wa simulizi na hali ya desturi inayoendelea.
