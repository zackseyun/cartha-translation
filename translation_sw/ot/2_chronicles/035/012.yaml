  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: sw
  text: Wakatenga sadaka za kuteketezwa ili wawape watu[a] kwa makundi ya jamaa za baba, wapate kumtolea Yahwe, kama ilivyoandikwa katika Kitabu cha Musa; na vivyo hivyo kwa ng’ombe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa watu.” Usemi huu unaweza kumaanisha watu kwa ujumla, na katika muktadha huu huenda ukawatofautisha na makuhani na Walawi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: Wakatenga
  rationale: Hifili ya סור hapa inaonyesha kuondoa kitu mahali kilipokuwa au kukitenga kwa kusudi fulani. Katika muktadha wa kuandaa dhabihu, “wakatenga” linaeleza kwa kawaida kuwa sehemu hizo ziliwekwa kando ili zigawiwe.
- source_word: הָעֹלָה
  choice: sadaka za kuteketezwa
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, inaweza kutumiwa kwa maana ya mkusanyo. Muktadha unahusu dhabihu nyingi, hivyo wingi wa Kiswahili unafaa na unaeleweka.
- source_word: לְתִתָּם
  choice: ili wawagawie
  rationale: Kitenzi-jina chenye kiambishi cha yambwa kinaonyesha kusudi. “Wawagawie” huonyesha kwa uwazi kwamba sadaka zilizotengwa zilipewa watu mbalimbali, bila kupanua utaratibu kuliko maandishi yanavyosema.
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: kwa mafungu, kufuatana na jamaa za mababu zao
  rationale: מִפְלַגּוֹת ni mafungu au makundi, na בֵּית אָבוֹת ni kitengo cha ukoo kilichopangwa kwa jamaa za mababu. Tafsiri hii huhifadhi mpangilio wa kijamii huku ikiwa Kiswahili cha kawaida.
- source_word: לִבְנֵי הָעָם
  choice: watu[a]
  rationale: Kirai hiki kwa neno kwa neno ni “wana wa watu,” lakini hapa ni usemi wa kijamii unaowataja watu kwa ujumla tofauti na makuhani na Walawi. “Watu” ni Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi na tofauti inayoweza kudokezwa.
- source_word: לְהַקְרִיב לַיהוָה
  choice: wapate kumtolea Yahwe
  rationale: Katika muktadha wa dhabihu, הקריב humaanisha kuleta karibu au kutoa sadaka. “Kumtolea Yahwe” ni usemi wa kawaida wa Kiswahili unaohifadhi kusudi la ibada na jina la Mungu lililo katika maandishi.
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: kama ilivyoandikwa katika Kitabu cha Musa
  rationale: Hili ni rejeo rasmi kwa maagizo yaliyoandikwa yanayohusishwa na Musa. Muundo huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: וְכֵן לַבָּקָר
  choice: Wakafanya vivyo hivyo pia na ng’ombe
  rationale: Kiebrania kina usemi mfupi usio na kitenzi unaopanua utaratibu uleule kwa ng’ombe. Kuongeza “wakafanya” kunakamilisha sentensi kwa Kiswahili bila kubadili maana.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana Tetragramatoni yenyewe. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kijamii na wa kiume לִבְנֵי הָעָם
  choice: watu, huku umbo halisi likielezwa katika tanbihi
  alternative: wana wa watu
  rationale: “Wana wa watu” lingehifadhi umbo la kisarufi lakini si usemi wa kawaida wala wazi katika Kiswahili cha sasa. Katika muktadha, kirai kinawakilisha watu kwa ujumla, tofauti na wahudumu wa kikuhani; tanbihi huhifadhi utata huo bila kulazimisha tafsiri ya kidhehebu kama “walei.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa upya kwa kiasi ili mahusiano ya kusudi na ugawaji yaeleweke kwa urahisi, lakini ufupi wa sehemu ya mwisho na mpangilio wa jamaa za mababu umehifadhiwa.
