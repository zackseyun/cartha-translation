  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: sw
  text: Akawaambia Walawi waliowafundisha Israeli wote[a], waliowekwa wakfu kwa Yahweh, “Liwekeni sanduku takatifu katika nyumba[b] aliyojenga Sulemani mwana wa Daudi, mfalme wa Israeli. Hamna tena mzigo wa kubeba begani[c]. Sasa mtumikieni Yahweh Mungu wenu, na watu wake Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walawi waliowapa Israeli wote ufahamu,” au “Walawi wenye ufahamu.” Umbo la Kiebrania linaweza kumaanisha kuwa na ufahamu au kuwapa wengine ufahamu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hekalu alilojenga Sulemani.
    reason: cultural_note
  - marker: c
    text: Kwa tafsiri ya neno kwa neno, “hamna mzigo begani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ה/מבונים
  choice: waliowafundisha
  rationale: Kirai hiki kinaweza kueleza wenye ufahamu au wanaowapa wengine ufahamu. Katika muktadha wa huduma ya Walawi, ‘waliowafundisha’ linaeleza vizuri jukumu lao kwa Israeli, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: הַ/קְּדוֹשִׁים לַ/יהוָה
  choice: waliowekwa wakfu kwa Yahweh
  rationale: Hueleza hali ya Walawi kuwa wametengwa na kuwa mali ya Yahweh kwa ajili ya huduma; Kiswahili hiki ni cha kawaida na kinahifadhi maana ya kiibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: תְּנוּ אֶת אֲרוֹן הַ/קֹּדֶשׁ בַּ/בַּיִת
  choice: Liwekeni sanduku takatifu katika nyumba
  rationale: ‘Liwekeni’ linawakilisha נתן katika maana ya kuweka, na ‘nyumba’ linahifadhi neno בית; katika muktadha ni hekalu la Sulemani.
- source_word: אֲרוֹן הַ/קֹּדֶשׁ
  choice: sanduku takatifu
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi sifa ya utakatifu ya sanduku.
- source_word: אֵין לָ/כֶם מַשָּׂא בַּ/כָּתֵף
  choice: Hamna tena mzigo wa kubeba begani
  rationale: Huhifadhi taswira halisi ya mzigo begani na, kwa kuzingatia sanduku kuwa sasa ndani ya hekalu, ‘tena’ huwasilisha maana ya kimuktadha.
- source_word: עַתָּה עִבְדוּ
  choice: Sasa mtumikieni
  rationale: Kitenzi ‘kutumikia’ kinafaa kwa huduma ya kiibada kwa Mungu na pia kwa kuwahudumia watu wake.
- source_word: וְ/אֵת עַמּ/וֹ יִשְׂרָאֵל
  choice: na watu wake Israeli
  rationale: Huhifadhi uhusiano wa agano unaoelezwa kwa Israeli kuwa watu wa Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya jukumu la Walawi katika ה/מבונים
  choice: Walawi waliowafundisha Israeli wote
  alternative: Walawi wenye ufahamu au waliofundishwa kwa ajili ya Israeli wote
  rationale: Umbo la Kiebrania linaweza kuhusishwa na kuwa na ufahamu au kusababisha wengine waelewe. Muktadha wa Mambo ya Nyakati unapendelea jukumu la kuwafundisha watu, lakini tanbihi inahifadhi utata wa kileksia.
- issue: Hali ya Walawi kama הַקְּדוֹשִׁים לַיהוָה
  choice: waliowekwa wakfu kwa Yahweh
  alternative: waliokuwa watakatifu kwa Yahweh
  rationale: ‘Waliowekwa wakfu’ huonyesha kutengwa kwa ajili ya Yahweh bila kudai ukamilifu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umefanywa wa kawaida kwa Kiswahili huku taswira ya sanduku, nyumba, na mzigo begani ikihifadhiwa. Tanbihi zinaweka wazi utata wa ה/מבונים na maana ya ‘nyumba’ bila kulemea matini kuu.
