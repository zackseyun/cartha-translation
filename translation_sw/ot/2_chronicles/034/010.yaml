- from: Wakawakabidhi wale waliofanya kazi, ambao walikuwa wamewekwa kusimamia nyumba ya Yahweh,[a] nao wale waliofanya kazi katika nyumba ya Yahweh wakawatumia kwa kukarabati na kuimarisha nyumba hiyo.[b]
  to: Wakazikabidhi fedha hizo mikononi mwa wafanyakazi waliowekwa kusimamia nyumba ya Yahweh[a], nao wakawapa wale waliofanya kazi katika nyumba ya Yahweh fedha hizo ili kuikarabati na kuiimarisha nyumba hiyo.[b]
