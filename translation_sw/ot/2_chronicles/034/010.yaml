  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: sw
  text: Wakazikabidhi fedha hizo mikononi mwa wafanyakazi waliowekwa kusimamia nyumba ya Yahweh[a], nao wakawapa wale waliofanya kazi katika nyumba ya Yahweh fedha hizo ili kuikarabati na kuiimarisha nyumba hiyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba ya Yahweh” hapa ni hekalu.
    reason: cultural_note
  - marker: b
    text: Au, “ili kuirejesha na kuiimarisha nyumba hiyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ ... עַל יַד
  choice: wakawakabidhi
  rationale: Kirai hiki kinaonyesha kukabidhi kitu chini ya usimamizi au mamlaka ya mtu. Kiambishi cha kitu kinarejelea fedha zilizotajwa katika muktadha uliotangulia.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: wale waliofanya kazi
  rationale: Hili ni kundi la wafanyakazi; tafsiri hii ni ya kawaida na haibani maana kwa mafundi wa aina moja tu.
- source_word: הַמֻּפְקָדִים
  choice: ambao walikuwa wamewekwa kusimamia
  rationale: Inahifadhi hali ya kutendwa na wajibu wa uangalizi uliokabidhiwa watu hao.
- source_word: בְּבֵית יְהוָה
  choice: nyumba ya Yahweh / katika nyumba ya Yahweh
  rationale: Neno בַּיִת limehifadhiwa kama ‘nyumba,’ huku jina la agano יְהוָה likitafsiriwa kwa unukuzi ‘Yahweh.’ Katika muktadha, nyumba hiyo ni hekalu.
- source_word: אֹתוֹ
  choice: wakawatumia
  rationale: Kiwakilishi kinarejelea fedha za muktadha uliotangulia; wingi wa kisarufi wa Kiswahili hufuata ‘fedha,’ ingawa nomino yenyewe haijaongezwa katika mstari.
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: wale waliofanya kazi
  rationale: Kiswahili cha kawaida huepuka urudiaji mzito wa ‘kazi’ bila kupoteza utambulisho wa watu waliokuwa wakitekeleza shughuli hiyo.
- source_word: לִבְדּוֹק
  choice: kwa kukarabati
  rationale: Katika vifungu vya ukarabati wa hekalu, kitenzi hiki humaanisha kurekebisha au kurejesha sehemu zilizoharibika, si kukagua tu.
- source_word: וּלְחַזֵּק
  choice: na kuimarisha
  rationale: Hutoa maana ya kulifanya jengo liwe imara au salama zaidi.
- source_word: הַבָּיִת
  choice: nyumba hiyo
  rationale: Huendeleza neno ‘nyumba’ na kuonyesha wazi kuwa ni nyumba ya Yahweh iliyotajwa awali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limehifadhiwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: ‘Yahweh’ huhifadhi jina binafsi la agano lililo katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo.
- issue: Maana ya ‘nyumba ya Yahweh’
  choice: Kuhifadhi ‘nyumba’ katika mstari na kueleza kuwa ni hekalu katika tanbihi
  alternative: Kutafsiri moja kwa moja ‘hekalu la Yahweh’
  rationale: Hii huhifadhi taswira na urudiaji wa Kiebrania huku tanbihi ikisaidia msomaji wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kukarabati na kuimarisha’ ni maneno ya kawaida katika muktadha wa jengo; muundo umefupishwa kiasi ili kuepuka urudiaji usio wa asili katika Kiswahili.
