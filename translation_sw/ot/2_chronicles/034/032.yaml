base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: sw
  text: Kisha akawasimamisha[a] wote waliokuwako katika Yerusalemu na Benyamini, na wakaaji wa Yerusalemu wakatenda kulingana na agano la Mungu, Mungu wa mababu zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana ya “akawafanya wachukue msimamo,” yaani wajifunge kulishika agano. Kiebrania kinasema kihalisi kwamba aliwafanya wasimame bila kutaja wazi waliposimama au jambo walilojifunga nalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: akawasimamisha
  rationale: Hifili ya עמד kimsingi humaanisha ‘kusababisha wasimame’ au ‘kuwasimamisha.’ Tafsiri hii inadumisha taswira ya kusimama na pia haifungi maana kwa kuamua wazi kwamba tendo hilo lilikuwa kuingia katika agano, ingawa muktadha unaashiria kujifunga kulishika.
- source_word: אֵת כָּל הַנִּמְצָא
  choice: wote waliopatikana
  rationale: Inafuata kwa karibu umbo la Kiebrania la kushirikisha kila aliyepatikana au aliyekuwapo huko, huku ikiwa Kiswahili kinachoeleweka.
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: Yerusalemu na Benyamini
  rationale: Majina ya mahali yameachwa kama yalivyo katika chanzo. ‘Benyamini’ hapa huenda ikamaanisha eneo la kabila hilo, lakini maandishi yenyewe hayajasema ‘eneo.’
- source_word: וַיַּעֲשׂוּ
  choice: wakatenda
  rationale: Katika muundo huu, עשה inaonyesha kutenda au kuishi kwa kupatana na agano, si kufanya tendo lisiloainishwa tu.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: wakaaji wa Yerusalemu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya watu waliokuwa wakiishi Yerusalemu.
- source_word: כִּבְרִית
  choice: kulingana na agano
  rationale: Kiambishi כ־ kinaonyesha kufuata au kupatana na agano; ‘kulingana na’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: la Mungu, Mungu wa mababu zao
  rationale: Kurudiwa kwa ‘Mungu’ kunahifadhi muundo wa maelezo unaomtambulisha Mungu kuwa Mungu wa mababu zao.
theological_decisions:
- issue: Maana ya tendo la Yosia katika kufanywa upya kwa agano
  choice: Kudumisha kauli halisi ya kwamba Yosia aliwasimamisha watu, huku tanbihi ikieleza uwezekano wa maana ya kuwafanya wajifunge kwa agano
  alternative: Kutafsiri moja kwa moja kwamba aliwalazimisha walishike agano au aliwaingiza katika agano
  rationale: Kitenzi cha Kiebrania kina taswira ya kusimamisha, lakini muktadha wa agano unaweza kukipa maana pana ya kuchukua msimamo au kujifunga kulishika. Maandishi hayasemi wazi ‘katika agano,’ hivyo tafsiri kuu haiongezi jambo hilo kama hakika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Akawasimamisha’ huhifadhi utata na taswira ya chanzo; ‘wakatenda kulingana na agano’ ni usemi wa kawaida unaoonyesha utiifu kwa agano bila kuongeza istilahi za kimadhehebu.
