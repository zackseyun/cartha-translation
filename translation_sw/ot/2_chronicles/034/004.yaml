  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: sw
  text: Wakazibomoa mbele yake madhabahu za Mabaali. Naye akazivunja madhabahu za uvumba[a] zilizokuwa juu ya madhabahu hizo. Akavunja Maashera[b], sanamu za kuchongwa, na sanamu za kusubu; akazisaga kuwa unga, kisha akazitawanya juu ya makaburi ya watu waliokuwa wakizitolea dhabihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo za jua.” Maana ya neno la Kiebrania si hakika; huenda linamaanisha nguzo za ibada zilizohusishwa na ibada ya jua.
    reason: lexical_alternative
  - marker: b
    text: Au, “nguzo za Ashera.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: Wakazibomoa
  rationale: Kitenzi נתץ humaanisha kubomoa au kuangusha miundo; umbo la wingi la Kiebrania limehifadhiwa.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Huhifadhi maana ya moja kwa moja kwamba tendo hilo lilifanyika Yosia akiwa hapo.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: madhabahu za Mabaali
  rationale: Wingi בְּעָלִים umehifadhiwa kwa “Mabaali,” ukidokeza maumbo au maonyesho mbalimbali ya ibada ya Baali.
- source_word: הַחַמָּנִים
  choice: madhabahu za uvumba
  rationale: Ni neno lenye maana isiyo hakika; tafsiri hii inafaa muktadha wa marekebisho ya ibada, huku uwezekano wa “nguzo za jua” ukihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: zilizokuwa juu ya madhabahu hizo
  rationale: Kirai hiki kinaeleweka kuwa kinaeleza mahali vilipokuwa vitu vinavyoitwa חמנים, juu ya madhabahu za Mabaali.
- source_word: גִּדֵּעַ
  choice: akazikata
  rationale: גדע ni kukata au kuangusha kwa kukata; “akazikata” ni ya asili na haiongezi maelezo yasiyokuwapo.
- source_word: הָאֲשֵׁרִים
  choice: Maashera
  rationale: Uhawilishaji wa jina unahifadhi utata wa kama neno hilo linamaanisha nguzo za ibada au vitu vingine vilivyohusishwa na mungu wa kike Ashera.
- source_word: הַפְּסִלִים
  choice: sanamu za kuchongwa
  rationale: פסילים ni sanamu za ibada zilizochongwa; tafsiri hii ni sahihi zaidi kuliko neno la jumla “miungu.”
- source_word: הַמַּסֵּכוֹת
  choice: sanamu za chuma cha kuyeyushwa
  rationale: Neno hili linamaanisha sanamu zilizofanyizwa kwa kumimina chuma kilichoyeyushwa.
- source_word: שִׁבַּר וְהֵדַק
  choice: Akavunja … akazisaga kuwa unga
  rationale: Maneno hayo yanaonyesha kuvunja kwa nguvu na kuponda hadi vipande vidogo sana; “kuwa unga” hudhihirisha nguvu ya הֵדַק.
- source_word: וַיִּזְרֹק
  choice: akazitawanya
  rationale: זרק inaweza kumaanisha kutupa au kutawanya; hapa mabaki yaliyosagwa yanatawanywa juu ya makaburi.
- source_word: הַזֹּבְחִים לָהֶם
  choice: watu waliokuwa wakivitolea dhabihu vitu hivyo
  rationale: Huhifadhi uhusiano wa kiwakilishi na vitu vya ibada vilivyotajwa bila kuviita moja kwa moja miungu.
theological_decisions:
- issue: Maana ya הָאֲשֵׁרִים
  choice: Maashera
  alternative: nguzo za Ashera
  rationale: Neno la Kiebrania linaweza kumaanisha vitu mbalimbali vya ibada vilivyohusishwa na Ashera; uhawilishaji haulazimishi maana nyembamba ya nguzo.
- issue: Maana ya הַחַמָּנִים
  choice: madhabahu za uvumba
  alternative: nguzo za jua
  rationale: Maana ya neno hilo haijulikani kwa uhakika. Tafsiri kuu inafuata uwezekano unaofaa muktadha, na tanbihi inahifadhi fasiri inayolihusisha na ibada ya jua.
- issue: Kiwakilishi katika לָהֶם
  choice: vitu hivyo
  alternative: miungu hiyo
  rationale: Kiebrania kina kiwakilishi tu. “Vitu hivyo” hurejelea sanamu na vitu vya ibada vilivyotangulia bila kuongeza kwa uwazi neno “miungu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Mfuatano wa vitenzi na mabadiliko kutoka kwa watendaji wa wingi kwenda kwa Yosia yamehifadhiwa kwa “Wakazibomoa … Naye akazikata.” Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
