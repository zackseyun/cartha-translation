source:
  edition: WLC
  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: sw
  text: Kisha mfalme akasimama mahali pake, akafanya agano mbele za Yahweh la kumfuata Yahweh na kuzishika amri zake, shuhuda zake na sheria zake kwa moyo wake wote na kwa nafsi yake yote, na kuyatekeleza maneno ya agano yaliyoandikwa katika kitabu hiki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika gombo hili.” Neno la Kiebrania linaweza kurejelea hati iliyoandikwa katika umbo la gombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל־עָמְדוֹ
  choice: akasimama mahali pake
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya mfalme kusimama katika mahali pake palipowekwa, bila kudhania jukwaa au muundo maalumu.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: akafanya agano
  rationale: Neno kwa neno ni ‘akakata agano,’ lakini ‘kufanya agano’ ndiyo nahau ya asili na inayoeleweka katika Kiswahili; agano limebaki na hali ya urejeo maalumu ya Kiebrania.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi maana ya tendo rasmi lililofanywa katika uwepo wa Yahweh na hutaja jina la agano moja kwa moja.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: kumfuata Yahweh
  rationale: Nahau ya Kiebrania ni ‘kutembea baada ya’; ‘kumfuata’ huwasilisha kwa Kiswahili cha kawaida uaminifu na utiifu unaomaanishwa bila usemi usio wa asili.
- source_word: לִשְׁמוֹר
  choice: kuzishika
  rationale: Katika muktadha wa agano na sheria, kitenzi hiki humaanisha kutii au kuzingatia kwa uaminifu; ‘kushika’ huhifadhi pia taswira ya chanzo.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: amri zake, shuhuda zake na sheria zake
  rationale: Maneno matatu yametofautishwa badala ya kuunganishwa kuwa visawe, ili kuhifadhi msururu wa kisheria wa Kiebrania.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: kwa moyo wake wote na kwa nafsi yake yote
  rationale: Huhifadhi fomula ya agano na mwangwi wake wa Kumbukumbu la Torati, pamoja na tofauti kati ya ‘moyo’ na ‘nafsi.’
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: kuyatekeleza maneno ya agano
  rationale: ‘Kutekeleza’ hueleza kwa kawaida kutenda yale yaliyoamriwa, huku ‘maneno ya agano’ kikihifadhi usemi wa chanzo badala ya kuufasiri kuwa ‘masharti.’
- source_word: הַסֵּפֶר הַזֶּה
  choice: kitabu hiki
  rationale: ‘Kitabu’ ni tafsiri ya kawaida na inayoeleweka, ingawa neno la Kiebrania linaweza kumaanisha hati iliyoandikwa katika umbo la gombo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nahau ya agano לָלֶכֶת אַחֲרֵי יְהוָה
  choice: kumfuata Yahweh
  alternative: kutembea baada ya Yahweh
  rationale: ‘Kumfuata’ huhifadhi maana ya uaminifu wa agano kwa Kiswahili cha asili; tafsiri ya neno kwa neno ingekuwa ngumu na ingeweza kupotosha.
- issue: Upeo wa kujitoa katika moyo na nafsi
  choice: kwa moyo wake wote na kwa nafsi yake yote
  alternative: kwa moyo wake wote na kwa utu wake wote
  rationale: ‘Nafsi’ huhifadhi mvutano na msamiati wa fomula ya Kiebrania bila kuamua kimbele ikiwa נֶפֶשׁ humaanisha uhai, mtu mzima, au nafsi katika maana finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Msamiati wa agano umehifadhiwa bila lugha ya kimadhehebu. Alama ya tanbihi imewekwa baada ya ‘kitabu hiki,’ mahali panapohusika na maelezo yake ya kileksika.
