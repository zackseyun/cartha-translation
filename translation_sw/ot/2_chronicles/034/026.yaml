base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: sw
  text: 'Lakini kwa mfalme wa Yuda, aliyewatuma kumwuliza Yahwe[a], mtamwambia hivi: “Yahwe, Mungu wa Israeli, asema hivi: Kuhusu maneno uliyoyasikia—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkamtafute Yahwe” au “mkaombe shauri kwa Yahwe.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtafuta na pia kumwuliza ili kupata jibu katika muktadha wa kinabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל
  choice: Lakini kwa
  rationale: Kiunganishi וְ pamoja na אֶל kinaendeleza ujumbe huku kikihamisha maelekezo kwa mfalme; “Lakini kwa” huonyesha mgeuko huo wa hotuba na kuhifadhi maana ya kuelekezwa kwake.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Huu ni muundo wa kawaida wa umilikaji, na tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: aliyewatuma
  rationale: Kitenzi-shirikishi chenye kiambishi bainishi kinamtambulisha mfalme kuwa ndiye aliyewatuma watu hao; kiambishi “-wa-” kinahifadhi wingi wa walengwa.
- source_word: לִדְרֹשׁ בַּיהוָה
  choice: mkamwulize Yahwe
  rationale: Katika muktadha huu דרשׁ בְּ inaeleza kumwendea Mungu ili kupata jibu au shauri. “Kumwuliza” ni Kiswahili cha kawaida kwa tendo hilo, huku tanbihi ikihifadhi maana pana ya kumtafuta au kutaka shauri kwake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: mtamwambia hivi
  rationale: Muundo huu unahifadhi maelekezo kwa wajumbe wengi na fomula ya כֹּה, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahwe ... asema hivi
  rationale: Hii inahifadhi fomula ya kinabii ya kutangaza ujumbe wa Mungu na kuisawazisha kwa mpangilio wa asili wa Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo huu unaomtambulisha Yahwe kwa uhusiano wake na Israeli.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Kuhusu maneno uliyoyasikia—
  rationale: “Kuhusu” huonyesha kwamba maneno hayo yamewekwa mbele kama mada. Alama ya mkato mrefu huhifadhi sentensi iliyosimamishwa, ambayo inaendelea katika mstari unaofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִדְרֹשׁ בַּיהוָה katika muktadha wa kinabii
  choice: mkamwulize Yahwe
  alternative: mkamtafute Yahwe; mkatake shauri kwa Yahwe
  rationale: Muktadha ni wa wajumbe waliotumwa kupata neno la Mungu. “Kumwuliza” huonyesha tendo hilo bila kuondoa uwezekano mpana wa kumtafuta Mungu, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Fomula ya kinabii imetolewa kwa mtindo wa sasa, na mwisho wa mstari umeachwa wazi kwa sababu kisarufi wazo hilo linakamilishwa katika mstari unaofuata.
