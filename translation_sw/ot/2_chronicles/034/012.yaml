base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: sw
  text: Nao watu hao walikuwa wakifanya kazi hiyo kwa uaminifu. Juu yao waliwekwa Yahathi na Obadia, Walawi wa wazao wa Merari, na Zekaria na Meshulamu, wa wazao wa Wakohathi, ili kusimamia[a]. Nao Walawi wote walikuwa stadi katika ala za muziki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuongoza.” Kitenzi cha Kiebrania kinaweza kumaanisha kuongoza au kusimamia kazi.
    reason: lexical_alternative
  - marker: b
    text: Kwa ukaribu zaidi, “wote wenye ufahamu katika ala za wimbo,” yaani, waliokuwa stadi wa kutumia ala za muziki.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: kwa uaminifu
  rationale: Nomino hii imetumiwa kielezi kueleza kwamba watu walitekeleza wajibu wao kwa uaminifu na kutegemeka, si kwamba walifanya kazi kwa imani ya ndani.
- source_word: בַּמְּלָאכָה
  choice: walifanya kazi
  rationale: Katika muktadha huu מְלָאכָה ni kazi ya kukarabati hekalu. Kiswahili hiki ni cha kawaida na huepuka urudiaji usio wa asili wa ‘walifanya kwa uaminifu katika kazi.’
- source_word: מֻפְקָדִים
  choice: Wasimamizi wao walikuwa
  rationale: Umbo la kutendwa linaonyesha kwamba watu hawa walipewa jukumu juu ya wafanyakazi. Muundo huu wa Kiswahili unaeleza wazi uhusiano huo, huku sentensi inayofuata ikihifadhi wazo la kuwekwa katika jukumu.
- source_word: מִן בְּנֵי מְרָרִי
  choice: wa wazao wa Merari
  rationale: ‘Wazao’ huwasilisha uhusiano wa ukoo wa בְּנֵי kwa Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja ‘wana wa Merari.’
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: wa wazao wa Wakohathi
  rationale: הַקְּהָתִים ni jina la ukoo, yaani Wakohathi; ‘wazao wa Wakohathi’ huhifadhi muundo wa ukoo uliopo katika chanzo.
- source_word: לְנַצֵּחַ
  choice: ili kusimamia
  rationale: Katika mazingira ya ukarabati wa hekalu, kitenzi hiki kinamaanisha kuongoza au kusimamia kazi, si lazima kuongoza muziki.
- source_word: כָּל מֵבִין בִּכְלֵי שִׁיר
  choice: Walawi wote waliokuwa stadi wa kupiga ala za muziki
  rationale: Kirai hiki kwa ukaribu ni ‘kila mwenye ufahamu katika ala za wimbo’; hapa ufahamu huo ni ustadi wa kutumia ala za muziki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Mgawanyo wa sentensi umefanywa ili orodha ndefu ya Kiebrania isomeke kwa urahisi; ‘Pia walikuwapo’ linaonyesha kuwa kifungu cha mwisho kinaongeza kundi jingine, ingawa sintaksia ya Kiebrania ni fupi na inaweza kuonekana kuendelea katika mstari unaofuata.
