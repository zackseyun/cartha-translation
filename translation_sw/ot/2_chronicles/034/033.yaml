- from: Yosia akaondoa machukizo yote katika maeneo yote ya Waisraeli,[a] akawafanya wote waliokuwamo Israeli wamtumikie Yahwe Mungu wao.[b] Siku zake zote hawakuacha kumfuata Yahwe, Mungu wa baba zao.[c]
  to: Yosia akaondoa machukizo yote kutoka katika nchi zote zilizokuwa za wana wa Israeli,[a] akawafanya wote waliokuwamo Israeli wamtumikie Yahwe Mungu wao.[b] Kwa siku zake zote, hawakuacha kumfuata Yahwe, Mungu wa baba zao.[c]
  rationale: The revision restores the Hebrew directional sense ('from') and the lands' relation to 'the sons of Israel.' It retains the draft's sound renderings of Josiah's causative action, the people present in Israel, the divine name, and the covenantal phrase 'Mungu wa baba zao.' 'Kwa siku zake zote' makes the temporal phrase idiomatic while retaining its reference to Josiah's days.
