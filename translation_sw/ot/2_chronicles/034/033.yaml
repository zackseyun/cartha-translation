  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: sw
  text: Yosia akaondoa machukizo yote kutoka katika nchi zote zilizokuwa za wana wa Israeli,[a] akawafanya wote waliokuwamo Israeli wamtumikie Yahwe Mungu wao.[b] Kwa siku zake zote, hawakuacha kumfuata Yahwe, Mungu wa baba zao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa karibu zaidi: “kutoka katika nchi zote zilizokuwa za wana wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “akawasababisha wote waliopatikana Israeli wamtumikie Yahwe Mungu wao.”'
    reason: lexical_alternative
  - marker: c
    text: Kiwakilishi “hawa” kinawarejelea wote waliokuwamo Israeli.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיָּסַר
  choice: akaondoa
  rationale: Hifili ya סור hapa ina maana ya kuondoa; “akaondoa” ni ya kawaida na inafaa muktadha wa marekebisho ya kidini.
- source_word: הַתּוֹעֵבוֹת
  choice: machukizo
  rationale: Neno hili lina nguvu ya kimaadili na kidini na hapa linaweza kujumuisha vitu au desturi za ibada ya sanamu.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: katika maeneo yote ya Waisraeli
  rationale: “Maeneo” huwasilisha wingi wa אֲרָצוֹת kwa Kiswahili cha sasa; “Waisraeli” ni namna ya asili ya kueleza בני ישראל bila kufanya kifungu kuwa kizito.
- source_word: וַיַּעֲבֵד
  choice: akawafanya ... wamtumikie
  rationale: Hifili ni ya kisababishi. Tafsiri hii inaonyesha hatua ya Yosia ya kuwafanya watu watumikie bila kuongeza kwa wazi wazo la nguvu za kimwili.
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: wote waliokuwamo Israeli
  rationale: Niphal נִמְצָא katika muktadha huu inaeleza wote waliokuwapo au waliokuwa ndani ya Israeli; “waliokuwamo” ni ya asili kuliko tafsiri halisi ya “waliopatikana.”
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: wamtumikie Yahwe Mungu wao
  rationale: “Kutumikia” huhifadhi maana pana ya utii na ibada ya agano kuliko “kuabudu” peke yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi, si kubadilishwa na cheo “BWANA.” “Yahwe” ni umbo linaloeleweka katika Kiswahili.
- source_word: כָּל יָמָיו
  choice: Siku zake zote
  rationale: Tafsiri ya karibu inayodokeza muda wote wa maisha au utawala wa Yosia bila kuamua kimya kimya kati ya hayo.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: hawakuacha kumfuata Yahwe
  rationale: Kifungu hiki huwasilisha kutogeuka kutoka nyuma ya Yahwe, yaani kuendelea kumfuata kwa uaminifu.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Huhifadhi lugha ya kifamilia ya Kiebrania na kauli ya kawaida ya agano.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kina jina la agano moja kwa moja; kulinakili kama “Yahwe” huhifadhi hadhi yake kama jina binafsi.
- issue: Nguvu ya kisababishi katika וַיַּעֲבֵד
  choice: akawafanya ... wamtumikie
  alternative: akawaongoza ... kumtumikia au akawalazimisha ... kumtumikia
  rationale: “Akawafanya” huhifadhi kisababishi na mamlaka ya kifalme bila kukifanya kuwa ushawishi mwororo wala kuliongezea dai la kulazimisha kimwili.
- issue: Kirejeo cha kiwakilishi katika לֹא סָרוּ
  choice: hawakuacha kumfuata
  alternative: wote waliokuwamo Israeli hawakuacha kumfuata
  rationale: Kitenzi kiko katika wingi na kwa kawaida hurejelea watu waliotajwa; maandishi makuu yanahifadhi kiwakilishi, huku tanbihi ikifafanua uwezekano huo bila kuondoa mshikamano wa sentensi.
- issue: Maneno ya kifamilia בני ישראל na אבותיהם
  choice: Waisraeli / baba zao
  alternative: wana wa Israeli / mababu zao
  rationale: “Waisraeli” ni Kiswahili asilia kwa kundi lote, lakini “baba zao” huhifadhi kwa uwazi zaidi kauli ya kifamilia ya agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umewekwa karibu na Kiebrania lakini misemo inayoweza kusikika kama tafsiri ngumu—hasa “waliopatikana”—imewasilishwa kwa Kiswahili cha kawaida. Alama zote za tanbihi [a]–[c] zimo katika maandishi makuu.
