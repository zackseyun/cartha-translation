base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: sw
  text: Katika mwaka wa nane wa kutawala kwake, alipokuwa bado kijana, alianza kumtafuta Mungu wa Daudi baba yake[a]. Katika mwaka wa kumi na mbili, alianza kuitakasa Yuda na Yerusalemu kwa kuondoa mahali pa juu, vitu vya Ashera[b], sanamu za kuchongwa, na sanamu za metali[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu wa Daudi, mmoja wa mababu zake.” Hapa “baba” ni lugha ya kawaida ya ukoo wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au “nguzo za Ashera.” Neno la Kiebrania linaweza kumaanisha vitu vya ibada vinavyohusishwa na Ashera, mara nyingi nguzo za mbao au miti.
    reason: lexical_alternative
  - marker: c
    text: Au “sanamu za kutupwa” au “sanamu za metali iliyoyeyushwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: Katika mwaka wa nane wa kutawala kwake
  rationale: Muundo huu unaonyesha wazi kwamba ni mwaka wa nane wa utawala wake, kama inavyodokezwa na kishazi cha Kiebrania.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: alipokuwa bado kijana
  rationale: Neno נַעַר linaweza kumaanisha mvulana au kijana; hapa “kijana” linaepuka kumfanya aonekane mtoto mdogo huku “bado” likihifadhi עוֹדֶנּוּ.
- source_word: הֵחֵל לִדְרֹשׁ
  choice: alianza kumtafuta
  rationale: Katika muktadha huu דרשׁ ina maana ya kumwelekea Mungu kwa kujitoa na kumtafuta, si kuuliza habari zake tu.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: Mungu wa Daudi baba yake
  rationale: Huhifadhi lugha ya kawaida ya kifalme kuhusu ukoo, ambapo “baba” humaanisha pia babu wa kale; ufafanuzi umetolewa katika tanbihi.
- source_word: וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Katika mwaka wa kumi na mbili
  rationale: Muktadha unaendeleza hesabu ya miaka ya utawala iliyotajwa mwanzoni mwa aya.
- source_word: הֵחֵל לְטַהֵר
  choice: alianza kuitakasa
  rationale: טהר hapa inahusu kuondoa unajisi wa ibada katika nchi na mji; “kutakasa” huhifadhi uzito wa kidini wa tendo hilo.
- source_word: מִן הַבָּמוֹת
  choice: kwa kuondoa mahali pa juu
  rationale: במות ni maeneo ya ibada yaliyojengwa mara nyingi kwenye miinuko; “mahali pa juu” ni tafsiri ya moja kwa moja inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: וְהָאֲשֵׁרִים
  choice: alama za Ashera
  rationale: Neno la Kiebrania linaweza kutaja miti, nguzo, au vitu vingine vya ibada vinavyohusishwa na Ashera. “Alama” halilazimishi umbo moja maalumu.
- source_word: וְהַפְּסִלִים
  choice: sanamu za kuchongwa
  rationale: פְּסִלִים ni sanamu zilizotengenezwa kwa kuchonga; tafsiri hii ni mahususi na inaeleweka kwa urahisi.
- source_word: וְהַמַּסֵּכוֹת
  choice: sanamu za metali
  rationale: Neno hili linataja sanamu zilizotengenezwa kwa kumimina metali iliyoyeyushwa katika kalibu. Main text uses natural Swahili, while the manufacturing detail is retained in the footnote.
theological_decisions:
- issue: Maana ya lugha ya ukoo katika “Daudi baba yake”
  choice: Kubakiza “baba yake” katika matini kuu
  alternative: “babu yake wa kale” au “mmoja wa mababu zake”
  rationale: Kiebrania kinatumia lugha ya kawaida ya nasaba ya kifalme. Kubakiza “baba” kunadumisha uhusiano wa kifasihi na ufalme wa Daudi bila kudai kwamba Daudi alikuwa mzazi wa moja kwa moja; tanbihi inaeleza maana hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa msomaji wa leo, huku istilahi muhimu za ibada—kama “kutakasa” na “mahali pa juu”—zikihifadhiwa. “Alama za Ashera” imetumiwa ili kutohitimisha bila msingi kwamba אֲשֵׁרִים ilikuwa nguzo tu.
