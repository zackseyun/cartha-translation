  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: sw
  text: Wameitoa[a] fedha iliyopatikana katika nyumba ya Yahweh[b], na wameikabidhi mikononi mwa wasimamizi na mikononi mwa wale wanaofanya kazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wameimimina” au “Wameipakua.” Kitenzi cha Kiebrania hapa kinaweza kumaanisha kutoa fedha kutoka mahali ilipowekwa au kuigawa; katika muktadha huu si lazima kimaanishe kuyeyusha fedha.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Yahweh” hapa ni hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: Wameitoa
  rationale: Katika muktadha huu kitenzi kinaonyesha fedha kutolewa au kumwagwa kutoka mahali ilipokusanywa ili ikabidhiwe, si kuyeyushwa. Kiswahili ‘kuitoa’ ni cha kawaida na huhifadhi wazo la kuitoa fedha bila kudai kitendo halisi cha kuimimina.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: ‘Fedha’ huweza kumaanisha metali ya fedha na pia pesa, hivyo hudumisha upana wa maana wa כֶּסֶף kwa Kiswahili cha kawaida.
- source_word: הַנִּמְצָא
  choice: iliyopatikana
  rationale: Huwakilisha kihusishi cha Niphal kinachoeleza fedha iliyokuwa imepatikana au kukusanywa humo.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: Huhifadhi taswira rasmi ya Kiebrania ‘nyumba ya Yahweh’; katika muktadha huu nyumba hiyo ni hekalu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi YHWH limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּתְּנֻהוּ
  choice: kuikabidhi
  rationale: Ingawa maana ya msingi ni ‘wakaitoa/wakaitia,’ ‘kuikabidhi’ huonyesha kwa kawaida uhamisho wa fedha kwenda chini ya usimamizi wa wahusika waliotajwa.
- source_word: עַל יַד
  choice: mikononi mwa
  rationale: Huhifadhi sitiari ya Kiebrania ya ‘mkono’ huku ikieleweka kwa Kiswahili kama kukabidhi kitu kwa mamlaka au uangalizi wa mtu.
- source_word: הַמֻּפְקָדִים
  choice: wasimamizi
  rationale: Hawa ni watu waliowekwa juu ya fedha au kazi; ‘wasimamizi’ huonyesha jukumu lao bila kuongeza cheo maalumu kisichotajwa.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: wale wanaofanya kazi
  rationale: Tafsiri pana na wazi inayofuata kirai cha Kiebrania bila kuwafanya lazima kuwa mafundi wa aina fulani.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza dai la kimadhehebu.
- issue: Maana ya ‘nyumba ya Yahweh’
  choice: nyumba ya Yahweh katika maandishi, kwa ufafanuzi kuwa ni hekalu
  alternative: hekalu la Yahweh moja kwa moja
  rationale: ‘Nyumba’ huhifadhi istilahi na taswira ya chanzo, huku tanbihi ikizuia mkanganyiko kwa msomaji wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wameitoa’ na ‘kuikabidhi’ hutoa mtiririko wa kawaida wa taarifa ya kiutawala, huku ‘mikononi mwa’ ikihifadhi sitiari ya Kiebrania. Alama zote za tanbihi zimewekwa katika maandishi.
