  text: וּ/בִ/שְׁנַ֨ת שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ לְ/מָלְכ֔/וֹ לְ/טַהֵ֥ר הָ/אָ֖רֶץ וְ/הַ/בָּ֑יִת שָׁ֠לַח אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֜הוּ וְ/אֶת מַעֲשֵׂיָ֣הוּ שַׂר הָ/עִ֗יר וְ֠/אֵת יוֹאָ֤ח בֶּן יֽוֹאָחָז֙ הַ/מַּזְכִּ֔יר לְ/חַזֵּ֕ק אֶת בֵּ֖ית יְהוָ֥ה אֱלֹהָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: sw
  text: Katika mwaka wa kumi na nane wa utawala wake, wakati alipokuwa ameitakasa nchi na nyumba[a], aliwatuma Shafani mwana wa Asalia, Maaseya mkuu wa mji, na Yoa mwana wa Yoahazi, mwandishi wa kumbukumbu, ili waitengeneze[b] nyumba ya Yahwe, Mungu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi na hekalu”; kwa Kiebrania ni “nchi na nyumba.”
    reason: lexical_alternative
  - marker: b
    text: Au “waimarishe”; katika muktadha huu neno hilo linamaanisha kutengeneza au kukarabati jengo la hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: Katika mwaka wa kumi na nane wa utawala wake
  rationale: Hii ni fomula ya kutaja mwaka wa utawala wa mfalme. Kiswahili hutumia kwa kawaida muundo ‘mwaka wa kumi na nane wa utawala wake’; kiunganishi cha simulizi וּ hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: לְטַהֵר
  choice: baada ya kuitakasa
  rationale: Ingawa infinitivi yenye ל inaweza kuonyesha kusudi, muktadha wa simulizi unaonyesha kuwa kazi ya kutakasa ilikuwa imefikia hatua iliyotangulia kutumwa kwa maafisa. ‘Baada ya kuitakasa’ huonyesha uhusiano huo wa wakati bila kuongeza maelezo yasiyokuwamo.
- source_word: הָאָרֶץ וְהַבָּיִת
  choice: nchi na nyumba
  rationale: Tafsiri hii inadumisha maneno halisi na uhusiano kati ya ‘nyumba’ hapa na ‘nyumba ya Yahwe’ baadaye. Tanbihi inaeleza kwamba nyumba inayokusudiwa ni hekalu.
- source_word: שָׁלַח
  choice: aliwatuma
  rationale: Kitenzi ni cha kutuma. Kiambishi cha wingi ‘-wa-’ ni cha asili katika Kiswahili kwa sababu watu watatu ndio waliotumwa.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ
  choice: Shafani mwana wa Asalia
  rationale: Majina yameandikwa kwa namna inayolingana na mfumo wa sauti na tahajia ya Kiswahili.
- source_word: מַעֲשֵׂיָהוּ שַׂר הָעִיר
  choice: Maaseya mkuu wa mji
  rationale: שַׂר ni cheo cha mamlaka. ‘Mkuu wa mji’ ni wazi na hakibani cheo hicho kuwa lazima sawa kabisa na cheo cha kisasa cha gavana.
- source_word: יוֹאָח בֶּן יוֹאָחָז הַמַּזְכִּיר
  choice: Yoa mwana wa Yoahazi, mwandishi wa kumbukumbu
  rationale: הַמַּזְכִּיר ni afisa wa kifalme aliyehusika na kumbukumbu au taarifa rasmi. ‘Mwandishi wa kumbukumbu’ huwasilisha jukumu hilo kwa msomaji wa kawaida.
- source_word: לְחַזֵּק
  choice: ili waitengeneze
  rationale: Maana ya msingi ni ‘kuimarisha,’ lakini inapotumiwa kuhusu jengo humaanisha kulikarabati au kulirejesha katika hali nzuri. ‘Waitengeneze’ ni Kiswahili cha kawaida kinachofaa katika muktadha huu.
- source_word: בֵּית יְהוָה אֱלֹהָיו
  choice: nyumba ya Yahwe, Mungu wake
  rationale: Muundo huu huhifadhi ‘nyumba,’ jina la Mungu יְהוָה, na uhusiano wa ‘Mungu wake.’ Koma husaidia kuonyesha kwamba ‘Mungu wake’ anamfafanua Yahwe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina maalumu la agano, tetragramatoni, si cheo cha kawaida. ‘Yahwe’ hulihifadhi kama jina na huepuka kulibadili kuwa cheo.
- issue: Uhusiano wa לְטַהֵר na tendo la kutuma
  choice: baada ya kuitakasa
  alternative: ili kuitakasa
  rationale: Sarufi inaweza kwa nje kuruhusu wazo la kusudi, lakini mfuatano wa simulizi na hatua ya utakaso iliyotajwa kabla huunga mkono maana ya wakati. Tafsiri haifanyi utakaso kuwa kazi waliyopewa maafisa wa ukarabati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi inadumisha mtiririko wa simulizi, vyeo vya maafisa vinaelezwa kwa lugha ya kawaida, na alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
