base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: sw
  text: Nao walipokuwa wakitoa fedha iliyokuwa imeletwa ndani ya nyumba ya Yahwe, kuhani Hilkia akapata Kitabu cha Sheria ya Yahwe kwa mkono wa Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa” au “iliyotolewa kupitia Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: Nao walipokuwa wakitoa
  rationale: 'Muundo wa בְּ pamoja na kitenzi-jina na kiambishi cha nafsi ya tatu wingi unaonyesha wakati au tendo linaloendelea: ‘walipokuwa wakitoa.’'
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: כֶּסֶף inaweza kumaanisha ‘fedha’ kama madini au pesa; ‘fedha’ huhifadhi upana huo na inafaa katika muktadha wa michango ya hekalu.
- source_word: הַמּוּבָא בֵּית יְהוָה
  choice: iliyokuwa imeletwa ndani ya nyumba ya Yahwe
  rationale: Umbo tendwa la בוא lina maana ya kitu kilicholetwa ndani; ‘nyumba ya Yahwe’ huhifadhi taswira halisi ya Kiebrania bila kuzuia maana ya hekalu.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: kuhani Hilkia
  rationale: Huu ni mpangilio wa kawaida na wa asili wa cheo pamoja na jina katika Kiswahili.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: Kitabu cha Sheria ya Yahwe
  rationale: סֵפֶר inaweza kuwa kitabu au hati-kunjo, na תּוֹרָה ni mafundisho au sheria; tafsiri hii inafuata matumizi yaliyozoeleka katika muktadha huu wa agano.
- source_word: בְּיַד מֹשֶׁה
  choice: kilichotolewa kupitia Musa
  rationale: Nahau halisi ni ‘kwa mkono wa Musa’ na inaonyesha uwakala au upatanishi; ‘kilichotolewa kupitia Musa’ ni Kiswahili cha asili kinachowasilisha maana hiyo bila kudokeza kwamba mkono wake halisi ndio uliopatikana.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano YHWH lenyewe; ‘Yahwe’ hulitofautisha na cheo ‘Bwana’ na kulihifadhi kama jina maalumu.
- issue: Uhusiano wa Sheria na Musa katika בְּיַד מֹשֶׁה
  choice: kilichotolewa kupitia Musa
  alternative: kwa mkono wa Musa
  rationale: Tafsiri hii inahifadhi wazo la Musa kuwa mpatanishi bila kuamua kwa upana zaidi masuala ya utunzi ambayo nahau yenyewe haiyafafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
