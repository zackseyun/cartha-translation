reference: 2 Chronicles 34:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: sw
  text: Nendeni mkamwulize Yahwe kwa ajili yangu na kwa ajili ya wale waliosalia katika Israeli na Yuda kuhusu maneno ya kitabu[a] kilichopatikana. Kwa maana ghadhabu kubwa ya Yahwe imemwagwa juu yetu, kwa sababu baba zetu[b] hawakulishika neno la Yahwe kwa kutenda kulingana na yote yaliyoandikwa katika kitabu hiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hati-kunjo.” Neno la Kiebrania linaweza kumaanisha kitabu au hati-kunjo.
    reason: lexical_alternative
  - marker: b
    text: Au “mababu zetu.” Kiebrania kinasema kihalisi “baba zetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: mkamwulize Yahwe
  rationale: Katika muktadha huu wa amri ya mfalme, kitenzi דרשׁ kinamaanisha kutafuta jibu au mwongozo kutoka kwa Mungu. “Mkamwulize” ni Kiswahili cha kawaida kinachoonyesha kusudi hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kuwa “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: בַּעֲדִי
  choice: kwa ajili yangu
  rationale: Kirai hiki kinaonyesha kuwa uchunguzi ufanywe kwa niaba au manufaa ya mfalme; “kwa ajili yangu” ni cha kawaida na sahihi.
- source_word: הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: wale waliosalia katika Israeli na Yuda
  rationale: הנשאר hurejelea watu waliobaki. “Wale waliosalia” ni wazi kwa msomaji wa kawaida huku kikidumisha wazo la mabaki.
- source_word: עַל דִּבְרֵי הַסֵּפֶר
  choice: kuhusu maneno ya kitabu
  rationale: עַל hapa huanzisha jambo linalouliziwa, na דִּבְרֵי ni “maneno.” Tafsiri hii inafuata muundo na maana ya Kiebrania.
- source_word: הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: kitabu kilichopatikana
  rationale: סֵפֶר linaweza kumaanisha kitabu au hati-kunjo. “Kitabu” ni neno la kawaida la Kiswahili; umbo la kale limeonyeshwa katika tanbihi.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: ghadhabu ya Yahwe ... ni kubwa
  rationale: חֵמָה ni hasira kali au ghadhabu. Mpangilio huu ni wa asili katika Kiswahili na unadumisha mkazo kwamba ghadhabu hiyo ni kubwa.
- source_word: נִתְּכָה בָנוּ
  choice: iliyomwagwa juu yetu
  rationale: נתך katika kauli hii hutoa taswira ya ghadhabu inayomwagwa; usemi huo unaeleweka pia katika Kiswahili.
- source_word: אֲבוֹתֵינוּ
  choice: baba zetu
  rationale: Kiebrania kinasema kihalisi “baba zetu.” Tafsiri hiyo imedumishwa katika matini, huku maana pana ya mababu ikielezwa katika tanbihi.
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: hawakulishika neno la Yahwe
  rationale: שׁמר pamoja na “neno” humaanisha kulishika au kulitii. “Kulishika neno” hudumisha sitiari ya chanzo na linafafanuliwa na tendo linalofuata.
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב
  choice: kwa kutenda yote yaliyoandikwa
  rationale: 'Kishazi hiki kinaonyesha maana ya kulishika neno: kutekeleza yote yaliyoandikwa. Kiswahili hiki ni wazi bila kuongeza ufafanuzi usiotajwa.'
- source_word: עַל־הַסֵּפֶר הַזֶּה
  choice: katika kitabu hiki
  rationale: Ingawa עַל kwa msingi ni “juu ya,” Kiswahili cha kawaida husema jambo limeandikwa “katika kitabu.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֲבוֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu
  rationale: Matini ya Kiebrania ina umbo la kiume “baba zetu.” Hilo limedumishwa katika matini bila kuficha uwezekano wa maana pana ya vizazi vilivyotangulia.
- issue: Uhusiano kati ya kulishika neno na kutenda yaliyoandikwa
  choice: hawakulishika neno la Yahwe kwa kutenda yote yaliyoandikwa
  alternative: hawakulitii neno la Yahwe, yaani, hawakutenda yote yaliyoandikwa
  rationale: Muundo wa Kiebrania unaunganisha kutenda na kulishika neno bila kulazimisha ikiwa infinitivu ni ya kusudi, maudhui, au matokeo. “Kwa kutenda” hudumisha uhusiano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, lakini uhusiano wa sababu umehifadhiwa kwa “Kwa maana” na “kwa sababu.” “Mkamwulize” limetumiwa badala ya usemi mzito zaidi wa kitaalamu ili kuonyesha uchunguzi wa kiroho kwa lugha ya kawaida.
