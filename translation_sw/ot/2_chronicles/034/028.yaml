  text: הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ אֶל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁ֨ר אֲנִ֥י מֵבִ֛יא עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹשְׁבָ֑י/ו וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: sw
  text: “Tazama[a], nitakukusanya kwa baba zako, nawe utakusanywa mahali pako pa maziko[b] kwa amani[c]. Macho yako hayataona maafa yote ninayoleta juu ya mahali hapa na juu ya wakazi wake.” Nao wakamrudishia mfalme ujumbe huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sikiliza.” Neno la Kiebrania linatanguliza tamko kwa msisitizo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno halisi ni “makaburi yako,” huenda kikirejelea mahali pa maziko ya mababu.
    reason: source_form
  - marker: c
    text: “Kwa amani” hapa huenda ikamaanisha kwamba Yosia angekufa kabla ya kuyaona maafa yaliyokuwa yanakuja, kama kishazi kinachofuata kinavyoeleza; si lazima imaanishe kwamba kifo chake chenyewe hakikuwa cha vurugu.
    reason: cross_reference
lexical_decisions:
- source_word: הִנְנִי
  choice: Tazama, nitakukusanya
  rationale: “Tazama” huhifadhi kiashiria cha msisitizo katika tamko la Mungu, huku wakati ujao ukitoa maana ya tendo linalokaribia kutokea bila kufanya Kiswahili kisikike cha kulazimishwa.
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: nitakukusanya uende kwa baba zako
  rationale: Huhifadhi sitiari ya Kiebrania ya kukusanywa kwa mababu wakati wa kufa. “Uende” huweka uhusiano wa kuelekea kwao wazi katika Kiswahili.
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: utakusanywa na kuwekwa katika kaburi lako
  rationale: “Utakusanywa” huhifadhi mwangwi wa kitenzi kilichotangulia, na “kuwekwa katika kaburi lako” hufanya maana ya maziko iwe wazi na ya kawaida katika Kiswahili. Umoja “kaburi” ni wa kawaida kwa mtu mmoja; wingi wa Kiebrania umeelezwa katika tanbihi.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Huhifadhi upana wa שָׁלוֹם bila kudai kwamba kifo chenyewe hakitakuwa cha vurugu; kishazi kinachofuata kinaeleza kwamba Yosia hataona maafa yajayo.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Macho yako hayataona
  rationale: Huhifadhi usemi halisi na wenye mkazo wa Kiebrania badala ya kuufupisha kuwa “hutaona.”
- source_word: בְּכֹל הָרָעָה
  choice: maafa yote
  rationale: Katika muktadha wa hukumu, רָעָה ni balaa au maafa yanayoletwa, si uovu wa kimaadili.
- source_word: אֲנִי מֵבִיא
  choice: ninayoleta
  rationale: Hutoa hali ya tendo lililoamuliwa na linalokuja, kama ilivyo katika umbo la kitenzi cha Kiebrania.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: juu ya mahali hapa na juu ya wakazi wake
  rationale: Ni tafsiri iliyo wazi ya eneo na watu wanaokaliwa na hukumu, huku ikihifadhi urudiaji wa עַל.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: Nao wakamrudishia mfalme ujumbe huo
  rationale: Nahau hii humaanisha kurudi na jibu au taarifa kwa mfalme; “ujumbe huo” ni Kiswahili cha kawaida na chenye maana sahihi.
theological_decisions:
- issue: Maana ya ahadi “kwa amani” ikilinganishwa na kifo cha baadaye cha Yosia vitani
  choice: Kauli imeachwa kuwa “kwa amani,” huku tanbihi ikionyesha kwamba muktadha unaikazia Yosia kutoyaona maafa yaliyotangazwa.
  alternative: Kuitafsiri kana kwamba inatabiri waziwazi kifo kisicho na vurugu au maziko ya amani pekee.
  rationale: Kishazi kinachofuata kinaunganisha ahadi hiyo na kutoyaona maafa. Tafsiri haiondoi mvutano wa simulizi wala kulazimisha upatanisho usiosemwa na mstari.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sitiari kuu ya Kiebrania ya “kukusanywa kwa baba” imehifadhiwa, huku usemi kuhusu kaburi ukifanywa wa kawaida zaidi katika Kiswahili. Marekebisho yanahitajika katika tanbihi c: kusoma “hakikuwa” badala ya hitilafu ya uchapaji “hak kingekuwa” ikiwa mfumo wa uchapishaji haurudishi maandishi yaliyowasilishwa.'
