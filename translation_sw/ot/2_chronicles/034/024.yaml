base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: sw
  text: 'Yahwe asema hivi: “Tazama, ninaleta maafa juu ya mahali hapa na juu ya wakazi wake—laana zote[a] zilizoandikwa katika kitabu[b], ambacho wamekisoma mbele ya mfalme wa Yuda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “laana zote za kiapo.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha “hati-kunjo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu kama jina maalumu badala ya kulibadili kuwa cheo; umbo ‘Yahwe’ ni la kawaida na linalosomeka katika Kiswahili.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Ni usemi wa kawaida wa wajumbe wa kinabii, wenye hadhi lakini unaoeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: הִנְנִי
  choice: Tazama, nina-
  rationale: ‘Tazama’ linatunza nguvu ya kuteka usikivu na uzito wa tangazo la Kiebrania.
- source_word: מֵבִיא רָעָה
  choice: ninaleta maafa
  rationale: Katika muktadha huu רָעָה ni hukumu yenye madhara, si uovu wa kimaadili; ‘maafa’ yanaonyesha janga kali linalokuja.
- source_word: הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Ni tafsiri ya moja kwa moja isiyoongeza kwamba mahali hapo ni Yerusalemu au Yuda, ingawa muktadha unaweza kuelekeza huko.
- source_word: יוֹשְׁבָיו
  choice: wakazi wake
  rationale: Ni Kiswahili cha kawaida kinachoonyesha watu wanaokaa mahali hapo pamoja na kiambishi cha umilikaji.
- source_word: אֵת כָּל הָאָלוֹת
  choice: laana zote
  rationale: ‘Laana’ ni wazi kwa msomaji wa kawaida na inafaa kwa adhabu za agano; maana mahsusi ya laana zinazoambatana na kiapo imehifadhiwa katika tanbihi.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: zilizoandikwa katika kitabu hiki
  rationale: ‘Katika kitabu’ ni Kiswahili asilia kwa yaliyomo katika hati. ‘Hiki’ kinarejelea hati iliyotajwa na inayosomwa katika muktadha.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: ambacho wamekisoma mbele ya
  rationale: Inatunza kitenzi tendi cha wingi na uhusiano wa tukio la kusoma lililokamilika na tangazo la sasa.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Ni tafsiri wazi na ya kawaida ya muundo wa Kiebrania.
theological_decisions:
- issue: Maana ya רָעָה katika hukumu ya Mungu
  choice: maafa
  alternative: uovu; msiba
  rationale: Muktadha unazungumzia madhara ya hukumu ya agano. ‘Maafa’ hayamdokezi Mungu kama mtendaji wa uovu wa kimaadili, lakini yanatunza ukali wa hukumu.
- issue: Maana ya אָלוֹת katika muktadha wa agano
  choice: laana
  alternative: laana za kiapo
  rationale: ‘Laana’ ni ya asili zaidi katika matini kuu; tanbihi inahifadhi uwezekano wa maana mahsusi ya adhabu zilizoidhinishwa kwa kiapo cha agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya kinabii iliyo na hadhi lakini inayoeleweka. ‘Tazama’ limetumiwa kwa uzito wa tangazo, huku ‘maafa,’ ‘wakazi,’ na ‘kitabu’ yakiwa maneno ya sasa na ya kawaida.
