source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: sw
  text: Kwa sababu wameniacha na wamefukiza uvumba kwa miungu mingine[a], ili wanikasirishe kwa kazi zote za mikono yao[b], ghadhabu yangu itamwagwa juu ya mahali hapa, wala haitazimwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miungu ya kigeni.” Kiebrania kinasema kihalisi zaidi “miungu mingine.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “kazi za mikono yao” unaweza kumaanisha kwa upana vitu walivyotengeneza au matendo yao, hasa sanamu zilizotengenezwa na wanadamu na ibada zinazohusiana nazo.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: Kwa sababu
  rationale: Nahau hii inaonyesha sababu ya hukumu inayotangazwa; “Kwa sababu” ni ya kawaida na huhifadhi uhusiano wa kisababishi.
- source_word: עֲזָבוּנִי
  choice: wameniacha
  rationale: Kitenzi עזב humaanisha kuacha au kutelekeza; “wameniacha” ni cha asili katika Kiswahili na kina uzito wa kuvunja uaminifu kwa Mungu.
- source_word: וַיַּקְטִירוּ
  choice: na kuifukizia uvumba
  rationale: Katika muktadha wa ibada, Hiphil ya קטר hurejelea hasa kufukiza uvumba au kutoa sadaka ya moshi. Muundo huu unaonyesha kwamba miungu mingine ndiyo iliyoelekezewa uvumba.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: אֲחֵרִים kimsingi ni “mingine”; tafsiri hii huhifadhi usemi wa moja kwa moja wa Kiebrania kuhusu ibada ya sanamu.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: ili wanikasirishe
  rationale: Muundo unaweza kueleza kusudi au matokeo. “Ili wanikasirishe” huhifadhi mvutano huo kwa kiasi kikubwa bila kuamua kwamba walikuwa na nia ya makusudi pekee.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: kwa kazi zote za mikono yao
  rationale: Usemi wa Kiebrania umehifadhiwa kwa kuwa unaweza kumaanisha kwa upana vitu walivyotengeneza au matendo yao, hasa sanamu na ibada zake.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: ghadhabu yangu itamwagwa
  rationale: נתך pamoja na חֵמָה hutoa taswira ya ghadhabu inayomwagwa. “Ghadhabu” inafaa kwa lugha nzito ya hukumu.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: juu ya mahali hapa
  rationale: Hukumu inaelekezwa dhidi ya mahali hapa; “juu ya” pia inaendana na taswira ya kumwagwa.
- source_word: וְלֹא תִכְבֶּה
  choice: wala haitazimwa
  rationale: כבה hutumiwa kuhusu kuzimwa kwa moto; tafsiri hii huhifadhi sitiari ya ghadhabu kama moto usiozimwa.
theological_decisions:
- issue: Lugha ya hukumu ya Mungu
  choice: ghadhabu yangu itamwagwa juu ya mahali hapa, wala haitazimwa
  alternative: hasira yangu kali itamwagwa juu ya mahali hapa, wala haitakoma
  rationale: Tafsiri iliyochaguliwa huhifadhi ghadhabu ya hukumu pamoja na taswira mbili za kumwagwa na kuzimwa, bila kuilegeza au kuiwekea mfumo wa mafundisho usiotajwa katika mstari.
- issue: Kusudi au matokeo katika לְמַעַן הַכְעִיסֵנִי
  choice: ili wanikasirishe
  alternative: hivyo wakinikasirisha
  rationale: לְמַעַן inaweza kuonyesha kusudi au matokeo. “Ili” ni kifupi na cha kawaida, lakini tafsiri haipaswi kulazimisha dai kwamba kila mwabudu alikuwa na lengo la kisaikolojia la kumkasirisha Mungu.
- issue: Rejeo la Mungu katika usemi wa nafsi ya kwanza
  choice: -ni / yangu
  alternative: BWANA
  rationale: Viambishi vya nafsi ya kwanza katika Kiebrania vinapaswa kubaki kama usemi wa moja kwa moja wa Mungu; hakuna sababu ya kuvibadili kuwa jina la Mungu ndani ya kauli hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Kuifukizia uvumba miungu” ni usemi wa kibiblia lakini bado wazi; “ghadhabu” huhifadhi uzito wa lugha ya hukumu. Alama zote za tanbihi zimewekwa katika matini.
