base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: sw
  text: Ikawa, mfalme aliposikia maneno ya Sheria[a], alirarua mavazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafundisho.” Neno la Kiebrania torah linaweza kumaanisha mafundisho kwa upana zaidi, ingawa hapa linahusu sheria ya agano iliyokuwa ikisomwa mbele ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Muundo huu unaendeleza simulizi na kutambulisha tukio linalofuata bila kutumia lugha nzito au ya kizamani.
- source_word: כִּשְׁמֹעַ
  choice: aliposikia
  rationale: Kiambishi כ pamoja na kitenzi-jina cha שמע kinaonyesha wakati; “aliposikia” ni Kiswahili cha kawaida na huhifadhi mfuatano wa tukio.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Huhifadhi cheo kilichotumiwa katika Kiebrania badala ya kuongeza jina la Yosia kutoka katika muktadha.
- source_word: דִּבְרֵי
  choice: maneno ya
  rationale: Katika muktadha huu דבר hurejelea yaliyosemwa au kusomwa; “maneno ya” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַתּוֹרָה
  choice: Sheria
  rationale: תורה inaweza kumaanisha mafundisho kwa upana, lakini hapa inahusu maandishi ya agano yenye masharti ya kisheria yaliyosomwa mbele ya mfalme. “Sheria” huwasilisha maana hiyo kwa uwazi, huku tanbihi ikihifadhi uwezekano mpana wa neno hilo.
- source_word: וַיִּקְרַע
  choice: akararua
  rationale: קרע humaanisha kurarua vazi, tendo lililotumika kuonyesha huzuni, dhiki, au toba; “akararua” ni sahihi na ya asili katika simulizi.
- source_word: בְּגָדָיו
  choice: mavazi yake
  rationale: בגד ni neno la jumla kwa nguo; “mavazi yake” ni la heshima na haliongezi wazo mahususi la majoho ya kifalme.
theological_decisions:
- issue: Tafsiri ya תורה katika muktadha wa mageuzi ya Yosia
  choice: Sheria
  alternative: mafundisho; Torati
  rationale: Mstari unahusu yaliyomo katika kitabu cha agano kilichopatikana na kusomwa. “Sheria” huonyesha nguvu yake ya kimaagano na kisheria bila kudai kwamba maana pana ya תורה haiwezekani; maana hiyo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni mfupi na wa asili; “mavazi” huepuka kubainisha aina ya nguo ambayo Kiebrania hakuitaji.
