source:
  edition: WLC
  text: וַ/יָּבֵ֨א שָׁפָ֤ן אֶת הַ/סֵּ֨פֶר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֨שֶׁב ע֧וֹד אֶת הַ/מֶּ֛לֶךְ דָּבָ֖ר לֵ/אמֹ֑ר כֹּ֛ל אֲשֶׁר נִתַּ֥ן בְּ/יַד עֲבָדֶ֖י/ךָ הֵ֥ם עֹשִֽׂים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: sw
  text: Ndipo Shafani akamletea mfalme kile kitabu, naye pia akampa mfalme taarifa, akisema, “Yote yaliyokabidhiwa mikononi mwa watumishi wako, wanayafanya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yote yaliyowekwa mikononi mwa watumishi wako, wanayafanya.” Nahau ya Kiebrania kwa neno ni “yaliyowekwa katika mkono wa watumishi wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: akamletea
  rationale: Hifili ya בוא inaonyesha kwamba Shafani alikipeleka kitabu kwa mfalme; ‘akamletea’ ni ya kawaida na huhifadhi mwelekeo wa tendo kwa mfalme.
- source_word: הַסֵּפֶר
  choice: kile kitabu
  rationale: סֵפֶר inaweza kuwa kitabu, hati, au gombo. ‘Kile kitabu’ ni lugha ya kawaida na huonyesha kwamba ni kitabu kilichotajwa tayari bila kuamua umbo lake la kimwili.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: naye pia akampa mfalme taarifa
  rationale: Nahau ya שוב pamoja na דָּבָר hapa ina maana ya kurudisha habari au kutoa taarifa. Tafsiri hii ni ya asili katika Kiswahili, huku ‘pia’ ikiwakilisha עוֹד.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni kianzishi cha kawaida cha maneno yanayonukuliwa moja kwa moja.
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: Yote yaliyokabidhiwa mikononi mwa watumishi wako
  rationale: בְּיַד ni nahau ya kukabidhi kitu chini ya mamlaka au uangalizi wa mtu. ‘Yaliyokabidhiwa mikononi mwa’ huhifadhi picha ya Kiebrania na kubaki wazi kwa msomaji wa Kiswahili.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazingira ya kifalme neno hili linawahusu watumishi au maafisa wa mfalme; ‘watumishi’ haliongezi kwa lazima wazo la utumwa wala cheo rasmi kisichotajwa.
- source_word: הֵם עֹשִׂים
  choice: wanayafanya
  rationale: Kiwakilishi cha msisitizo pamoja na umbo endelevu kinaonyesha kwamba wao wenyewe wanaendelea kutekeleza mambo hayo. ‘Wanayafanya’ ni ya kawaida na hurejelea ‘yote’ bila kuongeza wazo jipya.
