  text: וַֽ/יִּתְּנ֗וּ לֶ/חָֽרָשִׁים֙ וְ/לַ/בֹּנִ֔ים לִ/קְנוֹת֙ אַבְנֵ֣י מַחְצֵ֔ב וְ/עֵצִ֖ים לַֽ/מְחַבְּר֑וֹת וּ/לְ/קָרוֹת֙ אֶת הַ/בָּ֣תִּ֔ים אֲשֶׁ֥ר הִשְׁחִ֖יתוּ מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: sw
  text: Nao wakawapa mafundi na wajenzi fedha hizo ili wanunue mawe ya machimboni[a] na mbao kwa ajili ya kazi ya kuunganisha[b] na kuezekea[c] majengo ambayo wafalme wa Yuda walikuwa wameyaharibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe yaliyochongwa.” Kirai cha Kiebrania kinamaanisha mawe yaliyotolewa machimboni kwa ajili ya ujenzi.
    reason: lexical_alternative
  - marker: b
    text: Maana ya neno la Kiebrania lililotafsiriwa “kazi ya kuunganisha” si hakika; huenda likamaanisha viungio, kazi ya kuunganisha, au vipengele vya muundo wa jengo.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa ajili ya boriti” au “kufunika.” Kitenzi cha Kiebrania kinaweza kumaanisha kuezeka au kufunika jengo kwa boriti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: wakawapa ... fedha hizo
  rationale: Kitenzi kinamaanisha ‘kutoa/kumpa.’ Yambwa ‘fedha hizo’ limewekwa wazi kutokana na muktadha uliotangulia, ambapo fedha ndizo zinazogawiwa kwa ajili ya ukarabati.
- source_word: חָרָשִׁים
  choice: mafundi
  rationale: Neno hili linawahusu wafanyakazi wenye ustadi kwa maana pana; ‘mafundi’ ni la kawaida na halifungi maana katika ufundi mmoja tu.
- source_word: בֹּנִים
  choice: wajenzi
  rationale: Ni jina la mtendaji linalotokana na kitenzi ‘kujenga’; ‘wajenzi’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: לִקְנוֹת
  choice: ili wanunue
  rationale: Infinitivu inaonyesha kusudi la kuwapa fedha; muundo ‘ili wanunue’ ni wa kawaida katika Kiswahili.
- source_word: אַבְנֵי מַחְצֵב
  choice: mawe ya machimboni
  rationale: Kirai kinamaanisha mawe yaliyotolewa machimboni kwa ujenzi. Tafsiri hii haidai kwa lazima kwamba yalikuwa tayari yamechongwa kabisa.
- source_word: עֵצִים
  choice: mbao
  rationale: Katika muktadha wa ujenzi, ‘mbao’ hueleza vizuri zaidi nyenzo za ujenzi kuliko ‘miti’ au ‘kuni.’
- source_word: לַמְחַבְּרוֹת
  choice: kwa ajili ya kazi ya kuunganisha
  rationale: Neno la Kiebrania si hakika, lakini linaelekea kuhusiana na kuunganisha, viungio, au mfumo wa kushikiza. Tafsiri hii huhifadhi maana ya msingi bila kubainisha kupita kiasi sehemu fulani ya jengo.
- source_word: וּלְקָרוֹת
  choice: na kuezekea
  rationale: Kitenzi katika muktadha wa ujenzi kinaweza kumaanisha kufunika au kuweka paa kwa boriti; ‘kuezekea’ huonyesha kazi inayokusudiwa kwa lugha ya kawaida.
- source_word: הַבָּתִּים
  choice: majengo
  rationale: Ingawa neno linaweza kumaanisha ‘nyumba,’ hapa linahusu majengo katika mazingira ya hekalu; ‘majengo’ huepuka kuwafanya wasomaji wafikirie makao ya kawaida.
- source_word: הִשְׁחִיתוּ
  choice: walikuwa wameyaharibu
  rationale: Hifili ya kitenzi hiki inaweza kumaanisha kuharibu, kuangamiza, au kufanya kitu kiharibike. ‘Walikuwa wameyaharibu’ inafaa katika muktadha wa ukarabati bila kudai uharibifu kamili.
- source_word: מַלְכֵי יְהוּדָה
  choice: wafalme wa Yuda
  rationale: Ni tafsiri ya moja kwa moja ya kirai cha Kiebrania.
