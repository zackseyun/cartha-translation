source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: sw
  text: Kisha wakamwendea Hilkia, kuhani mkuu, wakamkabidhi fedha zilizokuwa zimeletwa katika nyumba ya Mungu. Fedha hizo zilikuwa zimekusanywa na Walawi waliokuwa walinzi wa kizingiti[a], kutoka kwa Manase na Efraimu, kutoka kwa mabaki yote ya Israeli, na kutoka kwa watu wote wa Yuda na Benyamini na wakazi wa Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walinzi wa mlango” au “walinda-lango”; kihalisi, “walinzi wa kizingiti.”
    reason: Mbadala wa kileksika unaeleza kazi inayoweza kukusudiwa huku matini kuu ikihifadhi picha halisi ya Kiebrania.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kisha wakamwendea
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; “kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “wakamwendea” huwakilisha kuja kwa Hilkia kwa ufasaha.
- source_word: חִלְקִיָּהוּ
  choice: Hilkia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: kuhani mkuu
  rationale: Hili ndilo jina la kawaida na sahihi la cheo hiki cha ukuhani.
- source_word: וַיִּתְּנוּ
  choice: wakamkabidhi
  rationale: Katika muktadha wa kupeleka fedha kwa Hilkia, “wakamkabidhi” hueleza kwa kawaida tendo la kumpa fedha bila kubadili maana.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: Neno la Kiebrania linaweza kumaanisha madini ya fedha au pesa; hapa linahusu hazina iliyokusanywa, na “fedha” huhifadhi maana hizo kwa Kiswahili.
- source_word: הַמּוּבָא
  choice: zilizokuwa zimeletwa
  rationale: Kauli tendwa na hali ya tendo lililotangulia kukabidhiwa zimehifadhiwa.
- source_word: בֵית אֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Tafsiri hii huhifadhi tamathali ya moja kwa moja ya Kiebrania badala ya kuibadili kuwa “hekalu,” ingawa hilo ndilo jengo linalokusudiwa.
- source_word: אָסְפוּ
  choice: zilikuwa zimekusanywa
  rationale: Kauli hii inaonyesha kwamba ukusanyaji ulitangulia kukabidhiwa kwa fedha.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la kundi hili la kikabila na kihuduma katika Kiswahili.
- source_word: שֹׁמְרֵי הַסַּף
  choice: walinzi wa kizingiti
  rationale: Tafsiri hii huhifadhi picha halisi ya Kiebrania; maana ya kiutendaji, “walinzi wa mlango” au “walinda-lango,” imetajwa katika tanbihi.
- source_word: מִיַּד
  choice: kutoka kwa
  rationale: Nahau ya Kiebrania “kutoka mkononi mwa” hapa humaanisha kupokea au kukusanya kutoka kwa watu; “kutoka kwa” ni ya kawaida na sahihi.
- source_word: מְנַשֶּׁה וְאֶפְרַיִם
  choice: Manase na Efraimu
  rationale: Majina ya makabila au maeneo yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: mabaki yote ya Israeli
  rationale: “Mabaki” huhifadhi wazo la wale waliosalia na pia mwangwi wa kitheolojia unaowezekana bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Dhana inayowezekana ya kitheolojia katika שְׁאֵרִית (“mabaki”)
  choice: mabaki yote ya Israeli
  alternative: watu wengine wote wa Israeli / waliosalia wote wa Israeli
  rationale: Neno “mabaki” linaweza kutaja tu watu waliosalia wa makabila ya kaskazini, lakini pia linaweza kuwa na mwangwi wa agano. Tafsiri imehifadhi uwezekano huo bila kuamua kwamba hapa lazima liwe istilahi maalumu ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi mbili zimetumiwa kupunguza uzito wa kishazi kirefu cha Kiebrania bila kupoteza uhusiano wa fedha na ukusanyaji wake. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “walinzi wa kizingiti.”
