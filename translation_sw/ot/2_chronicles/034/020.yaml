  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: sw
  text: Mfalme akawaamuru Hilkia, Ahikamu mwana wa Shafani, Abdoni mwana wa Mika[a], Shafani mwandishi, na Asaya, mtumishi wa mfalme[b], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kimasoreti yanasema, “Abdoni mwana wa Mika.” Sehemu inayolingana katika 2 Wafalme 22:12 inasema, “Akbori mwana wa Mikaya.”
    reason: textual_variant
  - marker: b
    text: Au “Asaya, afisa wa mfalme.” Kiebrania kinasema kihalisi “mtumishi wa mfalme,” usemi ambao unaweza kumaanisha afisa wa ikulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Mfalme akawaamuru
  rationale: Kitenzi צוה kinaonyesha amri yenye mamlaka. Muundo wa Kiswahili wenye kiambishi cha watendwa wengi unafaa kwa orodha inayofuata.
- source_word: חִלְקִיָּהוּ
  choice: Hilkia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikamu mwana wa Shafani
  rationale: Muundo 'mwana wa' unawakilisha kwa uwazi utambulisho wa ukoo unaoonyeshwa na בֶּן.
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: Abdoni mwana wa Mika
  rationale: Inafuata moja kwa moja Maandishi ya Kimasoreti ya Mambo ya Nyakati na kutumia maumbo ya majina yanayofaa Kiswahili.
- source_word: שָׁפָן הַסּוֹפֵר
  choice: Shafani mwandishi
  rationale: סֹפֵר huweza kumaanisha mwandishi au katibu wa kifalme; 'mwandishi' huhifadhi maana ya msingi bila kubana cheo hicho kupita kiasi.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaya, mtumishi wa mfalme
  rationale: עֶבֶד maana yake ya msingi ni 'mtumishi,' ingawa katika muktadha wa ikulu inaweza kumaanisha afisa wa kifalme.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania ya kutanguliza maneno yatakayofuata katika mstari unaofuata.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Majina yametoholewa kwa maumbo yanayoeleweka katika mapokeo ya Kiswahili cha Biblia. Alama [a] imewekwa baada ya ‘Abdoni mwana wa Mika,’ ambako lahaja ya maandishi inahusika moja kwa moja; alama [b] imewekwa baada ya ‘mtumishi wa mfalme.’
