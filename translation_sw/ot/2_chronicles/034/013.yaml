base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: sw
  text: Walikuwa wasimamizi wa wabeba mizigo, nao waliwasimamia wote waliofanya kazi kwa kila aina ya huduma[a]. Baadhi ya Walawi walikuwa waandishi, maafisa na walinda malango.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “kwa huduma na huduma.” Kurudiwa huku kwa neno la Kiebrania huenda kunaonyesha kila aina ya huduma au kazi mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: Walikuwa wasimamizi wa wabeba mizigo
  rationale: Katika muktadha huu עַל inaonyesha kuwa na mamlaka ya usimamizi, na סַבָּלִים ni watu waliobeba mizigo. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana zote mbili.
- source_word: וּמְנַצְּחִים לְכֹל עֹשֵׂה מְלָאכָה
  choice: nao waliwasimamia wote waliofanya kazi
  rationale: Kitenzi נצח hapa kina maana ya kuelekeza au kusimamia kazi. Kauli hii pia inadumisha maana ya jumla ya לְכֹל, yaani wote waliokuwa wakifanya kazi.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: kwa kila aina ya huduma[a]
  rationale: 'Kurudiwa kwa עֲבוֹדָה kunaelekea kuwa na maana ya mgawanyo: huduma moja moja au kila aina ya huduma. Kiswahili hiki ni cha asili, huku tanbihi ikihifadhi muundo halisi wenye kurudia neno.'
- source_word: וּמֵהַלְוִיִּם
  choice: Baadhi ya Walawi
  rationale: Kiambishi מִן kina maana ya sehemu ya kundi; si Walawi wote waliotajwa kuwa na majukumu yanayofuata.
- source_word: סוֹפְרִים
  choice: waandishi
  rationale: Neno hili humaanisha waandishi au watunza kumbukumbu. “Waandishi” ni neno pana, linaloeleweka na lililozoeleka katika muktadha wa Biblia.
- source_word: שֹׁטְרִים
  choice: maafisa
  rationale: Neno hili linarejelea maofisa wenye wajibu wa kiutawala au usimamizi; “maafisa” ni tafsiri fupi isiyobainisha zaidi ya maandishi ya Kiebrania.
- source_word: שׁוֹעֲרִים
  choice: walinda malango
  rationale: Neno hili linawataja watu waliopewa wajibu wa kulinda au kuhudumu malangoni, hasa katika mazingira ya hekalu.
