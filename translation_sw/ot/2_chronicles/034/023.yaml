lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: Naye akawaambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi na kuonyesha wazi kuwa Hulda aliwaambia wajumbe hao.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni kauli ya kawaida ya kinabii ya kuwasilisha ujumbe wa Mungu; wakati wa sasa ni wa kawaida na wa asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limeandikwa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hutafsiri kwa uwazi muundo wa kumtambulisha Yahweh kuwa Mungu wa Israeli.
- source_word: אִמְרוּ לָאִישׁ
  choice: Mwambieni mtu
  rationale: Kitenzi cha wingi kinawaamuru wajumbe wote wampelekee ujumbe mtu mmoja; ‘mwambieni’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: aliyewatuma kwangu
  rationale: Kishazi hiki kinamtambulisha mtu huyo kwa tendo lake na kuhifadhi mwelekeo wa kutuma wajumbe kwa Hulda.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina la Mungu YHWH. ‘Yahweh’ hulihifadhi kama jina binafsi, huku tanbihi ikieleza desturi ya kulitafsiri kwa cheo ‘BWANA’.
