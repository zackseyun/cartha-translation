  text: Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem.
translation:
  language: sw
  text: Yosia alikuwa na umri wa miaka minane alipoanza kutawala, naye akatawala katika Yerusalemu kwa miaka thelathini na mmoja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: alikuwa na umri wa miaka minane
  rationale: Nahau ya Kiebrania, kihalisi ‘mwana wa miaka minane,’ ni usemi wa kutaja umri; Kiswahili cha kawaida huiwasilisha kwa uwazi kama ‘alikuwa na umri wa miaka minane.’
- source_word: יֹאשִׁיָּהוּ
  choice: Yosia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati wa kuanza kwa utawala wake. ‘Alipoanza kutawala’ ni wa asili katika Kiswahili na unaweka wazi wazo la kutawazwa au kuanza kuwa mfalme bila kuongeza maelezo yasiyomo.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: kwa miaka thelathini na mmoja
  rationale: Hiki ni kipindi cha utawala wa Yosia; mpangilio huu wa namba ni wa kawaida katika Kiswahili sanifu.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi cha Kiebrania humaanisha kutawala kama mfalme; ‘akatawala’ ni tafsiri ya moja kwa moja na ya kawaida katika simulizi.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kiambishi בְּ ni cha mahali. ‘Huko Yerusalemu’ huonyesha kwa asili kwamba ndipo utawala huo ulipotekelezwa.
