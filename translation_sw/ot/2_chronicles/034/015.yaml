base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: sw
  text: Ndipo Hilkia akajibu, akamwambia Shafani mwandishi, “Nimekipata Kitabu cha Torati[a] katika nyumba ya Yahweh.” Kisha Hilkia akampa Shafani kitabu hicho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hati-kunjo ya Torati”; neno la Kiebrania sefer linaweza kumaanisha kitabu, hati, au hati-kunjo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu, akamwambia
  rationale: Huhifadhi fomula mbili za simulizi ya Kiebrania—‘akajibu’ na ‘akasema’—kwa Kiswahili cha kawaida; ‘akamwambia’ huonyesha wazi anayeelekezewa usemi.
- source_word: הַסּוֹפֵר
  choice: mwandishi
  rationale: Neno hili linaweza kumaanisha mwandishi au katibu mwenye wadhifa. ‘Mwandishi’ ni la moja kwa moja bila kufafanua kupita kiasi jukumu lake la kiutawala.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Kitabu cha Torati
  rationale: ‘Kitabu’ hutoa maana pana ya sefer, ambayo yaweza kuwa kitabu, hati, au hati-kunjo; ‘Torati’ ni istilahi ya Kiswahili iliyozoeleka kwa mafundisho au sheria ya agano.
- source_word: מָצָאתִי
  choice: Nimekipata
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu wa sasa katika tangazo la Hilkia.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: Huhifadhi sitiari halisi ya Kiebrania ‘nyumba,’ ambayo katika muktadha huu ni hekalu, na huhifadhi jina la agano Yahweh.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: akampa Shafani kitabu hicho
  rationale: Ni Kiswahili cha asili kinachowasilisha kwa usahihi tendo la kumpa Shafani kitabu kilichotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la agano, YHWH. ‘Yahweh’ hulitofautisha na cheo ‘Bwana’ bila kuingiza tafsiri ya kimadhehebu.
- issue: Maana ya תּוֹרָה
  choice: Torati
  alternative: sheria / mafundisho
  rationale: ‘Torati’ huhifadhi upana na utambulisho wa istilahi ya Kiebrania katika muktadha wa maandishi ya agano; kutafsiri tu ‘sheria’ kungeweza kuifanya maana iwe finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapobaki wa asili katika Kiswahili; kiambishi cha yambwa katika ‘nimekipata’ kinarejelea ‘Kitabu.’
