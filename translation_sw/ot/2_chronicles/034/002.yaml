  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דַרְכֵי֙ דָּוִ֣יד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: sw
  text: Alifanya yaliyo sawa machoni pa Yahweh[a], akafuata njia za Daudi, baba yake[b]; hakukengeuka kulia wala kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele za Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: “Baba yake” hapa humaanisha mtangulizi katika nasaba ya kifalme, si lazima baba wa moja kwa moja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Alifanya yaliyo sawa
  rationale: Kitenzi עשה pamoja na kivumishi kilichotumika kama nomino kinaeleza kwamba alitenda mambo yaliyokuwa sahihi; usemi huu ni wa kawaida na wenye kueleweka katika Kiswahili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Inahifadhi taswira ya nahau ya Kiebrania inayomaanisha tathmini au maoni ya Mungu, huku jina la agano יְהוָה likitafsiriwa Yahweh.
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: akafuata njia za
  rationale: Kiebrania hutumia taswira ya kutembea katika njia kwa mwenendo wa maisha. 'Akafuata njia za' ni Kiswahili cha asili kinachodumisha taswira ya njia na maana ya kuiga mwenendo.
- source_word: דָּוִיד אָבִיו
  choice: Daudi babu yake
  rationale: אָב inaweza kumaanisha baba au babu/mzazi wa kale. Kwa kuwa Daudi alikuwa mtangulizi wa kifalme wa Yosia, 'babu yake' huepuka dhana potovu kwamba alikuwa baba yake wa moja kwa moja, huku tanbihi ikifafanua maana ya nasaba.
- source_word: וְלֹא סָר
  choice: hakugeuka
  rationale: סור hapa ni kuondoka au kupotoka kwenye njia; 'hakugeuka' huendeleza taswira ya njia katika sentensi.
- source_word: יָמִין וּשְׂמֹאול
  choice: kwenda kulia wala kushoto
  rationale: Hii ni nahau ya kutopotoka upande wowote. Muundo 'wala' unafaa baada ya ukanushi wa Kiswahili na unadumisha pande zote mbili za sitiari.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni, jina la agano; 'Yahweh' hulitofautisha na cheo 'Bwana' na kufuata ushahidi wa maandishi bila kulibadilisha kuwa cheo.
- issue: Maana ya אָבִיו kuhusu Daudi
  choice: babu yake, kwa maana ya mtangulizi katika nasaba ya kifalme
  alternative: baba yake
  rationale: Yosia hakuwa mwana wa moja kwa moja wa Daudi. Kiebrania אָב linaweza kumaanisha baba au mzazi wa kale; tafsiri na tanbihi zinahifadhi matumizi ya kifalme na kuepusha kutokueleweka kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kwa msomaji wa kawaida. Taswira za 'macho' na 'njia' zimehifadhiwa kadiri zinavyosikika kiasili; 'akafuata njia' ni ya kawaida zaidi kuliko tafsiri ya moja kwa moja 'alitembea katika njia.'
