source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/לִּ/פְנֵ֣י אֱלֹהִ֗ים בְּ/שָׁמְעֲ/ךָ֤ אֶת דְּבָרָי/ו֙ עַל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/עַל יֹ֣שְׁבָ֔י/ו וַ/תִּכָּנַ֣ע לְ/פָנַ֔/י וַ/תִּקְרַ֥ע אֶת בְּגָדֶ֖י/ךָ וַ/תֵּ֣בְךְּ לְ/פָנָ֑/י וְ/גַם אֲנִ֥י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: sw
  text: Kwa sababu moyo wako ulikuwa mwororo[a], ukajinyenyekeza mbele za Mungu uliposikia maneno yake dhidi ya mahali hapa na dhidi ya wakazi wake, ukajinyenyekeza mbele zangu, ukararua mavazi yako, na ukalia mbele zangu, mimi pia nimekusikia, asema Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wako ulikuwa laini.” Nahau ya Kiebrania inaeleza moyo uliokuwa tayari kupokea na kujinyenyekeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Kwa sababu
  rationale: Inaonyesha sababu ya jibu la Mungu kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: רַךְ לְבָבְךָ
  choice: moyo wako ulikuwa mwororo
  rationale: Neno רַךְ humaanisha kwa msingi ‘laini’ au ‘mwororo’; likihusishwa na moyo hapa linaonyesha hali ya ndani iliyo tayari kupokea na kujinyenyekeza, si udhaifu.
- source_word: וַתִּכָּנַע
  choice: ukajinyenyekeza
  rationale: Niphal ya כנע katika muktadha huu inaonyesha Yosia kujishusha mwenyewe mbele za Mungu; tafsiri hii pia inafaa katika marudio yote mawili.
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  choice: mbele za Mungu / mbele zangu
  rationale: Misemo hii inaonyesha kuwa katika uwepo wa Mungu, na marudio yake yamedumishwa kwa uzito wa kisanaa.
- source_word: בְּשָׁמְעֲךָ
  choice: uliposikia
  rationale: Muundo wa ב pamoja na kitenzi-jina una maana ya wakati; ‘uliposikia’ ni Kiswahili cha kawaida na sahihi.
- source_word: דְּבָרָיו
  choice: maneno yake
  rationale: Kiambishi cha nafsi kinamrejelea Mungu kwa kawaida katika muktadha; tafsiri hii inadumisha umbo la chanzo bila kulipanua kuwa ‘ujumbe’.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: dhidi ya mahali hapa na dhidi ya wakazi wake
  rationale: Katika muktadha wa hukumu, עַל ina nguvu ya upinzani. Kurudia ‘dhidi ya’ kunadumisha msisitizo wa Kiebrania.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: ukararua mavazi yako
  rationale: ‘Mavazi’ ni neno la sasa na lenye heshima, na tendo la kuyararua kama ishara ya huzuni au toba limeachwa wazi.
- source_word: וַתֵּבְךְּ
  choice: na kulia
  rationale: ‘Kulia’ huwasilisha huzuni kuu kwa lugha ya kawaida bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: mimi pia nimekusikia
  rationale: ‘Pia’ na kiwakilishi ‘mimi’ vinadumisha msisitizo; yambwa ‘ku-’ linaeleweka kutokana na muktadha na huifanya sentensi kuwa ya kawaida katika Kiswahili.
- source_word: נְאֻם יְהוָה
  choice: asema Yahwe
  rationale: Ni fomula ya tamko la kimungu; ‘asema’ ni ya asili katika Kiswahili, huku Yahwe ikidumisha jina la agano lililo katika maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahwe’ linadumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Mabadiliko kutoka ‘maneno yake’ hadi ‘mbele zangu’
  choice: Kudumisha mabadiliko ya nafsi kama yalivyo katika chanzo
  alternative: Kubadili ‘maneno yake’ kuwa ‘maneno yangu’ kwa ulinganifu
  rationale: Nabii anawasilisha usemi wa Mungu, na maandishi yenyewe yana mabadiliko haya ya nafsi. Kuyasawazisha kungeondoa mvutano halisi wa kisarufi na kisanaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mrefu wa sababu na marudio ya ‘mbele’ na ‘dhidi ya’ yamedumishwa kwa kuwa yana uzito wa kisanaa katika Kiebrania.
