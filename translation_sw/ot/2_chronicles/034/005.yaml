base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: sw
  text: Akaiteketeza mifupa ya makuhani juu ya madhabahu zao[a], akaitakasa Yuda na Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “madhabahu.” Umbo la Kiebrania hapa si la kawaida; maana yake ni kwamba Yosia aliiteketeza mifupa ya makuhani juu ya madhabahu zilizohusishwa nao.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת
  choice: mifupa ya
  rationale: עַצְמוֹת ni wingi wa neno linalomaanisha mifupa halisi. Kiunganishi וְ kimewakilishwa kwa mtiririko wa kimasimulizi wa kitenzi “Akaiteketeza,” badala ya kuongeza “na” isiyo ya lazima mwanzoni.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Neno hili humaanisha makuhani. Ingawa muktadha unawahusisha na ibada haramu, tafsiri haiongezi “wa sanamu,” kwa kuwa maelezo hayo hayapo wazi katika kishazi hiki.
- source_word: שָׂרַף
  choice: akaiteketeza
  rationale: Kitenzi hiki humaanisha kuchoma au kuteketeza. “Akaiteketeza” kinaeleza kwa kawaida kuchomwa kwa mifupa na pia kinaendeleza mfuatano wa masimulizi.
- source_word: עַל
  choice: juu ya
  rationale: Hii ndiyo maana ya moja kwa moja ya kihusishi, ikionyesha mahali mifupa ilipochomewa.
- source_word: מזבחותים
  choice: madhabahu zao
  rationale: Umbo la Kiebrania si la kawaida, lakini linaeleweka kwa uwezekano mkubwa kuwa madhabahu zilizohusishwa na makuhani hao. “Zao” huhifadhi maana hiyo huku tanbihi ikitaja uwezekano wa kusoma “madhabahu” bila kiwakilishi.
- source_word: וַ/יְטַהֵר
  choice: akaitakasa
  rationale: Katika muktadha wa mageuzi ya ibada, טהר humaanisha kuondoa unajisi unaohusiana na ibada haramu. “Akaitakasa” huhifadhi maana ya kiibada na kimaadili bila kuifanya kuwa usafishaji wa kawaida tu.
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: Yuda na Yerusalemu
  rationale: Haya ni majina sanifu ya Kiswahili ya eneo la Yuda na mji wa Yerusalemu, yaliyotajwa kama vitu vilivyotakaswa.
theological_decisions:
- issue: Asili ya kutakaswa kwa Yuda na Yerusalemu
  choice: kutakaswa kwa kuondoa unajisi wa ibada haramu
  alternative: utakaso wa kiibada pekee, au usafishaji na uharibifu wa vitu tu
  rationale: Muktadha wa mageuzi ya Yosia unaonyesha kuondolewa kwa unajisi uliotokana na ibada haramu. “Akaitakasa” huhifadhi upeo wa kiibada na kimaadili wa kitenzi bila kuingiza dhana pana zaidi isiyotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Vitenzi vinavyoanza na “aka-” vinaendeleza mfuatano wa matendo katika simulizi.
