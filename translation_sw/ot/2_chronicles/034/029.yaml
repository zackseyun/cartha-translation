translation:
  language: sw
  text: Kisha mfalme akatuma, akawakusanya wazee wote wa Yuda na Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kisha mfalme akatuma neno, akawakusanya wazee wote wa Yuda na Yerusalemu.”
