lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi שׁלח humaanisha “kutuma.” Kwa kuwa lengo lilikuwa kuwakusanya wazee, Kiswahili cha kawaida huhitaji kubainisha waliotumwa, yaani watu; hilo linaeleza wito bila kudai kwamba ujumbe wa maandishi ulitumwa.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho imetafsiriwa moja kwa moja. Ingawa muktadha unamtambulisha kuwa Yosia, mstari huu unatumia cheo chake.
- source_word: וַיֶּאֱסֹף
  choice: akawakusanya
  rationale: אָסף hapa ni kuwakusanya au kuwaweka pamoja watu. Kiambishi -wa- kinawarejelea wazee kama yambwa wa kitenzi.
- source_word: אֶת כָּל
  choice: wote
  rationale: אֶת ni kiashiria cha yambwa na hakihitaji neno tofauti katika Kiswahili; כָּל imewakilishwa kwa “wote,” ikihifadhi maana ya ujumuishi.
- source_word: זִקְנֵי
  choice: wazee
  rationale: זִקְנֵי hapa ni wazee wenye nafasi ya uongozi katika jamii, si wanaume wenye umri mkubwa tu. “Wazee” ni istilahi ya kawaida na inayofaa katika muktadha huu.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: wa Yuda na Yerusalemu
  rationale: Muundo huu unaonyesha kwamba wazee walitoka au walihusishwa na Yuda na Yerusalemu; “wa” linaweza kutumika kwa majina yote mawili kwa mtiririko wa kawaida wa Kiswahili.
