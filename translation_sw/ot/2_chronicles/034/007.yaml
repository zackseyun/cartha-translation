source:
  edition: WLC
  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: sw
  text: Akazibomoa madhabahu na vitu vya ibada vya Ashera[a], akaziponda sanamu za kuchongwa zikawa unga, na akazikata nguzo zote za ibada[b] katika nchi yote ya Israeli. Kisha akarudi Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo za Ashera.” Neno la Kiebrania linataja vitu vya ibada vilivyohusishwa na Ashera; huenda umbo lake lilitofautiana kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: hammanim. Huenda vilikuwa “nguzo za jua” au “madhabahu za uvumba”; utambulisho wake kamili unabishaniwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: akazibomoa
  rationale: Kitenzi נתץ humaanisha kubomoa au kuangusha miundo; “akazibomoa” ni Kiswahili cha kawaida kinachofaa kwa madhabahu.
- source_word: הַמִּזְבְּחוֹת
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa מזבחות katika muktadha wa mahali pa ibada.
- source_word: הָאֲשֵׁרִים
  choice: vitu vya ibada vya Ashera
  rationale: אֲשֵׁרִים ni vitu vya ibada vilivyohusishwa na Ashera. Tafsiri hii inaeleweka kwa msomaji wa kawaida bila kuamua kwamba kila kitu hicho kilikuwa nguzo ya umbo lilelile.
- source_word: הַפְּסִלִים
  choice: sanamu za kuchongwa
  rationale: פסילים ni sanamu zilizochongwa; tafsiri hii ni mahususi zaidi kuliko neno la jumla “sanamu za miungu.”
- source_word: כִּתַּת לְהֵדַק
  choice: akaziponda ... zikawa unga
  rationale: Muungano huu wa maneno unaonyesha kuponda mpaka vitu vikawa chembechembe laini; “zikawa unga” huwasilisha matokeo hayo kwa Kiswahili cha asili.
- source_word: הַחַמָּנִים
  choice: nguzo zote za ibada
  rationale: חַמָּנִים hutaja vitu vya ibada ambavyo utambulisho wake kamili unabishaniwa, mara nyingi vikihusishwa na jua au na kufukiza uvumba. “Nguzo za ibada” hudumisha taswira ya vitu vilivyosimama inayopatana na kitenzi “kukata,” huku tanbihi ikihifadhi njia nyingine za kuelewa neno hilo.
- source_word: גִּדַּע
  choice: kuzikata
  rationale: גדע humaanisha kukata au kuangusha kwa kukata, jambo linalofaa kwa vitu vya ibada vilivyosimama.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: katika nchi yote ya Israeli
  rationale: Huwasilisha kwa kawaida upeo wa tendo hilo katika eneo lote la Israeli.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: Kisha akarudi Yerusalemu
  rationale: “Kisha” huonyesha mwendelezo wa simulizi unaobebwa na wayyiqtol, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwakilishi wa vitu mbalimbali vya ibada ya sanamu
  choice: Kutaja madhabahu, vitu vya Ashera, sanamu za kuchongwa, na nguzo za ibada kwa namna tofauti
  alternative: Kuvijumlisha vyote chini ya neno la jumla kama “sanamu” au “mahali pa ibada”
  rationale: Maandishi ya Kiebrania yanatofautisha aina kadhaa za vitu vilivyoharibiwa katika matengenezo ya Yosia. Kudumisha utofauti huo huhifadhi umahususi wa simulizi bila kuingiza msimamo wa dhehebu.
- issue: Utambulisho wa הַחַמָּנִים
  choice: Neno lisiloamua kabisa, “nguzo za ibada,” pamoja na tanbihi
  alternative: “Madhabahu za uvumba” au “nguzo za jua” bila tanbihi
  rationale: Utambulisho halisi wa חַמָּנִים unabishaniwa. Tafsiri kuu haipaswi kuficha utata huo wala kulazimisha maana moja kana kwamba ni hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umewekwa wazi kwa vitenzi vinavyofuatana, huku istilahi za ibada zisizojulikana kwa uhakika zikielezwa kwa maneno yanayoeleweka na tanbihi.
