  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: sw
  text: na katika miji ya Manase, Efraimu na Simeoni, hata kufika Naftali, katika magofu yao yaliyokuwa pande zote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha mwisho katika maandishi ya Kiebrania ni kigumu; maana yake halisi si wazi kabisa. Tafsiri nyingi hukielewa kuwa kinarejelea magofu au maeneo yaliyoharibiwa yaliyokuwa pande zote.
    reason: textual_variant
  - marker: b
    text: Au “katika maeneo yao yaliyoharibiwa pande zote.” Maandishi ya konsonanti yanaweza kueleweka kwa uhalisi zaidi kuwa “nyumba zao,” lakini muktadha unaunga mkono zaidi wazo la magofu au maeneo yaliyoharibiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: na katika miji ya
  rationale: Viambishi vya kiunganishi na kihusishi vimewakilishwa; “miji” ni tafsiri ya kawaida ya עָרֵי katika simulizi la kihistoria.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: Manase, Efraimu na Simeoni
  rationale: Majina ya kikabila na kijiografia yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili; orodha imeundwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: וְ/עַד נַפְתָּלִי
  choice: hata kufika Naftali
  rationale: עַד huonyesha kikomo cha eneo; “hata kufika” huwasilisha wazi upana wa shughuli inayotajwa huku ikibaki ya asili katika Kiswahili.
- source_word: ב/הר בתי/הם
  choice: katika magofu yao
  rationale: Maandishi ya kirai hiki ni magumu, lakini muktadha unaelekea kwenye maeneo yaliyoharibiwa au magofu. Tafsiri hii inatoa maana ya mahali bila kuficha tatizo la maandishi, ambalo limeelezwa katika tanbihi.
- source_word: סָבִיב
  choice: pande zote
  rationale: סָבִיב huonyesha eneo linalozunguka au kuenea kotekote; “pande zote” ni usemi wa kawaida na wazi wa Kiswahili.
