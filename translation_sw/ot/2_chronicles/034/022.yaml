base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: sw
  text: 'Ndipo Hilkia na wale ambao mfalme aliwatuma wakaenda kwa Hulda, nabii mwanamke, mke wa Shalumu mwana wa Tokhathi, mwana wa Hasra, mwangalizi wa mavazi[a]. Hulda alikuwa akiishi Yerusalemu, katika Mtaa wa Pili[b], nao wakamwambia hivi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msimamizi wa kabati la mavazi.” Kiebrania ni “mwangalizi wa mavazi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania Mishne, huenda jina la eneo fulani la Yerusalemu; kwa desturi limetafsiriwa “Mtaa wa Pili.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: wakaenda
  rationale: Wayyiqtol ya הלך inaendeleza simulizi kwa wakati uliopita; “wakaenda” ni ya kawaida na ya asili katika masimulizi ya Kiswahili.
- source_word: וַאֲשֶׁר הַמֶּלֶךְ
  choice: na wale wa mfalme
  rationale: Kiebrania ni kifupi na hakitaji wazi kitendo cha kuwatuma; tafsiri hii huhifadhi udokezi huo na kurejelea wajumbe waliotajwa katika mstari uliotangulia bila kuongeza “aliowatuma” katika matini.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: Hulda nabii wa kike
  rationale: Nomino ya Kiebrania ina umbo la kike; “nabii wa kike” huonyesha jinsia hiyo kwa Kiswahili cha kawaida.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: mke wa Shalumu
  rationale: Kirai unganifu kinaonyesha moja kwa moja uhusiano wa ndoa.
- source_word: בֶּן תוקהת בֶּן חַסְרָה
  choice: mwana wa Tokhathi, mwana wa Hasra
  rationale: Mfuatano wa ukoo umehifadhiwa, huku majina yakitoholewa kwa mfumo unaosomeka katika Kiswahili.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: mtunza mavazi
  rationale: Hii inafuata maana halisi ya “anayeyatunza mavazi” bila kuamua kimya kimya kwamba ilikuwa ofisi maalumu ya kusimamia kabati la mavazi.
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: Hulda alikuwa akiishi
  rationale: Kitenzi-shirikishi kinatoa habari ya mandharinyuma kuhusu makao yake; kurudia jina huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili.
- source_word: בַּמִּשְׁנֶה
  choice: katika Mtaa wa Pili
  rationale: Neno hilo huenda ni jina la eneo fulani la Yerusalemu; “Mtaa wa Pili” hutoa maana inayowezekana, huku tanbihi ikihifadhi uwezekano wa kulitaja kwa jina Mishne.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'nao wakasema naye hivi:'
  rationale: Kirai hiki huanzisha maneno yanayofuata; “wakasema naye hivi” ni cha asili na huhifadhi nguvu ya demonstrativi כָּזֹאת.
