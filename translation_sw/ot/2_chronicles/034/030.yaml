base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: sw
  text: Ndipo mfalme akapanda hadi nyumba ya Yahwe, pamoja na kila mwanamume wa Yuda, wakazi wa Yerusalemu, makuhani, Walawi, na watu wote, tangu mkubwa hadi mdogo. Akawasomea kwa sauti maneno yote ya kitabu cha agano kilichokuwa kimepatikana katika nyumba ya Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: Kitenzi עלה kina maana ya kwenda juu au kupanda; usemi huu unahifadhi mwelekeo wa kwenda katika nyumba ya Yahwe.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Hii ndiyo maana ya moja kwa moja ya usemi wa Kiebrania, na inahifadhi taswira yake badala ya kuibadili kuwa tu ‘hekalu.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kwa umbo linaloeleweka na wasomaji wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כָל אִישׁ יְהוּדָה
  choice: kila mwanamume wa Yuda
  rationale: אִישׁ ni nomino ya kiume iliyotumiwa kwa maana ya kila mmoja; tafsiri hii inahifadhi lugha ya kiume iliyo wazi katika chanzo.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: wakazi wa Yerusalemu
  rationale: Huwataja kwa kawaida watu waliokuwa wakiishi Yerusalemu.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: tangu mkubwa hadi mdogo
  rationale: Ni usemi unaojumuisha watu wa kila daraja, huku ukibaki karibu na muundo wa Kiebrania.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: akawasomea kwa sauti
  rationale: Katika muktadha wa kitabu, קרא ni kusoma; ‘kwa sauti’ huwasilisha maana ya kusoma ili wasikie bila kufuata kijuujuu nahau ya ‘masikioni mwao.’
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: maneno yote ya kitabu cha agano
  rationale: Inahifadhi msisitizo wa chanzo juu ya maneno yote yaliyomo katika hati ya agano.
- source_word: הַנִּמְצָא
  choice: kilichokuwa kimepatikana
  rationale: Muundo huu unaonyesha kuwa kitabu kilikuwa tayari kimepatikana kabla ya kusomwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano YHWH; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Lugha ya kijinsia katika כָל אִישׁ יְהוּדָה
  choice: kila mwanamume wa Yuda
  alternative: kila mtu wa Yuda
  rationale: Neno אִישׁ ni la kiume, kwa hiyo tafsiri hailifanyi lisilo na jinsia; baadaye mstari wenyewe unataja pia ‘watu wote.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Akapanda kwenda’ huhifadhi mwelekeo wa kitenzi cha Kiebrania, na ‘akawasomea kwa sauti’ huwasilisha kwa Kiswahili cha kawaida tendo la kusoma mbele ya kusanyiko.
