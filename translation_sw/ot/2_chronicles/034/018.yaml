base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: sw
  text: Kisha Shafani mwandishi akamwambia mfalme, “Hilkia kuhani amenipa kitabu[a].” Naye Shafani akasoma kutoka katika kitabu hicho mbele ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “gombo.” Neno la Kiebrania linaweza kumaanisha kwa upana hati iliyoandikwa au kitabu; katika kipindi hicho, mara nyingi maandishi yalikuwa katika umbo la gombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: akamwambia
  rationale: Kitenzi נגד katika Hifili humaanisha kusema, kueleza, au kutoa taarifa. “Akamwambia” ni Kiswahili cha kawaida kinachofaa kwa maneno ya moja kwa moja yanayofuata.
- source_word: הַסּוֹפֵר
  choice: mwandishi
  rationale: סֹפֵר linaweza kumaanisha mwandishi au katibu wa kifalme. “Mwandishi” linahifadhi maana ya msingi na cheo hicho cha kihistoria bila kuongeza umahususi usiolazimishwa na neno lenyewe.
- source_word: סֵפֶר
  choice: kitabu
  rationale: סֵפֶר ni neno pana kwa maandishi, hati, au kitabu. “Kitabu” ni tafsiri ya kawaida na pana; umbo lake la wakati huo huenda lilikuwa hati-kunjo, jambo lililoonyeshwa katika tanbihi.
- source_word: נָתַן לִי
  choice: amenipa
  rationale: 'Kauli hii inaeleza tendo lililokamilika lenye matokeo ya sasa: kitabu sasa kiko mikononi mwa Shafani. “Amenipa” linaonyesha hilo kwa Kiswahili cha kawaida.'
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: Hilkia kuhani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, huku cheo הַכֹּהֵן kikatafsiriwa kuwa “kuhani.”
- source_word: וַיִּקְרָא בוֹ
  choice: akasoma kutoka humo
  rationale: Kitenzi קרא pamoja na kihusishi בּוֹ hapa kinamaanisha kusoma kwa sauti kutoka katika maandishi hayo. “Akasoma kutoka humo” linawakilisha kihusishi bila kudai kwamba alisoma kitabu chote.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Kirai hiki kinaonyesha kuwa usomaji ulifanyika katika uwepo wa mfalme. “Mbele ya mfalme” ni kifupi, cha kawaida, na karibu na muundo wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi umetolewa kwa viambishi vya mfululizo “aka-,” na msamiati umewekwa wazi kwa msomaji wa kawaida bila kuondoa hali ya kihistoria.
