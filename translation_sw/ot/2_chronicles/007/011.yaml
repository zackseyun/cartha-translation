base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: sw
  text: Basi Sulemani akamaliza nyumba ya Yahwe na nyumba ya mfalme[a]. Kila jambo lililoujia moyo wa Sulemani[b] kufanya katika nyumba ya Yahwe na katika nyumba yake mwenyewe, alilitekeleza kwa mafanikio.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikulu ya mfalme.”
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania, “kila jambo lililoujia moyo wa Sulemani,” yaani kila alilokusudia au kutamani kufanya.
    reason: cultural_note
  - marker: c
    text: Au “alifanikiwa” au “alifanikisha.” Kitenzi cha Kiebrania kinaweza kumaanisha kufanikiwa au kufanya jambo lifanikiwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: akamaliza
  rationale: Kitenzi כלה katika mfululizo wa masimulizi kinaonyesha kukamilisha jambo; “akamaliza” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi neno halisi בית, “nyumba,” na kulitaja jina la agano יְהוָה kama “Yahwe.”
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Huhifadhi urudiaji wa neno בית katika Kiebrania; kwa muktadha, nyumba hiyo ni ikulu ya mfalme.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: kila jambo lililoujia moyo wa Sulemani
  rationale: Huhifadhi taswira ya nahau ya Kiebrania huku ikibaki wazi kwa wasomaji wa Kiswahili; inahusu aliyokusudia au kutamani kufanya.
- source_word: לַעֲשׂוֹת
  choice: kufanya
  rationale: Ni tafsiri ya moja kwa moja ya עשה na inafaa kwa shughuli au miradi iliyokusudiwa.
- source_word: וּבְבֵיתוֹ
  choice: katika nyumba yake mwenyewe
  rationale: “Mwenyewe” huweka wazi kuwa kiambishi kinamrejelea Sulemani na kuitofautisha nyumba hiyo na nyumba ya Yahwe.
- source_word: הִצְלִיחַ
  choice: alilitekeleza kwa mafanikio
  rationale: Huwasilisha mafanikio ya utekelezaji katika muktadha huu, huku tanbihi ikihifadhi uwezekano wa maana ya “alifanikiwa” au “alifanikisha.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa maana ya הִצְלִיחַ
  choice: alilitekeleza kwa mafanikio
  alternative: alifanikiwa; alifanikisha
  rationale: Kitenzi cha Hifili kinaweza kueleza kufanikiwa au kufanya jambo lifanikiwe. Tafsiri kuu inaunganisha mafanikio hayo na mambo aliyokusudia kufanya bila kufuta utata wa kimsingi, ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi urudiaji wa “nyumba” na taswira ya “moyo,” huku sentensi ikigawanywa mara mbili ili isomeke kwa urahisi.
