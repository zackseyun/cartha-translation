  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: sw
  text: Makuhani walikuwa wamesimama katika vituo vyao, nao Walawi walikuwa na ala za wimbo wa Yahweh[a], ambazo Mfalme Daudi alikuwa ametengeneza ili kumshukuru Yahweh, kwa maana upendo wake mwaminifu hudumu milele.[b] Daudi alipotoa sifa kwa njia yao,[c] makuhani walikuwa wakipiga tarumbeta mbele yao, huku Israeli wote wakiwa wamesimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ala za muziki za Yahweh.” Kifungu cha Kiebrania kinaweza kumaanisha ala zilizowekwa kwa ajili ya Yahweh au ala zilizotumiwa kwa wimbo wa Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “Kwa maana upendo wake mwaminifu ni wa milele.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Daudi aliposifu kwa njia yao.” Kiebrania kimebanwa; huenda maana yake ni kwamba Walawi walitoa sifa za Daudi kama mawakala wake.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: vituo vyao
  rationale: Neno hili linaonyesha nafasi au vituo walivyopangiwa katika utumishi. “Vituo vyao” linaendeleza wazo la mpangilio wa huduma kuliko wajibu wa jumla pekee.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: ala za wimbo wa Yahweh
  rationale: Tafsiri hii inadumisha uhusiano wa maneno “ala,” “wimbo,” na “Yahweh” bila kuamua kimyakimya ikiwa ala hizo zilikuwa mali iliyowekwa wakfu kwa Yahweh au zilitumiwa kuandamana na wimbo wake.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: kumshukuru Yahweh
  rationale: Katika muktadha wa kauli inayofuata kuhusu upendo wa Yahweh, kitenzi hiki kinaonyesha hasa kutoa shukrani, ingawa pia kinaweza kubeba maana ya kusifu.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: Kwa maana upendo wake mwaminifu hudumu milele
  rationale: “Upendo mwaminifu” linaunganisha wema wa upendo na uaminifu wa kudumu uliomo katika חֶסֶד. “Hudumu” limeongezwa kwa Kiswahili cha kawaida ili kueleza nahau ya Kiebrania.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: Daudi alipotoa sifa kupitia kwao
  rationale: Kifungu cha Kiebrania kimebanwa na humtaja Daudi kama mhusika huku Walawi wakiwa njia ya kutolea sifa. Tafsiri hii inadumisha uhusiano huo bila kuamua ikiwa kinachosisitizwa ni tungo zake, ala zake, au uwakilishi wa Walawi.
- source_word: מחצצרים
  choice: walikuwa wakipiga tarumbeta
  rationale: Kitenzi kinamaanisha hasa kutoa sauti kwa tarumbeta; umbo la kuendelea linafaa mandhari ya ibada inayoendelea.
- source_word: נֶגְדָּם
  choice: wakielekeana nao
  rationale: Neno linaonyesha kuwa makuhani walikuwa mbele au upande unaokabiliana na Walawi. “Wakielekeana nao” ni la kawaida katika Kiswahili na linadumisha uhusiano wa mahali.
- source_word: עֹמְדִים
  choice: walikuwa wamesimama / wakiwa wamesimama
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha hali inayoendelea katika tukio hilo, jambo linalowakilishwa na miundo hii ya Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה. “Yahweh” linawakilisha jina hilo moja kwa moja badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֶסֶד
  choice: upendo wake mwaminifu
  alternative: fadhili zake / rehema zake / upendo wake thabiti
  rationale: “Upendo mwaminifu” linaacha pamoja vipengele vya upendo, wema, na uaminifu wa agano bila kulifinya neno katika “rehema” pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Miundo ya kuendelea imetumiwa kuonyesha mandhari ya ibada inayoendelea. Alama za maelezo zimewekwa mara moja kila moja katika sehemu husika ya maandishi.
