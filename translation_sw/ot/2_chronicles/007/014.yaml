id: 2CH.7.14
reference: 2 Chronicles 7:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: sw
  text: ikiwa watu wangu[a], wanaoitwa kwa jina langu, watajinyenyekeza, waombe na kuutafuta uso wangu, na waache njia zao mbaya, basi nitasikia kutoka mbinguni, nami nitawasamehe dhambi yao na kuiponya nchi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “ambao jina langu limeitwa juu yao”; ni nahau ya Kiebrania inayoonyesha kuwa wao ni wa Mungu na wanabeba jina lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: watajinyenyekeza
  rationale: Nifali ya כנע ina maana ya kujishusha au kujinyenyekeza hapa; umbo la kujirejelea linaonyesha mwitikio wa hiari katika sharti.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Ni jina la pamoja linaloonyesha uhusiano wa agano; Kiswahili hutumia kwa kawaida ‘watu wangu.’
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: wanaoitwa kwa jina langu
  rationale: Hii ni nahau ya Kiebrania inayoonyesha kuwa watu hao ni wa Mungu na wanahusishwa na jina lake; tafsiri hii ni ya kawaida na inaeleweka vizuri kwa Kiswahili.
- source_word: וְיִתְפַּלְלוּ
  choice: kusali
  rationale: Hitpaeli ya פלל humaanisha kusali; anayeelekezewa sala anaeleweka kutokana na muktadha.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: kuutafuta uso wangu
  rationale: Inahifadhi taswira halisi ya kutafuta uso wa Mungu, yaani kutafuta kuwapo na kibali chake, bila kuifupisha kuwa ‘kunitafuta.’
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: kuziacha njia zao mbaya
  rationale: שׁוב hapa huonyesha kugeuka kimaadili. ‘Kuziacha’ ni Kiswahili cha kawaida kinachoeleza wazi kuondoka katika mwenendo mbaya, huku ‘njia’ ikihifadhi sitiari ya chanzo.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: basi nitasikia kutoka mbinguni
  rationale: ‘Basi’ huweka wazi matokeo ya sharti; ‘kutoka mbinguni’ inafuata מן השמים na kumwonyesha Mungu akisikia kutoka makao ya mbinguni.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: nami nitawasamehe dhambi yao
  rationale: Kitenzi סלח pamoja na ל humaanisha kuwasamehe watu kwa habari ya dhambi yao. ‘Dhambi’ imebaki umoja wa pamoja kama katika Kiebrania.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: kuiponya nchi yao
  rationale: ‘Kuiponya’ huhifadhi sitiari ya רפא kuhusu nchi iliyoathirika na kurejeshwa na Mungu.
theological_decisions:
- issue: Muundo wa sharti na matokeo
  choice: Kutumia ‘ikiwa’ mwanzoni na ‘basi’ kabla ya jibu la Mungu.
  alternative: Kuunganisha vishazi vyote kwa ‘na’ bila alama dhahiri ya sharti.
  rationale: Ingawa Kiebrania hutumia viunganishi mfululizo, muktadha wa 7:13–14 unaonyesha wazi sharti likifuatiwa na matokeo; Kiswahili cha kawaida hunufaika kwa kuonyesha uhusiano huo.
- issue: Nahau ya jina la Mungu juu ya watu
  choice: ‘wanaoitwa kwa jina langu’ pamoja na tanbihi inayoeleza umiliki na utambulisho.
  alternative: ‘ambao jina langu limeitwa juu yao.’
  rationale: Chaguo kuu ni la kawaida katika Kiswahili na hudumisha maana ya watu kuwa wa Mungu na kubeba utambulisho wake; tanbihi huhifadhi muundo halisi wa nahau.
- issue: Maana ya ‘kuutafuta uso wangu’
  choice: Kuhifadhi taswira ya uso wa Mungu katika matini kuu.
  alternative: ‘kunitafuta’ au ‘kutafuta kibali changu.’
  rationale: Taswira ya chanzo inabeba kwa pamoja wazo la kumtafuta Mungu, kuwapo kwake, na kibali chake; haifai kuifungia katika maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sharti umewekwa wazi kwa ‘ikiwa … basi’; taswira muhimu za Kiebrania—uso, njia, na kuiponya nchi—zimehifadhiwa.
