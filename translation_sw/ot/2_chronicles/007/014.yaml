  terminology: “Watu wangu,” “wanaoitwa kwa jina langu,” “uso wangu,” “dhambi yao,” and “kuiponya nchi yao” are suitable and preserve the register and key biblical imagery. The footnote appropriately explains the Hebrew idiom without narrowing it doctrinally.
