base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: sw
  text: Nao makuhani hawakuweza kuingia katika nyumba ya Yahweh[a], kwa sababu utukufu wa Yahweh uliijaza nyumba ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “nyumba ya Yahweh”; yaani, hekalu. Tafsiri imehifadhi neno “nyumba” ili kuakisi maneno ya Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: Nao ... hawakuweza
  rationale: Muunganiko wa וְ unaendeleza simulizi, na יכל pamoja na ukanushaji huonyesha kutokuwa na uwezo; “Nao ... hawakuweza” ni Kiswahili cha kawaida na kinachofuata maana hiyo.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa watumishi wa kikuhani katika muktadha wa hekalu.
- source_word: לָבוֹא אֶל
  choice: kuingia katika
  rationale: Katika muktadha huu בוא pamoja na אֶל humaanisha kuingia mahali; tafsiri hii ni wazi na ya kawaida.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: “Nyumba” huhifadhi taswira halisi ya בַּיִת na marudio ya Kiebrania, huku muktadha ukionyesha kuwa ni hekalu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inaleta sababu ya makuhani kutoweza kuingia.
- source_word: מָלֵא
  choice: ulikuwa umeijaza
  rationale: Kitenzi hicho kinaeleza hali iliyokuwapo kutokana na utukufu kuijaza nyumba; umbo hili la Kiswahili linaunganisha kwa kawaida sababu hiyo na tukio lililotangulia bila kubadili kiini cha maana.
- source_word: כְבוֹד יְהוָה
  choice: utukufu wa Yahweh
  rationale: Huhifadhi uhusiano wa maneno katika muundo wa Kiebrania na istilahi ya kawaida ya kibiblia.
- source_word: אֶת בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Kirai kimerudiwa kama katika Kiebrania badala ya kubadilishwa kwa sababu za mtindo.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “nyumba ya Yahweh”
  choice: Kuhifadhi neno “nyumba” katika maandishi
  alternative: hekalu la Yahweh
  rationale: “Nyumba” huakisi בֵּית kwa karibu na kuhifadhi lugha ya kiteolojia ya chanzo; tanbihi inafafanua kuwa hapa inamaanisha hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku marudio ya “nyumba ya Yahweh” yakihifadhiwa kwa uaminifu kwa chanzo.
