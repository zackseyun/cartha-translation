base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: sw
  text: Lakini ikiwa mtageuka na kuziacha sheria zangu na amri zangu nilizoweka mbele yenu, kisha mkaenda kuitumikia miungu mingine na kuziinamia,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: mtageuka
  rationale: Kitenzi שוב hapa, pamoja na kuziacha sheria na kumfuata miungu mingine, kina maana ya kugeuka au kuacha uaminifu wa awali.
- source_word: חֻקּוֹתַי
  choice: sheria zangu
  rationale: חֹק humaanisha masharti au sheria zilizowekwa; ‘sheria’ ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: מִצְוֺתַי
  choice: amri zangu
  rationale: מִצְוָה hutaja maagizo yenye mamlaka, kwa hiyo ‘amri’ hutofautisha neno hili na חֻקּוֹת.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: nilizoweka mbele yenu
  rationale: Huhifadhi taswira ya Kiebrania ya kuweka maagizo mbele ya watu ili wayafuate.
- source_word: וַעֲבַדְתֶּם
  choice: kuitumikia
  rationale: עבד katika muktadha wa miungu ina maana ya kutoa huduma ya kidini au ibada; ‘kutumikia’ huhifadhi usemi wa chanzo bila kuufanya sawa kabisa na kitenzi kinachofuata.
- source_word: וְהִשְׁתַּחֲוִיתֶם
  choice: kuiinamia
  rationale: השתחוה hueleza kujipinda au kuinama kwa ibada; ‘kuiinamia’ huhifadhi tendo hilo la kimwili na kidini.
theological_decisions:
- issue: Uhusiano kati ya kutumikia na kuinamia miungu mingine
  choice: 'Maneno yote mawili yamehifadhiwa: ‘kuitumikia ... na kuiinamia’'
  alternative: ‘kuiabudu miungu mingine’ pekee
  rationale: Chanzo kina vitenzi viwili tofauti, עבד na השתחוה; kuvihifadhi huepuka kufuta msisitizo na upana wa onyo.
- issue: Mhusika anayezungumziwa katika wingi
  choice: ‘mtageuka ... mbele yenu’
  alternative: ‘utakapogeuka ... mbele yako’
  rationale: Vitenzi na viwakilishi vya Kiebrania ni vya nafsi ya pili wingi, vikilihusu kundi linaloambiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kifungu cha Maandiko. Kauli ya masharti na mfululizo wa matendo umehifadhiwa; koma ya mwisho inaonyesha sentensi inaendelea katika mstari unaofuata.
