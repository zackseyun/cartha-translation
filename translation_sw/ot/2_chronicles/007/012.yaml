  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: sw
  text: Kisha Yahwe akamtokea Sulemani usiku[a], akamwambia, “Nimesikia sala yako, nami nimejichagulia mahali hapa pawe nyumba ya dhabihu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa usiku.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, mahali palipotengwa kwa ajili ya ibada ya kutoa dhabihu.
    reason: clarification
lexical_decisions:
- source_word: וַיֵּרָא
  choice: akamtokea
  rationale: Kauli ya Niphal ya ראה hapa inaonyesha Yahwe kujidhihirisha kwa Sulemani. “Akamtokea” ni usemi wa kawaida na wenye hadhi katika Kiswahili bila kubainisha namna ya kutokea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la Kiebrania limeandikwa kwa unukuzi unaolingana na tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: בַּלָּיְלָה
  choice: usiku
  rationale: “Usiku” ni tafsiri ya asili na fupi ya mazingira ya wakati yanayoonyeshwa na kihusishi בְּ pamoja na לַיְלָה.
- source_word: שָׁמַעְתִּי אֶת־תְּפִלָּתֶךָ
  choice: Nimeisikia sala yako
  rationale: Wakati timilifu “nimeisikia” unaonyesha tendo lililokamilika ambalo lina umuhimu katika jibu la sasa la Mungu; “sala” ndilo neno la kawaida la תְּפִלָּה.
- source_word: וּבָחַרְתִּי בַּמָּקוֹם הַזֶּה לִי
  choice: nami nimejichagulia mahali hapa
  rationale: “Nimejichagulia” huonyesha kwamba Yahwe amepachagua mahali hapa kwa ajili yake mwenyewe, huku “nami” ikihifadhi uhusiano wa sentensi na kauli iliyotangulia.
- source_word: לְבֵית זָבַח
  choice: pawe nyumba ya dhabihu
  rationale: Tafsiri hii inadumisha taswira halisi ya “nyumba ya dhabihu,” huku “pawe” ikionyesha kusudi ambalo mahali hapo pamechaguliwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu, si cheo; kwa hiyo unukuzi “Yahwe” unahifadhi tofauti hiyo.
- issue: Maana ya לְבֵית זָבַח
  choice: nyumba ya dhabihu
  alternative: mahali pa kutolea dhabihu
  rationale: “Nyumba ya dhabihu” huhifadhi usemi wa Kiebrania na utambulisho wa hekalu kama nyumba iliyotengwa kwa ibada ya dhabihu. Maana ya kimatumizi imetolewa katika tanbihi bila kuibadilisha kimya kimya katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “nimejichagulia” ni wa asili katika Kiswahili na unaonyesha nguvu ya לִי bila kuwa mzito; “nyumba ya dhabihu” huhifadhi taswira ya chanzo.
