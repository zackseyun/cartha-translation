base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: sw
  text: Mfalme Sulemani akatoa dhabihu za ng’ombe elfu ishirini na mbili na za kondoo elfu mia moja na ishirini[a], na mfalme pamoja na watu wote wakaiweka wakfu nyumba ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifugo midogo,” kwa kuwa neno la Kiebrania linaweza kuwajumuisha kondoo na mbuzi kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: akatoa dhabihu
  rationale: Katika muktadha wa ibada, kitenzi זבח humaanisha kuchinja au kutoa kitu kama dhabihu. ‘Akatoa dhabihu’ ni Kiswahili cha kawaida na huhifadhi maana ya ibada.
- source_word: זֶבַח הַבָּקָר
  choice: ng’ombe
  rationale: בקר hurejelea mifugo mikubwa ya jamii ya ng’ombe; ‘ng’ombe’ ni neno la kawaida na linalofaa kwa idadi hii.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: elfu ishirini na mbili
  rationale: Huu ni uwasilishaji wa kawaida wa namba 22,000 katika Kiswahili cha sasa.
- source_word: וְצֹאן
  choice: kondoo
  rationale: צאן ni jina la pamoja la mifugo midogo, hasa kondoo na mbuzi. ‘Kondoo’ ni tafsiri fupi na ya kawaida, huku upana wa maana ukihifadhiwa katika tanbihi.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: elfu mia moja na ishirini
  rationale: Huu ni uwasilishaji wa kawaida wa namba 120,000 katika Kiswahili.
- source_word: וַיַּחְנְכוּ
  choice: wakaiweka wakfu
  rationale: חנך hapa humaanisha kuweka rasmi kwa matumizi matakatifu au kuzindua. ‘Wakaiweka wakfu’ ni ya asili katika muktadha wa nyumba ya Mungu.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii hufuata moja kwa moja usemi wa Kiebrania na bado ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: mfalme na watu wote
  rationale: Huhifadhi kurudi kwa maandishi ya Kiebrania kutoka kwa jina Sulemani hadi cheo ‘mfalme,’ pamoja na ushiriki wa watu wote.
