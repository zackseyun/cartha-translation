    rationale: “Ndani” inawezekana kimsingi, lakini si mbadala unaoeleza kwa karibu tofauti ya usemi wa tafsiri kuu. Tanbihi iliyorekebishwa huhifadhi mbadala wa kimsamiati bila kupanua maana.
