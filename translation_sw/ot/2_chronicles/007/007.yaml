id: 2CH.7.7
reference: 2 Chronicles 7:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: sw
  text: Ndipo Sulemani akaitakasa sehemu ya katikati ya ua[a] uliokuwa mbele ya nyumba ya Yahwe, kwa maana hapo alitoa[b] sadaka za kuteketezwa na sehemu za mafuta za sadaka za amani[c], kwa sababu madhabahu ya shaba ambayo Sulemani aliifanya haikuweza kutoshea sadaka ya kuteketezwa, sadaka ya nafaka, na sehemu za mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katikati ya ua.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “alifanya”; katika lugha ya dhabihu maana yake ni “alitoa.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “sehemu za mafuta za sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: akaitakasa
  rationale: Kitenzi hiki katika Hifili kinaonyesha kutenga eneo kwa matumizi matakatifu. ‘Akaitakasa’ ni lugha ya kawaida ya kibiblia na inadumisha maana ya kiibada.
- source_word: תּוֹךְ הֶחָצֵר
  choice: sehemu ya katikati ya ua
  rationale: תּוֹךְ inaweza kumaanisha katikati au sehemu ya ndani. Tafsiri kuu inafuata maana ya mahali pa katikati, huku tanbihi ikihifadhi uwezekano wa ‘sehemu ya ndani.’
- source_word: לִפְנֵי בֵית יְהוָה
  choice: mbele ya nyumba ya Yahwe
  rationale: לִפְנֵי ina maana ya mahali hapa, na ‘nyumba ya Yahwe’ inadumisha taswira ya Kiebrania ya jengo la hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: עָשָׂה שָׁם
  choice: hapo alitoa
  rationale: Ingawa עָשָׂה kimsingi ni ‘alifanya,’ katika muktadha wa dhabihu ni nahau yenye maana ya kutoa dhabihu.
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: sadaka za kuteketezwa / sadaka ya kuteketezwa
  rationale: 'Umoja na wingi wa Kiebrania umehifadhiwa: kwanza ni sadaka nyingi zilizotolewa, kisha ni aina ya sadaka inayotajwa kwa umoja.'
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: sehemu za mafuta za sadaka za amani
  rationale: חֵלֶב hapa ni sehemu maalumu za mafuta zilizotolewa madhabahuni, si ubora kwa maana ya sitiari. שְׁלָמִים imetafsiriwa kwa istilahi iliyozoeleka ‘sadaka za amani.’
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: madhabahu ya shaba
  rationale: ‘Shaba’ ni neno la kisasa na linaloeleweka kwa nyenzo ya madhabahu katika muktadha huu.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: haikuweza kuchukua
  rationale: Usemi huu unaonyesha kwamba madhabahu haikuwa na uwezo wa kupokea kiasi chote cha dhabihu; ‘kuchukua’ ni Kiswahili cha kawaida katika maana hiyo.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa ibada מִנְחָה ni sadaka ya nafaka, si zawadi au ushuru kwa maana pana.
- source_word: הַחֲלָבִים
  choice: sehemu za mafuta
  rationale: Wingi huu unarejelea vipande vya mafuta ya dhabihu; ‘sehemu za mafuta’ ni wazi kuliko tafsiri ya neno kwa neno ‘mafuta.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina na kulitolea tahajia inayolingana na matumizi ya Kiswahili bila kulibadilisha kuwa cheo.
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: Neno linaweza kuhusishwa na amani, ustawi na ushirika wa mlo wa dhabihu. ‘Sadaka za amani’ ni istilahi inayotambulika, na tanbihi inadumisha tafsiri mbadala bila kufungia maana katika wazo moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za kiibada zimetumiwa kwa uthabiti; sentensi ndefu ya Kiebrania imegawanywa mara mbili ili kupata mtiririko wa asili bila kupoteza uhusiano wa sababu.
