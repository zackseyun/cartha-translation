base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: sw
  text: Wakati huo Sulemani aliadhimisha sikukuu kwa siku saba, pamoja na Israeli yote—kusanyiko kubwa sana—kutoka Lebo-hamathi[a] mpaka Kijito cha Misri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuanzia mahali pa kuingilia Hamathi.” Kiebrania kinaweza kueleweka ama kama jina la mahali (“Lebo-hamathi”) ama kama maelezo ya mpaka.
    reason: alternative_reading
  - marker: b
    text: Au, “Wadi ya Misri.” Neno la Kiebrania linaweza kumaanisha mkondo wa maji wa msimu au kijito, badala ya mto mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: aliadhimisha
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha ‘alifanya,’ kinapotumiwa pamoja na חָג kina maana ya kusherehekea au kuadhimisha sikukuu. ‘Aliadhimisha’ ni Kiswahili cha kawaida na chenye heshima katika muktadha huu.
- source_word: הֶחָג
  choice: sikukuu
  rationale: חָג ni sikukuu, hasa sikukuu iliyohusisha hija. ‘Sikukuu’ ni neno la kawaida la Kiswahili na linahifadhi kibainishi cha Kiebrania kwa kuelekeza kwenye sikukuu inayojulikana katika muktadha.
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kihusishi ‘kwa’ kinaonyesha muda ambao sikukuu iliadhimishwa kwa Kiswahili cha asili.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: pamoja na Israeli yote
  rationale: Inahifadhi matumizi ya ‘Israeli’ kama jina la jumla la taifa na maana ya kuwa pamoja na Sulemani, bila kulazimisha ufafanuzi zaidi.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: kusanyiko kubwa sana
  rationale: ‘Kusanyiko’ linafaa kwa קָהָל katika simulizi hili na haliongezi maana maalumu ya kidhehebu; ‘kubwa sana’ linawakilisha nguvu ya מְאֹד.
- source_word: מִלְּבוֹא חֲמָת
  choice: kutoka Lebo-hamathi
  rationale: Usemi huu unaweza kuwa jina la mahali au maelezo ya mpaka. Maandishi makuu yanahifadhi uwezekano wa jina la mahali, huku tanbihi ikionyesha usomaji mwingine.
- source_word: עַד נַחַל מִצְרַיִם
  choice: mpaka Kijito cha Misri
  rationale: נַחַל mara nyingi ni kijito, korongo lenye maji ya msimu, au wadi, si lazima mto mkubwa. ‘Kijito’ ni neno linaloeleweka kwa urahisi, na tanbihi inatoa ‘Wadi’ kama istilahi sahihi zaidi ya kijiografia.
