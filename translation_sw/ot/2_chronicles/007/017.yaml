base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: sw
  text: Nawe, ukienda mbele yangu kama Daudi baba yako alivyoenda, ukifanya yote niliyokuamuru, na ukizishika sheria zangu na hukumu zangu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maamuzi yangu ya kisheria” badala ya “hukumu zangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nawe
  rationale: Kiwakilishi kilichotangulizwa pamoja na kiunganishi kinakazia kwamba sasa Mungu anamwelekea Sulemani moja kwa moja; “Nawe” ni usemi wa kawaida na wenye mkazo katika Kiswahili.
- source_word: אִם
  choice: uki-
  rationale: Kiambishi cha masharti “uki-” kinawasilisha kwa uwazi sharti linaloongoza sentensi nzima.
- source_word: תֵּלֵךְ לְפָנַי
  choice: ukienda mbele zangu
  rationale: Kinahifadhi taswira ya Kiebrania ya kwenda mbele za Mungu, yaani kuishi katika uwepo wake na kwa kuwajibika kwake, bila kuibadili kuwa ufafanuzi wa kimadhehebu.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: kama Daudi baba yako alivyoenda
  rationale: Kinadumisha ulinganisho wa moja kwa moja na kurudia taswira ileile ya “kwenda,” huku mpangilio wa Kiswahili ukiwa wa kawaida.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: ukifanya yote niliyokuamuru
  rationale: Umbo la “ukifanya” linaonyesha tendo linaloandamana na kwenda chini ya sharti moja, badala ya kuligeuza kuwa amri huru; “yote” linahifadhi nguvu ya כְּכֹל.
- source_word: חֻקַּי
  choice: sheria zangu
  rationale: “Sheria” ni neno la sasa, linaloeleweka kwa urahisi, kwa masharti yaliyowekwa; muktadha na kivumishi “zangu” huhifadhi maana ya agano.
- source_word: וּמִשְׁפָּטַי
  choice: hukumu zangu
  rationale: “Hukumu” linatunza utofauti na חֻקַּי na maana ya maamuzi au maagizo ya kisheria; “maagizo” ni uwezekano mwingine unaofafanuliwa katika tanbihi.
- source_word: תִּשְׁמֹר
  choice: kuzishika
  rationale: “Kushika” ni usemi wa kawaida wa kibiblia na wa Kiswahili kwa kutii au kuzingatia sheria; umbo la kitenzi-jina linaendelea chini ya sharti lililoanzishwa na “ukienda.”
theological_decisions:
- issue: Kuhifadhi sharti la utii wa agano bila kuingiza teolojia ya kustahili
  choice: 'Kudumisha muundo wa sharti: “ukienda... ukifanya... na kuzishika...”'
  alternative: Kufupisha kuwa “ukiwa mwaminifu kwangu” au kupunguza nguvu ya sharti
  rationale: Kiebrania kinaweka sharti halisi kwa Sulemani. Tafsiri inalihifadhi wazi bila kulifanya dai pana kuhusu namna wokovu unavyopatikana wala kulilegeza kwa sababu za kimafundisho.
- issue: Uhusiano wa וְלַעֲשׂוֹת na sharti kuu
  choice: “ukifanya” kama tendo linaloandamana na “ukienda”
  alternative: “na ufanye” kama kitenzi amri au kishazi huru
  rationale: וְלַעֲשׂוֹת ni kitenzi-jina chenye kiunganishi, si kitenzi kikomo; “ukifanya” hudumisha uhusiano wake na sharti kuu kwa Kiswahili cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya “kwenda mbele zangu” imehifadhiwa kwa sababu inaeleweka na inadumisha nahau ya agano. Alama ya tanbihi imewekwa mara baada ya kirai kinachohusika.
