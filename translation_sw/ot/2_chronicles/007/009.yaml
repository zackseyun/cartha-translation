  text: וַֽ/יַּעֲשׂ֛וּ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י עֲצָ֑רֶת כִּ֣י חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ עָשׂוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/הֶ/חָ֖ג שִׁבְעַ֥ת יָמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: sw
  text: Siku ya nane walifanya kusanyiko maalumu[a], kwa maana waliadhimisha kuwekwa wakfu kwa madhabahu kwa siku saba, na sikukuu kwa siku saba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusanyiko” au “kusanyiko la kuhitimisha.” Neno la Kiebrania linamaanisha mkusanyiko maalumu wa mwisho katika mazingira ya sikukuu takatifu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinaweza pia kueleweka: “kwa maana walifanya kuwekwa wakfu kwa madhabahu kwa siku saba, na sikukuu kwa siku saba.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Hufuata kwa karibu usemi wa Kiebrania bila kuongeza maelezo kwamba ilikuwa siku ya nane ya sikukuu.
- source_word: עֲצָרֶת
  choice: kusanyiko maalumu
  rationale: Neno hili linamaanisha mkusanyiko maalumu wa kuhitimisha katika mazingira ya sikukuu takatifu; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha ufafanuzi wa sababu au msingi wa kusanyiko la siku ya nane.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: kuwekwa wakfu kwa madhabahu
  rationale: Hueleza tendo la ibada la kuizindua au kuitenga madhabahu kwa matumizi matakatifu, bila kuingiza maana ya dhehebu fulani.
- source_word: עָשׂוּ
  choice: waliadhimisha
  rationale: Ingawa kitenzi kimsingi ni ‘walifanya,’ hapa kinaeleza kutekelezwa kwa sherehe ya kidini; ‘waliadhimisha’ ni ya asili katika Kiswahili.
- source_word: וְהֶחָג
  choice: na sikukuu
  rationale: Huhifadhi nomino yenye uainisho katika muktadha wa sikukuu inayojulikana, bila kuitaja wazi Sikukuu ya Vibanda ndani ya mstari huu.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Usemi huu unaonyesha muda kwa Kiswahili cha kawaida na kudumisha marudio ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Tafsiri inadumisha muundo wa siku saba pamoja na siku saba, na inaacha wazi uhusiano halisi wa vipindi hivyo kama ulivyo katika Kiebrania.
