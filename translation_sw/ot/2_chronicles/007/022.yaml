source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: sw
  text: Nao watasema, “Kwa sababu walimwacha Yahwe, Mungu wa baba zao, aliyewatoa katika nchi ya Misri, wakashikamana na miungu mingine[a], wakazisujudia na kuzitumikia, ndiyo maana amewaletea maafa haya yote[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaishikilia miungu mingine.” Kitenzi cha Kiebrania kwa msingi humaanisha kushika kwa nguvu, na hapa kinaonyesha kuambatana na miungu mingine kwa makusudi.
    reason: lexical_alternative
  - marker: b
    text: “Maafa” hapa yanamaanisha msiba au hukumu, si ubaya wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Nao watasema
  rationale: Wakati ujao unaendeleza utabiri wa mstari uliotangulia; “Nao” huunganisha kauli hii na muktadha kwa Kiswahili cha kawaida.
- source_word: עַל אֲשֶׁר
  choice: Kwa sababu
  rationale: Kirai hiki kinaanzisha sababu ya wazi ya maafa yaliyotokea.
- source_word: עָזְבוּ
  choice: walimwacha
  rationale: Kitenzi kinaonyesha kumwacha Mungu kwa kuvunja uaminifu wa agano; “walimwacha” ni cha asili na kina uzito unaofaa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Huhifadhi uhusiano wa kihistoria na wa agano kati ya Mungu na vizazi vilivyowatangulia.
- source_word: הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: aliyewatoa katika nchi ya Misri
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi unaorejelea tukio la Kutoka Misri.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: wakashikamana na miungu mingine
  rationale: “Kushikamana na” huwasilisha kushika kwa makusudi na kuambatana kwa dhati bila kufanya sitiari ya Kiebrania kuwa ngumu katika Kiswahili.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: wakaisujudia
  rationale: Huhifadhi tendo la kuinama au kusujudu mbele ya miungu hiyo, tofauti na kitenzi kinachofuata cha kuitumikia.
- source_word: וַיַּעַבְדוּם
  choice: na kuitumikia
  rationale: Huhifadhi maana ya utumishi wa kidini na utofauti wake na kusujudu.
- source_word: עַל כֵּן
  choice: ndiyo maana
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachoonyesha matokeo yanayotokana na sababu iliyotangulia.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: amewaletea
  rationale: Kauli ya wakati timilifu inafaa kwa maelezo ya hali ya uharibifu inayoonekana sasa.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: maafa haya yote
  rationale: Katika muktadha huu רָעָה humaanisha msiba au hukumu iliyowapata, si ubaya wa kimaadili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya uasi na maafa
  choice: ndiyo maana amewaletea maafa haya yote
  alternative: kwa hiyo maafa haya yote yamewapata
  rationale: Huhifadhi dai la wazi la maandishi kwamba Mungu ndiye aliyeleta hukumu hiyo, bila kulifanya tendo hilo kuwa tukio lisilo na mtendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi jina la Mungu, mlolongo wa matendo ya ibada, na sababu pamoja na matokeo yaliyo wazi katika Kiebrania.
