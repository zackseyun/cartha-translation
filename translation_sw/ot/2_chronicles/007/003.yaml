language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: sw
  text: 'Waisraeli wote[a] walipoona moto ukishuka na utukufu wa Yahwe ukiwa juu ya hekalu[b], wakapiga magoti sakafuni, wakainamisha nyuso zao mpaka chini, wakamwabudu na kumshukuru Yahwe wakisema,


    “Kwa maana yeye ni mwema;

    kwa maana upendo wake thabiti[c] unadumu milele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “wana wote wa Israeli,” usemi wa pamoja unaomaanisha watu wote wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “nyumba”; hapa maana yake ni hekalu.
    reason: cultural_note
  - marker: c
    text: Au “rehema yake” au “uaminifu wake wa agano.” Neno la Kiebrania חֶסֶד linajumuisha upendo wenye ushikamanifu na uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Ingawa maneno halisi ni ‘wana wote wa Israeli,’ huu ni usemi wa pamoja unaowataja watu wote wa Israeli. ‘Waisraeli wote’ ni Kiswahili cha kawaida na chenye maana ileile bila kudokeza wanaume pekee.
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: walipoona moto ukishuka
  rationale: Muundo huu unaonyesha walishuhudia kushuka kwa moto. ‘Walipoona ... ukishuka’ huwasilisha kwa kawaida tendo lililokuwa likitokea wakati huo.
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: na utukufu wa Yahwe ukiwa juu ya hekalu
  rationale: כָּבוֹד ni utukufu wa Mungu unaodhihirika. בַּיִת ni ‘nyumba’ kihalisi, lakini katika muktadha huu ni hekalu, hivyo ‘hekalu’ huzuia utata usio wa lazima.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: wakapiga magoti sakafuni, wakainamisha nyuso zao mpaka chini
  rationale: 'Tafsiri hii inaonyesha kwa lugha ya kawaida hali ya kujishusha chini kifudifudi: kupiga magoti na kuelekeza nyuso chini juu ya sakafu iliyotandazwa.'
- source_word: וַיִּשְׁתַּחֲווּ
  choice: wakamwabudu
  rationale: Kitenzi kinaweza kueleza kusujudu au kuinama kwa ibada. Kwa kuwa mkao wa mwili umetajwa tayari, ‘wakamwabudu’ huonyesha kusudi la tendo bila marudio mazito.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: na kumshukuru Yahwe
  rationale: Katika mwitiko huu wa ibada, ידה ina maana ya kutoa shukrani au sifa. ‘Kumshukuru’ inafaa kwa kauli inayofuata kuhusu wema wa Yahwe.
- source_word: כִּי טוֹב
  choice: Kwa maana yeye ni mwema
  rationale: Huu ni mwitiko wa kawaida wa kiliturujia. Kiwakilishi ‘yeye’ kimewekwa wazi kwa Kiswahili cha asili, ingawa hakijaandikwa moja kwa moja katika Kiebrania.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: kwa maana upendo wake thabiti wadumu milele
  rationale: חֶסֶד huunganisha upendo, uaminifu na ushikamanifu wa agano. ‘Upendo wake thabiti’ huhifadhi upana huo, na ‘wadumu milele’ huwasilisha לְעוֹלָם kwa Kiswahili fasaha.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חַסְדּוֹ katika mwitiko wa ibada
  choice: upendo wake thabiti
  alternative: rehema yake; uaminifu wake wa agano
  rationale: Neno hilo lina maana pana ya fadhili, upendo wa kudumu na uaminifu wa agano. Chaguo hili halilipunguzi kuwa hisia tu wala rehema pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili, huku taswira ya moto, utukufu, kujishusha sakafuni na mwitiko wa ibada ikihifadhiwa.
