base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: sw
  text: ndipo nitathibitisha kiti cha enzi cha ufalme wako, kama nilivyofanya agano na Daudi baba yako, nikisema, ‘Hutakosa mtu wa kutawala Israeli.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Mtu wa kutawala Israeli hatakatiliwa mbali kutoka kwako.”
    reason: Huonyesha taswira halisi ya Kiebrania iliyo nyuma ya nahau “hutakosa mtu.”
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: ndipo nitakapokithibitisha
  rationale: Hifili ya קום ina maana ya kukifanya kitu kisimame imara au kukithibitisha. “Ndipo” huonyesha kuwa ahadi hii ni matokeo ya sharti lililotangulia.
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: kiti cha ufalme wako
  rationale: 'Tafsiri hii inahifadhi nomino zote mbili katika mnyororo wa Kiebrania: “kiti” na “ufalme.”'
- source_word: כַּאֲשֶׁר כָּרַתִּי
  choice: kama nilivyofanya agano
  rationale: Kitenzi כרת katika muktadha huu ni nahau ya kufanya agano; Kiswahili cha kawaida huhitaji kutaja “agano” waziwazi.
- source_word: לְדָוִיד אָבִיךָ
  choice: na Daudi baba yako
  rationale: “Na” huonyesha mhusika mwingine wa agano kwa njia ya kawaida katika Kiswahili. “Baba” limehifadhiwa, ingawa hapa linamtaja babu wa ukoo na mtangulizi wa kifalme.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Hutakosa mtu
  rationale: Kauli ya Kiebrania, kihalisi “mtu hatakatiliwa mbali kutoka kwako,” ni nahau ya kuendelea kwa ukoo; “hutakosa mtu” huwasilisha maana hiyo kwa Kiswahili cha asili bila kubadili ahadi kuwa ya mtu mmoja tu.
- source_word: מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: wa kutawala Israeli
  rationale: Kirai hiki kinawasilisha kazi ya mrithi wa kifalme; “kutawala Israeli” ni Kiswahili cha kawaida kwa mamlaka juu ya taifa.
theological_decisions:
- issue: Maneno ya ahadi kuhusu kuendelea kwa nasaba ya Daudi
  choice: Hutakosa mtu wa kutawala Israeli
  alternative: Mtu wa kutawala Israeli hatakatiliwa mbali kutoka kwako
  rationale: Chaguo kuu linatoa maana ya nahau ya Kiebrania kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi picha halisi ya “kukatiliwa mbali.” Halifafanui zaidi namna au masharti ya kutimizwa kwa ahadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa agano na maneno ya kifalme yamehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
