  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: sw
  text: Nayo nyumba hii[a], iliyokuwa imetukuka, kila mtu atakayepita kando yake atapigwa na butwaa[b] na kusema, “Kwa nini Yahwe ameifanyia nchi hii na nyumba hii hivi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “atashangaa kwa hofu.” Kitenzi cha Kiebrania kinaweza kuonyesha kushtushwa na ukiwa unaoonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: Nayo nyumba hii
  rationale: ‘Nyumba’ hudumisha maana ya kawaida ya בַּיִת na mwangwi wake wa kiagano, huku muktadha ukionyesha kuwa ni hekalu.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: iliyokuwa imetukuka
  rationale: עֶלְיוֹן hapa inaonyesha hadhi na ukuu wa nyumba hiyo wa awali, si mahali pake pa kijiografia tu.
- source_word: לְכָל עֹבֵר עָלָיו
  choice: kila mtu atakayepita kando yake
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza wapita-njia wanaoliona eneo hilo; ‘kila mtu’ pia huandaa kitenzi cha umoja kinachofuata.
- source_word: יִשֹּׁם
  choice: atapigwa na butwaa
  rationale: Kitenzi שמם kinaweza kueleza kushtushwa au kuogopa kwa sababu ya ukiwa. Muundo wa Kiebrania unamfanya mpita-njia kuwa mhusika wa kitenzi, hivyo tafsiri hii haibadilishi nyumba kuwa mhusika.
- source_word: וְאָמַר
  choice: na kusema
  rationale: Kitenzi cha umoja kinaendana na usemi wa kugawa ‘kila mtu’; Kiswahili hudumisha uhusiano huo kwa kawaida.
- source_word: בַּמֶּה
  choice: Kwa nini
  rationale: Ingawa kihalisi ni ‘kwa sababu ya nini?’, ‘Kwa nini’ ni swali la kawaida na sahihi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: כָּכָה
  choice: hivi
  rationale: ‘Hivi’ ni namna ya asili ya Kiswahili ya kurejelea hali inayoonekana iliyosababishwa na hukumu.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: nchi hii na nyumba hii
  rationale: ‘Nchi’ inafaa kwa אֶרֶץ katika muktadha huu, na kurudia ‘nyumba’ kunadumisha msamiati wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Mhusika na maana ya יִשֹּׁם
  choice: kila mpita-njia atapigwa na butwaa
  alternative: nyumba itakuwa kitu cha kutisha; nyumba itakuwa ukiwa
  rationale: Kwa sarufi ya Kiebrania, ‘kila anayepita’ ndiye mhusika wa kitenzi. Tafsiri hii huhifadhi mshtuko unaotokana na uharibifu bila kuamua kwamba kitenzi kinamaanisha ukiwa wa jengo pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Atapigwa na butwaa’ ni usemi wa kawaida wenye uzito unaofaa muktadha wa hukumu; ‘imetukuka’ hudumisha hadhi ya hekalu bila kuifanya sentensi kuwa ya kizamani.
