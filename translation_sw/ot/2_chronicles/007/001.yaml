base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: sw
  text: Sulemani alipomaliza kuomba, moto ukashuka kutoka mbinguni ukaziteketeza sadaka ya kuteketezwa na dhabihu, na utukufu wa Yahweh ukaijaza nyumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yaani, hekalu; Kiebrania: “nyumba.”'
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: Solomoni alipomaliza kuomba
  rationale: Muundo wa wakati wenye kitenzi כלה unaonyesha kwamba tukio linalofuata lilitokea baada ya Solomoni kumaliza kusali; Kiswahili hiki ni cha kawaida na hakiongezi wazo la uharaka lisilo lazima.
- source_word: וְהָאֵשׁ יָרְדָה מֵהַשָּׁמַיִם
  choice: moto ukashuka kutoka mbinguni
  rationale: ‘Ukashuka’ huhifadhi mwendo wa kushuka na kuendeleza simulizi kwa kawaida. ‘Mbinguni’ ni tafsiri ya kawaida ya שׁמים katika usemi huu.
- source_word: וַתֹּאכַל
  choice: na kuteketeza
  rationale: Ingawa kitenzi kina maana ya msingi ya ‘kula,’ kinapotumiwa kuhusu moto humaanisha kuteketeza kabisa.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno mahususi la dhabihu iliyoteketezwa madhabahuni, na linaitofautisha na dhabihu zinazotajwa baada yake.
- source_word: וְהַזְּבָחִים
  choice: na dhabihu nyingine
  rationale: Wingi זבחים unarejelea dhabihu tofauti na sadaka mahususi ya kuteketezwa; ‘nyingine’ huonyesha tofauti hiyo iliyo wazi katika muktadha bila kubadili maana.
- source_word: וּכְבוֹד יְהוָה
  choice: nao utukufu wa Yahweh
  rationale: כבוד hapa ni udhihirisho wa utukufu wa Mungu, na jina la agano יְהוָה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: ukaijaza nyumba
  rationale: ‘Nyumba’ huhifadhi neno halisi בית; katika muktadha linamaanisha hekalu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo. ‘Yahweh’ huhifadhi jina hilo kwa namna ya karibu na Kiebrania.
- issue: Rejeo la הַבָּיִת
  choice: nyumba
  alternative: hekalu
  rationale: Kiebrania kinasema ‘nyumba,’ ingawa katika muktadha ni hekalu. Tafsiri kuu huhifadhi taswira ya chanzo, huku tanbihi ikifafanua rejeo lake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Tanbihi ya toleo la Kiingereza kuhusu ‘descended from heaven’ haikuhamishwa kwa sababu imehusishwa kimakosa na ‘praying’; ‘ukashuka kutoka mbinguni’ tayari huwasilisha maana hiyo wazi.
