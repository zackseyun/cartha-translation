base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: sw
  text: Nitakapozifunga mbingu ili mvua isinyeshe[a], au nitakapowaamuru nzige waile nchi, au nitakapotuma tauni miongoni mwa watu wangu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nikizifunga mbingu ...”; kwa kufuata Kiebrania kwa karibu zaidi, “Tazama, nikizifunga mbingu ...”
    reason: lexical_alternative
  - marker: b
    text: Au, “ugonjwa wa kuambukiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Nitakapozifunga
  rationale: Chembe הֵן hapa inaanzisha hali inayowezekana katika mfululizo wa masharti. Muundo wa “nitakapo-” ni wa kawaida katika Kiswahili na unaunganisha mstari huu kwa urahisi na sharti la mwitikio katika mstari unaofuata, huku tanbihi ikihifadhi uwezekano wa tafsiri ya “niki-” au “tazama, niki-”.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: Nitakapozifunga mbingu
  rationale: “Kufunga mbingu” huhifadhi taswira halisi ya kitenzi עצר katika msemo unaomaanisha kuzuia mvua. Kiambishi “zi-” kinakubaliana na “mbingu” katika Kiswahili sanifu.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: ili mvua isinyeshe
  rationale: Muundo huu unaonyesha wazi matokeo au kusudi la kufungwa kwa mbingu, kwa Kiswahili cha kawaida, bila kupunguza taswira ya chanzo.
- source_word: אֲצַוֶּה עַל חָגָב
  choice: kuwaamuru nzige
  rationale: חָגָב ni umoja wenye maana ya kundi. Kiswahili hutumia kwa kawaida wingi “nzige” kwa kundi la wadudu hao, na “kuwaamuru” huhifadhi wazi uwezo na utendaji wa Mungu.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: wale mazao ya nchi
  rationale: Kitenzi kimsingi ni “kula,” lakini “nchi” hapa ni matumizi ya kimajazi kwa kile kinachoota humo na kinachoweza kuliwa na nzige. “Mazao ya nchi” huwasilisha maana hiyo kwa uwazi bila kuongeza aina maalumu ya zao.
- source_word: אֲשַׁלַּח דֶּבֶר
  choice: kutuma tauni
  rationale: “Kutuma” ni kisawe cha moja kwa moja cha שלח na huhifadhi utendaji wa Mungu. “Tauni” ni neno zito na linaloeleweka kwa ugonjwa wa kuambukiza unaoenea kama hukumu.
- source_word: בְּעַמִּי
  choice: miongoni mwa watu wangu
  rationale: Kihusishi ב katika muktadha huu kinaonyesha tauni ikitokea ndani ya jamii; “miongoni mwa” ni wazi na cha asili katika Kiswahili.
theological_decisions:
- issue: Hukumu za Mungu kama hali za masharti
  choice: Kutumia “Nitakapozifunga ... au ... au ...” huku Mungu akibaki mtendaji wa moja kwa moja
  alternative: “Nikiifunga ...” au “Tazama, nikiifunga ...”
  rationale: Chembe za Kiebrania zinaanzisha mfululizo wa matendo ya hukumu yanayowezekana. Muundo uliochaguliwa ni wa asili katika Kiswahili na haupunguzi wala kuficha mamlaka ya Mungu katika matendo hayo; tanbihi inahifadhi utata wa chembe ya mwanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya “kufunga mbingu” imehifadhiwa; “mazao ya nchi” linafafanua matumizi ya kimajazi ya “nchi” katika muktadha wa nzige. Alama zote za tanbihi zimewekwa katika matini kuu.
