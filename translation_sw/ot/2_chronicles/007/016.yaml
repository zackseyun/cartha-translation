language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: sw
  text: Na sasa nimechagua na kuitakasa nyumba hii[a], ili jina langu liwe humo milele[b], na macho yangu na moyo wangu vitakuwa humo siku zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuiweka wakfu kuwa takatifu.” Kitenzi cha Kiebrania kina maana ya kutenga kitu kiwe kitakatifu.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba hii” inarejelea hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi na alama ya mpito katika usemi wa Mungu kwa Kiswahili cha kawaida.
- source_word: בָּחַרְתִּי
  choice: nimeichagua
  rationale: Wakati timilifu wa Kiswahili huonyesha tendo lililokamilika lenye umuhimu wa sasa; kiambishi -i- hurejelea nyumba.
- source_word: וְהִקְדַּשְׁתִּי
  choice: na kuitakasa
  rationale: Katika muktadha huu kitenzi kinamaanisha kuiweka wakfu kuwa takatifu. ‘Kuitakasa’ ni neno la kibiblia linaloeleweka, huku tanbihi ikifafanua maana mahsusi.
- source_word: הַבַּיִת הַזֶּה
  choice: nyumba hii
  rationale: Huhifadhi neno halisi ‘nyumba’ badala ya kulifasiri moja kwa moja kuwa ‘hekalu’; rejeo lake linafafanuliwa katika tanbihi.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: ili jina langu liwe humo
  rationale: ‘Ili’ huonyesha kusudi au matokeo, na ‘jina langu’ huhifadhi lugha mahsusi ya teolojia ya hekalu bila kuibadili kuwa ‘uwepo wangu’.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri fupi na ya kawaida ya muda usio na mwisho au wa kudumu.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: na macho yangu na moyo wangu vitakuwa humo
  rationale: Huhifadhi taswira ya macho na moyo. Upatanisho wa wingi ‘vitakuwa’ unafuata kiima ambatani cha ngeli tofauti kwa matumizi ya kawaida ya Kiswahili.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Ni nahau ya asili ya Kiswahili inayohifadhi picha ya Kiebrania ‘siku zote’ na maana ya daima.
theological_decisions:
- issue: 'Lugha ya kumwelezea Mungu kwa viungo vya mwili: ‘macho yangu na moyo wangu’'
  choice: Kuhifadhi taswira hiyo moja kwa moja
  alternative: ‘uangalizi wangu na kujali kwangu kutakuwa humo’
  rationale: Kiebrania hutumia kwa makusudi macho kuonyesha uangalizi na moyo kuonyesha kujali na kujitoa kwa agano; kufafanua kungepunguza uzito wa taswira.
- issue: Teolojia ya hekalu katika ‘jina langu liwe humo’
  choice: Kuhifadhi ‘jina langu’
  alternative: ‘niwepo humo’ au ‘uwepo wangu uwe humo’
  rationale: ‘Jina’ ni lugha mahsusi ya Agano la Kale kuhusu kujifunua na kuwapo kwa Mungu kwa uhusiano wa agano. Tafsiri mbadala zingefafanua zaidi ya maneno ya chanzo.
- issue: Upeo wa עַד עוֹלָם katika muktadha wa hekalu
  choice: milele
  alternative: daima au kwa wakati wote
  rationale: Tafsiri inahifadhi dai la maandishi lenyewe bila kulitatua kwa kuzingatia historia ya baadaye ya hekalu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja, lakini huhifadhi nahau kuu za Kiebrania: ‘nyumba hii,’ ‘jina langu,’ ‘macho yangu na moyo wangu,’ na ‘siku zote.’'
