  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: sw
  text: ndipo nitawang’oa kutoka nchi yangu niliyowapa, na nyumba hii[a] niliyoiweka wakfu kwa ajili ya jina langu nitaitupa kutoka mbele yangu[b]; nitaifanya kuwa methali na neno la dhihaka miongoni mwa mataifa yote.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yaani, “hekalu hili.” Kiebrania: “nyumba hii.”'
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya nahau, “nitaitupa mbali nisiiangalie tena”; kwa karibu zaidi, “nitaitupa kutoka mbele ya uso wangu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “msemo na kitu cha kejeli miongoni mwa jamii zote za watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: ndipo nitawang’oa
  rationale: Kitenzi נתשׁ kinaonyesha kung’oa kitu kutoka mahali kilipokita; “nitawang’oa” kinahifadhi taswira hiyo na uhusiano wake na nchi. “Ndipo” linaonyesha matokeo ya sharti lililotangulia.
- source_word: מֵעַל אַדְמָתִי
  choice: kutoka katika nchi yangu
  rationale: אֲדָמָה hapa ni ardhi au nchi waliyopewa watu; “nchi yangu” ni Kiswahili cha kawaida na kinadumisha dai la Mungu la umiliki.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: niliyowapa
  rationale: Muundo huu mfupi na wa asili unaonyesha wazi kwamba Mungu ndiye aliyewapa nchi hiyo.
- source_word: הַבַּיִת הַזֶּה
  choice: nyumba hii
  rationale: בַּיִת maana yake ya moja kwa moja ni “nyumba,” ingawa hapa inarejelea hekalu. Maandishi makuu yanahifadhi istilahi ya Kiebrania, na tanbihi inaifafanua.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: niliyoiweka wakfu kwa ajili ya jina langu
  rationale: Hifili ya קדשׁ ina maana ya kutenga kuwa takatifu. “Kuweka wakfu” ni usemi wa sasa unaoeleweka, huku “kwa ajili ya jina langu” kikihifadhi dhana ya jina la Mungu bila kuifafanua kupita kiasi.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: nitaitupa mbali na uso wangu
  rationale: Tafsiri hii inadumisha taswira ya uso iliyo katika Kiebrania na wakati huohuo inaeleza kukataliwa kwa nguvu. Tanbihi inatoa maana ya kiidioma.
- source_word: וְאֶתְּנֶנּוּ
  choice: Nitaifanya kuwa
  rationale: נתן pamoja na nomino za hali hapa ina maana ya kukifanya kitu kiwe na hadhi au matumizi fulani.
- source_word: לְמָשָׁל
  choice: methali
  rationale: מָשָׁל inaweza kuwa methali, msemo, au kauli ya kejeli. “Methali” ni maana ya msingi inayofaa katika jozi hii.
- source_word: לִשְׁנִינָה
  choice: neno la dhihaka
  rationale: שְׁנִינָה huelekea kumaanisha msemo wa kejeli au kitu kinachodhihakiwa. “Neno la dhihaka” linaonyesha fedheha ya hadharani na pia linakaa sambamba na “methali.”
- source_word: בְּכָל הָעַמִּים
  choice: miongoni mwa watu wa mataifa yote
  rationale: עַמִּים ni “jamii za watu” kwa wingi. Usemi huu ni wa asili katika Kiswahili na unaepuka kuifanya istilahi hiyo kuwa ya kisiasa tu.
theological_decisions:
- issue: Istilahi inayolitaja hekalu
  choice: nyumba hii
  alternative: hekalu hili
  rationale: Kiebrania kinasema “nyumba,” neno la kawaida la kibiblia kwa hekalu. Kulihifadhi kunadumisha taswira ya nyumba ya Mungu, huku tanbihi ikihakikisha maana inaeleweka.
- issue: Nahau ya Mungu kulitupa hekalu מֵעַל פָּנַי
  choice: nitaitupa mbali na uso wangu
  alternative: nitaliondoa mbele yangu / machoni pangu
  rationale: “Uso wangu” huhifadhi lugha halisi ya chanzo na mvutano wa kitheolojia wa uso au uwepo wa Mungu, bila kuamua kwamba kauli hiyo inahusu kuona pekee.
- issue: Maana ya jozi מָשָׁל ... שְׁנִינָה
  choice: methali na neno la dhihaka
  alternative: msemo na kitu cha kejeli
  rationale: Jozi hiyo inaunganisha kuwa mfano unaotajwa na watu na kuwa lengo la dharau. Tafsiri iliyochaguliwa inabaki karibu na maneno ya chanzo bila kupunguza yote kuwa dhihaka pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuweka wakfu” na “dhihaka” ni maneno ya sasa na yanayoeleweka; muundo wa sentensi umewekwa wa kawaida bila kuondoa urudiaji na taswira muhimu za Kiebrania.
