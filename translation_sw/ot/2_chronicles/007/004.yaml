translation:
  language: sw
  text: Kisha mfalme na watu wote wakatoa dhabihu mbele za Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maana halisi, “walikuwa wakitoa dhabihu”—muundo wa kitenzi na nomino zenye mzizi mmoja, unaosisitiza tendo la kutoa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Kisha mfalme
  rationale: Kiunganishi וְ kinaendeleza mfululizo wa simulizi; “Kisha” ni cha asili katika Kiswahili na kinaonyesha hatua inayofuata. הַמֶּלֶךְ ni “mfalme.”
- source_word: וְכָל הָעָם
  choice: na watu wote
  rationale: עָם kwa kawaida humaanisha “watu”; hapa inawahusu watu waliokusanyika pamoja na mfalme.
- source_word: זֹבְחִים זֶבַח
  choice: wakatoa dhabihu
  rationale: Kiebrania kina muundo wa kitenzi na nomino zenye mzizi mmoja, kwa maana halisi “wakitoa utoaji wa dhabihu.” Kiswahili cha kawaida na chenye heshima husema “kutoa dhabihu”; umbo “waka-” linaendeleza simulizi bila kuifanya sentensi kuwa nzito.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Huwasilisha tendo lililofanywa mbele ya Mungu au katika uwepo wake; “mbele za” ni usemi wa kawaida katika sajili ya kibiblia ya Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi wa Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” huhifadhi jina hilo kwa umbo linalosomeka kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakatoa dhabihu” ni cha asili kuliko kurudia mzizi kama “wakadhabihu dhabihu,” huku tanbihi ikihifadhi muundo wa Kiebrania. “Mbele za” inadumisha sajili ya kawaida ya maandiko bila kuwa ya kizamani kupita kiasi.
