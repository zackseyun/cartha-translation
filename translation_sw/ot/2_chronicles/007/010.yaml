  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם עֶשְׂרִ֤ים וּ/שְׁלֹשָׁה֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י שִׁלַּ֥ח אֶת הָ/עָ֖ם לְ/אָהֳלֵי/הֶ֑ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣יד וְ/לִ/שְׁלֹמֹ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: sw
  text: Na siku ya ishirini na tatu ya mwezi wa saba, aliwaaga watu waende kwenye mahema yao,[a] wakiwa na furaha na mioyo yenye shangwe kwa sababu ya mema ambayo Yahweh alikuwa amewatendea Daudi, Sulemani, na Israeli watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumbani kwao”; neno kwa neno, “kwenye mahema yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Na siku ya ishirini na tatu ya mwezi wa saba
  rationale: Muundo wa tarehe umetolewa kwa Kiswahili sanifu, huku kiunganishi cha mwanzo kikihifadhi mwendelezo wa simulizi.
- source_word: שִׁלַּח
  choice: aliwaaga ... waende
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwaruhusu au kuwaondoa watu waliokuwa wamekusanyika ili warudi kwao. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha kuwa mkutano ulifungwa na watu wakaondoka.
- source_word: לְאָהֳלֵיהֶם
  choice: kwenye mahema yao
  rationale: Huhifadhi picha halisi ya Kiebrania ya ‘mahema’; maana ya kimuktadha ya kurudi nyumbani imeelezwa katika tanbihi.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: wakiwa na furaha na mioyo yenye shangwe
  rationale: Huwasilisha furaha ya watu na pia huhifadhi lugha ya moyo katika nahau ya Kiebrania.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: kwa sababu ya mema ambayo ... alikuwa amewatendea
  rationale: ‘Mema’ huonyesha tendo jema lenye manufaa, na ‘amewatendea’ huakisi kwa uwazi muundo עשה לְ, yaani kutenda mema kwa ajili ya walengwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: Daudi, Sulemani, na Israeli watu wake
  rationale: Majina haya yanabaki kuwa walengwa wa mema ya Yahweh, na ‘watu wake’ inahifadhi ufafanuzi unaohusishwa na Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi badala ya kuliwakilisha kwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Usemi ‘mioyo yenye shangwe’ huhifadhi taswira ya Kiebrania bila kusikika kuwa wa kizamani kupita kiasi.
