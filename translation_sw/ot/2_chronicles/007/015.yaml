  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַתָּ֗ה עֵינַ/י֙ יִהְי֣וּ פְתֻח֔וֹת וְ/אָזְנַ֖/י קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: sw
  text: Sasa macho yangu yatakuwa wazi, na masikio yangu yatasikiliza kwa makini sala inayotolewa mahali hapa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sala ya mahali hapa” au “sala kutoka mahali hapa.” Kiebrania kinasema kihalisi zaidi, “sala ya mahali hapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Kielezi hiki kinaonyesha matokeo ya sasa ya tukio lililotangulia. “Sasa” ni cha kawaida na hakiongezi kwa lazima maana pana ya “tangu sasa na kuendelea.”
- source_word: עֵינַי
  choice: macho yangu
  rationale: Taswira halisi ya Kiebrania imehifadhiwa badala ya kufafanuliwa kuwa “nitatazama,” ili kudumisha lugha inayomweleza Mungu kwa viungo vya kibinadamu.
- source_word: יִהְיוּ פְתֻחוֹת
  choice: yatakuwa wazi
  rationale: Muundo huu unaeleza hali ya kuwa wazi; tafsiri hii ni ya asili katika Kiswahili na huhifadhi nguvu ya hali hiyo.
- source_word: וְאָזְנַי
  choice: na masikio yangu
  rationale: Imetafsiriwa moja kwa moja ili kuhifadhi ulinganifu na “macho yangu” pamoja na taswira ya Kiebrania.
- source_word: קַשֻּׁבוֹת
  choice: yatasikiliza kwa makini
  rationale: Neno hili linaonyesha usikivu wenye umakini. Muundo wa kitenzi unasomeka kwa kawaida zaidi katika Kiswahili kuliko kusema masikio “yatakuwa makini,” huku maana ya usikivu ikidumishwa.
- source_word: לִתְפִלַּת
  choice: sala
  rationale: Kiambishi ל־ kinaelekeza usikivu kwenye sala. Kiswahili hakihitaji alama ya dhahiri ya “kwa” baada ya kitenzi “kusikiliza.”
- source_word: הַמָּקוֹם הַזֶּה
  choice: inayotolewa mahali hapa
  rationale: Kihalisi ni “ya mahali hapa,” yaani sala inayohusishwa na mahali hapa. Tafsiri kuu inaweka wazi maana inayofaa katika muktadha, huku uwezekano wa “kutoka mahali hapa” ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Lugha inayomweleza Mungu kwa macho na masikio
  choice: Kuhifadhi “macho yangu” na “masikio yangu”
  alternative: Nitatazama na kusikiliza
  rationale: Kiebrania kinatumia taswira ya viungo vya mwili kuonyesha uangalifu wa Mungu. Kuihifadhi huepuka kufifisha nguvu ya kimahusiano ya kauli hiyo.
- issue: Uhusiano wa sala na mahali hapa
  choice: sala inayotolewa mahali hapa
  alternative: sala ya mahali hapa; sala kutoka mahali hapa
  rationale: Muundo wa Kiebrania, “sala ya mahali hapa,” unaweza kuonyesha sala inayotolewa ndani ya mahali hapa au inayotoka hapa. Tafsiri kuu ni ya asili katika muktadha, na tanbihi inadumisha upana wa muundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida; taswira ya macho na masikio imehifadhiwa, na utata halisi wa kirai cha mwisho umeelezwa katika tanbihi.
