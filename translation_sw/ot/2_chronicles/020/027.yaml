base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: sw
  text: Ndipo watu wote wa Yuda na Yerusalemu wakageuka kurejea Yerusalemu kwa furaha, Yehoshafati akiwa mbele yao, kwa sababu Yahwe alikuwa amewafurahisha juu ya adui zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kumaanisha “kutokana na adui zao” au “kwa sababu ya adui zao.” Katika muktadha huu, furaha hiyo yahusiana na kushindwa kwa adui zao.
    reason: Kihusishi מן kinaweza kuonyesha chanzo, sababu, au jambo ambalo furaha inahusiana nalo; tanbihi inadumisha upana huo wa maana.
lexical_decisions:
- source_word: וַיָּשֻבוּ ... לָשׁוּב אֶל־יְרוּשָׁלַם
  choice: wakaanza safari ya kurudi Yerusalemu
  rationale: Mzizi שׁוב umerudiwa katika kitenzi na kitenzi-jina. Kiswahili cha kawaida hakiwezi kurudia ‘kurudi’ hapa bila kuwa kizito; usemi huu unaonyesha kuondoka kwao wakielekea nyumbani na kusudi la kurudi Yerusalemu.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלַם
  choice: watu wote wa Yuda na Yerusalemu
  rationale: Kiebrania kinasema kihalisi ‘kila mtu wa Yuda na Yerusalemu,’ usemi wa kugawa unaomaanisha kundi lote. ‘Watu wote’ ni Kiswahili cha kawaida na kinahifadhi maana ya jumla bila kudai kwamba ni wakazi wote kabisa.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: Yehoshafati akiwa mbele yao
  rationale: בְּרֹאשָׁם inaweza kuonyesha nafasi ya mbele na uongozi. ‘Akiwa mbele yao’ inadumisha taswira ya mahali bila kuondoa maana ya kuwaongoza.
- source_word: בְּשִׂמְחָה
  choice: kwa furaha
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino שִׂמְחָה.
- source_word: שִׂמְּחָם
  choice: alikuwa amewafurahisha
  rationale: Umbo la Piel la שׂמח lina maana ya kusababisha mtu afurahi; kitenzi hiki cha Kiswahili kinadumisha nguvu hiyo ya kisababishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa uhawilishaji wa sauti ‘Yahwe’ badala ya kulibadilisha kuwa cheo.
- source_word: מֵאֹיְבֵיהֶם
  choice: kwa ushindi dhidi ya adui zao
  rationale: Baada ya kitenzi cha kufurahi, מן huonyesha jambo lililosababisha furaha au ambalo furaha inahusiana nalo. Katika muktadha, adui walikuwa wameshindwa; usemi huu ni wa asili katika Kiswahili, huku tanbihi ikihifadhi upana wa muundo wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina maalumu יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Jinsi Mungu alivyowafurahisha kuhusu adui zao
  choice: kwa ushindi dhidi ya adui zao
  alternative: kwa sababu ya adui zao / kutoka kwa adui zao
  rationale: Muktadha unaonyesha furaha ya ushindi, lakini kihusishi מן chenyewe kinaweza kuonyesha chanzo au jambo linalohusika. Tafsiri kuu inalenga maana ya kimuktadha, na tanbihi inaonyesha uwezekano mpana wa kisarufi.
- issue: Usemi wa kiume wa kugawa כָּל אִישׁ
  choice: watu wote wa Yuda na Yerusalemu
  alternative: kila mwanamume wa Yuda na Yerusalemu
  rationale: אִישׁ hapa ni umoja wenye nguvu ya kugawa ndani ya kundi zima. Katika Kiswahili, ‘watu wote’ huwasilisha kazi hiyo kwa ufasaha; muktadha wa jeshi tayari unaonyesha kundi linalorejelewa, na tafsiri haipanui dai zaidi ya kundi hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘wakaanza safari ya kurudi’ huepuka marudio mazito ya mzizi שׁוב lakini hudumisha mwendo wa kurudi. Jina ‘Yehoshafati’ linafuata umbo lililozoeleka katika Kiswahili cha Biblia.
