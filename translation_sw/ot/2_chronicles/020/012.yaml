  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: sw
  text: Ee Mungu wetu, je, hutawahukumu? Kwa maana sisi hatuna nguvu za kukabiliana na umati huu mkubwa unaokuja dhidi yetu. Hatujui la kufanya, lakini macho yetu yako kwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “kwa maana macho yetu yako kwako.”'
    reason: Kihusishi כִּי kinaweza kutafsiriwa “kwa maana”; usemi wa Kiebrania unaonyesha macho yakielekezwa kwa Mungu kwa utegemezi wa matarajio.
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: Ee Mungu wetu
  rationale: Ni mwito wa moja kwa moja katika sala. “Ee” huonyesha mwito huo kwa Kiswahili cha kawaida na chenye heshima, huku “wetu” ikihifadhi ombi la jumuiya.
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: je, hutawahukumu?
  rationale: Muundo wa swali lenye הֲלֹא unatarajia jibu la kukubali. “Kuwahukumu” huhifadhi maana ya kimahakama ya שׁפט bila kuipunguza kuwa kuadhibu tu.
- source_word: אֵין בָּנוּ כֹּחַ
  choice: sisi hatuna nguvu
  rationale: כֹּחַ hapa ni nguvu au uwezo wa kukabiliana na tishio la kijeshi. Kiwakilishi “sisi” kinasisitiza hali yao ya kutokuwa na uwezo.
- source_word: לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: za kukabiliana na umati huu mkubwa
  rationale: לִפְנֵי ni “mbele ya” au “dhidi ya” katika hali ya kukabiliwa. Kiswahili “kukabiliana na” huwasilisha vizuri hali hiyo; הָמוֹן inabaki “umati” bila kufafanuliwa zaidi kuwa jeshi.
- source_word: הַבָּא עָלֵינוּ
  choice: unaokuja dhidi yetu
  rationale: Kitenzi-shirikishi kinaonyesha tishio linalokaribia, na עַל katika muktadha huu linaonyesha uhasama.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: Hatujui la kufanya
  rationale: Ni usemi wa asili na mfupi wa Kiswahili unaohifadhi ungamo la wazi la kutokuwa na suluhisho.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: lakini macho yetu yanakutazama wewe
  rationale: Nahau hiyo huonyesha kumtegemea Mungu kwa matarajio. “Macho yetu yanakutazama” huhifadhi taswira ya Kiebrania, na “wewe” huleta msisitizo uliomo katika mpangilio wa maneno.
theological_decisions:
- issue: Uhusiano wa כִּי ya mwisho na ungamo linalotangulia
  choice: lakini macho yetu yanakutazama wewe
  alternative: kwa maana macho yetu yako kwako
  rationale: כִּי kwa kawaida inaweza kumaanisha “kwa maana,” lakini hapa sala inasonga kutoka kutokujua na kutokuwa na uwezo hadi kumtegemea Mungu. “Lakini” huonyesha mkabala huo kwa Kiswahili cha kawaida bila kuondoa uwezekano wa uhusiano wa kisababu, ambao umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala ya hadhara. Sentensi ni rahisi kueleweka, huku taswira ya “macho” na uzito wa ombi la hukumu vikihifadhiwa.
