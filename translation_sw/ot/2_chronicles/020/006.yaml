id: 2CH.20.6
reference: 2 Chronicles 20:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: sw
  text: akasema, “Ee Yahwe, Mungu wa baba zetu, je, si wewe uliye Mungu mbinguni? Je, hutawali falme zote za mataifa? Mkononi mwako mna nguvu na uweza, wala hakuna awezaye kusimama dhidi yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Muundo huu unaendeleza simulizi; Kiswahili huhitaji kiambishi cha nafsi, na muktadha humtambulisha msemaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Mungu wa baba zetu
  rationale: Huhifadhi umbo la kiume la אבות ואת usemi wa kiagano bila kulipanua kimya kimya kuwa ‘mababu’ au ‘wahenga’.
- source_word: הֲלֹא
  choice: je, si wewe
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: אַתָּה הוּא אֱלֹהִים בַּשָּׁמַיִם
  choice: wewe uliye Mungu mbinguni
  rationale: Huwasilisha utambulisho wenye msisitizo wa Mungu katika eneo la mbinguni kwa Kiswahili cha asili.
- source_word: מוֹשֵׁל
  choice: unatawala
  rationale: Hueleza utawala wa kudumu na wenye mamlaka.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: falme zote za mataifa
  rationale: ‘Falme’ na ‘mataifa’ ni visawe vya moja kwa moja na vya kawaida; ‘zote’ hutokana na כֹל.
- source_word: וּבְיָדְךָ
  choice: Mkononi mwako
  rationale: Huhifadhi taswira ya Kiebrania ya nguvu kuwa katika mkono wa Mungu.
- source_word: כֹּחַ וּגְבוּרָה
  choice: nguvu na uweza
  rationale: Jozi hii inaonyesha uwezo na nguvu yenye matokeo; ‘uweza’ huipa sentensi uzito wa lugha ya sala.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: wala hakuna awezaye kusimama dhidi yako
  rationale: Katika muktadha, התיצב humaanisha kuchukua msimamo wa upinzani; tafsiri huhifadhi taswira ya kusimama dhidi ya Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kina jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Lugha ya kiagano katika אֲבֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu; wahenga wetu
  rationale: Kiebrania kimetumia wingi wa kiume ‘baba’; tafsiri hudumisha umbo hilo na mvutano wake wa kiagano.
- issue: Maana ya kusimama mbele ya Mungu katika לְהִתְיַצֵּב
  choice: kusimama dhidi yako
  alternative: kushindana nawe; kukuhimili
  rationale: Muktadha wa utawala na nguvu unaonyesha upinzani, lakini taswira halisi ya ‘kusimama’ inadumishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa, kisha dai la pili limetolewa kama kauli ya msisitizo kwa mtiririko wa asili wa Kiswahili.
