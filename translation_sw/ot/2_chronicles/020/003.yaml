base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: sw
  text: Yehoshafati akaogopa[a], akaazimia kumtafuta Yahweh[b], na akatangaza mfungo katika Yuda yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaanza kuogopa.” Muundo wa kitenzi cha Kiebrania unaweza kuonyesha kuanza kwa hofu katika mfululizo wa simulizi.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “akaweka uso wake kumtafuta Yahweh,” nahau ya Kiebrania inayoonyesha azimio au nia thabiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: akaogopa
  rationale: Kitenzi ירא hapa kinaonyesha hofu ya Yehoshafati katika mfululizo wa simulizi. “Akaogopa” ni Kiswahili cha kawaida na hakipunguzi hisia hiyo kuwa heshima tu.
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: akaazimia
  rationale: Nahau ya Kiebrania, kwa maana halisi “akaweka uso wake,” inaeleza nia thabiti ya kutenda jambo. “Akaazimia” huwasilisha maana hiyo kwa Kiswahili cha asili bila taswira isiyoeleweka.
- source_word: לִדְרוֹשׁ
  choice: kumtafuta
  rationale: דרש inapomhusu Mungu huonyesha kumwelekea ili kupata msaada au mwongozo. “Kumtafuta” huhifadhi upana wa maana kuliko “kumwuliza.”
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa unukuzi “Yahweh,” kwa kuwa ndilo jina linalotokea moja kwa moja katika matini ya Kiebrania.
- source_word: וַיִּקְרָא צוֹם
  choice: akatangaza mfungo
  rationale: Muungano huu unaonyesha tangazo la hadharani la kufunga; “akatangaza mfungo” ni wa kawaida na unaafiki tendo rasmi la mfalme.
- source_word: עַל כָּל יְהוּדָה
  choice: katika Yuda yote
  rationale: עַל hapa huonyesha eneo au watu wote waliofikiwa na tangazo. “Katika Yuda yote” huwasilisha upeo huo kwa Kiswahili sanifu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini hutumia Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina la agano bila kulibadilisha kuwa cheo; “BWANA” ni mapokeo ya badala, nayo “Yehova” hutokana na muundo wa baadaye wa matamshi.
- issue: Hofu ya Yehoshafati
  choice: akaogopa
  alternative: akaanza kuogopa
  rationale: Wayyiqtol inaweza kusimulia tukio linalofuata na katika muktadha inaweza kudokeza mwanzo wa hofu, lakini matini haisemi wazi kitenzi maalumu cha “kuanza.” Maelezo hayo yamehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya mfululizo “aka-” umehifadhi mtiririko wa simulizi. Nahau “akaweka uso wake” imetolewa kwa maana ya asili “akaazimia,” huku taswira halisi ikihifadhiwa katika tanbihi.
