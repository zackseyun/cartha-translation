base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: sw
  text: Kesho shukeni dhidi yao. Tazameni, wanapanda kwa njia ya mwinuko wa Sisi, nanyi mtawakuta mwishoni mwa korongo[a], mbele ya nyika ya Yerueli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bonde” au “njia ya maji ya msimu.” Neno la Kiebrania נחל linaweza kumaanisha bonde au korongo ambalo maji hupitia, mara nyingi wakati wa mvua.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: Kesho
  rationale: Ni kielezi cha wakati; tafsiri hii haiongezi wazo la asubuhi ambalo halipo wazi katika Kiebrania.
- source_word: רְדוּ עֲלֵיהֶם
  choice: shukeni kwenda kupigana nao
  rationale: Kitenzi kinaeleza kushuka, na kihusishi katika muktadha huu wa kijeshi kinaonyesha kwenda dhidi yao. Kiswahili hiki ni cha kawaida huku kikihifadhi mwelekeo na uhasama wa tendo.
- source_word: הִנָּם
  choice: Tazameni
  rationale: Chembe hii inavuta usikivu wa wasikilizaji wengi kwa jambo linalofuata; ‘Tazameni’ ni ya sasa, yenye hadhi, na si ya kizamani.
- source_word: עֹלִים
  choice: wanapanda
  rationale: Hali ya kushiriki ya עלה inaonyesha mwendo unaoendelea au ulio karibu kutokea; ‘wanapanda’ huhifadhi maana ya mwelekeo bila kuongeza mtazamo usio wa lazima.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: kwa njia ya mwinuko wa Sisi
  rationale: מַעֲלֶה ni sehemu au njia ya kupandia. ‘Kwa njia ya mwinuko’ huwasilisha umbo la eneo kwa Kiswahili cha kawaida, na Sisi ni unukuzi wa jina la mahali.
- source_word: וּמְצָאתֶם אֹתָם
  choice: nanyi mtawakuta
  rationale: Hii ni matokeo ya wakati ujao yanayofuata agizo; ‘mtawakuta’ ni sawia ya moja kwa moja na ya asili.
- source_word: בְּסוֹף הַנַּחַל
  choice: mwishoni mwa korongo[a]
  rationale: סוֹף ni mwisho au ukingo wa mbali, na נַחַל hapa inaweza kuwa bonde au njia ya maji ya msimu. ‘Korongo’ linafaa kwa mandhari hiyo bila kudokeza mto wa kudumu.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: mbele ya nyika ya Yerueli
  rationale: פְּנֵי ina maana ya mahali palipo mbele ya au panapokabili eneo jingine; מִדְבָּר ni nyika au pori kavu, si lazima jangwa la mchanga. Yerueli ni unukuzi wa jina la mahali.
