  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: sw
  text: Yehoshafati akatawala juu ya Yuda. Alikuwa na umri wa miaka thelathini na mitano alipoanza kutawala, naye akatawala miaka ishirini na mitano huko Yerusalemu. Mama yake aliitwa Azuba, binti ya Shilhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Kitenzi מלך katika taarifa hii ya kifalme kinamaanisha kutawala kama mfalme; “akatawala” ni cha kawaida na sahihi katika Kiswahili.
- source_word: עַל יְהוּדָה
  choice: juu ya Yuda
  rationale: Kihusishi עַל pamoja na מלך huonyesha eneo au watu waliotawaliwa; “juu ya Yuda” kinadumisha maana hiyo wazi.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: alikuwa na umri wa miaka thelathini na mitano
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; Kiswahili cha asili hutumia “alikuwa na umri wa miaka...”
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: ב pamoja na kitenzi-jina na kiambishi cha nafsi huonyesha wakati wa kuingia madarakani; tafsiri hii huwasilisha mwanzo wa utawala.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: naye akatawala miaka ishirini na mitano
  rationale: Kauli hii hutaja muda wa utawala kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Mahali pa utawala ni Yerusalemu; “huko” hutoa Kiswahili cha asili bila kubadili maana.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii ni tafsiri ya asili ya Kiswahili ya fomula ya Kiebrania “jina la mama yake lilikuwa,” bila kupoteza taarifa.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בַּת שִׁלְחִי
  choice: binti ya Shilhi
  rationale: בַּת huonyesha uhusiano wa kifamilia wa binti; jina Shilhi limetoholewa kwa ukaribu na umbo la Kiebrania.
