  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: sw
  text: 'Akasema, “Sikilizeni, enyi Yuda wote, nanyi wakazi wa Yerusalemu, nawe Mfalme Yehoshafati. Yahweh anawaambia hivi: ‘Msiogope, wala msifadhaike kwa sababu ya umati huu mkubwa, kwa maana vita si vyenu, bali ni vya Mungu.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Sikilizeni
  rationale: Ni amri ya wingi inayotaka usikivu makini; “sikilizeni” ni ya kawaida na ina nguvu inayofaa katika Kiswahili.
- source_word: כָל יְהוּדָה
  choice: enyi Yuda wote
  rationale: Inahifadhi jina la kijumuiya “Yuda” na kulifanya liwe wito wa moja kwa moja kwa lugha ya kawaida.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: wakazi wa Yerusalemu
  rationale: Kirai cha Kiebrania kinamaanisha watu wanaoishi Yerusalemu; “wakazi” ni kifupi, cha sasa, na cha heshima.
- source_word: כֹּה אָמַר יְהוָה לָכֶם
  choice: Yahweh anawaambia hivi
  rationale: Inawasilisha kwa Kiswahili cha asili fomula rasmi ya ujumbe wa kinabii, huku ikihifadhi wakati wa kitenzi cha Kiebrania kwa namna inayokubalika katika usemi wa moja kwa moja.
- source_word: אַל תִּירְאוּ
  choice: Msiogope
  rationale: Ni katazo la moja kwa moja na la wingi kutoka katika kitenzi ירא.
- source_word: וְאַל תֵּחַתּוּ
  choice: wala msifadhaike
  rationale: “Msifadhaike” huonyesha kutishwa au kuvunjwa moyo na hali, na “wala” huhifadhi katazo la pili lililoongezwa kwa la kwanza.
- source_word: מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: kwa sababu ya umati huu mkubwa
  rationale: Katika muktadha huu מִפְּנֵי ina maana ya sababu, na הָמוֹן הָרָב ni kundi kubwa la watu; “umati huu mkubwa” huepuka kuongeza dhana isiyotajwa wazi kama “jeshi.”
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: kwa maana vita si vyenu, bali ni vya Mungu
  rationale: Muundo wa umilikaji na utofautishaji wa Kiebrania unatolewa kwa Kiswahili cha kawaida bila kupanua dai zaidi ya pambano hili.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Umilikaji wa vita
  choice: vita si vyenu, bali ni vya Mungu
  alternative: vita hivi si vyenu; vinamhusu Mungu
  rationale: Tafsiri iliyochaguliwa inadumisha mvutano na msisitizo wa maandishi kwamba vita hivyo ni vya Mungu, bila kuingiza maelezo ya kimadhehebu kuhusu jinsi atakavyotenda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa moja kwa moja umefanywa wa asili kwa “anawaambia hivi,” huku marudio ya makatazo mawili yakihifadhiwa. Jina “Yehoshafati” limetumiwa kwa umbo linaloeleweka katika matumizi ya Biblia ya Kiswahili.
