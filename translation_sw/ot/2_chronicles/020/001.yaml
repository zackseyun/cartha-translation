base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: sw
  text: Baada ya hayo, Wamoabu na Waamoni, pamoja na baadhi ya Wameuni[a], walikuja kupigana dhidi ya Yehoshafati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “baadhi ya Waamoni.” Wafasiri wengi, kwa kufuata muktadha na matoleo ya kale, wanaelewa kuwa hapa panatajwa Wameuni au kundi jingine kama hilo lililoshirikiana nao, badala ya kuwataja Waamoni tena.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni mpito wa kawaida wa simulizi unaoonyesha mfuatano wa wakati; Kiswahili hiki ni cha asili bila kuiga kineno msemo wa Kiebrania ‘ikawa.’
- source_word: בָּאוּ
  choice: walikuja
  rationale: Kitenzi cha kawaida cha mwendo; pamoja na kusudi la kupigana kinaonyesha kwamba walimjia Yehoshafati kwa uhasama bila kuongeza namna mahususi ya kusonga kijeshi.
- source_word: בְנֵי מוֹאָב
  choice: Wamoabu
  rationale: Ni jina la asili la watu, linalowakilisha kwa Kiswahili maana ya Kiebrania ‘wana wa Moabu’ bila tafsiri ngumu ya neno kwa neno.
- source_word: בְנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ni jina la watu linalofaa katika Kiswahili na linaepuka usemi usio wa asili ‘wana wa Amoni.’
- source_word: וְעִמָּהֶם
  choice: pamoja na
  rationale: Huwasilisha kwa lugha ya asili kwamba kundi la ziada liliandamana na Wamoabu na Waamoni.
- source_word: מֵהָעַמּוֹנִים
  choice: baadhi ya Wameuni
  rationale: Ingawa maandishi ya Kimasora yanasomeka ‘baadhi ya Waamoni,’ muktadha na matoleo ya kale yanaunga mkono kuelewa jina la kundi jingine lililoshirikiana nao, kwa kawaida Wameuni; tofauti halisi imehifadhiwa katika tanbihi.
- source_word: עַל יְהוֹשָׁפָט לַמִּלְחָמָה
  choice: walikuja kupigana na Yehoshafati
  rationale: Katika muktadha wa kijeshi, muundo huu unaonyesha mwendo wa uhasama wenye kusudi la vita. Kiswahili hiki ni wazi na cha kawaida huku kikihifadhi maana ya msingi.
