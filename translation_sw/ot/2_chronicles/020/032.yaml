  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: sw
  text: Akaenda katika njia ya Asa baba yake, wala hakuiacha, akifanya yaliyo sawa machoni pa Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Akaenda katika njia
  rationale: Muundo huu unaeleza mwenendo wa maisha kwa kutumia sitiari ya kutembea katika njia. “Akaenda katika njia” huhifadhi picha ya Kiebrania na inaeleweka katika Kiswahili.
- source_word: אָבִיו אָסָא
  choice: ya Asa baba yake
  rationale: Kirai hiki kinamtambulisha Asa kuwa baba yake Yehoshafati; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: wala hakuiacha
  rationale: Kitenzi סור pamoja na מן humaanisha kugeuka au kuondoka katika njia. “Hakuiacha” hurejelea wazi njia iliyotajwa na ni Kiswahili cha kawaida.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: akifanya yaliyo sawa
  rationale: Infinitivi hapa inaonyesha namna au matokeo ya kuifuata njia hiyo; “akifanya” huunganisha sentensi kwa kawaida. יָשָׁר katika kauli hii humaanisha jambo lililo sawa kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Hii huhifadhi nahau ya Kiebrania ya tathmini ya Mungu, huku jina la agano יְהוָה likitolewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni, jina la agano la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; “Yehova” hutegemea muundo wa baadaye wa matamshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya njia imehifadhiwa bila kufanya sentensi kuwa ngumu.
