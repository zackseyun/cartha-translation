source:
  edition: WLC
  text: וְ/עַתָּ֡ה הִנֵּה֩ בְנֵֽי עַמּ֨וֹן וּ/מוֹאָ֜ב וְ/הַר שֵׂעִ֗יר אֲ֠שֶׁר לֹֽא נָתַ֤תָּה לְ/יִשְׂרָאֵל֙ לָ/ב֣וֹא בָ/הֶ֔ם בְּ/בֹאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם כִּ֛י סָ֥רוּ מֵ/עֲלֵי/הֶ֖ם וְ/לֹ֥א הִשְׁמִידֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: sw
  text: Na sasa, tazama, Waamoni, Wamoabu na watu wa Mlima Seiri[a], ambao hukuwaruhusu Waisraeli waingie dhidi yao[b] walipokuja kutoka nchi ya Misri—kwa maana waliwaepuka, wala hawakuwaangamiza—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “wana wa Amoni na Moabu na Mlima Seiri.” Majina hayo yanarejelea Waamoni, Wamoabu, na watu wa eneo la Mlima Seiri.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ambao hukuwapa Israeli kuingia ndani yao/dhidi yao”; katika muktadha huu, maana yake ni kwamba Mungu hakuwaruhusu Waisraeli waingie dhidi yao kwa vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na alama ya wakati עַתָּה, na kuunganisha hali ya sasa na hoja iliyotangulia katika sala.
- source_word: הִנֵּה
  choice: tazama
  rationale: Hutoa msisitizo wa deiktiki wa Kiebrania kwa lugha yenye hadhi na inayoeleweka katika Kiswahili cha Biblia.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: Waamoni, Wamoabu na watu wa Mlima Seiri
  rationale: Majina ya makundi ya watu yanaelezwa kwa Kiswahili cha kawaida; 'watu wa' huongezwa kwa Seiri ili uratibu wa watu wanaorejelewa na kiwakilishi 'ambao' uwe wazi, huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: ambao hukuwaruhusu Waisraeli waingie kuwashambulia
  rationale: Muundo wa neno kwa neno ni 'hukuwapa Israeli kuingia ndani/dhidi yao.' Katika muktadha wa kijeshi, 'waingie kuwashambulia' ni Kiswahili cha asili kinachohifadhi wazo la kuingia dhidi yao bila kutumia kitenzi chenye nguvu zaidi cha 'kuvamia.'
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: walipokuja kutoka nchi ya Misri
  rationale: Huwakilisha kishazi cha wakati na kitenzi cha mwendo kwa njia ya kawaida, bila kuondoa dhana ya 'kuja kutoka.'
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: kwa maana waliwaepuka
  rationale: Katika dokezo la simulizi, Israeli walibadili njia ili wasiende dhidi ya mataifa hayo; 'waliwaepuka' hutoa maana hiyo kwa ufupi na kwa kawaida.
- source_word: וְלֹא הִשְׁמִידוּם
  choice: wala hawakuwaangamiza
  rationale: Kitenzi cha Hifili cha שׁמד kina nguvu ya kuharibu kabisa katika vita; 'kuwaangamiza' huhifadhi uzito huo vizuri kuliko 'kuwaharibu.'
theological_decisions:
- issue: Kuhifadhi usemi wa moja kwa moja kwa Mungu katika nafsi ya pili
  choice: hukuwaruhusu Waisraeli
  alternative: BWANA hakuwaruhusu Waisraeli
  rationale: Aya ni sehemu ya sala inayoelekezwa moja kwa moja kwa Mungu. Nafsi ya pili ya Kiebrania imehifadhiwa bila kuongeza jina la Mungu ambalo halipo katika aya hii.
- issue: Kumtambulisha mtendaji wa vitenzi vya wingi
  choice: Waisraeli ... walipokuja ... waliwaepuka
  alternative: wao ... walipokuja ... waliwaepuka
  rationale: Kiebrania kinamtaja Israeli kama kundi kisha hutumia viambishi vya wingi. Kutumia 'Waisraeli' kunafanya rejeo la viambishi liwe wazi bila kubadili mtendaji au hoja ya sala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala ya hadharani lakini kinachoeleweka kwa msomaji wa kawaida. 'Tazama' na 'wala hawakuwaangamiza' hudumisha uzito wa kifungu; alama ya kistari mwishoni huhifadhi sentensi inayoendelea katika aya inayofuata.
