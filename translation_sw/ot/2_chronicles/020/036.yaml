base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: sw
  text: Basi akashirikiana naye[a] kutengeneza meli za kwenda Tarshishi[b], nao wakatengeneza meli katika Esion-geberi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaingia ubia naye” au “akaungana naye.” Kitenzi cha Kiebrania kinaonyesha kuingia katika ushirika au muungano.
    reason: lexical_alternative
  - marker: b
    text: Au, “za kusafiri kwa meli kwenda Tarshishi.” Ingawa katika baadhi ya miktadha maneno yanayohusiana na Tarshishi yanaweza kutumiwa katika maelezo ya meli, hapa Kiebrania kwa kawaida huonyesha mahali pa kwenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: akashirikiana naye
  rationale: Kauli hii inaonyesha kuingia katika ushirika au ubia pamoja na mtu mwingine; “akashirikiana naye” ni ya kawaida na inaacha wazi kama ushirika huo ulikuwa wa kisiasa au wa kibiashara.
- source_word: לַעֲשׂוֹת
  choice: kutengeneza
  rationale: Kitenzi עשה kwa msingi humaanisha kufanya au kutengeneza. Kwa meli, Kiswahili cha kawaida kinaweza kusema “kutengeneza,” huku “kujenga” likiwa chaguo la kimuktadha.
- source_word: אֳנִיּוֹת
  choice: meli
  rationale: Nomino hii inarejelea vyombo vikubwa vya majini vinavyofaa kwa safari za biashara, hivyo “meli” ni sahihi kuliko “mashua.”
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: za kwenda Tarshishi
  rationale: Muundo wa kitenzi הלך pamoja na Tarshishi unaonyesha kwa kawaida mahali pa kuelekea. Usemi “meli za kwenda” ni wa asili katika Kiswahili na unahifadhi maana hiyo.
- source_word: תַּרְשִׁישׁ
  choice: Tarshishi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: וַיַּעֲשׂוּ
  choice: nao wakatengeneza
  rationale: Kitenzi cha wingi kinaonyesha kwamba washirika hao walifanya kazi hiyo kwa pamoja, na “wakatengeneza” hudumisha uhusiano wa kileksia na kitenzi kilichotangulia.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: huko Esion-geberi
  rationale: Kiambishi ב kinaonyesha mahali ambapo meli zilitengenezwa; “huko” ni ya kawaida kwa eneo lililotajwa, na jina limetoholewa kwa Kiswahili.
