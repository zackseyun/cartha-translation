base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: sw
  text: Na tazama, wao wanatulipa kwa kuja kutufukuza kutoka katika milki yako[a], uliyotupa tuirithi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika urithi wako, ambao ulitufanya tuurithi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Kauli hii inavuta fikira kwa msisitizo kwenye hali iliyopo; “Na tazama” ni ya heshima na inaeleweka katika Kiswahili cha Biblia.
- source_word: הֵם
  choice: hivi ndivyo wanavyotulipa
  rationale: Ingawa kiwakilishi huru “wao” kina msisitizo katika Kiebrania, muundo huu wa Kiswahili huonyesha kwa kawaida msisitizo wa malalamiko kuhusu tendo lao.
- source_word: גֹּמְלִים עָלֵינוּ
  choice: wanavyotulipa
  rationale: Kitenzi kina maana ya kulipa au kutenda kwa mtu kulingana na tendo la awali; hapa kinabeba kejeli kwamba waliokuwa wameachwa salama sasa wanalipa wema kwa uadui.
- source_word: לָבוֹא
  choice: wanakuja
  rationale: Hueleza njia au kusudi la malipo yao, kwa muundo wa Kiswahili unaoendelea kwa urahisi baada ya nukta mbili.
- source_word: לְגָרְשֵׁנוּ
  choice: kutufukuza
  rationale: Huwasilisha moja kwa moja maana ya kuondoa kwa nguvu au kufukuza katika muktadha wa nchi na vita.
- source_word: מִיְּרֻשָּׁתְךָ
  choice: kutoka katika milki yako
  rationale: “Milki yako” hudumisha wazo kwamba nchi ni mali ya Mungu, bila kuirudia kama “urithi” kabla ya kishazi kinachofuata.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: ambayo ulitupa tuirithi
  rationale: Hifili ya ירשׁ inaonyesha Mungu aliwasababisha kuimiliki au kuirithi; tafsiri hii ni ya asili na huhifadhi Mungu kuwa mtoaji wa urithi.
theological_decisions:
- issue: Umiliki wa Mungu na Israeli kupewa nchi kuwa urithi
  choice: kutoka katika milki yako, ambayo ulitupa tuirithi
  alternative: kutoka katika urithi wako, ambao ulitusababisha kuurithi
  rationale: Tafsiri kuu hutofautisha nchi kuwa milki ya Mungu na kuwa kitu ambacho aliwapa Israeli wakirithi, huku tanbihi ikihifadhi uwezekano wa kutafsiri nomino ileile kuwa “urithi.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Na tazama” huhifadhi msisitizo wa usemi wa sala, huku “hivi ndivyo wanavyotulipa” ikieleza kejeli kwa lugha ya kawaida bila kupunguza uzito wa malalamiko.
