source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יְהוֹשָׁפָ֗ט בִּ/קְהַ֧ל יְהוּדָ֛ה וִ/ירוּשָׁלִַ֖ם בְּ/בֵ֣ית יְהוָ֑ה לִ/פְנֵ֖י הֶ/חָצֵ֥ר הַ/חֲדָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: sw
  text: Yehoshafati akasimama katika kusanyiko la watu wa Yuda na Yerusalemu, ndani ya nyumba ya Yahwe, mbele ya ua mpya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwanja mpya.”
    reason: Neno חָצֵר linaweza kutafsiriwa “ua” au “uwanja” wa jengo la hekalu.
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Kitenzi עמד katika mfululizo wa masimulizi kinaeleza tendo la wakati uliopita. “Akasimama” ni tafsiri ya kawaida na fupi bila kuongeza wazo la kujipanga kwa namna maalumu.
- source_word: בִּקְהַל
  choice: katika kusanyiko la
  rationale: קהל ni mkusanyiko wa watu waliokusanyika. “Kusanyiko” ni neno la sasa, linaloeleweka, na kihusishi ב kimewakilishwa kwa “katika.”
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: watu wa Yuda na Yerusalemu
  rationale: Majina haya yanatambulisha jamii iliyokusanyika. Neno “watu” limewekwa wazi kwa Kiswahili cha kawaida, kwa kuwa maeneo yenyewe hayawezi kuwa kusanyiko.
- source_word: בְּבֵית יְהוָה
  choice: ndani ya nyumba ya Yahwe
  rationale: בַּיִת maana yake ya msingi ni “nyumba.” Tafsiri hii inadumisha nahau ya Kiebrania, huku “ndani ya” ikionyesha mahali kwa uwazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limeandikwa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Katika muktadha huu לִפְנֵי inaonyesha mahali; “mbele ya” ni Kiswahili cha kawaida na sahihi.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: ua mpya
  rationale: חָצֵר ni eneo la ua katika jengo la hekalu. “Ua” ni neno fupi na la kawaida; kivumishi “mpya” kimehifadhiwa moja kwa moja.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Watu wa” limeongezwa kwa uwazi wa kawaida wa Kiswahili bila kubadili rejeleo la jamii za Yuda na Yerusalemu. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “ua mpya.”
