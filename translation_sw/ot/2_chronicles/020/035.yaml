  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: sw
  text: Baada ya hayo, Yehoshafati, mfalme wa Yuda, alifanya muungano na Ahazia, mfalme wa Israeli, ambaye alitenda maovu katika matendo yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, Kiebrania husema, “yeye alitenda kwa uovu kufanya.” “Yeye” humrejelea Ahazia kwa kawaida; kifungu hicho ni kifupi na kinaweza pia kueleweka kwa upana kuwa kinahusu mwenendo unaozungumziwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha wakati kinachoendeleza simulizi baada ya matukio yaliyotangulia; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: אֶתְחַבַּר
  choice: alifanya muungano na
  rationale: Hifali ya Hitpael ya חבר hapa inaonyesha kuingia katika ushirika au muungano; katika muktadha wa wafalme, ‘alifanya muungano na’ huwasilisha vizuri maana ya kisiasa na kimahusiano.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Muundo wa cheo cha kifalme umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: na Ahazia mfalme wa Israeli
  rationale: Kirai cha kihusishi na cheo kinachoeleza jina vimehifadhiwa kwa mpangilio wa asili unaosomeka vizuri katika Kiswahili.
- source_word: הוּא
  choice: ambaye
  rationale: Kiwakilishi huru kimetolewa kama kiwakilishi rejeshi kinachomwelezea Ahazia, aliye mtangulizi wa karibu zaidi, huku utata wa marejeo ukielezwa katika tanbihi.
- source_word: הִרְשִׁיעַ
  choice: alitenda kwa uovu
  rationale: Hifali ya Hiphil ya רשע hapa ina maana ya kutenda kwa uovu; tafsiri hii inahifadhi uzito wa kimaadili bila kuongeza maelezo yasiyokuwamo.
- source_word: לַ/עֲשׂוֹת
  choice: katika jambo hilo
  rationale: Kitenzi-jina chenye ל ni kifupi na chenye utata. Usemi huu unaunganisha uovu na tendo linalozungumziwa bila kulibainisha zaidi ya Kiebrania.
theological_decisions:
- issue: Mrejeo wa kiwakilishi הוּא
  choice: 'Kimetafsiriwa kuwa kinamrejelea Ahazia: ‘ambaye alitenda kwa uovu.’'
  alternative: Kinaweza kueleweka kuwa kinamhusu Yehoshafati katika kufanya muungano huo, au kwa upana zaidi tendo la muungano.
  rationale: Ahazia ndiye mtangulizi wa karibu zaidi kisarufi, na muktadha wa simulizi unamweleza vibaya. Hata hivyo, muundo mfupi wa Kiebrania haumalizi kabisa utata, kwa hiyo uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umeweka wazi mtiririko wa sentensi bila kuondoa utata halisi wa kiwakilishi cha Kiebrania.
