source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: sw
  text: Nao walipoanza kuimba na kusifu, Yahwe akaweka waviziaji[a] dhidi ya Waamoni, Wamoabu, na watu wa Mlima Seiri, waliokuwa wakija dhidi ya Yuda[b], nao wakapigwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mashambulizi ya kuvizia.” Neno la Kiebrania linaweza kumaanisha watu waliovizia au kitendo cha kuvizia kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au “waliokuwa wakija Yuda.” Katika muktadha huu walikuwa wavamizi, kwa hiyo maandishi yametumia “dhidi ya Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: Nao walipoanza
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida kiunganishi na wakati ambapo tendo lilianza, bila kuwa mzito kama tafsiri ya neno kwa neno ya 'na wakati walipoanza.'
- source_word: בְרִנָּה וּתְהִלָּה
  choice: kuimba na kusifu
  rationale: Katika muktadha huu wa ibada, רִנָּה inaweza kumaanisha wimbo au sauti ya shangwe, na תְהִלָּה ni sifa; vitenzi hivi ni vya kawaida na vinaeleweka kwa urahisi katika Kiswahili.
- source_word: נָתַן יְהוָה מְאָרְבִים
  choice: Yahwe akaweka waviziaji
  rationale: נָתַן hapa ina maana ya kuweka au kupanga, huku מְאָרְבִים ikiwa na uwezekano wa kumaanisha watu waliovizia. 'Akaweka waviziaji' huhifadhi sura ya kishiriki cha Kiebrania bila kubainisha wao ni nani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: Waamoni, Wamoabu, na watu wa Mlima Seiri
  rationale: Majina ya mataifa yametolewa kwa maumbo ya kawaida ya Kiswahili; 'watu wa' limeongezwa kwa Seiri kwa sababu muktadha unawahusu wapiganaji wanaohusishwa na eneo hilo, si mlima wenyewe kama kitu kisicho na uhai.
- source_word: הַבָּאִים לִיהוּדָה
  choice: waliokuwa wakija dhidi ya Yuda
  rationale: Ingawa לִ inaweza kumaanisha 'kwenda Yuda,' muktadha wa uvamizi unaonyesha uhasama; 'dhidi ya' huonyesha hilo bila kupotosha mwelekeo wa mwendo.
- source_word: וַיִּנָּגֵפוּ
  choice: nao wakashindwa
  rationale: Nifali ya נגף inaweza kumaanisha kupigwa au kushindwa. 'Wakashindwa' ni Kiswahili cha kawaida na huhifadhi matokeo ya kijeshi bila kudai kwamba wote waliuawa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; 'Yahwe' huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa מְאָרְבִים
  choice: waviziaji, bila kuwataja walikuwa nani
  alternative: mashambulizi ya kuvizia
  rationale: Kishiriki cha Kiebrania kinaweza kumaanisha watu wanaovizia, lakini mstari hautambulishi wazi mawakala hao. Tafsiri inaacha mvutano huo bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia 'Nao ... aka- ... nao waka-' ili kudumisha mtiririko wa asili. Lugha imeepuka misamiati ya kale isiyo ya lazima na imehifadhi utata kuhusu waviziaji.
