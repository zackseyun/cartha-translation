  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: sw
  text: Watu wa Yuda wakakusanyika ili kutafuta msaada kutoka kwa Yahwe[a]; pia, walikuja kutoka katika miji yote ya Yuda ili kumtafuta Yahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “kutafuta [kitu] kutoka kwa Yahwe.” Katika muktadha huu maana yake ni kutafuta msaada au wokovu kutoka kwake.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kumtafuta Yahwe.” Hapa muundo wa Kiebrania ni tofauti kidogo na ule wa sehemu ya kwanza ya mstari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: Nao watu wa Yuda wakakusanyika
  rationale: Kitenzi cha Kiebrania kinaonyesha kukusanyika, na ‘watu wa Yuda’ huweka wazi kwamba jina Yuda hapa linawakilisha watu wa ufalme huo kwa pamoja.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: ili kutafuta msaada kutoka kwa Yahwe
  rationale: Muundo בקש pamoja na מן una maana halisi ya kutafuta kitu kutoka kwa Yahwe; katika muktadha wa tishio, kitu kinachotafutwa ni msaada au wokovu. ‘Msaada’ huifanya sentensi iwe ya kawaida katika Kiswahili huku tanbihi ikihifadhi udhahiri wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, kwa kulihifadhi kama jina binafsi katika matini.
- source_word: גַּם
  choice: tena
  rationale: Neno hili linaongeza na kusisitiza taarifa inayofuata kwamba ushiriki ulitoka katika maeneo yote ya Yuda.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: kutoka katika miji yote ya Yuda
  rationale: Tafsiri hii huonyesha upana wa ushiriki kutoka kote katika ufalme wa Yuda.
- source_word: בָּאוּ
  choice: walikuja
  rationale: Ni kitenzi rahisi cha mwendo, nacho hutafsiriwa kwa kawaida na kwa uwazi kuwa ‘walikuja.’
- source_word: לְבַקֵּשׁ אֶת יְהוָה
  choice: ili kumtafuta Yahwe
  rationale: את humtambulisha Yahwe kuwa yambwa la moja kwa moja. ‘Kumtafuta Yahwe’ huhifadhi tofauti na muundo wa kwanza, unaotumia מן.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo.
- issue: Iwapo miundo miwili ya בקש ipatanishwe
  choice: 'Kudumisha tofauti: ‘kutafuta msaada kutoka kwa Yahwe’ na ‘kumtafuta Yahwe’'
  alternative: Kutafsiri yote mawili kuwa ‘kumtafuta Yahwe’
  rationale: 'Kiebrania kinatumia miundo tofauti: kwanza בקש + מן, kisha בקש + את. Tafsiri hii huhifadhi tofauti hiyo bila kudai kwamba ni tofauti kamili ya kitheolojia.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao’ na mfuatano wa vitenzi vya -ka- vinaendeleza simulizi kwa ufasaha; ‘watu wa Yuda’ huzuia jina la mahali kuonekana kana kwamba ndilo lililokusanyika. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
