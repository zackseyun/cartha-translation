  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: sw
  text: Ndipo Walawi kutoka miongoni mwa wazao wa Kohathi na wazao wa Kora wakasimama ili kumsifu Yahweh, Mungu wa Israeli, kwa sauti kubwa mno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “kwa sauti kubwa sana”; neno la mwisho la Kiebrania linasisitiza ukubwa wa sauti yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakasimama
  rationale: Kitenzi קום kinaeleza kitendo halisi cha kuinuka au kusimama; “wakasimama” ni cha kawaida na kinahifadhi tendo lao la wazi la kuanza sifa.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la kikabila na la huduma ya ibada linalotajwa hapa.
- source_word: מִן בְּנֵי הַקְּהָתִים וּמִן בְּנֵי הַקָּרְחִים
  choice: kutoka miongoni mwa wazao wa Kohathi na wazao wa Kora
  rationale: “Wazao” huwasilisha kwa Kiswahili cha asili usemi wa Kiebrania “wana wa” unaotaja nasaba, bila kudokeza kwamba wote walikuwa wana wa moja kwa moja.
- source_word: לְהַלֵּל
  choice: ili kumsifu
  rationale: Infinitivo hii inaonyesha kusudi. “Kumsifu” haitii ndani wazo la kuimba ambalo halikutajwa wazi na kitenzi chenyewe.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja na unamtambulisha Yahweh kwa uhusiano wake na Israeli.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: kwa sauti kubwa mno
  rationale: Katika muktadha huu לְמָעְלָה inaeleweka vyema kama kisisitizi cha ukubwa wa sauti; “mno” hutoa nguvu hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia Tetragramatoni kama jina binafsi. “Yahweh” hulihifadhi wazi bila kuligeuza kuwa cheo.
- issue: Ikiwa sifa hiyo ilikuwa kuimba
  choice: kumsifu
  alternative: kumwimbia sifa
  rationale: Kitenzi הלל kinamaanisha kusifu, lakini mstari huu hautumii kitenzi mahususi cha kuimba. Tafsiri pana inaepuka kuongeza jambo lisilosemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Kutoka miongoni mwa wazao” huhifadhi wazo la nasaba huku ikiepuka usemi mgumu wa neno kwa neno.
