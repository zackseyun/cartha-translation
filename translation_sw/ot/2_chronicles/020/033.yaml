source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: sw
  text: Lakini mahali pa juu pa ibada hapakuondolewa, na watu bado hawakuwa wameielekeza mioyo yao kwa Mungu wa mababu zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuwa wameitayarisha mioyo yao kwa Mungu wa mababu zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Inaonyesha tofauti kati ya tathmini nzuri iliyotangulia na upungufu uliobaki; ni kiunganishi cha kawaida na chenye nguvu ya kupingana katika Kiswahili.
- source_word: הַבָּמוֹת
  choice: mahali pa juu pa ibada
  rationale: Neno hili linaashiria maeneo yaliyoinuka yaliyotumiwa kwa ibada. Ufafanuzi mfupi 'pa ibada' huzuia maana ya kijiografia pekee bila kuamua kimadhehebu hadhi ya kila mahali hapo.
- source_word: לֹא סָרוּ
  choice: hapakuondolewa
  rationale: Ingawa kitenzi cha Kiebrania kina maana halisi ya kutokuondoka, katika muktadha huu Kiswahili cha kawaida hueleza kwamba maeneo hayo hayakuondolewa.
- source_word: וְעוֹד
  choice: bado
  rationale: Hudumisha wazo la hali iliyoendelea bila kutatuliwa.
- source_word: הָעָם
  choice: watu
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya kijumla inayorejelea wananchi.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: hawakuwa wameielekeza mioyo yao
  rationale: Hifili ya כון pamoja na 'moyo' inaweza kumaanisha kutayarisha, kuimarisha, au kuelekeza. 'Kuielekeza mioyo' huonyesha azimio na mwelekeo wa ndani huku ikihifadhi uwezekano wa maana ya kutayarisha.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: kwa Mungu wa mababu zao
  rationale: Kihusishi ל kinaonyesha mwelekeo au uelekeo wa moyo. 'Mungu wa mababu zao' huhifadhi rejeo la kihistoria la agano bila kulipanua.
theological_decisions:
- issue: Asili ya upungufu wa watu
  choice: Aya inaunganisha mageuzi ya nje ambayo hayakukamilika na mioyo ya watu ambayo haikuwa imeelekezwa kwa Mungu wa mababu zao.
  alternative: Watu walikuwa hawajaitayarisha mioyo yao kwa Mungu wa mababu zao.
  rationale: Kiebrania kinaweza kuonyesha kutayarisha, kuimarisha, au kuelekeza moyo. Matini kuu inaonyesha mwelekeo wa uaminifu wa ndani, huku tanbihi ikihifadhi maana halisi mbadala bila kuufanya upungufu huo kuwa hisia tu au kuuingiza katika mfumo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi 'mahali pa juu pa ibada' unaeleweka kwa msomaji wa kawaida na huhifadhi maana ya kihistoria-kidini; tanbihi hudumisha utata wa כון bila kulemea matini kuu.
