  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: sw
  text: Ndipo Eliezeri mwana wa Dodavahu, kutoka Maresha, akatabiri dhidi ya Yehoshafati, akisema, “Kwa sababu umejiunga na Ahazia, Yahwe ameharibu kazi zako[a].” Basi meli zikavunjika, nazo hazikuweza kwenda Tarshishi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe amevunja shughuli yako.” Kiebrania kinasema “kazi zako”; hapa maneno hayo yanarejelea shughuli ya Yehoshafati ya kutengeneza meli.
    reason: lexical_alternative
  - marker: b
    text: Au, “hazingeweza kwenda” au “zilizuiwa kwenda” Tarshishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: akatabiri
  rationale: Hifadhinafsi ya kitenzi נבא hapa inaonyesha kusema kama nabii; “akatabiri” ni Kiswahili cha kawaida na chenye maana ya moja kwa moja.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika unabii huu wa hukumu unaomlenga Yehoshafati, kihusishi hiki kinaonyesha ujumbe wa kukemea, si habari zinazomhusu tu.
- source_word: מִמָּרֵשָׁה
  choice: kutoka Maresha
  rationale: Kihusishi מִן kinaonyesha mahali alikotoka Eliezeri.
- source_word: כְּהִתְחַבֶּרְךָ
  choice: Kwa sababu umejiunga na
  rationale: Muundo wa kitenzi una maana ya mtu kujiunganisha na mwingine. Tafsiri hii inadumisha maana hiyo bila kulazimisha wazo la mkataba rasmi.
- source_word: פָּרַץ
  choice: ameharibu
  rationale: Ingawa mzizi huu kwa kawaida huhusu kuvunja au kupenya kwa nguvu, ukiwa na “kazi zako” kama yambwa hapa una maana ya kuvuruga au kuangamiza jambo lililofanywa.
- source_word: מַעֲשֶׂיךָ
  choice: kazi zako
  rationale: Hii inadumisha wingi wa Kiebrania; katika muktadha inarejelea shughuli ya Yehoshafati ya kutengeneza meli.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: Basi meli zikavunjika
  rationale: Muundo wa Kiebrania unaonyesha kwamba meli zilivunjika. “Zikavunjika” ni usemi wa kawaida unaohifadhi picha ya chanzo.
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: nazo hazikuweza kwenda
  rationale: Katika muundo huu עצר huonyesha kuzuiwa au kutokuwa na uwezo; kwa kuwa meli ndizo kiima, “hazikuweza kwenda” ni Kiswahili cha kawaida.
- source_word: תַּרְשִׁישׁ
  choice: Tarshishi
  rationale: Jina la mahali limetoholewa kwa mwandiko unaofaa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la konsonanti nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi na ni tahajia ya kawaida ya Kiswahili.
- issue: Uhusiano kati ya ushirika wa Yehoshafati na hukumu
  choice: Kwa sababu umejiunga na Ahazia
  alternative: Ulipoungana na Ahazia
  rationale: כְּ pamoja na infinitivu inaweza kueleweka kwa wakati au kwa sababu. Muktadha wa tamko la hukumu unaunga mkono maana ya kisababishi, lakini tafsiri haiongezi maelezo ya kidhehebu kuhusu asili ya kosa hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, ulio wazi na wa kisasa. Majina yametoholewa kama Eliezeri, Yehoshafati, Ahazia, Maresha na Tarshishi. Viashiria vya tanbihi vimewekwa kwenye vifungu vinavyohusika moja kwa moja, badala ya kuwekwa baada ya majina ya watu.
