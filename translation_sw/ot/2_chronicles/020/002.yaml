  edition: WLC
  text: וַ/יָּבֹ֗אוּ וַ/יַּגִּ֤ידוּ לִֽ/יהוֹשָׁפָט֙ לֵ/אמֹ֔ר בָּ֣א עָלֶ֜י/ךָ הָמ֥וֹן רָ֛ב מֵ/עֵ֥בֶר לַ/יָּ֖ם מֵ/אֲרָ֑ם וְ/הִנָּ/ם֙ בְּ/חַֽצְצ֣וֹן תָּמָ֔ר הִ֖יא עֵ֥ין גֶּֽדִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: sw
  text: Ndipo wakaja wakamwarifu Yehoshafati, wakisema, “Umati mkubwa unakuja dhidi yako kutoka ng’ambo ya bahari[a], kutoka Aramu[b]. Tazama, wako Hasason-Tamari” (yaani, En-Gedi).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka upande mwingine wa bahari.”
    reason: lexical_alternative
  - marker: b
    text: Aramu ni jina la mahali la Kiebrania ambalo mara nyingi hutafsiriwa “Siria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ndipo wakaja
  rationale: Muundo wa masimulizi wa wayyiqtol unaendeleza mfululizo wa matukio; “ndipo” huonyesha mwendelezo huo kwa Kiswahili cha kawaida bila kuutia uzito usio wa lazima.
- source_word: וַיַּגִּידוּ לִיהוֹשָׁפָט
  choice: wakamwarifu Yehoshafati
  rationale: Hiphil ya נגד humaanisha kumjulisha au kumpa mtu taarifa. “Wakamwarifu” inafaa kwa wajumbe wanaomletea mfalme habari ya dharura.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huu ni utangulizi wa kawaida wa maneno yaliyonukuliwa, nao umehifadhiwa kwa namna ya asili katika Kiswahili.
- source_word: בָּא
  choice: unakuja
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umbo la qatal, katika taarifa hii ya tishio linalokaribia kinaonyesha mwendo unaoendelea au ulio karibu kutokea.
- source_word: הָמוֹן רָב
  choice: umati mkubwa
  rationale: הָמוֹן hueleza kundi kubwa au halaiki. “Umati mkubwa” huhifadhi upana wa maana bila kufafanua kupita kiasi kuwa ni jeshi rasmi, ingawa muktadha ni wa kijeshi.
- source_word: עָלֶיךָ
  choice: dhidi yako
  rationale: Katika muktadha wa uvamizi, kihusishi על kinaonyesha mwendo wa uhasama; “dhidi yako” huwasilisha maana hiyo wazi.
- source_word: מֵעֵבֶר לַיָּם
  choice: kutoka ng’ambo ya bahari
  rationale: Kauli hii ina maana ya kutoka upande wa pili au ng’ambo ya bahari. Tafsiri hii ni ya asili na huhifadhi mtazamo wa kijiografia wa taarifa.
- source_word: מֵאֲרָם
  choice: kutoka Aramu
  rationale: Jina la Kiebrania ארם limetoholewa moja kwa moja kama “Aramu” badala ya kubadilishwa kuwa jina la baadaye “Siria.”
- source_word: וְהִנָּם
  choice: Tazama, wako
  rationale: הִנֵּה pamoja na kiambishi cha nafsi huvuta fikira kwa hali ya sasa na ya dharura; “Tazama” huhifadhi msisitizo huo.
- source_word: בְּחַצְצוֹן תָּמָר
  choice: wako Hasason-Tamari
  rationale: Kihusishi ב ni cha mahali, na jina la mahali limetoholewa kwa mwandiko unaosomeka kwa Kiswahili.
- source_word: הִיא עֵין גֶּדִי
  choice: yaani, En-Gedi
  rationale: Kifungu hiki kinatambulisha Hasason-Tamari kuwa ni En-Gedi; “yaani” huonyesha ufafanuzi huo kwa uwazi.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi na wenye hadhi. “Umati mkubwa” limechaguliwa badala ya “jeshi kubwa” ili kutofafanua zaidi ya neno la Kiebrania. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika: [a] baada ya “ng’ambo ya bahari” na [b] baada ya “Aramu.”'
