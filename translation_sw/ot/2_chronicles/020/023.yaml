  to: Ndipo Waamoni na Wamoabu wakasimama dhidi ya wenyeji wa Mlima Seiri ili kuwaweka wakfu kwa maangamizi[a] na kuwaangamiza; nao walipokwisha kuwaangamiza wenyeji wa Seiri, wakasaidiana kuangamizana wao kwa wao.
