    issue: Tofauti kati ya חרם na השמיד haijahifadhiwa vya kutosha katika matini kuu.
    rationale: «Kuwaangamiza kabisa» hueleza matokeo, lakini hupunguza kipengele cha kuweka wakfu kwa maangamizi kilichomo katika חרם. Kutumia usemi huo katika matini kuu na kuacha «kuwaangamiza» kwa השמיד hudumisha tofauti ya vitenzi vya Kiebrania.
  - severity: medium
    issue: «Walipomaliza kuwashughulikia wenyeji wa Seiri» ni laini kupita kiasi.
    rationale: Katika muktadha wa kauli mbili za maangamizi, «kuwashughulikia» inaweza kumaanisha kutenda nao jambo lolote. «Walipokwisha kuwaangamiza» huweka wazi tendo linalokusudiwa na muktadha.
  revised_text: Ndipo Waamoni na Wamoabu wakasimama dhidi ya wenyeji wa Mlima Seiri ili kuwaweka wakfu kwa maangamizi[a] na kuwaangamiza; nao walipokwisha kuwaangamiza wenyeji wa Seiri, wakasaidiana kuangamizana wao kwa wao.
