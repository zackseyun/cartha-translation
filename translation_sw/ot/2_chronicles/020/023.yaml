review_pass:
  verdict: revise
  source_fidelity: Rasimu inafuata mfuatano na wahusika wa Kiebrania kwa usahihi wa jumla. Hata hivyo, «kuwashughulikia» hupunguza mno tendo la kuangamiza linalodokezwa na muktadha na vitenzi vinavyolitangulia. Pia «kuwaangamiza kabisa» katika matini kuu hufunika tofauti ya kimsamiati kati ya חרם na השמיד, ingawa kidokezo hujaribu kuihifadhi.
  naturalness: Kiswahili cha rasimu kwa ujumla ni sanifu. «Wakasaidiana kuangamizana wao kwa wao» ni wazi na la kawaida. «Na kuwafuta» linaweza kueleweka, lakini ni pungufu kwa maana ya kuwaondoa/kuwaangamiza watu; «na kuwaangamiza» ni wazi zaidi katika muktadha huu. Muundo uliorekebishwa unasomeka kwa mtiririko wa simulizi.
  terminology: Waamoni, Wamoabu, Mlima Seiri, na wenyeji ni matumizi yanayofaa. Kwa חרם, «kuwaweka wakfu kwa maangamizi» huhifadhi maana ya kuwekwa wakfu/ chini ya marufuku ya maangamizi, na «kuwaangamiza» hutafsiri השמיד bila kudai ufafanuzi wa kimadhehebu.
  issues:
