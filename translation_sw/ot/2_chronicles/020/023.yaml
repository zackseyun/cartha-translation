source:
  edition: WLC
  text: וַ֠/יַּֽעַמְדוּ בְּנֵ֨י עַמּ֧וֹן וּ/מוֹאָ֛ב עַל יֹשְׁבֵ֥י הַר שֵׂעִ֖יר לְ/הַחֲרִ֣ים וּ/לְ/הַשְׁמִ֑יד וּ/כְ/כַלּוֹתָ/ם֙ בְּ/יוֹשְׁבֵ֣י שֵׂעִ֔יר עָזְר֥וּ אִישׁ בְּ/רֵעֵ֖/הוּ לְ/מַשְׁחִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: sw
  text: Ndipo Waamoni na Wamoabu wakasimama dhidi ya wenyeji wa Mlima Seiri ili kuwaweka wakfu kwa maangamizi[a] na kuwaangamiza; nao walipokwisha kuwaangamiza wenyeji wa Seiri, wakasaidiana kuangamizana wao kwa wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuwaweka chini ya marufuku ya kuangamizwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: wakainuka dhidi ya
  rationale: Katika muktadha wa kijeshi, עמד pamoja na עַל huonyesha kusimama au kuinuka kwa uadui dhidi ya mwingine; msemo huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: Waamoni na Wamoabu
  rationale: Majina ya makabila yanawasilisha kwa kawaida maana ya makundi ya watu iliyomo katika kauli ya Kiebrania ‘wana wa Amoni na Moabu.’
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: wenyeji wa Mlima Seiri
  rationale: יֹשְׁבֵי ni nomino inayotokana na kitenzi, yenye maana ya wakaaji au wenyeji; ‘Mlima Seiri’ ni jina la mahali linalotambulika.
- source_word: לְהַחֲרִים
  choice: kuwaangamiza kabisa
  rationale: חרם katika Hifili humaanisha kuweka wakfu kwa maangamizi au kuweka chini ya marufuku ya kuangamizwa. Katika matini kuu, ‘kuwaangamiza kabisa’ ni ya asili na wazi; kidokezo kinahifadhi maana maalumu ya neno hilo.
- source_word: וּלְהַשְׁמִיד
  choice: na kuwafuta
  rationale: שׁמד huendeleza na kusisitiza maangamizi. ‘Kuwafuta’ hutofautisha kitenzi hiki na חרם huku ikidumisha ukali wake.
- source_word: וּכְכַלּוֹתָם
  choice: na walipomaliza
  rationale: כ pamoja na kitenzi-jina hapa ina maana ya wakati, ‘walipomaliza’ au ‘baada ya kumaliza,’ kulingana na mfuatano wa simulizi.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ
  choice: wakasaidiana
  rationale: Kauli halisi ‘kila mtu alimsaidia mwenzake’ ni msemo wa kugawanya tendo kwa wahusika; ‘wakasaidiana’ huhifadhi maana ya kutendeana kwa Kiswahili cha kawaida.
- source_word: לְמַשְׁחִית
  choice: kuangamizana wao kwa wao
  rationale: Kitenzi-jina kinaonyesha kusudi au matokeo ya kusaidiana kwao. Muktadha unaonyesha wazi kwamba waligeukiana, hivyo kauli ya kutendeana inaweka wazi mtendwa aliyodokezwa.
theological_decisions:
- issue: Tafsiri ya חרם katika muktadha wa vita
  choice: kuwaangamiza kabisa, pamoja na kidokezo kinachoeleza ‘kuwaweka wakfu kwa maangamizi’
  alternative: kuwaweka chini ya marufuku ya kuangamizwa
  rationale: Neno lina uzito wa ibada na vita vitakatifu unaozidi maana ya kuua tu. Matini kuu inabaki wazi kwa msomaji wa kawaida, huku kidokezo kikihifadhi maana yake maalumu bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umehifadhiwa, huku marudio ya maneno ya maangamizi yakitofautishwa kwa lugha inayoeleweka.
