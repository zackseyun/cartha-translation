base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: sw
  text: Matendo mengine ya Yehoshafati, ya awali na ya baadaye, tazama, yameandikwa katika kumbukumbu za Yehu mwana wa Hanani, ambazo zimejumuishwa katika Kitabu cha Wafalme wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kiebrania kinasema, “ambazo/ambaye alizipandisha juu ya Kitabu cha Wafalme wa Israeli.” Kishazi hiki ni kigumu kisintaksia; huenda maana yake ni kwamba kumbukumbu za Yehu zilijumuishwa katika kitabu hicho, au kwamba Yehu alihusika kuzitia humo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Matendo mengine ya Yehoshafati
  rationale: Katika muhtasari wa kifalme, דִּבְרֵי hurejelea matendo au mambo ya utawala, si maneno yaliyosemwa tu; ‘matendo mengine’ ni ya kawaida na wazi katika Kiswahili.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: ya awali na ya baadaye
  rationale: Huhifadhi jozi ya Kiebrania inayohusu vipindi vyote vya utawala bila kuibadili kuwa maelezo yasiyo ya moja kwa moja.
- source_word: הִנָּם כְּתוּבִים
  choice: tazama, yameandikwa
  rationale: ‘Tazama’ huhifadhi msisitizo wa הִנָּם, na ‘yameandikwa’ hufuata maana ya moja kwa moja ya כְּתוּבִים.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: katika kumbukumbu za Yehu mwana wa Hanani
  rationale: Katika muktadha huu דִּבְרֵי ni chanzo cha maandishi; ‘kumbukumbu’ huwasilisha maana hiyo bila kudai kuwa ni aina maalumu ya nyaraka kama annali.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: ambazo aliziingiza katika Kitabu cha Wafalme wa Israeli
  rationale: Kirai cha Kiebrania ni kigumu na kwa neno kwa neno ni ‘ambazo alizipandisha juu ya kitabu.’ Katika muktadha wa vyanzo vya maandishi, ‘aliziingiza katika’ huonyesha kwa Kiswahili cha kawaida kwamba kumbukumbu za Yehu ziliwekwa katika chanzo hicho kikubwa.
