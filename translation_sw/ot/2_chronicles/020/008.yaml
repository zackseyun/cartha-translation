  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: sw
  text: 'Nao wakaishi humo[a], wakakujengea humo mahali patakatifu kwa ajili ya jina lako[b], wakisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wakakaa humo, au, wakafanya humo kuwa makao yao.
    reason: lexical_alternative
  - marker: b
    text: “Mahali patakatifu kwa ajili ya jina lako” ni mahali patakatifu palipowekwa wakfu kwa jina la BWANA, yaani, kwa uwepo wake uliofunuliwa na heshima yake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: wakaishi
  rationale: Kitenzi ישׁב hapa kinaonyesha kukaa kwa kudumu katika nchi. “Wakaishi” ni Kiswahili cha kawaida na cha sasa; “wakakaa” pia kinawezekana lakini huenda kikadokeza ukaaji wa muda tu bila muktadha.
- source_word: בָהּ
  choice: humo
  rationale: Kiambishi cha nafsi ya kike umoja kinarejelea nchi iliyotajwa katika muktadha. “Humo” ni namna ya asili ya Kiswahili ya kusema ‘ndani yake’ kuhusu mahali.
- source_word: וַיִּבְנוּ
  choice: na kukujengea
  rationale: בנה ni ‘kujenga.’ Muundo “kukujengea” unaunganisha tendo hilo na לְךָ na kuonyesha kwamba mahali hapo palijengwa kwa ajili ya Mungu.
- source_word: לְךָ
  choice: kukujengea
  rationale: Herufi ל hapa inaonyesha anayenufaika au anayewekewa wakfu jengo hilo. Kiambishi tamati “-ea” pamoja na “ku-” ya nafsi ya pili huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: מִקְדָּשׁ
  choice: mahali patakatifu
  rationale: מִקְדָּשׁ ni mahali palipowekwa wakfu kuwa patakatifu. Tafsiri hii ni wazi kwa msomaji wa kawaida na haifanyi neno hilo liwe tu jina rasmi la jengo, ingawa hapa linarejelea hekalu.
- source_word: לְשִׁמְךָ
  choice: kwa ajili ya jina lako
  rationale: Kirai hiki kinaonyesha kuwekwa wakfu kwa jina la Mungu. “Kwa ajili ya jina lako” kinahifadhi usemi wa kibiblia na hakidokezi kwamba walijenga kwa mamlaka ya jina hilo.
- source_word: לֵאמֹר
  choice: 'wakisema:'
  rationale: Neno hili linaanzisha maneno yanayofuata katika mstari unaofuata. Alama ya nukta mbili huonyesha wazi kwamba usemi utafuata.
theological_decisions:
- issue: Maana ya “mahali patakatifu kwa ajili ya jina lako”
  choice: Mahali patakatifu palipowekwa wakfu kwa jina la Mungu, likihusishwa na uwepo wake uliofunuliwa na heshima yake
  alternative: Hekalu kwa ajili ya heshima yako; mahali patakatifu panapobeba jina lako
  rationale: Tafsiri inahifadhi wazo la Agano la Kale kwamba hekalu linahusishwa na jina la Mungu, bila kudokeza kwamba Mungu anazuiliwa ndani ya mahali hapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Humo” huepuka marudio mazito ya “ndani yake,” na “kukujengea” huwasilisha kwa kawaida maana ya kujenga kwa ajili ya Mungu. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
