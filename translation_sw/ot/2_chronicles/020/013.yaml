base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: sw
  text: Na watu wote wa Yuda walikuwa wamesimama mbele za Yahwe, hata watoto wao wadogo, wake zao, na watoto wao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wao.” Neno la Kiebrania linaweza kumaanisha wana wa kiume hasa au watoto kwa ujumla, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יְהוּדָה
  choice: Watu wote wa Yuda
  rationale: Jina ‘Yuda’ linatumika hapa kwa maana ya jumuiya ya watu wake. Kiswahili cha ‘Watu wote wa Yuda’ kinaweka wazi maana hiyo ya kijamii na pia wazo la ujumla katika כָל.
- source_word: עֹמְדִים
  choice: walikuwa wamesimama
  rationale: Kitenzi-shirikishi cha Kiebrania kinaonyesha hali inayoendelea wakati huo; ‘walikuwa wamesimama’ huhifadhi maana hiyo na kupatana na ‘watu wote wa Yuda.’
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Kirai hiki humaanisha kuwa mbele ya mtu au katika uwepo wake. ‘Mbele za’ ni usemi wa Kiswahili unaofaa mazingira haya mazito ya ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina binafsi la Mungu katika maandishi ya Kiebrania; ‘Yahwe’ hulihamisha kwa namna ya kawaida katika Kiswahili badala ya kulibadili kuwa cheo.
- source_word: גַּם
  choice: pamoja na
  rationale: Katika orodha hii neno hilo linasisitiza kwamba hata washiriki wa familia waliotajwa pia walikuwapo. ‘Pamoja na’ linaeleza ujumuishaji huo kwa Kiswahili cha asili.
- source_word: טַפָּם
  choice: watoto wao wadogo
  rationale: טַף hurejelea watoto wadogo wanaowategemea wazazi wao; tafsiri hii ni wazi bila kuifungia maana kwa watoto wachanga pekee.
- source_word: נְשֵׁיהֶם
  choice: wake zao
  rationale: Katika orodha hii ya kaya, neno lenye kiambishi cha umilikaji linarejelea wake, si wanawake kwa ujumla.
- source_word: וּבְנֵיהֶם
  choice: na watoto wao
  rationale: בנים inaweza kumaanisha ‘wana’ hasa au watoto kwa upana. Katika orodha ya familia hapa, ‘watoto wao’ ni ya kawaida na huhifadhi uwezekano wa maana pana; maana finyu zaidi imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yanatumia Tetragramatoni yenyewe. Kutumia ‘Yahwe’ huhifadhi jina la agano badala ya kulibadili kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Upeo wa maana ya בְנֵיהֶם katika orodha ya kaya
  choice: watoto wao
  alternative: wana wao
  rationale: Neno linaweza kurejelea wana wa kiume au watoto kwa ujumla. Muktadha wa mkusanyiko wa kaya unaruhusu maana pana, lakini tanbihi inahifadhi maana finyu inayowezekana badala ya kuiondoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘Watu wote wa Yuda’ ili maana ya pamoja ya jina Yuda iwe wazi, na imedumisha mpangilio wa washiriki wa kaya katika Kiebrania.
