  variant: Standard East African Swahili
source:
  edition: WLC
  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: sw
  text: Ee Mungu wetu, je, si wewe uliyewafukuza wenyeji wa nchi hii mbele ya watu wako Israeli, na kuupa uzao wa Abrahamu, rafiki yako[a], nchi hiyo milele?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “aliyekupenda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: je, si wewe
  rationale: Huanzisha swali la balagha linalotarajia jibu la ndiyo; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֱלֹהֵינוּ
  choice: Ee Mungu wetu
  rationale: Ni kauli ya moja kwa moja katika sala. “Ee” huonyesha mwito kwa lugha ya heshima bila kuongeza maana ya kiteolojia.
- source_word: הוֹרַשְׁתָּ
  choice: uliyewafukuza
  rationale: Hifili ya ירשׁ hapa ina maana ya kuwaondoa wakaaji waliokuwapo ili wapoteze umiliki; “kuwafukuza” ni ya asili na huhifadhi wazo la ushindi na kuondolewa.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: wenyeji wa nchi hii
  rationale: Huwataja watu waliokuwa wakikaa katika nchi hiyo; “wenyeji” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: מִלִּפְנֵי
  choice: mbele ya
  rationale: Huhifadhi nahau ya Kiebrania ya kuwaondoa watu mbele ya uwepo au kusonga mbele kwa Israeli.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Huhifadhi jina la agano “watu wako” pamoja na jina la ufafanuzi “Israeli.”
- source_word: וַתִּתְּנָהּ
  choice: na kuupa ... nchi hiyo
  rationale: Kitendo hiki kinaendeleza swali la balagha; kurudia “nchi hiyo” badala ya kiwakilishi pekee hufanya mpokeaji na kitu kilichotolewa viwe wazi katika Kiswahili.
- source_word: לְזֶרַע אַבְרָהָם
  choice: uzao wa Abrahamu
  rationale: “Uzao” huhifadhi umoja wa kijumla wa זֶרַע huku ukimaanisha wazao wa Abrahamu kwa lugha inayotambulika katika Biblia ya Kiswahili.
- source_word: אֹהַבְךָ
  choice: rafiki yako
  rationale: Katika muktadha huu neno hilo hutumika kama sifa ya kimahusiano ya Abrahamu. Maana yake ya moja kwa moja zaidi, “aliyekupenda,” imehifadhiwa katika tanbihi.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida na wazi ya muda unaoendelea bila kikomo katika muktadha wa ahadi.
theological_decisions:
- issue: Tafsiri ya sifa ya Abrahamu אֹהַבְךָ
  choice: rafiki yako
  alternative: aliyekupenda
  rationale: “Rafiki yako” huwasilisha kwa lugha ya asili cheo cha kimahusiano kinachohusishwa na Abrahamu katika Maandiko, lakini umbo la Kiebrania linaweza kueleweka moja kwa moja kuwa “aliyekupenda.” Tanbihi huhifadhi mvutano huo bila kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa, na mpangilio wa sentensi umerekebishwa kiasi ili uhusiano kati ya nchi iliyotolewa na uzao uliopewa uwe wazi.
