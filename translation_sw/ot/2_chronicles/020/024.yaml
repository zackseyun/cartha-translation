base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: sw
  text: Watu wa Yuda walipofika mahali pa kutazamia kuelekea nyika, wakageukia ule umati. Tazama, maiti zilikuwa zimeanguka chini[a], wala hapakuwa na hata mmoja aliyenusurika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “maiti zilikuwa zimelala chini.” Kwa karibu zaidi na Kiebrania: “maiti zilizoanguka kuelekea ardhini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוּדָה
  choice: Watu wa Yuda
  rationale: Jina Yuda linatumika hapa kwa maana ya kijumla kuhusu watu au jeshi la Yuda; usemi huu wa Kiswahili unaweka wazi maana hiyo na kuendana na kitenzi cha wingi kinachofuata.
- source_word: בָּא
  choice: walipofika
  rationale: Kitenzi בוא kinaonyesha kufika mahali fulani; muundo wa 'walipofika' unaunganisha kwa kawaida tukio hili na tendo linalofuata.
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: mahali pa kutazamia palipoelekea nyikani
  rationale: מִצְפֶּה ni sehemu ya juu au mahali pa kuangalia, si lazima mnara uliojengwa. לַמִּדְבָּר inaonyesha mwelekeo wake kuelekea nyika.
- source_word: וַיִּפְנוּ
  choice: wakageukia
  rationale: פנה kimsingi ni kugeuka au kuelekeza uso/angalio; 'wakageukia' hudumisha tendo hilo bila kulifanya kuwa kutazama tu.
- source_word: אֶל הֶהָמוֹן
  choice: ule umati
  rationale: הָמוֹן humaanisha kundi kubwa au umati; muktadha unaonyesha ni majeshi ya adui, lakini tafsiri haiongezi ufafanuzi usiotajwa moja kwa moja.
- source_word: וְהִנָּם
  choice: Tazama
  rationale: Neno hili la kuonyesha linatoa mshangao na kuvuta fikira kwa jambo lililoonekana ghafla.
- source_word: פְּגָרִים
  choice: maiti
  rationale: פֶּגֶר ni mwili wa mtu aliyekufa; 'maiti' ni neno la kawaida, wazi, na lenye hadhi katika Kiswahili.
- source_word: נֹפְלִים אַרְצָה
  choice: zilikuwa zimeanguka chini
  rationale: Hii inafuata kwa karibu taswira ya Kiebrania ya maiti zilizokuwa zimeanguka kuelekea ardhini, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וְאֵין פְּלֵיטָה
  choice: wala hakuna hata mmoja aliyenusurika
  rationale: פְּלֵיטָה inaweza kumaanisha mtu aliyepona au aliyetoroka. Katika tukio hili, 'aliyenusurika' huwasilisha kwamba hakuna aliyebaki hai bila kulazimisha namna hasa ya kutoroka.
