translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Nyikani' limetumiwa kwa mazingira yasiyokaliwa badala ya kudokeza lazima jangwa la mchanga; 'mahali pa kutazamia' huepuka kuongeza wazo la mnara ambalo halilazimishwi na neno la Kiebrania.
