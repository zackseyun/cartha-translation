source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: sw
  text: Ikiwa maafa yatatupata—upanga, hukumu, tauni, au njaa—tutasimama mbele ya nyumba hii na mbele zako, kwa maana jina lako liko katika nyumba hii[a], nasi tutakulilia katika dhiki yetu, nawe utasikia na kutuokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba hii inaitwa kwa jina lako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: maafa
  rationale: Katika muktadha huu neno hilo linamaanisha janga au madhara yanayowapata watu, wala si uovu wa kimaadili. “Maafa” linaendana na orodha inayofuata.
- source_word: חֶרֶב
  choice: upanga
  rationale: Taswira halisi ya Kiebrania imehifadhiwa badala ya kuitafsiri kwa ujumla kuwa “vita.”
- source_word: שְׁפוֹט
  choice: hukumu
  rationale: Limechukuliwa kama nomino katika orodha ya maafa. “Hukumu” inadumisha ufupi na wazo la adhabu ya kimungu bila kulifafanua kupita kiasi.
- source_word: דֶבֶר
  choice: tauni
  rationale: “Tauni” ni neno la kawaida la kibiblia kwa ugonjwa wa kuambukiza unaoenea na kuleta maafa kwa watu wengi.
- source_word: רָעָב
  choice: njaa
  rationale: Linamaanisha upungufu mkubwa wa chakula unaoathiri jamii, si hisia ya njaa ya mtu mmoja tu.
- source_word: נַעַמְדָה
  choice: tutasimama
  rationale: Kauli ya kujihimiza imepewa nguvu ya wakati ujao ndani ya sentensi ya sharti, ikionyesha jambo ambalo watu watafanya maafa yakitokea.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה
  choice: mbele ya nyumba hii
  rationale: “Nyumba” linaakisi neno la Kiebrania na kuhifadhi lugha ya hekalu; “mbele ya” linafaa kwa mkao na mahali pa sala.
- source_word: וּלְפָנֶיךָ
  choice: na mbele zako
  rationale: Muundo sambamba wa kusimama mbele ya nyumba na mbele za Mungu umehifadhiwa, ukisisitiza kwamba sala inaelekezwa kwa Mungu mwenyewe.
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: kwa maana jina lako liko katika nyumba hii
  rationale: Hii inadumisha nahau ya Kiebrania kuhusu jina la Mungu na uhusiano wake na nyumba hiyo bila kuifunga kwenye maana moja tu ya umiliki au uwepo.
- source_word: וְנִזְעַק
  choice: Tutakulilia
  rationale: Kitenzi hiki kinaonyesha mwito wa dharura unaotolewa kwa Mungu wakati wa taabu, wenye nguvu kuliko kusema tu “tutakuomba.”
- source_word: מִצָּרָתֵנוּ
  choice: kutoka katika dhiki yetu
  rationale: Muundo huu unahifadhi wazo la kilio kinachotoka ndani ya hali ya dhiki, ingawa Kiswahili pia kingeweza kusema “katika dhiki yetu.”
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: nawe utasikia na kutuokoa
  rationale: Vitenzi vyote viwili vimehifadhiwa kwa uwazi. Kiambishi “tu-” katika “kutuokoa” kinaweka wazi walengwa ambao tayari wametajwa katika Kiebrania.
theological_decisions:
- issue: Teolojia ya jina la Mungu katika nyumba
  choice: jina lako liko katika nyumba hii
  alternative: jina lako liko juu ya nyumba hii; nyumba hii inaitwa kwa jina lako
  rationale: Nahau ya Kiebrania imehifadhiwa katika andiko kuu ili kuacha wazi vipengele vya uwepo, umiliki, na dai la agano la Mungu bila kuvifanya kuwa ufafanuzi mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya ibada bila kuwa cha kizamani. Alama ya tanbihi imewekwa baada ya kishazi inachokifafanua kuhusu jina la Mungu; nafasi hiyo inasahihisha kutolingana kwa alama katika safu ya mashauriano ya Kiingereza.
