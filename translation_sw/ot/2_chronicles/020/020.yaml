  verdict: revise
  source_fidelity: 'The verse is otherwise closely faithful: it preserves the early departure, the wilderness of Tekoa, the public address, the twofold exhortation involving אמן, the firmness result, and the final success/prosperity clause. However, the first imperative in the Swahili text, “Mwamini Yahwe Mungu wenu,” is singular, whereas the Hebrew הַאֲמִינוּ is plural and the following “nanyi” confirms a plural addressee. “Mwaminini Yahwe Mungu wenu” supplies the required plural imperative and object reference.'
  naturalness: The register is clear, modern Standard East African Swahili and suits a royal public exhortation. “Nyika ya Tekoa,” “wakazi wa Yerusalemu,” “mtasimama imara,” and “mtafanikiwa” are natural. The revised plural imperative is also idiomatic.
  terminology: “Yahwe” consistently represents the divine name and is suitably explained in a footnote. “Mwaminini … waaminini” appropriately retains the rhetorical repetition, while “mtasimama imara” communicates the associated firmness wordplay without forcing an unnatural Swahili equivalent. “Manabii wake” correctly reflects the plural possessive sense.
