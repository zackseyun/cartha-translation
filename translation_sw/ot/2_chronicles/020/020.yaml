  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: sw
  text: Wakaamka asubuhi na mapema, wakaenda kwenye nyika ya Tekoa. Walipokuwa wakitoka, Yehoshafati akasimama na kusema, “Nisikilizeni, enyi watu wa Yuda na wakazi wa Yerusalemu! Mwaminini Yahwe[a] Mungu wenu, nanyi mtasimama imara;[b] waaminini manabii wake,[c] nanyi mtafanikiwa.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahwe” ni jina la Mungu linalowakilishwa kwa herufi za Kiebrania YHWH.
    reason: divine_name
  - marker: b
    text: Kiebrania kina mchezo wa maneno unaotumia mzizi mmoja katika “mwaminini” na “mtasimama imara”; pia inaweza kutafsiriwa, “mtegemee Yahwe Mungu wenu, nanyi mtathibitika.”
    reason: lexical_wordplay
  - marker: c
    text: Au, “wategemeeni manabii wake.” Kitenzi kilekile cha Kiebrania kilichotafsiriwa “mwaminini” kinarudiwa hapa kwa kusisitiza.
    reason: lexical_alternative
  - marker: d
    text: 'Neno la Kiebrania lina umbo la amri, kwa hiyo pia linaweza kutafsiriwa, “basi fanikiweni.” Katika muktadha linaeleweka pia kama matokeo: “nanyi mtafanikiwa.”'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Wakaamka asubuhi na mapema
  rationale: Kauli hii inaonyesha kuamka au kuanza safari mapema; Kiswahili hiki ni cha kawaida na kinahifadhi mkazo wa wakati.
- source_word: לְמִדְבַּר תְּקוֹעַ
  choice: kwenye nyika ya Tekoa
  rationale: מִדְבָּר inaweza kumaanisha eneo kame lisilolimwa au nyika, si lazima jangwa la mchanga; “nyika” inafaa zaidi hapa.
- source_word: וּבְצֵאתָם
  choice: Walipokuwa wakitoka
  rationale: Muundo wa kihusishi pamoja na jina-kitenzi unaweka usemi wa Yehoshafati wakati wa kutoka kwao.
- source_word: שְׁמָעוּנִי
  choice: Nisikilizeni
  rationale: Amri yenye kiambishi cha nafsi ya kwanza; “Nisikilizeni” ni ya asili katika hotuba ya kisasa.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: enyi watu wa Yuda na wakazi wa Yerusalemu
  rationale: “Yuda” inataja jamii kwa ujumla; kuongeza “watu wa” huweka wazi maana hiyo katika Kiswahili bila kubadili walengwa.
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: Mwamini Yahwe Mungu wenu
  rationale: Hifil ya אמן pamoja na ב ina maana ya kuamini au kumtegemea; “mwamini” inadumisha marudio ya kitenzi hicho katika sehemu inayofuata.
- source_word: וְתֵאָמֵנוּ
  choice: nanyi mtasimama imara
  rationale: Nifali ya אמן ina wazo la kuthibitika au kuwa imara. Kauli hii ni ya asili kwa Kiswahili na inaonyesha matokeo yanayokusudiwa, ingawa mchezo wa mzizi wa Kiebrania unaelezwa katika tanbihi.
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: waaminini manabii wake
  rationale: Kitenzi kilekile אמן kinarudiwa kwa athari ya balagha; Kiswahili “waaminini” kinahifadhi marudio hayo na kinaweza kuhusisha kusadiki ujumbe wao na kuwategemea.
- source_word: וְהַצְלִיחוּ
  choice: nanyi mtafanikiwa
  rationale: Ingawa umbo la Kiebrania ni amri, katika mfuatano huu linaeleweka kwa kawaida kama matokeo ya kuamini; tanbihi inahifadhi uwezekano wa kulitafsiri kwa amri.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. “Yahwe” hulitambulisha kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya אמן katika wito huu
  choice: mwamini … waaminini
  alternative: mtegemee … wategemeeni
  rationale: “Kuamini” huhifadhi marudio ya neno la Kiebrania bila kulifanya liwe istilahi maalumu ya kimadhehebu; katika muktadha lina maana pia ya kutegemea kwa uaminifu.
- issue: Uhusiano kati ya kuamini na kusimama imara
  choice: nanyi mtasimama imara
  alternative: nanyi mtathibitika
  rationale: Kiebrania kina mchezo wa maneno kati ya Hifil na Nifali za mzizi אמן. Tafsiri iliyochaguliwa inahifadhi wazo la uimara, huku tanbihi ikieleza uhusiano wa maneno ambao hauwezi kuigwa kikamilifu kwa Kiswahili.
- issue: Nguvu ya וְהַצְלִיחוּ
  choice: nanyi mtafanikiwa
  alternative: basi fanikiweni
  rationale: Umbo ni amri, lakini linaweza kufanya kazi kama matokeo ya masharti ya wito uliotangulia. Matini kuu inafuata maana hiyo ya kimuktadha, na tanbihi inalinda umbo mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya hotuba ya hadhara lakini kinachoeleweka kwa msomaji wa kawaida. “Nyika” huepuka dhana finyu ya jangwa la mchanga; “watu wa Yuda” hufafanua mwito wa kijamii; marudio ya “mwamini/waaminini” yanatunza balagha ya chanzo.
