base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: sw
  text: Ndipo hofu ya Mungu ikawapata falme zote za nchi[a] waliposikia kwamba Yahwe alikuwa amepigana dhidi ya maadui wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hofu iliyotoka kwa Mungu.” Kirai cha Kiebrania kinaweza kumaanisha hofu inayohusishwa na uwepo au tendo la Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ndipo ... ikawapata
  rationale: Muundo huu unaonyesha mwanzo wa hali iliyotokea kama matokeo ya ushindi uliotangulia, na ni wa asili katika simulizi la Kiswahili.
- source_word: פַּחַד אֱלֹהִים
  choice: hofu ya Mungu
  rationale: 'Huhifadhi muundo na utata wa Kiebrania: inaweza kuwa hofu inayomhusu Mungu au hofu inayosababishwa na tendo lake.'
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: ikawapata falme zote za nchi
  rationale: Kitenzi 'ikawapata' huwasilisha kwa Kiswahili hali ya hofu iliyowajia falme; wingi wa הָאֲרָצוֹת umehifadhiwa kwa 'nchi' katika maana yake ya wingi kulingana na muktadha.
- source_word: בְּשָׁמְעָם כִּי
  choice: waliposikia kwamba
  rationale: Huonyesha kwa uwazi uhusiano wa wakati na yaliyokuwa maudhui ya habari walizosikia.
- source_word: נִלְחַם יְהוָה
  choice: Yahwe alikuwa amepigana
  rationale: Wakati timilifu unaonyesha tendo lililokuwa limekamilika kabla falme hizo hazijasikia habari zake; jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili.
- source_word: עִם אוֹיְבֵי יִשְׂרָאֵל
  choice: dhidi ya maadui wa Israeli
  rationale: Pamoja na kitenzi cha kupigana, עִם hutaja upande unaokabiliwa vitani; 'dhidi ya' huondoa dhana potovu kwamba Yahwe alipigana akiwa pamoja nao.
theological_decisions:
- issue: Maana ya פַּחַד אֱלֹהִים
  choice: hofu ya Mungu
  alternative: hofu iliyotoka kwa Mungu
  rationale: Tafsiri kuu huhifadhi uhusiano mpana wa kirai cha Kiebrania bila kuamua kimya kimya kama ni kumwogopa Mungu au hofu iliyosababishwa moja kwa moja na Mungu.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo; kwa hiyo limetoholewa kama 'Yahwe' badala ya kubadilishwa kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye staha. 'Ndipo' huunganisha aya na matokeo ya tukio lililotangulia, huku 'ikawapata' ikiwa ya asili zaidi kuliko tafsiri ya neno kwa neno ya kihusishi cha Kiebrania.
