source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: sw
  text: Siku ya nne walikusanyika katika Bonde la Beraka[a], kwa sababu huko walimbariki Yahwe. Kwa hiyo wakaliita mahali hapo Bonde la Beraka, hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beraka maana yake ni “baraka.”
    reason: Maelezo haya yanaonyesha maana ya jina la Kiebrania na mchezo wa maneno kati ya “Beraka” na “walimbariki.”
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: walikusanyika
  rationale: Kauli ya Niphal hapa inaonyesha watu walikuja pamoja; “walikusanyika” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: עֵמֶק
  choice: Bonde
  rationale: Neno hili humaanisha bonde, na hapa ni sehemu ya jina la mahali.
- source_word: בְּרָכָה
  choice: Beraka
  rationale: Katika jina עֵמֶק בְּרָכָה limetoholewa kama jina la mahali; tanbihi inaeleza maana yake, “baraka,” na hivyo kudumisha mchezo wa maneno unaohusiana na kitenzi “walimbariki.”
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: kwa sababu huko walimbariki Yahwe
  rationale: כִּי inaonyesha sababu ya jina hilo. “Walimbariki” huhifadhi uhusiano wa kileksia na בְּרָכָה, huku “huko” ikirejelea mahali walipokusanyika.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: wakapaita mahali hapo
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya nahau ya Kiebrania ya kupaita jina mahali, bila usemi mgumu wa neno kwa neno.
- source_word: עַד הַיּוֹם
  choice: hadi leo
  rationale: Ni nahau ya Kiebrania inayoonyesha kwamba jina hilo liliendelea kutumiwa mpaka wakati wa mwandishi; “hadi leo” ni sawa ya kawaida katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la pekee יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
- issue: Maana ya בֵּרֲכוּ kuhusu wanadamu kumbariki Mungu
  choice: walimbariki
  alternative: walimsifu
  rationale: “Walimbariki” huhifadhi maana ya msingi na mchezo wa maneno kati ya בֵּרֲכוּ na בְּרָכָה. “Walimsifu” ingeweza kufafanua maana kwa urahisi zaidi lakini ingeondoa uhusiano huo wa maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wa leo, huku jina la mahali, jina la Mungu, uhusiano wa sababu, na mchezo wa maneno wa Kiebrania vikihifadhiwa.
