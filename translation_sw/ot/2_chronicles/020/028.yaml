base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: sw
  text: Wakaja Yerusalemu wakiwa na vinubi[a], zeze, na tarumbeta, mpaka nyumba ya Yahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vinanda” au “luteni”; umbo kamili la ala ya kale inayoitwa נְבָלִים halijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Yaani, “hekalu la Yahwe”; kwa neno halisi, “nyumba ya Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Wakafika
  rationale: Kitenzi בוא katika mfululizo wa simulizi kinaonyesha kufika kwao katika Yerusalemu; “wakafika” ni Kiswahili cha kawaida na hakiongezi wazo mahsusi la kuingia.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: בִּנְבָלִים
  choice: wakiwa na vinanda[a]
  rationale: נבל ni ala ya nyuzi, huenda aina ya kinubi au luteni. “Vinanda” ni neno linaloeleweka kwa ala za nyuzi, huku kutokuwa na uhakika kuhusu umbo lake la kale kukihifadhiwa katika tanbihi.
- source_word: וּבְכִנֹּרוֹת
  choice: zeze
  rationale: כִּנּוֹר ni ala ya nyuzi inayofanana na kinubi kidogo; “zeze” huitofautisha na נבל badala ya kuyafanya majina yote mawili kuwa ala moja.
- source_word: וּבַחֲצֹצְרוֹת
  choice: na tarumbeta
  rationale: חֲצֹצְרָה ni tarumbeta ya sherehe au ibada. Maandishi haya hayasemi moja kwa moja kwamba zilikuwa za fedha, kwa hiyo maelezo hayo hayajaongezwa.
- source_word: אֶל בֵּית יְהוָה
  choice: wakaenda katika nyumba ya Yahwe[b]
  rationale: Kirai kihalisi ni “kwenda kwenye nyumba ya Yahwe.” Kurudia kitenzi kwa “wakaenda” kunafanya uhusiano wa kisarufi uwe wazi na wa kawaida katika Kiswahili, bila kubadili mwelekeo unaoonyeshwa na אֶל.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni yenyewe. “Yahwe” huhifadhi jina binafsi la Mungu, bila kulibadilisha kuwa cheo; “Yehova” ni umbo la mapokeo lililotokana na uunganishaji wa konsonanti na vokali za kusomea.
- issue: Maana ya בֵּית יְהוָה
  choice: nyumba ya Yahwe
  alternative: hekalu la Yahwe
  rationale: “Nyumba ya Yahwe” huhifadhi sitiari na usemi wa Kiebrania; katika muktadha inarejelea hekalu, jambo linalowekwa wazi katika tanbihi bila kubadilisha maandishi makuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. “Wakiwa na” huepuka mkanganyiko wa kutumia “kwa” katika orodha ya ala, na “wakaenda katika” huwasilisha kwa kawaida mwelekeo wa אֶל בֵּית יְהוָה.
