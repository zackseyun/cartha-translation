  to: Kisha Yehoshafati na watu wake wakaja kuteka nyara za maadui hao. Wakapata miongoni mwao mali, maiti[a], na vitu vya thamani kwa wingi; wakajichukulia nyara nyingi kuliko walivyoweza kubeba. Kwa siku tatu walikuwa wakiteka nyara, kwa kuwa zilikuwa nyingi sana.
