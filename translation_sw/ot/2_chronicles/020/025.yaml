    rationale: Katika Kiebrania kiambishi cha wingi kinawarejelea walioshindwa; kwa Kiswahili, “zao” inaweza kurejelea kwa urahisi Yehoshafati na watu wake waliotajwa karibu. “Nyara za maadui hao” huweka rejeo lililokusudiwa wazi.
  - severity: medium
    issue: “wakikusanya nyara” ni dhaifu kuliko בֹּזְזִים.
    rationale: Kukusanya kunaweza kumaanisha kuokota au kupanga vitu. Kitenzi cha Kiebrania kina maana ya kuteka/kuchukua nyara za vita; “wakiteka nyara” hudumisha maana hiyo bila kuongeza ukali usiohitajika.
  - severity: low
    issue: Sentensi ya mwisho ya tanbihi ina uhusiano wa kisarufi usio wazi katika “kati yake.”
    rationale: Kubadilisha kuwa “miongoni mwao” na kumrejelea maadui walioanguka hufanya maelezo ya muktadha yaeleweke vizuri bila kudai tafsiri ya uhakika ya neno lenye utata wa ushahidi wa kale.
