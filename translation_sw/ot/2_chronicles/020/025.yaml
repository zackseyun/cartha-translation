  source_fidelity: Marekebisho yanahitajika ili kurejesha wazi rejeo la kiambishi cha “nyara zao” kwa maadui walioshindwa, na ili kitenzi cha mwisho kiwe na maana ya kuteka nyara, si kukusanya tu. Matini inahifadhi kwa usahihi פְגָרִים (“maiti”) katika matini kuu.
  naturalness: Kiswahili cha rasimu kwa jumla ni sanifu na cha asili. Hata hivyo, “wakikusanya nyara” hupunguza maana ya kijeshi ya בֹּזְזִים, na “nyara zao” inaweza kueleweka kimakosa kuwa ni nyara za Yehoshafati na watu wake.
  terminology: “Yehoshafati,” “nyara,” “maiti,” “mali,” na “vitu vya thamani” zinafaa. “Kuteka nyara” ni usemi wa kawaida unaowasilisha vizuri kitendo cha kuchukua nyara za vita.
  issues:
