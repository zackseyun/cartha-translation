source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוֹשָׁפָ֣ט וְ/עַמּ/וֹ֮ לָ/בֹ֣ז אֶת שְׁלָלָ/ם֒ וַ/יִּמְצְאוּ֩ בָ/הֶ֨ם לָ/רֹ֜ב וּ/רְכ֤וּשׁ וּ/פְגָרִים֙ וּ/כְלֵ֣י חֲמֻד֔וֹת וַ/יְנַצְּל֥וּ לָ/הֶ֖ם לְ/אֵ֣ין מַשָּׂ֑א וַ/יִּֽהְי֞וּ יָמִ֧ים שְׁלוֹשָׁ֛ה בֹּזְזִ֥ים אֶת הַ/שָּׁלָ֖ל כִּ֥י רַב הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: sw
  text: Kisha Yehoshafati na watu wake wakaja kuteka nyara za maadui hao. Wakapata miongoni mwao mali, maiti[a], na vitu vya thamani kwa wingi; wakajichukulia nyara nyingi kuliko walivyoweza kubeba. Kwa siku tatu walikuwa wakiteka nyara, kwa kuwa zilikuwa nyingi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “maiti.” Baadhi ya mashahidi wa kale na tafsiri zinaonyesha usomaji kama “mavazi,” au huliacha neno hilo ili orodha isomeke kwa urahisi zaidi; lakini Maandishi ya Kimasoreti yanasema “maiti,” huenda ikirejelea miili ya maadui walioanguka, ambao nyara zilipatikana miongoni mwao.'
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: kuchukua nyara zao
  rationale: Kirai hiki kinaonyesha kusudi la kuja kwao na nyara za vita zilizokuwa mali ya maadui walioshindwa. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya kijeshi.
- source_word: בָהֶם
  choice: kati yao
  rationale: Kiwakilishi kinaelekea kwa maadui walioanguka; usemi huu unaweza kujumuisha vitu vilivyokuwa miongoni mwao au juu yao bila kufafanua zaidi ya Kiebrania.
- source_word: לָרֹב וּרְכוּשׁ
  choice: mali nyingi
  rationale: רְכוּשׁ ni mali au vitu vinavyomilikiwa, na לָרֹב husisitiza wingi wake.
- source_word: פְגָרִים
  choice: maiti
  rationale: Maandishi ya Kimasoreti yana neno linalomaanisha maiti au mizoga. Katika muktadha wa vita, “maiti” ni tafsiri ya moja kwa moja, yenye heshima, na ya kawaida.
- source_word: כְלֵי חֲמֻדוֹת
  choice: vitu vya thamani
  rationale: Kirai hiki kinataja kwa upana vyombo au vitu vinavyotamaniwa; “vitu vya thamani” ni cha asili na hakivibani kuwa vyombo vya aina fulani.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: wakajichukulia
  rationale: Piel ya נצל hapa ina maana ya kuvua au kutwaa nyara kwa faida yao. “Wakajichukulia” huwasilisha kitendo na manufaa yao bila kufanya sentensi kuwa ngumu.
- source_word: לְאֵין מַשָּׂא
  choice: vitu vingi kuliko walivyoweza kubeba
  rationale: Usemi huu unaonyesha kwamba kiasi kilizidi uwezo wao wa kubeba; tafsiri hii ni wazi katika Kiswahili cha sasa.
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: Walitumia siku tatu wakikusanya nyara
  rationale: Muundo huu unaonyesha tendo lililoendelea kwa muda wa siku tatu. “Wakikusanya nyara” ni wa asili na huepuka wazo lisilokusudiwa la uporaji wa raia.
- source_word: כִּי רַב הוּא
  choice: kwa sababu zilikuwa nyingi sana
  rationale: 'Kifungu kinaeleza sababu ya kutumia siku tatu: wingi mkubwa wa nyara.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inafuata Maandishi ya Kimasoreti katika kuweka “maiti” kwenye matini kuu, huku tanbihi ikieleza tofauti ya maandishi ya kale. “Yehoshafati” limetumiwa kama umbo la kawaida la jina hilo katika mapokeo ya Biblia ya Kiswahili.
