base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: sw
  text: Ufalme wa Yehoshafati ukawa na amani,[a] na Mungu wake akampa raha kutoka kila upande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukawa katika utulivu.”
    reason: Kitenzi שׁקט kinaweza kumaanisha kuwa kimya, kutulia, au kutosumbuliwa; “katika utulivu” huhifadhi mbadala huo wa kileksika kwa Kiswahili cha asili.
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: ukawa na amani
  rationale: Kitenzi שׁקט humaanisha kuwa kimya, kutosumbuliwa, au kuwa na amani. Ufalme ukiwa kiima, ‘ukawa na amani’ ni Kiswahili cha kawaida na huwasilisha hali ya kutokuwa na misukosuko.
- source_word: מַלְכוּת
  choice: ufalme
  rationale: Neno hili hapa linaashiria ufalme au eneo lililotawaliwa na Yehoshafati; ‘ufalme’ ni tafsiri ya kawaida na inayoeleweka.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: וַיָּנַח
  choice: akampa pumziko
  rationale: 'Hifili ya נוח ina maana ya kisababishi: Mungu alimfanya apumzike au akampa hali ya kutosumbuliwa. ‘Akampa pumziko’ huhifadhi maana hiyo.'
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha umilikaji humrejelea Yehoshafati; ingawa אֱלֹהִים ina umbo la wingi, maana yake hapa ni Mungu mmoja.
- source_word: מִסָּבִיב
  choice: pande zote
  rationale: Kirai hiki kinaonyesha pumziko dhidi ya vitisho vilivyomzunguka kutoka kila upande. ‘Pande zote’ ni cha asili na huhifadhi wazo la ukamilifu wa eneo.
- source_word: וַ
  choice: na
  rationale: Kiunganishi cha Kiebrania kimehifadhiwa kwa ‘na,’ bila kulazimisha uhusiano wa kisababishi ambao unaweza kueleweka kutokana na muktadha.
theological_decisions:
- issue: Utendaji wa Mungu katika amani ya ufalme
  choice: Sentensi ya pili inasema wazi kuwa Mungu wake alimpa Yehoshafati pumziko pande zote, huku ikiunganishwa kwa ‘na.’
  alternative: Kutumia ‘kwa maana’ ili kueleza wazi kuwa pumziko alilopewa na Mungu ndilo lililosababisha amani ya ufalme.
  rationale: Kiebrania kina vishazi viwili vilivyounganishwa kwa waw. ‘Na’ huhifadhi uratibu huo na pia hudumisha uwezekano wa kuona kishazi cha pili kuwa maelezo ya msingi wa amani bila kuufanya uhusiano huo kuwa wa lazima kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ukawa na amani’ ni cha kawaida kuliko kusema ufalme ‘ukawa kimya,’ huku tanbihi ikihifadhi maana mbadala. Alama ya tanbihi imewekwa mara tu baada ya kirai husika.
