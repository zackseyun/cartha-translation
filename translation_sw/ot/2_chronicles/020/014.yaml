  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: sw
  text: Naye Yahazieli mwana wa Zekaria, mwana wa Benaya, mwana wa Yeieli, mwana wa Matania, Mlawi wa ukoo wa Asafu—Roho wa Yahweh akaja juu yake katikati ya kusanyiko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַחֲזִיאֵל
  choice: Naye Yahazieli
  rationale: Kiunganishi וְ kinadumishwa kama kiungo cha masimulizi kwa kutumia “Naye”; jina linatoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: mwana wa ... mwana wa ... mwana wa ... mwana wa
  rationale: Urudiaji wa nasaba umehifadhiwa kama ulivyo katika Kiebrania badala ya kufupishwa kuwa “mzao wa.”
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Hili ni jina la utambulisho wa kikundi cha Walawi; Kiswahili cha kawaida hutumia “Mlawi” bila kuhitaji kibainishi kinacholingana moja kwa moja na makala ya Kiebrania.
- source_word: מִן בְּנֵי אָסָף
  choice: wa ukoo wa Asafu
  rationale: Katika muktadha huu “wana wa Asafu” ni kundi la ukoo au chama cha Walawi. “Wa ukoo wa Asafu” huwasilisha uhusiano huo kwa Kiswahili cha asili bila kudokeza kwamba wote ni wana wa moja kwa moja.
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: Roho wa Yahweh akamjia
  rationale: Nahau hiyo inaeleza Roho wa Mungu kumjia mtu kwa ajili ya usemi au tendo la kinabii. “Akamjia” huonyesha tukio hilo kwa Kiswahili cha kawaida bila kuongeza taswira ya kushuka ambayo haikutajwa wazi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano YHWH limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo kama “Bwana.”
- source_word: בְּתוֹךְ הַקָּהָל
  choice: katikati ya kusanyiko
  rationale: “Katikati ya” huhifadhi wazo la kuwa ndani ya kundi lililokusanyika, na “kusanyiko” linafaa kwa mkutano huu wa hadhara.
theological_decisions:
- issue: Maana ya רוּחַ יְהוָה
  choice: Roho wa Yahweh
  alternative: roho ya Yahweh
  rationale: Muktadha unaonyesha uwepo na utendaji wa Mungu unaomwezesha Yahazieli kutangaza ujumbe wa kinabii. Herufi kubwa katika “Roho” inaonyesha rejeo hilo bila kuongeza maelezo yasiyomo katika Kiebrania.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, YHWH; kulitoherea kama “Yahweh” hulihifadhi badala ya kuliweka kwa cheo.
- issue: Nguvu ya הָיְתָה עָלָיו
  choice: akamjia
  alternative: alikuwa juu yake
  rationale: Kiswahili “akamjia” huwasilisha kwa kawaida kuanza kwa tukio la kinabii katika simulizi. “Alikuwa juu yake” lingehifadhi zaidi hali ya kirai lakini lingesikika lisilo la kawaida na lenye utata wa kimahali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Mlolongo kamili wa nasaba umehifadhiwa; vistari virefu vinatenganisha utambulisho wa Yahazieli na tukio la kuja kwa Roho.
