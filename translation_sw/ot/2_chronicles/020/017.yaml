  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: sw
  text: Hamtahitaji kupigana katika vita hivi. Jipangeni mahali penu, simameni, na mkaone wokovu[a] wa Yahweh, aliye pamoja nanyi, enyi Yuda na Yerusalemu. Msiogope wala msifadhaike. Kesho tokeni mbele yao, na Yahweh yuko pamoja nanyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi wa Yahweh.” Neno la Kiebrania linaweza kumaanisha kuokolewa vitani na pia wokovu kwa maana pana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahweh atakuwa pamoja nanyi.” Kishazi cha Kiebrania hakina kitenzi kilichotajwa wazi, hivyo kinaweza kueleweka kama uhakikisho wa sasa au wa wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: Hamtahitaji kupigana katika vita hivi
  rationale: Muundo wa Kiebrania unasema kihalisi kwamba kupigana katika jambo hili si jukumu lao; usemi huu wa Kiswahili unaeleza maana hiyo kwa kawaida bila kudokeza kwamba vita si halisi.
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: Jipangeni mahali penu, simameni
  rationale: 'Vitenzi viwili vya amri vinahifadhiwa: cha kwanza kinataka wajipange au wajiweke mahali pao, na cha pili kinawataka wasimame na kutazama.'
- source_word: יְשׁוּעַת יְהוָה
  choice: wokovu wa Yahweh
  rationale: Neno יְשׁוּעָה linaweza kumaanisha wokovu au ukombozi; “wokovu” huhifadhi upana wa maana huku muktadha ukionyesha wazi kuwa ni kuokolewa vitani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: עִמָּכֶם
  choice: akiwa pamoja nanyi / yuko pamoja nanyi
  rationale: Kihusishi hiki huonyesha kuwapo kwa Mungu pamoja na watu wake na msaada wake kwao.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Msiogope wala msifadhaike
  rationale: “Wala” huunganisha makatazo mawili kwa Kiswahili cha kawaida na kuhifadhi tofauti kati ya kuogopa na kufadhaika.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: Kesho tokeni mwende mbele yao
  rationale: Tafsiri hii inahifadhi maana ya msingi ya kwenda mbele yao; katika muktadha wa kijeshi inamaanisha kwenda kuwakabili bila kulazimisha maana hiyo kuwa tafsiri pekee.
- source_word: וַיהוָה עִמָּכֶם
  choice: kwa maana Yahweh yuko pamoja nanyi
  rationale: Kishazi cha Kiebrania hakina kitenzi kilicho wazi. Wakati wa sasa unaeleza uhakikisho wa kuwapo kwa Mungu, na kiunganishi kinaeleweka kimuktadha kama msingi wa amri iliyotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, hivyo unukuzi hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Upana wa maana ya יְשׁוּעָה
  choice: wokovu
  alternative: ukombozi
  rationale: “Wokovu” huhifadhi maana pana ya neno hilo, huku tanbihi ikitaja maana ya kuokolewa au kukombolewa vitani katika muktadha huu.
- issue: Wakati wa kishazi וַיהוָה עִמָּכֶם
  choice: Yahweh yuko pamoja nanyi
  alternative: Yahweh atakuwa pamoja nanyi
  rationale: Kwa kuwa Kiebrania hakina kitenzi kilichoandikwa, wakati wa sasa na wa baadaye yanawezekana. Tafsiri kuu inahifadhi uhakikisho wa kuwapo kwake sasa, na tanbihi inalinda uwezekano wa maana ya wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Amri fupi zimehifadhi msisitizo wa hotuba ya kinabii, na istilahi za kimadhehebu zimeepukwa.
