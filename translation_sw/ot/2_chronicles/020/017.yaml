  to: Hamtahitaji kupigana katika vita hivi. Jipangeni mahali penu, simameni, na mkaone wokovu[a] wa Yahweh, aliye pamoja nanyi, enyi Yuda na Yerusalemu. Msiogope wala msifadhaike. Kesho tokeni mbele yao, na Yahweh yuko pamoja nanyi.[b]
