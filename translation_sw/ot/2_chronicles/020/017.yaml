  terminology: “Yahweh,” “wokovu,” “msiogope,” na “msifadhaike” zinafaa. Tanbihi a inatunza vizuri mbadala wa “ukombozi.” Tanbihi b inatunza hali ya kishazi kisicho na kitenzi wazi; hata hivyo, maelezo yake yaseme “kitenzi kilichotajwa wazi” kwa Kiswahili cha asili zaidi.
