  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: sw
  text: Ndipo Yehoshafati akainama uso wake hadi nchi, na watu wote wa Yuda pamoja na wakazi wa Yerusalemu wakaanguka chini mbele ya Yahwe ili kumwabudu Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “wakaanguka mbele ya Yahwe ili kumsujudia Yahwe.”'
    reason: Mnyambuliko wa שׁחה unaweza kueleza moja kwa moja tendo la kusujudu au, katika muktadha huu, kumwabudu.
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: akainama
  rationale: Kitenzi קָדַד kinaeleza kuinama kwa heshima. “Akainama” ni cha kawaida na hakiongezi wazo la kupiga magoti ambalo halijasemwa wazi.
- source_word: אַפַּיִם אָרְצָה
  choice: uso wake ukiwa mpaka chini
  rationale: Nahau hii inaeleza kuinama kabisa, uso ukielekea au kufika chini. Tafsiri hii inawasilisha tendo hilo wazi kwa Kiswahili cha sasa.
- source_word: וְכָל יְהוּדָה
  choice: watu wote wa Yuda
  rationale: “Yuda” hapa inawakilisha watu wa Yuda kwa ujumla. Kutaja “watu” kunafanya maana hiyo ya kimetonimia ieleweke kwa msomaji wa kawaida.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: wakazi wa Yerusalemu
  rationale: Kirai hiki kinamaanisha watu wanaoishi Yerusalemu; “wakazi” ni neno la kawaida na sahihi.
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: wakaanguka chini mbele za Yahwe
  rationale: Tafsiri hii inadumisha tendo halisi la kuanguka mbele za Mungu katika muktadha wa ibada bila kulibadili moja kwa moja kuwa maelezo ya kitheolojia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: לְהִשְׁתַּחֲוֺת
  choice: ili kumwabudu
  rationale: Katika muktadha huu, hitpaeli ya שׁחה inaonyesha kusujudu kama tendo la ibada. “Ili kumwabudu” huonyesha kusudi la kuanguka chini, huku tanbihi ikihifadhi maana halisi ya kuinama au kusujudu.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Kurudiwa kwa jina la Mungu katika Kiebrania kumehifadhiwa badala ya kutumia kiwakilishi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina, bila kulibadilisha kuwa cheo.
- issue: Maana ya לְהִשְׁתַּחֲוֺת katika tendo la ibada
  choice: ili kumwabudu
  alternative: ili kumsujudia
  rationale: Muktadha unaonyesha kwamba kuinama kwao ni ibada, lakini kitenzi pia kina maana halisi ya kusujudu. Matini kuu inatoa maana ya kimuktadha, na tanbihi inahifadhi picha ya tendo lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaepuka lugha nzito isiyo ya lazima, unafafanua matumizi ya kimetonimia ya “Yuda,” na unahifadhi kurudiwa kwa jina “Yahwe” katika chanzo.
