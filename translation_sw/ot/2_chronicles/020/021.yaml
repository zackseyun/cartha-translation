  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: sw
  text: Baada ya kushauriana na watu, akateua waimbaji wa kumwimbia Yahwe na kumsifu kwa fahari ya utakatifu[a], walipotoka mbele ya kikosi cha mbele[b], wakisema, “Mshukuruni Yahwe, kwa maana upendo wake wa kudumu[c] ni wa milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uzuri wa utakatifu,” au “kwa fahari takatifu.” Kirai cha Kiebrania kinaweza pia kurejelea mapambo au mavazi matakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mbele ya kikosi cha kutangulia” au “mbele ya askari waliojiandaa kwa vita.”
    reason: lexical_alternative
  - marker: c
    text: Au, “rehema zake.” Neno la Kiebrania חֶסֶד hujumuisha wazo la upendo mwaminifu, rehema, na uaminifu wa kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל הָעָם
  choice: Baada ya kushauriana na watu
  rationale: Kauli ya Niphal ya יעץ hapa inaonyesha kushauriana au kutafuta shauri. Muundo huu ni wa kawaida katika Kiswahili na unadumisha mfuatano wa matukio.
- source_word: וַיַּעֲמֵד
  choice: akawaweka
  rationale: Hiphil ya עמד inaweza kumaanisha kusimamisha, kuweka mahali, au kuteua. ‘Akawaweka’ huhifadhi upana huo kuliko ‘akawateua’ pekee na inafaa kwa kuwaweka waimbaji mbele ya jeshi.
- source_word: מְשֹׁרֲרִים לַיהוָה
  choice: waimbaji kwa ajili ya Yahwe
  rationale: מְשֹׁרֲרִים ni waimbaji hasa, si wanamuziki kwa ujumla. ל inaweza kueleza huduma yao kwa Yahwe; ‘kwa ajili ya Yahwe’ ni ya asili hapa.
- source_word: וּמְהַלְלִים לְהַדְרַת קֹדֶשׁ
  choice: wamsifu katika fahari ya utakatifu
  rationale: Kirai לְהַדְרַת קֹדֶשׁ kinaweza kueleweka kwa njia zaidi ya moja. ‘Katika fahari ya utakatifu’ hudumisha uhusiano usiofafanuliwa kikamilifu kati ya fahari na utakatifu bila kuamua ikiwa kinarejelea mavazi, ibada, au sifa ya Mungu.
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: walipokuwa wakitangulia mbele ya askari wa mstari wa mbele
  rationale: בְּצֵאת huonyesha tendo linalotokea wakati uleule, na הֶחָלוּץ ni kikosi kilichotangulia au askari wa mbele, si jeshi lote.
- source_word: הוֹדוּ לַיהוָה
  choice: Mshukuruni Yahwe
  rationale: Hiphil ya ידה katika muktadha wa ibada humaanisha kushukuru au kusifu. Sababu inayofuata inaunga mkono ‘mshukuruni.’
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: kwa maana upendo wake thabiti ni wa milele
  rationale: חֶסֶד hujumuisha upendo wa kudumu, uaminifu, na rehema. ‘Upendo thabiti’ huhifadhi wazo la uthabiti bila kulifungia neno katika maana moja tu; ‘ni’ limeongezwa kwa sarufi ya Kiswahili kwa kuwa Kiebrania hakina kitenzi wazi hapa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja. ‘Yahwe’ hulitambulisha kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֶסֶד
  choice: upendo thabiti
  alternative: rehema; upendo wa agano; fadhili za kudumu
  rationale: Neno lina wigo unaojumuisha upendo mwaminifu, rehema, na uaminifu wa agano. ‘Upendo thabiti’ ni wazi kwa msomaji wa sasa na huepuka kulazimisha maana moja ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa mwito wa shukrani umehifadhiwa, huku utata wa לְהַדְרַת קֹדֶשׁ na upana wa חֶסֶד ukionyeshwa katika tanbihi.
