  source_fidelity: 'Rasimu inafuata kwa ujumla mfuatano na maana ya Kiebrania: kushauriana na watu, kuweka waimbaji, kwenda mbele ya kikosi cha kutangulia, na mwito wa kumshukuru Yahwe. Hata hivyo, “akawaweka ... wamsifu” haielezi kwa usahihi uhusiano wa uteuzi na shughuli ya waimbaji, na “katika fahari ya utakatifu” si muundo wa asili zaidi katika muktadha huu.'
