  text: וַ/יַּ֨עַשׂ֙ מִזְבַּ֣ח נְחֹ֔שֶׁת עֶשְׂרִ֤ים אַמָּה֙ אָרְכּ֔/וֹ וְ/עֶשְׂרִ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/עֶ֥שֶׂר אַמּ֖וֹת קוֹמָתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: sw
  text: Akatengeneza madhabahu ya shaba[a], yenye urefu wa dhiraa ishirini, upana wa dhiraa ishirini, na kimo cha dhiraa kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “madhabahu ya shaba nyekundu.” Neno la Kiebrania נְחֹשֶׁת linaweza kumaanisha shaba au aloi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kauli ya wayyiqtol ya עשה inaendeleza simulizi kwa tendo lililofuata; wakati uliopita wa Kiswahili unawakilisha hilo kwa kawaida bila kulazimisha kiunganishi.
- source_word: מִזְבַּח
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa mahali au jengo la kutolea dhabihu.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba au aloi yake; katika Kiswahili 'shaba' ni neno la kawaida na linalofaa kwa vifaa vya hekalu huku tanbihi ikihifadhi uwezekano wa shaba nyekundu.
- source_word: עֶשְׂרִים אַמָּה
  choice: dhiraa ishirini
  rationale: Kipimo cha kale kinahifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa, ili kudumisha sura ya usanifu wa maandiko.
- source_word: אָרְכּוֹ
  choice: yenye urefu wa
  rationale: Muundo huu ni wa asili katika Kiswahili kwa kutaja vipimo vya kitu na unaonyesha wazi kuwa kipimo kinaihusu madhabahu.
- source_word: רָחְבּוֹ
  choice: upana wa
  rationale: Katika muktadha wa usanifu, 'upana' ni tafsiri ya kawaida na sahihi.
- source_word: וְעֶשֶׂר אַמּוֹת
  choice: na ... dhiraa kumi
  rationale: Idadi na kipimo vimehifadhiwa moja kwa moja, huku mpangilio ukifanywa kuwa wa kawaida katika Kiswahili.
- source_word: קוֹמָתוֹ
  choice: kimo cha
  rationale: '''Kimo'' ni neno la kawaida la Kiswahili kwa urefu wa wima wa kitu na linafaa katika muktadha huu wa usanifu.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Muundo wa vipimo umerahisishwa kuwa wa asili katika Kiswahili bila kupoteza vipimo vya maandishi ya Kiebrania.
