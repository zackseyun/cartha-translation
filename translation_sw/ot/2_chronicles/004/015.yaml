  text: the one Sea[a], and the twelve oxen under it.
translation:
  language: sw
  text: Bahari moja[a], na ng’ombe kumi na wawili chini yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “birika lililoitwa Bahari, na ng’ombe kumi na wawili chini yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: Bahari
  rationale: Neno יָם kwa kawaida humaanisha “bahari,” lakini hapa ni jina la birika kubwa la Hekalu. Herufi kubwa inalihifadhi kama jina la kifaa huku tanbihi ikifafanua maana yake.
- source_word: אֶחָד
  choice: moja
  rationale: Namba hii inaeleza Bahari na kudumisha mtindo mfupi wa orodha katika muktadha.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: בָּקָר ni jina la jumla la ng’ombe; hapa linarejelea sanamu kumi na mbili za ng’ombe zilizotegemeza Bahari. “Ng’ombe” ni ya asili na haibainishi jinsia ambayo neno la Kiebrania halijaibainisha wazi hapa.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Hii ndiyo namna ya kawaida ya kuhesabu ng’ombe katika Kiswahili, kwa upatanisho wa ngeli unaofaa.
- source_word: תַּחְתָּיו
  choice: chini yake
  rationale: Kiwakilishi kinarejelea Bahari iliyo umoja; “chini yake” ni tafsiri fupi na ya kawaida.
- source_word: אֶת ... וְאֶת
  choice: '[hakutafsiriwa kando; huonyesha yambwa tendwa]'
  rationale: אֶת ni alama ya yambwa tendwa katika Kiebrania na haihitaji neno tofauti katika Kiswahili.
