base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: sw
  text: Mikasi ya kukatia tambi za taa, mabakuli, vikombe, na vyombo vya kubebea makaa, vyote vilikuwa vya dhahabu safi. Na mwingilio wa nyumba hiyo—milango yake ya ndani ya kuelekea Patakatifu pa Patakatifu, na milango ya nyumba hiyo ya kuelekea ukumbi mkuu[a]—vyote vilikuwa vya dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu kuu ya Hekalu” au “patakatifu.” Neno la Kiebrania hapa linamaanisha chumba kikuu cha Hekalu, tofauti na Patakatifu pa Patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: mikasi ya kukatia tambi za taa
  rationale: Katika orodha ya vifaa vya Hekalu, neno hili linaelekea kumaanisha vifaa vya kukatia au kurekebisha tambi za taa. Kauli hii ni wazi kwa msomaji wa Kiswahili na haielekei kwenye maana ya jumla ya visu.
- source_word: מִזְרָקוֹת
  choice: mabakuli
  rationale: Neno hili hutaja vyombo vya ibada, mara nyingi vya kupokea au kunyunyizia damu. “Mabakuli” ni neno la kawaida na linatofautishwa na כַּפּוֹת kwa kutafsiri hilo kama “vikombe.”
- source_word: כַּפּוֹת
  choice: vikombe
  rationale: Hapa neno hili linataja vyombo vidogo. “Vikombe” hudumisha tofauti yake na mabakuli yaliyotajwa kabla yake.
- source_word: מַּחְתּוֹת
  choice: vyombo vya kubebea makaa
  rationale: Neno hili hutaja vyombo vya kushikia au kubebea makaa ya moto. Tafsiri hii haiongezi dhana ya matumizi ya uvumba ambayo “vyetezo” ingeweza kudokeza.
- source_word: זָהָב סָגוּר
  choice: dhahabu safi
  rationale: Muungano huu wa maneno unaonyesha dhahabu bora iliyosafishwa; “dhahabu safi” ni usemi wa kawaida na wa kueleweka.
- source_word: פֶּתַח הַבַּיִת
  choice: mwingilio wa nyumba hiyo
  rationale: פֶּתַח ni nafasi au njia ya kuingilia. “Mwingilio” huunganika kwa kawaida na maelezo yanayofuata kuhusu milango.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: milango yake ya ndani
  rationale: Wingi wa Kiebrania unataja milango au mabawa yake mawili; tafsiri hii ni ya kawaida na inadumisha tofauti na milango ya ukumbi mkuu.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: iliyoelekea Patakatifu pa Patakatifu
  rationale: Kauli ya Kiebrania inaweza kuonyesha mahali milango hiyo ilipoelekea. “Patakatifu pa Patakatifu” hudumisha muundo wa kusisitiza utakatifu katika Kiebrania.
- source_word: הֵיכָל
  choice: ukumbi mkuu
  rationale: Katika muktadha huu הֵיכָל ni chumba kikuu cha Hekalu, tofauti na Patakatifu pa Patakatifu. “Ukumbi mkuu” ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi ya kiufundi.
- source_word: זָהָב
  choice: ilikuwa ya dhahabu
  rationale: Nomino ya mwisho inataja kitu kilichotengeneza milango. Kitenzi kimeongezwa ili sentensi iwe ya kawaida katika Kiswahili bila kuongeza wazo la kupakwa dhahabu.
theological_decisions:
- issue: Jina la chumba cha ndani kabisa, קֹדֶשׁ הַקֳּדָשִׁים
  choice: Patakatifu pa Patakatifu
  alternative: Mahali Patakatifu Zaidi
  rationale: Muundo uliochaguliwa unahifadhi nahau ya Kiebrania ya kurudia neno ili kuonyesha kiwango cha juu kabisa, bila kuifafanua kiteolojia zaidi ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Orodha imewasilishwa kwa majina ya kawaida ya vyombo, huku maelezo mafupi yakitumiwa pale ambapo istilahi moja ingeweza kupotosha. Sentensi ya pili inahifadhi muundo wa orodha wa Kiebrania na kutotaja kama dhahabu ilikuwa yabisi au ilikuwa kifuniko.
