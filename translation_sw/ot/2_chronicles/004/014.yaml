  text: וְ/אֶת הַ/מְּכֹנ֖וֹת עָשָׂ֑ה וְ/אֶת הַ/כִּיֹּר֥וֹת עָשָׂ֖ה עַל הַ/מְּכֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/014.yaml
  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: sw
  text: Alitengeneza viti vya kuwekea mabeseni[a], na akatengeneza mabeseni juu ya viti hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “misingi” au “vibebeo”; neno la Kiebrania linamaanisha miundo iliyotegemeza mabeseni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: vikalio
  rationale: Katika muktadha wa vyombo vya hekalu, neno hili linamaanisha miundo iliyotengenezwa ili kutegemeza mabeseni. “Vikalio” linaeleza kazi yake kwa Kiswahili cha sasa bila kulifanya kuwa “mikokoteni,” jambo ambalo lingesisitiza uhamishikaji usiotajwa wazi hapa.
- source_word: עָשָׂה
  choice: alitengeneza / akatengeneza
  rationale: Kitenzi עשה hapa kina maana ya kawaida ya kutengeneza. Ubadilishaji wa umbo la kitenzi katika Kiswahili huunganisha kwa kawaida vifungu viwili vyenye mtendaji yuleyule.
- source_word: הַכִּיֹּרוֹת
  choice: mabeseni
  rationale: כִּיּוֹר humaanisha beseni la kuoshea. “Mabeseni” ni neno la kawaida na linaloeleweka, tofauti na istilahi ya kizamani au ya kitaalamu zaidi.
- source_word: עַל
  choice: juu ya
  rationale: Kirai hiki kinaonyesha kwamba mabeseni yaliwekwa juu ya vikalio.
- source_word: וְאֶת ... וְאֶת
  choice: '..., na ...'
  rationale: Viunganishi vimerudishwa kwa uratibu wa kawaida wa Kiswahili; alama ya moja kwa moja ya yambwa katika Kiebrania haihitaji kutafsiriwa kama neno tofauti.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Vikalio” limetumiwa kwa miundo ya kutegemeza mabeseni; “mabeseni” ni wazi zaidi kwa wasomaji wa kawaida. Kiwakilishi “hivyo” kinafafanua marejeo kwa vikalio vilivyotajwa bila kubadili maana.
