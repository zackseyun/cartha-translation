base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: sw
  text: nguzo mbili, na mabakuli mawili, na vichwa viwili vya nguzo vilivyo juu ya nguzo, na mapambo mawili ya kimiani ya kufunika yale mabakuli mawili ya vichwa vya nguzo yaliyokuwa juu ya nguzo;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדִים
  choice: nguzo
  rationale: Ni neno la kawaida na sahihi la usanifu kwa vitu viwili vilivyosimama mbele ya hekalu.
- source_word: גֻּלּוֹת
  choice: maumbo ya mviringo
  rationale: Neno la Kiebrania linaelekea kutaja sehemu zenye umbo la duara au bakuli, lakini umbo lake halisi la usanifu halijulikani; tafsiri hii huepuka kulibainisha kupita ushahidi.
- source_word: כֹּתָרוֹת
  choice: mataji
  rationale: Katika muktadha huu ni sehemu za juu za mapambo ya nguzo. “Mataji” ni Kiswahili cha kawaida kinachohifadhi pia taswira ya neno la Kiebrania.
- source_word: רֹאשׁ
  choice: juu
  rationale: Ingawa maana halisi ni “kichwa,” katika usanifu neno hili humaanisha sehemu ya juu.
- source_word: שְּׂבָכוֹת
  choice: mapambo ya kimiani
  rationale: Hutaja kazi ya mapambo iliyosokotwa au kuundwa kama wavu; “ya kimiani” ni ya kueleweka zaidi kuliko “mitandao” katika muktadha wa usanifu.
- source_word: לְכַסּוֹת
  choice: ya kufunika
  rationale: Huhifadhi kusudi linaloonyeshwa na kitenzi-jina cha Kiebrania kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אֲשֶׁר
  choice: yaliyokuwa
  rationale: Huanzisha kishazi rejeshi kinachohusisha mataji na mahali pake juu ya nguzo.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: mbili / mawili
  rationale: Idadi iliyorudiwa imehifadhiwa kulingana na ngeli za Kiswahili kwa sababu mstari unaorodhesha kila kifaa kwa makusudi.
