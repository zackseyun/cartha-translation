  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: sw
  text: Unene wake ulikuwa upana wa kiganja[a], na ukingo wake ulikuwa kama kazi ya ukingo wa kikombe, kama ua la yungiyungi. Uliweza kuchukua bathi[b] elfu tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Upana wa kiganja” ulikuwa kipimo cha kale.
    reason: cultural_note
  - marker: b
    text: Bathi ilikuwa kipimo cha kale cha Kiebrania cha majimaji. 1 Wafalme 7:26 inasema Bahari hii ilichukua bathi elfu mbili, ilhali hapa ni elfu tatu. Huenda tofauti hiyo inahusu ujazo wake wote dhidi ya kiasi cha kawaida kilichowekwa ndani yake, au tofauti katika mapokeo ya maandishi.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: unene wake
  rationale: Neno hili linaeleza unene wa ukuta wa Bahari ya shaba, si upana wake kwa ujumla.
- source_word: טֶפַח
  choice: upana wa kiganja
  rationale: Hiki ni kipimo kidogo cha kale kilicholingana takribani na upana wa kiganja; tafsiri hii ni wazi zaidi kwa msomaji wa Kiswahili kuliko kutoholewa kwa jina la kipimo.
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  choice: ukingo wake / ukingo wa kikombe
  rationale: Kwa chombo, שׂפה ni mdomo au ukingo; “ukingo” ni lugha ya kawaida na inadumisha urudiaji wa Kiebrania.
- source_word: כְּמַעֲשֵׂה
  choice: kama ulivyotengenezwa
  rationale: Kirai hiki kinahusu muundo au ufundi wa ukingo. Kauli hii huhifadhi wazo la namna ulivyoundwa bila kuongeza maelezo yasiyokuwamo.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: kama ua la yungiyungi
  rationale: Huhifadhi taswira ya ua lenye umbo la yungiyungi na uhusiano wake na ukingo wa kikombe.
- source_word: מַחֲזִיק ... יָכִיל
  choice: uliweza kuchukua
  rationale: Maneno yote mawili yanasisitiza uwezo wa chombo. Kiswahili hiki cha kawaida kinaeleza ujazo wake bila urudiaji mzito.
- source_word: בַּתִּים
  choice: bathi
  rationale: Hiki ni kipimo cha kale cha Kiebrania cha vitu vya majimaji; jina limetoholewa badala ya kubadilishwa kuwa kipimo cha kisasa kisicho hakika kabisa.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: elfu tatu
  rationale: Hii inatafsiri moja kwa moja idadi iliyo katika maandishi ya Kiebrania ya Mambo ya Nyakati.
theological_decisions:
- issue: Tofauti ya ujazo ikilinganishwa na 1 Wafalme 7:26
  choice: Kudumisha “bathi elfu tatu” katika maandishi na kueleza tofauti katika tanbihi
  alternative: Kuoanisha idadi na “bathi elfu mbili” ya 1 Wafalme 7:26
  rationale: WLC ya 2 Mambo ya Nyakati 4:5 inasema wazi elfu tatu. Kubadili idadi kungeficha tofauti halisi ya mapokeo ya maandishi; tanbihi inadumisha mvutano bila kuamua kwa uhakika chanzo chake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unaendeleza urudiaji wa “ukingo” katika Kiebrania, huku “uliweza kuchukua” ukitoa maana ya uwezo wa chombo kwa lugha ya kawaida.
