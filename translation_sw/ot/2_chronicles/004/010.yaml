translation:
  language: sw
  text: Akaiweka ile Bahari upande wa kusini-mashariki[a], ikielekea kusini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “upande wa kulia kuelekea mashariki, mkabala na kusini.” Kwa kawaida maelezo ya mahali katika Kiebrania humchukulia mtu kuwa anaelekea mashariki; kwa hiyo “upande wa kulia” ni kusini. Pamoja na “kuelekea mashariki,” usemi huo unaonyesha upande wa kusini-mashariki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: A-
  rationale: Kiunganishi וְ kinaunganisha taarifa hii na maelezo yaliyotangulia; alama ya yambwa אֵת haitafsiriwi kwa neno tofauti katika Kiswahili.
- source_word: הַיָּם
  choice: lile Bahari
  rationale: Ni birika kubwa la shaba la Hekalu lililoitwa kihalisi ‘Bahari.’ Kiashiria ‘lile’ huonyesha chombo maalumu kilichotajwa katika muktadha, na herufi kubwa huhifadhi hadhi yake kama jina la chombo hicho.
- source_word: נָתַן
  choice: akaliweka
  rationale: Kitenzi hiki hapa kina maana ya kukiweka chombo mahali fulani; umbo la yambwa ‘-li-’ linarejelea ‘Bahari.’
- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  choice: upande wa kusini-mashariki
  rationale: כָּתֵף ni ‘bega’ kihalisi lakini katika maelezo ya mahali humaanisha upande. Kwa mtazamo wa Kiebrania wa kuelekea mashariki, upande wa kulia ni kusini; pamoja na קֵדְמָה ‘kuelekea mashariki,’ usemi mzima unaonyesha upande wa kusini-mashariki.
- source_word: מִמּוּל נֶגְבָּה
  choice: likielekea kusini
  rationale: מִמּוּל huonyesha nafasi au mwelekeo unaokabiliana na kitu, na נֶגְבָּה ni ‘kusini/kuelekea kusini.’ ‘Likielekea kusini’ ni Kiswahili cha kawaida kinachohifadhi maana ya mwelekeo.
