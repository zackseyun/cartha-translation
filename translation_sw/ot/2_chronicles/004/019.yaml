base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: sw
  text: 'Sulemani akatengeneza vyombo vyote kwa ajili ya nyumba ya Mungu: madhabahu ya dhahabu, meza, na juu ya meza hizo mikate ya Uwepo[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa usemi wa jadi, “mikate ya wonyesho.” Kiebrania: “mkate wa uwepo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה humaanisha ‘kufanya’ au ‘kutengeneza’; katika orodha ya vifaa vya ibada, ‘akatengeneza’ ni ya asili na inaonyesha utengenezaji wa vitu hivyo.
- source_word: כָּל הַכֵּלִים
  choice: vyombo vyote
  rationale: כֵּלִים hapa ni vifaa au vyombo vya matumizi ya hekaluni. ‘Vyombo vyote’ ni lugha ya kawaida na yenye heshima katika muktadha huu.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii inafuata moja kwa moja nahau ya Kiebrania na bado inaeleweka kuwa ni hekalu.
- source_word: מִזְבַּח הַזָּהָב
  choice: madhabahu ya dhahabu
  rationale: Tafsiri hii inaonyesha wazi kuwa madhabahu hiyo ilikuwa ya dhahabu na ni ya kawaida katika Kiswahili cha Biblia.
- source_word: הַשֻּׁלְחָנוֹת
  choice: meza
  rationale: Nomino ya Kiebrania iko katika wingi; umbo ‘meza’ hutumika kwa umoja na wingi katika Kiswahili, huku muktadha ukionyesha wingi.
- source_word: וַעֲלֵיהֶם
  choice: iliyokuwa juu ya meza hizo
  rationale: Kurudia ‘meza hizo’ badala ya kutumia kiwakilishi kisicho wazi kunahifadhi uhusiano wa mahali na kufanya sentensi iwe ya asili katika Kiswahili.
- source_word: לֶחֶם הַפָּנִים
  choice: mikate ya Kuwapo
  rationale: Usemi huu wa kiibada ni ‘mkate wa Kuwapo’ kihalisi. Wingi ‘mikate’ ni wa asili katika Kiswahili kwa mikate iliyowekwa mezani, na ‘Kuwapo’ huhifadhi wazo la kuwa mbele za Mungu bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  alternative: hekalu la Mungu
  rationale: ‘Nyumba ya Mungu’ huhifadhi nahau ya Kiebrania bila kupoteza maana ya hekalu.
- issue: Tafsiri ya לֶחֶם הַפָּנִים
  choice: mikate ya Kuwapo
  alternative: mikate ya wonyesho
  rationale: Chaguo hili linafuata kwa karibu maana ya Kiebrania na kuhifadhi uzito wa kitheolojia wa mikate iliyowekwa mbele za Mungu, bila kuingiza ufafanuzi usiotajwa wazi.
- issue: Uhusiano wa vyombo na nyumba ya Mungu
  choice: kwa ajili ya nyumba ya Mungu
  alternative: katika nyumba ya Mungu
  rationale: Muundo mfupi wa Kiebrania unaweza kueleweka kwa uhusiano wa mali au matumizi; ‘kwa ajili ya’ unaonyesha kuwa vyombo vilikusudiwa kutumiwa katika nyumba ya Mungu, si kwamba vinaelezwa tu mahali vilipokuwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. ‘Akatengeneza’ inaendeleza usimulizi wa kihistoria; kurudiwa kwa ‘meza hizo’ kunaondoa utata wa kiwakilishi. Alama ya tanbihi [a] imewekwa baada ya usemi unaohusika.
