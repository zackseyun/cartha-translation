base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: sw
  text: 'Bahari ilisimama juu ya ng’ombe kumi na wawili: watatu wakielekea kaskazini[a], watatu wakielekea magharibi, watatu wakielekea kusini, na watatu wakielekea mashariki. Bahari ilikuwa juu yao, na sehemu zote za nyuma za ng’ombe hao zilielekea ndani[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “watatu wakielekea kaskazini ... watatu wakielekea baharini.” Hapa “magharibi” inatafsiri matumizi ya “baharini” kama neno la mwelekeo.
    reason: lexical_alternative
  - marker: b
    text: Au, “nyuma zao zote zilielekea ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: ilisimama
  rationale: Kirai cha Kiebrania kinaeleza mahali na hali ya Bahari; kitenzi hiki ni cha kawaida na kinadumisha picha ya kitu kilichowekwa juu ya vihimili.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: Neno linaweza kumaanisha ng’ombe kwa ujumla bila kulazimisha jinsia; hapa ni sanamu kumi na mbili za ng’ombe zilizotegemeza Bahari.
- source_word: פֹנִים
  choice: wakielekea
  rationale: Ingawa kimsingi huhusiana na ‘uso,’ katika muundo huu linaonyesha mwelekeo wa sanamu na hutafsiriwa kwa Kiswahili cha kawaida kama ‘wakielekea.’
- source_word: צָפוֹנָה
  choice: kaskazini
  rationale: Kiambishi cha mwelekeo kinaonyesha kuelekea upande wa kaskazini; baada ya ‘wakielekea,’ jina la upande linafaa kwa Kiswahili.
- source_word: יָמָּה
  choice: magharibi
  rationale: Kihalisi linahusiana na ‘bahari,’ lakini katika matumizi ya mwelekeo wa Kiebrania humaanisha magharibi; maana hiyo ndiyo inayoendana na orodha ya pande nne.
- source_word: נֶגְבָּה
  choice: kusini
  rationale: Katika orodha hii ya pande nne linaonyesha upande wa kusini, si lazima eneo maalumu la Negebu.
- source_word: מִזְרָחָה
  choice: mashariki
  rationale: Ni neno la kawaida la mwelekeo wa mashariki na linakamilisha orodha ya pande nne.
- source_word: הַיָּם
  choice: Bahari
  rationale: Hili ni jina la birika kubwa la Hekalu katika muktadha huu, si bahari ya kijiografia; herufi kubwa inalibainisha kama kitu maalumu.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: ilikuwa juu yao
  rationale: Huwasilisha wazi mahali pa Bahari kuhusiana na ng’ombe huku ikihifadhi msisitizo wa Kiebrania kwamba ilikuwa upande wa juu yao.
- source_word: אֲחֹרֵיהֶם
  choice: sehemu zao zote za nyuma
  rationale: Tafsiri hii inahifadhi maana ya sehemu za nyuma za sanamu bila kutumia usemi unaoweza kusikika usio na hadhi.
- source_word: בָּיְתָה
  choice: zilielekea ndani
  rationale: Umbo la mwelekeo lina maana ya kuelekea sehemu ya ndani, yaani kuelekea katikati chini ya Bahari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. ‘Bahari’ limetumiwa kama jina maalumu la birika kubwa la Hekalu. Muundo wa kurudia ‘watatu wakielekea’ umehifadhiwa ili kuonyesha mpangilio wa sanamu kwa uwazi.
