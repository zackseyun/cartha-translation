  text: the flowers[a], the lamps[b], and the tongs of gold—pure gold.
translation:
  language: sw
  text: maua[a], taa na makoleo[b], vyote vya dhahabu—dhahabu safi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapambo ya maua.” Kiebrania kina umbo la umoja linaloweza kutumiwa kwa maana ya pamoja.
    reason: lexical_alternative
  - marker: b
    text: Yaani, makoleo ya kushikia au kurekebisha tambi za taa; yanaweza pia kuitwa “makoleo ya tambi.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kwa tafsiri ya neno kwa neno ni, “dhahabu—ilikuwa ukamilifu wa dhahabu,” kirai ambacho huenda kinamaanisha dhahabu iliyosafishwa kabisa au iliyokamilishwa kwa ustadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַפֶּרַח
  choice: maua
  rationale: פֶּרַח humaanisha ua au chipukizi; hapa yaelekea ni jina la pamoja la mapambo yenye umbo la maua kwenye vinara. Wingi wa Kiswahili unasikika kwa kawaida katika orodha hii.
- source_word: וְהַנֵּרוֹת
  choice: taa
  rationale: נֵרוֹת ni neno la kawaida kwa taa; maana hii inafaa katika muktadha wa vifaa vya Hekalu.
- source_word: וְהַמֶּלְקַחַיִם
  choice: makoleo
  rationale: מֶלְקַחַיִם ni kifaa cha kushikia utambi au makaa. “Makoleo” ni neno pana na linaloeleweka, huku matumizi mahususi yakihifadhiwa katika tanbihi.
- source_word: זָהָב
  choice: vya dhahabu
  rationale: Dhahabu ndiyo nyenzo ya vitu vilivyoorodheshwa. “Vyote vya dhahabu” huondoa utata wa kisarufi wa Kiswahili kwamba dhahabu ingehusishwa na makoleo pekee.
- source_word: הוּא מִכְלוֹת זָהָב
  choice: —dhahabu safi
  rationale: Kirai hiki kigumu kinasisitiza dhahabu iliyokamilishwa au iliyosafishwa kikamilifu. “Dhahabu safi” ni Kiswahili cha kawaida bila kuingiza ngazi ya ulinganisho isiyopo wazi katika Kiebrania; maana halisi imeelezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha umehifadhiwa, na “vyote” umetumiwa kuonyesha kwa uwazi kuwa vitu vyote vilivyotajwa ni vya dhahabu. Utata wa mapambo, matumizi ya makoleo, na kirai kisicho cha kawaida kuhusu ubora wa dhahabu umehifadhiwa katika tanbihi.
