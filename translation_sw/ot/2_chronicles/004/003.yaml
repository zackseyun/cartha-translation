base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: sw
  text: Chini yake kulikuwa na maumbo ya ng’ombe kuizunguka pande zote[a], kumi kwa kila dhiraa[b], yakiizunguka Bahari pande zote. Maumbo hayo ya ng’ombe yalikuwa katika safu mbili, yakitengenezwa kwa kumimina metali pamoja nayo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifano ya ng’ombe”; Kiebrania kinaonyesha mapambo yenye sura ya ng’ombe, wala si wanyama walio hai.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kumi kwa dhiraa,” yaelekea kumaanisha maumbo kumi kwa kila dhiraa kuzunguka ukingo wa Bahari.
    reason: cultural_note
  - marker: c
    text: Kwa maana ya neno kwa neno, “yaliyomiminwa katika kumiminwa kwake,” yaani, yalitengenezwa pamoja na Bahari katika kazi ileile ya kumimina metali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: maumbo ya ng’ombe
  rationale: דְּמוּת humaanisha umbo, mfano, au kitu kinachowakilisha kingine; hapa ni mapambo yenye sura ya ng’ombe, si wanyama walio hai.
- source_word: תַּחַת לוֹ
  choice: chini yake
  rationale: Hutoa wazi uhusiano wa mahali kati ya maumbo na Bahari.
- source_word: סָבִיב סָבִיב
  choice: pande zote
  rationale: Urudiaji wa Kiebrania unasisitiza kwamba maumbo yalizunguka chombo chote; Kiswahili cha kawaida huwasilisha msisitizo huo kwa ‘pande zote.’
- source_word: עֶשֶׂר בָּאַמָּה
  choice: kumi kwa kila dhiraa
  rationale: Hudumisha idadi na kipimo cha maandishi huku ikionyesha kwa Kiswahili cha kawaida uwiano unaokusudiwa.
- source_word: הַיָּם
  choice: Bahari
  rationale: Hili ni jina la beseni kubwa la Hekalu, si bahari ya kawaida; herufi kubwa inaonyesha matumizi hayo maalumu.
- source_word: שְׁנַיִם טוּרִים
  choice: katika safu mbili
  rationale: טוּרִים ni mistari au safu; tafsiri hii inaeleza mpangilio wa mapambo kwa uwazi.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: yakamiminwa kuwa kitu kimoja pamoja nayo
  rationale: Katika muktadha wa ufundi wa metali, יצק ni kumimina metali iliyoyeyushwa katika umbo. Kauli hii inaonyesha kwamba mapambo na Bahari yalitengenezwa katika kazi ileile ya kumimina, si kuunganishwa baadaye.
