base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: sw
  text: na yale makomamanga mia nne kwa ajili ya mapambo mawili ya kimiani[a], safu mbili za makomamanga kwa kila pambo la kimiani, ili kufunika mataji mawili yenye umbo la bakuli[b] yaliyokuwa juu ya nguzo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapambo ya wavu.” Neno la Kiebrania linarejelea mapambo ya kimiani au ya wavu kwenye mataji ya nguzo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mabakuli mawili ya mataji.” Neno la Kiebrania linatumia taswira ya bakuli kuelezea sehemu za mataji zenye umbo la mviringo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: makomamanga
  rationale: Neno hilo humaanisha makomamanga; hapa ni mapambo yenye umbo la tunda hilo, lakini maana yake ya msingi imehifadhiwa.
- source_word: אַרְבַּע מֵאוֹת
  choice: mia nne
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya idadi iliyotajwa.
- source_word: שְּׂבָכוֹת
  choice: kazi za kimiani
  rationale: Neno hilo linarejelea mapambo yaliyotengenezwa kwa muundo wa wavu au kimiani; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: שְׁנַיִם טוּרִים
  choice: safu mbili
  rationale: טוּרִים hurejelea mistari au safu za vitu vilivyopangwa.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: kwa kila kazi ya kimiani
  rationale: Ingawa Kiebrania kinasema kihalisi ‘kwa kazi moja ya kimiani,’ maana katika muktadha ni ya kugawa safu mbili kwa kila mojawapo ya kazi hizo.
- source_word: לְכַסּוֹת
  choice: ili kufunika
  rationale: Kitenzi-jina kinaonyesha kusudi, ambalo limetolewa wazi kwa ‘ili kufunika.’
- source_word: גֻּלּוֹת
  choice: maumbo kama bakuli
  rationale: Neno linatumia taswira ya mabakuli au sehemu za mviringo; tafsiri hii huhifadhi taswira hiyo bila kuifanya kuwa sifa isiyoeleweka.
- source_word: כֹּתָרוֹת
  choice: mataji
  rationale: Katika usanifu, neno hili hurejelea sehemu za juu zenye mapambo kwenye nguzo; ‘mataji’ ni neno la Kiswahili linaloeleweka katika muktadha huu.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: juu ya nguzo
  rationale: Katika muktadha wa mataji ya nguzo, usemi huu unaonyesha mahali pake juu ya nguzo.
