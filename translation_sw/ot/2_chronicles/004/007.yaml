base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: sw
  text: 'Akatengeneza vinara kumi vya taa vya dhahabu kulingana na utaratibu uliowekwa[a], akaviweka ndani ya jengo la Hekalu[c]: vitano upande wa kulia na vitano upande wa kushoto[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na utaratibu uliowekwa” au “kulingana na muundo uliowekwa.” Neno la Kiebrania linaweza kumaanisha kanuni, utaratibu, au muundo uliowekwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “vitano upande wa kulia na vitano upande wa kushoto.” Kulingana na mwelekeo wa Hekalu, huenda pande hizi zikalingana na upande wa kusini na wa kaskazini.'
    reason: cultural_note
  - marker: c
    text: Au, “katika ukumbi mkuu” au “katika patakatifu.” Neno la Kiebrania linarejelea jengo lenyewe la Hekalu, si eneo lote la Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Kitenzi עשה katika mtiririko wa masimulizi humaanisha ‘kutengeneza/kufanya’; ‘akatengeneza’ kinafaa kwa utengenezaji wa vifaa vya Hekalu.
- source_word: מְנֹרוֹת הַזָּהָב עֶשֶׂר
  choice: vinara kumi vya taa vya dhahabu
  rationale: מְנוֹרָה ni kinara cha kubebea taa, si taa peke yake; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: כְּמִשְׁפָּטָם
  choice: kulingana na mpango uliowekwa kwa ajili yake
  rationale: מִשְׁפָּט hapa inaweza kumaanisha kanuni, utaratibu, au muundo uliowekwa. Tafsiri hii inadokeza kiwango kilichoagizwa bila kuifanya istilahi iwe ya kisheria tu.
- source_word: וַיִּתֵּן
  choice: akaviweka
  rationale: נתן katika muktadha huu ni kuweka vitu mahali fulani; kiambishi ‘vi’ kinarejelea vinara.
- source_word: בַּהֵיכָל
  choice: ndani ya jengo la Hekalu
  rationale: הֵיכָל hapa hurejelea jengo lenyewe la Hekalu, hasa ukumbi mkuu, wala si eneo lote la Hekalu.
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: vitano upande wa kulia na vitano upande wa kushoto
  rationale: Tafsiri inahifadhi maelekezo halisi ya Kiebrania, ‘kulia’ na ‘kushoto,’ badala ya kuyafasiri moja kwa moja kuwa kusini na kaskazini.
