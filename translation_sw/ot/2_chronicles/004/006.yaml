base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: sw
  text: Akatengeneza mabeseni kumi, akaweka matano upande wa kulia na matano upande wa kushoto[a], ili kuoshea humo; humo walikuwa wakisuuza vitu vilivyotumiwa kwa ajili ya sadaka ya kuteketezwa[b]. Lakini ile Bahari[c] ilikuwa kwa ajili ya makuhani kujinawa humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande wa kusini” na “upande wa kaskazini,” kulingana na mwelekeo wa hekalu.
    reason: cultural_note
  - marker: b
    text: Kiebrania kwa halisi, “kazi ya sadaka ya kuteketezwa”; huenda msemo huo unarejelea vitu au vifaa vilivyohusika katika kuandaa sadaka hiyo.
    reason: lexical_alternative
  - marker: c
    text: “Bahari” ni jina la birika kubwa la shaba lililotumiwa na makuhani kujinawa.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: mabeseni
  rationale: Neno hili linamaanisha vyombo vikubwa vya kuoshea vilivyotumiwa katika huduma ya hekalu. “Mabeseni” ni Kiswahili cha sasa na kinachoeleweka kwa urahisi.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: upande wa kulia / upande wa kushoto
  rationale: Maneno haya yanaonyesha mahali yalipowekwa; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: לְרָחְצָה
  choice: ili kuoshea ndani yake
  rationale: Infinitivu inaonyesha kusudi. Kitenzi “kuoshea” hapa kinahusu kuosha vitu katika mabeseni hayo.
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: vitu vilivyotumiwa kwa ajili ya sadaka ya kuteketezwa
  rationale: Kiebrania, kwa halisi, ni “kazi ya sadaka ya kuteketezwa,” msemo wenye maana iliyodokezwa. Katika muktadha huu unaelekea kurejelea vitu au vifaa vya kuandalia sadaka hiyo.
- source_word: יָדִיחוּ
  choice: walikuwa wakisuuza
  rationale: Hifili ya kitenzi hiki ina maana ya kusuuza au kuosha uchafu. Kauli ya wakati usiotimilifu inaeleweka hapa kama tendo la kawaida lililofanywa mara kwa mara.
- source_word: וְהַיָּם
  choice: ile Bahari
  rationale: Hili ni jina maalumu la birika kubwa la shaba. “Bahari” huhifadhi taswira na jina la Kiebrania; herufi kubwa inaonyesha kuwa ni jina la chombo hicho.
- source_word: לַכֹּהֲנִים
  choice: kwa ajili ya makuhani
  rationale: Hii inaonyesha kusudi au matumizi; tafsiri hii ni wazi na ya asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Sadaka ya kuteketezwa” ni istilahi ya kawaida ya kibiblia; “walikuwa wakisuuza” huhifadhi maana ya tendo la kawaida. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
