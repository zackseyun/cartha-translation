  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: sw
  text: Huramu-Abi[a] alimtengenezea Mfalme Sulemani masufuria, koleo za kuondolea majivu, uma, na vifaa vyao vyote kwa ajili ya nyumba ya Yahwe, vyote vikiwa vya shaba iliyong’arishwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Huramu-Abi”; pia yaweza kutafsiriwa “Huramu, baba yake.” Hapa inaelekea kuwa jina au cheo cha fundi.'
    reason: alternative_reading
  - marker: b
    text: Au “shaba iliyosuguliwa mpaka ikang’aa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: masufuria
  rationale: Neno סִירוֹת humaanisha vyombo kama sufuria; “masufuria” ni neno la kawaida na linalofaa katika orodha hii ya vifaa vya hekalu.
- source_word: הַיָּעִים
  choice: sepetu
  rationale: יָעִים ni vifaa vya kuondolea majivu au makaa; “sepetu” linaeleza kazi hiyo kwa Kiswahili cha kawaida.
- source_word: הַמִּזְלָגוֹת
  choice: uma
  rationale: מִזְלָגוֹת ni vifaa vyenye meno au ncha kama uma. “Uma” ni tafsiri wazi bila kubainisha isivyo lazima kwamba vilitumiwa kwa nyama pekee.
- source_word: כָּל כְּלֵיהֶם
  choice: vifaa vyote vilivyohusiana navyo
  rationale: כְּלִי ni neno pana kwa chombo au kifaa. Kauli hii inaonyesha vifaa vingine vya kazi vinavyohusiana na vitu vilivyotajwa, huku ikiepuka Kiswahili kisicho cha kawaida cha “vifaa vyao vyote.”
- source_word: חוּרָם אָבִיו
  choice: Huramu-Abi
  rationale: Katika muktadha huu muundo huo unaeleweka vizuri kama jina au cheo cha fundi. Umbo la “Huramu” linafuata matamshi ya Kiebrania na kuingizwa kwa urahisi katika Kiswahili.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: alimtengenezea Mfalme Sulemani
  rationale: Kihusishi לְ kinaonyesha kwamba vitu hivyo vilitengenezwa kwa ajili ya Sulemani au kwa agizo lake; muundo huu ni wa asili katika Kiswahili.
- source_word: לְבֵית יְהוָה
  choice: kwa ajili ya nyumba ya Yahwe
  rationale: “Nyumba ya Yahwe” huhifadhi picha halisi ya בֵּית יְהוָה, huku “kwa ajili ya” ikiwakilisha uhusiano unaoonyeshwa na לְ.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetolewa kama jina binafsi “Yahwe,” kwa tahajia inayotumika kwa kawaida katika Kiswahili.
- source_word: נְחֹשֶׁת מָרוּק
  choice: shaba iliyong’arishwa
  rationale: Katika muktadha wa vifaa vya hekalu נְחֹשֶׁת ni metali ya shaba, na מָרוּק huonyesha kwamba ilikuwa imeng’arishwa au kusuguliwa mpaka ikang’aa.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu יְהוָה. Kulitafsiri “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חוּרָם אָבִיו
  choice: Huramu-Abi kama jina au cheo
  alternative: Huramu, baba yake
  rationale: Muktadha unamtaja fundi kwa jina au cheo chake. Hata hivyo, muundo wa Kiebrania unaweza kusomwa kihalisi “Huramu, baba yake,” hivyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi ya mwisho imewekwa kando ili kuonyesha kwa uwazi kwamba shaba iliyong’arishwa inahusu vifaa vyote vilivyoorodheshwa.
