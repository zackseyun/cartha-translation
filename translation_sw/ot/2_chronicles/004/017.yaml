  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: sw
  text: Katika tambarare ya Yordani, mfalme alivimimina katika udongo wa mfinyanzi, kati ya Sukothi na Seredatha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu sambamba katika 1 Wafalme 7:46 kinataja mahali hapa kuwa “Sarethani.” Hapa Mambo ya Nyakati panasomeka “Seredatha,” ambalo huenda ni umbo jingine la jina la mahali pale pale.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: katika tambarare ya Yordani
  rationale: כִּכָּר hapa linaonyesha eneo tambarare la kandokando ya Yordani. ‘Tambarare’ ni Kiswahili cha kawaida na kinadumisha maana ya kijiografia bila kuifafanua kupita kiasi.
- source_word: יְצָקָם
  choice: alivimimina
  rationale: יצק katika muktadha wa vyombo vya shaba humaanisha kumimina metali iliyoyeyushwa ili kuitengeneza kwa kalibu. Kiambishi ‘-vi-’ kinarejelea vitu vingi vilivyotajwa katika muktadha.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainishaji humrejelea Sulemani katika muktadha; ‘mfalme’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: katika udongo wa mfinyanzi
  rationale: עֲבִי kwa msingi humaanisha unene au uzito; ikiunganishwa na אֲדָמָה hapa inaelekea kutaja udongo mzito wa mfinyanzi uliotumika katika kazi ya kumimina metali. Uamuzi huu unatoa maana ya kimuktadha kwa Kiswahili cha asili.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: kati ya Sukothi na Sereda
  rationale: Majina ya mahali yametoholewa kwa tahajia inayoeleweka katika Kiswahili. ‘Sereda’ linafuata umbo la maandishi ya Mambo ya Nyakati, צְרֵדָתָה, badala ya kulisawazisha kimya kimya na umbo la kifungu sambamba katika 1 Wafalme.
