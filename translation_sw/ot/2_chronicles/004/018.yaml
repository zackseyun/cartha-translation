  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה כָּל הַ/כֵּלִ֥ים הָ/אֵ֖לֶּה לָ/רֹ֣ב מְאֹ֑ד כִּ֛י לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: sw
  text: Sulemani akatengeneza vyombo hivi vyote kwa wingi sana, kwa maana uzito wa shaba haukuweza kubainishwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uzito wa shaba haukuhakikishwa.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuchunguzwa” au “kubainishwa”; maana hapa ni kwamba shaba ilikuwa nyingi sana hivi kwamba uzito wake haukuhesabiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akatengeneza
  rationale: Kitenzi עשה hapa kina maana ya kutengeneza vitu vya Hekalu; “akatengeneza” ni Kiswahili cha kawaida na chenye heshima.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: vyombo hivi vyote
  rationale: כֵּלִים ni neno pana kwa vyombo au vifaa; “vyombo” linafaa kwa vitu vya chuma vilivyoorodheshwa katika muktadha huu wa Hekalu.
- source_word: לָרֹב מְאֹד
  choice: kwa wingi sana
  rationale: Kirai hiki kinaonyesha kiasi kikubwa mno; “kwa wingi sana” kinahifadhi msisitizo wa מְאֹד kwa Kiswahili cha asili.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי linaanzisha maelezo ya kauli iliyotangulia; “kwa maana” linaonyesha uhusiano huo bila kufanya sentensi kuwa nzito.
- source_word: לֹא נֶחְקַר
  choice: haukuweza kubainishwa
  rationale: Nifali ya חקר inaweza kumaanisha kutafutwa, kuchunguzwa au kubainishwa. Katika muktadha wa uzito, “haukuweza kubainishwa” huwasilisha kwamba uzito haukuhesabiwa au kuthibitishwa kwa sababu ya wingi.
- source_word: מִשְׁקַל
  choice: uzito
  rationale: מִשְׁקַל linarejelea uzito mahsusi, hivyo tafsiri ya moja kwa moja “uzito” inahifadhi wazo la kipimo.
- source_word: הַנְּחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת katika maelezo ya vifaa vya Hekalu kwa kawaida hurejelea bronzi; “shaba” ndilo neno la kawaida la Kibiblia na la Kiswahili kwa metali hii katika muktadha huu.
