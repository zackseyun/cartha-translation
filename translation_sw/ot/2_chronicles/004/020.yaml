  text: vinara vya taa na taa zake, ili ziwake kama ilivyoagizwa mbele ya patakatifu pa ndani[a], vya dhahabu safi[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya Mahali Patakatifu Zaidi.” Neno la Kiebrania דְּבִיר linamaanisha patakatifu pa ndani ya Hekalu.
