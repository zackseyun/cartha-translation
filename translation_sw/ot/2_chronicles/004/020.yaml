lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: vinara vya taa
  rationale: Neno מְנוֹרָה humaanisha kinara cha kushikilia taa; “vinara vya taa” ni Kiswahili cha kawaida na kinachofaa katika muktadha wa vyombo vya Hekalu.
- source_word: וְנֵרֹתֵיהֶם
  choice: pamoja na taa zake
  rationale: נֵר hapa ni taa inayowekwa kwenye kinara. Kiwakilishi cha umilikaji kinahifadhi uhusiano wake na vinara vilivyotajwa.
- source_word: לְבַעֲרָם
  choice: ili ziwake
  rationale: Kauli hii inaonyesha kusudi la kufanya taa ziendelee kuwaka; “ili ziwake” ni ya asili kwa Kiswahili bila kufafanua kupita kiasi namna zilivyowashwa.
- source_word: כַּמִּשְׁפָּט
  choice: kama ilivyoagizwa
  rationale: מִשְׁפָּט katika muktadha huu ni utaratibu uliowekwa kwa ibada. Tafsiri hii inaeleza wazi kwamba kuwaka kwa taa kulifuata agizo lililowekwa.
- source_word: לִפְנֵי הַדְּבִיר
  choice: mbele ya patakatifu pa ndani
  rationale: דְּבִיר ni chumba cha ndani kabisa cha Hekalu. “Patakatifu pa ndani” ni sahihi, cha heshima, na hakilazimishi istilahi ya kimapokeo katika matini kuu.
- source_word: זָהָב סָגוּר
  choice: vyote vya dhahabu safi
  rationale: Kirai hiki huelezea dhahabu yenye ubora wa juu iliyosafishwa. “Dhahabu safi” ni usemi wa kawaida wa Kiswahili; “vyote” huunganisha maelezo hayo na vinara na taa zake.
- source_word: וְאֶת
  choice: —
  rationale: Kiunganishi pamoja na kiashiria cha yambwa kinaendeleza orodha ya mstari uliotangulia; hakihitaji kutafsiriwa kimitambo mwanzoni mwa kipande hiki.
theological_decisions:
- issue: Maana ya הַדְּבִיר
  choice: patakatifu pa ndani
  alternative: Mahali Patakatifu Zaidi
  rationale: Neno la Kiebrania linataja sehemu ya ndani ya Hekalu. Tafsiri kuu inadumisha maana ya kimuundo bila kuifungamanisha moja kwa moja na istilahi maalumu ya kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mstari umehifadhiwa kama sehemu ya orodha inayoendelea kutoka mstari uliotangulia, ndiyo sababu unaanza kwa herufi ndogo na kuishia kwa nuktamkato.
