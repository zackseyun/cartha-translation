base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: sw
  text: Akatengeneza Bahari ya metali iliyotupwa[a], yenye dhiraa kumi kutoka ukingo wake mmoja hadi mwingine, ya mviringo pande zote; kimo chake kilikuwa dhiraa tano, na kamba ya dhiraa thelathini iliizunguka pande zote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bahari iliyotupwa.” Kiebrania kinatumia “Bahari” kama jina la birika kubwa miongoni mwa vifaa vya Hekalu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kamba ya dhiraa thelathini.” Maandishi haya yanaeleza mzingo wa birika kwa namna ya kawaida ya kale.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: Bahari
  rationale: Neno la Kiebrania kwa maana ya kawaida ni ‘bahari,’ lakini hapa ni jina la birika kubwa katika vifaa vya Hekalu. Herufi kubwa inaonyesha kuwa ni jina la kifaa hicho.
- source_word: מוּצָק
  choice: ya metali iliyoyeyushwa na kumiminwa kwenye kalibu
  rationale: Kivumishi hiki kinaonyesha kitu cha metali kilichotengenezwa kwa kuyeyushwa na kumiminwa katika kalibu. Tafsiri hii ni wazi kwa msomaji wa kawaida kuliko ‘iliyoyeyushwa’ pekee.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dhiraa kumi
  rationale: Imehifadhi kipimo cha kale badala ya kukibadili kuwa kipimo cha kisasa.
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: kutoka ukingo mmoja hadi mwingine
  rationale: שָׂפָה ni ‘mdomo’ au ‘ukingo’; kwa birika kubwa, ‘ukingo’ ni Kiswahili cha kawaida na sahihi.
- source_word: עָגוֹל סָבִיב
  choice: ilikuwa ya mviringo
  rationale: Huwasilisha umbo la duara linaloelezwa na Kiebrania bila marudio yasiyo ya kawaida katika Kiswahili.
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: kimo chake dhiraa tano
  rationale: Muundo mfupi na wa kawaida wa Kiswahili huhifadhi taarifa kamili ya kipimo cha kimo.
- source_word: וְקָו
  choice: na kamba yenye urefu
  rationale: קַו hapa ni kamba au mstari wa kupimia. ‘Kamba’ huhifadhi picha halisi ya chombo cha kupimia, huku ‘yenye urefu’ ikifanya dhiraa thelathini zieleweke kwa kawaida.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: iliizunguka pande zote
  rationale: Huhifadhi maana ya kuzunguka kitu kikamilifu na kupatana na picha ya kamba ya kupimia.
