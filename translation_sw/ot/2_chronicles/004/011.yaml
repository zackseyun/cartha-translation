base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: sw
  text: 'Huramu[a] akatengeneza sufuria, majembe na mabakuli. Hivyo Huramu akaimaliza kazi aliyomfanyia Mfalme Sulemani katika nyumba ya Mungu:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia linaandikwa “Hiramu” katika sehemu zinazohusiana; hata katika Kiebrania cha mstari huu tahajia zote mbili zinatokea.
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: Huramu
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa Kiswahili. Maandishi ya Kiebrania katika mstari huu yana tahajia mbili zinazoweza kuwakilishwa kama Huramu na Hiramu; umbo la kwanza limetumiwa katika matini kuu.
- source_word: הַסִּירוֹת
  choice: masufuria
  rationale: Neno hili hutaja vyombo kama sufuria. “Masufuria” ni neno la kawaida na linaloeleweka bila kubainisha matumizi ambayo matini haijayataja.
- source_word: הַיָּעִים
  choice: masepetu
  rationale: Ni vifaa vya kuchotea au kuondolea majivu na vitu vingine madhabahuni. “Masepetu” linaonyesha kwa uwazi aina ya kifaa kinachokusudiwa.
- source_word: הַמִּזְרָקוֹת
  choice: mabakuli
  rationale: Neno hilo hutaja bakuli za ibada. “Mabakuli” ni la kawaida na huepuka kuongeza matumizi maalumu yasiyoelezwa moja kwa moja hapa.
- source_word: וַיְכַל
  choice: akaimaliza
  rationale: Kitenzi kina maana ya kukamilisha au kumaliza; “akaimaliza” kinaendeleza mtiririko wa simulizi na kurejelea kazi iliyotajwa.
- source_word: אֲשֶׁר עָשָׂה לַמֶּלֶךְ שְׁלֹמֹה
  choice: aliyomfanyia Mfalme Sulemani
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi maana ya kazi iliyofanywa kwa ajili ya mfalme bila kurudia “kutengeneza” kwa namna nzito.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: katika nyumba ya Mungu
  rationale: Inahifadhi kwa uwazi kihusishi na kirai halisi “nyumba ya Mungu,” badala ya kukibadili moja kwa moja kuwa “hekalu la Mungu.”
