  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa orodha umehifadhiwa, na ‘upande wa kulia/kushoto’ umetumiwa badala ya kutafsiri kwa mielekeo ya dira.
