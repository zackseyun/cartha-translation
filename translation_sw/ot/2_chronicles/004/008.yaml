base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: sw
  text: Akatengeneza meza kumi na kuziweka hekaluni, tano upande wa kulia na tano upande wa kushoto. Pia akatengeneza mabakuli mia moja ya dhahabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “beseni za dhahabu” au “mabakuli ya dhahabu ya kunyunyizia”; neno la Kiebrania linamaanisha vyombo vya ibada vilivyotumiwa katika huduma ya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: meza
  rationale: Nomino hii kwa kawaida humaanisha meza; katika muktadha wa vyombo vya hekalu, tafsiri hii ni wazi bila kuongeza kazi ambayo haijatajwa.
- source_word: וַיַּנַּח
  choice: kuziweka
  rationale: Kitenzi kinaeleza kuweka vitu mahali fulani. Kiambishi ‘-zi-’ kinarejelea meza na kufanya sentensi iwe ya asili katika Kiswahili.
- source_word: בַּהֵיכָל
  choice: hekaluni
  rationale: Katika muktadha huu wa ibada, הֵיכָל ni jengo la hekalu, si jumba la kifalme. ‘Hekaluni’ ni sahihi na fasaha.
- source_word: מִיָּמִין
  choice: upande wa kulia
  rationale: Huhifadhi maelezo ya moja kwa moja ya nafasi bila kuyageuza kuwa mwelekeo wa kusini ambao haujatajwa wazi katika maandishi.
- source_word: מִשְּׂמֹאול
  choice: upande wa kushoto
  rationale: Hutoa ulinganifu wa asili na ‘upande wa kulia’ na huepuka kuingiza mwelekeo wa kaskazini usiotajwa wazi.
- source_word: מִזְרְקֵי זָהָב
  choice: mabakuli ... ya dhahabu
  rationale: מִזְרָק ni bakuli au beseni lililotumiwa katika huduma za ibada, mara nyingi kuhusiana na damu. ‘Mabakuli ya dhahabu’ ni tafsiri inayoeleweka, huku maana mahsusi ya kiibada ikielezwa katika tanbihi.
- source_word: מֵאָה
  choice: mia moja
  rationale: Hii ndiyo namna ya kawaida na sahihi ya kutaja idadi hiyo katika Kiswahili.
theological_decisions: []
