  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: sw
  text: Akafanya ua wa makuhani na ua mkubwa, na pia milango ya ua huo[a]; akazifunika milango yake[b] kwa shaba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania kwa kawaida humaanisha “milango”; katika muktadha wa ua, linaweza pia kutafsiriwa “malango.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “milango yao.” Hapa “yake” inarejelea ua huo kwa ujumla.'
    reason: grammatical_ambiguity
  - marker: c
    text: Neno la Kiebrania linaweza kumaanisha shaba au bronzi; katika vyombo na majengo ya hekalu mara nyingi hueleweka kuwa bronzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutengeneza. Katika muktadha huu wa ujenzi, “akafanya” ni cha kawaida, kifupi, na hakiongezi namna maalumu ya ujenzi ambayo Kiebrania hakutaji.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: ua wa makuhani
  rationale: חָצֵר ni ua au eneo la wazi lililozungushiwa. “Ua wa makuhani” linaonyesha wazi uhusiano wa maneno hayo na linafaa kwa usanifu wa hekalu.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: na ua mkubwa
  rationale: עֲזָרָה hapa ni ua au eneo lililozungushiwa katika hekalu. “Ua mkubwa” ni Kiswahili cha kawaida na kinahifadhi moja kwa moja kivumishi גְּדוֹלָה.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: na pia milango ya ua huo
  rationale: דֶּלֶת kwa kawaida ni mlango, ingawa katika ua inaweza kueleweka kama lango. “Milango” ni ya kawaida katika Kiswahili na inaweza kufaa kwa milango ya eneo lililozungushiwa bila kulazimisha tofauti isiyo wazi katika chanzo.
- source_word: וְדַלְתוֹתֵיהֶם
  choice: milango yake
  rationale: Kiebrania kina kiambishi cha nafsi ya tatu wingi, kihalisi “milango yao.” Kiswahili cha kawaida hutumia “yake” kwa kurejelea ua huo kwa ujumla; umbo halisi la Kiebrania limeonyeshwa katika tanbihi.
- source_word: צִפָּה
  choice: akaifunika
  rationale: צפה katika ujenzi ni kufunika uso wa kitu kwa tabaka la metali. “Akaifunika” ni wazi kwa wasomaji wa kawaida; metali inayotajwa inaonyesha kuwa maana ni kuipaka au kuifunika kwa tabaka la metali.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת linaweza kutaja shaba nyekundu au aloi yake, hasa bronzi. “Shaba” ni neno la kawaida la kibiblia katika Kiswahili na linaacha upana wa istilahi ya Kiebrania, huku tanbihi ikieleza uwezekano wa bronzi.
