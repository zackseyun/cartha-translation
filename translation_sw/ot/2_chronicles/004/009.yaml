translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mfuatano wa kazi za ujenzi wa Kiebrania, huku “na pia” ikisaidia mtiririko wa kawaida. “Ua” na “milango” ni maneno yanayoeleweka kwa urahisi bila kutumia istilahi nzito za kiusanifu.
