  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: sw
  text: Yehu akamtafuta Ahazia, nao wakamkamata alipokuwa akijificha huko Samaria. Wakamleta kwa Yehu, wakamuua,[a] kisha wakamzika, kwa maana walisema, “Yeye ni mwana wa Yehoshafati, ambaye alimtafuta Yahwe kwa moyo wake wote.” Ukoo wa Ahazia haukuwa na uwezo wa kushikilia ufalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “wakasababisha afe.” Kitenzi cha Kiebrania kiko katika umbo la kisababishi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Ukoo wa Ahazia haukuwa na nguvu za kushikilia ufalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: Yehu akamtafuta
  rationale: Kitenzi בקש kina maana ya kutafuta. Ingawa Kiebrania kinasema tu “akamtafuta,” muktadha unamtambulisha Yehu kuwa mhusika; kutaja jina lake huondoa utata usio wa maana katika Kiswahili.
- source_word: וַיִּלְכְּדֻהוּ
  choice: nao wakamkamata
  rationale: Umbo la wingi limehifadhiwa, likirejelea watu wa Yehu waliomkamata Ahazia.
- source_word: מִתְחַבֵּא
  choice: alipokuwa amejificha
  rationale: Huwasilisha hali inayoendelea ya Ahazia kujificha wakati alipokamatwa.
- source_word: בְשֹׁמְרוֹן
  choice: huko Samaria
  rationale: ב inaonyesha mahali; “huko Samaria” ni usemi wa kawaida wa Kiswahili katika simulizi.
- source_word: וַיְבִאֻהוּ אֶל יֵהוּא
  choice: Wakamleta kwa Yehu
  rationale: Hifili ya בוא humaanisha kumleta mtu kwa mwingine.
- source_word: וַיְמִתֻהוּ
  choice: wakamuua
  rationale: Hifili ya מות ni kusababisha afe. “Wakamuua” ni Kiswahili cha kawaida na cha moja kwa moja; tanbihi inaonyesha maana ya karibu zaidi ya kisababishi.
- source_word: וַיִּקְבְּרֻהוּ
  choice: wakamzika
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya קבר katika simulizi.
- source_word: כִּי אָמְרוּ
  choice: kwa maana walisema
  rationale: כִּי hapa inaanzisha sababu iliyowafanya wamzike.
- source_word: בֶּן יְהוֹשָׁפָט הוּא
  choice: Yeye ni mwana wa Yehoshafati
  rationale: Hudumisha usemi wa moja kwa moja na msisitizo wa uhusiano wake na Yehoshafati.
- source_word: אֲשֶׁר דָּרַשׁ אֶת יְהוָה
  choice: ambaye alimtafuta Yahwe
  rationale: דרש inapomhusu Mungu huonyesha kumtafuta kwa kujitoa na kumtegemea; “alimtafuta” huhifadhi maana hiyo bila kuifafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: בְּכָל לְבָבוֹ
  choice: kwa moyo wake wote
  rationale: Ni nahau ya kawaida ya Kiswahili inayoonyesha kujitoa kikamilifu.
- source_word: לְבֵית אֲחַזְיָהוּ
  choice: Ukoo wa Ahazia
  rationale: בית hapa inaelekea kumaanisha nyumba ya kifalme au nasaba; “ukoo” huwasilisha maana hiyo kwa uwazi zaidi kuliko nyumba ya jengo.
- source_word: לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: haukuwa na uwezo wa kushikilia ufalme
  rationale: Usemi huu unaonyesha kutokuwa na nguvu au uwezo wa kudumisha mamlaka ya kifalme, huku ukiacha wazi kama tatizo lilikuwa uwezo wa ukoo kwa jumla au kukosekana kwa mtu mwenye uwezo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu, יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kishazi cha mwisho kuhusu ukoo wa Ahazia
  choice: Ukoo haukuwa na uwezo wa kushikilia ufalme
  alternative: Hakukuwa na mtu katika ukoo wa Ahazia aliyekuwa na nguvu za kutawala ufalme
  rationale: Tafsiri kuu hudumisha lugha ya nguvu au uwezo kuhusiana na ufalme na hivyo huepuka kuamua kabisa kama mwandishi anamaanisha udhaifu wa nasaba kwa jumla au kutokuwapo kwa mrithi mwenye uwezo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha simulizi lenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Ahazia, Yehu, Yehoshafati, Samaria, na Yahwe.'
