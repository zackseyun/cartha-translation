base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: sw
  text: Naye alikaa pamoja nao katika nyumba ya Mungu[a], akijificha[b] kwa miaka sita, wakati Atalia alipokuwa akiitawala nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, katika eneo la hekalu; kwa neno halisi, “nyumba ya Mungu.”
    reason: cultural_note
  - marker: b
    text: Au, “akiwa amefichwa”; umbo la Kiebrania linaweza kueleweka kuwa alijificha mwenyewe au kuwa linaeleza hali yake ya kufichwa katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Naye alikaa
  rationale: Katika muktadha, kitenzi hiki kinaendeleza simulizi na kueleza kwamba Yoashi aliendelea kuwa mahali hapo; “alikaa” ni Kiswahili cha kawaida na huonyesha hali hiyo ya kudumu.
- source_word: אִתָּם
  choice: pamoja nao
  rationale: Kihusishi chenye kiambishi cha nafsi kinaonyesha kwamba Yoashi alikuwa pamoja na wale waliomficha.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: katika nyumba ya Mungu
  rationale: Hili linahifadhi moja kwa moja tamathali ya Kiebrania “nyumba ya Mungu,” huku tanbihi ikifafanua kuwa ni eneo la hekalu.
- source_word: מִתְחַבֵּא
  choice: akijificha
  rationale: Kauli ya hitpael kwa kawaida ina maana ya kujirejelea au ya kati, hivyo “akijificha” inafaa; hata hivyo, muktadha unaruhusu kuelewa hali yake kuwa amefichwa na wengine, jambo lililohifadhiwa katika tanbihi.
- source_word: שֵׁשׁ שָׁנִים
  choice: kwa miaka sita
  rationale: “Kwa” huonyesha kwa kawaida muda uliodumu katika Kiswahili.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: wakati Athalia alipokuwa akiitawala
  rationale: Muundo huu unaonyesha kwamba utawala wa Athalia ulikuwa ukiendelea sambamba na miaka sita ya kujificha kwa Yoashi.
- source_word: עַל הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha, neno hili linamaanisha nchi au eneo lililotawaliwa, bila kulipanua kuwa “dunia” wala kulibainisha zaidi ya Kiebrania.
