translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Alikaa” limetumiwa badala ya tafsiri ngumu ya neno kwa neno ili kuonyesha kuendelea kwake kuwapo huko; “akiitawala nchi” huhifadhi hali endelevu ya kitenzi cha Kiebrania.
