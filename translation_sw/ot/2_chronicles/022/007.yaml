  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: sw
  text: Kuanguka kwa Ahazia[a], katika kwenda kwake kwa Yoramu, kulitoka kwa Mungu; naye alipofika, alitoka pamoja na Yehoramu kumwelekea Yehu mwana wa Nimshi, ambaye Yahwe alikuwa amemtia mafuta ili kuikomesha nyumba ya Ahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alitoka pamoja na Yehoramu dhidi ya Yehu,” au “ili kukutana na Yehu.” Kiebrania kinasema kihalisi “kwa Yehu,” ingawa muktadha unaashiria kukabiliana kwa uadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: kulitoka kwa Mungu
  rationale: Kihusishi מן kinaonyesha chanzo. Kauli hii inahifadhi dai la wazi la Kiebrania kwamba kuanguka huko kulitoka kwa Mungu bila kufafanua namna ya usababisho.
- source_word: תְּבוּסַת
  choice: kuanguka
  rationale: Nomino hii inaweza kumaanisha kukanyagwa, kushindwa, au kuangamia. Katika muktadha, “kuanguka” ni Kiswahili cha kawaida kinachojumuisha mwisho mbaya wa Ahazia bila kuubana kuwa kushindwa vitani pekee.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: kwa kwenda kwake kwa Yoramu
  rationale: Muundo wa kitenzi-jina wenye ל unaonyesha hali au tukio lililohusiana na kuanguka kwake. Tafsiri hii inadumisha uhusiano huo bila kuufanya usababisho kuwa wa kimakanika kuliko ilivyo katika matini.
- source_word: וּבְבֹאוֹ
  choice: naye alipofika
  rationale: ב pamoja na kitenzi-jina na kiambishi cha nafsi ina maana ya wakati hapa; “alipofika” ni ya asili na huendeleza mfuatano wa simulizi.
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: alitoka pamoja na Yehoramu kwenda kwa Yehu
  rationale: יָצָא ni ‘kutoka,’ mara nyingi ikiwa na maana ya mwendo wa kijeshi, lakini אֶל yenyewe ni ‘kwa/kuelekea.’ Tafsiri kuu inabaki upande wa kutofungamanisha, huku uwezekano wa kukabiliana kwa uadui ukielezwa katika tanbihi.
- source_word: יְהוֹרָם / יוֹרָם
  choice: Yoramu / Yehoramu
  rationale: Matini ya Kiebrania inatumia maumbo yote mawili kwa mfalme yuleyule. Tafsiri inadumisha tofauti hiyo badala ya kuyasawazisha.
- source_word: מְשָׁחוֹ
  choice: alikuwa amemtia mafuta
  rationale: Kitenzi timilifu katika kishazi tegemezi kinaelekeza kwenye tendo lililotangulia tukio kuu; muundo huu wa Kiswahili unaonyesha wazi kwamba kutiwa mafuta kwa Yehu kulitangulia kukutana huko.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: ili kuikatilia mbali nyumba ya Ahabu
  rationale: Hiphil ya הכרית humaanisha kukatilia mbali, kuondoa, au kuangamiza. “Kuikatilia mbali” inadumisha nahau ya hukumu huku “nyumba” ikibaki na maana ya ukoo wa kifalme.
theological_decisions:
- issue: Usababisho wa Mungu katika kuanguka kwa Ahazia
  choice: Kuanguka kwa Ahazia kulitoka kwa Mungu.
  alternative: Mungu aliamuru kuanguka kwake; au Mungu aliruhusu hali zilizoleta kuanguka kwake.
  rationale: Kiebrania kinataja Mungu wazi kuwa chanzo, lakini hakifafanui kama hilo lilikuwa agizo la moja kwa moja, hukumu ya kimajaliwa, au ruhusa. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina “Yoramu” na “Yehoramu” yamedumishwa tofauti kwa kufuata maumbo mawili ya Kiebrania. “Nyumba ya Ahabu” ni nahau ya kibiblia inayorejelea ukoo wake wa kifalme.
