  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: sw
  text: Basi akarudi Yezreeli ili apone, kwa sababu ya majeraha waliyomsababishia huko Rama alipokuwa akipigana dhidi ya Hazaeli, mfalme wa Aramu. Naye Azaria[a], mwana wa Yehoramu, mfalme wa Yuda, akashuka kwenda kumwona[b] Yehoramu mwana wa Ahabu huko Yezreeli, kwa sababu alikuwa mgonjwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa katika Mambo ya Nyakati jina lililoandikwa ni Azaria; mfalme huyu anaitwa Ahazia mahali pengine.
    reason: alternative_reading
  - marker: b
    text: Au, “kumtembelea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Basi akarudi
  rationale: Kitenzi kinaendeleza mfuatano wa simulizi na maana yake ya msingi ni kurudi; “Basi” huunganisha simulizi kwa kawaida bila kuongeza hitimisho lisilokuwamo.
- source_word: לְהִתְרַפֵּא
  choice: ili apone
  rationale: Hapa umbo la kitenzi רפא linaonyesha kupona kutokana na majeraha; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: בְיִזְרְעֶאל
  choice: Yezreeli / huko Yezreeli
  rationale: Katika tukio la kwanza muktadha wa kurudi unaonyesha mahali anapoelekea, na katika la pili ni mahali alikokuwa Yehoramu.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: majeraha waliyomtia
  rationale: Ingawa nomino inaweza kumaanisha mapigo, katika muktadha huu inataja matokeo yake, yaani majeraha aliyohitaji kuyaponea.
- source_word: בָרָמָה
  choice: huko Rama
  rationale: Ni jina la mahali ambapo majeraha yalipatikana.
- source_word: בְּהִלָּחֲמוֹ
  choice: alipokuwa akipigana
  rationale: Kiambishi ב pamoja na kitenzi-jina kinaonyesha hali ya wakati; tafsiri hii huhifadhi tendo lililokuwa likiendelea.
- source_word: אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: na Hazaeli mfalme wa Aramu
  rationale: Baada ya “kupigana,” “na” huonyesha mpinzani kwa Kiswahili cha kawaida, huku Aramu likihifadhi jina la eneo la Kiebrania badala ya kulibadilisha kuwa jina jingine la kimapokeo.
- source_word: וַעֲזַרְיָהוּ
  choice: Naye Azaria
  rationale: Maandishi ya Kiebrania katika mstari huu yana jina Azariahu; “Azaria” hulihifadhi badala ya kulinganisha kimya kimya na jina Ahazia linalopatikana kwingine.
- source_word: יָרַד
  choice: akashuka
  rationale: Huhifadhi maana ya mwelekeo ya ירד na pia inasikika kwa kawaida katika simulizi la Kiswahili.
- source_word: לִרְאוֹת
  choice: kwenda kumwona
  rationale: Maana ya moja kwa moja ni kumwona, ingawa katika muktadha huu tendo hilo linaweza kueleweka kuwa kumtembelea.
- source_word: יְהוֹרָם בֶּן אַחְאָב
  choice: Yehoramu mwana wa Ahabu
  rationale: Majina haya yanaakisi maumbo kamili ya Kiebrania kwa tahajia za Kiswahili.
- source_word: כִּי חֹלֶה הוּא
  choice: kwa sababu alikuwa mgonjwa
  rationale: Hutoa sababu ya ziara kwa lugha ya kawaida huku ikihifadhi hali ya ugonjwa iliyotajwa katika chanzo.
theological_decisions:
- issue: Tofauti ya jina la mfalme katika simulizi la Mwandishi wa Mambo ya Nyakati
  choice: Azaria katika maandishi makuu
  alternative: Ahazia
  rationale: Hili si suala la kulazimisha fundisho fulani, bali la uaminifu kwa maandishi ya chanzo. Jina lililo katika mstari huu limehifadhiwa, na jina linalotumiwa kwa mfalme huyu mahali pengine limeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Muundo wa simulizi umewekwa wazi bila kuondoa mwelekeo wa “akashuka.” Majina ya watu na maeneo yametoholewa kwa tahajia zinazosomeka kwa Kiswahili, huku “Aramu” likifuata jina la chanzo. Alama zote za tanbihi zimewekwa mara moja katika maandishi makuu karibu na maneno yanayohusika.
