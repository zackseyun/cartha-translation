base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: sw
  text: Yeye pia alifuata shauri lao[a], akaenda pamoja na Yehoramu mwana wa Ahabu, mfalme wa Israeli, kupigana na Hazaeli mfalme wa Aramu[b] huko Ramoth-gileadi. Waaramu wakamjeruhi Yoramu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya kuongozwa na ushauri wao. Kwa neno kwa neno, Kiebrania husema kwamba alienda katika au kwa shauri lao.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “Aramu”; kwa mapokeo huitwa “Syria.” Vivyo hivyo, “Waaramu” kwa mapokeo huitwa “Wasyria.”
    reason: alternative_reading
  - marker: c
    text: 'Kiebrania kinatumia maumbo mawili yanayohusiana ya jina hili: “Yehoramu” mapema katika mstari na “Yoramu” mwishoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּעֲצָתָם הָלַךְ
  choice: Yeye pia alifuata shauri lao
  rationale: Nahau ya Kiebrania ya ‘kwenda/kuenenda kwa shauri lao’ inaeleza kuongozwa na ushauri wao. ‘Alifuata shauri lao’ ni Kiswahili cha kawaida na chenye maana hiyo bila kupoteza wazo la mwenendo.
- source_word: וַיֵּלֶךְ אֶת
  choice: akaenda pamoja na
  rationale: Muundo huu unaonyesha kuwa alifuatana na Yehoramu; ‘akaenda pamoja na’ ni wa wazi na wa asili katika simulizi.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: Yehoramu ... Yoramu
  rationale: Maumbo mawili yanayohusiana ya jina katika maandishi ya Kiebrania yamehifadhiwa kwa tahajia za Kiswahili.
- source_word: לַמִּלְחָמָה עַל
  choice: kupigana na
  rationale: Katika muktadha wa kijeshi, kirai hiki kinaonyesha kusudi la kwenda vitani dhidi ya Hazaeli; ‘kupigana na’ ni cha moja kwa moja na cha kawaida.
- source_word: אֲרָם / הָרַמִּים
  choice: Aramu / Waaramu
  rationale: Majina haya yanafuata utambulisho wa Kiebrania wa kihistoria badala ya jina la baadaye ‘Syria/Wasyria’.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: huko Ramoth-gileadi
  rationale: ‘Huko’ hutambulisha mahali pa mapigano kwa ufasaha; jina la mahali limetoholewa kwa Kiswahili huku likibaki kutambulika.
- source_word: וַיַּכּוּ
  choice: wakamtia ... jeraha
  rationale: Kitenzi kinaweza kumaanisha kupiga, lakini muktadha unaofuata unaonyesha kuwa Yoramu alijeruhiwa; usemi huu unaeleza matokeo hayo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jina la taifa אֲרָם na jina la watu הָרַמִּים
  choice: Aramu / Waaramu
  alternative: Syria / Wasyria
  rationale: ‘Aramu/Waaramu’ huakisi moja kwa moja majina ya Kiebrania na huepuka kuingiza jina la kisiasa la kipindi cha baadaye.
- issue: Maumbo ya jina יְהוֹרָם na יוֹרָם
  choice: Yehoramu mwanzoni na Yoramu mwishoni
  alternative: Kutumia jina moja katika sehemu zote mbili
  rationale: Tofauti ndogo katika maandishi ya chanzo imehifadhiwa bila kudai kwamba ni watu wawili tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Nahau isiyo ya kawaida ‘kutembea katika shauri’ imewasilishwa kwa maana yake kama ‘kufuata shauri,’ huku tanbihi ikihifadhi taswira ya Kiebrania. Majina ya kale yametoholewa kwa namna inayosomeka kwa wasomaji wa kawaida.
