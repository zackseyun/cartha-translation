  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: sw
  text: Akafanya yaliyo maovu machoni pa Yahwe, kama nyumba ya Ahabu, kwa sababu wao walikuwa washauri wake baada ya kifo cha baba yake, kwa maangamizi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kuangamia kwake,” au “ili wamwangamize.” Usemi wa Kiebrania unaweza kumaanisha matokeo ya ushauri wao au kusudi lao la kumwangamiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Akafanya yaliyo maovu
  rationale: Ka- ya masimulizi huendeleza mfuatano wa matukio, na ‘yaliyo maovu’ huwasilisha kwa Kiswahili cha kawaida usemi wa Kiebrania ‘alifanya uovu.’
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini ya Mungu na kulitaja jina la agano יְהוָה kwa ‘Yahwe.’
- source_word: כְּבֵית אַחְאָב
  choice: kama nyumba ya Ahabu
  rationale: כְּ huonyesha ulinganisho; ‘nyumba’ hapa ni familia au nasaba ya Ahabu, si jengo tu.
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: wao walikuwa washauri wake
  rationale: Huhifadhi msisitizo wa kiwakilishi הֵמָּה na muundo wa taarifa unaowatambulisha watu wa nyumba ya Ahabu kuwa washauri wake.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: baada ya kifo cha baba yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: לְמַשְׁחִית לוֹ
  choice: kwa maangamizi yake
  rationale: Huhifadhi ufupi na utata wa לְ kuhusu kusudi au matokeo, bila kuamua kimya kimya kwamba washauri walinuia kumwangamiza.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu la herufi nne moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa לְמַשְׁחִית לוֹ huonyesha kusudi au matokeo
  choice: kwa maangamizi yake
  alternative: ili wamwangamize; jambo lililosababisha maangamizi yake
  rationale: Kiebrania kinaweza kueleweka kuwa ushauri wao ulikusudia kumwangamiza au uliishia katika maangamizi yake; tafsiri kuu inahifadhi mvutano huo, na tanbihi inaueleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘machoni pa Yahwe’ huhifadhi taswira ya chanzo; ‘nyumba ya Ahabu’ huhifadhi maana ya kifamilia au kinasaba. Alama ya tanbihi imewekwa mara tu baada ya kishazi kinachohusika.
