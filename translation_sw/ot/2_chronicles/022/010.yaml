base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: sw
  text: Athalia[a], mama yake Ahazia, aliona kwamba mwanawe alikuwa amekufa; kisha akainuka na kuwaangamiza wazao wote wa kifalme wa nyumba ya Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa maandishi ya Kiebrania yana umbo gumu la kitenzi, ambalo kwa kawaida humaanisha “alisema”; lakini muktadha na simulizi sambamba katika 2 Wafalme 11:1 zinaunga mkono maana “kuwaangamiza” au “kuwaua.”
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: Athalia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili; kiunganishi וַ־ hakihitaji neno tofauti mwanzoni mwa simulizi.
- source_word: אֵם אֲחַזְיָהוּ
  choice: mama yake Ahazia
  rationale: Hutoa uhusiano wa kifamilia kwa Kiswahili cha kawaida na wazi.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: alipoona kwamba mwanawe amekufa
  rationale: Kifungu kinaonyesha kutambua ukweli wa kifo; wakati timilifu wa Kiswahili unaeleza kwa kawaida hali iliyotokana na tukio lililokamilika.
- source_word: וַתָּקָם
  choice: aliinuka
  rationale: Hudumisha uzito wa simulizi na kuonyesha kuanza kwa hatua ya makusudi.
- source_word: וַתְּדַבֵּר
  choice: kuwaangamiza
  rationale: Ingawa umbo la Kiebrania la Kimapokeo linafanana na kitenzi 'kusema,' yambwa yake na simulizi sambamba la 2 Wafalme 11:1 zinaunga mkono maana ya kuharibu au kuua.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: wazao wote wa kifalme
  rationale: זֶרַע ni 'uzao'; katika muktadha huu ni ukoo wa kifalme, si taasisi ya ufalme kwa ujumla.
- source_word: לְבֵית יְהוּדָה
  choice: wa nyumba ya Yuda
  rationale: Kifungu kinabainisha nasaba au ukoo ambao wazao hao walikuwa sehemu yake.
theological_decisions:
- issue: Maana ya kitenzi kigumu וַתְּדַבֵּר katika muktadha huu
  choice: kuwaangamiza
  alternative: alisema; alipanga wauawe
  rationale: Yambwa 'wazao wote wa kifalme' na simulizi sambamba katika 2 Wafalme 11:1 zinaonyesha tendo la kuangamiza, si kusema. Tanbihi inahifadhi uwazi kuhusu ugumu wa maandishi badala ya kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. 'Mwanawe' na 'mama yake' ni maumbo ya kawaida yanayoeleweka kwa urahisi; 'wazao wa kifalme' huhifadhi wazo la nasaba ya ufalme.
