base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: sw
  text: Ahazia alikuwa na umri wa miaka arobaini na miwili[a] alipoanza kutawala, naye akatawala mwaka mmoja Yerusalemu. Mama yake aliitwa Athalia[b], binti ya Omri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “alikuwa na umri wa miaka arobaini na miwili.” Sehemu inayolingana katika 2 Wafalme 8:26 inasema “miaka ishirini na miwili”; kwa hiyo, baadhi huona hapa kuna tatizo katika upokezaji wa maandishi au hupendekeza njia nyingine ya kuhesabu namba hiyo.'
    reason: textual_variant
  - marker: b
    text: Au “mzao wa Omri.” Neno la Kiebrania linalomaanisha “binti” wakati mwingine linaweza kutumiwa kwa maana pana ya mzao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: alikuwa na umri wa miaka arobaini na miwili
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri. Kiswahili cha asili hutumia ‘alikuwa na umri wa miaka ...’ badala ya tafsiri ya neno kwa neno ‘mwana wa miaka ...’.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo wenye kiambishi ב unaonyesha wakati wa kuanza kwa utawala; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: naye akatawala mwaka mmoja
  rationale: Inahifadhi muda uliotajwa moja kwa moja na namba ya Kiebrania huku ikisomeka kwa ufasaha.
- source_word: בִּירוּשָׁלָם
  choice: huko Yerusalemu
  rationale: Kiambishi ב kina maana ya mahali; ‘huko’ kinaonyesha eneo kwa Kiswahili cha kawaida.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Huu ni usemi wa asili wa Kiswahili unaowasilisha kwa usahihi taarifa ya Kiebrania ‘jina la mama yake lilikuwa’.
- source_word: עֲתַלְיָהוּ
  choice: Athalia
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: בַּת עָמְרִי
  choice: binti ya Omri
  rationale: Maana ya moja kwa moja ya בַּת ni ‘binti.’ Maana pana ya mzao haijaingizwa kimya kimya katika matini kuu, bali imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Mvutano wa kihistoria kuhusu umri wa Ahazia alipoanza kutawala
  choice: Kuhifadhi ‘miaka arobaini na miwili’ ya maandishi ya Kimasora katika matini kuu
  alternative: ‘Miaka ishirini na miwili’ kama ilivyo katika 2 Wafalme 8:26, au kuielewa namba kwa namna inayohusiana na ukoo wa Omri
  rationale: Chanzo kilichotolewa kinasema arobaini na miwili. Tafsiri hairekebishi wala kulinganisha kimya kimya tofauti hiyo, bali huihifadhi na kuieleza katika tanbihi.
- issue: Maana ya kiukoo ya ‘binti ya Omri’
  choice: Kutafsiri moja kwa moja ‘binti ya Omri’
  alternative: ‘Mzao wa Omri’
  rationale: Neno la Kiebrania ni neno la kawaida la ‘binti,’ lakini linaweza kutumiwa kwa maana pana ya mzao wa kike. Utata huo umehifadhiwa kwa tanbihi badala ya kuamuliwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa taarifa ya kifalme umefanywa wa asili bila kuondoa mvutano wa kimatini na wa kiukoo.
