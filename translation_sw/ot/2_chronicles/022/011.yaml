  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: sw
  text: Lakini Yehoshabeathi, binti ya mfalme, alimchukua Yoashi mwana wa Ahazia na kumwondoa kwa siri kutoka miongoni mwa wana wa mfalme waliokuwa wakiuawa.[a] Akamweka yeye pamoja na mnyonyeshaji wake katika chumba cha kulala.[b] Basi Yehoshabeathi, binti ya Mfalme Yehoramu na mke wa Yehoyada, kuhani—kwa maana alikuwa dada ya Ahazia—akamficha Yoashi mbali na Athalia; naye hakumuua.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokusudiwa kuuawa.”
    reason: Kirai cha Kiebrania kinaweza kueleweka kuwa wana hao walikuwa wakiuawa au walikuwa wamekusudiwa kuuawa.
  - marker: b
    text: 'Kiebrania: “katika chumba cha vitanda.”'
    reason: Tanbihi inaonyesha muundo halisi ulio nyuma ya tafsiri ya kawaida ‘chumba cha kulala.’
  - marker: c
    text: 'Huenda zaidi “naye” hapa anamrejelea Athalia: Yehoshabeathi alimficha Yoashi ili Athalia asimuue. Kisarufi, hata hivyo, Kiebrania hakimtaji mtendaji kwa jina, hivyo inawezekana pia kukielewa kiwakilishi kuwa kinamrejelea Yehoshabeathi.'
    reason: Kuhifadhi na kueleza utata wa mtendaji wa kitenzi cha mwisho.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: alimchukua
  rationale: Kitenzi לקח kimsingi ni ‘chukua’; tafsiri hii haiongezi maana ya ‘okoa,’ ingawa uokoaji unaonekana wazi katika muktadha.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: kumwondoa kwa siri
  rationale: גנב kwa kawaida huhusu kuiba, lakini hapa yule mtoto hakuibwa kwa nia mbaya; usemi huu wa Kiswahili unaonyesha kuondolewa kwake kwa siri bila kuleta dhana potovu ya utekaji.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: kutoka miongoni mwa wana wa mfalme waliokuwa wakiuawa
  rationale: Kirai tendwa cha Kiebrania kinaweza kueleza watu waliokuwa katika mchakato wa kuuawa au waliokusudiwa kuuawa. Matini kuu inafuata maana ya mchakato, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: מֵינִקְתּוֹ
  choice: mlezi wake
  rationale: Nomino hiyo humaanisha mwanamke aliyemnyonyesha mtoto. ‘Mlezi wake’ ni lugha ya kawaida na yenye heshima; tanbihi haijahitajika kwa kuwa muktadha wa mtoto mdogo unatosha, ingawa ‘mnyonyeshaji wake’ ingekuwa sahihi zaidi kimwili lakini si ya kawaida.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: katika chumba cha kulala
  rationale: Kihalisi ni ‘katika chumba cha vitanda’; ‘chumba cha kulala’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: וַתַּסְתִּירֵהוּ
  choice: akamficha Yoashi
  rationale: סתר ni ‘ficha.’ Jina ‘Yoashi’ limerudiwa badala ya kiwakilishi pekee ili sentensi ndefu ibaki wazi kwa msomaji wa Kiswahili.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: mbali na Athalia
  rationale: Kirai hiki ni ‘kutoka mbele/uweponi mwa Athalia’; hapa kinamaanisha kumweka nje ya uwezo na macho yake.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: naye hakumuua
  rationale: Muundo huu huhifadhi kutotajwa wazi kwa mtendaji katika Kiebrania. Muktadha unaelekea kwa Athalia kuwa mtendaji, lakini tanbihi inaeleza utata huo badala ya kuufuta katika matini.
theological_decisions:
- issue: Mtendaji wa kitenzi cha mwisho וְלֹא הֱמִיתָתְהוּ
  choice: Kiwakilishi kisichoelezwa wazi kimehifadhiwa kwa ‘naye hakumuua,’ huku tanbihi ikisema kwamba huenda zaidi kinamrejelea Athalia.
  alternative: 'Kumtaja Athalia moja kwa moja: ‘basi Athalia hakumuua’; au kukielewa kiwakilishi kuwa kinamrejelea Yehoshabeathi.'
  rationale: Kisarufi Kiebrania kinataja tu mtendaji wa kike katika kitenzi. Athalia ndiye rejeleo linalowezekana zaidi kwa sababu Yoashi alifichwa mbali naye, lakini kumtaja moja kwa moja katika matini kungeondoa utata halisi wa muundo wa asili.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametoholewa kwa mtindo wa kibiblia unaotambulika: Yehoshabeathi, Yoashi, Ahazia, Yehoramu, Yehoyada, na Athalia. Muundo wa sentensi umegawanywa kwa kiasi ili simulizi refu la Kiebrania lieleweke bila kupoteza uhusiano wa kifamilia na sababu ya tendo la Yehoshabeathi.'
