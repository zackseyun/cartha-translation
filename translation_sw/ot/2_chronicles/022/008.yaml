id: 2CH.22.8
reference: 2 Chronicles 22:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: sw
  text: Ikawa[a], Yehu alipokuwa akitekeleza hukumu dhidi ya nyumba ya Ahabu, aliwakuta maofisa wa Yuda na wana wa ndugu za Ahazia, waliokuwa wakimtumikia Ahazia[b], akawaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yehu alipokuwa akiihukumu nyumba ya Ahabu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa ndugu za Ahazia”; yaani, wapwa wa Ahazia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/הִשָּׁפֵט
  choice: alipokuwa akitekeleza hukumu
  rationale: Muundo huu wa wakati unahifadhi maana ya kitendo cha kutoa na kutekeleza hukumu, pamoja na muktadha wake wa adhabu, bila kuongeza kwamba Mungu aliidhinisha kila tendo lililotajwa.
- source_word: עִם בֵּית אַחְאָב
  choice: dhidi ya nyumba ya Ahabu
  rationale: Katika muktadha wa tendo la uhasama, עִם huonyesha walengwa wa hukumu. “Nyumba ya Ahabu” huhifadhi nahau ya kifamilia na ya nasaba ya kifalme.
- source_word: שָׂרֵי יְהוּדָה
  choice: maofisa wa Yuda
  rationale: שׂרים inaweza kumaanisha wakuu, viongozi, au maofisa. “Maofisa” inafaa muktadha wa kisiasa wa ikulu bila kuwafanya lazima wawe wana wa kifalme.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: wana wa ndugu za Ahazia
  rationale: Tafsiri hii inafuata moja kwa moja uhusiano wa ukoo ulioelezwa katika Kiebrania na kuacha ufafanuzi wa kawaida zaidi katika tanbihi.
- source_word: מְשָׁרְתִים לַ/אֲחַזְיָהוּ
  choice: waliokuwa wakimtumikia Ahazia
  rationale: Kivumishi-tendo kinaonyesha huduma iliyokuwa ikiendelea. “Kumtumikia” ni pana vya kutosha kujumuisha kuhudumu au kufanya kazi katika mazingira ya kifalme bila kuleta maana ya kikuhani.
- source_word: וַ/יַּהַרְגֵם
  choice: akawaua
  rationale: Ni tafsiri ya moja kwa moja na wazi ya הרג, bila kuficha ukali wa tendo wala kulitia mapambo.
- source_word: וַ/יְהִי
  choice: Ikawa
  rationale: “Ikawa” ni fomula ya kawaida, yenye heshima, ya kuendeleza simulizi la kibiblia katika Kiswahili.
theological_decisions:
- issue: Tabia ya tendo la Yehu katika lugha ya hukumu
  choice: akitekeleza hukumu
  alternative: akiihukumu nyumba ya Ahabu
  rationale: Tafsiri inadumisha nguvu ya kimahakama ya שׁפט na mwelekeo wake wa adhabu, lakini haisemi zaidi ya aya kwa kutangaza wazi kwamba kila mauaji katika kifungu hiki yaliidhinishwa na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ikawa” huhifadhi mtiririko wa simulizi la Biblia; “maofisa” ni wazi kwa wasomaji wa kawaida; na “nyumba ya Ahabu” huhifadhi nahau ya chanzo kuhusu familia au nasaba.
source_grounding:
  english_pob_role: consult_only
