base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: sw
  text: Kisha wakazi wa Yerusalemu wakamweka Ahazia, mwana mdogo zaidi wa Yehoramu, kuwa mfalme badala ya Yehoramu, kwa sababu kikosi cha wavamizi kilichokuja kambini pamoja na Waarabu[a] kilikuwa kimewaua wana wa Yehoramu wote waliokuwa wakubwa kuliko Ahazia. Hivyo Ahazia, mwana wa Yehoramu, mfalme wa Yuda, akawa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilichokuja miongoni mwa Waarabu kambini.” Kirai cha Kiebrania kinaweza kueleweka kwa njia tofauti kulingana na jinsi kihusishi kinachohusiana na “Waarabu” kinavyofasiriwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: wakamweka ... kuwa mfalme
  rationale: Kauli ya Hifili ya מלך inaonyesha kuwa wakazi walimsimika Ahazia katika ufalme; usemi huu ni wa asili katika Kiswahili na unahifadhi maana ya kusababisha atawale bila kudokeza lazima kuwe na sherehe ya kutawazwa.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: wakazi wa Yerusalemu
  rationale: Hii inawasilisha kwa lugha ya kawaida na yenye heshima maana halisi ya watu waliokaa Yerusalemu.
- source_word: בְנוֹ הַקָּטֹן
  choice: mwanawe mdogo kabisa
  rationale: Ingawa קָטֹן inaweza kumaanisha mdogo au mchanga, kutajwa kwa wana wakubwa baadaye kunaonyesha kuwa huyu ndiye mwana mdogo kuliko wote.
- source_word: תַּחְתָּיו
  choice: badala yake
  rationale: Kirai hiki kinaonyesha Ahazia kuchukua nafasi ya mtawala aliyetangulia.
- source_word: כָל הָרִאשֹׁנִים
  choice: wana wote wakubwa
  rationale: Neno hilo kihalisi ni ‘wote waliotangulia/wa kwanza,’ lakini muktadha unawatambulisha kama wana wa Yehoramu waliokuwa wakubwa kuliko Ahazia.
- source_word: הַגְּדוּד
  choice: kikosi cha wavamizi
  rationale: גְּדוּד humaanisha kikosi, mara nyingi kikosi kinachovamia au kuteka nyara; tafsiri hii inaonyesha maana ya kijeshi katika muktadha.
- source_word: הַבָּא בָעַרְבִים
  choice: kilichokuja pamoja na Waarabu
  rationale: Kihusishi ב kimechukuliwa kwa maana ya ushirika, lakini kinaweza pia kueleweka kuwa kikosi kilikuja miongoni mwa Waarabu; utata huo umehifadhiwa katika tanbihi.
- source_word: לַמַּחֲנֶה
  choice: kambini
  rationale: Katika muktadha wa uvamizi, usemi huu unaonyesha kufika au kuingia kambini; ‘kambini’ ni wa asili na haubani zaidi ya inavyohitajika.
- source_word: הָרַג
  choice: kilikuwa kimewaua
  rationale: Muundo huu unaonyesha kwamba mauaji yalikuwa yametokea kabla na ndiyo sababu Ahazia akawekwa kuwa mfalme.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Hapa kitenzi cha מלך ni taarifa ya kuingia katika ufalme; ‘akawa mfalme’ kinaonyesha kuanza kutawala na pia kinaepuka kudokeza muda wa utawala.
