  source_fidelity: 'Tafsiri inahifadhi kwa uaminifu vipengele vya Kiebrania: nguvu ya nyongeza katika “Yeye pia,” nahau ya mwenendo wa kimaadili katika “alifuata njia za,” maana ya kidinastia ya בֵּית אַחְאָב katika “ukoo wa Ahabu,” uhusiano wa sababu, na hukumu ya wazi kwamba mama yake alimshauri kutenda maovu. “Alikuwa akimshauri” ni uundaji wa kitenzi ulio wa kawaida unaowasilisha vizuri dhima endelevu ya יֹעַצְתּוֹ bila kubadili maana.'
