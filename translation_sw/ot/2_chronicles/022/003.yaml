id: 2CH.22.3
reference: 2 Chronicles 22:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: sw
  text: Yeye pia alifuata njia za ukoo wa Ahabu[a], kwa sababu mama yake alikuwa akimshauri atende maovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “nyumba ya Ahabu,” yaani familia au nasaba yake ya kifalme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Yeye pia
  rationale: 'Huhifadhi nguvu ya nyongeza na mkazo wa kiwakilishi: mfalme huyu naye alifuata mwenendo huo.'
- source_word: הָלַךְ בְּדַרְכֵי
  choice: alifuata njia za
  rationale: Ni Kiswahili cha kawaida kinachowasilisha nahau ya Kiebrania kuhusu mwenendo wa kimaadili, si kutembea kimwili.
- source_word: בֵּית אַחְאָב
  choice: ukoo wa Ahabu
  rationale: בֵּית hapa humaanisha familia au nasaba ya kifalme; “ukoo” ni wazi kwa msomaji wa sasa kuliko “nyumba” bila kupunguza maana ya kidinastia.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya mwenendo wake.
- source_word: אִמּוֹ
  choice: mama yake
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi milikishi.
- source_word: הָיְתָה יֹעַצְתּוֹ
  choice: alikuwa akimshauri
  rationale: Ingawa muundo wa Kiebrania ni wa jina, “alikuwa akimshauri” ni wa kawaida katika Kiswahili na huhifadhi wazo la ushauri ulioendelea.
- source_word: לְהַרְשִׁיעַ
  choice: atende maovu
  rationale: Huwasilisha wazi lengo au matokeo ya ushauri huo na huhifadhi hukumu ya kimaadili ya maandishi.
theological_decisions:
- issue: Mwenendo mwovu wa mfalme chini ya ushawishi wa mama yake
  choice: Kusema wazi kwamba mama yake alimshauri atende maovu
  alternative: mama yake alimhimiza kufanya uovu
  rationale: Maandishi yanatoa hukumu ya wazi ya kimaadili kwa kutumia לְהַרְשִׁיעַ; tafsiri haiupunguzi wala kuongeza maelezo ya kisaikolojia yasiyokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Alifuata njia za” hudumisha picha ya mwenendo bila kuleta dhana ya kutembea kimwili; “ukoo” hufafanua maana ya kidinastia ya ‘nyumba’.
