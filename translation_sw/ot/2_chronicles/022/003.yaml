  terminology: “Ahabu” ni umbo la jina linalotumika kwa kawaida katika Kiswahili. “Ukoo” hutoa maana ya familia/nasaba ya kifalme iliyomo katika “nyumba ya Ahabu,” na tanbihi inahifadhi usemi wa karibu zaidi na neno halisi. “Maovu” huhifadhi tathmini ya kimaadili ya לְהַרְשִׁיעַ bila kuongeza tafsiri ya kiteolojia.
