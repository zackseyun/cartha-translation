  text: וְ֠/עַתָּה הַ/חִטִּ֨ים וְ/הַ/שְּׂעֹרִ֜ים הַ/שֶּׁ֤מֶן וְ/הַ/יַּ֨יִן֙ אֲשֶׁ֣ר אָמַ֣ר אֲדֹנִ֔/י יִשְׁלַ֖ח לַ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: sw
  text: Na sasa, bwana wangu na awapelekee watumishi wake ngano, shayiri, mafuta[a] na divai, ambavyo bwana wangu alivitaja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafuta ya zeituni”; katika muktadha huu wa ugavi, huenda mafuta hayo yalikuwa ya zeituni.
    reason: lexical_alternative
  - marker: b
    text: Au, “ambavyo alisema.” Kiebrania hakilazimishi maana yenye nguvu zaidi ya “ambavyo aliahidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi ו pamoja na alama ya mazungumzo עתה, ambayo inaanzisha ombi la vitendo.
- source_word: הַחִטִּים
  choice: ngano
  rationale: Ni jina la zao linalotumiwa kwa kawaida kama nomino ya wingi isiyohesabika katika Kiswahili; muktadha unaonyesha kiasi maalumu kilichotajwa.
- source_word: וְהַשְּׂעֹרִים
  choice: shayiri
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya zao hili, ikilingana na orodha ya mahitaji.
- source_word: הַשֶּׁמֶן
  choice: mafuta
  rationale: Neno la Kiebrania linamaanisha mafuta kwa upana; ingawa katika muktadha huu huenda ni mafuta ya zeituni, hilo halijaainishwa katika maandishi.
- source_word: וְהַיַּיִן
  choice: divai
  rationale: Tafsiri ya moja kwa moja ya bidhaa iliyoorodheshwa.
- source_word: אֲשֶׁר אָמַר
  choice: ambavyo alisema
  rationale: Kishazi rejeshi kinarejelea vitu vilivyoorodheshwa na kinahifadhi maana ya kawaida ya אמר bila kuongeza wazo lenye nguvu zaidi la kuahidi.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumwita mfalme, wala si jina la Mungu; herufi ndogo zinaepusha mkanganyiko huo.
- source_word: יִשְׁלַח
  choice: na awapelekee
  rationale: Yiqtol ina nguvu ya ombi katika muktadha huu. Muundo wa 'na a-' ni wa asili katika Kiswahili na unaonyesha ombi hilo, huku kiambishi '-pelek-' kikifaa kwa bidhaa zinazopelekwa kwa watu.
- source_word: לַעֲבָדָיו
  choice: watumishi wake
  rationale: Inatafsiri kwa uwazi עבד na kiambishi cha nafsi ya tatu; hapa ni wafanyakazi au watumishi wa Hiramu.
