base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: sw
  text: Solomoni aliwahesabu wanaume elfu sabini kuwa wabeba mizigo, na wanaume elfu themanini kuwa wachonga mawe mlimani[a], na wasimamizi elfu tatu na mia sita juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana ya karibu husema “wanaochonga mlimani”; neno “mawe” linaeleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: aliwahesabu
  rationale: Kitenzi ספר hapa kina maana ya kuhesabu au kuorodhesha watu; “aliwahesabu” ni Kiswahili cha kawaida na kinafaa katika orodha hii ya wafanyakazi.
- source_word: אִישׁ ... סַבָּל
  choice: wanaume ... wabeba mizigo
  rationale: אִישׁ inarejelea wanaume, na סַבָּל ni mtu anayebeba mizigo. Tafsiri hii inahifadhi jinsia na aina ya kazi iliyotajwa.
- source_word: חֹצֵב בָּהָר
  choice: wachonga mawe milimani
  rationale: חצב humaanisha kuchonga au kukata, na katika muktadha wa ujenzi kitu kinachokusudiwa ni mawe. בָּהָר inaonyesha mahali pa kazi, yaani milimani. Tanbihi inabainisha kwamba neno “mawe” halitajwi wazi katika Kiebrania.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: akawaweka wasimamizi ... juu yao
  rationale: Katika muktadha huu, participio ya נצח inawataja watu walioongoza au kusimamia kazi. “Juu yao” inahifadhi kwa uwazi עֲלֵיהֶם.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: elfu tatu na mia sita
  rationale: Hii ndiyo namna ya kawaida na sahihi ya kutaja idadi hiyo kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. “Wabeba mizigo,” “wachonga mawe,” na “wasimamizi” ni maneno yanayoeleweka kwa urahisi huku yakihifadhi makundi ya kazi katika maandishi ya Kiebrania.
