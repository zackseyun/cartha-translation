base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: sw
  text: Ndipo Huramu akasema[a], “Ahimidiwe Yahweh, Mungu wa Israeli, aliyezifanya mbingu na dunia, ambaye amempa Mfalme Daudi mwana mwenye hekima, aliye na busara na ufahamu[b], ambaye atajenga nyumba kwa ajili ya Yahweh na nyumba kwa ajili ya ufalme wake[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika simulizi sambamba la 1 Wafalme jina hili linaandikwa “Hiramu”; hapa Mambo ya Nyakati lina umbo la Kiebrania “Huram,” lililotoholewa katika Kiswahili kuwa “Huramu.”
    reason: alternative_reading
  - marker: b
    text: Au, “mwenye utambuzi na ufahamu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, nyumba kwa ajili ya utawala wake wa kifalme; huenda maneno haya yanarejelea majengo ya ikulu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: חוּרָם
  choice: Huramu
  rationale: Jina limefuata umbo la Kiebrania חוּרָם katika Mambo ya Nyakati, bila kulisawazisha na Hiramu katika simulizi sambamba.
- source_word: בָּרוּךְ יְהוָה
  choice: Ahimidiwe Yahweh
  rationale: Huu ni usemi wa baraka unaosikika kwa kawaida na kwa heshima katika Kiswahili, huku jina la Mungu likihifadhiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: aliyezifanya mbingu na dunia
  rationale: Inahifadhi lugha ya uumbaji na wingi wa neno la Kiebrania la 'mbingu' kwa namna ya kawaida katika Kiswahili.
- source_word: בֵּן חָכָם
  choice: mwana mwenye hekima
  rationale: Huwasilisha kwa uwazi sifa ya hekima, ikijumuisha uwezo wa kutenda kwa ustadi.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: aliye na busara na ufahamu
  rationale: Ni Kiswahili cha asili kinachowasilisha uwezo unaoelezwa na kirai cha Kiebrania bila kufanya sentensi kuwa ngumu.
- source_word: בַּיִת לַיהוָה
  choice: nyumba kwa ajili ya Yahweh
  rationale: Neno 'nyumba' linahifadhi sitiari ya Kiebrania badala ya kuibadilisha moja kwa moja kuwa 'hekalu'.
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: nyumba kwa ajili ya ufalme wake
  rationale: Inahifadhi usemi mpana wa Kiebrania na kutofunga maana yake kwa 'ikulu' pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano moja kwa moja; kulitohowa huhifadhi tofauti kati ya jina hilo na cheo cha kawaida.
- issue: Maana ya בַּיִת לְמַלְכוּתוֹ
  choice: nyumba kwa ajili ya ufalme wake
  alternative: ikulu yake
  rationale: Tafsiri kuu inahifadhi upana na mvutano wa usemi wa Kiebrania; tanbihi inaeleza uwezekano wa kurejelea jengo la kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umefanywa wa kawaida kwa wasomaji wa leo, huku istilahi za msingi kama “Yahweh,” “mbingu na dunia,” na “nyumba” zikihifadhi ukaribu na chanzo cha Kiebrania.
