base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: sw
  text: Kisha Sulemani akawahesabu watu wote waliokuwa wageni wakazi katika nchi ya Israeli[a], baada ya kuhesabiwa kwao na Daudi, baba yake. Wakapatikana kuwa laki moja, elfu hamsini na tatu, na mia sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wahamiaji” au “wageni.” Neno la Kiebrania hurejelea watu wasio Waisraeli waliokuwa wakiishi katika nchi ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: akawahesabu
  rationale: Kitenzi hiki kina maana ya kuhesabu watu mmoja mmoja; ‘akawahesabu’ ni cha kawaida na kinaendana na kutajwa kwa sensa iliyotangulia.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: wanaume wote waliokuwa wageni wakazi
  rationale: גֵּרִים ni watu wasio wenyeji waliokaa kwa kudumu katika eneo la Israeli, si wasafiri wa muda mfupi. ‘Wageni wakazi’ linaeleza hadhi hiyo, huku ‘wanaume’ likiwakilisha אֲנָשִׁים katika muktadha huu wa kuandikisha nguvu kazi.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: katika nchi ya Israeli
  rationale: Hifadhi maana ya kieneo ya אֶרֶץ na muundo wa Kiebrania kuliko kifupi ‘katika Israeli.’
- source_word: אַחֲרֵי הַסְּפָר
  choice: baada ya sensa
  rationale: Kirai hiki kinarejelea uhesabuji wa awali; ‘baada ya sensa’ ni Kiswahili cha kawaida, ingawa maana ya kufuata rekodi ya hesabu hiyo pia inawezekana.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: ambayo Daudi baba yake alikuwa amewafanyia
  rationale: Katika Kiswahili mtu ‘hufanyiwa sensa’; wakati uliotangulia unaonyesha kwamba Daudi alikuwa amefanya uhesabuji huo kabla ya Sulemani.
- source_word: וַיִּמָּצְאוּ
  choice: Wakapatikana kuwa
  rationale: 'Hifadhi maana tendwa na ya matokeo ya kitenzi cha Kiebrania: jumla ilibainika baada ya kuhesabu.'
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: laki moja na elfu hamsini na tatu na mia sita
  rationale: Hutoa kwa maneno jumla kamili ya 153,600 kwa mpangilio wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Sensa’ ni neno la kisasa na linaloeleweka sana; ‘wageni wakazi’ linaonyesha wazi kuwa hawakuwa wasafiri wa muda mfupi.
