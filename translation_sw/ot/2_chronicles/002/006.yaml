reference: 2 Chronicles 2:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: sw
  text: Kwa hiyo, sasa nitumie mwanamume stadi wa kufanya kazi kwa dhahabu, fedha, shaba, chuma, zambarau, nyekundu iliyokolea[a], na samawati, na anayejua kuchonga nakshi[b], ili afanye kazi pamoja na mafundi stadi walio pamoja nami katika Yuda na Yerusalemu, ambao baba yangu Daudi aliwaandaa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyekundu angavu” badala ya “nyekundu iliyokolea.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno halisi kinasema “kuchonga michongo,” tamko linalotumia maneno ya mzizi mmoja kusisitiza kazi ya ustadi ya kuchonga.
    reason: lexical_alternative
  - marker: c
    text: Au “aliowateua” au “aliowaweka tayari”; kitenzi cha Kiebrania kinaweza kumaanisha kuandaa au kuteua kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kiebrania kina kiunganishi pamoja na kielezi cha wakati; “Basi sasa” kinaendeleza hoja na kuhifadhi maana ya wakati kwa Kiswahili cha kawaida.
- source_word: שְׁלַח לִי
  choice: nitumie
  rationale: Ombi la amri kwa mpokeaji; “nitumie” ni sawa na “tuma kwangu” lakini ni la kawaida na fasaha zaidi.
- source_word: אִישׁ חָכָם
  choice: mwanamume stadi
  rationale: Katika muktadha wa ufundi, חָכָם humaanisha mwenye ustadi wa kiufundi, si mwenye hekima kwa ujumla. “Mwanamume” huhifadhi umoja na jinsia ya neno la chanzo.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: wa kufanya kazi kwa dhahabu, fedha, shaba, chuma
  rationale: Kirai kinaeleza vifaa ambavyo fundi atatumia. “Kufanya kazi kwa” ni Kiswahili cha asili, huku נְחֹשֶׁת ikitafsiriwa “shaba” katika mazingira haya ya kihistoria.
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: zambarau, nyekundu iliyokolea na samawati
  rationale: Maneno haya yanataja rangi au vifaa vilivyotiwa rangi bila kutaja wazi kitambaa au uzi; kwa hiyo majina ya rangi yameachwa bila kuongeza aina maalumu ya nguo.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: anajua pia kuchonga nakshi
  rationale: Hili ni tamko la ustadi wa kuchonga. Kiswahili hiki ni cha asili; tanbihi huhifadhi taarifa kwamba Kiebrania kimetumia maneno ya mzizi mmoja kwa msisitizo.
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: pamoja na mafundi stadi walio pamoja nami
  rationale: Muktadha ni ushirikiano wa mafundi. “Mafundi stadi” hutoa maana ya kiufundi ya חֲכָמִים, na “walio pamoja nami” huepuka kuingiza wazo la mamlaka ambalo halijasemwa wazi.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: ambao baba yangu Daudi aliwaandaa
  rationale: Kitenzi הֵכִין kina wigo wa kuandaa, kuweka tayari, au kuteua. “Aliwaandaa” huhifadhi maana pana bila kuamua kimya kimya kwamba waliteuliwa rasmi.
theological_decisions:
- issue: Rejeo la kishazi אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: “ambao” linaelekezwa kwa mafundi stadi
  alternative: Kukielekeza kwa maandalizi au vifaa vilivyotajwa katika muktadha mpana
  rationale: Kwa sarufi na ukaribu wa kishazi, mafundi stadi ndio rejeo linalowezekana zaidi; hata hivyo kitenzi chenyewe hakibainishi kama Daudi aliwaandaa au aliwateua, hivyo tofauti hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa ili orodha ndefu na maelezo ya ustadi visomeke kwa urahisi. Majina ya rangi hayajapanuliwa kuwa “uzi” au “kitambaa” kwa kuwa chanzo hakitaji kitu hicho wazi.
