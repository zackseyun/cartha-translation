lexical_decisions:
- source_word: וּלְהָכִין
  choice: na kuniandalia
  rationale: Kitenzi-jina chenye viambishi vya kuunganisha na kusudi kinaendeleza ombi la mstari uliotangulia; “kuniandalia” ni Kiswahili cha kawaida kinachohifadhi maana ya kuandaa kwa ajili ya msemaji.
- source_word: לִי
  choice: -ni- (kuniandalia)
  rationale: Kiambishi cha nafsi ndani ya kitenzi kinaonyesha kwamba maandalizi yanafanywa kwa ajili ya Sulemani, kwa mtindo wa asili wa Kiswahili.
- source_word: עֵצִים
  choice: mbao
  rationale: Katika muktadha wa ujenzi, “mbao” huonyesha kwa uwazi zaidi miti iliyokusudiwa kuwa nyenzo ya ujenzi kuliko “miti” au “kuni.”
- source_word: לָרֹב
  choice: nyingi
  rationale: Neno hili linaonyesha wingi mkubwa; “mbao nyingi” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi na “kwa maana” kinadumisha mtindo wenye hadhi.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Kiebrania kinasema kihalisi “nyumba”; tafsiri hii inadumisha taswira ya chanzo, huku tanbihi ikieleza kuwa hapa ni hekalu.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: ninayoijenga
  rationale: Muundo huu wa Kiswahili unaonyesha tendo linaloendelea au linalokusudiwa kwa karibu na kuunganisha kishazi tegemezi kwa kawaida.
- source_word: גָּדוֹל
  choice: kubwa
  rationale: “Kubwa” linaweza kuonyesha ukubwa na ukuu wa jengo katika muktadha huu.
- source_word: וְהַפְלֵא
  choice: na ya ajabu
  rationale: Mzizi פלא unaonyesha jambo lisilo la kawaida, la kustaajabisha; “ya ajabu” ni ya kawaida na inadumisha nguvu ya kauli bila kuongeza maelezo.
