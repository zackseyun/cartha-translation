base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: sw
  text: Kutoka miongoni mwao, aliwateua watu sabini elfu kuwa wabeba mizigo, watu themanini elfu kuwa wachonga mawe milimani[a], na watu elfu tatu mia sita kuwa wasimamizi wa kuwaweka watu kazini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wachongaji milimani.” Kiebrania kinasema kwa tafsiri ya moja kwa moja “wachongaji milimani,” bila kutaja kitu walichochonga; muktadha unaonyesha kuwa kilikuwa mawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: Kutoka miongoni mwao, aliwateua
  rationale: Kirai hiki kinamaanisha kuwachagua au kuwaweka watu kutoka katika kundi fulani. “Aliwateua” ni Kiswahili cha kawaida na huonyesha uteuzi wao kwa kazi zilizotajwa.
- source_word: סַבָּל
  choice: wabeba mizigo
  rationale: Nomino hii humaanisha watu wanaobeba mizigo; tafsiri hii ni sahihi zaidi kuliko neno pana “wafanyakazi.”
- source_word: חֹצֵב בָּהָר
  choice: wachonga mawe milimani
  rationale: Kitenzi חצב humaanisha kuchonga au kukata, na katika muktadha wa ujenzi kitu kinachokatwa ni mawe. “Milimani” huwakilisha בָּהָר kwa Kiswahili cha kawaida huku tanbihi ikihifadhi hali ya kitu kilichoachwa kudokezwa katika Kiebrania.
- source_word: מְנַצְּחִים
  choice: wasimamizi
  rationale: Katika muktadha wa kazi za ujenzi, neno hili linawataja watu walioongoza na kusimamia kazi.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: wa kuwafanyisha watu kazi
  rationale: Muundo wa kisababishi wa עבד una maana ya kuwasababisha watu wafanye kazi au kuwaweka kazini; “kuwafanyisha watu kazi” huhifadhi nguvu hiyo ya kisababishi.
- source_word: הָעָם
  choice: watu
  rationale: Kiebrania kinasema kwa upana “watu,” si “wafanyakazi”; muktadha ndio unaobainisha kwamba walikuwa kikosi cha kazi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umerahisishwa kwa kurudia “watu” mbele ya idadi ili orodha ndefu isomeke wazi. Alama ya tanbihi imewekwa baada ya “wachonga mawe milimani,” ambako hoja ya kileksika inahusika.
