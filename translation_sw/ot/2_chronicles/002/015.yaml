base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: sw
  text: Nasi tutakata mbao kutoka Lebanoni, kadiri utakavyohitaji, na tutakuletea zikiwa mafungu ya mbao yanayoelea[a] baharini hadi Yafa[b]. Nawe utazipandisha hadi Yerusalemu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama rafti za mbao.”
    reason: lexical_alternative
  - marker: b
    text: Yafa ni bandari inayojulikana leo kama Jafa.
    reason: cultural_note
  - marker: c
    text: Kwa Kiebrania, “utazipandisha hadi Yerusalemu”; kauli ya kupandisha inaonyesha kwamba Yerusalemu iko juu zaidi kuliko pwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרֹת
  choice: tutakata
  rationale: Kitenzi cha Kiebrania katika muktadha wa miti kinamaanisha kukata miti kwa ajili ya kupata mbao; ‘tutakata’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: עֵצִים
  choice: mbao
  rationale: Katika muktadha wa vifaa vya ujenzi, neno hili linarejelea miti iliyokusudiwa kuwa mbao, si miti hai kwa ujumla.
- source_word: מִן הַלְּבָנוֹן
  choice: kutoka Lebanoni
  rationale: Huhifadhi mahali pa asili ya mbao kwa kutumia namna ya kawaida ya jina hilo katika Kiswahili.
- source_word: כְּכָל צָרְכֶּךָ
  choice: kadiri utakavyohitaji
  rationale: Huonyesha kwamba kiasi cha mbao kitaamuliwa na mahitaji ya mpokeaji, kwa Kiswahili cha asili.
- source_word: וּנְבִיאֵם לְךָ
  choice: na tutakuletea
  rationale: Kiambishi cha Kiebrania kinarejelea mbao; katika Kiswahili, yambwa hilo linaeleweka kutokana na muktadha bila kulazimika kurudiwa.
- source_word: רַפְסֹדוֹת
  choice: zikiwa mafungu yanayoelea
  rationale: Neno linamaanisha mbao zilizofungwa pamoja ili zielee na kusafirishwa majini. Kauli hii ni wazi kwa msomaji wa kawaida bila kuziita mashua.
- source_word: עַל יָם יָפוֹ
  choice: baharini hadi Yafa
  rationale: Hutoa njia ya usafirishaji na Yafa kama mahali pa kufikishia mbao kwa Kiswahili cha kawaida.
- source_word: יָפוֹ
  choice: Yafa
  rationale: Hili ni umbo linalotambulika katika matumizi ya kibiblia ya Kiswahili kwa bandari iliyojulikana baadaye kama Jafa.
- source_word: תַּעֲלֶה אֹתָם
  choice: utazipandisha
  rationale: Huhifadhi maana ya kuelekea juu iliyomo katika עלה na upatanisho wa ngeli wa ‘mbao’; pia inafaa kwa kupanda kutoka pwani kuelekea Yerusalemu.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Ni namna sanifu na iliyozoeleka ya jina hili katika Kiswahili cha kibiblia.
