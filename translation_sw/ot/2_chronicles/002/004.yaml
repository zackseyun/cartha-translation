  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: sw
  text: Nayo nyumba ninayoijenga itakuwa kubwa[a], kwa maana Mungu wetu ni mkuu kuliko miungu yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu ninalolijenga litakuwa kubwa.” Kwa maana halisi, Kiebrania husema, “nyumba ninayoijenga.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mungu wetu ni mkuu juu ya miungu yote.” Kiebrania hutumia neno lenye maana ya “mkuu” pamoja na “kuliko miungu yote” kuonyesha ulinganisho.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: Nayo nyumba
  rationale: Neno בַּיִת kwa msingi humaanisha “nyumba”; hapa linarejelea nyumba ya Mungu, yaani hekalu. “Nyumba” huhifadhi taswira ya Kiebrania, huku tanbihi ikitoa maana ya kimuktadha.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: ninayoijenga
  rationale: Muundo huu wa kawaida wa Kiswahili huunganisha kiwakilishi cha nafsi na kishazi rejeshi, na kuwasilisha tendo linaloendelea au mradi unaotekelezwa.
- source_word: גָּדוֹל
  choice: kubwa
  rationale: Kwa jengo, “kubwa” huwasilisha ukubwa na umuhimu bila kuongeza wazo la fahari ambalo halijasemwa wazi.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa sababu ya kauli iliyotangulia; “kwa maana” ni ya asili, yenye heshima, na inaonyesha uhusiano huo wazi.
- source_word: גָדוֹל אֱלֹהֵינוּ
  choice: Mungu wetu ni mkuu
  rationale: “Mkuu” linafaa kwa ukuu wa Mungu kuliko “mkubwa” katika Kiswahili cha sasa, huku likihifadhi wazo la גָדוֹל.
- source_word: מִכָּל הָאֱלֹהִים
  choice: kuliko miungu yote
  rationale: מִן pamoja na kivumishi huunda ulinganisho; “kuliko” ndio njia ya kawaida ya kuonyesha ulinganisho huo kwa Kiswahili. “Miungu” huhifadhi usemi wa chanzo bila kuamua kimafundisho asili au hali ya hao wanaoitwa miungu.
theological_decisions:
- issue: Ulinganisho kati ya Mungu wa Israeli na miungu mingine
  choice: Mungu wetu ni mkuu kuliko miungu yote
  alternative: Mungu wetu ni mkuu juu ya miungu yote
  rationale: Tafsiri kuu huonyesha kwa uwazi nguvu ya kulinganisha ya גָדוֹל ... מִכָּל. Haifafanui kama “miungu” ni sanamu, miungu ya uongo, au viumbe vya rohoni, hivyo inadumisha mvutano wa usemi wa Kiebrania.
- issue: Nyumba inayojengwa
  choice: nyumba
  alternative: hekalu
  rationale: “Nyumba” huhifadhi neno halisi la Kiebrania na taswira ya nyumba ya Mungu; “hekalu” ni ufafanuzi sahihi wa kimuktadha na umetolewa katika tanbihi badala ya kuchukua nafasi ya taswira hiyo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. “Nayo” huendeleza kiunganishi cha Kiebrania kwa ufasaha; “ninayoijenga” ni ya kisasa na ya kawaida. Tofauti kati ya “kubwa” kwa jengo na “mkuu” kwa Mungu ni ya asili katika Kiswahili na huhifadhi maana pana ya גָּדוֹל kulingana na nomino inayohusika.
