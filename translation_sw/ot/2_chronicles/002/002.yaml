source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח שְׁלֹמֹ֔ה אֶל חוּרָ֥ם מֶֽלֶךְ צֹ֖ר לֵ/אמֹ֑ר כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִם דָּוִ֣יד אָבִ֔/י וַ/תִּֽשְׁלַֽח ל֣/וֹ אֲרָזִ֔ים לִ/בְנֽוֹת ל֥/וֹ בַ֖יִת לָ/שֶׁ֥בֶת בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: sw
  text: Ndipo Sulemani akatuma ujumbe kwa Huramu[a], mfalme wa Tiro, akisema, “Kama ulivyomtendea Daudi baba yangu na kumpelekea mbao za mierezi ili ajijengee nyumba ya kukaa ndani yake—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huramu ni umbo la jina lililotumiwa hapa katika Kiebrania; kifungu sambamba katika Wafalme kwa kawaida hutumia jina Hiramu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo ... akatuma ujumbe
  rationale: Kitenzi chenye waw-consecutive kinaendeleza simulizi. “Ndipo” linaonyesha mfuatano kwa Kiswahili cha sasa; “ujumbe” limewekwa wazi kutokana na muktadha wa akisema, bila kudai kwamba Sulemani alimtuma mtu Huramu mwenyewe.
- source_word: חוּרָם
  choice: Huramu
  rationale: Jina linafuata umbo la Kiebrania חוּרָם, likiongezewa irabu ya mwisho ili litamkike kwa kawaida katika Kiswahili. Umbo linalojulikana zaidi, Hiramu, limewekwa katika tanbihi.
- source_word: מֶלֶךְ צֹר
  choice: mfalme wa Tiro
  rationale: Hili ni tafsiri ya kawaida ya muundo wa cheo pamoja na jina la mahali.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Linaanzisha maneno ya moja kwa moja kwa mtindo wa kawaida na wenye hadhi katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: Kama
  rationale: Linaanzisha ulinganisho ambao unaendelea hadi mstari unaofuata; haliongezi hitimisho lisilopo katika mstari huu wa Kiebrania.
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: ulivyomtendea Daudi baba yangu
  rationale: “Kumtendea” linaakisi maana pana ya kufanya au kushughulika na mtu, ambayo tendo linalofuata linafafanua.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: na kumpelekea mbao za mierezi
  rationale: Katika muktadha wa ujenzi, אֲרָזִים humaanisha mierezi kama mbao za ujenzi. “Mbao za mierezi” ni ya asili zaidi kwa Kiswahili kuliko kusema miti ilipelekwa, bila kubainisha umbo maalumu kama magogo.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: ili ajijengee nyumba
  rationale: Muundo “ajijengee” unaonyesha kusudi la ujenzi na kwamba nyumba hiyo ilikuwa kwa matumizi ya Daudi mwenyewe.
- source_word: לָשֶׁבֶת בּוֹ
  choice: ya kukaa ndani yake
  rationale: Katika muktadha huu ישב humaanisha kuishi au kukaa mahali; usemi huu ni wa kawaida na unaeleweka kwa urahisi.
- source_word: ellipsis after לָשֶׁבֶת בּוֹ
  choice: sentensi inaachwa iendelee, ikionyeshwa kwa kistari kirefu
  rationale: Maandishi ya Kiebrania hayana maneno yanayolingana na “nifanyie vivyo hivyo” katika mstari huu. Kistari kirefu kinahifadhi muundo unaoendelea badala ya kuingiza hitimisho kutoka tafsiri ya Kiingereza au kifungu sambamba.
theological_decisions:
- issue: Iwapo kukamilisha ombi la Sulemani ndani ya mstari huu
  choice: Kuacha ulinganisho ukiendelea hadi mstari unaofuata
  alternative: Kuongeza “basi nifanyie vivyo hivyo”
  rationale: Chanzo cha Kiebrania katika mstari huu huishia baada ya nyumba ambayo Daudi angekaa ndani yake. Kuongeza ombi kamili kungefanya mstari ujitegemee vizuri zaidi, lakini kungeingiza maneno yasiyopo na kuficha utegemezi wake kwa mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili kwa Kiswahili huku kutokamilika kwa kisintaksia kwa mstari wa Kiebrania kukihifadhiwa kwa kistari kirefu.
