  to: Na tazama, nimewapa watumishi wako, wakataji na waangushaji wa miti, kori[a] elfu ishirini za ngano iliyopondwa[b], kori elfu ishirini za shayiri, bathi[c] elfu ishirini za divai, na bathi elfu ishirini za mafuta.
