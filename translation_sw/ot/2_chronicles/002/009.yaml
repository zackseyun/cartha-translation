base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: sw
  text: Na tazama, nimewapa watumishi wako, wakataji na waangushaji wa miti, kori[a] elfu ishirini za ngano iliyopondwa[b], kori elfu ishirini za shayiri, bathi[c] elfu ishirini za divai, na bathi elfu ishirini za mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kori ni kipimo cha kale cha vitu vikavu.
    reason: cultural_note
  - marker: b
    text: Usemi wa Kiebrania si wa kawaida. Huenda pia ukamaanisha “ngano ya chakula” au “ngano iliyopigwa.”
    reason: lexical_alternative
  - marker: c
    text: Bathi ni kipimo cha kale cha vitu vya majimaji.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Huhifadhi kiunganishi pamoja na usemi wa kuelekeza fikira, huku ukibaki katika Kiswahili cha heshima kinachoeleweka.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: kwa ajili ya wakataji wa miti—watumishi wako wanaokata miti
  rationale: Huhifadhi semi mbili za Kiebrania zinazokaribiana kimaana na kuzifanya ziwe wazi na za kawaida katika Kiswahili; kirai cha pili kinabainisha wakataji hao.
- source_word: נָתַתִּי
  choice: nimetoa
  rationale: Kauli timilifu inaonyesha tendo au ahadi inayowasilishwa kuwa imekamilika; 'nimetoa' ni ya asili katika muktadha huu wa barua.
- source_word: חִטִּים מַכּוֹת
  choice: ngano iliyopondwa
  rationale: Neno מַכּוֹת ni gumu na huenda linamaanisha ngano iliyopigwa au kusindikwa. 'Iliyopondwa' huwasilisha maana hiyo bila kudai uhakika usiokuwapo; tanbihi huhifadhi utata.
- source_word: לַעֲבָדֶיךָ
  choice: watumishi wako
  rationale: Huhifadhi maana ya msingi ya עֲבָדִים, ingawa hapa watumishi hao wanafanya kazi ya kukata miti.
- source_word: כֹּרִים
  choice: kori
  rationale: Kipimo cha kale cha vitu vikavu kimetoholewa badala ya kubadilishwa kwa makadirio yasiyo na uhakika.
- source_word: בַּתִּים
  choice: bathi
  rationale: Kipimo cha kale cha vitu vya majimaji kimetoholewa ili kuhifadhi kipimo cha utamaduni wa chanzo.
- source_word: יַיִן
  choice: divai
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya יַיִן katika Kiswahili Sanifu.
- source_word: שֶׁמֶן
  choice: mafuta
  rationale: Kiebrania hakitaji wazi kuwa ni mafuta ya zeituni, kwa hiyo tafsiri haiongezi ubainisho huo.
- source_word: עֶשְׂרִים אֶלֶף
  choice: elfu ishirini
  rationale: Idadi imetafsiriwa moja kwa moja na kurudiwa kwa kila bidhaa kama katika chanzo.
