    issue: Uhusiano wa “watumishi wako” na wakataji umeelezwa kwa muundo usio sahihi kidogo.
    rationale: Katika Kiebrania, “watumishi wako” ni walengwa wale wale wanaotajwa kama wahunzi/wakataji wa miti. Muundo wa rasimu wenye deshi na “wanaokata” haufuati apposition hiyo kwa uwazi.
  - severity: low
    issue: Tafsiri haina tanbihi za vipimo vya kale kori na bathi.
    rationale: Vipimo hivi vimetoholewa na ni vigumu kwa msomaji wa kisasa; tanbihi fupi hulinda uwazi bila kubadilisha matini.
