source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: sw
  text: Lakini ni nani aliye na uwezo wa kumjengea nyumba, kwa kuwa mbingu, hata mbingu za juu kabisa[a], haziwezi kumtosha? Nami ni nani hata nimjengee nyumba, isipokuwa kufukiza uvumba mbele yake[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbingu na mbingu za mbingu,” usemi unaomaanisha mbingu zilizo juu kabisa.'
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza pia kumaanisha kufanya sadaka ipae kama moshi mbele yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: aliye na uwezo
  rationale: Nahau hii inauliza ni nani mwenye uwezo wa kutosha kutekeleza kazi hiyo. Kauli hii ni ya asili katika Kiswahili na inadumisha nguvu ya swali la balagha.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: kumjengea nyumba
  rationale: Neno בַיִת ni ‘nyumba.’ Tafsiri hii huhifadhi taswira ya Kiebrania bila kuingiza mapema neno la kifafanuzi ‘hekalu,’ ingawa muktadha unaonyesha kuwa nyumba hiyo ni hekalu.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: mbingu, hata mbingu za juu kabisa
  rationale: Muundo halisi ‘mbingu na mbingu za mbingu’ ni usemi wa Kiebrania unaosisitiza mbingu zilizo juu kuliko zote. ‘Hata’ huhifadhi msisitizo na mtiririko wa sehemu mbili.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: haziwezi kumtosha
  rationale: Katika muktadha huu kitenzi humaanisha kwamba hata mbingu hazina nafasi au uwezo wa kutosha kumweka Mungu ndani yake. ‘Kumtosha’ ni ya asili na huepuka wazo lisilokusudiwa la kumbeba.
- source_word: וּמִי אֲנִי
  choice: Nami ni nani
  rationale: Kauli hii huonyesha unyenyekevu wa msemaji mbele ya ukuu wa Mungu, huku kiunganishi kikidumisha mwendelezo wa hoja.
- source_word: אֲשֶׁר אֶבְנֶה לּוֹ בַיִת
  choice: hata nimjengee nyumba
  rationale: Baada ya swali ‘mimi ni nani,’ neno ‘hata’ huwasilisha kwa Kiswahili wazo la kutostahili au kutokuwa wa kutosha kwa kazi hiyo, si taarifa rahisi ya wakati ujao.
- source_word: כִּי אִם
  choice: isipokuwa tu kwa ajili ya
  rationale: 'Muundo huu unaweka kikomo kwa kusudi la nyumba: si kumweka Mungu ndani yake, bali kuwa mahali pa ibada mbele zake.'
- source_word: לְהַקְטִיר לְפָנָיו
  choice: kufukiza uvumba mbele zake
  rationale: Kitenzi הִקְטִיר huhusu kufanya kitu kipae kama moshi na hutumiwa katika ibada kwa uvumba au sadaka. Katika muktadha wa hekalu, ‘kufukiza uvumba’ ni tafsiri wazi, huku tanbihi ikihifadhi upana wa maana ya kitenzi.
theological_decisions:
- issue: Ukuu wa Mungu usiofungwa na mahali dhidi ya uhusiano wake na hekalu
  choice: Nyumba haionyeshwi kuwa inaweza kumweka Mungu ndani yake; kusudi lake limewekewa mpaka kuwa mahali pa ibada mbele zake.
  alternative: Kuisoma nyumba kuwa makao yanayomfungia Mungu ndani yake.
  rationale: 'Kauli kwamba hata mbingu za juu kabisa haziwezi kumtosha Mungu inadhibiti maana ya lugha kuhusu nyumba. Sehemu ya mwisho inadumisha mvutano wa kifungu: Mungu anaabudiwa katika uhusiano na nyumba hiyo bila kufungiwa humo.'
- issue: Maana ya tendo la הִקְטִיר
  choice: kufukiza uvumba
  alternative: kufanya sadaka itoe moshi mbele zake
  rationale: Muktadha wa ibada unaunga mkono uvumba, lakini kitenzi chenyewe kinaweza kutumiwa kwa mapana zaidi kuhusu sadaka inayoteketezwa na kutoa moshi; tanbihi inalinda uwezekano huo bila kuufanya mstari kuwa mzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mbele zake’ limetumiwa kwa mtindo wa heshima na kuhifadhi maana ya kiuhusiano na kimahali ya לְפָנָיו. Maswali mawili ya balagha na mpishano kati ya ukuu wa Mungu na kusudi la nyumba vimedumishwa.
