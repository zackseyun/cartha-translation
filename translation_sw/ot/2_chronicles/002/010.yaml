  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: sw
  text: 'Ndipo Huramu[a], mfalme wa Tiro, akajibu kwa barua aliyomtumia Sulemani[c]: “Kwa sababu Yahwe anawapenda watu wake[b], amekufanya uwe mfalme juu yao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Huramu; kwa mapokeo, Hiramu.'
    reason: alternative_reading
  - marker: b
    text: Au, “Kwa upendo wa Yahwe kwa watu wake.”
    reason: lexical_alternative
  - marker: c
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “akasema kwa barua, kisha akaituma kwa Sulemani.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akajibu
  rationale: Kitenzi kimsingi ni ‘akasema,’ lakini katika muktadha wa majibu ya Huramu kwa ujumbe wa Sulemani, ‘akajibu’ ni Kiswahili cha kawaida na sahihi kimuktadha.
- source_word: חוּרָם
  choice: Huramu
  rationale: Huwakilisha umbo la jina la Kiebrania חוּרָם; ‘Hiramu’ ni umbo la kimapokeo linalojulikana.
- source_word: מֶלֶךְ צֹר
  choice: mfalme wa Tiro
  rationale: Muundo huu wa Kiebrania unataja cheo cha Huramu na eneo alilotawala.
- source_word: בִּכְתָב
  choice: kwa barua
  rationale: Neno hilo linaweza kumaanisha ‘kwa maandishi,’ lakini hapa linarejelea hati iliyotumwa kwa Sulemani, kwa hiyo ‘kwa barua’ ni wazi na ya kawaida.
- source_word: וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: aliyomtumia Sulemani
  rationale: Uhusiano umewekwa katika kishazi tegemezi ili kuepuka uradidi usio wa kawaida kwa Kiswahili, huku vitendo vya kujibu na kutuma vikihifadhiwa.
- source_word: בְּאַהֲבַת
  choice: Kwa sababu ... anawapenda
  rationale: בְּ pamoja na nomino dhahania hapa inaweza kueleza sababu; muundo wa kitenzi ni wa asili katika Kiswahili na unaonyesha kuwa upendo wa Yahwe ndio sababu ya kumweka Sulemani kuwa mfalme.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo ‘BWANA.’
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Kiambishi cha umilikaji kinamrejelea Yahwe; ‘watu wake’ huhifadhi maana ya kawaida ya עם katika muktadha huu.
- source_word: נְתָנְךָ
  choice: amekufanya uwe
  rationale: Ingawa נתן kwa msingi ni ‘kutoa,’ pamoja na cheo cha kifalme hapa humaanisha kumweka au kumteua mtu kuwa mfalme.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: mfalme juu yao
  rationale: Huhifadhi wazi wazo la mamlaka ya kifalme juu ya watu bila kuongeza maelezo yasiyokuwamo katika chanzo.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko la Kiebrania linatumia Tetragramatoni yenyewe. ‘Yahwe’ huhifadhi jina binafsi badala ya kulibadilisha na cheo, bila kuingiza msimamo wa dhehebu.
- issue: Sababu ya uteuzi wa Sulemani
  choice: Kwa sababu Yahwe anawapenda watu wake
  alternative: Kwa upendo wa Yahwe kwa watu wake
  rationale: Muundo wa בְּאַהֲבַת unaweza kueleweka kwa maana ya sababu. Tafsiri kuu inaonyesha uhusiano huo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi namna mbadala ya kuunda kauli bila kupanua dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na hadhi inayofaa maandiko. ‘Ndipo’ huendeleza mfuatano wa simulizi; ‘akajibu kwa barua aliyomtumia’ huepuka uradidi mgumu huku ikihifadhi matendo yote mawili ya chanzo. Alama zote za tanbihi zimewekwa karibu na maneno au vishazi vinavyohusika.
