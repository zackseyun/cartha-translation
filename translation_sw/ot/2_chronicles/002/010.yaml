  terminology: “Huramu,” “Tiro,” “Yahwe,” “watu wake,” na “mfalme juu yao” vinaendana na chanzo na maamuzi ya istilahi ya mradi. Tanbihi ya Hiramu inahifadhi umbo la kimapokeo, na tanbihi ya “Kwa upendo wa Yahwe...” huhifadhi uwezekano wa muundo mbadala wa usemi.
