  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: sw
  text: Tazama, ninajenga nyumba[a] kwa ajili ya jina la Yahwe Mungu wangu, ili niiweke wakfu kwake, nifukize uvumba wenye harufu nzuri mbele zake, niweke daima mikate kwa mpangilio[b], na nitoe sadaka za kuteketezwa asubuhi na jioni, siku za Sabato, siku za mwandamo wa mwezi, na sikukuu zilizowekwa za Yahwe Mungu wetu. Hili ni wajibu wa kudumu kwa Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba” hapa ni hekalu; Kiebrania kinasema kihalisi “nyumba kwa ajili ya jina la Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “mpangilio wa daima.” Katika ibada ya hekalu, maana yake ni mikate iliyowekwa kwa mpangilio daima mbele za Yahwe.
    reason: source_clarification
  - marker: c
    text: Kiebrania kinasema kihalisi, “Hili ni juu ya Israeli milele,” yaani, ni wajibu wa kudumu kwa Israeli.
    reason: source_clarification
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha hotuba kinachovuta fikira kwenye tangazo la kifalme; “Tazama” lina hadhi na ni la kawaida katika Kiswahili sanifu.
- source_word: בּוֹנֶה
  choice: ninajenga
  rationale: Kitenzi kishirikishi cha Kiebrania kinaonyesha tendo linaloendelea au lililo karibu kuanza; “ninajenga” kinahifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: בַּיִת
  choice: nyumba
  rationale: Neno la Kiebrania humaanisha kihalisi “nyumba.” Katika muktadha ni hekalu, lakini “nyumba” huhifadhi usemi muhimu “nyumba kwa ajili ya jina la Yahwe.”
- source_word: לְשֵׁם
  choice: kwa ajili ya jina
  rationale: Huhifadhi kwa uwazi nahau ya Kiebrania inayohusisha jina, uwepo na heshima ya Yahwe bila kuifasiri kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina binafsi la Mungu katika herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: לְהַקְדִּישׁ לוֹ
  choice: ili niiweke wakfu kwake
  rationale: Hiphil ya קדשׁ hapa ni kutenga kitu kiwe kitakatifu kwa matumizi ya Mungu; “kuweka wakfu” ni Kiswahili cha asili katika muktadha huu.
- source_word: קְטֹרֶת סַמִּים
  choice: uvumba wenye harufu nzuri
  rationale: Kirai kinataja uvumba maalumu uliotengenezwa kwa manukato; tafsiri hii ni wazi na hudumisha maana ya ibada na harufu.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: niweke daima mikate kwa mpangilio
  rationale: Kihalisi ni “mpangilio wa daima”; muktadha wa ibada unaonyesha mikate iliyopangwa mbele za Yahwe. Kutaja mikate hufanya desturi hiyo ieleweke bila kutumia istilahi ya kale isiyo ya kawaida.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Hii ni istilahi ya kawaida ya dhabihu iliyoteketezwa kabisa kwa moto.
- source_word: לַבֹּקֶר וְלָעֶרֶב
  choice: asubuhi na jioni
  rationale: Huhifadhi kwa ufupi na kwa kawaida mzunguko wa kila siku wa sadaka.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: Hili ni wajibu wa kudumu kwa Israeli
  rationale: Kirai cha Kiebrania, kihalisi “hili ni juu ya Israeli milele,” kinaonyesha jukumu linaloendelea kuwahusu Israeli; Kiswahili hiki huwasilisha maana hiyo kwa uwazi.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia “Yahwe” huhifadhi jina la agano kama jina binafsi badala ya kulibadilisha kwa cheo.
- issue: Kutafsiri בַּיִת kuwa “nyumba” au “hekalu”
  choice: nyumba
  alternative: hekalu
  rationale: “Nyumba” ndilo neno la moja kwa moja la Kiebrania na huhifadhi usemi wenye uzito wa kiteolojia “nyumba kwa ajili ya jina la Yahwe”; tanbihi inaeleza kwamba hapa ni hekalu.
- issue: Kiwango cha kuweka wazi מַעֲרֶכֶת תָּמִיד
  choice: niweke daima mikate kwa mpangilio
  alternative: niweke mpangilio wa daima
  rationale: Kiebrania hakitaji mikate waziwazi katika mstari huu, lakini istilahi ya ibada inairejelea. Kutaja mikate huleta uwazi, huku tanbihi ikihifadhi umbo halisi na utata wa chanzo.
- issue: Maana ya tamko la mwisho kuhusu Israeli
  choice: wajibu wa kudumu kwa Israeli
  alternative: hili ni juu ya Israeli milele
  rationale: Tafsiri iliyochaguliwa inaeleza kwa Kiswahili cha asili kwamba ibada hizo ni jukumu la kudumu, bila kuamua maswali mapana ya kiteolojia kuhusu utekelezaji wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya matamko ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za ibada zimetafsiriwa kwa maneno ya sasa; nahau muhimu “kwa ajili ya jina” imehifadhiwa, na maelezo yanayohitajika yamewekwa katika tanbihi.
