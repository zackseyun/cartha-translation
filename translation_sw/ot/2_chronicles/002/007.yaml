  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: ombi la kutumwa mbao kutoka Lebanoni, aina tatu za miti/mbao, sababu inayohusu ustadi wa watumishi wa mpokeaji katika kukata miti ya Lebanoni, na mpango wa watumishi wa mwombaji kuwa pamoja nao. Wakati ujao katika “watakuwa” unaeleweka vizuri kwa kishazi cha nomino kisicho na kitenzi wazi katika Kiebrania.'
