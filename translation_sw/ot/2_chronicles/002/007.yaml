  edition: WLC
  text: וּֽ/שְׁלַֽח לִ/י֩ עֲצֵ֨י אֲרָזִ֜ים בְּרוֹשִׁ֣ים וְ/אַלְגּוּמִּים֮ מֵֽ/הַ/לְּבָנוֹן֒ כִּ֚י אֲנִ֣י יָדַ֔עְתִּי אֲשֶׁ֤ר עֲבָדֶ֨י/ךָ֙ יֽוֹדְעִ֔ים לִ/כְר֖וֹת עֲצֵ֣י לְבָנ֑וֹן וְ/הִנֵּ֥ה עֲבָדַ֖/י עִם עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: sw
  text: Nitumie kutoka Lebanoni mbao za mierezi, miberoshi[a] na algum[b], kwa maana ninajua kwamba watumishi wako wanajua kukata miti ya Lebanoni. Na tazama, watumishi wangu watakuwa pamoja na watumishi wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mijunipa” au “mifiri”; aina kamili ya mti unaoitwa beroshim kwa Kiebrania haijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: “Algum” pia huitwa “almug”; wengine hudhani ni msandali, lakini aina yake haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: Nitumie
  rationale: Kauli ya kuamuru pamoja na kiwakilishi cha yambwa inaelezwa kwa Kiswahili cha kawaida bila kuongeza neno la wakati lisilopo katika Kiebrania.
- source_word: עֲצֵי אֲרָזִים
  choice: mbao za mierezi
  rationale: Katika muktadha wa vifaa vya ujenzi, neno עֵץ linamaanisha mbao; 'mierezi' hutambulisha aina ya miti.
- source_word: בְּרוֹשִׁים
  choice: miberoshi
  rationale: Hili ni jina linalotumiwa kwa cypress katika Kiswahili; kwa kuwa aina hususa ya mti wa Kiebrania haijulikani kwa uhakika, uwezekano mwingine umewekwa katika tanbihi.
- source_word: אַלְגּוּמִּים
  choice: algum
  rationale: Jina limenukuliwa kwa sauti badala ya kulazimisha utambulisho wa kibotania usio na uhakika.
- source_word: מֵהַלְּבָנוֹן
  choice: kutoka Lebanoni
  rationale: Hutafsiri wazi asili ya mbao kwa mtindo wa kawaida wa Kiswahili.
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: kwa maana ninajua
  rationale: Kauli timilifu ya Kiebrania inaeleza ujuzi uliopo; wakati wa sasa ni wa kawaida katika Kiswahili.
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: kwamba watumishi wako wanajua kukata
  rationale: Muundo huu huhifadhi maana ya kuwa na ujuzi wa kufanya kazi iliyotajwa.
- source_word: עֲצֵי לְבָנוֹן
  choice: miti ya Lebanoni
  rationale: Hapa kitenzi cha kukata kinaelekeza kwa miti iliyosimama; tafsiri hii ni ya asili na karibu na muundo wa Kiebrania.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Huhifadhi kishirikishi kinachovuta fikira kwa mtindo wenye hadhi lakini unaoeleweka.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: watumishi wangu watakuwa pamoja na watumishi wako
  rationale: Kiebrania hakina kitenzi wazi; wakati ujao unafaa kwa mpango unaopendekezwa katika ombi hili.
