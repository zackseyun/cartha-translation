translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa msomaji, huku 'Na tazama' ukihifadhi nguvu ya הנה na tanbihi zikihifadhi kutokuwa na uhakika kwa majina ya miti.
