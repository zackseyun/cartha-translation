reference: 2 Chronicles 2:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: sw
  text: mwana wa mwanamke mmoja wa miongoni mwa binti za Dani[a], na baba yake alikuwa mtu wa Tiro. Ana ustadi wa kufanya kazi kwa dhahabu, fedha, shaba, chuma, mawe na miti, na kwa vitambaa vya zambarau na buluu, kitani safi, na kitambaa chekundu[b]. Anaweza kuchonga nakshi za kila aina na kubuni muundo wowote atakaopewa, akifanya kazi pamoja na mafundi wako stadi na mafundi stadi wa bwana wangu Daudi, baba yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi “binti za Dani” huenda unamaanisha kwamba mama yake alikuwa wa kabila la Dani.
    reason: cultural_note
  - marker: b
    text: Au “kitambaa chekundu kilichokolea,” au “kitambaa cha rangi nyekundu angavu.” Rangi halisi ya neno la Kiebrania haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: mwana wa mwanamke miongoni mwa binti za Dani
  rationale: Inahifadhi kwa uwazi maelezo ya ukoo wa upande wa mama na usemi halisi ‘binti za Dani,’ bila kuubadili moja kwa moja kuwa ‘kabila la Dani.’
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: na baba yake alikuwa mtu wa Tiro
  rationale: צֹרִי humtaja mtu anayetoka Tiro; ‘mtu wa Tiro’ ni Kiswahili cha kawaida na chenye kueleweka.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: Ana ustadi wa kufanya kazi
  rationale: Usemi huu unaonyesha umahiri wa kiufundi, si kujua kwa akili tu.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל
  choice: kwa dhahabu, fedha, shaba, chuma
  rationale: ‘Kwa’ hutaja vifaa alivyoweza kutumia katika kazi yake; נְחֹשֶׁת hapa imetafsiriwa ‘shaba,’ neno la kawaida la Kiswahili kwa metali hii katika orodha ya kale.
- source_word: בָּאֲבָנִים וּבָעֵצִים
  choice: mawe na miti
  rationale: Wingi wa Kiebrania umehifadhiwa, na muktadha unaonyesha kuwa hivi ni vifaa vya ufundi.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: kitambaa cha zambarau, cha buluu, kitani safi na kitambaa chekundu
  rationale: Majina ya rangi yamewasilishwa kama vitambaa vilivyotiwa rangi, kama muktadha wa ufundi unavyodokeza; בּוּץ ni kitani bora au safi.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: kuchonga mchongo wa kila aina
  rationale: Muundo wa kitenzi na nomino zenye mzizi mmoja umehifadhiwa ili kuonyesha kazi ya uchongaji.
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: kubuni muundo wowote
  rationale: Katika muktadha wa ufundi, חשׁב humaanisha kupanga au kubuni kazi ya kisanaa, si kuwaza tu.
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: atakaopewa
  rationale: Kauli tendwa ya Kiebrania imehifadhiwa bila kubainisha zaidi ikiwa kinachopewa ni muundo au jukumu.
theological_decisions:
- issue: Utambulisho wa ukoo wa mama kwa usemi ‘binti za Dani’
  choice: miongoni mwa binti za Dani
  alternative: wa kabila la Dani
  rationale: Tafsiri kuu inahifadhi namna ya usemi wa Kiebrania, huku tanbihi ikieleza maana yake inayowezekana bila kuifanya kuwa ya pekee.
- issue: Rejeo la mafundi katika wingi wa kiume
  choice: mafundi wako stadi
  alternative: wafanyakazi wako stadi
  rationale: ‘Mafundi’ linafaa kwa muktadha wa kazi za ustadi na haliongezi dai lisilokuwamo katika chanzo.
- issue: Heshima ya kibinadamu אֲדֹנִי
  choice: bwana wangu Daudi
  alternative: mkuu wangu Daudi
  rationale: Hapa ni namna ya heshima kwa Daudi, si jina la Mungu; ‘bwana wangu’ huhifadhi lugha ya heshima ya kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kiebrania imegawanywa kwa kiasi ili orodha ya stadi isomeke vizuri. ‘Tiro,’ ‘Dani,’ na ‘Daudi’ zinafuata maumbo yaliyozoeleka katika Kiswahili cha Biblia.
