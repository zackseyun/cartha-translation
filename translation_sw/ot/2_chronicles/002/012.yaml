  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: sw
  text: Na sasa nimemtuma mtu mwenye hekima, aliye na ufahamu, yaani Huramu-abi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Huramu-abi. Neno la mwisho kwa maana halisi ni “baba yangu,” lakini hapa huenda ni cheo cha heshima au sehemu ya jina la fundi; linganisha pia “Huramu baba yake” katika 2 Mambo ya Nyakati 4:16.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi na kielezi cha wakati vinavyoendeleza mtiririko wa jibu la mfalme.
- source_word: שָׁלַחְתִּי
  choice: nimemtuma
  rationale: Kauli timilifu ya Kiebrania imetafsiriwa kwa wakati timilifu wa Kiswahili, ikionyesha tendo lililokamilika lenye umuhimu wa sasa.
- source_word: אִישׁ חָכָם
  choice: mtu mwenye hekima
  rationale: Huhifadhi maana ya msingi ya חָכָם huku muktadha wa ufundi na kishazi kinachofuata vikidokeza ustadi wa vitendo.
- source_word: יוֹדֵעַ בִּינָה
  choice: aliye na ufahamu
  rationale: Ni Kiswahili cha asili kinachowasilisha uwezo wa kuelewa na kutumia maarifa, bila kulazimisha maana ya kiufundi pekee.
- source_word: לְחוּרָם אָבִי
  choice: yaani Huramu-abi
  rationale: Muundo wa Kiebrania ni mgumu; hapa unaelekea kuwa jina au cheo cha fundi. Uhawilishaji huhifadhi utata wa אָבִי badala ya kulazimisha uhusiano wa kifamilia.
theological_decisions:
- issue: Maana ya אָבִי katika לְחוּרָם אָבִי
  choice: 'Kutafsiri kama sehemu ya jina au cheo: “Huramu-abi”'
  alternative: “Huramu baba yangu” au “Huramu, fundi wangu mkuu”
  rationale: Neno “baba” linaweza kutumiwa kama cheo cha heshima kwa mkuu, mshauri, au stadi, wala si lazima lionyeshe undugu wa damu. Uhawilishaji huhifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtu mwenye hekima” ni rahisi kueleweka; “yaani” linaunganisha kwa uwazi jina/cheo na mtu aliyetumwa. Alama ya tanbihi [a] imewekwa mara moja baada ya jina linalohusika.
