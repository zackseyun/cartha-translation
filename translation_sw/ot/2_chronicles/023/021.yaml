  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: sw
  text: Watu wote wa nchi wakafurahi, na mji ukatulia. Nao wakamuua Athalia kwa upanga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana walikuwa wamemuua Athalia kwa upanga.” Kiunganishi cha Kiebrania kinaweza kueleweka kuwa kinaeleza sababu ya mji kutulia, ingawa pia kinaweza kuwa kiunganishi cha kawaida cha kuendeleza simulizi.
    reason: discourse_ambiguity
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: wakafurahi
  rationale: Kitenzi שׂמח kinaeleza furaha; umbo la simulizi “wakafurahi” linaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida.
- source_word: כָל עַם הָאָרֶץ
  choice: watu wote wa nchi
  rationale: Huhifadhi maana ya umma wa nchi bila kuifanya “nchi” kuwa jina maalumu au kuibadili kuwa rejeo finyu zaidi.
- source_word: וְהָעִיר שָׁקָטָה
  choice: na mji ukatulia
  rationale: שׁקט huonyesha hali ya utulivu baada ya vurugu. “Ukatulia” ni ya asili katika simulizi na haisisitizi kwa lazima amani ya kisiasa.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ
  choice: Nao wakamuua Athalia
  rationale: Hiphil ya מות hapa humaanisha kusababisha afe, yaani kumuua. “Nao” huhifadhi kiunganishi cha Kiebrania na mabadiliko ya kishazi bila kulazimisha uhusiano wa sababu.
- source_word: בֶחָרֶב
  choice: kwa upanga
  rationale: Kiambishi ב kinatumika kueleza chombo; “kwa upanga” ni Kiswahili cha kawaida na huhifadhi njia iliyotumiwa kumuua.
