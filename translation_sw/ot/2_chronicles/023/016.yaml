base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: sw
  text: Ndipo Yehoyada akafanya agano[a] kati ya Yehoyada, watu wote, na mfalme, ili wawe watu wa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “alikata agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת בְּרִית
  choice: akafanya agano
  rationale: Nahau ya Kiebrania ina maana ya kufanya au kuanzisha agano rasmi. Kiswahili cha kawaida husema “kufanya agano,” huku maana halisi ya “kukata agano” ikiwekwa katika tanbihi.
- source_word: בֵּינוֹ וּבֵין כָּל־הָעָם וּבֵין הַמֶּלֶךְ
  choice: kati yake na watu wote na mfalme
  rationale: Muundo huu unahifadhi orodha ya wahusika watatu waliotajwa katika Kiebrania—Yehoyada, watu wote, na mfalme—bila kumwingiza Yahwe kimyakimya kama mhusika aliyetajwa moja kwa moja katika agano.
- source_word: לִהְיוֹת לְעָם
  choice: ili wawe watu
  rationale: Infinitivu inaonyesha kusudi la agano. “Ili wawe watu” ni ya asili katika Kiswahili na inadumisha lugha ya uhusiano wa agano.
- source_word: לַיהוָה
  choice: wa Yahwe
  rationale: Kihusishi ל kinaonyesha kuwa watu hao ni wa Yahwe na wamefungamana naye. Jina la Mungu יהוה limetolewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina, kwa umbo linalofaa matamshi na tahajia ya Kiswahili.
- issue: Wahusika wa agano na kusudi lake
  choice: Yehoyada, watu wote, na mfalme wanatajwa katika agano; kusudi ni wawe watu wa Yahwe
  alternative: Yahwe achukuliwe kuwa mmoja wa wahusika waliotajwa moja kwa moja katika agano
  rationale: Kiebrania kinataja “kati yake,” “watu wote,” na “mfalme.” Yahwe anatajwa katika kishazi cha kusudi kama yule ambaye watu hao ni wake, si waziwazi kama mmoja wa wahusika waliotanguliwa na “kati ya.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Ndipo” linaendeleza mfuatano wa simulizi, na “agano” linahifadhi uzito wa kidini na rasmi wa בְּרִית.
