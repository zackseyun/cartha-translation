base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: sw
  text: Ndipo watu wote wakaenda kwenye hekalu la Baali, wakalibomoa. Wakavunja madhabahu zake na sanamu zake, wakamuua Matani, kuhani wa Baali, mbele ya madhabahu hizo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: hekalu la Baali
  rationale: Ingawa neno la msingi ni ‘nyumba’, katika muktadha huu linamaanisha jengo la ibada la Baali; ‘hekalu’ ni Kiswahili cha kawaida na wazi.
- source_word: וַיִּתְּצֻהוּ
  choice: wakalibomoa
  rationale: Kitenzi kinaonyesha kulivunja au kulibomoa jengo; kiambishi ‘-li-’ kinarejelea hekalu.
- source_word: צְלָמָיו
  choice: sanamu zake
  rationale: Neno linamaanisha mifano au sanamu za ibada; ‘sanamu’ ni usemi wa kawaida unaofaa muktadha.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: mbele ya madhabahu hizo
  rationale: Tafsiri ya moja kwa moja ya nafasi; ‘hizo’ huonyesha madhabahu za Baali zilizotajwa tayari bila kudokeza umiliki usio wazi zaidi ya maandishi.
theological_decisions:
- issue: Kirejeleo cha viambishi vya umiliki katika ‘madhabahu zake na sanamu zake’
  choice: Vimehifadhiwa kama vinavyomrejelea Baali.
  alternative: ‘madhabahu na sanamu zilizokuwa humo’
  rationale: Viambishi vya Kiebrania ni vya nafsi ya tatu umoja wa kiume na kwa kawaida vinamrejelea Baali; hakuna sababu ya kufuta uhusiano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi umehifadhi kasi ya simulizi la Kiebrania.
