base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: sw
  text: 'Katika mwaka wa saba, Yehoyada akajitia nguvu, akawashirikisha majemadari wa vikosi vya askari mia moja katika agano naye[a]: Azaria mwana wa Yerohamu, Ishmaeli mwana wa Yehohanani, Azaria mwana wa Obedi, Maaseya mwana wa Adaya, na Elishafati mwana wa Zikri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafanya agano nao.” Kiebrania kinasema kihalisi, “akawachukua ... pamoja naye katika agano,” kikionyesha kwamba Yehoyada aliwaingiza majemadari hao katika mapatano ya kiagano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: Katika mwaka wa saba
  rationale: Kirai hiki kinataja wakati wa tukio. Kiunganishi וּ hakikutafsiriwa kwa neno tofauti kwa sababu mtiririko wa Kiswahili hauhitaji “na” mwanzoni mwa sentensi hii.
- source_word: הִתְחַזַּק
  choice: akajitia nguvu
  rationale: 'Huhifadhi maana ya kujirejelea ya umbo la Kiebrania: Yehoyada alijiimarisha au alijipa moyo kwa hatua hii ya uamuzi.'
- source_word: וַיִּקַּח ... עִמּוֹ בַבְּרִית
  choice: akawashirikisha katika agano naye
  rationale: Kitenzi וַיִּקַּח kimsingi ni “akachukua,” lakini pamoja na kirai cha agano kinaonyesha kuwa aliwaingiza au aliwashirikisha maofisa hao katika mapatano ya kiagano. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi muundo halisi na uwezekano mwingine.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: majemadari wa vikosi vya askari mia moja
  rationale: Ni cheo cha kijeshi cha viongozi wa vitengo vya watu mia moja. Ufafanuzi huu unaeleweka kwa msomaji wa kawaida kuliko “wakuu wa mamia” na huepuka istilahi yenye uhusiano maalumu na jeshi la Roma.
- source_word: בֶן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida wa Kiswahili wa kutaja mtu kwa jina la baba yake.
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: Azaria ... Ishmaeli ... Azaria ... Maaseya ... na Elishafati
  rationale: Majina yametoholewa kwa tahajia inayosomeka kiasili katika Kiswahili, na kurudiwa kwa jina Azaria kumehifadhiwa kama lilivyo katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi kwa “aka-” unafaa usimulizi wa kihistoria, na cheo cha kijeshi kimeelezwa kwa uwazi badala ya kutumia istilahi ya kale isiyoeleweka kwa urahisi.
