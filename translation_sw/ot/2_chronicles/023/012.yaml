  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: sw
  text: Athalia aliposikia kelele za watu waliokuwa wakikimbia na kumsifu mfalme, akaja kwa watu katika nyumba ya BWANA.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֹול
  choice: kelele
  rationale: Katika muktadha huu neno linaashiria sauti kubwa ya umati, si sauti ya mtu mmoja; “kelele” ni ya kawaida na inafaa kwa tukio hilo.
- source_word: הָרָצִים
  choice: waliokuwa wakikimbia
  rationale: Huhifadhi maana ya kisarufi ya tendo linaloendelea la watu kukimbia.
- source_word: מְהַלְלִים
  choice: kumsifu
  rationale: Hutoa maana ya kuwapa sifa au kushangilia kwa maneno, huku yule anayelengwa akiwa mfalme.
- source_word: בֵּית יְהוָה
  choice: nyumba ya BWANA
  rationale: Ni usemi wa kawaida wa Biblia ya Kiswahili kwa hekalu la YHWH na unaendana na namna jina la Mungu linavyowakilishwa hapa.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni uwakilishi uliozoeleka katika Biblia za Kiswahili na unalingana na safu ya ushauri ya POB; hakuna hoja ya kiteolojia inayoongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo “akaingia kwa watu” umehifadhi mwendo wa Athalia kwenda mahali umati ulipokuwa ndani ya eneo la nyumba ya BWANA.
