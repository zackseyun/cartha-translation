source:
  edition: WLC
  text: וַ/יּוֹצֵא֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י הַ/מֵּא֣וֹת פְּקוּדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ הֽוֹצִיא֨וּ/הָ֙ אֶל מִ/בֵּ֣ית הַ/שְּׂדֵר֔וֹת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ יוּמַ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן לֹ֥א תְמִית֖וּ/הָ בֵּ֥ית יְהוָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: sw
  text: Kisha Yehoyada, kuhani, akawatoa wakuu wa mamia walioteuliwa kusimamia jeshi, akawaambia, “Mtoeni nje kati ya safu[a], na yeyote atakayemfuata auawe kwa upanga.” Kwa maana kuhani alikuwa amesema, “Msimuue ndani ya nyumba ya Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoeni mpaka nje ya safu.” Kirai cha Kiebrania ni kigumu; huenda kinamaanisha kumtoa Athalia kupitia au kati ya safu zilizopangwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: akawatoa
  rationale: Hifili ya יצא ina maana ya kusababisha watoke au kuwatoa; hapa wahusika ni wakuu wa mamia ambao Yehoyada aliwatoa ili awape amri.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: wakuu wa mamia
  rationale: Hili ni cheo cha kijeshi kinachoonyesha viongozi wa vikosi vya watu mia, bila kuingiza dhana ya cheo cha Kirumi.
- source_word: פְּקוּדֵי הַחַיִל
  choice: waliowekwa kulisimamia jeshi
  rationale: Kirai kinaonyesha watu walioteuliwa au kukabidhiwa wajibu kuhusiana na jeshi; tafsiri hii inaeleza jukumu lao kwa Kiswahili cha kawaida.
- source_word: הוֹצִיאוּהָ
  choice: Mtoeni nje
  rationale: Ni amri ya wingi yenye kiambishi cha nafsi ya tatu ya kike, ikimrejelea Athalia.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: kupitia katikati ya safu
  rationale: Kirai cha Kiebrania ni kigumu, lakini katika mazingira haya huenda שְּׂדֵרוֹת ni safu zilizopangwa. Tanbihi inahifadhi uwezekano mwingine.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: na yeyote atakayemfuata
  rationale: Kitenzi-jina pamoja na אַחֲרֶיהָ kinaeleza mtu anayekuja au kufuata nyuma yake, huenda akiwa mfuasi wake.
- source_word: יוּמַת בֶּחָרֶב
  choice: auawe kwa upanga
  rationale: Umbo la kutendwa lina nguvu ya amri katika muktadha; ‘auawe kwa upanga’ ni la moja kwa moja na linadumisha uzito wa hukumu.
- source_word: לֹא תְמִיתוּהָ
  choice: Msimuue
  rationale: Hifili ya מות hapa ni kusababisha afe, yaani kumuua; Kiswahili hiki ni cha asili na kinaendeleza amri ya wingi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: ‘Nyumba’ inadumisha sitiari ya kawaida ya Kiebrania kwa hekalu, huku jina la agano יהוה likitafsiriwa kwa jina lake.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina maalumu la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Mahali pa kumuua Athalia
  choice: Msimuue ndani ya nyumba ya Yahwe
  alternative: Msimuue hekaluni mwa Yahwe
  rationale: Tafsiri ya ‘nyumba ya Yahwe’ inadumisha maneno ya chanzo na amri kwamba mauaji yasifanyike katika eneo hilo takatifu, bila kueleza zaidi sababu ambayo mstari hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa amri ni mfupi na mzito; utata wa kirai kinachohusu safu umehifadhiwa kwa tanbihi.
