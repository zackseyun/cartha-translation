base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: sw
  text: Kisha kusanyiko lote likafanya agano na mfalme katika nyumba ya Mungu. Naye akawaambia, “Tazama, mwana wa mfalme atatawala, kama vile BWANA alivyosema kuhusu wana wa Daudi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָהָל
  choice: kusanyiko
  rationale: Neno hili humaanisha jamii iliyokusanyika; “kusanyiko lote” ni Kiswahili cha kawaida na kinachofaa kwa muktadha huu.
- source_word: כרת ברית
  choice: likafanya agano
  rationale: Ingawa kitenzi כרת kihalisi ni “kukata,” msemo mzima ni nahau ya Kiebrania yenye maana ya kufanya au kuingia katika agano.
- source_word: בבית האלהים
  choice: katika nyumba ya Mungu
  rationale: Huhifadhi taswira ya chanzo na kurejelea hekalu bila kulibadilisha kimyakimya kuwa neno jingine.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Hutoa msisitizo wa kuelekeza uangalifu unaopatikana katika Kiebrania huku ikidumisha sajili yenye heshima.
- source_word: יִמְלֹךְ
  choice: atatawala
  rationale: Huwasilisha kwa kawaida maana ya kutawala akiwa mfalme; muktadha tayari unamtambulisha kama mwana wa mfalme.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano kwa herufi kubwa.
- source_word: עַל בְּנֵי דָוִיד
  choice: kuhusu wana wa Daudi
  rationale: Kihusishi עַל hapa kina maana ya “kuhusu,” na wingi “wana” umehifadhiwa.
theological_decisions:
- issue: Mhusika wa kitenzi “akawaambia”
  choice: Yehoyada akawaambia
  alternative: naye akawaambia
  rationale: Kiebrania kina kiwakilishi kilichofichika katika kitenzi, lakini muktadha wa 23:1–3 humtambulisha Yehoyada kuwa msemaji. Kutaja jina kunazuia “mfalme” aliyeko karibu zaidi kisarufi kudhaniwa kuwa msemaji, bila kubadili maana ya muktadha.
- issue: Kauli kuhusu mwana wa mfalme
  choice: mwana wa mfalme atatawala
  alternative: mwana wa mfalme na atawale
  rationale: Umbo ימלך linaweza kusomwa kama kauli ya wakati ujao au kauli ya amri/nia kulingana na muktadha. Kauli ya wakati ujao inafaa kwa uthibitisho unaofuata wa ahadi ya BWANA, lakini haiongezi maelezo ya namna ya kutawazwa.
- issue: Ahadi kwa ukoo wa Daudi
  choice: kama vile BWANA alivyosema kuhusu wana wa Daudi
  alternative: kama BWANA alivyosema juu ya wazao wa Daudi
  rationale: Huhifadhi wingi wa Kiebrania “wana” na kutaja ahadi bila kuifafanua kwa mfumo maalumu wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Sentensi imegawanywa mara mbili ili iwe wazi kwa msomaji wa kawaida; “nyumba ya Mungu” na “Tazama” zimehifadhi sajili ya kibiblia bila kuwa ngumu.
