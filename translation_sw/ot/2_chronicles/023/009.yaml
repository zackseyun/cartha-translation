base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: sw
  text: Kisha kuhani Yehoyada akawapa makamanda wa vikosi vya askari mia moja[a] mikuki, ngao, na ngao kubwa[b] zilizokuwa mali ya Mfalme Daudi na zilizokuwa katika nyumba ya Mungu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wakuu wa mamia,” yaani maofisa wa kijeshi waliokuwa juu ya vikosi vya askari mia moja.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatofautisha kati ya “ngao” na kifaa kingine cha kujikinga ambacho hapa kimetafsiriwa “ngao kubwa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “hekalu la Mungu.” Kihalisi, “nyumba ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akawapa
  rationale: Kitenzi נתן hapa kinaonyesha kukabidhi vitu; “akawapa” ni cha kawaida katika masimulizi na kinaonyesha wapokeaji kwa uwazi.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: kuhani Yehoyada
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa Kiswahili, na cheo chake kimetangulizwa kwa mtiririko wa asili wa Kiswahili.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: makamanda wa vikosi vya askari mia moja
  rationale: Kirai cha Kiebrania kinawahusu maofisa waliokuwa juu ya makundi ya askari mia moja. Tafsiri hii ni wazi kwa msomaji wa sasa bila kuleta dhana ya cheo cha kijeshi cha Kirumi.
- source_word: הַחֲנִיתִים
  choice: mikuki
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa silaha hii katika Kiswahili.
- source_word: הַמָּגִנּוֹת
  choice: ngao
  rationale: מגן ni neno la jumla la ngao; tafsiri hii ni ya kawaida na ya sasa.
- source_word: הַשְּׁלָטִים
  choice: ngao kubwa
  rationale: Neno hili linataja kifaa kingine cha kujikinga, tofauti na מגנים, na huenda lilimaanisha aina kubwa ya ngao. “Ngao kubwa” inadumisha utofauti huo bila kudai umbo lisilo hakika.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: zilizokuwa mali ya Mfalme Daudi
  rationale: Kirai hiki kinaonyesha umiliki; “zilizokuwa mali ya” ni wazi na hakiongezi lazima wazo la wakati lililo katika kauli ya wakati uliotimilika.
- source_word: אֲשֶׁר בֵּית הָאֱלֹהִים
  choice: na kuhifadhiwa katika nyumba ya Mungu
  rationale: Kiebrania ni kifupi, kihalisi “ambazo [zilikuwa] katika nyumba ya Mungu.” “Kuhifadhiwa” huonyesha kwa kawaida mahali silaha hizo zilipokuwapo, huku tanbihi ikihifadhi usemi halisi.
theological_decisions:
- issue: Maana ya בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  alternative: hekalu la Mungu
  rationale: “Nyumba ya Mungu” inafuata kwa karibu usemi wa Mwandishi wa Mambo ya Nyakati, ingawa katika muktadha huu inamaanisha hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umerahisishwa kiasi ili kuepuka mfululizo mzito wa vishazi rejeshi, huku taarifa zote za Kiebrania zikihifadhiwa.
