  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: sw
  text: Walawi watamzunguka mfalme pande zote, kila mmoja akiwa na silaha zake mkononi; na yeyote atakayeingia ndani ya nyumba[a] atauawa. Mwe pamoja na mfalme anapoingia na anapotoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu”; kwa Kiebrania ni “nyumba,” jina linalotumiwa mara nyingi kumaanisha hekalu katika Mambo ya Nyakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת הַמֶּלֶךְ סָבִיב
  choice: Walawi watamzunguka mfalme pande zote
  rationale: Kauli ya maagizo ya Kiebrania imetafsiriwa kwa wakati ujao wenye nguvu ya amri; “pande zote” inahifadhi wazo la kumzunguka kikamilifu.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: kila mmoja akiwa na silaha zake mkononi
  rationale: אִישׁ ina maana ya kugawa kwa kila mtu, na כֵלָיו katika muktadha huu wa ulinzi wa kijeshi ni silaha, si vyombo vya kawaida.
- source_word: וְהַבָּא אֶל הַבַּיִת
  choice: na yeyote atakayeingia ndani ya nyumba
  rationale: Kivumishi-tendo chenye kiambishi bainishi kina maana ya jumla, “yeyote”; בַּיִת imehifadhiwa kama “nyumba” huku maana ya hekalu ikielezwa katika tanbihi.
- source_word: יוּמָת
  choice: atauawa
  rationale: Umbo la Hofali linaonyesha kusababishwa kuuawa kwa mhusika, si kufa tu.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Kaeni pamoja na mfalme
  rationale: Amri ya wingi pamoja na אֶת inaonyesha kuwapo karibu naye na kuandamana naye; “kaeni pamoja na” ni ya asili na inafaa muktadha wa ulinzi.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: anapoingia na anapotoka
  rationale: Tafsiri hii inahifadhi jozi ya matendo ya kuingia na kutoka kwa lugha ya kawaida ya Kiswahili.
