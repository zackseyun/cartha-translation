  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: sw
  text: Wala mtu yeyote asiingie katika nyumba ya Yahwe[a], isipokuwa makuhani na Walawi wanaohudumu. Hao wanaweza kuingia, kwa maana wao ni watakatifu. Watu wote watekeleze wajibu wa Yahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Yahwe.” Kihalisi, “nyumba ya Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: “Watekeleze wajibu wa Yahwe” pia inaweza kutafsiriwa “washike zamu ya Yahwe” au “watimize agizo la Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: Wala mtu yeyote asiingie
  rationale: אַל pamoja na kitenzi cha kuamuru kwa njia ya kukataza inaonyesha marufuku; muundo huu ni wa kawaida na wenye nguvu ya agizo katika Kiswahili.
- source_word: בֵית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi picha halisi ya Kiebrania ya ‘nyumba ya Yahwe’; katika muktadha huu inamaanisha hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kulitamka badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Kifungu hiki kinaanzisha wale pekee wanaoruhusiwa kuingia baada ya marufuku ya jumla.
- source_word: הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: makuhani na Walawi wanaohudumu
  rationale: Hutambulisha makuhani pamoja na Walawi waliokuwa wakifanya huduma ya patakatifu, bila kufanya ‘huduma’ kuwa ya kijeshi au ya kawaida tu.
- source_word: הֵמָּה יָבֹאוּ
  choice: Hao wanaweza kuingia
  rationale: Katika muktadha wa ubaguzi uliotangulia, kauli hii inaonyesha ruhusa ya kuingia.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: kwa maana wao ni watakatifu
  rationale: ‘Watakatifu’ huhifadhi istilahi ya msingi ya Kiebrania na hapa inaonyesha hali yao ya kutengwa kwa ajili ya huduma takatifu.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: watekeleze wajibu wa Yahwe
  rationale: Muundo wa maneno yenye mzizi mmoja שמר/משמרת unaonyesha kutunza, kulinda, au kutekeleza jukumu walilopewa. ‘Watekeleze wajibu’ ni Kiswahili cha kawaida kinachobeba maana pana kuliko kusimama zamu pekee.
theological_decisions:
- issue: Utakatifu wa kikuhani na wa Kilawi
  choice: wao ni watakatifu
  alternative: wamewekwa wakfu / wametengwa
  rationale: Andiko linahusisha ruhusa ya kuingia patakatifu na hadhi yao takatifu ya kiibada; tafsiri haidai kwamba hawakuwa na dhambi au walikuwa wakamilifu kimaadili.
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Huhifadhi jina binafsi יהוה lililo katika maandishi ya Kiebrania badala ya kulibadilisha na cheo.
- issue: Maana ya מִשְׁמֶרֶת יְהוָה
  choice: wajibu wa Yahwe
  alternative: zamu ya Yahwe / walinde kwa ajili ya Yahwe / washike agizo la Yahwe
  rationale: Kirai kinaweza kumaanisha wajibu au zamu inayomhusu Yahwe, iliyowekwa naye, au inayofanywa kwa ajili yake. Tafsiri kuu inaacha uhusiano huo wazi kiasi, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wala ... asiingie’ huwasilisha marufuku kwa ufasaha; ‘Walawi wanaohudumu’ ni wazi kuliko muundo mzito wa kiufundi. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
