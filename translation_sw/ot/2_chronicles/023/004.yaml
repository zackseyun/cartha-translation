  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: sw
  text: 'Hili ndilo mtakalofanya: Theluthi moja ya makuhani na Walawi mnaoingia siku ya Sabato[a] watakuwa walinda malango wa vizingiti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watavikinga vizingiti.” Usemi wa Kiebrania unaunganisha “walinda malango” na “vizingiti,” ukikazia ulinzi wa sehemu za kuingilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Hili ndilo mtakalofanya
  rationale: Ni kauli ya kawaida na yenye hadhi ya kutanguliza agizo; inaweka wazi nguvu ya maelekezo bila kufuata kwa ugumu muundo wa neno kwa neno.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: theluthi moja yenu
  rationale: Inaonyesha kwa uwazi sehemu moja ya tatu iliyotengwa kutoka katika kundi linalosemeshwa.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: mtakaoingia siku ya Sabato
  rationale: Kirai cha Kiebrania kinawahusu wanaoingia kwa zamu au huduma ya Sabato; ‘kuingia’ kinadumisha taswira ya chanzo bila kuongeza maelezo yasiyotajwa.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: yaani makuhani na Walawi
  rationale: ‘Yaani’ kinaonyesha kwa Kiswahili cha kawaida kwamba kirai hiki kinatambulisha watu wanaohusika, huku kuepuka sintaksia nzito ya ‘wa makuhani na wa Walawi.’
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: watakuwa walinzi wa malango kwenye vizingiti
  rationale: ‘Walinzi wa malango’ linawakilisha שֹׁעֲרֵי, na ‘kwenye vizingiti’ linahifadhi neno halisi הַסִּפִּים pamoja na mkazo wa kulinda sehemu za kuingilia.
