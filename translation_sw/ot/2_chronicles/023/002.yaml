  text: וַ/יָּסֹ֨בּוּ֙ בִּֽ/יהוּדָ֔ה וַ/יִּקְבְּצ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה וְ/רָאשֵׁ֥י הָ/אָב֖וֹת לְ/יִשְׂרָאֵ֑ל וַ/יָּבֹ֖אוּ אֶל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: sw
  text: Nao wakazunguka katika Yuda, wakawakusanya Walawi kutoka miji yote ya Yuda, na wakuu wa koo za Israeli,[a] na wakaja Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “wakuu wa nyumba za mababa wa Israeli”; yaani, viongozi wa koo au familia.
    reason: Nahau ya Kiebrania רָאשֵׁי הָאָבוֹת hurejelea wakuu wa vitengo vya ukoo au familia. Tanbihi huhifadhi usemi wa karibu na asili na kufafanua maana yake.
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: wakazunguka katika
  rationale: Katika muktadha huu סבב inaonyesha kusafiri sehemu mbalimbali za eneo fulani kwa kutekeleza kazi, si kugeuka tu. ‘Wakazunguka katika Yuda’ ni ya kawaida na huhifadhi wazo la kupitia eneo hilo.
- source_word: בִּיהוּדָה
  choice: Yuda
  rationale: Jina la mahali limetolewa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
- source_word: וַיִּקְבְּצוּ
  choice: wakawakusanya
  rationale: קבץ humaanisha kukusanya watu pamoja; kiambishi cha yambwa kinaelekeza wazi kwa Walawi.
- source_word: אֶת־הַלְוִיִּם
  choice: Walawi
  rationale: Hili ni jina la kawaida la Kiswahili kwa kundi la kikabila na la huduma ya ibada linalotajwa hapa.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: kutoka miji yote ya Yuda
  rationale: Kifungu kinaonyesha kwamba Walawi walikusanywa kutoka sehemu mbalimbali katika eneo lote la Yuda.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: pamoja na viongozi wa jamaa za ukoo
  rationale: Nahau ya Kiebrania, kwa maana ya msingi ‘vichwa vya mababa,’ inawahusu viongozi wa vitengo vya kifamilia au koo. Kiswahili hiki ni cha asili na huhifadhi muundo wa kijamii unaokusudiwa.
- source_word: לְיִשְׂרָאֵל
  choice: za Israeli
  rationale: 'ל hapa inaonyesha uhusiano: jamaa hizo ni za Israeli. Tafsiri haibadili ‘Israeli’ kuwa ‘Yuda.’'
- source_word: וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם
  choice: kisha wakaja Yerusalemu
  rationale: בוא pamoja na אֶל humaanisha kuja mahali. ‘Kisha’ huonyesha mwendelezo wa simulizi bila kuongeza uhusiano wa sababu.
theological_decisions:
- issue: Upeo wa neno ‘Israeli’ katika muktadha unaohusu Yuda
  choice: Israeli
  alternative: Yuda; watu wa Israeli
  rationale: Maandishi ya Kiebrania yanasema wazi ‘Israeli.’ Kulihifadhi kunatunza msamiati wa Mwandishi wa Mambo ya Nyakati na hakulazimishi maana kuwa Yuda pekee wala watu wote wa Israeli.
- issue: Utoaji wa nahau הָאָבוֹת
  choice: jamaa za ukoo
  alternative: nyumba za mababa; familia
  rationale: ‘Jamaa za ukoo’ ni Kiswahili kinachoeleweka na huwasilisha kitengo cha kifamilia cha mababu kinachoongozwa na viongozi hao, bila kutumia tafsiri ya neno kwa neno isiyo ya kawaida.
- issue: Uhusiano wa וְרָאשֵׁי הָאָבוֹת na kitenzi ‘wakawakusanya’
  choice: pamoja na viongozi wa jamaa za ukoo
  alternative: na viongozi wa jamaa za ukoo
  rationale: Sarufi ya Kiebrania inaweza kueleweka kuwa viongozi hao pia walikusanywa. ‘Pamoja na’ huonyesha kwamba wao ni kundi la pili la waliokusanywa, bila kuongeza dai lingine la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida wa simulizi; ‘Walawi,’ ‘Yuda,’ ‘Israeli,’ na ‘Yerusalemu’ ni maumbo yaliyozoeleka. Alama ya tanbihi [a] imewekwa mara moja baada ya kifungu kinachofafanuliwa.
