  source_fidelity: Rasimu inaakisi kwa usahihi mpangilio wa ulinzi, silaha mkononi, madhabahu, nyumba, na kumzunguka mfalme. Hata hivyo, Kiebrania chenyewe hutumia «upande wa kulia» na «upande wa kushoto»; kubadili haya kuwa kusini na kaskazini huongeza uamuzi wa mwelekeo ambao haujaelezwa moja kwa moja katika mstari.
