base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: sw
  text: Akawaweka watu wote mahali pao, kila mtu akiwa na silaha yake mkononi, kuanzia upande wa kulia wa nyumba hadi upande wa kushoto wa nyumba, kando ya madhabahu na nyumba, wakimzunguka mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Akawapanga
  rationale: Kitenzi hiki hapa kina maana ya kuwaweka au kuwapanga watu katika nafasi zao; ‘akawapanga’ ni ya kawaida na inaendana na muktadha wa ulinzi.
- source_word: שִׁלְחוֹ
  choice: silaha yake
  rationale: Neno linaweza kumaanisha silaha ya kurusha au silaha kwa ujumla; muktadha hauainishi aina yake, hivyo tafsiri pana ‘silaha’ inahifadhi kutobainishwa huko.
- source_word: כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: upande wa kusini wa nyumba
  rationale: Ingawa כֶּתֶף ni ‘ubavu/upande’ na יְמָנִית ni ‘wa kulia,’ katika mwelekeo wa kale wa kutazama mashariki upande wa kulia ni kusini; tafsiri ya dira ni wazi kwa msomaji wa sasa na inalingana na uelewa wa kijiografia wa kifungu.
- source_word: כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: upande wa kaskazini wa nyumba
  rationale: ‘Upande wa kushoto’ kwa mtazamo wa kuelekea mashariki unaashiria kaskazini; tafsiri hii huwasilisha mahali panapokusudiwa.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: wakimzunguka mfalme
  rationale: Kirai kinaonyesha mpangilio wa watu kuzunguka mfalme; umbo la Kiswahili linaonyesha wazi kwamba watu ndio waliomzunguka.
