  revised_text: Akawaweka watu wote mahali pao, kila mtu akiwa na silaha yake mkononi, kuanzia upande wa kulia wa nyumba hadi upande wa kushoto wa nyumba, kando ya madhabahu na nyumba, wakimzunguka mfalme.
