  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Yehoyada anakabidhi majukumu/usimamizi wa nyumba ya Yahweh kwa makuhani Walawi; Daudi alikuwa amewapangia huduma hiyo; kusudi ni kutoa sadaka za kuteketezwa kwa mujibu wa Torati ya Musa, kwa furaha na kwa nyimbo, kufuatana na mpangilio wa Daudi. “Usimamizi” hutoa maana ya kiutawala ya פְּקֻדּוֹת, ingawa nomino ya Kiebrania ni ya wingi, na “mikononi mwa” huhifadhi kwa kueleweka nahau בְּיָד.'
