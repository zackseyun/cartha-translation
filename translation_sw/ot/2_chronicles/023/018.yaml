  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: sw
  text: Kisha Yehoyada akaweka usimamizi wa nyumba ya Yahweh mikononi mwa makuhani, Walawi,[a] ambao Daudi alikuwa amewapanga kwa ajili ya nyumba ya Yahweh, ili wamtolee Yahweh sadaka za kuteketezwa, kama ilivyoandikwa katika Torati ya Musa, kwa furaha na kwa nyimbo, kulingana na maagizo ya Daudi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makuhani Walawi,” au “makuhani na Walawi.” Kauli ya Kiebrania inaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “kwa mkono wa Daudi,” yaani, kulingana na mpangilio au maagizo yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: akaweka usimamizi
  rationale: שׂים ni ‘kuweka,’ na katika muktadha huu פְּקֻדּוֹת inaonyesha jukumu la kusimamia huduma za hekalu. Kauli hii ni ya asili katika Kiswahili na inadumisha maana ya kiutawala.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Huhifadhi taswira ya Kiebrania ya ‘nyumba’ badala ya kuifasiri moja kwa moja kuwa ‘hekalu.’
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Huhifadhi nahau ya Kiebrania huku ikieleweka kwa Kiswahili kuwa kukabidhi mamlaka au wajibu.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani, Walawi
  rationale: Hufuata muundo wenye ukaribu wa Kiebrania bila kuamua kama maana yake ni ‘makuhani Walawi’ au ‘makuhani na Walawi.’
- source_word: אֲשֶׁר חָלַק דָּוִיד
  choice: ambao Daudi alikuwa amewapanga
  rationale: חלק kimsingi ni kugawa au kupangia mafungu; hapa inahusu mpangilio wa watumishi wa hekalu katika vikundi vya huduma.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: ili wamtolee ... sadaka za kuteketezwa
  rationale: Hii ni istilahi ya kawaida na iliyo wazi kwa tendo la kutoa עֹלוֹת, yaani sadaka zinazoteketezwa.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: kama ilivyoandikwa katika Torati ya Musa
  rationale: ‘Torati’ huwakilisha תּוֹרָה kwa usahihi na inafaa kwa rejeleo la mafundisho yaliyoandikwa ya Musa.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: kwa furaha na kwa nyimbo
  rationale: Huwasilisha namna ya ibada kwa Kiswahili cha kawaida chenye hadhi; ‘nyimbo’ ni ya asili katika muktadha wa uimbaji wa ibada.
- source_word: עַל יְדֵי דָוִיד
  choice: kulingana na maagizo ya Daudi
  rationale: Nahau ‘kwa mkono wa Daudi’ hapa inaelekea kuonyesha mpangilio au maagizo yaliyotolewa na Daudi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uhusiano wa הַכֹּהֲנִים הַלְוִיִּם
  choice: makuhani, Walawi
  alternative: makuhani Walawi; au makuhani na Walawi
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa njia zaidi ya moja. Tafsiri kuu inadumisha mkazo na utata wa muundo huo badala ya kutatua suala la utambulisho wa makundi kimadhehebu.
- issue: Maana ya עַל יְדֵי דָוִיד
  choice: kulingana na maagizo ya Daudi
  alternative: kwa mkono wa Daudi
  rationale: Katika muktadha wa ibada, kauli hiyo inaashiria mpangilio au mwongozo wa Daudi. Tanbihi huhifadhi maana halisi inayowezekana.
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya msingi yana jina la Mungu, si cheo; kwa hiyo ‘Yahweh’ hulihifadhi moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mikononi mwa’ huhifadhi nahau ya chanzo lakini bado hueleza kukabidhiwa usimamizi. Alama zote za tanbihi zimewekwa mahali zinapohusika katika maandishi makuu.
