  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עוֹמֵ֨ד עַֽל עַמּוּד֜/וֹ בַּ/מָּב֗וֹא וְ/הַ/שָּׂרִ֣ים וְ/הַ/חֲצֹצְרוֹת֮ עַל הַ/מֶּלֶךְ֒ וְ/כָל עַ֨ם הָ/אָ֜רֶץ שָׂמֵ֗חַ וְ/תוֹקֵ֨עַ֙ בַּ/חֲצֹ֣צְר֔וֹת וְ/הַ/מְשֽׁוֹרֲרִים֙ בִּ/כְלֵ֣י הַ/שִּׁ֔יר וּ/מוֹדִיעִ֖ים לְ/הַלֵּ֑ל וַ/תִּקְרַ֤ע עֲתַלְיָ֨הוּ֙ אֶת בְּגָדֶ֔י/הָ וַ/תֹּ֖אמֶר קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: sw
  text: Akatazama, na tazama, mfalme alikuwa amesimama kando ya nguzo yake penye ingilio. Wakuu, pamoja na tarumbeta[a], walikuwa karibu na mfalme; watu wote wa nchi walikuwa wakifurahi na kupiga tarumbeta, nao waimbaji, wakiwa na vyombo vya muziki, walikuwa wakiongoza sifa[b]. Ndipo Athalia akararua mavazi yake na kusema, “Njama! Njama!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakuu na tarumbeta.” Huenda “tarumbeta” zimetumiwa kumaanisha wapiga tarumbeta.'
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wakielekeza sifa,” au “wakitoa ishara ya kusifu.” Usemi wa Kiebrania una maana pana katika mazingira haya ya muziki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Akatazama, na tazama
  rationale: Kitenzi ראה kina maana ya kuona au kutazama; katika mtiririko huu, “akatazama” hueleza kitendo chake kwa kawaida, huku “na tazama” ikihifadhi nguvu ya ghafla ya הִנֵּה ya kuelekeza fikira kwenye tukio.
- source_word: הַמֶּלֶךְ עוֹמֵד
  choice: mfalme alikuwa amesimama
  rationale: Kivumishi-tendo עוֹמֵד kinaonyesha hali inayoendelea katika mandhari, hivyo “alikuwa amesimama” kinafaa kuliko tendo la mara moja.
- source_word: עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: kando ya nguzo yake penye mwingilio
  rationale: עַל hapa inaonyesha mahali pa kusimama karibu na nguzo ya kifalme, si lazima juu yake; מָבוֹא ni mahali pa kuingilia.
- source_word: וְהַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: Wakuu na tarumbeta walikuwa karibu na mfalme
  rationale: Tafsiri inahifadhi maneno ya Kiebrania “wakuu na tarumbeta” badala ya kubadili moja kwa moja kuwa “wapiga tarumbeta,” huku tanbihi ikieleza uwezekano wa matumizi ya chombo kumaanisha wapigaji wake.
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: watu wote wa nchi walikuwa wakifurahi na kupiga tarumbeta
  rationale: Muundo wa Kiebrania unaonyesha sherehe inayoendelea; “watu wote wa nchi” huhifadhi istilahi ya kawaida ya Mambo ya Nyakati.
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: waimbaji, wakiwa na vyombo vya muziki
  rationale: מְשׁוֹרֲרִים ni waimbaji hasa, na כְּלֵי הַשִּׁיר ni vyombo vinavyotumiwa katika muziki; usemi huu ni wa kawaida na wazi kwa Kiswahili cha sasa.
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: walikuwa wakiongoza sifa
  rationale: Hifili ya ידע katika mazingira haya ya muziki inaweza kumaanisha kuongoza, kuelekeza, au kutoa ishara ya kusifu. “Kuongoza sifa” hutoa maana ya kiutendaji bila kuondoa kabisa upeo wa usemi.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Uhaini! Uhaini!
  rationale: קֶשֶׁר ni njama au uasi dhidi ya mamlaka; katika kilio cha malkia anayeona mfalme mwingine ametawazwa, “uhaini” ni kilio cha kawaida na chenye nguvu, huku tanbihi ikihifadhi “njama” kama uwezekano.
