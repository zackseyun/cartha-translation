translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa wasomaji wa kawaida. “Na tazama” limehifadhiwa kwa makusudi ili kuonyesha msisitizo wa ghafla wa masimulizi ya Kiebrania. Jina “Athalia” limetumiwa kwa umbo linalozoeleka katika Kiswahili cha Biblia.
