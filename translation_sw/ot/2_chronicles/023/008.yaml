base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: sw
  text: Basi Walawi na watu wote wa Yuda wakafanya sawasawa na yote ambayo Yehoyada kuhani alikuwa ameamuru. Kila mmoja akawachukua watu wake, wale walioingia siku ya Sabato pamoja na wale waliotoka siku ya Sabato, kwa maana Yehoyada kuhani hakuwa ameyaruhusu makundi ya zamu yaondoke[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vikundi vya huduma” au “migawanyo”; yaani vikundi vya makuhani na Walawi vilivyopangiwa vipindi vya huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakafanya
  rationale: Kitenzi cha kawaida עשה hapa kinaonyesha kutekeleza amri; “wakafanya sawasawa na” ni Kiswahili cha asili kinachohifadhi muundo wa utii kwa agizo.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina sanifu la Kiswahili kwa kundi la Walawi; urejeo mahususi unaeleweka bila kibainishi tofauti.
- source_word: וְכָל יְהוּדָה
  choice: na watu wote wa Yuda
  rationale: Yuda imetumiwa kwa maana ya wakazi wake. Kutaja “watu” kunafanya usemi uwe wazi na wa kawaida kwa msomaji wa Kiswahili bila kubadili maana ya mkusanyiko mzima.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: sawasawa na yote ambayo ... alikuwa ameamuru
  rationale: Huhifadhi wazo la utiifu kamili na pia huonyesha kwamba amri ilitangulia utekelezaji.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: Yehoyada kuhani
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili, na cheo כֹּהֵן kimetafsiriwa kwa neno la kawaida “kuhani.”
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: Kila mmoja akawachukua watu wake
  rationale: אִישׁ ina maana ya mgawanyo, “kila mmoja,” huku אֲנָשָׁיו ikibaki kuwa “watu wake” bila kuamua zaidi kama walikuwa askari au watumishi wengine.
- source_word: בָּאֵי הַשַּׁבָּת עִם יוֹצְאֵי הַשַּׁבָּת
  choice: wale walioingia zamu siku ya Sabato pamoja na wale waliotoka zamu siku ya Sabato
  rationale: Vitenzi vya kuingia na kutoka vimehifadhiwa, huku “zamu” ikifanya wazi muktadha wa kubadilishana vikundi vya huduma unaodokezwa na kifungu.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu inayoeleza kwa nini vikundi vinavyoingia na vinavyotoka vilikuwapo pamoja.
- source_word: לֹא פָטַר
  choice: hakuwa ameyaachilia
  rationale: Katika muktadha huu פטר ni kuwaruhusu waliomaliza wajibu waondoke; “kuachilia” huhifadhi maana hiyo bila kudokeza kufukuzwa.
- source_word: הַמַּחְלְקוֹת
  choice: makundi ya zamu
  rationale: Neno linamaanisha vikundi vilivyopangwa kwa vipindi vya huduma. “Makundi ya zamu” ni wazi zaidi katika Kiswahili cha sasa kuliko “migawanyo,” huku tanbihi ikitaja uwezekano wa tafsiri nyingine.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaosomeka kwa urahisi. Muundo wa simulizi umehifadhiwa kwa viambishi vya mfululizo vya “waka-/aka-”. Neno “zamu” limetumiwa kufafanua kwa kawaida mfumo wa vikundi vinavyoingia na kutoka katika huduma, bila kuongeza utambulisho wa kijeshi ambao Kiebrania hakisemi wazi.
