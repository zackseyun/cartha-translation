base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: sw
  text: Basi wakamkamata, naye akaenda mpaka kwenye ingilio la Lango la Farasi katika nyumba ya mfalme[a], nao wakamuua huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika jumba la kifalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: wakamkamata
  rationale: Nahau hiyo kwa neno halisi ni ‘wakaweka mikono juu yake,’ lakini katika muktadha wa kukamatwa na kuuawa ina maana ya kumtia mikononi au kumkamata. ‘Wakamkamata’ ni Kiswahili cha kawaida na wazi.
- source_word: מְבוֹא
  choice: ingilio
  rationale: Nomino hii humaanisha mahali pa kuingilia au njia ya kuingia; ‘ingilio’ linafaa kwa muundo unaolitaja lango.
- source_word: שַׁעַר הַסּוּסִים
  choice: Lango la Farasi
  rationale: Inaelekea kuwa jina maalumu la lango, hivyo limetafsiriwa kama jina la mahali.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Huhifadhi kwa ukaribu taswira ya Kiebrania. Katika muktadha inaweza kumaanisha jumba la kifalme, lakini tafsiri ya moja kwa moja imewekwa katika maandishi.
- source_word: וַיְמִיתוּהָ
  choice: wakamuua
  rationale: Hifili ya מות humaanisha kusababisha afe au kumuua. ‘Wakamuua’ ni ya moja kwa moja na haiongezi dhana mahususi ya hukumu rasmi ambayo kitenzi pekee hakiitaji.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi rahisi cha mahali; ‘huko’ hurejelea kwa kawaida mahali palipotajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakamkamata’ limetumiwa badala ya tafsiri halisi isiyo ya kawaida ‘wakaweka mikono juu yake.’ Kiunganishi ‘lililo karibu na’ kinaonyesha uhusiano wa mahali unaodokezwa na Kiebrania bila kudai kwamba Lango la Farasi lilikuwa ndani ya nyumba yenyewe.
