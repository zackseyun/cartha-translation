  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: sw
  text: Kisha akawachukua wakuu wa mamia, watu mashuhuri[a], watawala wa watu, na watu wote wa nchi[b], akamteremsha mfalme kutoka katika nyumba ya Yahweh. Wakaingia kupitia lango la juu la nyumba ya mfalme[c], wakamketisha mfalme juu ya kiti cha ufalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wenye nguvu.” Neno la Kiebrania linaweza kumaanisha watu wenye hadhi, mamlaka, au nguvu.
    reason: lexical_alternative
  - marker: b
    text: “Watu wa nchi” ni usemi wa kawaida katika masimulizi ya kifalme unaoutaja umma kama kundi la kijamii na kisiasa.
    reason: cultural_note
  - marker: c
    text: Au, “jumba la kifalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: Kitenzi לקח kimsingi ni ‘chukua.’ Katika muktadha huu kinamaanisha kwamba Yehoyada aliwachukua pamoja naye na kuwaongoza, huku tafsiri ikihifadhi muundo wa Kiebrania.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: makamanda wa vikosi vya askari mia moja
  rationale: Hii inaonyesha cheo cha kijeshi cha maafisa waliokuwa wakisimamia vikosi vya watu mia moja, bila kutumia neno lenye taswira ya jeshi la Roma.
- source_word: הָאַדִּירִים
  choice: watu mashuhuri
  rationale: Neno אַדִּירִים linaweza kumaanisha watu wenye hadhi, nguvu, au ushawishi. ‘Watu mashuhuri’ linafaa katika mazingira ya kifalme na kisiasa huku tanbihi ikihifadhi uwezekano wa ‘watu wenye nguvu.’
- source_word: הַמֹּשְׁלִים בָּעָם
  choice: watawala wa watu
  rationale: Tafsiri hii inabaki karibu na maana ya watu waliokuwa na mamlaka juu ya jamii.
- source_word: כָּל עַם הָאָרֶץ
  choice: watu wote wa nchi
  rationale: Huu ni usemi wa kawaida katika masimulizi ya kifalme, unaoweza kuonyesha umma kama kundi la kijamii na kisiasa; tafsiri hii inahifadhi usemi huo.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: akamteremsha mfalme
  rationale: Hifili ya ירד ina maana ya kumfanya mtu ashuke au kumleta chini. ‘Akamteremsha’ inadumisha mwelekeo wa mwendo kutoka hekaluni kwenda kwenye makao ya kifalme.
- source_word: מִבֵּית יְהוָה
  choice: kutoka katika nyumba ya Yahwe
  rationale: ‘Nyumba ya Yahwe’ inahifadhi usemi wa Kiebrania בית יהוה na kulitaja jina la Mungu lililoandikwa katika matini.
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: kupitia lango la juu
  rationale: Katika sentensi ya mwendo, ‘kupitia’ ni Kiswahili cha kawaida kinachowasilisha maana ya kwenda katikati ya lango.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya בית המלך; katika muktadha inaweza kumaanisha jumba la kifalme.
- source_word: וַיּוֹשִׁיבוּ
  choice: wakamketisha
  rationale: Kitenzi hiki ni cha kisababishi, ‘walimfanya aketi’; ‘wakamketisha’ ni cha kawaida na kinafaa kwa tukio la kumweka mfalme kwenye kiti cha enzi.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: kiti cha ufalme
  rationale: Tafsiri hii inahifadhi nomino ממלכה, ‘ufalme,’ badala ya kuifupisha kuwa ‘kiti cha kifalme.’
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina jina la Mungu moja kwa moja. ‘Yahwe’ ni umbo la Kiswahili linalotambulika na linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi umehifadhiwa kwa vitenzi vinavyofuatana vya ‘aka-/waka-’. ‘Nyumba ya Yahwe’ na ‘kiti cha ufalme’ zimeachwa karibu na maumbo ya Kiebrania, huku tanbihi zikieleza mbadala muhimu.
