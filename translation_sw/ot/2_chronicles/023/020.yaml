  source_fidelity: 'Muundo wa wahusika umehifadhiwa: mtu mmoja anawakusanya/kuwaongoza viongozi na umma, anamshusha mfalme kutoka nyumba ya Yahweh, kisha kundi linaingia na kumketisha mfalme. Hata hivyo, mpangilio wa kirai cha lango katika rasimu unaweza kusomwa kana kwamba waliingia ndani ya jumba kwanza ndipo wakapitia lango. Kiebrania kinaonyesha waliingia katika jumba la mfalme kupitia lango la juu.'
