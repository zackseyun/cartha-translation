  to: Kisha akawachukua wakuu wa mamia, watu mashuhuri[a], watawala wa watu, na watu wote wa nchi[b], akamteremsha mfalme kutoka katika nyumba ya Yahweh. Wakaingia kupitia lango la juu la nyumba ya mfalme[c], wakamketisha mfalme juu ya kiti cha ufalme.
