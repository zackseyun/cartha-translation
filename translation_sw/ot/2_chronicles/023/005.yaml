base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: sw
  text: theluthi nyingine iwe kwenye nyumba ya mfalme, na theluthi nyingine iwe kwenye Lango la Msingi[a]; nao watu wote wawe katika nyua za nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lango la msingi.” Huenda Kiebrania kinahifadhi jina maalumu la lango, ambalo hapa limetafsiriwa “Lango la Msingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: theluthi nyingine
  rationale: Nomino ya mpangilio yenye kibainishi imetumiwa hapa kwa maana ya sehemu moja kati ya tatu. Kwa kuwa mstari unaendeleza mgawanyo ulioanza katika mstari uliotangulia, “theluthi nyingine” ni Kiswahili cha kawaida kinachoonyesha mwendelezo huo.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: kwenye nyumba ya mfalme
  rationale: “Nyumba” inafuata maana ya msingi ya בֵּית, huku “kwenye” ikifaa kwa kituo walichopangiwa katika eneo la makao ya kifalme bila kulazimisha maana finyu ya kuwa ndani ya jengo.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: kwenye Lango la Msingi
  rationale: שַׁעַר ni “lango,” na יְסוֹד ni “msingi.” Herufi kubwa zinaonyesha kuwa huenda hili ni jina maalumu la lango, ingawa muundo wa Kiebrania unaweza pia kueleweka kama “lango la msingi.”
- source_word: וְכָל הָעָם
  choice: nao watu wote
  rationale: עָם ni neno la kawaida kwa “watu.” Kiunganishi “nao” kinaendeleza orodha kwa Kiswahili asilia bila kuongeza wazo la kusanyiko rasmi.
- source_word: בְּחַצְרוֹת
  choice: katika nyua
  rationale: Wingi wa חָצֵר unamaanisha maeneo ya wazi yaliyozungushiwa, yaani nyua za jengo la hekalu. “Nyua” ni neno la kawaida na wazi katika Kiswahili cha Afrika Mashariki.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: בֵּית יְהוָה ni “nyumba ya Yahwe.” “Nyumba” huhifadhi taswira ya Kiebrania, ingawa mahali panaporejelewa ni hekalu na maeneo yake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kiebrania kinatumia moja kwa moja jina la agano YHWH. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo; tahajia hii ni ya kawaida na inayosomeka kwa Kiswahili.
- issue: Uhusiano wa “nyumba ya Yahwe” na hekalu
  choice: nyumba ya Yahwe
  alternative: hekalu la Yahwe
  rationale: “Nyumba” hufuata בֵּית kwa karibu na kuhifadhi lugha ya chanzo. “Hekalu” lingeweka wazi rejeo lakini lingepunguza taswira halisi iliyopo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unaendeleza sentensi na mgawanyo wa walinzi kutoka mstari uliotangulia. “Kwenye” limetumiwa kwa vituo vya walinzi, na “katika” kwa watu waliomo ndani ya nyua.
