  source_fidelity: 'Tafsiri inafuata kwa uaminifu mgawanyo wa Kiebrania: theluthi moja kwa nyumba ya mfalme, theluthi moja kwa Lango la Msingi, na watu wote katika nyua za nyumba ya Yahwe. “Theluthi nyingine” inaeleweka kwa usahihi katika muktadha wa mgawanyo unaoendelea kutoka mstari uliotangulia, bila kubadili maana.'
