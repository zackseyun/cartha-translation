base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: sw
  text: Kisha wakamtoa mwana wa mfalme, wakaweka juu yake taji na ushuhuda[a], wakamfanya kuwa mfalme, wakampaka mafuta; na Yehoyada na wanawe wakasema, “Mfalme na aishi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sheria” au “hati ya agano.” Neno la Kiebrania huenda linamaanisha ushuhuda wa agano ulioandikwa, unaohusishwa na utawala wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: wakamtoa
  rationale: Hifili ya יצא humaanisha kumsababisha mtu atoke au kumtoa; “wakamtoa” ni ya kawaida na inafaa katika tukio la kumwasilisha mrithi hadharani.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: mwana wa mfalme
  rationale: Muundo huu wa kawaida unahifadhi utambulisho wa mrithi wa kifalme.
- source_word: הַנֵּזֶר
  choice: taji
  rationale: Katika sherehe ya kumweka mfalme, נזר ni taji au kilemba cha kifalme chenye maana ya kuwekwa wakfu; “taji” ndiyo neno wazi zaidi kwa wasomaji wa kisasa.
- source_word: הָעֵדוּת
  choice: ushuhuda
  rationale: Neno hili kimsingi humaanisha ushuhuda au shahidi, lakini hapa huenda linataja maandishi ya agano au sheria yanayohusiana na utawala wa mfalme. “Ushuhuda” huhifadhi upana na mwangwi wa kiagano wa Kiebrania.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: wakamfanya kuwa mfalme
  rationale: Hifili ya מלך ni kusababisha mtu atawale au kumfanya mfalme; tafsiri hii haitanganyi tendo hilo na tendo tofauti la kumvika taji.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: wakamtia mafuta
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza משׁח katika sherehe ya kumweka mfalme, huku ikihifadhi umuhimu wake wa kidini na kifalme.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: Yehoyada na wanawe
  rationale: Kirai hiki kinatajwa baada ya kitenzi cha wingi cha kumpaka mafuta na kinafuatwa na kitenzi kingine cha wingi; kwa hiyo limetafsiriwa kuwa kiima cha matendo yote mawili.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Mfalme na aishi!
  rationale: Hii inawasilisha kwa ufupi nguvu ya tamko la Kiebrania la kumtakia mfalme uhai bila kuongeza wazo la “milele,” ambalo halipo wazi katika chanzo.
theological_decisions:
- issue: Maana ya הָעֵדוּת katika sherehe ya kumweka mfalme
  choice: ushuhuda
  alternative: sheria; hati ya agano
  rationale: Neno la Kiebrania lina upana zaidi kuliko sheria pekee na lina mwangwi wa agano. Tafsiri “ushuhuda” inadumisha uhusiano huo bila kuamua kwa uhakika kwamba kitu kilichotajwa kilikuwa aina fulani maalumu ya hati.
- issue: Kiima cha tendo la kumpaka mafuta
  choice: Yehoyada na wanawe ndio waliomtia mafuta na kisha wakasema
  alternative: Kuacha waliompaka mafuta bila kutajwa wazi, kisha kuwafanya Yehoyada na wanawe kuwa wasemaji pekee
  rationale: Mpangilio wa Kiebrania una kitenzi cha wingi “wakamtia mafuta,” kisha kiima “Yehoyada na wanawe,” na baadaye “wakasema.” Usomaji wa kawaida zaidi ni kwamba kiima kilichocheleweshwa kinahusika na matendo yote mawili, ingawa mpangilio unaweza kusababisha kusita kidogo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi zimetumiwa ili mfululizo wa matendo uwe wazi. “Mfalme na aishi!” ni tamko la hadharani linalohifadhi mtindo wa Kiebrania bila kuongeza “milele.”
