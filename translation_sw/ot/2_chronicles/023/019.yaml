id: 2CH.23.19
reference: 2 Chronicles 23:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: sw
  text: Akawaweka walinzi wa malango kwenye malango ya nyumba ya Yahwe, ili mtu yeyote aliye najisi kwa namna yoyote[a] asiingie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “aliye najisi kwa jambo lolote”; maana yake ni mtu aliye najisi kwa namna yoyote au kwa sababu yoyote ya unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Akawaweka
  rationale: Hifili ya עמד ina maana ya kuwafanya watu wasimame mahali pa kazi; “akawaweka” huonyesha kwa lugha ya kawaida kwamba aliwapanga walinzi katika nafasi zao.
- source_word: הַשֹּׁעֲרִים
  choice: walinzi wa malango
  rationale: Neno hili linawataja watu waliokuwa na jukumu maalumu la kulinda viingilio, si walinzi kwa maana pana tu.
- source_word: עַל שַׁעֲרֵי
  choice: kwenye malango ya
  rationale: Katika muktadha wa kuwaweka watu katika nafasi zao, עַל huonyesha mahali waliposimama; “kwenye” ni ya asili na wazi katika Kiswahili.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi taswira ya neno בַּיִת, huku “Yahwe” ikiwakilisha moja kwa moja jina la agano יְהוָה.
- source_word: וְלֹא יָבֹא
  choice: ili ... asiingie
  rationale: 'Muundo huu unaonyesha kusudi la kuwaweka walinzi: kuzuia mtu aliye najisi kuingia.'
- source_word: טָמֵא
  choice: aliye najisi
  rationale: “Najisi” ni istilahi ya kawaida ya kibiblia kwa hali ya kutokuwa safi kidesturi katika muktadha wa kuingia hekaluni.
- source_word: לְכָל דָּבָר
  choice: kwa namna yoyote
  rationale: Kirai hiki ni pana na cha kiidioma, kikimaanisha hali au sababu yoyote inayomfanya mtu kuwa najisi; tafsiri hii ni wazi kuliko uhamishaji wa neno kwa neno.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya טָמֵא katika kuingia katika nyumba ya Yahwe
  choice: aliye najisi
  alternative: asiye safi
  rationale: “Aliye najisi” huhifadhi maana ya hali ya kidesturi inayohusiana na ibada bila kuidokeza kuwa uchafu wa kawaida wa mwili au uovu wa maadili pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na sentensi inayoeleweka kwa urahisi. “Nyumba ya Yahwe” huhifadhi muundo wa Kiebrania, na “walinzi wa malango” ni wazi zaidi kuliko “walinda milango” katika muktadha huu.
