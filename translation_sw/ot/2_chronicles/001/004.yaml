base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: sw
  text: Lakini Daudi alikuwa amelipandisha sanduku la Mungu kutoka Kiriath-Yearimu hadi mahali Daudi alipokuwa amepatayarisha kwa ajili yake[a], kwa maana alikuwa amepiga hema kwa ajili yake huko Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kiebrania, “hadi kile ambacho Daudi alikuwa amepatayarisha kwa ajili yake.” Kauli ya Kiebrania ni fupi; maana yake ni kwamba Daudi alilipeleka sanduku mahali alipokuwa amepatayarisha kwa ajili yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Lakini
  rationale: 'Inaonyesha tofauti na mstari uliotangulia: madhabahu ya shaba ilikuwa Gibeoni, lakini sanduku lilikuwa Yerusalemu.'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Huu ndio uhamishaji wa moja kwa moja na wa kawaida wa muundo wa Kiebrania.
- source_word: הֶעֱלָה
  choice: alikuwa amelipandisha
  rationale: Hifili ya עלה ina maana ya kulipandisha au kulileta juu sanduku; wakati timilifu uliotangulia unaonyesha tendo lililokuwa limekwisha kutokea na linaloeleza hali ya simulizi.
- source_word: מִקִּרְיַת יְעָרִים
  choice: kutoka Kiriath-yearimu
  rationale: Jina la mahali limenukuliwa kwa namna inayosomeka kwa Kiswahili huku likihifadhi umbo lake la Kiebrania.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: hadi mahali alipokuwa amelitayarishia
  rationale: Kauli ya Kiebrania imebanwa; kuongeza 'mahali' kunafanya maana ya kule ambako Daudi alikuwa ameliandalia sanduku ieleweke bila kuipanua kupita kiasi.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza maelezo yanayofafanua jinsi Daudi alivyokuwa amepatayarisha mahali hapo.
- source_word: נָטָה לוֹ אֹהֶל
  choice: alikuwa amelisimamishia hema
  rationale: נטה pamoja na אֹהֶל humaanisha kusimamisha au kutandaza hema; 'kusimamishia hema' ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: '''Huko'' inaunganisha kwa kawaida mahali palipotajwa na Yerusalemu, bila kubadili maana ya kishazi cha mahali.'
