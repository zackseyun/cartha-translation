base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: sw
  text: Ndipo Sulemani akaja[a] Yerusalemu kutoka mahali pa juu palipokuwa Gibeoni[c], kutoka mbele ya hema la kukutania[b], akatawala Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaenda”; kitenzi cha Kiebrania kinaweza kutafsiriwa kwa namna yoyote kati ya hizi mbili, kutegemea mahali ambapo msemaji anatazamia safari hiyo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka mbele ya hema la kukutania,” usemi wa kieneo unaomaanisha kuondoka katika eneo la patakatifu.'
    reason: cultural_note
  - marker: c
    text: Yaani, mahali pa juu pa ibada huko Gibeoni, ambako hema la kukutania lilikuwapo.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא kinaweza kumaanisha ‘kuja,’ ‘kwenda,’ au ‘kuingia’ kulingana na mahali pa kutazamia tendo. ‘Akaja Yerusalemu’ ni Kiswahili cha kawaida na kinahifadhi mtazamo wa kitenzi bila kuongeza wazi wazo la ‘kurudi.’
- source_word: לַבָּמָה
  choice: mahali pa juu
  rationale: במה ni mahali pa juu palipotumiwa kwa ibada. ‘Mahali pa juu’ ni tafsiri iliyo wazi na haiingizi hukumu hasi ambayo mstari wenyewe hautoi.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: palipokuwa Gibeoni
  rationale: Kauli hii inaonyesha kwa urahisi mahali ambapo hicho kituo cha ibada kilikuwapo.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Muktadha na mpangilio wa sentensi unaonyesha Yerusalemu kuwa mwisho wa safari ya Sulemani baada ya kutoka Gibeoni.
- source_word: מִלִּפְנֵי
  choice: kutoka mbele ya
  rationale: Hii inahifadhi maana ya kieneo ya maneno ya Kiebrania, yaani kuondoka katika eneo lililokuwa mbele ya patakatifu.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hii ni tafsiri ya moja kwa moja na inayotambulika ya jina la hema takatifu ambako Mungu alikutana na watu wake.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Sulemani tayari alikuwa mfalme; kwa hiyo hapa kitenzi kinaeleza kuendelea kwake kutawala, si kuanza kuwa mfalme.
- source_word: עַל יִשְׂרָאֵל
  choice: Israeli
  rationale: Katika Kiswahili, ‘kutawala Israeli’ ni njia ya kawaida ya kueleza utawala juu ya taifa hilo bila kulazimisha kihusishi cha Kiebrania.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa ‘Yerusalemu’ katika mpangilio mfupi wa Kiebrania
  choice: Sulemani alielekea Yerusalemu kutoka mahali pa juu huko Gibeoni
  alternative: Sulemani alikuja mahali pa juu palipokuwa Gibeoni, Yerusalemu
  rationale: Muktadha wa sura unaonyesha kwamba Sulemani alikuwa ameenda Gibeoni na sasa anaondoka huko kuelekea Yerusalemu. Mpangilio wa Kiswahili unaonyesha hilo bila kuongeza tukio jipya.
- issue: Jinsi ya kutaja mahali pa juu palipohusishwa na hema la kukutania
  choice: mahali pa juu
  alternative: kituo cha ibada kilichokuwa mahali pa juu
  rationale: Tafsiri ya msingi inahifadhi neno la Kiebrania bila kulifanya mahali hapa kuwa halali au haramu kwa msimamo wa kimadhehebu. Tanbihi inaeleza matumizi yake katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Sentensi imepangwa kwa mtiririko wa asili wa Kiswahili, huku usemi halisi ‘kutoka mbele ya hema la kukutania’ ukihifadhiwa na kufafanuliwa katika tanbihi.
