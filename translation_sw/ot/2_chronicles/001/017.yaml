  text: וַֽ֠/יַּעֲלוּ וַ/יּוֹצִ֨יאוּ מִ/מִּצְרַ֤יִם מֶרְכָּבָה֙ בְּ/שֵׁ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/ס֖וּס בַּ/חֲמִשִּׁ֣ים וּ/מֵאָ֑ה וְ֠/כֵן לְ/כָל מַלְכֵ֧י הַֽ/חִתִּ֛ים וּ/מַלְכֵ֥י אֲרָ֖ם בְּ/יָדָ֥/ם יוֹצִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: sw
  text: Waliagiza kutoka Misri gari moja la vita kwa shekeli mia sita za fedha,[a] na farasi mmoja kwa shekeli mia moja na hamsini. Vivyo hivyo, kupitia kwao,[b] waliwasafirishia magari na farasi wafalme wote wa Wahiti na wafalme wa Aramu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi zaidi, “Walipandisha na kutoa kutoka Misri.” Katika muktadha huu wa biashara, maneno hayo yana maana ya kuagiza bidhaa kutoka nchi nyingine.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kwa mkono wao,” yaani, kupitia kwao au kupitia kwa mawakala wao.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania “Aramu”; kwa kawaida katika tafsiri za kimapokeo, “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: Waliagiza kutoka Misri
  rationale: Vitenzi hivyo kwa maana ya msingi ni ‘walipandisha na kutoa kutoka Misri,’ lakini katika muktadha huu wa biashara vinaeleza kuingiza bidhaa kutoka Misri. ‘Waliagiza’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kuongeza kwamba wao wenyewe walizisafirisha.
- source_word: מֶרְכָּבָה
  choice: gari moja la vita
  rationale: Neno linamaanisha gari la kukokotwa lililotumiwa hasa vitani; umoja umetafsiriwa kama bidhaa moja yenye bei iliyotajwa.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: kwa shekeli mia sita za fedha
  rationale: Kiebrania kinataja kiasi cha fedha bila kutaja wazi kipimo; ‘shekeli’ imeongezwa kama kipimo kinachoeleweka katika muktadha.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: na farasi mmoja kwa shekeli mia moja na hamsini
  rationale: ‘Farasi’ ndiyo maana ya kawaida, na kipimo cha shekeli kilichodokezwa na bei ya kwanza kimerudiwa kwa uwazi katika Kiswahili.
- source_word: וְכֵן
  choice: Vivyo hivyo
  rationale: Kiunganishi kinaonyesha kuwa utaratibu huohuo wa biashara uliendelea kwa wafalme waliotajwa baadaye.
- source_word: בְּיָדָם
  choice: kupitia kwao
  rationale: Nahau ya Kiebrania, kihalisi ‘kwa mkono wao,’ inaonyesha wakala au njia iliyotumiwa. Tafsiri hii inahifadhi kiwakilishi chake bila kulazimisha utambulisho usiotajwa wazi katika mstari huu.
- source_word: יוֹצִיאוּ
  choice: waliwasafirishia
  rationale: Katika nusu ya pili ya mstari, kitenzi cha ‘kutoa’ kinaeleza kupeleka bidhaa hizo kwa wafalme wengine. ‘Waliwasafirishia’ huwasilisha mwelekeo wa biashara kwa Kiswahili cha kawaida bila kudai wazi tendo la kuuza.
- source_word: הַחִתִּים ... אֲרָם
  choice: Wahiti ... Aramu
  rationale: Majina ya watu na nchi yametoholewa moja kwa moja kutoka Kiebrania; ‘Aramu’ imetumiwa badala ya jina la baadaye ‘Siria.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Gari la vita’ linaepuka neno la mkopo lisilo la lazima; ‘waliagiza’ na ‘waliwasafirishia’ yanaweka wazi muktadha wa biashara huku tanbihi zikihifadhi vitenzi halisi vya Kiebrania. Kiwakilishi katika בְּיָדָם kimeachwa bila kubainishwa kupita kiasi ili kuhifadhi uwezekano wa marejeo yake.
