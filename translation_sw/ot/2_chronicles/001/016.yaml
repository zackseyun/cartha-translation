base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: sw
  text: Na chanzo cha farasi wa Sulemani kilikuwa Misri na Kue[a], na wafanyabiashara wa mfalme wangezipata kutoka Kue kwa bei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kutoka mahali pa kukusanyia”; neno la Kiebrania מִקְוֵא ni gumu, na linaweza kueleweka kuwa nomino ya kawaida badala ya jina la mahali, Kue.
    reason: alternative_reading
  - marker: b
    text: Kwa uelewa huo mwingine, sehemu ya mwisho inaweza kutafsiriwa, “na wafanyabiashara wa mfalme wangezinunua kutoka mahali pa kukusanyia kwa bei.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  choice: Na chanzo
  rationale: Neno מוֹצָא linaweza kumaanisha asili au chanzo; katika muktadha huu wa biashara, “chanzo” huhifadhi maana bila kulifanya moja kwa moja kuwa “uagizaji.”
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: farasi wa Sulemani
  rationale: Muundo wenye לִשְׁלֹמֹה unaonyesha umiliki au uhusiano; “farasi wa Sulemani” ni Kiswahili cha kawaida na sahihi.
- source_word: מִמִּצְרָיִם
  choice: Misri
  rationale: Hili ndilo jina la kawaida la mahali hapa katika Kiswahili.
- source_word: וּמִקְוֵא
  choice: na Kue
  rationale: Ingawa neno hili ni gumu, uelewa unaowezekana zaidi katika muktadha ni jina la mahali, sambamba na Misri; utata wake umeonyeshwa katika tanbihi.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: wafanyabiashara wa mfalme
  rationale: Kirai hiki kinawataja watu waliofanya biashara kwa niaba ya mfalme.
- source_word: מִקְוֵא
  choice: kutoka Kue
  rationale: Kutafsiri tukio la pili kwa uthabiti kama jina la mahali huhifadhi mtiririko wa sentensi, huku uwezekano wa maana ya ghala ukibainishwa katika tanbihi.
- source_word: יִקְחוּ
  choice: walikuwa wakiwapata
  rationale: Kitenzi לקח kimsingi ni “chukua,” lakini katika biashara humaanisha kupata au kununua; “kuwapata” huepuka kuongeza umahususi usio wazi kabisa katika kitenzi chenyewe.
- source_word: בִּמְחִיר
  choice: kwa bei
  rationale: Kirai hiki kinaonyesha malipo katika shughuli ya kibiashara; “kwa bei” ni usemi wa kawaida wa Kiswahili.
