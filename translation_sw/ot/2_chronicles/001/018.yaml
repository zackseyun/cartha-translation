base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: sw
  text: Solomoni akaamua[a] kujenga nyumba kwa ajili ya jina la Yahweh, na nyumba kwa ajili ya ufalme wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kiebrania ni “akasema kujenga”; katika muktadha huu msemo huo unaweza pia kueleweka kuwa “akaazimia” au “akaamuru kujenga.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hekalu kwa ajili ya jina la Yahweh, na ikulu kwa ajili ya ufalme wake.” Kiebrania hurudia neno “nyumba” katika vifungu vyote viwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akaamua
  rationale: Kitenzi hiki kwa kawaida humaanisha “akasema,” lakini kinapofuatwa na kitenzi-jina לִבְנוֹת (“kujenga”) katika muktadha huu kinaonyesha azimio la Solomoni. “Akaamua” ni Kiswahili cha kawaida na cha asili, huku maana halisi ikiwekwa katika tanbihi.
- source_word: לִבְנוֹת
  choice: kujenga
  rationale: Kitenzi-jina cha בנה humaanisha moja kwa moja “kujenga.”
- source_word: בַּיִת ... וּבַיִת
  choice: nyumba ... na nyumba
  rationale: Neno lilelile limerudiwa katika Kiebrania. Kulitafsiri kwa “nyumba” mara zote mbili kunahifadhi urudiaji huo; muktadha unaonyesha kuwa ya kwanza ni hekalu na ya pili ni ikulu.
- source_word: לְשֵׁם יְהוָה
  choice: kwa ajili ya jina la Yahweh
  rationale: Tafsiri hii inahifadhi msemo wa kitheolojia unaohusianisha nyumba hiyo na jina la Mungu, bila kudokeza kwamba Mungu angefungiwa ndani yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: לְמַלְכוּתוֹ
  choice: kwa ajili ya ufalme wake
  rationale: מַלְכוּת inaweza kumaanisha ufalme, umalkia, au utawala wa kifalme. “Ufalme wake” huhifadhi maana pana na inaeleweka kuwa nyumba inayohusiana na utawala wa Solomoni.
theological_decisions:
- issue: Msemo wa hekalu unaohusu jina la Mungu
  choice: kwa ajili ya jina la Yahweh
  alternative: kwa heshima ya Yahweh
  rationale: 'Tafsiri iliyochaguliwa inahifadhi kwa karibu msemo לְשֵׁם יְהוָה na mvutano wake wa kitheolojia: nyumba inajengwa kwa ajili ya jina la Yahweh, si kwa madai kwamba Mungu anaweza kufungiwa humo.'
- issue: Maana ya בַּיִת katika vifungu viwili
  choice: nyumba ... na nyumba
  alternative: hekalu ... na ikulu
  rationale: Kurudia “nyumba” kunafuata urudiaji wa neno moja katika Kiebrania na kuepuka kuingiza ufafanuzi wa kimuktadha moja kwa moja katika matini kuu.
- issue: Nguvu ya וַיֹּאמֶר ikifuatwa na kitenzi-jina
  choice: akaamua
  alternative: akasema; akaamuru
  rationale: Muundo unaweza kuwasilisha azimio au agizo. Muktadha haumtambui wazi mhusika aliyeamriwa, hivyo “akaamua” hutoa Kiswahili cha asili bila kuingiza mtendewa asiyeelezwa; maana ya neno kwa neno imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Akaamua kujenga” ni ya asili kuliko “akasema kujenga,” huku tanbihi ikihifadhi umbo na uwezekano wa Kiebrania. Urudiaji wa “nyumba” umehifadhiwa kimakusudi.
