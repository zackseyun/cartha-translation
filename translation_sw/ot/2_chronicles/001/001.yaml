  text: וַ/יִּתְחַזֵּ֛ק שְׁלֹמֹ֥ה בֶן דָּוִ֖יד עַל מַלְכוּת֑/וֹ וַ/יהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וַֽ/יְגַדְּלֵ֖/הוּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: sw
  text: Sulemani, mwana wa Daudi, akaimarika katika ufalme wake[a]. Yahweh[b], Mungu wake, alikuwa pamoja naye, akamfanya kuwa mkuu sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa imara juu ya ufalme wake,” au “akawa na nguvu katika ufalme wake.”
    reason: lexical_alternative
  - marker: b
    text: Jina la Kiebrania ni YHWH; limetolewa hapa kama “Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: akajitia nguvu
  rationale: 'Kauli hii inadumisha maana ya kujirejelea ya Hitpaeli ya חזק: Sulemani alijitia nguvu au akawa imara, bila kuibadili moja kwa moja kuwa kauli tendwa.'
- source_word: עַל מַלְכוּתוֹ
  choice: katika ufalme wake
  rationale: Ingawa עַל kwa msingi inaweza kumaanisha ‘juu ya,’ katika Kiswahili ‘katika ufalme wake’ hutoa kwa kawaida wazo la kuimarika kwake katika mamlaka ya kifalme; uwezekano wa ‘juu ya ufalme wake’ umehifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo ‘BWANA.’
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Muundo wa umilikishi umetafsiriwa moja kwa moja na kuhifadhi uhusiano wa kibinafsi unaoelezwa na Kiebrania.
- source_word: עִמּוֹ
  choice: alikuwa pamoja naye
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza uwepo na kibali cha Mungu.
- source_word: וַיְגַדְּלֵהוּ
  choice: akamfanya kuwa mkuu
  rationale: Huhifadhi maana ya kisababishi ya Pieli ya גדל, kwamba Yahweh ndiye aliyemfanya Sulemani awe mkuu.
- source_word: לְמָעְלָה
  choice: sana
  rationale: Katika muktadha huu neno lina nguvu ya kielezi kinachosisitiza kiwango; ‘sana’ ni Kiswahili cha asili na wazi.
- source_word: בֶן דָּוִיד
  choice: mwana wa Daudi
  rationale: Tafsiri ya moja kwa moja inayohifadhi uhusiano wa kifamilia na nasaba ya kifalme.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la pekee YHWH; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Utendaji katika kuimarika kwa Sulemani
  choice: Kuhifadhi kujitia nguvu kwa Sulemani na tendo la Mungu la kumfanya mkuu
  alternative: ‘akaimarishwa’ au ‘akawekwa imara’
  rationale: Kiebrania kinaweka pamoja kitendo cha kujirejelea cha Sulemani na tendo la Yahweh la kumkuza. Tafsiri haifuti mvutano huo kwa kuhusisha kila jambo na mhusika mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Akajitia nguvu’ huhifadhi maana ya kujirejelea, huku tanbihi ikionyesha uwezekano wa maana ya kuwa imara au kuimarika katika utawala.
