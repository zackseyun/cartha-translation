translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umerudia 'akafanya ... kuwa' ili kudumisha usambamba wa Kiebrania, na taswira ya 'kama mawe' imeachwa wazi badala ya kufasiriwa kupita kiasi.
