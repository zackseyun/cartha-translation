base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: sw
  text: Mfalme akafanya fedha na dhahabu kuwa nyingi Yerusalemu kama mawe[a], naye akafanya mierezi kuwa mingi kama mikuyu iliyo katika Shefela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafanya fedha na dhahabu Yerusalemu kuwa kama mawe.” Kiebrania kinaonyesha wingi wa ajabu kwa kutumia ulinganisho huu.
    reason: lexical_alternative
  - marker: b
    text: Shefela ni eneo la vilima vya chini vya Yuda, kati ya nchi ya milima na uwanda wa pwani. “Mikuyu” hapa ni mikuyu-sikomori iliyokuwa mingi katika eneo hilo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: akafanya ... kuwa nyingi / akafanya ... kuwa mingi
  rationale: 'Katika miundo hii, נָתַן ina maana ya kisababishi na matokeo: mfalme alisababisha vitu hivyo vipatikane kwa wingi. Tafsiri hii ni ya asili kwa Kiswahili kuliko ''akatoa'' au ''akaweka''.'
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: fedha na dhahabu
  rationale: Majina haya yanataja madini au mali kama vitu vya jumla; Kiswahili hakihitaji kuonyesha uarifu wa Kiebrania kwa viambishi maalumu.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Jina la mahali linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: כָּאֲבָנִים
  choice: kama mawe
  rationale: Huhifadhi kwa ufupi taswira halisi ya Kiebrania; katika muktadha, ulinganisho unaonyesha wingi usio wa kawaida.
- source_word: הָאֲרָזִים
  choice: mierezi
  rationale: Huhifadhi nomino ya miti iliyo katika wingi bila kuamua kimya kimya kwamba inamaanisha mbao za mierezi.
- source_word: כַּשִּׁקְמִים
  choice: kama mikuyu
  rationale: שִׁקְמִים ni mikuyu-sikomori ya eneo hilo. 'Mikuyu' ni neno la asili na linaloeleweka katika Kiswahili, huku tanbihi ikibainisha aina inayokusudiwa.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: iliyokuwa Shefela
  rationale: Shefela ni eneo maalumu la vilima vya chini vya Yuda, si tambarare yoyote tu; jina limehifadhiwa na kufafanuliwa katika tanbihi.
- source_word: לָרֹב
  choice: kuwa mingi
  rationale: Kirai hiki kinaonyesha wingi. Maana yake imejumuishwa kwa kawaida katika muundo wa ulinganisho wa Kiswahili.
