base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: sw
  text: Sasa nipe hekima na maarifa, ili nitoke na kuingia mbele ya watu hawa[a], kwa maana ni nani awezaye kuwahukumu watu wako hawa walio wengi?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania “kutoka na kuingia mbele ya watu” ni nahau ya kutekeleza uongozi wa hadharani.
    reason: cultural_note
  - marker: b
    text: Au “watu wako hawa wakuu.” Neno la Kiebrania linaweza kumaanisha walio wengi au walio wakuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha wakati na hatua mpya katika ombi la Sulemani; “Sasa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: חָכְמָה וּמַדָּע
  choice: hekima na maarifa
  rationale: 'Huhifadhi istilahi mbili tofauti: ustadi wa kutawala kwa busara na ujuzi au ufahamu.'
- source_word: תֶּן לִי
  choice: nipe
  rationale: Ni amri ya moja kwa moja yenye mtendewa wa nafsi ya kwanza, katika lugha ya kawaida lakini yenye heshima kwa muktadha wa ombi.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: ili nitoke na kuingia
  rationale: Maumbo haya yanaonyesha kusudi la ombi. Tafsiri inahifadhi taswira ya Kiebrania ya kutoka na kuingia kama kazi ya uongozi wa hadharani.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: mbele ya watu hawa
  rationale: לִפְנֵי ni “mbele ya”; hapa inaeleza nafasi ya mfalme anayeongoza watu bila kufuta taswira ya matini chanzi.
- source_word: מִי יִשְׁפֹּט
  choice: ni nani awezaye kuwahukumu
  rationale: Swali ni la balagha kuhusu uwezo. “Kuhukumu” huhifadhi maana ya msingi ya kitenzi, ambayo katika muktadha wa kifalme pia inahusisha kutawala na kusimamia haki.
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: watu wako hawa walio wengi sana
  rationale: Kivumishi הַגָּדוֹל kinaweza kuonyesha ukubwa, wingi, au ukuu. Katika muktadha wa kutoweza kuwahukumu watu wote, “walio wengi sana” ni Kiswahili cha kawaida kinachoonyesha ukubwa wa kundi; tanbihi inahifadhi maana pana zaidi.
theological_decisions:
- issue: Nahau ya uongozi katika ombi la Sulemani
  choice: Kudumisha “nitoke na kuingia mbele ya watu hawa” katika matini kuu
  alternative: “niwaongoze watu hawa” au “niwatawale watu hawa”
  rationale: Nahau ya Kiebrania inaonyesha utekelezaji wa uongozi wa hadharani. Kuihifadhi hulinda taswira ya chanzi, huku tanbihi ikifafanua kazi yake bila kuifanya tafsiri kuu kuwa ufafanuzi.
- issue: Maana ya הַגָּדוֹל kuhusu watu wa Mungu
  choice: “walio wengi sana”
  alternative: “walio wakuu” au “watu wako hawa wakubwa”
  rationale: Neno linaweza kuhusisha wingi na pia ukuu. Muktadha unaunga mkono wingi, lakini tanbihi inataja upana wa maana ili kutofunga kabisa mvutano wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa swali la balagha na nahau ya kifalme umehifadhiwa; tanbihi zinafafanua bila kuingiza msimamo wa kimadhehebu.
