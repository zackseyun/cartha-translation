base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: sw
  text: 'Sulemani akazungumza na Israeli wote: wakuu wa maelfu na wa mamia[a], waamuzi, kila kiongozi wa Israeli wote, na wakuu wa nyumba za baba.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maelfu na mamia huenda ni vitengo vya kijeshi au vya kiutawala.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania: “wakuu wa nyumba za baba.” Hii humaanisha viongozi wa koo au jamaa za upande wa baba; kirai hiki kinaweza pia kusomwa kama apposisheni kwa viongozi waliotangulia.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akazungumza na
  rationale: Kitenzi hiki kimsingi kina maana ya ‘alisema,’ lakini hapa kinafuatwa na watu wengi wanaoelekezewa maneno bila kunukuu yaliyosemwa. ‘Akazungumza na’ ni Kiswahili cha kawaida kinachofaa kwa hotuba ya hadhara bila kuongeza maneno ambayo hayapo.
- source_word: לְכָל יִשְׂרָאֵל
  choice: na Israeli wote
  rationale: ‘Israeli wote’ huhifadhi jina la kijumuiya la taifa badala ya kulibadili kuwa watu mmoja mmoja.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: wakuu wa maelfu na wa mamia
  rationale: ‘Wakuu’ linaweza kuonyesha viongozi au makamanda, huku ‘maelfu’ na ‘mamia’ yakihifadhi namna ya Kiebrania ya kutaja vitengo bila kuamua kimya kimya kama vilikuwa vya kijeshi au vya kiutawala.
- source_word: וְלַשֹּׁפְטִים
  choice: waamuzi
  rationale: Hili ni jina la kawaida la wenye jukumu la kuhukumu katika utawala wa Israeli.
- source_word: וּלְכֹל נָשִׂיא
  choice: na kila kiongozi
  rationale: ‘Kiongozi’ linaonyesha mamlaka ya נָשִׂיא bila kudokeza kimakosa kwamba wote walikuwa wana wa mfalme au wakuu wa kifalme.
- source_word: לְכָל יִשְׂרָאֵל
  choice: katika Israeli yote
  rationale: Katika nafasi hii kirai kinaonyesha upeo wa viongozi hao katika taifa lote na huepuka marudio yasiyo ya kawaida ya ‘wa Israeli wote.’
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa koo za mababu
  rationale: Hili ni tamko la asili na lenye heshima kwa viongozi wa vikundi vya ukoo vya upande wa baba. Pia huhifadhi sura ya kihistoria ya jamii hiyo kwa kutaja mababu badala ya kutumia neno pana tu ‘familia.’
theological_decisions:
- issue: Uhusiano wa רָאשֵׁי הָאָבוֹת na ‘kila kiongozi’
  choice: yaani wakuu wa koo za mababu
  alternative: na wakuu wa koo za mababu
  rationale: Kirai cha mwisho kinaeleweka vizuri zaidi kama ufafanuzi wa viongozi waliotangulia, lakini Kiebrania hakina kiunganishi kinachofanya uhusiano huo kuwa wazi kabisa. ‘Yaani’ hutoa Kiswahili kinachoeleweka, huku tanbihi ikitaja uwezekano wa kusoma kirai hicho kama kundi jingine.
- issue: Usemi wa kijamii הָאָבוֹת
  choice: koo za mababu
  alternative: jamaa za upande wa baba
  rationale: ‘Koo za mababu’ huhifadhi mwelekeo wa kiume wa muundo wa ukoo wa Kiebrania bila kuufanya usemi kuwa mzito au usio wa kawaida kwa wasomaji wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa, lakini alama ya nukta mbili na ‘yaani’ zimetumiwa ili sentensi ndefu ieleweke kwa urahisi. Maneno ya kiutawala yameachwa mapana pale ambapo chanzo hakiamui wazi kati ya wajibu wa kijeshi na wa kiraia.
