  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: sw
  text: Basi Sulemani na kusanyiko lote pamoja naye wakaenda kwenye mahali pa juu palipokuwa Gibeoni,[a] kwa sababu hema la kukutania la Mungu lilikuwa huko, ambalo Musa, mtumishi wa Yahweh, alilitengeneza nyikani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: maana hema la kukutania la Mungu lilikuwa huko.'
    reason: Njia nyingine ya kuwasilisha כִּי kama kiunganishi cha maelezo (“maana”) badala ya kishazi cha sababu chenye “kwa sababu.”
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: Kauli hii inaendeleza simulizi kwa tendo kuu linalofuata; “wakaenda” ni ya kawaida na haiongezi maana ya mwelekeo ambayo haimo wazi katika kitenzi.
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: Neno hili linamaanisha jumuiya iliyokusanyika; “kusanyiko” ni Kiswahili cha sasa na huhifadhi maana ya kundi zima bila kulifanya kuwa istilahi ya dhehebu.
- source_word: לַבָּמָה
  choice: mahali pa juu
  rationale: במה ni mahali pa juu palipotumiwa kwa ibada. Tafsiri hii ya moja kwa moja haiongezi hukumu hasi, hasa kwa kuwa hema la kukutania lilikuwa Gibeoni wakati huo.
- source_word: בְּגִבְעוֹן
  choice: huko Gibeoni
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili, na “huko” huonyesha mahali kwa lugha ya kawaida.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa neno linaeleza sababu ya kwenda Gibeoni; “kwa sababu” huwasilisha uhusiano huo wazi katika Kiswahili cha sasa.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hii ni istilahi ya mahali ambapo Mungu na watu wake walikutana kwa ibada; “hema la kukutania” ni wazi na huhifadhi picha halisi ya hema.
- source_word: הָאֱלֹהִים
  choice: la Mungu
  rationale: Huhifadhi kwa njia ya moja kwa moja uhusiano wa umilikaji/uhusishaji katika kirai cha Kiebrania.
- source_word: עָשָׂה
  choice: alikuwa amelijenga
  rationale: Tendo la Musa lilitangulia tukio kuu la simulizi. “Kulijenga” ni Kiswahili cha kawaida kwa kutengeneza hema hili kubwa la ibada.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahweh
  rationale: Katika muktadha huu עבד ni cheo cha heshima kinachoonyesha huduma ya Musa kwa Mungu, hivyo “mtumishi” linafaa kuliko “mtumwa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limehifadhiwa kwa kutoholewa, badala ya kubadilishwa kuwa cheo.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: “Nyikani” huonyesha eneo lisilokaliwa au lisilolimwa la kipindi cha Israeli jangwani bila kulazimisha maana ya jangwa la mchanga pekee.
theological_decisions:
- issue: Maana ya במה katika mazingira ya ibada halali kabla ya kujengwa kwa hekalu
  choice: mahali pa juu
  alternative: mahali pa ibada; madhabahu ya mwinuko
  rationale: Tafsiri ya moja kwa moja inadumisha mvutano wa kifungu bila kudokeza kwamba mahali hapo palikuwa haramu, kwa kuwa hema la kukutania lilikuwa huko wakati huo.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Kifungu kinatumia jina la agano lenyewe; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mwendo wa simulizi na istilahi halisi za mahali pa ibada, huku ikiepuka lugha ya kidhehebu.
