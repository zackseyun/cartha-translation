  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: sw
  text: Usiku huo Mungu alimtokea Sulemani na kumwambia[a], “Omba, nitakupa nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Omba, nikupe nini?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Usiku huo
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi rejeleo mahususi la wakati bila ukakasi wa tafsiri ya neno kwa neno.
- source_word: נִרְאָה
  choice: alimtokea
  rationale: Nifali ya ראה katika muktadha huu wa kutokea kwa Mungu ina maana ya ‘alitokea’; muundo huu ni wa asili katika Kiswahili na hauongezi wazo la kujifunua.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi, kitenzi chake ni cha umoja na muktadha unamrejelea Mungu mmoja.
- source_word: לִשְׁלֹמֹה
  choice: Sulemani
  rationale: Kiambishi ל humtambulisha Sulemani kama mtu aliyetokewa; katika Kiswahili uhusiano huo umeonyeshwa kwa kiambishi cha yambwa katika ‘alimtokea’.
- source_word: וַיֹּאמֶר לוֹ
  choice: na kumwambia
  rationale: Huwasilisha kwa kawaida mfululizo wa simulizi na mtu aliyeambiwa, huku ikidumisha maana ya אמר.
- source_word: שְׁאַל
  choice: Omba
  rationale: Katika muktadha wa kupewa kitu na Mungu, ‘omba’ ni amri ya moja kwa moja na ya kawaida; ‘uliza’ ingeweza kueleweka kama kutaka taarifa.
- source_word: מָה אֶתֶּן לָךְ
  choice: niku­pe nini
  rationale: Muundo ‘Omba nikupe nini’ ni wa kawaida katika Kiswahili na huhifadhi swali la wazi kuhusu kile Mungu atakachompa Sulemani.
theological_decisions:
- issue: Tafsiri ya אֱלֹהִים katika muktadha wa kutokea kwa Mungu
  choice: Mungu
  alternative: miungu
  rationale: Upatanisho wa kitenzi katika umoja na muktadha wa simulizi huthibitisha kuwa rejeleo ni la umoja, bila kuingiza dai la ziada la kimafundisho.
- issue: Nguvu ya אֶתֶּן baada ya amri שְׁאַל
  choice: Omba nikupe nini
  alternative: Omba, nitakupa nini?
  rationale: Kiswahili cha utegemezi kinaonyesha kusudi au jambo linaloombwa kwa ufasaha, huku tanbihi ikihifadhi namna iliyo karibu zaidi na muundo wa moja kwa moja wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Alimtokea’ na ‘kumwambia’ ni miundo ya kawaida ya simulizi; ‘omba’ huepuka maana ya kuuliza taarifa ambayo ‘uliza’ inaweza kuwa nayo.
