base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: sw
  text: Umepewa hekima na maarifa, nami nitakupa utajiri, mali, na heshima ambavyo hakuna wafalme waliokutangulia wamewahi kuwa navyo, wala wafalme watakaokufuata hawatakuwa navyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחָכְמָה
  choice: hekima
  rationale: Ni neno la kawaida na lenye hadhi kwa חָכְמָה, likidumisha maana ya uwezo wa kufikiri na kutenda kwa busara.
- source_word: הַמַּדָּע
  choice: maarifa
  rationale: מַדָּע humaanisha maarifa au ufahamu; “maarifa” linaendana kwa kawaida na “hekima” bila kuongeza tafsiri.
- source_word: נָתוּן לָךְ
  choice: umepewa
  rationale: Kauli tendwa ya hali iliyotolewa inaelezwa kwa Kiswahili cha kawaida kama “umepewa”; kiima kilichounganishwa hakihitaji upatanisho wa wingi katika muundo huu.
- source_word: עֹשֶׁר
  choice: utajiri
  rationale: Huwakilisha mali nyingi au ukwasi na kulitofautisha neno hili na נְכָסִים linalofuata.
- source_word: נְכָסִים
  choice: mali
  rationale: Ni neno wazi na la kawaida kwa vitu vinavyomilikiwa, bila ladha ya kitaalamu ya kifedha.
- source_word: כָבוֹד
  choice: heshima
  rationale: Katika muktadha wa zawadi za kifalme, “heshima” linafaa kuliko “utukufu,” ambalo lingeweza kudokeza utukufu wa kimungu.
- source_word: אֶתֶּן לָךְ
  choice: nitakupa
  rationale: Kauli isiyotimilika hapa ina maana ya ahadi ya wakati ujao.
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים
  choice: ambayo hakuna mfalme yeyote ... amewahi kuwa nayo
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida ulinganisho wa Kiebrania na unaweka dai hilo katika mipaka ya zawadi zilizotajwa.
- source_word: לְפָנֶיךָ
  choice: aliyekutangulia
  rationale: Hutoa wazi maana ya wakati na mfuatano wa kifalme.
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: wala hakuna atakayekuja baada yako atakayekuwa na vitu kama hivyo
  rationale: Hifadhi ulinganisho wa wakati ujao huku “vitu kama hivyo” vikirejelea zawadi zilizoorodheshwa, si ukuu wa jumla wa mtu.
theological_decisions:
- issue: Upeo wa ulinganisho wa kifalme
  choice: Kutokulingana kunahusu utajiri, mali na heshima zilizotajwa katika ahadi hii.
  alternative: Kudai kwamba Sulemani mwenyewe hangelinganishwa na mfalme mwingine katika kila jambo.
  rationale: Sarufi na muktadha huunganisha ulinganisho na zawadi zilizoorodheshwa; tafsiri haipanui dai kuwa hukumu kamili juu ya kila upande wa Sulemani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Umepewa” ni cha kawaida na wazi; “utajiri, mali na heshima” hudumisha tofauti za orodha ya Kiebrania. Muundo wa mwisho ni wa kiidiomatiki lakini hauondoi upeo wa ulinganisho.
