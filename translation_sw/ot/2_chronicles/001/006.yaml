  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: sw
  text: Sulemani akapanda huko hadi kwenye madhabahu ya shaba mbele za Yahwe[a], iliyokuwa katika eneo la hema la kukutania,[b] naye akatoa juu yake sadaka za kuteketezwa elfu moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yahwe.” Tafsiri nyingi za Kiswahili hutumia “BWANA” badala ya jina hili.'
    reason: alternative_reading
  - marker: b
    text: 'Au: “iliyokuwa ya hema la kukutania.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם
  choice: akapanda huko
  rationale: Kitenzi עָלָה kina maana ya kupanda au kwenda juu; hapa kinataja mwendo wa Sulemani kuelekea madhabahuni, huku שָׁם ikirejelea mahali palipotajwa katika muktadha.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: madhabahu ya shaba
  rationale: Hili ni neno la kawaida na linaloeleweka kwa madhabahu iliyotengenezwa kwa נְחֹשֶׁת; katika muktadha huu wa vifaa vya ibada, 'shaba' ni tafsiri mwafaka.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: '''Mbele za'' huonyesha kuwapo mbele ya mtu au katika uwepo wake, na Yahwe huhifadhi jina la Mungu lililo katika maandishi ya Kiebrania.'
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: iliyokuwa kwenye hema la kukutania
  rationale: Kiambishi לְ kinaweza kueleza mahali au uhusiano; katika sentensi hii tafsiri ya mahali ni ya asili, huku tanbihi ikihifadhi uwezekano wa maana ya umiliki au uhusiano.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: akatoa juu yake ... sadaka za kuteketezwa
  rationale: Katika lugha ya dhabihu, kitenzi hiki humaanisha kutoa sadaka madhabahuni. 'Sadaka za kuteketezwa' ni istilahi ya kawaida kwa עֹלוֹת na 'juu yake' huhifadhi rejeo la madhabahu.
- source_word: אָלֶף
  choice: elfu moja
  rationale: Ni idadi halisi inayotaja wingi wa sadaka alizotoa Sulemani.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה. 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
- issue: Uhusiano wa madhabahu na hema la kukutania
  choice: iliyokuwa kwenye hema la kukutania
  alternative: iliyokuwa ya hema la kukutania
  rationale: לְ inaweza kueleweka kimahali au kiuhusiano. Muktadha unaunga mkono maana ya mahali, lakini maana ya kuwa mali ya au kuhusishwa na hema haiondolewi kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo 'akapanda huko mpaka kwenye' huhifadhi mwelekeo wa kitenzi cha Kiebrania bila kuwa mgumu; 'hema la kukutania' na 'sadaka za kuteketezwa' ni istilahi za Biblia zilizo wazi kwa wasomaji wa kawaida.
