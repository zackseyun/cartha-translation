  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: sw
  text: Sasa, Ee Yahweh Mungu, neno lako kwa Daudi, baba yangu, lithibitike[a], kwa maana umenifanya kuwa mfalme juu ya watu wengi sana, kama mavumbi ya nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ahadi yako kwa Daudi, baba yangu, ithibitike.”
    reason: Muktadha unaruhusu דְּבָרְךָ kueleweka kuwa ahadi, ingawa matini kuu huhifadhi maana pana ya “neno.”
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kiashirio cha wakati na hatua mpya katika ombi la Sulemani; “Sasa” ni cha kawaida na cha moja kwa moja.
- source_word: יְהוָה אֱלֹהִים
  choice: Ee Yahweh Mungu
  rationale: “Yahweh” linawakilisha jina la agano יְהוָה, na “Mungu” linawakilisha אֱלֹהִים. “Ee” limeongezwa kwa kawaida ya Kiswahili kuonyesha kwamba maneno haya yanaelekezwa moja kwa moja kwa Mungu.
- source_word: יֵאָמֵן
  choice: na lithibitike
  rationale: Nifali ya אמן hapa ni ombi kwamba neno la Mungu liwe imara au lithibitishwe kuwa la kweli kwa kutimizwa.
- source_word: דְּבָרְךָ
  choice: neno lako
  rationale: Huhifadhi usemi mpana wa Kiebrania. Katika muktadha neno hilo ni ahadi, lakini tafsiri kuu haifanyi maana hiyo kuwa finyu bila ulazima.
- source_word: עִם דָּוִיד אָבִי
  choice: ulilomwambia Daudi baba yangu
  rationale: Ingawa עִם kwa kawaida ni “pamoja na,” katika muundo huu inaonyesha neno lililosemwa kwa Daudi. Kiswahili hiki kinaeleza uhusiano huo kwa kawaida.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha msingi wa ombi la Sulemani na kudumisha uhusiano wa kimantiki wa sentensi.
- source_word: הִמְלַכְתַּנִי
  choice: umenifanya kuwa mfalme
  rationale: 'Huhifadhi maana ya kisababishi ya hifili: Mungu ndiye aliyemweka Sulemani kuwa mfalme.'
- source_word: עַל עַם רַב
  choice: juu ya watu wengi
  rationale: רַב hapa inaelekea kuonyesha wingi kwa sababu inafuatwa na tashbihi ya mavumbi. “Watu wengi” ni Kiswahili cha kawaida.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: kama mavumbi ya dunia
  rationale: Huhifadhi tashbihi ya Kiebrania inayoonyesha idadi isiyohesabika, bila kuifanya kuwa kauli ya moja kwa moja.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo pekee. “Yahweh” hulihifadhi kwa uhamishaji wa sauti bila kulibadilisha kuwa cheo.
- issue: Iwapo דְּבָרְךָ lifafanuliwe kuwa “ahadi yako”
  choice: neno lako
  alternative: ahadi yako
  rationale: Muktadha unaonyesha kuwa neno hilo ni ahadi kwa Daudi, lakini Kiebrania kinasema kwa upana “neno lako.” Tafsiri kuu huhifadhi upana huo, huku tanbihi ikitoa maana ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sala umehifadhiwa kwa “Ee,” huku sentensi ikibaki wazi kwa msomaji wa kawaida.
