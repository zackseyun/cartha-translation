source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: sw
  text: Mungu akamwambia Sulemani, “Kwa kuwa jambo hili lilikuwa moyoni mwako, nawe hukuomba utajiri, mali, wala heshima, wala uhai wa wale wanaokuchukia[a], tena hukuomba siku nyingi[b], bali ulijiombea hekima na maarifa ili uwahukumu watu wangu ambao nimekuweka kuwa mfalme juu yao,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhai wa adui zako”; kwa maana halisi, “uhai wa wale wanaokuchukia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maisha marefu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Kwa kuwa
  rationale: Huonyesha sababu ya jibu la Mungu kwa Kiswahili cha kawaida na chenye heshima.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: jambo hili lilikuwa moyoni mwako
  rationale: Huhifadhi taswira ya Kiebrania ya moyo kama makao ya nia, bila kuifafanua zaidi kuwa ‘tamaa ya moyo wako.’
- source_word: עֹשֶׁר
  choice: utajiri
  rationale: Ni neno la kawaida na la moja kwa moja kwa wingi wa mali.
- source_word: נְכָסִים
  choice: mali
  rationale: Hulitofautisha kwa kiasi na ‘utajiri’ na linaeleweka kwa urahisi kuwa vitu au milki alizonazo mtu.
- source_word: כָבוֹד
  choice: heshima
  rationale: Katika muktadha wa kifalme humaanisha hadhi na staha, si lazima utukufu wa kidini.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: uhai wa wale wanaokuchukia
  rationale: Hufuata kwa karibu umoja wa נֶפֶשׁ na umbo la ‘wale wanaokuchukia,’ huku ‘uhai’ ikionyesha kwamba kinachomaanishwa ni kuuawa kwao.
- source_word: יָמִים רַבִּים
  choice: siku nyingi
  rationale: Huhifadhi usemi halisi wa Kiebrania na bado unaeleweka kama maisha marefu.
- source_word: חָכְמָה וּמַדָּע
  choice: hekima na maarifa
  rationale: Huhifadhi tofauti kati ya hekima na maarifa badala ya kuyachanganya kuwa dhana moja.
- source_word: לְךָ
  choice: ulijiombea
  rationale: Kitenzi cha kujirejelea kinaonyesha kwa Kiswahili cha asili kwamba Sulemani aliomba apewe yeye mwenyewe, bila kudokeza ubinafsi usio katika muktadha.
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: ili uwahukumu
  rationale: ‘Ili’ huwasilisha maana ya kusudi inayofaa katika muktadha, na ‘kuhukumu’ huhifadhi kitenzi cha Kiebrania badala ya kukipanua kuwa kutawala kwa jumla.
- source_word: הִמְלַכְתִּיךָ עָלָיו
  choice: nimekuweka kuwa mfalme juu yao
  rationale: Huonyesha kitendo cha Mungu cha kumtawaza au kumweka Sulemani kuwa mfalme juu ya watu wake.
theological_decisions:
- issue: Jina la msemaji wa kimungu אֱלֹהִים
  choice: Mungu
  alternative: BWANA
  rationale: Chanzo kina אֱלֹהִים (Elohim), si jina la agano YHWH; kwa hiyo ‘Mungu’ ndilo tafsiri sahihi hapa.
- issue: Maana ya kuhukumu watu wa Mungu
  choice: ili uwahukumu watu wangu
  alternative: ili uwatawale watu wangu
  rationale: ‘Kuhukumu’ huhifadhi maana ya msingi ya שׁפט na pia huacha muktadha wa kifalme utoe wazo pana la uongozi, bila kulifanya kuwa tafsiri kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘lilikuwa moyoni mwako’ umehifadhi taswira ya chanzo, na ‘ulijiombea’ umetumiwa kwa mtiririko wa asili. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
