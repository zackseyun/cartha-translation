base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: sw
  text: Sulemani akamwambia Mungu, “Umemtendea Daudi, baba yangu, kwa fadhili nyingi[a], nawe umenifanya kuwa mfalme mahali pake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umemwonyesha Daudi, baba yangu, upendo mkuu wa kudumu.” Neno la Kiebrania חֶסֶד linaweza kumaanisha fadhili, upendo wa kudumu, au uaminifu wa upendo, hasa katika mahusiano ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye ... akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida na kudumisha kwamba Sulemani alimwelekea Mungu kwa maneno haya.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Hapa אֱלֹהִים anamrejelea Mungu ambaye Sulemani anamwambia moja kwa moja; kiambishi cha yambwa katika “akamwambia” kinawasilisha לְ kwa kawaida.
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: Umemtendea ... kwa uaminifu mkuu wa agano
  rationale: Nahau hii inaeleza tendo la חֶסֶד kwa mtu. “Uaminifu mkuu wa agano” huhifadhi uzito wa uaminifu, upendo wa kudumu, na uhusiano wa agano katika muktadha wa Daudi; tanbihi inaacha wazi tafsiri nyingine zinazowezekana.
- source_word: דָּוִיד אָבִי
  choice: Daudi baba yangu
  rationale: Inafuata mpangilio wa Kiebrania na ni Kiswahili cha asili na kinachoeleweka.
- source_word: וְהִמְלַכְתַּנִי
  choice: nawe umenifanya kuwa mfalme
  rationale: Hiphil ya מלך ina maana ya kumsababisha mtu atawale au kumweka awe mfalme. Kauli hii huhifadhi wazi kwamba Mungu ndiye aliyempa Sulemani ufalme.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa urithi wa kifalme, maana ni kuchukua nafasi ya mtangulizi; “mahali pake” haisemi kwamba aliondolewa kwa nguvu.
theological_decisions:
- issue: Maana ya חֶסֶד katika uhusiano wa Mungu na Daudi
  choice: uaminifu mkuu wa agano
  alternative: fadhili nyingi; upendo mkuu usiokoma
  rationale: Muktadha unakumbusha uhusiano wa Mungu na Daudi na ahadi zake. Tafsiri iliyochaguliwa huonyesha upande wa uaminifu wa kimahusiano na wa agano bila kuficha kwamba neno hilo pia linaweza kueleweka kuwa fadhili au upendo thabiti; uwezekano huo umewekwa katika tanbihi.
- issue: Lugha ya urithi wa kifalme
  choice: umenifanya kuwa mfalme mahali pake
  alternative: umenitawaza baada yake; umenifanya nitawale badala yake
  rationale: Hii huhifadhi usababishi wa kitenzi na nafasi ya Sulemani kama mrithi wa Daudi, bila kuongeza dai jingine la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nawe” husisitiza kwa kiasi cha kawaida kwamba Mungu ndiye aliyemfanya Sulemani kuwa mfalme; tanbihi huhifadhi upana halisi wa חֶסֶד.
