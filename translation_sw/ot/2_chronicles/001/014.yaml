  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַֽ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירֽוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: sw
  text: Solomoni akakusanya magari ya vita na wapanda farasi[a]. Alikuwa na magari ya vita 1,400 na wapanda farasi 12,000; akawaweka katika miji ya magari ya vita[b] na pamoja na mfalme huko Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “askari wapanda farasi.” Neno la Kiebrania linarejelea watu waliopanda farasi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, miji iliyotengwa kwa kuhifadhi au kuweka magari ya vita na vikosi vilivyoyatumia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: akakusanya
  rationale: Kitenzi אסף humaanisha kukusanya; “akakusanya” ni cha kawaida na kinaonyesha kujumlisha rasilimali za kijeshi bila kuongeza namna zilivyopatikana.
- source_word: רֶכֶב
  choice: magari ya vita
  rationale: Katika muktadha huu רֶכֶב hurejelea magari ya kukokotwa yaliyotumiwa vitani. “Magari ya vita” ni wazi zaidi kwa msomaji wa sasa kuliko “magari” peke yake.
- source_word: פָּרָשִׁים
  choice: wapanda farasi
  rationale: Nomino hii kwa kawaida hurejelea watu waliopanda farasi, si farasi wenyewe. Tafsiri hii inadumisha maana halisi bila kutumia istilahi ya kisasa zaidi ya kijeshi kama “jeshi la wapanda farasi.”
- source_word: וַיְהִי לוֹ
  choice: alikuwa na
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuwasilisha nahau ya Kiebrania yenye maana ya kumiliki.
- source_word: וַיַּנִּיחֵם
  choice: akawaweka
  rationale: Katika muundo wa kusababisha wa kitenzi hiki, maana hapa ni kuwaweka au kuwapeleka katika maeneo yaliyotengwa. “Akawaweka” huepuka kuongeza kwa lazima wazo la kambi rasmi, huku muktadha wa kijeshi ukibaki wazi.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: katika miji ya magari ya vita
  rationale: Kirai hiki kinamaanisha miji iliyotengwa kwa kuhifadhi au kuweka magari ya vita na vikosi vyake; tanbihi inaeleza dhana hiyo ya kitamaduni.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלִָם
  choice: na kwa mfalme huko Yerusalemu
  rationale: Tafsiri hii inadumisha usemi mfupi wa Kiebrania, “pamoja na/kwa mfalme,” bila kuongeza neno “baadhi,” ambalo linaeleweka tu kutokana na mgawanyo katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. “Magari ya vita” limetumiwa badala ya “magari” ili kuzuia maana ya magari ya kisasa. Muundo wa sentensi unafuata kwa karibu uratibu wa Kiebrania bila kuwa mgumu katika Kiswahili.
