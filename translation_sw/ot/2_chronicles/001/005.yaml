  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: sw
  text: Nayo madhabahu ya shaba ambayo Besaleli, mwana wa Uri, mwana wa Huri, alikuwa ametengeneza, ilikuwa imewekwa mbele ya Maskani ya Yahweh; Sulemani na kusanyiko waliitafuta huko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimtafuta huko,” ikiwa kiambishi cha Kiebrania kinamrejelea Yahweh badala ya madhabahu.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: Nayo madhabahu ya shaba
  rationale: “Madhabahu” ni neno la kawaida la ibada kwa מִזְבַּח, na “shaba” linawasilisha נְחֹשֶׁת kwa lugha ya sasa. “Nayo” linaendeleza masimulizi na kuifanya madhabahu kuwa mada ya sentensi.
- source_word: אֲשֶׁר עָשָׂה
  choice: ambayo ... alikuwa ametengeneza
  rationale: Muundo huu unatambulisha madhabahu na kuonyesha kwa kawaida kwamba kuitengeneza kulitangulia tukio linalosimuliwa.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: Bezaleli mwana wa Uri, mwana wa Huri
  rationale: Majina yameandikwa kwa namna inayotamkika kwa Kiswahili, huku mfuatano wa ukoo wa Kiebrania ukihifadhiwa.
- source_word: שָׂם
  choice: ilikuwa pale
  rationale: Katika muktadha huu neno linaeleweka kwa kawaida kama kielezi “pale,” likieleza mahali madhabahu ilipokuwapo bila kuongeza mtendaji ambaye hakutajwa wazi.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: mbele ya Maskani ya Yahwe
  rationale: לִפְנֵי lina maana ya mahali, “mbele ya.” “Maskani” linahifadhi maana ya makao matakatifu ya מִשְׁכָּן, na jina יהוה limewasilishwa kama “Yahwe.”
- source_word: וַיִּדְרְשֵׁהוּ
  choice: waliitafuta huko
  rationale: Kiwakilishi cha Kiebrania ni cha kiume na kinaweza kurejelea madhabahu, nomino ya kiume iliyo karibu. “Waliitafuta” kinafuata usomaji huo; “huko” linaunganisha tendo hilo na mahali palipotajwa. Uwezekano wa kiwakilishi kumrejelea Yahwe umehifadhiwa katika tanbihi.
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: Sulemani na kusanyiko
  rationale: “Kusanyiko” linaeleza jamii iliyokusanyika kwa ibada bila kuongeza wazo lisilokuwapo la dhehebu au taasisi.
theological_decisions:
- issue: Kirejelewa cha kiambishi katika וַיִּדְרְשֵׁהוּ
  choice: 'Kiambishi kimerejelewa kwa madhabahu: “waliitafuta huko.”'
  alternative: 'Kiambishi kinaweza kumrejelea Yahwe: “walimtafuta huko.”'
  rationale: Nomino iliyo karibu zaidi ni “madhabahu,” nayo ni ya kiume katika Kiebrania; kwa hiyo inaweza kuwa kirejelewa cha kiambishi. Hata hivyo, דרשׁ hutumiwa mara nyingi kwa maana ya kumtafuta au kumwendea Mungu, na Yahwe ametajwa katika kishazi kilichotangulia. Tanbihi inadumisha utata huo badala ya kuufuta.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Maskani” limetumiwa kama istilahi ya ibada iliyo sahihi kwa מִשְׁכָּן, na alama ya tanbihi imewekwa moja kwa moja baada ya kishazi chenye utata.
