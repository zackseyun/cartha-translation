  text: וְ/לִ/בְנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֜ים בִּ/שְׂדֵ֨י מִגְרַ֤שׁ עָרֵי/הֶם֙ בְּ/כָל עִ֣יר וָ/עִ֔יר אֲנָשִׁ֕ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לָ/תֵ֣ת מָנ֗וֹת לְ/כָל זָכָר֙ בַּ/כֹּ֣הֲנִ֔ים וּ/לְ/כָל הִתְיַחֵ֖שׂ בַּ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: sw
  text: Na kwa wana wa Haruni[a], yaani makuhani, katika mashamba ya malisho ya miji yao[b], katika kila mji[c], kulikuwa na watu waliotajwa kwa majina[d] ili kutoa mafungu kwa kila mwanamume miongoni mwa makuhani na kwa kila aliyeandikishwa kwa nasaba miongoni mwa Walawi[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wa Haruni.” Kiebrania kinasema kihalisi “wana wa Haruni,” usemi wa ukoo unaoweza kuwajumuisha wazao wa vizazi vya baadaye.
    reason: lexical_alternative
  - marker: b
    text: Au, “maeneo ya wazi ya miji yao.” Haya yalikuwa maeneo yaliyozunguka miji na mara nyingi yalitumika kwa malisho.
    reason: cultural_note
  - marker: c
    text: Kiebrania kinasema kihalisi “kila mji na mji,” usemi unaosisitiza kila mji bila kuacha wowote.
    reason: lexical_alternative
  - marker: d
    text: Au, “walioteuliwa kwa majina” au “walioorodheshwa kwa majina.” Usemi wa Kiebrania unaonyesha watu waliotambulishwa rasmi na mahususi.
    reason: lexical_alternative
  - marker: e
    text: Yaani, kila mtu aliyeingizwa katika kumbukumbu za nasaba za Walawi.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: Na kwa wana wa Haruni, yaani makuhani
  rationale: “Wana wa Haruni” huhifadhi namna ya usemi wa Kiebrania, huku “yaani makuhani” ikionyesha kuwa maneno hayo yanawahusu makuhani wa ukoo wa Haruni.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: katika mashamba ya malisho ya miji yao
  rationale: Neno מִגְרָשׁ linamaanisha eneo la wazi lililozunguka mji na lililotumiwa hasa kwa malisho; tafsiri hii pia huhifadhi wazo la שְׂדֵי, “mashamba.”
- source_word: בְּכָל עִיר וָעִיר
  choice: katika kila mji
  rationale: Urudiaji wa Kiebrania “mji na mji” ni usemi wa kugawa unaomaanisha kila mji bila kuacha wowote; Kiswahili cha kawaida huwasilisha maana hiyo kwa “kila mji.”
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: watu waliotajwa kwa majina
  rationale: Usemi huu unaonyesha watu waliotambulishwa rasmi na mahususi kwa majina, bila kulazimisha maana finyu ya kuteuliwa au kuorodheshwa tu.
- source_word: לָתֵת מָנוֹת
  choice: ili kutoa mafungu
  rationale: מָנוֹת ni sehemu au mafungu ya mahitaji yaliyogawiwa; “kutoa mafungu” ni wazi na inafaa muktadha wa ugawaji.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: kwa kila mwanamume miongoni mwa makuhani
  rationale: זָכָר humaanisha mtu wa jinsia ya kiume; “miongoni mwa makuhani” huwasilisha kwa kawaida uhusiano wa kisehemu.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: na kwa kila aliyeandikishwa kwa nasaba miongoni mwa Walawi
  rationale: Kitenzi יחס katika umbo hili kinahusu kuingizwa au kutambuliwa katika kumbukumbu za nasaba, si kutajwa kwa ujumla tu.
