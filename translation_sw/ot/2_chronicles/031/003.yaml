id: 2CH.31.3
reference: 2 Chronicles 31:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: sw
  text: 'Fungu la mfalme kutoka katika mali yake mwenyewe lilikuwa kwa ajili ya sadaka za kuteketezwa: sadaka za kuteketezwa za asubuhi na jioni, na sadaka za kuteketezwa kwa ajili ya Sabato, sherehe za mwezi mpya[a], na sikukuu zilizowekwa[b], kama ilivyoandikwa katika Torati ya Yahweh[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sherehe za mwezi mpya” ni maadhimisho ya kila mwezi katika kalenda ya ibada ya Israeli.
    reason: cultural_note
  - marker: b
    text: Au “nyakati zilizowekwa” au “sikukuu zilizoteuliwa.”
    reason: lexical_alternative
  - marker: c
    text: Au “Sheria ya Yahweh” au “mafundisho ya Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: Fungu la mfalme
  rationale: מְנָה ni fungu au sehemu iliyotengwa; “fungu” ni Kiswahili cha kawaida kinachohifadhi wazo la mgao maalumu wa mfalme.
- source_word: מִן רְכוּשׁוֹ
  choice: kutoka katika mali yake mwenyewe
  rationale: רְכוּשׁ ni mali au vitu anavyomiliki; “yake mwenyewe” huonyesha wazi kuwa gharama ilitoka kwa mfalme binafsi.
- source_word: לָעֹלוֹת
  choice: kwa ajili ya sadaka za kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa yote; istilahi hii inaeleweka na kuhifadhi maana ya dhabihu hiyo.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: sadaka za kuteketezwa za asubuhi na jioni
  rationale: Uundaji huu wa asili unaonyesha sadaka za nyakati hizo mbili bila kufanya Kiswahili kuwa kizito.
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: na sadaka za kuteketezwa kwa ajili ya Sabato, sherehe za mwezi mpya, na sikukuu zilizowekwa
  rationale: שַׁבָּתוֹת ni Sabato; חֳדָשִׁים katika muktadha wa ibada ni maadhimisho ya mwezi mpya; מוֹעֲדִים ni nyakati au sikukuu zilizowekwa.
- source_word: כַּכָּתוּב
  choice: kama ilivyoandikwa
  rationale: Ni namna ya kawaida na sahihi ya kutaja agizo lililoandikwa.
- source_word: בְּתוֹרַת יְהוָה
  choice: katika Torati ya Yahweh
  rationale: תּוֹרָה hapa ni mafundisho au sheria iliyoandikwa inayohusu ibada; “Torati” huhifadhi neno la kibiblia, na jina la agano יְהוָה limetolewa kama “Yahweh.”
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina maalumu la agano, יְהוָה. “Yahweh” hulitofautisha na cheo cha “Bwana” na kulihifadhi kama jina.
- issue: Maana ya תּוֹרָה katika muktadha huu
  choice: Torati
  alternative: Sheria au mafundisho
  rationale: Muktadha unarejelea maagizo yaliyoandikwa kuhusu sadaka; “Torati” huhifadhi upana wa neno bila kulifanya kuwa sheria kwa maana finyu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na urudiaji wa “sadaka za kuteketezwa” umehifadhiwa kwa kiasi kinachofafanua sintaksia ya Kiebrania bila kufanya sentensi kuwa nzito.
