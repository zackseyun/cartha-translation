  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: sw
  text: Akawaambia watu, yaani wakazi wa Yerusalemu, watoe fungu la makuhani na Walawi, ili wajikite katika sheria ya Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili waimarike katika sheria ya Yahwe,” au, “ili waishike sheria ya Yahwe kwa uthabiti.” Neno יֶחֶזְקוּ linaweza kuonyesha kuimarika, kushika kwa nguvu, au kudumu kwa uthabiti; Kiebrania hakilazimishi maana moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pia akawaamuru
  rationale: Kitenzi hiki kwa msingi ni ‘akasema,’ lakini hapa kinaanzisha agizo la kifalme linalofuatwa na kitenzi-jina ‘watoe’; ‘akawaamuru’ huwasilisha nguvu ya kauli katika muktadha, na ‘pia’ huonyesha mwendelezo wa simulizi.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: watu, yaani wakazi wa Yerusalemu
  rationale: Kirai cha pili kinabainisha ni watu gani waliokusudiwa. ‘Yaani’ hufanya uhusiano huo wa ufafanuzi uwe wazi na wa kawaida katika Kiswahili.
- source_word: לָתֵת
  choice: watoe
  rationale: נתן hapa humaanisha kutoa; umbo ‘watoe’ linafuata kwa kawaida baada ya ‘akawaamuru’.
- source_word: מְנָת
  choice: fungu linalowastahili
  rationale: Neno מְנָה ni fungu au sehemu iliyotengwa kwa mtu. Katika muktadha huu ni fungu la kuwategemeza makuhani na Walawi ambalo lilikuwa haki yao.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: makuhani na Walawi
  rationale: Makundi yote mawili yametajwa tofauti katika Kiebrania na yanahifadhiwa hivyo.
- source_word: לְמַעַן
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi; ‘ili’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: יֶחֶזְקוּ
  choice: waweze kujitoa
  rationale: חזק inaweza kumaanisha kuwa imara, kushika kwa nguvu, au kudumu kwa uthabiti. Kwa kuwa watu wanatakiwa kuwapa mahitaji yao, ‘waweze kujitoa’ huonyesha kwamba msaada huo utawawezesha kudumu katika kazi inayotakiwa na sheria, bila kudai kuwa huo ndio uwezekano pekee wa maana.
- source_word: בְּתוֹרַת יְהוָה
  choice: kwa sheria ya Yahwe
  rationale: תורה hapa ni sheria au mafundisho ya agano; ‘sheria’ inafaa katika muktadha wa wajibu wa makuhani na Walawi. Jina יהוה limetafsiriwa kwa namna ya kulitamka kama ‘Yahwe,’ si kwa cheo.
theological_decisions:
- issue: Maana ya יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  choice: ili waweze kujitoa kwa sheria ya Yahwe
  alternative: ili waimarike katika sheria ya Yahwe; ili washikamane kwa uthabiti na sheria ya Yahwe
  rationale: Kirai hiki kinaweza kueleza kuimarishwa, kushikamana kwa uthabiti, au kuwezeshwa kujitoa kwa sheria. Muktadha wa kuwategemeza makuhani na Walawi unapendelea wazo la kuwawezesha kujitoa kwa wajibu wao, lakini tanbihi huhifadhi maana nyingine halisi.
- issue: Uwakilishi wa יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa msomaji wa kawaida. ‘Fungu linalowastahili’ linaeleza kwa ufupi kuwa sehemu hiyo ilikuwa haki iliyotengwa kwa makuhani na Walawi. Alama ya tanbihi imewekwa baada ya kirai chenye utata kinachofafanuliwa.
