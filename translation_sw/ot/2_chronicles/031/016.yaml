reference: 2 Chronicles 31:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד הִתְיַחְשָׂ֣/ם לִ/זְכָרִ֗ים מִ/בֶּ֨ן שָׁל֤וֹשׁ שָׁנִים֙ וּ/לְ/מַ֔עְלָ/ה לְ/כָל הַ/בָּ֥א לְ/בֵית יְהוָ֖ה לִ/דְבַר י֣וֹם בְּ/יוֹמ֑/וֹ לַ/עֲב֣וֹדָתָ֔/ם בְּ/מִשְׁמְרוֹתָ֖/ם כְּ/מַחְלְקוֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: sw
  text: mbali na wale walioorodheshwa katika nasaba miongoni mwa wanaume wenye umri wa miaka mitatu na zaidi[a]—wote wanaoingia katika nyumba ya Yahweh kwa mahitaji ya kila siku[b], kwa ajili ya huduma yao katika zamu zao[c], kufuatana na migawanyo yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale walioandikishwa kwa nasaba.”
    reason: Hutoa mbadala wa karibu wa usemi wa usajili wa nasaba bila kubadilisha kundi linalorejelewa.
  - marker: b
    text: Kiebrania kihalisi, “kwa jambo la siku katika siku yake,” yaani, hitaji la kila siku.
    reason: Inaonyesha muundo halisi wa nahau ya Kiebrania iliyorahisishwa katika matini kuu.
  - marker: c
    text: Au, “katika lindo zao” au “kwa zamu zao za kazi.”
    reason: מִשְׁמָרוֹת inaweza kumaanisha lindo, majukumu yaliyokabidhiwa, au zamu za kazi.
lexical_decisions:
- source_word: מִלְּבַד
  choice: mbali na
  rationale: Inaendeleza maana ya kutenganisha kundi hili na kundi lililotajwa katika muktadha, bila kuamua kupita kiasi ikiwa ni nyongeza tu au kutengwa kabisa.
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: wale walioandikishwa kwa nasaba miongoni mwa wanaume
  rationale: Kitenzi kinahusu usajili kwa kumbukumbu za ukoo, na לִזְכָרִים hutaja wazi wanaume waliohusika.
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: wenye umri wa miaka mitatu na zaidi
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa kiwango hiki cha umri.
- source_word: לְכָל הַבָּא
  choice: wote walioingia
  rationale: Huwakilisha kishirikishi cha Kiebrania chenye maana ya jumla na ya pamoja.
- source_word: לְבֵית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: Neno 'nyumba' linadumisha taswira ya בית, na jina la Mungu יְהוָה limetolewa kama Yahweh badala ya kubadilishwa kuwa cheo.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: kulingana na mahitaji ya kila siku
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kiutawala ya jambo au hitaji la siku husika, huku muundo halisi ukielezwa katika tanbihi.
- source_word: לַעֲבוֹדָתָם
  choice: ili kufanya huduma yao
  rationale: Katika mazingira ya hekalu עֲבוֹדָה ni huduma au kazi iliyokabidhiwa; 'huduma' ni pana bila kuingiza istilahi za baadaye za kanisa.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: katika zamu zao
  rationale: מִשְׁמָרוֹת hapa inaelekea kumaanisha zamu za kazi au ulinzi zilizopangwa; 'zamu' ni wazi na ya sasa.
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: kufuatana na migawanyo yao
  rationale: Inarejelea makundi yaliyopangwa ya makuhani au Walawi na kudumisha maana ya mpangilio wao rasmi.
theological_decisions:
- issue: Lugha inayobainisha jinsia ya wahudumu wa hekalu
  choice: miongoni mwa wanaume
  alternative: miongoni mwa watu
  rationale: Kiebrania kinatumia wazi nomino ya wingi inayomaanisha wanaume; tafsiri haipaswi kuififisha kuwa lugha isiyobainisha jinsia.
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kina jina maalumu la Mungu, hivyo 'Yahweh' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kisintaksia wa mstari huu na muktadha
  choice: kudumisha mwanzo wa kishazi 'mbali na'
  alternative: kuufanya mstari kuwa sentensi huru kwa kuongeza maneno
  rationale: Mstari wa Kiebrania unaendeleza muundo wa sentensi kutoka muktadha uliotangulia; kuongeza kiima au kitenzi kisichopo kungesuluhisha kimyakimya sintaksia yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari umeachwa kama kishazi kinachoendelea kutoka muktadha kwa sababu ndivyo ulivyo katika Kiebrania; alama ya mkato mrefu husaidia kufafanua kundi linalofuata bila kuongeza maneno ya chanzo.
