  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: sw
  text: Azaria, kuhani kiongozi wa nyumba ya Sadoki, akamwambia, “Tangu walipoanza kuleta mchango[a] katika nyumba ya Yahweh, tumekula na kushiba, na kuna mengi yaliyobaki, kwa maana Yahweh amewabariki watu wake. Kilichobaki ni ziada hii kubwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka”; neno la Kiebrania linamaanisha mchango uliotengwa kwa matumizi matakatifu.
    reason: Neno הַתְּרוּמָה linaweza kutafsiriwa “mchango” au “sadaka,” na linamaanisha kitu kilichotengwa kwa kusudi takatifu.
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: kuhani mkuu
  rationale: Huhifadhi maana ya kuhani mwenye nafasi ya uongozi bila kulazimisha cheo cha kiufundi kisichotajwa wazi katika Kiebrania.
- source_word: לְבֵית צָדוֹק
  choice: wa nyumba ya Sadoki
  rationale: Hueleza uhusiano wa Azaria na ukoo au jamaa ya kikuhani ya Sadoki kwa lugha ya kibiblia iliyo wazi.
- source_word: מֵהָחֵל
  choice: Tangu walipoanza
  rationale: Huonyesha mwanzo wa tendo na mwendelezo wa matokeo yake hadi wakati wa msemaji.
- source_word: הַתְּרוּמָה
  choice: mchango
  rationale: Neno linamaanisha kitu kilichotengwa na kutolewa kwa matumizi matakatifu; “mchango” linafaa katika muktadha wa vyakula na mali zilizoletwa hekaluni.
- source_word: לָבִיא בֵית יְהוָה
  choice: kuleta ... katika nyumba ya Yahweh
  rationale: Huwasilisha mwelekeo wa kuingiza mchango ndani ya eneo la hekalu kwa Kiswahili cha kawaida.
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: tumekula na kushiba
  rationale: Huhifadhi mtiririko wa kula na kutosheka, huku nafsi ya wingi ikitokana na msemaji anayewakilisha makuhani na Walawi.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: na tumebakiza kwa wingi
  rationale: Hueleza kwamba baada ya kula kulikuwa bado na ziada nyingi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: amewabariki watu wake
  rationale: Kauli timilifu inaeleza baraka ya Yahweh kama sababu ya wingi uliopo.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: Kilichobaki ni wingi huu mkubwa
  rationale: “Kilichobaki” hutenda kama nomino, na “wingi” linafaa zaidi kuliko “umati” kwa kuwa kinachozungumziwa ni ziada ya vitu, si kundi la watu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la agano moja kwa moja; “Yahweh” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Cheo cha Azaria הַכֹּהֵן הָרֹאשׁ
  choice: kuhani mkuu
  alternative: kuhani wa kwanza au kuhani kiongozi
  rationale: Tafsiri hii huhifadhi nafasi yake ya uongozi, lakini haisemi zaidi ya matini kuhusu maana ya baadaye ya cheo rasmi cha “kuhani mkuu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida na unaoeleweka, huku msamiati wa hekalu na ukoo ukihifadhiwa. Marudio ya וַיֹּאמֶר katika Kiebrania yamewasilishwa kwa kitenzi kimoja cha kusema ili kupata Kiswahili cha asili bila kupoteza taarifa.
