  source_fidelity: 'Tafsiri inafuata maana ya Kiebrania kwa ujumla: Azaria anatambulishwa kwa nasaba yake ya kikuhani, muda unaanza tangu michango ilipoletwa, makuhani wamekula na kushiba, kuna ziada, na baraka za Yahweh ndizo sababu. Hata hivyo, “tumebakiza kwa wingi” inaweza kumaanisha kwamba wao wenyewe waliweka kitu kando, ilhali וְהוֹתֵר hueleza ziada iliyobaki. Pia “kuhani mkuu” katika Kiswahili mara nyingi hueleweka kama cheo rasmi cha kuhani mkuu; “kuhani kiongozi” huhifadhi vizuri zaidi cheo cha uongozi kisichoelezwa kama cheo cha kiufundi.'
