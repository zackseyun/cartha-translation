base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: sw
  text: na kwa ajili ya usajili wa nasaba wa watoto wao wote wadogo, wake zao, wana wao, na binti zao, katika kusanyiko lote; kwa maana kwa uaminifu wao walijiweka wakfu katika utakatifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au, “walijitakasa kuwa watakatifu,” au “walidumisha utakatifu wao.” Kiebrania kinasisitiza wazo la utakatifu kwa kutumia kitenzi na nomino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: na pia kwa ajili ya kuandikishwa
  rationale: Kitenzi hiki katika Mambo ya Nyakati huhusu kuingizwa katika orodha za ukoo. “Kuandikishwa” ni Kiswahili cha kawaida kinachohifadhi wazo la usajili, huku tanbihi ikifafanua kipengele cha nasaba.
- source_word: בְּכָל טַפָּם
  choice: kwa watoto wao wote wadogo
  rationale: טַף hutaja hasa watoto wadogo, si watu wote wa nyumbani kwa ujumla.
- source_word: נְשֵׁיהֶם
  choice: wake zao
  rationale: Katika orodha hii ya familia, maana ya kimuktadha ni wake, wala si wanawake kwa ujumla.
- source_word: וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: wana wao na binti zao
  rationale: Kiebrania kinataja watoto wa kiume na wa kike kwa maneno tofauti; tafsiri inahifadhi utofautishaji huo.
- source_word: לְכָל קָהָל
  choice: kusanyiko lote
  rationale: קָהָל hapa ni jumuiya yote inayohusika katika mpango wa ugawaji na orodha. Muundo huu ni wa asili kuliko “kwa ajili ya kusanyiko lote” katika sentensi hii.
- source_word: בֶאֱמוּנָתָם
  choice: kwa uaminifu wao
  rationale: אֱמוּנָה katika muktadha huu huelekea kumaanisha uaminifu au kutegemeka katika wajibu mtakatifu, si hasa imani ya moyoni.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: walijiweka wakfu katika utakatifu
  rationale: Muundo unahifadhi wazo la kujitakasa au kujiweka wakfu pamoja na msisitizo wa nomino קֹדֶשׁ, bila kufanya Kiswahili kiwe kizito kupita kiasi.
theological_decisions:
- issue: Maana ya אֱמוּנָה katika muktadha wa ibada na usimamizi
  choice: uaminifu katika kutekeleza mambo matakatifu
  alternative: imani ya ndani au ya kiibada
  rationale: Muktadha unahusu usajili, ugawaji na wajibu wa kikuhani na Kilawi; kwa hiyo neno linaelekea kuonyesha kutegemeka na utiifu katika wajibu huo.
- issue: Nguvu ya יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: walijiweka wakfu katika utakatifu
  alternative: walijitakasa kuwa watakatifu / walidumisha utakatifu wao
  rationale: Kiebrania kinarudia wazo la utakatifu kwa kitenzi na nomino. Tafsiri iliyochaguliwa huhifadhi msisitizo huo bila kuamua kabisa kama tendo ni la kujiweka wakfu mara moja au la kuendelea kujitunza katika hali takatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. “Watoto wadogo,” “wake,” “wana,” na “binti” huhifadhi maelezo mahsusi ya Kiebrania. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
