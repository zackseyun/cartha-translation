  text: וַ/יַּ֧עַשׂ כָּ/זֹ֛את יְחִזְקִיָּ֖הוּ בְּ/כָל יְהוּדָ֑ה וַ/יַּ֨עַשׂ הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ וְ/הָ֣/אֱמֶ֔ת לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: sw
  text: Hezekia alifanya hivyo katika Yuda yote; akafanya yaliyo mema, yaliyo sawa, na yaliyo ya kweli[a] mbele za Yahwe, Mungu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yaliyo ya uaminifu.” Neno la Kiebrania linaweza kumaanisha ukweli, kutegemeka, au uaminifu; hapa huenda linaeleza mwenendo wa uaminifu au unaotegemeka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: alifanya hivyo
  rationale: Hufupisha kwa njia ya kawaida matengenezo na mipango iliyotajwa kabla, huku ikihifadhi kazi ya kauli ya Kiebrania ya kurejelea yaliyotangulia.
- source_word: בְּכָל יְהוּדָה
  choice: katika Yuda yote
  rationale: Huonyesha kwamba matendo hayo yalifanyika katika eneo lote la Yuda.
- source_word: הַטּוֹב
  choice: yaliyo mema
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino; tafsiri hii huonyesha mambo au matendo mema.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Katika muktadha wa maadili, neno hili humaanisha yanayofaa au yaliyo manyoofu; 'yaliyo sawa' ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: הָאֱמֶת
  choice: yaliyo ya kweli
  rationale: Huhifadhi maana ya msingi ya ukweli bila kuondoa uwezekano wa neno hilo kueleza uaminifu, kutegemeka, au mwenendo wenye uthabiti.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huonyesha matendo yaliyofanywa katika uwepo wa Mungu na chini ya tathmini yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa kulinakili kwa namna iliyozoeleka katika Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Huhifadhi kiambishi cha nafsi ya tatu umoja na uhusiano binafsi unaoelezwa katika Kiebrania.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; 'Yahwe' hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya הָאֱמֶת katika mfululizo wa maadili
  choice: yaliyo ya kweli
  alternative: yaliyo ya uaminifu
  rationale: Neno linaweza kumaanisha ukweli, kutegemeka, au uaminifu. Tafsiri kuu hudumisha maana yake ya moja kwa moja, na tanbihi huhifadhi uwezekano wa maana ya mwenendo wa uaminifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vipengele vitatu vya maadili umehifadhiwa, na alama ya tanbihi imewekwa mara tu baada ya kifungu kinachohusika.
