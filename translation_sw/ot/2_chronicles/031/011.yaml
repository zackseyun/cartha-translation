  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְחִזְקִיָּ֗הוּ לְ/הָכִ֧ין לְשָׁכ֛וֹת בְּ/בֵ֥ית יְהוָ֖ה וַ/יָּכִֽינוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: sw
  text: Kisha Hezekia akaamuru[a] vyumba[b] viandaliwe katika nyumba ya Yahwe, nao wakaviandaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasema vyumba viandaliwe.” Kitenzi cha Kiebrania kihalisi ni “akasema,” lakini hapa kinatanguliza agizo la mfalme.
    reason: lexical_alternative
  - marker: b
    text: Au, “vyumba vya pembeni”; katika muktadha huu vilikuwa vyumba vya kuhifadhia vitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akaamuru
  rationale: Kitenzi hiki kihalisi ni ‘akasema,’ lakini pamoja na לְהָכִין hapa kinatoa agizo la kifalme. ‘Akaamuru’ linaonyesha maana hiyo ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekia
  rationale: Hili ndilo umbo la jina hili linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: לְהָכִין
  choice: viandaliwe
  rationale: Hifili ya כון hapa ina maana ya kufanya kitu kiwe tayari. Kauli ya kutendwa inafaa baada ya ‘akaamuru’ na inaleta kwa kawaida yaliyomo katika agizo.
- source_word: לְשָׁכוֹת
  choice: vyumba
  rationale: Neno hili linamaanisha vyumba katika jengo la hekalu. Muktadha unaonyesha kuwa vilitumika kuhifadhia vitu, lakini kazi hiyo haijaelezwa moja kwa moja katika nomino yenyewe.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: Tafsiri hii inadumisha tamathali ya Kiebrania ‘nyumba ya Yahwe’ badala ya kuifafanua moja kwa moja kuwa hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo ‘BWANA.’ ‘Yahwe’ ni tahajia ya kawaida ya Kiswahili.
- source_word: וַיָּכִינוּ
  choice: nao wakaviandaa
  rationale: Kitenzi cha wingi kina yambwa ya wingi inayodokezwa na ‘vyumba.’ Kiambishi ‘-vi-’ kinakamilisha maana kwa Kiswahili cha asili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ linahifadhi jina hilo bila kulibadilisha kuwa cheo, huku likitumia tahajia inayofaa Kiswahili.
- issue: Nguvu ya agizo katika וַיֹּאמֶר
  choice: akaamuru
  alternative: akasema
  rationale: Kihalisi ni ‘akasema,’ lakini muundo unaofuata na nafasi ya Hezekia kama mfalme vinaonyesha kuwa usemi huo ni agizo. Tanbihi inahifadhi tafsiri ya moja kwa moja ili kutoondoa uwezekano wa kisemantiki wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa na unaoeleweka. ‘Nyumba ya Yahwe’ inadumisha taswira ya Kiebrania, na ‘nao wakaviandaa’ huonyesha wazi mrejeo wa yambwa uliodokezwa katika maandishi ya asili.
