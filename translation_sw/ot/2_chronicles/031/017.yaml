  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa nomino “uandikishaji ... kwa nasaba” umetumiwa kuhifadhi hali ya kishazi cha Kiebrania kilichobanwa; “jamaa za baba zao” huepuka tafsiri sisisi isiyo ya kawaida huku ikihifadhi mpangilio wa ukoo wa upande wa baba.
