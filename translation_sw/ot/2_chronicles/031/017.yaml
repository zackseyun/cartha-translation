base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: sw
  text: Uandikishaji wa makuhani kwa nasaba ulikuwa kwa kuzingatia nyumba za baba zao[a], na wa Walawi kuanzia umri wa miaka ishirini na zaidi, kulingana na majukumu yao katika migawanyiko yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale walioandikishwa kwa nasaba miongoni mwa makuhani ... na Walawi.” Tungo ya Kiebrania imebanwa na imeacha baadhi ya maneno yaeleweke kutokana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: “Migawanyiko” ni makundi rasmi ya Walawi yaliyopangwa kwa ajili ya majukumu yao ya utumishi.
    reason: cultural_note
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: uandikishaji ... kwa nasaba
  rationale: Kitenzi hiki kinahusu kuandikwa katika kumbukumbu rasmi kwa kufuata ukoo. Nomino ya kitendo inafaa kwa kuwa tungo ya Kiebrania imebanwa na haina kitenzi bayana katika kishazi hiki.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: kulingana na jamaa za baba zao
  rationale: Kirai hiki kinataja vikundi vya kifamilia vya ukoo wa upande wa baba vilivyotumiwa katika uandikishaji na upangaji wa utumishi. “Jamaa za baba zao” ni ya kawaida zaidi katika Kiswahili kuliko tafsiri sisisi “nyumba za baba zao.”
- source_word: וְהַלְוִיִּם
  choice: na wa Walawi
  rationale: “Wa” linarejelea uandikishaji uliotajwa awali na kuonyesha ulinganifu wa kishazi bila kuongeza kitenzi kisichotajwa wazi katika Kiebrania.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: kuanzia umri wa miaka ishirini na zaidi
  rationale: Hiki ni kirai cha kawaida kinachoweka kiwango cha chini cha umri; tafsiri hii ni wazi na ya asili katika Kiswahili cha sasa.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: kulingana na majukumu yao
  rationale: Nomino inaweza kumaanisha uangalizi, wajibu au zamu ya utumishi. Katika muktadha huu “majukumu” inadumisha maana pana ya kazi walizokabidhiwa.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: katika migawanyiko yao
  rationale: Inarejelea makundi rasmi ambayo kwayo Walawi walipangwa kwa ajili ya utumishi.
