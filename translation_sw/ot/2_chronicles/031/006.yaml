  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: sw
  text: Nao watu wa Israeli na Yuda waliokaa katika miji ya Yuda walileta pia sehemu ya kumi ya ng’ombe na mifugo midogo,[a] na sehemu ya kumi ya vitu vitakatifu vilivyowekwa wakfu kwa Yahweh Mungu wao; wakaviweka katika marundo, rundo juu ya rundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno linalomaanisha mifugo midogo kwa ujumla, hasa kondoo na mbuzi.
    reason: lexical_scope
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: watu wa Israeli na Yuda
  rationale: בני ina maana ya watu au wanajamii kwa ujumla katika muktadha huu, si wanaume pekee; usemi huu ni wa kawaida na unaendeleza maana ya jumuiya.
- source_word: הַיֹּשְׁבִים בְּעָרֵי יְהוּדָה
  choice: waliokaa katika miji ya Yuda
  rationale: Kitenzi ישב hapa kinaeleza makazi ya kudumu; “waliokaa” ni Kiswahili cha kawaida na “miji” hufuata עָרֵי.
- source_word: גַּם הֵם
  choice: walileta pia
  rationale: “Pia” huonyesha kwamba wakazi hawa nao walishiriki, huku mpangilio wa Kiswahili ukisomeka kwa urahisi.
- source_word: מַעְשַׂר
  choice: sehemu ya kumi
  rationale: Hii inaeleza wazi maana ya msingi ya kultiki ya מַעְשַׂר kwa wasomaji wa kawaida bila kutegemea istilahi isiyoeleweka kwa wote.
- source_word: בָּקָר וָצֹאן
  choice: ng’ombe na kondoo na mbuzi
  rationale: בקר ni ng’ombe, na צאן ni mifugo midogo inayoweza kujumuisha kondoo na mbuzi; kuwataja wote kunahifadhi upana wa neno la Kiebrania.
- source_word: וּמַעְשַׂר קָדָשִׁים
  choice: pamoja na sehemu ya kumi ya vitu vitakatifu
  rationale: קָדָשִׁים hapa ni vitu vilivyotengwa kuwa vitakatifu; tafsiri hii haibainishi zaidi aina ya vitu kuliko chanzo.
- source_word: הַמְקֻדָּשִׁים
  choice: vilivyowekwa wakfu
  rationale: Kauli tendwa ya קדש inaonyesha vitu vilivyotengwa rasmi kwa Mungu; “kuwekwa wakfu” huhifadhi maana hiyo ya kidini.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: kwa Yahweh Mungu wao
  rationale: Kiambishi ל kinaonyesha kuwa vitu hivyo viliwekwa wakfu kwa Mungu, na jina יהוה limetolewa kama Yahweh.
- source_word: הֵבִיאוּ
  choice: walileta
  rationale: Hifili ya בוא ina maana ya moja kwa moja ya kuleta katika muktadha huu.
- source_word: וַיִּתְּנוּ
  choice: wakavipanga
  rationale: נתן inaweza kumaanisha kuweka; kwa kuwa kinachofuata ni marundo, “wakavipanga” hutoa picha ya kuviweka katika marundo bila kuongeza tendo jipya.
- source_word: עֲרֵמוֹת עֲרֵמוֹת
  choice: katika marundo, rundo juu ya rundo
  rationale: Kurudiwa kwa nomino kunasisitiza wingi au mfululizo wa marundo; usemi huu unahifadhi marudio na msisitizo wa Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya קָדָשִׁים katika sehemu ya kumi
  choice: vitu vitakatifu vilivyowekwa wakfu
  alternative: zawadi takatifu au vitu vilivyowekwa wakfu
  rationale: Maandishi hayataji kwa usahihi aina ya vitu hivyo; tafsiri pana inadumisha kutobainika huko badala ya kuvifanya aina fulani ya sadaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtiririko wa simulizi, tofauti kati ya mifugo na vitu vitakatifu, pamoja na msisitizo wa marundo mengi.
