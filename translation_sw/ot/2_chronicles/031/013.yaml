base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: sw
  text: Yehieli, Azazia, Nahathi, Asaheli, Yerimothi, Yozabadi, Elieli, Ismakia, Mahathi na Benaya walikuwa maofisa chini ya mamlaka ya Konania na ndugu yake Shimei.[a] Waliteuliwa kwa agizo la[b] Mfalme Hezekia na Azaria, kiongozi wa nyumba ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “chini ya mkono wa Konania na ndugu yake Shimei.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa uteuzi wa” au “chini ya usimamizi wa” Mfalme Hezekia na Azaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: maofisa
  rationale: Neno hili linaonyesha watu waliowekwa rasmi kuwa na wajibu wa kiutawala; “maofisa” ni la kawaida na haliongezi cheo kisichotajwa.
- source_word: מִיַּד
  choice: chini ya mamlaka ya
  rationale: Ingawa kihalisi ni “kutoka/chini ya mkono wa,” hapa ni nahau inayoonyesha usimamizi au mamlaka.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Hili ni dokezo la moja kwa moja la uhusiano wa Shimei na Konania; Kiswahili “ndugu” huhifadhi maana bila kubainisha zaidi ya Kiebrania.
- source_word: בְּמִפְקַד
  choice: kwa agizo la
  rationale: Neno linaweza kumaanisha agizo, uteuzi, au usimamizi; “kwa agizo la” linaonyesha idhini rasmi huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: נְגִיד
  choice: kiongozi
  rationale: Neno humaanisha mwenye uongozi au mkuu; “kiongozi” linafaa katika mazingira ya usimamizi wa nyumba ya Mungu bila kudokeza cheo cha kifalme.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hufuata kwa karibu usemi wa Kiebrania na ni jina linaloeleweka la hekalu.
- source_word: יְחִיאֵל; עֲזַזְיָהוּ; נַחַת; עֲשָׂהאֵל; יְרִימוֹת; יוֹזָבָד; אֱלִיאֵל; יִסְמַכְיָהוּ; מַחַת; בְּנָיָהוּ; כּוֹנַנְיָהוּ; שִׁמְעִי; יְחִזְקִיָּהוּ; עֲזַרְיָהוּ
  choice: Yehieli; Azazia; Nahathi; Asaheli; Yerimothi; Yozabadi; Elieli; Ismakia; Mahathi; Benaya; Konania; Shimei; Hezekia; Azaria
  rationale: Majina yamenukuliwa kwa maumbo yanayotamkika katika Kiswahili sanifu na yanayoendana kwa karibu na Kiebrania.
theological_decisions:
- issue: Hadhi ya vyeo vya kiutawala vya hekalu
  choice: Kutumia “maofisa” na “kiongozi” kama maneno ya kawaida ya kiutawala
  alternative: “wasimamizi,” “wakuu,” au “mtawala”
  rationale: Mstari unaeleza mpangilio wa usimamizi, si lazima daraja maalumu la kikuhani au kifalme; tafsiri haipaswi kuongeza hadhi ambayo matini haijabainisha.
- issue: Maana ya בְּמִפְקַד
  choice: “kwa agizo la” katika matini
  alternative: “kwa uteuzi wa” au “chini ya usimamizi wa”
  rationale: Kiebrania kinaweza kuelekeza kwenye amri, uteuzi, au usimamizi. Chaguo kuu ni la asili katika Kiswahili, na tanbihi inahifadhi upana wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. Mpangilio wa majina na mnyororo wa mamlaka umehifadhiwa; nahau ya Kiebrania imewasilishwa kwa Kiswahili cha kawaida na maana zake mbadala zimewekwa katika tanbihi.
