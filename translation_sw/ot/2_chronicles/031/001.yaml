source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: sw
  text: Baada ya hayo yote kumalizika, Waisraeli wote waliokuwapo wakaenda katika miji ya Yuda. Wakazivunja nguzo za ibada, wakayakata Maashera[a], wakabomoa maeneo ya juu ya ibada na madhabahu kotekote katika Yuda na Benyamini, na pia katika Efraimu na Manase, mpaka walipoviharibu kabisa. Kisha wana wote wa Israeli wakarudi, kila mtu kwenye milki yake, katika miji yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo za Ashera.” Neno la Kiebrania linaweza kumaanisha vitu vya ibada vilivyohusishwa na Ashera, ambavyo mara nyingi hueleweka kuwa nguzo za mbao au miti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: Baada ya hayo yote kumalizika
  rationale: Kirai cha wakati chenye כְּ na kitenzi-jina kinaonyesha wakati wa kukamilika kwa mambo hayo. Muundo huu wa Kiswahili ni wa kawaida na haumtaji mtendaji ambaye Kiebrania hakumtaji.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: Waisraeli wote waliokuwapo
  rationale: הַנִּמְצְאִים humaanisha wale waliopatikana au waliokuwapo; katika muktadha ni Waisraeli waliohudhuria.
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: Wakazivunja nguzo za ibada
  rationale: מַצֵּבוֹת ni mawe au nguzo zilizosimamishwa kwa matumizi ya kidini. Nyongeza 'za ibada' huweka wazi maana ya kimuktadha bila kuzichanganya na nguzo za kawaida.
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: wakayakata maashera
  rationale: אֲשֵׁרִים ni wingi wa vitu vya ibada vinavyohusishwa na Ashera, lakini umbo lake halijabainishwa kikamilifu. Uhamishaji wa jina kama 'maashera' huhifadhi kutobainika huko, huku tanbihi ikitoa tafsiri mbadala.
- source_word: וַיְנַתְּצוּ אֶת הַבָּמוֹת וְאֶת הַמִּזְבְּחֹת
  choice: na kubomoa mahali pa juu pa ibada na madhabahu
  rationale: בָּמוֹת ni maeneo yaliyoinuka ya ibada, si tu sehemu yoyote ya juu. 'Kubomoa' huonyesha nguvu ya נָתַץ.
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: kotekote katika Yuda na Benyamini, na pia katika Efraimu na Manase
  rationale: Kirai kinaonyesha upeo wa uondoaji katika maeneo hayo. 'Kotekote' huwasilisha maana ya מִכָּל kwa Kiswahili cha kawaida, huku tofauti ndogo ya vihusishi vya Kiebrania isilete Kiswahili kigumu.
- source_word: עַד לְכַלֵּה
  choice: mpaka walipoviharibu kabisa
  rationale: Kitenzi-jina kinaonyesha kukamilisha tendo. Kiwakilishi 'vi-' kinarejelea kwa ujumla vitu na maeneo ya ibada vilivyotajwa.
- source_word: וַיָּשׁוּבוּ כָּל בְּנֵי יִשְׂרָאֵל אִישׁ לַאֲחֻזָּתוֹ
  choice: Kisha wana wote wa Israeli wakarudi, kila mtu kwenye milki yake
  rationale: '''Wana wa Israeli'' huhifadhi umbo la בְּנֵי יִשְׂרָאֵל, na ''kila mtu'' huonyesha אִישׁ ya mgawanyo. אֲחֻזָּה ni milki au shamba linaloshikiliwa, mara nyingi la kifamilia.'
- source_word: לְעָרֵיהֶם
  choice: katika miji yao
  rationale: Wingi wa Kiebrania unaonyesha kwamba walirudi katika miji yao mbalimbali; muundo huu unaendana na kirai cha awali cha mgawanyo.
theological_decisions:
- issue: Jina la jumuiya lenye umbo la kiume na kauli ya mgawanyo
  choice: wana wote wa Israeli ... kila mtu kwenye milki yake
  alternative: Waisraeli wote ... kila mmoja kwenye milki yake
  rationale: Kiebrania kinatumia בְּנֵי, 'wana,' na אִישׁ, 'mtu/mwanamume,' kwa uwazi. Tafsiri imehifadhi umbo hilo bila kuongeza dai kwamba wanawake hawakuhesabiwa katika jumuiya.
- issue: Utambulisho na umbo la אֲשֵׁרִים
  choice: maashera
  alternative: nguzo za Ashera
  rationale: Neno linaweza kumaanisha vitu vya ibada vilivyohusishwa na Ashera, mara nyingi miti au nguzo za mbao, lakini umbo halijaainishwa kwa lazima katika aya. Uhamishaji wa jina pamoja na tanbihi huhifadhi mvutano huo wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi vya simulizi umetolewa kwa viambishi vya ka-, na sentensi ndefu imegawanywa ili isomeke kwa urahisi bila kubadili mfuatano wa matukio.
