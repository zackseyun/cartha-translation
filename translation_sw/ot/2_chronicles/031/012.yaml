  text: וַ/יָּבִ֨יאוּ אֶת הַ/תְּרוּמָ֧ה וְ/הַֽ/מַּעֲשֵׂ֛ר וְ/הַ/קֳּדָשִׁ֖ים בֶּ/אֱמוּנָ֑ה וַ/עֲלֵי/הֶ֤ם נָגִיד֙ כונניהו הַ/לֵּוִ֔י וְ/שִׁמְעִ֥י אָחִ֖י/הוּ מִשְׁנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: sw
  text: Nao wakaleta kwa uaminifu mchango, zaka na vitu vitakatifu[a]. Konania Mlawi alikuwa msimamizi mkuu wa vitu hivyo, naye Shimei ndugu yake alikuwa wa pili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vilivyowekwa wakfu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Shimei ndugu yake alikuwa wa pili katika uongozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: wakaleta
  rationale: Hifili ya בוא ina maana ya kuleta au kuingiza. Katika muktadha wa maghala ya Hekalu, “wakaleta” ni ya kawaida na haiongezi maelezo yasiyotajwa wazi.
- source_word: הַתְּרוּמָה
  choice: mchango
  rationale: תְּרוּמָה ni kitu kilichotengwa na kutolewa kwa matumizi matakatifu; “mchango” ni neno la sasa na linaloeleweka bila kuingiza istilahi maalumu ya kiibada.
- source_word: הַמַּעֲשֵׂר
  choice: zaka
  rationale: מַעֲשֵׂר ni sehemu ya kumi inayotolewa kwa Mungu; “zaka” ndiyo istilahi ya kawaida ya kibiblia katika Kiswahili.
- source_word: הַקֳּדָשִׁים
  choice: vitu vitakatifu
  rationale: Wingi wa קֹדֶשׁ hapa unaashiria vitu vilivyotengwa kwa matumizi matakatifu. Tafsiri hii ni ya moja kwa moja na inadumisha upana wa neno la Kiebrania.
- source_word: בֶּאֱמוּנָה
  choice: kwa uaminifu
  rationale: Katika muktadha wa usimamizi, אֱמוּנָה huonyesha uaminifu au utegemewaji. “Kwa uaminifu” inaeleza namna walivyovileta na kuvishughulikia.
- source_word: וַעֲלֵיהֶם
  choice: msimamizi ... wa vitu hivyo
  rationale: על pamoja na kiwakilishi huonyesha mamlaka au usimamizi juu ya vitu vilivyotajwa. Kiswahili hiki kinaweka wazi rejeo lisilo na jinsia la “vitu hivyo.”
- source_word: נָגִיד
  choice: msimamizi mkuu
  rationale: נָגִיד humaanisha mtu aliyewekwa kuongoza au kusimamia. “Msimamizi mkuu” linafaa kwa mazingira ya kiutawala ya Hekalu bila kudokeza ufalme.
- source_word: כונניהו
  choice: Konania
  rationale: Jina limetoholewa kwa mtindo wa kawaida wa majina ya kibiblia katika Kiswahili.
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Kibainishi cha Kiebrania kinamtambulisha Konania kwa hadhi yake ya Kilawi; “Mlawi” ni umbo la kawaida la Kiswahili.
- source_word: אָחִיהוּ
  choice: ndugu yake
  rationale: אָח kwa kawaida humaanisha ndugu wa kiume, na muktadha hautoi sababu ya kulipanua kuwa jamaa.
- source_word: מִשְׁנֶה
  choice: wa pili
  rationale: מִשְׁנֶה humaanisha afisa wa daraja la pili au naibu. “Wa pili” inadumisha ufupi wa Kiebrania, huku tanbihi ikifafanua maana ya cheo.
