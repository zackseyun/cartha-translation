translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Malundo” linahifadhi taswira halisi ya mazao yaliyokusanywa. Muundo “wakayamaliza” unaunganisha kwa ulaini hatua ya mwisho na mwanzo uliotajwa katika kishazi cha kwanza.
