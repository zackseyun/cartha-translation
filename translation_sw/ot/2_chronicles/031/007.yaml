  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: sw
  text: Katika mwezi wa tatu walianza kuweka msingi wa malundo[a][b], na katika mwezi wa saba wakayamaliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “marundo.” Neno la Kiebrania linamaanisha malundo ya mazao yaliyokusanywa na kutolewa kama michango.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya karibu, “walianza kuyaanzisha malundo kwa kuweka msingi.” Huu ni msemo unaoeleza kwamba walianza kutengeneza malundo kutoka sehemu yake ya chini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: Katika mwezi wa tatu
  rationale: חֹדֶשׁ katika taarifa hii ya wakati humaanisha mwezi; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הֵחֵלּוּ
  choice: walianza
  rationale: Kitenzi hiki katika muundo huu kina maana ya kuanza.
- source_word: הָעֲרֵמוֹת
  choice: malundo
  rationale: עֲרֵמוֹת ni vitu vilivyokusanywa na kurundikwa; hapa ni malundo ya mazao yaliyotolewa kama michango katika muktadha.
- source_word: לְיִסּוֹד
  choice: kuweka msingi wa
  rationale: Kiswahili hiki cha kawaida kinaonyesha hatua ya kwanza ya kuanzisha malundo, huku kikihifadhi picha halisi ya msingi iliyomo katika יסד.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: na katika mwezi wa saba
  rationale: Huu ni mwendelezo wa moja kwa moja wa taarifa ya wakati.
- source_word: כִּלּוּ
  choice: wakayamaliza
  rationale: Piel ya כלה humaanisha kukamilisha au kumaliza. Kiambishi -ya- kinaonyesha wazi kuwa yaliyomalizwa ni malundo, ingawa Kiebrania kinaacha yambwa likieleweka kutokana na muktadha.
