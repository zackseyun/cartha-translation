id: 2CH.31.14
reference: 2 Chronicles 31:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: sw
  text: Kore mwana wa Imna, Mlawi aliyekuwa mlinzi wa lango upande wa mashariki, alikuwa msimamizi wa matoleo ya hiari kwa ajili ya Mungu, ili kugawa[a] mchango wa Yahwe na vitu vitakatifu sana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoa”; kitenzi cha Kiebrania kinamaanisha kihalisi “kutoa,” lakini hapa kinahusu kuwagawia walengwa vitu vilivyowekwa wakfu.
    reason: lexical_alternative
  - marker: b
    text: Au “matoleo matakatifu sana.” Usemi wa Kiebrania unamaanisha vitu vilivyo na utakatifu wa kiwango cha juu; hapa haumaanishi lazima Patakatifu pa Patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: Kore mwana wa Imna
  rationale: Majina yamenukuliwa kwa namna inayolingana na matamshi ya Kiswahili, na muundo wa ukoo wa Kiebrania umehifadhiwa kwa lugha ya kawaida.
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mtu wa kabila na huduma ya Walawi; hali ya urejezi maalumu inatokana wazi na kumtaja Kore.
- source_word: הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: aliyekuwa mlinzi wa lango upande wa mashariki
  rationale: שׁוֹעֵר ni ofisa anayelinda lango, na לַמִּזְרָחָה huonyesha mahali upande wa mashariki bila kulazimisha kirai kisichotajwa moja kwa moja cha ‘lango la mashariki.’
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  choice: alikuwa msimamizi wa matoleo ya hiari kwa ajili ya Mungu
  rationale: עַל katika muktadha huu huonyesha jukumu la usimamizi. נִדְבוֹת ni matoleo yanayotolewa kwa hiari, nayo yanahusishwa na Mungu kama anayelengwa na wakfu huo.
- source_word: לָתֵת
  choice: ili kugawa
  rationale: Maana ya msingi ni ‘kutoa,’ lakini katika muktadha wa usimamizi wa hazina na mgao, ‘kugawa’ hueleza kwa kawaida kitendo cha kuwapa walengwa vitu vilivyowekwa wakfu. Tanbihi inahifadhi maana halisi ya kitenzi.
- source_word: תְּרוּמַת יְהוָה
  choice: mchango wa Yahwe
  rationale: תְּרוּמָה ni sehemu au mchango uliotengwa. Muundo ‘wa Yahwe’ unahifadhi uhusiano wa hali ya kumiliki katika Kiebrania bila kuamua kimyakimya kama maana ni ‘kutoka kwa’ au ‘kwa ajili ya.’
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: na vitu vitakatifu sana
  rationale: Muundo huu wa Kiebrania huonyesha kiwango cha juu cha utakatifu. ‘Vitu vitakatifu sana’ huepuka kuufanya usemi huu kuwa jina la Patakatifu pa Patakatifu, mahali ambapo muktadha unahusu vitu au matoleo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la agano יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kidhehebu.
- issue: Uhusiano katika נִדְבוֹת הָאֱלֹהִים
  choice: matoleo ya hiari kwa ajili ya Mungu
  alternative: matoleo ya hiari ya Mungu
  rationale: Katika muktadha wa ibada, matoleo hayo yametolewa kwa Mungu. Kiswahili ‘ya Mungu’ kingeweza kueleweka kwa urahisi kana kwamba Mungu ndiye aliyetoa, hivyo ‘kwa ajili ya Mungu’ huwasilisha mwelekeo wa wakfu bila kubadili aina ya matoleo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. Sentensi imepangwa kwa urahisi wa kusomeka, huku istilahi za huduma ya Hekalu na utata halisi wa miundo ya Kiebrania vikihifadhiwa.
