source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: sw
  text: Hezekia akapanga zamu za makuhani na Walawi kulingana na migawanyo yao[a], kila mmoja kwa huduma yake, yaani makuhani na Walawi, kwa ajili ya sadaka za kuteketezwa na sadaka za amani[b], ili wahudumu, washukuru na kusifu kwenye malango ya kambi za Yahwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa vikundi vyao”; neno la Kiebrania linamaanisha makundi au zamu zilizopangwa za makuhani na Walawi.
    reason: lexical_alternative
  - marker: b
    text: Au “sadaka za ushirika.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “kambi za Yahwe”; wengine hufasiri kirai hiki kuwa “nyua za Yahwe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: akapanga
  rationale: Katika muktadha huu wa usimamizi wa huduma ya hekalu, kitenzi kinaonyesha kuwaweka watu katika utaratibu na majukumu rasmi, si kuwasimamisha kimwili tu.
- source_word: מַחְלְקוֹת
  choice: zamu / migawanyo
  rationale: Neno linamaanisha makundi yaliyopangwa ya makuhani na Walawi. “Zamu” ni Kiswahili cha kawaida katika muktadha wa huduma inayofanywa kwa vipindi; “migawanyo” katika urudiaji hudumisha muundo na wazo la makundi yaliyogawanywa.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: kila mmoja kwa huduma yake
  rationale: Hii inawasilisha maana ya ugawaji wa kila mtu kwa kazi yake. Kiswahili hakihitaji kutaja jinsia katika kiwakilishi hiki, na wahusika wa kiume tayari wametambulishwa kuwa makuhani na Walawi.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka za kuteketezwa
  rationale: Hili ni jina la aina maalumu ya dhabihu iliyoteketezwa kabisa; wingi unafaa kwa huduma iliyokuwa ikirudiwa.
- source_word: וְלִשְׁלָמִים
  choice: na sadaka za amani
  rationale: “Sadaka za amani” hudumisha jina la jadi la aina hii ya dhabihu bila kulazimisha maana moja ya kiufafanuzi kama ushirika.
- source_word: לְשָׁרֵת
  choice: ili wahudumu
  rationale: “Kuhudumu” linafaa kwa utumishi mtakatifu wa hekalu na ni la kawaida katika Kiswahili cha sasa.
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  choice: washukuru na kusifu
  rationale: Katika mazingira ya ibada, vitenzi hivi vinaonyesha kutoa shukrani na sifa.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: kwenye malango ya kambi za Yahwe
  rationale: “Kwenye” hutoa mahali kwa Kiswahili cha kawaida; “kambi” inadumisha picha isiyo ya kawaida ya Kiebrania, na wingi wa מַחֲנוֹת umehifadhiwa. Jina la agano limetafsiriwa “Yahwe” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: Chaguo kuu linadumisha aina ya dhabihu kwa namna ya moja kwa moja na halifungi neno hilo katika ufafanuzi mmoja wa kitheolojia.
- issue: Picha ya מַחֲנוֹת יְהוָה katika mazingira ya hekalu
  choice: kambi za Yahwe
  alternative: nyua za Yahwe
  rationale: Ingawa “nyua” inaweza kuonekana kufaa zaidi kwa hekalu, maandishi ya Kiebrania yanasema “kambi” kwa wingi. Tafsiri imehifadhi mvutano huo badala ya kuusawazisha kimya kimya.
- issue: Kirai cha kugawa אִישׁ katika kundi la makuhani na Walawi
  choice: kila mmoja kwa huduma yake
  alternative: kila mwanamume kwa huduma yake
  rationale: Kiswahili cha kawaida hutumia “kila mmoja” bila kuweka alama ya jinsia; muktadha wenyewe unabainisha makuhani na Walawi wanaohusika, hivyo maana ya ugawaji wa mtu mmoja mmoja imehifadhiwa bila usemi mzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha urudiaji na mpangilio wa kiutawala wa Kiebrania kadiri inavyowezekana, huku ikitumia “zamu,” “kuhudumu,” na “kwenye” kwa mtiririko wa asili. Picha isiyo ya kawaida ya “kambi za Yahwe” imehifadhiwa na kufafanuliwa katika tanbihi.
