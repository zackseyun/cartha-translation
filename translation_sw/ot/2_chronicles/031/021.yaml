base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: sw
  text: Naye katika kila kazi aliyoianza katika huduma ya nyumba ya Mungu, katika sheria[a] na katika amri, ili kumtafuta Mungu wake[b], aliifanya kwa moyo wake wote[c], naye akafanikiwa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho.” Neno la Kiebrania torah linaweza kumaanisha sheria au mafundisho.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili kumuuliza Mungu wake” au “ili kutaka shauri la Mungu wake.”
    reason: lexical_alternative
  - marker: c
    text: Maneno “kwa moyo wake wote” yanaweza pia kueleweka kuwa yanaelezea jinsi alivyomtafuta Mungu wake.
    reason: textual_or_syntactic_ambiguity
  - marker: d
    text: Au, “akastawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה אֲשֶׁר הֵחֵל
  choice: Naye kila kazi aliyoianza
  rationale: “Kazi” huwasilisha maana pana ya מַעֲשֶׂה, na “aliyoianza” hufuata maana ya kawaida ya הֵחֵל. “Naye” huhifadhi uhusiano na muktadha uliotangulia bila kufanya sentensi kuwa nzito.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: katika huduma ya nyumba ya Mungu
  rationale: עֲבוֹדָה hapa ni huduma au kazi inayohusiana na hekalu; “huduma” huhifadhi maana ya kiibada na ya kiutendaji bila kuibana iwe ibada ya makuhani pekee.
- source_word: וּבַתּוֹרָה
  choice: katika sheria
  rationale: Katika muktadha wa marekebisho ya Hezekia, תּוֹרָה linaelekea kumaanisha sheria ya agano, ingawa maana pana ya “mafundisho” imehifadhiwa katika tanbihi.
- source_word: וּבַמִּצְוָה
  choice: na katika amri
  rationale: Umoja wa מִצְוָה umehifadhiwa kwa “amri”; neno hilo linaweza pia kutumiwa kwa maana ya ujumla.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: ili kumtafuta Mungu wake
  rationale: דרשׁ inapomhusu Mungu mara nyingi humaanisha kumtafuta kwa kujitoa, lakini inaweza pia kuhusisha kumuuliza au kutaka shauri lake; maana hiyo imeonyeshwa katika tanbihi.
- source_word: בְּכָל לְבָבוֹ עָשָׂה
  choice: aliifanya kwa moyo wake wote
  rationale: Mpangilio wa Kiebrania na mgawanyo wa Kimasora unaunganisha kwa urahisi “kwa moyo wake wote” na kitendo cha kufanya. Hata hivyo, uwezekano wa kuiunganisha na kumtafuta Mungu umehifadhiwa katika tanbihi.
- source_word: וְהִצְלִיחַ
  choice: naye akafanikiwa
  rationale: Hifili ya צלח hapa ina maana ya kufanikiwa au kustawi. “Akafanikiwa” ni Kiswahili cha kawaida na wazi katika muhtasari wa matendo ya Hezekia.
theological_decisions:
- issue: Maana ya תּוֹרָה katika muktadha wa marekebisho
  choice: sheria
  alternative: mafundisho
  rationale: “Sheria” inafaa kwa utii wa agano na utaratibu wa hekalu katika muktadha huu, huku “mafundisho” yakibaki kuwa maana halali ya neno lenyewe.
- issue: Maana ya לִדְרֹשׁ לֵאלֹהָיו
  choice: kumtafuta Mungu wake
  alternative: kumuuliza Mungu wake / kutaka shauri la Mungu wake
  rationale: “Kumtafuta” huhifadhi dhamira muhimu ya Mambo ya Nyakati kuhusu kujitoa kwa Mungu, bila kufuta maana inayowezekana ya kumuuliza au kutaka shauri lake.
- issue: Kitu kinachoelezewa na בְּכָל לְבָבוֹ
  choice: kwa moyo wake wote inaelezea jinsi alivyofanya
  alternative: inaweza kuelezea jinsi alivyomtafuta Mungu
  rationale: Mpangilio na mgawanyo wa Kimasora unaunga mkono kuhusishwa kwake na עָשָׂה, lakini sintaksia na matumizi ya lugha hiyo mahali pengine huruhusu pia kuhusishwa na kumtafuta Mungu. Utata huo umeelezwa badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji wa “katika” ili kuonyesha nyanja tatu za kazi bila kuwa ngumu kupita kiasi. “Nyumba ya Mungu” imetumiwa badala ya “hekalu” ili kudumisha taswira halisi ya Kiebrania.
