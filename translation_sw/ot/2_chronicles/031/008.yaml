base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: sw
  text: Hezekia na wakuu walikuja na kuyaona marundo hayo[a], wakambariki Yahwe na kuwabariki watu wake Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mirundo.” Neno la Kiebrania linamaanisha vitu vilivyokusanywa na kuwekwa katika marundo; hapa huenda ni mazao au matoleo yaliyotolewa.
    reason: lexical_alternative
  - marker: b
    text: Au “watu wake, Israeli,” ambapo neno “wake” linamrejelea Hezekia badala ya Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: walipokuja
  rationale: Kitenzi בוא katika simulizi kina maana ya kuja au kufika. Muundo wa “walipokuja” unaunganisha kwa Kiswahili cha kawaida kuja kwao na matendo yaliyofuata bila kupoteza mfuatano wa Kiebrania.
- source_word: יְחִזְקִיָּהוּ
  choice: Hezekia
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וְהַשָּׂרִים
  choice: wakuu
  rationale: שָׂרִים ni viongozi wenye mamlaka au maafisa. “Wakuu” ni neno la sasa, lenye heshima, na linafaa katika muktadha huu wa uongozi.
- source_word: וַיִּרְאוּ
  choice: kuyaona
  rationale: ראה hapa inaeleza kuona kwa macho. Kiambishi “-ya-” kinarejelea marundo na kufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: הָעֲרֵמוֹת
  choice: marundo hayo
  rationale: עֲרֵמוֹת ni marundo au mafungu ya vitu vilivyokusanywa, katika muktadha huu mazao au matoleo. “Hayo” yanaonyesha marundo yaliyotajwa katika muktadha uliotangulia.
- source_word: וַיְבָרֲכוּ
  choice: walimbariki
  rationale: ברך inapotumiwa kwa Mungu humaanisha kumbariki kwa kumsifu au kusema mema juu yake. “Walimbariki” pia huhifadhi kitenzi kilekile kinachowaelekea Yahwe na watu wake, kama ilivyo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: watu wake Israeli
  rationale: Kiambishi cha umilikaji katika עַמּוֹ kwa kawaida kinamrejelea Yahwe, na “Israeli” linawatambulisha watu hao. Muundo huu unahifadhi uhusiano wa agano bila kuongeza maelezo yasiyokuwapo katika chanzo.
theological_decisions:
- issue: Mrejelewa wa kiambishi cha umilikaji katika עַמּוֹ (“watu wake”)
  choice: '“Wake” linamrejelea Yahwe: “watu wake Israeli.”'
  alternative: Kiambishi hicho kinaweza kumrejelea Hezekia, yaani “watu wake, Israeli,” kwa maana ya watu walio chini ya mfalme.
  rationale: Katika mtiririko wa karibu, Yahwe ndiye mrejelewa wa kawaida zaidi, na Israeli kuitwa watu wake ni usemi wa kawaida wa kibiblia kuhusu agano. Hata hivyo, sarufi inaweza kuruhusu “wake” kumrejelea Hezekia; kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. “Wakuu” limechaguliwa badala ya neno la kizamani kama “wakuu wa mikoa” au neno finyu zaidi “maofisa.” Muundo “walimbariki Yahwe na watu wake” umehifadhiwa ili kutatua kwa kiwango kidogo tu ugumu wa Kiebrania na kutoweka maana ya kumsifu kwa Mungu huku kitenzi hicho hicho kikihusishwa pia na Israeli.
