base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: sw
  text: Chini ya usimamizi wake walikuwa Edeni, Miniamini, Yeshua, Shemaya, Amaria na Shekania, katika miji ya makuhani. Walikuwa wakiwagawia ndugu zao[a] kwa uaminifu, kwa kadiri ya makundi yao, wakubwa na wadogo sawasawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wenzao katika jumuiya ya kikuhani.
    reason: cultural_note
  - marker: b
    text: 'Au: “wakubwa kama wadogo.” Maneno ya Kiebrania yanaweza kurejelea hadhi au umri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: Chini ya usimamizi wake
  rationale: Nahau hii inaweza kuonyesha kuwa chini ya mkono, mamlaka, au usimamizi wa mtu. Katika muktadha huu wa kiutawala, ‘chini ya usimamizi wake’ ni ya kawaida na haifungi maana kwenye mamlaka rasmi pekee.
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: Edeni, Miniamini, Yeshua, Shemaya, Amaria na Shekania
  rationale: Majina yamenukuliwa kwa tahajia zinazosomeka kwa urahisi katika Kiswahili huku yakifuata maumbo ya Kiebrania.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: katika miji ya makuhani
  rationale: Huhifadhi kwa uwazi uhusiano wa kimuundo wa Kiebrania kati ya miji na makuhani.
- source_word: בֶּאֱמוּנָה
  choice: kwa uaminifu
  rationale: Katika kazi hii ya kiutawala, neno linaeleza namna ya kuaminika ambayo ugawaji ulifanywa.
- source_word: לָתֵת
  choice: waligawa
  rationale: Kitenzi kimsingi ni ‘kutoa’, lakini muktadha wa mafungu yaliyopangwa unaonyesha tendo la kugawa. Sentensi mbili na kitenzi kamili hutoa Kiswahili cha asili bila kubadili wahusika.
- source_word: לַאֲחֵיהֶם
  choice: kwa ndugu zao
  rationale: Huhifadhi neno halisi ‘ndugu zao’; muktadha unaonyesha kwamba ni wenzao katika jumuiya ya kikuhani.
- source_word: בְּמַחְלְקוֹת
  choice: kulingana na zamu zao
  rationale: מַחְלְקוֹת hapa ni vikundi au zamu rasmi za utumishi. ‘Zamu zao’ huwasilisha vizuri mpangilio huo kwa msomaji wa Kiswahili.
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: wakubwa kwa wadogo bila ubaguzi
  rationale: Nahau inajumuisha wote bila kupendelea hadhi au umri; tafsiri hii huhifadhi jozi ya wakubwa na wadogo na kusisitiza usawa wa ugawaji.
