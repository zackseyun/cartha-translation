id: 2CH.31.5
reference: 2 Chronicles 31:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: sw
  text: Jambo hilo lilipoenea, wana wa Israeli[a] wakaleta kwa wingi malimbuko ya nafaka, divai mpya, mafuta, asali[b], na mazao yote ya mashambani; nao wakaleta kwa wingi zaka ya kila kitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema “wana wa Israeli,” usemi wa kawaida unaomaanisha watu wa Israeli kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Katika baadhi ya miktadha, “asali” inaweza kumaanisha sharubati tamu, kama sharubati ya tende, wala si asali ya nyuki tu.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: Jambo hilo lilipoenea
  rationale: Muundo huu una maana ya wakati, ‘wakati jambo hilo lilipoenea.’ Kitenzi פרץ kina wazo la kuzuka au kuenea kwa kasi; ‘lilipoenea’ ni Kiswahili cha kawaida bila kubainisha kupita kiasi kama ilikuwa amri au habari yake.
- source_word: הִרְבּוּ
  choice: wakaleta kwa wingi
  rationale: Hiphil ya רבה huonyesha kuongeza au kufanya kuwa nyingi. Orodha ya mazao na kitenzi הֵבִיאוּ mwishoni mwa aya vinaonyesha kwamba walileta vitu hivyo kwa wingi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi rasmi wa Kiebrania, ambao hapa unamaanisha Waisraeli kwa ujumla. Tanbihi inaeleza maana yake ya kijumuiya.
- source_word: רֵאשִׁית
  choice: malimbuko
  rationale: Katika muktadha wa matoleo, neno hili linamaanisha sehemu ya kwanza ya mazao iliyowekwa wakfu; ‘malimbuko’ ni istilahi ya kawaida na fupi ya Kiswahili.
- source_word: דָּגָן
  choice: nafaka
  rationale: Neno hili linamaanisha kwa ujumla mazao ya jamii ya nafaka, si zao moja maalumu.
- source_word: תִּירוֹשׁ
  choice: divai mpya
  rationale: תירוש kwa kawaida hurejelea divai iliyotoka karibuni au zao jipya la mzabibu; ‘divai mpya’ huhifadhi maana hiyo ya kilimo.
- source_word: יִצְהָר
  choice: mafuta
  rationale: Neno hili kwa kawaida hurejelea mafuta mapya, hasa ya zeituni. ‘Mafuta’ huhifadhi upana wa neno bila kuongeza aina ambayo haikutajwa wazi.
- source_word: דְבַשׁ
  choice: asali
  rationale: דבש linaweza kumaanisha asali ya nyuki au sharubati tamu ya matunda. ‘Asali’ linafaa katika matini, huku uwezekano mwingine ukielezwa katika tanbihi.
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: na mazao yote ya mashambani
  rationale: תבואה ni mavuno au mazao ya kilimo. ‘Mazao yote ya mashambani’ ni usemi wa asili unaowasilisha maana pana ya mavuno ya shamba.
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: zaka ya kila kitu
  rationale: מעשר ni istilahi ya sehemu ya kumi iliyotolewa kama wajibu wa kidini. ‘Zaka’ ni neno linalotambulika katika Kiswahili cha Biblia, na ‘ya kila kitu’ huakisi הכל.
- source_word: לָ/רֹב
  choice: kwa wingi
  rationale: Kirai hiki husisitiza kiasi kikubwa cha zaka walicholeta; ‘kwa wingi’ ni Kiswahili cha kawaida na chenye nguvu inayofaa.
theological_decisions:
- issue: Usemi wa kijumuiya wenye jinsia בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Matini kuu huhifadhi umbo rasmi la Kiebrania. Hata hivyo, katika simulizi hili usemi huo unawahusu Waisraeli kama jumuiya, si wanaume pekee; jambo hilo linafafanuliwa katika tanbihi bila kupunguza mvutano uliomo katika usemi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Malimbuko’ na ‘zaka’ zimetumiwa kama istilahi zinazotambulika za matoleo ya kilimo; sentensi imebaki na marudio ya ‘kwa wingi’ ili kuhifadhi msisitizo wa Kiebrania.
