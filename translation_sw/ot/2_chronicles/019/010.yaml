id: 2CH.19.10
reference: 2 Chronicles 19:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: sw
  text: Na kila shauri linalowajia kutoka kwa ndugu zenu wanaoishi katika miji yao—iwe ni kati ya damu na damu[a], au kati ya sheria na amri, kanuni na hukumu—waonyeni ili wasije wakawa na hatia mbele za Yahweh; la sivyo, ghadhabu itawajia ninyi na ndugu zenu. Fanyeni hivyo, nanyi hamtakuwa na hatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kati ya damu na damu”; huenda inamaanisha kesi zinazohusu umwagaji damu au mauaji.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: shauri
  rationale: Katika muktadha huu wa mahakama, neno hili linamaanisha mgogoro au kesi inayohitaji uamuzi; “shauri” ni Kiswahili cha kawaida cha kisheria bila kulifanya lazima kuwa shtaka rasmi.
- source_word: יָבֹוא עֲלֵיכֶם
  choice: linalowajia
  rationale: Ni usemi wa kimahakama kuhusu shauri linaloletwa katika mamlaka ya waamuzi; “linalowajia” ni la asili na linaepuka tafsiri ya mahali isiyokusudiwa.
- source_word: מֵאֲחֵיכֶם
  choice: kutoka kwa ndugu zenu
  rationale: Huhifadhi lugha ya undugu ya Kiebrania inayowataja washiriki wenzao wa jumuiya ya agano.
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: wanaoishi katika miji yao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki.
- source_word: בֵּין דָּם לְדָם
  choice: kati ya damu na damu
  rationale: Huhifadhi usemi mfupi na wa kiufundi wa Kiebrania, ambao huenda unahusu tofauti kati ya kesi za umwagaji damu; ufafanuzi umewekwa katika tanbihi.
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: kati ya sheria na amri, masharti na hukumu
  rationale: Huhifadhi kwa kadiri inayowezekana aina nne za maagizo ya kisheria bila kuyafanya yote kuwa neno moja la jumla.
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: waonyeni
  rationale: Hifili ya זהר hapa inahusu kutoa onyo ili kuzuia hatia, kama inavyoonyeshwa na kishazi kinachofuata.
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: wasiwe na hatia mbele za Yahweh
  rationale: Huwasilisha hali ya kuwa na hatia na uwajibikaji kwa Mungu kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni linatoholewa badala ya kubadilishwa kuwa cheo.
- source_word: קֶצֶף
  choice: ghadhabu
  rationale: Neno hili linaonyesha hasira kali ya hukumu ya Mungu; “ghadhabu” hudumisha uzito wake.
- source_word: כֹּה תַעֲשׂוּן
  choice: Fanyeni hivyo
  rationale: Ni agizo fupi na la kawaida linalorejelea wajibu uliotangulia wa kuwaonya wahusika.
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: nanyi hamtakuwa na hatia
  rationale: Huhifadhi maana na ulinganifu wa mzizi אשׁם uliotumiwa mapema katika mstari.
theological_decisions:
- issue: Lugha ya undugu wa jumuiya ya agano katika אֲחֵיכֶם
  choice: ndugu zenu
  alternative: Waisraeli wenzenu; jamaa zenu
  rationale: Maandishi yenyewe yanatumia lugha ya undugu. “Ndugu zenu” huihifadhi bila kuficha maana pana ya washiriki wa jumuiya.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Hili ni jina la agano, si cheo tu; umbo “Yahweh” hulitambulisha wazi bila kuingiza mapokeo ya dhehebu fulani.
- issue: Uhusiano wa ghadhabu na wajibu wa waamuzi
  choice: la sivyo, ghadhabu itawajia ninyi na ndugu zenu
  alternative: na ghadhabu itakuwa juu yenu na juu ya ndugu zenu
  rationale: Kishazi kinaonyesha matokeo ya kutowaonya ipasavyo, huku maandishi yakiacha mtendaji wa ghadhabu kuwa wa kueleweka kutoka katika muktadha wa Yahweh.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mtindo wa kimahakama umehifadhiwa kwa maneno kama “shauri,” “hukumu,” na “hatia,” lakini sentensi imewekwa kwa namna inayoeleweka kwa msomaji wa kawaida. Alama ya tanbihi [a] imo katika matini kuu.
