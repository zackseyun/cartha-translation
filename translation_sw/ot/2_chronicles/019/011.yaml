id: 2CH.19.11
reference: 2 Chronicles 19:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: sw
  text: Na tazama, Amaria, kuhani mkuu[a], anawaongoza katika kila jambo la Yahwe; naye Zebadia mwana wa Ishmaeli, kiongozi wa nyumba ya Yuda, katika kila jambo la mfalme. Maafisa Walawi wako mbele yenu. Iweni hodari, fanyeni, na Yahwe awe pamoja na aliye mwema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “kuhani kiongozi.” Kiebrania: “kuhani aliye mkuu.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe awe pamoja na mwema.” Kiebrania kinaweza kuwa na maana ya jumla, yaani yule atendaye mema.
    reason: ambiguity
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inadumisha kiashiria cha usemi kinachovuta fikira kwenye mpangilio unaofuata, kwa Kiswahili cha sasa na chenye hadhi.
- source_word: כֹהֵן הָרֹאשׁ
  choice: kuhani mkuu
  rationale: Hili ni neno la kawaida na la asili katika Kiswahili kwa kuhani aliye mkuu au kiongozi wa makuhani; tanbihi inadumisha uwezekano wa kulielewa kama cheo rasmi cha kuhani mkuu.
- source_word: עֲלֵיכֶם
  choice: ndiye atakayekuwa juu yenu
  rationale: Inaonyesha mamlaka ya usimamizi katika muktadha wa mahakama na utawala.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: kwa kila jambo la Yahwe
  rationale: Inahifadhi upana wa דָּבָר kama jambo, shauri, au shughuli, bila kulifinya kuwa kesi za mahakama pekee.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: kiongozi wa nyumba ya Yuda
  rationale: Kiongozi ni tafsiri ya kawaida ya נָגִיד katika muktadha wa kiutawala, na 'nyumba ya Yuda' inadumisha בֵּית iliyo katika chanzo.
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: kwa kila jambo la mfalme
  rationale: Inadumisha muundo sambamba na 'kwa kila jambo la Yahwe' na tofauti kati ya mambo ya kidini na mambo ya kifalme.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: Walawi watatumikia kama maafisa mbele yenu
  rationale: Inaonyesha kwamba Walawi ni maafisa wanaohudumu mbele ya waamuzi, huku ikifanya kishazi kisicho na kitenzi kiwe cha asili katika Kiswahili.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: Iweni hodari, mtende
  rationale: 'Inadumisha amri mbili fupi: wawe na ujasiri na watekeleze wajibu waliopewa.'
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: na Yahwe na awe pamoja na mtu mwema
  rationale: Muundo wa kutakia unaakisiwa kwa 'na awe'; הַטּוֹב inaeleweka kiasili kama mtu mwema, huku tanbihi ikihifadhi uwezekano mpana wa 'lililo jema'.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina la agano יְהוָה moja kwa moja badala ya kulibadili kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni yenyewe; 'Yahwe' inadumisha jina la agano badala ya kulibadili kuwa cheo.
- issue: Iwapo כֹהֵן הָרֹאשׁ ni cheo rasmi cha kuhani mkuu au maelezo ya kuhani kiongozi
  choice: kuhani mkuu
  alternative: kuhani kiongozi
  rationale: Kiswahili 'kuhani mkuu' ni cha asili na kinaweza kuonyesha kuhani aliye mkuu, lakini tanbihi inakiri uwezekano wa maana ya cheo rasmi bila kuamua kupita ushahidi.
- issue: Rejeo la הַטּוֹב katika baraka ya mwisho
  choice: mtu mwema
  alternative: lililo jema / wema
  rationale: Kivumishi chenye kibainishi kinaweza kutumiwa kama nomino na kumaanisha mtu mwema, lakini Kiebrania hakitaji wazi nomino iliyodokezwa; tanbihi inadumisha upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Miundo sambamba ya 'kwa kila jambo' imedumishwa, na majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
