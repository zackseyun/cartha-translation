base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: sw
  text: Hata hivyo, mambo mema yamepatikana kwako, kwa kuwa umeondoa vitu vya ibada ya Ashera[a] kutoka katika nchi, na umeutayarisha moyo wako kumtafuta Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: maashera; yaani, vitu vya ibada vilivyohusishwa na Ashera.'
    reason: cultural_note
lexical_decisions:
- source_word: אֲבָל
  choice: Hata hivyo
  rationale: Inaonyesha tofauti ya kukubali jambo jema baada ya karipio lililotangulia, kwa lugha ya kawaida na yenye uzito.
- source_word: דְּבָרִים טוֹבִים
  choice: mambo mema
  rationale: Inadumisha upana wa usemi wa Kiebrania bila kuufanya umaanishe matendo pekee.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: yamepatikana kwako
  rationale: Inafuata muundo wa kutendwa na kuacha ‘mambo mema’ yahusishe sifa, mwelekeo, au matendo ya Yehoshafati.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Inatambulisha sababu ya sifa inayotolewa.
- source_word: בִעַרְתָּ
  choice: umeondoa
  rationale: Kitenzi kinaweza kuhusisha kuangamiza au kuondoa kabisa; hapa ‘umeondoa’ kinaeleza matokeo bila kuamua kimya kimya kwamba vitu hivyo viliteketezwa kwa moto.
- source_word: הָאֲשֵׁרוֹת
  choice: vitu vya ibada ya Ashera
  rationale: Wingi huu unataja vitu vya ibada vilivyohusishwa na Ashera. Usemi mpana unaepuka kudai kwa uhakika kwamba vyote vilikuwa nguzo au sanamu za aina moja.
- source_word: מִן הָאָרֶץ
  choice: nchini
  rationale: Katika muundo ‘umeondoa nchini,’ neno hili linaeleza kuondolewa kwa vitu hivyo kutoka katika eneo la nchi kwa Kiswahili kifupi na cha kawaida.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: umeutayarisha moyo wako
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya wazo la kuuweka moyo tayari au kuuelekeza kwa azimio.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: kumtafuta Mungu
  rationale: Katika Mambo ya Nyakati, usemi huu una maana pana ya kumwelekea Mungu kwa kujitoa, si kuuliza habari kwake tu.
theological_decisions:
- issue: Maana ya הָאֲשֵׁרוֹת
  choice: vitu vya ibada ya Ashera
  alternative: nguzo za Ashera; sanamu za Ashera; maashera
  rationale: Chaguo hili linawasaidia wasomaji wa sasa kutambua kuwa vinatajwa vifaa vya ibada ya sanamu, huku likihifadhi jina Ashera na kutokaza zaidi ya ushahidi aina halisi ya vitu hivyo.
- issue: Maana ya לִדְרֹשׁ הָאֱלֹהִים
  choice: kumtafuta Mungu
  alternative: kutaka shauri kwa Mungu
  rationale: Muktadha wa Mambo ya Nyakati unahusu mwelekeo wa ibada na kujitoa kwa Mungu kwa upana, wala si tendo la kuuliza shauri pekee.
- issue: Maana ya kuutayarisha moyo
  choice: umeutayarisha moyo wako
  alternative: umeuelekeza moyo wako; umeukaza moyo wako
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania na azimio la ndani bila kuingiza maana ya ukaidi ambayo ‘kuukaza’ ingeweza kuwa nayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha tofauti kati ya karipio lililotangulia na sifa hii, pamoja na upana wa ‘mambo mema.’ Jina ‘Ashera’ limeelezwa kwa tanbihi badala ya kulazimisha umbo mahususi la vitu vya ibada.
