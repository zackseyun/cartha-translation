base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: sw
  text: Basi Yehoshafati akaishi Yerusalemu, kisha akaenda tena[a] miongoni mwa watu, kutoka Beer-sheba mpaka nchi ya vilima ya Efraimu, akawarudisha kwa Yahweh[b], Mungu wa mababu zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akarudi, akaenda miongoni mwa watu.” Kiebrania kinarudia kitenzi “kurudi” kabla ya “akaenda,” huenda kikionyesha kwamba Yehoshafati alianza tena shughuli hiyo baada ya kurudi Yerusalemu.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” ni jina la Mungu linalowakilishwa kwa herufi YHWH; kwa desturi nyingine za tafsiri hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: Kitenzi ישׁב hapa kinaonyesha kukaa mahali kama makazi, si tendo halisi la kuketi; “akaishi” ni Kiswahili cha kawaida na kinachofaa pamoja na “Yerusalemu.”
- source_word: וַיָּשָׁב וַיֵּצֵא
  choice: kisha akaenda tena
  rationale: Mfuatano huu unaonyesha kurudia tendo baada ya kurudi Yerusalemu. “Tena” hudumisha wazo la kuanza upya bila marudio yasiyo ya kawaida katika Kiswahili; tafsiri ya karibu zaidi imewekwa katika tanbihi.
- source_word: וַיֵּצֵא בָעָם
  choice: akaenda tena miongoni mwa watu
  rationale: Kihusishi ב hapa kinaeleweka kama mwendo katikati ya watu au kupitia kwao, wala si kuelekea kwao tu.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: kutoka Beer-sheba mpaka nchi ya vilima ya Efraimu
  rationale: הַר אֶפְרַיִם linataja eneo la kijiografia lenye vilima; “nchi ya vilima” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: וַיְשִׁיבֵם
  choice: akawarudisha
  rationale: Hii ni Hiphil ya שוב yenye kiambishi cha yambwa wingi, yaani aliwasababisha warudi. Tafsiri hii huhifadhi taswira ya kurejea bila kuibadili kuwa istilahi mahususi ya kimadhehebu kama “aliwabadilisha dini.”
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: Kihusishi אֶל kinaonyesha mwelekeo wa kurudi kwa uaminifu na ibada, na יהוה limetolewa kama jina “Yahwe.”
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Mungu wa mababu zao
  rationale: Usemi huu wa agano unaunganisha kurudi kwa watu na imani ya waliowatangulia; “mababu zao” ni Kiswahili cha sasa, cha heshima, na huhifadhi maana ya wingi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” hulihifadhi kama jina la agano, huku tanbihi ikitaja desturi ya kulitafsiri “BWANA.”
- issue: Maana ya וַיְשִׁיבֵם אֶל יְהוָה
  choice: akawarudisha kwa Yahwe
  alternative: akawaongoza watubu / akawabadilisha wamwelekee Bwana
  rationale: Kitenzi chenyewe kinasema kusababisha warudi. Tafsiri iliyochaguliwa huhifadhi maana hiyo na mvutano wake wa kiteolojia bila kufafanua kimadhehebu aina kamili ya toba au uongofu unaokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. “Nchi ya vilima” inaeleweka kwa msomaji wa sasa, na “mababu zao” ni ya kawaida kuliko usemi mgumu zaidi wa kale. Majina ya mahali na watu yameandikwa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
