  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: sw
  text: Sasa basi, hofu ya Yahweh iwe juu yenu. Jihadharini na mtende, kwa maana kwa Yahweh Mungu wetu hakuna udhalimu, wala upendeleo[a], wala kupokea rushwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuinua nyuso,” nahau inayomaanisha kuonyesha upendeleo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huanzisha hitimisho lenye himizo; “Basi sasa” huwasilisha vizuri nguvu ya kimantiki na ya wakati.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: hofu ya Yahwe iwe juu yenu
  rationale: Muundo wa kusihi יְהִי umetafsiriwa kama agizo la himizo. “Hofu” hapa inahusisha kumcha Mungu kwa staha, huku taswira ya “juu yenu” ikihifadhiwa.
- source_word: שִׁמְרוּ
  choice: Jihadharini
  rationale: Katika muktadha wa waamuzi, kitenzi kinawahimiza kuwa waangalifu na macho katika kutekeleza wajibu wao.
- source_word: וַעֲשׂוּ
  choice: na mtende
  rationale: Huhifadhi upana wa kitenzi “kufanya/kutenda” na kuonyesha kwamba uangalifu wao lazima ufuatwe na utekelezaji.
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: kwa maana kwa Yahwe Mungu wetu hakuna
  rationale: “Kwa maana” huonyesha msingi wa himizo, na “kwa Yahwe” huhifadhi kwa kiasi cha kawaida muundo wa Kiebrania unaosema jambo lisilopatikana katika tabia au utendaji wake.
- source_word: עַוְלָה
  choice: udhalimu
  rationale: Katika muktadha wa hukumu, “udhalimu” huonyesha kuvunja haki kimaadili na kimahakama.
- source_word: מַשֹּׂא פָנִים
  choice: upendeleo
  rationale: Ni nahau ya Kiebrania, kihalisi “kuinua nyuso,” inayomaanisha kumpendelea mtu kwa sababu ya cheo au utambulisho wake.
- source_word: מִקַּח שֹׁחַד
  choice: kupokea rushwa
  rationale: Hueleza kwa Kiswahili cha kawaida tendo la kuchukua au kukubali rushwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi יהוה. “Yahwe” hulihifadhi kwa utohozi bila kulibadilisha kuwa cheo.
- issue: Maana ya פַחַד katika himizo kwa waamuzi
  choice: hofu
  alternative: kicho; uchaji
  rationale: “Hofu” huhifadhi uzito wa neno la chanzo na inaweza kujumuisha kumcha Mungu kwa staha; kutafsiri “uchaji” pekee kungelainisha uwezekano wa maana yake kali.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa ulinganifu bora: huhifadhi lugha ya kimahakama, mfuatano wa mahimizo, na jina Yahwe, huku nahau isiyo ya kawaida ikielezwa katika tanbihi.'
