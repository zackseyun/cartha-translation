  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
translation:
  language: sw
  text: Yehoshafati, mfalme wa Yuda, akarudi kwa amani nyumbani kwake huko Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akarudi salama nyumbani kwake huko Yerusalemu.” Kirai cha Kiebrania “kwa amani” kinaweza pia kusisitiza kwamba alirudi salama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika simulizi kinamaanisha kurudi; umbo la mfululizo wa masimulizi limetolewa kwa “akarudi” kwa Kiswahili cha kawaida.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika tafsiri za Biblia za Kiswahili na linalofaa mfumo wa matamshi ya Kiswahili.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Kirai cha uhusiano kinamtambulisha Yehoshafati kwa cheo chake cha kifalme; koma zinaonyesha kuwa ni maelezo ya jina.
- source_word: אֶל בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Ingawa בַּיִת kimsingi ni “nyumba,” katika muktadha wa kurejea mahali anapoishi, “nyumbani kwake” ni Kiswahili cha asili bila kupoteza maana.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Neno שָׁלוֹם linaweza kuonyesha amani, hali njema, au usalama. “Kwa amani” huhifadhi upana huo na nahau ya chanzo.
- source_word: לִירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Baada ya “nyumbani kwake,” jina la mahali linaeleza mahali nyumba hiyo ilipo. Kiswahili hakihitaji kurudia kihusishi cha Kiebrania לְ hapa.
