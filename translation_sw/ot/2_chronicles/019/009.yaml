    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם
  choice: Akawaamuru
  rationale: Kitenzi צוה pamoja na על hapa kina maana ya kuwapa watu amri; Kiswahili cha kawaida husema “aliwaamuru,” si tafsiri halisi ya kihusishi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni umbo la kawaida la Kiebrania linalotanguliza maneno ya moja kwa moja; “akisema” linahifadhi muundo huo kwa Kiswahili cha asili.
- source_word: כֹּה תַעֲשׂוּן
  choice: Mtende hivi
  rationale: עשה ni pana, likimaanisha kufanya au kutenda. Katika maagizo ya kimahakama, “kutenda” linaonyesha mwenendo unaotakiwa, huku “hivi” likiwakilisha כֹּה.
- source_word: בְּיִרְאַת יְהוָה
  choice: kwa kumcha Yahwe
  rationale: יראה hapa ni hofu yenye heshima mbele za Mungu. “Kumcha Yahwe” ni usemi wa kibiblia ulio wazi na wa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama jina binafsi “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: בֶּאֱמוּנָה
  choice: kwa uaminifu
  rationale: Katika muktadha wa kuwaagiza waamuzi, אֱמוּנָה linaonyesha kutenda kwa uaminifu, kutegemeka na unyoofu, si hasa imani ya moyoni.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: na kwa moyo wote
  rationale: Usemi לֵבָב שָׁלֵם unaonyesha kujitoa kikamilifu na moyo usiogawanyika. “Kwa moyo wote” ni Kiswahili cha kawaida kinachohifadhi taswira ya moyo bila kuufanya usemi umaanishe ukamilifu usio na kosa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kuweka cheo mahali pake.
- issue: Maana ya אֱמוּנָה katika agizo kwa waamuzi
  choice: kwa uaminifu
  alternative: kwa unyoofu; kwa imani
  rationale: Muktadha unahusu utekelezaji mwaminifu na wa kutegemeka wa wajibu wa hukumu. “Kwa imani” lingeweza kueleweka hasa kama hali ya kuamini na hivyo kupunguza maana ya kimaadili inayokusudiwa hapa.
- issue: Maana ya לֵבָב שָׁלֵם
  choice: kwa moyo wote
  alternative: kwa moyo mkamilifu; kwa moyo usiogawanyika
  rationale: Kiebrania kinaweza kujumuisha ukamilifu wa kujitoa na moyo usiogawanyika. Chaguo hili linahifadhi upana huo bila kudai hali ya kutokuwa na dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi uzito wa agizo la kimahakama, huku “kwa moyo wote” ukitoa usemi wa asili kuliko tafsiri ngumu ya neno kwa neno.
