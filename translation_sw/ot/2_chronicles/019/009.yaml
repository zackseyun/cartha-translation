  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: sw
  text: Akawaamuru, akisema, “Fanyeni hivi[a] kwa kumcha Yahwe[b], kwa uaminifu[c] na kwa moyo wote[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mtende hivi.”
    reason: lexical_alternative
  - marker: b
    text: “Kumcha Yahwe” pia kunaweza kuelezwa kuwa “kumheshimu Yahwe kwa kicho.”
    reason: lexical_alternative
  - marker: c
