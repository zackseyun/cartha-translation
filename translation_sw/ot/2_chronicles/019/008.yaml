  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: sw
  text: Pia huko Yerusalemu, Yehoshafati aliwateua baadhi ya Walawi, makuhani, na wakuu wa koo za Israeli kwa ajili ya hukumu ya Yahwe[a] na migogoro ya kisheria. Nao wakarudi Yerusalemu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai hiki kinaweza kumaanisha mashauri yanayotawaliwa na sheria ya Yahwe; kinaweza pia kueleweka kuwa “hukumu kwa niaba ya Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Nao wakarudi Yerusalemu.” Maneno hayo yanaonekana kuwa ya ghafla kwa kuwa mstari tayari unaanza kwa kutaja Yerusalemu. Wengine huyasoma au huyatafsiri kwa namna tofauti, kama “Nao walikaa Yerusalemu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Pia
  rationale: Huhifadhi maana ya kuongeza tendo jingine katika simulizi kwa Kiswahili cha kawaida na kifupi.
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Ni kirai cha mahali; “huko” huunganisha sentensi hii kwa kawaida na muktadha uliotangulia.
- source_word: הֶעֱמִיד
  choice: aliwaweka rasmi
  rationale: Katika muktadha wa utawala na mahakama, kausativi ya עמד inaonyesha kuwapa watu nafasi au wajibu rasmi.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: baadhi ya Walawi na makuhani, pamoja na baadhi ya viongozi wa koo za Israeli
  rationale: מִן/מֵ inaonyesha kuchaguliwa kwa watu kutoka makundi hayo. “Viongozi wa koo” hueleza kwa kawaida mfumo wa jamaa unaomaanishwa na רָאשֵׁי הָאָבוֹת bila kuubadili kuwa familia za nyuklia.
- source_word: לְמִשְׁפַּט יְהוָה
  choice: kwa ajili ya hukumu ya Yahwe
  rationale: 'Huhifadhi uhusiano mpana wa kisarufi: inaweza kuwa hukumu inayomhusu Yahwe, inayotawaliwa na sheria yake, au inayotolewa chini ya mamlaka yake.'
- source_word: וְלָרִיב
  choice: na migogoro ya kisheria
  rationale: רִיב katika muktadha huu ni shauri, mgogoro, au ubishi unaohitaji uamuzi wa kimahakama; neno la ufafanuzi “ya kisheria” linaweka wazi muktadha.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Kisha wakarudi Yerusalemu
  rationale: Hii ndiyo maana ya moja kwa moja ya matini ya Kimasora, ingawa ni ya ghafla katika muktadha; ugumu huo umehifadhiwa na kuelekezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” linawakilisha jina binafsi lililo katika matini ya Kiebrania badala ya kulibadili kuwa cheo.
- issue: Maana mahususi ya לְמִשְׁפַּט יְהוָה
  choice: hukumu ya Yahwe
  alternative: hukumu kwa niaba ya Yahwe
  rationale: Muundo uliochaguliwa huhifadhi upana na mvutano wa kirai cha Kiebrania bila kuamua kimya-kimya kama kinamaanisha sheria ya Mungu, mamlaka yake, au mashauri yanayomhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Aliwaweka rasmi” na “migogoro ya kisheria” vinaeleweka kwa wasomaji wa kawaida huku vikidumisha mazingira ya kiutawala na kimahakama. Muundo mgumu wa mwisho wa Kiebrania haujasahihishwa kimya-kimya.
