  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: sw
  text: Akawaambia waamuzi, “Angalieni mnachofanya, kwa maana hamhukumu kwa ajili ya mwanadamu[a], bali kwa ajili ya Yahwe; naye yuko pamoja nanyi katika jambo la hukumu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanadamu.” Neno la Kiebrania liko katika umoja lakini limetumiwa kwa maana ya binadamu kwa ujumla, likitofautishwa na Yahwe.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika jambo la haki,” au “mnapotoa hukumu.” Kirai cha Kiebrania kinaweza kutaja tendo la kuhukumu au mambo ya kimahakama kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: waamuzi
  rationale: Kitenzi-shirikishi kimetumika kama nomino na kinawataja maafisa waliowekwa kusikiliza mashauri na kutoa hukumu; “waamuzi” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: רְאוּ
  choice: Angalieni
  rationale: Amri hii inawataka wazingatie kwa makini mwenendo wao; “Angalieni” huhifadhi nguvu ya agizo bila kuifanya kuwa maelezo marefu.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: mnachofanya
  rationale: Kauli hii inawalenga katika utendaji wao unaoendelea wa kimahakama na ni ya kawaida katika Kiswahili cha sasa.
- source_word: לְאָדָם
  choice: kwa ajili ya mwanadamu
  rationale: Nomino ya umoja אָדָם imetumika kwa maana ya jumla na inaleta tofauti kati ya mwanadamu na Yahwe. “Mwanadamu” huhifadhi umoja huo huku ikieleweka kwa maana pana.
- source_word: תִּשְׁפְּטוּ
  choice: hamhukumu
  rationale: Mzizi שׁפט hapa unamaanisha kutekeleza wajibu wa kutoa hukumu. Kitenzi “kuhukumu” ni kifupi, cha kawaida, na kinafaa katika kauli hii ya maonyo.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kihusishi kinaonyesha kwamba waamuzi wanatekeleza kazi hii kwa niaba ya Yahwe na kuwajibika kwake. Jina la agano יהוה limetolewa kama “Yahwe” katika tahajia ya kawaida ya Kiswahili.
- source_word: וְעִמָּכֶם
  choice: naye yuko pamoja nanyi
  rationale: Kiswahili kinahitaji kitenzi wazi. Kiambishi “naye” kinamrejelea Yahwe katika kishazi kilichotangulia na kuhifadhi wazo la kuwapo kwake pamoja na waamuzi.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: katika jambo la hukumu
  rationale: דבר inaweza kumaanisha jambo au shauri, na משפט inaweza kumaanisha hukumu au haki. Tafsiri hii huhifadhi lugha ya kimahakama na upana wa kirai cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya jumla ya אָדָם katika umoja
  choice: mwanadamu
  alternative: wanadamu
  rationale: Umoja wa Kiebrania unamtaja mwanadamu kwa maana ya jumla, ukimtofautisha na Yahwe. “Mwanadamu” huhifadhi umoja na bado linaweza kueleweka kuwa linawakilisha binadamu kwa ujumla.
- issue: Uhusiano wa kuwapo kwa Yahwe na utoaji wa hukumu
  choice: naye yuko pamoja nanyi katika jambo la hukumu
  alternative: naye yuko pamoja nanyi mnapotoa hukumu
  rationale: Kiebrania hakielezi kwa undani kama בדבר משפט ni tendo lenyewe la kutoa hukumu au mambo ya kimahakama kwa ujumla. Tafsiri iliyochaguliwa inadumisha upana huo badala ya kuufanya kuwa wakati wa tendo pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa moja kwa moja wa onyo umehifadhiwa, pamoja na istilahi za kimahakama na utata halisi wa kirai cha mwisho.
