lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Akaweka
  rationale: Hifili ya עמד hapa ina maana ya kuwaweka watu katika wadhifa. “Akaweka” ni ya asili kwa Kiswahili na haimaanishi tu kuwafanya wasimame.
- source_word: שֹׁפְטִים
  choice: waamuzi
  rationale: Nomino hii inarejelea maofisa waliokuwa na jukumu la kutoa hukumu; “waamuzi” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Tafsiri hii inafuata kwa karibu kirai cha Kiebrania. Wigo wa mgawanyo unaelezwa zaidi na kirai kinachofuata.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: katika miji yote ya Yuda
  rationale: Inahifadhi kihusishi na maana ya ujumla wa miji inayotajwa.
- source_word: הַבְּצֻרוֹת
  choice: yenye ngome
  rationale: Kivumishi kinaeleza miji iliyoimarishwa kwa ulinzi. “Yenye ngome” ni Kiswahili cha kawaida na chenye kueleweka.
- source_word: לְעִיר וָעִיר
  choice: mji kwa mji
  rationale: Inahifadhi msisitizo wa nahau ya ugawaji, ikionyesha kwamba waamuzi waliwekwa katika kila mji mmoja mmoja.
