  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: sw
  text: Yehu mwana wa Hanani, mwonaji, akatoka kumlaki, akamwambia Mfalme Yehoshafati, “Je, inakupasa kumsaidia mwovu na kuwapenda wale wanaomchukia Yahweh? Kwa sababu ya jambo hili, ghadhabu kutoka katika uwepo wa Yahweh iko juu yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: akatoka kwenda kumlaki
  rationale: Nahau hii ina maana ya kutoka ili kukutana na mtu. ‘Kumlaki’ ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi tendo la kutoka kumwona aliyekuwa akija.
- source_word: הַחֹזֶה
  choice: mwonaji
  rationale: Neno חֹזֶה ni cheo mahsusi cha kinabii chenye maana ya ‘seer’; ‘mwonaji’ huhifadhi utofauti wake wa kileksia badala ya kulipanua kuwa ‘nabii’.
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: Je, inakupasa kumsaidia mwovu
  rationale: Kiulizi pamoja na kitenzi-jina kinaonyesha karipio. Umoja ‘mwovu’ unaendana na umbo la Kiebrania na unaweza kumrejelea mtu hususa bila kumtaja kwa jina.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: na kuwapenda wale wanaomchukia Yahweh
  rationale: Huhifadhi nguvu ya kitenzi katika participle שֹׂנְאֵי, ‘wale wanaochukia,’ badala ya tafsiri pana zaidi ya ‘maadui.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi ‘Yahweh,’ wala halijabadilishwa kuwa cheo.
- source_word: וּבָזֹאת
  choice: Kwa sababu ya jambo hili
  rationale: Kirai hiki kinaelekeza nyuma kwenye kitendo cha Yehoshafati na kuonyesha sababu ya hukumu inayofuata; ‘jambo hili’ huepuka utata wa kiwakilishi pekee.
- source_word: עָלֶיךָ קֶּצֶף
  choice: ghadhabu ... iko juu yako
  rationale: ‘Ghadhabu’ huwasilisha uzito wa קֶצֶף, na ‘iko juu yako’ huhifadhi taswira halisi ya muundo wa Kiebrania.
- source_word: מִלִּפְנֵי יְהוָה
  choice: kutoka mbele za Yahweh
  rationale: Huhifadhi taswira ya chanzo ‘kutoka mbele/uweponi mwa Yahweh’ na hadhi ya usemi wa Kiebrania; katika Kiswahili, ‘mbele za’ ni tamko linaloeleweka la kuwa katika uwepo wa mwenye mamlaka.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. Kulitohowa kama ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Upeo wa ‘mwovu’ na ‘wale wanaomchukia Yahweh’
  choice: Makundi ya kimaadili yamehifadhiwa bila kumtaja Ahabu
  alternative: Ahabu mwovu na maadui wa Yahweh
  rationale: Ingawa muktadha unamhusu Ahabu, mstari wenyewe unatumia maelezo ya kimaadili. Tafsiri haibani usemi huo kwa kuongeza jina lisilokuwamo katika chanzo.
- issue: Asili ya ghadhabu
  choice: ghadhabu kutoka mbele za Yahweh
  alternative: Yahweh amekukasirikia
  rationale: Tafsiri iliyochaguliwa huhifadhi lugha ya chanzo kuhusu ghadhabu na asili yake bila kuigeuza kuwa paraphrase inayofuta taswira ya ‘mbele za Yahweh.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kama Yehu, Hanani, na Yehoshafati. Hakuna tanbihi iliyohitajika; maana ya nahau imewasilishwa moja kwa moja katika matini.
