base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: sw
  text: Kila kitanda ambacho mwanamume mwenye utokaji wa majimaji ya mwili hulalia kitakuwa najisi, na kila kitu[a] anachokalia kitakuwa najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila chombo” au “kila kifaa.” Neno la Kiebrania lina maana pana ya kitu, kifaa, au chombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: kitanda
  rationale: Neno מִשְׁכָּב humaanisha mahali pa kulalia. Katika muktadha huu, “kitanda” ni tafsiri ya kawaida na inayoeleweka vizuri kwa Kiswahili.
- source_word: הַזָּב
  choice: mwanamume anayetokwa na majimaji
  rationale: Hiki ni kivumishi-jina cha kiume kinachomtaja mtu mwenye mtiririko wa majimaji ya mwili. Tafsiri hii inadumisha jinsia ya kiume ya maandishi bila kubainisha kimakosa kwamba majimaji hayo ni usaha au ugonjwa fulani.
- source_word: יִשְׁכַּב עָלָיו
  choice: hulalia
  rationale: Kitenzi cha mazoea “hulalia” kinaonyesha hali ya jumla katika sheria hii na kuwasilisha kwa Kiswahili asili maana ya kulala juu ya kitu.
- source_word: יִטְמָא
  choice: kitakuwa najisi
  rationale: Kitenzi טמא hapa kinaeleza hadhi ya unajisi inayotokana na mgusano. “Kitakuwa najisi” kinahifadhi matokeo ya kisheria bila kudokeza hatia ya kimaadili.
- source_word: הַכְּלִי
  choice: kitu
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu. Kwa kuwa kinachotajwa hapa ni kitu kinachoweza kukaliwa, “kitu” ni cha kawaida na hakikifanyi kimakosa kuwa chombo cha kuwekea vitu.
- source_word: יֵשֵׁב עָלָיו
  choice: anachokalia
  rationale: Muundo huu unatafsiri kwa kawaida ישׁב pamoja na עַל, yaani kuketi au kukaa juu ya kitu.
theological_decisions:
- issue: Maana ya unajisi
  choice: najisi
  alternative: najisi kiibada; kilichotiwa unajisi
  rationale: Muktadha unahusu hadhi ya utakaso wa Kilawi, si lazima hatia ya kimaadili. “Najisi” inahifadhi istilahi ya msingi bila kuongeza ufafanuzi usiokuwapo katika Kiebrania.
- issue: Jinsia ya mhusika
  choice: mwanamume anayetokwa na majimaji
  alternative: mtu anayetokwa na majimaji
  rationale: Kiebrania kinatumia maumbo ya umoja wa kiume, na muktadha wa karibu unamhusu mwanamume. Kwa hiyo jinsia ya kiume imeonyeshwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisheria, wenye heshima na unaoeleweka kwa msomaji wa kawaida. “Anayetokwa na majimaji” huepuka utambuzi maalumu wa ugonjwa na pia huepuka kudai kwamba majimaji hayo ni usaha.
