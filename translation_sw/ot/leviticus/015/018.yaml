  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: sw
  text: Ikiwa mwanamume atalala na mwanamke na kumwaga shahawa[a], wote wawili wataoga kwa maji, nao watakuwa najisi[b] mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utokaji wa shahawa.” Kirai cha Kiebrania kinamaanisha hasa utokaji wa shahawa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, watakuwa najisi kiibada mpaka jioni.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר
  choice: Ikiwa ... mwanamke
  rationale: Katika muktadha huu wa sheria, muundo wa kiunganishi pamoja na kishazi rejeshi una nguvu ya sharti. “Ikiwa” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kupoteza mhusika wa kike.
- source_word: יִשְׁכַּב אִישׁ אֹתָהּ
  choice: mwanamume atalala na mwanamke
  rationale: Kitenzi שׁכב katika muundo huu ni nahau ya kujamiiana. “Kulala na” huhifadhi tasfida na hadhi ya lugha ya sheria huku maana ikieleweka.
- source_word: שִׁכְבַת זָרַע
  choice: na kumwaga shahawa
  rationale: Kirai hiki kinahusu hasa kutoka kwa shahawa wakati wa tendo. Tafsiri hii ni ya asili na wazi kwa Kiswahili, bila kutumia “mbegu” ambayo hapa inaweza kuwa na utata usiohitajika.
- source_word: וְרָחֲצוּ
  choice: wote wawili wataoga
  rationale: Kitenzi ni cha wingi na kinawahusu washiriki wote wawili. Kutaja “wote wawili” huweka wazi rejeo hilo; “wataoga” linafaa kwa kuosha mwili katika muktadha huu.
- source_word: בַמַּיִם
  choice: kwa maji
  rationale: Ingawa kihusishi cha Kiebrania kinaweza kutafsiriwa kihalisi “ndani ya maji,” “kuoga kwa maji” ni Kiswahili cha kawaida na hakiainishi isivyostahili namna ya kuoga.
- source_word: וְטָמְאוּ
  choice: watakuwa najisi
  rationale: “Najisi” ni istilahi fupi inayofaa kwa hali ya kutokuwa safi kiibada katika Walawi, bila kuingiza wazo la hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hii inafuata kikomo cha wakati kilicho wazi katika Kiebrania bila kukifasiri kwa namna finyu zaidi kuwa machweo.
theological_decisions:
- issue: Asili ya unajisi katika sheria za utakaso za Walawi
  choice: Kutumia “najisi” katika matini na kueleza katika tanbihi kwamba ni hali ya kiibada
  alternative: “wasio safi kiibada” au “najisi kidesturi” ndani ya matini
  rationale: Mstari unaeleza hali ya muda ya kutokuwa safi kiibada baada ya kujamiiana, si lazima kosa au dhambi ya kimaadili. Matini inahifadhi neno fupi, huku tanbihi ikizuia wasomaji kulielewa kama lawama ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. “Kulala na” ni tasfida inayoakisi nahau ya Kiebrania; “kumwaga shahawa” huweka wazi jambo la mwili linalokusudiwa. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayofafanuliwa.
