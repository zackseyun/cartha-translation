base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: sw
  text: Na kila mtu anayegusa kitu chochote ambacho mwanamke huyo anakalia[a] atafua nguo zake, ataoga kwa maji, naye atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chombo chochote” au “kifaa chochote.” Neno la Kiebrania כְּלִי ni pana na linaweza kumaanisha kitu, chombo, au kifaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Na kila mtu atakayegusa
  rationale: Kirai hiki kinahusu mtu yeyote katika kundi lote; muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya jumla ya participio ya Kiebrania.
- source_word: בְּכָל כְּלִי
  choice: kitu chochote
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu; katika muktadha wa kitu kinachokaliwa, ‘kitu chochote’ ni pana na ya kawaida bila kulibana kuwa chombo pekee.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: ambacho huyo mwanamke amekalia
  rationale: Kiambishi cha kike katika kitenzi kinamrejelea mwanamke wa muktadha uliotangulia. ‘Huyo mwanamke’ huweka rejeo wazi, na hali timilifu ya Kiswahili inafaa kwa kugusa kitu baada ya yeye kukikalia.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lazima afue nguo zake
  rationale: כִּבֵּס בהקשר ya nguo humaanisha kufua. ‘Lazima’ huwasilisha nguvu ya agizo la kisheria kwa Kiswahili cha sasa.
- source_word: וְרָחַץ בַּמַּיִם
  choice: na kuoga kwa maji
  rationale: Katika sheria za utakaso, רָחַץ huonyesha kuuosha mwili; ‘kuoga kwa maji’ ni wazi na ya kawaida.
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: ‘Najisi’ huhifadhi hali ya kutokuwa safi kiibada bila kudokeza moja kwa moja hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hiki ndicho kipindi ambacho hali ya unajisi inaendelea; ‘mpaka jioni’ ni tafsiri ya asili na sahihi katika Kiswahili.
theological_decisions:
- issue: Asili ya unajisi katika sheria za utakaso za Mambo ya Walawi
  choice: Kutafsiri טָמֵא kuwa ‘najisi’ kama hali ya kiibada, bila kuingiza lugha ya hatia ya kimaadili.
  alternative: asiye safi; aliyetiwa unajisi
  rationale: Mstari huu unahusu hali ya kiibada inayotokana na kugusa kitu, si tamko kwamba mtu ametenda dhambi. ‘Najisi’ huhifadhi aina hiyo ya hali katika muktadha wa Mambo ya Walawi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa agizo umewekwa wazi kwa ‘lazima,’ huku istilahi ‘najisi’ ikihifadhi sajili ya sheria za kiibada. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
