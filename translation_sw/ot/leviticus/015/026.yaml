id: LEV.15.26
reference: Leviticus 15:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: sw
  text: Kila kitanda atakacholalia siku zote za kutokwa kwake kitakuwa kwake kama kitanda cha hedhi yake[a]. Na kila kitu atakachokalia kitakuwa najisi[b], kama unajisi wa hedhi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitanda cha hali yake ya kutengwa wakati wa hedhi.” Neno la Kiebrania נִדָּה linaweza kumaanisha hedhi pamoja na hali ya kiibada na utengano unaohusiana nayo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “kitu” ni pana; linaweza kumaanisha chombo, kifaa, au kitu kingine anachokalia, wala si chombo cha kuwekea vitu pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּשְׁכָּב
  choice: kitanda
  rationale: Neno hili humaanisha mahali pa kulala; “kitanda” ni Kiswahili cha kawaida na linafaa katika muktadha huu wa sheria za utakaso.
- source_word: תִּשְׁכַּב עָלָיו
  choice: atakacholalia
  rationale: Kitenzi שׁכב pamoja na עַל humaanisha kulala juu ya kitu; “atakacholalia” ni usemi wa asili na mfupi katika Kiswahili.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: siku zote za kutokwa kwake
  rationale: זוֹב hurejelea mtiririko au uchafu unaotoka mwilini, hapa ukiwa hali isiyo ya kawaida iliyozungumziwa katika sura hii. “Kutokwa kwake” ni wazi bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: kama kitanda cha hedhi yake
  rationale: Katika muktadha huu נִדָּה hurejelea hali ya hedhi na utengano wa kiibada unaohusiana nayo. Tafsiri hii inaweka rejeleo halisi katika matini na kuhifadhi upana wake katika tanbihi.
- source_word: יִהְיֶה לָּהּ
  choice: kitakuwa kwake
  rationale: Muundo huu unaonyesha hadhi ya kitanda kuhusiana na mwanamke huyo. “Kitakuwa kwake” huhifadhi muundo na maana hiyo bila kuingiza ufafanuzi wa ziada.
- source_word: כְּלִי
  choice: kitu
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu kinachotumiwa. Kwa kuwa hapa ni kitu anachokalia, “kitu” huepuka maana finyu ya chombo cha kuwekea vitu.
- source_word: תֵּשֵׁב עָלָיו
  choice: atakachokalia
  rationale: ישׁב pamoja na עַל humaanisha kuketi juu ya kitu; “atakachokalia” ni Kiswahili cha kawaida na sahihi.
- source_word: טָמֵא
  choice: najisi
  rationale: “Najisi” ni istilahi iliyozoeleka katika Kiswahili kwa hali ya kutokuwa safi kiibada katika sheria za Walawi, bila kudokeza moja kwa moja hatia ya kimaadili.
- source_word: כְּטֻמְאַת נִדָּתָהּ
  choice: kama unajisi wa hedhi yake
  rationale: “Unajisi” hudumisha uhusiano wa kileksia na “najisi,” huku “wa hedhi yake” ikibainisha msingi wa ulinganisho.
theological_decisions:
- issue: Asili ya lugha ya טָמֵא / טֻמְאָה katika sheria za Walawi
  choice: najisi/unajisi wa kiibada
  alternative: si safi/uchafu; najisi kama hukumu ya kimaadili
  rationale: Aya hii inahusu hadhi katika mfumo wa utakaso wa Israeli, si tamko kwamba mwanamke ana hatia ya dhambi. “Najisi/unajisi” huhifadhi istilahi ya kisheria bila kuigeuza kuwa hukumu ya maadili.
- issue: Maana ya נִדָּה
  choice: hedhi katika matini, huku maana ya hali ya utengano wa kiibada ikielezwa katika tanbihi
  alternative: unajisi wa hedhi; hali ya kutengwa wakati wa hedhi
  rationale: Muktadha unarejelea wazi hedhi, lakini neno la Kiebrania linaweza pia kujumuisha hali ya kiibada na utengano unaohusiana nayo. Tanbihi huhifadhi upana huo bila kulemea matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisheria unaoeleweka kwa msomaji wa kawaida. “Kutokwa,” “hedhi,” na “najisi” zinatumika kwa uwazi bila lugha ya kuficha au kuhusisha hali hii na hatia ya kimaadili.
