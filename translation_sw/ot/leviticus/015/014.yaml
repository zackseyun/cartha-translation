source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: sw
  text: Na siku ya nane atajichukulia hua wawili au makinda mawili ya njiwa, naye atakuja mbele za Yahweh, kwenye mlango wa Hema la Kukutania, na kumkabidhi kuhani ndege hao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Hutoa kwa uwazi wakati wa hatua inayofuata katika utaratibu wa utakaso; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: יִקַּח לוֹ
  choice: atajichukulia
  rationale: Muundo wa kitenzi wenye kiambishi -ji- unadumisha maana ya לוֹ, yaani kwamba mtu huyo anajipatia ndege kwa ajili ya sadaka yake.
- source_word: שְׁתֵּי תֹרִים
  choice: hua wawili
  rationale: תֹרִים ni hua, aina ya ndege wanaotofautishwa hapa na makinda ya njiwa; upatanisho wa viumbe hai umetumiwa kwa lugha ya kawaida.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: au makinda mawili ya njiwa
  rationale: Nahau ya Kiebrania, kihalisi ‘wana wa njiwa,’ humaanisha njiwa wachanga; ‘makinda’ ni neno la kawaida na mahususi kwa ndege wachanga.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: naye atakuja mbele za Yahwe
  rationale: Kauli hii inaendeleza maagizo ya kisheria. ‘Mbele za’ hudumisha wazo la kuingia mbele ya uwepo wa Mungu bila kulifafanua kupita chanzo.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye ingilio la hema la kukutania
  rationale: פֶּתַח ni ingilio au mlango, na אֹהֶל מוֹעֵד ni hema lililowekwa kwa kukutana; ‘kwenye’ ni ya kawaida katika Kiswahili huku ikitaja mahali alikofikia.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: na kumpa kuhani ndege hao
  rationale: Neno ‘kumpa’ linaonyesha uhamisho wa moja kwa moja kwa kuhani, na ‘ndege hao’ linaweka wazi rejea ya kiambishi cha wingi bila utata wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina la agano YHWH. ‘Yahwe’ hulitambulisha kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikihifadhi desturi mbadala ya kulitafsiri ‘BWANA’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, ulio wazi na wa sasa. Sentensi inadumisha mfuatano wa maagizo ya Kiebrania, huku ‘hema la kukutania’ na ‘mbele za Yahwe’ zikihifadhi msamiati wa ibada unaoeleweka.
