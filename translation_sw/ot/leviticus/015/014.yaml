    issue: Tahajia ya jina la Mungu hailingani na uamuzi wa POB.
    rationale: Chanzo kina יְהוָה, na mkondo wa Kiingereza pamoja na uamuzi wa kiteolojia umechagua “Yahweh.” Rasimu ina “Yahwe,” huku tanbihi ikikitaja “Yahwe” kama mbadala.
  - severity: low
    issue: “Ingilio la hema la kukutania” si istilahi ya kawaida zaidi katika Kiswahili cha Biblia.
    rationale: “Mlango wa Hema la Kukutania” ni ya asili, wazi, na inawakilisha פֶּתַח אֹהֶל מוֹעֵד bila kupunguza maana.
