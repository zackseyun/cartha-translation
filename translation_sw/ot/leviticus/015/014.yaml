revisions:
- from: Siku ya nane atajichukulia hua wawili au makinda mawili ya njiwa, naye atakuja mbele za Yahwe[a], kwenye ingilio la hema la kukutania, na kumpa kuhani ndege hao.
  to: Na siku ya nane atajichukulia hua wawili au makinda mawili ya njiwa, naye atakuja mbele za Yahweh, kwenye mlango wa Hema la Kukutania, na kumkabidhi kuhani ndege hao.[a]
  rationale: Marekebisho yanadumisha mfuatano wa hatua, idadi na aina mbili za ndege, kuja mbele za Yahweh kwenye mlango wa Hema la Kukutania, na kuwapa ndege hao kuhani. “Yahweh” inalinganishwa na uamuzi wa POB; tanbihi imeondoa dai lisilo sahihi kwamba “Yahwe” ni tafsiri mbadala, na badala yake inaeleza desturi ya “BWANA.”
