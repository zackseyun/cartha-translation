  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: sw
  text: Mwanamke akiwa na mtiririko, na mtiririko wake katika mwili wake[a] ni damu, atakuwa katika hali ya unajisi wa hedhi[b] kwa siku saba; na yeyote atakayemgusa atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya neno kwa neno: “katika nyama yake”; hapa “nyama” inamaanisha mwili.'
    reason: lexical_alternative
  - marker: b
    text: “Unajisi wa hedhi” hapa ni hali ya kutokuwa safi kiibada kulingana na sheria ya Walawi; si lazima iwe kosa la kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: akiwa na mtiririko / mtiririko wake
  rationale: Mzizi זוּב unaonyesha majimaji yanayotiririka kutoka mwilini. “Mtiririko” ni wa kawaida na pia unadumisha uhusiano wa maneno kati ya kitenzi na nomino ya Kiebrania; damu inayofuata inabainisha aina ya mtiririko.
- source_word: דָּם
  choice: damu
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania na inabainisha mtiririko unaozungumziwa.
- source_word: בִּבְשָׂרָהּ
  choice: mwilini mwake
  rationale: Ingawa בשר kwa msingi ni “nyama,” hapa inarejelea mwili wa mwanamke. “Mwilini mwake” ni Kiswahili cha kawaida na kinahifadhi kihusishi cha Kiebrania chenye maana ya “katika.”
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Ni usemi wa moja kwa moja wa muda katika Kiswahili cha kawaida.
- source_word: בְנִדָּתָהּ
  choice: katika hali ya unajisi wa hedhi
  rationale: Katika sheria za Walawi, נִדָּה huonyesha hali ya unajisi wa kiibada inayohusiana na hedhi, si tukio la kibayolojia pekee.
- source_word: וְכָל הַנֹּגֵעַ בָּהּ
  choice: Yeyote atakayemgusa
  rationale: כל pamoja na umbo la kishiriki huonyesha mtu yeyote kwa ujumla. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: “Najisi” ni istilahi inayofaa kwa hali ya kutokuwa safi kiibada katika sheria hii, bila kudokeza moja kwa moja hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Ni tafsiri ya kawaida na ya asili ya mpaka wa muda unaotajwa katika Kiebrania.
theological_decisions:
- issue: Kutafsiri istilahi za unajisi bila kuingiza wazo la hatia ya kimaadili
  choice: “hali ya unajisi wa hedhi” na “atakuwa najisi” kama hali za kiibada
  alternative: “uchafu wa hedhi” au “amenajisika”
  rationale: Muktadha wa Walawi 15 unahusu hadhi ya kiibada chini ya sheria ya utakaso. “Unajisi” huhifadhi maana hiyo bila kusema kwamba hedhi yenyewe ni kosa la kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inadumisha urudiaji wa “mtiririko” uliopo katika Kiebrania, lakini hutumia “hali ya” ili istilahi ya kisheria na kiibada ieleweke kwa msomaji wa kawaida.
