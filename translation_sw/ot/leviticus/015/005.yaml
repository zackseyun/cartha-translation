  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: sw
  text: Na mwanamume yeyote atakayegusa kitanda chake[a] atafua nguo zake na kuoga kwa maji, naye atakuwa najisi[b] mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pake pa kulalia.” Neno la Kiebrania linaweza kumaanisha kwa upana zaidi mahali alipolala, si lazima kitanda kilichotengenezwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, atakuwa najisi kiibada kulingana na kanuni za utakaso.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: Na mtu yeyote atakaye
  rationale: Katika sheria hii, אִישׁ yenye umoja wa kiume inamtaja mtu anayefanya tendo hilo kwa maana ya jumla; “mtu yeyote” ni Kiswahili cha kawaida na wazi bila kubadili mhusika kuwa wingi.
- source_word: יִגַּע
  choice: atagusa
  rationale: Kitenzi נגע humaanisha kugusa au kufikia; “atagusa” kinahifadhi maana ya moja kwa moja ya mgusano.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: kitanda chake
  rationale: מִשְׁכָּב ni mahali pa kulalia, mara nyingi kitanda au matandiko. “Kitanda chake” ni tafsiri fupi na ya kawaida, huku tanbihi ikihifadhi maana pana zaidi.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: atafua nguo zake
  rationale: כִּבֵּס hapa ni kufua mavazi, si kuosha mwili; “atafua nguo zake” ni usemi sahihi na wa kawaida wa Kiswahili.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: na kuoga kwa maji
  rationale: רחץ katika muktadha huu ni kuosha mwili. “Kuoga kwa maji” hutofautisha tendo hili na kufua nguo na kuonyesha chombo cha kuoshea kinachotajwa katika Kiebrania.
- source_word: וְ/טָמֵא
  choice: naye atakuwa najisi
  rationale: טָמֵא inaonyesha hali ya kutokuwa safi kulingana na kanuni za utakaso wa Walawi. “Najisi” huhifadhi istilahi ya kibiblia bila kuifanya iwe hatia ya kimaadili.
- source_word: עַד הָ/עָרֶב
  choice: mpaka jioni
  rationale: Kirai hiki kinaonyesha muda ambao hali ya unajisi itaendelea; “mpaka jioni” ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Asili ya hali ya טָמֵא katika sheria za utakaso
  choice: Kutumia “najisi” katika matini kuu na kueleza katika tanbihi kuwa ni hali ya kiibada kulingana na kanuni za utakaso.
  alternative: Kupanua matini kuu kuwa “najisi kiibada” au “asiye safi kiibada.”
  rationale: Muktadha unahusu hadhi ya utakaso inayotokana na kugusa mahali alipolala mwenye usaha, wala hauongezi dai la hatia ya kimaadili. Matini kuu inahifadhi istilahi ya chanzo, na tanbihi inazuia kutoeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa kisheria umeonyeshwa kwa wakati ujao unaotoa matokeo yanayowajibika (“atafua,” “atakuwa”), badala ya kutumia lugha nzito au ya kizamani. Alama zote za tanbihi zimo katika matini kuu.
