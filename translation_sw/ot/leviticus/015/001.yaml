lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Wayyiqtol inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida. “Akasema” ni ya asili hapa, huku formula inayofuata ikitambulisha maneno yatakayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa na cheo “BWANA.”
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: na Musa na Aroni
  rationale: Kwa Kiswahili, kitenzi “kusema” humtaja anayeambiwa kwa “na”; urudiaji wa Kiebrania wa אֶל unaakisiwa kwa “na” mbele ya kila jina bila kuleta muundo usio wa kawaida.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika Kiswahili cha sasa, nukta mbili hutambulisha kwa ufasaha usemi wa moja kwa moja unaofuata katika mstari unaofuata; huepuka usemi mzito “akisema.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kwa kuwa usemi wenyewe unaanza katika mstari unaofuata.
