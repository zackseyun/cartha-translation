base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: sw
  text: Na chombo cha udongo ambacho mwenye mtiririko atakigusa kitavunjwa,[a][b] na kila chombo cha mbao kitaoshwa kwa maji.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chombo cha mfinyanzi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mwenye mtiririko,” neno la kiufundi katika sheria za utakaso kwa mtu aliyeathiriwa na mtiririko wa majimaji mwilini.
    reason: cultural_note
  - marker: c
    text: Au, “kitasuuzwa kwa maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: chombo cha udongo
  rationale: Kirai hiki humaanisha chombo kilichotengenezwa kwa udongo wa mfinyanzi; tafsiri hii ni ya kawaida na inadumisha tofauti ya nyenzo iliyo muhimu katika sheria ya utakaso.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: ambacho ... atakigusa
  rationale: Kitenzi נגע katika Qal kwa kawaida humaanisha ‘kugusa’; muundo huu unawasilisha moja kwa moja uhusiano wa kishazi.
- source_word: הַזָּב
  choice: mwenye mtiririko
  rationale: Hili ni neno la kiufundi katika sheria za utakaso kwa mtu aliye na mtiririko wa majimaji mwilini. ‘Mwenye mtiririko’ ni kifupi, cha kueleweka, na hakiongezi maelezo yasiyosemwa wazi katika mstari.
- source_word: יִשָּׁבֵר
  choice: kitavunjwa
  rationale: Niphal ya שבר ni kauli tendwa yenye nguvu ya agizo la kisheria katika muktadha huu; wakati ujao wa Kiswahili huwasilisha agizo hilo kwa kawaida.
- source_word: כָל כְּלִי עֵץ
  choice: kila chombo cha mbao
  rationale: Kirai hiki hurejelea kila kifaa au chombo kilichotengenezwa kwa mbao; ‘chombo’ hudumisha ulinganifu na chombo cha udongo.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: kitaoshwa kwa maji
  rationale: שטף hapa ni kuosha au kusuuza kwa maji. ‘Kitaoshwa kwa maji’ ni Kiswahili cha kawaida na kinadumisha uwezekano mpana wa tendo hilo.
