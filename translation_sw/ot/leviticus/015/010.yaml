  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: sw
  text: Na kila mtu atakayegusa kitu chochote kilichokuwa chini yake atakuwa najisi mpaka jioni[a]. Yeyote atakayebeba vitu hivyo atafua nguo zake, ataoga kwa maji[b], naye atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu chochote kilicho chini yake.” Kiebrania kinaweza kutafsiriwa kwa wakati wa sasa, lakini wakati uliopita unafaa muktadha wa vitu vilivyokuwa chini ya mtu aliyeathiriwa.
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, kiwakilishi cha wingi kinarejelea kwa pamoja vitu vinavyohusiana na kile kilichokuwa chini yake.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: atakayegusa
  rationale: Kitenzi kishirikishi cha נגע hapa kinaonyesha kugusa kimwili; ‘atakayegusa’ ni Kiswahili cha kawaida na hudumisha nguvu ya jumla ya sheria.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: kitu chochote kilichokuwa chini yake
  rationale: Kirai kinarejelea vitu vilivyokuwa chini ya mtu mwenye utoko. Wakati uliopita unafaa muktadha wa utaratibu, ingawa Kiebrania kinaweza kutafsiriwa kwa wakati wa sasa.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Katika sheria za utakaso, טמא humaanisha kuwa katika hali ya unajisi wa kiibada; ‘atakuwa najisi’ ni wazi na haliongezi wazo la unajisi wa kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hii ni kauli ya asili katika Kiswahili na inaonyesha kikomo cha muda kilichotajwa katika Kiebrania.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: yeyote atakayevibeba vitu hivyo
  rationale: נשא hapa ni kubeba. Kiwakilishi cha wingi wa Kiebrania kinafafanuliwa kwa ‘vitu hivyo’ ili rejeleo lake la pamoja lieleweke kwa Kiswahili.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: atafua nguo zake
  rationale: ‘Kufua nguo’ ni usemi wa kawaida na sahihi wa Kiswahili kwa kuosha mavazi.
- source_word: וְרָחַץ בַּמַּיִם
  choice: ataoga kwa maji
  rationale: רחץ katika kanuni hii ya utakaso inaonyesha kuuosha mwili; ‘ataoga kwa maji’ huwasilisha maana hiyo kwa lugha ya kawaida.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: naye atakuwa najisi mpaka jioni
  rationale: Kirai hiki kinadumisha hali ya unajisi hadi jioni hata baada ya kufua na kuoga, bila kudokeza kwamba matendo hayo yanaikomesha mara moja.
theological_decisions:
- issue: Maana ya ‘najisi’
  choice: Kutumia ‘najisi’ kwa hali ya kiibada
  alternative: ‘asiye safi’ au lugha inayoweza kueleweka kuwa hukumu ya kimaadili
  rationale: Muktadha ni sheria ya usafi wa kiibada, si tangazo kwamba mtu ana hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Mtindo wa kisheria umehifadhiwa bila kuwa mgumu kupita kiasi. ‘Najisi’ imetumiwa kama istilahi ya kawaida ya hali ya kiibada.
