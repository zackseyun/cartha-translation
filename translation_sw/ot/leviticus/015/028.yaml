base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: sw
  text: Lakini akishakuwa safi kutokana na utoko wake[a], atajihesabia siku saba, na baada ya hapo atakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “utoko wake ukiutoka ... baada ya hapo atatakasika.” Kiebrania kinatumia mzizi uleule katika vishazi vyote viwili: kwanza kuhusu kuwa huru kutokana na utoko, kisha kuhusu hadhi ya usafi wa kiibada inayofuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini aki-
  rationale: Muundo wa masharti unaendeleza na kutofautisha hali hii na iliyotangulia; “lakini” pamoja na kiambishi cha masharti “-ki-” ni Kiswahili cha kawaida na cha wazi.
- source_word: טָהֲרָה
  choice: akitakasika
  rationale: Kitenzi hiki kinaonyesha kutoka katika hali iliyosababishwa na utoko. “Kutakasika” huhifadhi maana ya usafi wa kiibada bila kudokeza kwamba hapa pana hukumu ya kimaadili.
- source_word: מִזּוֹבָהּ
  choice: kutokana na utoko wake
  rationale: “Utoko” ni neno la kawaida la Kiswahili kwa majimaji yanayotoka mwilini katika muktadha huu; “kutokana na” linaonyesha kuondokana na hali hiyo.
- source_word: וְסָפְרָה לָּהּ
  choice: atajihesabia
  rationale: Kauli hii huhifadhi wazo la mwanamke kujihesabia siku zinazomhusu mwenyewe na kuendeleza hatua inayofuata ya utaratibu.
- source_word: שִׁבְעַת יָמִים
  choice: siku saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya idadi pamoja na nomino.
- source_word: וְאַחַר
  choice: na baada ya hapo
  rationale: Inaonyesha wazi hatua inayofuata baada ya kukamilika kwa siku saba.
- source_word: תִּטְהָר
  choice: atakuwa safi
  rationale: Hapa mzizi טהר unaonyesha hadhi ya usafi wa kiibada inayopatikana baada ya siku saba, tofauti na kukoma kwa utoko katika kishazi cha kwanza.
theological_decisions:
- issue: Istilahi ya usafi wa kiibada
  choice: Kutumia “kutakasika/safi” kwa maana ya hadhi ya kiibada, si uadilifu wa kimaadili.
  alternative: Kutumia “kuwa safi/kutakaswa” kwa namna inayoweza kueleweka kuwa usafi wa mwili au kuondolewa dhambi.
  rationale: Mambo ya Walawi 15 yanahusu hadhi ya kiibada inayohusiana na utoko wa mwili, wala si kutangaza hatia ya kimaadili. Tafsiri inadumisha tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Utoko” ni wazi katika sheria hii ya mwili; “atajihenesabia” limeepukwa, na “ataj ضمن” hakuna. “Atajihesabia siku saba” ni muundo wa asili unaohifadhi kiwakilishi cha Kiebrania לָּהּ.
