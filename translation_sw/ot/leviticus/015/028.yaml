review_pass:
  verdict: revise
  source_fidelity: 'The main procedural sense is preserved: cessation of the discharge, a seven-day count, and subsequent ritual cleanness. However, “akitakasika” is an imperfect conditional (“as/if she is being purified”) and does not clearly convey the Hebrew perfect condition that her discharge has already ceased. “Akishakuwa safi kutokana na utoko wake” more accurately marks this prior condition while retaining the ritual-purity vocabulary.'
  naturalness: The sentence is otherwise clear and idiomatic Standard East African Swahili. “Atajihesabia siku saba” naturally conveys counting the seven days for herself.
  terminology: “Utoko” is suitable in this ritual-legal bodily-discharge context. “Safi” and “kutakasika” appropriately distinguish ritual status from moral evaluation. The footnote should align its first alternative with the revised wording and explain the Hebrew root without suggesting that the first clause necessarily describes completed ritual purification.
  issues:
  - severity: medium
    issue: Aspect of “akitakasika”
    rationale: The Hebrew טָהֲרָה is a perfect form in the conditional clause, indicating that she has become clean from/that the discharge has ceased before she begins the seven-day count. The Swahili present-conditional form can imply an ongoing purification concurrent with the counting.
  - severity: low
    issue: Footnote wording needs alignment
    rationale: Once the first clause is revised, the lexical-alternative footnote should use the same wording and clarify that the first use concerns being free from the discharge, whereas the final use denotes the ensuing ritual status.
  revised_text: Lakini akishakuwa safi kutokana na utoko wake[a], atajihesabia siku saba, na baada ya hapo atakuwa safi.
  revised_footnotes:
  - marker: a
    text: 'Au, “utoko wake ukiutoka ... baada ya hapo atatakasika.” Kiebrania kinatumia mzizi uleule katika vishazi vyote viwili: kwanza kuhusu kuwa huru kutokana na utoko, kisha kuhusu hadhi ya usafi wa kiibada inayofuata.'
    reason: lexical_alternative
  revision_rationale: Revised the opening conditional to express that the woman is already free from the discharge before counting seven days. This preserves the Hebrew sequence and keeps the final clause as the attainment of ritual cleanness. The footnote was adjusted to match the revised text and to state the lexical relationship more precisely.
