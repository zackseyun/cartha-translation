base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: sw
  text: Kisha kuhani atamtoa mmoja kuwa sadaka ya dhambi[a], na mwingine kuwa sadaka ya kuteketezwa. Kuhani atamfanyia mwanamke huyo upatanisho mbele za Yahweh kwa sababu ya mtiririko wake wa unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kusisitiza kazi ya sadaka hiyo ya kuondoa unajisi katika ibada za Walawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: atamtoa
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha ‘kufanya,’ katika muktadha wa dhabihu kinamaanisha kumtoa mnyama kuwa sadaka.
- source_word: הָאֶחָד חַטָּאת
  choice: mmoja kuwa sadaka ya dhambi
  rationale: חַטָּאת hapa ni aina ya sadaka. ‘Sadaka ya dhambi’ ni istilahi inayoeleweka na iliyozoeleka; maana mbadala inayosisitiza utakaso imehifadhiwa katika tanbihi.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: na mwingine kuwa sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa yote; ‘mwingine’ huwasilisha vizuri mgawanyo kati ya wale wawili.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: atamfanyia mwanamke huyo upatanisho
  rationale: ‘Kumfanyia upatanisho’ huhifadhi uzito wa ibada na teolojia wa כפר. ‘Mwanamke huyo’ huweka wazi kiwakilishi cha kike bila kubadili mhusika.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi usemi wa mazingira ya ibada na kulitaja jina la agano יהוה moja kwa moja katika umbo la kawaida la Kiswahili.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: kwa sababu ya utoko wake wa unajisi
  rationale: ‘Utoko’ huonyesha mtiririko wa mwilini, na ‘wa unajisi’ huhifadhi uhusiano wake na hali ya kutokuwa safi kiibada. ‘Kwa sababu ya’ huwasilisha matumizi ya מִן katika muktadha huu kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu la agano; ‘Yahwe’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Maana ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linataja aina maalumu ya dhabihu na linaweza pia kusisitiza kazi yake ya kutakasa. Tafsiri ya kawaida imo katika matini, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- issue: Aina ya unajisi katika mstari huu
  choice: unajisi wa kiibada unaohusiana na utoko
  alternative: hatia ya kimaadili
  rationale: Muktadha wa Walawi 15 unahusu hali ya kutokuwa safi kiibada kutokana na utoko wa mwili; tafsiri haipaswi kudokeza kwamba hali hiyo yenyewe ni kosa la kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mbele za Yahwe’ na ‘kumfanyia upatanisho’ hudumisha sajili ya kiibada, huku sentensi mbili zikifanya mstari usomeke kwa kawaida.
