base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: sw
  text: Na kila mtu atakayevigusa atakuwa najisi[a]. Atafua nguo zake na kuoga kwa maji, naye atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, vitu vinavyohusiana na unajisi wake vilivyotajwa katika muktadha uliotangulia, kama kitu alicholalia au alichokalia.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: Na kila mtu atakayevigusa
  rationale: Muundo wa כָּל pamoja na kitenzi-jina huonyesha mtu yeyote bila ubaguzi. Kiswahili cha wakati ujao katika kishazi tegemezi kinaeleza kwa kawaida sharti la jumla katika sheria hii.
- source_word: בָּם
  choice: -vigusa
  rationale: Kiwakilishi cha Kiebrania kinarejelea vitu vilivyotajwa katika muktadha uliotangulia. Ngeli ya vi- inadokeza vitu bila kuvibainisha zaidi ndani ya aya.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Katika muktadha huu טמא ni hali ya unajisi wa kiibada, si lazima kosa la kimaadili. 'Atakuwa najisi' ni usemi ulio wazi na wa kawaida katika Kiswahili cha Biblia.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: Atafua nguo zake
  rationale: כִּבֶּס hurejelea kufua mavazi; 'kufua nguo' ni Kiswahili cha asili na cha sasa.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: na kuoga kwa maji
  rationale: רחץ hapa hueleza kuosha mwili. 'Kuoga kwa maji' hutofautisha tendo hilo na kufua nguo na hudumisha kutajwa wazi kwa maji.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: naye atakuwa najisi mpaka jioni
  rationale: Kifungu kinaonyesha kwamba hali ya unajisi inaendelea hadi jioni; 'mpaka jioni' ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Maana ya unajisi katika sheria za Walawi
  choice: Kutafsiri טמא kuwa 'najisi' kama hali ya kiibada
  alternative: '''amenajisika'' au lugha inayoweza kudokeza uchafu wa kimaadili'
  rationale: Muktadha unahusu sheria za usafi wa kiibada. Tafsiri haipaswi kufanya mguso wenyewe uonekane kuwa dhambi ya kimaadili.
- issue: Kirejelea cha kiwakilishi בָּם
  choice: Kudumisha kirejelea cha jumla katika matini na kukifafanua katika tanbihi
  alternative: Kutaja moja kwa moja katika matini vitu alivyolalia au alivyokalia
  rationale: Kiebrania chenyewe kinasema 'navyo'; maelezo ya wazi zaidi yanatokana na muktadha uliotangulia na yanafaa kuwekwa katika tanbihi ili kutobana maana ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Najisi' limetumiwa kwa maana ya hali ya kiibada; sentensi zimegawanywa ili ziwe wazi bila kupoteza uhusiano wa matendo katika Kiebrania.
