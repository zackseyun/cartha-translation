base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: sw
  text: na kuhusu mwanamke aliye dhaifu katika unajisi wake wa hedhi[a], na kuhusu yeyote mwenye mtiririko wa mwili, awe mwanamume au mwanamke, na kuhusu mwanamume anayelala na mwanamke aliye najisi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamke mwenye hedhi.” Neno la Kiebrania lililotafsiriwa “aliye dhaifu” linamhusu hapa mwanamke katika hali yake ya hedhi.
    reason: lexical_alternative
  - marker: b
    text: “Najisi” hapa inamaanisha hali ya unajisi wa kiibada chini ya sheria ya Walawi, si uchafu wa kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה
  choice: mwanamke aliye katika hali ya udhaifu
  rationale: Neno hilo linaweza kuonyesha mwanamke aliye dhaifu au asiyejiweza kutokana na hali yake, na katika muktadha huu linamhusu mwanamke mwenye hedhi. Tafsiri hii inadumisha maana yake ya msingi bila kuifanya iwe marudio tu ya kirai kinachofuata.
- source_word: בְּנִדָּתָהּ
  choice: wakati wa unajisi wake wa hedhi
  rationale: Katika sheria za Walawi, נִדָּה humaanisha hali ya unajisi wa kiibada inayohusiana na hedhi. Kirai hiki kinaweka wazi kuwa si hukumu kuhusu thamani au maadili ya mwanamke.
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: yeyote mwenye usaha
  rationale: Muundo wa Kiebrania ni wa jina na nomino yenye mzizi uleule, yaani mtu anayepatwa na mtiririko wa mwili. Katika Kiswahili, “mwenye usaha” ni usemi mfupi na wa kawaida katika muktadha wa ugonjwa, bila kuurudia mzizi kwa namna isiyo ya asili.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: awe mwanamume au mwanamke
  rationale: Hiki kinaonyesha kwamba sheria kuhusu usaha inawahusu watu wa jinsia zote; tafsiri hii ni ya asili na inadumisha wigo huo.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: anayelala na
  rationale: Hii inadumisha lugha ya staha ya Kiebrania kuhusu kujamiiana badala ya kuifanya wazi zaidi kuliko chanzo.
- source_word: טְמֵאָה
  choice: mwanamke aliye najisi
  rationale: “Najisi” ni istilahi inayofaa kwa hali ya kiibada katika sheria za Walawi, wala hapa haimaanishi uchafu wa maadili.
theological_decisions:
- issue: Istilahi za unajisi wa kiibada
  choice: Kutumia “unajisi” na “najisi” kwa נִדָּה na טְמֵאָה
  alternative: “mchafu,” “aliyetiwa unajisi,” au maneno yanayodokeza uovu wa maadili
  rationale: Mstari huu unahusu hali za kiibada chini ya sheria ya Walawi, si thamani ya mtu wala hatia yake ya kimaadili.
- issue: Maana ya הַדָּוָה katika muktadha wa hedhi
  choice: “mwanamke aliye katika hali ya udhaifu” huku kirai kinachofuata kikibainisha hedhi
  alternative: “mwanamke mwenye hedhi”
  rationale: Uamuzi huu unahifadhi kiasi fulani maana ya msingi ya hali ya udhaifu na pia mvutano wa kileksika, badala ya kuunganisha kabisa neno hilo na נִדָּה kuwa wazo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo wa “na kuhusu” umehifadhiwa kwa sababu mstari huu ni sehemu ya muhtasari unaoendelea kutoka mistari iliyotangulia. Lugha ya “kulala na” inadumisha usemi wa staha wa chanzo.
