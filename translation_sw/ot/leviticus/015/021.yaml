  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: sw
  text: Na kila mtu atakayegusa kitanda chake[a] atafua nguo zake, ataoga kwa maji, naye atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pake pa kulala” au “matandiko yake.” Neno la Kiebrania linamaanisha mahali anapolala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Na kila mtu atakayegusa
  rationale: Muundo huu unaonyesha kanuni ya jumla kwa Kiswahili cha kawaida huku ukihifadhi wigo wa כָּל na tendo la kugusa katika הַנֹּגֵעַ.
- source_word: בְּמִשְׁכָּבָהּ
  choice: kitanda chake
  rationale: מִשְׁכָּב ni mahali pa kulala na katika muktadha huu kwa kawaida humaanisha kitanda; maana pana zaidi imewekwa katika tanbihi.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: atafua nguo zake
  rationale: כבס hurejelea hasa kufua mavazi; “atafua” ni sahihi na ya kawaida kuliko “ataosha” katika muktadha huu.
- source_word: וְרָחַץ בַּמַּיִם
  choice: ataoga kwa maji
  rationale: רחץ hapa inaelekeza kuoshwa kwa mwili, kwa hiyo “ataoga” huitofautisha wazi na kufua nguo.
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: “Najisi” hudumisha istilahi ya hali ya kutokuwa safi kiibada bila kuifanya iwe hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hii inaonyesha kwa kawaida na kwa usahihi muda ambao hali ya unajisi itaendelea.
theological_decisions:
- issue: Asili ya unajisi unaotajwa
  choice: Kutafsiri טמא kuwa “najisi” kama hali ya kiibada
  alternative: “mchafu” au “asiye safi”
  rationale: Muktadha wa Mambo ya Walawi 15 ni sheria za usafi wa kiibada. “Najisi” huhifadhi aina hiyo ya kisheria bila kuingiza wazo la moja kwa moja la dhambi au hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umehifadhiwa bila kuwa mgumu kupita kiasi; “kufua” na “kuoga” vinatofautisha wazi kuoshwa kwa nguo na kwa mwili.
