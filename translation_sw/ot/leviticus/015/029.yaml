translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya ibada lakini kinachoeleweka kwa urahisi. Istilahi ‘Hema la Kukutania’ imetumiwa kwa אֹהֶל מוֹעֵד, na majina ya ndege yametolewa kwa lugha ya kawaida ya dhabihu.
