  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: sw
  text: Siku ya nane, atachukua kwa ajili yake hua wawili au njiwa wachanga wawili, na kuwaleta kwa kuhani kwenye mlango wa Hema la Kukutania.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi kwenye mlango wa Hema la Kukutania.” Kiebrania kinarudia kihusishi kinachomaanisha “kwenda kwa/kuelekea” kabla ya neno “mlango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Kirai cha wakati kimetafsiriwa kwa Kiswahili cha kawaida. Kiunganishi ו kinaonyesha mwendelezo wa maagizo, lakini hakihitaji kutafsiriwa kwa neno tofauti mwanzoni mwa sentensi.
- source_word: תִּקַּח לָהּ
  choice: atachukua kwa ajili yake
  rationale: Kitenzi cha kisheria kinaonyesha jambo analopaswa kufanya; kirai לָהּ kimehifadhiwa kwa maana ya manufaa yake mwenyewe bila kutumia muundo usio wa kawaida wa Kiswahili.
- source_word: שְׁתֵּי תֹרִים
  choice: hua wawili
  rationale: תֹרִים ni ndege wawili aina ya hua wanaofaa kwa dhabihu; umbo la kuhesabu viumbe hai ni la kawaida katika Kiswahili.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: makinda mawili ya njiwa
  rationale: Kirai halisi ‘wana wa njiwa’ humaanisha njiwa wachanga; ‘makinda ya njiwa’ ni Kiswahili cha asili kinachohifadhi umri wao.
- source_word: וְהֵבִיאָה אֹתָם
  choice: kisha atawaleta
  rationale: Katika mfuatano huu wa sheria, umbo hilo lina nguvu ya agizo. ‘Kisha’ huonyesha hatua inayofuata, na kiambishi -wa- kinarejelea ndege hao.
- source_word: אֶל הַכֹּהֵן
  choice: kwa kuhani
  rationale: Kihusishi אֶל kinaonyesha anayekabidhiwa ndege; ‘kwa kuhani’ ni usemi wa kawaida wa Kiswahili kwa mwendo kuelekea kwa mtu huyo.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa Hema la Kukutania
  rationale: אֶל ya pili imetolewa kwa maana ya mahali ili sentensi iwe ya kawaida, huku ‘mlango’ na jina la mahali patakatifu vikihifadhiwa wazi.
