revisions:
- from: Mtu mwenye usaha anapokuwa safi kutokana na usaha wake, atajihesabia siku saba kwa ajili ya kutakaswa kwake; kisha atafua nguo zake na kuoga mwili wake kwa maji yanayotiririka[a], naye atakuwa safi.
  to: Mwanamume mwenye mtiririko huo atakapokuwa ametakasika kutokana na mtiririko wake, atajihesabia siku saba kwa ajili ya kutakaswa kwake; kisha atafua nguo zake na kuosha mwili wake kwa maji yanayotiririka[a], naye atakuwa safi.
