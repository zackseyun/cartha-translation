source:
  edition: WLC
  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: sw
  text: Mwanamume mwenye mtiririko huo atakapokuwa ametakasika kutokana na mtiririko wake, atajihesabia siku saba kwa ajili ya kutakaswa kwake; kisha atafua nguo zake na kuosha mwili wake kwa maji yanayotiririka[a], naye atakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “maji yaliyo hai”; yaani, maji ya asili, kama maji ya chemchemi au yanayotiririka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: mtu mwenye usaha
  rationale: Nomino hii ya kitenzi humtaja mwanamume mwenye mtiririko usio wa kawaida unaoelezwa katika sura hii. Katika muktadha huu, “mtu mwenye usaha” ni usemi wa kawaida na wenye staha.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: anapokuwa safi kutokana na usaha wake
  rationale: Kitenzi טהר hapa kinaeleza kuwa safi kiibada baada ya mtiririko kukoma, si kuondolewa kwa hatia ya kimaadili.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: atajिहesabia siku saba
  rationale: Kiwakilishi cha kumrejelea mhusika katika לוֹ kimehifadhiwa kwa “atajिहesabia,” huku mfuatano wa maagizo ya ibada ukionyeshwa kwa wakati ujao.
- source_word: לְטָהֳרָתוֹ
  choice: kwa ajili ya kutakaswa kwake
  rationale: Hurejelea mchakato wa kupata hali ya usafi wa kiibada; “kutakaswa” hutofautisha mchakato huu na usafi wa kawaida wa mwili.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: atafua nguo zake
  rationale: כבס hutumiwa mahsusi kwa kufua nguo; “kufua” ni sahihi na ya kawaida katika Kiswahili.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: kuoga mwili wake
  rationale: Ingawa בשר kihalisi ni “nyama,” hapa humaanisha mwili mzima unaooshwa; “kuoga mwili wake” ni ya asili na yenye kueleweka.
- source_word: בְּמַיִם חַיִּים
  choice: kwa maji yanayotiririka
  rationale: Kihalisi ni “maji yaliyo hai,” nahau inayomaanisha maji ya asili yaliyo safi au yanayotiririka. Tafsiri hii huwasilisha maana ya matumizi bila kuleta maana nyingine za kitheolojia.
- source_word: וְטָהֵר
  choice: naye atakuwa safi
  rationale: 'Hitimisho hili linaonyesha matokeo ya utaratibu: hali ya usafi wa kiibada.'
theological_decisions:
- issue: Kutafsiri istilahi za usafi wa kiibada bila kuingiza hatia ya kimaadili
  choice: Kutumia “safi” na “kutakaswa” kwa maana ya kiibada
  alternative: Kutumia lugha inayodokeza kusamehewa dhambi au kutakaswa kimaadili
  rationale: Mambo ya Walawi 15 huzungumzia unajisi unaohusiana na hali ya mwili; mstari huu hautaji kosa la kimaadili wala msamaha wa dhambi.
- issue: Maana ya מַיִם חַיִּים
  choice: maji yanayotiririka
  alternative: maji yaliyo hai
  rationale: Usemi wa Kiebrania ni nahau ya maji safi ya asili, hasa yenye mtiririko. Tafsiri ya maana ni wazi kwa msomaji wa sasa, huku maana halisi ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa masharti na maagizo umehifadhiwa bila kutumia lugha nzito kupita kiasi.
