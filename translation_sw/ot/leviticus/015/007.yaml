    issue: “mwanamume mwenye usaha” translates הַזָּב too narrowly.
    rationale: Usaha means pus, whereas the Hebrew designation concerns an abnormal discharge without specifying that it is pus. The translation should retain that nonspecificity.
  - severity: low
    issue: The footnote repeats the overly narrow term “usaha.”
    rationale: Since the footnote identifies a lexical alternative for “mwili,” its description of the affected man should also preserve the source term’s nonspecific reference.
