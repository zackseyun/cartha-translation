  text: וְ/הַ/נֹּגֵ֖עַ בִּ/בְשַׂ֣ר הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: sw
  text: Yeyote atakayegusa mwili wa mwanamume mwenye utokaji wa majimaji mwilini lazima afue nguo zake na ajioshe kwa maji[a], naye atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyama ya mwanamume mwenye utokaji wa majimaji mwilini.” Kiebrania kinasema kihalisi, “nyama ya mwenye utokaji wa majimaji mwilini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: Yeyote atakayegusa
  rationale: Kirai cha Kiebrania ni kauli ya jumla ya kisheria, ‘anayegusa’; ‘Yeyote atakayegusa’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya jumla.
- source_word: בִּבְשַׂר
  choice: mwili wa
  rationale: בָּשָׂר maana yake ya msingi ni ‘nyama,’ lakini hapa inaelekeza kwenye mwili wa mtu unaoguswa. ‘Mwili’ ni sahihi na ya kawaida zaidi katika Kiswahili kuliko ‘nyama’ katika muktadha huu; maana halisi imeelezwa katika tanbihi.
- source_word: הַזָּב
  choice: mwanamume mwenye usaha
  rationale: Umbo la kiume la Kiebrania na muktadha wa sura hii humtaja mwanamume anayepatwa na mtiririko usio wa kawaida wa majimaji mwilini. ‘Usaha’ linawasilisha mtiririko huo kwa lugha inayoeleweka katika muktadha wa sheria hizi.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lazima afue nguo zake
  rationale: Kitenzi kinahusu kuosha nguo, na ‘afue nguo zake’ ni matumizi ya kawaida ya Kiswahili. ‘Lazima’ linaonyesha nguvu ya sharti la kisheria.
- source_word: וְרָחַץ בַּמַּיִם
  choice: na aoge kwa maji
  rationale: רָחַץ hapa ni kuosha mwili. ‘Aoge kwa maji’ ni usemi wa asili unaohifadhi kutajwa wazi kwa maji.
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: ‘Najisi’ ni istilahi iliyozoeleka katika Kiswahili kwa hali ya kutokuwa safi kiibada, bila kudokeza moja kwa moja hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Kirai hiki kinaonyesha muda ambao hali ya unajisi itaendelea; ‘mpaka jioni’ ni tafsiri wazi na ya kawaida.
theological_decisions:
- issue: Asili ya unajisi unaotajwa
  choice: Kutafsiri טָמֵא kuwa ‘najisi’ kama hali ya kiibada
  alternative: ‘mchafu’ au ‘asiye safi’
  rationale: Muktadha wa Mambo ya Walawi 15 unahusu hali ya usafi wa kiibada, si hukumu kwamba kugusa huko ni dhambi ya kimaadili. ‘Najisi’ huhifadhi tofauti hiyo kwa ufupi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sharti umewekwa wazi kwa ‘lazima,’ na istilahi ‘najisi’ imetumiwa kwa uthabiti wa lugha ya sheria za kiibada.
