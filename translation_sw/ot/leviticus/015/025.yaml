  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: sw
  text: Ikiwa mwanamke anatokwa na damu kwa siku nyingi, si katika kipindi cha unajisi wake wa hedhi[a], au ikiwa anatokwa na damu zaidi ya kipindi chake cha unajisi wa hedhi[b], kwa siku zote za mtiririko wa unajisi wake atakuwa najisi, kama anavyokuwa katika siku za unajisi wake wa hedhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati ambao si wa hedhi yake.” Neno la Kiebrania linahusisha pia hali ya kiibada ya unajisi inayohusiana na hedhi, si kutoka damu pekee.
    reason: lexical_alternative
  - marker: b
    text: Au “atatokwa na damu pamoja na unajisi wake wa hedhi,” yaani, damu ikiendelea zaidi ya kipindi cha kawaida cha hedhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: atatokwa na damu / mtiririko
  rationale: Muungano wa kitenzi na nomino kutoka זוּב unaonyesha mtiririko usio wa kawaida wa majimaji ya mwili. Kiswahili cha kawaida husema “kutokwa na damu”; “mtiririko” hudumisha dhana hiyo katika kifungu kinachofuata bila kuwa na lugha ya kitabibu kupita kiasi.
- source_word: דָּמָהּ
  choice: damu
  rationale: Kiambishi humaanisha damu yake; baada ya “atatokwa na,” Kiswahili cha kawaida kinahitaji tu “damu.”
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Huwasilisha kwa uwazi muda unaoendelea bila kuubadili kuwa kauli isiyo maalumu kama “kwa muda mrefu.”
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: nje ya wakati wa hali yake ya kutokuwa safi kwa sababu ya hedhi
  rationale: עֵת ni wakati, na נִדָּה hapa huhusisha hedhi pamoja na hali ya kiibada ya kutokuwa safi; tafsiri hii inahifadhi vipengele vyote viwili.
- source_word: נִדָּה
  choice: hali ya kutokuwa safi kwa sababu ya hedhi
  rationale: Katika sheria hii neno halitaji tukio la hedhi pekee, bali pia hali ya kiibada inayohusiana nayo. Kauli hii ni wazi kwa msomaji wa sasa na haidokezi hatia ya kimaadili.
- source_word: עַל נִדָּתָהּ
  choice: zaidi ya muda wa hali hiyo
  rationale: עַל katika muktadha inaweza kuonyesha kuendelea zaidi ya kipindi cha kawaida au kuongezeka juu yake. Matini inatumia kauli ya asili, huku tanbihi ikihifadhi uwezekano wa “pamoja na.”
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: siku zote za mtiririko unaomfanya kuwa najisi
  rationale: Muundo wa maneno unaunganisha mtiririko na hali ya unajisi. Tafsiri hii ni ya kawaida kwa Kiswahili na inaonyesha kuwa unajisi ni matokeo ya kiibada ya mtiririko huo.
- source_word: טְמֵאָה
  choice: najisi
  rationale: “Najisi” ni istilahi iliyozoeleka katika Kiswahili cha Biblia kwa hali ya kiibada ya kutokuwa safi, bila kulazimisha maana ya uovu wa kimaadili.
- source_word: כִּימֵי נִדָּתָהּ
  choice: kama alivyo katika siku za hali yake ya kutokuwa safi kwa sababu ya hedhi
  rationale: Huhifadhi ulinganisho wa hali yake wakati wa mtiririko usio wa kawaida na hali yake wakati wa hedhi.
theological_decisions:
- issue: Kuwasilisha istilahi za usafi wa kiibada bila kudokeza hatia ya kimaadili
  choice: Kutumia “najisi” na “hali ya kutokuwa safi kwa sababu ya hedhi” kama lugha ya hadhi ya kiibada
  alternative: Kutumia “mchafu” au kutaja “hedhi” pekee bila kipengele cha hali ya kiibada
  rationale: Mstari unahusu hali ya unajisi chini ya sheria ya Walawi, si dai kwamba mwanamke ametenda dhambi. Uchaguzi huu unahifadhi aina hiyo ya kiibada huku ukieleweka kwa Kiswahili cha sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Najisi” limetumiwa kama istilahi ya kiibada, huku maelezo “hali ya kutokuwa safi kwa sababu ya hedhi” yakifanya maana yake iwe wazi. Alama zote za tanbihi zimewekwa katika matini kuu.
