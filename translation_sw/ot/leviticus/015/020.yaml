  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: sw
  text: Na kila kitu anacholalia wakati wa unajisi wake wa hedhi kitakuwa najisi[a], na kila kitu anachokalia kitakuwa najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa hedhi yake.” Neno la Kiebrania linahusisha hali ya unajisi wa kiibada inayohusiana na hedhi, wala si mzunguko wa kimwili pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: hali yake ya kutokuwa safi kwa sababu ya hedhi
  rationale: Katika sheria hii neno linahusu hali ya unajisi wa kiibada inayohusiana na hedhi, si tukio la kimwili pekee. Kauli hii inaweka wazi uhusiano na hedhi bila kudokeza hatia ya kimaadili.
- source_word: תִּשְׁכַּב
  choice: anacholalia
  rationale: Kitenzi kinamaanisha kulala au kujilaza juu ya kitu, si lazima kulala usingizi; umbo hili ni la kawaida na linafaa katika kifungu cha sheria.
- source_word: תֵּשֵׁב
  choice: anachokalia
  rationale: Kitenzi hapa humaanisha kuketi juu ya kitu; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: עָלָיו
  choice: -lalia / -kalia
  rationale: Kihusishi chenye kiwakilishi kinaonyesha kitu kilicho chini yake. Katika Kiswahili maana hiyo huwasilishwa kwa kawaida kwa maumbo ya kutendea ‘kulalia’ na ‘kukalia’.
- source_word: יִטְמָא
  choice: kitakuwa najisi
  rationale: Katika muktadha huu kitenzi kinaonyesha kuwa kitu kiko au kinaingia katika hali ya unajisi wa kiibada. ‘Kitakuwa najisi’ huhifadhi toni ya kisheria bila kuingiza wazo la hatia ya kimaadili.
- source_word: וְכֹל אֲשֶׁר
  choice: na kila kitu anacho-
  rationale: Muundo huu una maana pana ya kila kitu kinachohusika; muundo wa Kiswahili wenye ‘kila kitu anacholalia/anachokalia’ ni wa asili na huhifadhi upeo huo.
theological_decisions:
- issue: Asili ya unajisi katika sheria za utakaso za Walawi
  choice: Kutumia lugha ya hali ya unajisi wa kiibada bila kuhusisha hedhi na hatia ya kimaadili
  alternative: Kutumia maneno yanayoweza kueleweka kuwa hedhi yenyewe ni dhambi au uchafu wa kimaadili
  rationale: Muktadha unahusu mfumo wa Israeli wa usafi wa kiibada. Aya haisemi kwamba hedhi ni kosa la kimaadili, hivyo tafsiri haipaswi kuingiza dai hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Najisi’ limetumiwa kama istilahi ya kawaida ya kibiblia kwa unajisi wa kiibada, huku ufafanuzi wa hedhi ukiwekwa wazi katika sentensi na tanbihi.
