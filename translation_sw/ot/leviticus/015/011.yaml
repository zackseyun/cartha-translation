  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: sw
  text: Kila mtu ambaye mwanamume anayetokwa na majimaji mwilini atamgusa[a], bila mwanamume huyo kunawa mikono yake kwa maji, atafua nguo zake, ataoga kwa maji, na atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mikono yake hakuwa ameiosha kwa maji.” Kifungu cha Kiebrania kinaweza kueleweka kuwa kinaeleza sharti ambalo chini yake mguso huo humfanya mtu mwingine kuwa najisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: mwanamume anayetokwa na majimaji mwilini
  rationale: Nomino hii ya Kiebrania humaanisha mtu wa kiume mwenye mtiririko wa majimaji kutoka mwilini katika muktadha wa sheria za utakaso. Tafsiri hii inaweka wazi jinsia ya kiume bila kuufanya mtiririko huo kuwa ugonjwa maalumu usiotajwa na maandishi.
- source_word: יִגַּע בּוֹ
  choice: atamgusa
  rationale: Kitenzi נגע pamoja na ב kinaonyesha mgusano wa kimwili; ‘atamgusa’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: ikiwa mwanamume huyo hakuwa amenawa mikono yake kwa maji
  rationale: Kifungu hiki kinaeleweka kiasili kama sharti linalomhusu mwanamume mwenye mtiririko. Kurudia ‘mwanamume huyo’ kunazuia kiwakilishi kisieleweke kimakosa kuwa kinamhusu mtu aliyeguswa.
- source_word: שָׁטַף
  choice: amenawa
  rationale: Katika Kiswahili, ‘kunawa mikono kwa maji’ ndiyo njia ya kawaida ya kueleza kuosha au kusuuza mikono; inatofautishwa kwa kiasi kinachowezekana na kufua nguo na kuoga mwili.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lazima afue nguo zake
  rationale: Kitenzi כּבס hutumiwa hasa kwa kuosha nguo. ‘Kufua nguo’ ni Kiswahili cha kawaida na sahihi, na ‘lazima’ linaonyesha wajibu wa kisheria.
- source_word: וְרָחַץ בַּמַּיִם
  choice: aoge kwa maji
  rationale: רחץ hapa inahusu kuosha mwili. ‘Kuoga kwa maji’ ni usemi wa asili na unadumisha tofauti na kufua nguo.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: naye atakuwa najisi mpaka jioni
  rationale: ‘Najisi’ linaonyesha hali ya kutokuwa safi kiibada katika sheria za Walawi, si uovu wa kimaadili. ‘Mpaka jioni’ linaonyesha kikomo cha muda kwa lugha ya kawaida.
- source_word: כֹל אֲשֶׁר
  choice: kila mtu ambaye
  rationale: Usemi huu ni wa kuwahusisha watu wote mmoja mmoja na unaungana kwa kawaida na kishazi cha uhusiano kinachofuata.
theological_decisions:
- issue: Maana ya טמא katika sheria za utakaso za Walawi
  choice: najisi
  alternative: mchafu
  rationale: Hali inayotajwa ni kutokuwa safi kiibada kunakotokana na mgusano, pamoja na masharti ya kuosha na muda maalumu. ‘Najisi’ huepuka kuifanya hali hiyo ionekane kuwa uchafu wa kawaida au hatia ya kimaadili.
- issue: Uhusiano wa kishazi kuhusu mikono isiyonawwa
  choice: Kukitafsiri kama sharti linalomhusu mwanamume mwenye mtiririko
  alternative: 'Kukiacha kama mfuatano wa moja kwa moja: ‘na mikono yake hakuwa ameinawa kwa maji’'
  rationale: Muundo wa Kiebrania unaweza kubeba hali ya kimazingira au sharti. Tafsiri kuu inaleta maana inayowezekana kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Maneno ya kawaida kama ‘kufua’ na ‘kuoga’ yametumiwa, huku ‘najisi’ likihifadhi maana maalumu ya kiibada. Maelezo ‘anayetokwa na majimaji mwilini’ yanaepuka neno la kitabibu linaloweza kutaja ugonjwa maalumu kuliko maandishi ya Kiebrania.
