source:
  edition: WLC
  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: sw
  text: Na ikiwa kitu hicho kiko juu ya kitanda au juu ya kifaa anachokalia[a], mtu akikigusa atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chombo” au “kitu”; neno la Kiebrania כְּלִי lina maana pana ya kifaa, chombo, au kitu kinachotumiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Inahifadhi kiunganishi pamoja na sharti, na kuunganisha sheria hii na iliyotangulia kwa Kiswahili cha kawaida.
- source_word: עַל הַמִּשְׁכָּב
  choice: juu ya kitanda
  rationale: מִשְׁכָּב humaanisha mahali pa kulala; “kitanda” ni tafsiri iliyo wazi katika muktadha huu.
- source_word: הוּא
  choice: kitu hicho kiko
  rationale: Kiwakilishi cha kiume katika Kiebrania kinaelekeza kwenye kitu kinachodokezwa na muktadha; Kiswahili kinakifanya wazi bila kukitambulisha kwa namna finyu.
- source_word: עַל הַכְּלִי
  choice: juu ya kifaa
  rationale: כְּלִי ni neno pana linaloweza kumaanisha kifaa, chombo, au kitu kinachotumiwa; “kifaa” linafaa katika sentensi hii huku tanbihi ikihifadhi upana wake.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: anachokalia
  rationale: Linatoa kwa njia ya asili tendo endelevu la kuketi juu ya kitu hicho katika sheria hii.
- source_word: בְּנָגְעוֹ בוֹ
  choice: mtu akikigusa
  rationale: ב pamoja na kitenzi-jina huonyesha wakati au hali, “akikigusa.” Ingawa umbo la Kiebrania ni nafsi ya tatu ya kiume umoja, “mtu” ni usemi wa kawaida wa kisheria kwa mhusika yeyote katika Kiswahili.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Linaonyesha matokeo ya kisheria ya kuwa katika hali ya unajisi, bila kudokeza moja kwa moja hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Ni tafsiri ya kawaida na ya wazi ya fomula inayojirudia katika Mambo ya Walawi.
theological_decisions:
- issue: Maana ya טָמֵא katika sheria za utakaso za Mambo ya Walawi
  choice: najisi
  alternative: asiye safi kiibada
  rationale: Muktadha unahusu hali ya unajisi wa kiibada, si lazima kosa la kimaadili. “Najisi” huhifadhi ufupi wa maandishi ya chanzo na istilahi inayotambulika ya kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa kuwa wa kawaida kwa msomaji huku uhusiano wa masharti na istilahi ya unajisi ukihifadhiwa.
