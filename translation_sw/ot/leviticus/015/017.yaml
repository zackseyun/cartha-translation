base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: sw
  text: Na kila vazi na kila ngozi[a] ambayo juu yake kuna shahawa[b] vitaoshwa kwa maji, navyo vitakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “ngozi” yaelekea ikimaanisha kitu kilichotengenezwa kwa ngozi ya mnyama.
    reason: lexical_alternative
  - marker: b
    text: Au “utokaji wa shahawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: vazi
  rationale: Neno pana na la kawaida kwa kitu kinachovaliwa; linahifadhi umoja wa nomino ya Kiebrania.
- source_word: עוֹר
  choice: ngozi
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya ngozi ya mnyama; katika muktadha huenda ikamaanisha kitu kilichotengenezwa kwa ngozi, jambo linalobainishwa katika tanbihi.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: ambayo juu yake kuna
  rationale: Inahifadhi maana ya mahali ya kifungu cha Kiebrania huku ikiwa Kiswahili cha kawaida.
- source_word: שִׁכְבַת זָרַע
  choice: shahawa
  rationale: Nahau hii inarejelea shahawa zilizotoka. Kiswahili kinaweza kueleza jambo hilo kwa kawaida kwa nomino 'shahawa'; tanbihi inahifadhi uwezekano wa kulitaja tukio lenyewe kama 'mtiririko wa shahawa'.
- source_word: וְכֻבַּס
  choice: itaoshwa
  rationale: Kauli ya kutendwa katika agizo la kisheria inaonyeshwa kwa wakati ujao wa Kiswahili, unaotoa wajibu katika muktadha huu bila kuongeza ufafanuzi.
- source_word: בַּמַּיִם
  choice: kwa maji
  rationale: Hueleza maji kama njia ya kuosha kwa Kiswahili cha kawaida.
- source_word: וְטָמֵא
  choice: nayo itakuwa najisi
  rationale: Inadumisha kategoria ya unajisi wa kiibada na kurejelea kwa kawaida kila kitu kilichotajwa.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kikomo cha muda kilicho katika Kiebrania.
theological_decisions:
- issue: Asili ya unajisi katika sheria ya utakaso ya Walawi
  choice: Kutafsiri טָמֵא kuwa 'najisi' katika maana yake ya kiibada bila kuingiza hatia ya kimaadili.
  alternative: chafu; isiyo safi
  rationale: '''Najisi'' ni istilahi ya kawaida ya kibiblia kwa hali ya kiibada hapa. Aya haisemi kwamba hali hii yenyewe ni dhambi au hatia ya kimaadili.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo una ukaribu wa wastani na Kiebrania, huku mpangilio wa maneno ukiwa wa asili katika Kiswahili.
