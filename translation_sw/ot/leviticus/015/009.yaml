lexical_decisions:
- source_word: וְ/כָל
  choice: Na kila
  rationale: Neno “Na” linaunganisha sheria hii na masharti yaliyotangulia, huku “kila” likihifadhi maana ya kujumuisha kila kimoja.
- source_word: הַ/מֶּרְכָּב
  choice: kitu cha kupandia
  rationale: Neno la Kiebrania מֶרְכָּב linaweza kumaanisha kwa upana kitu kinachopandwa au kinachotumiwa wakati wa kupanda; tafsiri hii haifungi maana katika “tandiko” pekee.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: ambacho ... atakipanda
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kitu ambacho mtu hupanda, huku ikihifadhi uhusiano wa kishazi cha Kiebrania.
- source_word: הַ/זָּב
  choice: mtu mwenye usaha
  rationale: Katika sura hii, umbo la kiume linamtaja mwanamume mwenye mtiririko wa majimaji mwilini unaosababisha unajisi wa kiibada; “usaha” ni neno linaloeleweka katika Kiswahili cha Biblia kwa hali hii bila kuongeza hukumu ya kimaadili.
- source_word: יִטְמָא
  choice: kitakuwa najisi
  rationale: Kauli hii inaeleza hali ya unajisi wa kiibada inayotokea; “kitakuwa najisi” ni ya asili na wazi katika Kiswahili cha sheria.
theological_decisions:
- issue: Asili ya lugha ya unajisi katika Mambo ya Walawi
  choice: Kutafsiri טמא kuwa “najisi” kwa maana ya kiibada na kisheria
  alternative: “kichafu” au “kilichotiwa unajisi”
  rationale: Muktadha unahusu hali ya kiibada inayotokana na usaha wa mwili, si lazima dhambi binafsi au uovu wa kimaadili. “Najisi” huhifadhi tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kitu cha kupandia” kimetumiwa katika maandishi ili kuhifadhi upana wa neno la Kiebrania; “tandiko” limetolewa kama uwezekano katika tanbihi.
