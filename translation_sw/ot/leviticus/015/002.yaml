base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: sw
  text: 'Waambieni wana wa Israeli[a]: Mwanamume yeyote akiwa na utoko kutoka mwilini mwake[b], utoko wake ni najisi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli”; kwa neno halisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kutoka katika nyama yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Neneneni
  rationale: Amri ya wingi inaendeleza mtindo rasmi wa maagizo ya Mungu kwa Musa na Haruni.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa karibu usemi wa Kiebrania ‘wana wa Israeli’; mbadala wa kawaida zaidi umewekwa katika tanbihi.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: mkawaambie
  rationale: Inaonyesha amri inayofuatana na inadumisha wingi wa wanaoagizwa.
- source_word: אִישׁ אִישׁ
  choice: Mwanamume yeyote
  rationale: Urudiaji huo una maana ya kila mmoja katika kundi husika; ‘mwanamume’ inafaa kwa muktadha wa hali ya mwili wa kiume.
- source_word: כִּי יִהְיֶה זָב
  choice: atakapokuwa na majimaji yanayotoka
  rationale: ‘Atakapokuwa’ huonyesha muundo wa sheria unaotaja hali itakapotokea, na ‘majimaji yanayotoka’ ni lugha ya kawaida isiyobainisha kimakosa aina ya utoko.
- source_word: מִבְּשָׂרוֹ
  choice: mwilini mwake
  rationale: Ingawa בשר kwa msingi ni ‘nyama,’ katika muktadha huu ‘mwili’ hutoa maana ya kiungo cha mwili kwa Kiswahili cha sasa bila kuingiza maana nyingine.
- source_word: זוֹבוֹ
  choice: majimaji hayo
  rationale: Kirejeshi ‘hayo’ kinaunganisha wazi nomino hii na majimaji yaliyotajwa katika kishazi kilichotangulia.
- source_word: טָמֵא הוּא
  choice: majimaji hayo ni najisi
  rationale: Muundo huu unafuata rejeo la karibu la זוֹבוֹ na kuhifadhi istilahi ya kisheria ya utakaso.
theological_decisions:
- issue: Maana ya טָמֵא katika sheria za utakaso
  choice: najisi
  alternative: si safi
  rationale: ‘Najisi’ ni istilahi iliyozoeleka katika muktadha wa utakaso wa Kilawi na haimaanishi moja kwa moja kuwa hali hiyo ni dhambi ya kimaadili.
- issue: Kirejewa cha hali ya unajisi
  choice: majimaji hayo ni najisi
  alternative: mwanamume huyo ni najisi
  rationale: Kisintaksia, זוֹבוֹ (‘majimaji/utoko wake’) ndilo rejeo la karibu, kwa hiyo tafsiri haibadilishi kimya kimya kirejewa kuwa mwanamume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. ‘Majimaji yanayotoka’ huhifadhi upana wa usemi wa Kiebrania kuliko istilahi mahususi ya kitabibu.
