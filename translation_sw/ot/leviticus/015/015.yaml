base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: sw
  text: Kuhani atawatoa, mmoja kuwa sadaka ya dhambi[a] na mwingine kuwa sadaka ya kuteketezwa. Naye kuhani atafanya upatanisho kwa ajili yake mbele ya Yahwe kwa sababu ya mtiririko wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayotumiwa kuondoa unajisi wa kiibada, si sadaka kwa ajili ya dhambi ya kimaadili pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: atawatoa
  rationale: Katika muktadha wa dhabihu, עשה humaanisha kutekeleza tendo la kuwatoa wanyama hao kama sadaka; “atawatoa” ni ya kawaida na inaeleweka kwa Kiswahili.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כהן katika sheria za ibada.
- source_word: אֶחָד חַטָּאת
  choice: mmoja kuwa sadaka ya dhambi
  rationale: חַטָּאת ni jina la kawaida la sadaka hii, lakini katika muktadha wa unajisi wa kiibada inaweza kueleweka kwa usahihi zaidi kuwa sadaka ya utakaso; maana hiyo imehifadhiwa katika tanbihi.
- source_word: וְהָאֶחָד עֹלָה
  choice: na mwingine kuwa sadaka ya kuteketezwa
  rationale: עֹלָה ni sadaka iliyoteketezwa yote; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Biblia.
- source_word: וְכִפֶּר עָלָיו
  choice: atafanya upatanisho kwa ajili yake
  rationale: “Kufanya upatanisho” huhifadhi maana ya kiibada na kitheolojia ya כפר bila kuifungamanisha na nadharia moja tu ya jinsi upatanisho unavyofanya kazi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni tafsiri ya asili ya kuwa mbele au katika uwepo wa Yahwe katika muktadha wa ibada.
- source_word: מִזּוֹבוֹ
  choice: kwa sababu ya utoko wake
  rationale: מן hapa huonyesha hali iliyosababisha hitaji la upatanisho. “Utoko” hueleza majimaji yasiyo ya kawaida yanayotoka mwilini bila kudokeza kwamba lazima ni usaha.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa unajisi wa kiibada
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Jina la jadi “sadaka ya dhambi” limetumiwa katika matini, lakini tanbihi inaonyesha kwamba hapa sadaka hiyo inahusika na kuondoa unajisi wa kiibada, si lazima kosa la kimaadili.
- issue: Tafsiri ya כפר
  choice: kufanya upatanisho
  alternative: kuondoa hatia au unajisi kwa ibada
  rationale: “Kufanya upatanisho” huhifadhi upana na mvutano wa maana ya neno la Kiebrania bila kuamua kimya-kimya kama mkazo ni kufunika, kufidia, au kutakasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi na rahisi, huku istilahi za kiibada “sadaka ya kuteketezwa” na “kufanya upatanisho” zikihifadhiwa. Jina la Mungu limetafsiriwa “Yahwe.”
