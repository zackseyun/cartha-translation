base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: sw
  text: Ikiwa mwanamume akilala naye[a], na unajisi wa hedhi wa mwanamke huyo ukawa juu yake, atakuwa najisi kwa siku saba; na kila kitanda atakacholalia kitakuwa najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “Ikiwa mwanamume atafanya ngono naye.” Nahau ya Kiebrania ni, kihalisi, “ikiwa mwanamume hakika alala naye”; muundo huo unasisitiza tendo la kulala naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: kweli atalala naye
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi huongeza mkazo. “Kweli atalala naye” huhifadhi mkazo huo na nahau ya Kiebrania, huku muktadha ukionyesha kuwa ni tendo la ngono.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino hii ni ya umoja wa kiume na hapa inamtaja mwanamume mtu mzima; “mwanamume” ni tafsiri ya kawaida na sahihi.
- source_word: נִדָּתָהּ
  choice: unajisi wake wa hedhi
  rationale: Katika sheria za Walawi, neno hili linahusu hali ya kutokuwa safi kiibada inayohusiana na hedhi, si tukio la kibayolojia pekee.
- source_word: וּתְהִי ... עָלָיו
  choice: ukamjia
  rationale: Kihalisi ni “ukawa juu yake.” “Ukamjia” hudokeza matokeo yanayompata mwanamume bila kufanya Kiswahili kuwa kigumu.
- source_word: וְטָמֵא
  choice: atakuwa najisi
  rationale: Katika sharti hili la kisheria, kitenzi kinaeleza matokeo. “Atakuwa najisi” ni Kiswahili cha kawaida na hakiongezi wazo la hatia ya kimaadili.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Hii ni tafsiri ya moja kwa moja ya muda uliotajwa.
- source_word: הַמִּשְׁכָּב
  choice: kitanda
  rationale: Nomino hiyo humaanisha mahali pa kulalia; katika muktadha huu “kitanda” ni neno la kawaida na linaloeleweka.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: atakacholalia
  rationale: Kitenzi cha Kiswahili chenye kiambishi cha uhusiano huwasilisha kwa kawaida sentensi ya Kiebrania “ambacho atalalia.”
- source_word: יִטְמָא
  choice: kitakuwa najisi
  rationale: Kitenzi hiki kinaeleza tokeo la kisheria kwa kitanda, sambamba na hali ya mwanamume.
theological_decisions:
- issue: Kutafsiri lugha ya unajisi bila kuingiza hatia ya kimaadili
  choice: Kutumia “najisi” na “unajisi wake wa hedhi” kama istilahi za usafi wa kiibada
  alternative: Kutumia “amechafuliwa,” “uchafu,” au lugha inayodokeza dhambi ya kimaadili
  rationale: Walawi 15 inazungumzia hali ya usafi wa kiibada. Aya hii yenyewe haisemi kwamba hali hiyo ni hatia ya kimaadili, hivyo tafsiri haipaswi kuingiza dai hilo.
- issue: Nguvu ya muundo שָׁכֹב יִשְׁכַּב
  choice: Kuhifadhi mkazo kwa “kweli atalala naye” na kufafanua maana ya kingono katika tanbihi
  alternative: Kutafsiri moja kwa moja “akifanya ngono naye” katika matini kuu
  rationale: Chaguo hili huhifadhi nahau na mkazo wa Kiebrania huku tanbihi ikiondoa uwezekano wa kutokuelewa maana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Neno “najisi” limetumiwa kwa maana ya hali ya kutokuwa safi kiibada, si lazima uchafu wa kimwili au hatia ya kimaadili. Alama ya tanbihi [a] imewekwa mara moja baada ya nahau inayofafanuliwa.
