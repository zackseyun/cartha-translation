base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: sw
  text: Mwanamume akitokwa na shahawa[a], ataosha mwili wake wote kwa maji, naye atakuwa najisi mpaka jioni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akitokwa na mbegu ya uzazi”; kihalisi zaidi, “utokaji wa mbegu.”
    reason: lexical_alternative
  - marker: b
    text: Kuwa “najisi” hapa kunamaanisha hali ya kutokuwa safi kiibada katika sheria za usafi za Walawi, wala si lazima kuwe na hatia ya kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: mwanamume
  rationale: Muktadha unahusu sheria ya kutokwa kwa shahawa ya mwili wa kiume, hivyo 'mwanamume' ni sahihi kuliko neno la jumla kama 'mtu'.
- source_word: כִּי
  choice: akitokwa
  rationale: Katika sheria ya masharti, כִּי hutambulisha hali inayoweza kutokea; muundo wa Kiswahili wenye 'aki-' unaeleza sharti hilo kwa kawaida.
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: akitokwa na shahawa
  rationale: Hii ni tafsiri ya asili na iliyo wazi ya kauli ya Kiebrania inayosema kihalisi kuwa utoaji wa mbegu unatoka kwake.
- source_word: וְרָחַץ בַּמַּיִם אֶת כָּל בְּשָׂרוֹ
  choice: ataosha mwili wake wote kwa maji
  rationale: '''Mwili wake wote'' huwasilisha maana ya כָּל בְּשָׂרוֹ kwa Kiswahili cha kawaida, huku ''kwa maji'' ikieleza chombo cha kuosha bila ulazima wa kudokeza namna maalumu ya kuzamishwa.'
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: '''Najisi'' ni istilahi ya kawaida ya kibiblia kwa hali ya kutokuwa safi kiibada; kitenzi cha wakati ujao kinaendeleza matokeo ya kisheria.'
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Ni usemi wa kawaida na sahihi wa Kiswahili unaohifadhi kikomo cha muda kilichotajwa katika Kiebrania.
theological_decisions:
- issue: Maana ya טָמֵא katika sheria za usafi za Walawi
  choice: atakuwa najisi
  alternative: atakuwa mchafu kiibada
  rationale: Matini kuu inadumisha istilahi fupi ya kibiblia 'najisi,' bila kuifanya hali hiyo kuwa hatia ya kimaadili. Tanbihi inaeleza kuwa hapa inahusu hali ya kiibada katika muktadha wa sheria za usafi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaoeleweka kwa wasomaji wa kawaida; 'najisi' imehifadhiwa kama istilahi ya kibiblia na kufafanuliwa kwa tanbihi.
