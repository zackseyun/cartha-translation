  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: sw
  text: Basi mtawatenga wana wa Israeli[a] na unajisi wao, ili wasije wakafa katika unajisi wao watakapoitia unajisi maskani yangu iliyo katikati yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.”
    reason: Usemi ‘wana wa Israeli’ unafuata kwa karibu Kiebrania, ilhali ‘Waisraeli’ ni namna ya kawaida zaidi ya kutaja kundi hilo kwa Kiswahili.
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: mtawaepusha
  rationale: Umbo hili linaeleweka vizuri kutoka mzizi נזר, ‘kutenga/kuweka mbali.’ Katika muktadha huu, ‘mtawaepusha’ linaonyesha kuwafanya Waisraeli wakae mbali na hali ya unajisi na hatari yake, bila kulifanya kuwa onyo la maneno tu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata kwa karibu jina la pamoja la Kiebrania, ‘wana wa Israeli,’ huku ‘Waisraeli’ likitolewa kama usemi mbadala wa kawaida katika tanbihi.
- source_word: מִטֻּמְאָתָם
  choice: na unajisi wao
  rationale: Baada ya kitenzi chenye maana ya kuweka mbali, מִן linaonyesha kile ambacho wanapaswa kuepushwa nacho; ‘na unajisi wao’ ni muundo wa kawaida wa Kiswahili.
- source_word: טֻמְאָה
  choice: unajisi
  rationale: ‘Unajisi’ ni istilahi ya kawaida na yenye heshima kwa hali ya kutokuwa safi kiibada katika Mambo ya Walawi; hapa haimaanishi dhambi ya kimaadili moja kwa moja.
- source_word: וְלֹא יָמֻתוּ
  choice: ili wasije wakafa
  rationale: Muundo huu unaonyesha kusudi la kuzuia au tahadhari inayofuata agizo la kuwaepusha na unajisi.
- source_word: בְּטֻמְאָתָם
  choice: katika unajisi wao
  rationale: Kihusishi בְּ kinaachwa na maana yake ya hali ambayo kifo kingewakuta, bila kuamua wazi ikiwa unajisi wenyewe ndio sababu pekee.
- source_word: בְּטַמְּאָם
  choice: kwa kuitia unajisi
  rationale: 'Kitenzi-jina chenye בְּ kinaonyesha njia au hali inayohusiana na kifo: kuitia maskani unajisi.'
- source_word: מִשְׁכָּנִי
  choice: maskani yangu
  rationale: ‘Maskani’ huhifadhi maana ya mahali pa Mungu pa kukaa na rejeo lake mahsusi kwa maskani takatifu, bila kulichanganya na neno la Kiebrania linalomaanisha hasa ‘hema la kukutania.’
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: iliyo katikati yao
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi msisitizo wa kuwapo kwa maskani ya Mungu miongoni mwa watu.
theological_decisions:
- issue: Maana ya וְהִזַּרְתֶּם
  choice: Kutafsiri kama ‘mtawaepusha,’ kwa kuhusisha umbo hilo na נזר, ‘kutenga/kuweka mbali.’
  alternative: ‘Mtawaonya,’ kwa kulielewa kama wazo la kutoa onyo.
  rationale: Tahajia ya maandishi ya Kiebrania inaunga mkono maana ya kutenga au kuweka mbali; pia kihusishi מִן (‘na/kutoka’) kinaendana kwa kawaida na maana hiyo. Tafsiri haipaswi kufuata kwa upofu uchanganuzi wa Kiingereza unaolihusisha na זהר.
- issue: Unajisi wa kiibada katika Mambo ya Walawi
  choice: Kutumia ‘unajisi’ na kuonyesha kuwa maskani inaweza kutiwa unajisi.
  alternative: Kutumia lugha ya jumla ya ‘dhambi’ au ‘uchafu wa kimaadili.’
  rationale: Mstari unahusu hali na athari za kiibada mbele ya maskani ya Mungu. Kutumia ‘dhambi’ kungeingiza uamuzi wa kimaadili ambao neno lenyewe halisemi hapa.
- issue: Uhusiano kati ya unajisi na kifo
  choice: Kuhifadhi ‘katika unajisi wao kwa kuitia unajisi maskani yangu.’
  alternative: Kusema kwa uwazi zaidi ‘wafe kwa sababu ya unajisi wao.’
  rationale: Kihusishi cha Kiebrania kinaweza kueleza hali, njia, au mazingira; tafsiri iliyochaguliwa haitatui kimya kimya uhusiano huo zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inafaa kwa sheria ya kiibada. ‘Maskani’ na ‘unajisi’ zimetumiwa kama istilahi thabiti za muktadha wa Walawi.
