base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: sw
  text: 'Na hivi ndivyo unajisi wake utakavyokuwa kwa sababu ya mtoko wake: iwe mwili wake unatiririsha mtoko wake[a], au mwili wake umeziba hata mtoko wake hautoki, huo ndio unajisi wake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya moja kwa moja: “nyama yake inatiririsha mtoko wake ... nyama yake imefungwa kutokana na mtoko wake.” Kiebrania hutumia “nyama”; hapa yaelekea inarejelea mwili, au kiungo cha mwili kinachohusika na mtoko.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: unajisi wake
  rationale: Katika sheria za Walawi, neno hili linataja hali ya unajisi wa kiibada, si uchafu wa kawaida tu; “unajisi” ndilo neno la kawaida na linalofaa katika Kiswahili cha Biblia.
- source_word: זוֹב
  choice: usaha
  rationale: Katika muktadha huu neno linamaanisha majimaji yasiyo ya kawaida yanayotoka katika kiungo cha uzazi cha mwanamume. “Usaha” linaeleweka kwa urahisi kama mtoko wa ugonjwa, ingawa si lazima neno la Kiebrania libainishe aina ya majimaji.
- source_word: רָר
  choice: unatokwa na
  rationale: Kitenzi kinaonyesha majimaji yakitiririka kutoka mwilini; “unatokwa na” ni usemi wa kawaida wa Kiswahili unaoeleza hali hiyo bila ukakasi.
- source_word: בְּשָׂרוֹ
  choice: mwili wake
  rationale: Maana ya moja kwa moja ni “nyama yake,” lakini hapa inahusu mwili, na huenda hasa kiungo kinachohusika na mtoko. “Mwili wake” ni ya asili na haiongezi ubainisho ambao Kiebrania hakijautoa wazi.
- source_word: הֶחְתִּים
  choice: umeziba ... usitoke
  rationale: Neno linaonyesha kufungwa au kuzuiliwa kwa mtoko. Uundaji huu unaweka wazi tofauti kati ya mtoko unaotiririka na ule uliozuiliwa.
- source_word: מִזּוֹבוֹ
  choice: usaha huo usitoke
  rationale: Kihusishi kinaweza kuonyesha kutenganishwa au kuzuiliwa kutoka kwa mtoko; Kiswahili hiki kinawasilisha maana ya mwili kufungwa kiasi kwamba mtoko hautoki.
- source_word: וְזֹאת תִּהְיֶה
  choice: Na huu ndio utakuwa
  rationale: Huhifadhi kiunganishi na mtindo wa kisheria wa wakati ujao wa Kiebrania.
- source_word: אוֹ
  choice: ikiwa ... au
  rationale: Huwasilisha hali mbili mbadala ambazo zote zinahesabiwa kuwa unajisi.
