  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: sw
  text: Mtu yeyote anayeketi juu ya kitu[a] ambacho mwanamume anayetokwa na majimaji mwilini alikikalia atafua nguo zake, ataoga kwa maji, naye atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chombo,” “kifaa,” au “kifaa cha matumizi”; neno la Kiebrania lina maana pana ya kitu au chombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: Mtu yeyote anayeketi
  rationale: Kirai cha Kiebrania ni kitenzi-ushiriki kilichotumika kama nomino, kihalisi ‘na yule anayeketi.’ ‘Mtu yeyote anayeketi’ ni Kiswahili cha kawaida kinachohifadhi maana ya jumla ya sheria hii.
- source_word: הַכְּלִי
  choice: kitu
  rationale: כְּלִי linaweza kumaanisha chombo, kifaa, au kitu kingine. Katika muktadha huu ni kitu kinachoweza kukaliwa, hivyo ‘kitu’ kinahifadhi upana wa neno la Kiebrania bila kulibana kuwa chombo maalumu.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: ambacho ... alikikalia
  rationale: Kishazi hiki kinakitambulisha kitu kwa tendo la awali la mwanamume kukikalia. Wakati uliopita ni wa kawaida na wazi katika Kiswahili cha muktadha huu.
- source_word: הַזָּב
  choice: mwanamume anayetokwa na majimaji
  rationale: Neno זָב hapa humtaja mwanamume mwenye mtiririko wa majimaji mwilini katika sehemu ya sheria inayohusu wanaume. Tafsiri hii inaweka wazi jinsia na hali bila kuitambulisha kimakosa na ugonjwa fulani maalumu.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: atafua nguo zake
  rationale: כִּבֵּס hutumiwa hasa kwa kuosha nguo. ‘Atafua nguo zake’ ni usemi wa kawaida wa Kiswahili na unafaa kwa agizo la kisheria.
- source_word: וְרָחַץ בַּמַּיִם
  choice: na kuoga kwa maji
  rationale: רָחַץ katika sheria za utakaso humaanisha kuuosha mwili. ‘Kuoga kwa maji’ huonyesha wazi tendo la kuosha mwili.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: naye atakuwa najisi mpaka jioni
  rationale: Kirai hiki kinaeleza hali ya unajisi inayodumu hadi wakati uliowekwa. ‘Najisi’ ni neno fupi na lililozoeleka katika muktadha wa sheria za utakaso.
theological_decisions:
- issue: Aina ya unajisi unaotajwa
  choice: najisi
  alternative: asiye safi kiibada
  rationale: Muktadha unahusu hali ya unajisi chini ya sheria za Walawi, si lazima hatia ya kimaadili. ‘Najisi’ linatafsiri hali hiyo moja kwa moja bila kuongeza ufafanuzi wa ‘kiibada’ ambao haupo wazi katika mstari.
- issue: Jinsia ya הַזָּב na viwakilishi vinavyohusika
  choice: mwanamume anayetokwa na majimaji
  alternative: mtu anayetokwa na majimaji
  rationale: Sehemu hii ya sura inamhusu mwanamume, na maumbo ya Kiebrania ni ya kiume katika umoja. Kutaja ‘mwanamume’ kunahifadhi rejeleo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sheria ulio wazi na wenye hadhi. Wakati ujao umetumiwa kuwasilisha nguvu ya maagizo ya kisheria kwa njia ya kawaida katika Kiswahili. Neno ‘najisi’ limehifadhiwa kama istilahi inayotambulika ya hali ya kutokuwa safi chini ya sheria za utakaso, bila kudokeza moja kwa moja hatia ya kimaadili.
