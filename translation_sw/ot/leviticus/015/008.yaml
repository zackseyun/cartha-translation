base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: sw
  text: Na ikiwa mwanamume mwenye mtiririko atamtemea mtu aliye safi[a], mtu huyo atazifua nguo zake na ataoga kwa maji, naye atakuwa najisi[b] mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu ambaye ni safi.” Kiebrania kinasema kihalisi “aliye safi,” yaani mtu aliye safi kiibada.
    reason: lexical_alternative
  - marker: b
    text: Hii ni hali ya kuwa najisi kiibada mpaka jioni; haimaanishi lazima kwamba mtu huyo ana hatia ya kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi וְ pamoja na hali ya sharti inayoletwa na כִּי katika mfululizo wa sheria.
- source_word: יָרֹק
  choice: atamtemea
  rationale: Kitenzi humaanisha kutema mate; umbo hili la Kiswahili linaonyesha kwa kawaida kwamba mate yanamfikia mtu mwingine.
- source_word: הַזָּב
  choice: mwanamume anayetokwa na majimaji
  rationale: Huwasilisha maana ya mtu mwenye mtiririko wa majimaji mwilini bila kuufanya utambuzi maalumu wa ugonjwa ambao Kiebrania hakitaji; jinsia ya kiume katika muktadha pia imehifadhiwa.
- source_word: בַּטָּהוֹר
  choice: mtu aliye safi
  rationale: Kivumishi cha Kiebrania kimetumiwa kama nomino. Neno “mtu” limeongezwa kwa Kiswahili cha kawaida, huku “safi” likimaanisha hali ya kiibada katika muktadha huu.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: mtu huyo atazifua nguo zake
  rationale: Kitenzi כִּבֶּס hutumiwa kwa kufua nguo. “Mtu huyo” huonyesha kwa uwazi kwamba anayefua ni yule aliyetemewa.
- source_word: וְרָחַץ בַּמַּיִם
  choice: na kuoga kwa maji
  rationale: Katika sheria hii רָחַץ inaeleza kuosha mwili; “kuoga kwa maji” ni usemi wa kawaida na wazi.
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: “Najisi” ni istilahi iliyozoeleka ya hali ya kutokuwa safi kiibada, si lazima hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Huhifadhi kikomo cha muda kinachotumiwa mara kwa mara katika sheria za utakaso za Walawi.
theological_decisions:
- issue: Istilahi za usafi wa kiibada
  choice: safi / najisi
  alternative: tahirifu / asiye tahirifu
  rationale: “Safi” na “najisi” zinaeleweka kwa wasomaji wengi na kuhifadhi tofauti ya hali ya kiibada bila kudokeza moja kwa moja uchafu wa mwili au kosa la kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye hadhi. “Anayetokwa na majimaji” huepuka neno la kitabibu lenye utambuzi maalumu usiotajwa katika Kiebrania. Viashiria vya tanbihi [a] na [b] vimewekwa katika matini kuu.
