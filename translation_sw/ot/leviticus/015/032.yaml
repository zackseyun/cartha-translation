  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: sw
  text: 'Hii ndiyo sheria ya mtu anayekuwa na majimaji yanayomtoka mwilini[a], na ya mtu ambaye shahawa zinamtoka, na hivyo awe najisi kwa sababu yake:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «mtu mwenye uchafu unaomtoka mwilini.» Neno la Kiebrania hurejelea mtiririko wa majimaji mwilini, si hasa usaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Hii ndiyo sheria kuhusu
  rationale: Huu ni usemi wa muhtasari wa kisheria. Kiswahili cha kawaida huhitaji kitenzi kishirikishi, na ‘kuhusu’ huonyesha kwa kawaida eneo linaloelekezwa na sheria.
- source_word: הַזָּב
  choice: mtu mwenye usaha
  rationale: Nomino-shirikishi humtaja mtu kwa hali yake ya kutokwa na majimaji mwilini. ‘Mtu mwenye usaha’ ni usemi unaoeleweka katika muktadha huu, ingawa neno la Kiebrania linaweza kurejelea kwa upana zaidi majimaji yanayotoka mwilini.
- source_word: וַאֲשֶׁר
  choice: na kuhusu mtu ambaye
  rationale: Muundo huu unaunganisha hali ya pili na fomula ya sheria na kuhifadhi rejeo kwa mtu bila kulazimisha jinsia katika Kiswahili.
- source_word: תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: shahawa humtoka
  rationale: Huhifadhi kwa lugha ya kawaida wazo halisi la shahawa kutoka kwa mtu. ‘Shahawa’ ni neno la sasa, wazi, na lenye staha.
- source_word: לְטָמְאָה בָהּ
  choice: na kumfanya kuwa najisi kwa sababu yake
  rationale: Infinitivi inaeleza matokeo au kusudi; tafsiri hii inaonyesha athari ya kuwa najisi huku kiwakilishi kikirejelea kutoka kwa shahawa.
theological_decisions:
- issue: Je, לְטָמְאָה inaonyesha kusudi au matokeo?
  choice: na kumfanya kuwa najisi
  alternative: ili awe najisi
  rationale: Muundo wa Kiebrania unaweza kubeba maana ya kusudi au matokeo. Tafsiri iliyochaguliwa inasomeka kwa kawaida kama matokeo bila kufunga kabisa uwezekano wa maana ya kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Najisi’ limetumiwa kama istilahi ya kawaida ya utakaso wa kiibada katika Mambo ya Walawi. Alama ya tanbihi [a] imewekwa baada ya ‘usaha’ ili kuonyesha kwamba neno la Kiebrania lina maana pana kuliko usaha pekee.
