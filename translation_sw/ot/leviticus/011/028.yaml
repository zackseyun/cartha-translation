id: LEV.11.28
reference: Leviticus 11:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: sw
  text: Yeyote atakayebeba mzoga wao, lazima afue nguo zake, naye atakuwa najisi mpaka jioni.[a] Wao ni najisi kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mizoga yao.” Kiebrania kinaweza kueleweka kwa namna ya mgawanyo, kikirejelea mzoga wa kila mmoja wa wanyama wanaozungumziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: Yeyote atakayebeba
  rationale: Muundo wa kitenzi-jina chenye kibainishi una maana ya jumla, ‘yule anayebeba’; ‘Yeyote atakayebeba’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya sheria.
- source_word: נִבְלָתָם
  choice: mzoga wao
  rationale: נְבֵלָה humaanisha mzoga wa mnyama. Kiambishi cha wingi ‘wao’ kinarejelea wanyama waliotajwa kabla; umoja unaweza kueleweka kwa namna ya mgawanyo, yaani mzoga wa yeyote kati yao.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lazima afue nguo zake
  rationale: Katika sheria, hali hii ya kitenzi ina nguvu ya agizo. ‘Lazima afue’ huiwasilisha kwa Kiswahili cha sasa na cha wazi; ‘nguo’ ni neno la kawaida na sahihi.
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: Kifungu kinaeleza hali ya kiibada inayotokea baada ya tendo hilo. ‘Atakuwa najisi’ hudumisha maana bila kuigeuza kuwa hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha kikomo cha muda kilicho katika Kiebrania.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: Wao ni najisi kwenu
  rationale: Kauli hii inafupisha hadhi ya wanyama hao kwa Waisraeli. ‘Kwenu’ huhifadhi לָכֶם bila kuongeza ufafanuzi usiotajwa.
theological_decisions:
- issue: Istilahi ya unajisi wa kiibada
  choice: najisi
  alternative: wasio safi; wachafu
  rationale: Katika sheria za utakaso za Walawi, טמא ni istilahi ya hadhi ya kiibada. ‘Najisi’ ni neno lililozoeleka katika Kiswahili cha Biblia na halimaanishi moja kwa moja hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya sheria imewekwa wazi kwa ‘lazima,’ huku istilahi ya kiibada ‘najisi’ ikidumishwa kwa uthabiti.
