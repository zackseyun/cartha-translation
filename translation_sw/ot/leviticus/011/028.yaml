  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa sheria wa Kiebrania: kishazi cha jumla cha mtenda (''Yeyote atakayebeba''), mzoga wenye kiambishi cha wingi kinachorejelea wanyama, wajibu wa kufua nguo, hali ya unajisi hadi jioni, na hitimisho kuhusu wanyama hao. Umoja katika ''mzoga wao'' unahifadhi kwa usahihi umoja wa נִבְלָתָם, huku tanbihi ikieleza uwezekano wa wingi/distributive.'
  naturalness: Kiswahili ni sanifu, cha sasa, na kinafaa kwa mtindo wa sheria. 'Lazima afue nguo zake' na 'mpaka jioni' ni wazi na za asili. 'Wao ni najisi kwenu' ni sahihi katika muktadha, ambamo 'wao' hurejelea wanyama waliotajwa.
  terminology: '''Najisi'' ni istilahi inayofaa na thabiti kwa טמא katika sheria za Walawi, ikihifadhi maana ya hali ya kiibada bila kudokeza hatia ya kimaadili. ''Mzoga'' pia ni sahihi kwa נְבֵלָה.'
