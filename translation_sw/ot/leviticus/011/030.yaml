translation:
  language: sw
  text: Gecko[a], kenge, mjusi, mjusi wa mchangani, na kinyonga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Utambulisho kamili wa baadhi ya wanyama katika mstari huu hauna uhakika. Mapendekezo ya kale na ya kisasa yanatia ndani haya: badala ya “gecko,” huenda fereti au kirukanjia; badala ya “kenge,” huenda kinyonga; badala ya “mjusi wa mchangani,” huenda skinki au, katika mapokeo ya zamani, konokono; na badala ya “kinyonga,” huenda fuko au aina nyingine ya mjusi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: mjusi anayelia
  rationale: Utambulisho kamili wa mnyama huyu haujulikani. Maana ya jina la Kiebrania inahusishwa na kulia au kuugua; tafsiri hii inaepuka kudai kwa uhakika kwamba ni geki, huku ikidumisha uwezekano wa kuwa aina ya mjusi katika muktadha huu.
- source_word: הַכֹּחַ
  choice: kenge
  rationale: Neno hili linaelekea kumaanisha mjusi mkubwa. ‘Kenge’ ni jina la kawaida la Kiswahili kwa monitor lizard na linaitofautisha na aina nyingine katika orodha.
- source_word: הַלְּטָאָה
  choice: mjusi
  rationale: Neno la jumla linafaa kwa kuwa aina mahsusi haijulikani, na halidai usahihi wa kizoolojia usiothibitishwa.
- source_word: הַחֹמֶט
  choice: mjusi wa mchangani
  rationale: Katika orodha hii ya wanyama watambaao, aina ya mjusi inafaa kuliko tafsiri ya zamani ‘konokono’; hata hivyo, utambulisho unabaki hauna uhakika.
- source_word: הַתִּנְשָׁמֶת
  choice: kinyonga
  rationale: Ingawa neno hili la Kiebrania hutumiwa pia kwa ndege mahali pengine, hapa muktadha unahitaji mnyama wa kundi hili la watambaao. ‘Kinyonga’ ni pendekezo linalotambulika, lakini si la hakika.
