lexical_decisions:
- source_word: אֵת
  choice: '[haijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa moja kwa moja katika Kiebrania; kazi yake inaonekana katika muundo wa orodha pana.
- source_word: כָּל
  choice: kila
  rationale: Pamoja na nomino ya umoja yenye maana ya kijumla, neno hili linaeleweka kwa namna ya kugawa na linaonyesha kwamba aina zote zinazohusika zimejumuishwa.
- source_word: עֹרֵב
  choice: kunguru
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika Kiswahili kwa ndege wa jamii ya kunguru; neno la Kiebrania huenda likarejelea jamii hiyo kwa upana.
- source_word: לְמִינוֹ
  choice: kwa aina yake
  rationale: Huhifadhi kauli ya uainishaji inayotumiwa katika maandishi haya bila kuingiza usahihi wa kisasa wa kibayolojia.
