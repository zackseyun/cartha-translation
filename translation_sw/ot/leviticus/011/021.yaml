  naturalness: '"Viumbe wenye mabawa watambaao kwa miguu minne" ni muundo ulio wazi na wa kawaida zaidi katika Kiswahili sanifu. "Ili waruke-ruke" inaeleweka, lakini "watumiapo miguu hiyo kuruka" huonyesha kwa uwazi zaidi kuwa miguu maalumu ndiyo chombo kinachorejelewa na בָּהֵן.'
