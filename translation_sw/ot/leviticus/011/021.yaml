  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: sw
  text: Lakini kati ya viumbe wote wenye mabawa watambaao kwa miguu minne, mnaweza kula wale walio na miguu ya kurukia[a][b] juu ya miguu yao, watumiapo miguu hiyo kuruka juu ya ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania yaliyoandikwa yanasema halisi, “wasio na miguu”; lakini usomaji wa mapokeo, unaoeleweka kutokana na muktadha na tafsiri za kale, unasema, “walio na miguu.”
    reason: textual_variant
  - marker: b
    text: Au “miguu yenye viungo.” Kiebrania hapa hurejelea miguu maalumu ya nyuma inayotumiwa kuruka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Inaonyesha tofauti na katazo lililotangulia na kutambulisha aina zinazoruhusiwa.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: mnaweza kula wale
  rationale: Muundo huu wa sheria unaonyesha ruhusa; wingi unafaa kwa kundi la viumbe linalotajwa.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: kati ya viumbe wote warukao na kutambaa
  rationale: שֶׁרֶץ ni viumbe wadogo wanaotambaa au kusongamana, huku הָעוֹף ikibainisha kwamba ni wenye uwezo wa kuruka; tafsiri hii huepuka kuwafanya kuwa ndege.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: kwa miguu minne
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maelezo ya mwendo kwa viungo vinne.
- source_word: אֲשֶׁר לוֹ כְרָעַיִם
  choice: walio na miguu ya kurukia
  rationale: Inafuata usomaji wa mapokeo (qere) לוֹ, unaoungwa mkono na muktadha na tafsiri za kale; כְרָעַיִם hapa ni miguu maalumu ya nyuma inayotumiwa kuruka.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: juu ya miguu yao
  rationale: Inahifadhi maelezo ya kimaumbile kwamba miguu hiyo maalumu iko juu ya miguu ya kawaida.
- source_word: לְנַתֵּר בָּהֵן
  choice: ili waruke-ruke
  rationale: Kitenzi kinaonyesha kusudi la miguu hiyo; urudiaji katika 'waruke-ruke' unaeleza mwendo wa wadudu hawa kwa Kiswahili cha kawaida.
- source_word: עַל הָאָרֶץ
  choice: juu ya ardhi
  rationale: Inawasilisha mahali pa mwendo wao kwa lugha ya kawaida na yenye hadhi.
