  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: sw
  text: Kwa habari ya kila mnyama mwenye kwato iliyogawanyika, lakini ambaye kwato yake haijapasuka kabisa[a] na hatafuni tena, hao ni najisi kwenu. Kila mtu anayewagusa atakuwa najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “na mpasuko haigawi”; Kiebrania hutumia nomino na kitenzi vya mzizi unaohusiana, ikikazia kwamba kwato haijapasuka kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: Kwa habari ya kila mnyama
  rationale: Kiambishi לְ kina nguvu ya kuanzisha mada hapa; “Kwa habari ya” huonyesha hilo kwa Kiswahili cha kawaida. בְּהֵמָה limetafsiriwa kwa neno pana “mnyama.”
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: mwenye kwato iliyogawanyika
  rationale: Kirai hiki kinaeleza mnyama aliye na kwato yenye mgawanyiko; muundo huu ni wa asili na wazi kwa Kiswahili.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: lakini kwato yake haijapasuka kabisa
  rationale: Muundo wa nomino na kitenzi vyenye mzizi mmoja unasisitiza mpasuko kamili wa kwato. “Kabisa” huwasilisha msisitizo huo bila kufanya tafsiri kuwa ngumu.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: na hacheui
  rationale: Ingawa Kiebrania husema kwa maana halisi “hapandishi chakula kilichocheuliwa,” “hacheui” ndiyo istilahi ya kawaida na sahihi ya Kiswahili.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: hao ni najisi kwenu
  rationale: “Najisi” huhifadhi istilahi ya kisheria na kiibada ya Walawi, huku “kwenu” ikihifadhi mtazamo unaoonyeshwa na לָכֶם.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Kila mtu anayewagusa
  rationale: Umoja wenye כָּל una maana ya jumla; “Kila mtu anayewagusa” ni Kiswahili cha sasa na kilicho wazi.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Kauli isiyotimilika hapa inaeleza matokeo ya kisheria; “atakuwa najisi” huonyesha hali inayotokana na mguso huo.
theological_decisions:
- issue: Istilahi ya usafi wa kiibada katika sheria ya Walawi
  choice: najisi
  alternative: asiye safi
  rationale: Muktadha unahusu hali ya usafi wa kiibada, si lazima uovu wa kimaadili. “Najisi” ni istilahi inayotambulika katika Kiswahili cha Biblia na haiingizi madai ya ziada ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa sheria ya Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Umoja wa “kila mnyama” unafuatwa na wingi wa kimakundi “hao,” kama ilivyo katika Kiebrania.
