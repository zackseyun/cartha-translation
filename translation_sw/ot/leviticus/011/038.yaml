base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: sw
  text: Lakini maji yakiwekwa juu ya mbegu, na mzoga wowote wa wanyama hao ukianguka juu yake, mbegu hiyo itakuwa najisi kwenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Lakini ... yaki-
  rationale: Muundo huu unaanzisha sharti lenye utofauti na hali iliyotajwa katika mstari uliotangulia.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: maji yakiwekwa juu ya mbegu
  rationale: Yֻתַּן ni kauli tendwa ya ‘kuweka/kutoa’; tafsiri hii inadumisha kauli tendwa na uhusiano wa maji na mbegu bila kuongeza wazo la kulowesha moja kwa moja.
- source_word: וְנָפַל
  choice: na ... ikaanguka
  rationale: Kauli hii inaendeleza sharti la kisheria kwa Kiswahili cha kawaida na kudumisha mtiririko wa matukio.
- source_word: מִנִּבְלָתָם
  choice: sehemu ya mzoga wa yeyote kati yao
  rationale: מִן ina maana ya sehemu hapa, na נְבֵלָה ni mzoga wa mnyama. Usemi huu unaonyesha kuwa hata sehemu kutoka katika mzoga wa mmoja wa viumbe waliotajwa inahusika.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi kinarejelea mbegu iliyowekewa maji.
- source_word: טָמֵא הוּא לָכֶם
  choice: mbegu hiyo ni najisi kwenu
  rationale: ‘Najisi’ hudumisha hadhi ya kiibada inayotajwa. Kurudia ‘mbegu hiyo’ kunaondoa utata wa kiwakilishi kwa Kiswahili bila kubadili rejeleo la Kiebrania.
theological_decisions:
- issue: Asili ya hali ya טָמֵא
  choice: najisi kwa maana ya hali ya kiibada
  alternative: chafu au iliyonajisika kwa maana ya maadili
  rationale: Muktadha ni sheria ya utakaso wa kiibada, wala si lazima hukumu ya hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye hadhi. ‘Najisi’ limetumiwa kama istilahi ya kawaida ya hali ya kiibada katika Mambo ya Walawi.
