base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: sw
  text: Na mtu anayekula sehemu yoyote ya mzoga wa mnyama huyo[a] atazifua nguo zake, naye atakuwa najisi mpaka jioni[b]. Pia mtu anayeubeba mzoga wa mnyama huyo atazifua nguo zake, naye atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayekula kutoka katika mzoga wa mnyama huyo” au “sehemu ya mzoga wa mnyama huyo”; usemi wa Kiebrania una maana ya sehemu ya mzoga.
    reason: lexical_alternative
  - marker: b
    text: Yaani, najisi kwa maana ya sheria za Israeli kuhusu utakaso wa kiibada.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: mtu anayekula
  rationale: Kivumishi-tendo chenye kibainishi kinatumika kama nomino na humaanisha mtu yeyote anayefanya tendo hilo; muundo huu ni wa kawaida na unadumisha mtindo wa kisheria.
- source_word: מִנִּבְלָתָהּ
  choice: sehemu yoyote ya mzoga wake
  rationale: Kihusishi מִן hapa kina maana ya sehemu ya kitu; tafsiri hii inaonyesha kuwa kinacholiwa ni kiasi fulani cha mzoga, huku tanbihi ikihifadhi uwezekano wa kutafsiri kwa ukaribu zaidi kama ‘kutoka katika mzoga wake’.
- source_word: נִבְלָתָהּ
  choice: mzoga wake
  rationale: Katika sheria hizi za utakaso, neno hili linamaanisha mwili wa mnyama aliyekufa, hivyo ‘mzoga’ ni sahihi kuliko neno linaloweza kueleweka kuwa maiti ya binadamu.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: atazifua nguo zake
  rationale: Kauli isiyotimilika katika sheria ina nguvu ya agizo; wakati ujao wa Kiswahili hutumika kwa kawaida katika masharti ya kisheria, na ‘kufua nguo’ ni usemi wa asili.
- source_word: וְטָמֵא
  choice: naye atakuwa najisi
  rationale: Kifungu kinaeleza hali inayotokea baada ya tendo. ‘Najisi’ ni istilahi iliyozoeleka katika Kiswahili cha Biblia na haiongezi waziwazi neno ‘kiibada’ lisilokuwapo katika Kiebrania.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hii ni tafsiri ya kawaida, wazi na ya asili ya kikomo cha muda kinachoelezwa.
- source_word: הַנֹּשֵׂא
  choice: mtu anayeubeba
  rationale: Muundo huu unadumisha ulinganifu na ‘mtu anayekula’ na kuonyesha mhusika wa jumla katika sheria.
theological_decisions:
- issue: Maana ya hali ya unajisi
  choice: Kutafsiri טָמֵא kama ‘najisi’ bila kuongeza ‘kiibada’ katika matini kuu.
  alternative: ‘najisi kiibada’
  rationale: Muktadha unaonyesha sheria za utakaso wa Israeli, lakini kuongeza ‘kiibada’ katika matini kuu kungeeleza zaidi ya maneno ya Kiebrania; tanbihi inafafanua muktadha huo.
- issue: Jinsia katika washiriki wa kisheria
  choice: Kutumia ‘mtu’ na viwakilishi vya umoja vinavyorejelea nguo na mzoga, bila kuweka jinsia isiyolazimishwa na sarufi ya Kiswahili.
  alternative: Kutumia ‘mwanamume anayekula’ au ‘nguo zake huyo’
  rationale: Maumbo ya Kiebrania ni ya kiume umoja lakini yanawakilisha mtu yeyote chini ya sheria. Kiswahili ‘mtu anayekula’ huhifadhi umoja na maana ya jumla bila kudai kuwa sheria inawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Atazifua’ na ‘atakuwa najisi’ hudumisha mfuatano wa agizo na matokeo; ‘pia’ huunganisha kifungu cha pili kwa mtiririko wa asili bila kubadili maana.
