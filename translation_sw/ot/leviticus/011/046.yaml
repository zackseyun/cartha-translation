  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: sw
  text: Hii ndiyo sheria[a] kuhusu wanyama[b], ndege, kila kiumbe hai kinachosogea majini, na kila kiumbe kinachotambaa juu ya nchi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho kuhusu.” Neno la Kiebrania linaweza kumaanisha mafundisho yenye mamlaka pamoja na sheria.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wanyama wa nchi kavu; neno la Kiebrania mara nyingi hutumiwa hasa kwa wanyama wakubwa au wanaofugwa.
    reason: lexical_scope
  - marker: c
    text: Au, “nchi kavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: sheria kuhusu
  rationale: Katika muktadha huu תּוֹרָה inajumlisha kanuni zilizotangulia kuhusu viumbe safi na najisi. “Sheria kuhusu” ni ya kawaida katika Kiswahili na inaonyesha mafundisho yenye mamlaka.
- source_word: הַבְּהֵמָה
  choice: wanyama
  rationale: בְּהֵמָה hurejelea wanyama wa nchi kavu, mara nyingi wakubwa au wanaofugwa. “Wanyama” linafaa hapa bila kulifanya kundi hili kuwa mifugo pekee, kwa kuwa sura pia imetaja wanyama wa porini.
- source_word: הָעוֹף
  choice: ndege
  rationale: Ingawa עוֹף inaweza kuhusisha viumbe warukao kwa upana, “ndege” ndilo neno la kawaida na linalofaa katika muhtasari huu.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: kila kiumbe hai
  rationale: Kirai hiki cha Kiebrania humaanisha kiumbe chenye uhai. Tafsiri hii huepuka kuelewa נֶפֶשׁ kama nafsi isiyo ya kimwili.
- source_word: הָרֹמֶשֶׂת
  choice: kinachosogea
  rationale: רמש hapa hueleza mwendo wa viumbe vya majini. “Kinachosogea” ni pana na cha kawaida kuliko “kinachotambaa” kwa viumbe vilivyo majini.
- source_word: בַּמָּיִם
  choice: majini
  rationale: Hii ni tafsiri ya kawaida ya umbo la wingi la Kiebrania na inaeleza mazingira ambamo viumbe hivyo husogea.
- source_word: וּלְכָל נֶפֶשׁ
  choice: na kila kiumbe
  rationale: “Kiumbe” linadumisha maana ya נֶפֶשׁ katika muktadha wa wanyama bila kulazimisha maana ya “nafsi.”
- source_word: הַשֹּׁרֶצֶת
  choice: kinachotambaa
  rationale: שׁרץ hueleza viumbe vidogo vinavyozagaa au kutambaa. “Kinachotambaa” ni wazi na cha asili kwa kundi la viumbe wa nchi kavu linalotajwa hapa.
- source_word: עַל הָאָרֶץ
  choice: juu ya nchi
  rationale: אָ֫רֶץ hapa inatofautishwa na maji. “Juu ya nchi” inadumisha upana wa neno hilo; “nchi kavu” pia ni uwezekano wa kimuktadha.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika kirai נֶפֶשׁ הַחַיָּה
  choice: kiumbe hai
  alternative: nafsi hai
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha kiumbe chenye uhai, si lazima sehemu ya mtu au kiumbe isiyo ya kimwili. “Kiumbe hai” huepuka kuingiza hitimisho la kiteolojia lisilokusudiwa na kirai hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi inadumisha muundo wa kimajumuisho wa aya, huku “kinachosogea” na “kinachotambaa” vikitofautisha kwa kawaida vitenzi viwili vya Kiebrania.
