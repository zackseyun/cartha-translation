base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: sw
  text: 'Na kwa hawa mtakuwa najisi: kila mtu atakayegusa mzoga wao atakuwa najisi mpaka jioni.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na kuhusu hawa mtakuwa najisi.” Kirai cha mwanzo kinaweza kutambulisha kwa ujumla kundi linalofuata badala ya kueleza tu kisababishi cha unajisi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina “mzoga wao,” yaani nomino ya umoja yenye kiambishi cha umilikaji cha wingi; pia inaweza kutafsiriwa “mizoga yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: Nanyi mtakuwa najisi kwa hao
  rationale: Muundo וּלְאֵלֶּה unaweza kueleza kisababishi ('kwa hao') au kutambulisha jambo linalohusu kundi hili. 'Kwa hao' ni ya asili katika Kiswahili na hapa inaonyesha kwamba hao ndio chanzo cha unajisi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: תִּטַּמָּאוּ
  choice: mtakuwa najisi
  rationale: Kitenzi hiki cha nafsi ya pili wingi kinaeleza kuingia katika hali ya unajisi wa kiibada, si hatia ya kimaadili.
- source_word: כָּל הַנֹּגֵעַ
  choice: kila mtu atakayegusa
  rationale: Kirai hiki kina maana ya jumla kwa kila anayegusa; tafsiri hii ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: בְּנִבְלָתָם
  choice: mzoga wao
  rationale: נְבֵלָה ni mzoga wa mnyama. Chanzo kina nomino ya umoja yenye kiambishi cha umilikaji cha wingi; 'mzoga wao' huhifadhi umbo hilo, na 'mizoga yao' limetajwa kama uwezekano katika tanbihi.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Umoja wa kitenzi unalingana na 'kila mtu' na unaeleza hali ya unajisi wa kiibada unaotokana na kugusa.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Kirai hiki kinaonyesha muda ambao unajisi huo unaendelea; 'mpaka jioni' ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Maana ya lugha ya unajisi katika sheria za utakatifu
  choice: Kutumia 'najisi' kwa hali ya unajisi wa kiibada
  alternative: Kunajisika au kutiwa unajisi kwa maana inayoweza kusikika kama kosa la kimaadili
  rationale: Muktadha unahusu hali ya kiibada inayotokana na kugusa mzoga wa mnyama, wala mstari huu hautaji hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye heshima. 'Najisi' limetumiwa kama istilahi inayotambulika ya unajisi wa kiibada; sentensi imebaki rahisi kueleweka kwa wasomaji wa kawaida.
