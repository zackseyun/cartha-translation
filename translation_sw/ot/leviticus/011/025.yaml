  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: sw
  text: Na kila mtu anayebeba mzoga wowote wa wanyama hao[a] atafua nguo zake, naye atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika mizoga yao.” Muundo wa Kiebrania unaweza kutafsiriwa kwa njia rasmi hivi, lakini “mzoga wowote wa wanyama hao” huwasilisha kwa kawaida maana ya mgawanyo katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Na kila mtu
  rationale: וְ huunganisha sheria hii na muktadha uliotangulia, na כָּל pamoja na umbo la kitenzi linalotumika kama nomino huonyesha kila mtu anayefanya tendo hilo.
- source_word: הַ/נֹּשֵׂא
  choice: atakayebeba
  rationale: נָשָׂא hapa humaanisha kuinua na kubeba; ‘atakayebeba’ ni Kiswahili cha kawaida na kinafaa katika sheria hii ya unajisi.
- source_word: מִ/נִּבְלָתָ/ם
  choice: sehemu yoyote ya mizoga yao
  rationale: נְבֵלָה humaanisha mzoga wa mnyama. מִן inaweza kueleweka kwa maana ya kubeba sehemu kutoka katika mizoga hiyo; ‘sehemu yoyote ya’ huhifadhi wazo hilo na pia maana ya ugawanyaji inayowezekana katika muktadha.
- source_word: יְכַבֵּס
  choice: lazima afue
  rationale: Kitenzi hiki katika sheria kinaonyesha wajibu. ‘Lazima afue’ ni cha kawaida na huwasilisha nguvu ya agizo kwa uwazi.
- source_word: בְּגָדָי/ו
  choice: nguo zake
  rationale: בְּגָדִים ni nguo au mavazi; ‘nguo zake’ ni lugha ya sasa na huhifadhi umoja wa mtu anayezungumziwa.
- source_word: וְ/טָמֵא
  choice: naye atakuwa najisi
  rationale: טָמֵא hapa ni hali ya unajisi wa kiibada, si uovu wa kimaadili. ‘Atakuwa najisi’ ni istilahi iliyo wazi katika muktadha wa sheria za utakaso.
- source_word: עַד הָ/עָרֶב
  choice: mpaka jioni
  rationale: Kirai hiki kinaonyesha muda ambao hali ya unajisi itaendelea; ‘mpaka jioni’ ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Umbo la kiume la umoja katika sheria inayomhusu mtu yeyote
  choice: Kutumia ‘kila mtu’ na ‘nguo zake’ bila kuweka jinsia wazi
  alternative: Kutumia kiwakilishi cha kiume kama ‘nguo zake huyo mwanamume’
  rationale: Kiebrania hutumia kiume cha umoja kama umbo la uwakilishi katika sheria ya jumla. Kiswahili hakihitaji kuonyesha jinsia katika ‘mtu’ au kiambishi cha ngeli yake, hivyo tafsiri huhifadhi umoja na upeo wa jumla bila kuongeza jinsia ambayo Kiswahili haisemi kwa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa kwa sheria za Walawi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Najisi’ limetumiwa kwa hali ya kiibada, na ‘mzoga’ kwa mabaki ya mnyama aliyekufa.
