  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: sw
  text: Kila kiumbe wa majini asiye na mapezi na magamba ni chukizo kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni kitu cha kuchukiza kwenu.” Neno la Kiebrania שֶׁקֶץ humaanisha kitu kinachochukiza au kinachokirihisha, hasa katika muktadha huu wa sheria za vyakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Kila kiumbe ... ambacho
  rationale: Ingawa כֹּל אֲשֶׁר kwa muundo ni ‘kila/kila kitu ambacho,’ muktadha wa vyakula vya majini unahusu viumbe; ‘kila kiumbe’ ni Kiswahili cha kawaida na huhifadhi maana ya kundi lote.
- source_word: אֵין לוֹ
  choice: hakina
  rationale: Muundo wa Kiebrania wa kukanusha kuwapo pamoja na kiwakilishi unaeleza kutokuwa na kitu; ‘hakina’ ni usemi wa kawaida wa umiliki katika Kiswahili.
- source_word: סְנַפִּיר
  choice: mapezi
  rationale: Nomino ya Kiebrania iko katika umoja wa kijumla, lakini Kiswahili hutumia kwa kawaida wingi ‘mapezi’ kueleza sifa ya viumbe vya majini.
- source_word: קַשְׂקֶשֶׂת
  choice: magamba
  rationale: Umoja wa Kiebrania umetumiwa kijumla; ‘magamba’ ni istilahi ya kawaida ya Kiswahili kwa magamba ya samaki katika uainishaji huu.
- source_word: בַּמָּיִם
  choice: kilicho majini
  rationale: מַיִם ni umbo la wingi katika Kiebrania; ‘majini’ ni usemi wa asili wa Kiswahili unaohifadhi maana ya mahali.
- source_word: שֶׁקֶץ
  choice: kitu cha kuchukiza
  rationale: Katika sheria za vyakula, neno hili huonyesha kitu kinachochukiza sana na kisichokubalika kwa matumizi; kirai hiki huhifadhi prediketi ya kinomino ya Kiebrania bila kukichanganya na msamiati mwingine wa unajisi.
- source_word: הוּא
  choice: ni
  rationale: Kiwakilishi huru cha Kiebrania kinaimarisha kishazi cha kinomino; Kiswahili hukiwakilisha kwa kawaida kwa kiunganishi ‘ni’.
- source_word: לָכֶם
  choice: kwenu
  rationale: Huonyesha tathmini na matumizi yanayowahusu watu wanaoambiwa; ‘kwenu’ ni ya asili na huhifadhi wazo la ‘kwa ninyi.’
theological_decisions:
- issue: Istilahi ya שֶׁקֶץ katika muktadha wa sheria za vyakula
  choice: kitu cha kuchukiza
  alternative: chukizo
  rationale: ‘Kitu cha kuchukiza’ huwasilisha nguvu ya tathmini ya neno na asili yake ya kinomino kwa lugha ya sasa. ‘Chukizo’ pia linawezekana, lakini linaweza kusikika nzito zaidi; hakuna neno la kiufundi la ‘najisi’ lililoingizwa kwa sababu שֶׁקֶץ si msamiati wa kawaida wa unajisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kiumbe’ huweka wazi rejeo la kimuktadha bila kubadili uainishaji wa jumla; ‘majini,’ ‘mapezi,’ na ‘magamba’ ni maneno ya kawaida na yanayoeleweka.
