source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: sw
  text: 'Na kila kitu ambacho kiumbe chochote miongoni mwa hao kitaangukia juu yake kikiwa kimekufa kitakuwa najisi: iwe ni chombo chochote cha mbao, vazi, ngozi, au kitambaa cha magunia—kifaa chochote kinachotumiwa kufanyia kazi. Kitawekwa ndani ya maji[a], nacho kitakuwa najisi mpaka jioni; kisha kitakuwa safi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitazamishwa majini.” Kiebrania kinasema kihalisi, “kitaletwa ndani ya maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: Na kila kitu ambacho mmojawapo wa hao ataangukia akiwa amekufa
  rationale: Huhifadhi upana wa כֹּל na maana ya kuguswa na mmoja wa viumbe waliotajwa katika mstari uliotangulia baada ya kufa. Umoja wa Kiswahili unaendana na מֵהֶם yenye maana ya mgawanyo.
- source_word: יִטְמָא
  choice: kitakuwa najisi
  rationale: Hueleza kuingia katika hali ya unajisi wa kiibada bila kuingiza wazo la hatia ya kimaadili.
- source_word: מִכָּל כְּלִי עֵץ א֣וֹ בֶגֶד אוֹ עוֹר א֣וֹ שָׂק
  choice: iwe ni chombo chochote cha mbao, vazi, ngozi, au kitambaa cha magunia
  rationale: מִן hapa inaingiza aina za vitu vinavyohusika. 'Kitambaa cha magunia' huonyesha nyenzo ya שָׂק kwa Kiswahili cha sasa kuliko neno linaloweza kueleweka kuwa gunia zima pekee.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: chombo chochote kinachotumiwa kufanya kazi
  rationale: Hutoa muhtasari wa vyombo au vifaa vilivyotengenezwa kwa nyenzo zilizoorodheshwa na kuhifadhi matumizi ya kifaa kama ilivyo katika kauli tendwa ya Kiebrania.
- source_word: בַּמַּיִם יוּבָא
  choice: Kitawekwa ndani ya maji
  rationale: Hifil-tendwa ya בוא ni kihalisi 'kitaletwa ndani ya maji'; 'kitawekwa ndani ya maji' ni ya kawaida na bado haiamui kimya kimya kwamba lazima kizamishe kabisa.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: nacho kitakuwa najisi mpaka jioni; kisha kitakuwa safi
  rationale: Huhifadhi muda wa hali ya unajisi na mfuatano wa kurejea katika hali ya usafi.
theological_decisions:
- issue: Maana ya טמא na טהר
  choice: najisi/safi katika muktadha wa sheria ya ibada
  alternative: chafu/safi au tiwa unajisi/takaswa
  rationale: '''Najisi'' na ''safi'' ni istilahi zinazoeleweka katika sheria za Walawi na hazibadili hali ya kiibada kuwa uchafu wa kawaida au hatia ya kimaadili.'
- issue: Kiwango cha kuingizwa majini
  choice: kitawekwa ndani ya maji
  alternative: kitazamishwa majini
  rationale: Kiebrania kinasema kihalisi kwamba kitu 'kitaletwa ndani ya maji'; tafsiri kuu huhifadhi kutokubainishwa iwapo kinapaswa kuzamishwa kabisa, huku tanbihi ikitoa uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. 'Najisi' limetumiwa kwa maana ya hali ya kiibada, na 'kitambaa cha magunia' kwa nyenzo ya שָׂק.
