  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: sw
  text: Msile sehemu yoyote ya nyama yao, wala msiguse mizoga yao[a]; hao ni najisi kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miili yao iliyokufa.” Neno la Kiebrania linamaanisha mzoga wa mnyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: sehemu yoyote ya nyama yao
  rationale: 'Kihusishi מִן kina maana ya kugawa hapa: hairuhusiwi kula sehemu yoyote ya nyama yao. ‘Nyama’ ni neno la kawaida na linaloeleweka kwa בָּשָׂר katika muktadha huu.'
- source_word: לֹא תֹאכֵלוּ
  choice: msile
  rationale: Hii ni amri ya kukataza iliyoelekezwa kwa wingi. ‘Msile’ ni Kiswahili cha sasa, cha moja kwa moja, na chenye nguvu ya kisheria bila kuwa kizito.
- source_word: וּבְנִבְלָתָם
  choice: mizoga yao[a]
  rationale: נְבֵלָה hapa ni mwili wa mnyama aliyekufa. ‘Mizoga’ hutofautisha kwa usahihi miili ya wanyama na maiti za wanadamu.
- source_word: לֹא תִגָּעוּ
  choice: msiguse
  rationale: נגע humaanisha kugusa au kukutana na kitu. ‘Msiguse’ ni tafsiri ya moja kwa moja; athari ya unajisi inaachwa itokane na muktadha.
- source_word: טְמֵאִים
  choice: najisi
  rationale: ‘Najisi’ huhifadhi aina ya kutokuwa safi kiibada inayozungumziwa katika sheria za Walawi, bila kuifanya iwe kauli kuhusu uovu wa kimaadili.
- source_word: הֵם לָכֶם
  choice: hao ni najisi kwenu
  rationale: ‘Hao’ hurejelea wanyama waliotajwa, na ‘kwenu’ huhifadhi uhusiano unaoonyeshwa na לָכֶם kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Asili ya unajisi katika sheria ya vyakula ya Walawi
  choice: Kutumia ‘najisi’ kama aina ya hali ya kiibada
  alternative: Kutumia ‘wasio safi’ au ‘wachafu’
  rationale: Aya iko katika mfumo wa sheria za utakatifu na usafi wa Israeli. ‘Najisi’ huhifadhi aina hiyo bila kuingiza hitimisho kuhusu uovu wa kimaadili au kuhusu jinsi sheria hii inavyotumika katika maagano mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri umetolewa kwa ufupi na kwa wingi. Alama ya tanbihi imewekwa baada ya ‘mizoga yao,’ ambako mbadala wa kileksika unahusika.
