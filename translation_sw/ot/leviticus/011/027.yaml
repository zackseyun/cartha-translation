source:
  edition: WLC
  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: sw
  text: Na kila mnyama anayetembea kwa viganja vya miguu yake, miongoni mwa wanyama wote wanaotembea kwa miguu minne[a], ni najisi kwenu. Yeyote atakayegusa mzoga wao[b] atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaokwenda kwa miguu yote minne.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mzoga wao.” Nomino “mzoga” iko katika umoja, lakini ina kiambishi cha umilikaji cha wingi; imetumiwa kwa maana ya kijumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ
  choice: Na kila mnyama anayetembea
  rationale: Kirai hiki kina nguvu ya kugawa kwa kila mmoja katika kundi linalozungumziwa. Neno “mnyama” limetajwa wazi kwa Kiswahili ili kuepuka dhana kwamba kinachorejelewa ni mtu.
- source_word: עַל כַּפָּיו
  choice: kwa nyayo zake
  rationale: כַּף humaanisha kiganja au sehemu ya chini ya mguu; katika muktadha wa wanyama, “nyayo” ni usemi wa kawaida unaoonyesha sehemu wanazokanyagia bila kuingiza wazo la makucha ambalo halipo katika Kiebrania.
- source_word: בְּכָל הַחַיָּה
  choice: miongoni mwa wanyama wote
  rationale: Katika sheria hizi חַיָּה hurejelea wanyama, hasa wa nchi kavu, wala si uhai kwa ujumla.
- source_word: הַהֹלֶכֶת עַל אַרְבַּע
  choice: wanaotembea kwa miguu minne
  rationale: Hii ni tafsiri ya wazi na ya kawaida ya usemi wa Kiebrania “wanaokwenda kwa vinne,” huku tanbihi ikihifadhi mbadala wa karibu zaidi wa kimuundo.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: ni najisi kwenu
  rationale: “Najisi” ni istilahi iliyozoeleka katika Kiswahili kwa hali ya kutokuwa safi kidini katika Walawi; hapa haisemi moja kwa moja kwamba wanyama hao wana hatia ya kimaadili.
- source_word: כָּל הַנֹּגֵעַ
  choice: Yeyote atakayegusa
  rationale: Huhifadhi maana ya sheria inayomhusu kila mtu anayefanya tendo hilo.
- source_word: בְּנִבְלָתָם
  choice: mzoga wa mnyama yeyote kati yao
  rationale: נְבֵלָה ni mwili wa mnyama aliyekufa. Uundaji huu ni wa asili katika Kiswahili na unawakilisha nomino ya umoja yenye kiambishi cha wingi inayotumiwa kwa maana ya kijumla katika Kiebrania.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: atakuwa najisi mpaka jioni
  rationale: Wakati ujao wa Kiswahili unafaa kwa matokeo ya kisheria, na “mpaka jioni” huhifadhi kikomo cha muda kilichotajwa.
theological_decisions:
- issue: Istilahi ya usafi wa kidini
  choice: najisi
  alternative: asiye safi / amenajisika
  rationale: “Najisi” huhifadhi hadhi ya kiibada inayodhibitiwa katika muktadha huu, bila kuigeuza kuwa hukumu ya moja kwa moja kuhusu hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa matini ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi muundo wa kundi la wanyama na matokeo ya kugusa mzoga bila kuondoa mvutano wa kisarufi wa umoja na wingi katika chanzo.
