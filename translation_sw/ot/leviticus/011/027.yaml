review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the animal class, ritual uncleanness, and uncleanness lasting until evening. However, “kwa nyayo zake” is not a natural way to express walking on paws/soles, and “mzoga wa mnyama yeyote kati yao” adds an indefinite restriction (“any one animal among them”) not expressed in the Hebrew. The Hebrew’s collective singular with plural suffix can be rendered directly as “mzoga wao.”
  naturalness: The legal register and use of “najisi” are suitable Standard East African Swahili. “Kwa viganja vya miguu yake” is clearer and more idiomatic in this close rendering than “kwa nyayo zake.”
  terminology: “Najisi” appropriately preserves the Levitical ritual-status terminology without implying moral culpability. “Mzoga” is the suitable term for נְבֵלָה in this context.
  issues:
  - severity: medium
    issue: “kwa nyayo zake”
    rationale: “Nyayo” normally denotes footprints or the soles/undersides of feet; “kutembea kwa nyayo zake” is awkward and does not naturally convey the Hebrew animal-paw expression.
  - severity: medium
    issue: “mzoga wa mnyama yeyote kati yao”
    rationale: This paraphrases and narrows the Hebrew collective expression by introducing “mnyama yeyote kati yao.” The source says literally “their carcass,” with singular נבלה and plural suffix.
  - severity: low
    issue: Footnote b opening and explanation
    rationale: “Kwa neno moja moja” is unidiomatic, and the explanation should plainly identify the singular noun and plural possessive suffix.
  revised_text: Na kila mnyama anayetembea kwa viganja vya miguu yake, miongoni mwa wanyama wote wanaotembea kwa miguu minne[a], ni najisi kwenu. Yeyote atakayegusa mzoga wao[b] atakuwa najisi mpaka jioni.
  revised_footnotes:
