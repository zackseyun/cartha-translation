source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: sw
  text: Lakini kila kilichomo baharini na katika vijito[b], kisicho na mapezi na magamba—miongoni mwa viumbe vyote vinavyosongamana majini na miongoni mwa viumbe hai wote waliomo majini—ni chukizo[a] kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitu cha kuchukiza kwenu.” Nomino ya Kiebrania hueleza kitu kinachokataliwa kiibada katika muktadha huu wa sheria za vyakula.
    reason: lexical_alternative
  - marker: b
    text: “Vijito” pia inaweza kutafsiriwa “mito” au “mikondo ya maji,” kutegemea muktadha; neno la Kiebrania lina maana pana ya njia zinazopitisha maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Lakini kila kilicho
  rationale: Kiunganishi וְ katika muktadha huu kinaanzisha tofauti na viumbe vinavyoruhusiwa katika mstari uliotangulia; “Lakini” huonyesha tofauti hiyo, na “kila kilicho” huhifadhi maana pana ya כֹל.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: ambacho hakina
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kishazi kinachoonyesha kutokuwapo kwa sifa zinazotakiwa.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: mapezi na magamba
  rationale: Maneno haya yanataja kwa pamoja alama mbili za kimaumbile; “na” hudumisha uhusiano wa kujumlisha wa Kiebrania.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: baharini na katika vijito
  rationale: “Baharini” ni tafsiri wazi ya יַמִּים. נְחָלִים inaweza kutaja vijito, mito, au mikondo ya maji; “vijito” ni lugha rahisi huku tanbihi ikihifadhi upana wa maana.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: miongoni mwa viumbe vinavyosongamana majini
  rationale: שֶׁרֶץ huonyesha viumbe wanaojaa au kusongamana; “miongoni mwa” huwasilisha matumizi ya sehemu ya מִן kwa Kiswahili cha kawaida.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: au miongoni mwa viumbe hai
  rationale: נֶפֶשׁ הַחַיָּה hapa ni usemi mpana kuhusu viumbe wenye uhai. “Viumbe hai” ni ya asili na haibani maana kuwa “nafsi.” Muundo wa “iwe…au…” unaonyesha makundi yote mawili bila kuyatenganisha kama masharti mbadala.
- source_word: אֲשֶׁר בַּמָּיִם
  choice: vilivyomo majini
  rationale: Kishazi hiki kinahusiana na viumbe hai waliotajwa, na “majini” hudumisha rejeo pana la mazingira ya majini.
- source_word: שֶׁקֶץ
  choice: chukizo
  rationale: Katika sheria za vyakula, neno hili hueleza kitu kinachokataliwa kwa nguvu katika hali ya kiibada. “Chukizo” huhifadhi uzito wake bila kuongeza istilahi nyingine isiyopo katika neno lenyewe.
- source_word: הֵם לָכֶם
  choice: ni chukizo kwenu
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa na kinaeleza hadhi ya viumbe hao kwa Israeli; wakati wa sasa ndio wa moja kwa moja zaidi kwa Kiswahili.
theological_decisions:
- issue: Istilahi ya hadhi ya kiibada katika sheria ya vyakula
  choice: chukizo
  alternative: kitu cha kuchukiza kwenu
  rationale: Mstari huu unaainisha vyakula chini ya agano, wala hautoi hukumu ya jumla ya kimaadili juu ya viumbe hivyo. “Chukizo” huhifadhi nguvu ya שֶׁקֶץ na pia hali yake ya kisheria-kiibada bila kupanua dai la andiko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi upeo mpana wa sheria na makundi mawili ya viumbe wa majini, huku vistari virefu vikisaidia msomaji kufuatilia kishazi kikuu.
