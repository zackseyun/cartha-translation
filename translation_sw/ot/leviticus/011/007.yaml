  naturalness: “Nguruwe ... ni najisi kwenu” ni Kiswahili Sanifu na kinafaa kwa rejesta ya sheria ya kiibada. “Hatafuni tena chakula” ni usemi wazi na wa asili zaidi kwa wasomaji wa sasa kuliko “hacheui,” huku ukionyesha maana inayokusudiwa.
