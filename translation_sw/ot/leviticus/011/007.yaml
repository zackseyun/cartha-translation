  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: sw
  text: Na nguruwe, kwa sababu ana kwato zilizogawanyika, na kwato zake zimepasuka kabisa, lakini hatafuni tena chakula, ni najisi kwenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: nguruwe
  rationale: Neno la kawaida la Kiswahili kwa mnyama huyu; linataja aina ya mnyama kwa ujumla.
- source_word: כִּי
  choice: kwa sababu
  rationale: Linaonyesha sababu ya kuainishwa kwa nguruwe jinsi inavyoelezwa katika mstari huu.
- source_word: מַפְרִיס פַּרְסָה
  choice: ana kwato zilizogawanyika
  rationale: Hueleza kwa Kiswahili cha kawaida hali ya kwato kuwa zimegawanyika.
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: yaani kwato zake zimepasuka vipande viwili
  rationale: Inahifadhi maelezo ya pili yenye kusisitiza kwamba ukwato umegawanyika kabisa, huku ikiepuka urudiaji usioeleweka katika Kiswahili.
- source_word: גֵּרָה לֹא יִגָּר
  choice: hacheui
  rationale: Kitenzi hiki cha kawaida humaanisha kurudisha na kutafuna tena chakula kilichomezwa, hivyo kinawasilisha nahau ya Kiebrania kwa ufupi na kwa usahihi.
- source_word: טָמֵא הוּא לָכֶם
  choice: yeye ni najisi kwenu
  rationale: Linahifadhi mpangilio na msisitizo wa Kiebrania, pamoja na uhusiano wa sheria hii na walioambiwa, bila kuifanya iwe hukumu ya uovu wa kimaadili.
theological_decisions:
- issue: Maana ya טָמֵא katika sheria za vyakula
  choice: najisi katika maana ya kiibada na ya sheria za vyakula
  alternative: mchafu; asiye safi
  rationale: Katika Mambo ya Walawi 11 neno hili linaonyesha kundi la kiibada linalohusu vyakula na utakatifu wa Israeli, si kwamba mnyama huyo ni mwovu kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi maelezo mawili ya Kiebrania kuhusu ukwato, lakini kiunganishi “yaani” kinaonyesha kwamba la pili linafafanua na kusisitiza la kwanza. “Hacheui” ni usemi wa kawaida na unaoeleweka kuliko tafsiri ya neno kwa neno ya ‘hapandishi tena chakula.’
