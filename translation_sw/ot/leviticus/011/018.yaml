  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kiebrania wa orodha inayoendelea: וְאֶת ... וְאֶת ... וְאֶת, kwa kiunganishi cha mwanzo “na” na majina matatu ya ndege. “Bundi,” “mwari,” na “tai wa Misri” zinaakisi kwa usahihi wa kutosha utambulisho wa kawaida wa תִּנְשֶׁמֶת, קָאָת, na רָחָם, huku tanbihi zikihifadhi tahadhari inayofaa kuhusu utambulisho wa wanyama hawa wa kale.'
