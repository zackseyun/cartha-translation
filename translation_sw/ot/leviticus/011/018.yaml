lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (hattinšemet)
  choice: bundi
  rationale: Katika orodha hii ya ndege, neno hilo kwa kawaida hueleweka kuwa aina ya bundi, ingawa utambulisho kamili wa ndege huyo haujulikani kwa hakika.
- source_word: הַקָּאָת (haqqāʾat)
  choice: mwari
  rationale: Neno hili kwa kawaida hutambulishwa kuwa pelican; “mwari” ni jina la kawaida la ndege huyo katika Kiswahili sanifu.
- source_word: הָרָחָם (hārāḥām)
  choice: tai wa Misri
  rationale: Utambulisho unaokubalika sana ni Egyptian vulture; tafsiri hii ni mahususi kuliko “tai mla mizoga” na inaendana na ushahidi wa kileksika.
