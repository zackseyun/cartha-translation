  footnotes:
  - marker: a
    text: Utambulisho kamili wa ndege huyu haujulikani; huenda ni aina fulani ya bundi.
    reason: Neno la Kiebrania תִּנְשֶׁמֶת lina utambulisho usio na uhakika katika orodha hii ya ndege.
  - marker: b
    text: 'Au: tai mla mizoga; utambulisho kamili wa ndege huyu haujulikani.'
