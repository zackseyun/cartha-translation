base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/017.yaml
  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: sw
  text: bundi mdogo[a], koromoti, na bundi mkubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho wa ndege hawa hauna uhakika. “Bundi mdogo,” “koromoti,” na “bundi mkubwa” ni tafsiri zinazowezekana za jadi au za kitaalamu; tafsiri nyingine ni “bundi” kwa כּוֹס, “mwari” kwa שָׁלָךְ, na “bundi mwenye pembe” au “bundi tai” kwa יַנְשׁוּף.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: bundi mdogo
  rationale: Neno hili humaanisha ndege aliye najisi katika orodha hii, lakini spishi kamili haijulikani. “Bundi mdogo” ni utambulisho unaokubalika unaoonyesha kwamba huenda Kiebrania kinamtaja ndege maalumu, si jamii yote ya bundi.
- source_word: הַשָּׁלָךְ
  choice: koromoti
  rationale: Utambulisho wake kamili unabishaniwa. “Koromoti” ni tafsiri ya jadi inayowezekana kwa ndege wa majini anayepiga mbizi, huku uwezekano wa “mwari” ukihifadhiwa katika tanbihi.
- source_word: הַיַּנְשׁוּף
  choice: bundi mkubwa
  rationale: Neno hili katika orodha za ndege huenda linamtaja ndege mkubwa wa usiku wa jamii ya bundi. Tafsiri hii inaonyesha umahususi bila kudai kwa uhakika spishi ya kisasa.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi kinachorudiwa pamoja na kiashiria cha yambwa kinaendeleza orodha. Kiswahili cha kawaida hutumia koma na “na” kabla ya kipengele cha mwisho badala ya kurudia “na” kwa kila nomino.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kawaida na chenye hadhi. Muundo mfupi wa orodha umehifadhiwa; tanbihi inaweka wazi kutokuwa na uhakika kwa utambulisho wa spishi.
