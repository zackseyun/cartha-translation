base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: sw
  text: Na pelele[a], kwa kuwa hucheua lakini ukwato wake haujagawanyika, ni najisi kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: hyrax; mnyama mdogo anayeishi kwenye miamba. Tafsiri za kale za Kiingereza mara nyingi zina “coney.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: huyo pelele
  rationale: Neno la Kiebrania linamtaja mnyama mdogo anayeishi kwenye miamba, anayetambuliwa kwa kawaida kuwa pelele (hyrax). ‘Pelele’ ni jina la kawaida na sahihi katika Kiswahili cha Afrika Mashariki.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya uainishaji wa mnyama; ‘kwa sababu’ kinaonyesha wazi uhusiano huo wa kisababishi.
- source_word: מַעֲלֵה גֵרָה
  choice: hucheua
  rationale: Hii ndiyo istilahi ya kawaida ya Kiswahili kwa tendo linaloelezwa na nahau ya Kiebrania ya ‘kupandisha tena chakula.’ Inahifadhi lugha ya sheria ya vyakula bila kuwa ngumu.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: hana kwato zilizogawanyika
  rationale: Kifungu kinaeleza kwamba mnyama hana ukwato uliogawanyika. Wingi ‘kwato’ ni wa asili katika Kiswahili na maana ya kigezo cha kisheria inabaki wazi.
- source_word: טָמֵא
  choice: najisi
  rationale: Katika sheria za Walawi, ‘najisi’ ni istilahi iliyozoeleka kwa hali ya kutokuwa safi kidini, wala si hukumu kwamba mnyama ana uovu wa kimaadili.
- source_word: לָכֶם
  choice: kwenu
  rationale: Hili linaonyesha kwamba uainishaji huo unawahusu watu wanaoambiwa sheria, na ni usemi mfupi wa asili unaolingana na Kiebrania.
theological_decisions:
- issue: Maana ya טָמֵא katika sheria ya vyakula ya Walawi
  choice: najisi kwa mujibu wa hali ya kiibada/kidini
  alternative: mchafu au mwovu kimaadili
  rationale: Muktadha wa Walawi 11 unahusu uainishaji wa usafi na unajisi wa kidini. ‘Najisi’ huhifadhi aina hiyo ya kisheria na kitheolojia bila kudai kwamba mnyama ana uovu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi sababu mbili za uainishaji na tamko la mwisho la kisheria.
