  text: na mbuni[a], na mwewe, na shakwe, na kipanga kwa aina yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho wa baadhi ya ndege wa Kiebrania katika mstari huu hauna uhakika. Tafsiri nyingine za jadi ni pamoja na “bundi” badala ya “mbuni,” “bundi” au ndege wa usiku badala ya “mwewe,” ndege aitwaye cuckoo badala ya “shakwe,” na “mwewe” badala ya “kipanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: mbuni
  rationale: Ingawa kirai cha Kiebrania kwa muundo wake ni ‘binti wa ya'anah,’ katika orodha ya wanyama kinatumika kama jina la ndege. ‘Mbuni’ ndilo tambulisho linalokubalika zaidi katika ushahidi mpana wa kileksika, ingawa si hakika kabisa.
- source_word: הַתַּחְמָס
  choice: mwewe
  rationale: Utambulisho mahususi wa ndege huyu hauna uhakika. ‘Mwewe’ ni jina pana na la kawaida la ndege mla nyama, bila kudai spishi maalumu.
- source_word: הַשָּׁחַף
  choice: shakwe
  rationale: Neno hili lina utambulisho usio na uhakika, lakini ‘shakwe’ linaungwa mkono sana na kamusi na tafsiri za kisasa na ni jina la kawaida la Kiswahili.
- source_word: הַנֵּץ
  choice: kipanga
  rationale: Neno hili humaanisha ndege mla nyama wa jamii ya mwewe au falconi. ‘Kipanga’ linatofautisha ndege huyu na תַּחְמָס huku likibaki ndani ya wigo wa maana unaowezekana.
- source_word: לְמִינֵהוּ
  choice: kwa aina yake
  rationale: Kirai hiki cha uainishaji kinaonyesha kundi au jamii ya ndege huyo. ‘Kwa aina yake’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: וְאֵת / וְאֶת
  choice: na
  rationale: Kiunganishi kinatendeleza orodha kutoka mstari uliotangulia; kiashiria cha yambwa cha Kiebrania hakina tafsiri ya moja kwa moja katika Kiswahili.
