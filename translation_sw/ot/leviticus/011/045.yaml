  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: sw
  text: Kwa maana mimi ni Yahwe, niliyewapandisha[a] kutoka nchi ya Misri ili niwe Mungu wenu. Nanyi mtakuwa watakatifu, kwa sababu[b] mimi ni mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninayewapandisha.” Kiebrania kinatumia umbo la participle, ambalo linaweza kutafsiriwa kwa maana ya wakati wa sasa, ingawa tukio la kutoka Misri lilikuwa la wakati uliopita.
    reason: lexical_alternative
  - marker: b
    text: Au, “maana mimi ni mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatumiwa jina la agano kwa unukuzi wa kawaida wa Kiswahili badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: הַמַּעֲלֶה
  choice: niliyewapandisha
  rationale: Hali ya kushirikisha ya Kiebrania humtaja Mungu kuwa ndiye anayewapandisha; wakati uliopita unasikika kwa kawaida katika Kiswahili kwa sababu tendo la kutoka Misri lilikuwa limekwisha, huku picha ya kupandishwa kutoka Misri ikihifadhiwa.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: kutoka nchi ya Misri
  rationale: Huhifadhi nomino המפורש “nchi” na kauli ya agano inayorejelea kutoka Misri.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: ili niwe Mungu wenu
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaohifadhi kusudi na uhusiano wa agano.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: Nanyi mtakuwa watakatifu
  rationale: Wakati ujao hapa una nguvu ya agizo la agano; “watakatifu” huhifadhi maana pana ya utakatifu kuliko kuifupisha kuwa kutengwa pekee.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: kwa sababu mimi ni mtakatifu
  rationale: 'כִּי ya pili inaonyesha msingi wa agizo: watu wanapaswa kuwa watakatifu kwa sababu Mungu ni mtakatifu.'
theological_decisions:
- issue: Msingi wa agano wa utakatifu
  choice: Agizo la Israeli kuwa watakatifu linawekwa juu ya utambulisho wa Yahwe, tendo lake la kuwatoa Misri, uhusiano wake nao akiwa Mungu wao, na utakatifu wake mwenyewe.
  alternative: Kuichukulia aya kama kanuni ya utakaso wa vyakula tu isiyo na maana pana ya agano.
  rationale: Muktadha wa karibu unahusu vyakula na utakaso, lakini lugha ya aya yenyewe inaunganisha agizo hilo na kutoka Misri, uhusiano wa agano, na utakatifu wa Mungu bila kupanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa agano umehifadhiwa bila ukale usio wa lazima; “niliyewapandisha” huhifadhi picha ya Kiebrania ya kupanda kutoka Misri.
