base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: sw
  text: 'Miongoni mwao, mnaweza kula hawa: nzige kwa aina yake[a], na nzige mwenye kipara kwa aina yake, na kriketi kwa aina yake, na panzi kwa aina yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa majina ya Kiebrania ya wadudu hawa, isipokuwa “nzige,” hauna uhakika. Tafsiri za kimapokeo zinajumuisha “nzige mwenye kipara” kwa סָּלְעָם na “kriketi” kwa חַרְגֹּל.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: Miongoni mwao, mnaweza kula hawa
  rationale: Kifungu hiki kinachagua baadhi ya viumbe wenye mabawa waliotajwa awali; muundo huu ni wa asili katika Kiswahili na hudumisha maana ya kundi dogo linaloruhusiwa.
- source_word: תֹּאכֵלוּ
  choice: mnaweza kula
  rationale: Katika sheria hii, kitenzi kinaonyesha ruhusa, si amri ya lazima kula.
- source_word: הָאַרְבֶּה
  choice: nzige
  rationale: Hili ndilo neno la kawaida na lenye utambulisho ulio thabiti zaidi kwa locust katika Kiswahili.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: kwa aina zake
  rationale: Kauli hii ya uainishaji inahusu jamii mbalimbali zilizo chini ya aina iliyotajwa; 'kwa aina zake' ni ya kawaida na wazi katika Kiswahili.
- source_word: הַסָּלְעָם
  choice: nzige mwenye kipara
  rationale: Utambulisho kamili wa mdudu huyu hauna uhakika; tafsiri hii inafuata mapokeo ya kale huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: הַחַרְגֹּל
  choice: senene
  rationale: Neno la Kiebrania halitambuliki kwa uhakika. 'Senene' ni jina linaloeleweka Afrika Mashariki kwa mdudu anayeruka wa kundi hili, lakini si utambulisho wa hakika.
- source_word: הֶחָגָב
  choice: panzi
  rationale: '''Panzi'' ni neno la kawaida la Kiswahili kwa grasshopper na linaitofautisha na אַרְבֶּה, ''nzige,'' katika mstari huohuo.'
