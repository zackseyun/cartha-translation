source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: sw
  text: Kwa maana mimi ni Yahweh, Mungu wenu. Basi jitakaseni[a] na muwe watakatifu, kwa maana mimi ni mtakatifu. Wala msijitie unajisi[b] kwa kiumbe chochote kinachotambaa juu ya ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jiwekeni wakfu.” Kitenzi cha Kiebrania ni cha kujirejelea, kikimaanisha kujiweka kando kuwa watakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au “msijifanye kuwa najisi kwa kiumbe chochote kinachotambaa juu ya ardhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA,” hivyo kuhifadhi jina binafsi katika fomula ya agano.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika fomula hii ya agano neno hili linamrejelea Mungu mmoja, Yahwe; “Mungu wenu” ni Kiswahili cha kawaida na sahihi.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Basi jitakaseni
  rationale: Kauli ya Kiebrania ni ya kujirejelea na inawataka watu wajiweke katika hali ya utakatifu. “Jitakaseni” ni ya asili katika Kiswahili na inadumisha mzizi unaohusiana na “watakatifu” na “mtakatifu.”
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: na muwe watakatifu
  rationale: Huhifadhi nguvu ya agizo na hali inayotakiwa kuwa matokeo ya kujitakasa.
- source_word: קָדוֹשׁ
  choice: mtakatifu
  rationale: Neno la kawaida la kitheolojia katika Kiswahili, nalo linahifadhi uhusiano wa moja kwa moja kati ya utakatifu wa Mungu na wa watu wake.
- source_word: תְטַמְּאוּ
  choice: msijitie unajisi
  rationale: Kauli hii inaonyesha kujiletea hali ya uchafu wa kiibada. “Kujitia unajisi” ni ya heshima, inaeleweka, na haipunguzi maana kuwa uchafu wa kawaida tu.
- source_word: נַפְשֹׁתֵיכֶם
  choice: msijitie
  rationale: Muundo wa kujirejelea unawakilisha watu wenyewe bila kutafsiri נֶפֶשׁ kama “roho,” jambo ambalo lingeweza kuingiza mgawanyo wa mwili na roho usiolengwa hapa.
- source_word: שֶּׁרֶץ
  choice: kiumbe chochote kinachosongamana
  rationale: “Kinachosongamana” hudokeza viumbe wadogo wanaotokea au kusonga kwa wingi, na hivyo kutofautisha neno hili na kitenzi kinachofuata.
- source_word: הָרֹמֵשׂ
  choice: na kutembea
  rationale: Hutoa maana pana ya kusonga juu ya ardhi bila kulazimisha aina mahususi ya mwendo kama kutambaa pekee.
- source_word: עַל הָאָרֶץ
  choice: juu ya ardhi
  rationale: Katika muktadha huu “ardhi” huonyesha sehemu ambayo viumbe hao husonga; ni ya kawaida na sahihi kuliko maana pana ya ulimwengu mzima.
theological_decisions:
- issue: Uhusiano kati ya utakatifu wa Mungu na wajibu wa watu
  choice: Kutumia mzizi wa “-takatifu” katika “jitakaseni,” “watakatifu,” na “mtakatifu”
  alternative: Kutafsiri agizo la kwanza “jiwekeni wakfu” au kueleza utakatifu kama “kutengwa”
  rationale: 'Kurudia mzizi mmoja kunahifadhi uhusiano wa maneno ya Kiebrania na msingi wa agizo: watu wanapaswa kuwa watakatifu kwa sababu Mungu ni mtakatifu.'
- issue: Maana ya נַפְשֹׁתֵיכֶם katika katazo la unajisi
  choice: 'Kutafsiri kwa kujirejelea: “msijitie unajisi”'
  alternative: “msizinajisi nafsi zenu” au “roho zenu”
  rationale: Muktadha unahusu watu wenyewe, si fundisho maalumu kuhusu sehemu ya kiroho ya mwanadamu; tafsiri ya kujirejelea huepuka kuingiza dai la kianthropolojia lisilosemwa na aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Basi” huunganisha agizo na tamko lililotangulia bila kufanya uhusiano wa kisababu kuwa mkali kupita kiunganishi cha Kiebrania. Alama zote za tanbihi zimewekwa mahali panapohusika moja kwa moja.
