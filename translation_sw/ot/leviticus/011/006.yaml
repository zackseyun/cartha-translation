base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: sw
  text: Na sungura wa porini[a], kwa sababu hucheua lakini hana ukwato uliogawanyika, ni najisi kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sungura.” Neno la Kiebrania אַרְנֶבֶת kwa mapokeo hueleweka kuwa sungura wa porini, ingawa wengine hulielewa kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: sungura-mwitu
  rationale: Neno la Kiebrania kwa kawaida hueleweka kuwa hare; “sungura-mwitu” linatofautisha mnyama huyo na sungura wa kawaida huku tanbihi ikihifadhi uwezekano mpana zaidi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi hiki kinatanguliza sababu ya mnyama kuhesabiwa kuwa najisi.
- source_word: מַעֲלַת גֵּרָה
  choice: hucheua
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza kitendo cha kurudisha na kutafuna tena chakula.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: lakini hana kwato zilizogawanyika
  rationale: Kauli hii huonyesha kwa uwazi kigezo cha pili ambacho mnyama huyo hatimizi; “lakini” huwasilisha ulinganifu wenye kupingana.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: ni najisi kwenu
  rationale: “Najisi” huhifadhi istilahi ya kibiblia ya kutokuwa safi kidesturi, na “kwenu” huhifadhi uhusiano wa agano unaoelekezwa kwa wasikilizaji.
theological_decisions:
- issue: Asili ya unajisi katika sheria za vyakula za Walawi
  choice: najisi kidesturi
  alternative: chafu au ovu kimaadili
  rationale: Muktadha unaainisha wanyama kwa matumizi ya Israeli chini ya sheria za utakatifu; hausisitizi kwamba mnyama huyo ni mwovu kimaadili. Maandishi yanatumia “najisi” bila kuongeza ufafanuzi usiomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. “Hucheua” ni istilahi inayoeleweka kwa kitendo cha kutafuna tena chakula, na “najisi” hudumisha maana ya kidesturi ya muktadha.
