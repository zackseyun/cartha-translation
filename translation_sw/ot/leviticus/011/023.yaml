  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: sw
  text: Lakini kila kiumbe mdogo mwenye mabawa wa jamii ya viumbe wanaosongamana, mwenye miguu minne, ni kitu cha kuchukiza kwenu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiumbe kitambaacho chenye mabawa.” Kirai cha Kiebrania kinahusu kwa upana viumbe wadogo wenye mabawa waendao au waeneao kwa wingi, hasa wadudu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “miguu minne”; kwa wadudu, Kiswahili pia huweza kusema “vileje vinne.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Lakini kila
  rationale: Kiunganishi וְ hapa kinaendeleza tofauti na ruhusa ya mstari uliotangulia; “lakini” huonyesha tofauti hiyo kwa Kiswahili cha kawaida, huku כֹל ikitafsiriwa “kila.”
- source_word: שֶׁרֶץ הָעֹוף
  choice: kiumbe kidogo chenye mabawa kinachoruka kwa makundi
  rationale: Kirai hiki kinataja kwa upana viumbe wadogo warukao na kusongamana, hasa wadudu. Tafsiri hii inaeleweka kwa urahisi bila kukibana kirai kuwa jina la kisayansi pekee.
- source_word: אֲשֶׁר לוֹ
  choice: ambacho kina
  rationale: Hii ni kauli ya uhusiano inayoonyesha sifa ya kiumbe; “ambacho kina” ni ya kawaida na wazi katika Kiswahili.
- source_word: אַרְבַּע רַגְלָיִם
  choice: miguu minne
  rationale: רַגְלָיִם inaweza kumaanisha miguu au nyayo. “Miguu minne” ni tafsiri ya moja kwa moja na ya kawaida kwa viumbe.
- source_word: שֶׁקֶץ
  choice: kitu cha kuchukiza
  rationale: Katika muktadha wa sheria za chakula, neno hili huonyesha kitu kinachopaswa kukataliwa kwa kuchukiza; “kitu cha kuchukiza” huhifadhi nguvu yake bila kukichanganya moja kwa moja na istilahi nyingine ya kutokuwa safi.
- source_word: הוּא לָכֶם
  choice: ni kitu cha kuchukiza kwenu
  rationale: Kiebrania kina kishazi kisicho na kitenzi dhahiri; Kiswahili huweka “ni.” “Kwenu” huhifadhi uelekeo wa sheria kwa walioambiwa.
