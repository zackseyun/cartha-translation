base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: sw
  text: 'Kati ya vyote vilivyo majini, hivi ndivyo mnavyoweza kula: kila kilicho majini—baharini na katika vijito[a]—chenye mapezi na magamba, hivyo mnaweza kula.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mito.” Neno la Kiebrania linaweza kumaanisha vijito, mito, au mikondo ya maji inayoweza kukauka kwa majira.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה
  choice: hivi
  rationale: Kiashiria cha umoja katika Kiebrania kinatumika kwa maana ya kijumla katika sheria hii; “hivi” ni ya kawaida katika Kiswahili na hutanguliza aina ya viumbe vinavyoruhusiwa kuliwa.
- source_word: תֹּאכְלוּ
  choice: mnaweza kula
  rationale: Katika agizo hili la kisheria, kitenzi kinaonyesha ruhusa ya kula, si amri inayowalazimu watu wale.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: kati ya vyote vilivyo majini
  rationale: “Kati ya” huhifadhi maana ya kuchagua sehemu kutoka katika jumla, huku “majini” ikiwa usemi wa kawaida wa Kiswahili kwa viumbe vilivyo ndani ya maji.
- source_word: כֹּל אֲשֶׁר לוֹ
  choice: kila ... chenye
  rationale: Muundo huu unadumisha maana ya kugawa kwa kila kiumbe na unaonyesha kwa kawaida kuwa kiumbe hicho kina sifa zinazotajwa.
- source_word: סְנַפִּיר
  choice: mapezi
  rationale: Ingawa neno la Kiebrania ni nomino ya aina katika umoja, wingi “mapezi” ni wa kawaida katika maelezo ya viumbe vya majini.
- source_word: קַשְׂקֶשֶׂת
  choice: magamba
  rationale: “Magamba” ni istilahi ya kawaida ya Kiswahili kwa vifuniko vidogo vya ngozi ya samaki vinavyokusudiwa hapa.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: baharini na katika vijito
  rationale: “Baharini” huwakilisha יַמִּים kwa upana; “vijito” ni tafsiri inayosomeka kwa נְחָלִים, huku uwezekano wa “mito” na mikondo ya msimu ukihifadhiwa katika tanbihi.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: hicho mnaweza kula
  rationale: Kirudisho hiki kinahifadhi msisitizo wa mwisho wa Kiebrania juu ya kila kiumbe kinachotimiza masharti yaliyotajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wazi na wa kisheria lakini unaosomeka kwa urahisi. Miundo ya “kati ya,” “kila ... chenye,” na kirudisho cha mwisho inadumisha mpangilio na msisitizo wa Kiebrania bila kufanya sentensi kuwa ngumu.
