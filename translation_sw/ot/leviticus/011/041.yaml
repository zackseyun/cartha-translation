  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: sw
  text: Na kila kiumbe kitambaacho[a] kinachotambaa juu ya ardhi ni chukizo[b]; kisiliwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiumbe kitambaacho.” Neno la Kiebrania hutaja kwa upana viumbe vidogo vinavyotambaa, kusongamana, au kwenda karibu na ardhi.
    reason: lexical_alternative
  - marker: b
    text: Au “kitu cha machukizo.” Hapa neno hilo humaanisha kitu kinachokataliwa kuwa chakula katika sheria hizi za kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Na kila
  rationale: “Na” huunganisha katazo hili na sheria za vyakula zilizotangulia, huku “kila” ikihifadhi maana pana ya כָּל.
- source_word: הַ/שֶּׁרֶץ
  choice: kiumbe kitambaacho[a]
  rationale: שֶׁרֶץ hutaja kwa upana viumbe vidogo vinavyosongamana au kwenda karibu na ardhi. “Kiumbe kitambaacho” ni Kiswahili cha kawaida na kinaweza kuambatana na kitenzi cha mzizi huohuo kinachofuata.
- source_word: הַ/שֹּׁרֵץ
  choice: kinachotambaa
  rationale: 'Kurudia mzizi wa “kutambaa” kunahifadhi kwa kiasi uradidi na msisitizo wa Kiebrania: kiumbe kitambaacho ambacho kinatambaa.'
- source_word: עַל הָ/אָ֑רֶץ
  choice: juu ya ardhi
  rationale: אָרֶץ hapa inaonyesha eneo la nchi kavu, tofauti na mazingira ya majini; “juu ya ardhi” hudumisha picha hiyo bila kuibana kuwa udongo pekee.
- source_word: שֶׁ֥קֶץ
  choice: chukizo[b]
  rationale: שֶׁקֶץ hapa humtaja kiumbe asiyekubalika kabisa kuwa chakula katika sheria hizi. “Chukizo” huhifadhi nguvu ya neno na rejesta ya kisheria ya kifungu.
- source_word: ה֖וּא
  choice: ni
  rationale: Kishazi “ni chukizo” hutoa tamko la wazi la Kiebrania kwa Kiswahili cha kawaida; msisitizo wa kiwakilishi hueleweka katika muundo mzima.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: kisiliwe
  rationale: Kauli ya kutendwa yenye katazo imetafsiriwa kwa amri hasi ya kutendwa. “Kisiliwe” ni fupi, wazi, na hudumisha mtindo wa kisheria.
theological_decisions:
- issue: Aina ya uchukizo unaokusudiwa na שֶׁקֶץ
  choice: Neno limetafsiriwa “chukizo” na tanbihi ikaeleza muktadha wa chakula.
  alternative: Kitu najisi na cha kuchukiza
  rationale: Matini yenyewe haisemi moja kwa moja “najisi” katika mstari huu. Kuepuka kuliongeza katika matini kuu kunahifadhi tofauti za msamiati wa sura, huku tanbihi ikifafanua matumizi ya neno katika sheria za vyakula.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na wa kisheria unaoeleweka kwa wasomaji wa kawaida. Uradidi “kitambaacho kinachotambaa” umehifadhiwa kwa makusudi ili kuakisi uradidi wa mzizi katika Kiebrania, ingawa unasikika rasmi zaidi kuliko usemi wa mazungumzo.
