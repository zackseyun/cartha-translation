lexical_decisions:
- source_word: חֲסִידָה
  choice: korongo
  rationale: Hili ndilo jina linaloeleweka kwa ndege mkubwa mwenye miguu mirefu anayekusudiwa kwa kawaida na neno hili la Kiebrania, ingawa majina ya kawaida ya ndege hawa yanaweza kutofautiana.
- source_word: אֲנָפָה
  choice: koikoi
  rationale: Utambulisho kamili wa ndege huyu hauna uhakika; “koikoi” ni jina la Kiswahili linalotumika kwa aina ya heron na linafaa katika orodha hii.
- source_word: לְמִינָהּ
  choice: kwa aina zake
  rationale: Kauli hii inaonyesha aina mbalimbali zinazohusiana ndani ya kundi lilelile la ndege; wingi wa Kiswahili huwasilisha maana hiyo kwa kawaida.
- source_word: דּוּכִיפַת
  choice: hudihudi
  rationale: Utambuzi wa kisasa wa neno hili la Kiebrania unaunga mkono ndege aitwaye hoopoe, ambaye kwa Kiswahili huitwa hudihudi.
- source_word: עֲטַלֵּף
  choice: popo
  rationale: Utambulisho wake ni thabiti. Orodha ya Kiebrania inafuata viumbe warukao kwa jinsi wanavyoonekana, si uainishaji wa kisasa wa kibiolojia.
- source_word: וְאֵת / וְאֶת
  choice: na
  rationale: Kiunganishi kinadumisha muundo wa orodha, huku alama ya yambwa ya Kiebrania ikiwa haihitaji kutafsiriwa tofauti katika Kiswahili.
