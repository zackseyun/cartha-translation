id: LEV.11.42
reference: Leviticus 11:42
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: sw
  text: Kila kitu kinachokwenda kwa tumbo[a], na kila kinachokwenda kwa miguu minne, hata kila chenye miguu mingi, miongoni mwa viumbe wote wanaotambaa juu ya ardhi[b]—msivile, kwa maana ni vitu vya kuchukiza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinachotambaa kwa tumbo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno katika Kiebrania, “kiumbe kitambaacho kinachotambaa”; uradidi huo unakazia kundi hili la viumbe.
    reason: lexical_alternative
  - marker: c
    text: Au, “ni chukizo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: kila kitu / kila
  rationale: Neno hili limetumiwa kwa maana ya kugawa makundi kwa upana; “kila” linahifadhi nguvu yake ya kujumlisha.
- source_word: הוֹלֵךְ עַל גָּח
  choice: kinachokwenda kwa tumbo lake
  rationale: Huu ni uwasilishaji wa karibu wa namna ya kusonga bila kulazimisha tafsiri mahsusi zaidi ya “kutambaa.”
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: kinachokwenda kwa miguu minne
  rationale: Kauli hii ni wazi na ya kawaida katika Kiswahili, nayo inadumisha picha halisi ya Kiebrania.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: hata kila chenye miguu mingi
  rationale: “Hata” linaonyesha upanuzi wenye kujumuisha kutoka kwa makundi yaliyotangulia hadi kwa viumbe wenye miguu mingi.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: miongoni mwa viumbe wote wanaotambaa
  rationale: “Miongoni mwa” linaonyesha uainishaji wa viumbe hao; tafsiri kuu ni ya kawaida, huku tanbihi ikihifadhi uradidi wa mzizi wa Kiebrania.
- source_word: עַל הָאָרֶץ
  choice: juu ya ardhi
  rationale: “Ardhi” ni kisawe cha moja kwa moja kinachofaa katika uainishaji huu wa viumbe.
- source_word: לֹא תֹאכְלֻם
  choice: msivile
  rationale: Umbo hili linatoa katazo la moja kwa moja na kuhifadhi kiwakilishi cha wingi kinachorejelea viumbe waliotajwa.
- source_word: שֶׁקֶץ
  choice: vitu vya kuchukiza
  rationale: Katika sheria za vyakula, neno hili linaonyesha vitu vinavyoonekana kuwa vya kuchukiza na vilivyokatazwa; usemi huu ni mkali lakini unaeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Asili ya katazo katika sheria za utakatifu
  choice: Kuliwasilisha kama katazo la moja kwa moja kuhusu kula, bila kuingiza hitimisho kuhusu matumizi yake katika nyakati nyingine.
  alternative: Kulieleza kuwa amri ya maadili ya kudumu, au kulipunguza kuwa desturi ya kitamaduni tu.
  rationale: Kiebrania kinatoa katazo la moja kwa moja ndani ya sheria za utakaso za Walawi. Tafsiri haipaswi kuamua mjadala mpana wa kiteolojia ambao haujaelezwa katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa sheria umehifadhiwa, lakini sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili. Tanbihi zinaonyesha mbadala wa kimsamiati na uradidi wa Kiebrania bila kuufanya mstari mkuu kuwa mzito.
