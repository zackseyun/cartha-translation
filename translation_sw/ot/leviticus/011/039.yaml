  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: sw
  text: Na ikiwa mnyama yeyote kati ya wanyama wa kufugwa ambao mnaruhusiwa kuwala[a] akifa, mtu atakayegusa mzoga wake atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “walio kwa ajili yenu kuwa chakula.” Kirai cha Kiebrania kinatambulisha wanyama walioruhusiwa kuwa chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi cha w na maana ya sharti ya כי, huku ikiunganisha sheria hii na masharti yaliyotangulia.
- source_word: יָמוּת
  choice: akifa
  rationale: Kitenzi cha hali ya sharti kinatafsiriwa kwa kawaida kwa 'akifa' katika Kiswahili.
- source_word: מִן הַבְּהֵמָה
  choice: mnyama yeyote kati ya wanyama wanaofugwa
  rationale: מן ina maana ya sehemu ya kundi; tafsiri hii huonyesha mnyama mmoja kutoka katika kundi la בהמה, yaani wanyama wa kufugwa.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: ambao mnaruhusiwa kula
  rationale: Kirai kinatambulisha jamii ya wanyama wanaofaa au kuruhusiwa kuwa chakula; kauli hii ni ya asili katika Kiswahili bila kupoteza maana hiyo.
- source_word: הַנֹּגֵעַ
  choice: mtu atakayegusa
  rationale: Kivumishi-tendo kilichotumika kama nomino humaanisha mtu anayefanya tendo; muundo huu unaeleweka wazi katika sharti la kisheria.
- source_word: בְּנִבְלָתָהּ
  choice: mzoga wake
  rationale: נְבֵלָה ni mwili wa mnyama aliyekufa; 'mzoga' ni neno fupi na sahihi katika muktadha huu.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Hueleza hali ya unajisi wa kiibada inayotokana na kugusa mzoga, bila kuifanya kuwa uchafu wa kawaida tu.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Ni tafsiri ya kawaida na ya asili ya kipindi cha muda kinachotajwa katika kanuni hii.
theological_decisions:
- issue: Maana ya unajisi
  choice: atakuwa najisi
  alternative: atakuwa mchafu
  rationale: '''Najisi'' huhifadhi maana maalumu ya hali ya kiibada katika sheria ya Walawi na kuepuka kudokeza uchafu wa kimwili pekee.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida huku ukihifadhi lugha maalumu ya sheria za kiibada. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachoifafanua.
