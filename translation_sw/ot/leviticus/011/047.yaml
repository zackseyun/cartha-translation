  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: sw
  text: ili kutofautisha kati ya kilicho najisi na kilicho safi, na kati ya mnyama anayefaa kuliwa[a] na mnyama asiyefaa kuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnyama anayeliwa ... na mnyama ambaye haliwi.”
    reason: Msemo wa Kiebrania unaweza kutafsiriwa kwa karibu zaidi na umbo lake kama tendo linalofanyika, ingawa katika muktadha unaeleza kinachoruhusiwa au kisichoruhusiwa kuliwa.
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: ili kutofautisha
  rationale: Kitenzi-jina kinaonyesha kusudi la maagizo yaliyotangulia; “kutofautisha” linafaa kwa utambuzi wa kisheria kuliko wazo la kutenganisha kimahali.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na ...; na kati ya ... na ...
  rationale: Muundo huu unahifadhi jozi mbili za vitu vinavyolinganishwa huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: הַטָּמֵא ... הַטָּהֹר
  choice: kilicho najisi ... kilicho safi
  rationale: “Najisi” na “safi” ni istilahi zinazoeleweka kwa makundi ya kiibada na kisheria katika Mambo ya Walawi, bila kuyafanya yaonekane kuwa hukumu za uovu au wema wa kimaadili.
- source_word: הַחַיָּה
  choice: mnyama
  rationale: Katika muhtasari huu wa sheria za vyakula, “mnyama” ni neno la kawaida na pana vya kutosha kwa viumbe wanaozungumziwa, bila kulibana kuwa wanyama wa porini pekee.
- source_word: הַנֶּאֱכֶלֶת
  choice: anayefaa kuliwa
  rationale: Kauli hii inaeleza mnyama anayekubalika au kuruhusiwa kuwa chakula, si uwezo wa kimwili wa kumla tu.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: asiyefaa kuliwa
  rationale: Hii inatoa ulinganifu wa asili na “anayefaa kuliwa” na kuwasilisha katazo la chakula kwa Kiswahili cha sasa.
theological_decisions:
- issue: Istilahi za usafi wa kiibada katika sheria ya Walawi
  choice: najisi/safi
  alternative: chafu/takatifu au isiyo safi/safi
  rationale: “Najisi/safi” hudumisha makundi ya kiibada ya maandishi bila kudokeza kwamba mnyama mwenyewe ni mwovu kimaadili.
- issue: Maana ya kuruhusiwa katika הַנֶּאֱכֶלֶת na לֹא תֵאָכֵל
  choice: anayefaa kuliwa/asiyefaa kuliwa
  alternative: anayeliwa/ambaye haliwi
  rationale: Muktadha wa sheria za vyakula unaonyesha kufaa au kutofaa kisheria. Tanbihi inahifadhi uwezekano wa tafsiri iliyo karibu zaidi na umbo la kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa jozi mbili umehifadhiwa, na istilahi “najisi/safi” zimetumiwa katika maana yake ya kiibada na kisheria.
