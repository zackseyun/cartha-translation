base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: sw
  text: 'Waambieni wana wa Israeli[a] hivi: “Hawa ndio viumbe hai[b] mnaoweza kula miongoni mwa wanyama wote walio duniani[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Israeli” au “Waisraeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa umbo la maneno ni “Huyu ndiye kiumbe hai”; hapa umoja una maana ya kijumla ya aina za viumbe zitakazoainishwa.
    reason: lexical_alternative
  - marker: c
    text: Au “walio katika nchi kavu.” Usemi huu unawatofautisha wanyama wa duniani na makundi mengine yanayozungumziwa katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל
  choice: Waambieni
  rationale: Kitenzi cha wingi cha amri kinawaelekeza Musa na Aroni kuwasilisha maneno kwa Israeli. ‘Waambieni’ ni Kiswahili cha kawaida na chenye hadhi kinacholeta maana ya kusema kwa watu fulani bila muundo mzito wa ‘semeni na’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi picha ya kifamilia ya Kiebrania, yaani ‘wana wa Israeli,’ huku tanbihi ikionyesha maana ya kijumla.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Infinitivu hii hutanguliza maneno yaliyonukuliwa. Katika Kiswahili, ‘hivi:’ huunganisha amri na usemi wa moja kwa moja kwa njia ya asili kuliko ‘mkisema.’
- source_word: זֹאת הַחַיָּה
  choice: Hivi ndivyo viumbe hai
  rationale: Ingawa umbo la Kiebrania ni la umoja, nomino hiyo inatumika kwa maana ya kundi linaloainishwa. Wingi wa Kiswahili huwasilisha kwa kawaida orodha ya aina zinazofuata, huku tanbihi ikihifadhi umbo halisi la umoja.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: mnavyoweza kula
  rationale: Katika muktadha wa sheria za chakula, usemi huu unaonyesha kile kinachoruhusiwa kuliwa, si uwezo wa kimwili tu.
- source_word: מִכָּל הַבְּהֵמָה
  choice: miongoni mwa wanyama wote
  rationale: ‘Miongoni mwa’ huonyesha wazi maana ya kuchagua baadhi kutoka katika kundi zima; ‘wanyama’ ni pana na ya kawaida kwa בהמה katika muktadha huu.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: walio juu ya nchi
  rationale: Hufuata kwa karibu usemi wa mahali wa Kiebrania. Katika muktadha, unawatofautisha wanyama wa nchi kavu na viumbe wa majini wanaotajwa baadaye.
