translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usemi wa moja kwa moja umerahisishwa kwa ‘hivi:’; lugha ya kifamilia ‘wana wa Israeli’ imehifadhiwa. Wingi katika ‘viumbe hai’ unaonyesha maana ya kijumla ya nomino ya umoja bila kuficha umbo la Kiebrania, ambalo limeelezwa katika tanbihi.
