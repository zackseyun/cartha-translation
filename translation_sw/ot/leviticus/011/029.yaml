base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: sw
  text: 'Na hawa ndio walio najisi kwenu miongoni mwa viumbe watambaao wanaotambaa juu ya ardhi: panya-fuko[a], panya, na mjusi mkubwa kwa aina yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa חֹלֶד na צָב hauna uhakika; tafsiri za kimapokeo zinatia ndani “kicheche” au “fuko” kwa חֹלֶד, na “kobe” au, kwa ujumla, “mjusi” kwa צָב.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: Na hawa ndio
  rationale: Ingawa זֶה ni umoja kisarufi, hapa inatanguliza orodha ya viumbe kadhaa; wingi ni wa kawaida katika Kiswahili na unadumisha kazi yake ya kuonyesha wanaofuata.
- source_word: לָ/כֶם
  choice: kwenu
  rationale: Kiambishi ל hapa kinaonyesha uhusiano na waandikiwa, yaani viumbe hawa wanahesabiwa kuwa najisi kwa Waisraeli.
- source_word: הַ/טָּמֵא
  choice: walio najisi
  rationale: ‘Najisi’ ni istilahi iliyo wazi na iliyozoeleka kwa hali ya kutofaa kidesturi katika sheria za Walawi, bila kuifanya iwe uchafu wa kawaida tu.
- source_word: בַּ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: miongoni mwa viumbe vinavyotambaa
  rationale: שֶׁרֶץ na kitenzi cha mzizi huohuo hueleza viumbe vidogo vinavyosonga kwa kutambaa au kwa wingi. Kiswahili hiki ni cha asili na kinaonyesha uhusiano wa nomino na kitendo, ingawa hakirudii mzizi kwa namna isiyo ya kawaida.
- source_word: עַל הָ/אָרֶץ
  choice: juu ya ardhi
  rationale: Katika muktadha huu אָרֶץ ni uso wa nchi kavu au ardhi ambako viumbe hawa husonga; ‘ardhi’ huepuka maana ya kisiasa ya ‘nchi.’
- source_word: הַ/חֹלֶד
  choice: panya-fuko
  rationale: Utambulisho wa mnyama huyu hauna uhakika. ‘Panya-fuko’ ni uwezekano unaofaa kwa mnyama mdogo anayeishi ardhini, huku tafsiri nyingine zikihifadhiwa katika tanbihi.
- source_word: הָ/עַכְבָּר
  choice: panya
  rationale: עַכְבָּר kwa kawaida humaanisha panya, na huenda ikajumuisha jamii pana ya wanyama wadogo wa aina hiyo.
- source_word: הַ/צָּב
  choice: mjusi mkubwa
  rationale: Spishi kamili haijulikani; katika orodha hii mnyama wa aina ya mjusi anawezekana, na kivumishi ‘mkubwa’ kinawakilisha kwa tahadhari tafsiri ya reptilia mkubwa huku kutokuwa na uhakika kukitajwa katika tanbihi.
- source_word: לְ/מִינֵ/הוּ
  choice: kwa aina yake
  rationale: Hiki ni kirai cha uainishaji kinachoonyesha mnyama huyo pamoja na aina zake; tafsiri hii ni fupi, wazi, na inafuata maana ya מִין.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘viumbe vinavyotambaa’ badala ya msemo mgumu wa kulazimisha maana ya ‘kusongamana,’ na imehifadhi istilahi ya kiibada ‘najisi.’
