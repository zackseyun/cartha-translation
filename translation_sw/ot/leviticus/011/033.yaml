base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: sw
  text: Na chombo chochote cha udongo ambamo mnyama yeyote kati yao akianguka, kila kitu kilichomo kitakuwa najisi, nanyi mtakivunja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, chombo kilichotengenezwa kwa udongo wa mfinyanzi uliochomwa.
    reason: lexical_clarification
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: chombo cha udongo
  rationale: Neno כְּלִי humaanisha kifaa au chombo, na חֶרֶשׂ hubainisha kuwa kimetengenezwa kwa udongo wa mfinyanzi. ‘Chombo cha udongo’ ni usemi wa kawaida na unaoeleweka katika Kiswahili, huku ukihifadhi umuhimu wa nyenzo hiyo katika masharti ya unajisi.
- source_word: יִפֹּל מֵהֶם
  choice: mmoja wao ataangukia
  rationale: Kiwakilishi cha wingi kinarejelea viumbe waliotajwa katika muktadha uliotangulia. ‘Mmoja wao’ huonyesha wazi maana ya kwamba kiumbe yeyote kati yao akianguka ndani ya chombo, sharti hili linatumika.
- source_word: אֶל תּוֹכוֹ
  choice: ndani yake
  rationale: תּוֹךְ hurejelea sehemu ya ndani. Muundo ‘ataangukia ndani yake’ ni wa asili katika Kiswahili na unaonyesha kuingia ndani ya chombo.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: kila kitu kilicho ndani yake
  rationale: Tafsiri hii huhifadhi nguvu jumuishi ya כֹּל na kueleza kwa uwazi kwamba yaliyomo yote yanahusika.
- source_word: יִטְמָא
  choice: kitakuwa najisi
  rationale: Katika sheria za Walawi, ‘najisi’ ni istilahi ya kawaida ya hali ya kiibada inayopingana na kuwa safi. ‘Kitakuwa’ huonyesha hali inayotokana na tukio hilo.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: nawe utakivunja
  rationale: Kiwakilishi cha ngeli ya KI-VI kinarejelea chombo. ‘Utakivunja’ huhifadhi nguvu ya agizo la Kiebrania bila kuongeza maana kali zaidi kama ‘kukiponda.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Istilahi ‘najisi’ imetumiwa kwa uthabiti katika muktadha wa sheria za usafi wa kiibada.
