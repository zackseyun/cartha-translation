  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: sw
  text: 'Hata hivyo, msiwale hawa miongoni mwa wanyama wanaocheua au walio na kwato zilizogawanyika[a]: ngamia, kwa sababu anacheua lakini kwato zake hazijagawanyika; ni najisi kwenu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwato zilizopasuka.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “najisi kwenu,” yaani, amehesabiwa kuwa najisi kwa Waisraeli chini ya sheria hizi za vyakula.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Inaonyesha kizuizi au jambo linalotengwa na kanuni iliyotangulia, kwa lugha ya kawaida na yenye heshima.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: miongoni mwa wanyama wanaocheua
  rationale: Nahau ya Kiebrania ina maana halisi ya kurudisha chakula kinywani; ‘kucheua’ ndiyo istilahi ya kawaida na sahihi katika Kiswahili.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: au walio na kwato zilizogawanyika
  rationale: ‘Au’ huonyesha kwamba mifano inayofuata ni ya wanyama wenye sifa moja lakini wasiotimiza sifa zote mbili. Wingi ‘kwato’ ni wa kawaida zaidi katika Kiswahili huku ukihifadhi maana ya kishazi cha Kiebrania.
- source_word: הַגָּמָל
  choice: ngamia
  rationale: Ni jina la kawaida na la moja kwa moja la mnyama huyo katika Kiswahili.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: kwa sababu anacheua
  rationale: Inaeleza sifa moja ambayo ngamia anayo; upatanisho wa ngeli ya viumbe hai ni wa kawaida katika Kiswahili.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: lakini kwato zake hazijagawanyika
  rationale: ‘Lakini’ huweka wazi tofauti kati ya sifa aliyo nayo ngamia na sifa anayokosa, bila kuongeza ufafanuzi wa kimafundisho.
- source_word: טָמֵא הוּא לָכֶם
  choice: ni najisi kwenu
  rationale: ‘Najisi’ ni istilahi iliyozoeleka katika mazingira ya sheria za utakaso za Walawi. ‘Kwenu’ huhifadhi mtazamo wa kisheria na wa agano wa Kiebrania.
theological_decisions:
- issue: Asili ya unajisi katika sheria za vyakula za Walawi
  choice: najisi
  alternative: najisi kidesturi / najisi kiibada
  rationale: Neno kuu linabaki pana kama Kiebrania טָמֵא, badala ya kulifinyanga katika matini kuwa unajisi wa ‘kiibada’ au ‘kidesturi’ pekee. Tanbihi inaeleza muktadha bila kutatua kimyakimya mvutano wa istilahi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mantiki ya Kiebrania lakini unaepuka tafsiri ngumu ya neno kwa neno. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
