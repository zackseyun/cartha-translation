  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כֹּ֣ל מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ פְּרָסֹ֔ת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: sw
  text: Mnaweza kula mnyama yeyote mwenye kwato zilizogawanyika sehemu mbili kabisa[a] na ambaye hucheua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “anayegawanya ukwato na kupasua mpasuko wa kwato.” Kiebrania kinatumia misemo miwili inayohusiana kusisitiza kuwa ukwato umegawanyika kweli.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hupandisha chakula kilichocheuliwa”; yaani, hucheua.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: yeyote
  rationale: Neno hili limetumiwa kwa maana ya kila mmoja katika kundi linalotajwa; “mnyama yeyote” ni usemi wa kawaida wa Kiswahili unaofaa katika sheria ya ruhusa.
- source_word: מַפְרֶסֶת פַּרְסָה וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: mwenye kwato zilizogawanyika sehemu mbili kabisa
  rationale: Misemo miwili ya Kiebrania inayohusiana inaeleza na kusisitiza kuwa kwato zimepasuka kweli kuwa sehemu mbili. Tafsiri hii inaweka sifa hiyo wazi bila kurudia maneno kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: מַעֲלַת גֵּרָה
  choice: ambaye hucheua
  rationale: Kiebrania kinasema kihalisi ‘hupandisha chakula kilichocheuliwa.’ “Hucheua” ndilo neno la kawaida na sahihi la Kiswahili kwa tabia hiyo ya mnyama.
- source_word: בַּבְּהֵמָה
  choice: mnyama
  rationale: Katika muktadha huu neno linahusu jamii ya wanyama wa nchi kavu. “Mnyama” ni pana na ya kawaida; “mifugo” ingepunguza maana kupita kiasi.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: Mnaweza kula
  rationale: Katika sheria hii kauli inaonyesha ruhusa ya kula, si amri inayowalazimisha watu wale kila mnyama wa aina hiyo.
