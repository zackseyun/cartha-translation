  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: sw
  text: Msijitie uchukizo kwa kiumbe chochote chenye kutambaa[a]. Wala msijitie unajisi kwa viumbe hivyo, msije mkawa najisi kwa viumbe hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kiumbe chochote kitambaacho.” Neno la Kiebrania linarejelea aina pana ya viumbe wadogo wanaotambaa au kusongamana kwa wingi; kwa hiyo halimaanishi kutambaa tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: msijifanye kuwa chukizo
  rationale: Kauli hii hudumisha maana ya kujifanya wenye kuchukiza au chukizo, bila kuichanganya na istilahi ya unajisi inayotumiwa baadaye katika mstari.
- source_word: נַפְשֹׁתֵיכֶם
  choice: msijifanye
  rationale: Katika muundo huu נֶפֶשׁ humaanisha nafsi nzima au mtu mwenyewe; Kiswahili cha kawaida hutumia kiwakilishi cha kujirejelea badala ya tafsiri finyu ya ‘roho zenu.’
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: kwa kiumbe chochote kitambaacho kinachotambaa
  rationale: Tafsiri hii inahifadhi aina pana ya viumbe vidogo inayozungumziwa na pia marudio ya mzizi שׁרץ, ingawa ‘kutambaa’ haiwasilishi kikamilifu wazo la kusongamana au kuwa kwa wingi.
- source_word: תִטַּמְּאוּ
  choice: msijitie unajisi
  rationale: Muundo wa kujirejelea unaonyesha kujifanya najisi; ‘jitie unajisi’ ni Kiswahili cha asili na hutofautisha tendo hilo na hali inayofuata.
- source_word: בָּהֶם / בָּם
  choice: kwa viumbe hivyo / kwa hivyo
  rationale: Kihusishi kinaonyesha njia au kisababishi cha kupata unajisi; kurudiwa kwake kumehifadhiwa kwa msisitizo.
- source_word: וְנִטְמֵתֶם
  choice: msije mkawa najisi
  rationale: Baada ya makatazo, muundo huu unaeleweka kiasili kama onyo la matokeo yanayopaswa kuepukwa, huku ukidumisha tofauti kati ya kujitia unajisi na kuwa katika hali ya unajisi.
theological_decisions:
- issue: Istilahi ya טמא katika sheria za utakatifu
  choice: unajisi / najisi
  alternative: uchafu / kutiwa uchafu
  rationale: ‘Unajisi’ na ‘najisi’ ni istilahi wazi na zilizozoeleka kwa hali ya kutokuwa safi kiibada katika Walawi; hazilazimishi maana ya hatia ya kimaadili ambayo mstari wenyewe hauisemi.
- issue: Uhusiano wa kishazi cha mwisho na makatazo
  choice: msije mkawa najisi
  alternative: nanyi mkawa najisi
  rationale: Kiswahili hiki kinaonyesha matokeo ya kuonywa baada ya makatazo bila kudai kwamba unajisi ndio kusudi la tendo; hata hivyo, uwezekano wa kukisoma kama uratibu wa matokeo unatambuliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya Kiebrania yamedumishwa kwa kiasi kinachowezekana, na istilahi ‘unajisi/najisi’ imetumiwa kwa uthabiti.
