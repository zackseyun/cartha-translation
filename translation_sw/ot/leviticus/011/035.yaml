source:
  edition: WLC
  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: sw
  text: Kila kitu ambacho mzoga wao utaangukia kitakuwa najisi.[a] Tanuru au jiko la kupikia lazima vibomolewe; vitu hivyo ni najisi, na vitakuwa najisi kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mizoga yao” au “mwili wao uliokufa.” Kiebrania hutumia umoja wenye kiambishi cha wingi, likirejelea mzoga wa wanyama hao najisi katika muktadha wa sheria za unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִּבְלָתָם
  choice: mizoga yao
  rationale: Neno נְבֵלָה humaanisha mzoga wa mnyama aliyekufa, hasa katika muktadha wa sheria za unajisi. Wingi wa Kiswahili unaendana kwa kawaida na kiambishi cha nafsi ya tatu wingi katika Kiebrania.
- source_word: יִפֹּל
  choice: itaangukia
  rationale: Kauli isiyotimilika hapa inaeleza hali ya jumla katika sheria. Kitenzi chenye kiishio -ia kinaonyesha kwa kawaida kwamba sehemu ya mzoga inaanguka juu ya kitu.
- source_word: עָלָיו יִטְמָא
  choice: ambacho ... itaangukia kitakuwa najisi
  rationale: Kauli inaonyesha kwamba kitu kinakuwa najisi baada ya kuguswa na sehemu ya mzoga; 'kitakuwa najisi' ni ya kawaida na inaweka wazi hali inayotokea.
- source_word: תַּנּוּר
  choice: tanuru
  rationale: Neno hili humaanisha tanuru la kuokea. 'Tanuru' ni neno la Kiswahili linalofaa kwa kifaa hicho cha kale bila kukifanya kuwa oveni ya kisasa.
- source_word: כִירַיִם
  choice: jiko la kupikia
  rationale: Neno hili linataja kifaa au sehemu ya kupikia, huenda jiko, mahali pa kuweka vyungu, au mahali pa kuwashia moto. Tafsiri hii ni wazi bila kubainisha kupita kiasi muundo wake.
- source_word: יֻתָּץ
  choice: lazima libomolewe
  rationale: Kauli tendwa inaonyesha amri ya kuharibu kifaa kilichotiwa unajisi. 'Lazima libomolewe' huwasilisha wajibu wa kisheria kwa Kiswahili cha kawaida.
- source_word: טְמֵאִים הֵם
  choice: vyombo hivyo ni najisi
  rationale: Kivumishi hiki kinaonyesha unajisi wa kiibada. 'Najisi' ni istilahi ya kawaida ya kibiblia; kirai 'vyombo hivyo' hufanya rejeo la wingi lieleweke katika Kiswahili.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: navyo vitakuwa najisi kwenu
  rationale: '''Kwenu'' huhifadhi uhusiano unaoonyeshwa na לָכֶם: Waisraeli wanapaswa kuvichukulia vitu hivyo kuwa najisi.'
theological_decisions:
- issue: Maana ya lugha ya unajisi katika sheria ya Walawi
  choice: Kutafsiri טמא/טמאים kuwa 'najisi' katika maandishi makuu
  alternative: '''najisi kiibada'' au ''najisi kwa mujibu wa ibada'''
  rationale: Muktadha unahusu unajisi wa kiibada, si uovu wa kimaadili. Hata hivyo, 'najisi' ni istilahi ya kibiblia iliyozoeleka na inadumisha uthabiti wa msamiati bila kuongeza ufafanuzi katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sheria umehifadhiwa kwa 'lazima,' na istilahi kuu 'najisi' imetumiwa kwa uthabiti.
