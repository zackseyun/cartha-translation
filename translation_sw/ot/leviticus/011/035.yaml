  to: Kila kitu ambacho mzoga wao utaangukia kitakuwa najisi.[a] Tanuru au jiko la kupikia lazima vibomolewe; vitu hivyo ni najisi, na vitakuwa najisi kwenu.
  rationale: Marekebisho yanaondoa nyongeza isiyomo katika chanzo ('sehemu ya'), yanarekebisha upatanisho wa kisarufi kwa tanuru na jiko, na kuacha istilahi ya kibiblia 'najisi' bila kuingiza tafsiri ya kimafundisho. Tanbihi a imefanywa kuwa mbadala wa kweli wa msamiati. Tanbihi b imehifadhiwa kama maelezo ya kitamaduni, lakini haijawekewa alama katika maandishi kwa sababu hakuna dai la tafsiri linalohitaji kuonyeshwa kwa alama hiyo.
