base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: sw
  text: Hawa ndio walio najisi kwenu miongoni mwa viumbe vyote vitambaavyo[a]. Yeyote atakayewagusa wakiwa wamekufa[b] atakuwa najisi mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa viumbe vyote vinavyosongamana.” Neno la Kiebrania linahusu kwa upana viumbe vidogo vinavyotambaa, kusongamana, au kuzagaa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika kufa kwao”; maana yake ni kuwagusa wakiwa katika hali ya kuwa wamekufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa
  rationale: Kiashiria hiki cha wingi kinarejelea viumbe hai waliotajwa katika orodha iliyotangulia; “Hawa” ni cha kawaida na cha kueleweka katika Kiswahili.
- source_word: הַטְּמֵאִים
  choice: walio najisi
  rationale: “Najisi” ni istilahi iliyo wazi na iliyozoeleka kwa hali ya kutokuwa safi kidesturi katika muktadha wa Walawi.
- source_word: לָכֶם
  choice: kwenu
  rationale: Inaonyesha jinsi viumbe hao wanavyohesabiwa kwa Waisraeli chini ya masharti ya usafi wa agano.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: miongoni mwa viumbe vyote vitambaavyo
  rationale: Neno שֶׁרֶץ linahusu kwa upana viumbe vidogo vinavyotambaa, kusongamana, au kuzagaa; “viumbe” huepuka kulibana kuwa kundi maalumu la wanyama.
- source_word: כָּל הַנֹּגֵעַ
  choice: Yeyote atakayewagusa
  rationale: Huhifadhi maana ya jumla inayomhusu kila mtu anayewagusa.
- source_word: בָּהֶם
  choice: -wagusa
  rationale: Kiambishi cha yambwa kinarejelea viumbe waliotajwa bila kurudia nomino.
- source_word: בְּמֹתָם
  choice: wakiwa wamekufa
  rationale: Huonyesha kwamba mguso unatokea viumbe hao wakiwa katika hali ya kufa, si lazima wakati uleule wanapokufa.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Huonyesha hali ya unajisi inayotokana na mguso huku ikidumisha mtindo wa sheria.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweka kikomo cha muda wa unajisi.
