base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: sw
  text: Hata hivyo, chemchemi au birika lenye maji yaliyokusanyika[a] litakuwa safi; lakini yeyote atakayegusa mzoga wao atakuwa najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkusanyiko wa maji” au “dimbwi la maji.” Maneno ya Kiebrania מִקְוֵה מַיִם hurejelea maji yaliyokusanyika pamoja katika chemchemi au birika.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Inaonyesha hali ya pekee inayotofautiana na sheria ya unajisi katika mstari uliotangulia, bila kuipa maana finyu ya “tu”.
- source_word: מַעְיָן
  choice: chemchemi
  rationale: Ni neno la kawaida na sahihi kwa chanzo cha asili cha maji.
- source_word: בּוֹר
  choice: birika
  rationale: Katika muktadha huu ni chombo au shimo lililotengenezwa kwa kukusanya maji; “birika” linaeleweka vizuri kuliko “shimo” na halidokezi lazima kisima chenye chanzo chake cha maji.
- source_word: מִקְוֵה מַיִם
  choice: linalokusanya maji
  rationale: Linaeleza maji yaliyokusanyika katika chemchemi au birika kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo halisi zaidi.
- source_word: יִהְיֶה טָהוֹר
  choice: litaendelea kuwa safi
  rationale: Muktadha unaonyesha kuwa chanzo hicho cha maji hakifanywi najisi na mzoga uliotajwa; “litaendelea kuwa safi” huweka wazi mwendelezo unaodokezwa.
- source_word: נֹגֵעַ
  choice: yeyote atakayegusa
  rationale: Kivumishi-tendo hiki kinatumika kama nomino ya jumla; kauli hii ni ya kawaida na inaeleweka kwa urahisi.
- source_word: נִבְלָתָם
  choice: mzoga wao
  rationale: Inahifadhi umoja wa pamoja wa נְבֵלָה pamoja na kiambishi cha wingi kinachorejelea viumbe waliotangulia kutajwa.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Ni lugha ya kawaida ya hali ya unajisi wa kiibada katika Mambo ya Walawi.
theological_decisions:
- issue: Istilahi ya usafi wa kiibada
  choice: safi / najisi
  alternative: takatifu / chafu
  rationale: “Safi / najisi” hutofautisha hali ya kiibada na hukumu ya kimaadili; “takatifu / chafu” ingeweza kuleta maana isiyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inatumia msamiati unaoeleweka kwa wasomaji wa kawaida huku ikidumisha istilahi ya kiibada ya Mambo ya Walawi.
