  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: sw
  text: Kila mdudu mwenye mabawa anayetembea kwa miguu minne ni chukizo kwenu[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila kiumbe kidogo kinachoruka.” Neno la Kiebrania עוֹף linaweza kumaanisha viumbe warukao kwa maana pana, wala si ndege pekee.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “anayeenda juu ya minne”; usemi huu unahusu kusonga kwa miguu minne, ingawa mistari inayofuata hutaja isipokuwa kwa wadudu fulani wenye miguu ya kurukia.'
    reason: cultural_note
  - marker: c
    text: Au, “ni kitu cha kuchukiza kwenu.” Neno hili hapa linaonyesha chukizo la kiibada katika sheria za chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Kila
  rationale: 'Hutoa maana ya mgawanyo ya sheria: kila kiumbe katika kundi hili kinahusika.'
- source_word: שֶׁרֶץ
  choice: kiumbe kitambaacho
  rationale: Neno hili hutaja viumbe vidogo vinavyotambaa au kusongamana; katika muktadha huu tafsiri hii ni ya kawaida na haifungi maana kwa aina moja tu ya wadudu.
- source_word: הָעוֹף
  choice: chenye mabawa
  rationale: עוֹף hapa inaweza kujumuisha viumbe vinavyoruka kwa upana, si ndege pekee; usemi huu huepuka kuwafanya wasomaji wafikirie ndege tu.
- source_word: הַהֹלֵךְ
  choice: kinachoenda
  rationale: Kitenzi kinaeleza namna ya kawaida ya kusonga; “kinachoenda” huhifadhi upana wake bila kudai kwamba mwendo huo ni kutembea tu.
- source_word: עַל אַרְבַּע
  choice: kwa miguu minne
  rationale: Huwasilisha kwa uwazi usemi wa Kiebrania “juu ya minne” kama mwendo unaotumia miguu minne, huku mistari inayofuata ikitoa ufafanuzi kuhusu miguu ya kurukia.
- source_word: שֶׁקֶץ
  choice: chukizo
  rationale: Katika sheria za chakula neno hili huonyesha kitu kinachopaswa kuchukiwa na kuepukwa kiibada; “chukizo” huhifadhi uzito wake bila kulisawazisha tu na neno la jumla “najisi.”
- source_word: לָכֶם
  choice: kwenu
  rationale: 'Huonyesha uhusiano wa kisheria: viumbe hivi vinapaswa kuonwa kuwa chukizo na watu wanaoambiwa.'
theological_decisions:
- issue: Maana ya שֶׁקֶץ katika sheria za chakula
  choice: chukizo
  alternative: kitu cha kuchukiza / najisi
  rationale: “Chukizo” huhifadhi nguvu ya istilahi na muktadha wake wa kiibada; “najisi” ingefuta tofauti kati ya שֶׁקֶץ na istilahi pana ya unajisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umebaki karibu na uainishaji wa kisheria wa Kiebrania; “chenye mabawa” huepuka tafsiri finyu ya “ndege,” na “kwa miguu minne” huhifadhi taswira ya chanzo.
