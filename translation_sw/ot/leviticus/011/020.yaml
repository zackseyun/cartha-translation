  source_fidelity: 'Tafsiri kuu huhifadhi kwa usahihi uainishaji wa Kiebrania: viumbe wenye mabawa wanaosonga kwa miguu minne wanatajwa kuwa שֶׁקֶץ kwa wale wanaopewa sheria. Hata hivyo, “kitambaacho” huelekea kumaanisha kutambaa, ilhali שֶׁרֶץ hasa huonyesha viumbe wadogo wanaosongamana/kuenea; katika muktadha huu “mdudu” ni istilahi ya kawaida na sahihi zaidi kwa viumbe wenye mabawa wanaokusudiwa.'
