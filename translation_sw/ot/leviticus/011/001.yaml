lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi hiki kinaanzisha tukio jipya katika simulizi. “Akasema” ni Kiswahili cha kawaida na chenye heshima kinachofaa katika utangulizi huu wa maneno ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo kama “BWANA,” ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: na Musa na Haruni
  rationale: Baada ya kitenzi “akasema,” kihusishi “na” huonyesha kwa kawaida watu walioelekezewa maneno katika Kiswahili, huku kiunganishi cha pili kikihifadhi kwamba Musa na Haruni wote ni wapokeaji.
- source_word: לֵאמֹר אֲלֵהֶם
  choice: akiwaambia
  rationale: “Akiwaambia” linaunganisha kwa Kiswahili cha asili ishara ya kuanzisha maneno yanayofuata na kiwakilishi kinachoonyesha wazi kwamba maneno hayo yanaelekezwa kwa Musa na Haruni wote.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi. “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akiwaambia” huepuka uradidi usio wa kawaida lakini huhifadhi kwamba usemi unaofuata uliwaelekea Musa na Haruni wote.
