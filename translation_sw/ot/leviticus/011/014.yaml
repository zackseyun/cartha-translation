  text: na mwewe[a], na kipanga kwa aina yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa ndege hawa hauna uhakika; vinginevyo, wa kwanza anaweza kuitwa “tai mla mizoga,” na wa pili “mwewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּאָה
  choice: mwewe
  rationale: Jina hili la ndege halitambuliki kwa uhakika, lakini linaelekea kumaanisha ndege mla nyama wa jamii ya mwewe. “Mwewe” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa; uwezekano mwingine umewekwa katika tanbihi.
- source_word: הָאַיָּה
  choice: kipanga
  rationale: Neno hili humaanisha ndege mla nyama, ambaye anaweza kutambuliwa kama kipanga au mwewe. “Kipanga” linatofautisha majina haya mawili ya Kiebrania bila kuficha kutokuwa na uhakika kwa utambulisho wake.
- source_word: לְמִינָהּ
  choice: kwa aina yake
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana ya uainishaji ya kirai cha Kiebrania.
- source_word: וְאֶת ... וְאֶת
  choice: na ... na ...
  rationale: Kiunganishi cha Kiebrania kimetafsiriwa kwa “na,” huku kiashiria cha yambwa אֵת kisitafsiriwe moja kwa moja kwa sababu hakina kisawe cha lazima katika Kiswahili.
