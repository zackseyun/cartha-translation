base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: sw
  text: '“Na hawa mtawahesabu kuwa chukizo miongoni mwa ndege; hawapaswi kuliwa; ni chukizo: tai[a], tumbusi mwenye ndevu[b], na tumbusi mweusi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Majina ya ndege katika orodha hii ya Kiebrania hayawezi kutambuliwa kwa uhakika kila mara. Neno lililotafsiriwa “tai” huenda lilimaanisha kwa upana zaidi ndege mkubwa wa kuwinda, au hata aina ya tumbusi.
    reason: lexical_alternative
  - marker: b
    text: Utambulisho wa ndege huyu hauna hakika. Huenda alikuwa lammergeier, yaani tumbusi mwenye ndevu; tafsiri nyingine hutumia jina la jumla “tumbusi.”
    reason: lexical_alternative
  - marker: c
    text: Utambulisho wa ndege huyu hauna hakika. Tafsiri nyingine zina “kipungu” au aina fulani ya tai au tumbusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: mtakaowaona kuwa wa kuchukiza
  rationale: Kauli hii ya Piel inaonyesha kuwahesabu au kuwatendea viumbe hawa kuwa chukizo, si hisia ya kuchukia tu. Tafsiri hii pia inadumisha uhusiano na שֶׁקֶץ inayofuata.
- source_word: מִן הָעוֹף
  choice: miongoni mwa ndege
  rationale: מִן ina maana ya sehemu ya kundi, nayo עוֹף katika muktadha huu inatafsiriwa kwa njia ya kawaida na ya kueleweka kuwa ‘ndege.’
- source_word: לֹא יֵאָכְלוּ
  choice: hawapaswi kuliwa
  rationale: Kauli tendwa ya Kiebrania inatoa katazo la kisheria. ‘Hawapaswi kuliwa’ ni Kiswahili cha sasa, wazi, na chenye uzito wa katazo.
- source_word: שֶׁקֶץ
  choice: wa kuchukiza
  rationale: Neno linaonyesha kitu kinachohesabiwa kuwa chukizo katika masharti ya chakula. ‘Wa kuchukiza’ huhifadhi uzito huo bila kulifanya liwe sawa tu na ‘najisi.’
- source_word: הַנֶּשֶׁר
  choice: tai
  rationale: ‘Tai’ ndiyo tafsiri ya jadi na inayowezekana ya נֶשֶׁר, ingawa neno la Kiebrania huenda lilihusu kwa upana zaidi ndege mkubwa wa kuwinda au tumbusi; kutokuwa na uhakika kunaelezwa katika tanbihi.
- source_word: הַפֶּרֶס
  choice: tumbusi mwenye ndevu
  rationale: פֶּרֶס hutambulishwa mara nyingi kuwa lammergeier, yaani bearded vulture. Jina hili la maelezo linaeleweka kwa msomaji wa Kiswahili, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: הָעָזְנִיָּה
  choice: tumbusi mweusi
  rationale: Utambulisho kamili wa ndege huyu hauna hakika. ‘Tumbusi mweusi’ hufuata pendekezo la kawaida la kisasa, na mbadala muhimu zinatajwa katika tanbihi.
theological_decisions:
- issue: Maana ya שֶׁקֶץ katika sheria ya vyakula
  choice: wa kuchukiza
  alternative: najisi
  rationale: Kiebrania hapa kina nguvu ya chukizo au mwiko, si tamko la kawaida la unajisi pekee. Tafsiri iliyochaguliwa inaacha tofauti hiyo ionekane bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umehifadhiwa bila kuwa wa kizamani. Majina ya ndege yametolewa kwa namna inayoeleweka, huku kutokuwa na uhakika wa kizoolojia katika Kiebrania kukihifadhiwa kwa tanbihi.
