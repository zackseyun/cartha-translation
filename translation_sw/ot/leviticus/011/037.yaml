base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: sw
  text: Na ikiwa sehemu yoyote ya mzoga wao[a] itaanguka juu ya mbegu yoyote iliyokusudiwa kupandwa, mbegu hiyo ni safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mzoga wowote wa wanyama hao.” Usemi wa Kiebrania מִנִּבְלָתָם unaweza kueleweka kuwa sehemu yoyote ya mzoga wao au mzoga wowote kati ya mizoga ya wanyama hao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Inaendeleza masharti ya kisheria yaliyotangulia huku ikitambulisha hali ya uwezekano.
- source_word: יִפֹּל
  choice: itaanguka
  rationale: Wakati ujao wa Kiswahili unaeleza kwa kawaida tukio linalowezekana katika sharti la kisheria.
- source_word: מִנִּבְלָתָם
  choice: sehemu yoyote ya mzoga wao
  rationale: מִן ina maana ya kutoka au sehemu ya kitu, na נְבֵלָה ni mzoga. Tafsiri hii inawakilisha usomaji wa kisehemu, huku tanbihi ikihifadhi uwezekano wa kuelewa usemi huo kwa maana ya mzoga mmoja kati ya mizoga yao.
- source_word: עַל
  choice: juu ya
  rationale: Ni tafsiri ya kawaida na ya asili ya kihusishi cha mahali hapa.
- source_word: כָּל
  choice: yoyote
  rationale: Katika sharti hili la kisheria, neno hili lina nguvu ya kugawa na kwa Kiswahili linaeleweka kwa kawaida kama “yoyote.”
- source_word: זֶרַע זֵרוּעַ
  choice: mbegu yoyote iliyokusudiwa kupandwa
  rationale: Usemi huo unataja mbegu ya kupandwa; “iliyokusudiwa” huwasilisha kusudi hilo bila marudio yasiyo ya kawaida katika Kiswahili.
- source_word: אֲשֶׁר יִזָּרֵעַ
  choice: iliyokusudiwa kupandwa
  rationale: Kishazi hiki kinaelekeza mbele kwa mbegu itakayopandwa, si mbegu ambayo tayari imepandwa.
- source_word: טָהוֹר הוּא
  choice: mbegu hiyo ni safi
  rationale: Kiwakilishi kimetajwa wazi kwa Kiswahili ili kuepusha utata kuhusu kinachoitwa safi; “safi” linafaa katika sheria za hali ya kiibada.
theological_decisions:
- issue: Maana ya טָהוֹר katika sheria za Walawi
  choice: safi
  alternative: takatifu / isiyo na uchafu wa kawaida
  rationale: Neno linahusu hadhi ya usafi kulingana na sheria za kiibada, si lazima hali ya kimwili wala utakatifu wa kimaadili. “Safi” huhifadhi tofauti hiyo bila kuongeza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa sharti la kisheria, na “mbegu hiyo” hurudia nomino kwa uwazi wa rejeleo.
