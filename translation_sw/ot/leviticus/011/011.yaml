  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: sw
  text: Nao watakuwa chukizo[a] kwenu; msile nyama yao yoyote, na mizoga yao mtazihesabu kuwa chukizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kitu cha kuchukiza; neno la Kiebrania linaonyesha kitu kinachokataliwa na kuchukiza katika muktadha huu wa sheria za vyakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: chukizo
  rationale: Nomino hii huonyesha kitu kinachochukiza au kukataliwa katika muktadha wa kanuni za vyakula. “Chukizo” huhifadhi nguvu ya neno bila kulichanganya na istilahi nyingine za Kiebrania zinazomaanisha unajisi.
- source_word: יִהְיוּ לָכֶם
  choice: watakuwa ... kwenu
  rationale: Muundo huu unahifadhi kitenzi cha kuwako pamoja na kiambishi cha kuelekeza kwa Waisraeli jinsi walivyopaswa kuwaona viumbe hao.
- source_word: מִבְּשָׂרָם
  choice: nyama yao yoyote
  rationale: 'Baada ya kitenzi kilichokanushwa, kihusishi מִן kina maana ya sehemu: hawakupaswa kula sehemu yoyote ya nyama yao.'
- source_word: לֹא תֹאכֵלוּ
  choice: msile
  rationale: Amri hasi ya Kiswahili ni ya kawaida na ya moja kwa moja, na inawasilisha nguvu ya kisheria ya kifungu hiki.
- source_word: נִבְלָתָם
  choice: mizoga yao
  rationale: “Mizoga” ni neno mahususi na la kawaida kwa miili ya wanyama waliokufa.
- source_word: תְּשַׁקֵּצוּ
  choice: mtaiona kuwa chukizo
  rationale: Tafsiri hii inadumisha maana ya kuitambua au kuihesabu kuwa ya kuchukiza, wala haifanyi neno hilo lieleweke kama hisia binafsi tu. Pia inaakisi nomino שֶׁקֶץ iliyotangulia.
theological_decisions:
- issue: Asili ya lugha ya kuchukiza katika sheria za vyakula
  choice: Kutumia “chukizo” kwa maana ya kitu kinachokataliwa katika mpangilio wa sheria za vyakula.
  alternative: Kutumia “najisi” au neno lenye maana ya uovu wa kimaadili.
  rationale: Kifungu hiki kinahusu mipaka ya vyakula katika agano. “Chukizo” huhifadhi tathmini yake kali bila kuingiza dai pana la uovu wa kimaadili, na “najisi” lingechanganya שֶׁקֶץ na istilahi tofauti za Kiebrania za unajisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Kiunganishi “Nao” na nukta mkato vinadumisha uhusiano wa aya hii na iliyotangulia; urudiaji wa “chukizo” unaakisi urudiaji wa mzizi wa Kiebrania.
