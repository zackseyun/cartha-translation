  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: sw
  text: Chakula chochote kinachoweza kuliwa[a], maji yakikifikia, kitakuwa najisi; na kinywaji chochote kinachoweza kunywewa katika chombo chochote kitakuwa najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa neno kwa neno zaidi, “kila chakula kinacholiwa, ambacho maji huja juu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: Chakula chochote
  rationale: Muundo huu unaonyesha kundi la jumla la chakula kwa Kiswahili cha kawaida na unafaa katika sheria hii.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: kinachoweza kuliwa
  rationale: Kauli hii inahifadhi maana ya chakula kinachofaa au kinachokusudiwa kuliwa, bila kuibana kuwa tukio moja la kula.
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: maji yakikifikia
  rationale: Hii inaonyesha sharti la maji kukifikia chakula bila kuongeza kwamba mtu aliyamwaga au kueleza kwa namna gani yalifika.
- source_word: יִטְמָא
  choice: kitakuwa najisi
  rationale: Katika muktadha wa Walawi, kitenzi hiki kinaonyesha kuingia katika hali ya unajisi wa kiibada; 'kitakuwa najisi' ni wazi na cha kawaida katika Kiswahili cha Biblia.
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: kinywaji chochote kinachoweza kunywewa
  rationale: Tafsiri hii inahifadhi wazo la kitu kinachofaa au kinachokusudiwa kunywewa.
- source_word: בְּכָל כְּלִי
  choice: kilicho katika chombo chochote
  rationale: '''Chombo'' ni neno pana na la asili kwa kitu cha kuhifadhia; ''chochote'' linaonyesha nguvu ya ugawaji ya כָּל.'
theological_decisions:
- issue: Maana ya טמא katika sheria ya vyakula
  choice: najisi
  alternative: kichafu
  rationale: '''Najisi'' hutofautisha hali ya kiibada inayozungumziwa hapa na uchafu wa kawaida wa kimwili, bila kuongeza fundisho la dhehebu.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ya masharti 'maji yakikifikia' imetumiwa ili kuwa ya asili kwa Kiswahili huku ikihifadhi uhusiano wa Kiebrania bila kutaja chanzo au namna ya maji kufika.
