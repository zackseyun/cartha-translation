base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: sw
  text: Kisha Musa akachukua mafuta ya upako, akapaka mafuta hema la kukutania na kila kitu kilichokuwa ndani yake, na akaviweka wakfu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akavifanya vitakatifu” au “akavitakasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha Musa akachukua
  rationale: Muundo wa wayyiqtol unaendeleza mfululizo wa simulizi; “Kisha” unaonyesha hatua inayofuata kwa Kiswahili cha kawaida, huku “akachukua” ikihifadhi maana ya kitenzi.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Hili ni fungu la kiunganishi linalomaanisha mafuta yaliyotumiwa kwa kupaka katika ibada. “Mafuta ya upako” ni usemi wa kawaida na haiongezi wazo la “matakatifu,” ambalo halijasemwa wazi hapa.
- source_word: וַיִּמְשַׁח
  choice: akaipaka
  rationale: Katika muktadha huu kitenzi kinamaanisha kutumia mafuta kwa kitu ili kukiweka wakfu. Kwa kuwa yambwa ni hema na vitu vyake, “kupaka” ni ya asili zaidi kuliko “kutia mafuta” au kutumia “kupaka mafuta” mara baada ya kutaja mafuta.
- source_word: הַמִּשְׁכָּן
  choice: hema la kukutania
  rationale: Ni istilahi ya Kiswahili inayoeleweka kwa jengo la ibada linalohamishika katika Kutoka–Mambo ya Walawi, na ni mahususi zaidi kuliko “makao” peke yake.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: kila kitu kilichokuwa ndani yake
  rationale: Usemi huu unahusu kwa ujumla vyombo na vitu vyote vilivyokuwa ndani ya hema; tafsiri hii ni wazi na ya asili.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: na akavitakasa
  rationale: קדשׁ katika muktadha wa ibada humaanisha kuvitenga vitu viwe vitakatifu. “Akavitakasa” huhifadhi istilahi ya msingi ya utakatifu, na kiambishi cha ngeli “vi-” kinarejelea hema pamoja na vitu vyake kama vitu vilivyotakaswa.
theological_decisions:
- issue: Maana ya קדשׁ katika ibada ya ukuhani
  choice: akavitakasa
  alternative: akaviweka wakfu; akavifanya kuwa vitakatifu
  rationale: Mstari unaeleza kutengwa kwa hema na vyombo vyake kwa matumizi matakatifu. “Akavitakasa” hudumisha uhusiano wa moja kwa moja na wazo la utakatifu bila kuingiza maana ya kimadhehebu; tanbihi inaonyesha njia nyingine halali za kueleza nguvu ya kiibada ya neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya “aka-” unafaa simulizi, na istilahi za ibada zimehifadhiwa bila kuwa nzito kupita kiasi.
