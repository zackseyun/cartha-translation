  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: sw
  text: Naye akamchinja. Musa akachukua damu, akaitia kwa kidole chake kwenye pembe za madhabahu pande zote, akaitakasa madhabahu.[a] Akaimimina damu kwenye msingi wa madhabahu na kuiweka wakfu ili kuifanyia upatanisho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaisafisha madhabahu kiibada.” Kitenzi cha Kiebrania hapa kinamaanisha kuitakasa kutokana na unajisi, si kuifanya itende dhambi.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili kuiondolea unajisi kwa ibada.” Kitenzi cha Kiebrania kina maana ya upatanisho au utakaso unaofanywa kwa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: akamchinja
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuchinja mnyama kwa ibada, si kuua kwa ujumla. Mtendwa anaeleweka kutokana na muktadha wa mstari uliotangulia.
- source_word: הַדָּם
  choice: damu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya neno la Kiebrania, ikidumishwa katika sehemu zote mbili za mstari.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: pembe za madhabahu
  rationale: Ni istilahi sahihi na inayoeleweka kwa vile vinavyojitokeza kama pembe kwenye madhabahu.
- source_word: סָבִיב
  choice: pande zote
  rationale: Inaonyesha kuwa damu iliwekwa kwenye pembe zilizokuwa kuizunguka madhabahu, kwa lugha ya kawaida ya Kiswahili.
- source_word: בְּאֶצְבָּעוֹ
  choice: kwa kidole chake
  rationale: Huhifadhi umoja wa neno la Kiebrania na maana yake ya chombo kilichotumiwa.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: na hivyo akaitakasa madhabahu
  rationale: Katika ibada ya kikuhani, piel ya חטא humaanisha kuondoa unajisi au kusafisha kiibada, si kuifanya madhabahu itende dhambi. 'Na hivyo' huonyesha kuwa tendo la damu ndilo lililoitakasa.
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: akaimimina damu kwenye msingi wa madhabahu
  rationale: '''Msingi wa madhabahu'' ni tafsiri wazi ya יְסוֹד na inafaa kwa mahali damu ilipomiminwa.'
- source_word: וַיְקַדְּשֵׁהוּ
  choice: na kuiweka wakfu
  rationale: Hueleza kuitenga madhabahu iwe takatifu kwa matumizi ya ibada, huku ikitofautisha kitendo hiki na utakaso uliotajwa kabla yake.
- source_word: לְכַפֵּר עָלָיו
  choice: ili kuifanyia upatanisho
  rationale: Huhifadhi uzito wa neno kuu la ibada כפר na kuonyesha madhabahu kuwa kitu kinachofanyiwa tendo hilo, bila kuamua zaidi ya maandishi yanavyosema.
theological_decisions:
- issue: Maana ya חטא katika ibada ya utakaso
  choice: akaitakasa madhabahu
  alternative: akaisafisha madhabahu kiibada
  rationale: Kitenzi kinahusu utakaso wa madhabahu kwa damu, wala hakidokezi kwamba madhabahu yenyewe ilitenda dhambi.
- issue: Maana ya כפר na kihusishi עַל wakati madhabahu ndiyo mtendwa
  choice: kuifanyia upatanisho
  alternative: kuiondolea unajisi kwa ibada
  rationale: '''Kuifanyia upatanisho'' huhifadhi maana pana na mvutano wa istilahi ya dhabihu. Mbadala hufafanua upande wa utakaso lakini unaweza kuifanya maana kuwa finyu kupita kiasi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi wa ‘aka-’ umetumiwa kwa mtiririko wa matendo; istilahi ‘madhabahu,’ ‘kuweka wakfu,’ na ‘upatanisho’ zimedumishwa kwa usahihi wa muktadha wa ibada.
