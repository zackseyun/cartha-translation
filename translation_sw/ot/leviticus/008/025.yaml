base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: sw
  text: Kisha akachukua mafuta, mkia wenye mafuta, mafuta yote yaliyokuwa juu ya matumbo, sehemu ya ini[a], figo mbili pamoja na mafuta yake, na paja la kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiambatisho cha ini.” Neno la Kiebrania hurejelea sehemu maalumu iliyoondolewa katika utaratibu wa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha akachukua
  rationale: Muundo wa kitenzi unaendeleza simulizi kwa mfuatano; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Ni neno la kawaida la ibada ya dhabihu kwa sehemu za mafuta zilizotengwa kwa ajili ya sadaka.
- source_word: הָאַלְיָה
  choice: mkia wenye mafuta
  rationale: Hurejelea mkia mnene wa kondoo wenye mafuta mengi, si mkia wowote tu; usemi huu ni wazi na wa asili kwa Kiswahili.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: mafuta yote yaliyokuwa juu ya matumbo
  rationale: קֶרֶב katika muktadha wa dhabihu hurejelea viungo vya ndani; “matumbo” ni neno rahisi na linaloeleweka katika maelezo haya ya anatomia.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: sehemu ya ini
  rationale: Neno la Kiebrania hutaja sehemu maalumu ya ini iliyoondolewa wakati wa utaratibu wa dhabihu; “sehemu ya ini” hudumisha maana bila kudai uhakika wa anatomia usiokuwapo.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: figo mbili
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya maelezo ya anatomia.
- source_word: חֶלְבְּהֶן
  choice: pamoja na mafuta yake
  rationale: Huonyesha kwa kawaida kwamba mafuta hayo yalihusiana na figo mbili.
- source_word: שׁוֹק הַיָּמִין
  choice: paja la kulia
  rationale: שׁוֹק hutaja sehemu ya juu ya mguu katika uchinjaji wa dhabihu; “paja” ni sahihi zaidi hapa kuliko “mguu.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Orodha ya sehemu za mnyama imehifadhiwa kwa mpangilio wa Kiebrania, huku sintaksia ikifanywa kuwa ya kawaida kwa Kiswahili.
