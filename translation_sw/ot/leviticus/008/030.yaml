  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: sw
  text: Kisha Musa akachukua kiasi cha mafuta ya upako na kiasi cha damu iliyokuwa juu ya madhabahu, akavinyunyiza juu ya Aroni, juu ya mavazi yake, juu ya wanawe, na juu ya mavazi ya wanawe pamoja naye. Hivyo akamweka wakfu Aroni, akayaweka wakfu mavazi yake, akawaweka wakfu wanawe, na akayaweka wakfu mavazi ya wanawe pamoja naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtakasa Aroni, mavazi yake, wanawe, na mavazi ya wanawe pamoja naye.”
    reason: Neno la Kiebrania קדשׁ linaweza kutafsiriwa “kutakasa” au “kufanya kuwa kitakatifu”; katika muktadha huu “kuweka wakfu” husisitiza kutengwa kwa ajili ya huduma takatifu.
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: akachukua kiasi cha mafuta ... na kiasi cha damu
  rationale: Kitenzi ni ‘akachukua,’ huku מִן iliyorudiwa ikionyesha kwamba alichukua sehemu ya kila kitu, si mafuta na damu yote.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Huu ni usemi wa kawaida na wenye heshima katika Kiswahili kwa mafuta yaliyotengwa kwa tendo la kupaka.
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: damu iliyokuwa juu ya madhabahu
  rationale: Kifungu hiki kinahifadhi uhusiano wa moja kwa moja wa damu na madhabahu bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
- source_word: וַיַּז
  choice: akavinyunyiza
  rationale: Katika muktadha wa ibada, Hiphil ya נזה humaanisha kunyunyiza kimiminika. Kiambishi ‘vi-’ kinarejelea kwa pamoja mafuta na damu zilizotajwa.
- source_word: בְּגָדָיו
  choice: mavazi yake
  rationale: ‘Mavazi’ ni lugha ya sasa yenye heshima na inadumisha mazingira rasmi ya ibada bila kufasiri zaidi kuwa mavazi maalumu ya kikuhani.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Kiebrania kinataja wana wa kiume wa Aroni waliokuwa wakitengwa kwa huduma ya ukuhani, hivyo jinsia ya rejeo imehifadhiwa.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: mavazi ya wanawe waliokuwa pamoja naye
  rationale: אִתּוֹ inaeleweka kwa kawaida kuwa inawahusu wana waliokuwa pamoja naye, wala si mavazi. Kiswahili kinaweka uhusiano huo wazi bila kubadili maana.
- source_word: וַיְקַדֵּשׁ
  choice: akamweka/akayaweka/akawaweka wakfu
  rationale: Katika ibada hii ya kuwaingiza makuhani katika huduma, קדשׁ ina maana ya kuwatenga kuwa watakatifu kwa huduma takatifu. Kurudia kitenzi kwa upatanisho wa ngeli kunatoa Kiswahili cha kawaida huku kukihifadhi kila kilichoorodheshwa katika Kiebrania.
theological_decisions:
- issue: Maana ya קדשׁ katika muktadha wa kuwekwa katika ukuhani
  choice: kuweka wakfu
  alternative: kutakasa; kufanya kuwa vitakatifu
  rationale: ‘Kuweka wakfu’ huonyesha kutengwa kwa ajili ya huduma takatifu katika ibada hii bila kuingiza mafundisho ya baadaye. Tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi na wazo la utakatifu.
- issue: Rejeo lenye jinsia la בָּנָיו
  choice: wanawe
  alternative: watoto wake
  rationale: Neno la Kiebrania ni la kiume kwa wingi na linawahusu wana wa Aroni waliokuwa washiriki wa kuwekwa katika ukuhani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘juu ya’ yanahifadhi msisitizo wa maandishi ya Kiebrania. Katika sentensi ya mwisho, kitenzi ‘kuweka wakfu’ kimerudiwa kwa upatanisho sahihi wa ngeli kwa watu na mavazi.
