base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: sw
  text: Akanyunyiza baadhi ya mafuta hayo juu ya madhabahu mara saba[a]; kisha akaipaka mafuta madhabahu pamoja na vyombo vyake vyote, na pia beseni na kitako chake[b], ili kuviweka wakfu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “kutoka humo,” yaani kutoka katika mafuta ya upako yaliyotajwa katika muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “beseni na msingi wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז
  choice: Akanyunyiza
  rationale: Kitenzi נזה katika kausativi hueleza kunyunyiza kimiminika katika ibada; “kunyunyiza” ni neno la kawaida na wazi katika Kiswahili.
- source_word: מִמֶּנּוּ
  choice: sehemu ya mafuta hayo
  rationale: Kiebrania husema kihalisi “kutoka humo/katika hayo.” Muktadha unarejelea mafuta ya upako, na Kiswahili cha kawaida huhitaji kutaja kiasi kilichotumiwa bila kudai kwamba mafuta yote yalinyunyizwa.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa madhabahu ya dhabihu.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Hutoa kwa uwazi tendo la ibada lililorudiwa mara saba.
- source_word: וַיִּמְשַׁח
  choice: akaipaka mafuta
  rationale: משׁח hapa ni kitendo cha kupaka mafuta katika ibada ya kuweka wakfu; usemi huu ni wa asili na unaeleweka katika Kiswahili bila kupoteza maana ya kiibada.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כְּלִי ni jina pana la vifaa au vyombo; “vyombo” ni la kawaida na linafaa kwa vifaa vya madhabahu.
- source_word: הַכִּיֹּר
  choice: beseni
  rationale: Neno hili linamaanisha chombo cha kuoshea katika ua wa maskani; “beseni” ni la sasa na linaloeleweka zaidi kuliko istilahi za kale.
- source_word: כַּנּוֹ
  choice: tako lake
  rationale: כֵּן hapa ni sehemu ya chini inayolishikilia beseni. “Tako” huhifadhi maana ya msingi/base, huku “msingi wake” pia ikiwa tafsiri inayowezekana.
- source_word: לְקַדְּשָׁם
  choice: ili kuvitakasa
  rationale: קדשׁ hapa hueleza kuviweka vitu hivyo katika hali ya utakatifu kwa matumizi matakatifu; “kuvitakasa” huhifadhi lugha ya kiibada kwa Kiswahili fasaha.
theological_decisions:
- issue: Istilahi za ibada kuhusu kupaka mafuta na kutakasa vitu vitakatifu
  choice: Kutumia “akaipaka mafuta” na “ili kuvitakasa” kwa maana ya ibada ya kuviweka kwa matumizi matakatifu.
  alternative: “Akavitia mafuta” na “ili kuviweka wakfu.”
  rationale: Tafsiri iliyochaguliwa huhifadhi kitendo halisi na lugha ya utakatifu ya maandiko bila kuingiza maana ya kimadhehebu au mafundisho ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Muundo wa simulizi wenye viambishi vya mfululizo umetumiwa. Istilahi za ibada zimehifadhiwa bila kutumia maneno ya kizamani yasiyo ya lazima.
