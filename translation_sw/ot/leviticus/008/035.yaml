  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: sw
  text: Nanyi mtakaa mlangoni mwa Hema la Kukutania mchana na usiku kwa siku saba, nanyi mtashika maagizo ya Yahwe, ili msife.[a] Kwa maana ndivyo nilivyoamriwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na hamtakufa”; pia yaweza kuwa, “msije mkafa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֶתַח אֹהֶל מוֹעֵד
  choice: kwenye ingilio la Hema la Kukutania
  rationale: פֶתַח ni ingilio au uwazi wa kuingilia. “Kwenye ingilio” ni Kiswahili cha kawaida kinachohifadhi maana ya mahali, huku “Hema la Kukutania” likihifadhi jina la mahali patakatifu bila kulifafanua kupita kiasi.
- source_word: תֵּשְׁבוּ
  choice: mtakaa
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa, kuishi, au kubaki. Hapa kinaamuru makuhani wakae mahali hapo muda wote; “mtakaa” ni cha asili na kinafaa katika muktadha huu.
- source_word: יוֹמָם וָ/לַיְלָה
  choice: mchana na usiku
  rationale: Ni msemo unaoonyesha muda unaoendelea bila kukoma; “mchana na usiku” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kihusishi “kwa” huonyesha kwa kawaida muda ambao tendo la kukaa litaendelea.
- source_word: וּ/שְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: na mtatekeleza wajibu wa Yahwe
  rationale: Muungano wa שמר na משמרת unamaanisha kushika au kutekeleza jukumu lililowekwa. “Kutekeleza wajibu” ni Kiswahili cha sasa na cha heshima kinachowasilisha nguvu ya agizo la kikuhani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne linatolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: וְ/לֹא תָמֻתוּ
  choice: ili msife
  rationale: Katika mfuatano huu, kishazi kinaweza kueleza matokeo yanayoepukwa kwa kutii. “Ili msife” kinaweka wazi onyo hilo huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: Kwa maana ndivyo nilivyoamriwa
  rationale: Kauli tendwa inaonyesha kwamba Musa alipokea agizo. “Ndivyo nilivyoamriwa” ni ya asili na huhifadhi uhusiano wa maelezo unaoletwa na כִּי.
theological_decisions:
- issue: Utoaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya onyo la kifo
  choice: ili msife
  alternative: na hamtakufa; au, msije mkafa
  rationale: Mfuatano wa Kiebrania unaweza kueleweka kama kusudi au matokeo ya utii, kama kauli iliyoratibiwa, au kama onyo. Tafsiri kuu inatumia maana ya kusudi/matokeo, na tanbihi inahifadhi njia nyingine halali bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri, mazingira ya kikuhani, na jina la Mungu vimehifadhiwa bila kuingiza istilahi za dhehebu.
