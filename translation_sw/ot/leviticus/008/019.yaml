  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: sw
  text: Akamchinja, naye Musa akarusha damu[a] dhidi ya pande zote za madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa akapiga damu dhidi ya pande zote za madhabahu.” Kitenzi cha Kiebrania kinaonyesha damu ya dhabihu ikielekezwa kwa nguvu, si kunyunyizwa kidogo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: akamchinja
  rationale: Katika muktadha wa dhabihu, שׁחט humaanisha kumchinja mnyama. Kiambishi cha yambwa -m- kinarejelea kondoo dume aliyetajwa katika mstari uliotangulia.
- source_word: וַיִּזְרֹק
  choice: akairusha
  rationale: זרק huonyesha kuitupa au kuipiga damu kwa nguvu kwenye madhabahu; “akairusha” ni sahihi zaidi kuliko “akainyunyiza,” ambalo linaweza kudokeza tendo tofauti la kiibada.
- source_word: הַדָּם
  choice: damu
  rationale: Nomino dhahiri katika Kiebrania; Kiswahili kwa kawaida hakihitaji kionyeshi tofauti cha uainishaji hapa.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מזבח katika muktadha wa dhabihu.
- source_word: סָבִיב
  choice: kuizunguka pande zote
  rationale: Usemi huu unaonyesha kuwa damu iliwekwa kuzunguka sehemu za pembeni za madhabahu, si mahali pamoja tu.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
