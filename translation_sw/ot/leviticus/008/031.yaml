source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: sw
  text: Musa akawaambia Haruni na wanawe, “Chemsheni nyama penye mlango wa hema la kukutania. Huko mtakula nyama hiyo na mkate uliomo katika kikapu cha sadaka za kuwaweka wakfu[a], kama nilivyoamuru nikisema, ‘Haruni na wanawe wataila.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikapu cha sadaka za kuwaweka rasmi.” Neno la Kiebrania linahusu sadaka zilizohusishwa na ibada ya kuwaingiza makuhani katika huduma yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: Chemsheni
  rationale: Katika muktadha wa sadaka, kitenzi hiki kwa kawaida humaanisha kupika kwa kuchemsha. ‘Chemsheni’ ni mahususi zaidi kuliko ‘pikeni’ na kinafaa katika agizo hili la kiibada.
- source_word: הַבָּשָׂר
  choice: nyama
  rationale: Neno hili linarejelea sehemu inayoliwa ya mnyama wa sadaka. ‘Nyama’ ni Kiswahili cha kawaida na cha heshima katika muktadha huu.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mwingilio wa hema la kukutania
  rationale: ‘Mwingilio’ huonyesha mahali pa kuingilia bila kudai kwamba palikuwa na mlango wenye bawaba; ‘hema la kukutania’ ni usemi wa kawaida kwa mahali hapa pa ibada.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: Huko mtakula nyama hiyo
  rationale: Kuweka ‘Huko’ mwanzoni kunadumisha msisitizo wa mahali uliopo katika Kiebrania. Kurudia ‘nyama hiyo’ ni wazi na ni kawaida zaidi katika Kiswahili kuliko kiwakilishi kisicho na rejeo dhahiri.
- source_word: הַלֶּחֶם
  choice: mkate
  rationale: Umoja wa Kiswahili unadumisha umbo la Kiebrania na unaweza kutumiwa kwa mkate kama chakula cha aina hiyo kwa ujumla.
- source_word: סַל הַמִּלֻּאִים
  choice: kikapu cha sadaka za kuwekwa rasmi
  rationale: Katika muktadha huu מִלֻּאִים hurejelea ibada ya kuwaingiza Haruni na wanawe katika huduma ya ukuhani. ‘Kuwekwa rasmi’ huwasilisha tendo hilo bila kuingiza maana ya madhehebu ya baadaye; ‘sadaka’ hufanya maana ya kikapu katika ibada hiyo iwe wazi.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: kama nilivyoamuru nikisema
  rationale: Usemi huu unahifadhi muundo wa Kiebrania unaotanguliza amri iliyonukuliwa, huku ukiwa wa asili katika Kiswahili.
- source_word: יֹאכְלֻהוּ
  choice: wataila
  rationale: Umbo la wakati ujao katika muktadha wa amri iliyonukuliwa lina nguvu ya maelekezo. Kiwakilishi cha umoja kinahifadhi umbo la Kiebrania bila kubadili wazi rejeo lake kuwa nyama pamoja na mkate.
theological_decisions:
- issue: Maana ya מִלֻּאִים katika ibada ya kuanzishwa kwa makuhani
  choice: sadaka za kuwekwa rasmi
  alternative: sadaka za kuwekwa wakfu
  rationale: Neno hili linahusu ibada ya kuwaingiza Haruni na wanawe katika huduma ya ukuhani. ‘Kuwekwa rasmi’ huonyesha kwa urahisi tendo la kuanzishwa katika huduma hiyo, huku ‘kuwekwa wakfu’ likibaki tafsiri halali na limetajwa katika tanbihi.
- issue: Rejeo la kiambishi cha umoja katika יֹאכְלֻהוּ
  choice: wataila
  alternative: watavikula
  rationale: Kiebrania kina kiambishi cha kitu cha umoja, ingawa muktadha umetaja nyama na mkate. ‘Wataila’ huhifadhi mvutano huo badala ya kuamua kwamba kiambishi kinarejelea vitu vyote viwili kwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. ‘Hema la kukutania’ linadumisha istilahi ya kiibada, na sentensi imegawanywa ili agizo lisikike kwa uwazi.
