base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: sw
  text: Kisha akamleta[a] kondoo dume wa sadaka ya kuteketezwa, na Aroni na wanawe wakaweka[b] mikono yao juu ya kichwa cha kondoo huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwasilisha.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza pia kutafsiriwa “wakaegemeza mikono yao,” kikirejelea tendo la kiibada lililofanywa juu ya mnyama wa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akamleta karibu
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha. ‘Akamleta karibu’ inahifadhi maana ya msingi na muktadha wa ibada; kiwakilishi kinamhusu Musa kulingana na muktadha wa karibu.
- source_word: אֵיל
  choice: kondoo dume
  rationale: Hili ndilo neno la kawaida na lililo wazi kwa mnyama wa kiume anayetajwa katika dhabihu.
- source_word: הָעֹלָה
  choice: wa sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya dhabihu inayoteketezwa. Muundo huu unaonyesha kwamba kondoo huyo alihusishwa na sadaka hiyo bila kuongeza maelezo yasiyosemwa katika mstari.
- source_word: וַיִּסְמְכוּ
  choice: wakaweka
  rationale: Katika muktadha wa dhabihu, סמך hueleza tendo la kiibada la kuweka au kuegemeza mikono juu ya mnyama. ‘Wakaweka’ ni Kiswahili cha kawaida na hakiongezi tafsiri ya kitheolojia.
- source_word: יְדֵיהֶם
  choice: mikono yao
  rationale: Wingi ulio wazi katika Kiebrania umehifadhiwa.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: juu ya kichwa cha kondoo huyo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; ‘huyo’ hurejelea kwa uwazi kondoo dume aliyetajwa tayari.
theological_decisions:
- issue: Kuwekwa kwa mikono katika muktadha wa dhabihu
  choice: wakaweka mikono yao juu ya kichwa cha kondoo huyo
  alternative: wakaegemeza mikono yao juu ya kichwa cha kondoo huyo
  rationale: Mstari unaeleza tendo rasmi la kiibada lakini hautaji wazi maana yake ya kitheolojia, kama kuhamisha hatia au kujitambulisha na mnyama. Tafsiri inaacha suala hilo wazi badala ya kuliamua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. ‘Sadaka ya kuteketezwa’ ni istilahi inayoeleweka kwa kawaida, na muundo hauingizi ufafanuzi wa kimadhehebu.
