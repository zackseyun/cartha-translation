base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: sw
  text: Basi, Aroni na wanawe wakafanya mambo yote ambayo Yahwe alikuwa ameamuru kupitia kwa Musa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwa mkono wa Musa,” nahau yenye maana ya “kupitia kwa Musa” au “kwa Musa akiwa mpatanishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: wakafanya
  rationale: Kitenzi hiki kinatoa muhtasari wa matendo yao ya utii; “wakafanya” ni cha kawaida na kinafuata kiima cha wingi, Aroni na wanawe.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: וּבָנָיו
  choice: na wanawe
  rationale: Katika muktadha huu wa ukuhani, neno hili linawahusu wana wa kiume wa Aroni; “wanawe” ni la asili na sahihi kimuktadha.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: mambo yote
  rationale: דברים inaweza kumaanisha maneno, mambo, au vitu. Hapa inahusu maagizo ya ibada yaliyotekelezwa, hivyo “mambo yote” huhifadhi upana wa maana bila kuwa ngumu.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi rejeshi cha kawaida kinachorejelea “mambo yote.”
- source_word: צִוָּה
  choice: alikuwa ameamuru
  rationale: Amri ilitangulia utekelezaji unaosimuliwa; wakati huu wa kitenzi unaonyesha mpangilio huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo; “Yahwe” ni umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia kwa Musa
  rationale: Nahau ya Kiebrania “kwa mkono wa Musa” inaonyesha uwakala au upatanishi; “kupitia kwa Musa” hutoa maana hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la Mungu, si cheo tu. “Yahwe” hulihifadhi kama jina bila kuingiza badala ya kimapokeo.
- issue: Jukumu la Musa katika בְּיַד מֹשֶׁה
  choice: kupitia kwa Musa
  alternative: kwa mkono wa Musa; kwa Musa
  rationale: Usemi unaonyesha kwamba Yahwe ndiye aliyeamuru na Musa alikuwa njia au mpatanishi wa kuwasilisha amri; tafsiri haimfanyi Musa kuwa chanzo cha amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi” linaunganisha hitimisho hili na simulizi lililotangulia; “mambo yote” na “kupitia kwa Musa” ni vya kawaida huku vikibaki karibu na maana ya Kiebrania.
