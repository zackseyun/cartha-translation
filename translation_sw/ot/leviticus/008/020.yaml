  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: sw
  text: Kisha kondoo dume alikatwa katika vipande, naye Musa akateketeza kwa moshi kichwa, vipande, na mafuta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  choice: kondoo dume
  rationale: Katika muktadha wa dhabihu, אַיִל ni kondoo dume aliyekomaa; hii ndiyo istilahi ya kawaida na iliyo wazi kwa Kiswahili.
- source_word: נִתַּח לִנְתָחָיו
  choice: akakatwa vipande vyake
  rationale: Muundo huu unaeleza kugawanywa kwa mnyama kwa kumkata katika vipande; Kiswahili hiki huhifadhi hali ya kutendwa ya kitenzi cha Kiebrania bila kuwa kizito.
- source_word: וַיַּקְטֵר
  choice: akateketeza ... juu ya madhabahu ili vitoe moshi
  rationale: Hifili ya קטר katika ibada ya dhabihu humaanisha kusababisha kitu kipande kama moshi. Kutaja madhabahu kunatokana na muktadha wa karibu na hufanya tendo la kiibada lieleweke kwa Kiswahili cha kawaida.
- source_word: הָרֹאשׁ
  choice: kichwa
  rationale: Ni neno la moja kwa moja la sehemu hii ya mwili.
- source_word: הַנְּתָחִים
  choice: vile vipande
  rationale: Hurejelea tena vipande vilivyotokana na kukatwa kwa kondoo dume; 'vile' huonyesha rejeo hilo kwa njia ya asili.
- source_word: הַפָּדֶר
  choice: mafuta
  rationale: פָּדֶר hutaja sehemu yenye mafuta ya mnyama wa dhabihu. 'Mafuta' huhifadhi upana wa neno la Kiebrania bila kulibainisha bila uhakika kuwa mkia wenye mafuta au shahamu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mpangilio wa matendo na msamiati wa dhabihu, huku ikiepuka ubainishaji usio na uhakika wa הַפָּדֶר kuwa mkia wenye mafuta.
