  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: sw
  text: Kisha akamvika kanzu, akamfungia mshipi kiunoni, akamvika joho, akamvika efodi, akamfunga kwa ukanda uliosukwa kwa ustadi wa efodi[a], na kwa ukanda huo akaifunga efodi mwilini mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukanda uliopambwa wa efodi” au “mshipi wa kiunoni wa efodi.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania hapa huenda kinamaanisha kwamba efodi ilifungwa kwa Haruni kwa kutumia ukanda wake uliosukwa.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: kanzu
  rationale: Ni vazi la msingi la kikuhani lililovaliwa mwilini; “kanzu” ni neno la kawaida na lenye heshima katika Kiswahili cha Afrika Mashariki.
- source_word: אַבְנֵט
  choice: mshipi
  rationale: Ni kitambaa kilichofungwa kiunoni; “mshipi” linaeleza kazi yake kwa lugha ya kawaida bila kudokeza lazima kuwa ulikuwa wa ngozi.
- source_word: מְעִיל
  choice: joho
  rationale: Ni vazi la nje lililovaliwa juu ya kanzu; “joho” linafaa kwa vazi refu la sherehe.
- source_word: אֵפֹד
  choice: efodi
  rationale: Ni vazi maalumu la kikuhani lisilo na kisawe kamili cha Kiswahili; umbo la kunukuu “efodi” linahifadhi upekee wake wa kiibada.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ukanda wake uliosukwa kwa ustadi
  rationale: Katika muktadha wa mavazi ya kikuhani, neno hili humaanisha ukanda uliotengenezwa kwa usanii na kuwa sehemu ya efodi; kiwakilishi “wake” kinaonyesha uhusiano huo kwa kawaida.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: akamfunga mshipi kiunoni
  rationale: Kitenzi חגר humaanisha kufunga kitu kuzunguka kiuno; kuongeza “kiunoni” kunatoa maana ya kitendo hicho wazi katika Kiswahili.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: kwa ukanda huo akaikaza efodi mwilini mwake
  rationale: Kitenzi nadra kinachotokana na אֵפֹד hapa kinaeleza kuifunga au kuikaza efodi kwa kutumia ukanda wake; tafsiri hii inaweka wazi rejeo la בּוֹ bila kupoteza tendo.
- source_word: וַיִּתֵּן עָלָיו
  choice: akamvika
  rationale: Katika mfululizo huu wa kumvalisha Haruni, “akamvika” ni Kiswahili cha kawaida na sahihi kuliko tafsiri ya neno kwa neno ya “akaweka juu yake.”
theological_decisions:
- issue: Istilahi za mavazi ya kikuhani
  choice: Kutumia “efodi” kama istilahi maalumu huku majina ya mavazi ya kawaida yakitafsiriwa kwa Kiswahili
  alternative: Kufafanua efodi kama “vazi linalofanana na aproni”
  rationale: Maandiko hayafafanui umbo kamili la efodi katika mstari huu. Kulihifadhi kama istilahi ya kiibada huepuka kuingiza taswira yenye uhakika usiothibitishwa na chanzo.
- issue: Uhusiano wa ukanda na efodi katika kishazi cha mwisho
  choice: Kusema kwamba ukanda huo uliikaza efodi mwilini mwa Haruni
  alternative: Kutafsiri kwa ukaribu zaidi kama “akamfunga kwa huo”
  rationale: Kitenzi וַיֶּאְפֹּד na kiwakilishi בּוֹ vinaweza kusikika kwa utata katika tafsiri ya moja kwa moja. Muktadha unaonyesha kuwa ukanda wa efodi ndio uliotumiwa kuishikilia efodi, lakini tanbihi inadumisha ufahamu wa muundo wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya “aka-” unahifadhi mtiririko wa masimulizi ya Kiebrania. “Efodi” imetumiwa kama istilahi maalumu, huku “kanzu,” “mshipi,” na “joho” zikiweka mstari wazi kwa msomaji wa kawaida.
