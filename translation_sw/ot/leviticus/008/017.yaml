base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Lakini fahali huyo[a], pamoja na ngozi yake, nyama yake na mavi yake[b], alimteketeza kwa moto nje ya kambi, kama Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fahali mchanga.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kinyesi chake.” Neno la Kiebrania linamaanisha hasa kinyesi, si taka kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּר
  choice: fahali huyo
  rationale: פַּר humaanisha fahali, na inaweza pia kudokeza fahali mchanga. “Fahali huyo” ni tafsiri ya kawaida na inaunganisha mnyama huyu na sadaka iliyotajwa katika muktadha bila kuongeza maelezo yasiyomo katika mstari huu.
- source_word: עֹרוֹ
  choice: ngozi yake
  rationale: עוֹר humaanisha ngozi ya mnyama; “ngozi yake” ni ya kawaida na wazi katika Kiswahili.
- source_word: בְּשָׂרוֹ
  choice: nyama yake
  rationale: בָּשָׂר ni nyama au mwili wenye nyama. “Nyama yake” ni usemi wa kawaida katika muktadha wa mzoga wa mnyama.
- source_word: פִּרְשׁוֹ
  choice: mavi yake
  rationale: פֶּרֶשׁ hutaja hasa kinyesi cha mnyama, si taka kwa ujumla. “Mavi yake” ni sahihi, wazi, na ya kawaida.
- source_word: שָׂרַף בָּאֵשׁ
  choice: alimteketeza kwa moto
  rationale: שׂרף ni kuchoma au kuteketeza, na בָּאֵשׁ inasisitiza moto kama njia iliyotumiwa. “Alimteketeza kwa moto” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya mahali palipo nje ya eneo la kambi.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: kama ... alivyomwamuru
  rationale: Muundo huu unaonyesha kuwa kitendo kilifanywa sawasawa na amri iliyotolewa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: fahali huyo, pamoja na ngozi yake, nyama yake na mavi yake
  rationale: “Pamoja na” huwasilisha kwa Kiswahili fasaha nguvu ya orodha ya vitu vilivyoteketezwa bila kurudia viunganishi kwa namna nzito.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Kiima cha kitenzi kimeachwa ndani ya kiambishi “ali-,” kama ilivyo kawaida katika Kiswahili na kama Kiebrania kinavyotegemea muktadha kumtambua Musa. Mpangilio wa maneno umewekwa ili fahali asieleweke kimakosa kuwa ndiye anayeteketeza.
