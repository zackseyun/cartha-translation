  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: sw
  text: Kutoka katika kikapu cha mikate isiyotiwa chachu kilichokuwa mbele ya Yahwe, akachukua mkate mmoja usiotiwa chachu, mkate mmoja wenye mafuta[a], na mkate mmoja mwembamba; akaviweka juu ya sehemu za mafuta na juu ya paja la kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate mmoja uliochanganywa na mafuta.” Kirai cha Kiebrania kinaweza kueleza mkate uliotayarishwa kwa mafuta, lakini hakisemi wazi jinsi mafuta hayo yalivyotumiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: kutoka katika kikapu cha mikate isiyotiwa chachu
  rationale: Kirai hiki kinaonyesha chanzo cha vitu vilivyochukuliwa. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha kikapu pamoja na aina ya mikate ya ibada.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hiki ni kirai cha ibada kinachoonyesha kwamba kikapu kilikuwa kimewekwa katika uwepo wa Yahwe. Jina la agano יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: חַלַּת מַצָּה אַחַת
  choice: mkate mmoja usiotiwa chachu
  rationale: חַלָּה hapa ni kipande au donge la mkate; מַצָּה hubainisha kwamba halikutiwa chachu. “Mkate mmoja” ni lugha ya kawaida na inayoeleweka.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: mkate mmoja wenye mafuta
  rationale: Muundo wa Kiebrania unahusianisha mkate huu na mafuta bila kueleza wazi kama mafuta yalichanganywa ndani yake au yalipakwa. Tafsiri hii inadumisha kutobainika huko.
- source_word: רָקִיק אֶחָד
  choice: mkate mmoja mwembamba
  rationale: רָקִיק ni mkate bapa na mwembamba wa ibada. Maelezo haya ni ya asili zaidi kwa wasomaji wengi wa Kiswahili kuliko istilahi isiyo ya kawaida kama “kaki.”
- source_word: וַיָּשֶׂם
  choice: akaviweka
  rationale: Kiambishi “vi-” kinarejelea kwa kawaida vile vitu vitatu vya mkate vilivyotajwa, ingawa kitenzi cha Kiebrania kiko katika umoja.
- source_word: הַחֲלָבִים
  choice: sehemu za mafuta
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha vipande maalumu vyenye mafuta vilivyotengwa, si mafuta kwa ujumla.
- source_word: שׁוֹק הַיָּמִין
  choice: paja la kulia
  rationale: שׁוֹק ni sehemu ya mguu au paja la mnyama katika uchinjaji wa dhabihu; “paja la kulia” ni tafsiri wazi na sahihi katika muktadha huu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Sentensi inadumisha mpangilio wa vitendo vya ibada na kutobainika kwa namna mafuta yalivyohusishwa na mkate.
