  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Kisha Musa akakichukua kidari, akakipeperusha kama sadaka ya kutikiswa mbele ya Yahweh. Hicho kilikuwa fungu la Musa kutoka katika kondoo dume wa kuwekwa wakfu[a], kama Yahweh alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kondoo dume wa kuwekwa katika ukuhani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha Musa akakitwaa
  rationale: Wayyiqtol inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akitwaa” hudumisha maana ya kuchukua.
- source_word: הֶחָזֶה
  choice: kidari
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha sehemu ya mbele ya kifua cha mnyama; “kidari” ni istilahi ya Kiswahili inayofaa kwa sehemu hiyo.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: kukitikisa kuwa sadaka ya kutikiswa
  rationale: Kitenzi נוף pamoja na nomino yake תְּנוּפָה huonyesha tendo maalumu la kiibada la kutikisa au kuwasilisha sadaka; tafsiri hii inadumisha tendo na jina la sadaka.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Ni msemo wa kiibada unaoonyesha kuwasilisha kitu katika uwepo wa Yahweh; “mbele za” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: kutoka katika kondoo dume wa kuwekwa wakfu
  rationale: אֵיל ni kondoo dume, na מִלֻּאִים hapa inahusu ibada ya kuwaingiza makuhani rasmi katika huduma. “Kuwekwa wakfu” ni ya kawaida na yenye kueleweka, huku tanbihi ikihifadhi mbadala wa “kuwekwa katika ukuhani.”
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: Hicho kilikuwa fungu la Musa
  rationale: מָנָה ni sehemu au fungu lililotengewa mtu. Kiwakilishi “Hicho” kinarejelea kidari kwa uwazi.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama Yahweh alivyomwamuru Musa
  rationale: Huu ni usemi wa kawaida wa kuthibitisha kwamba tendo lilifuata amri ya awali ya Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya מִלֻּאִים katika ibada ya kuwaingiza makuhani katika huduma
  choice: kuwekwa wakfu
  alternative: kuwekwa katika ukuhani
  rationale: Katika Walawi 8 neno linahusu ibada ya kuwaweka makuhani rasmi katika huduma. “Kuwekwa wakfu” ni tafsiri ya kawaida na ya kueleweka, lakini mbadala mahususi zaidi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kidari” hutumiwa kwa sehemu maalumu ya dhabihu, na “sadaka ya kutikiswa” hudumisha istilahi ya kiibada pamoja na mwendo unaotajwa katika Kiebrania.
