base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: sw
  text: Kisha akamleta fahali wa sadaka ya dhambi[a], na Haruni na wanawe wakaweka mikono yao juu ya kichwa cha fahali wa sadaka ya dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamleta karibu” au “akamwasilisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: akamsogeza karibu
  rationale: Hifili ya נגשׁ hapa ina maana ya kumleta mnyama karibu au kumwasilisha katika mazingira ya ibada. “Akamsogeza karibu” huhifadhi wazo la kumleta karibu bila kumtaja wazi mtu ambaye hakutajwa katika Kiebrania.
- source_word: פַּר
  choice: fahali
  rationale: פַּר humaanisha ng’ombe dume katika muktadha wa dhabihu. “Fahali” ni neno la kawaida, wazi, na lenye hadhi katika Kiswahili cha Afrika Mashariki; mstari huu peke yake haulazimishi maana ya fahali mchanga.
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חַטָּאת humaanisha dhabihu au sadaka inayohusiana na dhambi, si dhambi yenyewe. “Sadaka ya dhambi” ni tafsiri iliyo wazi na inayotambulika katika Kiswahili cha Biblia.
- source_word: וַיִּסְמֹךְ
  choice: wakaweka
  rationale: Katika ibada ya dhabihu, סמך hueleza kuweka au kuegemeza mikono juu ya mnyama. “Wakaweka” ni ya asili katika Kiswahili na haiongezi kiwango cha shinikizo ambacho mstari haukielezi wazi.
- source_word: יְדֵיהֶם
  choice: mikono yao
  rationale: Tafsiri hii huhifadhi wingi wa neno la Kiebrania na kueleza tendo la Haruni na wanawe kwa njia ya kawaida katika Kiswahili.
- source_word: עַל רֹאשׁ
  choice: juu ya kichwa cha
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya mahali mikono ilipowekwa katika tendo hilo la kiibada.
theological_decisions:
- issue: Maana ya kuwekea mnyama mikono katika ibada ya dhabihu
  choice: Tendo lenyewe linaelezwa bila kufafanua maana yake ya kitheolojia.
  alternative: Kulifafanua kama kuhamisha hatia, kujitambulisha na sadaka, au kumweka mnyama wakfu kwa ajili ya dhabihu.
  rationale: Mstari unasimulia tendo la ibada lakini hauelezi wazi utendaji au maana yake ya kitheolojia. Tafsiri haipaswi kuamua kati ya maelezo hayo yanayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Fahali” limetumiwa badala ya kifungu kirefu “ng’ombe dume,” na muundo wa sentensi umewekwa wazi kwa wasomaji wa kawaida huku urudiaji wa “sadaka ya dhambi” wa Kiebrania ukihifadhiwa.
