  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: sw
  text: Kisha Musa akavichukua kutoka viganjani mwao na akaviteketeza juu ya madhabahu, juu ya sadaka ya kuteketezwa. Sadaka hizo zilikuwa za kuwaweka wakfu[a], za harufu ya kupendeza, sadaka ya moto[b] kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya kuingizwa katika ukuhani.” Neno la Kiebrania ni istilahi maalumu kwa sadaka iliyotumiwa katika ibada ya kuwaweka makuhani katika huduma.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linamaanisha sadaka inayotolewa kwa moto.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akavichukua
  rationale: Kitenzi לקח ni ‘chukua’; kiambishi cha ngeli ya vitu kinarejelea sehemu za sadaka zilizotajwa kabla.
- source_word: מֵעַל כַּפֵּיהֶם
  choice: kutoka viganjani mwao
  rationale: כַּפַּיִם hapa ni viganja vya mikono; usemi huu unahifadhi picha halisi ya ibada na unasikika kiasili kwa Kiswahili.
- source_word: וַיַּקְטֵר הַמִּזְבֵּחָה
  choice: akaviteketeza juu ya madhabahu
  rationale: Katika muktadha wa dhabihu, Hifili ya קטר humaanisha kufanya sadaka ipae kwa moshi; ‘teketeza juu ya madhabahu’ ni wazi na ya kawaida.
- source_word: עַל הָעֹלָה
  choice: juu ya sadaka ya kuteketezwa
  rationale: עַל kwa kawaida ni ‘juu ya,’ na עֹלָה ni sadaka inayoteketezwa kabisa.
- source_word: מִלֻּאִים
  choice: sadaka ya kuwekwa wakfu
  rationale: Ni istilahi ya kiibada kwa sadaka ya ibada ya kuwaingiza makuhani katika huduma; ‘kuwekwa wakfu’ huepuka kuingiza mfumo wa baadaye wa kanisa.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: kuwa harufu ya kupendeza
  rationale: Huhifadhi nahau ya kikuhani inayoonyesha sadaka inayokubalika bila kuondoa taswira yake.
- source_word: אִשֶּׁה
  choice: sadaka iliyotolewa kwa moto
  rationale: Istilahi hii ya dhabihu inahusiana na kile kinachotolewa kwa moto; tafsiri hii ni wazi kuliko ‘sadaka ya chakula’ na inafuata ushahidi wa Kiebrania.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama ‘Yahwe,’ kwa uwazi na uaminifu kwa maandishi ya chanzo.
theological_decisions:
- issue: Maana ya istilahi ya kikuhani מִלֻּאִים
  choice: sadaka ya kuwekwa wakfu
  alternative: sadaka ya kuingizwa katika ukuhani
  rationale: Chaguo kuu ni la kawaida na lenye hadhi, huku tanbihi ikieleza kazi maalumu ya sadaka katika ibada ya kuwaweka makuhani katika huduma.
- issue: Tafsiri ya אִשֶּׁה
  choice: sadaka iliyotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Mzizi na matumizi ya istilahi yanaunga mkono sadaka inayohusishwa na moto; ‘sadaka ya chakula’ inaweza kudokeza maana isiyo dhahiri moja kwa moja katika neno hili.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutoholewa kwa jina kunalitofautisha na cheo ‘Bwana’ na kunahifadhi jina lililo katika maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi na hadhi ya kiibada. ‘Viganjani mwao’ huhifadhi usahihi wa picha ya Kiebrania; istilahi za dhabihu zimeelezwa kwa lugha inayoeleweka bila kufuta upekee wake.
