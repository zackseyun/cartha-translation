  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: sw
  text: Musa akafanya kama Yahweh alivyomwamuru, na kusanyiko likakusanyika penye mlango wa Hema la Kukutania.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה ni kipana, ‘kufanya/kutenda’; hapa ‘akafanya’ kinaeleza kwa kawaida na moja kwa moja utiifu wa Musa kwa amri.
- source_word: כַּאֲשֶׁר
  choice: kama ... alivyomwamuru
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba tendo la Musa lililingana na agizo alilopewa.
- source_word: צִוָּה
  choice: alivyomwamuru
  rationale: ‘Kuamuru’ huhifadhi uzito wa mamlaka uliomo katika צוה kuliko ‘kuelekeza’ au ‘kuagiza’ kwa maana nyepesi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: אֹתוֹ
  choice: -m- katika ‘alivyomwamuru’
  rationale: Kiambishi cha yambwa ‘-m-’ kinamrejelea Musa kwa njia ya kawaida katika Kiswahili.
- source_word: וַתִּקָּהֵל
  choice: likakusanyika
  rationale: Nifali ya קהל hapa inaeleza kusanyika kwa jumuiya; ‘likakusanyika’ ni Kiswahili cha kawaida kisicholazimisha maana ya kwamba mtu mwingine alilikusanya.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: עֵדָה humaanisha jumuiya ya Israeli ikiwa pamoja; ‘kusanyiko’ huhifadhi wazo la kundi lililokusanyika bila kulifanya kuwa taasisi ya kidini ya baadaye.
- source_word: אֶל פֶּתַח
  choice: kwenye mlango
  rationale: Ingawa אֶל mara nyingi ni ‘kwenda/kuja upande wa,’ katika muktadha huu ‘kwenye mlango’ huonyesha kwa kawaida mahali walipofikia na kukusanyika.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la kawaida na linaloeleweka la hema hilo, likihifadhi wazo la hema na kusudi lake la kukutana.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Andiko lina jina binafsi יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Iwapo kusanyiko lilijikusanya au lilikusanywa
  choice: likakusanyika
  alternative: lilikusanywa
  rationale: Nifali וַתִּקָּהֵל inaweza kuwasilishwa kwa namna inayosisitiza kuja pamoja au kukusanywa. ‘Likakusanyika’ ni ya kawaida na haitaji wakala ambaye andiko halimtaji wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kueleweka, huku ikihifadhi jina Yahweh, mamlaka ya amri, na istilahi ya mazingira ya maskani.
