base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: sw
  text: Kisha akawaleta wana wa Aroni karibu, naye Musa akapaka sehemu ya damu kwenye ndewe za masikio yao ya kulia, kwenye vidole gumba vya mikono yao ya kulia, na kwenye vidole vikubwa vya miguu yao ya kulia. Kisha Musa akaitupa damu kwenye madhabahu pande zote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּנוּךְ
  choice: ndewe
  rationale: Neno hili hurejelea sehemu laini ya nje ya sikio; “ndewe ya sikio” ni tafsiri sahihi na inayoeleweka katika Kiswahili sanifu.
- source_word: בֹּהֶן
  choice: kidole gumba
  rationale: Katika muktadha wa mkono humaanisha kidole gumba, na katika muktadha wa mguu humaanisha kidole kikubwa; muundo umetafsiriwa kwa lugha ya kawaida huku ukihifadhi ulinganifu wa Kiebrania.
- source_word: וַיִּזְרֹק
  choice: akaitupa
  rationale: Kitenzi זָרַק kimsingi ni kutupa au kurusha; uchaguzi huu unahifadhi kitendo cha ibada bila kukibadili kuwa “kunyunyiza,” ambacho kinaweza kudokeza namna tofauti ya utekelezaji.
- source_word: סָבִיב
  choice: pande zote za madhabahu
  rationale: Hutoa maana ya damu kuelekezwa kuizunguka madhabahu, kwa Kiswahili cha kawaida na wazi.
