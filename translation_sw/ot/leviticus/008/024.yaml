  verdict: revise
  source_fidelity: 'Maana ya msingi imehifadhiwa: Musa aliwaleta wana wa Aroni, akaweka damu kwenye ndewe ya sikio la kulia, kidole gumba cha mkono wa kulia, na kidole kikubwa cha mguu wa kulia, kisha akaitupa damu kwenye madhabahu kuizunguka. Hata hivyo, umoja wa viungo pamoja na kiwakilishi cha wingi katika rasimu unaweza kusikika kama viungo vya pamoja vya kundi badala ya tendo kufanywa kwa kila mwana; wingi wa usambazaji unaeleweka zaidi katika Kiswahili.'
  naturalness: 'Marekebisho yanatumia miundo ya kawaida na iliyo wazi: “ndewe za masikio yao,” “vidole gumba vya mikono yao,” na “vidole vikubwa vya miguu yao.” “Kwenye madhabahu pande zote” huweka wazi kwamba damu ilitupwa kwenye madhabahu, si tu katika eneo lililo karibu nayo.'
  terminology: “Ndewe” ni sahihi kwa תְּנוּךְ. “Kidole gumba” linafaa kwa בֹּהֶן ya mkono, ilhali “kidole kikubwa cha mguu” ndilo neno la kawaida na sahihi kwa בֹּהֶן katika muktadha wa mguu. “Akaitupa” huhifadhi nguvu ya וַיִּזְרֹק bila kuamua kwa undani namna ya kurusha damu.
  issues:
  - severity: medium
    issue: Umoja wa viungo katika vifungu vya kwanza vitatu unaweza kuwa na utata wa kimarejeo.
    rationale: Kiebrania hutumia nomino za umoja zenye viambishi vya wingi kwa maana ya usambazaji kwa kila mmoja. Kiswahili hueleweka kwa urahisi zaidi kwa wingi wa viungo katika muktadha huu wa wana wengi.
  - severity: low
    issue: “Kidole gumba cha mguu” si istilahi ya kawaida zaidi kwa kidole kikubwa cha mguu.
    rationale: “Kidole kikubwa cha mguu” hutofautisha wazi kidole cha mguu na gumba la mkono, huku ikihifadhi maana ya בֹּהֶן.
  - severity: low
    issue: “Pande zote za madhabahu” haionyeshi wazi mahali damu ilipotupwa.
    rationale: Kuongeza “kwenye madhabahu” huakisi עַל־הַמִּזְבֵּחַ na kuacha “pande zote” kwa maana ya kuizunguka.
  revised_text: Kisha akawaleta wana wa Aroni karibu, naye Musa akapaka sehemu ya damu kwenye ndewe za masikio yao ya kulia, kwenye vidole gumba vya mikono yao ya kulia, na kwenye vidole vikubwa vya miguu yao ya kulia. Kisha Musa akaitupa damu kwenye madhabahu pande zote.
