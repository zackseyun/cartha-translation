  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Lugha ya anatomia imewekwa wazi bila kutumia istilahi nzito kupita kiasi, na msamiati wa dhabihu umehifadhi maana maalumu ya tendo la kuteketeza kuwa moshi.
