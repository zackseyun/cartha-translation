base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: sw
  text: Akachukua mafuta yote yaliyokuwa juu ya viungo vya ndani, sehemu ya ini[a], figo zote mbili na mafuta ya figo hizo; kisha Musa akaviteketeza[b] juu ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiambatisho cha ini”; neno la Kiebrania hutaja sehemu maalumu ya ini iliyoondolewa wakati wa kuandaa dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinamaanisha hasa kuteketeza kitu madhabahuni ili kipae kwa moshi kama dhabihu.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Akachukua
  rationale: Ka- ya usimulizi inaendeleza mfuatano wa matendo na kutafsiri wayyiqtol kwa Kiswahili cha kawaida.
- source_word: כָּל הַחֵלֶב
  choice: mafuta yote
  rationale: Katika muktadha wa dhabihu, חֵלֶב ni sehemu za mafuta zilizotengwa kwa ajili ya kutolewa; ‘mafuta yote’ ni tafsiri ya moja kwa moja na iliyo wazi.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: yaliyokuwa juu ya viungo vya ndani
  rationale: קֶרֶב hapa hurejelea sehemu au viungo vya ndani vya mnyama; usemi huu ni wa kawaida na haubani maana kuwa matumbo pekee.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: sehemu ya ini
  rationale: Neno יֹתֶרֶת hutaja sehemu maalumu ya ini inayoondolewa wakati wa kuandaa dhabihu, lakini utambulisho wake kamili wa kianatomia hauhakikishwi; ‘sehemu ya ini’ huhifadhi tahadhari hiyo.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: figo zote mbili
  rationale: Huwakilisha wazi umbo la uwili katika Kiebrania na ni Kiswahili cha kawaida.
- source_word: חֶלְבְּהֶן
  choice: mafuta yake
  rationale: Kiambishi cha umilikaji kinarejelea figo; katika Kiswahili ‘yake’ hupatana na ngeli ya ‘mafuta’ huku maana ikibaki mafuta ya figo hizo.
- source_word: וַיַּקְטֵר
  choice: akaviteketeza kuwa moshi
  rationale: קטר katika ibada ya dhabihu ina maana maalumu ya kuteketeza madhabahuni ili kitu kipae kwa moshi; tafsiri hii ni sahihi zaidi kuliko ‘akachoma’ pekee.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: He ya mwelekeo inaonyesha kuelekea au kwenye madhabahu; katika muktadha huu ‘juu ya madhabahu’ ni usemi wa kawaida na sahihi.
