base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: sw
  text: Wala msitoke mlangoni pa Hema la Kukutania kwa siku saba, mpaka siku za kuwekwa kwenu rasmi zitimie, kwa maana atawaweka rasmi[a] kwa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “ataijaza mikono yenu”; hii ni nahau ya Kiebrania ya kumweka mtu rasmi katika huduma ya ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/פֶּתַח
  choice: Wala msitoke kwenye mwingilio
  rationale: Kiunganishi וּ kinaendeleza maagizo yaliyotangulia, na מִפֶּתַח huonyesha mahali wanakokatazwa kutoka. “Mwingilio” ni neno la kawaida na lenye hadhi linalohifadhi maana ya uwazi au mlango wa kuingilia.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina linaloeleweka la mahali patakatifu na linafuata moja kwa moja maana ya maneno ya Kiebrania, bila kutumia istilahi ya kimapokeo isiyo wazi kwa kila msomaji.
- source_word: לֹא תֵצְאוּ
  choice: msitoke
  rationale: Umbo la kukataza katika Kiebrania limetolewa kwa amri hasi ya Kiswahili, yenye nguvu ya wazi na ya kawaida.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kirai hiki kinaonyesha muda ambao katazo linaendelea; “kwa siku saba” ni Kiswahili cha kawaida na sahihi.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: mpaka siku za kuwekwa kwenu rasmi zitimie
  rationale: Tafsiri hii inawasilisha mwisho wa kipindi cha siku za ibada ya kuwaingiza katika huduma ya ukuhani, huku ikiepuka mpangilio mgumu wa maneno wa Kiebrania. “Kuwekwa rasmi” linaeleweka kwa wasomaji wa sasa na linafaa kwa muktadha wa kuingizwa katika huduma.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linaanzisha sababu ya wao kutotoka katika kipindi hicho.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: atawaweka rasmi
  rationale: Kwa neno ni “ataujaza mkono wenu,” lakini ni nahau ya kiufundi inayomaanisha kuwaingiza au kuwaweka rasmi katika huduma ya ukuhani. Maana ya nahau imetolewa katika matini, na picha yake halisi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Nahau ya kikuhani מִלֵּא אֶת־יָד (“kujaza mkono”)
  choice: atawaweka rasmi
  alternative: ataujaza mkono wenu
  rationale: Tafsiri ya maana inaleta Kiswahili cha asili na kinachoeleweka, ilhali tanbihi inahifadhi picha ya Kiebrania na uhusiano wake na ibada ya kuwaingiza katika huduma ya ukuhani. Kitenzi hakimtaji wazi mtendaji, kwa hiyo kiwakilishi fiche cha nafsi ya tatu katika “atawaweka” hakifafanuliwi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima na wa sasa. “Hema la Kukutania” limetumiwa kama jina la mahali patakatifu, na “kuwekwa rasmi” huepuka lugha ya dhehebu fulani huku ikieleza ibada ya kuwaingiza makuhani katika huduma.
