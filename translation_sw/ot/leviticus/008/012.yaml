translation:
  language: sw
  text: Kisha akamimina baadhi ya mafuta ya upako juu ya kichwa cha Aroni, akampaka mafuta ili kumweka wakfu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: akamimina
  rationale: Kitenzi יצק kinaonyesha kumimina kimiminika; “akamimina” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: sehemu ya mafuta ya kutiwa wakfu
  rationale: מִן ina maana ya kuchukua kiasi kutoka katika mafuta hayo. “Mafuta ya kutiwa wakfu” yanaeleza matumizi ya mafuta katika ibada bila kupoteza uhusiano wake na tendo la kuweka wakfu.
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: juu ya kichwa cha Aroni
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya mahali mafuta yalipomiminwa.
- source_word: וַיִּמְשַׁח
  choice: akamtia mafuta
  rationale: משׁח hapa ni tendo la ibada la kumpaka au kumtia mtu mafuta; “akamtia mafuta” ni wazi na la kawaida kwa wasomaji wa Kiswahili.
- source_word: לְקַדְּשׁוֹ
  choice: ili kumweka wakfu
  rationale: Katika kuwekwa kwa kuhani, קדשׁ humaanisha kumtenga mtu kwa huduma takatifu. “Kumweka wakfu” huhifadhi maana hiyo ya kiibada na ya utumishi.
- source_word: וַ
  choice: Kisha
  rationale: Waw ya masimulizi inaendeleza mfuatano wa matendo; “Kisha” huonyesha mfuatano huo kwa Kiswahili cha asili.
theological_decisions:
- issue: Tafsiri ya קדשׁ katika muktadha wa kuwekwa kwa kuhani
  choice: ili kumweka wakfu
  alternative: ili kumtakasa
  rationale: Muktadha unaeleza kutengwa kwa Aroni kwa huduma ya ukuhani. “Kumweka wakfu” huonyesha kusudi hilo la kiibada bila kuifanya kauli ihusu hasa utakaso wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza mfuatano wa ibada kwa uwazi. Hakuna tanbihi inayohitajika katika mstari huu.
