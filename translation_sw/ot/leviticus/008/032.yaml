  text: Na mabaki ya nyama na ya mkate mtayateketeza kwa moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Na mabaki
  rationale: Kivumishi-tendo cha Kiebrania kimetumika kama nomino, kikimaanisha kile kilichobaki. “Mabaki” ni Kiswahili cha kawaida na cha wazi katika agizo hili.
- source_word: בַּבָּשָׂר
  choice: ya nyama
  rationale: Ingawa בָּשָׂר inaweza kumaanisha mwili au nyama, hapa inahusu nyama ya mnyama wa dhabihu inayoliwa; “nyama” ndiyo tafsiri ya kawaida katika muktadha huu.
- source_word: וּבַלָּחֶם
  choice: na mkate
  rationale: לֶחֶם ni mkate; umoja wa Kiswahili unafaa hapa kwa maana ya jumla, kama ulivyo umoja katika Kiebrania.
- source_word: בָּאֵשׁ
  choice: kwa moto
  rationale: Kihusishi ב kinaonyesha njia inayotumiwa kuteketeza. “Kwa moto” ni Kiswahili cha kawaida kinachowasilisha maana hiyo moja kwa moja.
- source_word: תִּשְׂרֹפוּ
  choice: mtayateketeza
  rationale: Kitenzi hiki ni agizo kwa wingi. “Mta-” linadumisha mtindo rasmi wa sheria, na “teketeza” linaonyesha kuchoma kabisa; kiambishi “-ya-” kinarejelea mabaki.
