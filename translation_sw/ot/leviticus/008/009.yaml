id: LEV.8.9
reference: Leviticus 8:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Akaweka kilemba kichwani mwake, na upande wa mbele wa kilemba akaweka bamba la dhahabu, yaani, taji takatifu,[a] kama vile Yahwe alivyomwagiza Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taji la wakfu.”
    reason: Neno נֵזֶר linaweza kumaanisha taji au taji linaloashiria kuwekwa wakfu; chaguo hili linahifadhi maana hiyo ya kiibada.
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: kilemba
  rationale: Neno hili linamaanisha kifuniko maalumu cha kichwa cha kuhani. “Kilemba” ni neno la kawaida, wazi, na linalofaa katika muktadha wa vazi la kikuhani.
- source_word: אֶל מוּל פָּנָיו
  choice: upande wa mbele wa kilemba
  rationale: Nahau hii inaonyesha mahali bamba lilipowekwa kwenye sehemu ya kilemba iliyoelekea mbele, si kwamba liliwekwa tu mbele ya Haruni.
- source_word: צִיץ
  choice: bamba
  rationale: Ingawa neno hili linaweza kumaanisha ua au pambo, katika muktadha wa mavazi ya kuhani linamaanisha pambo la dhahabu lililofungwa kwenye kilemba; “bamba” linaeleza kitu hicho kwa uwazi.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: taji takatifu
  rationale: Kirai hiki kinaitambulisha zaidi bamba la dhahabu kuwa alama takatifu ya kuhani. “Taji takatifu” ni wazi na kinabaki karibu na muundo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: akaweka ... akaweka
  rationale: Kurudia kitenzi kilekile kunahifadhi urudiaji wa Kiebrania na kunasikika kawaida katika simulizi la Kiswahili.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: kama vile Yahwe alivyomwagiza Musa
  rationale: “Kama vile” linaonyesha kwamba Musa alitekeleza maagizo ya Mungu sawasawa, huku “alivyomwagiza” likiwa la kawaida na lenye heshima.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha na cheo.
- issue: Uhusiano wa בamba la dhahabu na נֵזֶר הַקֹּדֶשׁ
  choice: yaani, taji takatifu
  alternative: na taji takatifu
  rationale: 'Kirai cha Kiebrania kinaweza kueleweka kuwa katika uhusiano wa ufafanuzi: bamba la dhahabu ndilo linaloitwa taji takatifu. “Yaani” kinaonyesha uhusiano huo bila kuifanya kuwa kitu kingine tofauti.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia msamiati unaoeleweka kwa wasomaji wa kawaida huku ikihifadhi urudiaji, mpangilio wa mavazi ya kikuhani, na jina la Mungu katika maandishi ya Kiebrania.
