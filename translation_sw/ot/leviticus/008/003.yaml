  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri umewekwa kwa ufupi na kwa uwazi; “kusanyiko” limetumiwa badala ya istilahi ya kidhehebu.
