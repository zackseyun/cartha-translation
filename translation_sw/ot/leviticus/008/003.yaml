  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: sw
  text: Na kusanya kusanyiko lote kwenye ingilio la Hema la Kukutania.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanya jumuiya yote.” Neno la Kiebrania עֵדָה linaweza kutafsiriwa “kusanyiko” au “jumuiya,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: Na
  rationale: וְ inaunganisha amri hii na iliyotangulia; אֵת ni kiashiria cha yambwa maalumu na hakihitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: כָּל
  choice: lote
  rationale: כָּל pamoja na nomino yenye kibainishi husisitiza ujumla; katika Kiswahili upatanisho wa ngeli katika “kusanyiko lote” unaeleza kusanyiko zima.
- source_word: הָ/עֵדָה
  choice: kusanyiko
  rationale: עֵדָה hapa ni jumuiya ya Israeli iliyokusanyika. “Kusanyiko” ni neno la kawaida, lenye heshima, na huhifadhi maana ya kundi lililoitwa pamoja; “jumuiya” pia inawezekana.
- source_word: הַקְהֵל
  choice: kusanya
  rationale: Hii ni amri ya Hifili ya קהל, yaani kusababisha watu wakusanyike. “Kusanya” ni amri ya asili na iliyo wazi katika Kiswahili.
- source_word: אֶל
  choice: kwenye
  rationale: אֶל kwa kawaida huonyesha mwelekeo kuelekea mahali; pamoja na “mlango,” “kwenye mlango” ni Kiswahili cha kawaida kinachoweza kutaja eneo la kukusanyika bila kulazimisha maana finyu.
- source_word: פֶּתַח
  choice: mlango
  rationale: פֶּתַח ni nafasi au sehemu ya kuingilia. “Mlango” ni neno la kawaida la Kiswahili kwa sehemu ya kuingilia, bila kudai hasa kuwa ni jani la mlango.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Kirai hiki kinataja hema ambalo ni mahali pa kukutana kwa wakati uliowekwa. “Hema la Kukutania” ni tafsiri iliyo wazi na yenye matumizi mapana katika Kiswahili cha Biblia.
theological_decisions: []
