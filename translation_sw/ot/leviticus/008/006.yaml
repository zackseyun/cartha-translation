  text: Kisha Musa akawaleta Haruni na wanawe karibu, akawaosha kwa maji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akawaleta karibu
  rationale: Hifili ya קרב humaanisha kuwaleta karibu au kuwasogeza mbele. Katika muktadha huu wa kuwekwa wakfu, usemi huu unahifadhi wazo la kuwakaribisha mahali pa ibada bila kuongeza dhana isiyotajwa ya kuwatambulisha rasmi.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Katika muktadha huu בנים inawahusu wana wa kiume wa Haruni wanaowekwa wakfu kuwa makuhani; ‘wanawe’ ni sahihi na ya kawaida.
- source_word: וַיִּרְחַץ
  choice: akawaosha
  rationale: Kitenzi רחץ kina maana ya kuosha au kuogesha. ‘Akawaosha’ ni cha kawaida katika Kiswahili na hakibainishi isivyofaa kama ilikuwa kuosha sehemu fulani tu au mwili wote.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiambishi cha yambwa ‘-wa-’ kinawarejelea Haruni na wanawe kwa pamoja.
- source_word: בַּמָּיִם
  choice: kwa maji
  rationale: Kihusishi ב kinaweza kuonyesha chombo au njia iliyotumiwa; ‘kwa maji’ ni usemi wa asili wa Kiswahili unaoonyesha maji kuwa ndiyo yaliyotumiwa kuwaosha.
- source_word: וַ
  choice: Kisha / aka-
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matendo. ‘Kisha’ pamoja na viambishi vya usimulizi vya ‘aka-’ huwasilisha mfuatano huo kwa Kiswahili cha kawaida bila kurudia ‘na’ kimakanika.
