base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Aliyaosha matumbo na miguu kwa maji, kisha Musa akamteketeza kondoo dume mzima juu ya madhabahu. Hiyo ilikuwa sadaka ya kuteketezwa, yenye harufu ya kumpendeza Yahweh, sadaka iliyotolewa kwa moto[a] kwa Yahweh, kama Yahweh alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya moto.”
    reason: Mbadala mfupi wa usemi unaotafsiri אִשֶּׁה, yaani sadaka inayohusishwa na moto wa madhabahu.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: matumbo
  rationale: Katika muktadha wa dhabihu, neno hili linarejelea sehemu za ndani za mnyama. “Matumbo” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: הַכְּרָעַיִם
  choice: miguu
  rationale: Neno hili linataja miguu, hasa sehemu zake za chini; “miguu” ni tafsiri wazi na ya kawaida.
- source_word: רָחַץ בַּמָּיִם
  choice: aliyaosha ... kwa maji
  rationale: Inahifadhi kitenzi cha kuosha na kutajwa wazi kwa maji katika Kiebrania.
- source_word: וַיַּקְטֵר
  choice: akamteketeza
  rationale: Katika ibada za madhabahuni, kitenzi hiki kinaeleza kuchoma dhabihu ili ipae kama moshi. “Akamteketeza” ni cha asili katika Kiswahili na kinafaa kwa sadaka ya kuteketezwa.
- source_word: כָּל הָאַיִל
  choice: kondoo dume mzima
  rationale: Inabainisha kwamba mnyama wote aliteketezwa, si sehemu yake tu.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Ni usemi wa kawaida unaowasilisha mahali dhabihu ilipoteketezwa.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni jina linalotambulika la aina ya dhabihu iliyoteketezwa madhabahuni.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza Yahweh
  rationale: Inahifadhi taswira ya harufu na maana ya dhabihu kukubaliwa au kumpendeza Mungu bila kuiondoa taswira hiyo.
- source_word: אִשֶּׁה
  choice: sadaka ya moto
  rationale: Neno linahusu sadaka inayohusiana na moto wa madhabahu. Tafsiri hii ni fupi, inaeleweka, na haichanganywi na sadaka ya nafaka; mbadala umeonyeshwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama Yahweh alivyomwamuru Musa
  rationale: Inahifadhi kauli ya hitimisho kwamba Musa alitenda sawasawa na agizo la Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya לְרֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza Yahweh
  alternative: yenye harufu nzuri / yenye harufu ya kutuliza
  rationale: Chaguo hili linahifadhi sitiari ya kihisia iliyomo katika lugha ya dhabihu na wazo la kukubalika mbele za Mungu, bila kuifafanua kupita maandishi.
- issue: Ufasiri wa אִשֶּׁה
  choice: sadaka ya moto
  alternative: sadaka iliyotolewa kwa moto
  rationale: Maana yake halisi na asili yake ya kimofolojia zina mjadala fulani, lakini katika muktadha huu inahusu sadaka ya madhabahuni inayoteketezwa. Mbadala umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kisasa lakini yenye heshima. Muundo wa sentensi umewekwa wazi kwa msomaji wa kawaida, huku istilahi za dhabihu na taswira za Kiebrania zikihifadhiwa.
