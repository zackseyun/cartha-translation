lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza simulizi kwa tukio linalofuata. Katika Kiswahili cha sasa, “Kisha” huonyesha mfuatano huo kwa kawaida; “akasema” huwasilisha kitendo cha kusema kwa ufasaha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi wa Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi “sema,” Kiswahili sanifu hutumia muundo wa kawaida “akasema na Musa” kumtaja anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika fomula hii, infinitivu ya Kiebrania inaanzisha maneno yanayofuata. Kwa kuwa Kiswahili “akasema na Musa, akisema” kingekuwa kizito na cha kurudia, alama ya nukta mbili huwasilisha kazi yake kwa kawaida bila kupoteza kwamba hotuba inafuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi יהוה, si cheo cha Kiebrania cha “Bwana.” “Yahwe” hulihifadhi kama jina na ni unukuzi wa kawaida wa Kiswahili, huku tanbihi ikitaja mapokeo mengine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa asili; nukta mbili huandaa hotuba ya mstari unaofuata.
