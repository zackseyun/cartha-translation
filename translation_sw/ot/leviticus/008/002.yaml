  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: sw
  text: “Mchukue Haruni pamoja na wanawe, mavazi, mafuta ya upako, ng’ombe dume wa sadaka ya dhambi[a], kondoo dume wawili, na kikapu cha mikate isiyotiwa chachu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania linaweza kutaja sadaka inayohusiana na dhambi na utakaso wa kiibada.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Mchukue
  rationale: Ni amri ya nafsi ya pili umoja kutoka לקח. “Mchukue” ni ya moja kwa moja na haiingizi kwa lazima wazo la kumleta kutoka mahali pengine.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Jina limetolewa kwa umbo la Kiswahili lililozoeleka katika tafsiri za Biblia.
- source_word: בָּנָיו אִתּוֹ
  choice: pamoja na wanawe
  rationale: Huhifadhi maana ya wana wa Haruni kuwa pamoja naye, huku ikitoa Kiswahili cha kawaida na kisicho na urudiaji mzito.
- source_word: הַבְּגָדִים
  choice: mavazi
  rationale: Neno hili lina maana ya jumla ya mavazi; muktadha unaonyesha kuwa ni mavazi ya kikuhani bila kulazimisha istilahi ya kiufundi zaidi.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya kutiwa wakfu
  rationale: Hutoa kwa lugha ya kawaida matumizi ya mafuta hayo katika tendo la kumweka mtu au kitu wakfu; “mafuta ya upako” ni mbadala unaowezekana lakini si wazi sawa kwa wasomaji wote.
- source_word: פַּר הַחַטָּאת
  choice: ng’ombe dume wa sadaka ya dhambi
  rationale: פַּר ni ng’ombe dume, na חַטָּאת hapa hutaja aina ya sadaka. Tafsiri hii inadumisha istilahi iliyozoeleka huku tanbihi ikihifadhi maana mbadala ya utakaso.
- source_word: שְׁנֵי הָאֵילִים
  choice: kondoo dume wawili
  rationale: Ni tafsiri ya moja kwa moja ya idadi na aina ya wanyama wanaotajwa.
- source_word: סַל הַמַּצּוֹת
  choice: kikapu cha mikate isiyotiwa chachu
  rationale: מַצּוֹת ni mikate au vyakula vya mkate visivyo na chachu. Wingi “mikate” unasikika kwa kawaida pamoja na “kikapu” katika Kiswahili.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa sadaka
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kusisitiza dhambi au utakaso wa kiibada. Muktadha unahitaji maana ya sadaka, lakini hauondoi mvutano huo; kwa hiyo tafsiri iliyozoeleka imo katika matini na mbadala umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Orodha imeunganishwa kwa mtiririko wa kawaida kwa kutumia “pamoja na,” huku vipengele vyote vya Kiebrania vikihifadhiwa. Alama ya tanbihi imewekwa baada ya istilahi inayofafanuliwa.
