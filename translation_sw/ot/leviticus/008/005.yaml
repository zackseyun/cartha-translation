  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: sw
  text: Musa akasema kwa kusanyiko, “Hili ndilo jambo ambalo Yahweh ameamuru lifanywe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akaliambia
  rationale: Waw-consecutive inaendeleza simulizi; “akaliambia” ni mtiririko wa kawaida wa Kiswahili na pia huonyesha kwamba Musa alisema maneno haya kwa kusanyiko.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno עֵדָה hapa linamaanisha jumuiya ya Israeli iliyokusanyika; “kusanyiko” huhifadhi maana ya kundi lililokusanywa katika muktadha huu.
- source_word: זֶה הַדָּבָר
  choice: Hili ndilo jambo
  rationale: Huhifadhi muundo wa demonstrative pamoja na nomino, huku likiwa la asili na lenye hadhi katika Kiswahili.
- source_word: צִוָּה
  choice: ameamuru
  rationale: Kauli timilifu ya Kiebrania inaonyesha amri iliyotolewa kabla na yenye umuhimu kwa tendo linalofanyika sasa; “ameamuru” huwasilisha hilo vizuri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linatoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לַעֲשׂוֹת
  choice: lifanywe
  rationale: Ingawa infinitivi ya Kiebrania ina umbo tendaji, jambo lililoamriwa ndilo linalopaswa kutekelezwa; kauli ya kutendwa ni ya kawaida na wazi katika Kiswahili hapa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina maalumu יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya לַעֲשׂוֹת
  choice: lifanywe
  alternative: kulifanya
  rationale: Kiebrania kinaweza kuwasilishwa kwa umbo tendaji, lakini muktadha unalenga jambo lililoamriwa kutekelezwa. “Lifanywe” huonyesha maana hiyo bila kuamua ni nani hasa anayelifanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka. “Kusanyiko” linafaa kwa jumuiya ya Israeli iliyokusanyika, na “Hili ndilo jambo” huhifadhi uzito wa muundo wa Kiebrania bila kuwa mgumu.
