base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: sw
  text: Musa akamchinja, akachukua kiasi cha damu yake, na kuipaka juu ya ndewe ya sikio la kulia la Aroni[a], juu ya kidole gumba cha mkono wake wa kulia, na juu ya kidole kikubwa cha mguu wake wa kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ncha ya sikio la kulia la Aroni.”
    reason: Neno תְּנוּךְ linaweza kumaanisha ndewe au ncha ya nje ya sikio.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: akamchinja
  rationale: Katika muktadha wa dhabihu, kitenzi hiki kinaonyesha kuchinja kwa ibada, si kuua kwa maana ya jumla. Kirejeleo cha mnyama kinaeleweka kutokana na muktadha wa karibu.
- source_word: מִדָּמוֹ
  choice: kiasi cha damu yake
  rationale: Kihusishi מִן hapa kinaonyesha kuwa Musa alichukua sehemu ya damu, wala si damu yote.
- source_word: תְּנוּךְ אֹזֶן
  choice: ndewe ya sikio
  rationale: “Ndewe ya sikio” ni istilahi ya kawaida ya sehemu ya nje ya chini ya sikio; kwa kuwa neno la Kiebrania linaweza pia kueleweka kuwa ncha ya sikio, uwezekano huo umehifadhiwa katika tanbihi.
- source_word: הַיְמָנִית
  choice: la kulia / wa kulia
  rationale: Vivumishi hivi vinabainisha sikio, mkono, na mguu wa upande wa kulia kwa Kiswahili cha kawaida.
- source_word: בֹּהֶן יָדוֹ
  choice: kidole gumba cha mkono wake
  rationale: בֹּהֶן linapotumiwa kuhusu mkono humaanisha kidole gumba.
- source_word: בֹּהֶן רַגְלוֹ
  choice: kidole kikubwa cha mguu wake
  rationale: בֹּהֶן linapotumiwa kuhusu mguu humaanisha kidole kikubwa cha mguu.
- source_word: וַיִּתֵּן עַל
  choice: kuitia kwenye
  rationale: Usemi huu unaeleza kwa lugha ya kawaida kuweka damu juu ya sehemu zilizotajwa bila kuongeza ufafanuzi wa kiibada usiomo katika matini.
theological_decisions:
- issue: Kupakwa kwa damu ya dhabihu kwenye sehemu za mwili wa Aroni
  choice: Kitendo kimesimuliwa moja kwa moja bila kuingiza maana ya kiishara katika matini.
  alternative: Kuongeza maelezo kwamba damu hiyo iliwakilisha kuwekwa wakfu kwa masikio, mikono, na miguu ya Aroni.
  rationale: Aya yenyewe inasimulia tendo la kiibada lakini haifafanui maana yake ya kiishara; tafsiri haipaswi kuongeza dai la kiteolojia lisilotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la kiibada. “Ndewe ya sikio” ni sahihi na fupi; tanbihi huhifadhi uwezekano wa “ncha ya sikio.”
