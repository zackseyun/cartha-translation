  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: sw
  text: Akaweka vitu hivyo vyote katika viganja vya Haruni na katika viganja vya wanawe[a], kisha akavitikisa kama sadaka ya kutikiswa mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya viganja vya Haruni na juu ya viganja vya wanawe.” Kihusishi cha Kiebrania kwa kawaida humaanisha “juu ya,” lakini hapa maana ni kwamba vitu viliwekwa katika viganja vyao vya kupokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Akaweka
  rationale: Kitenzi נתן kinaweza kumaanisha kutoa au kuweka; hapa muktadha wa ibada unaonyesha kitendo cha kuweka sehemu za sadaka mikononi.
- source_word: אֶת הַכֹּל
  choice: vitu hivyo vyote
  rationale: Maneno haya yanarejelea sehemu zote za sadaka zilizotajwa katika mstari uliotangulia; kiwakilishi “hivyo” kinaweka rejeo hilo wazi kwa Kiswahili cha kawaida.
- source_word: עַל כַּפֵּי
  choice: katika viganja vya
  rationale: כַּף ni kiganja, na ingawa עַל kwa kawaida ni “juu ya,” “katika viganja” linaonyesha kwa kawaida zaidi vitu vilivyowekwa katika mikono iliyokunjwa ili kuvishika.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: וְעַל כַּפֵּי בָנָיו
  choice: na katika viganja vya wanawe
  rationale: Muundo uliorudiwa wa Kiebrania umehifadhiwa, na בָנָיו imetafsiriwa kwa usahihi kuwa wanawe wa kiume katika ibada hii ya kuwaweka wakfu kuwa makuhani.
- source_word: וַיָּנֶף אֹתָם
  choice: kisha akavitikisa
  rationale: Hiphil ya נוף inaeleza kitendo cha kiibada cha kuwasilisha kwa kutikisa; kiambishi “vi-” kinarejelea vitu vilivyowekwa viganjani, si Haruni na wanawe.
- source_word: תְּנוּפָה
  choice: kama sadaka ya kutikiswa
  rationale: Hili ni neno la kiibada linalotaja sadaka inayowasilishwa kwa kitendo cha kuitikisa.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Usemi huu unaonyesha kitendo cha ibada kilichofanywa mbele ya uwepo wa Yahwe.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linawakilisha jina la Mungu lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo, huku likitumia tahajia ya kawaida ya Kiswahili.
- issue: Maana ya kiwakilishi אֹתָם
  choice: -vi- katika “akavitikisa,” kikirejelea vitu vya sadaka
  alternative: Kukichukulia kuwa kinawarejelea Haruni na wanawe
  rationale: Kisarufi na kimuktadha, kiwakilishi kinarejelea sehemu za sadaka zilizowekwa katika viganja vyao, ambazo ndizo zilizotikiswa kama sadaka.
- issue: Neno la kifamilia בָנָיו
  choice: wanawe
  alternative: watoto wake
  rationale: Katika muktadha huu neno linawahusu wana wa kiume wa Haruni waliowekwa wakfu kuwa makuhani; “watoto wake” lingeondoa ubainifu huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Viganja” huhifadhi maana mahususi ya כַּפֵּי, na “sadaka ya kutikiswa” hudumisha istilahi ya kiibada pamoja na uhusiano wake na kitenzi “akavitikisa.”
