base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: sw
  text: Kama ilivyofanywa siku hii[a], ndivyo Yahwe alivyoamuru ifanywe, kwa kusudi la kufanya upatanisho kwa ajili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata umbo la kauli ya kutenda kwa karibu zaidi, “Kama alivyofanya siku hii, ndivyo Yahwe alivyoamuru kufanya, kwa kusudi la kufanya upatanisho kwa ajili yenu.” Kitenzi cha kwanza cha Kiebrania kina umbo la nafsi ya tatu umoja wa kiume, lakini mtendaji hajatambulishwa kwa jina.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kama ... ndivyo
  rationale: Muundo huu wa Kiswahili unaonyesha wazi ulinganisho unaoanzishwa na neno la Kiebrania na kuunganisha tendo la siku hiyo na amri iliyotolewa.
- source_word: עָשָׂה
  choice: ilivyofanywa
  rationale: Ingawa kitenzi cha Kiebrania kiko katika nafsi ya tatu umoja wa kiume, mtendaji hajatajwa wazi na kinarejelea ibada iliyotekelezwa; kauli ya kutendwa ni ya kawaida na haiongezi mtendaji.
- source_word: בַּיּוֹם הַזֶּה
  choice: leo
  rationale: Neno hili linaeleza kwa lugha ya kawaida ya Kiswahili siku hiyo ya ibada inayokuwa ikiendelea; maana yake ni ‘siku hii’.
- source_word: צִוָּה
  choice: alivyoamuru
  rationale: Wakati uliopita unaonyesha amri ya Yahwe iliyotangulia utekelezaji wa ibada, huku muundo wa ‘ndivyo ... alivyoamuru’ ukiwa wa asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehifadhiwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: לַעֲשֹׂת
  choice: ifanywe
  rationale: Kauli ya kutendwa inaendeleza mwangwi wa kitenzi עשה na kuepuka kumtaja mtendaji ambaye Kiebrania hakumtaji wazi.
- source_word: לְכַפֵּר
  choice: ili kufanya upatanisho
  rationale: Kishazi hiki kinahifadhi lugha ya kikuhani kuhusu kusudi la ibada bila kufafanua kupita kiasi jinsi upatanisho huo unavyofanya kazi.
- source_word: עֲלֵיכֶם
  choice: kwa ajili yenu
  rationale: Pamoja na כפר, kihusishi hiki kinaonyesha kwamba upatanisho unafanywa kwa niaba au manufaa yao.
theological_decisions:
- issue: Maana ya כפר katika muktadha wa dhabihu
  choice: kufanya upatanisho kwa ajili yenu
  alternative: kuwapatanisha; kufanya kafara kwa ajili yenu
  rationale: ‘Kufanya upatanisho’ huhifadhi maana pana ya kiibada ya neno la Kiebrania. ‘Kuwapatanisha’ lingeweza kusisitiza matokeo ya uhusiano, na ‘kufanya kafara’ lingeweza kuchanganya tendo la upatanisho na dhabihu yenyewe.
- issue: Mtendaji wa vitenzi עשה
  choice: 'kauli ya kutendwa: ilivyofanywa ... ifanywe'
  alternative: 'kauli ya kutenda: alivyofanya ... afanye'
  rationale: Kiebrania kina umbo la nafsi ya tatu umoja wa kiume lakini hakimtaji mtendaji kwa jina. Kauli ya kutendwa hulinda kutotajwa huko bila kuamua kimya kimya kwamba mtendaji ni Musa, Haruni, au mtu mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaofaa muktadha wa ibada. ‘Leo’ ni ya kawaida zaidi kuliko ‘siku hii,’ huku tanbihi ikihifadhi uwezekano wa kufuata umbo la Kiebrania kwa karibu zaidi.
