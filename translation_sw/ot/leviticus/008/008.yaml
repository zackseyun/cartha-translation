  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: sw
  text: Akaweka kifuko cha kifuani juu yake[a], kisha akaweka Urimu na Thumimu[b] ndani ya kifuko hicho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bamba la kifuani.” Neno la Kiebrania חֹשֶׁן linataja kifaa cha kuhani mkuu kilichovaliwa kifuani; “kifuko cha kifuani” huepuka kudokeza kwamba kilikuwa kinga ya kivita.
    reason: lexical_alternative
  - marker: b
    text: “Urimu” na “Thumimu” ni istilahi za ibada za Kiebrania zilizotoholewa kwa sauti. Asili yake hasa na namna ya matumizi yake havijulikani kwa uhakika.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: akamwekea
  rationale: Kitenzi שׂוּם humaanisha kuweka au kutia. Hapa muundo wa ‘akamwekea’ unaonyesha kwa kawaida kwamba Musa alikiweka kifuko juu ya Haruni katika tendo la kumvika.
- source_word: עָלָיו
  choice: -m- katika ‘akamwekea’
  rationale: Kiambishi cha yambwa katika muundo huu kinamrejelea Haruni kama mtu aliyewekewa kifuko; maana ya עָלָיו inadumishwa kwa Kiswahili cha kawaida bila kulazimisha usemi mzito ‘juu yake.’
- source_word: הַחֹשֶׁן
  choice: kifuko cha kifuani
  rationale: Neno hili linataja chombo cha kuhani mkuu kilichovaliwa kifuani na ambacho Urimu na Thumimu ziliwekwa ndani yake. ‘Kifuko cha kifuani’ kinaeleza kazi na mahali pake bila kudokeza vazi la kivita.
- source_word: וַיִּתֵּן
  choice: akaweka
  rationale: Katika muktadha huu נָתַן ina maana ya kuweka kitu mahali, si kumpa mtu kitu.
- source_word: אֶל הַחֹשֶׁן
  choice: ndani ya kifuko hicho
  rationale: Ingawa אֶל mara nyingi ni ‘kwenda’ au ‘kwa,’ hapa muktadha unaonyesha kwamba vitu hivyo viliwekwa ndani ya kifuko. Kirai hiki ni cha kawaida na wazi katika Kiswahili.
- source_word: הָאוּרִים
  choice: Urimu
  rationale: Hili ni jina maalumu la ibada ambalo umbo na namna yake ya kutumiwa havijulikani kwa hakika. Kulitohoa kwa sauti kunahifadhi upekee wake bila kulifasiri kwa kubahatisha.
- source_word: הַתֻּמִּים
  choice: Thumimu
  rationale: Hili pia ni jina maalumu la ibada linalotajwa pamoja na Urimu. Umbo la kutoholewa linadumisha istilahi ya Kiebrania na huepuka maana ya kubuniwa kama ‘ukamilifu.’
theological_decisions:
- issue: Jinsi ya kutafsiri vitu vya kikuhani אוּרִים וְתֻמִּים
  choice: Kutoholewa kama ‘Urimu na Thumimu’
  alternative: ‘nuru na ukamilifu’ au ‘kura takatifu’
  rationale: Maumbile na utaratibu wa matumizi ya vitu hivi havijulikani kwa uhakika, ingawa vilihusishwa na kutafuta uamuzi wa Mungu. Kutoholewa kunahifadhi upekee na utata uliomo katika maandishi bila kuingiza maelezo ya kimadhehebu au dhana isiyothibitishwa.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia mtiririko wa masimulizi unaoeleweka kwa urahisi, huku ikihifadhi hatua mbili tofauti: kumwekea Haruni kifuko na kisha kuweka vitu ndani yake. Majina Urimu na Thumimu yametoholewa badala ya kufasiriwa ili kudumisha utata halisi wa maandishi.'
