  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Kisha Musa akawaleta wana wa Aroni karibu[a], akawavika makanzu, akawafunga mishipi viunoni[b], na kuwafunga kofia vichwani, kama vile Yahweh[c] alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawasilisha wana wa Aroni.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuleta karibu” au “kuwasilisha” katika mazingira ya ibada.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “akawafunga kwa mshipi.” Nomino ya Kiebrania iko katika umoja lakini ina maana ya mgawanyo—yaani, kila mwana alifungwa mshipi wake wa kikuhani.
    reason: lexical_alternative
  - marker: c
    text: Jina la Mungu katika Kiebrania ni YHWH, ambalo kwa kawaida limetafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akawaleta ... karibu
  rationale: Hifili ya קרב ina maana ya kuwaleta karibu au kuw प्रस्तुतisha katika mazingira ya ibada. Tafsiri hii inadumisha maana ya kukaribia kwa ajili ya kuwekwa wakfu bila kuifanya kuwa istilahi maalumu kupita kiasi.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania, huku ikidumisha uhusiano wa kifamilia.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: akawavika kanzu
  rationale: Hifili ya לבשׁ humaanisha kumvika mtu, na כֻּתֹּנֶת ni vazi refu la msingi linalofanana na shati; ‘kanzu’ ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: akawafunga mishipi viunoni
  rationale: חגר hueleza kufunga vazi kiunoni, na אַבְנֵט ni mshipi wa kitambaa wa kikuhani. Wingi wa Kiswahili unaonyesha kwa kawaida kwamba kila mwana alifungwa mshipi wake.
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: kuwafunga kofia vichwani
  rationale: חבשׁ hapa ni kufunga au kuweka kwa kukaza vazi la kichwani; מִגְבָּעוֹת ni kofia maalumu za makuhani wa kawaida, tofauti na kilemba cha kuhani mkuu.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: Kauli hii ya kurudiwa inasisitiza utekelezaji sawasawa wa agizo, huku jina la Mungu יְהוָה likihifadhiwa kama jina binafsi.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יְהוָה. ‘Yahwe’ huhifadhi jina binafsi badala ya kulibadilisha kwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Mfuatano wa vitenzi unaakisi hatua za ibada katika Kiebrania, na istilahi za mavazi zimechaguliwa kwa uwazi bila kuchanganya kofia za makuhani wa kawaida na kilemba cha kuhani mkuu.
