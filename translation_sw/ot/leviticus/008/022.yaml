base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: sw
  text: Kisha akamleta mbele kondoo dume wa pili[a], kondoo dume wa kuwekwa wakfu, naye Aroni na wanawe wakaweka mikono yao juu ya kichwa cha kondoo huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kondoo dume wa kuwekwa katika huduma ya ukuhani.” Neno la Kiebrania ni istilahi maalumu ya ibada ya kuwaingiza makuhani katika huduma yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Kisha akamleta karibu
  rationale: Hifili ya קרב ina maana ya kuleta karibu au kuwasilisha. Tafsiri hii inadumisha lugha ya kiibada na mtiririko wa simulizi.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: kondoo dume wa pili
  rationale: אַיִל ni kondoo dume, na הַשֵּׁנִי ni nambari ya mpangilio ‘wa pili’; hivyo kirai kinamtambulisha mnyama wa pili katika mfululizo wa ibada.
- source_word: אֵיל הַמִּלֻּאִים
  choice: kondoo dume wa kuwekwa wakfu
  rationale: מִלֻּאִים ni istilahi maalumu ya kikuhani inayohusu ibada ya kuwaingiza makuhani katika huduma. ‘Kuwekwa wakfu’ ni Kiswahili cha kawaida na chenye hadhi kinachoeleza tendo hilo bila kufuata kihalisi maana ya ‘kujaza.’
- source_word: וַיִּסְמְכוּ
  choice: wakaweka
  rationale: Katika dhabihu, סמך humaanisha kuweka au kuegemeza mikono juu ya mnyama. ‘Wakaweka’ ni wazi na ya kawaida katika Kiswahili.
- source_word: אֶת יְדֵיהֶם
  choice: mikono yao
  rationale: Tafsiri inadumisha wingi ulio katika Kiebrania.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: juu ya kichwa cha kondoo huyo
  rationale: Kirai hiki kinaonyesha wazi mahali pa tendo la kiibada; ‘huyo’ hurejelea kwa kawaida kondoo dume aliyetajwa tayari.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aroni na wanawe
  rationale: בָנָיו hapa inawahusu wana wa kiume wa Aroni wanaowekwa katika ukuhani; ‘wanawe’ ni sahihi na ya kawaida.
theological_decisions:
- issue: Tafsiri ya istilahi ya kikuhani מִלֻּאִים katika muktadha wa dhabihu
  choice: kondoo dume wa kuwekwa wakfu
  alternative: kondoo dume wa kuwekwa katika huduma ya ukuhani
  rationale: ‘Kuwekwa wakfu’ linafaa kwa ibada ya kuwaingiza Aroni na wanawe katika cheo na huduma ya ukuhani. Tanbihi inadumisha uwezekano wa kueleza maana hiyo kwa lugha mahususi zaidi ya kusimikwa katika ukuhani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida huku ukidumisha marudio na maana ya kiibada ya matini ya Kiebrania.
