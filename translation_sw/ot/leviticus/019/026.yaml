  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: sw
  text: Msile juu ya damu.[a] Msifanye uaguzi wala msitafsiri ishara za ubashiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pamoja na damu.” Usemi wa Kiebrania ni mgumu; huenda unahusu kula nyama ambayo bado ina damu ndani yake au kushiriki mlo wa kiibada unaohusiana na damu.
    reason: alternative_reading
  - marker: b
    text: Au “kupiga ramli”; kwa tafsiri ya kimapokeo, “kuchagua nyakati.” Maana kamili ya kitenzi cha Kiebrania si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: Msile
  rationale: Kitenzi kilichokanushwa katika sheria kinaonyesha katazo. “Msile” ni amri hasi ya kawaida, iliyo wazi na yenye heshima katika Kiswahili.
- source_word: עַל הַדָּם
  choice: juu ya damu
  rationale: Kirai hiki cha Kiebrania ni kigumu na maana yake kamili haijulikani kwa hakika. Tafsiri ya karibu “juu ya damu” huhifadhi kihusishi על na kuepuka kuamua kimya kimya ikiwa katazo linahusu kula nyama yenye damu au kushiriki mlo wa kiibada unaohusiana na damu.
- source_word: תְנַחֲשׁוּ
  choice: msifanye uaguzi
  rationale: Katika shina hili, נחשׁ hurejelea shughuli ya kutafuta maarifa kwa njia za uaguzi. “Kufanya uaguzi” ni Kiswahili cha sasa kinachoeleweka na hakitumii istilahi ya kizamani.
- source_word: תְעוֹנֵנוּ
  choice: wala kutabiri kwa ishara
  rationale: Maana ya kitenzi hiki si hakika kabisa, lakini kwa kawaida huhusishwa na kupiga ramli, kutafuta ishara, au kuchagua nyakati kwa ishara. “Kutabiri kwa ishara” huwasilisha maana inayowezekana kwa lugha inayoeleweka, huku tanbihi ikihifadhi njia nyingine za kutafsiri.
theological_decisions:
- issue: Jinsi ya kutafsiri kwa umahususi katazo lisilo wazi עַל הַדָּם
  choice: Kuhifadhi tafsiri ya karibu, “juu ya damu,” katika matini kuu
  alternative: “pamoja na damu,” “wakati damu ingali ndani yake,” au “katika mlo wa kiibada unaohusiana na damu”
  rationale: Jambo hasa linalokatazwa linabishaniwa. Huenda ni kula nyama yenye damu, kushiriki mlo wa kiibada unaohusiana na damu, au desturi nyingine. Matini kuu haiamui jambo hilo bila ushahidi wa kutosha; uwezekano wa tafsiri unaelezwa katika tanbihi.
- issue: Uhusiano na tofauti kati ya תְנַחֲשׁוּ na תְעוֹנֵנוּ
  choice: Kutumia “kufanya uaguzi” na “kutabiri kwa ishara” kama makatazo mawili yanayohusiana lakini yasiyofananishwa kabisa
  alternative: Kutafsiri yote mawili kwa jumla kama “kupiga ramli,” au kutafsiri la pili “kuchagua nyakati”
  rationale: Vitenzi hivyo vina nyanja za maana zinazokaribiana, lakini si lazima viwe visawe kamili. Tafsiri iliyochaguliwa huhifadhi tofauti fulani bila kudai uhakika mkubwa kuliko unaoruhusiwa na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa makatazo ni mfupi na wa moja kwa moja. Usemi usio wa kawaida “juu ya damu” umehifadhiwa kwa makusudi ili kutoficha utata wa Kiebrania; tanbihi inasaidia msomaji bila kuufanya uwezekano mmoja kuwa wa lazima.
