  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: sw
  text: Yeyote atakayekula nyama hiyo atabeba hatia yake[a], kwa maana amekinajisi kitu kitakatifu cha Yahwe[b]; na mtu huyo atakatiliwa mbali na watu wake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atachukua uovu wake.” Nahau ya Kiebrania inaweza kumaanisha kuwajibika kwa kosa na matokeo yake.
    reason: lexical_alternative
  - marker: b
    text: “Kitu kitakatifu cha Yahwe” ni kile kilichowekwa wakfu kwa Yahwe; hapa ni nyama ya dhabihu.
    reason: cultural_note
  - marker: c
    text: Kiebrania husema kihalisi, “nafsi hiyo itakatiliwa mbali.” Hii ni kauli ya adhabu ya agano, lakini hapa haijaelezwa ikiwa inamaanisha kifo, kufukuzwa, au hukumu ya moja kwa moja ya Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: Yeyote atakayekula nyama hiyo
  rationale: Kirai hiki humtaja mtu yeyote anayekula kile kinachozungumziwa. Kutaja ‘nyama hiyo’ kunarejesha wazi nyama ya dhabihu katika muktadha uliotangulia bila kubadili maana.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: atabeba hatia yake
  rationale: Nahau ya Kiebrania inahusisha kuwajibika kwa kosa pamoja na matokeo yake. ‘Atabeba hatia yake’ huhifadhi picha ya kubeba na uzito wake wa kisheria na kitheolojia.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaeleza sababu ya adhabu inayotajwa.
- source_word: קֹדֶשׁ יְהוָה
  choice: kitu kitakatifu cha Yahwe
  rationale: Tafsiri hii inabaki karibu na Kiebrania na haiongezi wazi neno ‘sadaka,’ ingawa muktadha unaonyesha kuwa kinachokusudiwa ni nyama ya dhabihu iliyowekwa wakfu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina binafsi la Mungu katika maandishi ya Kiebrania.
- source_word: חִלֵּל
  choice: amekitia unajisi
  rationale: Katika muktadha huu kitenzi kina maana ya kukitendea kilicho kitakatifu kana kwamba ni cha kawaida, hivyo kukivunjia utakatifu wake.
- source_word: וְנִכְרְתָה
  choice: ataondolewa
  rationale: Huhifadhi kauli ya adhabu ya agano kwa Kiswahili cha kawaida bila kuamua kama njia yake ni kifo, kufukuzwa, au hukumu ya moja kwa moja ya Mungu.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: Mtu huyo
  rationale: Neno נֶפֶשׁ katika lugha ya kisheria humaanisha mtu mzima, si sehemu isiyo ya kimwili pekee.
- source_word: מֵעַמֶּיהָ
  choice: kutoka miongoni mwa watu wake
  rationale: Hutoa kwa njia ya kawaida maana ya kutengwa na watu au jumuiya ambayo mkosaji ni sehemu yake.
theological_decisions:
- issue: Maana ya kauli ya adhabu וְנִכְרְתָה (‘atakatiliwa mbali’)
  choice: ataondolewa kutoka miongoni mwa watu wake
  alternative: atauawa; atafukuzwa katika jumuiya; ataondolewa kwa hukumu ya moja kwa moja ya Mungu
  rationale: Mstari hautaji wazi namna adhabu hiyo itakavyotekelezwa. Tafsiri inaacha mvutano huo bila kuchagua fasiri moja ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Yahwe’ limetumika kwa jina la Mungu. Nahau za kisheria zimewasilishwa kwa lugha ya asili huku utata halisi wa aina ya adhabu ukihifadhiwa.
