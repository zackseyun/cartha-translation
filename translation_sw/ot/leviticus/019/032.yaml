  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: sw
  text: Utasimama mbele ya mtu mwenye mvi[a], nawe utamheshimu mwanamume mzee[b], na utamcha Mungu wako. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mbele ya mvi.” Kiebrania kinatumia mvi kama taswira halisi ya uzee.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “utauheshimu uso wa mwanamume mzee”; neno la Kiebrania linaweza pia kumaanisha mzee mwenye hadhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: mbele ya mtu mwenye mvi
  rationale: Kwa kitenzi קום, מִפְּנֵי huonyesha kusimama mtu anapokuwapo kama ishara ya heshima. שֵׂיבָה ni ‘mvi’ na kwa upanuzi uzee; tafsiri hii inahifadhi taswira halisi ya Kiebrania huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: תָּקוּם
  choice: utasimama
  rationale: Qal imperfect hapa ina nguvu ya amri na humaanisha kuinuka au kusimama kwa heshima. ‘Utasimama’ ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: וְהָדַרְתָּ
  choice: nawe utamheshimu
  rationale: Piel ya הדר humaanisha kumpa mtu heshima au kumwonyesha staha; ‘utamheshimu’ huwasilisha amri hiyo bila kuifanya ibada ya kidini.
- source_word: פְּנֵי זָקֵן
  choice: mwanamume mzee
  rationale: Kirai hiki ni ‘uso wa mwanamume mzee/mzee’ kihalisi. Kiswahili cha kawaida huonyesha maana ya nahau kwa ‘kumheshimu mwanamume mzee,’ huku tanbihi ikihifadhi taswira ya ‘uso.’ Neno la Kiebrania ni umoja wa kiume.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: na utamcha Mungu wako
  rationale: Kitenzi ירא kinapotumiwa kwa Mungu hubeba hofu, kicho, na unyenyekevu. ‘Kumcha Mungu’ ni usemi wa kawaida wa Kiswahili unaohifadhi uzito huo wa kiagano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsia katika זָקֵן
  choice: mwanamume mzee
  alternative: mtu mzee; mzee
  rationale: Neno la Kiebrania ni umoja wa kiume. Tafsiri kuu inahifadhi alama hiyo badala ya kuifanya isiyo na jinsia, bila kudai kwamba kanuni ya heshima haiwahusu wanawake wazee.
- issue: Maana ya kumcha Mungu
  choice: utamcha Mungu wako
  alternative: utamheshimu sana Mungu wako
  rationale: ‘Kumcha’ huhifadhi mvutano wa Kiebrania kati ya hofu, kicho, na staha, badala ya kuupunguza kuwa heshima ya kawaida tu.
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Muundo ‘mtu mwenye mvi’ unaifanya taswira ya Kiebrania ieleweke kwa kawaida; ‘mwanamume mzee’ huhifadhi umoja wa kiume wa chanzo. Alama zote za tanbihi zimewekwa katika maandishi makuu.
