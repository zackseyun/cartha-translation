base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: sw
  text: “Sema na kusanyiko lote la wana wa Israeli[a], na uwaambie, ‘Iweni watakatifu[b], kwa maana mimi, Yahweh Mungu wenu, ni mtakatifu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kusanyiko lote la Waisraeli” au “jamii nzima ya Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “Mtakuwa watakatifu” au “Ni lazima muwe watakatifu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema na
  rationale: Amri ya Piel inaagiza Musa alihutubie kusanyiko; “sema na” ni ya moja kwa moja na ya kawaida katika Kiswahili sanifu.
- source_word: כָּל עֲדַת
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jumuiya ya agano inayotazamwa kwa pamoja; “kusanyiko lote” huhifadhi maana ya kijamii na uzito wa kifungu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi umbo la Kiebrania la kifamilia na la kiume, huku tanbihi ikitoa usemi wa kawaida zaidi unaorejelea jamii nzima.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Ni tafsiri ya asili ya Kiswahili ya mlolongo wa amri, bila kupoteza uelekeo kwa watu waliozungumziwa.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: Mtakuwa watakatifu
  rationale: Kivumishi pamoja na kitenzi kisichotimilika kinaweza kubeba nguvu ya wajibu au amri; umbo la wakati ujao huhifadhi muundo na sauti ya kisheria bila kuufanya amri wazi kupita chanzo.
- source_word: קָדוֹשׁ
  choice: mtakatifu
  rationale: “Mtakatifu” ni neno lililozoeleka na lenye upana wa maana ya קדוש; “aliyetengwa” pekee lingepunguza maana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi kiambishi cha nafsi ya pili wingi na usemi wa agano kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya utambulisho wa agano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; jamii nzima ya Israeli
  rationale: Maandishi makuu yanahifadhi taswira ya kifamilia ya chanzo. Tanbihi inaonyesha kwamba usemi huo unarejelea jamii ya Israeli kwa pamoja, bila kudai kwamba wanaume pekee ndio wanaosemwa.
- issue: Nguvu ya kauli קְדֹשִׁים תִּהְיוּ
  choice: Mtakuwa watakatifu
  alternative: Iweni watakatifu; Ni lazima muwe watakatifu
  rationale: Muundo wa Kiebrania unaweza kusikika kama tangazo lenye nguvu ya wajibu au amri. Tafsiri kuu huhifadhi umbo hilo na tanbihi huhifadhi uwezekano wa kuutafsiri kama amri ya moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. “Kusanyiko” huhifadhi sauti ya kijamii na ya kisheria; “Yahweh” huhifadhi jina la Mungu. Alama zote za tanbihi zimo katika maandishi makuu.
