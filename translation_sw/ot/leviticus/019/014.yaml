base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: sw
  text: 'Usimlaani kiziwi[a], wala usiweke kikwazo mbele ya kipofu; bali umche Mungu wako: Mimi ni Yahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia maumbo ya umoja wa kiume kwa “kiziwi” na “kipofu” kama mifano wakilishi katika sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: usimlaani
  rationale: Kitenzi קלל katika Piel hapa kinakataza kumlaani au kumtendea mtu kwa dharau. “Usimlaani” ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi uzito wa usemi huo.
- source_word: חֵרֵשׁ
  choice: mtu kiziwi
  rationale: Neno la Kiebrania ni umbo la umoja wa kiume linalotumiwa kama mfano wa kisheria. Kiswahili cha kawaida hueleza hali hii kwa “mtu kiziwi”; kuongeza “mwanamume” kungefanya jinsia iwe sehemu ya maana kwa nguvu kuliko ilivyo katika matumizi haya ya uwakilishi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi maana ya mahali ya לִפְנֵי na ni usemi wa kawaida katika Kiswahili.
- source_word: עִוֵּר
  choice: mtu kipofu
  rationale: Neno la Kiebrania ni umoja wa kiume unaotumika kama mfano wa kisheria. “Mtu kipofu” ni Kiswahili cha kawaida na kinaendana na muundo wa kifungu cha kwanza.
- source_word: תִתֵּן
  choice: usiweke
  rationale: Ingawa נתן mara nyingi humaanisha “kutoa,” katika muundo huu maana ya kawaida ni kuweka kitu mbele ya mtu.
- source_word: מִכְשֹׁל
  choice: kikwazo
  rationale: “Kikwazo” huweza kumaanisha kitu halisi kinachosababisha kujikwaa na pia huhifadhi mwangwi mpana wa kimaadili wa neno hilo.
- source_word: וְיָרֵאתָ
  choice: bali umche
  rationale: “Umche” huwasilisha hofu yenye heshima kwa Mungu. “Bali” huonyesha mlingano wa kimaadili kati ya kuwadhuru walio dhaifu kwa siri na kuwajibika mbele za Mungu, bila kubadili kiini cha waw.
- source_word: מֵאֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Pamoja na ירא, kihusishi מן hutambulisha mlengwa wa hofu; Kiswahili cha kawaida husema “umche Mungu wako.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Maumbo ya umoja wa kiume kama mifano wakilishi katika sheria
  choice: Kutumia “mtu kiziwi” na “mtu kipofu,” huku tanbihi ikieleza umbo la Kiebrania
  alternative: “mwanamume kiziwi” na “mwanamume kipofu”
  rationale: Kiebrania kina maumbo ya umoja wa kiume, lakini katika sheria hii yanafanya kazi kama mifano wakilishi. Kiswahili hakihitaji kuingiza jinsia ya kiume katika nomino hizi; “mwanamume” kingeweza kupotosha kana kwamba katazo linawahusu wanaume pekee.
- issue: Nguvu ya kishazi cha mwisho cha motisha
  choice: “bali umche Mungu wako”
  alternative: “nawe umche Mungu wako”
  rationale: Kishazi hiki kinaweka amri katika msingi wa kumheshimu Mungu, ambaye anaona hata dhuluma ambayo mwathiriwa hawezi kuisikia au kuiepuka. “Bali” huonyesha nguvu hiyo ya utofautishaji huku ikihifadhi uhusiano wa waw.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa amri ulio wazi, wa heshima na unaosomeka kwa urahisi. “Usimlaani … wala usiweke” ni muundo wa kawaida wa makatazo yanayofuatana; “Mimi ni Yahwe” huhifadhi tamko fupi na lenye uzito la Kiebrania.
