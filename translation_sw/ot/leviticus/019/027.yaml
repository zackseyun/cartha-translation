base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: sw
  text: Msikate nywele zilizo pembeni mwa vichwa vyenu kwa umbo la mviringo[a][b], wala msiharibu ukingo wa ndevu zenu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembe za vichwa vyenu.” Neno la Kiebrania linaweza kumaanisha ukingo, upande, au pembe.
    reason: lexical_alternative
  - marker: b
    text: Huenda hii inamaanisha kunyoa au kupunguza nywele za pembeni mwa kichwa kwa namna ya mviringo.
    reason: cultural_note
  - marker: c
    text: Au, “msiumbue” au “msiangamize ukingo wa ndevu zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: msikate ... kwa umbo la mviringo
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha kukata nywele kuzunguka ukingo wa kichwa kwa namna ya mviringo. Kauli hii ni ya kawaida na inaeleza tendo bila kulifanya kuwa kunyoa kabisa tu.
- source_word: פְּאַת רֹאשְׁכֶם
  choice: nywele zilizo pembeni mwa vichwa vyenu
  rationale: פֵּאָה inaweza kumaanisha ukingo, upande, au pembe. Hapa usemi huu unaweka wazi kuwa kinachokatwa ni nywele za pembeni mwa kichwa, huku wingi wa רֹאשְׁכֶם ukihifadhiwa.
- source_word: תַשְׁחִית
  choice: usiharibu
  rationale: Hifili ya שׁחת humaanisha kuharibu, kuangamiza, au kuumbua. ‘Usiharibu’ huhifadhi upana wa maana bila kubainisha njia fulani ya kukata au kunyoa.
- source_word: פְּאַת זְקָנֶךָ
  choice: kingo za ndevu zako
  rationale: ‘Kingo’ huwasilisha maana ya mipaka au sehemu za mwisho za ndevu kwa Kiswahili cha kawaida; wingi wa kimuktadha husaidia kueleza sehemu husika bila kuondoa maana ya msingi ya פֵּאָה.
- source_word: לֹא ... וְלֹא
  choice: msikate ... wala usiharibu
  rationale: Miundo ya kukataza imehifadhiwa. Kiswahili hutumia ‘wala’ kwa kawaida kuunganisha makatazo haya mawili.
theological_decisions:
- issue: Asili na sababu ya katazo
  choice: Kutaja matendo mahususi ya kukata nywele na kuharibu kingo za ndevu bila kuongeza sababu yake
  alternative: Kulieleza moja kwa moja kuwa katazo la desturi za kipagani, maombolezo, au mitindo yote ya kujipamba
  rationale: Mstari wenyewe unaamuru yasifanywe matendo haya, lakini hautaji wazi sababu yake. Tafsiri haipaswi kuingiza maelezo ya kitamaduni au ya kidini yasiyosemwa katika kifungu hiki.
- issue: Mabadiliko ya nafsi ya kisarufi
  choice: Kuhifadhi wingi katika sehemu ya kwanza na umoja katika sehemu ya pili
  alternative: Kusawazisha sehemu zote mbili ziwe katika wingi
  rationale: Kiebrania hubadilika kutoka nafsi ya pili wingi katika katazo la kwanza kwenda nafsi ya pili umoja katika la pili. Kuhifadhi mabadiliko hayo kunafuata ushahidi wa matini bila kulainisha tofauti halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. Kauli ‘kwa umbo la mviringo’ huepuka usemi mgumu wa moja kwa moja, na mabadiliko ya wingi kwenda umoja yamehifadhiwa kwa uaminifu kwa matini ya Kiebrania.
