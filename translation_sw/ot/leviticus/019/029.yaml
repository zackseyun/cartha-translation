base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: sw
  text: Usimvunjie heshima binti yako kwa kumfanya awe kahaba[a], ili nchi isije ikafanya ukahaba[b], na nchi ikajaa upotovu mkubwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kumsababisha afanye ukahaba” au “kwa kumwingiza katika ukahaba.” Kitenzi cha Kiebrania kinaonyesha kusababisha.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “ili nchi isije ikafanya ukahaba.” Hii ni sitiari ya jamii nzima kupotoshwa.
    reason: lexical_alternative
  - marker: c
    text: Au, “uasherati wa kuchukiza” au “uovu.” Neno la Kiebrania humaanisha upotovu mkubwa wa maadili, mara nyingi katika muktadha wa kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: usimtie unajisi
  rationale: Kitenzi חלל katika Piel kina maana ya kumfanya mtu au kitu kiwe najisi au kisicho kitakatifu. ‘Kumtia unajisi’ kinahifadhi msamiati wa utakatifu wa Mambo ya Walawi na kinaeleweka kwa Kiswahili cha kawaida.
- source_word: בִּתְּךָ
  choice: binti yako
  rationale: Ni neno la moja kwa moja la uhusiano wa kifamilia lenye kiambishi cha nafsi ya pili, umoja wa kiume.
- source_word: לְהַזְנוֹתָהּ
  choice: kwa kumfanya awe kahaba
  rationale: Hii ni infinitivu ya Hiphil ya זנה yenye kiambishi cha nafsi ya tatu, umoja wa kike; muundo wake unaonyesha kusababisha. Tafsiri hii inahifadhi wazi kwamba baba ndiye anayemsababisha binti yake kuingia katika ukahaba.
- source_word: תִזְנֶה הָאָרֶץ
  choice: nchi isije ikafanya ukahaba
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania inayoiwasilisha nchi kana kwamba inafanya ukahaba, badala ya kuigeuza kuwa kauli ya jumla kuhusu kuporomoka kwa maadili.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: na kujaa
  rationale: Katika muktadha wa onyo, umbo hili linaonyesha tokeo linaloweza kufuata; ‘na kujaa’ linaunganisha kwa kawaida matokeo hayo na nchi iliyotajwa.
- source_word: זִמָּה
  choice: upotovu mkubwa
  rationale: זִמָּה huonyesha uovu wa kuchukiza na uliopindukia, mara nyingi katika muktadha wa kingono. ‘Upotovu mkubwa’ ni lugha ya sasa na haibani maana iwe uasherati pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri sitiari ya nchi ‘kufanya ukahaba’
  choice: Kuhifadhi sitiari kwa kusema ‘nchi isije ikafanya ukahaba.’
  alternative: nchi isije ikapotoka kimaadili
  rationale: Kiebrania kinatumia lugha ya ukahaba kwa nchi au jamii nzima. Kuihifadhi hudumisha nguvu ya kimaadili na ya balagha bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Iwapo חלל itafsiriwe kwa neno linalohusiana na utakatifu
  choice: Kutumia ‘kumtia unajisi.’
  alternative: kumvunjia heshima
  rationale: Mambo ya Walawi hutofautisha mara kwa mara kilicho kitakatifu na kilicho najisi au cha kawaida. ‘Kumtia unajisi’ kinahifadhi mazingira hayo ya kitabu kuliko kauli ya jumla ya kuvunja heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya heshima, ya sasa, na inayoeleweka kwa wasomaji wa kawaida. ‘Kumtia unajisi’ hudumisha rejesta ya utakatifu ya Mambo ya Walawi, huku tanbihi zikifafanua muundo wa kusababisha na sitiari isiyo ya kawaida ya nchi kufanya ukahaba.
