base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: sw
  text: Msitende udhalimu katika kutoa hukumu. Usimpendelee maskini, wala usimpendelee mtu mkuu[b]; utamhukumu mwenzako kwa haki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uadilifu.”
    reason: lexical_alternative
  - marker: b
    text: Nahau za Kiebrania zinasema kihalisi “kuinua uso wa maskini” na “kuheshimu uso wa mtu mkuu”; hapa zinamaanisha kuonyesha upendeleo au deferensi kwa mtu wakati wa kutoa hukumu.
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: udhalimu katika kutoa hukumu
  rationale: Katika muktadha wa kisheria, kirai hiki kinakataa kupotosha haki wakati wa kuamua shauri. Tafsiri hii ni ya kawaida na inaweka wazi mazingira ya hukumu.
- source_word: תִשָּׂא פְנֵי דָל
  choice: usimpendelee maskini
  rationale: Nahau ya Kiebrania ya ‘kuinua uso’ humaanisha kumpa mtu upendeleo. דָל hapa ni mtu maskini au mwenye hali ya chini.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: usimstahi mtu mkuu
  rationale: Katika muktadha huu, ‘kuheshimu uso’ ni kumwonyesha mtu wa hadhi ya juu heshima inayoweza kupotosha hukumu. ‘Mtu mkuu’ huhifadhi maana pana ya hadhi au umashuhuri bila kuiwekea mipaka ya utajiri pekee.
- source_word: בְּצֶדֶק
  choice: kwa haki
  rationale: צֶדֶק huunganisha uadilifu wa kimaadili na haki ya kimahakama. ‘Kwa haki’ ni Kiswahili cha asili kinachobeba pande zote mbili kwa kiwango kizuri.
- source_word: תִּשְׁפֹּט עֲמִיתֶךָ
  choice: utamhukumu mwenzako
  rationale: ‘Mwenzako’ humaanisha mtu mwingine katika jamii, si jirani wa mahali tu. Umbo la amri la Kiebrania limetolewa kwa kauli ya sheria ya ‘utamhukumu.’
theological_decisions:
- issue: Maana ya צֶדֶק katika muktadha wa kisheria na kimaadili
  choice: kwa haki
  alternative: kwa uadilifu
  rationale: Neno la Kiebrania linaweza kusisitiza haki ya kimahakama au unyofu wa kimaadili. Matini kuu inatumia ‘kwa haki,’ huku tanbihi ikihifadhi ‘kwa uadilifu’ kama tafsiri halali.
- issue: Upendeleo kwa maskini na wenye hadhi
  choice: Kukataza upendeleo kwa pande zote mbili
  alternative: Kulifafanua katazo kuwa linawahusu wenye nguvu pekee
  rationale: Matini inakataza wazi kumpendelea maskini na pia kumstahi mtu mkuu katika hukumu; haitoi nafasi ya kuvuruga haki kwa sababu ya hali ya kijamii ya upande wowote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mabadiliko ya Kiebrania kutoka wingi katika katazo la kwanza kwenda umoja katika maagizo yanayofuata yamehifadhiwa kwa ‘Msitende’ kisha ‘Usimpendelee... usimstahi... utamhukumu.’
