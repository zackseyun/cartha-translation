base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: sw
  text: Kisha kuhani atamfanyia upatanisho mbele za Yahwe kwa kondoo dume wa sadaka ya hatia[a], kwa ajili ya dhambi aliyotenda; naye atasamehewa dhambi aliyotenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya kufidia kosa.” Neno la Kiebrania אָשָׁם linaweza kumaanisha hatia na pia upande wa kufidia au kurekebisha kosa katika dhabihu hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: atamfanyia upatanisho
  rationale: Katika sheria za kikuhani, כפר hueleza tendo la ibada ambalo kuhani humfanyia mtu ili kurekebisha uhusiano wake na Mungu. “Kumfanyia upatanisho” ni lugha ya kawaida na yenye hadhi katika muktadha huu.
- source_word: עָלָיו
  choice: -mfanyia
  rationale: Kiambishi cha yambwa pamoja na hali ya kutendea kinaonyesha kwamba tendo la upatanisho linafanywa kwa niaba yake.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhudumu wa ibada anayetajwa hapa; muktadha na muundo wa sentensi hufanya urejeo wake uwe bayana.
- source_word: בְּאֵיל הָאָשָׁם
  choice: kwa kondoo dume wa sadaka ya hatia
  rationale: “Kondoo dume” huwakilisha kwa usahihi אַיִל, na “sadaka ya hatia” ni tafsiri inayoeleweka ya אָשָׁם katika sheria za dhabihu. “Kwa” linaonyesha chombo au njia iliyotumiwa.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi lugha ya kimahali na kiibada ya Kiebrania pamoja na jina la agano, Yahwe.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: kwa ajili ya dhambi aliyotenda
  rationale: Hueleza kosa ambalo upatanisho unafanywa kwa ajili yake, huku ikilainisha kwa njia ya asili urudiaji wa mzizi mmoja katika Kiebrania.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: Kauli ya kutendwa huhifadhi msamaha kama jambo analopokea mtu, bila kumtaja moja kwa moja mtendaji wa kimungu, kama ilivyo katika Kiebrania.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dhambi aliyotenda
  rationale: Baada ya “atasamehewa,” Kiswahili cha kawaida hutaja jambo analosamehewa moja kwa moja. Urudiaji wa kishazi hicho umehifadhiwa kwa sababu upo katika chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la pekee la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אָשָׁם katika dhabihu
  choice: sadaka ya hatia
  alternative: sadaka ya kufidia kosa
  rationale: Neno linaweza kusisitiza hatia au tendo la kufidia/kurekebisha madhara. Maandishi makuu yanatumia istilahi inayotambulika zaidi, na tanbihi inahifadhi upande wa ufidiaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi urudiaji wa “dhambi aliyotenda” kutoka chanzo, huku ikitumia muundo wa kawaida wa Kiswahili. Alama ya tanbihi [a] imewekwa mara moja baada ya istilahi inayohusika.
