  edition: WLC
  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: sw
  text: Mgeni anayeishi pamoja nanyi atakuwa kwenu kama mzawa mmoja wenu[a]. Nawe umpende kama unavyojipenda mwenyewe, kwa maana ninyi mlikuwa wageni katika nchi ya Misri. Mimi ni Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mgeni mkazi,” “mtu wa kigeni anayeishi miongoni mwenu,” au “asiye mzawa.” Neno la Kiebrania humaanisha mtu asiye mzawa anayeishi katika jamii ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח
  choice: kama mzawa
  rationale: אֶזְרָח humaanisha mwenyeji wa asili au mtu aliyezaliwa katika jamii hiyo. “Kama mzawa” ni Kiswahili cha kawaida na kinahifadhi ulinganisho wa kiambishi כְּ.
- source_word: הַגֵּר
  choice: mgeni
  rationale: Katika sheria ya Torati, גֵּר mara nyingi ni mtu asiye mzawa anayeishi kwa kudumu au kwa muda mrefu miongoni mwa Israeli, si msafiri anayepita tu. “Mgeni” ni neno la kawaida la Kiswahili; maana yake maalumu katika muktadha huu imefafanuliwa katika tanbihi.
- source_word: הַגָּר אִתְּכֶם
  choice: anayeishi pamoja nanyi
  rationale: Kirai hiki kinaonyesha kwamba huyo mgeni anakaa ndani ya jamii. Kiswahili hakiwezi kuhifadhi kwa urahisi uradidi wa mzizi גֵּר/גָּר bila kuwa kizito, hivyo maana imetolewa kwa lugha ya kawaida.
- source_word: יִהְיֶה לָכֶם
  choice: atakuwa kwenu
  rationale: Muundo huu unaeleza jinsi jamii ya Israeli inavyopaswa kumchukulia mgeni. “Atakuwa kwenu” kinabaki karibu na sintaksia ya Kiebrania bila kuongeza wazo lisilotajwa.
- source_word: וְאָהַבְתָּ לוֹ
  choice: Nawe umpende
  rationale: Kitenzi ni amri inayomwelekea msikilizaji katika umoja. “Nawe umpende” kinahifadhi nguvu ya amri na mabadiliko ya Kiebrania kutoka wingi kwenda umoja.
- source_word: כָּמוֹךָ
  choice: kama unavyojipenda mwenyewe
  rationale: Hiki ni kifungu cha ulinganisho kinachoungana na Walawi 19:18. Utoaji huu ni wa asili katika Kiswahili na unaweka wazi maana ya kujipenda bila kubadili amri.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: kwa maana ninyi mlikuwa wageni
  rationale: Kurudia “wageni” kunahifadhi uhusiano wa kileksia na גֵּר na kuweka msingi wa amri katika uzoefu wa Israeli huko Misri.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi usemi kamili wa kibiblia na rejeo lake la kihistoria.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni utoaji wa moja kwa moja wa fomula ya agano, huku kiambishi cha wingi kikihifadhiwa katika “wenu”.
theological_decisions:
- issue: Maana ya גֵּר katika muktadha wa kisheria na kimaadili
  choice: mgeni
  alternative: mgeni mkazi; mtu wa kigeni anayeishi miongoni mwa jamii; asiye mzawa
  rationale: Neno linamaanisha asiye mzawa anayeishi miongoni mwa Israeli na anayepaswa kulindwa na jamii. “Mgeni” ni fasaha na linaeleweka kwa urahisi, huku tanbihi ikizuia lisieleweke kama msafiri anayepita tu au kama kundi maalumu la kisasa la uhamiaji.
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini inatumia jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha na cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mabadiliko ya nafsi kutoka wingi (“nanyi,” “wenu”) kwenda umoja (“nawe umpende”) yamehifadhiwa kwa sababu yapo katika Kiebrania na yanaonyesha amri kwa kila mshiriki wa jamii.
