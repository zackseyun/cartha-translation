review_pass:
  verdict: revise
  source_fidelity: The conditional and emphatic passive are substantially conveyed, and the final passive, “haitakubaliwa,” correctly retains the cultic sense of sacrificial non-acceptance. However, “imekuwa najisi” changes the Hebrew predicative statement פִּגּוּל הוּא (“it is piggul”) into a perfect/processive assertion (“it has become unclean”) and risks conflating this technical sacrificial disqualification with ritual impurity (najisi).
  naturalness: “Ikiwa italiwa kweli” is natural Standard East African Swahili and conveys the emphasis without overstating it. “Ni kitu kisichokubalika” is idiomatic, grammatically sound, and fits the sacrificial setting more naturally than “imekuwa najisi.”
  terminology: פִּגּוּל is best represented here as a thing rendered cultically unacceptable, not specifically as “najisi.” “Kitu kisichokubalika” preserves that status without importing the distinct category of impurity. The footnote supplies restrained lexical alternatives and explains the technical sacrificial reference.
  issues:
  - severity: medium
    issue: “Ime kuwa najisi” does not reflect the Hebrew predicative construction and introduces ritual-impurity terminology.
    rationale: פִּגּוּל הוּא literally identifies the meat's status (“it is piggul”); it does not say that it has become unclean. In Levitical usage, “najisi” can suggest a distinct legal category from sacrificial rejection.
  - severity: low
    issue: The footnote alternatives use verbal forms that do not match the noun-predicate in the verse.
    rationale: “Imechafuliwa” is a verbal passive (“has been defiled”), whereas the Hebrew term is a noun used predicatively. Noun phrases better preserve the lexical uncertainty.
  revised_text: Lakini ikiwa italiwa kweli siku ya tatu, ni kitu kisichokubalika[a]; haitakubaliwa.
  revised_footnotes:
  - marker: a
    text: Au “kitu kichafu” au “kitu cha machukizo.” Neno la Kiebrania hapa linarejelea nyama ya dhabihu inayofanywa isikubalike kwa kuliwa baada ya muda ulioruhusiwa.
    reason: lexical_alternative
  revision_rationale: Revision replaces “imekuwa najisi” with a present predicative expression that reflects פִּגּוּל הוּא and communicates the meat’s ritual-sacrificial unacceptability without equating it with impurity. The emphatic conditional and the final statement of non-acceptance are retained.
