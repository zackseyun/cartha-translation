  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: sw
  text: Lakini ikiwa italiwa kweli siku ya tatu, ni kitu kisichokubalika[a]; haitakubaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitu kichafu” au “kitu cha machukizo.” Neno la Kiebrania hapa linarejelea nyama ya dhabihu inayofanywa isikubalike kwa kuliwa baada ya muda ulioruhusiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Muunganiko huu unaanzisha sharti linalotofautiana na agizo lililotangulia; “Lakini ikiwa” ni Kiswahili cha kawaida kinachohifadhi tofauti na sharti hilo.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: ikiwa kweli italiwa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi cha hali ya kutendwa unasisitiza tendo la kula. “Kweli italiwa” huhifadhi msisitizo bila kudokeza kimakosa kwamba nyama yote lazima iliwe.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Huu ni usemi wa moja kwa moja na wa kawaida wa wakati katika Kiswahili.
- source_word: פִּגּוּל
  choice: imekuwa najisi
  rationale: Katika muktadha wa dhabihu, neno hili linaonyesha nyama iliyopoteza hali ya kukubalika kwa sababu ya kuliwa baada ya muda ulioruhusiwa. “Imekuwa najisi” hudokeza hali yake ya kidini bila kutumia “chukizo,” ambalo lingeweza kuhusishwa na istilahi nyingine kali zaidi za Kiebrania.
- source_word: הוּא
  choice: imekuwa
  rationale: Kiwakilishi cha Kiebrania kinaimarisha kauli ya kiarifu. Katika Kiswahili, maana hiyo imewasilishwa kiasili ndani ya “imekuwa najisi.”
- source_word: לֹא יֵרָצֶה
  choice: haitakubaliwa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kutopokewa kwa kibali. “Haitakubaliwa” ni wazi na hakiongezi mhusika ambaye maandishi hayamtaji moja kwa moja.
theological_decisions:
- issue: Hali ya kidini ya nyama ya dhabihu iliyoliwa siku ya tatu
  choice: Aya inatangaza kwamba nyama hiyo imepoteza hali ya kukubalika katika ibada.
  alternative: Inaweza kueleweka kuwa imeharibika kimwili tu, au kuwa ni “chukizo” kwa maana pana zaidi.
  rationale: Muktadha wa karibu unahusu masharti ya dhabihu, na kauli “haitakubaliwa” inaelekeza maana kwenye kukubalika kwake kidini. Tafsiri haipanui neno kuwa hukumu ya jumla ya kimaadili wala kulifanya lieleze kuharibika kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Kauli “kweli italiwa” huhifadhi msisitizo wa Kiebrania, na “imekuwa najisi” huweka wazi muktadha wa kiibada bila kuingiza istilahi ya kimadhehebu.
