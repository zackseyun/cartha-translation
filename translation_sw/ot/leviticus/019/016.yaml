base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: sw
  text: Usiende huku na huku miongoni mwa watu wako ukiwa mchongezi. Usisimame dhidi ya damu ya mwenzako.[a] Mimi ni Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usisimame tu bila kufanya lolote wakati damu ya mwenzako inamwagwa.”
    reason: Usomaji huu unaelewa עַל kwa maana ya kusimama kando bila kuingilia kati ili kumwokoa mwenzako.
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: usizunguke ... ukiwachongea wengine
  rationale: Muundo huu unaendeleza picha ya mtu anayezunguka katika jamii huku akisambaza maneno yenye kumharibia mwingine sifa. ‘Kuchongea’ ni neno la kawaida la Kiswahili lenye uzito unaofaa kuliko ‘kupiga porojo.’
- source_word: בְּעַמֶּיךָ
  choice: miongoni mwa watu wako
  rationale: Kihusishi ב pamoja na עַמֶּיךָ kinaonyesha mwenendo ndani ya jamii ya watu wa agano; ‘miongoni mwa watu wako’ ni ya kawaida na sahihi.
- source_word: תַעֲמֹד עַל
  choice: usisimame dhidi ya
  rationale: Tafsiri hii inadumisha picha ya msingi ya ‘kusimama’ na inaacha wazi mvutano wa עַל, ambayo hapa inaweza kueleweka kuwa tendo la uhasama au kusimama bila kuingilia kati.
- source_word: דַּם
  choice: damu
  rationale: ‘Damu’ inadumisha lugha halisi na yenye nguvu ya Kiebrania, huku ikiweza kuwakilisha uhai au umwagaji damu.
- source_word: רֵעֶךָ
  choice: mwenzako
  rationale: Katika muktadha huu wa kimaadili na kijamii, רֵעַ ni mtu mwingine wa jamii. ‘Mwenzako’ ni pana na ya kawaida katika Kiswahili, bila kuifunga maana kwa mtu anayeishi karibu tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: ‘Yahwe’ ni umbo la kawaida la Kiswahili la jina binafsi la Mungu יהוה, badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Maana ya לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: Katazo la kusimama dhidi ya damu ya mwenzako, likidumisha lugha halisi na uwezekano wa tendo la uhasama au la kuhatarisha uhai.
  alternative: Katazo la kusimama tu bila kusaidia wakati damu ya mwenzako inamwagwa.
  rationale: Kirai cha Kiebrania ni kifupi na kinaweza kueleweka kwa njia zaidi ya moja. Matini kuu inadumisha ‘kusimama’ na ‘damu’ badala ya kuamua kimya kimya kati ya uhasama wa moja kwa moja na kutojali hatari inayompata mwingine; ufafanuzi wa pili umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuwachongea wengine’ kinaeleweka kwa urahisi na kinaonyesha madhara ya taarifa zinazosambazwa. Kirai kisicho cha kawaida ‘kusimama dhidi ya damu’ kimehifadhiwa kwa makusudi ili kutofuta utata halisi wa Kiebrania; tanbihi inatoa usomaji mwingine maarufu.
