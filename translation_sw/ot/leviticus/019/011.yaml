  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: sw
  text: Msiibe, wala msitende kwa udanganyifu, wala msiambiane uongo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mtu kwa mwenzake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: Msiibe
  rationale: Kitenzi cha Qal katika nafsi ya pili wingi pamoja na לֹא ni katazo la moja kwa moja. “Kuiba” ndiyo maana ya kawaida na iliyo wazi ya גנב.
- source_word: תְכַחֲשׁוּ
  choice: msitende kwa udanganyifu
  rationale: Piel ya כחש inaweza kumaanisha kutenda kwa hila, kukana kwa uongo, au kudanganya. Kauli hii pana inahifadhi wigo wa mwenendo wa udanganyifu bila kuufanya uwe kusema uongo tu.
- source_word: תְשַׁקְּרוּ
  choice: msiambiane uongo
  rationale: Piel ya שקר hapa inakataza kusema uongo. Muundo wa Kiswahili “kuambiana uongo” ni wa kawaida na unaunganisha tendo hilo na uhusiano wa mtu na mwenzake.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: -ambiane
  rationale: 'Kirai hiki ni cha kugawanya na cha kuheshimiana: mtu kwa mwenzake. Kiambishi cha kutendeana “-ana” kinawasilisha maana ya “ninyi kwa ninyi” kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi zaidi.'
- source_word: עֲמִית
  choice: mwenzake (katika tanbihi)
  rationale: עמית humaanisha mshirika, jirani, au mtu mwingine wa jumuiya. “Mwenzake” ndilo neno pana na la asili katika Kiswahili kwa muktadha huu.
theological_decisions:
- issue: Usemi wa kugawanya wenye umbo la kiume אִישׁ ... עֲמִיתוֹ
  choice: Umetafsiriwa kwa usemi jumuishi “msiambiane” katika maandishi makuu.
  alternative: mtu kwa mwenzake
  rationale: Umoja wa kiume katika Kiebrania una kazi ya jumla na hauwekei katazo hili wanaume peke yao. Kiswahili cha kutendeana kinawasilisha maana hiyo jumuishi bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa urahisi. Mfuatano wa makatazo umehifadhiwa, huku tofauti kati ya mwenendo wa udanganyifu na kusema uongo ikidumishwa.
