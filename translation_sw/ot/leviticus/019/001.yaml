lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi דבר katika fomula ya kuanzisha hotuba ya Mungu kinaelezwa kwa Kiswahili cha kawaida na chenye hadhi kama “akasema”; umbo lenye waw linaendeleza simulizi kwa tukio jipya la kusema.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, “kusema na mtu” ni njia ya kawaida ya kuonyesha anayeelekezewa maneno, na hapa inawakilisha אֶל kwa ufasaha.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili la kuanzisha yaliyomo katika hotuba limehifadhiwa wazi kama “akisema,” badala ya kuachwa, ili kudumisha muundo wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi יהוה. “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo; “Yehova” ni umbo jingine la kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Muundo wa fomula ya hotuba umehifadhiwa, ingawa urudiaji wa “akasema … akisema” si wa kawaida sana katika Kiswahili, kwa sababu לֵאמֹר ipo wazi katika chanzo.
