  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: sw
  text: Na mwaka wa tano mnaweza kula matunda yake, ili mazao yake yaongezeke kwa ajili yenu. Mimi ni Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: Na mwaka wa tano
  rationale: Kiunganishi וּ kinaendeleza mfuatano wa maagizo, huku בַּ ikionyesha wakati. Muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: תֹּאכְלוּ
  choice: mnaweza kula
  rationale: Katika muktadha huu wa kisheria, kauli hii inatoa ruhusa baada ya marufuku ya miaka iliyotangulia; ‘mnaweza kula’ huwasilisha ruhusa hiyo kwa Kiswahili cha kawaida.
- source_word: אֶת־פִּרְיוֹ
  choice: matunda yake
  rationale: פְּרִי hapa ni matunda ya mti, na kiambishi cha nafsi ya tatu umoja kinarejelea mti uliotajwa katika muktadha.
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: ili mazao yake yawaongezekee
  rationale: Muundo wenye לְ unaweza kueleza kusudi au matokeo. Tafsiri hii huhifadhi wazo la ongezeko la mazao kwa manufaa ya wasikilizaji bila kumtaja wazi mtendaji ambaye Kiebrania hakumtaji.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Mimi ni Yahwe, Mungu wenu
  rationale: Huu ni mtindo wa agano unaojirudia katika Mambo ya Walawi. ‘Yahwe’ huhifadhi jina la Mungu lililoandikwa moja kwa moja katika maandishi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja. ‘Yahwe’ hulitofautisha na cheo ‘Bwana’ na kulihifadhi kama jina maalumu bila kuingiza msimamo wa dhehebu.
- issue: Mhusika wa ongezeko la mazao katika לְהוֹסִיף
  choice: 'Muundo usiomtaja wazi mtendaji: ‘mazao yake yawaongezekee’'
  alternative: Mti huo uwaongezee mazao yake; Mungu awaongezee mazao yake
  rationale: Kiebrania hakitaji wazi mtendaji wa kitenzi-jina hapa. Muundo uliochaguliwa huhifadhi mvutano huo badala ya kuamua kuwa ni mti au Mungu anayesababisha ongezeko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mnaweza kula’ inaonyesha ruhusa ya kisheria, na ‘yawaongezekee’ huonyesha ongezeko linalowanufaisha bila kufanya sentensi kuwa nzito.
