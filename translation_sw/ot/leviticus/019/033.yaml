base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: sw
  text: Mgeni[a] anapoishi pamoja nawe katika nchi yenu, msimtendee vibaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “mgeni” ni tafsiri ya neno la Kiebrania ger, yaani mtu asiye mzawa anayeishi miongoni mwa Israeli; si mgeni wa kupita tu.
    reason: cultural_note
  - marker: b
    text: Au “msimdhulumu” au “msimkosee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: anapo-
  rationale: Muundo wa wakati wenye maana ya hali inayotarajiwa unafaa sheria hii na unawakilisha maana ya ‘wakati’ bila kuifanya kuwa sharti lisilo na uhakika.
- source_word: יָגוּר
  choice: anaishi
  rationale: Kitenzi גור hapa kinamaanisha kukaa kwa muda unaoendelea kama mtu asiye mzawa; ‘anaishi’ ni Kiswahili cha sasa na cha kawaida, huku hali ya ugeni ikibebwa na neno ‘mgeni’.
- source_word: אִתְּךָ
  choice: pamoja nawe
  rationale: Hufuata kwa karibu maana ya kihusishi na kiambishi cha nafsi ya pili umoja, na huhifadhi namna mtu mmoja anavyosemeshwa katika chanzo.
- source_word: גֵּר
  choice: mgeni
  rationale: Neno hili humaanisha mtu asiye mzawa anayeishi miongoni mwa jamii ya Israeli. ‘Mgeni’ ni neno linaloeleweka kwa urahisi; tanbihi inafafanua kuwa hapa si mgeni wa kupita tu bali mkazi asiye mzawa.
- source_word: בְּ/אַרְצְ/כֶם
  choice: katika nchi yenu
  rationale: ‘Nchi’ huwasilisha maana ya אֶרֶץ katika muktadha huu, na ‘yenu’ huhifadhi wingi wa kiambishi kinachoielekeza sheria kwa jamii yote.
- source_word: לֹא תוֹנוּ
  choice: msimtendee vibaya
  rationale: Kitenzi ינה katika muundo huu kinaweza kumaanisha kumkosea, kumdhulumu, au kumtendea vibaya. Usemi huu ni wa kawaida, mpana, na unaeleweka, bila kupunguza uwezekano wa maana yenye nguvu zaidi ya ‘kumdhulumu’.
- source_word: אֹת/וֹ
  choice: -m-
  rationale: Kiambishi cha yambwa cha ngeli ya mtu humrejelea mgeni huyo kwa njia ya kawaida ya Kiswahili; Kiswahili hakionyeshi jinsia katika kiambishi hiki.
theological_decisions:
- issue: Maana ya גֵּר katika sheria za utakatifu za Israeli
  choice: mgeni
  alternative: mkazi asiye mzawa; mhamiaji; mpitaji
  rationale: Katika muktadha huu ni mtu asiye Mwisraeli anayeishi nchini na aliye chini ya ulinzi wa kijamii na kisheria wa Israeli. ‘Mgeni’ ni lugha ya kawaida, na tanbihi huhifadhi maana maalumu ya ukaaji bila kutumia istilahi nzito ya kiutawala.
- issue: Nguvu ya katazo לֹא תוֹנוּ
  choice: msimtendee vibaya
  alternative: msimdhulumu; msimkosee
  rationale: Chanzo kina upana wa maana unaojumuisha kumkosea au kumdhulumu. Tafsiri kuu inaacha upana huo wazi, huku tanbihi ikihifadhi tafsiri mbadala zenye nguvu tofauti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mabadiliko ya chanzo kutoka ‘nawe’ (umoja) kwenda ‘yenu/msim-’ (wingi) yamehifadhiwa ili kuonyesha kumsemesha mtu mmoja kama sehemu ya jamii nzima.
