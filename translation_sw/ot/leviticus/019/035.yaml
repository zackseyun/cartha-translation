  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: sw
  text: Msifanye udhalimu katika hukumu[a], katika vipimo vya urefu, uzito, au ujazo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msifanye yasiyo ya haki katika utoaji wa haki, katika kipimo, uzani, au kipimo cha ujazo.”
    reason: Neno la Kiebrania מִשְׁפָּט linaweza kumaanisha hukumu au utekelezaji wa haki; istilahi za vipimo zinaweza pia kutolewa katika umoja wa kijumla, karibu zaidi na muundo wa Kiebrania.
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ עָוֶל
  choice: Msitende isivyo haki
  rationale: Kauli hii ni katazo kwa wingi. “Msitende isivyo haki” ni Kiswahili cha kawaida na chenye heshima kinachowasilisha wazo la kufanya uovu, udanganyifu au ukosefu wa haki bila kulibana katika maana moja tu.
- source_word: בַּמִּשְׁפָּט
  choice: katika hukumu
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, uamuzi wa kisheria au haki. “Katika hukumu” inabaki karibu na muundo wa Kiebrania na kuhifadhi upana huo.
- source_word: בַּמִּדָּה
  choice: katika vipimo vya urefu
  rationale: מִדָּה ni kipimo kwa ujumla, mara nyingi kipimo cha ukubwa au urefu. Kwa kuwa uzito na ujazo vinatajwa kando, “vipimo vya urefu” hutofautisha aina hizi kwa uwazi katika Kiswahili cha sasa.
- source_word: בַּמִּשְׁקָל
  choice: uzito
  rationale: מִשְׁקָל humaanisha uzito au tendo la kupima uzito. “Uzito” ni neno la moja kwa moja na linafaa katika muktadha wa biashara.
- source_word: וּבַמְּשׂוּרָה
  choice: ujazo
  rationale: מְשׂוּרָה ni kipimo cha kiasi kinachoweza kutoshea katika chombo. “Ujazo” ni neno la sasa linaloeleweka na halibani maana kuwa kipimo cha vimiminika pekee.
