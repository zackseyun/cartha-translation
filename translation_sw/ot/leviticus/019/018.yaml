  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: sw
  text: Usilipize kisasi wala usiwawekee kinyongo watu wa jamii yako,[a] bali umpende jirani yako kama unavyojipenda mwenyewe. Mimi ni Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wako mwenyewe.” Neno kwa neno, “wana wa watu wako.”
    reason: Njia mbadala ya kileksika inayohifadhi pia muundo halisi wa Kiebrania.
lexical_decisions:
- source_word: תִקֹּם
  choice: usilipize kisasi
  rationale: Kitenzi נקם kinaeleza tendo la kulipiza au kutekeleza kisasi. ‘Kulipiza kisasi’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kulipiza ubaya.
- source_word: תִטֹּר
  choice: usiwawekee kinyongo
  rationale: Katika muktadha huu נטר ni kuendelea kutunza hasira au chuki moyoni. ‘Kumwekea mtu kinyongo’ ni Kiswahili cha kawaida kinachoonyesha hali hiyo ya kudumu.
- source_word: בְּנֵי עַמֶּךָ
  choice: watu wa taifa lako
  rationale: Neno kwa neno ni ‘wana wa watu wako,’ lakini hapa muundo huo unamaanisha watu walio sehemu ya jamii au taifa moja. Tafsiri ya matini kuu ni ya asili zaidi katika Kiswahili, huku umbo halisi likihifadhiwa katika tanbihi.
- source_word: וְאָהַבְתָּ
  choice: umpende
  rationale: Katika sheria hii, waw pamoja na kitenzi timilifu ina nguvu ya amri. ‘Umpende’ hudumisha nguvu hiyo kwa namna ya kawaida ya Kiswahili.
- source_word: לְרֵעֲךָ
  choice: jirani yako
  rationale: רֵעַ inaweza kumaanisha mwenzako, rafiki, au jirani. ‘Jirani yako’ ni tafsiri iliyo wazi na inayofaa katika muktadha huu wa kimaadili bila kupanua au kubana kimakusudi upeo wa neno.
- source_word: כָּמוֹךָ
  choice: kama unavyojipenda mwenyewe
  rationale: Kirai hiki cha kulinganisha ni kifupi kwa Kiebrania. Tafsiri hii ya Kiswahili inaeleza kwa kawaida kiwango cha upendo kinachotolewa na ‘kama wewe mwenyewe,’ bila kubadili msingi wa ulinganisho.
- source_word: יְהוָה
  choice: Yahwe
  rationale: ‘Yahwe’ ni umbo la Kiswahili la jina la Mungu YHWH; linahifadhi jina binafsi badala ya kulibadilisha kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Upeo wa wale wanaolengwa na amri
  choice: Kuhifadhi rejeo la moja kwa moja kwa watu wa taifa la msemaji katika kishazi cha kwanza, huku רֵעַ ikitafsiriwa ‘jirani yako.’
  alternative: Kufanya vishazi vyote viwili viwe kauli pana kuhusu wanadamu wote, au kuvifanya vyote viwahusu watu wa Israeli pekee.
  rationale: Aya yenyewe inatumia misemo miwili tofauti, בְּנֵי עַמֶּךָ na רֵעֲךָ. Tafsiri inahifadhi tofauti hiyo bila kuingiza mapema upanuzi au ubanaji wa baadaye wa kiteolojia.
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina יהוה. Kulitafsiri ‘Yahwe’ huhifadhi jina hilo binafsi na kuepuka kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Miundo ‘kulipiza kisasi,’ ‘kumwekea kinyongo,’ na ‘kama unavyojipenda mwenyewe’ ni ya kawaida na inaeleweka kwa wasomaji wengi; jina יהוה limeandikwa kwa umbo la Kiswahili ‘Yahwe.’
