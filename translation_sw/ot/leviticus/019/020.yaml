language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: sw
  text: Ikiwa mwanamume atalala na mwanamke na kumwaga shahawa, naye mwanamke huyo ni mtumwa aliyetengewa mwanamume[a], lakini hajakombolewa wala kupewa uhuru, kutakuwa na uchunguzi[b]. Hawatauawa, kwa sababu mwanamke huyo hakuwa amepewa uhuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyechumbiwa na mwanamume” au “aliyeahidiwa kwa mwanamume.” Huenda Kiebrania kinaonyesha kwamba mwanamke huyo mtumwa alikuwa ametengewa au ameahidiwa kwa mwanamume, ingawa hakuwa na hadhi ya kisheria ya mke huru.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “uchunguzi” ni adimu na maana yake haina uhakika; huenda pia likamaanisha “adhabu” au “fidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mwanamume
  rationale: Hutaja mtu wa jinsia ya kiume katika mtindo wa sheria; “mwanamume” ni sahihi na wazi katika Kiswahili cha kawaida.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: atalala na mwanamke na kumwaga shahawa
  rationale: Kirai cha Kiebrania kinataja tendo la kulala pamoja na utoaji wa shahawa. Tafsiri hii inahifadhi umahususi wa kisheria bila kuwa isiyo ya kawaida katika Kiswahili.
- source_word: שִׁפְחָה
  choice: mwanamke ... ni mtumwa
  rationale: Hali yake ya kuwa katika utumwa ni muhimu kwa sheria hii; “mtumwa” haisitiri hali hiyo kama ambavyo “mtumishi” ingeweza kufanya.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: aliyepangiwa mwanamume mwingine
  rationale: Neno hili ni gumu na huenda linamaanisha kwamba mwanamke huyo alikuwa ameahidiwa au kutengewa mwanamume. “Aliyepangiwa” haidai kwa uhakika kwamba alikuwa na hadhi kamili ya mchumba aliye huru. “Mwingine” huweka wazi kwamba si mwanamume anayelala naye anayetajwa hapa.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: hajakombolewa
  rationale: “Kukombolewa” huwasilisha tendo la kuachiliwa kutoka utumwani kwa malipo na linafaa katika muktadha huu wa kisheria na kiuchumi.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: wala kupewa uhuru
  rationale: Usemi huu wa kawaida wa Kiswahili unahifadhi maana ya kuachiliwa kisheria kutoka hali ya utumwa.
- source_word: בִּקֹּרֶת
  choice: kutakuwa na uchunguzi
  rationale: Neno hili adimu lina maana isiyo na uhakika. “Uchunguzi” hudumisha uwezekano wa hatua rasmi bila kulazimisha maana mahususi ya adhabu au fidia.
- source_word: לֹא יוּמְתוּ
  choice: hawatauawa
  rationale: Kauli hii inaeleweka katika muktadha wa hukumu ya kisheria kuwa hawatapewa adhabu ya kifo.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: kwa sababu mwanamke huyo hakuwa amepewa uhuru
  rationale: 'Inarudia wazi sababu iliyotolewa na maandishi: mwanamke huyo bado hakuwa ameondolewa katika hali ya utumwa.'
theological_decisions:
- issue: Hadhi ya kisheria katika נֶחֱרֶפֶת לְאִישׁ
  choice: aliyepangiwa mwanamume mwingine
  alternative: aliyechumbiwa na mwanamume mwingine; aliyeahidiwa kwa mwanamume mwingine
  rationale: Kifungu hiki kinatofautisha hali ya mwanamke mtumwa ambaye bado hajakombolewa wala kupewa uhuru na ile ya mwanamke huru aliyechumbiwa. “Aliyepangiwa” hudumisha uhusiano uliokusudiwa bila kudai hadhi kamili ya uchumba wa kisheria.
- issue: Maana ya בִּקֹּרֶת
  choice: kutakuwa na uchunguzi
  alternative: kutakuwa na adhabu; kutakuwa na fidia
  rationale: Kwa kuwa neno hili ni adimu na linabishaniwa, tafsiri haipaswi kuingiza kwa uhakika aina fulani ya adhabu ambayo maandishi yenyewe hayafafanui. Maana nyingine zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya sheria imewekwa wazi kwa wasomaji wa kawaida. “Mtumwa” limetumiwa badala ya neno laini zaidi ili kuhifadhi hali halisi ya kisheria, na lugha ya tendo la ngono imewasilishwa moja kwa moja bila ukali usio wa lazima.
