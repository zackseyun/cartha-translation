revisions:
- from: Msigeukie wapiga ramli kwa kuwasiliana na wafu wala waaguzi kwa kuwasiliana na roho; msiwatafute[a], mkawa najisi kwa sababu yao. Mimi ni Yahweh, Mungu wenu.
  to: Msiwageukie wapiga ramli wala waaguzi wa roho; msiwatafute[a], mkawa najisi kwao. Mimi ni Yahweh, Mungu wenu.
  rationale: Revision removes unsupported descriptive detail from the main text, retains the source’s concise parallel prohibition, and moves lexical ambiguity to the footnote. “Waaguzi wa roho” is used as a transparent functional rendering, not as a claim that the Hebrew term has a single fixed meaning. The clause “mkawa najisi kwao” keeps the result/purpose sense and leaves the character of the defilement open.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:18:08Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the two Hebrew terms as prohibited practitioners and retains the broad sense of defilement. However, its main-line expansions, “kwa kuwasiliana na wafu” and “kwa kuwasiliana na roho,” make explicit distinctions that the Hebrew terminology itself does not fully specify. The phrase “kwa sababu yao” also slightly weakens the Hebrew בָהֶם, which more directly expresses defilement through/by involvement with them.
  naturalness: The current wording is understandable, but the two long descriptive noun phrases are heavy and repetitive in a short prohibition. “Wapiga ramli” and “waaguzi wa roho” are more concise, current, and natural while the footnote can preserve lexical uncertainty.
  terminology: “Yahweh, Mungu wenu” is appropriate. “Najisi” suitably preserves the broad Levitical concept without limiting it to ritual or moral impurity. The revised paired terms distinguish the categories without treating either Hebrew word as having a fully settled one-word Swahili equivalent.
  issues:
  - severity: medium
    issue: The main text over-specifies the practices associated with the two Hebrew terms.
    rationale: אוֹב and יִדְּעֹנִי have disputed and overlapping lexical ranges, including possible reference to spirits, the dead, or practitioners. Stating respectively that they communicate with the dead and with spirits narrows and contrasts them beyond what the Hebrew securely says.
  - severity: low
    issue: “Kwa sababu yao” is less direct than the Hebrew phrase for defilement through them.
    rationale: The preposition בָהֶם indicates defilement by/through involvement with them. “Kwao” more closely maintains this connection.
  revised_text: Msiwageukie wapiga ramli wala waaguzi wa roho; msiwatafute[a], mkawa najisi kwao. Mimi ni Yahweh, Mungu wenu.
  revised_footnotes:
