  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: sw
  text: Msiwageukie wapiga ramli wala waaguzi wa roho; msiwatafute[a], mkawa najisi kwao. Mimi ni Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno mawili ya Kiebrania hayana visawe kamili katika Kiswahili. Yanaweza pia kumaanisha “wenye mizimu,” “wenye roho waaguzi,” “wachawi,” au hata mizimu yenyewe. Katika sheria hii kwa kawaida yanaeleweka kuwa watu au desturi zilizohusishwa na kutafuta ushauri kwa roho au wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: geukie
  rationale: Kitenzi hiki huhifadhi maana ya msingi ya kuelekeza nafsi kwa mtu fulani, huku katika muktadha huu kikidokeza kwenda kwake ili kupata ushauri.
- source_word: הָאֹבֹת
  choice: wapiga ramli kwa kuwasiliana na wafu
  rationale: Neno la Kiebrania linaweza kumaanisha roho ya mfu au mtu anayeitafuta; katika sambamba hii linaeleweka kwa kawaida kuwa kundi la watendaji waliokatazwa. Ufafanuzi huu ni wazi kwa msomaji wa sasa bila kudai uhakika usiokuwapo.
- source_word: הַיִּדְּעֹנִים
  choice: waaguzi kwa kuwasiliana na roho
  rationale: Hurejelea wahusika wa maarifa ya siri au uaguzi unaohusishwa na roho. Tafsiri hii hutofautisha kwa kiasi kundi hili na la kwanza na huepuka neno la kisasa lenye picha ya kichawi isiyokusudiwa.
- source_word: תְּבַקְשׁוּ
  choice: msiwatafute
  rationale: Hutoa moja kwa moja maana ya 'kutafuta' na katika muktadha hudokeza kuwatafuta ili kuwauliza au kupata msaada wao.
- source_word: לְטָמְאָה בָהֶם
  choice: mkawa najisi kwa sababu yao
  rationale: Huhifadhi matokeo au kusudi linalowezekana la muundo wa Kiebrania na halibani unajisi kuwa wa kiibada pekee au wa kimaadili pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi uhusiano wa agano na nafsi ya pili wingi katika Kiebrania.
theological_decisions:
- issue: Asili ya unajisi unaotokana na desturi hizi
  choice: mkawa najisi
  alternative: mkawa najisi kiibada; mkachafuliwa kimaadili
  rationale: Neno טמא katika Walawi linaweza kuwa na vipengele vya kiibada na vya kimaadili. Tafsiri hailazimishi upande mmoja tu.
- issue: Iwapo maneno ya occult yanataja roho au watendaji
  choice: Yametafsiriwa katika mstari kama watendaji, huku tanbihi ikihifadhi uwezekano wa marejeo kwa roho au wafu.
  alternative: mizimu na roho wenye ujuzi
  rationale: Sambamba na vitenzi vya kuwaendea na kuwatafuta inaunga mkono watendaji, lakini istilahi za Kiebrania zina utata wa kileksia ambao haupaswi kufichwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Misemo ya ufafanuzi imetumiwa kwa istilahi za occult kwa sababu hakuna visawe vifupi vya Kiswahili vinavyobeba kwa usahihi utata wa אוֹב na יִדְּעֹנִי. Alama [a] ipo katika matini kuu.
