    text: Maneno mawili ya Kiebrania hayana visawe kamili katika Kiswahili. Yanaweza pia kumaanisha “wenye mizimu,” “wenye roho waaguzi,” “wachawi,” au hata mizimu yenyewe. Katika sheria hii kwa kawaida yanaeleweka kuwa watu au desturi zilizohusishwa na kutafuta ushauri kwa roho au wafu.
    reason: lexical_alternative
  revision_rationale: Revision removes unsupported descriptive detail from the main text, retains the source’s concise parallel prohibition, and moves lexical ambiguity to the footnote. “Waaguzi wa roho” is used as a transparent functional rendering, not as a claim that the Hebrew term has a single fixed meaning. The clause “mkawa najisi kwao” keeps the result/purpose sense and leaves the character of the defilement open.
