base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: sw
  text: Msiape kwa jina langu kwa uongo[a], mkinajisi jina la Mungu wako. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya asili, “Msiape kwa jina langu kwa ajili ya uongo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: msiape
  rationale: Nifali ya שׁבע katika muktadha wa sheria inamaanisha kuapa au kula kiapo. Umbo la kukataza ‘msiape’ linahifadhi amri ya moja kwa moja na wingi wa kitenzi cha Kiebrania.
- source_word: בִשְׁמִי
  choice: kwa jina langu
  rationale: Katika muktadha wa kiapo, ב pamoja na ‘jina’ huonyesha jina linalotumiwa kama uthibitisho wa kiapo; Kiswahili cha kawaida ni ‘kwa jina langu.’
- source_word: לַשָּׁקֶר
  choice: kwa uongo
  rationale: Ingawa kihalisi ni ‘kwa/ajili ya uongo,’ hapa kirai kina nguvu ya kielezi na kwa kawaida hueleweka kuwa kuapa kwa uongo.
- source_word: וְחִלַּלְתָּ
  choice: na hivyo kulitia unajisi
  rationale: Pieli ya חלל humaanisha kunajisi au kuvunjia utakatifu. ‘Na hivyo’ linaonyesha matokeo ya kuapa kwa uongo bila kuondoa uhusiano unaoweza kubebwa na kiunganishi cha Kiebrania. Muundo wa kitenzi-jina unaepuka Kiswahili kisicho cha kawaida kinachotokana na kubadilika kwa Kiebrania kutoka wingi kwenda umoja.
- source_word: שֵׁם
  choice: jina
  rationale: ‘Jina’ limehifadhiwa moja kwa moja kwa sababu linahusu utambulisho na heshima ya Mungu iliyofunuliwa, si lebo tu.
- source_word: אֱלֹהֶיךָ
  choice: la Mungu wako
  rationale: אֱלֹהִים hapa humrejelea Mungu mmoja wa Israeli, na kiambishi chake ni cha nafsi ya pili umoja; kwa hiyo ‘Mungu wako.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika matini.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kishazi cha pili
  choice: 'uhusiano wa matokeo: ‘na hivyo kulitia unajisi’'
  alternative: 'uratibu wa kawaida: ‘na kulitia unajisi’'
  rationale: Kiapo cha uongo kwa jina la Mungu ndicho kinachosababisha jina hilo kutiwa unajisi. ‘Na hivyo’ linaweka wazi uhusiano huo ambao וְ inaweza kuonyesha katika muktadha.
- issue: Kubadilika kutoka wingi kwenda umoja katika hotuba
  choice: kuhifadhi ‘Mungu wako’ ya umoja huku kitenzi-jina kikifanya sentensi iwe ya kawaida
  alternative: 'kusawazisha kila sehemu iwe wingi: ‘Mungu wenu’'
  rationale: Kiebrania kina תִשָּׁבְעוּ ya wingi lakini וְחִלַּלְתָּ na אֱלֹהֶיךָ za umoja. Tafsiri haibadili ‘wako’ kuwa ‘wenu,’ hivyo inalinda mabadiliko hayo bila kuunda sentensi ngumu ya Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msiape’ ni wazi katika muktadha wa kisheria; ‘kulitia unajisi jina’ linahifadhi lugha ya utakatifu bila kutumia msamiati wa kimadhehebu. Alama ya tanbihi [a] imewekwa katika matini kuu.
