translation:
  language: sw
  text: Mtazishika Sabato zangu, na mtaliheshimu mahali pangu patakatifu[a]. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mtaliogopa mahali pangu patakatifu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuogopa” au “kuheshimu”; hapa kinahusu kuonyesha staha takatifu kwa mahali patakatifu pa Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: Sabato zangu
  rationale: Nomino ya Kiebrania iko katika wingi na kiambishi kinaonyesha umilikaji wa Mungu; “Sabato zangu” huhifadhi yote mawili kwa Kiswahili cha kawaida.
- source_word: תִּשְׁמֹרוּ
  choice: mtazishika
  rationale: Kitenzi שׁמר katika sheria ya agano humaanisha kushika au kuzingatia. “Mtazishika” ni amri ya heshima iliyo wazi na inakubaliana na wingi wa “Sabato.”
- source_word: מִקְדָּשִׁי
  choice: mahali pangu patakatifu
  rationale: מִקְדָּשׁ ni mahali palipotengwa kuwa patakatifu. Tafsiri hii ni ya asili katika Kiswahili na haibainishi kupita kiasi kuwa ni Hema la Kukutania au Hekalu.
- source_word: תִּירָאוּ
  choice: kupaheshimu
  rationale: ירא inaweza kumaanisha kuogopa au kuwa na heshima kuu. Katika muktadha huu wa ibada, “kupaheshimu” huonyesha staha takatifu kwa mahali pa Mungu huku tanbihi ikihifadhi maana mbadala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahweh
  rationale: Huhifadhi kauli kamili na yenye msisitizo ya Mungu kujitambulisha.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina la agano bila kulibadilisha kuwa cheo.
- issue: Nguvu ya ירא inapohusishwa na mahali patakatifu
  choice: kupaheshimu mahali pangu patakatifu
  alternative: kupaogopa mahali pangu patakatifu
  rationale: Kitenzi kinaweza kueleza hofu au heshima kuu. Muktadha unaelekeza kwenye staha takatifu, lakini tanbihi inadumisha uwezekano halisi wa tafsiri ya karibu zaidi na “kuogopa.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mahali pangu patakatifu” ni wazi kwa msomaji wa kawaida; upatanisho wa ngeli umehifadhiwa katika “kupaheshimu.”
