  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: sw
  text: Kwa hiyo mtazishika amri zangu zote na hukumu zangu zote[a], na kuzitenda. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maagizo yangu yaliyowekwa” badala ya “amri zangu,” na “kanuni zangu” au “maamuzi yangu ya kisheria” badala ya “hukumu zangu.” Kiebrania kinatumia maneno mawili tofauti ya kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kwa hiyo, mtashika
  rationale: Kitenzi שׁמר katika muktadha wa agano na sheria humaanisha kushika au kuzingatia. Waw-consecutive hapa ina nguvu ya hitimisho la sura; “Kwa hiyo” huonyesha muhtasari huo, huku “mtashika” ikidumisha kauli ya wajibu iliyo katika nafsi ya pili wingi.
- source_word: כָּל
  choice: yote / zote
  rationale: Hifadhi nguvu jumuishi ya כָּל katika sehemu zote mbili, kwa upatanisho wa kisarufi unaofaa kwa “masharti” na “hukumu.”
- source_word: חֻקֹּתַי
  choice: masharti yangu
  rationale: חֻקִּים ni maagizo au matakwa yaliyowekwa kisheria. “Masharti” ni Kiswahili cha sasa na kinachotofautisha neno hili na מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: hukumu zangu
  rationale: מִשְׁפָּטִים inaweza kumaanisha hukumu, maamuzi ya kisheria, au kanuni. “Hukumu” huhifadhi sajili ya kisheria na tofauti ya kileksika na חֻקִּים.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: na kutenda yote hayo
  rationale: עשה inapokuwa na sheria kama yambwa humaanisha kuzitenda au kuzitekeleza. “Yote hayo” hurejelea kwa kawaida aina zote mbili za maagizo bila tatizo la upatanisho wa ngeli kati ya “masharti” na “hukumu.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. “Yahweh” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Nguvu ya wajibu katika וּשְׁמַרְתֶּם ... וַעֲשִׂיתֶם
  choice: mtashika ... na kutenda
  alternative: shikeni ... na mtende
  rationale: Miundo ya Kiebrania inaweza kuwasilisha wajibu kwa kauli yenye umbo la wakati ujao. Kiswahili “mtashika” hudumisha namna hiyo bila kupunguza agizo kuwa taarifa ya hiari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. “Kwa hiyo” huonyesha kazi ya mstari huu kama hitimisho la sura; “kutenda yote hayo” ni usemi wa asili unaojumuisha masharti na hukumu.
