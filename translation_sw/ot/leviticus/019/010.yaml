id: LEV.19.10
reference: Leviticus 19:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: sw
  text: Usimalize kuvuna shamba lako la mizabibu[a], wala usikusanye zabibu zilizoanguka za shamba lako la mizabibu[b]. Ziache kwa maskini na kwa mgeni anayeishi miongoni mwenu[c]. Mimi ni Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usirudie kuvuna shamba lako la mizabibu.” Kitenzi cha Kiebrania kinamaanisha kupitia mizabibu tena ili kuchukua yaliyobaki baada ya mavuno makuu.
    reason: lexical_alternative
  - marker: b
    text: Au, “masazo ya shamba lako la mizabibu.” Kiebrania kinarejelea zabibu zilizoachwa au zilizoanguka wakati wa mavuno.
    reason: lexical_alternative
  - marker: c
    text: Au, “mgeni mkazi.” Neno la Kiebrania linamaanisha mtu asiye mwenyeji wa asili anayeishi miongoni mwa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: shamba lako la mizabibu
  rationale: Hili ni neno la kawaida na lililo wazi katika Kiswahili kwa eneo linalolimwa mizabibu.
- source_word: תְעוֹלֵל
  choice: usivune kabisa
  rationale: Katika muktadha huu kitenzi kinakataza kurudia mizabibu na kuchukua yote yaliyobaki baada ya mavuno makuu. Tafsiri hii inaeleza uvunaji wa kumaliza bila kumwekea maskini chochote.
- source_word: פֶרֶט
  choice: zabibu zilizoanguka
  rationale: Neno hili humaanisha zabibu zilizotengana na vishada au zilizoanguka wakati wa mavuno; tafsiri ya wazi inafaa kwa msomaji wa sasa.
- source_word: תְלַקֵּט
  choice: usikusanye
  rationale: Kitenzi לקט humaanisha kukusanya au kuokota kilichobaki au kilichoanguka.
- source_word: לֶעָנִי
  choice: kwa ajili ya maskini
  rationale: עָנִי hapa humaanisha mtu maskini au mwenye uhitaji; “maskini” ni neno la moja kwa moja na la kawaida.
- source_word: וְלַגֵּר
  choice: na mgeni anayeishi kati yenu
  rationale: גֵּר ni mtu asiye mwenyeji wa asili lakini anayeishi miongoni mwa jamii ya Israeli; usemi huu unaepuka maana pana kupita kiasi ya “mgeni” peke yake.
- source_word: תַּעֲזֹב אֹתָם
  choice: ziache
  rationale: עזב hapa ni kuacha mazao yaliyobaki ili wengine wayapate, si kuyatupa au kuyatelekeza kabisa. Kiambishi “zi-” kinarejelea zabibu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi, kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: 'Hii inadumisha tamko la agano linaloweka msingi wa amri: “Mimi ni Yahwe, Mungu wenu.”'
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lenyewe linatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na ni umbo linalofaa katika tahajia ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Sentensi fupi zinadumisha muundo wa sheria ya Kiebrania, huku “usivune kabisa” ikieleza kwa kawaida katazo la kuvuna bila kuacha masazo.
