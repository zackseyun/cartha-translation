revisions:
- from: Usivune kabisa shamba lako la mizabibu[a], wala usikusanye zabibu zilizoanguka[b] katika shamba lako la mizabibu. Ziache kwa ajili ya maskini na mgeni anayeishi kati yenu[c]. Mimi ni Yahwe, Mungu wenu.
  to: Usimalize kuvuna shamba lako la mizabibu[a], wala usikusanye zabibu zilizoanguka za shamba lako la mizabibu[b]. Ziache kwa maskini na kwa mgeni anayeishi miongoni mwenu[c]. Mimi ni Yahwe, Mungu wenu.
  rationale: The revision makes the first prohibition explicitly about not completing an exhaustive harvest, preserves the concrete reference to fallen grapes, and uses more idiomatic social wording for the גֵּר. Footnote markers remain correctly anchored and all lexical alternatives are retained.
