review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two prohibitions, the recipients of the leftover produce, and the covenant formula. However, “usivune kabisa shamba lako la mizabibu” is less precise and can sound like a prohibition of harvesting altogether rather than a prohibition against harvesting the vineyard exhaustively. The Hebrew specifically prohibits going over the vineyard so as to take all that remains.
  naturalness: The text is generally clear Standard East African Swahili. “Usimalize kuvuna shamba lako la mizabibu” is more idiomatic and more readily communicates exhaustive harvesting. “Miongoni mwenu” is also more natural than “kati yenu” in this social sense.
  terminology: “Shamba la mizabibu,” “maskini,” “mgeni mkazi,” and “Yahwe” are appropriate. The rendering of פֶּרֶט as “zabibu zilizoanguka” is a clear contextual rendering; its alternative is retained in the note.
  issues:
  - severity: medium
    issue: The opening prohibition is potentially misleading.
    rationale: “Usivune kabisa” can be read as “do not harvest at all.” In context, תְעוֹלֵל prohibits stripping the vineyard by taking what remains after the main harvest. “Usimalize kuvuna” better expresses the intended restriction without importing an unwarranted technical term.
  - severity: low
    issue: The wording for the resident non-native can be smoother.
    rationale: “Miongoni mwenu” is the customary Swahili expression for a person living among the addressed community and preserves the social-legal force of גֵּר.
  revised_text: Usimalize kuvuna shamba lako la mizabibu[a], wala usikusanye zabibu zilizoanguka za shamba lako la mizabibu[b]. Ziache kwa maskini na kwa mgeni anayeishi miongoni mwenu[c]. Mimi ni Yahwe, Mungu wenu.
  revised_footnotes:
