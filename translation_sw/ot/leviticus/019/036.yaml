id: LEV.19.36
reference: Leviticus 19:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: sw
  text: Mtakuwa na mizani za haki, mawe ya kupimia ya haki, efa ya haki[a], na hini ya haki[b]. Mimi ni Yahwe, Mungu wenu, niliyewatoa katika nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa ilikuwa kipimo cha kale cha vitu vikavu.
    reason: cultural_note
  - marker: b
    text: Hini ilikuwa kipimo cha kale cha vimiminika.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: mizani za haki
  rationale: מֹאזְנַיִם ni mizani ya kupimia uzani, na צֶדֶק hapa hudai uadilifu katika biashara. “Za haki” ni ya asili na yenye hadhi, nayo inadumisha urudiaji wa neno la Kiebrania.
- source_word: אַבְנֵי צֶדֶק
  choice: mawe ya kupimia ya haki
  rationale: אַבְנֵי maana yake halisi ni “mawe,” yaani mawe yaliyotumiwa kama vipimo vya uzani. Tafsiri hii inadumisha picha ya utamaduni wa kale huku “ya kupimia” ikifafanua matumizi yake.
- source_word: אֵיפַת צֶדֶק
  choice: efa ya haki
  rationale: אֵיפָה ni kipimo cha kale cha vitu vikavu. Jina “efa” limehifadhiwa badala ya kupewa thamani ya kisasa isiyo kamili.
- source_word: וְהִין צֶדֶק
  choice: na hini ya haki
  rationale: הִין ni kipimo cha kale cha vimiminika. Uhawilishaji “hini” huhifadhi kipimo mahususi cha mazingira ya kale.
- source_word: יִהְיֶה לָכֶם
  choice: Mtakuwa na
  rationale: Kifungu hiki ni “itakuwa kwenu” kwa muundo wa karibu, lakini katika Kiswahili agizo la kuwa na vipimo hivyo linaelezwa kwa kawaida na wazi kwa “Mtakuwa na.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehawilishwa kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika kauli hii ya agano, umbo hilo humaanisha Mungu mmoja wa Israeli na lina kiambishi cha nafsi ya pili wingi.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: niliyewatoa katika nchi ya Misri
  rationale: Hii inadumisha kauli ya msingi ya kutoka Misri na kuunganisha agizo na tendo la Yahwe la kuwakomboa watu wake.
theological_decisions:
- issue: Maana ya צֶדֶק inayorudiwa katika sheria ya biashara
  choice: ya/za haki
  alternative: sahihi; za uaminifu
  rationale: “Haki” huhifadhi upana wa maana ya צֶדֶק—haki, uadilifu, na unyofu—badala ya kuifanya iwe usahihi wa kiufundi pekee. Urudiaji wake mara nne pia umehifadhiwa.
- issue: Namna ya kutafsiri vipimo vya kale
  choice: kuhifadhi “efa” na “hini”
  alternative: kipimo cha vitu vikavu; kipimo cha vimiminika; makadirio ya vipimo vya kisasa
  rationale: Majina ya vipimo mahususi yamehifadhiwa ili kuepuka makadirio ya kisasa yanayoweza kupotosha; tanbihi zinaeleza aina zake.
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Uhawilishaji huu huhifadhi jina binafsi lililo katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo wa “ya/za haki” umetumiwa kwa uthabiti ili kuhifadhi urudiaji na uzito wa kimaadili wa Kiebrania. Alama za tanbihi zimewekwa moja kwa moja baada ya vipimo vinavyoelezwa.
