base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: sw
  text: Lakini katika mwaka wa nne, matunda yake yote yatakuwa matakatifu[a], kwa ajili ya kumsifu Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri rasmi zaidi, “matakatifu, sifa kwa Yahwe,” au “matakatifu, kwa sifa kwa Yahwe.” Kifungu hiki cha Kiebrania ni adimu na huenda kinakazia sifa ya shangwe inayotolewa pamoja na matunda hayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה
  choice: Lakini katika mwaka
  rationale: Kiunganishi ו kinatolewa kwa maana ya utofautishaji kulingana na muktadha wa miaka mitatu iliyotangulia, huku ב kikionyesha wakati.
- source_word: הָרְבִיעִת
  choice: wa nne
  rationale: Ni kivumishi cha mp ترتيب kinachofafanua 'mwaka'.
- source_word: יִהְיֶה
  choice: yatakuwa
  rationale: Wakati ujao unafaa mtindo wa sheria; upatanisho wa kisarufi unafuata 'matunda' katika Kiswahili.
- source_word: כָּל פִּרְיוֹ
  choice: matunda yake yote
  rationale: Kifungu hiki kinamaanisha mazao yote ya mti; Kiswahili cha kawaida hutumia 'matunda' kwa wingi.
- source_word: קֹדֶשׁ
  choice: matakatifu
  rationale: Huhifadhi wazo la kuwekwa wakfu na uzito wa kidini wa neno la Kiebrania.
- source_word: הִלּוּלִים
  choice: kwa ajili ya kumsifu
  rationale: Nomino hii adimu inahusiana na sifa au shangwe; tafsiri hii haiongezi wazo mahususi la sadaka lisilotajwa moja kwa moja.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: ל inaonyesha uelekeo au kuwekwa wakfu, na jina la agano יהוה limetafsiriwa kwa jina lake, Yahwe.
theological_decisions:
- issue: Maana ya kifungu adimu קֹדֶשׁ הִלּוּלִים
  choice: matakatifu, kwa ajili ya kumsifu Yahwe
  alternative: matakatifu, sifa kwa Yahwe; au matakatifu, kwa sifa kwa Yahwe
  rationale: Tafsiri kuu inaeleza matumizi ya matunda katika sifa bila kuyaita moja kwa moja sadaka, huku tanbihi ikihifadhi muundo na utata wa kifungu cha Kiebrania.
- issue: Uwasilishaji wa יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Huhifadhi jina la agano lililo katika matini ya Kiebrania badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi utata wa kifungu adimu cha ibada.
