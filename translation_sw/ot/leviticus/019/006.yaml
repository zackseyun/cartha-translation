  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: sw
  text: Siku ya dhabihu yenu, italiwa siku hiyo na siku inayofuata; kilichosalia hadi siku ya tatu kitachomwa moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: siku mtakapotoa dhabihu yenu
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida wakati wa kutoa dhabihu, huku ukihifadhi maana ya siku ya dhabihu yenu.
- source_word: יֵאָכֵל
  choice: italiwa
  rationale: Kauli ya kutendwa ya wakati ujao inafaa kwa agizo hili la kisheria na inalingana moja kwa moja na Niphal ya Kiebrania.
- source_word: וּמִמָּחֳרָת
  choice: na siku inayofuata
  rationale: Hii ni tafsiri ya kawaida na wazi ya muda unaorejelewa, bila kutumia usemi wa kizamani.
- source_word: וְהַנּוֹתָר
  choice: lakini kile kitakachobaki
  rationale: Kishirikishi hiki kinarejelea sehemu ya dhabihu inayosalia; lakini linaonyesha mgeuko wa agizo kutoka kula hadi kuondoa mabaki.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: mpaka siku ya tatu
  rationale: Mpaka huhifadhi kikomo cha muda kinachoonyeshwa na עַד.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: kitateketezwa kwa moto
  rationale: Kutetekezwa kwa moto ni Kiswahili cha kawaida kwa kuangamizwa kabisa kwa kuchomwa, na kauli ya kutendwa huhifadhi muundo wa Kiebrania.
