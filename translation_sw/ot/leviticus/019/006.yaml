translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Hakuna tanbihi iliyohitajika, kwa kuwa mgawanyo wa sentensi unaonyesha wazi kuwa kula kunaruhusiwa siku ya dhabihu na siku inayofuata, kisha mabaki yanapaswa kuteketezwa.
