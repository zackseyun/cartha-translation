base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: sw
  text: Mtazishika sheria zangu. Usipandishe mifugo yako kwa aina tofauti; usipande shamba lako mbegu za aina tofauti; wala usivae vazi la mchanganyiko wa aina tofauti, shaatnezi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania shaatnezi ni istilahi ya kiufundi ya kitambaa cha mchanganyiko kilichokatazwa; kwa mapokeo hueleweka kuwa mchanganyiko wa sufu na kitani. Linganisha Kumbukumbu la Torati 22:11.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: sheria zangu
  rationale: Neno חֻקָּה linamaanisha masharti au amri zilizowekwa. “Sheria zangu” ni lugha ya kawaida, yenye hadhi, na huhifadhi uzito wa kisheria.
- source_word: תִּשְׁמֹרוּ
  choice: mtazishika
  rationale: Katika muktadha wa agano na sheria, שׁמר humaanisha kushika au kutii; “mtazishika” huhifadhi muundo wa amri wa Kiebrania.
- source_word: בְּהֶמְתְּךָ
  choice: mifugo yako
  rationale: בְּהֵמָה hapa inahusu kwa upana wanyama wanaofugwa, si ng’ombe pekee.
- source_word: תַרְבִּיעַ
  choice: usipandishe
  rationale: Hifili ya רבע inamaanisha kusababisha wanyama wapandane. “Kupandisha” ni istilahi ya kawaida ya Kiswahili kuhusu uzalishaji wa mifugo.
- source_word: כִּלְאַיִם
  choice: aina moja kwa aina nyingine / aina mbili / mchanganyiko
  rationale: Neno hili linalorudiwa mara tatu linahusu kuchanganya aina tofauti; Kiswahili kimetofautishwa kidogo kulingana na wanyama, mbegu, na nguo ili sentensi iwe wazi na ya asili.
- source_word: שָׂדְךָ
  choice: shamba lako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha umilikaji.
- source_word: תִזְרַע
  choice: usipande
  rationale: זרע hapa ni kupanda kwa kutawanya au kuweka mbegu; “kupanda” ndiyo lugha ya kawaida na pana katika Kiswahili cha kisasa.
- source_word: בֶגֶד
  choice: vazi
  rationale: בֶּגֶד ni nguo au vazi; “vazi” huhifadhi umoja na mtindo wenye hadhi.
- source_word: שַׁעַטְנֵז
  choice: shaatnezi
  rationale: Ni istilahi nadra ya kiufundi. Unukuzi huihifadhi bila kudai katika matini kuu ufafanuzi ulio kamili kuliko ushahidi wa mstari huu.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: lisivaliwe mwilini mwako
  rationale: Ingawa kihalisi ni “lisipande juu yako,” katika muktadha wa vazi maana ya kawaida ni kulivaa. Tafsiri hii ni wazi katika Kiswahili bila kubadili nguvu ya katazo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umoja wa anayesemeshwa katika masharti mahususi umehifadhiwa kwa “yako,” huku wingi wa amri ya utangulizi ukihifadhiwa kwa “mtazishika.” Istilahi ya ufugaji “kupandisha” imetumiwa kwa usahihi na uelewekaji.
