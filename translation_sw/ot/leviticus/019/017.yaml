base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: sw
  text: Usimchukie ndugu yako moyoni mwako. Lazima umkemee mwenzako, wala usijiletee hatia kwa sababu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usibebe dhambi kwa sababu yake,” au “usishiriki katika dhambi yake.” Usemi wa Kiebrania ni wa kinahau na unaweza kumaanisha kuwa na hatia kwa sababu ya kutomkabili mtu kuhusu kosa lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: umchukie
  rationale: Kitenzi hiki humaanisha kuchukia; tafsiri hii inadumisha uzito wa moja kwa moja wa katazo.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Neno linaweza kumaanisha ndugu wa damu au mwanajumuiya mwenzake. “Ndugu yako” huhifadhi lugha ya kifamilia na ya agano katika chanzo.
- source_word: בִּלְבָבֶךָ
  choice: moyoni mwako
  rationale: Hurejelea utu wa ndani, ikiwemo fikira na nia. Usemi huu ni wa kawaida katika Kiswahili na huhifadhi mkazo wa ndani wa amri.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: ni lazima umkemee ... waziwazi
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina cha kusisitiza huipa amri nguvu. “Ni lazima” huonyesha ulazima, na “waziwazi” huwasilisha wazo la kukabiliana kwa dhahiri bila kutumia Kiswahili kisicho cha kawaida.
- source_word: עֲמִיתֶךָ
  choice: mwenzako
  rationale: Neno hili humaanisha mshirika au mwanajumuiya mwenzake. “Mwenzako” ni pana kidogo kuliko “jirani yako” na linafaa kwa maana ya mtu wa jamii moja katika muktadha huu.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: usijiletee hatia kwa sababu yake
  rationale: Usemi huu unaweza kumaanisha kubeba dhambi, kupata hatia kwa sababu ya mwingine, au kushiriki dhambi yake. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha uwezekano wa mtu kuwa na hatia kwa kutokemea kosa, huku tanbihi ikihifadhi maana nyingine.
theological_decisions:
- issue: Upeo wa lugha ya kindugu katika maadili ya agano
  choice: Kuhifadhi “ndugu yako” na “mwenzako” katika umoja badala ya kuifanya lugha hiyo kuwa ya jumla kabisa.
  alternative: mtu mwenzako; Mwisraeli mwenzako
  rationale: Kiebrania kina maneno ya uhusiano katika umoja wa kiume yenye matumizi wakilishi. “Ndugu yako” huhifadhi taswira ya kifamilia na ya agano bila kuzuia matumizi mapana katika jumuiya.
- issue: Maana ya kupata au kubeba dhambi kwa sababu ya mwenzako
  choice: “usijiletee hatia kwa sababu yake,” ikidokeza kuwajibika kwa kutokemea kosa.
  alternative: usibebe dhambi yake; usishiriki dhambi yake
  rationale: Kiebrania ni nahau yenye uwezekano wa maana zaidi ya moja. Maandishi makuu yanatumia Kiswahili kinachoeleweka, na tanbihi inahifadhi utata halisi bila kuufunga kwa fundisho maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri ni wa moja kwa moja; “moyoni mwako” na “waziwazi” ni misemo inayoeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachofafanuliwa.
