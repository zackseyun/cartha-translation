base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: sw
  text: Mnapovuna mavuno ya ardhi yenu, msivune ukingo wote wa shamba lako,[a] wala msikusanye mabaki ya mavuno yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembe ya shamba lako.” Neno la Kiebrania linaweza kumaanisha ukingo, upande, au pembe; hapa linarejelea sehemu ya nje ya shamba inayopaswa kuachwa bila kuvunwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: Mnapovuna
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaanzisha hali ya wakati; “Mnapovuna” ni Kiswahili cha kawaida na huhifadhi wingi wa wahusika.
- source_word: קְצִיר אַרְצְכֶם
  choice: mavuno ya nchi yenu
  rationale: קְצִיר hapa ni mavuno, na אֶרֶץ ina maana ya nchi/ardhi inayolimwa; “nchi yenu” pia huhifadhi wingi wa Kiebrania.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: msivune kabisa
  rationale: כלה katika piel humaanisha kukamilisha au kumaliza; “msivune kabisa” huonyesha kuwa sehemu hiyo haipaswi kuvunwa yote.
- source_word: פְּאַת שָׂדְךָ
  choice: ukingo wa shamba lako
  rationale: פֵּאָה inaweza kumaanisha ukingo, upande, au pembe; katika sheria hii “ukingo” hueleweka kwa urahisi kama sehemu ya nje ya shamba.
- source_word: לֶקֶט קְצִירְךָ
  choice: masazo ya mavuno yako
  rationale: לֶקֶט ni mazao yaliyodondoka au kubaki wakati wa kuvuna; “masazo ya mavuno” ni usemi wazi kwa msomaji wa kawaida.
- source_word: לֹא תְלַקֵּט
  choice: wala msikusanye
  rationale: לקט ni kukusanya au kuokota vilivyobaki; “msikusanye” ni ya asili na hutofautisha tendo hili na kuvuna.
