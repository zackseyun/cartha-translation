  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: sw
  text: Na mtakapomtolea Yahweh dhabihu ya amani, mtaitoa ili mpate kukubaliwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “kwa ajili ya kukubaliwa kwenu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Nanyi mtakapomtolea
  rationale: Katika sheria hii, כִּי inaanzisha hali ya wakati au sharti. Muundo wa “mtakapo-” ni wa kawaida katika Kiswahili na unaendeleza maagizo yaliyotangulia.
- source_word: תִזְבְּחוּ
  choice: mtakapomtolea ... dhabihu
  rationale: Kitenzi זבח humaanisha kuchinja au kutoa dhabihu. “Kumtolea ... dhabihu” ni Kiswahili cha kawaida cha ibada na kinaonyesha kuwa dhabihu inaelekezwa kwa Yahweh.
- source_word: זֶבַח שְׁלָמִים
  choice: dhabihu ya amani
  rationale: Hili ni jina la aina maalumu ya dhabihu. “Dhabihu ya amani” ni tafsiri wazi na iliyo karibu na neno שְׁלָמִים kuliko tafsiri fafanuzi kama “sadaka ya ushirika.”
- source_word: לַ/יהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahweh”; muundo “kumtolea Yahweh” pia unaonyesha maana ya ל ya kuelekeza au kuweka wakfu dhabihu kwake.
- source_word: לִ/רְצֹנְ/כֶם
  choice: ili mpate kukubaliwa
  rationale: Katika sheria za dhabihu, רָצוֹן hapa inaelekea kumaanisha kukubalika mbele za Mungu. Tafsiri hii ni ya asili katika Kiswahili huku maelezo ya chini yakihifadhi muundo wa karibu zaidi na Kiebrania.
- source_word: תִּזְבָּחֻהוּ
  choice: mtaitoa
  rationale: Kiambishi cha nafsi ya tatu umoja kinarejelea dhabihu. “Mtaitoa” kinahifadhi kurudiwa kwa tendo bila kufanya sentensi ya Kiswahili kuwa nzito kwa kurudia neno “dhabihu.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִרְצֹנְכֶם katika sheria ya dhabihu
  choice: ili mpate kukubaliwa
  alternative: kwa ajili ya kukubaliwa kwenu; kwa hiari yenu
  rationale: Muktadha wa dhabihu unaunga mkono maana ya kukubalika kwa waabudu au dhabihu mbele za Mungu. “Kwa hiari yenu” ingehamisha mkazo kwa mapendeleo ya mtoaji, jambo ambalo si dhahiri katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa wingi wa nafsi ya pili umehifadhiwa, na urudiaji wa kitenzi cha dhabihu umeonyeshwa kwa “mtaitoa.”
