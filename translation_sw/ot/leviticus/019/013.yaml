  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: sw
  text: Usimwonee jirani yako wala usimpore. Ujira wa mfanyakazi usibaki kwako mpaka asubuhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: usimwonee
  rationale: Kitenzi עָשַׁק huonyesha kumkandamiza mtu au kumnyima haki yake kwa kutumia vibaya uwezo. “Kumwonea” ni Kiswahili cha kawaida chenye upana huo wa kimaadili na kinafaa katika muktadha wa ujira.
- source_word: רֵעֲךָ
  choice: jirani yako
  rationale: Katika sheria za maadili za Torati, רֵעַ humaanisha mtu wa jamii anayehusiana na mhusika. “Jirani yako” ni tafsiri iliyo wazi na inayodumisha uhusiano wa kijamii unaokusudiwa.
- source_word: תִגְזֹל
  choice: usimpore
  rationale: גָּזַל humaanisha kunyakua au kuchukua mali ya mwingine isivyo halali, mara nyingi kwa nguvu. “Kumpora” ni sahihi na ina nguvu kuliko neno la jumla “kuiba.”
- source_word: תָלִין
  choice: usibaki
  rationale: Kitenzi hiki kiko katika nafsi ya tatu ya kike na kinapatana na פְּעֻלַּת, yaani ujira. “Usibaki” hudumisha ujira kuwa kiima cha sentensi na kueleza kutouzuia hadi siku inayofuata.
- source_word: פְּעֻלַּת
  choice: ujira wa
  rationale: Ingawa פְּעֻלָּה linaweza kumaanisha kazi au malipo yake, muunganiko wake na שָׂכִיר na katazo la kuchelewesha malipo unaonyesha wazi maana ya “ujira.”
- source_word: שָׂכִיר
  choice: mfanyakazi
  rationale: שָׂכִיר ni mtu anayefanya kazi kwa ujira. Katika sentensi hii, neno “ujira” tayari linaweka wazi kuwa mfanyakazi huyo ameajiriwa, hivyo “mfanyakazi” ni ya kawaida na huepuka urudiaji mzito.
- source_word: אִתְּךָ
  choice: kwako
  rationale: Kirai hiki kinaonyesha kwamba mwajiri bado anaushikilia ujira. “Kwako” ni fupi, asilia, na hudumisha picha ya ujira kubaki mikononi mwa mwenye wajibu wa kuulipa.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Tafsiri hii inahifadhi kikomo halisi cha muda kilichotajwa katika Kiebrania badala ya kukifupisha kuwa “usiku kucha.”
