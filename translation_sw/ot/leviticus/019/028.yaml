base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: sw
  text: Msijitie chale miilini kwa ajili ya mtu aliyekufa[a], wala msijiwekee alama ya kudumu mwilini[b]. Mimi ni Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya wafu.” Msemo wa Kiebrania kwa kawaida unahusu kujikata kama desturi ya kumwombolezea mtu aliyekufa.
    reason: lexical_alternative
  - marker: b
    text: Au, “tatoo,” “alama iliyochorwa,” au “alama iliyochanjwa.” Msemo wa Kiebrania ni adimu na huenda unamaanisha alama ya kudumu kwenye ngozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: msijikate
  rationale: Nomino hii humaanisha mkato au chale katika mwili. Kitenzi cha Kiswahili ‘kujikatakata’ kingeweza kudokeza marudio au ukali usiotajwa wazi; ‘msijikate’ ni cha kawaida na kinahifadhi tendo lililokatazwa.
- source_word: לָנֶפֶשׁ
  choice: kwa ajili ya mtu aliyekufa
  rationale: Katika muktadha huu wa sheria, נֶפֶשׁ humaanisha mtu aliyekufa, hasa kuhusiana na desturi za maombolezo. Tafsiri hii inaeleza nahau bila kuitafsiri kama ‘nafsi.’
- source_word: בִּבְשַׂרְכֶם
  choice: miili yenu
  rationale: Ingawa בָּשָׂר kihalisi ni ‘nyama,’ katika Kiswahili ‘miili yenu’ huwasilisha wazi sehemu ya mwili inayokusudiwa bila maana isiyofaa ya nyama ya chakula.
- source_word: כְתֹבֶת קַעֲקַע
  choice: alama ya kudumu mwilini
  rationale: Msemo huu adimu unaelekea kumaanisha alama iliyoandikwa, kuchorwa, au kuchanjwa kwenye ngozi. ‘Alama ya kudumu mwilini’ huhifadhi upana wa ushahidi wa Kiebrania; tanbihi inatoa ‘tatoo’ kama mbadala wa kawaida.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: wala msijiwekee ... mwilini
  rationale: נתן pamoja na ב hapa hudokeza kuweka au kutia alama mwilini. ‘Msijiwekee’ ni katazo la moja kwa moja na la kawaida katika Kiswahili.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: Jina la agano יהוה limetolewa kama ‘Yahwe,’ kwa uwazi na kufuata namna lilivyo katika chanzo, huku fomula ya kujitambulisha ikihifadhiwa.
theological_decisions:
- issue: Upeo wa katazo la alama ya mwilini
  choice: Kutafsiri lugha ya tendo moja kwa moja bila kuifungamanisha kimya kimya na maombolezo wala kuitangaza kuwa hukumu ya kila desturi ya kisasa
  alternative: Kulihusisha katazo la pili na ibada za maombolezo pekee, au kulipanua wazi kuwa katazo la kila aina ya tatoo katika kila utamaduni
  rationale: Kishazi ‘kwa ajili ya mtu aliyekufa’ kinaeleza katazo la kwanza waziwazi, lakini hakirudiwi katika la pili. Tafsiri inadumisha tofauti hiyo na kuacha suala la matumizi yake bila kulitatua ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msijikate miili yenu’ ni cha kueleweka kwa wasomaji wa kawaida; ‘alama ya kudumu mwilini’ huepuka kuamua kupita kiasi maana ya msemo adimu, huku tanbihi ikitaja ‘tatoo.’
