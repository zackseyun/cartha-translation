  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: sw
  text: Msigeukie sanamu[a], wala msijitengenezee miungu ya kusubu[b]. Mimi ni Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu zisizofaa kitu”; neno la Kiebrania linaweza kuwa na maana ya dharau inayoonyesha ubatili wao.
    reason: lexical_alternative
  - marker: b
    text: Au “miungu iliyofuliwa kwa chuma” au “sanamu za chuma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: msigeukie
  rationale: Kitenzi פנה pamoja na אֶל humaanisha kugeukia au kuelekeza nafsi kwa kitu. “Msigeukie” kinahifadhi maana hiyo bila kuibana kuwa ibada pekee.
- source_word: אֱלִילִים
  choice: sanamu za kuabudiwa
  rationale: Neno hili humaanisha sanamu za kidini na linaweza kuwa na dharau ya kuonyesha ubatili wake. Usemi huu ni wa kawaida na unaeleweka, huku kidokezo cha ubatili kikihifadhiwa katika tanbihi.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: miungu ya chuma iliyoyeyushwa
  rationale: Muundo huu unataja miungu au sanamu zilizotengenezwa kwa chuma kilichoyeyushwa na kumiminwa. Tafsiri inadumisha wingi wa אֱלֹהֵי na namna ya utengenezaji katika מַסֵּכָה.
- source_word: תַעֲשׂוּ לָכֶם
  choice: msijitengenezee
  rationale: Kiambishi לָכֶם kinaonyesha kujitengenezea kwa matumizi au umiliki wa wahusika wenyewe; “msijitengenezee” ni Kiswahili cha kawaida chenye maana hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa אֱלֹהִים lina umbo la wingi, hapa fomula ya agano na sintaksia humrejelea Mungu mmoja wa Israeli.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko lina jina binafsi la Mungu, יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Iwapo kugeukia sanamu kuelezwe moja kwa moja kuwa kuziabudu
  choice: msigeukie sanamu za kuabudiwa
  alternative: msiabudu sanamu
  rationale: Kitenzi פנה hakisemi wazi “kuabudu,” bali kugeukia au kujielekeza kwao. Tafsiri iliyochaguliwa inadumisha upana huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Sanamu za kuabudiwa” huepuka utata wa “sanamu” kwa maana ya mchongo wa kawaida; “msijitengenezee” huwasilisha kwa ufupi maana ya kujifanyia. Alama zote za tanbihi zimewekwa katika matini.
