    rationale: Ingawa maana inaweza kueleweka, usemi huu unaweza kudokeza mti unaoliwa. "Mti wowote wa matunda ya kuliwa" ni wa kawaida zaidi katika Kiswahili na huonyesha עֵץ מַאֲכָל kwa uwazi.
  - severity: low
