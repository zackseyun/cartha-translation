  terminology: Sitiari ya ערל/ערלה inapaswa ihifadhiwe kwa "yasiyotahiriwa," huku tanbihi ikifafanua matumizi yake ya sitiari. Hii hudumisha uradidi wa istilahi ya Kiebrania katika vifungu vyote viwili bila kuibadilisha kuwa tafsiri ya athari pekee, kama "yaliyokatazwa."
