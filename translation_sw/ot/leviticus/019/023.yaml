  to: Mtakapoingia katika nchi na kupanda mti wowote wa matunda ya kuliwa, mtayahesabu matunda yake kuwa yasiyotahiriwa.[a] Kwa miaka mitatu yatakuwa kwenu yasiyotahiriwa; hayataliwa.
