  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: hali ya wakati ujao, kuingia katika nchi, upandaji wa miti ya chakula, sitiari ya kutotahiriwa, kipindi cha miaka mitatu, na katazo la kuliwa. Hata hivyo, neno "kama" katika sentensi ya pili hudhoofisha tamko la moja kwa moja la יִהְיֶה ... עֲרֵלִים ("yatakuwa ... yasiyotahiriwa"), na linapaswa kuondolewa.'
