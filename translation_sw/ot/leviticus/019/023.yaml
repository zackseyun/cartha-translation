  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: sw
  text: Mtakapoingia katika nchi na kupanda mti wowote wa matunda ya kuliwa, mtayahesabu matunda yake kuwa yasiyotahiriwa.[a] Kwa miaka mitatu yatakuwa kwenu yasiyotahiriwa; hayataliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “yasiyotahiriwa.” Neno hili limetumiwa kwa njia ya sitiari kumaanisha kwamba matunda hayo hayaruhusiwi kuliwa katika miaka mitatu ya kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל הָאָרֶץ
  choice: Mtakapoingia katika nchi
  rationale: Katika sheria hii, וְכִי inaanzisha hali ya wakati ujao, na בוא אל הארץ humaanisha kuingia katika nchi. 'Nchi' huhifadhi rejeo la agano bila kuongeza jina lisilotajwa.
- source_word: וּנְטַעְתֶּם כָּל עֵץ מַאֲכָל
  choice: na kupanda mti wowote wa chakula
  rationale: Usemi huu unarejelea mti wowote unaopandwa kwa ajili ya matunda yanayoliwa; tafsiri hii ni ya kawaida na huhifadhi maana ya כָּל.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת פִּרְיוֹ
  choice: mtayahesabu matunda yake kuwa hayajatahiriwa
  rationale: Kitenzi na nomino zinazotokana na ערל zinatumika kwa sitiari kuipa matunda hadhi fulani, si kueleza tendo halisi la kimwili. 'Mtayahesabu ... kuwa' huonyesha hadhi hiyo ya kisheria huku ikihifadhi sitiari.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: Kwa miaka mitatu yatakuwa kwenu kama yasiyotahiriwa
  rationale: Kirai cha muda kimewekwa mbele kama katika Kiebrania. Wingi wa Kiswahili unafuata 'matunda,' na 'kwenu' huhifadhi לָכֶם.
- source_word: לֹא יֵאָכֵל
  choice: hayapaswi kuliwa
  rationale: Nifali ni ya hali ya kutendwa na ina nguvu ya katazo; 'hayapaswi kuliwa' huhifadhi muundo usioelekeza amri moja kwa moja kwa mhusika.
theological_decisions:
- issue: Iwapo sitiari ya matunda 'yasiyotahiriwa' ihifadhiwe au ibadilishwe kuwa 'yaliyokatazwa'
  choice: Kuhifadhi lugha ya kutotahiriwa katika maandishi makuu
  alternative: Kuyaita matunda yaliyokatazwa
  rationale: Kiebrania hutumia kwa makusudi ערל/ערלה, lugha yenye mwangwi wa agano na ibada. 'Yaliyokatazwa' hueleza matokeo ya kisheria lakini hufuta sitiari; tanbihi inaeleza maana yake katika muktadha huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya heshima na inayoeleweka kwa wasomaji wa kawaida. Sitiari ya Kiebrania imehifadhiwa, huku 'kama yasiyotahiriwa' ikisaidia mtiririko wa Kiswahili bila kuondoa mvutano wa istilahi ya asili.
