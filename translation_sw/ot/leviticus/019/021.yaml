base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: sw
  text: 'Naye ataleta sadaka yake ya hatia[a] kwa Yahwe, kwenye mlango wa hema la mkutano: kondoo dume kama sadaka ya hatia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka yake ya fidia.” Neno la Kiebrania אָשָׁם linaweza kumaanisha hatia na pia sadaka inayotolewa ili kufidia hatia hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Naye ataleta
  rationale: Muundo huu katika sheria una nguvu ya agizo linalopaswa kutekelezwa; wakati ujao wa Kiswahili unaeleza wajibu huo kwa kawaida bila kutumia mtindo mzito.
- source_word: אֲשָׁמוֹ
  choice: sadaka yake ya hatia
  rationale: Katika muktadha huu אָשָׁם inataja sadaka inayohusiana na hatia na fidia yake. Tafsiri hii inabaki wazi na inaendana na matumizi ya pili ya neno hilo katika mstari.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha kuwa sadaka inaletezwa au kuwekwa wakfu kwa Yahwe; ‘kwa Yahwe’ ni Kiswahili cha kawaida kinachohifadhi uhusiano huo.
- source_word: אֶל פֶּתַח
  choice: kwenye ingilio
  rationale: פֶּתַח ni sehemu ya kuingilia au mlango. ‘Kwenye ingilio’ linaonyesha mahali ambapo sadaka inapaswa kuletwa.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la mkutano
  rationale: Hili ni jina la mahali patakatifu pa kukutana. ‘Hema la mkutano’ ni wazi, fupi, na la kawaida katika Kiswahili.
- source_word: אֵיל
  choice: kondoo dume
  rationale: אֵיל humaanisha hasa kondoo dume, mnyama anayetakiwa kwa sadaka hii.
- source_word: אָשָׁם
  choice: kuwa sadaka ya hatia
  rationale: Kirai cha mwisho kinaeleza kazi ya kondoo dume katika ibada. ‘Kuwa sadaka ya hatia’ huhifadhi uhusiano wa kiambatano wa Kiebrania.
theological_decisions:
- issue: Utafsiri wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אָשָׁם
  choice: sadaka ya hatia, huku maana mbadala ya fidia ikitajwa katika tanbihi
  alternative: sadaka ya fidia
  rationale: Neno hilo linaweza kutaja hatia na pia sadaka ya kurekebisha au kufidia kosa. Maandishi makuu yanatumia istilahi inayoeleweka, huku tanbihi ikihifadhi upana wa maana ya Kiebrania bila kuondoa mvutano wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa sheria umehifadhiwa kwa wakati ujao wenye nguvu ya agizo; istilahi ya ibada imewekwa wazi bila kuongeza maelezo yasiyomo katika Kiebrania.
