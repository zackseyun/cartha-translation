  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: sw
  text: Kila mtu[a] amche[b] mama yake na baba yake; nanyi mtazishika Sabato zangu. Mimi ni Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia hapa neno la umoja lenye umbo la kiume, yaani “kila mwanamume,” kwa maana ya kugawa agizo kwa kila mshiriki wa jumuiya.
    reason: lexical_alternative
  - marker: b
    text: Au, “amhofu” au “amheshimu kwa kicho.” Kitenzi cha Kiebrania kinaweza kumaanisha hofu yenye staha au kicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Kila mtu
  rationale: Nomino ya umoja imetumiwa kwa maana ya kugawa agizo kwa kila mshiriki wa jumuiya. Kiswahili ‘kila mtu’ ni cha kawaida na hakibadili agizo kuwa la wanaume pekee, ingawa אִישׁ yenyewe ni umbo la kiume.
- source_word: אִמּוֹ וְאָבִיו
  choice: mama yake na baba yake
  rationale: Majina yote mawili ya wazazi yamehifadhiwa, pamoja na mpangilio wa Kiebrania unaomtaja mama kabla ya baba.
- source_word: תִּירָאוּ
  choice: amche
  rationale: Kitenzi ‘kumcha’ huweza kuonyesha hofu yenye heshima na kicho, hivyo kinahifadhi upana wa maana wa ירא katika muktadha huu bila kuifanya kuwa hofu tupu wala heshima tupu.
- source_word: שַׁבְּתֹתַי
  choice: Sabato zangu
  rationale: Wingi na kiwakilishi cha umilikaji wa Mungu vimehifadhiwa kama vilivyo katika Kiebrania.
- source_word: תִּשְׁמֹרוּ
  choice: mtazishika
  rationale: ‘Kushika Sabato’ ni usemi unaoeleweka kwa maana ya kuzitunza na kuzifuata kwa uangalifu; pia unahifadhi nguvu ya agizo la agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika kauli hii ya agano, neno hili linamtaja Mungu mmoja wa Israeli na lina kiambishi cha nafsi ya pili wingi.
theological_decisions:
- issue: Nguvu ya kihisia na kimaadili ya agizo kuhusu wazazi
  choice: amche mama yake na baba yake
  alternative: amheshimu mama yake na baba yake
  rationale: ‘Amche’ huhifadhi wazo la hofu, kicho, na staha lililomo katika ירא; ‘amheshimu’ lingeweza kulainisha nguvu hiyo na kupunguza utata halisi wa neno.
- issue: Uwakilishi wa kijinsia katika אִישׁ ya umoja yenye matumizi ya kugawa
  choice: Kila mtu
  alternative: Kila mwanamume
  rationale: Katika sentensi hii אִישׁ inagawa wajibu kwa watu wa jumuiya, na kitenzi kinachofuata kiko katika wingi. ‘Kila mwanamume’ kwa Kiswahili kingeweza kueleweka kuwa amri hii inawahusu wanaume pekee, jambo ambalo matumizi ya kimuktadha hayalazimishi; tanbihi inaonyesha umbo la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ‘mama yake na baba yake’ umehifadhiwa kwa makusudi. Mabadiliko kutoka umoja wa kugawa (‘Kila mtu amche’) kwenda wingi wa jumuiya (‘nanyi mtazishika’) yanafuata muundo wa Kiebrania.
