id: LEV.5.11
reference: Leviticus 5:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: sw
  text: Lakini ikiwa uwezo wake hautoshi[a] kupata hua wawili au makinda mawili ya njiwa, ataleta kama sadaka yake kwa ajili ya dhambi aliyotenda sehemu moja ya kumi ya efa ya unga laini, iwe sadaka ya dhambi. Asiutie mafuta wala ubani, kwa sababu ni sadaka ya dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “mkono wake haufikii”—nahau ya Kiebrania inayomaanisha kwamba hana uwezo wa kutosha wa kupata vitu hivyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: uwezo wake hautoshi
  rationale: Nahau ya Kiebrania, kwa neno halisi ‘mkono wake haufikii,’ inaonyesha kwamba mtu hana uwezo wa kutosha wa kiuchumi. Kauli hii ni ya kawaida na yenye heshima katika Kiswahili, huku tanbihi ikihifadhi taswira ya asili.
- source_word: תֹרִים
  choice: hua
  rationale: Neno hili humaanisha hasa hua katika sheria za sadaka, si ndege wote wa jamii ya njiwa kwa ujumla.
- source_word: בְנֵי יוֹנָה
  choice: makinda ya njiwa
  rationale: Kauli ya Kiebrania kwa neno halisi ni ‘wana wa njiwa,’ yaani njiwa wachanga; ‘makinda’ ni Kiswahili cha asili kwa watoto wa ndege.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: Ni neno pana kwa kitu kinacholetwa mbele za Mungu. ‘Sadaka’ linafaa hapa kwa sababu kinachotolewa ni unga, si mnyama anayechinjwa.
- source_word: אֲשֶׁר חָטָא
  choice: kwa ajili ya dhambi aliyotenda
  rationale: Muundo huu unaeleza uhusiano wa sadaka na kosa la mtu kwa Kiswahili kinachoeleweka, bila kuongeza aina ya kosa.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: sehemu moja ya kumi ya efa
  rationale: Kipimo cha kale ‘efa’ kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa kisicho hakika.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hili ni neno la unga uliosagwa vizuri uliotumiwa katika sadaka.
- source_word: לְחַטָּאת
  choice: iwe sadaka ya dhambi
  rationale: Katika muktadha huu neno חַטָּאת linataja sadaka inayohusiana na dhambi, na si dhambi yenyewe tu.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: Asiutie mafuta
  rationale: Kauli hii inatoa katazo la moja kwa moja kuhusu matayarisho ya unga; kiambishi ‘-u-’ kinarejelea unga.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: wala ubani
  rationale: ‘Ubani’ ni jina la kawaida la Kiswahili kwa resini yenye harufu iliyotumiwa katika ibada; kitenzi kutoka kishazi kilichotangulia kinaeleweka hapa.
- source_word: כִּי חַטָּאת הִיא
  choice: kwa sababu ni sadaka ya dhambi
  rationale: Kishazi hiki kinatoa sababu ya kutotiwa mafuta wala ubani na kuhifadhi uainishaji wake wa kiibada.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa sadaka
  choice: sadaka ya dhambi
  alternative: dhambi
  rationale: Ingawa neno linaweza kumaanisha dhambi au sadaka ya dhambi, maagizo hapa yanahusu kitu kinacholetwa na kutayarishwa; kwa hiyo maana ya kiibada ndiyo inayotawala bila kuingiza mfumo wa mafundisho wa baadaye.
- issue: Uwasilishaji wa nahau ya umaskini na nguvu yake ya kisheria
  choice: uwezo wake hautoshi
  alternative: mkono wake haufikii; hawezi kumudu
  rationale: Kauli iliyochaguliwa inaonyesha wazi upungufu wa uwezo wa kiuchumi kwa lugha yenye heshima, na tanbihi inahifadhi muundo halisi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mtu wa tatu umedumishwa, na vipimo pamoja na istilahi za kiibada zimehifadhiwa bila ufafanuzi wa kimadhehebu.
