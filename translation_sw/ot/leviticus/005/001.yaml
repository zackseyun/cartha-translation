base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: sw
  text: Ikiwa mtu anatenda dhambi kwa sababu amesikia mwito wa kiapo wa hadharani[a], naye ni shahidi—iwe ameona au anajua jambo hilo kwa njia nyingine—lakini hatoi taarifa, basi atabeba uovu wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amesikia sauti ya kiapo,” yaani mwito mzito wa kiapo unaowataka wenye habari watoe ushahidi. Neno la Kiebrania linaweza pia kuhusisha laana inayoambatana na kiapo hicho.
    reason: lexical_alternative
  - marker: b
    text: Au, “atawajibika kwa hatia yake.” Nahau ya Kiebrania ina maana kwamba anaendelea kuwa na hatia kwa kutotoa ushahidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria hii neno hili linamaanisha mtu binafsi, si ‘nafsi’ katika maana ya kimetafizikia.
- source_word: תֶחֱטָא
  choice: anatenda dhambi
  rationale: Kitenzi hiki kinaonyesha kosa lenye hatia katika muktadha wa sheria; tafsiri hii inahifadhi uzito wake wa kimaadili na kisheria.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: amesikia mwito wa kiapo hadharani
  rationale: Kirai hiki kinarejelea mwito mzito wa kiapo unaomtaka mwenye habari atoe ushahidi. ‘Mwito wa kiapo hadharani’ ni wa asili katika Kiswahili na unaeleza mazingira ya kisheria bila kuufanya kuwa utaratibu mahususi wa mahakama.
- source_word: וְהוּא עֵד
  choice: naye ni shahidi
  rationale: Hii inadumisha moja kwa moja hadhi ya mtu huyo kama shahidi wa jambo linalohusika.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: iwe ameona au anajua jambo hilo kwa njia nyingine
  rationale: Jozi hii inahusisha kuona moja kwa moja au kuwa na maarifa kwa njia nyingine; nyongeza ‘kwa njia nyingine’ inaonyesha upeo huo bila kubadili maana.
- source_word: אִם לֹא יַגִּיד
  choice: lakini halitoi taarifa
  rationale: Hifili ya נגד humaanisha kufanya jambo lijulikane au kuliripoti. ‘Kutoa taarifa’ ni ya kawaida na pana kiasi cha kujumuisha ushahidi rasmi bila kuuwekea muktadha finyu.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: atabeba uovu wake
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania na uzito wa kuwajibika kwa kosa pamoja na matokeo yake.
theological_decisions:
- issue: Maana ya קוֹל אָלָה katika mazingira ya kisheria
  choice: mwito wa kiapo hadharani
  alternative: sauti ya kiapo; sauti ya laana
  rationale: Neno אָלָה linaweza kuhusisha kiapo au laana inayofungamana nacho. Matini kuu inawasilisha kazi yake ya kisheria, huku tanbihi ikihifadhi uwezekano wa tafsiri halisi zaidi.
- issue: Uwakilishi wa kijinsia katika sheria ya mfano
  choice: Kutumia ‘mtu’ na miundo ya Kiswahili isiyobainisha jinsia
  alternative: Kutumia kiwakilishi cha kiume
  rationale: נֶפֶשׁ humaanisha mtu, na Kiswahili hakilazimishi kubainisha jinsia katika viwakilishi vya ngeli ya mtu. Hivyo tafsiri inabaki ya umoja bila kuongeza jinsia isiyo ya lazima.
- issue: Maana ya kubeba uovu
  choice: atabeba uovu wake
  alternative: atawajibika kwa hatia yake; atabeba adhabu ya uovu wake
  rationale: Kirai cha Kiebrania kinaweza kujumuisha hatia na matokeo yake. Tafsiri iliyochaguliwa inahifadhi mvutano huo badala ya kuufanya kuwa adhabu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sheria ya mfano umehifadhiwa, lakini sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili. ‘Halitoi’ humrejelea ‘mtu’ katika ngeli ya 1 na si alama ya jinsia.
