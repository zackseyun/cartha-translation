id: LEV.5.12
reference: Leviticus 5:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: sw
  text: Kisha ataipeleka kwa kuhani. Kuhani atatwaa konzi moja kutoka katika sadaka hiyo kuwa sehemu yake ya ukumbusho, naye ataiteketeza juu ya madhabahu pamoja na sadaka za Yahwe zinazotolewa kwa moto.[a] Hiyo ni sadaka ya dhambi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza pia kutafsiriwa, “juu ya sadaka za Yahwe zinazotolewa kwa moto.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania linaweza kumaanisha sadaka inayoshughulikia dhambi kwa kuleta utakaso.
    reason: alternative_reading
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Kisha ataipeleka
  rationale: Kitenzi cha Hifili cha בוא pamoja na kiambishi cha kitu cha kike kinarejelea sadaka ya unga iliyotajwa katika muktadha uliotangulia. “Kisha” linaonyesha mfuatano wa sheria kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa כהן katika sheria za ibada.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: atatwaa konzi moja
  rationale: Hii ni tendo maalumu la ibada la kuchukua kiasi kinachoweza kushikwa kwa mkono. “Konzi moja” ni tafsiri fupi na ya kawaida ya מְלֹא קֻמְצוֹ.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: kuwa sehemu yake ya ukumbusho
  rationale: אזכרה ni sehemu maalumu ya sadaka ya unga inayoteketezwa madhabahuni. “Sehemu ya ukumbusho” huhifadhi maana ya kiibada bila kuifanya sadaka nzima kuwa ukumbusho.
- source_word: וְהִקְטִיר
  choice: ataiteketeza
  rationale: Katika muktadha wa dhabihu, Hifili ya קטר humaanisha kuiteketeza sadaka madhabahuni ili ipae kama moshi. “Ataiteketeza” ni ya asili na yenye heshima katika Kiswahili.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: pamoja na sadaka za Yahwe zinazotolewa kwa moto
  rationale: אִשִּׁים ni sadaka zinazotolewa kwa moto, si lazima chakula kwa maana ya kawaida. Katika fomula hii עַל linaweza kueleza kuongezwa au kutolewa pamoja na sadaka hizo; “pamoja na” linaeleza uhusiano huo bila kudai kwamba sehemu hiyo iliwekwa kimwili juu yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: חַטָּאת הִוא
  choice: Hiyo ni sadaka ya dhambi
  rationale: Katika sheria hii חטאת ni jina la aina ya sadaka inayohusika na dhambi. “Sadaka ya dhambi” ni istilahi iliyo wazi kwa wasomaji, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kuitaja sadaka kwa kuhusishwa na dhambi au kusisitiza kazi yake ya kutakasa. Uainishaji wa dhabihu katika mstari huu unaunga mkono “sadaka ya dhambi,” lakini uwezekano wa “sadaka ya utakaso” haujaondolewa na umewekwa katika tanbihi.
- issue: Uhusiano unaoonyeshwa na עַל kabla ya אִשֵּׁי יְהוָה
  choice: pamoja na sadaka za Yahwe zinazotolewa kwa moto
  alternative: juu ya sadaka za Yahwe zinazotolewa kwa moto
  rationale: עַל kwa kawaida humaanisha “juu ya,” lakini katika fomula hii ya kiibada inaweza kueleza kwamba sehemu hiyo inaongezwa kwa sadaka nyingine za moto. Tafsiri kuu inatoa maana ya kiibada kwa Kiswahili cha kawaida, huku tafsiri halisi zaidi ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Istilahi za ibada zimehifadhiwa pale zinapobeba maana maalumu, lakini miundo mizito ya neno kwa neno imeepukwa.
