revisions:
- from: Kama mtu akitenda dhambi na kukosa uaminifu kwa Yahwe kwa kumdanganya mwenzake kuhusu kitu alichokabidhiwa akihifadhi, au kitu kilichowekwa mikononi mwake[a], au kitu alichopora, au akimdhulumu mwenzake,
  to: Kama mtu akitenda dhambi na kukosa uaminifu kwa Yahwe kwa kumdanganya mwenzake kuhusu amana aliyokabidhiwa, au kuhusu kitu kilichowekwa mkononi mwake[a], au kwa uporaji, au akimdhulumu mwenzake,
  rationale: Replaced the object-specific 'kitu alichopora' with 'kwa uporaji' to represent בְגָזֵל as robbery. Added 'kuhusu' before the disputed תְשׂוּמֶת יָד phrase for clear parallelism, while retaining a literal main rendering and the existing footnote alternatives. No theological interpretation has been added.
  reviewer_model: gpt-5.6-terra
