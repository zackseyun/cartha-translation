review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional legal construction, the vertical dimension of unfaithfulness toward Yahwe, the fellow-community member, the entrusted deposit, and oppression. However, בְגָזֵל denotes robbery/robbery as an act or circumstance, not specifically an object that was robbed; 'kitu alichopora' narrows and alters the construction.
  naturalness: The revision uses clear, standard East African Swahili and maintains the unfinished conditional syntax that continues into the following verse. 'Amana aliyokabidhiwa' is a concise natural legal rendering for a deposit entrusted to someone.
  terminology: '''Kukosa uaminifu kwa Yahwe'' appropriately conveys the intensified מעַל construction. ''Mwenzake,'' ''amana,'' and ''kumdhulumu'' fit the social-legal register. The disputed תְשׂוּמֶת יָד is retained in a relatively literal form and its alternatives remain footnoted.'
  issues:
  - severity: medium
    issue: '''au kitu alichopora'' renders בְגָזֵל as a particular stolen object.'
    rationale: The Hebrew noun is best represented here as 'robbery' ('kwa uporaji' / 'kwa njia ya uporaji'). Rendering it as an object changes the legal category and weakens the parallel series.
  - severity: low
    issue: The second disputed legal expression is not explicitly linked by 'kuhusu,' unlike the deposit.
    rationale: Adding 'kuhusu' makes the coordination and legal scope clear in Swahili without resolving the phrase's lexical ambiguity.
  revised_text: Kama mtu akitenda dhambi na kukosa uaminifu kwa Yahwe kwa kumdanganya mwenzake kuhusu amana aliyokabidhiwa, au kuhusu kitu kilichowekwa mkononi mwake[a], au kwa uporaji, au akimdhulumu mwenzake,
  revised_footnotes:
  - marker: a
    text: Au “dhamana” au “kitu alichopewa mkononi.” Maana kamili ya kirai hiki cha Kiebrania si hakika.
    reason: lexical_alternative
  revision_rationale: Replaced the object-specific 'kitu alichopora' with 'kwa uporaji' to represent בְגָזֵל as robbery. Added 'kuhusu' before the disputed תְשׂוּמֶת יָד phrase for clear parallelism, while retaining a literal main rendering and the existing footnote alternatives. No theological interpretation has been added.
