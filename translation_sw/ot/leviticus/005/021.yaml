id: LEV.5.21
reference: Leviticus 5:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: sw
  text: Kama mtu akitenda dhambi na kukosa uaminifu kwa Yahwe kwa kumdanganya mwenzake kuhusu amana aliyokabidhiwa, au kuhusu kitu kilichowekwa mkononi mwake[a], au kwa uporaji, au akimdhulumu mwenzake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhamana” au “kitu alichopewa mkononi.” Maana kamili ya kirai hiki cha Kiebrania si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria, neno hili humaanisha mtu binafsi, si nafsi kama sehemu ya ndani ya mwanadamu.
- source_word: כִּי תֶחֱטָא
  choice: Kama ... akitenda dhambi
  rationale: כִּי pamoja na kitenzi kisichotimilika huanzisha sharti la kisheria hapa.
- source_word: וּמָעֲלָה מַעַל
  choice: na kukosa uaminifu
  rationale: Muundo wa mzizi unaorudiwa unasisitiza tendo la kutokuwa mwaminifu; Kiswahili hiki huhifadhi uzito wa kimahusiano na wa agano bila kutumia istilahi ngumu.
- source_word: בַּיהוָה
  choice: kwa Yahwe
  rationale: Kirai hiki huonyesha kwamba kosa dhidi ya mwenzake pia ni ukosefu wa uaminifu kwa Yahwe.
- source_word: וְכִחֵשׁ
  choice: kwa kumdanganya
  rationale: Kitenzi kinaweza kumaanisha kukana kwa uongo, kusema uongo, au kutenda kwa udanganyifu; hapa 'kumdanganya' kinafaa katika muktadha wa mali.
- source_word: בַּעֲמִיתוֹ
  choice: mwenzake
  rationale: עָמִית humaanisha mtu mwingine wa jumuiya; 'mwenzake' ni ya kawaida na haipanui maana kuwa jirani wa makazi pekee.
- source_word: בְּפִקָּדוֹן
  choice: kuhusu kitu alichokabidhiwa akihifadhi
  rationale: Neno hilo hurejelea mali iliyokabidhiwa mtu aitunze.
- source_word: בִתְשׂוּמֶת יָד
  choice: kitu kilichowekwa mikononi mwake
  rationale: Kirai hiki kisicho na maana moja iliyo hakika ni, kwa uhalisi, 'kitu kilichowekwa mkononi'; tafsiri pana huhifadhi utata wake.
- source_word: בְגָזֵל
  choice: kitu alichopora
  rationale: Nomino inaweza kumaanisha uporaji au kitu kilichotwaliwa kwa nguvu; katika orodha hii kutaja kitu kilichoporwa ni wazi kwa Kiswahili.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: akimdhulumu mwenzake
  rationale: Kitenzi hujumuisha kumnyanyasa mtu kiuchumi, kumlaghai, au kumnyang'anya haki; 'kudhulumu' huhifadhi upana na uzito wake.
theological_decisions:
- issue: Kuonyesha kwamba kosa la kijamii au kiuchumi pia ni ukosefu wa uaminifu kwa Mungu
  choice: kukosa uaminifu kwa Yahwe
  alternative: kutenda kwa hila dhidi ya Yahwe
  rationale: Kiebrania kinaeleza wazi kwamba kumdanganya mwenzake ni kukosa uaminifu kwa YHWH; tafsiri haiondoi uhusiano huo.
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina binafsi limetolewa kwa umbo la Kiswahili 'Yahwe', kulingana na safu ya ushauri iliyotolewa na bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaendelea kama sentensi ya sharti hadi mistari inayofuata; istilahi za mali zimeelezwa kwa lugha inayoeleweka huku utata wa תְשׂוּמֶת יָד ukihifadhiwa katika tanbihi.
