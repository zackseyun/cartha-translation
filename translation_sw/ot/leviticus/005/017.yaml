  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: sw
  text: Na ikiwa mtu anatenda dhambi kwa kufanya jambo mojawapo kati ya mambo yote ambayo, kwa amri za Yahweh, hayapaswi kufanywa, ingawa hakujua, basi ana hatia[a] na ataubeba uovu wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amejiletea hatia.” Neno la Kiebrania linaweza kumaanisha kuwa mtu amekuwa mwenye kuwajibika kwa hatia kwa sababu ya kosa.
    reason: lexical_alternative
  - marker: b
    text: Au, “atabeba hatia yake.” Nahau ya Kiebrania inaweza kumaanisha kubeba wajibu au matokeo ya kosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria hii neno hili linamaanisha mtu mmoja, si nafsi kama sehemu isiyo ya kimwili.
- source_word: תֶחֱטָא
  choice: anatenda dhambi
  rationale: Kitenzi חטא katika muktadha huu wa sheria ya kikuhani kinaonyesha kutenda dhambi.
- source_word: וְעָשְׂתָה אַחַת מִכָּל
  choice: kwa kufanya jambo mojawapo kati ya mambo yote
  rationale: Hii inadumisha maana ya tendo moja kutoka miongoni mwa mambo yaliyokatazwa, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: mambo yote ambayo amri za Yahweh zinakataza yafanywe
  rationale: Muundo huu unaonyesha nguvu ya kisheria ya amri na matendo yasiyoruhusiwa bila kulazimisha mpangilio mgumu wa Kiebrania katika Kiswahili.
- source_word: וְלֹא יָדַע
  choice: ingawa hakujua
  rationale: Kishazi kinaonyesha kwamba mtu hakutambua kosa lake; Kiswahili hakihitaji kuongeza kiwakilishi cha kitu hapa.
- source_word: וְאָשֵׁם
  choice: basi ana hatia
  rationale: Neno אָשֵׁם linaonyesha kuwa mtu anaingia katika hali ya kuwajibika kwa kosa, hata kama hakulijua.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: na ataubeba uovu wake
  rationale: Tafsiri hii inadumisha sitiari nzito ya Kiebrania ya kubeba uovu, ambayo inaweza kujumuisha hatia na matokeo yake.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Hatia inayotokana na kosa lisilojulikana
  choice: ingawa hakujua, basi ana hatia
  alternative: bila kujua, anajiletea hatia
  rationale: 'Tafsiri inadumisha mvutano wa maandishi: kutokujua kosa hakuondoi uwajibikaji, bila kufafanua zaidi sababu ya kiteolojia.'
- issue: Nahau ya kubeba uovu
  choice: ataubeba uovu wake
  alternative: atabeba hatia yake; atabeba matokeo ya uovu wake
  rationale: Chaguo kuu huhifadhi upana wa עָוֺן na sitiari ya נשׂא bila kuamua kimya kimya ikiwa maana inalenga hatia pekee au adhabu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandishi ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umesawazisha ukaribu na Kiebrania pamoja na mtiririko wa kawaida wa Kiswahili.
