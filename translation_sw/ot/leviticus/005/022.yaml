base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: sw
  text: au amepata kitu kilichopotea, akadanganya kuhusu hicho, na kuapa kwa uongo—kuhusu jambo lolote kati ya mambo yote ambayo mtu anaweza kufanya na kutenda dhambi kwa hayo—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: kitu kilichopotea
  rationale: Nomino hii humaanisha kitu au mali iliyopotea; tafsiri hii ni ya kawaida na haiongezi aina maalumu ya mali.
- source_word: וְכִחֶשׁ בָּהּ
  choice: akakana habari yake
  rationale: Kitenzi כחש hapa kina wazo la kukana au kusema uongo kuhusu kitu kilichopatikana. Kauli hii inadumisha tofauti kati ya kukana huko na kiapo cha uongo kinachofuata.
- source_word: וְנִשְׁבַּע עַל־שָׁקֶר
  choice: na kuapa kwa uongo
  rationale: Hii inawakilisha moja kwa moja tendo la kula kiapo kisicho cha kweli.
- source_word: הָאָדָם
  choice: mtu
  rationale: Katika muktadha huu אָדָם inamtaja binadamu kwa ujumla, si lazima mwanaume pekee; “mtu” ni Kiswahili sanifu na jumuishi kwa maana hiyo.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: na hivyo kutenda dhambi
  rationale: Muundo wa Kiebrania unaeleza kwamba kwa kufanya mojawapo ya mambo hayo mtu anatenda dhambi; “na hivyo” huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kufafanua zaidi ya chanzo.
theological_decisions:
- issue: Upeo wa הָאָדָם
  choice: mtu
  alternative: mwanaume
  rationale: Neno hili hapa lina matumizi ya jumla kuhusu binadamu anayefanya kosa. Kutumia “mwanaume” kungeweza kubana isivyofaa upeo wa sheria.
- issue: Uhusiano wa tendo na dhambi katika לַחֲטֹא בָהֵנָּה
  choice: ambayo mtu anaweza kufanya na hivyo kutenda dhambi
  alternative: ambayo mtu hufanya ili kutenda dhambi kwayo
  rationale: Infinitivu hapa inaonyesha matokeo au tabia ya matendo hayo, si lazima kusudi la makusudi la kutenda dhambi; tafsiri iliyochaguliwa huepuka kudai nia ambayo maandishi hayasemi wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mstari unabaki kuwa sehemu ya sentensi inayoendelea, kwa hiyo umehitimishwa kwa alama ya mkwaju mrefu badala ya nukta.
