  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: sw
  text: 'Naye atamletea Yahwe sadaka yake ya hatia[a] kwa ajili ya dhambi aliyotenda: mnyama jike kutoka kundini—mwana-kondoo jike au mbuzi jike—kwa sadaka ya dhambi; kisha kuhani atafanya upatanisho kwa ajili yake kwa dhambi yake[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka yake kwa ajili ya hatia” au “sadaka yake ya marekebisho.” Neno la Kiebrania אשם linahusishwa na hatia au marekebisho, ingawa baadaye mnyama huyu anatajwa kuwa “sadaka ya dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka katika dhambi yake.” Kirai hiki kinaweza kusisitiza kuondolewa katika dhambi kuwa matokeo ya upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Naye atamletea
  rationale: Muundo huu wa kisheria una nguvu ya agizo; wakati ujao katika Kiswahili unaeleza wajibu huo kwa lugha ya kawaida na yenye hadhi.
- source_word: אֲשָׁמוֹ
  choice: sadaka yake ya hatia
  rationale: Neno אשם linahusishwa na hatia, fidia au marekebisho, na katika muktadha wa dhabihu linaweza kutaja sadaka ya hatia. Tafsiri hii inadumisha tofauti yake na חטאת inayotokea baadaye katika mstari.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la Mungu יהוה limetolewa wazi kuwa “Yahwe,” huku kiambishi ל kikionyesha anayeletewa sadaka.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: kwa ajili ya dhambi aliyotenda
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayohifadhi dhambi kuwa sababu ya kuleta sadaka.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: mnyama jike kutoka kundini
  rationale: נְקֵבָה hutaja jinsia waziwazi, na צאן ni kundi la mifugo midogo, hasa kondoo na mbuzi; wanyama wenyewe wanafafanuliwa mara moja baadaye.
- source_word: כִשְׂבָּה
  choice: mwana-kondoo jike
  rationale: Neno hili hutaja kondoo jike; kutaja “jike” wazi kunazuia utata katika Kiswahili.
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: au mbuzi jike
  rationale: Kirai cha Kiebrania kinamtaja mbuzi wa kike, na “mbuzi jike” ni usemi wa sasa na wazi.
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חטאת hutaja sadaka ya dhambi au ya utakaso. “Sadaka ya dhambi” ni istilahi inayoeleweka na inadumisha tofauti na “sadaka ya hatia” iliyotangulia.
- source_word: וְכִפֶּר עָלָיו
  choice: kisha kuhani atafanya upatanisho kwa ajili yake
  rationale: “Kufanya upatanisho” huhifadhi maana ya ibada ya כפר bila kuingiza nadharia mahususi kuhusu jinsi upatanisho unavyofanya kazi.
- source_word: מֵחַטָּאתוֹ
  choice: kwa dhambi yake
  rationale: Katika Kiswahili hiki ni kirai cha kawaida baada ya “kufanya upatanisho,” huku tanbihi ikihifadhi maana halisi zaidi ya מן inayoweza kudokeza kuondolewa kutoka katika dhambi.
theological_decisions:
- issue: Matumizi ya אשם na חטאת katika mstari mmoja
  choice: Kudumisha “sadaka ya hatia” na “sadaka ya dhambi” kama istilahi tofauti
  alternative: Kutafsiri אשם kwa ujumla zaidi kuwa “sadaka kwa ajili ya hatia yake,” au kutafsiri חטאת kuwa “sadaka ya utakaso”
  rationale: Maandishi ya Kiebrania yenyewe yanaweka istilahi hizi pamoja. Kuzisawazisha kungeficha mvutano halisi wa kileksia uliomo katika chanzo.
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linawakilisha jina la Mungu kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Maana ya כפר
  choice: kufanya upatanisho
  alternative: kumtakasa au kumwondolea hatia
  rationale: “Kufanya upatanisho” ni pana vya kutosha kuhifadhi maana ya ibada bila kuamua kimadhehebu utaratibu wake wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Istilahi za ibada zimehifadhiwa kwa uthabiti, na alama za vistari virefu zinatenganisha kwa uwazi maelezo ya aina mbili za mnyama.
