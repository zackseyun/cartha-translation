    rationale: Ingawa unaeleweka, 'akikosa uaminifu' ni mfupi na wa kawaida zaidi katika Kiswahili Sanifu, huku ukidumisha nguvu ya idiomu ya Kiebrania ya kutenda uvunjaji wa uaminifu.
