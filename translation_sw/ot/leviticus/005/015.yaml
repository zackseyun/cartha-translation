id: LEV.5.15
reference: Leviticus 5:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: sw
  text: '“Mtu akikosa uaminifu na kutenda dhambi bila kukusudia kuhusu vitu vitakatifu vya Yahwe, atamletea Yahwe sadaka yake ya fidia[a]: kondoo dume asiye na dosari kutoka kundini, kwa kadirio lako la shekeli za fedha, kwa kipimo cha shekeli takatifu[b], kuwa sadaka ya fidia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya hatia” au “sadaka ya malipo.” Neno la Kiebrania אָשָׁם linaweza kumaanisha dhima inayotokana na kosa na pia dhabihu inayotolewa ili kurekebisha kosa hilo.
    reason: lexical_alternative
  - marker: b
    text: “Shekeli takatifu” ilikuwa kiwango cha uzani kilichotumiwa katika kukadiria thamani za vitu vitakatifu.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria, neno hili humaanisha mtu binafsi; ‘mtu’ ni Kiswahili cha kawaida na huhifadhi umoja wa kifungu.
- source_word: תִמְעֹל מַעַל
  choice: akitenda kwa kukosa uaminifu
  rationale: Muundo wa kitenzi na nomino unasisitiza uvunjaji wa wajibu wa uaminifu, hasa kuhusu mambo yaliyowekwa wakfu.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: na kutenda dhambi bila kukusudia
  rationale: בִשְׁגָגָה huonyesha kosa lisilokusudiwa, wala si uasi wa makusudi.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: kuhusu vitu vitakatifu vya Yahwe
  rationale: Kihusishi kinaonyesha eneo au vitu vilivyoathiriwa na kosa bila kubana maana kuwa kuchukua mali pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: sadaka yake ya fidia / sadaka ya fidia
  rationale: אָשָׁם linaweza kumaanisha hatia au dhima pamoja na dhabihu inayoshughulikia kosa hilo. ‘Sadaka ya fidia’ huonyesha wazi upande wa kurekebisha hasara katika muktadha huu.
- source_word: אַיִל תָּמִים
  choice: kondoo dume asiye na dosari
  rationale: Katika sheria za dhabihu, תָּמִים humaanisha mnyama asiye na kasoro au dosari.
- source_word: מִן הַצֹּאן
  choice: kutoka kundini
  rationale: צֹאן ni kundi la mifugo midogo; kwa kuwa אַיִל tayari humtaja kondoo dume, ‘kundini’ inatosha na ni ya asili.
- source_word: בְּעֶרְכְּךָ
  choice: kulingana na makadirio yako
  rationale: Huhifadhi nafsi ya pili umoja na wazo la thamani iliyokadiriwa na mwenye mamlaka katika sheria hii.
- source_word: כֶּסֶף שְׁקָלִים
  choice: katika shekeli za fedha
  rationale: Huonyesha kuwa thamani hiyo inaelezwa kwa shekeli za fedha.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Hufafanua kwamba shekeli hiyo ni kiwango maalumu cha uzani kilichotumiwa katika mambo matakatifu.
theological_decisions:
- issue: Maana ya neno la dhabihu אָשָׁם
  choice: sadaka ya fidia
  alternative: sadaka ya hatia; sadaka ya malipo
  rationale: Kosa hili linahusu vitu vitakatifu na thamani ya fedha, hivyo upande wa kurekebisha hasara ni muhimu. Hata hivyo, maana ya hatia haijaondolewa; imehifadhiwa katika tanbihi.
- issue: Umoja wa mwakilishi katika sheria
  choice: mtu … atamletea
  alternative: yeyote … watamletea
  rationale: Kiebrania kinatumia mtu mmoja kama mwakilishi na kisha kitenzi cha umoja; Kiswahili kinaweza kuhifadhi muundo huo kwa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. ‘Yahwe’ limetumiwa kwa jina la Mungu. Muundo wa kisheria wa umoja na sintofahamu halisi ya אָשָׁם vimehifadhiwa.
