base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: sw
  text: 'Naye atamletea Yahwe sadaka yake ya hatia: kondoo dume asiye na dosari[a] kutoka kundini, kulingana na kadirio lako, kuwa sadaka ya hatia[b], kwa kuhani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa desturi, “asiye na waa.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania אָשָׁם linaweza kumaanisha hatia au fidia ya kurekebisha kosa, na pia sadaka maalumu inayotolewa kwa ajili yake; kwa hiyo linaweza pia kutafsiriwa “sadaka ya fidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: sadaka yake ya hatia
  rationale: Katika muktadha huu neno אָשָׁם linahusu kile anacholeta mkosaji ili kushughulikia hatia yake. Tafsiri hii inatambulika kwa urahisi, huku tanbihi ikihifadhi maana inayoweza pia kuhusisha fidia au malipo ya kurekebisha kosa.
- source_word: יָבִיא
  choice: atamletea
  rationale: Kauli ya wakati ujao katika sheria ina nguvu ya agizo; ‘atamletea’ ni ya kawaida na inadumisha mwelekeo wa tendo kwa Yahwe.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Inawakilisha moja kwa moja jina la agano יהוה badala ya kulibadili kuwa cheo.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Ni tafsiri sahihi na ya kawaida ya mnyama wa kiume wa jamii ya kondoo.
- source_word: תָּמִים
  choice: asiye na dosari
  rationale: Hueleza ukamilifu unaotakiwa kwa mnyama wa dhabihu kwa lugha ya sasa, yenye heshima na inayoeleweka.
- source_word: מִן הַצֹּאן
  choice: kutoka kundini
  rationale: צֹאן ni kundi la mifugo midogo; kwa kuwa אַיִל tayari humtambulisha mnyama kuwa kondoo dume, ‘kutoka kundini’ inatosha bila kurudia aina ya mnyama.
- source_word: בְּעֶרְכְּךָ
  choice: kulingana na kadirio lako
  rationale: Inahifadhi maana ya tathmini ya thamani na kiambishi cha nafsi ya pili umoja kilicho katika Kiebrania.
- source_word: לְאָשָׁם
  choice: kuwa sadaka ya hatia
  rationale: Hapa אָשָׁם hutaja kazi au aina rasmi ya dhabihu hiyo; ‘sadaka ya hatia’ ni wazi na ya kawaida katika muktadha wa ibada.
- source_word: אֶל הַכֹּהֵן
  choice: na kuipeleka kwa kuhani
  rationale: Huweka wazi kwamba mnyama anawasilishwa kwa kuhani, huku kitenzi kilichorudiwa katika Kiswahili kikifanya sentensi ndefu ya Kiebrania isomeke kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, hivyo ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana mbili zinazokaribiana za אָשָׁם
  choice: sadaka ya hatia katika sehemu zote mbili, pamoja na tanbihi ya maana ya fidia
  alternative: sadaka ya fidia; malipo ya hatia
  rationale: Katika aya hii kondoo dume ni dhabihu halisi, kwa hiyo ‘sadaka ya hatia’ inafaa katika sehemu zote mbili. Hata hivyo, neno hilo pia lina wazo la fidia au kurekebisha kosa; tanbihi inalinda upana huo bila kulazimisha tofauti ambayo sarufi haidai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria na wa ibada lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umebaki karibu na Kiebrania, huku ‘na kuipeleka’ ikiongezwa kisintaksia ili mwelekeo wa mwisho ‘kwa kuhani’ uwe wazi na wa kawaida katika Kiswahili.
