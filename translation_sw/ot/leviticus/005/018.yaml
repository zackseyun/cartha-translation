id: LEV.5.18
reference: Leviticus 5:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: sw
  text: Atamletea kuhani kondoo dume asiye na dosari kutoka kundini, kwa kadirio lako, kuwa sadaka ya hatia[a]. Kuhani atamfanyia upatanisho kwa ajili ya kosa alilofanya bila kukusudia, naye hakulijua[b]; naye atasamehewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa sadaka ya fidia.” Neno la Kiebrania אָשָׁם linataja aina maalumu ya sadaka.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ajili ya dhambi yake ya kutokukusudia.” Kiebrania kinasisitiza kosa lililotendwa pasipo kukusudia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Atamletea
  rationale: Katika maagizo ya kisheria, muundo huu una nguvu ya wajibu au tendo la baadaye. Kitenzi chenye viambishi vya mtendaji, mtendewa, na mwelekeo kwa kuhani ni cha kawaida na wazi katika Kiswahili.
- source_word: אַיִל תָּמִים
  choice: kondoo dume asiye na dosari
  rationale: אַיִל ni kondoo dume aliyekomaa, na תָּמִים katika muktadha wa dhabihu humaanisha kutokuwa na kasoro inayomfanya mnyama asifae kutolewa.
- source_word: מִן הַצֹּאן
  choice: kutoka kundini
  rationale: צֹאן ni kundi la mifugo midogo, hasa kondoo na mbuzi. Kwa kuwa אַיִל tayari humtambulisha mnyama kuwa kondoo dume, 'kutoka kundini' ni fupi na ya kawaida.
- source_word: בְּעֶרְכְּךָ
  choice: kwa thamani kulingana na kadirio lako
  rationale: Tafsiri hii inadumisha nafsi ya pili katika kiambishi cha Kiebrania na wazo la thamani iliyokadiriwa, bila kuamua kimyakimya ni nani hasa anayefanya kadirio hilo.
- source_word: לְאָשָׁם
  choice: kuwa sadaka ya hatia
  rationale: אָשָׁם ni jina la aina maalumu ya sadaka katika mfumo wa Walawi. 'Sadaka ya hatia' inatambulika kwa urahisi, huku tanbihi ikihifadhi uwezekano wa kusisitiza fidia.
- source_word: וְכִפֶּר עָלָיו
  choice: Kuhani atamfanyia upatanisho
  rationale: Katika muktadha wa kikuhani, כפר hueleza tendo la dhabihu linaloleta upatanisho. Muundo 'atamfanyia' unawakilisha kwa kawaida עָלָיו, yaani tendo kufanywa kwa ajili yake.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: kwa ajili ya kosa alilofanya bila kukusudia
  rationale: Nomino na kitenzi vyenye mzizi mmoja vinasisitiza kosa lililotendwa pasipo kukusudia. Kiswahili cha asili hakiwezi kurudia mzizi huo kwa ulaini, hivyo maana yake imewasilishwa wazi.
- source_word: וְהוּא לֹא יָדַע
  choice: naye hakulijua
  rationale: Kauli hii inadumisha tofauti kati ya kutokukusudia na kutokuwa na ufahamu wa kosa, bila kuyafanya mawazo hayo kuwa kitu kimoja.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: Kauli tendwa inadumisha matokeo ya upatanisho na pia haimtaji moja kwa moja mtendaji wa msamaha, kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Maana ya aina ya sadaka אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: Neno hili linataja aina maalumu ya sadaka, lakini linaweza kuhusishwa pia na kurekebisha madhara au kutoa fidia. Maandishi makuu yanatumia jina linaloeleweka zaidi, huku tanbihi ikihifadhi maana mbadala.
- issue: Tafsiri ya כפר
  choice: kufanyia upatanisho
  alternative: kufanyia kafara
  rationale: '''Kufanyia upatanisho'' huonyesha tendo la kikuhani na uhusiano wake na msamaha bila kuingiza ufafanuzi wa dhehebu kuhusu utaratibu wake. ''Kafara'' ni neno linalowezekana lakini linaweza kueleweka kwa maana pana au tofauti katika matumizi ya sasa.'
- issue: Uhusiano kati ya kosa la kutokukusudia na kutolijua
  choice: kosa alilofanya bila kukusudia, naye hakulijua
  alternative: dhambi yake ya kutokukusudia
  rationale: Kiebrania kinadumisha kauli zote mbili—kutenda kwa kukosea na kutokuwa na ufahamu. Tafsiri kuu haizifupishi kuwa dhana moja, hivyo mvutano wa kisheria na kitheolojia unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Maneno ya kisheria na ya dhabihu yamewekwa wazi bila kutumia lugha ya kale kupita kiasi. Alama zote za tanbihi [a] na [b] zimewekwa kwenye sehemu zinazohusika moja kwa moja.
