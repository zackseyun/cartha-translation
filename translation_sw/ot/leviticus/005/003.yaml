  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: sw
  text: Au akigusa unajisi wa mwanadamu[a]—unajisi wa aina yoyote unaomfanya mtu awe najisi—na jambo hilo likamfichika[b], kisha akaja kulijua, ana hatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uchafu wa mwanadamu.” Neno la Kiebrania katika muktadha huu wa kisheria linamaanisha hasa unajisi wa kiibada.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “likafichika kwake”; yaani, wakati huo hakuwa akilijua.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: akigusa
  rationale: Kitenzi נגע pamoja na ב kinaonyesha kugusana kimwili; “akigusa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: טֻמְאַת אָדָם
  choice: unajisi wa mwanadamu
  rationale: Katika sheria za Walawi, טֻמְאָה ni hali ya unajisi wa kiibada, si uovu wa kimaadili wenyewe; אָדָם hapa humaanisha binadamu kwa ujumla.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: unajisi wowote
  rationale: Kirai hiki kinapanua wigo na kuhusisha aina yoyote ya unajisi unaotokana na mwanadamu; Kiswahili cha kawaida hakihitaji kurudia kiambishi cha umilikaji cha Kiebrania.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: ambao kwa huo mtu huwa najisi
  rationale: Kishazi hiki kinaeleza athari ya unajisi huo kwa namna ya jumla bila kudokeza kwamba mhusika ni mwanamume pekee.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: jambo hilo likawa limefichika kwake
  rationale: Tafsiri hii inadumisha hali tendwa ya Kiebrania na maana kwamba wakati huo jambo hilo halikuwa katika ufahamu wake.
- source_word: וְהוּא יָדַע
  choice: kisha akaja kulijua
  rationale: Katika muktadha, maneno haya yanaonyesha kwamba baadaye mhusika anatambua jambo ambalo hakulijua hapo awali.
- source_word: וְאָשֵׁם
  choice: ana hatia
  rationale: Katika muktadha huu wa kisheria na wa dhabihu, אשם huonyesha kuwa mtu ameingia katika hali ya kuwa na hatia au wajibu unaotokana nayo.
theological_decisions:
- issue: Maana ya טֻמְאָה katika sheria za Walawi
  choice: unajisi
  alternative: uchafu
  rationale: “Unajisi” huhifadhi maana ya hali ya kiibada na kisheria bila kuifanya kuwa dhambi ya kimaadili moja kwa moja; “uchafu” unaweza kueleweka hasa kama uchafu wa kimwili.
- issue: Maana ya אָדָם
  choice: mwanadamu
  alternative: mtu
  rationale: “Mwanadamu” hapa huonyesha chanzo cha kibinadamu cha unajisi na ni neno la jumla lisilomhusu mwanamume pekee.
- issue: Uhusiano kati ya kutokujua na kuwa na hatia
  choice: Kudumisha mfuatano wa kutogundua jambo, kulijua baadaye, na kuwa na hatia
  alternative: Kufafanua kwamba hatia inaanza tu baada ya mhusika kujua
  rationale: Kiebrania kinaweka vipengele hivi kwa mfuatano lakini hakielezi wazi wakati hasa hali ya hatia inaanza; tafsiri haipaswi kuondoa mvutano huo wa kisheria na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha mfuatano na hali tendwa ya Kiebrania, huku vistari virefu vikitenga ufafanuzi wa aina ya unajisi.
