  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: sw
  text: Na kuhani atafanya upatanisho kwa ajili yake mbele za Yahwe, naye atasamehewa kwa mojawapo ya mambo yote ambayo mtu anaweza kufanya na kwa jambo hilo kupata hatia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi: “kwa mojawapo ya yote ambayo anaweza kufanya ili apate hatia kwa jambo hilo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: atafanya upatanisho kwa ajili yake
  rationale: Pieli ya כפר katika muktadha wa dhabihu ina maana ya kutekeleza upatanisho kwa niaba ya mkosaji. Kauli hii ni ya kawaida, wazi, na haiingizi nadharia maalumu ya jinsi upatanisho unavyofanya kazi.
- source_word: הַכֹּהֵן
  choice: Kuhani
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kibainishi katika muktadha wa ibada; Kiswahili hakihitaji kibainishi tofauti cha ‘the’.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי huonyesha kuwa jambo linafanyika mbele au katika uwepo wa Mungu katika mazingira ya ibada. ‘Mbele za’ ni Kiswahili cha asili na chenye hadhi.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: Nifali ya סלח inaonyesha msamaha anaopokea mkosaji. Muundo wa kutendwa unamhifadhi Mungu kama msameheji anayeeleweka bila kumtaja wazi zaidi ya maandishi.
- source_word: עַל אַחַת מִכֹּל
  choice: kwa mojawapo ya mambo yote
  rationale: Kauli hii inahifadhi maana ya kosa lolote moja ndani ya kundi lote la matendo yanayotajwa.
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: ambayo mtu anaweza kufanya na hivyo kupata hatia
  rationale: Tafsiri hii inawasilisha kwa Kiswahili cha kawaida uhusiano kati ya tendo na kupatikana na hatia, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano, Tetragramatoni. ‘Yahwe’ ni umbo linalofaa kimatamshi na kiothografia katika Kiswahili na linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya כפר katika muktadha wa dhabihu
  choice: kufanya upatanisho
  alternative: kufunika kosa / kuondoa hatia
  rationale: ‘Kufanya upatanisho’ huhifadhi istilahi pana ya kiibada bila kuamua kimyakimya nadharia maalumu ya kitheolojia kuhusu utendaji wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi muundo mgumu na wenye uwezekano wa kufasiriwa kwa zaidi ya namna moja katika sehemu ya mwisho ya Kiebrania.
