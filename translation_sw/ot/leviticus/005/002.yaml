id: LEV.5.2
reference: Leviticus 5:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: sw
  text: Au mtu akigusa kitu chochote najisi—iwe ni mzoga wa mnyama wa porini najisi, au mzoga wa mnyama wa kufugwa najisi, au mzoga wa kiumbe kitambaacho najisi—na jambo hilo limefichika kwake[a], naye ni najisi na ana hatia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hatambui jambo hilo; kihalisi, “limefichika kwake.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, anapata hatia inayohusu unajisi huo. Kugusa mzoga hakuelezwi hapa kuwa uovu wa kimaadili kwa maana ileile ya dhambi ya kukusudia.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria za Walawi neno hili humaanisha mtu binafsi, si ‘nafsi’ kama sehemu isiyo ya mwili.
- source_word: תִּגַּע בְּ
  choice: akigusa
  rationale: Kitenzi hiki pamoja na בְּ kinaonyesha kugusana kimwili; ‘akigusa’ ni wazi na cha kawaida.
- source_word: כָל דָּבָר טָמֵא
  choice: kitu chochote najisi
  rationale: דָּבָר ni neno pana, na hapa linaanzisha aina zinazofafanuliwa baadaye.
- source_word: נִבְלַת
  choice: mzoga wa
  rationale: Katika sheria za usafi za Walawi, נְבֵלָה ni mwili wa mnyama aliyekufa; ‘mzoga’ ni neno sahihi na la kawaida.
- source_word: חַיָּה טְמֵאָה
  choice: mnyama najisi wa porini
  rationale: חַיָּה hapa anatofautishwa na בְּהֵמָה, hivyo humaanisha mnyama wa porini.
- source_word: בְּהֵמָה טְמֵאָה
  choice: mnyama najisi wa kufugwa
  rationale: בְּהֵמָה hapa humaanisha mnyama wa nyumbani au wa mifugo, tofauti na mnyama wa porini.
- source_word: שֶׁרֶץ טָמֵא
  choice: kiumbe najisi kitambaacho
  rationale: שֶׁרֶץ ni jamii ya viumbe vidogo vinavyotambaa au kusongamana; usemi huu ni wazi kwa msomaji wa kawaida bila kuifanya jamii hiyo kuwa finyu kupita kiasi.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: jambo hilo likawa limefichika kwake
  rationale: Tafsiri hii inadumisha mtazamo wa Kiebrania kwamba jambo hilo limefichika kwake, huku dokezo likieleza maana ya kutolitambua.
- source_word: וְהוּא טָמֵא
  choice: yeye huwa najisi
  rationale: Kauli hii inaeleza hali yake ya unajisi bila kuongeza uhusiano wa kimantiki ambao haujawekwa wazi na kiunganishi cha Kiebrania.
- source_word: וְאָשֵׁם
  choice: na anakuwa na hatia
  rationale: אָשֵׁם katika muktadha huu wa kisheria huonyesha kuingia katika hali ya kuwajibika au kuwa na hatia.
theological_decisions:
- issue: Asili ya unajisi
  choice: Kutafsiri טָמֵא/טְמֵאָה kwa ‘najisi,’ si ‘mwenye dhambi.’
  alternative: asiye safi; aliyetiwa unajisi
  rationale: Aya inahusu hali ya unajisi wa kiibada unaotokana na kugusa mizoga, wala haisemi kwamba mguso huo wenyewe ni uovu wa kimaadili.
- issue: Maana ya אָשֵׁם katika sheria ya unajisi
  choice: anakuwa na hatia
  alternative: anawajibika; amepatikana na kosa
  rationale: Tafsiri hii inadumisha lugha ya hatia ya maandishi, huku dokezo likizuia kuchanganya moja kwa moja unajisi wa kiibada na uovu wa kukusudia.
- issue: Uwakilishi wa jinsia
  choice: Kutumia ‘mtu’ na kisha ‘yeye.’
  alternative: mwanamume; mtu huyo
  rationale: נֶפֶשׁ hapa ni mtu yeyote binafsi. Kiswahili ‘mtu’ na ‘yeye’ huwasilisha maana hiyo kwa kawaida bila kuingiza jinsia isiyosisitizwa na sheria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Najisi’ hudumisha istilahi ya sheria za usafi za Walawi. Alama za tanbihi [a] na [b] zimewekwa mahali zinapohusika moja kwa moja. Koma ya mwisho inadumisha mwendelezo wa sentensi kuelekea aya inayofuata.
