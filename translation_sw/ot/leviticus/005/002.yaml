revisions:
- from: Au mtu akigusa kitu chochote najisi—iwe ni mzoga wa mnyama najisi wa porini, au mzoga wa mnyama najisi wa kufugwa, au mzoga wa kiumbe najisi kitambaacho—na jambo hilo likawa limefichika kwake[a], yeye huwa najisi na anakuwa na hatia[b],
  to: Au mtu akigusa kitu chochote najisi—iwe ni mzoga wa mnyama wa porini najisi, au mzoga wa mnyama wa kufugwa najisi, au mzoga wa kiumbe kitambaacho najisi—na jambo hilo limefichika kwake[a], naye ni najisi na ana hatia[b],
  rationale: Revision removes an unintended habitual sense from the ritual-status clause and makes the domesticated-animal expression more natural. It preserves the Hebrew sequence, the broad category of swarming/creeping creatures, the ambiguity of the concealed matter, and the distinction between ritual impurity and intentional moral wrongdoing.
