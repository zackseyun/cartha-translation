review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents the three classes of animal carcass, the unawareness clause, ritual uncleanness, and resulting guilt. The habitual form "huwa najisi" does not reflect the source's particular legal case and should be a simple stative clause.
  naturalness: The Swahili is generally clear and suitably formal. Reordering the modifiers in the animal categories and replacing the habitual verb produces more idiomatic, precise Standard East African Swahili.
  terminology: '"Najisi," "mzoga," and "hatia" are appropriate for Levitical ritual-law language. "Kiumbe kitambaacho" is a defensible broad rendering of שֶׁרֶץ and avoids restricting the category to one modern zoological class.'
  issues:
  - severity: medium
    issue: '"yeye huwa najisi" uses a habitual construction.'
    rationale: Huwa ordinarily conveys a customary or recurrent state ('is usually/ordinarily unclean'), whereas וְהוּא טָמֵא states the person's ritual status in this specified case. "Naye ni najisi" retains the Hebrew coordination and present stative sense.
  - severity: low
    issue: Modifier order in "mnyama najisi wa kufugwa" is slightly less natural and can momentarily make "wa kufugwa" seem to qualify "najisi."
    rationale: '"Mnyama wa kufugwa najisi" more transparently conveys an unclean domesticated animal without changing the Hebrew distinction from a wild animal.'
  revised_text: Au mtu akigusa kitu chochote najisi—iwe ni mzoga wa mnyama wa porini najisi, au mzoga wa mnyama wa kufugwa najisi, au mzoga wa kiumbe kitambaacho najisi—na jambo hilo limefichika kwake[a], naye ni najisi na ana hatia[b],
  revised_footnotes:
