lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Katika fomula hii ya simulizi, kitenzi דבר kinaanzisha sehemu mpya ya hotuba. Kiswahili cha sasa hutumia kwa kawaida “akasema na” kwa maana ya kumweleza mtu maneno, bila kuhitaji muundo mzito zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi “sema,” Kiswahili sanifu hutumia “sema na” kumtaja anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Neno hili la Kiebrania hutambulisha maneno yanayofuata. Katika Kiswahili, nukta mbili huwasilisha kazi hiyo kwa njia ya asili na kuepuka urudiaji usio wa lazima wa “akisema.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; “Yehova” hutegemea matamshi ya jadi ya baadaye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi imehifadhi fomula ya utangulizi wa hotuba, huku “akisema” ya pili ikiwasilishwa kwa nukta mbili.
