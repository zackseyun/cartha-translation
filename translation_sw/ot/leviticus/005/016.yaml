source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: sw
  text: Atalipa fidia kwa kosa alilofanya kuhusu kitu kitakatifu[a], ataongeza sehemu ya tano zaidi, na atampa kuhani. Kisha kuhani atamfanyia upatanisho kwa kondoo dume wa sadaka ya hatia[b], naye atasamehewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kile alichozuia isivyofaa kutoka katika vitu vitakatifu.” Kiebrania kinarejelea fidia kwa kosa lililohusu kitu au mali takatifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kondoo dume kama sadaka ya hatia”; pia yaweza kuitwa “sadaka ya fidia.”
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: kwa kosa alilotenda kuhusu kitu kitakatifu
  rationale: Muundo wa Kiebrania unaeleza kosa linalohusu mali au haki takatifu bila kutaja wazi hekalu wala namna hasa kitu hicho kilivyozuiliwa; tafsiri hii ni ya kawaida kwa Kiswahili na huhifadhi upana huo.
- source_word: יְשַׁלֵּם
  choice: atalipa fidia
  rationale: Katika muktadha huu wa sheria na dhabihu, kitenzi kinamaanisha kurejesha au kulipa thamani inayodaiwa, si malipo ya kawaida tu.
- source_word: חֲמִישִׁתוֹ
  choice: sehemu yake ya tano
  rationale: Huwakilisha kwa usahihi sehemu moja ya tano ya thamani inayolipwa, huku ikiepuka istilahi ya kisasa ya asilimia isiyokuwamo katika matini.
- source_word: יוֹסֵף עָלָיו
  choice: ataongeza
  rationale: Katika muktadha, nyongeza hiyo inaongezwa juu ya fidia iliyotajwa; Kiswahili hiki ni wazi bila kurudia kiwakilishi kwa namna nzito.
- source_word: לַכֹּהֵן
  choice: kumpa kuhani
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mpokeaji wa fidia.
- source_word: יְכַפֵּר עָלָיו
  choice: atamfanyia upatanisho
  rationale: Hii ni istilahi inayofahamika na yenye heshima kwa tendo la kikuhani la כפר katika muktadha wa dhabihu.
- source_word: בְּאֵיל הָאָשָׁם
  choice: kwa kondoo dume wa sadaka ya hatia
  rationale: Huhifadhi uhusiano wa muundo wa Kiebrania kati ya kondoo dume na sadaka maalumu iitwayo אָשָׁם.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: Kauli tendwa huwasilisha kwa kawaida matokeo ya msamaha kwa mkosaji bila kuongeza mtendaji ambaye hatajwi wazi katika kifungu.
theological_decisions:
- issue: Tafsiri ya istilahi ya dhabihu אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: Istilahi hiyo inaweza kukazia hatia pamoja na ulipaji wa fidia. “Sadaka ya hatia” ni wazi na hutofautisha sadaka yenyewe na fidia ya mali ambayo tayari imetajwa katika sentensi.
- issue: Uhusiano wa kosa na kitu kitakatifu
  choice: kosa alilotenda kuhusu kitu kitakatifu
  alternative: kitu alichokizuia isivyofaa kutoka katika vitu vitakatifu
  rationale: Matini inahusu kosa linalohusiana na kilicho kitakatifu, lakini haielezi moja kwa moja kuwa lilikuwa tendo la kuzuia. Tafsiri kuu huhifadhi kutobainika huko, huku tanbihi ikieleza uwezekano wa kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Lugha ya sheria imewekwa wazi kwa “kulipa fidia,” huku istilahi za ibada “kuhani,” “upatanisho,” na “sadaka ya hatia” zikitumiwa kwa uthabiti. Alama zote za tanbihi zimewekwa katika matini kuu.
