  text: אָשָׁ֖ם ה֑וּא אָשֹׁ֥ם אָשַׁ֖ם לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: sw
  text: Hiyo ni sadaka ya hatia[a]; hakika amekuwa na hatia mbele za YAHWE.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hiyo ni sadaka ya hatia; hakika ana hatia dhidi ya YAHWE.” Kiebrania kinarudia mzizi אשם, unaoweza kumaanisha “hatia,” “kuwa na hatia,” au “sadaka ya hatia,” ili kusisitiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: sadaka ya hatia
  rationale: Katika muktadha huu wa ibada ya dhabihu, nomino hii hutaja sadaka maalumu inayotolewa kwa sababu ya hatia; tafsiri hii ni wazi na pia inadumisha uhusiano wake na neno ‘hatia’ katika kishazi kinachofuata.
- source_word: הוּא
  choice: Hiyo ni
  rationale: Kiwakilishi hiki kinatambulisha sadaka iliyotajwa katika muktadha uliotangulia; ‘Hiyo ni’ ni Kiswahili cha kawaida na cha asili hapa.
- source_word: אָשֹׁם אָשַׁם
  choice: hakika amekuwa na hatia
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi cha mzizi huohuo unasisitiza uhakika wa kuwa na hatia. ‘Hakika’ huwasilisha msisitizo huo bila kurudia mzizi kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: לַיהוָה
  choice: mbele za YAHWE
  rationale: Kihusishi ל pamoja na mzizi אשם kinaweza kueleza uwajibikaji au hatia katika uhusiano na YHWH. ‘Mbele za’ huhifadhi wazo la kuwajibika kwake bila kulazimisha maana ya uadui wa moja kwa moja.
- source_word: יהוה
  choice: YAHWE
  rationale: Jina binafsi la Mungu katika Kiebrania limetafsiriwa kwa umbo la Kiswahili linalotambulika, badala ya kulibadilisha kuwa cheo; herufi kubwa hulitofautisha wazi kama jina la agano.
theological_decisions:
- issue: Maana ya לַיהוָה katika uhusiano na אָשַׁם
  choice: Mtu huyo anaelezwa kuwa na hatia mbele za YAHWE.
  alternative: Mtu huyo hakika amefanya kosa dhidi ya YAHWE; au sadaka hiyo ni sadaka ya hatia kwa YAHWE.
  rationale: Mpangilio wa Kiebrania unaunganisha לַיהוָה kwa urahisi na kishazi cha kitenzi אָשֹׁם אָשַׁם, ukieleza hatia ya mtu katika uhusiano na YHWH. ‘Mbele za’ huhifadhi uwajibikaji huo huku tanbihi ikionyesha uwezekano wa ‘dhidi ya.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya mzizi wa Kiebrania yamewakilishwa kwa ‘hakika,’ huku uhusiano wa kileksika kati ya sadaka na hatia ukidumishwa kwa kurudia neno ‘hatia.’
