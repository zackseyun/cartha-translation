base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: sw
  text: au kitu chochote alichokiapia kwa uongo, atakirejesha kwa ukamilifu na kuongeza sehemu ya tano juu yake. Atampa mwenye mali hiyo malipo hayo siku ya hatia yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku ya sadaka yake ya hatia.” Neno la Kiebrania linaweza kumaanisha hatia yenyewe au sadaka ya hatia katika muktadha huu wa ibada.
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּ֞ל אֲשֶׁר
  choice: au kitu chochote
  rationale: Inaendeleza orodha ya mambo yaliyotajwa katika mstari uliotangulia na kudumisha upana wa maana ya ‘chochote.’
- source_word: יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒
  choice: alichokiapia kwa uongo
  rationale: Muundo huu unaeleza kuapa kwa uongo kuhusu kitu fulani; tafsiri hii ni ya kawaida na inaunganisha kiapo na kitu kinachohusika.
- source_word: וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ
  choice: atakirudisha chote
  rationale: Nahau ya Kiebrania ‘kwa kichwa chake’ humaanisha kurejesha kiasi cha msingi kikamilifu, kabla ya nyongeza.
- source_word: וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו
  choice: na kuongeza sehemu moja ya tano ya thamani yake
  rationale: Inaonyesha nyongeza ya asilimia ishirini juu ya thamani ya mali iliyorejeshwa.
- source_word: לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ
  choice: mwenye mali hiyo
  rationale: Nahau hiyo humtaja mtu ambaye kitu hicho ni mali yake kihalali; Kiswahili hiki ni wazi na cha kawaida.
- source_word: יִתְּנֶ֖/נּוּ
  choice: Atampa
  rationale: Kitenzi נתן humaanisha ‘kutoa/kumpa’; hapa kinahusu kukabidhi marejesho kwa mwenye haki.
- source_word: בְּ/י֥וֹם אַשְׁמָתֽ/וֹ
  choice: siku atakapopatikana na hatia
  rationale: Neno אַשְׁמָה kimsingi linaweza kutaja hali ya kuwa na hatia; usemi huu unaeleza wakati wa wajibu wa kulipa bila kuufanya kuwa sadaka moja kwa moja.
theological_decisions:
- issue: Maana ya אַשְׁמָתוֹ katika muktadha wa sheria na ibada
  choice: siku atakapopatikana na hatia
  alternative: siku ya sadaka yake ya hatia
  rationale: Neno hilo linaweza kuhusishwa na hatia au, katika muktadha wa Walawi, na sadaka ya hatia. Maandishi makuu yanatanguliza maana ya hali ya hatia, huku tanbihi ikihifadhi uwezekano wa maana ya kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kisheria iliyo wazi na yenye hadhi. ‘Sehemu moja ya tano’ imechaguliwa badala ya istilahi ya kihisabati isiyo ya kawaida, na ‘mwenye mali hiyo’ hufanya mhusika wa marejesho aeleweke mara moja.
