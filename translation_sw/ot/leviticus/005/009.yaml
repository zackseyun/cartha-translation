id: LEV.5.9
reference: Leviticus 5:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: sw
  text: Naye atanyunyiza sehemu ya damu ya sadaka ya dhambi kwenye upande wa madhabahu[a], na damu iliyobaki itakamuliwa kwenye msingi wa madhabahu. Hiyo ni sadaka ya dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso,” hapa na mwishoni mwa aya. Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka kwa ajili ya dhambi, likisisitiza kazi yake ya kutakasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: atanyunyiza
  rationale: Hifili ya נזה katika taratibu za dhabihu humaanisha kutumia damu kwa kuinyunyiza; kitenzi hiki ni cha kawaida na kinaeleweka katika Kiswahili.
- source_word: מִדַּם
  choice: sehemu ya damu
  rationale: 'מִן hapa ina maana ya kugawa: kuhani hutumia kiasi fulani cha damu katika hatua hii.'
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria za Walawi neno חַטָּאת linataja sadaka inayohusiana na dhambi; tafsiri hii ni ya kawaida na inayotambulika, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: kwenye ubavu wa madhabahu
  rationale: קִיר ni ukuta au uso wa upande; kwa madhabahu, 'ubavu' hutaja kwa kawaida sehemu yake ya pembeni bila kudokeza ukuta wa jengo.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: na damu iliyobaki
  rationale: Neno hili linamaanisha kilichosalia; mpangilio huu ni wa asili na wazi katika Kiswahili.
- source_word: יִמָּצֶה
  choice: itakamuliwa
  rationale: Nifali ya מצה hapa inaeleza damu iliyosalia kutolewa kwa kukamua au kuibonyeza, si kumwagwa tu.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: kwenye msingi wa madhabahu
  rationale: יְסוֹד humaanisha msingi au sehemu ya chini inayotegemeza madhabahu.
- source_word: חַטָּאת הוּא
  choice: Hiyo ni sadaka ya dhambi
  rationale: Kishazi hiki kinaitambulisha sadaka kwa aina yake na kudumisha istilahi iliyotumiwa mwanzoni mwa aya.
theological_decisions:
- issue: Tafsiri ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kusisitiza uhusiano wa sadaka na dhambi au kazi yake ya kutakasa. 'Sadaka ya dhambi' inabaki kuwa istilahi inayotambulika, na maana halisi mbadala imewekwa katika tanbihi ili kutoficha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. 'Madhabahu' na 'sadaka ya dhambi' zimetumiwa kama istilahi zinazotambulika katika muktadha wa ibada; 'itakamuliwa' huhifadhi kitendo maalumu cha kutoa damu iliyosalia.
