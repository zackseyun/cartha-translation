  text: וְ/הֵבִ֤יא אֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן וְ/הִקְרִ֛יב אֶת אֲשֶׁ֥ר לַ/חַטָּ֖את רִאשׁוֹנָ֑ה וּ/מָלַ֧ק אֶת רֹאשׁ֛/וֹ מִ/מּ֥וּל עָרְפּ֖/וֹ וְ/לֹ֥א יַבְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: sw
  text: Naye atawaleta kwa kuhani; kisha atamtoa kwanza yule wa sadaka ya dhambi[a]. Atakibana kichwa chake shingoni[b], lakini hatakitenganisha kabisa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Katika sheria za dhabihu za Walawi, neno la Kiebrania חַטָּאת linaweza pia kutumiwa kwa dhabihu inayohusu utakaso.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi hiki cha Kiebrania hueleza tendo maalumu la kuhani kwa ndege wa dhabihu, la kubana au kupindisha kichwa shingoni. Kirai kinachotaja mahali pa tendo hilo ni kigumu; tafsiri za jadi mara nyingi husema “kukipotoa” au “kukivunja” kichwa.
    reason: lexical_alternative
  - marker: c
    text: Yaani, kichwa hakikupaswa kutenganishwa kabisa na mwili.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: Naye atawaleta kwa kuhani
  rationale: Wakati ujao wenye nguvu ya agizo unafaa kwa sheria hii ya dhabihu; kiwakilishi cha wingi kinawarejelea ndege wawili waliotajwa katika muktadha uliotangulia.
- source_word: וְהִקְרִיב
  choice: kisha atamtoa
  rationale: Katika muktadha wa dhabihu, Hiphil ya קרב humaanisha kumwasilisha au kumtoa kuwa sadaka. ‘Atamtoa’ ni ya kawaida kwa Kiswahili na inatofautisha tendo la kuhani na kuwaleta ndege kwake.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: kwanza yule wa sadaka ya dhambi
  rationale: Huhifadhi uteuzi wa ndege mmoja na msisitizo wa kwamba ndiye anayeshughulikiwa kwanza.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Hili ndilo neno linalotambulika kwa urahisi katika sheria za Walawi, huku uwezekano wa maana ‘sadaka ya utakaso’ ukihifadhiwa katika tanbihi.
- source_word: וּמָלַק אֶת רֹאשׁוֹ
  choice: Atakikonyoa kichwa chake
  rationale: מלק ni kitenzi maalumu cha kitendo cha kuhani kwa ndege wa dhabihu. ‘Kukikonyoa kichwa’ hudokeza tendo la kukibana na kukipasua bila kukifanya kikatike kabisa, badala ya kukitafsiri kama kukata kwa chombo.
- source_word: מִמּוּל עָרְפּוֹ
  choice: upande wa kisogo
  rationale: עֹרֶף huelekea kumaanisha kisogo au sehemu ya nyuma ya shingo, na מִמּוּל hapa hutaja eneo au upande wa tendo. Tafsiri hii inahifadhi hali ngumu ya kirai bila kukilazimisha kuwa ‘mbele ya shingo.’
- source_word: וְלֹא יַבְדִּיל
  choice: lakini hatakitenganisha kabisa na mwili
  rationale: 'בדל humaanisha kutenganisha. Kuongeza ‘na mwili’ kunafanya rejeo la tendo liwe wazi kwa Kiswahili: kichwa hakipaswi kuondolewa kabisa.'
