translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa agizo umetolewa kwa wakati ujao, kama ilivyo kawaida katika sheria za Biblia. Neno la kiibada חַטָּאת na ugumu wa kitendo cha מלק yamefafanuliwa kwa tanbihi bila kuondoa utata halisi wa chanzo.
