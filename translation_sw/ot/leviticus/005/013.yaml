  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: sw
  text: Hivyo kuhani atafanya upatanisho kwa ajili yake kwa dhambi aliyotenda katika mojawapo ya mambo haya, naye atasamehewa.[a] Nayo itakuwa ya kuhani kama sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhambi hiyo itasamehewa kwake.” Kiebrania kimetumia kauli tendwa na hakimtaji wazi anayesamehe.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: atafanya upatanisho kwa ajili yake
  rationale: Katika sheria za dhabihu, kitenzi כפר pamoja na עַל humaanisha tendo la kikuhani la kufanya upatanisho kwa niaba ya mkosaji. Kauli hii ni ya kawaida, wazi, na haibani maana kwa nadharia moja maalumu ya upatanisho.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika mazingira ya ibada ya Walawi.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: kwa dhambi aliyotenda
  rationale: Ingawa חַטָּאת linaweza kumaanisha dhambi au sadaka ya dhambi, kishazi אֲשֶׁר חָטָא kinaelekeza hapa kwenye kosa alilotenda.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: katika mojawapo ya mambo haya
  rationale: Kauli hii inarejelea mojawapo ya hali zilizotajwa kabla na kuhifadhi maana ya sehemu ya kundi.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: Kauli tendwa ya Kiswahili ni ya kawaida na inahifadhi hali ya kutotajwa wazi kwa anayesamehe katika Kiebrania.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: Sadaka hiyo itakuwa ya kuhani
  rationale: Kitenzi cha kike kinarejelea sadaka iliyozungumziwa. Kutaja 'sadaka hiyo' huweka rejeo wazi kwa Kiswahili bila kubadili haki ya kuhani inayoelezwa.
- source_word: כַּמִּנְחָה
  choice: kama ilivyo kwa sadaka ya nafaka
  rationale: Katika muktadha wa Walawi, מִנְחָה humaanisha hasa sadaka ya nafaka; muundo huu unaonyesha kwamba sadaka inayozungumziwa itatendewa kama sadaka hiyo kuhusu sehemu ya kuhani.
theological_decisions:
- issue: Kauli ya msamaha baada ya ibada ya dhabihu
  choice: naye atasamehewa
  alternative: nayo itasamehewa kwake
  rationale: Kiebrania kimetumia kauli tendwa na hakimtaji Mungu moja kwa moja kuwa mtendaji. Tafsiri iliyochaguliwa ni ya asili kwa Kiswahili huku ikidumisha kutotajwa huko na kuepuka kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku istilahi ya ibada 'kufanya upatanisho' na 'sadaka ya nafaka' zikidumishwa kwa uthabiti.
