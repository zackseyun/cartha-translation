  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: sw
  text: Au mtu akiapa, akitamka kwa midomo yake bila kufikiri[a] kwamba atafanya baya au jema—lolote ambalo mtu anaweza kutamka kwa kiapo—nalo likawa limefichika kwake[b], kisha akalijua na kuwa na hatia katika mojawapo ya mambo hayo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akitamka kwa midomo yake.” Neno la Kiebrania lenyewe linaweza kusisitiza kutamka; wazo la kutamka bila kufikiri linatokana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Yaani, jambo hilo likawa halijulikani kwake au likampotea akilini; Kiebrania hutumia usemi wa kutendwa, “likawa limefichika kwake.”
    reason: ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria za Walawi, neno hili humaanisha mtu binafsi, si nafsi kama sehemu isiyo ya mwili.
- source_word: תִשָּׁבַע
  choice: akiapa
  rationale: Nifali ya שׁבע hapa inaeleza kuapa au kuweka kiapo; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: akitamka kwa midomo yake bila kufikiri
  rationale: Maneno ya Kiebrania kimsingi yanataja kutamka kwa midomo; muktadha wa kosa unaashiria tamko la haraka au lisilofikiriwa. Tanbihi inahifadhi uwezekano wa maana pana zaidi.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: kwamba atafanya baya au jema
  rationale: Tafsiri hii inadumisha upambanuzi mpana wa Kiebrania kati ya baya na jema bila kuubana kuwa kudhuru au kusaidia tu.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: lolote ambalo mtu anaweza kutamka kwa kiapo
  rationale: Kauli hii inapanua shauri lihusu jambo lolote linaloweza kutamkwa katika kiapo. 'Mtu' ni uwakilishi wa asili wa אָדָם ya kijumla katika Kiswahili.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: nalo likawa limefichika kwake
  rationale: Muundo wa kutendwa wa Kiebrania umehifadhiwa badala ya kutafsiriwa moja kwa moja kuwa 'akalisahau' au 'hakujua,' ambazo zingefunga maana.
- source_word: וְהוּא יָדַע
  choice: kisha akalijua
  rationale: '''Kisha'' huonyesha mfuatano unaodokezwa: kwanza jambo limefichika kwake, halafu analitambua.'
- source_word: וְאָשֵׁם
  choice: na kuwa na hatia
  rationale: Kitenzi kinaeleza hali ya kuwajibika kwa kosa; tafsiri haidai kwamba ufahamu wa baadaye ndio uliosababisha hatia.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: katika mojawapo ya mambo hayo
  rationale: Hurejelea mojawapo ya visa vilivyotajwa katika kifungu hiki cha sheria.
theological_decisions:
- issue: Wakati na msingi wa kuwa na hatia baada ya kiapo kisichofikiriwa
  choice: kisha akalijua na kuwa na hatia
  alternative: kisha akalijua, ndipo akawa na hatia
  rationale: Kiebrania kinaunganisha kujua na kuwa na hatia lakini hakisemi wazi kwamba kujua ndiko kunakosababisha hatia. Tafsiri iliyochaguliwa huhifadhi mvutano huo.
- issue: Upeo wa הָאָדָם katika kanuni ya kisheria
  choice: mtu
  alternative: mwanadamu
  rationale: Hapa הָאָדָם ni umoja wa kijumla unaowakilisha mtu yeyote. Kiswahili 'mtu' huwasilisha upeo huo kwa kawaida bila kudokeza kuwa sheria inawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Sentensi inaendeleza muundo wa sharti wa kifungu kinachozunguka, kwa hiyo inamalizika kwa koma kama katika chanzo cha mashauriano.
