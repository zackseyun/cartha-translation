base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: sw
  text: 'Lakini ikiwa uwezo wake hautoshi kupata kondoo, atamletea Yahwe sadaka yake ya hatia kwa ajili ya dhambi aliyotenda: hua wawili au makinda mawili ya njiwa; mmoja awe sadaka ya dhambi[a], na mwingine awe sadaka ya kuteketezwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha “dhambi” au sadaka inayohusiana na kuondoa dhambi au unajisi katika miktadha ya dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: ikiwa uwezo wake hautoshi kupata kondoo
  rationale: Nahau ya Kiebrania husema kihalisi kwamba mkono wake haufikii kiasi cha kondoo, yaani hana uwezo wa kiuchumi wa kumpata. Tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida bila kuibana kuwa ununuzi pekee.
- source_word: אֲשָׁמוֹ
  choice: sadaka yake ya hatia
  rationale: Katika muktadha huu neno אָשָׁם linataja sadaka inayoletwa kwa sababu ya hatia; ‘sadaka ya hatia’ ni wazi na hudumisha uhusiano wake na kosa lililotendwa.
- source_word: אֲשֶׁר חָטָא
  choice: kwa ajili ya dhambi aliyotenda
  rationale: Kirai hiki kinaunganisha sadaka na dhambi iliyotendwa. Kiswahili cha kawaida huhitaji kutaja ‘dhambi’ wazi ili maana isikike kwa urahisi.
- source_word: שְׁתֵּי תֹרִים
  choice: hua wawili
  rationale: תֹרִים ni ndege aina ya hua wanaotajwa katika sheria za dhabihu; ‘hua wawili’ ni usemi mfupi na wa kawaida katika Kiswahili.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: makinda mawili ya njiwa
  rationale: Kirai hiki, ambacho kihalisi ni ‘wana wawili wa njiwa,’ ni nahau ya ndege wachanga. ‘Makinda mawili ya njiwa’ huhifadhi umri wao kwa Kiswahili cha asili.
- source_word: לַיהוָה
  choice: atamletea Yahwe
  rationale: Kihusishi לְ kinaonyesha kwamba sadaka inaletezwa Yahwe. Jina la agano יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika sheria hii חַטָּאת linataja aina ya sadaka. ‘Sadaka ya dhambi’ ni tafsiri iliyo wazi na inayotambulika, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
- source_word: לְעֹלָה
  choice: kuwa sadaka ya kuteketezwa
  rationale: עֹלָה ni dhabihu inayoteketezwa yote. ‘Sadaka ya kuteketezwa’ ni tafsiri ya kawaida na inayoeleweka kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Maana ya istilahi ya dhabihu חַטָּאת
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Katika muktadha wa dhabihu neno hili linaweza kusisitiza sadaka inayohusiana na dhambi au kazi yake ya kutakasa. Matini kuu inatumia istilahi ya kawaida ‘sadaka ya dhambi,’ lakini tanbihi inahifadhi maana nyingine inayowezekana bila kuondoa mvutano wa kimaanisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti na mpangilio wa sadaka umehifadhiwa; nahau ya uwezo wa kiuchumi imetolewa kwa lugha ya asili. Alama ya tanbihi imewekwa baada ya ‘sadaka ya dhambi,’ ambako mbadala wa חַטָּאת unahusika.
