  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: sw
  text: Na itakuwa kwamba, atakapokuwa na hatia[a] katika mojawapo ya mambo haya, ataungama dhambi aliyotenda kuhusiana na jambo hilo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakapopata hatia” au “atakapoingia katika hatia.” Kitenzi cha Kiebrania kinasisitiza hatia au uwajibikaji wa kisheria, si hisia ya ndani tu ya kuwa amekosa.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “ataungama lile ambalo ametenda dhambi kuhusiana nalo.” Maneno haya yanarejelea mojawapo ya mambo yaliyotajwa kabla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Na itakuwa kwamba
  rationale: Inadumisha mtindo wa mpito wa kisheria wa Kiebrania, ingawa Kiswahili cha kawaida kingeweza kuufupisha kwa kutumia “basi” pekee.
- source_word: כִּי
  choice: atakapokuwa
  rationale: Katika sheria hii, kiunganishi kinaanzisha hali inayotarajiwa kutokea; muundo wa “atakapo-” unafaa kuliko sharti la mbali la “ikiwa”.
- source_word: יֶאְשַׁם
  choice: atakapopata hatia
  rationale: Kitenzi אשם hapa kinaelekeza kwenye kuwa chini ya hatia au wajibu wa kisheria, si lazima kutambua hatia moyoni.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: katika mojawapo ya mambo haya
  rationale: Kirai hiki kinarejelea mojawapo ya visa vilivyoorodheshwa kabla yake; “mambo” ni wazi na ya kawaida katika Kiswahili.
- source_word: וְהִתְוַדָּה
  choice: ataungama
  rationale: Muundo wa hitpaeli wa ידה hapa una maana ya kukiri au kuungama kosa; “ataungama” inadumisha agizo la kisheria.
- source_word: אֲשֶׁר חָטָא
  choice: dhambi aliyotenda
  rationale: Usemi huu unaonyesha jambo linalopaswa kuungamwa. Muundo huu ni wa asili katika Kiswahili na unahifadhi dhambi kama tendo lililofanywa.
- source_word: עָלֶיהָ
  choice: kuhusiana na jambo hilo
  rationale: Kiambishi cha kike cha umoja kinarejelea jambo husika katika orodha; tafsiri hii inahifadhi rejeo hilo bila kulazimisha kihusishi cha Kiebrania.
theological_decisions:
- issue: Iwapo יֶאְשַׁם ina maana ya kutambua hatia ndani ya nafsi au kupata hatia ya kisheria
  choice: atakapopata hatia
  alternative: atakapotambua kuwa ana hatia
  rationale: Chanzo cha Kiebrania kinasisitiza hali ya hatia au uwajibikaji; hakitaji wazi hatua ya ndani ya kuitambua. Tafsiri haiongezi wazo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. “Na itakuwa kwamba” huhifadhi mwangwi wa fomula ya kisheria ya Kiebrania; sehemu ya mwisho imesawazishwa kwa Kiswahili cha asili huku rejeo la עָלֶיהָ likihifadhiwa wazi.
