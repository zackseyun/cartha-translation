base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: sw
  text: Na itakuwa[a] kwamba, atakapotenda dhambi na kuwa na hatia, atarudisha kile alichopora, au kile alichojipatia kwa dhuluma[b], au amana aliyokabidhiwa, au kitu kilichopotea alichokipata[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na ikiwa atatenda dhambi na kupata hatia.” Muundo wa sheria wa Kiebrania unaweza kutafsiriwa kwa “atakapo” au “ikiwa”; pia maneno haya yanaweza kueleza kuwa na hatia au kupata hatia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kile alichopata kwa ukandamizaji” au “kile alichopata kwa udanganyifu.” Neno la Kiebrania linaweza kumaanisha kuchukua au kuzuia mali ya mwingine kwa dhuluma au udanganyifu.
    reason: lexical_alternative
  - marker: c
    text: Au, “mali iliyopotea aliyoipata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Basi itakuwa, atakapo-
  rationale: Huhifadhi muundo wa kisheria unaoanzisha hali fulani; ‘atakapo-’ ni ya asili katika Kiswahili na inaonyesha tukio linalotarajiwa, huku tanbihi ikihifadhi uwezekano wa ‘ikiwa’.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: atakatenda dhambi na kuwa na hatia
  rationale: ‘Kutenda dhambi’ huhifadhi uzito wa kimaadili na wa agano wa חטא; ‘kuwa na hatia’ huonyesha hali ya kuwajibika bila kuifanya kimsingi kuwa hisia au utambuzi wa ndani.
- source_word: וְהֵשִׁיב
  choice: atarudisha
  rationale: Katika muktadha huu wa sheria, kitenzi kinaamuru kurejesha mali; wakati ujao wa Kiswahili hubeba nguvu ya matokeo yanayotakiwa katika muundo huu.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: kile alichopora
  rationale: Hutoa kwa ufupi na kwa kawaida wazo la kitu kilichochukuliwa kwa nguvu au isivyo halali, bila kurudia nomino na kitenzi vya mzizi mmoja kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: kile alichojipatia kwa kumdhulumu mwingine
  rationale: Mzizi עשׁק unaweza kuhusisha unyang’anyi kwa dhuluma, ukandamizaji, au udanganyifu. Tafsiri hii inaweka wazi kwamba orodha inahusu mali iliyopatikana kwa kumwonea mwingine huku ikihifadhi upana huo katika tanbihi.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: mali aliyokabidhiwa aitunze
  rationale: Hueleza kwa Kiswahili cha kawaida mali iliyowekwa chini ya uangalizi wa mtu; ni wazi kuliko kutumia istilahi nyembamba ya kifedha kama ‘amana’ pekee.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: kitu kilichopotea alichokipata
  rationale: Hufuata maana ya moja kwa moja bila kudhani aina maalumu ya mali; tanbihi inatoa namna mbadala iliyo wazi zaidi katika muktadha wa kisheria.
theological_decisions:
- issue: Je, וְאָשֵׁם inaonyesha kupata hatia au kuitambua hatia?
  choice: kuwa na hatia
  alternative: kutambua hatia yake
  rationale: Muundo wa Kiebrania unaweza kuhusishwa na kuwajibika au kuwa na hatia; tafsiri kuu haiongezi wazo la utambuzi wa ndani ambalo halijaelezwa wazi katika kifungu hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa orodha na utata halisi wa כִּי, וְאָשֵׁם, na עשׁק umehifadhiwa kwa maandishi na tanbihi. Alama zote za tanbihi zimewekwa karibu na vipengele vinavyohusika.
