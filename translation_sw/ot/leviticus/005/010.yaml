  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: sw
  text: Naye atamtoa yule wa pili kuwa sadaka ya kuteketezwa, kulingana na utaratibu uliowekwa[a]. Kuhani atamfanyia upatanisho kwa ajili ya dhambi yake aliyoitenda, naye atasamehewa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na kanuni iliyowekwa.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina kauli ya kutendwa inayomwacha msameheji wa kimungu bila kutajwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: yule wa pili
  rationale: Ni kivumishi cha mpangilio kinachorejelea ndege wa pili katika muktadha uliotangulia; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: יַעֲשֶׂה
  choice: atamwandaa
  rationale: Kitenzi עשה kina maana pana ya kufanya au kuandaa; katika utaratibu wa dhabihu, ‘atamwandaa’ huonyesha tendo la ibada bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida na linaloeleweka kwa aina hii ya dhabihu katika Walawi.
- source_word: כַּמִּשְׁפָּט
  choice: kulingana na utaratibu uliowekwa
  rationale: מִשְׁפָּט hapa inaonyesha kanuni au utaratibu rasmi uliowekwa kwa ajili ya sadaka, si hukumu ya mahakama.
- source_word: וְכִפֶּר עָלָיו
  choice: atamfanyia upatanisho
  rationale: ‘Kumfanyia upatanisho’ huhifadhi lugha maalumu ya kikuhani ya כפר bila kuipunguza iwe utakaso pekee au msamaha pekee.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: kwa ajili ya dhambi aliyotenda
  rationale: Usemi huu wa asili katika Kiswahili unaonyesha dhambi inayohusika kama sababu ya upatanisho huku ukihifadhi maana ya Kiebrania.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: Kauli ya kutendwa inahifadhi namna Kiebrania kinavyomwacha msameheji wa kimungu bila kutajwa wazi.
theological_decisions:
- issue: Kutafsiri lugha ya kikuhani ya upatanisho bila kuingiza ufafanuzi wa baadaye wa kimadhehebu
  choice: atamfanyia upatanisho
  alternative: atamtakasa; atampatia msamaha
  rationale: כפר ni istilahi ya kawaida ya dhabihu inayohusiana na upatanisho na matokeo ya msamaha. Tafsiri hii huhifadhi upana wa dhana hiyo bila kuifungamanisha na nadharia moja maalumu.
- issue: Kuhifadhi kauli ya kutendwa kuhusu msamaha
  choice: naye atasamehewa
  alternative: BWANA atamsamehe; nayo atasamehewa
  rationale: Kiebrania hakimtaji wazi mtendaji wa msamaha. Kauli ya kutendwa hudumisha staha na mvutano huo wa kitheolojia bila kuongeza jina la Mungu katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida, huku uhusiano wa matendo ya ibada, upatanisho na msamaha ukihifadhiwa.
