  text: וְ/הִתְנַחֲלְתֶּ֨ם אֹתָ֜/ם לִ/בְנֵי/כֶ֤ם אַחֲרֵי/כֶם֙ לָ/רֶ֣שֶׁת אֲחֻזָּ֔ה לְ/עֹלָ֖ם בָּ/הֶ֣ם תַּעֲבֹ֑דוּ וּ/בְ/אַ֨חֵי/כֶ֤ם בְּנֵֽי יִשְׂרָאֵל֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: sw
  text: Mnaweza kuwaacha wawe mali ya urithi ya kudumu kwa wana wenu baada yenu; mnaweza kuwatumikisha. Lakini kwa ndugu zenu, wana wa Israeli[b], mtu yeyote asimtawale ndugu yake kwa ukali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnaweza kuwarithisha wana wenu baada yenu kama mali ya urithi ya kudumu.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “ndugu” na “wana wa Israeli” yanatafsiri moja kwa moja maneno ya Kiebrania ya undugu katika umbo la kiume; sheria hii inawaeleza Waisraeli wenzao kuwa ndugu ndani ya agano.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: mnaweza kuwaachia ... wawe urithi
  rationale: Kauli hii inadumisha maana ya kisheria ya kuwahamisha watu hao kwa kizazi kinachofuata kama urithi, huku ikitumia Kiswahili cha kawaida na kinachoeleweka.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: wana wenu ... baada yenu
  rationale: Neno la Kiebrania בנים ni ‘wana’ kwa umbo la kiume, na אַחֲרֵיכֶם linaonyesha wakati baada ya wazazi kufa; mpangilio wa Kiswahili umebadilishwa kidogo kwa ufasaha.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: ili wawamiliki kama mali
  rationale: Tafsiri hii inabeba vipengele vyote viwili vya kurithi na kumiliki mali, bila kuficha hadhi ya watu hao kama mali chini ya sheria hii.
- source_word: לְעֹלָם
  choice: ya kudumu
  rationale: Katika muktadha huu wa kisheria, neno hilo linaonyesha umiliki unaoendelea bila kikomo kilichowekwa, si lazima umilele wa kimetafizikia.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: mnaweza kuwatumikisha
  rationale: ‘Kuwatumikisha’ huonyesha kwamba kazi inalazimishwa na mwenye mamlaka, badala ya kuifanya ionekane kuwa ajira ya hiari.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: Lakini ndugu zenu, wana wa Israeli
  rationale: Hii inadumisha utofautishaji na sehemu iliyotangulia pamoja na lugha ya undugu wa agano na muundo wa ufafanuzi wa Kiebrania.
- source_word: אִישׁ בְּאָחִיו
  choice: mtu yeyote ... ndugu yake
  rationale: Muundo huu wa Kiswahili unatoa kwa kawaida maana ya kugawa wajibu kwa kila mtu katika uhusiano wake na ndugu yake.
- source_word: לֹא תִרְדֶּה בוֹ
  choice: asimtawale
  rationale: Kitenzi ‘kutawala’ kinahifadhi maana ya kutumia mamlaka juu ya mwingine bila kuongeza wazo lisilotajwa moja kwa moja.
- source_word: בְּפָרֶךְ
  choice: kwa ukali
  rationale: Kirai hiki kinaonyesha ukali wa kikatili katika mazingira ya kazi ya kulazimishwa; ‘kwa ukali’ ni kifupi, cha sasa, na cha heshima.
theological_decisions:
- issue: Lugha ya undugu katika sheria ya kijamii ya Israeli
  choice: Kudumisha ‘ndugu’ na ‘wana wa Israeli’.
  alternative: Waisraeli wenzenu; jamaa zenu
  rationale: Kiebrania kinatumia maneno dhahiri ya kiume ya undugu ili kueleza mshikamano na wajibu ndani ya agano; kuyadumisha kunalinda sura hiyo ya kifamilia bila kuibadilisha kuwa utambulisho wa kitaifa tu.
- issue: Uwazi wa lugha kuhusu utumwa na umiliki
  choice: Kutumia wazi lugha ya urithi, mali, umiliki, na kuwatumikisha.
  alternative: Kutumia lugha laini ya utumishi ambayo haionyeshi umiliki
  rationale: Matini ya Kiebrania inawasilisha watu kama mali ya urithi na kama wale wanaolazimishwa kufanya kazi. Tafsiri haipaswi kuficha uzito wa kijamii na kimaadili wa sheria hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisheria ulio wazi na wenye heshima. Muundo ‘kuwaachia ... wawe urithi’ ni wa kawaida kuliko ‘kuwarithisha’ katika sentensi kuu, huku tanbihi ikihifadhi mbadala huo wa karibu zaidi. Lugha haijalainisha ukweli wa umiliki na kazi ya kulazimishwa.
