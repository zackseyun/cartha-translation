  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: sw
  text: Mtauweka wakfu mwaka wa hamsini, na kutangaza uhuru[a] nchini kwa wakazi wake wote. Utakuwa mwaka wa Yubile kwenu. Kila mmoja wenu[d] atarudi kwenye sehemu yake ya urithi[b], na kila mmoja wenu atarudi kwa jamaa yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuachiliwa.” Neno la Kiebrania linahusu tangazo rasmi la kuachiliwa katika mwaka wa Yubile.
    reason: lexical_alternative
  - marker: b
    text: Au, “mali yake.” Neno la Kiebrania hasa linaweza kumaanisha ardhi ya ukoo aliyorithi mtu.
    reason: lexical_alternative
  - marker: c
    text: Au, “familia yake” au “ukoo wake.” Neno la Kiebrania linaweza kutaja kundi la jamaa lenye ukubwa tofauti.
    reason: lexical_alternative
  - marker: d
    text: Kiebrania kihalisi kina “kila mwanamume”; hapa umoja huo umetumiwa kwa maana ya mtu mmoja mmoja miongoni mwa wale wanaoambiwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: mtauweka wakfu
  rationale: Kitenzi קדשׁ katika Piel humaanisha kutenga kuwa kitakatifu au kuweka wakfu. Usemi huu ni wa kawaida na wenye heshima katika Kiswahili, huku ukihifadhi maana ya kidini.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: mwaka wa hamsini
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza mwaka wa mpangilio unaokusudiwa na muundo wa Kiebrania.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: na kutangaza uhuru
  rationale: דרור ni tangazo rasmi la uhuru au kuachiliwa katika mwaka wa Yubile. 'Kutangaza uhuru' huhifadhi tendo la kutangaza na upana wa maana, huku tanbihi ikionyesha uwezekano wa 'kuachiliwa huru.'
- source_word: בָּאָרֶץ
  choice: nchini
  rationale: בְּ hapa huonyesha mahali, 'katika nchi.' 'Nchini' ni Kiswahili cha kawaida na haiongezi wazo la 'kotekote' lisilotajwa moja kwa moja.
- source_word: לְכָל יֹשְׁבֶיהָ
  choice: kwa wakazi wake wote
  rationale: Huwakilisha kwa ufupi na kwa kawaida maana ya 'kwa wote wanaokaa humo,' pamoja na kiambishi cha umilikaji kinachoirejelea nchi.
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: Utakuwa mwaka wa Yubile kwenu
  rationale: Katika muktadha huu יוֹבֵל ni jina la utaratibu maalumu wa mwaka wa hamsini, si pembe ya kondoo peke yake. Kuongeza 'mwaka wa' hufanya rejeo la kiwakilishi lieleweke kwa kawaida katika Kiswahili.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: atarudi ... atarudi
  rationale: Kurudia kitenzi 'kurudi' huhifadhi marudio ya שוב na dhamira ya kurejeshwa iliyomo katika Kiebrania.
- source_word: אִישׁ
  choice: kila mmoja wenu
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo, mtu mmoja mmoja ndani ya kundi linaloambiwa kwa wingi. 'Kila mmoja wenu' ni ya asili katika Kiswahili na hudumisha uhusiano na hotuba ya nafsi ya pili bila kuamua zaidi ya lazima ni nani anayehusika.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: kwenye milki yake
  rationale: אֲחֻזָּה ni mali au sehemu ya ardhi inayomilikiwa, hasa urithi wa ukoo. 'Milki yake' ni fupi na yenye heshima; tanbihi inafafanua maana ya ardhi ya urithi.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: kwa jamaa yake
  rationale: מִשְׁפָּחָה inaweza kumaanisha familia, jamaa pana, au ukoo. 'Jamaa yake' huhifadhi upana huo vizuri kuliko neno linaloamua kwa lazima kuwa familia ndogo au ukoo.
theological_decisions:
- issue: Maana ya kiufundi ya יוֹבֵל
  choice: mwaka wa Yubile
  alternative: pembe ya kondoo dume
  rationale: Katika sheria hii neno linataja taasisi ya mwaka maalumu wa kurejesha mali na watu, ingawa jina lake linahusiana na pembe iliyotumiwa kutangaza mwaka huo.
- issue: Uwasilishaji wa אִישׁ ya mgawanyo katika sheria
  choice: kila mmoja wenu
  alternative: kila mwanamume
  rationale: Nomino ya Kiebrania iko katika umoja wa kiume lakini hapa inafanya kazi ya kugawa agizo kwa mtu mmoja mmoja miongoni mwa wale wanaoambiwa. Tafsiri kuu haifuti maana hiyo, na tanbihi huhifadhi umbo la asili bila kulazimisha hitimisho kuhusu upeo wake wa kisheria.
- issue: Uhusiano wa uhuru na urejesho katika mwaka wa Yubile
  choice: uhuru
  alternative: kuachiliwa huru
  rationale: Neno דרור linaweza kusisitiza ama hali ya uhuru ama tendo rasmi la kuachiliwa. Maandishi makuu yanabaki mapana, na tanbihi inaonyesha mbadala unaowezekana bila kupunguza mvutano wa kimaana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa sheria ulio wazi na wenye heshima. Sentensi zimegawanywa ili zisomeke kwa urahisi, huku marudio ya 'atarudi' yakihifadhiwa kwa sababu ni muhimu katika muundo na ujumbe wa Kiebrania. 'Yubile' limetumiwa kama istilahi ya kibiblia, na maneno yenye uwezekano zaidi ya mmoja yamefafanuliwa kwa tanbihi badala ya kuamuliwa kimya kimya.
