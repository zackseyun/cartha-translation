  to: Basi mtazitekeleza sheria zangu, mtazishika hukumu zangu[a] na kuyafanya hayo[b]; nanyi mtakaa katika nchi[c] kwa usalama.
  rationale: The revision replaces the potentially misleading “masharti” with the more accurate and natural “sheria,” while retaining “hukumu” as the distinct second legal term. It also changes the resumptive object to “hayo,” making clear that the final act of doing applies to all the preceding divine requirements. The covenantal connection to secure dwelling in the land is retained without doctrinal expansion.
