  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: sw
  text: Basi mtazitekeleza sheria zangu, mtazishika hukumu zangu[a] na kuyafanya hayo[b]; nanyi mtakaa katika nchi[c] kwa usalama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maamuzi yangu ya kisheria.” Kiebrania kinatofautisha maneno mawili ya kisheria, חֻקִּים (“sheria”) na מִשְׁפָּטִים (“hukumu”).
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinarudia “fanya”: kihalisi, “mtazifanya sheria zangu ... mtazishika hukumu zangu na kuzifanya.”'
    reason: lexical_alternative
  - marker: c
    text: Yaani, nchi ambayo Mungu aliwaahidi Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: masharti yangu
  rationale: “Masharti” yanaonyesha maagizo yaliyowekwa na Mungu katika agano na yanabaki tofauti na מִשְׁפָּטַי, yaani “hukumu zangu.”
- source_word: מִשְׁפָּטַי
  choice: hukumu zangu
  rationale: Neno hili lina maana ya hukumu, maamuzi, au maagizo ya kisheria. “Hukumu” linadumisha uzito wa kisheria na tofauti yake na חֻקֹּתַי.
- source_word: תִּשְׁמְרוּ
  choice: mtazishika
  rationale: Katika muktadha wa agano, שׁמר humaanisha kuyatunza au kuyatii maagizo. “Kushika” ni usemi wa kawaida wa Kiswahili katika muktadha wa sheria na agano.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: mtayatekeleza ... na kuzifanya
  rationale: Kiebrania kinarudia kitenzi עשה. Tafsiri inatumia “kutekeleza” mara ya kwanza na “kufanya” mara ya pili ili kuhifadhi msisitizo huo bila kufanya sentensi iwe nzito kupita kiasi.
- source_word: וִישַׁבְתֶּם
  choice: mtaishi
  rationale: Katika muktadha wa kukaa kwa kudumu katika nchi, “mtaishi” ni Kiswahili cha kawaida na huonyesha makao yaliyotulia.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha huu neno linarejelea nchi ya ahadi. “Nchi” hudumisha maana hiyo ya agano bila kuongeza jina lisilotajwa moja kwa moja katika mstari.
- source_word: לָבֶטַח
  choice: kwa usalama
  rationale: בֶּטַח huonyesha hali ya kuwa salama na bila hofu. “Kwa usalama” ni usemi wa asili unaoambatana vizuri na “mtaishi.”
theological_decisions:
- issue: Uhusiano kati ya utii na kuishi kwa usalama katika nchi
  choice: 'Mstari unaonyesha matokeo ya agano katika mazingira ya Israeli: kushika maagizo ya Mungu kunahusishwa na kuishi kwa usalama katika nchi.'
  alternative: Kuufanya kuwa ahadi ya jumla ya usalama au mafanikio binafsi kwa waamini wote katika kila mazingira.
  rationale: Kiebrania kinaunganisha moja kwa moja kutekeleza masharti na hukumu za Mungu na kuishi kwa usalama katika nchi. Tafsiri inadumisha mazingira hayo ya agano bila kuipanua ahadi zaidi ya inavyosema matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unadumisha istilahi mbili tofauti za kisheria, marudio ya wazo la kufanya, na mazingira ya agano yanayohusu nchi.
