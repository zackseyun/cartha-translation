base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: sw
  text: Nena na Waisraeli[a], waambie, “Mtakapoingia katika nchi ninayowapa, nchi hiyo itashika Sabato[b] kwa ajili ya Yahwe[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni kihalisi “wana wa Israeli”; pia inaweza kutafsiriwa “watoto wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “nchi hiyo itapumzika kwa pumziko la Sabato kwa ajili ya Yahwe.” Kiebrania huihusisha nchi na tendo la kushika Sabato.
    reason: lexical_alternative
  - marker: c
    text: “Yahwe” linawakilisha jina la Mungu YHWH; tafsiri nyingine hutumia “BWANA.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Nena
  rationale: Kitenzi cha amri kinaanzisha agizo la moja kwa moja la Mungu; “nena” kina hadhi inayofaa bila kuwa cha kizamani kupita kiasi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa Kiebrania kinasema kihalisi “wana wa Israeli,” “Waisraeli” ni Kiswahili cha kawaida kinacholihusu taifa zima bila kupoteza rejeo lake.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Kinadumisha mwendelezo wa amri na uradidi wa kisheria uliopo katika Kiebrania kwa Kiswahili cha asili.
- source_word: כִּי תָבֹאוּ
  choice: Mtakapoingia
  rationale: כִּי hapa linaanzisha hali ya wakati inayotarajiwa kutimia, si sharti lisilo na uhakika; umbo la “-kapo-” linaonyesha maana hiyo vizuri.
- source_word: אֶל הָאָרֶץ
  choice: katika nchi
  rationale: Pamoja na kitenzi cha kuingia, “katika nchi” ni usemi wa asili wa Kiswahili unaoonyesha kuingia ndani ya nchi hiyo.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: ninayowapa
  rationale: Linahifadhi tendo la Mungu la sasa au linalokaribia la kuwakabidhi nchi.
- source_word: וְשָׁבְתָה הָאָרֶץ
  choice: nchi hiyo itapumzika
  rationale: Linahifadhi maana ya msingi ya שבת, yaani kuacha kazi au kupumzika, pamoja na taswira ya nchi kama mhusika anayepumzika.
- source_word: שַׁבָּת
  choice: kwa Sabato
  rationale: “Sabato” ni neno lililozoeleka kwa pumziko maalumu la agano; muundo huu unahifadhi uhusiano wa mzizi kati ya kupumzika na Sabato kadiri Kiswahili kinavyoruhusu.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: ל linaonyesha kwamba pumziko hilo limewekwa wakfu kwa Yahwe; “kwa ajili ya” ni la asili zaidi katika Kiswahili kuliko “kwa” peke yake katika muktadha huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano YHWH moja kwa moja. “Yahwe” hulitambulisha kama jina maalumu badala ya kulibadili kuwa cheo, huku tanbihi ikifafanua desturi nyingine ya tafsiri.
- issue: Nchi kuhusishwa na tendo la Sabato
  choice: nchi hiyo itapumzika kwa Sabato
  alternative: nchi hiyo itaadhimisha Sabato
  rationale: Chaguo hili linadumisha ubinfsishaji wa nchi na maana halisi ya mzizi שבת bila kuifanya nchi ionekane tu kama mtendaji wa ibada; tanbihi inaonyesha uwezekano wa kutafsiri kama kushika au kuadhimisha Sabato.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Uradidi wa “Nena… uwaambie” umehifadhiwa kwa sababu ni sehemu ya mtindo wa maagizo ya Kiebrania. “Sabato” imeandikwa kwa herufi kubwa kuonyesha pumziko maalumu la agano.
