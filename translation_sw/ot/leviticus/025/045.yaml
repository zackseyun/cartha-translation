  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: sw
  text: Pia mnaweza kununua miongoni mwa wana wa wageni wanaoishi kati yenu[a], na miongoni mwa jamaa zao walio kati yenu, ambao wamewazaa katika nchi yenu; nao watakuwa milki yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wa wakaaji wageni wanaoishi kati yenu”; hapa linaweza kumaanisha wazao wao.
    reason: lexical_alternative
  - marker: b
    text: Au “kuwa mali yenu.” Neno la Kiebrania lina maana ya milki au kitu kinachomilikiwa; katika muktadha huu ni umiliki unaoweza kurithishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... מֵהֶם תִּקְנוּ
  choice: Pia mnaweza kununua baadhi ya
  rationale: ‘Pia’ huendeleza ruhusa ya aya iliyotangulia, na ‘mnaweza kununua’ huwasilisha nguvu ya kisheria ya kitenzi cha nafsi ya pili wingi pamoja na maana yake ya kibiashara katika muktadha huu.
- source_word: מִבְּנֵי
  choice: baadhi ya wazao wa
  rationale: Ingawa neno hilo kwa umbo ni ‘wana wa,’ hapa linaweza kumaanisha watoto au wazao; ‘wazao’ ni Kiswahili cha kawaida na kinafaa katika muktadha wa ukoo na sheria.
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: wageni wanaoishi kati yenu
  rationale: Maneno haya mawili kwa pamoja yanataja watu wasio wenyeji waliokaa miongoni mwa Israeli. ‘Wageni wanaoishi kati yenu’ ni wazi na ya kawaida bila kupoteza hadhi yao ya ukaaji.
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: na baadhi ya jamaa zao walio kati yenu
  rationale: מִשְׁפָּחָה linaweza kuwa familia, ukoo, au kundi la jamaa. ‘Jamaa zao’ linatunza upana huo na sentensi inabaki ya asili kwa Kiswahili.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: ambao wamewazaa katika nchi yenu
  rationale: הוליד katika Hiphil humaanisha kuzaa au kuwa baba wa. ‘Wamewazaa’ huonyesha uzazi na ukoo kwa lugha ya kawaida, huku kiwakilishi kikirejelea watu wanaoweza kununuliwa.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: nao watakuwa milki yenu
  rationale: אֲחֻזָּה ni milki au kitu kinachomilikiwa, mara nyingi chenye hali ya kudumu au kurithishwa. ‘Milki yenu’ huhifadhi lugha kali ya umiliki ya sheria hii bila kuipunguza kuwa utumishi tu.
theological_decisions:
- issue: Lugha ya kununua na kumiliki watu katika sheria hii
  choice: Kutumia moja kwa moja ‘kununua’ na ‘milki’
  alternative: ‘kupata’ na ‘watumishi’
  rationale: Kiebrania kinaeleza ununuzi na hadhi ya umiliki. Tafsiri haipaswi kulainisha hali hiyo kwa maneno yasiyoonyesha wazi uhusiano wa kisheria unaotajwa.
- issue: Upeo wa בְּנֵי katika kifungu hiki
  choice: ‘wazao’ katika maandishi, huku maana halisi ‘wana’ ikitajwa katika tanbihi
  alternative: ‘wana’ pekee katika maandishi
  rationale: Katika muktadha wa kisheria na wa ukoo, בְּנֵי inaweza kuwahusu watoto au vizazi vya wageni hao. ‘Wazao’ ni wazi zaidi katika Kiswahili, lakini tanbihi inalinda umbo la karibu la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisheria lakini unaoeleweka kwa msomaji wa kawaida. Wingi wa nafsi ya pili umehifadhiwa kwa ‘mnaweza’ na ‘yenu.’
