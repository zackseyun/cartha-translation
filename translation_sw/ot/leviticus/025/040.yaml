base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: sw
  text: Atakuwa pamoja nawe kama mfanyakazi wa kuajiriwa, kama mgeni mkazi; atafanya kazi pamoja nawe mpaka mwaka wa yubile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: kama mfanyakazi wa kuajiriwa
  rationale: שָׂכִיר ni mfanyakazi anayefanya kazi kwa ujira. Tafsiri hii ni wazi katika Kiswahili cha sasa na inatofautisha hadhi yake na ile ya mtumwa katika muktadha.
- source_word: כְּתוֹשָׁב
  choice: kama mgeni mkazi
  rationale: תּוֹשָׁב humaanisha mtu asiye mwenyeji ambaye anaishi miongoni mwa jamii. “Mgeni mkazi” huhifadhi hadhi hii ya kijamii na kisheria kwa lugha fupi na inayoeleweka.
- source_word: יִהְיֶה עִמָּךְ
  choice: atakuwa pamoja nawe
  rationale: Hii inafuata moja kwa moja kauli ya Kiebrania na kuonyesha hadhi yake katika uhusiano na yule anayemtumikia; viambishi vya ulinganisho vinabebwa na “kama” mara mbili.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: mpaka mwaka wa yubile
  rationale: Hili ni jina maalumu la mwaka wa kuachiliwa katika Walawi 25. “Yubile” ni istilahi ya kawaida ya kibiblia katika Kiswahili.
- source_word: יַעֲבֹד עִמָּךְ
  choice: atakutumikia
  rationale: עבד inaweza kumaanisha kufanya kazi au kutumikia. Katika Kiswahili, “atakutumikia” huwasilisha kwa kawaida uhusiano wa huduma unaokusudiwa na עִמָּךְ bila kumwita mtu huyo mtumwa.
theological_decisions:
- issue: Hadhi ya Mwisraeli mwenye deni katika utumishi
  choice: Ameelezwa kama mfanyakazi wa kuajiriwa na mgeni mkazi, si kama mtumwa.
  alternative: Kutumia “mtumishi wa kuajiriwa” au maneno yanayoweza kueleweka kuwa utumwa.
  rationale: Muktadha wa karibu (aya 39–43) unamtofautisha wazi na mtumwa na kuweka utumishi wake kuwa wa muda na wenye ulinzi. Tafsiri haipaswi kuingiza dhana ya umiliki wa mtu ambayo kifungu hiki kinaizuia.
- issue: Maana ya עִמָּךְ katika יַעֲבֹד עִמָּךְ
  choice: atakutumikia
  alternative: atafanya kazi pamoja nawe
  rationale: Ingawa umbo la Kiebrania ni “pamoja nawe,” katika muktadha wa huduma ya deni Kiswahili cha asili hutumia “atakutumikia.” Mbadala “atafanya kazi pamoja nawe” unaweza kudokeza kimakosa kwamba wote wawili wanafanya kazi bega kwa bega.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi ulinganisho wa aina mbili katika Kiebrania na muda wa utumishi hadi mwaka wa yubile.
