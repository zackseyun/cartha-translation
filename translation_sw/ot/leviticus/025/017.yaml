  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: sw
  text: Mtu yeyote asimdhulumu mwenzake[a], bali umche Mungu wako, kwa maana mimi ni Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asimtendee isivyo haki” au “asimnyonye.” Kitenzi cha Kiebrania kinaweza kumaanisha kujinufaisha isivyo haki kwa hasara ya mwingine katika mahusiano ya kijamii au shughuli za kiuchumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: asimdhulumu
  rationale: Katika muktadha huu wa sheria na shughuli za kiuchumi, kitenzi kina maana ya kumtendea mwingine isivyo haki au kujinufaisha kwa hasara yake. “Kudhulumu” huhifadhi uzito na upana huo.
- source_word: אִישׁ אֶת־עֲמִיתוֹ
  choice: Mtu yeyote kati yenu ... mwenzake
  rationale: 'Muundo wa Kiebrania una nguvu ya ugawaji: kila mmoja asimdhulumu mwenzake. Kiswahili cha sasa hueleza jambo hilo kwa kawaida kwa “mtu yeyote ... mwenzake,” bila kudokeza kuwa amri inawahusu wanaume pekee.'
- source_word: וְיָרֵאתָ
  choice: bali umche
  rationale: Kiunganishi ni “na” kimuundo, lakini hapa kinaonyesha tofauti kati ya kumdhulumu mwenzako na kumcha Mungu; “bali” huonyesha uhusiano huo kwa uwazi. Umbo la umoja “umche” linahifadhi mabadiliko ya Kiebrania kutoka kwa kundi kwenda kwa mtu mmoja mmoja.
- source_word: מֵאֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Baada ya kitenzi “kuogopa/kucha,” kihusishi cha Kiebrania hutambulisha yule anayeogopwa. Kiswahili husema kwa kawaida “umche Mungu wako.”
- source_word: כִּי
  choice: kwa maana
  rationale: 'Huhifadhi sababu inayotolewa kwa amri: utambulisho na mamlaka ya Mungu wa Israeli.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi badala ya kubadilishwa na cheo kama “Bwana.”
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Kiambishi cha Kiebrania ni cha wingi na hulielekezea jumuiya nzima; “wenu” huhifadhi wingi huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Bwana au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya ugawaji ya אִישׁ
  choice: Mtu yeyote kati yenu
  alternative: Mwanaume yeyote kati yenu
  rationale: Ingawa nomino ya Kiebrania ina umbo la kiume, hapa inafanya kazi kisheria kwa maana ya kila mshiriki wa jumuiya. “Mtu yeyote” ni Kiswahili cha kawaida na hakibadili amri kuwa inayowahusu wanaume pekee.
- issue: Mabadiliko ya idadi katika hotuba
  choice: kati yenu ... umche Mungu wako ... Mungu wenu
  alternative: msimdhulumu ... mcheni Mungu wenu
  rationale: Kiebrania huanza kwa wingi, humwelekezea mtu mmoja mmoja kwa umoja, kisha hurudi kwa wingi katika kauli ya agano. Tafsiri imehifadhi mvutano huo wa kisarufi kadiri Kiswahili kinavyoruhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Kudhulumu” limetumiwa kwa maana pana ya kutenda isivyo haki au kutumia vibaya mwingine; tanbihi huhifadhi mbadala za kileksika. Mabadiliko ya umoja na wingi katika chanzo yamehifadhiwa bila kufanya sentensi iwe ngumu.
