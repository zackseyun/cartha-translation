review_pass:
  verdict: revise
  source_fidelity: The main agricultural prohibitions and the distinction between reaping grain growth and gathering grapes are preserved. However, the opening unnecessarily turns יוֹבֵל ('Jubilee') into 'Mwaka wa Yubile' and then repeats 'mwaka'; 'kwenu' more directly represents לָכֶם than 'kwa ajili yenu.'
  naturalness: The revision gives the opening a more idiomatic, concise legal form in Standard East African Swahili. It also corrects the agreement of the relative verb with the plural noun 'mizabibu.'
  terminology: '''Yubile,'' ''mimea ... iliyoota yenyewe,'' ''vuna,'' and ''chuma zabibu'' are appropriate. ''Mizabibu ... iliyopogolewa'' accurately conveys the untended/unpruned viticultural sense in context without importing a doctrinal interpretation.'
  issues:
  - severity: medium
    issue: Opening wording redundantly renders Jubilee as a year and uses an overly purposive dative.
    rationale: יוֹבֵל is predicated first ('It is a Jubilee'), followed by 'the fiftieth year shall be for you.' 'Ni Yubile; mwaka wa hamsini utakuwa kwenu' retains this structure and avoids suggesting merely that the year is for the people's benefit.
  - severity: low
    issue: Relative agreement in 'mizabibu yake isiyopogolewa' is nonstandard.
    rationale: '''Mizabibu'' is plural (class 4); the relative form should be ''iliyopogolewa.'''
  revised_text: Ni Yubile; mwaka wa hamsini utakuwa kwenu. Msipande wala msivune mimea yake iliyoota yenyewe,[a] wala msichume zabibu za mizabibu yake iliyopogolewa.[b]
  revised_footnotes:
