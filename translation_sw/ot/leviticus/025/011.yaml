source:
  edition: WLC
  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: sw
  text: Ni Yubile; mwaka wa hamsini utakuwa kwenu. Msipande wala msivune mimea yake iliyoota yenyewe,[a] wala msichume zabibu za mizabibu yake iliyopogolewa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mazao yake yaliyojiotea.”
    reason: lexical_alternative
  - marker: b
    text: Au, “zabibu zake zilizoachwa bila kutunzwa”; neno la Kiebrania linahusu ukuaji wa mizabibu ulioachwa bila kupogolewa au kutunzwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹבֵל
  choice: Mwaka wa Yubile
  rationale: Katika muktadha wa Mambo ya Walawi 25, neno hili linataja mwaka maalumu uliowekwa, si pembe ya kondoo dume. Jina lililozoeleka la taasisi hiyo limetumiwa.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: mwaka huo wa hamsini
  rationale: Hii ni Kiswahili cha kawaida kinachotambulisha Yubile kuwa mwaka wa hamsini.
- source_word: תִּהְיֶה לָכֶם
  choice: utakuwa kwa ajili yenu
  rationale: Inahifadhi maana ya Kiebrania ya mwaka huo kuwa na hadhi hii kwa watu, bila kuongeza ufafanuzi usiotajwa.
- source_word: לֹא תִזְרָעוּ
  choice: Msipande
  rationale: Hii ni namna ya kawaida na yenye hadhi ya kutoa katazo kwa wingi katika Kiswahili.
- source_word: לֹא תִקְצְרוּ
  choice: wala msivune
  rationale: Kitenzi hiki kinahifadhi tendo la kuvuna mazao ya shambani na kulitofautisha na kuchuma zabibu katika kishazi kinachofuata.
- source_word: סְפִיחֶיהָ
  choice: mimea yake iliyoota yenyewe
  rationale: Neno linamaanisha mazao au mimea inayomea yenyewe bila kupandwa. Usemi huu unaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: לֹא תִבְצְרוּ
  choice: wala msichume
  rationale: Kitenzi cha Kiebrania kinahusu hasa kuvuna zabibu; ‘kuchuma’ ni cha kawaida na kinatofautisha tendo hili na kuvuna mazao ya shambani.
- source_word: נְזִרֶיהָ
  choice: zabibu za mizabibu yake isiyopogolewa
  rationale: Katika muktadha huu wa kilimo, neno linaelekea kutaja ukuaji wa mzabibu ulioachwa bila kutunzwa au kupogolewa. Kutaja zabibu kunafanya kitu kinachochumwa kiwe wazi bila kuficha taswira ya mizabibu isiyopogolewa.
