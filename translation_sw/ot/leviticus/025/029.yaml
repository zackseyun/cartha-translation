  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: sw
  text: Mtu akiuza nyumba ya makazi katika mji wenye ukuta, atakuwa na haki ya kuikomboa hadi mwaka mmoja kamili tangu iuzwe utimie; haki hiyo ya kuikomboa itadumu mwaka mmoja kamili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “siku”; katika nahau hii ya kisheria, neno hilo humaanisha kipindi cha mwaka mmoja kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Mtu aki-
  rationale: Katika sheria ya kutoa kisa, כִּי huanzisha sharti, na אִישׁ humaanisha mtu wa kiume anayewakilisha mhusika wa kisheria. Muundo wa Kiswahili “Mtu akiuza” ni wa kawaida na wazi.
- source_word: יִמְכֹּר
  choice: akiuza
  rationale: Kitenzi kisichotimilika katika sharti la kisheria kimetafsiriwa kwa muundo wa hali ya masharti “akiuza.”
- source_word: בֵּית מוֹשַׁב
  choice: nyumba ya kuishi
  rationale: Muundo huu unaonyesha kwamba ni nyumba inayotumiwa kama makao, na unahifadhi tofauti yake na jengo la aina nyingine.
- source_word: עִיר חוֹמָה
  choice: mji wenye ukuta
  rationale: Kirai hiki humaanisha mji unaozungukwa au kutambulishwa kwa ukuta; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: anaweza kuikomboa
  rationale: Katika muktadha huu גְּאֻלָּה ni uwezekano au haki ya kununua tena mali iliyouzwa. Muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko nomino dhahania “ukombozi,” huku ukidumisha maana ya kisheria.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: mpaka mwaka mmoja kamili tangu ilipouzwa utimie
  rationale: Maana ni mwaka mzima unaohesabiwa tangu mauzo, si mwisho wa mwaka wa kalenda.
- source_word: יָמִים
  choice: kwa muda wa siku, yaani, mwaka mmoja kamili
  rationale: Neno hili kihalisi ni “siku,” lakini katika nahau hii ya kisheria linaonyesha kipindi cha mwaka mzima. Tafsiri inadumisha neno la chanzo na kulifafanua katika sentensi.
- source_word: תִּהְיֶה גְאֻלָּתוֹ
  choice: haki ya kuikomboa itadumu
  rationale: Kauli hii inasisitiza muda ambao haki ya kukomboa nyumba inaendelea kuwapo; “itadumu” huonyesha nguvu hiyo ya wakati kwa uwazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya lugha ya sheria. “Kuikomboa” hapa ina maana ya kununua tena nyumba iliyouzwa. Urudiaji wa haki ya kukomboa umehifadhiwa ili kufuata msisitizo na muundo wa chanzo.
