base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: sw
  text: Kadiri idadi ya miaka ilivyo mikubwa, ndivyo utakavyoongeza bei ya ununuzi; na kadiri idadi ya miaka ilivyo midogo, ndivyo utakavyoipunguza bei hiyo, kwa kuwa anachokuuzia ni idadi ya mavuno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mazao.” Neno la Kiebrania תְּבוּאוֹת linaweza kutafsiriwa “mazao,” “mavuno,” au “mazao ya shambani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי
  choice: kadiri
  rationale: Nahau hii huonyesha uwiano au ulinganifu. “Kadiri” ni Kiswahili cha kawaida kinachoonyesha kuwa bei inategemea idadi ya miaka.
- source_word: רֹב הַשָּׁנִים / מְעֹט הַשָּׁנִים
  choice: miaka ilivyo mingi / miaka ilivyo michache
  rationale: Maneno haya yanatofautisha idadi kubwa na ndogo ya miaka; muundo sambamba umehifadhiwa kwa Kiswahili cha asili.
- source_word: תַּרְבֶּה / תַּמְעִיט
  choice: utaongeza / utaipunguza
  rationale: Vitenzi vya Kiebrania vina maana ya kufanya iwe nyingi au chache. Katika muktadha wa biashara, “ongeza” na “punguza” vinaeleza wazi marekebisho ya bei.
- source_word: מִקְנָתוֹ
  choice: bei utakayomlipa
  rationale: Neno linaweza kumaanisha kitu kilichonunuliwa, ununuzi, au bei ya ununuzi. Muktadha wa kuhesabu thamani kwa miaka na mavuno unaunga mkono maana ya bei; kauli hii ya Kiswahili inaonyesha kwa kawaida kuwa ni bei anayolipwa muuzaji.
- source_word: מִסְפַּר תְּבוּאֹת
  choice: idadi ya mavuno
  rationale: תְּבוּאוֹת linaweza kumaanisha mazao, mavuno, au mazao yanayopatikana. “Mavuno” linaonyesha kwa uwazi vipindi vya uzalishaji vinavyouzwa katika muktadha huu.
- source_word: הוּא מֹכֵר לָךְ
  choice: anachokuuzia
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba kile kinachouzwa kwa mnunuzi kwa hakika ni idadi ya mavuno, huku ukihifadhi tendo la muuzaji linaloelezwa na kishiriki cha Kiebrania.
