language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: sw
  text: Ikiwa mgeni anayeishi kati yenu akawa na mali za kutosha, naye ndugu yako aliye karibu naye akawa maskini na kujiuza kwa mgeni huyo anayeishi kati yenu, au kwa mmoja wa ukoo wa mgeni huyo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa shina au chipukizi la familia ya mgeni.” Usemi wa Kiebrania ni mgumu; maandishi makuu yametumia maana inayowezekana kwa lugha ya kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: akawa na mali za kutosha
  rationale: Nahau ya Kiebrania, kihalisi ‘mkono ukafikia,’ inaonyesha kwamba uwezo au rasilimali za kifedha zimeongezeka na kuwa za kutosha. Kiswahili hiki kinafikisha maana hiyo kwa lugha ya kawaida bila kuongeza wazo lisilokuwapo katika chanzo.
- source_word: גֵּר וְתוֹשָׁב
  choice: mgeni anayeishi kati yenu
  rationale: Maneno haya kwa pamoja yanamtaja mtu asiye mwenyeji wa Israeli lakini ambaye amekaa katika jamii hiyo. Tafsiri hii huhifadhi hali yake ya kuwa mgeni na ya kuwa mkazi bila urudiaji usio wa kawaida katika Kiswahili.
- source_word: וּמָךְ
  choice: akawa maskini
  rationale: Kitenzi kinaonyesha kushuka na kuingia katika umaskini; ‘akawa maskini’ ni wazi na cha kawaida.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Huhifadhi lugha halisi ya kindugu na uzito wake wa kijamii na kimaadili katika sheria hii.
- source_word: עִמּוֹ
  choice: aliye karibu naye
  rationale: Kirai kinaweka ndugu huyo katika uhusiano wa karibu wa kijamii au kimazingira na mgeni mwenye mali. ‘Aliye karibu naye’ ni cha asili zaidi kuliko ‘pamoja naye’ huku kikiacha aina kamili ya ukaribu bila kufafanuliwa kupita kiasi.
- source_word: וְנִמְכַּר
  choice: na kujiuza
  rationale: Ingawa umbo la Kiebrania linaweza kutafsiriwa ‘akauzwa,’ muktadha wa umaskini na utumishi wa deni unaunga mkono maana ya mtu kujiuza. Kiswahili hiki ni wazi na hakiongezi maelezo ya taasisi hiyo ndani ya mstari.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: kwa mmoja wa ukoo wa mgeni huyo
  rationale: עֵקֶר ni neno gumu linaloweza kuashiria shina, chipukizi, au mtu wa tawi la familia. Tafsiri kuu inatoa maana inayowezekana kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira na utata wa Kiebrania.
theological_decisions:
- issue: Lugha ya kindugu kuhusu Mwisraeli katika sheria ya kijamii
  choice: ndugu yako
  alternative: Mwisraeli mwenzako; jamaa yako
  rationale: ‘Ndugu yako’ huhifadhi lugha ya agano na nguvu ya wajibu wa kifamilia badala ya kuifanya kuwa istilahi ya kiraia tu.
- issue: Aina ya uuzaji katika וְנִמְכַּר
  choice: kujiuza
  alternative: kuuzwa
  rationale: Katika muktadha wa Walawi 25, mtu maskini anaingia katika utumishi kwa sababu ya hali yake ya kiuchumi. ‘Kujiuza’ hutoa maana ya kimuktadha, ingawa umbo la Kiebrania lenyewe pia linaweza kusomwa kwa hali ya kutendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umehifadhi uhusiano wa masharti wa Kiebrania. Alama ya tanbihi imewekwa kwenye kirai kigumu inachokifafanua, si baada ya kirai cha mali.
