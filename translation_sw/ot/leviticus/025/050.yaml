  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: sw
  text: Atapiga hesabu pamoja na aliyemnunua, tangu mwaka alipojiuza kwake[a] hadi mwaka wa Yubile. Bei ya kuuzwa kwake itakuwa kulingana na idadi ya miaka; atakuwa pamoja naye kama mfanyakazi wa kuajiriwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangu mwaka alipouzwa kwake.” Kiebrania kinaweza kutafsiriwa kwa muundo wa kutendwa, lakini muktadha unaonyesha kuwa mtu huyo alikuwa amejiuza ili atumikie.
    reason: lexical_alternative
  - marker: b
    text: Kwa ukaribu zaidi, Kiebrania husema, “kama siku za mfanyakazi wa kuajiriwa atakuwa pamoja naye.” Ulinganisho unaonyesha kuwa hesabu ya thamani yake ifanywe kwa msingi wa huduma ya mfanyakazi wa ujira, wala si umiliki wa kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Atapiga hesabu
  rationale: Kitenzi hiki kinamaanisha kufanya hesabu ya kifedha katika muktadha wa kukombolewa. ‘Kupiga hesabu’ ni Kiswahili cha kawaida na wazi chenye maana hiyo.
- source_word: קֹנֵהוּ
  choice: aliyemnunua
  rationale: Kirai hiki humtaja mtu aliyempata kwa ununuzi. Muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko nomino nzito kama ‘mnunuzi wake’.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: kuanzia mwaka alipojiuza kwake
  rationale: Muktadha wa sheria hii unaonyesha kuwa mtu huyo alijiuza ili kutumikia. Tafsiri tendaji yenye ‘alipojiuza’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa muundo wa kutendwa.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: mpaka mwaka wa Yubile
  rationale: ‘Mwaka wa Yubile’ ndilo jina linaloeleweka la taasisi hii ya kisheria na kidini katika Mambo ya Walawi.
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: Bei ya kuuzwa kwake itakuwa
  rationale: כֶּסֶף kwa msingi ni fedha, lakini hapa ni thamani au bei iliyohusika katika kuuzwa kwake. ‘Bei ya kuuzwa kwake’ ni wazi na inahifadhi tabia ya kisheria ya usemi huo.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: kulingana na idadi ya miaka
  rationale: Kirai kinaonyesha kuwa bei inapaswa kuhesabiwa kwa uwiano wa idadi ya miaka.
- source_word: כִּימֵי שָׂכִיר
  choice: kama mfanyakazi wa kuajiriwa
  rationale: שָׂכִיר ni mtu anayefanya kazi kwa ujira. Kiswahili hiki kinaonyesha kwamba huduma yake ilihesabiwa kama ya mfanyakazi wa muda, si umiliki wa kudumu; wazo la ‘siku/muda’ limewasilishwa katika ‘kwa muda huo’.
- source_word: יִהְיֶה עִמּוֹ
  choice: atakuwa kwake
  rationale: Muundo huu unabaki karibu na Kiebrania na unaonyesha hali yake akiwa chini ya yule aliyemnunua, bila kuongeza maelezo yasiyotajwa wazi.
theological_decisions:
- issue: Hali ya mtu aliyeuzwa katika uhusiano na aliyemnunua
  choice: kwa muda huo atakuwa kwake kama mfanyakazi wa kuajiriwa
  alternative: atakuwa pamoja naye kama siku za mfanyakazi wa kuajiriwa
  rationale: Tafsiri iliyochaguliwa inadumisha ulinganisho wa Kiebrania na mfanyakazi wa ujira, bila kuufanya uhusiano huo kuwa umiliki wa kudumu. Pia inaepuka Kiswahili kisicho cha kawaida cha ‘kama siku za’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Atapiga hesabu’ ni usemi wa kawaida lakini unaofaa katika sheria ya kifedha; ‘mfanyakazi wa kuajiriwa’ ni wazi kwa wasomaji wa kawaida. Muundo wa sentensi umewekwa wa kisheria bila kuwa mzito kupita kiasi.
