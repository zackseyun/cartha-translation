  text: Usimkopeshe fedha yako kwa riba[a], wala usimpe chakula chako kwa faida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pesa yako kwa riba.” Neno la Kiebrania linaweza kumaanisha “fedha” au “pesa”; hapa linahusu fedha zinazokopeshwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ongezeko.” Neno la Kiebrania humaanisha ongezeko au faida inayodaiwa juu ya kile kilichotolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: fedha yako
  rationale: כֶּסֶף inaweza kumaanisha fedha kama metali au pesa; katika muktadha huu wa kukopesha, “fedha” ni neno la kawaida na la asili katika Kiswahili kwa pesa zinazokopeshwa.
- source_word: תִתֵּן לוֹ
  choice: usimkopeshe
  rationale: Ingawa נתן kwa kawaida ni “kutoa,” kutolewa kwa fedha pamoja na kutajwa kwa riba kunaonyesha tendo la kukopesha; Kiswahili cha asili huhitaji maana hiyo kuwekwa wazi.
- source_word: בְּנֶשֶׁךְ
  choice: kwa riba
  rationale: נֶשֶׁךְ ni ongezeko linalodaiwa juu ya mkopo. “Kwa riba” ni wazi na halipunguzi maana hadi riba iliyopindukia pekee.
- source_word: וּבְמַרְבִּית
  choice: ili upate faida
  rationale: מַרְבִּית humaanisha ongezeko au faida inayopatikana juu ya kitu kilichotolewa. Kwa chakula, “ili upate faida” huwasilisha kwa Kiswahili cha kawaida kusudi la kudai ziada bila kulazimisha kwamba ni uuzaji wa kawaida.
- source_word: אָכְלֶךָ
  choice: chakula chako
  rationale: אָכֶל humaanisha chakula; tafsiri hii ni ya moja kwa moja na inadumisha taswira halisi ya mahitaji ya maisha.
- source_word: לֹא ... לֹא
  choice: Usim... wala usim...
  rationale: Muundo huu unahifadhi makatazo mawili yaliyoratibiwa na mtindo wa kisheria kwa Kiswahili sanifu.
