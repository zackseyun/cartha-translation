  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: sw
  text: Ikiwa bado kuna miaka mingi, atalipa, kulingana na miaka hiyo, kiasi cha ukombozi wake[a] kutokana na fedha ya ununuzi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atalipa ukombozi wake”—nomino ya Kiebrania inaweza kumaanisha tendo la ukombozi, lakini hapa yaelekea inamaanisha kiasi kinachopaswa kulipwa ili akombolewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Kiunganishi cha kawaida cha sharti kinachoanzisha hali hii katika sheria.
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: bado imebaki miaka mingi
  rationale: 'Kitenzi ‘imebaki’ kinaeleza kwa Kiswahili cha kawaida maana inayodokezwa na muundo wa Kiebrania: miaka mingi bado ipo kabla ya muda kutimia.'
- source_word: לְפִיהֶן
  choice: kulingana na miaka hiyo
  rationale: Nahau ya Kiebrania, kihalisi ‘kwa kinywa chayo,’ humaanisha kwa kadiri au kwa uwiano wa miaka iliyotajwa.
- source_word: יָשִׁיב
  choice: atalipa
  rationale: Hifili ya שוב katika muktadha huu wa kifedha humaanisha kurudisha malipo; ‘atalipa’ ni ya asili na wazi kwa Kiswahili.
- source_word: גְּאֻלָּתוֹ
  choice: gharama ya ukombozi wake
  rationale: Nomino inaweza kumaanisha tendo la kukomboa, lakini hapa inaelekea kutaja kiasi kinacholipwa ili mtu akombolewe.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: kutoka katika fedha aliyolipiwa aliponunuliwa
  rationale: Hufafanua kwa uwazi kwamba hesabu ya malipo ya ukombozi inatokana na bei ya awali iliyolipwa wakati wa ununuzi.
