base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: sw
  text: Ndipo atatoka kwako, yeye na wanawe pamoja naye; naye atarudi kwa ukoo wake[a], na atarudi kwenye milki ya baba zake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “familia yake”; neno la Kiebrania linaweza kumaanisha kundi pana la jamaa au ukoo.
    reason: lexical_alternative
  - marker: b
    text: Au, “mali ya baba zake” au “mali ya mababu zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: wataondoka
  rationale: Katika muktadha huu wa sheria, kitenzi kinaeleza kuondoka kwake katika nyumba au utumishi wa mwenyeji. ‘Wataondoka’ ni Kiswahili cha kawaida kinachohifadhi tendo halisi bila kuongeza moja kwa moja neno la kitaalamu ‘kuachiliwa.’ Umoja wa kitenzi cha Kiebrania unaongozwa na mwanamume huyo, lakini Kiswahili hutumia wingi kwa kiima ‘yeye na wanawe.’
- source_word: מֵעִמָּךְ
  choice: kwako
  rationale: Hili linaonyesha kuondoka kutoka kwa mtu anayemtumikia au katika kaya yake. ‘Kwako’ ni ya asili katika Kiswahili na haifafanui zaidi ya maneno ya Kiebrania kwa kusema ‘katika utumishi wako.’
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: yeye na wanawe walio pamoja naye
  rationale: Huhifadhi mhusika mkuu na wanawe wanaoandamana naye. ‘Wanawe’ ni usemi wa kawaida wa Kiswahili kwa wana wa mtu katika muktadha huu, bila kuleta uzito usio wa kawaida wa ‘wanawe wa kiume.’
- source_word: וְשָׁב ... יָשׁוּב
  choice: atarudi ... atarudi
  rationale: Kurudia kitenzi ‘atarudi’ kunahifadhi msisitizo wa Kiebrania kuhusu kurejeshwa kwa mtu huyo kwa ukoo na urithi wake.
- source_word: מִשְׁפַּחְתּוֹ
  choice: ukoo wake
  rationale: Katika mazingira ya kijamii na umiliki wa ardhi, neno hili linaweza kumaanisha kundi pana la jamaa kuliko familia ya nyumbani; ‘ukoo’ linafaa kwa muktadha huo.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: mali ya urithi ya baba zake
  rationale: Neno אֲחֻזָּה humaanisha milki au shamba linaloshikiliwa kama urithi. Tafsiri hii inaeleweka kwa wasomaji wa sasa, inaonyesha tabia yake ya kurithiwa, na ‘baba zake’ huhifadhi lugha ya ukoo wa upande wa kiume.
theological_decisions:
- issue: Lugha ya ukoo wa kiume
  choice: wanawe ... baba zake
  alternative: watoto wake ... mababu zake
  rationale: Kiebrania kimetumia maumbo ya kiume waziwazi katika muktadha wa urithi wa kifamilia; tafsiri haibadili hayo kuwa lugha isiyoonyesha jinsia.
- issue: Nguvu ya kisheria ya kuondoka wakati wa Yubile
  choice: wataondoka kwako
  alternative: wataachiliwa kutoka katika utumishi wako
  rationale: Muktadha unaonyesha kuachiliwa kutoka utumishi wa deni, lakini kitenzi chenyewe ni ‘kutoka/kuondoka.’ Tafsiri inadumisha taswira hiyo na kuacha maana ya kisheria ionekane katika muktadha.
- issue: Kurudi kwa ukoo na kwenye urithi
  choice: atarudi ... na atarudi
  alternative: atarudi kwa ukoo wake na kwenye mali ya urithi
  rationale: Kiebrania kinarudia mzizi שׁוב. Kurudia huko kunasisitiza marejesho ya uhusiano wa kifamilia na milki ya urithi, kwa hiyo kumehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida, huku marudio ya Kiebrania yakihifadhiwa kwa sababu yana uzito wa kimaana. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
