  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: sw
  text: Ikiwa ndugu yako atakuwa maskini na uwezo wake wa kujikimu ukidhoofika akiwa pamoja nawe,[a] utamtegemeza, ili aishi pamoja nawe kama mgeni mkazi au mkazi wa muda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “mkono wake ukilegea pamoja nawe”; hii ni nahau ya kupoteza uwezo au njia za kujitegemeza.
    reason: lexical_alternative
  - marker: b
    text: Au, “utamtegemeza—mgeni mkazi na mkazi wa muda—ili aishi pamoja nawe.” Maneno ya Kiebrania yanayomaanisha “mgeni mkazi na mkazi wa muda” yamebanwa kisintaksia na yanaweza kuhusishwa na sentensi kwa njia tofauti.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Ikiwa
  rationale: Hutanguliza hali ya masharti katika sheria; “ikiwa” ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: יָמוּךְ
  choice: atakuwa maskini
  rationale: Kitenzi kinaonyesha kushuka kwa hali ya kiuchumi au kupungukiwa na mali.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Huhifadhi istilahi halisi ya undugu, ambayo katika muktadha huu humaanisha mwanajumuiya mwenzake.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: uwezo wake wa kujikimu ukidhoofika akiwa pamoja nawe
  rationale: Hufikisha maana ya nahau kuhusu kupoteza uwezo wa kujitegemeza, huku wazo la kuwa katika jumuiya pamoja na msikilizaji likidumishwa.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: utamtegemeza
  rationale: Hifili ya חזק hapa huagiza kumshikilia au kumsaidia mwenye mahitaji; “tegemeza” inafaa kwa msaada wa kiuchumi na kijamii.
- source_word: גֵּר
  choice: mgeni mkazi
  rationale: Humaanisha mtu asiye mzawa anayeishi katika jamii; tafsiri hii huhifadhi hadhi yake ya kisheria na kijamii.
- source_word: וְתוֹשָׁב
  choice: mkazi wa muda
  rationale: Humaanisha mkazi mwenye hadhi isiyo ya kudumu au iliyo ya chini zaidi, na hutofautishwa na גֵּר.
- source_word: וָחַי עִמָּךְ
  choice: ili aendelee kuishi pamoja nawe
  rationale: Hutoa kwa Kiswahili cha kawaida matokeo au kusudi la kumtegemeza, na huhifadhi wazo la kubaki ndani ya jamii.
theological_decisions:
- issue: Upeo wa neno “ndugu yako”
  choice: Kudumisha “ndugu yako” kama lugha ya undugu ya chanzo.
  alternative: Mwisraeli mwenzako; mtu wa jamii yako
  rationale: Muktadha unahusu wajibu kwa mwanajumuiya aliye katika shida, lakini tafsiri haibadili picha ya undugu kuwa ufafanuzi wa moja kwa moja.
- issue: Kazi ya kisintaksia ya גֵּר וְתוֹשָׁב
  choice: 'Kulihusisha na namna au hadhi ambayo ndugu huyo anaendelea kuishi pamoja na msikilizaji: “kama mgeni mkazi au mkazi wa muda.”'
  alternative: 'Kulichukua kuwa kitu cha ziada cha kitenzi: “utamtegemeza—mgeni mkazi na mkazi wa muda.”'
  rationale: Kiebrania kimebanwa kisintaksia na kinaweza kueleweka kwa njia zaidi ya moja. Matini kuu inafuata uhusiano unaosomika kwa urahisi, na tanbihi huhifadhi uwezekano mwingine.
- issue: Uhusiano wa וָחַי na amri iliyotangulia
  choice: “ili aendelee kuishi” kama kusudi au matokeo ya msaada.
  alternative: “naye ataishi” kama kauli inayofuata
  rationale: Muundo unaweza kuonyesha matokeo yanayokusudiwa bila kuondoa kabisa nguvu ya kauli ya kwamba ataishi ndani ya jamii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kujikimu” na “tegemeza” ni maneno yanayoeleweka katika muktadha wa msaada wa kiuchumi; muundo huepuka lugha ya kizamani na huhifadhi utata wa kirai cha mwisho kwa tanbihi.
