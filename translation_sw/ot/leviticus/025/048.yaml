  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: sw
  text: Baada ya kuuzwa, atakuwa na haki ya kukombolewa; mmoja wa ndugu zake anaweza kumkomboa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: Baada ya kuuzwa
  rationale: Kirai hiki cha wakati kinaonyesha kuwa masharti yanayofuata yanatumika baada ya tendo la kuuzwa; Kiswahili hakihitaji kutaja kiwakilishi cha mtendwa hapa kwa kuwa muktadha unamdhihirisha.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: atakuwa na haki ya kukombolewa
  rationale: Muundo wa nomino pamoja na kitenzi cha kuwapo unamaanisha kwamba ukombozi unabaki kuwa haki au fursa yake. Tafsiri hii inalinda muundo wa kisheria na maana ya ukombozi kuliko kauli isiyo dhahiri ya uwezekano pekee.
- source_word: אֶחָד מֵאֶחָיו
  choice: mmoja wa ndugu zake
  rationale: Hufuata kwa karibu maana halisi ya ‘mmoja kutoka miongoni mwa ndugu zake’; ‘ndugu’ katika Kiswahili inaweza kutegemea muktadha, lakini hapa mfuatano wa sheria unataja jamaa wa kiume wanaoweza kutekeleza ukombozi.
- source_word: יִגְאָלֶנּוּ
  choice: anaweza kumkomboa
  rationale: Kitenzi גאל ni neno la kawaida la ukombozi unaofanywa na jamaa. ‘Kumkomboa’ huhifadhi maana yake ya kisheria, na ‘anaweza’ huonyesha ruhusa au uwezekano unaotolewa na sheria.
theological_decisions:
- issue: Uhusiano unaomaanishwa na אֶחָיו
  choice: ndugu zake
  alternative: jamaa zake
  rationale: Maandishi ya Kiebrania yanasema kihalisi ‘ndugu zake’ na mazingira ya kisheria yanamhusu jamaa wa kiume mwenye jukumu la ukombozi. Tafsiri kuu haiupanui kimyakimya kuwa jamaa wote.
- issue: Nguvu ya kisheria ya גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: atakuwa na haki ya kukombolewa
  alternative: anaweza kukombolewa
  rationale: Chaguo kuu linaonyesha wazi kwamba kifungu kinahakikisha upatikanaji wa ukombozi kwake, bila kudai kwamba ukombozi lazima utekelezwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayofaa kifungu cha sheria. Hakuna tanbihi iliyohitajika kwa sababu ‘ndugu zake’ huhifadhi neno la chanzo bila kulipanua.
