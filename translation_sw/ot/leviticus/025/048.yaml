  verdict: approve
  source_fidelity: “Baada ya kuuzwa” accurately renders אַחֲרֵי נִמְכַּר. “Atakuwa na haki ya kukombolewa” appropriately conveys the legal availability/entitlement expressed by גְּאֻלָּה תִּהְיֶה לּוֹ without asserting that redemption will inevitably occur. “Mmoja wa ndugu zake anaweza kumkomboa” retains the singular male kin term and the legal-permissive force of יִגְאָלֶנּוּ.
  naturalness: The wording is clear, idiomatic Standard East African Swahili, and maintains an appropriately formal legal register. The passive temporal phrase is natural and its omitted referential pronoun is fully recoverable from context.
  terminology: “Kukombolewa/kumkomboa” is the appropriate established term for גאל in this legal-kinship setting. “Ndugu zake” closely represents the Hebrew wording; “mmoja” makes the individual redeemer explicitly male in Swahili grammar, without broadening the main text to all relatives.
