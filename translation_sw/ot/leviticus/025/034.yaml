  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: sw
  text: Lakini shamba la malisho[a] ya miji yao halipaswi kuuzwa, kwa maana ni milki yao ya kudumu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ardhi ya pamoja” au “eneo la wazi.” Neno la Kiebrania מִגְרָשׁ linamaanisha ardhi iliyouzunguka mji wa Walawi.
    reason: lexical_alternative
  - marker: b
    text: Au “milki ya milele.” Neno la Kiebrania עוֹלָם linaweza kumaanisha hali ya kudumu; hapa linaonyesha hadhi ya ardhi hiyo kuwa milki isiyopaswa kuuzwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה
  choice: Lakini shamba
  rationale: שָׂדֶה ni ‘shamba’ au eneo la ardhi. Kiunganishi וּ kimetafsiriwa ‘Lakini’ ili kuonyesha tofauti na ruhusa iliyotangulia kuhusu nyumba katika miji ya Walawi.
- source_word: מִגְרַשׁ
  choice: la malisho
  rationale: מִגְרָשׁ hapa ni eneo la wazi lililouzunguka mji, hasa lililotumiwa kwa malisho. ‘Malisho’ ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: עָרֵיהֶם
  choice: la miji yao
  rationale: Huhifadhi uhusiano wa umilikaji katika mfuatano wa maneno ya Kiebrania, yaani shamba la eneo la malisho linalohusiana na miji yao.
- source_word: לֹא יִמָּכֵר
  choice: halipaswi kuuzwa
  rationale: Kauli tendwa ya מכר ina maana ya ‘kuuzwa’; ‘halipaswi kuuzwa’ huwasilisha katazo la kisheria kwa Kiswahili cha sasa bila mtindo mzito wa kizamani.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inaleta sababu ya katazo.
- source_word: אֲחֻזַּת עוֹלָם
  choice: milki yao ya kudumu
  rationale: אֲחֻזָּה ni milki au sehemu ya ardhi inayoshikiliwa, na עוֹלָם hapa inaonyesha hali ya kudumu na kutohamishika katika sheria hii.
- source_word: הוּא לָהֶם
  choice: ni milki yao
  rationale: Muundo huu unaonyesha kwamba ardhi hiyo ni mali yao; Kiswahili cha kawaida huieleza kwa ‘ni milki yao.’
theological_decisions:
- issue: Maana ya עוֹלָם katika sheria ya ardhi ya Israeli
  choice: ya kudumu
  alternative: ya milele
  rationale: Katika muktadha huu wa kisheria, עוֹלָם inasisitiza umiliki unaoendelea na usiohamishika. ‘Ya kudumu’ huhifadhi nguvu hiyo bila kulazimisha maana ya umilele usio na mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wazi na wa kisasa. ‘Halipaswi kuuzwa’ linaonyesha katazo la kisheria kwa lugha ya kawaida, huku ‘milki’ likihifadhi maana mahususi ya umiliki wa ardhi.
