  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: sw
  text: Na mkiuza kitu kwa mwenzenu, au mkinunua kutoka kwa mwenzenu, msidhulumiane[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msitendeane isivyo haki”; kitenzi hicho kinaweza kumaanisha kujinufaisha isivyo haki dhidi ya mwingine, hasa katika shughuli za biashara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na mki-
  rationale: Katika sheria hii, וְכִי huanzisha hali ya masharti yenye muunganisho; muundo wa Kiswahili “Na mki-” huwasilisha kwa kawaida maana ya ‘na ikiwa/mtakapofanya’ bila kuifanya iwe tukio la lazima.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: mkiuza kitu
  rationale: Kitenzi na nomino yake hurejelea kuuza kitu au kufanya mauzo. “Mkiuza kitu” ni Kiswahili cha kawaida na huhifadhi jambo linalouzwa bila urudiaji usio wa lazima.
- source_word: לַעֲמִיתֶךָ / עֲמִיתֶךָ
  choice: kwa mwenzenu / kutoka kwa mwenzenu
  rationale: עָמִית ni mshiriki mwenzao katika jamii. “Mwenzenu” ni sahihi kuliko maana pana ya ‘jirani’ na inafaa katika shughuli ya biashara; umoja wa Kiebrania umeelezwa kwa kiwakilishi cha wingi kinacholingana na wahusika wa wingi katika Kiswahili.
- source_word: אוֹ קָנֹה מִיַּד
  choice: au kununua kutoka kwa
  rationale: Infinitivu kamili קָנֹה inaendelea sambamba na kitenzi kilichotangulia. Nahau ya מִיַּד hapa inaonyesha chanzo cha ununuzi; “kutoka kwa” ni ya asili kuliko kutaja ‘mkono’ kwa Kiswahili.
- source_word: אַל תּוֹנוּ
  choice: msidhulumiane
  rationale: Katika muktadha wa biashara, ינה hukataza kumkosea au kumfaidi mwenzako isivyo haki. “Msidhulumiane” huhifadhi uzito wa katazo na wazo la kutendeana isivyo haki.
- source_word: אִישׁ אֶת־אָחִיו
  choice: -ane
  rationale: Nahau ya kugawanya, ‘mtu ndugu yake,’ ina maana ya kutendeana kati ya watu wa jamii. Kiambishi cha kutendeana “-ane” ni cha kawaida katika Kiswahili na huhifadhi nguvu ya kijamii ya katazo bila kulazimisha maana ya ndugu wa damu.
theological_decisions:
- issue: Maneno ya kiume yenye matumizi wakilishi katika אִישׁ אֶת־אָחִיו
  choice: Kutafsiri kwa kitenzi cha kutendeana “msidhulumiane”
  alternative: “mtu asimdhulumu ndugu yake”
  rationale: Kiebrania hutumia muundo wa kiume wa kugawanya, lakini maana yake hapa ni katazo la pande zote ndani ya jamii. Kiswahili cha asili huieleza vyema kwa “-ane”; tafsiri ya ‘ndugu yake’ ingeweza kueleweka kimakosa kuwa ndugu wa damu tu.
- issue: Aina ya kosa linalokatazwa na ינה
  choice: “dhulumu” katika matini, pamoja na ufafanuzi wa kibiashara katika tanbihi
  alternative: “danganya” au “punja”
  rationale: Muktadha unaelekea kwenye kujinufaisha isivyo haki katika biashara, lakini kitenzi kina upana zaidi ya udanganyifu au kupunja bei pekee. “Dhulumu” huhifadhi upana huo huku tanbihi ikibainisha muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi na wenye hadhi. “Mwenzenu” huhifadhi maana ya mshiriki mwenzao katika jamii; “msidhulumiane” ni ya kawaida na huepuka sentensi nzito ya “mtu... ndugu yake.”
