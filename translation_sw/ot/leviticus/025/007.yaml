  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: sw
  text: Na kwa mifugo yako, na kwa wanyama wa porini walio katika nchi yako, mazao yake yote yatakuwa chakula[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavuno yake yote yatakuwa kwa ajili ya kuliwa.” Kwa karibu zaidi, Kiebrania husema, “mazao yake yote yatakuwa kwa ajili ya kuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: kwa mifugo yako
  rationale: Neno בְּהֵמָה hapa linamaanisha kwa ujumla wanyama wanaofugwa na mwenye nchi; “mifugo” ni Kiswahili cha kawaida na linatofautisha kundi hili na wanyama wa porini wanaotajwa baadaye.
- source_word: לַחַיָּה
  choice: wanyama wa porini
  rationale: Katika utofautishaji na mifugo, חַיָּה linarejelea wanyama wasiofugwa. “Wanyama wa porini” ni wazi, halisi, na la kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: walio katika nchi yako
  rationale: Kishazi hiki kinawahusu wanyama wa porini. “Nchi yako” huhifadhi maana pana na halisi ya אֶרֶץ katika mazingira ya kilimo na agano.
- source_word: תִּהְיֶה
  choice: yatakuwa
  rationale: Kitenzi היה hapa kinaonyesha matumizi au hali iliyowekwa kwa mazao; “yatakuwa” huhifadhi mtindo wa agizo na hali ya baadaye bila kuongeza wazo la umiliki.
- source_word: כָּל תְּבוּאָתָהּ
  choice: mazao yake yote
  rationale: תְּבוּאָה ni mazao au mavuno ya nchi, na kiambishi cha kike kinarejelea nchi. “Mazao yake yote” ni cha kawaida na kinafaa muktadha wa mwaka wa sabato.
- source_word: לֶאֱכֹל
  choice: chakula
  rationale: Muundo wa ל pamoja na kitenzi-jina unaonyesha kusudi au matumizi. “Yatakuwa chakula” ni Kiswahili asilia kinachowasilisha maana ya “kwa ajili ya kuliwa” bila uzito usio wa lazima.
