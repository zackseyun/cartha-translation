  terminology: “Yubile” inafaa. “Kukomboa” na “mali ya urithi” zinafaa katika muktadha wa sheria ya ardhi. Tanbihi imerekebishwa ili usomaji mbadala useme kwa kawaida kwamba mali yenyewe ndiyo inaweza kuwa mhusika wa kitenzi cha mwisho.
