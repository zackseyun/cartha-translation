base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: sw
  text: Lakini ikiwa hana uwezo wa kupata kiasi cha kutosha cha kuikomboa, basi mali aliyouza itabaki mikononi mwa aliyenunua mpaka mwaka wa Yubile. Itatoka wakati wa Yubile, naye muuzaji atarudi kwenye mali yake ya urithi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nayo itarudi katika milki yake.” Kitenzi cha mwisho cha Kiebrania kinaweza kueleweka kuwa mali iliyouzwa ndiyo mhusika, badala ya muuzaji.
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  choice: hana uwezo wa kupata
  rationale: Nahau ya Kiebrania, kihalisi ‘mkono wake haujapata,’ humaanisha kukosa uwezo au mali ya kutosha. Kiswahili hiki ni cha kawaida na kinafikisha maana bila kuleta taswira isiyoeleweka.
- source_word: דֵּי
  choice: kiasi cha kutosha
  rationale: Neno hilo huonyesha utoshelevu wa kiasi kinachohitajika katika ukombozi wa ardhi.
- source_word: הָשִׁיב לוֹ
  choice: ili kumrudishia mnunuzi
  rationale: Katika muktadha huu, kinachorudishwa kwa mnunuzi ni kiasi cha fedha kinachodaiwa ili mali ikombolewe. Kumtaja mnunuzi kunaondoa utata wa kiwakilishi katika Kiswahili bila kubadili tendo la kurudisha.
- source_word: מִמְכָּרוֹ
  choice: alichouza
  rationale: Nomino inaweza kumaanisha tendo la kuuza au kitu kilichouzwa; muktadha unaonyesha kuwa hapa ni mali iliyouzwa.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: mikononi mwa aliyekinunua
  rationale: Huhifadhi kwa njia ya kawaida ya Kiswahili nahau ya Kiebrania ya kuwa ‘mkononi’ mwa mtu, yaani chini ya umiliki au mamlaka yake.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: mwaka wa Yubile
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya kipindi hiki maalumu cha kisheria.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: Kitatoka mikononi mwake wakati wa Yubile
  rationale: Kitenzi יצא kimehifadhiwa kwa maana ya ‘kutoka,’ huku kirai ‘mikononi mwake’ kikifanya mwelekeo wa tendo uwe wazi katika Kiswahili.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: naye muuzaji atarudi kwenye milki yake
  rationale: Kitenzi cha umoja wa kiume kinaweza kumrejelea muuzaji; ‘milki’ hapa ni mali ya kudumu au urithi wa ardhi, si umiliki wa jumla tu.
theological_decisions:
- issue: Mhusika wa kitenzi cha mwisho וְשָׁב
  choice: 'Muuzaji ndiye mhusika: ‘naye muuzaji atarudi kwenye milki yake.’'
  alternative: 'Mali iliyouzwa ndiyo mhusika: ‘nayo itarudi kuwa milki yake.’'
  rationale: Sarufi ya Kiebrania inaruhusu marejeo kwa muuzaji au kwa mali iliyouzwa, kwa kuwa zote zinaweza kuwakilishwa kwa umoja wa kiume. Muktadha wa sheria za Yubile unapendelea muuzaji kurudi kwenye milki yake, lakini usomaji mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifungu cha sheria. Nahau zisizo za kawaida zimefafanuliwa kwa ulinganifu bora, huku taswira ya ‘mikononi mwa’ ikihifadhiwa kwa kuwa inaeleweka vizuri katika Kiswahili.
