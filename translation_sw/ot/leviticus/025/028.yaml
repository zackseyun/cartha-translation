revisions:
- from: Lakini ikiwa hana uwezo wa kupata kiasi cha kutosha ili kumrudishia mnunuzi, basi alichouza kitabaki mikononi mwa aliyekinunua mpaka mwaka wa Yubile. Kitatoka mikononi mwake wakati wa Yubile, naye muuzaji atarudi kwenye milki yake.[a]
  to: Lakini ikiwa hana uwezo wa kupata kiasi cha kutosha cha kuikomboa, basi mali aliyouza itabaki mikononi mwa aliyenunua mpaka mwaka wa Yubile. Itatoka wakati wa Yubile, naye muuzaji atarudi kwenye mali yake ya urithi.[a]
  rationale: Urekebishaji unaondoa uelekezaji usio sahihi wa tendo la “kurudisha” kwa mnunuzi na kutumia “kuikomboa,” istilahi iliyo wazi katika muktadha wa aya. Pia umebainisha אֲחֻזָּה kama mali ya urithi, huku ukidumisha usomaji mkuu kwamba muuzaji anarudi na kuhifadhi usomaji mbadala katika tanbihi.
