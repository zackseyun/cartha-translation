base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: sw
  text: au ndugu wa kiume wa mzazi wake, au mwana wa ndugu huyo[a], anaweza kumkomboa; au mmoja wa jamaa wa karibu katika ukoo wake anaweza kumkomboa; au akipata uwezo wa kutosha[b], anaweza kujikomboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, binamu yake. Kihalisi, “mwana wa ndugu wa kiume wa mzazi wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akipata mali ya kutosha.” Kihalisi, “mkono wake ukifikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  choice: ndugu wa kiume wa baba yake au mama yake
  rationale: Neno la Kiebrania linamtaja mjomba au ami. Usemi huu wa Kiswahili huepuka kulifanya lihusu upande mmoja tu wa familia.
- source_word: בֶן דֹּדוֹ
  choice: mwana wa ndugu huyo
  rationale: Huhifadhi kwa njia ya kawaida uhusiano halisi wa Kiebrania, ‘mwana wa mjomba/ami wake,’ yaani binamu yake.
- source_word: יִגְאָלֶנּוּ
  choice: anaweza kumkomboa
  rationale: Mzizi גאל hapa unahusu ukombozi wa mtu unaofanywa na jamaa. ‘Kumkomboa’ hudumisha msamiati wa ukombozi, na ‘anaweza’ huonyesha ruhusa au uwezekano wa kisheria.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: mmoja wa jamaa zake wa karibu
  rationale: Nahau ya Kiebrania, kihalisi inayohusisha ‘mwili’ wake, humaanisha jamaa wa karibu wa damu; Kiswahili hiki ni cha kawaida bila kupoteza ukaribu wa kindugu.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: wa ukoo wake
  rationale: מִשְׁפָּחָה katika sheria hii ni kundi pana la kindugu, hivyo ‘ukoo’ linafaa kuliko ‘familia’ ya nyumbani pekee.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: akipata uwezo wa kutosha
  rationale: Nahau hiyo humaanisha kupata mali au uwezo unaotosha. Tafsiri hii ni ya asili katika Kiswahili, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: וְנִגְאָל
  choice: anaweza kujikomboa mwenyewe
  rationale: Ingawa umbo la Kiebrania ni la kutendwa, muktadha unaonyesha kwamba mtu huyo akipata uwezo anaweza kulipia ukombozi wake mwenyewe.
theological_decisions:
- issue: Istilahi ya ukombozi wa kijamaa
  choice: Kutumia ‘komboa’ kwa גאל katika sheria hii.
  alternative: nunua ili kumrudisha / mtoe utumwani
  rationale: ‘Komboa’ huhifadhi uhusiano wa kimsamiati na dhana ya ukombozi katika sura nzima bila kuifanya kuwa shughuli ya kibiashara tu.
- issue: Nahau הִשִּׂיגָה יָדוֹ
  choice: Kutafsiri maana yake katika maandishi na kuweka taswira ya ‘mkono’ katika tanbihi.
  alternative: ikiwa mkono wake umefikia / umefanikiwa
  rationale: Tafsiri ya neno kwa neno kuhusu mkono haisikiki kwa kawaida katika Kiswahili na inaweza kuficha maana ya kupata uwezo wa kifedha; tanbihi inalinda taswira ya Kiebrania.
- issue: Utambulisho wa דֹד
  choice: Kutaja ndugu wa kiume wa baba au mama bila kuchagua upande mmoja.
  alternative: mjomba wake / ami yake
  rationale: Kiebrania hakibainishi upande wa baba au mama. Tafsiri pana huhifadhi kutobainishwa huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya jamaa umehifadhiwa; istilahi za upande mmoja kama ‘mjomba’ au ‘ami’ zimeepukwa kwa sababu Kiebrania hakibainishi upande wa familia.
