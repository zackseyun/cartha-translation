base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: sw
  text: Kuhusu mtumwa wako wa kiume na mtumwa wako wa kike watakaokuwa wako[a], kutoka kwa mataifa yanayowazunguka[b]—kutoka kwao mnaweza kununua mtumwa wa kiume na mtumwa wa kike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakaokuwa mali yako.” Kiebrania kinaonyesha wazi uhusiano wa kimiliki.
    reason: lexical_alternative
  - marker: b
    text: “Mataifa” hapa yanamaanisha mataifa yasiyo ya Israeli yanayowazunguka Waisraeli; pia inaweza kutafsiriwa, “kutoka miongoni mwa mataifa yanayowazunguka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ / עֶבֶד
  choice: mtumwa wako wa kiume / mtumwa wa kiume
  rationale: Katika sheria hii mtu huyo ananunuliwa na kuwa mali ya mwingine, kwa hiyo “mtumwa” huonyesha hali ya utumwa kwa uwazi kuliko “mtumishi.” Neno “wa kiume” huhifadhi tofauti na neno la kike linalofuata.
- source_word: אֲמָתְךָ / אָמָה
  choice: mtumwa wako wa kike / mtumwa wa kike
  rationale: Hili ni neno la kike linalooana na עֶבֶד katika muktadha huu. “Mtumwa wa kike” ni Kiswahili cha sasa, wazi, na huhifadhi tofauti ya jinsia iliyomo katika Kiebrania.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: watakaokuwa wako
  rationale: Kauli hii inaeleza kuwa watu hao watakuwa katika umiliki wa anayeambiwa. Tafsiri hii huhifadhi hali ya wakati ujao na maana ya kimiliki bila kuongeza ufafanuzi usiokuwapo katika chanzo.
- source_word: מֵאֵת הַגּוֹיִם
  choice: kutoka kwa mataifa
  rationale: גּוֹיִם hapa ni mataifa au jamii zisizo za Israeli zilizoizunguka Israeli. “Mataifa” ni neno la kawaida lisilobeba maana ya kidhehebu.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: yanayowazunguka
  rationale: Huhifadhi maana ya mahali na wingi wa watu wanaoambiwa, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: מֵהֶם
  choice: kutoka kwao
  rationale: Maneno haya yanarejelea mataifa yanayozunguka kuwa chanzo cha wale wanaonunuliwa, na marudio yake yamehifadhiwa kama katika Kiebrania.
- source_word: תִּקְנוּ
  choice: mnaweza kununua
  rationale: קנה inaweza kumaanisha kununua au kujipatia. Katika sheria hii kauli ni ya ruhusa, si amri ya lazima; kwa hiyo “mnaweza kununua” huonyesha nguvu yake vizuri.
- source_word: עֶבֶד וְאָמָה
  choice: mtumwa wa kiume na mtumwa wa kike
  rationale: Jozi ya umoja ina matumizi ya kijumla na hutaja jinsia zote mbili. Kutaja kila moja wazi huhifadhi muundo na tofauti za Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri istilahi za utumwa katika sheria hii
  choice: Kutumia “mtumwa” badala ya “mtumishi.”
  alternative: mtumishi; mtumishi aliyefungwa
  rationale: Mstari unasema wazi kwamba watu hawa wanaweza kununuliwa kutoka kwa mataifa mengine. Hivyo hali ya kufungwa na kumilikiwa ni sehemu kuu ya maana na haipaswi kufichwa kwa neno laini zaidi.
- issue: Nguvu ya kitenzi תִּקְנוּ katika muktadha
  choice: “mnaweza kununua,” kama ruhusa
  alternative: “mtanunua” au “nunua” kama wajibu/amri
  rationale: Katika mfululizo huu wa sheria, mstari unaruhusu ununuzi kutoka kwa mataifa yanayozunguka badala ya kuamuru kwamba lazima ununuzi ufanyike.
- issue: Mabadiliko ya idadi ya wanaoambiwa
  choice: Kuhifadhi umoja katika “wako” na wingi katika “mnaweza/yanayowazunguka.”
  alternative: 'Kusawazisha mstari wote uwe katika wingi: “wenu... mtakaokuwa nao.”'
  rationale: Kiebrania hubadilika kutoka viambishi vya umoja katika sehemu ya kwanza kwenda viambishi vya wingi baadaye. Tafsiri imehifadhi mabadiliko hayo bila kuyafanya kuwa fundisho au kuyaficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisheria ulio wazi na wenye heshima. “Mtumwa” limetumiwa kwa makusudi ili kutoficha hali ya watu wanaonunuliwa. Muundo wa kurudia “kutoka kwao” na kutaja mtumwa wa kiume na wa kike umehifadhiwa kwa sababu unaakisi msisitizo na mgawanyo wa Kiebrania.
