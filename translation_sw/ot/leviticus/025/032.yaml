  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: sw
  text: Kuhusu miji ya Walawi, Walawi watakuwa daima na haki ya kukomboa nyumba zilizo katika miji ambayo ni milki yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Ukombozi wa daima utakuwa kwa Walawi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי
  choice: Kuhusu miji
  rationale: Kiunganishi pamoja na nomino kinaanzisha suala jipya katika sheria hii. “Kuhusu miji” huonyesha badiliko hilo la mada kwa Kiswahili cha kawaida.
- source_word: הַ/לְוִיִּם
  choice: ya Walawi
  rationale: Muundo wa Kiebrania unaonyesha uhusiano wa umiliki au ushirika kati ya miji na Walawi.
- source_word: בָּתֵּי
  choice: nyumba
  rationale: Nomino hii ndiyo jambo linalohusu haki ya ukombozi, yaani nyumba zilizomo katika miji hiyo.
- source_word: עָרֵי אֲחֻזָּתָם
  choice: katika miji ambayo ni milki yao
  rationale: אֲחֻזָּה ni milki au eneo linaloshikiliwa kisheria, mara nyingi likiwa na dhana ya urithi. Kauli hii ni ya kawaida kwa Kiswahili huku ikihifadhi maana ya kisheria.
- source_word: גְּאֻלַּת
  choice: haki ya kukomboa
  rationale: Nomino “ukombozi,” ikiunganishwa na kitenzi “itakuwa,” hapa inaonyesha fursa au haki ya kisheria ya kurudisha mali kwa malipo.
- source_word: עוֹלָם
  choice: daima
  rationale: Katika muktadha huu wa sheria, neno hili linaonyesha kwamba haki hiyo inaendelea bila kuwekewa kikomo cha kawaida.
- source_word: תִּהְיֶה
  choice: watakuwa na
  rationale: Kitenzi hiki kinaweka masharti ya kisheria. Muundo wa Kiswahili “watakuwa na haki” unaeleza kwa kawaida kwamba haki hiyo imewekwa kwa ajili yao.
- source_word: לַ/לְוִיִּם
  choice: Walawi watakuwa ... na haki
  rationale: Kihusishi ל־ kinaonyesha kwamba haki ya kudumu ya ukombozi ni ya Walawi. Muundo huu huwafanya Walawi kuwa wenye haki hiyo bila kuwafanya kimakosa kuwa watendaji wa lazima katika kila tukio.
theological_decisions:
- issue: Nguvu ya kisheria ya kifungu kuhusu ukombozi wa nyumba za Walawi
  choice: Kifungu kinawapa Walawi haki inayoendelea daima ya kukomboa nyumba katika miji yao.
  alternative: 'Kifungu kinaweza kutafsiriwa kwa muundo wa karibu zaidi na Kiebrania: “Ukombozi wa daima utakuwa kwa Walawi.”'
  rationale: Hili hasa ni suala la kisheria na kileksika. Muundo wa nomino גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם unaeleweka kuwa unaweka haki inayoendelea ya ukombozi, lakini tanbihi inahifadhi muundo rasmi zaidi na kutokubainishwa kabisa kwa neno “haki.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. “Milki” imetumiwa kwa maana yake ya kisheria, na “haki ya kukomboa” inaweka wazi nguvu ya sheria bila kuondoa kabisa muundo mbadala wa Kiebrania, ambao umehifadhiwa katika tanbihi.
