  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: sw
  text: Kisha utapuliza baragumu[a] kwa sauti kuu katika mwezi wa saba, siku ya kumi ya mwezi. Siku ya Upatanisho[b], mtapuliza baragumu katika nchi yenu yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: shofar; yaani, baragumu ya pembe, ambayo kijadi mara nyingi hueleweka kuwa pembe ya kondoo dume.'
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, jina hili ni 'siku ya upatanisho' kwa umbo la wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: Kisha utaipuliza
  rationale: Hifili ya עבר ina maana ya msingi ya ‘kupitisha’ au ‘kueneza,’ lakini ikiwa na שׁוֹפָר humaanisha kufanya sauti ya pembe isikike. ‘Utaipuliza’ ni Kiswahili cha kawaida kinachoeleza kitendo hicho, na ‘Kisha’ linaonyesha mfuatano wa waw.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: tarumbeta ya pembe kwa mlio mkubwa
  rationale: שׁוֹפַר ni ala ya kupuliza iliyotengenezwa kwa pembe, na תְּרוּעָה hapa ni mlio mkubwa wa ishara. Tafsiri hii ni wazi kwa msomaji wa sasa huku maelezo ya ala yakihifadhiwa katika tanbihi.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: katika mwezi wa saba
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa kishazi cha wakati.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: siku ya kumi ya mwezi huo
  rationale: Nahau ya Kiebrania ni ‘tarehe/siku ya kumi ya mwezi’; ‘mwezi huo’ huonyesha wazi kuwa ni mwezi wa saba uliotajwa.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: Katika Siku ya Upatanisho
  rationale: Hili ni jina linaloeleweka la siku hiyo takatifu. Umbo la wingi la Kiebrania linaelezwa katika tanbihi bila kulazimisha Kiswahili kisicho cha kawaida.
- source_word: תַּעֲבִירוּ
  choice: mtaipuliza
  rationale: Kitenzi hiki ni cha wingi, tofauti na kitenzi cha kwanza cha umoja; mabadiliko hayo ya idadi yamehifadhiwa.
- source_word: בְּכָל אַרְצְכֶם
  choice: katika nchi yenu yote
  rationale: Kishazi hiki kinaonyesha eneo lote la nchi yao kwa ujumla.
theological_decisions:
- issue: Tafsiri ya יוֹם הַכִּפֻּרִים
  choice: Siku ya Upatanisho
  alternative: siku ya upatanisho mbalimbali / siku ya kufunika makosa
  rationale: Jina ‘Siku ya Upatanisho’ linamtambulisha wazi msomaji kwa siku maalumu ya ibada, huku tanbihi ikihifadhi ukweli kwamba nomino ya Kiebrania iko katika umbo la wingi. Tafsiri haiamui zaidi ya kile kinachosemwa na maandishi kuhusu namna ya upatanisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Mabadiliko ya nafsi kutoka umoja (‘utaipuliza’) hadi wingi (‘mtaipuliza’) yamehifadhiwa kwa kufuata Kiebrania. ‘Tarumbeta ya pembe’ imetumiwa badala ya neno la mkopo ‘shofar’ au ‘baragumu’ lisilo wazi kwa baadhi ya wasomaji wa sasa.
