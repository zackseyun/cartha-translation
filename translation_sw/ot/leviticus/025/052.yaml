  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: sw
  text: Lakini ikiwa imebaki miaka michache mpaka Mwaka wa Yubile, atafanya hesabu pamoja naye; kulingana na miaka yake, atalipa kiasi cha ukombozi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atalipa bei ya ukombozi wake.” Neno la Kiebrania hapa linahusu kiasi kinachotakiwa kwa ajili ya ukombozi wake, si ukombozi kama dhana ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: imebaki miaka michache tu
  rationale: Muundo huu unaonyesha kwamba idadi ndogo ya miaka ndiyo iliyobaki; Kiswahili hiki ni cha kawaida na kinaweka wazi maana ya wakati.
- source_word: שְׁנַת הַיֹּבֵל
  choice: Mwaka wa Yubile
  rationale: Hili ni jina linalotambulika la utaratibu maalumu wa kisheria na kiagano katika Mambo ya Walawi 25.
- source_word: וְחִשַּׁב לוֹ
  choice: atafanya hesabu pamoja naye
  rationale: Katika muktadha huu wa kiuchumi na kisheria, kitenzi kinamaanisha kukokotoa au kufanya hesabu; ‘pamoja naye’ huhifadhi wazo la wahusika wawili wanaohesabiana.
- source_word: כְּפִי שָׁנָיו
  choice: kulingana na miaka yake
  rationale: Tafsiri hii huhifadhi maana ya uwiano au kipimo kinachoamuliwa na miaka inayomhusu katika hesabu hiyo.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: atalipa kiasi cha ukombozi wake
  rationale: Katika muktadha huu גְּאֻלָּה halimaanishi ukombozi kwa dhana ya jumla, bali malipo yanayotakiwa ili mtu aachiliwe; ‘kiasi cha’ hufanya maana hiyo ya kifedha iwe wazi kwa Kiswahili cha kawaida.
