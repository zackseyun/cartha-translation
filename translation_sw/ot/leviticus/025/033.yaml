id: LEV.25.33
reference: Leviticus 25:33
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: sw
  text: Na ikiwa mmoja wa Walawi ataikomboa[a], nyumba iliyouzwa katika mji ulio milki yake itarudi katika Mwaka wa Yubile[b]; kwa maana nyumba zilizo katika miji ya Walawi ndizo milki yao miongoni mwa wana wa Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania pia kinaweza kueleweka kuwa, “ikiwa mtu ataikomboa kutoka kwa Walawi.” Muundo wa sentensi umebanwa.
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: Kiebrania kihalisi, “itatoka” katika Yubile, yaani nyumba iliyouzwa itatoka mikononi mwa mnunuzi na kurudi kwa mwenye haki ya milki.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “wana wa Israeli,” usemi wa kawaida wa agano unaolitaja taifa la Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: Na ikiwa mmoja wa Walawi ataikomboa
  rationale: Muundo huu wa Kiebrania umebanwa na unaweza kueleweka kwa njia zaidi ya moja. Tafsiri kuu inachukua מִן kwa maana ya sehemu ya kundi, yaani ‘mmoja wa Walawi,’ na גאל kwa maana ya kukomboa mali kwa kuikomboa kutoka kwa mnunuzi. Kiwakilishi ‘-i-’ kinarejelea nyumba au mali inayozungumziwa katika muktadha.
- source_word: וְיָצָא
  choice: itarudi
  rationale: Kitenzi hiki kihalisi ni ‘itatoka.’ Katika sheria ya Yubile, mali iliyouzwa inatoka mikononi mwa mnunuzi na kurudi kwa mwenye haki ya milki; ‘itarudi’ huwasilisha matokeo hayo kwa Kiswahili cha kawaida bila kuficha maana halisi, ambayo imeelezwa katika tanbihi.
- source_word: מִמְכַּר בַּיִת
  choice: nyumba iliyouzwa
  rationale: מִמְכָּר inaweza kumaanisha kitu kilichouzwa au mauzo yenyewe. ‘Nyumba iliyouzwa’ ni ya asili zaidi katika Kiswahili na inaonyesha wazi mali inayorudi wakati wa Yubile.
- source_word: וְעִיר אֲחֻזָּתוֹ
  choice: katika mji ulio milki yake
  rationale: Sintaksia ya Kiebrania imebanwa. Kwa kuzingatia muktadha, nyumba iko katika mji ambao ni sehemu ya milki ya Mlawi. ‘Mji ulio milki yake’ huhifadhi uhusiano huo bila kuongeza wazo lisilokuwamo.
- source_word: בַּיֹּבֵל
  choice: katika Mwaka wa Yubile
  rationale: ‘Mwaka wa Yubile’ ni istilahi ya wazi na inayoeleweka kwa taasisi maalumu ya kisheria inayorejelewa hapa.
- source_word: בָתֵּי עָרֵי הַלְוִיִּם
  choice: nyumba zilizo katika miji ya Walawi
  rationale: Muundo huu unaeleza nyumba zilizoko katika miji waliyopewa Walawi. Kiswahili hiki ni cha asili kuliko ‘nyumba za miji’ huku kikihifadhi uhusiano wa kimaana.
- source_word: הִוא אֲחֻזָּתָם
  choice: ndizo milki yao
  rationale: אֲחֻזָּה ni milki au shamba la kudumu linaloshikiliwa kwa haki ya ukoo. ‘Milki’ huhifadhi uzito wake wa kisheria bila kulazimisha neno ‘urithi’ ndani ya mstari.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Hii huhifadhi kwa karibu usemi wa kawaida wa agano בְּנֵי יִשְׂרָאֵל. Tanbihi inaeleza kwamba usemi huo humaanisha taifa la Israeli kwa ujumla.
theological_decisions:
- issue: Utambulisho wa mhusika katika מִן הַלְוִיִּם
  choice: mmoja wa Walawi
  alternative: mtu anayekomboa mali kutoka kwa Walawi
  rationale: מִן inaweza kuwa ya kugawa kundi (‘mmoja wa’) au kuonyesha chanzo (‘kutoka kwa’). Tafsiri kuu inafuata usomaji unaoelewa mkombozi kuwa Mlawi, unaofaa haki ya Walawi ya kukomboa nyumba zao katika muktadha, huku tanbihi ikihifadhi usomaji mwingine.
- issue: Maana ya kurejea kwa nyumba katika Yubile
  choice: itarudi
  alternative: itatoka / itaachiliwa
  rationale: Kiebrania kinaeleza mali ‘ikitoka,’ lakini muktadha unaonyesha kutoka katika umiliki wa mnunuzi na kurejea kwa mwenye haki. ‘Itarudi’ ni wazi bila kuingiza fundisho la dhehebu.
- issue: Usemi בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watu wa Israeli / Waisraeli
  rationale: ‘Wana wa Israeli’ huhifadhi umbo la usemi wa Kiebrania na sauti yake ya kiagano; tanbihi huzuia usomaji finyu wa kijinsia kwa kueleza matumizi yake ya kawaida kwa taifa zima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kukomboa,’ ‘milki,’ na ‘Mwaka wa Yubile’ zimetumiwa kama istilahi kuu za sheria ya ardhi katika sura hii. Sentensi imehifadhi uhusiano wa sababu unaoanzishwa na כִּי (‘kwa maana’), na tanbihi zimehifadhi utata halisi wa sintaksia na sitiari ya mali ‘kutoka’ katika Yubile.
