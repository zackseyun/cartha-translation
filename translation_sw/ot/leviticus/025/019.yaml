  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: sw
  text: Nchi itatoa mazao yake, nanyi mtakula na kushiba, nanyi mtaishi[a] humo kwa usalama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukaa.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuishi” au “kukaa,” na hapa kinaonyesha kuwa na makao salama katika nchi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנָה
  choice: itatoa
  rationale: Kitenzi נתן kimsingi ni ‘kutoa’; nchi ikiwa kiima, ‘itatoa’ huonyesha kwa njia ya kawaida kwamba nchi itazalisha mazao.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa Mambo ya Walawi 25, neno hili linarejelea nchi wanamoishi na mashamba yake, si dunia yote.
- source_word: פִּרְיָהּ
  choice: mazao yake
  rationale: פְּרִי inaweza kumaanisha tunda au mazao kwa ujumla. ‘Mazao yake’ ni ya kawaida zaidi katika muktadha huu wa uzalishaji wa nchi, bila kupunguza maana kwa matunda ya miti pekee.
- source_word: וַאֲכַלְתֶּם
  choice: nanyi mtakula
  rationale: Huhifadhi nafsi ya pili wingi na muendelezo wa sentensi kwa Kiswahili cha kawaida.
- source_word: לָשֹׂבַע
  choice: na kushiba
  rationale: שֹׂבַע huonyesha utoshelevu au kushiba; muundo ‘mtakula na kushiba’ ni wa asili na unaeleweka wazi.
- source_word: וִישַׁבְתֶּם
  choice: na kuishi
  rationale: ישב hapa inaweza kumaanisha kuishi au kukaa mahali kama makao ya kudumu. ‘Kuishi’ ni ya kawaida katika Kiswahili, huku mbadala ‘kukaa’ ukihifadhiwa katika tanbihi.
- source_word: לָבֶטַח
  choice: kwa usalama
  rationale: בֶּטַח hueleza hali ya usalama na kutokuwa na hofu; ‘kwa usalama’ linafaa kwa makao salama.
- source_word: עָלֶיהָ
  choice: humo
  rationale: Kiwakilishi kinarejelea nchi. Kwa Kiswahili, ‘humo’ ni njia ya kawaida ya kueleza kuishi katika nchi hiyo, badala ya tafsiri ngumu ya neno kwa neno ‘juu yake’.
