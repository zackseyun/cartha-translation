base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: sw
  text: Na katika nchi yote iliyo milki yenu[a], mtatoa ukombozi wa ardhi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Milki” hapa ni ardhi au mali isiyohamishika katika mgao wa urithi wa Israeli.
    reason: cultural_note
  - marker: b
    text: Au, “mtatoa haki ya kuikomboa ardhi.” Kiebrania kwa karibu zaidi ni “mtatoa ukombozi kwa ajili ya ardhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל
  choice: Katika ... yote
  rationale: Kirai hiki kinaweka amri hii itumike katika eneo lote; kiunganishi וּ kinaweza kuachwa katika Kiswahili kwa kuwa mstari huu unaendelea moja kwa moja kutoka muktadha uliotangulia.
- source_word: אֶרֶץ
  choice: nchi
  rationale: Katika muktadha huu wa kisheria, neno hili linamaanisha eneo la nchi lenye mashamba na ardhi, si dunia kwa ujumla.
- source_word: אֲחֻזַּתְכֶם
  choice: ya milki yenu
  rationale: Milki inaonyesha mali au ardhi inayoshikiliwa kama sehemu ya mgao wa urithi wa Israeli, bila kuongeza neno 'urithi' moja kwa moja katika matini.
- source_word: גְּאֻלָּה
  choice: ardhi ikombolewe
  rationale: Katika sheria hii, ukombozi ni kurudisha ardhi iliyouzwa kwa malipo. Muundo wa kitenzi ni wa kawaida zaidi katika Kiswahili kuliko kirai kizito 'ukombozi kwa ajili ya ardhi'.
- source_word: תִּתְּנוּ
  choice: mtaruhusu
  rationale: Kitenzi hiki maana yake ya msingi ni 'mtatoa,' lakini pamoja na גְּאֻלָּה kinaeleza kuweka nafasi au haki ya ukombozi; 'mtaruhusu' huwasilisha kazi hiyo ya kisheria kwa Kiswahili cha kawaida.
- source_word: לָאָרֶץ
  choice: ardhi
  rationale: Kirai hiki kinahusisha ukombozi na ardhi yenyewe; katika Kiswahili uhusiano huo unaelezwa kwa kawaida kwa kusema 'ardhi ikombolewe.'
theological_decisions:
- issue: Asili ya amri kuhusu ardhi ya urithi iliyouzwa
  choice: Amri inataka ukombozi wa ardhi uruhusiwe katika nchi yote iliyo milki ya Israeli.
  alternative: Inaweza kutafsiriwa kwa karibu zaidi na muundo wa Kiebrania kuwa, 'mtatoa ukombozi kwa ajili ya ardhi,' au kwa ufafanuzi zaidi, 'mtatoa haki ya kuikomboa ardhi.'
  rationale: Tafsiri iliyochaguliwa inaonyesha sharti la kisheria la kurudisha ardhi kwa malipo, bila kuingiza maana za baadaye za kiteolojia za 'ukombozi' wala kuamua wazi kwamba nomino hiyo lazima imaanishe 'haki' pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kutendwa ‘ardhi ikombolewe’ unaweka mkazo juu ya ardhi kama katika chanzo huku ukiepuka usemi usio wa kawaida wa Kiswahili.
