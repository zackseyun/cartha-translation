  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: sw
  text: Kwa maana wana wa Israeli[a] ni watumwa wangu[b]; wao ni watumwa wangu niliowatoa kutoka nchi ya Misri. Mimi ni Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: Au “watumishi wangu.” Neno la Kiebrania linaweza kumaanisha watumwa au watumishi walio chini ya mamlaka ya bwana; hapa linasisitiza kwamba Israeli ni mali ya Yahwe, si ya mabwana wa kibinadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya sheria iliyotangulia na kudumisha uhusiano wake wa kimantiki kwa Kiswahili cha kawaida.
- source_word: לִי
  choice: wangu
  rationale: Kiambishi hiki kinaonyesha kuwa wao ni mali yake au wako chini ya mamlaka yake; umilikaji huo unaelezwa kwa Kiswahili kwa kutumia ‘wangu’ pamoja na ‘watumwa.’
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hudumisha taswira ya kifamilia na ya kijumuiya ya Kiebrania bila kuibadili kuwa jina la taifa pekee.
- source_word: עֲבָדִים / עֲבָדַי
  choice: watumwa / watumwa wangu
  rationale: Katika muktadha wa sheria za Yubile, neno linahusu hali ya utumishi unaofungamana na umiliki. ‘Watumwa’ hudumisha utofautishaji kati ya kuwa chini ya bwana wa kibinadamu na kuwa mali ya Yahwe; urudiaji wake huhifadhi msisitizo wa Kiebrania.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: niliowatoa
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya muundo wa Hifili wa יצא katika kauli inayorejelea Kutoka Misri.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Huungana kwa kawaida na kitenzi ‘niliowatoa’ na kuhifadhi kauli maalumu kuhusu Kutoka Misri.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu badala ya kulibadili kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Hudumisha kwa uwazi muundo wa agano na kiwakilishi cha nafsi ya pili wingi.
theological_decisions:
- issue: Maana ya עבד katika muktadha wa kumilikiwa kwa agano na sheria zinazozuia utumwa wa kudumu kati ya Waisraeli
  choice: watumwa
  alternative: watumishi
  rationale: ‘Watumwa’ huhifadhi uzito wa hali ya kufungwa katika utumishi na hoja kwamba wana wa Israeli ni mali ya Yahwe, wala hawapaswi kumilikiwa daima na mabwana wa kibinadamu. Tanbihi inadumisha uwezekano mpana wa ‘watumishi.’
- issue: Usemi wa kijumuiya wenye jinsia בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ huhifadhi usemi wa kifamilia wa Kiebrania, huku tanbihi ikieleza tafsiri ya kijumuiya iliyo ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘watumwa wangu’ umehifadhiwa kwa sababu ni wa kimakusudi na wa kusisitiza katika Kiebrania.
