base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: sw
  text: Mimi ni Yahweh Mungu wenu,[a] niliyewatoa kutoka nchi ya Misri ili niwape nchi ya Kanaani na niwe Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Mimi ni Yahweh Mungu wenu
  rationale: Muundo huu unahifadhi msisitizo wa kiwakilishi אֲנִי na utambulisho wa agano, huku ukitumia Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano YHWH limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, hapa inamtaja Mungu mmoja wa Israeli katika kauli ya agano; kwa hiyo umoja “Mungu wenu” ndio sahihi kimuktadha.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: niliyewatoa
  rationale: Hifili ya יצא ina maana ya kusababisha watoke au kuwatoa, hasa katika kauli za Kutoka Misri; “niliyewatoa” ni ya asili na aminifu.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Neno אֶרֶץ limehifadhiwa kwa “nchi,” na kihusishi “katika” kinaeleza kwa Kiswahili cha kawaida kutoka ndani ya nchi hiyo baada ya kitenzi “kuwatoa.”
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: ili niwape nchi ya Kanaani
  rationale: Kishazi cha kitenzi-jina kinaonyesha kusudi la tendo la kuwatoa; “ili niwape” huwasilisha kusudi hilo wazi bila kuongeza tafsiri.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: na kuwa Mungu wenu
  rationale: Kauli hii ya kawaida ya agano inaeleza uhusiano wa Mungu na watu wake. “Kuwa Mungu wenu” ni ya asili na haiashirii mabadiliko katika asili ya Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina YHWH moja kwa moja. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo; mazoea ya jadi yanaelezwa katika tanbihi.
- issue: Uwasilishaji wa kauli ya agano לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: kuwa Mungu wenu
  alternative: kuwa Mungu kwenu; kuwa Mungu kwa ajili yenu
  rationale: Chaguo hili huhifadhi maana ya uhusiano wa agano kwa Kiswahili cha kawaida bila kudokeza kwamba Mungu alianza kuwa Mungu kwa mabadiliko ya hali yake.
- issue: Uhusiano wa kishazi לִהְיוֹת לָכֶם לֵאלֹהִים na kusudi lililotangulia
  choice: na kuwa Mungu wenu
  alternative: ili niwe Mungu wenu
  rationale: Kiebrania kina vitenzi-jina viwili vinavyoweza kusomwa kama makusudi yanayohusiana. “Na kuwa” huhifadhi uhusiano huo bila kulazimisha kwa ukali ikiwa kishazi cha mwisho ni kusudi sambamba au kilele cha kusudi la awali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Kauli ni fupi na ya moja kwa moja kama ilivyo katika Kiebrania; jina “Kanaani” na usemi wa agano “Mungu wenu” vinafuata matumizi yanayoeleweka kwa wasomaji wa kawaida.
