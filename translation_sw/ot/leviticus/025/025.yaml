base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: sw
  text: Ikiwa ndugu yako atakuwa maskini na kuuza sehemu ya ardhi ya urithi wake,[a] basi mkombozi wake—jamaa yake wa karibu zaidi—atakuja kukomboa kile alichouza ndugu yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ardhi ya urithi” ni sehemu ya ardhi ya familia iliyorithiwa katika mgao wa ardhi wa Israeli.
    reason: cultural_note
  - marker: b
    text: Au, “basi mkombozi wake—jamaa yake wa karibu zaidi—anaweza kuja na kukomboa.” Mkombozi hapa ni jamaa wa karibu mwenye haki na wajibu wa kuirudisha mali ya familia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּךְ
  choice: atakuwa maskini
  rationale: Kitenzi kinaeleza kudhoofika kiuchumi au kuingia katika umaskini; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Huhifadhi lugha halisi ya undugu ya Kiebrania, ambayo katika sheria hii pia inaweza kumaanisha Mwisraeli mwenzao.
- source_word: וּמָכַר מֵאֲחֻזָּתוֹ
  choice: na kuuza sehemu ya ardhi ya urithi wake
  rationale: אֲחֻזָּה hapa ni milki ya ardhi ya kifamilia iliyorithiwa, si mali ya kawaida tu; 'sehemu' huonyesha מן yenye maana ya kiasi kutoka katika milki hiyo.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: mkombozi wake aliye jamaa yake wa karibu zaidi
  rationale: Neno גאל humtaja jamaa mwenye haki na wajibu wa kurudisha mali ya ukoo; kirai kinachofuata kinaweka wazi ukaribu wa kifamilia na kipaumbele chake.
- source_word: וּבָא
  choice: atakuja
  rationale: Katika muundo huu wa sheria, perfekt yenye waw huendeleza matokeo ya hali iliyotajwa. Kiswahili cha wakati ujao huakisi nguvu ya kauli bila kuifanya ruhusa tu.
- source_word: וְגָאַל
  choice: na kukomboa
  rationale: '''Kukomboa'' huhifadhi istilahi muhimu ya kisheria na kitheolojia ya גאל, badala ya kuipunguza kuwa tendo la kibiashara la kununua tena.'
- source_word: אֵת מִמְכַּר אָחִיו
  choice: kile ambacho ndugu yake amekiuza
  rationale: מִמְכָּר inaweza kutaja kilichouzwa au mauzo; hapa usemi huu wa asili unaelekeza wazi kwa mali iliyouzwa.
theological_decisions:
- issue: Lugha ya undugu katika sheria ya Israeli
  choice: ndugu yako
  alternative: jamaa yako / Mwisraeli mwenzako
  rationale: Maandishi yanasema kihalisi 'ndugu yako.' Ingawa katika muktadha yanaweza kumaanisha mshiriki mwingine wa jumuiya ya Israeli, tafsiri inadumisha taswira ya kifamilia bila kuifafanua kupita kiasi.
- issue: Istilahi ya גאל
  choice: mkombozi ... kukomboa
  alternative: jamaa mwenye haki ya kununua tena ... kununua tena
  rationale: Istilahi ya ukombozi ina maana ya kisheria na mwangwi mpana wa kitheolojia. Kuongeza 'aliye jamaa yake' katika kirai kunabainisha wajibu wa kifamilia bila kupoteza mwangwi huo.
- issue: Nguvu ya vitenzi וּבָא וְגָאַל
  choice: atakuja na kukomboa
  alternative: anaweza kuja na kukomboa
  rationale: Sarufi ya Kiebrania katika sheria hii inawasilisha hatua inayofuata, lakini muktadha wa kisheria unaweza kufasiriwa kama haki au wajibu. Maandishi makuu yanahifadhi kauli yenye nguvu, na tanbihi inataja uwezekano wa tafsiri ya kimodal.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Ardhi ya urithi' huwasilisha muktadha wa אֲחֻזָּה kwa usahihi zaidi kuliko 'mali' pekee; 'mkombozi' huhifadhi istilahi ya msingi huku uhusiano wa kifamilia ukielezwa wazi.
