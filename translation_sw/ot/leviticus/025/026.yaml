base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: sw
  text: Lakini ikiwa mtu hana mkombozi[a], na uwezo wake wa kifedha ukatosha, naye akapata kiasi cha kutosha kwa ukombozi wake[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa wa karibu mwenye jukumu la kukomboa.” Neno la Kiebrania גֹּאֵל mara nyingi humaanisha jamaa wa karibu mwenye haki au wajibu wa kukomboa mali ya ukoo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mkono wake ukafikia, naye akapata kiasi cha ukombozi wake.” Hiki ni kisemo kinachoonyesha kwamba mtu amepata uwezo wa kifedha wa kutosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: Lakini ikiwa mtu
  rationale: Katika muktadha huu wa sheria, kifungu hiki kinaanzisha hali ya masharti. “Lakini” kinaonyesha tofauti na hali iliyotajwa katika mstari uliotangulia.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: hana mkombozi
  rationale: גֹּאֵל ni mtu mwenye haki au wajibu wa kukomboa mali ya ukoo, kwa kawaida jamaa wa karibu. “Mkombozi” ni fupi na sahihi, huku maelezo ya kindugu yakiwekwa katika tanbihi.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: naye akapata uwezo
  rationale: Kisemo hiki, kihalisi “mkono wake ukafikia,” humaanisha kwamba uwezo wake wa kifedha umeongezeka vya kutosha. Tafsiri ya maana ni ya kawaida na wazi katika Kiswahili.
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: na kuwa na mali ya kutosha kukomboa shamba lake
  rationale: Kifungu kinaeleza kupatikana kwa kiasi kinachotosha kwa ukombozi. Kwa kuwa muktadha ni ardhi iliyouzwa (mst. 25), “shamba lake” huweka wazi kinachokombolewa bila kubadili maana ya sheria.
theological_decisions:
- issue: Maana ya ukombozi katika kifungu hiki
  choice: kukomboa shamba lake
  alternative: kwa ukombozi wake
  rationale: גְאֻלָּתוֹ inaweza kuonekana kihalisi kama “ukombozi wake,” lakini katika muktadha wa sheria ya ardhi, kinachorejeshwa ni shamba au mali yake. Tafsiri hii huepuka dhana isiyokusudiwa ya ukombozi wa kiroho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wa heshima. Sentensi imeachwa ikiendelea kwa koma kwa sababu wazo la masharti linakamilishwa katika mstari unaofuata.
