lexical_decisions:
- source_word: תִרְדֶּה
  choice: usimtawale
  rationale: Kitenzi רדה humaanisha kutawala au kuwa na mamlaka juu ya mtu. “Usimtawale” kinahifadhi uhusiano wa mamlaka katika muktadha huu wa kisheria bila kuongeza maana.
- source_word: בּוֹ
  choice: -m-
  rationale: Kiwakilishi hiki ni cha nafsi ya tatu, umoja, kiume, kikimrejelea Mwisraeli aliyetajwa; katika Kiswahili kinawakilishwa kiasili na kiambishi cha yambwa “-m-” katika “usimtawale.”
- source_word: בְּפָרֶךְ
  choice: kwa ukatili
  rationale: פָרֶךְ hueleza utendaji mkali, wenye kuumiza au kuponda. “Kwa ukatili” ni Kiswahili cha kawaida na chenye hadhi, huku tanbihi ikihifadhi uwezekano wa “kwa ukali” au “bila huruma.”
- source_word: וְיָרֵאתָ
  choice: bali umche
  rationale: Ingawa וְ kimsingi ni “na,” baada ya katazo inaonyesha tofauti ya kimaana. “Bali” huweka wazi kwamba kumcha Mungu kunapaswa kudhibiti namna mamlaka inavyotumiwa.
- source_word: מֵאֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Pamoja na ירא, kihusishi מִן hutambulisha anayechwa katika nahau ya Kiebrania. Kiswahili cha kawaida husema “kumcha Mungu wako,” si “kuogopa kutoka kwa Mungu wako.”
theological_decisions:
- issue: Kazi ya kishazi cha mwisho kama msingi wa maadili
  choice: “bali umche Mungu wako” linaonyesha kwamba hofu yenye heshima kwa Mungu inapaswa kuzuia matumizi ya mamlaka kwa ukatili.
  alternative: “nawe umche Mungu wako,” ambalo lingehifadhi kiunganishi kwa namna ya moja kwa moja zaidi.
  rationale: “Bali” linafafanua uhusiano wa kimantiki baada ya katazo bila kuingiza fundisho la dhehebu au kuondoa mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa umoja umehifadhiwa, na “bali” limetumiwa kuonyesha tofauti ya kimaana kati ya katazo na wito wa kumcha Mungu.
