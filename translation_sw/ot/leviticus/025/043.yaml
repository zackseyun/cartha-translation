  text: Usimtawale kwa ukali[a], bali umche Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ukatili,” “bila huruma.” Neno la Kiebrania hurejelea utawala au matendo yenye ukali wa kukandamiza.
