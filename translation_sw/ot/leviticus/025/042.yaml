base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: sw
  text: Kwa maana wao ni watumwa wangu[a], ambao niliwatoa katika nchi ya Misri; wasiuzwe kwa namna watumwa wanavyouzwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wangu.” Neno la Kiebrania עֲבָדַי linaweza kutafsiriwa kwa namna zote mbili; “watumwa” limetumiwa hapa kwa sababu aya inasisitiza kuwa wao ni mali ya Mungu na kwamba hawapaswi kuuzwa kama mali ya kawaida ya utumwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kwa mauzo ya mtumwa,” yaani, kwa namna ya shughuli ya kawaida ya kumuuza mtumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya sheria iliyotangulia na kudumisha mtindo wa ufafanuzi wa kisheria.
- source_word: עֲבָדַי
  choice: watumwa wangu
  rationale: Neno עֶבֶד lenye kiambishi cha nafsi ya kwanza linaweza kumaanisha mtumwa au mtumishi. Hapa hali ya kuwa chini ya mamlaka na umiliki wa YHWH ndiyo msingi wa kukataza kuuzwa kwao kama mali ya utumwa, hivyo “watumwa wangu” inadumisha uzito wa kisheria wa muktadha.
- source_word: הֵם
  choice: wao ni
  rationale: Kiwakilishi kilichotajwa wazi kinasisitiza utambulisho wao kuwa watumwa wa Mungu; Kiswahili kinaonyesha hili kwa “wao ni.”
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: ambao niliwatoa
  rationale: Inawakilisha kishazi cha uhusiano na kauli ya Mungu ya kuwatoa, huku ikibaki ya kawaida katika Kiswahili.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: katika nchi ya Misri
  rationale: Hii ni tafsiri ya kawaida na wazi ya mahali walikotolewa.
- source_word: לֹא יִמָּכְרוּ
  choice: wasiuzwe
  rationale: Kauli tendwa ya kukataza katika sheria inatolewa kwa ufupi na kwa kawaida kwa “wasiuzwe.”
- source_word: מִמְכֶּרֶת עָבֶד
  choice: kwa namna watumwa wanavyouzwa
  rationale: Kirai kinaeleza aina au namna ya uuzaji unaomhusu mtumwa. Tafsiri hii ni ya kawaida kwa Kiswahili na haifichi kwamba kinachokatazwa ni kuwatendea kama mali ya utumwa.
theological_decisions:
- issue: Maana ya עֶבֶד / עֲבָדַי katika muktadha wa umiliki na ukombozi
  choice: watumwa wangu
  alternative: watumishi wangu
  rationale: Aya inategemeza katazo hilo katika dai la Mungu juu ya Waisraeli aliowatoa Misri. “Watumwa” inadumisha nguvu ya kijamii na kisheria ya neno katika muktadha huu; tanbihi inahifadhi tafsiri nyingine halali, “watumishi,” bila kuondoa mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha sheria lakini kinachoeleweka kwa msomaji wa kawaida. “Kwa maana” inadumisha uhusiano wa hoja, na “wasiuzwe” ni katazo la kisheria lililo wazi na la asili.
