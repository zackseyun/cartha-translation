base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: sw
  text: Mazao ya nchi wakati wa Sabato yake[a] yatakuwa chakula kwenu—kwako wewe, mtumwa wako wa kiume, mtumwa wako wa kike, mfanyakazi wako wa kuajiriwa, na mgeni wako mkazi[b], wanaoishi pamoja nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni kihalisi, “Sabato ya nchi”; hapa kinarejelea mazao ambayo nchi hutoa wakati wa mapumziko yake ya Sabato.
    reason: lexical_alternative
  - marker: b
    text: Au “mkazi wa muda”; neno hili linamtaja mtu asiye mwenyeji anayeishi miongoni mwa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: yatakuwa
  rationale: Katika sheria hii, umbo hili linaeleza yatakayokuwa matumizi halali ya mazao; wingi unapatana kwa kawaida na nomino ya Kiswahili “mazao.”
- source_word: שַׁבַּת הָאָרֶץ
  choice: Mazao ya nchi wakati wa Sabato yake
  rationale: Kiebrania kinasema kihalisi “Sabato ya nchi,” lakini katika muktadha kinamaanisha yale ambayo nchi inazaa inapopumzika katika mwaka wa Sabato. Tafsiri hii ni ya kawaida katika Kiswahili huku tanbihi ikihifadhi muundo wa asili.
- source_word: לָכֶם לְאָכְלָה
  choice: yatakuwa chakula chenu
  rationale: Huwasilisha kwa Kiswahili cha kawaida kusudi la mazao hayo, yaani yatumiwe kuwa chakula cha jamii inayozungumziwa.
- source_word: לְךָ
  choice: chako wewe
  rationale: Kiwakilishi cha umoja kinaanza orodha ya watu wanaoruhusiwa kula; “wewe” huonyesha wazi badiliko kutoka wingi “chenu” kwenda umoja.
- source_word: עַבְדְּךָ
  choice: mtumwa wako wa kiume
  rationale: Neno hilo linaweza kumaanisha mtumishi au mtumwa, lakini katika mpangilio huu wa kijamii hali ya utumwa ni muhimu, na jinsia ya kiume inatofautishwa na neno linalofuata.
- source_word: אֲמָתֶךָ
  choice: mtumwa wako wa kike
  rationale: Huhifadhi hali ya utumwa na tofauti ya jinsia iliyo wazi katika jozi ya maneno ya Kiebrania.
- source_word: שְׂכִירְךָ
  choice: mfanyakazi wako wa kuajiriwa
  rationale: Hutofautisha mtu anayefanya kazi kwa ujira na watumwa wa nyumbani waliotajwa kabla yake.
- source_word: תוֹשָׁבְךָ
  choice: mgeni mkazi
  rationale: Huonyesha mtu asiye mwenyeji ambaye anaishi miongoni mwa Waisraeli, bila kutumia istilahi ya kizamani au yenye maana potovu.
- source_word: הַגָּרִים עִמָּךְ
  choice: anayeishi pamoja nawe
  rationale: Hueleza hali ya kuendelea kuishi miongoni mwa jamii au kaya ya anayezungumziwa.
theological_decisions:
- issue: Kutafsiri istilahi za hali tofauti za wafanyakazi katika sheria ya Israeli
  choice: Kutofautisha “mtumwa wa kiume,” “mtumwa wa kike,” na “mfanyakazi wa kuajiriwa.”
  alternative: Kuwaita wote “watumishi.”
  rationale: Kiebrania kinatofautisha wazi hali za kijamii na kiuchumi; kuzifanya zote kuwa “watumishi” kungeficha tofauti hizo.
- issue: Maana ya “Sabato ya nchi” kama chakula
  choice: Kueleza mazao yanayotokea wakati nchi inapumzika katika Sabato yake.
  alternative: Kutafsiri kihalisi “Sabato ya nchi itakuwa chakula chenu.”
  rationale: Sabato yenyewe si chakula; katika muktadha usemi huo unarejelea mazao yanayopatikana wakati wa mapumziko ya nchi, bila kuondoa uhusiano wake na taasisi ya Sabato.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi; “Sabato” inadumisha msamiati wa muktadha, na istilahi za kijamii zinabaki tofauti kama zilivyo katika Kiebrania.
