  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: sw
  text: Kwa kuzingatia idadi ya miaka baada ya Mwaka wa Yubile, utanunua kutoka kwa mwenzako; utauziwa kwa kuzingatia idadi ya miaka ya mazao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa kuzingatia idadi ya miaka ya mazao/mavuno.” Hoja ni kwamba bei ya mauzo inategemea miaka ya mazao iliyobaki hadi Mwaka wa Yubile unaofuata, wala si uhamisho wa kudumu wa ardhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: kwa kuzingatia idadi ya
  rationale: Muundo huu unaonyesha kipimo au msingi wa kukadiria thamani, na unasikika kwa kawaida katika Kiswahili kuliko tafsiri sisisi ya ‘katika idadi ya.’
- source_word: שָׁנִים
  choice: miaka
  rationale: Hii ni tafsiri ya moja kwa moja ya wingi wa ‘mwaka’ katika mzunguko wa Yubile.
- source_word: אַחַר הַיּוֹבֵל
  choice: baada ya Mwaka wa Yubile
  rationale: Kirai hiki ni cha wakati. ‘Mwaka wa Yubile’ ni namna ya kawaida na iliyo wazi ya kutaja יוֹבֵל katika muktadha huu.
- source_word: תִּקְנֶה
  choice: utanunua
  rationale: Kauli ya wakati ujao katika sheria inahifadhi nguvu ya agizo la Kiebrania bila kufanya sentensi kuwa nzito.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: kutoka kwa mwenzako
  rationale: ‘Mwenzako’ humaanisha mshiriki mwingine wa jumuiya katika muktadha huu wa kisheria bila kuongeza maelezo ya kikabila yasiyosemwa moja kwa moja.
- source_word: שְׁנֵי תְבוּאֹת
  choice: miaka ya mazao
  rationale: Tafsiri hii inahifadhi wazo la miaka inayohusishwa na mazao au mavuno. Haiongezi neno ‘iliyobaki’ katika matini kuu, kwa kuwa halipo wazi katika Kiebrania, ingawa muktadha unaonyesha hivyo.
- source_word: יִמְכָּר לָךְ
  choice: naye atakuuzia
  rationale: Hii inaonyesha tendo linalolingana la muuzaji; ‘naye’ huunganisha kwa kawaida sehemu mbili za sheria.
theological_decisions:
- issue: Iwapo ardhi inauzwa kabisa au thamani yake inakadiriwa kwa mavuno hadi Yubile inayofuata
  choice: Matini kuu inasema ‘miaka ya mazao,’ huku tanbihi ikifafanua maana ya kiuchumi katika muktadha.
  alternative: Kuandika moja kwa moja ‘miaka ya mazao iliyobaki hadi Mwaka wa Yubile unaofuata.’
  rationale: Kiebrania hakisemi wazi ‘iliyobaki’ wala ‘Yubile inayofuata’ katika mstari huu. Kuacha ufafanuzi huo katika tanbihi huhifadhi muundo wa chanzo na wakati huohuo humsaidia msomaji kuelewa sheria ya sura nzima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umehifadhiwa, lakini sentensi imeunganishwa kwa ‘naye’ ili isomeke kwa urahisi. ‘Mazao’ limechaguliwa badala ya ‘mavuno’ katika matini kuu kwa sababu תְבוּאָה linaweza kumaanisha mazao au mazao yanayovunwa; maana mbadala imeonyeshwa katika tanbihi.
