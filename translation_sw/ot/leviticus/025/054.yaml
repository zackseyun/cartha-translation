  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: sw
  text: Lakini kama hatakombolewa kwa njia hizi[a], basi atatoka katika mwaka wa Yubile, yeye na wanawe pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa haya”—ikirejelea njia za ukombozi zilizoelezwa katika aya zilizotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini kama
  rationale: Inaendeleza sharti kutoka masharti yaliyotangulia huku ikionyesha utofauti mdogo baada ya uwezekano wa kukombolewa.
- source_word: יִגָּאֵל
  choice: hatakombolewa
  rationale: Kauli ya kutendwa ya גאל hapa inaeleza kukombolewa kutoka utumwani kwa utaratibu wa jamaa au malipo.
- source_word: בְּאֵלֶּה
  choice: kwa njia hizi
  rationale: Kiwakilishi hiki kinarejelea njia za ukombozi zilizoelezwa katika aya zilizotangulia; usemi huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: וְיָצָא
  choice: basi ... wataondoka
  rationale: Kitenzi humaanisha kihalisi kutoka, na katika muktadha huu ni kuondoka katika utumishi. 'Basi' huonyesha sehemu ya pili ya sharti kwa uwazi.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: katika mwaka wa Yubile
  rationale: Ni istilahi inayotambulika katika muktadha wa sheria za Walawi na huhifadhi alama ya wakati ya Kiebrania.
- source_word: וּבָנָיו עִמּוֹ
  choice: yeye na wanawe walio pamoja naye
  rationale: בנים ni 'wana' wa kiume, si neno pana la watoto; tafsiri inadumisha jinsia iliyotajwa na wazo la kuondoka pamoja.
theological_decisions:
- issue: Neno la kijinsia בָנָיו kuhusu watu wa nyumba
  choice: wanawe
  alternative: watoto wake
  rationale: Kiebrania kimetumia wazi nomino ya wingi ya kiume, hivyo tafsiri haipanui maana kuwa watoto wa jinsia zote.
