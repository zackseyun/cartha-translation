  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: sw
  text: Yahwe[a] akasema na Musa katika Mlima Sinai, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; jina hili pia hutoholewa kuwa “Yahweh” au “Yehova.”'
