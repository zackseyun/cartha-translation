lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Muundo wa simulizi unaendeleza tukio linalofuata; “akasema na” ni Kiswahili cha kawaida kinachoonyesha kwamba Yahwe alimwelekea Musa kwa maneno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.” Tahajia “Yahwe” ni ya kawaida na rahisi kutamkwa katika Kiswahili.
- source_word: אֶל מֹשֶׁה
  choice: na Musa
  rationale: Katika Kiswahili, “kusema na Musa” ni njia ya kawaida ya kueleza mtu anayeambiwa maneno; Musa ni tahajia iliyozoeleka ya jina hilo.
- source_word: בְּהַר סִינַי
  choice: kwenye Mlima Sinai
  rationale: Kihusishi ב ni cha mahali hapa. “Kwenye Mlima Sinai” huhifadhi kiasi fulani cha uwazi kuhusu ikiwa tukio lilikuwa juu ya mlima au katika eneo lake.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno yanayofuata na kuhifadhi kiungo cha moja kwa moja kuelekea mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. “Yahwe” huhifadhi jina hilo bila kulibadilisha kuwa cheo, huku tanbihi ikitaja namna nyingine ya kulitamka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Kwenye” limetumiwa ili kutolazimisha maana finyu ya kuwa juu kabisa ya mlima.
