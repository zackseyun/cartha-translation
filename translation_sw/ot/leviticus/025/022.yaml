  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: sw
  text: Nanyi mtapanda katika mwaka wa nane, na mtakula mazao ya zamani mpaka mwaka wa tisa; mpaka mazao yake yatakapopatikana[a], mtakula yale ya zamani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka mavuno yake yatakapofika.” Kihalisi, Kiebrania husema, “mpaka mazao yake yatakapokuja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: Nanyi mtapanda
  rationale: Kauli timilifu ya Qal yenye kiunganishi ina nguvu ya wakati ujao katika muktadha huu wa maagizo; “mtapanda” ni ya kawaida na wazi katika Kiswahili.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: katika mwaka wa nane
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa namba ya mpangilio.
- source_word: וַאֲכַלְתֶּם
  choice: na mtakula
  rationale: Inahifadhi tendo linalofuata na nguvu ya wakati ujao ya kifungu cha Kiebrania.
- source_word: מִן הַתְּבוּאָה
  choice: mazao
  rationale: תְּבוּאָה ni mavuno au mazao ya kilimo; “mazao” ni neno pana, la kawaida, na linafaa kwa chakula kilichohifadhiwa.
- source_word: יָשָׁן
  choice: ya zamani
  rationale: Kiebrania kinasema kihalisi “ya zamani,” huku nomino ikieleweka kutokana na “mazao”; uchaguzi huu unahifadhi ufupi na marudio ya chanzo.
- source_word: עַד הַשָּׁנָה הַשְּׁמִינִת / עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: mpaka mwaka wa tisa
  rationale: Kikomo cha wakati kimetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: mpaka mazao yake yatakapopatikana
  rationale: בּוֹא ni “kuja”; katika muktadha wa mavuno, “yatakapopatikana” hueleza kwa kawaida wakati mazao mapya yanapoanza kupatikana bila kubadili maana ya msingi.
- source_word: תְּבוּאָתָהּ
  choice: mazao yake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kike kinaelekea kurejelea mwaka wa tisa uliotajwa karibuni; “yake” kinadumisha rejeo hilo bila kulifafanua kupita kiasi.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: mtakula ya zamani
  rationale: Inahifadhi marudio yenye mkazo ya יָשָׁן na kuacha “mazao” ieleweke kutoka muktadha, kama ilivyo katika Kiebrania.
