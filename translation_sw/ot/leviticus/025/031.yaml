base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: sw
  text: Lakini nyumba za vijiji visivyo na ukuta unaovizunguka zitahesabiwa kuwa sawa na mashamba ya nchi[a]. Zitakuwa na haki ya kukombolewa, na katika Mwaka wa Yubile zitaachiliwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “itahesabiwa kuwa kama shamba la nchi.” Yaani, kisheria nyumba hizi za vijijini zinachukuliwa kama ardhi ya mashambani, si kama nyumba zilizo katika mji wenye ukuta.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri halisi, “katika Yubile itatoka”; yaani, mali hiyo huachiliwa na kurejea katika Mwaka wa Yubile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָתֵּי הַ/חֲצֵרִים
  choice: nyumba za vijiji
  rationale: Muundo wa Kiebrania ni wa utegemezi, ‘nyumba za vijiji.’ ‘Vijiji’ ni Kiswahili cha kawaida na kinachofaa kwa makazi ya mashambani; kutokuwapo kwa ukuta kunaelezwa wazi katika kishazi kinachofuata.
- source_word: אֲשֶׁר אֵין לָ/הֶם חֹמָה סָבִיב
  choice: visivyo na ukuta unaovizunguka
  rationale: Huhifadhi wazi maana ya kutokuwa na ukuta kuzunguka vijiji hivyo, kwa lugha ya asili ya Kiswahili.
- source_word: עַל שְׂדֵה הָ/אָרֶץ יֵחָשֵׁב
  choice: zitahesabiwa kuwa kama mashamba ya nchi
  rationale: Hufuata kwa karibu tamko la Kiebrania ‘itahesabiwa kama shamba la nchi,’ huku wingi ukipatana na ‘nyumba’ katika Kiswahili. ‘Kama’ huonyesha kwamba hii ni hadhi ya kisheria, si kwamba nyumba zinageuka kuwa mashamba kihalisi.
- source_word: גְּאֻלָּה תִּהְיֶה לּ/וֹ
  choice: zinaweza kukombolewa
  rationale: Huwasilisha kwa kawaida haki au uwezekano wa kuikomboa mali hiyo. Kiwakilishi cha umoja katika Kiebrania huitazama mali kama kundi moja, lakini Kiswahili hutumia wingi kulingana na ‘nyumba.’
- source_word: וּ/בַ/יֹּבֵל יֵצֵא
  choice: na katika Mwaka wa Jubilee zitaachiwa
  rationale: Kitenzi cha Kiebrania kwa msingi ni ‘itatoka,’ lakini katika sheria hii humaanisha mali kuachiliwa na kurudi kwa mwenye haki wakati wa Jubilee. ‘Zitaachiwa’ ni ya asili na inaweka wazi athari ya kisheria bila kuongeza mmiliki ambaye hajatajwa katika mstari.
theological_decisions:
- issue: Maana ya יֵצֵא katika sheria ya Jubilee
  choice: zitaachiwa
  alternative: zitatoka
  rationale: ‘Zitaachiwa’ huhifadhi dhana ya kuachiliwa kwa mali katika Jubilee kwa Kiswahili kinachoeleweka; tanbihi inahifadhi nahau halisi ‘zitatoka’ na maana ya kurejea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Mwaka wa Jubilee’ limetumiwa kama istilahi ya sheria hii ya kibiblia. Alama zote za tanbihi zimewekwa katika matini kuu.
