  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: sw
  text: Kwa miaka sita utapanda shamba lako, na kwa miaka sita utapogoa mizabibu yako na kukusanya mazao yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mavuno yake.” Neno la Kiebrania linaweza kumaanisha kwa upana mazao yanayopatikana kutokana na kilimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: kwa miaka sita
  rationale: Kirai hiki kinaonyesha muda ambao kazi hizo zinafanywa; “kwa miaka sita” ni Kiswahili cha kawaida na huweka wazi maana hiyo.
- source_word: תִּזְרַע
  choice: utapanda
  rationale: Kauli ya wakati ujao katika muktadha huu wa sheria inatoa agizo au ruhusa iliyo ndani ya mpangilio wa agano. “Utapanda” hudumisha umbo la moja kwa moja bila kuongeza mbegu ambayo haikutajwa wazi katika Kiebrania.
- source_word: שָׂדֶךָ
  choice: shamba lako
  rationale: Neno hili humaanisha eneo linalolimwa, hivyo “shamba lako” ni sahihi zaidi kuliko neno pana “ardhi yako.”
- source_word: תִּזְמֹר
  choice: utapogoa
  rationale: Katika muktadha wa mizabibu, kitenzi hiki humaanisha kukata matawi yasiyohitajika ili kuitunza mizabibu; “kupogoa” ni istilahi mahususi na ya kawaida.
- source_word: כַּרְמֶךָ
  choice: shamba lako la mizabibu
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya shamba lililopandwa mizabibu.
- source_word: וְאָסַפְתָּ
  choice: na kukusanya
  rationale: Kitenzi hiki humaanisha kukusanya. Muundo wa “na kukusanya” unaunganika kwa kawaida na “utapogoa” huku nguvu ya kauli ya wakati ujao ikiendelea kutawala tendo la pili.
- source_word: תְּבוּאָתָהּ
  choice: mazao yake
  rationale: Neno hili linaweza kumaanisha mazao au mavuno yanayotokana na kilimo. “Mazao yake” huhifadhi upana wake bila kuyafanya kuwa aina fulani ya zao.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi unahifadhi urudiaji wa “kwa miaka sita” katika Kiebrania na uwiano kati ya kupanda shamba na kupogoa shamba la mizabibu.
