  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: sw
  text: Na ikiwa ndugu yako atakuwa maskini pamoja nawe na kujiuza kwako[a], usimtumikishe kazi ya mtumwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuuzwa kwako.” Kiebrania kina umbo la kutendwa, ingawa katika muktadha huu humaanisha mtu maskini kujiuza katika utumishi kwa sababu ya hali yake.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “usimtumikishe utumishi wa mtumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi na utangulizi wa sharti la kisheria kwa Kiswahili cha kawaida.
- source_word: יָמוּךְ
  choice: atakuwa maskini
  rationale: Kitenzi kinaonyesha kuingia katika hali ya umaskini au kudhoofika kiuchumi.
- source_word: אָחִיךָ עִמָּךְ
  choice: ndugu yako aliye pamoja nawe
  rationale: Huhifadhi neno la kifamilia 'ndugu' na uhusiano unaoonyeshwa na עִמָּךְ bila kulifasiri moja kwa moja kuwa 'Mwisraeli mwenzako'.
- source_word: וְנִמְכַּר לָךְ
  choice: na kujiuza kwako
  rationale: Ingawa umbo la Kiebrania ni la kutendwa, katika sheria hii linaweza kueleza mtu maskini anayejiuza katika utumishi; tanbihi inahifadhi tafsiri halisi ya kutendwa.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: usimtumikishe
  rationale: Hueleza kwa ufupi na kwa kawaida katazo la kumlazimisha au kumtumia mtu katika kazi.
- source_word: עֲבֹדַת עָבֶד
  choice: kazi ya mtumwa
  rationale: Huhifadhi uzito wa istilahi ya hadhi na aina ya kazi ya mtumwa, badala ya neno hafifu zaidi kama 'mtumishi'.
theological_decisions:
- issue: Istilahi ya hadhi katika sheria ya utumishi unaotokana na umaskini
  choice: kazi ya mtumwa
  alternative: kazi ya mtumishi; kama mtumwa
  rationale: Kirai cha Kiebrania kinakataza kumtumikisha ndugu kwa namna ya kazi ya mtumwa, bila kukana kwamba anaingia katika aina fulani ya utumishi. Tafsiri hii haipunguzi uzito wa hadhi inayokatazwa.
- issue: Utendaji au utendwa katika וְנִמְכַּר לָךְ
  choice: kujiuza kwako
  alternative: kuuzwa kwako
  rationale: Muktadha wa umaskini unaunga mkono maana ya kujiuza katika utumishi, lakini umbo la kisarufi ni la kutendwa; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye heshima. 'Ndugu' limehifadhiwa ili kutofuta taswira ya kifamilia ya Kiebrania; tanbihi zinaweka wazi utendwa wa kitenzi na muundo halisi wa kirai cha mwisho.
