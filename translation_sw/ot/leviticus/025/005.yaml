base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: sw
  text: Usivune mazao yaliyojiotea baada ya mavuno yako[a], wala usichume zabibu za mzabibu wako usiopogolewa[b]. Utakuwa mwaka wa pumziko kamili kwa nchi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mazao yaliyoota yenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “zabibu za mzabibu wako uliotengwa/ulioachwa”; katika muktadha huu inarejelea mzabibu usiopogolewa au usiotunzwa katika mwaka wa pumziko.
    reason: lexical_alternative
  - marker: c
    text: Au, “mwaka wa Sabato kwa nchi” au “mwaka wa pumziko kuu kwa nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ
  choice: mimea iliyoota yenyewe baada ya mavuno
  rationale: Neno hilo humaanisha mazao yanayoota yenyewe kutokana na mbegu za mavuno yaliyotangulia, si mazao yaliyopandwa kwa makusudi. Kauli hii ni wazi kwa msomaji wa kawaida na inadumisha wazo la uotaji wa hiari.
- source_word: קְצִירְךָ
  choice: mavuno yako
  rationale: Huwakilisha moja kwa moja nomino ya Kiebrania na uhusiano wake na mimea inayoota baada ya mavuno yaliyotangulia.
- source_word: תִקְצֹר
  choice: usivune
  rationale: Kitenzi kinahusu kuvuna nafaka au mazao ya shambani; ‘kuvuna’ ni neno la kawaida na mahususi katika Kiswahili.
- source_word: עִנְּבֵי
  choice: zabibu za
  rationale: Hutoa maana ya nomino ‘zabibu’ na kudumisha muundo wake wa umilikaji pamoja na neno linalofuata.
- source_word: נְזִירֶךָ
  choice: mzabibu wako ulioachwa bila kupogolewa
  rationale: Katika muktadha huu wa kilimo, neno linarejelea mzabibu ulioachwa bila kutunzwa au kupogolewa wakati wa mwaka wa pumziko. Tafsiri hii huepuka maana isiyofaa ya Mnadhiri huku ikihifadhi wazo la kuachwa kando.
- source_word: תִבְצֹר
  choice: usichume
  rationale: Kitenzi hiki hutumiwa hasa kwa kukusanya zabibu; ‘kuchuma’ ni usemi wa asili na sahihi katika Kiswahili.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: mwaka wa pumziko kamili
  rationale: ‘Pumziko kamili’ huwasilisha nguvu ya שַׁבָּתוֹן, ambayo inasisitiza pumziko la Sabato, bila kuifanya kauli hiyo kuwa jina la kalenda tu.
- source_word: לָאָרֶץ
  choice: kwa ajili ya nchi
  rationale: Katika muktadha wa Mambo ya Walawi 25, neno linarejelea nchi, hasa ardhi yake ya kilimo. ‘Nchi’ pia hudumisha upana wa maana kuliko ‘udongo’ pekee.
theological_decisions:
- issue: Kutafsiri istilahi ya mwaka wa Sabato bila kuingiza mafundisho au mahusiano ya baadaye
  choice: mwaka wa pumziko kamili kwa ajili ya nchi
  alternative: mwaka wa Sabato kwa ajili ya nchi; mwaka wa pumziko kuu kwa ajili ya nchi
  rationale: Kauli iliyochaguliwa inaonyesha kwamba nchi ndiyo inayopata pumziko na inawasilisha msisitizo wa שַׁבָּתוֹן kwa Kiswahili kinachoeleweka, bila kuongeza madai ya kitheolojia yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa amri mbili hasi umehifadhiwa, na sentensi ya mwisho inaonyesha wazi pumziko la nchi.
