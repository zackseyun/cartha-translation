  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: sw
  text: Nayo nchi isiuzwe kwa kudumu[a], kwa kuwa nchi ni yangu. Ninyi ni wageni na wakazi wa muda pamoja nami[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kabisa” au “hata milele.” Neno hili humaanisha uuzaji wa kudumu au usioweza kutenguliwa.
    reason: lexical_alternative
  - marker: b
    text: Maneno “wageni na wakazi wa muda” yanaonyesha kwamba Waisraeli waliishi nchini kama watu waliomtegemea Mungu, ambaye ndiye mwenye nchi.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: isiuzwe
  rationale: Nifali ya מכר ina maana ya kutendwa na hapa ina nguvu ya katazo la kisheria; “isiuzwe” ni ya kawaida na huhifadhi kauli tendwa.
- source_word: לִצְמִתֻת
  choice: kabisa
  rationale: Katika muktadha wa umiliki wa ardhi, neno hili linaashiria kuuzwa kusikoweza kutenguliwa au kumtenga mwenye fungu nalo daima. “Kabisa” ni usemi wa asili katika Kiswahili, huku tanbihi ikifafanua maana ya kudumu.
- source_word: כִּי לִי הָאָרֶץ
  choice: kwa maana nchi ni yangu
  rationale: כִּי inatoa sababu ya katazo, na “nchi ni yangu” huhifadhi dai la moja kwa moja la Mungu kuhusu umiliki.
- source_word: גֵרִים
  choice: wageni
  rationale: גֵר ni watu wanaoishi katika nchi isiyo yao kwa asili na walio na hadhi tegemezi; “wageni” huhifadhi wazo hilo bila kulifanya kuwa fundisho la baadaye.
- source_word: וְתוֹשָׁבִים
  choice: wakazi wa muda
  rationale: תוֹשָׁב ni mkazi asiye na haki kamili ya urithi wa kudumu. “Wakazi wa muda” hutofautisha neno hili na “wageni” na kuonyesha kwamba umiliki wao si wa mwisho.
- source_word: עִמָּדִי
  choice: pamoja nami
  rationale: עם pamoja na kiambishi cha nafsi ya kwanza kwa kawaida ni “pamoja nami”; tafsiri hii huhifadhi uhusiano ulioelezwa bila kuubadili kuwa “mbele zangu” au kuufafanua kupita kiasi.
theological_decisions:
- issue: Uhusiano wa Israeli na nchi
  choice: Israeli inaishi nchini kwa kutegemea umiliki wa Mungu; haki yake ya kuitumia si umiliki huru na wa mwisho.
  alternative: Kuliona hili kama kanuni ya kijamii na kiuchumi pekee, au kama kauli ya kunyang'anywa kabisa iliyo nje ya muktadha wa yubile.
  rationale: Kauli iliyo wazi, “nchi ni yangu,” ndiyo msingi wa kiteolojia wa katazo. Tafsiri huhifadhi nguvu ya kisheria na dai la Mungu la umiliki bila kuingiza mfumo wa baadaye wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nchi” imetumiwa kwa הָאָרֶץ kwa sababu muktadha ni nchi ya Israeli na mashamba yake, huku “ardhi” ikiwa mbadala unaowezekana. Muundo “Nayo nchi” unaendeleza mtiririko wa sheria katika muktadha.
