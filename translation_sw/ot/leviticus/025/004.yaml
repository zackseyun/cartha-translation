base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: sw
  text: Lakini katika mwaka wa saba, nchi itakuwa na sabato ya pumziko kamili[a], sabato kwa Yahwe. Usipande mbegu katika shamba lako, wala usipogoe mizabibu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sabato ya pumziko kabisa.” Usemi wa Kiebrania unasisitiza kusitishwa kabisa kwa kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: Lakini katika mwaka wa saba
  rationale: Kiunganishi וּ kinaeleweka hapa kwa maana ya utofautishaji, kwa kuwa mstari huu unatofautisha mwaka wa saba na miaka sita ya kulima iliyotajwa kabla yake.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: sabato ya pumziko kamili
  rationale: Muundo huu wa Kiebrania unasisitiza kusitishwa kabisa kwa kazi; tafsiri hii inadumisha dhana ya sabato pamoja na msisitizo huo.
- source_word: יִהְיֶה לָאָרֶץ
  choice: nchi itakuwa na
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha kwamba pumziko hilo ni kwa ajili ya nchi, bila kuondoa dhima yake katika sentensi.
- source_word: שַׁבָּת לַיהוָה
  choice: sabato kwa Yahwe
  rationale: Kihusishi ל kinaonyesha kwamba sabato hiyo imewekwa wakfu kwa Yahwe; 'kwa' ni ya asili na inahifadhi uhusiano huo.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: Usipande mbegu katika shamba lako
  rationale: Kitenzi זרע kinamaanisha kupanda mbegu; katazo la nafsi ya pili umoja limetolewa kwa muundo wa kawaida wa sheria katika Kiswahili.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: wala usipogoe shamba lako la mizabibu
  rationale: Katika muktadha wa mizabibu, זמר humaanisha kupogoa; 'shamba la mizabibu' ni tafsiri wazi ya כֶּרֶם.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה moja kwa moja. 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa katazo ni wa moja kwa moja, na istilahi za kilimo ni za sasa na wazi.
