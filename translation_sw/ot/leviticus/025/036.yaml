base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: sw
  text: Usichukue kutoka kwake riba wala faida[a]; bali umche Mungu wako, na ndugu yako[b] aishi pamoja nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyongeza” au “ongezeko” badala ya “faida.” Kiebrania huunganisha maneno mawili yanayohusiana, yakimaanisha riba au kiasi cha ziada kinachodaiwa kutoka kwa mkopaji maskini.
    reason: lexical_alternative
  - marker: b
    text: Hapa “ndugu yako” ni mwanachama mwenzako wa jumuiya ya agano, si lazima ndugu yako wa kuzaliwa.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: Usichukue
  rationale: אַל pamoja na kitenzi kisichotimilika hutoa katazo la moja kwa moja; “Usichukue” ni Kiswahili cha sasa na huhifadhi nguvu ya amri.
- source_word: מֵאִתּוֹ
  choice: kutoka kwake
  rationale: Kirai hiki humtaja mkopaji mwenye uhitaji kuwa mtu ambaye riba au faida ingetwaliwa kwake.
- source_word: נֶשֶׁךְ
  choice: riba
  rationale: Neno hili linamaanisha malipo yanayoongezwa juu ya mkopo. “Riba” ni neno la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: וְתַרְבִּית
  choice: wala faida
  rationale: Neno hili lina maana ya ongezeko au pato linalodaiwa kutoka kwa mkopaji na limeunganishwa na נֶשֶׁךְ. “Faida” huwasilisha maana ya manufaa ya kiuchumi, huku tanbihi ikihifadhi uwezekano wa “nyongeza” au “ongezeko.”
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: bali umche Mungu wako
  rationale: 'Kiunganishi kimetafsiriwa kwa ulinganisho wa kimaadili: badala ya kumdhulumu mwenye uhitaji, msikilizaji anapaswa kumcha Mungu. “Mungu wako” huhifadhi usemi wa moja kwa moja wa agano.'
- source_word: וְחֵי
  choice: na umwache ... aishi
  rationale: 'Muundo huu una nguvu ya kuagiza au kuruhusu matokeo: ndugu aendelee kuishi. Tafsiri hii huhifadhi kiunganishi na haiongezi waziwazi maana ya kusudi.'
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania na huhifadhi picha ya kifamilia ya jamii ya agano; tanbihi inaeleza kwamba si lazima awe ndugu wa kuzaliwa.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: Kirai hiki kinaonyesha kuendelea kuishi katika jamii pamoja na anayepewa amri.
theological_decisions:
- issue: Maana ya kijamii na kiagano ya אָחִיךָ katika sheria hii
  choice: ndugu yako
  alternative: Mwisraeli mwenzako; mtu wa jamaa yako
  rationale: “Ndugu yako” huhifadhi lugha ya kifamilia ya Kiebrania bila kuifanya iwe tu uhusiano wa damu. Tanbihi inaonyesha maana pana ya mwanajumuiya ya agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa katazo ni wa moja kwa moja; istilahi za kiuchumi zinaeleweka kwa msomaji wa kawaida, na maana ya kiagano ya “ndugu” imefafanuliwa bila kuingizwa ndani ya matini.
