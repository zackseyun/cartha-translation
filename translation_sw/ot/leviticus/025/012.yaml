  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: sw
  text: Kwa maana ni mwaka wa yubile; utakuwa mtakatifu kwenu. Kutoka shambani mtakula mazao yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavuno yake.” Neno la Kiebrania linamaanisha kile ambacho ardhi huzaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kishazi hiki kinatoa sababu ya agizo lililotangulia; “kwa maana” kinaonyesha uhusiano huo wa maelezo kwa Kiswahili cha kawaida.
- source_word: יוֹבֵל
  choice: mwaka wa yubile
  rationale: Katika Mambo ya Walawi 25 neno hili linamaanisha mwaka maalumu wa hamsini, si pembe ya kondoo-dume. Kuongeza “mwaka wa” kunafanya maana ya muktadha iwe wazi na ya asili kwa Kiswahili.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: utakuwa mtakatifu kwenu
  rationale: “Mtakatifu” huhifadhi uzito wa kidini na wa agano wa קֹדֶשׁ, huku kiambishi cha ngeli katika “utakuwa” kikirejelea mwaka wa yubile.
- source_word: מִן הַשָּׂדֶה
  choice: Kutoka shambani
  rationale: Hutoa kwa uwazi wazo la kula kile kinachopatikana moja kwa moja shambani badala ya mavuno ya kawaida yaliyopangwa na kuhifadhiwa.
- source_word: תֹּאכְלוּ
  choice: mtakula
  rationale: Hali ya kitenzi katika sheria hii ina nguvu ya agizo lenye mwelekeo wa wakati ujao; “mtakula” ni ya asili na hudumisha sauti hiyo.
- source_word: תְּבוּאָתָהּ
  choice: mazao yake
  rationale: Neno hili linahusu kile ambacho ardhi huzaa. “Mazao” ni neno pana na la kawaida linalofaa pia kwa kile kinachoota katika mwaka wa yubile bila uvunaji wa kawaida.
theological_decisions:
- issue: Lugha ya utakatifu kuhusu mwaka wa yubile
  choice: utakuwa mtakatifu kwenu
  alternative: utakuwa wakfu kwenu
  rationale: Tafsiri hii huhifadhi dai kwamba mwaka wa yubile una hadhi ya utakatifu katika uhusiano wa agano, bila kupunguza maana hiyo iwe tu kutengwa kwa matumizi maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio “Kutoka shambani” umehifadhiwa mwanzoni mwa sentensi ili kuakisi msisitizo wa chanzo.
