  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: sw
  text: Kama mwajiriwa, mwaka baada ya mwaka, atakuwa pamoja naye; asimtawale kwa ukali mbele ya macho yako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: kama mfanyakazi wa kuajiriwa
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, ‘kama,’ na שָׂכִיר ni mtu anayefanya kazi kwa ujira, si mtumwa. Usemi huu ni wazi katika Kiswahili cha sasa.
- source_word: שָׁנָה בְּשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Nahau hii inaonyesha hali inayoendelea na kuhesabiwa kwa kila mwaka; ‘mwaka baada ya mwaka’ ni ya kawaida na huhifadhi maana hiyo.
- source_word: יִהְיֶה עִמּוֹ
  choice: atakuwa pamoja naye
  rationale: Tafsiri hii inafuata kwa karibu maana ya kawaida ya היה pamoja na עִם bila kuongeza wazo la ‘kubaki’ au ‘kutumikia,’ ambalo halijasemwa wazi.
- source_word: לֹא יִרְדֶּנּוּ
  choice: asimtawale
  rationale: רדה humaanisha kutawala au kuwa na mamlaka juu ya mtu. ‘Asimtawale’ huhifadhi maana hiyo katika muktadha wa sheria.
- source_word: בְּפֶרֶךְ
  choice: kwa ukali
  rationale: Neno hili linaonyesha ukali au unyanyasaji katika kutumia mamlaka, hasa kuhusiana na kazi; ‘kwa ukali’ ni la asili pamoja na kitenzi ‘kutawala.’
- source_word: לְעֵינֶיךָ
  choice: mbele ya macho yako
  rationale: Hii huhifadhi taswira halisi ya Kiebrania na maana ya jambo kutendeka mtu anayesemeshwa akiliona.
theological_decisions:
- issue: Hali ya Mwisraeli aliye chini ya bwana mgeni
  choice: Ameelezwa kwa ulinganisho kuwa kama mfanyakazi wa kuajiriwa, wala si kuitwa mtumwa katika mstari huu.
  alternative: Kama mtumishi wa kuajiriwa.
  rationale: Kiebrania kinatumia שָׂכִיר, mtu anayefanya kazi kwa ujira, na huweka ulinganisho unaolinda hali yake ya muda katika muktadha huu. Tafsiri haiongezi dhana kali zaidi ya umiliki wa mtumwa ambayo neno hili lenyewe halisemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida huku ukihifadhi ulinganisho, hali ya mwaka kwa mwaka, na katazo la utawala wa kikatili.
