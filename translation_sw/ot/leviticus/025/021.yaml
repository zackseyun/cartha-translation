base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: sw
  text: Basi nitaamuru baraka yangu kwa ajili yenu katika mwaka wa sita, nayo itafanya mavuno[a] ya miaka mitatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, mazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: Basi nitaiamuru
  rationale: Kitenzi צוה kinaonyesha kutoa amri au agizo. “Basi” linaonyesha kuwa ahadi hii inajibu swali lililotangulia katika muktadha, huku “nitaiamuru” kikihifadhi nguvu ya tendo la Mungu.
- source_word: בִּרְכָתִי
  choice: baraka yangu
  rationale: ברכה hapa ni fadhili ya Mungu inayodhihirika kwa wingi wa mazao; tafsiri hii ni ya moja kwa moja na haibani maana yake.
- source_word: לָכֶם
  choice: kwa ajili yenu
  rationale: Kihusishi ל kinaonyesha walengwa au wanufaika wa baraka; “kwa ajili yenu” ni Kiswahili cha kawaida katika maana hiyo.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: katika mwaka wa sita
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha wakati na inaonyesha wakati wa baraka katika mzunguko wa mwaka wa Sabato.
- source_word: וְעָשָׂת
  choice: nao utatoa
  rationale: Kitenzi kinaeleza matokeo ya uzalishaji wa mwaka huo. Kiwakilishi “-o” kinarejelea “mwaka wa sita,” na “utatoa” ni lugha ya kawaida kwa mwaka unaoleta mavuno.
- source_word: הַתְּבוּאָה
  choice: mavuno
  rationale: תבואה humaanisha mazao ya kilimo au mavuno. “Mavuno” ni neno la kawaida, wazi, na linalofaa muktadha wa mavuno ya mwaka.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: ya miaka mitatu
  rationale: Kirai hiki kinaonyesha kwamba mavuno hayo yatatosheleza kipindi cha miaka mitatu. “Ya miaka mitatu” kinadokeza kiasi hicho bila kuongeza neno lisilokuwapo wazi katika Kiebrania.
theological_decisions:
- issue: Asili ya baraka iliyoahidiwa
  choice: Tendo la moja kwa moja la Mungu la kuamuru baraka itoe wingi wa pekee wa mavuno
  alternative: Kauli ya jumla tu kuhusu majaliwa ya Mungu
  rationale: Nafsi ya kwanza katika “nitaiamuru,” pamoja na “baraka yangu,” inaonyesha uamuzi mahususi wa Mungu unaosababisha mavuno ya kutosha, si maelezo ya jumla kuhusu mavuno ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi lugha ya moja kwa moja ya amri ya Mungu, huku “mavuno” likitoa maana ya kilimo kwa uwazi.
