  text: וְ/כִ֣י תֹאמְר֔וּ מַה נֹּאכַ֤֖ל בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֑ת הֵ֚ן לֹ֣א נִזְרָ֔ע וְ/לֹ֥א נֶאֱסֹ֖ף אֶת תְּבוּאָתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: sw
  text: Na kama mkisema, “Tutakula nini katika mwaka wa saba, kwa kuwa hatutapanda wala kukusanya mazao yetu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: Na mkisema
  rationale: Muundo wa masharti unaanzisha swali linalotarajiwa; ‘mkisema’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: מַה נֹּאכַל
  choice: Tutakula nini
  rationale: Huwasilisha moja kwa moja swali kuhusu chakula na kuhifadhi nafsi ya kwanza wingi.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִת
  choice: katika mwaka wa saba
  rationale: Tafsiri ya moja kwa moja na ya asili ya kipindi kinachotajwa.
- source_word: הֵן
  choice: kwa kuwa
  rationale: Katika muktadha huu chembe hii inaeleza msingi wa swali; Kiswahili ‘kwa kuwa’ huunganisha hoja kwa ufasaha bila kutumia mshangao usio wa lazima.
- source_word: לֹא נִזְרָע
  choice: hatutapanda
  rationale: Huhifadhi tendo la kupanda na nafsi ya kwanza wingi.
- source_word: וְלֹא נֶאֱסֹף אֶת־תְּבוּאָתֵנוּ
  choice: wala kukusanya mazao yetu
  rationale: ‘Mazao yetu’ linafaa kwa תְּבוּאָתֵנוּ, yaani mavuno au mazao yanayotokana na ardhi; ‘wala’ huunganisha vikanushi viwili kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Nguvu ya chembe הֵן katika swali
  choice: kwa kuwa
  alternative: tazama
  rationale: Muktadha unaonyesha sababu ya wasiwasi—kutopanda na kutokusanya mazao—hivyo uhusiano wa kisababu umewekwa wazi bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Kauli ya moja kwa moja na wingi wa wasemaji vimehifadhiwa.
