id: LEV.25.30
reference: Leviticus 25:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: sw
  text: Lakini ikiwa nyumba hiyo haitakombolewa kabla ya mwaka mmoja kamili kutimia, nyumba iliyo katika mji wenye ukuta[a] itakuwa mali ya kudumu ya yule aliyeinunua, yeye na vizazi vyake[b]. Haitarudishwa katika Mwaka wa Jubili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya konsonanti yana “usio na ukuta”; usomaji wa kimapokeo wa Kiebrania una “wenye ukuta.” Usomaji huo unalingana na muktadha wa mistari 29-31.
    reason: textual_variant
  - marker: b
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “nyumba hiyo itasimama daima kwa mnunuzi wake, katika vizazi vyake.” Hii ni lugha ya kisheria inayoonyesha kwamba umiliki huo unakuwa wa kudumu.
    reason: lexical_alternative
  - marker: c
    text: Maana yake ni kwamba nyumba hiyo haitarudi kwa familia ya mwenye nyumba wa kwanza wakati wa Mwaka wa Jubili.
    reason: clarification
lexical_decisions:
- source_word: יִגָּאֵל
  choice: haitakombolewa
  rationale: Nifali ya גאל katika sheria hii ina maana ya mali kukombolewa, yaani kununuliwa tena na mwenye haki ya ukombozi. “Kukombolewa” inadumisha istilahi kuu ya Walawi 25.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: kabla ya mwaka mmoja kamili kutimia
  rationale: Kirai hiki kinaweka kikomo cha kipindi cha ukombozi kuwa mwaka mmoja kamili; Kiswahili hiki ni cha kawaida bila kuongeza maelezo yasiyotajwa wazi.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: itakuwa mali ... ya kudumu
  rationale: Kitenzi “itasimama” pamoja na neno la kudumu ni nahau ya kisheria inayoonyesha kwamba umiliki wa mnunuzi unathibitishwa bila kubatilishwa.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לא חֹמָה
  choice: nyumba iliyo katika mji wenye ukuta
  rationale: Imetafsiriwa kwa kufuata usomaji wa kimapokeo wa Kimasora לו (“wenye ukuta”), unaolingana na utofautishaji wa miji yenye ukuta katika mstari 29 na vijiji visivyo na ukuta katika mstari 31. Maandishi ya konsonanti לא yamehifadhiwa katika tanbihi kama tofauti halisi ya maandishi.
- source_word: לַקֹּנֶה אֹתוֹ לְדֹרֹתָיו
  choice: ya yule aliyeinunua, yeye na vizazi vyake
  rationale: Hii inaonyesha umiliki wa kudumu katika ukoo wa mnunuzi kwa lugha ya kawaida ya Kiswahili, huku ikihifadhi wazo la vizazi.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: Haitarudishwa katika Mwaka wa Jubili
  rationale: Ingawa יֵצֵא kwa kawaida ni “itatoka,” katika sheria ya mali hapa ina maana kwamba nyumba haitatoka katika umiliki wa mnunuzi wala kurudi kwa jamaa ya kwanza wakati wa Jubili.
- source_word: יּוֹבֵל
  choice: Mwaka wa Jubili
  rationale: Hii ni istilahi inayoeleweka kwa taasisi ya mwaka maalumu iliyoelezwa katika Walawi 25.
theological_decisions:
- issue: Nguvu ya kudumu ya uuzaji wa nyumba katika mji wenye ukuta
  choice: Ikiwa nyumba haikukombolewa ndani ya mwaka mmoja kamili, inakuwa mali ya kudumu ya mnunuzi na vizazi vyake na hairudi wakati wa Jubili.
  alternative: Kutafsiri וְקָם kwa namna halisi tu kuwa “itasimama,” bila kuweka wazi athari yake ya kisheria.
  rationale: Muungano wa וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו na לֹא יֵצֵא בַּיּוֹבֵל unaonyesha uhamisho wa umiliki usiobatilishwa na Jubili.
- issue: Tofauti ya Kimasora katika לא / לו
  choice: Maandishi makuu yanafuata usomaji wa kimapokeo לו, “wenye ukuta,” na tofauti ya maandishi inaonyeshwa katika tanbihi.
  alternative: Kufuata konsonanti לא na kutafsiri “usio na ukuta.”
  rationale: Usomaji “wenye ukuta” unalingana na sheria ya nyumba za miji yenye ukuta katika mistari 29-30 na utofautishaji wa wazi wa vijiji visivyo na ukuta katika mstari 31; hata hivyo, tofauti ya maandishi haifichwi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kukombolewa” na “Mwaka wa Jubili” zinadumisha msamiati wa kisheria na wa kibiblia wa sura hii; sentensi imewekwa wazi bila kuficha tofauti muhimu ya maandishi ya Kiebrania.
