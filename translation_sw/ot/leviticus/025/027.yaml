  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: sw
  text: ndipo atahesabu miaka tangu alipoiuza, na atamrudishia mtu aliyemuuzia ardhi hiyo kiasi kilichobaki[a]; kisha atarudi kwenye ardhi yake ya urithi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ziada” au “salio.” Kiebrania kinamaanisha kiasi kinachobaki baada ya kuhesabu thamani ya miaka iliyosalia.
    reason: lexical_alternative
  - marker: b
    text: “Ardhi yake ya urithi” hapa ni umiliki wake wa ardhi, yaelekea sehemu ya urithi wa ukoo wake katika Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: ndipo atahesabu
  rationale: Kitenzi חשׁב hapa kinaonyesha kufanya hesabu ya thamani ya ukombozi; “atahesabu” ni Kiswahili cha sasa na “ndipo” linaonyesha hatua inayofuata katika utaratibu.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: miaka tangu alipoiuza
  rationale: Kwa neno ni “miaka ya mauzo yake,” lakini katika sheria hii ni miaka iliyopita tangu ardhi iuzwe, ambayo hutumiwa kuhesabu kiasi cha kurudisha.
- source_word: וְהֵשִׁיב
  choice: kumrudishia
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi, yaani kulipa au kurudisha kiasi kwa mnunuzi. Umbo hili ni la kawaida katika muktadha wa fedha.
- source_word: הָעֹדֵף
  choice: kiasi kilichobaki
  rationale: Neno hili linamaanisha ziada au salio linalobaki baada ya kuhesabu thamani ya miaka ambayo bado haijatumika.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: mtu aliyemuuzia
  rationale: Huyu ni mtu aliyenunua ardhi. “Mtu aliyemuuzia” huhifadhi rejeo la mtu binafsi na ni la asili katika Kiswahili.
- source_word: וְשָׁב
  choice: kisha atarudi
  rationale: Qali ya שוב inaonyesha muuzaji kurudi baada ya ukombozi; “kisha” linaendeleza mfuatano wa hatua.
- source_word: לַאֲחֻזָּתוֹ
  choice: katika milki yake
  rationale: אֲחֻזָּה hapa ni ardhi anayomiliki kwa urithi katika mpangilio wa Israeli, si mali ya aina yoyote tu. “Milki” ni fupi na huhifadhi maana ya umiliki wa ardhi.
theological_decisions:
- issue: Maana ya אֲחֻזָּה katika sheria ya Mwaka wa Jubilee
  choice: milki yake
  alternative: mali yake ya urithi
  rationale: Neno linahusu shamba au sehemu ya ardhi ya ukoo katika Israeli. “Milki yake” ni ya asili katika mstari, huku tanbihi ikifafanua kipengele cha urithi bila kukifanya kifungu kuwa kizito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umehifadhiwa bila kuwa mgumu; sentensi inaonyesha wazi hesabu, malipo kwa mnunuzi, na kurejea katika ardhi.
