base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: sw
  text: Ujihesabie sabato saba za miaka[a], miaka saba mara saba; na siku za sabato hizo saba za miaka zitakuwa miaka arobaini na tisa kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majuma saba ya miaka.” Kiebrania kinasema kihalisi “sabato saba za miaka,” yaani mizunguko saba ya miaka saba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ לְךָ
  choice: Nawe utajihesabia
  rationale: Kitenzi ספר kinamaanisha kuhesabu au kuainisha vipindi, na umbo la kujirejelea linaonyesha wazi maana ya לְךָ, ‘kwa ajili yako mwenyewe,’ kwa Kiswahili cha kawaida.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: sabato saba za miaka
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania na uhusiano wake na sheria ya mwaka wa sabato, huku tanbihi ikifafanua kuwa ni mizunguko saba ya miaka saba.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: miaka saba mara saba
  rationale: Inafuata mpangilio na urudiaji wa Kiebrania kwa Kiswahili cha asili na kinachoeleweka.
- source_word: וְהָיוּ לְךָ
  choice: zitakuwa kwako
  rationale: Inahifadhi kwa karibu muundo wa Kiebrania na rejeo la moja kwa moja kwa mhusika wa pili bila kuongeza maelezo ya kihisabati yasiyotajwa wazi.
- source_word: יְמֵי
  choice: siku za
  rationale: Neno hilo linamaanisha kihalisi ‘siku za’; kulihifadhi kunaakisi namna ya Kiebrania ya kueleza muda wote wa vipindi hivyo.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: miaka arobaini na tisa
  rationale: Huu ndio mpangilio wa kawaida na ulio wazi wa kutaja idadi hiyo katika Kiswahili cha sasa.
