  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: sw
  text: Katika mwaka huu wa Yubile, kila mtu atarudi kwenye milki yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mali yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: Katika mwaka huu wa Yubile
  rationale: Muundo huu unatoa kwa Kiswahili cha kawaida maana ya wakati ya בְּ, huku ukihifadhi kiashiria ‘huu’ na jina la mwaka maalumu wa Yubile.
- source_word: תָּשֻׁבוּ אִישׁ
  choice: kila mtu atarudi
  rationale: Kitenzi cha wingi pamoja na אִישׁ yenye maana ya kugawa agizo kwa mtu mmoja mmoja kimewasilishwa kwa njia ya asili kama ‘kila mtu atarudi.’ Kiswahili hakihitaji kuweka jinsia ya kiume hapa.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: kwenye milki yake
  rationale: אֲחֻזָּה humaanisha mali au eneo linalomilikiwa, hasa ardhi ya ukoo katika muktadha huu. ‘Milki yake’ ni fupi, ya heshima, na haiongezi waziwazi wazo la urithi ambalo neno lenyewe halitamki moja kwa moja.
theological_decisions:
- issue: Maana ya kurejeshwa kwa אֲחֻזָּה katika mwaka wa Yubile
  choice: milki yake
  alternative: eneo lake la urithi
  rationale: Tafsiri kuu inadumisha upana wa neno la Kiebrania bila kulifanya liwe tu shamba au bila kuongeza moja kwa moja ‘urithi’; tanbihi inaonyesha maana inayowezekana kutokana na muktadha wa ardhi ya ukoo.
- issue: Nomino ya kugawa agizo אִישׁ
  choice: kila mtu
  alternative: kila mwanamume
  rationale: Katika muundo huu אִישׁ hufanya kazi kwa maana ya ‘kila mmoja.’ ‘Kila mtu’ ni Kiswahili cha kawaida na hakitatui kimadhehebu upeo wa sheria; pia mfumo wa Kiswahili hauhitaji kiwakilishi cha umilikaji chenye jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, na yenye hadhi ya kifungu cha sheria. ‘Yubile’ limetumiwa kama jina lililozoeleka la mwaka huo maalumu.
