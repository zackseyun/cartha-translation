lexical_decisions:
- source_word: שֶׁבֶר
  choice: jeraha
  rationale: Katika muktadha huu wa sheria ya madhara ya mwili, neno hilo humaanisha mvunjiko au jeraha linalotokana na kuvunjika. “Jeraha” ni la kawaida na linaendana kwa ufasaha na sentensi nzima, huku maelezo ya chini yakihifadhi maana mahususi ya “mvunjiko.”
- source_word: תַּחַת
  choice: kwa
  rationale: 'Katika kauli hii ya sheria, linaonyesha ulinganifu au malipo yanayolingana: “jeraha kwa jeraha, jicho kwa jicho.”'
- source_word: עַיִן
  choice: jicho
  rationale: Ni neno la moja kwa moja la kiungo cha mwili na linahifadhiwa katika kauli ya sheria.
- source_word: שֵׁן
  choice: jino
  rationale: Ni neno la moja kwa moja la kiungo cha mwili na linahifadhiwa katika kauli ya sheria.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Linaanzisha ulinganisho kati ya jeraha alilosababisha mtu na lile litakalompata.
- source_word: יִתֵּן מוּם
  choice: anavyomtia mtu jeraha
  rationale: Kiebrania kimahaba ni “anavyoweka/kutoa dosari kwa mtu.” Kiswahili “kumtia mtu jeraha” linaonyesha usababishaji wa madhara ya mwili kwa lugha ya kawaida lakini yenye heshima.
- source_word: מוּם
  choice: jeraha
  rationale: Neno linaweza kumaanisha dosari, kilema, au ulemavu wa mwili. Katika sheria ya shambulio hapa, “jeraha” linafaa zaidi bila kulifanya lionekane kuwa kasoro ya mapambo tu.
- source_word: אָדָם
  choice: mtu
  rationale: Hapa ni umoja wakilishi katika sheria na humaanisha mwanadamu yeyote; “mtu” ni tafsiri ya asili na sahihi katika Kiswahili.
- source_word: כֵּן
  choice: ndivyo
  rationale: Linaonyesha matokeo yanayolingana na tendo lililotangulia.
- source_word: יִנָּתֶן בּוֹ
  choice: naye atakavyotiwa
  rationale: Kauli tendwa ya נתן na kihusishi בּוֹ inaonyesha kwamba jeraha hilohilo litatiwa juu yake. Kitenzi kilichodokezwa kinarejelea “jeraha” lililotajwa tayari.
theological_decisions:
- issue: Asili ya kauli ya kulipiza jeraha kwa jeraha
  choice: 'Kuhifadhi kauli halisi na yenye sehemu mahususi za mwili: “jeraha kwa jeraha, jicho kwa jicho, jino kwa jino.”'
  alternative: Kuitafsiri kwa jumla kuwa “adhabu au fidia inayolingana na jeraha.”
  rationale: Kiebrania kinatoa kanuni hiyo kwa kauli thabiti ya ulinganifu. Tafsiri haipaswi kuamua kimya kimya ikiwa utekelezaji wake ni jeraha halisi au fidia; hilo ni suala la ufafanuzi wa kisheria na kitheolojia.
- issue: Uhusiano kati ya מוּם na kiwakilishi katika kauli tendwa
  choice: Kudokeza “jeraha” katika “naye atakavyotiwa,” huku tanbihi ikifafanua muundo huo.
  alternative: “ndivyo naye atakavyofanyiwa” au “ndivyo jeraha hilo litakavyotiwa juu yake.”
  rationale: Chaguo hili ni la asili kwa Kiswahili na linadumisha ulinganifu bila kuongeza maelezo yasiyosemwa moja kwa moja; tanbihi huhifadhi upana wa “dosari/kilema.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudiarudia umehifadhiwa kwa sababu ni muhimu kwa nguvu ya kisheria ya mstari. “Mtu” limetumiwa kwa אָדָם kwa kuwa ni umoja wakilishi usiozuiliwa kwa jinsia. Alama zote za tanbihi [a] na [b] zimo katika maandishi makuu.
