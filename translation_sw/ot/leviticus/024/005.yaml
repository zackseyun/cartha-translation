  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: sw
  text: Kisha utachukua unga laini na uoke mikate kumi na miwili[a]; kila mkate utakuwa na sehemu mbili za kumi za efa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “keki kumi na mbili.” Neno la Kiebrania linaweza kurejelea mikate au keki zilizookwa, hasa katika matumizi ya ibada.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania halisi: “sehemu mbili za kumi.” Katika mfumo wa vipimo wa kikuhani, maana yake ni sehemu mbili za kumi za efa kwa kila mkate.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utachukua
  rationale: Muundo wa kitenzi katika mfululizo wa maagizo una nguvu ya amri. “Kisha utachukua” unaonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni unga uliosafishwa vizuri uliotumiwa katika matoleo na mikate mitakatifu; tafsiri hii haitaji nafaka ambayo Kiebrania hakuitaji.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: na kuoka
  rationale: Kitenzi kinamaanisha kuoka, na kiwakilishi chake kinarejelea unga. Kiswahili kinaweza kueleza matokeo moja kwa moja kwa kutaja mikate inayookwa.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: mikate kumi na miwili
  rationale: חַלּוֹת ni vipande kamili vya mkate vilivyookwa, hasa katika mazingira ya ibada. “Mikate” ni ya kawaida na wazi, huku uwezekano wa “maandazi” ukihifadhiwa katika tanbihi.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: sehemu mbili za kumi za efa
  rationale: Usemi huo ni vipimo viwili vya sehemu moja ya kumi; katika lugha ya vipimo ya kikuhani, kiwango kinachodokezwa ni efa.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: kiasi cha unga kwa kila mkate kitakuwa
  rationale: Kiebrania halisi husema “mkate mmoja utakuwa,” kwa maana ya mgawanyo kwa kila mkate. Kiswahili hiki kinaweka wazi kuwa kipimo kinahusu unga wa kila mkate bila kubadili maana.
