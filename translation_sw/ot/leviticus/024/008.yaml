base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: sw
  text: Kila siku ya Sabato[a], ataiweka kwa utaratibu[b] mbele ya Yahwe daima, kutoka kwa wana wa Israeli, kama agano la milele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Siku ya Sabato, siku ya Sabato,” yaani kila Sabato au Sabato baada ya Sabato.'
    reason: lexical_alternative
  - marker: b
    text: Au “ataipanga.” Kiambishi cha umoja kinarejelea mkate au mpangilio wa mikate kwa ujumla.
    reason: lexical_alternative
  - marker: c
    text: 'Muundo wa Kiebrania ni mfupi: “kutoka kwa wana wa Israeli, agano la milele”; uhusiano kamili wa maneno hayo na agizo lililotangulia haujaelezwa wazi.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: Kila siku ya Sabato
  rationale: 'Kurudiwa kwa maneno hayo katika Kiebrania kuna maana ya ugawaji wa wakati: Sabato baada ya Sabato, yaani kila Sabato.'
- source_word: יַעַרְכֶנּוּ
  choice: ataupanga
  rationale: Kitenzi ערך humaanisha kupanga au kuweka kwa utaratibu katika mazingira ya ibada; kiambishi cha umoja kinarejelea mkate au mpangilio wake kama kitu kimoja.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa kawaida wa ibada unaomaanisha kuweka kitu mbele ya Mungu au katika uwepo wake; jina la agano יְהוָה limetafsiriwa Yahwe.
- source_word: תָּמִיד
  choice: daima
  rationale: Katika sheria za kikuhani neno hili linaweza kuonyesha utaratibu unaoendelea kwa kurudiwa mara kwa mara, si lazima tendo lisilokatizwa; hapa ratiba ya kila Sabato inaeleza maana hiyo.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: kutoka kwa Waisraeli
  rationale: מֵאֵת huonyesha chanzo; 'Waisraeli' ni Kiswahili cha kawaida na cha asili kwa usemi wa kijumuiya 'wana wa Israeli'.
- source_word: בְּרִית עוֹלָם
  choice: kama agano la milele
  rationale: Tafsiri hii inadumisha wazi lugha ya agano na wazo la kudumu bila kuongeza neno la ufafanuzi kama 'wajibu' ambalo halipo katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia moja kwa moja jina la agano la Mungu; 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa בְּרִית עוֹלָם na agizo la ibada
  choice: kama agano la milele
  alternative: kama wajibu wa kudumu wa agano
  rationale: Kiebrania chenyewe kinasema 'agano la milele.' Tafsiri iliyochaguliwa haiamui kimbele kama mkazo mkuu ni agano lenyewe au wajibu wa ibada unaotokana nalo.
- issue: Maana ya תָּמִיד katika ratiba ya Sabato
  choice: daima
  alternative: kwa ukawaida
  rationale: Neno 'daima' linahifadhi upana wa neno la Kiebrania, huku muktadha wa kila Sabato ukionyesha kwamba hapa ni mwendelezo wa ibada inayorudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. 'Mbele za Yahwe' inafaa mazingira ya ibada; 'ataupanga' ni ya asili na inadumisha umoja wa kisarufi wa Kiebrania. Tanbihi zinahifadhi uradidi wa asili na ufupi wenye uwezekano wa maana zaidi ya moja mwishoni mwa mstari.
