  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: sw
  text: Na mwanamume akimpiga mtu yeyote na kumuua[b][a], hakika atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “uhai wowote wa mwanadamu.” Usemi huo unamaanisha mtu au uhai wa binadamu, si hasa “roho” isiyo ya mwili.'
    reason: lexical_alternative
  - marker: b
    text: Au “akimuua mtu yeyote.” Kitenzi cha Kiebrania kwa maana ya msingi ni “kupiga,” lakini hapa kinamaanisha pigo linalosababisha kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: Na mwanamume
  rationale: וְ huunganisha sheria hii na muktadha uliotangulia; אִישׁ ni nomino ya umoja wa kiume, hivyo imetafsiriwa kwa ‘mwanamume’ badala ya kuigeuza kuwa ‘yeyote.’
- source_word: כִּי
  choice: aki-
  rationale: Katika sheria ya masharti, כִּי huanzisha hali ya ‘ikiwa’; Kiswahili cha kawaida huiwasilisha kwa ujenzi wa masharti ‘akimpiga.’
- source_word: יַכֶּה
  choice: akimpiga ... na kumuua
  rationale: Hifili ya נכה kimsingi humaanisha ‘kupiga,’ lakini hapa muktadha unaonyesha pigo linalosababisha kifo. Tafsiri hii huhifadhi picha ya pigo huku ikieleza matokeo yake ya kufisha.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: mtu yeyote
  rationale: נֶפֶשׁ hapa ni mtu aliye hai au uhai wa binadamu, si hasa ‘roho’ isiyo ya mwili; אָדָם ni binadamu kwa maana ya jumla. ‘Mtu yeyote’ ni ya asili na sahihi katika Kiswahili.
- source_word: מוֹת יוּמָת
  choice: hakika atauawa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi cha kutendwa unasisitiza adhabu ya kifo. ‘Hakika atauawa’ huhifadhi msisitizo na hali ya kutendwa ya kanuni hiyo.
theological_decisions:
- issue: Maana ya אָדָם katika sheria hii
  choice: mtu yeyote
  alternative: uhai wowote wa binadamu
  rationale: Neno hili linawahusu wanadamu kwa jumla, si wanaume pekee; pamoja na נֶפֶשׁ, hapa linamtaja mtu anayeuawa badala ya kutoa fundisho kuhusu ‘roho’ isiyo ya mwili.
- issue: Kuhifadhi jinsia ya אִישׁ
  choice: mwanamume
  alternative: mtu yeyote anayefanya hivyo
  rationale: Chanzo kinatumia nomino ya umoja wa kiume. Tafsiri inaihifadhi wazi, bila kukataa kwamba sheria hiyo inaweza kuwa na nguvu ya uwakilishi.
- issue: Uzito wa adhabu katika מוֹת יוּמָת
  choice: hakika atauawa
  alternative: ni lazima auawe
  rationale: Chaguo kuu huhifadhi kwa karibu msisitizo wa Kiebrania na sauti tendwa, bila kuongeza maelezo kuhusu mamlaka au njia ya utekelezaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisheria. Ujenzi wa masharti ‘akimpiga’ ni wa kawaida na wenye mtiririko mzuri; ‘hakika atauawa’ hudumisha msisitizo wa fomula ya Kiebrania.
