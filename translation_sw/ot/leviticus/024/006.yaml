base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: sw
  text: Nawe utaziweka katika safu mbili[a], mikate sita katika kila safu, juu ya meza safi[b] mbele ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mipangilio miwili” au “katika marundo mawili”; neno la Kiebrania linamaanisha mikate iliyopangwa kwa utaratibu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, meza safi kwa maana ya kiibada, si kwamba haikuwa na uchafu wa kawaida tu. Pia inaweza kutafsiriwa “meza iliyo safi kiibada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Nawe utaiweka
  rationale: Kitenzi שׂוּם humaanisha kuweka au kupanga. Umbo la nafsi ya pili umoja wa kiume limehifadhiwa kwa ‘utaiweka’; kiwakilishi ‘-i-’ kinarejelea mikate kwa ujumla.
- source_word: אוֹתָם
  choice: -i- (katika ‘utaiweka’)
  rationale: Kiwakilishi cha shamirisho kinarejelea ile mikate kumi na miwili ya mstari uliotangulia. Kiswahili kwa kawaida hutumia ngeli ya mkusanyiko ‘mikate’ katika umoja wa kisarufi inapodokezwa kama kitu kimoja kilichopangwa.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: katika safu mbili
  rationale: מַעֲרָכָה ni mpangilio uliowekwa kwa utaratibu. ‘Safu’ ni neno la kawaida na la kueleweka katika muktadha wa mikate iliyopangwa mezani, huku tanbihi ikihifadhi uwezekano wa ‘mipangilio’ au ‘marundo.’
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: mikate sita katika kila safu
  rationale: Kirai cha Kiebrania ni kifupi, kihalisi ‘sita safu/mpangilio.’ Maana yake ya kugawanya sita kwa kila mpangilio imewekwa wazi kwa Kiswahili cha kawaida; ‘mikate’ imeongezwa kutokana na muktadha.
- source_word: עַל הַשֻּׁלְחָן
  choice: juu ya meza
  rationale: עַל humaanisha ‘juu ya’; huu ndio usemi wa kawaida wa Kiswahili kwa kitu kilichowekwa kwenye meza.
- source_word: הַטָּהֹר
  choice: safi
  rationale: טָהוֹר katika mazingira ya ibada humaanisha kilicho safi au takatifu kwa taratibu za ibada. ‘Safi’ ni Kiswahili cha kawaida na chenye hadhi; tanbihi inaeleza kwamba hapa si usafi wa kawaida tu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי ni ‘mbele ya/katika uwepo wa.’ Usemi ‘mbele za Yahweh’ ni wa asili katika Kiswahili cha kibiblia na huhifadhi wazo la kuwekwa katika uwepo wake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה. ‘Yahweh’ hulitaja moja kwa moja bila kulibadilisha kuwa cheo, na haliingizi msimamo wa dhehebu.
- issue: Maana ya kiibada ya הַטָּהֹר
  choice: meza safi
  alternative: meza iliyo safi kiibada / meza takatifu
  rationale: ‘Safi’ huhifadhi maana ya msingi ya טָהוֹר bila kuigeuza kuwa ‘takatifu,’ lakini tanbihi inaonyesha wazi kwamba usafi unaokusudiwa ni wa kiibada, si wa kimwili tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ya ibada ulio wa sasa na wenye hadhi. ‘Safu’ limetumiwa katika maandishi huku utata halisi wa מַעֲרָכָה ukihifadhiwa katika tanbihi. Jina ‘Yahweh’ limehifadhiwa kwa uwazi.
