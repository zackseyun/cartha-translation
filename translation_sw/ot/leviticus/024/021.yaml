base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: sw
  text: Yeyote anayemuua mnyama atalipa fidia kwa ajili ya mnyama huyo, lakini yeyote anayemuua mtu[a] atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno אָדָם (adam), yaani “mtu” au “mwanadamu.” Muundo wake hapa ni umoja wa kiume wa kisheria, lakini si lazima umaanishe mwanamume pekee.
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֵּה
  choice: anayemuua
  rationale: Ingawa kitenzi נכה kimsingi huhusu kupiga, katika muktadha huu matokeo yanayoelezwa—kulipa fidia kwa mnyama na kuuawa kwa aliyempiga mtu—yanaonyesha pigo linalosababisha kifo. “Anayemuua” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuacha uwezekano wa kuelewa kuwa ni pigo la kawaida tu.
- source_word: בְהֵמָה
  choice: mnyama
  rationale: Neno hili humaanisha mnyama, hasa mnyama wa kufugwa. “Mnyama” ni neno la kawaida na pana; “mifugo” lingekuwa jembamba kuliko neno la Kiebrania.
- source_word: יְשַׁלְּמֶנָּה
  choice: atalipa fidia ya mnyama huyo
  rationale: Kitenzi cha Kiebrania kinamaanisha kufidia au kulipa kilichoharibiwa. Kirai hiki kinaweka wazi kuwa fidia inatolewa kwa sababu ya mnyama aliyeuawa, huku kikirejelea kiambishi cha kike kinachorudi kwa בְהֵמָה.
- source_word: אָדָם
  choice: mtu
  rationale: Katika ulinganisho na mnyama, אָדָם humaanisha mtu mmoja, yaani mwanadamu. “Mtu” ni tafsiri ya kawaida na sahihi katika Kiswahili na hailazimishi maana ya mwanamume pekee ambayo neno la Kiebrania halidai hapa.
- source_word: יוּמָת
  choice: atauawa
  rationale: Hii ni kauli tendwa yenye maana ya kusababishwa afe katika tamko la kisheria. “Atauawa” huhifadhi kauli tendwa na hukumu ya kifo bila kuongeza istilahi maalumu isiyomo moja kwa moja katika maandishi.
theological_decisions:
- issue: Maana ya אָדָם katika sheria hii
  choice: mtu
  alternative: mwanamume
  rationale: אָדָם hapa humtofautisha mwanadamu na mnyama na kwa kawaida humaanisha mtu yeyote. Muundo wa Kiebrania ni umoja wa kiume katika tamko la kisheria, lakini hilo halithibitishi kuwa sheria inamhusu mwanamume pekee. Kiswahili “mtu” huhifadhi upeo mpana wa neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisheria, mfupi, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi ulinganifu wa vifungu viwili vya Kiebrania.
