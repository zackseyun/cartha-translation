source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: sw
  text: Mtu yeyote anayelikufuru jina la Yahwe hakika atauawa[a]. Kusanyiko lote hakika litampiga kwa mawe. Mgeni mkazi kama mzaliwa wa nchi—atakapolikufuru jina[b]—atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “analitamka jina la Yahwe” au “analilaani jina la Yahwe.” Kitenzi cha Kiebrania kinaweza kumaanisha kutaja au kutamka wazi, na katika muktadha huu pia kulitukana au kulikufuru.
    reason: lexical_alternative
  - marker: b
    text: Hapa Kiebrania kinasema “jina” bila kutaja “Yahwe”; neno hilo linatumika kwa heshima badala ya jina la Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב
  choice: anayelikufuru
  rationale: Kitenzi נקב kinaweza kumaanisha kutaja au kutamka wazi, na katika muktadha huu pia kueleweka kuwa kulitukana au kulikufuru jina la Mungu. “Kulitikufuru” huonyesha kosa la kulivunjia heshima jina hilo bila kudai kwamba kutamka jina peke yake ndilo kosa; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: שֵׁם יְהוָה
  choice: jina la Yahwe
  rationale: שֵׁם ni “jina,” na יְהוָה ni jina la agano la Mungu. “Yahwe” hulihamisha kama jina maalumu badala ya kulibadili kuwa cheo.
- source_word: מוֹת יוּמָת
  choice: hakika atauawa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kamili unasisitiza uhakika na wajibu wa hukumu ya kifo; kauli tendwa imehifadhiwa.
- source_word: רָגוֹם יִרְגְּמוּ בּוֹ
  choice: hakika litampiga kwa mawe
  rationale: Kurudiwa kwa mzizi wa kitenzi kunatia mkazo. “Kumpiga kwa mawe” ni Kiswahili cha kawaida kinachoeleza wazi namna ya kutekeleza hukumu.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה ni jumuiya iliyokusanyika katika nafasi yake ya kijamii na kisheria. “Kusanyiko lote” huhifadhi maana hiyo ya pamoja.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: mgeni mkazi na mzaliwa wa nchi vilevile
  rationale: גֵּר ni mtu asiye mzawa anayeishi kati ya Israeli, naye אֶזְרָח ni mwenyeji aliyezaliwa katika nchi au jumuiya hiyo. Tafsiri inaweka wazi kwamba sheria inawahusu wote sawasawa.
- source_word: בְּנָקְבוֹ שֵׁם
  choice: atakapolikufuru Jina
  rationale: 'ב pamoja na kitenzi-jina huonyesha wakati au hali: “atakapo-.” “Jina” limesimama peke yake hapa kama namna ya heshima ya kurejelea jina la Mungu.'
- source_word: יוּמָת
  choice: atauawa
  rationale: Kauli tendwa ya kisheria imehifadhiwa, ikionyesha kutekelezwa kwa hukumu badala ya kusema tu kwamba mtu huyo atakufa.
theological_decisions:
- issue: Uhamishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina la agano bila kulibadili kuwa cheo.
- issue: Maana ya נקב inapohusishwa na jina la Mungu
  choice: kulikufuru
  alternative: kulitamka; kulitaja wazi; kulilaani
  rationale: Muktadha wa kisheria unaonyesha matumizi yanayolitia unajisi au kulivunjia heshima jina la Mungu. Hata hivyo, kwa kuwa upeo wa maana ya mzizi huo unabishaniwa, maana mbadala zimewekwa katika tanbihi badala ya kuondoa utata.
- issue: Usawa wa mgeni mkazi na mzaliwa wa nchi chini ya hukumu hii
  choice: mgeni mkazi na mzaliwa wa nchi vilevile
  alternative: mgeni kama mzawa
  rationale: Muundo כַּגֵּר כָּאֶזְרָח unasisitiza kwamba hadhi ya asili haibadili matumizi ya sheria hii; tafsiri haiongezi wala kupunguza upeo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa urahisi. “Hakika atauawa” na “hakika litampiga” zinahifadhi msisitizo wa miundo ya Kiebrania. Alama [b] imewekwa baada ya “Jina,” sehemu inayohusika moja kwa moja na maelezo ya tanbihi.
