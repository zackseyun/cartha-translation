  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: sw
  text: 'Nawe utawaambia wana wa Israeli[a] hivi: “Mtu yeyote[b] akimlaani Mungu wake, atabeba dhambi yake[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli.” Maneno haya yanawarejelea watu wa Israeli kwa ujumla.'
    reason: lexical_alternative
  - marker: b
    text: 'Au “mwanamume yeyote.” Kiebrania hurudia neno “mwanamume” ili kusisitiza kila mmoja: “mwanamume, mwanamume.”'
    reason: lexical_alternative
  - marker: c
    text: “Kubeba dhambi yake” ni nahau ya Kiebrania inayomaanisha kubeba hatia au kuwajibika kwa kosa hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל תְּדַבֵּר לֵ/אמֹר
  choice: Nawe utawaambia wana wa Israeli hivi
  rationale: Muundo huu unatoa agizo lililoelekezwa kwa Musa pamoja na utangulizi wa maneno yatakayofuata kwa Kiswahili cha kawaida na chenye hadhi. ‘Wana wa Israeli’ huhifadhi picha ya kifamilia ya Kiebrania.
- source_word: אִישׁ אִישׁ
  choice: Mtu yeyote
  rationale: Kurudiwa kwa ‘mtu/mwanamume’ katika Kiebrania kuna nguvu ya kugawa na kujumuisha kila mmoja; ‘mtu yeyote’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuiga urudiaji usio wa kawaida.
- source_word: יְקַלֵּל
  choice: akimlaani
  rationale: Kitenzi קלל katika piel hapa humaanisha kulaani au kutendea kwa dharau. ‘Akimlaani’ huhifadhi maana ya moja kwa moja bila kuingiza mapema dhana mahsusi zaidi ya kukufuru inayojitokeza katika mstari unaofuata.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiwakilishi cha nafsi ya tatu umoja kimehifadhiwa. Tafsiri haibadilishi neno hili kuwa ‘BWANA,’ kwa kuwa mstari huu unasema kwa upana ‘Mungu wake.’
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: atabeba dhambi yake
  rationale: Tafsiri inahifadhi nahau ya Kiebrania ya ‘kubeba dhambi,’ huku tanbihi ikifafanua maana ya kubeba hatia au kuwajibika kwa kosa.
theological_decisions:
- issue: Upeo wa אֱלֹהָיו
  choice: Mungu wake
  alternative: BWANA; Mungu
  rationale: Kiwakilishi ‘wake’ na kutokutajwa kwa jina la agano vimehifadhiwa ili kutopunguza upeo wa maneno ya Kiebrania wala kuchanganya kosa hili na kosa mahsusi la mstari unaofuata.
- issue: Mhusika wa sheria katika אִישׁ אִישׁ
  choice: Mtu yeyote
  alternative: Mwanamume yeyote; kila mwanamume
  rationale: Katika mtindo huu wa sheria, urudiaji wa nomino ya kiume una nguvu ya kumhusu kila mtu mmoja mmoja. Kiswahili ‘mtu yeyote’ hutoa nguvu hiyo ya ugawaji kwa kawaida; tanbihi huhifadhi taarifa ya umbo halisi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sheria umewekwa wazi bila kuondoa nahau muhimu ya Kiebrania.
