  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: sw
  text: Waagize wana wa Israeli[a] wakuletee mafuta safi ya zeituni yaliyopondwa[b] kwa ajili ya mwanga, ili taa iwake daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli,” jina la kawaida la kiagano.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mafuta ya zeituni yaliyo safi, yanayopatikana kwa kuponda zeituni.
    reason: lexical_clarification
lexical_decisions:
- source_word: צַו
  choice: Waagize
  rationale: Kitenzi hiki cha amri kinaonyesha mamlaka ya agizo la Mungu, huku ‘waagize’ kikisikika cha kawaida na chenye heshima katika Kiswahili cha sasa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi usemi wa Kiebrania ‘wana wa Israeli,’ ambao ni jina la kawaida la watu wa agano, badala ya kuufupisha moja kwa moja kuwa ‘Waisraeli.’
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: wakuletee
  rationale: Ingawa לקח kwa kawaida ni ‘chukua,’ pamoja na ‘kwako’ hapa tendo linalokusudiwa ni kuleta au kuwasilisha kwa Musa.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: mafuta safi ya zeituni zilizopondwa
  rationale: Tafsiri hii inaonyesha chanzo cha mafuta, usafi wake, na kwamba zeituni zilipondwa ili kuyapata.
- source_word: לַמָּאוֹר
  choice: kwa ajili ya mwanga
  rationale: Hufuata maana ya msingi ya מָאוֹר, yaani mwanga au uangazaji, bila kuingiza moja kwa moja kinara cha taa katika maneno yenyewe.
- source_word: לְהַעֲלֹת נֵר
  choice: ili taa iwake
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa nahau ya Kiebrania inayomaanisha kuwasha au kudumisha taa ikiwaka.
- source_word: תָּמִיד
  choice: daima
  rationale: Huwasilisha mwendelezo wa wajibu wa ibada unaoonyeshwa na neno hili katika muktadha.
theological_decisions:
- issue: Jina la kiagano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Matini kuu inadumisha umbo rasmi la Kiebrania bila kuamua kimya kimya kwamba usemi huo ni jina la kikabila lisilo na picha ya uhusiano wa ukoo; tanbihi inatoa maumbo ya kawaida zaidi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Usemi ‘wana wa Israeli’ umehifadhiwa kwa ulinganifu wa kimatini; ‘wakuletee’ na ‘ili taa iwake’ zinawasilisha nahau za Kiebrania kwa Kiswahili cha kawaida.
