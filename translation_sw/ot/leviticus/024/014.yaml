language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: sw
  text: “Mtoe nje ya kambi yule aliyelaani[a]. Wote waliosikia waweke mikono yao juu ya kichwa chake[b], na kusanyiko lote limpige kwa mawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule aliyekufuru.” Kiebrania husema kwa maana ya moja kwa moja, “yule aliyelaani.”
    reason: alternative_reading
  - marker: b
    text: Kuweka mikono hapa huenda kulionyesha kwamba waliosikia walimtambulisha rasmi mkosaji; hata hivyo, wengine huona pia maana ya kiishara katika kitendo hicho.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: Mtoe nje
  rationale: Kauli ya kuamuru katika shina la kusababisha ina maana ya kumsababisha mtu atoke; ‘mtoe nje’ ni ya kawaida katika Kiswahili na inaendana na mahali panapotajwa.
- source_word: הַמְקַלֵּל
  choice: yule aliyelaani
  rationale: Neno hili ni umbo la kishiriki cha kitenzi קלל, ‘kulaani,’ na linamtaja mkosaji maalumu katika muktadha. Tafsiri hii huhifadhi maana ya moja kwa moja bila kuingiza ‘aliyekufuru’ katika matini kuu.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Ni usemi wa kawaida wa mahali unaohifadhi mazingira ya jumuiya iliyopiga kambi.
- source_word: וְסָמְכוּ
  choice: waweke
  rationale: Pamoja na ‘mikono ... juu ya kichwa,’ kitenzi hiki kinaeleza kitendo cha kuweka mikono. Umbo hili la Kiswahili huendeleza nguvu ya amri ya mwanzo kwa kawaida.
- source_word: כָל הַשֹּׁמְעִים
  choice: wote waliosikia
  rationale: Huhifadhi umbo la jumla la Kiebrania bila kuongeza kitu kilichosikiwa au aliyesikiwa, ambacho hakikutajwa wazi katika kishazi hiki.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: mikono yao juu ya kichwa chake
  rationale: Huhifadhi wingi wa ‘mikono’ na umoja wa ‘kichwa’ kwa Kiswahili cha kawaida.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: limpige kwa mawe
  rationale: Kitenzi רגם hueleza kupiga mtu kwa mawe; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: כָל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika. ‘Kusanyiko lote’ huhifadhi maana rasmi na ya kijumuiya.
theological_decisions:
- issue: Iwapo mkosaji aitwe ‘yule aliyelaani’ au ‘aliyekufuru’
  choice: yule aliyelaani
  alternative: aliyekufuru
  rationale: Neno la Kiebrania limetokana moja kwa moja na קלל, ‘kulaani.’ Ingawa muktadha unahusu kulilaani Jina la Mungu na hivyo ‘aliyekufuru’ ni tafsiri halali ya kimuktadha, matini kuu huhifadhi maana ya kimsamiati na tanbihi hutaja tafsiri nyingine.
- issue: Maana ya kuweka mikono juu ya kichwa chake
  choice: Kitendo halisi kimetafsiriwa bila kukifafanua katika matini kuu.
  alternative: Kukitafsiri kama utambulisho rasmi wa mkosaji na mashahidi, au kama ishara ya kuhamisha hatia.
  rationale: Aya inaamuru kitendo hicho lakini haielezi wazi maana yake. Tafsiri haichagui maana moja ya kiishara ambayo matini yenyewe haijaitaja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. ‘Mtoe nje,’ ‘waweke mikono,’ na ‘limpige kwa mawe’ hudumisha mtiririko wa amri. Alama zote za tanbihi zimewekwa katika matini kuu.
