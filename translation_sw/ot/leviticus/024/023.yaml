  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: sw
  text: Basi Musa akawaambia wana wa Israeli, nao wakamtoa nje ya kambi yule aliyelaani[a], wakampiga kwa mawe. Hivyo wana wa Israeli wakafanya kama Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule aliyekufuru.” Neno la Kiebrania kwa tafsiri ya moja kwa moja ni “yule aliyelaani,” likimrejelea mtu aliyelitukana Jina la Mungu katika mistari iliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akawaambia
  rationale: Katika muktadha huu, דִּבֵּר אֶל ina maana ya kusema au kunena na watu fulani. “Akawaambia” ni Kiswahili cha kawaida na wazi kinachoonyesha kuwa Musa aliwasilisha agizo kwa wana wa Israeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi nahau ya Kiebrania kwa namna inayoeleweka katika Kiswahili cha kibiblia, huku ikirejelea jamii ya Israeli.
- source_word: וַיּוֹצִיאוּ
  choice: wakamtoa nje
  rationale: Hifili ya יצא humaanisha kusababisha mtu atoke, yaani kumtoa. Usemi “wakamtoa nje ya kambi” ni wa asili katika Kiswahili.
- source_word: הַמְקַלֵּל
  choice: yule aliyekuwa amelaani
  rationale: Kirai hiki ni umbo la kishiriki la קלל, “kulaani,” na kinamrejelea mtu aliyelitukana Jina katika muktadha uliotangulia. Tafsiri hii huhifadhi maana ya moja kwa moja bila kuingiza neno lenye ufafanuzi mpana zaidi katika matini kuu.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Hii ndiyo njia ya kawaida na wazi ya kueleza mahali nje ya mipaka ya kambi baada ya kitenzi cha mwendo.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: wakampiga kwa mawe
  rationale: Tafsiri hii inaonyesha wazi kitendo cha kumpiga mtu kwa mawe na pia huhifadhi kutajwa kwa “mawe” katika Kiebrania.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: wakafanya kama ... alivyomwamuru
  rationale: Huhifadhi muundo unaofupisha utii wa Israeli kwa agizo lililotolewa awali.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya matamshi ya Kiswahili badala ya kubadilishwa na cheo kama “BWANA.”
theological_decisions:
- issue: Iwapo הַמְקַלֵּל itafsiriwe kwa neno lenye maana mahsusi ya kukufuru
  choice: yule aliyekuwa amelaani
  alternative: yule aliyekufuru
  rationale: Ingawa muktadha unahusu kulaani Jina la Mungu, neno la mstari huu ni kishiriki cha קלל, “kulaani.” Matini kuu kwa hiyo inadumisha maana hiyo ya moja kwa moja, huku tanbihi ikitaja tafsiri mbadala inayotokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Wana wa Israeli” inadumisha nahau ya chanzo, na “Yahwe” huhifadhi jina binafsi la Mungu.
