source:
  edition: WLC
  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: sw
  text: Mwana wa mwanamke Mwisraeli alilitamka Jina[a] kisha akalaani. Basi wakamleta kwa Musa. Jina la mama yake lilikuwa Shelomithi binti Dibri, wa kabila la Dani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikufuru Jina.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa “alitaja wazi” au, katika muktadha huu, kuwa sehemu ya tendo la kukufuru.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: alilitamka
  rationale: Kitenzi נקב kinaweza kumaanisha kutaja au kutamka wazi. Pamoja na אֶת־הַשֵּׁם, tafsiri hii inadumisha tofauti kati ya kutamka Jina na tendo linalofuata la kulaani, bila kuficha uwezekano wa maana ya kukufuru ulioelezwa katika tanbihi.
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: Mwana wa yule mwanamke Mwisraeli
  rationale: Hii inafuata muundo wa Kiebrania na kumtambulisha mwana kwa kurejelea mwanamke Mwisraeli aliyetajwa katika muktadha.
- source_word: אֶת הַשֵּׁם
  choice: Jina
  rationale: Herufi kubwa inaonyesha kuwa hapa ni rejeo la heshima kwa Jina la Mungu, bila kuingiza jina maalumu lisiloandikwa katika mstari.
- source_word: וַיְקַלֵּל
  choice: kisha akalaani
  rationale: קלל katika piel humaanisha kulaani. Neno “kisha” linaonyesha hatua inayofuata katika simulizi bila kutaja mlengwa wa laana ambaye Kiebrania hakumtaji wazi katika kishazi hiki.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: Basi wakamleta kwa Musa
  rationale: Wingi usio na mtendaji aliyetajwa unahifadhiwa kwa “wakamleta,” na “basi” linaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: וְשֵׁם אִמּוֹ
  choice: Jina la mama yake lilikuwa
  rationale: Tafsiri ya moja kwa moja na ya asili inayotambulisha taarifa ya ziada kuhusu ukoo wake.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: Shelomithi binti Dibri
  rationale: Majina yamenukuliwa kwa maumbo yanayosomeka kwa Kiswahili, huku uhusiano wa kifamilia ukihifadhiwa kwa “binti.”
- source_word: לְמַטֵּה דָן
  choice: wa kabila la Dani
  rationale: Nahau hii inaonyesha uhusiano wa kikabila; “wa kabila la Dani” ni Kiswahili wazi na cha kawaida.
theological_decisions:
- issue: Maana ya נקב inapofuatwa na “Jina” katika muktadha wa kukufuru
  choice: Kutamka Jina, kisha kulaani kama tendo tofauti
  alternative: Kukufuru Jina, kisha kulaani
  rationale: Kiebrania kina vitenzi viwili, נקב na קלל. Tafsiri kuu inavihifadhi kama matendo mawili bila kuamua kwa nguvu kwamba kitenzi cha kwanza chenyewe kinamaanisha kukufuru; tanbihi inatunza usomaji huo mbadala unaofaa muktadha.
- issue: Mlengwa wa וַיְקַלֵּל
  choice: 'Kuacha mlengwa bila kutajwa: “akalaani”'
  alternative: “akalilaani Jina” au “akamlaani Mungu”
  rationale: Kishazi cha Kiebrania hakirudii kiambishi cha mlengwa baada ya kitenzi hiki. Kutomwongeza mlengwa kunahifadhi ukosefu huo wa ubainifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Jina” limeandikwa kwa herufi kubwa kama rejeo la heshima kwa Jina la Mungu. “Kisha” linaweka wazi mfuatano wa vitenzi viwili bila kuondoa utata wa kileksika wa נקב.
