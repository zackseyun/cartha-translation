base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: sw
  text: Itakuwa ya Haruni na wanawe, nao wataila mahali patakatifu, kwa maana ni takatifu sana kwake, kutoka katika sadaka za Yahwe zinazotolewa kwa moto[a]; hii ni sheria ya kudumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za chakula za Yahwe.” Neno la Kiebrania kwa mapokeo hurejelea sadaka zinazowasilishwa kwa moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: Itakuwa ya Haruni na wanawe
  rationale: Muundo wa היה pamoja na לְ unaonyesha umiliki au sehemu iliyotengewa mtu. “Itakuwa ya” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisheria.
- source_word: וַאֲכָלֻהוּ
  choice: nao wataila
  rationale: Kitenzi kinaendeleza agizo la kisheria. Kiambishi cha yambwa -i- kinarejelea mkate unaozungumziwa katika muktadha.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: mahali patakatifu
  rationale: Kiebrania hakina kibainishi kinacholazimisha maana ya chumba maalumu cha patakatifu; tafsiri hii inaacha upeo huo wazi.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Huu ni usemi wa Kiebrania unaoonyesha kiwango cha juu kabisa cha utakatifu. “Takatifu sana” ni wa kawaida na haudokezi kimakosa chumba cha Patakatifu pa Patakatifu.
- source_word: הוּא לוֹ
  choice: kwake ni takatifu sana
  rationale: Tafsiri inadumisha kiwakilishi cha umoja cha Kiebrania, kinachomrejelea Haruni, badala ya kukibadili kimya kuwa wingi.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: miongoni mwa sadaka za Yahwe zinazotolewa kwa moto
  rationale: מִן hapa ina maana ya sehemu kutoka katika kundi, hivyo “miongoni mwa” inafaa. “Sadaka zinazotolewa kwa moto” huhifadhi tafsiri ya kimapokeo ya אִשֶּׁה bila kudokeza kwamba sadaka yote lazima iteketezwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: חָק עוֹלָם
  choice: agizo la kudumu
  rationale: Usemi huu unaonyesha sheria iliyoamriwa kuendelea; “agizo la kudumu” ni wazi, wa kisasa, na wenye hadhi.
theological_decisions:
- issue: Kirejeleo cha kiwakilishi cha umoja לוֹ baada ya kutajwa Haruni na wanawe
  choice: kwake
  alternative: kwao
  rationale: Kiebrania kina umoja. Kuuhifadhi kunamwonyesha Haruni akiwa kichwa mwakilishi wa ukoo wa kikuhani bila kusawazisha mvutano wa kisarufi uliopo katika matini.
- issue: Maana ya אִשֶּׁה katika lugha ya sadaka
  choice: sadaka zinazotolewa kwa moto
  alternative: sadaka za chakula
  rationale: Tafsiri ya kimapokeo inahusisha neno hili na sadaka zinazowasilishwa kwa moto, lakini kuna uchambuzi mwingine unaolielewa kama zawadi ya chakula. Tofauti hiyo imehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo wa sentensi umeweka wazi umiliki, ulaji mahali patakatifu, na msingi wa agizo bila kuongeza maelezo ya kimadhehebu.
