  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: sw
  text: Juu ya kinara cha taa kilicho safi atazipanga taa mbele ya Yahwe daima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ukawaida.” Kiebrania kinaweza kueleza mwendelezo au tendo linalofanywa tena na tena kwa utaratibu.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  choice: Juu ya
  rationale: Inaonyesha mahali taa zilipowekwa kuhusiana na kinara, kwa namna ya kawaida na iliyo wazi katika Kiswahili.
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: Neno hili linataja kifaa maalumu cha ibadani kilichoshikilia taa, si taa moja tu.
- source_word: הַטְּהֹרָה
  choice: safi
  rationale: Katika muktadha wa kikuhani, neno hili linaweza kuonyesha usafi wa kiibada; “safi” ni tafsiri fupi isiyoongeza maelezo yasiyokuwamo.
- source_word: יַעֲרֹךְ
  choice: atazipanga
  rationale: Kitenzi kina maana ya kuweka au kupanga kwa utaratibu; kiambishi cha yambwa kinarejelea taa.
- source_word: הַנֵּרוֹת
  choice: taa
  rationale: Linarejelea taa mbalimbali zilizokuwa juu ya kinara; Kiswahili hutumia umbo lilelile kwa umoja na wingi katika ngeli hii.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi usemi wa kiibada wenye maana ya kuwa mbele au katika uwepo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina la Mungu, YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: תָּמִיד
  choice: daima
  rationale: Huwasilisha mwendelezo au utendaji wa kudumu na wa kawaida katika muktadha huu wa ibada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu YHWH; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תָּמִיד katika agizo la ibada
  choice: daima
  alternative: kwa ukawaida
  rationale: “Daima” huhifadhi wazo la mwendelezo bila kuamua kimya kimya kama maana ni kutokoma kabisa au kurudiwa kwa ukawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Mpangilio wa sentensi unafuata Kiebrania kwa ukaribu bila kuwa mgumu; “kinara cha taa” huepuka utohozi usio wa lazima, na “Yahwe” huhifadhi jina la Mungu.
