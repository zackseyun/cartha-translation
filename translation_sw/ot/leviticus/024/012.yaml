  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: sw
  text: Basi wakamweka chini ya ulinzi, ili jambo hilo liwekwe wazi kwao[a] kulingana na neno la Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “litangazwe wazi kwao.” Kitenzi cha Kiebrania kinaweza kumaanisha kufanya jambo lieleweke wazi au kulitangaza kwa uwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: Basi wakamweka
  rationale: Kitenzi hiki katika umbo la kisababishi kina maana ya ‘kuweka’ au ‘kuacha mahali.’ ‘Basi’ linaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: בַּמִּשְׁמָר
  choice: chini ya ulinzi
  rationale: Neno hili hapa linamaanisha kushikiliwa mahali penye ulinzi, si kutazamwa tu. Usemi huu ni wa kawaida na unaafiki mazingira ya kisheria.
- source_word: לִפְרֹשׁ
  choice: ili jambo hilo liwekwe wazi
  rationale: Kitenzi kinaweza kumaanisha kuweka wazi, kufafanua, au kutangaza wazi. ‘Jambo hilo’ linadokezwa na muktadha lakini halitajwi moja kwa moja katika Kiebrania; limeongezwa ili sentensi iwe ya kawaida na wazi kwa Kiswahili bila kulifanya kuwa ‘uamuzi’ mahsusi.
- source_word: לָהֶם
  choice: kwao
  rationale: Kiwakilishi hiki kinawahusu wale waliokuwa wakisubiri jambo hilo lifafanuliwe. ‘Kwao’ linaendana kiasili na usemi ‘liwekwa wazi.’
- source_word: עַל־פִּי
  choice: kulingana na neno la
  rationale: Nahau hii, kihalisi ‘juu ya kinywa cha,’ huonyesha kufuata tamko lenye mamlaka. ‘Kulingana na neno la’ linahifadhi wazo la tamko bila kulibana kuwa amri pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kitu kinachowekwa wazi katika לִפְרֹשׁ
  choice: jambo hilo liwekwe wazi kwao
  alternative: uamuzi uwekwe wazi kwao
  rationale: Muktadha ni wa kisheria, lakini Kiebrania hakitaji wazi ‘uamuzi.’ Tafsiri hii inahifadhi kutotajwa huko huku ikifanya Kiswahili kiwe cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Chini ya ulinzi’ linaeleweka kwa wasomaji wa kawaida, na ‘jambo hilo liwekwe wazi’ linahifadhi upana wa Kiebrania bila kuingiza uamuzi mahsusi ambao haukutajwa wazi.
