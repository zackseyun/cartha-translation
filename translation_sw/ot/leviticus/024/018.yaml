  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: sw
  text: 'Na yeyote atakayemuua mnyama atalipa fidia kwa ajili yake: uhai badala ya uhai[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “uhai badala ya uhai.” Katika muktadha huu wa kulipa fidia kwa mnyama, maneno haya yanaonyesha fidia inayolingana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה
  choice: Na yeyote atakayemuua
  rationale: Hifili ya נכה pamoja na kitu ‘uhai wa mnyama’ inaeleza kitendo kinachosababisha kifo. ‘Atakayemuua’ ni Kiswahili cha kawaida na wazi katika sheria ya jumla.
- source_word: נֶפֶשׁ בְּהֵמָה
  choice: mnyama
  rationale: Kiebrania kihalisi kina ‘uhai wa mnyama,’ yaani mnyama mwenyewe katika muktadha wa kuuawa. Kiswahili cha asili husema ‘kumuua mnyama’ bila kudokeza wazo la nafsi isiyo ya mwili.
- source_word: בְּהֵמָה
  choice: mnyama
  rationale: Neno hili kwa jumla humaanisha mnyama, ingawa katika muktadha huu anachukuliwa kuwa mali ya mtu. ‘Mnyama’ huhifadhi upana wa neno kuliko ‘mifugo.’
- source_word: יְשַׁלְּמֶנָּה
  choice: atalipa fidia kwa ajili yake
  rationale: Pieli ya שלם hapa inadai malipo au urejeshaji kwa hasara iliyosababishwa; kiambishi cha kike kinamrejelea mnyama.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: uhai badala ya uhai
  rationale: Huhifadhi kwa karibu fomula ya Kiebrania na dhana yake ya ulinganifu, bila kuamua kimya-kimya kama fidia hiyo lazima iwe mnyama mwingine au thamani yake.
theological_decisions:
- issue: Maana ya fomula ya malipo katika sheria inayomhusu mnyama
  choice: Fidia inayolingana inadaiwa kwa kumuua mnyama, huku maneno ‘uhai badala ya uhai’ yakihifadhiwa.
  alternative: Inaweza kueleweka kuwa lazima mnyama mwingine atolewe moja kwa moja badala ya yule aliyeuawa.
  rationale: Kitenzi ‘atalipa fidia’ kinaongoza maana ya kifungu. Tafsiri haiongezi utaratibu mahsusi wa malipo ambao mstari wenyewe hauuelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Atakayemuua’ ni wazi zaidi kuliko tafsiri ya neno kwa neno ya ‘atakayepiga uhai wa mnyama’; ‘fidia’ huwasilisha maana ya kisheria ya malipo bila kuifanya sentensi kuwa nzito.
