id: LEV.24.3
reference: Leviticus 24:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: sw
  text: Nje ya pazia la Ushuhuda[a], ndani ya Hema la Kukutania, Haruni ataipanga tangu jioni mpaka asubuhi mbele za Yahwe daima[b]. Hii ni sheria ya kudumu[c] katika vizazi vyenu vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pazia la ushuhuda.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “daima” humaanisha kuendelea kutekeleza ibada hii kwa ukawaida, kama ilivyoagizwa, “tangu jioni mpaka asubuhi.”
    reason: cultural_note
  - marker: c
    text: Au, “sheria ya milele” au “sheria isiyokoma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: Nje ya pazia la Ushuhuda
  rationale: Kifungu hiki kinaonyesha mahali palipo nje ya pazia la ndani la patakatifu. “Ushuhuda” linahifadhi istilahi ya kiibada bila kuifafanua kupita kiasi kuwa vibao vya agano.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ndani ya Hema la Kukutania
  rationale: Hili ni jina la kawaida la mahali patakatifu pa hema; “ndani ya” huonyesha wazi eneo linalokusudiwa.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: ataipanga
  rationale: Kitenzi ערך kina maana ya kupanga au kuweka kwa utaratibu katika mazingira ya kikuhani. Kiambishi cha ngeli “-i-” kinarejelea taa iliyotajwa katika muktadha uliotangulia.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: tangu jioni mpaka asubuhi
  rationale: Tafsiri hii ya kawaida na ya asili inahifadhi muda kamili unaotajwa na Kiebrania.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” huwasilisha wazo la kuwa katika uwepo wa Mungu katika mazingira ya ibada, na Yahwe huhifadhi jina la agano יהוה.
- source_word: תָּמִיד
  choice: daima
  rationale: Katika sheria za kikuhani neno hili linaweza kumaanisha utendaji wa kawaida unaoendelea; hapa mipaka yake inaelezwa kuwa tangu jioni mpaka asubuhi.
- source_word: חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  rationale: Kifungu kinaeleza agizo lenye nguvu ya kuendelea. “Ya kudumu” ni Kiswahili cha sasa na chenye hadhi bila kulazimisha maana moja ya kifalsafa ya umilele.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Hii huonyesha kwamba agizo linawahusu watu katika vizazi vinavyofuatana.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya תָּמִיד katika ibada ya taa
  choice: daima
  alternative: kwa ukawaida au kila usiku
  rationale: “Daima” huhifadhi upana wa neno la Kiebrania, huku maneno “tangu jioni mpaka asubuhi” yakizuia lisieleweke kimakosa kuwa taa iliwaka bila kukoma mchana na usiku.
- issue: Muda unaoonyeshwa na חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  alternative: sheria ya milele
  rationale: “Ya kudumu” huonyesha uendelevu wa agizo katika vizazi bila kuamua kimbele mjadala wa kitheolojia kuhusu upeo wa עוֹלָם.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Istilahi “Hema la Kukutania,” “Ushuhuda,” na “Yahwe” zimehifadhi uzito wa mazingira ya kiibada. Mpangilio wa maneno unafuata kwa karibu mtiririko wa Kiebrania bila kufanya sentensi kuwa ngumu.
