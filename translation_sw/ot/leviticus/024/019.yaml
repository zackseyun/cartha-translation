  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: sw
  text: Na mtu akimjeruhi mwenzake[a], kama alivyofanya, ndivyo atakavyofanyiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “akimpa mwenzake dosari au kilema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Na mtu aki-
  rationale: Muundo huu wa sheria unaanzisha hali ya masharti. Kiswahili cha sasa hutumia kwa kawaida ‘mtu aki-’, huku ‘Na’ likidumisha uhusiano na masharti yaliyotangulia.
- source_word: יִתֵּן מוּם
  choice: akimjeruhi
  rationale: Kifungu hiki kihalisi ni ‘akimpa dosari/kilema’; katika muktadha wa madhara ya mwili, ‘akimjeruhi’ hutoa maana ya kisheria kwa Kiswahili cha kawaida bila kugeuza tendo kuwa jambo lisilo la kimwili.
- source_word: מוּם
  choice: jeraha
  rationale: Neno linaweza kumaanisha dosari, kilema, au kasoro ya mwili. Hapa ‘jeraha’ linafaa kwa muktadha wa madhara ya mwili, huku tanbihi ikihifadhi taswira halisi ya dosari au kilema.
- source_word: בַּעֲמִיתוֹ
  choice: mwenzake
  rationale: ‘Mwenzake’ ni neno la kawaida na lenye heshima kwa mshirika au mtu mwingine wa jumuiya; halipunguzi maana iwe rafiki wa karibu tu.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: kama alivyofanya
  rationale: Huhifadhi ulinganifu wa moja kwa moja kati ya tendo na adhabu bila kuongeza ufafanuzi.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: ndivyo atakavyofanyiwa
  rationale: Kauli tendwa huhifadhi hali ya kisheria isiyomtaja mtekelezaji, na huepuka kuwasilisha kanuni hii kama kisasi cha mtu binafsi.
theological_decisions:
- issue: Kanuni ya malipo yanayolingana katika muktadha wa sheria
  choice: 'Kauli imetafsiriwa kama kanuni ya kisheria ya adhabu inayolingana: ‘ndivyo atakavyofanyiwa.’'
  alternative: Kutafsiri kwa namna inayodokeza kisasi cha moja kwa moja kinachotekelezwa na mtu aliyejeruhiwa.
  rationale: Kiebrania kinatumia kauli tendwa na hakimtaji mtekelezaji. Tafsiri inadumisha nguvu hiyo ya kisheria bila kuingiza wazo la kisasi binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kisheria lakini inaeleweka kwa msomaji wa kawaida; kauli tendwa imehifadhiwa ili kuakisi muundo wa chanzo.
