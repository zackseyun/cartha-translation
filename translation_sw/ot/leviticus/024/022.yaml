    issue: “kiwango kimoja cha hukumu” is slightly unnatural and potentially overly literal.
    rationale: Although understandable, “kiwango” commonly denotes a measure, level, or standard. “Kanuni moja ya hukumu” more idiomatically expresses one governing judicial rule without changing the verse’s legal meaning.
