  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: sw
  text: Kanuni moja ya hukumu itawahusu mgeni na mzawa sawasawa, kwa maana mimi ni BWANA, Mungu wenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפַּט אֶחָד
  choice: kiwango kimoja cha hukumu
  rationale: Neno מִשְׁפָּט linaweza kumaanisha hukumu, sheria, au haki. Katika muktadha huu, usemi huu unasisitiza kuwa kanuni ileile ya kutoa hukumu itumike kwa wote.
- source_word: גֵּר
  choice: mgeni
  rationale: Hapa גֵּר humaanisha mtu asiye mzawa anayeishi miongoni mwa Israeli; “mgeni” ni neno la kawaida na linaloeleweka katika Kiswahili, ingawa si lazima limaanishe mgeni wa muda mfupi.
- source_word: אֶזְרָח
  choice: mzawa
  rationale: Neno hili humaanisha mwenyeji wa asili au mwananchi mzaliwa wa nchi, likitofautishwa na גֵּר.
- source_word: יְהוָה
  choice: BWANA
  rationale: Utamaduni mpana wa Biblia za Kiswahili huwakilisha jina la agano YHWH kwa “BWANA” kwa herufi kubwa.
theological_decisions:
- issue: Usawa wa kisheria kati ya mgeni na mzawa
  choice: kwa mgeni na kwa mzawa
  alternative: mgeni atakuwa kama mzawa
  rationale: Muundo huu unahifadhi ulinganifu wa Kiebrania na unaonyesha wazi kuwa kiwango kilekile cha hukumu kinawahusu wote, bila kuongeza maelezo ya kisasa yasiyopo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Mtakuwa na” limetumiwa kwa maana ya wajibu wa kudumu wa jumuiya; “kwa maana” linaonyesha msingi wa amri katika utambulisho wa BWANA kuwa Mungu wao.
