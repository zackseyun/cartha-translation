review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the single, equal legal standard expressed by מִשְׁפָּט אֶחָד and accurately identifies the two groups, the resident foreigner (גֵּר) and the native-born person (אֶזְרָח). “Mtakuwa na” is a permissible rendering of יִהְיֶה לָכֶם. However, “kiwango kimoja cha hukumu” is somewhat cumbersome in Swahili and can sound like a quantitative measure rather than one legal norm.
  naturalness: A more idiomatic formulation is to make the legal norm the subject and state that it applies equally to both persons. This retains the formal, scriptural register while reading smoothly in Standard East African Swahili.
  terminology: “Mgeni” is acceptable here if understood as a non-native resident, and “mzawa” appropriately renders the native-born contrast. “BWANA” appropriately follows established Swahili Bible convention for YHWH. “Kanuni moja ya hukumu” gives the intended legal-standard sense more naturally than “kiwango kimoja cha hukumu.”
  issues:
