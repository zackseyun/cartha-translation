id: LEV.24.1
reference: Leviticus 24:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: Kisha Yahwe akamwambia Mose[a], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.” Pia: “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi. Kiswahili cha kawaida hutumia “Kisha” pamoja na wakati wa ka katika “akamwambia.” Kitenzi “akamwambia” kinaonyesha kwa kawaida kwamba maneno yalielekezwa kwa Mose.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la Kiswahili la jina la Mungu יהוה, badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: אֶל
  choice: -mwambia
  rationale: Mwelekeo unaoonyeshwa na אֶל umejumuishwa kwa njia ya kawaida katika kitenzi cha Kiswahili “akamwambia.”
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina מֹשֶׁה.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivu hii huanzisha maneno yanayofuata; “akisema” huhifadhi muundo wa usemi wa Kiebrania kwa Kiswahili cha heshima na kinachoeleweka.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine za kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kisha ... akamwambia” ni simulizi la kawaida; “akisema” limehifadhiwa kwa kuwa aya inaishia kabla ya maneno yanayofuata.
