  rationale: Katika Kiswahili, kusema “akasema na Musa” ni njia ya kawaida ya kueleza kwamba maneno yalielekezwa kwa Musa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza maneno yatakayofuata katika mstari unaofuata.
