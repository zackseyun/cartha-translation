base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: sw
  text: Mwana wa mwanamke Mwisraeli, ambaye baba yake alikuwa Mmisri, akatoka akaenda miongoni mwa wana wa Israeli[a]; na katika kambi mwana wa huyo mwanamke Mwisraeli na mwanamume Mwisraeli wakapigana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa Waisraeli.” Kiebrania kinasema, “miongoni mwa wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakagombana.” Kitenzi hiki kinaweza kumaanisha kugombana au kupigana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka akaenda
  rationale: Kitenzi יצא kinaonyesha kutoka au kwenda nje. Muundo huu wa Kiswahili unaonyesha mwendo wa simulizi bila kudai alikotoka.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: mwana wa mwanamke Mwisraeli
  rationale: Inamtambulisha mtu kwa asili ya mama yake na kuhifadhi urudiaji wa utambulisho huo baadaye katika mstari.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: ambaye baba yake alikuwa Mmisri
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya moja kwa moja ya kwamba alikuwa mwana wa mwanamume Mmisri, bila kubadili taarifa ya ukoo wa baba.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: ‘Miongoni mwa’ huonyesha kuwa katikati ya kundi, na ‘wana wa Israeli’ huhifadhi usemi wa kawaida wa agano katika Kiebrania.
- source_word: וַיִּנָּצוּ
  choice: wakapigana
  rationale: Niphal ya נצה inaweza kumaanisha kugombana au kupigana. ‘Wakapigana’ inafaa muktadha wa tukio linalozidi kuwa kali, huku tanbihi ikihifadhi maana nyingine.
- source_word: בַּמַּחֲנֶה
  choice: wakiwa kambini
  rationale: Hutaja kwa lugha ya kawaida mahali ambapo pambano lilitokea.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: mwana wa huyo mwanamke Mwisraeli
  rationale: Huhifadhi utambulisho uliorudiwa kwa msisitizo; ‘huyo’ humrejelea wazi mwanamke aliyetajwa mwanzoni.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: na mwanamume mmoja Mwisraeli
  rationale: Humtofautisha mtu mwingine wa kiume aliye Mwisraeli na mwana mwenye baba Mmisri; ‘mmoja’ huonyesha kwamba mtu huyo hajatajwa hapo awali.
theological_decisions:
- issue: Usemi wa kikabila wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa Kiebrania ni jina la kawaida la kitaifa na la kiagano. Tafsiri kuu huhifadhi umbo hilo, huku tanbihi ikitoa Kiswahili kilichorahisishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili, huku urudiaji muhimu wa Kiebrania, utambulisho wa wazazi, na uwezekano wa maana mbili katika נצה vikihifadhiwa.
