base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: sw
  text: Weka ubani safi juu ya kila safu[a]; ubani huo utakuwa sehemu ya ukumbusho kwa ajili ya mikate, sadaka ya moto[b] kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya mpangilio”; katika muktadha huu ni mpangilio wa mikate katika safu.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya chakula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Weka
  rationale: Katika maagizo haya, umbo hili la Kiebrania lina nguvu ya amri. “Weka” ni Kiswahili cha kawaida na kinachofaa kwa tendo la kuweka ubani.
- source_word: עַל הַמַּעֲרֶכֶת
  choice: juu ya kila safu
  rationale: Nomino ya umoja inaweza kutumiwa kwa maana ya mgawanyo katika muktadha wa safu mbili zilizotajwa katika mstari uliotangulia. Tanbihi huhifadhi maana pana zaidi ya “mpangilio.”
- source_word: לְבֹנָה זַכָּה
  choice: ubani safi
  rationale: “Ubani” ni jina la kawaida la resin hii yenye harufu, na “safi” huwasilisha hali yake ya kutokuwa na uchafu na kufaa kwa matumizi matakatifu.
- source_word: וְהָיְתָה
  choice: nao utakuwa
  rationale: Kiwakilishi kinamrejelea ubani na kinaonyesha kazi ambayo ubani huo utatimiza kuhusiana na mikate.
- source_word: לַלֶּחֶם
  choice: kwa ajili ya mikate
  rationale: Ingawa Kiebrania kina umoja, “mkate” hapa ni jina la jumla linalorejelea mikate yote iliyopangwa; wingi ni wazi zaidi katika Kiswahili kwa muktadha huu.
- source_word: לְאַזְכָּרָה
  choice: sehemu ya ukumbusho
  rationale: Hili ni neno la ibada linalotaja sehemu ya sadaka inayowakilisha sadaka nzima na kutolewa mbele za Mungu kama ukumbusho.
- source_word: אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Katika lugha ya kikuhani, neno hili hutaja sadaka inayotolewa kwa njia ya moto. Tafsiri hii inaeleweka na inalinda uhusiano wake na tendo la kuteketeza sadaka.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahwe,” nalo kihusishi kinaonyesha kwamba sadaka hiyo ni ya kutolewa kwake.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu la herufi nne moja kwa moja. “Yahwe” hulihifadhi kama jina maalumu la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לְאַזְכָּרָה katika ibada
  choice: sehemu ya ukumbusho
  alternative: ukumbusho
  rationale: Tafsiri iliyochaguliwa inaonyesha kwamba ubani unafanya kazi kama sehemu wakilishi ya mikate katika sadaka, bila kueleza kwa ziada ni nani hasa anayekumbuka.
- issue: Maana ya אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Maana ya kimapokeo na ya kimuktadha ni sadaka inayohusishwa na moto. Tanbihi inahifadhi tafsiri nyingine inayotumiwa katika tafsiri za kisasa bila kuifanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa moja kwa moja na wenye staha unaofaa maagizo ya ibada. “Nao” humrejelea “ubani,” na “mikate” hutumiwa kufafanua maana ya jumla ya nomino ya umoja ya Kiebrania.
