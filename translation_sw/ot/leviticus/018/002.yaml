  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: sw
  text: Zungumza na wana wa Israeli[a], uwaambie, “Mimi ni Yahweh[b], Mungu wenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Israeli” au “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli,” usemi wa kifamilia wa agano unaowataja watu wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania YHWH, ambalo kwa desturi limetafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Zungumza
  rationale: Ni amri inayomtaka Musa aseme na watu. “Zungumza” ni Kiswahili cha sasa na cha kawaida, huku kikitofautishwa na kitenzi kinachofuata, אָמַר.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania, yaani “wana wa Israeli,” inayowataja kwa pamoja watu wa agano wa Israeli.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Huwasilisha kwa ufupi na kwa kawaida mwendelezo wa amri, “na useme kwao,” bila kupoteza moja kwa moja kwa usemi unaofuata.
- source_word: אֲנִי
  choice: Mimi ni
  rationale: Kiwakilishi huru cha Kiebrania kinatilia mkazo utambulisho wa msemaji; “Mimi ni” ni muundo wa kawaida wa Kiswahili katika kauli hii ya kujitambulisha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne, YHWH, limetolewa kama jina binafsi “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa umbo אֱלֹהִים linaweza kuwa la wingi kimofolojia, hapa linamtaja Yahweh mmoja; kiambishi cha nafsi ya pili wingi kimetolewa kwa “wenu.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina YHWH moja kwa moja. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya kulitafsiri.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watoto wa Israeli au Waisraeli
  rationale: Chaguo hili huhifadhi usemi wa kifamilia wa Kiebrania na umbo lake la kiume, bila kuficha kwamba katika muktadha huu linawataja watu wa Israeli kwa pamoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Zungumza … uwaambie” huhifadhi vitenzi viwili vya Kiebrania bila kufanya sentensi iwe nzito; “wana wa Israeli” huhifadhi usemi wa kifamilia, na “Mungu wenu” ni kauli ya kawaida na wazi ya agano.
