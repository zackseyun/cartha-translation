id: LEV.18.27
reference: Leviticus 18:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: sw
  text: Kwa maana watu wa nchi waliokuwa kabla yenu walifanya machukizo haya yote, nayo nchi ikawa najisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi ikatiwa unajisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa onyo lililotangulia, kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: machukizo haya yote
  rationale: “Machukizo” yanahifadhi uzito wa neno la Kiebrania kuhusu mambo yanayochukiza kimaadili na kidini; mpangilio huu pia unaonyesha wingi na msisitizo wa “haya yote.”
- source_word: עָשׂוּ
  choice: walifanya
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kawaida עשה, bila kukiongezea maana maalumu ya kisheria au kiibada.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: watu wa nchi
  rationale: Ingawa muundo wa Kiebrania ni “wanaume wa nchi,” hapa kirai kinatumika kwa maana ya pamoja kuhusu wakazi waliotangulia; “watu wa nchi” ni Kiswahili cha asili na kinafikisha dhima hiyo bila kudai kuwa kila mhusika alikuwa mwanamume.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: waliokuwa kabla yenu
  rationale: 'Inahifadhi uhusiano wa wakati: watu hao waliishi katika nchi kabla ya wasikilizaji.'
- source_word: וַתִּטְמָא
  choice: ikawa najisi
  rationale: Inaonyesha hali iliyotokea kama matokeo ya matendo hayo na kuhifadhi wazo la unajisi bila kulifungia katika maana ya kiibada pekee au ya sitiari pekee.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Muktadha unahusu eneo walilokalia wakazi waliotangulia, si dunia nzima.
theological_decisions:
- issue: Asili ya unajisi wa nchi
  choice: nchi ikawa najisi
  alternative: nchi ikatiwa unajisi
  rationale: Tafsiri kuu inadumisha uhusiano ambao andiko linaweka kati ya matendo ya wanadamu na hali ya nchi, bila kuamua kimya-kimya kama unajisi huo ni wa kiibada tu, wa kimaadili tu, au wa kisitiari tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Nayo” inaunganisha matokeo na matendo yaliyotajwa bila kupoteza nguvu ya וַ־ ya Kiebrania.
