  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: sw
  text: Usifunue uchi wa ndugu wa kiume wa baba yako; usimkaribie mke wake[a]. Yeye ni shangazi yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kumkaribia”; katika muktadha huu kitenzi hicho kina maana ya kingono ndani ya mfumo wa sheria zinazokataza mahusiano kati ya watu wa ukoo wa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: uchi wa
  rationale: Katika kanuni hii ya sheria, neno hili ni sehemu ya msemo “kufunua uchi,” unaomaanisha mahusiano ya kingono yaliyokatazwa. Tafsiri inadumisha picha halisi na mtindo unaorudiwa katika sura hii.
- source_word: אֲחִי אָבִיךָ
  choice: ndugu ya baba yako
  rationale: Hii inafuata moja kwa moja uhusiano wa kifamilia unaotajwa katika Kiebrania na, katika muktadha huu, inaeleweka kuwa ndugu wa kiume wa baba.
- source_word: לֹא תְגַלֵּה
  choice: usifunue
  rationale: Hii ni amri hasi ya moja kwa moja na inadumisha msemo wa kisheria “usifunue uchi.”
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: usimkaribie mke wake
  rationale: Kitenzi קרב kwa msingi ni “kukaribia.” Katika muktadha wa sheria za mahusiano ya kingono kina maana ya kingono, lakini tafsiri inadumisha usemi wa staha wa chanzo.
- source_word: דֹּדָתְךָ
  choice: shangazi yako
  rationale: Neno hili humaanisha shangazi; hapa sentensi iliyotangulia inabainisha kuwa ni mke wa ndugu ya baba.
- source_word: הִוא
  choice: Yeye ni
  rationale: Kiwakilishi kinatumika kama kiima cha kauli “Yeye ni shangazi yako,” bila kuongeza kiunganishi cha sababu ambacho hakijaonyeshwa wazi.
theological_decisions:
- issue: Kutafsiri msemo wa sheria kuhusu mahusiano ya kingono bila kuufanya ufafanuzi wa moja kwa moja
  choice: Kudumisha “kufunua uchi” katika matini kuu.
  alternative: Kutafsiri “kufanya ngono na” au “kuwa na mahusiano ya kingono na.”
  rationale: Msemo huo unarudiwa katika Walawi 18. Kuudumisha kunahifadhi muundo wa kisheria na picha ya Kiebrania, huku muktadha ukionyesha maana yake ya kingono.
- issue: Utambulisho wa uhusiano wa kifamilia
  choice: “Yeye ni shangazi yako.”
  alternative: “Yeye ni mke wa ndugu ya baba yako.”
  rationale: Kiebrania kinatumia neno la kawaida la ukoo katika kifungu cha mwisho, baada ya kueleza uhusiano mahsusi katika kifungu kilichotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi na wenye staha. “Usifunue uchi” huhifadhi msemo wa chanzo; “usimkaribie” huhifadhi usemi wake wa staha huku tanbihi ikifafanua maana ya kimuktadha.
