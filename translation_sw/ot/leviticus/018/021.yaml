base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: sw
  text: Usimtoe yeyote wa uzao wako[a] ili apitishwe kwa Moleki[b], wala usilinajisi jina la Mungu wako. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yeyote wa watoto wako.” Kiebrania kinasema kihalisi “kutoka katika mbegu yako.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kwa ibada iliyohusishwa na Moleki. Wengi huelewa jambo hili kuwa dhabihu ya watoto, ambayo mahali pengine huelezwa kuwa kuwapitisha watoto “katika moto.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: yeyote katika uzao wako
  rationale: Neno זֶרַע kwa msingi humaanisha “mbegu,” lakini hapa linarejelea wazao. “Yeyote katika uzao wako” huhifadhi maana ya sehemu iliyo katika kihusishi מִן bila kuifunga kwa umri fulani.
- source_word: תִתֵּן
  choice: usimtoe
  rationale: Kitenzi נתן humaanisha “kutoa/kumpa.” Katika katazo hili, “usimtoe” ni Kiswahili cha kawaida kinachoonyesha kumtoa mtu kwa kusudi lililotajwa bila kuongeza wazi wazo la dhabihu.
- source_word: לְהַעֲבִיר
  choice: ili apitishwe
  rationale: Hifili ya עבר ina maana ya kusababisha mtu apite. Muundo wa kutendwa “apitishwe” ni wa asili kwa Kiswahili na huhifadhi taswira ya kupitishwa bila kuamua wazi namna ya ibada hiyo.
- source_word: לַמֹּלֶךְ
  choice: kwa Moleki
  rationale: Matamshi ya Kiebrania na mapokeo ya maandishi yanaunga mkono jina la pekee Moleki. “Kwa Moleki” huhifadhi uhusiano wa ibada hiyo na Moleki bila kueleza zaidi ya maandishi.
- source_word: תְחַלֵּל
  choice: usilitie unajisi
  rationale: Katika piel, חלל humaanisha kunajisi au kufuru kilicho kitakatifu. “Kulitia unajisi jina” ni usemi wenye hadhi unaofaa muktadha wa agano.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: jina la Mungu wako
  rationale: Tafsiri hii ya moja kwa moja huhifadhi uzito wa kitheolojia wa “jina,” linalowakilisha heshima na sifa ya Mungu iliyofunuliwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina la pekee katika maandishi.
theological_decisions:
- issue: Asili ya katazo linalohusiana na Moleki
  choice: Kuhifadhi usemi wa kupitishwa katika matini kuu bila kutaja wazi moto au dhabihu ya mtoto.
  alternative: “Usimtoe dhabihu mtoto wako kwa Moleki” au “usimpitishe motoni kwa Moleki.”
  rationale: Aya yenyewe inasema kutoa mzao ili apitishwe kwa Moleki, lakini haitaji moto moja kwa moja. Maelezo ya chini yanabainisha uelewa wa kawaida bila kuingiza hitimisho hilo katika matini kuu.
- issue: Rejeleo la זֶרַע katika sheria hii
  choice: uzao
  alternative: watoto; mbegu
  rationale: “Uzao” ni neno la kawaida na pana linalohifadhi maana ya wazao bila kuweka kikomo cha umri, huku tanbihi ikitoa mbadala wa “watoto.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa katazo ni wa moja kwa moja, huku fumbo halisi la ibada ya Moleki likihifadhiwa katika matini kuu na kufafanuliwa katika tanbihi.
