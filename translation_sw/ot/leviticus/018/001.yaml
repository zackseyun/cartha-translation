- source_word: לֵאמֹר
  choice: koloni baada ya “Musa”
  rationale: Infinitivu hii hutanguliza maudhui ya hotuba. Kwa Kiswahili cha sasa, koloni huonyesha kazi hiyo kwa ufasaha kuliko kuongeza “akisema,” ambayo ingerudia wazo la kusema.
