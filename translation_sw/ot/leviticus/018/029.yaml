revisions:
- from: Kwa maana mtu yeyote atakayefanya mojawapo ya machukizo haya yote, watu wanaoyafanya watakatiliwa mbali[a] na watu wao.
  to: Kwa maana yeyote anayefanya lolote kati ya machukizo haya atakatiliwa mbali[a] kutoka miongoni mwa watu wake.
  rationale: The revision clarifies that the offense may be any one of the listed abominations, restores the explicit sense of removal from among one's people, and uses a natural singular distributive construction. The footnote continues to preserve the debated scope of the penalty without resolving it.
