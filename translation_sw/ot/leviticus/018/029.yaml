  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: sw
  text: Kwa maana yeyote anayefanya lolote kati ya machukizo haya atakatiliwa mbali[a] kutoka miongoni mwa watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atauawa” au “ataondolewa kutoka katika jumuiya”; Kiebrania husema “atakatiliwa mbali,” bila kubainisha namna hususa ya hukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha msingi au matokeo yanayotokana na makatazo yaliyotangulia; “Kwa maana” ni ya kawaida na huhifadhi nguvu ya ufafanuzi.
- source_word: כָּל אֲשֶׁר
  choice: mtu yeyote ambaye
  rationale: Muundo huu una maana ya jumla isiyo na kikomo, yaani kila mtu anayefanya jambo hilo; “mtu yeyote ambaye” ni wazi katika Kiswahili.
- source_word: יַעֲשֶׂה
  choice: atakayefanya
  rationale: Kitenzi cha Kiebrania kina maana ya msingi ya kufanya; uchaguzi huu hauongezi maana maalumu ya kisheria isiyosemwa na matini.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: mojawapo ya machukizo haya yote
  rationale: Huhifadhi maana ya sehemu iliyo katika kihusishi מִן pamoja na upeo wa כֹּל kwa Kiswahili cha kawaida.
- source_word: תּוֹעֵבוֹת
  choice: machukizo
  rationale: Neno hili huonyesha matendo au mambo yanayochukiza sana kimaadili na kidini katika muktadha wa sheria za utakatifu.
- source_word: וְנִכְרְתוּ
  choice: watakatiliwa mbali
  rationale: Huhifadhi taswira ya kitenzi כרת katika kauli tendwa bila kubainisha kuwa adhabu ni kifo au kufukuzwa tu.
- source_word: הַנְּפָשׁוֹת
  choice: watu
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha watu binafsi, si “roho” kwa maana ya sehemu isiyo ya mwili.
- source_word: הָעֹשֹׂת
  choice: wanaoyafanya
  rationale: Huwatambulisha watu hao kuwa ndio wanaotenda machukizo yaliyotajwa.
- source_word: מִקֶּרֶב עַמָּם
  choice: na watu wao
  rationale: Pamoja na “watakatiliwa mbali,” usemi huu unatoa maana ya kuondolewa kutoka miongoni mwa jamii yao kwa Kiswahili asilia.
theological_decisions:
- issue: Maana ya adhabu katika וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: watakatiliwa mbali na watu wao
  alternative: watauawa; au wataondolewa katika jumuiya
  rationale: Kauli ya Kiebrania haitaji wazi namna kamili ya hukumu—iwe ni hukumu ya Mungu yenye kuleta kifo, kuuawa na wanadamu, au kufukuzwa katika jumuiya. Matini kuu huhifadhi usemi huo bila kuamua mojawapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umetunza uzito wa kisheria wa kifungu huku ukiepuka “nafsi” au “roho,” ambazo zingepotosha maana ya watu binafsi katika muktadha huu.
