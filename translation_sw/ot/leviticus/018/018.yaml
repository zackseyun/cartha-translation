  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: sw
  text: Wala usimchukue mwanamke, ukimwongeza kwa dada yake ili kumfanya kuwa mpinzani wa dada yake, kufunua uchi wake wakati dada yake angali hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wala usimchukue mwanamke pamoja na dada yake ili kumfanya kuwa mpinzani.” Kiebrania ni kifupi; maana yake ni katazo la kumchukua dada wa mwanamke kuwa mke wa ziada wakati mwanamke huyo bado yu hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה
  choice: mwanamke
  rationale: אִשָּׁה inaweza kumaanisha mwanamke au mke; hapa kitenzi cha kumchukua na muktadha wa sheria ya ndoa vinaonyesha maana ya kumchukua kuwa mke.
- source_word: אֶל אֲחֹתָהּ
  choice: pamoja na dada yake
  rationale: Kirai hiki kinaonyesha kumchukua mwanamke mwingine kwa kuongezea kwa dada yake; Kiswahili hiki kinahifadhi uhusiano huo bila kukifanya kirai kisicho cha kawaida.
- source_word: לֹא תִקָּח
  choice: usimchukue
  rationale: Ni katazo la moja kwa moja katika mtindo wa sheria; ‘usimchukue’ ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: לִצְרֹר
  choice: awe mke mshindani
  rationale: Katika muktadha huu mzizi צרר unaonyesha kuleta uhusiano wa ushindani kati ya dada wawili walio wake; neno ‘mke’ linaweka wazi maana ya kindoa iliyomo katika muktadha.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: ili kufunua uchi wake
  rationale: Hii inadumisha sitiari ya kawaida ya Kilawi inayorejelea mahusiano ya kingono bila kuibadilisha kuwa ufafanuzi wa moja kwa moja.
- source_word: בְּחַיֶּיהָ
  choice: wakati dada yake angali hai
  rationale: Kirai kinamaanisha ‘wakati wa uhai wake’; kutaja ‘dada yake’ kunabainisha kiwakilishi na kuweka wazi mpaka wa wakati wa katazo.
theological_decisions:
- issue: Upeo wa katazo kuhusu kuoa dada wawili
  choice: Mstari unakataza kumchukua dada wa mwanamke kuwa mke wa ziada wakati mwanamke huyo bado yu hai.
  alternative: Kukataza kuoa dada wawili katika hali zote, hata baada ya mmoja kufa; au kukataza kwa jumla ndoa yoyote inayoleta ushindani.
  rationale: Muundo wa Kiebrania, hasa לִצְרֹר na בְּחַיֶּיהָ, unaelekea kwenye kumchukua dada wa mke kama mke wa ziada mwenye kushindana naye wakati wa uhai wake. Tafsiri haipanui katazo kupita yaliyoelezwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Angali hai’ hudumisha sauti ya kisheria bila kuwa ya kizamani kupita kiasi; ‘mke mshindani’ huweka wazi muktadha wa ndoa huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo halisi zaidi.
