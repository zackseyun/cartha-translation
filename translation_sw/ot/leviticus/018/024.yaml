  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: sw
  text: Msijitie unajisi kwa lolote kati ya mambo haya[a], kwa maana mataifa ninayoyafukuza mbele yenu yakawa najisi kwa mambo haya yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msijitie unajisi kwa mambo haya yote … mataifa … yalitiwa unajisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: Msijitie unajisi
  rationale: Kitenzi cha katazo pamoja na umbo la Kiebrania linalomhusisha mtendaji mwenyewe kinaelezwa kwa Kiswahili cha kawaida kama ‘msijitie unajisi’; neno hili pia linadumisha msamiati wa Kilawi wa hali ya kutokuwa safi.
- source_word: בְּכָל אֵלֶּה
  choice: kwa lolote kati ya mambo haya
  rationale: Katika katazo, ‘yote’ ya Kiebrania ina maana ya kutoruhusu hata jambo moja kati ya yaliyotajwa; ‘kwa’ huonyesha njia au sababu ya kupata unajisi.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya katazo; ‘kwa maana’ kinaonyesha uhusiano huo wazi na kwa lugha yenye hadhi.
- source_word: נִטְמְאוּ
  choice: yalijitia unajisi
  rationale: Umbo la Niphal linaweza kueleza kuingia katika hali ya unajisi au kutiwa unajisi. Katika Kiswahili, ‘yalijitia unajisi’ ni ya asili katika muktadha huu na hudumisha uhusiano wa kileksia na katazo la kwanza, huku tanbihi ikihifadhi uwezekano wa tafsiri tendwa.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Hapa neno linamaanisha makundi ya watu wasio Waisraeli waliokuwa katika nchi; ‘mataifa’ ni tafsiri sanifu isiyoleta dhana ya baadaye ya ‘Wamataifa’.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: ninayoyafukuza
  rationale: Ingawa mzizi unaweza kumaanisha ‘kutuma,’ katika muktadha wa hukumu na kuondolewa katika nchi una maana ya kufukuza.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Hii inahifadhi taswira ya anga ya mataifa kuondolewa mbele ya Israeli bila kutumia Kiswahili kisicho cha kawaida cha ‘kutoka mbele yenu.’
theological_decisions:
- issue: Msamiati wa unajisi wa kiibada na kimaadili katika Mambo ya Walawi 18
  choice: kujitia unajisi
  alternative: kujifanya najisi / kutiwa unajisi
  rationale: ‘Unajisi’ huhifadhi kundi pana la Kilawi linalounganisha hali ya kutokuwa safi na uzito wa kimaadili wa matendo yaliyokatazwa, bila kuyapunguza kuwa suala la sherehe pekee. Tanbihi inaonyesha kwamba umbo la pili linaweza pia kutafsiriwa kwa sauti tendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Lolote kati ya mambo haya’ ni cha kawaida na huwasilisha nguvu ya בְּכָל katika katazo; ‘mbele yenu’ huhifadhi nahau ya mwendo na kufukuzwa.
