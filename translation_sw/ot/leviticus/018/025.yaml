  terminology: “Nchi,” “najisi,” “uovu,” “wakazi,” and “ikawatapika” are appropriate biblical-register Standard East African Swahili. The alternative in footnote a should be “ilitiwa unajisi,” rather than “ikatiwa unajisi,” for normal passive formation. The literal footnote for b should identify the referent of the possessive pronouns to avoid ambiguity.
