base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: sw
  text: Kwa hiyo nchi ikawa najisi[a], nami nikaihukumu nchi hiyo kwa sababu ya uovu wake[b], nayo nchi ikawatapika wakazi wake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilitiwa unajisi.” Kitenzi cha Kiebrania kinaweza kueleza ama nchi kuingia katika hali ya unajisi ama kutiwa unajisi.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “nikaupatiliza uovu wake juu yake,” yaani, uovu wa nchi juu ya nchi hiyo. Hii ni nahau ya Kiebrania inayomaanisha kuuita uovu au hatia kwenye hesabu kwa hukumu.
    reason: lexical_alternative
  - marker: c
    text: Au, “ikawatema nje.” Kiebrania kinahifadhi taswira kali ya kutapika ili kuonyesha jinsi nchi ilivyowaondoa wakazi wake kwa sababu ya unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: ikawa najisi
  rationale: Kitenzi טמא kinaonyesha kwamba nchi iliingia katika hali ya unajisi kutokana na machukizo yaliyotendwa humo. “Ikawa najisi” ni Kiswahili cha sasa kinachohifadhi maana ya matokeo bila kuamua kimya kimya ikiwa msisitizo ni hali iliyotokea au tendo la kutiwa unajisi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa Mambo ya Walawi 18, אֶרֶץ inarejelea nchi maalumu wanamoishi watu, si dunia yote; kwa hiyo “nchi” ndiyo tafsiri sahihi na ya kawaida.
- source_word: וָאֶפְקֹד
  choice: nikaiadhibu
  rationale: Pamoja na עָוֹן, פקד ina maana ya kuufuatilia uovu kwa hukumu au kuutia hatia katika hesabu. “Nikaiadhibu” huwasilisha maana hiyo ya kimuktadha kwa Kiswahili cha kawaida huku ikihifadhi kwamba Mungu ndiye mtendaji wa hukumu.
- source_word: עֲוֺנָהּ
  choice: uovu wake
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu inayotokana na hatia. “Uovu wake” huhifadhi uzito wa kimaadili na inaeleweka kwa urahisi; kiwakilishi cha nchi kinaendeleza uhusishaji wa nchi na uovu uliofanyika humo.
- source_word: עָלֶיהָ
  choice: kwa sababu ya
  rationale: Katika nahau פקד עון על, kihusishi kinaonyesha kwamba hukumu inaelekezwa kwa kitu kwa ajili ya uovu wake. “Kwa sababu ya” huifanya nahau ieleweke kiasili katika Kiswahili, huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
- source_word: וַתָּקִא
  choice: ikawatapika
  rationale: קיא ni kitenzi cha wazi na chenye nguvu kinachomaanisha kutapika. “Ikawatapika” huhifadhi taswira ya nchi kama kiumbe kinachowatoa wakazi wake kwa nguvu, badala ya kuilegeza kuwa “ikawafukuza.”
- source_word: יֹשְׁבֶיהָ
  choice: wakazi wake
  rationale: Umbo la kishirikishi kutoka ישב linamaanisha watu wanaokaa katika nchi. “Wakazi wake” ni fupi, asilia, na huhifadhi maana ya kundi zima.
theological_decisions:
- issue: Nchi kupewa sifa ya kiumbe kinachoitikia unajisi
  choice: Kuhifadhi taswira halisi kwamba nchi “ikawatapika” wakazi wake.
  alternative: Kusema tu kwamba nchi “iliwafukuza” au “iliwaondoa” wakazi wake.
  rationale: Kiebrania kinaipa nchi sifa ya kiumbe kinachoitikia uchafuzi wa kimaadili. Taswira hiyo inaunganisha uovu, unajisi, hukumu ya Mungu, na kuondolewa katika nchi bila kuipunguza kuwa tukio la kisiasa tu.
- issue: Maana ya hukumu ya Mungu katika וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: 'Kueleza matokeo ya nahau moja kwa moja: “nikaiadhibu kwa sababu ya uovu wake.”'
  alternative: 'Kutafsiri kwa kufuata maneno moja moja: “nikaupatiliza uovu wake juu yake.”'
  rationale: Kauli hii inamtaja Mungu moja kwa moja kuwa ndiye anayehukumu. Tafsiri iliyochaguliwa inaweka wazi nguvu ya nahau kwa Kiswahili cha kawaida bila kuficha uwajibikaji wa kimaadili; muundo halisi umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji wa “nchi,” uhusishaji wake kama kiumbe, na taswira kali ya kutapika. “Najisi” ni neno la kawaida katika rejesta ya kibiblia na kidini, lakini tanbihi inatoa njia nyingine iliyo wazi.
