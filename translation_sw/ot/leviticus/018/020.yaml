  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: sw
  text: Usifanye ngono[a] na mke wa mwenzako; kwa kufanya hivyo utajitia unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Usimpe mke wa mwenzako utoaji wako wa mbegu.”
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: mke wa mwenzako
  rationale: Katika sheria hii, עָמִית humaanisha mtu mwingine wa jumuiya. ‘Mke wa mwenzako’ ni Kiswahili cha kawaida na huhifadhi uhusiano unaokusudiwa bila kuifanya maana kuwa finyu mno.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: Usifanye ngono
  rationale: Kirai hiki cha Kiebrania kinaeleza kihalisi kutoa tendo au utoaji wa kulala kuwa mbegu, lakini kimuktadha ni nahau ya kufanya ngono. Tafsiri ya maana hutoa katazo kwa uwazi, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: לְטָמְאָה בָהּ
  choice: na hivyo kujitia unajisi pamoja naye
  rationale: Kitenzi hiki kisicho na kikomo kinaonyesha matokeo ya kujitia unajisi kwa tendo hilo. ‘Kujitia unajisi’ huhifadhi lugha ya טמא bila kuamua kimya kimya kwamba inahusu tu hali ya kiibada.
theological_decisions:
- issue: Asili ya katazo na maana ya unajisi
  choice: Katazo la kufanya ngono na mke wa mwanajumuiya mwingine, tendo linalomtia msemajiwa unajisi pamoja naye.
  alternative: Kuweka nahau halisi ya utoaji wa mbegu katika matini kuu, au kutaja hali hiyo kuwa uchafu wa kiibada pekee.
  rationale: Nahau ya Kiebrania inaelekea wazi kwenye tendo la ngono, ilhali kifungu cha mwisho kinataja unajisi. ‘Unajisi’ huhifadhi mvutano wa kimaadili na kiibada wa neno la chanzo bila kuufungia upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya moja kwa moja, ya heshima, na inayoeleweka kwa wasomaji wa kawaida. ‘Kufanya ngono’ ni wazi bila kuwa ya kitabibu kupita kiasi, na ‘kujitia unajisi’ hudumisha uzito wa kisheria na kidini wa kifungu.
