review_pass:
  verdict: revise
  source_fidelity: The main prohibition correctly conveys the Hebrew sexual idiom as a prohibition of intercourse with another community member’s wife. However, “pamoja naye” ordinarily means “together with her,” rather than expressing the Hebrew’s defilement through/with the woman in the context of the act. The footnote’s “tendo lako la kulala kuwa mbegu” is not idiomatic Swahili and does not clearly represent the literal emission/seed wording.
  naturalness: “Usifanye ngono” and “mke wa mwenzako” are clear, modern Standard East African Swahili. Revising the final clause to state that the prohibited act causes defilement is more natural than “kujitia unajisi pamoja naye.”
  terminology: “Unajisi” appropriately retains the broad impurity/defilement sense without reducing it to ritual impurity alone. “Mke wa mwenzako” is an apt rendering of אֵשֶׁת עֲמִיתְךָ in this legal setting.
  issues:
  - severity: medium
    issue: The phrase “kujitia unajisi pamoja naye” is semantically imprecise.
    rationale: “Pamoja naye” normally denotes joint participation (“together with her”), whereas לְטָמְאָה בָהּ identifies defilement in connection with the prohibited intercourse. A causal formulation expresses the Hebrew sense naturally without overinterpreting the preposition.
  - severity: medium
    issue: The source-idiom footnote is awkward and unclear in Swahili.
    rationale: “Tendo lako la kulala kuwa mbegu” is not a natural literal explanation and obscures the reference to seminal emission/seed. “Utoaji wako wa mbegu” is clearer while retaining the source image.
  revised_text: Usifanye ngono[a] na mke wa mwenzako; kwa kufanya hivyo utajitia unajisi.
  revised_footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Usimpe mke wa mwenzako utoaji wako wa mbegu.”
    reason: source_idiom
  revision_rationale: The revision preserves the direct legal prohibition, the referent “your neighbor’s wife,” and the resulting defilement. It replaces an unnatural and potentially misleading expression of the final Hebrew clause with a clear causal construction. The footnote is recast in idiomatic Swahili so that the underlying Hebrew emission/seed idiom remains auditable.
