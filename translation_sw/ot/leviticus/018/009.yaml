base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: sw
  text: Usifunue uchi wa dada yako, awe binti wa baba yako au binti wa mama yako, aliyezaliwa katika nyumba au nje yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyezaliwa katika kaya au nje yake.” Kiebrania kinatofautisha aliyezaliwa “katika nyumba/nyumbani” na aliyezaliwa “nje.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: uchi wa ...
  rationale: Katika Walawi 18, neno hili ni sehemu ya nahau ya kisheria kuhusu mahusiano ya kingono yaliyokatazwa. “Kufunua uchi” huhifadhi nahau hiyo kwa Kiswahili kinachoeleweka.
- source_word: אֲחוֹתְךָ
  choice: dada yako
  rationale: Ni neno la moja kwa moja la undugu; “dada yako” ni la kawaida na la asili katika Kiswahili.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: binti ya baba yako / binti ya mama yako
  rationale: Maneno haya yanadumisha usahihi na ulinganifu wa kifamilia katika matini ya Kiebrania.
- source_word: מוֹלֶדֶת
  choice: aliyezaliwa
  rationale: Hutoa kwa uwazi maana ya kuzaliwa katika mazingira yanayotajwa.
- source_word: בַּיִת / חוּץ
  choice: nyumbani / nje ya nyumba
  rationale: Huhifadhi utofautishaji wa Kiebrania kati ya kuzaliwa ndani ya nyumba au kaya na kuzaliwa nje, bila kuficha uwezekano wa maana halisi ya “nyumba.”
- source_word: לֹא תְגַלֶּה
  choice: Usifunue
  rationale: Ni katazo la moja kwa moja lenye hadhi ya lugha ya sheria, na huhifadhi kitenzi cha nahau ya Kiebrania.
- source_word: אוֹ ... אוֹ
  choice: awe ... au
  rationale: Muundo huu unawasilisha kwa Kiswahili cha asili chaguzi mbili zinazotajwa na matini.
theological_decisions:
- issue: Upeo wa uhusiano unaokatazwa
  choice: Katazo linamhusu dada, awe ni binti ya baba au binti ya mama, bila kujali alizaliwa nyumbani au nje ya nyumba.
  alternative: Vifungu vya mwisho vinaweza kueleweka kuwa vinatofautisha dada waliozaliwa katika kaya na wale waliozaliwa nje yake, au kwa njia isiyo ya moja kwa moja aina mbalimbali za undugu wa dada.
  rationale: Matini ya Kiebrania inapanua aina zinazojumuishwa katika neno “dada” badala ya kupunguza katazo. Tafsiri haiongezi tofauti za baadaye za kisheria ambazo hazikutajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachofafanuliwa.
