  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: sw
  text: Kwa hiyo mtazishika sheria zangu na hukumu zangu; mtu akizitenda, ataishi kwa hizo.[a] Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataishi ndani yazo.” Kihusishi cha Kiebrania kinaweza kueleweka kuwa cha njia au chombo (“kwa hizo”), au kuwa cha mazingira ambamo mtu anaishi (“ndani yazo”).
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kwa hiyo mtazishika
  rationale: Muundo huu katika maagizo ya kisheria una nguvu ya agizo. “Kwa hiyo” unaendeleza uhusiano na makatazo yaliyotangulia, na “kushika” ni lugha ya kawaida ya uaminifu kwa maagizo ya agano.
- source_word: חֻקֹּתַי
  choice: sheria zangu
  rationale: Neno hili hurejelea masharti au maagizo yaliyowekwa; “sheria” ni la asili na linaloeleweka katika Kiswahili cha sasa.
- source_word: מִשְׁפָּטַי
  choice: hukumu zangu
  rationale: “Hukumu” linadumisha tofauti ya kileksika na חֻקֹּתַי na kuakisi jozi ya istilahi za kisheria katika Kiebrania.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם
  choice: mtu akizitenda
  rationale: Kishazi cha masharti kinawekwa kwa Kiswahili cha kawaida bila kupoteza wazo halisi la kutenda maagizo. “Mtu” hapa ni umoja wenye maana wakilishi.
- source_word: וָחַי בָּהֶם
  choice: ataishi kwa hizo
  rationale: “Ataishi” ni tafsiri ya moja kwa moja isiyofafanua kupita kiasi aina au upeo wa uzima. “Kwa hizo” huhifadhi uwezekano wa ב kuwa wa njia/chombo, huku usomaji wa eneo au mazingira ukitajwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu linatolewa kwa unukuzi “Yahweh” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Upeo wa maana ya “ataishi kwa hizo”
  choice: Kauli pana “ataishi kwa hizo” imedumishwa bila kubainisha aina ya uzima.
  alternative: ataishi ndani yake; atapata uzima kupitia hizo
  rationale: Kiebrania hakibainishi wazi kama uzima unaokusudiwa ni wa kimwili, wa agano, wa kuishi nchini, au wa milele; tafsiri haipaswi kuondoa mvutano huo wa kitheolojia.
- issue: Maana wakilishi ya הָאָדָם
  choice: mtu
  alternative: mwanadamu; yeyote
  rationale: Ingawa Kiebrania kina umoja wa kiume, hapa אדם ni usemi wakilishi. “Mtu” hudumisha umoja huo kwa Kiswahili cha kawaida bila kudokeza kwamba ahadi inawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Jozi “sheria ... hukumu” inadumisha tofauti ya istilahi za Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya kishazi kinachohusika.
