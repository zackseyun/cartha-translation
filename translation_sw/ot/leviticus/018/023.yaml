base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: sw
  text: Usifanye ngono[a] na mnyama yeyote na hivyo kujitia unajisi. Wala mwanamke asijiweke mbele ya mnyama ili mnyama huyo ampande[b]; huo ni upotovu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kina kauli inayokaribia “usitoe kulala kwako”; katika muktadha huu inamaanisha kujamiiana, na huenda pia ikadokeza utoaji wa shahawa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ili ampande”; kauli hiyo inarejelea kujamiiana na mnyama.'
    reason: lexical_alternative
  - marker: c
    text: Au “machafuko,” “mkanganyiko,” au “ukiukaji wa mpangilio.” Neno la Kiebrania huonyesha ukiukaji wa mpangilio unaofaa, hasa katika muktadha wa ngono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: na mnyama yeyote
  rationale: בְּהֵמָה hapa humaanisha mnyama kwa upana, na כָּל huifanya katazo lihusu kila mnyama; “mnyama yeyote” ni Kiswahili cha kawaida na chenye upeo huo.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: usifanye ngono
  rationale: Kauli ya Kiebrania ni ya kimafumbo, kihalisi ikiwa karibu na “usitoe kulala kwako.” Katika muktadha huu humaanisha tendo la kujamiiana; “usifanye ngono” huwasilisha maana yake wazi bila kutumia Kiswahili kisicho cha kawaida.
- source_word: לְטָמְאָה בָהּ
  choice: na hivyo kujitia unajisi
  rationale: Infinitivu hii huonyesha kusudi au matokeo ya tendo. “Kujitia unajisi” huhifadhi wazo la uchafu wa kidini na kimaadili bila kulifanya kuwa uchafu wa kimwili tu.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: asijiweke mbele ya mnyama
  rationale: Ingawa תַעֲמֹד kihalisi ni “asimame,” katika muktadha huu kauli inaonyesha mwanamke kujiweka tayari mbele ya mnyama kwa kusudi la tendo la ngono. “Asijiweke mbele” ni ya asili zaidi na huhifadhi picha ya Kiebrania.
- source_word: לְרִבְעָהּ
  choice: ili apandwe naye
  rationale: Mzizi רבע hapa humaanisha kupandwa katika tendo la kujamiiana na mnyama, na kiambishi cha kike humweka mwanamke kama anayefanyiwa tendo. Tafsiri hii huhifadhi mwelekeo huo kuliko kauli ya jumla “kujamiiana naye.”
- source_word: תֶּבֶל
  choice: upotovu
  rationale: Neno hili huashiria kuvurugwa au kukiukwa kwa mpangilio unaofaa, hasa katika muktadha wa ngono. “Upotovu” huonyesha hukumu hiyo ya kimaadili kwa Kiswahili cha sasa; “machafuko” lingeweza kueleweka kama vurugu au mkanganyiko tu.
theological_decisions:
- issue: Lugha ya unajisi katika katazo la ngono na mnyama
  choice: na hivyo kujitia unajisi
  alternative: kwa unajisi pamoja naye
  rationale: Tafsiri iliyochaguliwa huhifadhi unajisi kama dhana ya kibiblia yenye uzito wa kidini na kimaadili, bila kuupunguza kuwa uchafu wa kiibada pekee wala kuingiza mfumo wa mafundisho wa baadaye.
- issue: Maana ya תֶּבֶל kama hukumu juu ya tendo
  choice: huo ni upotovu
  alternative: hayo ni machafuko
  rationale: “Upotovu” huhifadhi wazo la tendo linalokiuka mpangilio unaofaa. Hata hivyo, tanbihi inataja upeo mwingine wa neno badala ya kuficha utata wake wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Ngono” hutumiwa kwa uwazi bila lugha chafu; “kujitia unajisi” huhifadhi msamiati wa kibiblia; na “apandwe naye” huonyesha kwa usahihi uelekeo wa tendo katika Kiebrania.
