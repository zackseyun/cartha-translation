  to: Msitende kama watu wanavyotenda katika nchi ya Misri[a], ambako mliishi; wala msitende kama watu wanavyotenda katika nchi ya Kanaani, ambako ninawapeleka. Wala msiishi kwa kufuata sheria zao[b].
