id: LEV.18.3
reference: Leviticus 18:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: sw
  text: Msitende kama watu wanavyotenda katika nchi ya Misri[a], ambako mliishi; wala msitende kama watu wanavyotenda katika nchi ya Kanaani, ambako ninawapeleka. Wala msiishi kwa kufuata sheria zao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na matendo ya nchi ya Misri ... na kulingana na matendo ya nchi ya Kanaani.” Usemi wa Kiebrania unazungumzia kihalisi “matendo” ya nchi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Msifuate desturi zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: kama watu wanavyotenda
  rationale: Kirai hiki kwa maana ya msingi ni ‘kulingana na tendo/matendo ya.’ Tafsiri hii ya Kiswahili inaeleza kwa kawaida matendo ya wakazi yanayokusudiwa na usemi wa Kiebrania, bila kuyafanya matendo yaonekane kuwa ya ardhi yenyewe.
- source_word: אֶרֶץ מִצְרַיִם / אֶרֶץ כְּנַעַן
  choice: nchi ya Misri / nchi ya Kanaani
  rationale: Inahifadhi muundo na msisitizo wa kijiografia wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: ambako mliishi
  rationale: Inaonyesha wazi kwamba Misri ndiyo mahali ambapo Waisraeli waliishi hapo awali, huku wakati uliopita wa kitenzi ukihifadhiwa.
- source_word: לֹא תַעֲשׂוּ
  choice: msitende
  rationale: Hii ni namna ya kawaida, yenye heshima na nguvu ya kisheria ya kutoa katazo kwa wingi katika Kiswahili.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: ambako ninawapeleka
  rationale: Kitenzi cha wakati unaoendelea kinaonyesha tendo la Mungu linaloendelea au lililo karibu kutimizwa na pia kinaonyesha mahali pa kupelekwa.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: kwa kufuata masharti yao
  rationale: ‘Masharti’ yanahifadhi maana ya kanuni au maagizo yenye nguvu ya kuwabana watu; ‘kwa kufuata’ huifanya picha ya mwenendo ieleweke kwa Kiswahili cha sasa.
- source_word: לֹא תֵלֵכוּ
  choice: msienende
  rationale: Inahifadhi sitiari ya Kiebrania ya ‘kwenda/kuenenda’ kama mwenendo wa maisha, huku kirai kinachofuata kikifafanua maana yake kwa kawaida.
theological_decisions:
- issue: Ikiwa wakazi wa Misri na Kanaani watajwe wazi badala ya kuhusisha matendo moja kwa moja na nchi
  choice: kama watu wanavyotenda katika nchi ya Misri/Kanaani
  alternative: kulingana na matendo ya nchi ya Misri/Kanaani
  rationale: Kiebrania kinayahusisha matendo na ‘nchi’ kwa usemi wa kiidioma. ‘Watu’ hapa ni wakazi wanaodokezwa na usemi huo, hivyo tafsiri inaepuka dhana isiyo ya kawaida kwamba ardhi ndiyo inayotenda bila kubadili lengo la katazo.
- issue: Maana ya חֻקֹּתֵיהֶם kati ya masharti, sheria, kanuni, na desturi
  choice: masharti yao
  alternative: desturi zao
  rationale: Katika muktadha huu wa kisheria, ‘masharti’ yanadumisha maana ya kanuni zenye mamlaka na tofauti iliyopo na masharti ya Bwana katika mistari inayozunguka. Tanbihi inahifadhi uwezekano wa maana ya ‘desturi.’
- issue: Ikiwa sitiari ya ‘kuenenda’ ihifadhiwe au itafsiriwe tu kama ‘kufuata’
  choice: Msienende kwa kufuata
  alternative: Msifuate
  rationale: Chaguo hili linahifadhi picha ya Kiebrania ya mwenendo wa maisha na wakati huohuo linaifanya maana yake ieleweke kwa msomaji wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Msitende’ na ‘msienende’ huhifadhi uzito wa katazo la agano bila kuwa cha kale kupita kiasi; urudiaji wa vifungu vya Misri na Kanaani unadumisha usambamba wa Kiebrania.
