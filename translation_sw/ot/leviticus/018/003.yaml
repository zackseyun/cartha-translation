review_pass:
  verdict: revise
  source_fidelity: The two parallel prohibitions accurately convey the Hebrew idiom of the practices of Egypt and Canaan as referring to their inhabitants. The final clause, however, is weakened by the awkward and redundant "msienende kwa kufuata masharti yao." Moreover, "masharti" commonly means conditions or requirements and is less suitable here than a term for established laws or statutes.
  naturalness: '"Msitende kama watu wanavyotenda" is clear, natural Standard East African Swahili. "Msienende kwa kufuata masharti yao" is not idiomatic: "kuenenda" and "kufuata" duplicate the same idea, and the construction is cumbersome. "Msiishi kwa kufuata sheria zao" is natural while retaining the conduct-of-life force of the Hebrew walking metaphor.'
  terminology: '"Sheria zao" appropriately renders חֻקֹּתֵיהֶם in this legal context as the norms/laws belonging to the peoples concerned. The footnote retains "desturi" as a viable alternative where the term is understood as established custom.'
  issues:
  - severity: medium
    issue: Awkward and redundant final prohibition
    rationale: The phrase "Msienende kwa kufuata masharti yao" combines two overlapping expressions for following a norm and yields unnatural Swahili. "Masharti" also tends to denote conditions rather than statutes or binding legal norms.
  revised_text: Msitende kama watu wanavyotenda katika nchi ya Misri[a], ambako mliishi; wala msitende kama watu wanavyotenda katika nchi ya Kanaani, ambako ninawapeleka. Wala msiishi kwa kufuata sheria zao[b].
  revised_footnotes:
