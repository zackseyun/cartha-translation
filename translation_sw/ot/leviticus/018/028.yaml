  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: sw
  text: ili nchi isiwatapike[a] mkiifanya iwe najisi, kama ilivyolitapika taifa lililokuwa kabla yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “isiwateme” / “ilivyolitema.” Kiebrania kinatumia taswira yenye nguvu ya nchi kuwatoa wakazi wake kwa sababu ya unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: isiwatapike / ilivyolitapika
  rationale: Kitenzi ‘kutapika’ kinahifadhi taswira yenye nguvu ya nchi kuwafukuza wakazi wake kama kitu kichafu, badala ya kuilegeza kuwa ‘kuwafukuza’ tu.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Muktadha unahusu nchi ya Kanaani, si dunia yote; ‘nchi’ ndiyo tafsiri ya kawaida na inayofaa hapa.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: mtakapoitia unajisi
  rationale: Muundo wenye בְּ pamoja na jina-kitenzi unaweza kuwa wa wakati au wa njia. ‘Mtakapoitia unajisi’ ni Kiswahili cha kawaida na kinahifadhi wazo la kuifanya nchi iwe najisi.
- source_word: הַגּוֹי
  choice: taifa
  rationale: Nomino ya umoja yenye maana ya kundi inarejelea wakazi waliotangulia kama taifa; ‘taifa’ huhifadhi umoja huo bila kuingiza maana ya baadaye ya kidini.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: lililokuwako kabla yenu
  rationale: Kirai hiki kinaonyesha taifa lililokuwa nchini kabla ya Israeli; usemi huu unaeleza wazi utangulizi wa wakati.
- source_word: וְלֹא
  choice: ili ... isi-
  rationale: Ingawa kwa umbo ni ‘na si,’ katika muktadha kinaendeleza kusudi au matokeo hasi ya onyo lililotangulia. ‘Ili ... isi-’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Nchi kupewa sifa ya kutenda kama mhusika wa hukumu
  choice: Nchi imeachwa kuwa kiima kinachowatapika wakazi wake.
  alternative: Kueleza moja kwa moja kwamba Mungu anawafukuza kupitia nchi.
  rationale: Kiebrania kinaifanya nchi yenyewe ionekane ikiitikia unajisi. Kuhifadhi taswira hiyo hudumisha mvutano wa kiteolojia wa sura hii bila kuongeza maelezo yasiyotajwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inahifadhi taswira kali ya Kiebrania. Muundo ‘lililokuwako’ umetumiwa badala ya ‘lililokuwa’ pekee ili kuonyesha wazi taifa lililokaa nchini hapo awali.
