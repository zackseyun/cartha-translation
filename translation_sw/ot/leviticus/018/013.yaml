base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: sw
  text: Usifunue uchi wa dada ya mama yako[a], kwa kuwa yeye ni jamaa wa karibu wa mama yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza maana moja kwa moja zaidi, “Usiwe na mahusiano ya kingono na dada ya mama yako.” Kiebrania kinasema kihalisi, “Usifunue uchi wa dada ya mama yako.”
    reason: lexical_alternative
  - marker: b
    text: “Jamaa wa karibu” linatafsiri neno la Kiebrania שְׁאֵר (she’er), ambalo hapa humaanisha mtu wa ukoo wa karibu, yaani mwenye uhusiano wa damu.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת
  choice: uchi wa
  rationale: Katika nahau ya kisheria ya Walawi 18, neno hili ni sehemu ya usemi wa staha unaomaanisha mahusiano ya kingono yaliyokatazwa. Kutumia “uchi” kunahifadhi picha na mtindo rasmi wa Kiebrania.
- source_word: תְגַלֵּה
  choice: usifunue
  rationale: Kitenzi hiki pamoja na “uchi” kinaunda nahau inayorudiwa katika sura hii. Katazo la moja kwa moja “usifunue” ni la kawaida na lenye uzito wa kisheria katika Kiswahili.
- source_word: אֲחוֹת אִמְּךָ
  choice: dada ya mama yako
  rationale: Hili linawasilisha moja kwa moja uhusiano uliotajwa na Kiebrania, badala ya kutumia neno pana “shangazi,” ambalo linaweza pia kumaanisha dada ya baba.
- source_word: שְׁאֵר
  choice: jamaa wa karibu
  rationale: Katika sheria za ukoo, neno hili humaanisha mtu wa uhusiano wa karibu wa kimwili au kifamilia. “Jamaa wa karibu” ni wazi na la kawaida bila kulifanya kuwa “ndugu” kwa maana ya kaka au dada pekee.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinatoa sababu ya katazo; “kwa kuwa” kinafaa katika mtindo rasmi wa sheria.
- source_word: הִוא
  choice: yeye ni
  rationale: Kiwakilishi cha Kiebrania kinarejelewa wazi kwa “yeye,” kikimtaja tena dada ya mama kama msingi wa sababu hiyo.
theological_decisions:
- issue: Namna ya kutafsiri nahau ya sheria ya kujamiiana bila kuondoa usemi wake wa staha
  choice: Kuhifadhi nahau “kufunua uchi” katika andiko kuu
  alternative: Kutafsiri kwa maana wazi zaidi, “kuwa na mahusiano ya kingono”
  rationale: Kiebrania hutumia nahau hii mara kwa mara katika Walawi 18. Kuihifadhi kunadumisha mshikamano wa kifasihi, uzito wa kisheria, na usemi wa staha wa chanzo; tanbihi inaeleza maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo rasmi na wenye heshima unaofaa sheria. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida, huku nahau kuu ya Kiebrania ikihifadhiwa na kufafanuliwa katika tanbihi.
