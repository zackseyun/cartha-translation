  source_fidelity: The Hebrew joins “the nakedness of your father” and “the nakedness of your mother” with וְ (“and”) under the single prohibition. Although the following clause identifies the mother as the immediate referent, rendering the conjunction as “yaani” (“that is”) settles an interpretive relationship more explicitly than the Hebrew wording itself does.
  naturalness: “Usifunue uchi wa …” is clear, dignified modern Standard East African Swahili and suitably preserves the chapter’s euphemistic legal idiom. Under a negative command, “wala” naturally conveys the coordinated second object.
  terminology: “Uchi” appropriately retains the Hebrew euphemism ערוה without needlessly making the sexual sense explicit. The kinship terms and repeated legal formula are consistent and natural.
  issues:
