    issue: “Yaani” replaces the Hebrew coordination with an explicit appositional explanation.
    rationale: The source reads “the nakedness of your father and the nakedness of your mother,” while the explanatory clause that follows permits, but does not require, the appositional construal. A translation should retain this syntactic interpretive openness.
  - severity: low
    issue: The alternative-reading footnote becomes unnecessary after a source-close main-text revision.
    rationale: The revised wording directly represents the Hebrew coordination, so retaining a footnote framed as a more literal alternative would be misleading.
