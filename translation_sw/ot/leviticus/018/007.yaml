id: LEV.18.7
reference: Leviticus 18:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: sw
  text: Usifunue uchi wa baba yako wala uchi wa mama yako. Yeye ni mama yako; usifunue uchi wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְוַת
  choice: uchi wa
  rationale: Katika Walawi 18, עֶרְוָה katika msemo גלה ערוה ni lugha ya staha ya kisheria inayorejelea mahusiano ya kingono yaliyokatazwa. “Uchi” huhifadhi taswira ya Kiebrania na uzito wa kisheria bila kufafanua kupita kiasi.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: usifunue
  rationale: Kitenzi hiki pamoja na עֶרְוָה kinaunda kauli ya marufuku inayorudiwa katika sura hii. “Usifunue” huhifadhi msemo huo na marudio yake.
- source_word: אָבִיךָ
  choice: baba yako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya jina la undugu lenye kiambishi cha nafsi ya pili umoja.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: yaani, uchi wa mama yako
  rationale: Ingawa וְ inaweza kutafsiriwa “na,” sentensi inayofuata, “Yeye ni mama yako,” inaunga mkono kuelewa kirai hiki kuwa ufafanuzi wa “uchi wa baba yako.” “Yaani” huonyesha uhusiano huo huku tafsiri ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: הִוא
  choice: Yeye ni
  rationale: Kiwakilishi hiki ni cha kike, umoja, na kinamrejelea mama. “Yeye” hudumisha msisitizo wa Kiebrania.
- source_word: אִמְּךָ
  choice: mama yako
  rationale: Tafsiri ya moja kwa moja ya jina la undugu; kurudiwa kwake kunahifadhi msisitizo na uwazi wa kisheria.
theological_decisions:
- issue: Maana ya “uchi wa baba yako” na uhusiano wake na “uchi wa mama yako”
  choice: 'Virai vimetafsiriwa kwa uhusiano wa ufafanuzi: “uchi wa baba yako, yaani, uchi wa mama yako.”'
  alternative: “uchi wa baba yako na uchi wa mama yako”
  rationale: Katika muktadha wa mstari huu, kauli “Yeye ni mama yako” inaelekeza kwenye mama kuwa mhusika wa moja kwa moja, huku tendo dhidi yake likihesabiwa pia kuwa kufunua uchi wa baba. Tanbihi inadumisha uwezekano wa kusoma viunganishi hivyo kwa uratibu wa karibu zaidi na muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa sasa, wenye heshima na uzito wa kisheria. Msemo “kufunua uchi” umehifadhiwa kama lugha ya staha badala ya kuweka wazi moja kwa moja tendo la kingono.
