  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: sw
  text: Mtazitekeleza hukumu zangu, nanyi mtayashika masharti yangu, ili mwenende katika hayo.[a] Mimi ni Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “ili mtembee katika hayo.” Hii ni nahau ya kuuelekeza mwenendo wa maisha kulingana na maagizo ya Mungu.
    reason: Hufafanua sitiari ya Kiebrania bila kuifanya tafsiri ya matini kuu kuwa ya kutafsiri kupita kiasi, na huhifadhi wingi wa neno "hayo."
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: hukumu zangu
  rationale: Neno מִשְׁפָּטַי lina maana ya maamuzi au kanuni za kisheria. “Hukumu zangu” linadumisha uzito wake wa kisheria na kulitofautisha na חֻקֹּתַי.
- source_word: תַּעֲשׂוּ
  choice: mtazitekeleza
  rationale: Ingawa maana ya msingi ni “kufanya,” katika muktadha wa sheria “kutekeleza” huonyesha kwa Kiswahili cha kawaida kwamba maagizo hayo yanapaswa kufanyiwa kazi.
- source_word: חֻקֹּתַי
  choice: masharti yangu
  rationale: חֻקָּה hurejelea agizo au sharti lililowekwa. “Masharti yangu” ni la asili katika Kiswahili na linabaki tofauti na “hukumu zangu.”
- source_word: תִּשְׁמְרוּ
  choice: kuyashika
  rationale: שׁמר katika muktadha wa agano humaanisha kuyatunza na kuyatii maagizo kwa uangalifu; “kuyashika” ni usemi wa kawaida wa kibiblia na unaoeleweka.
- source_word: לָלֶכֶת בָּהֶם
  choice: ili mwenende kwa kuyafuata
  rationale: Kiebrania kinasema kihalisi “kwenda/kutembea ndani yake,” nahau inayohusu mwenendo wa kudumu. Tafsiri hii inadumisha wazo la mwenendo bila kuwa ngumu au isiyo ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kama “Yahweh,” badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Hii ndiyo maana ya moja kwa moja ya umbo lenye kiambishi cha nafsi ya pili wingi, nalo linaonyesha uhusiano wa agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi waziwazi.
- issue: Nguvu ya nahau לָלֶכֶת בָּהֶם
  choice: ili mwenende kwa kuyafuata
  alternative: ili mpate kuishi kwa hayo
  rationale: Nahau hapa inasisitiza kupanga mwenendo kwa kufuata sheria za Mungu. Tafsiri iliyochaguliwa haiongezi kimya-kimya maana yenye nguvu zaidi ya kupata au kudumisha uhai kwa kuzitii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Hukumu” na “masharti” yametofautishwa ili kutosawazisha istilahi mbili za Kiebrania; “mwenende” huhifadhi mwangwi wa sitiari ya kutembea bila kuifanya sentensi kuwa ngumu.
