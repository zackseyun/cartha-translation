  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עֶרְוַ֥ת כַּלָּֽתְ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אֵ֤שֶׁת בִּנְ/ךָ֙ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: sw
  text: Usifunue uchi wa binti-mkwe wako[a]; yeye ni mke wa mwanao; usifunue uchi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kufunua uchi”; huu ni usemi wa kisheria unaorudiwa katika Walawi kumaanisha mahusiano ya kingono yaliyokatazwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: uchi wa
  rationale: Katika Walawi 18, nomino hii katika usemi ‘kufunua uchi’ ni tafsida ya kisheria inayohusu mahusiano ya kingono yaliyokatazwa. ‘Uchi’ huhifadhi taswira na urudiaji wa Kiebrania.
- source_word: כַּלָּתְךָ
  choice: mkwe wako
  rationale: Neno hili humaanisha mke wa mwana wa anayesemeshwa. ‘Mkwe wako’ ni istilahi ya kawaida ya Kiswahili, na kishazi kinachofuata kinaondoa uwezekano wa maana nyingine za neno ‘mkwe’.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: usifunue
  rationale: Kitenzi גלה katika Piel pamoja na עֶרְוָה huunda kauli ya katazo inayorudiwa katika sura hii. ‘Usifunue’ huhifadhi muundo wa kisheria na tafsida ya chanzo.
- source_word: אֵשֶׁת בִּנְךָ
  choice: mke wa mwanao
  rationale: Kishazi hiki kinamtambulisha mkwe anayekusudiwa na kueleza msingi wa uhusiano uliotajwa kwa lugha ya kawaida na iliyo wazi.
- source_word: הִוא
  choice: yeye ni
  rationale: Kiwakilishi hiki kina nguvu ya kumtambulisha na kumfafanua mwanamke aliyetajwa. ‘Yeye ni’ huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: עֶרְוָתָהּ
  choice: uchi wake
  rationale: Urudiaji wa ‘uchi wake’ huhifadhi urudiaji na mtindo wa kisheria wa maandishi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri usemi ‘kufunua uchi’ katika katazo la kingono
  choice: Kuhifadhi usemi ‘kufunua uchi’ badala ya kuubadili kuwa maelezo ya moja kwa moja kama ‘kufanya naye ngono.’
  alternative: Usifanye ngono na mkwe wako.
  rationale: Kiebrania kinatumia tafsida hii ya kisheria kwa uthabiti katika Walawi 18. Kuihifadhi kunadumisha uhusiano wa vifungu vya sura hii na kuepuka kufuta kwa tafsiri taswira na mvutano wa lugha ya chanzo; tanbihi inaeleza maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko ya kisheria. ‘Mkwe’ linaweza kuwa pana katika Kiswahili, lakini maelezo ‘mke wa mwanao’ yanabainisha maana inayokusudiwa. Urudiaji wa katazo umehifadhiwa kwa kufuata msisitizo wa Kiebrania.
