  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: sw
  text: Usifunue uchi wa mke wa ndugu yako[a]; huo ni uchi wa ndugu yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “Usijamiane na mke wa ndugu yako.” Kiebrania kinatumia nahau “kufunua uchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: uchi wa
  rationale: Katika Walawi 18, neno hili ndani ya nahau גלה ערוה ni usemi wa kisheria wenye staha unaohusu kufunua uchi au kujamiana kusikokubalika. Kutumia “uchi” kunahifadhi taswira, urudiaji, na uzito wa kisheria wa Kiebrania.
- source_word: אֵשֶׁת
  choice: mke wa
  rationale: 'Katika muundo huu pamoja na “ndugu yako,” maana yake ni ya ndoa: “mke wa ndugu yako.” “Mwanamke wa” isingekuwa sahihi wala ya kawaida katika Kiswahili.'
- source_word: אָחִיךָ
  choice: ndugu yako
  rationale: Ni neno la moja kwa moja la undugu; katika muktadha huu linamaanisha ndugu wa kiume, kama inavyodhihirishwa na kutajwa kwa mke wake.
- source_word: לֹא תְגַלֶּה
  choice: usifunue
  rationale: Muundo wa לֹא pamoja na kitenzi kisichotimilika katika sheria unaonyesha katazo. “Usifunue” ni katazo la kawaida, wazi, na lenye hadhi katika Kiswahili.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: huo ni uchi wa ndugu yako
  rationale: Kifungu hiki kinatoa msingi wa katazo kwa kuutambulisha uchi wa mke huyo kuwa uchi wa ndugu yake. “Huo” inarejelea “uchi” na kuhifadhi urudiaji wa neno la Kiebrania.
theological_decisions:
- issue: Iwapo nahau ya kisheria yenye staha ifafanuliwe moja kwa moja kuwa katazo la kujamiiana
  choice: Kuhifadhi nahau “kufunua uchi” katika matini kuu
  alternative: Usijamiane na mke wa ndugu yako
  rationale: Kiebrania kinatumia nahau ya kawaida ya kisheria badala ya usemi wa moja kwa moja. Kuihifadhi kunabaki karibu na chanzo, kunadumisha ulinganifu ndani ya Walawi 18, na hakufuti upeo wa taswira ya asili; tanbihi inaeleza maana yake ya wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama sheria ya chanzo; nahau yenye staha na urudiaji wa “uchi” vimehifadhiwa.
