  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: sw
  text: Usifunue uchi wa binti wa mwanao wa kiume wala wa binti wa binti yako[a], kwa maana wao ni uchi wako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye kufafanua zaidi, “Usiwe na mahusiano ya kingono na binti wa mwanao wa kiume wala na binti wa binti yako.” Nahau ya Kiebrania kihalisi ni “kufunua uchi wa.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi, “kwa maana wao ni uchi wako.” Usemi huu unaeleza ukaribu wao wa kifamilia na ndio sababu ya katazo hili.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: uchi
  rationale: Neno “uchi” linahifadhi sitiari ya kisheria ya Kiebrania גלה ערוה na urudiaji wake katika sura hii, huku dokezo likifafanua kuwa ni nahau inayohusu mahusiano ya kingono yaliyokatazwa.
- source_word: בַּת בִּנְךָ
  choice: binti ya mwanao wa kiume
  rationale: Kauli hii inabainisha kwa usahihi mjukuu wa upande wa mwana wa kiume na kuhifadhi muundo wa ukoo wa Kiebrania.
- source_word: בַת בִּתְּךָ
  choice: binti ya mwanao wa kike
  rationale: Kauli hii inabainisha kwa usahihi mjukuu wa upande wa mwana wa kike na kuweka ulinganifu na kishazi kilichotangulia.
- source_word: לֹא תְגַלֶּה
  choice: Usifunue
  rationale: Huhifadhi amri ya kukataza pamoja na nahau kuu “kufunua uchi,” badala ya kuibadili kimya kuwa ufafanuzi wa mahusiano ya kingono.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaonyesha msingi au sababu ya katazo katika mtindo wa kisheria wenye hadhi.
- source_word: הֵנָּה
  choice: wao ni
  rationale: Kiwakilishi cha wingi wa kike kinawarejelea wajukuu wawili; Kiswahili cha kawaida hutumia “wao” bila kuonyesha jinsia ya kisarufi.
theological_decisions:
- issue: Maana ya sababu ya mwisho, “wao ni uchi wako”
  choice: Kudumisha usemi wa kifamilia “wao ni uchi wako” katika matini kuu
  alternative: kwa maana uchi wao ni uchi wako mwenyewe
  rationale: Kiebrania kinasema moja kwa moja kwamba “wao” ni uchi wako, kikionyesha utambulisho au mshikamano wa karibu wa kifamilia. Tafsiri ya moja kwa moja huhifadhi mvutano wa usemi huo bila kuuingiza katika maelezo ya kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi na wenye hadhi. “Binti ya mwanao wa kiume/kike” imetumiwa badala ya “mjukuu wako” ili kuhifadhi tofauti ya pande mbili za ukoo. Alama za madokezo zimewekwa mara moja kila moja katika matini kuu.
