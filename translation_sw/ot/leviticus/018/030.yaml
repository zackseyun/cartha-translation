id: LEV.18.30
reference: Leviticus 18:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: sw
  text: Kwa hiyo mtashika agizo langu, ili msifuate desturi zozote za kuchukiza[a] zilizotendwa kabla yenu, wala msijitie unajisi kwa hizo. Mimi ni Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sheria za kuchukiza” au “taratibu za kuchukiza.” Neno la Kiebrania linaweza kumaanisha desturi au taratibu zilizowekwa, si sheria rasmi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: mtashika
  rationale: Kitenzi שׁמר kina maana ya kushika, kulinda, au kutii. ‘Mtashika’ kinadumisha uzito wa agizo la agano na namna ya kuelekeza iliyomo katika muktadha.
- source_word: מִשְׁמַרְתִּי
  choice: agizo langu
  rationale: מִשְׁמֶרֶת hueleza jambo au wajibu uliokabidhiwa mtu alishike. ‘Agizo langu’ ni Kiswahili cha kawaida na chenye heshima, bila kupunguza nguvu ya wajibu huo.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: ili msifuate
  rationale: Muundo huu unaonyesha kusudi la kuzuia jambo. Kwa desturi zinazotendwa mara kwa mara, ‘msifuate’ ni ya asili zaidi kuliko ‘msifanye’ na inaonyesha kutokufuata mwenendo huo.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: desturi zozote za kuchukiza
  rationale: חֻקּוֹת hapa inaweza kumaanisha desturi, taratibu zilizowekwa, au sheria. Muktadha unahusu matendo yaliyozoeleka ya watu waliotangulia; ‘zozote’ linaonyesha maana ya sehemu iliyomo katika מִן, na ‘za kuchukiza’ linahifadhi uzito wa תּוֹעֵבֹת.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: zilizofuatwa kabla yenu
  rationale: Kauli tendwa inaonyesha desturi zilizotekelezwa na waliokuwapo mapema. ‘Kabla yenu’ linahifadhi maana ya wakati bila kuongeza maelezo yasiyotajwa wazi.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: wala msijitie unajisi kwa hizo
  rationale: 'Umbo la kitenzi lina nguvu ya kujirejelea: kujifanya au kujitia unajisi. ‘Kwa hizo’ linaonyesha kuwa desturi hizo ndizo njia au sababu ya unajisi.'
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Mimi ni Yahwe, Mungu wenu
  rationale: Hili linahifadhi kauli ya utambulisho wa kiagano na kutaja jina la Mungu יהוה kwa ‘Yahwe’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. ‘Yahwe’ linawakilisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kimaadili na kiibada ya תּוֹעֵבֹת
  choice: za kuchukiza
  alternative: za chukizo / za karaha
  rationale: ‘Za kuchukiza’ linaonyesha hukumu kali ya maandishi bila kuongeza aina maalumu ya kosa ambayo neno lenyewe halitaji hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtindo wa sheria ya agano, huku ‘desturi’ na ‘zilizofuatwa’ vikifanya maana ya mwenendo uliozoeleka iwe wazi kwa msomaji wa kawaida.
