review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s covenantal command, the prohibition, and the final divine self-identification. However, the Hebrew passive נַעֲשׂוּ means “were done/practiced,” whereas “zilizofuatwa” (“that were followed”) repeats the interpretive verb used earlier and is less exact. Rendering it as “zilizotendwa” preserves the source wording and remains natural.
  naturalness: The register is clear Standard East African Swahili. “Mtashika agizo langu” is intelligible and suitably formal in this legal-covenantal context. “Msijitie unajisi kwa hizo” is idiomatic and appropriately reflects the reflexive verbal form.
  terminology: “Desturi ... za kuchukiza” suitably renders the disputed range of חֻקּוֹת הַתּוֹעֵבֹת without over-specifying it as formal law. “Yahwe” is an acceptable Swahili-form rendering of the divine name and is consistent with the draft’s stated naming policy. The lexical footnote appropriately retains “sheria” and “taratibu” as alternatives.
  issues:
  - severity: medium
    issue: “zilizofuatwa kabla yenu” does not directly reflect the passive verb “were done/practiced.”
    rationale: The Hebrew אֲשֶׁר נַעֲשׂוּ means “which were done.” Although customs may be followed, “zilizotendwa” more accurately represents the source and avoids unnecessarily recasting the action as adherence.
  revised_text: Kwa hiyo mtashika agizo langu, ili msifuate desturi zozote za kuchukiza[a] zilizotendwa kabla yenu, wala msijitie unajisi kwa hizo. Mimi ni Yahwe, Mungu wenu.
  revised_footnotes:
  - marker: a
    text: Au “sheria za kuchukiza” au “taratibu za kuchukiza.” Neno la Kiebrania linaweza kumaanisha desturi au taratibu zilizowekwa, si sheria rasmi tu.
    reason: lexical_alternative
  revision_rationale: 'Only the rendering of the passive clause has been revised: “zilizotendwa” directly represents the Hebrew “were done/practiced.” All other wording is retained because it faithfully and naturally communicates the source in a formal Swahili register.'
