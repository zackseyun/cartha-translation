  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: sw
  text: Usifunue uchi wa mke wa baba yako[a]; huo ni uchi wa baba yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “Usiwe na mahusiano ya kingono na mke wa baba yako.” Kiebrania kinasema kihalisi, “usifunue uchi wa …”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: uchi wa
  rationale: Katika Walawi 18, nomino hii ni sehemu ya nahau ya kisheria inayorudiwa, ‘kufunua uchi,’ inayodokeza mahusiano ya kingono yaliyokatazwa. ‘Uchi wa’ huhifadhi nahau hiyo na mtindo wake wa staha.
- source_word: אֵשֶׁת
  choice: mke wa
  rationale: Katika muundo huu wa umilikaji pamoja na ‘baba yako,’ neno hili linamaanisha mke, si mwanamke kwa ujumla.
- source_word: לֹא תְגַלֵּה
  choice: usifunue
  rationale: Ukanushaji huu wa kisheria unawasilishwa kwa kawaida na moja kwa moja katika Kiswahili kama ‘usifunue,’ huku ukihifadhi sitiari ya Kiebrania.
- source_word: אָבִיךָ
  choice: baba yako
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa umilikaji, na imerudiwa ili kuhifadhi uwazi na msisitizo wa chanzo.
- source_word: הִוא
  choice: huo ni
  rationale: Kiwakilishi kinarejelea ‘uchi,’ si kumtambulisha mwanamke mwenyewe. Kwa kuwa ‘uchi’ ni nomino ya ngeli ya U, ‘huo ni’ ni upatanisho wa kawaida wa Kiswahili.
theological_decisions:
- issue: Iwapo nahau ya kisheria yenye staha itafsiriwe waziwazi kuwa katazo la mahusiano ya kingono
  choice: Kuhifadhi nahau ‘kufunua uchi’ katika matini kuu
  alternative: Usiwe na mahusiano ya kingono na mke wa baba yako
  rationale: Kiebrania kinatumia kauli ya kisheria inayorudiwa katika sura hii. Kuihifadhi hudumisha mshikamano wa msamiati na kiwango cha staha cha chanzo, bila kuficha maana yake inayowezekana; ufafanuzi wa moja kwa moja umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa sheria ni mfupi na wa moja kwa moja, huku nahau ya chanzo ikihifadhiwa.
