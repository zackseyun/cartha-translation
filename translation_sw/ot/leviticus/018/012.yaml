  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: sw
  text: Usifunue uchi wa dada ya baba yako[a]; yeye ni jamaa wa karibu wa baba yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kufunua uchi wa” ni msemo wa kisheria katika Walawi unaorejelea mahusiano ya kingono yaliyokatazwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “yeye ni nyama ya baba yako,” yaani jamaa yake wa karibu.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: uchi wa
  rationale: Katika Walawi 18, neno hili ni sehemu ya msemo wa kisheria unaokataza kufunua uchi katika mahusiano ya kingono yasiyoruhusiwa. “Uchi” huhifadhi picha ya Kiebrania bila kuufafanua kupita kiasi.
- source_word: לֹא תְגַלֵּה
  choice: usifunue
  rationale: Huhifadhi muundo wa katazo na msemo unaorudiwa katika sura hii; tafsiri ya moja kwa moja zaidi kuhusu kujamiiana ingeeleza maana kwa upana kuliko maneno yenyewe.
- source_word: אֲחוֹת אָבִיךָ
  choice: dada ya baba yako
  rationale: Ni Kiswahili cha kawaida na wazi kinachoonyesha moja kwa moja uhusiano wa kifamilia uliotajwa.
- source_word: שְׁאֵר
  choice: ndugu wa karibu
  rationale: Katika muktadha wa undugu, neno hili humaanisha mtu wa ukoo wa karibu, yaani mwenye uhusiano wa damu. Hii ni ya asili zaidi kwa Kiswahili kuliko tafsiri halisi “nyama,” huku tanbihi ikihifadhi picha hiyo.
- source_word: הִוא
  choice: yeye ni
  rationale: Kiwakilishi kinamtambulisha mwanamke huyo kuwa katika kiwango hiki cha undugu uliokatazwa; “yeye ni” ni wazi na cha kawaida.
theological_decisions:
- issue: Kutafsiri msemo wa sheria ya mahusiano ya kingono bila kuufafanua kupita kiasi
  choice: Kuhifadhi msemo “kufunua uchi” katika matini kuu.
  alternative: Kutafsiri moja kwa moja kuwa “usifanye naye ngono.”
  rationale: Msemo wa Kiebrania ni wa kisheria na unarudiwa katika Walawi 18. Kuuhifadhi kunadumisha mshikamano wa sura na kuepuka kuingiza ufafanuzi mpana kuliko matini yenyewe, huku tanbihi ikieleza maana yake katika muktadha.
- issue: Maana ya שְׁאֵר katika kauli ya undugu
  choice: “ndugu wa karibu” katika matini kuu, pamoja na tanbihi inayotaja maana halisi “nyama.”
  alternative: “nyama ya baba yako” au “ndugu wa damu wa baba yako.”
  rationale: Neno hilo lina picha ya kuwa nyama moja na mtu wa ukoo, lakini hapa nguvu yake ni uhusiano wa karibu wa kifamilia. Tafsiri iliyochaguliwa ni wazi bila kufuta picha ya chanzo, ambayo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa katazo umefanywa wa moja kwa moja, na msemo wa Kiebrania umehifadhiwa katika matini huku maana yake ikifafanuliwa katika tanbihi.
