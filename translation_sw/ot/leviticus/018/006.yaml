  verdict: revise
  source_fidelity: The distributive prohibition, the approach-plus-purpose construction, the Levitical idiom, and the divine-name formula are substantially retained. However, "ndugu yake wa karibu wa damu" can be read narrowly as the man's own sibling and is less accurate than the Hebrew kinship term, which encompasses any close blood relative.
