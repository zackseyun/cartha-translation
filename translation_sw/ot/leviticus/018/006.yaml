base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: sw
  text: Mtu yeyote miongoni mwenu asimkaribie jamaa yeyote wa karibu wa damu yake ili kufunua uchi wake[a]. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kufunua uchi” ni nahau ya kisheria katika sura hii inayorejelea kufunua uchi kwa njia ya kingono iliyokatazwa au kuwa na mahusiano ya kingono na jamaa wa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Mtu yeyote miongoni mwenu
  rationale: Urudiaji huu una nguvu ya kugawa kwa kila mtu mmoja mmoja. Katika katazo la Kiswahili, “mtu yeyote ... asi-” huwasilisha maana hiyo kwa lugha ya kawaida, huku “miongoni mwenu” ikifafanua walengwa kutokana na muktadha.
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: ndugu yake wa karibu wa damu
  rationale: Kirai hiki kinamaanisha jamaa wa karibu kwa msingi wa undugu wa kimwili. “Ndugu ... wa damu” ni Kiswahili kinachoeleweka, bila kutumia “ndugu” peke yake kwa namna inayoweza kudhaniwa kuwa ndugu wa tumbo tu.
- source_word: לֹא תִקְרְבוּ
  choice: asimkaribie
  rationale: Kitenzi קָרַב pamoja na אֶל kina maana ya kumkaribia mtu. Umbo hasi la Kiswahili linafaa kwa katazo la kisheria na linahifadhi lugha ya staha inayoelekea kwenye kusudi la kingono lililotajwa baada yake.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: ili kufunua uchi wake
  rationale: Tafsiri hii inadumisha nahau ya kisheria inayorudiwa katika sura hii. “Ili” huonyesha kusudi la kumkaribia; tanbihi inaeleza maana yake ya kingono bila kuifuta taswira ya Kiebrania katika matini kuu.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: Hifadhi jina la agano lililoandikwa moja kwa moja katika Kiebrania na msisitizo wa utambulisho wa Mungu unaotegemeza amri.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Matini ina jina la agano יְהוָה. Umbo la Kiswahili “Yahwe” linawakilisha jina hilo badala ya kulibadili kuwa cheo.
- issue: Iwapo nahau ya kingono iwekwe wazi moja kwa moja katika matini kuu
  choice: Kuhifadhi “kufunua uchi” katika matini kuu
  alternative: kufanya ngono na / kuwa na uhusiano wa kingono na
  rationale: Nahau hiyo inarudiwa katika sura nzima na ni sehemu ya mtindo wake wa kisheria. Kuihifadhi huepuka kutatua kupita kiasi upeo wake—unaoweza kuhusisha kufichua uchi au mahusiano ya kingono—huku tanbihi ikimsaidia msomaji wa sasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisheria bila kuwa kigumu. “Ndugu wa karibu wa damu” ni wazi zaidi kwa wasomaji wa kawaida kuliko tafsiri ya neno kwa neno kama “jamaa wa mwili wake.” Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
