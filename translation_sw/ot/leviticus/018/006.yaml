  terminology: '"Kufunua uchi" appropriately preserves the repeated Hebrew legal idiom. The note should explain it without implying that only one specific act is meant. "Yahweh" is retained with the spelling used in the English POB audit trail and a widely recognizable transliteration of the Tetragrammaton.'
