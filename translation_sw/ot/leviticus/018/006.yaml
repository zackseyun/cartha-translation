    rationale: Ndugu commonly denotes a sibling in Swahili, whereas שְׁאֵר בְּשָׂרוֹ denotes a broader category of close blood kin. The possessive construction can also distract from the legal scope of the prohibition.
  - severity: low
    issue: The footnote's wording "kufichua uchi" does not precisely match the main-text wording and is somewhat awkward in its explanatory clause.
    rationale: Using "kufunua uchi" consistently and describing the expression as a prohibited sexual idiom gives a clearer explanation while preserving the idiom's breadth.
