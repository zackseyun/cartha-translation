id: LEV.18.17
reference: Leviticus 18:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: sw
  text: Usifunue uchi wa mwanamke na wa binti yake.[a] Usimchukue binti wa mwanawe wa kiume wala binti wa binti yake ili kufunua uchi wake; hao ni jamaa zake wa karibu.[b] Hilo ni tendo potovu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kufunua uchi” ni nahau ya Kiebrania inayomaanisha kuwa na mahusiano ya kingono yaliyokatazwa.
    reason: cultural_note
  - marker: b
    text: Kwa neno halisi, “hao ni mwili wake,” yaani, ni watu wa ukoo wake wa damu.
    reason: lexical_alternative
  - marker: c
    text: Au “tendo ovu,” “tendo la aibu,” au “tendo la kuchukiza sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה
  choice: kufunua uchi wa
  rationale: Huhifadhi nahau ya kisheria inayorudiwa katika Mambo ya Walawi. Katika muktadha huu nahau hiyo inamaanisha kuwa na mahusiano ya kingono yaliyokatazwa; tanbihi inaeleza maana hiyo.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: Neno linaweza kumaanisha mwanamke au mke. Hapa maana pana ya “mwanamke” haifungi sheria kwenye ndoa pekee.
- source_word: וּבִתָּהּ
  choice: na wa binti yake
  rationale: Kirai “wa” kinarudia kwa kawaida “uchi” bila kulazimika kurudia nomino nzima, huku kikihifadhi uhusiano wa umilikaji.
- source_word: תִקַּח
  choice: usimchukue
  rationale: Huhifadhi upana wa kitenzi cha Kiebrania, ambacho katika muktadha kinaweza kuhusisha kumchukua kwa ndoa au kwa muungano wa kingono, bila kukifinya kiwe ndoa rasmi tu.
- source_word: בַּת בְּנָהּ
  choice: binti wa mwanawe wa kiume
  rationale: Hutaja kwa uwazi mjukuu anayepitia kwa mwana wa kiume, kwa kuwa “mwana” peke yake katika Kiswahili cha sasa linaweza kueleweka kwa maana pana ya mtoto.
- source_word: בַּת בִּתָּהּ
  choice: binti wa binti yake
  rationale: 'Huhifadhi kwa uwazi muundo wa undugu wa Kiebrania: mjukuu anayepitia kwa binti.'
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: ili kufunua uchi wake
  rationale: Kiwakilishi cha umoja “wake” kimehifadhiwa bila kufafanuliwa zaidi, hivyo muunganiko na mwanamke wa kwanza pamoja na uwezekano wa usomaji wa kigawanyo havisuluhishwi kimya kimya.
- source_word: שַׁאֲרָה הֵנָּה
  choice: hao ni jamaa zake wa karibu
  rationale: Neno שְׁאֵר linaashiria mwili/undugu wa damu. “Jamaa zake wa karibu” ni Kiswahili cha kawaida kinachowasilisha maana ya ukoo huku tanbihi ikihifadhi taswira halisi ya “mwili wake.”
- source_word: זִמָּה
  choice: tendo potovu
  rationale: Neno hilo linahukumu kitendo kama uovu mkubwa, hasa wa kingono. “Tendo potovu” ni la kueleweka, zito, na haliongezi maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Kirejeleo cha kiambishi cha umoja katika “kufunua uchi wake”
  choice: Kuhifadhi “wake” bila kutaja wazi kinamrejelea nani
  alternative: Kukifafanua kuwa kinamrejelea mwanamke wa kwanza, au kukitumia kwa kila mmoja wa wajukuu
  rationale: Muundo wa karibu unaunganisha kiambishi hicho na mwanamke wa kwanza, lakini umbo lenyewe ni la umoja na tafsiri isiliongezee ufafanuzi hulinda mvutano wa Kiebrania.
- issue: Maana ya “kumchukua” katika sheria hii
  choice: usimchukue
  alternative: usimwoe; usifanye naye ngono
  rationale: Kitenzi cha chanzo ni kipana kuliko ndoa rasmi pekee. Kirai kinachofuata kinaonyesha kusudi la kingono, kwa hiyo “usimchukue” hakipunguzi wigo wa katazo.
- issue: Nguvu ya hukumu זִמָּה
  choice: tendo potovu
  alternative: uovu; tendo la aibu; tendo la kuchukiza sana
  rationale: Uteuzi huu unadumisha hukumu nzito ya kimaadili na ya kingono bila kuingiza istilahi ya dhehebu au kuongeza kiwango kisichowekwa wazi na neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi na wenye heshima. Nahau kuu ya Kiebrania imehifadhiwa kwa ulinganifu wa kifungu na vifungu jirani, huku tanbihi ikiieleza kwa msomaji wa kawaida. Miundo ya undugu imetolewa kwa uwazi bila kutumia istilahi nzito za kitaalamu.
