  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: sw
  text: Usilale na mwanamume kama unavyolala na mwanamke[a]; hilo ni chukizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “malalo ya mwanamke,” nahau inayorejelea kujamiiana na mwanamke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: mwanamume
  rationale: Neno זָכָר humaanisha mtu wa jinsia ya kiume. Katika Kiswahili sanifu, “mwanamume” ni tafsiri ya moja kwa moja na ya kawaida bila kuongeza sifa ambayo haimo katika Kiebrania.
- source_word: תִשְׁכַּב
  choice: usilale
  rationale: Kitenzi שׁכב hapa ni sitiari ya kujamiiana. “Usilale” kinahifadhi nahau ya Kiebrania, huku muktadha na kirai kinachofuata vikifanya maana ya kingono ieleweke.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: kama unavyolala na mwanamke
  rationale: Kwa tafsiri ya karibu, kirai hiki ni “malalo ya mwanamke,” lakini ni nahau inayorejelea kujamiiana na mwanamke. Chaguo hili ni la kawaida katika Kiswahili na linahifadhi muundo wa ulinganisho wa Kiebrania.
- source_word: תּוֹעֵבָה
  choice: chukizo
  rationale: “Chukizo” ni neno lenye uzito linaloonyesha jambo linalokirihisha au kuchukiza sana katika muktadha wa kanuni za utakatifu, bila kulifafanua zaidi ya matini.
- source_word: הִוא
  choice: hilo ni
  rationale: Kiwakilishi cha Kiebrania kinarejelea tendo lililokatazwa. “Hilo ni” ni mtindo wa kawaida wa Kiswahili wa kurejelea tendo lote lililotangulia.
theological_decisions:
- issue: Asili na upeo wa katazo katika muktadha wa kanuni za utakatifu
  choice: Kulifasiri kama katazo la moja kwa moja la tendo la kingono kati ya mwanamume na mwanamume, bila kuongeza masharti yanayolibana ambayo hayapo katika Kiebrania.
  alternative: Kulibana katazo kwa desturi maalumu za ibada, unyonyaji, au mazingira mengine yasiyotajwa moja kwa moja katika mstari huu.
  rationale: Kiebrania kinakataa kulala na mwanamume “malalo ya mwanamke” na kuliita tendo hilo תּוֹעֵבָה. Tafsiri inapaswa kutoa dai la matini bila kuingiza vibainishi vya ziada wala kulipanua kwa lugha ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “usilale na” umehifadhi nahau ya chanzo; tanbihi inaeleza kirai kisicho cha kawaida cha Kiebrania. “Chukizo” limechaguliwa kwa uzito wa kimaadili na kidini unaofaa muktadha bila kuongeza tafsiri ya kimadhehebu.
