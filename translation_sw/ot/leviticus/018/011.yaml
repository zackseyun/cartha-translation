  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: sw
  text: Usifunue uchi wa binti wa mke wa baba yako, ambaye baba yako alimzaa; yeye ni dada yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeye ni dada yako mnayeshiriki baba mmoja.” Kiebrania kinasema moja kwa moja, “yeye ni dada yako,” huku maelezo yaliyotangulia yakibainisha uhusiano huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: uchi wa ... / uchi wake
  rationale: Katika Mambo ya Walawi 18, neno hili ni sehemu ya kauli ya kudumu ya makatazo ya ngono, “kufunua uchi.” Tafsiri hii inadumisha lugha ya kisheria na ulinganifu na mistari mingine bila kutumia maelezo ya viungo vya mwili.
- source_word: בַּת
  choice: binti
  rationale: Ni neno la kawaida na la moja kwa moja la undugu.
- source_word: אֵשֶׁת אָבִיךָ
  choice: mke wa baba yako
  rationale: Huhifadhi uhusiano ulioelezwa wazi katika Kiebrania. “Mama yako wa kambo” lingeongeza hitimisho ambalo halijasemwa moja kwa moja na pia lingeweza kuficha kwamba mstari unamlenga binti wa mwanamke huyo.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: ambaye baba yako alimzaa
  rationale: Huonyesha asili ya kibayolojia kupitia baba kwa Kiswahili cha kawaida na kinachoeleweka. Muundo huu ni wa asili zaidi kuliko “aliyezaliwa na baba yako,” ambao unaweza kusikika kana kwamba baba ndiye aliyejifungua.
- source_word: אֲחוֹתְךָ הִוא
  choice: yeye ni dada yako
  rationale: Hufuata kauli ya Kiebrania bila kuongeza “wa kambo.” Maelezo yaliyotangulia ndiyo yanayobainisha aina ya uhusiano.
- source_word: לֹא תְגַלֶּה
  choice: Usifunue
  rationale: Ni katazo la moja kwa moja, la asili katika Kiswahili, na linafaa kwa mtindo wa sheria wa sura hii.
theological_decisions:
- issue: Iwapo uhusiano ubainishwe katika matini kuu kuwa wa dada anayeshiriki baba mmoja
  choice: Kuhifadhi kauli “yeye ni dada yako” katika matini kuu
  alternative: yeye ni dada yako mnayeshiriki baba mmoja
  rationale: Kiebrania chenyewe kinamwita “dada yako,” huku maelezo yaliyotangulia yakibainisha uhusiano huo. Kuongeza ufafanuzi katika matini kuu kungeondoa upana wa kauli ya chanzo; tanbihi inaweza kueleza maana ya kindugu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. “Ambaye baba yako alimzaa” limetumiwa ili kueleza uzao wa upande wa baba kwa uwazi na kwa lugha ya asili.
