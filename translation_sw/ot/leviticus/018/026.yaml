  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: sw
  text: Lakini ninyi wenyewe mtazishika amri zangu na hukumu zangu, wala msifanye lolote kati ya machukizo haya—wala mzawa wala mgeni akaaye kati yenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: mtazishika
  rationale: Katika muktadha wa agano na sheria, שׁמר humaanisha kushika au kuzingatia. Wakati ujao wa Kiswahili hapa una nguvu ya agizo na unaendeleza mtindo wa kisheria.
- source_word: אַתֶּם
  choice: ninyi wenyewe
  rationale: Kiwakilishi huru kinasisitiza mhusika zaidi ya kiambishi cha kitenzi; “ninyi wenyewe” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: חֻקֹּתַי
  choice: sheria zangu
  rationale: חֻקִּים ni maagizo yaliyowekwa. “Sheria” ni neno la kawaida na lenye hadhi linalowasilisha maana ya masharti yenye mamlaka.
- source_word: מִשְׁפָּטַי
  choice: hukumu zangu
  rationale: מִשְׁפָּטִים inaweza kumaanisha hukumu au maamuzi ya kisheria. “Hukumu” huhifadhi tofauti yake na חֻקִּים na ladha ya kisheria.
- source_word: תַעֲשׂוּ
  choice: msifanye
  rationale: עשה ni kitenzi kipana cha kufanya; pamoja na וְלֹא kinatoa katazo la moja kwa moja bila kuongeza wazo la mazoea ya kurudiwa.
- source_word: מִכֹּל
  choice: lolote kati ya
  rationale: Baada ya ukanushi, מן + כל huonyesha katazo linalojumuisha kila tendo katika kundi linalotajwa. “Lolote kati ya” ni Kiswahili asilia na sahihi.
- source_word: הַתּוֹעֵבֹת
  choice: machukizo
  rationale: תּוֹעֵבָה huonyesha mambo yanayochukiza sana katika maadili au ibada. “Machukizo” huhifadhi uzito wa tathmini hiyo bila ufafanuzi wa ziada.
- source_word: הָאֵלֶּה
  choice: haya
  rationale: Kionyeshi hiki kinarejelea matendo yaliyokatazwa yaliyotangulia katika sura.
- source_word: הָאֶזְרָח
  choice: mzawa
  rationale: אֶזְרָח ni mtu wa asili wa nchi au jumuiya. “Mzawa” ni fupi, wazi, na huhifadhi utofauti na mgeni mkazi.
- source_word: הַגֵּר
  choice: mgeni
  rationale: גֵּר ni mtu asiye mzawa anayeishi ndani ya jamii. “Mgeni” pamoja na kishazi kinachofuata huepuka neno la kizamani na kuonyesha wazi hali yake ya ukaaji.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: anayeishi kati yenu
  rationale: Kirai cha kisifa kinafafanua kuwa גֵּר anakaa ndani ya jumuiya; tafsiri hii ni ya kawaida na haidokezi ziara ya muda mfupi.
theological_decisions:
- issue: Upeo wa katazo kwa wazawa na wageni wanaoishi katika Israeli
  choice: Katazo linawahusu mzawa na mgeni anayeishi kati ya jamii.
  alternative: Kirai cha mwisho kinaweza kueleweka tu kuwa kinataja makundi yanayowajibika bila kusisitiza usawa wao.
  rationale: Muundo wa Kiebrania unawaweka הָאֶזְרָח na הַגֵּר wote chini ya katazo. Tafsiri haiongezi neno kama “sawasawa,” lakini hudumisha wazi kwamba makundi yote mawili yanahusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtazishika” na “wala msifanye” hudumisha sauti ya agizo la kisheria; “mgeni anayeishi kati yenu” ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi ya kitaalamu au ya kizamani.
