revisions:
- from: Lakini ninyi wenyewe mtazishika sheria zangu na hukumu zangu, wala msifanye lolote kati ya machukizo haya, iwe ni mzawa au mgeni anayeishi kati yenu.
  to: Lakini ninyi wenyewe mtazishika amri zangu na hukumu zangu, wala msifanye lolote kati ya machukizo haya—wala mzawa wala mgeni akaaye kati yenu.
  rationale: The revision preserves the source’s legal and emphatic force while making explicit, through the distributive construction "wala mzawa wala mgeni," that neither the native-born person nor the resident non-native may commit any of the stated abominations. "Amri" is used for the first member of the Hebrew legal pair so that it is not collapsed into "hukumu."
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:17:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic address, the paired legal terms, the comprehensive prohibition, and the inclusion of both the native-born person and the resident non-native. However, the final phrase "iwe ni mzawa au mgeni" is syntactically less direct and can momentarily sound as though it qualifies the prohibited act rather than identifies the persons bound by the prohibition.
  naturalness: '"Mtazishika," "machukizo," and "mgeni anayeishi kati yenu" are natural, dignified Standard East African Swahili. Recasting the final coordination with "wala ... wala" makes the legal scope clear and idiomatic.'
  terminology: '"Amri zangu na hukumu zangu" preserves a useful distinction between חֻקֹּתַי and מִשְׁפָּטַי in established Swahili biblical/legal register. "Mgeni akaaye kati yenu" suitably represents גֵּר ... הַגָּר בְּתוֹכְכֶם without implying a mere visitor.'
  issues:
  - severity: medium
    issue: The wording "iwe ni mzawa au mgeni anayeishi kati yenu" is structurally ambiguous.
    rationale: The Hebrew names the native-born and the resident foreigner as the people to whom the prohibition applies. In Swahili, "iwe ni" may be read as describing what kind of thing the abomination is, rather than clearly distributing the prohibition to each person.
  - severity: low
    issue: '"Sheria zangu" is broader than the specific legal sense of חֻקֹּתַי.'
    rationale: It is not wrong, but "amri zangu" more readily distinguishes the fixed prescriptions from "hukumu zangu" while retaining a natural biblical legal register.
  revised_text: Lakini ninyi wenyewe mtazishika amri zangu na hukumu zangu, wala msifanye lolote kati ya machukizo haya—wala mzawa wala mgeni akaaye kati yenu.
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s legal and emphatic force while making explicit, through the distributive construction "wala mzawa wala mgeni," that neither the native-born person nor the resident non-native may commit any of the stated abominations. "Amri" is used for the first member of the Hebrew legal pair so that it is not collapsed into "hukumu."
