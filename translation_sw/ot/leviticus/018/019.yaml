  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: sw
  text: Usimkaribie mwanamke wakati wa unajisi wa hedhi yake, ili kufunua uchi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa hali yake ya unajisi wa hedhi.” Kiebrania kinatumia lugha ya usafi wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה ... לֹא תִקְרַב
  choice: Usimkaribie mwanamke
  rationale: Kitenzi קָרַב pamoja na kihusishi אֶל kinaunda maana ya ‘kumkaribia.’ Muundo huu unadumisha mtindo wa katazo la kisheria na pia kidokezo cha kimuktadha cha kumkaribia kwa kusudi la ngono, bila kukifanya kiwe wazi zaidi kuliko Kiebrania.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: Neno אִשָּׁה linaweza kumaanisha ‘mwanamke’ au ‘mke.’ Hapa halina umilikishi na linatumika kwa maana ya jumla, hivyo ‘mwanamke’ ndiyo tafsiri inayofaa.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: wakati yuko katika unajisi wa hedhi yake
  rationale: נִדָּה hapa hurejelea hali inayohusiana na hedhi, na טֻמְאָה ni lugha ya unajisi wa kiibada. Tafsiri hii ni ya kawaida kwa Kiswahili na inahifadhi dhana hiyo ya kiibada.
- source_word: לְ/גַלּוֹת
  choice: ili kufunua
  rationale: גלה katika msemo huu humaanisha ‘kufunua.’ ‘Ili’ linaonyesha kusudi linalobebwa na לְ bila kuufafanua mno msemo wa staha wa kisheria.
- source_word: עֶרְוָתָהּ
  choice: uchi wake
  rationale: עֶרְוָה katika Walawi 18 ni ‘uchi’; pamoja na ‘kufunua’ huunda msemo wa staha wenye maana ya kingono. Tafsiri ya wazi zaidi kama ‘sehemu zake za siri’ ingefasiri msemo huo kupita kiasi.
theological_decisions:
- issue: Iwapo lugha ya טֻמְאָה itafsiriwe kama unajisi wa kiibada au kama hali ya kiafya tu
  choice: unajisi wa hedhi yake
  alternative: kipindi chake cha hedhi
  rationale: Katika Walawi, טֻמְאָה ni neno la mfumo wa usafi wa kiibada. ‘Unajisi’ huhifadhi aina ya dhana iliyomo katika matini bila kuingiza hukumu ya kisasa ya kiafya au ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na sauti ya kisheria. Msemo wa staha ‘kufunua uchi’ umehifadhiwa ili kutoondoa utata na staha ya matini ya Kiebrania.
