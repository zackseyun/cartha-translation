  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: sw
  text: Na ikiwa ana umri wa miaka mitano hadi miaka ishirini, ukadirio wako utakuwa shekeli ishirini kwa wa kiume, na shekeli kumi kwa wa kike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Inahifadhi kiunganishi na sharti la Kiebrania, huku ikiunganisha kifungu hiki na viwango vilivyotangulia kwa Kiswahili cha kawaida.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: ana umri wa miaka mitano hadi miaka ishirini
  rationale: Hutoa kwa Kiswahili cha asili nahau ya Kiebrania inayotaja kiwango cha umri bila kufafanua zaidi kama mwisho wa miaka ishirini unahesabiwa ndani ya kiwango hicho.
- source_word: וְהָיָה
  choice: itakuwa
  rationale: Inaonyesha nguvu ya agizo katika muktadha huu wa kisheria kwa namna ya kawaida na yenye hadhi katika Kiswahili.
- source_word: עֶרְכְּךָ
  choice: thamani utakayomkadiria
  rationale: Inahifadhi wazo la thamani rasmi inayowekwa na mhusika anayeambiwa, na inaeleweka kwa urahisi kuliko tafsiri finyu ya neno kwa neno.
- source_word: הַזָּכָר
  choice: mtu wa kiume
  rationale: Inaonyesha kundi la jinsia la umoja katika jedwali la ukadiriaji na inafaa pia kwa watoto walio ndani ya kiwango hiki cha umri kuliko neno 'mwanamume'.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: shekeli ishirini
  rationale: Inahifadhi moja kwa moja idadi na kipimo cha kihistoria bila kukibadili kuwa fedha ya kisasa.
- source_word: וְלַנְּקֵבָה
  choice: kwa mtu wa kike
  rationale: Inaakisi kihusishi ל na kundi linalolingana la jinsia ya kike katika mpangilio wa kisheria; pia inafaa kwa umri wa mtoto.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: shekeli kumi
  rationale: Ni tafsiri ya moja kwa moja ya idadi na kipimo, ikihifadhi tofauti na kiwango cha mtu wa kiume.
theological_decisions:
- issue: Uwasilishaji wa makundi ya kijinsia katika sheria ya ukadiriaji wa nadhiri
  choice: mtu wa kiume ... mtu wa kike
  alternative: mwanamume ... mwanamke
  rationale: Kiebrania kinatumia makundi ya umoja ya jinsia katika ukadiriaji, si vikundi vya kijamii vya watu wazima. 'Mtu wa kiume ... mtu wa kike' huhifadhi uainishaji huo na kujumuisha kwa usahihi watoto wa kuanzia miaka mitano bila kuingiza madai mapana ya kijamii au kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa uwazi wa kawaida huku ikihifadhi mtindo wa agizo la kisheria na istilahi ya kihistoria 'shekeli'.
