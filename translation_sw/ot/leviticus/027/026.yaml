base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: sw
  text: Lakini mtu yeyote asimweke wakfu[a] mzaliwa wa kwanza wa mifugo; kwa maana akiwa mzaliwa wa kwanza, ni wa Yahwe. Iwe ni ng’ombe au mnyama wa kundi[b], ni wa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu asimweke wakfu.” Neno la Kiebrania linalomaanisha “mtu” limetumiwa hapa kwa maana ya jumla.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania שֶׂה linaweza kumaanisha kondoo au mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Neno hili linaanzisha sharti linaloweka mpaka au ubaguzi dhidi ya kanuni zilizotangulia; “Lakini” ni ya kawaida na wazi katika Kiswahili.
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Hurejelea mnyama aliyezaliwa kwanza, bila kutumia istilahi isiyo ya kawaida.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: ambaye kwa kuwa mzaliwa wa kwanza ni wa Yahwe
  rationale: Kauli ya Kiebrania inaonyesha hadhi ya kuwa mzaliwa wa kwanza na dai la Yahwe juu yake, si kitendo cha binadamu cha kumfanya mzaliwa wa kwanza.
- source_word: בִּבְהֵמָה
  choice: miongoni mwa mifugo
  rationale: Katika muktadha huu neno linamaanisha kwa ujumla wanyama wanaofugwa ambao wanahusika katika sheria hizi.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: mtu yeyote asimweke wakfu
  rationale: “Kuweka wakfu” huhifadhi maana ya ibada ya Hiphil ya קדש, huku “mtu yeyote” ikionyesha kwa kawaida kwamba אִישׁ imetumiwa kwa maana ya jumla.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: Awe ng’ombe au mnyama wa kundi
  rationale: Muundo una maana ya “awe ... au ...”. שׁוֹר ni mnyama wa jamii ya ng’ombe, na שֶׂה linaweza kumaanisha kondoo au mbuzi; “mnyama wa kundi” huhifadhi upana huo.
- source_word: לַיהוָה הוּא
  choice: huyo ni wa Yahwe
  rationale: Kauli hii inaonyesha kwamba tayari ni mali ya Yahwe au anastahili kutolewa kwake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa moja kwa moja wa jina la Mungu katika maandishi ya Kiebrania.
theological_decisions:
- issue: Sababu ya mzaliwa wa kwanza kutowekwa wakfu kwa nadhiri
  choice: Hawezi kuwekwa wakfu upya kwa sababu tayari ni wa Yahwe kutokana na hadhi yake ya kuwa mzaliwa wa kwanza.
  alternative: Hadhi ya kuwa mzaliwa wa kwanza yenyewe ni aina ya kuwekwa wakfu, bila kusisitiza umiliki wa kisheria.
  rationale: Mwisho wa mstari, “huyo ni wa Yahwe,” unaonyesha kwamba mtu hawezi kumtolea Yahwe kwa nadhiri kitu ambacho tayari ana dai juu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mnyama wa kundi” limetumiwa badala ya “kondoo” pekee ili kuhifadhi upana wa neno la Kiebrania שֶׂה.
