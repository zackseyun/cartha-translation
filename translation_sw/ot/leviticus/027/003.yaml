  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: sw
  text: Na thamani utakayomwekea mtu wa kiume mwenye umri wa miaka ishirini hadi miaka sitini itakuwa shekeli hamsini za fedha, kwa kipimo cha shekeli ya mahali patakatifu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa shekeli ya mahali patakatifu.” Kirai hiki kinaonyesha kiwango kitakatifu rasmi ambacho shekeli ilipimwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: thamani utakayomwekea
  rationale: Katika Walawi 27 neno hili linamaanisha kiwango cha thamani kilichowekwa kwa utaratibu wa nadhiri, si thamani ya asili ya mtu. Muundo huu pia unahifadhi kiambishi cha nafsi ya pili.
- source_word: הַזָּכָר
  choice: mtu wa kiume
  rationale: Hili ni kundi la kijinsia katika sheria hii. “Mtu wa kiume” ni sahihi na wazi bila kulifanya neno lirejelee mwanadamu kwa ujumla.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: mwenye umri wa miaka ishirini hadi miaka sitini
  rationale: Huu ni usemi wa Kiebrania unaoonyesha kipindi cha umri; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: shekeli hamsini za fedha
  rationale: Inahifadhi jina la kipimo cha uzito na metali inayopimwa.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa kipimo cha shekeli ya mahali patakatifu
  rationale: Kirai hiki kinaonyesha kiwango rasmi cha kupimia kilichohusishwa na mahali patakatifu, si tu shekeli iliyoelezwa kwa ujumla kuwa takatifu.
- source_word: וְהָיָה ... וְהָיָה
  choice: itakuwa
  rationale: Katika muktadha huu muundo huo unaweka sharti la kisheria; “itakuwa” ni wa asili katika Kiswahili na unaonyesha kiwango kilichoamriwa.
theological_decisions:
- issue: Kundi la tathmini kwa msingi wa jinsia
  choice: mtu wa kiume
  alternative: mwanamume; mwanadamu
  rationale: Andiko linatofautisha makundi ya tathmini kwa jinsia na umri. Tafsiri inahifadhi utofauti huo bila kuugeuza kuwa rejeleo la wanadamu wote.
- issue: Maana ya עֵרֶךְ katika Walawi 27
  choice: thamani utakayomwekea
  alternative: thamani yake; bei yake; tathmini yako
  rationale: Muktadha unahusu kiwango rasmi kinachowekwa kwa mtu aliyehusishwa na nadhiri, si dai kuhusu hadhi yake ya kibinadamu wala bei ya soko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo wa kisheria umehifadhiwa bila kuwa mzito kupita kiasi.
