  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: sw
  text: Lakini ikiwa ni wa kike[a], thamani utakayomwekea itakuwa shekeli thelathini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na ikiwa ni wa kike, thamani utakayomwekea itakuwa shekeli thelathini.”
    reason: Kiunganishi וְ kinaweza kutafsiriwa kwa muendelezo wa kawaida (“Na”) badala ya kusisitiza tofauti (“Lakini”).
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Muungano wa kiunganishi na kisharti unaanzisha hali inayotofautiana na ile ya mstari uliotangulia; “Lakini ikiwa” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: נְקֵבָה הִוא
  choice: ni wa kike
  rationale: Neno la Kiebrania hutaja jinsia ya kike kwa ujumla, si lazima mwanamke mtu mzima; “wa kike” huhifadhi upana huo na kufaa kwa mtu wa umri wowote katika muktadha huu.
- source_word: וְהָיָה
  choice: itakuwa
  rationale: 'Katika mtindo huu wa kisheria, kitenzi kinaonyesha matokeo ya sharti: kiasi kinachotakiwa kitakuwa kile kinachofuata.'
- source_word: עֶרְכְּךָ
  choice: thamani utakayomwekea
  rationale: Hii ni thamani rasmi inayowekwa katika sheria ya nadhiri. Uundaji huu wa Kiswahili ni wa asili na pia huhifadhi wazo la nafsi ya pili anayefanya tathmini.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: shekeli thelathini
  rationale: Idadi imetafsiriwa moja kwa moja, na “shekeli” limehifadhiwa kama kipimo cha uzito na thamani kinachotajwa katika matini bila kuongeza “za fedha,” jambo ambalo halijasemwa wazi hapa.
