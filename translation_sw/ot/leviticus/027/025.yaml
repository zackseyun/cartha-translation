  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: sw
  text: Na kila kadirio lako litakuwa kwa shekeli ya mahali patakatifu[a]; shekeli itakuwa gera ishirini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa shekeli ya patakatifu.” Kiebrania kinarejelea kiwango rasmi cha shekeli kilichotumiwa kwa makadirio yanayohusiana na mahali patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: thamani utakayokadiria
  rationale: Katika Mambo ya Walawi 27, neno hili linamaanisha thamani rasmi inayowekwa kwa watu au vitu vinavyohusiana na nadhiri. Muundo huu unahifadhi kiambishi cha nafsi ya pili umoja na unasikika kwa kawaida katika Kiswahili.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: kwa shekeli ya mahali patakatifu
  rationale: Kirai hiki kinarejelea kiwango rasmi cha shekeli kilichotumiwa katika mambo ya mahali patakatifu, si shekeli yenye sifa ya kiadili ya kuwa takatifu.
- source_word: גֵּרָה
  choice: gera
  rationale: Gera ni kipimo kidogo cha uzito au thamani kisicho na kisawe sahihi cha kawaida katika Kiswahili, hivyo jina limetoholewa.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: shekeli moja itakuwa gera ishirini
  rationale: Kauli hii inafafanua kiwango cha shekeli kwa lugha wazi na ya kawaida huku ikihifadhi maana ya Kiebrania.
- source_word: וְכָל
  choice: Na kila
  rationale: 'Kiunganishi na maana ya ugaw distributive zimehifadhiwa: kila kadirio linapaswa kufuata kiwango hiki.'
- source_word: יִהְיֶה
  choice: itakuwa
  rationale: Wakati ujao hapa una nguvu ya agizo katika matini ya kisheria; ‘itakuwa’ huhifadhi mtindo huo bila kulazimisha ufafanuzi zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye heshima. ‘Shekeli’ na ‘gera’ zimehifadhiwa kama vipimo vya kale; tanbihi inaeleza uwezekano wa tafsiri ya karibu zaidi ya kirai cha Kiebrania.
