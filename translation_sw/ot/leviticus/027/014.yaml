id: LEV.27.14
reference: Leviticus 27:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: sw
  text: Na mtu akiweka wakfu nyumba yake kuwa takatifu kwa Yahwe, kuhani ataikadiria, iwe nzuri au mbaya[a]. Kama kuhani atakavyoikadiria[b], ndivyo itakavyosimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, bila kujali hali au ubora wa nyumba katika kadirio la kuhani.
    reason: cultural_note
  - marker: b
    text: Au “atakavyoithamini.” Kitenzi cha Kiebrania kinahusu kadirio rasmi la thamani; maneno “ndivyo itakavyosimama” yanamaanisha kwamba kadirio hilo litabaki halali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Na mtu aki-
  rationale: Hii inaanzisha sharti katika sheria ya tukio maalumu. “Mtu” huhifadhi umoja wa אִישׁ, na muundo wa “aki-” ni wa kawaida na wazi katika Kiswahili.
- source_word: יַקְדִּשׁ
  choice: akiweka wakfu
  rationale: Hiphil ya קדשׁ hapa ni kutenga mali kwa matumizi au hadhi takatifu. “Kuweka wakfu” ni lugha ya sasa, yenye heshima, na inafaa muktadha wa kidini na kisheria.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: בַּיִת hapa ni jengo au mali inayokadiriwa; “nyumba” ni sahihi zaidi kuliko neno linalosisitiza makazi ya kifamilia.
- source_word: קֹדֶשׁ לַיהוָה
  choice: kuwa takatifu kwa Yahwe
  rationale: Kirai kinaonyesha kwamba nyumba imetengwa kwa Yahwe kama kitu kitakatifu. Muundo huu ni wa asili katika Kiswahili bila kuongeza matumizi maalumu yasiyotajwa.
- source_word: וְהֶעֱרִיכוֹ
  choice: kuhani ataikadiria
  rationale: Hiphil ya ערך katika Walawi 27 inahusu tathmini rasmi ya thamani inayofanywa na kuhani. “Kukadiria” huwasilisha tendo hilo kwa lugha inayoeleweka.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: iwe nzuri au mbaya
  rationale: Hii ni nahau ya kupima hali au ubora katika pande zote mbili. Tafsiri hii ni ya kawaida na huhifadhi upeo wa tathmini.
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן
  choice: Kama kuhani atakavyoikadiria
  rationale: Kitenzi “kukadiria” kimerudiwa ili kuhifadhi marudio ya ערך na kuonyesha kwamba kadirio la kuhani ndilo lenye mamlaka.
- source_word: כֵּן יָקוּם
  choice: ndivyo itakavyosimama
  rationale: Hii huhifadhi nahau ya Kiebrania inayomaanisha kwamba kadirio hilo litasimama, litathibitika, au litabaki kuwa halali, bila kuondoa kabisa taswira ya awali.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa jina “Yahwe” badala ya cheo, kwa kufuata ushahidi wa maandishi na uamuzi wa mradi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Hadhi ya nyumba iliyowekwa wakfu
  choice: kuwa takatifu kwa Yahwe
  alternative: kuwa kitu kitakatifu kwa Yahwe
  rationale: Tafsiri hiyo huhifadhi wazo la kutengwa kwa ajili ya Yahwe bila kudai kwamba nyumba yenyewe imebadilika kimaumbile au kuingiza ufafanuzi wa kimadhehebu.
- issue: Nguvu ya kadirio la kuhani
  choice: ndivyo itakavyosimama
  alternative: ndivyo thamani yake itakavyothibitishwa
  rationale: Kiebrania kina nahau fupi yenye kiwakilishi kisichotaja wazi kama kinachosisitizwa ni nyumba au kadirio lake. Tafsiri kuu huhifadhi kiasi cha utata huo; tanbihi inaeleza maana ya kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Kuweka wakfu” na “kukadiria” vinafaa muktadha wa kidini na kisheria bila kuwa vya kale mno. Alama za tanbihi zimewekwa baada ya vifungu vinavyozieleza, kwa kuwa mpangilio wa alama katika safu ya Kiingereza haukulingana na maudhui ya tanbihi ya kwanza.
