review_pass:
  verdict: revise
  source_fidelity: Rasimu inawasilisha kwa usahihi hali ya mtu asiyeweza kufikia kiwango cha ukadirio, kuletwa mbele ya kuhani, na ukadirio kufanywa kwa kadiri ya uwezo wa mwenye nadhiri. Hata hivyo, «kulipa» hufanya maana iwe mahsusi zaidi kuliko Kiebrania, ambacho husema tu kuwa yeye ni maskini kupita ukadirio uliowekwa. Marekebisho yanarejesha dhana ya kufikia kiwango hicho bila kuongeza utaratibu wa malipo.
  naturalness: «Atampimia thamani» inaeleweka, lakini si usemi wa kawaida zaidi kwa ukadirio wa thamani ya mtu katika muktadha wa kisheria. «Atamkadiria thamani» ni ya asili zaidi katika Kiswahili Sanifu. Muundo uliorekebishwa unadumisha urudiaji wa kitenzi cha Kiebrania.
  terminology: «Kuhani», «nadhiri», na «thamani» zinafaa. «Ukadirio» katika tanbihi hueleza vizuri עֵרֶךְ kama thamani iliyowekwa, na huzuia usemi usio wa kawaida «maskini kuliko thamani».
  issues:
  - severity: low
    issue: «asiweze kulipa» huongeza dhana ya malipo ambayo haijasemwa wazi katika kifungu.
    rationale: Muktadha unahusu thamani inayowekwa, lakini מָךְ מֵעֶרְכֶּךָ hueleza umaskini kuhusiana na ukadirio. «Asiweze kufikia thamani» huhifadhi maana bila kuzidisha.
  - severity: low
    issue: «atampimia thamani» ni less idiomatic kwa ukadirio wa kisheria.
    rationale: «Atamkadiria thamani» hueleza wazi kitendo cha kuhani kuweka kiwango cha thamani, na hudumisha urudiaji wa ערך.
  - severity: medium
    issue: Tanbihi a, «ni maskini kuliko thamani uliyoweka», si Kiswahili cha asili na inaweza kuonekana kama mtu analinganishwa na thamani.
    rationale: Mbadala wa karibu na muundo wa Kiebrania unapaswa kutumia «ukadirio wako», huku ukitambua kuwa ni usemi wa karibu zaidi na wa kawaida kidogo.
  revised_text: Lakini ikiwa yeye ni maskini sana asiweze kufikia thamani uliyoweka[a], atasimamishwa mbele ya kuhani, naye kuhani atamkadiria thamani; kuhani atamkadiria kulingana na uwezo wa yule aliyeweka nadhiri[b].
