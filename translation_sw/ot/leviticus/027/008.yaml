  to: Lakini ikiwa yeye ni maskini sana asiweze kufikia thamani uliyoweka[a], atasimamishwa mbele ya kuhani, naye kuhani atamkadiria thamani; kuhani atamkadiria kulingana na uwezo wa yule aliyeweka nadhiri[b].
  rationale: Marekebisho yanaondoa nyongeza ya «kulipa», yanatumia usemi wa kawaida zaidi wa ukadirio wa kisheria, na kurekebisha tanbihi a ili iwe ya maana na iakisi kwa karibu ulinganisho wa Kiebrania. Hakuna mabadiliko ya maana ya kifungu.
