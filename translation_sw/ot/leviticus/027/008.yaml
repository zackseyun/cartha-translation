  text: וְ/אִם מָ֥ךְ הוּא֙ מֵֽ/עֶרְכֶּ֔/ךָ וְ/הֶֽעֱמִיד/וֹ֙ לִ/פְנֵ֣י הַ/כֹּהֵ֔ן וְ/הֶעֱרִ֥יךְ אֹת֖/וֹ הַ/כֹּהֵ֑ן עַל פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַ/נֹּדֵ֔ר יַעֲרִיכֶ֖/נּוּ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: sw
  text: Lakini ikiwa yeye ni maskini sana asiweze kufikia thamani uliyoweka[a], atasimamishwa mbele ya kuhani, naye kuhani atamkadiria thamani; kuhani atamkadiria kulingana na uwezo wa yule aliyeweka nadhiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni maskini kuliko ukadirio wako.” Huu ni usemi wa karibu zaidi na muundo wa Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kadiri mkono wa yule aliyeweka nadhiri unavyofikia,” yaani kulingana na uwezo wake wa kifedha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ ... מֵעֶרְכֶּךָ
  choice: ni maskini mno asiweze kulipa thamani uliyoweka
  rationale: Muundo huu unaonyesha kuwa mtu hana uwezo wa kufikia kiwango cha thamani kilichowekwa. Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi nguvu ya ulinganisho wa Kiebrania.
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: atasimamishwa mbele ya kuhani
  rationale: Huhifadhi wazo la kihisishi la Hifili, yaani kusababisha mtu asimame, bila kumtaja mhusika ambaye Kiebrania hakumtaji.
- source_word: וְהֶעֱרִיךְ אֹתוֹ ... יַעֲרִיכֶנּוּ
  choice: atampimia thamani
  rationale: Katika muktadha wa Walawi 27, kitenzi hiki kinahusu kuamua kiwango cha fedha kwa mtu aliyewekwa wakfu kwa nadhiri. Usemi huu unaeleweka na kudumisha urudiaji wa kitenzi.
- source_word: עַל פִּי אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  choice: kulingana na uwezo wa yule aliyeweka nadhiri
  rationale: Usemi wa Kiebrania ‘kadiri mkono unavyofikia’ ni nahau ya uwezo wa kifedha; ‘kulingana na uwezo’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
