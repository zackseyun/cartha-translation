reference: Leviticus 27:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: sw
  text: Hata hivyo, kila kitu kilichowekwa wakfu kabisa[a] ambacho mtu amekiweka wakfu kwa BWANA kutoka katika vyote alivyo navyo—iwe ni mwanadamu au mnyama, au kutoka shamba la urithi wake—hakitauzwa wala kukombolewa. Kila kitu kilichowekwa wakfu kabisa ni kitakatifu sana kwa BWANA.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ḥerem ni neno la kiufundi kwa kitu kilichotengwa kabisa kwa BWANA na kisichoweza kurudishwa katika matumizi ya kawaida; katika miktadha mingine linaweza pia kumaanisha kitu kilichowekwa chini ya marufuku au kilichotengwa ili kiangamizwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Inaonyesha mpito wenye ukinzani au kizuizi kutoka kwa masharti yaliyotangulia kuhusu vitu vilivyowekwa nadhiri ambavyo vingeweza kukombolewa.
- source_word: חֵרֶם / יַחֲרִם
  choice: kitu kilichowekwa wakfu / amekiweka wakfu
  rationale: Nomino na kitenzi chake vinaonyesha kitu kilichotengwa kwa BWANA bila uwezekano wa kurudishwa katika matumizi ya kawaida. ‘Wakfu’ huhifadhi maana ya kiufundi bila kulazimisha wazo la kuangamizwa katika matini kuu.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika mtindo huu wa sheria, nomino ya kiume ya Kiebrania inamtaja mtu mmoja kwa maana ya jumla; Kiswahili cha kawaida hutumia ‘mtu’ kwa ufasaha bila kuondoa nguvu ya usemi huo.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Huwakilisha jina la Mungu YHWH kwa desturi ya Kiswahili ya kulitafsiri kuwa ‘BWANA’.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: kutoka katika vyote alivyo navyo
  rationale: Inahifadhi wazo kwamba kitu hicho kinatoka miongoni mwa mali yote ya mtu huyo.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: iwe ni mwanadamu au mnyama
  rationale: ‘Mwanadamu’ huonyesha wazi kundi la binadamu linalowekwa sambamba na wanyama, bila kulifanya neno hilo limaanishe mwanaume pekee.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: au sehemu ya shamba la urithi wake
  rationale: אֲחֻזָּה katika Mambo ya Walawi huelekea kumaanisha mali ya ardhi ya kurithi; ‘sehemu ya shamba la urithi wake’ pia huonyesha nguvu ya kihusishi מִן.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: hakitauzwa wala kukombolewa
  rationale: Huhifadhi makatazo mawili ya kisheria na msamiati wa kiufundi wa ukombozi unaotumiwa katika sura hii.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kitakatifu sana
  rationale: Muundo huu wa Kiebrania ni usemi wa kiwango cha juu kabisa cha utakatifu; ‘kitakatifu sana’ ni wa asili na unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Maana ya חֵרֶם katika sheria hii
  choice: Kitu kilichowekwa wakfu bila kuingiza wazi wazo la kuangamizwa katika matini kuu
  alternative: Kitu kilichowekwa chini ya marufuku au kilichotengwa ili kiangamizwe
  rationale: Katika miktadha mingine mzizi חרם unaweza kuhusisha marufuku na maangamizi, lakini mstari huu unasisitiza kwamba kitu hicho hakiwezi kuuzwa wala kukombolewa na kwamba ni kitakatifu sana kwa BWANA. Tanbihi inalinda upana wa maana ya neno hilo.
- issue: Binadamu kutajwa miongoni mwa vitu vinavyoweza kuwekwa wakfu
  choice: Kudumisha usemi ‘iwe ni mwanadamu au mnyama’ bila kueleza matokeo yake hapa
  alternative: Kuufafanua kwa kuhusisha moja kwa moja hukumu ya kifo au aina maalumu ya utumishi
  rationale: Mstari wenyewe unataja kundi la binadamu lakini haujaeleza hapa namna wakfu huo unavyotekelezwa. Tafsiri haipaswi kutatua mapema mvutano huo wa kisheria na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Hakitauzwa wala kukombolewa’ huhifadhi ufupi wa sheria, na ‘shamba la urithi wake’ huwasilisha muktadha wa mali ya kurithi.
