translation:
  language: sw
  text: Lakini ikiwa mtu atakomboa[a] sehemu yoyote ya zaka yake, ataiongezea sehemu moja ya tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hutumia muundo wa kitenzi unaosisitiza tendo: “kukomboa atakomboa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Lakini ikiwa
  rationale: Muunganiko huu unaanzisha hali ya masharti ndani ya mfululizo wa sheria. “Lakini ikiwa” unaonyesha vizuri mwendelezo wenye utofautishaji katika muktadha.
- source_word: גָּאֹל יִגְאַל
  choice: atakomboa
  rationale: Kitenzi hiki kinamaanisha kurudisha kitu kilichowekwa wakfu kwa kulipa thamani inayotakiwa. Muundo wa Kiebrania una msisitizo ambao umeelezwa katika tanbihi badala ya kuongeza neno lisilo la kawaida katika Kiswahili.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika mtindo huu wa kisheria, nomino ya kiume ya umoja inamtaja mhusika kwa maana ya jumla. “Mtu” ni Kiswahili cha kawaida na sahihi katika masharti ya sheria.
- source_word: מִמַּעַשְׂרוֹ
  choice: sehemu yoyote ya zaka yake
  rationale: 'Kihusishi מִן kina maana ya sehemu ya kitu hapa: kinachokombolewa ni sehemu fulani ya zaka yake, si lazima zaka yote. “Sehemu yoyote ya zaka yake” huhifadhi maana hiyo kwa uwazi.'
- source_word: חֲמִשִׁיתוֹ
  choice: sehemu moja ya tano
  rationale: Nomino hii inaonyesha nyongeza ya moja kwa tano. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: יֹסֵף עָלָיו
  choice: ataiongezea
  rationale: Hifili ya יסף humaanisha “kuongeza,” na עַל huonyesha kuwa nyongeza inawekwa juu ya kiasi cha msingi. Kiambishi cha yambwa katika “ataiongezea” kinarejelea sehemu ya zaka iliyokombolewa na kutoa Kiswahili cha kisheria kilicho fasaha.
