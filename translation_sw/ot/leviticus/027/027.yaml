  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa sheria wa Kiebrania: mnyama wa kundi la najisi, uwezekano wa kuukomboa kwa kadirio la kuhani pamoja na nyongeza ya sehemu ya tano, na kuuzwa usipokombolewa. Kauli ya kutendwa katika sehemu ya mwisho imehifadhiwa bila kutaja mtendaji ambaye Kiebrania hakumtaji.'
