id: LEV.27.27
reference: Leviticus 27:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: sw
  text: Lakini ikiwa ni miongoni mwa wanyama najisi[a], anaweza kuikomboa kwa kadirio lako na kuongeza sehemu ya tano ya thamani hiyo[b]. Ikiwa haitakombolewa, itauzwa kwa kadirio lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika mifugo najisi.” Kirai cha Kiebrania kinamaanisha mnyama wa kundi la wanyama walio najisi kidesturi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, aongeze asilimia ishirini juu ya thamani iliyokadiriwa.
    reason: lexical_clarification
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: miongoni mwa wanyama najisi
  rationale: Kirai hiki kinaainisha mnyama aliyewekwa wakfu kuwa wa kundi la wanyama walio najisi kidesturi; ‘miongoni mwa’ kinawasilisha matumizi ya בְּ ya kugawa kwa kundi.
- source_word: וּפָדָה
  choice: anaweza kuikomboa
  rationale: פדה ni kukomboa au kununua tena. Katika sheria hii, uwezekano wa kutokombolewa na kisha kuuzwa unaonyesha kuwa ukombozi ni chaguo linalopatikana, si amri isiyo na chaguo.
- source_word: בְעֶרְכֶּךָ
  choice: kwa kadirio lako
  rationale: עֵרֶךְ hapa ni thamani iliyokadiriwa na kuhani; ‘lako’ linahifadhi nafsi ya pili umoja ya Kiebrania.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: na kuongeza sehemu ya tano ya thamani hiyo
  rationale: Nahau hii ina maana ya kuongeza asilimia ishirini juu ya thamani iliyokadiriwa. Kutaja ‘thamani hiyo’ huweka rejeleo wazi kwa Kiswahili bila kupoteza maana.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: Ikiwa haitakombolewa
  rationale: Nifali ya גאל ni ya kutendwa na haitaji mtendaji; tafsiri hii inahifadhi kutotajwa huko.
- source_word: וְנִמְכַּר
  choice: itauzwa
  rationale: Nifali inatoa matokeo ya kisheria kwa kauli ya kutendwa; ‘itauzwa’ ni ya kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Unajisi wa mnyama
  choice: wanyama najisi, kwa maana ya kidesturi
  alternative: wanyama wachafu kwa hali ya kimwili
  rationale: Katika muktadha wa Mambo ya Walawi, טָמֵא ni hali ya kidesturi, si dai kwamba mnyama ana uchafu wa kimwili au ubaya wa kimaadili.
- issue: Ukombozi kama chaguo au wajibu
  choice: anaweza kuikomboa
  alternative: ataikomboa/lazima aikomboe
  rationale: Kifungu kinachofuata kinataja wazi hali ya kutokombolewa na kuuzwa; kwa hiyo tafsiri ya uwezekano huhifadhi muundo wa kisheria bila kuufanya ukombozi kuwa wajibu kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Najisi’ limetumiwa kwa maana ya kidesturi inayofaa muktadha wa Mambo ya Walawi; maelezo ya chini yanaondoa uwezekano wa kulielewa kama uchafu wa kawaida. Sentensi imegawanywa kwa uwazi huku ikihifadhi mantiki ya sheria ya Kiebrania.
