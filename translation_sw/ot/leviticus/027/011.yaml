base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: sw
  text: Lakini ikiwa ni mnyama yeyote asiye safi ambaye haruhusiwi kutolewa kuwa sadaka kwa Yahweh[a], basi atamsimamisha mnyama huyo mbele ya kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye watu hawatoi sadaka kwa Yahweh kutoka kwake.” Kitenzi cha Kiebrania kiko katika wingi wa jumla, yaani hakirejelei watu mahususi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaendeleza sheria kwa kuleta hali yenye utofauti; “lakini ikiwa” huhifadhi sharti na mpito wa kimantiki.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: mnyama yeyote asiye safi
  rationale: כָּל pamoja na nomino ya umoja ina maana ya kutaja yeyote wa aina hiyo; טְמֵאָה hapa ni kutokuwa safi kidini, si uchafu wa kawaida.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: ambaye kutoka kwake hawaruhusiwi ... kumtolea ... sadaka
  rationale: Huhifadhi מִמֶּנָּה, “kutoka kwake,” na wingi wa jumla wa יַקְרִיבוּ. “Hawaruhusiwi” huonyesha kwamba mnyama huyo hafai kutolewa kama sadaka, bila kuifanya sentensi kuwa dai kuhusu uwezo wa kimwili.
- source_word: קָרְבָּן
  choice: sadaka
  rationale: Ni neno la kawaida na linaloeleweka katika Kiswahili kwa kitu kinacholetwa au kutolewa kwa Mungu katika muktadha wa ibada.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יְהוָה limetafsiriwa kwa namna ya kulitamka kama “Yahweh,” kulingana na ushahidi wa maandishi na safu ya mashauriano iliyotolewa.
- source_word: וְהֶעֱמִיד
  choice: basi atamweka
  rationale: Hifili ya עמד ina maana ya kumsimamisha au kumweka mbele; “atamweka” ni ya asili katika Kiswahili na “basi” huonyesha sehemu ya matokeo ya sharti.
- source_word: אֶת הַבְּהֵמָה לִפְנֵי הַכֹּהֵן
  choice: mnyama huyo mbele ya kuhani
  rationale: Huhifadhi mhusika mahsusi na mazingira rasmi ya tathmini ya kikuhani yanayoendelea katika mstari unaofuata.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana Tetragramatoni moja kwa moja. “Yahweh” hulihifadhi kama jina la agano badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kauli לֹא יַקְרִיבוּ
  choice: hawaruhusiwi kumtolea
  alternative: hawamtolei; haiwezi kutolewa
  rationale: Wingi wa nafsi ya tatu una nguvu isiyoelekeza kwa watu mahususi. Tafsiri iliyochaguliwa huonyesha kutofaa kwake kwa sadaka bila kudai kwamba haiwezekani kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Asiye safi” limetumiwa kwa maana ya kiibada; “kuhani” ni istilahi ya kawaida ya kibiblia. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kishazi kinachofafanuliwa.
