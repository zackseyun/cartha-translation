base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: sw
  text: Na ikiwa mtu ana umri wa miaka sitini au zaidi, akiwa mwanamume, kadirio lako litakuwa shekeli kumi na tano; na kwa mwanamke, shekeli kumi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: ana umri wa miaka sitini au zaidi
  rationale: Hii ni njia ya kawaida na iliyo wazi ya Kiswahili ya kuonyesha kiwango cha umri kinachoanzia miaka sitini na kuendelea.
- source_word: זָכָר
  choice: mwanamume
  rationale: Katika kundi la watu wenye umri wa miaka sitini au zaidi, ‘mwanamume’ ni neno la kawaida na lenye heshima, huku likidumisha tofauti ya jinsia inayotajwa na Kiebrania.
- source_word: עֶרְכְּךָ
  choice: thamani utakayomwekea
  rationale: Usemi huu unadumisha nafsi ya pili katika Kiebrania na unaonyesha tathmini rasmi inayowekwa chini ya masharti ya nadhiri katika Walawi 27.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: shekeli kumi na tano
  rationale: Ni tafsiri ya moja kwa moja ya idadi na kipimo cha thamani kilichotajwa.
- source_word: לַנְּקֵבָה
  choice: ikiwa ni mwanamke
  rationale: Hii inalingana kwa kawaida na ‘ikiwa ni mwanamume’ na kuweka wazi tathmini ya upande wa kike.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: shekeli kumi
  rationale: Ni tafsiri ya moja kwa moja ya idadi na kipimo.
