  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: sw
  text: Na zaka yote ya ng’ombe na ya kondoo na mbuzi—kila mnyama wa kumi anayepita chini ya fimbo—atakuwa mtakatifu kwa Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל מַעְשַׂר
  choice: Na kila zaka
  rationale: “Zaka” ni neno la kawaida la Kiswahili kwa sehemu ya kumi inayotengwa; “kila” huhifadhi upeo wa jumla wa kifungu cha Kiebrania.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: Neno hili linataja kwa ujumla mifugo mikubwa ya jamii ya ng’ombe.
- source_word: וָ/צֹאן
  choice: kondoo na mbuzi
  rationale: צֹאן ni jina la pamoja linalohusu mifugo midogo, hasa kondoo na mbuzi; kuwataja wote wawili huepuka kulifanya neno hilo limaanishe kondoo peke yao.
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַ/שָּׁבֶט
  choice: anayepita chini ya fimbo
  rationale: Huhifadhi picha ya kichungaji ya wanyama kupita mmoja mmoja chini ya fimbo wakati wa kuhesabiwa.
- source_word: הָ/עֲשִׂירִי
  choice: kila mnyama wa kumi
  rationale: Kiebrania kinasema kihalisi “wa kumi”; nomino “mnyama” inaeleweka kutokana na muktadha na imewekwa wazi ili sheria ieleweke kwa urahisi.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: atakuwa mtakatifu
  rationale: Huhifadhi moja kwa moja dhana ya utakatifu na hali ya mnyama kuwa ametengwa kwa Mungu, badala ya kuibadili tu kuwa tendo la kuweka wakfu.
- source_word: לַ/יהוָה
  choice: kwa Yahwe
  rationale: “Kwa” huonyesha kuwa mnyama huyo ni mtakatifu na ametengwa kwa ajili ya Yahwe; jina la agano יהוה limetafsiriwa Yahwe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kina jina la Mungu la herufi nne moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya יִהְיֶה קֹדֶשׁ kuhusu mnyama
  choice: atakuwa mtakatifu kwa Yahwe
  alternative: atawekwa wakfu kwa Yahwe
  rationale: Tafsiri iliyochaguliwa inadumisha lugha ya utakatifu ya maandishi na pia hali ya kuwa mali iliyotengwa kwa Mungu, bila kupunguza kauli hiyo iwe tendo pekee.
- issue: Kuweka wazi nomino inayodokezwa na הָעֲשִׂירִי
  choice: kila mnyama wa kumi
  alternative: wa kumi
  rationale: Kiebrania kinadokeza mnyama anayehesabiwa. Kuweka “mnyama” wazi kunatoa maana ya kisheria bila kuongeza fundisho jipya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kondoo na mbuzi” hufafanua upana wa צֹאן kwa usahihi, na “yaani” huonyesha kwamba kila mnyama wa kumi ndiyo zaka inayozungumziwa.
