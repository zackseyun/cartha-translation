  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: sw
  text: Na ikiwa yule aliyeweka nyumba yake wakfu ataikomboa[a], ataongeza kwenye kadirio hilo sehemu ya tano ya kiasi cha fedha ulichokadiria[b], nayo itakuwa yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataipata tena kwa malipo.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, ataongeza sehemu ya tano kwenye thamani ya fedha iliyokadiriwa na kuhani.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: yule aliyeiweka ... wakfu
  rationale: Katika sheria hii, kitenzi kinamaanisha kuitenga nyumba kwa kusudi takatifu kwa BWANA. ‘Kuweka wakfu’ ni Kiswahili cha kawaida chenye maana ya kidini na kisheria bila kuwa cha kitaalamu kupita kiasi.
- source_word: יִגְאַל
  choice: ataikomboa
  rationale: Katika muktadha huu wa sheria ya mali iliyowekwa wakfu, neno linamaanisha kuipata tena kwa kulipa thamani inayotakiwa. ‘Kukomboa’ huhifadhi istilahi kuu ya Kilawi na wazo la kuirudisha mikononi mwa mwenyewe kwa malipo.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: Hili ni tafsiri ya moja kwa moja ya neno la Kiebrania na linafaa katika sheria inayohusu mali, kuliko ‘makao yake.’
- source_word: וְיָסַף
  choice: ataongeza
  rationale: Muundo huu unaonyesha hatua inayotakiwa baada ya sharti kutimizwa. Wakati ujao wa Kiswahili unaeleza kwa kawaida matokeo yenye nguvu ya wajibu katika sheria hii.
- source_word: חֲמִישִׁית
  choice: sehemu ya tano
  rationale: Hii huwasilisha kipimo cha moja kwa tano kwa Kiswahili cha kawaida na huepuka usemi wa kisasa zaidi wa asilimia ishirini.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: fedha ya kadirio lako
  rationale: ‘Fedha’ huhifadhi taswira halisi ya אֶסֶף kama njia ya malipo, huku ‘kadirio lako’ likihifadhi nafsi ya pili umoja inayomwelekea kuhani katika muktadha.
- source_word: עָלָיו
  choice: juu yake
  rationale: Usemi huu huhifadhi kwa ukaribu muundo wa Kiebrania; katika muktadha una maana ya kuongeza kiasi hicho kwenye thamani iliyokadiriwa, jambo linalofafanuliwa katika tanbihi.
- source_word: וְהָיָה לוֹ
  choice: nayo itakuwa yake
  rationale: Husema moja kwa moja matokeo ya umiliki baada ya malipo ya ukombozi, bila kuongeza neno ‘tena,’ ambalo halijaandikwa wazi katika Kiebrania.
theological_decisions:
- issue: Istilahi ya ibada kuhusu nyumba iliyotengwa kwa Mungu
  choice: kuweka wakfu
  alternative: kuweka kwa matumizi matakatifu; kutakasa
  rationale: ‘Kuweka wakfu’ huhifadhi maana ya kitendo cha kuitenga mali katika mfumo wa nadhiri na makadirio ya Kilawi, bila kuingiza maana maalumu ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi inayofaa sheria ya ibada. Sentensi imehifadhi sharti, istilahi ya ukombozi, kadirio linaloelekezwa kwa kuhani katika nafsi ya pili umoja, na matokeo ya umiliki. Kila alama ya tanbihi imetiwa katika matini kuu.
