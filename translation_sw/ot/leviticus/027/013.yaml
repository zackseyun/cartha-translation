translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na ina mtiririko wa kifungu cha sheria. “Kweli” hudumisha msisitizo wa Kiebrania bila kufanya sentensi kuwa nzito.
