  source_fidelity: The conditional, redemption, required addition, and second-person singular reference to the priest's valuation are retained. The Hebrew infinitive absolute does convey emphasis, but placing “kweli” before the future verb in the main Swahili line is not the most natural way to express it; the footnote can preserve this formal detail more accurately.
  naturalness: “Lakini kama atamkomboa” is more idiomatic, suitably formal Kiswahili for this legal context than “Lakini kama kweli atamkomboa.” The animate object agreement is acceptable because the antecedent is the animal of the preceding verse. “Sehemu moja ya tano kwenye thamani uliyokadiria” clearly expresses the required surcharge.
