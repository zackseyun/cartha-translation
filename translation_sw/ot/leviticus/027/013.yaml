  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: sw
  text: Lakini kama atamkomboa[a], ataongeza sehemu moja ya tano kwenye thamani uliyokadiria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akimkomboa” / “hakika atamkomboa”; Kiebrania hutumia kitenzi katika muundo wa kurudia unaotilia mkazo tendo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini kama
  rationale: Muunganiko huu unaanzisha sharti lenye utofautishaji na jambo lililotangulia; “Lakini kama” ni ya kawaida na inaonyesha mtiririko huo wa kisheria.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: kweli atamkomboa
  rationale: Jina-jinsi lisilo na kikomo likifuatana na kitenzi chenye wakati linasisitiza tendo la kukomboa. “Kweli” huhifadhi msisitizo huo kwa Kiswahili cha kawaida. Kiambishi cha kike cha umoja kinamrejelea mnyama aliyetajwa katika mstari uliotangulia, kwa hiyo kiambishi cha ngeli ya mnyama “-m-” kimetumiwa.
- source_word: וְיָסַף
  choice: ataongeza
  rationale: Katika sheria hii, kitenzi kinaonyesha matokeo yanayotakiwa yakitokea kwamba mnyama amekombolewa. Kiswahili “ataongeza” kinaeleza wajibu huo kwa ufupi na kwa kawaida.
- source_word: חֲמִישִׁתוֹ
  choice: sehemu moja ya tano
  rationale: Neno hili linamaanisha sehemu ya tano, yaani nyongeza ya asilimia ishirini. Tafsiri hii huepuka kuongeza kirai kisichotajwa wazi kuhusu msingi wa hesabu.
- source_word: עַל עֶרְכֶּךָ
  choice: kwenye thamani uliyokadiria
  rationale: עַל pamoja na wazo la kuongeza huonyesha nyongeza juu ya kiasi kilichokadiriwa. Kiambishi cha nafsi ya pili umoja kimeonyeshwa kwa “uliyokadiria,” kikimhutubia anayefanya tathmini.
