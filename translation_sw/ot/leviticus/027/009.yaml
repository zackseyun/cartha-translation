  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: sw
  text: Na ikiwa ni mnyama ambaye watu humtolea Yahweh dhabihu kutoka kwake, chochote ambacho mtu atatoa kutoka kwa mnyama huyo kwa Yahweh kitakuwa kitakatifu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi וְ pamoja na hali ya sharti, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: בְּהֵמָה
  choice: mnyama
  rationale: Ni neno pana na la kawaida linalofaa katika muktadha wa wanyama wa dhabihu.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: ambaye kutoka kwake watu humtolea Yahweh dhabihu
  rationale: Huhifadhi wazo la dhabihu inayotolewa kutoka kwa mnyama huyo na kutafsiri wingi usiotaja mhusika kwa ‘watu’; pia huacha uwezekano wa kauli kueleza aina ya mnyama anayefaa kutolewa, kama inavyofafanuliwa katika tanbihi.
- source_word: קָרְבָּן
  choice: dhabihu
  rationale: Katika muktadha huu wa sheria ya ibada, ‘dhabihu’ ni neno la kawaida na linaloeleweka kwa kitu kinacholetwa kwa Mungu madhabahuni.
- source_word: לַיהוָה
  choice: kwa Yahweh / Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahweh’; muundo wa kitenzi ‘humtolea’ na ‘atampa’ tayari unaonyesha anayepokea.
- source_word: כֹּל אֲשֶׁר יִתֵּן
  choice: chochote ambacho mtu atampa
  rationale: Huwasilisha nguvu ya jumla ya כֹּל na umoja usiotaja mtu maalumu katika יִתֵּן bila kuingiza jinsia ya mhusika.
- source_word: מִמֶּנּוּ
  choice: kutoka kwake
  rationale: Hurejelea mnyama wa umoja na kuhifadhi kwa karibu maana ya kihusishi מִן.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: kitakuwa kitakatifu
  rationale: Huhifadhi lugha ya kuwekwa wakfu kwa Mungu iliyo katika קֹדֶשׁ na hali ya baadaye ya kisheria.
theological_decisions:
- issue: Utafsiri wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Ikiwa kifungu kinaeleza mnyama anayefaa kwa dhabihu au mnyama ambaye dhabihu hutolewa kutoka kwake kwa kweli
  choice: Maandishi makuu yanatafsiri kwa karibu ‘ambaye kutoka kwake watu humtolea ... dhabihu’
  alternative: ‘ambaye kutoka kwake watu wanaweza kumtolea Yahweh dhabihu’
  rationale: Muundo wa Kiebrania unaweza kueleweka kwa njia zote mbili; tafsiri kuu inafuata umbo la kitenzi kwa karibu, huku tanbihi ikihifadhi uwezekano wa maana ya kufaa kutolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mnyama’ na ‘dhabihu’ ni maneno ya sasa na yaliyozoeleka; sentensi imehifadhi marudio ya ‘Yahweh’ na wazo la utakatifu wa kitu kilichowekwa wakfu.
