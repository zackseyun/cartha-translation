  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: sw
  text: Kila sehemu ya kumi ya mazao ya nchi[a]—iwe ni ya mbegu za nchi au ya matunda ya miti—ni ya Yahwe; ni takatifu kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya moja kwa moja zaidi: “Kila sehemu ya kumi ya nchi, ya mbegu ya nchi na ya matunda ya mti, ni ya Yahwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל מַעְשַׂר
  choice: Kila sehemu ya kumi
  rationale: כָל pamoja na nomino ya umoja ina maana ya kugawa kwa kila moja. “Sehemu ya kumi” ni wazi kwa msomaji wa kawaida na huhifadhi maana ya מַעְשַׂר bila kutegemea neno “zaka,” ambalo katika Kiswahili cha sasa linaweza kuhusishwa hasa na muktadha wa Kiislamu.
- source_word: הָאָרֶץ
  choice: ya mazao ya nchi
  rationale: Katika muktadha huu wa kilimo, אֶרֶץ inahusu nchi kama chanzo cha mazao, si dunia nzima. Kuongeza “mazao” kunafanya maana ya Kiswahili iwe wazi; usemi wa Kiebrania ulio wa moja kwa moja zaidi umehifadhiwa katika tanbihi.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: iwe ni ya mbegu za nchi
  rationale: “Mbegu” huhifadhi taswira halisi ya זֶרַע, huku wingi wa Kiswahili ukitumika kwa maana ya kijumla. “Iwe ni” huonyesha kuwa kifungu hiki na kinachofuata vinabainisha aina za mazao yanayohusika.
- source_word: מִפְּרִי הָעֵץ
  choice: au ya matunda ya miti
  rationale: Umoja wa Kiebrania “mti” una maana ya kijumla. Wingi “miti” ni wa kawaida na wa asili katika Kiswahili bila kubadili maana.
- source_word: לַיהוָה הוּא
  choice: ni ya Yahwe
  rationale: ל hapa inaweza kuonyesha umiliki au kuwekwa kwa ajili ya Mungu. “Ni ya Yahwe” ni fupi, ya kawaida, na huhifadhi kwa kiasi fulani upana huo wa maana.
- source_word: קֹדֶשׁ לַיהוָה
  choice: ni takatifu kwa Yahwe
  rationale: '“Takatifu” huhifadhi nguvu ya kidini ya קֹדֶשׁ: sehemu hiyo imetengwa kwa Mungu. “Kwa Yahwe” ni tafsiri ya karibu ya לַיהוָה bila kuongeza wazo la kiwango cha juu kama “takatifu sana.”'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetolewa kama jina binafsi “Yahwe,” kwa tahajia ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi na hutumia tahajia inayolingana na mfumo wa sauti wa Kiswahili.
- issue: Maana ya לַיהוָה katika kauli ya umiliki au kuwekwa wakfu
  choice: ni ya Yahwe
  alternative: imetengwa kwa ajili ya Yahwe
  rationale: Kihusishi ל kinaweza kubeba wazo la kuwa mali ya Yahwe na pia kutolewa au kuwekwa wakfu kwake. “Ni ya Yahwe” hudokeza yote mawili bila kulazimisha ufafanuzi mmoja pekee; kauli inayofuata kuhusu utakatifu inaonyesha wazi hali ya kuwekwa wakfu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa kawaida katika Kiswahili, huku taswira za “mbegu” na “matunda” pamoja na marudio ya jina Yahwe zikihifadhiwa.
