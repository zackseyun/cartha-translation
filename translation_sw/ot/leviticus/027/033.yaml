base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: sw
  text: Asichunguze ikiwa ni mzuri au mbaya[a], wala asimbadilishe. Lakini akimbadilisha kweli, mnyama huyo pamoja na mbadala wake watakuwa watakatifu[b]; hautakombolewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asichunguze kati ya mzuri na mbaya.” Nahau ya Kiebrania inamaanisha kutofautisha ubora wakati wa kuchagua mnyama.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinakikazia kitenzi: “akimbadilisha hakika” au “akimbadilisha kwa kweli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר
  choice: asichunguze
  rationale: Katika muktadha wa kuchagua mnyama wa zaka, piel ya בקר ina maana ya kumchunguza na kutathmini, si kumtazama tu.
- source_word: בֵּין טוֹב לָרַע
  choice: ikiwa ni mzuri au mbaya
  rationale: Hii ni nahau ya Kiebrania inayohusu kutofautisha ubora wa wanyama; Kiswahili hiki ni cha kawaida huku kikihifadhi tathmini hiyo.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: asimbadilishe / akimbadilisha kweli
  rationale: Mzizi מור hapa ni istilahi ya kuweka mnyama mwingine mahali pa yule wa kwanza. Neno “kweli” linawakilisha msisitizo wa infinitivi kamili pamoja na kitenzi.
- source_word: תְמוּרָתוֹ
  choice: aliyewekwa badala yake
  rationale: Hurejelea mnyama mwingine aliyewekwa mahali pa mnyama wa kwanza; usemi huu ni wazi na wa kawaida kwa wasomaji wa Kiswahili.
- source_word: קֹדֶשׁ
  choice: watakuwa watakatifu
  rationale: קדש huonyesha kuwa wanyama hao wametengwa kwa Mungu. “Watakatifu” huhifadhi uzito wa lugha ya ibada na agano.
- source_word: לֹא יִגָּאֵל
  choice: hawatakombolewa
  rationale: Niphal ya גאל hapa humaanisha kutolewa katika hali ya kuwekwa wakfu kwa njia ya ukombozi. Wingi unarejelea wanyama wote wawili waliotajwa mara moja kabla yake.
- source_word: הוּא וּתְמוּרָתוֹ
  choice: huyo mnyama pamoja na aliyewekwa badala yake
  rationale: Hufafanua wazi kuwa mnyama wa kwanza na mnyama mbadala wote wanaingia katika hali ya utakatifu.
theological_decisions:
- issue: Nguvu ya kisheria na kiibada ya lugha ya kuwekwa wakfu
  choice: Kutafsiri קֹדֶשׁ kwa “watakatifu” na לֹא יִגָּאֵל kwa “hawatakombolewa.”
  alternative: Kutumia maneno ya kijumla zaidi kama “waliowekwa wakfu” na “hawatanunuliwa tena.”
  rationale: Maneno yaliyochaguliwa yanahifadhi uzito wa kiibada wa sheria hii kuhusu wanyama waliotengwa kwa Mungu, bila kuingiza mafundisho ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria na kiibada lakini kinachoeleweka kwa urahisi. Viwakilishi vya ngeli ya mnyama vimetumiwa kwa uwazi, na wingi katika sentensi ya mwisho unaonyesha kuwa mnyama wa kwanza na mbadala wake wote hawawezi kukombolewa.
