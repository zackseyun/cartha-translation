  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: sw
  text: Katika mwaka wa Jubilei, shamba litarudi kwa yule ambaye lilinunuliwa kutoka kwake, kwa yule mwenye milki ya ardhi hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa yule ambaye ardhi hiyo ni milki yake ya urithi.” Neno la Kiebrania אֲחֻזַּת הָאָרֶץ linamaanisha milki ya ardhi; katika muktadha huu ni mgao wa awali wa familia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: Katika mwaka wa Yubile
  rationale: Kirai hiki kinaonyesha wakati. “Mwaka wa Yubile” ni istilahi ya kawaida na inayoeleweka katika sheria hii ya Walawi.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: shamba litarudi
  rationale: Kitenzi cha Kiebrania kinaeleza matokeo ya kisheria; wakati ujao wa Kiswahili huwasilisha wajibu huo kwa lugha ya kawaida bila kutumia mtindo mzito wa kisheria.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: kwa yule ambaye lilinunuliwa kutoka kwake
  rationale: Muundo huu unaonyesha kuwa huyo ndiye aliyekuwa mmiliki wa awali bila kuingiza kiima kisichotajwa wazi katika Kiebrania.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: kwa yule mwenye milki ya ardhi hiyo
  rationale: “Milki” huonyesha umiliki au umilikaji wa kisheria wa ardhi, huku ikiacha maana ya urithi wa kifamilia itokane na muktadha badala ya kuiongeza moja kwa moja katika matini.
theological_decisions:
- issue: Maana ya אֲחֻזַּת הָאָרֶץ katika sheria ya Yubile
  choice: mwenye milki ya ardhi hiyo
  alternative: ambaye ardhi hiyo ni milki yake ya urithi
  rationale: Muktadha mpana unahusu mgao wa ardhi wa kifamilia, lakini nomino yenyewe humaanisha milki au umilikaji wa ardhi. Tafsiri kuu inadumisha maana hiyo ya kisheria bila kufanya urithi kuwa wazi zaidi kuliko matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yaani” linaonyesha kwamba vifungu viwili vinamtaja mtu yuleyule na huzuia sentensi isisikike kana kwamba shamba linarudi kwa watu wawili tofauti.
