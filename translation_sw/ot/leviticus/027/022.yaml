  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: sw
  text: Lakini ikiwa ataweka wakfu kwa Yahwe shamba alilonunua[a], ambalo si sehemu ya shamba la urithi wake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shamba alilolipata kwa kununua,” tofauti na ardhi ya urithi wa ukoo wake.
