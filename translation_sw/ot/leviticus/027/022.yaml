lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaendeleza masharti ya sheria yaliyotangulia huku ikionyesha tofauti na hali iliyozungumziwa kabla.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: shamba alilonunua
  rationale: Kifungu hiki kinamaanisha shamba lililopatikana kwa ununuzi, tofauti na ardhi ya urithi. Kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: ambalo halitokani na shamba la urithi wake
  rationale: ‘Halitokani na’ linahifadhi maana ya kihusishi מִן, huku ‘shamba la urithi wake’ likionyesha milki ya ardhi iliyorithiwa.
- source_word: יַקְדִּישׁ
  choice: ataweka wakfu
  rationale: Katika muktadha wa Walawi 27, kitenzi hiki kinamaanisha kutenga kitu kuwa kitakatifu kwa matumizi au umiliki wa Mungu; ‘kuweka wakfu’ ni usemi wa asili wenye uzito wa kidini na kisheria.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha anayepokea kuwekwa wakfu, na jina la agano יהוה limetolewa kama ‘Yahwe.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu, יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
