lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: atakadiria thamani
  rationale: Hifili ya ערך hapa ni tendo la kuweka thamani ya mnyama aliyewekwa wakfu. Kauli hii ni ya kawaida katika Kiswahili na inaeleza wazi kazi ya kuhani.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika sheria za Walawi.
- source_word: אֹתָהּ
  choice: yake
  rationale: Kiwakilishi cha umoja wa kike katika Kiebrania kinamrejelea mnyama. Kiswahili kinatumia kiwakilishi cha umilikaji katika kirai ‘thamani yake’ ili kutoa maana hiyo kwa kawaida.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: kama ni mzuri au mbaya
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida tathmini ya hali au ubora wa mnyama, awe mzuri au mbaya.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: thamani atakayoikadiria kuhani
  rationale: Ingawa umbo la Kiebrania lina kiambishi cha nafsi ya pili umoja, nomino inayofuata, ‘kuhani,’ inaonyesha kuwa kinachokusudiwa ni kadirio rasmi la kuhani. Tanbihi inahifadhi muundo halisi usio wa kawaida.
- source_word: כֵּן יִהְיֶה
  choice: ndiyo itakayokubalika
  rationale: Katika muktadha huu wa kisheria, usemi huu unathibitisha kuwa thamani aliyoweka kuhani ndiyo yenye nguvu na itakayotumika.
