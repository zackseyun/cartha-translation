base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: sw
  text: 'Sema na wana wa Israeli[b], uwaambie: “Mwanaume atakapoweka nadhiri ya pekee kuhusu makadirio ya thamani ya watu kwa Yahweh,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na makadirio yako ya thamani ya watu kwa Yahweh.” Kirai cha Kiebrania chenye maana ya “makadirio yako” ni kigumu; kinahusu nadhiri zinazowahusu watu ambao huwekewa viwango vya thamani katika mistari inayofuata.
    reason: alternative_reading
  - marker: b
    text: Kiebrania ni “wana wa Israeli,” usemi wa kawaida wa agano unaowataja watu wa Israeli kwa ujumla.
    reason: lexical_clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema
  rationale: Kitenzi cha amri katika kauli ya Piel; “Sema” kinadumisha mtindo rasmi wa agizo la Mungu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri ya karibu ya usemi wa kifamilia unaowataja watu wa agano kwa ujumla; pia ni usemi unaoeleweka katika Kiswahili cha Biblia.
- source_word: אִישׁ
  choice: mwanaume
  rationale: Neno la Kiebrania ni nomino ya umoja wa kiume katika sheria. “Mwanaume” linahifadhi umbo hilo bila kuficha kwamba sheria hii inaweza kuwa na matumizi ya uwakilishi.
- source_word: יַפְלִא נֶדֶר
  choice: ataweka nadhiri ya pekee
  rationale: Hiphil ya פלא inaonyesha nadhiri yenye hali ya kipekee au maalumu, si tendo la kawaida la kuweka nadhiri tu.
- source_word: בְּעֶרְכְּךָ
  choice: inayohusu ukadiriaji wa thamani
  rationale: Kirai hiki ni kigumu kisarufi. Tafsiri hii inaonyesha uhusiano wa nadhiri na thamani rasmi zinazoainishwa katika mistari inayofuata bila kulazimisha maana moja ya kihusishi בְּ.
- source_word: נְפָשֹׁת
  choice: watu
  rationale: Katika muktadha huu wa kisheria, neno linamaanisha watu wanaohusishwa na nadhiri, si “nafsi” zisizo za kimwili.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: “Kwa” linaonyesha kwamba nadhiri na ukadiriaji wake vinaelekezwa kwa Yahweh; jina la agano limetoholewa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja. “Yahweh” linahifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Umoja wa kiume אִישׁ katika sheria
  choice: mwanaume
  alternative: mtu yeyote; mtu
  rationale: Tafsiri hii inadumisha umbo la kiume la chanzo huku kutofanya madai ya ziada kuhusu upeo wa matumizi ya sheria.
- issue: Maana ya בְּעֶרְכְּךָ נְפָשֹׁת
  choice: inayohusu ukadiriaji wa thamani ya watu
  alternative: kulingana na ukadiriaji wako wa thamani ya watu
  rationale: Kirai cha Kiebrania kina utata, na kiambishi cha nafsi ya pili umoja kinaweza kumrejelea Musa katika utoaji wa sheria. Maandishi makuu yanatoa maana ya muktadha, na tanbihi inadumisha mbadala wa karibu zaidi wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo rasmi na wenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “wana wa Israeli” umehifadhiwa kwa kuwa ni wa karibu na chanzo na umezoeleka; kirai kigumu cha ukadiriaji kimefafanuliwa bila kuondoa utata wake kabisa.
