  text: Kama akiweka wakfu shamba lake kuanzia mwaka wa yubile[a], kadirio lako litabaki halali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akilitenga kwa ajili ya utakatifu.” Kitenzi cha Kiebrania kina maana ya kutenga kitu kuwa kitakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Kihusishi cha kawaida cha sharti kinachotanguliza hali hii ya kisheria.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: kuanzia mwaka wa yubile
  rationale: Kihusishi מִן kinaonyesha mahali pa kuanzia kwa wakati; usemi huu unaendana na ukadiriaji unaotegemea muda uliobaki hadi yubile inayofuata.
- source_word: יַקְדִּישׁ
  choice: analiweka wakfu
  rationale: Hifili ya קדשׁ hapa ina maana ya kutenga kitu kwa kusudi takatifu. 'Kuliweka wakfu' ni lugha ya kawaida na yenye hadhi inayohifadhi maana ya kiibada.
- source_word: שָׂדֵהוּ
  choice: shamba lake
  rationale: Huwakilisha moja kwa moja nomino yenye kiambishi cha umilikaji.
- source_word: כְּעֶרְכְּךָ
  choice: thamani utakayoikadiria
  rationale: Inarejelea thamani anayoweka anayesemeshwa, yaani kuhani katika muktadha huu; muundo huu ni wa kawaida katika Kiswahili na huweka wazi kwamba ni makadirio.
- source_word: יָקוּם
  choice: itatumika
  rationale: Katika muktadha huu wa kisheria, קום inaonyesha kuwa ukadiriaji unabaki halali au wenye nguvu; 'itatumika' huwasilisha maana hiyo kwa Kiswahili cha sasa bila kuongeza maelezo.
theological_decisions:
- issue: Kitenzi cha kiibada cha kutenga mali kwa ajili ya utakatifu
  choice: analiweka wakfu
  alternative: analiweka kwa matumizi matakatifu
  rationale: '''Kuliweka wakfu'' huhifadhi wazo la kutenga shamba kwa kusudi takatifu bila kuingiza fundisho la dhehebu au kubainisha zaidi ya Kiebrania.'
translation_notes:
