base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: sw
  text: Ndipo kuhani atamhesabia mtu huyo kiasi cha thamani yako iliyokadiriwa hadi Mwaka wa Yubile; naye atatoa thamani hiyo siku hiyo kama sadaka takatifu kwa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “kitakatifu kwa Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Ndipo ... atakapomhesabia
  rationale: Kitenzi hiki katika Piel humaanisha kuhesabu au kukokotoa kiasi; “ndipo” huonyesha mfuatano wa sheria kwa Kiswahili cha kawaida.
- source_word: לּוֹ
  choice: mtu huyo
  rationale: Kiwakilishi cha Kiebrania kinaonyesha kwamba kuhani anamhesabia yule mtu anayetajwa katika muktadha.
- source_word: מִכְסַת הָעֶרְכְּךָ
  choice: sehemu ya thamani uliyokadiria
  rationale: מִכְסָה ni kiasi au sehemu inayolingana, nayo עֵרֶךְ ni thamani iliyokadiriwa katika utaratibu wa sura hii. Kauli hii pia inadumisha kiambishi cha nafsi ya pili umoja.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: kwa muda uliobaki hadi Mwaka wa Yubile
  rationale: Hesabu hiyo inahusiana na kipindi kinachoishia katika Mwaka wa Yubile; “muda uliobaki” huweka wazi dhana ya kugawa kiasi kulingana na muda bila kubadili kikomo kilichotajwa.
- source_word: וְנָתַן
  choice: naye mtu huyo atatoa
  rationale: נתן ni “kutoa.” Muktadha unaonyesha kuwa anayetoa kiasi ni mwenye shamba au aliyeweka wakfu, si kuhani anayekihesabu.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati.
- source_word: קֹדֶשׁ לַיהוָה
  choice: kama toleo takatifu kwa Yahwe
  rationale: Kirai hicho kwa halisi ni “kitakatifu kwa Yahwe.” Neno “toleo” linafafanua kwa Kiswahili kinachotolewa katika mazingira ya ibada, huku tafsiri ya karibu zaidi ikihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa kunukuu matamshi yake badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Mtendaji asiyeelezwa wazi wa וְנָתַן
  choice: Mtu aliyeweka shamba wakfu ndiye atakayetoa kiasi hicho.
  alternative: Kuhani ndiye atakayetoa kiasi hicho.
  rationale: Ingawa Kiebrania hakirudii nomino ya mtendaji, muktadha unatofautisha kazi ya kuhani ya kuhesabu na wajibu wa mtu huyo wa kutoa kiasi kilichokadiriwa.
- issue: Maana ya קֹדֶשׁ לַיהוָה
  choice: “kama toleo takatifu kwa Yahwe”
  alternative: “kitakatifu kwa Yahwe”
  rationale: Chaguo kuu linaeleza kwa lugha ya kawaida kusudi la kiibada la kiasi kinachotolewa; tanbihi inalinda muundo mfupi na rasmi zaidi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Istilahi “Mwaka wa Yubile” imetumiwa kama jina la taasisi maalumu, na “Yahwe” limetumika kwa jina יהוה.
