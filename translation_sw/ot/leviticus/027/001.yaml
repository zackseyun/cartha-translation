lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi hiki katika mfululizo wa masimulizi kinaanzisha kauli ya Mungu. “Akasema” ni Kiswahili cha kawaida na cha asili katika fomula hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kama jina binafsi badala ya kubadilishwa kuwa cheo “BWANA”.
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, “kusema na mtu” huonyesha kwa asili mtu anayeambiwa maneno, sawa na אֶל katika muktadha huu.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ingawa neno hili kihalisi ni “akisema/ili kusema,” katika fomula ya Kiebrania hutambulisha yaliyosemwa. Nukta mbili huwasilisha kazi hiyo kwa Kiswahili cha kawaida bila marudio yasiyo ya asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina na huepuka kulibadilisha kuwa cheo, huku tanbihi ikieleza desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akasema na Musa:” ni wa asili, unaeleweka kwa urahisi, na unaunganisha mstari huu na maudhui ya kauli yanayofuata.
