id: LEV.27.21
reference: Leviticus 27:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: sw
  text: Lakini shamba hilo, litakapoachiliwa wakati wa Jubili, litakuwa takatifu kwa Yahwe, kama shamba lililowekwa wakfu kabisa[a]; litakuwa milki ya kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama shamba lililowekwa chini ya marufuku.” Neno la Kiebrania linamaanisha kitu kilichowekwa wakfu kwa Yahwe bila uwezekano wa kubatilishwa na kuondolewa katika matumizi ya kawaida ya wanadamu; katika baadhi ya miktadha, kuwekwa huko wakfu huhusisha kuangamizwa.
    reason: Mbadala huu unahifadhi upana na uzito wa neno חֵרֶם bila kuamua kimya-kimya kwamba shamba lenyewe lingeangamizwa.
lexical_decisions:
- source_word: וְהָיָה הַשָּׂדֶה
  choice: Lakini shamba hilo ... litakuwa
  rationale: Kiunganishi kinaendeleza sheria huku kikionyesha tofauti na uwezekano wa kukombolewa katika mstari uliotangulia. “Shamba hilo” linarejelea shamba ambalo tayari limezungumziwa.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: litakapoachiliwa wakati wa Jubili
  rationale: Maana halisi ni ‘litakapotoka,’ lakini katika sheria ya Jubili usemi huu unaeleza kuachiliwa kwa mali. Tafsiri hii inaweka wazi maana ya kisheria kwa Kiswahili cha kawaida.
- source_word: קֹדֶשׁ לַיהוָה
  choice: takatifu kwa Yahwe
  rationale: Hii ni kauli ya kuwekwa wakfu kwa Mungu. Jina la agano יהוה limetafsiriwa “Yahwe” badala ya kufichwa katika cheo.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: kama shamba lililowekwa wakfu kabisa
  rationale: חֵרֶם hueleza kitu kilichotengwa kwa Mungu bila uwezekano wa kurudishwa katika matumizi ya kawaida. “Kabisa” linaonyesha hali hiyo isiyoweza kutenguliwa bila kulazimisha wazo la kuharibiwa katika muktadha huu wa umiliki wa shamba.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: litakuwa milki ya kuhani
  rationale: לַכֹּהֵן inaonyesha kupewa au kumilikiwa na kuhani, na אֲחֻזָּה ni mali ya kudumu, hasa ardhi. “Milki” inafaa kwa muktadha huu wa sheria ya ardhi.
theological_decisions:
- issue: Maana ya חֵרֶם katika sheria ya utakatifu
  choice: lililowekwa wakfu kabisa
  alternative: lililowekwa chini ya marufuku; lililowekwa wakfu kwa kuangamizwa
  rationale: Neno hilo linaunganisha kuwekwa kwa Mungu bila kubatilishwa na kuondolewa katika matumizi ya kawaida; katika baadhi ya miktadha hujumuisha kuangamizwa. Kwa kuwa shamba hili linakuwa milki ya kuhani, maandishi makuu hayalazimishi maana ya kuharibiwa, lakini tanbihi inadumisha uzito na upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaoeleweka. “Jubili” na “milki” zinadumisha msamiati wa kisheria bila kufanya sentensi kuwa nzito.
