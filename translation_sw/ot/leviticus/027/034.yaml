base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: sw
  text: Hizi ndizo amri ambazo Yahwe alimwamuru Musa kwa wana wa Israeli katika Mlima Sinai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba mstari huu ni tamko la muhtasari na hitimisho.
- source_word: הַמִּצְוֺת
  choice: amri
  rationale: Neno hili linadumisha uzito wa kisheria wa מִצְוָה na linafaa katika muhtasari wa mwisho wa sehemu hii.
- source_word: אֲשֶׁר צִוָּה
  choice: ambazo ... alimwamuru
  rationale: Tafsiri hii inahifadhi uhusiano wa kileksia kati ya 'amri' na kitendo cha kuamuru, huku ikibaki wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linatolewa kama jina binafsi 'Yahwe,' wala si kubadilishwa kuwa cheo.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: אֶת inamtambulisha Musa kama yule aliyeamriwa; kiambishi cha yambwa katika 'alimwamuru' kinaonyesha uhusiano huo kwa Kiswahili.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kwa ajili ya wana wa Israeli
  rationale: Hii inaonyesha kwamba amri alizopewa Musa ziliwahusu na zilikusudiwa wana wa Israeli, huku tanbihi ikihifadhi uwezekano wa kutafsiri אֶל kwa maana ya moja kwa moja zaidi ya 'kwa.'
- source_word: בְּהַר סִינָי
  choice: kwenye Mlima Sinai
  rationale: Ni usemi wa kawaida wa Kiswahili wa kuonyesha mahali katika fomula hii bila kulazimisha tofauti kati ya 'juu ya' na 'katika eneo la' mlima.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; 'Yahwe' hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania na matumizi yake ya uwakilishi kwa taifa zima, bila kudai kwamba wanaume pekee ndio waliokusudiwa.
- issue: Uhusiano unaoonyeshwa na אֶל
  choice: kwa ajili ya wana wa Israeli
  alternative: kwa wana wa Israeli
  rationale: Muktadha unaonyesha kwamba Musa alipewa amri zilizowahusu Israeli. Kwa kuwa אֶל pia inaweza kueleweka kwa mwelekeo wa moja kwa moja zaidi, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo wa hitimisho na uzito wa kisheria wa mstari umehifadhiwa.
