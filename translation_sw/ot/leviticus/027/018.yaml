  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: sw
  text: Lakini kama ataliweka shamba lake wakfu baada ya Jubili[a], kuhani atamhesabia kiasi cha fedha[b] kulingana na miaka iliyobaki mpaka mwaka wa Jubili, nacho kitapunguzwa kutoka katika kadirio lako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya mwaka wa Jubili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuhani atamkadiria bei.”
    reason: lexical_alternative
  - marker: c
    text: Au, “nacho kitapunguzwa kutoka katika thamani yako iliyokadiriwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: baada ya Jubili
  rationale: אַחַר inaonyesha mfuatano wa wakati, na הַיֹּבֵל linarejelea Jubili kama utaratibu au mwaka maalumu. Kauli hii fupi huhifadhi uwezekano huo, huku tanbihi ikieleza wazi maana ya mwaka.
- source_word: יַקְדִּישׁ
  choice: ataliweka ... wakfu
  rationale: Kitenzi קדשׁ hapa kinamaanisha kulitenga shamba kuwa mali takatifu kwa BWANA. ‘Kuweka wakfu’ ni Kiswahili cha kawaida chenye uzito wa ibada bila kuongeza fundisho lisilokuwamo.
- source_word: שָׂדֵהוּ
  choice: shamba lake
  rationale: Huhifadhi wazi kiambishi cha umilikaji cha nafsi ya tatu katika Kiebrania.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: kuhani atamhesabia kiasi cha fedha
  rationale: חשב katika muktadha huu wa sheria ni kuhesabu au kukadiria, na הַכֶּסֶף ni fedha au kiasi cha fedha kinachohusika katika tathmini.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: kulingana na miaka iliyobaki
  rationale: עַל־פִּי humaanisha ‘kulingana na’ au ‘kwa msingi wa’; hivyo kiasi kinahesabiwa kwa uwiano wa miaka iliyosalia.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: mpaka mwaka wa Jubili
  rationale: Kauli hii inaonyesha kikomo cha kipindi kinachotumiwa katika hesabu.
- source_word: וְנִגְרַע
  choice: nacho kitapunguzwa
  rationale: Nifali ya גרע inaeleza kupunguzwa kwa kiasi kutoka katika kadirio la kawaida. ‘Kitapunguzwa’ ni ya asili na inafaa muktadha wa fedha.
- source_word: מֵעֶרְכֶּךָ
  choice: kutoka katika kadirio lako
  rationale: ‘Kadirio’ linaonyesha thamani iliyowekwa, na ‘lako’ huhifadhi kiambishi cha nafsi ya pili umoja kilicho katika Kiebrania.
theological_decisions:
- issue: Kuhifadhi nafsi ya pili umoja katika מֵעֶרְכֶּךָ
  choice: kutoka katika kadirio lako
  alternative: kutoka katika kadirio; kutoka katika thamani yake iliyokadiriwa
  rationale: Kiebrania kina kiambishi cha nafsi ya pili umoja. Kukihifadhi kunadumisha mtindo wa sheria unaomwelekea msikilizaji moja kwa moja na uhusiano na kadirio lililotajwa hapo awali.
- issue: Istilahi ya kiibada kwa יַקְדִּישׁ
  choice: ataliweka ... wakfu
  alternative: atalitakasa; atalitoa
  rationale: ‘Kuweka wakfu’ hudumisha wazo la kulitenga shamba kwa matumizi matakatifu bila kudokeza dhehebu au mafundisho ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sheria ni wenye heshima lakini unaeleweka kwa wasomaji wa kawaida. ‘Kuweka wakfu,’ ‘kiasi cha fedha,’ na ‘kadirio’ hudumisha muktadha wa ibada na uchumi bila lugha ya kizamani. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
