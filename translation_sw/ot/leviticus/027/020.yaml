id: LEV.27.20
reference: Leviticus 27:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: sw
  text: Lakini ikiwa hataikomboa shamba hilo, au ikiwa amemwuzia mtu mwingine shamba hilo, halitakombolewa tena.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Kiunganishi kinaendeleza sharti la aya iliyotangulia huku kikionyesha hali iliyo kinyume; “Lakini ikiwa” ni ya asili katika Kiswahili.
- source_word: יִגְאַל / יִגָּאֵל
  choice: hataikomboa / halitakombolewa
  rationale: Kitenzi גאל hapa kina maana ya kisheria na ya ibada ya kukomboa mali iliyowekwa wakfu; “komboa” huhifadhi uhusiano kati ya kauli tendi na tendwa.
- source_word: הַשָּׂדֶה
  choice: shamba hilo
  rationale: שׂדה linarejelea shamba maalumu linalozungumziwa, si ardhi kwa maana pana; “hilo” huonyesha rejeo hilo wazi.
- source_word: מָכַר
  choice: amemwuzia
  rationale: Kauli timilifu inaonyesha mauzo yaliyokamilika yenye athari ya sasa ya kisheria; wakati timilifu wa Kiswahili unafaa.
- source_word: לְאִישׁ אַחֵר
  choice: mtu mwingine
  rationale: Ingawa אִישׁ kwa msingi humaanisha mwanamume, katika kanuni hii ya kisheria inaweza kumaanisha mtu kwa ujumla. “Mtu mwingine” ni ya kawaida na huhifadhi maana ya kisheria bila kudai jinsia ya mnunuzi.
- source_word: עוֹד
  choice: tena
  rationale: Neno hili linaonyesha kwamba baada ya mauzo hakuna ukombozi mwingine unaowezekana; “tena” ni fasaha na sahihi.
theological_decisions:
- issue: Nguvu ya kisheria na ya ibada ya גאל
  choice: kukomboa
  alternative: kununua tena
  rationale: “Kukomboa” huhifadhi istilahi inayotumiwa katika sheria za mali iliyowekwa wakfu bila kuingiza dai la ziada la kiteolojia; “kununua tena” ingesisitiza shughuli ya biashara pekee.
- issue: Masculine ya jumla katika אִישׁ אַחֵר
  choice: mtu mwingine
  alternative: mwanamume mwingine
  rationale: Katika muundo huu wa sheria, אִישׁ inaweza kufanya kazi kwa maana ya mtu yeyote. Kiswahili “mtu mwingine” huwasilisha upeo huo wa kisheria kwa kawaida, huku “mwanamume mwingine” lingeweza kuweka mpaka wa kijinsia ambao muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imehifadhi masharti mawili ya Kiebrania na mabadiliko kutoka kauli tendi kwenda kauli tendwa.
