base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: sw
  text: 'Ikiwa mtu ataweka wakfu kwa Yahweh sehemu ya shamba la urithi wake[a], ukadirio wako utakuwa kulingana na kiasi cha mbegu kinachohitajika kulipanda: kwa homeri moja ya mbegu ya shayiri, shekeli hamsini za fedha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya shamba la milki yake.” Usemi wa Kiebrania unamaanisha ardhi anayomiliki kama urithi, na kiambishi awali chenye maana ya “kutoka katika” kinaonyesha kwamba ni sehemu ya shamba inayowekwa wakfu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: sehemu ya shamba la urithi wake
  rationale: Kiambishi מִן kinaonyesha sehemu inayotolewa kutoka katika shamba, si lazima shamba lote. אֲחֻזָּה hapa ni milki ya ardhi ya kurithiwa; “shamba la urithi wake” linaweka wazi maana hiyo ya kisheria.
- source_word: יַקְדִּישׁ
  choice: ataweka wakfu
  rationale: Kitenzi hiki humaanisha kutenga kitu kiwe kitakatifu kwa matumizi ya Yahweh. “Kuweka wakfu” ni Kiswahili cha kawaida, chenye hadhi, na kinafaa katika muktadha wa ibada na ukadiriaji.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume katika umoja, hapa ina nguvu ya kisheria inayowakilisha yeyote anayefanya tendo hilo. “Mtu” ni tafsiri ya asili ya Kiswahili bila kupoteza maana ya sheria.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יְהוָה limetolewa moja kwa moja kama “Yahweh,” kulingana na ushahidi wa maandishi na uamuzi wa mradi.
- source_word: עֶרְכְּךָ
  choice: thamani utakayoikadiria
  rationale: Neno linahusu thamani rasmi inayowekwa na mamlaka inayozungumziwa katika sheria. Muundo huu huhifadhi nafsi ya pili ya umoja ya Kiebrania na unasomeka kwa kawaida.
- source_word: לְפִי זַרְעוֹ
  choice: itategemea kiasi cha mbegu kinachohitajika kulipanda
  rationale: Kirai kinapima shamba kwa kiasi cha mbegu kinachohitajika kulipanda, si kwa mazao yake. Tafsiri hii inaweka wazi kipimo cha kilimo kilichokusudiwa.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: sehemu inayohitaji homeri moja ya mbegu ya shayiri
  rationale: 'Hiki ni kipimo cha eneo kwa kiasi cha mbegu: eneo linalopandwa kwa homeri moja ya shayiri. Muundo huu unaepusha dhana kwamba “homeri” ni kipimo cha ardhi chenyewe.'
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: itakuwa na thamani ya shekeli hamsini za fedha
  rationale: Kirai kinatoa kiwango cha ukadiriaji. “Shekeli hamsini za fedha” huhifadhi kitengo cha kale na aina ya malipo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kisheria ya אִישׁ
  choice: mtu
  alternative: mwanamume
  rationale: Katika sheria hii אִישׁ ni mhusika wa mfano na si hoja inayolenga jinsia yake. “Mtu” ni ya kawaida katika Kiswahili cha kisheria na haiingizi mpaka ambao muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imefafanua kipimo cha kilimo kwa lugha ya kawaida huku ikihifadhi homeri na shekeli kama vipimo vya kale. Alama ya tanbihi [a] imo katika matini kuu.
