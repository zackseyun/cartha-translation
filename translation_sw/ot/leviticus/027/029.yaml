base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: sw
  text: Kila mtu[a] aliyewekwa chini ya marufuku kutoka miongoni mwa wanadamu hawezi kukombolewa; hakika atauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila mtu aliyewekwa wakfu kwa maangamizi kutoka miongoni mwa wanadamu.” Neno la Kiebrania ḥerem humaanisha mtu au kitu kilichowekwa wakfu kabisa, yaani chini ya marufuku isiyoweza kuondolewa; katika muktadha huu mtu huyo hawezi kukombolewa na atauawa.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרֶם
  choice: mtu aliyewekwa wakfu kwa kuangamizwa
  rationale: Katika muktadha huu nomino ya kiibada חֵרֶם inamhusu mwanadamu, na kifungu cha mwisho kinaonyesha wazi matokeo ya kuangamizwa. Tafsiri hii inaepuka kumwita mtu 'kitu' huku ikihifadhi wazo la kuwekwa wakfu chini ya marufuku isiyoweza kuondolewa.
- source_word: יָחֳרַם
  choice: aliyewekwa wakfu kwa kuangamizwa
  rationale: Kitenzi חרם kinaonyesha kuwekwa chini ya ḥerem. Nyongeza 'kwa kuangamizwa' inaeleza maana inayodokezwa na hukumu ya kifo katika mstari huu bila kuifanya kuwa wakfu wa kawaida tu.
- source_word: מִן הָאָדָם
  choice: kutoka miongoni mwa wanadamu
  rationale: Kiswahili cha kawaida hutumia kifungu hiki kuonyesha kwamba anayezungumziwa ni mmoja wa jamii ya wanadamu; ni wazi na sahihi kuliko tafsiri ya moja kwa moja 'kutoka kwa mwanadamu'.
- source_word: יִפָּדֶה
  choice: hawezi kukombolewa
  rationale: Kukomboa ni istilahi ya kawaida ya kibiblia kwa פדה na inafaa katika muktadha wa kisheria na kiibada wa Walawi 27.
- source_word: מוֹת יוּמָת
  choice: lazima auawe hakika
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichopinda unasisitiza uhakika wa adhabu. 'Lazima auawe hakika' huhifadhi ulazima na msisitizo huo.
theological_decisions:
- issue: Maana ya חֵרֶם inapomhusu mwanadamu
  choice: Kuwekwa wakfu kwa kuangamizwa
  alternative: Kuwekwa chini ya marufuku; kuwekwa wakfu
  rationale: Mstari unaunganisha istilahi ya kiibada na hukumu ya kifo. Tafsiri iliyochaguliwa inadumisha pande zote mbili na haifanyi 'wakfu' usikike kama tendo chanya la kawaida.
- issue: Utambulisho wa mhusika katika כָּל חֵרֶם ... מִן הָאָדָם
  choice: Kila mtu
  alternative: Kila kitu kilichowekwa wakfu kutoka kwa mwanadamu
  rationale: מִן הָאָדָם na kauli ya kuuawa zinaonyesha kwamba hapa anayelengwa ni mwanadamu. Kiswahili cha asili kinahitaji kumtaja kama mtu badala ya kutumia nomino isiyo na uhai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili huku istilahi za kiibada, ukombozi, na msisitizo wa hukumu vikihifadhiwa.
