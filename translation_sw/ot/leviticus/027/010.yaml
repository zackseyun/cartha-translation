base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: sw
  text: Asimweke mnyama mwingine mahali pake wala asimbadilishe mnyama huyo[a], aliye mzuri kwa aliye mbaya, au aliye mbaya kwa aliye mzuri. Na ikiwa hakika atabadilisha mnyama mmoja kwa mwingine[b], basi mnyama huyo pamoja na mbadala wake watakuwa watakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “asimweke mnyama mwingine badala yake.” Kiebrania kinatumia vitenzi viwili vinavyohusiana lakini vilivyo tofauti: kimoja cha kuweka mwingine mahali pa wa kwanza, na kingine cha kubadilishana.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinakazia kitenzi: “ikiwa hakika atabadilisha” au “ikiwa kweli atabadilisha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: asimweke mnyama mwingine badala yake
  rationale: Kauli hii inaeleza tendo la kumweka mnyama mwingine mahali pa yule aliyewekwa wakfu, huku ikitofautishwa na kitenzi kinachofuata.
- source_word: יָמִיר אֹתוֹ
  choice: wala asimbadilishe
  rationale: Kitenzi hiki kinahusu kubadilishana mnyama mmoja kwa mwingine. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha kwa kadiri iwezekanavyo tofauti kati ya vitenzi viwili vya Kiebrania.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: aliye mzuri kwa aliye mbaya, au aliye mbaya kwa aliye mzuri
  rationale: Vivumishi vya Kiebrania vinatumika kama nomino; viwakilishi vya uhusiano vyenye ngeli ya viumbe hai vinaonyesha wazi kwamba sifa hizo zinawahusu wanyama.
- source_word: וְאִם הָמֵר יָמִיר
  choice: Lakini ikiwa kweli atambadilisha
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kamili unatia mkazo tendo hilo. Neno “kweli” linawasilisha mkazo huo kwa Kiswahili cha kawaida bila kufanya sentensi kuwa nzito.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: mnyama mmoja kwa mwingine
  rationale: Huu ni usemi wa asili katika Kiswahili unaoonyesha wazi ubadilishaji wa mnyama mmoja kwa mwingine.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: basi mnyama huyo pamoja na mbadala wake
  rationale: Kauli hii inabainisha kwamba mnyama wa kwanza na mnyama aliyeletwa badala yake wote wanahusika katika matokeo ya kisheria.
- source_word: קֹדֶשׁ
  choice: watakuwa watakatifu
  rationale: Neno hili linaonyesha hali ya kuwa mali takatifu ya Mungu. “Watakatifu” ni tafsiri ya moja kwa moja na inadumisha lugha ya utakatifu ya kifungu.
theological_decisions:
- issue: Hali ya mnyama wa kwanza na mnyama aliyeletwa badala yake baada ya jaribio la kubadilisha
  choice: Mnyama wa kwanza pamoja na mbadala wake wote watakuwa watakatifu.
  alternative: Mnyama aliyeletwa badala yake peke yake ndiye anayekuwa mtakatifu.
  rationale: Kauli ya Kiebrania וְהָיָה הוּא וּתְמוּרָתוֹ ... קֹדֶשׁ inawataja wazi mnyama wa kwanza na mbadala wake kuwa na hali takatifu; neno “pamoja” na kitenzi cha wingi vinawasilisha matokeo hayo bila kuongeza fundisho la nje.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio rasmi lakini unaoeleweka kwa msomaji wa kawaida. Lugha ya mnyama imetumia ngeli ya viumbe hai kwa mtiririko wa asili. Alama ya mkato mrefu inasaidia kuonyesha kwamba “aliye mzuri…” anaeleza mnyama anayebadilishwa, bila kuongeza maelezo yasiyokuwamo katika chanzo.
