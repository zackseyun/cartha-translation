id: LEV.27.6
reference: Leviticus 27:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: sw
  text: Ikiwa ana umri wa kuanzia mwezi mmoja hadi miaka mitano, thamani utakayomwekea mtoto wa kiume itakuwa shekeli tano za fedha, na thamani utakayomwekea mtoto wa kike itakuwa shekeli tatu za fedha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ
  choice: ana umri wa kuanzia mwezi mmoja
  rationale: Nahau ya Kiebrania ya kutaja umri imetafsiriwa kwa Kiswahili cha kawaida huku ikihifadhi kikomo cha chini cha mwezi mmoja.
- source_word: וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: hadi miaka mitano
  rationale: Kauli hii inahifadhi kikomo cha juu cha kundi la umri katika sheria hii bila kuongeza ufafanuzi usiotajwa.
- source_word: עֶרְכְּךָ
  choice: thamani utakayomwekea
  rationale: Nomino yenye kiambishi cha nafsi ya pili inaeleza thamani rasmi inayowekwa katika utaratibu wa nadhiri; muundo huu ni wa asili zaidi kuliko 'tathmini yako' katika Kiswahili cha kawaida.
- source_word: הַזָּכָר
  choice: mtoto wa kiume
  rationale: Katika kundi la umri la mwezi mmoja hadi miaka mitano, 'mtoto wa kiume' ni usemi wa asili unaohifadhi uainishaji wa kijinsia wa maandishi.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: shekeli tano za fedha
  rationale: Huu ni uwasilishaji wa moja kwa moja wa kiasi na aina ya mali iliyotajwa.
- source_word: וְלַנְּקֵבָה
  choice: mtoto wa kike
  rationale: Usemi huu unalingana na 'mtoto wa kiume' na unafaa kwa kundi la umri linalozungumziwa.
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: shekeli tatu za fedha
  rationale: Huhifadhi moja kwa moja kiasi cha fedha na uwiano wa kifungu cha kwanza.
- source_word: וְהָיָה
  choice: itakuwa
  rationale: Katika muktadha huu wa kisheria, kitenzi kina nguvu ya masharti; 'itakuwa' ni ya kawaida na yenye hadhi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wa kawaida. Neno 'shekeli' limehifadhiwa kama kipimo cha kale cha uzani/thamani; hakuna tanbihi iliyoongezwa kwa kuwa mstari huu hauhitaji kutatua utata wa kimatini.
