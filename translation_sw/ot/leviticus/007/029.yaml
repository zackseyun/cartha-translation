  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: agizo kwa wana wa Israeli, mshiriki anayetoa dhabihu yake ya amani kwa BWANA, na wajibu wa kuleta sadaka yake kwa BWANA kutoka katika dhabihu hiyo. Tofauti ya istilahi kati ya זֶבַח (“dhabihu”) na קָרְבָּן (“sadaka”) imehifadhiwa vizuri.'
