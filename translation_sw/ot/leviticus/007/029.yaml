id: LEV.7.29
reference: Leviticus 7:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: sw
  text: 'Waambie wana wa Israeli[a] hivi: “Mtu anayemtolea BWANA dhabihu yake ya amani[b] ataleta kwa BWANA sadaka yake kutoka katika dhabihu yake ya amani.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “dhabihu yake ya sadaka za amani”; kwa desturi pia huitwa “sadaka ya amani,” na wengine “sadaka ya ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... לֵאמֹר
  choice: Waambie ... hivi
  rationale: Muundo huu wa Kiswahili cha sasa unawasilisha kwa kawaida agizo la kusema linalofuatwa na maneno ya moja kwa moja, bila urudiaji usio wa lazima wa ‘sema ... ukisema.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Unahifadhi kwa karibu muundo wa Kiebrania ‘wana wa Israeli’ na maana yake ya pamoja ya watu wa agano; mbadala wa kawaida zaidi umewekwa katika tanbihi.
- source_word: הַמַּקְרִיב
  choice: anayemtolea
  rationale: Hifili ya קרב katika muktadha wa ibada ina maana ya kuleta au kutoa sadaka mbele za Mungu; ‘anayemtolea’ ni ya kawaida katika Kiswahili na inaonyesha anayepokea dhabihu.
- source_word: זֶבַח שְׁלָמָיו
  choice: dhabihu yake ya amani
  rationale: ‘Dhabihu’ inawakilisha זֶבַח, na ‘ya amani’ inadumisha uhusiano wa שְׁלָמִים na wazo la amani au hali njema bila kuifasiri moja kwa moja kuwa ushirika.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: ‘BWANA’ ni namna iliyozoeleka na yenye heshima ya kuwakilisha jina la agano יהוה katika tafsiri za Kiswahili; herufi kubwa zinaitofautisha na cheo cha kawaida.
- source_word: יָבִיא
  choice: ataleta
  rationale: Wakati ujao wa Kiswahili unaonyesha hapa agizo la kisheria lenye nguvu ya wajibu katika muktadha huu.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: ‘Sadaka’ ni neno la Kiswahili linaloeleweka kwa kitu kinacholetwa na kutolewa kwa Mungu, huku likitofautishwa na ‘dhabihu’ ya זֶבַח.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: kutoka katika dhabihu yake ya amani
  rationale: ‘Kutoka katika’ huhifadhi wazi maana ya מִן kwamba sadaka inayoletwa inatokana na dhabihu hiyo.
theological_decisions:
- issue: Uwakilishaji wa יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ linafuata desturi pana ya Kiswahili ya kuonyesha jina la agano kwa namna ya pekee na yenye heshima, bila kutumia ‘Bwana’ kama cheo cha kawaida.
- issue: Maana ya istilahi שְׁלָמִים
  choice: dhabihu ya amani
  alternative: dhabihu ya ushirika
  rationale: ‘Amani’ huhifadhi uhusiano wa kimsamiati na mzizi שׁלם na huepuka kuamua kwamba ‘ushirika’ pekee ndio kiini cha aina hii ya dhabihu.
- issue: Jina la pamoja בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu inahifadhi picha halisi ya ukoo katika Kiebrania, huku tanbihi ikionyesha kwamba kishazi kinawahusu Waisraeli kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ya utangulizi imefanywa ya kawaida kwa Kiswahili, huku istilahi za ibada ‘dhabihu’ na ‘sadaka’ zikidumishwa kwa utofautishaji wa maneno ya Kiebrania.
