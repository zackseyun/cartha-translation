base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: sw
  text: Na kila sadaka ya nafaka iliyochanganywa na mafuta, au iliyo kavu, itakuwa ya wana wote wa Aroni, kila mmoja sawa na ndugu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mmoja kama ndugu yake.” Nahau ya Kiebrania inasisitiza kwamba wana wa Aroni waligawiwa kwa usawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za dhabihu za Mambo ya Walawi, neno hili linamaanisha sadaka inayotokana na nafaka, si zawadi au sadaka kwa ujumla.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: iliyochanganywa na mafuta
  rationale: Kirai hiki kinaeleza jinsi sadaka ilivyotayarishwa; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: חֲרֵבָה
  choice: iliyo kavu
  rationale: Tafsiri hii inahifadhi tofauti ya moja kwa moja na sadaka iliyochanganywa na mafuta bila kuongeza ufafanuzi wa kwamba haikuwa na mafuta.
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: itakuwa ya wana wote wa Aroni
  rationale: Muundo huu unaonyesha umiliki au mgao, nao umetafsiriwa kwa Kiswahili cha kawaida huku ukihifadhi rejeo la wana wa Aroni.
- source_word: אִישׁ כְּאָחִיו
  choice: kila mmoja sawa na ndugu yake
  rationale: Nahau hii inaonyesha kwamba wana wa Aroni walipaswa kupata mgao kwa usawa; tafsiri inahifadhi mgawanyo wa mtu mmoja mmoja na lugha ya kindugu.
theological_decisions:
- issue: Lugha ya kijinsia kuhusu ukuhani
  choice: wana wote wa Aroni ... kila mmoja sawa na ndugu yake
  alternative: wazao wote wa Aroni ... wote kwa usawa
  rationale: Kiebrania kinatumia wazi maneno ya ukoo wa kiume katika muktadha wa sheria za kikuhani. Tafsiri imehifadhi jambo hilo bila kulipanua kuwa lugha isiyoainisha jinsia.
- issue: Usawa wa mgao kati ya wana wa Aroni
  choice: kila mmoja sawa na ndugu yake
  alternative: kila mmoja kama ndugu yake
  rationale: Neno כְּ linaweza kuwakilishwa kwa ‘kama,’ lakini katika nahau hii maana ya mgawanyo sawa ndiyo inayokusudiwa. Tanbihi inahifadhi umbo la karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa kisheria wenye hadhi lakini ulio wazi kwa msomaji wa kawaida. ‘Sadaka ya nafaka’ imetumiwa kama istilahi thabiti ya ibada, na jinsia ya maneno ya kikuhani imehifadhiwa.
