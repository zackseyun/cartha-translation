  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akazungumza
  rationale: Muundo wa waw-consecutive pamoja na kitenzi דבר unaendeleza simulizi na kuanzisha sehemu mpya ya hotuba. ‘Akazungumza’ ni Kiswahili cha kawaida na pia hutofautisha דבר na אמר (‘sema’).
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahwe’ ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, kusema ‘kuzungumza na Musa’ ni njia ya kawaida ya kuonyesha mtu anayeambiwa; tafsiri ya neno kwa neno ‘kwa Musa’ isingekuwa ya asili katika muktadha huu.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵּאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki huanzisha maneno ya moja kwa moja. ‘Akisema’ huhifadhi kazi hiyo ya kifomula kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kuweka cheo ‘BWANA’; tanbihi haijahitajika kwa kuwa jina lenyewe limewekwa wazi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘akazungumza ... akisema’ umehifadhi tofauti ya vitenzi vya Kiebrania na fomula ya kuanzisha hotuba; koma ya mwisho inaonyesha kwamba maneno yanayofuata yanaendelea katika mstari unaofuata.
