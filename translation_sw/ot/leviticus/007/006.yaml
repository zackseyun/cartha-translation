  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: sw
  text: Kila mwanamume miongoni mwa makuhani anaweza kuila[a]. Lazima iliwe mahali patakatifu. Ni takatifu sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila mwanamume miongoni mwa makuhani atakula.” Kiebrania kinaweza kutafsiriwa kwa namna rasmi zaidi, lakini katika muktadha huu maana yake ni kwamba kila mwanamume aliye wa kundi la makuhani anaruhusiwa kuila.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “takatifu ya vitakatifu,” nahau yenye maana ya “takatifu sana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Kila
  rationale: Hutoa maana ya kugawa kwa kila mtu anayestahili ndani ya kundi hilo.
- source_word: זָכָר
  choice: mwanamume
  rationale: Neno la Kiebrania linabainisha jinsia; “mwanamume” ni la kawaida na lenye heshima katika Kiswahili.
- source_word: בַּכֹּהֲנִים
  choice: miongoni mwa makuhani
  rationale: Huhifadhi maana ya kuwa mshiriki wa kundi la makuhani.
- source_word: יֹאכְלֶנּוּ
  choice: anaweza kula sehemu hiyo
  rationale: Kauli hii katika sheria ya dhabihu inaonyesha ruhusa au haki ya kula; “sehemu hiyo” huweka wazi kwamba kiambishi kinarejelea sehemu ya dhabihu inayozungumziwa.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: mahali patakatifu
  rationale: Kirai hakitaji mahali fulani kwa kutumia kibainishi; tafsiri hii ni ya asili na haidai kwamba ni Patakatifu penyewe ndani ya hema.
- source_word: יֵאָכֵל
  choice: Italiwa
  rationale: Huhifadhi muundo wa kutendwa na nguvu ya agizo la kisheria kuhusu mahali pa kula.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Hii ni nahau ya Kiebrania inayoonyesha kiwango cha juu kabisa cha utakatifu.
- source_word: הוּא
  choice: Ni
  rationale: Hurejelea sehemu ya dhabihu iliyotajwa katika muktadha na kuunda sentensi ya kawaida ya Kiswahili.
theological_decisions:
- issue: Kizuizi cha ulaji kwa wanaume walio ndani ya ukuhani
  choice: Kila mwanamume miongoni mwa makuhani anaweza kula sehemu hiyo
  alternative: Kila kuhani anaweza kula sehemu hiyo
  rationale: Kiebrania kinataja wazi “kila” na “mwanamume”; tafsiri haipaswi kuondoa sharti hilo la kijinsia katika kanuni hii ya ibada.
- issue: Nguvu ya kitenzi יֹאכְלֶנּוּ
  choice: anaweza kula
  alternative: atakuwa akila / lazima ale
  rationale: Katika muktadha huu wa sheria ya dhabihu, kauli hiyo inaweza kueleweka kama ruhusa au haki ya kula, ingawa tafsiri rasmi zaidi ya agizo inawezekana; tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Makuhani” huhifadhi msamiati wa kibiblia uliozoeleka, huku “sehemu hiyo” ikifanya rejeo la kiambishi cha Kiebrania lieleweke bila kuongeza fundisho.
