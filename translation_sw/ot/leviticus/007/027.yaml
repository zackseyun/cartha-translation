  text: כָּל נֶ֖פֶשׁ אֲשֶׁר תֹּאכַ֣ל כָּל דָּ֑ם וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּֽי/הָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: sw
  text: Kila mtu[a] anayekula damu yoyote—mtu huyo atakatiliwa mbali na watu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi.” Neno la Kiebrania nefesh hapa humaanisha mtu binafsi.
    reason: lexical_alternative
  - marker: b
    text: Usemi “atakatiliwa mbali” ni fomula ya kawaida ya adhabu ya agano. Huenda ukamaanisha kuondolewa katika jumuiya au hukumu ya Mungu; Kiebrania hapa hakitaji namna hasa ya adhabu hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria hii neno la Kiebrania nefesh linamtaja mtu binafsi, si sehemu isiyo ya mwili iitwayo ‘nafsi.’ ‘Mtu’ ni Kiswahili cha kawaida na wazi.
- source_word: תֹּאכַל
  choice: anayekula
  rationale: Kitenzi hiki katika kishazi cha uhusiano kinaeleza hali ya jumla ya kisheria; ‘anayekula’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כָּל דָּם
  choice: damu yoyote
  rationale: כָּל pamoja na nomino isiyohesabika hapa ina maana ya damu ya aina yoyote, si jumla ya damu yote.
- source_word: וְנִכְרְתָה
  choice: atakatiliwa mbali
  rationale: Hii ni fomula ya adhabu ya agano. ‘Atakatiliwa mbali’ inadumisha taswira ya kitenzi כרת na pia kutotajwa kwa namna hasa ya adhabu.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo
  rationale: Kurudiwa kwa nomino pamoja na kiwakilishi cha kuonyesha kunasisitiza na kumrejelea mkosaji aliyetajwa katika kishazi cha kwanza.
- source_word: מֵעַמֶּיהָ
  choice: na watu wake
  rationale: Kiambishi cha Kiebrania ni cha kike kisarufi kwa sababu נֶפֶשׁ ni nomino ya kike; sheria inamhusu mtu yeyote. ‘Watu wake’ humaanisha jumuiya ambayo mtu huyo ni sehemu yake.
theological_decisions:
- issue: Maana ya adhabu ya agano ya ‘kukatiliwa mbali’
  choice: Kudumisha usemi ‘atakatiliwa mbali’ bila kutaja kifo, kufukuzwa katika jumuiya, au hukumu ya Mungu.
  alternative: ‘atauawa,’ ‘ataondolewa katika jumuiya,’ au ‘ataangamizwa na Mungu’
  rationale: Fomula ya Kiebrania ni fupi na haibainishi namna ya adhabu hapa. Tafsiri inadumisha utata huo wa kweli badala ya kuamua suala la kisheria na kiteolojia ambalo maandishi yenyewe hayafafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umewekwa wazi, na dashibodi inahifadhi msisitizo wa kurudiwa kwa ‘mtu.’
