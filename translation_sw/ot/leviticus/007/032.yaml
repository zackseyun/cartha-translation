base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: sw
  text: Nanyi mtampa kuhani paja la kulia[a] kama mchango[b] kutoka katika dhabihu zenu za amani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mguu wa kulia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka”; kimapokeo, “sadaka ya kuinuliwa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “dhabihu zenu za ushirika” au “dhabihu zenu za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Nanyi
  rationale: Kiunganishi וְ kinaendeleza maagizo yaliyotangulia, huku kiambishi -nyi kikionyesha kwamba agizo linaelekezwa kwa wingi. Alama ya yambwa אֵת haitafsiriwi kwa neno tofauti katika Kiswahili.
- source_word: שׁוֹק
  choice: paja
  rationale: Katika muktadha wa sehemu ya mnyama wa dhabihu, neno hili hasa huelekea kumaanisha sehemu ya juu ya mguu. ‘Paja’ ni sahihi zaidi, huku ‘mguu’ ukiwa mbadala mpana zaidi.
- source_word: הַיָּמִין
  choice: la kulia
  rationale: Inabainisha upande maalumu wa sehemu ya mnyama; maana ya ‘kulia’ imehifadhiwa wazi.
- source_word: תִּתְּנוּ
  choice: mtampa
  rationale: Umbo la nafsi ya pili wingi katika agizo la kisheria linawakilishwa kwa Kiswahili cha kawaida chenye nguvu ya maagizo. Muundo huu pia unamtaja mpokeaji kwa njia ya asili.
- source_word: תְרוּמָה
  choice: mchango
  rationale: Neno linamaanisha sehemu iliyotengwa na kutolewa. ‘Mchango’ linaeleza kitu kinachotolewa kama sehemu maalumu bila kutegemea istilahi ya kimapokeo isiyoeleweka kwa urahisi.
- source_word: לַכֹּהֵן
  choice: kuhani
  rationale: Huyu ndiye mpokeaji wa sehemu hiyo. Umoja wa neno la Kiebrania umehifadhiwa.
- source_word: מִזִּבְחֵי
  choice: kutoka katika dhabihu zenu
  rationale: Kihusishi מִן kinaonyesha chanzo cha sehemu anayopewa kuhani, na kiambishi cha nafsi ya pili wingi kimehifadhiwa kwa ‘zenu’.
- source_word: שַׁלְמֵיכֶם
  choice: za amani
  rationale: ‘Dhabihu za amani’ ni tafsiri inayotambulika na ya moja kwa moja ya istilahi hii ya kidhabihu. Maana zinazohusiana na ushirika au ustawi zimehifadhiwa katika tanbihi kama mibadala halali.
theological_decisions:
- issue: Maana ya istilahi ya kidhabihu שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika; dhabihu za ustawi
  rationale: Istilahi ya Kiebrania ina upeo wa maana unaoweza kuhusishwa na amani, ushirika, au hali njema. Matini kuu imetumia istilahi inayotambulika, na tanbihi zimehifadhi mibadala bila kuamua kimadhehebu maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Nanyi mtampa’ huhifadhi mwendelezo wa kifungu na agizo kwa watu wengi. Muundo umeepuka urudiaji mzito wa ‘dhabihu za sadaka’ kwa kuwa ‘dhabihu za amani’ ni usemi wa kawaida na unaowasilisha istilahi ya Kiebrania kwa uwazi.
