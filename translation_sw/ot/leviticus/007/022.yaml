base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: Yahwe akasema na Mose[a], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula hii ya utangulizi wa hotuba ya kisheria, kitenzi דבר pamoja na אֶל kinaelezwa kwa Kiswahili cha kawaida kama “akasema na”; kinaanzisha sehemu mpya ya maneno ya Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo “BWANA,” ili kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya “akasema,” Kiswahili sanifu hutumia “na” kumtambulisha anayesemeshwa; tafsiri ya neno kwa neno “kwa” si ya kawaida katika muundo huu.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Hili ndilo umbo la kawaida la jina משה katika matumizi ya Biblia ya Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivu hii ni fomula inayotambulisha maneno yanayofuata. “Akisema” huhifadhi muundo huo na kuonyesha kwamba ujumbe unaendelea katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kina Tetragramatoni יהוה yenyewe. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “akasema na Mose, akisema” unahifadhi fomula ya Kiebrania bila kutumia lugha ya kizamani.
