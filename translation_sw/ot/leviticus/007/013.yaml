  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: sw
  text: Pamoja na mikate ya chachu, atatoa sadaka yake pamoja na dhabihu ya shukrani ya sadaka zake za amani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka zake za ushirika” au “sadaka zake za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: pamoja na
  rationale: Katika muktadha huu עַל huonyesha kitu kinachoandamana na kingine, si mahali kilipo.
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: mikate iliyotiwa chachu
  rationale: Hii ni lugha ya kawaida na iliyo wazi kwa mikate iliyotengenezwa kwa chachu, huku ikihifadhi tofauti ya kiibada na mikate isiyotiwa chachu katika muktadha.
- source_word: יַקְרִיב
  choice: atatoa
  rationale: Katika sheria za dhabihu, Hifili ya קרב humaanisha kuleta au kutoa kitu mbele za Mungu; “atatoa” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: “Sadaka” ni neno pana na linaloeleweka kwa kitu kinacholetwa kwa Mungu.
- source_word: זֶבַח
  choice: dhabihu
  rationale: “Dhabihu” linaonyesha kwa usahihi sadaka inayochinjwa katika muktadha wa kiibada.
- source_word: תּוֹדַת
  choice: ya shukrani
  rationale: Muundo huu unaonyesha kwamba dhabihu hiyo inatolewa kama tendo la shukrani.
- source_word: שְׁלָמָיו
  choice: sadaka zake za amani
  rationale: “Sadaka za amani” hudumisha uhusiano wa neno la Kiebrania na amani au ukamilifu, bila kuficha kwamba “sadaka za ushirika” na “sadaka za ustawi” pia ni tafsiri zinazowezekana.
theological_decisions:
- issue: Tafsiri ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Neno la Kiebrania hutaja aina ya sadaka inayohusishwa na amani, ukamilifu, ustawi na ushirika. Tafsiri kuu inadumisha uhusiano wa kimsamiati na amani, na tanbihi inahifadhi maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya istilahi inayofafanuliwa, yaani “sadaka zake za amani.”
