  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: sw
  text: Lakini mtu yeyote akila nyama kutoka dhabihu ya sadaka za amani iliyo ya YAHWE, huku unajisi wake ukiwa juu yake, mtu huyo atakatiliwa mbali na watu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atatengwa na watu wake.” Maneno “atakatiliwa mbali” yanaweza kumaanisha kufukuzwa au kifo, lakini hapa Kiebrania hakitaji njia hasa.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: mtu yeyote
  rationale: Katika sheria hii נֶפֶשׁ humaanisha mtu binafsi, si nafsi isiyo ya mwili. ‘Mtu yeyote’ pia huonyesha kwamba sharti hili ni la jumla.
- source_word: תֹּאכַל
  choice: anayekula
  rationale: Kauli hii inaeleza hali ya jumla katika sheria; umbo la wakati wa sasa linafaa katika Kiswahili.
- source_word: בָּשָׂר
  choice: nyama
  rationale: Katika muktadha wa chakula cha dhabihu, ‘nyama’ ni tafsiri ya kawaida na iliyo wazi.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: ya dhabihu ya sadaka za amani
  rationale: Huhifadhi jina la aina hii maalumu ya sadaka na uhusiano wake na dhabihu bila kuibana maana kuwa ushirika pekee.
- source_word: אֲשֶׁר לַיהוָה
  choice: zilizo za YAHWE
  rationale: Hueleza kwamba sadaka hizo zimewekwa wakfu na ni mali ya YHWH; YAHWE linawakilisha jina binafsi la Mungu katika Kiebrania.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: naye akiwa na unajisi
  rationale: Huwasilisha hali ya unajisi wa kiibada inayompata mtu kwa Kiswahili cha kawaida, bila kuifanya kuwa uchafu wa kawaida tu.
- source_word: וְנִכְרְתָה
  choice: atakatiliwa mbali
  rationale: Huhifadhi picha na uzito wa kitenzi כרת bila kubainisha kimya kimya kama adhabu ni kufukuzwa au kifo.
- source_word: מֵעַמֶּיהָ
  choice: na watu wake
  rationale: Kiambishi cha Kiebrania kinafuata jinsia ya kisarufi ya נֶפֶשׁ; ‘watu wake’ ni usemi wa jumla unaofaa kwa mtu anayezungumziwa.
theological_decisions:
- issue: Maana ya adhabu katika וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: atakatiliwa mbali na watu wake
  alternative: atatengwa na watu wake; atauawa
  rationale: Kiebrania kinaonyesha kuondolewa kwa uzito kutoka katika jamii, lakini hapa hakitaji njia hasa. Tafsiri kuu huhifadhi utata huo, na tanbihi hutaja uwezekano bila kuamua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Istilahi ‘unajisi’ huhifadhi muktadha wa kiibada; sentensi imeundwa kwa urahisi huku ikidumisha uzito wa sheria na utata wa adhabu.
