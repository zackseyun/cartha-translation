base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: sw
  text: Na nyama ya dhabihu yake ya amani ya shukrani[a][b] italiwa siku ya kuitoa; asiache sehemu yoyote ya nyama hiyo mpaka asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhabihu yake ya ushirika ya shukrani.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “dhabihu ya shukrani ya sadaka zake za amani.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וּבְשַׂר
  choice: Nayo nyama
  rationale: בשר hapa ni nyama ya mnyama aliyetolewa dhabihu. “Nyama” ni ya kawaida na wazi katika Kiswahili, huku “nayo” ikiwakilisha kiunganishi וּ na kuendeleza maelezo yaliyotangulia.
- source_word: זֶבַח
  choice: dhabihu
  rationale: זבח humaanisha dhabihu inayohusisha kuchinjwa; “dhabihu” ni istilahi sahihi na ya kawaida katika muktadha huu wa ibada.
- source_word: תּוֹדַת
  choice: kwa ajili ya kutoa shukrani
  rationale: תודה huonyesha shukrani au sadaka ya shukrani. Kirai hiki kinaeleza wazi kusudi au aina ndogo ya dhabihu bila kukifanya kuwa fundisho la ziada.
- source_word: שְׁלָמָיו
  choice: dhabihu yake ya amani
  rationale: שְׁלָמִים ni aina maalumu ya sadaka. “Ya amani” hudumisha istilahi ya msingi na haifasiri maana ya ibada hiyo kwa kuibana kuwa ushirika pekee; kiambishi cha nafsi yake kimehifadhiwa kwa “yake.”
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: siku atakapotoa dhabihu hiyo
  rationale: Kiebrania ni kwa maana ya ‘siku ya kuitoa kwake.’ Muundo wa kitenzi ni wa asili zaidi katika Kiswahili na unabainisha kwamba kinachotolewa ni dhabihu hiyo.
- source_word: יֵאָכֵל
  choice: italiwa
  rationale: Nifali ya kitenzi imetafsiriwa kwa kauli ya kutendwa, ikihifadhi agizo la kwamba nyama hiyo ndiyo inayopaswa kuliwa.
- source_word: לֹא יַנִּיחַ
  choice: asiache
  rationale: Hifili ya נוח hapa ina maana ya kuacha au kubakiza. “Asiache” huhifadhi mtendaji wa umoja na nguvu ya katazo.
- source_word: מִמֶּנּוּ
  choice: sehemu yoyote ya nyama hiyo
  rationale: Kihalisi ni ‘kutoka kwake,’ lakini katika katazo hili Kiswahili cha kawaida husema kutokuacha sehemu yoyote; kirai kinarejeza wazi kwa nyama.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mpaka wa muda unaotajwa.
theological_decisions:
- issue: Tafsiri ya aina ya dhabihu שְׁלָמִים
  choice: dhabihu ya amani
  alternative: sadaka ya ushirika
  rationale: Neno la Kiebrania hutaja aina maalumu ya dhabihu. “Ya amani” hudumisha istilahi hiyo bila kuamua kwamba maana yake kamili ni ushirika, ingawa huo ni uwezekano wa kileksika.
- issue: Uhusiano wa תּוֹדָה na שְׁלָמִים
  choice: dhabihu ya amani kwa ajili ya kutoa shukrani
  alternative: dhabihu ya sadaka zake za amani za shukrani
  rationale: Muundo mkuu unaonyesha sadaka ya amani ya aina au kusudi la shukrani kwa Kiswahili cha asili, huku tanbihi ikihifadhi uwezekano wa kufuata mnyororo wa majina wa Kiebrania kwa karibu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya lugha ya ibada bila kuwa kigumu. Sentensi imetumia “nyama” badala ya “mwili,” na “siku atakapotoa dhabihu hiyo” badala ya nomino nzito, ili iwe wazi kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
