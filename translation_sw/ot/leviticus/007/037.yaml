base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: sw
  text: Hii ndiyo sheria kuhusu sadaka ya kuteketezwa, sadaka ya nafaka, sadaka ya dhambi[a], sadaka ya hatia[b], ibada za kuwekwa wakfu[c], na dhabihu za amani[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso.” Neno la Kiebrania linaweza kukazia kuondolewa kwa unajisi na pia kushughulikiwa kwa dhambi.
    reason: lexical_alternative
  - marker: b
    text: Au “sadaka ya fidia.” Neno la Kiebrania linaweza kukazia uwajibikaji unaotokana na hatia na fidia inayotakiwa.
    reason: lexical_alternative
  - marker: c
    text: Istilahi ya Kiebrania inaweza pia kutafsiriwa “taratibu za kusimikwa” au “sadaka ya kuwekwa wakfu.” Neno hilo ni la wingi na linarejelea taratibu za kuwaweka makuhani katika utumishi wao.
    reason: lexical_alternative
  - marker: d
    text: Au “dhabihu za ushirika” au “dhabihu za hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Hii ndiyo sheria
  rationale: Kirai hiki kinaanzisha muhtasari wa maagizo yaliyotangulia. “Sheria” linafaa katika muktadha huu wa masharti ya dhabihu, huku “ndiyo” likifanya sentensi iwe ya kawaida na yenye msisitizo unaofaa katika Kiswahili.
- source_word: לָעֹלָה
  choice: kuhusu sadaka ya kuteketezwa
  rationale: Kiambishi ל־ kinaonyesha jambo linalohusika katika sheria hii. עֹלָה ni sadaka inayoteketezwa madhabahuni; “sadaka ya kuteketezwa” ni tafsiri wazi na iliyozoeleka.
- source_word: לַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa Walawi, מִנְחָה ni sadaka inayotolewa kwa mazao ya nafaka. Tafsiri hii ni wazi kuliko neno la jumla kama “zawadi.”
- source_word: וְלַחַטָּאת
  choice: sadaka ya dhambi
  rationale: חַטָּאת inaweza kuhusiana na dhambi na pia kuondoa unajisi. “Sadaka ya dhambi” inatambulika kwa urahisi, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: וְלָאָשָׁם
  choice: sadaka ya hatia
  rationale: אָשָׁם huelekeza kwenye hatia au uwajibikaji ambao wakati mwingine huhitaji fidia. “Sadaka ya hatia” ni fupi na sahihi, na maana ya matengenezo inaelezwa katika tanbihi.
- source_word: וְלַמִּלּוּאִים
  choice: ibada za kuwekwa wakfu
  rationale: מִלּוּאִים ni wingi na katika muktadha wa ukuhani hurejelea taratibu za kuwasimika au kuwaweka makuhani wakfu. “Ibada” huhifadhi upana wa neno kuliko kulifanya sadaka moja tu.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: זֶבַח ni “dhabihu,” na שְׁלָמִים ni kundi la sadaka linaloweza kuhusishwa na amani, ushirika, au hali njema. “Sadaka za amani” huhifadhi istilahi inayotambulika, huku mbadala zikitolewa katika tanbihi.
theological_decisions:
- issue: Maana ya חַטָּאת katika mfumo wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kusisitiza kushughulikia dhambi au kuondoa unajisi. Matini kuu haitakiwi kufuta mojawapo ya dhana hizo, kwa hiyo istilahi inayotambulika imetumiwa na maana nyingine kuhifadhiwa katika tanbihi.
- issue: Maana ya אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: Neno linahusisha hatia na uwajibikaji, pamoja na matengenezo au fidia katika visa fulani. Chaguo kuu halifanyi fidia kuwa maana pekee.
- issue: Upeo wa מִלּוּאִים
  choice: ibada za kuwekwa wakfu
  alternative: sadaka ya kuwekwa wakfu
  rationale: Umbo la Kiebrania ni la wingi na linaweza kurejelea taratibu nzima za kuwasimika makuhani, si toleo moja pekee.
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za hali njema
  rationale: Istilahi ya Kiebrania ina wigo unaoweza kujumuisha amani, ustawi, na ushirika. Tafsiri ya msingi imetumiwa bila kudai kuwa ndiyo maana pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha imewekwa kwa mtiririko wa kawaida, istilahi za dhabihu zimetafsiriwa kwa uthabiti, na utata halisi wa maneno ya Kiebrania umehifadhiwa kwa tanbihi.
