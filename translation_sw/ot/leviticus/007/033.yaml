base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: sw
  text: Yule miongoni mwa wana wa Haruni anayetoa damu ya sadaka za amani[a] na mafuta, paja la kulia litakuwa fungu lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: anayetoa
  rationale: Kitenzi katika kausativi ya Kiebrania humaanisha kuleta au kuwasilisha sadaka mbele za Mungu. “Anayetoa” ni Kiswahili cha kawaida katika muktadha wa ibada ya sadaka na kinahifadhi hali ya kitenzi-jina.
- source_word: דַּם
  choice: damu
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa damu katika maagizo ya sadaka.
- source_word: הַשְּׁלָמִים
  choice: sadaka za amani
  rationale: Neno hili hutaja aina maalumu ya sadaka na lina uhusiano wa kimsamiati na amani au ukamilifu. “Sadaka za ushirika” ni tafsiri mbadala yenye kufasiri zaidi, hivyo imewekwa katika tanbihi.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Katika muktadha huu neno linamaanisha mafuta ya mnyama, hasa sehemu za mafuta zilizotengwa kwa ajili ya sadaka.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: miongoni mwa wana wa Haruni
  rationale: Kirai hiki humchagua kuhani mmoja kutoka katika kundi la wana wa Haruni na kuhifadhi usemi wa kifamilia wa Kiebrania.
- source_word: לוֹ תִהְיֶה
  choice: atapewa ... kuwa sehemu yake
  rationale: Muundo huu unaonyesha haki ya kupokea mgao uliowekwa. Kiswahili hiki ni cha asili na kinaweka wazi kuwa paja hilo ni fungu lake halali.
- source_word: שׁוֹק הַיָּמִין
  choice: paja la kulia
  rationale: שׁוֹק hapa hutaja sehemu ya juu ya mguu wa mnyama katika ugawaji wa nyama ya sadaka; “paja” ni mahususi kuliko “mguu.”
- source_word: לְמָנָה
  choice: kuwa sehemu yake
  rationale: Neno hili humaanisha fungu au mgao uliotengewa mtu.
theological_decisions:
- issue: Tafsiri ya בְּנֵי אַהֲרֹן katika sheria za ukuhani
  choice: wana wa Haruni
  alternative: wazao wa Haruni; jamaa ya Haruni
  rationale: Kiebrania kinatumia wazi nomino ya wingi ya kiume na katika muktadha huu kinawarejelea wanaume waliotumikia kama makuhani. Tafsiri hiyo imehifadhiwa bila kuifanya isibainishe jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Mpangilio wa “Yule miongoni mwa...” huhifadhi mkazo wa Kiebrania juu ya kuhani anayefanya tendo hilo; “atapewa” hutiririka kwa kawaida zaidi kuliko tafsiri neno kwa neno ya umilikaji wa kisheria.
