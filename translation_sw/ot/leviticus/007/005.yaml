base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: sw
  text: Kuhani ataviteketeza juu ya madhabahu kama sadaka ya moto[a] kwa Yahwe. Hii ni sadaka ya hatia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka inayotolewa kwa moto kwa Yahwe.” Neno la Kiebrania ni istilahi ya sadaka inayotolewa kwa moto.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya kufidia kosa”; kwa mapokeo, “sadaka ya kosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: ataviteketeza
  rationale: Hifili ya קטר katika muktadha wa dhabihu humaanisha kufanya sehemu za dhabihu zipande kama moshi. ‘Ataviteketeza’ ni Kiswahili cha kawaida kinachoeleza kuchomwa kwa dhabihu madhabahuni bila kuifanya ionekane kuwa uvumba.
- source_word: אֹתָם
  choice: -vi-
  rationale: Kiambishi cha yambwa cha wingi kinarejelea sehemu za dhabihu zilizotajwa katika muktadha unaotangulia.
- source_word: הַכֹּהֵן
  choice: Kuhani
  rationale: Nomino ya umoja yenye uainisho; hili ndilo neno la kawaida kwa mhudumu wa kikuhani katika sheria za dhabihu.
- source_word: הַמִּזְבֵּחָה
  choice: madhabahuni
  rationale: Kiambishi cha uelekeo katika Kiebrania kinaweza kumaanisha ‘kwenda kwenye madhabahu,’ lakini katika tendo hili Kiswahili ‘madhabahuni’ huonyesha kwa kawaida mahali pa kuteketezea.
- source_word: אִשֶּׁה
  choice: sadaka ya moto
  rationale: Ni istilahi ya kidini kwa sadaka inayotolewa kwa kuchomwa moto. Tafsiri hii ni fupi, ya wazi, na inahifadhi kipengele cha moto kilicho katika neno la Kiebrania.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha kwamba sadaka imewekwa wakfu kwa Yahwe. ‘Kwa Yahwe’ ni usemi wa asili katika Kiswahili na huhifadhi jina la agano.
- source_word: אָשָׁם
  choice: sadaka ya hatia
  rationale: אָשָׁם ni jina rasmi la aina hii ya dhabihu katika Mambo ya Walawi. ‘Sadaka ya hatia’ ni wazi na hudumisha uhusiano wake na hatia, huku tanbihi ikionyesha maana mbadala ya kufidia kosa.
- source_word: הוּא
  choice: Hiyo ni
  rationale: Kiwakilishi kinaitambulisha dhabihu kwa kundi lake rasmi. ‘Hiyo ni’ hutoa sentensi ya kawaida na iliyo wazi kwa Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana Tetragramatoni yenyewe. ‘Yahwe’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Istilahi rasmi ya dhabihu אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya kufidia kosa au sadaka ya kosa
  rationale: Neno hilo linaitaja dhabihu kama kundi rasmi la ibada. ‘Sadaka ya hatia’ hudumisha maana kuu bila kuifanya dhana ya fidia, ambayo ni sehemu muhimu ya matumizi yake, kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Madhabahuni’ na ‘sadaka ya hatia’ hudumisha msamiati thabiti wa sheria za dhabihu; sentensi mbili fupi zinafuata muundo wa Kiebrania kwa uwazi.
