  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: sw
  text: '“Waambie wana wa Israeli, ukisema: Msile mafuta yoyote ya ng’ombe, kondoo, au mbuzi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Waambie
  rationale: Kauli ya amri ya moja kwa moja kwa Musa. Katika Kiswahili, “waambie” huwasilisha kwa kawaida na kwa uwazi wazo la kusema ujumbe kwa walengwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo halisi wa Kiebrania, “wana wa Israeli,” huku tanbihi ikitoa usemi wa kawaida zaidi wa Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Katika Kiswahili, nukta mbili baada ya “Waambie” hutanguliza maneno yatakayosemwa kwa njia ya kawaida bila kulazimisha muundo mzito wa “ukisema.”
- source_word: כָּל
  choice: yoyote
  rationale: Katika katazo lenye nomino isiyohesabika, “mafuta yoyote” huonyesha kwa kawaida upeo kamili wa katazo.
- source_word: חֵלֶב
  choice: mafuta
  rationale: Neno hili hurejelea mafuta ya mnyama, hasa sehemu za mafuta zinazozungumziwa katika sheria za dhabihu. “Mafuta” ndilo neno la kawaida na linaloeleweka kwa urahisi.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno la Kiebrania humaanisha mnyama wa jamii ya ng’ombe bila kulazimisha jinsia hapa; “ng’ombe” ni neno la jumla na la kawaida katika Kiswahili.
- source_word: כֶשֶׂב
  choice: kondoo
  rationale: Hutaja kondoo kwa ujumla katika orodha hii ya kisheria; “kondoo” huepuka kubainisha bila msingi kuwa mwana-kondoo au kondoo dume.
- source_word: עֵז
  choice: mbuzi
  rationale: Hutaja mbuzi kama aina ya mifugo katika orodha hii; “mbuzi” ni tafsiri ya kawaida ya jumla.
- source_word: לֹא תֹאכֵלוּ
  choice: Msile
  rationale: Umbo la wingi linaelekezwa kwa jamii nzima. “Msile” ni katazo la moja kwa moja, la sasa, na lenye hadhi katika Kiswahili.
