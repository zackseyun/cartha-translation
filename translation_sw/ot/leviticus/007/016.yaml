base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: sw
  text: Lakini ikiwa sadaka yake ya dhabihu ni ya nadhiri au ya hiari[a], italiwa siku atakapotoa dhabihu yake; na siku inayofuata, kilichobaki kutokana nayo kinaweza kuliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya nadhiri.” Kiebrania hutofautisha dhabihu inayohusiana na nadhiri na sadaka ya hiari.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: ya kutimiza nadhiri
  rationale: Katika muktadha huu neno hilo linaonyesha dhabihu inayohusiana na nadhiri, si nadhiri yenyewe kama tamko tu. Tafsiri hii ni ya kawaida na inaweka wazi aina ya sadaka bila kuichanganya na sadaka ya hiari.
- source_word: נְדָבָה
  choice: sadaka ya hiari
  rationale: Hurejelea sadaka inayotolewa kwa hiari, bila kuwa wajibu wa nadhiri; huu ni usemi wa kawaida na unaoeleweka katika Kiswahili cha ibada.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: dhabihu ya sadaka yake
  rationale: 'Inahifadhi nomino zote mbili za Kiebrania: זֶבַח kama dhabihu na קָרְבָּן kama sadaka inayoletwa.'
- source_word: בְּיוֹם הַקְרִיבוֹ אֶת זִבְחוֹ
  choice: siku atakapoitolea dhabihu yake
  rationale: קרב katika kausativi hapa ni kuleta au kutoa sadaka mbele za Mungu; 'kuitolea dhabihu' ni ya asili katika Kiswahili na inahifadhi kitendo cha kiibada.
- source_word: יֵאָכֵל
  choice: italiwa
  rationale: Kauli tendwa inadumishwa, na wakati ujao unaonyesha agizo la kisheria katika kishazi cha kwanza.
- source_word: וּמִמָּחֳרָת
  choice: na siku inayofuata
  rationale: Hutoa kwa uwazi mpangilio wa siku ya pili kwa Kiswahili cha sasa.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: kilichobaki kutoka katika dhabihu hiyo
  rationale: Huwakilisha kitu kilichosalia na kuweka wazi kwa njia ya kawaida kiwakilishi cha Kiebrania kinachorejelea dhabihu.
- source_word: יֵאָכֵל
  choice: kinaweza kuliwa
  rationale: 'Umbo lilelile la Kiebrania limetafsiriwa hapa kwa nguvu ya ruhusa inayofaa muktadha: mabaki yanaruhusiwa kuliwa siku inayofuata.'
