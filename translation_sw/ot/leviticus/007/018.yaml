revisions:
- from: Lakini ikiwa sehemu yoyote ya nyama ya dhabihu yake ya amani[a] italiwa siku ya tatu, dhabihu hiyo haitakubaliwa wala haitahesabiwa kwa faida ya yule aliyeitoa. Itakuwa kitu cha kuchukiza[b], na mtu atakayekula sehemu yake atabeba hatia yake.
  to: Lakini ikiwa nyama yoyote ya dhabihu yake ya amani[a] italiwa siku ya tatu, dhabihu hiyo haitakubaliwa, wala haitahesabiwa kwake yule aliyeitoa. Itakuwa kitu cha kuchukiza[b], na mtu atakayekula nyama hiyo atabeba hatia yake.
