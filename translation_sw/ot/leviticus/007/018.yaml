review_pass:
  verdict: revise
  source_fidelity: The draft conveys the conditional prohibition, third-day timing, nonacceptance, cultic status of פִּגּוּל, and liability of the eater. However, “haitahesabiwa kwa faida ya” makes the accounting idiom יותר explicitly benefit-oriented than the Hebrew, and “sehemu yake” can naturally refer to the eater's own portion rather than to the offering's flesh.
  naturalness: The register is clear Standard East African Swahili. “Nyama yoyote” is more idiomatic than “sehemu yoyote ya nyama,” and “akila nyama hiyo” removes an avoidable ambiguous possessive.
  terminology: “Dhabihu ya amani” is an appropriate conventional rendering of זֶבַח שְׁלָמִים. “Kitu cha kuchukiza” suitably renders the difficult technical term פִּגּוּל in the text; the footnote should avoid the overly specific and potentially misleading alternatives “nyama iliyonajisika” and “kitu kilichooza.”
  issues:
  - severity: medium
    issue: “haitahesabiwa kwa faida ya yule aliyeitoa”
    rationale: לֹא יֵחָשֵׁב לוֹ is an accounting/crediting expression, literally not counted or reckoned to the offerer. “Kwa faida ya” states an inferred beneficial outcome rather than retaining the idiom directly.
  - severity: low
    issue: “mtu atakayekula sehemu yake”
    rationale: The possessive “yake” may be read as referring to the person's own share. The Hebrew מִמֶּנּוּ refers back to the offering/flesh.
  - severity: low
    issue: Footnote alternatives for פִּגּוּל
    rationale: “Kitu kilichooza” asserts physical spoilage, and “nyama iliyonajisika” can imply a specific ritual-impurity category. Neither is required by the technical sacrificial term.
  revised_text: Lakini ikiwa nyama yoyote ya dhabihu yake ya amani[a] italiwa siku ya tatu, dhabihu hiyo haitakubaliwa, wala haitahesabiwa kwake yule aliyeitoa. Itakuwa kitu cha kuchukiza[b], na mtu atakayekula nyama hiyo atabeba hatia yake.
  revised_footnotes:
