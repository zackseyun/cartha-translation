id: LEV.7.18
reference: Leviticus 7:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: sw
  text: Lakini ikiwa nyama yoyote ya dhabihu yake ya amani[a] italiwa siku ya tatu, dhabihu hiyo haitakubaliwa, wala haitahesabiwa kwake yule aliyeitoa. Itakuwa kitu cha kuchukiza[b], na mtu atakayekula nyama hiyo atabeba hatia yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dhabihu ya amani” inaweza pia kutafsiriwa “dhabihu ya ushirika” au “dhabihu ya ustawi.”
    reason: lexical_alternative
  - marker: b
    text: Au “nyama iliyochafuliwa” au “kitu kichafu.” Neno la Kiebrania ni istilahi maalumu ya dhabihu iliyofanywa isikubalike na yenye kuchukiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Huanzisha sharti linalotofautiana na kanuni iliyotangulia; “lakini ikiwa” ni ya kawaida na huhifadhi nguvu ya kiunganishi.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: italiwa
  rationale: Muundo wa kitenzi katika Kiebrania unasisitiza tendo la kula; katika Kiswahili, kauli tendwa rahisi ni ya asili, huku muktadha ukibeba msisitizo.
- source_word: מִבְּשַׂר
  choice: sehemu yoyote ya nyama
  rationale: 'Hudhihirisha maana ya kugawa ya kihusishi מִן: hata sehemu fulani ya nyama ikiliwa.'
- source_word: זֶבַח שְׁלָמָיו
  choice: dhabihu yake ya amani
  rationale: “Dhabihu” huakisi זֶבַח, na “ya amani” huhifadhi uwanja wa maana wa שְׁלָמִים bila kuifunga kwa wazo la ushirika pekee.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Ni usemi wa kawaida wa wakati katika Kiswahili sanifu.
- source_word: לֹא יֵרָצֶה
  choice: haitakubaliwa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki kinahusu kukubalika kwa dhabihu mbele za Mungu.
- source_word: הַמַּקְרִיב אֹתוֹ
  choice: yule aliyeitoa
  rationale: Hurejelea mtu aliyeileta au kuiwasilisha dhabihu; “aliyeitoa” ni fupi na ya kawaida katika lugha ya ibada.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: haitahesabiwa kwa faida yake
  rationale: Huhifadhi picha ya kuhesabu au kuweka jambo katika hesabu ya mtu, pamoja na maana kwamba dhabihu hiyo haitamnufaisha mtoaji.
- source_word: פִּגּוּל
  choice: kitu cha kuchukiza
  rationale: Ni istilahi maalumu ya dhabihu iliyofanywa isikubalike na kuwa yenye kuchukiza; tafsiri hii ni wazi kwa msomaji wa kawaida bila kudai maana finyu kupita kiasi.
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: na mtu atakayekula sehemu yake
  rationale: נֶפֶשׁ hapa humaanisha mtu binafsi, si nafsi isiyo na mwili; “sehemu yake” huonyesha maana ya kula kutoka katika nyama hiyo.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: atabeba hatia yake
  rationale: Huhifadhi nahau ya Kiebrania ya kubeba hatia, ambayo inaweza pia kudokeza kuwajibika kwa adhabu bila kulifanya dokezo hilo kuwa tafsiri ya moja kwa moja.
theological_decisions:
- issue: Maana ya זֶבַח שְׁלָמָיו
  choice: dhabihu yake ya amani
  alternative: dhabihu yake ya ushirika; dhabihu yake ya ustawi
  rationale: Neno hilo hutaja aina maalumu ya dhabihu. “Ya amani” huhifadhi uhusiano wake na ukamilifu, hali njema na amani, huku tanbihi ikitaja tafsiri nyingine halali.
- issue: Uhusiano wa לֹא יֵחָשֵׁב לוֹ na mtoaji
  choice: haitahesabiwa kwa faida ya yule aliyeitoa
  alternative: haitahesabiwa kuwa ni yake; haitahesabiwa kwake
  rationale: Kauli hii huhifadhi sitiari ya kihasibu na inaonyesha kuwa dhabihu hiyo haitatambuliwa kuwa yenye manufaa au sifa kwa mtoaji, bila kuongeza maelezo ya kidhehebu.
- issue: Maana ya עֲוֺנָהּ תִּשָּׂא
  choice: atabeba hatia yake
  alternative: atabeba adhabu ya kosa lake
  rationale: Kiebrania kinaweza kujumuisha hatia pamoja na matokeo yake. Tafsiri kuu huhifadhi mvutano huo badala ya kuamua wazi kwamba kinachobebwa ni adhabu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Viwakilishi visivyo vya lazima vimeepukwa; “mtu” limetumiwa kwa maana ya jumla. Alama za tanbihi zimewekwa karibu na istilahi zinazofafanuliwa, kwa kuwa alama katika safu ya mashauriano ya Kiingereza zilionekana kubadilishwa nafasi.
