  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: sw
  text: ambayo Yahweh alimwamuru Musa katika Mlima Sinai, siku alipowaamuru wana wa Israeli[a] walete matoleo yao kwa Yahweh katika nyika ya Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Inaendeleza kishazi tegemezi kinachorejelea sheria na maagizo yaliyotajwa katika mstari uliotangulia.
- source_word: צִוָּה
  choice: alimwamuru
  rationale: Kitenzi hiki huhifadhi mamlaka ya agizo la Yahweh katika muktadha wa sheria na ibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: בְּהַר סִינָי
  choice: kwenye Mlima Sinai
  rationale: Hii ni kauli ya kawaida ya Kiswahili kwa mahali katika mlima, bila kulazimisha tofauti kati ya ‘juu ya’ na ‘katika eneo la’ mlima.
- source_word: בְּיוֹם
  choice: siku
  rationale: Inahifadhi rejeleo la wazi la wakati katika Kiebrania na kusomeka kwa kawaida katika Kiswahili.
- source_word: צַוֹּתוֹ
  choice: alipowaamuru
  rationale: Jina-kitenzi lenye kiambishi cha nafsi limetolewa kama kishazi cha wakati kwa Kiswahili cha kawaida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa karibu usemi wa kifamilia wa Kiebrania; tanbihi inataja tafsiri nyingine za kawaida.
- source_word: לְהַקְרִיב
  choice: walete
  rationale: Katika muktadha wa dhabihu, Hiphil ya קרב humaanisha kuleta au kuwasilisha kitu mbele ya Mungu; ‘walete’ ni ya kawaida na haijarudii neno ‘matoleo’.
- source_word: קָרְבְּנֵיהֶם
  choice: matoleo yao
  rationale: קָרְבָּן ni neno pana linalojumuisha aina mbalimbali za matoleo na dhabihu zinazofupishwa hapa.
- source_word: בְּמִדְבַּר סִינָי
  choice: katika nyika ya Sinai
  rationale: ‘Nyika’ hueleza eneo kame lisilokaliwa kwa wingi bila kulifanya lazima kuwa jangwa la mchanga.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la agano la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Chaguo kuu linahifadhi taswira ya kifamilia ya Kiebrania, huku tanbihi ikionyesha maana ya kijamii ya usemi huo bila kuibana kwa wana wa kiume pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mwanzo ‘ambayo’ umehifadhiwa kwa sababu mstari huu unaendeleza sentensi na muhtasari wa mstari uliotangulia. Alama ya tanbihi imewekwa baada ya ‘wana wa Israeli,’ ambako maelezo yake yanahusika.
