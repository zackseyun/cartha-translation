revisions:
- from: Mikono yake mwenyewe italeta sadaka zinazotolewa kwa moto kwa BWANA. Ataleta mafuta pamoja na kidari, ili kukitikisa kidari kuwa sadaka ya kutikiswa mbele za BWANA.
  to: Mikono yake mwenyewe italeta sadaka za BWANA zinazotolewa kwa moto; ataleta mafuta juu ya kidari, ili akitikise kidari kama sadaka ya kutikiswa mbele za BWANA.
  rationale: Marekebisho yanahifadhi tofauti ya chanzo kwamba mafuta yako “juu ya” kidari, huku yakitumia Kiswahili sanifu na istilahi ya ibada iliyo wazi. Hakuna dokezo la chini linalohitajika, kwa kuwa maana inaweza kutafsiriwa moja kwa moja.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:14:04Z'
review_pass:
  verdict: revise
  source_fidelity: Rasimu inawakilisha kwa ujumla tendo la mtoaji kuleta matoleo ya BWANA na kutikiswa kwa kidari. Hata hivyo, kihusishi עַל (“juu ya”) katika “mafuta juu ya kidari” hakipaswi kufifishwa kuwa “pamoja na”; usemi huo wa Kiebrania unaeleza mpangilio wa sehemu hizo katika tendo la ibada.
  naturalness: Kiswahili cha rasimu kinaeleweka na kina hadhi inayofaa, lakini “kukitikisa kidari kuwa sadaka” si muundo laini zaidi kwa maana ya “kukitikisa ... kama sadaka ya kutikiswa.” Muundo wa kurekebisha unaifanya sentensi kuwa ya kawaida bila kupoteza uradidi wa istilahi ya ibada.
  terminology: “BWANA,” “kidari,” na “sadaka ... kwa moto” zinafaa. “Sadaka za BWANA zinazotolewa kwa moto” huweka kwa uwazi uhusiano wa kirai cha Kiebrania אִשֵּׁי יְהוָה, na “sadaka ya kutikiswa” hudumisha istilahi ya תְּנוּפָה.
  issues:
  - severity: medium
    issue: Kihusishi עַל hakijahifadhiwa
    rationale: Maandishi ya Kiebrania yanasema “mafuta juu ya kidari.” “Pamoja na” huonyesha ushirikiano wa jumla, lakini haionyeshi mpangilio unaotajwa na chanzo.
  - severity: low
    issue: Muundo wa “kuwa sadaka” unahitaji kulainishwa
    rationale: Katika Kiswahili, “kama sadaka ya kutikiswa” hueleza kwa kawaida zaidi kazi/aina ya kitendo hicho kuliko “kuwa sadaka,” bila kubadili maana.
  revised_text: Mikono yake mwenyewe italeta sadaka za BWANA zinazotolewa kwa moto; ataleta mafuta juu ya kidari, ili akitikise kidari kama sadaka ya kutikiswa mbele za BWANA.
