base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: sw
  text: Mikono yake mwenyewe italeta sadaka za BWANA zinazotolewa kwa moto; ataleta mafuta juu ya kidari, ili akitikise kidari kama sadaka ya kutikiswa mbele za BWANA.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשֵּׁי יְהוָה
  choice: sadaka zinazotolewa kwa moto kwa BWANA
  rationale: Neno אִשֶּׁה humaanisha sadaka inayotolewa kwa moto; tafsiri hii inaeleza namna ya kuitoa bila kuiita kwa jumla tu ‘chakula’.
- source_word: הֶחָזֶה
  choice: kidari
  rationale: Katika muktadha wa sehemu ya mnyama wa dhabihu, ‘kidari’ ni neno mahususi na linaloeleweka kwa sehemu ya kifua.
- source_word: לְהָנִיף ... תְּנוּפָה
  choice: kukitikisa ... kuwa sadaka ya kutikiswa
  rationale: Hudumisha uradidi wa mzizi wa Kiebrania na istilahi ya ibada ya kuinua au kusogeza sehemu ya sadaka mbele za BWANA.
- source_word: יָדָיו תְּבִיאֶינָה
  choice: Mikono yake mwenyewe italeta
  rationale: Muundo huu huhifadhi msisitizo kwamba mtoaji binafsi ndiye anayepaswa kuleta sadaka.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ linafuata desturi pana ya Biblia za Kiswahili na safu ya ushauri ya POB, huku herufi kubwa zikionyesha jina la agano.
- issue: Maana ya אִשֵּׁי
  choice: sadaka zinazotolewa kwa moto
  alternative: sadaka za chakula
  rationale: Ushahidi wa kileksia unaelekeza kwenye matoleo ya motoni; kuepuka ‘chakula’ pekee kunazuia dhana ya kawaida ya mlo bila kulazimisha fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa sasa. Sentensi mbili zimefuata mgawanyo wa maana wa Kiebrania; ‘mbele za BWANA’ imehifadhiwa kama usemi wa kiibada uliozoeleka.
