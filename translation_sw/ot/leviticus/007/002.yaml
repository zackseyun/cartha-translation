base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: sw
  text: Mahali wanapochinja sadaka ya kuteketezwa, watachinja sadaka ya hatia[a], naye atairusha damu yake kwenye pande zote za madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya fidia” au “sadaka ya kufidia hasara.” Neno la Kiebrania linahusisha hatia pamoja na kutoa fidia au kurekebisha hasara.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Mahali
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kwa uwazi eneo maalumu linalotajwa na Kiebrania bila kulazimisha tafsiri ya neno kwa neno.
- source_word: יִשְׁחֲטוּ
  choice: wanapochinja / watachinja
  rationale: Kitenzi ‘kuchinja’ kinafaa kwa uchinjaji wa mnyama katika ibada; nyakati hizi pia zinaonyesha vizuri uhusiano kati ya kishazi cha mahali na agizo kuu.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni jina linaloeleweka la sadaka iliyoteketezwa yote, yaani aina maalumu ya sadaka katika sheria za Walawi.
- source_word: הָאָשָׁם
  choice: sadaka ya hatia
  rationale: Hili ni jina linalotambulika la aina hii ya sadaka, huku tanbihi ikihifadhi maana inayohusiana na fidia na kurekebisha hasara.
- source_word: דָּמוֹ
  choice: damu yake
  rationale: Kiwakilishi kinamrejelea mnyama wa sadaka ya hatia; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יִזְרֹק
  choice: atairusha
  rationale: Kitenzi hiki kinahifadhi tendo la kuitupa au kuirusha damu kuelekea madhabahuni, badala ya kudokeza tu matone mepesi kama yanavyoweza kueleweka kwa ‘kunyunyiza.’
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: kwenye madhabahu pande zote
  rationale: Usemi huu unaonyesha kwamba damu inawekwa kwenye sehemu zinazozunguka madhabahu, huku ukibaki wa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya neno la sadaka אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia; sadaka ya kufidia hasara
  rationale: ‘Sadaka ya hatia’ huhifadhi jina la kawaida la aina hii ya sadaka, lakini tanbihi inaonyesha kwamba neno la Kiebrania pia linahusisha fidia au kurekebisha hasara; hivyo tafsiri haifungi maana kwenye dhana ya hatia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka. Istilahi za sadaka zimewekwa wazi bila kutumia msamiati wa dhehebu fulani. Kiwakilishi cha umoja katika ‘naye atairusha’ kimehifadhi mabadiliko ya Kiebrania kutoka wingi kwenda umoja, ambayo kwa muktadha yanaelekea kumtaja kuhani bila kuliongeza jina hilo kwenye matini.
