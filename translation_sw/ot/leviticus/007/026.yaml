review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition against eating any blood, its universal application in all dwelling places, and the categories of bird and animal. The only source-fidelity concern is the opening “Nanyi,” which can add an emphatic sense (“you also”) not required by the simple Hebrew conjunction וְ.
  naturalness: The wording is clear, idiomatic Standard East African Swahili, and suitably concise for legal instruction. “Na msile” is more neutral and natural than “Nanyi msile” here. “Iwe ni ya ndege au ya mnyama” clearly relates the blood to the two animal categories.
  terminology: “Damu,” “makao,” “ndege,” and “mnyama” are appropriate. “Mnyama” properly retains the broadness of בְּהֵמָה without unnecessarily restricting it to livestock.
  issues:
  - severity: low
    issue: “Nanyi” adds possible emphasis.
    rationale: The Hebrew initial waw simply continues the instruction. In Swahili, “Nanyi” may imply ‘you too/also,’ an emphasis not explicit in the source. A plain “Na” preserves the connection without this added nuance.
  revised_text: Na msile damu yoyote katika makao yenu yote, iwe ni ya ndege au ya mnyama.
