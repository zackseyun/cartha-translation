  text: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: sw
  text: Na msile damu yoyote katika makao yenu yote, iwe ni ya ndege au ya mnyama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל
  choice: Nanyi ... yoyote
  rationale: Kiunganishi וְ kinaunganisha katazo hili na maagizo yaliyotangulia; כָּל pamoja na kitenzi kilichokanushwa huleta maana ya ‘yoyote.’
- source_word: דָּם
  choice: damu
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa דָּם katika Kiswahili.
- source_word: לֹא תֹאכְלוּ
  choice: msile
  rationale: Umbo la katazo kwa wingi linaonyesha agizo la kisheria kwa namna ya asili na yenye nguvu katika Kiswahili.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: katika makao yenu yote
  rationale: Tafsiri hii inahifadhi upeo wa ‘yote’ na maana ya mahali ambako watu wanaishi, bila kuufupisha kuwa usemi usio wa moja kwa moja.
- source_word: לָ/עוֹף
  choice: ya ndege
  rationale: Ingawa לְ ni ‘kwa’ kihalisi, hapa inaonyesha kundi ambalo damu hiyo ni yake; ‘ya ndege’ ni ya kawaida na wazi katika Kiswahili.
- source_word: וְ/לַ/בְּהֵמָה
  choice: au ya mnyama
  rationale: בְּהֵמָה humaanisha mnyama, mara nyingi mnyama wa nchi kavu au wa kufugwa; ‘mnyama’ huepuka kulifinya neno kuwa ‘mifugo’ pekee. ‘Au’ huwasilisha vizuri makundi mawili yanayojumuishwa katika katazo.
theological_decisions:
- issue: Upeo wa katazo la kula damu
  choice: Katazo linahusu damu yoyote ya ndege au ya mnyama katika makao yote ya Waisraeli.
  alternative: Mwisho unaweza kutafsiriwa kihalisi zaidi kuwa ‘kwa ndege na kwa mnyama,’ bila kueleza wazi uhusiano wa damu na makundi hayo.
  rationale: Muundo wa Kiebrania unaeleweka kwa kawaida kuwa unataja makundi ya viumbe ambao damu yao hairuhusiwi kuliwa; tafsiri haiongezi maelezo ya kitheolojia ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Makao yenu yote’ huhifadhi mtindo na upeo wa lugha ya kisheria ya chanzo; ‘msile’ ni katazo la kawaida, fupi, na lenye nguvu.
