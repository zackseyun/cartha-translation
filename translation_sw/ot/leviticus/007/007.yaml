  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: sw
  text: 'Kama ilivyo kwa sadaka ya dhambi, ndivyo ilivyo kwa sadaka ya hatia: kuna sheria moja kwa zote mbili.[a] Kuhani anayefanya upatanisho kwa kuitumia sadaka hiyo ndiye atakayeimiliki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fundisho moja.” Neno la Kiebrania ni torah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: Kama ilivyo kwa sadaka ya dhambi, ndivyo ilivyo kwa sadaka ya hatia
  rationale: Viambishi כ־ vinaonyesha ulinganisho. Katika muktadha huu חטאת na אשם ni majina ya sadaka, si dhambi na hatia kwa ujumla; muundo wa Kiswahili unahifadhi ulinganisho wa jozi kwa lugha ya kawaida.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: kuna sheria moja kwa zote mbili
  rationale: תורה hapa ni kanuni au sheria ya utaratibu wa sadaka. 'Zote mbili' huweka wazi kuwa kiwakilishi cha wingi kinarejelea sadaka ya dhambi na sadaka ya hatia.
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: Kuhani anayefanya upatanisho kwa kuitumia sadaka hiyo
  rationale: כפר inadumisha maana yake ya ibada na kitheolojia kama 'kufanya upatanisho.' בּוֹ inaonyesha sadaka kuwa chombo kinachotumiwa, bila kuongeza mtu ambaye upatanisho unafanywa kwa ajili yake.
- source_word: לוֹ יִהְיֶה
  choice: ndiye atakayeimiliki
  rationale: Nahau hii inaonyesha kuwa sadaka hiyo itakuwa mali au fungu la kuhani anayehudumu. 'Atakayeimiliki' ni ya asili na inaweka wazi haki ya umiliki.
theological_decisions:
- issue: Maana ya כפר katika sheria ya sadaka
  choice: kufanya upatanisho
  alternative: kufanya utakaso
  rationale: '''Kufanya upatanisho'' huhifadhi uzito mpana wa neno katika ibada bila kulifunga kwa nadharia maalumu ya jinsi upatanisho unavyotenda.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inaweka wazi marejeo ya viwakilishi bila kuongeza mhusika wa upatanisho ambaye hajasemwa katika Kiebrania.
