  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: sw
  text: 'Atatoa kutoka kwa mnyama huyo mafuta yake yote: mkia mnene wenye mafuta[a], na mafuta yanayofunika viungo vya ndani[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mkia mnene wenye mafuta wa kondoo, ambao ulikuwa sehemu maalumu ya mafuta ya dhabihu.
    reason: cultural_note
  - marker: b
    text: Au “sehemu za ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: mafuta yake / mafuta
  rationale: Katika sheria za dhabihu, חֵלֶב humaanisha hasa sehemu za mafuta zilizotengwa kwa ajili ya kutolewa. “Mafuta” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: יַקְרִיב
  choice: atatoa
  rationale: Hifili ya קרב katika muktadha wa dhabihu inaweza kumaanisha kuwasilisha au kutoa sehemu ya dhabihu. “Atatoa” ni ya asili katika Kiswahili na inadumisha maana ya tendo la ibada bila kubainisha hatua zaidi ya maandishi.
- source_word: מִמֶּנּוּ
  choice: kutoka katika mnyama huyo
  rationale: Kiambishi kinarejelea mnyama wa dhabihu. Kutaja “mnyama huyo” huondoa utata ambao “kutoka kwake” ungeweza kuleta katika Kiswahili.
- source_word: הָאַלְיָה
  choice: mkia wenye mafuta
  rationale: אַלְיָה ni mkia mnene wenye mafuta wa kondoo, sehemu maalumu ya mafuta ya dhabihu. “Mkia wenye mafuta” ni wazi na ya kawaida kuliko tafsiri ya neno kwa neno isiyoeleweka.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: yanayofunika matumbo ya ndani
  rationale: קֶרֶב hapa hurejelea viungo vya ndani au viscera. “Matumbo ya ndani” ni lugha inayoeleweka kwa wasomaji wa kawaida na inabaki halisi vya kutosha kwa maelezo ya anatomia ya dhabihu.
- source_word: כָּל
  choice: yote
  rationale: כָּל husisitiza jumla ya sehemu za mafuta zilizotajwa; “yote” hudumisha msisitizo huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Atatoa” limetumiwa kwa tendo la ibada; “mnyama huyo” limewekwa wazi ili kurejelea dhabihu, na maelezo ya anatomia yametolewa kwa lugha inayoeleweka kwa urahisi.
