  source_fidelity: 'Maana ya msingi imehifadhiwa: kuhani hutoa mafuta juu ya madhabahu kwa kuyateketeza, na kidari ni mgao wa Aroni na wanawe. Hata hivyo, kitenzi katika rasimu kina kiambishi cha yambwa cha umoja (-i-) kisicholingana na “mafuta,” ambayo hutendwa kisarufi kama wingi.'
