  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: sw
  text: Kuhani atateketeza mafuta juu ya madhabahu[a], na kidari kitakuwa cha Aroni na wanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayatoa mafuta yapae moshi juu ya madhabahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: ataiteketeza
  rationale: Katika muktadha wa dhabihu, kausativi ya קטר humaanisha kuchoma sehemu ya sadaka madhabahuni ili ipae kama moshi. “Ataiteketeza” ni Kiswahili cha kawaida kinachoeleza tendo hilo wazi; maana ya moshi imehifadhiwa katika tanbihi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika huduma ya ibada; umoja wa Kiebrania umehifadhiwa.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Katika sheria za dhabihu za Walawi, חֵלֶב hurejelea sehemu za mafuta zilizotengwa kwa ajili ya madhabahu, si mafuta kwa maana ya jumla au ya kitamathali.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Ingawa kiambishi elekezi kinaweza kuwa na maana ya “kwenye madhabahu,” muktadha wa ibada unaonyesha kwamba mafuta yanateketezwa juu ya madhabahu.
- source_word: וְהָיָה
  choice: kitakuwa cha
  rationale: Kifungu hiki, ingawa kwa karibu ni “kitakuwa,” katika sheria hii kinaonyesha umiliki au mgao. “Kitakuwa cha” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: הֶחָזֶה
  choice: kidari
  rationale: Katika sheria za dhabihu, חָזֶה ni sehemu ya kifua cha mnyama inayotolewa kwa makuhani. “Kidari” ni neno mahususi na la kawaida kwa sehemu hiyo ya mnyama.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: cha Aroni na wanawe
  rationale: Herufi ל hapa huonyesha mgao au umiliki. Muundo “cha Aroni na wanawe” ni wa asili katika Kiswahili na huhifadhi haki yao kwa sehemu hiyo.
