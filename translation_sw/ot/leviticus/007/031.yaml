    rationale: -i- huashiria yambwa wa umoja wa ngeli ya I-/ZI-, ilhali “mafuta” ni wingi. Kwa kuwa nomino ya yambwa imetajwa, “atateketeza mafuta” ndiyo muundo sahihi na wa kawaida.
  - severity: low
