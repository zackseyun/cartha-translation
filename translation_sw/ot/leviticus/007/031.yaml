  terminology: “Kuhani,” “mafuta,” “madhabahu,” “kidari,” na “Aroni” ni istilahi zinazofaa. Tanbihi irekebishwe ili kuepuka muundo usio wa kawaida “atayatoa mafuta yafuke moshi,” huku ikihifadhi dhana ya kutoa mafuta yapae moshi.
