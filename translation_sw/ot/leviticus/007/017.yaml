translation:
  language: sw
  text: Na nyama ya dhabihu itakayobaki siku ya tatu itateketezwa kwa moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Lakini ... itakayobaki
  rationale: Kiunganishi pamoja na umbo la nomino linalotokana na kitenzi kinaendeleza agizo huku likionyesha tofauti na masharti yaliyotangulia; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: מִבְּשַׂר
  choice: nyama ya
  rationale: Ingawa בָּשָׂר inaweza kumaanisha ‘mwili’ au ‘nyama,’ katika muktadha wa chakula cha dhabihu ‘nyama’ ndiyo tafsiri ya kawaida na iliyo wazi.
- source_word: הַזָּבַח
  choice: dhabihu
  rationale: זֶבַח hapa humaanisha mnyama au tendo la dhabihu; ‘dhabihu’ ni neno la moja kwa moja na linalofaa katika muktadha wa ibada.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: mpaka siku ya tatu
  rationale: Kiswahili hiki kinaeleza kwa kawaida kwamba nyama iliyobaki kufikia siku ya tatu ndiyo inayopaswa kuchomwa; hakibadili siku iliyotajwa kuwa wakati wa utekelezaji.
- source_word: בָּאֵשׁ
  choice: kwa moto
  rationale: Katika Kiswahili, ‘kuteketezwa kwa moto’ ni usemi wa kawaida wa kuonyesha njia ya kuangamiza kitu kwa kukichoma.
- source_word: יִשָּׂרֵף
  choice: itateketezwa
  rationale: Umbo la kutendwa limehifadhiwa, na wakati ujao katika muktadha wa sheria unatoa agizo lenye uzito bila kuhitaji kuongeza neno ‘lazima.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Hakuna tanbihi inayohitajika, kwa kuwa tofauti ya Kiingereza kati ya ‘meat’ na ‘flesh’ haileti mbadala wa asili wenye manufaa sawa katika Kiswahili hiki.
