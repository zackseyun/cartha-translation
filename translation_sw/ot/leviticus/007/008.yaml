  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: sw
  text: Naye kuhani anayetoa sadaka ya kuteketezwa ya mtu, ngozi ya sadaka ya kuteketezwa aliyotoa itakuwa mali yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Neno la kawaida na linaloeleweka kwa כֹּהֵן katika sheria za dhabihu.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: anayetoa / aliyotoa
  rationale: Katika muktadha wa ibada, Hiphil ya קרב humaanisha kuleta na kutoa dhabihu; ‘kutoa’ ni Kiswahili cha kawaida na hudumisha maana ya kitendo cha ibada.
- source_word: עֹלַת אִישׁ
  choice: sadaka ya kuteketezwa ya mtu
  rationale: עֹלָה ni aina ya sadaka inayoteketezwa; אִישׁ hapa humtaja mtoa sadaka mmoja. ‘Ya mtu’ ni ya asili katika Kiswahili bila kubadili umoja wa msemo.
- source_word: עֹור
  choice: ngozi
  rationale: Neno hili linamaanisha ngozi ya mnyama aliyechinjwa; ‘ngozi’ ndilo neno la kawaida la Kiswahili.
- source_word: אֲשֶׁר הִקְרִיב
  choice: aliyotoa
  rationale: Kishazi hiki kinaitambulisha sadaka husika ambayo kuhani amekwisha kuitoa.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: itakuwa mali yake
  rationale: Huwasilisha kwa uwazi kwamba ngozi inakuwa sehemu ya kuhani anayehudumu, huku ikidumisha msisitizo wa Kiebrania ‘kwa kuhani, kwake.’
theological_decisions:
- issue: Maana ya אִישׁ katika עֹלַת אִישׁ
  choice: ya mtu
  alternative: ya mwanamume
  rationale: אִישׁ ni nomino ya umoja wa kiume na inaweza kumaanisha mwanamume au mtu binafsi kulingana na muktadha. ‘Mtu’ hudumisha umoja na ni Kiswahili cha kawaida bila kulazimisha maana nyembamba kuliko muktadha unavyodai.
- issue: Istilahi ya ibada kwa עֹלָה
  choice: sadaka ya kuteketezwa
  alternative: sadaka ya kupaa
  rationale: ‘Sadaka ya kuteketezwa’ hutambulisha wazi aina ya dhabihu inayohusika. ‘Sadaka ya kupaa’ huonyesha asili ya neno lakini si istilahi iliyo wazi kwa wasomaji wengi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inafaa kwa sheria za ibada. Mpangilio wa sentensi unahifadhi uhusiano kati ya kuhani anayetoa dhabihu na ngozi inayokuwa mali yake.
