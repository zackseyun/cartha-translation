  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: sw
  text: 'Hii ndiyo sheria ya dhabihu ya amani[a] ambayo mtu atamtolea Yahwe:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu ya ustawi”; kwa kawaida huitwa “dhabihu ya amani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Hii ndiyo
  rationale: Kiunganishi וְ pamoja na kiwakilishi זֹאת kinaanzisha sehemu mpya. “Hii ndiyo” ni ya kawaida katika Kiswahili na haitii neno la wakati lisilokuwapo katika Kiebrania.
- source_word: תּוֹרַת
  choice: sheria ya
  rationale: Katika maandiko ya kikuhani, תּוֹרָה humaanisha sheria au agizo linaloongoza ibada; “sheria ya” inadumisha maana rasmi na muundo wa nomino tegemezi.
- source_word: זֶבַח הַ/שְּׁלָמִים
  choice: dhabihu ya amani
  rationale: זֶבַח ni dhabihu inayotolewa, na שְׁלָמִים ni istilahi maalumu ya aina ya dhabihu. “Dhabihu ya amani” ni tafsiri fupi, ya asili, na inayotambulika katika Kiswahili; upana wa maana unaohusu ustawi umehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר יַקְרִיב
  choice: ambayo mtu atamtolea
  rationale: Hiphili ya קרב katika muktadha wa dhabihu humaanisha kuleta au kutoa mbele za Mungu. Nafsi ya tatu ya kiume inatumika kwa maana ya jumla katika sheria, hivyo “mtu” huepuka kuifanya sheria ihusu mwanamume pekee. Wakati ujao “atamtolea” unaonyesha tendo linaloelekezwa na sheria bila kuongeza kwa wazi maana ya ruhusa.
- source_word: לַ/יהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama “Yahwe”; kiambishi cha yambwa katika “atamtolea” kinaonyesha kwamba dhabihu inatolewa kwake.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Tafsiri ya istilahi ya dhabihu שְׁלָמִים
  choice: dhabihu ya amani
  alternative: dhabihu ya ustawi
  rationale: Neno hili linaweza kudokeza amani, ukamilifu, na ustawi. Tafsiri ya kawaida “dhabihu ya amani” imetumiwa katika maandishi, huku maana mbadala ikihifadhiwa katika tanbihi bila kuufunga upana wa istilahi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye hadhi ya maandiko ya ibada. Sentensi imedumisha muundo rasmi wa sheria huku ikitumia “mtu” kwa mhusika wa jumla.
