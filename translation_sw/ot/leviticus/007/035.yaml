base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: sw
  text: Hili ndilo fungu la Aroni na fungu la wanawe, kutoka katika sadaka za Yahwe zinazotolewa kwa moto[a], siku alipowaleta ili wahudumu kama makuhani wa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fungu la kutiwa mafuta,” yaani fungu linalohusishwa na kuwekwa wakfu. Kwa kawaida, “sadaka za chakula za Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: fungu la kutiwa mafuta
  rationale: Neno hili linahusiana na kutiwa mafuta, lakini katika muktadha huu linamaanisha fungu walilotengewa makuhani kwa sababu ya kuwekwa wakfu. Tafsiri hii inadumisha uhusiano huo wa kileksika bila kupoteza dhana ya fungu.
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: fungu la kutiwa mafuta la Aroni na fungu la kutiwa mafuta la wanawe
  rationale: Kurudiwa kwa nomino katika Kiebrania kumehifadhiwa, na “wanawe” kwa kawaida humrejelea Aroni.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: kutoka katika sadaka za Yahwe zinazotolewa kwa moto
  rationale: אִשֶּׁה huonyesha sadaka inayotolewa kwa moto; tafsiri hii ni wazi katika Kiswahili na inadumisha kihusishi “kutoka katika.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa badala ya kubadilishwa na cheo.
- source_word: בְּיוֹם
  choice: siku
  rationale: Hutaja wakati au tukio la kuwekwa kwao katika huduma; muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: הִקְרִיב אֹתָם
  choice: alipowaleta karibu
  rationale: Hiphil ya קרב kwa msingi humaanisha kuwaleta karibu. Kwa kuwa kiima ni mtu wa tatu umoja na mtendaji hajatajwa wazi katika mstari huu, tafsiri hailazimishi utambulisho wake.
- source_word: לְכַהֵן
  choice: ili wamtumikie ... kama makuhani
  rationale: Infinitivu hii inaeleza kutenda huduma ya ukuhani; usemi huu ni wa asili na unaeleweka katika Kiswahili.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Katika muundo “wamtumikie Yahwe,” kihusishi cha Kiebrania kinaonyeshwa kwa yambwa ya kitenzi cha Kiswahili.
theological_decisions:
- issue: Maana ya מִשְׁחַת katika sheria ya ukuhani
  choice: fungu la kutiwa mafuta
  alternative: fungu; fungu lililotengwa wakati wa kuwekwa wakfu
  rationale: Muktadha unaonyesha fungu la makuhani kutoka katika sadaka, huku asili ya neno ikihusiana na kutiwa mafuta. Tafsiri iliyochaguliwa inadumisha pande zote mbili badala ya kuamua kimya kwamba ni tendo la kupaka mafuta tu au mgao tu.
- issue: Utambulisho wa mtendaji katika הִקְרִיב אֹתָם
  choice: alipowaleta karibu
  alternative: Musa alipowaleta karibu; alipowasilisha
  rationale: Kiebrania kina kiima cha mtu wa tatu umoja lakini hakitaji jina katika mstari huu. Kutotaja jina kunahifadhi hali hiyo ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Muundo unaendeleza urudiaji wa Kiebrania na kuhifadhi utata wa מִשְׁחַת pamoja na kutotajwa wazi kwa mtendaji wa הִקְרִיב.
