base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: sw
  text: Lakini mafuta ya mnyama aliyekufa bila kuchinjwa[a], na mafuta ya mnyama aliyeraruliwa na wanyama wa porini[b], yanaweza kutumiwa kwa kazi yoyote; lakini msiyale kamwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania nevelah humaanisha mnyama aliyekufa bila kuchinjwa kwa njia inayofaa; pia inaweza kutafsiriwa “mnyama aliyekutwa amekufa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mnyama aliyeraruliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: mafuta
  rationale: Neno la kawaida na linaloeleweka kwa mafuta ya mnyama katika masharti ya dhabihu na chakula; istilahi ya kitaalamu zaidi si ya lazima hapa.
- source_word: נְבֵלָה
  choice: mnyama aliyekufa bila kuchinjwa
  rationale: Katika sheria za Torati neno hili humaanisha mnyama aliyekufa bila kuchinjwa kwa njia inayofaa, si tu mzoga kama kitu.
- source_word: טְרֵפָה
  choice: mnyama aliyeraruliwa na wanyama pori
  rationale: Huwasilisha maana ya mnyama aliyeraruliwa na wanyama wawindaji, huku tanbihi ikionyesha kuwa mtendaji hatajwi wazi katika umbo lenyewe la neno.
- source_word: יֵעָשֶׂה
  choice: yanaweza kutumiwa
  rationale: Hapa kauli ya Kiebrania inaruhusu matumizi ya mafuta hayo, badala ya kueleza tu kwamba kitu fulani kitengenezwe.
- source_word: לְכָל מְלָאכָה
  choice: kwa matumizi yoyote
  rationale: Kauli hii ya asili ni pana na katika muktadha inaruhusu matumizi yasiyo ya chakula; tafsiri hii ni ya kawaida zaidi kuliko 'kwa kazi yoyote'.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: lakini msiyale kamwe
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichopigwa huimarisha katazo; 'kamwe' huonyesha msisitizo huo kwa Kiswahili cha kawaida.
