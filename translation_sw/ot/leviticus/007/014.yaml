id: LEV.7.14
reference: Leviticus 7:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: sw
  text: Kutoka humo atatoa sehemu moja ya kila sadaka kuwa mchango kwa BWANA[a]. Sehemu hiyo itakuwa ya kuhani anayenyunyiza[b] damu ya dhabihu za amani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwa toleo lililotengwa kwa BWANA.” Neno la Kiebrania linamaanisha sehemu iliyotengwa kwa ajili ya Mungu na kupewa kuhani.
    reason: lexical_alternative
  - marker: b
    text: Au “anayeirusha” au “anayeimwaga kwa kuirusha” damu ya dhabihu hizo.
    reason: lexical_alternative
  - marker: c
    text: “Dhabihu za amani” pia zinaweza kutafsiriwa “dhabihu za ushirika” au “dhabihu za hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: atatoa
  rationale: Hifili ya קרב hapa ina maana ya kuleta au kutoa kitu mbele kama sadaka. “Atatoa” ni ya kawaida na inaeleweka katika muktadha huu bila kuongeza hatua ya kiibada isiyotajwa wazi.
- source_word: מִמֶּנּוּ
  choice: kutoka humo
  rationale: Kiwakilishi cha umoja kinarejelea jumla ya vitu vya sadaka ya shukrani vilivyotajwa kabla; “kutoka humo” huhifadhi uhusiano huo kwa Kiswahili cha asili.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: sehemu moja ya kila sadaka
  rationale: Kiebrania kinasema kihalisi “moja kutoka kila sadaka.” Neno “sehemu” limeongezwa kwa uwazi wa Kiswahili bila kubainisha kuwa ni kitu gani zaidi ya muktadha.
- source_word: תְּרוּמָה
  choice: mchango
  rationale: Neno hili humaanisha sehemu iliyotengwa kwa ajili ya Mungu na baadaye kupewa kuhani. “Mchango” ni neno wazi la sasa; maana maalumu ya kiibada imeelezwa katika tanbihi.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Hii inaonyesha kuwa sehemu hiyo imetengwa kwa YHWH. “BWANA” ni namna iliyozoeleka ya kuwakilisha jina la Mungu katika tafsiri za Kiswahili.
- source_word: הַזֹּרֵק
  choice: anayenyunyiza
  rationale: זרק hueleza tendo la kuitupa au kuirusha damu dhidi ya madhabahu. “Anayenyunyiza” ni ya asili katika lugha ya ibada, huku tanbihi ikihifadhi uwezekano wa “kuirusha” au “kuimwaga kwa kuirusha.”
- source_word: דַּם הַשְּׁלָמִים
  choice: damu ya dhabihu za amani
  rationale: “Dhabihu za amani” huhifadhi jina la jadi la aina hii ya dhabihu bila kuifunga maana yake kwa ushirika pekee au hali njema pekee.
- source_word: לוֹ יִהְיֶה
  choice: itakuwa ya kuhani
  rationale: Nahau hii ya Kiebrania inaonyesha umiliki au fungu analopewa mtu; Kiswahili hiki kinaeleza wazi haki ya kuhani kuipokea.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” hufuata desturi pana ya tafsiri za Kiswahili ya kuwakilisha jina la agano bila kubadili rejeo lake.
- issue: Maana ya שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika; dhabihu za hali njema
  rationale: “Dhabihu za amani” huhifadhi aina ya dhabihu inayotambulika na pia huepuka kupunguza wigo wa neno kuwa ushirika au ustawi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa mara mbili ili kuepuka muundo mzito, na istilahi za kiibada zisizo wazi zimefafanuliwa katika tanbihi.
