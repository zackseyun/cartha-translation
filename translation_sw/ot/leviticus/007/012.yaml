source:
  edition: WLC
  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: sw
  text: Ikiwa anaitoa kama sadaka ya shukrani[a], basi pamoja na dhabihu ya shukrani atatoa mikate isiyotiwa chachu iliyochanganywa na mafuta, mikate myembamba isiyotiwa chachu iliyopakwa mafuta, na mikate ya unga laini uliotayarishwa[b], iliyochanganywa na mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya kutoa shukrani.” Neno la Kiebrania linamaanisha sadaka inayoletwa kwa shukrani.
    reason: lexical_alternative
  - marker: b
    text: Maana kamili ya neno la Kiebrania hapa si hakika; huenda linaeleza unga laini uliokorogwa, uliokandwa, au kuandaliwa kwa namna nyingine pamoja na mafuta.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: sadaka ya shukrani
  rationale: Katika muktadha huu neno hilo linataja sadaka inayotolewa kwa kutoa shukrani; tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili.
- source_word: יַקְרִיבֶנּוּ
  choice: akitoa sadaka hiyo
  rationale: Hifili ya קרב katika sheria za dhabihu humaanisha kuleta au kutoa kitu kama sadaka; kiwakilishi -נּוּ kinawakilishwa na “hiyo.”
- source_word: זֶבַח הַתּוֹדָה
  choice: dhabihu ya shukrani
  rationale: “Dhabihu” hudumisha maana ya זֶבַח na uhusiano wa nomino mbili katika Kiebrania.
- source_word: חַלּוֹת מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: חַלּוֹת ni vipande au mikate, na מַצּוֹת inaonyesha kuwa havikutiwa chachu.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: iliyochanganywa na mafuta
  rationale: בלל huonyesha viambato vilivyochanganywa; usemi huu ni wa asili katika maelezo ya mapishi.
- source_word: רְקִיקֵי מַצּוֹת
  choice: mikate myembamba isiyotiwa chachu
  rationale: רְקִיקִים ni mikate au vipande vyembamba; “mikate myembamba” ni wazi zaidi kuliko neno la mkopo “waferi.”
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: iliyopakwa mafuta
  rationale: Ingawa משׁח pia hutafsiriwa “kutia mafuta,” hapa tendo ni la utayarishaji wa chakula; “kupakwa mafuta” hudumisha tendo bila kuingiza maana ya ibada isiyolazimishwa na muktadha.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hili ni neno la kawaida la unga uliosagwa vizuri unaotumiwa katika matoleo.
- source_word: מֻרְבֶּכֶת
  choice: uliokorogwa
  rationale: Neno adimu linaelekea kueleza namna unga ulivyoandaliwa kwa kuchanganywa au kukorogwa, lakini hatua kamili ya upishi haijulikani kwa hakika.
- source_word: חַלֹּת
  choice: mikate
  rationale: Neno linataja vitu vya mkate vilivyotengenezwa kwa unga laini; “mikate” ni pana vya kutosha kutodai umbo lisilo hakika.
theological_decisions:
- issue: Aina ya sadaka inayotajwa na תּוֹדָה
  choice: sadaka ya shukrani
  alternative: sadaka ya sifa
  rationale: “Shukrani” hudumisha maana kuu ya neno katika muktadha huu bila kuifanya kuwa aina tofauti ya ibada ya sifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Mikate myembamba” imetumiwa badala ya neno la mkopo, na “iliyopakwa mafuta” inaonyesha utayarishaji wa chakula.
