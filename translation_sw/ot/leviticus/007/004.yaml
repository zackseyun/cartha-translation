  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ya ibada ulio wa heshima lakini unaoeleweka. Alama ya tanbihi imewekwa baada ya ‘ini’ ili ihusishwe na neno la kitaalamu הַיֹּתֶרֶת, badala ya ‘figo’.
