base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: sw
  text: na figo zote mbili, na mafuta yaliyo juu ya figo hizo, yaliyo kwenye viuno, na kiambatisho[a] kilicho juu ya ini, ambacho atakiondoa pamoja na figo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndewe ya ini”; neno la Kiebrania la sehemu hii ya mwili ni la kitaalamu, na rejeleo lake sahihi linajadiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: figo zote mbili
  rationale: Neno כְּלָיֹת humaanisha figo katika maelezo ya sehemu za mnyama zinazotolewa dhabihu; ‘zote mbili’ huonyesha wazi idadi ya jozi hiyo.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Katika sheria za dhabihu za Walawi, חֵלֶב ni sehemu za mafuta zilizotengwa kwa ajili ya kutolewa; ‘mafuta’ ni neno la kawaida na linaloeleweka.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: yaliyo juu ya figo hizo
  rationale: Hutafsiri moja kwa moja uhusiano wa עַל (‘juu ya’) bila kuongeza wazo la kwamba mafuta hayo yanafunika figo.
- source_word: הַכְּסָלִים
  choice: viuno
  rationale: כְּסָלִים hurejelea eneo la viuno au mbavu za chini karibu na figo; ‘viuno’ huhifadhi maana ya kianatomia bila maelezo ya ziada.
- source_word: הַיֹּתֶרֶת
  choice: kiambatisho
  rationale: Hili ni neno la kitaalamu la kianatomia lenye rejeo lisilo hakika kabisa; ‘kiambatisho’ huepuka kutaja kwa uhakika kupita kiasi kuwa ni ndewe maalumu.
- source_word: עַל הַכָּבֵד
  choice: kilicho juu ya ini
  rationale: עַל kwa kawaida ni ‘juu ya’; tafsiri hii haiongezi bila lazima wazo la kushikamana na ini.
- source_word: עַל הַכְּלָיֹת
  choice: pamoja na figo
  rationale: Katika utaratibu huu wa dhabihu, kirai hicho kinaonyesha kwamba kiambatisho cha ini kinaondolewa pamoja na figo; hii ni Kiswahili cha kawaida kuliko tafsiri ya mahali pekee.
- source_word: יְסִירֶנָּה
  choice: atakiondoa
  rationale: Hifili ya סור hapa ni agizo la utaratibu wa dhabihu; kiambishi ‘-ki-’ kinafuata kiambatisho, ambacho ndicho kinacholengwa na kiambishi tamati cha umoja katika Kiebrania.
