  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: sw
  text: 'Hii ndiyo sheria ya sadaka ya hatia: ni takatifu sana.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya kufidia” au “sadaka ya malipo.” Neno la Kiebrania asham linataja dhabihu inayohusishwa na hatia na kufidia hasara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Hii ndiyo
  rationale: Muundo huu unatambulisha maagizo yanayofuata kwa Kiswahili cha kawaida. Kiunganishi וְ kina nguvu ya kuendeleza mjadala, lakini hapa hakihitaji kutafsiriwa kwa neno tofauti.
- source_word: תּוֹרַת
  choice: sheria ya
  rationale: Katika muktadha huu תּוֹרָה ni kanuni au utaratibu uliowekwa kuhusu dhabihu; “sheria ya” ni tafsiri iliyo wazi na inayofaa katika muktadha wa Walawi.
- source_word: הָ/אָשָׁם
  choice: sadaka ya hatia
  rationale: אָשָׁם ni aina maalumu ya sadaka inayohusishwa na hatia na ulipaji wa fidia. “Sadaka ya hatia” huhifadhi jina la aina hiyo ya dhabihu, huku maana ya fidia ikielezwa katika tanbihi.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Muundo wa Kiebrania unaonyesha kiwango cha juu kabisa cha utakatifu. “Takatifu sana” ni Kiswahili cha kawaida, chenye heshima, na hakichanganywi na jina la sehemu ya patakatifu.
- source_word: הוּא
  choice: ni
  rationale: Kiwakilishi hiki kinafanya kazi ya kuainisha sadaka hiyo kuwa katika daraja la vitu vitakatifu sana; Kiswahili huwasilisha uhusiano huo kwa kopula “ni” bila kulazimika kurudia kiwakilishi.
theological_decisions:
- issue: Tafsiri ya neno la dhabihu אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia; sadaka ya malipo
  rationale: “Sadaka ya hatia” huhifadhi dhana ya hatia na jina linalotambulika la aina hii ya sadaka bila kuifanya fidia kuwa maana yake pekee. Tafsiri mbadala zinazosisitiza kurekebisha hasara au kulipa fidia zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya moja kwa moja, huku istilahi ya dhabihu na kiwango cha utakatifu vikihifadhiwa kwa uwazi.
