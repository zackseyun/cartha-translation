  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: sw
  text: Kwa maana nimechukua kidari cha sadaka ya kutikiswa na paja la sadaka ya kuinuliwa[b] kutoka kwa wana wa Israeli[a], kutoka katika dhabihu zao za amani[c]; nami nimewapa Haruni kuhani na wanawe kuwa fungu lao la kudumu, kutoka kwa wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania ni “wana wa Israeli,” jina rasmi linalotumiwa mara nyingi kuhusu taifa hilo.
    reason: lexical_alternative
  - marker: b
    text: Au “paja la sehemu iliyotengwa.” Neno la Kiebrania linamaanisha sehemu inayoinuliwa au kutengwa kama sadaka.
    reason: lexical_alternative
  - marker: c
    text: Au “sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: kidari cha sadaka ya kutikiswa
  rationale: “Kidari” hutaja sehemu ya kifua ya mnyama katika muktadha wa dhabihu, na “sadaka ya kutikiswa” huhifadhi tendo maalumu la kiibada linalodokezwa na תְּנוּפָה.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: paja la sadaka ya kuinuliwa
  rationale: שׁוֹק ni sehemu ya juu ya mguu, yaani paja; “sadaka ya kuinuliwa” hutofautisha תְּרוּמָה na sadaka ya kutikiswa na kuonyesha sehemu iliyoinuliwa au kutengwa kwa ajili ya Mungu.
- source_word: לָקַחְתִּי
  choice: nimechukua
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililofanywa ambalo matokeo yake yanaendelea katika agizo hili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu jina rasmi la agano la Kiebrania; “Waisraeli” limetolewa kama namna ya kawaida zaidi ya Kiswahili.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: dhabihu zao za sadaka za amani
  rationale: Huhifadhi nomino זֶבַח, “dhabihu,” pamoja na aina maalumu ya sadaka, שְׁלָמִים, bila kuifupisha kuwa dhana ya ushirika pekee.
- source_word: וָאֶתֵּן אֹתָם
  choice: nami nimewapa
  rationale: Huhifadhi mwendelezo wa tamko la Mungu na hali ya matokeo yanayoendelea ya utoaji huo.
- source_word: לְחָק עוֹלָם
  choice: kuwa sehemu yao kwa agizo la kudumu
  rationale: Katika muktadha huu חֹק ni agizo lililoweka fungu la makuhani; tafsiri hii inaonyesha kwa pamoja fungu walilopewa na uhalali wake wa kudumu.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: kutoka kwa wana wa Israeli
  rationale: Kurudia kirai hiki kunahifadhi msisitizo wa Kiebrania kwamba fungu la makuhani hutolewa na wana wa Israeli.
theological_decisions:
- issue: Jina la kiagano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” hufuata muundo wa Kiebrania na kudumisha sauti rasmi ya kiagano, huku tanbihi ikitaja Kiswahili cha kawaida zaidi.
- issue: Maana ya aina ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: “Sadaka za amani” huhifadhi uhusiano wa neno hilo na ukamilifu au amani na huepuka kulifungia katika wazo moja tu la ushirika.
- issue: Nguvu ya kisheria ya לְחָק עוֹלָם
  choice: kuwa sehemu yao kwa agizo la kudumu
  alternative: kuwa sheria ya kudumu
  rationale: Muktadha unahusu fungu maalumu walilopewa Haruni na wanawe; “kwa agizo la kudumu” pia huhifadhi nguvu ya kisheria bila kuamua kwamba עוֹלָם lazima itafsiriwe kifalsafa kuwa isiyo na mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya heshima na ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za ibada “sadaka ya kutikiswa” na “sadaka ya kuinuliwa” zimetumiwa ili kudumisha tofauti ya maneno mawili ya Kiebrania. Mpangilio umerahisishwa kiasi kwa ufasaha, lakini marudio ya “kutoka kwa wana wa Israeli” yamehifadhiwa kwa sababu yana uzito katika matini chanzi.
