base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: sw
  text: Lakini nyama itakayogusa kitu chochote kilicho najisi[a] isiliwe; iteketezwe kwa moto. Kuhusu nyama, kila mtu aliye safi anaweza kula nyama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitakachogusana na chochote kilicho najisi.” Kiebrania kina maana pana na kinarejelea unajisi wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: Lakini nyama
  rationale: בָּשָׂר hapa ni nyama ya dhabihu, na kiunganishi kinaonyesha tofauti na nyama inayoruhusiwa kuliwa.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: itakayogusa kitu chochote kilicho najisi
  rationale: יִגַּע inaeleza mguso, huku כָּל טָמֵא ikiwa kategoria pana ya kitu chenye unajisi wa kiibada.
- source_word: לֹא יֵאָכֵל
  choice: isiliwe
  rationale: Kauli tendwa ya katazo imetolewa kwa Kiswahili cha kisheria kilicho wazi na cha kawaida.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: iteketezwe kwa moto
  rationale: Hueleza njia inayotakiwa ya kuiondoa nyama iliyonajisika; 'kwa moto' inalingana kwa kawaida na בָּאֵשׁ.
- source_word: וְהַבָּשָׂר
  choice: Kuhusu nyama nyingine
  rationale: Kurudiwa kwa nomino kunaanzisha tofauti na nyama iliyonajisika; 'nyingine' huweka tofauti hiyo wazi bila kuibadili maana.
- source_word: כָּל טָהוֹר
  choice: mtu yeyote aliye safi
  rationale: Kivumishi hiki kimetumiwa kama nomino kwa mtu mwenye hali ya usafi wa kiibada.
- source_word: יֹאכַל בָּשָׂר
  choice: anaweza kuila
  rationale: Kitenzi katika muktadha huu kinatoa ruhusa, si amri; kiwakilishi '-i-' kinairejelea nyama inayozungumziwa.
theological_decisions:
- issue: Maana ya טָמֵא / טָהוֹר katika sheria ya dhabihu
  choice: najisi / safi, zikieleweka kuwa hali za kiibada
  alternative: chafu / takatifu; najisi / safi kimaadili
  rationale: Katika kanuni hizi za Walawi, maneno hayo yanaonyesha hasa hali ya kiibada, si lazima dhambi ya mtu au ubora wake wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Najisi' limedumishwa kwa usahihi wa istilahi ya kiibada; tanbihi inalifafanua. Tofauti kati ya nyama iliyonajisika na nyama inayoweza kuliwa imeonyeshwa kwa mtiririko wa kawaida.
