base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: sw
  text: Kwa maana mtu yeyote anayekula mafuta ya mnyama ambaye kutoka kwake hutolewa sadaka inayotolewa kwa moto kwa YHWH[a], mtu huyo atakatiliwa mbali na watu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula inayotolewa kwa moto.” Neno la Kiebrania linamaanisha sadaka inayotolewa kwa moto juu ya madhabahu.
    reason: lexical_alternative
  - marker: b
    text: “Atakatiliwa mbali” huhifadhi fomula ya sheria ya Kiebrania. Adhabu hususa inayokusudiwa inajadiliwa; huenda ikahusisha kufukuzwa katika jumuiya, kifo, au hukumu ya Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya katazo lililotangulia na kudumisha uhusiano wa hoja kwa Kiswahili cha kawaida.
- source_word: כָּל אֹכֵל
  choice: mtu yeyote anayekula
  rationale: Inawasilisha kwa kawaida nguvu ya jumla ya muundo wa Kiebrania.
- source_word: חֵלֶב
  choice: mafuta
  rationale: Neno hili linamaanisha mafuta ya mnyama, hasa sehemu za mafuta zilizotengwa katika sheria za dhabihu.
- source_word: מִן הַבְּהֵמָה
  choice: ya mnyama
  rationale: בְּהֵמָה hapa ni mnyama wa kufugwa anayefaa katika muktadha wa dhabihu; 'mnyama' ni wazi na halazimishi maana finyu isiyotajwa.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: ambaye sehemu yake hutolewa
  rationale: Kiwakilishi cha Kiebrania kinaonyesha kwamba sadaka hutolewa kutoka kwa mnyama huyo. Kutaja 'sehemu yake' huepuka kudokeza kwamba mnyama mzima lazima atolewe huku kukidumisha uhusiano wa chanzo.
- source_word: אִשֶּׁה
  choice: sadaka ya kuteketezwa kwa moto
  rationale: Hueleza sadaka inayotolewa kwa moto juu ya madhabahu bila kuifasiri kwa lazima kuwa 'sadaka ya chakula'.
- source_word: לַיהוָה
  choice: kwa YHWH
  rationale: Huhifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: וְנִכְרְתָה
  choice: atakatiliwa mbali
  rationale: Huhifadhi sitiari na uzito wa fomula ya adhabu ya agano bila kuamua ikiwa ni kufukuzwa, kifo, au hukumu ya Mungu.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: mtu huyo
  rationale: נֶפֶשׁ katika sheria humaanisha mtu binafsi; kurejelea 'mtu huyo' ni Kiswahili cha asili na huepuka kurudia kwa uzito.
- source_word: מֵעַמֶּיהָ
  choice: na watu wake
  rationale: Kiambishi cha kike kinakubaliana kisarufi na נֶפֶשׁ, lakini mhusika ni mtu yeyote; 'watu wake' huhifadhi urejeleo wa jumla kwa kawaida.
theological_decisions:
- issue: Fomula ya adhabu וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: atakatiliwa mbali na watu wake
  alternative: ataondolewa miongoni mwa watu wake; atauawa
  rationale: Namna halisi ya adhabu hiyo haijabainishwa wazi katika mstari huu. Tafsiri inadumisha sitiari ya Kiebrania na kuacha wazi uwezekano wa kutengwa na jumuiya, kifo, au hukumu ya Mungu.
- issue: Jina la Mungu לַיהוָה
  choice: kwa YHWH
  alternative: kwa BWANA; kwa Yahwe
  rationale: Matini ya chanzo ina jina la agano יהוה. Umbo 'YHWH' hulihifadhi bila kudai kwa uhakika matamshi yake ya kale.
- issue: Jinsia katika lugha ya jumla ya kisheria
  choice: mtu yeyote ... watu wake
  alternative: mwanamke ... watu wake
  rationale: Ingawa kiambishi katika מֵעַמֶּיהָ ni cha kike kwa sababu ya upatanisho na nomino ya kike נֶפֶשׁ, sheria inamhusu mkosaji yeyote, si mwanamke pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umewekwa wa asili kwa Kiswahili huku istilahi ya dhabihu na fumbo la adhabu vikihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
