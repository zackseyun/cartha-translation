  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: sw
  text: Mtu akigusa kitu chochote najisi—iwe ni unajisi wa mwanadamu, mnyama najisi, au kitu chochote najisi chenye kuchukiza—kisha akala sehemu ya nyama ya dhabihu ya sadaka za amani iliyo ya Yahwe, mtu huyo atakatiliwa mbali na watu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “atakatiliwa mbali” ni tamko la adhabu ya agano. Inaweza kumaanisha kutengwa au hukumu ya Mungu; Kiebrania hakielezi hapa jinsi adhabu hiyo itakavyotekelezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria hii neno hili humaanisha mtu binafsi, si sehemu ya kiroho inayoitwa ‘nafsi’.
- source_word: תִגַּע
  choice: akigusa
  rationale: Huhifadhi maana ya kugusa au kukutana na kitu kwa namna inayoleta unajisi wa kiibada.
- source_word: בְּכָל טָמֵא
  choice: kitu chochote najisi
  rationale: Huonyesha upana wa kirai cha Kiebrania na kudumisha istilahi ya kiibada ‘najisi’.
- source_word: טֻמְאַת אָדָם
  choice: unajisi wa mwanadamu
  rationale: Hurejelea unajisi unaohusiana na binadamu kwa ujumla, wala si mwanamume pekee.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: mnyama najisi
  rationale: ‘Mnyama’ ni neno pana na la kawaida linalofaa hapa.
- source_word: שֶׁקֶץ טָמֵא
  choice: kitu chochote najisi chenye kuchukiza
  rationale: Huhifadhi dhana zote mbili za unajisi na hali ya kuchukiza bila kulifanya neno hili liwe aina moja tu ya kiumbe.
- source_word: וְאָכַל מִבְּשַׂר
  choice: kisha akala sehemu ya nyama
  rationale: ‘Sehemu ya’ huwakilisha matumizi ya מן yanayoonyesha kula kiasi fulani cha nyama hiyo.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: Huhifadhi istilahi ya kitamaduni ya dhabihu na maana pana ya שְׁלָמִים bila kuibana iwe ushirika pekee.
- source_word: אֲשֶׁר לַיהוָה
  choice: iliyo ya Yahwe
  rationale: Huonyesha kuwa dhabihu hiyo imetengwa kwa Mungu au ni mali yake.
- source_word: יהוה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu katika maandishi ya Kiebrania kwa uwazi.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: atakatiliwa mbali na watu wake
  rationale: Huhifadhi tamko zito la adhabu ya agano bila kubainisha utaratibu ambao Kiebrania hakijaueleza.
theological_decisions:
- issue: Maana mahususi ya adhabu וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: atakatiliwa mbali na watu wake
  alternative: atatengwa na watu wake; atauawa
  rationale: Kiebrania hakisemi wazi hapa ikiwa adhabu hiyo ni kutengwa na jumuiya, kifo, au hukumu ya Mungu; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. ‘Najisi,’ ‘dhabihu,’ na ‘sadaka za amani’ zimetumiwa kama istilahi za kiibada, huku sentensi ikibaki ya kawaida na wazi.
