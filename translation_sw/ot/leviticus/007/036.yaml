id: LEV.7.36
reference: Leviticus 7:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲשֶׁר֩ צִוָּ֨ה יְהוָ֜ה לָ/תֵ֣ת לָ/הֶ֗ם בְּ/יוֹם֙ מָשְׁח֣/וֹ אֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: sw
  text: ambayo Yahweh aliamuru wapewe kutoka kwa wana wa Israeli siku alipowatia mafuta—hii ni sheria ya kudumu katika vizazi vyao vyote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa Waisraeli.” Kiebrania kinasema kihalisi “kutoka kwa wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sheria ya milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi hiki kinaanzisha kishazi rejeshi kinachorejelea mafungu ya makuhani yaliyotajwa katika muktadha uliotangulia.
- source_word: צִוָּה
  choice: aliamuru
  rationale: Neno hili linahifadhi nguvu ya amri ya Mungu katika muktadha wa sheria ya agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi wa jina lenyewe badala ya kubadilishwa kuwa cheo.
- source_word: לָתֵת לָהֶם
  choice: wapewe
  rationale: Ingawa muundo wa Kiebrania ni 'kutoa kwao,' kauli tendwa ni ya asili katika Kiswahili na inaonyesha wazi kuwa mafungu hayo yalipaswa kutolewa kwa makuhani.
- source_word: בְּיוֹם
  choice: siku
  rationale: Katika kishazi cha wakati, 'siku alipowatia mafuta' ni Kiswahili cha kawaida na hudumisha usemi halisi wa Kiebrania.
- source_word: מָשְׁחוֹ אֹתָם
  choice: alipowatia mafuta
  rationale: Tafsiri hii huhifadhi tendo mahususi la kutia mafuta badala ya kulipanua kuwa 'kuweka wakfu'; kiambishi cha nafsi ya tatu umoja kinachukuliwa kumrejelea Yahweh.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: na wana wa Israeli
  rationale: Kihusishi מֵאֵת katika muundo huu kinaonyesha chanzo cha kile walichopewa makuhani; Kiswahili cha kauli tendwa hutumia 'na.' 'Wana wa Israeli' huhifadhi usemi rasmi wa agano wa Kiebrania.
- source_word: חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  rationale: Huu ni usemi wa kisheria wa Torati. 'Sheria ya kudumu' ni ya kueleweka na hudumisha maana ya wajibu unaoendelea bila kulazimisha dhana ya kifalsafa ya kutokuwa na mwisho.
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Usemi huu unaonyesha kwamba sheria hiyo inaendelea kutumika katika vizazi vinavyofuatana.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; 'Yahweh' huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya עוֹלָם katika sheria ya kikuhani
  choice: sheria ya kudumu
  alternative: sheria ya milele
  rationale: '''Ya kudumu'' hudumisha uzito wa kisheria wa wajibu unaoendelea katika vizazi vya Israeli, huku ikiepuka kuongeza madai ya kiteolojia yasiyoamuliwa na aya yenyewe.'
- issue: Mtendaji wa tendo la kutia mafuta
  choice: Yahweh ndiye anayewatia mafuta
  alternative: walipotiwa mafuta
  rationale: Kiambishi cha nafsi ya tatu umoja katika מָשְׁחוֹ kwa kawaida humrejelea Yahweh, ambaye ndiye kiima cha kitenzi kilichotangulia; tafsiri hai inahifadhi muundo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishazi rejeshi umehifadhi uhusiano wake na aya iliyotangulia, na istilahi za kisheria zimewekwa wazi bila kuingiza msimamo wa kimadhehebu.
