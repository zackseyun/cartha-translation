  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: sw
  text: Na kila sadaka ya nafaka iliyookwa katika tanuru, na kila iliyotayarishwa katika sufuria yenye kina au juu ya kikaango bapa[a], itakuwa ya kuhani anayeitoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika chombo kirefu cha kupikia au juu ya chombo bapa cha kupikia.” Huenda maneno haya mawili ya Kiebrania yanataja aina tofauti za vyombo vya kupikia, lakini maumbo yake halisi hayajulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa sheria za dhabihu katika Mambo ya Walawi, neno hili linamaanisha sadaka ya mazao ya nafaka, si zawadi au sadaka ya jumla.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: iliyookwa katika tanuru
  rationale: Kauli tendwa ya kitenzi אפה imehifadhiwa kwa “iliyookwa,” na “tanuru” ni neno la kawaida na lenye hadhi kwa chombo hiki cha kuokea.
- source_word: נַעֲשָׂה
  choice: iliyotayarishwa
  rationale: Kitenzi עשה kina maana pana ya kufanywa; katika muktadha wa chakula, “iliyotayarishwa” ni ya asili bila kubainisha kupita kiasi namna ya kupika.
- source_word: מַרְחֶשֶׁת
  choice: sufuria yenye kina
  rationale: Neno hili huenda linataja chombo cha kupikia chenye kina zaidi kuliko מַחֲבַת. Tafsiri hii inadumisha tofauti inayowezekana kati ya vyombo hivyo viwili.
- source_word: מַחֲבַת
  choice: kikaango bapa
  rationale: Neno hili kwa kawaida hueleweka kuwa chombo au sehemu bapa ya kupikia; “kikaango bapa” ni wazi kwa msomaji wa kisasa, huku tanbihi ikihifadhi kutokuwa na uhakika wa aina halisi ya chombo.
- source_word: לַכֹּהֵן ... לוֹ תִהְיֶה
  choice: itakuwa ya kuhani
  rationale: Muundo huu unaonyesha umilikaji au mgao wa kisheria. Kiswahili hiki ni cha kawaida na kinadumisha maana ya kuwa sehemu ya kuhani husika.
- source_word: הַמַּקְרִיב אֹתָהּ
  choice: anayeitoa
  rationale: Katika ibada ya dhabihu, Hiphil ya קרב humaanisha kuwasilisha au kutoa sadaka. “Anayeitoa” ni fupi, ya asili, na inaeleweka kuwa inarejelea sadaka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sheria ya ibada ulio wazi na wenye hadhi. “Sadaka ya nafaka” ni istilahi inayoeleweka katika muktadha wa Walawi. Tofauti inayowezekana kati ya vyombo viwili vya kupikia imeonyeshwa katika matini, huku tanbihi ikidumisha kutokuwa na uhakika wa kileksika.
