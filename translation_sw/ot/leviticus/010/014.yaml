id: LEV.10.14
reference: Leviticus 10:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: sw
  text: Nawe, pamoja na wanao na binti zako, mtakula kidari cha sadaka ya kutikiswa[a] na paja la sadaka iliyoinuliwa[b] mahali safi, kwa maana vimetolewa kuwa fungu lako na fungu la wanao kutoka katika dhabihu za sadaka za amani za wana wa Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kidari cha sadaka ya kuwasilishwa.” Neno la Kiebrania hutaja sehemu iliyotikiswa kwa ibada mbele za BWANA.
    reason: lexical_alternative
  - marker: b
    text: Au, “paja la mchango.” Neno la Kiebrania hutaja kitu kilichoinuliwa au kutengwa kuwa sehemu inayowastahili makuhani.
    reason: lexical_alternative
  - marker: c
    text: “Sadaka za amani” zinaweza pia kutafsiriwa “sadaka za ushirika”; neno la Kiebrania linaweza kuwa na maana pana ya amani, ukamilifu au hali njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: kidari cha sadaka ya kutikiswa
  rationale: חֲזֶה ni sehemu ya kifua/kidari cha mnyama, na תְּנוּפָה ni tendo la ibada la kutikisa au kuwasilisha sadaka mbele za BWANA. “Kidari” linafaa kwa sehemu ya nyama, na “sadaka ya kutikiswa” linahifadhi picha ya tendo la Kiebrania.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: paja la sadaka iliyoinuliwa
  rationale: שׁוֹק ni paja au sehemu ya juu ya mguu; תְּרוּמָה hutaja kitu kilichoinuliwa au kutengwa kuwa sehemu ya kikuhani. Tafsiri hii inadumisha taswira ya neno la asili bila kuifafanua kupita kiasi.
- source_word: תֹּאכְלוּ
  choice: mtakula
  rationale: Kauli hii ya wakati usiotimilika ina nguvu ya agizo katika sheria hii. Kiswahili “mtakula” huwasilisha agizo hilo kwa kawaida.
- source_word: בְּמָקוֹם טָהוֹר
  choice: mahali safi
  rationale: טָהוֹר katika Walawi huhusu usafi wa kiibada. “Mahali safi” ni fupi na ya kawaida, huku muktadha ukibeba maana ya kiibada.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: nawe, pamoja na wanao na binti zako
  rationale: Tafsiri inataja wazi wana na binti kama ilivyo katika Kiebrania. “Pamoja na” huwasilisha אִתָּךְ kwa Kiswahili cha kawaida bila marudio mazito.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: fungu lako na fungu la wanao
  rationale: חֹק hapa ni sehemu iliyowekwa na kupewa makuhani, si amri au sheria yenyewe. “Fungu” huwasilisha mgao huo kwa uwazi.
- source_word: נִתְּנוּ
  choice: vimetolewa
  rationale: Kauli timilifu tendwa inaonyesha kwamba mafungu hayo yamekwisha kupewa na yanaendelea kuwa haki yao.
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: kutoka katika dhabihu za sadaka za amani
  rationale: שְׁלָמִים lina uwanja mpana wa maana unaohusiana na amani, ukamilifu na hali njema. “Sadaka za amani” huhifadhi upana huo kuliko “sadaka za ushirika,” ambayo ni tafsiri yenye ufafanuzi zaidi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inadumisha usemi rasmi wa Kiebrania wa uhusiano wa kifamilia, ambao hapa unalitaja taifa la Israeli kwa ujumla.
theological_decisions:
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: “Sadaka za amani” hudumisha maana pana ya amani, ukamilifu na hali njema; “sadaka za ushirika” inaweza kuibana maana hiyo hadi wazo la ushirika pekee.
- issue: Usemi wa kitaifa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi rasmi wa asili unahifadhiwa bila kudai kwamba rejeo la kijamii linawahusu wanaume pekee; katika muktadha huu ni jina la pamoja la watu wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa kawaida kwa Kiswahili, huku istilahi za dhabihu na tofauti kati ya wana na binti zikihifadhiwa.
