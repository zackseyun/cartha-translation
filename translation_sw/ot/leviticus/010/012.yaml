  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: sw
  text: 'Kisha Musa akawaambia Aroni na wana wa Aroni waliobaki, Eleazari na Ithamari: “Chukueni sadaka ya nafaka iliyobaki kutoka katika sadaka za Yahwe zinazotolewa kwa moto[a], na mle bila chachu kando ya madhabahu, kwa maana ni takatifu sana.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za chakula za Yahwe.”
    reason: Neno la Kiebrania אִשֵּׁי kwa kawaida huhusishwa na sadaka zinazotolewa kwa moto, lakini katika muktadha wa dhabihu linaweza pia kueleweka kama sadaka za chakula zinazotolewa kwa Mungu.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha Musa akawaambia
  rationale: Kiunganishi cha simulizi kinaendeleza mfuatano wa matukio; “Kisha” ni cha asili katika Kiswahili na “akawaambia” kinaonyesha kwamba Musa aliwahutubia wote waliotajwa.
- source_word: הַנּוֹתָרִים
  choice: wanawe waliobaki
  rationale: Kirai hiki kinawatambulisha Eleazari na Ithamari kuwa wana wa Aroni waliobaki baada ya kifo cha Nadabu na Abihu, bila kuongeza tafsiri yenye mkazo zaidi kama “walionusurika.”
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za dhabihu za Walawi, neno hili linamaanisha sadaka ya nafaka, si sadaka kwa ujumla.
- source_word: הַנּוֹתֶרֶת
  choice: iliyobaki
  rationale: Hueleza sehemu ya sadaka ya nafaka iliyosalia baada ya sehemu iliyotolewa kwa Yahwe.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: kutoka katika sadaka zinazotolewa kwa moto kwa Yahwe
  rationale: Tafsiri hii inadumisha picha ya moto katika אִשֶּׁה bila kudokeza kwamba kila sadaka iliteketezwa kabisa; uwezekano wa maana ya “sadaka za chakula” umewekwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: na mle bila chachu
  rationale: מַצּוֹת hapa hueleza namna sadaka hiyo inavyopaswa kuliwa; Kiswahili hiki ni wazi na cha kawaida.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: kando ya madhabahu
  rationale: Neno אֵצֶל linaonyesha ukaribu; “kando ya” linaendeleza maana hiyo kwa lugha ya kawaida.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Muundo wa Kiebrania ni usemi wa kiwango cha juu kabisa cha utakatifu; “takatifu sana” ni wa asili na haulichanganyi na jina la sehemu ya Patakatifu Zaidi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la agano. “Yahwe” linahifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya אִשֵּׁי katika lugha ya dhabihu
  choice: sadaka zinazotolewa kwa moto
  alternative: sadaka za chakula
  rationale: Chaguo kuu linahifadhi uhusiano wa neno hilo na moto, huku tanbihi ikitaja uwezekano mwingine wa kileksika bila kuficha utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, huku jina Yahwe likihifadhiwa wazi.
