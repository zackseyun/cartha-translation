id: LEV.10.13
reference: Leviticus 10:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: sw
  text: Mtaukula mahali patakatifu, kwa sababu ni fungu lako na fungu la wana wako kutoka katika sadaka za Yahwe zinazotolewa kwa moto[a], kwa maana ndivyo nilivyoamriwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za chakula za Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Mtaukula
  rationale: Kitenzi kinawaelekeza wanaume wengi na kina nguvu ya amri. Muundo huu wa Kiswahili huwasilisha agizo kwa njia ya kawaida na yenye heshima.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: mahali patakatifu
  rationale: Kiebrania hakina kibainishi hapa; tafsiri hii haiwekei usemi huo umahususi usiotajwa, huku ikihifadhi maana ya kiibada ya utakatifu.
- source_word: חָקְךָ ... וְחָק בָּנֶיךָ
  choice: fungu lako na fungu la wana wako
  rationale: Katika muktadha wa kikuhani, חֹק ni sehemu iliyotengewa au haki ya kupokea sehemu ya sadaka. ‘Fungu’ ni wazi na la kawaida. ‘Wana wako’ huhifadhi marejeo mahususi kwa wana wa kiume.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: kutoka katika sadaka za Yahwe zinazotolewa kwa moto
  rationale: Tafsiri hii huhifadhi uhusiano wa אִשֶּׁה na moto bila kudokeza kwamba sadaka yote lazima iteketezwe. Maana mbadala ya kikundi cha sadaka kama ‘sadaka za chakula’ imewekwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa kunukuu jina lenyewe badala ya kulibadilisha kuwa cheo.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: kwa maana ndivyo nilivyoamriwa
  rationale: Huhifadhi kiunganishi cha maelezo, neno ‘ndivyo,’ na hali ya kutendwa ya kitenzi kinachomhusu Musa.
theological_decisions:
- issue: Maana ya חֹק katika mazingira ya sadaka za kikuhani
  choice: fungu
  alternative: haki; sehemu iliyotengewa; amri
  rationale: Muktadha unazungumzia sehemu ya sadaka waliyopewa makuhani, si sheria ya kinadharia tu.
- issue: Tafsiri ya אִשֵּׁי יְהוָה
  choice: sadaka za Yahwe zinazotolewa kwa moto
  alternative: sadaka za chakula za Yahwe
  rationale: Chaguo kuu hudumisha picha ya moto iliyo katika neno la Kiebrania; tanbihi huonyesha uwezekano wa kulielewa kama kundi la sadaka zinazowakilisha chakula cha madhabahu.
- issue: Walengwa wa בָּנֶיךָ
  choice: wana wako
  alternative: watoto wako
  rationale: Kiebrania kinataja wana wa kiume wa Haruni katika wajibu na fungu lao la kikuhani; ‘watoto’ kingepanua maana bila msingi wa moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Sentensi imeweka sauti ya agizo la kikuhani bila kutumia istilahi nzito zisizo za lazima. Alama ya tanbihi [a] iko mara tu baada ya usemi unaohusika.
