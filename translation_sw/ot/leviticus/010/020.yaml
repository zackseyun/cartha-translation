lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia
  rationale: Kitenzi שׁמע hapa kimsingi ni ‘kusikia.’ Muundo huu unaonyesha kwamba Musa alisikia maelezo ya Haruni katika mstari uliotangulia bila kulazimisha maana ya ‘alielewa’ au ‘alikubali,’ ingawa muktadha unaweza kudokeza mwitikio huo.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina משה katika Kiswahili.
- source_word: וַיִּיטַב
  choice: akaona kuwa ni sawa
  rationale: Kitenzi יטב pamoja na msemo unaofuata kinaonyesha kwamba jambo hilo lilionekana kuwa jema, sahihi, au la kukubalika kwa Musa. Tafsiri hii ni ya asili katika Kiswahili na haizidishi maana hadi kusema wazi kwamba alitoa idhini rasmi.
- source_word: בְּעֵינָיו
  choice: akaona
  rationale: Msemo wa Kiebrania ‘machoni pake’ huonyesha tathmini ya mtu. Kiswahili cha kawaida huwasilisha dhana hiyo kwa ‘akaona,’ huku tafsiri halisi ikihifadhiwa katika tanbihi.
