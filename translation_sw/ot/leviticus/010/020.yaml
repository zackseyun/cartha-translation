  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: sw
  text: Musa akasikia, na jambo hilo likawa jema machoni pake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “likawa jema machoni pake”; yaani, lilionekana kuwa sawa au lenye kukubalika kwake.'
