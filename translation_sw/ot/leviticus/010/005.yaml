translation:
  language: sw
  text: Basi wakakaribia, wakawabeba katika kanzu zao hadi nje ya kambi[a], kama Musa alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kanzu zao.” Kihusishi cha Kiebrania kinaweza kuonyesha njia iliyotumiwa; hivyo huenda maana ikawa kwamba waliibeba miili kwa kushika au kutumia kanzu zao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: wakakaribia
  rationale: Kitenzi קרב katika qal kinaonyesha kuwa walielekea karibu na miili; “wakakaribia” ni Kiswahili cha kawaida na hakiongezi maana ya kiibada isiyo wazi hapa.
- source_word: וַיִּשָּׂאֻם
  choice: wakawabeba
  rationale: נשׂא pamoja na kiambishi cha watendewa cha wingi kinawarejelea Nadabu na Abihu. “Wakawabeba” linafaa kwa tendo la kuiondoa miili mahali hapo.
- source_word: בְּכֻתֳּנֹתָם
  choice: wakiwa wamevaa kanzu zao
  rationale: כֻּתֹּנֶת ni vazi refu la ndani au kanzu. Kihusishi ב kinaweza kuonyesha hali (“wakiwa katika kanzu zao”) au njia (“kwa kushika/ kutumia kanzu zao”); maandishi makuu yanatoa maana ya hali, huku tanbihi ikihifadhi uwezekano wa njia.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hadi nje ya kambi
  rationale: Usemi huu unaonyesha mwendo kuelekea eneo lililo nje ya kambi. “Hadi nje ya kambi” ni wa asili katika Kiswahili na huhifadhi mwelekeo na kikomo cha mwendo.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: kama Mose alivyosema
  rationale: Kifungu hiki kinaonyesha kwamba walitenda kulingana na agizo la Mose lililotangulia. “Kama Mose alivyosema” ni cha kawaida na hudumisha ulinganisho wa כַּאֲשֶׁר.
