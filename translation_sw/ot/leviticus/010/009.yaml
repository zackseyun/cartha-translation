id: LEV.10.9
reference: Leviticus 10:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: sw
  text: Wewe na wanao pamoja nawe msinywe divai wala kileo[a] mtakapoingia katika hema la kukutania, msije mkafa[b]. Hili ni agizo la kudumu[c] katika vizazi vyenu vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kinywaji chenye kulevya. Neno la Kiebrania linamaanisha kwa upana kinywaji cha pombe kisicho divai.
    reason: lexical_alternative
  - marker: b
    text: Au, “nanyi hamtakufa.”
    reason: alternative_reading
  - marker: c
    text: Au, “agizo la milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן
  choice: divai
  rationale: Ni neno la kawaida la Kiebrania kwa divai iliyochachushwa kutoka zabibu; “divai” ni tafsiri ya kawaida na iliyo wazi katika Kiswahili.
- source_word: שֵׁכָר
  choice: kileo
  rationale: Neno hili linamaanisha kwa upana kinywaji chenye kulevya kisicho divai. “Kileo” ni cha asili katika Kiswahili na hakikifungi maana kwenye pombe kali zilizotengenezwa kwa kunereka.
- source_word: אַל תֵּשְׁתְּ
  choice: msinywe
  rationale: אַל pamoja na umbo la kitenzi hapa hutoa katazo. Wingi wa “msinywe” unawahusu Haruni na wanawe kama inavyodai sentensi.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: Wewe na wanao pamoja nawe
  rationale: Inahifadhi mtajo wa moja kwa moja wa Haruni, wanawe, na msisitizo wa אִתָּךְ, “pamoja nawe.”
- source_word: בְּבֹאֲכֶם
  choice: mtakapoingia
  rationale: Kiambishi בְּ pamoja na kitenzi-jina kinaonyesha wakati au mazingira ya kuingia; “mtakapoingia” ni ya kawaida na inaweka mpaka wa katazo kwa usahihi.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Ni jina lililozoeleka la mahali patakatifu pa kukutana, na linaendeleza taswira ya hema bila kulifanya jina la pekee lisiloeleweka.
- source_word: וְלֹא תָמֻתוּ
  choice: msije mkafa
  rationale: Usemi huu unatoa onyo la matokeo ya kifo yanayopaswa kuepukwa. “Msije mkafa” ni wa asili katika Kiswahili na huhifadhi nguvu ya “lest you die” bila kuzidisha uhusiano wa kisababishi.
- source_word: חֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: Ni fomula ya kisheria kuhusu agizo linaloendelea. “La kudumu” huhifadhi uzito wa muda mrefu bila kulazimisha maana ya kifalsafa ya kutokuwa na mwisho.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Hutoa maana ya kuendelea kutumika kwa vizazi vinavyofuatana; usemi huu ni wazi na wa asili katika Kiswahili.
theological_decisions:
- issue: Nguvu ya kifungu kuhusu kifo
  choice: “msije mkafa” kama onyo la matokeo yanayopaswa kuepukwa
  alternative: “nanyi hamtakufa” au “ili msife”
  rationale: Muundo wa Kiebrania unaweza kusikika kama matokeo yanayoambatana na katazo au kusudi la kinga. Tafsiri kuu inaweka wazi onyo bila kulifanya ahadi ya kimitambo; tanbihi inahifadhi uwezekano wa muundo wa kuratibu.
- issue: Upeo wa katazo
  choice: Katazo linahusu kunywa wakati wa kuingia katika hema la kukutania
  alternative: Katazo la jumla kwa makuhani kunywa wakati wowote
  rationale: Kirai בְּבֹאֲכֶם, “mtakapoingia,” kinaweka wazi mazingira ya katazo. Tafsiri haiongezi fundisho la kujiepusha kabisa na pombe katika kila hali.
- issue: Muda wa agizo
  choice: “agizo la kudumu”
  alternative: “agizo la milele”
  rationale: עוֹלָם katika fomula hii huonyesha uendelevu wa agizo kwa vizazi. “La kudumu” huhifadhi nguvu hiyo huku tanbihi ikionyesha tafsiri nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na wa kisheria bila kuwa wa kizamani. “Kileo” limechaguliwa badala ya “kinywaji kikali” ili kuepuka dhana finyu ya pombe iliyotengenezwa kwa kunereka. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na maneno yanayohusika.
