  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: sw
  text: Tazama, damu yake haikuletwa katika sehemu ya ndani ya mahali patakatifu.[a] Hakika mlipaswa kuila mahali patakatifu,[b] kama nilivyoamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani ya mahali patakatifu.” Kiebrania hutumia neno la eneo takatifu pamoja na neno “ndani,” likisisitiza sehemu ya ndani ya eneo hilo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinarudia wazo la kula kwa muundo wa kusisitiza, yaani, “mlipaswa kabisa kuila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa msisitizo. “Tazama” ni la heshima na linaeleweka katika Kiswahili cha kawaida.
- source_word: הוּבָא
  choice: haikuletwa
  rationale: Umbo la Hofali la בוא linaonyesha tendo la kusababisha kuingia katika hali ya kutendwa; “haikuletwa” linawasilisha kwa uwazi hali hiyo ya kutendwa.
- source_word: דָּמָהּ
  choice: damu yake
  rationale: Kiambishi cha nafsi ya kike kinarejelea mnyama wa sadaka ya dhambi; Kiswahili hutumia kwa kawaida “damu yake” bila kulazimika kubainisha jinsia.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: ndani ya patakatifu
  rationale: Kifungu hiki kinaonyesha kuingia katika eneo takatifu la ndani. “Ndani ya patakatifu” huhifadhi wazo la kuelekea ndani bila kufafanua zaidi ya Kiebrania.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: Hakika mlipaswa kuila
  rationale: Nomino-kitenzi isiyo na kikomo ikifuatiwa na kitenzi husisitiza tendo. Kwa kuwa Musa anakemea jambo ambalo halikufanywa, “Hakika mlipaswa kuila” huonyesha msisitizo na wajibu wa wakati uliopita.
- source_word: אֹתָהּ
  choice: ku(i)la
  rationale: Kiwakilishi cha yambwa kinarejelea sadaka au nyama yake; kiambishi “-i-” katika “kuila” kinatosha kwa muktadha.
- source_word: בַּקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Hapa panatajwa mahali palipotengwa ambapo makuhani walipaswa kula sadaka. “Mahali patakatifu” ni wazi na la kawaida katika Kiswahili.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: kama nilivyoamuru
  rationale: Hiki ni kifungu cha kulinganisha kinachorejelea agizo la Musa la awali; tafsiri hii ni ya moja kwa moja na ya asili.
theological_decisions:
- issue: Istilahi ya maeneo ya ibada
  choice: Kutofautisha “ndani ya patakatifu” ambako damu haikuletwa na “mahali patakatifu” ambapo sadaka ilipaswa kuliwa.
  alternative: Kutafsiri maneno yote mawili kwa namna ileile, “mahali patakatifu,” au kulifafanua la kwanza kuwa “ndani ya pazia.”
  rationale: Kiebrania kinatumia semi zinazohusiana lakini zisizofanana. Ya kwanza inaonyesha mwendo wa kuelekea eneo takatifu la ndani, ilhali ya pili inaonyesha mahali patakatifu pa kulia. Tofauti hii huhifadhi mantiki ya taratibu za sadaka bila kuongeza maelezo yasiyokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Patakatifu” limetumiwa kwa eneo la ndani la ibada, huku “mahali patakatifu” likitumiwa kwa mahali pa kula sadaka. Muundo wa sentensi umehifadhi ukemeo wa Musa na msisitizo wa amri.
