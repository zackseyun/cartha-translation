  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: sw
  text: Nanyi msitoke mlangoni pa Hema la Mkutano, msije mkafa, kwa sababu mafuta ya upako ya Yahweh yako juu yenu. Nao wakafanya kulingana na neno la Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/פֶּתַח
  choice: Nanyi ... kwenye ingilio
  rationale: Kiunganishi וּ kinaendeleza maagizo yaliyotangulia, huku מִן ikionyesha mahali ambapo hawapaswi kuondoka. “Ingilio” linaonyesha פֶּתַח kwa uwazi na kwa Kiswahili cha sasa.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Mkutano
  rationale: Hili ni jina maalumu la hema la patakatifu ambako Yahwe alikutana na Israeli; tafsiri hii ni sahihi na imezoeleka katika lugha ya kibiblia ya Kiswahili.
- source_word: לֹא תֵצְאוּ
  choice: msitoke
  rationale: Umbo hili la kukataza linaonyesha agizo la moja kwa moja kwa watu wengi, kwa lugha ya kawaida na yenye uzito.
- source_word: פֶּן תָּמֻתוּ
  choice: msije mkafa
  rationale: “Msije mkafa” huhifadhi onyo linaloletwa na פֶּן bila kuligeuza kimya kimya kuwa kauli ya matokeo yasiyoepukika.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: mafuta ya upako ya Yahwe
  rationale: Usemi huu huhifadhi wazo la mafuta matakatifu ya kuweka wakfu yanayohusishwa na Yahwe, bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: עֲלֵי/כֶם
  choice: yako juu yenu
  rationale: Tafsiri hii inafuata picha halisi ya mafuta kuwa juu yao kama waliotiwa mafuta na kuwekwa wakfu.
- source_word: וַ/יַּעֲשׂוּ
  choice: Nao wakafanya
  rationale: “Nao” linaendeleza simulizi, na “wakafanya” linaonyesha kwa ufupi kwamba walitekeleza agizo.
- source_word: כִּ/דְבַר מֹשֶׁה
  choice: kulingana na neno la Musa
  rationale: Tafsiri hii inahifadhi maana ya kutenda kwa kufuata agizo lililonenwa na Musa na iko karibu na muundo wa Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Sababu ya kutokutoka katika ingilio la Hema
  choice: Mafuta ya upako ya Yahwe yako juu yao
  alternative: Wamewekwa wakfu kwa Yahwe
  rationale: Tafsiri inahifadhi taswira halisi ya mafuta kuwa juu yao. Haibadili taswira hiyo kuwa ufafanuzi wa kitheolojia pekee, ingawa kuwekwa wakfu kunadokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni wazi kwa msomaji wa kawaida huku ikihifadhi uzito wa agizo la kikuhani na taswira ya Kiebrania.
