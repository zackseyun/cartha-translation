  to: Nanyi msitoke mlangoni pa Hema la Mkutano, msije mkafa, kwa sababu mafuta ya upako ya Yahweh yako juu yenu. Nao wakafanya kulingana na neno la Musa.
  rationale: The revision replaces the locative/directional “kwenye ingilio” with the idiomatic “mlangoni pa,” which accurately represents not going out from the entrance of the Tent of Meeting. It standardizes the transliteration Yahweh and removes unmatched punctuation, without adding interpretation or altering the warning’s contingent force.
