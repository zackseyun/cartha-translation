base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: sw
  text: Musa akamtafuta kwa bidii yule mbuzi wa sadaka ya dhambi[a], na kumbe alikuwa ameteketezwa[b]. Basi akawakasirikia Eleazari na Ithamari, wana wa Haruni waliobaki[c], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtafuta tena na tena yule mbuzi wa sadaka ya dhambi.” Kiebrania kinarudia mzizi wa kitenzi kwa muundo unaosisitiza tendo hilo.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa amechomwa kabisa.” Kiebrania kinaonyesha kwamba mbuzi alikutwa akiwa ameteketezwa.
    reason: lexical_alternative
  - marker: c
    text: “Wana wa Haruni waliobaki” ni Eleazari na Ithamari, waliobaki baada ya Nadabu na Abihu kufa (Law. 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: yule mbuzi wa sadaka ya dhambi
  rationale: “Mbuzi” ni neno la kawaida na linaloeleweka kwa mnyama huyu, huku “wa sadaka ya dhambi” likihifadhi aina maalumu ya dhabihu. Kionyeshi “yule” kinaonyesha kwamba ni mbuzi maalumu anayejulikana katika muktadha.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: akamtafuta kwa bidii
  rationale: Muundo wa kitenzi pamoja na infinitive absolute unasisitiza utafutaji. “Kwa bidii” huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila kurudia kitenzi kwa namna isiyo ya kawaida.
- source_word: וְהִנֵּה
  choice: na kumbe
  rationale: “Kumbe” huonyesha ugunduzi wa jambo lisilotarajiwa na hivyo kuwasilisha nguvu ya kisimulizi ya הִנֵּה kwa Kiswahili cha sasa.
- source_word: שֹׂרָף
  choice: alikuwa ameteketezwa
  rationale: Umbo hili linaonyesha hali ambayo mbuzi alikutwa nayo baada ya kuchomwa. “Ameteketezwa” hudokeza kuchomwa hadi kuangamia bila kuongeza maelezo yasiyo katika chanzo.
- source_word: וַיִּקְצֹף
  choice: akawakasirikia
  rationale: Tafsiri hii huonyesha hasira ya Musa dhidi ya Eleazari na Ithamari kwa kiwango kinacholingana na kitenzi cha Kiebrania bila kuzidisha ukali wake.
- source_word: הַנּוֹתָרִם
  choice: waliobaki
  rationale: Neno hili linawatambulisha Eleazari na Ithamari kuwa wana wa Haruni waliobaki baada ya vifo vya Nadabu na Abihu, huku likiepuka kuongeza ufafanuzi huo ndani ya mstari.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Huu ni utangulizi wa moja kwa moja wa maneno yanayofuata katika mstari unaofuata na huhifadhi muunganiko wa kisintaksia wa chanzo.
