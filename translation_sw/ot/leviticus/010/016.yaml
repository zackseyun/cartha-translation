translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa heshima lakini wa kawaida. “Kumbe” limetumiwa badala ya neno la kale zaidi kama “tazama” ili kuonyesha ugunduzi wa ghafla kwa lugha ya sasa. Majina yametolewa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili.
