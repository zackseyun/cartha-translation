reference: Leviticus 10:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: sw
  text: Haruni akamwambia Musa, “Tazama, leo wametoa sadaka yao ya dhambi[a] na sadaka yao ya kuteketezwa mbele za Yahwe, na mambo kama haya yamenipata[b]. Kama ningekula sadaka ya dhambi leo, je, hilo lingekuwa jema machoni pa Yahwe[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka yao ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha dhambi au sadaka inayohusiana na kutakaswa kutokana na dhambi au unajisi. Hapa linamaanisha sadaka; vivyo hivyo katika sehemu ya pili ya aya.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “na mambo kama haya yamenipata.” Haruni anarejelea misiba ya siku hiyo, hasa vifo vya wanawe.
    reason: cultural_note
  - marker: c
    text: Au “je, hilo lingempendeza Yahwe?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni neno la kuvuta uangalifu linaloanzisha maelezo ya Haruni; “Tazama” lina uzito unaofaa na linaeleweka katika Kiswahili sanifu.
- source_word: הִקְרִיבוּ
  choice: wametoa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuleta au kutoa sadaka mbele za Mungu; “wametoa” ni usemi wa kawaida na wazi.
- source_word: חַטָּאתָם / חַטָּאת
  choice: sadaka yao ya dhambi / sadaka ya dhambi
  rationale: Hapa חַטָּאת linamaanisha dhabihu inayohusiana na dhambi au utakaso, si dhambi kama dhana tu. “Sadaka ya dhambi” ni tafsiri iliyozoeleka na iliyo wazi.
- source_word: עֹלָתָם
  choice: sadaka yao ya kuteketezwa
  rationale: Neno hili humaanisha sadaka iliyoteketezwa; tafsiri hii ni ya kawaida katika lugha ya kibiblia ya Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Inahifadhi usemi wa ibada unaoonyesha kuletwa kwa sadaka katika uwepo wa Yahwe.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: na mambo kama haya yamenipata
  rationale: Usemi huu unarejelea misiba ya siku hiyo bila kuitaja kwa undani; tafsiri inabaki karibu na maana ya Kiebrania na ni ya asili kwa Kiswahili.
- source_word: וְאָכַלְתִּי
  choice: Kama ningekula
  rationale: Ingawa muundo wake ni waw pamoja na kitenzi timilifu, katika hoja hii una nguvu ya hali ya kudhaniwa inayoongoza kwenye swali la balagha.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: je, hilo lingekuwa jema machoni pa Yahwe?
  rationale: Inahifadhi sitiari ya Kiebrania ya kuwa “jema machoni” huku ikionyesha swali kuhusu kukubaliwa na Mungu.
theological_decisions:
- issue: Sababu ya Haruni kutokula sadaka ya dhambi
  choice: Haruni anauliza kama kula sadaka baada ya mambo yaliyompata siku hiyo kungekuwa jambo jema machoni pa Yahwe.
  alternative: Haruni anaweza kuwa akizungumzia huzuni yake binafsi, hali yake ya kiibada, au kufaa kwa tendo hilo kwa upana zaidi.
  rationale: Kiebrania hakisemi wazi kama hoja kuu ni maombolezo, hali ya kiibada, au sababu nyingine ya kufaa. Tafsiri inadumisha mvutano huo bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Tazama” na “machoni pa” hudumisha uzito na taswira ya Kiebrania bila kutumia lugha ya kizamani kupita kiasi.
