id: LEV.10.10
reference: Leviticus 10:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: sw
  text: na ili mpate kutofautisha kati ya kilicho kitakatifu na kilicho cha kawaida[a], na kati ya kilicho najisi na kilicho safi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilicho kitakatifu na kisicho kitakatifu.” Tofauti ya Kiebrania ni kati ya kile kilichowekwa wakfu kuwa kitakatifu na kile ambacho si kitakatifu; “cha kawaida” hapa hakimaanishi kuwa kitu hicho ni kiovu au kinadharau mambo matakatifu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kati ya kilicho najisi kiibada na kilicho safi kiibada.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: na ili mpate kutofautisha
  rationale: Kiunganishi na umbo la kusudi yanaendeleza wazo la mstari uliotangulia. “Mpate kutofautisha” huonyesha uwezo na wajibu wa makuhani wa kutambua tofauti za makundi haya.
- source_word: בֵּין
  choice: kati ya
  rationale: Kirai hiki kinaonyesha tofauti kati ya makundi mawili yanayotajwa kwa jozi, na kimerudiwa kwa ulinganifu kama katika Kiebrania.
- source_word: הַקֹּדֶשׁ
  choice: kilicho kitakatifu
  rationale: Neno linamaanisha kundi la vitu au mambo yaliyowekwa wakfu; umbo hili haliongezi kitu mahususi ambacho hakikutajwa katika chanzo.
- source_word: הַחֹל
  choice: kilicho cha kawaida
  rationale: Katika lugha ya kikuhani, hili ni kundi lisilo takatifu, si lazima jambo ovu au lenye dharau. “Cha kawaida” linaeleza utofauti huo kwa Kiswahili cha sasa.
- source_word: הַטָּמֵא
  choice: kilicho najisi
  rationale: “Najisi” ni istilahi inayotambulika kwa hali ya kutokuwa safi kiibada katika Walawi, bila kuifanya hali hiyo iwe sawa moja kwa moja na uovu wa kimaadili.
- source_word: הַטָּהוֹר
  choice: kilicho safi
  rationale: “Safi” ni kinyume cha asili cha “najisi” na hapa kinaonyesha hali ya usafi wa kiibada.
theological_decisions:
- issue: Tofauti ya kikuhani kati ya חֹל na קֹדֶשׁ
  choice: kilicho kitakatifu na kilicho cha kawaida
  alternative: kilicho kitakatifu na kilicho cha kidunia; kilicho kitakatifu na kisicho kitakatifu
  rationale: “Cha kawaida” huhifadhi wazo la kisichowekwa wakfu bila kudokeza lazima kufuru, dharau, au uovu. Tanbihi inaweka wazi maana ya msingi.
- issue: Hali zinazowakilishwa na טָמֵא / טָהוֹר
  choice: kilicho najisi na kilicho safi, kama makundi ya kiibada
  alternative: kilicho kichafu na kilicho safi; kilicho najisi na kilicho tohara
  rationale: Muktadha wa Walawi unahusu hasa hali ya kiibada. Chaguo hili huepuka kudokeza kuwa kila unajisi ni hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa jozi na marudio ya “kati ya” umehifadhiwa. Mwanzo “na ili” unaonyesha wazi kuwa mstari huu unaendeleza sentensi na kusudi la mstari uliotangulia.
