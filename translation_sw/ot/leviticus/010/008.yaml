lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akazungumza
  rationale: Waw-consecutive inaendeleza simulizi; “kisha” ni ya asili katika Kiswahili, na “akazungumza” hutofautisha דִּבֵּר na לֵאמֹר inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kwa umbo la kawaida la Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, muundo wa kawaida ni “kuzungumza na mtu,” hivyo “na” humtambulisha anayeelekezewa maneno kwa ufasaha.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika Kiswahili sanifu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki hutanguliza yaliyomo katika usemi; “akisema” huhifadhi muundo rasmi wa utangulizi wa maneno ya Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni yenyewe. “Yahwe” huhifadhi jina binafsi la Mungu na ni utohozi wa kawaida wa Kiswahili; tanbihi inataja umbo jingine linalotumiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kisha” huendeleza simulizi kwa kawaida; “akazungumza ... akisema” huhifadhi fomula ya Kiebrania bila kuifanya kuwa ngumu kupita kiasi.
