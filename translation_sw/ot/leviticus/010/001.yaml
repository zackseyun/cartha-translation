id: LEV.10.1
reference: Leviticus 10:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: sw
  text: Kisha Nadabu na Abihu, wana wa Aroni, kila mmoja akachukua chetezo chake, akatia moto ndani yake, na akaweka uvumba juu yake. Wakatoa mbele za Yahwe moto usioruhusiwa[a], ambao Yahwe hakuwa amewaamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moto mgeni” au “moto wa ajabu.” Neno la Kiebrania hapa linamaanisha moto ambao haukuruhusiwa, kama kishazi kinachofuata kinavyoeleza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Kitenzi cha kawaida לָקַח katika mfululizo wa simulizi; “wakachukua” ni Kiswahili cha asili na hudumisha ufuatano wa matendo.
- source_word: בְנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Huwakilisha moja kwa moja muundo wa umilikaji wa Kiebrania na ni usemi wa kawaida wa Kiswahili.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadabu na Abihu
  rationale: Majina yamenukuliwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: kila mmoja akachukua chetezo chake
  rationale: אִישׁ ina maana ya kugawanya tendo kwa kila mtu, na מַחְתָּה ni chombo cha kubebea makaa au kufukizia uvumba; “chetezo” ni neno fupi na linaloeleweka katika muktadha wa ibada.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: akatia moto ndani yake
  rationale: Umoja wa kugawanya unafuata “kila mmoja” na “chetezo chake,” huku ukidumisha maana ya kuweka moto ndani ya chombo.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: na kuweka uvumba juu yake
  rationale: Kiambishi cha Kiebrania ni cha umoja wa kike na kinaelekea kurejelea chetezo cha kila mmoja; “uvumba” ni neno la kawaida kwa קְטֹרֶת.
- source_word: וַיַּקְרִבוּ
  choice: wakatoa
  rationale: Hifili ya קרב katika muktadha wa ibada humaanisha kuleta au kutoa kitu mbele za Mungu; “wakatoa” hudumisha maana ya tendo la ibada bila kuongeza maelezo yasiyomo.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huu ni usemi wa kawaida wa eneo au uwepo katika ibada, huku jina la agano יהוה likitolewa kama “Yahwe.”
- source_word: אֵשׁ זָרָה
  choice: moto usioruhusiwa
  rationale: Katika muktadha wa kikuhani, זָרָה huonyesha kitu kisichokubalika au kisichoidhinishwa katika mipaka ya ibada; kishazi kinachofuata kinaeleza kwamba Mungu hakuwa ameuamuru.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: ambao hakuwa amewaamuru
  rationale: Huhifadhi kishazi elezi na kiambishi cha wazi cha “wao” katika Kiebrania; “ambao” kinarejelea moto.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya אֵשׁ זָרָה
  choice: moto usioruhusiwa
  alternative: moto wa ajabu; moto mgeni
  rationale: Kishazi kinachofuata kinaonyesha kwamba kosa lilikuwa kutoa moto ambao Mungu hakuwa amewaamuru. Tafsiri hii huonyesha nguvu ya kisheria na kiibada bila kudai sababu nyingine ya hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili mfululizo wa matendo usomeke kwa urahisi. Umoja wa “kila mmoja … chake … yake” hudumisha mgawanyo wa tendo, kisha wingi unarudi katika tendo lao la pamoja.
