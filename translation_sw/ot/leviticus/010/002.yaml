review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew narrative sequence: fire came out, consumed Nadab and Abihu, and they died. It also appropriately retains the simple intransitive sense of וַיָּמֻתוּ, rather than introducing “were killed.”'
  naturalness: “Mbele za Yahweh” is not idiomatic with a singular proper name in Standard East African Swahili. The natural construction is “mbele ya Yahweh.” Removing the added discourse particle “Ndipo” also gives a closer, clean narrative rendering of the Hebrew wayyiqtol sequence.
  terminology: “Yahweh,” “moto,” and “ukawateketeza” are suitable and clear. “Kutoka mbele ya Yahweh” preserves the source’s spatial/presence expression without overexplaining it.
  issues:
  - severity: medium
    issue: Nonstandard possessive concord in “mbele za Yahweh.”
    rationale: With the singular name “Yahweh,” Standard East African Swahili uses “mbele ya Yahweh,” not “mbele za Yahweh.” The correction is needed in both occurrences.
  - severity: low
    issue: “Ndipo” adds an unnecessary discourse emphasis.
    rationale: Although not a serious meaning change, the Hebrew simply advances the narrative. “Moto ukatoka” is more direct and closely reflects the source.
  revised_text: Moto ukatoka mbele ya Yahweh, ukawateketeza, nao wakafa mbele ya Yahweh.
