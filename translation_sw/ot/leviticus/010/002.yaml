reference: Leviticus 10:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: sw
  text: Moto ukatoka mbele ya Yahweh, ukawateketeza, nao wakafa mbele ya Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: ukatoka
  rationale: Kauli ya mfululizo wa simulizi kutoka katika יצא inaeleza tukio lililofuata; “ukatoka” ni ya kawaida na huhifadhi wazo la moto kutoka mahali pa uwepo wa Mungu.
- source_word: אֵשׁ
  choice: moto
  rationale: Nomino hii hapa humaanisha moto halisi uliotekeleza hukumu ya papo hapo.
- source_word: מִלִּפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Kirai hiki kwa halisi kina wazo la kutoka mbele ya uso au uwepo wa Yahweh. “Mbele za Yahweh” huhifadhi nahau ya Kiebrania na uhusiano wake wa mahali bila kuifafanua kupita kiasi.
- source_word: וַתֹּאכַל
  choice: ukawateketeza
  rationale: Ingawa אכל kwa msingi ni “kula,” moto unapokuwa kiima Kiswahili cha kawaida hutumia “teketeza,” kinachoonyesha uharibifu mkali bila nahau isiyo ya kawaida.
- source_word: אֹתָם
  choice: wa-
  rationale: Kiambishi cha yambwa katika “ukawateketeza” kinawarejelea Nadabu na Abihu kama inavyobainishwa na muktadha wa karibu.
- source_word: וַיָּמֻתוּ
  choice: nao wakafa
  rationale: Kitenzi ni cha hali tendi kisicho na yambwa, “walikufa.” Tafsiri hii haisemi “waliuawa,” kwa kuwa kishazi kilichotangulia tayari kinaonyesha chanzo cha kifo.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi marudio yenye uzito ya kirai cha mahali na kitheolojia kilicho katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano YHWH; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Iwapo וַיָּמֻתוּ itafsiriwe kwa kauli ya kutendwa yenye kisababisho
  choice: wakafa
  alternative: waliuawa
  rationale: Kiebrania kina kitenzi tendi kisicho na yambwa, “walikufa”; sababu tayari imeelezwa na moto uliowateketeza, hivyo hakuna haja ya kuongeza kauli ya kutendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “mbele za Yahweh” umechaguliwa ili kuhifadhi nahau na marudio ya Kiebrania; hakuna alama ya tanbihi kwa kuwa hakuna tanbihi inayohitajika katika rasimu hii.
