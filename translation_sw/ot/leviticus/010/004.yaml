  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל מִֽישָׁאֵל֙ וְ/אֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם קִ֠רְב֞וּ שְׂא֤וּ אֶת אֲחֵי/כֶם֙ מֵ/אֵ֣ת פְּנֵי הַ/קֹּ֔דֶשׁ אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: sw
  text: Kisha Musa akawaita Mishaeli na Elisafani, wana wa Uzieli, mjomba wa Haruni, akawaambia, “Karibieni, wabebeni ndugu zenu[a] kutoka mbele ya mahali patakatifu[b], mkawapeleke nje ya kambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “ndugu zenu” linaweza pia kumaanisha jamaa wa karibu wa kiume; hapa linawahusu Nadabu na Abihu, ambao walikuwa binamu zao.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka mbele ya patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika simulizi hili, קרא humaanisha kuwaita watu fulani; ‘akawaita’ ni Kiswahili cha kawaida na huhifadhi mwendelezo wa masimulizi.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: wana wa Uzieli
  rationale: Kirai hiki kinawatambulisha Mishaeli na Elisafani moja kwa moja kuwa wana wa Uzieli, si wazao wake kwa maana pana.
- source_word: דֹּד אַהֲרֹן
  choice: mjomba wa Haruni
  rationale: דּוֹד katika muktadha huu wa ukoo humaanisha mjomba; kirai hicho kinamhusu Uzieli, ambaye ni mjomba wa Haruni.
- source_word: קִרְבוּ
  choice: Karibieni
  rationale: Amri ya קרב ina maana ya kuja karibu au kukaribia; ‘Karibieni’ ni ya asili na huhifadhi wazo la kusogea mahali patakatifu.
- source_word: שְׂאוּ
  choice: wabebeni
  rationale: נשא humaanisha kuinua, kubeba au kuchukua. Katika muktadha huu wanapaswa kubeba miili na kuiondoa, hivyo ‘wabebeni’ huhifadhi kitendo halisi bila kuongeza neno ‘miili’ ambalo halipo wazi katika Kiebrania.
- source_word: אֲחֵיכֶם
  choice: ndugu zenu
  rationale: אָח inaweza kumaanisha ndugu wa kiume au jamaa wa karibu. ‘Ndugu zenu’ huhifadhi lugha ya ukoo ya Kiebrania huku tanbihi ikifafanua kuwa hapa ni binamu zao.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: kutoka mbele ya mahali patakatifu
  rationale: פְּנֵי inaonyesha eneo lililo mbele ya kitu, na הַקֹּדֶשׁ hapa hutaja eneo takatifu. Tafsiri hii ni rasmi lakini inaeleweka kwa urahisi.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: mkawapeleke nje ya kambi
  rationale: Kirai hiki kinaonyesha mwendo kuelekea eneo lililo nje ya kambi. ‘Mkawapeleke’ huonyesha vizuri mwelekeo huo unaofuata tendo la kuwabeba.
theological_decisions:
- issue: Maana pana ya אֲחֵיכֶם katika uhusiano wa kifamilia
  choice: ndugu zenu
  alternative: jamaa zenu / binamu zenu
  rationale: Neno la chanzo hutumia istilahi ya kawaida ya undugu ambayo inaweza kupanuka kuwahusu jamaa wa karibu. Kutafsiri ‘binamu zenu’ kungeondoa upana wa neno la Kiebrania, na ‘jamaa zenu’ kungepunguza taswira yake ya kindugu.
- issue: Utambulisho wa הַקֹּדֶשׁ
  choice: mahali patakatifu
  alternative: patakatifu / maskani takatifu
  rationale: Neno linaweza kutaja mahali au eneo takatifu bila kulazimisha kwa usahihi zaidi ni sehemu gani ya maskani; ‘mahali patakatifu’ huhifadhi upana huo wa kimuktadha.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa masimulizi na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Mishaeli, Elisafani, Uzieli na Haruni. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa, badala ya kuiga nafasi zisizolingana katika safu ya Kiingereza.'
