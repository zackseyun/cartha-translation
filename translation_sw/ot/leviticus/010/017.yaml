base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: sw
  text: “Kwa nini hamkula sadaka ya dhambi[a] mahali patakatifu? Kwa maana sadaka hiyo ni takatifu sana, naye amewapa hiyo ili mbebe uovu wa kusanyiko na kuwafanyia upatanisho mbele za Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayohusiana na kuondoa unajisi na pia kushughulikia dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: Kwa nini hamkula
  rationale: Swali la sababu pamoja na kitenzi timilifu katika muktadha wa karipio linaelezwa kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika muktadha huu neno hilo linamaanisha sadaka, si dhambi pekee. ‘Sadaka ya dhambi’ ni istilahi inayoeleweka kwa urahisi, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Huelekeza kwenye eneo takatifu lililotengwa kwa makuhani kula sadaka hii bila kulifanya kuwa lazima chumba cha ndani cha patakatifu.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Muundo wa Kiebrania unaonyesha kiwango cha juu kabisa cha utakatifu; Kiswahili ‘takatifu sana’ ni cha kawaida na hakichanganyi sadaka na Patakatifu pa Patakatifu.
- source_word: נָתַן לָכֶם
  choice: amewapa ninyi
  rationale: Kitenzi cha nafsi ya tatu umoja kina mhusika asiyeelezwa wazi, ambaye katika muktadha ni Mungu. ‘Ninyi’ inasisitiza walengwa wa wingi waliomo katika kitenzi cha Kiebrania.
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: ili mbebe uovu wa kusanyiko
  rationale: ‘Kubeba uovu’ huhifadhi upana wa נשא עון, unaoweza kuhusisha hatia, uovu, au matokeo yake, bila kuufanya kuwa adhabu pekee.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: kuwafanyia upatanisho
  rationale: Hii ni lugha ya kawaida ya ibada kwa כפר na huhifadhi uzito wa kitheolojia bila kubainisha kwa ziada namna upatanisho unavyofanya kazi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi jina la Mungu lililo katika matini ya Kiebrania na maana ya tendo kufanywa katika uwepo wake.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria ya sadaka
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Muktadha unathibitisha kuwa ni sadaka inayoliwa na makuhani. Tafsiri kuu inayotambulika zaidi imewekwa katika matini, na maana ya utakaso imehifadhiwa katika tanbihi.
- issue: Mhusika wa נָתַן, ‘amewapa’
  choice: naye amewapa ninyi
  alternative: nanyi mmepewa hiyo
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja bila kutaja mhusika. Muktadha unaelekeza kwa Mungu, lakini kiwakilishi kisichotaja jina wazi huhifadhi namna ya chanzo.
- issue: Upeo wa עָוֹן
  choice: uovu
  alternative: hatia
  rationale: ‘Uovu’ hudumisha maana pana ya neno la Kiebrania na mvutano wa ibada kuhusu makuhani kuubeba kwa niaba ya kusanyiko, badala ya kuamua kimya kimya kuwa ni hisia au hali ya hatia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ya swali imehifadhi ukali wa karipio la Musa; istilahi za ibada zimetolewa kwa lugha ya kawaida bila kuondoa utata halisi wa matini.
