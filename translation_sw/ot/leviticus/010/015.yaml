  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: sw
  text: Wataleta paja la mchango[a] na kifua cha sadaka ya kutikiswa[b], pamoja na sadaka za mafuta zinazoteketezwa kwa moto. Paja hilo na kifua hicho watavitingisha mbele za Yahweh[c] kama sadaka ya kutikiswa. Vitakuwa mali yako na ya wanao walio pamoja nawe, kama agizo la kudumu[d], kama Yahweh alivyoamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mguu.” “Mchango” hapa ni sehemu iliyotengwa kwa ajili ya kuhani; kwa mapokeo huitwa pia “sadaka ya kuinuliwa.”
    reason: lexical_alternative
  - marker: b
    text: “Sadaka ya kutikiswa” ni sadaka iliyowasilishwa kwa tendo maalumu la kiibada mbele za Yahweh; inaweza pia kutafsiriwa “sadaka ya kuwasilishwa.”
    reason: cultural_note
  - marker: c
    text: “Yahweh” linawakilisha jina la Mungu lililoandikwa kwa herufi nne za Kiebrania, YHWH.
    reason: lexical_alternative
  - marker: d
    text: “La kudumu” pia linaweza kutafsiriwa “la daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: paja
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha sehemu ya juu ya mguu wa nyuma wa mnyama; “paja” ni sahihi kuliko “mguu” kwa ujumla.
- source_word: תְּרוּמָה
  choice: mchango
  rationale: Neno hili huonyesha sehemu iliyotengwa na kutolewa; “mchango” linaeleweka kwa urahisi, huku tanbihi ikitaja istilahi ya kimapokeo.
- source_word: חָזֶה
  choice: kidari
  rationale: “Kidari” ni neno la kawaida la Kiswahili kwa sehemu ya kifua cha mnyama katika muktadha wa nyama au dhabihu.
- source_word: תְּנוּפָה / לְהָנִיף
  choice: sadaka ya kutikiswa / kuvitikisa
  rationale: Uhusiano wa mzizi mmoja kati ya nomino na kitenzi umehifadhiwa, ukionyesha tendo maalumu la kuiwasilisha sadaka mbele za Mungu.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: pamoja na sehemu za mafuta zinazoteketezwa kwa moto
  rationale: Tafsiri hii inaonyesha kuwa sehemu za mafuta zilikuwa sehemu zinazotolewa kwa moto, na inatumia Kiswahili cha kawaida badala ya istilahi nzito isiyo ya asili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Hii ni njia ya kawaida na yenye heshima ya kueleza tendo la ibada linalofanywa katika uwepo wa Mungu.
- source_word: לְחָק עוֹלָם
  choice: kwa agizo la kudumu
  rationale: “Agizo” huwasilisha sharti lililowekwa, na “la kudumu” huonyesha mwendelezo unaokusudiwa na עוֹלָם bila kulazimisha maana ya kifalsafa ya kutokuwa na mwisho.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: “Yahweh” linawakilisha jina la agano YHWH moja kwa moja badala ya kulibadilisha kuwa cheo.
- issue: Maana ya tendo la תְּנוּפָה
  choice: sadaka ya kutikiswa
  alternative: sadaka ya kuwasilishwa
  rationale: Tafsiri iliyochaguliwa huhifadhi tendo la kiibada linalodokezwa na mzizi wa Kiebrania, bila kulifanya kuwa uwasilishaji wa jumla tu.
- issue: Muda wa חָק עוֹלָם
  choice: agizo la kudumu
  alternative: agizo la milele
  rationale: “La kudumu” huhifadhi nguvu ya sheria endelevu katika utaratibu wa ibada ya Israeli bila kutatua kimbele swali pana la kitheolojia kuhusu upeo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kiebrania imegawanywa ili iwe rahisi kusomeka, lakini mpangilio wa kuleta, kutikisa, na kukabidhi sehemu za kikuhani umehifadhiwa.
