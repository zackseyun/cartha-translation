  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: sw
  text: na kuwafundisha wana wa Israeli sheria zote ambazo Yahweh aliwaambia kwa mkono wa Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kupitia Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הוֹרֹת
  choice: na kuwafundisha
  rationale: Muundo huu unaendeleza wajibu wa makuhani uliotajwa katika mstari uliotangulia. “Kuwafundisha” ni Kiswahili cha kawaida na huwasilisha vizuri maana ya kuelekeza au kufundisha.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: “Wana wa Israeli” huhifadhi taswira ya kifamilia ya Kiebrania na kwa pamoja humaanisha watu wa agano, huku ikiwa usemi unaoeleweka katika Kiswahili cha kibiblia.
- source_word: כָּל הַחֻקִּים
  choice: sheria zote
  rationale: Katika muktadha huu חֻקִּים ni masharti au sheria zilizowekwa. “Sheria” ni neno wazi la Kiswahili lenye uzito unaofaa kwa muktadha wa agano.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: ambazo Yahweh aliwaambia
  rationale: Tafsiri hii hudumisha uhusiano wa kishazi na “sheria” na maana ya kwamba Yahweh alisema mambo hayo kwao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi יהוה linawakilishwa kama jina binafsi “Yahweh,” wala halibadilishwi kuwa cheo.
- source_word: בְּיַד מֹשֶׁה
  choice: kwa mkono wa Musa
  rationale: Usemi huu huhifadhi sitiari ya Kiebrania ya Musa kuwa mpatanishi wa ujumbe. Maana yake ya kawaida zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Uwakilishaji wa jina la agano יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi moja kwa moja bila kuingiza mapokeo ya kulibadili kuwa cheo.
- issue: Uwakilishaji wa בני ישראל kama usemi wa pamoja
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi lugha ya kifamilia ya matini. Katika muktadha huu ni jina la pamoja la watu wa Israeli, si dai kwamba wanaume pekee ndio wanaokusudiwa.
- issue: Uwakala wa Musa katika בְּיַד מֹשֶׁה
  choice: kwa mkono wa Musa
  alternative: kupitia Musa
  rationale: Matini hutumia sitiari ya “mkono” kueleza ujumbe uliotolewa kwa uandalizi wa Musa. Sitiari imehifadhiwa katika matini, huku maana yake ya upatanishi ikifafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Mwanzo wa “na” umehifadhiwa kwa sababu mstari unaendeleza sentensi na wajibu uliotangulia. Usemi “kwa mkono wa Musa” umeachwa kwa makusudi ili kuhifadhi ladha na sitiari ya Kiebrania.
