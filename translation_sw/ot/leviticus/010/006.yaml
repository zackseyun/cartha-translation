base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: sw
  text: Musa akawaambia Aroni pamoja na wanawe Eleazari na Ithamari, “Msiziache nywele zenu zilegee[a], wala msirarue mavazi yenu, msije mkafa, wala asilighadhibikie kusanyiko lote. Lakini ndugu zenu, yaani nyumba yote ya Israeli, wataulilia mwako ambao Yahweh ameuwasha[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msifunue vichwa vyenu,” au, “Msiziache nywele zenu bila kutunzwa.” Kiebrania kinarejelea ishara ya maombolezo iliyohusu kichwa au nywele.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa kufuata maneno ya Kiebrania kwa karibu zaidi: “mwako ambao Yahweh ameuteketeza.” “Ameuwasha” limetumiwa kwa Kiswahili cha kawaida huku tendo hilo likihusishwa moja kwa moja na Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: Msiziachie nywele zenu ovyo
  rationale: Kitenzi פרע hapa kinaelekea kurejelea kuziacha nywele bila kuzifunga au kuzitunza kama ishara ya maombolezo. Tafsiri hii inaeleweka kwa Kiswahili cha sasa bila kulazimisha maana maalumu ya kuondoa kifuniko cha kichwa.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: wala msirarue mavazi yenu
  rationale: פרם humaanisha kurarua mavazi, hasa kama tendo la maombolezo; “kurarua mavazi” ni wazi na ya kawaida katika Kiswahili.
- source_word: וְלֹא תָמֻתוּ
  choice: msije mkafa
  rationale: Muundo huu wa Kiswahili unatoa onyo la matokeo linalolingana na nguvu ya Kiebrania.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: naye akalikasirikia kusanyiko lote
  rationale: Kitenzi ni cha nafsi moja na mhusika wake amedokezwa tu. Kiambishi cha nafsi katika “akalikasirikia” kinadumisha mhusika binafsi bila kutaja jina lisilokuwapo wazi katika kishazi hiki.
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: ndugu zenu, yaani nyumba yote ya Israeli
  rationale: “Ndugu zenu” huhifadhi wingi wa kiume wa Kiebrania, na “yaani” huonyesha kwamba “nyumba yote ya Israeli” ni ufafanuzi wa kundi linalokusudiwa.
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: wataulilia mwako
  rationale: “Mwako” huhifadhi picha halisi ya moto na tendo la kuwaka, badala ya kuifafanua mapema kuwa maafa au hukumu.
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: ambao Yahweh ameuwasha
  rationale: “Ameuwasha” ni Kiswahili cha asili zaidi kuliko kurudia mzizi wa kuungua, huku kikihifadhi kwamba Yahweh ndiye aliyetenda.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Mhusika aliyedokezwa katika יִקְצֹף
  choice: naye akalikasirikia kusanyiko lote
  alternative: ghadhabu ikalijia kusanyiko lote
  rationale: Kiebrania kina kitenzi cha nafsi moja, si nomino “ghadhabu.” Tafsiri iliyochaguliwa inadumisha tendo la mhusika binafsi huku isimwite wazi kwa jina ndani ya kishazi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu; “Yahweh” hulihifadhi badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Ovyo” hapa kina maana ya nywele kuachwa bila kufungwa au kutunzwa, si hukumu ya maadili. “Kusanyiko” limetumiwa kwa עֵדָה ili kuhifadhi maana ya jumuiya ya Israeli iliyokusanyika.
