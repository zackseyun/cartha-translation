base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: sw
  text: 'Ndipo Musa akamwambia Haruni, “Hili ndilo alilosema Yahweh: ‘Miongoni mwa wale wanaonikaribia nitajidhihirisha kuwa mtakatifu[a], na mbele ya watu wote nitatukuzwa[b].’” Naye Haruni akanyamaza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitatambuliwa kuwa mtakatifu na wale wanaonikaribia.” Kiebrania kinaweza kumaanisha kwamba utakatifu wa Mungu utadhihirika au kwamba wanaomkaribia watamtambua na kumtendea kama mtakatifu.
    reason: alternative_reading
  - marker: b
    text: Au, “nitaheshimiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa matamshi ‘Yahweh’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi katika maandishi ya Kiebrania.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Hili ndilo Yahweh alilosema
  rationale: Hii ni kauli ya kawaida na yenye hadhi katika Kiswahili, huku ikihifadhi muundo wa utambulisho wa maneno yaliyotangulia kutoka kwa Yahweh.
- source_word: בִּקְרֹבַי
  choice: Miongoni mwa wale wanaonikaribia
  rationale: Kirai hiki kinadokeza walio karibu na Mungu, hasa wanaomkaribia katika ibada au huduma, bila kukifupisha kiufafanuzi kuwa ‘makuhani’ pekee.
- source_word: אֶקָּדֵשׁ
  choice: nitajidhihirisha kuwa mtakatifu
  rationale: Kauli hii inaeleza utakatifu wa Mungu kudhihirika miongoni mwa wanaomkaribia. Tanbihi inahifadhi uwezekano wa maana kwamba wao watamtambua au kumtendea kama mtakatifu.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: na mbele ya watu wote
  rationale: Hiki ni Kiswahili cha kawaida kinachohifadhi wazo la jambo kutokea hadharani mbele ya jumuiya yote.
- source_word: אֶכָּבֵד
  choice: nitatukuzwa
  rationale: Neno hili huhifadhi uzito wa heshima na utukufu unaotolewa kwa Mungu; ‘nitaheshimiwa’ limetolewa kama maana nyingine halali.
- source_word: וַיִּדֹּם
  choice: Naye Haruni akanyamaza
  rationale: Kitenzi hiki kinaonyesha ukimya au kutulia kwa Haruni katika mwitikio wake, na ‘akanyamaza’ ni cha kawaida, kifupi, na chenye uzito unaofaa.
theological_decisions:
- issue: Jinsi ya kueleza utakatifu wa Mungu kuhusiana na wanaomkaribia
  choice: Miongoni mwa wale wanaonikaribia nitajidhihirisha kuwa mtakatifu
  alternative: Nitatambuliwa kuwa mtakatifu na wale wanaonikaribia
  rationale: Kiebrania kinaweza kueleza utakatifu wa Mungu kudhihirika au Mungu kutambuliwa na kutendewa kama mtakatifu. Tafsiri kuu inatunza tendo la Mungu bila kufuta maana nyingine, ambayo imewekwa katika tanbihi.
- issue: Jinsi ya kutafsiri אֶכָּבֵד kuhusu heshima ya Mungu mbele ya watu
  choice: nitatukuzwa
  alternative: nitaheshimiwa
  rationale: ‘Nitatukuzwa’ huhifadhi uzito wa kitheolojia wa כבד, huku ‘nitaheshimiwa’ ikiwa maana nyingine sahihi na ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa wasomaji wa kawaida, huku lugha ya ibada na uzito wa ukimya wa Haruni vikihifadhiwa.
