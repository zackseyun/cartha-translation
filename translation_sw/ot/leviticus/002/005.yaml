  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: sw
  text: Na ikiwa sadaka yako ya nafaka imeandaliwa kwenye kikaango[a], iwe ya unga laini uliochanganywa na mafuta, bila chachu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye bamba tambarare la kuokea.” Neno la Kiebrania linamaanisha chombo cha kupikia kilichotumiwa kuandaa sadaka hii ya nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2 neno hili linamaanisha sadaka inayotokana na nafaka au unga, si zawadi ya kawaida.
- source_word: עַל הַמַּחֲבַת
  choice: ya kuokwa kwenye kikaango
  rationale: Kirai hiki kinaonyesha sadaka iliyoandaliwa juu ya chombo au sehemu tambarare ya kupikia; usemi huu ni wa kawaida katika Kiswahili bila kudai umbo la chombo kwa uhakika usiokuwapo katika Kiebrania.
- source_word: קָרְבָּנְךָ
  choice: sadaka yako
  rationale: Huhifadhi maelekezo ya moja kwa moja kwa mtu anayetoa sadaka na maana pana ya kitu kinacholetwa mbele za Mungu.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni unga bora uliosagwa vizuri unaotajwa mara kwa mara kama kiungo cha sadaka hizi.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Hutoa wazi maana ya unga kuchanganywa na mafuta bila kubainisha isivyohitajika kama ulikandwa au ulikorogwa.
- source_word: מַצָּה
  choice: bila chachu
  rationale: Katika muktadha huu neno linaeleza hali inayotakiwa ya sadaka, yaani isiwe na chachu, wala si jina la mkate tofauti.
- source_word: תִהְיֶה
  choice: itakuwa
  rationale: Huhifadhi nguvu ya sharti la kisheria la Kiebrania kwa lugha ya kawaida na yenye hadhi.
