base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: sw
  text: Mnaweza kumtolea Yahwe vitu hivyo kama sadaka ya malimbuko,[a] lakini havipaswi kupandishwa juu ya madhabahu ili kutoa harufu ya kupendeza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama sadaka ya mazao ya kwanza.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “havipaswi kupanda kwenda madhabahuni kwa ajili ya harufu ya kupendeza”; hii ni njia ya kusema kwamba havipaswi kuteketezwa madhabahuni kama sadaka inayokubaliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: sadaka ya malimbuko
  rationale: Muundo huu unaonyesha sadaka inayotokana na mazao ya kwanza na ni wa kawaida katika Kiswahili cha ibada bila kutumia lugha ya kizamani.
- source_word: תַּקְרִיבוּ אֹתָם
  choice: mnaweza kumtolea ... vitu hivyo
  rationale: Kitenzi kina maana ya kuleta au kutoa kitu mbele za Mungu kama sadaka. Katika muktadha wa katazo la mstari uliotangulia na tofauti inayofuata, hali ya kuruhusu inaelezwa kwa ‘mnaweza’; ‘vitu hivyo’ hurejelea vitu vilivyotajwa katika mstari wa 11.
- source_word: לַיהוָה
  choice: kumtolea Yahwe
  rationale: Kiambishi ל kinaonyesha anayepokea au anayewekewa wakfu sadaka, na jina la agano יהוה limetafsiriwa kwa jina ‘Yahwe’.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: lakini havipaswi kupandishwa juu ya madhabahu
  rationale: 'Kiunganishi kinaonyesha tofauti: vitu hivyo vinaweza kutolewa kwa Yahwe, lakini si kupandishwa madhabahuni. Kauli ya kutendwa huonyesha kwa kawaida tendo la kikuhani bila kuondoa taswira ya Kiebrania ya ‘kupanda’.'
- source_word: לְרֵיחַ נִיחֹחַ
  choice: kuwa harufu ya kupendeza
  rationale: Hii ni kauli ya kawaida ya sadaka inayokubaliwa na Mungu; tafsiri hii inadumisha taswira ya harufu na inaeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Ikiwa sadaka hiyo inaruhusiwa au inaamriwa
  choice: mnaweza kumtolea
  alternative: mtamtolea; mleteni kwake
  rationale: Umbo la kitenzi peke yake linaweza kusikika kama agizo, lakini muktadha unatofautisha utoaji unaoruhusiwa wa malimbuko na katazo la kuviteketeza madhabahuni. Tafsiri ya ruhusa huhifadhi mantiki hiyo bila kudai kwamba utoaji wenyewe ni marufuku.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Malimbuko’ ni istilahi ya kibiblia iliyozoeleka; tanbihi inaifafanua kwa lugha ya sasa. Viashiria [a] na [b] vimewekwa mara moja katika matini kuu.
