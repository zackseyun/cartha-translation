source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: sw
  text: 'Na ikiwa utaleta sadaka ya nafaka iliyookwa katika tanuri, iwe ya unga laini: mikate isiyotiwa chachu iliyochanganywa na mafuta, au[a] mikate myembamba isiyotiwa chachu iliyopakwa mafuta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na mikate myembamba.” Kiunganishi cha Kiebrania ni “na,” lakini hapa huenda kinataja namna nyingine ya sadaka ya nafaka iliyookwa katika tanuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi וְ pamoja na hali ya sharti inayoanzishwa na כִּי katika maagizo ya ibada.
- source_word: תַקְרִב קָרְבַּן מִנְחָה
  choice: utaleta sadaka ya nafaka
  rationale: Kitenzi katika Hifili cha קרב humaanisha kuleta au kuwasilisha sadaka. Kiswahili cha kawaida hakihitaji kurudia wazo la ‘kuleta karibu’; ‘sadaka ya nafaka’ hutaja kwa usahihi aina maalumu ya sadaka inayokusudiwa na מִנְחָה katika Walawi 2.
- source_word: מַאֲפֵה תַנּוּר
  choice: iliyookwa katika tanuri
  rationale: Hueleza njia ya kuitayarisha sadaka kwa kuoka katika tanuri kwa lugha ya kawaida na yenye hadhi.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hurejelea unga uliosagwa vizuri na unaofaa kwa sadaka; ‘unga laini’ ni wazi kwa msomaji wa kisasa.
- source_word: חַלּוֹת מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Hutaja vipande vya mkate vilivyotengenezwa bila chachu, bila kulazimisha umbo maalumu lisilowazi katika neno חַלּוֹת.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: iliyochanganywa na mafuta
  rationale: Kauli tendwa ya בלל inaonyesha kuwa mafuta yalichanganywa ndani ya maandalizi hayo.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: au mikate myembamba isiyotiwa chachu
  rationale: רְקִיקִים ni mikate au vipande vyembamba. ‘Au’ huwasilisha uwezekano mkubwa kwamba hii ni namna nyingine inayoruhusiwa, huku tanbihi ikihifadhi ‘na’ ya Kiebrania.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: iliyopakwa mafuta
  rationale: Katika muktadha wa chakula cha sadaka, משׁח inaeleza mafuta kupakwa juu yake; ‘iliyopakwa’ huepuka kudokeza bila lazima maana ya kiibada ya kuwekwa wakfu.
theological_decisions:
- issue: Maana ya מִנְחָה katika muktadha wa dhabihu
  choice: sadaka ya nafaka
  alternative: sadaka ya zawadi
  rationale: Ingawa מִנְחָה inaweza kumaanisha zawadi au kodi katika miktadha mingine, Walawi 2 inaeleza aina maalumu ya sadaka inayotengenezwa kwa unga na mafuta. ‘Sadaka ya nafaka’ huhifadhi umaalumu huo bila kuongeza fundisho la dhehebu.
- issue: Uhusiano wa וּרְקִיקֵי na aina iliyotangulia
  choice: au mikate myembamba
  alternative: na mikate myembamba
  rationale: ו ni ‘na’ kwa umbo lake, lakini katika orodha hii huenda inatambulisha aina nyingine ya sadaka iliyookwa tanurini. Tafsiri kuu inatumia ‘au’ kwa uwazi wa kimaelekezo, na tanbihi inahifadhi uwezekano wa kusoma ‘na’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. ‘Tanuri,’ ‘chachu,’ na ‘sadaka ya nafaka’ hudumisha msamiati wa ibada unaoeleweka, huku miundo mizito ya kunakili Kiebrania neno kwa neno ikiepukwa.
