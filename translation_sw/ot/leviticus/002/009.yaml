  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Kisha kuhani atainua kutoka katika sadaka ya nafaka sehemu ya ukumbusho wake na kuiteketeza juu ya madhabahu—sadaka inayotolewa kwa moto[a], harufu ya kupendeza kwa BWANA.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula, harufu ya kupendeza kwa BWANA.”
    reason: Huhifadhi tafsiri mbadala ya kileksia ya אִשֶּׁה bila kuifanya maana hiyo kuwa ya lazima katika maandishi makuu.
lexical_decisions:
- source_word: וְהֵרִים
  choice: atainua
  rationale: Hifili ya רום hapa inaeleza tendo la kuhani kuinua au kuondoa sehemu ya sadaka; “atainua” huhifadhi picha halisi ya tendo la ibada.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada.
- source_word: מִן הַמִּנְחָה
  choice: kutoka katika sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2, מִנְחָה ni sadaka inayotokana na nafaka; tafsiri hii ni wazi na sahihi kimuktadha.
- source_word: אַזְכָּרָתָהּ
  choice: sehemu yake ya ukumbusho
  rationale: Neno hili la kiibada linamaanisha sehemu wakilishi inayoteketezwa; kutaja “sehemu” huonyesha kwamba si sadaka yote inayoteketezwa.
- source_word: וְהִקְטִיר
  choice: na kuiteketeza
  rationale: Katika muktadha wa dhabihu, קטר hurejelea kuchoma sadaka juu ya madhabahu hata itoe moshi; “kuiteketeza” ni lugha ya kawaida ya kiibada.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Hii inatoa kwa Kiswahili maana ya kimahali ya muundo wa Kiebrania katika nahau hii.
- source_word: אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Maana ya msingi ni sadaka inayotolewa kwa njia ya moto. Tafsiri hii huepuka kuamua bila ulazima kwamba neno lenyewe linamaanisha “sadaka ya chakula.”
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Huhifadhi taswira ya harufu pamoja na wazo la sadaka kukubaliwa na Mungu, kwa lugha ya asili ya Kiswahili.
- source_word: לַיהוָה
  choice: BWANA
  rationale: Jina la agano יהוה limetafsiriwa kwa desturi iliyoenea ya Kiswahili ya kutumia “BWANA” kwa herufi kubwa.
theological_decisions:
- issue: Maana ya kauli ya kiibada אִשֵּׁה רֵיחַ נִיחֹחַ
  choice: sadaka inayotolewa kwa moto, yenye harufu ya kumpendeza BWANA
  alternative: sadaka ya chakula, harufu ya kumpendeza BWANA
  rationale: Chaguo kuu huhifadhi kwa uwazi njia ya utoaji kwa moto na taswira ya harufu inayompendeza Mungu, bila kuingiza tafsiri pana kwamba אִשֵּׁה yenyewe ni “chakula.”
- issue: Uwakilishi wa יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni desturi inayotambulika sana katika Biblia za Kiswahili; haiingizi fundisho la dhehebu, ingawa “Yahwe” huhifadhi jina kwa unukuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umeweka wazi mfuatano wa tendo la kuhani, sehemu ya ukumbusho, kuteketezwa madhabahuni, na kauli ya kukubaliwa kwa sadaka.
