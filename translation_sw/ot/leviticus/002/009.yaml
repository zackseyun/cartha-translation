revisions:
- from: Kisha kuhani atainua kutoka katika sadaka ya nafaka sehemu yake ya ukumbusho na kuiteketeza juu ya madhabahu—sadaka inayotolewa kwa moto, yenye harufu ya kumpendeza BWANA.
  to: Kisha kuhani atainua kutoka katika sadaka ya nafaka sehemu ya ukumbusho wake na kuiteketeza juu ya madhabahu—sadaka inayotolewa kwa moto[a], harufu ya kupendeza kwa BWANA.
