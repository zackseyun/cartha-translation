    text: Au, “sadaka ya chakula, harufu ya kupendeza kwa BWANA.”
    reason: Huhifadhi tafsiri mbadala ya kileksia ya אִשֶּׁה bila kuifanya maana hiyo kuwa ya lazima katika maandishi makuu.
  revision_rationale: Marekebisho ni ya mtindo na uwazi wa kisintaksia, huku yakidumisha mfuatano wa ibada na maana ya Kiebrania. Neno ‘sadaka inayotolewa kwa moto’ limehifadhiwa katika maandishi makuu; dokezo linaweka wazi mbadala wa ‘sadaka ya chakula.’
