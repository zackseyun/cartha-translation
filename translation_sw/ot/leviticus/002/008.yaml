id: LEV.2.8
reference: Leviticus 2:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: sw
  text: Nawe utamletea Yahwe[a] sadaka ya nafaka iliyotayarishwa kutokana na vitu hivi. Utamkabidhi kuhani sadaka hiyo, naye ataipeleka karibu na madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya Yahwe.” Kihusishi cha Kiebrania kinaweza kuonyesha kuwekwa wakfu pamoja na mwelekeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Nawe utamletea
  rationale: Hifili ya בוא katika mtindo wa maagizo ya kisheria ina nguvu ya agizo la wakati ujao. Kiunganishi וְ kimewakilishwa kwa “Nawe,” huku “-letea” kikieleza kumpelekea anayelengwa.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2, מִנְחָה ni sadaka inayotokana na nafaka, si zawadi au sadaka ya jumla.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: iliyotayarishwa kutokana na vitu hivi
  rationale: Nifali ya עשה ina maana tendwa, “iliyofanywa/iliyotayarishwa,” na מֵאֵלֶּה inaonyesha chanzo kutokana na vitu vilivyotajwa.
- source_word: לַיהוָה
  choice: Yahwe[a]
  rationale: Jina la agano יהוה limetoholewa kwa namna iliyozoeleka katika Kiswahili. Kiambishi ל kinaweza kuonyesha mwelekeo au kuwekwa wakfu, hivyo tanbihi inahifadhi uwezekano huo.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: Utamkabidhi kuhani sadaka hiyo
  rationale: Hifili ya קרב ina maana ya kuleta karibu au kuwasilisha. Katika hatua hii mtoaji anamfikishia kuhani sadaka; “utamkabidhi” ni Kiswahili cha kawaida kinachoonyesha uhamisho huo bila kuiita tayari tendo la kuteketeza sadaka.
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: naye ataipeleka karibu na madhabahu
  rationale: Hifili ya נגשׁ inamaanisha kuleta karibu. Kiwakilishi “naye” kinamrejelea kuhani aliyemtangulia na kuhifadhi mfuatano wa ibada kuelekea madhabahuni.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Maana ya ל katika לַיהוָה
  choice: kumletea Yahwe
  alternative: kwa ajili ya Yahwe
  rationale: Muktadha wa kuleta sadaka unaunga mkono mwelekeo, lakini ל pia inaweza kueleza sadaka iliyowekwa kwa ajili ya Yahwe; tanbihi inalinda utata huo halisi.
- issue: Mhusika wa vitenzi vya hatua za ibada
  choice: mtoaji anamkabidhi kuhani; kisha kuhani anaipeleka karibu na madhabahu
  alternative: kuacha viwakilishi pekee bila kutaja mabadiliko ya mhusika
  rationale: Mfuatano wa Kiebrania unaanza na nafsi ya pili ya kiume umoja, kisha unatumia nafsi ya tatu ya kiume umoja. Kutaja mabadiliko kwa Kiswahili kunafanya hatua za ibada zieleweke bila kuongeza fundisho la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Sadaka ya nafaka” ni istilahi wazi ya kiibada; “madhabahu” imehifadhiwa kwa sababu ni neno la kawaida la kibiblia. Muundo umetenganisha hatua mbili ili mabadiliko kutoka kwa mtoaji kwenda kwa kuhani yaeleweke.
