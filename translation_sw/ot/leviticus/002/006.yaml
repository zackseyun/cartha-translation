translation:
  language: sw
  text: Uivunje vipande vipande[a], kisha umimine mafuta juu yake; ni sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uigawanye kuwa vipande” au “vipande vidogo.” Kiebrania kinasisitiza kuigawanya sadaka katika vipande kabla ya kumimina mafuta juu yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָ/הּ֙ פִּתִּ֔ים
  choice: Livunje vipande vipande
  rationale: Muundo wa Kiebrania unasisitiza kulivunja kuwa vipande vidogo. Kiswahili hiki ni cha kawaida, wazi, na kinahifadhi nguvu ya agizo pamoja na wazo la matokeo.
- source_word: וְ/יָצַקְתָּ֥
  choice: kisha ulimimine
  rationale: Kitenzi katika mfuatano wa maagizo kina nguvu ya kuamuru. “Kisha” huonyesha mpangilio wa hatua, na “ulimimine” hurejelea toleo lililotajwa kwa ngeli inayofaa.
- source_word: עָלֶ֖י/הָ
  choice: juu yake
  rationale: Kirai hiki kinaonyesha mafuta kuwekwa juu ya toleo; “juu yake” ni Kiswahili cha sasa na sahihi.
- source_word: שָׁ֑מֶן
  choice: mafuta
  rationale: Kiebrania kinasema mafuta bila kutaja wazi mafuta ya zeituni, hivyo tafsiri haiongezi maelezo hayo.
- source_word: מִנְחָ֖ה
  choice: sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2 neno hili ni istilahi ya ibada inayohusu sadaka inayotokana na nafaka; tafsiri hii ni wazi na sahihi katika muktadha.
- source_word: הִֽוא
  choice: ni
  rationale: Kiwakilishi huru kinatambulisha kitu kilichoelezwa kuwa sadaka ya nafaka. Kiswahili hutumia kwa kawaida kishirikishi “ni” bila kiwakilishi kingine.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Kiwakilishi cha kitu kimefuata ngeli ya “toleo” inayodokezwa na muktadha, huku istilahi “sadaka ya nafaka” ikidumisha usahihi wa kiibada.
