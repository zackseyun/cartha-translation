revisions:
- from: Kila sadaka ya nafaka mtakayomtolea Yahwe isitayarishwe kwa chachu, kwa sababu msichome juu ya madhabahu chachu yoyote wala asali yoyote[a] kutoka katika sadaka hiyo kama sadaka inayotolewa kwa moto[b] kwa Yahwe.
  to: Kila sadaka ya nafaka mtakayomtolea Yahwe isitayarishwe kwa chachu; wala msichome chachu yoyote au asali yoyote[a] kutoka katika sadaka hiyo kuwa sadaka ya moto[b] kwa Yahwe.
  rationale: Marekebisho yanaondoa nyongeza isiyotajwa wazi (“juu ya madhabahu”) kutoka maandishi makuu, yanarahisisha sintaksia ya katazo la pili, na yanahifadhi marejeleo ya chachu na asali kuwa vitu visivyopaswa kutolewa kwa moto kutoka katika sadaka hiyo. Nusu-koloni huonyesha kwamba כִּי hapa huanzisha katazo linalofafanua bila kulazimisha maana finyu ya “kwa sababu.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T03:40:54Z'
review_pass:
  verdict: revise
  source_fidelity: Tafsiri inawasilisha kwa usahihi sadaka ya nafaka, katazo la chachu, asali, na tendo la kutoa kwa moto. Hata hivyo, kuingiza “juu ya madhabahu” katika maandishi makuu huongeza kipengele ambacho hakijasemwa wazi katika mstari, ingawa kinadokezwa na muktadha wa kiibada. Pia, “kwa sababu” hufanya כִּי ionekane kama sababu ya kimantiki ilhali hapa inaweza kutafsiriwa kwa urahisi zaidi kama kiunganishi cha katazo linalofuata.
  naturalness: Muundo wa rasimu unaeleweka, lakini “msichome ... kutoka katika sadaka hiyo kama sadaka inayotolewa kwa moto” ni mzito na unaacha uhusiano wa “kutoka katika sadaka hiyo” usiwe laini. “Msiichome ... kuwa sadaka ya moto” ni ya asili zaidi katika Kiswahili cha sanifu na huhifadhi lugha ya kiibada.
  terminology: “Sadaka ya nafaka,” “chachu,” “asali,” na “Yahwe” ni chaguo zinazofaa. “Sadaka ya moto” ni istilahi fupi, ya kawaida, na inayofaa kwa אִשֶּׁה; tanbihi ifafanue kwamba ni sadaka inayotolewa kwa kuichoma juu ya madhabahu.
