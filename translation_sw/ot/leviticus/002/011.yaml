    rationale: “Msichome ... kutoka katika sadaka hiyo kama sadaka inayotolewa kwa moto” haielezi kwa ulaini tendo la kuifanya chachu au asali kuwa sadaka ya moto. Marekebisho yanahifadhi katazo na kurejelea sadaka iliyotajwa bila kubadilisha maana.
