base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: sw
  text: Kila sadaka ya nafaka mtakayomtolea Yahwe isitayarishwe kwa chachu; wala msichome chachu yoyote au asali yoyote[a] kutoka katika sadaka hiyo kuwa sadaka ya moto[b] kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika matumizi ya kale, “asali” ingeweza pia kumaanisha sharubati ya matunda, si asali ya nyuki pekee.
    reason: cultural_note
  - marker: b
    text: Au “sadaka inayotolewa kwa moto.” Neno la Kiebrania humaanisha sadaka inayotolewa juu ya madhabahu kwa kuichoma.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2, neno hili linamaanisha hasa sadaka inayotokana na unga au nafaka, si sadaka kwa ujumla.
- source_word: תַּקְרִיבוּ
  choice: mtakayomtolea
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta au kutoa sadaka mbele za Mungu; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limeandikwa moja kwa moja katika chanzo; limetoholewa kuwa “Yahwe,” huku kihusishi kikionyesha anayepokea sadaka.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: isitayarishwe kwa chachu
  rationale: Muundo huu unaonyesha kwamba sadaka hairuhusiwi kutayarishwa ikiwa imechanganywa na kitu kinachoichachusha.
- source_word: שְׂאֹר
  choice: chachu
  rationale: Neno hili linamaanisha kitu kinachochachusha donge; “chachu” ni pana na la kawaida kuliko kulifungamanisha na chachu ya kisasa ya viwandani.
- source_word: דְּבַשׁ
  choice: asali
  rationale: Hii ndiyo maana ya kawaida na iliyo wazi zaidi, huku uwezekano wa sharubati ya matunda katika matumizi ya kale ukielezwa katika tanbihi.
- source_word: לֹא תַקְטִירוּ
  choice: msichome juu ya madhabahu
  rationale: Hifili ya קטר humaanisha kufanya kitu kipande kwa moshi kwa kukichoma katika tendo la ibada; kutaja madhabahu hufafanua kitendo hicho bila kukichanganya na uchomaji wa kawaida.
- source_word: מִמֶּנּוּ
  choice: kutoka katika sadaka hiyo
  rationale: Kiwakilishi cha umoja kinaeleweka kurejelea sadaka ya nafaka iliyotajwa mwanzoni.
- source_word: אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Ni istilahi ya ibada kwa sadaka inayotolewa juu ya madhabahu kwa kuichoma; tafsiri hii inaeleweka na pia huhifadhi wazo la moto.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya istilahi ya ibada אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya moto; sadaka ya chakula
  rationale: Chaguo hili linaonyesha njia ya kuitoa sadaka bila kudokeza kwamba ni sadaka ya kuteketezwa kabisa, ambayo ni aina tofauti ya sadaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Mtakayomtolea” huhifadhi wingi wa wahusika wanaoagizwa, na “isitayarishwe” huwasilisha katazo kwa njia ya kawaida ya Kiswahili. Madhabahu imetajwa ili kuweka wazi maana ya kiibada ya kitendo cha kuchoma.
