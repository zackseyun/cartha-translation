  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: sw
  text: Na kilichobaki katika sadaka ya nafaka kitakuwa cha Haruni na wanawe; ni takatifu sana miongoni mwa sadaka za moto za Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni takatifu sana miongoni mwa sadaka za chakula za Yahwe.”
    reason: Neno la Kiebrania linaweza kumaanisha sadaka zinazotolewa kwa moto au, katika matumizi ya kikuhani, sadaka za chakula zinazotolewa kwa Mungu.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Na sehemu inayobaki
  rationale: Umbo lenye kibainishi linafanya kazi kama nomino na kumaanisha sehemu ya sadaka iliyosalia; kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: מִן הַמִּנְחָה
  choice: ya sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2, מִנְחָה ni sadaka ya nafaka, si sadaka au zawadi kwa ujumla.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: itakuwa ya Haruni na wanawe
  rationale: Herufi לְ inaonyesha mgao au umiliki; 'itakuwa ya' hudumisha mtindo wa sheria wa kifungu.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: ni takatifu sana
  rationale: Hii ni nahau ya Kiebrania inayoonyesha kiwango cha juu kabisa cha utakatifu; haiongezi nomino isiyokuwapo katika matini.
- source_word: מֵאִשֵּׁי
  choice: kati ya dhabihu za moto
  rationale: אִשֶּׁה ni sadaka inayotolewa kwa njia ya moto. 'Dhabihu za moto' ni wazi na hudumisha uhusiano wake na moto bila kuifanya kuwa 'chakula' pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti יהוה limetoholewa moja kwa moja kwa namna iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Maana ya אִשֵּׁי יְהוָה
  choice: dhabihu za moto za Yahwe
  alternative: sadaka za chakula za Yahwe
  rationale: Uchaguzi huu hudumisha uhusiano wa neno na utoaji kwa moto, huku tanbihi ikihifadhi tafsiri nyingine inayowezekana katika lugha ya kikuhani.
- issue: Nahau קֹדֶשׁ קָדָשִׁים
  choice: ni takatifu sana
  alternative: ni sehemu takatifu kabisa
  rationale: Tafsiri hii huhifadhi kauli ya chanzo bila kuongeza neno 'sehemu,' ingawa maana yake katika muktadha ni sehemu iliyobaki ya sadaka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa kisheria wa kifungu umehifadhiwa, na jina Yahwe limetumika kwa יהוה.
