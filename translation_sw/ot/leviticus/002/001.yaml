id: LEV.2.1
reference: Leviticus 2:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: sw
  text: Mtu[a] akileta sadaka ya nafaka[b] kwa Yahwe, sadaka yake itakuwa unga laini. Atamimina mafuta juu yake na ataweka ubani juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno lililotafsiriwa ‘mtu’ ni נֶפֶשׁ, ambalo kihalisi linaweza kumaanisha ‘nafsi’, lakini hapa humaanisha mtu binafsi.
    reason: lexical_alternative
  - marker: b
    text: ‘Sadaka ya nafaka’ ni sadaka iliyotengenezwa kwa mazao ya nafaka; hapa ilitolewa kama unga laini.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Ingawa neno hili linaweza kumaanisha ‘nafsi’, katika sheria hii linamtaja mtu binafsi. ‘Mtu’ ni Kiswahili cha kawaida na hakiongezi maana ya kimetafizikia.
- source_word: תַקְרִיב
  choice: anapoleta
  rationale: Hifili ya קרב hapa ina maana ya kuleta au kukaribisha kitu kama sadaka. ‘Anapoleta’ ni ya kawaida na huhifadhi tendo la kuifikisha sadaka mbele za Mungu.
- source_word: קָרְבַּן מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa Walawi, מִנְחָה ni sadaka inayotokana na mazao ya nafaka, si zawadi ya jumla tu; קָרְבַּן huitambulisha kama kitu kinacholetwa kwa ibada.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kiambishi ל kinaonyesha anayepokea au anayelengwa na sadaka, na jina la agano יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili humaanisha unga uliosagwa vizuri na uliotumiwa katika sadaka. ‘Unga laini’ ni usemi wazi na wa kawaida katika Kiswahili.
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: sadaka yake itakuwa
  rationale: Muundo huu unaeleza sadaka hiyo inapaswa kuwa ya nini, huku kiambishi cha nafsi ya tatu umoja kikihifadhiwa kwa ‘yake’.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: Atamimina mafuta juu yake
  rationale: Katika mfululizo huu wa maagizo, umbo la kitenzi lina nguvu ya kuelekeza tendo linalofuata. ‘Juu yake’ hurejelea sadaka ya nafaka.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: na kuweka ubani juu yake
  rationale: לְבֹנָה ni utomvu wenye harufu nzuri unaochomwa katika ibada, unaoitwa kwa kawaida ‘ubani’ katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandiko ya Kiebrania yanatumia jina maalumu יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
- issue: Umoja na jinsia katika maagizo ya sheria
  choice: mtu ... sadaka yake ... atamimina
  alternative: yeyote ... sadaka yao ... watamimina
  rationale: Kiebrania kinatumia mtu mmoja wa mfano na maumbo ya umoja. Kiswahili kinaweza kuhifadhi umoja bila kulazimika kuonyesha jinsia ya mtu huyo, hivyo maana ya jumla ya sheria inabaki wazi.
- issue: Nguvu ya vitenzi וְיָצַק na וְנָתַן
  choice: Atamimina ... na kuweka
  alternative: na aimimine ... na aweke
  rationale: Katika muktadha huu wa sheria, vitenzi vinaeleza hatua zinazotakiwa kufanywa. Wakati ujao wa Kiswahili unasomeka kwa kawaida kama agizo la utaratibu bila kuongeza ukali usiokuwamo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, ulio wazi na unaofaa kusomwa hadharani. Sentensi mbili zinazuia msongamano huku zikihifadhi mfuatano wa Kiebrania. ‘Ubani’ ni neno la kawaida la kidini na kitamaduni kwa frankincense.
