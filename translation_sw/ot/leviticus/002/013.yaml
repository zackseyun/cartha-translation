base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: sw
  text: Na kila toleo la sadaka yako ya nafaka utalitia chumvi[a]. Usiache chumvi ya agano la Mungu wako ikose katika sadaka yako ya nafaka[b]. Pamoja na matoleo yako yote utatoa chumvi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “utaitia chumvi”; Kiebrania kinasema, “kwa chumvi utaitia chumvi.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “chumvi ya agano la Mungu wako” umedumishwa jinsi ulivyo katika Kiebrania; unaunganisha chumvi na uaminifu na kudumu kwa agano.
    reason: cultural_note
  - marker: c
    text: Au, “Juu ya kila toleo lako utatoa chumvi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן
  choice: toleo
  rationale: Ni neno pana la kitu kinacholetwa kwa Mungu; “toleo” ni la kawaida na linafaa katika muktadha wa ibada.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2 neno hili linamaanisha hasa sadaka iliyotengenezwa kwa nafaka, hivyo tafsiri hii inadumisha umahususi wa ibada.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: utalitia chumvi
  rationale: Kiebrania hurudia nomino na kitenzi vya mzizi unaohusiana; Kiswahili hiki ni cha asili na kinadumisha agizo la kutia chumvi.
- source_word: תַשְׁבִּית
  choice: usiache ... ikosekane
  rationale: Huwasilisha wazi katazo la kuondoa au kuacha chumvi isiwepo katika sadaka.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: chumvi ya agano la Mungu wako
  rationale: Inadumisha moja kwa moja taswira ya agano bila kufafanua kimadhehebu maana yake ya kiishara.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: pamoja na matoleo yako yote
  rationale: Ingawa עַל inaweza kutafsiriwa “juu ya,” hapa kauli hii ya Kiswahili inaeleza kwa kawaida kuwa chumvi inaambatana na kila toleo.
- source_word: תַּקְרִיב
  choice: utatoa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuleta au kutoa mbele za Mungu; “utatoa” ni cha kawaida na cha heshima.
theological_decisions:
- issue: Iwapo usemi wa kiagano ufafanuliwe kwa kutaja maana yake ya kiishara
  choice: Kudumisha “chumvi ya agano la Mungu wako” katika matini kuu
  alternative: chumvi inayoashiria agano la Mungu wako
  rationale: Aya yenyewe haitoi ufafanuzi wa ishara hiyo; tafsiri ya moja kwa moja inadumisha taswira na mvutano wa kitheolojia.
- issue: Iwapo עַל כָּל קָרְבָּנְךָ imaanishe chumvi kuwekwa juu ya kila toleo au kuletwa pamoja nalo
  choice: pamoja na matoleo yako yote
  alternative: juu ya kila toleo lako
  rationale: Kihusishi kinaweza kubeba maana zote mbili katika muktadha huu; matini kuu imetumia Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano wa tafsiri halisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sadaka ya nafaka” hutofautisha מִנְחָה na neno pana קָרְבַּן, lililotafsiriwa “toleo.” Alama zote za tanbihi zimewekwa katika matini kuu.
