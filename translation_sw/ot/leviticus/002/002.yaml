id: LEV.2.2
reference: Leviticus 2:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Ataipeleka kwa wana wa Aroni, makuhani; kisha kuhani atachukua kutoka humo kiasi cha unga wake laini kinachojaza konzi yake, pamoja na sehemu ya mafuta yake na ubani wake wote. Kisha atateketeza juu ya madhabahu sehemu yake ya ukumbusho, sadaka inayotolewa kwa moto[a], harufu ya kupendeza kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula”; maana kamili ya neno la Kiebrania haijulikani kwa hakika.
    reason: Istilahi אִשֵּׁה inaweza kuhusishwa na sadaka inayoteketezwa kwa moto, lakini katika matumizi ya kikuhani pia imeeleweka kwa taswira ya chakula kinachotolewa kwa Mungu.
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Ataipeleka
  rationale: Hifili ya בוא pamoja na kiambishi cha kitu cha kike inarejelea kuipeleka sadaka ya nafaka; wakati ujao unafaa kwa maagizo ya kisheria.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: wana wa Aroni, yaani makuhani
  rationale: Inahifadhi uhusiano wa kifamilia na pia inaonyesha wazi kwamba kishazi cha pili kinawatambulisha wana hao kuwa makuhani.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: atachota ... kiasi ... kinachojaza konzi yake
  rationale: Inawasilisha tendo la kuchota kwa mkono na maana halisi ya kiasi kinachojaza konzi, bila kukifanya kuwa kipimo kisicho kamili.
- source_word: מִסָּלְתָּהּ
  choice: unga wake laini
  rationale: סֹלֶת ni unga laini wa kiwango bora unaotumiwa hasa katika sadaka.
- source_word: וּמִשַּׁמְנָהּ
  choice: pamoja na sehemu ya mafuta yake
  rationale: מִן inaonyesha kwamba kiasi fulani cha mafuta ya sadaka kinajumuishwa, si lazima mafuta yote.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: na ubani wake wote
  rationale: Kinyume na unga na mafuta yanayotolewa kwa sehemu, ubani wote unajumuishwa katika sehemu inayoteketezwa.
- source_word: וְהִקְטִיר
  choice: ataiteketeza
  rationale: Katika muktadha wa dhabihu, Hifili ya קטר humaanisha kuunguza sadaka juu ya madhabahu hadi moshi wake upande.
- source_word: אַזְכָּרָתָהּ
  choice: sehemu yake ya ukumbusho
  rationale: Inahifadhi istilahi ya kiibada kwa sehemu wakilishi ya sadaka inayoteketezwa mbele za Mungu, bila kufafanua kwa uhakika jinsi ‘ukumbusho’ huo unavyofanya kazi.
- source_word: אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Hii ni tafsiri ya tahadhari ya istilahi ya kikuhani; inahifadhi uhusiano wake wa wazi na moto bila kuamua kwamba maana yake ya msingi ni ‘chakula.’
- source_word: רֵיחַ נִיחֹחַ
  choice: harufu inayompendeza
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachohifadhi taswira ya harufu na wazo la kupendeza au kukubalika.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano יהוה; ‘Yahwe’ hulitambulisha kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya istilahi אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Asili na upeo kamili wa istilahi hii vinajadiliwa. Tafsiri iliyochaguliwa inafuata kwa karibu matumizi yake ya kikuhani na muktadha wa kuteketeza, huku tanbihi ikihifadhi uwezekano wa taswira ya chakula.
- issue: Rejeleo la אַזְכָּרָתָהּ
  choice: sehemu yake ya ukumbusho
  alternative: sehemu ya kukumbusha
  rationale: Muundo wa nomino unahifadhi mvutano wa kiteolojia kuhusu ikiwa sehemu hiyo ni ukumbusho, husababisha kukumbukwa, au ni sehemu wakilishi, bila kumtaja kwa lazima anayekumbuka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimehifadhi mtindo wa maagizo ya kiibada, huku “yaani” ikifanya utambulisho wa wana wa Aroni kuwa makuhani ueleweke kwa urahisi. Kiwakilishi katika “Naye” kinaacha kwa kiasi fulani mpito wa ghafla wa Kiebrania kutoka ‘wana’ wengi kwenda mtendaji mmoja, badala ya kumtaja mtendaji kwa namna isiyokuwapo wazi katika chanzo.
