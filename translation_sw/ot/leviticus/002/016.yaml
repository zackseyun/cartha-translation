base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: sw
  text: Kuhani atachoma sehemu ya ukumbusho ya sadaka hiyo, kutoka katika nafaka yake iliyopondwa[a] na kutoka katika mafuta yake, pamoja na ubani wake wote—sadaka inayotolewa kwa moto kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafaka yake iliyosagwa kwa ukwaru”; Kiebrania hurejelea punje zilizopondwa au kusagwa kwa ukwaru ili kuandaa sadaka ya nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: ataiteketeza
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuchoma sadaka ili moshi wake upande. “Ataiteketeza” ni lugha ya kawaida na yenye hadhi kwa tendo hilo la ibada.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כהן katika sheria za ibada.
- source_word: אַזְכָּרָתָהּ
  choice: sehemu yake ya ukumbusho
  rationale: Hili ni neno la kiibada linalotaja sehemu wakilishi ya sadaka ya nafaka iliyoteketezwa. Tafsiri hii huhifadhi wazo la sehemu na la ukumbusho bila kulifafanua kupita maandishi.
- source_word: מִגִּרְשָׂהּ
  choice: kutoka katika nafaka yake iliyopondwa
  rationale: גרש hutaja punje zilizopondwa au kusagwa kwa ukwaru. “Nafaka iliyopondwa” inaeleweka kwa urahisi na inafaa katika muktadha wa sadaka ya malimbuko.
- source_word: וּמִשַּׁמְנָהּ
  choice: na mafuta yake
  rationale: Muundo huu huhifadhi uhusiano wa sehemu ya ukumbusho kuchukuliwa kutoka katika nafaka na mafuta ya sadaka hiyo.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: pamoja na ubani wake wote
  rationale: 'Katika agizo hili la dhabihu, עַל huonyesha uandamani: sehemu ya ukumbusho inateketezwa pamoja na ubani wote.'
- source_word: אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Hili ni neno maalumu la dhabihu inayowasilishwa kwa njia ya moto. Tafsiri hii ni wazi kuliko “sadaka ya chakula,” ambayo ingeweza kupotosha.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Herufi ל inaonyesha kwamba sadaka inaelekezwa au kuwekwa wakfu kwa Yahweh; “kwa Yahweh” ni ya asili katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unafuata kwa karibu mantiki ya Kiebrania huku ukibaki wa asili katika Kiswahili.
