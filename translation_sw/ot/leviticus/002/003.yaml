base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: sw
  text: Kilichobaki katika sadaka ya nafaka ni cha Aroni na wanawe; hicho ni kitakatifu sana, kutoka katika sadaka za Yahwe zinazotolewa kwa moto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika sadaka za chakula za Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Sehemu iliyobaki
  rationale: Umbo hili linatumika kama nomino na kumaanisha sehemu ya sadaka inayosalia; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: מִן הַמִּנְחָה
  choice: ya sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2, מִנְחָה ni sadaka inayotengenezwa kwa nafaka, si zawadi ya jumla.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ni ya Aroni na wanawe
  rationale: Kihusishi לְ kinaonyesha mgao au umiliki; tafsiri hii inaeleza wazi kwamba mabaki hayo yamewekwa kwa ajili ya Aroni na wanawe.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: sehemu takatifu sana
  rationale: Muundo huu wa Kiebrania unaonyesha kiwango cha juu kabisa cha utakatifu. Neno 'sehemu' linaweka wazi kwamba maelezo yanahusu mabaki ya sadaka, wala si mahali patakatifu.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: miongoni mwa sadaka za Yahwe zinazotolewa kwa moto
  rationale: אִשֶּׁה ni istilahi ya ibada inayohusiana na sadaka inayotolewa kwa moto. 'Miongoni mwa' inaonyesha kwamba sehemu hiyo iko katika kundi la sadaka hizo, huku tanbihi ikihifadhi uwezekano wa kuielewa kama sadaka za chakula.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya uainishaji קֹדֶשׁ קָדָשִׁים
  choice: sehemu takatifu sana
  alternative: patakatifu pa patakatifu
  rationale: Kirai hiki kinaainisha mabaki ya sadaka katika kiwango cha juu zaidi cha utakatifu wa mfumo wa dhabihu. Tafsiri iliyochaguliwa huepuka kukifanya kimaanishe eneo la patakatifu pa ndani.
- issue: Maana ya istilahi אִשֵּׁי יְהוָה
  choice: sadaka za Yahwe zinazotolewa kwa moto
  alternative: sadaka za chakula za Yahwe
  rationale: Istilahi hiyo inahusisha sadaka za madhabahuni zinazotolewa kwa moto, lakini pia inaweza kutumika kama istilahi ya sadaka zinazowasilishwa kwa Mungu kama chakula. Maandishi makuu yanahifadhi picha ya moto, na tanbihi inaonyesha maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Sentensi mbili zimetumiwa ili uainishaji wa utakatifu uwe wazi bila kuongeza madai yasiyomo katika Kiebrania.
