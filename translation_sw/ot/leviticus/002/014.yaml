base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: sw
  text: 'Na ukimtolea Yahweh sadaka ya malimbuko, utatoa sadaka yako ya malimbuko: masuke mabichi yaliyookwa kwa moto, nafaka iliyopondwa ya mavuno mapya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafaka mbichi iliyookwa kwa moto, nafaka iliyopondwa ya mavuno mapya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחַת
  choice: sadaka
  rationale: Katika Mambo ya Walawi 2, neno hili ni istilahi ya ibada kwa sadaka inayotokana na nafaka. Hapa “sadaka” ni ya kawaida na yenye hadhi, huku yaliyomo yakifafanuliwa na maneno yanayofuata.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: malimbuko
  rationale: “Malimbuko” ni neno la kawaida la Kiswahili kwa mazao ya kwanza yanayotolewa kwa Mungu, na linahifadhi maana ya ibada.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh,” kwa kufuata ushahidi wa maandishi na safu ya mashauriano.
- source_word: אָבִיב
  choice: masuke mabichi
  rationale: Neno hili huelekeza kwenye nafaka iliyo katika suke katika hatua mpya au mbichi. “Masuke mabichi” huhifadhi taswira ya kilimo bila kudai kiwango mahususi cha kuiva.
- source_word: קָלוּי בָּאֵשׁ
  choice: yaliyookwa motoni
  rationale: Kifungu hiki kinaeleza nafaka iliyopashwa au kuokwa kwa moto; “yaliyookwa motoni” ni Kiswahili cha asili na wazi.
- source_word: גֶּרֶשׂ
  choice: iliyopondwapondwa
  rationale: Nomino hii huonyesha nafaka iliyovunjwa au kupondwa vipandevipande. Umbo la kurudiwa linaonyesha kupondwa bila kudokeza kuwa imesagwa unga.
- source_word: כַּרְמֶל
  choice: nafaka mpya
  rationale: Katika muktadha huu neno linahusu nafaka mpya au mbichi, si jina la mahali. Tafsiri hii inalinda maana ya mavuno mapya.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: ukimtolea ... utaitoa
  rationale: Marudio ya kitenzi cha Hifili cha קרב yamehifadhiwa kwa miundo miwili ya “kutoa,” inayosikika kwa urahisi katika Kiswahili cha ibada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yana jina יהוה moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya אָבִיב na גֶּרֶשׂ כַּרְמֶל
  choice: masuke mabichi ... yaani nafaka mpya iliyopondwapondwa
  alternative: nafaka mbichi iliyookwa motoni, nafaka ya mavuno mapya iliyopondwapondwa
  rationale: Kiebrania kina msururu mfupi wa maneno ya kilimo ambao unaweza kueleweka kama maelezo yanayokaribiana. “Yaani” huonyesha uhusiano wa ufafanuzi bila kuufanya kuwa uhakika usio na utata; tanbihi inahifadhi mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya ibada. “Malimbuko” huhifadhi istilahi ya kibiblia inayofahamika, huku maelezo ya nafaka yakibaki halisi na yanayoeleweka.
