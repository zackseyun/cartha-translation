base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: sw
  text: Na utaweka mafuta juu yake[a], na utaweka ubani juu yake; ni sadaka ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utat ia mafuta juu yake.” Kitenzi cha Kiebrania kina maana pana, kama vile kutoa, kutia, au kuweka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Nawe utaweka
  rationale: Kitenzi נתן kina maana pana ya ‘kutoa, kutia, kuweka.’ Katika maagizo haya ya ibada, ‘utaweka’ ni Kiswahili cha kawaida na huhifadhi nguvu ya agizo la Kiebrania.
- source_word: עָלֶיהָ
  choice: juu yake
  rationale: Kihusishi על pamoja na kiambishi cha nafsi ya tatu umoja wa kike huonyesha kuweka kitu juu ya sadaka iliyotajwa.
- source_word: שֶׁמֶן
  choice: mafuta
  rationale: Neno la Kiebrania linasema tu ‘mafuta.’ Ingawa katika muktadha huu huenda yakawa mafuta ya zeituni, tafsiri haiongezi ‘ya zeituni’ kwa kuwa haijasemwa wazi.
- source_word: וְשַׂמְתָּ
  choice: na kuweka
  rationale: שׂים humaanisha ‘kuweka, kutia.’ Kurudia ‘kuweka’ ni kwa kawaida katika Kiswahili na huonyesha tendo la kimakusudi bila kuongeza tofauti isiyo lazima kati ya vitenzi hivi viwili vya Kiebrania.
- source_word: לְבֹנָה
  choice: ubani
  rationale: Katika Kiswahili sanifu cha Biblia, ‘ubani’ ni neno linaloeleweka kwa frankincense, aina mahususi ya uvumba unaotajwa hapa.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za dhabihu za Mambo ya Walawi, מִנְחָה humaanisha sadaka inayotengenezwa kwa nafaka, si zawadi ya jumla.
- source_word: הִוא
  choice: hiyo ni
  rationale: Kiwakilishi kinaitambulisha sadaka iliyotajwa. ‘Hiyo ni’ ni tamko la kawaida la Kiswahili linalohifadhi prediketa rahisi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umebaki karibu na mfuatano wa maagizo ya Kiebrania huku ukitumia istilahi ya kawaida ya ibada, ‘sadaka ya nafaka.’
