lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi na sharti linaloendeleza mfululizo wa maagizo ya sadaka.
- source_word: מִנְחַת
  choice: sadaka ya nafaka
  rationale: Katika Mambo ya Walawi 2, neno hili linamaanisha sadaka inayotokana na nafaka, si zawadi ya jumla.
- source_word: מַרְחֶשֶׁת
  choice: sufuria
  rationale: Neno hilo linataja chombo cha kupikia, lakini umbo na aina yake kamili hazijulikani; “sufuria” ni neno la kawaida lisilobainisha kupita kiasi.
- source_word: קָרְבָּנֶךָ
  choice: sadaka yako
  rationale: Huwasilisha kwa kawaida kitu kinacholetwa mbele za Mungu pamoja na kiambishi cha nafsi ya pili.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni kiungo maalumu cha sadaka za nafaka na tafsiri hii ni sahihi na ya kawaida katika Kiswahili.
- source_word: בַּשֶּׁמֶן
  choice: pamoja na mafuta
  rationale: Huhifadhi wazo la mafuta kuwa sehemu ya maandalizi bila kudai wazi kwamba unga ulichanganywa nayo.
- source_word: תֵּעָשֶׂה
  choice: itatengenezwa
  rationale: Huhifadhi hali ya kutendwa na sauti ya agizo ya kitenzi cha Kiebrania.
