  language: sw
  text: Na ikiwa sadaka yako ya nafaka ni ya sufuria[a], itatengenezwa kwa unga laini pamoja na mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kikaango,” “sufuria yenye kina,” au “chombo cha kupikia”; haijulikani kwa hakika neno la Kiebrania linamaanisha chombo cha aina gani.
