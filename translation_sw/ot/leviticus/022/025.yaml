  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: sw
  text: Wala kutoka kwa mtu wa kigeni msitoe mnyama yeyote kati ya hawa kuwa chakula cha Mungu wenu[a], kwa maana wameharibika na wana kasoro[b]. Hawatakubaliwa kwa ajili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate wa Mungu wenu.” Hapa “mkate” ni nahau ya Kiebrania kuhusu chakula kinachotolewa kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “dosari.” Neno la Kiebrania linamaanisha kasoro inayomfanya mnyama asifae kutolewa kama dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: mliopokea kutoka kwa
  rationale: Nahau ya Kiebrania inayosema kihalisi ‘kutoka mkononi mwa’ huonyesha chanzo; Kiswahili cha kawaida hueleza maana hiyo kwa ‘mliopokea kutoka kwa’.
- source_word: בֶּן נֵכָר
  choice: mgeni
  rationale: Kirai hiki ni nahau inayomaanisha mtu asiye Mwisraeli; ‘mgeni’ ni tafsiri ya kawaida na yenye heshima katika muktadha huu.
- source_word: תַקְרִיבוּ
  choice: msitoe
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuwasilisha au kutoa kitu kwa Mungu. ‘Msitoe’ ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: chakula cha Mungu wenu
  rationale: Ingawa לֶחֶם kwa kawaida ni ‘mkate,’ hapa ni nahau ya kikuhani kuhusu chakula kinachotolewa kwa Mungu; ‘chakula’ huepuka dhana kwamba aya inazungumzia mkate halisi pekee.
- source_word: מִכָּל אֵלֶּה
  choice: mnyama yeyote kati ya hawa
  rationale: Kirai kinarejelea wanyama wenye kasoro waliotajwa katika muktadha. Kuongeza ‘mnyama’ kunafanya rejeo liwe wazi katika Kiswahili bila kuongeza wazo jipya.
- source_word: מָשְׁחָתָם
  choice: wameharibika
  rationale: Neno hilo linaonyesha kuharibika au kuumbuka kunakowafanya wanyama wasifae kutolewa; kitenzi hiki ni cha kawaida na kinatofautishwa na ‘kasoro’ inayofuata.
- source_word: מוּם
  choice: kasoro
  rationale: Hili ndilo neno la kawaida katika Walawi 21–22 kwa dosari ya mwili inayomzuia mnyama kukubalika kama dhabihu.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: Hawatakubaliwa kwa ajili yenu
  rationale: Kauli hii inaonyesha kwamba wanyama hao hawatapokelewa kwa kibali kuhusiana na watoaji; ‘kwa ajili yenu’ huhifadhi nguvu ya לָכֶם.
theological_decisions:
- issue: Usemi wa ibada kuhusu zawadi ya dhabihu
  choice: chakula cha Mungu wenu
  alternative: mkate wa Mungu wenu
  rationale: Aya inahusu wanyama wa dhabihu, hivyo ‘chakula’ huwasilisha maana pana ya nahau ya kikuhani bila kudokeza kwamba ni mkate halisi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida, huku nahau ya kikuhani na wazo la kutokubaliwa kwa niaba ya watoaji vikihifadhiwa.
