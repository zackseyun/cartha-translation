source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: sw
  text: '“Mwambie Haruni na wanawe, na Waisraeli wote[a], uwaambie: Mtu yeyote wa nyumba ya Israeli, au mgeni anayeishi Israeli[b], anayetoa sadaka yake kwa ajili ya nadhiri zao zozote au matoleo yao yoyote ya hiari[c], ambayo wanamtolea Yahwe kuwa sadaka ya kuteketezwa—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “wana wote wa Israeli.” Usemi huu wa Kiebrania humaanisha Waisraeli wote.'
    reason: lexical_alternative
  - marker: b
    text: Yaani mgeni asiye Mwisraeli aliyeishi miongoni mwa Israeli chini ya utaratibu wa jamii hiyo.
    reason: lexical_clarification
  - marker: c
    text: Au “sadaka zao zote za nadhiri na matoleo yao yote ya hiari.” Kiebrania kinaweza kurejelea hasa sadaka zinazohusiana na nadhiri.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema na
  rationale: Amri hii ya Piel inaanzisha agizo rasmi la Mungu. ‘Sema na’ ni ya kawaida na yenye hadhi katika Kiswahili cha sheria.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume; katika muktadha huu ni wana wa Haruni walio makuhani.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Hii ndiyo njia ya asili ya Kiswahili ya kuwasilisha nahau ‘wana wote wa Israeli’; tanbihi inahifadhi umbo halisi la ukoo.
- source_word: אִישׁ אִישׁ
  choice: Mtu yeyote
  rationale: Urudiaji huu una maana ya mgawanyo, yaani kila mtu au mtu yeyote. Kiswahili ‘mtu yeyote’ huwasilisha nguvu ya sheria bila kufanya sentensi iwe ngumu.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: wa nyumba ya Israeli
  rationale: Inahifadhi usemi muhimu wa agano ‘nyumba ya Israeli’ badala ya kuufanya kuwa jina la kabila tu.
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: miongoni mwa wageni wanaoishi Israeli
  rationale: גֵּר ni mgeni asiye Mwisraeli aliyekaa kwa kudumu miongoni mwa jamii ya Israeli; wingi wa Kiswahili unaonyesha kundi ambalo mtu huyo anaweza kutoka ndani yake.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: anayetoa sadaka yake
  rationale: Katika muktadha wa ibada, Hiphil ya קרב ni kuleta au kutoa sadaka. ‘Kutoa sadaka yake’ ni Kiswahili cha kawaida na sahihi.
- source_word: לְכָל נִדְרֵיהֶם
  choice: kwa ajili ya nadhiri zao zozote
  rationale: Inahifadhi uwezekano kwamba sadaka hizo zinatolewa kuhusiana na nadhiri, bila kuongeza wazi neno ‘sadaka’ lisilokuwapo hapa.
- source_word: נִדְבוֹתָם
  choice: matoleo yao yoyote ya hiari
  rationale: Hili ni kundi maalumu la sadaka zinazotolewa kwa hiari; ‘matoleo ya hiari’ ni wazi katika Kiswahili cha sasa.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְעֹלָה
  choice: kuwa sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya sadaka inayoteketezwa yote; tafsiri hii ni ya kawaida na inaeleweka.
theological_decisions:
- issue: Lugha ya kiume yenye uwakilishi katika sheria
  choice: Mtu yeyote
  alternative: Mwanamume yeyote
  rationale: אִישׁ אִישׁ ni umbo la kiume la mgawanyo, lakini katika sheria hii linaelekeza kwa yeyote katika makundi yaliyotajwa. ‘Mtu yeyote’ huhifadhi upeo huo bila kuamua kuwa wanaume pekee ndio wanaokusudiwa.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano; ‘Yahwe’ hulitambulisha kama jina binafsi na kulipambanua na cheo ‘Bwana’.
- issue: Uhusiano wa נִדְרֵיהֶם na sadaka
  choice: kwa ajili ya nadhiri zao zozote
  alternative: sadaka zao zote za nadhiri
  rationale: Kiebrania kinaweza kumaanisha sadaka zinazohusiana na nadhiri bila kutaja tena neno ‘sadaka.’ Maandishi makuu yanahifadhi muundo huo, na tanbihi inaonyesha usomaji mahususi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni rasmi na wenye hadhi lakini unaeleweka kwa msomaji wa kawaida. Mstari umeachwa na kistari kirefu kwa kuwa sentensi ya sheria inaendelea katika mstari unaofuata.
