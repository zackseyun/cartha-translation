base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: sw
  text: Msimtolee Yahwe mnyama mwenye mapumbu yaliyobanwa[a], yaliyopondwa, yaliyong’olewa au yaliyokatwa; wala msifanye hivyo katika nchi yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno kwa neno, Kiebrania hutaja hali nne: “yaliyobanwa, yaliyopondwa, yaliyong’olewa au yaliyokatwa.” Muktadha unaonyesha kwamba hali hizo zinahusu mapumbu ya mnyama wa kiume.'
    reason: Ufafanuzi wa maneno na wa kiima kinachoeleweka katika Kiebrania.
lexical_decisions:
- source_word: מָעוּךְ
  choice: yaliyobanwa
  rationale: Neno hili linaonyesha kiungo kilichoharibiwa kwa kubanwa au kushinikizwa. “Yaliyobanwa” hulitofautisha na כָתוּת, ambalo lina maana ya kupondwa.
- source_word: כָתוּת
  choice: yaliyopondwa
  rationale: Neno hili humaanisha kitu kilichopigwa au kupondwa, hivyo tafsiri hii inaweka wazi aina ya pili ya uharibifu.
- source_word: נָתוּק
  choice: yaliyong’olewa
  rationale: Neno hili hueleza kitu kilichotenganishwa kwa kuvutwa au kung’olewa. “Yaliyong’olewa” ni wazi na ya kawaida katika Kiswahili.
- source_word: כָרוּת
  choice: yaliyokatwa
  rationale: Neno hili limetokana na kitenzi cha kukata au kukatilia mbali na hapa linaeleza uharibifu wa kiungo.
- source_word: תַקְרִיבוּ
  choice: msimtolee
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuleta au kutoa kitu kwa Mungu. “Msimtolee” ni cha asili na kinaonyesha tendo la kumtolea Yahwe mnyama.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya moja kwa moja kama “Yahwe,” kulingana na desturi ya mradi.
- source_word: בְאַרְצְכֶם
  choice: katika nchi yenu
  rationale: Tafsiri hii inahifadhi maana ya mahali pana, yaani nchi au ardhi yao, bila kuibana kuwa eneo maalumu.
- source_word: תַעֲשׂוּ
  choice: msifanye hivyo
  rationale: Kitenzi cha Kiebrania ni kipana na kinarejelea kwa ufupi matendo yaliyotajwa. “Msifanye hivyo” huhifadhi upana huo bila kuamua zaidi ya maandishi.
- source_word: kiima kinachoeleweka cha vivumishi vinne
  choice: mapumbu
  rationale: Muktadha unaonyesha kwamba maneno hayo manne yanaeleza uharibifu wa viungo vya uzazi vya mnyama wa kiume. “Mapumbu” ni neno sahihi, la kawaida na lisilo la kizamani.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linawakilisha jina la Kiebrania moja kwa moja na linafuata utaratibu uliowekwa wa mradi bila kuingiza msimamo wa dhehebu.
- issue: Upeo wa katazo la mwisho וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  choice: katazo pana la kufanya hivyo katika nchi yao
  alternative: katazo la kutoa wanyama hao kama dhabihu nchini humo pekee
  rationale: Kitenzi “kufanya” ni kipana na hakitaji tena tendo fulani. “Wala msifanye hivyo” huhifadhi hali hiyo na uwezekano kwamba katazo linahusu vitendo vya kuwaharibu wanyama, si kuwatolea tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa moja kwa moja na unaoeleweka. Neno la anatomia “mapumbu” limetumiwa kwa usahihi na uwazi. Muundo wa wingi “msimtolee/msifanye” unaifuata hotuba iliyoelekezwa kwa jumuiya.
