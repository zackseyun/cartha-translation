base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: sw
  text: Mtu yeyote asiye wa kikuhani asile chakula kitakatifu[a]. Mkaaji wa kuhani[b] wala mfanyakazi wa kuajiriwa wasile chakula kitakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kitu kitakatifu”; hapa neno hilo linarejelea chakula au sehemu takatifu ya sadaka iliyowekwa kwa ajili ya kuliwa na makuhani.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mkaaji au mtegemezi wa muda anayehusishwa na nyumba ya kuhani; pia inaweza kutafsiriwa “mgeni mkazi wa kuhani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: mtu yeyote asiye wa ukoo wa kikuhani
  rationale: Katika muktadha wa chakula cha makuhani, neno hili halimaanishi hasa mgeni wa taifa jingine, bali mtu asiye na haki ya kushiriki chakula hicho kwa kuwa hayumo katika ukoo wa kikuhani. Tafsiri hii inaweka wazi maana ya kimuktadha bila kutumia neno ‘mgeni,’ ambalo lingeweza kueleweka kikabila.
- source_word: קֹדֶשׁ
  choice: chakula kitakatifu
  rationale: Ingawa neno la Kiebrania kwa umbo ni ‘kitu kitakatifu,’ hapa linarejelea sehemu za sadaka zilizowekwa wakfu kwa ajili ya kuliwa na makuhani; ‘chakula kitakatifu’ ni Kiswahili cha kawaida na wazi, huku tanbihi ikihifadhi tafsiri halisi zaidi.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: mkaaji aliye kwa kuhani
  rationale: Kirai hiki kinaonyesha mtu anayeishi au kukaa kwa kuhani lakini si mshiriki wa ukoo wake mwenye haki ya kula chakula kitakatifu. Kauli hii inahifadhi uhusiano huo bila kuamua kwamba lazima awe mgeni wa taifa jingine.
- source_word: שָׂכִיר
  choice: mfanyakazi wa kuajiriwa
  rationale: Neno hili humaanisha mtu anayefanya kazi kwa ujira, tofauti na mshiriki wa kudumu wa nyumba ya kuhani.
- source_word: לֹא יֹאכַל
  choice: asile
  rationale: Umbo la kukataza limetafsiriwa kwa amri hasi ya Kiswahili, inayofaa lugha ya sheria na ni ya moja kwa moja.
- source_word: וְכָל
  choice: mtu yeyote ... asile
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida katazo linalomhusu kila mtu wa kundi lililotajwa, badala ya kufuata neno kwa neno ‘na kila.’
theological_decisions:
- issue: Utambulisho wa זָר katika sheria ya chakula kitakatifu
  choice: Mtu asiye wa ukoo wa kikuhani
  alternative: Mgeni / mtu asiyeidhinishwa
  rationale: Muktadha unahusu haki ya kula sehemu takatifu, si kimsingi utaifa. Hata hivyo, tafsiri haiongezi sharti la kidhehebu; inaeleza mpaka wa ukoo wa kikuhani unaodokezwa na muktadha na mstari unaofuata.
- issue: Hadhi ya תּוֹשַׁב כֹּהֵן
  choice: Mkaaji aliye kwa kuhani
  alternative: Mgeni mkazi wa kuhani
  rationale: Kiebrania kinaweza kueleweka kama mkaaji au mtegemezi anayehusishwa na nyumba ya kuhani. Tafsiri kuu haifungi maana kwenye hadhi ya ugeni wa kikabila, na tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa sheria ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Asile’ limetumiwa kwa katazo la kisheria; ‘chakula kitakatifu’ huepuka Kiswahili kigumu cha ‘kitu kitakatifu’ katika muktadha wa chakula. Alama zote za tanbihi zimewekwa katika matini.
