translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sheria ni wa heshima lakini rahisi kueleweka. “Mnyama huyo” huepusha matumizi yasiyo ya kawaida ya “yeye” peke yake kwa mnyama, huku ikihifadhi rejeleo la umoja. Alama za tanbihi zote zimewekwa katika matini kuu.
