translation:
  language: sw
  text: Iwe ni ng’ombe au kondoo, msimchinje mnyama huyo pamoja na mtoto wake siku hiyo hiyo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo karibu zaidi na maneno ya Kiebrania, “siku moja.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “yeye na mwana wake.” Usemi huu unamaanisha mnyama pamoja na uzao wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno hili hutaja mnyama wa jamii ya ng’ombe. “Ng’ombe” ni neno la kawaida na halibainishi jinsia isiyotajwa wazi katika mstari huu.
- source_word: שֶׂה
  choice: kondoo
  rationale: Neno hili linaweza kutaja mnyama mmoja wa kundi la kondoo au mbuzi. Katika ulinganifu huu wa kisheria na wa dhabihu, “kondoo” ni tafsiri ya kawaida na inayoeleweka, bila kuifanya kuwa mwana-kondoo.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: mnyama huyo pamoja na mtoto wake
  rationale: Kiebrania kinasema kihalisi “yeye na mwana wake.” “Mnyama huyo pamoja na mtoto wake” ni Kiswahili cha asili kinachorejelea mnyama na uzao wake bila kuongeza kwamba wa kwanza ni mama.
- source_word: תִשְׁחֲטוּ
  choice: msimchinje
  rationale: Kitenzi שׁחט humaanisha kuchinja mnyama, hasa katika mazingira ya sheria na dhabihu. Umbo la wingi “msimchinje” linahifadhi wingi wa wanaoamriwa katika Kiebrania.
- source_word: בְּיוֹם אֶחָד
  choice: siku moja
  rationale: Hii ndiyo maana ya karibu ya maneno ya Kiebrania, nayo inaweka wazi kwamba wanyama hao wawili hawapaswi kuchinjwa ndani ya siku moja. Kiswahili cha kiidioma zaidi, “siku iyo hiyo,” kimetolewa katika tanbihi.
- source_word: וְ ... אוֹ
  choice: Iwe ni ... au
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida kwamba sheria inahusu mojawapo ya aina mbili zilizotajwa, badala ya kutafsiri kiunganishi cha mwanzo kwa “na” isiyo ya asili hapa.
