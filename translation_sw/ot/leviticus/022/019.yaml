  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: sw
  text: Ili ikubaliwe kwa ajili yenu, ni lazima iwe dume asiye na kasoro kutoka katika ng’ombe, kondoo au mbuzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: Ili ikubaliwe kwa ajili yenu
  rationale: Kirai hiki kinaonyesha kusudi la sadaka kukubaliwa kwa niaba au manufaa ya watoaji; muundo huu ni wa kawaida katika Kiswahili na hauamui zaidi ya inavyosema Kiebrania.
- source_word: תָּמִים
  choice: asiye na kasoro
  rationale: Katika sheria za dhabihu, neno hili humaanisha mnyama mkamilifu kimwili, yaani asiye na dosari inayomfanya asifae kutolewa; ‘asiye na kasoro’ ni usemi wazi na uliozoeleka.
- source_word: זָכָר
  choice: dume
  rationale: Hutaja jinsia ya mnyama kwa usahihi na kwa lugha ya kawaida.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: kutoka katika ng’ombe, kondoo au mbuzi
  rationale: Inahifadhi aina tatu za mifugo zinazoorodheshwa katika chanzo; ‘au’ huwasilisha uchaguzi kati ya makundi hayo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya sadaka kuwa לרצנכם
  choice: Ili ikubaliwe kwa ajili yenu
  alternative: Ili mpate kibali
  rationale: Chaguo hili linaacha wazi ikiwa kinachokubaliwa ni sadaka yenyewe au athari yake kwa watoaji, bila kuligeuza moja kwa moja kuwa dai kwamba watoaji wenyewe wanapata kibali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo ‘ni lazima iwe’ unaonyesha sharti la kisheria; majina ya mifugo yametumiwa kwa maana yake ya kawaida.
