id: LEV.22.3
reference: Leviticus 22:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: sw
  text: 'Waambie: Katika vizazi vyenu vyote, mwanamume yeyote wa uzao wenu atakayevikaribia vitu vitakatifu ambavyo Waisraeli[a] wanaviweka wakfu kwa Yahweh, wakati unajisi wake uko juu yake, mtu huyo atakatiliwa mbali[b] kutoka mbele zangu.[c] Mimi ni Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli,” yaani, Waisraeli.'
    reason: lexical_alternative
  - marker: b
    text: “Atakatiliwa mbali” ni fomula ya kawaida ya adhabu katika agano; namna kamili ya kuondolewa huko inajadiliwa.
    reason: alternative_reading
  - marker: c
    text: Au, “kutoka katika uwepo wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: Waambie
  rationale: Kauli ya kuamuru katika umoja, ikimwelekeza Musa aseme nao; “Waambie” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לְדֹרֹתֵיכֶם
  choice: Katika vizazi vyenu vyote
  rationale: Inawasilisha fomula ya kisheria inayoonyesha kuwa agizo linaendelea kutumika kizazi baada ya kizazi.
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: mwanamume yeyote wa uzao wenu atakaye...
  rationale: “Mwanamume yeyote” inadumisha umbo la kiume la אִישׁ, linalohusu wanaume wa ukoo wa kikuhani katika muktadha; “uzao” huhifadhi wazo la nasaba.
- source_word: יִקְרַב
  choice: atakayevikaribia
  rationale: Kitenzi קרב katika muktadha wa kikuhani kina maana ya kukaribia vitu vya ibada; tafsiri hii huhifadhi taswira ya kimahali na ya kiibada.
- source_word: הַקֳּדָשִׁים
  choice: vitu vitakatifu
  rationale: Usemi huu mpana unalingana na nomino ya Kiebrania ya wingi bila kuibana kuwa aina moja tu ya sadaka au zawadi.
- source_word: יַקְדִּישׁוּ
  choice: wanaviweka wakfu
  rationale: Hiphil ya קדשׁ humaanisha kutenga au kufanya kitu kiwe kitakatifu; “kuweka wakfu” ni ya sasa, inayoeleweka, na inafaa kwa lugha ya ibada.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ni Kiswahili cha kawaida na cha heshima kwa maana ya “wana wa Israeli”; tanbihi inahifadhi muundo halisi wa Kiebrania.
- source_word: לַיהוָה / יְהוָה
  choice: kwa Yahweh / Mimi ni Yahweh
  rationale: Jina la agano יהוה limetolewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: wakati unajisi wake uko juu yake
  rationale: Huhifadhi taswira halisi ya hali ya unajisi kuwa “juu yake,” badala ya kuirahisisha tu kuwa “akiwa najisi.”
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: mtu huyo atakatiliwa mbali
  rationale: “Mtu huyo” ni Kiswahili cha kawaida kwa נֶפֶשׁ katika fomula ya kisheria; “atakatiliwa mbali” huhifadhi fomula ya adhabu bila kuamua namna yake mahsusi.
- source_word: מִלְּפָנַי
  choice: kutoka mbele zangu
  rationale: Tafsiri hii huhifadhi taswira ya uso/mahali iliyomo katika Kiebrania, huku tanbihi ikitoa maana mbadala ya “uwepo.”
theological_decisions:
- issue: Maana ya fomula ya adhabu וְנִכְרְתָה (“atakatiliwa mbali”)
  choice: Imehifadhiwa kama “atakatiliwa mbali” bila kutaja namna mahsusi ya adhabu.
  alternative: “atauawa,” “atatengwa na jumuiya,” au “ataondolewa katika agano”
  rationale: Kifungu hakifafanui kama adhabu ni kifo, kutengwa na jumuiya, au tendo la Mungu. Tafsiri inadumisha utata halisi wa kisheria na kitheolojia.
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מִלְּפָנַי
  choice: kutoka mbele zangu
  alternative: kutoka katika uwepo wangu
  rationale: Maana zote mbili zinawezekana. Matini kuu huhifadhi taswira ya Kiebrania, na tanbihi inaonyesha maana ya kiistilahi ya “uwepo” bila kuifunga tafsiri kwa moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya kisheria na kiibada lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapobeba maana ya kiibada au utata wa kitheolojia; tanbihi zimetumiwa pale tafsiri ya neno kwa neno ingeweza kuficha maana mbadala.
