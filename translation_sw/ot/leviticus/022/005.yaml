base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: sw
  text: au mtu anayegusa kiumbe chochote kitambaacho kinachomtia unajisi[a], au anayegusa mtu ambaye humtia unajisi kwa aina yoyote ya unajisi alio nao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiumbe chochote kiendacho kwa makundi.” Neno la Kiebrania hutaja viumbe vidogo vinavyosongamana au kwenda karibu na ardhi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia maneno ya umoja wa kiume kwa maana ya jumla ya kisheria. Kifungu cha mwisho kinaweza pia kutafsiriwa, “kwa unajisi wowote alio nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi cha kutenganisha kinachoendeleza orodha kutoka mstari uliotangulia.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa Kiebrania kina umoja wa kiume, katika sheria hii neno linatumika kwa maana ya jumla; “mtu” ni la kawaida na wazi katika Kiswahili.
- source_word: יִגַּע
  choice: anayegusa
  rationale: “Kugusa” ni tafsiri ya kawaida na sahihi katika sheria za unajisi.
- source_word: בְּכָל שֶׁרֶץ
  choice: kiumbe chochote kitambaacho
  rationale: שֶׁרֶץ hutaja viumbe vidogo vinavyosongamana au kwenda karibu na ardhi; “kitambaacho” ni neno la kawaida la kibiblia bila kubainisha aina fulani ya mnyama.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: ambacho humfanya kuwa najisi
  rationale: Kifungu kinaonyesha chanzo au njia ambayo mtu anapata unajisi wa kiibada.
- source_word: בְאָדָם
  choice: mtu
  rationale: אָדָם hapa humaanisha binadamu ambaye anaweza kuwa chanzo cha unajisi; “mtu” huhifadhi maana hiyo ya jumla.
- source_word: אֲשֶׁר יִטְמָא לוֹ לְכֹל טֻמְאָתוֹ
  choice: ambaye kwa kumgusa anakuwa najisi, kwa aina yoyote ya unajisi wake
  rationale: Tafsiri hii hufanya uhusiano wa kugusa uliodokezwa na muktadha uwe wazi, huku ikihifadhi upana wa לְכֹל טֻמְאָתוֹ na kurejelea unajisi wa mtu anayeguswa.
- source_word: טֻמְאָה
  choice: unajisi
  rationale: “Unajisi” ni istilahi iliyozoeleka katika Kiswahili kwa hali ya kutokuwa safi kiibada na hudumisha uhusiano na “najisi.”
theological_decisions:
- issue: Asili ya lugha ya טמא / טֻמְאָה katika sheria za Walawi
  choice: najisi / unajisi wa kiibada
  alternative: uchafu au hali ya kutokuwa safi kwa maana ya maadili
  rationale: Muktadha unahusu masharti ya usafi wa kiibada kwa makuhani, si lazima hatia ya kimaadili; kwa hiyo lugha haipaswi kufanywa ya kimaadili zaidi ya chanzo.
- issue: Mhusika anayerejelewa na “unajisi wake”
  choice: Kiwakilishi “wake” kimeachwa kirejelee mtu anayeguswa, kama sarufi ya karibu ya Kiebrania inavyopendekeza.
  alternative: Kukifafanua kuwa unajisi wa mtu anayegusa
  rationale: Kiebrania ni kifupi na kinaweza kusikika kigumu; tafsiri huhifadhi muundo na mvutano huo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Najisi/unajisi” imetumiwa kama istilahi ya usafi wa kiibada. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
