lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akamwambia
  rationale: Katika Kiswahili cha kawaida, kitenzi hiki pamoja na אֶל na mhusika anayelengwa hutafsiriwa kwa kawaida kuwa “akamwambia.” Hii inaanzisha sehemu mpya ya hotuba kwa ufasaha bila kurudia kwa namna isiyo ya asili “alisema ... akisema.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kuwa “Yahwe,” umbo linaloeleweka katika Kiswahili na linalohifadhi matumizi ya jina binafsi badala ya kulibadili kuwa cheo.
- source_word: אֶל מֹשֶׁה
  choice: Musa
  rationale: Kiambishi cha yambwa “-mw-” katika “akamwambia” kinawakilisha אֶל, na “Musa” ni umbo la kawaida la jina מֹשֶׁה katika Kiswahili.
- source_word: לֵאמֹר
  choice: imewasilishwa kwa alama ya mkato baada ya “Musa”
  rationale: Infinitivu hii hutanguliza maneno yatakayofuata. Kwa kuwa maudhui ya hotuba yanaanza katika mstari unaofuata, mkato unaonyesha kuwa sentensi inaendelea; kutafsiri kihalisi “akisema” kungekuwa marudio yasiyo ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni, jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku tanbihi ikionyesha umbo la Kiebrania na mapokeo mengine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akamwambia Musa” ni wa asili zaidi kuliko “alisema na Musa, akisema,” lakini mkato umehifadhi kazi ya לֵאמֹר ya kutanguliza hotuba inayofuata.
