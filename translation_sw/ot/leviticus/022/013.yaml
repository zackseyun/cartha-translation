  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: sw
  text: Lakini binti wa kuhani akiwa mjane au ameachika, naye hana uzao, akirudi nyumbani kwa baba yake kama katika ujana wake, anaweza kula chakula cha baba yake[a]. Lakini mtu yeyote wa nje[b] haruhusiwi kula chakula hicho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “mkate wa baba yake.” Hapa “mkate” yaelekea kumaanisha kwa upana chakula kilichotolewa kwa nyumba ya kuhani.'
    reason: lexical_alternative
  - marker: b
    text: Au “mtu asiye na ruhusa.” Neno la Kiebrania linamaanisha mtu aliye nje ya kundi lililoruhusiwa kula, si lazima mtu wa taifa jingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן כִּי תִהְיֶה
  choice: Lakini binti wa kuhani akiwa
  rationale: Kiunganishi kinaendeleza utofautishaji na sheria iliyotangulia, huku muundo wa sharti ukitafsiriwa kwa Kiswahili cha kawaida bila kuufanya kuwa taarifa ya lazima.
- source_word: אַלְמָנָה וּגְרוּשָׁה
  choice: mjane au ameachwa na mume wake
  rationale: Ingawa Kiebrania hutumia kiunganishi kinachoweza kutafsiriwa ‘na,’ hapa hali hizo ni njia mbili mbadala. ‘Ameachwa na mume wake’ ni usemi wa kawaida unaoonyesha kuwa ndoa imevunjwa bila kuingiza istilahi ya kidhehebu.
- source_word: וְזֶרַע אֵין לָהּ
  choice: naye hana mtoto
  rationale: Neno זֶרַע, yaani ‘mbegu/uzao,’ humaanisha mtoto au mzao katika muktadha huu. ‘Hana mtoto’ ni wazi na la kawaida, bila kudai kuwa kinachokusudiwa ni mtoto wa umri fulani.
- source_word: וְשָׁבָה אֶל־בֵּית אָבִיהָ כִּנְעוּרֶיהָ
  choice: akirudi nyumbani kwa baba yake kama alivyokuwa wakati wa ujana wake
  rationale: Tafsiri hii inadumisha wazo la kurudi katika nyumba ya baba na hali yake ya awali kabla ya ndoa, badala ya kuonyesha tu kwamba anarudi akiwa na umri mdogo.
- source_word: מִלֶּחֶם אָבִיהָ תֹּאכֵל
  choice: anaweza kula chakula cha baba yake[a]
  rationale: לֶחֶם kwa msingi ni ‘mkate,’ lakini hapa inatumika kwa upana kuhusu chakula au mgao wa chakula katika nyumba ya kuhani. ‘Anaweza’ huonyesha ruhusa ya kisheria.
- source_word: וְכָל־זָר לֹא־יֹאכַל בּוֹ
  choice: Lakini mtu yeyote wa nje[b] haruhusiwi kula chakula hicho
  rationale: זָר hapa si lazima mgeni wa taifa jingine, bali mtu aliye nje ya kundi linaloruhusiwa kula. ‘Haruhusiwi’ huwasilisha katazo la kisheria kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya ‘chakula cha baba yake’ katika sheria ya ukuhani
  choice: Kutafsiri לֶחֶם kama ‘chakula,’ huku maana halisi ‘mkate’ ikiwekwa katika tanbihi.
  alternative: ‘mkate wa baba yake’
  rationale: Muktadha wa Mambo ya Walawi 22 unahusu haki ya kula vyakula vitakatifu au mgao wa chakula wa nyumba ya kuhani. ‘Chakula’ kinawasilisha maana pana bila kubainisha zaidi ya maandiko.
- issue: Utambulisho wa זָר
  choice: ‘mtu wa nje,’ akifafanuliwa kuwa mtu asiye katika kundi lenye ruhusa
  alternative: ‘mgeni’ au ‘mtu asiye na ruhusa’
  rationale: ‘Mgeni’ lingeweza kueleweka kimakosa kuwa mtu wa kabila au taifa jingine. Tafsiri na tanbihi zinadumisha wazo la kutostahili kisheria bila kuingiza tofauti ya kikabila.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ina mtiririko wa sheria lakini imegawanywa kwa alama ya nukta ili katazo la mwisho lisomeke wazi. Istilahi za kigeni au za dhehebu zimeepukwa.
