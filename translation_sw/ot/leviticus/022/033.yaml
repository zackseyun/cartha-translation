  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: sw
  text: aliyewatoa kutoka nchi ya Misri ili awe Mungu wenu. Mimi ni Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH” (kwa kawaida hutafsiriwa “BWANA”; pia hunukuliwa “Yehova”).'
    reason: Huonyesha jina la Kiebrania na unukuzi mbadala unaotumiwa kwa kawaida.
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: aliyewatoa
  rationale: Kauli ya kusababisha katika umbo la participle humweleza Yahwe kuwa yule aliyesababisha watoke; kishazi cha Kiswahili “aliyewatoa” ni cha asili na hudumisha uhusiano huo.
- source_word: אֶתְכֶם
  choice: -wa- katika “aliyewatoa”
  rationale: Kiambishi cha nafsi ya pili wingi kimeingizwa katika kitenzi, kama sarufi ya kawaida ya Kiswahili inavyotaka.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi neno “nchi” la fomula ya Kutoka na kueleza mahali walikotolewa bila ugumu wa tafsiri ya neno kwa neno.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: ili awe Mungu wenu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya agano na uhusiano iliyomo katika “kuwa Mungu kwenu,” huku wingi wa walengwa ukionekana katika “wenu.”
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: Huhifadhi kauli ya kujitambulisha na kulitaja moja kwa moja jina la agano יהוה.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” ni unukuzi wa jina la agano lililo katika maandishi ya Kiebrania, badala ya kulibadili kuwa cheo. Tanbihi inaonyesha desturi nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Aya inaanza kwa kishazi tegemezi kwa sababu inaendeleza sentensi ya mstari uliotangulia. Alama ya tanbihi imewekwa baada ya “Yahwe,” ambako inahusika moja kwa moja.
