base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: sw
  text: Watashika wajibu wangu, ili wasibebe dhambi kwa sababu ya jambo hilo[a] na kufa kwa sababu yake[b] kwa kulitia unajisi[c]. Mimi ni Yahwe ninayewatakasa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasijiletee hatia kwa sababu ya jambo hilo.” Nahau ya Kiebrania inayosema “kubeba dhambi” inaweza kumaanisha kuwa na hatia au kuwajibika kwa kosa.
    reason: lexical_alternative
  - marker: b
    text: Au “na kufa kwa hilo.”
    reason: lexical_alternative
  - marker: c
    text: Au “kwa kulidhalilisha” au “kwa kulitendea kama jambo la kawaida.”
    reason: lexical_alternative
  - marker: d
    text: Au “ninayewafanya watakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: wataushika
  rationale: Kitenzi שׁמר katika maagizo ya kikuhani humaanisha kushika, kutunza, au kuzingatia. “Wataushika” kinadumisha muundo wa kisheria wa Kiebrania na wazo la kutekeleza wajibu.
- source_word: מִשְׁמַרְתִּי
  choice: wajibu niliowakabidhi
  rationale: Katika muktadha wa kikuhani, מִשְׁמֶרֶת ni jukumu au wajibu uliokabidhiwa mtu autunze. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la dhamana iliyokabidhiwa.
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: wasibebe dhambi kwa sababu ya jambo hilo
  rationale: Nahau נשׂא חטא inaweza kumaanisha kubeba dhambi au kujiletea hatia. “Kubeba dhambi” inadumisha taswira ya Kiebrania, huku “kwa sababu ya jambo hilo” ikiwakilisha עָלָיו bila kubainisha mno jambo linalorejelewa.
- source_word: וּמֵתוּ בוֹ
  choice: na kufa kwa sababu yake
  rationale: בּוֹ hapa huonyesha uhusiano wa kisababishi na kifo. “Kwa sababu yake” ni Kiswahili cha asili zaidi kuliko tafsiri ya neno kwa neno, huku kikiendeleza kiwakilishi kisichobainishwa wazi.
- source_word: יְחַלְּלֻהוּ
  choice: wakilitia unajisi
  rationale: חלל katika muktadha wa utakatifu humaanisha kunajisi au kulitendea jambo takatifu kana kwamba ni la kawaida. “Kulitia unajisi” linafaa kwa lugha ya Walawi na haliongezi kitu maalumu kisichotajwa katika mstari.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: מְקַדְּשָׁם
  choice: ninayewatakasa
  rationale: Umbo hili la קדשׁ humtaja Yahwe kuwa ndiye anayewaweka watu hao wakfu na kuwafanya watakatifu. “Ninayewatakasa” linadumisha msamiati mkuu wa utakatifu katika Walawi.
theological_decisions:
- issue: Kirejelewa cha viwakilishi katika “kwa sababu ya jambo hilo,” “kwa sababu yake,” na “wakilitia unajisi”
  choice: Kirejelewa kimeachwa kuwa “jambo hilo,” yaani jambo takatifu au wajibu unaozungumziwa, bila kukitaja kwa uhakika zaidi.
  alternative: Kukitambulisha moja kwa moja kuwa chakula kitakatifu, au kuwa wajibu wa Yahwe pekee.
  rationale: Kiebrania kina viwakilishi vya umoja bila kurudia nomino. Muktadha unahusu vitu vitakatifu na pia unataja wajibu wa Yahwe; kwa hiyo tafsiri haipaswi kuondoa utata huo kwa kuongeza kirejelewa mahususi.
- issue: Maana ya מְקַדְּשָׁם
  choice: ninayewatakasa
  alternative: ninayewafanya watakatifu
  rationale: Chaguo la “ninayewatakasa” linahifadhi wazo kwamba Yahwe ndiye chanzo cha kuwekwa kwao wakfu, bila kufafanua zaidi namna utakaso huo unavyotendeka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Wajibu niliowakabidhi” huepuka usemi mgumu wa moja kwa moja kama “lindo langu,” na “jambo hilo” huhifadhi kutobainika kwa viwakilishi vya Kiebrania.
