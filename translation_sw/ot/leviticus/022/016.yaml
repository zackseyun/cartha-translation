base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: sw
  text: na hivyo kuwafanya wabebe hatia inayodai fidia[a] kwa kula vitu vitakatifu vyao[b], kwa maana mimi ni Yahwe, ninayewatakasa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hivyo kuwaletea hatia.” Usemi wa Kiebrania ni mgumu na huenda ukasisitiza kuwajibika kwa kosa linalodai fidia.
    reason: lexical_alternative
  - marker: b
    text: “Vitu vitakatifu vyao” ni sehemu au matoleo yaliyowekwa wakfu.
    reason: cultural_note
  - marker: c
    text: Au, “ninayewafanya watakatifu” au “ninayewaweka wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: na hivyo kuwatwika
  rationale: Hifili ya נשׂא ina maana ya kusababisha mtu kubeba jambo. “Kuwatwika” hudumisha taswira ya kubeba hatia, huku “na hivyo” ikionyesha matokeo yanayounganisha mstari huu na katazo lililotangulia.
- source_word: אוֹתָם
  choice: wa- (wao)
  rationale: Kiwakilishi cha yambwa cha wingi kimewakilishwa kwa kiambishi cha Kiswahili “wa-” katika “kuwatwika” na “kuwatakasa,” bila kulazimisha utambulisho wa wahusika zaidi ya sarufi ya Kiebrania.
- source_word: עֲוֺן אַשְׁמָה
  choice: hatia inayodai fidia
  rationale: Muungano huu unaeleza hatia au uwajibikaji wa kosa unaohusiana na ulipaji wa fidia katika muktadha wa ibada. “Inayodai fidia” ni Kiswahili cha kawaida na hudumisha uzito wa kisheria na kiibada.
- source_word: בְּאָכְלָם
  choice: kwa kula
  rationale: ב pamoja na kitenzi-jina huonyesha njia au hali; “kwa kula” huhifadhi maana hiyo kwa ufupi na kwa kawaida.
- source_word: קָדְשֵׁיהֶם
  choice: vitu vyao vitakatifu
  rationale: Hii ni tafsiri ya karibu ya maneno ya Kiebrania. Tanbihi inaeleza kuwa katika muktadha huu ni sehemu au matoleo yaliyowekwa wakfu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa na cheo.
- source_word: מְקַדְּשָׁם
  choice: ninayewatakasa
  rationale: Kitenzi hiki kinaweza kumaanisha kutakasa, kufanya watakatifu, au kuweka wakfu. “Ninayewatakasa” hudumisha sajili ya kiibada na ya kitheolojia ya Walawi.
theological_decisions:
- issue: Kirejelewa cha kiambishi “-wa-” katika kishazi cha mwisho
  choice: Yahwe anawatakasa watu wanaozungumziwa
  alternative: Yahwe anavitakasa vitu vitakatifu
  rationale: Kiambishi cha Kiebrania kinaelekea kwa kawaida kuwarejelea watu wanaozungumziwa katika muktadha. Tafsiri “ninayewatakasa” huhifadhi sarufi hiyo bila kuongeza ufafanuzi mwembamba ndani ya matini.
- issue: Uzito wa kiibada wa עֲוֺן אַשְׁמָה
  choice: hatia inayodai fidia
  alternative: hatia; adhabu ya kosa
  rationale: Tafsiri hii inaonyesha kwamba si hisia ya kuwa na hatia tu, bali uwajibikaji wa kosa wenye athari ya fidia katika mfumo wa kiibada, bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuwatwika hatia” huhifadhi taswira ya Kiebrania bila kuwa kigumu kupita kiasi; tanbihi zinaweka wazi ugumu wa usemi na maana ya kiibada.
