  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: sw
  text: Mtu atakayekigusa atakuwa najisi mpaka jioni, wala hatakula chochote miongoni mwa vitu vitakatifu[a] isipokuwa awe ameosha mwili wake kwa maji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matoleo matakatifu” au “vitu vilivyowekwa wakfu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ameosha nyama yake kwa maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria hii neno hili humaanisha mtu binafsi, si nafsi isiyo ya kimwili. “Mtu” ni Kiswahili cha kawaida na huhifadhi nguvu ya kauli ya sheria.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: atakayekigusa
  rationale: Kitenzi cha Kiebrania ni cha kike kwa sababu נֶפֶשׁ ni nomino ya kisarufi ya kike, si kwa sababu mtu huyo lazima awe mwanamke. Kiambishi “-ki-” kinaelekeza kwenye kitu au chanzo cha unajisi kilichotajwa katika muktadha uliotangulia bila kudai kuwa ni mwanamume.
- source_word: וְטָמְאָה
  choice: atakuwa najisi
  rationale: Kauli inaonyesha hali ya ibada inayotokana na kugusa. “Atakuwa najisi” inafaa katika lugha ya sheria na haiongezi wazo la hatia ya kimaadili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hii ni namna ya kawaida na ya asili ya Kiswahili ya kuonyesha muda ambao unajisi unaendelea.
- source_word: וְלֹא יֹאכַל
  choice: wala hatakula
  rationale: Kauli hii inaendeleza katazo au kizuizi cha kisheria. “Wala hatakula” hudumisha mfuatano wa sentensi na uzito wa sheria.
- source_word: מִן הַקֳּדָשִׁים
  choice: chochote katika vitu vitakatifu
  rationale: Wingi huu unarejelea vitu au vyakula vilivyowekwa wakfu. “Chochote katika” huonyesha maana ya sehemu iliyomo katika kihusishi מִן.
- source_word: כִּי אִם
  choice: mpaka
  rationale: Katika muktadha huu nahau hii inaweka sharti linalopaswa kutimizwa kabla ya kula. “Mpaka awe ameosha” ni Kiswahili cha asili kinachoeleza kizuizi hicho bila kubadili maana.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: awe ameosha mwili wake kwa maji
  rationale: Ingawa בָּשָׂר kihalisi ni “nyama,” hapa humaanisha mwili wa mtu. Tafsiri hii ni wazi katika Kiswahili cha sasa na huhifadhi tendo halisi la kuosha kwa maji.
theological_decisions:
- issue: Asili ya unajisi unaotajwa
  choice: unajisi wa kiibada
  alternative: uchafu au hatia ya kimaadili
  rationale: Muktadha unahusu kustahili kula vitu vitakatifu baada ya kugusa chanzo cha unajisi na kuosha mwili. Neno “najisi” linahifadhi hali ya kiibada bila kuingiza hatia ya kimaadili ambayo mstari hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Viashiria vya tanbihi vimewekwa baada ya maneno yanayohusika, na rejeo lisilo dhahiri kwa chanzo cha unajisi limeachwa likitegemea muktadha uliotangulia.
