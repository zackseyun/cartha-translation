base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: sw
  text: Lakini kuhani akinunua mtu kwa fedha yake kama mali yake[a], mtu huyo anaruhusiwa kula chakula hicho[b]; na waliozaliwa katika nyumba yake wanaruhusiwa kula chakula chake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi ni “mtu, mali iliyopatikana kwa fedha yake,” yaani mtu aliyenunuliwa kwa fedha yake kama mali yake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi ni “anaweza kula humo/katika hicho.” Kiwakilishi hicho kinaeleweka katika muktadha kuwa kinarejelea chakula kitakatifu cha kuhani.
    reason: clarification
  - marker: c
    text: Kiebrania kihalisi ni “mkate wake”; hapa “mkate” huenda inamaanisha kwa upana chakula cha kikuhani alichopewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: Lakini kuhani akimnunua
  rationale: Muundo huu unaendeleza sheria ya kisa huku ukionyesha tofauti na mstari uliotangulia. Kiambishi -ki- kinatoa sharti kwa Kiswahili cha kawaida.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: akimnunua mtu
  rationale: Kitenzi קנה hapa ni kupata kwa kununua, na נֶפֶשׁ humaanisha binadamu, si nafsi isiyo ya mwili.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: kwa fedha yake kuwa mali yake
  rationale: Tafsiri hii inaonyesha wazi kwamba mtu huyo alinunuliwa kwa fedha na kuhesabiwa kuwa mali, bila kulainisha hali ya kisheria iliyo katika Kiebrania.
- source_word: הוּא יֹאכַל בּוֹ
  choice: mtu huyo anaruhusiwa kula chakula hicho
  rationale: הוּא inamrejelea mtu aliyenunuliwa. Katika sheria hii kitenzi kinaonyesha ruhusa, na kiwakilishi בּוֹ kinarejelea chakula kitakatifu kinachozungumziwa katika muktadha.
- source_word: וִילִיד בֵּיתוֹ
  choice: waliozaliwa nyumbani mwake
  rationale: Kirai hiki kinataja kwa maana ya pamoja watu waliozaliwa katika nyumba ya kuhani; viwakilishi na kitenzi vinavyofuata ni vya wingi.
- source_word: בְלַחְמוֹ
  choice: chakula chake
  rationale: לֶחֶם maana yake ya msingi ni mkate, lakini hapa inaweza kutaja kwa upana chakula cha kikuhani alichopewa.
theological_decisions:
- issue: Neno la kisheria linalohusiana na utumwa na umiliki
  choice: kwa fedha yake kuwa mali yake
  alternative: aliyemnunua kwa fedha yake
  rationale: Chaguo hili linahifadhi wazi hali ya umiliki iliyo katika קִנְיַן כַּסְפּוֹ badala ya kuibadili kuwa huduma ya kawaida. Hii ni uaminifu wa kileksika, si kuhalalisha mfumo huo.
- issue: Nguvu ya vitenzi katika sheria hii
  choice: anaruhusiwa kula / wanaruhusiwa kula
  alternative: atakula / watakula
  rationale: Katika muktadha, sentensi inaweka ruhusa ya kula chakula kitakatifu, tofauti na katazo la mstari uliotangulia; tafsiri ya ruhusa inaeleza kazi ya vitenzi bila kuyafanya kuwa amri ya lazima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti umetolewa kwa -ki-, huku “mtu huyo” ikiondoa utata wa anayekula. Lugha ya umiliki imehifadhiwa kwa uwazi kwa sababu iko katika matini chanzi.
