  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: sw
  text: Kwa hiyo, mtazishika amri zangu na kuzitekeleza. Mimi ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: יהוה (YHWH); kwa kawaida hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kwa hiyo, mtazishika
  rationale: Kitenzi שׁמר katika muktadha wa sheria na agano humaanisha kushika au kuzingatia. Kiunganishi וּ kinaendeleza hitimisho la maelekezo yaliyotangulia; “Kwa hiyo” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: מִצְוֺתַי
  choice: amri zangu
  rationale: מִצְוָה ni amri; “amri zangu” ni usemi wa kawaida, wenye heshima, na unaofaa muktadha wa Torati.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: na kuzitekeleza
  rationale: Ingawa maana ya moja kwa moja ni “na kuzifanya,” Kiswahili hutumia kwa ufasaha zaidi “kuzitekeleza” kuhusu amri. Hii inadumisha utofauti kati ya kuzishika na kuzifanya kwa vitendo.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: “Mimi ni” linahifadhi msisitizo wa fomula ya kujitambulisha, na Yahwe ni uwasilishaji wa jina la agano יְהוָה kwa herufi za Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu. “Yahwe” hulitaja moja kwa moja badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza desturi nyingine za kulitafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kuzitekeleza” ni fasaha zaidi kuliko “kuzifanya” inapohusu amri, bila kufuta jozi ya Kiebrania ya kushika na kufanya.
