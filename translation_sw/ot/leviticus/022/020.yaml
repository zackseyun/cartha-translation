review_pass:
  verdict: revise
  source_fidelity: Mnyama yeyote narrows the Hebrew כֹּל אֲשֶׁר (“anything/whatever”) to an animal. Although the immediate sacrificial context concerns animals, the source wording is deliberately comprehensive; Kiswahili can preserve this without becoming unnatural. The prohibition and the acceptance-on-behalf sense are otherwise conveyed accurately.
  naturalness: The draft is clear and suitably formal. “Msikitoe kuwa sadaka” is understandable, but “msikitoe kama sadaka” is more idiomatic. With the source’s broader referent retained, agreement should be adjusted from the animate singular forms to a neutral noun-class form.
  terminology: “Dosari” is an appropriate dignified term for מוּם in a sacrificial context. “Kukubaliwa” appropriately conveys לְרָצוֹן without adding theological interpretation.
  issues:
  - severity: medium
    issue: “Mnyama yeyote” restricts the source expression.
    rationale: כֹּל אֲשֶׁר בּוֹ מוּם literally denotes anything in which there is a blemish. The surrounding context may make animals expected offerings, but this verse itself does not state “animal.”
  - severity: low
    issue: Verb and pronoun agreement follows the added animate noun rather than the source’s broad expression.
    rationale: Retaining “kitu chochote” requires “msikitoe” and “hakutakubaliwa,” which also preserves the impersonal breadth of the Hebrew.
  revised_text: Kitu chochote kilicho na dosari[a] msikitoe kama sadaka, kwa maana hakutakubaliwa kwa ajili yenu.[b]
