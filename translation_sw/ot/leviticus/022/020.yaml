  text: כֹּ֛ל אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א תַקְרִ֑יבוּ כִּי לֹ֥א לְ/רָצ֖וֹן יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: sw
  text: Kitu chochote kilicho na dosari[a] msikitoe kama sadaka, kwa maana hakutakubaliwa kwa ajili yenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilicho na kasoro.” Neno la Kiebrania mara nyingi humaanisha dosari ya mwili inayofanya sadaka isitakubalike.
    reason: lexical_alternative
  - marker: b
    text: Au, “hakutakubalika kwa niaba yenu.”
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: Mnyama yeyote aliye na dosari
  rationale: Kirai hiki kwa neno halisi ni ‘chochote kilicho na dosari.’ Katika muktadha wa sadaka za wanyama, kutaja ‘mnyama’ huleta maana wazi na ya kawaida katika Kiswahili bila kupunguza ujumla wa katazo ndani ya muktadha huo.
- source_word: מוּם
  choice: dosari
  rationale: ‘Dosari’ ni neno la kawaida na lenye heshima linaloweza kumaanisha kasoro ya mwili inayomfanya mnyama asistahili kutolewa kuwa sadaka; ‘kasoro’ pia inawezekana.
- source_word: לֹא תַקְרִיבוּ
  choice: msimtoe kuwa sadaka
  rationale: Hifili ya קרב katika sheria za dhabihu humaanisha kuleta au kutoa kitu mbele za Mungu kama sadaka. Kiswahili hiki kinaeleza tendo hilo kwa kawaida na kwa uwazi.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatanguliza sababu ya katazo; ‘kwa maana’ hudumisha mtindo wa kisheria wenye hadhi.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: hatakubaliwa kwa ajili yenu
  rationale: לְרָצוֹן ni lugha ya ibada inayohusu sadaka kukubaliwa kwa kibali, huku לָכֶם ikidumisha uhusiano wake na watoaji. Muundo huu pia unaacha wazi kama msisitizo ni kukubaliwa kwa faida yao au kwa niaba yao.
theological_decisions:
- issue: Lugha ya kukubalika kwa sadaka
  choice: hatakubaliwa kwa ajili yenu
  alternative: hatakubalika kwa niaba yenu
  rationale: Maandishi yanahusu sadaka kupokelewa kwa kibali mbele za Mungu, si kutimiza tu kiwango kisicho na uhusiano na mtoaji. ‘Kwa ajili yenu’ huhifadhi maana ya לָכֶם bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. ‘Mnyama’ imewekwa wazi kutokana na muktadha wa karibu wa sadaka za wanyama, na viashiria vyote vya tanbihi vimewekwa katika matini kuu.
