base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: sw
  text: Lakini ng’ombe au kondoo aliye na kiungo kirefu mno au kifupi mno[a], unaweza kumtoa kuwa sadaka ya hiari, lakini kwa nadhiri hatakubaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana pana zaidi, “mwenye umbo lisilo la kawaida au aliyedumaa.” Huenda maneno ya Kiebrania yanaeleza aina mbili zinazokinzana za kutokuwa na uwiano wa mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: ng’ombe
  rationale: Neno שׁוֹר humaanisha mnyama wa jamii ya ng’ombe; “ng’ombe” ni neno la kawaida na linalofaa katika sheria za dhabihu.
- source_word: וָשֶׂה
  choice: au kondoo
  rationale: שֶׂה humaanisha mnyama mmoja wa kundi dogo, yaani kondoo au mbuzi. “Kondoo” ni tafsiri ya kawaida na ya asili katika muktadha huu, ingawa neno la Kiebrania linaweza pia kumhusu mbuzi.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: mwenye kiungo kirefu mno au kifupi mno
  rationale: 'Maneno haya yanaonekana kueleza hali mbili zinazokinzana za kiungo kisicho na uwiano: kilichorefuka kupita kiasi au kilichofupika. Tafsiri hii inafanya picha ya Kiebrania ieleweke, huku tanbihi ikihifadhi kutokuwa na uhakika kwa maana kamili.'
- source_word: נְדָבָה
  choice: sadaka ya hiari
  rationale: נְדָבָה ni sadaka inayotolewa kwa hiari, si kwa kutimiza wajibu wa nadhiri.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: mnaweza kumtoa
  rationale: Ingawa kitenzi kwa kawaida humaanisha “kufanya,” katika muktadha wa dhabihu maana ya kawaida ni kumtoa au kumwandaa mnyama kuwa sadaka.
- source_word: וּלְנֵדֶר
  choice: lakini kwa ajili ya nadhiri
  rationale: Kirai hiki kinadumisha tofauti iliyopo kati ya sadaka ya hiari na sadaka inayotolewa ili kutimiza nadhiri.
- source_word: לֹא יֵרָצֶה
  choice: hatakubaliwa
  rationale: Katika muktadha wa dhabihu, kitenzi רצה katika kauli hii humaanisha kukubaliwa kwa kibali; kiwakilishi cha nafsi kinaendana kiasili na mnyama aliyetajwa.
theological_decisions:
- issue: Maana ya kasoro zinazotajwa kwa maneno שָׂרוּעַ na קָלוּט
  choice: kiungo kirefu mno au kifupi mno
  alternative: aliye na umbo lisilo la kawaida au aliyedumaa
  rationale: Maneno hayo yanawezekana kueleza aina mbili zinazokinzana za kutokuwa na uwiano wa mwili. Tafsiri maalumu inahifadhi picha inayodokezwa na Kiebrania, na tanbihi inakiri kwamba maana kamili ya maneno hayo si hakika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa urahisi. “Sadaka ya hiari” na “nadhiri” ni istilahi za kawaida za ibada. Wingi “mnaweza” unaelekeza sheria kwa jumuiya, huku “hatakubaliwa” ikirejelea mnyama mmoja.
