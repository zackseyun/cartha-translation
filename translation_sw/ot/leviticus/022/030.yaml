  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: sw
  text: Lazima iliwe siku hiyo hiyo[a]; msibakize chochote mpaka asubuhi. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku hiyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo hiyo
  rationale: Kimsingi kirai hiki ni ‘siku hiyo.’ Katika muktadha wa sheria hii, urudiaji wa ‘hiyo’ unaonyesha kwa Kiswahili cha kawaida kwamba ni siku ileile ya kutolewa kwa dhabihu, bila kubadili maana ya muda.
- source_word: יֵאָכֵל
  choice: Lazima iliwe
  rationale: Niphal imperfect hapa ni agizo la kisheria katika hali ya kutendwa. ‘Lazima iliwe’ huonyesha wajibu huo wazi na kwa Kiswahili cha sasa kuliko wakati ujao wa kawaida ‘italiwa.’
- source_word: לֹא תוֹתִירוּ
  choice: msibakize
  rationale: Hiphil ya יתר humaanisha kuacha kitu kibaki. ‘Msibakize’ ni katazo la wingi linalohifadhi nguvu ya agizo na maana ya kutoruhusu masalio.
- source_word: מִמֶּנּוּ
  choice: sehemu yake yoyote
  rationale: Kiambishi hiki hurejelea kitu kinacholiwa. ‘Sehemu yake yoyote’ huwasilisha kwa kawaida kwamba hakuna kiasi chake kinachopaswa kubaki.
- source_word: עַד בֹּקֶר
  choice: mpaka asubuhi
  rationale: Hiki ni kirai cha kawaida cha muda kinachokataza kukiweka usiku kucha hadi asubuhi.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahweh
  rationale: Huhifadhi moja kwa moja kauli ya utambulisho wa agano na kulitaja jina la Mungu יהוה kama ‘Yahweh.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kisheria umewekwa wazi kwa ‘Lazima’ na katazo la wingi ‘msibakize.’ Tanbihi ya pili ya safu ya Kiingereza haikufuatwa kwa kuwa haionyeshi usomaji mbadala wa Kiebrania na imewekwa mahali pasipolingana na maelezo yake.
