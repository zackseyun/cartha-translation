- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linatanguliza maneno ya moja kwa moja yanayofuata; “akisema” huhifadhi fomula ya Kiebrania na kuonyesha kwamba ujumbe unaendelea katika mstari unaofuata.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni יהוה moja kwa moja. “Yahwe” huhifadhi jina hilo kama jina binafsi badala ya kulibadilisha kuwa cheo; “Yehova” ni toleo jingine la kimapokeo.
