source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: sw
  text: Mnyama yeyote aliye kipofu, aliyevunjika kiungo, aliye na sehemu ya mwili iliyokatwa, au mwenye uvimbe wa ngozi, upele, au ugonjwa wa ngozi—hawa msiwatoe kwa Yahwe; wala msimweke hata mmoja wao juu ya madhabahu kama sadaka ya moto[a] kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: mnyama yeyote aliye kipofu
  rationale: Neno hili linaeleza kasoro ya mnyama wa dhabihu. Kutaja “mnyama” kwa wazi kunafanya rejeo la orodha lieleweke kwa Kiswahili bila kubadili maana.
- source_word: שָׁבוּר
  choice: aliyevunjika kiungo
  rationale: Kirai hiki kinaonyesha kuwa mnyama ana sehemu ya mwili iliyovunjika; ni cha asili na sahihi zaidi kuliko kusema tu “aliyevunjika.”
- source_word: חָרוּץ
  choice: aliyekatwa sehemu ya mwili
  rationale: Neno la Kiebrania lina wazo la kukatwa au kuachwa na kasoro kubwa. Tafsiri hii huepuka kubainisha kiungo fulani ambacho chanzo hakijataja.
- source_word: יַבֶּלֶת
  choice: mwenye chunjua
  rationale: “Chunjua” ni neno la kawaida la Kiswahili kwa uvimbe mdogo wa ngozi unaokusudiwa hapa.
- source_word: גָרָב
  choice: upele
  rationale: Neno hili hutaja tatizo la ngozi linaloonekana. “Upele” ni wazi kwa msomaji wa kawaida bila kutoa utambuzi wa kitabibu usio na uhakika.
- source_word: יַלֶּפֶת
  choice: ugonjwa wa ngozi
  rationale: Aina hasa ya ugonjwa haijulikani kwa uhakika; tafsiri pana inadumisha kutokuwa na uhakika kwa neno la chanzo.
- source_word: תַקְרִיבוּ
  choice: msimtoe
  rationale: Katika muktadha wa ibada, Hiphil ya קרב humaanisha kumleta au kumtoa mnyama kama dhabihu. “Kumtoa” ni lugha ya kawaida ya dhabihu kwa Kiswahili.
- source_word: וְאִשֶּׁה
  choice: sadaka inayoteketezwa kwa moto
  rationale: אִשֶּׁה huhusishwa na sadaka inayowasilishwa kwa moto. Tafsiri hii ni wazi katika Kiswahili, huku maana mbadala ya “sadaka ya chakula” ikihifadhiwa katika tanbihi.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: msitoe yeyote kati yao juu ya madhabahu
  rationale: Hii inadumisha katazo la kuweka mnyama yeyote wa aina hizo juu ya madhabahu, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל katika muktadha huu kinaonyesha kwamba sadaka inatolewa kwa Yahwe; “kwa” ni ya asili katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya אִשֶּׁה katika istilahi za dhabihu
  choice: sadaka inayoteketezwa kwa moto
  alternative: sadaka ya chakula
  rationale: Neno linaweza kueleweka kwa kuhusishwa na moto, huku matumizi yake ya kikuhani pia yakiruhusu wazo la sadaka ya chakula. Maandishi makuu yanatumia Kiswahili kilicho wazi, na tanbihi inadumisha tafsiri nyingine muhimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha ya kasoro imetolewa kwa maneno ya sasa bila usahihi bandia wa kitabibu; muundo wa katazo mbili wa Kiebrania umehifadhiwa.
