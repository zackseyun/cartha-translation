  to: Mnyama yeyote aliye kipofu, aliyevunjika kiungo, aliye na sehemu ya mwili iliyokatwa, au mwenye uvimbe wa ngozi, upele, au ugonjwa wa ngozi—hawa msiwatoe kwa Yahwe; wala msimweke hata mmoja wao juu ya madhabahu kama sadaka ya moto[a] kwa Yahwe.
