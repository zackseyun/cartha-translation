  naturalness: Kiswahili kinaeleweka, lakini 'aliye kipofu' si muundo wa kawaida (bora 'aliye kipofu' ibadilishwe kwa 'aliye kipofu'?) na marudio ya 'msitoe' hayatoi vizuri tofauti ya vitenzi vya Kiebrania. Muundo uliorekebishwa ni wa kawaida na wazi zaidi.
  terminology: Yahwe ni thabiti. 'Uvimbe wa ngozi' huepuka neno lisilo wazi la kikanda 'chunjua' na huhifadhi maana ya יַבֶּלֶת bila utambuzi wa kitabibu usio hakika. 'Sadaka ya moto' ni pana zaidi kuliko 'sadaka inayoteketezwa kwa moto'; tafsiri mbadala ya 'sadaka ya chakula' imehifadhiwa katika tanbihi.
  issues:
