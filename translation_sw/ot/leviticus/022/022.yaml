  - severity: low
    issue: '"chunjua"'
    rationale: Neno hili halina uwazi wa kutosha katika Kiswahili Sanifu kwa wasomaji wengi. 'Uvimbe wa ngozi' ni sahihi na hauzidishi uhakika wa istilahi ya Kiebrania.
  - severity: low
    issue: '"aliye kipofu"'
    rationale: Muundo wa sifa unahitaji urekebisho wa kisarufi na mtiririko wa kawaida katika orodha ya kasoro.
