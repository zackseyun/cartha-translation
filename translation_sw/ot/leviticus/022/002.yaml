source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: sw
  text: “Mwambie Haruni na wanawe wajiepushe[a] na vitu vitakatifu ambavyo wana wa Israeli[b] wananiwekea wakfu, wala wasilitie unajisi jina langu takatifu. Mimi ni Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wajitenge na” au “wajizuie na.”
    reason: lexical_alternative
  - marker: b
    text: “Wana wa Israeli” ni usemi rasmi wa Kiebrania; pia unaweza kutafsiriwa “watu wa Israeli” au “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Mwambie
  rationale: Kauli ya amri katika umoja inaelekezwa kwa Musa; ‘mwambie’ ni ya kawaida na huwasilisha agizo la kusema kwa Haruni.
- source_word: וְיִנָּזְרוּ
  choice: wajiepushe
  rationale: Niphal ya נזר hapa ina maana ya kujitenga au kutoshughulika na vitu vitakatifu. ‘Wajiepushe’ huonyesha tendo la hiari na la kujizuia kwa lugha ya sasa.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: na vitu vitakatifu ... vya wana wa Israeli
  rationale: ‘Vitu vitakatifu’ huhifadhi upana wa קָדְשֵׁי bila kuifanya iwe ‘sadaka’ pekee, ingawa sadaka zilizowekwa wakfu ndizo zinazolengwa katika muktadha.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa ukaribu usemi rasmi wa Kiebrania wa kulitaja taifa; tanbihi inatoa usemi wa kawaida zaidi wa Kiswahili.
- source_word: יְחַלְּלוּ
  choice: wasilinajisi
  rationale: Katika muktadha wa utakatifu, חלל ni kufanya kilicho kitakatifu kiwe cha kawaida au kukivunjia heshima. ‘Kulinajisi’ lina uzito unaofaa wa kidini na linaeleweka kwa wasomaji wa kawaida.
- source_word: שֵׁם קָדְשִׁי
  choice: jina langu takatifu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai cha Kiebrania, huku ikihifadhi umuhimu wa utakatifu wa jina la Mungu.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: ambavyo ... wananiwekea wakfu
  rationale: ‘Kuwekea wakfu’ huwasilisha tendo la kutenga vitu kwa ajili ya Mungu. Kishazi kimewekwa karibu na ‘vitu vitakatifu’ ili kiwe cha kawaida katika Kiswahili na kionyeshe rejeo lake linalowezekana zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
theological_decisions:
- issue: Rejeo la kishazi אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: Kishazi kinarejelea vitu vitakatifu ambavyo wana wa Israeli wanamweka Mungu wakfu.
  alternative: Kishazi kinaweza kuhusishwa kwa namna pana na ‘jina langu takatifu’ katika mtiririko wa sentensi.
  rationale: Kisarufi na kimuktadha, kitendo cha kuweka wakfu kinaendana moja kwa moja na vitu vitakatifu. Mpangilio wa Kiswahili umebadilishwa kidogo ili uhusiano huu usomeke kwa kawaida bila kuongeza maelezo yasiyomo katika chanzo.
- issue: Nguvu ya katazo וְלֹא יְחַלְּלוּ
  choice: wala wasilinajisi
  alternative: ili wasilinajisi
  rationale: ‘Wala’ huhifadhi uratibu wa Kiebrania kati ya kujiepusha na kutolinajisi bila kugeuza waziwazi kishazi cha pili kuwa kusudi, ingawa uhusiano wa kimantiki kati ya maagizo hayo unaonekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Wajiepushe’ ni cha kawaida kuliko ‘wajitenge’ katika agizo hili, na ‘vitu vitakatifu’ huhifadhi upana wa istilahi ya ibada. Kishazi cha kuweka wakfu kimesogezwa karibu na nomino inayorejelewa ili kuepuka utata wa kisarufi usio wa lazima katika Kiswahili.
