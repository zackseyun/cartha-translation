base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: sw
  text: Wala msilinajisi jina langu takatifu; nami nitaonekana kuwa mtakatifu[a] miongoni mwa wana wa Israeli[b]. Mimi ni Yahweh, ninayewatakasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitatakaswa,” au “nitatendewa kama mtakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wa Israeli,” usemi wa kawaida unaomaanisha watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: msilinajisi
  rationale: Kitenzi hiki katika hali ya Piel kinamaanisha kuvunjia utakatifu au kulifanya jambo takatifu kuwa la kawaida. ‘Msilinajisi’ ni Kiswahili cha kawaida chenye uzito unaofaa katika muktadha wa utakatifu.
- source_word: שֵׁם קָדְשִׁי
  choice: jina langu takatifu
  rationale: Huhifadhi wazi vipengele vya ‘jina’ na ‘utakatifu’ kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וְנִקְדַּשְׁתִּי
  choice: nami nitaonekana kuwa mtakatifu
  rationale: Niphal hapa ina maana ya Yahweh kudhihirishwa au kutambuliwa kuwa mtakatifu. Kauli hii ni ya asili katika Kiswahili na huepuka kudokeza kwamba Mungu anahitaji kufanywa mtakatifu, huku tanbihi ikihifadhi uwezekano wa kauli tendwa.
- source_word: בְּתוֹךְ
  choice: miongoni mwa
  rationale: Ni usemi wa kawaida unaowasilisha mahali na uhusiano ndani ya jumuiya ya Israeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata kwa karibu muundo wa Kiebrania na wakati huohuo hubaki wenye kueleweka; tanbihi inaeleza kwamba usemi huu huwarejelea watu wa Israeli kwa ujumla.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: מְקַדִּשְׁכֶם
  choice: ninayewatakasa
  rationale: Huwasilisha tendo la Mungu linaloendelea kwa watu wake na kuhifadhi msamiati wa mzizi קדשׁ unaohusu utakatifu.
theological_decisions:
- issue: Maana ya וְנִקְדַּשְׁתִּי kuhusu utakatifu wa Mungu
  choice: nitaonekana kuwa mtakatifu
  alternative: nitatakaswa; nitatendewa kama mtakatifu
  rationale: Kauli haimaanishi kwamba Mungu hapo awali hakuwa mtakatifu, bali kwamba utakatifu wake unaonyeshwa, unatambuliwa, au unaheshimiwa katikati ya Israeli. Tanbihi inahifadhi upana wa kauli ya Kiebrania.
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ya Kiebrania inatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Muundo wa kiume wa Kiebrania umehifadhiwa katika matini, lakini tanbihi inafafanua kwamba hapa ni usemi wa kawaida kwa jumuiya nzima ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Wala …; nami …’ hudumisha uhusiano wa vifungu bila kugeuza kiunganishi cha Kiebrania kuwa ‘lakini.’
