reference: Leviticus 22:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: sw
  text: Kila mwanamume wa uzao wa Haruni ambaye ana ugonjwa wa ngozi unaosababisha unajisi wa kiibada[a], au ana mtiririko wa majimaji mwilini, hatakula vitu vitakatifu mpaka awe safi. Na mtu yeyote anayemgusa mtu aliye najisi kwa sababu ya maiti[b], au anayemgusa mwanamume ambaye ametokwa na shahawa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kijadi, “mwenye ukoma.” Neno la Kiebrania linahusu kwa upana hali ya ngozi inayotia unajisi wa kiibada, si lazima ukoma wa kisasa (ugonjwa wa Hansen).
    reason: lexical_alternative
  - marker: b
    text: Au, “mtu yeyote aliyetiwa najisi na maiti.” Usemi wa Kiebrania ni wa kinahau na unahusu unajisi unaohusiana na maiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Kila mwanamume
  rationale: Urudiaji huu ni nahau ya ugaw distributive yenye maana ya kila mmoja au yeyote; “mwanamume” huhifadhi rejeo la kiume kwa wazao wa Haruni katika muktadha wa kikuhani.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: wa uzao wa Haruni
  rationale: זֶרַע hapa humaanisha ukoo au wazao, si mbegu halisi; “uzao” ni Kiswahili cha kawaida chenye maana ya nasaba.
- source_word: צָרוּעַ
  choice: ana ugonjwa wa ngozi unaotia unajisi
  rationale: Neno hilo linataja hali pana ya ngozi iliyosababisha unajisi wa kiibada, wala si lazima ugonjwa wa kisasa wa Hansen.
- source_word: זָב
  choice: ana mtiririko wa mwili
  rationale: Hali inayotajwa ni mtiririko wa majimaji ya mwili unaosababisha unajisi wa kiibada; kauli hii ni wazi bila kuuwekea utambuzi finyu usio katika neno lenyewe.
- source_word: בַּקֳּדָשִׁים
  choice: vitu vitakatifu
  rationale: Hurejelea vyakula au mafungu yaliyowekwa wakfu ambayo makuhani waliruhusiwa kula; tafsiri pana huhifadhi istilahi ya chanzo.
- source_word: לֹא יֹאכַל
  choice: hatakula
  rationale: Wakati ujao wa Kiebrania unafanya kazi kama katazo la kisheria; umbo hili ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: mpaka atakapokuwa safi
  rationale: Kitenzi kinaonyesha kuingia tena katika hali ya usafi wa kiibada, si lazima kupona kitabibu.
- source_word: וְהַנֹּגֵעַ
  choice: Pia, yeyote anayemgusa
  rationale: Kivumishi-tendo kinatumika kama nomino na kuanzisha hali nyingine inayomfanya mtu asiwe safi; “anayemgusa” huonyesha kwamba kinachofuata ni mlengwa wa kuguswa.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: mtu aliye najisi kwa sababu ya maiti
  rationale: Nahau hii inaeleweka vizuri kuwa mtu aliyepata unajisi kutokana na maiti. Tafsiri hii huhifadhi uhusiano na kifo bila kudai kwamba kinachoguswa ni maiti yenyewe.
- source_word: שִׁכְבַת זָרַע
  choice: shahawa
  rationale: Nahau hiyo hutaja utoaji wa mbegu za kiume; “shahawa” ni neno la sasa, wazi na lenye staha.
- source_word: תֵּצֵא מִמֶּנּוּ
  choice: ametokwa na
  rationale: Kauli hii ya Kiswahili huwasilisha kwa kawaida maana halisi ya kitu kutoka mwilini mwa mwanamume.
theological_decisions:
- issue: Kutafsiri istilahi za unajisi wa kiibada bila kuingiza utambuzi wa kisasa wa kitabibu
  choice: “ugonjwa wa ngozi unaotia unajisi” na “atakapokuwa safi”
  alternative: “ukoma” na “atakapopona”
  rationale: Mstari unahusu kustahili kwa kuhani kula vitu vitakatifu kwa mujibu wa usafi wa kiibada, si hukumu ya kimaadili wala utambuzi maalumu wa ugonjwa wa Hansen.
- issue: Jinsia ya mhusika wa sheria
  choice: “Kila mwanamume wa uzao wa Haruni”
  alternative: “Kila mtu wa uzao wa Haruni”
  rationale: אִישׁ ni ya kiume, na hapa muktadha unahusu wanaume wa ukoo wa Haruni waliokuwa katika nafasi ya kikuhani.
- issue: Utata wa טְמֵא נֶפֶשׁ
  choice: Mtu aliyekuwa najisi kwa sababu ya maiti
  alternative: Kitu chochote kilicho najisi kwa maiti
  rationale: Muundo wa Kiebrania ni wa kinahau na unaweza kutafsiriwa kwa namna tofauti; chaguo hili linafuata matumizi ya istilahi hiyo kwa unajisi unaotokana na maiti huku tanbihi ikihifadhi ufafanuzi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sheria wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. “Mtiririko wa mwili” na “shahawa” ni wazi bila kuwa wa kashfa. Koma ya mwisho imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
