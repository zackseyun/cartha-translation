id: LEV.22.21
reference: Leviticus 22:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: sw
  text: Na mwanamume akimtolea Yahweh dhabihu ya amani[a], ili kutimiza nadhiri[b] au kama sadaka ya hiari, kutoka katika kundi la ng’ombe au kundi la kondoo na mbuzi, mnyama huyo lazima awe asiye na dosari ili akubalike; asiwe na kasoro yoyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutekeleza nadhiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Na mwanamume aki-
  rationale: אִישׁ ni nomino ya kiume ya umoja, na כִּי pamoja na kitenzi kisichotimilika huanzisha hali ya kisheria. Muundo wa ‘akimtolea’ unasikika kwa kawaida katika Kiswahili huku ukihifadhi mhusika wa kiume wa maandishi ya Kiebrania.
- source_word: יַקְרִיב
  choice: akimtolea
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta au kutoa sadaka. ‘Kumtolea’ huonyesha kwa uwazi kwamba sadaka inaelekezwa kwa Yahweh.
- source_word: זֶבַח שְׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: ‘Dhabihu’ inawakilisha זֶבַח, na ‘sadaka za amani’ inahifadhi jina la aina ya sadaka שְׁלָמִים pamoja na uhusiano wake wa kimsamiati na wazo la amani/ukamilifu, bila kulifasiri moja kwa moja kuwa ushirika.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: לְפַלֵּא נֶדֶר
  choice: ili kutimiza nadhiri
  rationale: Katika sheria ya sadaka, kifungu hiki huelekea kumaanisha kutekeleza au kulipa kile kilichowekwa nadhiri. ‘Kutimiza nadhiri’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: אוֹ לִנְדָבָה
  choice: au kama sadaka ya hiari
  rationale: נְדָבָה ni sadaka inayotolewa kwa hiari, tofauti na ile inayotolewa kwa sababu ya nadhiri.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: kutoka katika kundi la ng’ombe au kundi la kondoo na mbuzi
  rationale: בקר ni kundi la ng’ombe, na צאן ni jina la pamoja linaloweza kuhusisha kondoo na mbuzi. Ufafanuzi huu unaepuka kuifanya צאן kuwa kondoo pekee.
- source_word: תָּמִים
  choice: asiye na dosari
  rationale: Katika sheria za dhabihu, תמים humaanisha mnyama asiye na dosari ya mwili inayomzuia kukubalika.
- source_word: לְרָצוֹן
  choice: ili akubalike
  rationale: Kifungu hiki kinaonyesha kusudi au matokeo ya kukubalika kwa sadaka mbele za Mungu.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: asiwe na kasoro yoyote
  rationale: מוּם ni kasoro ya mwili inayomfanya mnyama asistahili kutolewa. ‘Kasoro yoyote’ huhifadhi nguvu ya כָּל katika katazo hili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu יהוה moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Mhusika wa kiume אִישׁ katika sheria
  choice: mwanamume
  alternative: mtu; yeyote
  rationale: אִישׁ ni umoja wa kiume katika muundo huu wa sheria. ‘Mwanamume’ huhifadhi jinsia iliyo wazi katika chanzo badala ya kuifanya isionekane.
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: ‘Sadaka za amani’ huhifadhi kwa karibu istilahi ya Kiebrania na haifungi maana yake kwenye ushirika pekee; tafsiri ya ‘ushirika’ imetajwa katika tanbihi kama njia ya kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisheria ulio wazi na wenye heshima. ‘Mnyama huyo’ imeongezwa kwa uwazi wa kisarufi kwa sababu vivumishi vya Kiebrania vinarejelea mnyama anayetolewa. Alama zote za tanbihi zimewekwa mara baada ya vifungu vinavyohusika.
