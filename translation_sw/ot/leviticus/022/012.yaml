base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: sw
  text: Lakini binti ya kuhani akiolewa na mwanamume asiye kuhani[a], hatakula katika mchango wa vitu vitakatifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamume wa nje” au “mgeni”; kihalisi, “mwanamume mgeni/wa nje.” Hapa neno hilo humaanisha mtu asiye katika hadhi ya kikuhani na, kwa hiyo, aliye nje ya watu wenye haki ya kula vitu vitakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “matoleo matakatifu” au “zawadi takatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Lakini ikiwa binti ya kuhani
  rationale: Waw imetafsiriwa kwa maana ya ulinganisho na agizo lililotangulia. Muundo wa nomino umehifadhiwa wazi kama ‘binti ya kuhani.’
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: ataolewa na mwanamume asiye wa ukoo wa kikuhani
  rationale: Kauli hii inaeleza kubadilika kwa hali ya binti kupitia ndoa. Katika muktadha huu זָר si lazima iwe mtu wa taifa jingine, bali mtu aliye nje ya familia yenye haki ya kula chakula kitakatifu.
- source_word: הִוא
  choice: (yeye) — inaonyeshwa katika kiambishi cha kitenzi ‘hata-’
  rationale: Kiswahili huonyesha nafsi kwa kiambishi cha kitenzi; kuongeza ‘yeye’ kungeleta mkazo usio wa lazima hapa.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: sehemu ya mchango wa vitu vitakatifu
  rationale: ‘Mchango’ hudumisha maana ya תְּרוּמָה kama kitu kilichotengwa na kutolewa, huku ‘vitu vitakatifu’ ikihifadhi wingi na upana wa קֳדָשִׁים. ‘Sehemu’ huifanya kauli ya kula iwe ya kawaida katika Kiswahili.
- source_word: לֹא תֹאכֵל
  choice: hatakula
  rationale: Wakati ujao wenye ukanushi unafaa kwa lugha ya sheria ya Kiswahili na unadumisha nguvu ya katazo.
theological_decisions:
- issue: Maana ya זָר katika sheria kuhusu ukuhani
  choice: mwanamume asiye wa ukoo wa kikuhani
  alternative: mgeni; mtu wa nje; asiye kuhani
  rationale: Sura hii inahusu ustahili wa kula vyakula vitakatifu, si tofauti ya kikabila. Tafsiri hii inaonyesha kuwa mwanamume huyo yuko nje ya familia au kundi lenye haki ya ukuhani, bila kumtaja kimakosa kuwa mtu wa taifa jingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya kisheria imewekwa wazi bila kutumia istilahi nzito au za kimadhehebu.
