source:
  edition: WLC
  text: וּ/בָ֥א הַ/שֶּׁ֖מֶשׁ וְ/טָהֵ֑ר וְ/אַחַר֙ יֹאכַ֣ל מִן הַ/קֳּדָשִׁ֔ים כִּ֥י לַחְמ֖/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: sw
  text: Jua likisha zama, atakuwa safi; baada ya hapo anaweza kula vitu vitakatifu[a], kwa maana ni chakula chake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matoleo matakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa maana huo ni mkate wake.” Hapa “mkate” unamaanisha chakula alichogawiwa kutokana na mafungu matakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: Jua likisha zama
  rationale: Nahau ya Kiebrania, kihalisi ‘jua linapoingia,’ inaashiria kutua kwa jua. Kauli hii ya Kiswahili inaonyesha kwa kawaida kwamba ruhusa inaanza baada ya jua kutua.
- source_word: וְטָהֵר
  choice: atakuwa safi
  rationale: Kitenzi kinaonyesha kurejea katika hali ya usafi wa kiibada baada ya jua kutua; ‘safi’ inaacha muktadha wa Walawi ueleze aina ya usafi bila kuugeuza kuwa usafi wa kimaadili.
- source_word: וְאַחַר
  choice: baada ya hapo
  rationale: 'Inaendeleza wazi mpangilio wa hatua katika sheria: kwanza jua kutua na usafi kurejea, kisha kula.'
- source_word: יֹאכַל
  choice: anaweza kula
  rationale: Katika muktadha huu wa kisheria, umbo hili linaonyesha ruhusa ya kula baada ya kurejea kwa usafi, si amri kwamba lazima ale.
- source_word: מִן הַקֳּדָשִׁים
  choice: baadhi ya vitu vitakatifu
  rationale: Kihusishi מִן kina maana ya kula kutoka miongoni mwa vitu hivyo; ‘baadhi ya’ huwasilisha maana hiyo kwa Kiswahili cha kawaida. ‘Vitu vitakatifu’ kinabaki karibu na usemi mpana wa Kiebrania bila kuufanya moja kwa moja kuwa ‘matoleo.’
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa neno hili linatoa sababu ya ruhusa hiyo.
- source_word: לַחְמוֹ הוּא
  choice: hivyo ni chakula chake
  rationale: לֶחֶם maana yake ya msingi ni ‘mkate,’ lakini hapa inamaanisha chakula au riziki ya kuhani. ‘Hivyo’ huunganisha kauli kwa kawaida na vitu vitakatifu vilivyotajwa, huku tanbihi ikihifadhi muundo wa karibu zaidi wa Kiebrania.
theological_decisions:
- issue: Aina ya usafi unaotajwa
  choice: Usafi wa kiibada unaoonyeshwa kwa neno la kawaida ‘safi’
  alternative: Usafi wa kimaadili au wa kiroho
  rationale: Muktadha wa Walawi 22 unahusu hali inayomzuia kuhani kula chakula kitakatifu kwa muda. Aya haisemi kwamba kosa la kimaadili limesamehewa, hivyo tafsiri haiongezi wazo hilo.
- issue: Maana ya ‘vitu vitakatifu’
  choice: Usemi mpana unaohifadhi neno la Kiebrania
  alternative: Matoleo matakatifu
  rationale: Katika muktadha vitu hivi ni mafungu matakatifu ya chakula cha kikuhani, lakini nomino ya Kiebrania yenyewe ni pana. Tafsiri kuu inahifadhi upana huo na tanbihi inatoa maana mbadala ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi mfuatano wa masharti ya sheria, huku istilahi za kiibada zikibaki wazi bila kuingiza mafundisho ya dhehebu.
