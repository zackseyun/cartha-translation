  - marker: a
    text: Au, “matoleo matakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa maana huo ni mkate wake.” Hapa “mkate” unamaanisha chakula alichogawiwa kutokana na mafungu matakatifu.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported partitive “baadhi ya,” retains the legal and ritual sense of the verse, and places both footnote markers directly after their relevant wording. The final clause is made more idiomatic while retaining the Hebrew’s collective reference to the sacred food.
