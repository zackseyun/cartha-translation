- from: Nanyi mtakapomtolea Yahwe dhabihu ya shukrani[a], mtaitoa ili mpate kukubaliwa.
  to: Na mnapomtolea Yahweh dhabihu ya shukrani[a], itoeni ili ikubalike kwa ajili yenu.
