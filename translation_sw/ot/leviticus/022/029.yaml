source:
  edition: WLC
  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: sw
  text: Na mnapomtolea Yahweh dhabihu ya shukrani[a], itoeni ili ikubalike kwa ajili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhabihu ya kutoa shukrani.”
    reason: Njia nyingine halali ya kutafsiri muundo wa Kiebrania זֶבַח תּוֹדָה.
lexical_decisions:
- source_word: וְ/כִי
  choice: Nanyi mtakapomtolea
  rationale: Muundo wa ‘mtakapo-’ unaonyesha hali yenye maana ya wakati na pia ya masharti katika sheria hii; ‘nanyi’ huunganisha agizo na muktadha uliotangulia.
- source_word: תִזְבְּחוּ
  choice: mtakapomtolea ... dhabihu
  rationale: Katika muktadha wa ibada, ‘kumtolea dhabihu’ ni Kiswahili cha kawaida na chenye heshima kinachoonyesha tendo lote la kutoa dhabihu, si kuchinja tu.
- source_word: זֶבַח תּוֹדָה
  choice: dhabihu ya shukrani
  rationale: Hili ni jina la aina maalumu ya dhabihu inayotolewa kwa shukrani; tafsiri hii ni wazi, ya asili, na inadumisha neno la dhabihu.
- source_word: לַ/יהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kuwa ‘Yahwe’; kiambishi cha mtendewa katika ‘kumtolea’ kinawakilisha לַ.
- source_word: לִֽ/רְצֹנְ/כֶם
  choice: ili mpate kukubaliwa
  rationale: Katika sheria za dhabihu, רָצוֹן huelekea kumaanisha kukubaliwa mbele za Mungu, si mapenzi au hiari ya watoaji. Muundo huu ni wa asili kwa Kiswahili na unaonyesha manufaa kwa watoaji.
- source_word: תִּזְבָּחוּ
  choice: mtaitoa
  rationale: Kitenzi cha pili kinadumisha agizo linalorudia tendo la kuitoa dhabihu, huku ‘-i-’ ikirejelea dhabihu iliyotajwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya לִרְצֹנְכֶם katika muktadha wa dhabihu
  choice: ili mpate kukubaliwa
  alternative: kwa hiari yenu
  rationale: Katika muktadha huu, kirai kinaelekea kueleza kukubaliwa kwa waabudu kupitia dhabihu inayotolewa ipasavyo, wala si mapendeleo yao binafsi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kisheria bila kuwa ngumu; alama ya tanbihi imewekwa baada ya kirai kinachohusika.
