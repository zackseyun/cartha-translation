  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: sw
  text: Nao hawatavinajisi vitu vitakatifu vya wana wa Israeli, ambavyo wanavyovitoa[a] kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanavyoviinua kwa Yahweh” au “wanavyomtolea Yahweh.”
    reason: Kitenzi יָרִימוּ kinaweza kueleza kuinua kihalisi au kuwasilisha kitu kama toleo katika muktadha wa ibada.
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: watavinajisi
  rationale: Katika muktadha wa ibada, Piel ya חלל humaanisha kuvunjia utakatifu au kufanya kilicho kitakatifu kitumiwe kama cha kawaida. ‘Vinajisi’ ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia.
- source_word: קָדְשֵׁי
  choice: vitu vitakatifu
  rationale: Usemi huu mpana unafuata kwa karibu wingi wa nomino ya Kiebrania bila kuufinya kuwa sadaka pekee, ingawa muktadha unahusu vitu vilivyowekwa wakfu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi jina la kimapokeo la agano lililo wazi katika Kiebrania, badala ya kulibadili kuwa usemi wa jumla.
- source_word: אֲשֶׁר יָרִימוּ
  choice: ambavyo wanamwinulia
  rationale: Huhifadhi picha halisi ya Hiphil ya רום, ‘kuinua,’ huku kiambishi cha yambwa -m- kikionyesha kwamba vitu hivyo vinainuliwa kwa Yahweh.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Huhifadhi jina la agano יהוה kama jina binafsi, kulingana na ushahidi wa maandishi na safu ya mashauriano iliyotolewa.
- source_word: וְלֹא
  choice: Nao hawata-
  rationale: Huhifadhi kiunganishi וְ na nguvu ya katazo la imperfect katika mtindo wa sheria, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana Tetragramatoni yenyewe; ‘Yahweh’ huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Je, קָדְשֵׁי itafsiriwe kwa maana pana au ifinywe kuwa sadaka?
  choice: vitu vitakatifu
  alternative: sadaka takatifu
  rationale: Kiebrania kinasema kwa upana ‘vitu vitakatifu’; muktadha wa sadaka unatambulika, lakini tafsiri haipaswi kuondoa upana halisi wa usemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa karibu na Kiebrania lakini unasomeka kiasili; neno ‘vitu vitakatifu’ linahifadhi upana wa chanzo, na tanbihi inaeleza maana mbadala ya kitenzi cha ibada.
