  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: sw
  text: “Ng’ombe, kondoo au mbuzi anapozaliwa, atabaki na mama yake kwa siku saba. Kuanzia siku ya nane na kuendelea, atakubaliwa kuwa sadaka inayotolewa kwa moto[a] kwa Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linamaanisha sadaka inayowasilishwa kwa moto; wengine hulitafsiri “sadaka ya chakula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno hili linataja mnyama wa jamii ya ng’ombe katika orodha ya wanyama wanaofaa kwa dhabihu; “ng’ombe” halibainishi jinsia isiyobainishwa hapa.
- source_word: כֶשֶׂב
  choice: kondoo
  rationale: Katika muktadha huu ni jina la jamii ya mnyama, si lazima mwana-kondoo, hivyo “kondoo” linafaa zaidi.
- source_word: עֵז
  choice: mbuzi
  rationale: Hapa ni jina la jamii ya mnyama bila kulazimisha jinsia fulani.
- source_word: כִּי יִוָּלֵד
  choice: anapozaliwa
  rationale: Katika sheria hii כִּי inaanzisha hali inayotarajiwa, na kitenzi cha Kiebrania kina maana ya “kuzaliwa.”
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: atabaki na mama yake kwa siku saba
  rationale: “Atabaki” huwasilisha hali ya kuendelea, na “na mama yake” ni Kiswahili cha kawaida kwa picha ya Kiebrania ya kuwa chini ya mama, yaani kubaki karibu naye na kunyonya.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: kuanzia siku ya nane na kuendelea
  rationale: Hii inaonyesha wazi mwanzo wa kipindi ambacho mnyama anakubalika.
- source_word: יֵרָצֶה
  choice: atakubaliwa
  rationale: Kauli tendwa inaonyesha kukubaliwa kwa mnyama kwa matumizi ya dhabihu.
- source_word: לְקָרְבַּן
  choice: kuwa sadaka
  rationale: קָרְבָּן ni kitu kinacholetwa mbele za Mungu kama sadaka; muundo huu ni wa kawaida katika Kiswahili.
- source_word: אִשֶּׁה
  choice: inayotolewa kwa moto
  rationale: Neno hili la ibada linahusiana na sadaka inayowasilishwa kwa moto; tafsiri hii huhifadhi njia ya kuitoa bila kulazimisha maana yenye mjadala ya “sadaka ya chakula.”
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha anayepokea sadaka, na jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahwe.”
theological_decisions:
- issue: Maana ya אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Neno hilo lina uhusiano wa wazi na moto wa madhabahu, huku pendekezo la “chakula” likitegemea namna lugha ya dhabihu inavyofasiriwa. Tafsiri kuu huhifadhi maana iliyo wazi zaidi na tanbihi hutaja upeo wa neno.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano lenyewe; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Atabaki na mama yake” limetumiwa badala ya tafsiri ngumu ya neno kwa neno “chini ya mama yake,” huku maana ya muktadha ikihifadhiwa.
