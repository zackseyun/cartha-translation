base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: sw
  text: Na ikiwa mwanamume atakula kitu kitakatifu bila kukusudia,[a][b] ataongeza sehemu ya tano juu yake, kisha atampa kuhani kitu hicho kitakatifu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu yeyote” au “mtu.” Kiebrania kinasema “mwanamume,” katika muundo wa sheria ambao unaweza kutumika kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: “Kitu kitakatifu” hapa ni chakula au mali iliyowekwa wakfu na kutengwa kwa matumizi ya makuhani.
    reason: cultural_note
  - marker: c
    text: Kwa karibu zaidi, “ataongeza sehemu ya tano yake juu yake na kumpa kuhani kitu hicho kitakatifu.” Katika muktadha, huenda ikahusu urejesho wa kitu kilicholiwa pamoja na nyongeza ya sehemu ya tano.
    reason: translation_clarity
lexical_decisions:
- source_word: וְאִישׁ
  choice: Na mwanamume
  rationale: אִישׁ ni nomino ya kiume katika umoja. “Mwanamume” huhifadhi muundo huo wa sheria, ingawa katika sheria inaweza kumaanisha mtu yeyote; jambo hilo linaelezwa katika tanbihi.
- source_word: כִּי
  choice: akila
  rationale: כִּי pamoja na kitenzi kisichotimilika huanzisha hali ya sheria. Muundo wa Kiswahili “akila” huwasilisha kwa kawaida maana ya “ikiwa atakula.”
- source_word: קֹדֶשׁ
  choice: kitu kitakatifu
  rationale: Neno hili linahusu kitu kilichowekwa wakfu, katika muktadha huu kitu kinachoweza kuliwa na kilichotengwa kwa matumizi ya kikuhani. Tafsiri pana “kitu kitakatifu” haikibani kuwa aina fulani tu ya chakula.
- source_word: בִּשְׁגָגָה
  choice: bila kukusudia
  rationale: Hueleza tendo lililofanywa kwa kutokujua au kwa kosa, si uasi wa makusudi. Usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: ataongeza sehemu moja ya tano juu ya thamani yake
  rationale: Kirai kinadai nyongeza ya moja ya tano juu ya kile kinachorejeshwa. Kutaja “thamani” kunaweka wazi namna fidia ya kitu kilichokwisha kuliwa inavyotekelezwa, huku tanbihi ikihifadhi muundo wa karibu zaidi wa Kiebrania.
- source_word: וְנָתַן לַכֹּהֵן אֶת־הַקֹּדֶשׁ
  choice: na kumpa kuhani thamani ya kitu hicho kitakatifu
  rationale: Kwa kuwa kitu hicho kililiwa, “thamani ya kitu” huonyesha kwa Kiswahili cha kawaida fidia inayotolewa kwa kuhani. Tanbihi inabainisha kwamba Kiebrania kinasema kwa ufupi “kitu hicho kitakatifu.”
theological_decisions:
- issue: Umasculini wa jumla katika sheria
  choice: Kuhifadhi “mwanamume” katika matini kuu
  alternative: mtu yeyote; mtu
  rationale: Kiebrania kinatumia אִישׁ, umoja wa kiume, katika kauli ya kisheria. Tafsiri inahifadhi umbo hilo bila kukataa uwezekano kwamba kanuni hiyo hutumika kwa ujumla.
- issue: Asili ya kitu kinachorejeshwa
  choice: Kutafsiri malipo kuwa thamani ya kitu kitakatifu
  alternative: kumpa kuhani kitu hicho kitakatifu
  rationale: Kiebrania kinarudia קֹדֶשׁ kwa upana, lakini kwa kuwa kitu kililiwa, Kiswahili kinahitaji kuweka wazi kwamba thamani yake ndiyo inayolipwa. Tanbihi huhifadhi usemi halisi na kutoruhusu ufafanuzi huo kuficha upana wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya heshima, ya sasa, na inayoeleweka. Muundo wa sharti umewekwa kwa “akila,” na msamiati wa kisheria umeelezwa kwa uwazi bila kuingiza msimamo wa dhehebu.
