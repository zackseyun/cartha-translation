  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: sw
  text: Asile mzoga wa mnyama aliyekufa mwenyewe wala mnyama aliyeraruliwa na wanyama wa kuwinda[a], ili asijitie unajisi kwa nyama hiyo. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Asile mzoga wa mnyama aliyekufa mwenyewe au wa mnyama aliyeraruliwa na wanyama wa kuwinda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: mnyama aliyemkuta amekufa
  rationale: Neno hili humaanisha mzoga wa mnyama, hasa mnyama aliyekufa bila kuchinjwa ipasavyo. Kauli hii inaeleza maana hiyo kwa Kiswahili cha kawaida katika muktadha wa sheria za chakula.
- source_word: וּטְרֵפָה
  choice: aliyeraruliwa na wanyama wakali
  rationale: Neno טְרֵפָה humaanisha mnyama aliyeraruliwa na wanyama wawindaji; kutaja wanyama wakali huweka wazi mtendaji anayodokezwa na Kiebrania.
- source_word: לֹא יֹאכַל
  choice: Asile
  rationale: Kitenzi cha Kiebrania kilichokanushwa kina nguvu ya katazo katika matini ya sheria; 'Asile' ni katazo la moja kwa moja, la asili na lenye hadhi kwa Kiswahili.
- source_word: לְטָמְאָה בָהּ
  choice: akajitia unajisi kwa mnyama huyo
  rationale: 'Muundo wenye ל unaweza kuonyesha kusudi au matokeo: kula nyama hiyo kungemfanya kuhani kuwa najisi. ''Akajitia unajisi'' huhifadhi uhusiano huo bila kuamua kwa nguvu kati ya kusudi na matokeo.'
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahweh
  rationale: Huhifadhi jina la agano יְהוָה kwa namna ya 'Yahweh' na kuakisi moja kwa moja fomula ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ina jina maalumu la Mungu, יְהוָה. 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Aina ya unajisi katika לְטָמְאָה בָהּ
  choice: unajisi
  alternative: uchafu
  rationale: Katika muktadha wa Walawi, טמא ni istilahi ya hali ya kiibada; 'unajisi' huepuka kudokeza kwamba kinachozungumziwa ni uchafu wa kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Katazo 'Asile' ni fupi na la kawaida katika lugha ya sheria. Neno 'mnyama' limerudiwa katika kishazi cha unajisi ili kuondoa utata wa kiwakilishi bila kubadili maana.
