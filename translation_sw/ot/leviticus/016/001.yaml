base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: sw
  text: Yahwe akasema na Musa baada ya kufa kwa wana wawili wa Aroni, walipokaribia mbele za Yahwe[a], wakafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “walipomkaribia Yahwe.” Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “katika kukaribia kwao mbele za Yahwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika utangulizi huu wa usemi wa Mungu, “akasema na” ni Kiswahili cha kawaida na huonyesha kwamba Yahwe alimwelekezea Musa maneno.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa kutamkwa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: אַחֲרֵי מוֹת
  choice: baada ya kufa kwa
  rationale: Hii ni tafsiri ya kawaida ya kishazi kinachoonyesha kwamba usemi ulitokea baada ya tukio la kifo cha wana hao wawili.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: wana wawili wa Aroni
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi idadi pamoja na uhusiano wao na Aroni.
- source_word: בְּקָרְבָתָם
  choice: walipokaribia
  rationale: Kiambishi ב pamoja na kitenzi-jina hapa kina maana ya wakati, yaani “walipokaribia”; tafsiri hii pia inadumisha maana ya kukaribia katika mazingira ya ibada.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Tafsiri hii ya moja kwa moja inaweza kuonyesha mahali au kuwapo mbele za Mungu bila kufafanua zaidi kuliko Kiebrania.
- source_word: וַיָּמֻתוּ
  choice: wakafa
  rationale: Neno hili linaendeleza mfululizo wa simulizi kwa ufupi na kuhifadhi msisitizo mkali wa Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko linatumia jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kukaribia mbele za Yahwe
  choice: walipokaribia mbele za Yahwe
  alternative: walipoingia mbele za Yahwe
  rationale: Kiebrania kinaeleza kukaribia kwao bila kutaja hapa kwa uwazi tendo mahususi lililowaua; tafsiri haiongezi maelezo ya kimadhehebu wala kutatua mvutano huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Marudio ya habari ya kifo yamehifadhiwa kwa sababu yapo katika Kiebrania na yanaunganisha mazingira ya tukio na matokeo yake.
