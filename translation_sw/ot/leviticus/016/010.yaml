  to: Lakini yule mbuzi ambaye kura kwa ajili ya Azazeli ilimwangukia atasimamishwa akiwa hai mbele za YAHWEH, ili kufanya upatanisho juu yake[a], na kumpeleka jangwani kwa Azazeli[b].
  rationale: The revision corrects the rendering of the Hophal יָעֳמַד and removes an added temporal nuance, while retaining the draft’s source-sensitive treatment of Azazel and the ambiguity of “make atonement over it.”
