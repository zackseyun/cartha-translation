  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: sw
  text: Lakini yule mbuzi ambaye kura kwa ajili ya Azazeli ilimwangukia atasimamishwa akiwa hai mbele za YAHWEH, ili kufanya upatanisho juu yake[a], na kumpeleka jangwani kwa Azazeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufanya upatanisho kwa ajili yake.”
    reason: lexical_alternative
  - marker: b
    text: Maana ya neno la Kiebrania “Azazeli” inabishaniwa; huenda ni jina maalumu, au neno linalohusiana na kuondolewa. Kwa hiyo wengine hutafsiri “kwa ajili ya mbuzi wa kuondolewa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: Lakini yule mbuzi
  rationale: Kiunganishi kinaonyesha utofauti na mbuzi mwingine wa muktadha uliotangulia; “mbuzi” ni ya kawaida na inatosha katika mazingira haya ya ibada.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: ambaye kura kwa ajili ya Azazeli ilimwangukia
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba mbuzi huyo aliteuliwa kwa kura, huku ikihifadhi picha ya kura kumwangukia.
- source_word: לַעֲזָאזֵל
  choice: kwa ajili ya Azazeli
  rationale: Maana ya עֲזָאזֵל inabishaniwa. Kutamka jina kwa herufi za Kiswahili huhifadhi utata wa Kiebrania bila kulifasiri moja kwa moja kuwa “mbuzi wa kuondolewa.”
- source_word: יָעֳמַד חַי
  choice: atawekwa hai
  rationale: 'Umbo la kitenzi lina nguvu ya kusababishwa/kutendwa: mbuzi anawekwa au anasimamishwa akiwa hai. “Atawekwa hai” ni ya asili na huhifadhi wazo hilo.'
- source_word: לִפְנֵי יְהוָה
  choice: mbele za YAHWEH
  rationale: “Mbele za” ni usemi wa kawaida wa ibada unaomaanisha katika uwepo wake; jina la agano limetolewa kama YAHWEH kwa uwazi.
- source_word: לְכַפֵּר עָלָיו
  choice: ili kufanya upatanisho juu yake
  rationale: “Kufanya upatanisho” huwasilisha matumizi ya כפר katika ibada, na “juu yake” huhifadhi עַל bila kuamua ikiwa ni upatanisho kwa ajili ya mbuzi au tendo linalofanywa juu yake.
- source_word: לְשַׁלַּח אֹתוֹ
  choice: kisha kumpeleka
  rationale: Kitenzi kinaonyesha kusudi la kumwondoa na kumtuma; “kumpeleka” ni cha asili kwa mnyama anayepelekwa mahali fulani.
- source_word: הַמִּדְבָּרָה
  choice: jangwani
  rationale: Kiishio cha mwelekeo kinaonyesha mwendo kuelekea nyikani; “jangwani” hutoa maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya עֲזָאזֵל
  choice: Azazeli (jina lililotoholewa)
  alternative: mbuzi wa kuondolewa; kuondolewa kabisa
  rationale: Neno linaweza kuwa jina la kiumbe au mahali pa jangwani, au neno linalohusiana na kuondolewa. Kulitohoa huhifadhi mvutano huo badala ya kuamua tafsiri moja.
- issue: Nguvu ya לְכַפֵּר עָלָיו
  choice: kufanya upatanisho juu yake
  alternative: kufanya upatanisho kwa ajili yake
  rationale: Kihusishi עַל kinaweza kueleweka “juu yake” au, kwa upanuzi, “kwa ajili yake.” Matini kuu huhifadhi muundo wa kwanza, na uwezekano wa pili unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili bila kuondoa utata wa istilahi za ibada.
