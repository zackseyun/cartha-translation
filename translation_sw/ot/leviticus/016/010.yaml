    text: Au, “kufanya upatanisho kwa ajili yake.”
    reason: lexical_alternative
  - marker: b
    text: Maana ya neno la Kiebrania “Azazeli” inabishaniwa; huenda ni jina maalumu, au neno linalohusiana na kuondolewa. Kwa hiyo wengine hutafsiri “kwa ajili ya mbuzi wa kuondolewa.”
    reason: alternative_reading
  revision_rationale: The revision corrects the rendering of the Hophal יָעֳמַד and removes an added temporal nuance, while retaining the draft’s source-sensitive treatment of Azazel and the ambiguity of “make atonement over it.”
