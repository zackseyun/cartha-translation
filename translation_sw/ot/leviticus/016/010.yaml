review_pass:
  verdict: revise
  source_fidelity: The transliteration “Azazeli” appropriately preserves the disputed sense of עֲזָאזֵל, and “kura ... ilimwangukia” accurately conveys the lot idiom. However, “atawekwa hai” is not an idiomatic or sufficiently precise rendering of יָעֳמַד חַי, which denotes being made to stand/presented while alive. “Kisha” also introduces an explicit temporal sequence not marked by the paired Hebrew purpose infinitives.
  naturalness: “Atasimamishwa akiwa hai” is clear, natural formal Swahili and retains the passive-causative force. Coordinating the two purpose phrases with “na” reflects the Hebrew structure without needlessly specifying sequence.
  terminology: “Upatanisho,” “jangwani,” and “Azazeli” are suitable. The main wording continues to preserve the ambiguity of לְכַפֵּר עָלָיו through “juu yake.” The footnotes retain the lexical alternative and explain the disputed Azazel term without deciding it.
  issues:
  - severity: medium
    issue: “atawekwa hai” for יָעֳמַד חַי
    rationale: This can suggest merely being kept alive or placed alive, rather than being caused to stand/presented alive before Yahweh. “Atasimamishwa akiwa hai” conveys both the passive-causative verbal force and the contrast with the sacrificed goat.
  - severity: low
    issue: “kisha” adds temporal sequencing
    rationale: The Hebrew uses two purpose infinitives, not an explicit ‘then.’ Replacing it with “na” retains the coordinated purposes more closely.
  revised_text: Lakini yule mbuzi ambaye kura kwa ajili ya Azazeli ilimwangukia atasimamishwa akiwa hai mbele za YAHWEH, ili kufanya upatanisho juu yake[a], na kumpeleka jangwani kwa Azazeli[b].
  revised_footnotes:
