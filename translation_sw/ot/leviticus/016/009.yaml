base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: sw
  text: Kisha Aroni atamleta yule mbuzi ambaye kura ya Yahweh ilimwangukia[a], na kumfanya kuwa sadaka ya dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule mbuzi ambaye kura kwa ajili ya Yahweh ilitokea kwa ajili yake.”
    reason: Njia nyingine ya kuwakilisha kwa karibu nahau עָלָה עָלָיו הַגּוֹרָל, yaani kura ilitokea kwa mbuzi huyo.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: atamleta
  rationale: Katika muktadha wa ibada ya dhabihu, hiphil ya קרב humaanisha kumleta mnyama karibu au kumwasilisha kwa tendo la ibada. “Atamleta” ni Kiswahili cha kawaida na hakitangulizi tendo lenyewe la kumtoa kuwa dhabihu kabla ya kishazi cha mwisho.
- source_word: הַשָּׂעִיר
  choice: yule mbuzi
  rationale: שׂעיר hapa ni mbuzi, kwa kawaida mbuzi dume. Muktadha tayari unatambulisha wanyama wa ibada, hivyo “mbuzi” ni wazi na ya kawaida bila uzito usio wa lazima.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: ambaye kura ... ilimwangukia
  rationale: Usemi huu unaonyesha kwamba kura ilimteua mbuzi huyo. “Kura ilimwangukia” huhifadhi taswira na muundo wa Kiebrania huku ikieleweka kwa Kiswahili.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Kiambishi ל־ kinaonyesha uteuzi wa mbuzi huyo kuwa wa au kwa ajili ya Yahweh, tofauti na mbuzi wa kura nyingine.
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: na kumfanya kuwa sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חטאת humaanisha sadaka ya dhambi. Muundo huu unabaki karibu na “kumfanya” wa Kiebrania na unaonyesha wazi matumizi ya mbuzi katika ibada.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Atamleta” limechaguliwa badala ya “atamwasilisha” ili lugha iwe ya asili; “sadaka ya dhambi” huhifadhi istilahi ya kiibada.
