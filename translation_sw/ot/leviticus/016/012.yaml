id: LEV.16.12
reference: Leviticus 16:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: sw
  text: Kisha atachukua chetezo kilichojaa makaa ya moto kutoka juu ya madhabahu iliyo mbele za Yahwe, pamoja na uvumba wenye harufu nzuri uliosagwa laini, kiasi cha kujaa viganja vyake vyote viwili; naye atavileta ndani ya pazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande wa ndani wa pazia.” Usemi wa Kiebrania unarejelea kuleta chetezo na uvumba katika eneo lililo nyuma ya pazia, yaani, patakatifu pa ndani.
    reason: Njia nyingine ya kutafsiri usemi wa mahali מִבֵּית לַפָּרֹכֶת.
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha atachukua
  rationale: Katika maagizo ya ibada, umbo hili linaendeleza mfuatano wa hatua zinazopaswa kufanywa; ‘Kisha atachukua’ ni la asili na linaonyesha mwendelezo huo.
- source_word: מְלֹא הַמַּחְתָּה
  choice: chetezo kilichojaa
  rationale: Kirai hiki kwa maana halisi ni ‘ujazo wa chetezo’ na kinaonyesha chetezo kilichojazwa; Kiswahili hiki ni cha kawaida na kinahifadhi chombo pamoja na kiasi.
- source_word: גַּחֲלֵי אֵשׁ
  choice: makaa ya moto
  rationale: Hili ni neno la kawaida la Kiswahili kwa makaa yanayowaka na linafikisha wazi maana ya kirai cha Kiebrania.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: kutoka juu ya madhabahu
  rationale: ‘Juu ya’ linahifadhi maelezo ya mahali yanayotolewa na kihusishi מֵעַל, badala ya kusema kwa ujumla tu ‘kutoka madhabahuni.’
- source_word: מִלִּפְנֵי יְהוָה
  choice: iliyo mbele za Yahwe
  rationale: Kirai kinaeleza mahali madhabahu ilipo kuhusiana na Yahwe; ‘mbele za’ ni usemi wa heshima na wa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: וּמְלֹא חָפְנָיו
  choice: kiasi cha kujaa viganja vyake vyote viwili
  rationale: Neno la Kiebrania linaonyesha ujazo wa mikono au viganja vyake, na umbo lake la jozi linadokeza viganja viwili; tafsiri hii inaeleweka kwa urahisi na kuhifadhi kiasi hicho.
- source_word: קְטֹרֶת סַמִּים
  choice: uvumba wenye harufu nzuri
  rationale: Kirai kinamaanisha uvumba uliotengenezwa kwa vitu vya kunukia; tafsiri hii ni ya kawaida na huepuka maana isiyofaa ya ‘mtamu.’
- source_word: דַּקָּה
  choice: uliosagwa laini
  rationale: Kivumishi hiki kinaonyesha kitu kilichopondwa au kusagwa hadi kuwa laini, jambo ambalo ni muhimu katika utayarishaji wa uvumba.
- source_word: וְהֵבִיא
  choice: naye atavileta
  rationale: Kitenzi kinaendeleza agizo na kinaeleza kuletwa kwa chetezo na uvumba mahali panapotajwa; ‘atavileta’ kinafanya marejeo ya vitu hivyo yawe wazi katika Kiswahili.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: ndani ya pazia
  rationale: Katika muktadha huu, usemi uliobanwa unaelekeza kwenye eneo lililo nyuma au upande wa ndani wa pazia la patakatifu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Mahali pa kupeleka chetezo na uvumba kuhusiana na pazia
  choice: ndani ya pazia
  alternative: upande wa ndani wa pazia
  rationale: Muktadha wa ibada unaonyesha kuingia katika nafasi iliyo nyuma ya pazia, lakini usemi wa Kiebrania ni uliobanwa. Tafsiri kuu ni ya kawaida, huku tanbihi ikihifadhi namna nyingine ya kueleza uhusiano huo wa mahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Chetezo,’ ‘madhabahu,’ ‘uvumba,’ na ‘pazia’ ni istilahi zilizozoeleka; muundo wa sentensi umewekwa wa asili bila kupoteza mfuatano na maelezo ya Kiebrania.
