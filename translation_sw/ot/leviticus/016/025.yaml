  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: sw
  text: Naye atayateketeza mafuta ya sadaka ya dhambi juu ya madhabahu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania linaweza kumaanisha sadaka inayotumiwa kwa utakaso kutokana na dhambi au unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Naye
  rationale: Kiunganishi וְ kinaunganisha tendo hili na mfululizo wa ibada uliotangulia; אֵת ni alama ya yambwa na haitafsiriwi kivyake. “Naye” ni muunganisho wa kawaida unaomhusu kuhani.
- source_word: חֵלֶב
  choice: mafuta
  rationale: Katika muktadha wa dhabihu, חֵלֶב ni mafuta maalumu ya mnyama yaliyotengwa kwa kuteketezwa madhabahuni. “Mafuta” ni tafsiri ya moja kwa moja bila kuongeza neno “sehemu” lisilo wazi katika mstari huu.
- source_word: הַחַטָּאת
  choice: ya sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חַטָּאת kwa kawaida hutaja sadaka inayohusiana na dhambi na utakaso. “Sadaka ya dhambi” inaeleweka kwa wasomaji wengi, huku maana mbadala ya kiibada ikihifadhiwa katika tanbihi.
- source_word: יַקְטִיר
  choice: ataiteketeza
  rationale: Hifili ya קטר humaanisha kuteketeza kitu madhabahuni ili kipande moshi kama sadaka. “Ataiteketeza” ni ya asili katika Kiswahili na inaonyesha tendo la kiibada, si kuchoma kwa kawaida tu.
- source_word: הַמִּזְבֵּחָה
  choice: madhabahuni
  rationale: 'Ingawa umbo la Kiebrania linaweza kuelekezwa kihalisi ‘kwenda madhabahuni,’ pamoja na kitenzi cha kuteketeza maana ya kimuktadha ni mahali pa tendo: juu ya madhabahu. “Madhabahuni” ni usemi wa kawaida na fasaha.'
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kutaja sadaka inayohusiana na dhambi, lakini pia kazi yake ya kuleta utakaso kutokana na dhambi au unajisi. Tafsiri iliyozoeleka “sadaka ya dhambi” imetumiwa katika matini, na uwezekano muhimu wa “sadaka ya utakaso” umehifadhiwa katika tanbihi bila kuamua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Madhabahuni” inadumisha msamiati wa kawaida wa Biblia, na “ataiteketeza” inaeleza kwa usahihi uchomaji wa kiibada.
