base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: sw
  text: Mbuzi huyo atabeba juu yake maovu yao yote hadi nchi iliyotengwa[a], naye atamwachilia mbuzi huyo aende jangwani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi ya upweke,” “nchi isiyofikika,” au “nchi iliyo ukiwa.” Huenda Kiebrania kinamaanisha mahali palipotengwa au palipokatiliwa mbali na makazi ya watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: atabeba
  rationale: Kitenzi נָשָׂא kina maana ya kubeba; hapa kinadumisha taswira halisi ya mbuzi kuyachukua maovu juu yake.
- source_word: הַשָּׂעִיר
  choice: mbuzi
  rationale: שָׂעִיר humaanisha mbuzi, mara nyingi mbuzi dume. Katika Kiswahili, “mbuzi” ni ya kawaida na jinsia yake si muhimu kwa maana ya mstari huu.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kirai hiki kinaonyesha kwamba maovu yanabebwa juu ya mbuzi mwenyewe na kinahifadhi taswira ya Kiebrania.
- source_word: כָּל עֲוֺנֹתָם
  choice: maovu yao yote
  rationale: עָוֹן inaweza kumaanisha uovu, kosa, au hatia. “Maovu” huhifadhi uzito wa kimaadili bila kupunguza usemi kuwa dhambi kwa ujumla.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: mpaka nchi iliyotengwa
  rationale: גְּזֵרָה ni neno gumu linalodokeza mahali palipokatiliwa mbali, palipotengwa, au pasipofikika. “Nchi iliyotengwa” ni ya asili katika Kiswahili na huhifadhi wazo la kutenganishwa.
- source_word: וְשִׁלַּח
  choice: atamwacha ... aende
  rationale: Katika muktadha huu שׁלח ni kumpeleka au kumwachilia mbuzi aende mbali. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kuondolewa kwake.
- source_word: בַּמִּדְבָּר
  choice: jangwani
  rationale: מִדְבָּר humaanisha nyika, jangwa, au eneo lisilokaliwa; “jangwani” ni tafsiri fupi na inayoeleweka katika muktadha huu.
theological_decisions:
- issue: Taswira ya mbuzi kubeba maovu ya watu
  choice: Kudumisha usemi halisi kwamba mbuzi anabeba maovu yao juu yake.
  alternative: Kutafsiri kwa ufafanuzi kuwa mbuzi “anaondoa dhambi zao.”
  rationale: Kiebrania kinaonyesha kwa uwazi uhamisho na uondoaji kwa njia ya tendo la ibada. Usemi halisi huhifadhi ishara hiyo bila kuingiza hitimisho la baadaye la kiteolojia.
- issue: Maana ya אֶרֶץ גְּזֵרָה
  choice: “nchi iliyotengwa” katika matini kuu.
  alternative: “nchi ya upweke,” “nchi isiyofikika,” au “nchi iliyo ukiwa.”
  rationale: Kirai hiki kina utata wa kileksika. Tafsiri kuu inadumisha wazo la kutengwa, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Juu yake” huhifadhi taswira ya Kiebrania, na “atamwacha ... aende” ni ya kawaida zaidi kuliko tafsiri ngumu ya neno kwa neno.
