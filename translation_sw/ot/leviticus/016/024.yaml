id: LEV.16.24
reference: Leviticus 16:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: sw
  text: Ataosha mwili wake[a] kwa maji mahali patakatifu[b], avae mavazi yake, kisha atoke na atoe sadaka yake ya kuteketezwa na sadaka ya kuteketezwa ya watu. Hivyo atafanya upatanisho[c] kwa ajili yake mwenyewe na kwa ajili ya watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyama yake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mahali patakatifu,” si lazima pawe chumba cha ndani cha patakatifu.'
    reason: lexical_alternative
  - marker: c
    text: Au, “kufidia dhambi”; katika baadhi ya miktadha ya ibada, “kutakasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: Ataosha
  rationale: Kauli hii ya sheria inaeleza hatua inayopaswa kufuatwa, hivyo wakati ujao una nguvu ya agizo la kiutaratibu.
- source_word: בְּשָׂרוֹ
  choice: mwili wake
  rationale: Ingawa neno la Kiebrania kwa kawaida ni ‘nyama yake,’ katika muktadha wa kuoga, ‘mwili wake’ ni Kiswahili cha kawaida na wazi.
- source_word: בַמַּיִם
  choice: kwa maji
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza maji yanayotumiwa kuosha.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: mahali patakatifu
  rationale: Kiebrania hakitumii kibainishi kinacholazimisha maana ya chumba maalumu kiitwacho Patakatifu; tafsiri hii inadumisha utofauti huo.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: avae mavazi yake
  rationale: ‘Mavazi’ yanadumisha hadhi ya lugha ya ibada, huku umbo la utegemezi ‘avae’ likiunganisha hatua hii kwa kawaida na kuosha.
- source_word: וְיָצָא
  choice: kisha atoke
  rationale: Inaonyesha mwendo wa kutoka mahali patakatifu na kuendelea na hatua inayofuata.
- source_word: וְעָשָׂה
  choice: kutoa
  rationale: Pamoja na sadaka kuwa shamirisho, ‘kutoa’ ni kitenzi cha kawaida cha Kiswahili kwa tendo la dhabihu kuliko tafsiri halisi ‘kufanya.’
- source_word: עֹלָתוֹ
  choice: sadaka yake ya kuteketezwa
  rationale: Hili ni neno linaloeleweka na lililozoeleka kwa dhabihu inayoteketezwa.
- source_word: עֹלַת הָעָם
  choice: sadaka ya kuteketezwa ya watu
  rationale: Linadumisha ulinganifu na ‘sadaka yake ya kuteketezwa’ na uhusiano wa sadaka hiyo na watu.
- source_word: וְכִפֶּר
  choice: atafanya upatanisho
  rationale: Hii ni tafsiri pana na iliyozoeleka katika sheria za dhabihu; haifungi neno hilo katika nadharia moja ya kitheolojia.
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: kwa ajili yake mwenyewe na kwa ajili ya watu
  rationale: Inaonyesha wazi tendo linalofanywa kwa niaba ya kuhani mwenyewe na ya watu.
theological_decisions:
- issue: Maana ya כפר katika sheria ya dhabihu ya Walawi
  choice: kufanya upatanisho
  alternative: kufidia dhambi; au, katika baadhi ya miktadha ya ibada, kutakasa
  rationale: ‘Kufanya upatanisho’ huhifadhi maana pana ya tendo la kikuhani bila kulifanya neno hilo liunge mkono nadharia moja tu; uwezekano wa kufidia au kutakasa umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko ya ibada. Sentensi inafuata kwa uwazi mfululizo wa hatua za sheria, huku ‘mahali patakatifu’ na ‘kufanya upatanisho’ vikihifadhi upana wa Kiebrania.
