base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: sw
  text: Kwa hayo Aroni ataingia katika Mahali Patakatifu akiwa na fahali kutoka katika kundi la ng’ombe[a] kwa ajili ya sadaka ya dhambi[b], na kondoo dume kwa ajili ya sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, neno kwa neno, “fahali, mwana wa kundi la ng’ombe”; huu ni usemi unaomaanisha fahali kutoka katika kundi la ng’ombe.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya sadaka ya utakaso.” Neno la Kiebrania linaweza kukazia utakaso wa kiibada pamoja na uhusiano wake na dhambi.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/זֹאת
  choice: Kwa hivi
  rationale: Muundo huu unaweza kuonyesha njia au vitu vinavyohitajika ili kuingia; “Kwa hivi” ni wa asili katika Kiswahili na unaacha orodha inayofuata ifafanue kinachokusudiwa.
- source_word: יָבֹא
  choice: ataingia
  rationale: Wakati ujao wa Kiswahili katika muktadha huu wa sheria unaonyesha agizo la jinsi Aroni anavyopaswa kuingia, si utabiri tu.
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: Mahali Patakatifu
  rationale: Katika muktadha wa Siku ya Upatanisho, neno hili linarejelea eneo takatifu la ndani ambalo Aroni angeruhusiwa kuingia; tafsiri hii ni mahususi kuliko “patakatifu” kwa ujumla.
- source_word: בְּ/פַר בֶּן בָּקָר
  choice: akiwa na fahali kutoka kundini
  rationale: Neno kwa neno ni “fahali, mwana wa ng’ombe,” lakini huo ni usemi wa Kiebrania unaomaanisha fahali kutoka katika kundi la ng’ombe. Tafsiri hii ni sahihi na ya kawaida katika Kiswahili.
- source_word: לְ/חַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Hili ndilo jina linalotambulika sana la dhabihu hiyo katika sheria za ibada, huku uwezekano wa “sadaka ya utakaso” ukihifadhiwa katika tanbihi.
- source_word: וְ/אַיִל
  choice: na kondoo dume
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya אַיִל katika muktadha huu.
- source_word: לְ/עֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida la Kiswahili kwa dhabihu iliyoteketezwa yote, na linaendana na muundo wa orodha ya dhabihu.
theological_decisions:
- issue: Maana ya neno la kiibada חַטָּאת
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: “Sadaka ya dhambi” hudumisha istilahi inayotambulika na uhusiano wa dhabihu na dhambi; tanbihi huhifadhi mkazo unaowezekana juu ya utakaso wa kiibada bila kuamua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Akiwa na” huonyesha vizuri vifaa vya dhabihu ambavyo Aroni anapaswa kuleta. Alama za tanbihi zimewekwa mara tu baada ya istilahi zinazohusika, kwa mpangilio [b][a] unaolingana na maandishi ya mashauriano.
