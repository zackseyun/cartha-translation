  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: sw
  text: Yule anayempeleka mbuzi kwa Azazeli[a] atafua mavazi yake na kuosha mwili wake kwa maji; baada ya hayo, anaweza kuingia kambini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya Azazeli.” Maana ya neno hili la Kiebrania inabishaniwa. Huenda likaeleweka kama jina au utambulisho maalumu, au kwa maana ya kiutendaji inayohusiana na kuondolewa—yaani, yule anayeitwa “mbuzi wa kuondolewa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: Yule anayempeleka ...
  rationale: Kivumishi-tendo chenye kiambishi bainishi kimetumiwa kama nomino kumtaja mtu anayetekeleza jukumu hilo. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi wazo la mhusika aliyepewa kazi ya kumpeleka mbuzi.
- source_word: הַשָּׂעִיר
  choice: mbuzi
  rationale: Katika muktadha huu neno linamtaja mbuzi dume wa ibada ambaye tayari ametambulishwa. “Mbuzi” ni wazi na ya kawaida bila kurudia maelezo yasiyohitajika.
- source_word: לַעֲזָאזֵל
  choice: kwa Azazeli
  rationale: Maana ya neno la Kiebrania inabishaniwa. Kulitoholewa kama jina au designation “Azazeli” kunahifadhi utata huo, huku “kwa” likiwezesha maana ya kuelekea au kuhusishwa na bila kuamua mjadala kupita kiasi.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: atafua mavazi yake
  rationale: Huu ni usemi wa kawaida kuhusu utakaso wa kiibada. “Atafua mavazi yake” ni wa sasa, wenye hadhi, na unaeleweka kwa urahisi katika sheria ya ibada.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: na kuoga mwili wake kwa maji
  rationale: Ingawa בָּשָׂר kwa msingi ni “nyama,” hapa linamaanisha mwili wa mtu katika muktadha wa kuoga kwa utakaso. “Kuoga mwili wake kwa maji” ni Kiswahili cha kawaida na kinadumisha kutajwa kwa maji.
- source_word: וְאַחֲרֵי כֵן
  choice: baada ya hayo
  rationale: 'Muundo huu unaonyesha wazi mfuatano wa hatua: kurudi kambini kunafuata baada ya kufua na kuoga.'
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: anaweza kuingia kambini
  rationale: Katika mantiki ya ibada, kauli hii inaonyesha kwamba baada ya kuoshwa ameruhusiwa kurudi kambini. “Anaweza kuingia” huwasilisha ruhusa hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya לַעֲזָאזֵל katika ibada ya Siku ya Upatanisho
  choice: 'Kulihifadhi kama jina au designation iliyotoholewa: “kwa Azazeli”'
  alternative: kwa ajili ya kuondolewa; kwa mbuzi wa kuondolewa; kwa kiumbe au nguvu ya jangwani
  rationale: Neno hili lina historia ya tafsiri zinazotofautiana, na mstari wenyewe haulifafanui. Kulitoholewa kunazuia tafsiri kuingiza kimyakimya ufafanuzi fulani wa kiteolojia na kunadumisha mvutano uliopo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ya ibada ulio wazi na wenye hadhi. “Mavazi” limetumiwa badala ya “nguo” ili kudumisha sajili ya maandiko bila kuwa la kizamani. Alama ya tanbihi imewekwa mara tu baada ya “Azazeli,” ambako suala la kimaana linatokea.
