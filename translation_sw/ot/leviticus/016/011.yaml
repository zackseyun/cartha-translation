base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: sw
  text: Aroni atamleta fahali wa sadaka ya dhambi kwa ajili yake mwenyewe,[a] naye atafanya upatanisho kwa ajili yake mwenyewe na kwa ajili ya nyumba yake;[b] kisha atamchinja fahali wa sadaka ya dhambi kwa ajili yake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fahali kwa ajili ya sadaka ya dhambi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kwa ajili yake mwenyewe na kwa ajili ya nyumba yake”; hapa “nyumba yake” inamaanisha watu wa nyumbani mwake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: atamleta
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta karibu au kuwasilisha. “Atamleta” ni Kiswahili cha kawaida na hakudokezi kwamba tendo lote la kutoa dhabihu limekamilika kabla ya kuchinja.
- source_word: פַּר הַחַטָּאת
  choice: fahali wa sadaka ya dhambi
  rationale: Muundo huu unamhusisha fahali na sadaka ya dhambi. Tafsiri hii ni wazi, yenye staha, na huhifadhi istilahi ya ibada.
- source_word: אֲשֶׁר לוֹ
  choice: aliye kwa ajili yake mwenyewe
  rationale: Katika ibada hii, maneno hayo yanaonyesha kwamba mnyama ameteuliwa kwa ajili ya Aroni, si kwamba ni mali yake tu.
- source_word: וְכִפֶּר
  choice: atafanya upatanisho
  rationale: כפר katika muktadha wa dhabihu za kikuhani ina maana ya kufanya upatanisho. Kauli hii huhifadhi maana pana ya ibada bila kuingiza nadharia fulani ya jinsi upatanisho unavyofanya kazi.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: kwa ajili yake mwenyewe na kwa ajili ya nyumba yake
  rationale: בעד huonyesha ni kwa manufaa au ni kwa niaba ya nani. “Nyumba yake” huhifadhi picha halisi ya Kiebrania, huku tanbihi ikifafanua kuwa hapa inamaanisha watu wa nyumbani mwake.
- source_word: וְשָׁחַט
  choice: kisha atamchinja
  rationale: שׁחט ni neno la kawaida la kuchinja mnyama wa dhabihu. “Kisha” huonyesha mfuatano wa matendo ulio katika kifungu.
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: fahali wa sadaka ya dhambi aliye kwa ajili yake mwenyewe
  rationale: Kirai kilichorudiwa kimetafsiriwa vivyo hivyo ili kuhifadhi urudiaji na msisitizo wa kiibada wa Kiebrania.
theological_decisions:
- issue: Tafsiri ya כפר katika lugha ya dhabihu
  choice: atafanya upatanisho
  alternative: atafanya utakaso
  rationale: “Atafanya upatanisho” huhifadhi maana iliyozoeleka katika ibada za kikuhani bila kuibana kwa wazo la utakaso pekee au kuingiza maelezo ya kimadhehebu kuhusu utendaji wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unaendeleza urudiaji wa kiibada wa Kiebrania; “fahali” ametajwa kwa ngeli ya viumbe hai, na istilahi “sadaka ya dhambi” pamoja na “kufanya upatanisho” zimetumiwa kwa uwazi wa kawaida wa kibiblia.
