review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the ritual sequence, the altar before Yahweh, atonement/purification of the altar, the partitive blood of both animals, and application to the altar's horns on every side. However, “atatoka na kwenda” unnecessarily separates the single Hebrew movement expression and is less idiomatic than “atatoka kwenda.”
  naturalness: The register is clear, modern Standard East African Swahili. “Atatoka kwenda kwenye madhabahu” is smoother than “atatoka na kwenda kwenye madhabahu.” “Kuifanyia upatanisho” is acceptable cultic Swahili, and the alternative purification nuance is appropriately supplied in the footnote.
  terminology: “Madhabahu,” “Yahwe,” “fahali,” “beberu,” and “pembe za madhabahu” are suitable and source-sensitive. The footnote correctly identifies the ritual-purification sense of כפר without narrowing the main rendering.
  issues:
  - severity: low
    issue: Awkward rendering of the movement verb
    rationale: The Hebrew וְיָצָא means “and/then he shall go out.” In Swahili, “atatoka kwenda kwenye…” naturally conveys going out to the altar. The draft’s “atatoka na kwenda” is understandable but needlessly repetitive.
  revised_text: Kisha atatoka kwenda kwenye madhabahu iliyo mbele za Yahwe, na kuifanyia upatanisho[a]. Atachukua kiasi cha damu ya fahali na kiasi cha damu ya beberu, na kuipaka kwenye pembe za madhabahu pande zote.
