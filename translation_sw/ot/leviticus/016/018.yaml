id: LEV.16.18
reference: Leviticus 16:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: sw
  text: Kisha atatoka kwenda kwenye madhabahu iliyo mbele za Yahwe, na kuifanyia upatanisho[a]. Atachukua kiasi cha damu ya fahali na kiasi cha damu ya beberu, na kuipaka kwenye pembe za madhabahu pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuitakasa”; katika mazingira ya ibada za kikuhani, kitenzi cha Kiebrania kinaweza kuwa na maana ya utakaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Kisha atatoka na kwenda
  rationale: Muundo huu unaendeleza mfuatano wa maagizo ya ibada na kudhihirisha mwendo wa kutoka mahali pa ndani kuelekea madhabahuni.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: madhabahu iliyo mbele za Yahwe
  rationale: ‘Madhabahu’ ni tafsiri ya moja kwa moja ya מִזְבֵּחַ, na ‘mbele za’ ni usemi wa kawaida wa Kiswahili unaowasilisha לִפְנֵי katika mazingira ya patakatifu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וְכִפֶּר עָלָיו
  choice: kuifanyia upatanisho
  rationale: Huhifadhi uzito mpana wa כפר katika ibada ya kikuhani bila kuifungamanisha na nadharia maalumu ya upatanisho; maana ya kuitakasa inawekwa katika tanbihi.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: Atachukua kiasi cha damu ya fahali na kiasi cha damu ya beberu
  rationale: מִן inayorudiwa ina maana ya kuchukua sehemu au kiasi cha kila damu. ‘Beberu’ hubainisha kwa kawaida mbuzi dume anayeonyeshwa na שָׂעִיר.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: na kuipaka kwenye pembe za madhabahu pande zote
  rationale: Katika tendo la ibada, ‘kuipaka’ ni Kiswahili cha asili kinachoeleza kuweka damu kwenye pembe; kiwakilishi cha umoja kinafuata sarufi ya Kiebrania, nacho ‘pande zote’ kinawasilisha סָבִיב.
theological_decisions:
- issue: Maana ya כפר katika ibada ya kikuhani
  choice: kuifanyia upatanisho
  alternative: kuitakasa
  rationale: ‘Kuifanyia upatanisho’ huhifadhi istilahi pana ya kiibada na uzito wake wa kitheolojia. Hata hivyo, kwa kuwa tendo linaelekezwa kwa madhabahu, maana ya utakaso wa kiibada ni halisi na imehifadhiwa kama tafsiri mbadala katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi mbili fupi zinadumisha mfuatano wa hatua za ibada. ‘Mbele za Yahwe,’ ‘fahali,’ ‘beberu,’ na ‘pembe za madhabahu’ ni wazi kwa wasomaji wa kawaida huku zikibaki karibu na maandishi ya Kiebrania.
