source:
  edition: WLC
  text: וְ/אֵת֩ פַּ֨ר הַֽ/חַטָּ֜את וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת דָּמָ/ם֙ לְ/כַפֵּ֣ר בַּ/קֹּ֔דֶשׁ יוֹצִ֖יא אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֑ה וְ/שָׂרְפ֣וּ בָ/אֵ֔שׁ אֶת עֹרֹתָ֥/ם וְ/אֶת בְּשָׂרָ֖/ם וְ/אֶת פִּרְשָֽׁ/ם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: sw
  text: Na fahali wa sadaka ya dhambi na beberu wa sadaka ya dhambi, ambao damu yao ililetwa ndani ili kufanya upatanisho katika mahali patakatifu[a], atawatoa nje ya kambi; kisha watachoma[b] kwa moto ngozi zao, nyama yao na kinyesi chao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika patakatifu.” Neno la Kiebrania linaweza kumaanisha mahali au eneo takatifu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hubadilika hapa kutoka umoja, “atawatoa,” kwenda wingi, “watachoma”; huenda kinatofautisha mwenye kusimamia utoaji huo na wale wanaosaidia kuchoma.
    reason: cultural_note
lexical_decisions:
- source_word: פַּר הַחַטָּאת
  choice: fahali wa sadaka ya dhambi
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba fahali huyo ndiye mnyama wa sadaka ya dhambi, huku ikihifadhi aina ya dhabihu iliyotajwa.
- source_word: שְׂעִיר הַחַטָּאת
  choice: beberu wa sadaka ya dhambi
  rationale: שָׂעִיר katika muktadha huu ni mbuzi dume; “beberu” ni neno fasaha na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: הוּבָא אֶת־דָּמָם
  choice: ambao damu yao ililetwa ndani
  rationale: Kauli ya kutendwa na maana ya kuelekea ndani zimehifadhiwa; kiwakilishi “ambao” kinawahusu wanyama wote wawili.
- source_word: לְכַפֵּר
  choice: ili kufanya upatanisho
  rationale: “Kufanya upatanisho” ni istilahi iliyozoeleka katika muktadha wa dhabihu na haibani maana kuwa utakaso pekee.
- source_word: בַּקֹּדֶשׁ
  choice: katika mahali patakatifu
  rationale: Huhifadhi wazo la eneo takatifu ambamo damu iliingizwa bila kulazimisha jina mahususi zaidi la sehemu hiyo.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: atawatoa mpaka nje ya kambi
  rationale: “Atawatoa” huhifadhi kausativi ya kitenzi na vitu viwili vinavyotolewa; “mpaka nje ya kambi” huonyesha wazi mwelekeo wa אֶל kwa Kiswahili cha asili.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: kisha watachoma kwa moto
  rationale: Wingi wa kitenzi umehifadhiwa, na “kwa moto” ni usemi wa kawaida unaoakisi בָאֵשׁ.
- source_word: עֹרֹתָם
  choice: ngozi zao
  rationale: “Ngozi” ndilo neno la kawaida na sahihi kwa ngozi za wanyama hawa.
- source_word: בְּשָׂרָם
  choice: nyama yao
  rationale: Katika muktadha wa mizoga ya wanyama, “nyama” ni ya asili zaidi kuliko “mwili” na inawakilisha בָּשָׂר kwa usahihi.
- source_word: פִּרְשָׁם
  choice: kinyesi chao
  rationale: Neno hili linarejelea kinyesi au uchafu wa ndani wa mnyama; “kinyesi” ni sahihi, wazi, na chenye staha kuliko “mavi” katika sajili hii.
theological_decisions:
- issue: Istilahi za dhabihu חטאת na כפר
  choice: sadaka ya dhambi; kufanya upatanisho
  alternative: sadaka ya utakaso; kufanya utakaso
  rationale: Chaguo kuu linahifadhi istilahi pana na zinazotambulika katika sheria ya dhabihu bila kuamua kwamba kazi inayokusudiwa hapa ni utakaso pekee.
- issue: Mabadiliko kutoka umoja יוֹצִיא kwenda wingi וְשָׂרְפוּ
  choice: atawatoa ... watachoma
  alternative: watawatoa ... watachoma
  rationale: Mabadiliko ya idadi katika Kiebrania yamehifadhiwa ili kutoficha uwezekano kwamba mtu mmoja anaagiza kutolewa kwa mizoga huku watu kadhaa wakiichoma.
- issue: Maana ya בַּקֹּדֶשׁ
  choice: katika mahali patakatifu
  alternative: katika patakatifu; katika hema takatifu
  rationale: Tafsiri hii inahifadhi eneo takatifu linalokusudiwa bila kulifanya kuwa dhana dhahania wala kutaja kwa uhakika sehemu ndogo kuliko inavyoruhusu neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili kwa Kiswahili, huku mabadiliko muhimu ya umoja kwenda wingi na istilahi za ibada yakihifadhiwa.
