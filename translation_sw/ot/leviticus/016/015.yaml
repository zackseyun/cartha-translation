  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: sw
  text: Kisha atamchinja mbuzi dume wa sadaka ya dhambi kwa ajili ya watu, ataingiza damu yake ndani ya pazia, na kuitendea damu yake kama alivyoitendea damu ya ng’ombe dume. Atainyunyiza juu ya kifuniko cha upatanisho[a] na mbele ya kifuniko hicho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama ilivyotafsiriwa kwa jadi, “kiti cha rehema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Kisha atamchinja
  rationale: Kitenzi kinamaanisha kuchinja mnyama kwa ibada. “Kisha” linaonyesha mfuatano wa maagizo unaounganishwa na waw, na wakati ujao unafaa katika utaratibu huu wa kisheria.
- source_word: שְׂעִיר הַחַטָּאת
  choice: beberu wa sadaka ya dhambi
  rationale: “Beberu” ni mbuzi dume, na muundo huu unaonyesha kwamba ndiye mnyama wa sadaka ya dhambi.
- source_word: אֲשֶׁר לָעָם
  choice: aliye kwa ajili ya watu
  rationale: Maneno haya yanamtenganisha beberu huyu na ng’ombe dume aliyetolewa kwa ajili ya Haruni; maana ya kawaida hapa ni kwamba sadaka hiyo ni kwa ajili ya watu.
- source_word: וְהֵבִיא אֶת־דָּמוֹ
  choice: ataingiza damu yake
  rationale: Hiphil ya בוא hapa humaanisha kupeleka au kuingiza damu katika sehemu ya ndani ya patakatifu.
- source_word: אֶל מִבֵּית לַפָּרֹכֶת
  choice: ndani ya pazia
  rationale: Kirai hiki kinaelekeza kwenye eneo la ndani, nyuma ya pazia. “Ndani ya pazia” ni kifupi, cha asili, na kinadumisha taswira ya eneo la ibada.
- source_word: וְעָשָׂה אֶת־דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: na kuitendea damu yake kama alivyoitendea damu ya ng’ombe dume
  rationale: Kiebrania kina usemi uliofupishwa unaomaanisha kufanya kwa damu hii matendo yale yale ya ibada aliyofanyia damu ya ng’ombe dume.
- source_word: הַפָּר
  choice: ng’ombe dume
  rationale: פַּר humaanisha ng’ombe dume, naye ndiye mnyama aliyetajwa mapema katika utaratibu huu.
- source_word: וְהִזָּה אֹתוֹ
  choice: Atainyunyiza
  rationale: Katika muktadha wa dhabihu, hiphil ya נזה humaanisha kunyunyiza; kiambishi cha yambwa kinarejelea damu.
- source_word: עַל הַכַּפֹּרֶת
  choice: juu ya kifuniko cha upatanisho
  rationale: כַּפֹּרֶת ni kifuniko cha dhahabu cha Sanduku. “Kifuniko cha upatanisho” kinaeleza kitu chenyewe na uhusiano wake na ibada ya upatanisho bila kutegemea istilahi ya kale isiyo wazi.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: na mbele ya kifuniko hicho
  rationale: לִפְנֵי huonyesha mahali palipo mbele ya kitu; tafsiri hii inadumisha tofauti ya kieneo kati ya kunyunyiza juu ya kifuniko na mbele yake.
theological_decisions:
- issue: Tafsiri ya כַּפֹּרֶת
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema
  rationale: Neno la Kiebrania linataja kifuniko cha Sanduku katika ibada ya Siku ya Upatanisho. “Kifuniko cha upatanisho” ni wazi kwa msomaji wa sasa na kinadumisha uhusiano wa kileksia na dhana ya upatanisho. Tafsiri ya jadi “kiti cha rehema” imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za ibada “sadaka ya dhambi,” “pazia,” na “upatanisho” zimetumiwa kwa uthabiti; marudio ya pili ya כַּפֹּרֶת yamewasilishwa kwa “kifuniko hicho” ili sentensi iwe ya asili bila kupoteza rejeleo.
