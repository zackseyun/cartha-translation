base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: sw
  text: Atainyunyiza baadhi ya damu juu yake kwa kidole chake mara saba, kisha ataisafisha[a] na kuiweka wakfu[b] kutokana na unajisi wa wana wa Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuitakasa kiibada.” Kitenzi cha Kiebrania ni neno la kawaida la kikuhani linalomaanisha kufanya kitu kiwe safi.
    reason: lexical_alternative
  - marker: b
    text: Au “kuitakasa” au “kuifanya kuwa takatifu.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni “wana wa Israeli”; usemi huu unairejelea jumuiya ya Israeli, yaani Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Atainyunyiza
  rationale: Kitenzi cha Kiebrania katika kauli ya Hifili hutumiwa kwa tendo la kunyunyiza damu katika ibada; “atainyunyiza” ni wazi na ya kawaida katika Kiswahili.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi kinarejelea madhabahu iliyotajwa katika mstari uliotangulia; “juu yake” hudumisha uhusiano huo kwa lugha ya kawaida.
- source_word: מִן־הַדָּם
  choice: baadhi ya damu
  rationale: 'Kiambishi מִן kina maana ya sehemu ya kitu hapa: damu kiasi inachukuliwa kutoka katika damu iliyopo kwa ajili ya kunyunyiza.'
- source_word: בְּאֶצְבָּעוֹ
  choice: kwa kidole chake
  rationale: Beth inaonyesha chombo au njia iliyotumiwa; “kwa kidole chake” ni usemi wa asili wa Kiswahili.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Huhifadhi kwa usahihi idadi maalumu ya tendo la kiibada.
- source_word: וְטִהֲרוֹ
  choice: kuitakasa
  rationale: טהר katika mazingira ya kikuhani humaanisha kukifanya kitu kiwe safi kiibada. “Kuitakasa” ni neno linaloeleweka na linafaa kwa madhabahu.
- source_word: וְקִדְּשׁוֹ
  choice: kuiweka wakfu
  rationale: קדש hapa ni kukitenga kitu kiwe kitakatifu; “kuiweka wakfu” huwasilisha maana hiyo bila kutumia lugha nzito isiyo ya kawaida.
- source_word: מִטֻּמְאֹת
  choice: kutokana na unajisi mbalimbali
  rationale: Wingi wa neno la Kiebrania umeonyeshwa kwa “mbalimbali,” huku “unajisi” likihifadhi maana ya uchafu wa kiibada.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata kwa karibu usemi wa Kiebrania huku likibaki wazi katika Kiswahili; linaweza pia kueleweka kijumla kama watu wa Israeli.
theological_decisions:
- issue: Lugha ya utakaso wa kiibada kuhusu madhabahu
  choice: Madhabahu inatakasa na kuwekwa wakfu kutokana na unajisi wa Israeli.
  alternative: “Kuisafisha” na “kuifanya kuwa takatifu.”
  rationale: Muktadha unaeleza athari ya ibada ya kikuhani kwa madhabahu, si uongofu wa kimaadili au utakaso wa ndani. Maneno yaliyochaguliwa yanadumisha maana ya kiibada.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Usemi huu unafuata muundo wa Kiebrania kwa karibu bila kuzuia maana yake ya kijumla kwa jumuiya yote ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Unajisi mbalimbali” huhifadhi wingi wa Kiebrania bila kutumia umbo lisilo la kawaida kama “unajisi mbalimbali mbalimbali.”
