  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: sw
  text: 'Hili litakuwa agizo la kudumu kwenu: katika mwezi wa saba, siku ya kumi ya mwezi huo, mtajinyenyekeza[a], wala mzawa au mgeni anayeishi miongoni mwenu asifanye kazi yoyote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “mtazitesa nafsi zenu.” Kauli hii kwa kawaida imeeleweka kuwa inahusisha kufunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Hili litakuwa
  rationale: Muundo huu wa kisheria unaelekeza kwenye maagizo yaliyotangulia. Kiwakilishi “Hili” kinafanya rejeo hilo lieleweke kwa Kiswahili bila kuongeza wazo jipya.
- source_word: לְחֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: חֻקָּה ni agizo au sheria iliyowekwa, na עוֹלָם hapa huonyesha wajibu unaoendelea. “Agizo la kudumu” ni la asili katika Kiswahili cha sasa na halilazimishi maana ya kifalsafa ya kutokuwa na mwisho.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: katika mwezi wa saba
  rationale: חֹדֶשׁ katika tarehe hii humaanisha mwezi wa kalenda.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: siku ya kumi ya mwezi huo
  rationale: Hufafanua nahau ya Kiebrania “tarehe kumi ya mwezi” kwa Kiswahili cha kawaida, huku “huo” ikirejelea mwezi wa saba.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: mtajinyenyekeza
  rationale: Nahau hii ina wazo pana la kujidhili au kujinyima. “Mtajinyenyekeza” huhifadhi upana huo bila kuifanya ifanane moja kwa moja na kufunga pekee; tafsiri halisi zaidi imewekwa katika tanbihi.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: na msifanye kazi yoyote
  rationale: מְלָאכָה ni kazi au shughuli ya kawaida. Kauli hii ni wazi, ya heshima, na ya kawaida katika Kiswahili.
- source_word: הָאֶזְרָח
  choice: mzawa
  rationale: אֶזְרָח humaanisha mwanajumuiya wa asili, tofauti na mgeni mkazi. “Mzawa” huwasilisha utofauti huo kwa ufupi.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: mgeni anayeishi miongoni mwenu
  rationale: גֵּר ni mtu wa nje aliyekaa ndani ya jamii ya Israeli. Kiswahili hiki huhifadhi hadhi yake kama mgeni mkazi na pia mwangwi wa kitenzi הַגָּר kwa njia ya asili.
theological_decisions:
- issue: Maana ya amri ya kujinyima katika sheria ya Siku ya Upatanisho
  choice: mtajinyenyekeza
  alternative: mtazitesa nafsi zenu; mtafunga
  rationale: Nahau ya Kiebrania ni pana kuliko tendo moja maalumu la ibada. Ingawa kwa kawaida imehusishwa na kufunga, kuitaja kufunga pekee katika matini kuu kungepunguza upeo wa maneno ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umehifadhiwa bila kuwa mzito; “mzawa wala mgeni” unaonyesha kwamba katazo la kazi linawahusu wote wawili. Alama ya tanbihi imewekwa baada ya kifungu kinachoifafanua.
