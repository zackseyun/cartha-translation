revisions:
- from: Kisha atachukua sehemu ya damu ya huyo fahali na kuinyunyiza kwa kidole chake juu ya sehemu ya mbele ya kiti cha rehema[a], upande wa mashariki. Naye atanyunyiza sehemu ya damu kwa kidole chake mara saba mbele ya kiti cha rehema.
  to: Atachukua sehemu ya damu ya fahali na kuinyunyiza kwa kidole chake juu ya upande wa mashariki wa kiti cha rehema[a]. Kisha atanyunyiza sehemu ya damu kwa kidole chake mara saba mbele ya kiti cha rehema.
  rationale: Marekebisho yanaweka wazi mwelekeo wa קֵדְמָה kama upande wa mashariki wa kapporet bila kuongeza maana. Pia yanafanya sentensi kuwa nyepesi zaidi kwa Kiswahili Sanifu na kusahihisha kwa upole uundaji wa tanbihi. Matendo mawili ya kunyunyiza, chombo chake, damu ya fahali, na idadi mara saba vimehifadhiwa.
