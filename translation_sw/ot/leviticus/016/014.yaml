  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: sw
  text: Atachukua sehemu ya damu ya fahali na kuinyunyiza kwa kidole chake juu ya upande wa mashariki wa kiti cha rehema[a]. Kisha atanyunyiza sehemu ya damu kwa kidole chake mara saba mbele ya kiti cha rehema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kifuniko cha upatanisho.” Neno la Kiebrania kapporet hurejelea kifuniko cha sanduku la agano, kinachohusishwa na upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha atachukua
  rationale: Katika maagizo ya ibada, umbo hili linaendeleza utaratibu unaopaswa kufuatwa; wakati ujao wa Kiswahili huonyesha agizo hilo kwa kawaida.
- source_word: מִדַּם הַפָּר
  choice: sehemu ya damu ya huyo fahali
  rationale: 'מִן ina maana ya sehemu ya kitu hapa: si damu yote, bali kiasi chake. “Huyo fahali” humrejelea fahali aliyetajwa katika muktadha wa karibu.'
- source_word: וְהִזָּה
  choice: kuinyunyiza
  rationale: Kitenzi נזה katika ibada za kikuhani hueleza kuweka damu kwa kuinyunyiza; hiki ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: בְאֶצְבָּעוֹ
  choice: kwa kidole chake
  rationale: Herufi ב inaonyesha chombo au njia iliyotumiwa; “kwa kidole chake” ni usemi wa kawaida wa Kiswahili.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת
  choice: juu ya sehemu ya mbele ya kiti cha rehema
  rationale: פְּנֵי hapa ina maana ya uso au sehemu ya mbele, na עַל inaonyesha kuwa damu inanyunyizwa juu yake.
- source_word: הַכַּפֹּרֶת
  choice: kiti cha rehema
  rationale: Hili ni jina linalotambulika katika Kiswahili kwa kifuniko cha sanduku la agano katika ibada. Maana yake halisi zaidi ya kifuniko na uhusiano wake na upatanisho umewekwa katika tanbihi.
- source_word: קֵדְמָה
  choice: upande wa mashariki
  rationale: Kielezi hiki kinaonyesha mwelekeo au upande wa mashariki; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: mbele ya kiti cha rehema
  rationale: לִפְנֵי inaonyesha mahali palipo mbele ya kitu, tofauti na tendo la kwanza lililofanywa juu ya sehemu yake ya mbele.
- source_word: יַזֶּה שֶׁבַע פְּעָמִים
  choice: atanyunyiza ... mara saba
  rationale: Wakati ujao unaendeleza agizo la utaratibu, na idadi saba imehifadhiwa wazi kwa sababu ni sehemu muhimu ya ibada.
- source_word: מִן הַדָּם
  choice: sehemu ya damu
  rationale: מִן imetafsiriwa kwa maana ya sehemu ya damu iliyotumiwa katika unyunyizaji wa kurudiwa.
theological_decisions:
- issue: Tafsiri ya הַכַּפֹּרֶת
  choice: kiti cha rehema
  alternative: kifuniko cha upatanisho
  rationale: Neno hilo linataja kifuniko cha sanduku la agano na mahali panapohusishwa na upatanisho katika ibada ya Siku ya Upatanisho. “Kiti cha rehema” huhifadhi istilahi ya ibada inayotambulika, huku “kifuniko cha upatanisho” kikionyesha kwa uwazi zaidi umbo la kitu na uhusiano wake wa kimsamiati; kwa hiyo mbadala umehifadhiwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maagizo ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi mbili zimetumiwa ili kuonyesha wazi matendo mawili tofauti ya kunyunyiza damu: kwanza juu ya sehemu ya mbele ya kifuniko, kisha mbele yake mara saba.'
