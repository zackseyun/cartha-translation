  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: sw
  text: Mtu yeyote asiwepo katika Hema la Kukutania wakati anapoingia kufanya upatanisho katika mahali patakatifu, mpaka atoke. Atafanya upatanisho kwa ajili yake mwenyewe, kwa ajili ya nyumba yake, na kwa ajili ya kusanyiko lote la Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל־אָדָם לֹא יִהְיֶה
  choice: Mtu yeyote asiwemo
  rationale: Neno אָדָם hapa linamaanisha mtu kwa ujumla; muundo wa Kiebrania unakataza kuwapo kwa mtu yeyote ndani ya hema wakati wa ibada hii.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Tafsiri ya kawaida na iliyo wazi ya jina la hema ambamo Mungu alikutana na Israeli.
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: kufanya upatanisho / Atafanya upatanisho
  rationale: Kitenzi כפר katika muktadha huu kinaeleza tendo la kikuhani la kushughulikia dhambi na kurejesha uhusiano; 'kufanya upatanisho' huhifadhi lugha ya ibada bila kuibana kwa maelezo ya kiutendaji pekee.
- source_word: בַּקֹּדֶשׁ
  choice: katika mahali patakatifu
  rationale: Huhifadhi maana ya mahali pa patakatifu bila kulazimisha hapa kuwa ni sehemu ipi hasa ya patakatifu.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: Katika muktadha huu 'nyumba' inahusu watu wa nyumbani au familia yake, huku tafsiri ya moja kwa moja ikihifadhi taswira ya Kiebrania.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: קהל ni jumuiya iliyokusanyika; 'kusanyiko' ni neno la heshima na la kawaida katika lugha ya kibiblia.
theological_decisions:
- issue: Upeo wa katazo la kuwapo ndani ya Hema la Kukutania
  choice: Mtu yeyote asiwemo
  alternative: Mwanaume yeyote asiwepo
  rationale: אָדָם kwa kawaida humaanisha mwanadamu au mtu, si lazima mwanaume wa jinsia ya kiume; tafsiri hii haiongezi kizuizi cha kijinsia ambacho hakijawekwa wazi na chanzo.
- issue: Maana ya כפר
  choice: kufanya upatanisho
  alternative: kufunika dhambi / kufanya utakaso
  rationale: Neno lina wigo wa maana wa ibada unaohusisha dhambi, utakaso, na upatanisho. 'Kufanya upatanisho' huhifadhi istilahi pana na mvutano wake wa kitheolojia bila kuchagua nadharia moja ya jinsi tendo hilo linavyofanya kazi.
- issue: Utambulisho wa בַּקֹּדֶשׁ
  choice: katika mahali patakatifu
  alternative: ndani ya Patakatifu Zaidi
  rationale: Kifungu chenyewe kinasema 'katika patakatifu' na hakitumii hapa jina maalumu lisilo na utata la Patakatifu Zaidi; tafsiri haipaswi kulibana zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimefuata mantiki ya chanzo huku zikiepuka ukakasi usio wa lazima. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
