  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: sw
  text: Kisha atawachukua wale mbuzi wawili na kuwaweka mbele za Yahweh, kwenye mlango wa hema la kukutania.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha atawachukua
  rationale: Katika maagizo ya kiibada, kitenzi hiki pamoja na kiunganishi kinaonyesha hatua inayofuata; wakati ujao wa Kiswahili unaeleza wajibu huo kwa kawaida.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: wale mbuzi wawili
  rationale: שָׂעִיר hapa humaanisha mbuzi, kwa kawaida dume. Muktadha tayari umetambulisha wanyama hao, hivyo “wale mbuzi wawili” ni wazi na wa kawaida bila kuongeza ufafanuzi usio wa lazima.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: na kuwaweka
  rationale: Hifili ya עמד ni kusababisha wasimame au kuwaweka mahali; “kuwaweka” inadumisha tendo halisi la kuwaweka katika eneo maalumu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי ina maana ya kuwa mbele au katika uwepo wa mtu; “mbele za” ni usemi wa Kiswahili unaofaa katika muktadha huu, na jina la Mungu limetafsiriwa Yahweh.
- source_word: פֶּתַח
  choice: kwenye mwingilio wa
  rationale: Neno hili hutaja mahali pa kuingilia au uwazi wa kuingilia; “kwenye mwingilio wa” ni la kawaida na linaonyesha mahali.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Tafsiri hii inadumisha maana ya hema lililowekwa kwa ajili ya kukutana bila kuingiza istilahi ya jengo la baadaye.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo cha Kiebrania kinatumia moja kwa moja jina la agano יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa maagizo ya kiibada, huku maneno yakibaki rahisi kueleweka.
