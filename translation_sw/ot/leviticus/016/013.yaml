  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָתַ֧ן אֶֽת הַ/קְּטֹ֛רֶת עַל הָ/אֵ֖שׁ לִ/פְנֵ֣י יְהוָ֑ה וְ/כִסָּ֣ה עֲנַ֣ן הַ/קְּטֹ֗רֶת אֶת הַ/כַּפֹּ֛רֶת אֲשֶׁ֥ר עַל הָ/עֵד֖וּת וְ/לֹ֥א יָמֽוּת־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: sw
  text: Naye ataweka uvumba juu ya moto mbele za Yahwe, ili wingu la uvumba lifunike kifuniko cha upatanisho[a] kilicho juu ya Ushuhuda, asije akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha rehema.” Neno la Kiebrania linamaanisha kifuniko cha Sanduku la Agano, hasa katika jukumu lake kwenye ibada za upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Naye ataweka
  rationale: Katika mfululizo wa maagizo ya ibada, umbo hili lina nguvu ya agizo linaloeleza tendo linalofuata; “ataweka” ni la kawaida na linaendeleza mtiririko wa kifungu.
- source_word: הַקְּטֹרֶת
  choice: uvumba
  rationale: “Uvumba” ni neno la kawaida la Kiswahili kwa manukato yanayoteketezwa katika ibada, bila kuongeza wazo la mchanganyiko ambalo halijaelezwa hapa.
- source_word: עַל הָאֵשׁ
  choice: juu ya moto
  rationale: Huwakilisha moja kwa moja kuwekwa kwa uvumba kwenye moto au makaa yanayowaka.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Usemi “mbele za” unaonyesha kuwapo mbele ya Mungu katika mazingira ya patakatifu, huku jina la agano יְהוָה likitolewa kama “Yahwe.”
- source_word: וְכִסָּה
  choice: ili ... lifunike
  rationale: “Ili” huonyesha kwa kawaida kusudi au matokeo yaliyokusudiwa ya kuweka uvumba motoni, bila kufuta uhusiano unaoweza kueleweka kama kusudi au matokeo.
- source_word: עֲנַן הַקְּטֹרֶת
  choice: wingu la uvumba
  rationale: Huhifadhi taswira na muundo wa kirai cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hilo linataja kifuniko cha sanduku katika jukumu lake ndani ya ibada ya upatanisho. Tafsiri hii ni wazi kwa msomaji wa leo kuliko istilahi ya kimapokeo “kiti cha rehema.”
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: kilicho juu ya Ushuhuda
  rationale: Huhifadhi neno la kiufundi “Ushuhuda” kwa ushahidi wa agano uliowekwa ndani ya sanduku, bila kulipanua kimafafanuzi kuwa vibao au hati.
- source_word: וְלֹא יָמוּת
  choice: asije akafa
  rationale: 'Ni usemi wa kawaida na wenye hadhi unaowasilisha kusudi la kinga au onyo la matokeo: kifo kisitokee.'
theological_decisions:
- issue: Tafsiri ya הַכַּפֹּרֶת katika mazingira ya patakatifu na upatanisho
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema
  rationale: “Kifuniko cha upatanisho” hutambulisha kitu chenyewe na uhusiano wake na ibada ya upatanisho. “Kiti cha rehema,” ingawa ni tafsiri ya kimapokeo, kinaweza kupendekeza kiti halisi; kwa hiyo kimehifadhiwa katika tanbihi.
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” huhifadhi jina binafsi la Mungu katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kishazi וְכִסָּה na agizo lililotangulia
  choice: ili ... lifunike
  alternative: na ... litafunika
  rationale: Muktadha unaunga mkono kusudi au matokeo yaliyokusudiwa ya wingu kufunika kifuniko. “Ili” huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kueleza zaidi jinsi kitendo hicho kinavyomzuia kuhani asife.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka katika maelekezo ya ibada. “Mbele za Yahwe” na “asije akafa” ni misemo ya asili yenye uzito unaofaa; herufi kubwa katika “Ushuhuda” inaonyesha matumizi yake kama istilahi maalumu ya agano.
