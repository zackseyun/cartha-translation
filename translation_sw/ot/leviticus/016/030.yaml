base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: sw
  text: Kwa maana siku hii upatanisho utafanywa[a] kwa ajili yenu ili kuwatakasa na dhambi zenu zote; mbele za Yahwe[b] mtakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atafanya upatanisho kwa ajili yenu.” Kitenzi cha Kiebrania kiko katika umoja, lakini mtendaji wake hajatajwa wazi katika kishazi hiki.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania YHWH; kwa kawaida hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa amri iliyotangulia na ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: בַיּוֹם הַזֶּה
  choice: siku hii
  rationale: Inahifadhi kiashiria cha Kiebrania na rejeo lake la moja kwa moja kwa siku ya ibada inayozungumziwa.
- source_word: יְכַפֵּר
  choice: upatanisho utafanywa
  rationale: Kitenzi hiki ni istilahi ya ibada ya kufanya upatanisho. Muundo wa kutendwa huepuka kumtaja mtendaji ambaye hajasemwa wazi katika kishazi cha Kiebrania.
- source_word: עֲלֵיכֶם
  choice: kwa ajili yenu
  rationale: Pamoja na כפר, kihusishi על huonyesha watu wanaofanyiwa upatanisho; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לְטַהֵר אֶתְכֶם
  choice: ili kuwatakasa
  rationale: Infinitivu inaonyesha kusudi au matokeo ya upatanisho, na 'kuwatakasa' inafaa kwa utakaso wa kiibada huku ikieleweka kwa wasomaji wa kawaida.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: kutokana na dhambi zenu zote
  rationale: Katika muktadha huu חטאת inarejelea dhambi za watu, si sadaka za dhambi; 'kutokana na' inaonyesha kile ambacho wanatakaswa nacho.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Inawasilisha maana ya kuwa mbele au katika uwepo wa Mungu, huku jina la agano YHWH likitolewa kama 'Yahwe'.
- source_word: תִּטְהָרוּ
  choice: mtakuwa safi
  rationale: Qal inaeleza hali inayotokana na tendo la awali la kuwatakasa, hivyo inadumisha tofauti kati ya tendo na matokeo yake.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu YHWH moja kwa moja. 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Istilahi ya ibada כפר
  choice: upatanisho utafanywa
  alternative: atafanya upatanisho
  rationale: Tafsiri inadumisha maana ya kiibada bila kuingiza nadharia maalumu ya baadaye kuhusu namna upatanisho unavyofanya kazi, na pia haimtaji mtendaji ambaye kifungu hakimtaji wazi.
- issue: Uhusiano kati ya לְטַהֵר na תִּטְהָרוּ
  choice: ili kuwatakasa; mtakuwa safi
  alternative: ili kuwasafisha; mtatakaswa
  rationale: Uteuzi huu unatofautisha tendo la kuwatakasa na hali ya usafi inayofuata, kama miundo tofauti ya vitenzi vya Kiebrania inavyofanya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo wa kutendwa katika 'upatanisho utafanywa' unalinda utata halisi kuhusu mtendaji, na 'mtakuwa safi' huepuka kuchanganya tendo la utakaso na hali inayotokana nalo.
