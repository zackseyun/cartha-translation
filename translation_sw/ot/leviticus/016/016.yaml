id: LEV.16.16
reference: Leviticus 16:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: sw
  text: Naye atafanya upatanisho[a] kwa ajili ya mahali patakatifu kwa sababu ya unajisi wa wana wa Israeli, na kwa sababu ya maasi yao, kwa ajili ya dhambi zao zote; naye atafanya vivyo hivyo kwa ajili ya hema la kukutania lililoko pamoja nao katikati ya unajisi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Kufanya upatanisho’ hapa kunaweza pia kueleweka kwa upande wa utakaso wa kiibada, kwa kuwa ibada hiyo hushughulikia unajisi na dhambi. Kiebrania hutumia wingi katika ‘unajisi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: atafanya upatanisho
  rationale: Katika taratibu za Walawi, כפר huonyesha tendo la ibada linaloshughulikia dhambi na unajisi. ‘Kufanya upatanisho’ huhifadhi uzito mpana wa neno kuliko kulifupisha kuwa ‘kutakasa’ pekee.
- source_word: עַל הַקֹּדֶשׁ
  choice: kwa ajili ya mahali patakatifu
  rationale: הַקֹּדֶשׁ hapa ni eneo takatifu la maskani. ‘Mahali patakatifu’ ni la kawaida na linaacha wazi ikiwa rejeo ni patakatifu kwa upana au sehemu maalumu ya patakatifu.
- source_word: מִטֻּמְאֹת
  choice: kwa sababu ya unajisi
  rationale: מִן katika muundo huu huonyesha sababu au chanzo kinachohitaji upatanisho. Kiswahili hutumia ‘unajisi’ kwa kawaida kama nomino ya jumla, ingawa Kiebrania kina wingi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa ukaribu usemi wa Kiebrania unaolitaja taifa la agano kwa pamoja, na bado unaeleweka katika Kiswahili cha kibiblia.
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: na kwa sababu ya makosa yao
  rationale: פֶּשַׁע inaweza kumaanisha kosa zito, uvunjaji wa sheria, au uasi. ‘Makosa’ ni ya asili kwa Kiswahili bila kulazimisha kila tukio kumaanisha uasi wa wazi.
- source_word: לְכָל חַטֹּאתָם
  choice: yaani, dhambi zao zote
  rationale: Kirai hiki kinafafanua upeo wa makosa yaliyotajwa. ‘Dhambi’ inafaa zaidi hapa kuliko ‘sadaka za dhambi’ kutokana na ulinganifu na unajisi na makosa.
- source_word: וְכֵן יַעֲשֶׂה
  choice: naye atafanya vivyo hivyo
  rationale: Hutoa kwa uwazi kwamba tendo lilelile la kiibada litafanywa kwa hema la kukutania.
- source_word: לְאֹהֶל מוֹעֵד
  choice: kwa ajili ya hema la kukutania
  rationale: Hili ni jina la kawaida na lenye uwazi kwa אֹהֶל מוֹעֵד katika Kiswahili.
- source_word: הַשֹּׁכֵן אִתָּם
  choice: linalokaa pamoja nao
  rationale: Huhifadhi taswira isiyo ya kawaida lakini yenye maana ya hema kukaa pamoja na watu; kitenzi שׁכן kina maana ya kukaa au kufanya makao.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: katikati ya unajisi wao
  rationale: Huhifadhi taswira ya mahali patakatifu kuwapo katikati ya hali zao za unajisi, bila kuibadili kuwa kauli ya jumla tu kuhusu dhambi.
theological_decisions:
- issue: Maana ya כפר katika Siku ya Upatanisho
  choice: kufanya upatanisho
  alternative: kutakasa au kuondoa unajisi
  rationale: Muktadha unahusisha utakaso wa patakatifu kutokana na unajisi pamoja na kushughulikia dhambi. ‘Kufanya upatanisho’ huhifadhi vipengele hivyo bila kuifanya maana kuwa utakaso pekee.
- issue: Uhusiano wa לְכָל חַטֹּאתָם na ‘makosa yao’
  choice: 'kuisoma kama ufafanuzi wenye upeo: ‘yaani, dhambi zao zote’'
  alternative: ‘kwa ajili ya dhambi zao zote’ kama kirai tofauti kinacholingana na vilivyotangulia
  rationale: Sintaksia inaweza kusikika kama ufafanuzi au upanuzi wa makosa yao. ‘Yaani’ huonyesha uhusiano huo bila kubadili חטאות kuwa sadaka za dhambi.
- issue: Kinachokaa pamoja na Israeli katika הַשֹּׁכֵן אִתָּם
  choice: hema la kukutania ndilo linalotajwa kisarufi
  alternative: kueleza moja kwa moja kwamba Mungu anakaa kati yao
  rationale: Kivumishi-partisipio cha Kiebrania kinaambatana kisarufi na hema. Tafsiri haipaswi kubadili rejeo kuwa Mungu ingawa uwepo wake ndio msingi wa kitheolojia wa hema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Hema la kukutania’ na ‘wana wa Israeli’ huhifadhi istilahi za msingi za maandishi; ‘unajisi’ hutumiwa kama nomino ya jumla kwa ufasaha wa Kiswahili.
