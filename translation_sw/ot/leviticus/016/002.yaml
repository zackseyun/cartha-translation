  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: sw
  text: Yahwe akamwambia Mose, “Mwambie ndugu yako Aroni kwamba asiingie wakati wowote apendavyo katika Patakatifu, ndani ya pazia, mbele ya kifuniko cha upatanisho[a] kilicho juu ya Sanduku, ili asife; kwa maana nitajidhihirisha katika wingu juu ya kifuniko cha upatanisho.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiti cha rehema,” tafsiri ya jadi ya “kifuniko cha upatanisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: asiingie wakati wowote tu
  rationale: Katazo linahusu kuingia bila wakati uliowekwa, si tendo la kuingia daima; “wowote tu” linaonyesha kutoruhusiwa kwa uhuru huo.
- source_word: הַקֹּדֶשׁ
  choice: Patakatifu
  rationale: Katika muktadha huu neno linataja eneo takatifu la ndani la hema; “Patakatifu” ni fupi, lenye heshima, na linaeleweka katika muktadha wa ibada.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: ndani ya pazia
  rationale: Kirai kinaelekeza kwenye upande wa ndani wa pazia, yaani eneo lililofichwa nyuma yake.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno linataja kifuniko halisi cha Sanduku kinachohusishwa na taratibu za kufanya upatanisho; tafsiri hii huhifadhi kitu chenyewe pamoja na kazi yake ya kiibada.
- source_word: הָאָרֹן
  choice: Sanduku
  rationale: Chanzo kinasema tu “Sanduku,” bila kuongeza “la Agano”; herufi kubwa inaonyesha chombo hiki maalumu cha patakatifu.
- source_word: וְלֹא יָמוּת
  choice: ili asife
  rationale: Kauli hii inaonyesha matokeo yanayopaswa kuepukwa na inasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: kwa maana nitatokea katika wingu
  rationale: “Kwa maana” linaanzisha sababu ya katazo, na “katika wingu” linahifadhi taswira na uhusiano wa kisarufi wa maandishi ya Kiebrania bila kufafanua kupita kiasi aina ya wingu.
theological_decisions:
- issue: Maana ya כַּפֹּרֶת katika ibada ya patakatifu
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema
  rationale: Tafsiri iliyochaguliwa inaonyesha kuwa ni kifuniko cha Sanduku na inadumisha uhusiano wake na upatanisho. Tafsiri ya jadi “kiti cha rehema” imehifadhiwa katika tanbihi kwa sababu ni maarufu na ina uzito wa kihistoria.
- issue: Kiwango cha katazo katika בְּכָל עֵת
  choice: asiingie wakati wowote tu
  alternative: asiingie wakati wowote
  rationale: Nyongeza ya “tu” inaonyesha kuwa katazo si la kuingia kabisa, bali la kuingia bila wakati na utaratibu uliowekwa, kama muktadha wa sura unavyoonyesha.
- issue: Mahali au namna ya kujitokeza kwa Mungu katika בֶּעָנָן
  choice: nitatokea katika wingu
  alternative: nitatokea kwa wingu
  rationale: Kihusishi kinaweza kugusa mahali au namna. “Katika wingu” hufuata maana ya kawaida ya kirai na kuacha fumbo la jinsi uwepo wa Mungu unavyodhihirika bila kulitatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina “Yahwe,” “Mose,” na “Aroni” yametumika kwa maumbo yaliyozoeleka katika Kiswahili. Sentensi inadumisha uzito wa onyo la ibada bila kutumia lugha ya kale isiyo ya lazima.
