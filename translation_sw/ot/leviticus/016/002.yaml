review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the divine speech, Aaron’s restricted access, the veil, the ark cover, the fatal consequence, and Yahweh’s manifestation in the cloud. However, "wakati wowote tu" is not idiomatic Standard East African Swahili and can obscure the intended prohibition of entering whenever Aaron chooses.
  naturalness: Most wording is clear and suitably formal. Replacing "wakati wowote tu" with "wakati wowote apendavyo" gives the required sense naturally. "Nitajidhihirisha" is also a more natural and semantically fitting rendering of the divine appearance than "nitatokea."
  terminology: Yahwe, Mose, Aroni, Sanduku, and "kifuniko cha upatanisho" are consistent and appropriate. The lexical-alternative footnote is correctly anchored and phrased.
  issues:
  - severity: medium
    issue: '"asiingie wakati wowote tu" is unnatural and potentially ambiguous.'
    rationale: In Swahili, the placement of "tu" does not naturally convey "not at just any time." "Wakati wowote apendavyo" clearly expresses that Aaron must not enter at his own unrestricted discretion, while retaining the contextual implication that appointed entry remains possible.
  - severity: low
    issue: '"nitatokea katika wingu" is less precise and less idiomatic for the divine manifestation.'
    rationale: The Niphal אֵרָאֶה denotes appearing or making oneself visible. "Nitajidhihirisha katika wingu" preserves this without specifying a doctrinal mechanism.
  revised_text: Yahwe akamwambia Mose, “Mwambie ndugu yako Aroni kwamba asiingie wakati wowote apendavyo katika Patakatifu, ndani ya pazia, mbele ya kifuniko cha upatanisho[a] kilicho juu ya Sanduku, ili asife; kwa maana nitajidhihirisha katika wingu juu ya kifuniko cha upatanisho.”
  revised_footnotes:
  - marker: a
    text: Au “kiti cha rehema,” tafsiri ya jadi ya “kifuniko cha upatanisho.”
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful terminology and structure, while making the temporal restriction idiomatic and explicit in Standard East African Swahili. It also renders Yahweh’s appearance in language that more closely reflects the Hebrew verbal sense without overinterpreting it.
