base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: sw
  text: Naye atafanya upatanisho kwa ajili ya mahali patakatifu[a], kwa ajili ya Hema la Kukutania, na kwa ajili ya madhabahu; atafanya upatanisho kwa ajili ya makuhani na kwa ajili ya watu wote wa kusanyiko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atafanya utakaso kwa ajili ya mahali patakatifu”; katika muktadha huu wa ibada, kitenzi cha Kiebrania כפר kinaweza kusisitiza kuondolewa kwa unajisi pamoja na upatanisho.
    reason: lexical_alternative
  - marker: b
    text: “Watu wa kusanyiko” inaweza pia kutafsiriwa “watu wa jumuiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: atafanya upatanisho
  rationale: Kitenzi כפר kina maana maalumu ya kiibada katika Mambo ya Walawi. Kauli hii inadumisha maana ya kitheolojia na kiibada, huku tanbihi ikionyesha kwamba utakaso au kuondolewa kwa unajisi pia kunaweza kusisitizwa katika muktadha huu.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Tafsiri hii ni ya kawaida na inayoeleweka katika Kiswahili, nayo hailazimishi maana finyu ya Patakatifu Zaidi ambayo muundo wa Kiebrania hapa hautaji waziwazi.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina la kiibada lililo wazi na la kawaida katika Kiswahili, likihifadhi picha ya hema na kusudi la kukutana.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Ni neno la kawaida la Kiswahili kwa madhabahu ya ibada na linafaa katika muktadha huu.
- source_word: עַל
  choice: kwa ajili ya
  rationale: Pamoja na כפר, kauli hii inaeleza kwa Kiswahili sanifu yule au kile ambacho tendo la upatanisho linafanywa kwa ajili yake.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Ni tafsiri sanifu na ya moja kwa moja ya wingi wa כֹּהֵן.
- source_word: כָּל עַם הַקָּהָל
  choice: watu wote wa kusanyiko
  rationale: Inahifadhi wazo la watu wa jumuiya iliyokusanyika, badala ya kufupisha kuwa ‘watu wote’ pekee.
theological_decisions:
- issue: Lugha ya upatanisho inahusu vitu vitakatifu pamoja na watu
  choice: Kutumia kauli ileile ‘kufanya upatanisho kwa ajili ya’ kwa mahali patakatifu, Hema, madhabahu, makuhani, na watu.
  alternative: Kutumia ‘kutakasa’ kwa sehemu na vyombo vitakatifu, lakini ‘kufanya upatanisho’ kwa watu.
  rationale: Kiebrania kinarudia כפר na hivyo kuunganisha kiibada vitu vitakatifu na watu. Kudumisha kauli ileile huepuka kugawa kimafundisho tendo ambalo mstari wenyewe unaliwasilisha kwa neno moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘atafanya upatanisho’ yamedumishwa ili kuonyesha muundo wa Kiebrania; orodha ya kwanza imeshikamanishwa bila kurudia kihusishi kabla ya kila nomino kwa ufasaha wa Kiswahili.
