base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: sw
  text: Naye atatwaa kutoka kwa kusanyiko la wana wa Israeli mbuzi dume wawili kwa ajili ya sadaka ya dhambi[a], na kondoo dume mmoja kwa ajili ya sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת katika Mambo ya Walawi linaweza kumaanisha sadaka inayoshughulikia dhambi na unajisi wa kiibada.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: Naye ... kutoka kwa
  rationale: Kiunganishi na kihusishi vinaendeleza maagizo na kuonyesha chanzo cha wanyama; muundo huu ni wa kawaida katika Kiswahili.
- source_word: עֲדַת
  choice: kusanyiko
  rationale: Neno hili humaanisha jumuiya ya agano iliyokusanyika; “kusanyiko” linafaa katika muktadha wa ibada na linaeleweka kwa urahisi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania, ambao katika muktadha huu unawakilisha watu wa Israeli kwa ujumla.
- source_word: יִקַּח
  choice: atatwaa
  rationale: Kauli ya wakati ujao hapa ina nguvu ya agizo katika sheria ya ibada; “atatwaa” huhifadhi mtindo wa kisheria wenye heshima.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: mbuzi wawili madume
  rationale: Hutaja wazi idadi na jinsia ya wanyama kama ilivyo katika chanzo, kwa Kiswahili cha kawaida.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, neno hili hutaja sadaka inayoshughulikia dhambi na pia unajisi wa kiibada; tafsiri ya jadi iliyo wazi imewekwa katika matini, huku maana nyingine ikielezwa chini.
- source_word: וְאַיִל אֶחָד
  choice: na kondoo dume mmoja
  rationale: “Kondoo dume” ni istilahi ya kawaida ya Kiswahili kwa אַיִל, na “mmoja” huhifadhi msisitizo wa idadi.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: Hii ni sadaka inayoteketezwa nzima; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Matini kuu inahifadhi usemi halisi wa Kiebrania bila kuficha kwamba katika matumizi yake ya pamoja unawahusu Waisraeli kwa ujumla.
- issue: Maana ya חַטָּאת katika mfumo wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: “Sadaka ya dhambi” ni tafsiri ya jadi na wazi, lakini “sadaka ya utakaso” huonyesha kazi ya sadaka hii kuhusu dhambi na unajisi wa kiibada; utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisheria unaofaa maagizo ya ibada. “Atatwaa” na “sadaka ya kuteketezwa” hudumisha sajili ya kibiblia inayotambulika bila kuwa ya kizamani kupita kiasi.
