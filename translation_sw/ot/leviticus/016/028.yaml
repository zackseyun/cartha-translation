  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/ם יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: sw
  text: Yule anayeziteketeza atazifua nguo zake na kuuosha mwili wake kwa maji[b]; baada ya hayo, anaweza kuingia kambini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataingia kambini.” Kitenzi cha Kiebrania kinaweza kusomwa kama wakati ujao wa kawaida, lakini hapa huenda kinaonyesha ruhusa ya kuingia tena baada ya kujitakasa.
    reason: alternative_reading
  - marker: b
    text: Kwa maana halisi, “nyama yake.” Katika nahau hii ya kuosha, maana yake ni “mwili wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: Yule anayewateketeza
  rationale: Kivumishi-tendo chenye kibainishi kimetumika kama nomino, kikimtaja mtu anayeteketeza fahali na mbuzi, au mabaki yao, yaliyotajwa katika muktadha uliotangulia.
- source_word: אֹתָם
  choice: -wa- katika “anayewateketeza”
  rationale: Kiwakilishi cha yambwa kinawarejelea fahali na mbuzi waliotajwa kabla; Kiswahili hukibeba kwa kawaida ndani ya kitenzi.
- source_word: יְכַבֵּס
  choice: atazifua
  rationale: Kauli hii ina nguvu ya agizo katika sheria ya ibada. “Kufua” hutofautisha kusafisha nguo na kuosha mwili.
- source_word: בְּגָדָיו
  choice: nguo zake
  rationale: Ni usemi wa sasa na wa kawaida unaowasilisha maana ya mavazi bila uzito usio wa lazima.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ
  choice: na kuuosha mwili wake
  rationale: Ingawa בשר kwa msingi ni “nyama,” katika nahau hii ya kujitakasa humaanisha mwili wa mtu. “Kuuosha mwili wake” ni wazi na ya kawaida.
- source_word: בַּמָּיִם
  choice: kwa maji
  rationale: Katika Kiswahili, “kuosha ... kwa maji” ndiyo nahau ya kawaida ya chombo au njia ya kuosha; haiamui ikiwa mwili ulizamishwa ndani ya maji.
- source_word: וְאַחֲרֵי כֵן
  choice: baada ya hayo
  rationale: 'Inaonyesha mfuatano: kuingia tena kambini kunafuata baada ya kufua na kuosha.'
- source_word: יָבֹא
  choice: anaweza kuingia
  rationale: Katika muktadha wa masharti ya utakaso kabla ya kurejea kambini, kauli hii inaeleweka kwa kawaida kama ruhusa ya kuingia tena, ingawa umbo la Kiebrania pia laweza kutafsiriwa kama wakati ujao au agizo.
- source_word: אֶל־הַמַּחֲנֶה
  choice: kambini
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida mwendo wa kuingia ndani ya kambi.
theological_decisions:
- issue: Nguvu ya kauli ya mwisho katika sheria ya utakaso
  choice: anaweza kuingia kambini
  alternative: ataingia kambini
  rationale: Muktadha unaonyesha kwamba kuingia tena kunaruhusiwa baada ya matendo yanayotakiwa ya kujitakasa. Tanbihi huhifadhi uwezekano wa kusoma kitenzi kama kauli rahisi ya wakati ujao au ya maagizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Mtindo wa kisheria wa ibada umehifadhiwa, huku “kufua” na “kuosha” zikitofautisha nguo na mwili. Alama za tanbihi zimewekwa mara tu baada ya vipashio vinavyohusika.
