source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: sw
  text: 'Hili litakuwa sheria ya kudumu kwenu: kufanya upatanisho kwa ajili ya wana wa Israeli[a] kwa dhambi zao zote[b] mara moja kwa mwaka. Naye akafanya kama Yahwe alivyomwamuru Musa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watu wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “kutokana na dhambi zao zote,” tafsiri inayoangazia zaidi wazo la kuondolewa au kutakaswa kutokana na dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם
  choice: Hili litakuwa ... kwenu
  rationale: Muundo huu unahifadhi lugha ya kisheria ya Kiebrania kwa Kiswahili cha sasa na cha kawaida.
- source_word: לְחֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: חֻקָּה ni agizo au sheria iliyowekwa, na עוֹלָם hapa huonyesha hali ya kuendelea kudumu katika mfumo wa agano.
- source_word: לְכַפֵּר
  choice: kufanya upatanisho
  rationale: Hili ni neno la kawaida la ibada ya sadaka linalohifadhi maana kuu ya כפר katika Mambo ya Walawi 16.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: kwa ajili ya wana wa Israeli
  rationale: ‘Kwa ajili ya’ huonyesha kutendewa kwa niaba yao, na ‘wana wa Israeli’ hufuata kwa karibu jina la pamoja la Kiebrania.
- source_word: מִכָּל חַטֹּאתָם
  choice: kwa dhambi zao zote
  rationale: Hii ni tafsiri ya asili katika Kiswahili inayohusisha upatanisho na dhambi zote, huku wazo linalowezekana la kuondolewa au kutakaswa kutokana na dhambi likihifadhiwa katika tanbihi.
- source_word: אַחַת בַּשָּׁנָה
  choice: mara moja kwa mwaka
  rationale: Hii ndiyo namna ya kawaida na wazi ya kueleza tendo linalofanywa kila mwaka.
- source_word: וַיַּעַשׂ
  choice: Naye akafanya
  rationale: Kitenzi cha Kiebrania hakimtaji mtendaji kwa jina; tafsiri hii haiongezi jina na hivyo inadumisha hali hiyo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama Yahwe alivyomwamuru Musa
  rationale: Inafuata nahau ya simulizi ya Kiebrania na kulitaja jina la agano יְהוָה moja kwa moja kama Yahwe.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya כפר katika ibada ya ukuhani
  choice: kufanya upatanisho
  alternative: kutakasa; kufunika dhambi
  rationale: ‘Kufanya upatanisho’ huhifadhi istilahi pana ya kiteolojia bila kuamua kimya-kimya ikiwa mkazo pekee ni msamaha, utakaso, au kuondolewa kwa unajisi.
- issue: Utambulisho wa mtendaji katika וַיַּעַשׂ
  choice: Naye akafanya
  alternative: Haruni akafanya; Musa akafanya
  rationale: Kiebrania kinaacha kiima bila kutajwa katika mstari huu; kutaja Haruni au Musa kungeondoa utata halisi wa kisarufi kwa kuingiza ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wazi, na wa kisheria bila kuwa wa kizamani. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
