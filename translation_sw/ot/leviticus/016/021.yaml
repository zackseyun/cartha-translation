id: LEV.16.21
reference: Leviticus 16:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: sw
  text: Kisha Aroni ataweka mikono yake yote miwili juu ya kichwa cha yule mbuzi aliye hai, na atakiri juu yake maovu yote ya wana wa Israeli[a], makosa yao yote ya uasi, na dhambi zao zote. Atayaweka juu ya kichwa cha mbuzi huyo, kisha atampeleka jangwani kwa mkono wa mtu aliyeteuliwa kwa kazi hiyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mtu aliye tayari kwa kazi hiyo” au “mtu anayefaa kwa tukio hilo.” Usemi wa Kiebrania kuhusu jukumu la mtu huyu ni mgumu na unaweza kusisitiza utayari, uteuzi, au kufaa kwake kwa wakati huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: ataweka
  rationale: Katika ibada za dhabihu, kitenzi hiki kinaeleza tendo la kuweka au kuegemeza mikono juu ya mnyama. “Ataweka” ni wazi na hakiongezi kiwango cha shinikizo ambacho matini haijabainisha.
- source_word: שְׁתֵּי יָדוֹ
  choice: mikono yake yote miwili
  rationale: Huhifadhi msisitizo wa Kiebrania kwamba Aroni anatumia mikono miwili, kwa Kiswahili cha kawaida na cha wazi.
- source_word: הַשָּׂעִיר הַחַי
  choice: yule mbuzi aliye hai
  rationale: Humtambulisha mbuzi aliyebaki hai katika ibada hii na kutofautisha hali yake bila kutumia lugha isiyo ya kawaida.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: kuungama juu yake
  rationale: Huhifadhi tendo la kuungama na uhusiano wa kiibada unaoonyeshwa na kihusishi עַל, bila kulifanya kuwa maombi yanayoelekezwa kwa mnyama.
- source_word: עֲוֺנֹת
  choice: maovu
  rationale: Neno hili linaweza kuhusisha upotovu, kosa, na hatia. “Maovu” huhifadhi uzito wake wa kimaadili huku likitofautishwa na maneno mengine mawili ya dhambi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata kwa karibu usemi wa Kiebrania na bado ni usemi unaoeleweka kwa Kiswahili; tanbihi inaeleza maana yake ya kijumuiya.
- source_word: פִּשְׁעֵיהֶם
  choice: makosa yao yote ya uasi
  rationale: פֶּשַׁע hudokeza kuvunja uaminifu au kuasi. Usemi huu unahifadhi wazo la uasi na kutofautisha neno hili na “maovu” na “dhambi.”
- source_word: לְכָל חַטֹּאתָם
  choice: na dhambi zao zote
  rationale: Katika muktadha huu, kifungu kinakamilisha orodha ya aina zote za makosa ya Israeli. Tafsiri hii huwasilisha nguvu ya kijumla kwa Kiswahili cha asili.
- source_word: וְנָתַן אֹתָם
  choice: atayaweka
  rationale: Kiambishi cha ngeli kinarejelea maovu, makosa ya uasi, na dhambi zilizotajwa, ambazo kwa ishara zinawekwa juu ya kichwa cha mbuzi.
- source_word: וְשִׁלַּח בְּיַד אִישׁ עִתִּי
  choice: atamkabidhi kwa mtu aliye tayari kwa kazi hiyo ili ampeleke
  rationale: Huwasilisha kwa Kiswahili cha kawaida kwamba Aroni anamtuma mbuzi kwa kutumia wakala wa mtu huyo. עִתִּי ni neno gumu linaloweza kusisitiza utayari, uteuzi, au kufaa kwa wakati huo; tanbihi huhifadhi uwezekano huo.
- source_word: הַמִּדְבָּרָה
  choice: jangwani
  rationale: Kiishio cha mwelekeo kinaonyesha mwendo kuelekea jangwani. “Jangwani” ni usemi wa kawaida wa Kiswahili na haulazimishi eneo hilo kuwa jangwa la mchanga tu.
theological_decisions:
- issue: Kutofautisha maneno matatu ya dhambi
  choice: maovu / makosa ya uasi / dhambi
  alternative: dhambi / makosa / dhambi
  rationale: Matini ya Kiebrania inakusanya maneno matatu yanayokaribiana ili kusisitiza ukamilifu wa kosa la Israeli. Kuyatofautisha kunahifadhi nguvu hiyo bila kudai kwamba mipaka ya maana kati yake ni kamili.
- issue: Maana ya kuweka makosa juu ya kichwa cha mbuzi
  choice: Atayaweka juu ya kichwa cha huyo mbuzi
  alternative: Atatangaza kwamba yako juu ya kichwa cha huyo mbuzi
  rationale: Tafsiri huhifadhi lugha thabiti ya ishara iliyomo katika kitenzi וְנָתַן, bila kuongeza ufafanuzi wa kimadhehebu kuhusu namna uhamisho huo unavyofanya kazi.
- issue: Usemi בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa kifamilia wa chanzo umehifadhiwa katika matini, huku tanbihi ikionyesha kwamba unarejelea jumuiya ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umegawanywa kwa kiasi ili kuepuka mfululizo mzito, huku hatua zote za ibada na mpangilio wake zikihifadhiwa.
