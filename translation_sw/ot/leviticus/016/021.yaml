    issue: Muundo "na kuungama juu yake"
    rationale: Baada ya "ataweka," kitenzi-jina "kuungama" ni kisicho sawia na msururu wa vitenzi vya wakati ujao na kinaweza kusikika kama kiambatisho kisichokamilika. "Atakiri juu yake" huonyesha wazi tendo la Aaron la kukiri makosa hayo.
  - severity: medium
    issue: '"Atamkabidhi kwa mtu ... ili ampeleke"'
    rationale: Chanzo husema kwamba Aaron anamtuma mbuzi jangwani "kwa mkono wa" mtu huyo, yaani kwa wakala wake. Kumkabidhi na kuongeza kusudi "ili" ni uundaji upya usio wa lazima wa tendo hilo.
