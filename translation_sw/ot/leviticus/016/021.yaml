review_pass:
  verdict: revise
  source_fidelity: Maana na mpangilio wa tendo la kiibada umehifadhiwa kwa kiasi kikubwa, kutia ndani orodha ya aina tatu za makosa na kupelekwa kwa mbuzi jangwani. Hata hivyo, "na kuungama" haipatani vizuri na vitenzi vya wakati ujao katika sentensi, na "atamkabidhi kwa mtu ... ili ampeleke" hubadilisha usemi wa chanzo wa kumtuma mbuzi kwa njia ya wakala kuwa tendo la kumkabidhi mtu huyo. Marekebisho yanarudisha uhusiano huo bila kuongeza hatua nyingine.
  naturalness: Kiswahili ni cha hadhi inayofaa, lakini "atakiri juu yake" ni wazi na sanifu zaidi kuliko "na kuungama juu yake" katika muundo huu. "Kwa mkono wa" huhifadhi usemi wa kiibada wa chanzo; tanbihi inaeleza kwa lugha ya kawaida maana ya mtu huyo kuwa mteule/aliyeandaliwa.
  terminology: '"Maovu / makosa ya uasi / dhambi" hudumisha tofauti ya kisemantiki ya עֲוֺנֹת, פְּשָׁעִים, na חַטֹּאת. "Wana wa Israeli" ni tafsiri ya karibu ya בְּנֵי יִשְׂרָאֵל. Kwa אִישׁ עִתִּי, "mtu aliyeteuliwa kwa kazi hiyo" ni chaguo salama katika matini, huku tanbihi ikidumisha utata wa neno la Kiebrania.'
  issues:
