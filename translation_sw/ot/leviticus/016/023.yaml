  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: sw
  text: Kisha Aroni ataingia katika hema la kukutania, na avue mavazi ya kitani aliyoyavaa alipoingia mahali patakatifu[a], na kuyaacha humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “patakatifu”; kutokana na muktadha mpana wa Siku ya Upatanisho, wengine huelewa hapa kwa umahususi zaidi kuwa “Patakatifu Zaidi.”
    reason: Usomaji mbadala unaohifadhi kutobainika kikamilifu kwa הַקֹּדֶשׁ.
lexical_decisions:
- source_word: וּבָא
  choice: Kisha Aroni ataingia
  rationale: Katika mfululizo wa maagizo ya ibada, waw pamoja na qatal ina nguvu ya hatua inayofuata. ‘Kisha ... ataingia’ ni Kiswahili cha kawaida na huonyesha mwendo wa kuingia unaodokezwa na בוא pamoja na אֶל.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina linaloeleweka na lililozoeleka katika Kiswahili kwa jengo la patakatifu ambamo mkutano na Mungu ulifanyika.
- source_word: וּפָשַׁט
  choice: avue
  rationale: Kitenzi ‘kuvua’ ndicho cha kawaida na sahihi kwa kuondoa mavazi, bila ukali wa maana unaoweza kutokana na ‘kujivua’ au urasmi wa ‘kuondoa’.
- source_word: בִּגְדֵי הַבָּד
  choice: mavazi ya kitani
  rationale: ‘Mavazi’ huwakilisha בגד kwa upana, na ‘ya kitani’ huhifadhi maelezo muhimu ya nyenzo ya mavazi hayo katika ibada.
- source_word: אֲשֶׁר לָבַשׁ
  choice: aliyovaa
  rationale: ‘Aliyovaa’ ni usemi wa asili wa Kiswahili unaoweza kumaanisha aliyoyavaa au aliyokuwa amevaa; hapa unaunganisha mavazi na kuingia kwake bila kuongeza maelezo yasiyokuwamo.
- source_word: בְּבֹאוֹ
  choice: alipoingia
  rationale: Muundo wa infinitive pamoja na בְּ unaonyesha wakati. ‘Alipoingia’ huwasilisha kwa ufupi na kawaida tukio la kuingia mahali patakatifu.
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Kiebrania kinasema ‘patakatifu’ bila kutumia jina kamili la sehemu ya ndani kabisa. Tafsiri hii huhifadhi upana huo badala ya kuamua kimya kimya kuwa ni Patakatifu Zaidi.
- source_word: וְהִנִּיחָם שָׁם
  choice: na kuyaacha humo
  rationale: ‘Kuyaacha humo’ huonyesha wazi kwamba mavazi yabaki mahali pale, bila kubainisha namna ya kuyaweka ambayo Kiebrania haibainishi.
theological_decisions:
- issue: Mahali panaporejelewa na הַקֹּדֶשׁ
  choice: mahali patakatifu
  alternative: mahali pa ibada; Patakatifu Zaidi
  rationale: Neno la Kiebrania lenyewe ni ‘patakatifu/mahali patakatifu’ na halitumii usemi kamili unaotaja chumba cha ndani kabisa. Muktadha mpana wa Siku ya Upatanisho unaweza kuelekeza kwenye Patakatifu Zaidi, lakini matini kuu haipaswi kufunga uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi unaonyesha mfuatano wa maagizo ya ibada kwa lugha rahisi. ‘Hema la kukutania’ limetumiwa kama istilahi ya kawaida ya kibiblia, huku ‘mahali patakatifu’ likiacha kiwango cha umahususi cha Kiebrania bila kukilazimisha.
