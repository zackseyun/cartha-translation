base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: sw
  text: Aroni atamleta ng’ombe dume wa sadaka ya dhambi kwa ajili yake mwenyewe[a], naye atafanya upatanisho kwa ajili yake mwenyewe na kwa ajili ya watu wa nyumbani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ng’ombe dume wa sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka ya dhambi, na katika baadhi ya miktadha husisitiza utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: atamleta
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuleta au kusogeza sadaka mbele kwa ajili ya ibada. “Atamleta” ni Kiswahili cha kawaida na hakidokezi mapema kwamba kuchinja au tendo lote la kutoa dhabihu limekamilika.
- source_word: פַּר
  choice: ng’ombe dume
  rationale: פַּר humaanisha fahali au ng’ombe dume. “Ng’ombe dume” ni wazi na inaeleweka kwa wasomaji wengi wa Kiswahili cha Afrika Mashariki.
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria hii ya dhabihu, חַטָּאת inataja sadaka, si dhambi kama wazo la pekee. “Sadaka ya dhambi” ni istilahi inayotambulika sana; maana mbadala inayosisitiza utakaso wa kiibada imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר לוֹ
  choice: aliye kwa ajili yake mwenyewe
  rationale: Kirai hiki kinamtambulisha ng’ombe kuwa sadaka iliyotengwa kwa ajili ya Aroni mwenyewe, tofauti na sadaka za watu. Tafsiri hii pia inaunganika kwa kawaida na sehemu inayofuata kuhusu kufanya upatanisho kwa ajili yake.
- source_word: וְכִפֶּר
  choice: naye atafanya upatanisho
  rationale: כפר katika muktadha wa kikuhani na wa dhabihu hubeba maana ya kufanya upatanisho. Tafsiri hii inadumisha uzito wa kiibada na kiteolojia bila kufafanua zaidi ya Kiebrania njia kamili ya upatanisho huo.
- source_word: בַּעֲדוֹ
  choice: kwa ajili yake mwenyewe
  rationale: בְּעַד pamoja na kiambishi cha nafsi huonyesha tendo linalofanywa kwa niaba au kwa manufaa ya mtu; kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וּבְעַד בֵּיתוֹ
  choice: na kwa ajili ya watu wa nyumbani mwake
  rationale: בַּיִת hapa inaelekea kumaanisha familia au jumuiya ya nyumbani, si jengo. “Watu wa nyumbani mwake” ni ya asili zaidi katika Kiswahili na inaonyesha maana hiyo ya pamoja.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria ya dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Muktadha unaonyesha kwamba nomino hii inataja sadaka. “Sadaka ya dhambi” ni tafsiri iliyo wazi na inayojulikana, huku tanbihi ikihifadhi uwezekano wa kusisitiza kazi ya utakaso wa kiibada.
- issue: Upeo wa בֵּיתוֹ
  choice: watu wa nyumbani mwake
  alternative: nyumba yake
  rationale: Neno la Kiebrania linaelekea kurejelea familia au kaya ya Aroni badala ya jengo lake. Tafsiri iliyochaguliwa inaonyesha maana hiyo bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maagizo ya ibada umehifadhiwa kwa vitenzi vya wakati ujao; istilahi “upatanisho” imetumiwa kwa maana ya kiibada bila kuifafanua kupita ushahidi wa Kiebrania.
