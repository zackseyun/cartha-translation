id: LEV.16.31
reference: Leviticus 16:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: sw
  text: Ni Sabato ya mapumziko kamili kwenu, nanyi mtajinyima[a]; ni amri ya kudumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtajitesa”; kwa kawaida hili limeeleweka kuwa linahusisha kufunga na kujinyima.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת
  choice: Sabato
  rationale: Neno hili limedumishwa kama jina maalumu la siku takatifu ya mapumziko katika Torati, badala ya kulifanya kuwa siku yoyote ya kupumzika.
- source_word: שַׁבָּתוֹן
  choice: mapumziko kamili
  rationale: Tafsiri hii inaonyesha msisitizo wa usemi שַׁבַּת שַׁבָּתוֹן kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: הִיא לָכֶם
  choice: Ni ... kwenu
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida kauli elekezi inayoelekezwa kwa jumuiya.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: nanyi mtajinyenyekeza
  rationale: Usemi huu unaonyesha kujishusha na kujinyima katika muktadha wa Siku ya Upatanisho. Tafsiri haubani maana iwe kufunga pekee wala kupendekeza kujidhuru kimwili.
- source_word: חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  rationale: Hii inaeleza kwa Kiswahili wazi nguvu ya kudumu ya agizo la kisheria.
theological_decisions:
- issue: Maana ya amri ya kujinyima katika Siku ya Upatanisho
  choice: mtajinyenyekeza
  alternative: mtajitesa; mtafunga
  rationale: Kiebrania kinatumia usemi mpana ענה + נפשׁ, si kitenzi cha moja kwa moja kinachomaanisha kufunga. Kwa hiyo maandishi makuu yanahifadhi upana huo, huku tanbihi ikionyesha tafsiri nyingine na uelewa wa jadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sabato’ imetumiwa kama istilahi ya kidini iliyozoeleka; sentensi imewekwa kwa mtiririko rahisi bila kupoteza msisitizo wa Kiebrania.
