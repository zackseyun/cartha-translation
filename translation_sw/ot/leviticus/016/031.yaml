  verdict: revise
  source_fidelity: The draft correctly retains ‘Sabato,’ conveys the intensified rest expression, and preserves the enduring legal formula. However, ‘mtajinyenyekeza’ primarily denotes adopting a humble posture or becoming humble, and does not adequately convey the Hebrew ritual idiom of afflicting/denying oneself.
  naturalness: The proposed revision is natural Standard East African Swahili and retains a dignified scriptural register.
  terminology: ‘Mtajinyima’ communicates ritual self-denial without narrowing the command to fasting. ‘Amri ya kudumu’ is a clear equivalent for the statutory formula חֻקַּת עוֹלָם.
  issues:
