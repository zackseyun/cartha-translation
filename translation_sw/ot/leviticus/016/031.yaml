    issue: ‘Mtajinyenyekeza’ is too weak and potentially shifts the meaning of וְעִנִּיתֶם אֶת־נַפְשֹׁתֵיכֶם.
    rationale: The Hebrew idiom concerns self-affliction/self-denial in a ritual context, not merely humility. ‘Mtajinyima’ better preserves its practical and semantic force while avoiding an unwarranted specification of fasting.
  revised_text: Ni Sabato ya mapumziko kamili kwenu, nanyi mtajinyima[a]; ni amri ya kudumu.
