  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: sw
  text: Kuhani atakayetiwa mafuta na kuwekwa rasmi[a] ili kuhudumu kama kuhani katika nafasi ya baba yake atafanya upatanisho, naye atavaa mavazi ya kitani, yaani mavazi matakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “ambaye mkono wake utajazwa,” nahau inayomaanisha kuwekwa rasmi katika huduma ya kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: atafanya upatanisho
  rationale: Katika taratibu za kikuhani, kitenzi כפר kinaonyesha kutekeleza tendo la ibada la upatanisho. Tafsiri hii inadumisha maana ya kiibada bila kufafanua kupita kiasi jinsi upatanisho unavyopatikana.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Kiebrania kinasema tu ‘kuhani,’ ingawa muktadha unamhusu kuhani anayechukua nafasi ya baba yake katika huduma hii. Hakuna haja ya kuongeza cheo ‘kuhani mkuu’ kisichotajwa moja kwa moja hapa.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: atakayetiwa mafuta
  rationale: Kauli tendwa ni ya kawaida na wazi katika Kiswahili, nayo hali ya wakati ujao inafaa kwa maelezo ya kuhani mrithi atakayewekwa katika huduma.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: na kuwekwa rasmi
  rationale: Nahau ya Kiebrania ‘kuujaza mkono wake’ humaanisha kumwingiza au kumweka mtu rasmi katika huduma ya kikuhani. ‘Kuwekwa rasmi’ ni ya asili na inaeleweka katika Kiswahili; nahau halisi imehifadhiwa katika tanbihi.
- source_word: לְכַהֵן
  choice: ili kuhudumu kama kuhani
  rationale: Tafsiri hii inaonyesha kusudi na utendaji wa wadhifa wa kikuhani kwa Kiswahili cha kawaida.
- source_word: תַּחַת אָבִיו
  choice: mahali pa baba yake
  rationale: תחת hapa huonyesha kuchukua nafasi ya mtu mwingine katika wadhifa, yaani urithi wa huduma kutoka kwa baba.
- source_word: וְלָבַשׁ
  choice: atavaa
  rationale: Kitenzi kinaonyesha kujivika au kuvaa mavazi ya ibada. ‘Atavaa’ ni fupi, asili, na wazi katika Kiswahili.
- source_word: בִּגְדֵי הַבָּד
  choice: mavazi ya kitani
  rationale: בד katika muktadha wa mavazi ya kikuhani humaanisha kitani.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: mavazi matakatifu
  rationale: Kirai hiki kinayatambulisha zaidi mavazi ya kitani kuwa yaliyotengwa kwa matumizi matakatifu. ‘Matakatifu’ huhifadhi uhusiano wa kimsamiati na קדשׁ.
theological_decisions:
- issue: Iwapo הַכֹּהֵן itafsiriwe ‘kuhani’ au ‘kuhani mkuu’
  choice: kuhani
  alternative: kuhani mkuu
  rationale: Muktadha unaonyesha kwamba ni mrithi wa wadhifa wa kuhani mkuu, lakini maandishi yenyewe yanatumia ‘kuhani’ na kumfafanua kwa kutiwa mafuta, kuwekwa rasmi, na kuchukua nafasi ya baba yake. Tafsiri haiongezi cheo kisichotajwa.
- issue: Jinsi ya kutafsiri nahau ya kuwekwa katika huduma, ‘kuujaza mkono wake’
  choice: kuwekwa rasmi
  alternative: ambaye mkono wake utajazwa
  rationale: Tafsiri ya neno kwa neno ingekuwa tata kwa wasomaji wengi wa Kiswahili. ‘Kuwekwa rasmi’ hutoa maana ya kitaasisi, huku tanbihi ikihifadhi umbo la nahau ya Kiebrania.
- issue: Maana ya כפר katika ibada ya Siku ya Upatanisho
  choice: kufanya upatanisho
  alternative: kutekeleza ibada ya upatanisho
  rationale: ‘Kufanya upatanisho’ huhifadhi uzito wa kitheolojia na wa kiibada wa neno bila kulifanya kuwa maelezo marefu au kubainisha kwa upande mmoja tu uhusiano wa upatanisho na utakaso.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. ‘Yaani’ inaonyesha kwamba ‘mavazi matakatifu’ yanafafanua mavazi yale yale ya kitani, si kundi jingine la mavazi.
