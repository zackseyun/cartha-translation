  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: sw
  text: 'Kisha Haruni atapiga kura juu ya mbuzi hao wawili: kura moja kwa ajili ya Yahweh, na kura moja kwa ajili ya Azazeli[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kura moja kwa ajili ya mbuzi wa kuachiliwa.” Maana ya neno la Kiebrania “Azazeli” inabishaniwa; huenda ni jina maalumu, linaonyesha kazi ya mbuzi huyo, au linahusiana na kuondolewa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: atapiga kura
  rationale: Kitenzi hiki kwa msingi humaanisha ‘kutoa/kuweka,’ lakini pamoja na גּוֹרָלוֹת na עַל kinaunda usemi wa kugawa kwa kupiga kura. ‘Atapiga kura’ ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: עַל
  choice: juu ya
  rationale: Huhifadhi taswira halisi ya kura kupigwa juu ya mbuzi hao bila kuifanya mapema kuwa ‘kwa ajili ya.’
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: wale mbuzi wawili
  rationale: שָׂעִיר humaanisha mbuzi dume katika muktadha huu; hata hivyo ‘mbuzi’ ni ya kawaida na inatosha kwa kuwa jinsia yao imewekwa wazi katika muktadha mpana wa ibada.
- source_word: גּוֹרָלוֹת
  choice: kura
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa vitu au matokeo yanayotumiwa katika tendo la kupiga kura.
- source_word: גּוֹרָל אֶחָד
  choice: kura moja
  rationale: Hutafsiri moja kwa moja kirai kinachorudiwa na kuhifadhi mgawanyo wa kiibada.
- source_word: לַיהוָה
  choice: kwa ajili ya YHWH
  rationale: Kiambishi ל־ hapa kinaonyesha anayehusishwa na kura hiyo. Umbo ‘YHWH’ huhifadhi jina la Mungu lililo katika maandishi ya Kiebrania bila kuligeuza kuwa cheo.
- source_word: לַעֲזָאזֵל
  choice: kwa ajili ya Azazeli
  rationale: Maana ya עֲזָאזֵל inabishaniwa. Kulihamisha kama jina ‘Azazeli’ katika matini kuu huhifadhi utata wa Kiebrania badala ya kuamua kuwa ni kazi ya mbuzi, kuondolewa, mahali, au kiumbe fulani.
theological_decisions:
- issue: Maana ya עֲזָאזֵל katika ibada ya Siku ya Upatanisho
  choice: Azazeli kama jina lililohamishwa bila kutafsiriwa katika matini kuu
  alternative: mbuzi wa kuachiliwa; kuondolewa kabisa; au kiumbe/mahali pa jangwani
  rationale: Mstari wenyewe hauamui wazi kama neno hilo linamaanisha kazi ya mbuzi, mahali anakopelekwa, au kiumbe binafsi. Kulihamisha kama jina huhifadhi mvutano huo na huepuka kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Atapiga kura’ ni usemi wa kawaida; ‘juu ya’ huhifadhi taswira ya maandishi ya Kiebrania. Alama ya tanbihi [a] imewekwa mara moja baada ya ‘Azazeli.’
