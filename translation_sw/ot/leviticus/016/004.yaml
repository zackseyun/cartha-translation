source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: sw
  text: Atavaa kanzu takatifu ya kitani[a], na suruali za ndani za kitani zitakuwa mwilini mwake. Atajifunga mshipi wa kitani kiunoni, na atazungusha kilemba cha kitani kichwani. Hayo ni mavazi matakatifu. Ataosha mwili wake kwa maji[b], kisha atayavaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kanzu ya kitani iliyowekwa wakfu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ataosha nyama yake kwa maji”; vivyo hivyo, “mwilini mwake” hapo juu ni “juu ya nyama yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: kanzu takatifu ya kitani
  rationale: “Kanzu” ni neno la kawaida na lenye heshima kwa vazi refu la ndani; “ya kitani” huonyesha kitambaa, na “takatifu” huhifadhi maana ya kutengwa kwa matumizi ya ibada.
- source_word: מִכְנְסֵי בַד
  choice: suruali za ndani za kitani
  rationale: Kirai hiki hueleza vazi la chini lililovaliwa mwilini. Tafsiri hii ni wazi kwa msomaji wa sasa bila kutumia neno la kizamani.
- source_word: עַל בְּשָׂרוֹ
  choice: mwilini mwake
  rationale: Ingawa בשר ni “nyama” kihalisi, katika muktadha wa kuvaa mavazi Kiswahili cha kawaida husema “mwilini,” bila kuingiza maana nyingine ya kitheolojia.
- source_word: אַבְנֵט בַּד
  choice: mshipi wa kitani
  rationale: “Mshipi” huonyesha utepe wa kitambaa unaofungwa kuzunguka kiuno na unafaa zaidi kwa vazi la kikuhani kuliko “mkanda,” ambao unaweza kudokeza mkanda wa ngozi.
- source_word: מִצְנֶפֶת בַּד
  choice: kilemba cha kitani
  rationale: “Kilemba” ni neno maalumu na linaloeleweka kwa kitambaa cha kichwani kinachozungushiwa.
- source_word: וְרָחַץ בַּמַּיִם אֶת־בְּשָׂרוֹ
  choice: Ataosha mwili wake kwa maji
  rationale: Huhifadhi tendo halisi la kuosha kwa maji kwa Kiswahili cha kawaida; “mwili” linafaa zaidi hapa kuliko tafsiri ya moja kwa moja “nyama.”
- source_word: וּלְבֵשָׁם
  choice: kisha atayavaa
  rationale: Kiunganishi kinaendeleza mfuatano wa maagizo, na kiambishi “-ya-” kinarejelea mavazi matakatifu yaliyotajwa.
theological_decisions:
- issue: Utakatifu wa mavazi
  choice: mavazi matakatifu
  alternative: mavazi yaliyowekwa wakfu
  rationale: Maandishi yenyewe huyatenga mavazi haya kwa huduma ya ibada. “Matakatifu” huhifadhi dai hilo bila kuongeza ishara au fundisho lisilotajwa.
- issue: Maana ya בשרו katika masharti ya kiibada
  choice: mwili wake / mwilini mwake
  alternative: nyama yake / juu ya nyama yake
  rationale: Huu ni uchaguzi wa kimtindo na kileksika. “Mwili” huwasilisha sharti halisi kwa uwazi na huepuka maana zisizokusudiwa ambazo “nyama” inaweza kuleta katika Kiswahili.
- issue: Mfuatano wa kuosha na kuvaa
  choice: kisha atayavaa
  alternative: na atayavaa
  rationale: Muktadha na mfuatano wa vitenzi unaonyesha kwamba kuosha kunatangulia kuvaa mavazi hayo; “kisha” huwasilisha mfuatano huo kwa kawaida bila kuongeza maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zinafuata mpangilio wa maagizo ya Kiebrania huku misemo ya mavazi ikitolewa kwa lugha ya kawaida na iliyo wazi.
