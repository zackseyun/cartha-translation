base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: sw
  text: Atakapomaliza kufanya upatanisho[b] kwa ajili ya mahali patakatifu[a], Hema la Kukutania, na madhabahu, atamleta mbele[c] beberu aliye hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “kufanya upatanisho” kunaweza pia kueleweka kuwa kutekeleza utakaso wa kiibada au kuondoa unajisi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “atamleta karibu”; yaani, atamleta kwa ajili ya hatua inayofuata ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה
  choice: Atakapomaliza
  rationale: Kitenzi כלה kinaonyesha kukamilisha tendo; muundo wa wakati unaonyesha kwa kawaida mfuatano wa matendo ya ibada.
- source_word: מִכַּפֵּר
  choice: kufanya upatanisho
  rationale: כפר ni istilahi kuu ya ibada katika Mambo ya Walawi. “Kufanya upatanisho” huhifadhi uzito wake wa sadaka bila kuufanya uwe na maana moja tu ya kiutaratibu.
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Katika muktadha huu neno hilo linamaanisha eneo takatifu la maskani, si utakatifu kama dhana ya jumla.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Ni tafsiri ya moja kwa moja, iliyo wazi na iliyozoeleka ya jina la hema hilo la ibada.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa madhabahu ya sadaka.
- source_word: וְהִקְרִיב
  choice: atamleta mbele
  rationale: הקריב kimsingi ni “kuleta karibu”; hapa inamaanisha kumleta mnyama tayari kwa hatua inayofuata ya ibada.
- source_word: הַשָּׂעִיר הֶחָי
  choice: beberu aliye hai
  rationale: שעיר ni mbuzi dume, na חי humtofautisha na beberu ambaye tayari amechinjwa.
theological_decisions:
- issue: Maana ya כפר katika muktadha wa sadaka
  choice: kufanya upatanisho
  alternative: kutakasa kwa ibada / kuondoa unajisi
  rationale: Neno linaweza kuhusisha utakaso wa kiibada katika Mambo ya Walawi, lakini “kufanya upatanisho” huhifadhi upana wake wa kiteolojia bila kulazimisha nadharia maalumu ya upatanisho.
- issue: Utambulisho wa הַקֹּדֶשׁ
  choice: mahali patakatifu
  alternative: patakatifu / mahali pa ibada
  rationale: Uchaguzi huu unaonyesha kwamba neno linarejelea eneo takatifu la maskani huku ukiacha wazi kiwango kamili cha eneo kinachokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Hema la Kukutania,” “madhabahu,” na “beberu” ni istilahi wazi za muktadha wa ibada; sentensi imeundwa kwa mtiririko wa kawaida wa Kiswahili.
