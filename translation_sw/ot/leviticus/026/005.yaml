base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: sw
  text: Kazi yenu ya kupura nafaka itaendelea mpaka wakati wa kuvuna zabibu, na mavuno ya zabibu yataendelea mpaka wakati wa kupanda mbegu. Mtakula mkate wenu mpaka mshibe, na mtaishi salama katika nchi yenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: kupura nafaka
  rationale: Neno hili linamaanisha shughuli ya kutenganisha nafaka na makapi; kutaja nafaka kunafanya maana iwe wazi kwa msomaji wa kisasa.
- source_word: בָּצִיר
  choice: kuvuna zabibu
  rationale: Hili ni vuno la zabibu hasa, si mavuno kwa ujumla.
- source_word: יַשִּׂיג / וְהִשִּׂיג
  choice: kutaendelea mpaka
  rationale: Kitenzi kihalisi ni ‘kufikia’; katika muktadha huu kinaonyesha kazi moja kudumu hadi msimu unaofuata.
- source_word: לַחְמְכֶם
  choice: chakula chenu
  rationale: Ingawa maana ya msingi ni ‘mkate’, hapa neno linatumika kwa chakula cha msingi kwa ujumla; ‘chakula’ ni Kiswahili cha kawaida na cha asili katika ahadi hii ya kushiba.
- source_word: לָשֹׂבַע
  choice: na kushiba
  rationale: Huonyesha kula hadi kutosheka, si wingi wa chakula pekee.
- source_word: וִישַׁבְתֶּם לָבֶטַח
  choice: mtaishi salama
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kukaa au kuishi; hapa hali ya kuishi kwa usalama katika nchi ndiyo inayosisitizwa.
theological_decisions:
- issue: Ahadi ya ustawi wa kilimo na usalama katika agano
  choice: Imewekwa kama ahadi ya moja kwa moja ya mavuno yanayofuatana, chakula cha kutosha, na maisha salama nchini.
  alternative: Kuifanya kuwa kanuni ya jumla ya ustawi kwa waumini wote.
  rationale: Muktadha unawahusu Israeli katika nchi yao chini ya masharti ya agano; tafsiri haipaswi kupanua kimya kimya upeo huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa kwa usomaji wa kawaida huku ulinganifu wa vipashio vya Kiebrania ukihifadhiwa.
