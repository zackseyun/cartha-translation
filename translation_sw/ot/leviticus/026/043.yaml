  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: sw
  text: Lakini nchi itaachwa bila wao, nayo itafurahia Sabato zake wakati itakapokuwa ukiwa pasipo wao; nao watakubali adhabu kwa ajili ya uovu wao[a], kwa sababu—naam, kwa sababu—walizikataa hukumu zangu, na nafsi yao ilichukia sana sheria zangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wataukubali uovu wao,” au “watafanya malipo kwa ajili ya uovu wao.” Usemi wa Kiebrania unaweza kueleweka kwa njia zaidi ya moja; hapa umetafsiriwa kwa maana yake ya kimahakama katika muktadha wa adhabu ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב מֵהֶם
  choice: itaachwa bila wao
  rationale: Kauli ya kutendwa ya עזב inaifanya nchi kuwa mtendwa; 'bila wao' inaonyesha kwamba watu hawatakuwapo nchini.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: itafurahia Sabato zake
  rationale: Katika muktadha wa mapumziko ya nchi, רצה inaonyesha nchi kupokea au kufurahia vipindi vya Sabato ambavyo haikuvipata.
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: wakati itakapokuwa ukiwa pasipo wao
  rationale: Tafsiri hii inahifadhi hali ya nchi kuwa ukiwa na kutokuwapo kwa wakazi wake.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: wataibeba adhabu ya uovu wao
  rationale: Katika muktadha wa hukumu ya agano, usemi huu unaweza kumaanisha kubeba au kukubali matokeo ya hatia. 'Wataibeba adhabu' ni Kiswahili cha kawaida chenye maana ya kimahakama, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: יַעַן וּבְיַעַן
  choice: kwa sababu—naam, kwa sababu—
  rationale: Kurudia huku kunahifadhi msisitizo wa usemi wa Kiebrania bila kuufupisha kuwa sababu moja tu.
- source_word: בְּמִשְׁפָּטַי
  choice: hukumu zangu
  rationale: Neno hili linarejelea maamuzi au masharti ya kisheria ya agano; 'hukumu' huhifadhi tofauti yake na חֻקֹּת.
- source_word: חֻקֹּתַי
  choice: sheria zangu
  rationale: '''Sheria'' ni neno la kawaida na lenye hadhi kwa masharti yaliyowekwa, na hapa linatofautishwa na ''hukumu''.'
- source_word: גָּעֲלָה נַפְשָׁם
  choice: nafsi yao ilichukia sana
  rationale: Muundo wa umoja wa pamoja 'nafsi yao' umehifadhiwa, na 'ilichukia sana' huwasilisha nguvu ya געל kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya עון katika יִרְצוּ אֶת עֲוֺנָם
  choice: 'maana ya adhabu: ''wataibeba adhabu ya uovu wao'''
  alternative: '''wataukubali uovu wao'' au ''wataufidia uovu wao'''
  rationale: Muktadha ni laana ya agano, uhamisho na nchi kupata Sabato zake. Kwa hiyo maana ya matokeo au adhabu ya hatia inaonekana kutawala, lakini tanbihi inadumisha utata halisi wa usemi wa Kiebrania na haudokezi kwamba watu wanajipatia upatanisho kwa matendo yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Sabato' hudumisha istilahi ya agano; 'nafsi yao' huhifadhi picha ya Kiebrania, ingawa ni nzito kidogo kuliko usemi wa kawaida.
