id: LEV.26.41
reference: Leviticus 26:41
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: sw
  text: Mimi pia nitakwenda kinyume nao na kuwaingiza katika nchi ya adui zao; au ndipo moyo wao usiotahiriwa utakaponyenyekezwa,[a] na ndipo watakapobeba adhabu ya uovu wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi ni “moyo wao usiotahiriwa,” sitiari ya agano inayoonyesha ukaidi na uchafu wa ndani. Maneno “au ndipo” ni magumu kisarufi na yanaweza kutambulisha wakati ambapo moyo wao unanyenyekezwa.
    reason: cultural_note; alternative_reading
  - marker: b
    text: Au “watakubali adhabu ya uovu wao,” “wataufidia uovu wao,” au “uovu wao utalipiwa.” Nahau ya Kiebrania inahusu kubeba matokeo yanayostahili ya hatia.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Mimi pia
  rationale: Huhifadhi msisitizo na ulinganifu wa tendo la Mungu dhidi ya mwenendo wao.
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: nitakwenda kinyume nao
  rationale: Huhifadhi tamathali ya kutembea na wazo la upinzani katika lugha inayorudiwa ya laana za agano katika sura hii.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: na kuwaingiza katika nchi ya adui zao
  rationale: Hifili ya בוא ina maana ya kuingiza au kuleta, na kishazi hiki huhifadhi mazingira ya uhamisho.
- source_word: אוֹ אָז
  choice: au ndipo
  rationale: Huhifadhi kiunganishi kigumu cha Kiebrania na nguvu yake ya kutenganisha bila kukilainisha kuwa sharti lililo wazi zaidi kuliko chanzo.
- source_word: יִכָּנַע
  choice: utakaponyenyekezwa
  rationale: Nifali ina maana ya kunyenyekezwa au kutiishwa; kwa moyo, kunyenyekezwa huwasilisha vizuri mabadiliko ya ndani.
- source_word: לְבָבָם הֶעָרֵל
  choice: moyo wao usiotahiriwa
  rationale: Huhifadhi sitiari halisi ya agano badala ya kuifafanua tu kuwa ukaidi.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: na ndipo watakapobeba adhabu ya uovu wao
  rationale: Katika muktadha huu רצה pamoja na עון hudokeza kubeba au kulipia matokeo yanayostahili ya hatia; 'kubeba adhabu' ni Kiswahili cha kawaida kisichodokeza kwamba wanajipatanisha wenyewe kwa tendo la kustahili.
theological_decisions:
- issue: Sitiari הֶעָרֵל inayotumiwa kuhusu moyo
  choice: Kuhifadhi sitiari ya agano kama 'moyo wao usiotahiriwa'
  alternative: moyo wao mkaidi; moyo wao usiotubu
  rationale: Maneno ya chanzo yana sitiari yenye uzito wa agano na miunganiko na sehemu nyingine za Maandiko; kuyafafanua tu kuwa ukaidi kungepunguza maana hiyo.
- issue: Maana ya יִרְצוּ אֶת עֲוֺנָם
  choice: Watabeba adhabu ya uovu wao
  alternative: Wataufidia uovu wao; watakubali adhabu ya uovu wao; uovu wao utalipiwa
  rationale: Kishazi hiki kinahusu kubeba matokeo ya hatia chini ya hukumu ya agano, bila kuingiza dhana kwamba wanajipatanisha kwa sifa zao wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Tamathali kuu za Kiebrania zimehifadhiwa, huku tanbihi zikieleza ugumu wa kisarufi na nahau ya hukumu.
