  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: sw
  text: Nami nitaharibu mahali penu pa juu, nitazikatilia mbali madhabahu zenu za uvumba[a], nitaweka maiti zenu juu ya maiti za sanamu zenu[b], nayo nafsi yangu itawachukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguzo zenu za jua.” Neno la Kiebrania linamaanisha vitu vya ibada vilivyohusishwa na ibada isiyoruhusiwa; umbo na matumizi yake kamili hayajulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia neno lilelile, “maiti,” kwa miili ya watu na kwa sanamu zao, kikisisitiza kwamba sanamu hizo hazina uhai na kwamba zimeaibishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: nitaharibu
  rationale: Hifili ya שׁמד inaeleza kusababisha uharibifu; “nitaharibu” ni kali, wazi, na ya kawaida katika Kiswahili bila kuongeza maana isiyokuwamo.
- source_word: בָּמֹתֵיכֶם
  choice: mahali penu pa juu
  rationale: במות ni maeneo yaliyoinuka yaliyotumiwa kwa ibada; tafsiri hii inadumisha picha ya mahali na matumizi yake ya kiibada katika muktadha.
- source_word: הִכְרַתִּי
  choice: nitazikatilia mbali
  rationale: כרת kimsingi ni kukata au kuondoa; “katilia mbali” hudumisha taswira ya kukata huku ikisikika kwa kawaida kuhusu vitu vya ibada ambavyo umbo lake halijulikani kwa hakika.
- source_word: חַמָּנֵיכֶם
  choice: madhabahu zenu za uvumba
  rationale: חמנים ni vyombo au miundo ya ibada ambayo huenda ilihusiana na uvumba au ibada ya jua. Tafsiri tendaji na inayoeleweka imewekwa katika matini, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: פִּגְרֵיכֶם
  choice: maiti zenu
  rationale: פגר humaanisha mwili uliokufa. “Maiti” ni neno la moja kwa moja na linalofaa kwa watu katika Kiswahili.
- source_word: פִּגְרֵי גִּלּוּלֵיכֶם
  choice: mizoga ya sanamu zenu
  rationale: Kurudiwa kwa פגר kunazionyesha sanamu kuwa vitu visivyo na uhai. “Mizoga” hudumisha dharau na aibu ya picha hiyo, ingawa Kiswahili hutumia neno tofauti kwa kawaida kuhusu vitu visivyo watu.
- source_word: גִּלּוּלֵיכֶם
  choice: sanamu zenu
  rationale: גלולים ni neno la dharau kwa sanamu za ibada. “Sanamu” hutoa maana ya msingi kwa uwazi, na muktadha pamoja na tanbihi hudumisha nguvu yake ya kudhalilisha.
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: nafsi yangu itawachukia
  rationale: Tafsiri hii inadumisha kiima cha Kiebrania, “nafsi yangu,” na hivyo kuhifadhi usemi mkali wa kibinadamu unaotumiwa kumwelezea Mungu badala ya kuufupisha kuwa “nitawachukia.”
theological_decisions:
- issue: Usemi wa kibinadamu kuhusu chuki kali ya Mungu
  choice: nafsi yangu itawachukia
  alternative: nitawachukia; nitawakataa
  rationale: Matini inasema kihalisi kwamba “nafsi yangu” itawachukia. Kudumisha usemi huo kunahifadhi uzito na mvutano wa kitheolojia wa chanzo bila kuufanya kuwa kauli dhaifu zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa msomaji wa kawaida. “Nami” na “nayo” zinaendeleza mfululizo wa vitendo vya hukumu. Alama [a] imewekwa baada ya “madhabahu zenu za uvumba,” kwa kuwa tanbihi inahusu חמנים, si במות.
