base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: sw
  text: Nitaifanya miji yenu kuwa magofu, nitayafanya maeneo yenu matakatifu kuwa ukiwa, wala sitanusa harufu ya kupendeza ya sadaka zenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “sitanusa harufu yenu ya kupendeza.” Huu ni usemi wa kawaida wa dhabihu unaohusu Mungu kuzikubali sadaka; maneno “ya sadaka zenu” yameongezwa ili kuweka maana wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Nitaifanya
  rationale: 'Ingawa kitenzi נתן kwa msingi humaanisha ‘kutoa’ au ‘kuweka,’ pamoja na ‘miji yenu’ na ‘magofu’ hapa kina maana ya kusababisha hali hiyo: ‘nitaifanya ... kuwa.’'
- source_word: עָרֵיכֶם חָרְבָּה
  choice: miji yenu kuwa magofu
  rationale: עיר inaweza kuwa mji mkubwa au mdogo, na חָרְבָּה huonyesha hali ya kuharibiwa na kubaki magofu. Usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וַהֲשִׁמּוֹתִי
  choice: nitapaacha ukiwa
  rationale: Hifili ya שמם ina maana ya kusababisha mahali kuwa ukiwa. ‘Nitapaacha ukiwa’ huhifadhi nguvu ya uharibifu na kusikika kwa kawaida kwa mahali.
- source_word: מִקְדְּשֵׁיכֶם
  choice: mahali penu patakatifu
  rationale: Wingi wa מִקְדָּשׁ unarejelea mahali palipotengwa kuwa patakatifu. ‘Mahali penu patakatifu’ huhifadhi maana ya ibada bila kudhani kwamba kila mahali ni hekalu.
- source_word: וְלֹא אָרִיחַ
  choice: wala sitanusa
  rationale: Kitenzi ריח kinatumia picha halisi ya kunusa. Tafsiri hii haiibadili moja kwa moja kuwa ‘sitakubali,’ ingawa kutokubaliwa kwa sadaka kunadokezwa.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: harufu ya kupendeza ya sadaka zenu
  rationale: רֵיחַ נִיחֹחַ ni usemi wa kawaida wa dhabihu. ‘Harufu ya kupendeza’ huhifadhi picha yake; ‘ya sadaka zenu’ huweka wazi kinachotoa harufu kulingana na muktadha wa ibada.
theological_decisions:
- issue: Iwapo usemi wa mwisho utafsiriwe kwa picha ya kunusa au kwa maana iliyofasiriwa ya kukataa sadaka
  choice: Kuhifadhi usemi ‘sitanusa harufu ya kupendeza’
  alternative: Sitazikubali sadaka zenu / sitapendezwa na sadaka zenu
  rationale: Kiebrania kinatumia wazi kitenzi ‘kunusa’ na usemi wa kidhabihu ‘harufu ya kupendeza.’ Kuhifadhi picha hii kunadumisha mvutano na lugha ya kitheolojia ya andiko bila kuibadili kuwa ufafanuzi wa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa vitisho umehifadhiwa kwa vishazi vitatu vinavyofuatana.
