base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: sw
  text: 'Mimi pia nitawatendea hivi: nitawaletea hofu ya ghafula[a], ugonjwa unaodhoofisha mwili[b], na homa, ambazo zitayafanya macho yenu yafifie na uhai wenu udhoofike[c]. Mtapanda mbegu zenu bure, na adui zenu watazila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitaweka juu yenu hofu ya ghafula.” Kitenzi cha Kiebrania kinaweza kumaanisha kuweka au kuleta hukumu juu ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Aina kamili ya ugonjwa unaotajwa na neno la Kiebrania haijulikani; huenda ni jina la jumla la ugonjwa unaokondesha au kudhoofisha mwili.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa tafsiri iliyo karibu zaidi na picha ya Kiebrania: “zinazoyamaliza macho na kuufanya uhai udhoofike.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Mimi pia
  rationale: 'Muundo huu unahifadhi msisitizo wa kiwakilishi cha Kiebrania pamoja na maana ya kuendelea au kujibu kwa tendo: ‘mimi pia.’'
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: nitawatendea hivi
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha kuwa tendo la hukumu linaelekezwa kwa wasikilizaji.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: nitawaletea
  rationale: Kitenzi kinaweza kumaanisha kuweka, kuleta, au kuamuru kitu kiwe juu ya mtu. ‘Nitawaletea’ ni cha asili katika Kiswahili na kinafaa katika muktadha wa hukumu.
- source_word: בֶּהָלָה
  choice: hofu ya ghafula
  rationale: Neno linaashiria hofu kuu au taharuki, huenda yenye kutokea kwa ghafla.
- source_word: הַשַּׁחֶפֶת
  choice: ugonjwa unaodhoofisha mwili
  rationale: Aina kamili ya ugonjwa wa kale haijulikani. Tafsiri hii inaeleza athari yake bila kuutambulisha kwa ugonjwa maalumu usio na uhakika.
- source_word: הַקַּדַּחַת
  choice: homa
  rationale: Neno linahusu hali ya joto kali la mwili au homa; ‘homa’ ni neno la kawaida na wazi.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: vitafanya macho yenu yafifie
  rationale: Kauli ya Kiebrania ina picha ya macho kumalizika au kudhoofika. ‘Yafifie’ inawasilisha kupungua kwa uwezo au nguvu za macho kwa Kiswahili cha kawaida.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: uhai wenu udhoofike
  rationale: נפש hapa inaelekea kumaanisha uhai au nguvu za kuishi, si lazima ‘roho’ kama sehemu isiyo ya mwili. Tafsiri inadumisha muktadha wa kudhoofika kwa ugonjwa.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: Mtapanda mbegu zenu bure
  rationale: ‘Bure’ inaonyesha kwamba kazi ya kupanda haitaleta manufaa kwa waliopanda.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: na adui zenu watazila
  rationale: Kiunganishi kimetafsiriwa moja kwa moja kuwa ‘na,’ huku kiambishi cha yambwa kikirejelea mbegu au mazao yatakayotokana nazo.
theological_decisions:
- issue: Maana ya נָפֶשׁ katika muktadha wa laana ya agano
  choice: uhai
  alternative: nafsi; roho; mtu mwenyewe
  rationale: Katika muktadha wa ugonjwa na kudhoofika, neno hili linaelekea kuonyesha uhai na nguvu za kuishi. ‘Uhai’ huepuka kuingiza bila msingi fundisho maalumu kuhusu sehemu ya mwanadamu isiyo ya mwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mlolongo wa hukumu katika Kiebrania, huku misemo migumu ya magonjwa na kudhoofika ikitolewa kwa lugha ya sasa bila ubainishaji wa kitabibu usio na uhakika.
