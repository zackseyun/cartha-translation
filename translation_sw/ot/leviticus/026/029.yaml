  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: sw
  text: Nanyi mtakula nyama ya wana wenu, na nyama ya binti zenu mtakula.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Nanyi mtakula
  rationale: Kitenzi אכל katika Qal, nafsi ya pili wingi, kina nguvu ya kutabiri katika mfululizo wa laana za agano. “Mtakula” ni Kiswahili cha kawaida na cha moja kwa moja; “Nanyi” linawakilisha kiunganishi na kuendeleza mfululizo.
- source_word: בְּשַׂר
  choice: nyama
  rationale: Katika muktadha huu בָּשָׂר ni nyama ya mwili. “Nyama” ni neno la kawaida la Kiswahili linaloeleza wazi kitendo cha kula mwili bila kukificha kwa tafsida.
- source_word: בְּנֵיכֶם
  choice: wana wenu wa kiume
  rationale: בֵּן katika wingi hapa inatofautishwa moja kwa moja na “binti” katika kishazi kinachofuata. “Wana wenu wa kiume” huhifadhi utofautishaji huo wazi, ilhali “watoto wenu” ungeweza kujumuisha mabinti.
- source_word: וּבְשַׂר
  choice: na ... nyama
  rationale: Nomino imerudiwa ili kuhifadhi usambamba na msisitizo mkali wa Kiebrania.
- source_word: בְּנֹתֵיכֶם
  choice: binti zenu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya “binti zenu,” ikihifadhi jozi ya wana wa kiume na mabinti.
- source_word: תֹּאכֵלוּ
  choice: mtakula
  rationale: Kitenzi cha pili kimerudiwa kama katika Kiebrania ili kuhifadhi msisitizo na muundo sambamba wa onyo.
theological_decisions:
- issue: Kauli ya laana ya agano inayotabiri ulaji wa nyama ya binadamu
  choice: Imetafsiriwa moja kwa moja kama “mtakula nyama ya wana wenu wa kiume ... binti zenu.”
  alternative: Kutumia tafsida au lugha iliyolainishwa
  rationale: Kiebrania kinatoa onyo la moja kwa moja na la kutisha; tafsiri haipaswi kulainisha uzito wake wala kuongeza maelezo ya kiteolojia yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa vishazi na marudio ya kitenzi na nomino yamehifadhiwa. Hakuna tanbihi zinazohitajika.
