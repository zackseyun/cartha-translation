  text: Nitatembea kati yenu[a], nami nitakuwa Mungu wenu, nanyi mtakuwa watu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa usemi wa karibu zaidi na matini: “katikati yenu.”'
