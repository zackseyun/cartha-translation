lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: Nitatembea
  rationale: Hifali ya Kiebrania ya הלך katika hitpaeli inaonyesha kutembea au kwenda huku na huku, huku ikisisitiza uwepo wa Mungu pamoja na watu wake. “Nitatembea” huhifadhi taswira halisi bila kuipanua kuwa “nitakaa.”
- source_word: בְּתוֹכְכֶם
  choice: kati yenu
  rationale: Kirai hiki humaanisha kuwapo katikati ya jumuiya. “Kati yenu” ni Kiswahili cha kawaida na hakidokezi kimakosa kuwapo ndani ya kila mtu mmoja mmoja.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: nami nitakuwa Mungu wenu
  rationale: Hii ni kauli ya kawaida ya agano. “Nitakuwa Mungu wenu” ni ya asili katika Kiswahili na huhifadhi uhusiano unaoonyeshwa na היה pamoja na ל.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Katika muktadha wa agano la Israeli, אֱלֹהִים humrejelea Mungu mwenyewe, wala si mungu mmoja asiyeainishwa.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: nanyi mtakuwa watu wangu
  rationale: “Watu wangu” huwasilisha kwa njia ya kawaida na ya uaminifu kauli ya uhusiano wa agano; “mtakuwa watu kwangu” ingekuwa ngumu na isiyo ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa kauli ya agano
  choice: “Nitakuwa Mungu wenu, nanyi mtakuwa watu wangu.”
  alternative: “Nitakuwa Mungu kwenu, nanyi mtakuwa watu kwangu.”
  rationale: Uwasilishaji uliochaguliwa huhifadhi usawa wa pande mbili na nguvu ya uhusiano katika kauli ya agano, bila kuongeza fundisho lisilosemwa na maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa “nami ... nanyi” huhifadhi mtiririko wa kishairi na ulinganifu wa kauli ya agano huku ukiendelea kueleweka kwa urahisi.
