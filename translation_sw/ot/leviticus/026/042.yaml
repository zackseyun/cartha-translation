  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: sw
  text: Ndipo nitakumbuka agano langu na Yakobo[a], na pia agano langu na Isaka, na pia agano langu na Abrahamu nitalikumbuka; na nchi nitaikumbuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na nitakumbuka.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa tu kuwa “na”; “ndipo” kinaonyesha uhusiano wa mstari huu na muktadha uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Ndipo nitakumbuka
  rationale: Kitenzi זכר katika muktadha wa agano hudokeza kukumbuka kwa kusudi la kutenda, lakini tafsiri haiongezi tendo hilo waziwazi. Kiunganishi וְ kinaweza kuwa “na”; hapa “ndipo” kinaonyesha uhusiano na masharti na urejesho wa muktadha uliotangulia.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: “Agano” ndilo neno la kawaida na lenye uzito wa kibiblia kwa בְּרִית, likionyesha uhusiano wenye wajibu unaofungwa na Mungu.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
- source_word: וְאַף
  choice: na pia
  rationale: Huhifadhi nguvu ya kuongezea na kusisitiza ya אַף pamoja na kiunganishi bila kufanya sentensi iwe nzito.
- source_word: יִצְחָק
  choice: Isaka
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: אַבְרָהָם
  choice: Abrahamu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: אֶזְכֹּר
  choice: nitalikumbuka / nitaikumbuka
  rationale: Marudio ya kitenzi yamehifadhiwa kwa sababu yanatia mkazo katika kukumbukwa kwa agano la Abrahamu na kisha kwa nchi; viambishi vya ngeli vimefuata nomino husika.
- source_word: וְהָאָרֶץ
  choice: nami nitaikumbuka nchi
  rationale: אֶרֶץ katika muktadha huu ni nchi ya ahadi. “Nchi” ni chaguo la kawaida la Kiswahili; kiwakilishi cha mtenda katika “nami” kinaweka wazi uendelezaji wa kauli ya Mungu.
theological_decisions:
- issue: Mpangilio na mkazo wa maagano ya mababu
  choice: Kudumisha mpangilio wa Kiebrania—Yakobo, Isaka, Abrahamu—na kurudia “agano langu” kwa kila mmoja.
  alternative: Kupanga Abrahamu, Isaka, Yakobo kwa mfuatano wa kihistoria, au kufupisha kuwa “agano langu na Abrahamu, Isaka na Yakobo.”
  rationale: Mpangilio wa kinyume na marudio yako wazi katika Kiebrania na yana uzito wa balagha; kuyadumisha huepuka kuingiza kauli iliyorahisishwa ambayo haipo katika chanzo.
- issue: Maana ya Mungu “kukumbuka”
  choice: Kutafsiri kwa “kukumbuka” bila kuongeza “kutenda,” “kutimiza,” au “kufanya upya.”
  alternative: “Nitalikumbuka na kulitendea kazi” au “nitalifanya upya.”
  rationale: Katika muktadha wa agano, kukumbuka kwa Mungu hudokeza hatua inayofuata, lakini maandishi yenyewe yanasema “kukumbuka.” Chaguo hili linahifadhi mvutano huo bila kuufafanua kupita chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio na mpangilio wa chanzo yamedumishwa, huku upatanisho wa ngeli ukifanya sentensi iwe ya asili katika Kiswahili.
