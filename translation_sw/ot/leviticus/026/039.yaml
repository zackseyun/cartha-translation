  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: sw
  text: Na wale watakaobaki miongoni mwenu watazorota[a] katika nchi za adui zenu kwa sababu ya uovu wao; nao pia watazorota kwa sababu ya maovu ya baba zao yaliyo pamoja nao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wataoza” au “watadhoofika hatua kwa hatua”; kitenzi cha Kiebrania kinaonyesha kuzorota au kuharibika chini ya hukumu.
    reason: lexical_alternative
  - marker: b
    text: “Yaliyo pamoja nao” huenda likamaanisha kwamba maovu ya baba zao yanaendelea kuwa pamoja nao, au kwamba watazorota huku maovu hayo ya vizazi vilivyotangulia yakiendelea kuwaathiri.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: wale watakaobaki miongoni mwenu
  rationale: Huwatambulisha kwa njia ya kawaida wale waliobaki baada ya hukumu, huku ikidumisha kuwa wanatoka miongoni mwa watu wanaosemeshwa.
- source_word: יִמַּקּוּ
  choice: watazorota
  rationale: Kitenzi hiki cha Kiebrania kinaonyesha kudhoofika au kuharibika hatua kwa hatua chini ya hukumu. ‘Watazorota’ ni Kiswahili cha kawaida, kizito, na kinafaa katika sehemu zote mbili za aya.
- source_word: בַּעֲוֺנָם
  choice: kwa sababu ya uovu wao
  rationale: Neno עָוֹן linaweza kumaanisha uovu, hatia, au athari yake. Kirai hiki kinawasilisha uovu wao kuwa sababu ya hukumu bila kufuta upana huo wa maana.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: katika nchi za adui zenu
  rationale: ‘Nchi’ linaweza kuwa na umbo lilelile katika umoja na wingi, na ‘za’ huonyesha wingi wa Kiebrania na hali ya kutawanywa katika maeneo ya maadui.
- source_word: וְאַף
  choice: nao pia
  rationale: Huhifadhi nguvu ya nyongeza ya kirai cha Kiebrania kwa Kiswahili cha asili.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: kwa sababu ya maovu ya baba zao
  rationale: Huhifadhi wingi wa ‘maovu’ na maana ya msingi ya אבותם kama ‘baba zao,’ bila kuibadili moja kwa moja kuwa ‘mababu zao.’
- source_word: אִתָּם
  choice: yaliyo pamoja nao
  rationale: Kirai hiki kifupi kinadumisha wazo kwamba maovu ya baba zao yako pamoja nao, bila kuamua kwa ufafanuzi jinsi uwepo au athari hiyo inavyopaswa kueleweka.
theological_decisions:
- issue: Lugha ya hatia na hukumu inayovuka vizazi
  choice: Aya inasema kwamba waliobaki watazorota kwa sababu ya uovu wao wenyewe na pia kwa sababu ya maovu ya baba zao yaliyo pamoja nao.
  alternative: Kufafanua kuwa kinachowapata ni matokeo ya dhambi za mababu pekee, au kwamba wanaadhibiwa tu kwa kurudia dhambi zilezile.
  rationale: Kiebrania kinataja wazi uovu wao na maovu ya baba zao. Tafsiri inadumisha mvutano huo na haifafanui zaidi ya matini jinsi uwajibikaji binafsi unavyohusiana na athari za maovu ya vizazi vilivyotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Watazorota’ linaeleweka kwa wasomaji wa kawaida na huhifadhi uzito wa hukumu; muundo ‘yaliyo pamoja nao’ umeachwa ukiwa na utata wa makusudi unaolingana na Kiebrania.
