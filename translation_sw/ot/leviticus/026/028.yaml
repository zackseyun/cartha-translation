  yaml_path: translation/ot/leviticus/026/028.yaml
  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: sw
  text: Nami pia nitatembea kinyume nanyi katika ghadhabu ya uadui[a], nami mwenyewe nitawaadibu mara saba kwa ajili ya dhambi zenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika ghadhabu ya upinzani”; kwa desturi, “nitatembea kinyume nanyi kwa ghadhabu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nitawaadhibu mara saba kwa ajili ya dhambi zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: nitatembea
  rationale: Kitenzi הלך humaanisha kihalisi ‘kutembea/kwenda.’ Taswira ya kutembea katika uhusiano na Israeli inahifadhiwa badala ya kufupishwa kuwa ‘kutenda.’
- source_word: עִמָּכֶם
  choice: kinyume nanyi
  rationale: Ingawa עם kwa kawaida ni ‘pamoja na,’ katika msemo unaorudiwa katika sura hii ina maana ya uhusiano wa kupingana. ‘Kinyume nanyi’ ni Kiswahili cha kawaida kinachoonyesha nguvu hiyo.
- source_word: בַּחֲמַת
  choice: mkali
  rationale: חֵמָה huonyesha joto la hasira, ghadhabu, au ukali. ‘Mkali’ pamoja na ‘uadui’ huwasilisha nguvu ya hasira kwa lugha ya kawaida.
- source_word: קֶרִי
  choice: uadui
  rationale: קֶרִי ni neno gumu linaloweza kumaanisha kupingana, ukaidi, au uadui katika Walawi 26. ‘Uadui’ huonyesha wazi hali ya kupingana, huku tafsiri ya karibu zaidi na muundo wa Kiebrania ikitolewa katika tanbihi.
- source_word: וְיִסַּרְתִּי
  choice: nitawaadibu
  rationale: יסר inaweza kumaanisha kuadibu, kurudi, au kuadhibu. ‘Nitawaadibu’ huhifadhi wazo la nidhamu bila kulifanya kuwa adhabu ya kulipiza kisasi pekee.
- source_word: אַף אֲנִי
  choice: nami pia ... mimi mwenyewe
  rationale: Maneno haya yanakazia mhusika. ‘Pia’ na ‘mimi mwenyewe’ yanahifadhi mkazo huo kwa Kiswahili cha sasa.
- source_word: שֶׁבַע
  choice: mara saba
  rationale: שֶׁבַע hapa huonyesha kiwango cha adhabu kilichoongezwa sana. ‘Mara saba’ ni wazi na pia huhifadhi namna ya kuhesabu iliyomo katika Kiebrania.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: kwa sababu ya dhambi zenu
  rationale: עַל hapa huonyesha msingi au sababu ya kuadibu; ‘kwa sababu ya dhambi zenu’ huwasilisha uhusiano huo wazi.
theological_decisions:
- issue: Asili ya mwitikio wa Mungu katika laana ya agano
  choice: 'Kuhifadhi lugha ya kupingana na pia ya kuadibu: Mungu ‘anatembea kinyume’ na Israeli na ‘anawaadibu.’'
  alternative: Kutafsiri mstari wote kwa lugha ya adhabu tu, au kupunguza msemo wa kupingana uwe kutopendezwa kwa ujumla.
  rationale: Kiebrania kinaunganisha upinzani wa kimahusiano (הלך + עם + קֶרִי) na יסר, ambalo linaweza kujumuisha kuonya na kuadibu. Kuhifadhi yote mawili huepuka kuamua kimyakimya kwamba hatua hiyo ni ya kulipiza kisasi tu au kuifanya ionekane nyepesi kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Msemo wa ‘kutembea kinyume’ umehifadhiwa kwa sababu ni taswira muhimu inayorudiwa katika sura hii; ugumu wa קֶרִי umeonyeshwa kwa tanbihi.
