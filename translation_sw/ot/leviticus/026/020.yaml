  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: sw
  text: Nguvu zenu zitatumika bure, na nchi yenu haitatoa mazao yake, wala miti ya nchi haitatoa matunda yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתַם
  choice: zitatumika
  rationale: Kitenzi תמם hapa kinaonyesha nguvu kuisha kwa kutumiwa. Katika muktadha wa kazi ya kilimo, “zitatumika” huungana kiasili na “bure” na kuwasilisha juhudi zinazoishia bila matokeo.
- source_word: לָרִיק
  choice: bure
  rationale: לריק huonyesha ubatili au kutopatikana kwa matokeo. “Bure” ni usemi wa kawaida na wenye uzito unaofaa katika laana hii ya agano.
- source_word: כֹּחֲכֶם
  choice: nguvu zenu
  rationale: כח humaanisha nguvu au uwezo; hapa “nguvu zenu” inafaa kwa juhudi za watu katika uzalishaji wa ardhi.
- source_word: תִתֵּן
  choice: haitatoa
  rationale: Maana ya msingi ni “kutoa.” Kiswahili hutumia kwa kawaida nchi kutoa mazao na miti kutoa matunda, hivyo taswira ya Kiebrania inabaki wazi na ya asili.
- source_word: אַרְצְכֶם
  choice: nchi yenu
  rationale: ארץ hapa ni nchi yao kama eneo la kilimo; “nchi yenu” ni tafsiri pana na ya kawaida kuliko “ardhi yenu,” bila kupoteza muktadha wa uzalishaji.
- source_word: יְבוּלָהּ
  choice: mazao yake
  rationale: יבול ni mavuno au mazao yanayotolewa na nchi. “Mazao yake” ni wazi na yanajumuisha uzalishaji wa kilimo kwa ujumla.
- source_word: וְעֵץ הָאָרֶץ
  choice: miti ya nchi
  rationale: Ingawa עץ ni umoja wa kisarufi, hapa ina matumizi ya kijumla. Kiswahili cha kawaida hutumia wingi “miti ya nchi.”
- source_word: פִּרְיוֹ
  choice: matunda yake
  rationale: Kiwakilishi cha Kiebrania ni cha umoja, kikilingana na nomino ya kijumla עץ. Kiswahili kinaweza kutumia “yake” kwa wingi wa ngeli ya miti, huku “matunda” ikiwasilisha maana kwa kawaida.
