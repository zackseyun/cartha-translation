  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: sw
  text: Mtakula vyakula vya zamani vilivyohifadhiwa kwa muda mrefu, na mtaviondoa kwa sababu ya vyakula vipya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Mtakula vya zamani vilivyohifadhiwa kwa muda mrefu, nanyi mtavitoa vya zamani kwa sababu ya vipya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Mtakula
  rationale: Katika mfululizo huu wa baraka za agano, umbo hili linaeleza ahadi ya wakati ujao; “mtakula” ni la kawaida na wazi katika Kiswahili.
- source_word: יָשָׁן
  choice: vyakula vya zamani
  rationale: Kivumishi kimetumiwa kama nomino kikimaanisha mazao au chakula kilichohifadhiwa kutoka mavuno yaliyopita. “Vyakula” huepuka kukihusisha na nafaka pekee.
- source_word: נוֹשָׁן
  choice: vilivyohifadhiwa kwa muda mrefu
  rationale: Neno hili linasisitiza kwamba akiba hiyo ni ya zamani sana au imekaa muda mrefu, bila maana hasi ya kuharibika.
- source_word: וְיָשָׁן
  choice: vya zamani
  rationale: Hurejelea tena vyakula vilivyohifadhiwa vya mavuno yaliyopita; umbo fupi huepuka urudiaji mzito.
- source_word: מִפְּנֵי
  choice: ili kutoa nafasi kwa
  rationale: Katika muktadha, vya zamani vinaondolewa kwa sababu vipya vimefika. Tafsiri hii inaweka wazi wazo la kubadilishwa, ingawa Kiebrania kwa karibu zaidi ni “kwa sababu ya” au “mbele ya.”
- source_word: חָדָשׁ
  choice: vipya
  rationale: Kivumishi kimetumiwa kama nomino kwa mazao mapya; “vipya” huhifadhi ufupi wa Kiebrania na hueleweka kutokana na muktadha.
- source_word: תּוֹצִיאוּ
  choice: mtaviondoa
  rationale: Hifili ya יצא ina maana ya kusababisha vitoke, kuvitoa, au kuviondoa. Hapa inaeleza kuondoa akiba ya zamani kwa ajili ya mazao mapya.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Vyakula” limetumiwa bila kubainisha nafaka, kwa kuwa Kiebrania hakitaji aina ya mazao. Tanbihi inalinda maana rasmi zaidi ya תּוֹצִיאוּ (“mtavitoa”) na מִפְּנֵי (“kwa sababu ya”).
