base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: sw
  text: ndipo nitakapowapa mvua zenu kwa majira yake[a], nayo nchi itatoa mazao yake, na miti ya shambani[b] itatoa matunda yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wakati wake unaofaa.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mti wa shambani,” katika umoja wenye maana ya mkusanyiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: ndipo nitakapowapa
  rationale: Kitenzi נתן humaanisha ‘kutoa/kupa.’ Muundo huu unaendeleza ahadi ya masharti katika muktadha na unasikika kwa kawaida katika Kiswahili.
- source_word: גִשְׁמֵיכֶם
  choice: mvua zenu
  rationale: Nomino ya Kiebrania iko katika wingi na ina kiambishi cha nafsi ya pili wingi. ‘Mvua zenu’ huhifadhi wingi huo na maana ya mvua walizopewa kwa manufaa yao.
- source_word: בְּעִתָּם
  choice: kwa majira zake
  rationale: Kirai hiki kinaonyesha kwamba mvua zitakuja katika nyakati zinazozifaa. ‘Kwa majira zake’ huhifadhi urejeo wa wingi bila kupanua maana.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: nayo nchi itatoa
  rationale: Ingawa kitenzi hicho kihalisi ni ‘kutoa,’ Kiswahili ‘nchi itatoa’ ni cha kawaida katika habari ya uzalishaji wa kilimo na pia huhifadhi marudio ya mzizi נתן.
- source_word: יְבוּלָהּ
  choice: mazao yake
  rationale: יבול ni mazao au mavuno yanayotokana na nchi. ‘Mazao’ ni neno la kawaida, pana, na linalofaa katika muktadha wa kilimo.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: miti ya mashambani
  rationale: Kiebrania kinatumia umoja wenye maana ya mkusanyiko. Wingi ‘miti’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taarifa ya umbo la asili.
- source_word: יִתֵּן פִּרְיוֹ
  choice: itatoa matunda yake
  rationale: ‘Itatoa’ huhifadhi maana ya נתן na marudio yake katika mstari; ‘matunda yake’ huwakilisha kwa usahihi פִּרְיוֹ.
theological_decisions:
- issue: Baraka ya agano inayohusisha mvua na uzalishaji wa kilimo
  choice: Ahadi imetafsiriwa moja kwa moja kama utoaji halisi wa mvua na uzazi wa nchi.
  alternative: Kuitafsiri kama ahadi ya jumla ya ustawi wa mali au kama wingi wa kiroho pekee.
  rationale: Muktadha wa Mambo ya Walawi 26 unahusu baraka za agano kwa Israeli, na mstari huu unataja wazi mvua, mazao, na matunda. Tafsiri haipaswi kuongeza matumizi ya baadaye ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. ‘Mashambani’ ni cha kawaida zaidi kwa miti inayoota au kupandwa katika maeneo ya kilimo. Alama zote za tanbihi zimewekwa moja kwa moja katika matini.
