  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: sw
  text: Nami nitawaelekea[a] na kuwafanya mzae na muwe wengi, nami nitalithibitisha agano langu nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitawatazama kwa kibali.” Kiebrania kinasema kihalisi “nitawaelekea,” jambo ambalo katika muktadha huu linamaanisha kuwaonyesha kibali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: nitawaelekea
  rationale: Huhifadhi taswira halisi ya Mungu kugeukia watu wake, huku muktadha wa baraka ukidokeza kuwa anawaelekea kwa kibali.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: kuwafanya mzae
  rationale: Kauli ya kisababishi ya פרה inaonyesha kwamba Mungu atawafanya watu wazalishe uzao; ‘mzae’ ni Kiswahili cha kawaida na hudumisha mwangwi wa baraka ya uzazi.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: kuwa wengi
  rationale: Kauli ya kisababishi ya רבה humaanisha kuwafanya wawe wengi au kuwaongeza; pamoja na ‘kuwafanya,’ usemi huu ni wa asili katika Kiswahili.
- source_word: וַהֲקִימֹתִי
  choice: nitalithibitisha
  rationale: Katika muundo unaohusu agano, קום katika Hifili inaweza kumaanisha kulisimamisha, kulidumisha, au kulithibitisha. Kwa kuwa agano tayari lipo katika muktadha wa Sinai, ‘kulithibitisha’ huepuka kudokeza kwamba linaanzishwa kwa mara ya kwanza.
- source_word: בְּרִיתִי אִתְּכֶם
  choice: agano langu nanyi
  rationale: ‘Agano’ ni istilahi ya kawaida na yenye uzito wa kimaandiko kwa בְּרִית; ‘nanyi’ huonyesha uhusiano wa agano na watu wanaosemeshwa.
theological_decisions:
- issue: Kama maana ya kibali katika Mungu kuwaelekea watu iwekwe wazi
  choice: Kuhifadhi taswira ya ‘nitawaelekea’ katika maandiko makuu
  alternative: nitawatazama kwa kibali
  rationale: Muktadha unaonyesha wazi baraka na kibali, lakini פנה kimsingi ni ‘kugeukia/kuelekea.’ Tafsiri kuu huhifadhi taswira hiyo, na tanbihi hueleza maana inayodokezwa.
- issue: Maana ya הקים kuhusu agano ambalo tayari limefanywa
  choice: nitalithibitisha agano langu
  alternative: nitalisimamisha agano langu
  rationale: Kitenzi kinaweza kueleza kusimamisha au kuthibitisha agano. Katika muktadha huu agano na Israeli tayari lipo, hivyo ‘kulithibitisha’ huwasilisha kwa kawaida kuendelezwa au kutimizwa kwake bila kuingiza wazo la agano jipya.
- issue: Kudumisha muundo wa baraka ya kuzaa na kuwa wengi
  choice: kuwafanya mzae na kuwa wengi
  alternative: kuwafanya muwe na uzazi na kuwaongeza kwa wingi
  rationale: Chaguo hili ni la kawaida kwa wasomaji wa kisasa na huhifadhi mwangwi wa baraka ya Pentateuko bila kuifanya kuwa taarifa ya idadi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Nami ... nami’ hudumisha mtiririko wa ahadi za Kiebrania. Kiambishi cha tanbihi kimewekwa baada ya sentensi nzima kwa kuwa kinafafanua kishazi cha kwanza.
