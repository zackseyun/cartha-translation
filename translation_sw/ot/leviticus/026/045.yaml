  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: sw
  text: Lakini kwa ajili yao nitakumbuka agano na waliowatangulia[a], ambao niliwatoa kutoka nchi ya Misri mataifa yakiona, ili niwe Mungu wao. Mimi ni Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agano na mababu zao.” Kiebrania kinasema kwa ufupi “agano [na] waliotangulia,” kikirejelea kizazi cha awali cha agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Lakini ... nitakumbuka
  rationale: Ingawa וְ inaweza kutafsiriwa “na,” hapa inaonyesha geuko la kimawazo kutoka hukumu kwenda kukumbukwa kwa agano; “lakini” huonyesha mtiririko huo bila kuongeza wazo jipya.
- source_word: לָהֶם
  choice: kwa ajili yao
  rationale: Huhifadhi kihusishi ל na kuonyesha kwamba kukumbuka huku kunawaletea wao manufaa, si tu kwamba Mungu atawakumbuka.
- source_word: בְּרִית רִאשֹׁנִים
  choice: agano nililofanya na waliowatangulia[a]
  rationale: רִאשֹׁנִים ni kivumishi cha wingi kinachotumiwa kama nomino, yaani “waliotangulia/watu wa zamani.” Muundo wa Kiswahili unaweka wazi uhusiano wa agano bila kuufanya kuwa “agano la kwanza” kama mpango wa kinadharia.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: ambao niliwatoa
  rationale: Kiwakilishi rejeshi kinawarejelea watu waliotangulia, si agano; wingi wa watu umehifadhiwa wazi.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Huhifadhi mtindo wa kawaida wa simulizi la kutoka Misri na kutaja nchi, badala ya kufupisha kuwa “Misri” pekee.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: mataifa yakiona
  rationale: Ni Kiswahili cha kawaida kinachohifadhi maana ya tendo kufanyika hadharani, mbele ya macho ya mataifa.
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: ili niwe Mungu wao
  rationale: Huhifadhi kauli ya msingi ya uhusiano wa agano kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.”
theological_decisions:
- issue: Kirejelewa cha בְּרִית רִאשֹׁנִים
  choice: Agano na waliowatangulia, yaani kizazi cha awali kilichotolewa Misri
  alternative: Agano la kwanza kama mpango wa agano usiorejelea watu
  rationale: Kirai cha baadaye “ambao niliwatoa” kinaelekeza kwa watu. Tafsiri haifanyi kirai hiki kuwa jina la kinadharia la “agano la kwanza,” lakini tanbihi huhifadhi ufupi na upana wa Kiebrania.
- issue: Jinsia ya רִאשֹׁנִים
  choice: waliowatangulia
  alternative: mababu zao
  rationale: Wingi wa kiume wa kisarufi katika Kiebrania unaweza kurejelea kundi la kizazi cha awali. “Waliowatangulia” huhifadhi maana ya msingi bila kuingiza kwa lazima neno linalomaanisha wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. “Mataifa yakiona” huepuka usemi mzito “mbele ya macho ya mataifa” huku ikihifadhi ushuhuda wa hadharani. Jina “Yahwe” limetumiwa kwa יְהוָה.
