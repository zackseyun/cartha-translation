  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: sw
  text: Nami nitaweka amani katika nchi, nanyi mtalala bila mtu yeyote kuwatisha. Nitaondoa wanyama hatari[a] katika nchi, wala upanga[b] hautapita katika nchi yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanyama wakali wa mwituni.” Neno la Kiebrania linamaanisha wanyama wanaoweza kudhuru au kuhatarisha watu.
    reason: lexical_alternative
  - marker: b
    text: “Upanga” ni tamathali ya Kiebrania inayoweza kumaanisha vita au uvamizi wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם
  choice: Nami nitaweka amani
  rationale: Kitenzi נתן kimsingi ni ‘kutoa,’ lakini katika kishazi hiki Kiswahili cha kawaida husema ‘kuweka amani.’ Hii inaonyesha kwamba Mungu ndiye anayeleta hali ya amani bila kupunguza maana yake kuwa hisia ya ndani tu.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ hapa ni nchi yenyewe, yaani eneo la agano, si hali ya kisiasa kwa ujumla.
- source_word: וּשְׁכַבְתֶּם
  choice: nanyi mtalala
  rationale: שׁכב ni kujilaza au kulala. ‘Mtalala’ ni Kiswahili cha asili kinachodumisha picha ya kupumzika kwa usalama.
- source_word: וְאֵין מַחֲרִיד
  choice: bila mtu yeyote kuwatisha
  rationale: מַחֲרִיד humaanisha anayesababisha hofu. Usemi huu unahifadhi nguvu ya kisababishi na unasomeka kwa kawaida.
- source_word: וְהִשְׁבַּתִּי
  choice: Nitawaondoa
  rationale: Hifili ya שׁבת ni kusababisha kitu kikome. Kwa habari ya wanyama hatari, ‘kuwaondoa’ hueleza wazi matokeo yaliyokusudiwa.
- source_word: חַיָּה רָעָה
  choice: wanyama hatari
  rationale: רָעָה hapa hueleza madhara au hatari ya wanyama, wala si ubaya wao wa kimaadili.
- source_word: וְחֶרֶב
  choice: wala upanga
  rationale: חֶרֶב ni ‘upanga’ kihalisi na hapa pia ni taswira ya vita au uvamizi. Taswira ya Kiebrania imehifadhiwa na kufafanuliwa katika tanbihi.
- source_word: לֹא תַעֲבֹר בְּאַרְצְכֶם
  choice: hautapita katika nchi yenu
  rationale: Tafsiri hii inahifadhi picha ya jeshi au vita visivyovuka na kuingia katika nchi yao.
theological_decisions:
- issue: Upeo wa amani iliyoahidiwa
  choice: Ahadi inaeleza usalama wa agano katika nchi, ukiwemo uhuru kutoka hofu, wanyama hatari, na uvamizi wa kijeshi.
  alternative: Amani ya ndani au ya kiroho pekee; au amani ya kisiasa pekee.
  rationale: Muktadha halisi wa kulala bila kutishwa, kuondolewa kwa wanyama hatari, na kutopita kwa upanga unaonyesha baraka pana yenye msingi wa maisha halisi katika nchi. Tafsiri haifungi maana katika upande mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Nami’ na ‘wala’ hudumisha mtiririko wa kishairi wa ahadi bila kufanya sentensi kuwa ya kizamani. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
