language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: sw
  text: Lakini hata hivyo, watakapokuwa katika nchi ya adui zao, sitawakataa wala kuwachukia kwa kinyaa[a] kiasi cha kuwaangamiza kabisa[b] na kulivunja agano langu nao; kwa maana mimi ni Yahwe[c], Mungu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwachukia kabisa.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuwakomesha kabisa” au “kuwaangamiza kabisa.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kina jina la Mungu YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: Lakini hata hivyo
  rationale: 'Mkazo huu unaonyesha hali ya kukubali jambo linalotarajiwa kuwa kinyume: licha ya hukumu zilizotangulia, ahadi inayofuata bado inasimama.'
- source_word: בִּהְיוֹתָם
  choice: watakapokuwa
  rationale: Kitenzi-jina chenye בְּ kinaonyesha wakati au mazingira. Wakati ujao unaendana na muktadha wa onyo kuhusu uhamisho utakaokuja.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם
  choice: katika nchi ya adui zao
  rationale: Hii inawakilisha moja kwa moja muundo wa Kiebrania na ni Kiswahili cha kawaida.
- source_word: לֹא מְאַסְתִּים
  choice: sitawakataa
  rationale: מָאַס hapa ina maana ya kukataa au kutupilia mbali, hasa katika uhusiano wa agano.
- source_word: וְלֹא גְעַלְתִּים
  choice: wala kuwachukia kabisa
  rationale: גָּעַל ni neno lenye nguvu linaloonyesha kuchukia au kuona kinyaa; ‘kuwachukia kabisa’ ni wazi na cha heshima katika Kiswahili cha sasa.
- source_word: לְכַלֹּתָם
  choice: kiasi cha kuwaangamiza
  rationale: Kitenzi-jina chenye לְ kinaweza kueleza kusudi au matokeo. ‘Kiasi cha’ kinaonyesha kwamba Mungu hatawakataa au kuwachukia mpaka kufikia maangamizi kamili.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: na kulivunja agano langu nao
  rationale: הֵפֵר linapotumiwa kuhusu agano humaanisha kulivunja, kulibatilisha, au kulifanya lisifanye kazi. ‘Kulivunja agano’ ni usemi wa kawaida na wenye uzito unaofaa.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: kwa maana mimi ni Yahwe, Mungu wao
  rationale: כִּי linatoa msingi wa ahadi, na jina la Mungu יהוה limetolewa kwa namna ya ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה. ‘Yahwe’ linawakilisha jina hilo moja kwa moja bila kulibadilisha kuwa cheo.
- issue: Wakati wa vitenzi לֹא מְאַסְתִּים na וְלֹא גְעַלְתִּים
  choice: 'wakati ujao: ‘sitawakataa wala kuwachukia’'
  alternative: 'wakati uliopita: ‘sikuwakataa wala kuwachukia’; au wakati wa sasa: ‘siwakatai wala siwachukii’'
  rationale: Ingawa maumbo hayo ni qatal, muktadha wa sura unaelekeza kwenye hali ya baadaye watakapokuwa katika nchi ya adui zao. Wakati ujao unaonyesha vizuri nguvu ya ahadi bila kudai kwamba qatal yenyewe daima ni wakati ujao.
- issue: Uhusiano wa לְכַלֹּתָם na לְהָפֵר בְּרִיתִי
  choice: maangamizi na kuvunjwa kwa agano yanaonyeshwa kama matokeo ambayo Mungu hatayafikia
  alternative: kuyachukulia kama makusudi mawili tofauti kabisa
  rationale: Muundo wa Kiebrania unaweza kuwa na maana ya kusudi au matokeo. Tafsiri ‘kiasi cha’ inadumisha uhusiano huo bila kuamua kwa ukali zaidi ya ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Maneno ya agano yamehifadhiwa kwa uwazi, na nguvu tofauti za ‘kukataa’ na ‘kuchukia kabisa’ zimetofautishwa.
