  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: sw
  text: Lakini wakiungama uovu wao na uovu wa baba zao, katika kukosa kwao uaminifu, waliponitendea bila uaminifu[a], na pia kwamba walienenda kinyume nami[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usaliti wao, ambao kwa huo walinisaliti.” Kiebrania hutumia nomino na kitenzi vya mzizi mmoja kusisitiza kuvunjwa kwa uaminifu wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au “walienenda kwa uhasama nami.” Neno la Kiebrania linalotafsiriwa “kinyume” ni gumu na linarudiwa katika sura hii likieleza mwenendo wa upinzani au uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Lakini wakiungama
  rationale: Kitenzi hiki cha Hitpael kinamaanisha ‘kuungama.’ Katika mfuatano wa masharti wa kifungu hiki, ‘wakiungama’ huwasilisha maana ya sharti kwa Kiswahili cha kawaida; ‘Lakini’ huonyesha ugeuko kutoka hukumu iliyotangulia.
- source_word: עֲוֺנָם
  choice: uovu wao
  rationale: עָוֹן hapa ni kosa la kimaadili linalopaswa kuungamwa. ‘Uovu’ huhifadhi uzito wa kosa bila kulifanya limaanishe adhabu au matokeo ya hatia pekee.
- source_word: עֲוֺן אֲבֹתָם
  choice: uovu wa baba zao
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa Kiebrania. ‘Baba zao’ imehifadhiwa kwa kuwa neno la asili linawataja mababa wa ukoo, na hivyo kudumisha kipengele cha kuungama kwa pamoja na katika historia ya agano.
- source_word: בְּמַעֲלָם ... מָעֲלוּ בִי
  choice: na usaliti wao ambao kwa huo walinisaliti
  rationale: Nomino na kitenzi vinatokana na mzizi mmoja na vinasisitiza kuvunjwa kwa uaminifu wa agano. Kurudia ‘usaliti/walinisaliti’ huhifadhi msisitizo huo, huku ‘na’ ikiunganisha jambo hili na mambo yanayoungamwa.
- source_word: וְאַף
  choice: na pia
  rationale: Huongeza jambo jingine katika maungamo bila kuzidisha nguvu ya usemi.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: walienenda kinyume nami
  rationale: Hii ni nahau ya mwenendo wa maisha. ‘Walienenda kinyume nami’ huwasilisha upinzani unaodokezwa na קֶרִי na kudumisha lugha inayojirudia katika sura hii.
theological_decisions:
- issue: Maungamo ya pamoja yanayohusisha uovu wa mababa
  choice: Kuhifadhi ‘uovu wa baba zao’ katika matini kuu
  alternative: dhambi za mababu zao; matokeo ya uovu wa baba zao
  rationale: Kiebrania kinataja wazi uovu wa mababa pamoja na uovu wa kizazi kinachoungama. Tafsiri haiufanyi usemi huu kuwa matokeo ya dhambi tu wala haiingizi ufafanuzi wa kimadhehebu kuhusu hatia ya kurithi.
- issue: Maana ya kuvunja uaminifu wa agano katika מַעַל
  choice: usaliti wao ambao kwa huo walinisaliti
  alternative: kukosa kwao uaminifu ambako kwa huko hawakuwa waaminifu kwangu
  rationale: ‘Usaliti’ huonyesha uzito wa kuvunjwa kwa uaminifu wa uhusiano wa agano na huhifadhi uhusiano wa nomino na kitenzi, bila kuufanya kuwa kosa la kiibada la aina fulani pekee.
- issue: Maana isiyo hakika ya קֶרִי
  choice: kinyume nami
  alternative: kwa uhasama nami
  rationale: Neno hili gumu linarudiwa katika Walawi 26 na linaweza kuonyesha mwenendo wa upinzani au uhasama. ‘Kinyume nami’ huhifadhi upana huo; maana ya uhasama imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Walienenda’ limetumiwa kwa nahau ya mwenendo wa maisha; muundo wa sharti umeonyeshwa kwa ‘wakiungama.’ Sentensi imeachwa na koma kwa kuwa mstari unaendelea katika aya inayofuata.
