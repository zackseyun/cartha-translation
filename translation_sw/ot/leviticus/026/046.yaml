  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: sw
  text: Hizi ndizo kanuni, hukumu na sheria ambazo Yahwe aliweka kati yake na wana wa Israeli[a] kwenye Mlima Sinai kwa mkono wa Musa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa.”
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Muundo huu wa Kiswahili unatambulisha kwa kawaida na kwa mkazo muhtasari wa masharti yaliyotangulia.
- source_word: הַחֻקִּים
  choice: kanuni
  rationale: Neno hili linaonyesha masharti yaliyowekwa na kudumu, huku likitofautishwa kwa kiasi kinachowezekana na מִשְׁפָּטִים na תּוֹרֹת katika orodha hii ya kisheria.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: Hifadhi maana ya maamuzi au masharti ya kisheria na pia ulinganifu wa karibu na neno la Kiebrania.
- source_word: הַתּוֹרֹת
  choice: sheria
  rationale: Katika orodha hii ya istilahi za agano, wingi תּוֹרֹת unarejelea mafundisho yenye mamlaka au sheria; ‘sheria’ ni ya kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר נָתַן
  choice: ambazo ... alitoa
  rationale: ‘Alitoa’ linaakisi moja kwa moja נָתַן, ‘alitoa/alipa,’ bila kuingiza kimya kimya dhana pana zaidi ya ‘kuanzisha.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; ‘Yahwe’ ni tahajia ya kawaida ya Kiswahili.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: kati yake na wana wa Israeli
  rationale: ‘Kati yake na’ huhifadhi uhusiano wa pande mbili, na ‘wana wa Israeli’ huakisi kwa karibu usemi wa Kiebrania huku mbadala wa kawaida ukiwekwa katika tanbihi.
- source_word: בְּהַר סִינַי
  choice: kwenye Mlima Sinai
  rationale: Huu ni usemi wa sasa na wa kawaida wa Kiswahili kwa mahali ambapo utoaji wa masharti hayo ulifanyika.
- source_word: בְּיַד מֹשֶׁה
  choice: kwa mkono wa Musa
  rationale: Tafsiri hii huhifadhi taswira ya nahau ya Kiebrania; tanbihi inaeleza kuwa maana yake ni uwakala wa Musa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. Kulihifadhi kama jina binafsi huepuka kulibadilisha kuwa cheo.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo kuu huhifadhi umbo halisi la usemi wa Kiebrania, ilhali tanbihi inatoa namna ya kawaida zaidi ya Kiswahili bila kuficha tofauti hiyo.
- issue: Nahau בְּיַד מֹשֶׁה
  choice: kwa mkono wa Musa
  alternative: kupitia Musa
  rationale: Maandishi makuu yanahifadhi nahau na taswira ya chanzo, huku tanbihi ikifafanua maana yake ya Musa kuwa mpatanishi au wakala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha ya istilahi za kisheria imehifadhiwa bila kuifanya iwe nzito isivyo lazima; jina ‘Yahwe’ na nahau ya Kiebrania vimeachwa wazi, na ufafanuzi muhimu umetolewa katika tanbihi.
