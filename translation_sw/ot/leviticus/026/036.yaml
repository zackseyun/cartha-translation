  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: sw
  text: Nao wale watakaobaki miongoni mwenu, nitawatia unyonge mioyoni mwao katika nchi za adui zao. Sauti ya jani linalopeperushwa[a] itawafuatia; watakimbia kama wakimbiavyo upanga, nao wataanguka, wala hakuna anayewafuatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jani linalopeperushwa na upepo.”
    reason: נדף huonyesha jani linalosukumwa au kupeperushwa; upepo unaeleweka katika muktadha lakini hautajwi wazi katika Kiebrania.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: wale watakaobaki miongoni mwenu
  rationale: Huhifadhi maana ya watu waliosalia baada ya hukumu na pia usemi wa moja kwa moja kwa Israeli uliomo katika בכם.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: nitatia hofu mioyoni mwao
  rationale: מֹרֶךְ ni kuvunjika moyo au kupoteza ujasiri kunakozaa woga. Kiswahili cha sasa ‘nitatia hofu mioyoni mwao’ ni cha asili na huhifadhi tendo la Mungu juu ya hali yao ya ndani.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: katika nchi za adui zao
  rationale: ‘Nchi’ inaweza kutumika kwa umoja wa umbo huku ‘za’ ikionyesha maeneo mengi ya maadui, na hivyo kuakisi wingi wa Kiebrania bila lugha nzito.
- source_word: וְרָדַף אֹתָם
  choice: itawafukuza
  rationale: רדף humaanisha kufuatilia au kufukuza. Hapa ‘itawafukuza’ huonyesha kwa kawaida kejeli ya sauti ndogo kuwa kana kwamba ni mfuatiliaji.
- source_word: קוֹל עָלֶה נִדָּף
  choice: sauti ya jani linalopeperushwa
  rationale: Huhifadhi ‘sauti,’ ‘jani,’ na hali ya kutendwa katika נדף bila kumtaja upepo moja kwa moja kama mtendaji.
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: watakimbia kama mtu anayekimbia upanga
  rationale: Kirai kinaeleza namna ya kukimbia kwa hofu kana kwamba mbele ya upanga; tafsiri hii ni wazi na huhifadhi ulinganisho.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: wataanguka ingawa hakuna anayewafukuza
  rationale: ‘Wataanguka’ huhifadhi ufupi na utata wa נפל, iwe ni kuanguka kwa hofu au kushindwa; ‘ingawa’ huonyesha wazi kejeli kwamba hakuna mfuatiliaji halisi.
theological_decisions:
- issue: Asili ya hukumu inayoelezwa
  choice: Mungu anasababisha hofu ya ndani na taharuki katika uhamisho
  alternative: Ufuatiliaji wa kijeshi wa nje tu, au wasiwasi wa kiishara tu
  rationale: Aya inahusisha moja kwa moja hali ya mioyo yao na tendo la Mungu, kisha inaonyesha kukimbia kusiko na sababu kwa kusikia sauti ndogo. Tafsiri huhifadhi utendaji wa Mungu na uzoefu wa hofu bila kuongeza mfumo wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mioyoni mwao’ na ‘wataanguka’ huhifadhi mtindo wa kibiblia bila kuwa wa kizamani; sentensi mbili hupunguza uzito wa muundo huku zikihifadhi mfuatano wa mawazo.
