id: LEV.26.13
reference: Leviticus 26:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: sw
  text: Mimi ni Yahwe, Mungu wenu, niliyewatoa katika nchi ya Misri, ili msiwe watumwa wao. Nilivunja fito za nira yenu, nikawafanya mtembee mkiwa wima[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vichwa vyenu vikiwa juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika kauli hii ya agano, umbo hilo linamtaja Yahwe mmoja na kiambishi cha wingi kinawahusu watu wanaosemeshwa.
- source_word: הוֹצֵאתִי
  choice: niliyewatoa
  rationale: Hifili ya יצא ina maana ya kusababisha watoke; “kuwatoa” ni ya asili katika Kiswahili na inadumisha wazo la kutoka Misri.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Kwa kitenzi “kuwatoa,” kihusishi “katika” huonyesha kwa kawaida mahali walikotolewa.
- source_word: מִהְיוֹת לָהֶם עֲבָדִים
  choice: msiendelee kuwa watumwa wao
  rationale: Kirai kinaonyesha kuokolewa kutoka hali ya utumwa. “Watumwa” kinaweka wazi hali ya kufungwa na kunyanyaswa, na “msiendelee” huonyesha kukomeshwa kwa hali hiyo.
- source_word: וָאֶשְׁבֹּר
  choice: Nilivunja
  rationale: Hii ni tafsiri ya moja kwa moja ya kitendo cha Mungu cha kuvunja.
- source_word: מֹטֹת עֻלְּכֶם
  choice: fito za nira yenu
  rationale: מֹטֹת ni fito au pau zinazohusiana na nira; usemi huu unahifadhi picha halisi ya kifungo kilichovunjwa.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: nikawafanya mtembee
  rationale: Hifili ya הלך ina maana ya kusababisha waende au watembee; muundo huu unadumisha maana hiyo ya kisababishi.
- source_word: קוֹמְמִיּוּת
  choice: mkiwa wima
  rationale: Neno hilo linaonyesha mkao ulionyooka, kinyume cha kuinama chini ya nira, na pia linadokeza heshima iliyorejeshwa.
theological_decisions:
- issue: Hali ya Waisraeli nchini Misri
  choice: watumwa
  alternative: watumishi
  rationale: Muktadha unahusu ukombozi kutoka kifungo cha kulazimishwa; “watumwa” halainishi uzito wa hali hiyo.
- issue: Picha ya mwisho ya ukombozi
  choice: nikawafanya mtembee mkiwa wima
  alternative: nikawafanya mtembee vichwa vyenu vikiwa juu
  rationale: Tafsiri iliyochaguliwa inadumisha kisababishi cha kitenzi na picha halisi ya mkao ulionyooka bila kuifafanua kupita kiasi kama hisia pekee ya fahari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sentensi fupi zimetumiwa ili kuweka wazi matendo ya Yahwe na mfululizo wa ukombozi.
