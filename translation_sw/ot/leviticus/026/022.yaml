  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: sw
  text: Nami nitawapelekea wanyama wa mwituni dhidi yenu[a]; watawafanya mfiwe[b], wataangamiza mifugo yenu, watawafanya muwe wachache, na barabara zenu zitabaki tupu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanyama wa porini.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia nahau ya kufiwa; kwa kawaida hudokeza kufiwa na watoto, ingawa “watoto” halitajwi wazi.
    reason: lexical_alternative
  - marker: c
    text: Au, “njia zenu zitakuwa ukiwa.” Hapa huenda ikimaanisha barabara au njia za kusafiria zitakazoachwa bila watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: Nami nitawatuma ... dhidi yenu
  rationale: Hifili ya שלח ina maana ya ‘kutuma,’ na ב katika muktadha huu huonyesha tendo la uadui, hivyo ‘dhidi yenu’ huwasilisha hukumu kwa Kiswahili cha kawaida.
- source_word: חַיַּת הַשָּׂדֶה
  choice: wanyama wa mwituni
  rationale: Kirai hiki kinamaanisha wanyama wa porini wasiofugwa. ‘Wanyama wa mwituni’ ni lugha ya sasa na yenye heshima, bila ukale wa lazima.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: watawanyima watoto
  rationale: Pieli ya שׁכל humaanisha kuwafanya watu wafiwe, hasa na watoto. Kiswahili ‘kuwanyima watoto’ huhifadhi athari ya kuachwa bila watoto bila kuongeza ‘kuua,’ jambo ambalo halijasemwa wazi.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: wataangamiza mifugo yenu
  rationale: הכרית hapa ni kuondoa au kuangamiza kabisa katika hukumu; ‘wataangamiza’ ni ya kawaida zaidi kuliko tafsiri ya kimofimu ‘watakata.’ בְּהֵמָה hapa ni wanyama wanaofugwa, kwa hiyo ‘mifugo’ inafaa.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: watawapunguza idadi
  rationale: Hifili ya מעט ni kufanya wawe wachache. ‘Kuwapunguza idadi’ hueleza wazi kupungua kwa watu.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: barabara zenu zitakuwa ukiwa
  rationale: נשׁם huonyesha kuwa ukiwa au kuachwa tupu. Katika muktadha wa kupungua kwa watu, דְּרָכִים inaelekea kumaanisha barabara au njia za kusafiria.
theological_decisions:
- issue: Kitu kisichotajwa wazi katika usemi wa kufiwa
  choice: Kutafsiri ‘watawanyima watoto’ na kuweka tanbihi kuhusu nahau
  alternative: ‘Watawafanya mfiwe’ bila kutaja watoto
  rationale: Kiebrania hakitaji watoto kwa nomino, lakini שׁכל kwa kawaida ni kufiwa na watoto. Tafsiri kuu inafanya nahau ieleweke kwa msomaji wa Kiswahili, huku tanbihi ikionyesha kwamba neno ‘watoto’ limedokezwa badala ya kutajwa wazi.
- issue: Maana ya דַּרְכֵיכֶם
  choice: barabara zenu
  alternative: njia zenu
  rationale: Muktadha wa uharibifu wa jamii na kupungua kwa watu unaunga mkono njia halisi za kusafiria kuwa tupu, ingawa maana pana ya ‘njia’ bado inawezekana na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa hukumu wenye vitenzi vinavyofuatana umehifadhiwa; ‘barabara’ imetumiwa kwa uwazi wa kimuktadha, na tanbihi zinatunza mbadala halisi wa Kiebrania.
