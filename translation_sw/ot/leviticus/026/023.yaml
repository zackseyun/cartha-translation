  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: sw
  text: Na ikiwa hamtakubali kurekebishwa nami kwa mambo haya, bali mtaendelea kunipinga,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: kwa mambo haya
  rationale: Kiambishi ב kinaeleweka hapa kama cha njia au chombo, kikirejelea hukumu na adhabu zilizotangulia.
- source_word: תִוָּסְרוּ
  choice: hamtakubali kurekebishwa
  rationale: Nifali ya יסר ina maana ya kuadibishwa au kurekebishwa. Muundo huu unaonyesha kwamba adhabu imetolewa lakini haijakubaliwa kama marekebisho, bila kudokeza kwamba Mungu hakuwatia adabu.
- source_word: לִי
  choice: nami
  rationale: Dativu hii ni ya kimuktadha na inaonyesha Mungu kuwa mhusika wa kurekebisha; Kiswahili cha asili huunganisha wakala na kitenzi kwa “nami” katika muundo huu.
- source_word: וַהֲלַכְתֶּם
  choice: bali mtaendelea
  rationale: Kitenzi “kutembea” ni sitiari ya mwenendo. “Mtaendelea” huwasilisha mwendo wa maisha unaodumu na nguvu ya upinzani katika sentensi ya masharti.
- source_word: עִמִּי קֶרִי
  choice: kunipinga
  rationale: Nahau hii ya Kiebrania, kihalisi ikiwa na “pamoja nami” na nomino ya uhasama au ukaidi, inaeleza mwenendo wa kumpinga Mungu. “Kunipinga” ni ya kawaida na wazi katika Kiswahili huku ikihifadhi uhusiano wa upinzani.
theological_decisions:
- issue: Nahau ya uhusiano wa agano עִמִּי קֶרִי
  choice: mtaendelea kunipinga
  alternative: mtaenenda kwa uhasama nami
  rationale: Chaguo hili linaonyesha upinzani unaoendelea dhidi ya BWANA bila kuufanya kuwa kutotii kwa jumla tu. Pia linaepuka Kiswahili kisicho cha kawaida cha tafsiri ya neno kwa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sharti umehifadhiwa, na sitiari ya Kiebrania ya “kutembea” imewasilishwa kwa maana yake ya mwenendo wa kudumu.
