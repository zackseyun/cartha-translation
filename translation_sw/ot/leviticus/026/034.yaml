reference: Leviticus 26:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: sw
  text: Ndipo nchi itakapofurahia Sabato zake siku zote za ukiwa wake[a], wakati ninyi mtakapokuwa katika nchi ya maadui zenu; ndipo nchi itakapopumzika na kufurahia Sabato zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itafidiwa kwa ajili ya Sabato zake.” Kitenzi cha Kiebrania katika muktadha huu kinaweza kumaanisha kupokea kilichokuwa haki yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: ndipo
  rationale: Kielezi hiki kinaonyesha wakati na matokeo ya hukumu iliyotangulia. “Ndipo” ni cha asili katika Kiswahili na hudumisha msisitizo unaorudiwa katika Kiebrania.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: itakapofurahia / kufurahia
  rationale: Katika muktadha huu, mzizi רצה unaonyesha nchi kupokea Sabato ilizonyimwa, kana kwamba inapokea kilicho haki yake. “Kufurahia” ni usemi wa kawaida na hudumisha taswira ya Kiebrania; maana ya fidia inaelezwa katika tanbihi. Mzizi unaorudiwa umetafsiriwa kwa neno lilelile.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Hapa neno hili linamaanisha nchi ya agano, si dunia nzima wala udongo tu.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: Sabato zake
  rationale: Usemi huu unahusu mapumziko ya Sabato ya nchi, hasa miaka ya Sabato katika muktadha. Umbo fupi la Kiebrania limehifadhiwa bila kulifafanua kupita kiasi.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: siku zote za ukiwa wake
  rationale: Usemi huu unaonyesha muda wote ambao nchi itakuwa imeachwa ukiwa, huku kiambishi cha umilikaji katika Kiebrania kikihifadhiwa kwa “wake.”
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: wakati ninyi mtakapokuwa katika nchi ya maadui zenu
  rationale: Kishazi hiki kinaeleza hali na wakati wa ukiwa wa nchi. “Wakati ... mtakapokuwa” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: תִּשְׁבַּת
  choice: itakapopumzika
  rationale: Mzizi שבת hapa unaonyesha nchi ikiacha kulimwa na hivyo kupumzika. “Kupumzika” ni ya asili na hudumisha uhusiano na Sabato.
theological_decisions:
- issue: Uhusiano wa nchi na Sabato zake wakati wa hukumu ya uhamisho
  choice: Nchi inafurahia Sabato zake, kwa maana inapokea mapumziko iliyokuwa imenyimwa.
  alternative: Nchi inafidiwa kwa ajili ya Sabato zake au inatimiza Sabato zake.
  rationale: Muktadha wa Walawi 26 unaunganisha hukumu ya agano na mapumziko ya Sabato ya nchi. Tafsiri kuu hudumisha taswira ya Kiebrania bila kuamua kupita kiasi kati ya furaha na fidia; tanbihi inaonyesha maana ya kupokea kilichokuwa haki yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Marudio ya “ndipo,” “nchi,” na “kufurahia Sabato zake” yamehifadhiwa ili kuakisi muundo na msisitizo wa Kiebrania.
