  text: Ikiwa mtaenenda katika sheria zangu[a], na mtazishika amri zangu na kuzitenda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtafuata sheria zangu.” Kiebrania kinasema kihalisi, “mtaenenda katika sheria zangu,” usemi wa agano unaomaanisha kuishi kwa kufuata sheria hizo.
