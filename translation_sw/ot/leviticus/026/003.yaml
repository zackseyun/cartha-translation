  verdict: revise
  source_fidelity: 'The draft accurately represents the conditional force of אִם and retains the metaphor of walking/enacting one’s life in the divine statutes. It also preserves the distinct sequence: walk in statutes, keep commandments, and do them. However, “kanuni” is somewhat less fitting for חֻקּוֹת in this legal-covenantal context than “sheria,” and the verbal coordination should be made fully clear in Swahili.'
  naturalness: “Mtaenenda” is appropriately formal and intelligible in Standard East African Swahili. The sequence “mtaenenda ... na kuzishika amri ...” leaves an avoidable shift from a finite verb to infinitives. Supplying “mtazishika” produces a clear, natural conditional sentence while retaining the concise biblical register.
  terminology: Use “sheria zangu” for חֻקּוֹת and “amri zangu” for מִצְוֺתַי. This pairing is well-established, preserves the legal distinction as far as Swahili allows, and is more natural here than “kanuni zangu.”
  issues:
  - severity: medium
    issue: “Kanuni zangu” is a less precise rendering of חֻקּוֹת in this context.
    rationale: “Kanuni” can mean rules or principles, whereas “sheria” more naturally conveys divinely prescribed statutes/laws in formal biblical and legal register.
  - severity: medium
    issue: The verbal sequence mixes “mtaenenda” with “kuzishika” without an explicit finite verb for the second coordinated action.
    rationale: Although understandable, adding “mtazishika” makes the parallel actions explicit and idiomatic, reflecting the Hebrew’s three finite verbs.
  - severity: low
    issue: The footnote’s explanatory wording can be more idiomatic.
    rationale: “Kuishi kwa kufuata sheria hizo” communicates the idiom more naturally than “kuendesha maisha kulingana nazo,” without adding interpretive content.
