lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Huanzisha sharti la wazi; “ikiwa” huhifadhi nguvu ya tungo ya masharti kuliko “wakati.”
- source_word: בְּחֻקֹּתַי
  choice: katika kanuni zangu
  rationale: חֻקּוֹת ni masharti au kanuni zilizowekwa. “Kanuni” huhifadhi maana ya kisheria na ya agano huku ikitofautishwa na “amri” katika sehemu inayofuata.
- source_word: תֵּלֵכוּ
  choice: mtaenenda
  rationale: הלך kimsingi ni kwenda au kutembea, na hapa ni sitiari ya kuendesha maisha. “Mtaenenda” huhifadhi sitiari hiyo kwa lugha yenye hadhi.
- source_word: מִצְוֺתַי
  choice: amri zangu
  rationale: מִצְוָה humaanisha amri; tafsiri hii ni ya kawaida, wazi, na inafaa muktadha wa kisheria.
- source_word: תִּשְׁמְרוּ
  choice: kuzishika
  rationale: Katika muktadha wa sheria, שׁמר ni kushika au kuzingatia amri. “Kuzishika” ni usemi wa kawaida wa Kiswahili unaodumisha wazo la utiifu.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: na kuzitenda
  rationale: עשה hapa hueleza kutekeleza amri kwa vitendo. “Kuzitenda” ni ya moja kwa moja na hudumisha msisitizo wa matendo.
theological_decisions:
- issue: Sitiari ya utiifu ndani ya agano
  choice: Kuhifadhi usemi “mtaenenda katika kanuni zangu.”
  alternative: “mtafuata kanuni zangu” au “mtaishi kwa kufuata kanuni zangu”
  rationale: Kiebrania hutumia sitiari ya kuenenda kueleza mwenendo mzima wa maisha kulingana na kanuni za Mungu. Kuihifadhi hudumisha ladha ya chanzo bila kuifafanua kupita kiasi; tanbihi inaeleza maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtaenenda” ni rasmi kiasi lakini bado inaeleweka na huhifadhi sitiari ya Kiebrania. Alama ya tanbihi imewekwa mara tu baada ya usemi unaoelezwa.
