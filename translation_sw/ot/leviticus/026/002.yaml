  text: Mtazishika sabato zangu, na mtastahi patakatifu pangu[a]. Mimi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtaogopa patakatifu pangu,” au “mtakuwa na kicho kwa patakatifu pangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuogopa, kustahi, au kuwa na kicho, kulingana na muktadha.
