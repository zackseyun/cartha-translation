lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: Sabato zangu
  rationale: Nomino ya Kiebrania iko katika wingi na ina kiambishi cha nafsi ya kwanza umoja. “Sabato zangu” huhifadhi wingi huo na inaweza kujumuisha nyakati zote takatifu za Sabato.
- source_word: תִּשְׁמֹרוּ
  choice: mtazishika
  rationale: Kitenzi שׁמר hapa kina maana ya kushika au kuadhimisha kwa uangalifu agizo takatifu. “Mtazishika” ni ya kawaida katika lugha ya maagano na inaonyesha utiifu.
- source_word: וּמִקְדָּשִׁי
  choice: na ... mahali pangu patakatifu
  rationale: מִקְדָּשׁ ni mahali palipotengwa kuwa patakatifu, yaani sanctuary. “Mahali pangu patakatifu” ni Kiswahili cha sasa, wazi, na chenye hadhi.
- source_word: תִּירָאוּ
  choice: mtapaheshimu
  rationale: Kitenzi ירא kinaweza kueleza kuogopa, kustahi, au kuwa na kicho. Katika muktadha wa mahali patakatifu, “mtapaheshimu” huonyesha heshima takatifu bila kuondoa uzito wa agizo; upana wa maana umeonyeshwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha na cheo.
- issue: Nguvu ya kitenzi ירא kuhusiana na mahali patakatifu
  choice: mtapaheshimu
  alternative: mtapaogopa au mtakuwa na kicho kwa ajili ya
  rationale: Muktadha unadai heshima nzito na takatifu, si hofu ya kawaida pekee. Tanbihi huhifadhi uwezekano wa maana za kuogopa na kuwa na kicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa wakati ujao umetumiwa kwa nguvu ya agizo, sambamba na namna amri hizi zinavyotolewa katika Kiebrania. “Mahali pangu patakatifu” ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi nzito ya kidini, huku ikiendelea kuonyesha sanctuary.
