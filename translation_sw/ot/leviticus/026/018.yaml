base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: sw
  text: Na ikiwa, licha ya mambo haya[a], hamtanisikiliza, nitaendelea kuwatia adabu mara saba[b] kwa sababu ya dhambi zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mambo haya” au “baada ya mambo haya.” Katika muktadha huu, nahau ya Kiebrania humaanisha kuendelea kutotii licha ya hukumu zilizotangulia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweza kumaanisha adhabu iliyozidishwa sana, si lazima hesabu kamili ya mara saba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi וְ pamoja na sharti linaloendeleza mfululizo wa maonyo ya agano.
- source_word: עַד אֵלֶּה
  choice: licha ya hayo yote
  rationale: Katika muktadha huu, nahau hii inaonyesha kuendelea kutotii licha ya hukumu zilizotangulia, si maana ya muda ya ‘mpaka’.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: hamtanisikiliza
  rationale: Kitenzi שׁמע pamoja na לִי kinadokeza kusikiliza kunakoleta utii; tafsiri hii huhifadhi sitiari ya kusikia bila kufafanua maana hiyo kupita kiasi.
- source_word: וְיָסַפְתִּי
  choice: nitaendelea
  rationale: יסף hapa huonyesha kuendelea au kuongezeka kwa hatua ya hukumu; ‘nitaendelea’ ni Kiswahili cha kawaida na kinachofaa muktadha.
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: kuwatia adabu
  rationale: יסר hubeba maana ya kurekebisha kwa adhabu; ‘kuwatia adabu’ huhifadhi pande zote mbili bila kuifanya iwe adhabu tupu wala maonyo mepesi.
- source_word: שֶׁבַע
  choice: mara saba
  rationale: Neno hili limetumiwa kama kielezi cha kipimo cha adhabu. ‘Mara saba’ ni usemi wa asili wa Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya kuzidishwa kwa ukali badala ya hesabu kamili.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: kwa sababu ya dhambi zenu
  rationale: עַל hapa inaonyesha msingi au sababu ya kutiwa adabu; usemi huu unaeleza uhusiano huo wazi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya יָסַר katika muktadha wa laana za agano
  choice: kuwatia adabu
  alternative: kuwaadhibu
  rationale: Muktadha unaonyesha hatua yenye kuadhibu lakini pia yenye lengo la kurekebisha ndani ya uhusiano wa agano. ‘Kuwatia adabu’ huhifadhi mvutano huo badala ya kuifanya iwe kisasi tu au kuondoa uzito wa adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umoja wa maneno ‘hamtanisikiliza,’ ‘kuwatia,’ na ‘zenu’ unaonyesha kwamba Mungu anazungumza na jumuiya nzima. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
