source:
  edition: WLC
  text: וְ/אִם תֵּֽלְכ֤וּ עִמִּ/י֙ קֶ֔רִי וְ/לֹ֥א תֹאב֖וּ לִ/שְׁמֹ֣עַֽ לִ֑/י וְ/יָסַפְתִּ֤י עֲלֵי/כֶם֙ מַכָּ֔ה שֶׁ֖בַע כְּ/חַטֹּאתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: sw
  text: Ikiwa mtaenenda kinyume nami[a], na hamtaki kunisikiliza, nitazidi kuwapiga mara saba kwa kadiri ya dhambi zenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uhasama nami” au “kwa kunipinga.” Nahau ya Kiebrania inayosema “kuenenda nami katika qeri” ni ngumu; katika sura hii inaonyesha msimamo wa upinzani, si jambo linalotokea kwa bahati.
    reason: lexical_alternative
  - marker: b
    text: Au, “nitaongeza mapigo juu yenu mara saba kwa kadiri ya dhambi zenu.”
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: kinyume
  rationale: Katika Walawi 26 neno hili gumu linaonyesha msimamo wa upinzani au uhasama katika uhusiano wa agano, si tukio la bahati nasibu. ‘Kinyume’ ni la kawaida, linaeleweka, na halibani maana kuwa uhasama wa wazi pekee.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: mtaenenda kinyume nami
  rationale: Kitenzi ‘kwenda/kuenenda’ kinaonyesha mwenendo wa maisha. ‘Mtaenenda kinyume nami’ huhifadhi taswira ya Kiebrania na kuwasilisha maana ya kuishi kwa kumpinga Mungu.
- source_word: תֹאבוּ
  choice: hamtaki
  rationale: Kitenzi hiki kinaonyesha kutokuwa tayari au kukataa kwa hiari. ‘Hamtaki’ ni Kiswahili cha kawaida kinachoonyesha ukaidi huo bila kuongeza ufafanuzi usiotajwa.
- source_word: לִשְׁמֹעַ לִי
  choice: kunisikiliza
  rationale: ‘Kunisikiliza’ huhifadhi maana ya msingi ya kusikia kwa makini, huku wazo la kutii katika muktadha wa agano likibaki ndani ya usemi bila kuwekwa wazi kupita kiasi.
- source_word: וְיָסַפְתִּי
  choice: nitazidi
  rationale: Neno hili kwa msingi humaanisha kuongeza. Katika mfululizo wa adhabu zinazoongezeka, ‘nitazidi’ linaonyesha kuwa mapigo zaidi yataongezwa kwa yale yaliyotangulia.
- source_word: מַכָּה
  choice: kuwapiga
  rationale: Nomino ya Kiebrania inaweza kumaanisha pigo, jeraha, au tauni. Uundaji wa kitenzi ‘kuwapiga’ ni wa asili katika Kiswahili na huhifadhi upana wa maana bila kuibana kuwa tauni maalumu.
- source_word: שֶׁבַע
  choice: mara saba
  rationale: Hapa neno hilo linafanya kazi kwa namna ya kielezi katika kauli inayorudiwa kuhusu hukumu. ‘Mara saba’ ni usemi wa wazi na wa kawaida wa Kiswahili unaowasilisha ongezeko hilo.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: kwa kadiri ya dhambi zenu
  rationale: Kiambishi כ kinaonyesha ulinganifu au uwiano. ‘Kwa kadiri ya dhambi zenu’ huhifadhi maana kwamba mapigo yanalingana na dhambi, badala ya kuonyesha sababu tu.
theological_decisions:
- issue: Maana ya kauli ya adhabu ya agano
  choice: Kuonyesha kuongezeka kwa hukumu ya Mungu kwa kadiri ya dhambi za Israeli, bila kutaja namna maalumu ya pigo ambayo maandishi hayajaibainisha.
  alternative: 'Kutafsiri מַכָּה hasa kuwa ‘tauni,’ au kutafsiri כְּחַטֹּאתֵיכֶם kwa maana ya sababu tu: ‘kwa sababu ya dhambi zenu.’'
  rationale: Muktadha ni mfululizo wa masharti na adhabu za agano katika Walawi 26. Tafsiri inapaswa kuhifadhi onyo la hukumu inayoongezeka na kipengele cha ulinganifu, bila kuifanya hukumu kuwa tauni pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mtaenenda’ huhifadhi taswira ya mwenendo wa maisha iliyo katika Kiebrania; ‘hamtaki kunisikiliza’ ni ya moja kwa moja na ya kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
