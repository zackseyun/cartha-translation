  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: sw
  text: Nami nitawatawanya kati ya mataifa, nami nitauchomoa upanga na kuwafuatilia[a]. Nchi yenu itakuwa ukiwa, na miji yenu itakuwa magofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “nitauchomoa upanga nyuma yenu.”
    reason: Ufafanuzi wa usemi wa Kiebrania ambao kwa muktadha una maana ya kuwafuatilia kwa upanga uliochomolewa.
lexical_decisions:
- source_word: אֱזָרֶה
  choice: nitawatawanya
  rationale: Kitenzi זרה katika kausativi humaanisha kutawanya au kusambaza. “Nitawatawanya” ni Kiswahili cha kawaida na huhifadhi picha ya hukumu ya agano.
- source_word: בַגּוֹיִם
  choice: kati ya mataifa
  rationale: גּוֹיִם hapa ni mataifa ya kigeni ambako watu wangetawanywa; “mataifa” huepuka kuingiza maana za baadaye za kidini.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: nitauchomoa upanga
  rationale: Muundo huu ni nahau ya kuchomoa upanga kwa shambulio. “Nitauchomoa upanga” huhifadhi picha halisi ya kijeshi kwa Kiswahili cha asili.
- source_word: אַחֲרֵיכֶם
  choice: na kuwafuatilia
  rationale: Neno hilo kimsingi ni “baada yenu/nyuma yenu,” lakini katika muktadha huu linaonyesha ufuatiliaji wa adui. Kauli hii huwasilisha maana hiyo kwa uwazi bila kuondoa taswira ya upanga.
- source_word: שְׁמָמָה
  choice: ukiwa
  rationale: Nomino hii inaonyesha hali ya kuachwa tupu na kuharibiwa. “Ukiwa” ni neno la kawaida, lenye uzito unaofaa kwa laana ya agano.
- source_word: חָרְבָּה
  choice: magofu
  rationale: Kwa kurejelea miji, “magofu” huonyesha kwa kawaida matokeo ya uharibifu mkubwa.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: itakuwa ... itakuwa
  rationale: Vitenzi vya היה hapa vinaonyesha hali itakayotokea kama matokeo ya hukumu; “itakuwa” hudumisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Lugha ya hukumu ya agano inayohusu kutawanywa na kufuatiliwa kwa upanga
  choice: 'Kudumisha utendaji wa Mungu katika nafsi ya kwanza: “nitawatawanya ... nitauchomoa”'
  alternative: Kutumia kauli tendwa au isiyoonyesha mtendaji ili kupunguza ukali wa utendaji wa Mungu
  rationale: Kiebrania kinamtaja Mungu moja kwa moja kuwa mtendaji wa hukumu hizi za agano. Tafsiri haipaswi kupunguza uzito huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unabaki karibu na urudiaji na usawazishaji wa Kiebrania, huku “na kuwafuatilia” ukitoa maana ya nahau kwa uwazi. Alama ya tanbihi imewekwa kwenye usemi wa upanga unaohusika, si baada ya “mataifa.”
