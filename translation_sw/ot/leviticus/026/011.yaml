lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: makao yangu
  rationale: Neno hili humaanisha mahali pa Mungu pa kukaa, na katika muktadha huu linadokeza maskani yake kati ya watu bila kulazimisha jengo pekee.
- source_word: בְּתוֹכְכֶם
  choice: katikati yenu
  rationale: Huwasilisha kwa kawaida wazo la uwepo wa Mungu miongoni mwa jumuiya.
- source_word: תִגְעַל
  choice: sitawachukia kabisa
  rationale: Kitenzi kina maana yenye nguvu ya kuchukia, kukataa kwa kinyaa, au kutupilia mbali; “kabisa” husaidia kuonyesha uzito wake katika Kiswahili cha kawaida.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Kirai hiki kimehifadhiwa katika tanbihi kwa sababu Kiebrania kinataja wazi nafsi ya Mungu, ingawa katika Kiswahili cha kawaida kinaweza kufanya sentensi kuu isikike isivyo asili.
theological_decisions:
- issue: Kutajwa kwa “nafsi yangu” kuhusu Mungu
  choice: Kutoa maana yake kwa “nami sitawachukia kabisa,” huku tanbihi ikihifadhi muundo wa Kiebrania
  alternative: “Nafsi yangu haitawachukia”
  rationale: Kiebrania kina נַפְשִׁי, lakini kirai hicho hutenda kazi kama njia ya kusisitiza mhusika mwenyewe. Uamuzi huu hauondoi ushahidi wa chanzo, kwa kuwa umerekodiwa katika tanbihi, na unaepuka Kiswahili kisicho cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. “Makao” linaepuka kuifanya מִשְׁכָּן kuwa jengo tu, na tanbihi huhifadhi tamko la Kiebrania kuhusu “nafsi yangu.”
