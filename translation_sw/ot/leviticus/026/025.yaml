  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na maana ya Kiebrania: Mungu analeta upanga dhidi yao, wanaikusanywa mijini mwao, anatuma tauni miongoni mwao, na wanatiwa chini ya mamlaka ya adui. “Unaotekeleza kisasi cha agano” ni uwasilishaji unaokubalika wa נֹקֶמֶת נְקַם בְּרִית, unaohifadhi uhusiano wa hukumu na agano bila kulazimisha ufafanuzi mmoja wa kisarufi.'
  naturalness: Kiswahili ni sanifu, cha asili, na kina sajili inayofaa maandiko. “Nami nitaleta dhidi yenu,” “mtakusanywa ndani ya miji yenu,” “tauni miongoni mwenu,” na “mtatiwa mikononi mwa adui” ni miundo iliyo wazi na ya kawaida. Mnyambuliko wa sentensi unaakisi mpangilio wa hukumu katika chanzo bila kuwa mgumu kusoma.
