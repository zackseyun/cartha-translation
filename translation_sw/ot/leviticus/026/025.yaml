id: LEV.26.25
reference: Leviticus 26:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: sw
  text: Nami nitaleta dhidi yenu upanga unaotekeleza kisasi cha agano[a], nanyi mtakusanywa ndani ya miji yenu. Kisha nitatuma tauni miongoni mwenu, nanyi mtatiwa mikononi mwa adui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unaolipiza kisasi kwa ajili ya agano,” “unaotekeleza kisasi cha agano,” au kwa ulaini zaidi, “unaolipiza kisasi cha agano.” Kiebrania kwa neno kwa neno ni “upanga unaolipiza kisasi cha kisasi cha agano,” usemi wa msisitizo unaounganisha upanga na hukumu ya agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם
  choice: Nami nitaleta dhidi yenu
  rationale: Hifili ya בוא inaonyesha Mungu akisababisha upanga uwajie; ‘dhidi yenu’ huonyesha wazi mwelekeo wa hukumu ya uadui.
- source_word: חֶרֶב
  choice: upanga
  rationale: Neno hili linaweza kumaanisha upanga halisi na, kwa metonimia, vita; hapa taswira ya chombo cha hukumu imehifadhiwa.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: unaotekeleza kisasi cha agano
  rationale: Kirai cha Kiebrania kinatumia kitenzi na nomino zenye mzizi mmoja kwa msisitizo. Kiswahili hiki ni cha asili zaidi kuliko kurudia ‘kulipiza kisasi cha kisasi,’ huku kikihifadhi uhusiano wa hukumu na agano.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: nanyi mtakusanywa ndani ya miji yenu
  rationale: Nifali ya אסף imehifadhiwa kama kauli tendwa; ‘ndani ya’ huonyesha kukusanyika mijini kwa sababu ya shinikizo la vita au kuzingirwa.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: Kisha nitatuma tauni miongoni mwenu
  rationale: דֶבֶר katika laana za agano ni ugonjwa wa mlipuko wenye kuua; ‘tauni’ ni neno la kawaida, zito, na linalofaa sajili ya kibiblia.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: nanyi mtatiwa mikononi mwa adui
  rationale: Kauli tendwa ya נתן na nahau ‘katika mkono wa’ huonyesha kutiwa chini ya mamlaka ya adui. Wingi ‘mikononi’ ni nahau ya asili katika Kiswahili bila kubadili maana.
theological_decisions:
- issue: Maana ya ‘kisasi cha agano’
  choice: Kirai kimehifadhiwa kuwa ‘kisasi cha agano,’ kikielekeza kwenye hukumu inayotekelezwa kwa msingi wa agano lililovunjwa.
  alternative: ‘kulipiza kisasi kwa ajili ya agano’ au ‘kutekeleza adhabu za agano’
  rationale: Muundo wa Kiebrania unaweza kubeba vivuli hivi vinavyokaribiana. Kutobainisha zaidi kunahifadhi utata halisi na uhusiano wa kitheolojia kati ya agano na hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kauli tendwa na taswira za ‘upanga’ na ‘mikono ya adui’ zimehifadhiwa; ‘tauni’ imetumiwa badala ya neno la kizamani zaidi.
