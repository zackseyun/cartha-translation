  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: sw
  text: Mimi mwenyewe nitaifanya nchi kuwa ukiwa, na adui zenu wanaoishi humo wataishangaa kwa hofu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watastaajabishwa nayo” au “wataingiwa na hofu kwa sababu yake.” Kitenzi cha Kiebrania kinaweza kueleza mshangao wenye hofu unaosababishwa na kuona uharibifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: nitaifanya ... kuwa ukiwa
  rationale: Kitenzi katika muundo wa kusababisha kina maana ya kuifanya nchi iwe ukiwa; usemi huu ni wa kawaida na unahifadhi nguvu hiyo.
- source_word: אֲנִי
  choice: Mimi mwenyewe
  rationale: Kiwakilishi huru kinasisitiza kwamba Bwana ndiye binafsi atakayetekeleza hukumu hii.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa laana za agano, neno hili linaelekeza kwenye nchi ya Israeli/Kanaani, si dunia yote.
- source_word: וְשָׁמְמוּ
  choice: wataishangaa kwa hofu
  rationale: Kwa kuwa adui ndio kiima, kitenzi kinaonyesha mshangao wenye hofu unaotokana na kuona ukiwa wa nchi, badala ya wao wenyewe kufanywa ukiwa.
- source_word: עָלֶיהָ
  choice: wataishangaa
  rationale: Kihusishi kinaonyesha kitu au sababu ya mshangao huo; katika Kiswahili uhusiano huo huwasilishwa kiasili kupitia kiambishi cha yambwa -i- kinachorejelea nchi.
- source_word: אֹיְבֵיכֶם
  choice: adui zenu
  rationale: Hili ni tamko la moja kwa moja la nomino pamoja na umilikaji wa nafsi ya pili wingi.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: watakaoishi humo
  rationale: Kishiriki kinaeleza adui wanaokaa au kuishi nchini baada ya ukiwa wake; 'kuishi humo' ni Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Rejeo la הָאָרֶץ katika muktadha wa hukumu ya agano
  choice: nchi (ya Israeli/Kanaani katika muktadha)
  alternative: dunia
  rationale: Muktadha wa karibu unahusu laana za agano zinazoipata nchi ya Israeli; 'nchi' huepuka kuifanya hukumu hii ihusu dunia yote bila msingi katika maandishi.
- issue: Maana ya וְשָׁמְמוּ kuhusu adui
  choice: wataishangaa kwa hofu
  alternative: watakuwa ukiwa
  rationale: Kiima ni adui wanaoishi nchini; maana ya mwitikio wa mshangao wenye hofu inafaa zaidi, huku tanbihi ikihifadhi upana wa maana ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha kiunganishi cha Kiebrania ‘na’ bila kuongeza wazo lisilo wazi la kusudi au matokeo.
