base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: sw
  text: Watajikwaa wao kwa wao[a] kana kwamba wako mbele ya upanga, ingawa hakuna anayewafuatilia; nanyi hamtakuwa na uwezo wa kusimama mbele ya adui zenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mtu dhidi ya ndugu yake”; hapa ni msemo unaoonyesha kwamba watagongana au kujikwaa wao kwa wao kwa hofu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hamtakuwa na msimamo mbele ya adui zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: watajikwaa
  rationale: Kitenzi כשל huonyesha kujikwaa au kuyumba; “watajikwaa” kinahifadhi taswira halisi na kinafaa katika muktadha wa hofu.
- source_word: אִישׁ בְּאָחִיו
  choice: wao kwa wao
  rationale: Kirai hiki ni, kihalisi, “mtu dhidi ya ndugu yake,” lakini hapa kinaeleza watu kugongana au kujikwaa mmoja kwa mwingine kwa hofu. “Wao kwa wao” huwasilisha maana ya kutendeana kwa Kiswahili cha kawaida.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: kana kwamba wanaukimbia upanga
  rationale: Muundo כְּמִפְּנֵי una maana ya kulinganisha hali ya kuwa au kuondoka mbele ya upanga. Katika muktadha wa hofu, “wanaukimbia upanga” hufanya mwendo unaodokezwa uwe wazi bila kubadili taswira.
- source_word: וְרֹדֵף אָיִן
  choice: ingawa hakuna anayewafuatilia
  rationale: 'Kihalisi hakuna mfuatiliaji. “Ingawa” huonyesha tofauti iliyokusudiwa: wanatenda kama wanaofukuzwa wakati hakuna anayewafuatilia.'
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: hamtakuwa na uwezo wa kusimama
  rationale: תְּקוּמָה linaweza kumaanisha kusimama, hali ya kusimama, au uwezo wa kustahimili. Tafsiri hii huhifadhi taswira ya kusimama na maana ya kutoweza kuwazuia maadui.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: mbele ya adui zenu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya לפני katika muktadha wa kukabiliana na maadui.
