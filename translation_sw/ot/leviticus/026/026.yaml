base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: sw
  text: Nitakapovunja tegemeo lenu la mkate[a], wanawake kumi wataoka mkate wenu katika tanuru moja, nao watawarudishia mkate wenu kwa vipimo vya uzito. Mtakula, lakini hamtashiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “fimbo ya mkate,” nahau inayomaanisha tegemeo au akiba ya mkate inayodumisha maisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: Nitakapovunja
  rationale: Infinitivo yenye בְּ huunda kishazi cha wakati. ‘Nitakapovunja’ huhifadhi picha hai ya hukumu bila kudokeza kuvunjwa halisi kwa fimbo.
- source_word: מַטֵּה לֶחֶם
  choice: tegemeo lenu la mkate
  rationale: Nahau hii, kihalisi ‘fimbo ya mkate,’ humaanisha mkate kama tegemeo la maisha. Tafsiri hii huhifadhi taswira ya tegemeo na kutaja mkate wazi.
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: wanawake kumi wataoka
  rationale: Huhifadhi wazi idadi na wanawake waliotajwa katika Kiebrania, huku wakati ujao ukiendeleza matokeo ya hukumu.
- source_word: לַחְמְכֶם
  choice: mikate yenu
  rationale: Katika muktadha wa kuoka na kurudisha mgao, wingi wa Kiswahili ‘mikate’ ni wa kawaida na huonyesha mikate iliyookwa kwa ajili ya watu.
- source_word: בְּתַנּוּר אֶחָד
  choice: katika tanuru moja
  rationale: 'Huhifadhi msisitizo wa uhaba: wanawake kumi wanatosheka kutumia tanuru moja.'
- source_word: וְהֵשִׁיבוּ
  choice: nao watawarudishia
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi au kukirudisha. Kiambishi ‘-wa-’ huonyesha kuwa mikate inarudishwa kwa walioandikiwa.
- source_word: בַּמִּשְׁקָל
  choice: kwa kupimwa uzito
  rationale: Huonyesha kwamba mkate utagawiwa kwa mgao uliopimwa kwa sababu ya uhaba.
- source_word: וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ
  choice: Mtakula, lakini hamtashiba
  rationale: ‘Kushiba’ ni neno la kawaida na mahususi kwa kutoshelezeka kwa chakula, na kiunganishi ‘lakini’ huonyesha tofauti iliyomo katika kifungu.
