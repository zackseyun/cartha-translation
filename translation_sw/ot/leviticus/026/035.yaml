base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: sw
  text: Katika siku zote za ukiwa wake, nchi itapumzika—pumziko ambalo haikupata wakati wa Sabato zenu[b][a], mlipokuwa mkiishi humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “itapumzika kwa ajili ya kile ambacho haikupumzika wakati wa Sabato zenu.” Kiebrania kinarudia kitenzi “kupumzika” kwa kusisitiza.
    reason: lexical_alternative
  - marker: b
    text: “Sabato zenu” hapa inahusu mapumziko ya Sabato yaliyostahili nchi, hasa miaka ya Sabato inayozungumziwa katika muktadha huu.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: Siku zote ambazo nchi itakuwa ukiwa
  rationale: Kirai hiki kinaonyesha kipindi chote cha ukiwa. Nchi imetajwa wazi kwa kuwa kiambishi cha kike katika Kiebrania kinairejelea, na Kiswahili cha kawaida huhitaji rejeo hilo liwe wazi.
- source_word: תִּשְׁבֹּת
  choice: itapumzika
  rationale: Kitenzi שׁבת kinamaanisha kupumzika au kuacha shughuli; hapa kinaihusu nchi na kinaendeleza mada ya pumziko la Sabato.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: yaani, itapata pumziko ambalo haikupata
  rationale: Muundo wa Kiebrania ni mgumu ukitafsiriwa neno kwa neno. Tafsiri hii inaweka wazi pumziko lililokosekana huku ikihifadhi urudiaji wa wazo la 'kupumzika'.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: wakati wa Sabato zenu
  rationale: Inahifadhi usemi wa asili bila kuufanya moja kwa moja kuwa 'miaka ya Sabato'; muktadha unaonyesha kuwa ni mapumziko ya Sabato yaliyopasa nchi.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: mlipokuwa mkiishi humo
  rationale: Infinitivu ya ישׁב inaonyesha kipindi ambacho watu walikaa katika nchi. 'Humo' ni Kiswahili cha kawaida kwa kuishi ndani ya nchi hiyo.
theological_decisions:
- issue: Maana ya “Sabato zenu”
  choice: Usemi wa Kiebrania umehifadhiwa katika matini, huku tanbihi ikieleza kuwa unahusu mapumziko yaliyostahili nchi.
  alternative: miaka yenu ya Sabato
  rationale: Muktadha wa Walawi 26:34 unaelekeza hasa kwenye mapumziko ya nchi, lakini neno lenyewe ni pana kuliko usemi wa moja kwa moja 'miaka ya Sabato'; hivyo tafsiri haifungi maana kupita ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa msomaji wa kawaida, lakini urudiaji wa wazo la pumziko na usemi “Sabato zenu” vimehifadhiwa. Alama za tanbihi [b][a] zimewekwa mara tu baada ya kirai kinachohusika, kwa kufuata mpangilio wa matini ya mashauriano.
