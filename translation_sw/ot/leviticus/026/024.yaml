  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: sw
  text: Basi mimi pia nitakwenda kinyume nanyi[a], nami mwenyewe nitawapiga mara saba[b] kwa sababu ya dhambi zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uadui dhidi yenu” au “katika upinzani nanyi.” Neno la Kiebrania linalotafsiriwa “kinyume” linarudiwa katika Walawi 26 kueleza upinzani wa kujibizana kati ya Israeli na BWANA.
    reason: lexical_alternative
  - marker: b
    text: Kauli “mara saba” inaweza pia kueleweka kuwa adhabu iliyoongezwa kwa kiwango cha mara saba, si lazima mapigo saba tofauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: Basi ... nitakwenda
  rationale: Kitenzi הלך kimsingi humaanisha ‘kwenda’ au ‘kutembea.’ ‘Nitakwenda’ kinahifadhi taswira inayorudiwa katika sura hii, huku ‘basi’ kikionyesha hatua inayofuata katika mfululizo wa maonyo.
- source_word: אַף אֲנִי
  choice: mimi pia
  rationale: Maneno haya yanasisitiza kwamba BWANA naye atajibu kwa namna inayolingana na msimamo wa watu.
- source_word: עִמָּכֶם בְּקֶרִי
  choice: kinyume nanyi
  rationale: Ingawa עִמָּכֶם ni ‘pamoja nanyi,’ katika muundo huu wa Kiswahili ‘kinyume nanyi’ huwasilisha kwa kawaida wazo la upinzani lililomo katika neno kuu קרי.
- source_word: וְהִכֵּיתִי אֶתְכֶם
  choice: nami ... nitawapiga
  rationale: נכה humaanisha ‘kupiga.’ Tafsiri hii ni ya moja kwa moja, ya kisasa, na inadumisha nguvu ya tendo la hukumu.
- source_word: גַּם אָ֔נִי
  choice: mimi mwenyewe
  rationale: Kauli ya pili ya kujisisitiza inaonyesha kwamba Mungu ndiye atakayetekeleza tendo hili moja kwa moja.
- source_word: שֶׁבַע
  choice: mara saba
  rationale: ‘Mara saba’ hudumisha namba na nguvu ya usemi wa Kiebrania bila kuamua kimya kimya kama ni hesabu halisi ya mapigo au kiwango kilichoongezwa sana.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: kwa sababu ya dhambi zenu
  rationale: Hapa עַל huonyesha msingi au sababu ya hukumu; ‘kwa sababu ya’ huwasilisha uhusiano huo wazi katika Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya usemi wa agano בְּקֶרִי unaotumiwa kwa watu na kwa Mungu kwa namna ya kujibizana
  choice: kinyume nanyi
  alternative: kwa uadui dhidi yenu; katika upinzani nanyi
  rationale: ‘Kinyume nanyi’ kinahifadhi wazo la upinzani na uhusiano wa kujibizana katika Walawi 26 bila kulifafanua tu kuwa hisia ya uadui.
- issue: Kiwango cha uhalisi katika kauli ya hukumu שֶׁבַע
  choice: mara saba
  alternative: kwa kiwango kilichozidishwa mara saba
  rationale: Tafsiri inadumisha uzito wa onyo na uwezekano wa usemi wa kuzidisha adhabu, bila kulazimisha uelewa wa kihesabu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Nitakwenda kinyume nanyi’ imechaguliwa ili kuhifadhi taswira ya הלך na neno kuu linalorudiwa katika sura hii, bila kutumia ‘nitaenenda,’ ambalo linaweza kusikika la kale zaidi.
