  - marker: b
    text: Au, “na hivyo kulikiuka agano langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: sheria zangu
  rationale: “Sheria” ni neno la kawaida na lenye hadhi kwa masharti yaliyowekwa; katika muktadha huu linatofautishwa na “hukumu” na “amri” zinazofuata.
- source_word: תִּמְאָסוּ
  choice: mtazikataa
  rationale: Kitenzi hiki huonyesha kukataa kwa dharau; “kataa” ni cha sasa na wazi bila kuongeza maelezo yasiyosemwa.
- source_word: מִשְׁפָּטַי
  choice: hukumu zangu
  rationale: “Hukumu” huhifadhi maana ya maamuzi au masharti ya kisheria na kutofautisha neno hili na חֻקִּים.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: nafsi zenu zitachukia
  rationale: Tafsiri hii inadumisha nafsi kama kiima cha Kiebrania na uzito wa kitendo cha kuchukia sana.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: hata msitimize
  rationale: “Hata” hapa huonyesha matokeo ya kukataa na kuchukia, huku “timiz(a)” ikiwa ya kawaida kwa kutekeleza maagizo.
- source_word: כָּל מִצְוֺתַי
  choice: amri zangu zote
  rationale: “Amri” ni tafsiri ya moja kwa moja na ya kawaida ya מִצְוֹת katika muktadha wa agano.
- source_word: לְהַפְרְכֶם
  choice: na hivyo kulivunja
  rationale: Usemi huu unaonyesha matokeo ya kutotii, yaani kuvunja au kukiuka agano.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: “Agano” ndilo neno sanifu la Kiswahili kwa uhusiano rasmi wa בְּרִית.
theological_decisions:
- issue: Kudumisha neno la kianthropolojia נֶפֶשׁ katika nahau
  choice: nafsi zenu zitachukia
  alternative: mtazichukia kabisa; utu wenu wote utazichukia
  rationale: Kiebrania kinataja נֶפֶשׁ waziwazi kama kiima. “Nafsi zenu” huhifadhi picha hiyo bila kulazimisha fundisho maalumu kuhusu muundo wa mwanadamu.
- issue: Kutofautisha istilahi za sheria ya agano
  choice: sheria / hukumu / amri / agano
  alternative: masharti / kanuni / maagizo / agano
  rationale: Mtiririko wa maneno tofauti katika Kiebrania umehifadhiwa kadiri Kiswahili cha kawaida kinavyoruhusu, badala ya kuyafanya yote kuwa visawe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti unaendelezwa kutoka mstari uliotangulia, na istilahi tofauti za kisheria zimehifadhiwa.
