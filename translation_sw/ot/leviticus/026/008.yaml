base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: sw
  text: Watano kati yenu watawafukuza mia moja[a], na mia moja kati yenu watawafukuza elfu kumi[b], na adui zenu wataanguka mbele yenu kwa upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watawafuatilia”; vivyo hivyo katika kishazi kinachofuata.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania רְבָבָה linaweza kumaanisha “elfu kumi” au “makumi elfu”; hapa “elfu kumi” inafaa ulinganifu wa namba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: watawafukuza
  rationale: Kitenzi רדף humaanisha kufukuza au kufuatilia. Katika muktadha huu wa kijeshi, “kuwafukuza” ni Kiswahili cha kawaida na hudokeza adui wanaokimbizwa vitani.
- source_word: מִכֶּם
  choice: kati yenu
  rationale: 'Kihusishi מן pamoja na kiambishi hapa kina maana ya sehemu ya kundi: watano au mia moja kati yenu.'
- source_word: חֲמִשָּׁה מֵאָה
  choice: Watano kati yenu watawafukuza mia moja
  rationale: Huhifadhi idadi zilizo wazi katika Kiebrania na uhusiano wa kundi dogo kuwafukuza wengi.
- source_word: וּמֵאָה מִכֶּם רְבָבָה יִרְדֹּפוּ
  choice: na mia moja kati yenu watawafukuza elfu kumi
  rationale: Muundo huu huhifadhi ongezeko la uwiano wa ushindi katika sentensi sambamba.
- source_word: רְבָבָה
  choice: elfu kumi
  rationale: Neno hili linaweza kumaanisha elfu kumi au umati mkubwa sana; idadi maalumu “elfu kumi” inafaa mfuatano wa namba hapa.
- source_word: וְנָפְלוּ
  choice: wataanguka
  rationale: Huhifadhi taswira halisi ya נפל, ambayo katika muktadha wa vita inaonyesha kushindwa au kuuawa.
- source_word: אֹיְבֵיכֶם
  choice: adui zenu
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida katika muktadha wa vita.
- source_word: לִפְנֵיכֶם
  choice: mbele yenu
  rationale: Huhifadhi nahau ya Kiebrania ya adui kuanguka mbele ya washindi.
- source_word: לֶחָרֶב
  choice: kwa upanga
  rationale: Hueleza chombo cha kuanguka kwao na kuhifadhi taswira ya kijeshi ya maandishi ya chanzo.
theological_decisions:
- issue: 'Ahadi ya kijeshi ya baraka za agano: lugha ya kutia chumvi au ahadi halisi'
  choice: Kuhifadhi ahadi ya moja kwa moja ya ushindi mkubwa wa kijeshi bila kuipunguza kuwa wazo la jumla.
  alternative: Kuitafsiri kama faraja ya jumla badala ya baraka maalumu ya agano.
  rationale: Mstari huu uko katika baraka za agano za Mambo ya Walawi 26. Tafsiri inapaswa kuacha wazi uzito na mvutano wa ahadi yake ya kijeshi bila kuamua kimafundisho ikiwa idadi hizo ni za kihalisi au za balagha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kati yenu” huonyesha maana ya sehemu ya kundi; “watawafukuza” ni ya kawaida katika muktadha wa kuwafanya maadui wakimbie. Alama zote za tanbihi zimewekwa katika matini.
