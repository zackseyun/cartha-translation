base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: sw
  text: Nitauelekeza uso wangu dhidi yenu[a], nanyi mtapigwa[b] mbele ya adui zenu. Wale wanaowachukia watawatawala, nanyi mtakimbia wakati hakuna mtu anayewafukuza.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kuelekeza uso dhidi ya” ni nahau inayomaanisha kuamua kumpinga mtu kwa hukumu.
    reason: cultural_note
  - marker: b
    text: Au, “mtashindwa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ingawa hakuna mtu anayewafukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: Nitaweka uso wangu dhidi yenu
  rationale: Huhifadhi taswira ya Kiebrania ya uso wa Mungu huku neno “dhidi” likiweka wazi kuwa ni msimamo thabiti wa upinzani na hukumu.
- source_word: וְנִגַּפְתֶּם
  choice: mtapigwa
  rationale: Kauli ya kutendwa hapa inaonyesha kupigwa au kushindwa vitani. “Mtapigwa” ni ya moja kwa moja, yenye nguvu, na ya kawaida katika Kiswahili; “mtashindwa” ni tafsiri mbadala inayowezekana.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: mbele ya adui zenu
  rationale: Huwasilisha kwa usahihi maana ya kuanguka au kushindwa mbele ya maadui.
- source_word: וְרָדוּ בָכֶם
  choice: watawatawala
  rationale: Kitenzi רדה humaanisha kutawala au kuwa na mamlaka juu ya wengine. Chaguo hili linaonyesha kutiishwa bila kuongeza ukatili ambao kifungu hiki hakitaji waziwazi.
- source_word: שֹׂנְאֵיכֶם
  choice: wale wanaowachukia
  rationale: Huhifadhi tofauti ya kileksia kati ya watu wanaowachukia na “adui zenu” iliyotajwa awali.
- source_word: וְנַסְתֶּם
  choice: mtakimbia
  rationale: Ni tafsiri ya kawaida na ya asili ya נוס katika muktadha wa hofu na vita.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: wakati hakuna mtu anayewafukuza
  rationale: 'Huonyesha kwamba watakimbia kwa hofu bila kuwa na mfukuzaji halisi, huku tanbihi ikihifadhi uwezekano wa kusoma uhusiano huo kama wa kukinzana: “ingawa.”'
theological_decisions:
- issue: Lugha ya Mungu yenye taswira ya kibinadamu katika hukumu
  choice: Kuhifadhi nahau “Nitaweka uso wangu dhidi yenu”
  alternative: Nitawapinga
  rationale: Taswira ya uso hudumisha uzito wa kibinafsi na wa kiagano wa Mungu kuwageukia watu wake kwa hukumu, badala ya kuifanya kuwa kauli ya jumla tu ya upinzani.
- issue: Aina ya mamlaka ya wale wanaowachukia Israeli
  choice: watawatawala
  alternative: watawakandamiza
  rationale: Andiko linasema watakuwa chini ya utawala wao, lakini halielezi wazi katika kifungu hiki kiwango cha ukatili; kwa hiyo tafsiri haiongezi maana isiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Taswira kuu ya Kiebrania imehifadhiwa na kufafanuliwa kwa tanbihi; sentensi nyingine zimetolewa kwa mpangilio wa asili wa Kiswahili.
