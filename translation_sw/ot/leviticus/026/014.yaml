  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: sw
  text: Lakini msiponisikiliza[a] na msipotekeleza amri hizi zote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msiponitii.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikiliza kwa utii, ingawa matini kuu imehifadhi usemi wa moja kwa moja zaidi, “msiponisikiliza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini msipo-
  rationale: Muktadha unalinganisha sharti hili hasi na baraka zilizotangulia; “lakini” huonyesha utofauti huo, na muundo wa -sipo- huwasilisha sharti la אִם pamoja na ukanushaji.
- source_word: תִשְׁמְעוּ לִי
  choice: nisikiliza
  rationale: שׁמע pamoja na ל inaweza kumaanisha kusikiliza kwa utii. “Nisikiliza” huhifadhi picha ya msingi ya kusikia kwa makini bila kuifupisha moja kwa moja kuwa “nitii,” huku kishazi kinachofuata kikieleza utekelezaji.
- source_word: וְלֹא תַעֲשׂוּ
  choice: na msipotekeleza
  rationale: Kitenzi עשה katika muktadha wa sheria kina maana ya kufanya au kutimiza. “Kutekeleza” ni Kiswahili cha kawaida na cha heshima kinachoonyesha kuweka amri katika matendo.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: amri hizi zote
  rationale: “Amri” huwasilisha מִצְוֺת kwa lugha ya kisheria ya agano; mpangilio “amri hizi zote” ni wa asili katika Kiswahili na huhifadhi כָּל pamoja na demonstrativi הָאֵלֶּה.
theological_decisions:
- issue: Iwapo שׁמע ל itafsiriwe kuwa “kunisikiliza” au kwa maana iliyofasiriwa zaidi, “kunitii”
  choice: nisikiliza
  alternative: nitii
  rationale: Kiebrania kinazungumzia kumsikiliza Mungu, kisha kinataja kando kutotekeleza amri. “Nisikiliza” huhifadhi utofauti huo na mvutano kati ya kusikia na kutenda, huku tanbihi ikionyesha maana ya utii iliyomo katika kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa wingi “msipo-” unaendana na wahusika wa wingi katika Kiebrania. Koma ya mwisho imehifadhiwa kwa sababu mstari huu ni mwanzo wa sentensi-sharti inayoendelea katika mistari inayofuata.
