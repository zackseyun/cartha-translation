  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: sw
  text: Mtawafuatia adui zenu, nao wataanguka mbele yenu kwa upanga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: Mtawafuatilia
  rationale: Kitenzi רדף humaanisha kufuatilia au kukimbiza. “Kufuatilia” ni Kiswahili cha kawaida kinachohifadhi maana ya kijeshi bila kuongeza wazo lisilokuwamo katika matini.
- source_word: אֹיְבֵיכֶם
  choice: adui zenu
  rationale: Nomino אויב ni neno la kawaida kwa “adui,” na kiambishi cha nafsi ya pili wingi kimewakilishwa kwa “zenu.”
- source_word: וְנָפְלוּ
  choice: nao wataanguka
  rationale: נפל maana yake ya msingi ni “kuanguka.” Katika vita inaweza kudokeza kushindwa au kuuawa, lakini “wataanguka” huhifadhi taswira na uwezekano huo wa maana.
- source_word: לִפְנֵיכֶם
  choice: mbele yenu
  rationale: לפני pamoja na kiambishi chake humaanisha “mbele ya” au “katika uwepo wa.” “Mbele yenu” ni usemi wa kawaida na wazi katika muktadha huu.
- source_word: לֶחָרֶב
  choice: kwa upanga
  rationale: Katika muktadha wa vita, ל pamoja na חרב inaweza kuonyesha chombo au matokeo. “Kwa upanga” ni usemi wa asili wa Kiswahili unaohifadhi picha ya kuuawa au kushindwa kwa silaha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo wa sentensi umehifadhi usambamba na taswira ya kijeshi ya Kiebrania. Hakuna tanbihi iliyoongezwa kwa kuwa “kwa upanga” ni usemi wazi wa Kiswahili na mbadala wa moja kwa moja “kwa ajili ya upanga” au “kwenda kwa upanga” haungekuwa wa kawaida.
