  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: sw
  text: Nanyi mtaangamia miongoni mwa mataifa, na nchi ya adui zenu itawala[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itawameza.” Kitenzi cha Kiebrania kihalisi ni “kula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: mtaangamia
  rationale: 'Kitenzi אבד katika Qal hapa kinaeleza matokeo ya laana ya agano: kuangamia au kupotea. “Mtaangamia” ni Kiswahili cha kawaida na chenye uzito, bila kufafanua kupita kiasi namna ya maangamizi.'
- source_word: בַּגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: גּוֹיִם humaanisha mataifa au makundi ya watu. “Miongoni mwa mataifa” linafaa katika muktadha wa kutawanywa uhamishoni, bila kuingiza maana ya baadaye ya kidini ya “Wamataifa.”
- source_word: וְאָכְלָה
  choice: itawala
  rationale: אכל maana yake ya msingi ni kula. Kwa kuwa nchi ndiyo kiima, “itawala” linadumisha taswira kali ya nchi kuwameza au kuwaangamiza walioko uhamishoni.
- source_word: אֶתְכֶם
  choice: -wa- (katika “itawala”)
  rationale: Kiambishi cha yambwa cha nafsi ya pili wingi kinawakilishwa kiasili ndani ya kitenzi cha Kiswahili.
- source_word: אֶרֶץ
  choice: nchi
  rationale: אֶרֶץ hapa ni nchi wanakoishi maadui, si dunia kwa ujumla. “Nchi” ni chaguo la kawaida na mahususi katika muktadha huu.
- source_word: אֹיְבֵיכֶם
  choice: ya adui zenu
  rationale: Muundo huu unaonyesha nchi inayohusishwa na adui zao. “Adui zenu” ni tafsiri ya moja kwa moja na ya kawaida; umoja wa jumla “adui” pia unaendana na matumizi ya Kiswahili.
theological_decisions:
- issue: Nguvu ya sitiari ya nchi kuwateketeza walio uhamishoni
  choice: Kudumisha sitiari kwa kusema “nchi ya adui zenu itawala.”
  alternative: “Nchi ya adui zenu itawaangamiza.”
  rationale: Kiebrania kinatumia kitenzi cha kawaida “kula” huku nchi ikiwa kiima. Kudumisha taswira hiyo kunahifadhi ukali na muundo wa kifasihi wa laana bila kuongeza ufafanuzi wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtaangamia” na “miongoni mwa mataifa” ni wazi kwa wasomaji wa kawaida, huku “itawala” kikihifadhi sitiari halisi na nzito ya Kiebrania.
