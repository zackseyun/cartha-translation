id: LEV.26.1
reference: Leviticus 26:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: sw
  text: “Msijifanyie sanamu za miungu, wala msijisimamishie sanamu ya kuchongwa au jiwe lililosimamishwa; wala msiweke katika nchi yenu jiwe lenye mchoro[a] ili kulisujudia, kwa maana mimi ni Yahwe, Mungu wenu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jiwe lililochongwa” au “jiwe lenye mfano.” Maana kamili ya אֶבֶן מַשְׂכִּית haijulikani kwa hakika, lakini ni jiwe lililohusishwa na ibada iliyokatazwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: sanamu za miungu
  rationale: Neno hili humaanisha vitu vinavyoabudiwa kama miungu na mara nyingi lina dharau ya ubatili. ‘Sanamu za miungu’ ni wazi katika Kiswahili cha kawaida bila kuongeza maana hiyo ya dharau moja kwa moja.
- source_word: פֶסֶל
  choice: sanamu ya kuchongwa
  rationale: Huhusu mfano uliotengenezwa kwa kuchonga; tafsiri hii inadumisha maana yake halisi na kuitofautisha na istilahi nyingine za vitu vya ibada katika mstari huu.
- source_word: מַצֵּבָה
  choice: jiwe lililosimamishwa
  rationale: Ni jiwe au nguzo ya jiwe iliyosimamishwa wima. Tafsiri hii ni halisi na haiongezi waziwazi maana ya kidini ambayo muktadha unaidokeza.
- source_word: אֶבֶן מַשְׂכִּית
  choice: jiwe lenye mchoro
  rationale: Kirai hiki huenda kinamaanisha jiwe lenye sura, nakshi, au mchoro wa kuchongwa. Maana kamili inajadiliwa, hivyo tafsiri kuu ni ya kueleweka huku njia nyingine zikihifadhiwa katika tanbihi.
- source_word: תַעֲשׂוּ לָכֶם
  choice: msijifanyie
  rationale: Umbo hili linahifadhi nguvu ya ‘kujifanyia’ iliyo katika kiwakilishi cha manufaa לָכֶם na linaendana na mtindo wa amri ya kukataza.
- source_word: תָקִימוּ לָכֶם
  choice: msijisimamishie
  rationale: Kitenzi kinamaanisha kusimamisha au kuweka wima; umbo la Kiswahili linahifadhi pia maana ya ‘kwa ajili yenu wenyewe.’
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: msiweke katika nchi yenu
  rationale: ‘Kuweka’ ni tafsiri ya kawaida katika muktadha huu, na ‘katika nchi yenu’ inadumisha mazingira ya nchi ya agano bila kuyafinyaza kuwa mahali maalumu pa ibada.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: ili kulisujudia
  rationale: Kiswahili ‘kusujudia’ kinaonyesha kuinama chini mbele ya kitu kama tendo la heshima au ibada. ‘Ili’ inaweka wazi kusudi la kuwekwa kwa jiwe kama lilivyo katika infinitivu ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: ‘Yahwe’ ni namna ya kawaida ya Kiswahili ya kuandika jina la agano יהוה, badala ya kulibadilisha kuwa cheo ‘BWANA.’
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: kwa maana mimi ni Yahwe, Mungu wenu
  rationale: ‘Kwa maana’ linaonyesha msingi unaotolewa kwa amri, na kauli yote inadumisha fomula ya agano ya maandishi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi יהוה, hivyo limetoholewa badala ya kubadilishwa kuwa cheo. ‘Yahwe’ ndiyo tahajia inayotumika kwa kawaida katika Kiswahili.
- issue: Kutofautisha aina mbalimbali za vitu vya ibada vilivyokatazwa
  choice: sanamu za miungu; sanamu ya kuchongwa; jiwe lililosimamishwa; jiwe lenye mchoro
  alternative: Kuvitafsiri vyote kwa neno moja kama ‘sanamu’
  rationale: Kiebrania kinakusanya istilahi nne tofauti. Kuzitofautisha kunadumisha upekee wa msamiati na uzito wa kisheria bila kudai kwa uhakika zaidi ya ushahidi wa maneno yenyewe.
- issue: Kuelewa עָלֶיהָ katika kirai cha kusujudu
  choice: kulisujudia, yaani kuelekeza tendo kwa jiwe
  alternative: kusujudia juu yake
  rationale: Kihusishi kinaweza kuhusishwa na jiwe kama kitu kinachopewa heshima ya ibada; hilo linafaa zaidi katika muktadha, ingawa uwezekano wa mahali hauwezi kuondolewa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Miundo ‘msijifanyie’ na ‘msijisimamishie’ inadumisha urejeshi/manufaa wa Kiebrania. ‘Kusujudia’ hutoa maana ya tendo la kuinama kwa ibada kwa ufupi na kwa ufasaha.
