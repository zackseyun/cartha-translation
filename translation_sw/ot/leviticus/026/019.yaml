base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: sw
  text: Nami nitavunja kiburi cha nguvu zenu, na nitafanya mbingu zenu[a] kuwa kama chuma, na nchi yenu kuwa kama shaba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anga lenu.” Kiebrania kinasema “mbingu zenu,” umbo la wingi ambalo mara nyingi hutumiwa kurejelea anga lililo juu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha shaba au bronzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Nami nitavunja
  rationale: Kitenzi שׁבר humaanisha kuvunja au kusambaratisha. “Nitavunja” ni cha kawaida, chenye nguvu inayofaa, na hakiongezi ukali usio lazima.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: kiburi cha nguvu zenu
  rationale: גָּאוֹן inaweza kumaanisha kiburi, fahari, au utukufu, na עֹז ni nguvu au uwezo. Katika muktadha wa adhabu ya agano, “kiburi” linafaa, huku muundo “cha nguvu zenu” ukihifadhi uhusiano mfupi wa maneno ya Kiebrania bila kuufafanua kupita kiasi.
- source_word: וְנָתַתִּי
  choice: na nitafanya ... kuwa
  rationale: Ingawa נתן kwa kawaida ni “kutoa” au “kuweka,” hapa pamoja na tashbihi inaeleza kufanya vitu viwe kama kitu kingine. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: שְׁמֵיכֶם
  choice: mbingu zenu
  rationale: Neno la Kiebrania lina umbo la wingi na hapa linarejelea anga lililo juu ya nchi. “Mbingu zenu” huhifadhi umbo na hadhi ya lugha ya chanzo; “anga lenu” limetolewa kama uwezekano katika tanbihi.
- source_word: כַּבַּרְזֶל
  choice: kama chuma
  rationale: Tashbihi inaonyesha mbingu zilizo ngumu na zisizotoa mvua. “Kama chuma” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אַרְצְכֶם
  choice: nchi yenu
  rationale: אֶרֶץ inaweza kuwa nchi, ardhi, au dunia. Katika mazingira haya ya kilimo na agano, “nchi yenu” inajumuisha eneo na udongo unaoathiriwa na hukumu.
- source_word: כַּנְּחֻשָׁה
  choice: kama shaba
  rationale: נְחֻשָׁה linaweza kutaja shaba au metali ya shaba kama bronze. “Shaba” ni neno la kawaida na lenye picha ya ardhi ngumu; upana wa maana ya neno la chanzo umeelezwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya mfano katika picha ya laana
  choice: Kudumisha picha ya mbingu kuwa kama chuma na nchi kuwa kama shaba bila kueleza moja kwa moja kuwa ni ukame na utasa wa ardhi.
  alternative: Kufafanua katika matini kuu kwamba Mungu atazuia mvua na kuifanya ardhi isitoe mazao.
  rationale: Muktadha wa laana ya agano unaelekeza kwenye ukame na kushindwa kwa kilimo, lakini Kiebrania kinatumia tashbihi. Tafsiri inahifadhi picha hiyo na mvutano wake badala ya kuibadili kuwa maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo sambamba wa “mbingu ... kama chuma” na “nchi ... kama shaba” umehifadhiwa. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
