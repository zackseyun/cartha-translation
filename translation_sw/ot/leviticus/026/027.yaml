  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: sw
  text: Lakini ikiwa, licha ya hayo[a], hamtanisikiliza, na mtaenda kinyume nami[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na hayo” au “hata baada ya hayo.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mtaenda pamoja nami kwa ukinzani”; huu ni usemi unaomaanisha kuenenda katika upinzani dhidi ya Mungu au kwa uadui kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaendeleza masharti ya onyo la agano huku ikionyesha hatua nyingine inayokinzana na mwitikio uliotarajiwa; “lakini ikiwa” huwasilisha maana hizo zote mbili kwa Kiswahili cha kawaida.
- source_word: בְּזֹאת
  choice: licha ya hayo
  rationale: Katika muktadha huu maneno hayo yanarejelea hatua za adhabu zilizotangulia na yana maana ya kukubali kwamba hayo yametokea lakini hayakuleta mwitikio; si usemi wa mahali au chombo tu.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: hamtanisikiliza
  rationale: Kitenzi שׁמע pamoja na ל kinahusisha kusikia kwa kuitikia na kutii. “Hamtanُisikiliza” huhifadhi picha ya kusikia huku kikidokeza kutii bila kuifafanua kupita kiasi.
- source_word: וַהֲלַכְתֶּם
  choice: na mtaenda
  rationale: הלך hapa ni usemi unaohusu mwenendo. “Mtaenda” huhifadhi kwa kiasi picha ya kutembea au kwenda na, katika muundo huu, hueleweka kama kuendelea na mwenendo fulani.
- source_word: עִמִּי
  choice: nami
  rationale: Kwa neno moja moja ni “pamoja nami,” lakini likiunganishwa na בְּקֶרִי linaeleza uhusiano wa kupingana. “Kinyume nami” huwakilisha usemi mzima kwa Kiswahili cha asili.
- source_word: בְּקֶרִי
  choice: kinyume
  rationale: קֶרִי ni neno gumu linalorudiwa katika Walawi 26 na linaashiria mwenendo wa upinzani au uadui. “Kinyume” huhifadhi upana na mvutano wa neno hilo bila kulibana kuwa ukaidi au uadui pekee.
theological_decisions:
- issue: Usemi wa onyo la agano katika Walawi 26
  choice: Kuhifadhi usemi wa kimahusiano “mtaenda kinyume nami.”
  alternative: “mtanitendea kwa uadui” au “mtaendelea kutonitii.”
  rationale: 'Mstari unaeleza zaidi ya kutotii tu: unaonyesha msimamo wa upinzani katika uhusiano wa agano. Tafsiri iliyochaguliwa huhifadhi taswira ya kwenda na maana pana ya kupingana bila kuingiza ufafanuzi wa kimadhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kueleweka kwa wasomaji wa kawaida, huku ukihifadhi lugha ya kimahusiano na utata wa neno קֶרִי. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
