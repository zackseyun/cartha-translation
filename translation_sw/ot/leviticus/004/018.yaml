base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: sw
  text: Ataweka baadhi ya damu[a] juu ya pembe za madhabahu iliyo mbele ya Yahweh katika hema la kukutania, na damu yote ataimwaga kwenye msingi wa madhabahu ya sadaka ya kuteketezwa, iliyo penye mlango wa hema la kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka katika damu ataweka”; neno “baadhi” linaweka wazi maana ya sehemu ya damu, kwa kulinganisha na “damu yote” baadaye katika mstari huu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: baadhi ya damu hiyo
  rationale: Kiebrania husema kihalisi “na kutoka katika damu,” lakini maana ya sehemu fulani ya damu inaeleweka kwa kulinganishwa na “damu yote” baadaye. Kiswahili cha kawaida huhitaji maana hiyo ielezwe wazi.
- source_word: יִתֵּן
  choice: ataweka
  rationale: Kitenzi נתן kina maana ya kawaida ya kutoa au kuweka. Katika utaratibu huu wa dhabihu, “ataweka” ni sahihi na hakiongezi ufafanuzi wa kitaalamu usio katika matini.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: pembe za madhabahu
  rationale: Neno קרנות linamaanisha kihalisi “pembe”; istilahi hiyo ya madhabahu imehifadhiwa badala ya kubadilishwa kuwa “sehemu zilizochomoza.”
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: iliyo mbele za Yahweh
  rationale: Usemi לִפְנֵי unaonyesha mahali mbele ya au katika uwepo wa Yahweh. “Mbele za” ni usemi wa Kiswahili wenye heshima unaohifadhi maana hiyo ya mahali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika matini.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la kawaida la hema la patakatifu ambako Mungu alikutana na watu wake. “Hema la kukutania” ni la moja kwa moja na linaeleweka katika Kiswahili cha sasa.
- source_word: וְאֵת כָּל הַדָּם
  choice: damu yote
  rationale: Matini inasema “damu yote,” si “damu iliyobaki.” Tafsiri hiyo imehifadhiwa ili kutoingiza ufafanuzi wa kimuktadha ndani ya matini.
- source_word: יִשְׁפֹּךְ
  choice: ataimwaga
  rationale: Kitenzi שׁפך humaanisha kumwaga; kiwakilishi cha yambwa kinafanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: אֶל יְסוֹד
  choice: kwenye msingi
  rationale: יְסוֹד ni msingi au sehemu ya chini inayotegemeza kitu. “Kwenye msingi” huwasilisha mahali ambapo damu inamwagwa bila kutumia istilahi ya kizamani.
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: עֹלָה ni dhabihu inayoteketezwa. “Sadaka ya kuteketezwa” ni istilahi wazi na ya kawaida kwa aina hii ya dhabihu.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: iliyo kwenye mlango wa hema la kukutania
  rationale: פֶּתַח ni mlango, uwazi, au mahali pa kuingilia. “Kwenye mlango” ni Kiswahili cha kawaida kinachoonyesha mahali pa madhabahu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina jina binafsi יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya “damu yote” baada ya sehemu ya damu kuwekwa kwenye pembe
  choice: damu yote
  alternative: damu yote iliyobaki
  rationale: Ingawa muktadha unaonyesha damu iliyosalia, Kiebrania chenyewe kinasema “damu yote.” Tafsiri imehifadhi mvutano huo badala ya kuufafanua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili huku istilahi za ibada—pembe za madhabahu, hema la kukutania, na sadaka ya kuteketezwa—zikihifadhiwa.
