  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: sw
  text: Kisha kuhani atachukua sehemu ya damu yake kwa kidole chake na kuitia kwenye pembe za madhabahu ya sadaka ya kuteketezwa[b], halafu atamwaga damu yake yote kwenye msingi wa madhabahu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Pembe” ni miinuko iliyofanana na pembe kwenye kona za madhabahu.
    reason: cultural_note
  - marker: c
    text: Ingawa Kiebrania kinasema “damu yake yote,” mfuatano unaonyesha kuwa damu iliyobaki ndiyo inayomwagwa baada ya sehemu fulani kutiwa kwenye pembe za madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Katika muktadha wa maagizo ya ibada, umbo hili linaendeleza hatua inayofuata ya utaratibu; wakati ujao wa Kiswahili unaonyesha agizo la kiibada kwa kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Neno la kawaida na lenye heshima kwa mhudumu huyu wa ibada; muktadha unamtambulisha wazi.
- source_word: מִדָּמָהּ
  choice: sehemu ya damu yake
  rationale: 'מִן hapa ina maana ya sehemu ya kitu kizima: kuhani anachukua kiasi fulani cha damu, si damu yote katika hatua hii.'
- source_word: בְּאֶצְבָּעוֹ
  choice: kwa kidole chake
  rationale: בְּ inaonyesha chombo au njia iliyotumiwa; 'kwa kidole chake' ni Kiswahili cha kawaida.
- source_word: וְנָתַן
  choice: na kuitia
  rationale: נתן ina wigo wa maana ya kuweka au kutia; 'kuitia' inaeleza tendo bila kuongeza maelezo yasiyomo.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: kwenye pembe za madhabahu ya sadaka ya kuteketezwa
  rationale: Neno 'pembe' linahifadhi istilahi halisi ya kiibada, huku kishazi kizima kikitambulisha madhabahu husika kwa Kiswahili cha kawaida.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: damu yake yote
  rationale: Tafsiri inahifadhi כָּל kwa maana ya 'yote'; dokezo linafafanua kwamba katika mfuatano huu ni damu iliyobaki baada ya kiasi kutumiwa.
- source_word: יִשְׁפֹּךְ
  choice: atamwaga
  rationale: Kitenzi hiki huonyesha kumwaga kimiminika na kinafaa kwa tendo la kiibada linaloelezwa.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: kwenye msingi wa madhabahu
  rationale: יְסוֹד ni msingi au sehemu ya chini inayotegemeza; 'msingi' huhifadhi maana yake ya moja kwa moja.
theological_decisions:
- issue: Hali ya vitenzi katika agizo la ibada
  choice: 'Vimetafsiriwa kama maagizo ya utaratibu: ''atachukua ... atamwaga'''
  alternative: 'Kuvitafsiri kama simulizi la wakati uliopita: ''alichukua ... akamwaga'''
  rationale: Muktadha ni sheria ya ibada, si taarifa ya tukio moja la kihistoria; wakati ujao wa Kiswahili unaonyesha hatua zinazopaswa kufanywa.
- issue: Istilahi ya sehemu zilizojitokeza kwenye madhabahu
  choice: Neno halisi 'pembe' limehifadhiwa
  alternative: Kutumia maelezo ya kiutendaji kama 'miinuko ya pembeni'
  rationale: פינות? Chanzo kinasema קַרְנֹת, 'pembe'; kuhifadhi taswira hiyo huepuka kufifisha istilahi mahsusi ya kiibada.
- issue: Uhusiano kati ya 'sehemu ya damu' na 'damu yake yote'
  choice: Kauli zote mbili zimehifadhiwa, huku dokezo likifafanua mfuatano
  alternative: Kubadili kauli ya pili kuwa 'damu yake yote iliyobaki'
  rationale: Chanzo chenyewe kinasema כָּל דָּמָהּ, 'damu yake yote,' ingawa mfuatano unaonyesha kwamba kiasi fulani tayari kimetumiwa. Dokezo hulinda maana ya muktadha bila kubadili maneno ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko ya ibada. Muundo ni wa moja kwa moja na unaosomeka kwa urahisi. Dokezo [a] la Kiingereza halikuhitajika kwa sababu maana ya sehemu tayari imeelezwa wazi katika matini ya Kiswahili; alama zilizotumika zote zina dokezo sambamba.
