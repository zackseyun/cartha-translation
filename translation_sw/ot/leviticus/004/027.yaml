  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: sw
  text: Na ikiwa mtu mmoja miongoni mwa watu wa kawaida[a] atatenda dhambi bila kukusudia kwa kufanya mojawapo ya mambo ambayo amri za Yahweh zinakataza, naye akawa na hatia,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa watu wa nchi.” Hapa kirai hiki kinamaanisha mshiriki wa kawaida wa jumuiya, tofauti na kuhani au kiongozi katika sheria zinazozunguka kifungu hiki.
    reason: lexical_alternative
  - marker: b
    text: Au, “naye akajipatia hatia” au “naye ana hatia.” Kitenzi cha Kiebrania kinaweza kumaanisha kuingia katika hali ya kuwa na hatia au kubeba hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: mtu mmoja
  rationale: Katika sheria hii נֶפֶשׁ humaanisha mtu binafsi, si ‘nafsi’ kama sehemu isiyoonekana ya mwanadamu; ‘mtu mmoja’ huhifadhi umoja wa mhusika kwa Kiswahili cha kawaida.
- source_word: תֶּחֱטָא
  choice: atatenda dhambi
  rationale: Kitenzi חטא hapa ni neno la kawaida la kutenda dhambi; muundo huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: בִשְׁגָגָה
  choice: bila kukusudia
  rationale: Neno hili linaonyesha kosa lisilofanywa kwa makusudi katika muktadha wa sheria za dhabihu.
- source_word: מֵעַם הָאָרֶץ
  choice: miongoni mwa watu wa kawaida
  rationale: Katika muktadha huu kirai kinamtaja mshiriki wa kawaida wa jumuiya, tofauti na kuhani, kusanyiko lote, au kiongozi waliotajwa katika sheria zinazozunguka mstari huu.
- source_word: בַּעֲשֹׂתָהּ
  choice: kwa kufanya
  rationale: Kiambishi ב pamoja na kitenzi-jina kinaonyesha tendo au njia ambayo dhambi hiyo inatendwa.
- source_word: אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: mojawapo ya mambo ambayo amri za Yahweh zinakataza
  rationale: Kiebrania kwa karibu ni ‘moja kati ya amri za Yahweh ambazo hazipaswi kufanywa.’ Kiswahili hiki kinaweka wazi kuwa kinachofanywa ni jambo lililokatazwa, wala si kwamba mtu ‘anafanya amri,’ huku kikihifadhi dhana ya amri za Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: וְאָשֵׁם
  choice: naye akawa na hatia
  rationale: Kitenzi אשם kinaweza kuonyesha kuingia katika hali ya kuwa na hatia au kubeba hatia; ‘akawa na hatia’ huhifadhi matokeo ya tendo bila kuongeza ufafanuzi wa kiteolojia.
theological_decisions:
- issue: Maana ya מֵעַם הָאָרֶץ katika sheria za dhabihu
  choice: miongoni mwa watu wa kawaida
  alternative: miongoni mwa watu wa nchi
  rationale: Hapa kirai kinafanya kazi kama kundi la kijamii na kisheria linalotofautisha mtu wa kawaida na kuhani au kiongozi. Tafsiri iliyochaguliwa huepuka maana ya kisasa ya wakazi wa eneo fulani, huku tanbihi ikihifadhi muundo wa karibu wa Kiebrania.
- issue: Nguvu ya וְאָשֵׁם
  choice: naye akawa na hatia
  alternative: naye akajipatia hatia / naye ana hatia
  rationale: Uchaguzi huu huhifadhi mwendo kutoka tendo lililokatazwa hadi hali ya hatia na pia huacha wazi iwapo mkazo ni kuingia katika hali hiyo au kubeba hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye heshima. ‘Watu wa kawaida’ linaeleza kundi la muktadha bila sauti ya kudharau; ‘mambo ambayo amri ... zinakataza’ huepuka Kiswahili kisicho cha asili cha ‘kufanya amri ambayo haipaswi kufanywa.’
