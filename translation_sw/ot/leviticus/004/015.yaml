base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: sw
  text: Wazee wa kusanyiko wataweka mikono yao juu ya kichwa cha fahali huyo mbele za Yahwe, naye atamchinja[a] fahali huyo mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinabadilika kutoka “wazee” (wingi) hadi kitenzi cha umoja hapa, bila kutaja wazi mtendaji wa kuchinja. Yaweza pia kutafsiriwa, “na mmoja atamchinja fahali huyo mbele za Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: wataweka
  rationale: Katika muktadha wa dhabihu, סמך humaanisha tendo la kiibada la kuweka au kuegemeza mikono juu ya mnyama; “wataweka” ni ya kawaida na wazi katika Kiswahili.
- source_word: זִקְנֵי הָעֵדָה
  choice: wazee wa kusanyiko
  rationale: “Wazee” huwakilisha זִקְנֵי, na “kusanyiko” huhifadhi maana rasmi ya עֵדָה kama jumuiya iliyokusanyika.
- source_word: אֶת יְדֵיהֶם
  choice: mikono yao
  rationale: Huhifadhi wingi wa nomino na kiambishi cha nafsi ya tatu wingi katika Kiebrania.
- source_word: עַל רֹאשׁ הַפָּר
  choice: juu ya kichwa cha huyo fahali
  rationale: Ni usemi wa mahali wa moja kwa moja; “huyo fahali” humrejelea mnyama aliyetajwa katika muktadha bila kuongeza umri ambao mstari huu hautaji.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” ni usemi wa Kiswahili unaofaa kwa maana ya kuwa mbele au katika uwepo wa Yahwe katika sheria za dhabihu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa Tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: וְשָׁחַט
  choice: na mtu mmoja atamchinja
  rationale: Kitenzi cha Kiebrania ni nafsi ya tatu umoja baada ya kiima cha wingi. “Mtu mmoja” huhifadhi badiliko hilo huku kikiepuka kumtambua mtu mahususi ambaye maandishi hayamtaji.
- source_word: הַפָּר
  choice: huyo fahali
  rationale: פַּר hapa ni fahali; kiashiria “huyo” kinaonyesha kuwa ni yuleyule ambaye wazee wameweka mikono juu yake.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; “Yahwe” ni unukuzi wa kawaida wa Kiswahili unaohifadhi jina hilo.
- issue: Badiliko kutoka kiima cha wingi hadi kitenzi cha umoja katika וְשָׁחַט
  choice: na mtu mmoja atamchinja
  alternative: nao watamchinja; naye atamchinja; huyo fahali atachinjwa
  rationale: Umoja wa kitenzi umehifadhiwa bila kudai kwamba wazee wote wanachinja, bila kuingiza kiwakilishi chenye rejeleo lisilo wazi, na bila kugeuza kitenzi kuwa hali ya kutendwa. Tanbihi inaeleza utata wa mtendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kusanyiko” linafaa kwa sheria rasmi ya Walawi; “mbele za Yahwe” ni usemi wa kibiblia unaoeleweka. Alama ya tanbihi imewekwa baada ya sentensi inayohusu badiliko la idadi.
