base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: sw
  text: Atamtendea ng’ombe dume huyo kama alivyomtendea ng’ombe dume wa sadaka ya dhambi[a]; atamtendea vivyo hivyo. Kuhani atafanya upatanisho kwa ajili yao, nao watasamehewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso.” Neno la Kiebrania linaweza kumaanisha sadaka inayoshughulikia dhambi kwa kuleta utakaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: Atamfanyia huyo ng’ombe dume
  rationale: Muundo wa kumfanyia unaonyesha kitendo kinachofanywa kwa mnyama katika utaratibu wa ibada, huku ‘huyo’ akirejelea ng’ombe dume aliyetajwa katika muktadha.
- source_word: כַּאֲשֶׁר עָשָׂה לְפַר הַחַטָּאת
  choice: kama alivyomfanyia ng’ombe dume wa sadaka ya dhambi
  rationale: ‘Kama alivyomfanyia’ huhifadhi ulinganisho wa wazi na utaratibu uliotangulia; ‘sadaka ya dhambi’ ni istilahi inayoeleweka na iliyozoeleka kwa חטאת katika sheria za dhabihu.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: atamfanyia vivyo hivyo
  rationale: ‘Vivyo hivyo’ huonyesha ulinganifu kamili wa utaratibu na huepuka marudio yasiyo ya lazima.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: Kuhani atawafanyia upatanisho
  rationale: ‘Kuwafanyia upatanisho’ huhifadhi maana ya kiibada ya כפר na kuonyesha kuwa tendo hilo linafanywa kwa niaba ya watu.
- source_word: וְנִסְלַח לָהֶם
  choice: nao watasamehewa
  rationale: Kauli ya kutendwa huhifadhi hali ya Kiebrania ya kupokea msamaha, huku ‘nao’ ikiunganisha matokeo hayo kwa watu waliotendewa upatanisho.
theological_decisions:
- issue: Maana ya חטאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno hilo linaweza kuelekeza kwenye dhambi inayoshughulikiwa au utakaso unaotimizwa na sadaka. ‘Sadaka ya dhambi’ ni wazi na imezoeleka, lakini maana halali ya ‘sadaka ya utakaso’ imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa sentensi umehifadhi marudio ya kiibada ya andiko bila kuwa mzito kupita kiasi.
