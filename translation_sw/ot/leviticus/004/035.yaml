id: LEV.4.35
reference: Leviticus 4:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: sw
  text: Naye ataondoa mafuta yake yote, kama vile mafuta ya mwana-kondoo yanavyoondolewa katika dhabihu ya sadaka za amani. Kisha kuhani atayateketeza juu ya madhabahu, juu ya matoleo ya Yahwe yanayotolewa kwa moto[a]. Hivyo kuhani atamfanyia upatanisho kwa ajili ya dhambi aliyotenda, naye atasamehewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya sadaka za Yahwe zinazotolewa kwa moto.” Neno la Kiebrania ni istilahi maalumu ya matoleo ya dhabihu yanayotolewa kwa moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: mafuta yake yote / mafuta
  rationale: Katika utaratibu huu wa dhabihu, neno hilo linamaanisha mafuta maalumu ya mnyama yanayoondolewa na kuteketezwa madhabahuni. Kiswahili ‘mafuta’ ni wazi na hakiongezi ufafanuzi usiomo katika maandishi.
- source_word: יָסִיר / יוּסַר
  choice: ataondoa / yanavyoondolewa
  rationale: Vitenzi hivi vinaeleza kuondolewa kwa mafuta katika utaratibu wa dhabihu; kauli tendaji na tendwa za Kiswahili zinaakisi maumbo ya Kiebrania.
- source_word: הַכֶּשֶׂב
  choice: mwana-kondoo
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha mwana-kondoo, si kondoo kwa maana pana tu.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: ‘Sadaka za amani’ huhifadhi aina maalumu ya dhabihu inayotajwa na שְׁלָמִים bila kuifasiri kwa namna finyu kama ushirika pekee.
- source_word: וְהִקְטִיר ... אֹתָם
  choice: atayateketeza
  rationale: Katika muktadha wa madhabahu, הקטיר ni kuteketeza ili sadaka itoe moshi. Kiambishi ‘-ya-’ kinarejelea mafuta kama wingi wa vipande na pia kinawasilisha maana ya kiwakilishi cha Kiebrania cha wingi אֹתָם kwa Kiswahili cha kawaida.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: juu ya sadaka za kuteketezwa kwa moto kwa ajili ya Yahwe
  rationale: עַל imehifadhiwa kwa ‘juu ya,’ huku אִשֵּׁי ikitolewa kama istilahi ya sadaka zinazoteketezwa kwa moto. ‘Kwa ajili ya Yahwe’ inaonyesha anayepokea sadaka bila kufanya jina la Mungu kuwa kivumishi kisicho cha kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la agano יהוה, badala ya kulibadili kuwa cheo ‘BWANA.’
- source_word: וְכִפֶּר עָלָיו
  choice: atamfanyia upatanisho
  rationale: ‘Kumfanyia upatanisho’ huhifadhi maana pana ya kikuhani na kidhabihu ya כפר bila kulazimisha nadharia moja maalumu ya jinsi upatanisho unavyofanya kazi.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: Kauli tendwa inaonyesha matokeo ya ibada—msamaha anaopokea mkosaji—na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Lugha ya upatanisho wa kidhabihu
  choice: kuhani atamfanyia upatanisho
  alternative: kuhani atamfanyia kafara
  rationale: ‘Upatanisho’ inadumisha upana wa neno la ibada כפר na huepuka kuingiza maelezo ya kimadhehebu kuhusu utaratibu wake.
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitaja kama ‘Yahwe’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Uhusiano kati ya upatanisho na msamaha
  choice: Hivyo kuhani atamfanyia upatanisho ... naye atasamehewa
  alternative: Kuhani atamfutia dhambi, naye atasamehewa
  rationale: Tafsiri hii inahifadhi tofauti iliyomo katika Kiebrania kati ya tendo la kikuhani la kufanya upatanisho na matokeo ya kusamehewa; haiyachanganyi kuwa tendo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Sentensi ndefu ya Kiebrania imegawanywa kwa mtiririko wa asili, huku mpangilio wa matendo ya ibada, kiwakilishi cha wingi kinachorejelea vipande vya mafuta, na mvutano kati ya upatanisho na msamaha vikihifadhiwa.
