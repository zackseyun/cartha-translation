base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: sw
  text: Au dhambi aliyotenda ikijulikana kwake,[a] ataleta mbuzi jike asiye na dosari kuwa sadaka yake kwa ajili ya dhambi aliyotenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhambi aliyotenda ikifahamika kwake,” au “akiarifiwa kuhusu dhambi yake.” Muundo wa Kiebrania wa kutendwa unaweza kumaanisha kwamba yeye mwenyewe anatambua jambo hilo au kwamba mtu mwingine anamjulisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Au
  rationale: Huanzisha hali nyingine katika mfululizo wa sheria; kishazi kinachofuata kinaonyesha maana ya sharti.
- source_word: הוֹדַע אֵלָיו
  choice: ikijulishwa kwake
  rationale: 'Huhifadhi hali ya kutendwa ya Hophal: dhambi hiyo inafikishwa katika ufahamu wake, bila kuamua ikiwa ameigundua mwenyewe au ameambiwa.'
- source_word: חַטָּאתוֹ
  choice: dhambi aliyotenda
  rationale: Katika muktadha huu חטאת hurejelea tendo la dhambi, si sadaka ya dhambi.
- source_word: וְהֵבִיא
  choice: ataleta
  rationale: Katika maagizo ya kisheria, muundo huu unaeleza tendo linalotakiwa kufuata.
- source_word: קָרְבָּנוֹ
  choice: kama sadaka yake
  rationale: קרבן ni kitu kinacholetwa na kutolewa; tafsiri hii huhifadhi istilahi ya ibada kwa Kiswahili cha kawaida.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: mbuzi jike
  rationale: Kirai hicho na נְקֵבָה vinabainisha wazi kuwa mnyama ni mbuzi wa kike.
- source_word: תְּמִימָה
  choice: asiye na dosari
  rationale: Ni usemi wa kawaida wa sadaka unaomaanisha mnyama asiye na kasoro.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: kwa ajili ya dhambi aliyotenda
  rationale: עַל hapa huonyesha uhusiano wa sadaka na dhambi iliyotendwa bila kuipa maana pana kuliko ilivyo.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa sadaka ya utakaso
  choice: Kutafsiri kama “dhambi” katika sehemu zote mbili
  alternative: Kutafsiri sehemu ya pili kama “sadaka ya dhambi”
  rationale: Sadaka yenyewe tayari imetajwa kwa neno קָרְבָּנוֹ na kubainishwa kuwa mbuzi jike; kwa hiyo חַטָּאתוֹ mara zote mbili inarejelea kosa ambalo kwa ajili yake sadaka inaletwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ikijulishwa kwake” kimetumiwa kuhifadhi hali ya kutendwa na utata halisi wa chanzo; “asiye na dosari” ni usemi wa kawaida wa wanyama wa sadaka.
