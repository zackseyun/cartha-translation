id: LEV.4.34
reference: Leviticus 4:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: sw
  text: Kisha kuhani atachukua sehemu ya damu ya sadaka ya dhambi[a] kwa kidole chake na kuitia juu ya pembe za madhabahu ya sadaka ya kuteketezwa; naye ataimwaga damu yake yote chini ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso.” Neno la Kiebrania linaweza kumaanisha sadaka inayotolewa kuhusiana na dhambi na utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Muundo huu unaendeleza mfuatano wa maagizo ya ibada; “Kisha” na wakati ujao huwasilisha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni tafsiri ya moja kwa moja ya nomino inayomtaja kuhani anayetekeleza ibada.
- source_word: מִדַּם
  choice: sehemu ya damu
  rationale: 'Kihusishi מִן kina maana ya sehemu katika muktadha huu: kuhani anatumia kiasi fulani cha damu kabla ya damu kumwagwa kwenye msingi wa madhabahu.'
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria za dhabihu, neno hili humaanisha sadaka inayotolewa kuhusiana na dhambi na utakaso, si dhambi yenyewe tu. “Sadaka ya dhambi” ni istilahi inayoeleweka na iliyozoeleka.
- source_word: בְּאֶצְבָּעוֹ
  choice: kwa kidole chake
  rationale: Herufi ב inaonyesha chombo kinachotumiwa; kuhani anatumia kidole chake kuitia damu.
- source_word: וְנָתַן
  choice: na kuitia
  rationale: נתן ni “kuweka/kutia”; “kuitia” ni ya kawaida katika maelezo haya ya tendo la ibada, na kiambishi “i” kinarejelea damu.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: juu ya pembe za madhabahu ya sadaka ya kuteketezwa
  rationale: Tafsiri hii inadumisha taswira halisi ya sehemu za madhabahu zinazoitwa “pembe” na inaonyesha kuwa ni madhabahu inayohusishwa na sadaka ya kuteketezwa.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: damu yake yote
  rationale: כָּל huonyesha jumla. Ingawa kimantiki hii ni damu iliyobaki baada ya kiasi fulani kutiwa kwenye pembe, tafsiri inadumisha usemi wa Kiebrania “damu yake yote” bila kuufafanua kupita kiasi.
- source_word: יִשְׁפֹּךְ
  choice: ataimwaga
  rationale: “Kumwaga” huonyesha tendo la makusudi la ibada, si kumwagika kwa bahati mbaya.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: kwenye msingi wa madhabahu
  rationale: יְסוֹד humaanisha msingi au sehemu ya chini; “kwenye msingi” ni wazi na ya asili katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Katika muktadha huu neno hakika linamaanisha sadaka, lakini linaweza kusisitiza uhusiano wake na dhambi au kazi yake ya utakaso. Matini kuu inatumia istilahi iliyozoeleka “sadaka ya dhambi,” huku tanbihi ikihifadhi tafsiri halali ya “sadaka ya utakaso.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za ibada zimedumishwa bila kuongeza ufafanuzi wa kimadhehebu.
