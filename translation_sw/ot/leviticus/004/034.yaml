- from: Kisha kuhani atachukua kwa kidole chake sehemu ya damu ya sadaka ya dhambi[a] na kuitia juu ya pembe za madhabahu ya sadaka ya kuteketezwa; naye ataimwaga damu yake yote kwenye msingi wa madhabahu.
  to: Kisha kuhani atachukua sehemu ya damu ya sadaka ya dhambi[a] kwa kidole chake na kuitia juu ya pembe za madhabahu ya sadaka ya kuteketezwa; naye ataimwaga damu yake yote chini ya madhabahu.
  rationale: Reordered the instrumental phrase for smoother Standard East African Swahili and rendered the altar’s יְסוֹד as “chini ya madhabahu” to convey its base as a ritual location. No change has been made to the source meaning or to the lexical alternative for חַטָּאת.
