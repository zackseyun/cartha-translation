id: LEV.4.2
reference: Leviticus 4:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: sw
  text: '“Waambie wana wa Israeli[a] hivi: Mtu akitenda dhambi bila kukusudia[b] dhidi ya mojawapo ya amri za Yahwe kuhusu mambo yasiyopaswa kufanywa, na akafanya mojawapo ya mambo hayo,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli”; Kiebrania kihalisi ni “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa makosa.” Kiebrania kinamaanisha dhambi iliyotendwa pasipo kukusudia, si kwa ukaidi wa makusudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Waambie wana wa Israeli hivi
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida amri ya kusema na kishazi cha Kiebrania kinachoanzisha maneno yanayofuata. “Wana wa Israeli” huhifadhi taswira ya kifamilia ya בְּנֵי יִשְׂרָאֵל.
- source_word: נֶפֶשׁ
  choice: Mtu
  rationale: Katika sheria hii נֶפֶשׁ humaanisha mtu binafsi, si hasa nafsi isiyo ya kimwili.
- source_word: כִּי תֶחֱטָא
  choice: akitenda dhambi
  rationale: Huwasilisha hali ya kisheria ya uwezekano kwa Kiswahili cha kawaida.
- source_word: בִשְׁגָגָה
  choice: bila kukusudia
  rationale: Neno hili linaonyesha kosa lililotendwa pasipo nia au kwa kutofahamu, si uasi wa makusudi.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: kuhusiana na mojawapo ya amri za Yahwe
  rationale: “Kuhusiana na” huhifadhi upana wa uhusiano unaoonyeshwa na מִן bila kuamua kimya kimya kuwa ni “dhidi ya”; “mojawapo” linafaa kwa sharti linaloweza kugusa amri yoyote.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: kuhusu mambo yasiyopaswa kufanywa
  rationale: Huhifadhi maana ya kishazi cha kutendwa kisicho na mtendaji maalumu, huku kikiwa cha kawaida katika Kiswahili.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: na akafanya mojawapo ya mambo hayo
  rationale: Huhifadhi hatua halisi ya kufanya tendo lililokatazwa na marejeo yake kwa mambo yaliyotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יְהוָה. “Yahwe” hulitofautisha na cheo “Bwana” na kufuata ushahidi wa jina lenyewe bila kuingiza msimamo wa dhehebu.
- issue: Asili ya dhambi inayozungumziwa
  choice: bila kukusudia
  alternative: kwa makosa; bila kujua
  rationale: בִשְׁגָגָה linaelekeza kwenye dhambi isiyo ya ukaidi wa makusudi, lakini halifafanui katika mstari huu ikiwa daima ilisababishwa na kutokujua; kwa hiyo tafsiri pana zaidi imehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi hali ya sharti na mwendelezo wa mstari unaofuata; istilahi nzito kama “nafsi” imeepukwa kwa kuwa hapa נֶפֶשׁ ni mtu binafsi.
