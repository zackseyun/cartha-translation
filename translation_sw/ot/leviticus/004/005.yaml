  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: sw
  text: Na kuhani aliyetiwa mafuta atachukua sehemu ya damu ya huyo fahali, na kuipeleka ndani ya hema la kukutania[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “kutoka katika damu ya huyo fahali.” Huenda Kiebrania kinamaanisha kuchukua kiasi fulani cha damu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania hutumia kihusishi chenye maana ya “kwenye”: “kwenye hema la kukutania.” Tafsiri “ndani ya” inaonyesha muktadha wa ibada, kwa kuwa matendo yanayofuata yanafanyika ndani ya mahali patakatifu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Katika utaratibu huu wa dhabihu, waw pamoja na qatal huendeleza hatua ya maagizo. Kiswahili cha wakati ujao kinaonyesha tendo linalotakiwa kufanywa, na “Kisha” huonyesha mfuatano kwa kawaida.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: kuhani aliyetiwa mafuta
  rationale: Huhifadhi maana ya msingi ya cheo hiki cha Kiebrania bila kukibadilisha moja kwa moja kuwa “kuhani mkuu” wala kuingiza maana ya baadaye ya kimasiya.
- source_word: מִדַּם
  choice: sehemu ya damu
  rationale: 'מִן ina maana ya kugawa hapa: kuhani anachukua kiasi fulani cha damu, si damu yote. “Sehemu ya damu” ni wazi na ya asili katika Kiswahili.'
- source_word: הַפָּר
  choice: ya huyo fahali
  rationale: פַּר ni fahali. Kionyeshi “huyo” kinarejelea kwa uwazi fahali aliyekwisha tajwa katika muktadha.
- source_word: וְהֵבִיא אֹתוֹ
  choice: na kuipeleka
  rationale: Kiambishi cha yambwa kinarejelea damu. “Kuipeleka” ni muundo wa kawaida wa Kiswahili, huku nguvu ya kiutaratibu ya wakati ujao ikiendelea kutoka “atachukua.”
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: ndani ya hema la kukutania
  rationale: Ingawa אֶל kwa kawaida inaweza kumaanisha “kwenda kwenye,” muktadha wa ibada na matendo yanayofuata yanaonyesha kuingia ndani. “Hema la kukutania” ni tafsiri ya kawaida na inayoeleweka ya אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Tafsiri ya הַכֹּהֵן הַמָּשִׁיחַ katika tafsiri ya Kikristo
  choice: kuhani aliyetiwa mafuta
  alternative: kuhani aliyewekwa wakfu; kuhani mkuu
  rationale: Tafsiri hii huhifadhi maana ya מָשִׁיחַ, “aliyetiwa mafuta,” bila kuficha maneno ya Kiebrania kwa cheo cha kufasiri “kuhani mkuu,” na bila kuingiza moja kwa moja maana ya kikristolojia katika cheo hiki cha kikuhani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Fahali,” “kuhani,” na “hema la kukutania” hudumisha msamiati wa kibiblia uliozoeleka bila kuwa wa kizamani kupita kiasi.
