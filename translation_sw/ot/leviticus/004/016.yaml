  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: sw
  text: Kisha kuhani aliyetiwa mafuta ataleta sehemu ya damu ya huyo fahali ndani ya hema la kukutania.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kiebrania kwa karibu zaidi, “kutoka katika damu ya huyo fahali.” Inaelekea maana yake ni kwamba ni sehemu tu ya damu inayoletwa ndani.
    reason: lexical_alternative
  - marker: b
    text: “Hema la kukutania” pia huitwa kwa neno la kimapokeo “maskani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: Kisha ... ataleta
  rationale: Kitenzi hiki kinaendeleza mfuatano wa maagizo ya ibada; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida na fasaha.
- source_word: הַ/כֹּהֵן הַ/מָּשִׁיחַ
  choice: kuhani aliyetiwa mafuta
  rationale: Katika muktadha huu הַמָּשִׁיחַ humtambulisha kuhani aliyewekwa rasmi kwa kutiwa mafuta, wala si cheo cha Kimasihi.
- source_word: מִ/דַּם הַ/פָּר
  choice: sehemu ya damu ya huyo fahali
  rationale: מִן ina maana ya sehemu hapa, kwa kuwa ni kiasi fulani tu cha damu kinacholetwa ndani. “Huyo fahali” humrejelea fahali aliyetajwa katika utaratibu unaoendelea.
- source_word: אֶל
  choice: ndani ya
  rationale: Ingawa אֶל mara nyingi ni “kwenda/ku,” tendo la kuleta damu katika hema linaashiria kuingia ndani ya mahali hapo.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Tafsiri hii inaweka wazi maana ya jina la mahali patakatifu na ni ya kawaida katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya הַמָּשִׁיחַ katika muktadha wa ukuhani
  choice: aliyetiwa mafuta
  alternative: aliyewekwa wakfu; Masihi
  rationale: Neno hili hapa linaeleza kuhani aliyeingizwa katika wadhifa kwa kutiwa mafuta. “Masihi” lingedokeza kimakosa cheo cha Kimasihi, ilhali “aliyewekwa wakfu” lingepunguza taswira mahsusi ya kutiwa mafuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maagizo ya ibada umehifadhiwa kwa lugha ya asili, huku “sehemu ya damu” ikifanya maana ya kigawanyaji ya מִן iwe wazi.
