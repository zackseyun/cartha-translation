base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: sw
  text: Atamtoa fahali mzima mpaka mahali safi[a] nje ya kambi, mahali pa kumwaga majivu[b], na atamteketeza juu ya kuni motoni; atateketezwa mahali pa kumwaga majivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mahali safi kiibada.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mahali pa kumwaga majivu,” yaani eneo lililotengwa kwa ajili ya kuondolea majivu ya madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Kisha atamtoa
  rationale: Hifili ya יצא ina maana ya kusababisha kutoka, yaani ‘kumtoa.’ ‘Kisha’ huunganisha hatua hii na maagizo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: כָּל הַפָּר
  choice: fahali mzima
  rationale: כָּל pamoja na nomino yenye uainisho husisitiza mnyama wote; ‘fahali mzima’ ni ya kawaida na sahihi.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Huonyesha eneo lililo ng’ambo ya mpaka wa kambi.
- source_word: מָקוֹם טָהוֹר
  choice: mahali safi
  rationale: ‘Safi’ huhifadhi maana ya msingi ya טָהוֹר, huku dokezo likifafanua usafi wa kiibada unaowezekana katika muktadha wa Walawi.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: mahali ambapo majivu humwagwa
  rationale: Tafsiri hii inaonyesha wazi eneo maalumu la kumwaga au kuondolea majivu ya madhabahu bila kulifanya tu kuwa rundo lisilo maalumu.
- source_word: וְשָׂרַף אֹתוֹ
  choice: na kumteketeza
  rationale: שׂרף ni kuchoma kabisa; ‘kumteketeza’ linafaa kwa kuchomwa kwa mabaki yote ya fahali katika agizo hili.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: juu ya kuni kwa moto
  rationale: Huhifadhi kuni kama mahali au fueli ya kuchomea na moto kama njia ya utekelezaji, kwa Kiswahili kinachoeleweka.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: atateketezwa hapo ambapo majivu humwagwa
  rationale: Huhifadhi urudiaji wa eneo katika Kiebrania na msisitizo wa kisheria kuhusu mahali pa kuchomea.
theological_decisions:
- issue: Dhana ya usafi wa kiibada katika טָהוֹר
  choice: mahali safi
  alternative: mahali safi kiibada
  rationale: Muktadha wa dhabihu unaelekeza kwenye usafi wa kiibada, lakini neno la Kiebrania haliongezi wazi ‘kiibada’; ufafanuzi huo umewekwa katika tanbihi ili kutotatua kimya kimya upeo wa maana.
- issue: Eneo la שֶׁפֶךְ הַדֶּשֶׁן
  choice: mahali ambapo majivu humwagwa
  alternative: rundo la majivu
  rationale: Usemi wa Kiebrania unaonyesha mahali pa kumwagia au kuondolea majivu, huenda eneo lililotengwa, si lazima rundo lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa eneo la majivu umehifadhiwa kwa sababu ni msisitizo wa maandishi ya kisheria; alama zote za tanbihi zimo katika matini kuu.
