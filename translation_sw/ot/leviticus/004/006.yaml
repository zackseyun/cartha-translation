language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: sw
  text: Kuhani atachovya kidole chake katika damu, kisha atanyunyiza baadhi ya damu hiyo mara saba mbele za Yahweh[a], mbele ya pazia la mahali patakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya pazia la Mahali Patakatifu.”
    reason: Kirai cha Kiebrania kinachohusu pazia kinaweza kutafsiriwa kwa karibu kama maelezo ya mahali pa kunyunyizia; “Mahali Patakatifu” ni tafsiri mbadala ya הַקֹּדֶשׁ katika muktadha huu.
lexical_decisions:
- source_word: וְטָבַל
  choice: atachovya
  rationale: Katika mfululizo huu wa maagizo ya ibada, waw pamoja na qatal inaendeleza tendo linalotakiwa kufanywa; ‘atachovya’ ni Kiswahili cha kawaida na sahihi kwa kutia kitu ndani ya umajimaji.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Nomino ya umoja yenye uainisho, ikimtaja kuh目ani anayehudumu katika ibada hii.
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: kidole chake katika damu
  rationale: Kiambishi cha nafsi ya tatu umoja kimehifadhiwa kwa ‘chake’; בַּדָּם inaonyesha damu ambayo kidole kinachovywa ndani yake.
- source_word: וְהִזָּה
  choice: kisha atanyunyiza
  rationale: Katika muktadha wa kikuhani, Hiphil ya נזה inaeleza unyunyizaji wa kiibada. ‘Kisha’ huonyesha mwendelezo wa matendo bila kuifanya waw kuwa na uzito usio wa lazima.
- source_word: מִן־הַדָּם
  choice: kiasi cha damu hiyo
  rationale: 'מן ni ya sehemu hapa: kinachonyunyizwa ni sehemu ya damu, si lazima damu yote. ‘Kiasi cha’ ni usemi wa asili katika Kiswahili.'
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa idadi ya kurudiwa kwa tendo.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי inaonyesha mahali au mwelekeo katika uwepo wa Mungu; ‘mbele za’ ni usemi wa kawaida wa Kiswahili, na jina la agano יְהוָה limetolewa kama ‘Yahweh’.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: upande wa mbele wa pazia la mahali patakatifu
  rationale: פָּרֹכֶת ni pazia la ndani, פני huelekeza upande wake wa mbele, na הַקֹּדֶשׁ hapa inahusishwa na eneo takatifu. Tafsiri hii inaeleweka bila kuweka ufafanuzi wa usanifu usioelezwa moja kwa moja katika mstari.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana na uhusiano wa פָּרֹכֶת הַקֹּדֶשׁ
  choice: pazia la mahali patakatifu
  alternative: pazia la patakatifu; pazia la hekalu takatifu
  rationale: Kirai kinataja pazia linalohusishwa na eneo takatifu. ‘Mahali patakatifu’ ni wazi kwa msomaji wa kawaida na hakilazimishi utofautishaji wa kiufundi zaidi ya ushahidi wa mstari huu.
- issue: Uhusiano wa לִפְנֵי יְהוָה na אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: mbele za Yahweh, upande wa mbele wa pazia la mahali patakatifu
  alternative: mbele ya pazia la Mahali Patakatifu
  rationale: Maandishi yanaweza kusomwa kama maelezo mawili yanayohusiana kuhusu mahali au mwelekeo wa kunyunyiza. Tafsiri kuu inayahifadhi yote mawili; tanbihi inaonyesha uwezekano wa kuyachukulia kwa ukaribu zaidi kama maelezo ya eneo mbele ya pazia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kuhani,’ ‘pazia,’ na ‘mahali patakatifu’ ni maneno yanayotambulika bila kuwa ya kitaalamu kupita kiasi. Muundo wa wakati ujao unaendeleza mtindo wa maagizo ya ibada katika muktadha.
