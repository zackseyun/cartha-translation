base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: sw
  text: Naye atamtoa huyo fahali nje ya kambi na kumteketeza, kama alivyomteketeza fahali wa kwanza. Hiyo ni sadaka ya dhambi[a] ya kusanyiko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania linaweza kusisitiza jukumu la sadaka katika kuondoa unajisi pamoja na kushughulikia dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: atamtoa
  rationale: Hifili ya יצא humaanisha kutoa au kupeleka nje; “atamtoa” ni ya kawaida na inaonyesha kusogeza fahali hadi nje ya kambi.
- source_word: הַפָּר
  choice: huyo fahali
  rationale: פַּר ni fahali au fahali mchanga; “fahali” ni sahihi na “huyo” humrejelea mnyama aliyetajwa katika muktadha.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Kifungu hiki kinaonyesha mwendo hadi mahali palipo ng'ambo ya mpaka wa kambi; “nje ya kambi” ni Kiswahili cha kawaida.
- source_word: וְשָׂרַף אֹתוֹ
  choice: na kumteketeza
  rationale: שׂרף maana yake ni kuchoma. “Kumteketeza” hapa huonyesha kuchomwa kabisa kwa mzoga katika utaratibu wa dhabihu bila kutumia lugha ngumu ya kitaalamu.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: kama alivyomteketeza
  rationale: כַּאֲשֶׁר huonyesha ulinganisho na utaratibu uliotangulia; muundo huu ni wa asili katika Kiswahili.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: fahali wa kwanza
  rationale: רִאשׁוֹן humrejelea fahali aliyeelezwa awali; tafsiri ya moja kwa moja inahifadhi kiungo hicho.
- source_word: חַטַּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חַטָּאת humaanisha dhabihu inayohusiana na dhambi na utakaso, si dhambi kama dhana pekee. “Sadaka ya dhambi” ni wazi na inayotambulika kwa wasomaji wengi.
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: קָהָל ni jumuiya iliyokusanyika. “Kusanyiko” huhifadhi maana ya pamoja bila kuingiza dhana maalumu ya dhehebu.
- source_word: הוּא
  choice: Hiyo ni
  rationale: Kiwakilishi kinatambulisha fahali huyo kuwa sadaka ya kusanyiko; “Hiyo ni” hutoa utambulisho huo wazi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya חַטַּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kusisitiza kushughulikia dhambi au kuondoa unajisi. Katika mstari huu linamtaja mnyama wa dhabihu; “sadaka ya dhambi” ni tafsiri inayoeleweka kwa urahisi, huku tanbihi ikihifadhi uwezekano wa maana ya utakaso.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umewekwa wazi kwa wasomaji wa kawaida huku ukihifadhi istilahi ya kidini “sadaka ya dhambi” na maana mbadala katika tanbihi.
