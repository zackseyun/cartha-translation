  text: וְ/אִם כֶּ֛בֶשׂ יָבִ֥יא קָרְבָּנ֖/וֹ לְ/חַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: sw
  text: “Ikiwa ataleta mwanakondoo kama sadaka yake ya dhambi[a], basi alete mwanakondoo jike asiye na dosari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayoshughulikia dhambi na unajisi wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ikiwa
  rationale: Huanzisha sharti linalotoa chaguo jingine katika maagizo ya sadaka. Kiswahili cha kawaida hakihitaji kuanza na ‘na’ ili kudumisha mtiririko.
- source_word: כֶּבֶשׂ
  choice: mwanakondoo
  rationale: Katika muktadha huu ni kondoo wa kutolewa sadaka; ‘mwanakondoo’ ni neno la kawaida na linalofaa katika sheria hizi za sadaka.
- source_word: יָבִיא
  choice: ataleta
  rationale: Hifili ya בוא hapa ina maana halisi ya kuleta mnyama kama sadaka; wakati ujao wa Kiswahili unaonyesha sharti hilo kwa kawaida.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni kitu kinacholetwa au kusogezwa mbele za Mungu; ‘sadaka yake’ ni tafsiri wazi na ya kawaida yenye kiambishi cha umilikaji.
- source_word: לְחַטָּאת
  choice: kuwa sadaka yake ya dhambi
  rationale: חַטָּאת ni aina ya sadaka inayohusiana na dhambi na utakaso. ‘Sadaka ya dhambi’ ni istilahi inayoeleweka, huku tanbihi ikihifadhi uwezekano wa ‘sadaka ya utakaso.’
- source_word: נְקֵבָה
  choice: mwanakondoo jike
  rationale: Neno hili linabainisha jinsia ya mnyama. Kurudia ‘mwanakondoo’ kunafanya rejeo liwe wazi na la asili katika Kiswahili.
- source_word: תְמִימָה
  choice: asiye na dosari
  rationale: Katika sheria za sadaka תמים humaanisha mnyama asiye na kasoro inayomfanya asikubalike; ‘asiye na dosari’ ni fasaha na sahihi.
- source_word: יְבִיאֶנָּה
  choice: atamleta
  rationale: Kitenzi kimerudiwa na kina kiambishi cha yambwa cha kike kinachomrejelea mwanakondoo jike; ‘atamleta’ huhifadhi tendo hilo na rejeo lake.
theological_decisions:
- issue: Tafsiri ya חַטָּאת katika sheria za sadaka
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: ‘Sadaka ya dhambi’ ni istilahi iliyozoeleka na inayoeleweka kwa aina hii ya sadaka. Hata hivyo, חַטָּאת katika Mambo ya Walawi inaweza kusisitiza pia utakaso kutokana na unajisi; tanbihi inahifadhi maana hiyo halisi bila kuamua mjadala kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; istilahi ya kidini ‘sadaka ya dhambi’ imehifadhiwa, na utata halisi wa neno la Kiebrania umeonyeshwa katika tanbihi.
