  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: sw
  text: Kisha kuhani atachukua kwa kidole chake sehemu ya damu ya sadaka ya dhambi[a] na kuitia kwenye pembe za madhabahu ya sadaka ya kuteketezwa; kisha ataimwaga damu iliyobaki ya sadaka hiyo kwenye msingi wa madhabahu ya sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania linaweza kutaja sadaka inayohusiana na kuondoa unajisi pamoja na dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Muundo huu unaendeleza hatua za utaratibu wa ibada; “Kisha” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: מִדַּם
  choice: sehemu ya damu
  rationale: 'Kihusishi מִן kimetumiwa kwa maana ya sehemu ya kitu kizima: kuhani anachukua kiasi fulani cha damu, si damu yote.'
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria hizi za dhabihu, neno hili linataja sadaka inayohusiana na dhambi. Hili ni tamko linaloeleweka kwa urahisi na halifungi maana yake katika nadharia fulani ya upatanisho; uwezekano wa “sadaka ya utakaso” umehifadhiwa katika tanbihi.
- source_word: בְּאֶצְבָּעוֹ
  choice: kwa kidole chake
  rationale: Kihusishi בְּ hapa kinaonyesha chombo alichotumia kuhani.
- source_word: וְנָתַן עַל
  choice: na kuiweka juu ya
  rationale: Hutafsiri kitendo halisi cha kuweka damu kwenye pembe za madhabahu bila kuongeza maelezo yasiyosemwa.
- source_word: קַרְנֹת
  choice: pembe
  rationale: Neno hilo linataja sehemu zilizochomoza kama pembe kwenye madhabahu; “pembe” ni tafsiri ya kawaida na sahihi.
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Kirai hiki kinaitambulisha madhabahu inayohusishwa na sadaka ya kuteketezwa.
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: Damu yake iliyobaki ataimwaga
  rationale: Kwa kuwa sehemu ya damu tayari imechukuliwa na kuwekwa kwenye pembe, “iliyobaki” huweka wazi maana inayodokezwa na mfuatano huo.
- source_word: אֶל יְסוֹד
  choice: kwenye msingi
  rationale: יְסוֹד ni sehemu ya chini au msingi wa madhabahu; “kwenye msingi” huonyesha mahali damu inapomwagwa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria ya dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Katika muktadha huu neno linataja dhabihu, si dhambi kama dhana tu. “Sadaka ya dhambi” huhifadhi aina ya dhabihu iliyozoeleka, huku tanbihi ikihifadhi uwezekano halisi kwamba jina hilo linasisitiza kuondoa unajisi au kuleta utakaso.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimepangwa kama hatua za utaratibu wa ibada, huku istilahi za kawaida za Kilawi—“madhabahu,” “pembe,” na “sadaka ya kuteketezwa”—zikihifadhiwa.
