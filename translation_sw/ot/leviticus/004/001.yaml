  rationale: Katika Kiswahili, “kuzungumza na” ndiyo namna ya kawaida ya kuonyesha mtu anayeambiwa, ingawa Kiebrania hutumia kihusishi אֶל, yaani “kwa/kuelekea.”
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivu hii huanzisha yaliyomo katika usemi; “akisema” inadumisha fomula hiyo kwa Kiswahili cha asili bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo; “Yehova” linaonyeshwa kama umbo jingine linalotumiwa.
translation_notes:
