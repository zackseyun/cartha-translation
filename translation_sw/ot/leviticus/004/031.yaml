id: LEV.4.31
reference: Leviticus 4:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: sw
  text: Naye ataondoa mafuta yake yote, kama vile mafuta yanavyoondolewa katika dhabihu ya sadaka za amani[a]. Kuhani atayateketeza juu ya madhabahu kuwa harufu ya kupendeza[b] kwa Yahwe. Kuhani atamfanyia upatanisho, naye atasamehewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “harufu ya kupendeza”; huu ni usemi wa kawaida wa dhabihu unaoonyesha sadaka iliyokubaliwa na Yahwe.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: mafuta yake yote / mafuta
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha mafuta ya mnyama yaliyotengwa kwa ajili ya kuteketezwa madhabahuni. “Mafuta” ni tafsiri ya moja kwa moja na ya kawaida bila kuongeza “sehemu” isiyosemwa wazi.
- source_word: יָסִיר
  choice: ataondoa
  rationale: Hifili ya סור ina maana ya kusababisha kitu kiondolewe. Wakati ujao katika Kiswahili unafaa kwa agizo la utaratibu wa sheria.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: kama vile ... yanavyoondolewa
  rationale: Kauli hii inalinganisha tendo hilo na utaratibu uliowekwa wa sadaka za amani; usemi huu wa Kiswahili ni wa kawaida na hudumisha hali ya kutendwa.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: “Sadaka za amani” hudumisha jina la kundi la dhabihu linalohusishwa moja kwa moja na שְׁלָמִים; “sadaka za ushirika” imewekwa katika tanbihi kama tafsiri mbadala.
- source_word: וְהִקְטִיר
  choice: atayateketeza
  rationale: Katika muktadha wa ibada, kitenzi hiki kinahusu kuyachoma mafuta madhabahuni ili moshi wake upande. “Atayateketeza” ni lugha ya kawaida ya dhabihu na inaeleweka vizuri.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Hii ni tafsiri ya kawaida na ya kiasili ya kueleza mahali mafuta yanapoteketezwa.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: yawe harufu ya kumpendeza
  rationale: Tafsiri hii huhifadhi taswira halisi ya harufu na wazo la dhabihu kukubaliwa na Mungu bila kuigeuza kuwa maelezo ya kitheolojia.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa umbo la Kiswahili “Yahwe,” kwa kufuata ushahidi wa maandishi na mtindo wa POB unaolitaja jina hilo.
- source_word: וְכִפֶּר עָלָיו
  choice: Kuhani atamfanyia upatanisho
  rationale: “Kumfanyia upatanisho” huhifadhi lugha ya ibada ya כפר na uhusiano wa kitendo cha kuhani kwa ajili ya mtu huyo bila kuingiza maelezo ya baadaye ya kimadhehebu.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: 'Kauli hii ya kutendwa ni ya kawaida katika Kiswahili na hudumisha matokeo yanayotajwa na Kiebrania: mtu huyo hupokea msamaha.'
theological_decisions:
- issue: Uhusiano kati ya upatanisho wa kikuhani na msamaha katika וְכִפֶּר עָלָיו ... וְנִסְלַח לוֹ
  choice: Kuhani atamfanyia upatanisho, naye atasamehewa.
  alternative: Kuhani atafanya upatanisho kwa ajili yake, na atasamehewa.
  rationale: Tafsiri inadumisha dai la maandishi kwamba tendo la kikuhani la upatanisho linafuatiwa na msamaha, bila kufafanua utaratibu wake kwa mfumo wa mafundisho usiotajwa katika aya.
- issue: Taswira ya לְרֵיחַ נִיחֹחַ
  choice: harufu ya kumpendeza Yahwe
  alternative: harufu nzuri kwa Yahwe
  rationale: “Ya kumpendeza” huonyesha kukubalika kwa dhabihu huku ikihifadhi taswira ya harufu; haisemi kwamba Mungu hufurahia moshi kwa maana ya kimwili tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wenye heshima na unaoeleweka. Sentensi zimegawanywa ili kuepuka mnyororo mzito wa viunganishi, huku kila וְ ya hatua kuu ikiwakilishwa kwa mwendelezo wa kawaida wa Kiswahili. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
