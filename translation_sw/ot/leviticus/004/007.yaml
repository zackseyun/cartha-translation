  naturalness: Kiswahili cha rasimu kinaeleweka, lakini kishazi “iliyo mbele za Yahwe ndani ya Hema” kinaweza kusikika kana kwamba “mbele za Yahwe” ndicho kinachorekebishwa na “ndani ya Hema.” Muundo uliorekebishwa unatenganisha mahusiano hayo. “Chini ya madhabahu” ni usemi wa kawaida na wazi zaidi hapa kuliko “kwenye msingi wa madhabahu.”
