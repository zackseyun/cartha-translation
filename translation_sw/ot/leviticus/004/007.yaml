id: LEV.4.7
reference: Leviticus 4:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: sw
  text: Kuhani ataweka sehemu ya damu kwenye pembe za madhabahu ya uvumba wa manukato iliyo ndani ya Hema la Kukutania, mbele za Yahwe[a]. Kisha ataimwaga damu yote ya fahali[b] chini ya madhabahu ya sadaka ya kuteketezwa, iliyo mlangoni mwa Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahwe ni jina la Mungu linalowakilishwa kwa herufi יהוה (YHWH) katika Kiebrania; kwa kawaida pia hutafsiriwa “BWANA.”
    reason: divine_name
  - marker: b
    text: Kiebrania kinasema kihalisi “damu yote ya fahali.” Katika muktadha, hii ni damu inayobaki baada ya sehemu yake kuwekwa kwenye pembe za madhabahu.
    reason: contextual_clarification
lexical_decisions:
- source_word: וְנָתַן
  choice: ataweka
  rationale: Kitenzi נתן kina maana pana ya kutoa, kuweka au kutia. Katika agizo hili la ibada, “ataweka” kinaeleza tendo bila kuongeza namna ambayo damu iliwekwa.
- source_word: מִן הַדָּם
  choice: sehemu ya damu
  rationale: מן limetumiwa kwa maana ya kugawa sehemu; kwa hiyo kifungu kinamaanisha kiasi fulani cha damu, si chanzo tu.
- source_word: קַרְנוֹת
  choice: pembe
  rationale: Hili ndilo neno la kawaida la sehemu zilizochomoza kwenye pembe za madhabahu na linahifadhi taswira ya Kiebrania.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: madhabahu ya uvumba wenye harufu nzuri
  rationale: קְטֹרֶת ni uvumba, na הַסַּמִּים inaonyesha viungo vyenye harufu nzuri. Tafsiri hii ni wazi na inahifadhi maelezo ya mnyororo wa nomino wa Kiebrania.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” huhifadhi maana ya mahali na uwepo katika ibada, huku Yahwe likiwakilisha jina la Mungu katika maandishi ya Kiebrania.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Ni jina linaloeleweka na lililozoeleka kwa hema ambalo Mungu alikutana humo na watu wake.
- source_word: וְאֵת כָּל דַּם הַפָּר
  choice: damu yote ya huyo fahali
  rationale: Hii inafuata moja kwa moja kauli ya Kiebrania “damu yote ya fahali.” Muktadha unaonyesha kuwa ni damu iliyobaki baada ya sehemu yake kuwekwa kwenye pembe, jambo linalofafanuliwa katika tanbihi badala ya kuongezwa kimya kimya kwenye maandishi.
- source_word: יִשְׁפֹּךְ
  choice: ataimwaga
  rationale: שׁפך hueleza kumwaga kimiminika; “ataimwaga” ni ya kawaida, wazi na yenye uzito unaofaa agizo la ibada.
- source_word: אֶל יְסוֹד
  choice: kwenye msingi
  rationale: יְסוֹד ni msingi au sehemu ya chini inayotegemeza madhabahu. “Kwenye msingi” linaeleza mahali damu ilipomwagwa kwa Kiswahili cha kawaida.
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Hili linatofautisha madhabahu ya nje ya sadaka ya kuteketezwa na madhabahu ya uvumba iliyotajwa mwanzoni.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu, יהוה. “Yahwe” huhifadhi jina hilo badala ya kulibadili kuwa cheo, huku tanbihi ikieleza desturi nyingine ya tafsiri.
- issue: Maana ya “damu yote ya fahali” baada ya sehemu ya damu kutumiwa
  choice: damu yote ya huyo fahali
  alternative: damu yote iliyobaki ya huyo fahali
  rationale: Kiebrania hakisemi wazi “iliyobaki,” ingawa mfuatano wa ibada unadokeza hivyo. Maandishi yanahifadhi kauli ya chanzo, na tanbihi inaeleza maana inayotokana na muktadha bila kufuta mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumiwa ili kuonyesha hatua mbili za ibada kwa uwazi. Majina ya vifaa vya ibada yamehifadhiwa bila kuingiza msamiati wa dhehebu maalumu.
