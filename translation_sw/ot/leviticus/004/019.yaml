translation:
  language: sw
  text: Naye ataondoa mafuta yake yote kutoka kwake, na kuyateketeza juu ya madhabahu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “na kuyafanya yapande kwa moshi juu ya madhabahu.” Kitenzi cha Kiebrania hutumiwa hasa katika mazingira ya dhabihu, si kwa kuchoma kitu tu kwa kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Naye
  rationale: Kiunganishi kinaendeleza mfululizo wa matendo ya ibada; ‘Naye’ huunganisha tendo hili kwa kawaida na mstari uliotangulia.
- source_word: כָּל
  choice: yote
  rationale: 'Neno hili linaonyesha ujumla: mafuta yote yaliyokusudiwa yanapaswa kuondolewa.'
- source_word: חֶלְבּוֹ
  choice: mafuta yake
  rationale: Kiambishi kinarejelea mnyama wa dhabihu, na ‘mafuta’ ni istilahi ya kawaida kwa sehemu za mafuta zilizotengwa kwa ajili ya kuteketezwa madhabahuni.
- source_word: יָרִים
  choice: ataondoa
  rationale: Hifili ya רום ina maana ya kuinua au kuondoa; katika muktadha huu ni kuondoa mafuta kutoka kwa mnyama ili yatolewe madhabahuni.
- source_word: מִמֶּנּוּ
  choice: kutoka humo
  rationale: Kishazi hiki kinaonyesha kutenganishwa na mwili wa mnyama. ‘Kutoka humo’ ni Kiswahili cha kawaida kisichomfanya mnyama asikike kama mtu.
- source_word: וְהִקְטִיר
  choice: na kuyateketeza
  rationale: Katika lugha ya dhabihu, הקטיר humaanisha kufanya sehemu ya sadaka ipande kwa moshi. ‘Kuyateketeza’ ni ya kawaida na inaeleweka, huku tanbihi ikihifadhi maana maalumu ya kiibada.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Ingawa tamati ya mwelekeo inaweza kudokeza kuelekea madhabahuni, pamoja na הקטיר kishazi kinaonyesha mahali mafuta yanapoteketezwa; ‘juu ya madhabahu’ ni usemi wa kawaida.
