source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: sw
  text: Ikiwa kuhani aliyetiwa mafuta[a] atatenda dhambi na hivyo kuwaletea watu hatia[b], basi kwa ajili ya dhambi aliyotenda atamtolea Yahwe fahali wa kundi la ng’ombe, asiye na dosari, kuwa sadaka ya dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhani mkuu aliyetiwa mafuta.” Kiebrania kinasema kihalisi, “kuhani aliyetiwa mafuta.”
    reason: alternative_reading
  - marker: b
    text: Au, “kwa hatia ya watu.” Kirai cha Kiebrania ni kifupi na kinaweza kusisitiza kwamba dhambi ya kuhani husababisha hatia inayowaathiri watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: kuhani aliyetiwa mafuta
  rationale: Hufuata moja kwa moja maana ya ‘kuhani, aliyetiwa mafuta’ bila kuongeza cheo cha ‘kuhani mkuu,’ ambacho hakitajwi wazi katika Kiebrania.
- source_word: יֶחֱטָא
  choice: atatenda dhambi
  rationale: 'Katika sentensi ya sharti inayoanza na אִם, kauli hii inaelezwa kwa kawaida kama tukio linalowezekana: ‘ikiwa ... atatenda dhambi.’'
- source_word: לְאַשְׁמַת הָעָם
  choice: na hivyo kuwaletea watu hatia
  rationale: Kirai hiki kifupi kinaonyesha kuwa dhambi ya kuhani ina matokeo ya hatia kwa watu; ‘na hivyo’ huonyesha matokeo hayo bila kufafanua zaidi utaratibu wake.
- source_word: וְהִקְרִיב
  choice: atamtolea
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuleta au kuwasilisha mnyama kama toleo kwa Mungu. ‘Atamtolea’ ni ya kawaida na huonyesha mpokeaji, Yahwe.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: kwa ajili ya dhambi aliyotenda
  rationale: Huwasilisha kwa uwazi kosa ambalo dhabihu inatolewa kwa ajili yake, huku ikihifadhi marudio ya wazo la dhambi katika Kiebrania.
- source_word: פַּר בֶּן בָּקָר
  choice: fahali wa kundi la ng’ombe
  rationale: Hutambulisha mnyama kuwa fahali wa mifugo ya ng’ombe bila kulazimisha maana ya umri mdogo ambayo si lazima iwe lengo la kirai.
- source_word: תָּמִים
  choice: asiye na dosari
  rationale: Ni usemi wa kawaida na sahihi katika sheria za dhabihu kwa mnyama asiye na kasoro inayomfanya asikubalike.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa namna ya Kiswahili kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חַטָּאת humaanisha pia sadaka inayotolewa kwa sababu ya dhambi; tafsiri hii inaweka wazi kazi yake ya kiibada.
theological_decisions:
- issue: Ikiwa הַכֹּהֵן הַמָּשִׁיחַ itafsiriwe kama ‘kuhani aliyetiwa mafuta’ au ‘kuhani mkuu aliyetiwa mafuta’
  choice: kuhani aliyetiwa mafuta
  alternative: kuhani mkuu aliyetiwa mafuta
  rationale: Ingawa katika muktadha kuhani huyu anaweza kuwa kuhani mkuu, maandishi yenyewe hayatumii neno tofauti la ‘mkuu.’ Tafsiri kuu huhifadhi usemi wa chanzo, na maelezo ya chini yanataja uelewa mwingine.
- issue: Jinsi ya kueleza matokeo ya kijamii katika לְאַשְׁמַת הָעָם
  choice: na hivyo kuwaletea watu hatia
  alternative: hata watu wakawa na hatia
  rationale: Chaguo hili linahifadhi ukweli kwamba dhambi ya kuhani ina athari ya hatia kwa jamii, bila kuamua kwa undani namna hatia hiyo inavyowafikia watu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa sheria ya sharti umehifadhiwa kwa ‘Ikiwa ... basi,’ huku istilahi za kiibada ‘sadaka ya dhambi’ na ‘asiye na dosari’ zikitumiwa kwa uthabiti.
