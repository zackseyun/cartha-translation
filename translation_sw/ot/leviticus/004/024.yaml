id: LEV.4.24
reference: Leviticus 4:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: sw
  text: Naye ataweka mkono wake juu ya kichwa cha huyo beberu na kumchinja mahali ambapo wanachinja sadaka ya kuteketezwa mbele za Yahwe. Hiyo ni sadaka ya dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha “dhambi” au sadaka inayohusiana na kuondoa dhambi au unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: ataweka mkono wake
  rationale: Kirai hiki kinaeleza tendo la ibada la kuweka mkono mmoja juu ya mnyama; umoja wa יָדוֹ umehifadhiwa.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: juu ya kichwa cha huyo beberu
  rationale: שָׂעִיר hapa ni mbuzi dume wa sadaka. ‘Beberu’ ni neno la kawaida la Kiswahili kwa mbuzi dume, na ‘huyo’ humrejelea mnyama aliyetajwa katika muktadha.
- source_word: וְשָׁחַט אֹתוֹ
  choice: na kumchinja
  rationale: ‘Kuchinja’ huonyesha kwa usahihi tendo la kuchinja mnyama katika mazingira ya dhabihu kuliko neno la jumla ‘kuua’.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: mahali ambapo wanachinja
  rationale: Muundo wa kutenda wa Kiebrania umehifadhiwa kwa nafsi isiyotajwa wazi ‘wanachinja’, ambayo ni ya kawaida katika Kiswahili.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno lililo wazi na linalotambulika katika Kiswahili kwa sadaka inayoteketezwa yote; maana ya msingi ya ‘kupanda’ haijalazimishwa katika maandishi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: ‘Mbele za’ ni usemi wa heshima na wa kawaida katika lugha ya Biblia; jina la agano יְהוָה limetoholewa kama ‘Yahwe’.
- source_word: חַטָּאת הוּא
  choice: Hiyo ni sadaka ya dhambi
  rationale: Kishazi hiki kinaitambulisha dhabihu kuwa aina maalumu ya sadaka. ‘Sadaka ya dhambi’ ni tafsiri inayoeleweka, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kiibada ya חַטָּאת
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kuhusishwa na dhambi na pia na kuondoa unajisi. Tafsiri iliyozoeleka imewekwa katika maandishi, na uwezekano wa maana ya utakaso umeonyeshwa katika tanbihi bila kuondoa mvutano wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sentensi inafuata kwa karibu mpangilio wa Kiebrania huku ikitumia miundo asilia ya Kiswahili.
