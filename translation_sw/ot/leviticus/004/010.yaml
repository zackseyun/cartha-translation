  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa “dhabihu ya sadaka za amani” umehifadhiwa kwa sababu unaakisi kikamilifu kirai cha Kiebrania, ingawa ni mzito kidogo kuliko “sadaka ya amani.” Alama ya tanbihi [a] imewekwa moja kwa moja baada ya neno linalohusika.
