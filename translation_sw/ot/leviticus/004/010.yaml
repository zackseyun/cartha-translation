  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: sw
  text: kama inavyoondolewa[a] kutoka kwa ng’ombe wa sadaka ya amani, kuhani ataziteketeza juu ya madhabahu ya sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na neno la Kiebrania, “inavyoinuliwa.” Kitenzi hicho hudokeza kuondolewa au kuinuliwa kwa sehemu zinazotolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Inaonyesha ulinganisho wa utaratibu huu na ule wa sadaka za amani uliotajwa kabla.
- source_word: יוּרַם
  choice: yanavyoondolewa
  rationale: Ingawa kitenzi cha Kiebrania kimsingi huhusisha kuinuliwa, katika muktadha huu kinaeleza kuondolewa kwa sehemu za mafuta kutoka kwa mnyama ili zitolewe madhabahuni. Wingi wa Kiswahili unarejelea sehemu hizo za mafuta na pia unapatana na kiambishi cha wingi katika וְהִקְטִירָם.
- source_word: מִשּׁוֹר
  choice: kutoka kwa ng’ombe
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe; “ng’ombe” ni neno la kawaida na linalofaa kwa Kiswahili bila kulazimisha jinsia ambayo neno hili pekee haliitaji hapa.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: 'Tafsiri hii inahifadhi vipengele vyote viwili vya kirai cha Kiebrania: זֶבַח kama “dhabihu” na הַשְּׁלָמִים kama istilahi ya “sadaka za amani,” bila kukifasiri kimadhehebu kuwa sadaka ya ushirika.'
- source_word: וְהִקְטִירָם
  choice: kisha kuhani atayateketeza
  rationale: Katika ibada za dhabihu, קטר hueleza kuchoma sehemu hizo juu ya madhabahu. “Atayateketeza” ni lugha ya kawaida ya kibiblia ya Kiswahili na inaonyesha kuwa vitu vinavyorejelewa ni sehemu za mafuta.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hii ndiyo tafsiri ya kawaida ya mhudumu wa ibada anayetajwa hapa.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: juu ya madhabahu ya sadaka ya kuteketezwa
  rationale: Inahifadhi jina la madhabahu linalohusishwa na עֹלָה, yaani sadaka inayoteketezwa.
