  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: sw
  text: na dhambi waliyoitenda ikijulikana[a], kusanyiko litamtoa fahali kutoka katika kundi la ng’ombe kuwa sadaka ya dhambi na kumleta mbele ya hema la kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kiebrania חַטָּאת (ḥaṭṭā’t) limetumiwa mara mbili katika aya hii: kwanza likimaanisha “dhambi,” kisha likimaanisha “sadaka ya dhambi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: ikijulikana
  rationale: Kauli ya Niphal ya ידע inaonyesha dhambi kufikia hali ya kujulikana bila kutaja aliyeifanya ijulikane; muundo wa masharti unaendana na muktadha wa aya iliyotangulia.
- source_word: הַחַטָּאת
  choice: dhambi
  rationale: Kishazi kinachofuata, ‘waliyoitenda,’ kinaonyesha hapa kuwa neno hili linamaanisha kosa lenyewe, si dhabihu.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: waliyoitenda
  rationale: Hii ni Kiswahili cha kawaida kwa dhambi iliyofanywa na kusanyiko, bila kutafsiri kihalisi kihusishi עַל ambacho ni sehemu ya muundo wa Kiebrania.
- source_word: הַקָּהָל
  choice: kusanyiko
  rationale: Neno hili linaonyesha jumuiya iliyokusanyika katika muktadha wa kisheria na kiibada, bila kulifanya kuwa istilahi mahsusi ya kanisa.
- source_word: וְהִקְרִיבוּ
  choice: litamleta
  rationale: Hiphil ya קרב katika muktadha wa dhabihu humaanisha kuwasilisha au kuleta dhabihu karibu; ‘litamleta’ ni ya kawaida na pia huweka wazi kuwa fahali ndiye anayeletwa kama sadaka.
- source_word: פַּר בֶּן בָּקָר
  choice: fahali kutoka kundini
  rationale: Hii huwasilisha kwa Kiswahili cha kawaida kuwa mnyama ni fahali wa ng’ombe wa kufugwa; tafsiri ya neno kwa neno ‘mwana wa ng’ombe’ ingekuwa ngumu na ingeweza kupotosha.
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Katika matumizi haya חַטָּאת ni aina ya dhabihu, tofauti na maana ya ‘dhambi’ katika sehemu ya kwanza ya aya.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: nao watamleta
  rationale: Hiphil ya בוא ni ‘kuleta’; kiwakilishi kinamrejelea fahali, na kurejesha kiima kwa ‘nao’ kunafuata wazi mpangilio wa Kiebrania.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: mbele ya hema la kukutania
  rationale: Huu ni usemi sahihi na unaoeleweka kwa mahali pa ibada palipoitwa אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Maana mbili za חַטָּאת katika aya moja
  choice: Kutafsiri matumizi ya kwanza ‘dhambi’ na ya pili ‘sadaka ya dhambi’
  alternative: Kutumia ‘sadaka ya utakaso’ kwa matumizi ya pili, au kutafsiri matumizi yote mawili kwa neno moja
  rationale: Kishazi ‘waliyoitenda’ kinahitaji maana ya kosa katika matumizi ya kwanza, ilhali לְחַטָּאת linataja aina ya dhabihu. Kutofautisha maana hizo hudumisha matumizi ya kimuktadha bila kuondoa uhusiano wa kileksia, ambao umeelezwa katika tanbihi.
- issue: Uhusiano wa kisintaksia wa וְנוֹדְעָה na agizo linalofuata
  choice: Kutumia muundo wa masharti ‘ikijulikana’
  alternative: ‘na dhambi ... inajulikana, ndipo’
  rationale: Aya hii inaendeleza sharti lililoanza katika muktadha uliotangulia; muundo wa ‘ikijulikana’ ni wa asili katika Kiswahili na hauongezi mtendaji wa kuifanya dhambi ijulikane.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. ‘Kusanyiko’ limechaguliwa badala ya neno lenye maana mahsusi ya dhehebu; ‘hema la kukutania’ linatunza taswira halisi ya אֹהֶל מוֹעֵד. Muundo umeunganisha aya na sharti la muktadha uliotangulia huku ukidumisha mpangilio wa agizo la dhabihu.
