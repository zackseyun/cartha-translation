id: LEV.4.13
reference: Leviticus 4:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: sw
  text: “Ikiwa jumuiya yote ya Israeli itatenda dhambi bila kukusudia[a], na jambo hilo limefichika machoni pa kusanyiko[b], nao wakafanya mojawapo ya mambo yote ambayo Yahweh ameamuru yasifanywe[c], wakawa na hatia,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kinamaanisha kukosea au kutenda dhambi bila kukusudia, si kuasi kwa makusudi.
    reason: cultural_note
  - marker: b
    text: Kwa Kiebrania, “limefichika machoni pa kusanyiko”; yaani, jambo hilo halikutambuliwa na jumuiya.
    reason: lexical_alternative
  - marker: c
    text: Au, “nao wakafanya jambo moja kinyume na mojawapo ya amri zote za Yahweh kuhusu mambo yasiyopaswa kufanywa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: jumuiya ya Israeli
  rationale: “Jumuiya” huonyesha jamii yote ya Israeli katika muktadha huu wa sheria na pia hutofautisha עֵדָה na הַקָּהָל inayotokea baadaye katika mstari.
- source_word: יִשְׁגּוּ
  choice: itatenda dhambi bila kukusudia
  rationale: Katika sheria za dhabihu, kitenzi שׁגה kinaelekeza kwenye kosa au dhambi ya kutokukusudia, si uasi wa makusudi.
- source_word: וְנֶעְלַם דָּבָר
  choice: jambo hilo limefichika
  rationale: Tafsiri hii inadumisha hali ya kutendwa ya Kiebrania na wazo kwamba kosa hilo halikutambuliwa.
- source_word: מֵעֵינֵי הַקָּהָל
  choice: machoni pa kusanyiko
  rationale: Hifadhi taswira ya Kiebrania inayotumia “macho” kumaanisha ufahamu au utambuzi; “kusanyiko” linatofautishwa na “jumuiya” ya mwanzo wa mstari.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת
  choice: wakafanya mojawapo ya mambo yote ambayo ... ameamuru
  rationale: Uundaji huu unaonyesha kutenda tendo moja lililokatazwa miongoni mwa mambo yanayohusiana na amri za Yahweh, bila kuugeuza moja kwa moja kuwa usemi wa “kuvunja amri.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: ambayo ... ameamuru yasifanywe
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida nguvu ya katazo la uundaji wa Kiebrania.
- source_word: וְאָשֵׁמוּ
  choice: wakawa na hatia
  rationale: Kitenzi kinaonyesha kuingia katika hali ya kuwa na hatia kutokana na tendo hilo, bila kuingiza mapema lugha ya upatanisho.
theological_decisions:
- issue: Aina ya dhambi inayomaanishwa na שׁגה
  choice: dhambi ya kutokukusudia
  alternative: kukosea; kupotoka
  rationale: Muktadha wa Walawi 4 unahusu makosa yaliyofanywa bila kukusudia. Tafsiri hii inadumisha tofauti hiyo ya kisheria na kitheolojia bila kuifanya kuwa uasi wa makusudi.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano lenyewe; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וְאָשֵׁמוּ
  choice: wakawa na hatia
  alternative: wakajiletea hatia; wakahesabiwa kuwa na hatia
  rationale: Chaguo hili linaonyesha hali ya hatia inayotokana na kosa, huku likiepuka kufafanua zaidi namna ya kuhesabiwa au kuondolewa kwa hatia hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. “Jumuiya” na “kusanyiko” zimetumika kutofautisha עֵדָה na קָהָל; taswira ya “machoni” imehifadhiwa na kufafanuliwa katika tanbihi.
