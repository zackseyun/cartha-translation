base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: sw
  text: na figo mbili, na mafuta yaliyo juu ya figo hizo, yaliyo kwenye viuno, na kiambatisho kilicho juu ya ini[a]—atakiondoa pamoja na figo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, sehemu ya ini. Neno la Kiebrania linalotaja sehemu hii ya mwili halina maana iliyo hakika kabisa; “kiambatisho” ni tafsiri ya tahadhari.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: figo mbili
  rationale: Hutafsiri moja kwa moja idadi na kiungo kinachotajwa katika maagizo ya dhabihu.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha sehemu za mafuta zilizotengwa kwa ajili ya kutolewa; “mafuta” ni wazi na la kawaida kwa msomaji wa sasa.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: yaliyo juu ya figo hizo
  rationale: Kurudia “figo hizo” huondoa utata wa kiwakilishi na kubaki karibu na uhusiano wa kimaumbile katika Kiebrania.
- source_word: הַכְּסָלִים
  choice: viuno
  rationale: Neno hili linaelekeza eneo la viuno au pembeni mwa kiwiliwili; “viuno” ni la kawaida na linafaa katika maelezo haya ya kimaumbile.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: kiambatisho kilicho juu ya ini
  rationale: Hili ni jina la sehemu ya mwili lisilo na uhakika kamili. “Kiambatisho” huepuka kudai kwa usahihi usiothibitishwa kwamba ni sehemu gani hasa ya ini, huku “kilicho juu ya ini” kikihifadhi kihusishi cha Kiebrania.
- source_word: עַל הַכְּלָיוֹת
  choice: pamoja na figo
  rationale: Katika kanuni hii ya dhabihu, kirai kinaonyesha kwamba kiambatisho hicho kinaondolewa pamoja na figo; tafsiri hii inaeleza kitendo cha ibada kwa Kiswahili cha kawaida.
- source_word: יְסִירֶנָּה
  choice: atakiondoa
  rationale: Kitenzi kinaamuru kuondolewa kwa sehemu iliyotajwa. Kiambishi cha umoja wa ngeli ya KI kinarejelea “kiambatisho” na kuhifadhi umoja wa kiwakilishi tamati cha Kiebrania.
