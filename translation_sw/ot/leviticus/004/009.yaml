translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ya ibada ulio rasmi lakini unaoeleweka. Mstari umeanza kwa “na” ili kuhifadhi mwendelezo wake na sentensi ya mstari uliotangulia. Alama ya tanbihi imewekwa baada ya kirai chenye neno tata la kimaumbile.
