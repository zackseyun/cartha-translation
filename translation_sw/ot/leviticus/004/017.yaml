  rationale: Marekebisho yanaweka vitenzi vya utaratibu katika muundo sambamba wa wakati ujao, yanatumia usemi wa kawaida wa Kiswahili kwa tendo la kuchovya, na yanaondoa urudiaji pamoja na mwelekeo ulioongezwa katika kifungu cha mahali. Neno "damu" kama yambwa la kunyunyiza linaeleweka kutoka muktadha na haliongezi maana mpya.
