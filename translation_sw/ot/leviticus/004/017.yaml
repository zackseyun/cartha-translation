  naturalness: Baada ya kitenzi chenye wakati 'atachovya,' muundo 'na kunyunyiza' si sambamba kwa Kiswahili Sanifu; 'na atanyunyiza' ni wa kawaida. 'Katika sehemu ya damu' pia ni mzito na si usemi wa kawaida; 'katika damu' hutoa maana ya tendo kwa ufasaha bila kudokeza kiasi chote cha damu.
  terminology: '''Kuhani,'' ''kidole chake,'' ''mara saba,'' ''Yahwe,'' na ''pazia'' zinafaa. ''Pazia'' ni istilahi iliyo wazi kwa פָּרֹכֶת; ''sitara'' yaweza kubaki katika tanbihi kama mbadala.'
