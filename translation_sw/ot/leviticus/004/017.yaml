base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: sw
  text: Kisha kuhani atachovya kidole chake katika damu, na atanyunyiza damu mara saba mbele za Yahwe, mbele ya pazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitara.” Neno la Kiebrania linarejelea pazia la mahali patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: Kisha ... atachovya
  rationale: Kitenzi טבל humaanisha kuchovya au kutumbukiza. “Kisha” linaonyesha mfuatano wa hatua za ibada, na wakati ujao unafaa kwa maagizo ya utaratibu.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya כהן katika sheria za dhabihu.
- source_word: אֶצְבָּעוֹ
  choice: kidole chake
  rationale: Inahifadhi umoja na kiambishi cha umilikaji cha Kiebrania.
- source_word: מִן הַדָּם
  choice: katika sehemu ya damu
  rationale: מן hapa ina maana ya kuchukua kutoka katika kiasi cha damu; “sehemu ya damu” huepuka kudokeza kwamba damu yote ilihusika.
- source_word: וְהִזָּה
  choice: na kunyunyiza sehemu ya damu
  rationale: Katika taratibu za kikuhani, הזה hueleza kunyunyiza damu. Yambwa lisilotajwa wazi limeelezwa kutokana na muktadha.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי ni kuwa mbele au katika uwepo wa mtu; “mbele za” ni usemi wa heshima na wa kawaida katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetolewa kwa umbo lake la kawaida katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: kuelekea upande wa mbele wa pazia
  rationale: Usemi huo unataja uso au upande wa mbele wa pazia la patakatifu na pia mwelekeo wa kunyunyiza; tafsiri hii inahifadhi maana hiyo bila kudai kwamba damu iligusa pazia.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu. “Yahwe” hulihifadhi badala ya kuliwakilisha kwa cheo.
- issue: Maana ya פָּרֹכֶת
  choice: pazia
  alternative: sitara
  rationale: Neno hilo linamaanisha pazia la patakatifu lililotenga eneo takatifu. “Pazia” ni neno la sasa na linaloeleweka kwa urahisi, huku “sitara” likitajwa kama mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa maagizo ya ibada umehifadhiwa kwa wakati ujao, na sintaksia imefanywa ya kawaida bila kuondoa mwelekeo unaodokezwa na maandishi ya Kiebrania.
