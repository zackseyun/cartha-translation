base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: sw
  text: Kiongozi[a] akitenda dhambi kwa kufanya bila kukusudia[b] jambo mojawapo kati ya mambo yaliyokatazwa katika amri zote za Yahwe, Mungu wake, naye akawa na hatia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuu” au “mtawala”; neno la Kiebrania נָשִׂיא humaanisha kiongozi au mkuu anayetambuliwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kukosea” au “kwa bahati mbaya”; Kiebrania kinamaanisha kosa lisilofanywa kwa kukusudia.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: kiongozi
  rationale: Neno hili humaanisha mkuu au kiongozi anayetambuliwa katika jamii; “kiongozi” linaeleweka kwa urahisi bila kudokeza kwamba lazima awe mwana wa mfalme.
- source_word: יֶחֱטָא
  choice: akitenda dhambi
  rationale: Kitenzi חטא ni neno la kawaida la kutenda dhambi; muundo huu ni wa moja kwa moja na wa asili katika Kiswahili.
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: kwa kufanya ... jambo mojawapo kati ya mambo yote
  rationale: Huhifadhi maana ya kufanya jambo moja miongoni mwa mambo yaliyokatazwa, huku sentensi ikibaki ya kawaida katika Kiswahili.
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: mambo yote ambayo amri za Yahwe, Mungu wake, zinakataza
  rationale: Huwasilisha kwa lugha ya asili maana ya amri zinazohusu mambo yasiyopaswa kufanywa, na huhifadhi uhusiano wa “Mungu wake.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa uhawilishaji badala ya kubadilishwa kuwa cheo.
- source_word: בִּשְׁגָגָה
  choice: bila kukusudia
  rationale: Katika sheria za dhabihu za Walawi, neno hili linahusu kosa lisilofanywa kwa kukusudia.
- source_word: וְאָשֵׁם
  choice: naye akawa na hatia
  rationale: Huonyesha hali ya kuwa na hatia inayotokana na tendo hilo bila kuongeza ufafanuzi usiokuwamo wazi katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya kosa lisilokusudiwa na hatia
  choice: bila kukusudia ... akawa na hatia
  alternative: alikosea lakini hana hatia
  rationale: Aya inashikilia pamoja kutokukusudia kwa tendo na kuwapo kwa hatia; tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “akitenda” unafaa mtindo wa sheria yenye sharti, na koma ya mwisho inaonyesha kwamba sentensi inaendelea katika aya inayofuata.
