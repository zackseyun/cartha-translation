base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: sw
  text: au akijulishwa dhambi yake aliyotenda,[a] ndipo atakapoleta kama sadaka yake beberu asiye na dosari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata mpangilio wa Kiebrania kwa karibu zaidi, “au dhambi yake aliyotenda ikijulishwa kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ
  choice: au
  rationale: Kiunganishi hiki kinaendeleza shauri la kisheria kutoka mstari uliotangulia kwa kuonyesha uwezekano mwingine.
- source_word: הוֹדַע אֵלָיו
  choice: akijulishwa
  rationale: 'Kauli ya Hophal ina maana ya kutendwa au kusababishiwa kutendwa: taarifa kuhusu kosa inamfikia; si lazima awe amelitambua mwenyewe.'
- source_word: חַטָּאתוֹ
  choice: dhambi yake
  rationale: Hapa neno linamaanisha kosa alilotenda, si sadaka ya dhambi, kama inavyoonyeshwa na kishazi kinachofuata.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: aliyotenda
  rationale: Hiki kinabainisha dhambi inayozungumziwa. Kiswahili cha kawaida hutumia ‘kutenda dhambi’ bila kuhamisha kihusishi cha Kiebrania neno kwa neno.
- source_word: וְהֵבִיא
  choice: ndipo atakapoleta
  rationale: Waw pamoja na kitenzi timilifu katika sheria huonyesha matokeo au hatua inayopaswa kufuata.
- source_word: קָרְבָּנוֹ
  choice: kama sadaka yake
  rationale: Neno linamaanisha kitu kinacholetwa mbele za Mungu kama toleo; ‘sadaka’ ni istilahi ya kawaida na inayoeleweka katika muktadha huu.
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: beberu
  rationale: ‘Beberu’ kwa kawaida humaanisha mbuzi dume, hivyo huwasilisha aina na jinsia ya mnyama kwa ufupi na kwa Kiswahili asilia.
- source_word: תָּמִים
  choice: asiye na dosari
  rationale: Hii ni lugha inayofaa kwa mnyama wa sadaka asiye na kasoro ya mwili.
theological_decisions:
- issue: Maana ya חַטָּאת katika mstari huu
  choice: dhambi/kosa, si sadaka ya dhambi
  alternative: sadaka ya dhambi
  rationale: Kishazi ‘aliyotenda’ kinaonyesha kwamba kinachorejelewa ni kosa lenyewe; sadaka inatajwa kando kwa neno קָרְבָּנוֹ.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti ‘akijulishwa ... ndipo’ unawasilisha uhusiano wa kisheria kwa ufasaha; ‘beberu’ huepuka usemi mzito ‘mbuzi dume’ huku ukihifadhi jinsia iliyotajwa wazi.
