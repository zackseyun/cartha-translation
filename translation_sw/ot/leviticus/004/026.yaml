  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: sw
  text: Naye atateketeza mafuta yake yote juu ya madhabahu, kama mafuta ya dhabihu ya sadaka za amani[a]. Hivyo kuhani atafanya upatanisho kwa ajili yake kwa ajili ya dhambi yake[b], naye atasamehewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania חַטָּאת linaweza kumaanisha “dhambi” au “sadaka ya dhambi”; hapa huenda likamaanisha dhambi ya mtu huyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: mafuta yake
  rationale: חֵלֶב hapa ni sehemu za mafuta ya mnyama zilizotengwa kwa ajili ya kuteketezwa katika ibada. Kiambishi cha umilikaji kimetafsiriwa kwa 'yake,' huku כָּל ikiwakilishwa na 'yote.'
- source_word: יַקְטִיר
  choice: atateketeza
  rationale: Katika muktadha wa dhabihu, Hiphil ya קטר humaanisha kuteketeza sehemu ya dhabihu juu ya madhabahu ili itoe moshi. 'Atateketeza' ni lugha ya kawaida, yenye hadhi, na hudumisha maana ya kitendo cha ibada.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Ingawa umbo la Kiebrania lina mwelekeo wa kwenda madhabahuni, katika Kiswahili cha kawaida tendo la kuteketeza dhabihu husemwa kufanyika 'juu ya madhabahu.'
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: kama mafuta ya dhabihu ya sadaka za amani
  rationale: Maneno haya yanalinganisha utaratibu huu na utaratibu wa mafuta katika sadaka za שְׁלָמִים. 'Sadaka za amani' ni istilahi inayotambulika, huku tanbihi ikihifadhi upana wa maana wa ushirika na ustawi.
- source_word: וְכִפֶּר עָלָיו
  choice: kuhani atafanya upatanisho kwa ajili yake
  rationale: Katika taratibu za kikuhani, כפר inaeleza tendo la kufanya upatanisho bila kulazimisha nadharia fulani ya jinsi upatanisho unavyofanya kazi. 'Kwa ajili yake' huonyesha wazi kuwa tendo hilo linafanywa kwa niaba ya mtu huyo.
- source_word: מֵחַטָּאתוֹ
  choice: kwa sababu ya dhambi yake
  rationale: חַטָּאת inaweza kumaanisha 'dhambi' au 'sadaka ya dhambi.' Hapa muktadha wa kufanya upatanisho kwa ajili ya mtu na kisha kusamehewa kwake unaelekea kumaanisha kosa lake; 'kwa sababu ya' huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: וְנִסְלַח לוֹ
  choice: naye atasamehewa
  rationale: Niphal ya סלח pamoja na ל huonyesha mtu anayepokea msamaha. Kauli tendwa 'atasamehewa' ni ya asili katika Kiswahili na inadumisha hali ya mtendaji wa msamaha kutotajwa wazi.
theological_decisions:
- issue: Tafsiri ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Neno la Kiebrania linaweza kusisitiza amani, ukamilifu au ustawi, na ushirika unaohusiana na dhabihu. 'Sadaka za amani' limetumiwa katika matini kwa kuwa linatambulika, huku tanbihi ikihifadhi uwezekano mwingine wa kimaana.
- issue: Maana ya חַטָּאת katika מֵחַטָּאתוֹ
  choice: dhambi yake
  alternative: sadaka yake ya dhambi
  rationale: Ingawa חַטָּאת hutumika kwa kosa na pia kwa sadaka inayohusiana nalo, sintaksia na kauli inayofuata kuhusu kusamehewa kwa mtu zinaunga mkono zaidi maana ya 'dhambi yake.' Utata wa kileksia umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Istilahi za kiibada kama 'madhabahu,' 'dhabihu,' 'kuhani,' na 'upatanisho' zimedumishwa kwa uwazi na uthabiti. Muundo umefanywa wa asili kwa msomaji wa kawaida bila kufuta utata halisi wa חַטָּאת.
