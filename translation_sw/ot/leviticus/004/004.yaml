  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: sw
  text: Atamleta fahali huyo kwenye mlango wa hema la kukutania[a], mbele za Yahwe[b]. Ataweka mkono wake juu ya kichwa cha fahali huyo, naye atamchinja fahali huyo mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mwingilio wa hema la kukutania.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mbele za Yahwe”; huu ni usemi wa ibada unaoweza kumaanisha “katika uwepo wa Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Atamleta
  rationale: Kauli ya kusababisha ya בוא inaagiza mtoaji amlete mnyama. Wakati ujao wa Kiswahili unafaa kwa maagizo ya ibada katika muktadha huu.
- source_word: הַפָּר
  choice: fahali huyo
  rationale: פַּר humaanisha fahali katika muktadha wa dhabihu. Neno 'huyo' linabainisha mnyama aliyetajwa bila kuongeza wazo la umri ambalo halijaelezwa wazi katika mstari huu.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: mwingilio wa hema la kukutania
  rationale: פֶּתַח ni uwazi au mwingilio, na אֹהֶל מוֹעֵד ni jina la kawaida la mahali patakatifu, lililotafsiriwa kwa lugha ya sasa na inayoeleweka.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי inaweza kumaanisha mbele ya au katika uwepo wa. 'Mbele za Yahwe' ni usemi mfupi wa kiibada unaohifadhi upana huo wa maana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa umbo la Kiswahili 'Yahwe' badala ya kubadilishwa kuwa cheo.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: Ataweka mkono wake juu ya kichwa cha fahali huyo
  rationale: Tafsiri hii inaeleza tendo la kimwili la ibada bila kuamua kimya-kimya kwamba linamaanisha kuhamisha hatia au utambulisho.
- source_word: וְשָׁחַט
  choice: kisha atamchinja
  rationale: שׁחט ni kitenzi maalumu cha kuchinja mnyama wa dhabihu. 'Atamchinja' huhifadhi maana hiyo vizuri kuliko 'atamuua'.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuweka mkono juu ya kichwa cha mnyama
  choice: Kueleza tendo lenyewe bila kulifafanulia maana maalumu ya kiteolojia
  alternative: Kusema wazi kuwa ni ishara ya kujitambulisha na mnyama au kuhamisha hatia
  rationale: Mstari unaagiza tendo hilo lakini hauelezi maana yake kamili; kwa hiyo tafsiri haiongezi hitimisho la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili kwa mtiririko wa asili; viunganishi vya Kiebrania vimetolewa kwa 'kisha' pale panapofaa. Alama zote za tanbihi zimewekwa mahali zinapohusika katika maandishi.
