base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: sw
  text: 'Naye ataondoa kutoka kwa ng’ombe wa sadaka ya dhambi mafuta yake yote: mafuta yanayofunika matumbo, na mafuta yote yaliyo juu ya matumbo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “ng’ombe wa sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha “dhambi” na pia sadaka inayohusiana na kuondoa unajisi au dhambi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: yote
  rationale: Inahifadhi maana jumuishi ya Kiebrania kwamba mafuta yote yaliyokusudiwa kwa ibada yaondolewe.
- source_word: חֵלֶב
  choice: mafuta
  rationale: Katika muktadha huu neno linamaanisha mafuta maalumu ya mnyama yaliyotengwa kwa ajili ya dhabihu; maelezo ya sehemu za mwili yanabainisha zaidi maana hiyo.
- source_word: פַּר הַחַטָּאת
  choice: ng’ombe wa sadaka ya dhambi
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kwamba ng’ombe huyo ndiye mnyama aliyewekwa kwa ajili ya sadaka ya dhambi.
- source_word: יָרִים
  choice: ataondoa
  rationale: Ingawa kitenzi kinaweza kumaanisha kuinua, hapa kinamaanisha kutenga na kuondoa sehemu zilizotajwa katika utaratibu wa dhabihu.
- source_word: מִמֶּנּוּ
  choice: katika huyo ng’ombe
  rationale: Kurejea wazi kwa ng’ombe ni kwa asili zaidi katika Kiswahili kuliko kutumia kiwakilishi kisicho dhahiri, huku maana ya kuondoa kutoka ndani au mwilini mwake ikihifadhiwa.
- source_word: הַמְכַסֶּה
  choice: yanayofunika
  rationale: Kirai cha urejeshi kinaeleza kwa uwazi kazi na mahali pa mafuta hayo.
- source_word: קֶּרֶב
  choice: matumbo
  rationale: Ni neno la kawaida na linaloeleweka kwa viungo vya ndani katika muktadha huu wa anatomia ya dhabihu.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: yaliyo juu ya matumbo
  rationale: Inadumisha maana ya mahali ya עַל na kuitofautisha na mafuta yanayofunika matumbo.
theological_decisions:
- issue: Tafsiri ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: “Sadaka ya dhambi” ni tafsiri inayotambulika na inayofaa katika muktadha huu, lakini tanbihi inadumisha uwezekano wa maana inayosisitiza utakaso bila kuondoa mvutano wa kimaana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Msamiati wa kiibada umewekwa wazi bila kutumia lugha ya kitaalamu kupita kiasi.
