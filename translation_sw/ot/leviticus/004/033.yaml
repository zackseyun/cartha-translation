  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: sw
  text: Naye ataweka mkono wake juu ya kichwa cha sadaka ya dhambi[a], kisha ataichinja kuwa sadaka ya dhambi mahali ambapo sadaka ya kuteketezwa huchinjwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso” katika sehemu zote mbili ambapo “sadaka ya dhambi” imetumiwa; neno la Kiebrania linaweza kumaanisha sadaka inayoshughulikia dhambi na uchafu wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: ataweka
  rationale: Katika muktadha wa dhabihu, kitenzi hiki kinaeleza kuweka au kuegemeza mkono juu ya mnyama. “Ataweka” ni Kiswahili cha kawaida na hakiongezi tafsiri ya maana ya ishara hiyo.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Kiebrania kimetumia umoja wenye kiambishi cha nafsi ya tatu ya kiume; umoja umehifadhiwa.
- source_word: עַל רֹאשׁ
  choice: juu ya kichwa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kiebrania.
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: sadaka ya dhambi / kuwa sadaka ya dhambi
  rationale: חטאת ni jina la sadaka inayohusiana na dhambi na utakaso. “Sadaka ya dhambi” ni istilahi inayoeleweka kwa urahisi; uwezekano wa “sadaka ya utakaso” umehifadhiwa katika tanbihi.
- source_word: וְשָׁחַט
  choice: kisha ataichinja
  rationale: שׁחט ni kitenzi maalumu cha kuchinja mnyama wa dhabihu. “Ataichinja” huhifadhi maana hiyo dhahiri; “kisha” huonyesha hatua inayofuata kwa Kiswahili cha asili.
- source_word: אֹתָהּ
  choice: atai-
  rationale: Kiambishi cha yambwa kinarejelea mnyama anayetolewa kuwa sadaka, na kwa Kiswahili huunganishwa kiasili na kitenzi.
- source_word: בִּמְקוֹם
  choice: mahali ambapo
  rationale: Kirai hiki hutaja mahali palipowekwa kwa tendo la kuchinja.
- source_word: אֲשֶׁר יִשְׁחַט
  choice: huchinjwa
  rationale: Kauli ya kutendwa yenye hali ya mazoea inafaa kwa maagizo ya ibada na haibainishi mtendaji ambaye Kiebrania hakumtaji wazi hapa.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hii ni istilahi ya kawaida ya Kiswahili kwa עֹלָה katika sheria za dhabihu, ingawa neno la Kiebrania pia lina wazo la kupanda juu.
theological_decisions:
- issue: Maana ya חטאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kutaja sadaka inayoshughulikia dhambi na pia uchafu wa kiibada. Tafsiri iliyo katika matini ni ya kawaida na inayoeleweka, huku tanbihi ikihifadhi maana nyingine muhimu bila kuamua mvutano huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa maagizo ya ibada, lakini sentensi imewekwa katika mtiririko wa kawaida wa Kiswahili. Umoja wa “mkono” umehifadhiwa, na istilahi za dhabihu zimetumiwa kwa uthabiti.
