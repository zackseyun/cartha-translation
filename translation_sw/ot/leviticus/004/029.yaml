base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: sw
  text: Naye ataweka mkono wake juu ya kichwa cha sadaka ya dhambi, kisha ataichinja sadaka hiyo ya dhambi mahali pa sadaka ya kuteketezwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חטאת linaweza kumaanisha sadaka inayohusiana na dhambi na utakaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Naye ataweka
  rationale: Katika taratibu za dhabihu, סמך hueleza kuweka au kukandamiza mkono juu ya mnyama. “Ataweka” ni Kiswahili cha kawaida na hudumisha nguvu ya agizo la kiibada.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Kiebrania kina umoja na kiambishi cha nafsi ya tatu ya kiume; kwa hiyo umoja umehifadhiwa.
- source_word: עַל רֹאשׁ
  choice: juu ya kichwa cha
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo maalumu la ibada.
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חטאת humaanisha dhabihu inayohusiana na dhambi na utakaso. “Sadaka ya dhambi” inaeleweka kwa urahisi, huku mbadala wa “sadaka ya utakaso” ukihifadhiwa katika tanbihi.
- source_word: וְשָׁחַט
  choice: kisha ataichinja
  rationale: שחט ni neno la kiufundi la kumchinja mnyama wa dhabihu. “Ataichinja” hudumisha maana hiyo kuliko kitenzi cha jumla kama “ataua”; “kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: בִּמְקוֹם
  choice: mahali pa
  rationale: Kirai kinaonyesha mahali palipowekwa kwa ajili ya tendo hilo. “Mahali pa” ni cha asili na hakidokezi kwamba sadaka moja inachukua nafasi ya nyingine.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno linalotambulika katika Kiswahili kwa dhabihu inayoteketezwa; linawasilisha matumizi ya kiibada ya עלה bila kulazimisha taswira ya kisemantiki ya “kupaa”.
theological_decisions:
- issue: Maana ya חטאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Muktadha unaonyesha sadaka maalumu inayotolewa na kuchinjwa. “Sadaka ya dhambi” ni wazi na inayofahamika, lakini neno la Kiebrania linaweza pia kusisitiza kazi ya utakaso; uwezekano huo umeonyeshwa katika tanbihi bila kuamua mvutano kimyakimya.
- issue: Nguvu ya vitenzi vya Kiebrania katika utaratibu wa kisheria na kiibada
  choice: ataweka ... ataichinja
  alternative: akaweka ... akaichinja
  rationale: Ingawa maumbo yanaweza kuwa ya usimulizi, hapa yanatoa utaratibu unaopaswa kufuatwa. Wakati ujao katika Kiswahili huwasilisha agizo hilo kwa kawaida na kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa katika mtindo wa maagizo ya kiibada; istilahi rahisi na zinazotambulika zimetumiwa, huku utata halisi wa חטאת ukihifadhiwa kwa tanbihi.
