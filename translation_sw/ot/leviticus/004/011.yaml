  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: sw
  text: Lakini ngozi ya huyo ng’ombe dume, na nyama yake yote, pamoja na kichwa chake, miguu yake, matumbo yake, na kinyesi chake—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹר
  choice: ngozi
  rationale: “Ngozi” ni neno la kawaida na sahihi kwa ngozi ya mnyama, hata baada ya kuchinjwa; Kiswahili hakihitaji kutofautisha hapa kati ya ‘skin’ na ‘hide.’
- source_word: הַפָּר
  choice: huyo ng’ombe dume
  rationale: פַּר humaanisha ng’ombe dume, mara nyingi akiwa bado kijana. “Ng’ombe dume” ni wazi na haiongezi umri ambao mstari huu hauusisitizi.
- source_word: כָּל בְּשָׂרוֹ
  choice: nyama yake yote
  rationale: Katika muktadha wa mnyama aliyechinjwa, “nyama” ni tafsiri ya asili ya בָּשָׂר na huhifadhi maana yake halisi kuliko “mwili.”
- source_word: עַל רֹאשׁוֹ
  choice: kichwa chake
  rationale: עַל katika orodha hii inaonyesha kuwa kichwa kinajumuishwa pamoja na sehemu nyingine; Kiswahili cha asili hakihitaji kurudia ‘pamoja na’ kabla ya kila kiungo.
- source_word: וְעַל כְּרָעָיו
  choice: miguu yake
  rationale: כְּרָעַיִם hapa ni miguu au sehemu za chini za miguu ya mnyama; “miguu” inaeleweka kwa urahisi na inafaa katika orodha.
- source_word: וְקִרְבּוֹ
  choice: matumbo yake
  rationale: Katika muktadha wa anatomia ya dhabihu, קֶרֶב hurejelea sehemu za ndani; “matumbo” ni neno la kawaida na lenye picha halisi kwa wasomaji wa kisasa.
- source_word: וּפִרְשׁוֹ
  choice: kinyesi chake
  rationale: פֶּרֶשׁ humaanisha kinyesi kilichomo ndani ya mnyama. “Kinyesi” ni sahihi na hakichanganyi maana hii na matumbo au viungo vingine vya ndani.
