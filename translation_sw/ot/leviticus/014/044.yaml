  naturalness: Kiswahili cha rasimu kwa jumla kinaeleweka, lakini “Ikiwa kweli ... huo ni” si mtiririko bora zaidi wa hatua ya ukaguzi. Muundo “akiona kwamba ...” ni wa kawaida katika maelekezo ya kiutaratibu. Pia “hiyo” huepuka kutokubaliana kwa ngeli kunakotokea kati ya “doa” na “huo.”
