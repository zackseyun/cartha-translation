translation:
  language: sw
  text: Kisha kuhani atakuja kukagua; akiona kwamba doa limeenea ndani ya nyumba, hiyo ni hali ya unajisi inayoharibu katika nyumba; nyumba hiyo ni najisi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: Kisha ... atakuja
  rationale: Katika sheria hii, umbo hili linaendeleza hatua inayofuata ya utaratibu, si simulizi rahisi la wakati uliopita.
- source_word: וְרָאָה
  choice: na kukagua
  rationale: Kitenzi humaanisha kuona, lakini hapa kuhani anafanya uchunguzi rasmi ili kutoa uamuzi.
- source_word: וְהִנֵּה
  choice: Ikiwa kweli
  rationale: Katika utaratibu huu, neno hilo linaanzisha hali iliyothibitishwa na ukaguzi; tafsiri hii ni ya asili kuliko ‘tazama’.
- source_word: פָּשָׂה הַנֶּגַע
  choice: doa limeenea
  rationale: פָּשָׂה huonyesha kuenea, na נֶגַע hapa ni dalili au doa linaloonekana katika jengo, bila kulifanya kuwa utambuzi wa kitabibu.
- source_word: צָרַעַת
  choice: ukungu
  rationale: Kwa kuwa hali hii imo katika nyumba, ‘ukungu’ inaeleweka kwa msomaji wa kawaida kuliko ‘ukoma’; tanbihi inaweka wazi kwamba neno la Kiebrania ni jamii pana ya unajisi na si utambuzi mahususi wa kisasa.
- source_word: מַמְאֶרֶת
  choice: unaoharibu
  rationale: Huwasilisha hali kali, yenye kula au kuharibu, bila kuingiza maana ya kitabibu ya ‘saratani’.
- source_word: טָמֵא הוּא
  choice: nyumba hiyo ni najisi
  rationale: ‘Najisi’ ni istilahi ya kawaida ya hadhi ya kiibada katika sheria za Walawi; kiwakilishi kimefafanuliwa kuwa nyumba ili rejeo liwe wazi kwa Kiswahili.
theological_decisions:
- issue: Maana ya צָרַעַת inapotumiwa kuhusu nyumba
  choice: Kutumia ‘ukungu’ katika matini na kueleza upana wa neno la Kiebrania katika tanbihi
  alternative: ukoma; ugonjwa wa ngozi; hali ya unajisi
  rationale: Neno hilo hapa haliwezi kumaanisha ugonjwa wa ngozi wa binadamu, kwa kuwa linaihusu nyumba. Tafsiri ya kimuktadha huepuka kuitambulisha kimakosa na ugonjwa wa Hansen, huku tanbihi ikihifadhi uhusiano wake na jamii pana ya unajisi katika Walawi.
- issue: Nguvu ya kisarufi ya utaratibu wa kikuhani
  choice: 'Kutumia wakati ujao wa hatua ya kisheria: ‘Kisha kuhani atakuja’'
  alternative: ‘Kuhani akaja’ kama simulizi la wakati uliopita
  rationale: Muktadha unatoa utaratibu wa kufuatwa na kuhani, wala hausimuli tukio moja lililopita.
- issue: Rejeo la טָמֵא הוּא
  choice: ‘nyumba hiyo ni najisi’
  alternative: ‘ni najisi’
  rationale: Kiebrania kinaweza kueleweka kwa kurejelea hali au nyumba, lakini Kiswahili huhitaji rejeo lililo wazi. Muktadha wa karibu unaifanya nyumba kuwa rejeo la kawaida bila kubadili hukumu ya kiibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kukagua’ linafaa kwa uchunguzi rasmi wa kuhani; ‘doa’ na ‘ukungu’ ni maneno ya kawaida kwa hali inayoonekana katika nyumba. Sentensi ya pili imeweka wazi ‘nyumba hiyo’ badala ya kiwakilishi kisicho na rejeo dhahiri.
