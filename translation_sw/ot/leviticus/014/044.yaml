revisions:
- from: Kisha kuhani atakuja na kukagua. Ikiwa kweli doa limeenea ndani ya nyumba, huo ni ukungu[a] unaoharibu[b] ndani ya nyumba; nyumba hiyo ni najisi.
  to: Kisha kuhani atakuja kukagua; akiona kwamba doa limeenea ndani ya nyumba, hiyo ni hali ya unajisi inayoharibu katika nyumba; nyumba hiyo ni najisi.
  rationale: Nimeondoa “ukungu,” kwa kuwa ni utambulisho mahususi usiothibitishwa na צָרַעַת. “Hali ya unajisi inayoharibu” huwasilisha jina la kundi la kiibada pamoja na maana ya מַמְאֶרֶת, huku tanbihi ikihifadhi istilahi ya Kiebrania na kuzuia kuilinganisha na ugonjwa wa kisasa. Alama za tanbihi zimeondolewa katika matini kwa kuwa tafsiri iliyorekebishwa haisemi tena “ukungu” wala haitumii neno moja linalohitaji mbadala wa tanbihi; maelezo yenyewe yamehifadhiwa kama seti ya tanbihi ya marejeo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:16:29Z'
