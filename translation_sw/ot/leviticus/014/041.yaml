  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: sw
  text: Naye ataamuru upande wa ndani wa nyumba ukwanguliwe pande zote; kisha watamwaga mavumbi waliyokwangua mahali palipo najisi nje ya mji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַקְצִעַ
  choice: ataamuru ... ikwanguliwe
  rationale: Kauli ya Hiphil ina nguvu ya kusababisha au kuagiza tendo lifanywe; tafsiri hii inaonyesha kwamba kuhani anaagiza kazi hiyo badala ya kusema lazima aifanye mwenyewe.
- source_word: מִבַּיִת סָבִיב
  choice: sehemu yote ya ndani ya nyumba
  rationale: Kirai hiki kinaelekeza kwenye nyuso za ndani kuzunguka nyumba yote; Kiswahili hiki ni cha kawaida na kinafikisha maana ya סָבִיב bila kuwa cha kimbao.
- source_word: וְשָׁפְכוּ
  choice: kisha watamwaga
  rationale: Kitenzi שׁפך humaanisha kumwaga; hapa kinaeleza kuondoa na kutupa mabaki yaliyokwanguliwa.
- source_word: הֶעָפָר
  choice: mavumbi
  rationale: Neno la Kiebrania maana yake halisi ni mavumbi; muktadha unaonyesha ni mabaki yenye vumbi yaliyotokana na kukwangua kuta, bila kulazimisha maana mahsusi ya plasta.
- source_word: אֲשֶׁר הִקְצוּ
  choice: waliyokwangua
  rationale: Kifungu hiki kinarejelea mavumbi au mabaki yaliyoondolewa kwa kukwangua nyuso za nyumba.
- source_word: אֶל מִחוּץ לָעִיר
  choice: nje ya mji
  rationale: Muundo wa vihusishi unaonyesha mwendo kuelekea mahali palipo nje ya mipaka ya mji.
- source_word: אֶל מָקוֹם טָמֵא
  choice: mahali palipo najisi
  rationale: Najisi ni istilahi ya kawaida ya Kiswahili kwa hali ya kutokuwa safi kiibada katika Walawi, bila kudokeza lazima uovu wa kimaadili.
theological_decisions:
- issue: Tafsiri ya טָמֵא katika muktadha wa utakaso wa Kilawi
  choice: najisi
  alternative: pasipo safi; palipotiwa unajisi
  rationale: “Najisi” huhifadhi maana ya kiibada na kimfumo ya neno hilo katika Walawi bila kuibadili kuwa hukumu ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ataamuru ... ikwanguliwe” huhifadhi maana ya kisababishi, na mpangilio wa sentensi unaweka wazi kwamba mavumbi yanapelekwa nje ya mji, mahali palipo najisi.
