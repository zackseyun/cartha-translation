translation:
  language: sw
  text: 'Hii ndiyo sheria ya mtu mwenye tsaraati[a] siku ya kutakaswa kwake: atapelekwa kwa kuhani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tsaraati” linawakilisha neno la Kiebrania צָרַעַת, hali inayohusishwa na unajisi wa kiibada ambayo kwa kawaida imeitwa “ukoma,” lakini si lazima iwe ugonjwa wa Hansen unaoitwa ukoma leo.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Hii ndiyo
  rationale: Katika utangulizi wa kisheria, muundo huu wa Kiswahili unaeleza kwa kawaida kuwa kinachofuata ndicho agizo linalohusika, bila kulazimisha kitenzi cha wakati ujao kisicho cha kawaida hapa.
- source_word: תּוֹרַת
  choice: sheria kuhusu
  rationale: תּוֹרָה hapa ni utaratibu au agizo lililowekwa. “Sheria” hudumisha msamiati unaofahamika wa Mambo ya Walawi, na “kuhusu” huonyesha uhusiano wa hali ya kutegemeana na nomino inayofuata.
- source_word: הַמְּצֹרָע
  choice: mtu mwenye tsaraati
  rationale: מְצֹרָע ni mtu aliyeathiriwa na צָרַעַת. “Mtu mwenye tsaraati” humtaja kwanza kama mtu na huepuka kuitambulisha hali hiyo moja kwa moja na ukoma wa kisasa.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: siku ya kutakaswa kwake
  rationale: Kirai hiki cha wakati kinarejelea siku ya utakaso wa kiibada. “Kutakaswa” kinafaa katika muktadha wa usafi wa kiibada na hakidai kwamba tendo lenyewe ni tiba ya kitabibu.
- source_word: וְהוּבָא
  choice: atapelekwa
  rationale: Umbo la Hophal ni la kutendwa; wakati ujao wa Kiswahili unaonyesha hatua iliyoagizwa katika utaratibu. Nukta mbili zinatosha kuonyesha mfuatano bila kulazimisha “na.”
- source_word: אֶל הַכֹּהֵן
  choice: kwa kuhani
  rationale: Kihusishi “kwa” ni cha kawaida kwa kupelekwa mbele ya mtu mwenye jukumu rasmi. Ingawa Kiebrania kina kibainishi, Kiswahili kwa kawaida hakihitaji neno la ziada la kuonyesha umaalumu huu.
theological_decisions:
- issue: Uhusiano wa מְצֹרָע na istilahi ya kihistoria ya “ukoma”
  choice: mtu mwenye tsaraati
  alternative: mtu mwenye ugonjwa wa ngozi; mwenye ukoma
  rationale: Hali inayotajwa na צָרַעַת ni jamii ya kiibada ya Biblia na hailingani kwa usahihi na ugonjwa wa Hansen wa kisasa. Kutumia “tsaraati” huhifadhi upekee wa neno la chanzo, huku tanbihi ikilifafanua kwa msomaji.
- issue: Maana ya טהר katika muktadha huu
  choice: kutakaswa
  alternative: kusafishwa; kuwa safi
  rationale: Mzizi huu hapa unahusu kurejeshwa katika hali ya usafi wa kiibada, si lazima kuponywa kitabibu. “Kutakaswa” hudumisha tofauti hiyo bila kuamua zaidi namna hali ya kimwili na hadhi ya kiibada zinavyohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi mtindo wa agizo la kisheria, hali ya kutendwa katika “atapelekwa,” na upekee wa istilahi ya kale kupitia “tsaraati” pamoja na tanbihi.
