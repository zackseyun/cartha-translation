base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: sw
  text: Ndivyo atakavyoitakasa nyumba kwa damu ya ndege, kwa maji yaliyo hai[a], kwa ndege aliye hai, kwa mbao ya mwerezi, kwa hisopo, na kwa uzi mwekundu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “maji safi” au “maji yanayotiririka.” Kiebrania: “maji yaliyo hai,” usemi wa kawaida kwa maji kutoka chanzo safi kinachotiririka.'
    reason: lexical_alternative
  - marker: b
    text: Au “uzi mwekundu wa kung’aa.” Usemi wa Kiebrania hurejelea nyenzo ya nyuzi iliyotiwa rangi nyekundu na kutumiwa katika ibada ya utakaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: Ndivyo atakavyoitakasa
  rationale: Katika muktadha huu wa ibada, piel ya חטא humaanisha kuondoa unajisi au kutakasa, si kusababisha dhambi. Muundo huu pia unaunganisha tendo hilo na utaratibu uliotangulia.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Neno hili linarejelea jengo lenyewe linalofanyiwa ibada ya utakaso.
- source_word: בְּדַם הַצִּפּוֹר
  choice: kwa damu ya ndege
  rationale: Kihusishi ב hapa kinaonyesha kitu kinachotumiwa kutekeleza utakaso.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: kwa maji yaliyo hai
  rationale: Huhifadhi usemi wa Kiebrania 'maji yaliyo hai,' ambao humaanisha maji safi kutoka chanzo kinachotiririka; tanbihi inaeleza maana ya nahau hiyo.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: kwa ndege aliye hai
  rationale: Hutofautisha ndege huyu na yule aliyechinjwa na ambaye damu yake imetumiwa.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: kwa kipande cha mti wa mwerezi
  rationale: עֵץ pamoja na aina ya mti hapa hurejelea sehemu ya mti iliyotumiwa katika ibada. 'Kipande' huifanya maana hiyo iwe wazi bila kudokeza kwamba mti mzima ulitumiwa.
- source_word: וּבָאֵזֹב
  choice: kwa hisopo
  rationale: Hisopo ni jina la kawaida katika istilahi za Biblia, ingawa utambulisho sahihi wa mmea huo unabishaniwa.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: kwa uzi mwekundu
  rationale: Usemi huu hurejelea kitu cha nyuzi kilichotiwa rangi nyekundu kilichotumiwa katika ibada; 'uzi mwekundu' ni Kiswahili cha kawaida na kinachoeleweka.
theological_decisions:
- issue: Maana ya kitendo cha חטא katika ibada
  choice: atakavyoitakasa
  alternative: atakavyoisafisha / atakavyoifanyia upatanisho
  rationale: '''Kutakasa'' huwasilisha kuondolewa kwa unajisi wa kiibada bila kuifanya nyumba kuwa mhusika wa dhambi wala kulazimisha maana maalumu ya upatanisho.'
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ''kwa'' yamehifadhiwa ili kuonyesha orodha ya vifaa vya ibada na muundo wa Kiebrania. Alama za tanbihi zimewekwa baada ya vifungu vinavyoelezwa: maji yaliyo hai [a] na uzi mwekundu [b].'
