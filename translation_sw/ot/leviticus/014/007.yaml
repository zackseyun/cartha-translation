base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: sw
  text: Atamnyunyizia mara saba mtu anayetakaswa kutokana na ugonjwa wa ngozi[a], na kumtangaza kuwa safi[b]. Kisha atamwachilia yule ndege aliye hai katika eneo la wazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kijadi, “ukoma.” Neno la Kiebrania katika Walawi linahusu kwa upana zaidi hali mbalimbali za ngozi, wala si lazima ukoma wa kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au “kumtakasa.” Tendo la kuhani ni tamko rasmi kuhusu usafi wa kiibada, si uchunguzi wa kitabibu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Kisha atamnyunyizia
  rationale: Hifili ya נזה katika taratibu za ibada humaanisha kunyunyizia kimiminika. Kiswahili hutumia kitenzi hiki kwa kawaida bila kulazimika kutaja kitu kilichonyunyizwa, ambacho kinaeleweka kutokana na muktadha uliotangulia.
- source_word: הַמִּטַּהֵר
  choice: mtu anayetakāswa
  rationale: Kauli ya kati ya wakati unaoendelea ya טהר humtaja mtu anayepitia utaratibu wa kutakaswa; umbo la kutendwa linahifadhi maana hiyo ya mchakato.
- source_word: מִן הַצָּרַעַת
  choice: kutokana na ugonjwa wa ngozi[a]
  rationale: צָרַעַת ni kundi pana la hali zinazohusiana na ngozi katika Walawi, wala si lazima ugonjwa wa kisasa wa ukoma. 'Kutokana na' huonyesha kutengwa na hali hiyo.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya kifungu cha idadi.
- source_word: וְטִהֲרוֹ
  choice: na kumtangaza kuwa safi[b]
  rationale: Katika mazingira ya kikuhani na kisheria, tendo hili ni tamko rasmi la usafi wa kiibada, si maelezo ya matibabu pekee.
- source_word: וְשִׁלַּח
  choice: Halafu atamwachilia ... aruke
  rationale: שׁלח hapa ni kumwachilia au kumpeleka ndege huru. 'Atamwachilia ... aruke' ni Kiswahili cha kawaida kinachoonyesha wazi tendo la kumweka huru.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: yule ndege aliye hai
  rationale: Kirai hiki humtofautisha ndege huyu na ndege aliyechinjwa katika mstari uliotangulia.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: juu ya uwanda
  rationale: עַל־פְּנֵי הַשָּׂדֶה huleta taswira ya ndege kuruka juu ya eneo la wazi; 'uwanda' ni usemi mfupi na wa kawaida kwa eneo hilo.
theological_decisions:
- issue: Tafsiri ya צָרַעַת
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: Neno la Kiebrania katika Walawi linahusu hali mbalimbali za ngozi zinazosababisha unajisi wa kiibada, si lazima ugonjwa wa Hansen unaoitwa ukoma leo.
- issue: Maana ya וְטִהֲרוֹ
  choice: kumtangaza kuwa safi
  alternative: kumtakasa
  rationale: Tafsiri iliyochaguliwa inaweka wazi wajibu rasmi wa kuhani wa kuthibitisha usafi wa kiibada bila kudai kwamba anaponya hali ya kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka. 'Mtu anayetakāswa' huhifadhi mchakato wa kiibada, huku 'uwanda' ikitoa taswira ya eneo la wazi bila tafsiri neno kwa neno isiyo ya kawaida.
