  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania tsaraʿat kwa desturi hutafsiriwa “ukoma,” lakini katika Mambo ya Walawi hutumiwa kwa maana pana zaidi, hata kuhusiana na mavazi na nyumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ
  choice: na kuhusu
  rationale: Kiunganishi na kihusishi vinaendeleza orodha ya mambo yanayohusu sheria iliyotangulia; “na kuhusu” ni ya kawaida na huhifadhi muundo huo.
- source_word: צָרַעַת
  choice: tsaraati
  rationale: Neno la Kiebrania linahusu aina pana ya hali mbaya inayoweza kuonekana kwa watu, mavazi, na nyumba. Kutumia istilahi iliyotoholewa huepuka kuiita kimakosa ugonjwa maalumu wa ngozi wakati hapa inaathiri vitu na nyumba.
- source_word: הַבֶּגֶד
  choice: vazi
  rationale: “Vazi” ni nomino ya umoja iliyo wazi na yenye hadhi; katika Kiswahili matumizi ya kijumla hayahitaji kuiga kibainishi cha Kiebrania kwa neno “hilo.”
- source_word: וְ/לַ/בָּיִת
  choice: au nyumba
  rationale: Katika orodha hii, “au” huonyesha kwa kawaida kwamba hali hiyo inaweza kuwa katika vazi au katika nyumba; kihusishi “katika” kinatumika kwa pamoja kwa nomino zote mbili.
