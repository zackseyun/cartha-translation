translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Istilahi “tsaraati” imehifadhiwa na kufafanuliwa katika tanbihi ili kuepuka maana finyu na ya kitabibu ya “ukoma” au matumizi ya “ugonjwa wa ngozi” kwa vazi na nyumba.
