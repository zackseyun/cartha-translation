base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: sw
  text: Kisha kuhani afanyaye utakaso atamleta mwanamume anayefanyiwa utakaso, pamoja na vitu hivyo, mbele za Yahwe penye mlango wa Hema la Kukutania.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: atamweka mbele
  rationale: Hifili ya עמד humaanisha kumsababisha mtu au kitu kusimama katika mazingira haya ya ibada. Kiswahili “atamweka mbele” kinaeleza tendo la kumwasilisha rasmi mbele za Yahwe bila ugumu wa tafsiri ya neno kwa neno.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: kuhani anayefanya utakaso
  rationale: Kivumishi-tendo מְטַהֵר kinaonyesha jukumu la kuhani katika taratibu za utakaso. “Anayefanya utakaso” hakudokezi kwamba utakaso huu ni wa kimaadili wala haupunguzi jukumu lake kuwa kutangaza tu kwamba mtu ni safi.
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: mtu anayetakaswa
  rationale: הָאִישׁ humrejelea mwanadamu mmoja wa kiume katika muktadha, lakini Kiswahili cha kawaida hutumia “mtu” kwa uasilia; umoja umehifadhiwa. Muundo wa Hitpaeli הַמִּטַּהֵר hapa unaonyesha mtu anayepitia mchakato wa utakaso wa kiibada.
- source_word: וְאֹתָם
  choice: pamoja na vitu hivyo
  rationale: Kiwakilishi cha wingi kinarejelea vitu vilivyotajwa katika mstari uliotangulia, si watu wengine. Kutaja “vitu” huondoa utata usio wa lazima katika Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele ya Yahwe
  rationale: Hii ni lugha ya kawaida ya kiibada ya kuletwa katika uwepo wa Mungu; jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa “Yahwe.”
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa hema la kukutania
  rationale: “Mlango” huonyesha mahali pa kuingilia, na “hema la kukutania” ni tafsiri ya kawaida na wazi ya אֹהֶל מוֹעֵד katika Kiswahili cha kibiblia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina maalumu la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Asili ya utakaso katika mstari huu
  choice: utakaso wa kiibada unaofanywa kwa taratibu za kuhani
  alternative: kutangazwa kuwa safi tu / utakaso wa kimaadili
  rationale: Muktadha wa Walawi 14 na miundo ya טהר humwonyesha kuhani akisimamia mchakato wa utakaso wa kiibada, huku mtu huyo akiupitia. Tafsiri haipaswi kuugeuza kuwa utakaso wa maadili wala kuufupisha kuwa tamko pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kisha” huunganisha agizo hili na hatua zilizotangulia; “kwenye mlango” ni ya sasa na ya kawaida kuliko miundo mizito zaidi.
