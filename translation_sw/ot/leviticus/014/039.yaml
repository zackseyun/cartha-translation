base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/039.yaml
  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: sw
  text: Kisha siku ya saba kuhani atarudi na kukagua. Ikiwa doa limeenea katika kuta za nyumba,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: atarudi
  rationale: Huwasilisha kwa kawaida tendo la kuhani kurudi baada ya kipindi cha kufungiwa kwa nyumba.
- source_word: וְרָאָה
  choice: na kukagua
  rationale: Katika muktadha wa uchunguzi wa kikuhani, kitenzi cha kuona kinamaanisha kutazama kwa makini ili kutathmini hali.
- source_word: הַנֶּגַע
  choice: doa
  rationale: Neno hili linaweza kumaanisha pigo au dalili iliyoonekana; hapa linarejelea alama inayoonekana ukutani. 'Doa' huepuka kudai kuwa ni maambukizi ya kibayolojia.
- source_word: פָשָׂה
  choice: limeenea
  rationale: Hii ndiyo maana ya kawaida ya kitenzi katika sheria hizi za uchunguzi.
- source_word: בְּקִירֹת הַבָּיִת
  choice: katika kuta za nyumba
  rationale: Tafsiri ya moja kwa moja na ya asili ya mahali doa lilipoenea.
theological_decisions:
- issue: Maana ya הַנֶּגַע katika nyumba
  choice: doa
  alternative: maambukizi / pigo
  rationale: Chanzo kinaacha wazi asili halisi ya hali hiyo; 'doa' huhifadhi uzingatiaji wa dalili inayoonekana bila kuingiza utambuzi wa kisasa au ufafanuzi wa kitheolojia.
- issue: Muundo wa וְהִנֵּה
  choice: Ikiwa
  alternative: na tazama
  rationale: Katika sentensi hii, וְהִנֵּה inaanzisha hali anayogundua kuhani. Kiswahili cha kawaida hutumia 'ikiwa' kwa mtiririko huu, huku maana ya ugunduzi ikibaki katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Sentensi inaishia kwa koma kwa kuwa masharti yake yanaendelea katika mstari unaofuata.
