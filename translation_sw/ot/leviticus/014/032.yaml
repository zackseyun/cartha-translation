  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: sw
  text: Hii ndiyo sheria kuhusu mtu aliye na ugonjwa wa ngozi[a], ambaye hana uwezo wa kugharimia vinavyohitajika kwa ajili ya kutakaswa kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania צָרָעַת limetafsiriwa kimapokeo kuwa “ukoma,” lakini katika Mambo ya Walawi linahusu kwa upana zaidi hali mbalimbali mbaya za ngozi na unajisi wa kiibada unaohusiana nazo.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ambaye mkono wake haufikii katika kutakaswa kwake”; hii ni nahau inayomaanisha kwamba hana uwezo wa kugharimia vinavyohitajika kwa ajili ya utakaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: sheria
  rationale: Katika maandishi ya kikuhani, תּוֹרָה hapa ni kanuni au utaratibu uliowekwa; “sheria” ni fupi, wazi, na yenye hadhi katika Kiswahili.
- source_word: בּוֹ
  choice: aliye na
  rationale: Muundo huu unaonyesha kwamba dalili hiyo imo kwa mtu; “aliye na” ni Kiswahili cha kawaida bila kubadili maana.
- source_word: נֶגַע צָרָעַת
  choice: dalili ya ugonjwa wa ngozi
  rationale: נֶגַע ni dalili au athari inayoonekana, na צָרָעַת katika Mambo ya Walawi ni kundi pana lisilolingana moja kwa moja na ukoma wa kisasa; tafsiri hii huepuka utambulisho wa kitabibu usio hakika.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: hana uwezo wa kupata
  rationale: Nahau ya Kiebrania, kwa maana halisi ‘mkono wake haufikii,’ inaonyesha kutokuwa na uwezo wa kifedha wa kupata kinachohitajika.
- source_word: בְּטָהֳרָתוֹ
  choice: kwa ajili ya kutakaswa kwake
  rationale: Hurejelea mchakato wa utakaso wa kiibada uliotajwa katika muktadha; “kutakaswa” huhifadhi wazo la ibada bila kudokeza tu usafi wa kawaida.
theological_decisions:
- issue: Asili ya צָרָעַת
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: Neno hilo la Kiebrania halipaswi kulinganishwa moja kwa moja na ugonjwa wa Hansen; chaguo hili huhifadhi upana wa kundi la kiibada na kitabibu katika sura hii.
- issue: Maana ya טָהֳרָה
  choice: kutakaswa kwa maana ya kiibada
  alternative: kuponywa kimatibabu
  rationale: Muktadha unahusu taratibu na sadaka za kurejesha hali ya utakaso, si dai kwamba ibada yenyewe ndiyo tiba ya ugonjwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa urahisi wa kueleweka huku istilahi “sheria” na “kutakaswa” zikihifadhi muktadha wa kikuhani na wa kiibada.
