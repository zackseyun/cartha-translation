base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: sw
  text: Kisha kuhani atachukua mwana-kondoo wa sadaka ya hatia[a] pamoja na logi ya mafuta[b], na kuhani atavipeperusha kuwa sadaka ya kutikiswa mbele za Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana-kondoo wa sadaka ya kosa.”
    reason: lexical_alternative
  - marker: b
    text: “Logi” ilikuwa kipimo kidogo cha kimiminika kilichotumiwa katika mfumo wa ibada wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atamchukua
  rationale: Kiunganishi waw pamoja na kitenzi kinaendeleza hatua za utaratibu wa ibada; “Kisha” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada. Kurudiwa kwake kabla ya kitenzi cha pili kumehifadhiwa kama katika Kiebrania.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: mwana-kondoo wa sadaka ya hatia
  rationale: Muundo huu unaonyesha wazi kuwa mwana-kondoo ndiye mnyama wa sadaka ya אָשָׁם, huku ukihifadhi aina maalumu ya sadaka.
- source_word: לֹג הַשָּׁמֶן
  choice: logi ya mafuta
  rationale: לֹג ni kipimo maalumu cha ujazo wa kimiminika; “logi” huhifadhi istilahi hiyo badala ya kuibadili kuwa “kipimo” kisicho mahususi.
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: atavitikisa ... kuwa sadaka ya kutikiswa
  rationale: Maneno haya yanahifadhi uhusiano wa kitenzi na nomino katika Kiebrania na kueleza tendo maalumu la kiibada la kuwasilisha vitu kwa kuvitikisa.
- source_word: אֹתָם
  choice: vyote viwili
  rationale: Maneno haya yanaonyesha wazi kwamba tendo linahusu mwana-kondoo na logi ya mafuta kwa pamoja, licha ya nomino hizo kuwa za ngeli tofauti katika Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huu ni usemi wa kawaida na wenye hadhi unaoonyesha kuwasilisha sadaka katika uwepo wa Yahwe, huku jina la Mungu likihifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יְהוָה. “Yahwe” hulitaja moja kwa moja badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Uwasilishaji wa אָשָׁם katika sheria ya dhabihu
  choice: sadaka ya hatia
  alternative: sadaka ya kosa; sadaka ya fidia
  rationale: “Sadaka ya hatia” hutambulisha kwa uwazi aina hii maalumu ya sadaka na maana yake ya hatia au uwajibikaji, bila kuifanya kuwa sadaka ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Istilahi za kiibada “sadaka ya hatia” na “sadaka ya kutikiswa” zimehifadhiwa; “logi” imefafanuliwa katika tanbihi. Usemi “vyote viwili” unatatua kwa njia ya kawaida tofauti ya ngeli kati ya mwana-kondoo na logi bila kupoteza wingi wa אֹתָם.
