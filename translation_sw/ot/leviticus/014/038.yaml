  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: sw
  text: Kisha kuhani atatoka katika nyumba hadi mlangoni mwa nyumba, naye ataifungia nyumba kwa siku saba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataifunga nyumba kwa siku saba.” Kitenzi cha Kiebrania kinaweza kueleza kuifunga nyumba ili kuzuia kuingia humo kwa muda wa ukaguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Kisha ... atatoka
  rationale: Katika mfululizo wa hatua za kisheria, kiunganishi pamoja na kitenzi hiki huendeleza hatua inayofuata. “Kisha” linaonyesha mfuatano huo kwa Kiswahili cha kawaida, na “atatoka” linadumisha nguvu ya agizo la utaratibu.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika sheria za Walawi; muktadha unaonyesha kuwa ni kuhani yule anayefanya ukaguzi.
- source_word: מִן הַבַּיִת
  choice: ndani ya nyumba
  rationale: Pamoja na kitenzi “kutoka,” Kiswahili cha asili husema “kutoka ndani ya nyumba,” kikionyesha mwendo kutoka humo.
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: mpaka kwenye mlango wa nyumba
  rationale: פֶּתַח ni mahali pa kuingilia au uwazi wa kuingilia. “Mlango wa nyumba” ni usemi wa kawaida na halazimishi maana ya jani la mlango; “mpaka kwenye” huonyesha mwisho wa mwendo.
- source_word: וְהִסְגִּיר
  choice: na kuifungia
  rationale: Hiphil ya סגר hapa ina maana ya kufunga au kuzuia watu wasiingie katika nyumba kwa muda uliowekwa. “Kuifungia” ni ya kawaida katika Kiswahili na haiongezi dhana ya kitaalamu ya karantini.
- source_word: אֶת הַבַּיִת
  choice: nyumba
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi moja kwa moja; kiambishi “-i-” katika “kuifungia” kinarejelea nyumba.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: “Kwa siku saba” huonyesha muda kwa Kiswahili cha kawaida na kuhifadhi idadi ya siku.
