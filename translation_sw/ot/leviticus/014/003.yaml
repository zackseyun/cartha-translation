  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: sw
  text: Kuhani atatoka nje ya kambi, naye kuhani atamchunguza; na tazama, mtu huyo amepona ugonjwa wa ngozi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kijadi, “ugonjwa wa ukoma.” Maneno ya Kiebrania yanahusu kwa upana zaidi ugonjwa au tatizo la ngozi, si lazima ukoma wa kisasa (ugonjwa wa Hansen).
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: atatoka na kwenda
  rationale: Katika utaratibu huu wa kisheria, kitenzi kinaeleza tendo lililoagizwa litakalofanywa; usemi huu pia huhifadhi wazo la kutoka kuelekea mahali fulani.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhudumu wa kikuhani katika muktadha wa ibada na sheria za Walawi.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili unaoonyesha mahali anakoelekea kuhani.
- source_word: וְרָאָה הַכֹּהֵן
  choice: kisha atamchunguza mtu huyo
  rationale: Katika sheria za ukaguzi, ראה haimaanishi kuona tu bali kuchunguza hali ya mtu; kiwakilishi cha yambwa kimefafanuliwa kwa Kiswahili cha kawaida.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi ishara ya Kiebrania inayovuta fikira kwenye jambo lililogunduliwa, bila kulibadili moja kwa moja kuwa sharti la ‘ikiwa’.
- source_word: נִרְפָּא
  choice: umepona
  rationale: Nifali inaonyesha hali iliyotokana na kupona; kwa Kiswahili, ugonjwa ‘umepona’ ni usemi wa kawaida unaofaa hapa.
- source_word: נֶגַע הַצָּרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno צָרַעַת linahusu kundi pana la madhara ya ngozi katika sheria za utakaso, si lazima ugonjwa wa kisasa wa Hansen; tafsiri hii huepuka usahihi wa kitabibu usiothibitishwa.
- source_word: מִן הַצָּרוּעַ
  choice: wa mtu huyo
  rationale: מן inaonyesha kwamba tatizo limeondoka kwa mtu aliyeathiriwa. Muundo ‘ugonjwa ... wa mtu huyo umepona’ ni wa asili katika Kiswahili na huepuka kumwekea mtu lebo ya kudumu.
theological_decisions:
- issue: Tafsiri ya צָרַעַת na הַצָּרוּעַ
  choice: ugonjwa wa ngozi / mtu huyo
  alternative: ukoma / mtu mwenye ukoma
  rationale: Maneno ya Kiebrania yanaweza kutaja aina mbalimbali za madhara ya ngozi yanayohusiana na unajisi wa kiibada, wala hayalingani kwa lazima na ukoma wa kisasa (ugonjwa wa Hansen). Maelezo ya jadi yamehifadhiwa katika tanbihi.
- issue: Nguvu ya וְהִנֵּה katika utaratibu wa ukaguzi
  choice: na tazama
  alternative: na ikiwa
  rationale: ‘Na tazama’ huhifadhi namna chanzo kinavyosisitiza jambo lililogunduliwa. ‘Na ikiwa’ ingefanya kishazi hicho kuwa sharti wazi zaidi kuliko lilivyo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kurudiwa kwa neno ‘kuhani’ katika Kiebrania kumepunguzwa kwa kutumia kiunganishi cha mfuatano, ili sentensi iwe ya kawaida kwa Kiswahili bila kupoteza mhusika. Alama ya tanbihi imewekwa moja kwa moja baada ya ‘ugonjwa wa ngozi,’ ambako maelezo yake yanahusika.
