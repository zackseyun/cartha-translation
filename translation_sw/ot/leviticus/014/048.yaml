  text: וְ/אִם בֹּ֨א יָבֹ֜א הַ/כֹּהֵ֗ן וְ/רָאָה֙ וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ/בַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת הַ/בָּ֑יִת וְ/טִהַ֤ר הַ/כֹּהֵן֙ אֶת הַ/בַּ֔יִת כִּ֥י נִרְפָּ֖א הַ/נָּֽגַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: sw
  text: Lakini kuhani akiingia na kuangalia, tazama, ugonjwa[a] haujaenea katika nyumba baada ya nyumba kupigwa plasta, basi kuhani ataitangaza nyumba kuwa safi[b], kwa sababu ugonjwa huo umepona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza pia kutafsiriwa “athari” au “pigo”; hapa linamaanisha hali mbaya iliyoikumba nyumba, si lazima ugonjwa kwa maana ya kitabibu ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ataisafisha nyumba.” Katika muktadha huu kitenzi cha Kiebrania kinaweza kumaanisha kuitangaza nyumba kuwa safi kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ... aki-
  rationale: Kisharti hiki kinaendeleza utaratibu wa kisheria huku kikionyesha tofauti na hali iliyotangulia; muundo wa “lakini ... aki-” ni wa kawaida katika Kiswahili.
- source_word: בֹּא יָבֹא
  choice: akiingia
  rationale: Muundo wa Kiebrania unasisitiza kuja au kuingia kwa kuhani. Kiswahili cha kawaida hutoa maana ya utaratibu kwa “akiingia” bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: וְרָאָה
  choice: na kuangalia
  rationale: Kitenzi kimsingi ni kuona au kuangalia. “Kuangalia” kinafaa katika muktadha wa ukaguzi bila kukifanya kuwa cha kitaalamu kupita kiasi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi kiashiria cha usemi kinachovuta fikira kwenye matokeo ya ukaguzi.
- source_word: לֹא פָשָׂה
  choice: haujaenea
  rationale: Katika muktadha wa athari kwenye nyumba, kitenzi kinamaanisha kuenea zaidi.
- source_word: הַנֶּגַע
  choice: ugonjwa
  rationale: Neno linaeleza athari au hali mbaya iliyoikumba nyumba. “Ugonjwa” ni wazi na pia huruhusu taswira ya kupona iliyo katika mwisho wa mstari, ingawa si utambuzi wa kitabibu wa kisasa.
- source_word: בַּבַּיִת
  choice: ndani ya nyumba
  rationale: Huhifadhi maana ya kihusishi cha Kiebrania na kueleza kwamba athari iko katika jengo.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: baada ya nyumba kupakwa chokaa
  rationale: טוח humaanisha kupaka au kupiga plasta. “Kupakwa chokaa” ni usemi wa kawaida wa Afrika Mashariki unaofaa kwa utaratibu huu wa jengo.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבַּיִת
  choice: basi kuhani ataitangaza nyumba kuwa safi
  rationale: Katika sheria za utakaso, kitenzi kinaweza kueleza tamko la kikuhani kwamba kitu ni safi, si tendo la kukisafisha kimwili tu.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: kwa sababu ugonjwa huo umepona
  rationale: Huhifadhi taswira ya Kiebrania ya kupona badala ya kuibadili kuwa tu “umetoweka.”
theological_decisions:
- issue: Tamko la usafi wa kiibada au tendo la kusafisha katika וְטִהַר
  choice: kuhani ataitangaza nyumba kuwa safi
  alternative: kuhani ataisafisha nyumba
  rationale: Katika muktadha huu kuhani anathibitisha hali ya nyumba baada ya kuikagua. Tafsiri ya tamko haimaanishi kwamba yeye ndiye anayefanya kazi ya kimwili ya kuisafisha, na inalinda jukumu lake la kisheria na kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Na tazama” kinahifadhi msisitizo wa chanzo; “kupakwa chokaa” ni usemi wa kawaida wa ujenzi. Alama zote za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
