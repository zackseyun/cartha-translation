  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: sw
  text: ili kutoa maelekezo kuhusu wakati hali inapokuwa najisi na wakati inapokuwa safi. Hii ndiyo sheria kuhusu hali inayotia unajisi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kawaida hutafsiriwa “ukoma.” Neno la Kiebrania linaweza kutaja hali zinazotia unajisi na kuathiri watu, vitambaa au nyumba; halihusu tu ugonjwa wa kisasa wa Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: ili kutoa maelekezo kuhusu
  rationale: Kitenzi cha Hiphil hapa kinaonyesha kutoa maelekezo yenye mamlaka kuhusu namna ya kutambua hali za kiibada zilizotajwa katika sheria zilizotangulia.
- source_word: בְּיוֹם
  choice: wakati ambapo
  rationale: Katika kauli hii, neno linalomaanisha kihalisi ‘siku’ linatumika kama nahau ya wakati au hali inayohusika, si siku mahususi ya kalenda.
- source_word: הַטָּמֵא
  choice: kitu ni najisi
  rationale: Kivumishi hiki kinataja hali ya unajisi inayopaswa kutambuliwa; ‘kitu’ kinaacha kauli itumike kwa watu, mavazi na nyumba kama muktadha mpana unavyodai.
- source_word: וּבְיוֹם הַטָּהֹר
  choice: na wakati ambapo ni safi
  rationale: Muundo sambamba unatofautisha wakati wa hali safi na wakati wa hali ya unajisi.
- source_word: זֹאת תּוֹרַת
  choice: Hii ndiyo sheria kuhusu
  rationale: Huu ni muundo wa kawaida wa kuhitimisha na kufupisha maagizo yanayotawala jambo linalofuata.
- source_word: הַצָּרָעַת
  choice: hali inayotia unajisi
  rationale: Neno la Kiebrania linahusu kundi pana la hali za kiibada zinazoweza kuathiri watu, vitambaa au nyumba; tafsiri hii huepuka kulifanya kuwa jina la ugonjwa mmoja wa kisasa.
theological_decisions:
- issue: Tafsiri ya צָרַעַת katika sheria za usafi wa kiibada
  choice: hali inayotia unajisi
  alternative: ukoma
  rationale: Neno la Kiebrania lina maana pana kuliko ugonjwa wa kisasa wa Hansen na katika sura hii linatumika pia kwa vitambaa na nyumba. Tafsiri iliyochaguliwa huhifadhi upana wa kundi hili la kiibada bila kulibainisha kimatibabu kupita ushahidi wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maneno “najisi” na “safi” yanadumisha istilahi zinazofahamika katika muktadha wa usafi wa kiibada, huku “wakati ambapo” ikitoa maana ya nahau ya Kiebrania badala ya kutafsiri ‘siku’ kihalisi.
