source:
  edition: WLC
  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: sw
  text: Naye atamchukua ndege aliye hai pamoja na kipande cha mti wa mwerezi, uzi mwekundu na hisopo; kisha atavichovya vitu hivyo pamoja na ndege aliye hai katika damu ya ndege aliyechinjwa juu ya maji yanayotiririka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “maji yaliyo hai”; pia inaweza kutafsiriwa “maji safi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ndege aliye hai
  rationale: Huhifadhi utofauti wa wazi kati ya ndege anayebaki hai na yule aliyechinjwa, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יִקַּח
  choice: atamchukua
  rationale: Wakati ujao hapa una nguvu ya agizo katika sheria ya ibada; pia kiambishi cha mtendwa -m- kinafaa kwa ndege aliye hai.
- source_word: עֵץ הָאֶרֶז
  choice: kipande cha mti wa mwerezi
  rationale: Kirai hiki kinarejelea nyenzo ya mwerezi inayotumiwa katika ibada. Neno 'kipande' linaweka wazi kwamba si mti mzima unaochukuliwa.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: uzi mwekundu
  rationale: Kirai kinamaanisha nyenzo au uzi uliotiwa rangi nyekundu inayotokana na mdudu; 'uzi mwekundu' ni wazi na wa kawaida kwa wasomaji wa Kiswahili.
- source_word: הָאֵזֹב
  choice: hisopo
  rationale: Hili ndilo jina la kimapokeo la mmea wa ibada, huku utambulisho wake kamili wa kibotania ukiendelea kutokuwa na uhakika.
- source_word: וְטָבַל
  choice: kisha atavichovya
  rationale: Kitenzi kina maana ya kutumbukiza au kuchovya kwa muda. 'Kuchovya' ni chaguo la asili katika muktadha huu; 'kisha' huonyesha mwendelezo wa tendo bila kubadili maana.
- source_word: אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה
  choice: vitu hivyo pamoja na ndege aliye hai
  rationale: Kutaja 'vitu hivyo' huondoa utata wa upatanisho wa ngeli katika Kiswahili na kuhifadhi kwamba vifaa vilivyotajwa pamoja na ndege hai vinachovywa.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחֻטָה
  choice: katika damu ya ndege aliyechinjwa
  rationale: '''Katika'' huonyesha kile ambacho vitu vinachovywa ndani yake, na ''aliyechinjwa'' huhifadhi maana ya kitendo cha kuchinja katika ibada.'
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: juu ya maji yanayotiririka
  rationale: Kirai halisi ni 'maji yaliyo hai' na kwa kawaida hurejelea maji safi yenye mtiririko, si maji yaliyotuama. 'Maji yanayotiririka' hutoa maana hiyo kwa Kiswahili cha asili, huku tafsiri halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya מַיִם חַיִּים katika ibada ya utakaso
  choice: maji yanayotiririka
  alternative: maji yaliyo hai; maji safi
  rationale: Tafsiri hii inaeleza maana ya kawaida ya kirai cha Kiebrania katika mazingira haya bila kukiwekea maana za kitheolojia za baadaye. Tanbihi huhifadhi umbo lake halisi na uwezekano wa kutafsiriwa 'maji safi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa sheria ya ibada. Kurudiwa kwa 'ndege aliye hai' kumehifadhiwa ili kuonyesha kwa uwazi tofauti iliyomo katika Kiebrania.
