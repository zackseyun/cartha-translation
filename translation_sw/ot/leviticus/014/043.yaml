base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: sw
  text: Lakini ikiwa ugonjwa huo[a] utarudi na kuzuka ndani ya nyumba baada ya mawe kuondolewa, baada ya nyumba kukwanguliwa, na baada ya kupakwa plasta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maambukizi hayo” au “pigo hilo.” Neno la Kiebrania nega ni istilahi ya kiufundi katika Mambo ya Walawi kwa hali yenye dalili inayoathiri watu, mavazi, au nyumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaendeleza utaratibu wa kisheria huku ikianzisha hali nyingine inayotofautiana na hatua zilizotangulia.
- source_word: יָשׁוּב
  choice: utarudi
  rationale: Kitenzi שוב hapa kinaeleza kutokea tena kwa hali hiyo baada ya hatua za kuitibu nyumba.
- source_word: הַנֶּגַע
  choice: ugonjwa huo
  rationale: נגע ni istilahi ya kiufundi katika Mambo ya Walawi kwa hali yenye dalili inayoathiri watu, mavazi, au nyumba; 'ugonjwa' ni wazi, ingawa kwa nyumba ni lugha iliyopanuliwa, hivyo mbadala zimewekwa katika tanbihi.
- source_word: וּפָרַח
  choice: na kuzuka
  rationale: פרח, kwa maana halisi kuchipua, hutumiwa hapa kwa kutokea au kuenea upya kwa ugonjwa; 'kuzuka' huhifadhi taswira ya mlipuko kwa Kiswahili cha kawaida.
- source_word: בַּבַּיִת
  choice: ndani ya nyumba
  rationale: Herufi ב ni ya mahali; 'ndani ya nyumba' inaeleza wazi eneo la kutokea tena kwa hali hiyo.
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
  choice: baada ya mawe kuondolewa
  rationale: Hurejelea hatua iliyoagizwa ya kuyatoa mawe yaliyoathiriwa. Kauli tendwa haibainishi mtendaji kuliko Kiebrania.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת
  choice: baada ya nyumba kukwanguliwa
  rationale: הקצות hapa ni kukwangua sehemu za nyumba; 'kukwanguliwa' ni tendo halisi kuliko tafsiri pana ya kusafishwa.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: na baada ya kupakwa chokaa
  rationale: טוח humaanisha kupaka au kupiga plasta. 'Kupakwa chokaa' ni usemi wa kawaida wa ujenzi katika Kiswahili na hauongezi mtendaji ambaye Kiebrania hakumtaji.
