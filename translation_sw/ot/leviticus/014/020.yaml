base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: sw
  text: Kisha kuhani atatoa sadaka ya kuteketezwa na sadaka ya nafaka juu ya madhabahu[a]; kuhani atamfanyia mtu huyo upatanisho, naye atakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “naye atatakasika.” Kiebrania hueleza hali inayotokana na ibada: “naye atakuwa safi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: atatoa
  rationale: Katika muktadha wa dhabihu, Hifili ya עלה humaanisha kutoa sadaka juu ya madhabahu; “atatoa” ni Kiswahili cha kawaida na chenye maana ya kiibada hapa.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: עלה ni istilahi ya kawaida ya sadaka inayoteketezwa; tafsiri hii inaeleweka na kudumisha tofauti yake na sadaka nyingine.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za dhabihu za Walawi, מִנְחָה humaanisha sadaka ya nafaka, si zawadi ya jumla.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Kiambishi cha mwelekeo katika muktadha huu kinaonyesha kwamba sadaka inatolewa juu ya madhabahu.
- source_word: וְכִפֶּר עָלָיו
  choice: atamfanyia upatanisho
  rationale: Katika muktadha wa kikuhani, כפר ina maana ya kufanya upatanisho kwa niaba ya mtu; kiambishi “-m-” na “-fanyia” vinaonyesha mnufaika kwa ufasaha.
- source_word: וְטָהֵר
  choice: mtu huyo atakuwa safi
  rationale: Qal inaeleza hali inayotokana na ibada hiyo. “Atakuwa safi” huhifadhi lugha ya hali ya usafi bila kuibadili kuwa mchakato wa kutakaswa; “mtu huyo” huondoa utata wa kiwakilishi ambao usingekuwa wa asili katika Kiswahili.
theological_decisions:
- issue: Asili ya usafi katika sheria ya kikuhani
  choice: usafi wa kiibada
  alternative: usafi wa kimaadili
  rationale: Muktadha wa Walawi 14 ni kurejeshwa kwa mtu kutoka hali ya unajisi baada ya ugonjwa wa ngozi. Neno rahisi “safi” limehifadhiwa bila kuingiza dai la mabadiliko ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata kwa karibu mfululizo wa matendo katika Kiebrania huku ukitumia marejeo ya viwakilishi yaliyo wazi na ya asili katika Kiswahili.
