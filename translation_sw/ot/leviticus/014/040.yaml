  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/חִלְּצוּ֙ אֶת הָ֣/אֲבָנִ֔ים אֲשֶׁ֥ר בָּ/הֵ֖ן הַ/נָּ֑גַע וְ/הִשְׁלִ֤יכוּ אֶתְ/הֶן֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: sw
  text: Kisha kuhani ataamuru wayaondoe mawe yaliyo na pigo hilo[a] na kuyatupa nje ya mji, mahali najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe ambamo mna pigo hilo.” Kiebrania kinasema kihalisi, “mawe ambamo mna pigo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Kisha ... ataamuru
  rationale: Waw pamoja na kauli timilifu inaendeleza mfuatano wa maagizo ya utaratibu. “Kisha” huonyesha hatua inayofuata, na “ataamuru” huhifadhi nguvu ya agizo.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa כֹּהֵן katika taratibu za Walawi.
- source_word: וְחִלְּצוּ
  choice: wayaondoe
  rationale: Kitenzi kina maana ya kuyatoa au kuyaondoa mawe ukutani; “wayaondoe” ni cha asili katika Kiswahili na hakiongezi maelezo yasiyokuwamo kuhusu namna ya kufanya hivyo.
- source_word: הָאֲבָנִים
  choice: mawe
  rationale: Tafsiri ya moja kwa moja na ya kawaida; muktadha unaonyesha kuwa ni mawe ya ujenzi bila kulazimika kuongeza neno hilo.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: yaliyo na pigo hilo
  rationale: “Pigo” huhifadhi upana wa נֶגַע katika sheria za Walawi bila kulifanya kwa lazima kuwa ugonjwa wa kisasa, ukungu, au ukoma. Muundo huu ni wa asili kuliko kufuata kihalisi “ambamo mna pigo.”
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: na kuyatupa
  rationale: “Kuyatupa” ni kitenzi cha sasa na cha kawaida kwa tendo la kuondoa mawe kwa kuyatupa; kiambishi cha yambwa kinarejelea mawe.
- source_word: אֶל מִחוּץ לָעִיר
  choice: nje ya mji
  rationale: Huwasilisha kwa kawaida mwendo wa kuelekea sehemu iliyo nje ya mji.
- source_word: אֶל מָקוֹם טָמֵא
  choice: mahali najisi
  rationale: “Najisi” ni istilahi iliyozoeleka ya hali ya kutokuwa safi kiibada katika muktadha wa Walawi, bila kuifanya iwe uchafu wa kawaida tu.
theological_decisions:
- issue: Istilahi ya hali ya kutokuwa safi kiibada katika sheria za Walawi
  choice: Kutumia “najisi” kwa טָמֵא na “pigo” kwa נֶגַע
  alternative: “pasipo safi” au “pachafu” kwa טָמֵא; “maambukizi,” “ukungu,” “ukoma,” au “doa” kwa נֶגַע
  rationale: Aya inahusu makundi ya usafi wa kiibada na hali isiyofafanuliwa kisayansi ya nyumba. “Najisi” huhifadhi maana ya kiibada, huku “pigo” likiacha wazi asili halisi ya hali hiyo badala ya kuamua kuwa ni ugonjwa, ukungu, au ukoma.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi mfuatano wa kisheria wa hatua za ibada, na istilahi “pigo” na “najisi” zimeepuka ufafanuzi wa kisayansi au wa kimadhehebu usiotolewa na Kiebrania.
