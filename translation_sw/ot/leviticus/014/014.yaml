  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: sw
  text: Kisha kuhani atachukua kiasi cha damu ya sadaka ya hatia[a]. Kuhani huyo ataipaka kwenye ndewe ya sikio[b] la kulia la mtu anayefanyiwa utakaso, kwenye kidole gumba cha mkono wake wa kulia, na kwenye kidole kikubwa cha mguu wake wa kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka katika damu ya sadaka ya hatia”; maana ni kwamba kuhani anachukua kiasi fulani cha damu kwa ajili ya ibada hii.'
    reason: lexical_alternative
  - marker: b
    text: Au “ncha ya sikio la kulia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: kiasi cha damu ya
  rationale: Kiambishi מִן hapa kina maana ya sehemu ya kitu kizima. ‘Kiasi cha damu ya’ kinaeleza kwa Kiswahili cha kawaida kwamba kuhani hachukui damu yote, huku tanbihi ikihifadhi muundo wa karibu zaidi wa Kiebrania.
- source_word: הָאָשָׁם
  choice: sadaka ya hatia
  rationale: Katika sheria za dhabihu za Walawi, אָשָׁם ni sadaka maalumu inayohusiana na hatia na fidia. ‘Sadaka ya hatia’ ni istilahi inayoeleweka na kuitofautisha na aina nyingine za sadaka.
- source_word: תְּנוּךְ אֹזֶן
  choice: ndewe ya sikio
  rationale: תְּנוּךְ inaashiria sehemu ya mwisho au laini ya sikio katika ibada hii. ‘Ndewe ya sikio’ ni jina sahihi na fupi la sehemu hiyo; uwezekano wa ‘ncha ya sikio’ umehifadhiwa katika tanbihi.
- source_word: הַמִּטַּהֵר
  choice: mtu anayefanyiwa utakaso
  rationale: Umbo la participio la Hitpael humtaja mtu anayepitia utaratibu wa kutakaswa. Kauli hii ya Kiswahili inaonyesha wazi kwamba mtu huyo ndiye anayefanyiwa ibada, bila kudokeza kuwa anajitakasa mwenyewe.
- source_word: הַיְמָנִית
  choice: la kulia / wa kulia
  rationale: Kivumishi hiki hutaja kiungo cha upande wa kulia. Upatanisho wa kisarufi wa Kiswahili hubadilika kulingana na ‘sikio,’ ‘mkono,’ na ‘mguu.’
- source_word: בֹּהֶן יָדוֹ
  choice: kidole gumba cha mkono wake
  rationale: בֹּהֶן pamoja na ‘mkono’ humaanisha kidole gumba. Hii ndiyo istilahi ya kawaida na sahihi ya Kiswahili.
- source_word: בֹּהֶן רַגְלוֹ
  choice: kidole kikubwa cha mguu wake
  rationale: בֹּהֶן pamoja na ‘mguu’ humaanisha kidole kikubwa cha mguu. Tafsiri hii ni ya kawaida na inaeleweka kwa urahisi.
- source_word: וְלָקַח ... וְנָתַן
  choice: atachukua ... ataipaka
  rationale: Katika maagizo haya ya kisheria, vitenzi vina nguvu ya agizo la utaratibu. Wakati ujao wa Kiswahili huwasilisha maagizo hayo kwa kawaida; ‘ataipaka kwenye’ ni namna asilia ya kueleza kuwekwa kwa damu juu ya sehemu za mwili.
theological_decisions:
- issue: Hali ya mtu anayepitia utakaso wa kiibada
  choice: mtu anayefanyiwa utakaso
  alternative: mtu anayejitakasa; mtu aliyetakaswa
  rationale: Muktadha humwonyesha mtu huyo akiwa bado anapitia utaratibu unaofanywa na kuhani. Tafsiri hii haimfanyi kuwa mtendaji wa kujitakasa wala haisemi kwamba utaratibu umekwisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kuhani huyo’ huhifadhi urudiaji wa mhusika katika Kiebrania bila kuwa mzito. ‘Ndewe’ ni istilahi sahihi ya anatomia, na tanbihi inaweka wazi mbadala wa kileksika.
