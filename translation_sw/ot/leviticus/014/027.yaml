base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: sw
  text: Kisha kuhani atanyunyiza kwa kidole chake cha kulia sehemu ya mafuta yaliyo kwenye kiganja chake cha kushoto mara saba mbele za Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: Kisha ... atanyunyiza
  rationale: Hifili ya נזה katika taratibu za ibada humaanisha kunyunyiza. “Kisha” linaonyesha kwa kawaida hatua inayofuata katika utaratibu.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika sheria za ibada.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: kwa kidole chake cha kulia
  rationale: Tafsiri hii inadumisha umoja wa “kidole” na msisitizo wa upande wa kulia, huku ikieleza chombo kilichotumiwa.
- source_word: מִן הַשֶּׁמֶן
  choice: sehemu ya mafuta
  rationale: 'מִן ina maana ya sehemu hapa: kuhani ananyunyiza kiasi kinachotolewa katika mafuta hayo, si mafuta yote.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: yaliyo kwenye kiganja chake cha kushoto
  rationale: כַּף hapa ni kiganja hasa, si mkono kwa ujumla; usemi huu unaweka wazi picha ya mafuta yaliyoshikiliwa kiganjani.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Huu ndio usemi wa kawaida na sahihi wa Kiswahili kwa idadi ya marudio.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי huonyesha tendo linalofanywa mbele au katika uwepo wa Mungu katika mazingira ya ibada; jina la agano יְהוָה limetolewa kama “Yahweh.”
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יְהוָה. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Muundo unafuata kwa karibu utaratibu wa ibada wa Kiebrania bila kuwa mgumu.
