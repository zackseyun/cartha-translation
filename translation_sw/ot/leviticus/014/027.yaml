  source_fidelity: 'Tafsiri inafuata kwa uaminifu Kiebrania: kuhani ndiye mtenda, anatumia kidole chake cha kulia, huchukua sehemu ya mafuta yaliyo kwenye kiganja chake cha kushoto, na kunyunyiza mara saba mbele za Yahweh. Mpangilio wa kishazi na maana ya kitendo cha ibada vimedumishwa.'
