  yaml_path: translation/ot/leviticus/014/056.yaml
  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: sw
  text: na kwa uvimbe, na kwa upele[a], na kwa doa angavu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiraka cha ngozi”; maana kamili ya neno la Kiebrania haijulikani.
    reason: lexical_alternative
  - marker: b
    text: Au “doa jeupe”; katika muktadha linaweza kumaanisha pia “kiraka cheupe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: uvimbe
  rationale: Katika muktadha wa Walawi 13–14 neno hili linaashiria sehemu ya ngozi iliyoinuka au kuvimba. “Uvimbe” ni neno la kawaida, fupi, na lisilobainisha ugonjwa fulani.
- source_word: סַפַּחַת
  choice: upele
  rationale: Neno hili linaashiria hali au kiraka cha ngozi, lakini maana yake kamili ya kitabibu haijulikani. “Upele” ni tafsiri ya asili na inayoeleweka katika Kiswahili; njia nyingine imehifadhiwa katika tanbihi.
- source_word: בֶּהֶרֶת
  choice: doa jeupe
  rationale: Neno hili linamaanisha doa angavu au jeupe katika lugha ya uchunguzi wa ngozi. “Doa jeupe” linaendana na muktadha mpana wa Walawi 13, huku “doa angavu” likihifadhiwa kama tafsiri mbadala.
- source_word: וְ/לַ
  choice: na kuhusu
  rationale: Muundo unaorudiwa unaendeleza orodha ya mambo ambayo maagizo yaliyotangulia yanayahusu. “Na kuhusu” ni Kiswahili cha kawaida kinachohifadhi mtindo huo wa kisheria.
