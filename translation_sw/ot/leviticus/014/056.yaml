    issue: The main text renders בֶּהֶרֶת as "doa jeupe."
    rationale: Although the term can denote a whitish lesion in its Levitical context, its basic sense is brightness. Making "white" the main rendering over-specifies the Hebrew and reverses the more source-faithful main/alternative relationship.
  - severity: low
    issue: The repeated Hebrew conjunction-preposition is compressed into a single "na kuhusu."
    rationale: The draft is understandable, but repeating "na kwa" more closely preserves the source's formal enumerative structure and remains idiomatic Swahili.
