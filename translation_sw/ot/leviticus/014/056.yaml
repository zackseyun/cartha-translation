  verdict: revise
  source_fidelity: '"Uvimbe" renders שְׂאֵת well, and "upele" is a suitably non-diagnostic rendering of סַפַּחַת. However, "doa jeupe" makes whiteness primary, whereas בֶּהֶרֶת primarily denotes a bright/shining spot; whiteness is contextually plausible but should remain an alternative. Repeating "kwa" also better reflects the repeated Hebrew preposition while retaining the legal-list style.'
  naturalness: '"Na kwa uvimbe, na kwa upele, na kwa doa angavu" is natural, concise Standard East African Swahili for this list-like continuation.'
  terminology: The revised wording preserves medically uncertain skin-condition terminology without implying a modern diagnosis. "Doa angavu" retains the semantic core of בֶּהֶרֶת; "doa jeupe" is retained as a contextual alternative in the footnote.
  issues:
