  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: sw
  text: Hii ndiyo sheria kuhusu kila kisa cha ugonjwa wa ngozi na kuhusu upele wa kichwani au wa kidevuni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upele wenye magamba.” Neno la Kiebrania linamaanisha hali fulani ya ngozi, hasa kwenye kichwa au sehemu ya ndevu, lakini hali hiyo ni ugonjwa gani hasa haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Hii ndiyo sheria
  rationale: Kauli hii inatanguliza muhtasari wa kanuni zilizotangulia. “Sheria” linafaa kwa masharti na taratibu za kisheria katika muktadha huu.
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: kuhusu kila kisa cha ugonjwa wa ngozi
  rationale: לְ huonyesha jambo linalohusu sheria hiyo, na נֶגַע hapa ni tukio au kisa kinachochunguzwa. צָרַעַת si lazima iwe ugonjwa wa Hansen unaoitwa ukoma leo, hivyo “ugonjwa wa ngozi” huepuka utambulisho wa kitabibu usio na hakika.
- source_word: וְלַנָּתֶק
  choice: na kuhusu upele wa kichwani au wa kidevuni[a]
  rationale: נֶתֶק ni hali maalumu iliyochunguzwa kwenye nywele za kichwa au ndevu katika Walawi 13. Tafsiri hii ni wazi kwa msomaji wa sasa bila kudai utambulisho sahihi wa kitabibu.
