  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: sw
  text: Kisha kuhani ataamuru ndege mmoja achinjwe katika chombo cha udongo, juu ya maji safi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maji yaliyo hai,” yaani, maji yanayotiririka au maji safi yasiyotuama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Kisha ... ataamuru
  rationale: Katika maagizo ya utaratibu wa kisheria, waw pamoja na kitenzi cha hali timilifu huonyesha hatua inayofuata yenye nguvu ya agizo; “Kisha” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada na sheria.
- source_word: וְשָׁחַט
  choice: achinjwe
  rationale: Ingawa kitenzi cha Kiebrania ni cha kutenda, hapa kinafuata “ataamuru,” hivyo hali ya kutendwa huwasilisha kwa kawaida tendo lililoamriwa. “Kuchinja” linafaa kwa uuaji wa ndege katika ibada kuliko neno la jumla “kuua.”
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: ndege mmoja
  rationale: Kirai hiki kinamtaja mmoja kati ya ndege wawili waliotajwa katika muktadha; “ndege mmoja” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: juu ya chombo cha udongo
  rationale: Katika muktadha huu, ndege anachinjwa juu ya chombo ili damu iingie ndani yake. “Chombo cha udongo” ni tafsiri wazi na ya kawaida ya chombo kilichotengenezwa kwa udongo wa mfinyanzi.
- source_word: עַל מַיִם חַיִּים
  choice: chenye maji safi
  rationale: Kirai hiki kwa neno moja moja ni “maji yaliyo hai,” yaani maji yasiyotuama au maji safi kutoka katika chanzo. “Chenye maji safi” huonyesha kwa kawaida kwamba maji yako ndani ya chombo bila kupoteza uhusiano wa kirai na tendo la kuchinja.
theological_decisions:
- issue: Maana ya מַיִם חַיִּים katika ibada ya utakaso
  choice: maji safi
  alternative: maji yaliyo hai; maji yanayotiririka
  rationale: Katika muktadha huu kirai kinaeleza maji mapya, yasiyotuama, yaliyotumiwa katika ibada; hakipaswi kulazimishwa kubeba moja kwa moja ishara za kitheolojia za baadaye. Tafsiri ya neno kwa neno na maana nyingine zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa kwa mtiririko wa maagizo ya ibada na kwa lugha inayoeleweka kwa wasomaji wa kawaida.
