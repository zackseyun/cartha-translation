  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: sw
  text: 'Yahwe[a] akasema kwa Musa na Haruni, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; katika mapokeo jina hili huwakilishwa kwa cheo “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi hiki katika mtiririko wa simulizi kinaanzisha tukio jipya la Mungu kusema. “Akasema” ni Kiswahili cha kawaida na chenye heshima, huku kikitofautishwa na לֵאמֹר inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa tahajia ya kawaida ya Kiswahili, “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל מֹשֶׁה
  choice: na Musa
  rationale: Baada ya kitenzi “kusema,” kihusishi אֶל kinamtaja anayeambiwa; “akasema na Musa” ni muundo wa Kiswahili unaoeleweka na unaohifadhi uhusiano huo.
- source_word: וְאֶל אַהֲרֹן
  choice: na Haruni
  rationale: Kirai hiki kinamtaja Haruni pia kuwa mpokeaji wa maneno. Majina “Musa” na “Haruni” ni maumbo yaliyozoeleka katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hili ni neno la kawaida la Kiebrania linalotanguliza maneno ya moja kwa moja. “Akisema” linahifadhi wazi fomula hiyo, ingawa Kiswahili kingeweza pia kutumia alama ya nukta mbili pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה, si cheo אֲדֹנָי. Kutumia “Yahwe” kunalihifadhi jina hilo, huku tanbihi ikieleza mapokeo ya kulitafsiri “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kurudia “akasema … akisema” umehifadhiwa kwa sababu unaakisi fomula ya Kiebrania na mstari huu unaishia kwa utangulizi wa hotuba inayofuata.
