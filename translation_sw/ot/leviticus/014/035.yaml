  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: sw
  text: Ndipo mwenye nyumba atakuja na kumjulisha kuhani, akisema, “Kitu kama pigo[a] kimeonekana kwangu ndani ya nyumba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kama pigo.” Mwenye nyumba anaripoti hali inayoonekana, si utambuzi wa mwisho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Ndipo ... atakapokuja
  rationale: Muundo huu unaonyesha hatua inayofuata katika utaratibu wa kisheria; “ndipo” huleta wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: mwenye nyumba
  rationale: Kirai hiki humaanisha yule ambaye nyumba ni yake. “Mwenye nyumba” ni usemi wa kawaida na wa asili unaoonyesha umiliki.
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: na kumjulisha kuhani
  rationale: Hifili ya נגד ina maana ya kufanya jambo lijulikane au kutoa taarifa. “Kumjulisha” huhifadhi hali rasmi ya taarifa inayotolewa kwa kuhani.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni utangulizi wa maneno yanayonukuliwa na unasikika kwa asili katika Kiswahili.
- source_word: כְּנֶגַע
  choice: kitu kama pigo
  rationale: Kiambishi כְּ huonyesha ufananisho, si utambuzi wa hakika. Katika muktadha huu wa Mambo ya Walawi, נגע ni hali au doa linaloleta wasiwasi; “pigo” hudumisha uzito na upana wa neno bila kulifanya ugonjwa maalumu wa kisasa.
- source_word: נִרְאָה לִי
  choice: Nimeona
  rationale: Ingawa muundo wa Kiebrania ni “kimeonekana kwangu,” “Nimeona” ni Kiswahili cha asili kinachohifadhi dai la mwenye nyumba kuwa ameripoti alichokiona, si kutoa utambuzi rasmi.
- source_word: בַּבָּיִת
  choice: ndani ya nyumba
  rationale: Hapa בְּ huelekeza kwenye nyumba kama jengo lililoathiriwa; “ndani ya nyumba” ni wazi na ya kawaida.
theological_decisions:
- issue: Je, mwenye nyumba anathibitisha kuwapo kwa pigo?
  choice: 'Taarifa yake imewasilishwa kama ulinganisho wa tahadhari: “kitu kama pigo.”'
  alternative: Kutafsiri kana kwamba tayari amethibitisha kuwa ni pigo.
  rationale: Kiebrania כְּנֶגַע hudumisha kutokuwa na uhakika na kumwachia kuhani jukumu la kuchunguza na kuamua hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Mwenye nyumba,” “kumjulisha,” na “Nimeona” hutoa mtiririko wa kawaida, huku “kitu kama pigo” kikihifadhi tahadhari na kutokuwa na uhakika katika taarifa ya mwenye nyumba.
