base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: sw
  text: Naye atatoa hua mmoja au kinda moja la njiwa, kulingana na uwezo wake[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kutokana na kile ambacho mkono wake unaweza kufikia,” nahau ya Kiebrania inayomaanisha kulingana na kile anachoweza kumudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: Naye atatoa
  rationale: Ingawa kitenzi hiki kimsingi humaanisha ‘kufanya,’ katika muktadha wa dhabihu humaanisha kutekeleza au kutoa dhabihu. ‘Atatoa’ ni ya kawaida na inadumisha maana ya kiibada.
- source_word: אֶת־הָאֶחָד
  choice: mmoja / moja
  rationale: Muundo huu unaonyesha ndege mmoja kati ya aina mbili zinazotajwa. Kiswahili hubadilisha ngeli kulingana na ‘hua’ na ‘kinda.’
- source_word: מִן־הַתֹּרִים
  choice: hua mmoja
  rationale: תֹּרִים ni hua wanaotajwa mahsusi katika sheria za dhabihu; ‘hua’ ni jina la kawaida la Kiswahili kwa ndege huyu.
- source_word: אוֹ מִן־בְּנֵי הַיּוֹנָה
  choice: au kinda moja la njiwa
  rationale: Kirai hiki cha Kiebrania humaanisha njiwa mchanga. ‘Kinda moja la njiwa’ ni Kiswahili cha asili na huonyesha wazi kuwa anatolewa ndege mmoja.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: kulingana na uwezo wake
  rationale: Hii ni nahau ya Kiebrania, kwa neno halisi ‘kutokana na kile ambacho mkono wake hufikia,’ inayorejelea uwezo wa mtu kupata au kumudu kinachohitajika. Tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha kawaida.
