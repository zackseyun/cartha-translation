base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: sw
  text: Ili kuitakasa[a] nyumba, atachukua ndege wawili, mbao ya mwerezi, uzi mwekundu[b], na hisopo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kuitakasa kwa kuondoa unajisi wa kiibada.
    reason: lexical_alternative
  - marker: b
    text: Au “kitambaa chekundu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: atachukua
  rationale: Katika mfuatano wa maagizo ya ibada, kitenzi hiki kina nguvu ya wakati ujao yenye maana ya agizo. “Atachukua” ni rasmi, wazi na ya kawaida katika Kiswahili.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: ili kuitakasa nyumba
  rationale: Piel ya חטא katika muktadha huu inaeleza utakaso wa kiibada wa nyumba kutokana na unajisi, si msamaha wa kimaadili kwa nyumba. “Kuitakasa” hudumisha maana hiyo bila kuongeza wazi maneno “kutoka dhambini,” ambayo hayajaandikwa kando katika Kiebrania.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: ndege wawili
  rationale: Kiebrania cha aya hii kinataja ndege wawili tu; hakiongezi hapa kivumishi “hai,” hivyo hakijaingizwa katika matini.
- source_word: וְעֵץ אֶרֶז
  choice: kipande cha mti wa mwerezi
  rationale: Kirai hiki kinamaanisha mbao au sehemu ya mwerezi iliyotumiwa katika ibada. “Kipande cha mti wa mwerezi” huepuka wazo lisilokusudiwa la kuchukua mti mzima.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: uzi mwekundu
  rationale: Usemi huu unarejelea nyenzo iliyotiwa rangi nyekundu iliyotumiwa katika ibada. “Uzi mwekundu” ni wa asili na unaeleweka kwa wasomaji wa Kiswahili; uwezekano wa “kitambaa chekundu” umewekwa katika tanbihi.
- source_word: וְאֵזֹב
  choice: hisopo
  rationale: “Hisopo” ni jina la jadi na linalotambulika katika Kiswahili kwa mmea huu, ingawa utambulisho wake kamili wa kibotania una mjadala.
theological_decisions:
- issue: Maana ya kiibada ya לְחַטֵּא wakati nyumba ndiyo yambwa
  choice: ili kuitakasa nyumba
  alternative: ili kuiondolea nyumba unajisi; ili kuisafisha nyumba kutokana na dhambi
  rationale: Muktadha ni ibada ya utakaso wa nyumba iliyoathiriwa na unajisi. Tafsiri “kuitakasa” inadumisha aina ya tendo la kiibada bila kuifanya nyumba kuwa mhusika wa hatia ya kimaadili wala kutaja kwa uwazi upatanisho ambao aya hii hauelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, ulio wazi na wa sasa. Mpangilio wa kusudi “Ili kuitakasa nyumba” hufanya sentensi iwe ya asili bila kupoteza uhusiano wa kisarufi wa Kiebrania.
