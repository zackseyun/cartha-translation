  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: sw
  text: Kisha kuhani atapaka kiasi cha mafuta yaliyo kiganjani mwake kwenye ndewe ya sikio la kulia la mtu anayetakazwa, kwenye kidole gumba cha mkono wake wa kulia, na kwenye kidole gumba cha mguu wake wa kulia, mahali ambapo damu ya sadaka ya hatia ilikuwa imepakwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya mahali pa damu ya sadaka ya hatia.” Yaani, mahali ambapo damu ya sadaka ya hatia ilikuwa imepakwa.
    reason: Huhifadhi usemi wa karibu wa Kiebrania na hufafanua rejeleo lake kwa sehemu ambako damu ilitumika katika ibada iliyotangulia.
lexical_decisions:
- source_word: וְנָתַן
  choice: atapaka
  rationale: Ingawa נָתַן kwa msingi ni ‘kuweka/kutoa,’ katika tendo hili la ibada mafuta yanawekwa kwenye sehemu za mwili; ‘atapaka’ ni Kiswahili cha kawaida na sahihi kwa tendo hilo.
- source_word: מִן הַשֶּׁמֶן
  choice: kiasi cha mafuta
  rationale: מִן ina maana ya sehemu ya kitu; ‘kiasi cha mafuta’ huonyesha kwamba kuhani hatumii mafuta yote.
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: yaliyo kiganjani mwake
  rationale: כַּף hapa ni kiganja cha kuhani. Kiswahili hutumia kwa kawaida ‘kiganjani’ kwa kitu kilichowekwa juu au ndani ya kiganja.
- source_word: תְּנוּךְ אֹזֶן
  choice: ndewe ya sikio
  rationale: תְּנוּךְ katika muktadha huu wa ibada humaanisha sehemu laini ya chini ya sikio; ‘ndewe’ ni istilahi sahihi na inayoeleweka.
- source_word: הַמִּטַּהֵר
  choice: mtu anayekuwa akitakaswa
  rationale: Umbo la kitenzi linaonyesha mtu aliye katika hatua ya utakaso wa kiibada; usemi huu unahifadhi mchakato badala ya kuonyesha hali iliyokamilika.
- source_word: הַיְמָנִית
  choice: kulia / wa kulia
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa upande wa kulia wa sikio, mkono na mguu.
- source_word: בֹּהֶן יָדוֹ
  choice: kidole gumba cha mkono wake
  rationale: בֹּהֶן ikihusishwa na mkono ni kidole gumba.
- source_word: בֹּהֶן רַגְלוֹ
  choice: kidole gumba cha mguu wake
  rationale: בֹּהֶן ikihusishwa na mguu ni kidole gumba cha mguu.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: mahali pa damu ya sadaka ya hatia
  rationale: Tafsiri hii inafuata kwa karibu maana ya ‘juu/kwenye mahali pa damu ya sadaka ya hatia’ bila kuongeza wazi tendo la awali la kuipaka damu.
theological_decisions:
- issue: Maana ya אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: אָשָׁם huweza kuelekeza kwa hatia na pia wajibu wa kufidia. ‘Sadaka ya hatia’ ni istilahi wazi ya dhabihu katika Walawi na haiamui zaidi ya inavyosema matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Ndewe’ imetumiwa kwa usahihi wa kiungo cha mwili, na ‘anayekuwa akitakaswa’ huhifadhi wazo la mchakato wa utakaso wa kiibada.
