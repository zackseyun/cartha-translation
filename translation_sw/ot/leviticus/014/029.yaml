id: LEV.14.29
reference: Leviticus 14:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: sw
  text: Mafuta yaliyobaki katika kiganja cha kuhani[a] atayapaka kichwani mwa mtu anayetakaswa, ili kumfanyia upatanisho mbele za Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “juu ya kiganja cha kuhani.”'
    reason: Kirai cha Kiebrania hutumia kihusishi chenye maana ya kawaida ya ‘juu ya,’ lakini ‘katika kiganja’ ni usemi wa asili zaidi kwa mafuta yanayoshikiliwa mkononi.
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: Mafuta yaliyobaki
  rationale: Kirai hiki kinaonyesha sehemu ya mafuta iliyosalia. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza mlolongo wa ibada.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: katika kiganja cha kuhani
  rationale: כַּף ni kiganja au sehemu ya mkono yenye uvungu. Ingawa עַל kwa kawaida ni ‘juu ya,’ kwa kimiminika kinachoshikiliwa mkononi Kiswahili cha kawaida husema ‘katika kiganja.’
- source_word: יִתֵּן עַל רֹאשׁ
  choice: atayapaka kichwani mwa
  rationale: Kitenzi נתן kina maana pana ya kuweka au kutoa. Katika tendo hili la kutumia mafuta juu ya kichwa, ‘kupaka’ ni sahihi na ya kawaida katika Kiswahili.
- source_word: הַמִּטַּהֵר
  choice: mtu anayetakaswa
  rationale: Kauli hii inamtaja mtu anayepitia ibada ya kutakaswa. Muundo wa kutendwa unahifadhi maana ya mchakato unaoendelea.
- source_word: לְכַפֵּר עָלָיו
  choice: ili kumfanyia upatanisho
  rationale: כפר ni istilahi muhimu ya ibada. ‘Kumfanyia upatanisho’ huhifadhi uzito wake wa kidini na huonyesha kwamba tendo linafanywa kwa ajili ya mtu huyo.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי huonyesha kuwapo mbele za Mungu katika mazingira ya ibada, na יְהוָה imetafsiriwa kwa jina la agano ‘Yahweh.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu יְהוָה moja kwa moja. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya כפר katika ibada
  choice: kumfanyia upatanisho
  alternative: kumtakasa; kufunika kosa lake
  rationale: ‘Upatanisho’ huhifadhi istilahi ya kiibada bila kuamua kimadhehebu jinsi tendo hilo linavyofanya kazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. ‘Kichwani mwa’ na ‘mbele za’ ni miundo ya kawaida na yenye heshima; istilahi ya kiibada ‘upatanisho’ imehifadhiwa.
