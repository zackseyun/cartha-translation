  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: sw
  text: Kisha kuhani atatoa sadaka ya dhambi[a] na kufanya upatanisho kwa ajili ya mtu anayetakaswa kutokana na unajisi wake; baada ya hayo atachinja sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka inayotumiwa kuleta utakaso katika taratibu za ibada za Walawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: atatoa
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha ‘kufanya,’ katika muktadha wa dhabihu humaanisha kuandaa au kutoa dhabihu. ‘Atatoa’ ni Kiswahili cha kawaida na kinachoonyesha tendo la kidini kwa usahihi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhudumu wa ukuhani katika ibada ya Walawi.
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Hapa חַטָּאת ni kitu kinachotolewa, kwa hiyo linamaanisha sadaka, si dhambi yenyewe. ‘Sadaka ya dhambi’ ni istilahi inayotambulika sana; maana mbadala ya ‘sadaka ya utakaso’ imehifadhiwa katika tanbihi.
- source_word: וְכִפֶּר
  choice: kufanya upatanisho
  rationale: Kauli hii huhifadhi maana ya kiibada na kiteolojia ya כפר bila kuamua nadharia fulani maalumu kuhusu jinsi upatanisho unavyofanya kazi.
- source_word: עַל
  choice: kwa ajili ya
  rationale: Pamoja na כפר, kihusishi hiki humtaja mtu ambaye upatanisho unafanywa kwa niaba yake.
- source_word: הַמִּטַּהֵר
  choice: mtu anayetakaswa
  rationale: Kauli hii humtaja mtu aliye katika mchakato wa kutakaswa kiibada. Muundo wa Kiswahili wa kutendwa unaeleza vizuri jukumu lake katika ibada hii.
- source_word: מִטֻּמְאָתוֹ
  choice: kutokana na unajisi wake
  rationale: טֻמְאָה hapa ni hali ya unajisi wa kiibada. ‘Wake’ huhifadhi kiambishi cha umoja katika Kiebrania.
- source_word: וְאַחַר
  choice: baada ya hayo
  rationale: Kauli hii inaonyesha wazi mpangilio wa hatua zinazofuatana katika ibada.
- source_word: יִשְׁחַט
  choice: atachinja
  rationale: ‘Kuchinja’ ni kitenzi sahihi na cha kawaida kwa kuua mnyama wa dhabihu.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hii ni istilahi iliyozoeleka ya Kiswahili kwa dhabihu iliyoteketezwa madhabahuni.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu za Walawi
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: חַטָּאת ni jina la kiufundi la dhabihu na katika muktadha huu linahusiana pia na kuondolewa kwa unajisi. Tafsiri kuu inadumisha istilahi inayotambulika sana, huku tanbihi ikihifadhi maana mbadala inayowezekana.
- issue: Hali ya mtu anayetajwa na הַמִּטַּהֵר
  choice: mtu anayetakaswa
  alternative: mtu anayejitakasa
  rationale: Muundo wa Kiebrania unaweza kuwa na hisia ya kujirejelea, lakini katika muktadha mtu huyo anapitia taratibu za utakaso zinazofanywa na kuhani. Tafsiri ya kutendwa ni ya asili katika Kiswahili na haidokezi kwamba mtu huyo ndiye anayetekeleza dhabihu.
- issue: Maana ya כפר
  choice: kufanya upatanisho
  alternative: kuondoa unajisi kwa ibada
  rationale: ‘Kufanya upatanisho’ huhifadhi uzito mpana wa neno la Kiebrania na kuepuka kulifungia katika maana ya utakaso pekee au katika fundisho maalumu la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wazi, na unaofaa maelekezo ya kiibada. Istilahi ‘unajisi,’ ‘upatanisho,’ na ‘sadaka ya kuteketezwa’ zimetumiwa kwa uthabiti wa lugha ya Walawi bila kuingiza maelezo ya dhehebu fulani.
