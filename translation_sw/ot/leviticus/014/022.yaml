  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: sw
  text: na hua wawili au makinda mawili ya njiwa, kadiri ya uwezo wake; mmoja atakuwa sadaka ya dhambi[a], na mwingine sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania linaweza kumaanisha sadaka inayotumiwa kwa ajili ya utakaso katika taratibu za ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁתֵּי תֹרִים
  choice: na hua wawili
  rationale: Kiunganishi kinaendeleza orodha ya sadaka katika mstari uliotangulia; “hua” ni jina la kawaida la ndege huyu wa dhabihu, na ngeli ya viumbe hai hudai “wawili.”
- source_word: א֤וֹ
  choice: au
  rationale: Ni kiunganishi cha uchaguzi kati ya aina mbili za ndege wanaoruhusiwa.
- source_word: שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה
  choice: makinda mawili ya njiwa
  rationale: Nahau ya Kiebrania, kihalisi “wana wawili wa njiwa,” humaanisha njiwa wachanga; “makinda” huhifadhi wazi maana ya umri.
- source_word: אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑וֹ
  choice: kadiri ya uwezo wake
  rationale: Nahau ya “mkono wake kufikia” inaonyesha uwezo wa mtu kupata au kumudu vitu hivyo; tafsiri hii ni ya asili na huhifadhi wazo la uwezo wa kiuchumi.
- source_word: וְ/הָיָ֤ה אֶחָד֙
  choice: mmoja atakuwa
  rationale: Umoja hapa unampa mmoja wa ndege hao kazi maalumu ya dhabihu; “mmoja” huonyesha mgawanyo huo kwa uwazi.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Hili ndilo neno la kawaida la ibada kwa dhabihu hii; hata hivyo, katika taratibu za utakaso linaweza kusisitiza kuondoa unajisi, jambo linalohifadhiwa katika tanbihi.
- source_word: וְ/הָ/אֶחָ֖ד
  choice: na mwingine
  rationale: Neno lenye kiambishi cha uambishaji linatofautisha ndege aliyebaki na wa kwanza; “mwingine” ni usemi wa kawaida wa Kiswahili.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno linaloeleweka kwa dhabihu iliyoteketezwa yote; linafaa zaidi katika Kiswahili cha Biblia kuliko tafsiri ya kietimolojia “sadaka ya kupaa.”
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu za Walawi
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kutaja sadaka inayohusishwa na dhambi na pia sadaka inayotumika kuondoa unajisi wa kiibada. Tafsiri kuu inatumia istilahi inayotambulika zaidi, huku tanbihi ikihifadhi mkazo unaowezekana wa utakaso katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida, huku istilahi za dhabihu zikibaki thabiti na utata halisi wa חַטָּאת ukihifadhiwa katika tanbihi.
