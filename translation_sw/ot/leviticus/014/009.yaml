  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: sw
  text: 'Siku ya saba atanyoa nywele zake zote: nywele za kichwa chake, ndevu zake, na nyusi zake. Atanyoa nywele zake zote, atafua nguo zake, na ataosha mwili wake kwa maji; ndipo atakuwa safi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: Siku ya saba
  rationale: Nahau ya Kiebrania inaanzisha hatua inayofuata katika utaratibu. Kiswahili cha kawaida huonyesha wakati huu kwa ufupi bila kutafsiri וְהָיָה neno kwa neno.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: atanyoa nywele zake zote
  rationale: Kitenzi cha Piel kinaonyesha kuondolewa kwa nywele, na kirai hiki kinahifadhi maana ya jumla ya nywele zote.
- source_word: רֹאשׁוֹ
  choice: nywele za kichwa chake
  rationale: Ingawa Kiebrania kinasema kihalisi 'kichwa chake,' kitu kinachonyolewa ni nywele; Kiswahili hiki ni wazi na cha kawaida.
- source_word: זְקָנוֹ
  choice: ndevu zake
  rationale: Hii ndiyo maana ya kawaida ya זָקָן katika muktadha huu.
- source_word: גַּבֹּת עֵינָיו
  choice: nyusi zake
  rationale: Kirai cha Kiebrania 'matao ya macho yake' humaanisha nyusi; 'nyusi' ni Kiswahili cha asili na sahihi.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: Atanyoa nywele zake zote
  rationale: Marudio ya chanzo yamehifadhiwa kwa kuwa yanasisitiza ukamilifu wa unyoaji.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: atafua nguo zake
  rationale: '''Kufua'' ndiyo kitenzi cha kawaida cha Kiswahili kwa kuosha nguo.'
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמָּיִם
  choice: na kuosha mwili wake kwa maji
  rationale: בָּשָׂר ni 'nyama' kihalisi lakini hapa humaanisha mwili wa mtu. 'Kuosha mwili wake kwa maji' huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְטָהֵר
  choice: ndipo atakapokuwa safi
  rationale: Kitenzi kinaonyesha hali ya usafi wa kiibada inayofuata matendo yaliyotajwa; 'ndipo' huweka wazi mfuatano bila kubadili maana.
theological_decisions:
- issue: Istilahi ya usafi wa kiibada
  choice: safi
  alternative: ametakaswa
  rationale: '''Safi'' huhifadhi hali ya kiibada inayokusudiwa na טהר bila kuifanya iwe dai kuhusu kutokuwa na dhambi au utakaso wa kimaadili.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka marudio ya Kiebrania kwa msisitizo, huku 'nywele za kichwa chake' ikiondoa utata usio wa lazima wa kusema kwamba kichwa chenyewe kinanyolewa.
