  text: וְ/צִוָּ֨ה הַ/כֹּהֵ֜ן וּ/פִנּ֣וּ אֶת הַ/בַּ֗יִת בְּ/טֶ֨רֶם יָבֹ֤א הַ/כֹּהֵן֙ לִ/רְא֣וֹת אֶת הַ/נֶּ֔גַע וְ/לֹ֥א יִטְמָ֖א כָּל אֲשֶׁ֣ר בַּ/בָּ֑יִת וְ/אַ֥חַר כֵּ֛ן יָבֹ֥א הַ/כֹּהֵ֖ן לִ/רְא֥וֹת אֶת הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: sw
  text: Kisha kuhani ataamuru waondoe vitu vyote ndani ya nyumba kabla ya kuhani kuingia kuikagua sehemu iliyoathirika[a], ili kila kitu kilichomo ndani ya nyumba kisije kikawa najisi. Baada ya hayo, kuhani ataingia kuikagua nyumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “doa,” “maambukizi,” au kwa mapokeo “pigo.” Neno la Kiebrania negaʿ humaanisha sehemu au hali iliyoathirika inayokaguliwa na kuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Kisha ... ataamuru
  rationale: Katika sheria ya hatua kwa hatua, waw pamoja na kitenzi timilifu huonyesha tendo linalofuata; “Kisha” huwasilisha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na linalofaa kwa כֹּהֵן katika muktadha wa sheria za Walawi.
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: waondoe vitu vyote ndani ya nyumba
  rationale: Kitenzi cha wingi kina mtenda asiyeainishwa. Katika muktadha huu, maana ni kuifanya nyumba iwe tupu kwa kuondoa vilivyomo; usemi huu ni wa asili zaidi kuliko tafsiri ya neno kwa neno “waitoe nyumba tupu.”
- source_word: בְּטֶרֶם
  choice: kabla
  rationale: Huonyesha wakati kwa uwazi na kwa lugha ya kawaida.
- source_word: לִרְאוֹת
  choice: kuikagua
  rationale: Ingawa maana ya msingi ni “kuona,” hapa ni uchunguzi rasmi wa kuhani, hivyo “kukagua” huwasilisha kazi hiyo bila maelezo kupita kiasi.
- source_word: הַנֶּגַע
  choice: sehemu iliyoathirika
  rationale: נֶגַע hapa ni doa, sehemu, au hali iliyoathirika inayokaguliwa na kuhani; si lazima iwe ugonjwa unaoweza kutambuliwa kwa istilahi za tiba ya kisasa.
- source_word: וְלֹא יִטְמָא
  choice: ili ... kisitiwe unajisi
  rationale: Kishazi hiki kinaonyesha kusudi la kuondoa vitu kabla ya ukaguzi. “Kutiwa unajisi” huhifadhi maana ya hali ya kiibada badala ya kudokeza uchafu wa kawaida au hatia ya kimaadili.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: kila kitu kilicho ndani ya nyumba
  rationale: Hurejelea vitu vyote vilivyomo nyumbani na kufuata kwa karibu upana wa usemi wa Kiebrania.
- source_word: וְאַחַר כֵּן
  choice: Baada ya hayo
  rationale: Huonyesha hatua inayofuata katika utaratibu.
- source_word: לִרְאוֹת אֶת הַבָּיִת
  choice: kuikagua nyumba
  rationale: Hapa nyumba nzima ndiyo kitu kinachokaguliwa; “kukagua” hudumisha muktadha rasmi wa uchunguzi.
theological_decisions:
- issue: Istilahi ya unajisi wa kiibada
  choice: kisitiwe unajisi
  alternative: kisifanywe kichafu; kisiwe najisi
  rationale: טמא katika Walawi hueleza hali ya kutokuwa safi kiibada, si lazima uchafu wa kawaida au kosa la kimaadili. “Kutiwa unajisi” ni usemi wenye heshima na unaotambulika katika Kiswahili cha Biblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili utaratibu wa kisheria uwe wazi. “Waondoe vitu vyote ndani ya nyumba” hufafanua kwa asili tendo la kuifanya nyumba iwe tupu bila kubadili lengo la maandishi.
