base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: sw
  text: Na yeyote anayelala ndani ya nyumba atafua nguo zake[a], na yeyote anayekula ndani ya nyumba atafua nguo zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayelala usingizi ndani ya nyumba.” Kitenzi cha Kiebrania kinaweza kumaanisha kulala chini au kulala usingizi; tafsiri katika matini ina maana pana zaidi na inafaa muktadha wa sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: Na yeyote anayelala
  rationale: Kitenzi kishirikishi chenye kibainishi kimetumiwa kama nomino kumaanisha mtu yeyote katika sheria hii. ‘Anayelala’ huhifadhi maana pana ya kulala chini au kuwa amelala bila kulazimisha maana ya usingizi.
- source_word: בַּבַּיִת
  choice: ndani ya nyumba
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya kishazi cha mahali, na ‘ndani’ huonyesha wazi kuwa mtu yumo katika nyumba hiyo.
- source_word: יְכַבֵּס
  choice: atalazimika kufua
  rationale: Katika sheria za kikuhani, hali hii ya kitenzi inaonyesha wajibu uliowekwa. ‘Atalazimika kufua’ ni Kiswahili cha sasa kinachoeleza wajibu huo kwa uwazi.
- source_word: אֶת־בְּגָדָיו
  choice: nguo zake
  rationale: בֶּגֶד humaanisha vazi au nguo. ‘Nguo zake’ ni ya kawaida, wazi, na hudumisha umoja wa kisarufi bila kulazimisha jinsia katika Kiswahili.
- source_word: וְהָאֹכֵל
  choice: na yeyote anayekula
  rationale: Kama kishirikishi cha kwanza, hiki kina maana ya jumla katika sheria. ‘Yeyote anayekula’ ni cha asili na kinaonyesha kwamba amri inamhusu mtu yeyote anayefanya tendo hilo.
theological_decisions:
- issue: Jinsia katika maumbo ya Kiebrania ya umoja wa kiume yenye maana ya jumla
  choice: Kutumia ‘yeyote ... nguo zake’
  alternative: ‘Mtu anayelala ... nguo zake’
  rationale: Kiebrania kina maumbo ya umoja wa kiume yanayotumika kwa maana wakilishi katika sheria. Kiswahili hakihitaji kuonyesha jinsia hapa; ‘yeyote’ huhifadhi upeo wa jumla, na ‘zake’ hudumisha umoja wa mhusika bila kudai kuwa sheria inawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya kisheria ni wazi na yenye hadhi lakini ya kisasa. ‘Kufua nguo’ ni ya kawaida kuliko ‘kuosha mavazi.’ Alama ya tanbihi imewekwa baada ya tukio la kwanza la kishazi kinachohitaji ufafanuzi.
