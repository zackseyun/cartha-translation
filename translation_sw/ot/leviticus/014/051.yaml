  verdict: revise
  source_fidelity: Draft accurately represents the ritual sequence, the living bird, the slaughtered bird, fresh/living water, and the sevenfold sprinkling. However, “kipande” (‘piece’) adds a specific limitation not expressed by עֵץ, and the sentence break weakens the immediate syntactic connection between taking the listed items and dipping all of them.
  naturalness: The register is clear Standard East African Swahili. A single coordinated sentence better reflects the procedural sequence and makes the scope of the dipping action natural and unambiguous.
  terminology: “Hisopo,” “uzi mwekundu,” “ndege aliye hai,” “aliyechinjwa,” and “maji safi” are appropriate. The footnotes faithfully preserve the Hebrew idioms and their lexical force.
  issues:
  - severity: low
    issue: “kipande cha mti wa mwerezi” adds ‘piece.’
    rationale: The Hebrew says cedar wood/tree (עֵץ הָאֶרֶז) without specifying a ‘piece.’ “Mbao ya mwerezi” conveys the material without this added restriction.
  - severity: low
    issue: The full stop after “ndege aliye hai” separates the dipping action from its complete object list.
    rationale: 'Hebrew directly continues: he takes the cedar wood, hyssop, scarlet material, and living bird, and dips them. Retaining one coordinated sentence preserves this connection.'
  revised_text: Kisha atachukua mbao ya mwerezi, hisopo, uzi mwekundu[a], na ndege aliye hai, na kuvichovya katika damu ya ndege aliyechinjwa na katika maji safi[b]; kisha atainyunyizia nyumba mara saba.
