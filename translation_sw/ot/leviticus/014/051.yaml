id: LEV.14.51
reference: Leviticus 14:51
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: sw
  text: Kisha atachukua mbao ya mwerezi, hisopo, uzi mwekundu[a], na ndege aliye hai, na kuvichovya katika damu ya ndege aliyechinjwa na katika maji safi[b]; kisha atainyunyizia nyumba mara saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “wekundu wa mdudu”; kwa kawaida hueleweka kuwa uzi uliotiwa rangi nyekundu.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “maji yaliyo hai,” yaani maji safi kutoka chemchemi au maji yanayotiririka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha atachukua
  rationale: Katika maagizo ya taratibu, umbo hili linaendeleza hatua inayofuata; wakati ujao wa Kiswahili unaeleza agizo hilo kwa kawaida.
- source_word: עֵץ הָאֶרֶז
  choice: kipande cha mti wa mwerezi
  rationale: Kirai hiki kinataja mbao ya mwerezi inayotumiwa kama kifaa cha ibada; “kipande” huonyesha kwa lugha ya kawaida kuwa si mti mzima.
- source_word: הָאֵזֹב
  choice: hisopo
  rationale: Hili ndilo jina la kawaida la kibiblia la mmea unaotajwa, bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: uzi mwekundu[a]
  rationale: Kirai kinaashiria nyenzo iliyotiwa rangi nyekundu, kwa kawaida uzi; tanbihi inahifadhi usemi halisi usio wa kawaida wa Kiebrania.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ndege aliye hai
  rationale: Hutofautisha wazi ndege huyu na yule aliyechinjwa.
- source_word: וְטָבַל אֹתָם
  choice: Atavichovya
  rationale: Kitenzi kinamaanisha kuchovya au kuzamisha; ngeli ya “vi-” inarejelea vitu vya ibada vilivyotajwa.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: katika damu ya ndege aliyechinjwa
  rationale: “Kuchinjwa” huhifadhi maana ya kitendo cha kiibada vizuri kuliko “kuuawa” tu.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: na katika maji safi[b]
  rationale: “Maji safi” hutoa maana ya maji mapya kutoka chanzo hai katika Kiswahili cha kawaida; tanbihi huhifadhi maana halisi na uwezekano wa maji yanayotiririka.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: kisha atainyunyizia nyumba
  rationale: Kitenzi hiki ndicho cha kawaida kwa kunyunyiza katika ibada, na kihusishi cha Kiebrania kinaelekezwa kwa nyumba.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha idadi.
theological_decisions:
- issue: Tafsiri ya מַיִם חַיִּים katika sheria ya utakaso
  choice: maji safi
  alternative: maji yaliyo hai; maji yanayotiririka
  rationale: Katika muktadha huu, usemi wa Kiebrania huelekea kumaanisha maji mapya kutoka chemchemi au chanzo kinachotiririka. “Maji safi” huepuka kuingiza maana za kitheolojia za baadaye, huku tanbihi ikihifadhi usemi halisi na upana wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa ili mlolongo wa hatua za ibada uwe wazi kwa msomaji wa kawaida; istilahi za kiibada zimehifadhiwa bila kuongeza maelezo ya kimadhehebu.
