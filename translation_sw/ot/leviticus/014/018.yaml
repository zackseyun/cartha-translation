  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: sw
  text: Na mafuta yaliyobaki juu ya kiganja cha kuhani, kuhani atayatia juu ya kichwa cha mtu anayetakaswa[a]; naye atamfanyia upatanisho mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu anayejitakasa.”
    reason: Umbo la Kiebrania linaweza kueleweka kuwa la kujirejelea, ingawa muktadha unaonyesha mtu anayepitia utakaso wa kiibada.
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: Mafuta yaliyobaki
  rationale: Kirai hiki kinaonyesha sehemu ya mafuta iliyosalia. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya kitu kilichobaki.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: juu ya kiganja cha kuhani
  rationale: כַּף ni kiganja, na עַל ni ‘juu ya.’ Tafsiri hii inafuata picha halisi ya mafuta yaliyo juu ya kiganja cha kuhani.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: atayatia juu ya kichwa
  rationale: Katika tendo hili la kiibada, נתן humaanisha kuweka au kutia. Kiwakilishi ‘-ya-’ kinaelekeza wazi kwa mafuta.
- source_word: הַמִּטַּהֵר
  choice: mtu anayetakaswa
  rationale: Nomino-itenzi ya Hitpael inaonyesha mtu aliye katika mchakato wa utakaso wa kiibada; ‘anayetakaswa’ hudumisha mchakato huo bila kudai kwamba tayari umekamilika.
- source_word: וְכִפֶּר עָלָיו
  choice: naye kuhani atamfanyia upatanisho
  rationale: Katika taratibu za kikuhani za Walawi, כפר ina maana maalumu ya kufanya upatanisho. Muundo ‘atamfanyia’ unaonyesha kwamba tendo hilo linafanywa kwa ajili yake.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי ni ‘mbele ya/katika uwepo wa,’ na ‘mbele za’ ni usemi wa Kiswahili wenye hadhi unaofaa muktadha huu. Jina la agano יְהוָה limetoholewa kuwa ‘Yahwe.’
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya כפר katika ibada ya utakaso
  choice: atamfanyia upatanisho
  alternative: atamfanyia utakaso; atamwondolea hatia
  rationale: ‘Kufanya upatanisho’ huhifadhi maana pana ya neno la kiibada bila kulifungamanisha na nadharia moja maalumu kuhusu namna upatanisho unavyofanya kazi.
- issue: Sauti ya הַמִּטַּהֵר
  choice: mtu anayetakaswa
  alternative: mtu anayejitakasa
  rationale: Ingawa umbo la Hitpael linaweza kutafsiriwa kwa kujirejelea, katika muktadha huu mtu anapokea matendo ya kikuhani. Tafsiri kuu inaonyesha hali hiyo, huku tanbihi ikihifadhi uwezekano wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kiganja’ ni sahihi kuliko ‘mkono,’ na ‘mbele za’ hudumisha sajili ya ibada bila kuwa ya kizamani kupita kiasi.
