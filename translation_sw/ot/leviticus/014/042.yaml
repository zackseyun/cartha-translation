  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: sw
  text: Kisha watachukua mawe mengine na kuyaweka mahali pa mawe yale[a], na atachukua udongo mwingine[b] na kuipaka nyumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “chini ya mawe”; hapa maana yake ni “mahali pa mawe” au “badala ya mawe.”'
    reason: lexical_alternative
  - marker: b
    text: Au “mchanganyiko mwingine wa kupaka ukuta”; Kiebrania kihalisi ni “udongo mwingine” au “mavumbi mengine,” yaani nyenzo ya kuipaka nyumba upya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Kisha watachukua
  rationale: Waw katika mfululizo wa maagizo inaonyesha hatua inayofuata; wingi wa kitenzi umehifadhiwa.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: mawe mengine
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayoonyesha mawe ya kubadilisha yaliyoondolewa.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: na kuyaweka mahali pa mawe yale
  rationale: תַּחַת hapa ina maana ya badala au mahali pa, si chini ya kimahali; 'kuyaweka' ni Kiswahili cha kawaida katika muktadha wa ukarabati.
- source_word: וְעָפָר אַחֵר
  choice: udongo mwingine
  rationale: עָפָר kimsingi ni udongo au mavumbi; hapa ni mchanganyiko wa udongo wa kutumika kuipaka nyumba. Tafsiri hii huhifadhi taswira ya chanzo bila kuifanya kuwa plasta iliyokwisha kutengenezwa.
- source_word: יִקַּח
  choice: naye atachukua
  rationale: Umoja wa nafsi ya tatu umehifadhiwa, pamoja na badiliko la ghafla kutoka wingi kwenda umoja katika Kiebrania.
- source_word: וְטָח אֶת הַבָּיִת
  choice: na kuipaka nyumba
  rationale: טוח humaanisha kupaka au kufunika uso wa nyumba kwa mchanganyiko wa udongo; 'kuipaka nyumba' ni ya asili na wazi kwa wasomaji wa Kiswahili.
