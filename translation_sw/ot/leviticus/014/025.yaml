  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: sw
  text: Kisha atamchinja mwana-kondoo wa sadaka ya hatia, na kuhani atachukua sehemu ya damu ya sadaka ya hatia na kuipaka kwenye ncha ya sikio la kulia[a] la yule anayetakaswa, kwenye kidole gumba cha mkono wake wa kulia, na kwenye kidole gumba cha mguu wake wa kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye ndewe ya sikio la kulia.” Neno la Kiebrania linamaanisha sehemu ya nje iliyo ukingoni mwa sikio.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: atamchinja
  rationale: Katika muktadha wa dhabihu, “kuchinja” ni neno mahususi na la kawaida kuliko “kuua,” nalo linaendeleza hatua za ibada.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: mwana-kondoo wa sadaka ya hatia
  rationale: Muundo wa Kiebrania unaonyesha mwana-kondoo aliyeteuliwa kuwa sadaka ya אָשָׁם.
- source_word: אָשָׁם
  choice: sadaka ya hatia
  rationale: Hapa neno hilo linataja aina maalumu ya sadaka ya Kilawi, si hali ya kuwa na hatia pekee.
- source_word: מִדַּם הָאָשָׁם
  choice: sehemu ya damu ya sadaka ya hatia
  rationale: Kihusishi מִן kina maana ya sehemu ya kitu; kuhani hatumii damu yote katika tendo hili.
- source_word: תְּנוּךְ אֹזֶן
  choice: ncha ya sikio
  rationale: Neno hilo linamaanisha sehemu ya nje iliyo ukingoni mwa sikio. “Ncha” huhifadhi upana wa maana kuliko kulitaja moja kwa moja kama ndewe.
- source_word: הַמִּטַּהֵר
  choice: yule anayetakaswa
  rationale: Kitenzi-shirikishi cha Hitpael humtaja mtu anayepitia mchakato wa kutakaswa katika ibada.
- source_word: בֹּהֶן יָדוֹ
  choice: kidole gumba cha mkono wake
  rationale: בֹּהֶן likihusishwa na mkono humaanisha kidole gumba.
- source_word: בֹּהֶן רַגְלוֹ
  choice: kidole gumba cha mguu wake
  rationale: בֹּהֶן likihusishwa na mguu humaanisha kidole kikubwa cha mguu; “kidole gumba cha mguu” ni usemi wa kawaida wa Kiswahili.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhudumu rasmi wa ibada katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya istilahi ya dhabihu אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia; sadaka ya kosa
  rationale: “Sadaka ya hatia” hutambulisha aina hii maalumu ya sadaka kwa uwazi bila kuifanya kuwa dhana ya hatia tu au kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa maagizo ya ibada ulio wazi na wenye hadhi. Alama ya tanbihi imewekwa baada ya kirai chote kinachofafanuliwa.
