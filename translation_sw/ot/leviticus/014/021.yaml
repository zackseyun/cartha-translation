id: LEV.14.21
reference: Leviticus 14:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: sw
  text: Lakini ikiwa mtu huyo ni maskini na hana uwezo wa kutosha[a], atachukua mwanakondoo mmoja dume kuwa sadaka ya hatia, atolewe kwa ibada ya kutikiswa ili kumfanyia upatanisho; pia atachukua sehemu moja ya kumi ya efa ya unga laini uliochanganywa na mafuta kuwa sadaka ya nafaka, na logi moja ya mafuta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “mkono wake haufikii”; yaani, hana uwezo wa kutosha wa kifedha.
    reason: lexical_alternative
  - marker: b
    text: “Logi” ni kipimo kidogo cha ujazo wa kimiminika kilichotumiwa katika sheria za ibada za Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: maskini
  rationale: Neno hili humaanisha mtu mwenye hali duni kiuchumi; “maskini” ni neno la kawaida, la moja kwa moja na linalofaa katika sheria hii.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: hana uwezo wa kutosha
  rationale: Nahau ya Kiebrania, kihalisi “mkono wake haufikii,” hapa inaonyesha kutokuwa na uwezo wa kifedha wa kutoa sadaka kamili.
- source_word: כֶּבֶשׂ אֶחָד
  choice: mwanakondoo mmoja dume
  rationale: כֶּבֶשׂ humaanisha mwanakondoo dume; kutaja jinsia kunahifadhi usahihi wa masharti ya sadaka.
- source_word: אָשָׁם
  choice: sadaka ya hatia
  rationale: Hili ni jina la aina mahususi ya sadaka katika sheria za Walawi; tafsiri hii ni wazi na huhifadhi utofauti wake na sadaka nyingine.
- source_word: לִתְנוּפָה
  choice: ili atikisiwe
  rationale: Kifungu hiki kinaeleza tendo la ibada la kumtikisa au kumwinua sadaka mbele za Bwana; kinamhusu mwanakondoo wa sadaka ya hatia, si sadaka nyingine tofauti.
- source_word: לְכַפֵּר עָלָיו
  choice: kumfanyia upatanisho
  rationale: Tafsiri hii huhifadhi maana ya kiibada ya כפר bila kufafanua kwa namna inayolazimisha nadharia fulani ya kitheolojia.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: sehemu moja ya kumi ya efa ya unga laini
  rationale: עִשָּׂרוֹן ni kipimo cha sehemu ya kumi, kinachoeleweka katika sheria hizi kuwa sehemu ya kumi ya efa; “unga laini” huonyesha ubora wa סֹלֶת.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Hueleza unga uliotiwa na kuchanganywa na mafuta; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: לְמִנְחָה
  choice: kuwa sadaka ya nafaka
  rationale: Katika muktadha wa Walawi, מִנְחָה ni aina mahususi ya sadaka inayotokana na nafaka.
- source_word: לֹג שָׁמֶן
  choice: logi moja ya mafuta
  rationale: לֹג ni kipimo maalumu cha ujazo wa kimiminika. Jina la kipimo limehifadhiwa badala ya kubadilishwa kwa makadirio yasiyo hakika ya kisasa.
theological_decisions:
- issue: Uwasilishaji wa istilahi za sadaka katika sheria ya kikuhani
  choice: Kuhifadhi istilahi mahususi “sadaka ya hatia,” “kumfanyia upatanisho,” na “sadaka ya nafaka,” huku tendo la תְּנוּפָה likielezwa kwa kitenzi “atikisiwe.”
  alternative: Kutumia maelezo mapana kama “sadaka ya fidia,” “kumtakasa,” au “sadaka ya kutikiswa.”
  rationale: Istilahi zilizochaguliwa zinahifadhi tofauti kati ya aina za sadaka na uzito wa lugha ya kiibada. Kitenzi “atikisiwe” huepuka kuifanya sadaka ya kutikiswa ionekane kuwa sadaka tofauti na mwanakondoo wa sadaka ya hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria umehifadhiwa bila kuwa mgumu kupita kiasi; kiwakilishi kisicho wazi cha Kiebrania kimewasilishwa kama “mtu huyo” kwa marejeo ya kawaida ya Kiswahili.
