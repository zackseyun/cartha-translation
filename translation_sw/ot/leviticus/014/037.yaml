base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: sw
  text: Ataichunguza sehemu iliyoathirika, na ikiwa sehemu hiyo katika kuta za nyumba ina mabonyeo[a] yenye rangi ya kijani-kijani au nyekundu-nyekundu, nayo yanaonekana kuwa yamezama chini ya uso wa ukuta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maeneo yaliyozama.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mwonekano wao uko chini kuliko ukuta”; yaani, yanaonekana yameingia ndani chini ya uso wa ukuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Atakichunguza
  rationale: Katika utaratibu huu wa kikuhani, kitenzi hiki kinamaanisha kuchunguza kwa makini, si kuona tu.
- source_word: הַנֶּגַע
  choice: sehemu iliyoathirika
  rationale: Neno hili hutaja hali au alama isiyo ya kawaida inayochunguzwa. Tafsiri hii inaeleweka kwa nyumba bila kulazimisha maana mahususi kama ugonjwa, ukungu, au pigo.
- source_word: וְהִנֵּה
  choice: na ikiwa
  rationale: Katika sheria ya kiutaratibu, kishazi hiki huanzisha hali inayobainika wakati wa uchunguzi; Kiswahili cha masharti ni cha kawaida na wazi hapa.
- source_word: בְּקִירֹת הַבַּיִת
  choice: katika kuta za nyumba
  rationale: Kirai hiki kinaonyesha kuwa alama zimo katika kuta au uso wake, jambo linaloendana na mabonyeo yanayotajwa baadaye.
- source_word: שְׁקַעֲרוּרֹת
  choice: mabonyeo
  rationale: Neno hili adimu humaanisha sehemu zilizobonyea au zilizozama; ‘mabonyeo’ ni fupi, ya kawaida, na inafaa kwa uso wa ukuta.
- source_word: יְרַקְרַקֹּת
  choice: yenye rangi ya kijani-kijani
  rationale: Umbo la Kiebrania linaashiria rangi inayoelekea kijani badala ya kijani tupu; uradidi wa Kiswahili unahifadhi tofauti hiyo.
- source_word: אֲדַמְדַּמֹּת
  choice: nyekundu-nyekundu
  rationale: Umbo la Kiebrania linaonyesha rangi inayoelekea nyekundu; uradidi unatoa maana ya wekundu usio mkali sana.
- source_word: וּמַרְאֵיהֶן
  choice: nayo yanaonekana
  rationale: Hurejelea mwonekano wa mabonyeo; muundo huu ni wa kawaida katika Kiswahili na unadumisha rejeo la wingi.
- source_word: שָׁפָל מִן הַקִּיר
  choice: yamezama chini ya uso wa ukuta
  rationale: Kihalisi ni ‘chini kuliko ukuta,’ lakini muktadha unaonyesha mwonekano wa sehemu zilizozama chini ya uso wa ukuta.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa msomaji wa kawaida. Sentensi inaachwa ikiendelea kwa koma kwa sababu mstari huu ni sehemu ya masharti yanayokamilishwa katika mstari unaofuata.
