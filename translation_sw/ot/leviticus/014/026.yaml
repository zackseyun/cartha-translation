  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: sw
  text: Kisha kuhani atamimina kiasi cha mafuta hayo juu ya kiganja cha mkono wake wa kushoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno kwa neno: “juu ya kiganja cha kuhani, kile cha kushoto.”'
