translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kiganja cha mkono’ kimetumiwa kwa uwazi, na ‘wake mwenyewe’ kinaondoa uwezekano wa kudhani ni mkono wa kuhani mwingine.
