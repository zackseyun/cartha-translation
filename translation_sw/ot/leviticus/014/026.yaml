lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: Kisha ... kiasi cha mafuta hayo
  rationale: Kiunganishi וּ kinaendeleza mfululizo wa ibada, hivyo ‘Kisha’ ni ya kawaida katika Kiswahili; מִן inaonyesha chanzo na, katika muktadha huu, sehemu ya mafuta yaliyotajwa tayari.
- source_word: יִצֹק
  choice: atamimina
  rationale: Yiqtol hapa inatoa hatua inayofuata ya utaratibu wa ibada; wakati ujao wa Kiswahili unaifanya kuwa agizo la kimfuatano kwa lugha ya kawaida.
- source_word: הַ/כֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na lililozoeleka katika Kiswahili kwa mhudumu wa kikuhani katika maandiko ya sheria za ibada.
- source_word: עַל כַּף
  choice: katika kiganja
  rationale: Ingawa עַל mara nyingi ni ‘juu ya,’ pamoja na kitendo cha kumimina na כַּף, Kiswahili cha kawaida husema kumimina kitu ‘katika kiganja,’ kikionyesha sehemu ya ndani ya mkono.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: cha mkono wake mwenyewe wa kushoto
  rationale: Kiebrania kwa umbo halisi kinasema ‘kiganja cha kuhani, cha kushoto.’ Tafsiri hii inaweka wazi kuwa ni mkono wa kuhani huyo mwenyewe na kuepuka urudiaji usio wa kawaida.
