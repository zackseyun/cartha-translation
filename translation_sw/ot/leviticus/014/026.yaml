  source_fidelity: The draft appropriately conveys the sequential ritual action, the priest, the oil, and the priest's own left hand. However, Hebrew עַל כַּף means 'onto/on the palm,' whereas 'katika kiganja' means 'into/in the palm' and shifts the stated spatial relation. 'Kiasi cha' is a reasonable idiomatic way to express pouring from the oil in Swahili, without asserting a numerically specified amount.
  naturalness: The revised wording remains clear, formal, and natural in Standard East African Swahili. 'Juu ya kiganja cha mkono wake wa kushoto' accurately identifies the palm and the left hand; 'wake mwenyewe' is not necessary because the possessive already makes the referent clear.
  terminology: '''Kuhani,'' ''mafuta,'' and ''kiganja'' are appropriate established biblical and general Swahili terms. The footnote preserves the Hebrew''s more literal appositional phrasing without making a disputed interpretive claim.'
