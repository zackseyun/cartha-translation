  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: sw
  text: Siku ya nane atavileta kwa kuhani, kwenye ingilio la Hema la Kukutania, mbele ya Yahweh, kwa ajili ya utakaso wake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya kutakaswa kwake.” Neno la Kiebrania hapa linahusu mchakato wa utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: atavileta
  rationale: Katika muktadha huu wa maagizo ya kisheria, umbo hili lina nguvu ya agizo la wakati ujao. Kiambishi -vi- kinarejelea vitu vya sadaka vilivyotajwa katika mstari uliotangulia.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili unaoonyesha wakati.
- source_word: לְטָהֳרָתוֹ
  choice: kwa ajili ya kutakaswa kwake
  rationale: Neno hili linahusu taratibu za ibada za kumrudisha mtu katika hali ya utakaso; kauli tendwa inaonyesha kwamba mtu huyo ndiye anayepokea utakaso.
- source_word: אֶל הַכֹּהֵן
  choice: kwa kuhani
  rationale: Huwasilisha kwa ufupi na kwa Kiswahili cha kawaida mwelekeo wa kupeleka vitu hivyo kwa kuhani.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa hema la kukutania
  rationale: Hutaja mahali pa tendo hilo kwa lugha ya kawaida huku ikihifadhi jina la mahali patakatifu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi usemi wa kiibada unaomaanisha kuwa katika uwepo wa Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limehamishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu; “Yahweh” hulihifadhi bila kulibadilisha kuwa cheo.
- issue: Maana ya kiibada ya לְטָהֳרָתוֹ
  choice: kwa ajili ya kutakaswa kwake
  alternative: kwa ajili ya kutoharishwa kwake
  rationale: “Kutakaswa” ni lugha ya sasa, yenye heshima na inayoeleweka, huku tanbihi ikihifadhi mbadala wa kiufundi zaidi katika muktadha wa usafi wa kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria na wa kiibada ulio wazi na wenye heshima. Sentensi imepangwa kwa mtiririko wa asili wa Kiswahili bila kupoteza vipashio vya Kiebrania.
