id: LEV.14.8
reference: Leviticus 14:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: sw
  text: Mtu anayetakaswa[a] atafua nguo zake, atanyoa nywele zake zote, na ataoga kwa maji; ndipo atakuwa safi. Baadaye anaweza kuingia kambini[b], lakini atakaa nje ya hema lake kwa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu anayesafishwa.” Kiebrania humaanisha mtu anayepitia utaratibu uliowekwa wa kutakaswa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ataingia kambini.” Umbo la Kiebrania linaweza kueleweka kuwa wakati ujao wa kawaida au ruhusa ya kuingia; muktadha unaonyesha kuruhusiwa kurudi huku masharti mengine yakiendelea.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: mtu anayetakaswa
  rationale: Umbo la Kiebrania humtaja mtu anayepitia utaratibu wa kutakaswa. Kauli ya kutendwa inaepusha kudokeza kwamba anajitakasa kwa uwezo wake mwenyewe.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: atafua nguo zake
  rationale: Kitenzi hiki hutumiwa hasa kwa kuosha nguo; “kufua” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: atanyoa nywele zake zote
  rationale: Tafsiri hii inaonyesha kuondolewa kwa nywele zote bila kutumia lugha isiyo ya kawaida.
- source_word: רָחַץ בַּמַּיִם
  choice: kuoga kwa maji
  rationale: Katika muktadha wa ibada, tendo hili linahusu kuuosha mwili na linatofautishwa na kufua nguo.
- source_word: וְטָהֵר
  choice: ndipo atakuwa safi
  rationale: “Ndipo” huonyesha matokeo yanayofuata hatua zilizotajwa, huku “safi” ikidumisha lugha ya hali ya kiibada.
- source_word: וְאַחַר
  choice: baadaye
  rationale: Neno hili linaanzisha hatua inayofuata katika utaratibu.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: anaweza kuingia kambini
  rationale: Muktadha unaonyesha kuruhusiwa kurudi kambini, ingawa bado kuna kizuizi cha kukaa nje ya hema. Tanbihi inadumisha uwezekano wa tafsiri ya wakati ujao wa kawaida.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: lakini atakaa nje ya hema lake
  rationale: “Atakaa” hufaa kwa ukaaji wa muda; “lakini” huweka wazi tofauti kati ya kuingia kambini na kutoruhusiwa kurudi hemani mara moja.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kutaja muda.
theological_decisions:
- issue: Asili ya lugha ya usafi wa kiibada
  choice: “Anayetakaswa” na “atakuwa safi” zimetumiwa kwa hali ya kiibada.
  alternative: “Anayesafishwa” na “atakuwa ametakasika.”
  rationale: Muktadha unahusu kurejeshwa katika hali ya usafi kulingana na utaratibu wa Walawi, si dai la moja kwa moja kuhusu utakaso wa ndani au wa kimaadili.
- issue: 'Kurudi kambini: ruhusa au wakati ujao'
  choice: “Anaweza kuingia kambini,” yaani ameruhusiwa kuingia.
  alternative: “Ataingia kambini.”
  rationale: Kizuizi kinachofuata cha kukaa nje ya hema kinaunga mkono maana ya kuruhusiwa kurudi kambini, lakini umbo la Kiebrania linaweza pia kusomwa kama wakati ujao wa kawaida; tanbihi inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Kambini” na “hema” ni maneno yanayoeleweka kwa urahisi, na sentensi inadumisha mfuatano wa matendo ya Kiebrania bila kufanya lugha kuwa ngumu.
