  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: sw
  text: Kisha kuhani atachukua baadhi ya mafuta kutoka katika logi ya mafuta, na kuyamimina katika kiganja chake cha kushoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Logi” ilikuwa kipimo cha kale cha ujazo wa vimiminika.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atachukua
  rationale: Waw pamoja na qatal inaendeleza mfuatano wa maagizo ya ibada; Kiswahili cha wakati ujao kinaonyesha agizo la hatua inayofuata kwa kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: kiasi cha mafuta kutoka katika logi
  rationale: מִן hapa ina maana ya chanzo au sehemu ya kitu; tafsiri inaonyesha kwamba kuhani anachukua baadhi ya mafuta yaliyomo katika kipimo hicho, si kipimo chote.
- source_word: לֹג
  choice: logi
  rationale: Jina la kipimo maalumu cha kale limehifadhiwa kwa unukuzi kwa sababu hakuna kipimo cha kisasa chenye thamani sawa kabisa.
- source_word: וְיָצַק
  choice: na kuyamimina
  rationale: Kitenzi kinaendeleza agizo lilelile la hatua za ibada na kinarejelea mafuta.
- source_word: עַל כַּף
  choice: katika kiganja
  rationale: Ingawa עַל kwa kawaida ni ‘juu ya,’ tendo la kumimina mafuta kwenye mkono uliokunjwa linaelezwa kwa Kiswahili cha kawaida kama kumimina ‘katika kiganja.’
- source_word: כַּף
  choice: kiganja
  rationale: כַּף hutaja hasa sehemu ya ndani ya mkono, si mkono kwa ujumla.
- source_word: הַשְּׂמָאלִית
  choice: cha mkono ... wa kushoto
  rationale: Kivumishi kinabainisha kiganja au mkono wa kushoto wa kuhani; muundo huu ni wa asili katika Kiswahili.
