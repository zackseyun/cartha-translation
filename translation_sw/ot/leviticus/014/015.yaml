  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Kirai “mwenyewe” kinaweka wazi kuwa ni mkono wa kuhani huyo, kwa kufuata kurudiwa kwa nomino katika Kiebrania bila kuleta utata.
