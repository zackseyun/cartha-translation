lexical_decisions:
- source_word: וְשָׁחַט
  choice: Kisha atamchinja
  rationale: Waw pamoja na qatal inaendeleza hatua za utaratibu; wakati ujao wa maagizo na “Kisha” huonyesha mfuatano wa ibada kwa Kiswahili cha kawaida.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: ndege mmoja
  rationale: Kirai kinamtenga ndege huyu na yule mwingine bila kumfanya kuwa wa kwanza; ngeli ya mnyama inahitaji “mmoja.”
- source_word: אֶל
  choice: ndani ya
  rationale: Katika muundo huu, ndege anachinjwa kwa namna ambayo damu inaingia chomboni; “ndani ya” huwasilisha matokeo yanayokusudiwa kwa kawaida.
- source_word: כְּלִי חֶרֶשׂ
  choice: chombo cha udongo
  rationale: Hutaja chombo kilichotengenezwa kwa udongo; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: עַל
  choice: juu ya
  rationale: 'Hudumisha uhusiano wa chanzo: tendo la kuchinja linafanywa juu ya maji yaliyomo chomboni, bila kufafanua zaidi ya maandishi.'
- source_word: מַיִם חַיִּים
  choice: maji yaliyo hai
  rationale: Tafsiri ya karibu huhifadhi nahau na mwangwi wake wa kibiblia; tanbihi inaeleza kuwa hapa inamaanisha maji mapya au yanayotiririka.
theological_decisions:
- issue: Tafsiri ya מַיִם חַיִּים katika muktadha wa utakaso wa kiibada
  choice: maji yaliyo hai
  alternative: maji mapya au maji yanayotiririka
  rationale: Maandishi makuu yanahifadhi taswira halisi na mvutano wa kileksika wa Kiebrania, huku tanbihi ikitoa maana yake ya kawaida katika agizo hili bila kuigeuza kuwa sitiari ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Atamchinja” ni sahihi kwa ndege kama kiumbe hai na kwa tendo la kiibada; “chombo cha udongo” ni cha kawaida kuliko istilahi nzito ya kitaalamu.
