  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: sw
  text: Kisha ataibomoa nyumba hiyo—mawe yake, mbao zake, na vumbi lote la nyumba hiyo[a]—na atavipeleka mahali palipo najisi nje ya mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “vumbi lote la nyumba.” Huenda pia ikamaanisha udongo au nyenzo ya ukutani iliyokwanguliwa, kama chokaa au plasta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: Kisha ataibomoa
  rationale: Kitenzi נתץ hapa kinaeleza kuvunja kabisa jengo lililoathiriwa. “Ataibomoa” ni Kiswahili cha kawaida na chenye nguvu inayofaa; “Kisha” linaonyesha mfuatano wa hatua katika muktadha.
- source_word: הַבַּיִת
  choice: nyumba hiyo
  rationale: בית hapa ni jengo lenyewe linalokaguliwa, si familia au kaya. Kiashiria “hiyo” kinaifanya sentensi iwe ya asili katika Kiswahili na kurejelea nyumba iliyotajwa katika muktadha.
- source_word: אֲבָנָיו
  choice: mawe yake
  rationale: Hili ndilo neno halisi la Kiebrania na linadumisha picha halisi ya sehemu za nyumba zinazobomolewa.
- source_word: עֵצָיו
  choice: mbao zake
  rationale: עץ inaweza kumaanisha miti au mbao; katika ujenzi wa nyumba, “mbao zake” linaeleweka kwa urahisi kuwa sehemu za mbao za jengo bila kulazimisha maana finyu ya mihimili pekee.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: plasta yote ya nyumba hiyo[a]
  rationale: עפר kwa kawaida ni vumbi au udongo, lakini katika muktadha huu wa kukwangua na kubomoa kuta huenda inamaanisha nyenzo ya ukutani iliyokwanguliwa. “Plasta” ni neno la sasa na linaloeleweka katika mazingira ya ujenzi; tanbihi inadumisha maana halisi na uwezekano mwingine.
- source_word: וְהוֹצִיא
  choice: na kuvitoa
  rationale: Kitenzi hiki ni kusababisha vitu vitoke au kuvipeleka nje. “Kuvitoa” ni cha asili na kinarejelea kwa pamoja mawe, mbao na plasta bila kuongeza namna mahsusi ya usafirishaji.
- source_word: אֶל מִחוּץ לָעִיר
  choice: nje ya mji
  rationale: Hiki ni kirai cha mwelekeo kinachoonyesha kuondolewa hadi eneo lililo nje ya makazi ya mji.
- source_word: אֶל מָקוֹם טָמֵא
  choice: mahali palipo najisi
  rationale: “Najisi” ni istilahi iliyozoeleka katika Kiswahili cha kibiblia kwa hali ya kutokuwa safi kiibada, na hapa inaeleza mahali palivyotengwa katika mfumo wa usafi wa kiibada.
theological_decisions:
- issue: Tafsiri ya istilahi ya usafi wa kiibada טָמֵא
  choice: najisi
  alternative: pasipo safi
  rationale: Katika Mambo ya Walawi, טמא ni istilahi ya kisheria na kiibada, si dai kwamba kitu hicho ni kichafu kimwili au kiovu kimaadili. “Najisi” inadumisha maana hiyo maalumu na huepuka kuichanganya na uchafu wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha orodha ya Kiebrania na utata wa עפר kupitia tanbihi. “Najisi” limetumiwa kwa uthabiti kama istilahi ya usafi wa kiibada, si uchafu wa kawaida.
