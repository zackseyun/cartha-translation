  to: Kutoka katika mafuta yaliyobaki kiganjani mwake, kuhani atayapaka kwenye ncha ya sikio la kulia[a] la mtu anayetakazwa, kwenye kidole gumba cha mkono wake wa kulia, na kwenye kidole kikubwa cha mguu wake wa kulia, juu ya damu ya sadaka ya hatia[b].
