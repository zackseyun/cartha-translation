source:
  edition: WLC
  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: sw
  text: Kutoka katika mafuta yaliyobaki kiganjani mwake, kuhani atayapaka kwenye ncha ya sikio la kulia[a] la mtu anayetakazwa, kwenye kidole gumba cha mkono wake wa kulia, na kwenye kidole kikubwa cha mguu wake wa kulia, juu ya damu ya sadaka ya hatia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndewe ya sikio la kulia.” Neno la Kiebrania linamaanisha sehemu ya nje iliyo ukingoni mwa sikio.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mafuta yanapakwa mahali pale palipokuwa tayari pamepakwa damu ya sadaka ya hatia.
    reason: lexical_clarification
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: sehemu ya mafuta yaliyobaki
  rationale: Huhifadhi maana ya kisababu ya מִן pamoja na wazo la mafuta yaliyosalia, kwa Kiswahili cha kawaida na wazi.
- source_word: עַל כַּפּוֹ
  choice: kiganjani mwake
  rationale: כַּף hapa ni kiganja au sehemu yenye uvungu ya mkono; Kiswahili hutumia kwa kawaida ‘kiganjani’ kwa mahali mafuta yalipo.
- source_word: יִתֵּן
  choice: kuyapaka
  rationale: Ingawa נתן kwa msingi ni ‘kuweka,’ katika muktadha huu wa ibada kitendo ni kupaka mafuta kwenye sehemu maalumu za mwili.
- source_word: תְּנוּךְ אֹזֶן
  choice: ncha ya sikio
  rationale: תְּנוּךְ hutaja sehemu ya nje iliyo ukingoni mwa sikio; ‘ncha ya sikio’ ni wazi bila kulazimisha utambulisho wa sehemu hiyo kuwa ndewe pekee.
- source_word: הַמִּטַּהֵר
  choice: mtu anayetakaswa
  rationale: Umbo la hitpael participle humtaja mtu anayepitia tendo au mchakato wa kutakaswa kiibada.
- source_word: בֹּהֶן יָדוֹ
  choice: kidole gumba cha mkono wake
  rationale: בֹּהֶן katika mkono ni kidole gumba.
- source_word: בֹּהֶן רַגְלוֹ
  choice: kidole gumba cha mguu wake
  rationale: בֹּהֶן katika mguu ni kidole kikubwa; ‘kidole gumba cha mguu’ ni usemi wa kawaida wa Kiswahili.
- source_word: עַל דַּם הָאָשָׁם
  choice: juu ya damu ya sadaka ya hatia
  rationale: עַל inaonyesha mafuta yanawekwa juu ya damu au mahali pale palipokwisha pakwa damu; אָשָׁם ni neno la kiufundi la dhabihu linalowakilishwa kwa uthabiti kama ‘sadaka ya hatia.’
theological_decisions:
- issue: Tafsiri ya אָשָׁם kama istilahi ya dhabihu
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: ‘Sadaka ya hatia’ hutambulisha kwa uwazi aina maalumu ya sadaka ya Kilawi inayohusiana na hatia au uwajibikaji, bila kuingiza fundisho la baadaye.
- issue: Uhusiano wa mafuta na damu katika עַל דַּם הָאָשָׁם
  choice: juu ya damu ya sadaka ya hatia
  alternative: kwenye damu ya sadaka ya hatia
  rationale: Tafsiri hii huhifadhi taswira kwamba mafuta yanapakwa juu ya damu au kwenye sehemu ileile iliyokuwa tayari na damu, bila kudai zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo umewekwa wa asili kwa Kiswahili huku marudio ya ‘kulia’ na mpangilio wa sehemu za mwili yakihifadhiwa. ‘Kutakaswa’ hapa ni katika maana ya kiibada.
