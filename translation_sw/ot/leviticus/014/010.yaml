id: LEV.14.10
reference: Leviticus 14:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: sw
  text: Na siku ya nane atachukua wanakondoo wawili wa kiume wasio na dosari, mwanakondoo mmoja wa kike mwenye umri wa mwaka mmoja asiye na dosari, sehemu tatu za kumi za efa ya unga laini kwa sadaka ya nafaka uliochanganywa na mafuta, na logi moja[a] ya mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Logi” ni kipimo kidogo cha ujazo wa vimiminika kilichotumiwa katika ibada za Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Hutoa hatua inayofuata katika utaratibu wa ibada kwa Kiswahili cha kawaida; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kila mara kwa “na” mwanzoni mwa sentensi.
- source_word: יִקַּח
  choice: atachukua
  rationale: Wakati ujao wa Kiswahili una nguvu ya agizo katika muktadha huu wa sheria na taratibu.
- source_word: שְׁנֵי כְבָשִׂים
  choice: wanakondoo wawili wa kiume
  rationale: Huhifadhi tofauti ya jinsia kati ya wanyama hawa wawili na mwanakondoo wa kike anayefuata.
- source_word: תְּמִימִים / תְּמִימָה
  choice: wasio na dosari / asiye na dosari
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha wanyama wasiokuwa na kasoro inayowafanya wasifae kutolewa.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: mwanakondoo mmoja wa kike mwenye umri wa mwaka mmoja
  rationale: Hueleza wazi jinsia na sharti la umri kwa Kiswahili cha sasa.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: sehemu tatu za kumi za efa
  rationale: Neno la Kiebrania hutaja vipimo vitatu vya sehemu ya kumi; efa iliyodokezwa imetajwa ili kiasi kieleweke.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni unga uliosagwa vizuri uliotumiwa kwa sadaka.
- source_word: מִנְחָה
  choice: kwa ajili ya sadaka ya nafaka
  rationale: Hutumia istilahi ya kawaida ya Kilawi na kuonyesha kazi ya unga huo katika sadaka.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Hueleza kwa kawaida kwamba unga laini ndio uliochanganywa na mafuta.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: na logi moja ya mafuta
  rationale: “Logi” ni kipimo maalumu cha ujazo wa vimiminika kisicho na kisawe sahihi cha kawaida katika Kiswahili; kwa hiyo jina la kipimo limehifadhiwa na kufafanuliwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Istilahi “sadaka ya nafaka” imetumiwa kwa uthabiti wa msamiati wa Kilawi. Alama ya tanbihi imewekwa baada ya “logi moja,” ambako maelezo yake yanahusika.
