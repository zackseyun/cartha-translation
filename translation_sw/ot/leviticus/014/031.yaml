  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo unaoendelea wa aya ya Kiebrania: uwezo wa kugharimia, sadaka moja ya dhambi, nyingine ya kuteketezwa, sadaka ya nafaka, na tendo la kuhani la kufanya upatanisho kwa mtu anayetakaswa mbele za Yahwe. “Atatoa” hufuata kwa kufaa mtendaji anayodokezwa na muktadha wa kiibada unaotangulia.'
  naturalness: Kiswahili ni sanifu, wazi, na kina rejesta inayofaa kwa maandishi ya kiibada. Usemi “kile anachoweza kumudu” na “mbele za Yahwe” ni wa kawaida na unaeleweka. Mpangilio wa orodha baada ya nukta mbili unafaa katika mtindo wa tafsiri ya Biblia.
  terminology: “Sadaka ya dhambi,” “sadaka ya kuteketezwa,” “sadaka ya nafaka,” na “atafanya upatanisho” zinadumisha istilahi za kiibada bila kulazimisha tafsiri ya kiteolojia iliyo finyu. “Yahwe” ni uwasilishaji thabiti wa jina la kimungu uliokusudiwa na mradi. Tanbihi zote mbili zimefungwa kwenye maneno yanayohusika na zinahifadhi mbadala halali.
