source:
  edition: WLC
  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: sw
  text: 'Atatoa kile anachoweza kumudu[a]: mmoja kuwa sadaka ya dhambi[b] na mwingine kuwa sadaka ya kuteketezwa, pamoja na sadaka ya nafaka. Hivyo kuhani atafanya upatanisho kwa ajili ya mtu anayetakaswa mbele za Yahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kile ambacho mkono wake unafikia”; yaani, kile anachoweza kumudu.
    reason: lexical_alternative
  - marker: b
    text: Au “sadaka ya utakaso.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: kile anachoweza kumudu
  rationale: Nahau hii, ambayo kihalisi inasema kile ambacho mkono wake unafikia, inaonyesha uwezo wa mtu wa kugharimia. Tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Hili ndilo jina la dhabihu linalotambulika kwa urahisi katika Kiswahili na linahifadhi uhusiano wa neno hilo na dhambi, bila kuondoa maana yake ya utakaso wa kiibada.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Neno hili humaanisha dhabihu iliyoteketezwa juu ya madhabahu; usemi huu ni wa kawaida na sahihi katika muktadha wa Walawi.
- source_word: עַל הַמִּנְחָה
  choice: pamoja na sadaka ya nafaka
  rationale: Katika utaratibu huu wa dhabihu, עַל huonyesha kuambatana au kuongezwa, wala si mahali juu ya kitu.
- source_word: וְכִפֶּר
  choice: atafanya upatanisho
  rationale: Tafsiri hii inadumisha maana ya kiibada na kitheolojia ya כפר bila kulazimisha nadharia fulani mahususi kuhusu jinsi upatanisho unavyofanya kazi.
- source_word: הַמִּטַּהֵר
  choice: mtu anayetakaswa
  rationale: Kauli ya kushirikisha inaonyesha mtu anayepitia mchakato wa kutakaswa; tafsiri hii ni wazi na ya asili katika Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Usemi huu huhifadhi maana ya kuwa mbele au katika uwepo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kwa umbo la Kiswahili linalotumiwa kwa jina Yahweh, badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Kutafsiri istilahi za dhabihu bila kuamua kupita kiasi maana ya upatanisho
  choice: sadaka ya dhambi, sadaka ya kuteketezwa, na kufanya upatanisho
  alternative: sadaka ya utakaso; kuondoa unajisi
  rationale: Istilahi zilizochaguliwa zinahifadhi lugha ya dhabihu na upatanisho katika maandiko ya kikuhani, huku tanbihi ikionyesha maana mbadala halali ya חַטָּאת.
- issue: Kutafsiri jina la Mungu
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kutumia jina Yahwe kunawakilisha moja kwa moja יהוה na kutofautisha jina binafsi na cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Kitenzi “Atatoa” kinaeleza kwa kawaida tendo linaloendelezwa kutoka muktadha uliotangulia, na alama ya tanbihi [b] imewekwa moja kwa moja baada ya istilahi inayohusika.
