base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: sw
  text: Kisha kuhani ataagiza wachukue, kwa ajili ya mtu anayetakaswa, ndege wawili walio hai na safi, mbao ya mwerezi, uzi mwekundu[a], na hisopo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyuzi nyekundu.” Kirai cha Kiebrania שְׁנִי תוֹלַעַת kinamaanisha nyenzo iliyotiwa rangi nyekundu; umbo kamili la nyenzo hiyo linaweza kutafsiriwa kwa njia mbalimbali.
    reason: lexical_alternative
  - marker: b
    text: Haijulikani kwa hakika ni mmea gani unaomaanishwa na “hisopo”; jina la kimapokeo limehifadhiwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: Kisha kuhani ataagiza
  rationale: Katika maagizo ya hatua kwa hatua, waw huendeleza mfuatano; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, huku wakati ujao ukihifadhi nguvu ya agizo la kisheria.
- source_word: וְלָקַח
  choice: wachukue
  rationale: Ingawa kitenzi cha Kiebrania ni nafsi ya tatu umoja wa kiume, baada ya kuhani kuagiza kinaeleweka kama utekelezaji wa agizo. Muundo “ataagiza wachukue” ni wa asili kwa Kiswahili na hauashirii bila lazima kwamba kuhani mwenyewe ndiye anayechukua vitu hivyo.
- source_word: לַמִּטַּהֵר
  choice: kwa ajili ya mtu anayetakaswa
  rationale: Kivumishi-jina cha Hitpael huonyesha mtu aliye katika mchakato wa kutakaswa; “anayetakaswa” huhifadhi hali hiyo inayoendelea na sauti ya kutendwa.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: ndege wawili
  rationale: צִפּוֹר ni neno la jumla kwa ndege, si lazima shomoro; “ndege wawili” huepuka kubainisha jamii isiyotajwa.
- source_word: חַיּוֹת
  choice: walio hai
  rationale: Hutofautisha ndege hawa na waliokufa na ni usemi wa kawaida wa Kiswahili.
- source_word: טְהֹרוֹת
  choice: safi
  rationale: Katika muktadha wa Walawi, “safi” ni istilahi fupi na ya kawaida kwa hali ya kiibada, bila kuongeza ufafanuzi usiotajwa katika mstari.
- source_word: עֵץ אֶרֶז
  choice: kipande cha mti wa mwerezi
  rationale: Kirai kinamaanisha kitu cha mbao ya mwerezi kinachotumiwa katika ibada. “Kipande cha mti wa mwerezi” ni cha asili na kinaepuka kueleweka kama mti mzima.
- source_word: שְׁנִי תוֹלַעַת
  choice: uzi mwekundu
  rationale: Kirai hurejelea nyenzo iliyotiwa rangi nyekundu; “uzi mwekundu” ni tafsiri inayoeleweka, huku tanbihi ikihifadhi uwezekano wa namna nyingine ya nyenzo.
- source_word: אֵזֹב
  choice: hisopo
  rationale: “Hisopo” ni jina la kimapokeo katika matini za kibiblia. Utambulisho kamili wa mmea haujulikani kwa hakika, hivyo jina hilo limehifadhiwa bila kubainisha mmea kwa kukisia.
