translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umeweka mfuatano wa agizo wazi na umetumia “wachukue” kama mhusika asiyeainishwa anayetekeleza agizo. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
