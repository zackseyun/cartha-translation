review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence, the contrast of the live bird, release outside the city, the priestly כפר terminology, and the resulting clean status of the house. However, “kuelekea uwandani” means ‘toward the open country’ and weakens the destination expressed by the Hebrew; the bird is to be released there. The main rendering of כפר is also grammatically possible but unnecessarily awkward.
  naturalness: “Ataifanyia nyumba upatanisho” is not the most natural contemporary Standard East African Swahili expression. “Atafanya upatanisho kwa ajili ya nyumba” is clear, idiomatic, and retains the ritual sense. “Nje ya mji, uwandani” naturally conveys release outside the city in the open country/field.
  terminology: '“Upatanisho” is an appropriate established theological term for כפר and should remain. The proposed footnote alternative “ondoleo la hatia” is less suitable here: it can imply personal guilt, whereas the context concerns ritual cleansing of a house. The note should retain the lexical breadth without imposing that implication.'
  issues:
  - severity: medium
    issue: The phrase “kuelekea uwandani” weakens the locative/directional result of the release.
    rationale: Kuelekea means ‘toward/in the direction of.’ Hebrew אֶל־פְּנֵי הַשָּׂדֶה specifies that the bird is sent out into the open field/country.
  - severity: medium
    issue: “Ataifanyia nyumba upatanisho” is awkwardly constructed.
    rationale: Although understandable, the resumptive object prefix plus explicit noun makes the phrase less idiomatic. “Atafanya upatanisho kwa ajili ya nyumba” is natural and retains the source’s ritual wording.
  - severity: low
    issue: The footnote’s “ondoleo la hatia” may over-specify guilt.
    rationale: The Hebrew ritual term is used regarding a house in a purification context. A note should not suggest that the house itself bears moral guilt.
  revised_text: Kisha atamwachilia ndege aliye hai nje ya mji, uwandani. Hivyo atafanya upatanisho kwa ajili ya nyumba[a], nayo itakuwa safi.
  revised_footnotes:
