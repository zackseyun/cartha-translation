  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: sw
  text: Kisha atamwachilia ndege aliye hai nje ya mji, uwandani. Hivyo atafanya upatanisho kwa ajili ya nyumba[a], nayo itakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataitakasa nyumba” au “atafanya upatanisho wa utakaso kwa ajili ya nyumba.” Hapa Kiebrania kinatumia lugha ya kikuhani ya upatanisho katika muktadha wa utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: Kisha atamwachilia
  rationale: Kitenzi cha Kiebrania katika muktadha huu kinaonyesha tendo la ibada la kumwacha ndege aende huru. “Atamwachilia” ni Kiswahili cha kawaida na chenye heshima; “kisha” linaonyesha mfuatano wa matendo.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ndege aliye hai
  rationale: Maneno haya yanamtambulisha ndege huyu kwa kumtofautisha na yule ndege aliyeuawa awali katika ibada.
- source_word: אֶל מִחוּץ לָעִיר
  choice: nje ya mji
  rationale: Kirai hiki kinaonyesha kwamba ndege anaachiliwa upande wa nje wa mipaka ya mji.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: kuelekea uwandani
  rationale: Nahau ya Kiebrania inaelekeza kwenye eneo la wazi la mashambani. “Kuelekea uwandani” ni ya asili katika Kiswahili na huhifadhi wazo la mwendo kuelekea eneo hilo.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: ataifanyia nyumba upatanisho
  rationale: “Upatanisho” huhifadhi lugha maalumu ya kikuhani ya כפר bila kuipunguza kuwa usafishaji wa kawaida tu. Kiambishi “-i-” na kirai “nyumba” vinaonyesha wazi kitu kinachofanyiwa ibada hiyo.
- source_word: וְטָהֵר
  choice: nayo itakuwa safi
  rationale: Kitenzi kinaeleza hali ya nyumba baada ya ibada. Tafsiri hii inafanya mhusika awe wazi na kuhifadhi wazo la usafi wa kiibada kwa lugha inayoeleweka.
theological_decisions:
- issue: Maana ya כפר katika ibada ya utakaso wa nyumba
  choice: ataifanyia nyumba upatanisho
  alternative: ataitakasa nyumba; ataifanyia nyumba ondoleo la hatia
  rationale: Kifungu kinatumia lugha ya kikuhani ya upatanisho hata kuhusu nyumba. Tafsiri inahifadhi mvutano huo wa kitheolojia bila kuingiza nadharia maalumu ya baadaye, huku tanbihi ikionyesha maana zinazowezekana katika muktadha wa utakaso wa kiibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida, huku istilahi ya kikuhani “upatanisho” ikihifadhiwa na kufafanuliwa kwa tanbihi.
