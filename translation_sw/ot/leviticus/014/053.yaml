    reason: lexical_alternative
  revision_rationale: The revision makes the bird’s destination definite rather than merely directional, improves the naturalness of the atonement clause, and refines the footnote to reflect the ritual-purity context without implying personal guilt. It preserves the source’s priestly atonement language and the ambiguity acknowledged in the English audit trail.
