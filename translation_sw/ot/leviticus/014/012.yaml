  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: sw
  text: Kisha kuhani atamchukua mwana-kondoo dume yule mmoja na kumwasilisha kama sadaka ya hatia[a], pamoja na logi ya mafuta[b]; naye atavipeperusha mbele ya Yahwe kama sadaka ya kutikiswa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya fidia.”
    reason: lexical_alternative
  - marker: b
    text: “Logi” ilikuwa kipimo kidogo cha kimiminika kilichotumiwa katika mfumo wa ibada wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Kisha ... atamchukua
  rationale: Kiunganishi hiki kinaendeleza hatua za ibada; “Kisha” huonyesha mfuatano wa utaratibu, na wakati ujao una nguvu ya agizo katika muktadha huu.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhudumu wa kikuhani katika mazingira ya ibada ya Walawi.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: huyo mwana-kondoo dume mmoja
  rationale: “Mwana-kondoo” hutafsiri כֶּבֶשׂ, “dume” huweka wazi jinsia inayodokezwa na matumizi ya dhabihu na muktadha, na “mmoja” hudumisha namba pamoja na utofautishaji wa mnyama huyu na wengine.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: na kumleta
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuleta au kuwasilisha kitu kwa ajili ya kutolewa; “kumleta” hakitangulizi hatua ya kuchinja ambayo haijasemwa hapa.
- source_word: לְאָשָׁם
  choice: kuwa sadaka ya hatia
  rationale: אָשָׁם ni istilahi ya kiibada ya aina maalumu ya sadaka katika Walawi. “Sadaka ya hatia” ni tafsiri iliyo wazi na inayotambulika, huku uwezekano wa wazo la fidia ukihifadhiwa katika tanbihi.
- source_word: לֹג הַשָּׁמֶן
  choice: logi ya mafuta
  rationale: “Logi” huhifadhi kipimo maalumu cha kimiminika cha mfumo wa ibada ya Israeli badala ya kukibadili kuwa kadirio la kisasa.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: atavitikisa kuwa sadaka ya kutikiswa
  rationale: Tafsiri hii huhifadhi kitenzi cha kitendo cha kiibada pamoja na nomino inayohusiana nacho. Kiambishi “vi-” kinarejelea kwa pamoja vitu viwili vilivyotajwa.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” ni usemi wa kawaida wa Kiswahili katika mazingira ya ibada, na “Yahwe” ni umbo la Kiswahili la jina la agano יְהוָה.
theological_decisions:
- issue: Maana ya אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: Istilahi hiyo inaweza kusisitiza ama hatia ama ulipaji wa fidia. Tafsiri kuu inatumia istilahi inayojulikana zaidi katika sheria za dhabihu, bila kuficha mbadala wenye uzito wa kileksia.
- issue: Uwakilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za kiibada zimehifadhiwa kwa uthabiti, na alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
