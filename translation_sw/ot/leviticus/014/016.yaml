base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: sw
  text: Kuhani atachovya kidole chake cha kulia katika baadhi ya mafuta yaliyo juu ya kiganja chake cha kushoto, kisha kwa kidole chake atanyunyiza baadhi ya mafuta hayo mara saba mbele za Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: atachovya
  rationale: Kitenzi hiki humaanisha kutumbukiza sehemu ya kitu katika kimiminika; “atachovya” ni cha kawaida na kinafaa kwa tendo la kidole katika ibada.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: kidole chake cha kulia
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi maelezo mahsusi ya upande wa mwili uliotakiwa katika ibada.
- source_word: מִן הַשֶּׁמֶן
  choice: katika baadhi ya mafuta
  rationale: Baada ya kitenzi “chovya,” Kiswahili cha kawaida hutumia “katika”; “baadhi ya” huonyesha kwamba ni sehemu ya mafuta hayo inayotumiwa.
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: yaliyo juu ya kiganja chake cha kushoto
  rationale: כַּף hapa ni kiganja hasa, si mkono kwa ujumla; “juu ya” huhifadhi uhusiano wa mahali katika Kiebrania.
- source_word: הִזָּה
  choice: atanyunyiza
  rationale: Katika maagizo ya kikuhani, kitenzi hiki hueleza kunyunyiza kimiminika kwa utaratibu wa ibada.
- source_word: בְּאֶצְבָּעוֹ
  choice: kwa kidole chake
  rationale: Kiambishi ב kinaonyesha chombo au njia iliyotumiwa; “kwa kidole chake” ni wazi na fasaha.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Idadi hiyo ina umuhimu katika utaratibu wa ibada na imetafsiriwa moja kwa moja.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi usemi wa kiibada unaomaanisha kutenda mbele au katika uwepo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa herufi יהוה limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kuingiza badala ya heshima au mapokeo ya matamshi mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha ibada lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa matendo na maelezo ya kulia/kushoto umehifadhiwa.
