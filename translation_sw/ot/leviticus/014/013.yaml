base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: sw
  text: Naye atamchinja huyo mwanakondoo mahali patakatifu ambapo huchinjwa sadaka ya dhambi[a] na sadaka ya kuteketezwa; kwa maana sadaka ya hatia[b], kama sadaka ya dhambi, ni ya kuhani; ni takatifu sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso,” kwa kusisitiza kazi ya ibada hii ya kutakasa katika sheria za kikuhani.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya urejesho,” kwa kusisitiza kipengele cha kufidia au kurekebisha hasara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Naye atamchinja
  rationale: Kitenzi שׁחט katika muktadha wa dhabihu humaanisha kuchinja kwa ibada; “atamchinja” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: הַכֶּבֶשׂ
  choice: huyo mwanakondoo
  rationale: כֶּבֶשׂ humaanisha mwanakondoo katika sheria za dhabihu; kiwakilishi “huyo” kinaonyesha mnyama aliyetajwa katika muktadha wa karibu.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: mahali wanapochinjia
  rationale: Umoja wa kitenzi cha Kiebrania unaweza kuwa wa jumla au usiotaja mtendaji maalumu; wingi usiotaja mtendaji katika Kiswahili unaeleza desturi iliyowekwa kwa ufasaha.
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Hili ni jina la kawaida la aina hii ya dhabihu katika Kiswahili; maana mbadala inayosisitiza utakaso imehifadhiwa katika tanbihi.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno linaloeleweka na lililozoeleka kwa עֹלָה, dhabihu iliyoteketezwa juu ya madhabahu.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: katika mahali patakatifu
  rationale: Kirai kinaonyesha eneo maalumu lililotengwa kwa shughuli hii ya ibada; tafsiri hii hudumisha lugha ya utakatifu bila kulichanganya moja kwa moja na chumba kiitwacho Patakatifu.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: kwa maana, kama sadaka ya dhambi, sadaka ya hatia ni ya kuhani
  rationale: Muundo huu huhifadhi ulinganisho kati ya sadaka hizo na wazo la kwamba sadaka ya hatia imetengewa kuhani.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: ni takatifu sana
  rationale: קֹדֶשׁ קָדָשִׁים ni muundo wa kiwango cha juu unaoonyesha daraja maalumu la utakatifu; “takatifu sana” ni wa asili na sahihi katika Kiswahili.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno hilo linaweza kuonyesha dhambi au kazi ya ibada ya kutakasa. Tafsiri ya jadi na inayoeleweka zaidi imewekwa katika matini, huku uwezekano wa pili ukihifadhiwa katika tanbihi.
- issue: Maana ya אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: “Sadaka ya hatia” hutambulisha aina ya dhabihu kwa uwazi, lakini “sadaka ya fidia” huonyesha kipengele chake cha kufidia au kurekebisha hasara; tofauti hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za dhabihu zimetumiwa kwa uthabiti; sintaksia imewekwa ya asili bila kuondoa ulinganisho na mvutano wa maana uliomo katika Kiebrania.
