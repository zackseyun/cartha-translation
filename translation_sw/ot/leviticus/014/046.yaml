  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: sw
  text: Na yeyote atakayeingia ndani ya nyumba katika siku zote za kufungiwa kwake atakuwa najisi mpaka jioni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutengwa” au “kuwekwa chini ya zuio.” Kiebrania hapa hurejelea nyumba kutengwa kwa amri ya kuhani ili ichunguzwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: Na yeyote atakayeingia
  rationale: Kivumishi-tendo chenye kibainishi kimetumika kama nomino ya jumla; ‘yeyote atakayeingia’ huwasilisha kwa kawaida nguvu ya jumla ya sheria.
- source_word: אֶל הַ/בַּיִת
  choice: ndani ya nyumba
  rationale: Muundo wa בוא pamoja na אֶל unaonyesha mwendo wa kuingia; ‘kuingia ndani ya nyumba’ ni Kiswahili cha kawaida na wazi.
- source_word: כָּל יְמֵי
  choice: katika siku zote ambazo
  rationale: Usemi huu unaonyesha kipindi chote ambacho nyumba ilikuwa chini ya zuio.
- source_word: הִסְגִּיר אֹת/וֹ
  choice: imefungiwa
  rationale: Katika taratibu za Walawi 13–14, סגר humaanisha kuweka chini ya zuio au kutenga kwa ajili ya uchunguzi. ‘Imefungiwa’ huhifadhi picha ya kufungwa na haiingizi moja kwa moja dhana ya karantini ya kitabibu ya kisasa.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Kitenzi kinaonyesha hali ya kuwa au kufanywa najisi kwa maana ya kiibada; muundo huu unafaa lugha ya sheria.
- source_word: עַד הָ/עָרֶב
  choice: mpaka jioni
  rationale: Huu ni usemi wa kawaida unaotaja mwisho wa kipindi cha unajisi wa muda.
