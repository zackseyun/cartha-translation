translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Najisi’ limedumishwa kama neno linaloeleweka katika muktadha wa usafi wa kiibada; ‘imefungiwa’ linaambatana na tanbihi ili kufafanua kwamba ni zuio la kikuhani kwa uchunguzi.
