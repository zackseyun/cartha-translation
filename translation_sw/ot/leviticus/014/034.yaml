base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: sw
  text: “Mtakapoingia katika nchi ya Kanaani ninayowapa kuwa milki yenu, nami nikiweka pigo la ukoma[a] katika nyumba katika nchi iliyo milki yenu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kiebrania linalotafsiriwa hapa “ukoma” lina maana pana zaidi: linaweza kurejelea hali mbalimbali za ugonjwa au alama za uchafuzi, si ugonjwa unaoitwa ukoma tu katika matumizi ya kitabibu ya sasa. Katika sura hii neno hilo linatumiwa pia kuhusu nyumba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: Mtakapoingia
  rationale: Katika sheria hii, כִּי inaeleza hali ya wakati ujao; muundo wa ‘mtakapo-’ ni wa kawaida na unaunganisha vizuri wakati na tendo la kuingia.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: katika nchi ya Kanaani
  rationale: Huhifadhi maana ya kuelekea na kuingia ndani ya eneo hilo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: ambayo ninawapa
  rationale: Kitenzi cha wakati wa sasa kinaonyesha tendo la Mungu lililoendelea au lililo karibu kutimizwa, kama participle ya Kiebrania.
- source_word: לַאֲחֻזָּה
  choice: iwe milki yenu
  rationale: אֲחֻזָּה ni ardhi inayoshikiliwa kama mali ya kudumu; ‘milki yenu’ ni ya asili na yenye hadhi bila kulazimisha wazo mahususi la urithi.
- source_word: וְנָתַתִּי
  choice: nami nikiweka
  rationale: Ingawa kimsingi kitenzi ni ‘kutoa,’ katika muktadha huu ‘kuweka’ ni cha asili na huhifadhi wazi kwamba Mungu ndiye anayesababisha pigo liwepo.
- source_word: נֶגַע צָרַעַת
  choice: pigo la ukoma[a]
  rationale: ‘Pigo’ huonyesha hali au alama yenye madhara, huku ‘ukoma’ likihifadhi istilahi ya jadi. Tanbihi inaeleza kwamba neno la Kiebrania ni pana kuliko ukoma wa kitabibu wa sasa na linaweza kutumiwa hata kuhusu nyumba.
- source_word: בְּבֵית
  choice: katika nyumba
  rationale: Hii ndiyo tafsiri ya kawaida ya בְּ katika muktadha wa hali inayoonekana ndani au kwenye sehemu za nyumba.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: nchi mnayoimiliki
  rationale: Ni Kiswahili cha asili kinachodumisha wazo la ardhi kuwa milki yao bila kutumia kirai kizito cha ‘nchi ya milki yenu.’
theological_decisions:
- issue: Mungu kuhusishwa moja kwa moja na pigo la nyumba
  choice: 'Kudumisha usemi wa nafsi ya kwanza: ‘nami nikiweka pigo...’'
  alternative: Kutumia usemi usiotaja mtendaji, kama ‘pigo likitokea’
  rationale: Kiebrania kinamtaja Mungu wazi kuwa mtendaji. Tafsiri haipunguzi mvutano huo wa kiteolojia kwa kuufanya usemi usiwe na mtendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Pigo la ukoma’ limechaguliwa kwa sababu ‘ugonjwa wa ngozi’ halifai kwa nyumba; tanbihi huzuia neno ‘ukoma’ kueleweka kwa maana finyu ya kitabibu.
