  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: sw
  text: Ataweka mkono wake juu ya kichwa cha sadaka yake na kuichinja mbele ya Hema ya Kukutania. Kisha wana wa Aroni watatupa damu yake dhidi ya madhabahu pande zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watainyunyiza kwa nguvu” au “watamwaga kwa kurusha.” Kitenzi cha Kiebrania kinaonyesha kurusha damu katika tendo la ibada, si kuinyunyiza kwa upole.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Ataweka
  rationale: Katika maagizo ya dhabihu, kitenzi hiki kinaeleza tendo la kuweka au kuegemeza mkono juu ya kichwa cha mnyama. “Ataweka” ni wazi na hakiongezi tafsiri ya kiishara ambayo mstari wenyewe haitoi.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Nomino ya Kiebrania iko katika umoja na ina kiambishi cha nafsi ya tatu ya kiume; Kiswahili kinahifadhi umoja huo kwa namna ya kawaida.
- source_word: רֹאשׁ
  choice: kichwa
  rationale: Hii ndiyo maana ya kawaida ya kiungo cha mwili katika muktadha huu wa dhabihu.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni kitu kinacholetwa na kutolewa mbele za Mungu. “Sadaka” ni neno pana na la kawaida katika Kiswahili cha ibada, bila kulifanya kuwa istilahi nyembamba zaidi kuliko Kiebrania.
- source_word: וְשָׁחַט
  choice: kuichinja
  rationale: Kitenzi hiki ni istilahi ya kuchinja mnyama wa dhabihu. “Kuichinja” huhifadhi maana ya kiibada vizuri kuliko “kuiua.”
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii ni tafsiri ya kawaida ya usemi wa mahali, wenye maana ya kuwa mbele ya au katika uwepo wa kitu kilichotajwa.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina linaloeleweka na lililozoeleka la mahali maalumu pa kukutana, huku likihifadhi picha ya hema katika Kiebrania.
- source_word: וְזָרְקוּ
  choice: watairusha
  rationale: זרק huonyesha kuitupa au kuirusha damu katika tendo la ibada. “Watairusha” huonyesha mwendo wenye nguvu zaidi kuliko kunyunyiza kwa upole.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Kiebrania kinawataja wazi kuwa wana wa Aroni. Tafsiri hii huhifadhi uhusiano huo wa kifamilia na jinsia iliyotajwa bila kuupanua kuwa “wazao” au kuufasiri kuwa “makuhani.”
- source_word: דָּמוֹ
  choice: damu yake
  rationale: Kiambishi kinarejelea mnyama wa sadaka. Kiswahili hutumia “yake” kwa kawaida katika muundo huu.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: kwenye pande zote za madhabahu
  rationale: Muundo huu unaonyesha kuwa damu inatumika kwenye madhabahu kuizunguka, yaani katika pande zake zote, si kuwekwa tu juu ya sehemu yake ya juu.
theological_decisions:
- issue: Kuweka mkono katika ibada ya dhabihu
  choice: Tendo limetafsiriwa moja kwa moja kuwa “ataweka mkono wake” bila kulipa maana ya ziada ya kiishara.
  alternative: “Atauegemeza mkono wake” ili kusisitiza shinikizo, au tafsiri inayodokeza wazi uhamisho wa hatia au kujitambulisha na mnyama.
  rationale: Mstari unaeleza tendo la ibada lakini hautoi ufafanuzi wa maana yake ya kitheolojia. Tafsiri inahifadhi ukimya huo badala ya kuingiza fundisho lisilotajwa hapa.
- issue: Usemi wa kijinsia בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  alternative: wazao wa Aroni; makuhani wa Aroni
  rationale: Neno la Kiebrania linataja “wana” hasa. Kulipanua kuwa “wazao” au kulifasiri kuwa “makuhani” kungeficha muundo halisi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Sentensi mbili zimetumiwa kwa mtiririko wa kawaida. Jina “Hema la Kukutania” limeandikwa kwa herufi kubwa kama jina maalumu la mahali pa ibada.
