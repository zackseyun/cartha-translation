base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: sw
  text: Ataweka mkono wake juu ya kichwa cha mnyama huyo, kisha atamchinja mbele ya Hema la Kukutania; wana wa Aroni watairusha damu yake kuizunguka madhabahu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watainyunyiza damu yake kuizunguka madhabahu.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa njia kadhaa katika muktadha wa dhabihu; “watairusha” huhifadhi maana yake ya msingi ya kutupa damu kuelekea madhabahuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: Ataweka mkono wake
  rationale: Katika muktadha wa dhabihu, סמך יד על humaanisha kuweka au kukandamiza mkono juu ya mnyama. Kiswahili ‘ataweka mkono wake’ ni cha kawaida na kinahifadhi umoja wa ‘mkono’ ulio wazi katika Kiebrania.
- source_word: עַל רֹאשׁוֹ
  choice: juu ya kichwa chake
  rationale: Kiambishi kinamrejelea mnyama wa dhabihu; ‘kichwa chake’ ni tafsiri ya asili katika Kiswahili.
- source_word: וְשָׁחַט אֹתוֹ
  choice: na kumchinja
  rationale: שׁחט ni kitenzi cha kawaida cha uchinjaji wa kidesturi. ‘Kumchinja’ huhifadhi maana hiyo kwa usahihi kuliko ‘kumuua’.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: mbele ya Hema la Kukutania
  rationale: ‘Mbele ya’ huhifadhi maana ya mahali, na ‘Hema la Kukutania’ ni jina la heshima linaloeleweka kwa אֹהֶל מוֹעֵד.
- source_word: וְזָרְקוּ
  choice: watairusha
  rationale: זרק katika taratibu za dhabihu hueleza kuitupa au kuipaka damu kwa kuitupa kuelekea madhabahuni. ‘Watairusha’ ndiyo maana ya moja kwa moja; tanbihi inaonyesha mbadala wa kimuktadha.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Huhifadhi muundo rasmi wa kikuhani na uhusiano wa Kiebrania bila kuufafanua zaidi.
- source_word: אֶת דָּמוֹ
  choice: damu yake
  rationale: Kiambishi kinamrejelea mnyama, na ‘damu yake’ ni Kiswahili cha kawaida.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: kwenye madhabahu pande zote
  rationale: ‘Kwenye madhabahu’ huonyesha mahali damu inapopelekwa, na ‘pande zote’ huhifadhi nguvu ya usambazaji ya סָבִיב kuizunguka madhabahu.
