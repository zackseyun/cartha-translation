base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: sw
  text: na figo zote mbili, na mafuta yaliyo juu ya figo hizo, yaliyo katika sehemu za kiuno, na sehemu inayojitokeza[a] kwenye ini; ataiondoa pamoja na figo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lobu kwenye ini.” Neno la Kiebrania linalotaja sehemu hii ya mwili halina maana ya kianatomia iliyo hakika kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: figo zote mbili
  rationale: Neno hili linataja wazi figo mbili za mnyama; usemi huu ni wa kawaida na unasisitiza idadi iliyotajwa katika Kiebrania.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Katika maagizo ya dhabihu ya Walawi, neno hili linamaanisha sehemu zenye mafuta zilizotengwa kwa ajili ya kutolewa; “mafuta” ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: yaliyo juu yake
  rationale: Kishazi hiki kinaeleza mahali mafuta yalipo kuhusiana na figo, bila kuongeza maelezo ya kianatomia yasiyomo katika matini.
- source_word: הַכְּסָלִים
  choice: kiunoni
  rationale: Neno la Kiebrania linaelekeza kwenye eneo la kiuno au ubavu wa chini; “kiunoni” ni la asili na linafaa katika muktadha huu.
- source_word: הַיֹּתֶרֶת
  choice: sehemu inayojitokeza
  rationale: Hili ni neno la kianatomia lisilo na uhakika kamili. Tafsiri hii inaeleweka bila kudai kwa uhakika kwamba sehemu hiyo ni lobu maalumu.
- source_word: עַל הַכָּבֵד
  choice: kwenye ini
  rationale: Kihusishi kinaonyesha mahali au uhusiano wa sehemu hiyo na ini; “kwenye ini” ni tafsiri ya kawaida isiyolazimisha maana ya kushikamana.
- source_word: עַל הַכְּלָיוֹת
  choice: pamoja na figo
  rationale: Katika kanuni hii ya dhabihu, kirai kinaonyesha kwamba sehemu ya ini iondolewe wakati mmoja na figo; tafsiri hii hutoa maana ya utaratibu kwa Kiswahili cha asili.
- source_word: יְסִירֶנָּה
  choice: ataiondoa
  rationale: Kitenzi kina nguvu ya agizo la ibada, na kiambishi cha umoja kinarejelea sehemu inayojitokeza iliyotajwa mara moja kabla yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ya ibada ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sintaksia ya mstari unaoendelea kutoka aya iliyotangulia imehifadhiwa kwa kuanza na “na.”
