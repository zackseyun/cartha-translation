base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: sw
  text: na figo zote mbili, na mafuta yaliyo juu ya figo hizo, yaliyo kwenye viuno, na kiambatisho[a] kilicho juu ya ini; atakiondoa pamoja na figo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kibonge.” Neno la Kiebrania (יֹתֶרֶת) la sehemu hii ya mwili halina maana ya kianatomia iliyo hakika; “kiambatisho” limetumiwa ili lisidai utambulisho mahususi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “juu ya figo.” Hapa huenda maana yake ni kwamba sehemu hii inaondolewa pamoja na figo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: figo zote mbili
  rationale: Neno כְּלָיָה humaanisha figo katika maelezo ya sehemu za mnyama wa dhabihu; “zote mbili” huwasilisha wazi idadi ya Kiebrania.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Katika sheria za dhabihu, חֵלֶב ni mafuta maalumu ya mnyama yanayotolewa; “mafuta” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: yaliyo juu yake
  rationale: Kifungu hiki kinarejelea mafuta yaliyo juu ya figo na kinadumisha uhusiano wa moja kwa moja wa maandishi ya Kiebrania.
- source_word: הַכְּסָלִים
  choice: viuno
  rationale: כְּסָלִים hapa huelekeza kwenye eneo la kiuno la mnyama; “viuno” ni neno la sasa na linalofaa katika maelezo haya ya mwili.
- source_word: הַיֹּתֶרֶת
  choice: kiambatisho[a]
  rationale: Utambulisho sahihi wa sehemu hii ya mwili hauna uhakika. “Kiambatisho” huonyesha sehemu iliyoshikamana na ini bila kudai kwa uhakika kuwa ni tundu au sehemu fulani ya ini.
- source_word: עַל הַכָּבֵד
  choice: kilicho juu ya ini
  rationale: Huhifadhi maana ya kawaida ya עַל, yaani “juu ya,” bila kuongeza utambulisho wa kisasa wa sehemu hiyo.
- source_word: עַל הַכְּלָיֹת
  choice: pamoja na figo[b]
  rationale: Katika utaratibu huu wa dhabihu, kifungu kinaeleweka kuwa kiambatisho kinaondolewa pamoja na figo; tanbihi inadumisha maana halisi ya kisintaksia.
- source_word: יְסִירֶנָּה
  choice: atakiondoa
  rationale: Hiphil ya סור hapa ni agizo la kuondoa. Kiambishi cha kitu cha umoja “-ki-” kinaelekezwa kwa kiambatisho, kama ilivyo kwa kiambishi cha umoja katika Kiebrania.
