base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: sw
  text: 'Atatoa kutoka humo sadaka yake, sadaka ya moto[a] kwa Yahwe: mafuta yanayofunika viungo vya ndani, na mafuta yote yaliyo juu ya viungo vya ndani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula.” Neno la Kiebrania אִשֶּׁה ni istilahi ya sadaka katika sheria za kikuhani; mara nyingi hutafsiriwa “sadaka ya moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: atatoa
  rationale: Katika muktadha wa ibada, Hiphil ya קרב humaanisha kuleta au kutoa sadaka mbele za Mungu. “Atatoa” ni ya kawaida na yenye maana wazi katika Kiswahili.
- source_word: מִמֶּנּוּ
  choice: kutoka humo
  rationale: Kiwakilishi kinarejelea mnyama wa sadaka aliyetajwa katika muktadha. “Kutoka humo” huonyesha kwamba sehemu inayotolewa inatolewa kutoka kwa mnyama huyo.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni istilahi ya kiibada kwa kitu kinacholetwa kama sadaka; “sadaka yake” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אִשֶּׁה
  choice: sadaka ya chakula
  rationale: Katika maandiko ya kikuhani neno hili hutaja sadaka inayotolewa kwa Yahwe, hasa kwa kuchomwa madhabahuni, na linaweza kuhusishwa na lugha ya chakula cha Mungu. Tafsiri hii inafuata maana ya kiibada huku tanbihi ikihifadhi tafsiri ya jadi inayohusisha moto.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha anayelengwa au anayepokea sadaka. “Kwa Yahwe” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: חֵלֶב hapa ni mafuta maalumu ya mnyama yaliyotengwa kwa ajili ya kuteketezwa madhabahuni.
- source_word: הַמְכַסֶּה
  choice: yanayofunika
  rationale: Kitenzi hiki cha hali endelevu kinaeleza mafuta kwa kuonyesha kwamba yamefunika viungo vya ndani.
- source_word: הַקֶּרֶב
  choice: viungo vya ndani
  rationale: Katika sheria hii ya sadaka, קֶרֶב hurejelea sehemu au viungo vilivyo ndani ya tumbo la mnyama. “Viungo vya ndani” ni wazi na pana kuliko “matumbo,” ambalo linaweza kueleweka kuwa utumbo pekee.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: na mafuta yote yaliyo juu ya viungo vya ndani
  rationale: Tafsiri hii inadumisha wazo la mahali linaloonyeshwa na עַל na upeo wa כָּל bila kuongeza ufafanuzi usiotajwa katika Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulitofautisha na cheo “Bwana” na kuwasilisha jina hilo kwa namna iliyozoeleka katika Kiswahili.
- issue: Maana ya אִשֶּׁה katika lugha ya sadaka
  choice: sadaka ya chakula
  alternative: sadaka inayoteketezwa kwa moto
  rationale: Neno hili la kiibada linaweza kueleweka kama sadaka inayowasilishwa kwa moto au kama chakula cha madhabahuni kwa Yahwe. Maandishi makuu yanatumia “sadaka ya chakula,” huku tanbihi ikihifadhi tafsiri ya jadi bila kuondoa mvutano wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya heshima, ya sasa, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya sehemu za sadaka umehifadhiwa, na “viungo vya ndani” kimetumiwa badala ya neno lenye maana finyu zaidi la “matumbo.”
