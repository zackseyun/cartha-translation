  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: sw
  text: 'Hili litakuwa agizo la kudumu[a] kwa vizazi vyenu vyote, katika makao yenu yote: msile mafuta yoyote wala damu yoyote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agizo la milele” au “agizo lisilokoma.” Katika vifungu vya sheria, neno la Kiebrania עוֹלָם mara nyingi humaanisha uhalali unaodumu na kuendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: agizo
  rationale: Neno hili linamaanisha kanuni au sharti lililowekwa. “Agizo” linaonyesha nguvu ya kisheria ya kifungu hiki kwa Kiswahili cha kawaida bila kuwa la kitaalamu kupita kiasi.
- source_word: עוֹלָם
  choice: la kudumu
  rationale: Katika kauli za kisheria, neno hili huonyesha uhalali unaoendelea. “La kudumu” huhifadhi maana hiyo bila kuamua kimya kimya kwamba lazima limaanishe kutokuwa na mwisho kabisa.
- source_word: לְדֹרֹתֵיכֶם
  choice: kwa vizazi vyenu vyote
  rationale: Hii ni kauli ya kiagano inayoonyesha kwamba agizo linaendelea kutumika katika vizazi vinavyofuatana.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: katika makao yenu yote
  rationale: Tafsiri hii huhifadhi wazo la kila mahali ambapo watu wanaishi na upeo wa agizo hilo.
- source_word: כָּל חֵלֶב
  choice: mafuta yoyote
  rationale: Katika katazo, “yoyote” huwasilisha nguvu jumuishi ya כָּל. “Mafuta” ndilo neno la kawaida kwa mafuta ya mnyama yanayozungumziwa katika muktadha wa dhabihu.
- source_word: וְכָל דָּם
  choice: wala damu yoyote
  rationale: “Wala” huunganisha katazo la pili na la kwanza, huku “yoyote” ikihifadhi maana jumuishi ya כָּל.
- source_word: לֹא תֹאכֵלוּ
  choice: msile
  rationale: Muundo huu ni katazo linalowaelekea watu wengi; “msile” ni wa moja kwa moja, wa sasa, na wa asili katika Kiswahili.
theological_decisions:
- issue: Muda wa agizo unaoelezwa na עוֹלָם
  choice: agizo la kudumu
  alternative: agizo la milele; agizo lisilokoma
  rationale: Kauli ya Kiebrania inasisitiza uhalali unaoendelea katika vizazi na makao yote. “La kudumu” huhifadhi nguvu hiyo na tanbihi huonyesha tafsiri nyingine zinazowezekana bila kulazimisha dai la kifalsafa kuhusu kutokuwa na mwisho kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria umehifadhiwa bila kutumia lugha ya kizamani; urudiaji wa “yoyote” unaonyesha upeo kamili wa makatazo mawili.
