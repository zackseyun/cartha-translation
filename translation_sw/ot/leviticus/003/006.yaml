id: LEV.3.6
reference: Leviticus 3:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: sw
  text: Na ikiwa sadaka yake kwa ajili ya dhabihu ya amani kwa Yahwe yatoka katika kundi, atamtoa mnyama, awe dume au jike, asiye na dosari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Inahifadhi kiunganishi kinachounganisha masharti haya na yaliyotangulia, pamoja na maana ya sharti.
- source_word: מִן הַצֹּאן
  choice: ni mnyama wa kundi
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; usemi huu ni wa kawaida na hauibani maana kwa aina moja tu.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni neno la kawaida la ibada kwa kitu kinacholetwa au kutolewa kwa Mungu; “sadaka” ni neno wazi na linalofaa katika muktadha huu.
- source_word: לְזֶבַח שְׁלָמִים
  choice: kwa ajili ya dhabihu ya amani
  rationale: “Dhabihu” inawakilisha זֶבַח, na “amani” inadumisha uhusiano wa jadi wa שְׁלָמִים na ukamilifu, hali njema, na amani, bila kuficha uwezekano wa maana ya ushirika.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל hapa kinaonyesha kwamba sadaka inaelekezwa au kuwekwa wakfu kwa Yahwe; jina la agano יהוה limetolewa wazi kama “Yahwe.”
- source_word: זָכָר אוֹ נְקֵבָה
  choice: awe dume au jike
  rationale: Inatoa kwa uwazi tofauti ya jinsia ya mnyama inayotajwa katika maandishi ya Kiebrania.
- source_word: תָּמִים
  choice: akiwa hana dosari
  rationale: Katika sheria za dhabihu, תָּמִים humaanisha mnyama asiye na kasoro inayomwondolea sifa ya kutolewa.
- source_word: יַקְרִיבֶנּוּ
  choice: atamtoa
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kumleta na kumtoa mbele za Mungu; “atamtoa” ni Kiswahili cha kawaida cha kitendo hicho cha ibada.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שְׁלָמִים
  choice: dhabihu ya amani
  alternative: dhabihu ya ushirika
  rationale: Neno linaweza kuhusishwa na amani, hali njema, ukamilifu, na ushirika wa mlo wa dhabihu. Tafsiri ya jadi “amani” imetumiwa katika maandishi, huku maana nyingine halali ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili katika Kiswahili huku sifa “dume au jike” na hitaji la kutokuwa na dosari zikibaki zikimhusu mnyama anayetolewa.
