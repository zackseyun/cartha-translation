revisions:
- from: Kama sadaka yake ni dhabihu ya sadaka za amani[a], na akiitoa kutoka katika kundi la ng’ombe, iwe dume au jike, ataitoa mbele za Yahwe ikiwa haina dosari.
  to: Kama sadaka yake ni dhabihu ya sadaka za amani[a], kama anaitoa kutoka katika kundi la ng’ombe, iwe dume au jike, atamtoa mnyama asiye na dosari mbele ya Yahwe.
  rationale: The revision preserves all lexical and theological choices of the draft while making explicit that freedom from defect applies to the offered animal. It also restores the repeated conditional presentation of the Hebrew without adding interpretation.
  reviewer_model: gpt-5.6-terra
