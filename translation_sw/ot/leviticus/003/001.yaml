review_pass:
  verdict: revise
  source_fidelity: Draft retains the conditional structure, the cattle source, either sex, the unblemished requirement, and the divine name. However, the final participial clause “ikiwa haina dosari” is syntactically liable to modify the act of offering rather than explicitly the animal, whereas תָּמִים qualifies the animal offered.
  naturalness: The wording is generally clear Standard East African Swahili. Recasting the second condition without “na” and specifying “mnyama asiye na dosari” makes the legal conditional sequence and the referent more natural and unambiguous.
  terminology: “Dhabihu ya sadaka za amani” deliberately reflects both זֶבַח and שְׁלָמִים and may stand in this scholarly, formal register. “Yahwe” consistently renders the Tetragrammaton. The alternative “sadaka za ushirika” is appropriately retained only in the note.
  issues:
  - severity: medium
    issue: The phrase “mbele za Yahwe ikiwa haina dosari” leaves the grammatical referent of “ikiwa haina dosari” unclear.
    rationale: In the Hebrew, תָּמִים directly describes the male or female animal. “Mnyama asiye na dosari” explicitly preserves this requirement and avoids suggesting that the offering action itself is without defect.
  - severity: low
    issue: “na akiitoa” weakens the parallel conditional structure.
    rationale: The Hebrew repeats אִם (“if”) for the cattle case. Rendering this with “kama ... anaitoa” better represents the sequence of conditions in idiomatic Swahili.
  revised_text: Kama sadaka yake ni dhabihu ya sadaka za amani[a], kama anaitoa kutoka katika kundi la ng’ombe, iwe dume au jike, atamtoa mnyama asiye na dosari mbele ya Yahwe.
  revised_footnotes:
  - marker: a
    text: Au, “dhabihu ya sadaka za ushirika.” Kiebrania kinasema kihalisi “dhabihu ya sadaka za amani.”
    reason: lexical_alternative
  revision_rationale: The revision preserves all lexical and theological choices of the draft while making explicit that freedom from defect applies to the offered animal. It also restores the repeated conditional presentation of the Hebrew without adding interpretation.
