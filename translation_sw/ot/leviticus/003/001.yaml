id: LEV.3.1
reference: Leviticus 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: sw
  text: Kama sadaka yake ni dhabihu ya sadaka za amani[a], kama anaitoa kutoka katika kundi la ng’ombe, iwe dume au jike, atamtoa mnyama asiye na dosari mbele ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhabihu ya sadaka za ushirika.” Kiebrania kinasema kihalisi “dhabihu ya sadaka za amani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: Neno זֶבַח limetafsiriwa wazi kuwa “dhabihu,” na שְׁלָמִים kuwa jina la aina ya sadaka. Muundo huu unahifadhi maneno yote mawili ya Kiebrania; tafsiri “sadaka ya ushirika” ni ya kifafanuzi zaidi na imewekwa katika tanbihi.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni kitu kinacholetwa au kutolewa mbele za Mungu. “Sadaka” ni neno la kawaida na linaloeleweka katika muktadha huu wa ibada.
- source_word: מִן הַבָּקָר
  choice: kutoka katika kundi la ng’ombe
  rationale: בָּקָר hurejelea ng’ombe wa kufugwa kama kundi. Tafsiri hii ni wazi kuliko “kutoka kundini,” ambalo lingeweza kumaanisha aina nyingine za mifugo.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: akiitoa / ataitoa
  rationale: Katika sheria za dhabihu, Hifili ya קרב humaanisha kuwasilisha au kutoa sadaka. “Kutoa” ni Kiswahili cha kawaida na huhifadhi maana ya kiibada.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: iwe dume au jike
  rationale: Muundo wa אִם ... אִם unaonyesha kwamba mnyama wa jinsia yoyote kati ya hizi mbili anakubalika; “iwe ... au ...” ni muundo wa asili wa Kiswahili.
- source_word: תָּמִים
  choice: ikiwa haina dosari
  rationale: Katika muktadha wa dhabihu, תָּמִים humaanisha mnyama asiye na kasoro au kilema kinachomfanya asikubalike. “Haina dosari” ni sahihi na inaeleweka kwa urahisi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי humaanisha “mbele ya/katika uwepo wa,” na jina la agano יְהוָה limetolewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Jina la dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: “Amani” huhifadhi upana wa maana unaohusiana na amani, ustawi na ukamilifu. “Ushirika” huonyesha kipengele halisi cha dhabihu hii lakini ni ufafanuzi mwembamba zaidi, kwa hiyo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inahifadhi muundo wa masharti wa Kiebrania huku ikitumia mtiririko wa kawaida wa Kiswahili. “Kundi la ng’ombe” limetumiwa kuondoa utata wa “kundi,” na “haina dosari” ni lugha inayoeleweka bila kuwa ya kitaalamu kupita kiasi.
