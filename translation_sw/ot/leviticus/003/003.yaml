  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: sw
  text: 'Naye kutoka katika dhabihu ya amani atamtolea Yahweh sadaka inayotolewa kwa moto[a]: mafuta yanayofunika viungo vya ndani, na mafuta yote yaliyo juu ya viungo hivyo,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula”; au, “sadaka ya moto.”
    reason: Neno אִשֶּׁה ni istilahi ya dhabihu inayohusishwa na moto; baadhi ya tafsiri hulieleza kama sadaka ya chakula.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: atamtolea
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuwasilisha au kutoa kwa namna ya ibada. ‘Atamtolea’ ni ya kawaida katika Kiswahili na inaonyesha kwamba sadaka inaelekezwa kwa Yahweh.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: kutoka katika dhabihu ya amani
  rationale: זֶבַח ni dhabihu inayochinjwa, na שְׁלָמִים ni aina ya sadaka inayohusishwa na amani, ustawi, na ushirika. ‘Dhabihu ya amani’ ni fupi, ya kawaida, na hudumisha jina la kimapokeo la aina hii ya dhabihu.
- source_word: אִשֶּׁה
  choice: sadaka ya chakula
  rationale: Katika sheria za kikuhani neno hili hutaja sadaka inayotolewa kwa Mungu kwa kuchomwa na kufanywa moshi. ‘Sadaka ya chakula’ huonyesha dhana ya zawadi ya ibada kwa Yahweh, huku tafsiri zinazosisitiza moto zikihifadhiwa katika tanbihi.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Katika sheria za dhabihu חֵלֶב hurejelea sehemu zenye mafuta zilizotengwa kwa ajili ya kutolewa, si matumizi ya kisitiari.
- source_word: הַמְכַסֶּה
  choice: yanayofunika
  rationale: Kitenzi-shirikishi hiki kinaeleza mafuta kuwa sehemu inayofunika viungo vya ndani.
- source_word: הַקֶּרֶב
  choice: viungo vya ndani
  rationale: Katika muktadha wa mnyama wa dhabihu, קֶרֶב hurejelea sehemu au viungo vilivyo ndani. ‘Viungo vya ndani’ ni wazi na pana kuliko ‘matumbo,’ ambalo linaweza kueleweka kuwa utumbo pekee.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: mafuta yote yaliyo juu ya viungo hivyo
  rationale: Kauli hii hutofautisha mafuta yanayofunika viungo na mafuta mengine yote yaliyoshikamana navyo. Kiwakilishi ‘hivyo’ huepuka marudio mazito bila kupoteza rejeo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri אִשֶּׁה katika sheria za dhabihu
  choice: sadaka ya chakula
  alternative: sadaka iliyotolewa kwa moto; sadaka ya moto
  rationale: Chaguo hili huwasilisha sadaka kama zawadi ya ibada kwa Yahweh na halidokezi kwamba moto wenyewe ndio kitu kinachotolewa. Kwa kuwa asili ya neno na msisitizo wake vinaweza kueleweka kwa kuhusishwa na moto, tafsiri hizo zimehifadhiwa katika tanbihi.
- issue: Maana ya שְׁלָמִים
  choice: dhabihu ya amani
  alternative: dhabihu ya ushirika; dhabihu ya ustawi
  rationale: Neno linaweza kuhusisha amani, ukamilifu, ustawi, na ushirika wa mlo wa dhabihu. ‘Amani’ hudumisha istilahi inayotambulika bila kufuta upana huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umewekwa wazi na wa sasa; ‘viungo vya ndani’ limetumiwa badala ya neno finyu zaidi ‘matumbo.’ Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika, ‘sadaka ya chakula.’
