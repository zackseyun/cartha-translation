  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: sw
  text: Ikiwa anatoa kondoo kama sadaka yake[a], atamleta mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanakondoo kama sadaka yake.”
    reason: כֶּשֶׂב linaweza kumaanisha kondoo kwa ujumla au mwanakondoo; tanbihi inahifadhi uwezekano huo wa kileksia.
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Hutanguliza hali ya masharti katika maagizo ya sadaka; “ikiwa” ni ya kawaida na wazi katika Kiswahili.
- source_word: כֶּשֶׂב
  choice: kondoo
  rationale: Neno hili linaweza kumaanisha kondoo, na mara nyingine mwanakondoo. “Kondoo” halibainishi umri usiotajwa wazi, huku uwezekano wa “mwanakondoo” ukihifadhiwa katika tanbihi.
- source_word: מַקְרִיב אֶת־קָרְבָּנוֹ
  choice: anatoa ... kuwa sadaka yake
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida tendo la kumleta mnyama kama sadaka, bila kupunguza maana ya קָרְבָּן kuwa aina maalumu zaidi ya dhabihu.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: atamleta
  rationale: Katika muktadha huu wa kisheria, kitenzi kina nguvu ya agizo linalofuata. “Atamleta” ni usemi wa kawaida wa maagizo na unamrejelea mnyama aliyetajwa.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Hutoa maana ya mahali na ya kiibada ya kumwasilisha mnyama katika uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi kwa tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA”.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kwa namna inayolingana na tahajia na matamshi ya Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi inafuata mtiririko wa agizo la Kiebrania bila kuongeza umri wa mnyama wala aina ya sadaka.
