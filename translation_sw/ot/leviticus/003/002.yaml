base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: sw
  text: Ataweka mkono wake juu ya kichwa cha sadaka yake, naye ataichinja kwenye mlango wa Hema la Kukutania[a]; na wana wa Haruni, makuhani, wataitupa damu kwenye pande zote za madhabahu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mwingilio wa Hema la Kukutania.”
    reason: lexical_alternative
  - marker: b
    text: Au, “watairusha damu dhidi ya madhabahu pande zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Ataweka mkono wake
  rationale: Katika muktadha wa dhabihu, סמך hueleza kuweka au kuegemeza mkono juu ya mnyama. “Ataweka mkono wake” ni ya kawaida na huhifadhi umoja wa יָדוֹ bila kulazimisha kiwango cha shinikizo.
- source_word: עַל רֹאשׁ קָרְבָּנוֹ
  choice: juu ya kichwa cha sadaka yake
  rationale: “Kichwa” ni rejeo la moja kwa moja la kiungo cha mwili, na “sadaka” hudumisha upana wa maana ya קָרְבָּן kuliko neno finyu zaidi la aina fulani ya dhabihu.
- source_word: וּשְׁחָטוֹ
  choice: kisha ataichinja
  rationale: שׁחט ni kitenzi cha kawaida cha kuchinja mnyama wa dhabihu. “Ataichinja” hudumisha maana hiyo ya kiibada; “kisha” huonyesha mwendelezo wa hatua kwa Kiswahili cha asili.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mwingilio wa Hema la Kukutania
  rationale: פֶּתַח ni sehemu ya kuingilia au mlango. “Mwingilio” ni wazi, huku “Hema la Kukutania” likihifadhi jina la mahali patakatifu bila kuingiza wazo la hekalu la baadaye.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: wana wa Haruni, makuhani
  rationale: Muundo huu huhifadhi uhusiano wa kifamilia na kirai cha ufafanuzi kinachowatambulisha wana hao kuwa makuhani.
- source_word: וְזָרְקוּ ... אֶת הַדָּם
  choice: watairushia damu
  rationale: זרק inaonyesha kuitupa au kuirusha damu kuelekea madhabahuni, si lazima kuinyunyiza kwa matone. “Watairushia” ni Kiswahili cha asili zaidi kuliko “watairusha damu dhidi ya” na huhifadhi mwelekeo wa tendo.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: madhabahu pande zote
  rationale: עַל pamoja na זרק huonyesha damu ikielekezwa kwenye madhabahu, na סָבִיב huonyesha kuizunguka madhabahu, yaani pande zake zote.
theological_decisions:
- issue: Namna damu inavyowekwa kwenye madhabahu
  choice: watairushia damu madhabahu pande zote
  alternative: watainyunyiza damu juu ya madhabahu kuizunguka
  rationale: Tafsiri iliyochaguliwa hufuata maana ya kawaida ya זרק, yaani kurusha au kutupa, na haibadilishi tendo hilo kuwa tendo mahususi la kunyunyiza. Pia huhifadhi kwamba damu inaelekezwa kuzunguka madhabahu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida bila kubadili mlolongo wa vitendo. Herufi kubwa katika “Hema la Kukutania” zinaonyesha jina maalumu la mahali patakatifu.
