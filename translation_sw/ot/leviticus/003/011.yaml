  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: sw
  text: Kuhani ataiteketeza juu ya madhabahu kuwa chakula[a] cha sadaka ya moto kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkate wa sadaka ya moto kwa Yahweh”; hapa neno “mkate” limetumiwa kama msemo wa mfumo wa dhabihu likimaanisha chakula.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: ataiteketeza
  rationale: Katika muktadha wa dhabihu, Hifili ya קטר humaanisha kuteketeza kitu madhabahuni ili kipande cha sadaka kipae kama moshi. “Ataiteketeza” ni Kiswahili cha kawaida na kinachofaa kwa tendo hili la ibada.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Kiambishi cha mwelekeo katika Kiebrania, pamoja na tendo la kuteketeza sadaka, kinaonyesha kuwa kitu kinawekwa na kuteketezwa juu ya madhabahu.
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa לֶחֶם mara nyingi humaanisha “mkate,” hapa limetumiwa kiibada kwa kile kinachotolewa madhabahuni; “chakula” huepuka kudokeza kimakosa kuwa sadaka hii ni mkate halisi.
- source_word: אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Neno hili la kiibada linahusu sadaka inayowasilishwa kwa njia ya moto. Tafsiri hii inaeleweka kwa urahisi na inadumisha maana ya utaratibu wa dhabihu.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kiambishi ל kinaonyesha anayelengwa au anayepokea sadaka, na jina la Mungu יהוה limetolewa kama “Yahweh,” kwa mujibu wa ushahidi wa jina hilo katika maandishi ya asili.
theological_decisions:
- issue: Maana ya msemo wa dhabihu לֶחֶם אִשֶּׁה
  choice: kama chakula, sadaka inayotolewa kwa moto
  alternative: kama chakula cha sadaka ya moto; kama mkate, sadaka ya moto
  rationale: Muundo wa Kiebrania unaunganisha maneno mawili ya mfumo wa dhabihu. “Chakula” linadumisha taswira ya sehemu inayotolewa madhabahuni bila kudokeza kuwa Mungu anahitaji lishe ya kimwili, huku “sadaka inayotolewa kwa moto” likihifadhi namna ya kuitoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuhani,” “madhabahu,” na “sadaka” ni istilahi zilizozoeleka. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalofafanuliwa.
