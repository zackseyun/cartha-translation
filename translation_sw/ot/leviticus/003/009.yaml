source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: sw
  text: 'Kutoka katika dhabihu ya amani atamtolea Yahweh sadaka ya moto: mafuta yake—mkia wote wenye mafuta[a], atakaouondoa karibu na uti wa mgongo[b]—mafuta yanayofunika viungo vya ndani, na mafuta yote yaliyo juu ya viungo vya ndani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mkia mpana wenye mafuta wa kondoo wa dhabihu.
    reason: cultural_note
  - marker: b
    text: Au, “mkabala na uti wa mgongo,” au “kwenye sehemu ya chini ya uti wa mgongo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: Hili ni neno maalumu la mfumo wa dhabihu. Tafsiri hii inadumisha wazo la amani na ustawi bila kulifanya liwe ushirika pekee.
- source_word: אִשֶּׁה
  choice: sadaka ya kuteketezwa kwa moto
  rationale: Neno hili linaeleza sadaka inayotolewa madhabahuni kwa njia ya moto; usemi huu ni wazi katika Kiswahili na haudokezi chakula cha kawaida.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi יהוה limetolewa moja kwa moja kama Yahweh.
- source_word: חֶלְבּוֹ
  choice: mafuta yake
  rationale: Hurejelea sehemu za mafuta za mnyama zilizotengwa kwa ajili ya dhabihu.
- source_word: הָאַלְיָה תְמִימָה
  choice: mkia wote wenye mafuta
  rationale: אַלְיָה ni mkia mpana wenye mafuta wa kondoo, na תְמִימָה hapa huonyesha kwamba unatolewa mzima.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: karibu na uti wa mgongo
  rationale: Hueleza mahali pa kuukata mkia kwa kuhusianisha na uti wa mgongo; maana halisi ya uhusiano huo wa kianatomia si hakika kabisa, hivyo badala nyingine imewekwa katika tanbihi.
- source_word: יְסִירֶנָּה
  choice: ambao atauondoa
  rationale: Kitenzi cha Hiphil cha סור hapa kinamaanisha kuondoa; kishazi rejeshi kinaunganisha kitendo hicho wazi na mkia.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: mafuta yanayofunika matumbo
  rationale: Katika muktadha wa anatomia ya dhabihu, קֶרֶב hurejelea viungo vya ndani au matumbo; 'matumbo' ni neno la kawaida na linaloeleweka.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: mafuta yote yaliyo juu ya matumbo
  rationale: Inadumisha tofauti kati ya mafuta yanayofunika matumbo na mafuta mengine yaliyo juu yake.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה moja kwa moja. 'Yahweh' huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  alternative: dhabihu ya sadaka za ushirika; dhabihu ya sadaka za ustawi
  rationale: Neno שְׁלָמִים lina upeo unaoweza kuhusisha amani, ustawi na ushirika. Tafsiri ya kawaida 'sadaka za amani' imetumiwa bila kufuta uwezekano huo mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imedumisha orodha ya sehemu za dhabihu katika Kiebrania, huku vistari virefu vikitenganisha maelezo ya mkia ili yasomeke kwa urahisi. Kila alama ya tanbihi iliyoorodheshwa imo katika matini kuu.
