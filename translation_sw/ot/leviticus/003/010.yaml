base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: sw
  text: na figo zote mbili, na mafuta yaliyo juu ya figo hizo, yaliyo juu ya viuno, na kiambatisho[a] kilicho juu ya ini, ambacho atakiondoa pamoja na figo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lobu ya ini.” Neno la Kiebrania linalotaja sehemu hii ya mwili (יֹתֶרֶת) halina maana iliyo hakika; “kiambatisho” limetumiwa katika maandishi makuu ili kuepuka kudai usahihi usiothibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: figo zote mbili
  rationale: כְּלָיֹת hutaja figo moja kwa moja katika maelezo ya viungo vya mnyama wa dhabihu; “zote mbili” huonyesha wazi idadi ya Kiebrania.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Katika taratibu za dhabihu za Walawi, חֵלֶב ni mafuta maalumu ya ndani yaliyotengwa kwa ajili ya kutolewa; “mafuta” ni neno la kawaida na linaloeleweka.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: yaliyo juu ya figo hizo
  rationale: Kirai hiki kinafafanua mahali mafuta yalipo. Kurudia “figo hizo” huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: הַכְּסָלִים
  choice: viuno
  rationale: כְּסָלִים humaanisha eneo la viuno au pembeni mwa kiuno. “Viuno” huhifadhi picha ya kianatomia na umbo la wingi la Kiebrania.
- source_word: הַיֹּתֶרֶת
  choice: kiambatisho
  rationale: Maana kamili ya neno hili la kianatomia haijulikani kwa hakika; “kiambatisho” hakidai kwa uhakika kwamba ni lobu fulani.
- source_word: עַל הַכָּבֵד
  choice: kilicho juu ya ini
  rationale: עַל huonyesha mahali au uhusiano wa karibu na ini; “juu ya ini” huacha uhusiano huo ukiwa mpana kama ulivyo katika Kiebrania.
- source_word: עַל הַכְּלָיֹת
  choice: pamoja na figo
  rationale: Katika utaratibu huu, kirai kinaonyesha kwamba kiambatisho hicho kinaondolewa kwa kuhusishwa na figo; “pamoja na figo” ni Kiswahili cha kawaida bila kulazimisha maelezo yasiyo ya kawaida ya mahali.
- source_word: יְסִירֶנָּה
  choice: atakiondoa
  rationale: Hifili ya סור hapa ina maana ya kuondoa katika utaratibu wa dhabihu. “Atakiondoa” huhifadhi agizo la kimapokeo na kiambishi cha kitu kinachorejelea kiambatisho.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. Muundo wa orodha ya Kiebrania umehifadhiwa, huku marudio ya “figo hizo” yakitumiwa kwa uwazi wa marejeo. Alama ya tanbihi imewekwa baada ya neno lenye utata, “ini,” ndani ya kirai “kiambatisho kilicho juu ya ini[a].”
