base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: sw
  text: Kuhani ataviteketeza juu ya madhabahu kama chakula cha sadaka inayotolewa kwa moto, chenye harufu ya kupendeza[a]. Mafuta yote ni ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa harufu ya kutuliza” au “kwa harufu nzuri.” Kihalisi, “chakula cha sadaka ya moto, kwa harufu ya kutuliza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: Kuhani ataviteketeza vitu hivyo
  rationale: Kitenzi cha Kiebrania katika muktadha wa dhabihu humaanisha kuviteketeza vitu juu ya madhabahu ili vitoe moshi. “Vitu hivyo” huhifadhi kiambishi cha wingi kinachorejelea sehemu za dhabihu zilizotajwa katika mistari iliyotangulia.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Kiishio cha kuelekea mahali hapa kinaonyesha madhabahu kuwa mahali pa kuviteketezea; “juu ya madhabahu” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: לֶחֶם אִשֶּׁה
  choice: kuwa chakula, sadaka inayotolewa kwa moto
  rationale: לֶחֶם inaweza kumaanisha chakula kwa upana, si mkate pekee. Tafsiri hii huhifadhi picha ya chakula na pia hutaja kwamba ni sadaka inayotolewa kwa moto, bila kuifanya ionekane kuwa chakula cha kawaida.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: yenye harufu ya kupendeza
  rationale: Huu ni usemi maalumu wa kidhabihu unaoonyesha sadaka inayokubalika. Tafsiri huhifadhi sitiari ya harufu bila kuingiza ufafanuzi wa kiteolojia katika matini.
- source_word: כָּל חֵלֶב
  choice: Mafuta yote
  rationale: כָּל ina nguvu ya ujumla, na חֵלֶב hapa hurejelea mafuta ya dhabihu yaliyowekwa kando kwa ajili ya Mungu.
- source_word: לַיהוָה
  choice: ni ya Yahweh
  rationale: Herufi ל inaweza kuonyesha kuwa kitu kimetengwa kwa ajili ya mtu au ni chake. “Ni ya Yahweh” ni ya asili katika Kiswahili na huhifadhi jina la agano יהוה.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Usemi wa kidhabihu לְרֵיחַ נִיחֹחַ
  choice: yenye harufu ya kupendeza
  alternative: yenye harufu ya kutuliza; yenye harufu nzuri
  rationale: Tafsiri huhifadhi sitiari ya matini na wazo la kukubalika kwa dhabihu bila kueleza zaidi ya yale yanayosemwa na Kiebrania.
- issue: Maana ya ל katika לַיהוָה
  choice: ni ya Yahweh
  alternative: ni kwa ajili ya Yahweh
  rationale: Kiebrania kinaweza kusisitiza umilikaji au kuwekwa wakfu. Matini kuu inatumia usemi wa asili wa umilikaji, huku tanbihi ikihifadhi tafsiri nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Msamiati wa kidini uliotumika ni wa kawaida (“kuhani,” “madhabahu,” “sadaka”), na sentensi imehifadhi mpangilio na mvutano wa usemi wa Kiebrania bila kuuingizia maelezo ya kimadhehebu.
