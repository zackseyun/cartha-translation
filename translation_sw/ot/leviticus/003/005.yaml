base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Nao wana wa Aroni wataiteketeza juu ya madhabahu, juu ya sadaka ya kuteketezwa iliyo juu ya kuni zilizo juu ya moto. Ni sadaka ya moto[a], harufu ya kupendeza kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula.”
    reason: Mbadala wa kimsamiati wa אִשֶּׁה unaohifadhi uwezekano wa kuelewa istilahi hiyo kwa uhusiano wake na chakula cha kiibada.
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: wataiteketeza
  rationale: Katika muktadha wa dhabihu, Hiphil ya קטר humaanisha kuteketeza kitu madhabahuni ili moshi wake upande. Kitenzi hiki ni cha kawaida na kinaonyesha agizo la utaratibu wa ibada.
- source_word: אֹתוֹ
  choice: -i- katika “wataiteketeza”
  rationale: Kiwakilishi cha yambwa cha umoja kinarejelea sehemu ya sadaka iliyotajwa katika muktadha uliotangulia.
- source_word: בְנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Ni tafsiri ya moja kwa moja, yenye hadhi, ya kishazi cha uhusiano wa kifamilia na kikuhani.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Kiishio cha kuelekea mahali kinaeleweka hapa kama mahali panapowekwa na kuteketezwa sadaka.
- source_word: עַל הָעֹלָה
  choice: juu ya sadaka ya kuteketezwa
  rationale: עַל inaonyesha kuwekwa juu ya sadaka ya kuteketezwa; neno hilo ni tafsiri iliyo wazi ya aina hii ya dhabihu katika Walawi.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: iliyo juu ya kuni zilizo juu ya moto
  rationale: Muundo wa kurudia ‘juu ya’ umehifadhiwa ili kuonyesha mpangilio wa vitu madhabahuni bila kubainisha aina ya kuni zaidi ya Kiebrania.
- source_word: אִשֵּׁה
  choice: sadaka ya chakula
  rationale: Ni istilahi ya dhabihu inayotolewa kwa moto na inayohusishwa na fungu la Yahwe. Tafsiri hii inaonyesha matumizi yake ya kiibada; tafsiri mbadala inayosisitiza moto imewekwa katika tanbihi.
- source_word: רֵיחַ נִיחֹחַ
  choice: harufu inayompendeza
  rationale: Kishazi hiki cha kawaida katika ibada za dhabihu kinaonyesha kukubalika kwa sadaka mbele za Mungu, kwa lugha ya kawaida ya Kiswahili.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa umbo la Kiswahili ‘Yahwe’; uhusiano wa ל unaelezwa kiasili na kitenzi ‘inayompendeza.’
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni, hivyo jina la agano limehifadhiwa badala ya kubadilishwa kuwa cheo.
- issue: Maana ya אִשֵּׁה katika kauli ya dhabihu
  choice: sadaka ya chakula
  alternative: sadaka inayotolewa kwa moto
  rationale: Istilahi hiyo inaweza kuangazia fungu la kiibada la Yahwe au namna ya kutolewa kwa moto. Maandishi makuu yanaonyesha maana ya kiibada, huku tanbihi ikihifadhi tafsiri halali inayosisitiza moto bila kudai kwamba Mungu hula chakula kihalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mfululizo wa maelezo ya mahali katika Kiebrania, lakini imetumia miundo ya kawaida ya Kiswahili. Alama ya tanbihi imewekwa baada ya istilahi inayohusika moja kwa moja.
