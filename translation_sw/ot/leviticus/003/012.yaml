  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: sw
  text: Lakini ikiwa sadaka yake ni mbuzi, basi atamleta mbele za Yahwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina la Mungu; kwa desturi limetafsiriwa “BWANA.” Umbo lingine la jina hilo ni “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Muungano wa kiunganishi na sharti unaanzisha hali inayofuata katika mfululizo wa maagizo ya sadaka; “Lakini ikiwa” huonyesha mpito na tofauti ndogo bila kuifanya kuwa upinzani mkali.
- source_word: עֵז
  choice: mbuzi
  rationale: Nomino hii humaanisha mbuzi na iko katika umoja; Kiswahili hakihitaji kibainishi kisicho dhahiri kama “a” ya Kiingereza.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni neno pana kwa kitu kinacholetwa au kutolewa mbele za Mungu. “Sadaka” ni neno la kawaida na linalofaa katika muktadha huu kuliko tafsiri finyu zaidi.
- source_word: וְהִקְרִיבוֹ
  choice: basi atamleta
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha kama sadaka. “Atamleta” ni Kiswahili cha kawaida, humrejelea mbuzi kwa upatanisho wa ngeli, na katika muktadha wa sheria huwasilisha agizo.
- source_word: לִפְנֵי
  choice: mbele za
  rationale: Hii ni tafsiri fupi na ya kawaida ya lugha ya mahali na ibada inayomaanisha kuwa katika uwepo wa mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama “Yahwe,” umbo lililozoeleka katika Kiswahili, badala ya kubadilishwa kwa cheo kama “BWANA.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kwa cheo, huku tanbihi ikieleza desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka katika usomaji wa hadhara; “basi” huweka wazi matokeo ya sharti. Alama ya tanbihi imewekwa baada ya “Yahwe,” kwa kuwa tanbihi inahusu jina la Mungu.
