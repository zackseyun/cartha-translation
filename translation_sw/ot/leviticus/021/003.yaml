base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: sw
  text: na kwa ajili ya dada yake bikira aliye karibu naye, ambaye hajawa na mwanamume[a], anaweza kujitia unajisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye hajapata mume,” au “ambaye hajawa na uhusiano wa kimwili na mwanamume.” Usemi wa Kiebrania ni wa kimazoea na humhusu dada ambaye hajaingia katika ndoa au uhusiano wa kingono na mwanamume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: na kwa ajili ya dada yake
  rationale: Kiunganishi na kihusishi vinaendeleza orodha ya watu ambao kuhani anaruhusiwa kujitia unajisi kwa ajili yao; kiambishi tamati kinaonyesha kuwa ni dada yake.
- source_word: הַבְּתוּלָה
  choice: bikira
  rationale: Neno hili linaonyesha moja kwa moja hali ya kutowahi kuungana kingono na mwanamume, jambo linalohusika katika sharti la sheria hii.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: aliye wa karibu naye
  rationale: Tafsiri hii inahifadhi wazo la ukaribu wa kindugu bila kulifanya kuwa ukaribu wa kihisia pekee.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: ambaye hajawa na mwanamume
  rationale: Usemi wa Kiebrania ni wa kimazoea na unaweza kuhusisha kutokuwa ameolewa au kutokuwa ameungana na mwanamume. Kiswahili hiki ni cha kawaida na kinahifadhi upana huo kwa kiasi kinachowezekana.
- source_word: לָהּ יִטַּמָּא
  choice: anaweza kujitia unajisi
  rationale: Muktadha wa orodha unaonyesha ruhusa ya kuhani kuwa katika hali ya unajisi kwa ajili yake; ‘kujitia unajisi’ hapa ni istilahi ya hali ya kiibada, si hukumu kwamba ametenda dhambi.
theological_decisions:
- issue: Asili ya unajisi katika sheria ya makuhani
  choice: kujitia unajisi
  alternative: kujichafua
  rationale: Muktadha unahusu unajisi wa kiibada unaotokana na maiti, si uchafu wa kimwili wala upotovu wa kimaadili.
- issue: Nguvu ya kitenzi יִטַּמָּא katika muktadha huu
  choice: anaweza kujitia unajisi
  alternative: atajitia unajisi
  rationale: Ndani ya marufuku na ruhusa za mistari inayozunguka, kitenzi hiki kinaeleza ruhusa kwa jamaa huyu wa karibu, si lazima au unabii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inafaa kwa sheria ya kikuhani. Muundo unaendelea moja kwa moja kutoka muktadha uliotangulia, kama ilivyo katika Kiebrania.
