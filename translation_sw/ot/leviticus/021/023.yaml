id: LEV.21.23
reference: Leviticus 21:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: sw
  text: Lakini hataingia hadi kwenye pazia[a], wala hataikaribia madhabahu, kwa sababu ana kasoro[b], ili asitie unajisi maeneo yangu matakatifu[c]; kwa maana mimi ni Yahweh, ninayatakasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, pazia la mahali patakatifu.
    reason: lexical_alternative
  - marker: b
    text: Kasoro inayotajwa hapa ni hali ya mwili iliyomzuia kuhudumu karibu na madhabahu; si kosa la kimaadili.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kina wingi, “maeneo yangu matakatifu”; tafsiri nyingine hutumia umoja, “mahali pangu patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Katika muktadha huu neno linaweka kizuizi kinachotofautiana na ruhusa ya kula vitu vitakatifu katika mstari uliotangulia.
- source_word: הַפָּרֹכֶת
  choice: pazia
  rationale: Ni pazia maalumu la mahali patakatifu; “pazia” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: יָבֹא
  choice: hataingia hadi kwenye
  rationale: Kitenzi kina maana ya kuingia au kwenda ndani; pamoja na אֶל hapa kinaonyesha kufika upande wa pazia. Usemi huu unatofautisha tendo hilo na “kuikaribia” madhabahu.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa madhabahu ya dhabihu katika muktadha wa kikuhani.
- source_word: יִגַּשׁ
  choice: hataikaribia
  rationale: Linahifadhi lugha ya kumkaribia Mungu kwa huduma ya kikuhani huku likisomeka kwa kawaida katika Kiswahili.
- source_word: מוּם בּוֹ
  choice: ana kasoro
  rationale: Katika sheria hii מוּם ni hali ya mwili inayomzuia kuhudumu karibu na madhabahu, si kosa la kimaadili.
- source_word: יְחַלֵּל
  choice: asiyatie unajisi
  rationale: Katika lugha ya utakatifu, kitenzi hiki humaanisha kuvifanya vilivyo vitakatifu kuwa vya kawaida au kuvikosea utakatifu; “kutia unajisi” ni usemi wa asili wa Kiswahili katika muktadha huu.
- source_word: מִקְדָּשַׁי
  choice: maeneo yangu matakatifu
  rationale: Uamuzi huu unahifadhi wingi wa Kiebrania na kuonyesha sehemu au maeneo yaliyowekwa wakfu, bila kuyafanya kuwa jengo moja tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: מְקַדְּשָׁם
  choice: ninayoyatakasa
  rationale: Kiambishi cha wingi kimehusishwa na nomino iliyo karibu zaidi, yaani “maeneo yangu matakatifu,” na istilahi ya utakatifu imehifadhiwa.
theological_decisions:
- issue: Rejeo la kiambishi katika מְקַדְּשָׁם
  choice: Kiambishi kinarejelea “maeneo yangu matakatifu.”
  alternative: Kiambishi kinarejelea kwa upana zaidi makuhani au watu.
  rationale: Nomino ya wingi iliyo karibu zaidi ni מִקְדָּשַׁי, na uhusiano huo unafaa na muktadha wa kuzuiwa kuingia katika maeneo matakatifu.
- issue: Maana ya מוּם katika sheria ya kikuhani
  choice: kasoro ya mwili inayosababisha kizuizi cha huduma ya kikuhani
  alternative: doa au kosa la kimaadili
  rationale: Muktadha wa sura unaorodhesha hali za mwili. Kwa hiyo tafsiri haipaswi kudokeza dhambi, hatia ya kimaadili, au kupungua kwa thamani ya mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa marufuku umewekwa wazi, wingi wa “maeneo matakatifu” umehifadhiwa, na istilahi “kasoro” imefafanuliwa ili kuepuka maana ya lawama ya kimaadili.
