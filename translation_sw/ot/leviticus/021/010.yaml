  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: sw
  text: Naye kuhani aliye mkuu kuliko ndugu zake, ambaye mafuta ya upako yamemiminwa juu ya kichwa chake na ambaye mkono wake umejazwa[a] ili avae mavazi, hataziacha nywele za kichwa chake bila kupangwa[b], wala hatayararua mavazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mkono wake umejazwa”; hii ni nahau ya kuwekwa rasmi au kuingizwa katika huduma ya kikuhani.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hatatumia ishara za kawaida za maombolezo, kama kuziacha nywele zake bila kupangwa au kurarua mavazi yake.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: kuhani aliye mkuu kuliko ndugu zake
  rationale: Hutafsiri cheo na ulinganisho wa מִן kwa karibu, huku ikibakiza ‘ndugu zake’ kwa kuwa muktadha unawahusu makuhani wanaume.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako yamemiminwa juu ya kichwa chake
  rationale: Huhifadhi hali ya kutendwa, tendo halisi la kumimina, na taswira ya ibada.
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: mkono wake umejazwa
  rationale: Huhifadhi nahau halisi ya Kiebrania yenye umuhimu wa kiibada; tanbihi inaeleza maana yake ya kuwekwa rasmi katika huduma.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: ili avae mavazi hayo
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kusudi; ‘hayo’ hurejelea mavazi maalumu yanayojulikana katika muktadha bila kuongeza neno ‘ya kikuhani’.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: hataziacha nywele za kichwa chake ziwe ovyo
  rationale: Kitenzi kinahusu kuziacha nywele au kichwa bila kupangwa kama ishara ya maombolezo. Tafsiri hii ni wazi kwa msomaji wa sasa huku tanbihi ikitoa muktadha wa kitamaduni.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: wala hatayararua mavazi yake
  rationale: Hutoa kwa uwazi ishara ya kawaida ya maombolezo na huhifadhi umbo la katazo.
theological_decisions:
- issue: Nahau ya kuwekwa rasmi, מִלֵּא אֶת יָדוֹ
  choice: Kuhifadhi ‘mkono wake umejazwa’ katika matini na kueleza maana yake katika tanbihi.
  alternative: ambaye amewekwa rasmi; ambaye amewekwa wakfu
  rationale: Nahau halisi ina uzito wa kiibada na inafaa kuhifadhiwa, lakini tanbihi huzuia msomaji asiielewe kama kujazwa kwa mkono kwa maana ya kawaida tu.
- issue: Maana ya מֵאֶחָיו
  choice: kuliko ndugu zake
  alternative: miongoni mwa ndugu zake; juu ya ndugu zake
  rationale: מִן inaweza kuwa ya ulinganisho hapa na inaonyesha hadhi yake iliyo juu ya makuhani wenzake; ‘ndugu’ hudumisha lugha ya kiume ya muktadha.
- issue: Ishara za maombolezo katika makatazo mawili
  choice: Kutaja nywele zilizo ovyo na kurarua mavazi bila kuongeza sababu ndani ya matini.
  alternative: Kutafsiri kwa ujumla kuwa ‘hataomboleza kwa desturi’
  rationale: Matini yenyewe inataja vitendo maalumu. Tanbihi inaeleza uhusiano wake na maombolezo bila kufuta taswira au mvutano wa katazo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa sasa. Muundo wa sentensi hufuata kwa karibu mfululizo wa Kiebrania, huku ‘nywele za kichwa’ ikifafanua kwa kawaida maana ya tendo la יִפְרָע.
