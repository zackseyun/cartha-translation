base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: sw
  text: 'Sema na Haruni, ukimwambia: ‘Mwanaume yeyote wa wazao wako, katika vizazi vyao, ambaye ana dosari ya mwili[a] asikaribie kutoa chakula[b] cha Mungu wake.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waa.” Neno la Kiebrania mum hapa linamaanisha dosari ya kimwili iliyomzuia mtu kufanya jukumu hili la ukuhani.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mkate wa Mungu wake.” Katika muktadha huu wa ukuhani, neno hilo linahusu kwa upana zaidi chakula kinachotolewa kama sadaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: Mwambie Haruni
  rationale: Kauli hii ya kawaida ya Kiebrania huanzisha amri ya moja kwa moja. ‘Mwambie’ inawasilisha maana yake kwa Kiswahili cha sasa bila kulazimisha muundo usio wa kawaida wa ‘sema ... ukisema.’
- source_word: אִישׁ
  choice: Mwanaume yeyote
  rationale: Nomino hii ni ya kiume, na hapa sheria inawahusu wazao wa kiume wa Haruni waliostahili kufanya huduma ya ukuhani.
- source_word: מִזַּרְעֲךָ
  choice: wa wazao wako
  rationale: ‘Wazao’ ni lugha ya kawaida na yenye heshima inayoonyesha ukoo wa Haruni bila kutumia tafsiri sisisi isiyo ya kawaida ya ‘mbegu yako.’
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Inaonyesha kwamba agizo linaendelea kutumika katika vizazi vinavyofuatana vya ukoo wa Haruni.
- source_word: מוּם
  choice: dosari ya mwili
  rationale: Katika muktadha huu wa ukuhani, neno hili linamaanisha hali ya kimwili iliyomzuia kuhudumu katika jukumu hili maalumu. ‘Dosari ya mwili’ ni wazi kuliko ‘waa,’ ambalo linaweza kueleweka kuwa alama ya juu ya ngozi tu.
- source_word: לֹא יִקְרַב
  choice: asikaribie
  rationale: Huhifadhi nguvu ya katazo na pia lugha maalumu ya kumkaribia Mungu katika huduma ya patakatifu.
- source_word: לְהַקְרִיב
  choice: kutoa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki kinamaanisha kuwasilisha au kutoa kitu kama sadaka.
- source_word: לֶחֶם אֱלֹהָיו
  choice: chakula cha Mungu wake
  rationale: Ingawa לֶחֶם kwa kawaida ni ‘mkate,’ katika lugha ya kikuhani hapa inahusu kwa upana zaidi chakula kinachotolewa kama sadaka. ‘Chakula’ kinawasilisha maana hiyo huku tanbihi ikihifadhi tafsiri sisisi.
theological_decisions:
- issue: Katazo la kikuhani linalomhusu kuhani mwenye dosari ya mwili
  choice: Kulifasiri kama katazo la kukaribia ili kutoa sadaka katika jukumu maalumu la ukuhani
  alternative: Kutumia maneno yanayoweza kudokeza kwamba mtu huyo ana hatia ya kimaadili, hana thamani sawa, au ametengwa kabisa na watu wa agano
  rationale: Mstari unadhibiti jukumu maalumu la huduma ya patakatifu; hausemi kwamba dosari hiyo ni dhambi, wala hautoi hukumu kuhusu thamani ya mtu au nafasi yake yote katika jumuiya.
- issue: Maana ya לֶחֶם אֱלֹהָיו
  choice: chakula cha Mungu wake
  alternative: mkate wa Mungu wake
  rationale: ‘Chakula’ kinaonyesha matumizi mapana ya neno hilo katika ibada ya dhabihu, huku ‘cha Mungu wake’ kikihifadhi lugha ya uhusiano iliyo katika Kiebrania bila kuieleza kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri umewekwa wazi na wa kawaida; istilahi za ibada zimehifadhiwa bila kutumia lugha ya kidhehebu au kudokeza kwamba dosari ya mwili ni kosa la kimaadili.
