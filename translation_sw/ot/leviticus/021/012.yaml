id: LEV.21.12
reference: Leviticus 21:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: sw
  text: Naye hatatoka kutoka mahali patakatifu, wala hatatia unajisi mahali patakatifu pa Mungu wake, kwa maana wakfu[a] wa mafuta ya upako ya Mungu wake uko juu yake. Mimi ni BWANA.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “taji la mafuta ya upako ya Mungu wake liko juu yake.” Neno la Kiebrania linaweza kumaanisha “taji” au “wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ
  choice: katika mahali patakatifu
  rationale: מִקְדָּשׁ humaanisha mahali palipotengwa kuwa patakatifu, yaani patakatifu au patakatifu pa ibada. Kiswahili ‘mahali patakatifu’ ni cha kawaida, wazi, na kinafaa katika sheria za kikuhani.
- source_word: לֹא יֵצֵא
  choice: hatatoka
  rationale: Kitenzi יָצָא katika qal humaanisha ‘kutoka.’ Muundo wa wakati ujao wenye ukanushi unawasilisha katazo la kisheria kwa lugha ya asili ya Kiswahili.
- source_word: וְלֹא יְחַלֵּל
  choice: wala hatapanajisi
  rationale: Katika muktadha wa utakatifu wa kikuhani, חלל katika piel humaanisha kufanya kilicho kitakatifu kipoteze heshima au hadhi yake takatifu. ‘Panajisi’ huhifadhi maana hiyo ya kidini kwa Kiswahili sanifu.
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: mahali patakatifu pa Mungu wake
  rationale: Tafsiri hii inahifadhi kirai cha umilikaji na pia marudio ya מִקְדָּשׁ yaliyomo katika Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי hapa inatoa sababu ya katazo. ‘Kwa maana’ huonyesha uhusiano huo wa kisababu kwa mtindo wenye hadhi.
- source_word: נֵזֶר
  choice: wakfu
  rationale: נֵזֶר inaweza kumaanisha taji au hali/ishara ya kuwekwa wakfu. Katika muktadha huu wa mafuta ya upako ya kuhani mkuu, ‘wakfu’ huwasilisha hadhi yake iliyowekwa kwa Mungu bila kulazimisha taswira ya taji halisi; maana mbadala imehifadhiwa katika tanbihi.
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: mafuta ya upako ya Mungu wake
  rationale: ‘Mafuta ya upako’ ni usemi wa kawaida na unaoeleweka kwa שֶׁמֶן מִשְׁחַת, huku ‘ya Mungu wake’ ikihifadhi uhusiano wa umilikaji katika mnyororo wa nomino wa Kiebrania.
- source_word: עָלָיו
  choice: uko juu yake
  rationale: Tafsiri ya karibu huhifadhi wazo la hali ya kudumu ya wakfu iliyo juu ya kuhani kutokana na mafuta ya upako.
- source_word: אֲנִי יְהוָה
  choice: Mimi ni Yahwe
  rationale: Jina la agano יהוה limewasilishwa kwa namna ya jina ‘Yahwe,’ na tamko zima limehifadhiwa kama uthibitisho wa Mungu unaorudiwa katika Mambo ya Walawi.
theological_decisions:
- issue: Maana ya נֵזֶר kuhusiana na hadhi ya kuhani mkuu
  choice: wakfu
  alternative: taji
  rationale: 'Muktadha unaeleza kwa nini kuhani mkuu haruhusiwi kutoka wala kupanajisi mahali patakatifu: ametengwa kwa Mungu kwa mafuta ya upako. ‘Wakfu’ huwasilisha hoja hiyo, lakini kwa kuwa נֵזֶר pia inaweza kumaanisha ‘taji’ au ‘taji la kifalme/kikuhani,’ maana hiyo halisi zaidi imehifadhiwa katika tanbihi ili kutofuta utata wa Kiebrania.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Marudio ya ‘mahali patakatifu’ yamehifadhiwa kwa sababu yanasisitizwa katika Kiebrania. Alama ya tanbihi imewekwa baada ya ‘wakfu,’ neno linalohusika moja kwa moja na ufafanuzi huo.
