revisions:
- from: Watakuwa watakatifu kwa Mungu wao, wala wasilinajisi jina la Mungu wao, kwa sababu wao hutoa sadaka za Yahwe zinazotolewa kwa moto, chakula[a] cha Mungu wao; kwa hiyo watakuwa watakatifu.
  to: Watakuwa watakatifu kwa Mungu wao, wala wasitie unajisi jina la Mungu wao, kwa maana wao hutoa sadaka za Yahwe zinazotolewa kwa moto, ambazo ni chakula[a] cha Mungu wao; na watakuwa watakatifu.
