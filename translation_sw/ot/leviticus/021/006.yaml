  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: sw
  text: Watakuwa watakatifu kwa Mungu wao, wala wasitie unajisi jina la Mungu wao, kwa maana wao hutoa sadaka za Yahwe zinazotolewa kwa moto, ambazo ni chakula[a] cha Mungu wao; na watakuwa watakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “mkate wa Mungu wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ
  choice: Watakuwa watakatifu
  rationale: Huhifadhi lugha ya utakatifu inayorudiwa katika mstari na nguvu ya agizo la kisheria la kitenzi cha Kiebrania.
- source_word: לֵאלֹהֵיהֶם
  choice: kwa Mungu wao
  rationale: Katika Kiswahili, ‘watakatifu kwa Mungu wao’ huonyesha kwa kawaida kwamba wametengwa wakfu kwa ajili ya Mungu wao.
- source_word: וְלֹא יְחַלְּלוּ
  choice: wala wasilinajisi
  rationale: Kitenzi חלל hapa humaanisha kulifanya jambo takatifu lionekane la kawaida au lisilo takatifu; ‘kulitia unajisi’ huhifadhi utofauti huo wa kiibada.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: jina la Mungu wao
  rationale: Ni tafsiri ya moja kwa moja na yenye hadhi ya kirai cha Kiebrania.
- source_word: אִשֵּׁי יְהוָה
  choice: sadaka za Yahwe zinazotolewa kwa moto
  rationale: אִשֶּׁה ni neno la kiufundi kwa sadaka inayotolewa kwa moto. Muundo huu huepuka kuifanya kimakosa kuwa sadaka ya kuteketezwa kabisa tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: chakula cha Mungu wao
  rationale: Ingawa לֶחֶם kwa msingi ni ‘mkate,’ katika muktadha huu wa dhabihu hurejelea chakula kwa maana pana; tanbihi huhifadhi maana halisi zaidi.
- source_word: מַקְרִיבִם
  choice: wao hutoa
  rationale: Hiphil ya קרב humaanisha kuleta karibu au kuwasilisha kama sadaka; ‘hutoa’ ni ya kawaida na wazi katika Kiswahili cha ibada.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: kwa hiyo watakuwa watakatifu
  rationale: Mwisho unarudia wajibu wa utakatifu kama matokeo ya huduma yao ya kutoa sadaka; ‘kwa hiyo’ huonyesha mtiririko wa hoja bila kuondoa msisitizo wa marudio.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina la agano יהוה moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya usemi wa kiibada אִשֵּׁי יְהוָה
  choice: sadaka za Yahwe zinazotolewa kwa moto
  alternative: sadaka za chakula za Yahwe
  rationale: Chaguo hili huhifadhi kipengele cha moto kilichomo katika neno la kiufundi la Kiebrania bila kudokeza kwamba kila sadaka iliteketezwa kabisa.
- issue: Uhusiano wa לֶחֶם na sadaka
  choice: chakula cha Mungu wao
  alternative: mkate wa Mungu wao
  rationale: ‘Chakula’ hutoa maana ya kiibada kwa msomaji wa sasa, huku ‘mkate’ kama maana halisi zaidi ikihifadhiwa katika tanbihi bila kueleza fumbo la kitheolojia kupita matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya kiibada imehifadhiwa bila kutumia maneno ya kale yasiyoeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya neno linalohusika.
