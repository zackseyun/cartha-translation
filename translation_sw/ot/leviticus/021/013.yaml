lexical_decisions:
- source_word: וְהוּא
  choice: Naye
  rationale: Inaendeleza mtiririko wa sheria na kudumisha kiwakilishi cha wazi chenye msisitizo mdogo bila kukitia chumvi.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: Nomino yenyewe humaanisha ‘mwanamke’ au ‘mke’; pamoja na kitenzi ‘atamwoa,’ maana ya ndoa iko wazi kwa Kiswahili cha kawaida.
- source_word: בִּבְתוּלֶיהָ
  choice: akiwa katika ubikira wake
  rationale: Inahifadhi kwa karibu muundo wa Kiebrania unaoeleza hali ya ubikira, huku ‘akiwa bikira’ likibaki kama namna ya kawaida zaidi katika tanbihi.
- source_word: יִקָּח
  choice: atamwoa
  rationale: Ingawa maana ya msingi ni ‘atachukua,’ katika muktadha wa kumchukua mwanamke kuwa mke, Kiswahili cha sasa hutumia ‘oa’; tafsiri ya neno kwa neno ‘atachukua mke’ ingeweza kusikika isiyo ya kawaida au yenye maana nyingine.
theological_decisions:
- issue: Istilahi ya ndoa katika sheria ya ukuhani
  choice: Kutafsiri nahau ya Kiebrania kwa ‘atamwoa mwanamke’
  alternative: atamchukua mwanamke kuwa mke
  rationale: Hii inaweka wazi maana ya ndoa bila kuingiza fundisho la dhehebu, huku kirai kinachofuata kikihifadhi mkazo wa maandishi juu ya hali ya mwanamke wakati wa ndoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya lugha ya sheria. ‘Atamwoa’ ni ya asili zaidi kuliko kunakili moja kwa moja nahau ya Kiebrania ya ‘kumchukua mke’; tanbihi inadumisha umbo halisi na namna mbadala iliyo rahisi.
