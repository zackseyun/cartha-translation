  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: sw
  text: Asijitie unajisi akiwa mume miongoni mwa watu wake,[a] na hivyo kujifanya asiye mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Asijitie unajisi akiwa mtu mkuu miongoni mwa watu wake, na hivyo kujifanya asiye mtakatifu.” Kifungu cha Kiebrania ni kigumu; wengine hukielewa kwa ujumla zaidi kuwa ni katazo la kujitia unajisi katika nafasi ya heshima miongoni mwa watu, wala si hasa akiwa mume.
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: asijitie unajisi
  rationale: Kitenzi hiki katika muktadha wa sheria za ukuhani kinahusu kupata unajisi wa kiibada kwa kugusa au kushughulika na maiti. ‘Kujitia unajisi’ ni lugha ya kawaida na yenye hadhi, huku ikionyesha kwamba tendo hilo linamhusu mhusika mwenyewe.
- source_word: בַּעַל
  choice: akiwa mume
  rationale: Ingawa neno hili linaweza kumaanisha ‘bwana’ au mtu mwenye cheo, maana ya ‘mume’ inafaa katika muktadha wa jamaa ambao kuhani angeweza kuomboleza kwa ajili yao. Kwa kuwa kifungu cha Kiebrania ni kigumu, maana nyingine imehifadhiwa katika tanbihi.
- source_word: בְּעַמָּיו
  choice: miongoni mwa watu wake
  rationale: Hii inafuata maana ya moja kwa moja ya Kiebrania. Katika muktadha, ‘watu wake’ huenda wakamaanisha watu wa ukoo au jamaa zake, lakini tafsiri pana imeachwa katika matini kuu.
- source_word: לְהֵחַלּוֹ
  choice: na hivyo kujitia unajisi wa kukufuru utakatifu wake
  rationale: Muundo huu unaonyesha kusudi au matokeo ya kujitia unajisi. ‘Kukufuru utakatifu wake’ huhifadhi tofauti ya msingi kati ya unajisi wa kiibada na kuvunja hali takatifu ya kuhani, badala ya kurudia tu ‘kujitia unajisi.’
theological_decisions:
- issue: Maana ya kifungu kigumu בַּעַל בְּעַמָּיו
  choice: Katazo linaeleweka kuwa linamhusu kuhani kujitia unajisi akiwa mume miongoni mwa watu wake.
  alternative: Asijitie unajisi akiwa mtu mkuu miongoni mwa watu wake; au, asijitie unajisi miongoni mwa watu wake na hivyo kukufuru utakatifu wake.
  rationale: Kiebrania kimebanwa kisintaksia na kinaweza kueleweka kwa njia zaidi ya moja. Maana ya kawaida ya בַּעַל kama ‘mume’ inalingana na muktadha wa ruhusa zinazohusu jamaa wa karibu, lakini utata halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. ‘Kujitia unajisi’ na ‘utakatifu’ hudumisha istilahi za kiibada na ukuhani; tanbihi huhifadhi utata wa Kiebrania bila kuubana kuwa fundisho la dhehebu fulani.
