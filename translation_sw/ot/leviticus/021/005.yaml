base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: sw
  text: Wasijinyolee kipara vichwani mwao, wala wasinyoe ukingo wa ndevu zao[a], wala wasijifanyie mikato mwilini mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pande za ndevu zao.” Neno la Kiebrania linaweza kumaanisha ukingo, upande, au pembe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: wasijinyolee kipara
  rationale: Muundo wa kitenzi na nomino yenye mzizi uleule unakataza kujitengenezea eneo lisilo na nywele, si kupata upara kiasili. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha tendo la makusudi.
- source_word: בְּרֹאשָׁם
  choice: kichwani
  rationale: Nomino ya Kiebrania iko katika umoja ikiwa na kiambishi cha wingi; Kiswahili cha mgawanyo hutumia kwa kawaida umoja ‘kichwani’ kwa kila mmoja wao.
- source_word: פְאַת זְקָנָם
  choice: ukingo wa ndevu zao
  rationale: פאה inaweza kumaanisha ukingo, upande, au pembe. ‘Ukingo’ huhifadhi upana huo wa maana bila kubainisha kupita kiasi namna hasa ya kunyoa.
- source_word: יְגַלֵּחוּ
  choice: wasinyoe
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha kuondoa nywele kwa kunyoa; ‘wasinyoe’ ni wazi na ya kawaida.
- source_word: וּבִבְשָׂרָם
  choice: mwilini mwao
  rationale: Ingawa בשר kihalisi ni ‘nyama,’ katika Kiswahili ‘mwilini mwao’ huwasilisha kwa kawaida tendo linalofanywa katika mwili bila kuleta maana isiyokusudiwa ya nyama iliyotengwa na mwili.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: wasijifanyie mikato
  rationale: Jozi ya kitenzi na nomino inaeleza kujikata au kujifanyia majeraha ya kukatwa. ‘Kujifanyia mikato’ ni ya moja kwa moja na haiongezi kusudi lisilotajwa katika mstari.
theological_decisions:
- issue: Asili ya makatazo
  choice: Kutaja moja kwa moja matendo yaliyokatazwa bila kuongeza kwamba yalifanywa kwa ajili ya wafu
  alternative: Kuongeza maelezo ya kwamba ni matendo ya maombolezo kwa ajili ya wafu kwa kutegemea Walawi 19:28 au Kumbukumbu la Torati 14:1
  rationale: Mstari huu unataja matendo yenyewe lakini hautaji kusudi lake. Tafsiri inahifadhi mipaka ya maandishi haya bila kuingiza maelezo kutoka vifungu sambamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya ‘ndevu zao,’ ambako tofauti ya kimsamiati inahusika.
