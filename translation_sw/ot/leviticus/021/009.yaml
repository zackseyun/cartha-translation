base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: sw
  text: Na binti wa kuhani, ikiwa anajitia unajisi[a] kwa kufanya ukahaba[b], anamdhalilisha baba yake; atachomwa kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akianza kufanya ukahaba.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuanza” katika baadhi ya miktadha, lakini katika muktadha huu kinaeleweka vyema kuwa kujitia unajisi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kuishi kama kahaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת אִישׁ כֹּהֵן
  choice: Na binti wa kuhani
  rationale: Muundo huu kwa maana ya kawaida ni ‘binti wa kuhani.’ Kiswahili hiki ni cha asili na kinadumisha mtindo wa sheria.
- source_word: כִּי
  choice: ikiwa
  rationale: Katika sheria ya masharti, neno hili linaanzisha hali inayowezekana; ‘ikiwa’ linaonyesha wazi nguvu hiyo ya sharti.
- source_word: תֵחֵל
  choice: anajitia unajisi
  rationale: Kitenzi cha Kiebrania hapa kinaweza kueleweka kuwa kujifanya najisi au kuanza. Muktadha wa sheria ya utakatifu unapendelea maana ya kujitia unajisi, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: לִ/זְנוֹת
  choice: kwa kufanya ukahaba
  rationale: Kitenzi זנה hapa kinataja kwa uwazi ukahaba, si uasherati kwa maana pana tu. Kirai cha ‘kwa kufanya’ kinaonyesha jinsi anavyojitia unajisi.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: anamtia baba yake unajisi
  rationale: Tafsiri hii inadumisha baba kama yambwa wa moja kwa moja na pia inarudia msamiati wa unajisi unaounganisha vifungu viwili vya Kiebrania.
- source_word: בָּ/אֵשׁ תִּשָּׂרֵף
  choice: atachomwa kwa moto
  rationale: Kauli tendwa ya kisheria inaagiza adhabu; ‘atachomwa kwa moto’ ni wazi, nzito, na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Kutafsiri msamiati wa חלל katika sheria ya utakatifu wa kikuhani
  choice: Kutumia ‘kujitia/kumtia unajisi’ katika vifungu vyote viwili
  alternative: Kutumia ‘kujidhalilisha’ na ‘kumwaibisha’ au ‘kumvunjia heshima’
  rationale: Kurudia ‘unajisi’ kunahifadhi uhusiano wa kileksia kati ya tendo la binti na athari yake kwa hadhi takatifu ya baba yake kuhani. Maneno ya aibu au heshima pekee yangepunguza uzito wa kiibada wa neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito wa sheria. Marudio ya ‘unajisi’ yamekusudiwa kuhifadhi mwangwi wa mzizi mmoja wa Kiebrania katika vifungu viwili.
