base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: sw
  text: 'Kwa maana hakuna mwanamume mwenye kasoro ya mwili[a] atakayekaribia[b]: mwanamume asiyeona, au mwenye ulemavu wa kutembea, au mwenye uso ulioharibika[c], au mwenye kiungo kirefu kupita kiasi[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kasoro” hapa ni hali ya mwili iliyomzuia kuhudumu katika jukumu hili la kikuhani; neno hili halisemi kwamba mtu huyo alikuwa na kosa la maadili.
    reason: lexical_alternative
  - marker: b
    text: “Kukaribia” hapa kunamaanisha kukaribia kwa ajili ya huduma ya kikuhani.
    reason: cultural_note
  - marker: c
    text: Neno la Kiebrania ni adimu. Huenda linamaanisha hasa pua iliyokatika, iliyoharibika, au yenye umbo lisilo la kawaida; wengine hulielewa kwa upana kuwa ulemavu wa uso.
    reason: lexical_alternative
  - marker: d
    text: Neno la Kiebrania huenda linamaanisha kiungo kilichorefuka kupita kiasi, au kwa upana zaidi sehemu ya mwili yenye umbo lisilo la kawaida au isiyo na uwiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa katazo lililotangulia; “Kwa maana” kinaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: כָל אִישׁ ... לֹא
  choice: hakuna mwanamume ... atakayekaribia
  rationale: Ingawa muundo wa Kiebrania ni kama “kila mwanamume ... si,” maana yake ni katazo linalomhusu kila mwanamume. “Mwanamume” imehifadhiwa kwa sababu muktadha unahusu wanaume wa ukoo wa Haruni wanaotumikia kama makuhani.
- source_word: אֲשֶׁר בּוֹ מוּם
  choice: mwenye kasoro ya mwili
  rationale: מוּם hapa ni hali ya kimwili inayomzuia kuhudumu karibu na madhabahu; kuongeza “ya mwili” huzuia “kasoro” kueleweka kama kosa la maadili.
- source_word: לֹא יִקְרָב
  choice: hatakayekaribia
  rationale: קרב katika muktadha wa kikuhani humaanisha kukaribia ili kutekeleza huduma takatifu. Tafsiri ya msingi imebaki fupi, huku tanbihi ikifafanua upeo wake.
- source_word: אִישׁ עִוֵּר
  choice: mwanamume asiyeona
  rationale: Ni tafsiri ya moja kwa moja na ya heshima ya hali ya upofu katika Kiswahili cha sasa.
- source_word: פִסֵּחַ
  choice: mwenye ulemavu wa kutembea
  rationale: Neno hili humaanisha mtu mwenye hali inayomfanya ashindwe kutembea kawaida. Usemi huu ni wazi na wa kawaida kuliko lebo kama “kiwete,” bila kuongeza maelezo yasiyothibitishwa.
- source_word: חָרֻם
  choice: mwenye pua iliyoharibika
  rationale: Neno hili adimu kwa kawaida hueleweka kuhusu pua iliyokatika, kuharibika, au kuwa na umbo lisilo la kawaida. Tafsiri hii inatoa maana inayowezekana zaidi, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: שָׂרוּעַ
  choice: mwenye kiungo kirefu kupita kiasi
  rationale: Neno hili huenda linaonyesha kiungo kilichorefuka au sehemu ya mwili isiyo na uwiano. Tafsiri hii ni halisi na inasomeka, huku tanbihi ikitaja uwezekano mpana zaidi.
theological_decisions:
- issue: Asili na upeo wa katazo
  choice: Kulifafanua kama sharti la huduma ya kikuhani la kukaribia mahali patakatifu, si hukumu kuhusu thamani ya mtu au hali yake ya kiroho.
  alternative: Kulielewa kama katazo pana la kijamii dhidi ya watu wenye ulemavu.
  rationale: Muktadha wa Walawi 21 na matumizi ya קרב yanaelekeza kwenye kukaribia kwa ajili ya huduma ya kikuhani. Aya haisemi kwamba hali hizi ni dhambi wala kwamba zinapunguza thamani ya mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya hali za mwili imechaguliwa kwa uangalifu bila kuficha masharti makali ya sheria ya kikuhani. Muundo wa orodha na mvutano wa maandishi umehifadhiwa; utata wa maneno חָרֻם na שָׂרוּעַ umewekwa wazi katika tanbihi.
