base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: sw
  text: Asikaribie maiti yoyote[a]; asijitie unajisi hata kwa ajili ya baba yake wala mama yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwili wa mtu aliyekufa.” Kihalisi, “nafsi za aliyekufa,” usemi unaomaanisha maiti katika sheria za usafi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: Asikaribie
  rationale: Katika muktadha wa sheria za kikuhani kuhusu unajisi unaotokana na maiti, בוא pamoja na עַל ina maana ya kumkaribia au kuwa karibu na maiti, si kuja tu mahali fulani. Umbo la kukataza limetafsiriwa kwa Kiswahili cha kawaida ‘asikaribie.’
- source_word: כָּל
  choice: yoyote
  rationale: Pamoja na ukanushaji, ‘yoyote’ huonyesha kwamba katazo linahusu maiti ya mtu yeyote bila ubaguzi.
- source_word: נַפְשֹׁת מֵת
  choice: maiti
  rationale: Ingawa kirai hiki kihalisi kinahusisha ‘nafsi/mtu wa aliyekufa,’ katika sheria za Walawi ni nahau inayomaanisha mwili wa mtu aliyekufa. ‘Maiti’ ni neno la kawaida, lenye heshima, na linalofaa katika muktadha huu.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: hata kwa ajili ya baba yake au mama yake
  rationale: לְ hapa huonyesha uhusiano au kisa kinachohusika. ‘Hata’ hudhihirisha mkazo kwamba katazo halina tofauti hata kwa wazazi wake wa karibu zaidi; ‘au’ huwasilisha maana ya kila mzazi kivyake katika Kiswahili.
- source_word: לֹא יִטַּמָּא
  choice: asijitie unajisi
  rationale: Hitpaeli ya טמא ina maana ya kujitia au kuwa katika hali ya unajisi. ‘Asijitie unajisi’ huhifadhi hali ya kujirejelea na istilahi ya usafi wa kiibada bila kuifanya iwe hukumu ya moja kwa moja kuhusu uovu wa kimaadili.
theological_decisions:
- issue: Istilahi ya unajisi katika sheria za usafi
  choice: asijitie unajisi
  alternative: asijichafue; asiwe najisi kiibada
  rationale: ‘Unajisi’ huhifadhi aina ya hali inayozungumziwa katika sheria za Walawi bila kuichanganya moja kwa moja na dhambi ya kimaadili. Kuongeza ‘kiibada’ katika matini kuu kungekuwa ufafanuzi usioelezwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umewekwa kwa vitenzi vya kukataza ‘asikaribie’ na ‘asijitie,’ huku ‘maiti’ likitoa maana iliyo wazi kwa msomaji wa kawaida.
