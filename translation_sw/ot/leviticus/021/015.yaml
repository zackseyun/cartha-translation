  text: וְ/לֹֽא יְחַלֵּ֥ל זַרְע֖/וֹ בְּ/עַמָּ֑י/ו כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשֽׁ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: sw
  text: Asiwatie unajisi[a] wazao wake miongoni mwa watu wake[b], kwa kuwa mimi ni Yahweh ninayemtakasa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asiwavunjie utakatifu wazao wake” au “asiwavunjie heshima wazao wake.” Kitenzi cha Kiebrania kina wazo la kufanya kilichopaswa kuwa kitakatifu kiwe cha kawaida.
    reason: lexical_alternative
  - marker: b
    text: Yaani, katika muktadha huu, kwa kukiuka masharti ya ndoa angeutia unajisi ukoo wake ndani ya jumuiya ya agano.
    reason: cultural_note
  - marker: c
    text: Au, “anayemfanya kuwa mtakatifu” au “anayemweka wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: asiwatie unajisi
  rationale: Kitenzi hiki katika muktadha wa utakatifu wa kikuhani humaanisha kufanya kilicho wakfu kiwe cha kawaida au kukivunjia utakatifu. ‘Kuwatia unajisi’ ni usemi wa kawaida wa Kiswahili unaobeba uzito wa kidini wa neno hilo.
- source_word: זַרְעוֹ
  choice: wazao wake
  rationale: Neno זֶרַע linaweza kumaanisha mbegu, uzao, au wazao. Hapa linahusu kizazi cha kuhani katika muktadha wa masharti ya ndoa, hivyo ‘wazao wake’ ni la asili na linaeleweka wazi.
- source_word: בְּעַמָּיו
  choice: miongoni mwa watu wake
  rationale: Muundo wa Kiebrania unaonyesha mazingira ya kijamii na ya agano ambamo uzao wa kikuhani haupaswi kutiwa unajisi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililowakilishwa na tetragramatoni limeandikwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: מְקַדְּשׁוֹ
  choice: ninayemtakasa
  rationale: Umbo hili la קדשׁ humaanisha kumfanya mtu kuwa mtakatifu au kumweka wakfu. ‘Ninayemtakasa’ linahifadhi msamiati wa utakatifu na linafaa katika muktadha wa kikuhani.
theological_decisions:
- issue: Anayelengwa na katazo na msingi wa utakatifu
  choice: Aya inasema kwamba kuhani hapaswi kuwatia unajisi wazao wake miongoni mwa jumuiya yake, kwa sababu Yahweh ndiye anayemtakasa kuhani huyo.
  alternative: Inaweza kueleweka kwa maana maalumu zaidi kwamba kuhani mkuu hapaswi kuufanya ukoo wake ukose sifa za ukuhani kwa kumwoa mwanamke aliyekatazwa.
  rationale: Muktadha wa karibu unahusu masharti ya ndoa ya kuhani, lakini Kiebrania hakitaji moja kwa moja kupoteza cheo cha ukuhani. Kwa hiyo tafsiri inadumisha usemi mpana wa andiko badala ya kuingiza ufafanuzi huo katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo mfupi wa Kiebrania umehifadhiwa, na alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
