  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֽוֹ גִבֵּ֣ן אוֹ דַ֔ק א֖וֹ תְּבַלֻּ֣ל בְּ/עֵינ֑/וֹ א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת א֖וֹ מְר֥וֹחַ אָֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: sw
  text: au mwenye mgongo uliopinda[a], au mwenye mwili uliodumaa[b], au mwenye kasoro katika jicho lake[c], au mwenye ugonjwa wa ngozi unaowasha, au mwenye ugonjwa wa ngozi wenye magamba[d], au mwenye korodani zilizopondwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye mgongo uliokunjamana.”
    reason: lexical_alternative
  - marker: b
    text: Maana ya neno la Kiebrania lililotafsiriwa “mwenye mwili uliodumaa” si hakika; huenda linamaanisha kwa ujumla mtu mwenye umbo lisilokua kawaida au mwili uliokonda na kudhoofika.
    reason: lexical_alternative
  - marker: c
    text: Au, “mwenye doa katika jicho lake”; aina kamili ya kasoro hiyo ya jicho haijulikani.
    reason: lexical_alternative
  - marker: d
    text: Maneno mawili ya Kiebrania yaliyotafsiriwa hapa kuwa magonjwa ya ngozi huenda yanataja magonjwa mawili tofauti; utambuzi wake katika istilahi za kisasa haujulikani kwa hakika.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: mwenye mgongo uliopinda
  rationale: Neno hili linaonyesha ulemavu wa mgongo, huenda mgongo uliokunjamana au kupinda; tafsiri hii ni ya kawaida na yenye heshima bila kudai kwa uhakika hali maalumu ya kitabibu.
- source_word: דַק
  choice: mwenye mwili uliodumaa
  rationale: Maana kamili ya neno hili katika orodha hii haijulikani kwa hakika. Linaweza kumaanisha mtu mwenye umbo dogo lisilokua kawaida au mwili uliokonda na kudhoofika; ‘mwili uliodumaa’ huhifadhi wazo hilo pana.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: mwenye kasoro katika jicho lake
  rationale: Kirai hiki kinataja hali isiyo ya kawaida katika jicho, lakini aina yake kamili haijulikani; ‘kasoro’ huepuka utambuzi wa kitabibu usio na uhakika.
- source_word: גָרָב
  choice: mwenye ugonjwa wa ngozi unaowasha
  rationale: Neno hili linaonyesha ugonjwa au muwasho wa ngozi. Tafsiri ya maelezo ni wazi katika Kiswahili bila kulinganisha kwa uhakika na ugonjwa maalumu wa kisasa.
- source_word: יַלֶּפֶת
  choice: mwenye ugonjwa wa ngozi wenye magamba
  rationale: Hili ni tatizo jingine la ngozi, tofauti na גָרָב. ‘Wenye magamba’ hudumisha tofauti hiyo bila kudai utambuzi mahususi kama ukurutu.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: mwenye korodani zilizopondwa
  rationale: Kirai hiki kinahusu korodani zilizojeruhiwa au kuharibiwa kwa kupondwa. Tafsiri ni ya moja kwa moja na ya kianatomia kama Kiebrania.
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi hiki kinarudiwa kutenganisha kila hali katika orodha; ‘au’ hudumisha muundo huo.
theological_decisions:
- issue: Lugha ya hali za mwili katika sheria kuhusu ukuhani
  choice: Kutumia lugha ya moja kwa moja kuhusu mwili bila kuhusisha hali hizi na hatia ya kimaadili.
  alternative: Kutumia tasfida au istilahi mahususi za kitabibu.
  rationale: Mstari unaorodhesha hali za mwili zinazohusu ustahili wa kuhudumu katika nafasi fulani ya kikuhani, wala hauzisemi kuwa dhambi. Tafsiri inapaswa kudumisha uzito wa sheria na kutoweka hukumu ya kimaadili ambayo haimo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima, wazi na wa sasa. Muundo unaorudia ‘au mwenye’ umehifadhiwa ili kuonyesha orodha ya Kiebrania. Lugha ya maelezo imetumiwa pale ambapo istilahi ya Kiebrania haina utambuzi wa kitabibu ulio hakika.
