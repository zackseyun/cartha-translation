base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: sw
  text: 'Yahwe akamwambia Musa, “Waambie makuhani, wana wa Aroni, na uwaambie hivi: Hakuna kuhani atakayejitia unajisi[b] kwa sababu ya mtu aliyekufa[a] miongoni mwa watu wake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa nefeshi (נֶפֶשׁ).” Katika muktadha huu wa sheria za utakaso, neno hilo ni nahau inayomaanisha maiti au mtu aliyekufa.'
    reason: lexical_alternative
  - marker: b
    text: Pia inaweza kutafsiriwa “atakayekuwa najisi” au “atakayejinajisi.” Hapa Kiebrania kinamaanisha unajisi wa kiibada unaohusiana na mtu aliyekufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetafsiriwa kama jina binafsi “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: Waambie ... uwaambie hivi
  rationale: Marudio ya kitenzi אמר yamehifadhiwa kwa Kiswahili cha kawaida; “hivi” hutambulisha ujumbe unaofuata kwa uwazi.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: makuhani, wana wa Aroni
  rationale: Muundo wa ufafanuzi wa Kiebrania umehifadhiwa, huku “wana” ikidumisha utambulisho wa kifamilia bila kuufasiri kimyakimya kuwa “wazao.”
- source_word: לְנֶפֶשׁ
  choice: kwa sababu ya mtu aliyekufa
  rationale: Katika sheria hii ya utakaso, נֶפֶשׁ ni nahau inayomaanisha mtu aliyekufa au maiti, si “nafsi.” “Mtu aliyekufa” ni wazi na yenye heshima.
- source_word: יִטַּמָּא
  choice: atakayejitia unajisi
  rationale: Kauli hii inaonyesha kujipatia hali ya kutokuwa safi kiibada. “Kujitia unajisi” huhifadhi maana ya kujirejelea bila kuifanya kwanza kuwa hukumu ya uovu wa kimaadili.
- source_word: בְּעַמָּיו
  choice: miongoni mwa watu wake
  rationale: Tafsiri hii inahifadhi maana pana ya watu au jamaa zake; aya zinazofuata ndizo zinazobainisha ndugu wa karibu.
theological_decisions:
- issue: Asili ya unajisi katika sheria za makuhani
  choice: 'Kutumia lugha ya unajisi wa kiibada: “atajitia unajisi.”'
  alternative: “atajichafua” au lugha inayoashiria moja kwa moja kosa la kimaadili
  rationale: Muktadha unahusu hali ya kutokuwa safi kiibada inayohusiana na mtu aliyekufa. Tafsiri haipaswi kuigeuza kimyakimya kuwa dai pana kuhusu uchafu wa kimaadili.
- issue: Umoja wa amri ndani ya hotuba kwa kundi la makuhani
  choice: “Hakuna kuhani atakayejitia...”
  alternative: “Wasijitie...”
  rationale: Kiebrania kinawahutubia makuhani kwa wingi lakini amri yenyewe iko katika umoja. Muundo huu wa Kiswahili huhifadhi matumizi ya umoja kwa kila kuhani na kuweka mhusika wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya amri yamehifadhiwa bila kufanya sentensi kuwa ngumu. “Hakuna kuhani” inaeleweka kwa urahisi na huakisi amri ya umoja iliyotolewa kwa kundi zima.
