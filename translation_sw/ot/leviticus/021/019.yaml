lexical_decisions:
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi rahisi cha kutenganisha kinachoendeleza orodha ya hali za kimwili zinazomzuia kuhudumu.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino hii ya Kiebrania iko katika umoja wa kiume na hapa inamtaja kuhani wa kiume mmoja.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: aliye-
  rationale: Kifungu hiki humaanisha kihalisi ‘ambaye ndani yake kuna,’ lakini Kiswahili cha kawaida huieleza hali hiyo kwa muundo wa ‘aliyevunjika’ bila kupoteza maana.
- source_word: שֶׁבֶר
  choice: aliyevunjika
  rationale: Nomino hiyo hueleza mvunjiko. Katika Kiswahili cha kawaida, kusema mtu ‘aliyevunjika mguu au mkono’ ni wazi na si kwa lugha nzito ya kitabibu.
- source_word: רָגֶל
  choice: mguu
  rationale: רָגֶל kwa msingi humaanisha ‘unyayo/mguu,’ lakini Kiswahili kwa kawaida hutumia ‘mguu’ kwa sehemu hii na pia katika usemi wa kuvunjika mguu.
- source_word: שֶׁבֶר יָד
  choice: mkono
  rationale: יָד humaanisha moja kwa moja ‘mkono’; hakuna sababu ya kimuktadha ya kuipanua kwa neno mahsusi zaidi.
