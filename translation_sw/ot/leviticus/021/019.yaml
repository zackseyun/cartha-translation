  text: au mwanamume mwenye mguu uliovunjika au mkono uliovunjika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamume ambaye ana mvunjiko wa mguu au mvunjiko wa mkono.”
