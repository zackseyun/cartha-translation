base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: sw
  text: Umtakase, kwa sababu yeye ndiye anayetoa chakula[a] cha Mungu wako. Atakuwa mtakatifu kwako, kwa sababu mimi, Yahwe, ninayewatakasa, ni mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate wa Mungu wako.” Hapa neno “mkate” huenda linamaanisha kwa upana zaidi matoleo ya chakula yanayotolewa kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: Utamtenga kuwa mtakatifu
  rationale: Kauli hii inaonyesha wajibu wa kumweka kuhani kando na kumtambua kuwa mtakatifu. Tafsiri hii ni ya kawaida kwa Kiswahili na inadumisha mzizi wa wazo la utakatifu unaorudiwa katika aya.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: chakula cha Mungu wako
  rationale: Ingawa לֶחֶם kwa maana ya msingi ni “mkate,” katika muktadha huu wa kikuhani inahusu matoleo ya chakula kwa upana zaidi. Neno “chakula” linaeleza maana hiyo bila kuifunga kwa mkate halisi pekee.
- source_word: מַקְרִיב
  choice: anayetoa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuleta au kuwasilisha toleo. “Anayetoa” ni Kiswahili cha kawaida na kinachoeleweka wazi.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: Atakuwa mtakatifu kwako
  rationale: Tafsiri hii inadumisha kauli ya hadhi ya kuhani, uhusiano unaoonyeshwa na לְ, na urudiaji wa neno “mtakatifu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.” Umbo “Yahwe” linaendana na tahajia ya kawaida ya Kiswahili.
- source_word: מְקַדִּשְׁכֶם
  choice: ninayewatakasa
  rationale: Kiwakilishi tamati ni cha wingi, hivyo “-wa-” kinaonyesha kwamba Mungu anawaambia watu wote. “Takasa” pia hudumisha uhusiano wa kimsamiati na mada ya utakatifu katika aya.
theological_decisions:
- issue: Maana ya usemi wa kikuhani לֶחֶם אֱלֹהֶיךָ
  choice: chakula cha Mungu wako
  alternative: mkate wa Mungu wako
  rationale: Muktadha unahusu huduma ya kuhani katika kutoa matoleo, hivyo maana pana ya chakula inafaa zaidi; maana halisi ya “mkate” imehifadhiwa katika tanbihi.
- issue: Urudiaji wa lugha ya mzizi קדשׁ
  choice: mtakatifu / kuwatakasa
  alternative: aliyetengwa / kuwaweka wakfu
  rationale: Maneno haya yanadumisha mshikamano wa kitheolojia kati ya hadhi ya kuhani, utakatifu wa Yahwe, na tendo la Yahwe la kuwafanya watu wake kuwa watakatifu, bila kuondoa tofauti za kisarufi katika vifungu hivyo.
- issue: Mabadiliko kutoka msemo wa umoja kwenda wingi
  choice: Mungu wako / kwako, kisha ninayewatakasa
  alternative: Kusawazisha viwakilishi vyote kuwa vya umoja au vya wingi
  rationale: Kiebrania kinamwelekeza mtu mmoja anayewakilisha jamii kwa “wako/kwako,” lakini katika mwisho kinatumia kiambishi cha wingi katika מְקַדִּשְׁכֶם. Tafsiri imehifadhi mabadiliko hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Lugha ya utakatifu imedumishwa bila kutumia istilahi nzito isivyo lazima; tofauti ya viwakilishi vya umoja na wingi katika Kiebrania imehifadhiwa.
