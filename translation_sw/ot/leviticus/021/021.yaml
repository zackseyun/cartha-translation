  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: sw
  text: Mwanaume yeyote katika uzao wa Haruni, kuhani, aliye na kasoro hatakaribia kutoa sadaka za Yahwe zinazotolewa kwa moto.[a] Ana kasoro; hatakaribia kutoa mkate wa Mungu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za chakula za Yahwe.” Neno la Kiebrania linaweza kumaanisha sadaka zinazotolewa kwa moto na linahusishwa hapa na chakula kinachotolewa kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: “Mkate wa Mungu wake” ni nahau ya kikuhani kwa chakula kinachotolewa kwa Mungu katika dhabihu; yaweza pia kutafsiriwa “chakula cha Mungu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: Mtu yeyote ... hatakaribia
  rationale: Muundo wa כָּל pamoja na kikanushi unaonyesha katazo linalomhusu kila mwanaume katika ukoo wa kikuhani; kwa Kiswahili, “mtu yeyote ... hata-” ni wa kawaida na unaweka wazi katazo hilo.
- source_word: מוּם
  choice: kasoro
  rationale: Katika muktadha huu wa kikuhani, neno hili linamaanisha kasoro ya mwili iliyomzuia kuhudumu katika utoaji wa sadaka; “kasoro” ni neno la sasa, wazi, na lenye hadhi.
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: wa uzao wa kuhani Haruni
  rationale: “Uzao” huhifadhi maana ya nasaba ya זֶרַע, huku mpangilio “kuhani Haruni” ukiwa wa asili katika Kiswahili.
- source_word: יִגַּשׁ
  choice: hatakaribia
  rationale: Kitenzi hiki katika mazingira ya ibada humaanisha kukaribia ili kufanya huduma ya kikuhani; tafsiri hii pia huhifadhi urudiaji wa neno katika aya.
- source_word: לְהַקְרִיב
  choice: kutoa
  rationale: Katika muktadha wa dhabihu, הקריב ni kuwasilisha au kutoa sadaka; “kutoa” ni wazi na ya kawaida kwa Kiswahili.
- source_word: אִשֵּׁי יְהוָה
  choice: sadaka za Yahwe zinazotolewa kwa moto
  rationale: אִשֶּׁה ni istilahi ya sadaka inayohusishwa na moto. Tafsiri hii huhifadhi picha ya moto badala ya kuamua bila ulazima kwamba neno lenyewe linamaanisha chakula.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetafsiriwa moja kwa moja kwa umbo la Kiswahili “Yahwe.”
- source_word: לֶחֶם אֱלֹהָיו
  choice: mkate wa Mungu wake
  rationale: “Mkate” ni maana ya msingi ya לֶחֶם na hapa ni nahau ya kikuhani kwa chakula kinachotolewa kwa Mungu; kudumisha “mkate” huhifadhi picha ya maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “mkate wa Mungu wake”
  choice: Kudumisha nahau halisi katika maandishi na kuifafanua kwa tanbihi
  alternative: chakula cha Mungu wake
  rationale: Nahau ya kikuhani huonyesha vitu vinavyotolewa kwa Mungu katika dhabihu. “Mkate” huhifadhi taswira na mvutano wa maandishi, huku tanbihi ikisaidia msomaji kuelewa maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “hatakaribia” na “kasoro” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa kisheria wa Kiebrania. Alama zote za tanbihi zimewekwa katika maandishi.
