  text: Basi Musa akawaambia Haruni, wanawe, na Waisraeli wote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “wana wa Israeli”; hili ni jina la agano linalotumiwa kwa kawaida kwa watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Basi Musa akawaambia
  rationale: Kiunganishi cha simulizi kinaendeleza na kuhitimisha sehemu hii. “Basi” linaonyesha matokeo ya maagizo yaliyotangulia, na “akawaambia” ni njia ya kawaida ya Kiswahili ya kueleza kwamba Musa alisema maneno kwa watu waliotajwa.
- source_word: אֶל
  choice: -wa- katika “akawaambia”
  rationale: Kihusishi hiki kinataja wale walioelekezewa maneno. Kiswahili cha kawaida huonyesha uhusiano huo kwa kiambishi cha yambwa katika kitenzi “akawaambia,” badala ya tafsiri ya neno kwa neno.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania ni wingi wa kiume wenye kiambishi cha nafsi ya tatu, likirejelea wana wa kiume wa Aroni. “Wanawe” ni fupi, la asili, na sahihi katika muktadha huu.
- source_word: כָּל
  choice: wote
  rationale: “Wote” linaonyesha kundi zima linalofuata na linapatana kisarufi na “Waisraeli.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa muundo wa Kiebrania ni “wana wa Israeli,” hapa ni jina la kawaida la agano kwa taifa lote. “Waisraeli” linaeleweka kwa urahisi katika Kiswahili cha sasa bila kudokeza kwamba ni wana wa kiume pekee; umbo halisi limehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya jina la kikundi cha agano בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Kirai hiki kwa kawaida hulitaja taifa zima, si wanaume pekee wala wana wa moja kwa moja wa Yakobo tu. “Waisraeli” linawasilisha maana ya kikundi kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi na umuhimu wake wa kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi” linafaa kwa hitimisho la sehemu, na “akawaambia” huepuka usemi usio wa kawaida wa kutafsiri אֶל neno kwa neno.
