review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition and permitted alternative. However, “mwanamke aliyeachwa” can mean a woman abandoned by her husband and does not reliably express the legal sense of גְרוּשָׁה, “a divorced woman.” “Aliyehesabiwa kuwa” adds an evaluative element not explicit in חֲלָלָה.
  naturalness: The legal register is generally natural, but “yeyote kati ya hawa” is less direct than listing the women as the Hebrew does. A coordinated list with “wala” is clearer and more idiomatic in Standard East African Swahili.
  terminology: Use “mwanamke aliyepewa talaka” for the divorced woman. Render חֲלָלָה as “mwanamke aliyetiwa unajisi,” retaining the priestly-status ambiguity without importing a particular cause. “Kahaba,” “bikira,” and “kutoka miongoni mwa watu wake mwenyewe” are suitable.
  issues:
  - severity: medium
    issue: “Mwanamke aliyeachwa” is ambiguous for גְרוּשָׁה.
    rationale: In current Swahili it may mean a woman deserted or left behind, whereas the Hebrew participle denotes a woman formally divorced. “Mwanamke aliyepewa talaka” preserves the legal-marital sense.
  - severity: medium
    issue: “Aliyehesabiwa kuwa” adds meaning to חֲלָלָה.
    rationale: The Hebrew identifies a woman as profaned/defiled in the relevant holiness-law category; it does not explicitly say that she was merely regarded or counted as such. A direct but suitably broad rendering is preferable.
  - severity: low
    issue: “Yeyote kati ya hawa” is an unnecessarily indirect rendering of the collective object.
    rationale: The source points back to the listed categories. Directly coordinating the list is clearer and maintains the legal style.
  revised_text: Asimwoe mjane, mwanamke aliyepewa talaka, mwanamke aliyetiwa unajisi[a], wala kahaba. Bali aoe bikira kutoka miongoni mwa watu wake mwenyewe.
  revised_footnotes:
  - marker: a
    text: Au “mwanamke aliyechafuliwa” au “mwanamke ambaye utakatifu wa hadhi yake umevunjwa.” Neno la Kiebrania linahusu mwanamke ambaye hadhi yake haikufaa chini ya sheria za utakatifu wa ukuhani.
    reason: lexical_alternative
  revision_rationale: The revision makes the divorce terminology legally precise, removes an added evaluative qualification from the difficult priestly-holiness term, and expresses the prohibited categories in a more direct and natural Swahili legal construction. The footnote preserves viable lexical alternatives and the source term’s contextual ambiguity.
