  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: sw
  text: Asimwoe mjane, mwanamke aliyepewa talaka, mwanamke aliyetiwa unajisi[a], wala kahaba. Bali aoe bikira kutoka miongoni mwa watu wake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanamke aliyechafuliwa” au “mwanamke ambaye utakatifu wa hadhi yake umevunjwa.” Neno la Kiebrania linahusu mwanamke ambaye hadhi yake haikufaa chini ya sheria za utakatifu wa ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa mwanamke ambaye mume wake amekufa.
- source_word: גְרוּשָׁה
  choice: mwanamke aliyeachwa
  rationale: Kirai hiki kinaonyesha mwanamke ambaye ndoa yake imevunjwa kwa kuachwa, na ni cha kawaida katika Kiswahili cha kisasa.
- source_word: חֲלָלָה
  choice: mwanamke aliyehesabiwa kuwa ametiwa unajisi[a]
  rationale: Katika sheria ya utakatifu wa ukuhani, neno hili linahusu hadhi iliyohesabiwa kuwa imenajisiwa au kuvunjiwa utakatifu. Kirai hiki kinaweka wazi kuwa ni hadhi katika muktadha huu, bila kudokeza lazima tukio la kushambuliwa kingono.
- source_word: זֹנָה
  choice: kahaba
  rationale: Ni neno la moja kwa moja na la sasa kwa mwanamke anayefanya ukahaba, bila kutumia lugha ya kizamani.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: Asimwoe yeyote kati ya hawa
  rationale: Kitenzi cha Kiebrania cha ‘kumchukua’ mwanamke kina maana ya kumwoa katika muktadha huu. Tafsiri hii ni ya kawaida kwa Kiswahili na inaonyesha kuwa makundi yote yaliyotajwa yamekatazwa.
- source_word: כִּי אִם
  choice: Bali
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya waliokatazwa na chaguo pekee linaloruhusiwa.
- source_word: בְּתוּלָה
  choice: bikira
  rationale: Hili ni neno sahihi na linaloeleweka kwa mwanamke ambaye hajafanya ngono katika muktadha wa sheria ya ndoa.
- source_word: מֵעַמָּיו
  choice: kutoka miongoni mwa watu wake mwenyewe
  rationale: Tafsiri hii inahifadhi wazo la asili kutoka ndani ya jamii ya watu wake.
- source_word: יִקַּח אִשָּׁה
  choice: amwoe
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza kumchukua mwanamke kuwa mke katika sheria hii ya ndoa.
theological_decisions:
- issue: Maana ya חֲלָלָה katika masharti ya ndoa ya kuhani mkuu
  choice: mwanamke aliyehesabiwa kuwa ametiwa unajisi
  alternative: mwanamke aliyetiwa unajisi; mwanamke ambaye utakatifu wa hadhi yake umevunjwa
  rationale: Neno la Kiebrania lina wazo la kuvunjiwa utakatifu au kuwa na hadhi isiyofaa kulingana na sheria ya utakatifu wa ukuhani. Tafsiri haibainishi zaidi chanzo cha hadhi hiyo kuliko maandishi yenyewe, na tanbihi huhifadhi njia mbadala za kuelewa istilahi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisheria lakini wa sasa na unaoeleweka. Muundo wa ‘asimwoe … bali amwoe’ unahifadhi nguvu ya agizo, huku ‘yeyote kati ya hawa’ ikiweka wazi rejeleo la orodha.
