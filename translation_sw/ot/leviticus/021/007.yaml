base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: sw
  text: Wasimwoe mwanamke kahaba au aliyenajisiwa[a], wala wasimwoe mwanamke aliyeachwa na mume wake, kwa maana yeye ni mtakatifu kwa Mungu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: aliyechafuliwa au aliyepoteza hadhi yake takatifu. Upeo mahususi wa neno la Kiebrania חֲלָלָה katika muktadha huu unajadiliwa.'
    reason: Huhifadhi utata wa kileksika wa חֲלָלָה bila kudokeza sababu au aina maalumu ya unajisi.
lexical_decisions:
- source_word: זֹנָה (zonah)
  choice: mwanamke kahaba
  rationale: Huwakilisha moja kwa moja mwanamke anayefanya ukahaba, kwa lugha ya kawaida na inayoeleweka.
- source_word: חֲלָלָה (chalalah)
  choice: aliyetiwa unajisi
  rationale: Neno linatokana na wazo la kunajisi au kuondoa hali takatifu; tafsiri hii huhifadhi maana pana bila kuibana kuwa kosa maalumu la kingono.
- source_word: יִקָּחוּ (yiqqachu)
  choice: wasimwoe
  rationale: Ingawa kitenzi kwa msingi ni ‘wasimchukue,’ katika muktadha wa kumchukua mwanamke kuwa mke maana ya kawaida ni ‘wasimwoe.’
- source_word: גְּרוּשָׁה מֵאִישָׁהּ (gerushah me'ishah)
  choice: mwanamke aliyeachwa na mume wake
  rationale: Huonyesha mwanamke ambaye ametalikiwa au kuondolewa na mume wake, huku ikifuata kwa karibu muundo wa Kiebrania.
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו (qadosh hu le'lohav)
  choice: yeye ni mtakatifu kwa Mungu wake
  rationale: Hudumisha badiliko la makusudi kutoka wingi kwenda umoja katika Kiebrania na uhusiano wa kuhani mmoja na Mungu wake.
theological_decisions:
- issue: Maana ya חֲלָלָה
  choice: aliyetiwa unajisi
  alternative: aliyetiwa unajisi wa kingono / aliyepoteza hadhi takatifu
  rationale: Maana halisi na upeo wa neno hili katika sheria ya ukuhani vinaweza kujadiliwa. Tafsiri kuu haifanyi dhana ya kingono kuwa ya pekee, wala haifuti wazo la kunajisiwa au kupoteza hadhi.
- issue: Badiliko kutoka makuhani kwa wingi kwenda kuhani kwa umoja
  choice: kwa maana yeye ni mtakatifu kwa Mungu wake
  alternative: kwa maana kuhani ni mtakatifu kwa Mungu wake
  rationale: Kiwakilishi cha Kiebrania ni cha umoja. Kukihifadhi huonyesha kwamba agizo la jumla linamhusu kila kuhani mmoja mmoja bila kuingiza nomino ambayo haipo katika kishazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. ‘Wasimwoe’ ni ya kawaida na sahihi katika muktadha wa ndoa; sentensi imehifadhi marudio na badiliko la wingi kwenda umoja la maandishi ya Kiebrania.
