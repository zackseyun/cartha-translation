lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Katika fomula hii ya kuanzisha hotuba mpya ya Mungu, kitenzi דבר kinaweza kutafsiriwa kwa Kiswahili cha kawaida na chenye heshima kuwa “akasema”; wakati uliopita wenye kiambishi “ka-” unaendeleza simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Kwa Kiswahili, muundo wa kawaida ni “alisema na [mtu]”; “na” hapa humtambulisha anayeambiwa bila kuiga sintaksia ya lugha chanzi.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: “Mose” ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: “Akisema” huhifadhi fomula rasmi ya Kiebrania inayoonyesha kuwa maneno ya hotuba yanafuata katika mstari unaofuata.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza mapokeo mengine ya kutafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo rasmi “akisema” umehifadhiwa kwa sababu hotuba yenyewe inaanza katika mstari unaofuata.
