  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: sw
  text: Anaweza kula chakula cha Mungu wake[a], kutoka katika vitu vitakatifu sana na katika vitu vitakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate wa Mungu wake.” Hapa “mkate” ni nahau inayomaanisha mafungu ya chakula ya kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa maana yake ya msingi ni “mkate,” katika muktadha huu wa ibada neno hilo linamaanisha kwa upana mafungu ya chakula ya kikuhani. “Chakula” huepuka wazo la mkate uliookwa pekee.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha Kiebrania ni cha umoja wa kiume na kinamrejelea kuhani; “Mungu wake” huhifadhi uhusiano wa umiliki katika matini.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: kutoka katika vitu vitakatifu sana
  rationale: Muundo huu wa Kiebrania unaonyesha daraja la juu kabisa la vitu vilivyowekwa wakfu. Tafsiri hii huhifadhi tofauti ya kiibada bila kuongeza neno “sadaka,” ambalo halijaandikwa moja kwa moja.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: na katika vitu vitakatifu
  rationale: Hili ni kundi jingine la vitu vilivyowekwa wakfu, tofauti na vile vitakatifu sana. Kurudia “vitakatifu” huhifadhi uhusiano wa msamiati wa mzizi קדש.
- source_word: יֹאכֵל
  choice: anaweza kula
  rationale: 'Katika sheria hii, kitenzi kinaonyesha ruhusa: licha ya mipaka iliyowekwa kwa kuhani mwenye dosari, bado ameruhusiwa kula mafungu matakatifu.'
theological_decisions:
- issue: Nguvu ya kitenzi יֹאכֵל katika sheria ya kikuhani
  choice: ruhusa (“anaweza kula”)
  alternative: wakati ujao (“atakula”) au wajibu (“atalazimika kula”)
  rationale: Muktadha unatofautisha mambo ambayo kuhani mwenye dosari haruhusiwi kufanya na haki yake inayoendelea ya kula mafungu matakatifu. Tafsiri ya ruhusa huhifadhi tofauti hiyo bila kuifanya kuwa amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Anaweza” limetumiwa kuonyesha ruhusa ya kisheria, si uwezo wa kimwili. “Vitu vitakatifu sana” na “vitu vitakatifu” huhifadhi makundi mawili ya utakatifu katika sheria za ibada.
