  text: 'isipokuwa kwa ajili ya jamaa yake[a] wa karibu: kwa mama yake, kwa baba yake, kwa mwanawe wa kiume, kwa binti yake, na kwa ndugu yake wa kiume—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שְׁאֵר kwa maana halisi lina wazo la “nyama,” na pia humaanisha mtu wa ukoo; kwa hiyo “jamaa yake” pia ingeweza kutafsiriwa “jamaa yake wa damu” au “ndugu yake wa mwili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: isipokuwa kwa
  rationale: Katika sheria hii, kirai hiki kinaweka jambo linaloruhusiwa kinyume na katazo la mstari uliotangulia; “isipokuwa kwa” kinaonyesha wazi maana hiyo.
- source_word: שְׁאֵרוֹ
  choice: jamaa yake
  rationale: Neno hili lina maana ya mtu wa ukoo, likiwa na wazo la msingi la “nyama.” “Jamaa yake” ni Kiswahili cha kawaida kinachoeleweka, huku tanbihi ikihifadhi taswira halisi na uwezekano wa “jamaa wa damu.”
- source_word: הַקָּרֹב אֵלָיו
  choice: aliye karibu naye
  rationale: Kirai hiki kinaeleza ukaribu wa kiukoo. Tafsiri hii inahifadhi wazo la ukaribu bila kulifanya kwa lazima kuwa cheo kamili cha “aliye karibu zaidi,” jambo ambalo Kiebrania halitamki wazi.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: kwa mama yake, kwa baba yake, kwa mwanawe wa kiume, kwa binti yake, na kwa ndugu yake wa kiume
  rationale: Kurudia “kwa” kunawakilisha mfululizo wa viambishi לְ katika orodha ya Kiebrania na kuweka wazi wale ambao kwa sababu yao ruhusa inatolewa. “Mwanawe wa kiume” na “ndugu yake wa kiume” zinahifadhi jinsia ya maneno ya Kiebrania katika orodha hii ya kisheria.
