source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: sw
  text: Mnapovuna mavuno ya nchi yenu, msivune kabisa ukingo wa mashamba yenu[a], wala msiokote masazo ya mavuno yenu; myaache kwa ajili ya maskini na mgeni mkazi[b]. Mimi ni Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembe ya shamba.” Neno la Kiebrania linaweza kumaanisha ukingo, upande, au pembe.
    reason: lexical_alternative
  - marker: b
    text: Au, “mgeni mkazi.” Neno la Kiebrania humaanisha mtu asiye Mwisraeli anayeishi miongoni mwa Waisraeli na aliye chini ya ulinzi wa sheria zao za kijamii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: Mnapovuna mavuno ya nchi yenu
  rationale: Infinitivu yenye בְּ inaonyesha wakati wa tendo. Kiswahili hiki ni cha kawaida na kinadumisha wingi wa kiambishi cha Kiebrania.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ
  choice: usiuvune kabisa ukingo wa shamba lako
  rationale: Kitenzi כלה katika kausativi hapa kina maana ya kumaliza au kukamilisha, na פאה ni sehemu ya mwisho, ukingo, au pembe ya shamba. Tafsiri hii inaonyesha kuwa ukingo haupaswi kuvunwa wote.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: wala usiokote masazo ya mavuno yako
  rationale: לקט hutaja mabaki yaliyotawanyika au kuanguka wakati wa mavuno ambayo yangeokotwa baadaye. “Masazo” na “usiokote” zinaeleza tendo hilo kwa Kiswahili kinachoeleweka.
- source_word: לֶעָנִי
  choice: kwa ajili ya maskini
  rationale: עני hapa humaanisha mtu maskini au mwenye uhitaji katika sheria ya kijamii.
- source_word: וְלַגֵּר
  choice: na mgeni mkazi
  rationale: גר ni mtu asiye mzawa anayeishi miongoni mwa Israeli. “Mgeni mkazi” ni wazi zaidi kuliko “mgeni” peke yake na haileti dhana za kisasa zisizokuwamo katika neno.
- source_word: תַּעֲזֹב אֹתָם
  choice: Utayaacha
  rationale: עזב hapa ni kuyaacha mabaki kwa wengine, si kuachana nayo kwa maana ya kihisia. Kiambishi “-ya-” kinarejelea masazo.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Mimi ni Yahwe, Mungu wenu
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahwe,” na kiambishi cha wingi katika אֱלֹהֵיכֶם kimehifadhiwa kwa “wenu.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu lenye konsonanti YHWH; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya גר katika sheria ya Israeli
  choice: mgeni mkazi
  alternative: mgeni
  rationale: Neno hili linamhusu mtu asiye mzawa lakini anayeishi miongoni mwa jamii na kulindwa na sheria zake; tafsiri iliyochaguliwa inahifadhi hali hiyo ya kijamii bila kuibana katika istilahi za kisasa za uhamiaji.
- issue: Mabadiliko kutoka wingi kwenda umoja katika maagizo
  choice: “Mnapovuna… yenu,” kisha “usiuvune… lako… yako,” na mwisho “Mungu wenu”
  alternative: Kutumia wingi katika aya yote
  rationale: Kiebrania hubadilika kutoka wingi katika mazingira ya mwanzo kwenda umoja katika maagizo, kisha hurudi kwa wingi katika kauli ya mwisho. Tafsiri imehifadhi mabadiliko hayo badala ya kuyasawazisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Masazo” linaweka wazi mabaki ya mavuno yanayoachwa yaokotwe, na “mgeni mkazi” linafafanua hadhi ya גר bila kutumia lugha nzito ya kisheria.
