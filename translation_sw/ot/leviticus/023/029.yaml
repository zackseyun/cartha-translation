  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: sw
  text: Kwa maana kila mtu ambaye hatajinyenyekeza katika siku hii hii atakatiliwa mbali na watu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatajitesa.” Nahau ya Kiebrania inahusu kujinyima au kujinyenyekeza, na kwa kawaida imehusishwa na kufunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya amri iliyotangulia na inafaa mtiririko wa maelezo ya kisheria.
- source_word: כָל הַנֶּפֶשׁ
  choice: mtu yeyote
  rationale: Neno נֶפֶשׁ hapa humaanisha mtu binafsi, si ‘nafsi’ kama sehemu isiyo ya mwili; Kiswahili hiki ni cha kawaida na jumuishi.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: ambaye hatajinyenyekeza
  rationale: Katika muktadha wa Siku ya Upatanisho, kitenzi kina maana ya mtu kujitesa, kujinyima, au kujinyenyekeza; ‘kujinyenyekeza’ huonyesha hali ya toba bila kuifanya iwe mateso ya mwili pekee.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: siku hii hasa
  rationale: Kirai hiki kinakazia siku yenyewe; ‘hasa’ huhifadhi msisitizo huo kwa Kiswahili cha asili.
- source_word: וְנִכְרְתָה
  choice: atakatiliwa mbali
  rationale: Huhifadhi uzito wa fomula ya hukumu ya agano bila kubainisha kama adhabu hiyo ni kifo, kufukuzwa, au hukumu ya Mungu.
- source_word: מֵעַמֶּיהָ
  choice: na watu wake
  rationale: Kiambishi cha Kiebrania ni cha kike kisarufi kwa sababu ya נֶפֶשׁ, lakini kinamrejelea mtu yeyote; Kiswahili hakihitaji kuingiza jinsia hapa.
theological_decisions:
- issue: Maana ya amri ya Siku ya Upatanisho ya mtu ‘kujitesa/kujinyenyekeza’
  choice: kujinyenyekeza
  alternative: kujitesa; kujinyima
  rationale: Tafsiri hii huwasilisha hali ya toba na unyenyekevu iliyo katika nahau hiyo, huku tanbihi ikihifadhi tafsiri rasmi zaidi na uhusiano wake wa jadi na kufunga.
- issue: Asili ya adhabu ya ‘kukatiliwa mbali’
  choice: atakatiliwa mbali na watu wake
  alternative: ataondolewa miongoni mwa watu wake; atatengwa na watu wake
  rationale: Kiebrania hakitaji wazi utaratibu wa adhabu; fomula hii inadumisha uzito na utata wa matini bila kuamua kama ni kufukuzwa, kifo, au hukumu ya moja kwa moja ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Atakatiliwa mbali’ limechaguliwa ili kuhifadhi fomula nzito ya kisheria ya Kiebrania; alama ya tanbihi [a] imewekwa katika matini.
