  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: sw
  text: '“Sema na wana wa Israeli, uwaambie: Mtakapofika katika nchi ninayowapa, na mtakapovuna mavuno yake, mtamletea kuhani mganda wa malimbuko ya mavuno yenu.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “omeri ya malimbuko ya mavuno yenu.” Neno la Kiebrania hapa linaweza kumaanisha mganda, na pia hutumiwa kama istilahi ya kiufundi “omeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi nahau ya Kiebrania na umbo lake la kiume la wingi; katika Kiswahili cha kibiblia ni kauli yenye heshima na inayoeleweka.
- source_word: כִּי תָבֹאוּ
  choice: mtakapofika
  rationale: כִּי hapa huanzisha hali ya wakati ambapo amri itaanza kutumika; muundo wa -takapo- ni wa asili na hauongezi maana ya sababu.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Neno hili linarejelea nchi ambayo Mungu anawapa Israeli; “nchi” ni tafsiri ya kawaida na ya asili katika muktadha huu.
- source_word: נֹתֵן
  choice: ninayowapa
  rationale: Huwakilisha tendo la Mungu linaloendelea au lililo karibu kutimizwa, huku kiambishi -wa- kikirejelea wale wanaosemeshwa.
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: na mtakapovuna mavuno yake
  rationale: Huhifadhi uhusiano wa kitenzi na nomino wa mzizi mmoja katika Kiebrania, na “yake” huirejelea nchi.
- source_word: וַהֲבֵאתֶם
  choice: mtamletea
  rationale: Wakati ujao wa Kiswahili unaonyesha hatua inayofuata baada ya hali iliyotajwa; kiambishi -m- humrejelea kuhani bila kubadili anayepokea kitu hicho.
- source_word: עֹמֶר
  choice: mganda
  rationale: Katika muktadha wa mavuno, neno hili linaweza kumaanisha mganda wa nafaka unaoletwa kwa kuhani; maana ya istilahi “omeri” imehifadhiwa katika tanbihi.
- source_word: רֵאשִׁית
  choice: malimbuko
  rationale: “Malimbuko” huonyesha sehemu ya kwanza ya mavuno yenye umuhimu wa kiibada, badala ya mwanzo wa kawaida tu.
- source_word: קְצִירְכֶם
  choice: mavuno yenu
  rationale: Hudumisha istilahi ya kilimo na kurejelea mavuno ya watu wanaosemeshwa.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hii ndiyo tafsiri sanifu ya כֹּהֵן katika sheria za ibada.
theological_decisions:
- issue: Wanaosemeshwa katika agano
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Kiebrania kina umbo la kiume la wingi katika kauli ya kawaida ya agano. Tafsiri kuu huhifadhi umbo hilo badala ya kulifanya lisitaje jinsia.
- issue: Istilahi ya ibada עֹמֶר
  choice: mganda
  alternative: omeri
  rationale: Muktadha unaeleza kitu cha mavuno kinacholetwa kwa kuhani, hivyo maana halisi ya “mganda” inafaa katika matini kuu; uwezekano wa istilahi ya kiufundi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. Muundo wa -takapo- unaonyesha wazi hali ya wakati, na msamiati “mganda,” “malimbuko,” na “kuhani” unafaa mazingira ya kilimo na ibada.
