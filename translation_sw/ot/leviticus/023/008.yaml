base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: sw
  text: Nanyi mtamtolea Yahweh sadaka inayotolewa kwa moto kwa siku saba. Siku ya saba kutakuwa na kusanyiko takatifu; msifanye kazi yoyote ya kawaida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: mtamtolea
  rationale: Hifili ya קרב katika muktadha wa dhabihu ina maana ya kuleta au kutoa sadaka; “mtamtolea” ni Kiswahili cha kawaida kinachoonyesha tendo na anayepokea sadaka.
- source_word: אִשֶּׁה
  choice: sadaka ya kuteketezwa kwa moto
  rationale: Neno hili la kikuhani humaanisha sadaka inayotolewa kwa moto. Tafsiri hii inahifadhi kiini cha moto bila kulifanya kuwa “sadaka ya chakula,” maana ambayo si wazi moja kwa moja hapa.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kiambishi ל kinaonyesha kwamba sadaka inaelekezwa au kuwekwa wakfu kwa Yahweh; muundo wa kitenzi “mtamtolea” unajumuisha uhusiano huo kiasili.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Huonyesha muda ambao sadaka hizo zitatolewa.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Siku ya saba
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa wakati katika Kiswahili.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Usemi huu wa sikukuu unamaanisha mkusanyiko mtakatifu ulioitishwa rasmi; “kusanyiko takatifu” ni wazi na wenye hadhi.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Kirai hiki kinakataa kazi ya kawaida ya shughuli au ajira, si kila tendo linalowezekana. Tafsiri hii huepuka “kazi ya utumwa,” ambayo inaweza kupotosha.
- source_word: לֹא תַעֲשׂוּ
  choice: msifanye
  rationale: Ni amri hasi ya nafsi ya pili wingi, iliyotolewa kwa Kiswahili cha sasa na cha moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Kiebrania limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Upeo wa katazo la kazi
  choice: kazi yoyote ya kawaida
  alternative: kazi yoyote nzito au kazi yoyote ya utumishi
  rationale: כָּל מְלֶאכֶת עֲבֹדָה ni istilahi ya siku za sikukuu inayolenga kazi ya kawaida ya shughuli; tafsiri haipaswi kupanua katazo kuwa kila aina ya tendo wala kulihusisha tu na utumwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa wakati ujao umehifadhi nguvu ya maagizo ya kifungu, na istilahi za ibada zimetolewa kwa uwazi bila lugha ya kizamani.
