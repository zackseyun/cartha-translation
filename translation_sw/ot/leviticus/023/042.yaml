  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: sw
  text: Mtakaa katika vibanda kwa siku saba[a]; kila mzawa katika Israeli atakaa katika vibanda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika makao” au “katika vibanda vya muda”; neno la Kiebrania linamaanisha makao ya muda ya sikukuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: katika vibanda
  rationale: Neno סֻכּוֹת linamaanisha vibanda au makao ya muda yaliyotumiwa katika sikukuu. “Vibanda” linahifadhi picha halisi ya miundo hiyo na linaeleweka katika Kiswahili cha sasa.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: mtakaa / atakaa
  rationale: Katika muktadha wa makao, kitenzi ישׁב humaanisha kukaa au kuishi mahali. “Kukaa” ni cha kawaida na kinafaa kwa agizo la kukaa vibandani kwa muda wa siku saba.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kirai hiki kinaonyesha muda ambao kukaa huko kunapaswa kuendelea; “kwa siku saba” ni usemi wa kawaida wa Kiswahili.
- source_word: כָּל הָאֶזְרָח
  choice: kila mzawa
  rationale: אֶזְרָח humtaja mtu wa jamii hiyo kwa kuzaliwa, tofauti na mgeni anayeishi humo. “Mzawa” huepuka kuingiza dhana za kisasa za uraia na halazimishi maana iwe ya wanaume pekee.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Tafsiri hii ya moja kwa moja inaonyesha jamii au eneo ambamo mzawa huyo anahesabiwa.
theological_decisions:
- issue: Upeo wa הָאֶזְרָח, nomino ya kiume yenye maana wakilishi
  choice: kila mzawa
  alternative: kila mwanamume mzawa
  rationale: Ingawa nomino ya Kiebrania ina umbo la kiume katika umoja, hapa ina nguvu ya uwakilishi wa jumla. “Kila mzawa” huhifadhi upeo huo bila kuweka kizuizi cha wanaume ambacho kifungu hakisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “katika vibanda” umehifadhiwa kwa sababu upo katika Kiebrania na unasisitiza agizo.
