base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: sw
  text: 'Hizi ndizo nyakati zilizowekwa za BWANA, ambazo mtazitangaza kuwa mikusanyiko mitakatifu, ili kumtolea BWANA sadaka itolewayo kwa moto: sadaka ya kuteketezwa na sadaka ya nafaka, dhabihu na sadaka za kinywaji, matakwa ya kila siku kwa siku yake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: nyakati zilizowekwa
  rationale: Neno hili humaanisha nyakati maalumu zilizoteuliwa; tafsiri hii ni ya asili katika Kiswahili na huhifadhi wazo la ratiba iliyoamuliwa.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi ya kawaida ya tafsiri za Biblia za Kiswahili ya kuwakilisha jina la Mungu kwa BWANA kwa herufi kubwa.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: mikusanyiko mitakatifu
  rationale: Katika muktadha huu, mikra’ humaanisha mikutano iliyoitishwa, si tangazo pekee; kauli hii inaeleweka kwa wasomaji wa sasa.
- source_word: אִשֶּׁה
  choice: sadaka ya chakula
  rationale: Istilahi hii ya kiibada huelekea kumaanisha sadaka inayotolewa kwa BWANA, kwa kawaida kwa moto. 'Sadaka ya chakula' hufuata ushahidi wa kimuktadha bila kudai kwamba moto ndio maana kamili ya neno lenyewe.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi ya kawaida na sahihi kwa sadaka inayoteketezwa yote madhabahuni.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za Walawi, neno hili humaanisha kwa kawaida sadaka inayotokana na nafaka.
- source_word: נְסָכִים
  choice: sadaka za kinywaji
  rationale: Wingi wa Kiebrania umehifadhiwa, na kauli hii ni istilahi inayoeleweka kwa matoleo ya kioevu.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: kila siku kadiri ilivyoamriwa kwa siku hiyo
  rationale: Nahau hiyo inaonyesha kwamba matoleo ya kila siku yatolewe kwa utaratibu unaohusu siku husika; tafsiri ya neno kwa neno 'jambo la siku katika siku yake' si ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya אִשֶּׁה
  choice: sadaka ya chakula
  alternative: sadaka itolewayo kwa moto
  rationale: Uchaguzi huu huhifadhi lugha ya kiibada ya sadaka inayotolewa kwa Mungu na huepuka kuifanya 'moto' kuwa ufafanuzi kamili wa neno, ingawa moto ni sehemu muhimu ya namna ya kuitoa.
- issue: Uwakilishi wa jina la Mungu
  choice: BWANA
  alternative: YHWH / Yahwe
  rationale: BWANA ni uwakilishi wa heshima uliozoeleka katika Biblia za Kiswahili; herufi kubwa huonyesha kwamba chanzo kina jina maalumu la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo wa orodha ya sadaka umehifadhiwa, huku nahau ya mwisho ikitafsiriwa kwa Kiswahili cha kawaida.
