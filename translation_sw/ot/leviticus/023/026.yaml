  yaml_path: translation/ot/leviticus/023/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: 'Yahwe[a] akamwambia Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; jina hili pia huandikwa “Yahweh” au “Yehova.”'
    reason: Usomaji mbadala na ufafanuzi wa jina la Mungu.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akamwambia
  rationale: Kitenzi דבר katika kauli hii ya utangulizi kinaonyesha tukio jipya la Mungu kusema. “Akamwambia” ni Kiswahili cha sasa na cha kawaida, na pamoja na dondoo kinatambulisha moja kwa moja maneno yanayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina la pekee lililo katika matini ya Kiebrania.
- source_word: אֶל
  choice: -mw- katika “akamwambia”
  rationale: Kihusishi אֶל kinachoonyesha anayeelekezewa usemi kimewakilishwa kwa kiambishi cha yambwa “-mw-,” ambacho ni muundo wa asili wa Kiswahili.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida na linalotambulika la jina משה katika Kiswahili.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Kiswahili cha kawaida hakihitaji kurudia “akisema” baada ya “akamwambia.” Dondoo linaonyesha kuwa maneno ya moja kwa moja yanafuata na hivyo linawasilisha kazi ya לֵאמֹר kwa ufasaha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ina jina la Mungu יהוה, si cheo. “Yahwe” hulihifadhi kama jina la pekee; tanbihi inaonyesha umbo la herufi za Kiebrania na namna nyingine inayotumiwa kuliandika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi na chenye heshima. Muundo wa Kiebrania “alisema ... akisema” umeelezwa kwa “akamwambia ...:” ili kuepuka urudiaji usio wa kawaida katika Kiswahili huku kazi ya utangulizi wa usemi ikihifadhiwa.
