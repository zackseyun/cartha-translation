  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: sw
  text: Na siku ya kumi na tano ya mwezi huu ni Sikukuu ya Mikate Isiyotiwa Chachu kwa Yahweh[a]. Kwa siku saba mtakula mikate isiyotiwa chachu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ya Yahweh.” Kiambishi awali cha Kiebrania kinaweza kuonyesha wakfu au uhusiano wa kuwa ya Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר יוֹם
  choice: Na siku ya kumi na tano
  rationale: Hutoa tarehe ya mwezi kwa Kiswahili cha kawaida huku ikihifadhi kiunganishi וּ na neno יוֹם.
- source_word: לַ/חֹדֶשׁ הַ/זֶּה
  choice: ya mwezi huu
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kutaja siku fulani ndani ya mwezi unaozungumziwa.
- source_word: חַג הַ/מַּצּוֹת
  choice: Sikukuu ya Mikate Isiyotiwa Chachu
  rationale: חַג ni sikukuu ya kidini, na הַמַּצּוֹת hapa ni jina la sikukuu. Wingi wa 'mikate' unaakisi umbo la Kiebrania na ni wa kawaida katika jina hili.
- source_word: לַ/יהוָה
  choice: kwa ajili ya Yahweh
  rationale: Yahweh huhifadhi jina la agano יהוה, na 'kwa ajili ya' huonyesha uhusiano wa kuwekwa wakfu au kuelekezwa kwake bila kuufanya kuwa umiliki tu.
- source_word: שִׁבְעַת יָמִים
  choice: Kwa siku saba
  rationale: Kirai hiki huonyesha muda ambao agizo la kula linadumu.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Hutaja aina ya mikate bila chachu na kuhifadhi wingi wa nomino ya Kiebrania.
- source_word: תֹּאכֵלוּ
  choice: mtakula
  rationale: Wakati ujao wa Kiswahili katika muktadha huu wa sheria hubeba nguvu ya agizo kwa wingi bila kuongeza ukali usiokuwapo katika chanzo.
theological_decisions:
- issue: Uwakilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kina jina maalumu la Mungu, יהוה. 'Yahweh' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kiambishi ל katika לַיהוָה
  choice: kwa ajili ya Yahweh
  alternative: ya Yahweh
  rationale: Kiambishi kinaweza kuonyesha kuwekwa wakfu au uhusiano wa kuwa mali ya Yahweh. Tafsiri kuu ni ya kawaida kwa Kiswahili, na tanbihi huhifadhi uwezekano wa pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Jina la sikukuu limeandikwa kwa herufi kubwa; chakula chenyewe katika sentensi ya pili kimeandikwa kwa herufi ndogo.
