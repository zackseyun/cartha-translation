id: LEV.23.18
reference: Leviticus 23:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Pamoja na mikate hiyo mtamtolea Yahweh wanakondoo dume saba wenye umri wa mwaka mmoja, wasio na dosari, fahali mmoja kutoka kundini, na kondoo dume wawili. Watakuwa sadaka ya kuteketezwa kwa Yahweh, pamoja na sadaka yao ya nafaka na sadaka zao za kinywaji—sadaka inayotolewa kwa moto[a], yenye harufu ya kumpendeza Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya moto.” Neno la Kiebrania linamaanisha sadaka inayotolewa kwa moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: mtamtolea
  rationale: Hifili ya קרב katika muktadha wa dhabihu humaanisha kuleta karibu au kuwasilisha kama toleo; “mtamtolea” ni Kiswahili cha kawaida kinachoonyesha tendo la ibada na mpokeaji wake.
- source_word: עַל הַלֶּחֶם
  choice: Pamoja na mikate hiyo
  rationale: עַל hapa inaonyesha kuambatana au kuongezwa kwa matoleo ya wanyama kwa mikate iliyotajwa, si kuwekwa kimwili juu yake.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: wanakondoo dume saba wenye umri wa mwaka mmoja, wasio na dosari
  rationale: Kifungu kinataja idadi, jinsia inayodokezwa na umbo la kiume, umri, na hali inayotakiwa kwa wanyama wa dhabihu.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: fahali mmoja kutoka kundini
  rationale: פַר בֶּן־בָּקָר ni fahali wa ng’ombe; tafsiri hii haibani isivyohitajika kiwango kamili cha umri.
- source_word: וְאֵילִם שְׁנָיִם
  choice: na kondoo dume wawili
  rationale: אַיִל humaanisha kondoo dume aliyekomaa; usemi huu ni wazi kwa wasomaji wa Kiswahili.
- source_word: יִהְיוּ עֹלָה לַיהוָה
  choice: Watakuwa sadaka ya kuteketezwa kwa Yahweh
  rationale: עֹלָה ni istilahi ya sadaka inayoteketezwa kabisa; umoja wake unafanya kazi kwa maana ya jumla kuhusu wanyama wote waliotajwa.
- source_word: וּמִנְחָתָם
  choice: pamoja na sadaka yao ya nafaka
  rationale: מִנְחָה katika sheria za dhabihu ni sadaka ya nafaka inayoambatana na sadaka ya kuteketezwa.
- source_word: וְנִסְכֵּיהֶם
  choice: na sadaka zao za kinywaji
  rationale: נֶסֶךְ ni toleo la kinywaji linalomiminwa; “sadaka za kinywaji” ni wazi kuliko istilahi ya kitaalamu “libationi.”
- source_word: אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Neno hili hurejelea toleo linalofanywa kwa moto; tafsiri hii huhifadhi moja kwa moja kipengele cha moto bila kuingiza maana ya “chakula” ambayo si ya hakika katika neno lenyewe.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Nahau hiyo inaonyesha harufu yenye kukubalika au kupendeza kwa Yahweh; usemi huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya moja kwa moja kama “Yahweh,” kulingana na ushahidi wa matini.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina Tetragramatoni yenyewe; “Yahweh” huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Maana ya אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Chaguo hili huhifadhi uhusiano ulio wazi zaidi wa neno na moto na huepuka kuamua mjadala wa kileksika kwa kuingiza dhana ya chakula.
- issue: Nguvu ya רֵיחַ נִיחֹחַ
  choice: harufu ya kumpendeza Yahweh
  alternative: harufu ya kutuliza kwa Yahweh
  rationale: “Kumpendeza” huwasilisha kukubalika kwa sadaka bila kudai kwamba Mungu alihitaji kutulizwa kihisia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko ya ibada. “Wanakondoo dume” hutofautisha wanyama hao na “kondoo dume” waliokomaa; “mikate hiyo” hurejelea mikate iliyotajwa katika muktadha uliotangulia. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
