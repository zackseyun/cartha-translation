base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: sw
  text: Haya ni mbali na Sabato za Yahwe[a], mbali na zawadi zenu, mbali na nadhiri zenu zote, na mbali na sadaka zenu zote za hiari, ambazo mtampa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pamoja na.” Kirai “mbali na” kimerudiwa katika kila sehemu ya orodha hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: zaidi ya
  rationale: Katika muktadha huu, kirai hiki kinaonyesha kwamba mambo yaliyotajwa yanaongezwa juu ya mahitaji ya sikukuu; “zaidi ya” ni ya kawaida katika Kiswahili na inaweza kurudiwa kama katika Kiebrania.
- source_word: שַׁבְּתֹת יְהוָה
  choice: Sabato za Yahwe
  rationale: “Sabato” linaakisi wingi wa Kiebrania, na muundo “za Yahwe” unahifadhi uhusiano wa moja kwa moja na jina la Mungu.
- source_word: מַתְּנוֹתֵיכֶם
  choice: zawadi zenu
  rationale: Neno hili linamaanisha vitu vinavyotolewa kama zawadi; tafsiri hii ni pana na haiongezi aina maalumu ya sadaka isiyotajwa.
- source_word: כָּל נִדְרֵיכֶם
  choice: nadhiri zenu zote
  rationale: “Nadhiri” huhifadhi maana ya ahadi nzito kwa Mungu bila kuamua kimyakimya kama neno hilo linamaanisha ahadi yenyewe au kitu kilichoahidiwa.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: sadaka zenu zote za hiari
  rationale: Katika muktadha wa ibada na dhabihu, neno hili humaanisha sadaka inayotolewa kwa hiari.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: ambazo mtampa Yahwe
  rationale: Kitenzi נתן kimetafsiriwa kwa maana yake ya kawaida, “kumpa”; wakati ujao unafaa muktadha wa maagizo na kiwakilishi cha uhusiano kinaelekezwa kwa orodha ya vitu vinavyotolewa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano katika שַׁבְּתֹת יְהוָה
  choice: Sabato za Yahwe
  alternative: Sabato za BWANA
  rationale: Muundo huu unahifadhi kwa urahisi na bila kuongeza ufafanuzi wazo la Sabato zinazomhusu au kumilikiwa na Yahwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Kurudiwa kwa “zaidi ya” kunahifadhi msisitizo na muundo wa Kiebrania. “Haya ni” huunganisha kipande hiki cha sentensi na masharti yaliyotangulia katika aya ya 37.
