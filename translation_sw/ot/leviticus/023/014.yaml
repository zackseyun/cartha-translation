  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: sw
  text: Msile mkate, wala nafaka iliyokaangwa[a], wala nafaka mpya[b], hadi siku hii hasa, hadi mtakapokuwa mmeleta sadaka ya Mungu wenu. Hili ni agizo la kudumu[c] katika vizazi vyenu vyote, katika makao yenu yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafaka iliyookwa kwa moto.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nafaka ya mavuno mapya.”
    reason: lexical_alternative
  - marker: c
    text: Au, “agizo la milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: mkate
  rationale: Neno hili kwa kawaida humaanisha mkate; katika muktadha huu linatajwa pamoja na aina nyingine za nafaka, hivyo maana halisi ya mkate inafaa kuliko neno pana kama “chakula”.
- source_word: קָלִי
  choice: nafaka iliyokaangwa
  rationale: Linamaanisha nafaka iliyotayarishwa kwa kuokwa au kukaangwa kwa moto. Kauli hii ni ya kawaida na inaeleweka kwa wasomaji wa sasa.
- source_word: כַרְמֶל
  choice: nafaka mpya
  rationale: Katika orodha hii neno linarejelea nafaka mpya au masuke mabichi ya mavuno mapya, wala si jina la mahali Karmeli.
- source_word: לֹא תֹאכְלוּ
  choice: msile
  rationale: Muundo hasi katika sheria unatoa katazo. “Msile” ni katazo la moja kwa moja, la asili, na lenye uzito wa kisheria katika Kiswahili.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: mpaka siku hii hasa
  rationale: עֶצֶם linatilia mkazo siku yenyewe; “hasa” huwasilisha msisitizo huo kwa lugha ya kawaida.
- source_word: עַד הֲבִיאֲכֶם
  choice: mpaka mtakapokuwa mmeleta
  rationale: Muundo huu unaonyesha tendo la kuleta sadaka kama sharti linalopaswa kutimizwa kwanza; wakati timilifu huonyesha kukamilika kwake.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: sadaka ya Mungu wenu
  rationale: “Sadaka” ni neno pana linalofaa kwa קָרְבָּן bila kubainisha aina fulani ya dhabihu. Muundo wa umilikaji unahifadhi uhusiano wa maneno ya Kiebrania bila kuongeza maelezo yasiyokuwapo.
- source_word: חֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: Kauli hii huonyesha amri yenye nguvu inayoendelea. “Agizo la kudumu” ni ya sasa na inayoeleweka, huku ikidumisha uzito wa lugha ya sheria.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Kauli hii huonyesha mwendelezo katika vizazi vinavyofuatana.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: katika makao yenu yote
  rationale: Hurejelea kila mahali ambapo watu wanaishi. Tafsiri hii inahifadhi mtindo rasmi wa sheria na bado inaeleweka.
theological_decisions:
- issue: Nguvu na muda wa חֻקַּת עוֹלָם katika sheria ya Musa
  choice: agizo la kudumu
  alternative: agizo la milele
  rationale: Tafsiri inadumisha nguvu ya wajibu unaoendelea katika mfumo wa agano na sheria ya Walawi, bila kuamua mjadala mpana wa kitheolojia kuhusu matumizi yake nje ya muktadha huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi [a], [b], na [c] zimewekwa mara baada ya maneno yanayohusika.
