  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: sw
  text: Hizi ndizo nyakati zilizowekwa za Yahweh[a], makusanyiko matakatifu[b], ambayo mtaitangaza kwa nyakati zao zilizowekwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majira yaliyowekwa” au “sikukuu zilizowekwa.” Neno la Kiebrania מוֹעֲדֵי ni pana kuliko karamu za sikukuu pekee; linamaanisha nyakati alizoweka Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Au “mikutano mitakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Huanzisha kwa uwazi orodha inayofuata; Kiswahili cha kawaida huhitaji kiunganishi hiki katika sentensi ya utambulisho.
- source_word: מוֹעֲדֵי
  choice: nyakati zilizowekwa
  rationale: מוֹעֵד humaanisha wakati au mkutano uliowekwa. Katika Walawi 23 ni pana kuliko sikukuu pekee, kwa hiyo tafsiri hii inadumisha mkazo wa wakati na urudiaji wa neno hilo mwishoni mwa aya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: mikutano mitakatifu
  rationale: Kirai hiki hueleza mikusanyiko iliyoitishwa na kutengwa kuwa mitakatifu; 'mikutano mitakatifu' ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Huanzisha kishazi tegemezi kinachoeleza mikutano au nyakati hizo.
- source_word: תִּקְרְאוּ
  choice: mtaitangaza
  rationale: Katika muktadha huu קרא ni kutangaza hadharani au kuitisha rasmi, si kutoa jina tu.
- source_word: אֹתָם
  choice: -i- katika mtaitangaza
  rationale: Kiambishi cha yambwa kinarejelea 'mikutano,' nomino ya ngeli ya 4 katika wingi.
- source_word: בְּמוֹעֲדָם
  choice: kwa nyakati zake zilizowekwa
  rationale: Hueleza kwamba kila mkutano utangazwe wakati wake unaofaa; pia inadumisha urudiaji wa dhana ya מוֹעֵד.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu moja kwa moja; 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya 'nyakati zilizowekwa' na 'mikutano mitakatifu'
  choice: Kudumisha virai vyote kwa mpangilio wa apposition bila kuvifanya viwe vitu viwili tofauti kabisa
  alternative: Kuweka 'yaani' kati ya virai hivyo
  rationale: Kiebrania kinaweka virai hivyo sambamba bila kiunganishi kinachofafanua kikamilifu uhusiano wake. Kuacha 'yaani' kunadumisha mvutano huo wa kimuundo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo na urudiaji wa 'nyakati zilizowekwa' vinatunza mshikamano wa Kiebrania; alama zote za tanbihi zimewekwa katika maandishi.
