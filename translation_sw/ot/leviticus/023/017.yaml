id: LEV.23.17
reference: Leviticus 23:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: sw
  text: Kutoka makao yenu mtaleta mikate miwili ya sadaka ya kutikiswa; itengenezwe kwa sehemu mbili za kumi za efa[a] za unga laini, na iokwe kwa chachu[b], kuwa malimbuko kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “sehemu mbili za kumi”; katika vipimo vya kikuhani hii ni sehemu mbili za kumi za efa.
    reason: cultural_note
  - marker: b
    text: Au, “iokwe kuwa mikate yenye chachu.” Kiebrania kinasema wazi kwamba mikate hii ya malimbuko huokwa ikiwa na chachu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: Kutoka katika makao yenu
  rationale: מוֹשָׁב humaanisha mahali pa kukaa au makazi; “makao yenu” ni Kiswahili cha kawaida chenye hadhi na kinadumisha picha ya chanzo.
- source_word: תָּבִיאוּ
  choice: mtaleta
  rationale: Hifili ya בוא hapa ni agizo la ibada; wakati ujao katika muktadha wa sheria unawasilisha wajibu huo kwa kawaida.
- source_word: לֶחֶם תְּנוּפָה
  choice: mikate miwili kuwa sadaka ya kutikiswa
  rationale: Ingawa לֶחֶם iko katika umoja wa kimuundo, שְׁתַּיִם hutaja vipande viwili. “Sadaka ya kutikiswa” huhifadhi istilahi maalumu ya ibada bila kufafanua kupita chanzo.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: sehemu mbili za kumi za efa
  rationale: עִשָּׂרוֹן ni kipimo cha sehemu moja ya kumi, kinachoeleweka katika maandiko ya kikuhani kuwa sehemu ya kumi ya efa; “efa” imeongezwa kwa uwazi wa kipimo.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Hii ni unga uliosafishwa uliotumiwa kwa sadaka za nafaka; “unga laini” ni tafsiri sahihi na inayoeleweka.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: kuokwa ikiwa imetiwa chachu
  rationale: חָמֵץ huonyesha hali ya kutiwa chachu, na תֵּאָפֶינָה huonyesha kuokwa. Kauli hii inahifadhi wazi jambo lisilo la kawaida kwamba mikate hii ya malimbuko ilikuwa na chachu.
- source_word: בִּכּוּרִים
  choice: kuwa malimbuko
  rationale: בִּכּוּרִים ni mazao ya kwanza yanayotolewa kwa Mungu; “kuwa malimbuko” huonyesha kazi ya mikate hiyo katika ibada.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: ל hapa huonyesha anayelengwa au anayewekewa wakfu sadaka; “kwa Yahweh” ni Kiswahili cha asili na huhifadhi jina la agano יהוה.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Istilahi ya ibada תְּנוּפָה
  choice: sadaka ya kutikiswa
  alternative: sadaka iliyowasilishwa kwa kuinuliwa au kutikiswa
  rationale: Tafsiri hii huhifadhi aina maalumu ya sadaka na tendo la kiibada bila kuamua kwa ziada namna kamili ya mwendo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa agizo la kisheria umehifadhiwa, huku vipimo na istilahi za ibada zikielezwa kwa uwazi bila kuondoa upekee wa matini.
