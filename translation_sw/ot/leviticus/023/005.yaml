base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: sw
  text: Katika mwezi wa kwanza, siku ya kumi na nne ya mwezi, wakati wa machweo[a], ni Pasaka[b] ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kati ya jioni mbili,” nahau ya Kiebrania inayomaanisha kipindi cha machweo karibu na kuzama kwa jua.
    reason: lexical_alternative
  - marker: b
    text: Au “sadaka ya Pasaka” au “dhabihu ya Pasaka.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Katika mwezi wa kwanza
  rationale: Katika muktadha wa kalenda, חֹדֶשׁ humaanisha ‘mwezi’; pamoja na הָרִאשׁוֹן, kifungu hiki hutaja mwezi wa kwanza wa mwaka wa ibada.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: siku ya kumi na nne ya mwezi huo
  rationale: Hii ni njia ya Kiebrania ya kutaja tarehe ndani ya mwezi. Neno ‘siku’ limewekwa wazi ili Kiswahili kiwe cha kawaida na sahihi.
- source_word: בֵּין הָעַרְבָּיִם
  choice: wakati wa machweo
  rationale: Nahau hii, ambayo kihalisi ni ‘kati ya jioni mbili,’ hurejelea kipindi cha mwanga wa jioni karibu na kuzama kwa jua. ‘Wakati wa machweo’ ni wazi na asilia kwa Kiswahili, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: פֶּסַח
  choice: Pasaka
  rationale: Neno hili linaweza kumaanisha maadhimisho ya Pasaka au sadaka/dhabihu yake. ‘Pasaka’ huhifadhi upana huo bila kulazimisha maana moja.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kiambishi ל־ hapa kinaonyesha kwamba Pasaka imewekwa wakfu kwa Yahwe au ni kwa ajili yake. ‘Kwa Yahwe’ ni kifupi na cha kawaida, bila kuficha jina la agano.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina יהוה moja kwa moja. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo, na umbo hili linaendana na tahajia ya kawaida ya Kiswahili.
- issue: Maana ya פֶּסַח katika muktadha wa ibada
  choice: Pasaka
  alternative: sadaka ya Pasaka; dhabihu ya Pasaka
  rationale: Neno la Kiebrania linaweza kutaja sikukuu/maadhimisho au dhabihu yenyewe. Kwa kuwa muktadha ni kalenda ya nyakati zilizowekwa, tafsiri kuu inaacha maana ikiwa pana, na tanbihi huhifadhi uwezekano wa maana ya dhabihu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa tarehe umewekwa wazi kwa msomaji wa kawaida. ‘Machweo’ huepuka usemi mzito wa kihalisi, huku tanbihi ikihifadhi nahau ya Kiebrania. Jina ‘Yahwe’ limetumika badala ya cheo.
