id: LEV.23.13
reference: Leviticus 23:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: sw
  text: Na sadaka yake ya nafaka itakuwa sehemu mbili za kumi za efa ya unga laini uliochanganywa na mafuta, sadaka ya kutolewa kwa moto kwa Yahwe, yenye harufu nzuri ya kumpendeza Yahwe; na sadaka yake ya kinywaji itakuwa divai, robo ya hini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: Na sadaka yake ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya nafaka; kiambishi cha nafsi ya tatu umoja kinarejelea mwana-kondoo aliyetajwa kabla.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: sehemu mbili za kumi za efa
  rationale: Usemi huu ni 'sehemu mbili za kumi'; katika sheria za kikuhani kipimo kinachodokezwa ni efa.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni neno la kawaida la ibada kwa unga uliosafishwa unaotumiwa katika sadaka.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: uliochanganywa na mafuta
  rationale: Kauli tendwa inaonyesha kuwa unga umechanganywa na mafuta; Kiswahili hiki ni cha kawaida na sahihi.
- source_word: אִשֶּׁה לַיהוָה
  choice: sadaka inayoteketezwa kwa moto kwa Yahwe
  rationale: אִשֶּׁה ni istilahi ya sadaka inayotolewa kwa moto; tafsiri hii huhifadhi wazi kipengele cha moto badala ya kukitafsiri kama chakula pekee.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Huhifadhi sitiari ya ibada na maana ya sadaka inayokubalika kwa Mungu kwa Kiswahili cha kawaida.
- source_word: וְנִסְכֹּה
  choice: na sadaka yake ya kinywaji itakuwa
  rationale: נֶסֶךְ ni sadaka ya kimiminika inayomiminwa pamoja na dhabihu; kiambishi kinarejelea sadaka iliyotangulia.
- source_word: יַיִן
  choice: divai
  rationale: Hili ndilo neno la moja kwa moja na la kawaida la Kiswahili kwa wine.
- source_word: רְבִיעִת הַהִין
  choice: robo ya hini
  rationale: Huhifadhi kipimo cha kale cha hini huku sehemu yake ikitolewa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה moja kwa moja; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אִשֶּׁה
  choice: sadaka inayoteketezwa kwa moto
  alternative: sadaka ya chakula
  rationale: Neno hili ni istilahi ya dhabihu inayotolewa kwa moto. Tafsiri iliyochaguliwa huhifadhi maana ya kiibada iliyo wazi katika Kiebrania bila kuingiza wazo la 'chakula' ambalo halisemiwi moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Vipimo vya kale 'efa' na 'hini' vimehifadhiwa ili kuepuka ubadilishaji wa makadirio usio katika maandishi. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika katika rasimu hii.
