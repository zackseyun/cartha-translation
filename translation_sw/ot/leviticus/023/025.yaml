base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: sw
  text: Msifanye kazi yoyote ya kawaida, na mtamtolea Yahwe sadaka ya moto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya chakula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: Msifanye ... yoyote
  rationale: Muundo huu wa Kiswahili unaonyesha katazo kamili kwa njia ya kawaida na unaendeleza wingi wa nafsi ya pili.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Kirai hiki kinamaanisha kazi ya kawaida ya shughuli au utumishi, si kila tendo bila ubaguzi. 'Kazi ya kawaida' ni wazi na ya sasa kuliko tafsiri ya kizamani ya kazi ya kitumwa.
- source_word: וְהִקְרַבְתֶּם
  choice: mtamtolea
  rationale: Katika muktadha wa dhabihu, Hifili ya קרב humaanisha kuleta au kutoa kitu kama sadaka. 'Kumtolea' ni Kiswahili cha kawaida cha ibada na kinabainisha anayepokea dhabihu.
- source_word: אִשֶּׁה
  choice: dhabihu ya kuteketezwa kwa moto
  rationale: Neno la kikuhani linahusu sadaka inayotolewa kwa moto. Tafsiri hii inaweka wazi njia ya kuitoa bila kuamua kwamba maana yake ya msingi ni 'chakula'.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kwa umbo la Kiswahili linalotambulika, badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si neno la Kiebrania la 'Bwana'. Kulitaja kama 'Yahwe' huhifadhi tofauti hiyo.
- issue: Maana ya neno la ibada אִשֶּׁה
  choice: dhabihu ya kuteketezwa kwa moto
  alternative: sadaka ya chakula
  rationale: Asili na upeo kamili wa istilahi hii vinajadiliwa. Maana inayohusiana na utoaji kwa moto imewekwa katika matini, huku tafsiri ya 'sadaka ya chakula' ikihifadhiwa katika tanbihi ili kutoficha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Wingi wa nafsi ya pili umehifadhiwa. Kiunganishi 'bali' kinaonyesha kwa kawaida tofauti kati ya kazi iliyokatazwa na wajibu wa kutoa dhabihu.
