  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: sw
  text: Siku hiyo hiyo mtatangaza kusanyiko takatifu[a]. Msifanye kazi yoyote ya kawaida[b]. Hii ni sheria ya kudumu[c] katika makao yenu yote, kwa vizazi vyenu vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkutano mtakatifu” au “kusanyiko la ibada.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kazi yote ya utumishi”; yaani, kazi ya kawaida.'
    reason: lexical_alternative
  - marker: c
    text: Au, “sheria ya milele” au “sheria ya daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: mtatangaza
  rationale: Katika muktadha huu wa ibada, קרא ni kutangaza rasmi siku au kusanyiko, si kusema tu wala kuita kwa kawaida.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Siku iyo hiyo
  rationale: Usemi huu unasisitiza siku yenyewe; tafsiri hii ni ya asili katika Kiswahili na inadumisha msisitizo huo.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Ni usemi wa kiibada unaomaanisha mkutano mtakatifu ulioitishwa rasmi; 'kusanyiko takatifu' ni wazi na wenye hadhi.
- source_word: יִהְיֶה לָכֶם
  choice: kwa ajili yenu
  rationale: Maneno haya yanadumisha kiashirio cha לָכֶם kwamba kusanyiko hilo linapaswa kuwa kwa ajili ya jamii ya Israeli.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Usemi huo unahusu kazi ya kawaida ya shughuli au utumishi, si lazima kila tendo la aina yoyote.
- source_word: לֹא תַעֲשׂוּ
  choice: Msifanye
  rationale: Ni katazo la moja kwa moja kwa wingi, lililotolewa kwa Kiswahili cha sheria kilicho wazi.
- source_word: חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  rationale: עוֹלָם katika kauli hii ya kisheria huonyesha uendelevu wa amri; 'ya kudumu' ni wazi bila kulazimisha maana ya kifalsafa isiyo na mwisho.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: katika makao yenu yote
  rationale: Tafsiri hii inadumisha maana ya maeneo yote ambako watu wanaishi.
- source_word: לְדֹרֹתֵיכֶם
  choice: vizazi hata vizazi
  rationale: Kauli hii ya asili ya Kiswahili inaonyesha kuendelea kwa sheria katika vizazi vinavyofuatana.
theological_decisions:
- issue: Upeo wa katazo la kazi katika sheria ya sikukuu
  choice: kazi yoyote ya kawaida
  alternative: kazi yoyote; kazi yoyote nzito; kazi ya utumishi
  rationale: מְלֶאכֶת עֲבֹדָה kwa kawaida humaanisha kazi ya kawaida ya shughuli au utumishi. Tafsiri hii huepuka kufanya katazo liwe pana kuliko maneno ya Kiebrania, huku tanbihi ikihifadhi umbo lake halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umehifadhiwa bila kuwa mgumu; 'kusanyiko takatifu' linaweka wazi istilahi ya kiibada, na 'kazi yoyote ya kawaida' linaepuka katazo pana kupita chanzo.
