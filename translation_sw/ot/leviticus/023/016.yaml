  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: sw
  text: Mtahesabu siku hamsini[a], hadi siku inayofuata Sabato ya saba; kisha mtamtolea Yahwe sadaka mpya ya nafaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka siku inayofuata juma la saba.” Kiebrania kinasema “siku inayofuata Sabato ya saba,” na wafafanuzi hutofautiana kuhusu jinsi hesabu ya sikukuu inavyoelezwa kwa maneno ya kalenda.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד
  choice: hadi
  rationale: Huonyesha kikomo cha kipindi cha kuhesabu na inaingia kwa kawaida katika sentensi ya Kiswahili.
- source_word: מִמָּחֳרַת
  choice: siku inayofuata
  rationale: Hutoa kwa Kiswahili cha sasa maana ya ‘kesho yake’ au ‘siku baada ya’ bila kutumia lugha ya kizamani.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: Sabato ya saba
  rationale: Huhifadhi neno la Kiebrania שַׁבָּת na mpangilio wake badala ya kulifasiri kimya kuwa ‘juma la saba.’
- source_word: תִּסְפְּרוּ
  choice: mtahesabu
  rationale: Wakati ujao katika Kiswahili hufaa kuwasilisha agizo la kisheria kwa wingi lililo katika kitenzi cha Kiebrania.
- source_word: חֲמִשִּׁים יוֹם
  choice: siku hamsini
  rationale: Hii ndiyo namna ya kawaida na wazi ya kutaja idadi hiyo kwa Kiswahili.
- source_word: וְהִקְרַבְתֶּם
  choice: kisha mtamtolea
  rationale: Katika muktadha wa dhabihu, kitenzi kinamaanisha kuleta au kutoa sadaka; ‘kisha’ huonyesha mfuatano uliodokezwa na kiunganishi.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za Walawi, neno hili kwa kawaida humaanisha sadaka inayotokana na nafaka, si sadaka kwa ujumla tu.
- source_word: חֲדָשָׁה
  choice: mpya
  rationale: Huhifadhi maana ya moja kwa moja ya kivumishi, ikiashiria sadaka inayohusiana na mazao mapya.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kiambishi ל huonyesha anayepokea sadaka; katika muundo wa Kiswahili ‘mtamtolea Yahwe’ maana hiyo huwasilishwa kwa kawaida, huku jina la agano likihifadhiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu lenye herufi nne moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Iwapo ‘Sabato ya saba’ ilainishwe kuwa usemi wa kalenda ‘juma la saba’
  choice: Sabato ya saba
  alternative: juma la saba
  rationale: Kiebrania kimetumia שַׁבָּת, si neno la kawaida la ‘juma.’ Tafsiri hii huhifadhi wording ya chanzo na haimalizi kimya mjadala wa namna hesabu ya sikukuu inavyoelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku istilahi za ibada ‘Sabato’ na ‘sadaka ya nafaka’ zikihifadhi usahihi wa muktadha wa Walawi.
