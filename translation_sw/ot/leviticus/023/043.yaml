  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: sw
  text: ili vizazi vyenu vijue kwamba niliwafanya wana wa Israeli[b] wakae katika vibanda[a] nilipowatoa kutoka nchi ya Misri. Mimi ni Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makao ya muda.” Neno la Kiebrania sukkot linamaanisha vibanda au makao ya muda.
    reason: lexical_alternative
  - marker: b
    text: “Wana wa Israeli” pia inaweza kutafsiriwa “Waisraeli” au “watu wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Kihusishi hiki kinatanguliza kusudi; “ili” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: יֵדְעוּ
  choice: vijue
  rationale: Kitenzi kinategemea “vizazi vyenu” na, baada ya “ili,” huonyesha kusudi linalokusudiwa.
- source_word: דֹרֹתֵיכֶם
  choice: vizazi vyenu
  rationale: Huhifadhi kwa ukaribu wazo la vizazi vinavyofuatana katika agano, bila kulifupisha kuwa ‘wazao.’
- source_word: כִּי
  choice: kwamba
  rationale: Hapa kinaanzisha maudhui ambayo vizazi vinapaswa kujua.
- source_word: בַסֻּכּוֹת
  choice: katika vibanda
  rationale: “Vibanda” hueleza makao ya muda na kuhifadhi uhusiano wa kimsamiati na Sikukuu ya Vibanda.
- source_word: הוֹשַׁבְתִּי
  choice: niliwakalisha
  rationale: Umbo la Hiphil lina maana ya kusababisha kukaa; “niliwakalisha” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Ni tafsiri ya karibu ya muundo wa Kiebrania, unaolitaja taifa la agano kwa pamoja; mbadala wa Kiswahili cha kawaida umewekwa katika tanbihi.
- source_word: בְּהוֹצִיאִי
  choice: nilipowatoa
  rationale: Kitenzi-jina chenye ב kinaonyesha wakati au mazingira; “nilipowatoa” ni tafsiri ya asili na sahihi.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: katika nchi ya Misri
  rationale: Kwa kuunganishwa na kitenzi “kuwatoa,” Kiswahili hutumia kwa kawaida “katika”; nomino ‘nchi’ imehifadhiwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi moja kwa moja kauli ya uhusiano wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu; “Yahwe” hulihifadhi wazi, huku tahajia hii ikiwa ya kawaida katika Kiswahili.
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Chaguo kuu huhifadhi kwa ukaribu usemi wa Kiebrania na maana yake ya pamoja, bila kuzuia tafsiri ya kawaida zaidi iliyoelezwa katika tanbihi.
- issue: Aina ya makao katika סֻכּוֹת
  choice: vibanda
  alternative: makao ya muda
  rationale: “Vibanda” huhifadhi jina maalumu linalohusiana na sikukuu, lakini neno la Kiebrania pia linaweza kueleweka kwa upana kuwa makao ya muda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kusudi, kisababishi cha kitenzi, jina la Mungu, na uhusiano na Sikukuu ya Vibanda vimehifadhiwa bila kufanya sentensi iwe nzito kupita kiasi.
