base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: sw
  text: Nanyi mtatoa mbuzi dume mmoja kuwa sadaka ya dhambi[a], na wanakondoo dume wawili wenye umri wa mwaka mmoja kuwa dhabihu ya amani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.”
    reason: lexical_alternative
  - marker: b
    text: Au, “dhabihu ya ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: mtatoa
  rationale: Ingawa kitenzi hiki kimsingi humaanisha ‘kufanya,’ katika muktadha wa dhabihu maana yake ya kawaida ni kutoa mnyama kama sadaka.
- source_word: שְׂעִיר עִזִּים
  choice: beberu
  rationale: Neno hili la kawaida la Kiswahili humaanisha mbuzi dume na linahifadhi bainisho la jinsia ya mnyama.
- source_word: אֶחָד
  choice: mmoja
  rationale: Nambari imetafsiriwa moja kwa moja na kupatanishwa kisarufi na ‘beberu.’
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: Hili ni jina la kawaida la aina hii ya sadaka katika sheria za Walawi; maana mbadala inayosisitiza utakaso imehifadhiwa katika tanbihi.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: na wanakondoo dume wawili
  rationale: Tafsiri hii inaonyesha idadi na udume wa wanyama kwa uwazi katika Kiswahili cha sasa.
- source_word: בְּנֵי שָׁנָה
  choice: wenye umri wa mwaka mmoja
  rationale: Kirai hiki cha Kiebrania kinaeleza umri wa wanyama; tafsiri hii ni wazi na ya kawaida.
- source_word: לְזֶבַח שְׁלָמִים
  choice: kuwa dhabihu ya sadaka za amani
  rationale: ‘Dhabihu’ inawakilisha זֶבַח, huku ‘sadaka za amani’ ikihifadhi wingi na uhusiano wa neno שְׁלָמִים na dhana ya amani bila kulifasiri kwa namna finyu.
theological_decisions:
- issue: Tafsiri ya חטאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: ‘Sadaka ya dhambi’ ni istilahi inayotambulika kwa urahisi, lakini neno hilo pia linaweza kusisitiza kazi ya utakaso; tanbihi inalinda mvutano huo bila kuamua mjadala.
- issue: Tafsiri ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: ‘Sadaka za amani’ iko karibu zaidi na neno la Kiebrania na haifungi maana yake katika wazo moja tu; ‘sadaka za ushirika’ imetajwa kama mbadala wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida huku istilahi za dhabihu na tofauti za maana za Kiebrania zikihifadhiwa.
