id: LEV.23.3
reference: Leviticus 23:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽ/יהוָ֔ה בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: sw
  text: Kwa siku sita kazi inaweza kufanywa, lakini siku ya saba ni Sabato ya pumziko kamili[a], kusanyiko takatifu. Msifanye kazi yoyote; ni Sabato kwa Yahwe katika makao yenu yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sabato ya mapumziko makuu.” Kirai cha Kiebrania kinasisitiza wazo la pumziko la Sabato.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika jamii zenu zote.” Neno la Kiebrania linaweza kumaanisha mahali pa kukaa au jamii zenye makazi ya kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: inaweza kufanywa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kiebrania na maana ya ruhusa au desturi katika muktadha, badala ya kukifanya kuwa amri kali.
- source_word: מְלָאכָה
  choice: kazi
  rationale: Ni neno la kawaida na la wazi kwa shughuli au kazi inayokatazwa katika sheria ya Sabato.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabato ya pumziko kamili
  rationale: Kirai hiki kinasisitiza kukoma na kupumzika kikamilifu; tafsiri hii inahifadhi neno Sabato pamoja na msisitizo wa pumziko.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Huwasilisha mkutano mtakatifu ulioitishwa rasmi, huku kikibaki kirai cha kawaida na kinachoeleweka katika Kiswahili.
- source_word: לֹא תַעֲשׂוּ
  choice: Msifanye kazi yoyote
  rationale: Huhifadhi katazo la moja kwa moja kwa wingi na kulieleza kwa Kiswahili cha kawaida.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: ni Sabato kwa Yahwe
  rationale: Neno “kwa” linahifadhi mwelekeo wa kihusiano wa kihusishi cha Kiebrania bila kuufanya moja kwa moja kuwa umilikaji.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hutumia umbo la Kiswahili la jina la agano la Mungu badala ya kulibadilisha kwa cheo.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: katika makao yenu yote
  rationale: Huhifadhi maana ya msingi ya mahali pa kukaa, huku tanbihi ikionyesha uwezekano wa kumaanisha jamii au makazi yaliyowekwa.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: lakini siku ya saba
  rationale: Ingawa waw inaweza kuwa “na,” “lakini” huonyesha kwa kawaida utofauti kati ya siku sita za kazi na siku ya saba ya pumziko.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kwa cheo.
- issue: Nguvu ya kirai שַׁבַּת שַׁבָּתוֹן
  choice: Sabato ya pumziko kamili
  alternative: Sabato ya mapumziko makuu
  rationale: Chaguo hili linaonyesha msisitizo wa kukoma kabisa na kupumzika bila kuingiza maelezo ya baadaye ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa wasomaji wa kawaida huku zikihifadhi muundo wa kisheria, hali ya kutendwa katika sehemu ya kwanza, katazo la wingi, na utata halisi wa “makao/jamii.”
