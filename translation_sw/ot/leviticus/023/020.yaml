base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: sw
  text: Kuhani atavitikisa pamoja na mkate wa malimbuko kuwa sadaka ya kutikiswa mbele za Yahwe, pamoja na wanakondoo wawili.[a] Vitakuwa vitakatifu kwa Yahwe; vitakuwa vya kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya mkate wa malimbuko” na “juu ya wanakondoo wawili.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kihalisi, lakini hapa huenda kinaonyesha kuwa vitu hivyo viliwasilishwa pamoja katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: atavitikisa
  rationale: Hifili ya נוּף hapa inaeleza tendo la ibada la kuvitikisa au kuviwasilisha vitu mbele za Mungu. ‘Atavitikisa’ linadumisha picha halisi ya tendo hilo na linaendana na istilahi ‘sadaka ya kutikiswa.’
- source_word: אֹתָם
  choice: vi- katika ‘atavitikisa’
  rationale: Kiwakilishi hiki cha yambwa kinarejelea vitu vilivyotajwa katika muktadha uliotangulia. Kiambishi cha ngeli ‘vi-’ kinadumisha rejeo hilo bila kuongeza maelezo ambayo mstari wenyewe hauyasemi wazi.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: pamoja na mkate wa malimbuko
  rationale: Ingawa עַל inaweza kumaanisha ‘juu ya,’ katika ibada hii inaelekea kuonyesha vitu vilivyowasilishwa kwa pamoja. ‘Pamoja na’ ni Kiswahili cha kawaida kisichodokeza bila lazima kwamba vitu viliwekwa kimwili juu ya mkate.
- source_word: לֶחֶם הַבִּכּוּרִים
  choice: mkate wa malimbuko
  rationale: Tafsiri hii inadumisha uhusiano wa mkate na sadaka ya mazao ya kwanza na kutumia istilahi ya kibiblia inayotambulika katika Kiswahili.
- source_word: תְּנוּפָה
  choice: sadaka ya kutikiswa
  rationale: Hii ni istilahi maalumu ya dhabihu inayowasilishwa kwa tendo la kuitikisa mbele za Yahwe. Usemi huu ni wazi na unaendeleza mzizi uleule wa kitenzi נוּף.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha tendo la ibada linalofanywa katika uwepo wa Mungu.
- source_word: עַל שְׁנֵי כְבָשִׂים
  choice: pamoja na wale wanakondoo wawili
  rationale: Kama ilivyo kwa עַל ya kwanza, ‘pamoja na’ linaonyesha uwasilishaji wa pamoja. ‘Wale’ hurejelea wanakondoo wawili waliotajwa katika muktadha uliotangulia.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: Vitakuwa vitakatifu
  rationale: Muundo huu unaonyesha hadhi ya vitu hivyo kuwa vilivyowekwa wakfu. Tafsiri haifafanui kupita kiasi ni vitu gani hasa vinavyokusudiwa na hivyo inadumisha ufupi wa Kiebrania.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi לְ kinaonyesha kuwekwa wakfu au kuwa mali ya Yahwe. ‘Kwa Yahwe’ ni cha asili katika Kiswahili na kinadumisha maana hiyo.
- source_word: לַכֹּהֵן
  choice: kwa ajili ya kuhani
  rationale: Kifungu hiki kinaonyesha kuwa baada ya kuwekwa wakfu kwa Yahwe, vitu hivyo ni sehemu anayostahili kuhani. Tafsiri hii inaeleza haki hiyo bila kuongeza matumizi maalumu yasiyotajwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu la herufi nne moja kwa moja. ‘Yahwe’ linadumisha jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya vitu vitakatifu kwa Yahwe na sehemu ya kuhani
  choice: Vitakuwa vitakatifu kwa Yahwe, kwa ajili ya kuhani
  alternative: Vitakuwa mali takatifu ya kuhani
  rationale: 'Tafsiri iliyochaguliwa inadumisha mvutano wa Kiebrania: vitu hivyo ni vitakatifu kwa Yahwe na wakati huohuo vimetengwa kwa ajili ya kuhani. Haifuti upande wowote wa uhusiano huo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi ‘sadaka ya kutikiswa’ imetumiwa kwa uthabiti kueleza tendo maalumu la ibada. Muundo na viwakilishi vimeachwa kwa kiasi fulani bila ufafanuzi wa ziada ili kuhifadhi rejeo lisilo wazi kabisa katika Kiebrania.
