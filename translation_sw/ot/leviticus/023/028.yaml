id: LEV.23.28
reference: Leviticus 23:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: sw
  text: Msifanye kazi yoyote siku hii hii, kwa maana ni Siku ya Upatanisho[a], ili kufanya upatanisho kwa ajili yenu mbele za Yahweh, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania, kihalisi: “siku ya mapatanisho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ
  choice: Msifanye kazi yoyote
  rationale: Katazo la kisheria linaelezwa kwa Kiswahili cha kawaida na chenye nguvu. Neno מְלָאכָה hapa linamaanisha kazi au shughuli ya kikazi katika masharti ya siku takatifu.
- source_word: בְּ/עֶצֶם הַ/יּ֣וֹם הַ/זֶּ֑ה
  choice: siku hii hii
  rationale: Urudiaji wa “hii” unatoa msisitizo wa nahau ya Kiebrania kwamba katazo linahusu siku hiyo yenyewe hasa.
- source_word: כִּ֣י
  choice: kwa maana
  rationale: Kiunganishi hiki kinatanguliza sababu ya katazo.
- source_word: י֤וֹם כִּפֻּרִים֙
  choice: Siku ya Upatanisho
  rationale: Hili ni jina linaloeleweka la sikukuu katika Kiswahili. Wingi wa neno la Kiebrania umehifadhiwa katika tanbihi badala ya kutokeza usemi usio wa kawaida katika matini kuu.
- source_word: לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם
  choice: ili kufanya upatanisho kwa ajili yenu
  rationale: Usemi huu huhifadhi maana ya kikuhani ya כפר na huonyesha kwamba watu ndio wanaofanyiwa upatanisho bila kuingiza nadharia maalumu ya jinsi upatanisho unavyotenda kazi.
- source_word: לִ/פְנֵ֖י
  choice: mbele za
  rationale: Hii ni nahau ya kawaida na yenye heshima ya Kiswahili inayoonyesha kuwapo mbele ya Mungu katika mazingira ya ibada.
- source_word: יְהוָ֥ה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי/כֶֽם
  choice: Mungu wenu
  rationale: Katika kauli hii ya agano, neno lina maana ya umoja na kiambishi chake kinawarejelea watu kwa wingi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania hutumia moja kwa moja jina la agano יהוה; kulitohowa kama “Yahweh” huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya kikuhani ya כפר na כִּפֻּרִים
  choice: upatanisho / Siku ya Upatanisho
  alternative: utakaso, kufunika, au Siku ya Mapatanisho
  rationale: “Upatanisho” hubeba uzito wa ibada na kurejeshwa kwa uhusiano bila kufungamanisha neno na maelezo finyu ya kimadhehebu. Wingi wa muundo wa Kiebrania umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa katazo ni wazi kwa msomaji wa kawaida, huku istilahi ya ibada “upatanisho” na jina “Yahweh” zikihifadhiwa. Alama ya tanbihi imewekwa mara tu baada ya istilahi inayofafanuliwa.
