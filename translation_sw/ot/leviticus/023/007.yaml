  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: sw
  text: Siku ya kwanza mtakuwa na kusanyiko takatifu[a]; msifanye kazi yoyote ya kawaida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkusanyiko mtakatifu” au “kusanyiko lililowekwa wakfu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kazi ya utumishi”; yaani, kazi ya kawaida. Kijadi limetafsiriwa “kazi ya kitumwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Siku ya kwanza
  rationale: Hiki ni kirai cha wakati; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Katika muktadha wa ibada, מִקְרָא humaanisha mkusanyiko ulioitishwa, na קֹדֶשׁ huonyesha kuwa umetengwa kuwa mtakatifu. ‘Kusanyiko takatifu’ ni lugha ya heshima na inayoeleweka kwa urahisi.
- source_word: יִהְיֶה לָכֶם
  choice: mtakuwa na
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayoeleza kile ambacho watu wanapaswa kuwa nacho siku hiyo, bila kubadili nguvu ya agizo.
- source_word: כָּל ... לֹא
  choice: yoyote ... msi-
  rationale: 'Muundo huu huhifadhi upeo wa katazo: hakuna kazi ya aina inayotajwa inayopaswa kufanywa.'
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: kazi ... ya kawaida
  rationale: Kirai hiki katika sheria za sikukuu kinahusu kazi ya kawaida ya shughuli au huduma, si kila tendo linalowezekana. Tafsiri hii huepuka maana potovu ya ‘kazi ya kitumwa.’
- source_word: לֹא תַעֲשׂוּ
  choice: msifanye
  rationale: Huu ni muundo wa kawaida na wenye mamlaka wa kutoa katazo kwa wingi katika Kiswahili.
theological_decisions:
- issue: Upeo wa katazo katika מְלֶאכֶת עֲבֹדָה
  choice: Katazo linahusu kazi ya kawaida ya shughuli au huduma.
  alternative: Katazo linahusu kila tendo au aina yote ya kazi bila tofauti.
  rationale: Kirai maalumu מְלֶאכֶת עֲבֹדָה ni finyu kuliko katazo lisilo na sifa la ‘kazi yote.’ Tafsiri inadumisha tofauti hiyo bila kuamua kwa undani shughuli zipi zinaruhusiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. ‘Kusanyiko takatifu’ hudumisha istilahi ya kiibada, huku ‘kazi yoyote ya kawaida’ ikibainisha aina ya kazi inayokatazwa bila kupanua katazo kuliko Kiebrania.
