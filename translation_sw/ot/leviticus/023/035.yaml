  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: sw
  text: Siku ya kwanza kutakuwa na kusanyiko takatifu.[a] Msifanye kazi yoyote ya utumishi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkutano mtakatifu.” Kirai cha Kiebrania ni istilahi rasmi ya kusanyiko takatifu lililoitishwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kazi yoyote ya kawaida.” Kirai cha Kiebrania kinamaanisha kazi ya kawaida inayohusiana na utumishi, shughuli, au wajibu wa kila siku; hakimaanishi kukataza kila tendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Siku ya kwanza
  rationale: Kirai hiki ni cha wakati; katika Kiswahili cha kawaida, “Siku ya kwanza” huwasilisha maana hiyo kwa uwazi bila kuhitaji kihusishi cha ziada.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Kirai hiki cha ibada humaanisha mkutano mtakatifu ulioitishwa rasmi. “Kusanyiko takatifu” ni lugha ya asili na yenye heshima, huku tanbihi ikihifadhi dhana ya kuitishwa.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Kirai hakikatazi kila tendo, bali kazi ya kawaida inayohusiana na shughuli au wajibu wa kila siku. Tafsiri hii inaeleweka kwa urahisi na huepuka maana potovu ya “kazi ngumu” pekee.
- source_word: לֹא תַעֲשׂוּ
  choice: Msifanye
  rationale: Amri hasi ya nafsi ya pili wingi hutafsiriwa kwa kawaida na moja kwa moja kwa “Msifanye” katika Kiswahili.
