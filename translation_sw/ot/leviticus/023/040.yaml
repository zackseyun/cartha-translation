id: LEV.23.40
reference: Leviticus 23:40
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: sw
  text: Nanyi, siku ya kwanza mtajitwalia matunda ya mti wa fahari[a], matawi ya mitende, matawi ya miti yenye majani mengi, na mierebi ya kando ya vijito; nanyi mtafurahi mbele za Yahweh, Mungu wenu, kwa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, kulingana na mapokeo ya Kiyahudi ya baadaye, “tunda la mfurungu” (etrog). Kiebrania kinasema kihalisi “tunda la mti wa uzuri/fahari.”
    reason: Huhifadhi utata wa kishazi cha Kiebrania na kutaja utambulisho wa kimapokeo bila kuuweka katika maandishi makuu.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: mtajitwalia
  rationale: Kitenzi hiki kinaonyesha agizo katika muktadha wa sheria, na kiambishi cha kujirejelea katika “mtajitwalia” kinawasilisha maana ya לָכֶם, ‘kwa ajili yenu wenyewe,’ kwa Kiswahili cha kawaida.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: siku ya kwanza
  rationale: Hii ni tafsiri ya moja kwa moja ya kishazi cha wakati bila kuongeza maneno ‘ya sikukuu,’ ambayo yanaeleweka katika muktadha lakini hayamo wazi katika mstari huu.
- source_word: פְּרִי עֵץ הָדָר
  choice: matunda ya miti mizuri
  rationale: הָדָר hudokeza uzuri, fahari, au kuvutia. Tafsiri ya jumla inaacha wazi aina ya mti badala ya kuingiza utambulisho wa baadaye wa tunda la mfurungu. Wingi ‘matunda ya miti’ ni Kiswahili cha asili kwa maana ya jumla ya kishazi hiki.
- source_word: כַּפֹּת תְּמָרִים
  choice: matawi ya mitende
  rationale: Kishazi kinamaanisha matawi au makuti ya mitende. ‘Matawi ya mitende’ ni wazi kwa wasomaji wengi na kinabaki karibu na muundo wa Kiebrania.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: matawi ya miti yenye majani mengi
  rationale: עָבֹת huonyesha unene au msongamano, hapa yaelekea msongamano wa majani. Tafsiri hii inawasilisha maana hiyo kwa Kiswahili cha kawaida bila kubainisha aina fulani ya mti.
- source_word: וְעַרְבֵי נָחַל
  choice: mierebi ya kando ya vijito
  rationale: עַרְבֵי ni mierebi au miti inayofanana nayo, na נָחַל ni kijito, mkondo, au bonde lenye maji. ‘Ya kando ya vijito’ ni usemi wa asili unaoonyesha mahali miti hiyo inapoota.
- source_word: וּשְׂמַחְתֶּם
  choice: mtafurahi
  rationale: Kitenzi kinamaanisha kufurahi au kuwa na shangwe; ‘mtafurahi’ kinadumisha nguvu ya agizo bila kulipanua kwa maelezo yasiyokuwapo.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: mbele za Yahwe Mungu wenu
  rationale: לִפְנֵי ni ‘mbele ya’ au ‘katika uwepo wa.’ Usemi ‘mbele za’ ni wa asili na wenye hadhi katika Kiswahili, na jina la agano יְהוָה limetoholewa kuwa ‘Yahwe.’
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kihusishi ‘kwa’ kinaonyesha muda kwa uwazi na kwa mtindo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la agano. ‘Yahwe’ hulitambulisha kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Utambulisho wa פְּרִי עֵץ הָדָר
  choice: maana ya jumla, ‘matunda ya miti mizuri’
  alternative: tunda la mfurungu (etrog/citron)
  rationale: Mapokeo ya Kiyahudi ya baadaye yalitambulisha tunda hili kuwa etrog, lakini Kiebrania chenyewe hakitaji aina hiyo wazi. Maandishi makuu yanahifadhi upana wa asili, na uwezekano wa mapokeo unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mfuatano wa Kiebrania lakini hutumia miundo ya asili ya Kiswahili. Msamiati wa mimea umewekwa wazi na usio wa kitaalamu kupita kiasi.
