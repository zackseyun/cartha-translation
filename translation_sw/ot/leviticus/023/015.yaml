base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: sw
  text: Nanyi mtajihesabia kuanzia siku inayofuata baada ya Sabato, kuanzia siku mtakapoleta mganda wa sadaka ya kutikiswa; zitakuwa Sabato saba kamili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majuma saba kamili.” Kiebrania kinasema kihalisi, “Sabato saba kamili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: Nanyi mtajihesabia
  rationale: Kitenzi hiki katika muktadha wa maagizo ya sheria kina nguvu ya amri. Wakati ujao wa Kiswahili hutoa agizo hilo kwa lugha ya kawaida na yenye hadhi.
- source_word: לָכֶם
  choice: mtajihesabia
  rationale: Kiambishi cha kujirejelea -ji- kinahifadhi wazo la ‘kwa ajili yenu wenyewe’ bila kufanya sentensi iwe nzito.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: kuanzia siku inayofuata Sabato
  rationale: Hueleza wazi mwanzo wa kuhesabu na huhifadhi neno maalumu la Kiebrania la Sabato badala ya kulifanya kwa ujumla kuwa siku ya mapumziko.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: kuanzia siku mtakapoleta
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba siku ya kuleta ndiyo mwanzo wa hesabu.
- source_word: עֹמֶר
  choice: mganda
  rationale: Katika muktadha huu neno linarejelea mganda wa nafaka unaoletwa katika ibada, si hasa kipimo kikavu.
- source_word: הַתְּנוּפָה
  choice: sadaka ya kutikiswa
  rationale: Huhifadhi tendo maalumu la kiibada la kuitikisa au kuiwasilisha sadaka mbele za BWANA.
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: Sabato saba
  rationale: Kiebrania kinatumia moja kwa moja neno la Sabato. Tafsiri kuu inalihifadhi ili kutoamua kimya-kimya mjadala wa kalenda; ‘majuma saba’ imewekwa katika tanbihi.
- source_word: תְּמִימֹת
  choice: kamili
  rationale: Katika hesabu ya muda, neno hili linamaanisha vipindi vilivyotimia au vilivyo kamili, si ukamilifu wa kimaadili.
- source_word: תִּהְיֶינָה
  choice: zitakuwa
  rationale: Huhifadhi usemi wa kuwepo na kukamilika kwa hizo Sabato saba kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya שַׁבָּת / שַׁבָּתוֹת katika agizo la kalenda
  choice: Kuhifadhi ‘Sabato’ na ‘Sabato saba’ katika matini kuu.
  alternative: Kutafsiri ‘juma’ au ‘majuma saba’ kwa maana ya vipindi vya siku saba vinavyohesabiwa.
  rationale: Maneno ya Kiebrania yanatumia wazi istilahi ya Sabato. Kwa kuwa mwanzo wa hesabu na matumizi ya wingi huu yamekuwa na tafsiri tofauti, matini kuu inahifadhi mvutano huo, huku tanbihi ikitoa tafsiri nyingine ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja kwa usomaji wa hadhara; istilahi za kiibada ‘Sabato,’ ‘mganda,’ na ‘sadaka ya kutikiswa’ zimehifadhiwa kwa usahihi wa muktadha.
