  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: sw
  text: Lakini siku ya kumi ya mwezi huu wa saba ni Siku ya Upatanisho[a]. Mtakuwa na kusanyiko takatifu; mtajinyima[b] na kumtolea Yahwe sadaka ya moto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hutumia umbo la wingi: “Siku ya Mapatanisho.”'
    reason: alternative_reading
  - marker: b
    text: Au “mtajinyenyekeza” au “mtajitesa.” Kwa neno halisi, “mtazitesa nafsi zenu.” Usemi huu haupaswi kufupishwa kuwa kufunga tu.
    reason: lexical_alternative
  - marker: c
    text: Au “sadaka inayotolewa kwa moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Chembe hii inaleta mpito wenye msisitizo au mpaka kutoka maagizo ya sikukuu yaliyotangulia; “Lakini” ni ya kawaida na haiongezi maana isiyokuwapo.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: siku ya kumi ya mwezi huu wa saba
  rationale: Hutoa kwa uwazi usemi wa wakati wa Kiebrania na kuhifadhi kiashiria “huu.”
- source_word: יוֹם הַכִּפֻּרִים
  choice: Siku ya Upatanisho
  rationale: Hili ndilo jina la sikukuu linaloeleweka kwa Kiswahili. Ingawa כִּפֻּרִים ina umbo la wingi, wingi huo hauwezi kuhamishwa kwa Kiswahili kwa kawaida bila kuharibu jina; maelezo ya chini yanauhifadhi.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Hueleza mkutano rasmi wa kidini ulioitishwa, huku ikidumisha hadhi ya usemi wa kikuhani.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: mtajinyima
  rationale: Katika muktadha huu, kitenzi pamoja na “nafsi zenu” ni nahau ya kujiletea hali ya kujinyima. Tafsiri hii ni ya kawaida na haifungi amri hiyo kwenye kufunga tu.
- source_word: וְהִקְרַבְתֶּם
  choice: kumtolea
  rationale: Katika muktadha wa sadaka, hiphili ya קרב humaanisha kuleta au kutoa kitu kama sadaka; “kumtolea” ni asilia katika Kiswahili.
- source_word: אִשֶּׁה
  choice: sadaka inayoteketezwa kwa moto
  rationale: Neno hili la kikuhani hurejelea sadaka inayotolewa kwa kuteketezwa. Tafsiri hii inaeleweka na huepuka kudai kwamba kila sadaka ya aina hii ilikuwa chakula pekee.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: 'Jina la sikukuu: umoja wa kawaida dhidi ya wingi wa neno la Kiebrania'
  choice: Siku ya Upatanisho
  alternative: Siku ya Mapatanisho
  rationale: Kiswahili cha kawaida hutumia jina la umoja, lakini umbo la wingi la כִּפֻּרִים limeonyeshwa katika tanbihi ili ushahidi wa matini usipotee.
- issue: Maana ya kujitesa au kujinyima katika siku hii
  choice: mtajinyima
  alternative: mtajinyenyekeza; mtazitesa nafsi zenu
  rationale: “Mtajinyima” hudumisha maana ya kitendo cha kujinyima bila kuifanya amri hiyo iwe kufunga tu au hali ya ndani pekee.
- issue: Maana ya אִשֶּׁה
  choice: sadaka inayoteketezwa kwa moto
  alternative: sadaka ya chakula
  rationale: Neno hilo linahusiana na utoaji wa sadaka kwa moto. Tafsiri iliyochaguliwa inaweka wazi namna ya kuitoa bila kuingiza tafsiri finyu ya kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya pili imeanza na “Siku hiyo” ili kurejelea kwa uwazi יום...הוא na kufanya mtiririko uwe wa kawaida. “Kusanyiko takatifu” limetumiwa kama istilahi rasmi lakini inayoeleweka, na jina “Yahwe” limehifadhiwa.
