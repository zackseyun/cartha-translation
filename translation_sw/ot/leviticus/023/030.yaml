base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: sw
  text: Na mtu yeyote atakayefanya kazi yoyote siku hii hii, nitamwangamiza mtu huyo kutoka miongoni mwa watu wake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitamkatilia mbali mtu huyo kutoka miongoni mwa watu wake.” Kitenzi cha Kiebrania hapa humaanisha “kuangamiza” au “kusababisha aangamie,” si kitenzi cha kawaida cha “kukatilia mbali,” ingawa maana ya kuondolewa kwa hukumu inahusiana kwa karibu.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: mtu
  rationale: Katika lugha ya kisheria na ya agano, נֶפֶשׁ hapa humaanisha mtu binafsi, si nafsi isiyo ya mwili. “Mtu” ni Kiswahili cha kawaida na kinafaa katika sehemu zote mbili za mstari.
- source_word: תַּעֲשֶׂה
  choice: atakayefanya
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutengeneza; pamoja na מְלָאכָה, “kufanya kazi” ndilo fungu la kawaida na la asili katika Kiswahili.
- source_word: כָּל מְלָאכָה
  choice: kazi yoyote
  rationale: Fungu hili linahusu kila aina ya kazi iliyokatazwa. “Kazi yoyote” linahifadhi maana pana ya כָּל kwa Kiswahili cha kawaida.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: siku hii hasa
  rationale: Nahau עֶצֶם הַיּוֹם inasisitiza wakati unaotajwa. “Siku hii hasa” linaonyesha msisitizo huo kwa njia ya asili na iliyo wazi.
- source_word: וְהַאֲבַדְתִּי
  choice: nitamwangamiza
  rationale: Hiphil ya אבד humaanisha kusababisha aangamie au kuangamiza. “Nitamwangamiza” linaakisi nguvu ya kitenzi hicho moja kwa moja bila kukigeuza kiwe istilahi ya kawaida ya “kumkatilia mbali.”
- source_word: מִקֶּרֶב עַמָּהּ
  choice: kutoka miongoni mwa watu wake
  rationale: Hii ni kauli ya kuondolewa katika jumuiya kwa hukumu. Kiswahili hakihitaji kuiga jinsia ya kisarufi ya kiambishi cha Kiebrania kinachopatana na נֶפֶשׁ.
theological_decisions:
- issue: Aina ya adhabu inayoelezwa na וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ
  choice: nitamwangamiza mtu huyo kutoka miongoni mwa watu wake
  alternative: nitamkatilia mbali mtu huyo kutoka miongoni mwa watu wake
  rationale: Kiebrania kimetumia אבד katika Hiphil, yaani “kuangamiza/kusababisha aangamie,” wala si כרת, kitenzi kinachotumiwa mara nyingi kwa maana ya “kukatilia mbali.” Tafsiri kuu inahifadhi kitenzi halisi, huku tanbihi ikionyesha maana mbadala inayowezekana katika muktadha wa hukumu ya agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “siku hii hasa” unatoa msisitizo bila kuwa wa kizamani; “mtu” huepuka maana potovu ya “nafsi” katika muktadha huu wa kisheria.
