  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: sw
  text: '“Waambie wana wa Israeli, ukisema: ‘Katika mwezi wa saba, siku ya kwanza ya mwezi, mtakuwa na pumziko maalumu, ukumbusho wa sauti kubwa[a], na kusanyiko takatifu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukumbusho wa milio ya pembe.” Neno la Kiebrania linaweza kumaanisha sauti kubwa ya ishara, ikiwemo kelele, shangwe, au milio ya pembe.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa ukaribu usemi wa kifamilia wa Kiebrania, ambao hapa unalitaja kwa pamoja jumuiya ya agano.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: katika mwezi wa saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: siku ya kwanza ya mwezi huo
  rationale: Hutoa maana ya nahau ya Kiebrania, kihalisi ‘siku ya moja ya mwezi,’ kwa Kiswahili cha kawaida.
- source_word: יִהְיֶה לָכֶם
  choice: mtakuwa na
  rationale: Ni njia ya asili ya Kiswahili ya kueleza muundo wa Kiebrania ‘itakuwa kwenu,’ bila kubadili nguvu yake ya wakati ujao.
- source_word: שַׁבָּתוֹן
  choice: pumziko la pekee
  rationale: Hutofautisha siku hii ya kuacha shughuli za kawaida na pumziko la kawaida, huku ikiepuka kuingiza neno lisiloeleweka kirahisi.
- source_word: זִכְרוֹן
  choice: ukumbusho
  rationale: Huwakilisha kitu au adhimisho linalotumika kukumbusha katika muktadha wa ibada.
- source_word: תְּרוּעָה
  choice: mlio mkuu
  rationale: Neno la Kiebrania linaweza kumaanisha sauti kubwa ya ishara, ikiwemo kelele ya watu au milio ya pembe; tafsiri hii pana inalinda utata wake, na tanbihi inaeleza uwezekano wa pembe.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Ni usemi wa kawaida, wenye heshima, kwa mkutano ulioitishwa kwa kusudi takatifu.
theological_decisions:
- issue: Aina ya תְּרוּעָה katika jina la sikukuu
  choice: mlio mkuu
  alternative: milio ya tarumbeta au pembe; shangwe ya sauti kubwa
  rationale: Maandishi ya Kiebrania hayataji chombo moja kwa moja. Tafsiri pana huhifadhi uwezekano wa sauti ya pembe au sauti nyingine kubwa ya ishara badala ya kuamua kimya kimya kuwa ni tarumbeta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaofaa kwa sheria za ibada. Usemi “wana wa Israeli” umehifadhiwa kwa ukaribu na chanzo, huku sentensi nyingine zikiwa za asili katika Kiswahili.
