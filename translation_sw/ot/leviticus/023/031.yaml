lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Msifanye kazi yoyote
  rationale: 'Muundo huu wa katazo unatoa kwa Kiswahili cha kawaida nguvu ya לֹא pamoja na כָּל: hakuna kazi inayopaswa kufanywa, bila kuongeza msisitizo usio lazima.'
- source_word: חֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: חֻקָּה ni agizo au kanuni iliyowekwa; עוֹלָם hapa huonyesha uendelevu wa muda. ‘Agizo la kudumu’ ni la kisheria, wazi, na halilazimishi maana ya kifalsafa ya kutokuwa na mwisho kabisa.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Hii inaonyesha kuwa agizo linawahusu vizazi vinavyofuatana; neno ‘vyote’ linaweka wazi upeo huo kwa Kiswahili cha kawaida.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: kila mahali mtakapoishi
  rationale: מוֹשָׁב inaweza kumaanisha mahali pa kuishi au makazi. Tafsiri hii ni ya asili na inaonyesha kwamba agizo linatumika popote watu watakapoishi.
theological_decisions:
- issue: Muda wa agizo katika sheria ya ibada
  choice: agizo la kudumu
  alternative: agizo la milele
  rationale: עֹולָם inaweza kueleza jambo la kudumu au linaloendelea kwa muda usioainishwa. ‘La kudumu’ huhifadhi uzito wa agizo bila kuamua kimya-kimya kwamba neno hilo lazima limaanishe kutokuwa na mwisho kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Katazo limetolewa moja kwa moja, huku istilahi ya kisheria na uwezekano wa maana za maneno עוֹלָם na מוֹשָׁב vikihifadhiwa kwa tanbihi.
