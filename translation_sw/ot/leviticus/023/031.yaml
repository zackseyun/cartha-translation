  text: Msifanye kazi yoyote. Hili ni agizo la kudumu[a] katika vizazi vyenu vyote, katika makazi yenu yote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “agizo la milele.” Kirai cha Kiebrania חֻקַּת עוֹלָם hutumia עוֹלָם, neno linaloweza kumaanisha muda wa kudumu au wa milele.
