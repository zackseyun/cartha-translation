id: LEV.23.11
reference: Leviticus 23:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: sw
  text: Naye atautikisa mganda mbele za Yahweh ili mkubaliwe[a]; siku inayofuata Sabato, kuhani atautikisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya kukubaliwa kwenu.” Kirai cha Kiebrania kinaweza kumaanisha kwamba waabudu wanakubaliwa mbele za Yahweh kupitia sadaka hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: Naye atautikisa
  rationale: Kitenzi cha Hifili kutoka נוּף hapa kinaeleza tendo la ibada la kutikisa au kuwasilisha sadaka; “atautikisa” linahifadhi tendo hilo bila kulifafanua kupita kiasi.
- source_word: הָעֹמֶר
  choice: mganda
  rationale: Katika muktadha huu עֹמֶר ni mganda wa mavuno ya kwanza unaoletwa kwa ibada, si kipimo cha nafaka tu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Hii ni nahau ya kawaida ya kuwasilisha kitu katika uwepo wa Mungu; jina la agano יְהוָה limeandikwa “Yahweh.”
- source_word: לִרְצֹנְכֶם
  choice: ili mkubaliwe
  rationale: Kirai hiki kinaonyesha kukubaliwa kwa waabudu mbele za Yahweh kupitia sadaka. Tafsiri hii ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa muundo wa nomino.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: siku inayofuata Sabato
  rationale: Tafsiri hii inaonyesha wazi siku iliyo baada ya Sabato na kuepuka usemi wa Kiswahili unaoweza kueleweka kama siku mbili baadaye.
- source_word: יְנִיפֶנּוּ
  choice: atautikisa
  rationale: Kitenzi cha ibada kimerudiwa, na kiambishi cha kitu “-u-” kinarejelea mganda.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika sheria za ibada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִרְצֹנְכֶם katika muktadha wa sadaka
  choice: ili mkubaliwe
  alternative: kwa ajili ya kukubaliwa kwenu
  rationale: Kirai kinaweza kueleza kukubaliwa kwa watu kupitia sadaka. Tafsiri kuu ni ya kawaida na inaeleweka, huku mbadala wa karibu zaidi na muundo wa Kiebrania ukiwekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. “Mganda” na “atautikisa” huhifadhi picha halisi ya ibada; mpangilio wa sentensi umewekwa wa kawaida bila kuondoa urudiaji wa Kiebrania.
