  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: sw
  text: Musa akawatangazia wana wa Israeli[a] nyakati zilizowekwa za Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli,” au kwa mapokeo “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akawatangazia
  rationale: Katika sentensi hii ya muhtasari, kitenzi kinaonyesha Musa aliwajulisha watu nyakati hizo rasmi. “Akawatangazia” ni cha asili katika Kiswahili pamoja na yambwa inayofuata, bila kupanua maana kupita kiasi.
- source_word: מֹעֲדֵי
  choice: nyakati zilizowekwa
  rationale: Neno מוֹעֵד linahusu nyakati au mikutano iliyowekwa. Katika Walawi 23 linajumuisha kalenda nzima takatifu, hata Sabato, hivyo “nyakati zilizowekwa” ni pana na sahihi kuliko “sikukuu.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶל
  choice: -wa- katika “akawatangazia”
  rationale: Kihusishi kinaonyesha walioelekezewa tangazo. Kiswahili cha asili huwasilisha uhusiano huo kwa kiambishi cha yambwa -wa- katika kitenzi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inadumisha kwa uwazi usemi wa Kiebrania wenye maana halisi ya “wana wa Israeli,” huku ikiwa lugha ya Kiswahili yenye hadhi inayofahamika.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu la herufi nne. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa מֹעֲדֵי katika sura hii
  choice: nyakati zilizowekwa
  alternative: sikukuu zilizowekwa
  rationale: Sura inahusu ratiba ya nyakati takatifu kwa upana, ikiwemo Sabato; kwa hiyo “sikukuu” ingeweza kupunguza upeo wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa wa asili kwa Kiswahili, na “Basi” inaonyesha kuwa mstari huu ni hitimisho la maelezo yaliyotangulia.
