base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: sw
  text: Ni Sabato ya pumziko kamili kwenu[a], nanyi mtajitesa. Siku ya tisa ya mwezi, jioni, kuanzia jioni hadi jioni[b], mtashika Sabato yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtajinyenyekeza” au “mtajinyima.” Nahau ya Kiebrania inahusu kujitesa kwa kuonyesha toba, jambo ambalo kwa desturi lilihusishwa na kufunga.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kuanzia jioni hadi jioni”; usemi huu unaonyesha muda wa maadhimisho kulingana na jinsi Waisraeli walivyohesabu siku.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabato ya pumziko kamili
  rationale: Muundo wa nomino mbili unasisitiza kukoma na kupumzika kabisa. Tafsiri hii ni ya kawaida kwa Kiswahili na inahifadhi nguvu ya usemi wa Kiebrania bila kuingiza wazo la ‘adhimu’ ambalo si kiini cha maneno hayo.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: nanyi mtajitesa
  rationale: Kitenzi ענה katika muktadha huu wa ibada humaanisha mtu kujinyima au kujitesa kwa toba, jambo lililohusishwa na kufunga. ‘Mtajitesa’ ni tafsiri ya moja kwa moja zaidi na haifanyi kufunga kuwa maana pekee.
- source_word: נַפְשֹׁתֵיכֶם
  choice: nafsi zenu, iliyotafsiriwa kiurejeshi katika ‘mtajitesa’
  rationale: Katika nahau hii נֶפֶשׁ humaanisha mtu mwenyewe, si lazima ‘roho’ isiyo ya mwili. Muundo wa kiurejeshi ni wa asili zaidi katika Kiswahili.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: Siku ya tisa ya mwezi, jioni
  rationale: Huhifadhi mpangilio wa Kiebrania na huonyesha kuwa maadhimisho yanaanza jioni ya siku ya tisa, kuelekea siku ya kumi kwa namna ya kuhesabu siku katika Israeli.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: tangu jioni hadi jioni
  rationale: Hii inafuata maneno ya Kiebrania kwa karibu. ‘Tangu’ huonyesha mwanzo wa kipindi, bila kubadili ‘jioni’ kuwa ‘machweo’ kwa tafsiri ya ufafanuzi.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: mtaishika Sabato yenu
  rationale: Kitenzi שבת pamoja na ‘Sabato yenu’ kina maana ya kuadhimisha au kushika pumziko hilo. ‘Mtaishika’ ni nahau ya kawaida ya Kiswahili na huepuka usemi mgumu wa neno kwa neno kama ‘mtapumzika pumziko lenu.’
theological_decisions:
- issue: Maana ya kujitesa katika muktadha wa ibada
  choice: Kuhifadhi amri pana ‘mtajitesa’ katika matini kuu
  alternative: mtajinyenyekeza; mtajinyima; mtafunga
  rationale: Kiebrania hakisemi wazi ‘mtafunga’ katika aya hii, ingawa kufunga kulihusishwa na tendo hilo. Tafsiri pana huhifadhi upeo na mvutano wa matini bila kuifanya desturi moja kuwa maana yake yote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Sabato’ imehifadhiwa kama istilahi ya kibiblia inayotambulika; ‘pumziko kamili’ huweka wazi mkazo wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
