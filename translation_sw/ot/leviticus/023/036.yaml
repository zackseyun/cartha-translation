source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: sw
  text: Kwa siku saba mtamtolea Yahwe sadaka inayotolewa kwa moto[a]. Siku ya nane mtakuwa na kusanyiko takatifu, na mtamtolea Yahwe sadaka inayotolewa kwa moto. Hili ni kusanyiko maalumu[b]; msifanye kazi yoyote ya kawaida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya moto.” Neno la Kiebrania אִשֶּׁה ni istilahi ya kawaida ya dhabihu inayotolewa kwa njia ya moto.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania עֲצֶרֶת humaanisha kusanyiko maalumu au la sherehe. Katika muktadha wa siku ya nane, linaweza kuhusishwa na hitimisho la sikukuu.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: mtamtolea
  rationale: Katika muktadha wa dhabihu, Hiphil ya קרב humaanisha kuleta au kutoa sadaka. “Kumtolea” ni Kiswahili cha kawaida na hudumisha wazo la kumwelekezea Yahwe sadaka.
- source_word: אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Neno hili la kikuhani huonyesha sadaka inayotolewa kwa njia ya moto. Tafsiri hii huepuka “sadaka ya chakula,” ambayo kwa Kiswahili inaweza kueleweka kimakosa kuwa sadaka ya nafaka, na pia huepuka kuifanya kuwa sawa moja kwa moja na sadaka ya kuteketezwa nzima.
- source_word: לַיהוָה
  choice: kwa Yahwe / Yahwe
  rationale: Kiambishi ל huonyesha anayepokea au anayewekewa wakfu sadaka. Muundo wa Kiswahili “kumtolea Yahwe” unawasilisha uhusiano huo kwa kawaida.
- source_word: מִקְרָא קֹדֶשׁ
  choice: kusanyiko takatifu
  rationale: Kirai hiki cha sikukuu humaanisha mkutano mtakatifu ulioitishwa rasmi. “Kusanyiko takatifu” ni sahihi, wazi, na chenye hadhi.
- source_word: עֲצֶרֶת
  choice: kusanyiko maalumu la mwisho
  rationale: Neno linaweza kumaanisha kusanyiko maalumu lenye zuio la kazi na, katika muktadha huu, kusanyiko la kuhitimisha sikukuu. Tafsiri hii inatoa maana ya kimuktadha bila kudai kwamba etimolojia yake ina maana moja tu.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: kazi yoyote ya kawaida
  rationale: Kirai hiki hukataza kazi ya kawaida ya shughuli au ajira wakati wa sikukuu, si lazima kila tendo lolote. “Kazi yoyote ya kawaida” huwasilisha tofauti hiyo kwa Kiswahili cha sasa.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Siku ya nane
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati.
- source_word: יִהְיֶה לָכֶם
  choice: mtakuwa na
  rationale: Muundo wa kuwepo היה pamoja na ל umetafsiriwa kwa Kiswahili cha kawaida huku ukihifadhi wajibu unaowekwa kwa jumuiya.
- source_word: שִׁבְעַת יָמִים
  choice: Kwa siku saba
  rationale: “Kwa siku saba” huonyesha wazi muda ambao utoaji wa sadaka unatakiwa kuendelea.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Aina ya sadaka inayomaanishwa na אִשֶּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula; sadaka ya kuteketezwa
  rationale: אִשֶּׁה ni istilahi pana ya kikuhani, wala si lazima sadaka ya nafaka au sadaka inayoteketezwa nzima. Tafsiri iliyochaguliwa hailazimishi aina mahususi ya sadaka ambayo maandishi hayajataja.
- issue: Maana ya עֲצֶרֶת
  choice: kusanyiko maalumu la mwisho
  alternative: kusanyiko la heshima; kusanyiko maalumu
  rationale: Katika siku ya nane, neno linaonyesha kusanyiko maalumu la kuhitimisha, lakini pia lina uhusiano na kujizuia, hasa kutofanya kazi. Tanbihi inadumisha uwezekano huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na wazi kwa usomaji wa hadhara. “Sadaka inayotolewa kwa moto” imetumiwa badala ya “sadaka ya chakula” ili kuepuka kuchanganya אִשֶּׁה na sadaka ya nafaka, na badala ya “sadaka ya kuteketezwa” ili kuepuka kuilinganisha kimakosa na aina mahususi ya sadaka inayoteketezwa nzima.
