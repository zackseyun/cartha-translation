  verdict: revise
  source_fidelity: The draft accurately represents the seven-day offerings, the eighth-day sacred assembly, the repeated offering to Yahwe, and the prohibition of ordinary work. However, “la mwisho” adds an explicit concluding sense not stated by עֲצֶרֶת in this verse. While the eighth-day context may suggest a concluding observance, the Hebrew noun itself should not be made more specific in the main text.
  naturalness: The Swahili is clear, modern, and suitable for public reading. “Kusanyiko takatifu,” “sadaka inayotolewa kwa moto,” and “kazi yoyote ya kawaida” are natural and appropriately formal.
  terminology: “Yahwe” consistently renders the divine name. “Sadaka inayotolewa kwa moto” appropriately conveys אִשֶּׁה without conflating it with a specific offering type. “Kusanyiko maalumu” is a more source-controlled rendering of עֲצֶרֶת than “kusanyiko maalumu la mwisho.”
  issues:
  - severity: medium
    issue: The phrase “kusanyiko maalumu la mwisho” adds “la mwisho” to עֲצֶרֶת.
    rationale: The source calls it an עֲצֶרֶת but does not lexically say “final” or “last.” Its placement on the eighth day supplies the context, but the translation should retain the noun’s broader sense in the text and, if desired, note the possible concluding association in a footnote.
  - severity: low
    issue: Footnote b presents “kusanyiko linalofunga sikukuu” too categorically.
    rationale: This explanatory wording extends beyond the lexical content of עֲצֶרֶת. A revised note should identify the term as a special or solemn assembly and present any concluding association as contextual rather than as the term’s required meaning.
