base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: sw
  text: 'Waambie wana wa Israeli: “Siku ya kumi na tano ya mwezi huu wa saba ni Sikukuu ya Vibanda[a] kwa Yahwe kwa siku saba.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikukuu ya Makao ya Muda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Waambie wana wa Israeli
  rationale: Muundo wa Kiswahili ‘waambie’ unawasilisha kwa kawaida amri ya kusema na kishazi cha kunukuu לֵאמֹר. ‘Wana wa Israeli’ huhifadhi namna ya msemo wa Kiebrania, ingawa katika muktadha unawahusu Waisraeli kwa ujumla.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: Siku ya kumi na tano ya mwezi huu wa saba
  rationale: Huu ni mpangilio wa kawaida wa tarehe katika Kiswahili na unahifadhi kiwakilishi ‘huu’ kilichomo katika chanzo.
- source_word: חַג הַסֻּכּוֹת
  choice: Sikukuu ya Vibanda
  rationale: סֻכּוֹת ni vibanda au makao ya muda. ‘Vibanda’ ni tafsiri ya moja kwa moja na inafaa kama jina la sikukuu; njia nyingine ya kueleza maana imewekwa katika tanbihi.
- source_word: שִׁבְעַת יָמִים
  choice: kwa muda wa siku saba
  rationale: Kishazi hiki kinaonyesha muda wa sikukuu kwa Kiswahili cha kawaida bila kubadili idadi.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kihusishi ל kinaonyesha kwamba sikukuu imewekwa wakfu kwa Yahwe. ‘Kwa ajili ya’ huwasilisha uhusiano huo kwa kawaida, huku jina la agano likitafsiriwa wazi kuwa ‘Yahwe’.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu la herufi nne. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Jina la sikukuu סֻכּוֹת
  choice: Sikukuu ya Vibanda
  alternative: Sikukuu ya Makao ya Muda
  rationale: ‘Vibanda’ hufuata maana ya neno la Kiebrania kwa ufupi. Tanbihi inatoa namna ya kueleza kusudi la vibanda hivyo bila kuyafanya kuwa maskani ya kudumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maagizo ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa moja kwa moja baada ya jina la sikukuu inayohusika.
