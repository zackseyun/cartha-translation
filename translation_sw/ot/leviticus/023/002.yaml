base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: sw
  text: '“Nena na wana wa Israeli[a], uwaambie: ‘Nyakati za Yahweh zilizowekwa[b], ambazo mtazitangaza kuwa mikutano mitakatifu[c]—hizi ndizo nyakati zangu zilizowekwa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa Israeli”; huu ni msemo wa kawaida wa agano unaowarejelea watu wa Israeli kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au “majira yaliyowekwa.” Neno la Kiebrania linaweza kumaanisha nyakati au matukio matakatifu yaliyowekwa, si karamu au sikukuu pekee.
    reason: lexical_alternative
  - marker: c
    text: Au “makusanyiko matakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: Nena na wana wa Israeli
  rationale: “Nena na” hudumisha agizo la moja kwa moja na hadhi ya muktadha wa kisheria. “Wana wa Israeli” linaakisi msemo wa kawaida wa agano, huku tanbihi ikifafanua matumizi yake ya kijumla.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Hii ni Kiswahili cha kawaida na fasaha kwa mfuatano wa Kiebrania “na useme kwao,” bila kurudia kwa namna nzito.
- source_word: מוֹעֲדֵי
  choice: nyakati ... zilizowekwa
  rationale: מוֹעֵד humaanisha wakati au tukio lililowekwa. Tafsiri hii haifupishi maana kuwa karamu au sikukuu pekee, hasa kwa kuwa Sabato pia inatajwa katika sura hii.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limewasilishwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: ambazo mtazitangaza
  rationale: Katika muktadha huu קרא ni kutangaza rasmi au kuitisha hadharani, si kuita kwa jina tu.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: makusanyiko matakatifu
  rationale: Msemo huu unaonyesha mikusanyiko ya ibada iliyoitishwa rasmi na kutengwa kuwa mitakatifu.
- source_word: אֵלֶּה הֵם מוֹעֲדָי
  choice: hizi ndizo nyakati zangu zilizowekwa
  rationale: “Hizi ndizo” huhifadhi mkazo wa muundo אֵלֶּה הֵם, na kiambishi cha nafsi ya kwanza katika מוֹעֲדָי kimewakilishwa kwa “zangu.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: “Yahweh” huhifadhi jina binafsi lililo katika maandishi bila kulibadilisha kuwa cheo au kuingiza upendeleo wa kimadhehebu.
- issue: Iwapo מוֹעֲדֵי ipunguzwe maana kuwa sikukuu
  choice: nyakati zilizowekwa
  alternative: sikukuu; sherehe
  rationale: Neno la Kiebrania lina wigo mpana zaidi, na muktadha unaohusisha Sabato unapinga kulifanya lirejelee sherehe au karamu pekee.
- issue: Jinsi ya kuwasilisha בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Tafsiri inadumisha umbo la msemo wa agano wa Kiebrania, huku tanbihi ikionyesha kwamba hapa unawahusu watu wa Israeli kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. “Nena” linaweka uzito wa agizo la kisheria, ilhali “uwaambie” ni la kawaida na huepusha urudiaji mgumu. Mpangilio wa sentensi unafuata mfuatano na mkazo wa Kiebrania.
