  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: sw
  text: Hata hivyo, siku ya kumi na tano ya mwezi wa saba, mkiisha kukusanya mazao ya nchi, mtaadhimisha sikukuu[a] ya Yahwe kwa siku saba. Siku ya kwanza kutakuwa na pumziko takatifu[b], na siku ya nane kutakuwa na pumziko takatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sikukuu ya hija.” Neno la Kiebrania linaweza kumaanisha maadhimisho ya sikukuu, mara nyingi sikukuu iliyohusisha hija.
    reason: lexical_alternative
  - marker: b
    text: Au “pumziko la Sabato.” Neno la Kiebrania linaonyesha pumziko maalumu linalohusiana na maadhimisho matakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Hapa neno hili linaonyesha mpito wenye kiasi cha utofautishaji kutoka maagizo yaliyotangulia kwenda kwenye wakati na utaratibu mahsusi wa sikukuu.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: siku ya kumi na tano ya mwezi wa saba
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutaja tarehe, huku ukihifadhi usahihi wa kalenda ya Kiebrania.
- source_word: בְּאָסְפְּכֶם
  choice: mtakapokuwa mmekusanya
  rationale: Muundo huu unaonyesha mazingira ya wakati; tafsiri hii pia huonyesha kwamba ukusanyaji wa mavuno unakuwa umetimizwa wakati wa maadhimisho.
- source_word: תְּבוּאַת הָאָרֶץ
  choice: mazao ya nchi
  rationale: תְּבוּאָה linahusu mazao au pato la ardhi kwa upana, si nafaka pekee.
- source_word: תָּחֹגּוּ אֶת חַג
  choice: mtaadhimisha sikukuu
  rationale: Kitenzi חגג na nomino חג vinahusu kuadhimisha sikukuu, mara nyingi sikukuu iliyohusisha hija; usemi huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kihusishi “kwa” kinaeleza muda wa maadhimisho kwa Kiswahili cha kawaida.
- source_word: שַׁבָּתוֹן
  choice: mapumziko matakatifu
  rationale: Neno linaonyesha kusitisha shughuli kwa namna maalumu inayohusiana na ibada; “matakatifu” linaonyesha tabia yake ya kidini bila kulifanya moja kwa moja kuwa Sabato ya kila juma.
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: na siku ya nane pia
  rationale: Tafsiri hii inahifadhi kutajwa wazi kwa siku ya nane; “pia” huwasilisha kwa kawaida kurudiwa kwa sharti lilelile la mapumziko.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo, bila kuingiza dai la kimadhehebu.
- issue: Maana ya שַׁבָּתוֹן katika sheria ya sikukuu
  choice: mapumziko matakatifu
  alternative: pumziko la Sabato; mapumziko kamili; siku ya mapumziko
  rationale: Neno linamaanisha pumziko maalumu la kidini, lakini kulitafsiri tu kuwa “Sabato” kungeweza kulifanya litambulike isivyofaa na Sabato ya kila juma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa tarehe na sentensi umefanywa wa asili bila kuondoa mpito wa אַךְ, ukamilifu wa ukusanyaji wa mazao, au tofauti kati ya siku saba za sikukuu na mapumziko ya siku ya nane.
