base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: sw
  text: Siku mtakapoutikisa mganda[a], mtamtolea Yahwe mwana-kondoo dume wa mwaka mmoja asiye na dosari kuwa sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “omeri”; hapa neno hili linaelekea linamaanisha mganda uliowasilishwa katika ibada, wala si kipimo cha vitu vikavu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: mtamtolea
  rationale: Katika muktadha wa dhabihu, עשה hutumiwa kwa maana ya kuandaa au kutoa dhabihu. “Mtamtolea” ni Kiswahili cha kawaida kinachoonyesha tendo la kumtolea Yahwe dhabihu.
- source_word: בְּיוֹם
  choice: Siku
  rationale: Kirai hiki cha wakati kinaelezwa kwa kawaida katika Kiswahili kwa “Siku,” kikitambulisha wakati wa tendo linaloamriwa.
- source_word: הֲנִיפְכֶם
  choice: mtakapoutikisa
  rationale: Kitenzi נוף katika Hiphil kinaeleza tendo maalumu la kiibada la kutikisa kitu mbele za Yahwe. “Kutikisa” kinahifadhi picha na istilahi ya ibada.
- source_word: הָעֹמֶר
  choice: mganda
  rationale: Katika muktadha huu wa mavuno, עֹמֶר yaelekea ni mganda unaowasilishwa katika ibada, si kipimo cha vitu vikavu tu. Tanbihi inahifadhi uwezekano wa kulitaja kwa jina “omeri.”
- source_word: כֶּבֶשׂ
  choice: mwana-kondoo dume
  rationale: כֶּבֶשׂ hapa ni mwana-kondoo, na jinsia ya kiume inayodokezwa na nomino ya Kiebrania imewekwa wazi kwa “dume.”
- source_word: תָּמִים
  choice: asiye na dosari
  rationale: Katika sheria za dhabihu, תָּמִים humaanisha mnyama asiye na kasoro inayomfanya asifae kutolewa.
- source_word: בֶּן שְׁנָתוֹ
  choice: wa mwaka mmoja
  rationale: Hii ni nahau ya Kiebrania inayoeleza umri wa mnyama. “Wa mwaka mmoja” ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: לְעֹלָה
  choice: kuwa sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya dhabihu inayoteketezwa yote. “Sadaka ya kuteketezwa” ni tafsiri iliyo wazi na inayotambulika.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo; muundo “mtamtolea Yahwe” unaonyesha anayeelekezewa sadaka.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֹמֶר katika ibada ya mavuno
  choice: mganda
  alternative: omeri au kipimo
  rationale: Muktadha unaelekeza kwenye kitu kinachotikiswa katika ibada, yaani mganda. Hata hivyo, kwa kuwa neno hilo pia linaweza kutaja kipimo, mbadala “omeri” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili katika Kiswahili bila kufuta istilahi za kiibada au uwezekano wa maana ya עֹמֶר.
