lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi hiki kinaanzisha tukio jipya la usemi. Katika fomula hii ya kawaida ya Kiebrania, “akasema” ni Kiswahili cha sasa na cha asili, huku “akizungumza” kikiwa kizito zaidi bila kuongeza maana.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kuwa “Yahwe” ili kuhifadhi jina binafsi badala ya kulibadili kuwa cheo.
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi “sema,” Kiswahili sanifu hutumia muundo wa asili “akasema na Musa” kuonyesha mtu aliyeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina משה katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Inahifadhi fomula ya Kiebrania inayotanguliza maneno yanayofuata, ingawa kuna uradidi wa kimakusudi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina hilo la agano, huku “Yehova” likiwa toleo jingine lililozoeleka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kifomula “akasema ... akisema” umehifadhiwa ili kuakisi maandishi ya Kiebrania na kuunganisha mstari huu na hotuba inayoanza katika mstari unaofuata.
