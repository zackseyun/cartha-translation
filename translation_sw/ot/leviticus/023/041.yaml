  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: sw
  text: Mtaadhimisha sikukuu hiyo kwa Yahweh kwa siku saba kila mwaka.[a] Hii ni sheria ya kudumu kwa vizazi vyenu vyote;[b] katika mwezi wa saba mtaadhimisha sikukuu hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “katika mwaka.”
    reason: lexical_alternative
  - marker: b
    text: Au “sheria ya milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: mtaiadhimisha
  rationale: Kitenzi חָגַג humaanisha kuadhimisha au kushika sikukuu, hasa sikukuu ya hija. “Kuadhimisha” ni Kiswahili cha sasa, cha kawaida na chenye hadhi, na marudio ya kitenzi yamehifadhiwa.
- source_word: אֹתוֹ
  choice: -i- (mtaiadhimisha)
  rationale: Kiwakilishi kinarejelea sikukuu inayozungumziwa. Katika Kiswahili kimewakilishwa kwa kiambishi cha yambwa -i- ndani ya kitenzi bila kuongeza nomino isiyokuwapo katika Kiebrania.
- source_word: חַג
  choice: sikukuu
  rationale: חַג ni sikukuu, mara nyingi yenye uhusiano na hija. “Sikukuu” ni neno la kawaida na wazi katika muktadha wa ibada za Walawi.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: 'Kiambishi ל kinaweza kueleza uelekeo au wakfu: sikukuu inaadhimishwa kwa heshima ya Yahweh. “Kwa Yahweh” ni ya asili katika Kiswahili huku ikiacha uwezekano wa kuelewa ‘kwa ajili ya Yahweh.’'
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Kirai kinaonyesha muda wa sikukuu; “kwa siku saba” ni usemi wazi na wa kawaida wa Kiswahili.
- source_word: בַּשָּׁנָה
  choice: kila mwaka
  rationale: Kihalisi ni ‘katika mwaka,’ lakini katika muktadha kinaonyesha marudio ya kila mwaka. “Kila mwaka” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: חֻקַּת עוֹלָם
  choice: sheria ya kudumu
  rationale: חֻקָּה ni agizo au sheria iliyowekwa, na עוֹלָם hapa huonyesha uendelevu. “Sheria ya kudumu” hudumisha nguvu yake bila kulazimisha dai la kifalsafa kuhusu kutokuwa na mwisho kabisa.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu
  rationale: Kirai kinaonyesha kwamba agizo linaendelea kutumika kwa vizazi vinavyofuatana. Tafsiri hii ni ya karibu na chanzo na inaeleweka kwa urahisi.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: katika mwezi wa saba
  rationale: Hiki ni kirai cha wakati kinachotaja wazi mwezi ambao sikukuu inaadhimishwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahweh” huhifadhi jina la agano badala ya kulibadili kuwa cheo.
- issue: Nguvu ya עוֹלָם katika sheria za ibada
  choice: ya kudumu
  alternative: ya milele
  rationale: Neno linaweza kuonyesha uendelevu au kudumu kwa sheria katika mfumo wa agano bila lazima kudai kutokuwa na mwisho kwa maana ya kifalsafa. “Ya kudumu” huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuadhimisha” na “sikukuu” ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi muktadha wa ibada. Jina Yahweh limetumiwa moja kwa moja.
