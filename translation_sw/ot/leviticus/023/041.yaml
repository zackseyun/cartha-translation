  to: Mtaadhimisha sikukuu hiyo kwa Yahweh kwa siku saba kila mwaka.[a] Hii ni sheria ya kudumu kwa vizazi vyenu vyote;[b] katika mwezi wa saba mtaadhimisha sikukuu hiyo.
