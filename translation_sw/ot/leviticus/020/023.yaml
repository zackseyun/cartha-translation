id: LEV.20.23
reference: Leviticus 20:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: sw
  text: Nanyi msifuate desturi[a] za taifa ninalolifukuza kutoka mbele yenu[b], kwa sababu walifanya mambo haya yote, nami nikawachukia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taratibu zilizowekwa” au “sheria.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi zaidi, “ninalolituma liondoke kutoka mbele yenu”; katika muktadha huu maana yake ni kuliondoa au kulifukuza.
    reason: lexical_alternative
  - marker: c
    text: Au, “nikachukizwa sana nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: msifuate
  rationale: Kitenzi hiki kwa asili ni ‘kwenda/kutembea,’ lakini hapa ni nahau inayohusu mwenendo. ‘Msifuate’ huwasilisha kwa Kiswahili cha kawaida wazo la kuishi kwa kufuata taratibu fulani.
- source_word: בְּחֻקֹּת
  choice: desturi
  rationale: Katika muktadha huu neno linamaanisha taratibu au mazoea yaliyowekwa ambayo taifa hilo lilifuata. ‘Desturi’ ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa ‘sheria’ au ‘taratibu zilizowekwa.’
- source_word: הַגּוֹי
  choice: taifa
  rationale: Nomino ya Kiebrania iko katika umoja na inalirejelea kwa pamoja taifa lililokuwa likiondolewa katika nchi.
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: ninalolifukuza kutoka mbele yenu
  rationale: Ingawa kitenzi kinaweza kumaanisha ‘kutuma,’ muundo huu katika muktadha wa nchi unaonyesha kuondoa au kufukuza taifa kutoka mbele ya Israeli.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: kwa sababu walifanya mambo haya yote
  rationale: כִּי inaonyesha sababu, na kirai hiki kinarejelea matendo yaliyokatazwa katika muktadha unaotangulia.
- source_word: וָאָקֻץ בָּם
  choice: nami nikawachukia
  rationale: Kitenzi kinaonyesha hisia kali ya kuchukizwa au kukirihishwa. ‘Nikawachukia’ ni wazi, yenye nguvu, na ya kawaida kwa wasomaji wa Kiswahili; tanbihi inaonyesha maana mbadala ya kuchukizwa sana.
theological_decisions:
- issue: Kuwasilisha hisia kali za Mungu bila kuzipunguza wala kuzifafanua kupita maandishi
  choice: nami nikawachukia
  alternative: nami nikachukizwa sana nao
  rationale: Kiebrania kinaeleza karaha kali ya Mungu kwa taifa lililotenda mambo hayo. Tafsiri inadumisha nguvu hiyo bila kuibadili kuwa kutokubaliana kwa kiwango kidogo au kuongeza maelezo ya kimafundisho yasiyomo katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Msifuate desturi’ limetumiwa badala ya tafsiri ya moja kwa moja ‘msiende katika sheria,’ ambayo ingekuwa ngumu na isiyo ya kawaida katika Kiswahili cha sasa. Mabadiliko kutoka ‘taifa’ katika umoja kwenda ‘walifanya/nikawachukia’ yanahifadhi namna taifa linavyotazamwa kwa pamoja kama watu wake.
