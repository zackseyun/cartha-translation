language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: sw
  text: Kwa hiyo, mtatofautisha kati ya mnyama safi na mnyama najisi, na kati ya ndege najisi na ndege safi. Wala msijifanye[a] kuwa chukizo[b] kwa mnyama, kwa ndege, au kwa kitu chochote kitambaacho juu ya ardhi, ambacho nimekitenga kwa ajili yenu kuwa najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kiebrania husema ‘nafsi zenu’ au ‘watu wenu’; hapa nahau hiyo inamaanisha ‘ninyi wenyewe.’
    reason: lexical_alternative
  - marker: b
    text: Au ‘kuwa wenye kuchukiza.’ Kitenzi cha Kiebrania kinahusiana na kuwa chukizo au kitu cha kuchukiza, wala si kitenzi cha kawaida kinachomaanisha ‘kuwa najisi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: mtatofautisha
  rationale: Hifili ya בדל inaonyesha kuweka au kutambua tofauti. ‘Mtatofautisha’ ni Kiswahili cha kawaida na huhifadhi agizo la kutambua makundi yaliyowekwa tofauti.
- source_word: הַבְּהֵמָה
  choice: mnyama
  rationale: Neno hili hapa linamaanisha mnyama wa nchi kwa upana; ‘mnyama’ ni la kawaida na halilifungi kwa mifugo pekee.
- source_word: הַטְּהֹרָה / הַטְּמֵאָה / הַטָּמֵא / הַטָּהֹר
  choice: safi / najisi
  rationale: Maneno haya yanahifadhi makundi ya kiibada na ya agano katika Mambo ya Walawi bila kuyageuza kuwa maelezo ya afya au maadili pekee.
- source_word: הָעוֹף
  choice: ndege
  rationale: Katika muktadha wa masharti ya vyakula, ‘ndege’ ni tafsiri ya kawaida na inayoeleweka ya עוף.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: wala msijifanye kuwa chukizo
  rationale: Kauli hii huhifadhi maana ya mzizi שׁקץ, yaani kuwa wa kuchukiza au chukizo, na haiuchanganyi na istilahi tofauti ya kuwa najisi.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: msijifanye
  rationale: Ingawa Kiebrania hutaja ‘nafsi zenu’ au ‘watu wenu,’ hapa ni nahau inayowarejelea watu wenyewe; umbo la kujirejelea ni la asili zaidi katika Kiswahili.
- source_word: בַּבְּהֵמָה וּבָעוֹף
  choice: kwa mnyama, kwa ndege
  rationale: ‘Kwa’ huhifadhi wazo la njia au kitu ambacho kingewafanya wawe chukizo bila kuongeza kwa wazi tendo kama kula, ambalo halikutajwa moja kwa moja katika mstari huu.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: au kwa kitu chochote kitambaacho juu ya ardhi
  rationale: ‘Kitambaacho juu ya ardhi’ huwasilisha mwendo wa karibu na ardhi unaodokezwa na רמשׂ na kudumisha upana wa kauli.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם
  choice: ambacho nimewatenga kwa ajili yenu
  rationale: ‘Nimewatenga’ huhifadhi mzizi uleule בדל na wazo la Mungu kuwateulia Israeli makundi haya kuwa tofauti.
- source_word: לְטַמֵּא
  choice: kuwa najisi
  rationale: Hapa infinitivu inaonyesha uainishaji au kusudi; ‘kuwa najisi’ huhifadhi muundo na maana bila kuufanya kuwa hukumu ya maadili.
theological_decisions:
- issue: Lugha ya makundi ya kiibada dhidi ya ufafanuzi wa kimaadili
  choice: safi / najisi kama makundi ya usafi wa kiagano na kiibada
  alternative: takatifu / yenye dhambi, au yenye afya / isiyo na afya
  rationale: Mstari unahusu tofauti zilizoamriwa kwa Israeli katika masharti ya utakatifu na vyakula. ‘Safi/najisi’ huhifadhi mfumo huo bila kuingiza maelezo ya kimaadili au kiafya yasiyotajwa.
- issue: Maana ya נֶפֶשׁ katika אֶת נַפְשֹׁתֵיכֶם
  choice: watu wenyewe, yaani ‘msijifanye’
  alternative: nafsi zenu kama sehemu isiyo ya mwili
  rationale: Katika muundo huu נֶפֶשׁ humaanisha mtu mzima. Tafsiri ya kujirejelea huepuka kuingiza mgawanyo wa mwili na nafsi ambao Kiebrania hakilazimishi hapa.
- issue: Uhusiano kati ya שׁקץ na טמא
  choice: kutofautisha ‘kuwa chukizo’ na ‘kuwa najisi’
  alternative: kutafsiri yote mawili kwa ‘kujitia unajisi’
  rationale: Mstari wenyewe unatumia nyanja mbili za maana. Kuzihifadhi huepusha kufuta mvutano kati ya hali ya kuchukiza na uainishaji wa unajisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umerudia ‘kati ya’ na majina ya makundi ili tofauti iwe wazi. ‘Kwa hiyo’ huunganisha agizo hili na muktadha uliotangulia. Lugha ya ‘safi/najisi’ imehifadhiwa kama istilahi ya kawaida ya Mambo ya Walawi.
