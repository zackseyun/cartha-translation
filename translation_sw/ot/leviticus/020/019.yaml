base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: sw
  text: Usifunue uchi wa dada ya mama yako wala wa dada ya baba yako, kwa maana ameweka wazi mtu wa ukoo wake wa karibu[a]; watabeba uovu wao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mwili wake”; huu ni usemi wa Kiebrania unaomaanisha mtu wa ukoo wa damu, yaani ndugu wa karibu.
    reason: lexical_alternative
  - marker: b
    text: “Watabeba uovu wao” pia inaweza kumaanisha “watabeba hatia yao” au “watapata adhabu kwa ajili ya uovu wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Usifunue uchi wa
  rationale: Nahau ya kisheria ya Kiebrania imehifadhiwa badala ya kufafanuliwa moja kwa moja kuwa kufanya ngono; inaendeleza mtindo na uhusiano wa kifungu hiki na makatazo yanayozunguka.
- source_word: אֲחוֹת אִּמְךָ
  choice: dada ya mama yako
  rationale: Hili ni jina la moja kwa moja na la kawaida la uhusiano huo katika Kiswahili sanifu; huepuka neno pana 'shangazi,' ambalo katika matumizi fulani linaweza lisibainishe upande wa ukoo.
- source_word: וַאֲחוֹת אָבִיךָ
  choice: wala wa dada ya baba yako
  rationale: Muundo huu unadumisha ulinganifu wa mahusiano mawili na kubainisha upande wa baba kwa uwazi.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya katazo bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: שְׁאֵרוֹ
  choice: mtu wa ukoo wake wa karibu
  rationale: Katika muktadha huu שְׁאֵר ni lugha ya undugu wa damu. Tafsiri hii ni ya asili kwa Kiswahili na huwasilisha maana ya kindugu; sitiari halisi ya 'mwili wake' imehifadhiwa katika tanbihi.
- source_word: הֶעֱרָה
  choice: amefunua uchi
  rationale: Kitenzi kina maana ya kuweka wazi au kufunua. Kurudia nahau ya uchi ni wazi na kunaunganisha sababu na katazo.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: watauchukua uovu wao
  rationale: 'Muundo wa kubeba au kuchukua uovu umehifadhiwa ili kuacha wazi upana wa עָוֹן: tendo la uovu, hatia, na matokeo au adhabu yake.'
theological_decisions:
- issue: Mabadiliko kutoka mtenda mmoja katika kishazi cha sababu hadi wahusika wengi katika kishazi cha mwisho
  choice: Kuhifadhi umoja katika 'amefunua ... wake' na wingi katika 'watauchukua uovu wao.'
  alternative: 'Kusawazisha sentensi yote iwe ya wingi: ''wamefunua ... wao; watauchukua uovu wao.'''
  rationale: Kiebrania kina viambishi vya umoja katika שְׁאֵרוֹ na הֶעֱרָה, kisha kitenzi na kiambishi cha wingi katika עֲוֺנָם יִשָּׂאוּ. Kuhifadhi mabadiliko hayo hakuondoi mvutano wa kisheria wa chanzo.
- issue: Iwapo nahau ya kingono ifafanuliwe wazi
  choice: Kuhifadhi 'kufunua uchi.'
  alternative: Kutafsiri 'kufanya ngono na.'
  rationale: Nahau hiyo ni sehemu muhimu ya mtindo wa sheria hizi na inaeleweka kutokana na muktadha; ufafanuzi wa moja kwa moja ungeondoa taswira ya chanzo.
- issue: Maana ya שְׁאֵרוֹ kama sitiari ya mwili au usemi wa undugu
  choice: Kutumia 'mtu wa ukoo wake wa karibu' katika matini na kutaja sitiari halisi katika tanbihi.
  alternative: Kutumia 'mwili wake mwenyewe' katika matini kuu.
  rationale: Kiswahili 'mwili wake mwenyewe' kinaweza kusikika kana kwamba kinarejelea mwili wa mtenda binafsi badala ya ndugu wa damu. Tafsiri ya ukoo huwasilisha maana katika muktadha bila kuficha namna halisi ya usemi, ambayo imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. 'Dada ya mama/baba' imetumiwa kwa usahihi wa uhusiano wa ukoo. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
