  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: sw
  text: Mwanamume akilala na mwanamke wakati wa unajisi wake wa hedhi na kufunua uchi wake—ameweka wazi chemchemi yake[a], naye mwanamke ameifunua chemchemi ya damu yake—wote wawili watakatiliwa mbali kutoka miongoni mwa watu wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “ameweka wazi chanzo chake.” “Chemchemi” ni tasfida ya Kiebrania inayorejelea chanzo cha mtiririko wa damu ya hedhi.
    reason: lexical_alternative
  - marker: b
    text: “Watakatiliwa mbali” ni fomula ya kawaida ya kisheria katika Torati; mstari huu hauelezi jinsi kuondolewa huko kunavyotekelezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni ya kiume, na katika muktadha huu sheria inamtaja mshiriki wa kiume hasa.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: atalala na mwanamke
  rationale: Ni nahau ya Kiebrania inayomaanisha kujamiiana; Kiswahili hiki kinahifadhi nahau ya kisheria huku maana ikibainishwa na muktadha.
- source_word: דָּוָה
  choice: wakati wa unajisi wake wa hedhi
  rationale: Neno linamhusu mwanamke aliye katika hali ya unajisi wa kiibada kwa sababu ya hedhi, si ugonjwa wa kawaida tu.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: kufunua uchi wake
  rationale: Inahifadhi nahau ya kawaida ya Walawi kuhusu kufunua kingono kuliko kuibadilisha moja kwa moja kuwa maelezo ya kitabibu.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: ameweka wazi chemchemi yake
  rationale: מָקוֹר maana yake ya msingi ni chanzo au chemchemi; hapa ni tasfida ya chanzo cha mtiririko wa damu. Tanbihi inaeleza taswira bila kuiondoa katika matini.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: naye mwanamke ameifunua chemchemi ya damu yake
  rationale: Inahifadhi ulinganifu wa kishairi na kisheria wa sentensi ya Kiebrania na kutaja damu wazi kama chanzo.
- source_word: וְנִכְרְתוּ
  choice: watakatiliwa mbali
  rationale: Hii ni fomula ya kisheria ya Torati. Tafsiri haibainishi ikiwa adhabu ni kifo, kutengwa, au hukumu nyingine, kwa kuwa mstari wenyewe haielezi namna yake.
- source_word: מִקֶּרֶב עַמָּם
  choice: na watu wao
  rationale: Usemi huu wa Kiswahili unaonyesha kuondolewa kutoka katikati ya jumuiya ya watu wao kwa lugha ya kawaida na yenye hadhi.
theological_decisions:
- issue: Hali inayomaanishwa na דָּוָה
  choice: unajisi wake wa hedhi
  alternative: wakati anapokuwa katika hedhi
  rationale: Chaguo kuu linabeba hali ya kiibada inayohusika katika sheria za Walawi, huku tanbihi ikitoa namna ya kawaida zaidi ya kueleza hali hiyo.
- issue: Maana ya adhabu ya וְנִכְרְתוּ
  choice: watakatiliwa mbali
  alternative: watauawa; wataondolewa katika jumuiya; watakufa bila uzao
  rationale: Kiebrania kinatumia fomula yenye maana pana bila kutaja hapa jinsi kuondolewa huko kunavyotekelezwa; hivyo utata halisi umehifadhiwa.
- issue: Taswira ya מָקוֹר
  choice: chemchemi
  alternative: chanzo; mtiririko
  rationale: Maana halisi ya 'chemchemi/chanzo' imehifadhiwa katika matini, huku tanbihi ikieleza kuwa ni tasfida inayohusiana na mtiririko wa damu ya hedhi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau za kisheria na za mwili zimehifadhiwa pale zinapobeba taswira ya Kiebrania, huku tanbihi zikifafanua bila kutatua utata usiotatuliwa na matini.
