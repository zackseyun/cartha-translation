base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: sw
  text: 'Nawe utawaambia wana wa Israeli: “Mtu yeyote, awe ni miongoni mwa wana wa Israeli au ni mgeni anayeishi Israeli[a], atakayetoa mmoja wa uzao wake[b] kwa Moleki[c], hakika atauawa. Watu wa nchi watampiga kwa mawe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Mgeni” hapa ni mgeni mkazi anayeishi miongoni mwa Israeli. Kiebrania hutumia nomino na kitenzi vyenye mzizi mmoja: kwa karibu, “mgeni anayekaa kama mgeni.”'
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “uzao” maana yake halisi ni “mbegu”; hapa linarejelea wazao au watoto wa mtu.
    reason: lexical_alternative
  - marker: c
    text: Moleki huenda ni jina au cheo cha mungu aliyehusishwa kwa kawaida na kuwatoa watoto dhabihu. Baadhi ya wataalamu hulielewa neno hilo kuwa aina fulani ya sadaka badala ya jina la mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi usemi wa Kiebrania kwa namna rasmi na inayoeleweka katika Kiswahili cha Biblia, badala ya kuufupisha kuwa “Waisraeli.”
- source_word: אִישׁ אִישׁ
  choice: mtu yeyote
  rationale: Urudiaji huu wa nomino una maana ya mgawanyo, yaani kila mtu anayehusika. “Mtu yeyote” ni Kiswahili cha kawaida na sahihi katika sheria hii.
- source_word: הַגֵּר הַגָּר
  choice: mgeni anayeishi Israeli
  rationale: גֵּר ni mgeni mkazi, si msafiri wa muda mfupi. Tafsiri hii inaonyesha hali yake ya kuishi ndani ya Israeli, ingawa haiwezi kurudia kwa kawaida mzizi uleule wa nomino na kitenzi kama Kiebrania.
- source_word: יִתֵּן מִזַּרְעוֹ
  choice: atakayetoa yeyote wa uzao wake
  rationale: זֶרַע maana yake ya msingi ni “mbegu,” lakini hapa humaanisha uzao au watoto. “Yeyote wa uzao wake” inadumisha upana wa neno bila kuingiza maelezo ambayo hayajasemwa wazi katika mstari huu.
- source_word: לַמֹּלֶךְ
  choice: kwa Moleki
  rationale: Inafuata uelewa wa kawaida wa neno hili kama jina au cheo cha mungu Moleki, huku tanbihi ikihifadhi uwezekano wa kulielewa kama aina ya sadaka.
- source_word: מוֹת יוּמָת
  choice: hakika atauawa
  rationale: Muundo wa Kiebrania wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza adhabu ya kifo. “Hakika atauawa” huhifadhi msisitizo na hali ya kutendwa.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Tafsiri hii ya karibu na Kiebrania inarejelea jamii ya nchi inayotekeleza hukumu, bila kulifanya kuwa jina la tabaka maalumu la kijamii.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: watampiga kwa mawe
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kupigwa kwa mawe hadi kufa, huku ikihifadhi chombo kilichotajwa wazi katika Kiebrania.
theological_decisions:
- issue: Maana ya tendo linalohusishwa na Moleki
  choice: Maandishi yanasema kutoa mtu wa uzao wake kwa Moleki bila kuongeza maelezo ya namna tendo hilo lilivyofanywa.
  alternative: Kulifafanua moja kwa moja kuwa kumtoa mtoto dhabihu kwa moto, au kulichukulia “moleki” kuwa jina la aina fulani ya sadaka.
  rationale: Muktadha mpana wa Biblia huhusisha Moleki na tendo zito la ibada linalowahusu watoto, lakini mstari huu wenyewe hautaji moto wala kueleza utaratibu wake. Tafsiri kuu kwa hiyo inabaki karibu na Kiebrania, na tanbihi inahifadhi mjadala kuhusu maana ya Moleki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandishi ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “awe ni ... au ni ...” unaonyesha kwa kawaida kwamba sheria inawahusu Waisraeli na wageni wakazi sawasawa. Msisitizo wa adhabu umehifadhiwa kwa “hakika atauawa,” na lugha haijaongeza “kwa moto” au “dhabihu” katika maandishi makuu.
