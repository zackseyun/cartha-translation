review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the two legal categories, the command to observe and do them, the destination land, and the purpose/result warning. However, “kuwapika nje” means “cook them outside,” not “vomit them out,” and therefore fails to render the central metaphor of וְלֹא תָקִיא.
  naturalness: The sentence is otherwise clear, formal, and natural Standard East African Swahili. Replacing the erroneous verb with “isiwatapike” yields an idiomatic, vivid personification without adding an unnecessary equivalent of “out,” which is inherent in the verb’s expulsion image.
  terminology: “Sheria zangu” and “hukumu zangu” preserve the source’s distinct legal terms adequately. “Kuzitenda” appropriately renders carrying them out. “Nchi” and “kuishi humo” are suitable in this context.
  issues:
  - severity: high
    issue: “isije ikawapika nje” mistranslates the Hebrew verb תָקִיא.
    rationale: Kiswahili “kupika” means to cook. The Hebrew קיא means “vomit”; the personified-land metaphor must be retained as “kutapika,” not replaced by an unrelated action.
  revised_text: Kwa hiyo, mtazishika sheria zangu zote na hukumu zangu zote, na kuzitenda[b], ili nchi ninayowaleta kuishi humo isiwatapike[a].
  revised_footnotes:
