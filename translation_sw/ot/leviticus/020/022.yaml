  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: sw
  text: Kwa hiyo, mtazishika sheria zangu zote na hukumu zangu zote, na kuzitenda[b], ili nchi ninayowaleta kuishi humo isiwatapike[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “isiwatapike nje.” Kitenzi cha Kiebrania kihalisi ni “kutapika”; ni sitiari kali ya nchi kuwafukuza wakazi waliotiwa unajisi.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “maagizo yangu yote na sheria zangu zote.” Kiebrania kinatumia istilahi mbili tofauti za kisheria: חֻקּוֹת na מִשְׁפָּטִים.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kwa hiyo, mtazishika
  rationale: Kitenzi שׁמר katika muktadha wa agano na sheria humaanisha kushika au kutii kwa uangalifu. Kiunganishi וּ kinaunganisha agizo hili na maonyo yaliyotangulia; “Kwa hiyo” huonyesha uhusiano huo huku wakati ujao wa Kiswahili ukiwasilisha nguvu ya agizo.
- source_word: חֻקֹּתַי
  choice: sheria zangu
  rationale: חֻקָּה ni agizo au sheria iliyowekwa. “Sheria” ni neno la kawaida, lenye heshima na linaloeleweka, huku likitofautishwa na “hukumu” kwa מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: hukumu zangu
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, uamuzi wa kisheria, au amri ya haki. “Hukumu” huhifadhi istilahi ya kisheria na tofauti yake na חֻקּוֹת.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: na kuzitenda
  rationale: עשה ikiwa na sheria kama yambwa humaanisha kuzifanya au kuzitekeleza. “Kuzitenda” ni Kiswahili cha asili na huhifadhi wito wa utekelezaji, si kusikia tu.
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: isije ikawapika nje
  rationale: קיא humaanisha kutapika. “Kuwapika nje” huhifadhi sitiari kali ya nchi kuwafukuza wakazi wake kama kitu kinachotapikwa; “isije” huwasilisha onyo la kusudi au matokeo bila kulifanya kuwa ahadi isiyo na masharti.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: אֶרֶץ hapa ni nchi maalumu ambayo Mungu anawapeleka, si dunia kwa ujumla. “Nchi” ni ya kawaida zaidi katika Kiswahili cha Afrika Mashariki kwa eneo la kuishi.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: ninayowaleta
  rationale: Kauli ya Kiebrania humtaja Mungu akiwa katika tendo la kuwaleta kwenye nchi hiyo. Muundo huu wa Kiswahili ni wa asili na hauhitaji kurudia kielezi “huko,” ambacho tayari kinadokezwa.
- source_word: לָשֶׁבֶת בָּהּ
  choice: kuishi humo
  rationale: ישׁב hapa humaanisha kukaa au kuishi katika nchi. “Kuishi humo” ni Kiswahili cha sasa, wazi, na huhifadhi kiwakilishi kinachoirejelea nchi.
theological_decisions:
- issue: Sitiari ya nchi kuwatapika wakazi wake
  choice: Nchi imewasilishwa kana kwamba inaweza “kuwapika nje” wakazi waliotiwa unajisi.
  alternative: Nchi isiwafukuze au isiwakatae.
  rationale: Chanzo kinatumia sitiari hai ya kutapika. Kuihifadhi huonyesha uzito wa unajisi, hukumu, na kufukuzwa katika muktadha wa agano bila kuipunguza kuwa kauli ya jumla.
- issue: Tofauti kati ya חֻקּוֹת na מִשְׁפָּטִים
  choice: “sheria” na “hukumu”
  alternative: “maagizo” na “sheria”
  rationale: Kiebrania kinatumia istilahi mbili tofauti za kisheria. Tafsiri inazibakiza kuwa maneno mawili tofauti bila kudai mipaka ya maana iliyo mikali kuliko ushahidi wa chanzo.
- issue: Nguvu ya וְלֹא תָקִיא baada ya agizo
  choice: “ili ... isije ikawapika nje”
  alternative: “nayo haitawatapika nje”
  rationale: Muundo unaweza kubeba wazo la kusudi au matokeo yanayotarajiwa baada ya kutii. “Ili ... isije” huhifadhi hali ya onyo na uhusiano wake na agizo, bila kuugeuza kuwa ahadi ya moja kwa moja isiyo na masharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuishi humo” ni cha kawaida kuliko “kukaa ndani yake,” huku “kuwapika nje” ikihifadhi picha kali ya Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
