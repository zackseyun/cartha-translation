  verdict: revise
  source_fidelity: The draft accurately preserves the conditional legal formulation, the distinction between mwanamume (אִישׁ) and mtu wa kiume (זָכָר), the act-focused wording, the dual responsibility, and the intensified passive death penalty. The final blood-responsibility idiom is best retained without the added reflexive ‘wenyewe,’ which is not required by the Hebrew.
