  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: sw
  text: Ikiwa mwanamume analala na mtu wa kiume kama alalavyo na mwanamke[a], wote wawili wamefanya chukizo. Hakika watauawa; damu yao iko juu yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “malalo ya mwanamke,” nahau inayomaanisha kujamiiana na mwanamke.
    reason: lexical_alternative
  - marker: b
    text: Au, “hatia ya damu iko juu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Ikiwa mwanamume
  rationale: Katika muundo huu wa sheria, kishazi kina maana ya sharti. “Ikiwa mwanamume” ni Kiswahili cha kawaida na sahihi kuliko tafsiri ya moja kwa moja “na mwanamume ambaye.”
- source_word: יִשְׁכַּב אֶת
  choice: analala na
  rationale: Katika muktadha huu kitenzi שׁכב pamoja na אֶת ni nahau ya kujamiiana. “Analala na” huhifadhi nahau ya Kiebrania bila kuongeza istilahi ya kisasa isiyokuwamo katika matini.
- source_word: זָכָר
  choice: mtu wa kiume
  rationale: זָכָר humaanisha “wa kiume/mume,” tofauti na אִישׁ, “mwanamume.” Usemi huu unahifadhi tofauti hiyo ya kileksika kwa Kiswahili kinachoeleweka.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: kama alalavyo na mwanamke
  rationale: Wingi wa moja kwa moja, “malalo ya mwanamke,” si wa kawaida kwa Kiswahili. Tafsiri hii hutoa maana ya nahau huku ikibaki karibu na taswira ya kulala ya matini.
- source_word: תּוֹעֵבָה
  choice: chukizo
  rationale: “Chukizo” huhifadhi uzito wa neno la kimaadili na kiagano תּוֹעֵבָה na pia linafaa katika mtindo wa Biblia wa Kiswahili.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: wote wawili wamefanya
  rationale: Tafsiri hii huhifadhi msisitizo wa wazi kwamba washiriki wote wawili wamefanya tendo linalotajwa.
- source_word: מוֹת יוּמָתוּ
  choice: Hakika watauawa
  rationale: Muundo wa kitenzi-jina kamili pamoja na kitenzi cha kauli ya kutendwa unasisitiza adhabu. “Hakika watauawa” huhifadhi msisitizo huo na kauli ya kutendwa bila kuongeza mhusika anayetekeleza adhabu.
- source_word: דְּמֵיהֶם בָּם
  choice: damu yao iko juu yao wenyewe
  rationale: Hii huhifadhi nahau ya Kiebrania inayowawekea wahusika wenyewe wajibu wa kifo chao, huku “wenyewe” ikionyesha nguvu ya בָּם.
theological_decisions:
- issue: Kutafsiri katazo la kisheria linalobishaniwa kimaadili na kitamaduni
  choice: Matini imetafsiriwa kama maelezo ya tendo mahususi, bila kutumia kategoria za kisasa za utambulisho.
  alternative: Kutumia maneno mapana kama “matendo ya ushoga” au istilahi za utambulisho wa kisasa.
  rationale: Kiebrania kinaeleza tendo katika mfumo wa sheria, si utambulisho wa mtu. Hivyo tafsiri haiupanui wala kuupunguza upeo wa matini.
- issue: Kutofautisha אִישׁ na זָכָר
  choice: “mwanamume” kwa אִישׁ na “mtu wa kiume” kwa זָכָר
  alternative: Kutumia “mwanamume” kwa maneno yote mawili.
  rationale: Chaguo hili linahifadhi tofauti ya maneno ya Kiebrania kadiri Kiswahili cha kawaida kinavyoruhusu, bila kubadili lugha yenye jinsia ya matini.
- issue: Maana ya דְּמֵיהֶם בָּם
  choice: “damu yao iko juu yao wenyewe,” yaani wajibu wa kifo chao uko kwao
  alternative: “hatia ya damu yao iko juu yao,” ambayo inaweza kusisitiza zaidi dhana ya hatia ya damu.
  rationale: Nahau yenyewe imehifadhiwa katika matini kuu ili kutofunga kabisa uwezekano wake wa maana; tanbihi inaeleza maana mbadala ya kisheria na kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sheria, lugha yenye jinsia, ukali wa neno “chukizo,” na msisitizo wa adhabu vimehifadhiwa bila kuingiza istilahi za kisasa za utambulisho au maelezo ya kimadhehebu.
