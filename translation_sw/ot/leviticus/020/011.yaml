base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: sw
  text: Ikiwa mwanamume akilala na mke wa baba yake, amefunua uchi wa baba yake[a]. Wote wawili hakika watauawa; damu yao itakuwa juu yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya kueleza zaidi: “amemvunjia baba yake heshima kwa tendo la ngono.” Kiebrania kinasema moja kwa moja, “amefunua uchi wa baba yake,” nahau inayotumiwa katika Walawi kwa tendo la ngono lililokatazwa.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “damu yao iko juu yao,” fomula ya kisheria inayoonyesha kwamba wao wenyewe wanawajibika kwa kifo chao.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Ikiwa mwanamume
  rationale: Katika sheria hii, muundo huo unatambulisha hali ya sharti. “Ikiwa mwanamume” ni Kiswahili cha kawaida na huhifadhi mhusika wa kiume aliyetajwa wazi.
- source_word: יִשְׁכַּב אֶת
  choice: atalala na
  rationale: Hii ni nahau ya kujamiiana katika sheria za ngono. “Atalala na” huhifadhi usemi wa staha na wa kisheria bila kuwa wa kitabibu kupita kiasi.
- source_word: אֵשֶׁת אָבִיו
  choice: mke wa baba yake
  rationale: Hufuata maneno ya Kiebrania moja kwa moja na huepuka kuyafanya kuwa “mama wa kambo,” neno ambalo ni jembamba zaidi kuliko chanzo.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: amefunua uchi wa baba yake
  rationale: Huhifadhi nahau maalumu ya Walawi na uhusiano wake na sheria nyingine za sura ya 18 na 20, badala ya kuifafanua kimadhehebu au kuipunguza kuwa fedheha ya jumla.
- source_word: מוֹת יוּמְתוּ
  choice: hakika watauawa
  rationale: Muundo wa Kiebrania unasisitiza adhabu ya kifo. “Hakika watauawa” huonyesha msisitizo huo bila kutaja njia ya kuwaua ambayo haikutajwa.
- source_word: שְׁנֵיהֶם
  choice: wote wawili
  rationale: Huhifadhi msisitizo kwamba hukumu inawahusu washiriki wote wawili.
- source_word: דְּמֵיהֶם בָּם
  choice: damu yao iko juu yao
  rationale: Huhifadhi fomula ya kisheria inayoweka wajibu wa kifo chao juu yao wenyewe.
theological_decisions:
- issue: Kutafsiri nahau ya kosa la kingono bila kupoteza maana yake ya kikanoni
  choice: amefunua uchi wa baba yake
  alternative: amemvunjia baba yake heshima kingono
  rationale: Usemi wa chanzo ni nahau ya kudumu katika sheria za utakatifu. Kuuhifadhi kunadumisha uhusiano na vifungu vingine na kutolazimisha ufafanuzi mmoja.
- issue: Jinsia ya mhusika wa sheria
  choice: Ikiwa mwanamume
  alternative: Ikiwa mtu yeyote
  rationale: Kiebrania kinamtaja mwanamume kwa uwazi, na kosa linaloelezwa linamhusu mhusika huyo wa kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo wa kisheria na nahau kuu ya Kiebrania zimehifadhiwa, huku tanbihi zikifafanua maana bila kuondoa mvutano wa usemi wa chanzo.
