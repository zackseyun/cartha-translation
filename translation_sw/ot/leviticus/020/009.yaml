base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: sw
  text: Kwa maana mtu yeyote[a] anayemlaani baba yake au mama yake ni lazima auawe; amemlaani baba yake na mama yake[b]; damu yake iko juu yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa kurudia, “mtu, mtu,” usemi wenye maana ya “mtu yeyote” au “yeyote.”
    reason: lexical_alternative
  - marker: b
    text: Au “baba yake au mama yake.” Kiebrania kinasema “na”; katika maana ya kisheria, kumlaani mzazi yeyote kati ya hao wawili kunaleta adhabu hiyo.
    reason: lexical_alternative
  - marker: c
    text: Au “hatia ya damu yake iko juu yake.” Usemi huu wa Kiebrania unamaanisha kwamba yeye mwenyewe anawajibika kwa kifo chake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza mtiririko wa sheria kwa kutoa msingi wa adhabu inayotajwa, bila kuifanya sentensi iwe sharti la kawaida tu.
- source_word: אִישׁ אִישׁ
  choice: mtu yeyote
  rationale: 'Urudiaji wa nomino ni usemi wa Kiebrania wenye maana ya mgawanyo: kila mmoja anayehusika, yaani mtu yeyote.'
- source_word: יְקַלֵּל
  choice: anayemlaani
  rationale: Hali ya piel ya קלל hapa humaanisha kumtamkia mtu laana, si kukosa tu kumheshimu.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: baba yake au mama yake
  rationale: Ingawa Kiebrania kina kiunganishi ‘na,’ ‘au’ huonyesha wazi maana ya kisheria kwamba kumlaani mzazi yeyote kati ya hao wawili kunaleta adhabu hiyo.
- source_word: מוֹת יוּמָת
  choice: ni lazima auawe
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unasisitiza adhabu; tafsiri hii inadumisha maana ya lazima na hali ya kutendwa katika hukumu ya kisheria.
- source_word: קִלֵּל
  choice: amemlaani
  rationale: Wakati timilifu unaonyesha kosa lililokwisha kutendwa ambalo ndilo msingi wa hukumu iliyotangazwa.
- source_word: דָּמָיו בּוֹ
  choice: damu yake iko juu yake
  rationale: Huu ni usemi wa kisheria unaomwekea mkosaji mwenyewe wajibu wa kifo chake, huku ukihifadhi taswira ya Kiebrania.
theological_decisions:
- issue: Usemi wa mgawanyo אִישׁ אִישׁ
  choice: mtu yeyote
  alternative: kila mtu
  rationale: ‘Mtu yeyote’ huwasilisha maana ya kimwakilishi ya usemi huo kwa Kiswahili cha kawaida bila kudai kwamba sheria inawahusu wanaume pekee.
- issue: Kauli ya wajibu דָּמָיו בּוֹ
  choice: damu yake iko juu yake
  alternative: hatia ya damu yake iko juu yake
  rationale: Tafsiri hii inahifadhi kauli ya kisheria na sitiari ya asili bila kuingiza mafundisho ya baadaye kuhusu upatanisho au hatia ya kimetafizikia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Ni lazima auawe’ linaonyesha hukumu ya kisheria na msisitizo wa Kiebrania; ‘damu yake iko juu yake’ linahifadhi sitiari ya chanzo na mvutano wake wa kisheria.
