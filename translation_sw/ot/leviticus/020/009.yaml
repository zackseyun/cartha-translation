  terminology: Maneno muhimu—“laani,” “baba,” “mama,” “auawe,” na “damu yake iko juu yake”—ni sahihi na thabiti. Tanbihi zinafafanua kwa kiasi kinachohitajika tu maana ya urudiaji wa Kiebrania, tofauti ya “na/au,” na usemi wa damu bila kuongeza tafsiri ya kimafundisho.
