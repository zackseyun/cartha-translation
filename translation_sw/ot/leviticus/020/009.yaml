  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: usemi wa mgawanyo אִישׁ אִישׁ umewekwa kama “mtu yeyote,” יְקַלֵּל kama “anayemlaani,” adhabu ya מוֹת יוּמָת kwa hali ya kutendwa, na kanuni ya uwajibikaji דָּמָיו בּוֹ imehifadhiwa kwa sitiari ya “damu yake iko juu yake.” Matumizi ya “au” katika tukio la kwanza yanaonyesha ipasavyo athari ya kisheria inayomhusu anayemlaani mzazi mmoja; tanbihi inaweka wazi kwamba Kiebrania chenyewe kina “na.”'
