  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Katika fomula hii ya kuanzisha usemi, kitenzi cha Kiswahili “sema” ni cha kawaida na cha asili; wakati uliopita wa kusimulia unaendelezwa kwa kiambishi “aka-”.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne YHWH limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Pamoja na kitenzi “sema,” Kiswahili sanifu hutumia “sema na” kwa anayeelekezewa maneno; tafsiri ya kimofimu “kwa” ingekuwa isiyo ya kawaida hapa.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la jina hili lililozoeleka katika Kiswahili sanifu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Neno hili linaendeleza fomula ya utangulizi wa maneno yatakayofuata; “akisema” huhifadhi muundo huo kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina na huepuka kulibadilisha kimya kimya kuwa cheo, huku tanbihi ikieleza desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kifungu umehifadhi fomula ya Kiebrania ya kuanzisha usemi, hata ingawa “akasema … akisema” ina marudio ya kimakusudi.
