id: LEV.20.7
reference: Leviticus 20:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִ֨תְקַדִּשְׁתֶּ֔ם וִ/הְיִיתֶ֖ם קְדֹשִׁ֑ים כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: sw
  text: Jitakaseni[a], nanyi muwe watakatifu, kwa sababu mimi ni Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Jiwekeni wakfu” au “Jifanyeni watakatifu.” Kitenzi cha Kiebrania kina maana ya kujirejelea na kinawaita Waisraeli wajishughulishe kikamilifu na kujitakasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Jitakaseni
  rationale: Kauli ya Kiebrania ya hitpael ina maana ya kujielekeza kwa vitendo katika utakaso; “jitakaseni” ni amri ya kujirejelea, ya asili katika Kiswahili, na haitangulii tu hali ya kuwa watakatifu iliyo katika kishazi kinachofuata.
- source_word: וִהְיִיתֶם
  choice: nanyi muwe
  rationale: Baada ya amri iliyotangulia, kitenzi hiki kina nguvu ya amri ya pili iliyoratibiwa; “nanyi muwe” kinaonyesha wazi mwendelezo huo bila kukifanya kishazi cha kusudi.
- source_word: קְדֹשִׁים
  choice: watakatifu
  rationale: Neno hili hudumisha uzito wa kimaadili, wa kiagano, na wa kitheolojia wa קדושׁ; “waliotengwa” lingeonyesha sehemu moja tu ya maana.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי linatoa msingi wa amri, hivyo “kwa sababu” linaonyesha wazi uhusiano wa kisababishi katika Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa אֱלֹהִים lina umbo la wingi, katika muktadha huu linamtaja Mungu mmoja wa Israeli; kiambishi kinawakilisha nafsi ya pili wingi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi kwa tahajia ya kawaida ya Kiswahili, bila kulibadilisha kuwa cheo; “Yehova” ni umbo jingine la kimapokeo.
- issue: Uhusiano kati ya kujitakasa na kuwa watakatifu
  choice: 'Amri mbili zilizoratibiwa: “Jitakaseni, nanyi muwe watakatifu”'
  alternative: “Jitakaseni ili muwe watakatifu”
  rationale: Kiunganishi cha Kiebrania kinaratibu vitenzi hivi na hakisemi wazi kwamba cha pili ni kusudi au matokeo ya cha kwanza. Tafsiri haipaswi kutatua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jitakaseni” ni rahisi kueleweka na huhifadhi nguvu ya amri ya kujirejelea; “nanyi” huweka uratibu wa kishazi cha pili wazi. Alama ya tanbihi [a] imewekwa katika matini.
