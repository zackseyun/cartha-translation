  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: sw
  text: Na mtu yeyote atakayewaendea waaguzi wa mizimu na wachawi[a], kwa kujifanya kahaba kwa kuwafuata[b], nitauweka uso wangu dhidi ya mtu huyo, nami nitamkatilia mbali kutoka kati ya watu wake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye mizimu” kwa “waaguzi wa mizimu.” Istilahi hizi mbili za Kiebrania zinarejelea watendaji wanaohusishwa na mizimu au maarifa ya siri; tofauti kamili kati yao si wazi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kutokuwa mwaminifu kwa Mungu kwa kuwafuata; Kiebrania kinatumia sitiari ya kujifanya kahaba.
    reason: metaphor_explanation
  - marker: c
    text: “Kumkatilia mbali” ni fomula ya kawaida ya kisheria; hapa maandishi hayasemi wazi adhabu hiyo ingetimizwa kwa njia gani.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: mtu yeyote
  rationale: Katika sheria za Walawi, נֶפֶשׁ humaanisha mtu binafsi, si hasa nafsi isiyo ya mwili. “Mtu yeyote” ni Kiswahili cha kawaida na kinaonyesha kuwa hukumu inamhusu mtu binafsi.
- source_word: תִּפְנֶה
  choice: atakayewaendea
  rationale: Kitenzi פנה kina picha ya kumgeukia au kumwendea mtu ili kutafuta msaada wake. “Atakayewaendea” ni cha kawaida katika muktadha huu na hakifuti kabisa picha hiyo.
- source_word: הָאֹבֹת
  choice: waaguzi wa mizimu
  rationale: אוֹב hapa humrejelea mtaalamu anayehusishwa na kuitafuta mizimu au roho za wafu. “Waaguzi wa mizimu” kinaeleweka kwa wasomaji wa kisasa na kinaonyesha aina ya shughuli inayokusudiwa.
- source_word: הַיִּדְּעֹנִים
  choice: wapiga ramli
  rationale: יִדְּעֹנִי humaanisha watendaji wanaodai maarifa ya siri ya kiroho, na mara nyingi huambatana na אוֹב. “Wapiga ramli” linaitofautisha na istilahi ya kwanza bila kulifanya neno kuwa la dhehebu fulani.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: ili kufanya ukahaba kwa kuwafuata
  rationale: זנה ni sitiari yenye nguvu ya ukahaba au kutokuwa mwaminifu kwa agano. Tafsiri inadumisha sitiari hiyo badala ya kuipunguza kuwa kutotii tu; “kwa kuwafuata” linaonyesha maana ya אַחֲרֵיהֶם.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: nitauelekeza uso wangu dhidi ya mtu huyo
  rationale: Hii inadumisha taswira ya Kiebrania ya Mungu kuuelekeza uso wake dhidi ya mtu katika hukumu, huku ikiwa sentensi inayoeleweka kwa Kiswahili.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: na kumkatilia mbali
  rationale: כרת ni fomula ya kisheria yenye maana ya kukatiliwa mbali, lakini namna hasa ya adhabu haijaelezwa hapa. “Kumkatilia mbali” inadumisha ukali na uwazi huo usiokamilika.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: kutoka miongoni mwa watu wake
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya fomula ya kuondolewa katika jumuiya ya watu wake.
theological_decisions:
- issue: Kudumisha sitiari ya ukahaba kwa kutokuwa mwaminifu kwa agano
  choice: ili kufanya ukahaba kwa kuwafuata
  alternative: ili kukosa uaminifu kwa kuwafuata
  rationale: Kiebrania kinatumia wazi זנה, neno la ukahaba linalotumiwa kisitiari kwa uasi wa kiroho. Kudumisha sitiari kunahifadhi uzito wa kitheolojia wa kosa hilo.
- issue: Maana kamili ya adhabu ya kukatiliwa mbali
  choice: na kumkatilia mbali
  alternative: na kumwangamiza / na kumfukuza
  rationale: Aya haisemi wazi ikiwa kukatiliwa mbali ni kifo, hukumu nyingine ya Mungu, au kuondolewa katika jumuiya. Tafsiri haipaswi kuchagua kimyakimya mojawapo ya maelezo hayo.
- issue: Taswira ya Mungu kuuelekeza uso wake dhidi ya mtu
  choice: nitauelekeza uso wangu dhidi ya mtu huyo
  alternative: nitampinga mtu huyo
  rationale: Kuhifadhi uso kama sitiari kunadumisha lugha halisi ya hukumu ya Mungu bila kuibadili kuwa kauli ya jumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Sitiari za Kiebrania za “uso” na “ukahaba” zimedumishwa, huku tanbihi zikifafanua maana bila kuondoa utata halisi wa kifungu.
