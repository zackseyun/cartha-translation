base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: sw
  text: Mwanamume au mwanamke aliye mtu anayewasiliana na roho[a] au mtu anayefanya uaguzi kwa roho[b] hakika atauawa. Watawapiga kwa mawe. Damu yao iko juu yao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye na roho ya uaguzi.” Neno la Kiebrania אוֹב linaweza kumaanisha roho inayohusishwa na desturi za kuwasiliana na wafu au, kwa upanuzi, mtu anayewasiliana nayo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania יִדְּעֹנִי humaanisha mtu anayehusishwa na uaguzi au kutafuta maarifa kupitia roho; wakati mwingine limetafsiriwa “mchawi.”
    reason: lexical_alternative
  - marker: c
    text: “Damu yao iko juu yao” ni formula ya kisheria inayoonyesha kwamba wanawajibika kwa kifo chao.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: Mwanamume au mwanamke
  rationale: Inahifadhi kutajwa wazi kwa jinsia zote mbili katika Kiebrania, huku kiunganishi cha mwanzo kikiachwa kwa kuwa si lazima katika mtiririko wa kawaida wa Kiswahili.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: akiwa
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa hali inayomhusu mtu aliyetajwa. Maelezo ya Kiebrania ya kitu kuwa ‘ndani yao’ yanahusiana na utata wa maneno yanayofuata, ambao umehifadhiwa katika tanbihi.
- source_word: אוֹב
  choice: mwasiliani na roho za wafu
  rationale: Neno hili linaeleza kwa uwazi kazi ya mpatanishi anayehusishwa na kuitafuta habari kutoka kwa wafu, bila kutumia neno la kizamani au lenye maana pana mno. Tanbihi inahifadhi uwezekano kwamba neno la Kiebrania humaanisha roho yenyewe.
- source_word: יִדְּעֹנִי
  choice: mwaguzi wa roho
  rationale: Linadumisha uhusiano wa neno hili na maarifa ya siri yanayotafutwa kupitia roho na kulitofautisha na neno אוֹב, bila kulazimisha uainishaji kamili wa desturi hiyo ya kale.
- source_word: מוֹת יוּמָתוּ
  choice: hakika atauawa
  rationale: ‘Hakika’ linawakilisha msisitizo wa muundo wa Kiebrania wa infinitivu kamili pamoja na kitenzi, na ‘atauawa’ linaonyesha wazi adhabu ya kifo.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: Watu wawapige kwa mawe mpaka wafe
  rationale: Linaonyesha njia ya utekelezaji—kupigwa kwa mawe—kwa Kiswahili cha kawaida. ‘Mpaka wafe’ linafafanua maana ya tendo hilo katika muktadha wa hukumu ya kifo bila kubadili hukumu yenyewe.
- source_word: דְּמֵיהֶם בָּם
  choice: Damu yao iko juu yao wenyewe
  rationale: Linahifadhi taswira na muundo wa formula ya kisheria ya Kiebrania badala ya kuibadili moja kwa moja kuwa ‘wana hatia.’ Tanbihi inaeleza maana yake ya kuwajibika kwa kifo chao.
theological_decisions:
- issue: Jinsi ya kutafsiri maneno ya desturi za kuwasiliana na roho
  choice: mwasiliani na roho za wafu na mwaguzi wa roho
  alternative: mwenye pepo wa wafu na mchawi
  rationale: Chaguo hili linaeleza desturi zinazohukumiwa kwa lugha ya sasa bila kuingiza taswira za kubuni au kudai uainishaji wa kina ambao maandishi hayatoi. Utata wa neno אוֹב kati ya roho na mtu anayewasiliana nayo umeonyeshwa katika tanbihi.
- issue: Kutajwa kwa mwanamume na mwanamke
  choice: Mwanamume au mwanamke
  alternative: mtu yeyote
  rationale: Kiebrania kinataja jinsia zote mbili waziwazi; tafsiri inahifadhi muundo huo badala ya kuufupisha.
- issue: Formula ya damu na wajibu wa kifo
  choice: Damu yao iko juu yao wenyewe
  alternative: Wana hatia ya kusababisha kifo chao wenyewe
  rationale: Muundo wa kitamathali wa Kiebrania umehifadhiwa katika maandishi makuu, huku maana yake ya kisheria ikielezwa katika tanbihi bila kuondoa uzito au mvutano wa kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zinatumia maneno yanayoeleweka kwa wasomaji wa kawaida, huku formula ya kisheria ya mwisho na utata wa istilahi za Kiebrania zikihifadhiwa kwa msaada wa tanbihi.
