base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: sw
  text: Ikiwa mwanamume akilala na mke wa mwanawe, wote wawili watauawa hakika. Wamefanya tendo la upotovu[a]; damu yao iko juu yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tendo la aibu,” “jambo la kuchukiza,” au “tendo linalovuruga mpangilio.” Neno la Kiebrania תֶּבֶל linaonyesha tendo lililopotoka kimaadili katika muktadha huu wa sheria.
    reason: lexical_alternative
  - marker: b
    text: Au “hatia ya damu yao iko juu yao.” Nahau hii ya Kiebrania inaonyesha kwamba wao wenyewe wanawajibika kwa kifo chao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Ikiwa mwanamume
  rationale: Katika muundo huu wa sheria ya kesi, kishazi hiki kinaanzisha sharti. “Ikiwa mwanamume” ni Kiswahili cha kawaida kinachohifadhi mhusika wa kiume wa Kiebrania.
- source_word: יִשְׁכַּב אֶת
  choice: atalala na
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kufanya ngono. “Atalala na” huhifadhi nahau hiyo na inaeleweka katika muktadha bila kutumia lugha ya mtaani.
- source_word: כַּלָּתוֹ
  choice: mke wa mwanawe
  rationale: כַּלָּה hapa ni mke wa mwana wa mwanamume huyo. Kauli hii ni sahihi zaidi kuliko “mkwe wake,” ambalo linaweza kuwa na maana pana katika Kiswahili.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: wote wawili lazima wauawe
  rationale: Muundo wa kitenzi jina pamoja na kitenzi kilichopinda unasisitiza hukumu ya kifo. “Lazima wauawe” huwasilisha nguvu ya kisheria, na “wote wawili” hutaja wazi wahusika wote.
- source_word: תֶּבֶל עָשׂוּ
  choice: wamefanya tendo la upotovu
  rationale: תֶּבֶל hueleza tendo lililopotoka au lililovuruga mpangilio wa maadili katika sheria hii. “Tendo la upotovu” huhifadhi uzito wake wa kimaadili bila kulifafanua kupita kiasi.
- source_word: דְּמֵיהֶם בָּם
  choice: damu yao iko juu yao
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania inayowahusisha wahalifu wenyewe na wajibu wa kifo chao, badala ya kuibadili kimya kimya kuwa maelezo.
theological_decisions:
- issue: Mhusika wa sheria mwenye jinsia ya kiume
  choice: mwanamume
  alternative: mtu
  rationale: אִישׁ ni nomino ya umoja ya kiume, na uhusiano unaotajwa unamhusu mwanamume na mke wa mwanawe. Tafsiri haifanyi kifungu hiki kuwa kisicho na jinsia.
- issue: Maana ya kimaadili ya תֶּבֶל
  choice: tendo la upotovu
  alternative: tendo la aibu; tendo la kuvuruga mpangilio; jambo la kuchukiza
  rationale: Neno lenyewe linatoa hukumu nzito ya kimaadili lakini lina wigo unaoweza kujumuisha upotovu, vurugu ya mpangilio, au fedheha. Tafsiri kuu ni wazi na yenye heshima, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- issue: Nahau ya damu na wajibu wa adhabu
  choice: damu yao iko juu yao
  alternative: hatia ya damu yao iko juu yao; wao wenyewe wanawajibika kwa kifo chao
  rationale: Kauli ya moja kwa moja huhifadhi picha na mvutano wa nahau ya Kiebrania; tanbihi inaeleza maana yake ya kisheria bila kuifanya kuwa sehemu ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mke wa mwanawe” limetumiwa badala ya “mkwe wake” ili kuondoa utata wa undugu. Nahau “damu yao iko juu yao” imehifadhiwa kwa sababu ni muhimu kwa taswira na maana ya kisheria ya matini, huku tanbihi ikiifafanua.
