base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: sw
  text: Na mtu akimchukua mke wa ndugu yake, ni uchafu; amefunua uchi wa ndugu yake. Watakuwa bila watoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watakufa bila watoto.” Kiebrania, kwa karibu zaidi, husema, “Watakuwa bila watoto,” bila kueleza jinsi hukumu hii itakavyotekelezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: Na mtu aki-
  rationale: Muundo huu unaendeleza sheria zinazotangulia na kuwasilisha sharti la kisheria kwa Kiswahili cha kawaida.
- source_word: יִקַּח
  choice: akimchukua
  rationale: Neno לקח kimsingi ni ‘chukua’; katika muktadha huu lina maana ya kumchukua mwanamke kimahusiano, bila kulazimisha tafsiri mahsusi ya kufunga ndoa.
- source_word: אֵשֶׁת אָחִיו
  choice: mke wa ndugu yake
  rationale: Huu ndio uwasilishaji wa moja kwa moja na wa kawaida wa muundo wa Kiebrania.
- source_word: נִדָּה הִוא
  choice: huo ni uchafu
  rationale: נִדָּה hapa inaelezea tendo au muungano kuwa hali ya unajisi wa kimaadili na kiibada, si kumtaja mwanamke mwenyewe kuwa mchafu.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: amefunua uchi wa ndugu yake
  rationale: Inahifadhi nahau ya kisheria inayotumiwa mara kwa mara katika Mambo ya Walawi kuhusu mahusiano ya ngono yaliyokatazwa.
- source_word: עֲרִירִים יִהְיוּ
  choice: Watakuwa bila watoto
  rationale: Kiebrania kinataja hali ya kutokuwa na watoto kwa wote wawili bila kueleza namna hukumu hiyo itakavyotekelezwa.
theological_decisions:
- issue: Maana ya adhabu עֲרִירִים יִהְיוּ
  choice: Watakuwa bila watoto
  alternative: Watakufa bila watoto
  rationale: Maandishi yanasema moja kwa moja kwamba watakuwa bila watoto, lakini hayasemi wazi kwamba watakufa bila watoto; tafsiri haiongezi utaratibu wa hukumu ambao haukutajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Uchafu’ hapa ni istilahi ya kimaadili na kiibada. Kielezi ‘huo’ kinaelekeza kwenye tendo au muungano, si kwa mwanamke.
