base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: sw
  text: Lakini niliwaambia, ‘Ninyi mtaimiliki[a] nchi yao, nami mwenyewe nitawapa nchi hiyo ili muimiliki’—nchi inayotiririka maziwa na asali.[b] Mimi ni Yahwe[c], Mungu wenu, niliyewatenga[d] na mataifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtairithi nchi yao ... ili muirithi.” Kitenzi cha Kiebrania יָרַשׁ kinaweza kumaanisha kurithi au kutwaa na kumiliki.
    reason: lexical_alternative
  - marker: b
    text: Kauli ya Kiebrania “nchi inayotiririka maziwa na asali” ni nahau inayomaanisha nchi yenye wingi na rutuba.
    reason: cultural_note
  - marker: c
    text: 'Kiebrania: YHWH; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
  - marker: d
    text: Au, “niliyewaweka kando.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lakini niliwaambia
  rationale: Kiunganishi ו kinaendeleza usemi huku muktadha ukionyesha utofautishaji; “Lakini” ni ya asili hapa, na “niliwaambia” linaonyesha wazi kwamba waliosemewa ni wengi.
- source_word: תִּירְשׁוּ ... לָרֶשֶׁת
  choice: mtaimiliki ... ili muimiliki
  rationale: Kitenzi ירשׁ kinaweza kumaanisha kurithi au kutwaa na kumiliki. “Kumiliki” kinafaa kwa ahadi ya nchi na kinadumisha urudiaji wa kitenzi katika Kiebrania.
- source_word: אַדְמָתָם
  choice: nchi yao
  rationale: Ingawa אֲדָמָה linaweza kumaanisha ardhi au udongo, hapa linarejelea eneo ambalo Israeli watalimiliki; “nchi yao” ni wazi na ya kawaida katika Kiswahili.
- source_word: וַאֲנִי אֶתְּנֶנָּה
  choice: nami mwenyewe nitawapa nchi hiyo
  rationale: “Mwenyewe” linahifadhi msisitizo wa kiwakilishi huru אֲנִי, na “nchi hiyo” linaweka wazi kitu kinachorejelewa na kiambishi cha Kiebrania bila utata wa Kiswahili.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: nchi inayotiririka maziwa na asali
  rationale: Hii inadumisha taswira ya nahau ya Kiebrania kuhusu nchi yenye wingi na rutuba.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limeandikwa kwa namna iliyozoeleka katika tahajia ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: הִבְדַּלְתִּי
  choice: niliyewatenga
  rationale: Hifadhi nafsi ya kwanza ya kitenzi cha Kiebrania na wazo la kuwatenganisha au kuwaweka kando, bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: הָעַמִּים
  choice: mataifa mengine
  rationale: “Mataifa” ni tafsiri ya kawaida na inayoeleweka ya עַמִּים katika muktadha wa makundi ya watu yanayoizunguka Israeli; “mengine” linaeleza tofauti inayodokezwa na kutengwa kwa waliosemewa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya kutengwa kwa Israeli na makundi mengine
  choice: niliyewatenga na mataifa mengine
  alternative: niliyewaweka kando kutoka miongoni mwa mataifa
  rationale: Chaguo hili linadumisha mada ya kutenganishwa katika sura hii bila kufafanua zaidi kusudi au hali ya kitheolojia ambayo aya yenyewe haisemi.
- issue: Maana mbili za ירשׁ kuhusu nchi
  choice: mtaimiliki ... ili muimiliki
  alternative: mtairithi ... ili muirithi
  rationale: “Kumiliki” linafaa kwa kuchukua na kushikilia nchi, huku tanbihi ikihifadhi uwezekano halisi wa maana ya “kurithi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa “miliki” umehifadhiwa kwa sababu unaakisi urudiaji wa ירשׁ katika Kiebrania; taswira ya maziwa na asali imeachwa katika matini na kufafanuliwa kwa tanbihi.
