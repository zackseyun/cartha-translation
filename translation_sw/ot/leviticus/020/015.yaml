  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: sw
  text: Mwanamume akifanya tendo la ngono[a] na mnyama, hakika atauawa; nanyi mtamuua mnyama huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “hutoa kulala kwake na mnyama,” nahau inayomaanisha kufanya tendo la ngono.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino hii ni ya kiume katika muktadha huu, na mstari unaofuata unazungumzia kisa cha mwanamke kando; hivyo ‘mwanamume’ inadumisha umahususi wa sheria.
- source_word: אֲשֶׁר
  choice: ikiwa
  rationale: Ingawa kwa kawaida ni kiwakilishi cha uhusiano, hapa katika mtindo wa sheria ya visa maalumu ina nguvu ya sharti, inayowasilishwa kwa kawaida kwa ‘ikiwa’.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: atafanya tendo la ngono
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kushiriki tendo la ngono. Tafsiri hii ni wazi kwa msomaji wa sasa bila kuwa ya matusi.
- source_word: בִּבְהֵמָה
  choice: na mnyama
  rationale: בְּהֵמָה humaanisha mnyama; ‘mnyama’ ni neno la kawaida na wazi katika Kiswahili sanifu.
- source_word: מוֹת יוּמָת
  choice: ni lazima auawe
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichogeuzwa kuwa cha kutendwa unasisitiza adhabu ya kifo. ‘Ni lazima auawe’ huonyesha msisitizo na nguvu ya kisheria kwa Kiswahili cha kawaida.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: nanyi mtamuua mnyama huyo
  rationale: Kitenzi kiko katika nafsi ya pili wingi na kinaelekezwa kwa jamii au wenye mamlaka. ‘Mnyama huyo’ huonyesha kuwa ni yule mnyama aliyetajwa tayari.
theological_decisions:
- issue: Uhusika wa jinsia ya mkosaji
  choice: Mkosaji ametajwa mahsusi kuwa mwanamume.
  alternative: Kutafsiri kwa neno la kijumla kama ‘mtu’.
  rationale: Mstari huu unamtaja mkosaji wa kiume, huku mstari unaofuata ukishughulikia mwanamke kando. Kutumia ‘mtu’ kungefifisha mpangilio na umahususi wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya moja kwa moja, yenye staha na nguvu ya kisheria. ‘Tendo la ngono’ limetumiwa kwa uwazi kuliko tafsiri yenye uwezekano wa kutatanisha ya ‘kulala na’.
