source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: sw
  text: Nanyi mtakuwa watakatifu kwangu, kwa sababu mimi, Yahwe, ni mtakatifu, nami nimewatenga na mataifa[a] ili muwe wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makundi ya watu.” Neno la Kiebrania עַמִּים linaweza kumaanisha “mataifa” au “makundi ya watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: Nanyi mtakuwa
  rationale: Muundo huu unaonyesha kiunganishi cha Kiebrania pamoja na maana ya agano yenye nguvu ya matokeo na wajibu, huku ukibaki wa kawaida katika Kiswahili.
- source_word: לִי קְדֹשִׁים
  choice: watakatifu kwangu
  rationale: ‘Watakatifu’ huhifadhi maana pana ya קדש, inayohusisha utakatifu wa kimaadili na kuwekwa wakfu; ‘kwangu’ huonyesha uhusiano na Yahwe.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hutambulisha wazi msingi wa wito wa Israeli kuwa watakatifu.
- source_word: קָדוֹשׁ
  choice: mtakatifu
  rationale: Huhifadhi ulinganifu wa moja kwa moja kati ya utakatifu wa Yahwe na utakatifu unaotakiwa kwa watu wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la agano la Mungu kwa umbo linalosomeka kwa kawaida katika Kiswahili, badala ya kulibadili kuwa cheo.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: Nimewatenga
  rationale: Hutofautisha kitenzi בדל, ‘kutenga,’ na קדש, ‘kuwa mtakatifu,’ na pia huonyesha tendo lililokamilika lenye umuhimu unaoendelea.
- source_word: מִן הָעַמִּים
  choice: na mataifa[a]
  rationale: Katika Kiswahili, ‘kutenga na mataifa’ ni usemi wa kawaida unaowasilisha kujitenga kutoka kwa vikundi vingine; tanbihi huhifadhi uwezekano wa maana ‘jamii za watu.’
- source_word: לִהְיוֹת לִי
  choice: ili muwe wangu
  rationale: Hueleza kusudi la kutengwa kwao na huhifadhi lugha ya kuwa mali ya agano ya Yahwe kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kuhifadhi maana ya utakatifu wa agano bila kuufanya kuwa usafi wa kimaadili tu au utengano wa kiibada tu
  choice: Kutumia ‘watakatifu/mtakatifu’ kwa קדש na ‘nimewatenga’ kwa בדל
  alternative: Kutafsiri maneno yote mawili kwa ‘kuweka kando’ au kutumia ‘safi’
  rationale: Maneno mawili tofauti katika Kiebrania yanaunganisha utakatifu wa watu na utakatifu wa Yahwe, huku yakitaja pia tendo lao la kutengwa na mataifa. Tafsiri hii huhifadhi tofauti na mvutano huo.
- issue: Uwakilishi wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la agano; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa ili mstari usomeke kwa uwazi bila kupoteza uhusiano wa kimantiki. Kiashiria [a] kimewekwa baada ya neno linalohusika, ‘mataifa.’
