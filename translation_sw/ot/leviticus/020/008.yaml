  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: sw
  text: Nanyi mtazishika sheria zangu na kuzitekeleza. Mimi ni Yahweh, ninayewatakasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninayewafanya kuwa watakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: Nanyi mtazishika
  rationale: Kitenzi שׁמר hapa kina maana ya kushika au kuzingatia masharti ya agano. “Mtazishika” kinahifadhi mtindo wa agizo la Kiebrania, na “Nanyi” kinawakilisha kiunganishi וּ kwa Kiswahili cha kawaida.
- source_word: חֻקֹּתַי
  choice: sheria zangu
  rationale: חֻקָּה humaanisha agizo au sheria iliyowekwa. “Sheria zangu” ni usemi wa kawaida unaohifadhi uzito wa kisheria wa neno hilo.
- source_word: וַ/עֲשִׂיתֶם אֹתָם
  choice: na kuzitekeleza
  rationale: עשה ikiwa na sheria kama yambwa humaanisha kuzifanya kwa vitendo. “Kuzitekeleza” ni Kiswahili cha sasa na cha wazi kuliko tafsiri ya neno kwa neno “kuzitenda,” bila kupunguza wito wa utiifu wa vitendo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina la agano katika maandishi ya Kiebrania.
- source_word: מְקַדִּשְׁכֶם
  choice: ninayewatakasa
  rationale: Umbo la kitenzi cha hali ya kuendelea kutoka קדשׁ linaonyesha tendo la Yahwe la kuwatenga na kuwafanya watu wake wawe watakatifu. “Ninayewatakasa” huhifadhi msamiati wa utakatifu na maana ya tendo linalomtambulisha Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya lugha ya קדשׁ katika muktadha wa agano
  choice: ninayewatakasa
  alternative: ninayewafanya kuwa watakatifu
  rationale: “Ninayewatakasa” huhifadhi istilahi ya kibiblia ya utakaso na pia wazo kwamba Yahwe ndiye anayetenda. Tafsiri mbadala inaweka maana hiyo kwa lugha ya moja kwa moja zaidi, kwa hiyo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa wingi unahifadhi kwamba agizo linaelekezwa kwa jumuiya.
