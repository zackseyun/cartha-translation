base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: sw
  text: Lakini ikiwa watu wa nchi watamfumbia macho kabisa mtu huyo[a], anapomtoa mmoja wa watoto wake[b] kwa Moleki[c], ili wasimuue,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wampuuze kabisa mtu huyo”; nahau ya Kiebrania inasema kihalisi “wafiche macho yao kutoka kwa mtu huyo.”
    reason: lexical_alternative
  - marker: b
    text: Neno “watoto” ni “uzao” kihalisi, na neno la Kiebrania linalotafsiriwa “uzao” pia humaanisha “mbegu.” Hapa linawarejelea watoto wake.
    reason: lexical_alternative
  - marker: c
    text: Moleki huenda ni jina au cheo cha mungu, au linaweza kurejelea aina ya desturi ya kuwatoa watoto kuwa dhabihu; wengine wamelisoma kuwa “mfalme.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: watafumba macho yao kwa makusudi
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kamili unatilia tendo mkazo. Tafsiri hii inadumisha nahau ya Kiebrania ya kufumba macho na pia maana ya kupuuza kwa makusudi.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Katika muktadha huu wa sheria, kirai hiki kinamaanisha watu wa jumuiya au nchi hiyo kwa ujumla, wala si tabaka maalumu la kijamii.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: macho yao ... wasimwone mtu huyo
  rationale: Kiebrania kinasema kihalisi kuficha macho mbali na mtu huyo; Kiswahili hiki kinahifadhi taswira huku kikieleza kwa kawaida tendo la kukataa kumwona na kuchukua hatua dhidi yake.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: anapomtoa mmoja wa watoto wake
  rationale: Kiambishi מִן kina maana ya kuchukua sehemu kati ya wazao wake. ‘Mmoja wa watoto wake’ ni wazi katika Kiswahili na hakidokezi kwamba anawatoa wote.
- source_word: לַמֹּלֶךְ
  choice: kwa Moleki
  rationale: Moleki ni uhawilishaji wa kawaida wa jina au cheo cha mhusika wa ibada aliyekatazwa katika muktadha huu.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: ili wasimuue
  rationale: 'Muundo huu huonyesha kusudi au matokeo ya kupuuzwa kwake: watu hawatekelezi hukumu ya kumuua.'
theological_decisions:
- issue: Maana ya לַמֹּלֶךְ kama mhusika wa ibada
  choice: Moleki
  alternative: mfalme
  rationale: Ingawa konsonanti zinaweza kuhusishwa na neno ‘mfalme,’ muktadha wa Mambo ya Walawi 18:21 na 20:2–5 unaunga mkono jina au cheo cha mhusika wa ibada iliyokatazwa. Uhawilishaji unahifadhi rejeleo bila kulifafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ya kufumba macho imehifadhiwa, huku ‘kwa makusudi’ ikibeba mkazo wa muundo wa Kiebrania. Koma ya mwisho imeachwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
