  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: sw
  text: Ikiwa mwanamke atamkaribia mnyama yeyote ili kujamiiana naye[a], utamwua mwanamke huyo na mnyama huyo. Hakika wote wawili watauawa[b]; damu yao iko juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili alale naye.” Kitenzi cha Kiebrania hapa kinarejelea hasa kujamiiana, kihalisi tendo linalohusisha kumpanda.
    reason: lexical_alternative
  - marker: b
    text: Au, “hatia ya damu yao iko juu yao.” Nahau hii ina maana kwamba wao wenyewe wanawajibika kwa kifo chao.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: atamkaribia
  rationale: Kitenzi קרב humaanisha kuja karibu au kumkaribia. Tafsiri hii inadumisha tendo la kukaribia, huku kusudi la kingono likielezwa na kishazi kinachofuata.
- source_word: כָּל בְּהֵמָה
  choice: mnyama yeyote
  rationale: בְּהֵמָה ni neno pana kwa mnyama, na כָּל hapa hutoa maana ya ‘yeyote.’ Usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: לְרִבְעָה אֹתָהּ
  choice: ili kujamiiana naye
  rationale: Mzizi רבע katika muktadha huu unarejelea wazi tendo la kingono na mnyama, kihalisi likihusisha kumpanda. ‘Kujamiiana naye’ ni wazi, wa heshima, na haifiche maana ya sheria.
- source_word: וְהָרַגְתָּ
  choice: utamuua
  rationale: Katika sheria hii umbo hilo lina nguvu ya agizo. ‘Utamuua’ linadumisha mtindo wa kisheria na linapatana na nafsi ya pili umoja ya Kiebrania.
- source_word: מוֹת יוּמָתוּ
  choice: Hakika wote wawili watauawa
  rationale: Muundo wa infinitivu kamili pamoja na kitenzi kilichonyambuliwa unasisitiza uhakika wa adhabu ya kifo. ‘Hakika ... watauawa’ huhifadhi msisitizo huo; ‘wote wawili’ huweka wazi kuwa mwanamke na mnyama ndio wanaorejelewa.
- source_word: דְּמֵיהֶם בָּם
  choice: damu yao iko juu yao
  rationale: Hii inadumisha sitiari ya Kiebrania badala ya kuitafsiri moja kwa moja kuwa ‘hatia.’ Katika nahau hii, waliohukumiwa wenyewe wanawajibika kwa kifo chao.
theological_decisions:
- issue: Kutafsiri moja kwa moja sheria kali kuhusu kujamiiana na mnyama
  choice: Kusema wazi ‘ili kujamiiana naye’ na kudumisha adhabu ya kifo kama ilivyo katika matini.
  alternative: Kutumia usemi wa kifumbo kama ‘kulala naye,’ au usemi wa kihalisi lakini usio wazi wa kumpanda.
  rationale: Matini ni sheria ya adhabu na haisemi kwa kifumbo kisichoeleweka. Tafsiri inapaswa kuhifadhi uzito na uwazi wake bila kuongeza maelezo ya kimaadili au mafundisho yasiyomo.
- issue: Nahau ya damu kuwa juu ya wahusika
  choice: Kudumisha ‘damu yao iko juu yao’ katika matini na kufafanua uwajibikaji katika tanbihi.
  alternative: Kutafsiri moja kwa moja ‘hatia ya damu yao iko juu yao.’
  rationale: Kiebrania kinadumisha sitiari ya damu, ambayo pia hubeba maana ya uwajibikaji kwa hukumu. Tanbihi huzuia nahau hiyo kueleweka vibaya bila kuondoa mvutano wa lugha asilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi, wa heshima, na wa sasa. ‘Kujamiiana’ huepuka fumbo lisiloeleweka; viwakilishi vya ngeli vimetumiwa kwa kawaida kwa mnyama, na ‘wote wawili’ hufafanua rejeo la wingi.
