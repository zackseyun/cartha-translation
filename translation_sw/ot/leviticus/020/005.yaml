review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal referents, the emphatic divine first person, the broad kinship term, the covenant-judgment idiom, the repeated sexual-infidelity metaphor, Moleki, and the plural sense of “their people.” However, “nitakapomkabili” does not explicitly retain the Hebrew idiom’s hostile direction (“set my face against”), and the repeated clauses about following can be made less ambiguous while retaining their rhetorical repetition.
  naturalness: Most wording is clear Standard East African Swahili. “Nitauweka uso wangu dhidi ya” is a suitably formal, intelligible biblical-register rendering of the source idiom. Explicitly repeating “mtu huyo” in the first following clause prevents a reader from taking Moleki as the antecedent of “kumfuata.”
  terminology: “Jamaa yake,” “kumkatilia mbali,” “ukahaba,” and “Moleki” are appropriate. The note on being cut off should remain anchored to “kumkatilia mbali”; the note on the metaphor should be anchored to the first occurrence of “ukahaba,” rather than to Moleki.
  issues:
  - severity: medium
    issue: The hostile ‘against’ force of וְשַׂמְתִּי ... אֶת־פָּנַי is not explicit.
    rationale: Kumkabili can mean confront or face someone, but it does not clearly convey that God sets his face in opposition to both the man and his kin group. Adding “uso wangu dhidi ya” represents the Hebrew idiom and its judicial opposition.
  - severity: low
    issue: The antecedent in “wote wanaofanya ukahaba kwa kumfuata, wakifanya ukahaba kwa kumfuata Moleki” is momentarily unclear.
    rationale: Naming “mtu huyo” in the first clause makes clear that the first following is after the offender and the second is after Moleki, as in the Hebrew.
  - severity: low
    issue: The metaphor footnote is anchored at Moleki rather than at the metaphorical expression it explains.
    rationale: Moving its anchor to the first occurrence of “ukahaba” aligns the note with the lexical phrase under discussion.
