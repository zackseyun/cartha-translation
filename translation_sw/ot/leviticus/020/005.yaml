source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: sw
  text: Ndipo mimi mwenyewe nitauweka uso wangu dhidi ya mtu huyo na jamaa yake. Nitamkatilia mbali mtu huyo[a], pamoja na wote wanaofanya ukahaba[b] kwa kumfuata mtu huyo, wakifanya ukahaba kwa kumfuata Moleki, kutoka miongoni mwa watu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kukatiliwa mbali” ni usemi wa hukumu ya agano. Aya hii haisemi wazi kama kunatokea kwa kifo, kufukuzwa, au namna nyingine ya kuondolewa na Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia kitenzi cha kufanya ukahaba kama sitiari ya kutokuwa mwaminifu kwa Mungu kwa kufuata ibada ya sanamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: ndipo mimi mwenyewe nitakapomkabili
  rationale: Huwakilisha mkazo wa אֲנִי na maana ya nahau ya Kiebrania ya kuelekeza uso dhidi ya mtu, kwa Kiswahili cha kawaida kinachoonyesha upinzani wa Mungu.
- source_word: בָּאִישׁ הַהוּא
  choice: mtu huyo
  rationale: Katika muktadha huu אִישׁ humrejelea mkosaji mmoja; “mtu huyo” ni ya asili katika Kiswahili bila kupoteza umoja wa rejeo.
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: na jamaa yake
  rationale: מִשְׁפָּחָה inaweza kumaanisha familia, ukoo, au kundi pana la ndugu. “Jamaa” huhifadhi upana huo vizuri kuliko “familia” pekee.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: Nitamkatilia mbali mtu huyo
  rationale: “Kumkatilia mbali” huhifadhi usemi wa hukumu ya agano bila kuamua kama njia yake ni kifo, kufukuzwa, au namna nyingine ya kuondolewa na Mungu.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: pamoja na wote wanaofanya ukahaba kwa kumfuata
  rationale: Huhifadhi sitiari ya זנה ya ukahaba kama kutokuwa mwaminifu kwa Mungu, na אַחֲרָיו kama kumfuata mkosaji huyo.
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: wakifanya ukahaba kwa kumfuata Moleki
  rationale: Urudiaji wa “kufanya ukahaba” huhifadhi balagha ya Kiebrania, huku “kwa kumfuata” ikionyesha ibada isiyo halali.
- source_word: הַמֹּלֶךְ
  choice: Moleki
  rationale: Jina la mungu huyu linatoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili, bila kuwakilisha kibainishi cha Kiebrania kama neno tofauti.
- source_word: מִקֶּרֶב עַמָּם
  choice: kutoka miongoni mwa watu wao
  rationale: Huhifadhi maana ya kuondolewa katikati ya jamii na kiambishi cha wingi katika עַמָּם, kinacholingana na mkosaji pamoja na wafuasi wake.
theological_decisions:
- issue: Kuhifadhi sitiari ya uasherati wa kiroho kwa ibada ya sanamu
  choice: wote wanaofanya ukahaba ... wakifanya ukahaba
  alternative: wote wasio waaminifu; wote wanaoabudu sanamu
  rationale: Kiebrania kinatumia kwa makusudi lugha kali ya ngono kueleza kuvunjwa kwa uaminifu wa agano. Tafsiri inahifadhi sitiari hiyo badala ya kuifanya kuwa maelezo ya jumla.
- issue: Maana ya hukumu ya ‘kukatiliwa mbali’
  choice: Nitamkatilia mbali
  alternative: nitamuua; nitamfukuza; nitamwangamiza
  rationale: Aya haisemi wazi hapa namna halisi ya hukumu hiyo. Usemi mpana huhifadhi mvutano wa matini bila kuamua zaidi ya ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jamaa” limetumiwa kwa maana pana ya familia au ukoo; urudiaji wa “kufanya ukahaba” umehifadhiwa kwa sababu ni sehemu ya nguvu ya balagha ya chanzo.
