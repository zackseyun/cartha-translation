  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: sw
  text: Ikiwa mwanamume atazini na mke wa mwanamume mwingine—ikiwa atazini na mke wa mwenzake—mwanamume mzinzi na mwanamke mzinzi hakika watauawa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno ya karibu zaidi, “na mke wa mwanamume ... na mke wa mwenzake.” Kurudiwa kwa maneno hayo kunasisitiza na kufafanua kosa kwa mtindo wa kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Ikiwa mwanamume
  rationale: Katika muundo huu wa sheria, kiunganishi וְ pamoja na אִישׁ na kishazi cha אֲשֶׁר huanzisha sharti la kisheria. “Ikiwa mwanamume” linaonyesha kwa Kiswahili cha kawaida nguvu hiyo ya sharti huku likihifadhi jinsia ya nomino ya Kiebrania.
- source_word: יִנְאַף
  choice: atazini
  rationale: Kitenzi נאף humaanisha hasa kufanya uzinzi, si uasherati kwa ujumla. “Atazini” ni sawa, wazi, na ya kawaida katika Kiswahili.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: na mke wa mwanamume mwingine
  rationale: Kifungu hiki kwa karibu ni “na mke wa mwanamume.” Neno “mwingine” linaweka wazi kwa Kiswahili kwamba mwanamke huyo ni mke wa mtu asiye yule mkosaji, bila kubadili maana ya kisheria.
- source_word: אֲשֶׁר יִנְאַף אֶת אֵשֶׁת רֵעֵהוּ
  choice: ikiwa atazini na mke wa mwenzake
  rationale: Kurudia kishazi cha uzinzi kunahifadhi msisitizo na ufafanuzi wa mtindo wa sheria wa Kiebrania. “Mwenzake” hapa humaanisha mtu mwenzake katika jamii, si lazima mtu anayeishi karibu naye.
- source_word: מוֹת יוּמַת
  choice: hakika watauawa
  rationale: Muundo wa infinitivu kamili pamoja na kitenzi kilichonyambuliwa unasisitiza adhabu ya kifo. “Hakika watauawa” huhifadhi msisitizo huo na hali ya kutendwa bila kutaja njia ya kuwaua.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: mwanamume huyo mzinzi na mwanamke huyo mzinzi
  rationale: Vivumishi-jina vya Kiebrania vinawatambulisha wazi mkosaji wa kiume na mkosaji wa kike. Muundo huu ni wa asili zaidi katika Kiswahili kuliko kurudia nomino “mzinzi” peke yake, na huhifadhi uwiano wa pande zote mbili.
theological_decisions:
- issue: Lugha ya kisheria inayotaja jinsia
  choice: Kuhifadhi “mwanamume” na kuwataja wazi mkosaji wa kiume na wa kike.
  alternative: “Mtu yeyote akizini ... wote wawili watauawa.”
  rationale: Kiebrania kinataja jinsia wazi katika maelezo ya kosa na katika hukumu. Tafsiri haibadilishi vifungu hivyo kuwa lugha isiyotaja jinsia.
- issue: Kauli ya adhabu ya kifo
  choice: “hakika watauawa” bila kutaja namna ya kuwaua.
  alternative: “lazima wauawe” au kutaja njia fulani ya utekelezaji wa hukumu.
  rationale: Kiebrania kinasisitiza adhabu ya kifo lakini mstari huu hautaji njia yake. Tafsiri inahifadhi upeo huo bila kuingiza maelezo kutoka sehemu nyingine au mapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni wazi, yenye heshima na sauti ya kisheria. “Mwenzake” limechaguliwa badala ya “jirani yake” ili kuepuka maana finyu ya mtu anayeishi karibu, huku marudio ya Kiebrania yakihifadhiwa.
