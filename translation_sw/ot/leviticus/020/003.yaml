  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: sw
  text: Mimi mwenyewe nitauelekeza uso wangu dhidi ya mtu huyo na nitamkatilia mbali kutoka miongoni mwa watu wake, kwa sababu amempa Moleki baadhi ya wazao wake[a], ili kupanajisi mahali pangu patakatifu na kulivunjia heshima jina langu takatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ametoa baadhi ya watoto wake kuwa dhabihu kwa Moleki.” Kiebrania kinasema kihalisi, “amempa Moleki baadhi ya wazao wake”; maana ya dhabihu inadokezwa na muktadha mpana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mimi mwenyewe
  rationale: Kiwakilishi huru kinasisitiza kwamba Mungu binafsi ndiye atakayetekeleza hukumu.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: nitamkazia uso wangu mtu huyo
  rationale: Huhifadhi tamathali ya Kiebrania ya Mungu kumwelekea mkosaji kwa upinzani wa makusudi, huku ikibaki katika lugha ya Kiswahili yenye hadhi.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: na nitamkatilia mbali na watu wake
  rationale: Huhifadhi usemi wa kisheria na wa agano bila kubainisha zaidi namna ya hukumu au kama ni kifo, kuondolewa katika jamii, au yote mawili.
- source_word: מִזַּרְעוֹ
  choice: baadhi ya wazao wake
  rationale: Neno זֶרַע lina maana ya uzao au watoto katika muktadha huu, na kiambishi מִן kinaweza kuonyesha sehemu ya kundi hilo.
- source_word: נָתַן לַמֹּלֶךְ
  choice: amempa Moleki
  rationale: Kitenzi cha Kiebrania kinasema moja kwa moja ‘ametoa/amempa’; tafsiri haiongezi waziwazi ‘kuwa dhabihu’ katika matini kuu.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: kupanajisi mahali pangu patakatifu
  rationale: ‘Panajisi’ huwasilisha unajisi wa kiibada, na ‘mahali patakatifu’ ni tafsiri ya kawaida na inayoeleweka ya מִקְדָּשׁ.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: na kulivunjia heshima jina langu takatifu
  rationale: Usemi huu unaonyesha kulitendea jina takatifu kama lisilo takatifu; ‘kulivunjia heshima’ ni Kiswahili cha sasa kinachoeleweka bila kupunguza uzito wa kosa.
theological_decisions:
- issue: Aina ya tendo linalohusiana na Moleki
  choice: Matini kuu inasema ‘amempa Moleki baadhi ya wazao wake.’
  alternative: ‘ametoa baadhi ya watoto wake kuwa dhabihu kwa Moleki.’
  rationale: Muktadha mpana unaonyesha dhabihu ya watoto, lakini mstari huu wenyewe unatumia kitenzi cha jumla ‘kutoa/kumpa.’ Tafsiri kuu inadumisha tofauti hiyo, na tanbihi inaeleza maana inayodokezwa na muktadha.
- issue: Ushiriki binafsi wa Mungu katika hukumu
  choice: ‘Mimi mwenyewe’ pamoja na tamathali ‘nitamkazia uso wangu.’
  alternative: ‘Nitampinga mtu huyo.’
  rationale: Chaguo kuu huhifadhi mkazo wa kiwakilishi na uzito wa tamathali ya hukumu ya Mungu badala ya kuisawazisha kuwa kauli ya jumla ya upinzani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tamathali ya ‘kukazia uso’ na usemi ‘kukatilia mbali’ zimehifadhiwa kwa sababu ya uzito wake wa kisheria na kiteolojia; tanbihi imewekwa baada ya kishazi kinachohusu Moleki ili ihusiane wazi na mbadala wake.
