  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: sw
  text: Mwanamume akimchukua mwanamke pamoja na mama yake[a], huo ni uovu wa aibu[b]. Wamchome kwa moto mwanamume huyo, na wawachome kwa moto wanawake hao wawili, ili uovu wa aibu usiwepo miongoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akimwoa mwanamke pamoja na mama yake.” Katika muktadha wa kisheria, kitenzi cha Kiebrania kinachomaanisha “chukua” kinaweza kudokeza ndoa, lakini hapa ndoa haitajwi waziwazi.
    reason: lexical_alternative
  - marker: b
    text: Au, “uovu,” “uasherati wa aibu,” au “jambo la kuchukiza.” Neno la Kiebrania hurejelea tendo ovu sana, hasa kosa la kingono la aibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni ya kiume katika umoja na humtaja moja kwa moja mhusika wa kiume katika sheria hii.
- source_word: יִקַּח
  choice: akimchukua
  rationale: Kitenzi לקח kimsingi humaanisha ‘chukua’ na katika muktadha wa kisheria kinaweza kudokeza kuchukua kuwa mke. Tafsiri hii inahifadhi upana wa usemi wa Kiebrania bila kuufanya ndoa kuwa wazi kuliko ulivyo katika chanzo.
- source_word: אִשָּׁה וְאֶת אִמָּהּ
  choice: mwanamke pamoja na mama yake
  rationale: אִשָּׁה inaweza kumaanisha mwanamke au mke. ‘Mwanamke’ haibani maana isivyofaa, na ‘mama yake’ huonyesha wazi kuwa huyo ni mama wa mwanamke aliyetajwa.
- source_word: זִמָּה
  choice: upotovu mkubwa
  rationale: Katika sheria hizi za ngono, זִמָּה huonyesha tendo ovu sana na la kuchukiza. ‘Upotovu mkubwa’ ni lugha ya sasa, yenye heshima, na inawasilisha uzito wa kosa bila kulifafanua kwa fundisho la ziada.
- source_word: בָּאֵשׁ יִשְׂרְפוּ
  choice: wamchome moto
  rationale: Kiebrania kina kitenzi tendaji cha wingi na moto ndio njia ya adhabu. Muundo wa Kiswahili wenye ‘wa-’ unahifadhi agizo la kisheria bila kutaja wahusika ambao chanzo hakiwataji.
- source_word: אֹתוֹ וְאֶתְהֶן
  choice: mwanamume huyo pamoja na wanawake hao wawili
  rationale: Kiebrania hutofautisha ‘yeye’ wa kiume na ‘wao’ wa kike. Kutaja mwanamume na wanawake wawili huondoa utata wa viwakilishi katika Kiswahili huku kukihifadhi rejeo la wahusika wote watatu.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: ili upotovu mkubwa usiwepo miongoni mwenu
  rationale: ‘Ili’ huonyesha kusudi au matokeo ya adhabu, na ‘miongoni mwenu’ ni Kiswahili cha kawaida kinachowakilisha בְּתוֹכְכֶם.
theological_decisions:
- issue: Aina ya uhusiano unaodokezwa na ‘kumchukua mwanamke pamoja na mama yake’
  choice: Kudumisha usemi mpana ‘akimchukua’ katika maandishi makuu.
  alternative: ‘akimwoa mwanamke pamoja na mama yake’ au ‘akimchukua kuwa mke’
  rationale: לקח inaweza kurejelea ndoa katika muktadha wa kisheria, lakini mstari hautumii neno la wazi linalomaanisha kuoa. Tafsiri pana pamoja na tanbihi huhifadhi utata halisi.
- issue: Muundo wa kifungu cha adhabu
  choice: 'Kutumia agizo tendaji: ‘Wamchome moto mwanamume huyo pamoja na wanawake hao wawili.’'
  alternative: ‘Mwanamume huyo pamoja na wanawake hao wawili wachomwe moto.’
  rationale: Chanzo kina kitenzi tendaji cha nafsi ya tatu wingi, si muundo wa kutendwa. Tafsiri haiongezi utambulisho wa watekelezaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisheria ulio wazi, wa sasa, na wenye heshima. ‘Akimchukua’ huhifadhi ukaribu na kitenzi cha chanzo, huku tanbihi ikifafanua uwezekano wa maana ya ndoa. ‘Wanawake hao wawili’ ni ufafanuzi wa lazima kwa Kiswahili ili kuonyesha kwa uwazi kuwa kiwakilishi cha Kiebrania cha wingi wa kike kinawahusu mwanamke na mama yake.
