  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: sw
  text: Ikiwa mwanamume analala na mke wa mjomba wake[a], amefunua uchi wa mjomba wake. Wote wawili watabeba dhambi yao[b]; watakufa bila watoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shangazi yake kwa ndoa.” Kiebrania humaanisha mke wa mjomba wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “watabeba hatia yao.” Nahau ya Kiebrania inaweza kumaanisha kubeba dhambi au hatia inayotokana nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Ikiwa mwanamume
  rationale: Muundo huu unaanzisha shauri la kisheria la masharti; “mwanamume” huhifadhi jinsia ya nomino ya Kiebrania.
- source_word: יִשְׁכַּב אֶת
  choice: analala na
  rationale: Ni nahau ya kawaida ya Kiswahili kwa tendo la ngono, inayolingana na nahau ya Kiebrania bila maelezo ya wazi kupita kiasi.
- source_word: דֹּדָתוֹ
  choice: mke wa mjomba wake
  rationale: Katika muktadha huu neno linamaanisha mke wa דוד, yaani shangazi kwa ndoa. Usemi huu unaweka wazi uhusiano unaokusudiwa na unaungana vizuri na kifungu kinachofuata.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: amefunua uchi wa mjomba wake
  rationale: Huhifadhi nahau maalumu ya Kilawi kuhusu kuvunja mpaka uliokatazwa wa uhusiano wa kingono.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: Wote wawili watachukua dhambi yao
  rationale: Kitenzi na kiambishi cha wingi vinawahusu wahusika wote wawili. “Kuchukua dhambi” huhifadhi picha ya Kiebrania, huku tanbihi ikitaja maana mbadala ya hatia.
- source_word: עֲרִירִים יָמֻתוּ
  choice: watakufa bila watoto
  rationale: Huwasilisha kwa ufupi hali au matokeo yaliyotajwa bila kubainisha namna ya adhabu au ikiwa watoto waliokuwapo wangeondolewa.
theological_decisions:
- issue: Maana ya adhabu katika עֲרִירִים יָמֻתוּ
  choice: watakufa bila watoto
  alternative: watakufa bila kuwa na wazao / watakufa bila wazao wanaosalia
  rationale: Kiebrania kinataja matokeo au hali kwa ufupi bila kueleza utaratibu wake; tafsiri haiongezi maelezo ya kisheria au ya kiteolojia yasiyosemwa.
- issue: Maana ya חֶטְאָם katika nahau ya kubeba
  choice: dhambi yao
  alternative: hatia yao
  rationale: Nomino inaweza kumaanisha dhambi yenyewe au hatia inayotokana nayo. Maandishi makuu yanahifadhi “dhambi,” na tanbihi inalinda uwezekano wa “hatia.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Analala na” ni nahau inayoeleweka kwa tendo la ngono; “amefunua uchi” huhifadhi lugha ya kiibada na kisheria ya Mambo ya Walawi. Alama zote za tanbihi zimewekwa katika maandishi makuu.
