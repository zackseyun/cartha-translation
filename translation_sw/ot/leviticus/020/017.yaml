reference: Leviticus 20:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: sw
  text: Mwanamume akimchukua dada yake, awe binti ya baba yake au binti ya mama yake, akaona uchi wake, naye huyo dada akaona uchi wa mwanamume huyo, hiyo ni fedheha[a]. Watakatiliwa mbali[b] mbele ya watu wa jamii yao. Mwanamume huyo ameufunua uchi wa dada yake; atabeba hatia yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo la aibu” au “lawama.” Neno la Kiebrania חֶסֶד limetumiwa hapa kwa maana hasi iliyo adimu, si kwa maana yake ya kawaida ya “fadhili” au “upendo thabiti.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “watakatiliwa mbali” huhifadhi utata wa kanuni ya hukumu ya Kiebrania bila kubainisha kama adhabu ni kifo, kufukuzwa katika jumuiya, au namna nyingine ya kuondolewa.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: mwanamume
  rationale: Nomino ya kiume katika sheria hii imetafsiriwa wazi kama “mwanamume,” bila kuifanya kauli iwe ya jumla kuliko Kiebrania.
- source_word: יִקַּח
  choice: akimchukua
  rationale: “Kumchukua” huhifadhi upana wa kitenzi cha Kiebrania, ambacho hapa kinaweza kudokeza kumchukua kuwa mke au kumchukua kingono; sentensi inayofuata inaweka wazi kosa la kingono.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: dada yake, awe binti ya baba yake au binti ya mama yake
  rationale: Kauli hii inajumuisha wazi dada wa upande wa baba na wa upande wa mama, pamoja na dada mwenye wazazi wale wale.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: akaona uchi wake, naye huyo dada akaona uchi wa mwanamume huyo
  rationale: “Kuona uchi” huhifadhi taswira na nahau ya kisheria ya Kiebrania. Kurudia wahusika katika sehemu ya pili huepusha utata wa kiwakilishi katika Kiswahili.
- source_word: חֶסֶד
  choice: fedheha
  rationale: Katika matumizi haya adimu na hasi, neno hilo humaanisha tendo la aibu au la kufedhehesha, si maana yake ya kawaida ya fadhili au upendo thabiti.
- source_word: וְנִכְרְתוּ
  choice: wataondolewa
  rationale: Uamuzi huu huhifadhi wazo la kuondolewa kutoka kwa jumuiya bila kubainisha kama njia yake ni kuuawa, kufukuzwa, au adhabu nyingine.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: mbele ya watu wa jamii yao
  rationale: “Mbele ya” huonyesha kuwa jambo hilo linafanyika machoni pa jumuiya; “watu wa jamii yao” huwasilisha uhusiano wa kijamii unaodokezwa na nahau ya Kiebrania.
- source_word: גִּלָּה
  choice: ameufunua
  rationale: “Kufunua uchi” hudumisha nahau inayorudiwa katika sheria za Walawi kuhusu mahusiano ya kingono yaliyokatazwa.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: atabeba hatia yake
  rationale: Kauli hii huhifadhi uzito wa kisheria na kimaadili wa kubeba hatia pamoja na matokeo yake, bila kuitafsiri kuwa adhabu maalumu.
theological_decisions:
- issue: Maana ya חֶסֶד katika mstari huu
  choice: 'maana hasi: “fedheha”'
  alternative: “fadhili” au “upendo thabiti,” ambazo ndizo maana za kawaida mahali pengine
  rationale: Muktadha wa katazo na hukumu unahitaji maana adimu ya hasi inayorejelea tendo la aibu; maana chanya ingepotosha mstari.
- issue: Aina ya adhabu katika וְנִכְרְתוּ
  choice: kuhifadhi kauli ya jumla “wataondolewa”
  alternative: kuuawa, kufukuzwa katika jumuiya, au aina nyingine ya kuondolewa
  rationale: Kitenzi cha Kiebrania hakibainishi hapa utaratibu halisi wa adhabu, kwa hiyo tafsiri haipaswi kuamua jambo ambalo maandishi yameliacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Nahau “kuona/kufunua uchi” imehifadhiwa kwa sababu ni muhimu katika msamiati wa kisheria wa sura hii. “Watu wa jamii yao” ni ya asili zaidi kuliko tafsiri ya neno kwa neno “wana wa watu wao,” huku ikihifadhi maana ya jumuiya yao.
