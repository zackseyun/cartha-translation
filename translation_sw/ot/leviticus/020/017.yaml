review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the male legal subject, the inclusion of paternal and maternal sisters, the reciprocal 'seeing nakedness' wording, the rare negative sense of חֶסֶד, and the final singular statement that the man bears his guilt. However, “wataondolewa” is a generalized interpretation of וְנִכְרְתוּ and does not retain the Hebrew legal formula as closely as Kiswahili “watakatiliwa mbali.”
  naturalness: The wording is clear, modern Standard East African Swahili and appropriately formal. “Watakatiliwa mbali” is an established, intelligible biblical-legal expression; the explanatory footnote keeps its exact force appropriately open.
  terminology: “Fidheha,” “kuona uchi,” “kufunua uchi,” and “kubeba hatia” are suitable renderings in this legal context. Revising the cut-off formula also aligns the text and its note with the source’s deliberate ambiguity.
  issues:
  - severity: medium
    issue: The rendering of וְנִכְרְתוּ as “wataondolewa” is overly generic.
    rationale: While it preserves that some removal occurs, it obscures the repeated Hebrew legal formula 'be cut off.' “Watakatiliwa mbali” more closely represents the source without deciding whether the removal denotes death, expulsion, or another sanction. The related footnote must quote the revised wording.
  revised_text: Mwanamume akimchukua dada yake, awe binti ya baba yake au binti ya mama yake, akaona uchi wake, naye huyo dada akaona uchi wa mwanamume huyo, hiyo ni fedheha[a]. Watakatiliwa mbali[b] mbele ya watu wa jamii yao. Mwanamume huyo ameufunua uchi wa dada yake; atabeba hatia yake.
