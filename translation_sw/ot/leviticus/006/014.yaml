base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Iandaliwe juu ya kikaango kwa mafuta[a], ikiwa imechanganywa vizuri. Utaileta; utatoa sadaka ya nafaka iliyookwa[b], ikiwa vipande, iwe harufu ya kupendeza kwa Yahwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mafuta.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “iliyookwa” ni adimu; huenda linamaanisha sehemu zilizookwa kwenye kikaango.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “harufu ya kupendeza” ni kauli ya kawaida ya kisadaka inayoonyesha kwamba sadaka inakubalika kwa Yahwe.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: kikaango
  rationale: Neno hili linamaanisha chombo bapa cha kupikia; “kikaango” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: בַּשֶּׁמֶן
  choice: kwa mafuta
  rationale: Kiambishi ב kinaweza kumaanisha “katika” au kuonyesha kifaa/kiungo kilichotumiwa. “Kwa mafuta” ni usemi wa kawaida katika maagizo ya upishi bila kuondoa uwezekano wa maana ya “katika mafuta,” unaotajwa katika tanbihi.
- source_word: תֵּעָשֶׂה
  choice: iandaliwe
  rationale: Kauli ya kutendwa ya עשה hapa inaeleza utayarishaji wa sadaka. “Iandaliwe” ni ya asili zaidi kwa Kiswahili kuliko tafsiri sisisi ya “ifanywe.”
- source_word: מֻרְבֶּכֶת
  choice: ikiwa imechanganywa vizuri
  rationale: Inaeleza mchanganyiko uliokorogwa au kuchanganywa pamoja na mafuta; tafsiri hii haisisitizi mno mbinu maalumu ya upishi.
- source_word: תְּבִיאֶנָּה
  choice: utaileta
  rationale: Kitenzi kinamaanisha kuleta, na kiambishi cha yambwa kinarejelea sadaka.
- source_word: תֻּפִינֵי
  choice: vipande vilivyookwa
  rationale: Hili ni neno adimu la upishi linalohusiana na kuoka; “vipande vilivyookwa” linaeleweka na linaendana na kutajwa kwa vipande mara moja baadaye.
- source_word: מִנְחַת
  choice: sadaka ya nafaka
  rationale: Hili ndilo neno la kawaida katika Walawi kwa sadaka ya unga au mazao ya nafaka, na huhifadhi umahususi wake wa kiibada.
- source_word: פִּתִּים
  choice: iliyovunjwa vipande
  rationale: Hueleza sadaka ikiwa katika sehemu au vipande; “iliyovunjwa vipande” huwasilisha kitendo hicho wazi kwa Kiswahili.
- source_word: תַּקְרִיב
  choice: utaitoa
  rationale: Katika muktadha wa dhabihu, Hiphil ya קרב humaanisha kuwasilisha au kutoa sadaka. “Utaitoa” ni usemi wa kawaida wa kiibada na huepuka kurudia “utaileta.”
- source_word: רֵיחַ נִיחֹחַ
  choice: harufu ya kupendeza
  rationale: Huhifadhi kauli ya kawaida ya sadaka inayoonyesha kukubalika kwake mbele za Mungu bila kuifafanua kupita kiasi.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya matamshi “Yahwe,” huku kihusishi kikionyesha kwamba sadaka hiyo inatolewa kwake.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne. “Yahwe” huhifadhi jina hilo badala ya kulibadili kuwa cheo, bila kuingiza mapokeo ya dhehebu fulani.
- issue: Maana ya kauli ya kisadaka רֵיחַ נִיחֹחַ
  choice: harufu ya kupendeza
  alternative: harufu yenye kutuliza / harufu nzuri
  rationale: Tafsiri hii hudumisha lugha ya maandiko kuhusu sadaka inayokubalika kwa Mungu, bila kudai kwamba kauli hiyo inahusu tu starehe ya kunusa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa kwa alama za uakifishaji ili maagizo yafuatike kwa urahisi, huku urudiaji na mvutano wa istilahi za Kiebrania ukihifadhiwa.
