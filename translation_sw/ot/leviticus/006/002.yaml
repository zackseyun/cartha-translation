  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: sw
  text: 'Mwamuru Aroni pamoja na wanawe, ukisema, “Hii ndiyo sheria[a] kuhusu sadaka ya kuteketezwa: sadaka ya kuteketezwa yenyewe itakuwa juu ya mahali pa kuunguzia juu ya madhabahu usiku kucha mpaka asubuhi,[b] na moto wa madhabahu udumishwe ukiwaka juu yake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Haya ndiyo maagizo kuhusu sadaka ya kuteketezwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya kuteketezwa itakuwa juu ya mahali pa kuunguzia juu ya madhabahu.” Neno la Kiebrania linamaanisha mahali pa kuwashia au pa kuunguzia juu ya madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Mwamuru
  rationale: Kitenzi cha amri kina nguvu ya agizo la moja kwa moja; “mwamuru” huhifadhi nguvu hiyo kuliko “mwelekeze.”
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: Aroni na wanawe
  rationale: Hutaja Aroni na wanawe wa kiume katika muktadha maalumu wa ukuhani.
- source_word: לֵאמֹר
  choice: uwaambie
  rationale: Katika Kiswahili, fomula ya Kiebrania ya kuanzisha maneno ya moja kwa moja hutolewa kwa kawaida na kwa uwazi kama “uwaambie.”
- source_word: זֹאת תּוֹרַת
  choice: Hii ndiyo sheria kuhusu
  rationale: “Sheria” huhifadhi mtindo rasmi wa kanuni ya ibada, na “kuhusu” huleta Kiswahili cha kawaida katika fomula hii.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno linaloeleweka na lililozoeleka kwa dhabihu inayoteketezwa juu ya madhabahu; halilazimishi maana ya kietimolojia ya ‘kupanda.’
- source_word: הִוא הָעֹלָה
  choice: sadaka hiyo ya kuteketezwa
  rationale: Kiwakilishi pamoja na kurudiwa kwa nomino huendeleza msisitizo na mada bila tafsiri ngumu ya neno kwa neno.
- source_word: עַל מוֹקְדָה
  choice: itabaki mahali pake pa kuwaka
  rationale: מוֹקְדָה ni mahali pa kuwashia au pa kuunguzia juu ya madhabahu. Tafsiri hii huhifadhi picha hiyo huku ikitoa wazo la sadaka kubaki hapo usiku kucha.
- source_word: עַל הַמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Hutoa kwa moja kwa moja mahali pa dhabihu.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: usiku kucha mpaka asubuhi
  rationale: Ni Kiswahili cha asili kinachohifadhi muda wote uliotajwa katika Kiebrania.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: na moto wa madhabahu utaendelea kuwashwa juu yake
  rationale: Umbo la kitenzi linaonyesha kwamba moto unatakiwa kudumishwa ukiwaka. “Utaendelea kuwashwa” huhifadhi hali hiyo ya agizo, na “juu yake” huacha urejeo wa kiwakilishi ukiwa mfupi kama katika Kiebrania.
theological_decisions:
- issue: Maana ya תּוֹרָה katika sheria za dhabihu
  choice: sheria
  alternative: maagizo; kanuni
  rationale: Katika fomula hii ya ibada, “sheria” hudumisha sauti rasmi ya kisheria bila kudai kwamba neno hapa ni jina la vitabu vyote vya Torati.
- issue: Hali ya moto wa madhabahu
  choice: utaendelea kuwashwa
  alternative: utawaka
  rationale: Kitenzi cha Kiebrania kinaonyesha moto unaodumishwa, si taarifa tu kwamba moto utakuwa ukiwaka. Tafsiri iliyochaguliwa huhifadhi wajibu uliowekwa kwa makuhani.
- issue: Urejeo wa kiwakilishi katika בּוֹ
  choice: juu yake
  alternative: ndani yake; juu ya madhabahu
  rationale: Kiebrania kina kiwakilishi kifupi ambacho kinaweza kuhusishwa na mahali pa kuwaka au muktadha wa madhabahu. “Juu yake” hakisuluhishi kwa lazima urejeo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni rasmi na yenye heshima lakini inaeleweka kwa msomaji wa kawaida. “Madhabahu” na “sadaka ya kuteketezwa” zimetumiwa kama istilahi za kawaida za ibada. Alama za tanbihi zimewekwa baada ya vipashio vinavyohusika, badala ya kufuata nafasi zisizolingana katika safu ya mashauriano ya Kiingereza.
