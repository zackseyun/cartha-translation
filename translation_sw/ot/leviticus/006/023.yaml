base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: sw
  text: Na kila sadaka ya dhambi[a] ambayo sehemu ya damu yake huletwa ndani ya Hema la Kukutania ili kufanya upatanisho mahali patakatifu, haitaliwa; itateketezwa kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso” badala ya “sadaka ya dhambi”; neno la Kiebrania חַטָּאת katika Mambo ya Walawi linaweza kumaanisha dhabihu inayoshughulikia unajisi na dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Lakini kila
  rationale: Kiunganishi וְ kinaunganisha amri hii na masharti yaliyotangulia, huku muktadha ukionyesha tofauti ya sadaka hii na zile zinazoweza kuliwa; כָל linaweka wigo wa jumla.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria za dhabihu neno hili linamaanisha sadaka inayohusiana na dhambi na utakaso, si dhambi kwa maana ya jambo lisilo dhahiri. Hili ndilo neno linalotambulika kwa urahisi katika Kiswahili cha Biblia.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: ambayo sehemu ya damu yake huletwa
  rationale: 'מִן lina maana ya sehemu: kiasi fulani cha damu, si lazima damu yote, huletwa ndani. Kauli tendwa ya Kiebrania imehifadhiwa kwa ''huletwa''.'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: ndani ya Hema la Kukutania
  rationale: Hili ni jina la kawaida la jengo la patakatifu; 'ndani ya' linaonyesha kuingizwa kwa damu humo.
- source_word: לְכַפֵּר
  choice: ili kufanya upatanisho
  rationale: Hii inahifadhi maana ya kiibada na ya kitheolojia ya כפר bila kuifungamanisha na nadharia moja maalumu ya upatanisho.
- source_word: בַּקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Kirai hiki kinaelekeza kwenye eneo takatifu la patakatifu, wala si utakatifu kwa maana dhahania.
- source_word: לֹא תֵאָכֵל
  choice: haitaliwa
  rationale: Kauli tendwa na nguvu ya katazo la kisheria zimehifadhiwa kwa lugha ya kawaida na yenye hadhi.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: itateketezwa kwa moto
  rationale: Kauli hii huhifadhi msisitizo wa nahau ya Kiebrania ya kuchoma kwa moto; 'kuteketezwa' pia huonyesha kuchomwa kabisa katika muktadha wa dhabihu.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria za dhabihu za kikuhani
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno hili linarejelea dhabihu inayoshughulikia dhambi na unajisi wa kiibada. 'Sadaka ya dhambi' ni wazi na inayotambulika zaidi kwa wasomaji wengi, huku tanbihi ikihifadhi uwezekano wa 'sadaka ya utakaso'.
- issue: Kiasi cha damu kinacholetwa patakatifu
  choice: sehemu ya damu yake huletwa
  alternative: damu yake huletwa
  rationale: Kiambishi מִן katika מִדָּמָהּ kinaonyesha maana ya sehemu. Kutaja 'sehemu' kunahifadhi maelezo ya ibada na kuepuka kudokeza kwamba damu yote iliingizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Istilahi za kiibada zimewekwa wazi kwa msomaji wa kawaida; muundo wa kisheria na kauli tendwa ya chanzo zimehifadhiwa bila kufanya sentensi kuwa ngumu.
