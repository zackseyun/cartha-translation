  text: וְ/כָל מִנְחַ֥ת כֹּהֵ֛ן כָּלִ֥יל תִּהְיֶ֖ה לֹ֥א תֵאָכֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: sw
  text: Na kila sadaka ya nafaka ya kuhani itateketezwa yote[a]; haitaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itakuwa sadaka nzima.” Kivumishi cha Kiebrania kinaweza kumaanisha kwamba sadaka ni nzima au kamili; hapa maana yake ya kiutendaji ni kwamba hailiwi, bali inatolewa yote kwa kuteketezwa madhabahuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Na kila
  rationale: 'Kiunganishi וְ kinaendeleza maagizo ya sheria, na כָּל pamoja na nomino ya umoja kina maana ya kugawa: “kila.”'
- source_word: מִנְחַת
  choice: sadaka ya nafaka
  rationale: Katika Mambo ya Walawi, מִנְחָה ni istilahi maalumu ya sadaka inayotolewa kwa nafaka, si zawadi ya kawaida.
- source_word: כֹּהֵן
  choice: ya kuhani
  rationale: Muundo wa kimilikishi מִנְחַת כֹּהֵן una maana ya sadaka ya nafaka inayotolewa na kuhani.
- source_word: כָּלִיל
  choice: itateketezwa yote
  rationale: כָּלִיל hueleza kitu kizima au kilichotolewa chote, na katika muktadha huu maana yake ya kiutendaji ni kwamba sadaka yote inateketezwa na hakuna sehemu inayoliwa. Kiswahili hiki kinaeleza maana hiyo kwa kawaida, ingawa kitenzi cha kuteketeza kimedokezwa badala ya kutajwa wazi katika Kiebrania.
- source_word: תִּהְיֶה
  choice: itakuwa / itateketezwa
  rationale: Wakati usiotimilika wa היה katika sheria una nguvu ya agizo. Katika sentensi ya Kiswahili, nguvu hiyo imeunganishwa na “itateketezwa” ili kutoa kauli ya kisheria kwa lugha ya kawaida.
- source_word: לֹא תֵאָכֵל
  choice: haitaliwa
  rationale: Niphal ni kauli tendwa, “haitaliwa,” nayo inadumisha katazo fupi na la moja kwa moja la Kiebrania.
theological_decisions:
- issue: Je, כָּלִיל itafsiriwe kama hali ya sadaka kuwa nzima au tendo la kuteketezwa kabisa?
  choice: itateketezwa yote
  alternative: itakuwa sadaka nzima
  rationale: Muktadha wa sadaka na kauli inayofuata, “haitaliwa,” unaonyesha kwamba sadaka inatolewa yote madhabahuni. Hata hivyo, tanbihi inahifadhi ukweli kwamba neno la Kiebrania lenyewe ni kivumishi kinachoweza kumaanisha nzima au kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio rasmi lakini unaoeleweka. “Sadaka ya nafaka” inadumisha istilahi ya ibada, na “itateketezwa yote” ni ya kawaida kuliko tafsiri ya moja kwa moja isiyoeleweka ya kivumishi cha Kiebrania.
