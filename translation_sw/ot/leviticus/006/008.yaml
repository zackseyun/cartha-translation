reference: Leviticus 6:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Naye atachukua humo konzi moja ya unga laini wa sadaka ya nafaka na sehemu ya mafuta yake,[a] pamoja na ubani wote ulio juu ya sadaka hiyo ya nafaka. Kisha atateketeza sehemu yake ya ukumbusho[b] juu ya madhabahu, iwe harufu ya kupendeza kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atainua kutoka humo kwa konzi yake.” Kitenzi na nomino za Kiebrania kwa pamoja zinasisitiza kuchukuliwa kwa konzi iliyotengwa kutoka katika sadaka.
    reason: lexical_alternative
  - marker: b
    text: “Sehemu ya ukumbusho” ni istilahi maalumu ya kiibada kwa sehemu wakilishi ya sadaka ya nafaka iliyoteketezwa juu ya madhabahu.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: atachukua humo konzi moja
  rationale: Katika muktadha huu, kitenzi cha Kiebrania humaanisha kuondoa au kuinua sehemu iliyowekwa kwa ajili ya kuteketezwa. “Konzi moja” huonyesha kiasi kinachoshikwa kwa mkono kwa Kiswahili cha kawaida.
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: ya unga laini wa sadaka ya nafaka
  rationale: סֹלֶת ni unga laini uliotumiwa katika sadaka, na מִנְחָה hapa ni istilahi ya sadaka ya nafaka.
- source_word: וּמִשַּׁמְנָהּ
  choice: na sehemu ya mafuta yake
  rationale: Kihusishi cha Kiebrania kinaonyesha kuwa kinachotwaliwa ni kiasi fulani kutoka katika mafuta ya sadaka, si lazima mafuta yote.
- source_word: וְאֵת כָּל הַלְּבֹנָה
  choice: pamoja na ubani wote
  rationale: לְבֹנָה ni ubani hasa, na כָּל husisitiza kwamba ubani wote uliokuwa juu ya sadaka ulijumuishwa.
- source_word: וְהִקְטִיר
  choice: atateketeza
  rationale: Katika ibada za dhabihu, kitenzi hiki humaanisha kuchoma kitu juu ya madhabahu kama sadaka; “kuteketeza” linafaa kwa mtindo wa heshima na wa maagizo.
- source_word: אַזְכָּרָתָהּ
  choice: sehemu yake ya ukumbusho
  rationale: Hii ni istilahi ya kiibada kwa sehemu wakilishi ya sadaka ya nafaka iliyoteketezwa juu ya madhabahu.
- source_word: רֵיחַ נִיחֹחַ
  choice: harufu ya kupendeza
  rationale: Usemi huu wa kudumu wa sadaka huonyesha kukubalika kwa sadaka mbele za Mungu bila kuufafanua kupita kiasi.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kama “Yahwe”; “kwa” huonyesha anayeelekezewa sadaka na harufu yake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, Tetragramatoni. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya usemi wa kiibada רֵיחַ נִיחֹחַ
  choice: harufu ya kupendeza
  alternative: harufu ya kutuliza; harufu nzuri
  rationale: Tafsiri hii inadumisha wazo la sadaka kukubalika kwa Mungu huku ikiepuka kuingiza maelezo ya kiteolojia yasiyosemwa wazi na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili maagizo ya ibada yaeleweke kwa urahisi bila kupoteza uhusiano wa vipengele vya Kiebrania. “Konzi” na “ubani” ni maneno mafupi na yanayoeleweka katika muktadha huu wa kiibada.
