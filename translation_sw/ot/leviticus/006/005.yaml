  to: Moto ulio juu ya madhabahu utadumishwa ukiwaka madhabahuni; usizimike. Kila asubuhi[a] kuhani ataongeza kuni juu yake, ataipanga sadaka ya kuteketezwa juu yake, na kuteketeza juu yake sehemu za mafuta za sadaka za amani.[b]
