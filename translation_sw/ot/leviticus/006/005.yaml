base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: sw
  text: Moto ulio juu ya madhabahu utadumishwa ukiwaka madhabahuni; usizimike. Kila asubuhi[a] kuhani ataongeza kuni juu yake, ataipanga sadaka ya kuteketezwa juu yake, na kuteketeza juu yake sehemu za mafuta za sadaka za amani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asubuhi baada ya asubuhi.” Kiebrania hurudia neno “asubuhi” kuonyesha jambo linalofanywa kila siku.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka za ustawi” au “sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: utadumishwa ukiwaka
  rationale: Hali ya Hophal inaonyesha kwamba moto unapaswa kuendelezwa katika hali ya kuwaka, si kwamba unawaka tu kwa kawaida.
- source_word: לֹא תִכְבֶּה
  choice: usizimike
  rationale: Kauli hii fupi inaeleza sharti la kudumu kwa moto wa madhabahu kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: וּבִעֵר ... עֵצִים
  choice: ataongeza kuni juu yake
  rationale: Katika muktadha huu kuhani anautunza moto uliopo kwa kuutia kuni; tafsiri hii huepuka wazo lisilokusudiwa la kuwasha moto mpya kila asubuhi.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: kila asubuhi
  rationale: Kurudiwa kwa neno 'asubuhi' katika Kiebrania kuna maana ya tendo linalofanywa kila siku.
- source_word: וְעָרַךְ
  choice: ataipanga
  rationale: Kitenzi hiki katika ibada za dhabihu humaanisha kuweka sadaka kwa mpangilio unaofaa madhabahuni.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni jina linalotambulika kwa aina ya sadaka inayoteketezwa yote, na linaeleweka katika Kiswahili cha Biblia.
- source_word: וְהִקְטִיר
  choice: kuteketeza
  rationale: Katika muktadha wa dhabihu, kitenzi kinaeleza kuchoma sadaka madhabahuni ili ipae kwa moshi.
- source_word: חֶלְבֵי
  choice: sehemu zenye mafuta
  rationale: Neno linarejelea hasa sehemu za mafuta zilizotengwa kwa ajili ya kuteketezwa, si sehemu bora kwa maana ya jumla.
- source_word: הַשְּׁלָמִים
  choice: sadaka za amani
  rationale: Hili ni jina la ibada linalotambulika, huku tanbihi ikihifadhi njia nyingine halali za kueleza maana pana ya neno hilo.
theological_decisions:
- issue: Majina ya aina za dhabihu
  choice: sadaka ya kuteketezwa; sadaka za amani
  alternative: sadaka ya kupaa; sadaka za ustawi au sadaka za ushirika
  rationale: Majina yanayotambulika yanadumisha tofauti za kisheria na kiibada bila kuongeza ufafanuzi wa kimadhehebu; tanbihi inahifadhi upana wa maana ya שְׁלָמִים.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa sheria ya ibada umehifadhiwa, huku vitenzi vikichaguliwa kwa ufasaha wa Kiswahili cha sasa. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika, kwa kusahihisha kutolingana kwa alama katika safu ya mashauriano ya Kiingereza.
