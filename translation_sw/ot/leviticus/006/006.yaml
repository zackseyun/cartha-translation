  register: Kiswahili Sanifu cha Afrika Mashariki, cha kawaida na chenye hadhi. Tafsiri inasisitiza udumishaji wa moto unaodokezwa na muundo wa kitenzi cha Kiebrania, huku tanbihi ikihifadhi namna mbadala iliyo karibu zaidi na muundo wa sentensi ya chanzo.
