  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: sw
  text: Moto utadumishwa ukiwaka daima juu ya madhabahu[a]; hautazimika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Moto wa kudumu utawaka juu ya madhabahu; hautazimika.”
