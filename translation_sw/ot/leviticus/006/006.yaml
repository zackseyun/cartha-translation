lexical_decisions:
- source_word: אֵשׁ
  choice: moto
  rationale: Ni maana ya msingi na ya moja kwa moja katika muktadha wa madhabahu na dhabihu.
- source_word: תָּמִיד
  choice: daima
  rationale: Huonyesha mwendelezo usiokatika; ‘daima’ ni ya kawaida, wazi, na yenye hadhi katika Kiswahili cha sasa.
- source_word: תּוּקַד
  choice: utatunzwa uendelee kuwaka
  rationale: Muundo wa kitenzi unaonyesha kuwa moto unapaswa kudumishwa ukiwaka, si kwamba unawaka wenyewe tu. Kauli hii inawasilisha wajibu wa kuutunza kwa Kiswahili cha kawaida.
- source_word: עַל
  choice: juu ya
  rationale: Ni tafsiri ya kawaida ya uhusiano wa mahali unaoonyeshwa hapa.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Ni istilahi iliyozoeleka na sahihi kwa altar katika muktadha wa ibada.
- source_word: לֹא תִכְבֶה
  choice: usizimike
  rationale: Huhifadhi katazo na maana ya moto kutokoma kuwaka, kwa usemi mfupi na wa asili katika Kiswahili.
