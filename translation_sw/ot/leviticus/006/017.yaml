  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: sw
  text: Yahwe akasema na Musa[a], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa mapokeo hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Muundo wa simulizi wa waw pamoja na דִּבֵּר unaanzisha sehemu mpya ya usemi. Kiswahili cha kawaida hutumia “akasema na” kwa maana ya kusema kwa mtu, bila kulazimisha mfuatano mkali wa wakati.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa na cheo “BWANA.”
- source_word: אֶל־מֹשֶׁה
  choice: na Musa
  rationale: Baada ya kitenzi “akasema,” Kiswahili sanifu hutumia “na” kumtaja anayesemeshwa; “Musa” ni umbo la kawaida la jina מֹשֶׁה katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania ya kuingiza usemi wa moja kwa moja na kuunganisha aya hii na maneno yanayofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo bila kuingiza mbadala wa kimapokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. Muundo “akisema” umehifadhiwa kwa sababu aya hii ni utangulizi wa usemi unaofuata; alama ya koma inaonyesha mwendelezo huo.
