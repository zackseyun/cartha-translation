base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: sw
  text: Kuhani anayefanya upatanisho kwa sadaka hiyo ataila. Italiwa mahali patakatifu[a], katika ua wa hema la kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kuhani anayefanya ibada ya sadaka hiyo ya dhambi ataila.” Kitenzi cha Kiebrania kinaweza kumaanisha hasa kuendesha ibada ya sadaka ya dhambi au kutakasa kwa sadaka hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: Kuhani
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya כֹּהֵן katika Kiswahili; uamilifu wake katika sentensi unaonyesha mhusika maalumu bila kulazimisha kiambishi cha uainishaji kisicho cha kawaida.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: anayefanya upatanisho kwa kutumia sadaka hiyo
  rationale: Katika sheria za dhabihu, kitenzi cha Piel מן חטא kina maana maalumu ya kuendesha ibada ya sadaka ya dhambi, ikiwa ni pamoja na utakaso au kufanya upatanisho. Kauli hii ni ya asili kwa Kiswahili na inaacha ufafanuzi mwingine wa kiibada katika tanbihi.
- source_word: יֹאכֲלֶנָּה
  choice: ndiye atakayeila
  rationale: Kauli ya wakati ujao hapa ni agizo la kisheria. Muundo wa 'ndiye' unahifadhi mkazo wa Kiebrania kwamba kuhani aliyeendesha ibada hiyo ndiye anayepaswa kula sadaka.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: mahali patakatifu
  rationale: Kirai hakina kibainishi cha uhakika kwa 'mahali'; Kiswahili 'mahali patakatifu' huhifadhi maana bila kukifanya kuwa jina maalumu la eneo.
- source_word: תֵּאָכֵל
  choice: Italiwa
  rationale: Kauli tendwa huhifadhi mwelekeo wa Kiebrania kwa sadaka na huwasilisha agizo la kiibada kwa ufupi.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: katika ua wa hema la kukutania
  rationale: '''Ua'' ni istilahi ya kawaida kwa חָצֵר, na ''hema la kukutania'' ni tafsiri sanifu na inayoeleweka ya אֹהֶל מוֹעֵד.'
theological_decisions:
- issue: Maana ya kiibada ya חטא katika sheria za dhabihu
  choice: anayefanya upatanisho kwa kutumia sadaka hiyo
  alternative: anayetoa sadaka hiyo kwa ajili ya dhambi; anayefanya ibada ya sadaka ya dhambi
  rationale: Tafsiri iliyochaguliwa inaonyesha kazi ya kuhani katika ibada bila kuingiza mfumo wa kimadhehebu. Kwa kuwa kitenzi kinaweza kuelekeza zaidi kwenye kutakasa au kuendesha ibada ya sadaka ya dhambi, uwezekano huo umehifadhiwa katika tanbihi.
- issue: Marejeo ya viwakilishi vya kike
  choice: sadaka hiyo / -i-
  alternative: mnyama huyo
  rationale: Viwakilishi vya Kiebrania ni vya kike kisarufi, lakini rejeo ni sadaka au mnyama wa dhabihu. Kiswahili hufuata ngeli ya nomino iliyotumika, hivyo 'sadaka hiyo' na 'kuila' huwasilisha rejeo hilo kwa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za kiibada zimetumika kwa uthabiti; sentensi fupi na kauli tendwa huhifadhi mtindo wa sheria za ukuhani.
