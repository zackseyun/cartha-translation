  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: sw
  text: 'Na hii ndiyo sheria[a] ya sadaka ya nafaka: wana wa Aroni wataileta mbele za Yahwe, mbele ya madhabahu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maagizo kwa ajili ya sadaka ya nafaka” au “kanuni ya sadaka ya nafaka.”
    reason: Neno la Kiebrania תּוֹרָה hapa linaweza kumaanisha sheria, maagizo, au kanuni inayoongoza utaratibu wa sadaka.
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Na hii ndiyo
  rationale: Muundo huu unaendeleza habari iliyotangulia na kwa Kiswahili cha kawaida unatambulisha sehemu mpya ya maagizo.
- source_word: תּוֹרַת
  choice: sheria
  rationale: Katika muktadha huu neno hilo linamaanisha utaratibu rasmi uliowekwa kwa ajili ya dhabihu; “sheria” inadumisha uzito wa kisheria na kiibada, huku tanbihi ikihifadhi maana mbadala za maagizo au kanuni.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za dhabihu za Walawi, מִנְחָה ni sadaka inayotokana na nafaka, si zawadi au sadaka ya jumla.
- source_word: הַקְרֵב אֹתָהּ
  choice: wataileta
  rationale: Kitenzi kinaeleza kuileta sadaka karibu kwa ajili ya kuiwasilisha kiibada. “Wataileta” ni cha kawaida katika Kiswahili na hakiongezi tendo lisilotajwa wazi.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Tafsiri hii inadumisha utambulisho wa kifamilia na kikuhani uliomo katika Kiebrania.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza kuwapo mbele ya Mungu, huku jina la agano likihifadhiwa.
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: upande wa mbele wa madhabahu
  rationale: Kifungu hiki kinataja mahali maalumu kuhusiana na madhabahu na kinatofautishwa na kifungu cha awali “mbele za Yahwe.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” linahifadhi jina binafsi la agano lililo katika maandishi ya Kiebrania na kutumia umbo linalotambulika katika Kiswahili, badala ya kulibadili kuwa cheo.
- issue: Maana ya תּוֹרָה katika sheria za dhabihu
  choice: sheria
  alternative: maagizo; kanuni
  rationale: “Sheria” inadumisha tabia rasmi ya utaratibu huu bila kukataa kwamba neno hilo pia linaweza kueleweka kama maagizo au kanuni; uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. “Mbele za” limetumiwa kwa uwepo wa Mungu, na “upande wa mbele wa” kwa eneo halisi la madhabahu, ili kutofautisha vifungu viwili vya Kiebrania.
