base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: sw
  text: Kuhani atavaa vazi lake la kitani, na atavaa nguo za ndani za kitani mwilini mwake.[a] Ataondoa majivu yaliyobaki baada ya moto kuteketeza sadaka ya kuteketezwa juu ya madhabahu,[b] na kuyaweka kando ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “juu ya mwili wake.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi zaidi, “majivu ambayo moto huteketeza sadaka ya kuteketezwa juu ya madhabahu.” Usemi wa Kiebrania ni mfupi na muundo wake unaweza kutafsiriwa kwa njia kadhaa zinazokaribiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: vazi lake la kitani
  rationale: Katika muktadha wa mavazi ya kikuhani, מִדּוֹ ni vazi rasmi, na בַד hutaja kitani. “Vazi” halibainishi kupita kiasi muundo wake.
- source_word: מִכְנְסֵי בַד
  choice: nguo za ndani za kitani
  rationale: Ni vazi la sehemu ya chini ya mwili lililovaliwa moja kwa moja mwilini; usemi huu ni wa sasa na unaeleweka kuliko istilahi za kale.
- source_word: עַל בְּשָׂרוֹ
  choice: mwilini mwake
  rationale: Kihalisi ni “juu ya nyama/mwili wake”; “mwilini mwake” ni Kiswahili cha kawaida kinachoonyesha kuwa vazi hilo lilivaliwa moja kwa moja mwilini.
- source_word: וְהֵרִים
  choice: ataondoa
  rationale: Ingawa kitenzi kimsingi humaanisha kuinua, hapa kinaeleza hatua ya kuondoa majivu madhabahuni.
- source_word: הַדֶּשֶׁן
  choice: majivu
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha mabaki ya majivu ya kilichoteketezwa madhabahuni.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: yaliyobaki baada ya moto kuteketeza sadaka ya kuteketezwa
  rationale: Kirai cha Kiebrania ni kifupi na muundo wake una ugumu; tafsiri hii inaeleza kwa kawaida uhusiano wa majivu na sadaka iliyoteketezwa bila kuuficha utata huo, ambao umeonyeshwa katika tanbihi.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hii ni istilahi iliyo wazi kwa dhabihu ya עֹלָה, ambayo huchomwa yote madhabahuni.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: kando ya madhabahu
  rationale: אֵצֶל huonyesha ukaribu pembeni mwa kitu; “kando ya madhabahu” ni fupi na ya kawaida.
