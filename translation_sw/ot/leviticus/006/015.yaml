base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: sw
  text: 'Kuhani aliyetiwa mafuta kutoka miongoni mwa wanawe, atakayechukua nafasi yake[a], ataiandaa. Hii ni sheria ya kudumu[b] kwa BWANA: sadaka hiyo itatolewa yote kwa moshi.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayekuwa mahali pake”; kwa neno halisi, “chini yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sheria ya daima” au “agizo la milele.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “itafanywa kuwa moshi kabisa”; yaani, sadaka nzima inateketezwa juu ya madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: kuhani aliyetiwa mafuta
  rationale: Hutafsiri wazi cheo cha kikuhani cha mtu aliyewekwa rasmi kwa kutiwa mafuta, bila kukifanya kuwa jina la Kimasihi.
- source_word: מִבָּנָיו תַּחְתָּיו
  choice: kutoka miongoni mwa wanawe, atakayechukua nafasi yake
  rationale: Huhifadhi lugha ya ukoo wa kiume na kueleza kwa Kiswahili cha kawaida dhana ya mrithi anayehudumu mahali pake.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: ataiandaa
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutengeneza; katika utaratibu huu wa sadaka, 'kuandaa' ni wazi bila kuongeza tendo lisilotajwa.
- source_word: חָק עוֹלָם
  choice: sheria ya kudumu
  rationale: Huwasilisha wajibu wenye kuendelea kwa lugha ya sasa na iliyo rasmi, bila kutumia mtindo wa kizamani.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Jina la agano YHWH limetolewa kwa desturi ya mradi kama 'BWANA'; kihusishi 'kwa' kinafaa kwa jambo lililowekwa wakfu kwake.
- source_word: כָּלִיל תָּקְטָר
  choice: sadaka hiyo yote itafanywa kuwa moshi
  rationale: Huhifadhi wazo mahususi la sadaka nzima kupandishwa kama moshi juu ya madhabahu, badala ya kulipunguza kuwa kuchomwa tu.
theological_decisions:
- issue: Utambulisho wa 'kuhani aliyetiwa mafuta'
  choice: Kuhani aliyetiwa mafuta kwa ajili ya cheo, ambaye anarithi huduma hiyo
  alternative: Kuhani yeyote aliyetiwa mafuta, au jina la Kimasihi
  rationale: Muktadha wa ibada pamoja na maneno ya kurithi nafasi kutoka miongoni mwa wanawe yanaelekeza kwenye cheo cha kikuhani kinachopokezanwa, si jina la Kimasihi.
- issue: Uwasilishaji wa YHWH
  choice: BWANA
  alternative: Yahwe au Yehova
  rationale: Hufuata utaratibu wa mradi wa kuwasilisha tetragramatoni kwa 'BWANA' huku ikidumisha heshima na matumizi yaliyozoeleka katika tafsiri za Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki karibu na mpangilio wa Kiebrania lakini unasomeka kwa urahisi; istilahi za ibada zimeelezwa bila kuingiza msimamo wa dhehebu.
