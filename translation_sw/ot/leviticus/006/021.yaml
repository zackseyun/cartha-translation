base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: sw
  text: Chombo cha udongo ambacho sadaka hiyo imechemshwa ndani yake lazima kivunjwe; lakini ikiwa imechemshwa katika chombo cha shaba[a], chombo hicho lazima kisuguliwe na kusuzwa kwa maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chombo cha shaba nyekundu.” Neno la Kiebrania נְחֹשֶׁת linaweza kumaanisha shaba nyekundu (copper) au shaba nyeusi (bronze), kutegemeana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: chombo cha udongo
  rationale: Hutaja chombo kilichotengenezwa kwa udongo wa mfinyanzi na kuhifadhi tofauti ya nyenzo inayosababisha masharti tofauti ya utakaso.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: imechemshwa
  rationale: Katika muktadha huu wa sadaka, kitenzi בשׁל kinaelekea kumaanisha kupika kwa kuchemsha; umbo la kutendwa limehifadhiwa.
- source_word: בּוֹ
  choice: ndani yake
  rationale: Kiambishi hiki kinarejelea chombo na kuonyesha mahali ambamo sadaka ilichemshwa.
- source_word: יִשָּׁבֵר
  choice: lazima kivunjwe
  rationale: Kauli ya sheria inaonyesha wajibu; 'lazima' huuwasilisha wazi katika Kiswahili cha sasa.
- source_word: כְלִי נְחֹשֶׁת
  choice: chombo cha shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha shaba nyekundu au aloi yake, shaba nyeusi; 'shaba' ni neno la kawaida linalofaa katika matini, huku tofauti hiyo ikielezwa katika tanbihi.
- source_word: וּמֹרַק
  choice: kisuguliwe
  rationale: מרק huonyesha kusafisha kwa kusugua kabisa, hasa chombo cha metali.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: na kuoshwa kwa maji
  rationale: שטף huonyesha kuosha au kusuza kwa maji; 'kuoshwa kwa maji' ni ya kawaida na inaendeleza tendo la pili baada ya kusuguliwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Rejeo la wazi 'sadaka hiyo' limetumiwa kufafanua kiwakilishi kisichotajwa moja kwa moja katika Kiebrania lakini kinachoeleweka kutokana na muktadha; 'chombo hicho' pia linaondoa utata wa kisarufi kuhusu kinachosuguliwa na kuoshwa.
