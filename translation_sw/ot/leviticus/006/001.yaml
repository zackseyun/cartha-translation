lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kitenzi דבר katika utangulizi wa usemi kinaonyesha hatua inayofuata ya simulizi. Kiswahili cha kawaida hutumia “akasema na” kwa usemi unaoelekezwa kwa mtu, huku kiambishi “aka-” kikibeba mwendelezo wa simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA,” ili kuhifadhi jina la pekee lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: na
  rationale: Baada ya “akasema,” Kiswahili sanifu hutumia “na” kumtaja mtu anayesemeshwa; hii ndiyo tafsiri ya kiasili ya אֶל katika muundo huu.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: “Akisema” huhifadhi fomula ya Kiebrania inayotanguliza maneno ya moja kwa moja yatakayofuata, ingawa katika Kiswahili inaweza kuonekana kuwa ya kurudia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la pekee יהוה, si cheo. “Yahwe” hulihifadhi wazi, huku tanbihi ikieleza desturi ya kulitafsiri “BWANA.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo “akisema” umehifadhiwa kwa sababu mstari huu ni fomula rasmi ya kuanzisha usemi unaoendelea katika mstari unaofuata.
