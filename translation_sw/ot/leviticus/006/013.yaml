  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: sw
  text: 'Hii ndiyo sadaka ya Aroni na wanawe, ambayo watamtolea BWANA siku atakapotiwa mafuta[a]: sehemu moja ya kumi ya efa ya unga laini, kuwa sadaka ya nafaka ya kawaida; nusu yake asubuhi, na nusu yake jioni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku ya kutiwa kwake mafuta.” Kiebrania kina kiambishi cha kiwakilishi cha umoja (“yeye”), ingawa mstari huu unawataja “Aroni na wanawe.”
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבַּן
  choice: sadaka
  rationale: Ni neno pana la kitu kinacholetwa mbele za Mungu katika ibada; “sadaka” ni neno la kawaida na lenye heshima katika Kiswahili cha sasa.
- source_word: יַקְרִיבוּ
  choice: watakayomtolea
  rationale: Katika muktadha wa dhabihu, Hiphil ya קרב humaanisha kuleta au kutoa sadaka mbele za Mungu. “Kumtolea” ni ya asili katika Kiswahili na inaonyesha tendo rasmi la ibada.
- source_word: לַיהוָה
  choice: kwa BWANA
  rationale: Jina la agano יהוה limetafsiriwa kwa desturi ya Kiswahili kuwa “BWANA,” huku herufi kubwa zikilitofautisha na cheo cha kawaida.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: siku atakapotiwa mafuta
  rationale: Kirai kinaonyesha wakati wa kutiwa mafuta na kina kiwakilishi cha umoja katika Kiebrania. Tafsiri inadumisha umoja huo bila kuubadili kimya kuwa wingi.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: sehemu moja ya kumi ya efa
  rationale: Hii ni tafsiri wazi na sahihi ya kipimo cha sehemu moja ya kumi ya efa, huku jina la kipimo cha kale likihifadhiwa.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili linamaanisha unga uliosafishwa vizuri uliotumiwa kwa sadaka za nafaka; “unga laini” ni wazi kwa msomaji wa kawaida.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za Walawi, neno hili humaanisha hasa sadaka iliyotengenezwa kwa nafaka, si sadaka kwa maana pana tu.
- source_word: תָּמִיד
  choice: ya daima
  rationale: Neno linaonyesha mwendelezo au kurudiwa kwa ukawaida. “Ya daima” huhifadhi wazo hilo bila kuongeza neno “kila siku,” ambalo halipo moja kwa moja katika kifungu hiki.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: nusu yake ... na nusu nyingine
  rationale: Maneno haya yanaonyesha kugawanywa kwa sadaka katika sehemu mbili zilizo sawa; “nusu nyingine” huepuka urudiaji mzito bila kubadili maana.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: asubuhi ... jioni
  rationale: Hizi ndizo kauli za kawaida na za asili za nyakati hizo katika Kiswahili cha Afrika Mashariki.
theological_decisions:
- issue: Kiwakilishi cha umoja katika kirai kinachofuata “Aroni na wanawe”
  choice: Kudumisha umoja kwa kusema “siku atakapotiwa mafuta.”
  alternative: Kutafsiri kwa wingi, “siku watakapotiwa mafuta,” kwa kulinganisha na “Aroni na wanawe.”
  rationale: Andiko la Kimasora lina kiwakilishi cha umoja, ingawa limetaja Aroni na wanawe. Tafsiri haijasawazisha mvutano huu kimya; tanbihi inaueleza ili msomaji auone.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye heshima. Istilahi za ibada kama “sadaka ya nafaka” na kipimo cha kale “efa” zimehifadhiwa kwa usahihi, na mvutano wa kisarufi wa kiwakilishi cha umoja umeonyeshwa badala ya kuondolewa.
