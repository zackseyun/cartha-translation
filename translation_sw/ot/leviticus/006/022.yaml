  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: sw
  text: Kila mtu wa kiume miongoni mwa makuhani anaweza kuila; ni takatifu sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ina usemi wa mkazo, kwa maana halisi “utakatifu wa vitakatifu”; humaanisha “takatifu sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Kila mwanamume
  rationale: Muundo wa Kiebrania una maana ya mgawanyo, yaani kila mtu wa kiume mmoja mmoja; “mwanamume” huhifadhi rejeo mahsusi kwa jinsia ya kiume katika masharti haya ya kikuhani.
- source_word: בַּכֹּהֲנִים
  choice: miongoni mwa makuhani
  rationale: Kihusishi ב hapa huonyesha kuwa mhusika ni sehemu ya kundi la makuhani; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יֹאכַל
  choice: anaweza kuila
  rationale: Katika sheria hii, kitenzi kisichotimilika kinaeleza ruhusa iliyowekwa, si amri kwamba lazima kila kuhani aile.
- source_word: אֹתָהּ
  choice: kuila
  rationale: Kiambishi -i- kinarejelea sadaka inayozungumziwa bila kuongeza nomino ambayo haijarudiwa katika mstari huu.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Hii ni nahau ya Kiebrania ya kiwango cha juu kabisa cha utakatifu; tafsiri hii ni ya kawaida na haileti maana ya mahali patakatifu.
- source_word: הִוא
  choice: ni
  rationale: Kishazi kisicho na kitenzi katika Kiebrania kinatolewa kwa kiunganishi cha kawaida cha Kiswahili, huku rejeo likibaki kwenye kitu kinachozungumziwa.
