  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: sw
  text: Kilichobaki watakula Aroni na wanawe[a]. Kitaliwa bila chachu[c] mahali patakatifu[b]; watakila katika ua wa Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu iliyobaki” au “kilichosalia.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “mahali patakatifu,” si “mahali pale patakatifu”; kishazi kinachofuata kinabainisha kuwa ni ua wa Hema la Kukutania.
    reason: lexical_alternative
  - marker: c
    text: Au, “kama mikate isiyotiwa chachu.” Kiebrania kinaonyesha kwamba sadaka hiyo ilipaswa kuliwa ikiwa haina chachu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: Baki yake
  rationale: Kirai hiki cha kawaida kinaonyesha sehemu ya sadaka ya nafaka iliyobaki, huku kiwakilishi kikirejelea sadaka hiyo.
- source_word: יֹאכְלוּ
  choice: watakula
  rationale: Wakati ujao katika muktadha huu wa sheria una nguvu ya agizo; Kiswahili hutumia umbo hili kwa maagizo rasmi.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aroni na wanawe
  rationale: Neno בנים hapa linawahusu wana wa kiume wa Aroni waliokuwa katika huduma ya ukuhani.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: Italiwa bila chachu
  rationale: Tafsiri hii inahifadhi hali ya kutokuwa na chachu bila kuongeza kwa lazima nomino kama 'mkate' au kubainisha umbo la chakula.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: mahali patakatifu
  rationale: Kiebrania hakina kiainishi maalumu katika kirai hiki; sentensi inayofuata inabainisha mahali hapo kuwa ua wa Hema la Kukutania.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: katika ua wa Hema la Kukutania
  rationale: ‘Ua’ ni neno la kawaida kwa eneo lililozungushiwa la patakatifu, na ‘Hema la Kukutania’ huhifadhi taswira na kusudi la jina la Kiebrania.
- source_word: יֹאכְלוּהָ
  choice: wataila
  rationale: Marudio ya kitenzi na kiambishi cha yambwa yamehifadhiwa kwa kuwa yanasisitiza na kubainisha agizo.
