base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: sw
  text: 'Waambie Haruni na wanawe hivi: “Hii ndiyo sheria ya sadaka ya dhambi[a]: Mahali ambapo sadaka ya kuteketezwa huchinjwa, sadaka ya dhambi itachinjwa mbele za Yahwe. Ni takatifu sana.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya utakaso”; neno la Kiebrania חַטָּאת linaweza kumaanisha dhambi na pia sadaka inayohusiana na utakaso kutokana nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל אַהֲרֹן וְאֶל בָּנָיו לֵאמֹר
  choice: Waambie Haruni na wanawe hivi
  rationale: Hutoa kwa Kiswahili cha kawaida na chenye hadhi fomula ya maagizo ya Kiebrania, bila tafsiri nzito isiyo ya kawaida kama ‘sema na ... ukisema.’
- source_word: זֹאת תּוֹרַת
  choice: Hii ndiyo sheria ya
  rationale: Neno תּוֹרָה hapa linamaanisha agizo au utaratibu wa dhabihu; ‘sheria’ linadumisha uzito wa kisheria na linaeleweka kwa urahisi.
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חַטָּאת hutaja dhabihu inayohusiana na dhambi na utakaso. ‘Sadaka ya dhambi’ ni istilahi inayoeleweka, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: Mahali ambapo sadaka ya kuteketezwa huchinjwa
  rationale: ‘Huchinjwa’ linafaa kwa tendo la kawaida la dhabihu, na ‘sadaka ya kuteketezwa’ huwasilisha istilahi עֹלָה kwa uwazi.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: sadaka ya dhambi itachinjwa
  rationale: Wakati ujao wa Kiswahili hapa unaonyesha sharti la kisheria la kitenzi cha Kiebrania katika muktadha huu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: ‘Mbele za’ ni usemi wa kawaida wa Kiswahili unaoonyesha kufanyika katika uwepo wa Mungu; jina la agano יְהוָה limetolewa kama ‘Yahwe.’
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: Ni takatifu sana
  rationale: Muundo wa Kiebrania unaonyesha kiwango cha juu kabisa cha utakatifu. ‘Takatifu sana’ ni Kiswahili cha asili na hakichanganyi dhabihu hii na mahali paitwapo Patakatifu Zaidi.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria ya dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Istilahi hiyo inaweza kusisitiza dhambi au utakaso unaohusiana na dhabihu. Tafsiri kuu inadumisha jina linalotambulika sana, na tanbihi inahifadhi maana nyingine halali.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, si cheo; ‘Yahwe’ hulitofautisha na neno la kawaida la ‘Bwana.’
- issue: Kiwango cha utakatifu katika קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  alternative: takatifu kuliko vyote
  rationale: Tafsiri hii huonyesha nguvu ya muundo wa kusisitiza wa Kiebrania bila kudokeza kwamba sadaka yenyewe ni sehemu ya jengo la patakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaofaa kwa sheria za ibada. Muundo wa ufunguzi umefanywa wa kawaida kwa Kiswahili, huku istilahi za dhabihu na nguvu ya maagizo zikidumishwa.
