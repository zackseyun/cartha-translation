  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: sw
  text: Kila mwanamume miongoni mwa wana wa Aroni anaweza kula sehemu hiyo. Hii ni sheria ya kudumu katika vizazi vyenu vyote kuhusu sadaka za Yahwe zinazotolewa kwa moto. Chochote kitakachozigusa kitakuwa kitakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Chochote kitakachozigusa kitawekwa wakfu.” Kiebrania kinaweza kumaanisha kwamba kitu au mtu anakuwa mtakatifu kwa kuvigusa; wengine hukielewa kwa maana yenye kuweka mpaka zaidi, ya kwamba ni kile kilicho kitakatifu tu kinachoweza kuzigusa.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Kila mwanamume
  rationale: Huwasilisha kwa usahihi jinsia ya kiume katika masharti haya ya kikuhani; hapa neno linatumiwa kwa kila mmoja katika kundi.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: miongoni mwa wana wa Aroni
  rationale: Hudumisha jina la kifamilia na kikuhani lililo katika Kiebrania bila kulipanua kimakusudi.
- source_word: יֹאכֲלֶנָּה
  choice: anaweza kula sehemu yake
  rationale: Hueleza ruhusa au haki ya kuhani kula kutoka katika fungu la sadaka linalotajwa katika muktadha, bila kudokeza kuwa lazima alile lote.
- source_word: חָק עוֹלָם
  choice: sheria ya kudumu
  rationale: Ni lugha ya sasa na ya heshima inayoonyesha kwamba agizo hilo lina nguvu ya kuendelea.
- source_word: לְדֹרֹתֵיכֶם
  choice: katika vizazi vyenu vyote
  rationale: Huwasilisha fomula ya agano kuhusu kuendelea kwa agizo katika vizazi vinavyofuatana.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: kuhusu sadaka za Yahwe zinazotolewa kwa moto
  rationale: Huhifadhi uhusiano wa אִשֶּׁה na utoaji wa sadaka kwa moto, huku Kiswahili kikibaki wazi na cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la Mungu kama jina maalumu badala ya kulibadilisha kuwa cheo.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: Chochote kitakachozigusa
  rationale: Kiebrania hakibainishi ikiwa anayegusa ni mtu au kitu; “chochote” huhifadhi upana huo.
- source_word: יִקְדָּשׁ
  choice: kitakuwa kitakatifu
  rationale: Hueleza badiliko linalotokana na kugusa vitu vitakatifu, ambalo ndilo wazo la kawaida la kitenzi katika muundo huu.
theological_decisions:
- issue: Maana ya uhamishaji wa utakatifu katika kishazi cha mwisho
  choice: Kugusa sadaka hizi kunafanya anayezigusa au kinachozigusa kuwa kitakatifu.
  alternative: 'Kishazi kinaweza kueleweka kwa maana yenye kuweka mpaka: ni kile kilicho kitakatifu tu kinachoruhusiwa kuzigusa; pia kinaweza kudokeza kwamba mgusaji anawekwa chini ya wajibu wa hali takatifu.'
  rationale: Muundo wa kawaida wa יִקְדָּשׁ baada ya “chochote kitakachozigusa” unaonyesha matokeo ya kuwa kitakatifu. Tanbihi huhifadhi uwezekano wa uelewa wenye kuweka mpaka bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisheria na wa heshima lakini unaeleweka kwa msomaji wa kawaida. Kiwakilishi cha wingi katika “kitakachozigusa” kinarejelea sadaka. Alama ya tanbihi imewekwa kwenye kishazi cha mwisho ambacho tanbihi inakifafanua.
