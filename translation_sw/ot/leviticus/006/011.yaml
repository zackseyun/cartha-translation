review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the priestly restriction to males among Aaron's sons, the enduring statute, the fire-offering context, and the broad final clause. However, “sehemu yake” naturally suggests each man's own allotted share, whereas the Hebrew suffix refers to the offering portion under discussion. “Sehemu hiyo” preserves the referent without introducing that ambiguity.
  naturalness: The Swahili is clear, modern, and appropriately formal. The proposed small adjustment is more idiomatic and referentially precise.
  terminology: “Wana wa Aroni,” “sheria ya kudumu,” “Yahwe,” “sadaka ... zinazotolewa kwa moto,” and “kitakatifu” are suitable Standard East African Swahili renderings. The footnote responsibly retains the alternative restrictive interpretation without deciding it.
  issues:
  - severity: low
    issue: “anaweza kula sehemu yake” can imply that each eligible male eats his own personal share.
    rationale: The Hebrew יֹאכֲלֶנָּה has a feminine singular object suffix referring to the sacrificial offering/portion in the preceding context, not to a share possessed by the individual male. “Sehemu hiyo” retains the contextual referent more accurately.
  revised_text: Kila mwanamume miongoni mwa wana wa Aroni anaweza kula sehemu hiyo. Hii ni sheria ya kudumu katika vizazi vyenu vyote kuhusu sadaka za Yahwe zinazotolewa kwa moto. Chochote kitakachozigusa kitakuwa kitakatifu.[a]
  revised_footnotes:
  - marker: a
    text: Au, “Chochote kitakachozigusa kitawekwa wakfu.” Kiebrania kinaweza kumaanisha kwamba kitu au mtu anakuwa mtakatifu kwa kuvigusa; wengine hukielewa kwa maana yenye kuweka mpaka zaidi, ya kwamba ni kile kilicho kitakatifu tu kinachoweza kuzigusa.
    reason: alternative_reading
  revision_rationale: A minimal revision replaces the potentially possessive “sehemu yake” with “sehemu hiyo,” making the pronoun refer to the offering portion in context. The final clause and its footnote retain the Hebrew's breadth and its debated implication of holiness through contact.
