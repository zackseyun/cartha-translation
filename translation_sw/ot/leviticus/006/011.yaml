revisions:
- from: Kila mwanamume miongoni mwa wana wa Aroni anaweza kula sehemu yake. Hii ni sheria ya kudumu katika vizazi vyenu vyote kuhusu sadaka za Yahwe zinazotolewa kwa moto. Chochote kitakachozigusa kitakuwa kitakatifu.[a]
  to: Kila mwanamume miongoni mwa wana wa Aroni anaweza kula sehemu hiyo. Hii ni sheria ya kudumu katika vizazi vyenu vyote kuhusu sadaka za Yahwe zinazotolewa kwa moto. Chochote kitakachozigusa kitakuwa kitakatifu.[a]
  rationale: A minimal revision replaces the potentially possessive “sehemu yake” with “sehemu hiyo,” making the pronoun refer to the offering portion in context. The final clause and its footnote retain the Hebrew's breadth and its debated implication of holiness through contact.
  reviewer_model: gpt-5.6-terra
