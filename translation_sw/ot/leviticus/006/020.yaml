base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: sw
  text: Kila kitu kitakachogusa nyama yake kitakuwa kitakatifu. Damu yake ikirukia vazi[a], utalifua vazi hilo mahali patakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikinyunyizwa juu ya vazi.” Kitenzi cha Kiebrania kinaweza kumaanisha kunyunyiza kwa ibada; hapa “ikirukia” limetumiwa kwa kuwa damu inafika kwenye vazi ambalo baadaye linafuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Kila kitu kitakacho-
  rationale: Huu ni usemi jumuishi usio na rejeleo maalumu; “kila kitu” unaendana na muktadha wa kitu chochote kinachogusa sadaka.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: kitakachogusa nyama yake
  rationale: בָּשָׂר ni nyama au mwili wenye nyama; katika muktadha wa sadaka, “nyama yake” ni Kiswahili cha kawaida na huonyesha nyama ya sadaka bila kuingiza maana nyingine.
- source_word: יִקְדָּשׁ
  choice: kitakuwa kitakatifu
  rationale: Kitenzi kinaonyesha kuingia katika hali ya utakatifu kwa kugusa sadaka; tafsiri hii huhifadhi mabadiliko ya hali bila kudokeza kwamba ibada nyingine ya kuweka wakfu ilifanywa.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ עַל הַבֶּגֶד
  choice: Damu yake ikirukia vazi
  rationale: נזה hapa huonyesha damu inayofika juu ya vazi. “Ikirukia” ni ya kawaida na inafaa kwa damu inayopaswa kuoshwa, huku tanbihi ikihifadhi uwezekano wa maana ya kiibada ya kunyunyiza.
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ תְּכַבֵּס
  choice: utalifua vazi hilo
  rationale: Tamko la Kiebrania linamwagiza mhusika moja kwa moja kuliosha vazi ambalo damu imelifikia. “Kulふa vazi” ni usemi sahihi wa Kiswahili kwa כבס, yaani kuosha nguo.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: mahali patakatifu
  rationale: Kirai hakina kibainishi kinacholazimisha eneo moja maalumu; “mahali patakatifu” huhifadhi maana ya eneo lililotengwa kuwa takatifu bila kulitambulisha na patakatifu pa ndani.
theological_decisions:
- issue: Utakatifu unaopatikana kwa kugusa nyama ya sadaka ya dhambi
  choice: Kitu kinachogusa nyama ya sadaka kinaingia katika hali ya utakatifu wa kiibada.
  alternative: Kitu hicho kinawekewa mipaka kwa matumizi matakatifu bila kusemwa kuwa kinabadilika hali.
  rationale: יִקְדָּשׁ husema kwa uwazi kuwa kitakuwa kitakatifu, lakini muktadha ni wa taratibu za ibada, si madai ya mabadiliko ya maadili ya ndani. Tafsiri huhifadhi lugha hiyo na mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimewekwa wazi kwa msomaji wa kawaida, huku istilahi za kiibada “kitakatifu” na “mahali patakatifu” zikihifadhiwa.
