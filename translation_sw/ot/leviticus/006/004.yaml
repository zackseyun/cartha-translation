  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: sw
  text: Kisha atavua mavazi yake na atavaa mavazi mengine; halafu atayapeleka majivu nje ya kambi hadi mahali safi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Safi” hapa inarejelea usafi wa kiibada, kama unavyoeleweka katika sheria za Mambo ya Walawi.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: Kisha atavua
  rationale: Katika muktadha wa mavazi, פשט humaanisha kuvua. “Kisha” linaonyesha mfuatano wa hatua katika maagizo.
- source_word: בְּגָדָיו
  choice: mavazi yake
  rationale: “Mavazi” ni neno la kawaida lakini lenye hadhi inayofaa muktadha wa kikuhani na wa ibada.
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: na kuvaa mavazi mengine
  rationale: Tafsiri hii inaonyesha kwa kawaida kwamba anabadilisha mavazi ya kwanza na kuvaa mengine.
- source_word: וְהוֹצִיא
  choice: halafu atayatoa ... na kuyapeleka
  rationale: Hifili ya יצא ina maana ya kutoa au kupeleka kitu nje. Muundo huu wa Kiswahili unaonyesha wazi kuondolewa kwa majivu na kupelekwa mahali palipotajwa.
- source_word: הַדֶּשֶׁן
  choice: majivu
  rationale: Katika muktadha huu דשן ni majivu au mabaki ya sadaka ya kuteketezwa kutoka madhabahuni; “majivu” ni neno la kawaida la Kiswahili.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Kirai hiki kinaonyesha mwendo kuelekea eneo lililo ng’ambo ya mipaka ya kambi.
- source_word: אֶל מָקוֹם טָהוֹר
  choice: mahali safi
  rationale: “Safi” linatafsiri טָהוֹר moja kwa moja huku muktadha wa Mambo ya Walawi ukibeba maana ya usafi wa kiibada.
theological_decisions:
- issue: Maana ya usafi katika טָהוֹר
  choice: mahali safi
  alternative: mahali palipo safi kiibada
  rationale: Maandishi yenyewe yameachwa mafupi na ya moja kwa moja; tanbihi inaeleza kwamba usafi unaokusudiwa ni wa kiibada bila kuingiza ufafanuzi huo ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa hatua kwa hatua umehifadhiwa, na istilahi za ibada zimeelezwa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
