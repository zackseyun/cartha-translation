base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: sw
  text: Hiyo isiokwe kwa chachu. Nimewapa hiyo kuwa sehemu yao miongoni mwa sadaka zangu zitolewazo kwa moto.[a] Ni takatifu sana, kama sadaka ya dhambi na sadaka ya hatia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka zangu za chakula.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya fidia”; kwa mapokeo, “sadaka ya kosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה חָמֵץ
  choice: isitiwe chachu wakati wa kuokwa
  rationale: Muundo huu wa Kiswahili unaonyesha hali tendwa ya kitenzi cha Kiebrania na katazo la kutumia chachu, bila kuongeza kwamba kinachookwa lazima kiitwe mkate.
- source_word: חֶלְקָם
  choice: sehemu yao
  rationale: Neno hili linaonyesha fungu walilogawiwa makuhani; ‘sehemu yao’ ni Kiswahili cha kawaida na huhifadhi kiambishi cha umilikaji cha wingi.
- source_word: נָתַתִּי אֹתָהּ
  choice: nimewapa hiyo
  rationale: Wakati timilifu unaonyesha kwamba BWANA amekwisha kuwapa fungu hilo kwa uamuzi wenye nguvu ya kudumu. ‘Hiyo’ inarejelea sehemu ya sadaka iliyotajwa katika muktadha.
- source_word: מֵאִשָּׁי
  choice: kutoka katika sadaka zangu zitolewazo kwa moto
  rationale: Hili ni jina la kiufundi la sadaka inayotolewa kwa BWANA kwa njia inayohusisha moto. Tafsiri hii huhifadhi picha ya moto iliyo katika neno la Kiebrania bila kudokeza kwamba sadaka yote huteketezwa.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: takatifu sana
  rationale: Urudiaji huu wa Kiebrania unaonyesha kiwango cha juu kabisa cha utakatifu. ‘Takatifu sana’ ni usemi wa kawaida na unaofaa kwa uainishaji wa sadaka.
- source_word: כַּחַטָּאת
  choice: kama sadaka ya dhambi
  rationale: Kiambishi כְּ kinaonyesha ulinganisho wa hadhi ya utakatifu; ‘sadaka ya dhambi’ ni jina linaloeleweka la aina hii ya sadaka.
- source_word: וְכָאָשָׁם
  choice: na sadaka ya hatia
  rationale: Katika muktadha wa sadaka, אָשָׁם hutaja sadaka inayohusiana na hatia na mara nyingi fidia. ‘Sadaka ya hatia’ huhifadhi jina la aina hiyo bila kulazimisha nadharia maalumu ya kitheolojia.
theological_decisions:
- issue: Maana ya neno la sadaka אִשֶּׁה
  choice: sadaka zangu zitolewazo kwa moto
  alternative: sadaka zangu za chakula
  rationale: Tafsiri kuu huhifadhi uhusiano wa neno hili la kiufundi na moto. Kwa kuwa katika matumizi ya kikuhani neno hilo pia linaweza kueleweka kama sadaka inayotolewa kwa Mungu kama chakula chake kwa njia ya mfano, maana hiyo imehifadhiwa katika tanbihi.
- issue: Maana ya sadaka אָשָׁם
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: ‘Sadaka ya hatia’ ndiyo istilahi iliyo wazi na inayotofautisha aina hii na sadaka ya dhambi. Hata hivyo, kwa kuwa sadaka hii mara nyingi inahusisha kulipa fidia au kurekebisha kosa, tafsiri hiyo mbadala imeonyeshwa bila kuondoa mvutano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Muundo wa kisheria ‘isitiwe… wakati wa kuokwa’ huhifadhi katazo na hali tendwa, huku istilahi za sadaka zikitolewa kwa lugha ya kawaida bila kuingiza msimamo wa dhehebu.
