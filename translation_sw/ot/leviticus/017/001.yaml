- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kauli hii ya kisimulizi inaanzisha tukio jipya la usemi; “akasema na” ni Kiswahili cha kawaida na chenye heshima katika fomula hii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
