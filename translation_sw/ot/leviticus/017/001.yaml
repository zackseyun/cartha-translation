  rationale: Pamoja na kitenzi “kusema,” Kiswahili cha kawaida hutumia “na” kumtaja anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania inayotanguliza yaliyomo katika usemi unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la Mungu YHWH moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kifomula “akisema” umehifadhiwa kwa sababu mstari huu unatambulisha usemi wa Mungu unaofuata.
