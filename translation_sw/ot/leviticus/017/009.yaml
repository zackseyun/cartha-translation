base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: sw
  text: wala asimlete mlangoni mwa Hema la Kukutania ili amtolee Yahwe,[a] mtu huyo atakatiliwa mbali na watu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “ili kuifanya kwa ajili ya Yahwe”; hapa nahau ya Kiebrania inamaanisha kutoa dhabihu.
    reason: lexical_alternative
  - marker: b
    text: “Atakatiliwa mbali” ni kauli ya kisheria ambayo adhabu yake hasa haijaelezwa hapa; huenda ikamaanisha kutengwa na jumuiya ya agano au hukumu ya moja kwa moja ya Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: mwingilio
  rationale: Neno hili humaanisha nafasi au njia ya kuingilia; “mwingilio” ni Kiswahili cha kawaida kinachofaa katika mazingira ya mahali patakatifu.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina maalumu la hema takatifu ambako Yahwe alikutana na Israeli; tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili cha Biblia.
- source_word: יְבִיאֶנּוּ
  choice: hamleti
  rationale: Kiambishi cha yambwa kinarejelea mnyama wa dhabihu katika muktadha uliotangulia. “Hamleti” huhifadhi tendo halisi bila kuongeza ufafanuzi wa kiibada.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: ili kumtolea Yahwe
  rationale: Ingawa maana ya moja kwa moja ni “ili kumfanya/kumwandaa kwa ajili ya Yahwe,” katika muktadha wa dhabihu kitenzi עשה ni nahau ya kuandaa au kutoa dhabihu. “Kumtolea Yahwe” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa uhamishaji wa sauti badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וְנִכְרַת
  choice: atakatiliwa mbali
  rationale: Kauli hii huhifadhi taswira ya kisheria ya “kukatiliwa mbali” bila kuamua ikiwa adhabu ni kifo, kufukuzwa katika jumuiya, au hukumu ya Mungu.
- source_word: הָאִישׁ הַהוּא
  choice: mtu huyo
  rationale: “Mtu huyo” ni usemi wa kisheria wa asili na unaoeleweka. Kiswahili hakihitaji kulazimisha jinsia ya kisarufi ya nomino ya Kiebrania hapa.
- source_word: מֵעַמָּיו
  choice: na watu wake
  rationale: Katika muundo “atakatiliwa mbali na,” kihusishi “na” huonyesha kutengwa kutoka kwa jumuiya yake kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana ya adhabu ya וְנִכְרַת, “atakatiliwa mbali”
  choice: Kuhifadhi kauli “atakatiliwa mbali” bila kutaja namna hasa ya adhabu.
  alternative: atauawa; atafukuzwa katika jumuiya; ataangamizwa
  rationale: Kauli ya kisheria ya Kiebrania haitaji hapa kama adhabu hiyo ni kifo, kutengwa na jumuiya, au hukumu ya moja kwa moja ya Mungu. Tafsiri haipaswi kuondoa mvutano huo.
- issue: Uwasilishaji wa הָאִישׁ הַהוּא
  choice: mtu huyo
  alternative: mwanamume huyo
  rationale: Ingawa Kiebrania kina nomino ya kiume katika umoja, katika sheria hii inamtaja mkosaji mmoja. “Mtu huyo” ni ya asili katika Kiswahili na haipanui wala kupunguza upeo wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendelea kutoka mstari uliotangulia, ndiyo sababu unaanza kwa “na wala.”
