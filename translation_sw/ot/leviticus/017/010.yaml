source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: sw
  text: Na mtu yeyote wa nyumba ya Israeli, au mgeni yeyote akaaye kati yao[a], atakayekula damu yoyote—nitauelekeza uso wangu dhidi ya mtu huyo anayekula damu[b], nami nitamkatilia mbali kutoka katikati ya watu wake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mgeni mkazi, au mtu wa kigeni anayeishi miongoni mwao.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nafsi inayokula”; hapa neno hilo humaanisha mtu binafsi anayefanya kosa.'
    reason: lexical_alternative
  - marker: c
    text: “Kumkatilia mbali” ni usemi wa adhabu katika agano. Aya hii haisemi wazi kama maana yake ni kifo, kufukuzwa katika jamii, au namna nyingine ya hukumu ya Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: Na mtu yeyote
  rationale: Urudiaji wa אִישׁ ni nahau ya kisheria yenye maana ya kila mmoja bila ubaguzi, yaani ‘mtu yeyote.’ Kiswahili ‘mtu yeyote’ kinawasilisha nguvu hiyo kwa kawaida.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: wa nyumba ya Israeli
  rationale: Huhifadhi usemi rasmi wa agano ‘nyumba ya Israeli’ badala ya kuufupisha kuwa ‘Israeli’ tu.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: au mgeni anayeishi kati yao
  rationale: גֵּר humaanisha mgeni asiye Mwisraeli ambaye amekaa ndani ya jamii, si msafiri anayepita tu. Usemi huu ni wa kawaida na unaendeleza uhusiano wa kitenzi na nomino katika Kiebrania.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: anayekula damu yoyote
  rationale: Kitenzi יֹאכַל ni ‘kula,’ na כָּל דָּם kinaonyesha marufuku inayohusu damu ya aina yoyote.
- source_word: וְנָתַתִּי פָנַי
  choice: nitauelekeza uso wangu dhidi ya
  rationale: Huhifadhi taswira ya Kiebrania ya Mungu kuuelekeza uso wake dhidi ya mkosaji, huku maana ya upinzani na hukumu ikieleweka kwa Kiswahili.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: dhidi ya mtu huyo anayekula
  rationale: נֶפֶשׁ hapa humrejelea mkosaji mwenyewe, hivyo ‘mtu huyo’ ni wazi zaidi kuliko ‘nafsi’ na haiongezi maana ya kimetafizikia isiyohitajika.
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: nami nitamkatilia mbali
  rationale: ‘Kumkatilia mbali’ huhifadhi nahau ya hukumu ya agano bila kuamua kama adhabu ni kifo, kufukuzwa katika jamii, au hukumu nyingine ya Mungu.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: kutoka miongoni mwa watu wake
  rationale: Huwasilisha kwa uwazi maana ya kuondolewa ‘kutoka katikati/miongoni mwa’ watu wake.
theological_decisions:
- issue: Maana ya kanuni ya adhabu וְהִכְרַתִּי (‘nitamkatilia mbali’)
  choice: Kuhifadhi usemi ‘nitamkatilia mbali’ bila kutaja namna kamili ya hukumu.
  alternative: ‘nitamuua,’ ‘nitamfukuza,’ au ‘nitamwondoa kwa hukumu ya Mungu’
  rationale: Aya inatangaza hukumu kali ya agano lakini haifafanui hapa njia yake. Tafsiri haipaswi kuondoa mvutano huo wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria na kidini lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa agano ‘nyumba ya Israeli’ na taswira ‘uso wangu dhidi ya’ zimehifadhiwa; nahau ya adhabu imeachwa bila kufafanuliwa kupita ushahidi wa maandishi.
