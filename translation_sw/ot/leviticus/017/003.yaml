base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: sw
  text: Mtu yeyote kutoka katika nyumba ya Israeli ambaye atachinja ng’ombe, kondoo au mbuzi ndani ya kambi, au ambaye atachinja nje ya kambi—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Mtu yeyote
  rationale: Urudiaji huu ni usemi wa kigawanyo unaomaanisha mtu mmoja mmoja au yeyote; Kiswahili cha asili hutumia “mtu yeyote” bila kuhitaji tanbihi ya jinsia.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: kutoka katika nyumba ya Israeli
  rationale: Inahifadhi nahau ya kiagano na kitaifa “nyumba ya Israeli” badala ya kuirahisisha kuwa jina la kikabila tu.
- source_word: יִשְׁחַט
  choice: atachinja
  rationale: Kitenzi hiki humaanisha kuchinja mnyama, mara nyingi katika muktadha wa dhabihu; “kuchinja” ni neno la kawaida na sahihi la Kiswahili.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno la Kiebrania hapa linataja mnyama mmoja wa jamii ya ng’ombe bila kulazimisha maana maalumu ya fahali au maksai.
- source_word: כֶשֶׂב
  choice: kondoo
  rationale: Linamaanisha kondoo kwa ujumla, si lazima mwana-kondoo.
- source_word: עֵז
  choice: mbuzi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mnyama huyu katika orodha ya mifugo ya dhabihu.
- source_word: בַּמַּחֲנֶה
  choice: ndani ya kambi
  rationale: Huonyesha mahali pa tendo kwa wazi na kwa Kiswahili cha kawaida.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Ni tafsiri ya kawaida na wazi ya eneo lililo nje ya mipaka ya kambi.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: ambaye ... au ambaye
  rationale: Inahifadhi usambamba wa vifungu viwili vya sheria katika Kiebrania.
- source_word: '[implicit object after second יִשְׁחַט]'
  choice: atamchinja
  rationale: Kiambishi cha yambwa “-m-” kinarejelea mnyama aliyetajwa na kufanya sentensi iwe wazi na ya kawaida katika Kiswahili bila kuongeza wazo jipya.
