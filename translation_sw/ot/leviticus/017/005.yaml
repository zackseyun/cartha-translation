id: LEV.17.5
reference: Leviticus 17:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: sw
  text: ili wana wa Israeli[a] walete dhabihu zao wanazozichinja katika uwanja wa wazi, wazilete kwa Yahweh, kwenye mlango wa Hema la Kukutania, kwa kuhani, na wazitoe kama dhabihu za amani[b] kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “dhabihu za ushirika” au “dhabihu za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi la agizo lililotangulia; “ili” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi usemi wa kifamilia wa Kiebrania, huku “Waisraeli” ikiwa tafsiri mbadala ya kawaida.
- source_word: זִבְחֵיהֶם
  choice: dhabihu zao
  rationale: “Dhabihu” huonyesha tendo na kitu kilichotolewa kwa kuchinjwa katika ibada, na ni neno linaloeleweka vizuri katika muktadha huu.
- source_word: אֲשֶׁר הֵם זֹבְחִים
  choice: wanazozitoa
  rationale: Muundo wa kitenzi-jina unaonyesha tendo lao linaloendelea au la kawaida. Katika Kiswahili, “wanazozitoa” ni ya asili na huepuka kurudia kwa uzito “wanazozichinja kuwa dhabihu.”
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: uwandani
  rationale: Usemi huu unaelekeza kwenye eneo la wazi nje ya mahali pa ibada; “uwandani” ni wa asili kuliko tafsiri sisisi ya “juu ya uso wa shamba.”
- source_word: וְהֱבִיאֻם
  choice: wazilete
  rationale: Kiambishi cha yambwa kimetafsiriwa wazi na kinarejelea dhabihu zao; kitenzi kinaendeleza kusudi la sentensi.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: “Kwa” hapa huonyesha kwamba dhabihu zinaletwa na kutolewa kwa ajili ya Yahweh; jina la agano limetolewa moja kwa moja kama “Yahweh.”
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa hema la kukutania
  rationale: Hii ni tafsiri ya kawaida, wazi na yenye hadhi ya mahali pa kuingilia katika hema takatifu.
- source_word: אֶל הַכֹּהֵן
  choice: kwa kuhani
  rationale: Huhifadhi uelekeo wa dhabihu kwa kuhani anayehudumu hapo; muktadha na nomino yenye kibainishi katika Kiebrania zinaonyesha kuhani husika.
- source_word: וְזָבְחוּ
  choice: wazitoe kuwa dhabihu
  rationale: Huhifadhi maana ya kitendo cha kutoa kwa kuchinja, huku ikisomeka kwa kawaida katika Kiswahili na kuunganisha dhabihu hizi na aina inayotajwa baadaye.
- source_word: זִבְחֵי שְׁלָמִים
  choice: dhabihu za amani
  rationale: Hili ni jina linaloeleweka la aina maalumu ya dhabihu; maana mbadala za ushirika au ustawi zimeonyeshwa katika tanbihi ili kutoficha upana wa שְׁלָמִים.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Usemi wa Kiebrania ni wa kifamilia na katika muktadha huu unawakilisha watu wa agano. Tafsiri imeuhifadhi bila kuzuia maana ya jumla ya “Waisraeli.”
- issue: Maana ya זִבְחֵי שְׁלָמִים
  choice: dhabihu za amani
  alternative: dhabihu za ushirika; dhabihu za ustawi
  rationale: Neno שְׁלָמִים linaweza kuhusishwa na amani, ukamilifu, ustawi na ushirika wa mlo wa dhabihu. “Dhabihu za amani” limetumika kama jina la aina hiyo bila kudai kwamba ndilo wazo pekee linalowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kusudi umehifadhiwa kwa “ili,” na vitenzi vimeunganishwa kwa mtiririko wa kawaida wa Kiswahili. “Hema la kukutania” na “dhabihu” ni istilahi za kibiblia zinazoeleweka; tanbihi zinahifadhi tafsiri mbadala zenye uzito wa kileksika.
