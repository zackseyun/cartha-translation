  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: sw
  text: Lakini asipofua nguo zake wala kuosha mwili wake[a], atabeba hatia yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “nyama yake”; katika muktadha huu humaanisha mwili wake.
    reason: lexical_alternative
  - marker: b
    text: Au “atabeba uovu wake,” au “atabeba adhabu ya uovu wake.” Msemo huu wa kisheria wa Kiebrania unaweza kumaanisha hatia pamoja na matokeo yake.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Lakini kama
  rationale: Katika muktadha huu kiunganishi kinaanzisha hali tofauti ya kutotimiza taratibu zilizotajwa katika mstari uliotangulia; ‘Lakini kama’ huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: יְכַבֵּס
  choice: hataziosha nguo zake
  rationale: Kitenzi כבס katika hali ya piel kwa kawaida huhusu kufua au kuosha mavazi. Yambwa ‘nguo zake’ haikutajwa wazi katika mstari huu, lakini inaeleweka kutoka mstari uliotangulia na kutokana na matumizi ya kitenzi hiki.
- source_word: וּבְשָׂרוֹ
  choice: mwili wake
  rationale: Ingawa בשר kwa maana halisi ni ‘nyama yake,’ katika muktadha wa kuoga kwa utakaso humaanisha mwili wa mtu.
- source_word: יִרְחָץ
  choice: kuoga
  rationale: רחץ hapa ni kuosha mwili. ‘Kuoga’ ni usemi wa kawaida na hutofautisha tendo hili na kuosha nguo.
- source_word: וְנָשָׂא
  choice: atabeba
  rationale: Muundo huu unaonyesha matokeo ya kutofanya yaliyoagizwa. ‘Atabeba’ huhifadhi pia tamathali ya kisheria ya Kiebrania.
- source_word: עֲוֹנוֹ
  choice: hatia yake
  rationale: עון inaweza kumaanisha uovu, hatia, au wajibu wa kubeba matokeo yake. ‘Hatia yake’ ni ya asili kwa Kiswahili na haibainishi kupita kiasi aina ya adhabu.
theological_decisions:
- issue: Maana ya msemo wa kisheria ‘kubeba עון yake’
  choice: atabeba hatia yake
  alternative: atabeba uovu wake; atabeba adhabu ya uovu wake
  rationale: Msemo wa Kiebrania unaweza kujumuisha kosa, hatia inayotokana nalo, na matokeo yake. Tafsiri kuu inaacha mvutano huo bila kuufanya uwe kosa la kimaadili pekee au adhabu maalumu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio ‘wala’ unaunganisha masharti mawili hasi kwa ufasaha; mtindo wa kisheria umehifadhiwa bila kuwa mgumu.
