base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: sw
  text: naye hajamleta mpaka kwenye mlango wa kuingilia wa Hema la Kukutania ili kumtoa kuwa sadaka kwa Yahwe mbele ya maskani ya Yahwe, damu itahesabiwa juu ya mtu huyo[a]; amemwaga damu. Mtu huyo atakatiliwa mbali kutoka miongoni mwa watu wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na Kiebrania, “damu itahesabiwa kwa mtu huyo.” Usemi huo unaonyesha kwamba anawajibika kwa kumwaga damu.
    reason: lexical_alternative
  - marker: b
    text: Maneno “atakatiliwa mbali” hayasemi wazi hapa ikiwa adhabu hiyo ni kifo, kufukuzwa, kutengwa, au namna nyingine ya kuondolewa katika jumuiya ya agano.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: mwingilio wa hema la kukutania
  rationale: “Mwingilio” hueleza פֶּתַח kwa Kiswahili cha kawaida, na “hema la kukutania” ni istilahi inayoeleweka kwa mahali rasmi pa kukutana na Mungu.
- source_word: הֱבִיאוֹ
  choice: hajamleta
  rationale: Hifili ya בוא ina maana ya “kuleta”; kiambishi cha yambwa kinarejelea mnyama aliyetajwa katika muktadha uliotangulia.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: ili kumtoa kuwa sadaka
  rationale: Usemi huu unaonyesha kumleta au kumwasilisha mnyama kama sadaka, bila kurudia kwa namna isiyo ya kawaida “kutoa sadaka kuwa sadaka.”
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” likitofautishwa na cheo “Bwana.”
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: mbele ya maskani ya Yahwe
  rationale: מִשְׁכָּן ni makao au maskani ya patakatifu; “maskani” ni neno la heshima na linalofaa katika muktadha huu.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: mtu huyo atahesabiwa kuwa na hatia ya damu
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida nguvu ya kisheria ya nahau ya Kiebrania, huku tanbihi ikihifadhi muundo wake halisi wenye “damu” kama kiima.
- source_word: דָּם שָׁפָךְ
  choice: amemwaga damu
  rationale: “Kumwaga damu” ni nahau ya kawaida inayohifadhi maana halisi na ya kisheria ya maneno ya Kiebrania.
- source_word: וְנִכְרַת
  choice: atakatiliwa mbali
  rationale: Usemi huu unahifadhi picha ya כרת na hauamui kimya kimya kama adhabu ni kifo, kufukuzwa, au namna nyingine ya kuondolewa.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: na watu wake
  rationale: Katika muundo “atakatiliwa mbali na,” maneno haya yanawasilisha kuondolewa kutoka miongoni mwa jumuiya yake kwa Kiswahili asilia.
theological_decisions:
- issue: Nahau ya kisheria דָּם יֵחָשֵׁב
  choice: mtu huyo atahesabiwa kuwa na hatia ya damu
  alternative: damu itahesabiwa juu ya mtu huyo
  rationale: Chaguo kuu linaeleza uwajibikaji wa kumwaga damu kwa Kiswahili kinachoeleweka; tanbihi inahifadhi tafsiri ya karibu zaidi na muundo wa Kiebrania.
- issue: Maana ya adhabu וְנִכְרַת
  choice: atakatiliwa mbali
  alternative: atauawa; atafukuzwa; atatengwa
  rationale: Kifungu hakisemi hapa namna kamili ya kuondolewa. Tafsiri haichagui kifo, kufukuzwa, au kutengwa kuwa ndiyo maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria na wa ibada ulio wa heshima lakini unaoeleweka. Sentensi imeachwa ianze kama mwendelezo wa sharti lililo katika mstari uliotangulia. Marudio ya “damu” yamehifadhiwa, na utata wa adhabu ya כרת haujaondolewa.
