base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Kuhani atairusha damu mlangoni pa Hema la Kukutania[a] juu ya madhabahu ya Yahwe, kisha atayachoma mafuta ili yawe harufu ya kumpendeza Yahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atainyunyiza” au “atairusha kwa nguvu” damu juu ya madhabahu. Kitenzi cha Kiebrania hurejelea tendo la kikuhani la kuweka damu madhabahuni kwa kuirusha.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “harufu ya kupendeza”; pia inaweza kutafsiriwa “harufu ya kumfurahisha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: atairusha
  rationale: Kitenzi זָרַק katika ibada ya dhabihu kinaonyesha damu ikiwekwa kwenye madhabahu kwa kuirusha au kuimwaga kwa msukumo, si kunyunyiza matone mepesi tu. ‘Atairusha’ huhifadhi nguvu ya tendo hilo kwa Kiswahili kinachoeleweka.
- source_word: עַל מִזְבַּח יְהוָה
  choice: kwenye madhabahu ya Yahwe
  rationale: עַל pamoja na זָרַק huonyesha damu ikielekezwa kwenye madhabahu. ‘Kwenye’ ni ya kawaida na inaweza kubeba wazo la ‘juu ya’ au ‘dhidi ya’ bila kulazimisha upande mmoja.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: mlangoni pa Hema la Kukutania
  rationale: Hutafsiri mahali pa ingilio kwa lugha ya asili na yenye hadhi; ‘Hema la Kukutania’ ni istilahi inayoeleweka kwa אֹהֶל מוֹעֵד.
- source_word: וְהִקְטִיר הַחֵלֶב
  choice: atayateketeza mafuta kwa moto
  rationale: Katika lugha ya kikuhani, הִקְטִיר ni kuteketeza sehemu ya dhabihu madhabahuni ili ipae kwa moshi. Nyongeza ‘kwa moto’ huweka wazi tendo hilo na kutofautisha na kuharibu tu.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: yawe harufu ya kumpendeza
  rationale: Kirai hiki cha dhabihu kinaonyesha harufu inayokubalika na kumpendeza Mungu; tafsiri hii ni ya sasa na ya kawaida bila kupoteza wazo la kukubaliwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya רֵיחַ נִיחֹחַ
  choice: harufu ya kumpendeza Yahwe
  alternative: harufu ya kumtuliza Yahwe
  rationale: ‘Ya kumpendeza’ hudumisha wazo la dhabihu kukubaliwa bila kuingiza dhana kwamba Mungu anahitaji kutulizwa kihisia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa kawaida kwa Kiswahili, huku istilahi za ibada na utata halisi wa עַל zikihifadhiwa.
