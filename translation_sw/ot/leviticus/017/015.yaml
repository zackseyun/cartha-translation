- from: Na kila mtu atakayekula mzoga[a] au mnyama aliyeraruliwa na wanyama wa porini, awe mwenyeji au mgeni mkazi[b], atafua nguo zake na kuoga kwa maji. Atakuwa najisi mpaka jioni; kisha atakuwa safi.
  to: Na kila mtu atakayekula mzoga[a] au mnyama aliyeraruliwa na wanyama wa porini, iwe ni mzaliwa wa nchi au mgeni mkazi[b], atafua nguo zake na ataoga kwa maji. Atakuwa najisi mpaka jioni; kisha atakuwa safi.
  rationale: Marekebisho yameboresha sarufi na ufasaha wa Kiswahili, yamefanya “native” iwe wazi zaidi, na yamefafanua kwa usahihi zaidi maana ya mzoga. Maana, utata unaofaa wa chanzo, na istilahi ya unajisi wa kiibada vimehifadhiwa.
