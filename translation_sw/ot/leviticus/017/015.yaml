    issue: Uratibu wa kitenzi katika “atafua nguo zake na kuoga kwa maji”
    rationale: Baada ya “atafua,” neno “kuoga” ni kitenzi-jina; katika orodha hii ya masharti ya kisheria, “ataoga kwa maji” huweka vitendo viwili sambamba na ni Kiswahili sanifu cha asili.
  - severity: low
    issue: “Mwenyeji” kwa בָּאֶזְרָח
    rationale: Neno hili linaweza kumaanisha hosti au mkazi wa eneo kwa upana. “Mzaliwa wa nchi” huonyesha kwa uwazi zaidi tofauti iliyokusudiwa kati ya Mwisraeli wa asili na mgeni mkazi.
  - severity: low
    issue: Ufafanuzi wa tanbihi [a]
    rationale: “Mnyama aliyekufa bila kuchinjwa ipasavyo” hueleza kwa moja kwa moja maana ya נְבֵלָה katika muktadha huu na huepuka kuifanya maana kuwa mwili tu.
