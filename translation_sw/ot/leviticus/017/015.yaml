  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: sw
  text: Na kila mtu atakayekula mzoga[a] au mnyama aliyeraruliwa na wanyama wa porini, iwe ni mzaliwa wa nchi au mgeni mkazi[b], atafua nguo zake na ataoga kwa maji. Atakuwa najisi mpaka jioni; kisha atakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mnyama aliyekufa bila kuchinjwa ipasavyo.
    reason: lexical_alternative
  - marker: b
    text: Au “mgeni anayeishi miongoni mwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: mtu
  rationale: Katika sheria hii neno hili linamaanisha mtu binafsi, si nafsi isiyo na mwili.
- source_word: תֹּאכַל
  choice: atakayekula
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida sharti la kisheria linalomhusu mtu yeyote.
- source_word: נְבֵלָה
  choice: mzoga
  rationale: Neno hili linataja mwili wa mnyama aliyekufa bila kuchinjwa ipasavyo; “mzoga” ni neno fupi na la kawaida, huku tanbihi ikifafanua maana yake maalumu.
- source_word: טְרֵפָה
  choice: mnyama aliyeraruliwa na wanyama wa porini
  rationale: Hueleza mnyama aliyeshambuliwa na kuraruliwa na mnyama mwingine; tafsiri hii inaweka wazi chanzo cha hali yake.
- source_word: בָּאֶזְרָח
  choice: mwenyeji
  rationale: Hurejelea mwanajamii wa asili wa Israeli na inatofautishwa hapa na mgeni anayeishi miongoni mwao.
- source_word: בַגֵּר
  choice: mgeni mkazi
  rationale: Huyu ni mgeni anayeishi kwa kudumu miongoni mwa Israeli, si msafiri anayepita tu.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: atafua nguo zake
  rationale: Ni Kiswahili cha kawaida kinachoeleza tendo la lazima la kuzisafisha nguo.
- source_word: וְרָחַץ בַּמַּיִם
  choice: kuoga kwa maji
  rationale: Kitenzi kinahusu kuuosha mwili; usemi huu ni wa asili na unabaki na wazo la kuoga kwa ibada.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: atakuwa najisi mpaka jioni
  rationale: “Najisi” hapa huonyesha hali ya kutokuwa safi kiibada, wala si lazima hatia ya kimaadili.
- source_word: וְטָהֵר
  choice: kisha atakuwa safi
  rationale: “Kisha” huonyesha kwamba hali ya unajisi inaisha baada ya kuosha na kufika jioni.
theological_decisions:
- issue: Asili ya unajisi katika sheria za utakaso za Walawi
  choice: Kutafsiri טָמֵא/טָהֵר kuwa “najisi/safi” kwa maana ya hali ya kiibada.
  alternative: “amenajisika/ametakaswa”
  rationale: Aya inahusu hali ya muda ya kiibada baada ya kula mzoga, hivyo haifai kuingiza moja kwa moja wazo la hatia ya kimaadili au utakaso wa dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia msamiati unaoeleweka kwa wasomaji wa kawaida huku ikihifadhi istilahi ya kiibada “najisi.” Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
