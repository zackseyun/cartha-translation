  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: sw
  text: Kwa maana uhai wa kila kiumbe ni damu yake[a]; damu yake imo katika uhai wake. Kwa hiyo niliwaambia Waisraeli[b], “Msile damu ya kiumbe chochote, kwa maana uhai wa kila kiumbe ni damu yake.” Kila anayeila atakatiliwa mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “damu yake imo katika uhai wake”; au, kwa tafsiri yenye ufafanuzi zaidi, “damu yake ndiyo uhai wake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Israeli,” yaani, Waisraeli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: uhai
  rationale: Katika muktadha huu wa sheria kuhusu damu, neno hili linamaanisha uhai unaohuisha kiumbe, si ‘nafsi’ kwa maana ya sehemu isiyo ya kimwili.
- source_word: בָּשָׂר
  choice: kiumbe chenye mwili
  rationale: Kauli hii inawasilisha maana ya kibiblia ya ‘kila chenye mwili’ kwa Kiswahili cha kawaida, huku ikiepuka kueleweka kuwa inazungumzia nyama ya chakula pekee.
- source_word: דָּם / דָּמוֹ
  choice: damu / damu yake
  rationale: Damu ndiyo msingi wa katazo na wa sababu inayotolewa katika aya, hivyo imetafsiriwa moja kwa moja na kurudiwa kama katika Kiebrania.
- source_word: בְנַפְשׁוֹ
  choice: imo katika uhai wake
  rationale: Tafsiri hii inadumisha muundo uliobanwa na wenye utata wa Kiebrania unaohusianisha damu na uhai, bila kuamua kimyakimya kuwa damu ni sawa kabisa na uhai.
- source_word: וָאֹמַר
  choice: Kwa hiyo niliwaambia
  rationale: ‘Kwa hiyo’ inaonyesha kwamba amri inayofuata inatokana na sababu iliyotangulia; ‘niliwaambia’ ni usemi wa kawaida wa Kiswahili.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hii ndiyo njia ya kawaida na wazi ya kuwataja watu wa Israeli kwa Kiswahili cha kisasa; tafsiri halisi imewekwa katika tanbihi.
- source_word: לֹא תֹאכֵלוּ
  choice: Msile
  rationale: Hii ni amri hasi ya moja kwa moja kwa wingi na inafaa katika mtindo wa sheria.
- source_word: אֹכְלָיו
  choice: anayeila
  rationale: Umbo hili linaonyesha mtu yeyote anayekula damu inayotajwa na kudumisha maana ya kila mtu mmoja mmoja.
- source_word: יִכָּרֵת
  choice: atakatiliwa mbali
  rationale: Kauli hii inadumisha nahau nzito ya hukumu ya agano bila kubainisha kama adhabu ni kuuawa, kufukuzwa katika jamii, au hukumu ya Mungu.
theological_decisions:
- issue: Maana ya נֶפֶשׁ kuhusiana na damu
  choice: Imetafsiriwa ‘uhai,’ huku damu ikionyeshwa kuwa imefungamana na uhai wa kiumbe.
  alternative: ‘nafsi’ kwa maana ya kimetafizikia, au kauli ya moja kwa moja kwamba damu ndiyo uhai
  rationale: Muktadha unatoa msingi wa katazo la kula damu kutokana na uhusiano wa damu na uhai; hautoi fundisho kamili kuhusu nafsi. Muundo wenye utata umehifadhiwa na tanbihi.
- issue: Maana ya adhabu יִכָּרֵת
  choice: atakatiliwa mbali
  alternative: atauawa; atafukuzwa katika jamii; ataondolewa
  rationale: Nahau ya Kiebrania inaweza kueleweka kwa njia mbalimbali katika mazingira tofauti. Tafsiri haipaswi kuamua namna hasa ya adhabu zaidi ya yale yanayosemwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. ‘Kiumbe chenye mwili’ kimechaguliwa badala ya ‘mwili wote’ au ‘nyama yote’ ili kuwasilisha matumizi mapana ya בָּשָׂר bila kuleta maana isiyokusudiwa ya nyama ya chakula. Marudio ya ‘uhai’ na ‘damu’ yamedumishwa kwa sababu ndiyo hoja kuu ya aya.
