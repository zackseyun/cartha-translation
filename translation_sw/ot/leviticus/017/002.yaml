base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: sw
  text: 'Sema na Aroni, wanawe, na Waisraeli wote[a], na waambie: ‘Hili ndilo jambo[b] ambalo Yahwe ameamuru, akisema:’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wote wa Israeli”; usemi huu pia unaweza kutafsiriwa “watu wote wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “neno”; neno la Kiebrania linaweza pia kumaanisha “suala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sema na
  rationale: Kitenzi cha amri kinamtaka Musa azungumze moja kwa moja na watu waliotajwa. ‘Sema na’ ni cha kawaida, wazi, na kinahifadhi nguvu ya amri.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Katika muktadha huu neno linawarejelea wana wa kiume wa Aroni, yaani wale wa ukoo wa kikuhani; ‘wanawe’ linadumisha maana hiyo bila kuongeza maelezo.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Ingawa muundo wa Kiebrania ni ‘wana wote wa Israeli,’ hapa ni jina la kawaida la taifa lote. ‘Waisraeli wote’ ni Kiswahili cha asili na hakidokezi kwamba wanaume pekee ndio wanaohusika.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: uwaambie
  rationale: Linawasilisha amri inayofuata kwa ufupi na kwa Kiswahili cha kawaida, huku kiambishi ‘wa’ kikirejelea wote waliotajwa.
- source_word: זֶה הַדָּבָר
  choice: Hili ndilo jambo
  rationale: דָּבָר inaweza kumaanisha ‘neno,’ ‘jambo,’ au ‘amri.’ Katika fomula hii inatanguliza maudhui ya agizo la Mungu; ‘jambo’ ni pana na la asili bila kufuta uwezekano wa ‘neno.’
- source_word: צִוָּה
  choice: ameamuru
  rationale: Kauli ya wakati timilifu inaonyesha amri ambayo tayari imetolewa na sasa inatangazwa. ‘Ameamuru’ hudumisha uhusiano huo na vifungu vinavyofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki kinatanguliza maneno ya amri yanayoendelea katika mstari unaofuata. ‘Akisema’ kinahifadhi kwa uwazi kazi hiyo ya utangulizi.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, si cheo; kwa hiyo limedumishwa kama ‘Yahwe.’
- issue: Upeo wa usemi בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote
  alternative: wana wote wa Israeli
  rationale: Usemi huo ni jina la kikabila linaloweza kuwakusanya watu wote wa Israeli. Tafsiri ya kawaida ya Kiswahili inaepuka kuufanya uwe agizo kwa wanaume pekee, huku tanbihi ikihifadhi umbo halisi.
- issue: Maana ya דָּבָר katika fomula ya amri
  choice: jambo
  alternative: neno
  rationale: Neno la Kiebrania lina wigo wa maana unaojumuisha neno, jambo, na suala. ‘Jambo’ linafaa kwa maudhui ya agizo yanayofuata, lakini tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa amri na utangulizi wa maneno yanayofuata umehifadhiwa; alama ya koloni inaonyesha kwamba usemi unaendelea katika mstari unaofuata.
