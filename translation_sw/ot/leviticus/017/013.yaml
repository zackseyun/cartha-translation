id: LEV.17.13
reference: Leviticus 17:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: sw
  text: Na mtu yeyote miongoni mwa wana wa Israeli, au mgeni anayeishi kati yao[a], ambaye anawinda mnyama wa porini au ndege anayeruhusiwa kuliwa, ataimwaga damu yake na kuifunika kwa udongo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mgeni asiye Mwisraeli anayekaa ndani ya jumuiya.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweza kutafsiriwa “kwa mavumbi/udongo”; kiambishi cha “kuifunika” kwa kawaida zaidi huirejelea damu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: mtu yeyote
  rationale: Urudiaji huu una maana ya kila mmoja bila ubaguzi; “mtu yeyote” ni Kiswahili cha kawaida kinachowasilisha nguvu hiyo ya ugawaji bila urudiaji usio wa kawaida.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: miongoni mwa wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia na ya agano katika neno בני, huku ikibaki wazi na ya asili kwa msomaji wa Kiswahili.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: mgeni anayeishi kati yao
  rationale: “Mgeni” hapa ni mtu asiye Mwisraeli anayekaa katika jumuiya; kitenzi “anayeishi” huwasilisha hali ya ukaaji bila kurudia mzizi kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: יָצוּד צֵיד
  choice: anawinda
  rationale: Muundo wa Kiebrania wa kitenzi na nomino yenye mzizi mmoja huwasilishwa kwa kitenzi cha kawaida cha Kiswahili; kitu kinachowindwa kinatajwa mara moja katika kirai kinachofuata.
- source_word: חַיָּה אוֹ עוֹף
  choice: mnyama wa porini au ndege
  rationale: Katika muktadha wa uwindaji, חיה humaanisha mnyama wa porini, na עוף ni ndege.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: anayeruhusiwa kuliwa
  rationale: Niphal katika sheria hii inaeleweka kwa maana ya kitu kinachoweza au kinachofaa kuliwa kwa ruhusa; “anayeruhusiwa kuliwa” huonyesha kipengele hicho cha kisheria kuliko uwezo wa kimwili tu.
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: ataimwaga damu yake
  rationale: Wakati ujao katika Kiswahili unaweza kutoa agizo la kisheria katika muktadha huu; kiambishi “-i-” na “damu yake” humrejelea mnyama au ndege aliyewindwa.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: na kuifunika kwa udongo
  rationale: עפר hapa ni udongo au mavumbi ya ardhi; “udongo” ni neno la asili katika tendo la kuifunika damu ardhini. Kiambishi “-i-” humrejelea damu iliyotajwa mara moja kabla.
theological_decisions:
- issue: Kirejelewa cha kiambishi katika וְכִסָּהוּ
  choice: damu ndiyo inayofunikwa
  alternative: mnyama au ndege ndiye anayefunikwa au kuzikwa
  rationale: Damu ndiyo nomino iliyo karibu zaidi na ndiyo kirejelewa cha kawaida zaidi kisarufi; pia inalingana na mkazo wa sura hii kuhusu damu. Tanbihi inaweka wazi rejeo hilo bila kuongeza maana nyingine ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili katika Kiswahili huku istilahi za kifamilia, ukaaji wa mgeni, uwindaji, ruhusa ya kuliwa, na tendo la kuifunika damu zikihifadhiwa.
