source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: sw
  text: Kwa maana uhai wa mwili uko katika damu[a], nami nimewapa damu hiyo juu ya madhabahu ili kufanya upatanisho kwa ajili ya maisha yenu[b]; kwa maana damu ndiyo hufanya upatanisho kwa njia ya uhai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana damu hufanya upatanisho kwa njia ya uhai uliomo ndani yake.” Kiebrania ni kifupi na kinaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania nefesh linaweza kumaanisha ‘uhai,’ ‘nafsi,’ ‘mtu mwenyewe,’ au ‘mtu,’ kutegemea muktadha; hapa maana yake ni uhai.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ / נַפְשֹׁתֵיכֶם / בַּנֶּפֶשׁ
  choice: uhai / maisha yenu / kwa njia ya uhai
  rationale: Katika sheria hii ya dhabihu, neno hili linamaanisha uhai wa kiumbe hai, si lazima ‘roho’ kama sehemu isiyo ya mwili. ‘Uhai’ na ‘maisha yenu’ vinaweka wazi uhusiano unaorudiwa kati ya damu na uhai huku Kiswahili kikibaki cha kawaida.
- source_word: הַבָּשָׂר
  choice: mwili
  rationale: Hapa neno hili linarejelea mwili wenye uhai wa kiumbe. ‘Mwili’ ni la kawaida na lenye hadhi katika Kiswahili cha sasa kuliko tafsiri halisi ‘nyama,’ ambayo ingeweza kueleweka kama nyama ya chakula.
- source_word: בַּדָּם
  choice: umo katika damu
  rationale: 'Kiambishi ב kinaonyesha mahali au nyanja: uhai wa mwili umo katika damu. ‘Umo’ linapatana na ngeli ya uhai na kufanya sentensi iwe ya asili.'
- source_word: נְתַתִּיו לָכֶם
  choice: nimewapa damu hiyo
  rationale: Kiwakilishi cha Kiebrania kinarejelea damu. Kukitaja wazi kama ‘damu hiyo’ huondoa utata wa kiwakilishi katika Kiswahili bila kuongeza dhana mpya.
- source_word: עַל הַמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Hii inadumisha mahali pa ibada na maana ya kawaida ya kihusishi עַל.
- source_word: לְכַפֵּר / יְכַפֵּר
  choice: kufanya upatanisho / hufanya upatanisho
  rationale: ‘Kufanya upatanisho’ ni istilahi pana ya ibada inayohifadhi maana ya כפר bila kuamua kimya-kimya nadharia mahususi kuhusu namna upatanisho unavyotendeka.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: kwa ajili ya maisha yenu
  rationale: עַל hapa inaonyesha wale wanaonufaika na upatanisho. ‘Maisha yenu’ huwasilisha wingi wa Kiebrania na huepuka kuingiza mgawanyo wa mwili na roho ambao kifungu hakilazimishi.
- source_word: בַּנֶּפֶשׁ
  choice: kwa njia ya uhai
  rationale: Muundo wa Kiebrania ni mfupi na unaweza kueleweka kwa maana ya chombo au msingi. Tafsiri hii inadumisha uhusiano kati ya uwezo wa damu kufanya upatanisho na uhai ulio ndani yake, bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika sheria ya dhabihu
  choice: Kutumia ‘uhai’ na ‘maisha’ badala ya ‘roho.’
  alternative: nafsi; roho; mtu mwenyewe
  rationale: Hoja ya mstari inahusisha damu na uhai wa kiumbe. ‘Roho’ ingeweza kuingiza dhana ya sehemu ya mwanadamu isiyo ya mwili ambayo si lazima iwe maana ya Kiebrania hapa.
- issue: Nguvu ya בַּנֶּפֶשׁ katika kishazi cha mwisho
  choice: kwa njia ya uhai
  alternative: kwa sababu ya uhai; kwa uhai; kwa njia ya uhai uliomo ndani yake
  rationale: Kihusishi ב kinaweza kuwa cha chombo au kuonyesha msingi. Tafsiri kuu inabaki karibu na muundo wa Kiebrania, na tanbihi inaonyesha usomaji mpana zaidi bila kuondoa utata halisi.
- issue: Kile kinachofanya upatanisho
  choice: Damu ndiyo hufanya upatanisho kwa njia ya uhai.
  alternative: Damu hufanya upatanisho kwa sababu ya uhai uliomo ndani yake.
  rationale: Mpangilio huu unahifadhi msisitizo wa הוּא juu ya damu na pia uhusiano wake na uhai, bila kutaja nadharia ya ziada ya upatanisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtindo wa sheria ya ibada, lakini ‘mwili’ limetumiwa badala ya ‘nyama’ ili kuepuka maana ya chakula. Alama za tanbihi [a] na [b] zimewekwa katika maandishi makuu.
