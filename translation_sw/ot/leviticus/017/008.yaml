base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: sw
  text: 'Waambie: Mtu yeyote wa nyumba ya Israeli[a], au mgeni anayeishi miongoni mwao[b], anayetoa sadaka ya kuteketezwa au dhabihu—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mtu yeyote” ni msemo wa kiume uliorudiwa kihalisi, “mwanamume, mwanamume”; ni nahau ya kisheria inayomaanisha kila mmoja anayehusika.
    reason: lexical_alternative
  - marker: b
    text: Au “mgeni mkazi”; neno la Kiebrania humaanisha mtu asiye Mwisraeli anayeishi miongoni mwa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: Nawe utawaambia
  rationale: Huhifadhi kiunganishi, walengwa wa usemi, na nguvu ya agizo kwa Musa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אִישׁ אִישׁ
  choice: Mtu yeyote
  rationale: Urudiaji huu ni nahau ya kisheria yenye maana ya kila mmoja au mtu yeyote katika kundi; tafsiri hii huwasilisha nguvu yake ya ugawaji bila urudiaji usio wa kawaida katika Kiswahili.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: wa nyumba ya Israeli
  rationale: Huhifadhi msemo wa agano 'nyumba ya Israeli' badala ya kuufupisha kuwa 'Israeli' tu.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: au mgeni anayeishi kati yao
  rationale: גֵּר ni mtu asiye Mwisraeli mwenye makazi ndani ya jamii ya Israeli; 'mgeni anayeishi' ni ya asili na huonyesha hali ya ukaaji bila kumaanisha mgeni wa muda mfupi pekee.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: anayetoa
  rationale: Katika muktadha wa dhabihu, Hiphil ya עלה humaanisha kutoa sadaka; Kiswahili 'kutoa' ni wazi na cha kawaida.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la dhabihu inayoteketezwa juu ya madhabahu; istilahi hii ya Kiswahili ni wazi na imezoeleka.
- source_word: אוֹ זָבַח
  choice: au dhabihu
  rationale: Hutofautisha sadaka ya kuteketezwa na dhabihu nyingine ya mnyama bila kuongeza ufafanuzi ambao haupo katika mstari.
theological_decisions:
- issue: Nahau ya kisheria ya kiume אִישׁ אִישׁ
  choice: Mtu yeyote
  alternative: Mwanamume yeyote
  rationale: Katika sheria hii urudiaji una kazi ya ugawaji—kila mmoja anayehusika. 'Mtu yeyote' huwasilisha kazi hiyo kwa Kiswahili cha asili; tanbihi inaonyesha umbo halisi la Kiebrania ili lisifiche.
- issue: Maana ya גֵּר
  choice: mgeni anayeishi kati yao
  alternative: mgeni mkazi
  rationale: Chaguo kuu linaeleweka kwa urahisi na linaonyesha kwamba ni mtu asiye Mwisraeli anayekaa ndani ya jamii, bila kuingiza istilahi za kisasa za uhamiaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari umeachwa na kistari kirefu mwishoni kwa sababu sentensi na sharti lake zinaendelea katika mstari unaofuata.
