base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: sw
  text: Nao hawatatoa tena dhabihu zao kwa mapepo wa mbuzi[a], ambao wanafanya ukahaba wakiwafuata[b]. Hili litakuwa agizo la kudumu[c] kwao katika vizazi vyao vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sanamu za mbuzi” au “kwa viumbe wa mfano wa mbuzi”; neno la Kiebrania linarejelea viumbe wenye uhusiano na mbuzi katika ibada haramu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ambao wanafanya ukahaba wakiwafuata.” Hii ni sitiari ya kutokuwa waaminifu kwa Mungu kwa kuabudu wengine.'
    reason: cultural_note
  - marker: c
    text: Au “agizo la milele” au “agizo la daima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: hawatatoa tena dhabihu zao
  rationale: Kauli hii inaonyesha katazo linaloendelea; “kutoa dhabihu” ni Kiswahili cha kawaida na huhifadhi uhusiano wa kitenzi na nomino ya Kiebrania.
- source_word: עוֹד
  choice: tena
  rationale: Pamoja na ukanushaji, neno hili lina maana ya ‘si tena’ au ‘kutofanya tena.’
- source_word: לַשְּׂעִירִם
  choice: kwa mapepo wenye sura ya mbuzi
  rationale: Katika muktadha huu wa ibada haramu, neno linalomaanisha kihalisi ‘wenye manyoya/mbuzi’ linaelekea kumaanisha viumbe vya kipepo vinavyohusishwa na sura ya mbuzi, si mbuzi wa kawaida.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: ambao wanawafuata kwa ukahaba
  rationale: Tafsiri hii inadumisha picha kali ya ukahaba wa kiroho na pia maana ya kufuata miungu au viumbe hivyo katika ibada.
- source_word: חֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: Hii ni lugha ya kisheria ya jambo linaloendelea kuwa na nguvu; ‘la kudumu’ ni ya asili na haizidishi maana ya nahau.
- source_word: לְדֹרֹתָם
  choice: katika vizazi vyao vyote
  rationale: Huwasilisha matumizi ya agizo hilo mfululizo katika vizazi vinavyofuatana.
theological_decisions:
- issue: Rejeo la שְּׂעִירִם katika ibada haramu
  choice: mapepo wenye sura ya mbuzi
  alternative: mbuzi; sanamu za mbuzi; viumbe kama masatiri
  rationale: Muktadha wa kutolewa dhabihu na ukahaba wa kidini unaunga mkono rejeo la viumbe vya kipepo vinavyohusishwa na mbuzi, huku tanbihi ikihifadhi uwezekano wa sanamu au viumbe vya mfano huo.
- issue: Nguvu ya sitiari ya זֹנִים
  choice: wanawafuata kwa ukahaba
  alternative: wanakosa uaminifu; wanaabudu sanamu
  rationale: Kiebrania kinatumia wazi lugha ya ukahaba kueleza kutokuwa waaminifu katika ibada; sitiari hiyo imehifadhiwa badala ya kufupishwa kuwa maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Lugha ya ibada na sitiari kali ya Kiebrania zimehifadhiwa bila kuingiza istilahi za dhehebu.
