    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na sababu iliyotangulia kuhusu uhai kuwa katika damu, kwa lugha ya kawaida na yenye uzito.
- source_word: אָמַרְתִּי
  choice: niliwaambia
  rationale: Wakati uliopita unafaa katika muktadha huu; kiambishi cha yambwa kinaonyesha wazi kwamba maneno yalielekezwa kwa wana wa Israeli.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inafuata kwa karibu usemi wa Kiebrania ‘wana wa Israeli’ huku ikibaki kuwa usemi unaoeleweka katika Kiswahili cha Biblia.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: Mtu yeyote miongoni mwenu
  rationale: נֶפֶשׁ hapa humaanisha mtu binafsi, si ‘nafsi’ kama sehemu isiyo ya mwili; tafsiri hii pia huhifadhi nguvu ya katazo linalomhusu kila mmoja.
- source_word: לֹא תֹאכַל דָּם
  choice: asile damu
  rationale: Hii ni njia ya kawaida na wazi ya kutoa katazo la kisheria katika Kiswahili, bila kuondoa usemi halisi ‘kula damu.’
- source_word: הַגֵּר
  choice: mgeni
  rationale: Katika muktadha huu ni mtu asiye Mwisraeli ambaye anaishi ndani ya jumuiya ya Israeli chini ya sheria zake, si mgeni wa muda mfupi tu.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: anayeishi miongoni mwenu
  rationale: Inaeleza hali ya kukaa kwa kudumu au kwa muda mrefu ndani ya jumuiya kwa Kiswahili cha asili, bila kurudia kwa namna isiyo ya kawaida ‘mgeni anayekaa ugenini.’
- source_word: לֹא יֹאכַל דָּם
  choice: asile damu
  rationale: Inarudia katazo lilelile kwa mgeni mkazi na kudumisha ulinganifu wa vifungu viwili.
theological_decisions:
- issue: Jina la agano lenye umbo la kiume katika לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi muundo wa chanzo bila kudai kwamba katazo linawahusu wanaume pekee; muktadha unaonyesha kuwa ni jina la jumuiya ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya sheria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘asile damu’ umetumiwa kwa katazo la kisheria, na urudiaji wa chanzo umehifadhiwa.
