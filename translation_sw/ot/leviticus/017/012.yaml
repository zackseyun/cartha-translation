  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: sw
  text: Kwa hiyo niliwaambia wana wa Israeli[a], ‘Mtu yeyote miongoni mwenu asile damu, wala mgeni[b] anayeishi miongoni mwenu asile damu.’
  philosophy: optimal-equivalence
  footnotes:
