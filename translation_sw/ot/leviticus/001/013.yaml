base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Ataziosha sehemu za ndani na miguu kwa maji. Naye kuhani atatoa dhabihu yote na kuiteketeza juu ya madhabahu. Ni sadaka ya kuteketezwa, sadaka ya moto[a], harufu ya kupendeza kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka inayotolewa kwa moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: matumbo
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha sehemu za ndani za mnyama. “Matumbo” ni neno la kawaida na linaloeleweka katika Kiswahili, bila kutumia istilahi nzito.
- source_word: הַכְּרָעַיִם
  choice: miguu
  rationale: Neno hili linarejelea miguu, hasa sehemu zake za chini. “Miguu” ni tafsiri wazi na ya kawaida.
- source_word: יִרְחַץ בַּמָּיִם
  choice: ataosha kwa maji
  rationale: Tafsiri hii inahifadhi kitendo cha kuosha na kutaja wazi maji kama chombo kilichotumiwa, kama ilivyo katika Kiebrania.
- source_word: וְהִקְרִיב
  choice: atavileta
  rationale: Hifili ya קרב hapa ina maana ya kuvileta karibu au kuviwasilisha katika utaratibu wa dhabihu. “Atavileta” ni ya asili katika Kiswahili na haitangulizi kitendo kinachofuata cha kuviteketeza.
- source_word: אֶת־הַכֹּל
  choice: vyote
  rationale: Inasisitiza kwamba sehemu zote zilizoandaliwa zitaletwa na kuhani.
- source_word: וְהִקְטִיר
  choice: kuviteketeza ... viwe moshi
  rationale: Kitenzi hiki cha dhabihu kinaeleza kuchoma kitu madhabahuni mpaka moshi wake upande, si kuchoma kwa maana ya jumla tu. Kauli hii inaweka wazi maana hiyo kwa msomaji wa kawaida.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Hii inaonyesha mahali pa kitendo cha dhabihu na ni usemi wa kawaida wa Kiswahili.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni jina linalotambulika la dhabihu inayoteketezwa yote madhabahuni; pia linadokeza kupaa kwa moshi bila kulifanya dokezo hilo kuwa maana pekee.
- source_word: אִשֵּׁה
  choice: sadaka ya moto
  rationale: Neno hili linahusiana na dhabihu inayotolewa kwa moto. “Sadaka ya moto” ni fupi, wazi, na inahifadhi taswira ya moto ya Kiebrania; ufafanuzi mwingine umewekwa katika tanbihi.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu inayompendeza
  rationale: Usemi huu unahifadhi taswira ya harufu huku ukionyesha kwamba dhabihu inakubalika na Mungu, bila kuondoa lugha ya kihisia ya matini.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo, kwa uwazi na ukaribu na matini ya Kiebrania.
theological_decisions:
- issue: Lugha ya harufu inayohusishwa na kukubaliwa kwa dhabihu katika רֵיחַ נִיחֹחַ
  choice: yenye harufu inayompendeza Yahwe
  alternative: yenye harufu ya kutuliza kwa Yahwe
  rationale: Tafsiri iliyochaguliwa inadumisha mfano halisi wa harufu na wazo la kumpendeza Mungu, bila kuamua kwamba dhabihu inatuliza hasira yake, jambo ambalo muktadha huu hausisemi wazi.
- issue: Maana ya אִשֵּׁה
  choice: sadaka ya moto
  alternative: sadaka inayotolewa kwa moto
  rationale: “Sadaka ya moto” inalinda uhusiano wa neno hilo na moto na haisemi kwamba ni chakula cha Mungu. Tanbihi inaonyesha namna nyingine ya kulieleza kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa ili hatua za utaratibu wa dhabihu zifuatike kwa urahisi. Kiashiria [a] kimewekwa baada ya “sadaka ya moto,” ambako kinahusiana moja kwa moja na אִשֵּׁה.
