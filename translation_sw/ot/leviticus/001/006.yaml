  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: sw
  text: Kisha atamvua ngozi mnyama wa sadaka ya kuteketezwa[a], na atamkata katika vipande vyake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataiondoa ngozi ya mnyama wa sadaka ya kuteketezwa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “atamkata katika vipande vyake,” yaani, atamgawanya mnyama katika sehemu kwa ajili ya dhabihu.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: ataiondoa ngozi
  rationale: Kauli ya Hifili ya פשט katika muktadha huu wa dhabihu humaanisha kuondoa ngozi ya mnyama. Usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: הָעֹלָה
  choice: sadaka hiyo ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya sadaka iliyoteketezwa madhabahuni. Tafsiri hii inaeleweka kwa urahisi na kuhifadhi maana ya kiibada kuliko tafsiri ya kiekolojia kama ‘sadaka ya kupaa.’
- source_word: וְנִתַּח
  choice: na kuikata
  rationale: נתח hapa hueleza kukata mnyama katika sehemu kwa ajili ya dhabihu. ‘Kuikata’ ni ya kawaida, huku neno linalofuata likifafanua matokeo ya tendo hilo.
- source_word: לִנְתָחֶיהָ
  choice: vipandevipande
  rationale: Kirai hiki humaanisha kuigawa sadaka katika sehemu zake zilizokatwa. ‘Vipandevipande’ ni usemi wa asili wa Kiswahili unaowasilisha mgawanyo huo bila lugha ngumu ya kitaalamu.
- source_word: וְ
  choice: Kisha
  rationale: Kiunganishi kinaendeleza hatua inayofuata katika utaratibu wa dhabihu; ‘Kisha’ huonyesha mfuatano huo kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye staha. Muundo ‘ataiondoa ngozi ya’ umechaguliwa badala ya ‘ataichuna ngozi’ ili kuepuka utata na kueleza tendo la ibada kwa kawaida.
