  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: sw
  text: Nao wana wa Aroni, kuhani, wataweka moto juu ya madhabahu na watapanga kuni juu ya moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: wataweka
  rationale: Kitenzi נתן hapa kina maana ya kuweka; umbo la wakati ujao linafaa kwa nguvu ya maagizo ya utaratibu katika muktadha huu.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: wana wa kuhani Aroni
  rationale: Muundo huu wa Kiswahili unaweka wazi kwamba הַכֹּהֵן inamtambulisha Aroni kuwa kuhani, si wana wake wote mmoja mmoja, huku ukihifadhi uhusiano wa kifamilia.
- source_word: אֵשׁ
  choice: moto
  rationale: Maana yake hapa ni moto halisi unaotumiwa katika utaratibu wa dhabihu.
- source_word: עַל הַמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya mahali pa kuweka moto katika muktadha wa dhabihu.
- source_word: וְעָרְכוּ
  choice: na kupanga
  rationale: Kitenzi ערך katika taratibu za ibada humaanisha kupanga au kuweka kwa utaratibu; 'kupanga' ni ya asili na huhifadhi wazo la mpangilio.
- source_word: עֵצִים
  choice: kuni
  rationale: Ingawa neno la Kiebrania ni la wingi na kwa ujumla humaanisha mbao, 'kuni' ndilo neno la kawaida la Kiswahili kwa mbao zinazotumiwa kuwasha na kuendeleza moto.
- source_word: עַל הָאֵשׁ
  choice: juu ya moto
  rationale: Tafsiri hii ya moja kwa moja huhifadhi urudiaji wa Kiebrania na mfuatano wa vitendo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo 'wana wa kuhani Aroni' umechaguliwa badala ya 'wana wa Aroni kuhani' ili kuondoa utata usio wa lazima kuhusu neno 'kuhani' kumrejelea nani, bila kubadili maana ya Kiebrania. Hakuna tanbihi inayohitajika kwa kuwa tafsiri hiyo inawakilisha wazi sintaksia ya chanzo.
