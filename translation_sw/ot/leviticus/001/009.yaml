  to: 'Naye atayaosha matumbo yake na miguu yake kwa maji; kisha kuhani atafukiza vyote juu ya madhabahu: sadaka ya kuteketezwa, sadaka ya moto[a], harufu ya kumpendeza Yahwe[b].'
