base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: sw
  text: 'Naye atayaosha matumbo yake na miguu yake kwa maji; kisha kuhani atafukiza vyote juu ya madhabahu: sadaka ya kuteketezwa, sadaka ya moto[a], harufu ya kumpendeza Yahwe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka inayotolewa kwa moto”; wengine huelewa neno la Kiebrania kuwa “sadaka ya chakula” inayotolewa kwa moto.
    reason: lexical_alternative
  - marker: b
    text: “Harufu ya kumpendeza” ni kauli ya kawaida katika taratibu za dhabihu, ikionyesha kwamba sadaka hiyo inakubalika kwa Yahwe.
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: matumbo yake
  rationale: Katika muktadha wa dhabihu, neno hili linamaanisha sehemu za ndani za mnyama. “Matumbo” ni neno la kawaida na halisi katika Kiswahili, ingawa maana inaweza kujumuisha viungo vya ndani kwa upana.
- source_word: כְרָעָיו
  choice: miguu yake
  rationale: Neno hili hurejelea miguu, hasa sehemu zake za chini. “Miguu” ni wazi na ya kawaida kuliko istilahi ya kitaalamu zaidi.
- source_word: יִרְחַץ בַּמָּיִם
  choice: atayaosha ... kwa maji
  rationale: Huhifadhi tendo la kuosha na njia inayotumiwa, kwa mtindo wa kawaida wa Kiswahili.
- source_word: וְהִקְטִיר
  choice: ataviteketeza ... viwe moshi
  rationale: Katika lugha ya dhabihu, kitenzi hiki humaanisha kuteketeza sadaka madhabahuni ili ipae kama moshi; tafsiri hii ni mahususi zaidi kuliko “atachoma” peke yake.
- source_word: אֶת־הַכֹּל
  choice: vyote
  rationale: Huhifadhi msisitizo kwamba sehemu zote za mnyama zilizoandaliwa zinatolewa.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Hii ni lugha ya kawaida na inayoeleweka kwa tendo la dhabihu.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi iliyo wazi kwa sadaka ambayo huteketezwa yote; huepuka tafsiri isiyoeleweka kwa urahisi ya “sadaka ya kupaa.”
- source_word: אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Neno hili lina utata wa kileksika katika kauli za kikuhani. Tafsiri ya msingi huhifadhi uhusiano wake dhahiri na moto bila kulifanya kuwa aina tofauti ya sadaka ya nafaka.
- source_word: רֵיחַ נִיחוֹחַ
  choice: harufu ya kumpendeza
  rationale: Huhifadhi sitiari ya Kiebrania na maana yake ya kawaida ya sadaka inayokubalika, bila kudokeza hitaji la kimwili kwa Mungu.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu, YHWH, lililotajwa moja kwa moja katika maandishi ya Kiebrania.
theological_decisions:
- issue: Maana ya אִשֵּׁה katika kauli ya dhabihu
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Maana halisi ya istilahi hii inajadiliwa. Maandishi makuu yanahifadhi uhusiano na moto, huku tanbihi ikitaja uwezekano wa kuielewa kama zawadi ya chakula inayowasilishwa kwa Mungu.
- issue: Maana ya רֵיחַ נִיחוֹחַ
  choice: harufu ya kumpendeza
  alternative: harufu ya kutuliza
  rationale: Tafsiri hii huhifadhi taswira ya chanzo na kauli ya kidhabihu kuhusu kukubalika kwa sadaka, bila kuamua zaidi jinsi Mungu anavyohusiana na harufu hiyo.
- issue: Uwakilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano lenyewe; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa baada ya tendo la kuteketeza ili mfuatano wa maelezo ya dhabihu usomeke kwa urahisi, huku uhusiano wa vifungu vya Kiebrania ukihifadhiwa.
