  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: sw
  text: Ataondoa kifuko chake cha chakula[a] pamoja na manyoya yake[b], na kukitupa mashariki mwa madhabahu, mahali pa majivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kidaka chake.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maana ya kawaida, “pamoja na manyoya yake”; baadhi ya tafsiri husema, “pamoja na uchafu wake.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: Ataondoa
  rationale: Hifili ya סור inaeleza kusababisha kitu kiondolewe; kitenzi hiki kinaendeleza kwa kawaida maagizo ya ibada.
- source_word: מֻרְאָתוֹ
  choice: kifuko chake cha chakula
  rationale: Katika muktadha wa ndege, neno hili linamaanisha sehemu ya mfumo wa chakula inayohifadhi chakula kwa muda. Usemi huu unaeleweka kwa urahisi kuliko istilahi ya kitaalamu ‘kidaka,’ ambayo imehifadhiwa katika tanbihi.
- source_word: בְּנֹצָתָהּ
  choice: pamoja na manyoya yake
  rationale: Muundo wa konsonanti unahusiana kwa kawaida na נוצה, yaani ‘unyoya/manyoya.’ Kwa kuwa kifungu kina utata wa kale, maana mbadala inayohusu uchafu imeonyeshwa katika tanbihi.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: kisha akitupe
  rationale: Hifili ya שלך humaanisha kutupa. Kiambishi ‘-ki-’ kinarejelea kifuko cha chakula na kinatoa agizo la kiibada kwa Kiswahili cha kawaida.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: kando ya madhabahu
  rationale: אצל huonyesha mahali karibu na upande wa kitu; ‘kando ya madhabahu’ ni sahihi na ya asili.
- source_word: קֵדְמָה
  choice: upande wa mashariki
  rationale: Kielezi hiki cha mwelekeo kinaonyesha upande wa mashariki wa madhabahu.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: mahali pa majivu
  rationale: Katika taratibu za dhabihu, דשן hurejelea majivu yanayoondolewa madhabahuni. Tafsiri hii ni wazi bila kuongeza maelezo yasiyosemwa moja kwa moja.
