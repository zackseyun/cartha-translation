translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi kwa wasomaji wa kawaida. ‘Kifuko cha chakula’ kimetumiwa katika matini kwa uelewekaji, huku ‘kidaka’ kikihifadhiwa kama istilahi mbadala katika tanbihi. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
