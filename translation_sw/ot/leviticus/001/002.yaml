id: LEV.1.2
reference: Leviticus 1:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: sw
  text: '“Sema na wana wa Israeli[a] na uwaambie: Mtu[b] miongoni mwenu atakapomletea Yahwe sadaka, mtaleta sadaka yenu kutoka katika mifugo—kutoka katika ng’ombe au katika kondoo na mbuzi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “mwanadamu”; katika muktadha huu neno la Kiebrania אָדָם (adam) linamtaja mtu mmoja kwa maana wakilishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa ukaribu nahau rasmi ya Kiebrania huku ikiwa usemi unaoeleweka na wenye hadhi katika Kiswahili cha Biblia.
- source_word: אָדָם
  choice: mtu
  rationale: Katika sharti hili la sheria, neno hili linamtambulisha mtu mmoja kama mwakilishi. Kiswahili ‘mtu’ ni tafsiri ya kawaida ya אָדָם na hakiongezi jinsia ambayo sarufi ya Kiswahili hailazimishi.
- source_word: יַקְרִיב
  choice: atakapomletea
  rationale: Hifili ya קרב katika muktadha wa sadaka humaanisha kuleta au kuwasilisha kitu mbele ya anayepokea. Kiambishi ‘-m-’ kinaonyesha wazi kuwa Yahwe ndiye anayeletewa sadaka.
- source_word: מִכֶּם
  choice: miongoni mwenu
  rationale: 'Inaonyesha maana ya sehemu ya kundi: mtu mmoja kutoka ndani ya jumuiya inayosemeshwa.'
- source_word: קָרְבָּן
  choice: sadaka
  rationale: ‘Sadaka’ ni neno pana na la kawaida kwa kitu kinachowasilishwa kwa Mungu; ‘dhabihu’ lingeweza kudokeza kwa namna finyu zaidi sadaka inayochinjwa.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: הַבְּהֵמָה
  choice: mifugo
  rationale: Ni jamii pana ya wanyama wa kufugwa ambayo mafungu yanayofuata—ng’ombe na kondoo au mbuzi—yanaifafanua.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: Neno hili linahusu mifugo ya jamii ya ng’ombe, si kundi la wanyama kwa ujumla.
- source_word: הַצֹּאן
  choice: kondoo na mbuzi
  rationale: הַצֹּאן ni kundi la mifugo midogo linaloweza kujumuisha kondoo na mbuzi; kutaja wote wawili huzuia ‘kundi’ kueleweka kuwa kondoo pekee.
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: mtaleta sadaka yenu
  rationale: Wingi wa nafsi ya pili umehifadhiwa baada ya kisa cha mtu mmoja, na ‘kuleta’ inadumisha uhusiano wa kitenzi na יַקְרִיב.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha wakilishi katika אָדָם na בְּנֵי יִשְׂרָאֵל
  choice: ‘mtu’ na ‘wana wa Israeli,’ pamoja na maelezo ya chini
  alternative: ‘yeyote’ na ‘Waisraeli’
  rationale: ‘Wana wa Israeli’ huhifadhi nahau ya chanzo. Kwa אָדָם, ‘mtu’ ni sawia kimaana na ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa kueleza neno hilo kama ‘mwanadamu’ au ‘mwanamume’ kulingana na muktadha.
- issue: Mpito kutoka umoja hadi wingi
  choice: ‘Mtu … atakapomletea’ kisha ‘mtaleta sadaka yenu’
  alternative: Kusawazisha sentensi yote iwe katika umoja
  rationale: Kiebrania hubadilika kutoka kwa mtu mmoja katika sharti hadi wingi unaoiagiza jumuiya; mpito huo umehifadhiwa badala ya kusawazishwa kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa amri na mpito wa chanzo kutoka umoja kwenda wingi umehifadhiwa. ‘Kondoo na mbuzi’ linafafanua kwa uwazi wigo wa הַצֹּאן.
