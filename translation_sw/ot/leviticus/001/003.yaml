id: LEV.1.3
reference: Leviticus 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: sw
  text: Kama sadaka yake ni sadaka ya kuteketezwa ya ng’ombe, atamtoa mnyama dume asiye na dosari. Atamleta kwenye mlango wa hema la kukutania ili akubaliwe mbele za Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hiari yake mbele za Yahwe.”
    reason: Kiebrania לִרְצֹנוֹ kinaweza kueleweka kuwa kinahusu kukubaliwa kwa mtoaji au kwamba anamleta mnyama kwa hiari yake.
lexical_decisions:
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi iliyo wazi na iliyozoeleka kwa sadaka iliyoteketezwa yote juu ya madhabahu; pia inadumisha wazo la aina maalumu ya sadaka bila kulipanua kupita kiasi.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קרבן ni kitu kinacholetwa au kutolewa kwa Mungu; “sadaka” ni neno la kawaida na linalofaa katika muktadha huu wa ibada.
- source_word: מִן הַבָּקָר
  choice: kutoka kundini
  rationale: הבקר hapa hurejelea kundi la ng’ombe. “Kutoka kundini” ni Kiswahili cha asili katika muktadha wa mifugo, huku aina ya mnyama ikieleweka kutokana na muktadha.
- source_word: זָכָר
  choice: mnyama dume
  rationale: Maandishi yanataja jinsia ya mnyama waziwazi; “mnyama dume” ni ya kawaida na huzuia “dume” kusikika kana kwamba inamhusu mtu.
- source_word: תָּמִים
  choice: asiye na dosari
  rationale: Katika sheria za sadaka, neno hili humaanisha mnyama asiye na kasoro ya mwili; “asiye na dosari” ni sahihi na yenye hadhi.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: atamtoa / atamleta
  rationale: Kitenzi קרב katika Hifili humaanisha kuleta karibu au kuwasilisha kama sadaka. Kutumia “atamtoa” kwanza na “atamleta” baadaye kunatoa Kiswahili cha kawaida huku kukihifadhi tendo la sadaka na tendo la kuileta mahali palipoagizwa.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: mlango wa hema la kukutania
  rationale: Ni usemi wa mahali patakatifu unaotaja sehemu ya kuingilia hema ambako Mungu hukutana na watu wake; “hema la kukutania” ni tafsiri wazi na iliyozoeleka.
- source_word: לִרְצֹנוֹ
  choice: ili akubaliwe
  rationale: Katika muktadha wa sadaka, usemi huu kwa uwezekano mkubwa unahusu kukubaliwa kwa mtoaji mbele za Mungu. Muundo huu ni wa kawaida kwa Kiswahili, huku maana mbadala ya hiari ikihifadhiwa katika tanbihi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי ni “mbele ya/katika uwepo wa,” na jina la agano יהוה limetolewa moja kwa moja kama “Yahwe.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu la herufi nne moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִרְצֹנוֹ
  choice: ili akubaliwe
  alternative: kwa hiari yake
  rationale: Usemi wa Kiebrania unaweza kueleweka kuwa unahusu kukubaliwa kwa mtoaji au hiari yake. Muktadha wa Walawi unaunga mkono kukubaliwa mbele za Yahwe, lakini mapokeo ya tafsiri ya hiari ni halisi kiasi cha kustahili tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na za kisheria kama chanzo, lakini uchaguzi wa “atamtoa” na “atamleta” huepuka urudiaji usio wa kawaida. Tanbihi imewekwa baada ya kishazi chenye utata, si baada ya “kundini,” ili alama ihusiane moja kwa moja na לִרְצֹנוֹ.
