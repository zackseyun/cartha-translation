base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: sw
  text: Kuhani atamleta ndege huyo kwenye madhabahu, ataondoa kichwa chake na kukiteketeza juu ya madhabahu, kisha damu yake itakamuliwa kwenye upande wa madhabahu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: atamleta ndege huyo
  rationale: Hifili ya קרב inaonyesha kumleta au kumsogeza karibu. Kutaja “ndege huyo” hufanya kiwakilishi kieleweke kwa Kiswahili huku mwendo kuelekea madhabahuni ukihifadhiwa.
- source_word: הַכֹּהֵן
  choice: Kuhani
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa כֹּהֵן katika sheria za dhabihu.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: kwenye madhabahu
  rationale: אֶל huonyesha mwendo kuelekea mahali panapolengwa; “kwenye madhabahu” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: atamng’oa kichwa
  rationale: מלק ni istilahi maalumu ya kitendo cha kuhani cha kumuua ndege wa dhabihu kwa kukiondoa kichwa. “Kumng’oa kichwa” ni wazi na ya kawaida, bila kudai kwa usahihi usiothibitishwa namna kamili ya kutumia vidole au kucha.
- source_word: וְהִקְטִיר
  choice: na kukiteketeza
  rationale: Katika muktadha wa dhabihu, קטר ni kuchoma kitu madhabahuni ili moshi wake upande. Kiambishi “ki-” kwa kawaida hurejelea kichwa kilichotajwa mara moja kabla, kama mpangilio wa Kiebrania unavyodokeza.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Katika tendo la kuchoma dhabihu, Kiswahili cha kawaida hutaja mahali hapo kuwa “juu ya madhabahu.”
- source_word: וְנִמְצָה דָמוֹ
  choice: damu yake itakamuliwa
  rationale: Nifali ya מצה hapa huonyesha damu ikitolewa kwa kubanwa au kukamuliwa. “Itakamuliwa” huhifadhi hali ya kutendwa na maana ya damu kutolewa kwa shinikizo.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: kwenye ubavu wa madhabahu
  rationale: קִיר maana yake ya msingi ni ukuta, lakini kwa madhabahu “ubavu” huwasilisha kwa Kiswahili cha kawaida sehemu yake ya wima bila kudokeza ukuta tofauti wa jengo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa wakati ujao umetumiwa kama kauli ya maagizo ya ibada. “Ndege huyo” imeongezwa kwa uwazi wa kiwakilishi bila kuongeza mhusika mpya; “ubavu wa madhabahu” ni wa kawaida zaidi kuliko “ukuta wa madhabahu,” huku maana halisi ikihifadhiwa katika tanbihi.
