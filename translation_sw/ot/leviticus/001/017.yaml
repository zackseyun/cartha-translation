id: LEV.1.17
reference: Leviticus 1:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: sw
  text: Atampasua ndege huyo katikati ya mabawa yake, lakini asimtenganishe kabisa. Kisha kuhani atamteketeza juu ya madhabahu, juu ya kuni zilizo juu ya moto. Hii ni sadaka ya kuteketezwa, sadaka inayotolewa kwa moto[a], yenye harufu ya kupendeza kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya moto”; huenda pia, “sadaka ya chakula.”
    reason: Istilahi ya Kiebrania אִשֶּׁה ni ya kiibada na maana yake kamili ina utata; inaweza kueleweka kama sadaka inayotolewa kwa moto, sadaka ya moto, au sadaka inayowasilishwa kwa Mungu kama chakula.
lexical_decisions:
- source_word: שִׁסַּע
  choice: atampasua
  rationale: Kitenzi hiki kinaeleza kumpasua au kumrarua ndege ili afunguke; “atampasua” ni wazi na kinaendana na katazo linalofuata la kutomtenganisha kabisa.
- source_word: בִכְנָפָיו
  choice: katikati ya mabawa yake
  rationale: Kirai kinaonyesha mahali au njia ya kumpasua ndege. “Katikati ya mabawa yake” huwasilisha picha halisi bila kudokeza kwamba mabawa yanapaswa kung’olewa.
- source_word: לֹא יַבְדִּיל
  choice: asimtenganishe kabisa
  rationale: Hifili ya בדל humaanisha kutenga au kutenganisha. Neno “kabisa” linafafanua kwamba ndege anapasuliwa na kufunguliwa lakini hagawanywi kuwa sehemu mbili tofauti.
- source_word: וְהִקְטִיר
  choice: atamteketeza
  rationale: Katika muktadha wa dhabihu, kitenzi hiki humaanisha kuchoma sadaka juu ya madhabahu ili moshi wake upande. “Atamteketeza” ni istilahi ya kawaida na yenye kueleweka katika Kiswahili cha ibada za dhabihu.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya mahali sadaka inapoteketezwa.
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: juu ya kuni zilizo juu ya moto
  rationale: 'Tafsiri inadumisha urudiaji wa kihusishi עַל na mpangilio wa vitu ulio katika Kiebrania: sadaka juu ya kuni, nazo kuni juu ya moto.'
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hii ndiyo istilahi iliyozoeleka na sahihi kwa dhabihu inayoteketezwa madhabahuni, huku ikihifadhi dhana ya sadaka nzima kupanda kwa moshi.
- source_word: אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  rationale: Neno hili la kiibada linahusishwa na sadaka inayotolewa kwa moto. Tafsiri hii ni ya kawaida, inaeleweka, na haiongezi wazo la chakula lisilo dhahiri kwa msomaji wa Kiswahili.
- source_word: רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  rationale: Kirai hiki cha kawaida katika ibada za dhabihu kinaonyesha kwamba sadaka inakubaliwa na Mungu. Tafsiri inadumisha sitiari ya harufu kwa Kiswahili cha sasa na cha asili.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kauli ya kiibada רֵיחַ נִיחֹחַ
  choice: yenye harufu ya kumpendeza
  alternative: yenye harufu ya kutuliza
  rationale: Chaguo hili linaonyesha kukubaliwa kwa dhabihu na Mungu huku likihifadhi sitiari ya maandishi, bila kuingiza maelezo ya kiteolojia yasiyotajwa.
- issue: Maana ya istilahi אִשֵּׁה
  choice: sadaka inayotolewa kwa moto
  alternative: sadaka ya chakula
  rationale: Asili na upeo kamili wa istilahi hii ya kiibada vina utata. Matini kuu inaonyesha uhusiano wake na moto, nao uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sheria ya dhabihu umehifadhiwa, huku sentensi zikifanywa ziwe za asili katika Kiswahili. Kirejeleo “ndege huyo” kimetumiwa kwa uwazi kutokana na muktadha wa mstari uliotangulia.
