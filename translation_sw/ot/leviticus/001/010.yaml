  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: sw
  text: Kama sadaka yake inatoka katika kundi la kondoo au mbuzi, kwa sadaka ya kuteketezwa[a], atamtoa mnyama dume asiye na kasoro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa sadaka ya kuteketezwa.”
    reason: lexical_alternative
  - marker: b
    text: “Asiye na kasoro” humaanisha mnyama asiye na dosari ya kimwili, kama ilivyotakiwa kwa sadaka hii.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Kama
  rationale: Hufungua sharti linalofuata katika maagizo; Kiswahili cha sasa hakihitaji kila mara kutafsiri ו kwa kiunganishi tofauti.
- source_word: מִן הַצֹּאן
  choice: kutoka katika kundi la wanyama
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi; ufafanuzi unaofuata unaweka wazi aina hizo.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן hapa ni kitu kinacholetwa na kutolewa katika ibada, kwa hiyo 'sadaka' ni neno la kawaida na linaloeleweka.
- source_word: מִן הַכְּשָׂבִים
  choice: kondoo
  rationale: Neno hili humaanisha jamii ya kondoo bila kulazimisha umri maalumu wa mnyama.
- source_word: אוֹ מִן הָעִזִּים
  choice: au mbuzi
  rationale: Hutaja jamii ya mbuzi kwa kawaida na kwa ulinganifu na kondoo.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni aina maalumu ya sadaka iliyoteketezwa; usemi huu ni wazi na umezoeleka katika Kiswahili cha Biblia.
- source_word: זָכָר
  choice: mnyama dume
  rationale: Huhifadhi sharti la wazi kuhusu jinsia ya mnyama na kuondoa uwezekano wa kueleweka kuwa ni mwanadamu.
- source_word: תָּמִים
  choice: asiye na kasoro
  rationale: Katika muktadha wa sadaka, humaanisha mnyama asiye na dosari ya kimwili.
- source_word: יַקְרִיבֶנּוּ
  choice: atamtoa
  rationale: Hiphil ya קרב katika muktadha huu humaanisha kumtoa au kumwasilisha mnyama kuwa sadaka; 'atamtoa' ni ya kawaida na huhifadhi nguvu ya agizo.
theological_decisions:
- issue: Tafsiri ya neno la sadaka עֹלָה
  choice: sadaka ya kuteketezwa
  alternative: sadaka ya kupaa
  rationale: '''Sadaka ya kuteketezwa'' hutambulisha aina ya ibada kwa uwazi bila kulazimisha maana ya kietimolojia ya kupaa.'
- issue: Sharti la jinsia ya mnyama
  choice: mnyama dume
  alternative: dume
  rationale: Maandishi ya Kiebrania yanataja jinsia ya mnyama waziwazi; tafsiri inahifadhi sharti hilo huku ikibainisha kuwa anayezungumziwa ni mnyama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'yaani kondoo au mbuzi' unaeleza kwa kawaida maana ya jamii ya צֹאן bila kuifanya kuwa aina ya tatu tofauti.
