base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: sw
  text: Naye atamchinja upande wa kaskazini wa madhabahu mbele ya Yahweh; kisha wana wa Aroni, makuhani, watairusha damu yake dhidi ya madhabahu pande zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watatupa damu yake dhidi ya madhabahu pande zote.” Kitenzi cha Kiebrania hudokeza kuirusha damu kwa nguvu, si kuinyunyiza kidogo tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: atamchinja
  rationale: Kitenzi שׁחט ni istilahi ya kawaida ya kumchinja mnyama wa dhabihu, si kuua kwa maana ya jumla.
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: upande wa kaskazini wa madhabahu
  rationale: יֶרֶךְ hapa humaanisha upande wa madhabahu, na צָפֹנָה huonyesha mahali kuelekea kaskazini.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Ni usemi wa ibada unaomaanisha katika uwepo wa Yahweh; tafsiri hii ni ya asili na yenye heshima katika Kiswahili.
- source_word: וְזָרְקוּ
  choice: watairushia
  rationale: זרק humaanisha kurusha au kutupa; katika ibada hii damu inarushiwa madhabahu. Chaguo hili huhifadhi nguvu ya tendo kuliko ‘kunyunyiza.’
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: wana wa Aroni, makuhani
  rationale: Muundo huu huhifadhi nasaba yao na pia unawatambulisha kuwa makuhani.
- source_word: דָּמוֹ
  choice: damu yake
  rationale: Kiwakilishi kinamrejelea mnyama wa dhabihu.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: madhabahu ... pande zote
  rationale: Pamoja na זרק, עַל huonyesha damu ikirushiwa madhabahu, na סָבִיב huonyesha tendo kufanywa kuizunguka madhabahu kwa pande zake zote.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maagizo ya ibada ulio wazi na wenye heshima. ‘Atamchinja’ humrejelea mnyama dume anayetajwa katika muktadha, na ‘watairushia madhabahu’ ni usemi wa kawaida unaohifadhi nguvu ya kitenzi cha Kiebrania.
