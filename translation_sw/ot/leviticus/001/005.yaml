  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: sw
  text: Naye atamchinja ng’ombe dume mchanga[a] mbele za Yahwe. Wana wa Haruni, yaani makuhani, watawasilisha damu na watairusha[b] pande zote za madhabahu iliyo mlangoni pa Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mwana wa kundi la ng’ombe”; ni nahau ya Kiebrania kwa mnyama wa jamii ya ng’ombe, hapa ikitafsiriwa “ng’ombe dume mchanga.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuinyunyiza damu.” Kitenzi cha Kiebrania huonyesha kuirusha au kuitupa damu katika matumizi ya kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: atamchinja
  rationale: Katika maagizo haya, umbo la Kiebrania linaeleza tendo linalopaswa kufanywa. ‘Kuchinja’ linafaa zaidi kuliko ‘kuua’ kwa mnyama wa dhabihu.
- source_word: בֶּן הַבָּקָר
  choice: ng’ombe dume mchanga
  rationale: Kirai hiki, kihalisi ‘mwana wa kundi la ng’ombe,’ ni nahau inayomaanisha mnyama wa jamii ya ng’ombe; katika muktadha huu ni ng’ombe dume mchanga.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi lugha ya mahali na uwepo katika ibada bila kuifafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa herufi YHWH limetoholewa kwa namna ya kawaida na inayosomeka katika Kiswahili.
- source_word: וְהִקְרִיבוּ
  choice: wataileta
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha. Kwa damu kama yambwa, ‘wataileta’ ni ya kawaida na haidokezi kimakosa kwamba makuhani wanatoa dhabihu nyingine.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: wana wa Haruni, yaani makuhani
  rationale: Huhifadhi uhusiano wa kifamilia na pia kufafanua kwamba wana hao ndio makuhani wanaoshughulikia damu.
- source_word: וְזָרְקוּ
  choice: kuirusha
  rationale: Kitenzi זרק kinaonyesha kurusha au kutupa damu katika matumizi ya kiibada, tendo lenye nguvu zaidi kuliko kunyunyiza matone.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: kwenye madhabahu pande zake zote
  rationale: Huonyesha kwamba damu inawekwa kwenye pande za madhabahu kuizunguka, kwa Kiswahili cha kawaida, bila kuifanya ‘sprinkle’ kuwa maana ya lazima.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: iliyo mlangoni pa Hema la Kukutania
  rationale: Kishazi hiki kinaitambulisha madhabahu kwa mahali ilipo, kwenye mlango wa hema.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Ni tafsiri ya moja kwa moja na inayoeleweka ya hema lililokusudiwa kwa kukutana, bila kuingiza taswira ya jengo la baadaye.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Namna ya kutumia damu kwenye madhabahu
  choice: kuirusha kwenye madhabahu pande zake zote
  alternative: kuinyunyiza juu ya madhabahu
  rationale: Kitenzi cha Kiebrania kinaweza kutafsiriwa katika mapokeo kama ‘kunyunyiza,’ lakini kimsingi huonyesha kurusha au kutupa. Tafsiri haipunguzi nguvu ya tendo wala kuamua kwamba lilikuwa unyunyizaji wa matone.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Naye’ huunganisha mhusika na maagizo yaliyotangulia; ‘yaani makuhani’ huweka uhusiano wa kiapposisheni wazi. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
