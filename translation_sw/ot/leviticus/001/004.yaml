base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: sw
  text: Naye ataweka mkono wake juu ya kichwa cha sadaka ya kuteketezwa, nayo itakubaliwa[a] kwa ajili yake, ili kumfanyia upatanisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye atakubaliwa”—kitenzi cha Kiebrania kilicho katika hali ya kutendwa kinaweza kueleweka kuwa kinamrejelea mtoaji moja kwa moja zaidi badala ya sadaka.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Naye ataweka
  rationale: Katika muktadha wa dhabihu, kitenzi hiki kinaeleza kuweka au kuegemeza mkono juu ya mnyama. “Ataweka” ni Kiswahili cha kawaida kinachohifadhi tendo la ibada bila kuainisha nguvu iliyotumika.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Huhifadhi umoja na umilikishi wa Kiebrania.
- source_word: עַל רֹאשׁ
  choice: juu ya kichwa cha
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ishara hiyo ya kimwili.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno linaloeleweka kwa sadaka iliyoteketezwa yote; halitegemei tu maana ya kietimolojia ya kitu kinachopanda.
- source_word: וְנִרְצָה
  choice: nayo itakubaliwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na, kulingana na muktadha wa karibu, huielekeza kwa sadaka, huku uwezekano wa kumrejelea mtoaji ukihifadhiwa katika tanbihi.
- source_word: לוֹ
  choice: kwa ajili yake
  rationale: Huonyesha manufaa au faida inayomhusu mtoaji bila kufinyaza uhusiano huo kupita kiasi.
- source_word: לְכַפֵּר
  choice: ili kufanya upatanisho
  rationale: “Kufanya upatanisho” huhifadhi uzito wa neno la ibada bila kuingiza nadharia mahususi ya jinsi upatanisho unavyotendeka.
- source_word: עָלָיו
  choice: kwa niaba yake
  rationale: Katika matumizi ya dhabihu pamoja na כפר, kirai hiki humtaja mtu ambaye upatanisho unafanywa kwa ajili yake; “kwa niaba yake” pia huepuka urudiaji usio wa kawaida.
theological_decisions:
- issue: Mrejelewa wa kitenzi cha kutendwa וְנִרְצָה
  choice: Sadaka itakubaliwa
  alternative: Mtoaji atakubaliwa
  rationale: Mrejelewa wa karibu katika muktadha ni sadaka ya kuteketezwa, na mfuatano wa sentensi unaeleweka kwa kawaida kuwa sadaka inakubaliwa kwa ajili ya mtoaji. Hata hivyo, muundo wa Kiebrania unaweza kueleweka kuwa unamhusu mtoaji moja kwa moja zaidi, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umewekwa karibu na Kiebrania lakini sentensi imefanywa ya kawaida kwa msomaji wa leo. Neno “upatanisho” limetumiwa kama istilahi ya ibada bila kufafanua kimadhehebu namna unavyotimizwa.
