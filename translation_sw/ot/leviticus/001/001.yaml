  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: sw
  text: Kisha Yahwe[a] akamwita Musa, akasema naye kutoka katika Hema la Kukutania, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina la Mungu יהוה (YHWH), linalotamkwa hapa “Yahwe”; tafsiri nyingine hutumia “BWANA.”
    reason: Kufafanua jina la Mungu lililo katika maandishi ya Kiebrania na kutaja tafsiri mbadala iliyozoeleka.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Kitenzi קרא pamoja na אֶל hapa kinaanzisha Mungu kumwita Musa ili aseme naye. “Akamwita” ni Kiswahili cha kawaida na hakiongezi wazo la amri kali ambalo lingepatikana katika “akamwamuru aje.”
- source_word: אֶל־מֹשֶׁה
  choice: Musa
  rationale: Kiambishi cha yambwa katika “akamwita” kinawasilisha kwa kawaida maana ya “alimwita Musa”; “Musa” ndiyo namna sanifu ya jina hilo katika Kiswahili.
- source_word: וַיְדַבֵּר
  choice: akasema naye
  rationale: דבר inaonyesha tendo la kusema, mara nyingi katika mawasiliano rasmi ya Mungu. “Akasema naye” linatofautisha tendo hili na לֵאמֹר inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina binafsi la Mungu katika maandishi ya Kiebrania, si cheo. “Yahwe” ni namna ya kawaida ya Kiswahili ya kuandika jina hilo.
- source_word: אֵלָיו
  choice: naye
  rationale: Kiwakilishi kinamrejelea Musa; “akasema naye” ni usemi wa asili wa Kiswahili unaowasilisha kwamba Yahwe alisema na Musa.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: kutoka katika Hema la Kukutania
  rationale: אֹהֶל מוֹעֵד ni jina la mahali patakatifu ambapo Mungu alikutana na watu wake. “Hema la Kukutania” ni wazi, sanifu, na haliongezi istilahi isiyokuwamo katika kirai cha Kiebrania.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Muundo huu unatambulisha maneno yanayofuata. “Akisema,” huhifadhi kiashiria hicho cha hotuba na kuandaa nukuu ya mstari unaofuata.
- source_word: וַ
  choice: Kisha
  rationale: Waw ya usimulizi inaendeleza mfululizo kutoka mwisho wa Kutoka. “Kisha” huonyesha mwendelezo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, יְהוָה. Kulitaja “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kwa cheo, bila kuongeza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo unahifadhi vitendo viwili tofauti—kumwita na kusema naye—pamoja na kiashiria cha hotuba “akisema.” Jina “Hema la Kukutania” limetumiwa kama istilahi sanifu ya mahali patakatifu.
