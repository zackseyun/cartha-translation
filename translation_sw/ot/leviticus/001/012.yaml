base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: sw
  text: Naye ataikata vipande-vipande, pamoja na kichwa chake na mafuta yake[a]; na kuhani atavipanga juu ya kuni zilizo kwenye moto ulio juu ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shahamu yake,” au “mafuta yaliyozunguka matumbo yake.” Neno la Kiebrania hurejelea tishu za mafuta zinazohusiana na mnyama wa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח ... לִנְתָחָיו
  choice: ataikata vipande-vipande
  rationale: Kitenzi נתח katika muktadha wa dhabihu humaanisha kukata mnyama katika vipande. Usemi huu ni wa kawaida na unaendeleza maana ya utaratibu wa ibada.
- source_word: רֹאשׁוֹ
  choice: kichwa chake
  rationale: Ni neno la moja kwa moja la sehemu ya mwili; kiwakilishi kinamrejelea mnyama wa dhabihu.
- source_word: פִּדְרוֹ
  choice: mafuta yake
  rationale: פדר hurejelea tishu za mafuta zinazohusiana na mnyama wa dhabihu. “Mafuta yake” ni lugha inayoeleweka kwa urahisi, huku tanbihi ikihifadhi uwezekano wa maana iliyo mahsusi zaidi.
- source_word: וְעָרַךְ
  choice: atavipanga
  rationale: ערך katika muktadha wa ibada humaanisha kuweka au kupanga kwa utaratibu. “Atavipanga” ni ya asili na pia huonyesha kuwa vipande, kichwa na mafuta vinatajwa kwa pamoja.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno sanifu la Kiswahili kwa כהן katika sheria za dhabihu.
- source_word: עַל הָעֵצִים
  choice: juu ya kuni
  rationale: Ingawa neno la Kiebrania ni la wingi, “kuni” ni nomino ya kawaida ya Kiswahili inayofaa katika muktadha huu.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: zilizo kwenye moto ulio juu ya madhabahu
  rationale: 'Muundo huu unahifadhi maelezo ya mahali yaliyopangiliwa kwa tabaka: kuni ziko kwenye moto, nao moto uko juu ya madhabahu.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria wa wakati ujao umetumiwa kuwasilisha agizo la ibada. Alama ya tanbihi imewekwa baada ya “mafuta yake,” ambako tofauti ya kileksika inahusika.
