base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: sw
  text: Nao wana wa Aroni, makuhani, watapanga vipande, kichwa, na mafuta[a] juu ya kuni zilizo juu ya moto ulio juu ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shahamu” au “tabaka la mafuta”; neno la Kiebrania hurejelea sehemu yenye mafuta ya mnyama iliyotumiwa katika sadaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: Nao ... watavipanga
  rationale: Kitenzi ערך katika maagizo ya dhabihu humaanisha kuweka vitu kwa mpangilio. Muundo huu pia unawakilisha kiunganishi וְ kwa neno la mwanzo “Nao”.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: wana wa Aroni, makuhani
  rationale: “Makuhani” ni maelezo ya nyongeza yanayowatambulisha wana wa Aroni; koma inaonyesha uhusiano huo kwa uwazi.
- source_word: הַנְּתָחִים
  choice: vipande
  rationale: Neno hili hurejelea sehemu za mnyama zilizokatwa katika hatua iliyotangulia; “vipande” ni neno la kawaida, wazi na haliongezi maelezo yasiyokuwamo.
- source_word: הָרֹאשׁ
  choice: kichwa
  rationale: Ni tafsiri ya moja kwa moja ya sehemu hii ya mwili.
- source_word: הַפָּדֶר
  choice: mafuta
  rationale: פָּדֶר hurejelea sehemu yenye mafuta ya mnyama wa sadaka, huenda shahamu au tabaka la mafuta. “Mafuta” linaeleweka kwa urahisi, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu sehemu hasa.
- source_word: עַל הָעֵצִים
  choice: juu ya kuni
  rationale: עֵצִים hapa ni kuni zinazotumiwa kama fueli ya sadaka; “kuni” ni ya asili na sahihi katika Kiswahili.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: zilizo juu ya moto ulio juu ya madhabahu
  rationale: Tafsiri hii inadumisha vifungu viwili vya uhusiano na mpangilio wa kieneo wa Kiebrania badala ya kuurahisisha kimya kimya.
