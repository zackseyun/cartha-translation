id: LEV.1.14
reference: Leviticus 1:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: sw
  text: Na kama sadaka yake kwa Yahweh ni sadaka ya kuteketezwa ya ndege, atawasilisha sadaka yake kutoka katika hua tetere au njiwa wachanga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Na kama
  rationale: Huhifadhi kiunganishi cha mtiririko pamoja na sharti linaloanzisha aina inayofuata ya sadaka.
- source_word: מִן הָעוֹף
  choice: ya ndege
  rationale: Katika muktadha huu inaonyesha kwamba sadaka ya kuteketezwa inatokana na jamii ya ndege; Kiswahili cha asili hutumia ‘ya ndege’.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi wazi na iliyozoeleka kwa sadaka iliyoteketezwa juu ya madhabahu, huku ikitambulisha aina maalumu ya sadaka.
- source_word: קָרְבָּנוֹ
  choice: sadaka yake
  rationale: קָרְבָּן ni kitu kinacholetwa mbele za Mungu kama sadaka; ‘sadaka yake’ ni tafsiri ya kawaida na sahihi.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kiambishi ל kinaonyesha anayelengwa na sadaka; ‘kwa Yahweh’ ni cha kawaida katika Kiswahili na huhifadhi jina la agano.
- source_word: וְהִקְרִיב
  choice: atamtolea
  rationale: Hifili ya קרב hapa ni kuleta au kuwasilisha sadaka; ‘atamtolea’ huwasilisha tendo la ibada kwa lugha asilia.
- source_word: מִן הַתֹּרִים
  choice: hua tetere
  rationale: תֹּרִים ni hua wa jamii ya turtledove; ‘hua tetere’ ni jina linalotambulika katika Kiswahili cha Afrika Mashariki.
- source_word: אוֹ
  choice: au
  rationale: Huhifadhi uchaguzi kati ya aina mbili zinazoruhusiwa za ndege.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: kinda la njiwa
  rationale: Nahau halisi ‘wana wa njiwa’ humaanisha njiwa wachanga; ‘kinda la njiwa’ ni usemi mfupi na wa asili katika Kiswahili.
- source_word: אֶת קָרְבָּנוֹ
  choice: sadaka (imewakilishwa ndani ya ‘atamtolea’)
  rationale: Kitenzi ‘atamtolea’ tayari kinaeleza uwasilishaji wa sadaka kwa Yahweh; aina za ndege zinazofuata zinabainisha sadaka hiyo bila urudiaji mzito.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu la herufi nne moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֹלָה
  choice: sadaka ya kuteketezwa
  alternative: sadaka ya kupaa
  rationale: Neno lina uhusiano wa kimsingi na kupaa, lakini hapa ni jina la aina maalumu ya sadaka. ‘Sadaka ya kuteketezwa’ huwasilisha matumizi yake ya kiibada bila kufuta taswira ya moshi kupaa kwa ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa nyepesi na ya kawaida, huku istilahi ya kiibada ‘sadaka ya kuteketezwa’ na jina ‘Yahweh’ zikihifadhiwa.
