  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: sw
  text: Kisha akachinja sadaka ya kuteketezwa, nao wana wa Aroni wakamletea damu; naye akaipiga[a] kwenye madhabahu pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akairusha damu kwenye madhabahu kuizunguka.” Kitenzi cha Kiebrania kinachoeleza matumizi ya damu hapa huonyesha damu ikitupwa au kupigwa dhidi ya madhabahu, wala si kunyunyizwa kwa matone madogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Kisha akachinja
  rationale: Katika muktadha wa dhabihu, שׁחט humaanisha kuchinja kwa utaratibu wa dhabihu, si kuua tu. “Kisha” linaendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: עוֹלָה ni istilahi ya kawaida ya sadaka iliyoteketezwa yote; tafsiri hii ni wazi na imezoeleka katika lugha ya ibada ya Kiswahili.
- source_word: וַיַּמְצִאוּ
  choice: wakamletea
  rationale: Katika utaratibu huu wana wa Aroni walileta damu kwa Aroni ili aitumie madhabahuni. “Wakamletea” huonyesha kwa kawaida tendo na mpokeaji.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Ni usemi wa Kiswahili wenye heshima na unaohifadhi wazi utambulisho wao wa kifamilia.
- source_word: אֵלָיו
  choice: -m- katika “wakamletea”
  rationale: Kiambishi cha yambwa katika kitenzi kinaonyesha kwa kawaida kuwa damu ililetwa kwake, yaani kwa Aroni.
- source_word: הַדָּם
  choice: damu
  rationale: Nomino hii inatajwa kama kitu mahususi katika utaratibu wa dhabihu; muktadha wa Kiswahili unaifanya iwe bainifu bila kuhitaji kiambishi kingine.
- source_word: וַיִּזְרְקֵהוּ
  choice: akairusha
  rationale: זרק katika taratibu za dhabihu hueleza kuitupa au kuirusha damu madhabahuni, tendo lenye nguvu zaidi kuliko kuinyunyiza kwa matone madogo. “Akairusha” ni wazi na haliongezi namna ya tendo isiyokuwapo katika chanzo.
- source_word: עַל הַמִּזְבֵּחַ
  choice: kwenye madhabahu
  rationale: Kirai hiki kinaonyesha mahali damu ilipoelekezwa. “Kwenye madhabahu” ni Kiswahili cha kawaida na kinafaa kwa tendo la kuirusha damu juu au dhidi ya sehemu zake.
- source_word: סָבִיב
  choice: pande zote
  rationale: Kielezi hiki kinaonyesha kuwa damu iliwekwa kuzunguka madhabahu; “pande zote” huhifadhi maana hiyo ya mgawanyo kwa uwazi.
