  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: sw
  text: Kisha akaleta sadaka ya kuteketezwa, akaitekeleza kama ilivyoagizwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kufuata utaratibu uliowekwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akaileta
  rationale: Hifili ya קרב ina maana ya kuleta karibu au kuwasilisha. Katika muktadha wa dhabihu, “akaileta” ni ya kawaida katika Kiswahili na haichanganyi tendo hili na utoaji unaofuatia.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya sadaka iliyoteketezwa yote. Tafsiri hii inaeleweka kwa urahisi na inafaa muktadha wa Walawi.
- source_word: וַיַּעֲשֶׂהָ
  choice: na kuitoa
  rationale: Ingawa עשה kwa msingi ni “kufanya,” hapa inahusu kutekeleza ibada ya sadaka. “Kuitoa” ni ya asili katika Kiswahili cha muktadha huu, huku muundo wa sentensi ukitofautisha tendo hilo na kuileta.
- source_word: כַּמִּשְׁפָּט
  choice: kama ilivyoagizwa
  rationale: מִשְׁפָּט hapa ni kanuni au utaratibu uliowekwa kwa ajili ya sadaka. “Kama ilivyoagizwa” ni wazi na ya kawaida, huku tanbihi ikihifadhi maana rasmi zaidi ya kufuata utaratibu uliowekwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Kisha” na vitenzi vya mfululizo vinahifadhi mwendo wa simulizi ya Kiebrania bila kufanya sentensi kuwa nzito.
