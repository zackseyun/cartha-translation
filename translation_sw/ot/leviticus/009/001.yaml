  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: sw
  text: Ikawa kwamba siku ya nane Musa aliwaita Haruni, wanawe, na wazee wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaita wakusanyike”; kitenzi cha Kiebrania kinaweza kumaanisha “kuita” au “kuitisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi mpito wa kisimulizi wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi, bila kutumia usemi mrefu au wa kizamani.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: siku ya nane
  rationale: Ni tafsiri ya moja kwa moja ya kirai cha wakati, bila kuongeza kwamba ilikuwa baada ya siku saba, jambo linalotokana na muktadha lakini halijasemwa wazi katika aya.
- source_word: קָרָא
  choice: akawaita
  rationale: Kitenzi kinaweza kumaanisha kuita au kuwaita waje; 'akawaita' ni cha kawaida na cha moja kwa moja, huku uwezekano wa 'akawaitisha' ukihifadhiwa katika tanbihi.
- source_word: לְאַהֲרֹן
  choice: Haruni
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: וּלְבָנָיו
  choice: wanawe
  rationale: Katika muktadha huu, neno la Kiebrania linawahusu wana wa kiume wa Haruni wanaohudumu katika ukuhani; 'wanawe' ni sahihi na ya asili.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: na wazee wa Israeli
  rationale: Huwataja viongozi au wawakilishi wakuu wanaotambuliwa katika Israeli, kwa usemi wa kawaida wa Kiswahili.
