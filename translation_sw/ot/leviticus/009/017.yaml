  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: sw
  text: Kisha akaleta sadaka ya nafaka, akajaza kiganja chake kwa baadhi yake,[a] akachoma sehemu hiyo juu ya madhabahu, zaidi ya sadaka ya kuteketezwa ya asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “akajaza kiganja chake kutoka katika hiyo”; huu ni usemi unaomaanisha kuchukua mkononi sehemu ya sadaka ya nafaka ili kuichoma juu ya madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akaleta
  rationale: Katika muktadha wa ibada, Hifili ya קרב humaanisha kuleta karibu au kuwasilisha sadaka. “Akaleta” ni ya kawaida na haiongezi hatua isiyotajwa.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za Walawi, מִנְחָה ni sadaka inayotolewa kwa mazao ya nafaka, si zawadi ya jumla.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: akajaza kiganja chake baadhi yake
  rationale: Huhifadhi taswira halisi ya kujaza kiganja kwa sehemu ya sadaka huku Kiswahili kikibaki wazi na cha kawaida.
- source_word: וַיַּקְטֵר
  choice: akaiteketeza
  rationale: Katika muktadha wa sadaka, Hifili ya קטר ni kuchoma sadaka juu ya madhabahu, kwa wazo la kuifanya itoe moshi. “Akaiteketeza” linaonyesha uchomaji wa kiibada kwa ufupi.
- source_word: עַל הַמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Ni usemi wa kawaida wa mahali katika maelezo ya sadaka.
- source_word: מִלְּבַד
  choice: pamoja na
  rationale: 'Hapa neno linaonyesha nyongeza: sadaka ya nafaka iliteketezwa zaidi ya sadaka ya kawaida ya asubuhi.'
- source_word: עֹלַת הַבֹּקֶר
  choice: sadaka ya kuteketezwa ya asubuhi
  rationale: עֹלָה ni istilahi ya kawaida ya sadaka inayoteketezwa; muundo huu unatambulisha wazi sadaka ya kila asubuhi.
