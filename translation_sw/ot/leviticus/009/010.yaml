base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Naye akaviteketeza juu ya madhabahu—vipande vya mafuta, figo, na kishikizo cha ini kutoka katika sadaka ya dhambi[a]—kama Yahwe alivyomwamuru Mose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania linaweza kukazia kazi ya sadaka hiyo ya kuondoa unajisi pamoja na kushughulikia dhambi.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: vipande vya mafuta
  rationale: Katika muktadha wa dhabihu, neno hili humaanisha sehemu za mafuta zilizotengwa kwa ajili ya kutolewa, si mafuta kwa ujumla tu.
- source_word: כְּלָיֹת
  choice: figo
  rationale: Hili ndilo jina la moja kwa moja la kiungo kinachotajwa katika maelezo ya dhabihu.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: kishikizo cha ini
  rationale: Kirai hiki kinataja sehemu au kiambatisho cha ini kilichoondolewa wakati wa dhabihu; 'kishikizo cha ini' ni istilahi ya kawaida katika tafsiri za Kiswahili na huhifadhi utofauti wa kiungo hicho bila kukifanya kuwa 'sehemu ya ini' kwa uhakika zaidi ya Kiebrania.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Ni tafsiri inayotambulika kwa urahisi ya aina hii ya dhabihu, huku maana mbadala inayosisitiza utakaso ikihifadhiwa katika tanbihi.
- source_word: הִקְטִיר
  choice: akaviteketeza juu ya madhabahu
  rationale: Kitenzi hiki katika ibada ya dhabihu humaanisha kuvichoma vitu madhabahuni ili moshi wake upande; 'teketeza' huwasilisha tendo hilo kwa Kiswahili cha kawaida kuliko tafsiri ya neno kwa neno ya 'kuvigeuza kuwa moshi'.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Ingawa umbo la Kiebrania linaweza kuonyesha mwelekeo kuelekea madhabahuni, pamoja na kitenzi cha kuchoma dhabihu Kiswahili cha kawaida hutumia 'juu ya madhabahu'.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limewasilishwa kwa umbo la Kiswahili 'Yahwe' badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya חַטָּאת katika sheria za dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno la Kiebrania linaweza kutaja sadaka inayohusiana na dhambi na pia kazi yake ya kuondoa unajisi. Tafsiri iliyozoeleka imewekwa katika matini, na maana halali ya kiutendaji imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umetengenezwa kuwa wa kawaida kwa Kiswahili huku ukihifadhi orodha ya sehemu za dhabihu, tendo la kuziteketeza madhabahuni, na ulinganisho na amri ya Yahwe.
