  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: sw
  text: Kisha akamwambia Aroni, “Jichukulie ndama wa ng’ombe[a] kwa ajili ya sadaka ya dhambi, na kondoo dume kwa ajili ya sadaka ya kuteketezwa, wote wawili wasio na dosari; kisha uwalete mbele za Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “ndama, mwana wa kundi la ng’ombe”—yaani, mnyama mchanga wa jamii ya ng’ombe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אַהֲרֹן
  choice: Kisha akamwambia Aroni
  rationale: Muundo wa masimulizi wa Kiebrania unaendeleza tendo linalofuata; ‘Kisha akamwambia’ ni wa kawaida na wa asili katika Kiswahili.
- source_word: קַח לְךָ
  choice: Jichukulie
  rationale: Huhifadhi wazo la amri yenye kuelekezwa kwa manufaa au matumizi ya Aroni mwenyewe, bila kuwa mzito kama ‘chukua kwa ajili yako.’
- source_word: עֵגֶל בֶּן בָּקָר
  choice: ndama wa ng’ombe
  rationale: Ni usemi wa asili unaotambulisha mnyama mchanga wa jamii ya ng’ombe, huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת humaanisha sadaka inayohusiana na dhambi, si dhambi kama dhana tupu.
- source_word: וְאַיִל לְעֹלָה
  choice: na kondoo dume kwa ajili ya sadaka ya kuteketezwa
  rationale: ‘Kondoo dume’ ni neno la kawaida kwa אַיִל, na ‘sadaka ya kuteketezwa’ ni istilahi iliyo wazi kwa עֹלָה.
- source_word: תְּמִימִם
  choice: Wote wawili wawe bila dosari
  rationale: Wingi wa kivumishi unawahusu wanyama wote wawili; sentensi hii inaweka jambo hilo wazi kwa Kiswahili cha kawaida.
- source_word: וְהַקְרֵב
  choice: nawe uwalete
  rationale: Hifili ya קרב hapa ni kuwaleta au kuwafikisha mbele za Mungu; ‘uwalete’ haikimbilii kusema kuwa kitendo cha kuwatoa dhabihu tayari kimefanyika.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi usemi wa kiibada wa kuwa katika uwepo wa Mungu na kulitaja jina la agano יְהוָה moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu יְהוָה. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kusisitiza dhambi au utakaso kulingana na muktadha. Hapa ‘sadaka ya dhambi’ hudumisha istilahi ya jadi na uhusiano wake wa wazi na dhambi bila kufuta upeo wa kiibada wa neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za dhabihu zimetolewa kwa uwazi na kwa uthabiti; muundo mgumu wa Kiebrania umewekwa katika tanbihi.
