  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: sw
  text: Kisha akaleta sadaka ya watu, akachukua beberu wa sadaka ya dhambi kwa ajili ya watu, akamchinja, na akamtoa kuwa sadaka ya dhambi[a], kama ilivyofanywa kwa sadaka ya kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaifanya ibada ya utakaso kwa kuitumia.” Kitenzi cha Kiebrania kinaweza pia kuwa na maana ya kutakasa au kuondoa unajisi katika taratibu za kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akaleta
  rationale: Katika muktadha wa dhabihu, Hifili ya קרב humaanisha kuleta au kusogeza sadaka mbele kwa ajili ya ibada. “Akaleta” ni ya kawaida na haiingizi hatua maalumu isiyotajwa.
- source_word: קָרְבַּן הָעָם
  choice: sadaka ya watu
  rationale: קָרְבָּן ni kitu kinacholetwa kama sadaka; muundo huu unaonyesha kuwa ni sadaka inayohusiana na watu au kutolewa kwa niaba yao.
- source_word: שְׂעִיר הַחַטָּאת
  choice: beberu wa sadaka ya dhambi
  rationale: שְׂעִיר ni mbuzi dume, na חַטָּאת hapa ni jina la sadaka ya dhambi katika muktadha wa ibada, si dhambi kwa maana ya tendo pekee.
- source_word: אֲשֶׁר לָעָם
  choice: aliyekuwa kwa ajili ya watu
  rationale: Kiambishi ל kinaonyesha kuwa mnyama huyo alikusudiwa kutolewa kwa niaba ya watu, wala si umiliki wao tu.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: akamchinja
  rationale: שׁחט ni kitenzi cha kawaida cha kuchinja mnyama wa dhabihu. Kiswahili humrejelea mnyama kwa ngeli ya uhai, hivyo “akamchinja” ni la asili.
- source_word: וַיְחַטְּאֵהוּ
  choice: na kumtoa kuwa sadaka ya dhambi
  rationale: Pieli ya חטא hapa inaeleza kutekeleza ibada ya sadaka ya dhambi kwa kutumia beberu huyo. Kauli hii ni ya kawaida kwa Kiswahili na haidai kwamba mnyama mwenyewe alitakaswa.
- source_word: כָּרִאשׁוֹן
  choice: kama alivyofanya kwa yule wa kwanza
  rationale: Maneno haya yanarejelea sadaka ya dhambi iliyotolewa awali na kuonyesha kuwa utaratibu uleule ulifuatwa.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: dhambi
  rationale: Katika Walawi 9 neno hili linataja sadaka yenyewe. Tafsiri hii huhifadhi istilahi ya ibada bila kuifanya kuwa dhana ya dhambi tu.
- issue: Maana ya וַיְחַטְּאֵהוּ
  choice: kumtoa kuwa sadaka ya dhambi
  alternative: kumtakasa; kufanya upatanisho kwa kumtumia
  rationale: Kitenzi kinaweza kuhusishwa na utakaso au kuondoa unajisi katika matumizi ya kikuhani. Hapa, kwa kuwa yambwa ni beberu, tafsiri ya kiutendaji inaeleweka zaidi; “kufanya upatanisho” ingeongeza istilahi mahususi ambayo haipo moja kwa moja katika kitenzi hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Beberu” limetumiwa kutaja mbuzi dume; marudio ya “sadaka ya dhambi” yanahifadhi uwazi wa istilahi ya ibada.
