  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: sw
  text: Akayaosha matumbo na sehemu za chini za miguu, kisha akaviteketeza[a] juu ya madhabahu, juu ya sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akavitoa kwa kuviteketeza ili moshi upae juu ya madhabahu, juu ya sadaka ya kuteketezwa.”
    reason: Kitenzi וַיַּקְטֵר kina maana mahsusi ya kikuhani ya kutoa dhabihu kwa kuitingisha hadi moshi wake upae, si kuichoma kwa maana ya kawaida tu.
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: akayaosha
  rationale: Kitenzi רחץ katika muktadha wa dhabihu humaanisha kuosha kwa maji. “Akayaosha” ni wazi na kina upatanisho wa ngeli unaojumuisha matumbo na sehemu za miguu.
- source_word: הַקֶּרֶב
  choice: matumbo
  rationale: Katika maagizo ya dhabihu, קֶרֶב hurejelea viungo vya ndani vya mnyama. “Matumbo” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: הַכְּרָעָיִם
  choice: sehemu za chini za miguu
  rationale: כְּרָעַיִם hurejelea miguu ya mnyama, hasa sehemu zake za chini. Kauli hii inalinda umahususi wa kimaumbile bila kutumia istilahi isiyo ya kawaida.
- source_word: וַיַּקְטֵר
  choice: akaviteketeza
  rationale: Katika ibada za kikuhani, Hiphil ya קטר humaanisha kufanya sehemu za dhabihu ziteketezwe na kupanda kama moshi juu ya madhabahu. “Akaviteketeza” ni ya asili katika Kiswahili, huku tanbihi ikihifadhi maana mahsusi ya kuvitoa vipande hivyo vipande kama moshi.
- source_word: עַל
  choice: juu ya
  rationale: Hapa עַל inaonyesha kuwekwa au kuteketezwa juu ya kitu kingine kilichokuwa madhabahuni; “juu ya” hudumisha uhusiano huo wa mahali.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya dhabihu iliyoteketezwa yote. “Sadaka ya kuteketezwa” ni tafsiri iliyo wazi na yenye hadhi katika Kiswahili.
- source_word: הַמִּזְבֵּחָה
  choice: madhabahu
  rationale: מִזְבֵּחַ humaanisha madhabahu. Kiishio cha kuelekea mahali kinaelezwa vya kutosha na kirai “juu ya madhabahu.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Kirai “sehemu za chini za miguu” kimetumiwa kwa usahihi wa kimaumbile, na urudiaji wa “juu ya” umehifadhi muundo na uhusiano wa mahali wa Kiebrania.
