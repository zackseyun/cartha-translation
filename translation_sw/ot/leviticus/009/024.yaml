revisions:
- from: Ndipo moto ukatoka mbele za Yahweh, ukateketeza sadaka ya kuteketezwa na sehemu za mafuta zilizokuwa juu ya madhabahu. Watu wote walipoona hayo, wakapiga kelele kwa furaha[a] na kuanguka kifudifudi.
  to: Ndipo moto ukatoka mbele ya Yahweh, ukateketeza juu ya madhabahu sadaka ya kuteketezwa na sehemu za mafuta. Watu wote wakaona, wakapiga kelele kwa furaha[a], wakaanguka kifudifudi.
  rationale: Marekebisho yanaweka 'juu ya madhabahu' karibu na tendo la kuteketeza, ili lihusu sadaka ya kuteketezwa na sehemu za mafuta kwa pamoja. Pia yanarekebisha ulinganifu wa vitenzi na kutumia ujenzi wa kawaida zaidi wa 'mbele ya Yahweh,' bila kubadili maana au kiwango cha uhakika wa maandishi ya Kiebrania.
