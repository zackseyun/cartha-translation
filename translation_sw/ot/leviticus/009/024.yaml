  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: sw
  text: Ndipo moto ukatoka mbele ya Yahweh, ukateketeza juu ya madhabahu sadaka ya kuteketezwa na sehemu za mafuta. Watu wote wakaona, wakapiga kelele kwa furaha[a], wakaanguka kifudifudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapiga kelele ya shangwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: moto ukatoka
  rationale: Huhifadhi mwendo wa kutoka unaoelezwa na יצא na mtiririko hai wa simulizi.
- source_word: מִלִּפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi nahau ya Kiebrania yenye maana ya kutoka mbele au katika uwepo wa Yahweh.
- source_word: וַתֹּאכַל
  choice: ukateketeza
  rationale: Katika muktadha wa moto na dhabihu, 'kuteketeza' ni Kiswahili cha kawaida na chenye kueleweka kwa tendo la moto kuimaliza dhabihu.
- source_word: עַל הַמִּזְבֵּחַ
  choice: zilizokuwa juu ya madhabahu
  rationale: Muundo huu unaunganisha kwa uwazi mahali pa sadaka na sehemu za mafuta bila kudokeza kuwa moto wenyewe ulibaki juu ya madhabahu.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi ya kawaida ya dhabihu ya עֹלָה, inayotolewa kwa kuteketezwa kabisa.
- source_word: הַחֲלָבִים
  choice: sehemu za mafuta
  rationale: Hurejelea vipande maalumu vya mafuta vilivyotengwa kwa ajili ya kutolewa, si mafuta kwa maana ya jumla.
- source_word: וַיַּרְא כָּל הָעָם
  choice: Watu wote walipoona hayo
  rationale: Kiswahili asilia hutumia 'hayo' kurejelea tukio zima lililoshuhudiwa na kuunganisha tendo hilo na mwitikio uliofuata.
- source_word: וַיָּרֹנּוּ
  choice: wakapiga kelele kwa furaha
  rationale: Mzizi רנן hapa unaeleza mlio wa shangwe au kelele ya furaha, bila kulazimisha maana ya wimbo rasmi.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: kuanguka kifudifudi
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi tendo halisi la kujitupa uso chini kwa kicho au ibada.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; 'Yahweh' hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Asili ya mwitikio wa watu katika וַיָּרֹנּוּ
  choice: kelele kwa furaha
  alternative: kelele ya shangwe; kuimba kwa shangwe
  rationale: Neno linaweza kuashiria kilio cha shangwe au uimbaji wa furaha. Muktadha wa mwitikio wa papo hapo unaunga mkono kelele ya furaha, huku tanbihi ikihifadhi uwezekano wa 'shangwe'.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa na unaosomeka kwa urahisi. 'Mbele za Yahweh' huhifadhi taswira ya Kiebrania, na 'kifudifudi' hutoa kwa kawaida tendo la kuanguka uso chini.
