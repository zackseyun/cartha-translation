lexical_decisions:
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika Kiswahili kwa sadaka ya עֹלָה, ambayo iliteketezwa yote juu ya madhabahu.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: wakamletea
  rationale: Kauli ya Hiphil hapa inaonyesha kwamba sehemu za sadaka zililetwa kwa Haruni ili azishughulikie katika ibada.
- source_word: לִנְתָחֶיהָ
  choice: kipande kwa kipande
  rationale: נֶתַח ni sehemu iliyokatwa ya mnyama; usemi huu wa Kiswahili unaonyesha kwamba sadaka ililetwa ikiwa imegawanywa katika vipande.
- source_word: הָרֹאשׁ
  choice: kichwa
  rationale: Neno hilo limetafsiriwa moja kwa moja, kwa kuwa andiko linakitaja kichwa tofauti na vipande vingine.
- source_word: וַיַּקְטֵר
  choice: akaviteketeza vyote
  rationale: Katika muktadha wa sadaka, קטר humaanisha kuchoma juu ya madhabahu ili sadaka itoe moshi. Neno “vyote” linaunganisha kwa uwazi vipande na kichwa bila kudai kwamba kitenzi cha Kiebrania kina kiwakilishi cha yambwa.
- source_word: עַל הַמִּזְבֵּחַ
  choice: juu ya madhabahu
  rationale: Huu ni usemi wa kawaida na sahihi wa Kiswahili kwa mahali ambapo sadaka iliteketezwa.
theological_decisions:
- issue: Maana ya kitenzi קטר katika ibada ya sadaka
  choice: akaviteketeza vyote
  alternative: akavifukiza vyote kuwa moshi
  rationale: Tafsiri kuu imetumia lugha ya kawaida ya Kiswahili huku tanbihi ikihifadhi maana mahsusi ya kukitoa kitu kwa kukiteketeza hadi kutoa moshi; hivyo haiongezi tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Mpangilio wa sentensi unahifadhi mfuatano wa matendo katika Kiebrania, na alama za tanbihi zimewekwa moja kwa moja kwenye maneno yanayohusika.
