base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: sw
  text: Kisha Aroni akakaribia madhabahu, akamchinja ndama wa sadaka ya dhambi kwa ajili yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndama wa sadaka ya utakaso.” Neno la Kiebrania linaweza kutaja sadaka inayohusishwa na kuondoa dhambi na unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: akaukaribia
  rationale: Kitenzi קרב kinaonyesha kusogea karibu na kitu; kiambishi -u- kinaelekeza tendo kwa madhabahu na kutoa Kiswahili cha kawaida.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye heshima katika Kiswahili kwa מזבח katika muktadha wa dhabihu.
- source_word: וַיִּשְׁחַט
  choice: akamchinja
  rationale: שחט humaanisha kuchinja mnyama, hasa katika muktadha wa dhabihu; 'chinja' ni sahihi kuliko neno la jumla 'ua'.
- source_word: עֵגֶל
  choice: ndama
  rationale: עגל humaanisha ng'ombe mchanga au ndama; 'ndama' ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Katika sheria za dhabihu, חטאת hutaja aina ya sadaka inayohusishwa na dhambi; tafsiri hii inatambulika kwa urahisi, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר לוֹ
  choice: aliyekuwa kwa ajili yake mwenyewe
  rationale: Katika muktadha huu, kifungu kinatofautisha sadaka ya Aroni mwenyewe na sadaka za watu; 'kwa ajili yake mwenyewe' huonyesha kazi hiyo bila kuifanya ndama kuwa mali yake tu.
theological_decisions:
- issue: Maana ya חטאת katika muktadha wa dhabihu za kikuhani
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: '''Sadaka ya dhambi'' huhifadhi uhusiano wa wazi wa neno hilo na dhambi na ni istilahi inayoeleweka, lakini ''sadaka ya utakaso'' inaweza kusisitiza kazi ya kuondoa unajisi; uwezekano huo umewekwa katika tanbihi bila kutatua kimabavu mjadala wa maana.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi vinavyofuatana ('akaukaribia ... akamchinja') unafaa kwa simulizi, na istilahi za dhabihu zimewekwa wazi kwa msomaji wa kawaida.
