base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: sw
  text: Musa akasema, “Hili ndilo jambo ambalo Yahweh amewaamuru mlifanye, na utukufu wa Yahweh utaonekana kwenu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “... ili utukufu wa Yahweh uonekane kwenu.”
    reason: Kishazi cha mwisho cha Kiebrania kinaweza kueleweka kama kishazi cha kusudi au matokeo badala ya ahadi iliyoratibiwa.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza tukio; ‘akasema’ ni wa kawaida na wa asili katika simulizi ya Kiswahili.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo jina la kawaida la kibiblia katika Kiswahili.
- source_word: זֶה הַדָּבָר
  choice: Hili ndilo jambo
  rationale: Linadumisha umoja na uzito halisi wa kifungu ‘hili jambo’ huku likisomeka kwa Kiswahili cha kawaida.
- source_word: צִוָּה
  choice: amewaamuru
  rationale: Kitenzi kinaonyesha amri yenye mamlaka; wakati timilifu ‘amewaamuru’ unaakisi tendo lililokwisha kutolewa lenye umuhimu wa sasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi badala ya kubadilishwa na cheo, ili kuhifadhi jina la agano lililo katika matini.
- source_word: תַּעֲשׂוּ
  choice: mlifanye
  rationale: Huhifadhi nafsi ya pili wingi na kukubaliana kwa kawaida na nomino ‘jambo’ katika Kiswahili.
- source_word: וְיֵרָא
  choice: ili ... uwatokee
  rationale: ‘Ili’ huonyesha uwezekano wa maana ya kusudi au matokeo baada ya kutekelezwa kwa amri, bila kuifanya kuwa amri nyingine.
- source_word: אֲלֵיכֶם
  choice: uwatokee
  rationale: Kitenzi ‘kutokea’ pamoja na kiambishi cha watendewa huwasilisha kwa asili wazo la kuonekana kwao au mbele yao.
- source_word: כְּבוֹד יְהוָה
  choice: utukufu wa Yahweh
  rationale: Huhifadhi muundo wa umilikaji na istilahi ya kawaida ya kibiblia ya udhihirisho wa fahari ya Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Nguvu ya kishazi cha mwisho וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה
  choice: 'kusudi/matokeo: ‘ili utukufu wa Yahweh uwatokee’'
  alternative: 'ahadi ya wakati ujao: ‘na utukufu wa Yahweh utawatokea’'
  rationale: Kiebrania kinaweza kuonyesha kusudi au matokeo yanayohusishwa na kutii, lakini pia kinaweza kusomwa kama ahadi inayoratibiwa; tanbihi inalinda uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Wingi wa wanaoambiwa umehifadhiwa katika ‘amewaamuru’, ‘mlifanye’, na ‘uwatokee’.
