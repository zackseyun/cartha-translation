id: LEV.9.3
reference: Leviticus 9:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: sw
  text: Nawe uwaambie wana wa Israeli, ukisema, ‘Chukueni beberu kwa ajili ya sadaka ya dhambi[a], na ndama na mwanakondoo, wote wa mwaka mmoja, wasio na dosari, kwa ajili ya sadaka ya kuteketezwa.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kuwa na maana hiyo katika taratibu za dhabihu.
    reason: Mbadala wa kimsamiati unaohifadhi maana ya utakaso katika matumizi ya kikuhani.
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל תְּדַבֵּר
  choice: Nawe utawaambia wana wa Israeli
  rationale: Muundo huu wa Kiswahili unaunganisha agizo na muktadha uliotangulia, unahifadhi mhusika wa nafsi ya pili umoja, na kuwasilisha kwa kawaida wazo la kusema kwa kundi lililotajwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania wa jina la kundi la agano badala ya kuufanya tu kuwa ‘Waisraeli’; tanbihi inaeleza kuwa usemi huo unalihusu taifa kwa ujumla.
- source_word: קְחוּ
  choice: Chukueni
  rationale: Ni amri ya wingi na ndiyo maana ya moja kwa moja ya kitenzi לקח; ‘Leteni’ ingeongeza wazo la kuelekea mahali fulani ambalo halimo wazi katika kitenzi hiki.
- source_word: שְׂעִיר עִזִּים
  choice: beberu
  rationale: Neno la kawaida la Kiswahili kwa mbuzi dume, likihifadhi bayana jinsia ya mnyama anayehitajika.
- source_word: לְחַטָּאת
  choice: kwa ajili ya sadaka ya dhambi
  rationale: Katika muktadha wa dhabihu, חַטָּאת ni aina ya sadaka, si dhambi kama wazo la jumla pekee. Tafsiri hii inatambulika kwa urahisi, huku maana mbadala ya utakaso ikihifadhiwa katika tanbihi.
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: na ndama na mwanakondoo
  rationale: Hutoa maana za kawaida na mahususi za עֵגֶל na כֶּבֶשׂ bila kuongeza jinsia ambayo haijaelezwa wazi katika maneno hayo.
- source_word: בְּנֵי שָׁנָה
  choice: kila mmoja mwenye umri wa mwaka mmoja
  rationale: Wingi wa kishazi hiki unawahusu ndama na mwanakondoo; ‘kila mmoja’ huonyesha wazi mgawanyo huo kwa Kiswahili cha kawaida.
- source_word: תְּמִימִם
  choice: wasio na dosari
  rationale: Katika sheria za dhabihu neno hili humaanisha kutokuwa na kasoro ya mwili inayomzuia mnyama kukubalika.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: Hili ni jina linaloeleweka la aina ya dhabihu ambayo huteketezwa; linatanguliza maana ya matumizi ya kikuhani kuliko etimolojia ya ‘kupanda’.
theological_decisions:
- issue: Maana ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Tafsiri kuu huhifadhi umbo la chanzo. Kwa kuwa katika muktadha huu ni jina la pamoja la taifa, tanbihi huzuia kueleweka kana kwamba wanaume pekee ndio waliokusudiwa.
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno hilo hutaja kundi maalumu la dhabihu na linaweza kusisitiza pia utakaso katika maandiko ya kikuhani. ‘Sadaka ya dhambi’ ni wazi na inayotambulika, huku mbadala halali ukitajwa katika tanbihi bila kuondoa mvutano wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo ni wa moja kwa moja na unaofaa sheria za ibada; ‘beberu,’ ‘ndama,’ ‘mwanakondoo,’ ‘dosari,’ na ‘sadaka ya kuteketezwa’ ni maneno yanayoeleweka bila kuwa ya kimadhehebu.
