base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: sw
  text: Kisha Aroni akainua mikono yake kuwaelekea watu, akawabariki[a]. Halafu akateremka baada ya kutoa sadaka ya dhambi[b], sadaka ya kuteketezwa, na dhabihu za amani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkono wake.” Umbo la Kiebrania ni umoja, ingawa ishara hii ya kubariki kwa kawaida hueleweka kuwa ya kuinua mikono yote miwili.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka ya utakaso.”
    reason: lexical_alternative
  - marker: c
    text: Au, “dhabihu za ushirika” au “dhabihu za hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: akainua
  rationale: Kitenzi נשׂא pamoja na ‘mkono’ humaanisha kuinua; ‘akainua’ ni cha kawaida na kinahifadhi tendo la kimwili lililotangulia baraka.
- source_word: יָדוֹ
  choice: mikono yake
  rationale: Umbo la Kiebrania ni umoja, ‘mkono wake,’ lakini katika ishara ya kikuhani ya kubariki linaeleweka kwa kawaida kuwa linahusu mikono yote miwili. Tofauti ya kisarufi imehifadhiwa katika tanbihi.
- source_word: אֶל הָעָם
  choice: kuwaelekea watu
  rationale: אֶל huonyesha mwelekeo. ‘Kuwaelekea watu’ huwasilisha wazi mwelekeo wa mikono ya Aroni bila kudokeza kwamba aliwagusa.
- source_word: וַיְבָרְכֵם
  choice: akawabariki
  rationale: ברך katika piel humaanisha kubariki. Kitenzi hiki ni cha moja kwa moja, cha heshima, na cha kawaida katika Kiswahili.
- source_word: וַיֵּרֶד
  choice: akateremka
  rationale: ירד humaanisha kushuka au kuteremka. ‘Akateremka’ hudumisha tendo la kutoka mahali palipoinuka, yaelekea eneo la madhabahu.
- source_word: מֵעֲשֹׂת
  choice: baada ya kutoa
  rationale: Muundo huu unaonyesha kwamba aliteremka baada ya kukamilisha tendo la dhabihu. Katika Kiswahili, ‘baada ya kutoa’ ni ya asili kuliko tafsiri ya neno kwa neno ‘kutoka kufanya.’
- source_word: הַחַטָּאת
  choice: sadaka ya dhambi
  rationale: Hili ni jina la kiufundi la dhabihu katika Mambo ya Walawi. ‘Sadaka ya dhambi’ ni istilahi inayotambulika, huku ‘sadaka ya utakaso’ ikihifadhiwa kama uwezekano katika tanbihi.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: עלה ni dhabihu iliyoteketezwa juu ya madhabahu; ‘sadaka ya kuteketezwa’ ni istilahi ya kawaida na wazi katika Kiswahili cha Biblia.
- source_word: הַשְּׁלָמִים
  choice: dhabihu za amani
  rationale: שׁלמים ni istilahi ya kiibada yenye wingi. ‘Dhabihu za amani’ hudumisha jina linalotambulika, huku maana zinazohusiana na ushirika na hali njema zikielezwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa istilahi za dhabihu
  choice: Kutumia ‘sadaka ya dhambi,’ ‘sadaka ya kuteketezwa,’ na ‘dhabihu za amani’ katika andiko kuu.
  alternative: ‘Sadaka ya utakaso,’ ‘sadaka ya kuteketezwa kabisa,’ na ‘dhabihu za ushirika’ au ‘dhabihu za hali njema.’
  rationale: Istilahi kuu zinatambulika kwa urahisi na kudumisha uthabiti katika Mambo ya Walawi. Tanbihi zinahifadhi maana mbadala zinazosisitiza kazi au upeo wa kila aina ya dhabihu bila kulazimisha ufafanuzi mmoja.
- issue: Umoja wa ‘mkono wake’ katika Kiebrania
  choice: Kutumia ‘mikono yake’ katika andiko kuu kama ishara ya kawaida ya kubariki.
  alternative: ‘Mkono wake.’
  rationale: Kiebrania kina umoja, lakini usemi huo unaweza kueleweka kwa maana ya pamoja katika tendo la kuinua mikono wakati wa kubariki. Tanbihi inahifadhi umbo halisi na hivyo kuepuka kuficha utata wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kueleweka kwa msomaji wa kawaida, huku istilahi za kiibada zikidumishwa kwa uthabiti. ‘Halafu’ hutenganisha kwa kawaida baraka na kuteremka, bila kuondoa mfuatano wa simulizi wa Kiebrania.
