base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: sw
  text: Musa na Haruni wakaingia katika hema ya kukutania; walipotoka, wakawabariki watu. Kisha utukufu wa Yahweh ukawatokea watu wote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Ni istilahi ya kawaida na inayoeleweka kwa mahali pa ibada ambako Yahweh alikutana na watu wake, bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: wakaingia ... walipotoka
  rationale: Inawasilisha mwendo wa kuingia na kutoka kwa Kiswahili cha kawaida; kiima kilichounganishwa, Musa na Haruni, na kitenzi cha wingi kinachofuata vinaonyesha kuwa wote wawili walihusika.
- source_word: וַיְבָרֲכוּ
  choice: wakawabariki
  rationale: Tafsiri ya moja kwa moja inayohifadhi kitendo cha kuwabariki bila kubainisha isivyohitajika namna ya baraka.
- source_word: הָעָם / כָּל הָעָם
  choice: watu / watu wote
  rationale: Hurejelea jumuiya iliyokusanyika; 'watu' ni neno la kawaida, pana, na linalofaa katika muktadha.
- source_word: כְבוֹד יְהוָה
  choice: utukufu wa Yahweh
  rationale: ‘Utukufu’ huhifadhi maana ya כָּבוֹד kama udhihirisho wenye uzito wa uwepo wa Mungu, na jina la agano יְהוָה linatolewa kama ‘Yahweh.’
- source_word: וַיֵּרָא
  choice: ukawatokea
  rationale: Umbo la Niphal linaonyesha udhihirisho ulioonekana; 'ukawatokea' ni la asili katika Kiswahili na linadumisha wazo la kuonekana kwa watu.
- source_word: אֶל כָּל הָעָם
  choice: watu wote
  rationale: Kiambishi cha mtendewa katika 'ukawatokea' kinawasilisha kwa kawaida maana ya udhihirisho kuelekea watu wote bila kuongeza maelezo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni, jina la agano; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya mfuatano wa vifungu
  choice: walipotoka ... Kisha
  alternative: wakatoka, wakawabariki ... na
  rationale: Mfuatano wa wayyiqtol unaonyesha maendeleo ya simulizi. 'Walipotoka' na 'Kisha' huufanya mfuatano huo uwe wazi katika Kiswahili cha kisasa bila kudai uhusiano wa kisababishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi mfuatano wa matendo, istilahi ya ibada, na udhihirisho wa utukufu wa Mungu.
