source:
  edition: WLC
  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: sw
  text: Aroni alitikisa vifua na paja la kulia kuwa sadaka ya kutikiswa mbele za Yahweh, kama Musa alivyoamuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: vifua
  rationale: Katika muktadha wa dhabihu, חָזֶה humaanisha sehemu ya kifua ya mnyama. Wingi umetunzwa kwa “vifua,” kwa kuwa sehemu hizi zilitoka kwa wanyama waliotolewa.
- source_word: שׁוֹק הַיָּמִין
  choice: paja la kulia
  rationale: שׁוֹק hutaja sehemu ya mguu au paja; “paja” ni neno la kawaida na linaloeleweka katika maelezo ya sehemu ya dhabihu, huku הַיָּמִין ikitafsiriwa moja kwa moja kuwa “la kulia.”
- source_word: הֵנִיף
  choice: alitikisa
  rationale: Hifili ya נוּף katika ibada za kikuhani hueleza tendo maalumu la kutikisa au kuwasilisha sehemu ya dhabihu mbele za Mungu. “Alitikisa” linahifadhi tendo hilo bila kulifafanua kupita kiasi.
- source_word: תְּנוּפָה
  choice: kuwa sadaka ya kutikiswa
  rationale: תְּנוּפָה ni istilahi ya kiibada kwa sadaka inayowasilishwa kwa kutikiswa. Tafsiri hii ni wazi kwa msomaji wa sasa na inahifadhi uhusiano wa neno hilo na kitenzi kilichotangulia.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי humaanisha “mbele ya/katika uwepo wa,” na “mbele za” ni usemi wa Kiswahili unaofaa katika muktadha huu. Jina la agano יְהוָה limetolewa kama “Yahweh.”
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: kama Musa alivyoamuru
  rationale: Kifungu hiki kinaonyesha kuwa tendo la Aroni lilifuata agizo la Musa. Kiswahili hiki ni cha asili na hakiongezi yule aliyeamriwa, ambaye hajatajwa wazi katika kifungu hiki.
- source_word: וְאֵת ... וְאֵת
  choice: vifua na paja la kulia
  rationale: Viashiria vya yambwa vinavyorudiwa vinaunganisha vitu viwili. Kiswahili cha kawaida huhitaji tu kiunganishi “na.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu יְהוָה. “Yahweh” linahifadhi jina hilo la agano badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Vifua” limetumiwa badala ya “matiti,” kwa kuwa muktadha unahusu sehemu za kifua za wanyama wa dhabihu; “sadaka ya kutikiswa” linadumisha istilahi ya kiibada kwa uwazi.
