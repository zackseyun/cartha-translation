id: LEV.9.4
reference: Leviticus 9:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: sw
  text: na ng’ombe na kondoo dume kwa ajili ya dhabihu za amani[a], ili kuzitoa mbele za Yahwe, pamoja na sadaka ya nafaka iliyochanganywa na mafuta; kwa maana leo Yahwe atawatokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu za ushirika” au “dhabihu za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: fahali
  rationale: Neno hili humaanisha mnyama wa jamii ya ng’ombe; katika muktadha wa dhabihu, “fahali” ni chaguo la kawaida na linaloeleweka, ingawa umbo hili pekee halisisitizi jinsia kwa uwazi kabisa.
- source_word: אַיִל
  choice: kondoo dume
  rationale: Neno hili humaanisha kondoo wa kiume, yaani ram; “kondoo dume” ni Kiswahili sanifu na sahihi.
- source_word: שְׁלָמִים
  choice: dhabihu za amani
  rationale: Hili ni jina la dhabihu zinazohusishwa na amani, ustawi na ushirika; “dhabihu za amani” huhifadhi istilahi ya kidini iliyozoeleka huku tanbihi ikionyesha maana nyingine zinazowezekana.
- source_word: לִזְבֹּחַ
  choice: ili kuzitoa dhabihu
  rationale: Kitenzi kinaeleza kuchinja au kutoa kwa ibada ya dhabihu. Kauli hii inaonyesha kusudi na maana ya kiibada bila kuifanya kuwa uchinjaji wa kawaida tu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: “Mbele za” ni usemi wa asili wa Kiswahili unaobeba maana ya kuwa mbele au katika uwepo wa Mungu; jina la agano יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika sheria za Walawi, neno hili hutaja sadaka iliyotayarishwa kwa mazao ya nafaka, si sadaka kwa maana pana tu.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: iliyochanganywa na mafuta
  rationale: Hii inaeleza namna sadaka ya nafaka ilivyotayarishwa; usemi huo ni wa sasa, wazi na wa kawaida katika Kiswahili.
- source_word: כִּי הַיּוֹם
  choice: kwa maana leo
  rationale: כִּי hapa inaleta sababu ya maagizo hayo, na הַיּוֹם inasisitiza kuwa tukio hilo linatarajiwa siku hiyo.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: atawatokea
  rationale: Ingawa kitenzi ni umbo timilifu la Niphal, muktadha unakipa maana ya tukio lililo karibu kutokea. “Atawatokea” huonyesha kujidhihirisha kwa Yahwe kwa kundi linalozungumziwa.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kauli ya kujidhihirisha kwa Mungu
  choice: Yahwe atawatokea
  alternative: utukufu wa Yahwe utawatokea; Yahwe amewatokea
  rationale: Aya hii inamtaja Yahwe mwenyewe, si “utukufu wa Yahwe,” na muktadha unaelekeza kwenye kujidhihirisha kunakotarajiwa baadaye siku hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza orodha kutoka aya iliyotangulia. Jina “Yahwe” limetumiwa moja kwa moja; tanbihi ya Kiingereza yenye alama [b] haikuhamishwa kwa sababu maelezo yake yalikinzana na mahali pa alama na hayakueleza kirai cha mafuta. Alama zote zilizotumika katika rasimu zina tanbihi inayolingana.
