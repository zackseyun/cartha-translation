reference: Leviticus 9:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: sw
  text: Musa akamwambia Haruni, “Karibia madhabahu, utoe sadaka yako ya dhambi[a] na sadaka yako ya kuteketezwa, na ufanye upatanisho kwa ajili yako mwenyewe na kwa ajili ya watu. Kisha utoe sadaka ya watu na ufanye upatanisho kwa ajili yao, kama Yahwe alivyoamuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka yako ya utakaso.” Neno la Kiebrania חַטָּאת linaweza kumaanisha sadaka ya dhambi, huku katika baadhi ya miktadha likisisitiza utakaso kutokana na unajisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב
  choice: Karibia
  rationale: Amri hii inamtaka Haruni aende karibu na madhabahu; ‘Karibia’ ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali pa kutolea dhabihu, na uhusiano wa uamilifu unaonyesha madhabahu mahususi.
- source_word: וַעֲשֵׂה
  choice: utoe
  rationale: Ingawa kitenzi kwa msingi humaanisha ‘fanya,’ kinapotumiwa pamoja na sadaka humaanisha kutekeleza tendo la kuitoa.
- source_word: חַטָּאתְךָ
  choice: sadaka yako ya dhambi
  rationale: Katika sheria za dhabihu, neno hili hutaja sadaka inayohusiana na dhambi au unajisi. Tafsiri iliyozoeleka imewekwa katika matini, huku maana ya utakaso ikihifadhiwa katika tanbihi.
- source_word: עֹלָתֶךָ
  choice: sadaka yako ya kuteketezwa
  rationale: Neno hili humaanisha sadaka inayoteketezwa yote; tafsiri hii ni wazi na imezoeleka katika Kiswahili cha Biblia.
- source_word: וְכַפֵּר
  choice: ufanye upatanisho
  rationale: Huhifadhi uzito wa ibada na teolojia wa kitenzi bila kulazimisha nadharia moja maalumu kuhusu namna upatanisho unavyofanya kazi.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: kwa ajili yako mwenyewe na kwa ajili ya watu
  rationale: Kirai ‘kwa ajili ya’ kinaonyesha kuwa tendo linafanywa kwa manufaa au kwa niaba ya Haruni na watu.
- source_word: קָרְבַּן הָעָם
  choice: sadaka ya watu
  rationale: 'Huhifadhi uhusiano wa umilikaji au uwakilishi: sadaka inayohusu au iliyoletwa na watu.'
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: kama Yahwe alivyoamuru
  rationale: ‘Kama ... alivyoamuru’ huonyesha kufuata agizo la Mungu, na ‘Yahwe’ huhifadhi jina la Mungu lililo katika matini ya Kiebrania.
theological_decisions:
- issue: Maana ya חַטָּאת katika muktadha wa dhabihu
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Neno linaweza kusisitiza dhambi au utakaso unaotokana na ibada. Matini kuu inatumia tafsiri iliyozoeleka, na tanbihi inahifadhi uwezekano mwingine wa kimsamiati.
- issue: Maana ya כפר
  choice: kufanya upatanisho
  alternative: kuondoa unajisi
  rationale: ‘Kufanya upatanisho’ ni pana vya kutosha kubeba vipengele vya ibada, utakaso na kurejeshwa kwa uhusiano bila kuingiza fundisho jembamba lisilotajwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa maagizo umewekwa wazi, huku istilahi za ibada ‘madhabahu,’ ‘sadaka ya kuteketezwa,’ na ‘upatanisho’ zikihifadhiwa.
