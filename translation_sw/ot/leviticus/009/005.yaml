source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: sw
  text: Basi wakaleta yale ambayo Musa alikuwa ameagiza mbele ya hema la kukutania; kusanyiko lote likakaribia na likasimama mbele ya Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakaleta
  rationale: Ingawa לָקַח kwa kawaida humaanisha ‘chukua,’ muktadha unaonyesha vitu vikipelekwa mahali palipotajwa; ‘wakaleta’ ni Kiswahili cha kawaida kinachoonyesha mwelekeo huo.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: vile Musa alivyokuwa ameamuru
  rationale: Kirai hiki kinarejelea vitu vilivyoagizwa katika mistari iliyotangulia. ‘Vile ... alivyokuwa ameamuru’ kinaeleweka kwa kawaida huku kikihifadhi marejeo hayo.
- source_word: אֶל־פְּנֵי
  choice: mbele ya
  rationale: Hapa ni usemi wa mahali unaoelekeza upande wa mbele wa hema, tofauti na usemi unaofuata kuhusu kusimama mbele za Yahweh.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Tafsiri hii ya moja kwa moja na iliyozoeleka huhifadhi maana ya hema lililowekwa kwa ajili ya kukutana.
- source_word: וַיִּקְרְבוּ
  choice: likakaribia
  rationale: Kitenzi קָרַב kinaonyesha kusogea karibu; ‘likakaribia’ ni cha asili na kinafaa kwa nomino ya umoja ya kijamii ‘kusanyiko.’
- source_word: כָּל־הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה hapa ni jumuiya ya Israeli iliyokusanyika. ‘Kusanyiko lote’ ni wazi na linafaa katika mazingira ya ibada.
- source_word: וַיַּעַמְדוּ
  choice: kusimama
  rationale: Kitenzi עָמַד kina maana ya moja kwa moja ya kusimama; muundo huu unaunganishwa kwa kawaida na ‘likakaribia.’
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: ‘Mbele za’ huhifadhi maana ya mahali na ya kuwa katika uwepo wa Mungu, huku jina la agano יְהוָה likitolewa kama ‘Yahweh.’
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni יְהוָה. ‘Yahweh’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hema la kukutania’ na ‘kusanyiko lote’ ni maneno yanayoeleweka kwa wasomaji wa kawaida na yanaendeleza mazingira ya kiibada bila lugha nzito isiyo ya lazima.
