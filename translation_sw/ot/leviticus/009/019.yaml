  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: sw
  text: 'na sehemu zenye mafuta kutoka kwa ng’ombe dume[a] na kwa kondoo dume: mkia wenye mafuta, mafuta yanayofunika viungo vya ndani, figo, na sehemu ya ini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ng’ombe.” Neno la Kiebrania שׁוֹר linaweza kurejelea ng’ombe dume au, kwa mapana zaidi, mnyama wa jamii ya ng’ombe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: na sehemu za mafuta
  rationale: Wingi חֲלָבִים katika muktadha wa dhabihu unamaanisha sehemu maalumu zenye mafuta zilizotengwa kwa ajili ya kutolewa, si mafuta kwa ujumla.
- source_word: מִן הַשּׁוֹר
  choice: kutoka kwa ng’ombe dume
  rationale: שׁוֹר huweza kumaanisha mnyama wa jamii ya ng’ombe, na hapa muktadha wa dhabihu unaunga mkono tafsiri ya ng’ombe dume bila kudokeza lazima kuwa amehasiwa.
- source_word: וּמִן הָאַיִל
  choice: na kutoka kwa kondoo dume
  rationale: אַיִל ni kondoo dume katika muktadha huu wa dhabihu.
- source_word: הָאַלְיָה
  choice: mkia wenye mafuta
  rationale: Neno hili hurejelea mkia mnene wenye mafuta wa kondoo; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: וְהַמְכַסֶּה
  choice: mafuta yanayofunika viungo vya ndani
  rationale: Nomino hii inatokana na wazo la kufunika na katika orodha ya sehemu za dhabihu hurejelea mafuta yanayofunika viungo vya ndani.
- source_word: וְהַכְּלָיֹת
  choice: figo
  rationale: Hili ndilo neno la kawaida la anatomia na linafaa katika orodha hii.
- source_word: וְיֹתֶרֶת הַכָּבֵד
  choice: na sehemu ya ini
  rationale: יֹתֶרֶת הַכָּבֵד hurejelea sehemu au kiambatisho maalumu cha ini; ‘sehemu ya ini’ ni wazi kwa msomaji wa kawaida bila kutoa uhakika wa anatomia usio katika neno lenyewe.
