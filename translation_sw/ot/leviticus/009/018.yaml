review_pass:
  verdict: revise
  source_fidelity: The animal terms, the offering’s relation to the people, Aaron’s sons bringing the blood, and the blood rite are substantially faithful to the Hebrew. However, the relative clause "ambao walikuwa dhabihu" makes the two animals themselves the grammatical subject of a singular sacrifice in an awkward way, whereas the Hebrew apposition identifies the slaughter as the peace-offering sacrifice.
  naturalness: The current sentence is understandable, but "ng’ombe na kondoo dume, ambao walikuwa dhabihu ya sadaka" is less idiomatic and somewhat cumbersome in standard East African Swahili. Recasting the apposition as a purpose/function phrase is clearer while retaining the source sense.
  terminology: '"kondoo dume," "madhabahu," and "sadaka za amani" are appropriate. The footnote responsibly retains the lexical breadth of שְׁלָמִים. "Akainyunyiza" is established sacrificial-register Swahili for the blood application and is retained.'
  issues:
  - severity: medium
    issue: Awkward and potentially misleading apposition
    rationale: The phrase "ng’ombe na kondoo dume, ambao walikuwa dhabihu ya sadaka za amani" grammatically describes the two animals as though they themselves were a singular "dhabihu." Hebrew זֶבַח הַשְּׁלָמִים is an appositional designation of the sacrificial action/offering. A recast avoids this difficulty without adding interpretation.
  revised_text: Kisha akamchinja ng’ombe na kondoo dume kwa ajili ya dhabihu ya sadaka za amani[a] kwa ajili ya watu. Wana wa Haruni wakamletea damu, naye akainyunyiza kwenye madhabahu pande zote.
  revised_footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za hali njema.” Neno la Kiebrania שְׁלָמִים linahusishwa na amani, ukamilifu, hali njema na ushirika.
    reason: lexical_alternative
  revision_rationale: The revised first clause expresses naturally that the ox and ram were slaughtered for the people’s peace-offering sacrifice, preserving the Hebrew apposition and avoiding the strained plural relative clause. No doctrinal interpretation has been introduced; the existing lexical footnote is retained unchanged.
