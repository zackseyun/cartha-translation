  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: sw
  text: Kisha akamchinja ng’ombe na kondoo dume kwa ajili ya dhabihu ya sadaka za amani[a] kwa ajili ya watu. Wana wa Haruni wakamletea damu, naye akainyunyiza kwenye madhabahu pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za hali njema.” Neno la Kiebrania שְׁלָמִים linahusishwa na amani, ukamilifu, hali njema na ushirika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Kisha akamchinja
  rationale: Kitenzi “chinja” ndicho neno la kawaida na mahususi kwa kuchinja mnyama wa dhabihu; “kisha” linaendeleza mfuatano wa simulizi unaoonyeshwa na waw-consecutive.
- source_word: הַשּׁוֹר
  choice: ng’ombe
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe; “ng’ombe” ni tafsiri ya kawaida isiyoongeza umahususi usiolazimishwa na neno lenyewe.
- source_word: הָאַיִל
  choice: kondoo dume
  rationale: אַיִל humaanisha kondoo dume kwa mahususi.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: dhabihu ya sadaka za amani
  rationale: Tafsiri hii inadumisha muundo wa Kiebrania na uhusiano wa שְׁלָמִים na amani, ukamilifu, hali njema na ushirika; tanbihi inahifadhi uwezekano mpana wa maana.
- source_word: אֲשֶׁר לָעָם
  choice: kwa ajili ya watu
  rationale: Kirai hiki kinaonyesha kwamba dhabihu hiyo ilitolewa kwa niaba au manufaa ya watu.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: wakamletea
  rationale: Katika utaratibu wa dhabihu, kitenzi hiki kina maana ya kuleta au kukabidhi kitu kwa mhudumu; kiambishi “-m-” kinamrejelea Haruni kutokana na muktadha.
- source_word: וַיִּזְרְקֵהוּ
  choice: akainyunyiza
  rationale: Katika muktadha wa ibada, זָרַק hueleza kuitupa au kuirusha damu kwenye madhabahu; “nyunyiza” ni neno la kawaida la Kiswahili katika sajili ya dhabihu, bila kudokeza kwamba damu ilipakwa.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: kwenye madhabahu pande zote
  rationale: Tafsiri hii inaonyesha damu ikiwekwa kwenye madhabahu kuizunguka, kwa lugha ya kawaida na iliyo wazi.
theological_decisions:
- issue: Maana pana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za hali njema
  rationale: “Amani” huhifadhi uhusiano wa kileksia na שׁלום, lakini tanbihi inaonyesha kwamba neno hilo pia linaweza kusisitiza ushirika, ukamilifu au hali njema bila kuamua maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Madhabahu,” “dhabihu,” na “sadaka” zimetumiwa kwa kuwa ni istilahi za kawaida katika muktadha wa ibada. Alama ya tanbihi [a] imo katika matini kuu.
