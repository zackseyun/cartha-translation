  to: Kisha akamchinja ng’ombe na kondoo dume kwa ajili ya dhabihu ya sadaka za amani[a] kwa ajili ya watu. Wana wa Haruni wakamletea damu, naye akainyunyiza kwenye madhabahu pande zote.
  rationale: The revised first clause expresses naturally that the ox and ram were slaughtered for the people’s peace-offering sacrifice, preserving the Hebrew apposition and avoiding the strained plural relative clause. No doctrinal interpretation has been introduced; the existing lexical footnote is retained unchanged.
