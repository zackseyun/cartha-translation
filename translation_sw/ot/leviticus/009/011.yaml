  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: sw
  text: Lakini nyama na ngozi akaziteketeza kwa moto nje ya kambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nayo nyama na ngozi akazichoma motoni nje ya kambi.”
    reason: Toleo hili linaonyesha uwezekano wa kutafsiri וְ kama “Nayo,” שָׂרַף kama “akazichoma,” na בָּאֵשׁ kama “motoni.”
lexical_decisions:
- source_word: וְ/אֶת
  choice: Lakini
  rationale: Kiunganishi וְ kinaendeleza simulizi, lakini hapa pia kinaonyesha tofauti kati ya sehemu zilizoteketezwa madhabahuni katika mstari uliotangulia na nyama pamoja na ngozi zilizoteketezwa nje ya kambi. אֵת ni alama ya yambwa na haitafsiriwi moja kwa moja.
- source_word: הַ/בָּשָׂר
  choice: nyama
  rationale: בָּשָׂר humaanisha nyama au mwili wenye nyama. Katika muktadha wa mnyama wa dhabihu, “nyama” ni neno la kawaida, wazi, na sahihi kwa Kiswahili.
- source_word: הָ/עוֹר
  choice: ngozi
  rationale: עוֹר ni ngozi ya mnyama. “Ngozi” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: שָׂרַף
  choice: akaziteketeza
  rationale: Kitenzi hiki humaanisha kuchoma au kuteketeza. “Akaziteketeza” linaonyesha tendo la kuharibu vitu hivyo kwa moto na linaendeleza mtiririko wa matendo ya simulizi.
- source_word: בָּ/אֵשׁ
  choice: kwa moto
  rationale: Kirai hiki kinaonyesha njia iliyotumiwa kuteketeza nyama na ngozi. “Kwa moto” ni Kiswahili cha kawaida na kinafuata maana ya maandishi bila kuongeza wazo jingine.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: nje ya kambi
  rationale: Kirai hiki kinataja mahali palipo nje ya eneo la kambi ya Israeli. “Nje ya kambi” ni cha kawaida na kinahifadhi umuhimu wa eneo katika utaratibu wa dhabihu.
theological_decisions:
- issue: Lugha ya kuondoa mabaki katika utaratibu wa dhabihu
  choice: Kueleza moja kwa moja kwamba nyama na ngozi ziliteketezwa nje ya kambi.
  alternative: Kutumia lugha inayosisitiza mapema uhusiano wa kitipolojia au maana ya baadaye ya kitheolojia.
  rationale: Mstari huu unaeleza utaratibu wa kikuhani. Tafsiri haipaswi kuingiza ishara au ufafanuzi wa kitheolojia ambao haujaelezwa katika maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Akaziteketeza” linadumisha mtiririko wa kisimulizi na kutofautisha tendo hili na utoaji wa dhabihu madhabahuni.
