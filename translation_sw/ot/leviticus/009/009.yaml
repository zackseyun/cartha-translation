id: LEV.9.9
reference: Leviticus 9:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: sw
  text: Wana wa Aroni wakamletea damu[a]. Naye akachovya kidole chake katika damu, akaitia juu ya pembe za madhabahu[b], kisha akaimimina damu kwenye msingi wa madhabahu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaiwasilisha damu kwake”; kitenzi cha Kiebrania kinaweza kumaanisha kuleta karibu au kuwasilisha katika mazingira ya ibada.
    reason: lexical_alternative
  - marker: b
    text: “Pembe za madhabahu” ni sehemu zilizochomoza kwenye pembe zake.
    reason: cultural_note
  - marker: c
    text: Au “kwenye sehemu ya chini ya madhabahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: wakamletea
  rationale: Hifili ya קרב hapa ni kuleta karibu au kuwasilisha katika tendo la ibada. “Wakamletea” ni ya kawaida katika Kiswahili na inaonyesha kwamba damu ililetwa kwa Aroni.
- source_word: בְּנֵי אַהֲרֹן
  choice: Wana wa Aroni
  rationale: Huhifadhi uhusiano wa kifamilia na utambulisho wa wanaosaidia katika huduma ya ukuhani kwa lugha yenye staha.
- source_word: הַדָּם
  choice: damu
  rationale: Ni damu maalumu ya dhabihu iliyotajwa katika muktadha; umakhsusi wake unaeleweka bila kibainishi tofauti katika Kiswahili.
- source_word: אֵלָיו
  choice: -m- katika “wakamletea”
  rationale: Kiwakilishi cha nafsi ya tatu umoja kimejumuishwa katika kitenzi cha Kiswahili na kwa kawaida kinamrejelea Aroni.
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  choice: akachovya kidole chake
  rationale: “Kuchovya” hueleza kwa asili kuweka kidole ndani ya damu kwa muda, bila kudokeza kuzamisha mwili mzima.
- source_word: וַיִּתֵּן עַל
  choice: akaitia juu ya
  rationale: Hueleza kupaka au kuweka damu katika sehemu iliyokusudiwa huku ikibaki karibu na muundo wa Kiebrania.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: pembe za madhabahu
  rationale: Huhifadhi istilahi halisi ya kiibada inayotaja sehemu zilizochomoza kwenye pembe za madhabahu.
- source_word: יָצַק
  choice: akaimimina
  rationale: Kitenzi hiki cha Kiswahili kinafaa kwa kumwaga kimakusudi kitu cha majimaji.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: kwenye msingi wa madhabahu
  rationale: “Msingi” huhifadhi maana ya יְסוֹד, na “kwenye” huwasilisha kwa kawaida mahali damu ilikomiminwa.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi אֵלָיו
  choice: Kiwakilishi kinamrejelea Aroni.
  alternative: Kinaweza kudhaniwa kurejelea madhabahu au kirejelewa kingine kilichodokezwa.
  rationale: Muktadha wa karibu unamwonyesha Aroni akifanya ibada huku wanawe wakimsaidia; kwa hiyo Aroni ndiye kirejelewa cha kawaida zaidi. Jina lake halijaongezwa katika matini ili kuhifadhi kiwakilishi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia na lugha ya sasa yenye staha. Viunganishi vya mfululizo wa matendo vimewekwa wazi, na istilahi za kiibada “damu,” “pembe,” na “madhabahu” zimehifadhiwa.
