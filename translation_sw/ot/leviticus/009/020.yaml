translation:
  language: sw
  text: Wakaweka vipande vya mafuta juu ya vile vifua, naye akaviteketeza[a] juu ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana halisi zaidi, “akavigeuza vipande vya mafuta kuwa moshi juu ya madhabahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Wakaweka
  rationale: Kitenzi שׂים humaanisha kuweka; “wakaweka” ni Kiswahili cha kawaida na huhifadhi mtendaji wa wingi katika Kiebrania.
- source_word: הַחֲלָבִים
  choice: vipande vya mafuta
  rationale: Katika muktadha wa dhabihu, wingi huu unarejelea sehemu za mafuta zilizotengwa kwa ajili ya kuteketezwa; “vipande vya mafuta” huonyesha kwa uwazi kwamba ni mafungu maalumu, si mafuta kama kitu kisichohesabika tu.
- source_word: עַל הֶחָזוֹת
  choice: juu ya vipande vya vidari
  rationale: חָזֶה hapa ni sehemu ya kidari ya mnyama inayotumika katika taratibu za dhabihu. “Vipande vya vidari” hufanya maana ya kiibada na wingi wa Kiebrania kuwa wazi katika Kiswahili.
- source_word: וַיַּקְטֵר
  choice: akaviteketeza
  rationale: Katika maandiko ya kikuhani, קטר ni kuchoma sadaka madhabahuni hadi moshi upande. “Akaviteketeza” ni ya asili katika Kiswahili cha ibada na huacha ufafanuzi halisi zaidi katika tanbihi.
- source_word: הַמִּזְבֵּחָה
  choice: juu ya madhabahu
  rationale: Ingawa umbo la Kiebrania lina kiishio cha kuelekea mahali, pamoja na קטר usemi huu humaanisha mahali sadaka ilipoteketezwa; “juu ya madhabahu” ndiyo tafsiri ya kawaida na sahihi kimuktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Kiunganishi “naye” kinaonyesha badiliko la mtendaji kutoka wingi (“wakaweka”) kwenda umoja (“akaviteketeza”) bila kumtaja kwa namna ambayo Kiebrania hakufanyi katika mstari huu.
