base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: sw
  text: Kuhani atachunguza sehemu iliyoathirika siku ya saba. Ikiwa upele wenye magamba[a] haujaenea, hakuna nywele za manjano ndani yake, na hauonekani kuzama chini ya ngozi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upele wa magamba.” Neno la Kiebrania נֶתֶק humaanisha aina mahsusi ya upele wenye magamba, inayohusishwa katika sehemu hii na ngozi ya kichwa au kidevu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: ataichunguza
  rationale: Katika sheria za uchunguzi wa kikuhani, kitenzi hiki humaanisha kuchunguza kwa makini, si kuona tu.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na linalofaa kwa mhusika aliyepewa mamlaka ya kufanya uchunguzi katika Mambo ya Walawi.
- source_word: הַנֶּגַע
  choice: sehemu iliyoathirika
  rationale: Neno hili ni pana na huelekeza kwenye eneo lililoathiriwa; tafsiri hii huepuka kulitambulisha moja kwa moja na ugonjwa fulani wa kisasa.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Huhifadhi moja kwa moja wakati uliowekwa wa uchunguzi wa pili.
- source_word: וְהִנֵּה
  choice: ikiwa
  rationale: Katika mfuatano huu wa masharti ya uchunguzi, Kiswahili cha asili hutumia 'ikiwa' kuanzisha mambo yaliyobainika; maana ya kuzingatia matokeo ya uchunguzi inabaki wazi bila kutumia 'tazama' kwa namna isiyo ya kawaida hapa.
- source_word: לֹא פָשָׂה
  choice: haujaenea
  rationale: Katika muktadha wa maambukizi au vidonda vya ngozi, kitenzi hiki hueleza kuenea katika eneo jingine.
- source_word: הַנֶּתֶק
  choice: upele wenye magamba
  rationale: Neno hili hurejelea tatizo maalumu la ngozi ya kichwa au kidevu katika kifungu hiki. Tafsiri hii ni ya kueleweka na huepuka kulilinganisha kwa uhakika na utambuzi wa kitabibu wa kisasa.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: hakuna unywele wa manjano ndani yake
  rationale: Huhifadhi kutokuwapo kwa dalili hiyo pamoja na maana ya mahali inayotolewa na 'ndani yake'.
- source_word: שֵׂעָר צָהֹב
  choice: unywele wa manjano
  rationale: Umoja wa 'unywele' unaendana na nomino ya Kiebrania na 'manjano' hutoa rangi iliyoelezwa bila kuibadili kuwa ya dhahabu.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: na upele huo hauonekani kuwa na kina kuliko ngozi
  rationale: Neno 'hauonekani' linahifadhi kipengele cha mwonekano katika מַרְאֵה na halidai kwamba kina cha kidonda kilipimwa kwa njia ya kisasa.
