  - severity: low
    issue: “Hakuna unywele wa manjano”
    rationale: Ingawa umoja unaweza kuakisi nomino ya Kiebrania, “nywele za manjano” ni ya asili zaidi katika Kiswahili kwa nywele kama dalili inayoonekana.
  - severity: low
    issue: Tanbihi hutaja “upele wa kichwani au kidevuni” kama mbadala
    rationale: Hii inaweza kudokeza kwamba istilahi yenyewe ni mahali pa upele. Ni sahihi zaidi kusema kwamba ni aina mahsusi ya upele wenye magamba inayohusishwa na maeneo hayo.
