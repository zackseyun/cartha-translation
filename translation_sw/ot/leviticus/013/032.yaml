translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini cha kawaida na kinachoeleweka. Muundo wa masharti umetumiwa kwa sababu sentensi inaendelea katika mstari unaofuata. Alama ya tanbihi imewekwa baada ya istilahi inayofafanuliwa, si baada ya 'siku ya saba'.
