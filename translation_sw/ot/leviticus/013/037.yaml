base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: sw
  text: Lakini ikiwa, kwa uchunguzi wa kuhani, upele wa kichwani au wa kidevuni haujabadilika, na nywele nyeusi zimeota ndani yake, upele huo umepona. Mtu huyo ni safi, na kuhani atamtangaza kuwa safi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhani atamsafisha.” Kitenzi cha Kiebrania kinaweza kutafsiriwa hivyo, lakini hapa kinamaanisha uamuzi rasmi wa kuhani baada ya upele kupona.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: kwa macho yake
  rationale: Nahau hii inadumisha mtazamo wa kuhani anayekagua hali hiyo bila kuigeuza kuwa maoni ya kibinafsi.
- source_word: עָמַד
  choice: haujabadilika
  rationale: Katika uchunguzi huu, kitenzi kinaonyesha kuwa upele umebaki katika hali yake, yaani haujaenea wala kubadilika.
- source_word: הַנֶּתֶק
  choice: upele wa kichwani au wa kidevuni
  rationale: Neno hili linamaanisha aina maalumu ya tatizo la ngozi lenye kuhusiana na sehemu yenye nywele kichwani au kidevuni; tafsiri hii ni wazi kwa msomaji wa kisasa na inazingatia muktadha wa sura.
- source_word: שֵׂעָר שָׁחֹר
  choice: nywele nyeusi
  rationale: Ni tafsiri ya moja kwa moja ya kishazi cha Kiebrania na inadumisha alama ya uchunguzi.
- source_word: צָמַח בּוֹ
  choice: zimeota ndani yake
  rationale: Kirai kihusishi kinaonyesha nywele kuota katika eneo lililoathiriwa.
- source_word: נִרְפָּא
  choice: umepona
  rationale: Kauli hii inasema kwamba upele wenyewe umepona, kabla ya kuhani kutoa uamuzi rasmi.
- source_word: טָהוֹר הוּא
  choice: Mtu huyo ni safi
  rationale: Katika muktadha wa Walawi, hali ya usafi inamhusu mtu anayekaguliwa, si upele pekee.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: na kuhani atamtangaza kuwa safi
  rationale: Hapa kitenzi kinaeleza uamuzi rasmi wa kuhani kuhusu usafi, si kwamba kuhani ndiye anayemponya mtu.
theological_decisions:
- issue: Asili ya tendo la kuhani katika uamuzi wa usafi wa kiibada
  choice: kuhani atamtangaza kuwa safi
  alternative: kuhani atamsafisha
  rationale: Aya inatofautisha kupona kwa upele na uamuzi rasmi wa kuhani unaofuata. Tafsiri hii haidokezi kwamba kuhani ndiye anayesababisha uponyaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Upele wa kichwani au wa kidevuni” umetumiwa kueleza kwa uwazi hali maalumu inayotajwa katika muktadha; “kutangaza kuwa safi” inadumisha lugha ya uamuzi wa kiibada.
