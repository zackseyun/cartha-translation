source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: sw
  text: Kuhani ataliangalia eneo lililoathirika kwenye ngozi ya mwili. Ikiwa nywele katika eneo hilo zimegeuka kuwa nyeupe, na mwonekano wa eneo hilo unaonekana kuwa wa chini kuliko ngozi ya mwili wake, hilo ni eneo lililoathiriwa na ugonjwa wa ngozi[a]. Baada ya kuhani kulichunguza, atamtangaza mtu huyo kuwa najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya jadi, “eneo lililoathiriwa na ukoma” au “maambukizi ya ukoma.” Neno la Kiebrania צָרַעַת linahusu kundi pana zaidi kuliko ugonjwa wa Hansen (ukoma) wa tiba ya kisasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: eneo lililoathirika
  rationale: Katika muktadha wa uchunguzi wa Walawi 13, neno hili linaonyesha sehemu inayoonekana ya ngozi iliyoathirika. Kauli hii ni ya kawaida na haibainishi kimakosa aina mahususi ya ugonjwa.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: kwenye ngozi ya mwili
  rationale: Huhifadhi maana ya kianatomia ya עוֹר na בָּשָׂר kwa Kiswahili cha sasa na cha kawaida.
- source_word: שֵׂעָר
  choice: nywele
  rationale: Ni kisawe cha moja kwa moja na cha kawaida katika maelezo ya uchunguzi wa ngozi.
- source_word: הָפַךְ לָבָן
  choice: zimegeuka kuwa nyeupe
  rationale: Huonyesha mabadiliko yaliyotokea na hali inayoonekana wakati wa uchunguzi.
- source_word: מַרְאֵה
  choice: linaonekana
  rationale: Muundo wa kitenzi ni wa asili zaidi kwa Kiswahili huku ukihifadhi wazo la mwonekano unaochunguzwa.
- source_word: עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: limeingia ndani kuliko ngozi ya mwili wake
  rationale: Huwasilisha kwamba eneo hilo linaonekana kuwa chini ya usawa wa ngozi, bila kudai kwa uhakika jambo lisilo zaidi ya mwonekano.
- source_word: נֶגַע צָרַעַת
  choice: eneo lililoathiriwa na ugonjwa wa ngozi
  rationale: Huhifadhi maneno yote mawili bila kutumia 'ukoma,' ambalo linaweza kueleweka kimakosa kuwa ugonjwa wa Hansen pekee.
- source_word: וְרָאָהוּ
  choice: Kuhani akishamchunguza
  rationale: Kiambishi kinaeleweka kumrejelea mtu katika muktadha; muundo huu unaonyesha mfuatano wa uchunguzi na hukumu.
- source_word: וְטִמֵּא אֹתוֹ
  choice: atamtangaza kuwa najisi
  rationale: Katika sheria ya kikuhani, kuhani hutamka hadhi ya unajisi; haisemi kwamba ndiye anayesababisha unajisi huo.
theological_decisions:
- issue: Maana ya צָרַעַת katika sheria za utakaso za Walawi
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: צָרַעַת ni kundi pana la kale la hali zinazosababisha unajisi wa kiibada, wala halilingani moja kwa moja na ugonjwa wa Hansen wa tiba ya kisasa. Tafsiri ya jadi imehifadhiwa katika tanbihi.
- issue: Nguvu ya kitendo cha kuhani katika וְטִמֵּא אֹתוֹ
  choice: atamtangaza kuwa najisi
  alternative: atamfanya kuwa najisi
  rationale: Muktadha ni wa uchunguzi na hukumu ya kikuhani. Kuhani anatambua na kutamka hadhi ya kiibada, si kuisababisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Sentensi zimegawanywa ili kuepuka msururu mzito, huku mfuatano wa sheria ya Kiebrania ukihifadhiwa.
