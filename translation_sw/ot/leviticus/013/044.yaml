base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: sw
  text: Ni mwanamume mwenye ugonjwa wa ngozi[a]; yeye ni najisi. Kuhani hakika atamtangaza kuwa najisi; ugonjwa wake uko kichwani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kawaida hutafsiriwa “mwenye ukoma.” Neno la Kiebrania linarejelea hali ya ngozi inayozungumziwa katika sura hii, ambayo si lazima iwe sawa na ukoma wa kisasa (ugonjwa wa Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mwanamume
  rationale: Neno hili linamtaja mtu mmoja wa kiume katika kisa hiki cha kisheria; “mwanamume” huhifadhi jinsia iliyo wazi katika Kiebrania.
- source_word: צָרוּעַ
  choice: mwenye ugonjwa wa ngozi
  rationale: Neno hili humaanisha mtu aliyeathiriwa na hali ya ngozi inayochunguzwa katika sura hii. Tafsiri hii huepuka kuilinganisha bila msingi na ukoma wa kisasa (ugonjwa wa Hansen).
- source_word: טָמֵא הוּא
  choice: yeye ni najisi
  rationale: Katika Mambo ya Walawi, טָמֵא hueleza hali ya unajisi wa kiibada; “najisi” ni istilahi ya kawaida na inayoeleweka katika Kiswahili cha Biblia.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: lazima kabisa amtangaze kuwa najisi
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina halisi unasisitiza uhakika wa tendo. Kuhani haisababishi hali hiyo, bali huitangaza rasmi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hii ndiyo istilahi ya kawaida kwa mhudumu wa ibada anayefanya uchunguzi na kutoa tangazo rasmi.
- source_word: בְּרֹאשׁוֹ
  choice: kichwani mwake
  rationale: Huhifadhi maana ya mahali iliyo katika Kiebrania bila kuongeza neno “ngozi ya kichwa,” ambalo halipo wazi katika mstari huu.
- source_word: נִגְעוֹ
  choice: ugonjwa wake
  rationale: Katika muktadha huu נגע ni hali au tatizo lililogunduliwa. “Ugonjwa” ni wa kawaida na huepuka maana ya mlipuko wa maambukizi inayoweza kudokezwa na “pigo.”
theological_decisions:
- issue: Jukumu la kuhani katika kutangaza unajisi
  choice: amtangaze kuwa najisi
  alternative: amfanye kuwa najisi
  rationale: Katika sheria hii, kuhani anatambua na kutangaza rasmi hali ya mtu; maandishi hayasemi kwamba kuhani ndiye anayesababisha unajisi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Lazima kabisa” huhifadhi msisitizo wa muundo wa Kiebrania, na “najisi” hudumisha istilahi ya kiibada ya Mambo ya Walawi.
