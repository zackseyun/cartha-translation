id: LEV.13.26
reference: Leviticus 13:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: sw
  text: Lakini ikiwa kuhani atalichunguza, na tazama, katika doa hilo angavu hakuna nywele nyeupe, wala doa hilo halijazama chini ya ngozi[a], nalo limefifia, basi kuhani atamtenga[b] mtu huyo kwa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haliko chini kuliko ngozi,” yaani, halionekani kuwa limebonyea chini ya ngozi inayolizunguka.
    reason: lexical_alternative
  - marker: b
    text: Au, “atamweka karantini” au “atamfungia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: atalichunguza
  rationale: Kitenzi hiki kwa maana ya msingi ni ‘kuliona,’ lakini hapa kinahusu uchunguzi rasmi wa kuhani; ‘atalichunguza’ huwasilisha tendo hilo kwa Kiswahili cha kawaida.
- source_word: בַּבֶּהֶרֶת
  choice: katika doa hilo angavu
  rationale: בַּהֶרֶת ni alama au doa la ngozi linaloonekana angavu. ‘Doa angavu’ huhifadhi sifa ya kuonekana bila kulipa jina la ugonjwa wa kisasa.
- source_word: שֵׂעָר לָבָן
  choice: nywele nyeupe
  rationale: Usemi wa Kiebrania ni wa umoja wenye maana ya kijumla; ‘nywele nyeupe’ ni usemi wa kawaida na unaofaa katika muktadha wa ngozi.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: wala doa hilo halijazama chini ya ngozi
  rationale: Neno שְׁפָלָה lina wazo la kuwa chini au lililobonyea. ‘Halijazama chini ya ngozi’ linaeleza kigezo kinachoonekana bila kudai undani wa kitabibu.
- source_word: כֵהָה
  choice: limefifia
  rationale: Neno hilo linaonyesha kwamba mwonekano wa doa umepungua au si mkali; ‘limefifia’ ni Kiswahili cha sasa na cha kawaida.
- source_word: וְהִסְגִּירוֹ
  choice: atamtenga mtu huyo
  rationale: Kitenzi kinamaanisha kumfungia au kumweka kando kwa uchunguzi. ‘Atamtenga’ kinaeleza utaratibu huo bila kuingiza kwa lazima maana maalumu ya karantini ya kisasa; ‘mtu huyo’ huweka wazi rejeo la kiambishi cha kiume.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi kiashiria cha mazungumzo kinachovuta fikira kwenye matokeo ya uchunguzi, kwa mtindo wenye hadhi unaoeleweka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtiririko wa uchunguzi wa kikuhani, huku ikiepuka kulitambua doa hilo kuwa ugonjwa fulani wa kisasa. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
