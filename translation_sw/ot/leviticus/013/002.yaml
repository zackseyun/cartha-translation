  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: sw
  text: Mtu akiwa na uvimbe, upele, au doa angavu kwenye ngozi ya mwili wake, na hali hiyo ikawa kwenye ngozi ya mwili wake kidonda cha ugonjwa wa ngozi[a], mtu huyo atapelekwa kwa kuhani Aroni au kwa mmoja wa wanawe walio makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa mapokeo, “ukoma” au “ugonjwa unaofanana na ukoma.” Neno la Kiebrania צָרָעַת (tsaraʿat) linamaanisha kwa upana kundi la hali zinazoathiri ngozi, wala halipaswi kutambuliwa moja kwa moja kuwa ugonjwa wa Hansen unaoitwa ukoma leo.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: mtu
  rationale: Hili ni neno la jumla linaloanzisha kisa cha kisheria kuhusu mtu yeyote; “mtu” ni la kawaida na haliongezi jinsia ambayo muktadha hauhitaji.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: kwenye ngozi ya mwili wake
  rationale: Huhifadhi maelezo halisi ya sehemu ya mwili huku likitumia Kiswahili cha kawaida na kinachoeleweka.
- source_word: שְׂאֵת
  choice: uvimbe
  rationale: Neno hilo linaonyesha sehemu ya ngozi iliyoinuka; “uvimbe” ni wazi bila kulazimisha utambuzi maalumu wa kitabibu.
- source_word: סַפַּחַת
  choice: upele
  rationale: Rejeleo kamili la kidermatolojia halina uhakika. “Upele” ni neno pana na la kawaida kwa hali au jeraha dogo la ngozi, hivyo halibani maana kupita ushahidi wa Kiebrania.
- source_word: בַּהֶרֶת
  choice: doa linalongʼaa
  rationale: Huwasilisha alama angavu au yenye weupe bila kuamua kwamba lazima iwe doa jeupe.
- source_word: לְנֶגַע צָרָעַת
  choice: eneo lililoathiriwa na ugonjwa wa ngozi
  rationale: נֶגַע ni sehemu iliyoathiriwa au jeraha, na צָרָעַת ni kundi pana la hali za ngozi katika maandiko. Tafsiri hii huepuka kuitambulisha moja kwa moja na ugonjwa wa Hansen.
- source_word: וְהוּבָא
  choice: atapelekwa
  rationale: Huhifadhi kauli tendwa na nguvu ya utaratibu wa kisheria wa Kiebrania.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: kuhani Aroni
  rationale: Mpangilio huu wa cheo na jina ni wa kawaida na wa asili katika Kiswahili.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: mmoja wa wanawe walio makuhani
  rationale: Huhifadhi uhusiano wa kifamilia na pia utambulisho wao wa kikuhani kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Tafsiri ya צָרָעַת
  choice: ugonjwa wa ngozi
  alternative: ukoma; ugonjwa unaofanana na ukoma; tsaraati
  rationale: צָרָעַת ni kundi la hali zilizoathiri ngozi katika mfumo wa uchunguzi na utakaso wa Walawi, si lazima ugonjwa wa Hansen unaoitwa ukoma leo. Neno pana katika matini kuu hulinda maana ya chanzo; tafsiri ya jadi imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayosomeka kwa urahisi. Muundo wa sheria ya kisa na kauli tendwa vimehifadhiwa, huku istilahi zisizo na uhakika wa kitabibu zikitafsiriwa kwa upana unaofaa.
