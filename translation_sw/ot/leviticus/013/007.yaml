- from: Lakini ikiwa upele huo utaendelea kuenea[a] kwenye ngozi baada ya mtu huyo kujionyesha kwa kuhani ili atangazwe kuwa safi[b], basi atajionyesha tena kwa kuhani.
  to: Lakini ikiwa upele huo utaenea kweli[a] kwenye ngozi baada ya kujionyesha kwa kuhani kwa ajili ya kutangazwa kuwa safi[b], basi atajionyesha mbele ya kuhani mara ya pili.
  rationale: The revision preserves the Hebrew emphasis on spreading without importing a continuative meaning, explicitly translates “a second time,” and retains the ritual context of priestly examination and declaration of cleanness in natural Standard East African Swahili.
