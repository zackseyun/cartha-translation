review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional situation, the skin condition, presentation to the priest, and renewed priestly examination. However, “utaendelea kuenea” adds an explicit durative/continuative nuance that is not required by the Hebrew infinitive-absolute construction, which intensifies the certainty/emphasis of spreading. “Tena” should also explicitly retain the specified second occurrence (שֵׁנִית).
  naturalness: The Swahili is generally clear and suitably formal. Removing “mtu huyo” makes the sentence less cumbersome, while “mara ya pili” is natural and precise in this procedural context.
  terminology: “Upele” is an appropriately broad modern equivalent for מִסְפַּחַת. “Kutangazwa kuwa safi” properly reflects the ritual-priestly outcome without suggesting medical treatment. “Kuhani” and “ngozi” are standard and fitting.
  issues:
  - severity: medium
    issue: “Utaendelea kuenea” over-specifies the verbal aspect.
    rationale: פָּשֹׂה תִפְשֶׂה intensifies the assertion that the condition spreads; it need not state that it continues spreading. “Utaenea kweli” preserves emphasis without adding duration.
  - severity: low
    issue: “Tena” does not explicitly state that this is the second appearance.
    rationale: שֵׁנִית specifically means “a second time.” Adding “mara ya pili” preserves this detail.
  revised_text: Lakini ikiwa upele huo utaenea kweli[a] kwenye ngozi baada ya kujionyesha kwa kuhani kwa ajili ya kutangazwa kuwa safi[b], basi atajionyesha mbele ya kuhani mara ya pili.
  revised_footnotes:
