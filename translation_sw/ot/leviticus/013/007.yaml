    text: 'Kiebrania kinasisitiza kitenzi: “ikiwa upele huo utaenea kweli” au “utaenea hakika.”'
    reason: lexical_alternative
  - marker: b
    text: Yaani, ajionyeshe kwa kuhani ili achunguzwe kwa kusudi la kuamuliwa na kutangazwa kuwa safi.
    reason: cultural_note
  revision_rationale: The revision preserves the Hebrew emphasis on spreading without importing a continuative meaning, explicitly translates “a second time,” and retains the ritual context of priestly examination and declaration of cleanness in natural Standard East African Swahili.
