  text: וְ/אִם פָּשֹׂ֨ה תִפְשֶׂ֤ה הַ/מִּסְפַּ֨חַת֙ בָּ/ע֔וֹר אַחֲרֵ֧י הֵרָאֹת֛/וֹ אֶל הַ/כֹּהֵ֖ן לְ/טָהֳרָת֑/וֹ וְ/נִרְאָ֥ה שֵׁנִ֖ית אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: sw
  text: Lakini ikiwa upele huo utaenea kweli[a] kwenye ngozi baada ya kujionyesha kwa kuhani kwa ajili ya kutangazwa kuwa safi[b], basi atajionyesha mbele ya kuhani mara ya pili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinasisitiza kitenzi: “ikiwa upele huo utaenea kweli” au “utaenea hakika.”'
    reason: lexical_alternative
  - marker: b
    text: Yaani, ajionyeshe kwa kuhani ili achunguzwe kwa kusudi la kuamuliwa na kutangazwa kuwa safi.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: utaendelea kuenea
  rationale: Muundo wa kitenzi kisicho na ukomo pamoja na kitenzi cha wakati ujao unasisitiza kuenea kwa hali hiyo. Kiswahili hiki huonyesha kuendelea au kuenea zaidi kwa njia ya asili.
- source_word: הַמִּסְפַּחַת
  choice: upele huo
  rationale: Neno hili linamaanisha hali ya juu juu ya ngozi inayochunguzwa; “upele” ni neno la kawaida na pana lisilodokeza kimakosa kidonda kinachopona.
- source_word: בָּעוֹר
  choice: kwenye ngozi
  rationale: Huonyesha mahali hali hiyo ilipo bila kuongeza kimilikishi ambacho hakipo wazi katika Kiebrania.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: baada ya mtu huyo kujionyesha
  rationale: Nifali hapa ina maana ya mtu kujileta au kujitokeza kwa uchunguzi wa kikuhani.
- source_word: אֶל הַכֹּהֵן
  choice: kwa kuhani
  rationale: Huonyesha kuelekea na kujileta mbele ya kuhani anayefanya uchunguzi.
- source_word: לְטָהֳרָתוֹ
  choice: ili atangazwe kuwa safi
  rationale: Katika muktadha huu, kusudi la uchunguzi ni uamuzi wa kikuhani kuhusu usafi; tafsiri hii huepuka kudokeza kwamba tayari ametakaswa.
- source_word: וְנִרְאָה שֵׁנִית
  choice: basi atajionyesha tena
  rationale: Katika sheria hii, umbo hilo linaeleza wajibu au matokeo ya kujitokeza kwa uchunguzi wa pili.
theological_decisions:
- issue: Maana ya לְטָהֳרָתוֹ katika utaratibu wa ukuhani
  choice: ili atangazwe kuwa safi
  alternative: kwa ajili ya kutakaswa kwake
  rationale: Muktadha unahusu uchunguzi na tamko la hali ya usafi wa kiibada. Tafsiri iliyochaguliwa inaweka wazi kusudi la utaratibu bila kudai kwamba hali ya ngozi yenyewe inatibiwa au kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Upele” limetumiwa kama neno pana la hali ya juu juu ya ngozi; “ili atangazwe kuwa safi” linafafanua utaratibu wa uchunguzi wa kikuhani. Alama zote za tanbihi zimewekwa katika matini kuu.
