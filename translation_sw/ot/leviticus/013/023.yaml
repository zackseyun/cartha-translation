id: LEV.13.23
reference: Leviticus 13:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: sw
  text: Lakini ikiwa doa angavu linabaki mahali pake[a] na halijaenea, hilo ni kovu la jipu; kuhani atamtangaza mtu huyo kuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini yake”; nahau ya Kiebrania inamaanisha kwamba doa hilo linabaki mahali lilipo badala ya kuenea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Inaonyesha sharti linalotofautiana na hali iliyotajwa katika mstari uliotangulia.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: linabaki mahali pake
  rationale: Kihalisi ni ‘linasimama chini yake,’ lakini katika uchunguzi huu nahau inaonyesha kwamba doa haliondoki mahali lilipo wala kuenea.
- source_word: הַבַּהֶרֶת
  choice: doa angavu
  rationale: Neno hilo linataja alama inayoonekana kuwa angavu kwenye ngozi bila kuingiza utambuzi maalumu wa ugonjwa.
- source_word: לֹא פָשָׂתָה
  choice: halijaenea
  rationale: Kitenzi hiki hutumiwa mara kwa mara katika sura hii kuhusu hali ya ngozi inayotanuka juu ya ngozi.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: kovu la jipu
  rationale: Ni alama iliyobaki baada ya uvimbe wa jipu; ‘kovu la jipu’ ni usemi mfupi na wa kawaida.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: kuhani atamtangaza mtu huyo kuwa safi
  rationale: Katika muktadha wa sheria za utakaso, kuhani anatamka hadhi ya mtu kuwa safi; hamponyi wala kumtakasa kwa tendo hilo.
theological_decisions:
- issue: Usafi wa kiibada dhidi ya uponyaji wa kimatibabu
  choice: kuhani atamtangaza mtu huyo kuwa safi
  alternative: kuhani atamtakasa mtu huyo
  rationale: Kitenzi טהר hapa kinahusu uamuzi wa kikuhani kuhusu hadhi ya usafi, si tendo la kumponya mtu au kuondoa ugonjwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. ‘Doa angavu’ huhifadhi sifa ya alama inayoonekana, na ‘mtu huyo’ huweka wazi yule anayetamkiwa kuwa safi.
