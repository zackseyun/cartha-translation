base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/029.yaml
  text: When a man or a woman has an infection on the head or on the beard[b][a],
translation:
  language: sw
  text: Mwanamume au mwanamke akiwa na kidonda[a] kichwani[b] au kwenye ndevu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ugonjwa,” “pigo,” au “alama.” Neno la Kiebrania negaʿ ni pana katika Mambo ya Walawi na humaanisha hali au alama inayoonekana ambayo huchunguzwa na kuhani.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kichwani”; katika muktadha huu huenda likamaanisha hasa kwenye ngozi ya kichwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: Mwanamume au mwanamke
  rationale: Kiebrania kinataja jinsia zote mbili waziwazi; tafsiri inazihifadhi badala ya kutumia neno la jumla kama “mtu.”
- source_word: כִּי
  choice: akiwa na
  rationale: Katika sheria hii ya kuchunguza hali fulani, כִּי huanzisha sharti la tukio. Muundo “akiwa na” ni wa kawaida katika Kiswahili na unabaki na maana ya sharti.
- source_word: יִהְיֶה בּוֹ
  choice: akiwa na
  rationale: Kihalisi ni “ikiwapo ndani/kwake,” lakini katika muktadha huu wa uchunguzi, “akiwa na” ni Kiswahili cha kawaida kisichopoteza maana.
- source_word: נָגַע
  choice: kidonda
  rationale: נֶגַע ni neno pana kwa alama, jeraha, au hali inayoonekana inayochunguzwa na kuhani. “Kidonda” linaeleweka kwa urahisi na halidai utambuzi maalumu wa kitabibu; tanbihi inaonyesha upana wa neno la asili.
- source_word: בְּ/רֹאשׁ
  choice: kichwani
  rationale: רֹאשׁ humaanisha “kichwa.” “Kichwani” ni tafsiri ya asili na yenye upana uleule, ingawa katika muktadha huu huenda hasa ikamaanisha ngozi ya kichwa.
- source_word: בְ/זָקָן
  choice: kwenye ndevu
  rationale: זָקָן humaanisha “ndevu”; “kwenye ndevu” huonyesha eneo lililoathiriwa kwa Kiswahili cha kawaida.
