  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “doa,” “alama iliyoathirika,” au, kwa tafsiri ya kimapokeo, “pigo.” Neno la Kiebrania linamaanisha alama au sehemu inayokaguliwa na kuhani, si lazima aina fulani ya ugonjwa inayotambuliwa kisasa.
