lexical_decisions:
- source_word: וְרָאָה
  choice: atalichunguza
  rationale: Ingawa kitenzi ראה kwa msingi humaanisha ‘kuona,’ katika utaratibu huu wa kikuhani kinaashiria ukaguzi rasmi; ‘kuchunguza’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: Kuhani
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa כֹּהֵן; muktadha na mpangilio wa Kiswahili hufanya urejeo wake kuwa mahususi bila kulazimisha ‘yule.’
- source_word: הַנָּגַע / הַנֶּגַע
  choice: eneo lililoathirika
  rationale: נגע hapa ni alama au sehemu iliyoathirika inayokaguliwa, si lazima ugonjwa unaoweza kutambuliwa kwa istilahi ya kisasa. Tafsiri hii pia inafaa kwa muktadha wa kitu kilichoathirika.
- source_word: וְהִסְגִּיר
  choice: atalifungia
  rationale: Hifili ya סגר ina maana ya kufunga au kuweka kando chini ya uangalizi. ‘Kulifungia’ huhifadhi picha halisi ya kufungwa na kusudi la kutengwa kwa muda bila kuingiza dhana pana za kisasa za karantini.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda uliowekwa.
