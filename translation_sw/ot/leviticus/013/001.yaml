  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: sw
  text: 'Yahwe[a] akasema na Musa na Haruni, akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH.” Jina hili kwa kawaida hutafsiriwa “BWANA” katika tafsiri nyingi.'
