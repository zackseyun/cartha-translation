lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula ya hotuba ya kimungu, kitenzi דבר pamoja na אֶל humaanisha kumwambia au kusema na mtu. “Akasema na” ni Kiswahili cha kawaida na chenye heshima, na kinaonyesha tukio jipya la usemi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne YHWH limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: na Musa na Haruni
  rationale: Kiswahili hutumia “sema na” kutaja wanaoambiwa. Kurudia kwa Kiebrania kwa kihusishi אֶל kabla ya Haruni hakuhitaji kurudiwa kwa namna isiyo ya kawaida katika Kiswahili; viunganishi vinawahifadhi wazi watu wote wawili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki hutanguliza maneno yanayofuata. “Akisema” kinahifadhi uhusiano rasmi na hotuba ya mstari unaofuata bila kuongeza ufafanuzi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “akasema ... akisema” umehifadhiwa kwa sababu ni fomula ya utangulizi wa hotuba na unaunganisha mstari huu na maneno yanayofuata.
