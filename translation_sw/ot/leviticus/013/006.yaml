revisions:
- from: Kisha siku ya saba kuhani atamchunguza tena. Na ikiwa sehemu iliyoathirika imefifia, wala haijaenea kwenye ngozi, kuhani atamtangaza kuwa safi; ni upele[a]. Atafua nguo zake, naye atakuwa safi.
  to: Kuhani atamchunguza tena siku ya saba; na tazama, alama hiyo ya ngozi imefifia, nayo haijaenea katika ngozi. Kuhani atamtangaza kuwa safi; ni upele wenye magamba[a]. Mtu huyo atafua nguo zake, naye atakuwa safi.
  rationale: Marekebisho yanaweka mpangilio wa uchunguzi wa siku ya saba kwa uwazi, yanatafsiri נגע kama alama ya ngozi bila madai ya kimatibabu yasiyothibitishwa, na yanadumisha tofauti kati ya kutangazwa safi na kuponywa. Pia yanahakikisha kuwa mtu aliyekaguliwa ndiye anayefua nguo zake.
