base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: sw
  text: Kuhani atamchunguza tena siku ya saba; na tazama, alama hiyo ya ngozi imefifia, nayo haijaenea katika ngozi. Kuhani atamtangaza kuwa safi; ni upele wenye magamba[a]. Mtu huyo atafua nguo zake, naye atakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upele.” Neno la Kiebrania hurejelea hali ndogo ya ngozi, tofauti na hali mbaya zaidi inayoendelea kuenea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: atamchunguza
  rationale: Katika muktadha wa uchunguzi rasmi wa kikuhani, kitenzi hiki kinamaanisha kuchunguza, si kuona tu.
- source_word: שֵׁנִית
  choice: tena
  rationale: Huwasilisha kwa Kiswahili cha kawaida kurudiwa kwa uchunguzi siku ya saba.
- source_word: כֵּהָה
  choice: imefifia
  rationale: Hueleza kuwa alama ya ngozi imepungua ukali au kuonekana kwake.
- source_word: הַנֶּגַע
  choice: sehemu iliyoathirika
  rationale: Ni lugha ya kawaida inayorejelea eneo la ngozi linalochunguzwa bila kudai kwa uhakika kuwa ni maambukizi ya kitabibu.
- source_word: פָשָׂה
  choice: haijaenea
  rationale: Hii ndiyo maana ya kawaida katika sheria hizi za hali za ngozi.
- source_word: בָּעוֹר
  choice: kwenye ngozi
  rationale: Ni usemi wa asili wa Kiswahili kwa eneo ambako hali hiyo ingeweza kuenea.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: kuhani atamtangaza kuwa safi
  rationale: Huonyesha hukumu rasmi ya hali ya kiibada, si tendo la kumponya au kumsafisha kimwili.
- source_word: מִסְפַּחַת
  choice: upele
  rationale: Neno hili la kawaida linafaa kwa hali ndogo ya ngozi; uwezekano wa maana yenye magamba unaelezwa katika tanbihi.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Atafua nguo zake
  rationale: Ni Kiswahili cha sasa na cha kawaida kwa agizo la kuziosha nguo zake.
- source_word: וְטָהֵר
  choice: naye atakuwa safi
  rationale: Hueleza matokeo ya hali ya usafi wa kiibada baada ya kufua nguo.
theological_decisions:
- issue: Hukumu ya usafi wa kiibada dhidi ya uponyaji wa kimwili
  choice: kuhani atamtangaza kuwa safi; ... atakuwa safi
  alternative: kuhani atamsafisha; ... amepona
  rationale: Muktadha unahusu uamuzi rasmi kuhusu usafi wa kiibada. Tafsiri haidai kwamba kuhani anamponya mtu au kwamba hali yote ya kimwili imekwisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wazi bila kutumia istilahi nzito za kitabibu, na tofauti kati ya hali ya ngozi na hukumu ya usafi wa kiibada imehifadhiwa.
