  to: Lakini kuhani akiichunguza, na kumbe doa limefifia baada ya kuoshwa, atairarua sehemu hiyo na kuitoa katika vazi, au katika ngozi, au katika nyuzi za mtande, au katika nyuzi za kufuma kwa upana.[a]
  rationale: Revision corrects the directional force of the Hebrew preposition and replaces a potentially inaccurate textile label with a clear, source-faithful description of weft. The passive “baada ya kuoshwa” is retained, preserving the source’s unelaborated pronominal reference.
