base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: sw
  text: Lakini kuhani akiichunguza, na kumbe doa limefifia baada ya kuoshwa, atairarua sehemu hiyo na kuitoa katika vazi, au katika ngozi, au katika nyuzi za mtande, au katika nyuzi za kufuma kwa upana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mtande ni nyuzi zinazoenda kwa urefu katika kitambaa; nyuzi za kufuma kwa upana hupita kwa upana na kuingiliana nazo.
    reason: Ufafanuzi wa istilahi za kiufundi za ufumaji.
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ... aki-
  rationale: Muundo huu unaendeleza sharti la utaratibu uliotangulia huku ukionyesha tofauti ndogo na hali iliyotajwa kabla.
- source_word: רָאָה הַכֹּהֵן
  choice: kuhani akiichunguza
  rationale: Ingawa kitenzi kwa msingi ni ‘kuona,’ muktadha wa kisheria unahusu ukaguzi na tathmini ya kuhani; ‘kuichunguza’ huwasilisha tendo hilo kwa Kiswahili cha kawaida.
- source_word: וְהִנֵּה
  choice: na kumbe
  rationale: ‘Kumbe’ ni kiashiria cha asili katika Kiswahili kinachovuta fikira kwenye hali iliyobainika, bila kutumia mtindo mzito wa ‘tazama.’
- source_word: כֵּהָה הַנֶּגַע
  choice: doa limefifia
  rationale: Katika muktadha wa vazi au ngozi, נגע ni eneo lenye dalili au doa, nalo כֵּהָה linaonyesha kuwa mwonekano wake umepungua nguvu.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: baada ya kuoshwa
  rationale: Muundo wa kutendwa unaakisi Kiebrania na kutoitaja tena wazi kitu kilichooshwa kunahifadhi kwa kiasi fulani urejeleo mpana wa kiwakilishi cha chanzo.
- source_word: וְקָרַע אֹתוֹ
  choice: atairarua sehemu hiyo na kuiondoa
  rationale: Maana katika utaratibu huu ni kurarua na kuondoa eneo lililoathirika, si lazima kuharibu kitu kizima.
- source_word: מִן הַבֶּגֶד
  choice: katika vazi
  rationale: ‘Vazi’ ni neno pana na la kawaida kwa בגד katika muktadha huu.
- source_word: מִן הָעוֹר
  choice: katika ... ngozi
  rationale: ‘Ngozi’ hapa humaanisha ngozi iliyotumiwa kama nyenzo; muktadha unaondoa maana ya ngozi ya mwili wa mtu.
- source_word: מִן הַשְּׁתִי
  choice: katika nyuzi za mtande
  rationale: ‘Mtande’ ni istilahi ya ufumaji kwa nyuzi zinazoenda kwa urefu, na hivyo hudumisha usahihi wa kiufundi wa chanzo.
- source_word: מִן הָעֵרֶב
  choice: katika nyuzi ... za mshazari
  rationale: ‘Mshazari’ ni istilahi ya ufumaji kwa nyuzi zinazopita kwa upana na kuingiliana na mtande.
