review_pass:
  verdict: revise
  source_fidelity: The conditional inspection and the fading of the affected area are conveyed accurately. The removal must be expressed as removal from, rather than location in, each material. The Hebrew textile pair is specifically warp and weft; the draft's use of “mshazari” is potentially misleading because it ordinarily denotes something diagonal rather than the crosswise weft threads.
  naturalness: The sentence is generally clear and appropriately procedural. “Akiichunguza” and “doa limefifia” are natural. “Kuitoa katika” is more idiomatic and precise than “kuiondoa katika” after “kuirarua,” and explicit descriptive wording for the two sets of threads is clearer for modern readers.
  terminology: “Vazi” and “ngozi” suit the material context. “Nyuzi za mtande” may be retained for warp with explanation, but the corresponding term should identify the weft as crosswise threads rather than call it “mshazari.”
  issues:
  - severity: medium
    issue: The draft says the portion is removed “katika vazi ...,” rather than removed from those materials.
    rationale: The repeated Hebrew מן means “from/out of.” In Swahili, “kuitoa katika” (or “kuiondoa kutoka katika”) preserves the required direction of removal.
  - severity: medium
    issue: “Mshazari” is not a sufficiently precise equivalent for weft.
    rationale: The source contrasts warp with weft, the crosswise threads. “Mshazari” normally describes a diagonal direction and can suggest a different textile feature. Descriptive wording preserves the technical distinction without asserting an uncertain specialized label.
  revised_text: Lakini kuhani akiichunguza, na kumbe doa limefifia baada ya kuoshwa, atairarua sehemu hiyo na kuitoa katika vazi, au katika ngozi, au katika nyuzi za mtande, au katika nyuzi za kufuma kwa upana.[a]
  revised_footnotes:
  - marker: a
    text: Mtande ni nyuzi zinazoenda kwa urefu katika kitambaa; nyuzi za kufuma kwa upana hupita kwa upana na kuingiliana nazo.
    reason: Ufafanuzi wa istilahi za kiufundi za ufumaji.
  revision_rationale: Revision corrects the directional force of the Hebrew preposition and replaces a potentially inaccurate textile label with a clear, source-faithful description of weft. The passive “baada ya kuoshwa” is retained, preserving the source’s unelaborated pronominal reference.
