translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. Sentensi inabaki ya kiutaratibu kama chanzo, huku istilahi za ufumaji zikifafanuliwa katika tanbihi.
