  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: sw
  text: 'Kuhani atalichunguza, na tazama: nywele zilizo katika doa angavu zimegeuka kuwa nyeupe, nalo linaonekana kuwa ndani zaidi kuliko ngozi. Huo ni ugonjwa wa ngozi[a] uliozuka katika sehemu iliyoungua. Kuhani atamtangaza mtu huyo kuwa najisi; hilo ni donda la ugonjwa wa ngozi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania tsaraʿat, neno pana kwa ugonjwa au tatizo kubwa la ngozi; kwa jadi limetafsiriwa “ukoma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: atalichunguza
  rationale: Katika muktadha wa uchunguzi wa kikuhani, kitenzi hiki kinaonyesha kukagua kwa makusudi, si kuona tu.
- source_word: בַּהֶרֶת
  choice: doa angavu
  rationale: Neno hilo linaeleza doa au sehemu yenye mwangaza kwenye ngozi bila kuingiza istilahi ya kitabibu isiyokuwamo katika maandishi.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: nywele ... zimegeuka kuwa nyeupe
  rationale: Huhifadhi wazo la mabadiliko lililo katika kitenzi cha Kiebrania.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: linaonekana kuwa ndani zaidi kuliko ngozi
  rationale: Ni Kiswahili cha kawaida kinachowasilisha ishara ya kuonekana kwa kina bila kudai uchunguzi wa kisasa wa kitabibu.
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Tsaraʿat ni kundi pana la maradhi au madhara ya ngozi katika sheria za utakaso, wala halilingani kwa lazima na ukoma wa kisasa.
- source_word: מִכְוָה
  choice: sehemu iliyoungua
  rationale: Neno la Kiebrania linaweza kumaanisha sehemu au jeraha la kuungua; uchaguzi huu haudai kwamba tayari kulikuwa na kovu lililopona.
- source_word: פָּרָחָה
  choice: uliozuka
  rationale: Katika muktadha wa ugonjwa wa ngozi, kitenzi kinaonyesha kutokea au kuchipuka kwa tatizo.
- source_word: טִמֵּא אֹתוֹ
  choice: atamtangaza mtu huyo kuwa najisi
  rationale: Kuhani anatoa uamuzi rasmi wa hali ya kiibada; si kwamba yeye ndiye anayesababisha unajisi.
- source_word: נֶגַע צָרַעַת
  choice: donda la ugonjwa wa ngozi
  rationale: נֶגַע hapa ni alama au kidonda kinachoonekana; “donda” huepuka dai maalumu la kitabibu linaloweza kudokezwa na “maambukizi.”
theological_decisions:
- issue: Jinsi ya kutafsiri צָרַעַת katika sheria ya utakaso
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: Neno la Kiebrania lina maana pana kuliko ugonjwa wa Hansen unaoitwa ukoma leo. Tafsiri hii huepuka utambulisho wa kitabibu usiohakikishwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa kawaida. Kauli “na tazama” imehifadhiwa ili kuonyesha וְהִנֵּה, na “najisi” imetumiwa kwa hadhi ya kiibada inayohusika.
