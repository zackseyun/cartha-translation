  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: sw
  text: Na mahali palipokuwa na jipu, kukitokea uvimbe mweupe au doa jeupe lenye wekundu, mtu huyo aonekane mbele ya kuhani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu huyo aonyeshwe kwa kuhani.” Kiebrania kinaweza kutafsiriwa kihalisi kuwa “aonekane”; katika muktadha huu kinaweza pia kumaanisha kwamba mtu mwenye hali hiyo aletwe kwa kuhani ili achunguzwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: pakitokea
  rationale: Katika sheria hii ya uchunguzi, kitenzi hiki kinaonyesha hali inayojitokeza mahali pa jipu; ‘pakitokea’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: mahali palipokuwa na jipu
  rationale: Hutoa maana ya eneo la ngozi lililokuwa na jipu, bila kudokeza kwamba uvimbe unachukua nafasi ya jipu kwa maana nyingine.
- source_word: שְׂאֵת לְבָנָה
  choice: uvimbe mweupe
  rationale: שְׂאֵת hapa ni sehemu iliyoinuka au kuvimba kwenye ngozi; ‘uvimbe’ ni neno wazi na linalofaa katika muktadha huu.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: doa jeupe lenye wekundu
  rationale: בַהֶרֶת ni doa au sehemu ya ngozi inayoonekana wazi, na אֲדַמְדָּמֶת huongeza sifa ya wekundu; tafsiri hii huhifadhi mchanganyiko wa weupe na wekundu kwa lugha ya kawaida.
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: ndipo ataonyeshwa kuhani
  rationale: Nifali ya ראה inaweza kumaanisha ‘kuonekana’ au ‘kuonyeshwa.’ Katika utaratibu huu, tafsiri hiyo inaeleza kumpeleka mtu mwenye hali hiyo kwa kuhani ili achunguzwe, huku tanbihi ikihifadhi uwezekano wa tafsiri halisi zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maneno ya kawaida ‘jipu,’ ‘uvimbe,’ na ‘doa’ yametumiwa ili sheria ya uchunguzi ieleweke bila kutumia istilahi nzito za kitabibu. Kiwakilishi cha mtu katika ‘ataonyeshwa’ kinafuata utaratibu wa kumleta aliyeathirika kwa kuhani, huku tanbihi ikihifadhi utata wa kitenzi cha Kiebrania.
