  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: sw
  text: Ndipo kuhani ataamuru wafulue kitu chenye pigo hilo[a], kisha atakitenga[b] kwa siku saba nyingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifaa chenye alama hiyo.” Kiebrania kimetumia kauli pana inayorejelea kitu kilichoathirika na kinachochunguzwa; “pigo” hapa ni hali au alama inayokichunguza, si pigo la kimwili.
    reason: lexical_alternative
  - marker: b
    text: Au, “atakifungia.” Kitenzi cha Kiebrania kina maana ya kukifungia au kukiweka kando kwa uchunguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Ndipo ... ataamuru
  rationale: Muundo wa waw pamoja na kitenzi timilifu katika mfululizo wa maagizo unaonyesha hatua inayofuata; “ndipo” na wakati ujao huwasilisha utaratibu huo kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mhudumu wa ibada anayesimamia uchunguzi katika Mambo ya Walawi.
- source_word: וְכִבְּסוּ
  choice: wafulue
  rationale: Kitenzi ni cha nafsi ya tatu wingi bila kuwataja watendaji. Baada ya “ataamuru,” Kiswahili huonyesha kwa kawaida kwamba watu wasiotajwa ndio watakaofua kitu hicho.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: kitu chenye athari hiyo
  rationale: Kirai cha Kiebrania hakitaji aina moja maalumu ya kifaa, bali kinarejelea kwa upana kitu kilichoathirika kinachochunguzwa; “kitu” huhifadhi upana huo.
- source_word: הַנָּגַע
  choice: athari hiyo
  rationale: Katika muktadha huu neno linaonyesha hali au alama hatari iliyo kwenye kitu. “Athari” huepuka kulazimisha maana iwe ugonjwa wa mtu, doa la kawaida, au aina fulani ya ukungu.
- source_word: וְהִסְגִּירוֹ
  choice: atakitenga
  rationale: Kitenzi kina maana ya kukifungia au kukiweka kando ili kichunguzwe. “Kukitenga” ni Kiswahili cha sasa kinachoeleza kusudi la hatua hiyo bila kudai kwamba lazima kiwekwe katika chumba kilichofungwa.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya muda uliotajwa.
- source_word: שֵׁנִית
  choice: nyingine
  rationale: Katika “kwa siku saba nyingine,” neno hili linaonyesha wazi kurudiwa kwa kipindi cha siku saba kwa mara ya pili kwa Kiswahili cha asili.
