base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: sw
  text: Kwa siku zote ambazo ana ugonjwa huo[a], atakuwa najisi. Yeye ni najisi[b]. Ataishi peke yake; makao yake yatakuwa nje ya kambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tatizo hilo” au “pigo hilo.” Neno la Kiebrania lina maana pana na hapa linahusu hali iliyotambuliwa na kuchunguzwa kama inavyoelezwa katika sura hii.
    reason: lexical_alternative
  - marker: b
    text: Hapa “najisi” hueleza hali ya unajisi kwa mujibu wa sheria ya Walawi; si lazima iwe na maana ya kuwa na hatia ya kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: ugonjwa huo
  rationale: נֶגַע ni neno pana linaloweza kumaanisha pigo, tatizo, au hali ya ugonjwa. Katika Mambo ya Walawi 13 linahusu hali iliyochunguzwa na kutambuliwa; “ugonjwa huo” ni wazi na ya kawaida bila kulifanya neno hilo kuwa mahususi kupita Kiebrania.
- source_word: בּוֹ
  choice: atakazokuwa na ugonjwa huo
  rationale: Kiebrania kina maana ya hali kuwa “ndani yake” au “juu yake.” Kiswahili cha kawaida husema mtu “ana ugonjwa”; muundo huu ni wa asili na hauamui ikiwa hali hiyo iko ndani au juu ya mwili.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Kitenzi hiki hapa kinaeleza hali ya unajisi chini ya sheria. Wakati ujao katika “atakuwa” unadumisha nguvu ya sharti la kisheria.
- source_word: טָמֵא הוּא
  choice: Yeye ni najisi
  rationale: Kishazi hiki kinarudia hali hiyo kwa mkazo. Sentensi tofauti inadumisha msisitizo wa Kiebrania.
- source_word: בָּדָד
  choice: peke yake
  rationale: Neno hili linaonyesha kuwa mtu ametengwa na wengine au yuko mwenyewe. “Peke yake” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: יֵשֵׁב
  choice: ataishi
  rationale: ישב linaweza kumaanisha kuketi, kukaa, au kuishi mahali. Hapa sheria inahusu makazi ya mtu, kwa hiyo “ataishi” hutoa maana inayokusudiwa kwa Kiswahili cha kawaida.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nje ya kambi
  rationale: Hii ni tafsiri ya moja kwa moja na iliyo wazi katika mazingira ya kambi ya Israeli.
- source_word: מוֹשָׁבוֹ
  choice: makao yake
  rationale: מוֹשָׁב humaanisha mahali pa kukaa au kuishi. “Makao yake” ni fupi, yenye heshima, na inadumisha maana ya mahali anapoishi.
theological_decisions:
- issue: Asili ya unajisi katika Mambo ya Walawi 13
  choice: Kutafsiri טמא kuwa “najisi” bila kuongeza “kiibada” au “kimaadili” katika matini kuu.
  alternative: najisi kiibada
  rationale: Aya inaeleza hadhi ya unajisi chini ya sheria ya Walawi, si lazima hatia ya kimaadili. “Najisi” inadumisha istilahi ya matini na mvutano wake bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Marudio “atakuwa najisi. Yeye ni najisi” yamehifadhiwa ili kudumisha msisitizo wa Kiebrania; “ataishi peke yake” huepuka lugha ya kitabibu kupita kiasi.
