    issue: “upele wa kichwani” is too narrow for נֶתֶק.
    rationale: The Hebrew noun denotes a particular condition associated with hair-bearing areas and is addressed in a section that includes the head or beard. Calling it only a scalp rash excludes the beard-area reference and introduces an unwarranted anatomical restriction.
