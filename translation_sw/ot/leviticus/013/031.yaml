  naturalness: The draft is generally clear and idiomatic. Recasting the opening as “Kuhani akichunguza...” makes the conditional sequence smoother and avoids the slightly heavy “Naye ... na akaona kwamba.”
  terminology: “Sehemu iliyoathiriwa” is an appropriate neutral rendering of נֶגַע, “nywele nyeusi” accurately retains the specified colour, and “atenga ... kwa siku saba” suitably renders the procedural isolation. The terminology for נֶתֶק should not be limited to the head.
