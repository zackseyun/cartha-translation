  to: Kuhani akichunguza sehemu iliyoathiriwa na upele wa sehemu yenye nywele[a], na kuona kwamba mwonekano wake haujazama chini ya ngozi, wala hakuna nywele nyeusi ndani yake, basi kuhani ataitenga sehemu iliyoathiriwa na upele huo kwa siku saba.
