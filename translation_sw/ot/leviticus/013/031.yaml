  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִֽי יִרְאֶ֨ה הַ/כֹּהֵ֜ן אֶת נֶ֣גַע הַ/נֶּ֗תֶק וְ/הִנֵּ֤ה אֵין מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וְ/שֵׂעָ֥ר שָׁחֹ֖ר אֵ֣ין בּ֑/וֹ וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת נֶ֥גַע הַ/נֶּ֖תֶק שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: sw
  text: Kuhani akichunguza sehemu iliyoathiriwa na upele wa sehemu yenye nywele[a], na kuona kwamba mwonekano wake haujazama chini ya ngozi, wala hakuna nywele nyeusi ndani yake, basi kuhani ataitenga sehemu iliyoathiriwa na upele huo kwa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upele unaosababisha nywele kungʼoka.” Neno la Kiebrania נֶתֶק linataja hali maalumu ya ngozi katika sehemu yenye nywele, kama kichwani au kwenye ndevu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: sehemu iliyoathiriwa
  rationale: Katika muktadha wa uchunguzi wa Walawi 13, neno hili linaonyesha eneo la mwili lenye hali inayoonekana; tafsiri hii ni wazi bila kulifanya moja kwa moja kuwa tauni au ugonjwa maalumu.
- source_word: נֶתֶק
  choice: upele wa kichwani
  rationale: Neno hili linataja hali maalumu inayotokea kwenye sehemu yenye nywele, hasa kichwani au kwenye ndevu, na inayohusishwa na kupotea kwa nywele. 'Upele wa kichwani' ni usemi wa kawaida unaoeleweka, huku tanbihi ikihifadhi upeo mpana wa neno.
- source_word: מַרְאֵהוּ
  choice: haionekani
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida tathmini ya mwonekano inayofanywa na kuhani.
- source_word: עָמֹק מִן־הָעוֹר
  choice: imezama chini ya ngozi
  rationale: Hueleza kwamba eneo hilo kwa mwonekano liko chini ya usawa wa ngozi, na ni usemi wa kawaida zaidi kuliko tafsiri ya neno kwa neno ya 'kina kuliko ngozi'.
- source_word: שֵׂעָר שָׁחֹר
  choice: nywele nyeusi
  rationale: Huhifadhi rangi mahsusi iliyotajwa katika Kiebrania kama kigezo cha uchunguzi.
- source_word: וְהִסְגִּיר
  choice: ataitenga
  rationale: Katika sheria hii, kitenzi kinamaanisha kuweka eneo au mtu katika hali ya kutengwa kwa muda ili kuchunguzwa tena; 'ataitenga' ni wazi na hakiongezi dhana za kisasa za karantini.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wa kutengwa.
- source_word: וְכִי
  choice: Naye ... aki-
  rationale: Muundo huu huhifadhi uhusiano na masharti yaliyotangulia na kuanzisha hali ya masharti kwa Kiswahili cha kawaida.
- source_word: יִרְאֶה
  choice: akiichunguza
  rationale: Ingawa kimsingi ni 'akiona,' muktadha wa kisheria unaonyesha uchunguzi rasmi wa kuhani.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka wazi lugha ya uchunguzi wa kikuhani bila kutumia istilahi nzito za kitabibu. Kirejeshi katika 'ataitenga sehemu' kimehifadhiwa kwa kufuata kitu kinachotajwa moja kwa moja katika Kiebrania, ingawa katika utekelezaji kutengwa huko kunamhusu mwenye eneo lililoathiriwa.
