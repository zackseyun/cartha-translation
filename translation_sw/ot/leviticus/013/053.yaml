base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: sw
  text: Lakini kama kuhani atachunguza na kuona kwamba alama hiyo haijaenea katika vazi, wala katika nyuzi za mtande, wala katika nyuzi za mshazari[a], wala katika kifaa chochote cha ngozi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, nyuzi zinazopita kwa upana katika kitambaa kilichofumwa.
    reason: Ufafanuzi wa istilahi ya ufumaji “mshazari,” ambayo huenda isifahamike kwa wasomaji wote.
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ... aki-
  rationale: Muundo huu unaendeleza sharti la utaratibu uliotangulia huku ‘Lakini’ ikionyesha tofauti ndogo na hali iliyotajwa kabla.
- source_word: יִרְאֶה הַכֹּהֵן
  choice: kuhani akichunguza
  rationale: Ingawa kitenzi יִרְאֶה kwa msingi humaanisha ‘kuona,’ hapa kinahusu ukaguzi rasmi unaofanywa na kuhani; ‘akichunguza’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְהִנֵּה
  choice: na kumbe
  rationale: ‘Kumbe’ huvuta fikira kwenye hali inayobainika baada ya uchunguzi bila kutumia usemi mzito au usio wa kawaida.
- source_word: לֹא פָשָׂה
  choice: haujaenea
  rationale: Kitenzi פשה katika muktadha huu kinaonyesha kuenea kwa hali yenye kuathiri kitu.
- source_word: הַנֶּגַע
  choice: uharibifu huo
  rationale: נגע hapa ni hali au sehemu iliyoathirika katika kitambaa au ngozi. ‘Uharibifu’ ni neno pana linaloeleweka na halilazimishi utambuzi mahususi wa kitabibu.
- source_word: בַּבֶּגֶד
  choice: katika vazi
  rationale: ‘Vazi’ ni tafsiri ya kawaida ya בגד, na ‘katika’ inafaa kwa hali iliyo ndani ya nyenzo hiyo.
- source_word: בַשְּׁתִי
  choice: katika nyuzi za mtande
  rationale: ‘Nyuzi za mtande’ ni nyuzi zinazoelekea kwa urefu katika ufumaji na zinawasilisha istilahi ya kiufundi ya Kiebrania.
- source_word: בָעֵרֶב
  choice: katika nyuzi za mshazari
  rationale: ‘Nyuzi za mshazari’ ni nyuzi zinazopita kwa upana katika kitambaa kilichofumwa, kinyume cha nyuzi za mtande.
- source_word: בְּכָל כְּלִי עוֹר
  choice: katika kitu chochote cha ngozi
  rationale: כְּלִי ni neno pana kwa chombo, kifaa, au kitu kilichotengenezwa; ‘kitu chochote cha ngozi’ huhifadhi upana huo kwa Kiswahili cha sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mfululizo wa ‘wala ... wala’ unaonyesha kwa uwazi kwamba kila aina ya nyenzo imo ndani ya hali ya sharti. Alama ya koma mwishoni imehifadhiwa kwa sababu sentensi ya sharti inaendelea katika mstari unaofuata.
