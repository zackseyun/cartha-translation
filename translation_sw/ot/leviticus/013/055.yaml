  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka kwa msomaji wa kawaida. Istilahi ya kisheria na kiibada “najisi” imehifadhiwa, huku maneno adimu ya uharibifu na nyuso za kitu yakitafsiriwa kwa uwazi na utata wake kuwekwa katika tanbihi.
