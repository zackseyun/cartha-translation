  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: sw
  text: Kisha kuhani atakichunguza baada ya sehemu iliyoathirika kuoshwa. Ikiwa sehemu hiyo haijabadilisha mwonekano wake[a] wala haijaenea, kitu hicho ni najisi. Utaiteketeza kwa moto; ni doa linaloharibu[b], iwe upande wake wa nyuma au wa mbele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haijabadilika rangi.” Kiebrania kinasema kihalisi, “haijabadilisha jicho lake,” yaani, hali yake inayoonekana.
    reason: lexical_alternative
  - marker: b
    text: Au, “uharibifu unaotafuna.” Neno la Kiebrania ni adimu na linamaanisha kuharibika kunakokula au kuteketeza kitu.
    reason: lexical_alternative
  - marker: c
    text: Maneno ya mwisho ni magumu. Kihalisi yanahusisha “upara wake wa nyuma” na “upara wake wa mbele.” Katika muktadha wa nguo au ngozi, huenda yanarejelea nyuso au sehemu mbili za kitu, lakini maana hususa haijulikani kwa uhakika.
    reason: textual_difficulty
lexical_decisions:
- source_word: וְרָאָה
  choice: atakichunguza
  rationale: Katika sheria za kikuhani, kitenzi hiki humaanisha kukagua au kuchunguza kwa makini, si kuona tu.
- source_word: הַנֶּגַע
  choice: sehemu iliyoathirika
  rationale: Neno hili hapa linataja eneo lenye tatizo katika nguo au ngozi; tafsiri hii haidai kwamba ni ugonjwa maalumu wa kisasa.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: haijabadilika mwonekano
  rationale: Nahau ya Kiebrania, kihalisi ‘haijabadilisha jicho lake,’ inahusu hali inayoonekana na huenda hasa rangi.
- source_word: לֹא פָשָׂה
  choice: haijaenea
  rationale: Kitenzi kinamaanisha kuenea au kupanuka kwa eneo lililoathirika.
- source_word: טָמֵא הוּא
  choice: kitu hicho ni najisi
  rationale: ‘Najisi’ ni istilahi ya kawaida ya Kiswahili kwa hali ya kutokuwa safi kiibada katika sheria za Walawi.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Utaiteketeza kwa moto
  rationale: Kauli ya nafsi ya pili umoja imehifadhiwa kama agizo la moja kwa moja; ‘teketeza’ huonyesha kuharibiwa kabisa kwa kuchomwa.
- source_word: פְּחֶתֶת
  choice: uharibifu unaokula
  rationale: Neno adimu linaashiria kuharibika kunakoendelea na kuteketeza kitu; tafsiri hii huepuka kulitambulisha bila msingi kuwa ukungu au ugonjwa fulani.
- source_word: בְּקָרַחְתּוֹ א֥וֹ בְגַבַּחְתּוֹ
  choice: upande wake wa ndani au wa nje
  rationale: Katika muktadha wa nguo au ngozi, jozi hii inaeleweka kwa kawaida kuwa nyuso mbili za kitu, ingawa maneno yake yametolewa kwa sitiari kutoka sehemu zilizo wazi za kichwa; utata umeelezwa katika tanbihi.
