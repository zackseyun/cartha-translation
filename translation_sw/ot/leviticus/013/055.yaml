  to: Kisha kuhani atakichunguza baada ya sehemu iliyoathirika kuoshwa. Ikiwa sehemu hiyo haijabadilisha mwonekano wake[a] wala haijaenea, kitu hicho ni najisi. Utaiteketeza kwa moto; ni doa linaloharibu[b], iwe upande wake wa nyuma au wa mbele.[c]
  rationale: Marekebisho yanasahihisha muundo wa Kiswahili katika kauli ya mwonekano, yanaboresha usemi wa פְּחֶתֶת, na zaidi ya yote yanaondoa ufafanuzi usio na uhakika wa “ndani au nje” ili kuhifadhi utata wa jozi ya Kiebrania. Tanbihi imeandikwa upya ili ieleze ugumu huo kwa usahihi bila kudai suluhisho moja.
