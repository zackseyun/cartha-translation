base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: sw
  text: Kuhani atamchunguza siku ya saba. Ikiwa alama hiyo imeenea katika ngozi, kuhani atamtangaza kuwa najisi; hiyo ni alama ya ugonjwa wa ngozi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kawaida neno hili limetafsiriwa “ukoma.” Neno la Kiebrania linahusu kwa upana zaidi hali ya ngozi katika sheria za Israeli kuhusu usafi wa kiibada, wala si lazima ugonjwa wa kisasa wa ukoma (ugonjwa wa Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: atamchunguza
  rationale: Ingawa kitenzi ראה kwa kawaida humaanisha ‘kuona,’ katika utaratibu huu wa kikuhani kinamaanisha kumkagua au kumchunguza mtu.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada na sheria za Walawi.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha kisasa.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: ikiwa ... imeenea kweli
  rationale: Neno ‘kweli’ linawakilisha msisitizo wa muundo wa Kiebrania wenye kitenzi-jina pamoja na kitenzi kamili.
- source_word: בָּעוֹר
  choice: katika ngozi
  rationale: עוֹר humaanisha ngozi; ‘katika ngozi’ inadumisha namna chanzo kinavyoeleza kuenea kwa dalili hiyo.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: atamtangaza kuwa najisi
  rationale: Kuhani anatoa uamuzi rasmi kuhusu hali ya kiibada; hamfanyi mtu huyo awe najisi kwa kitendo chake.
- source_word: נֶגַע
  choice: dalili
  rationale: Katika Walawi 13 neno hili hutaja eneo au alama inayoonekana iliyoathiriwa. ‘Dalili’ ni ya kawaida na haidai kwa usahihi kupita kiasi kwamba ni maambukizo ya kitabibu.
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno hili la Kiebrania lina maana pana kuliko ukoma wa kisasa (ugonjwa wa Hansen); katika muktadha huu linahusu hali mbaya ya ngozi inayotathminiwa chini ya sheria za usafi wa kiibada.
- source_word: הִוא
  choice: hiyo ni
  rationale: Kiwakilishi kinatambulisha hali iliyoelezwa kuwa dalili ya צָרַעַת; ‘hiyo ni’ ni ya asili katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya צָרַעַת katika sheria za usafi wa kiibada
  choice: ugonjwa wa ngozi
  alternative: ukoma; ugonjwa unaonajisi wa ngozi
  rationale: ‘Ukoma’ unaweza kueleweka kimakosa kuwa ugonjwa wa Hansen pekee. Tafsiri pana inalinda upeo wa neno la Kiebrania bila kuingiza utambuzi wa kitabibu wa kisasa, huku tanbihi ikihifadhi tafsiri ya jadi.
- issue: Jukumu la kuhani katika וְטִמֵּא אֹתוֹ
  choice: atamtangaza kuwa najisi
  alternative: atamfanya kuwa najisi
  rationale: Kauli hii inaonyesha uamuzi rasmi wa hali ya usafi wa kiibada, si kwamba kuhani ndiye anayesababisha hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Najisi’ limehifadhiwa kwa sababu ni neno linalotambulika katika muktadha wa usafi wa kiibada. Muundo umegawanywa katika sentensi mbili kama chanzo, na msisitizo wa Kiebrania umeonyeshwa kwa ‘kweli.’
