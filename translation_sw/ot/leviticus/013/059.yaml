id: LEV.13.59
reference: Leviticus 13:59
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: sw
  text: Hii ndiyo sheria kuhusu doa la ukoma[a] katika vazi la sufu au la kitani, au katika nyuzi za mtande au za mshazari[b], au katika kitu chochote cha ngozi, ili kukitangaza kuwa safi au najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “ukoma” ni pana kuliko ugonjwa wa kisasa wa Hansen; katika sura hii linaweza pia kutaja athari inayoonekana katika mavazi na vitu vya ngozi.
    reason: lexical_clarification
  - marker: b
    text: Mtande ni nyuzi zinazoenda kwa urefu katika kitambaa; mshazari ni nyuzi zinazopita kwa upana.
    reason: technical_term_clarification
lexical_decisions:
- source_word: תּוֹרַת
  choice: sheria kuhusu
  rationale: Neno hili linaanzisha kanuni na utaratibu unaotawala kesi zilizotangulia; “sheria kuhusu” linaonyesha kwa kawaida uhusiano wa muundo wa Kiebrania.
- source_word: נֶגַע צָרַעַת
  choice: doa la ukoma
  rationale: נֶגַע humaanisha alama au sehemu iliyoathirika inayoonekana. Katika muktadha wa mavazi na ngozi, “doa” ni la kawaida kuliko “mlipuko,” huku “ukoma” likihifadhi istilahi ya kimapokeo bila kudai kuwa ni ugonjwa wa kisasa wa Hansen; ufafanuzi umewekwa katika tanbihi.
- source_word: בֶּגֶד הַצֶּמֶר א֣וֹ הַפִּשְׁתִּים
  choice: vazi la sufu au la kitani
  rationale: Muundo sambamba unaonyesha vazi lililotengenezwa kwa sufu au kitani; kurudia “vazi” si lazima katika Kiswahili.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: nyuzi za mtande au za mshazari
  rationale: Hizi ni istilahi za ufumaji kwa nyuzi zinazoenda kwa urefu na zile zinazopita kwa upana. Kuongeza “nyuzi” kunafanya maana iwe wazi.
- source_word: כָּל כְּלִי עוֹר
  choice: kitu chochote cha ngozi
  rationale: כְּלִי ni neno pana kwa chombo, kifaa, au kitu; tafsiri hii inadumisha upana huo kwa Kiswahili cha kawaida.
- source_word: לְטַהֲרוֹ א֥וֹ לְטַמְּאוֹ
  choice: ili kukitangaza kuwa safi au najisi
  rationale: Katika sheria hii maneno hayo yanahusu uamuzi wa hadhi ya kiibada, si tendo la kukiosha au kukichafua. “Kutangaza” linaonyesha kazi hiyo ya kuhukumu.
theological_decisions:
- issue: Maana ya צָרַעַת inapohusishwa na mavazi na vitu vya ngozi
  choice: ukoma, pamoja na tanbihi inayofafanua upana wa istilahi ya Kiebrania
  alternative: ugonjwa wa ngozi; uchafu unaonajisi; tsaraati
  rationale: Istilahi ya Kiebrania ni pana kuliko ukoma wa kisasa na hapa inatumika kwa vitu visivyo na ngozi ya binadamu. Tafsiri ya kimapokeo inadumishwa kwa kutambulika, lakini tanbihi inazuia usahihi wa kitabibu usiokuwamo katika matini.
- issue: לְטַהֲרוֹ na לְטַמְּאוֹ kama uamuzi wa kiibada
  choice: kukitangaza kuwa safi au najisi
  alternative: kukisafisha au kukifanya najisi
  rationale: Muktadha unahusu kuhani kuamua hadhi ya kitu. Tafsiri iliyochaguliwa haibadilishi uamuzi huo kuwa kitendo cha kimwili au chanzo cha unajisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za ufumaji zimefafanuliwa kwa tanbihi, na “najisi” limetumiwa kwa hadhi ya kiibada.
