  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: sw
  text: Lakini siku ambayo nyama hai itakapoonekana mwilini mwake, atakuwa najisi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Lakini siku ... itakapo-
  rationale: Kiunganishi וּ kinaendeleza hoja kwa utofautishaji wa hali iliyotangulia; muundo wa Kiswahili wenye 'siku ... itakapo-' unawakilisha maana ya wakati.
- source_word: הֵרָאוֹת
  choice: itakapoonekana
  rationale: Infinitivi ya Nifali ya ראה ina maana ya kuonekana; umbo hili la Kiswahili ni la kawaida na linaendana na muktadha wa masharti.
- source_word: בָּשָׂר חַי
  choice: nyama hai
  rationale: Tafsiri ya moja kwa moja ya kirai kinachoeleza nyama/tishu yenye uhai, kwa kulinganisha na eneo lililobadilika la ngozi.
- source_word: בּוֹ
  choice: ndani yake
  rationale: Kiwakilishi cha kiume katika Kiebrania kinaweza kurejelea hali au eneo lililoelezwa katika muktadha; 'ndani yake' huhifadhi rejeleo hilo bila kulibadili kuwa 'ndani yake mtu'.
- source_word: יִטְמָא
  choice: atakuwa najisi
  rationale: Qal imperfect ya טמא hapa hutangaza hali ya unajisi wa kiibada; 'atakuwa najisi' ni usemi wa kawaida wa kibiblia na haumaanishi uchafu wa kawaida tu.
theological_decisions:
- issue: Aina ya unajisi
  choice: najisi
  alternative: mchafu
  rationale: Neno 'najisi' huhifadhi dhana ya kisheria na kiibada ya Walawi bila kuidunisha kuwa uchafu wa kimwili pekee.
- issue: Rejeleo la בּוֹ
  choice: ndani yake
  alternative: ndani yake mtu
  rationale: Muktadha wa karibu unaelekeza kwenye eneo au hali ya ugonjwa; tafsiri hii pia inafuata ushahidi wa matini bila kulazimisha rejeleo la mtu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi fupi imehifadhi muundo wa masharti na msamiati wa kisheria wa kitabu cha Walawi.
