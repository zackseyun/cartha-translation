translation:
  language: sw
  text: Mwanamume akipoteza nywele za kichwa chake[a], ana upara; yeye ni safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamume akawa mwenye upara kichwani.” Kitenzi cha Kiebrania kinaweza kumaanisha kichwa kuwa bila nywele au nywele kuondolewa; maandishi makuu yanahifadhi tofauti kati ya kitenzi hiki na kauli inayofuata, “ana upara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: mwanamume
  rationale: Nomino ya Kiebrania ni ya kiume, umoja, na inaanzisha mfano wa kisheria unaohusu hali ya mwili; “mwanamume” huhifadhi rejeleo hilo kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: ikiwa
  rationale: Katika muktadha huu wa uchunguzi wa kisheria, neno hili linaanzisha sharti; “ikiwa” ni la kawaida na sahihi.
- source_word: יִמָּרֵט
  choice: atapoteza nywele
  rationale: Niphal ya מרט ina wazo la kuwa wazi au kuondolewa nywele. Tafsiri hii haitaji sababu ya kupotea kwa nywele na huhifadhi tofauti na kauli inayofuata, “ni mwenye upara.”
- source_word: רֹאשׁוֹ
  choice: za kichwa chake
  rationale: Huwasilisha kwa uwazi uhusiano wa nywele na kichwa chake.
- source_word: קֵרֵחַ
  choice: mwenye upara
  rationale: Ni usemi wa asili na wenye heshima katika Kiswahili cha sasa kwa hali ya kutokuwa na nywele kichwani.
- source_word: טָהוֹר
  choice: safi
  rationale: Katika Walawi 13, neno hili linamaanisha hadhi ya kiibada baada ya uchunguzi, si usafi wa kimaadili.
- source_word: הוּא ... הוּא
  choice: yeye ni ... yeye ni
  rationale: 'Kurudia kiwakilishi kunahifadhi msisitizo wa sentensi mbili za Kiebrania: hali ya upara na hukumu ya kuwa safi.'
theological_decisions:
- issue: Istilahi ya hadhi ya kiibada katika sheria za unajisi za Walawi
  choice: safi
  alternative: tak­atifu / asiye na unajisi
  rationale: “Safi” huhifadhi kundi la kiibada linalokusudiwa hapa bila kulifanya kuwa dai la utakatifu au kutokuwa na kosa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti na urudiaji wa Kiebrania umehifadhiwa bila kufanya sentensi kuwa ngumu.
