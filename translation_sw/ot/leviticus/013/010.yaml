  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: sw
  text: Kuhani atamchunguza, na tazama, kuna uvimbe mweupe[a] katika ngozi, nao umegeuza nywele kuwa nyeupe, na katika uvimbe huo kuna sehemu ya nyama hai iliyo wazi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu iliyoinuka” badala ya “uvimbe.” Neno la Kiebrania שְׂאֵת ni istilahi inayotumiwa katika sura hii kwa kidonda kilichoinuka kwenye ngozi.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “sehemu ya nyama hai”; kirai hiki kinaelezea tishu hai iliyo wazi ndani ya uvimbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: atamchunguza
  rationale: Katika sheria hii ya uchunguzi, kitenzi ראה kinamaanisha kutazama kwa makini ili kutathmini hali ya ngozi, si kuona tu.
- source_word: הַכֹּהֵן
  choice: Kuhani
  rationale: Hili ndilo jina la kawaida la כֹּהֵן, naye ndiye mwenye mamlaka ya kufanya uchunguzi katika muktadha huu.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Hudumisha nguvu ya neno la Kiebrania linaloelekeza fikira kwenye yale yanayoonekana wakati wa uchunguzi.
- source_word: שְׂאֵת
  choice: uvimbe
  rationale: Neno hili ni istilahi ya kidonda au sehemu iliyoinuka kwenye ngozi katika Walawi 13; “uvimbe” ni wazi na ya kawaida katika Kiswahili.
- source_word: לְבָנָה
  choice: mweupe
  rationale: Kivumishi hiki cha rangi kinaeleza uvimbe.
- source_word: בָּעוֹר
  choice: katika ngozi
  rationale: עוֹר ni ngozi, na kihusishi kinaonyesha kwamba hali hiyo iko katika tishu ya ngozi.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: nao umegeuza nywele kuwa nyeupe
  rationale: Kiwakilishi cha kike kinarejelea uvimbe; tafsiri hii inadumisha uvimbe kama kisababishi cha mabadiliko ya nywele.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: na kuna sehemu ya nyama hai iliyo wazi
  rationale: Kirai kinaashiria tishu hai iliyoonekana wazi ndani ya kidonda. “Nyama mbichi” ingeweza kueleweka kama nyama isiyopikwa, hivyo “nyama hai iliyo wazi” ni ya asili na sahihi zaidi katika Kiswahili.
- source_word: בַּשְׂאֵת
  choice: katika uvimbe huo
  rationale: Inarudia istilahi שְׂאֵת na kubainisha mahali ilipo sehemu ya nyama hai.
