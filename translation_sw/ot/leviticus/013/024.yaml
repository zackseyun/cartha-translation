lexical_decisions:
- source_word: אוֹ
  choice: Au mtu akiwa
  rationale: Neno hili linaanzisha hali nyingine katika maagizo ya uchunguzi; muundo wa masharti unasikika kwa kawaida katika Kiswahili.
- source_word: בָשָׂר
  choice: mtu
  rationale: Ingawa maana ya kawaida ni ‘nyama’ au ‘mwili,’ hapa neno hilo linamrejelea mtu mwenye jeraha. ‘Mtu’ huepuka usemi usio wa kawaida wa mwili kuwa na ngozi yake bila kubadili mhusika.
- source_word: בְּעֹרוֹ
  choice: kwenye ngozi yake
  rationale: Hueleza mahali jeraha lilipo, yaani juu ya ngozi ya mtu.
- source_word: מִכְוַת אֵשׁ
  choice: jeraha la kuungua kwa moto
  rationale: Ni jeraha lililosababishwa na moto; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וְהָיְתָה
  choice: ikawa
  rationale: Katika maelezo haya ya kisheria, kitenzi kinaendeleza hali inayochunguzwa.
- source_word: מִחְיַת הַמִּכְוָה
  choice: nyama mbichi katika jeraha hilo
  rationale: Usemi huu unamaanisha tishu hai au mbichi inayoonekana katika eneo lililoungua.
- source_word: בַּהֶרֶת
  choice: doa linalong‘aa
  rationale: Katika Walawi 13 neno hili humaanisha doa au eneo la ngozi linaloonekana kuwa angavu.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: jeupe lenye wekundu
  rationale: Huhifadhi mchanganyiko wa rangi nyeupe na wekundu bila kuamua kiwango chake kwa usahihi usiokuwapo katika Kiebrania.
- source_word: אוֹ לְבָנָה
  choice: au jeupe
  rationale: Huhifadhi chaguo la pili la rangi kwa uwazi.
