  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: sw
  text: Au mtu[a] akiwa na jeraha la kuungua kwa moto kwenye ngozi yake, na tishu hai ya jeraha hilo[b] ikawa doa angavu, jeupe lenye wekundu au jeupe,
  philosophy: optimal-equivalence
  footnotes:
