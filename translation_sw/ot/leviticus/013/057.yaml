  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: sw
  text: Lakini ikionekana tena katika vazi, au katika mtande, au katika mshazari[a], au katika kitu chochote cha ngozi, hiyo ni athari[b] inayoenea. Utateketeza kwa moto kitu chochote chenye athari hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mtande ni nyuzi zinazoelekea kwa urefu katika kitambaa; mshazari ni nyuzi zinazopita kwa upana.
    reason: lexical_clarification
  - marker: b
    text: Kiebrania negaʿ ni istilahi maalumu katika Mambo ya Walawi kwa doa au sehemu iliyoathirika; kwa mapokeo pia limetafsiriwa “pigo” au “alama ya ugonjwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: ikionekana tena
  rationale: Kauli ya masharti pamoja na Niphal ya ראה inaonyesha kwamba athari inaonekana tena baada ya hatua iliyotangulia; tafsiri hii ni ya kawaida na inadumisha muktadha wa ukaguzi.
- source_word: בֶּגֶד
  choice: vazi
  rationale: Neno hili humaanisha vazi au kitambaa katika sura hii; “vazi” ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: שְׁתִי
  choice: nyuzi za mtande
  rationale: Ni istilahi ya ufumaji kwa nyuzi zinazoelekea kwa urefu, na inatofautishwa wazi na עֵרֶב.
- source_word: עֵרֶב
  choice: nyuzi za mshazari
  rationale: Ni nyuzi zinazopita kwa upana katika ufumaji; maelezo ya tanbihi yanasaidia wasomaji wasiofahamu istilahi hiyo.
- source_word: כְּלִי עוֹר
  choice: kitu chochote kilichotengenezwa kwa ngozi
  rationale: Kirai cha Kiebrania ni kipana na kinaweza kumaanisha chombo, kifaa, au kitu kingine cha ngozi; tafsiri hii haikifungii kwa aina moja.
- source_word: פֹּרַחַת הִוא
  choice: hiyo ni athari inayoenea
  rationale: פרח kimsingi huhusiana na kuchipua au kustawi, lakini hapa kwa njia ya sitiari inaonyesha kuenea kwa hali hiyo; “inayoenea” huwasilisha maana katika Kiswahili cha kawaida.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Utateketeza kwa moto
  rationale: Huhifadhi agizo la moja kwa moja katika nafsi ya pili ya umoja na kueleza kikamilifu kuharibiwa kwa moto.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: kitu chochote chenye athari hiyo
  rationale: Muundo wa uhusiano unarejelea kwa upana kitu ambacho ndani yake kuna eneo lililoathirika; Kiswahili hiki ni cha asili na hakiongezi utambuzi wa kitabibu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye hadhi. Istilahi za ufumaji zimehifadhiwa kwa usahihi na kufafanuliwa katika tanbihi; lugha ya kitabibu isiyo katika chanzo imeepukwa.
