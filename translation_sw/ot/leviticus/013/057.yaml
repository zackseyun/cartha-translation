review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys recurrence, the textile/leather categories, the spreading character of the condition, and the command to burn the affected item. However, the Hebrew disjunctive sequence requires an explicit alternative between “vazi” and “mtande”; the draft currently joins them without “au,” which can imply that both are jointly intended.
  naturalness: The proposed revision is clear, idiomatic Standard East African Swahili, and retains an appropriately formal procedural register. Using the established textile terms directly avoids a somewhat heavy repeated “nyuzi za ...” construction while the footnote supplies the needed clarification.
  terminology: “Mtande” and “mshazari” suitably preserve the distinct warp/weft terminology. “Athari” remains acceptably broad for נגע in this object-related context and avoids imposing a modern medical diagnosis. The footnote should not characterize the term as inherently meaning ritual contamination; it denotes an afflicted mark/area in the Levitical procedure.
  issues:
  - severity: medium
    issue: Missing disjunctive “au” after “vazi”
    rationale: The source says “in the garment, or in the warp, or in the weft.” Without “au” after “vazi,” the Swahili wording may read “in the garment, in the warp or weft,” rather than preserving each alternative as separately listed.
  - severity: low
    issue: Footnote b overstates “kunajisika” as part of the lexical sense
    rationale: נגע is a technical term for an afflicted mark, lesion, or struck area in this context; ritual impurity may be a contextual consequence, but “kunajisika” is not a direct lexical equivalent and can blur the distinction.
  revised_text: Lakini ikionekana tena katika vazi, au katika mtande, au katika mshazari[a], au katika kitu chochote cha ngozi, hiyo ni athari[b] inayoenea. Utateketeza kwa moto kitu chochote chenye athari hiyo.
