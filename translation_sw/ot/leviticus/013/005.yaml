  verdict: revise
  source_fidelity: Rasimu inawasilisha kwa usahihi uchunguzi wa siku ya saba, kutokubadilika na kutokuenea kwa doa, pamoja na kutengwa kwa kipindi kingine. Hata hivyo, «kwa siku nyingine saba» inaweza kumaanisha tu siku saba za ziada bila kusisitiza wazi kuwa ni kipindi cha pili; שֵׁנִית inahitaji «mara ya pili». Pia וְהִנֵּה ina kazi ya kuvuta fikira («na tazama») badala ya kuanzisha sharti jipya kwa «Akiona kwamba».
  naturalness: «Halijabadilika kwa jinsi linavyoonekana kwake» inaeleweka lakini ni ya mzigo na «kwake» ina rejeo lisilo wazi kwa usomaji wa haraka. «Halijabadilika kwa mtazamo wa kuhani» ni ya asili, wazi, na bado huhifadhi kwamba tathmini ni ya kuhani.
  terminology: «Doa» ni chaguo salama kwa נֶגַע katika muktadha huu na huepuka kudai utambuzi wa kitabibu. «Atamtenga» linafaa kwa וְהִסְגִּירוֹ. Tanbihi ya mbadala «atamfunga» ibadilishwe, kwa kuwa Kiswahili cha sasa huweza kusikika kama kumfunga kwa kamba badala ya kumzuia/kumfunga ndani.
