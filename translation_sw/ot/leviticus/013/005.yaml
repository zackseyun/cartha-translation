- from: Kuhani atamchunguza siku ya saba. Akiona kwamba doa[a] halijabadilika kwa jinsi linavyoonekana kwake[b], na halijaenea katika ngozi, kuhani atamtenga[c] kwa siku nyingine saba.
  to: Kuhani atamchunguza siku ya saba; na tazama, doa[a] halijabadilika kwa mtazamo wa kuhani[b], wala halijaenea katika ngozi. Kisha kuhani atamtenga[c] kwa siku saba mara ya pili.
  rationale: Marekebisho yanahifadhi alama ya msisitizo ya «na tazama», yanaweka wazi kuwa tathmini ya kutobadilika ni ya kuhani, na kutafsiri שֵׁנִית kwa wazi kama «mara ya pili». Tanbihi zimefanyiwa uboreshaji mdogo ili zibaki za asili katika Kiswahili Sanifu na zisiegeshe maana ya kitabibu au ya kumfunga kwa kamba.
