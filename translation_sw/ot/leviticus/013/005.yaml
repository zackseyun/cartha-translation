translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili iwe rahisi kusoma, huku mtiririko wa utaratibu wa kikuhani ukihifadhiwa. ‘Doa’ huepuka lugha ya kitabibu kupita kiasi, na ‘atamtenga’ huwasilisha hatua ya kiutaratibu bila kuiita karantini ya kisasa.
