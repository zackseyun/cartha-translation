base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: sw
  text: Kuhani atamchunguza siku ya saba; na tazama, doa[a] halijabadilika kwa mtazamo wa kuhani[b], wala halijaenea katika ngozi. Kisha kuhani atamtenga[c] kwa siku saba mara ya pili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alama” au “kidonda.” Neno la Kiebrania negaʿ linamaanisha doa au alama inayoonekana inayochunguzwa na kuhani, si lazima ugonjwa ulioainishwa kwa istilahi za kitabibu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “doa limesimama machoni pake,” yaani kwa mtazamo wa kuhani lilionekana kuwa halijabadilika.
    reason: lexical_alternative
  - marker: c
    text: Au “atamzuia”; kihalisi zaidi, “atamfunga ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: atamchunguza
  rationale: Ingawa kitenzi ראה kwa kawaida humaanisha ‘kuona,’ hapa kinahusu uchunguzi rasmi unaofanywa na kuhani.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Hii ni namna ya kawaida na wazi ya kuonyesha wakati maalumu wa uchunguzi unaofuata.
- source_word: וְהִנֵּה
  choice: akiona kwamba
  rationale: Katika muktadha huu wa masharti, kishazi hiki kinaelekeza kwenye matokeo ya uchunguzi. Tafsiri hii ni ya asili kwa Kiswahili, ingawa nguvu ya kihalisi ya ‘tazama’ imewasilishwa kwa mtazamo wa kuhani.
- source_word: הַנֶּגַע
  choice: doa
  rationale: Neno נגע hapa linataja alama au kidonda kinachoonekana na kuchunguzwa, bila kulifanya kwa lazima kuwa ugonjwa ulioainishwa kitabibu.
- source_word: עָמַד בְּעֵינָיו
  choice: halijabadilika kwa jinsi linavyoonekana kwake
  rationale: Hii inawasilisha maana ya nahau ya Kiebrania, kihalisi ‘limesimama machoni pake,’ yaani doa linaonekana kwa kuhani kuwa katika hali ileile.
- source_word: לֹא פָשָׂה
  choice: halijaenea
  rationale: Kitenzi hiki kinaonyesha kwamba eneo lililoathiriwa halijapanuka.
- source_word: בָּעוֹר
  choice: katika ngozi
  rationale: Inafuata maana ya kawaida ya עור na uhusiano wa eneo ambamo doa lingeweza kuenea.
- source_word: וְהִסְגִּירוֹ
  choice: atamtenga
  rationale: Kitenzi kinamaanisha kumfunga au kumweka kando. ‘Atamtenga’ linaeleza utaratibu huo bila kuingiza kwa lazima dhana ya kisasa ya karantini.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: kwa siku nyingine saba
  rationale: Hii inaonyesha wazi kwamba kipindi cha siku saba cha kutengwa kinarudiwa mara ya pili.
