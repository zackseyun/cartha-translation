source:
  edition: WLC
  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: sw
  text: Ikiwa mwanamume au mwanamke ana mabaka yanayong’aa kwenye ngozi ya mwili wake, mabaka meupe yanayong’aa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabaka meupe angavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: mwanamume au mwanamke
  rationale: Jozi hii inawataja wazi watu wa jinsia zote, na umoja usio bainifu unafaa mtindo wa masharti ya kisheria.
- source_word: כִּי יִהְיֶה
  choice: ikiwa ... ana
  rationale: Katika muktadha huu wa uchunguzi wa hali ya ngozi, כִּי huanzisha hali ya masharti; muundo wa Kiswahili ‘ikiwa ... ana’ ni wa kawaida na wazi.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: kwenye ngozi ya mwili wake
  rationale: עוֹר ni ‘ngozi,’ na בָּשָׂר hapa humaanisha mwili wa mtu. Kiwakilishi cha umoja ‘wake’ kinarejelea kwa kawaida mwanamume au mwanamke aliyetajwa.
- source_word: בֶּהָרֹת
  choice: mabaka yanayong’aa
  rationale: Nomino hii humaanisha alama au mabaka yenye mwonekano mwepesi au unaong’aa kwenye ngozi; ‘mabaka’ linafaa zaidi kwa eneo la ngozi kuliko ‘madoa’ katika muktadha huu.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: mabaka meupe yanayong’aa
  rationale: לְבָנוֹת hutaja rangi nyeupe. Kurudia ‘mabaka ... mabaka’ kunahifadhi urudiaji wa Kiebrania na maelezo ya uchunguzi.
