  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: sw
  text: Kuhani atamchunguza, na tazama, uvimbe wa ugonjwa huo ni mweupe wenye wekundu kwenye sehemu yenye upaa nyuma ya kichwa chake au kwenye sehemu yenye upaa mbele ya kichwa chake[b], kama mwonekano wa ugonjwa wa ngozi[a] kwenye ngozi ya mwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania צָרַעַת kwa kawaida limetafsiriwa “ukoma,” lakini katika Walawi linahusu aina mbalimbali za magonjwa makali ya ngozi, si ugonjwa wa Hansen pekee.
    reason: lexical_alternative
  - marker: b
    text: Maneno mawili ya upaa huenda yanatofautisha sehemu ya nyuma ya kichwa na sehemu ya mbele ya kichwa; tofauti hiyo imeonyeshwa wazi hapa.
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה
  choice: atamchunguza
  rationale: Katika utaratibu huu wa kikuhani, kitenzi ראה kinamaanisha kutazama kwa makini ili kutoa tathmini; wakati ujao unafaa kwa masharti ya kisheria ya muktadha.
- source_word: הַכֹּהֵן
  choice: Kuhani
  rationale: Hili ndilo neno la kawaida na wazi kwa mhudumu anayefanya uchunguzi katika Walawi 13.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Linahifadhi nguvu ya usemi unaoelekeza fikira kwenye jambo analoligundua kuhani.
- source_word: שְׂאֵת הַנֶּגַע
  choice: uvimbe wa ugonjwa huo
  rationale: שׂאת ni sehemu iliyoinuka au uvimbe, na נגע hapa ni hali ya ugonjwa inayochunguzwa.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: mweupe wenye wekundu
  rationale: Usemi huu wa asili unaunganisha rangi nyeupe na hali ya kuwa na wekundu bila kuamua kwa kupita kiasi ni rangi ipi inayotawala.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: kwenye sehemu yenye upaa nyuma ya kichwa chake au kwenye sehemu yenye upaa mbele ya kichwa chake
  rationale: Maneno hayo mawili yanatofautisha kwa uwezekano mkubwa upaa wa sehemu ya nyuma na upaa wa sehemu ya mbele ya kichwa; tafsiri hii inahifadhi tofauti hiyo kwa Kiswahili kinachoeleweka.
- source_word: כְּמַרְאֵה
  choice: kama mwonekano wa
  rationale: Linahifadhi lugha ya ulinganisho inayotumiwa katika uchunguzi.
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno hili la Kiebrania linahusu kundi pana la hali nzito za ngozi katika Walawi, si lazima ugonjwa wa Hansen pekee.
- source_word: עוֹר בָּשָׂר
  choice: mwilini
  rationale: Katika muktadha wa 'ugonjwa wa ngozi,' neno hili linaonyesha kwa njia ya kawaida kwamba hali hiyo iko kwenye ngozi ya mwili.
