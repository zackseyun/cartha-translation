  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: sw
  text: au katika nyuzi za mtande au nyuzi za mshazari, za kitani au za sufu, au katika ngozi, au katika kitu chochote kilichotengenezwa kwa ngozi—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: nyuzi za mtande
  rationale: Neno hili linamaanisha nyuzi zinazokwenda kwa urefu katika ufumaji. ‘Nyuzi za mtande’ ni istilahi ya kawaida na iliyo wazi kwa Kiswahili.
- source_word: עֵרֶב
  choice: nyuzi za mshazari
  rationale: Neno hili linamaanisha nyuzi zinazopita kwa upana na kufumwa katika nyuzi za mtande. ‘Nyuzi za mshazari’ huhifadhi maana ya kiufundi bila kutegemea neno lisiloeleweka kwa urahisi.
- source_word: לַפִּשְׁתִּים
  choice: za kitani
  rationale: Ingawa neno la Kiebrania linaweza kumaanisha mmea wa kitani, katika muktadha wa nyuzi na vitu vinavyokaguliwa linarejelea nyenzo ya kitani.
- source_word: וְלַצָּמֶר
  choice: au sufu
  rationale: צֶמֶר humaanisha sufu. Kiunganishi kimetafsiriwa kwa ‘au’ kulingana na kazi yake katika orodha hii ya njia mbadala.
- source_word: עוֹר
  choice: ngozi
  rationale: Katika sheria hizi neno linarejelea ngozi ya mnyama inayotumiwa kama nyenzo. ‘Ngozi’ ni neno la kawaida la Kiswahili na linafaa pia kwa bidhaa zilizotengenezwa kwa nyenzo hiyo.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: katika kitu chochote kilichotengenezwa kwa ngozi
  rationale: מְלָאכָה hapa ni kitu kilichotengenezwa, si kazi kwa maana ya shughuli. Tafsiri hii ni ya kawaida, wazi, na huhifadhi wigo wa ‘chochote.’
- source_word: אוֹ ... אוֹ
  choice: au ... au
  rationale: Kurudia ‘au’ kunahifadhi muundo wa orodha ya Kiebrania na kuonyesha maeneo au nyenzo mbadala.
