  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za ufumaji zimeelezwa kwa ‘nyuzi za’ ili kupunguza utata. Mstari ni kipande cha sentensi kinachoendelea kutoka mstari uliotangulia, kwa hiyo umeanza kwa herufi ndogo na kuishia kwa kistari kirefu.
