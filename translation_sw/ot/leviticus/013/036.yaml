base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: sw
  text: 36 Kuhani akimchunguza, akiona kwamba upele wenye magamba[a] umeenea kwenye ngozi, hahitaji kuchunguza ikiwa kuna nywele za manjano; mtu huyo ni najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upele wa kuwasha.” Neno la Kiebrania linamaanisha hali ya ngozi yenye magamba, hasa ya kichwa au kidevu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ הַכֹּהֵן
  choice: Kuhani akimchunguza
  rationale: Katika sheria hii, ראה si kuona tu bali kufanya uchunguzi wa kikuhani. Muundo wa masharti unaendana na muktadha wa aya.
- source_word: וְהִנֵּה
  choice: na kuona kwamba
  rationale: Huwasilisha jambo linalobainika katika uchunguzi kwa Kiswahili cha kawaida bila kutumia mshangao usio wa lazima.
- source_word: פָּשָׂה
  choice: umeenea
  rationale: Hueleza kwa uwazi kuongezeka au kusambaa kwa tatizo la ngozi.
- source_word: הַנֶּתֶק
  choice: upele wenye magamba
  rationale: Neno hilo hutaja tatizo maalumu la ngozi ya kichwa au kidevu lenye uhusiano na nywele; tafsiri hii ni elekezi bila kulilinganisha kwa uhakika na ugonjwa wa kisasa.
- source_word: בָּעוֹר
  choice: kwenye ngozi
  rationale: Ni usemi wa kawaida wa Kiswahili kwa tatizo linaloonekana au kuenea katika eneo la ngozi.
- source_word: לֹא יְבַקֵּר
  choice: hahitajiki kuchunguza ikiwa kuna
  rationale: Kanusho linaonyesha kwamba ishara hii ya ziada haihitaji kutafutwa mara kuenea kwa upele kumethibitishwa.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: nywele za manjano
  rationale: Ni tafsiri ya moja kwa moja ya ishara ya uchunguzi iliyotajwa mapema katika sura.
- source_word: טָמֵא הוּא
  choice: mtu huyo ni najisi
  rationale: Kiwakilishi kinamhusu mtu aliyechunguzwa, na 'najisi' ni istilahi iliyozoeleka katika sheria za utakaso wa Walawi.
theological_decisions:
- issue: Maana ya טָמֵא katika sheria ya Walawi
  choice: najisi
  alternative: asiye safi
  rationale: Hali hii ni ya kiibada chini ya sheria ya utakaso, wala si lazima iwe hukumu ya hatia ya kimaadili. 'Najisi' huhifadhi maana hiyo ya kitaalamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa katika mfumo wa masharti unaofaa muktadha wa uchunguzi wa kikuhani. Istilahi ya ugonjwa imeelezwa kwa lugha inayoeleweka bila kuutambua kwa jina la kitabibu la kisasa.
