  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: sw
  text: Ni ugonjwa wa ngozi wa muda mrefu unaoathiri ngozi ya mwili wake[a]. Kuhani atamtangaza kuwa najisi; hatamtenga, kwa sababu yeye ni najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ugonjwa wa ngozi uliokuwapo kwa muda mrefu.” Tafsiri za mapokeo mara nyingi hutumia “ukoma” kwa צָרַעַת, lakini katika Mambo ya Walawi neno hilo la Kiebrania linahusu hali nyingi zaidi kuliko ukoma wa kisasa (ugonjwa wa Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno la Kiebrania linahusu aina mbalimbali za maradhi makubwa ya ngozi katika Mambo ya Walawi, si ugonjwa wa Hansen pekee; hivyo ‘ugonjwa wa ngozi’ huepuka umahususi wa kitabibu unaopotosha.
- source_word: נוֹשֶׁנֶת
  choice: wa muda mrefu
  rationale: Umbo hili linaeleza hali ya zamani au iliyodumu; msemo huu ni wa kawaida na unaeleweka kuliko istilahi ya kitabibu ‘sugu’.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: katika ngozi ya mwili wake
  rationale: Hufuata muundo wa chanzo kwa karibu huku ‘mwili’ ikiwa ya kawaida zaidi katika muktadha huu kuliko ‘nyama’.
- source_word: וְטִמְּאוֹ
  choice: atamtangaza kuwa najisi
  rationale: Kuhani haisababishi hali hiyo bali huitambua na kuitangaza rasmi katika utaratibu wa kikuhani.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya cheo hiki cha ibada.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: hatamweka kando kwa uchunguzi
  rationale: Kitenzi kinarejelea kumtenga mtu kwa kipindi cha uchunguzi. Msemo huu unaweka wazi kusudi lake bila kuleta dhana za kisasa za kitabibu zinazoweza kuambatana na ‘karantini’.
- source_word: כִּי טָמֵא הוּא
  choice: kwa sababu yeye ni najisi
  rationale: Ni kishazi cha sababu kinachoeleza kuwa kutengwa zaidi hakuhitajiki kwa kuwa hali yake tayari imethibitishwa.
theological_decisions:
- issue: Uwasilishaji wa istilahi ya unajisi wa kiibada
  choice: najisi
  alternative: asiye safi
  rationale: Katika Mambo ya Walawi, טמא ina maana ya hadhi ya kiibada na kisheria. ‘Najisi’ ni istilahi ya kibiblia iliyozoeleka na hapa haimaanishi kwamba mtu ana hatia ya kimaadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wa muda mrefu’ ni wa kawaida kuliko ‘sugu’; ‘kuweka kando kwa uchunguzi’ hufafanua utaratibu bila kuufanya usikike kama karantini ya kisasa. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
