base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: sw
  text: Kuhani atamchunguza, na akiona kwamba upele wenye magamba umeenea kwenye ngozi, kuhani atamtangaza kuwa najisi; huo ni ugonjwa wa ngozi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania tsaraʿat, ambalo kwa mapokeo limetafsiriwa “ukoma.” Katika Walawi huenda neno hili linahusu aina mbalimbali za magonjwa makubwa ya ngozi, si ukoma wa kisasa pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: atamchunguza
  rationale: Katika muktadha wa uchunguzi wa kikuhani, kitenzi hiki kinamaanisha kutazama kwa makini ili kutathmini hali, si kuona tu.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa כהן katika sheria za Walawi.
- source_word: וְהִנֵּה
  choice: akiona kwamba
  rationale: Katika utaratibu huu wa uchunguzi, neno hilo linatanguliza jambo linalobainika; usemi huu ni wa asili katika Kiswahili na unadumisha maana ya ugunduzi unaofuata uchunguzi.
- source_word: פָּשְׂתָה
  choice: umeenea
  rationale: Kitenzi kinaonyesha kuenea kwa hali hiyo, ambako ni kigezo muhimu cha uchunguzi katika sura hii.
- source_word: הַמִּסְפַּחַת
  choice: upele wenye magamba
  rationale: Neno hilo linaeleza tatizo la juu ya ngozi; tafsiri hii ni wazi kuliko 'kidonda' na inaonyesha hali yake yenye magamba bila kudai utambuzi mahususi wa kitabibu.
- source_word: בָּעוֹר
  choice: kwenye ngozi
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza mahali ambapo upele umeenea.
- source_word: וְטִמְּאוֹ
  choice: atamtangaza kuwa najisi
  rationale: Kuhani anatangaza rasmi hali ya mtu katika sheria za utakaso; hamfanyi awe najisi kwa tendo hilo.
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Katika muktadha huu neno la Kiebrania linaeleza hali ya ngozi, lakini halilingani kwa uhakika na ukoma wa kisasa; tanbihi inadumisha upana wa istilahi ya asili.
- source_word: הִוא
  choice: huo ni
  rationale: Kiwakilishi cha kike kinarejelea tatizo lililotajwa na kukitambulisha.
theological_decisions:
- issue: Jinsi ya kutafsiri צָרַעַת katika sheria za utakaso za Walawi
  choice: ugonjwa wa ngozi
  alternative: ukoma; ugonjwa wa ngozi unaotia unajisi; tsaraati
  rationale: Istilahi ya Kiebrania ina wigo mpana kuliko ugonjwa wa Hansen unaoitwa ukoma leo. Tafsiri iliyochaguliwa huepuka umahususi wa kitabibu usiothibitishwa huku ikidumisha muktadha wa uchunguzi wa ngozi na tangazo la unajisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unaonyesha uchunguzi rasmi wa kuhani na tangazo la hali ya unajisi bila kudokeza kwamba kuhani ndiye anayesababisha unajisi.
