lexical_decisions:
- source_word: נֶגַע
  choice: dalili
  rationale: Katika muktadha wa uchunguzi wa Walawi 13, neno hili linaonyesha hali au alama inayoonekana mwilini. “Dalili” ni ya kawaida na haidai kwamba hali hiyo lazima iwe maambukizi.
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno la Kiebrania lina maana pana kuliko ukoma wa kisasa (ugonjwa wa Hansen); tafsiri hii huepuka usahihi wa kitabibu usiokuwamo katika chanzo.
- source_word: כִּי תִהְיֶה בְּאָדָם
  choice: Mtu akiwa na
  rationale: Huu ni mwanzo wa sharti katika sheria ya kesi. Muundo huu ni wa asili katika Kiswahili na unawakilisha אָדָם kama mtu kwa maana ya jumla.
- source_word: וְהוּבָא
  choice: ataletwa
  rationale: Kauli ya kutendwa imehifadhiwa, pamoja na matokeo ya lazima ya utaratibu wa kisheria.
- source_word: אֶל הַכֹּהֵן
  choice: kwa kuhani
  rationale: “Kwa kuhani” ni njia ya kawaida ya Kiswahili kueleza kupelekwa kwa mtu mwenye jukumu la kumchunguza; chanzo kina kibainishi kinachomrejelea kuhani wa utaratibu huo.
theological_decisions:
- issue: Maana ya צָרַעַת
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: “Ukoma” unaweza kueleweka kimakosa kuwa ni ugonjwa wa Hansen pekee. “Ugonjwa wa ngozi” huhifadhi upana wa neno la kale, huku tanbihi ikitaja tafsiri ya jadi.
- issue: Uwakilishi wa אָדָם katika sheria ya umoja
  choice: mtu
  alternative: mwanadamu / mwanamume
  rationale: Hapa אָדָם humaanisha binadamu yeyote anayepatikana na hali hiyo, si mwanamume kwa kutofautisha na mwanamke. “Mtu” ni sahihi na ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sharti umewekwa kwa ufupi na kauli ya kutendwa ya chanzo imehifadhiwa.
