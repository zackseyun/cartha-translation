  text: Mtu akiwa na alama ya ugonjwa wa ngozi[a], ataletwa kwa kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania צָרַעַת limetafsiriwa kijadi kuwa “ukoma,” lakini huenda linahusu aina mbalimbali za magonjwa ya ngozi, si ugonjwa wa Hansen pekee.
