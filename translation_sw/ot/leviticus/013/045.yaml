base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: sw
  text: Mtu mwenye ugonjwa wa ngozi, aliye na ugonjwa huo, nguo zake zitararuliwa, nywele za kichwa chake zitaachwa ovyo, atafunika mdomo wake wa juu[a], naye atapaza sauti, “Najisi! Najisi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “masharubu yake.” Kiebrania kinarejelea mdomo wa juu au eneo la masharubu, lililofunikwa kama ishara ya maombolezo na onyo la hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: mtu mwenye ugonjwa wa ngozi
  rationale: Neno hili linamtaja mtu aliyeathiriwa na aina ya ugonjwa wa ngozi inayozungumziwa katika sura hii; halijawekewa maana finyu ya ugonjwa wa Hansen pekee.
- source_word: הַנֶּגַע
  choice: athari hiyo
  rationale: Hapa נגע ni hali au dalili inayoonekana inayosababisha hadhi ya unajisi. “Athari” huepuka kudokeza kwa lazima maambukizi ya vijidudu au aina maalumu ya kidonda.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: nguo zake zitararuliwa
  rationale: Kauli hii inahifadhi maana ya mavazi yaliyoraruliwa kama ishara ya wazi ya huzuni au taabu.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: nywele za kichwa chake zitaachwa ovyo
  rationale: פָרוּעַ hapa inaelekea kumaanisha nywele zilizoachwa bila kufungwa au kutunzwa, si kichwa kilichonyolewa au kuwa wazi.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: atafunika sehemu ya juu ya mdomo wake
  rationale: שָׂפָם inaweza kumaanisha mdomo wa juu au eneo la masharubu. Tafsiri hii inahifadhi rejeleo la sehemu ya uso bila kulazimisha maana moja pekee; mbadala umetolewa katika tanbihi.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: atapaza sauti, “Najisi! Najisi!”
  rationale: Kurudiwa kwa טָמֵא kunatoa tangazo la hadharani lenye mkazo. “Atapaza sauti” linaonyesha kwamba ni onyo linalotakiwa kusikika.
theological_decisions:
- issue: Maana ya טָמֵא katika sheria ya Walawi
  choice: najisi
  alternative: asiye safi; mwenye unajisi
  rationale: “Najisi” hapa inaonyesha hadhi ya kiibada na kijamii chini ya sheria, bila kudokeza kwamba mtu huyo ana hatia ya kimaadili au kwamba hali hiyo ni aina fulani ya ugonjwa kwa uainishaji wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa amri umehifadhiwa kwa vitenzi vya wakati ujao, na istilahi “najisi” imetumiwa kwa maana yake ya kiibada katika muktadha huu.
