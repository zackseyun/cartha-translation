base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: sw
  text: Lakini ikiwa doa jeupe linalong’aa[a] liko kwenye ngozi ya mwili wake, nalo halionekani kuwa na kina zaidi ya ngozi, na nywele zake hazijageuka kuwa nyeupe, basi kuhani atalitenga doa hilo[c] kwa siku saba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiraka cheupe kinachong’aa” au “alama nyeupe inayong’aa,” kwa doa la ngozi linaloelezwa hapa.
    reason: lexical_alternative
  - marker: b
    text: Au “ataliweka karantini”; Kiebrania kinamaanisha kulitenga kwa muda ili kuchunguzwa.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “kidonda” au “eneo lililoathirika”; hapa neno hilo linamaanisha doa au sehemu inayochunguzwa na kuhani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: doa jeupe linalong’aa
  rationale: Neno hili linamaanisha alama au kidonda cha ngozi kinachoonekana kwa weupe au mng’ao. Tafsiri hii ni ya kawaida na inalitofautisha na uvimbe uliotajwa katika muktadha wa karibu.
- source_word: לְבָנָה
  choice: jeupe
  rationale: Kivumishi hiki kinataja moja kwa moja rangi ya doa.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: kwenye ngozi ya mwili wake
  rationale: Hii inahifadhi maana ya anatomia ya msemo wa Kiebrania huku ikisikika kwa kawaida katika Kiswahili cha sasa.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: halionekani kuwa limeingia ndani kuliko ngozi
  rationale: Kifungu hiki kinaeleza kina kinachoonekana cha doa kwa kulinganisha na ngozi, jambo muhimu katika uchunguzi wa sura hii.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: nywele zilizomo hazijabadilika kuwa nyeupe
  rationale: ‘Nywele zilizomo’ huonyesha kwa kawaida nywele zilizo katika eneo la doa, na ‘hazijabadilika kuwa nyeupe’ huhifadhi wazo la kubadilika hali.
- source_word: וְהִסְגִּיר
  choice: atalitia chini ya uangalizi wa kutengwa
  rationale: Kitenzi kinamaanisha kutenga kwa muda ili hali ichunguzwe. Kauli hii inaeleza utaratibu huo bila kudokeza kifungo cha adhabu.
- source_word: אֶת־הַנֶּגַע
  choice: eneo lililoathirika
  rationale: Katika muktadha huu neno linahusu doa au eneo lenye hali inayochunguzwa, si lazima ugonjwa ambao tayari umethibitishwa.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha muda wa kutengwa na kuchunguzwa.
