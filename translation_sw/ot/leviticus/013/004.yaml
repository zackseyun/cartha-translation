  to: Lakini ikiwa doa jeupe linalong’aa[a] liko kwenye ngozi ya mwili wake, nalo halionekani kuwa na kina zaidi ya ngozi, na nywele zake hazijageuka kuwa nyeupe, basi kuhani atalitenga doa hilo[c] kwa siku saba.[b]
