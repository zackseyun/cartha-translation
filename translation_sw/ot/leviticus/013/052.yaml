base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: sw
  text: Naye ataichoma nguo hiyo[a], au nyuzi za mtande au nyuzi za kuvuka za sufu au za kitani, au kitu chochote cha ngozi chenye doa hilo. Kwa kuwa ni doa la tsaraati linaloharibu[b], lazima kichomwe kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maneno mawili ya Kiebrania yanayotafsiriwa hapa “nyuzi za mtande” na “nyuzi za kuvuka” ni istilahi za ufumaji: nyuzi zinazokwenda kwa urefu na nyuzi zinazopita kwa upana.'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania צָרַעַת (tsaraati), ambalo kwa mapokeo mara nyingi hutafsiriwa “ukoma,” hurejelea hali pana ya kiibada kuliko ugonjwa wa ukoma wa kisasa; linaweza pia kutumiwa kuhusu alama kwenye nguo na nyumba.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Ataichoma
  rationale: Katika mfululizo huu wa sheria, kitenzi kina nguvu ya agizo linaloeleza hatua inayofuata; wakati ujao wa Kiswahili unaeleza wajibu huo kwa kawaida.
- source_word: הַבֶּגֶד
  choice: nguo hiyo
  rationale: בגד ni neno la jumla kwa nguo; kiashiria “hiyo” kinaunganisha agizo hili na nguo iliyochunguzwa katika muktadha uliotangulia.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: nyuzi za mtande au za mshazari
  rationale: 'Haya ni maneno mawili ya kiufundi ya ufumaji: nyuzi zinazokwenda kwa urefu na zile zinazopita kwa upana. Kutaja “nyuzi” kunafanya maana iwe wazi kwa msomaji wa kawaida.'
- source_word: בַּצֶּמֶר ... בַפִּשְׁתִּים
  choice: za sufu au kitani
  rationale: 'Katika muktadha wa ufumaji, maneno haya yanataja nyenzo zinazotumiwa: sufu na kitani.'
- source_word: כָּל כְּלִי הָעוֹר
  choice: kitu chochote cha ngozi
  rationale: כלי linaweza kumaanisha chombo, kifaa, au kitu kingine kilichotengenezwa kwa matumizi fulani; tafsiri hii haizuii maana kwenye aina moja tu ya chombo.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: kilicho na doa hilo
  rationale: נגע katika sura hii huelekeza kwenye alama au sehemu iliyoathirika. “Doa” linafaa kwa kitu kinachoonekana kwenye nguo au ngozi bila kudai utambuzi wa kisasa wa kitabibu.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: ukoma unaoharibu
  rationale: “Ukoma” huhifadhi uhusiano wa istilahi ya Kiebrania katika sheria hizi, huku “unaoharibu” kikieleza athari kali au ya kuteketeza ya מַמְאֶרֶת. Tanbihi inaonya kwamba neno la Kiebrania lina maana pana kuliko ukoma wa kisasa.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: ni lazima kitu hicho kichomwe moto
  rationale: Kauli tendwa ya Kiebrania inaeleza matokeo yanayotakiwa kisheria. “Ni lazima” huonyesha wajibu huo wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya צָרַעַת katika sheria za unajisi za Walawi
  choice: ukoma, pamoja na tanbihi inayoeleza maana yake pana ya kibiblia
  alternative: maradhi ya ngozi; tsaraati; hali ya unajisi
  rationale: Neno la Kiebrania halilingani moja kwa moja na ugonjwa wa Hansen wa kisasa, na hapa linatumika kwa nguo na vitu vya ngozi. Kutumia “ukoma” kunadumisha uhusiano wa istilahi katika sura nzima, huku tanbihi ikizuia utambulisho wa kimatibabu usio sahihi na kuhifadhi upeo wa kategoria ya kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Istilahi za ufumaji zimefafanuliwa kwa neno “nyuzi” na kwa tanbihi ili sentensi ibaki sahihi lakini ieleweke kwa wasomaji wa kawaida. Urudiaji wa agizo la kuchoma umehifadhiwa kwa sababu upo katika Kiebrania na unasisitiza matokeo yanayotakiwa.
