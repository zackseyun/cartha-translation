base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: sw
  text: Lakini kama kuna doa jeupe lenye wekundu la ugonjwa kwenye upara wa nyuma ya kichwa au kwenye upara wa mbele ya kichwa[b], huo ni ugonjwa wa ngozi[a] unaoenea kwenye upara wa nyuma ya kichwa chake au kwenye upara wa mbele ya kichwa chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya jadi, “ukoma.” Neno la Kiebrania linahusu kwa upana zaidi magonjwa au hali mbalimbali za ngozi, wala halipaswi kulinganishwa moja kwa moja na ugonjwa wa kisasa wa Hansen.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya mawili ya Kiebrania yanatofautisha upara wa nyuma ya kichwa na upara wa mbele ya kichwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Lakini kama
  rationale: Huanzisha sharti jipya linalotofautiana na hali ya mtu mwenye upara lakini asiye na ugonjwa katika mistari iliyotangulia.
- source_word: בַקָּרַחַת / בַגַּבַּחַת
  choice: kwenye upara wa nyuma ya kichwa / upara wa mbele ya kichwa
  rationale: Huhifadhi utofauti wa maneno mawili ya Kiebrania kuhusu maeneo ya upara kwa lugha ya Kiswahili iliyo wazi.
- source_word: נֶגַע
  choice: doa la ugonjwa
  rationale: Hueleza alama inayoonekana na kuchunguzwa bila kuipa utambuzi mahususi wa kitabibu usiokuwamo katika neno la Kiebrania.
- source_word: לָבָן אֲדַמְדָּם
  choice: lililo jeupe lenye wekundu
  rationale: Huhifadhi mpangilio wa rangi katika Kiebrania na maana ya wekundu wa kiasi inayodokezwa na אֲדַמְדָּם.
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno la Kiebrania lina maana pana kuliko ugonjwa wa kisasa wa Hansen; tafsiri hii huepuka kulilinganisha moja kwa moja na ukoma.
- source_word: פֹּרַחַת
  choice: unaoenea
  rationale: Katika muktadha huu, kitenzi kishirikishi huonyesha hali inayochipuka au kuenea; ‘unaoenea’ ni ya kawaida na isiyo na madai ya kitabibu yaliyozidi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa maeneo mawili ya upara umehifadhiwa kwa sababu ni sehemu ya muundo na usahihi wa sheria ya Kiebrania.
