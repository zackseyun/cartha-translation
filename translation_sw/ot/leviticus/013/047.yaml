lexical_decisions:
- source_word: הַבֶּגֶד
  choice: vazi
  rationale: בגד humaanisha vazi au kitu cha kuvaliwa; hapa umoja unatumiwa kwa maana ya jumla katika sheria hii.
- source_word: כִּי יִהְיֶה בוֹ
  choice: ikiwa ... lina
  rationale: כִּי pamoja na kitenzi kisichotimilika huanzisha hali inayowezekana katika sheria. Muundo wa Kiswahili ‘ikiwa vazi lina’ unaeleza kwa kawaida kwamba alama ipo ndani au juu ya vazi.
- source_word: נֶגַע צָרָעַת
  choice: alama ya ukoma[a]
  rationale: נגע hapa ni dalili au alama inayoonekana na kuchunguzwa. ‘Alama’ inafaa kwa vazi kuliko ‘jeraha’ au ‘pigo,’ huku ‘ukoma’ ikihifadhi istilahi ya jadi ya צרעת; tanbihi inaeleza kwamba maana yake ni pana kuliko ugonjwa wa Hansen.
- source_word: בְּבֶגֶד צֶמֶר
  choice: katika vazi la sufu
  rationale: צמר ni sufu, na kihusishi ב kina maana ya mahali hapa; ‘katika vazi la sufu’ kinahifadhi uhusiano huo.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: au katika vazi la kitani
  rationale: פשתים hurejelea kitani kilichotengenezwa kwa mmea wa lin; kurudia ‘katika vazi’ kunaakisi kurudiwa kwa בגד na kihusishi ב katika Kiebrania.
theological_decisions:
- issue: Maana ya צרעת inapohusishwa na vazi
  choice: ukoma, pamoja na tanbihi ya ufafanuzi
  alternative: ugonjwa wa Hansen; uchafu; ugonjwa wa ngozi
  rationale: צרעת katika Walawi ni kundi pana la hali zinazoleta uchafu wa kiibada na linaweza kuathiri hata mavazi; kwa hiyo halipaswi kulinganishwa moja kwa moja na ugonjwa wa Hansen wala kufasiriwa tu kuwa ugonjwa wa ngozi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki wa kisheria na unaendelea katika mstari unaofuata; ndiyo sababu kifungu kinamalizika kwa koma. Kurudiwa kwa ‘katika vazi’ kunahifadhi msisitizo wa mahali uliomo katika Kiebrania, ingawa kuna uzito mdogo wa kimtindo.
