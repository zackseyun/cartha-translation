  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: mwili
  rationale: Ingawa בָשָׂר kwa msingi humaanisha ‘nyama,’ katika sheria hii ya uchunguzi ‘mwili’ hueleza kwa kawaida zaidi sehemu ya mtu yenye ngozi iliyoathiriwa.
- source_word: כִּי
  choice: ikiwa
  rationale: כִּי hapa inaanzisha hali ya kisheria. ‘Ikiwa’ ni ya kawaida na wazi katika Kiswahili kwa kutaja tukio linalopaswa kuchunguzwa.
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: una ... katika ngozi yake
  rationale: Muundo huu wa Kiswahili unawasilisha kitenzi cha Kiebrania ‘kuwa’ na viambishi vya mahali kwa njia ya kawaida bila kupoteza mahali jipu lilipo.
- source_word: שְׁחִין
  choice: jipu
  rationale: ‘Jipu’ ni neno fupi na la kawaida la Kiswahili kwa uvimbe au kidonda kilichovimba kinachokusudiwa na שְׁחִין katika muktadha huu.
- source_word: וְנִרְפָּא
  choice: nalo likapona
  rationale: Nifali ya רפא inaweza kueleza hali ya kuponywa au tukio la kupona. ‘Likapona’ ni Kiswahili cha kawaida na humrejesha msomaji wazi kwa ‘jipu.’
