review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of materials, the approximate greenish/reddish colours, and the passive requirement that the affected item be shown to the priest. However, rendering נֶגַע צָרַעַת as “doa la ugonjwa uitwao tsaraati” over-specifies the expression as a disease. In this verse the condition can affect fabric and leather, so the source is better represented by retaining the technical designation without calling it a disease.
  naturalness: The sentence is generally clear Standard East African Swahili. “Lionyeshwe mbele ya kuhani” is more explicit and idiomatic than “lionyeshwe kwa kuhani” for the required presentation before the priest.
  terminology: “Vazi,” “ngozi,” “nyuzi za mtande,” and “nyuzi za mshazari” suitably convey the material and weaving terms, with the explanatory note supporting the technical textile vocabulary. “Tsaraati” should be retained as a technical transliteration, but without the unsupported classification “ugonjwa.”
  issues:
  - severity: medium
    issue: “doa la ugonjwa uitwao tsaraati” adds “ugonjwa” (disease) to נֶגַע צָרַעַת.
    rationale: The Hebrew calls it a negaʿ of tsaraʿat, a priestly-ritual category that in this context affects garments, woven materials, and leather. Calling it a disease narrows and medicalizes the category beyond the source.
  - severity: low
    issue: “lionyeshwe kwa kuhani” can be less explicit about presentation before the priest.
    rationale: “Lionyeshwe mbele ya kuhani” naturally expresses the passive Hebrew requirement while leaving the person who presents it unstated.
  revised_text: Ikiwa doa hilo ni la kijani-kijani au jekundu-jekundu kwenye vazi, au kwenye ngozi, au katika nyuzi za mtande au za mshazari[a], au katika kitu chochote kilichotengenezwa kwa ngozi, hilo ni doa la tsaraati[b], nalo lionyeshwe mbele ya kuhani.
  revised_footnotes:
  - marker: a
    text: Mtande ni nyuzi zinazokwenda kwa urefu katika kitambaa; mshazari ni nyuzi zinazopita kwa upana.
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida neno hili limetafsiriwa “ukoma.” Neno la Kiebrania tsaraati linataja jamii pana ya hali zilizochunguzwa na makuhani, ambazo zingeweza kuonekana kwa watu, nguo, au ngozi; si lazima liwe ugonjwa unaoitwa ukoma leo.
    reason: alternative_reading
  revision_rationale: The revision removes the added medical label “ugonjwa,” retaining “tsaraati” as the technical Hebrew category and explaining it in the footnote. It also makes the final passive instruction more explicit in natural Swahili, while preserving the Hebrew’s unstated agent and the full list of affected materials.
