id: LEV.13.49
reference: Leviticus 13:49
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: sw
  text: Ikiwa doa hilo ni la kijani-kijani au jekundu-jekundu kwenye vazi, au kwenye ngozi, au katika nyuzi za mtande au za mshazari[a], au katika kitu chochote kilichotengenezwa kwa ngozi, hilo ni doa la tsaraati[b], nalo lionyeshwe mbele ya kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mtande ni nyuzi zinazokwenda kwa urefu katika kitambaa; mshazari ni nyuzi zinazopita kwa upana.
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida neno hili limetafsiriwa “ukoma.” Neno la Kiebrania tsaraati linataja jamii pana ya hali zilizochunguzwa na makuhani, ambazo zingeweza kuonekana kwa watu, nguo, au ngozi; si lazima liwe ugonjwa unaoitwa ukoma leo.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶּגַע
  choice: doa
  rationale: Katika muktadha huu neno linaeleza eneo linaloonekana kwenye vazi au ngozi. “Doa” ni la kawaida na linafaa kwa vifaa visivyo mwili wa binadamu bila kuongeza dhana ya tauni.
- source_word: יְרַקְרַק
  choice: la kijani-kijani
  rationale: Urudiaji huu wa Kiswahili unaonyesha rangi inayokaribia kijani bila kubainisha kivuli chake kupita ushahidi wa Kiebrania.
- source_word: אֲדַמְדָּם
  choice: jekundu-jekundu
  rationale: Umbo hili linaonyesha rangi inayoelekea kuwa nyekundu, sambamba na umbo la Kiebrania linaloeleza rangi kwa makadirio.
- source_word: בֶּגֶד
  choice: vazi
  rationale: “Vazi” ni neno la kawaida na lenye heshima kwa kitu cha kitambaa kinachovaliwa katika orodha hii.
- source_word: עוֹר
  choice: ngozi
  rationale: Hapa ni ngozi iliyotumiwa kama nyenzo, si ngozi ya mwili. Muktadha wa vazi na vitu vilivyotengenezwa kwa ngozi unaweka maana hiyo wazi.
- source_word: שְׁתִי
  choice: nyuzi za mtande
  rationale: “Mtande” ni istilahi ya Kiswahili kwa nyuzi zinazokwenda kwa urefu katika ufumaji na inadumisha tofauti ya kiufundi iliyomo katika Kiebrania.
- source_word: עֵרֶב
  choice: nyuzi za mshazari
  rationale: “Mshazari” hueleza nyuzi zinazopita kwa upana katika ufumaji. Tanbihi inafafanua istilahi hizi kwa msomaji wa kawaida.
- source_word: כְּלִי עוֹר
  choice: kitu chochote kilichotengenezwa kwa ngozi
  rationale: Hii ni tafsiri pana na ya kawaida kwa kifaa au kitu cha ngozi, bila kukifanya lazima kiwe chombo cha kuhifadhia.
- source_word: נֶגַע צָרַעַת
  choice: doa la ugonjwa uitwao tsaraati
  rationale: Kutaja “tsaraati” kunahifadhi jamii maalumu ya uchunguzi wa kikuhani ambayo inaweza kuhusisha watu, nguo na ngozi, bila kuitambulisha kimakosa na ukoma wa kisasa.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: nalo lazima lionyeshwe kwa kuhani
  rationale: Kauli ya kutendwa inadumisha umbo la Kiebrania, ambalo halimtaji mtu atakayelileta, na “lazima” huonyesha wajibu wa sheria.
theological_decisions:
- issue: Maana ya צָרַעַת katika sheria za kikuhani
  choice: ugonjwa uitwao tsaraati
  alternative: ukoma
  rationale: Katika Mambo ya Walawi 13, צָרַעַת inaweza kuonekana kwa watu, nguo na ngozi. Kwa hiyo “ukoma” ni finyu na inaweza kueleweka kimakosa kuwa ugonjwa wa Hansen. Uhawilishaji wa jina pamoja na tanbihi unahifadhi jamii ya kale ya kiibada na kimwili bila kuiwekea utambuzi wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi orodha ya Kiebrania na kauli ya kutendwa, huku tanbihi zikifafanua istilahi za ufumaji na jina la hali ya kikuhani bila kuingiza utambuzi wa kitabibu wa kisasa.
