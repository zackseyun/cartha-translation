- from: Ikiwa doa hilo ni la kijani-kijani au jekundu-jekundu kwenye vazi au ngozi, kwenye nyuzi za mtande au za mshazari[a], au kwenye kitu chochote kilichotengenezwa kwa ngozi, hilo ni doa la ugonjwa uitwao tsaraati[b], nalo lazima lionyeshwe kwa kuhani.
  to: Ikiwa doa hilo ni la kijani-kijani au jekundu-jekundu kwenye vazi, au kwenye ngozi, au katika nyuzi za mtande au za mshazari[a], au katika kitu chochote kilichotengenezwa kwa ngozi, hilo ni doa la tsaraati[b], nalo lionyeshwe mbele ya kuhani.
  rationale: The revision removes the added medical label “ugonjwa,” retaining “tsaraati” as the technical Hebrew category and explaining it in the footnote. It also makes the final passive instruction more explicit in natural Swahili, while preserving the Hebrew’s unstated agent and the full list of affected materials.
