base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: sw
  text: Lakini vazi, au nyuzi za mtando, au nyuzi za mshazari, au kitu chochote cha ngozi—vitu hivyo ukiviosha, na doa likaondoka kwenye vitu hivyo—kila kimoja kioshwe tena, nacho kitakuwa safi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: vazi
  rationale: Neno בגד humaanisha vazi au kitambaa cha kuvaliwa; “vazi” ni la kawaida, lenye heshima, na linafaa katika muktadha huu.
- source_word: הַשְּׁתִי
  choice: nyuzi za mtando
  rationale: Ni nyuzi zinazokwenda kwa urefu katika ufumaji; “mtando” ni istilahi ya Kiswahili inayotofautisha nyuzi hizi na za mshazari.
- source_word: הָעֵרֶב
  choice: nyuzi za mshazari
  rationale: Ni nyuzi zinazopita kwa upana na kukatiza nyuzi za mtando. Ufafanuzi kwa neno “nyuzi” huifanya istilahi ieleweke wazi.
- source_word: כָל כְּלִי הָעוֹר
  choice: kitu chochote cha ngozi
  rationale: כְּלִי lina maana pana ya chombo, kifaa, au kitu; tafsiri hii huepuka kulibana kuwa chombo pekee.
- source_word: תְּכַבֵּס
  choice: utakiosha
  rationale: Piel ya כבס hapa ni kuosha nguo au vitu vya aina hiyo. Umoja wa Kiswahili unarejelea kila kitu kilichotajwa kwa njia ya mgawanyo.
- source_word: הַנָּגַע
  choice: doa
  rationale: Katika muktadha wa vitu vya nguo na ngozi, נגע ni alama inayoonekana ya uharibifu au uchafu wa kiibada. “Doa” ni la asili na halidai utambuzi wa kisasa wa kitabibu.
- source_word: וְסָר מֵהֶם
  choice: na doa likaondoka humo
  rationale: Huhifadhi kiunganishi cha Kiebrania וְ na matokeo yanayofuata kuoshwa bila kulazimisha sentensi ya masharti ambayo haijawekwa wazi katika maandishi.
- source_word: וְכֻבַּס שֵׁנִית
  choice: kitaoshwa mara ya pili
  rationale: Huhifadhi hali ya kutendwa na agizo la kurudia tendo la kuosha.
- source_word: וְטָהֵר
  choice: nacho kitakuwa safi
  rationale: טהר katika muktadha huu ni hali ya usafi wa kiibada; “kitakuwa safi” huhifadhi matokeo ya utaratibu bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Maana ya usafi katika וְטָהֵר
  choice: kitakuwa safi
  alternative: kitakuwa safi kiibada
  rationale: Maandishi yenyewe yanasema kuwa safi katika mfumo wa Walawi; kuacha kivumishi “kiibada” katika mstari huhifadhi ufupi na upana wa neno bila kuingiza maelezo ndani ya tafsiri.
- issue: Uhusiano wa וְסָר na kauli inayotangulia
  choice: na doa likaondoka humo
  alternative: ikiwa doa limeondoka humo
  rationale: Kiunganishi cha Kiebrania kimehifadhiwa moja kwa moja. Muktadha unaweza kudokeza hali ya masharti, lakini tafsiri haibadili waziwazi muundo huo kuwa “ikiwa.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo wa sasa na wenye heshima. Istilahi za ufumaji “mtando” na “mshazari” zimetumiwa pamoja na “nyuzi” ili ziwe wazi kwa msomaji wa kawaida. Umoja umetumiwa kwa kila mojawapo ya vitu vilivyoorodheshwa, ingawa Kiebrania hubadili marejeo kati ya wingi na umoja.
