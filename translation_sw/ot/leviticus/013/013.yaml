base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: sw
  text: Kuhani atamchunguza; na tazama, ugonjwa wa ngozi[a] umefunika mwili wake wote. Basi atamtangaza huyo aliyeathirika kuwa safi[b]. Wote umegeuka kuwa mweupe; yeye ni safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania צָרַעַת, ambalo kwa desturi limetafsiriwa “ukoma,” linahusu aina mbalimbali za maradhi au hali za ngozi katika Walawi; si lazima liwe ukoma wa kisasa (ugonjwa wa Hansen).
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi kwamba kuhani atatangaza “alama” au “eneo lililoathirika” kuwa safi, lakini uamuzi huo unamhusu mtu mwenye hali hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: atamchunguza
  rationale: Katika masharti haya ya kikuhani, kitenzi cha kuona kinamaanisha kufanya uchunguzi rasmi, si kutazama tu. Wakati ujao unafaa mtindo wa sheria ya hali fulani katika Kiswahili.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mtendaji wa ibada anayefanya uchunguzi na kutoa uamuzi wa hali ya usafi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Linahifadhi nguvu ya neno la Kiebrania linaloelekeza fikira kwenye hali ambayo kuhani ameiona.
- source_word: הַצָּרַעַת
  choice: ugonjwa wa ngozi
  rationale: צָרַעַת ni kundi pana la maradhi au hali za ngozi, wala si lazima ugonjwa wa kisasa wa ukoma (Hansen). Tafsiri hii ni wazi bila kutoa utambuzi wa kitabibu usio hakika.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: mwili wake wote
  rationale: Ingawa בָּשָׂר kwa kawaida ni ‘nyama,’ hapa inahusu uso wote wa mwili; ‘mwili wake wote’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: וְטִהַר
  choice: atamtangaza ... kuwa safi
  rationale: Katika sheria za usafi za Walawi, piel ya טהר inaonyesha kutamka uamuzi wa kuwa safi, si kumponya au kumsafisha mtu.
- source_word: אֶת הַנָּגַע
  choice: mwenye ugonjwa
  rationale: Kisarufi נֶגַע ni alama, pigo, au eneo lililoathirika, lakini uamuzi wa kikuhani unamhusu mtu aliye nalo. Kiswahili hiki kinaweka wazi anayepokea uamuzi bila kudai kwamba ugonjwa wenyewe ni safi.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: Mwili wake wote umegeuka kuwa mweupe
  rationale: Kiwakilishi cha jumla kinaweza kurejelea hali iliyoenea mwilini; kutaja mwili tena kunafanya Kiswahili kiwe wazi huku kukihifadhi msisitizo wa kugeuka kote kuwa kweupe.
- source_word: טָהוֹר הוּא
  choice: yeye ni safi
  rationale: ‘Safi’ ni istilahi ya kawaida ya hali ya usafi katika Walawi. Kutotaja ‘kiibada’ kunazuia kuongeza ufafanuzi usio katika maandishi.
theological_decisions:
- issue: Maana ya צָרַעַת katika sheria za usafi
  choice: ugonjwa wa ngozi
  alternative: ukoma; ugonjwa unajisi wa ngozi; tsaraati
  rationale: ‘Ugonjwa wa ngozi’ huepuka kuufananisha bila msingi na ukoma wa kisasa, huku ikihifadhi muktadha wa hali ya ngozi inayochunguzwa chini ya sheria ya usafi.
- issue: Nguvu ya וְטִהַר kama uamuzi wa kikuhani
  choice: atamtangaza mwenye ugonjwa kuwa safi
  alternative: atamsafisha; atatangaza ugonjwa kuwa safi; atamtangaza kuwa safi
  rationale: Kuhani anatoa uamuzi kuhusu hali ya usafi; hasababishi uponyaji wala usafi kwa matibabu. Kumtaja mwenye ugonjwa kunatoa Kiswahili cha kawaida huku tanbihi ikihifadhi umbo halisi la kirai cha Kiebrania.
- issue: Rejeleo la כֻּלּוֹ katika kauli ya kugeuka kuwa mweupe
  choice: mwili wake wote
  alternative: ugonjwa wote; yote; eneo lote lililoathirika
  rationale: Muktadha wa karibu umetaja mwili wote uliofunikwa. Chaguo hili ni wazi kwa msomaji, huku likitambua kwamba kiwakilishi cha Kiebrania kinaweza kueleweka kwa kuhusishwa na ugonjwa au alama iliyoenea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Na tazama’ huhifadhi ishara ya matokeo ya uchunguzi bila kutumia lugha ya kale kupita kiasi. Sentensi zimegawanywa ili sheria na uamuzi wa kuhani visomeke kwa urahisi.
