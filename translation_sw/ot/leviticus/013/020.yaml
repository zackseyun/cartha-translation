base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: sw
  text: Kuhani atapachunguza, na tazama, mahali hapo panaonekana kuwa pamezama chini ya ngozi, na nywele zake zimegeuka kuwa nyeupe; kuhani atamtangaza mtu huyo kuwa najisi. Hicho ni kidonda cha ugonjwa wa ngozi[a]; kimejitokeza katika jipu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania צָרַעַת, ambalo kwa desturi limetafsiriwa “ukoma”; katika kitabu cha Walawi huenda neno hili linahusu aina mbalimbali za magonjwa ya ngozi, wala si ugonjwa wa Hansen wa kisasa pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: atapachunguza
  rationale: Katika muktadha wa uchunguzi wa kikuhani, kitenzi hiki kinamaanisha kutazama kwa makini ili kufanya uamuzi, si kuona tu.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Inahifadhi kiashiria cha usemi kinachoelekeza fikira kwenye dalili zinazoonekana.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: panaonekana pamezama chini ya ngozi
  rationale: Kauli hii inaeleza eneo lililoathiriwa likionekana kuwa chini kuliko ngozi inayolizunguka; Kiswahili hiki ni cha kawaida na wazi.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: nywele zake zimegeuka kuwa nyeupe
  rationale: Kiambishi kinarejelea eneo lililoathiriwa; tafsiri inadumisha dalili ya nywele kubadilika rangi.
- source_word: וְטִמְּאוֹ
  choice: atamtangaza mtu huyo kuwa najisi
  rationale: Kuhani anatoa uamuzi rasmi kuhusu hali ya kiibada ya mtu; hamfanyi awe najisi.
- source_word: נֶגַע צָרַעַת
  choice: pigo la ugonjwa wa ngozi
  rationale: נֶגַע inaashiria pigo au doa lililoathiriwa, huku צָרַעַת ikiwa na maana pana kuliko ugonjwa wa Hansen pekee.
- source_word: בַּשְּׁחִין
  choice: katika jipu
  rationale: שְׁחִין ni jipu au kidonda kilichovimba; “jipu” ni neno fupi na linaloeleweka katika muktadha huu.
- source_word: פָּרָחָה
  choice: limejitokeza
  rationale: Kitenzi kinaonyesha ugonjwa kuchipuka au kujitokeza katika jipu, bila kulazimisha maana ya kuenea mwilini.
theological_decisions:
- issue: Tafsiri ya צָרַעַת katika sheria za utakaso za Walawi
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: Neno la Kiebrania linahusu hali mbalimbali nzito za ngozi na halilingani moja kwa moja na ugonjwa wa Hansen wa kisasa. Tafsiri hii huepuka umahususi wa kitabibu usiohakikishwa, huku tanbihi ikihifadhi tafsiri ya jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria na kiibada umehifadhiwa bila kutumia lugha ya kitabibu yenye umahususi usiothibitishwa.
