  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: sw
  text: Lakini likizidi kuenea katika ngozi, kuhani atamtangaza mtu huyo kuwa najisi[a]; huo ni ugonjwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atamhukumu kuwa najisi.” Kitenzi cha Kiebrania hapa kinaonyesha tangazo rasmi la kuhani kuhusu hali ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Au “pigo,” “hali iliyoathirika,” au “alama iliyoathirika.” Neno la Kiebrania ni pana wala halirejelei aina mahususi ya ugonjwa katika tiba ya kisasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini
  rationale: Katika muundo wa sharti, “lakini” pamoja na kitenzi cha masharti “likizidi” huonyesha tofauti na hali iliyotangulia bila kufanya Kiswahili kuwa kizito.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: likizidi kuenea
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kisichotimilika unasisitiza kuenea; “likizidi kuenea” huleta mkazo huo kwa Kiswahili cha kawaida.
- source_word: בָּעוֹר
  choice: katika ngozi
  rationale: עוֹר ni ngozi, na kihusishi kinaonyesha eneo ambamo hali hiyo inaenea.
- source_word: וְטִמֵּא
  choice: atamtangaza ... kuwa najisi
  rationale: Katika sheria za kikuhani, Piel ya טמא inaonyesha uamuzi rasmi kuhusu hali ya unajisi, si kwamba kuhani ndiye anayesababisha unajisi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa כֹּהֵן katika muktadha wa Walawi.
- source_word: אֹתוֹ
  choice: mtu huyo
  rationale: Kiwakilishi cha Kiebrania kinamrejelea mtu anayechunguzwa; kutaja “mtu huyo” huondoa utata wa kiwakilishi katika Kiswahili.
- source_word: נֶגַע
  choice: ugonjwa
  rationale: נֶגַע ni neno pana kwa hali au sehemu iliyoathirika. “Ugonjwa” ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
- source_word: הִוא
  choice: huo ni
  rationale: Kiwakilishi hiki kinaitambulisha hali iliyotajwa kuwa נֶגַע; “huo ni” ni muundo wa kawaida wa utambulisho katika Kiswahili.
theological_decisions:
- issue: Asili ya tangazo la kuhani kuhusu unajisi
  choice: Kuhani anamtangaza mtu kuwa najisi kwa uamuzi rasmi.
  alternative: Kuhani anamfanya mtu awe najisi.
  rationale: Muktadha wa sheria na uchunguzi wa kikuhani unaonyesha utambuzi na tangazo lenye mamlaka kuhusu hali ya kiibada, si kwamba maneno ya kuhani yanasababisha unajisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Likizidi kuenea” huhifadhi msisitizo wa Kiebrania; “mtu huyo” hutumika badala ya kiwakilishi pekee ili sentensi iwe wazi. Tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
