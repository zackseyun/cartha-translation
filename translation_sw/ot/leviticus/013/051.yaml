id: LEV.13.51
reference: Leviticus 13:51
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: sw
  text: Siku ya saba, kuhani atalichunguza doa hilo. Ikiwa doa hilo limeenea katika nguo, katika nyuzi za mtande au katika nyuzi za kufuma kwa upana, au katika ngozi—yaani, katika kifaa chochote cha ngozi kilichotengenezwa kwa matumizi yoyote[b]—doa hilo ni tsaraati inayoharibu[a]; ni najisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tsaraati ni unukuzi wa neno la Kiebrania tsaraʿat, ambalo kwa desturi limetafsiriwa “ukoma.” Katika Mambo ya Walawi neno hilo lina maana pana zaidi na hutumiwa hata kuhusu nguo na ngozi; kwa hiyo halimaanishi tu ugonjwa wa kisasa unaoitwa ukoma.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika ngozi, kwa kila kitu ambacho ngozi hutengenezwa kwa ajili ya matumizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: atalichunguza
  rationale: Katika utaratibu huu wa kikuhani, kitenzi hiki kinamaanisha kutazama kwa makini ili kutoa uamuzi, si kuona tu.
- source_word: הַנֶּגַע
  choice: doa hilo
  rationale: Neno la Kiebrania humaanisha eneo lililoathirika au alama inayoonekana. “Doa” linafaa kwa nguo, nyuzi, na ngozi kuliko neno la kitabibu kama “maambukizi.”
- source_word: פָשָׂה
  choice: limeenea
  rationale: Hutoa kwa kawaida maana ya kuenea kwa doa katika kitu kinachochunguzwa.
- source_word: בֶּגֶד
  choice: nguo
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya vazi au kitambaa katika muktadha huu.
- source_word: שְׁתִי
  choice: nyuzi za mtande
  rationale: Mtande ni nyuzi zinazoelekea kwa urefu katika ufumaji; kuongeza “nyuzi” hufanya istilahi ieleweke vizuri.
- source_word: עֵרֶב
  choice: nyuzi za mshazari
  rationale: Mshazari ni nyuzi zinazopita kwa upana katika ufumaji, mkabala wa mtande.
- source_word: עוֹר
  choice: ngozi
  rationale: “Ngozi” ni neno pana na la kawaida kwa ngozi iliyotumiwa kama nyenzo; muktadha unaonyesha kwamba inaweza kuwa imefanyiwa kazi.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: katika kitu chochote ambacho ngozi hutumiwa kukitengeneza
  rationale: Huwasilisha wigo wa kisheria wa kifungu kwa Kiswahili cha kawaida na huonyesha vitu vilivyotengenezwa kwa ngozi.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: tsaraati inayoharibu
  rationale: Kutumia istilahi ya Kiebrania kwa unukuzi huepuka kuifananisha kimakosa na ukoma wa kisasa au ugonjwa wa ngozi pekee, kwa kuwa hapa hali hiyo imo katika nguo na ngozi. “Inayoharibu” hudumisha maana ya ממארת kuwa yenye kula au kuangamiza.
- source_word: טָמֵא הוּא
  choice: kitu hicho ni najisi
  rationale: Kiwakilishi cha Kiebrania kinaweza kurejelea hali au kitu kilichoathirika. Kiswahili kinahitaji rejeleo lililo wazi; muktadha wa sheria unaonyesha kuwa kitu kilichoathirika kinatangazwa kuwa najisi.
theological_decisions:
- issue: Maana ya צָרַעַת katika sheria za unajisi
  choice: tsaraati
  alternative: ukoma; ugonjwa wa ngozi; ugonjwa unaotia unajisi
  rationale: Neno hili la Kiebrania halilingani moja kwa moja na ugonjwa wa Hansen na katika sura hii linatumika pia kwa nguo na ngozi. Unukuzi pamoja na tanbihi huhifadhi upeo na mvutano wa istilahi ya asili bila kuingiza utambuzi wa kitabibu usiokuwamo.
- issue: Rejeleo la טָמֵא הוּא
  choice: kitu hicho ni najisi
  alternative: doa hilo ni najisi; hiyo ni najisi
  rationale: Kauli hiyo hutangaza hadhi ya unajisi. Kutaja “kitu hicho” ni Kiswahili cha asili na kunafaa muktadha wa vitu vinavyokaguliwa, huku tanbihi isiyohitajika ikiepukwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisheria lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za ufumaji “mtande” na “mshazari” zimefafanuliwa kwa neno “nyuzi.” Alama za tanbihi [a] na [b] zote zimo katika maandishi makuu.
