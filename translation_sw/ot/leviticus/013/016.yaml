  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: sw
  text: Au ikiwa nyama mbichi ikirejea na kuwa nyeupe[a], mtu huyo atamwendea kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “nyama hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: Au ikiwa
  rationale: אוֹ huanzisha hali nyingine katika utaratibu wa uchunguzi, na כִּי hapa ina maana ya sharti; kwa pamoja zimetafsiriwa kwa Kiswahili cha kawaida kuwa “Au ikiwa.”
- source_word: יָשׁ֛וּב
  choice: itarudi
  rationale: Kitenzi שוב huonyesha kurudi au kurejea katika hali nyingine; hapa ni kurudi kwa hali ya nyama iliyotajwa.
- source_word: הַ/בָּשָׂ֥ר הַ/חַ֖י
  choice: nyama mbichi
  rationale: Kihalisi ni “nyama hai,” lakini katika muktadha wa ugonjwa wa ngozi humaanisha nyama iliyo wazi na mbichi. “Nyama mbichi” ni ya kawaida na inaeleweka, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: וְ/נֶהְפַּ֣ךְ לְ/לָבָ֑ן
  choice: kuwa nyeupe
  rationale: Nifali ya הפך inaonyesha kubadilika kwa hali; muundo “itarudi kuwa nyeupe” unasomeka kwa kawaida na kuhifadhi matokeo ya mabadiliko hayo.
- source_word: וּ/בָ֖א אֶל הַ/כֹּהֵֽן
  choice: mtu huyo atamwendea kuhani
  rationale: Kitenzi kinaendeleza hatua inayofuata katika utaratibu. Kiima kilichodokezwa kimewekwa wazi kama “mtu huyo” ili kuepuka utata wa nyama yenyewe kuwa ndiyo inayemwendea kuhani.
