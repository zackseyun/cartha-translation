base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: sw
  text: Kuhani atakapoiona nyama iliyo hai[a], atamtangaza mtu huyo kuwa najisi[b]. Nyama hiyo iliyo hai ni najisi; hiyo ni ugonjwa wa ngozi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyama iliyo hai”; kwa kawaida hutafsiriwa “nyama mbichi.”'
    reason: lexical_alternative
  - marker: b
    text: Au “atamhukumu kuwa najisi.” Kuhani anatoa uamuzi rasmi kuhusu hali ya mtu kiibada.
    reason: lexical_alternative
  - marker: c
    text: Kwa kawaida “ukoma,” lakini neno la Kiebrania linahusu kwa upana zaidi ugonjwa au hali ya ngozi, wala si lazima ugonjwa unaoitwa ukoma leo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: atakapoiona
  rationale: 'Katika mfululizo huu wa sheria, umbo hili linaonyesha hali ya wakati: kuhani anapoiona dalili hiyo, ndipo hutoa uamuzi.'
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa afisa wa kikuhani anayefanya uchunguzi katika Mambo ya Walawi.
- source_word: הַבָּשָׂר הַחַי
  choice: nyama mbichi
  rationale: Kihalisi ni ‘nyama iliyo hai’; katika muktadha wa uchunguzi wa ngozi, ‘nyama mbichi’ hueleza vizuri tishu hai iliyo wazi bila kutoa picha isiyo ya kawaida ya ‘nyama iliyo hai.’
- source_word: וְטִמְּאוֹ
  choice: atamtangaza mtu huyo kuwa najisi
  rationale: Katika sheria za utakaso za kikuhani, kitenzi hiki kinaonyesha hukumu rasmi ya hali ya unajisi, si kwamba kuhani ndiye anayemsababishia mtu unajisi.
- source_word: טָמֵא הוּא
  choice: ni najisi
  rationale: ‘Najisi’ huhifadhi istilahi ya hali ya kiibada katika Mambo ya Walawi.
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno la Kiebrania lina maana pana kuliko ukoma wa kisasa; tafsiri hii huepuka kulifanya kuwa utambuzi mahususi wa kitabibu.
theological_decisions:
- issue: Tafsiri ya צָרַעַת katika sheria za unajisi za Mambo ya Walawi
  choice: ugonjwa wa ngozi
  alternative: ukoma; ugonjwa wa ngozi unaotia unajisi
  rationale: ‘Ugonjwa wa ngozi’ huhifadhi upana wa kundi la hali linalochunguzwa na kuhani bila kuingiza dhana ya baadaye kwamba lazima liwe ugonjwa wa Hansen; hali ya unajisi tayari imesemwa wazi katika sentensi iliyotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ulio wazi na wenye hadhi. ‘Mtu huyo’ imeongezwa ili kiwakilishi cha yambwa kisieleweke vibaya; hakibadili maana. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
