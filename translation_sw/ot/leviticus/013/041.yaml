  text: וְ/אִם֙ מִ/פְּאַ֣ת פָּנָ֔י/ו יִמָּרֵ֖ט רֹאשׁ֑/וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: sw
  text: Ikiwa nywele za sehemu ya mbele ya kichwa chake zimeanguka[a], ana kipara cha mbele; yeye ni safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amekuwa na kipara cha mbele.” Neno la Kiebrania hapa linatofautisha upara wa sehemu ya mbele ya kichwa na upara wa sehemu ya nyuma uliotajwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: sehemu ya mbele ya kichwa chake
  rationale: Ingawa kirai hiki kihalisi kinahusisha ‘ukingo/upande’ na ‘uso wake,’ katika muktadha huu kinamaanisha eneo la mbele la kichwa, si uso wenyewe.
- source_word: יִמָּרֵט
  choice: nywele ... zimeanguka
  rationale: Kauli ya Kiebrania inaonyesha sehemu kuwa wazi kwa sababu nywele zimeondoka au zimeng’oka. Tafsiri hii ni ya kawaida katika Kiswahili na inafaa kwa uchunguzi wa upara.
- source_word: רֹאשׁוֹ
  choice: kichwa chake
  rationale: Hii ndiyo maana ya kawaida ya nomino hiyo katika muktadha wa sehemu ya mwili.
- source_word: גִּבֵּחַ
  choice: ana kipara cha mbele
  rationale: Neno hili linataja hasa upara wa sehemu ya mbele, tofauti na neno la upara wa nyuma au utosi katika mstari uliotangulia.
- source_word: טָהוֹר
  choice: safi
  rationale: Katika Walawi 13 neno hili linahusu hali ya mtu kwa mujibu wa masharti ya utakaso, wala si usafi wa kawaida au ukamilifu wa maadili.
theological_decisions:
- issue: Istilahi ya hali ya kiibada katika sheria za utakaso
  choice: safi
  alternative: takatifu / asiye na uchafu
  rationale: ‘Safi’ huhifadhi kategoria ya Kilawi ya kutambuliwa kuwa mtu hana unajisi unaozungumziwa hapa, bila kuifanya kuwa hukumu kuhusu maadili yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Urudiaji wa ‘mbele’ umehifadhiwa ili kuonyesha wazi tofauti ya istilahi ya Kiebrania kati ya upara wa mbele na wa nyuma.
