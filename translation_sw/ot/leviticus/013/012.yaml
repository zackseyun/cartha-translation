base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: sw
  text: Na ikiwa ugonjwa wa ngozi[a] ukizuka na kuenea katika ngozi, na kuifunika ngozi yote ya mtu aliyeathirika[b], kuanzia kichwani hadi miguuni, kwa kadiri yote inavyoonekana machoni pa kuhani,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania צָרַעַת (tzaraath) linahusu hali mbalimbali za ngozi zinazoshughulikiwa kwa masharti ya kiibada katika Mambo ya Walawi. Halipaswi kutambuliwa kwa maana finyu kuwa ukoma wa kisasa (ugonjwa wa Hansen).
    reason: cultural_note
  - marker: b
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “ngozi yote ya pigo/ugonjwa.” Usemi huu unaelekea kumaanisha ngozi yote ya mtu iliyoathiriwa na hali hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: utaenea sana
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichopigwa huongeza nguvu ya wazo la kuenea. “Utaenea sana” ni Kiswahili cha kawaida kinachoonyesha kuenea kwa kiwango kikubwa katika sentensi hii ya masharti.
- source_word: הַצָּרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno צָרַעַת katika Mambo ya Walawi linahusu aina mbalimbali za matatizo ya ngozi yanayohusiana na hali ya kiibada, wala si lazima ugonjwa wa kisasa wa Hansen pekee. Tafsiri hii ni wazi bila kutoa utambuzi finyu wa kitabibu.
- source_word: בָּעוֹר
  choice: katika ngozi
  rationale: Kihusishi ב pamoja na עוֹר kinaeleza ngozi ambayo hali hiyo imeenea. “Katika ngozi” ni usemi wa kawaida wa Kiswahili katika maelezo ya ugonjwa.
- source_word: וְכִסְּתָה
  choice: na kuifunika
  rationale: Kitenzi kinaonyesha kuwa ugonjwa unaenea mpaka unafunika eneo lote linalotajwa. Muundo wa “na kuifunika” unaunganisha kwa kawaida matendo mawili ya sharti moja.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: ngozi yote ya mtu aliyeathirika
  rationale: Kihalisi ni “ngozi yote ya athari/pigo.” Katika muktadha, kinachozungumziwa ni ngozi ya mtu iliyoathiriwa; tafsiri hii inaweka maana wazi, huku tanbihi ikihifadhi usemi wa karibu zaidi na Kiebrania.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: kuanzia kichwani hadi miguuni
  rationale: Huu ni usemi unaoonyesha mwili wote. Kiswahili hiki ni cha kawaida na kinahifadhi upeo kutoka kichwa mpaka miguu.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: kila mahali ambapo kuhani anaweza kuona
  rationale: Usemi wa Kiebrania unaeleza eneo lote linaloonekana kwa macho ya kuhani wakati wa uchunguzi. Tafsiri hii ni ya kawaida na inahifadhi kikomo cha kile kinachoonekana.
