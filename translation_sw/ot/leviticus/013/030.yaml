base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: sw
  text: Kuhani ataliangalia eneo lililoathirika, na tazama, linaonekana kuwa la kina kuliko ngozi, na ndani yake kuna nywele nyembamba za manjano. Kisha kuhani atamtangaza mtu huyo kuwa najisi. Huu ni upele[a], ugonjwa wa ngozi[b] wa kichwa au wa ndevu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania נֶתֶק linamaanisha hali fulani ya ngozi ya kichwa au sehemu ya ndevu; aina kamili ya ugonjwa huo haijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania צָרַעַת linahusu aina pana ya ugonjwa mbaya wa ngozi, wala si lazima liwe ukoma wa kisasa (ugonjwa wa Hansen).
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: eneo lililoathirika
  rationale: Katika muktadha huu neno hilo linamaanisha sehemu inayoonekana ya ngozi ambayo kuhani anaichunguza. Tafsiri hii ni ya kawaida na haibainishi ugonjwa fulani wa kisasa.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: mwonekano wake uko ndani zaidi kuliko ngozi
  rationale: Inahifadhi lugha ya uchunguzi ya Kiebrania na wazo la eneo kuonekana kuwa la kina kuliko ngozi, bila kuongeza maelezo ya kitabibu yasiyokuwapo katika matini.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: nywele nyembamba za manjano
  rationale: 'Huwakilisha moja kwa moja sifa zote mbili: rangi ya manjano na unyembamba wa nywele.'
- source_word: וְטִמֵּא אֹתוֹ
  choice: atamtangaza mtu huyo kuwa najisi
  rationale: Kuhani anatoa uamuzi kuhusu hali ya unajisi wa kiibada; hasababishi unajisi huo.
- source_word: נֶתֶק
  choice: upele
  rationale: Ni neno linaloeleweka kwa wasomaji wa sasa na halidai utambuzi mahususi wa kitabibu. Maana kamili ya hali hii ya kichwa au ndevu haijulikani kwa uhakika, jambo linaloelezwa katika tanbihi.
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno la Kiebrania lina maana pana kuliko ukoma wa kisasa (ugonjwa wa Hansen), hivyo tafsiri hii huepuka usahihi wa kitabibu usiokusudiwa.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: wa kichwa au wa ndevu
  rationale: Hufuata kwa karibu maeneo mawili yaliyotajwa katika Kiebrania bila kubadili 'kichwa' kuwa istilahi ya kitabibu zaidi.
theological_decisions:
- issue: Hali ya 'najisi'
  choice: kutafsiri kama uamuzi wa kuhani kuhusu unajisi wa kiibada
  alternative: kueleza kuwa kuhani anamfanya mtu kuwa najisi kimaadili au kimwili
  rationale: Muundo wa sheria za kikuhani unaonyesha tamko la hali ya kiibada, si tendo linalosababisha dhambi au ugonjwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Lugha ya uchunguzi na tamko la kikuhani imehifadhiwa; istilahi za kitabibu zenye usahihi usiothibitishwa zimeepukwa.
