  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: sw
  text: Lakini ikiwa upele huo wa magamba ukienea kwa hakika katika ngozi baada ya kutangazwa kuwa safi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upele unaowasha.” Neno la Kiebrania linataja hali maalumu ya ngozi iliyoelezwa katika sura hii, huenda ikiwa na magamba na kupotea kwa nywele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Muunganiko huu unaanzisha hali yenye utofauti katika utaratibu wa uchunguzi; “Lakini ikiwa” ni Kiswahili cha kawaida kinachohifadhi sharti hilo.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: utaenea zaidi
  rationale: Kitenzi kisoukomo pamoja na kitenzi chenye ukomo hukazia kuenea; “utaenea zaidi” huonyesha mkazo huo kwa Kiswahili cha kawaida bila kuongeza dhana ya kuendelea bila kikomo.
- source_word: הַנֶּתֶק
  choice: upele huo wa magamba
  rationale: Neno hili katika Walawi 13 linataja hali maalumu ya ngozi ya kichwa au kidevu, inayohusishwa na nywele zilizoathirika na magamba; tafsiri hii ni wazi kuliko kutumia jina la kale au neno linalomaanisha kuwasha tu.
- source_word: בָּעוֹר
  choice: katika ngozi
  rationale: עוֹר humaanisha ngozi; “katika ngozi” hufuata kihusishi cha Kiebrania na inafaa katika muktadha wa kidonda cha ngozi.
- source_word: אַחֲרֵי
  choice: baada ya
  rationale: Huhifadhi maana ya kawaida ya wakati katika sheria hii ya uchunguzi.
- source_word: טָהֳרָתוֹ
  choice: baada ya yeye kutangazwa kuwa safi
  rationale: Katika muktadha huu neno linahusu hali au hatua ya usafi wa kiibada baada ya uchunguzi. Kauli hii inaweka wazi kuwa mtu alitangazwa kuwa safi, bila kudokeza utakaso wa kimaadili.
theological_decisions:
- issue: Maana ya טָהֳרָתוֹ katika sheria ya usafi
  choice: yeye kutangazwa kuwa safi
  alternative: kutakaswa kwake
  rationale: Muktadha ni uamuzi wa kikuhani kuhusu usafi wa kiibada, si msamaha wa dhambi wala utakaso wa ndani; tafsiri iliyochaguliwa huepuka kuingiza maana ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Upele huo wa magamba” ni maelezo yanayoeleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu utambulisho kamili wa hali hiyo. Koma ya mwisho imehifadhiwa kwa kuwa mstari huu unaendelea katika mstari unaofuata.
