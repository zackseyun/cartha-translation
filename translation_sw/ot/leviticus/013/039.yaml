  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֧ה בְ/עוֹר בְּשָׂרָ֛/ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּ/ע֖וֹר טָה֥וֹר הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: sw
  text: Kuhani atachunguza, na tazama, katika ngozi ya miili yao kuna madoa meupe yaliyofifia. Huo ni upele[a] uliojitokeza kwenye ngozi; mtu huyo ni safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hali ya ngozi” au “doa lenye madoadoa.” Neno la Kiebrania linamaanisha hali ya ngozi isiyomfanya mtu kuwa najisi, tofauti na ugonjwa mbaya zaidi unaozungumziwa katika sura hii.
    reason: Neno בֹּהַק ni adimu, na utambulisho wake sahihi wa kitabibu hauna uhakika.
lexical_decisions:
- source_word: וְרָאָה
  choice: atachunguza
  rationale: Katika sheria za kikuhani za Walawi 13, kitenzi hiki kinamaanisha kuchunguza hali ya ngozi, si kuitazama tu.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Inahifadhi nguvu ya usemi wa Kiebrania unaoelekeza fikira kwenye matokeo ya uchunguzi.
- source_word: בְעוֹר בְּשָׂרָם
  choice: katika ngozi ya miili yao
  rationale: Inafuata kwa karibu usemi halisi wa Kiebrania na kuhifadhi kiambishi cha wingi ‘yao.’
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: madoa meupe yaliyofifia
  rationale: ‘Madoa’ yanaeleza alama zinazoonekana kwenye ngozi, na ‘yaliyofifia’ yanahifadhi tofauti kati yake na vidonda vyeupe vyenye mwonekano mkali zaidi.
- source_word: בֹּהַק
  choice: upele
  rationale: Ni neno adimu la hali ya ngozi isiyomfanya mtu kuwa najisi; ‘upele’ ni neno la kawaida lisilodai utambuzi mahususi wa kitabibu.
- source_word: פָּרַח
  choice: uliojitokeza
  rationale: Katika muktadha wa ngozi, kitenzi kinaeleza hali iliyotokea au kuzuka juu ya ngozi.
- source_word: טָהוֹר הוּא
  choice: mtu huyo ni safi
  rationale: ‘Safi’ huhifadhi hukumu ya kisheria na kiibada ya kifungu bila kuifanya kuwa dai la usafi wa kimaadili au la kupona kitabibu.
theological_decisions:
- issue: Maana ya hukumu ya kikuhani
  choice: mtu huyo ni safi
  alternative: mtu huyo ni safi kiibada
  rationale: Muktadha unaonyesha hadhi ya usafi chini ya sheria ya Walawi. Neno ‘kiibada’ limeachwa lisitajwe ili kutoongeza ufafanuzi usio wazi katika neno lenyewe, huku ‘safi’ likihifadhi istilahi ya msingi.
- issue: Asili ya בֹּהַק
  choice: upele
  alternative: upele usio na madhara
  rationale: Kiebrania kinataja hali hiyo na kisha kutoa hukumu kwamba mtu ni safi; tafsiri kuu haiongezi dai la kitabibu kwamba hali hiyo haina madhara.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. ‘Na tazama’ limetumiwa kwa ladha rasmi ya maandiko huku sentensi nyingine zikiwa za kawaida na wazi.
