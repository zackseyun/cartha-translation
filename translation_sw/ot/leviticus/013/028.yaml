id: LEV.13.28
reference: Leviticus 13:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: sw
  text: Lakini ikiwa doa jeupe linabaki mahali pake[a], halijaenea kwenye ngozi, nalo limefifia, basi huo ni uvimbe wa jeraha la moto. Kuhani atamtangaza kuwa safi, kwa maana hiyo ni kovu la jeraha la moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “linabaki chini yake.” Kiebrania husema kihalisi kwamba doa “linasimama chini yake”; katika muktadha maana yake ni kwamba linabaki pale pale bila kuenea.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: linabaki mahali pake
  rationale: Nahau hiyo inaonyesha kwamba doa halijasogea wala kuenea. Tafsiri hii ni ya kawaida katika Kiswahili na inaweka maana ya uchunguzi, huku tafsiri halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: הַבַּהֶרֶת
  choice: doa jeupe
  rationale: Katika sheria hizi neno hilo linamaanisha eneo la ngozi linaloonekana kuwa jeupe au angavu. 'Doa jeupe' ni wazi na linafaa kwa maelezo ya ngozi.
- source_word: פָשְׂתָה בָעוֹר
  choice: halijaenea kwenye ngozi
  rationale: Hii ni lugha ya uchunguzi wa kama alama imepanuka katika ngozi; 'kuenea kwenye ngozi' ni ya asili katika Kiswahili.
- source_word: כֵהָה
  choice: limefifia
  rationale: Neno linaonyesha kupungua kwa uangavu au kuonekana kwake; 'limefifia' huwasilisha maana hiyo kwa kawaida.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: uvimbe wa jeraha la moto
  rationale: '''שְׂאֵת'' ni eneo lililoinuka au uvimbe, na ''מִכְוָה'' ni jeraha lililosababishwa na moto. Muundo huu unaonyesha uhusiano bila kuongeza maelezo yasiyokuwapo.'
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: Kuhani atamtangaza kuwa safi
  rationale: Katika muktadha wa uchunguzi wa kikuhani, kitenzi humaanisha kutoa tamko la hali ya usafi, si kumwosha au kumsafisha mtu moja kwa moja.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: kovu la jeraha la moto
  rationale: '''Kovu'' linaeleza alama iliyobaki baada ya kuungua kwa lugha fupi na ya kawaida.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya heshima na inayoeleweka kwa wasomaji wa kawaida. 'Jeraha la moto' limetumiwa kwa uwazi zaidi kuliko 'mwunguzo,' na lugha ya tamko la kikuhani imehifadhiwa.
