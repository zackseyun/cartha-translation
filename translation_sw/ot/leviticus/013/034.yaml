  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: sw
  text: Siku ya saba, kuhani atauchunguza upele huo wenye magamba[a]. Na ikiwa upele huo haujaenea katika ngozi, wala hauonekani kuwa umezama chini ya ngozi[b], kuhani atamtangaza mtu huyo kuwa safi[c]. Mtu huyo atafua nguo zake, naye atakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upele unaowasha”; neno la Kiebrania neṭeq linataja hali maalumu ya ngozi ya kichwa au kidevu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mwonekano wake si wa kina kuliko ngozi.” Hiki ni kigezo cha kawaida cha kikuhani kinachoonyesha kwamba eneo lililoathiriwa halionekani kuwa limezama chini ya ngozi inayolizunguka.
    reason: cultural_note
  - marker: c
    text: Kauli ya Kiebrania inayoweza kutafsiriwa kihalisi “kuhani atamsafisha” hapa inamaanisha kwamba kuhani anatangaza rasmi hali yake kuwa safi, si kwamba anamponya kitabibu.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: upele wenye magamba
  rationale: Neno hili linataja tatizo maalumu la ngozi ya kichwa au kidevu linalochunguzwa na kuhani. “Upele wenye magamba” linaeleza hali inayoonekana bila kulihusisha na utambuzi mahususi wa kitabibu.
- source_word: פָשָׂה
  choice: haujaenea
  rationale: Katika muktadha huu, kitenzi kinaonyesha kama tatizo limepanuka katika eneo la ngozi.
- source_word: בָּעוֹר
  choice: kwenye ngozi
  rationale: Hii ndiyo kauli ya kawaida na ya asili katika Kiswahili ya kueleza kuenea kwa hali hiyo katika eneo la ngozi.
- source_word: מַרְאֵהוּ
  choice: mwonekano wake
  rationale: Inarejelea jinsi eneo lililoathiriwa linavyoonekana kwa uchunguzi.
- source_word: עָמֹק מִן הָעוֹר
  choice: wa kina kuliko ngozi
  rationale: Inahifadhi kigezo cha kikuhani kwamba sehemu iliyoathiriwa haionekani kuwa imezama chini ya kiwango cha ngozi.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: kuhani atamtangaza mtu huyo kuwa safi
  rationale: Katika sheria hizi kuhani anatoa uamuzi rasmi kuhusu hali ya usafi; haisemi kwamba anamponya mtu kitabibu.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Mtu huyo atafua nguo zake
  rationale: “Kufua nguo” ni Kiswahili cha kawaida kinachohifadhi tendo la kiibada linaloagizwa.
- source_word: וְטָהֵר
  choice: naye atakuwa safi
  rationale: Kauli hii inaeleza hali ya usafi inayofuata baada ya kufua nguo.
- source_word: וְהִנֵּה
  choice: Ikiwa
  rationale: Katika utaratibu huu wa uchunguzi, neno hilo linaanzisha hali iliyobainika; “ikiwa” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: וְרָאָה
  choice: atauchunguza
  rationale: Kuhani hafanyi tendo la kuona tu, bali uchunguzi rasmi unaotakiwa na sheria.
theological_decisions:
- issue: Asili ya tendo la kuhani katika sheria ya usafi
  choice: Kuhani anamtangaza mtu kuwa safi kwa uamuzi rasmi.
  alternative: Kuhani anamsafisha mtu.
  rationale: Katika muktadha huu, טהר inahusu uamuzi wa hali ya kiibada. Tafsiri hii haidokezi kwamba kuhani ndiye anayeponya ugonjwa au kusababisha usafi kwa tendo la siri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisheria ulio wazi na wenye heshima. “Upele wenye magamba” huepuka istilahi ya kizamani au utambuzi mahususi wa kitabibu; “atafua nguo zake” ni ya kawaida na inaeleweka kwa wasomaji wa sasa.
