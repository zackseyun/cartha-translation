base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: sw
  text: Kuhani atamchunguza[a]; na tazama, eneo lililoathirika limebadilika na kuwa jeupe. Kisha kuhani atalitangaza eneo hilo kuwa safi[b]; naye ni safi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “atamwona.” Katika muktadha huu wa uchunguzi wa kikuhani, neno hilo humaanisha kumchunguza mtu anayehusika.'
    reason: lexical_alternative
  - marker: b
    text: Au, “ataamua kwamba eneo hilo ni safi.” Kuhani anatoa uamuzi wa hali ya kiibada baada ya uchunguzi; hamponyi mtu wala eneo hilo.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “safi ni yeye.” Kiwakilishi ni cha kiume umoja. Katika muktadha kinaweza kumrejelea mtu anayechunguzwa, ingawa kinaweza pia kueleweka kwa kurejelea eneo lililoathirika; Kiswahili “naye” huhifadhi utata huo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: atamchunguza
  rationale: Kitenzi ראה kwa kawaida ni ‘kuona,’ lakini katika muktadha huu wa utaratibu wa kikuhani kina maana ya kuchunguza. Kiambishi -m- kinahifadhi umoja wa ngeli ya eneo linalotajwa, ingawa Kiswahili pia kingeweza kurudia nomino kwa uwazi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa כֹּהֵן katika sheria za Walawi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Inahifadhi kiashiria cha mazungumzo kinachovuta fikira kwenye matokeo ya uchunguzi, kwa mtindo wenye hadhi unaofaa maandiko.
- source_word: נֶהְפַּךְ
  choice: limebadilika na kuwa
  rationale: Nifali inaonyesha badiliko la hali. Usemi huu ni wa kawaida katika Kiswahili na huepuka kudai kwamba mhusika fulani alilisababisha.
- source_word: הַנֶּגַע
  choice: eneo lililoathirika
  rationale: נֶגַע hapa ni sehemu inayoonekana na kuchunguzwa, bila kutaja kwa uhakika ugonjwa wa kisasa. ‘Eneo lililoathirika’ ni wazi na halitoi utambuzi wa kitabibu usiokuwamo katika maandishi.
- source_word: לְלָבָן
  choice: kuwa jeupe
  rationale: Inatoa moja kwa moja badiliko la rangi kuwa nyeupe, huku ikifuata upatanisho wa kisarufi wa ‘eneo.’
- source_word: וְטִהַר
  choice: atakutangaza ... kuwa safi
  rationale: Katika Walawi 13 kuhani anatoa uamuzi wa hali ya kiibada baada ya uchunguzi; maandishi hayasemi kwamba anaponya au anaondoa hali hiyo.
- source_word: טָהוֹר הוּא
  choice: ni safi
  rationale: Inahifadhi tamko fupi la Kiebrania. Kiswahili hakihitaji kuonyesha jinsia ya kiwakilishi, hivyo mvutano wa marejeo hauamuliwi kupita kiasi.
theological_decisions:
- issue: Asili ya tendo la kuhani katika sheria ya usafi
  choice: Kuhani anatangaza eneo kuwa safi baada ya kulichunguza.
  alternative: Kuhani analisafisha eneo.
  rationale: Katika muktadha wa Walawi 13, טהר ni utoaji wa hukumu ya hali ya kiibada, si tendo la kitabibu la kuponya wala kitendo cha kulisafisha eneo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Eneo lililoathirika’ huepuka utambuzi wa kitabibu usio hakika. ‘Na tazama’ huhifadhi nguvu ya וְהִנֵּה bila kufanya sentensi iwe nzito kupita kiasi.
