base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: sw
  text: Lakini kuhani akilichunguza, na tazama, hakuna unywele mweupe ndani yake, wala halijazama chini ya ngozi, bali limefifia, basi kuhani atamtenga[a] mtu huyo kwa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atamweka karantini.” Kitenzi cha Kiebrania kinamaanisha kumweka mtu katika hali ya kutengwa ili aangaliwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini ... aki-
  rationale: Huanzisha hali ya masharti inayotofautiana na hali iliyotangulia; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יִרְאֶנָּה
  choice: akilichunguza
  rationale: Kitenzi hiki kwa msingi ni ‘kuona,’ lakini katika utaratibu huu wa kikuhani kinamaanisha kukagua kwa makini ili kufanya uamuzi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni tafsiri ya kawaida ya afisa wa kikuhani anayefanya uchunguzi katika Mambo ya Walawi 13.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi fomula ya Kiebrania inayovuta fikira kwenye hali iliyogunduliwa wakati wa uchunguzi.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: hakuna unywele mweupe ndani yake
  rationale: Huonyesha moja kwa moja kigezo cha uchunguzi, huku ‘ndani yake’ ikirejelea eneo lililoathirika.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: wala halijazama chini ya ngozi
  rationale: Neno la Kiebrania lina wazo la kuwa chini au kuzama; usemi huu unaeleza mwonekano wa eneo bila kudai kwamba limepenya ndani ya ngozi.
- source_word: וְהִיא כֵהָה
  choice: bali limefifia
  rationale: Huwasilisha mwonekano uliopungua ukali au uangavu, kwa lugha ya kawaida ya Kiswahili.
- source_word: וְהִסְגִּירוֹ
  choice: basi kuhani atamtenga mtu huyo
  rationale: Kitenzi kinaonyesha kumweka mtu kando kwa muda ili aendelee kuangaliwa; kiambishi cha Kiebrania kinamrejelea mtu, si eneo la ngozi.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kipindi kilichotajwa.
