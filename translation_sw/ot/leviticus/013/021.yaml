  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Viwakilishi vya kike vinahifadhi rejeo la eneo la ngozi lililotajwa katika muktadha, huku “mtu huyo” ikiweka wazi kwamba anayetengwa ni mtu.
