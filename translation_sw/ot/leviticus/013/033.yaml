translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa sheria ya kiibada ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Tafsiri inahifadhi yambwa lisilo la kawaida la Kiebrania—sehemu iliyoathiriwa ndiyo inayotengwa—badala ya kulibadili kimya kuwa mtu, na maelezo ya kiutendaji yanawekwa katika tanbihi.
