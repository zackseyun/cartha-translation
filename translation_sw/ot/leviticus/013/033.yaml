  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: sw
  text: Kisha atajinyoa[a], lakini asinyole sehemu iliyoathiriwa[b]; naye kuhani atamweka mtu huyo katika hali ya kutengwa kwa siku saba tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataacha anyolewe.” Muundo wa Kiebrania unaweza kumaanisha kwamba mtu huyo anajinyoa mwenyewe au anaacha anyolewe.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi kwamba sehemu iliyoathiriwa isinyolewe. Neno hilo hurejelea ugonjwa fulani wa ngozi ya kichwa au ndevu, unaohusishwa na kupotea kwa nywele. Huenda maana ni kwamba nywele za eneo hilo zisiachwe zinyolewe, ili kuhani aweze kulichunguza baada ya nywele zinazolizunguka kuondolewa.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: Kisha atajinyoa
  rationale: Kauli ya Kiebrania ya Hitpael ina maana ya kujifanyia tendo au kujifanya anyolewe. Kitenzi cha Kiswahili “atajinyoa” kinahifadhi maana hiyo ya kujirejelea, huku “Kisha” ikionyesha mfuatano wa utaratibu.
- source_word: הַנֶּתֶק
  choice: sehemu iliyoathiriwa
  rationale: Neno hili linataja hali maalumu ya ngozi ya kichwa au ndevu inayohusishwa na kunyonyoka kwa nywele, si mwasho wa kawaida. “Sehemu iliyoathiriwa” ni wazi na ya kawaida, bila kudai kwa uhakika aina ya ugonjwa ambayo maandishi hayaitaji moja kwa moja.
- source_word: לֹא יְגַלֵּחַ
  choice: hatanyoa
  rationale: Kitenzi kisichotimilika pamoja na ukanushi katika sheria hii kinaonyesha katazo; “hatanyoa” ni tamko la kawaida la Kiswahili katika maagizo ya kisheria.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: lakini hatanyoa sehemu iliyoathiriwa
  rationale: Kiashiria cha yambwa katika Kiebrania kinaonyesha kwamba sehemu yenyewe ndiyo isiyopaswa kunyolewa. Tafsiri haiongezi “kuzunguka” kwa sababu hilo si tamko la moja kwa moja la maandishi.
- source_word: וְהִסְגִּיר
  choice: ataitenga
  rationale: Katika muktadha wa Walawi 13, kuhani anatenga jambo linalochunguzwa kwa muda wa uchunguzi. “Kutenga” ni lugha ya sasa na huepuka kuingiza dhana za kitabibu za karantini bila lazima.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na linalofaa kwa כהן katika sheria za Walawi.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Huwasilisha moja kwa moja muda uliotajwa katika Kiebrania.
- source_word: שֵׁנִית
  choice: mara ya pili
  rationale: Kielezi hiki kinaonyesha kwamba kipindi cha siku saba cha kutengwa kinarudiwa kwa mara ya pili.
