id: LEV.12.4
reference: Leviticus 12:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: sw
  text: Kisha atakaa siku thelathini na tatu katika damu ya utakaso wake.[a] Hatagusa kitu chochote kitakatifu, wala hataingia mahali patakatifu mpaka siku za utakaso wake zitimie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, kihalisi, “katika damu za utakaso” au “katika damu ya utakaso”; usemi huu unahusu kipindi baada ya kujifungua kinachohusishwa na damu na utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: siku thelathini na tatu
  rationale: Kiswahili cha kawaida hujumlisha hesabu ya Kiebrania, yaani ‘siku thelathini na siku tatu,’ kuwa ‘siku thelathini na tatu.’
- source_word: תֵּשֵׁב
  choice: atakaa
  rationale: Kitenzi hiki kinaweza kumaanisha kuketi, kukaa, au kuendelea katika hali fulani; hapa ‘atakaa’ kinaeleza kuendelea katika kipindi hicho kwa lugha ya kawaida.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: katika damu ya utakaso wake
  rationale: Tafsiri hii inadumisha taswira halisi na ugumu wa usemi wa Kiebrania unaohusisha damu ya kipindi baada ya kujifungua na utakaso wa kiibada.
- source_word: בְּ/כָל קֹדֶשׁ לֹא תִגָּע
  choice: Hatagusa kitu chochote kitakatifu
  rationale: Huwakilisha katazo la kugusa chochote kilichowekwa wakfu bila kulibana kwa aina moja tu ya kitu.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: wala hataingia mahali patakatifu
  rationale: מִקְדָּשׁ ni mahali pa ibada palipotakaswa; ‘mahali patakatifu’ ni wazi na asili katika Kiswahili huku ‘hataingia’ ikitoa maana ya mwendo kuelekea ndani.
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: mpaka siku za utakaso wake zitimie
  rationale: ‘Zitimie’ hutoa wazo la kufikia ukamilifu wa kipindi, na kiambishi ‘wake’ kinawakilisha wazi kiambishi cha Kiebrania.
theological_decisions:
- issue: Istilahi ya usafi wa kiibada bila kuingiza hatia ya kimaadili
  choice: utakaso
  alternative: usafishaji
  rationale: Muktadha unahusu hali na taratibu za kiibada baada ya kujifungua, si tamko kwamba mwanamke ana hatia ya kimaadili. ‘Utakaso’ huhifadhi aina hiyo ya kisheria na kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sheria ya kiibada ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Usemi mgumu wa Kiebrania umehifadhiwa katika matini na kufafanuliwa katika tanbihi.
