  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: sw
  text: Lakini ikiwa hana uwezo wa kumudu mwana-kondoo, atachukua njiwa tetere wawili au makinda mawili ya njiwa, mmoja kwa ajili ya sadaka ya kuteketezwa na mwingine kwa ajili ya sadaka ya dhambi.[a] Kuhani atafanya upatanisho kwa ajili yake, naye atakuwa safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso”; katika muktadha huu sadaka hiyo inahusu uchafu wa kiibada baada ya kujifungua.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: hana uwezo wa kupata mwana-kondoo
  rationale: Nahau ya Kiebrania, kihalisi ‘mkono wake haupati kiasi cha kutosha kwa mwana-kondoo,’ inaeleza kutokuwa na uwezo wa kifedha. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha wazo la uwezo wa kiuchumi.
- source_word: שֶׂה
  choice: mwana-kondoo
  rationale: Katika muktadha huu wa dhabihu, neno hili linarejelea mnyama aliyetajwa katika mstari uliotangulia; ‘mwana-kondoo’ ni tafsiri wazi na mahususi.
- source_word: שְׁתֵּי תֹרִים
  choice: njiwa tetere wawili
  rationale: תֹרִים humaanisha aina mahususi ya njiwa, yaani turtledoves; ‘njiwa tetere’ huhifadhi umahususi huo kuliko ‘njiwa’ pekee.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: makinda mawili ya njiwa
  rationale: Kirai hiki, kihalisi ‘wana wa njiwa,’ ni nahau inayomaanisha njiwa wachanga. ‘Makinda mawili ya njiwa’ ni Kiswahili cha asili na sahihi.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida la Kiswahili kwa dhabihu iliyoteketezwa, na linaonyesha aina ya sadaka bila kuongeza ufafanuzi usiotajwa.
- source_word: חַטָּאת
  choice: sadaka ya dhambi
  rationale: Hii inadumisha istilahi ya msingi ya dhabihu na ulinganifu wake katika Maandiko. Kwa kuwa katika muktadha huu inaweza pia kueleweka kama sadaka ya utakaso, maana hiyo imehifadhiwa katika tanbihi.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: Kuhani atafanya upatanisho kwa ajili yake
  rationale: ‘Kufanya upatanisho’ huhifadhi maana ya kiibada na kiteolojia ya כפר bila kuamua kwa undani namna upatanisho huo unavyofanya kazi.
- source_word: וְטָהֵרָה
  choice: naye atakuwa safi
  rationale: Kitenzi kinaonyesha kurejeshwa katika hali ya usafi wa kiibada. Tafsiri hii ni fupi, ya kawaida, na mwaminifu kwa muktadha.
theological_decisions:
- issue: Tafsiri ya חַטָּאת katika muktadha wa utakaso baada ya kujifungua
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: Ingawa sura hii inahusu uchafu wa kiibada wala si lazima kosa la kimaadili, חַטָּאת ni istilahi ya dhabihu ambayo mara nyingi hutafsiriwa ‘sadaka ya dhambi.’ Tafsiri hiyo imewekwa katika matini kwa uthabiti wa istilahi, huku ‘sadaka ya utakaso’ ikiwekwa katika tanbihi ili kuhifadhi maana inayowezekana katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Istilahi za dhabihu zimetolewa kwa namna thabiti, huku nahau ya uwezo wa kifedha ikitafsiriwa kwa Kiswahili cha asili.
