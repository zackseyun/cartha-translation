  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: sw
  text: Kuhani atakileta mbele za Yahwe na kufanya upatanisho kwa ajili yake; naye atakuwa safi kutokana na chanzo cha damu yake.[a] Hii ndiyo sheria kuhusu mwanamke aliyejifungua mtoto wa kiume au wa kike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokana na mtiririko wa damu yake.” Kiebrania kinasema kihalisi, “kutokana na chanzo cha damu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Kuhani atakitoa
  rationale: Hifili ya קרב pamoja na kiambishi cha yambwa cha umoja wa kiume humaanisha kukileta au kukitoa sadaka iliyotajwa katika muktadha. Kumtaja “Kuhani” huweka wazi kiima kinachoeleweka kutoka aya iliyotangulia.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hii ni kauli ya kawaida ya ibada yenye maana ya mbele au katika uwepo wa Yahwe; jina la agano יְהוָה limetoholewa kuwa “Yahwe”.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: na kufanya upatanisho kwa ajili yake
  rationale: Katika muktadha wa sadaka za kikuhani, כפר hueleza tendo la kufanya upatanisho. Kauli hii haibani maana kwa nadharia moja maalumu ya kitheolojia.
- source_word: וְטָהֲרָה
  choice: naye atakuwa safi
  rationale: 'Kitenzi cha Qal kinaonyesha matokeo ya tendo la kuhani: mwanamke anakuwa safi kiibada. Tafsiri hii haikifanyi kitenzi kuwa cha kutendwa bila msingi wa kisarufi.'
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: kutokana na chanzo cha damu yake
  rationale: מָקוֹר humaanisha chanzo, chemchemi, au asili ya mtiririko. Tafsiri hii huhifadhi taswira halisi ya Kiebrania huku tanbihi ikitoa maana ya kimuktadha.
- source_word: זֹאת תּוֹרַת
  choice: Hii ndiyo sheria kuhusu
  rationale: תּוֹרָה hapa ni agizo au sheria ya ibada. “Sheria” ni neno linaloeleweka na linafaa katika fomula za kitabu cha Walawi.
- source_word: הַיֹּלֶדֶת
  choice: mwanamke anayejifungua
  rationale: Kivumishi-tendo hiki humtaja mwanamke katika uhusiano na kuzaa; “anayejifungua” ni Kiswahili cha kawaida na sahihi.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: mtoto wa kiume au wa kike
  rationale: Kiebrania kinatumia istilahi za jinsia “wa kiume” na “wa kike.” Kuongeza “mtoto” hufanya rejeo liwe wazi na la kawaida katika Kiswahili bila kubadili maana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la agano יְהוָה moja kwa moja. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Maana ya כפר katika ibada ya utakaso baada ya kujifungua
  choice: kufanya upatanisho kwa ajili yake
  alternative: kumtakasa au kumfanyia kafara
  rationale: “Kufanya upatanisho” huhifadhi istilahi pana ya kisadaka bila kudai kwamba uzazi wenyewe ni kosa la kimaadili, wala bila kuifupisha כפר kuwa utakaso pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za ibada zimehifadhiwa bila kuingiza mafundisho ya dhehebu fulani.
