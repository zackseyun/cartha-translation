  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: sw
  text: Siku za kutakaswa kwake zitakapotimia, baada ya kuzaa mwana au binti, ataleta mwana-kondoo wa mwaka mmoja kuwa sadaka ya kuteketezwa, na kinda la njiwa au hua kuwa sadaka ya dhambi[a], kwenye mlango wa Hema la Kukutania, kwa kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka ya utakaso.” Neno la Kiebrania linaweza kumaanisha sadaka inayotumika kuondoa unajisi wa kiibada, si sadaka kwa ajili ya kosa la kimaadili pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאת
  choice: zitakapotimia
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaonyesha wakati ambapo kipindi kimemalizika; ‘zitakapotimia’ ni Kiswahili cha kawaida chenye nguvu hiyo ya wakati.
- source_word: יְמֵי טָהֳרָהּ
  choice: siku za kutakaswa kwake
  rationale: טָהֳרָה hapa ni utakaso wa kiibada. ‘Kutakaswa kwake’ huhifadhi maana hiyo bila kudokeza kwamba uzazi ulikuwa kosa la kimaadili.
- source_word: לְבֵן אוֹ לְבַת
  choice: iwe ni baada ya kuzaa mwana wa kiume au wa kike
  rationale: Kirai kinaonyesha kwamba agizo linahusu hali zote mbili za uzazi. Kuongeza ‘baada ya kuzaa’ hufanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili.
- source_word: תָּבִיא
  choice: atamletea
  rationale: Kauli ya wakati ujao hubeba nguvu ya agizo katika sheria hii; kiambishi cha mtendewa huonyesha kwamba vitu vinaletwa kwa kuhani.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: mwana-kondoo wa mwaka mmoja
  rationale: Nahau ya Kiebrania humaanisha mwana-kondoo mwenye umri wa mwaka mmoja; hii ni njia fupi na wazi ya kusema hivyo kwa Kiswahili.
- source_word: לְעֹלָה
  choice: kuwa sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya dhabihu inayoteketezwa; tafsiri hii huhifadhi aina maalumu ya sadaka.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: na kinda la njiwa au hua
  rationale: בֶּן־יוֹנָה ni ndege mchanga wa jamii ya njiwa, ilhali תֹר ni hua. ‘Kinda la njiwa’ huhifadhi wazi umri unaotajwa kwa ndege wa kwanza.
- source_word: לְחַטָּאת
  choice: kuwa sadaka ya dhambi
  rationale: ‘Sadaka ya dhambi’ ni istilahi ya jadi na inayotambulika kwa חַטָּאת; tanbihi huhifadhi uwezekano wa maana ya ‘sadaka ya utakaso’ katika muktadha huu wa unajisi wa kiibada.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: kwenye mlango wa Hema la Kukutania
  rationale: Kirai kinataja mahali pa kuwasilisha sadaka. ‘Kwenye mlango’ ni cha kawaida katika Kiswahili huku ‘Hema la Kukutania’ likihifadhi mazingira ya ibada.
- source_word: אֶל הַכֹּהֵן
  choice: kwa kuhani
  rationale: אֶל ya pili humtaja mpokeaji; maana hiyo imejumuishwa katika ‘atamletea kuhani’.
theological_decisions:
- issue: Tafsiri ya חַטָּאת katika muktadha wa utakaso baada ya kuzaa
  choice: sadaka ya dhambi
  alternative: sadaka ya utakaso
  rationale: חַטָּאת ni istilahi ya kawaida ya mfumo wa dhabihu, lakini hapa ibada inahusu kuondolewa kwa unajisi wa kiibada baada ya kuzaa, wala si dai kwamba kuzaa kwenyewe ni dhambi ya kimaadili. Matini kuu huhifadhi istilahi inayotambulika, na tanbihi huhifadhi maana mbadala inayofaa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya matini ya sheria ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa sadaka kabla ya mahali pa kuziwasilisha unafuata mtiririko wa Kiebrania kwa karibu. Alama ya tanbihi imewekwa baada ya ‘sadaka ya dhambi,’ ambako suala la kileksika linahusika moja kwa moja.
