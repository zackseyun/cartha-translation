base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: sw
  text: 'Waambie wana wa Israeli: “Mwanamke akichukua mimba[a] na kuzaa mtoto wa kiume[b], atakuwa najisi kwa siku saba. Atakuwa najisi kama siku za unajisi wake wa hedhi[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwanamke anapochukua mimba.” Neno la Kiebrania linaloanzisha sheria ya tukio linaweza kueleweka kuwa “ikiwa” au “wakati.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “na kuzaa wa kiume.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, unajisi wa kiibada unaohusishwa na hedhi.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania wa jina la kitaifa na la agano, huku ukiwa usemi unaoeleweka katika Kiswahili cha Biblia.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: Katika sheria hii neno linamtaja mwanamke kwa ujumla; halilazimishi maana ya ‘mke.’
- source_word: כִּי
  choice: aki-
  rationale: Muundo wa Kiswahili ‘akichukua ... na kuzaa’ huwasilisha sharti la sheria ya tukio na pia huacha uwezekano wa maana ya ‘ikiwa’ au ‘wakati.’
- source_word: תַזְרִיעַ
  choice: akichukua mimba
  rationale: Hutoa maana ya nahau katika muktadha wa uzazi kwa Kiswahili cha kawaida, bila kufuata kivumishi cha ‘mbegu’ kwa namna isiyo ya kawaida.
- source_word: וְיָלְדָה זָכָר
  choice: na kuzaa mtoto wa kiume
  rationale: Hueleza wazi kuzaliwa kwa mtoto wa jinsia ya kiume na kufuata msisitizo wa זָכָר.
- source_word: וְטָמְאָה
  choice: atakuwa najisi
  rationale: Huhifadhi lugha ya kisheria na hali ya טמא bila kuongeza ‘kidesturi’ katika matini kuu.
- source_word: שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muda uliotajwa.
- source_word: כִּימֵי
  choice: kama katika siku za
  rationale: Huhifadhi ulinganisho wa wazi kati ya vipindi viwili vya hali ya unajisi.
- source_word: נִדַּת דְּוֺתָהּ
  choice: unajisi wake wa hedhi
  rationale: Huwasilisha hali ya unajisi inayohusiana na hedhi, badala ya kuitafsiri kama ugonjwa wa kawaida.
- source_word: תִּטְמָא
  choice: atakuwa najisi
  rationale: Huhifadhi kurudiwa kwa tamko la hali ya unajisi mwishoni mwa mstari.
theological_decisions:
- issue: Asili ya טמא katika sheria za usafi
  choice: najisi
  alternative: najisi kidesturi
  rationale: Muktadha unahusu hali ya kiibada au kidesturi, lakini neno la Kiebrania lenyewe linasema tu kuwa najisi. Maelezo hayo hayajaongezwa katika matini kuu.
- issue: Uwasilishaji wa kijinsia wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Uchaguzi huu huhifadhi umbo la Kiebrania la wingi wa kiume katika jina la kitaifa, bila kudai kwamba maagizo yanawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. ‘Najisi’ limetumiwa kwa sababu ni neno fupi linalofaa katika sheria za usafi, huku tanbihi ikifafanua maana yake ya kidesturi. Alama za tanbihi zote zimewekwa baada ya vifungu vinavyohusika.
