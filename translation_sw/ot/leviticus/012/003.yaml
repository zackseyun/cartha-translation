  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
translation:
  language: sw
  text: Na siku ya nane, nyama ya govi lake itatahiriwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri huru zaidi, “Lazima atahiriwe siku ya nane.” Kiebrania kinatumia muundo wa kutendwa (“itatahiriwa”), ambao umehifadhiwa katika maandishi makuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: Na siku ya
  rationale: Kiunganishi pamoja na kihusishi na nomino kinaonyesha mwendelezo wa agizo na wakati; “Na siku ya” ni Kiswahili cha kawaida na cha asili.
- source_word: הַ/שְּׁמִינִי
  choice: nane
  rationale: Ni namba ya mpangilio inayovumisha “siku”; katika Kiswahili, “siku ya nane” ndiyo namna ya kawaida.
- source_word: יִמּוֹל
  choice: itatahiriwa
  rationale: Kitenzi cha Kiebrania kiko katika muundo wa Niphal na hapa kina maana ya kutendwa. “Itatahiriwa” huhifadhi muundo huo na nguvu ya agizo la kisheria bila kumtaja mtendaji.
- source_word: בְּשַׂר
  choice: nyama
  rationale: Neno linamaanisha nyama ya mwili; “nyama” huhifadhi picha halisi ya Kiebrania katika muundo huu.
- source_word: עָרְלָת/וֹ
  choice: ya govi lake
  rationale: Nomino inamaanisha “govi” na ina kiambishi cha nafsi ya tatu umoja wa kiume; “lake” huonyesha umilikaji huo wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko ya sheria lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kutendwa na usemi halisi “nyama ya govi lake” umehifadhiwa kwa ukaribu na Kiebrania.
