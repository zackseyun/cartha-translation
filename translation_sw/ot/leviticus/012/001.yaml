lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Katika fomula hii ya hotuba ya Mungu, kitenzi דבר chenye waw ya usimulizi kinaendeleza simulizi. Kiswahili cha kawaida husema kwa ufasaha “akasema na” mtu; “akanena na” kingekuwa cha kale zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo “BWANA.”
- source_word: אֶל
  choice: na
  rationale: Baada ya kitenzi “sema,” Kiswahili sanifu hutumia muundo “sema na mtu” kuonyesha anayeelekezewa maneno.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina משה katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kiswahili “akisema” kinahifadhi fomula rasmi inayotanguliza maneno ya moja kwa moja, ingawa katika lugha nyepesi ingeweza kuachwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina binafsi la Mungu na ni utohozi wa kawaida wa Kiswahili; “Yehova” ni umbo jingine la jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kurudiwa “akasema ... akisema” umehifadhiwa ili kuakisi fomula rasmi ya Kiebrania.
