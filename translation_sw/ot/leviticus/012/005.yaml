id: LEV.12.5
reference: Leviticus 12:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: sw
  text: Lakini akijifungua mtoto wa kike, atakuwa najisi kwa majuma mawili, kama wakati wa hedhi yake[a]; kisha atabaki katika damu ya utakaso kwa siku sitini na sita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kama wakati wa unajisi unaohusiana na hedhi. Kiebrania hulinganisha hali yake baada ya kujifungua na hali ya wakati wa hedhi.
    reason: lexical_alternative
  - marker: b
    text: “Damu ya utakaso” inahusu kipindi kilichowekwa cha utakaso baada ya kujifungua, wala haimaanishi hatia ya kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Lakini akijifungua
  rationale: Katika muktadha huu וְאִם inaanzisha hali inayotofautiana na ile ya mstari uliotangulia. “Lakini” huonyesha tofauti hiyo kwa Kiswahili cha kawaida, huku kiambishi -ki- kikibeba maana ya sharti la “ikiwa.”
- source_word: נְקֵבָה
  choice: mtoto wa kike
  rationale: Neno hilo linamaanisha kiumbe wa jinsia ya kike; katika muktadha wa kujifungua, “mtoto wa kike” ni wazi na la kawaida bila kulifasiri tu kuwa “binti.”
- source_word: תֵלֵד
  choice: akijifungua
  rationale: Ni usemi wa kawaida wa Kiswahili kwa tendo la kuzaa na unaungana kwa urahisi na sharti linaloanzishwa na וְאִם.
- source_word: וְטָמְאָה
  choice: atakuwa najisi
  rationale: “Najisi” huhifadhi istilahi ya hali ya kiibada ya טמא. Muundo “atakuwa” unafaa kwa sheria inayotaja hali itakayofuata bila kudokeza hatia ya kimaadili.
- source_word: שְׁבֻעַיִם
  choice: kwa majuma mawili
  rationale: Umbo la uwili hapa lina maana ya majuma mawili; tafsiri hii ni sahihi na ya kawaida kwa Kiswahili.
- source_word: כְּנִדָּתָהּ
  choice: kama wakati wa hedhi yake
  rationale: Nִדָּה hapa hurejelea hali au kipindi kinachohusiana na hedhi. Usemi huu huwasilisha ulinganisho kwa uwazi bila kuongeza istilahi nzito katika matini kuu.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: kwa siku sitini na sita
  rationale: Kiswahili huunganisha kwa kawaida hesabu ya Kiebrania ya siku sitini na siku sita kuwa “siku sitini na sita,” bila kubadili jumla yake.
- source_word: תֵּשֵׁב
  choice: atabaki
  rationale: Ingawa kitenzi kinaweza kumaanisha kukaa, katika sheria hii kinaonyesha kuendelea katika hali au kipindi fulani. “Atabaki” huleta maana hiyo kwa kawaida.
- source_word: עַל דְּמֵי טָהֳרָה
  choice: katika damu ya utakaso
  rationale: Tafsiri hii huhifadhi picha na kundi la kiibada la Kiebrania, ambalo kwa neno moja moja ni “damu za utakaso,” huku ikitumia umoja wa kawaida katika Kiswahili.
theological_decisions:
- issue: Asili ya unajisi unaotajwa baada ya kujifungua
  choice: Kutumia “najisi” kama hali ya kiibada bila kuiita dhambi au uchafu wa kimaadili.
  alternative: “Atakuwa najisi kiibada” au “atakuwa mchafu kidini.”
  rationale: Mstari unahusu hadhi inayotawaliwa na sheria za ibada, si hukumu kwamba mama ametenda dhambi. Kuacha istilahi ya msingi “najisi” hudumisha uwazi wa matini, na tanbihi huzuia uelewaji wa kimaadili usiokusudiwa.
- issue: Maana ya דְּמֵי טָהֳרָה
  choice: Kuhifadhi usemi “damu ya utakaso” katika matini na kuufafanua kwa tanbihi kama kipindi kilichowekwa cha utakaso baada ya kujifungua.
  alternative: “Kipindi cha kutakaswa kutokana na damu” au “kipindi cha damu ya utakaso.”
  rationale: Usemi wa Kiebrania ni mfupi na una picha halisi ya damu pamoja na dhana ya utakaso. Tafsiri teule haiamui kupita kiasi uhusiano wa kisarufi, huku tanbihi ikieleza kwamba si utakaso kutoka katika hatia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Majuma” na “hedhi” ni maneno yanayoeleweka kwa wasomaji wa kawaida; “najisi” na “utakaso” huhifadhi msamiati wa kiibada wa Walawi. Alama [a] na [b] zimewekwa kwenye vifungu vinavyofafanuliwa na tanbihi husika.
