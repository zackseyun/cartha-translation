  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: sw
  text: Pumzi ya pumzi[a], asema Kohelethi[b]; pumzi ya pumzi, kila kitu ni pumzi tu.
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Kiebrania, hevel, humaanisha kihalisi “pumzi” au “mvuke.” Kohelethi analitumia mara nyingi katika kitabu hiki kama taswira inayounganisha maana za kupita upesi kama pumzi, kutoshikika, na kinaya ambapo matokeo hayalingani na yaliyotarajiwa. Hakuna neno moja la Kiswahili linalobeba maana hizo zote. Muundo “pumzi ya pumzi” ni njia ya Kiebrania ya kuonyesha kiwango cha juu kabisa, kama “Wimbo wa nyimbo.” Tafsiri nyingine zinazowezekana ni “ubatili kabisa,” “kazi bure kabisa,” au “kutokuwa na maana kabisa,” lakini kila moja hupunguza upana wa taswira ya asili.
    reason: Uboreshaji wa sarufi na mtiririko; maudhui na ufafanuzi wa kileksika vimehifadhiwa.
  - marker: b
    text: Kohelethi ni jina au cheo cha Kiebrania ambacho kwa kawaida hutafsiriwa “Mwalimu” au “Mhubiri.” Kila tafsiri hiyo huifanya maana yake kuwa finyu kwa namna tofauti; kwa hiyo hapa jina hilo limetoholewa kwa sauti.
    reason: Kubadilisha usemi usio wa kawaida “limehamishwa kwa sauti” kwa usemi wa Kiswahili sanifu unaoeleza utohozi wa jina.
lexical_decisions:
- source_word: הֲבֵל / הָבֶל
  choice: pumzi / pumzi tu
  rationale: Neno la Kiebrania hevel humaanisha kihalisi pumzi au mvuke, na hapa linatumika kama taswira yenye maana zinazohusiana za kitu cha muda mfupi, kisichoshikika, na chenye matokeo yasiyolingana na matarajio. “Pumzi” huhifadhi taswira hiyo; katika kiarifu, “pumzi tu” huleta uzito wa tathmini bila kugeuza kauli kuwa dai kwamba vitu vyote vimeundwa kwa pumzi.
- source_word: הֲבֵל הֲבָלִים
  choice: pumzi ya pumzi
  rationale: Muundo wa “X ya X” ni namna ya Kiebrania ya kuonyesha kiwango cha juu kabisa, kama “Wimbo wa nyimbo.” Tafsiri hii huhifadhi muundo wa kishairi na taswira halisi badala ya kuifupisha kuwa wazo moja kama “ubatili kabisa.”
- source_word: אָמַר
  choice: asema
  rationale: Ingawa kitenzi ni cha umbo timilifu katika Kiebrania, katika kauli hii ya kifasihi kinamtambulisha msemaji na kuwasilisha tamko lake kwa uhai. “Asema” ni mtindo mfupi, wa sasa wa kifasihi unaofaa hapa.
- source_word: קֹהֶלֶת
  choice: Kohelethi
  rationale: Hili ni umbo la Kiswahili la kutamka jina au cheo cha Kiebrania Qoheleth. Kulihamisha kwa sauti kunahifadhi upana wake kuliko kulifasiri moja kwa moja kuwa “Mwalimu” au “Mhubiri.”
- source_word: הַכֹּל
  choice: kila kitu
  rationale: Huu ni usemi mpana unaojumuisha yote; “kila kitu” ni Kiswahili cha kawaida na cha asili chenye nguvu hiyo ya ujumla.
theological_decisions:
- issue: Jinsi ya kutafsiri taswira kuu הֶבֶל (hevel)
  choice: Kuhifadhi taswira halisi kwa “pumzi,” na kutumia “pumzi tu” katika kiarifu.
  alternative: ubatili; kazi bure; kutokuwa na maana; kitu cha kupita
  rationale: Maneno ya dhana kama “ubatili” au “kutokuwa na maana” huchagua upande mmoja tu wa neno hilo na yanaweza kuingiza hitimisho la kwamba maisha hayana maana kabisa. “Pumzi” huacha pamoja hali ya kupita upesi, kutoshikika, na pengo la kinaya kati ya matarajio na matokeo.
- issue: Utambulisho wa קֹהֶלֶת
  choice: Kohelethi
  alternative: Mwalimu; Mhubiri; Mkusanyaji
  rationale: Maana kamili ya jina au cheo hiki si hakika. Kulihamisha kwa sauti huepuka kulazimisha kazi moja maalumu kwa mhusika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini unaoeleweka. “Pumzi ya pumzi” si usemi wa kawaida wa mazungumzo; umetumiwa kwa makusudi kuhifadhi muundo wa Kiebrania wa kiwango cha juu na taswira inayotawala kitabu. “Asema” ni mtindo wa kifasihi ulio mfupi na wa kawaida katika matamko ya hekima.
