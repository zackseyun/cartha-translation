base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: sw
  text: Laiti ningejua mahali pa kumpata, ningefika hadi mahali pake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makao yake.” Neno la Kiebrania linaweza kumaanisha mahali palipo thabiti au palipowekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Laiti
  rationale: Nahau hii inaonyesha tamanio kubwa, si swali halisi kuhusu mtu atakayetoa kitu. “Laiti” ni Kiswahili cha kawaida kinachohifadhi nguvu ya tamanio hilo.
- source_word: יָדַעְתִּי
  choice: ningejua
  rationale: Ingawa kitenzi ni cha umbo la kauli timilifu nafsi ya kwanza umoja, katika muundo huu wa tamanio kinaeleza hali inayotamaniwa. “Ningejua” ni ya asili katika Kiswahili.
- source_word: וְאֶמְצָאֵהוּ
  choice: mahali pa kumpata
  rationale: Kitenzi kinaendeleza tamanio la kujua namna au mahali ambapo Ayubu angeweza kumpata Mungu. Kiswahili huhitaji kirai cha mahali ili sentensi hii isikike kwa ufasaha; kiambishi cha yambwa kimetafsiriwa “-m-” katika “kumpata.”
- source_word: אָבוֹא
  choice: ningefika
  rationale: Kauli hii inaendeleza tamanio la Ayubu la kwenda alipo Mungu. “Ningefika” huonyesha kufika kwenye lengo na inafaa pamoja na עַד.
- source_word: עַד
  choice: mpaka
  rationale: Neno hili huonyesha mwendo unaofikia mwisho au mahali fulani. “Mpaka” huhifadhi kwa uwazi wazo la kufika kabisa kwenye mahali panapotajwa.
- source_word: תְּכוּנָתוֹ
  choice: mahali pake
  rationale: Nomino hii ina maana ya mahali palipowekwa au palipo thabiti. “Mahali pake” huhifadhi upana wa neno la Kiebrania bila kulazimisha maana maalumu ya makao, kiti, au kiti cha enzi.
theological_decisions:
- issue: Kirejeleo cha viambishi vya nafsi ya tatu ya kiume umoja
  choice: Mungu ndiye anayerejelewa katika “kumpata” na “pake.”
  alternative: Kutaja “Mungu” moja kwa moja katika mstari
  rationale: Muktadha unaonyesha kwamba Ayubu anataka kumfikia Mungu ili kuwasilisha hoja yake, lakini mstari wenyewe hautaji jina lake. Viambishi vinahifadhi namna ya usemi wa Kiebrania bila kuongeza nomino isiyokuwamo.
- issue: Maana ya תְּכוּנָתוֹ
  choice: mahali pake
  alternative: makao yake
  rationale: Neno linaweza kuashiria mahali palipo thabiti au palipowekwa, lakini si lazima liwe makao kwa maana finyu. Tafsiri pana inahifadhi utata wa kimakusudi na haileti taswira ya kiteolojia ya makao au kiti cha enzi ambayo haijaelezwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa “Laiti … ningejua … ningefika” unatoa tamanio kwa ufasaha bila kuufanya mstari kuwa swali halisi.
