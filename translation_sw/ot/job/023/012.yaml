base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: sw
  text: Sijakengeuka kutoka katika amri ya midomo yake; nimeyatunza kama hazina maneno ya kinywa chake, zaidi ya fungu nililopangiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata tafsiri ya jadi ya kirai kigumu cha Kiebrania: “Nimeyatunza kama hazina maneno ya kinywa chake, zaidi ya chakula changu cha lazima.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: amri
  rationale: Nomino hii iko katika umoja na imeunganishwa na ‘midomo yake’; ‘amri’ ni Kiswahili cha kawaida kinachohifadhi maana yake ya msingi.
- source_word: שְׂפָתָיו
  choice: midomo yake
  rationale: Tafsiri halisi inadumisha picha ya kishairi na usambamba wake na ‘kinywa chake’; viambishi vya nafsi ya tatu ya kiume vinamrejelea Mungu katika muktadha.
- source_word: לֹא אָמִישׁ
  choice: sijakengeuka kutoka katika
  rationale: Kauli hii inaeleza kutotoka au kutopotoka katika njia ya utii. ‘Sijakengeuka’ ni ya asili na yenye hadhi katika Kiswahili.
- source_word: מֵחֻקִּי
  choice: kuliko fungu nililopangiwa
  rationale: 'Kirai cha Kiebrania ni kigumu na kinaweza kueleweka kwa maana ya kulinganisha: fungu au sehemu aliyopangiwa Ayubu. Tafsiri hii inafuata umbo lenye kiambishi cha nafsi ya kwanza bila kulifanya kwa lazima kuwa chakula.'
- source_word: צָפַנְתִּי
  choice: nimeyahifadhi kama hazina
  rationale: Kitenzi kina maana ya kuficha au kuweka akiba, na katika fasihi ya hekima huonyesha kuthamini na kuhifadhi kwa uangalifu. Kirai hiki kinawasilisha vipengele vyote viwili kwa Kiswahili cha kawaida.
- source_word: אִמְרֵי
  choice: maneno
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino hii ya wingi.
- source_word: פִיו
  choice: kinywa chake
  rationale: Tafsiri halisi inahifadhi picha na usambamba wa kishairi na ‘midomo yake.’
theological_decisions:
- issue: Mrejelewa wa viambishi vya nafsi ya tatu katika ‘midomo yake’ na ‘kinywa chake’
  choice: Viambishi vinamrejelea Mungu.
  alternative: Msemaji asiyeainishwa katika maana ya jumla.
  rationale: Katika Ayubu 23, Ayubu anaeleza uaminifu wake mbele za Mungu na kwa maneno ya Mungu. Muktadha unaunga mkono mrejelewa huyu bila kuhitaji kuongeza jina ‘Mungu’ katika mstari.
- issue: Maana ya מֵחֻקִּי
  choice: 'Maana ya kulinganisha: ‘kuliko fungu nililopangiwa.’'
  alternative: ‘kutoka katika sheria yangu’ au tafsiri ya jadi ‘kuliko chakula changu cha lazima.’
  rationale: Maandishi ya konsonanti yenye kiambishi cha nafsi ya kwanza ni magumu. Chaguo kuu linadumisha umbo lililopokelewa na kutoa maana inayoeleweka katika muktadha, huku tafsiri maarufu inayohusu chakula ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha inadumisha usambamba wa kishairi wa ‘midomo yake’ na ‘kinywa chake,’ huku kirai kigumu cha mwisho kikielezwa kwa njia inayoeleweka bila kuficha uwezekano mwingine wa maandishi.
