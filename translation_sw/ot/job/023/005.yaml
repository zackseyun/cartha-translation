  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵדְעָה
  choice: Ningejua
  rationale: 'Kauli ya masharti inaonyesha matokeo yanayotamaniwa katika hali ya kudhaniwa: kama Ayubu angepata kusimama mbele za Mungu, angejua jibu lake.'
- source_word: מִלִּים
  choice: maneno
  rationale: Hili ndilo neno la kawaida la Kiebrania kwa ‘maneno’; halijafasiriwa kwa upana zaidi kuwa ‘hoja,’ ingawa muktadha unahusu kesi ya Ayubu.
- source_word: יַעֲנֵנִי
  choice: ambayo angenijibu nayo
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba maneno ndiyo ambayo Mungu angetumia kumjibu Ayubu, huku ukidumisha hali ya kudhaniwa ya muktadha.
- source_word: וְאָבִינָה
  choice: na ningeelewa
  rationale: Kitenzi בין hapa kinamaanisha kuelewa au kutambua kwa ufahamu; ‘ningeelewa’ pia hudumisha usambamba na ‘ningejua.’
- source_word: מַה
  choice: nini
  rationale: Neno la kuuliza linatanguliza maudhui ya yale ambayo Mungu angemwambia Ayubu.
- source_word: יֹאמַר לִי
  choice: angeniambia
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya ‘angesema kwangu,’ bila kuongeza wazo jingine la kifasiri.
