base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: sw
  text: Tazama, naenda mashariki, lakini hayuko huko; naenda magharibi, lakini simtambui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naenda mbele ... naenda nyuma.” Maneno ya Kiebrania yanaweza kumaanisha mashariki na magharibi, au mbele na nyuma.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili linavuta fikira za msikilizaji na linafaa katika Kiswahili cha sasa chenye hadhi.
- source_word: קֶדֶם
  choice: mashariki
  rationale: Katika ulinganifu wake na אָחוֹר, linaeleweka kiasili kama upande wa mashariki, ingawa linaweza pia kumaanisha mbele.
- source_word: אֶהֱלֹךְ
  choice: nikienda
  rationale: Kitenzi kinaonyesha mwendo wa Ayubu akimtafuta Mungu; muundo huu unaunganisha kwa kawaida mwendo huo na kutompata.
- source_word: וְאֵינֶנּוּ
  choice: yeye hayuko huko
  rationale: Kiwakilishi kinamrejelea Mungu katika muktadha, na 'huko' linaweka wazi mahali panapochunguzwa bila kudai kwamba Kiebrania lina neno tofauti la 'huko.'
- source_word: אָחוֹר
  choice: magharibi
  rationale: Kama upande unaokinzana na קֶדֶם, maana ya magharibi inaonyesha vizuri ulinganifu wa kishairi; maana ya nyuma imehifadhiwa katika tanbihi.
- source_word: לֹא אָבִין לוֹ
  choice: simtambui
  rationale: בין hapa ina wazo la kutambua au kugundua kwa ufahamu; 'simtambui' ni Kiswahili cha kawaida kinachoonyesha kushindwa kumwona au kumgundua katika utafutaji.
theological_decisions:
- issue: Mrejelewa wa viwakilishi vya nafsi ya tatu
  choice: Vinamrejelea Mungu, kwa hiyo yametafsiriwa 'yeye' na kiambishi cha yambwa katika 'simtambui.'
  alternative: Kuacha mrejelewa akiwa mtu asiyeainishwa wazi.
  rationale: Muktadha unaozunguka mstari huu ni utafutaji wa Ayubu kwa Mungu; kumtaja kwa viwakilishi hakiongezi fundisho la kidhehebu.
- issue: Mwelekeo wa קֶדֶם na אָחוֹר
  choice: mashariki na magharibi
  alternative: mbele na nyuma
  rationale: Jozi hii ya kishairi inaweza kueleweka kwa namna zote mbili. Maandishi makuu yanatumia mielekeo ya kijiografia iliyo wazi, huku tanbihi ikihifadhi uwezekano halisi wa maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi na unaeleweka kwa msomaji wa kawaida; utata halisi wa mielekeo umehifadhiwa katika tanbihi.
