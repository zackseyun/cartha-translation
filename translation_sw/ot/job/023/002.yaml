  text: Hata leo, malalamiko yangu ni uasi[a]; mkono wangu ni mzito juu ya kuugua kwangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malalamiko yangu ni machungu.” Neno la Kiebrania kwa kawaida humaanisha uasi au ukaidi, ingawa baadhi ya watafsiri hulielewa hapa kwa maana iliyopunguzwa ukali kutokana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mkono wangu ni mzito juu ya kuugua kwangu.” Maana ya msemo huu si wazi. Baadhi huuelewa kuwa Ayubu anajizuia au amelemewa katika kutoa maumivu yake; wengine hurekebisha maandishi yasome “mkono wake.”
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: Hata leo
  rationale: Huhifadhi msisitizo wa wakati kwamba hali na malalamiko ya Ayubu yanaendelea mpaka sasa.
- source_word: מְרִי
  choice: ya uasi
  rationale: Nomino hii kwa kawaida humaanisha uasi au ukaidi. Muundo wa Kiswahili ‘malalamiko yangu ni ya uasi’ huhifadhi ukali wake bila kuibadili kimuktadha kuwa ‘machungu.’
- source_word: שִׂיחִי
  choice: malalamiko yangu
  rationale: Katika Ayubu neno hili linaweza kumaanisha mazungumzo, tafakari, au malalamiko; muktadha wa maombolezo na ulinganifu na kuugua unaunga mkono ‘malalamiko.’
- source_word: יָדִי
  choice: mkono wangu
  rationale: Hufuata maandishi ya Kimasora yenye kiambishi cha nafsi ya kwanza umoja, bila kuyarekebisha kuwa ‘mkono wake.’
- source_word: כָּבְדָה
  choice: ni mzito
  rationale: Huwasilisha hali ya uzito kwa namna ya moja kwa moja na ya sasa.
- source_word: עַל
  choice: juu ya
  rationale: Huhifadhi kwa kiasi kikubwa upana na utata wa kihusiano wa kihusishi cha Kiebrania badala ya kuamua kwa lazima kuwa kina maana ya sababu.
- source_word: אַנְחָתִי
  choice: kuugua kwangu
  rationale: Hueleza miguno au miugua ya maombolezo inayotokana na mateso makali.
theological_decisions:
- issue: Iwapo maelezo ya Ayubu kuhusu malalamiko yake yapunguzwe ukali ili yasionekane kuwa ya ukaidi
  choice: Kudumisha maana kali ‘ya uasi’ katika matini kuu
  alternative: malalamiko yangu ni machungu
  rationale: Kiebrania hudokeza uasi au ukaidi kwa uwazi zaidi. Tafsiri inadumisha mvutano wa kitheolojia wa mtu anayeteseka na kulalamika kwa lugha kali badala ya kuupunguza kimya kimya.
- issue: Utambulisho wa ‘mkono’ na uhusiano wake na kuugua
  choice: Kudumisha ‘mkono wangu’ na muundo ‘juu ya’ katika matini kuu
  alternative: mkono wake ni mzito juu yangu / mkono wangu hunizuia nisiugue
  rationale: Maandishi ya Kimasora yanasoma ‘mkono wangu,’ lakini maana ya msemo mzima si wazi. Matini kuu huhifadhi usomaji huo na tanbihi inaonyesha tafsiri nyingine bila kuamua utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa karibu na Kiebrania umehifadhiwa mahali ambapo maana yake ina utata, huku tanbihi zikitoa njia kuu mbadala za uelewa.
