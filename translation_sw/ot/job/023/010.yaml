  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: sw
  text: Lakini yeye anaijua njia yangu[a]; atakaponijaribu[b], nitadhihirika kama dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anaijua njia iliyo pamoja nami.” Kwa kawaida usemi wa Kiebrania unaweza kumaanisha “anaijua njia yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akijaribu” au “baada ya kunijaribu.” Muundo wa Kiebrania unaweza kuonyesha nyakati tofauti.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Lakini
  rationale: Katika muktadha, Ayubu anatofautisha kutoweza kwake kumpata Mungu na Mungu kumjua kikamilifu; ‘Lakini’ linaonyesha geuko hilo la hoja kwa Kiswahili cha kawaida.
- source_word: יָדַע
  choice: anaijua
  rationale: Kitenzi kinaonyesha ujuzi wa Mungu ulio wa sasa na kamili kuhusu njia ya Ayubu.
- source_word: דֶּרֶךְ עִמָּדִי
  choice: njia iliyo pamoja nami
  rationale: Hili linafuata kwa karibu muundo wa Kiebrania, ‘njia pamoja nami,’ huku likibaki lenye kueleweka; uwezekano wa maana ‘njia yangu’ umehifadhiwa katika tanbihi.
- source_word: בְּחָנַנִי
  choice: atakaponijaribu
  rationale: בחן humaanisha kujaribu au kuchunguza ili kuthibitisha ubora; taswira inayofuata ya dhahabu inaunga mkono ‘kujaribu.’ Muundo wa Kiswahili unaonyesha wakati bila kufunga kabisa nuances zote za Kiebrania.
- source_word: כַּזָּהָב
  choice: kama dhahabu
  rationale: Kiambishi כַּ־ kinaonyesha ulinganisho; ‘kama dhahabu’ ni usemi wa kawaida unaohifadhi taswira ya usafishaji.
- source_word: אֵצֵא
  choice: nitatoka
  rationale: יצא ni kutoka au kujitokeza. ‘Nitatoka’ huhifadhi sitiari ya matokeo ya jaribio bila kuongeza wazi wazo la kutakaswa au kuhesabiwa haki.
theological_decisions:
- issue: Uhusiano kati ya jaribio la Mungu na kuthibitishwa kwa Ayubu
  choice: Kuhifadhi kauli kwamba Mungu anamjua Ayubu na kwamba matokeo ya jaribio yatakuwa kama dhahabu, bila kufafanua ikiwa hasa ni kuthibitishwa kuwa hana hatia au kutakaswa kitabia.
  alternative: Kutafsiri taswira hiyo hasa kama uthibitisho wa kisheria, au hasa kama utakaso wa maadili.
  rationale: Kiebrania chenyewe kinaruhusu taswira ya dhahabu kuashiria kuthibitishwa au kusafishwa; tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Njia iliyo pamoja nami’ ni ya kimakusudi karibu na Kiebrania na imefafanuliwa kwa tanbihi; sentensi nyingine imetolewa kwa mtiririko wa kawaida na ulio wazi.
