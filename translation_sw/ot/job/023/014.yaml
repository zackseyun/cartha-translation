  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: sw
  text: Kwa maana atatimiza kile alichoniwekea[a], na mambo mengi kama hayo yako kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amri yangu,” “sheria yangu,” au “fungu nililopangiwa.” Neno la Kiebrania linaweza kumaanisha jambo lililoamriwa au lililowekwa kwa ajili ya Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa kauli iliyotangulia na inafaa mtiririko wa hoja kwa Kiswahili.
- source_word: יַשְׁלִים
  choice: atatimiza
  rationale: Hifili ya שׁלם hapa ina maana ya kukamilisha au kutekeleza jambo hadi mwisho; “atatimiza” ni ya kawaida na huhifadhi maana zote mbili.
- source_word: חֻקִּי
  choice: kile alichoniwekea
  rationale: Katika muktadha huu חֹק ni jambo lililowekwa, kuamuliwa, au kupangiwa Ayubu. Tafsiri hii ni ya asili kwa Kiswahili na haifanyi neno hilo kuwa amri ya kisheria pekee.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: na mambo mengi kama hayo
  rationale: Huhifadhi maana ya mambo mengi ya aina hiyo bila kubainisha zaidi ya chanzo.
- source_word: עִמּוֹ
  choice: yako kwake
  rationale: Hufuata kwa ukaribu maana ya “pamoja naye/kwake” na kuacha wazi kama yanamaanisha yaliyo katika shauri, mamlaka, au uwezo wake.
theological_decisions:
- issue: Iwapo חֻקִּי itafsiriwe kwa maana ya kisheria au kama jambo ambalo Mungu amemwekea Ayubu
  choice: kile alichoniwekea
  alternative: amri yangu; sheria yangu; fungu nililopangiwa
  rationale: Muktadha unahusu yale ambayo Mungu ameamua kuhusu njia na hali ya Ayubu, si sheria iliyotungwa na Ayubu. Chaguo hili huhifadhi ukuu wa uamuzi wa Mungu huku tanbihi ikihifadhi upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kile alichoniwekea” ni usemi wa kawaida unaohifadhi kutokubainika kikamilifu kwa חֻקִּי; “yako kwake” kwa makusudi haifafanui zaidi namna mambo hayo yalivyo kwa Mungu.
