lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: Ningeweka
  rationale: Kitenzi ערך humaanisha kupanga au kuweka kwa utaratibu. Katika muktadha huu wa kimahakama, “ningeweka” ni Kiswahili cha kawaida kinachoonyesha kuwasilisha jambo kwa mpangilio.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Tafsiri hii huhifadhi maana ya kuwa mbele au katika uwepo wake, na inafaa kwa mazingira ya kusikilizwa kwa kesi.
- source_word: מִשְׁפָּט
  choice: hoja yangu
  rationale: Ingawa מִשְׁפָּט inaweza kumaanisha hukumu, haki, au shauri la kisheria, hapa inahusu jambo ambalo Ayubu angelipanga na kuliwasilisha mbele za Mungu. “Hoja yangu” ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi maana ya wazi zaidi ya kimahakama.
- source_word: וּפִי
  choice: kinywa changu
  rationale: Taswira halisi ya Kiebrania imehifadhiwa kwa kuwa usemi wa kukijaza kinywa kwa maneno unaeleweka katika Kiswahili.
- source_word: אֲמַלֵּא
  choice: kukijaza
  rationale: Huhifadhi taswira ya kujaza na huendeleza hali ya kudhania iliyoanzishwa na “ningeweka.”
- source_word: תוֹכָחוֹת
  choice: hoja za kutetea msimamo wangu
  rationale: תּוֹכָחוֹת inaweza kumaanisha maonyo, hoja, uthibitisho, au mabishano. Katika muktadha wa kimahakama, kifungu hiki kinaonyesha sababu au hoja ambazo Ayubu angezitumia kutetea msimamo wake bila kuifanya maana kuwa shutuma za kimaadili pekee.
theological_decisions:
- issue: Taswira ya kimahakama katika maneno ya Ayubu kwa Mungu
  choice: Kudumisha lugha ya kuwasilisha hoja mbele za Mungu na ujasiri wa Ayubu.
  alternative: Kutafsiri kwa ujumla zaidi kuwa Ayubu angesema malalamiko yake.
  rationale: Mkusanyiko wa ערך, משפט, na תוכחות unaibua picha ya shauri linalowasilishwa kwa utaratibu. Tafsiri haipunguzi ujasiri wa Ayubu wala kuufanya moja kwa moja kuwa ukosefu wa heshima.
- issue: Upana wa maana ya תוֹכָחוֹת
  choice: Kutumia “hoja za kutetea msimamo wangu” katika matini na kuonyesha maana nyingine katika tanbihi.
  alternative: “makaripio,” “uthibitisho,” au “mabishano.”
  rationale: Neno lina wigo mpana unaojumuisha maonyo na ubishi wa kuthibitisha jambo. Muktadha unapendelea hoja za kimahakama, lakini tanbihi huhifadhi utata halisi wa neno.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya kimahakama imehifadhiwa bila kutumia istilahi nzito zisizo za lazima. Alama zote za tanbihi zimetajwa katika matini.
