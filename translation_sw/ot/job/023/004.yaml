  text: Ningepanga shauri langu[a] mbele zake, na ningekijaza kinywa changu kwa hoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ningeweka shauri langu kwa utaratibu mbele zake.” Neno la Kiebrania מִשְׁפָּט hapa lina maana ya shauri au kesi ya kimahakama.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kutafsiriwa “makaripio,” “uthibitisho,” au “mabishano.”
