  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: sw
  text: Je, angebishana nami kwa ukuu wa nguvu zake? La; hakika angenisikiliza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “angeelekeza fikira zake kwangu”; labda pia, “angenitia nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְּ/רָב כֹּחַ
  choice: kwa ukuu wa nguvu zake
  rationale: Kirai hiki kinahifadhi wazo la wingi au ukuu wa nguvu za Mungu na kukiunganisha kwa kawaida na swali la iwapo angezitumia katika kesi dhidi ya Ayubu.
- source_word: יָרִיב עִמָּדִי
  choice: angebishana nami
  rationale: Kitenzi ריב katika muktadha huu kina maana ya kushindana katika hoja au kesi. 'Angebishana nami' ni Kiswahili cha kawaida kinachohifadhi mwelekeo wa kisheria bila kutumia istilahi nzito.
- source_word: לֹא אַךְ
  choice: La; hakika
  rationale: '''La'' linakanusha kwa nguvu uwezekano uliotajwa katika swali, na ''hakika'' linaonyesha mkazo wa badiliko kuelekea kile ambacho Ayubu anaamini Mungu angefanya.'
- source_word: יָשִׂם בִּי
  choice: angenisikiliza
  rationale: Katika muktadha wa Ayubu kutaka kuwasilisha kesi yake, שׂים + ב inaeleweka vizuri kama kumwelekezea mtu fikira au kumsikiliza. Tafsiri hii ni ya asili na inaonyesha kwamba Mungu angempa nafasi ya kusikilizwa.
theological_decisions:
- issue: Maana ya tendo la Mungu katika kipande cha pili
  choice: Ayubu anaonyesha imani kwamba Mungu hangemlemea kwa nguvu bali angemsikiliza.
  alternative: Mungu angempa Ayubu nguvu; au Mungu angemwelekezea fikira kwa maana ya jumla.
  rationale: 'Muktadha wa karibu ni wa kesi: Ayubu anatamani kuwasilisha hoja zake mbele za Mungu (23:3–7). Hivyo, maana ya kumpa nafasi ya kusikilizwa inafaa zaidi, huku tanbihi ikihifadhi uwezekano halisi wa kileksia. Hii haiondoi mvutano kati ya nguvu za Mungu na tumaini la Ayubu kwamba Mungu atatenda kwa haki.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Angebishana nami' hudokeza mzozo wa hoja au kesi bila kuwa cha kitaalamu kupita kiasi; 'angenisikiliza' ni wazi kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
