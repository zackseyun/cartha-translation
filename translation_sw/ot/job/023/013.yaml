base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: sw
  text: Lakini yeye ni wa nia moja[a]; ni nani anayeweza kumrudisha nyuma? Nafsi yake ikitamani jambo[b], yeye hulitenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi na maneno ya Kiebrania, “yeye ni mmoja.” Katika muktadha, huenda maana yake ni kwamba ana nia moja au ni thabiti katika kusudi lake.
    reason: alternative_reading
  - marker: b
    text: Au “Akitamani jambo, hulitenda.” Kiebrania kinasema “nafsi yake,” usemi wa kawaida unaoweza kumaanisha utashi au matakwa ya mtu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Lakini yeye
  rationale: Kiunganishi kinaonyesha utofautishaji na muktadha uliotangulia, huku kiwakilishi huru ‘yeye’ kikihifadhiwa kwa msisitizo.
- source_word: בְאֶחָד
  choice: ni mmoja
  rationale: Hili ndilo tamko la karibu zaidi na muundo wa Kiebrania na linahifadhi uwezekano wa maana ya kuwa na kusudi moja lisilobadilika bila kuifanya tafsiri hiyo kuwa ndiyo maana pekee katika matini kuu.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: ni nani anayeweza kumrudisha nyuma?
  rationale: Hifili ya שׁוב hapa ina wazo la kumrudisha mtu nyuma au kumgeuza kutoka katika njia au kusudi lake. Usemi huu huhifadhi taswira hiyo na nguvu ya swali la balagha.
- source_word: וְנַפְשׁוֹ
  choice: Nafsi yake
  rationale: ‘Nafsi’ huhifadhi usemi wa Kiebrania unaomtaja mtu mwenyewe, mapenzi yake, au tamaa yake, badala ya kuufanya moja kwa moja kuwa ‘yeye’.
- source_word: אִוְּתָה
  choice: ikitamani jambo
  rationale: Kitenzi kinaeleza kutamani au kutaka. ‘Ikitamani jambo’ ni Kiswahili cha kawaida kinachobeba maana ya hiari bila kuongeza dhana ya lazima ya shauku kali.
- source_word: וַיָּעַשׂ
  choice: yeye hulitenda
  rationale: ‘Hulitenda’ hutafsiri kitenzi cha kawaida עשה (‘kufanya’) kwa uwazi, na ‘yeye’ huonyesha kwamba Mungu hufanya jambo lile ambalo nafsi yake hulitamani.
theological_decisions:
- issue: Kauli kuhusu umoja au kutobadilika kwa kusudi la Mungu
  choice: Lakini yeye ni mmoja[a]
  alternative: Lakini yeye habadiliki katika kusudi lake
  rationale: Kiebrania kinasema kwa ufupi ‘yeye [yu] katika mmoja/ni mmoja.’ Katika muktadha huenda kikamaanisha kwamba Mungu ana nia moja thabiti isiyoweza kugeuzwa, lakini tafsiri ‘habadiliki’ ingeamua maana iliyodokezwa. Matini kuu inahifadhi tamko la msingi, na tanbihi inaeleza maana inayowezekana.
- issue: Usemi wa kibinadamu kuhusu ‘nafsi’ ya Mungu
  choice: Nafsi yake ikitamani jambo[b]
  alternative: Akitamani jambo
  rationale: Kuhifadhi ‘nafsi yake’ kunadumisha usemi halisi na mvutano wa lugha ya kibinadamu inayotumiwa kumhusu Mungu; tanbihi inaonyesha maana ya kawaida ya mapenzi au tamaa ya mtu mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kishairi ni mfupi na wenye nguvu; ‘kumrudisha nyuma’ huhifadhi taswira ya Kiebrania, na tanbihi zinafafanua misemo ambayo ingeweza kuwa fiche bila kufuta utata wake.
