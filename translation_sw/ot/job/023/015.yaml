base_translation:
  language: en
  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: sw
  text: Kwa hiyo, naingiwa na hofu kuu mbele zake[a]; ninapotafakari[b], ninamwogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu yake”; Kiebrania kihalisi kina wazo la “kutoka mbele ya uso/uwepo wake.”
    reason: lexical_alternative
  - marker: b
    text: Au “ninapofikiri kwa makini” au “ninapoyatafakari haya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kirai hiki kinaonyesha hitimisho linalotokana na maneno yaliyotangulia; “Kwa hiyo” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa kimantiki.
- source_word: מִפָּנָיו
  choice: mbele zake
  rationale: Kirai cha Kiebrania, kihalisi “kutoka kwa uso/uwepo wake,” kinaeleza mwitikio wa Ayubu akiwa mbele za Mungu. “Mbele zake” kinahifadhi picha ya uwepo bila kukifasiri moja kwa moja kuwa sababu pekee.
- source_word: אֶבָּהֵל
  choice: naingiwa na hofu kuu
  rationale: Nifali ya בהל huonyesha kushtuka, kufadhaika, au kutishwa sana. Usemi huu wa Kiswahili unaonyesha nguvu ya hofu ya Ayubu bila kuipunguza kuwa mshangao au kicho tu.
- source_word: אֶתְבּוֹנֵן
  choice: ninapotafakari
  rationale: Umbo hili la בין hapa lina maana ya kufikiri kwa makini au kutafakari. Kiunganishi “-po-” kinaonyesha kwa kawaida uhusiano kati ya kutafakari huko na hofu inayofuata.
- source_word: וְאֶפְחַד
  choice: ninamwogopa
  rationale: פחד hueleza hofu, na pamoja na kiambishi kinachofuata, “ninamwogopa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: מִמֶּנּוּ
  choice: -mwogopa
  rationale: Kiambishi cha nafsi ya tatu kimeingizwa kiasili katika kitenzi cha Kiswahili, kikimrejelea Mungu bila kuongeza jina au cheo ambacho hakipo katika mstari.
theological_decisions:
- issue: Mrejelewa wa viambishi vya nafsi ya tatu vya kiume
  choice: Viambishi vimetafsiriwa “zake” na “-mw-,” vikimrejelea Mungu bila kutaja jina lake moja kwa moja.
  alternative: Kuweka wazi “Mungu” katika mstari.
  rationale: Kiebrania kinatumia viambishi, na muktadha unaweka wazi mrejelewa. Kuvihifadhi kunadumisha mtiririko wa mazungumzo na hakiongezi cheo kisichokuwapo.
- issue: Ukali wa mwitikio wa Ayubu mbele za Mungu
  choice: Imetumiwa lugha yenye nguvu, “naingiwa na hofu kuu” na “ninamwogopa.”
  alternative: Lugha nyepesi kama “ninafadhaika” au tafsiri inayoelekeza kwenye kicho cha ibada pekee.
  rationale: Mstari unaonyesha woga halisi na mzito wa Ayubu. Tafsiri haipunguzi wala kutatua kimafundisho mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mbele zake” ni usemi wa kawaida wa kibiblia lakini bado unaeleweka kwa wasomaji wa leo; “hofu kuu” huhifadhi ukali wa אֶבָּהֵל, huku “ninamwogopa” ikitoa sambamba ya wazi na ya kawaida.
