  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: sw
  text: Kwa maana sikunyamazishwa kwa sababu ya giza[a], wala kwa sababu giza zito lilifunika uso wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana sikukatiliwa mbali kwa sababu ya giza, wala kwa sababu giza nene lilifunika uso wangu.” Kiebrania cha mstari huu ni kigumu, hasa maana ya “sikunyamazishwa/sikukatiliwa mbali” na kama kishazi cha pili kinamaanisha “lilifunika uso wangu” au “lilifunika mbele yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutambulisha maelezo au sababu inayohusiana na kauli iliyotangulia bila kuongeza kiwango cha uhakika kisichokuwamo katika Kiebrania.
- source_word: נִצְמַתִּי
  choice: sikunyamazishwa
  rationale: Nifali ya צמת inaweza kumaanisha kunyamazishwa, kukatiliwa mbali, au kuangamizwa. Hapa ‘sikunyamazishwa’ inadumisha kauli tendwa na inafaa katika muktadha wa Ayubu kuendelea kusema katikati ya mateso, huku uwezekano wa ‘sikukatiliwa mbali’ ukihifadhiwa katika tanbihi.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: kwa sababu ya giza
  rationale: מִפְּנֵי inaeleweka kwa maana ya kisababishi hapa; tafsiri hii ni ya kawaida katika Kiswahili na haibadili giza kuwa mahali halisi.
- source_word: וּמִפָּנַי
  choice: uso wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja kwenye פָּנִים kinaweza kuelekeza kwenye ‘uso wangu,’ ingawa muundo wa kishairi unaweza pia kueleweka ‘mbele yangu’; utata huo umeelezwa katika tanbihi.
- source_word: כִּסָּה
  choice: lilifunika
  rationale: Kitenzi hiki kwa kawaida humaanisha kufunika au kusitiri; ‘lilifunika’ ni cha moja kwa moja na cha asili katika mstari huu.
- source_word: אֹפֶל
  choice: giza zito
  rationale: אֹפֶל huonyesha giza au utusitusi mzito kuliko חֹשֶׁךְ ya awali; ‘giza zito’ huhifadhi tofauti hiyo ya msamiati.
