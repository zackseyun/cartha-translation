  text: שְׂמֹ֣אול בַּ/עֲשֹׂת֣/וֹ וְ/לֹא אָ֑חַז יַעְטֹ֥ף יָ֝מִ֗ין וְ/לֹ֣א אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: sw
  text: Upande wa kushoto, anapotenda kazi, simtambui; akijifunika upande wa kulia,[a] simwoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akigeuka kuelekea upande wa kulia.” Kiebrania kinaweza kueleweka kuwa anajifunika au kujificha huko.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kushoto” na “kulia.” Maneno hayo nyakati nyingine yanaweza kumaanisha kaskazini na kusini; hapa tafsiri imehifadhi utofautishaji wa kishairi wa pande hizo.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂמֹאול
  choice: upande wa kushoto
  rationale: Maana ya msingi ni upande wa kushoto; hapa inalingana kishairi na יָמִין, ‘upande wa kulia.’ Ingawa inaweza pia kumaanisha kaskazini, kuhifadhi utofautishaji wa kushoto na kulia kunafuata muundo wa Kiebrania.
- source_word: בַּעֲשֹׂתוֹ
  choice: anapotenda kazi
  rationale: ב pamoja na kitenzi-jina na kiambishi cha nafsi ya tatu huleta maana ya wakati, ‘anapofanya/anapotenda.’ Usemi huu ni wa kawaida na unadumisha wazo la utendaji wake.
- source_word: אָחַז
  choice: simtambui
  rationale: Kitenzi hiki kimsingi ni ‘kushika’ au ‘kukamata,’ lakini katika muktadha huu kinaeleza kushindwa kumfikia au kumtambua Mungu. ‘Simtambui’ huwasilisha kutoweza kumwona au kumwelewa alipo bila kudai kwamba Ayubu anajaribu kumkamata kimwili.
- source_word: יַעְטֹף
  choice: akijifunika
  rationale: Maana ya kawaida ya עטף ni kujifunika, kujizingira, au kufunika. Tafsiri hii inadumisha taswira halisi na ugumu wa mstari badala ya kuibadili moja kwa moja kuwa ‘akigeuka.’
- source_word: יָמִין
  choice: upande wa kulia
  rationale: Maana ya msingi ni kulia, na hapa inakamilisha ulinganifu wa kishairi na upande wa kushoto. Maana inayowezekana ya kusini imewekwa katika tanbihi.
- source_word: אֶרְאֶה
  choice: simwoni
  rationale: ראה humaanisha moja kwa moja ‘kuona.’ Kiambishi cha yambwa kinadokezwa na muktadha na huonyeshwa kwa ‘-mw-’ katika Kiswahili.
theological_decisions:
- issue: Anayerejelewa na vitenzi na viambishi vya nafsi ya tatu
  choice: Mungu ndiye anayerejelewa, kama inavyoonyeshwa na muktadha, lakini jina lake haliongezwi katika mstari.
  alternative: Mhusika asiyeainishwa, ‘yeye.’
  rationale: Muktadha wa Ayubu 23:8–10 unaonyesha wazi kwamba Ayubu anamtafuta Mungu. Kiswahili kinaweza kuhifadhi rejeo hili katika viambishi vya kitenzi bila kuongeza jina ambalo halimo katika mstari huu.
- issue: Maana ya יַעְטֹף
  choice: akijifunika
  alternative: akigeuka
  rationale: Maana ya ‘kujifunika’ inahifadhi taswira ya Kiebrania na wazo la kutokuonekana. ‘Akigeuka’ ni ufafanuzi unaowezekana, lakini si lazima uamuliwe katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; ‘simtambui’ hutofautishwa na ‘simwoni,’ huku ‘akijifunika’ ikihifadhi utata wa neno la Kiebrania.
