  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: sw
  text: Lakini Mungu ameufanya moyo wangu kuwa dhaifu[a], naye Mwenyezi amenitia hofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameulainisha moyo wangu.” Kitenzi cha Kiebrania kwa maana halisi ni “ameufanya kuwa laini/nyororo”; hapa huenda kinamaanisha kwamba ujasiri wa Ayubu umeyeyuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: Lakini Mungu
  rationale: אֵל ni jina la cheo la kawaida lenye maana ya “Mungu.” Kiunganishi וְ kinaweza kuwa “na,” lakini hapa muktadha unaonyesha tofauti na maelezo yaliyotangulia, hivyo “lakini” linafuata mtiririko wa hoja bila kuongeza maana isiyokuwapo.
- source_word: הֵרַךְ
  choice: ameufanya ... kuwa dhaifu
  rationale: Kitenzi hiki kimsingi humaanisha kufanya kitu kiwe laini au chororo. Kinapotumiwa kuhusu moyo hapa, kinaonyesha kupoteza ujasiri au nguvu za ndani. Tafsiri hii ni ya kawaida na wazi kwa msomaji wa Kiswahili, huku maana halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: לֵב humaanisha moyo au utu wa ndani, pamoja na ujasiri na nia. “Moyo wangu” huhifadhi taswira ya Kiebrania na inaeleweka vizuri katika Kiswahili.
- source_word: וְשַׁדַּי
  choice: naye Mwenyezi
  rationale: שַׁדַּי ni cheo cha Mungu. “Mwenyezi” huhifadhi nguvu ya cheo hicho na muundo wa kishairi unaoweka majina mawili ya cheo sambamba.
- source_word: הִבְהִילָנִי
  choice: amenitia hofu
  rationale: Hifili ya בהל humaanisha kusababisha hofu, mshtuko, au fadhaa. “Amenitia hofu” ni usemi wa Kiswahili wa kawaida unaowasilisha hali kali ya kuogopa inayokusudiwa hapa.
theological_decisions:
- issue: Tafsiri ya majina ya cheo אֵל na שַׁדַּי
  choice: Mungu ... Mwenyezi
  alternative: Mungu ... Shadai
  rationale: Maneno haya mawili yanatumika sambamba kama majina ya cheo ya Mungu. Kuyatafsiri huwasilisha maana yake kwa msomaji wa Kiswahili bila kuyageuza kuwa majina binafsi wala kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. Muundo sambamba wa kishairi umehifadhiwa, na “naye” linaunganisha kishazi cha pili kwa mtiririko wa kawaida.
