base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: sw
  text: Mguu wangu umeshikamana na nyayo zake[a]; nimeishika njia yake, wala sikukengeuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mguu wangu umeshika hatua yake”; picha ya Kiebrania ni ya kufuata nyayo za Mungu kwa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: na nyayo zake
  rationale: אֲשׁוּר humaanisha hatua au unyayo. Hapa 'nyayo zake' inadumisha picha ya kufuata kwa karibu alikokanyaga Mungu; kiambishi בְּ pamoja na אָחַז kinaweza kutolewa kwa Kiswahili kwa 'shikamana na'.
- source_word: אָחֲזָה
  choice: umeshikamana
  rationale: Kitenzi אחז humaanisha kushika au kukamata. Pamoja na 'mguu wangu' na 'nyayo zake,' 'umeshikamana' kinaonyesha kufuata kwa uthabiti bila kuleta wazo la kukamata kwa nguvu.
- source_word: רַגְלִי
  choice: Mguu wangu
  rationale: Kiebrania kina umoja, na Kiswahili kinaweza kuuhifadhi kwa kawaida huku kikidumisha picha halisi ya mguu unaofuata nyayo.
- source_word: דַּרְכּוֹ
  choice: njia yake
  rationale: דֶּרֶךְ ni njia au mwenendo. 'Njia yake' ni tafsiri ya moja kwa moja inayohifadhi maana halisi na ya kimaadili.
- source_word: שָׁמַרְתִּי
  choice: nimeishika
  rationale: שׁמר humaanisha kutunza, kushika, au kuzingatia. 'Nimeishika njia yake' ni Kiswahili cha kawaida kinachoonyesha uaminifu wa kuifuata.
- source_word: וְלֹא אָט
  choice: wala sikuiacha
  rationale: Katika muktadha wa njia, אָט inaeleza kutokengeuka au kutopotoka. 'Wala sikuiacha' ni kauli ya asili inayodumisha picha ya kutobanduka katika njia; tanbihi inaonyesha tafsiri ya moja kwa moja zaidi.
theological_decisions:
- issue: Marejeo ya viambishi vya nafsi ya tatu katika 'nyayo zake' na 'njia yake'
  choice: Viambishi vinamrejelea Mungu.
  alternative: Njia ya haki isiyotajwa kuwa ya mtu fulani.
  rationale: Katika muktadha wa Ayubu 23:10–12, Ayubu anazungumza kuhusu Mungu na uadilifu wake mbele zake. Viambishi vinaachwa katika umbo la kawaida la 'zake/yake,' bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Picha ya mguu, nyayo, na njia imehifadhiwa; usemi 'umeshikamana na' unaeleweka kwa urahisi na unaonyesha ufuasi thabiti.
