  text: שָׁ֗ם יָ֭שָׁר נוֹכָ֣ח עִמּ֑/וֹ וַ/אֲפַלְּטָ֥ה לָ֝/נֶ֗צַח מִ/שֹּׁפְטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: sw
  text: Huko mtu mnyofu angeweza kujadiliana naye[a], nami ningeokolewa milele kutoka kwa mwamuzi wangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “angeweza kubishana naye” au “kuwasilisha kesi yake mbele yake.”
    reason: lexical_alternative
  - marker: b
    text: Au “nami ningeponyoka milele kutoka kwa mwamuzi wangu”; Kiebrania kinaweza pia kueleweka kuwa “kutoka kwa anayenihukumu.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Huko
  rationale: Ni kielezi cha mahali kinachoelekeza kwenye mahali pa kukutana na Mungu panapowaziwa katika muktadha; “Huko” ni cha kawaida na wazi katika Kiswahili.
- source_word: יָשָׁר
  choice: mtu mnyofu
  rationale: Kivumishi hiki huonyesha unyofu wa kimaadili au uadilifu. Kuongeza “mtu” kunafanya sentensi iwe ya asili katika Kiswahili bila kuongeza maana mpya.
- source_word: נוֹכָח
  choice: angeweza kujadiliana naye
  rationale: Katika muktadha huu neno lina maana ya kimahakama ya kujenga hoja au kuwasilisha kesi. “Kujadiliana” huhifadhi wazo la mahojiano yenye hoja bila kulifanya kuwa istilahi nzito ya kisheria; “angeweza” huonyesha uwezekano unaodokezwa na muktadha.
- source_word: עִמּוֹ
  choice: naye
  rationale: Huhifadhi maana ya moja kwa moja ya “pamoja naye/na yeye” na kiwakilishi cha Kiebrania bila kumtaja Mungu waziwazi mahali ambapo maandishi yametumia kiwakilishi.
- source_word: וַאֲפַלְּטָה
  choice: nami ningeokolewa
  rationale: Mzizi פלט huonyesha kuponyoka au kuokolewa. Kauli tendwa “ningeokolewa” inafaa katika mazingira ya hukumu na haiongezi maana mahususi ya kuachiwa huru kisheria.
- source_word: לָנֶצַח
  choice: milele
  rationale: Huonyesha matokeo ya kudumu. “Milele” ni usemi wa kawaida, wenye heshima, na huhifadhi nguvu ya neno la Kiebrania.
- source_word: מִשֹּׁפְטִי
  choice: kutoka kwa mwamuzi wangu
  rationale: Muundo unaweza kumaanisha “mwamuzi wangu” au “anayenihukumu.” Tafsiri hii ni fupi, huhifadhi taswira ya mahakama, na haimbanishi mhusika kuwa mshtaki.
theological_decisions:
- issue: Mhusika na maana ya kimahakama ya “mwamuzi wangu”
  choice: Kuhifadhi “mwamuzi wangu” bila kufafanua ikiwa ni Mungu kama mwamuzi au yule anayemhukumu Ayubu.
  alternative: anayenihukumu; mshtaki wangu
  rationale: Kiebrania hudumisha taswira ya kimahakama na kinaweza kueleweka kuwa “mwamuzi wangu” au “anayenihukumu.” Kutofafanua zaidi huhifadhi utata na mvutano wa kifungu bila kuingiza msimamo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya kimahakama imehifadhiwa kwa maneno yanayoeleweka kwa wasomaji wa kawaida, huku kiwakilishi na utata wa “mwamuzi wangu” vikibaki kama katika chanzo.
