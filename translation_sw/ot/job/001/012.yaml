  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: sw
  text: Yahwe akamwambia Mshitaki[a], “Tazama, kila kitu alicho nacho kiko mkononi mwako; isipokuwa usinyoshe mkono wako dhidi yake.” Kisha Mshitaki akaondoka kutoka mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Shetani” au “yule mpinzani.” Kiebrania kina kibainishi, kinachodokeza cheo au jukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Limetoholewa kama jina la Mungu badala ya kubadilishwa na cheo kama “BWANA,” hivyo kuhifadhi jina binafsi katika maandishi ya Kiebrania.
- source_word: הַשָּׂטָן
  choice: Mshitaki
  rationale: Kibainishi cha Kiebrania kinaonyesha cheo au jukumu; “Mshitaki” kinawasilisha dhima ya kushtaki katika muktadha huu bila kulifanya moja kwa moja kuwa jina binafsi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili la kuvuta fikira lina nguvu ya msisitizo na “Tazama” ni Kiswahili cha sasa, cha heshima na kinachoeleweka.
- source_word: כָל אֲשֶׁר לוֹ
  choice: kila kitu alicho nacho
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayohifadhi upeo wa mali yote ya Ayubu.
- source_word: בְּיָדֶךָ
  choice: kiko mkononi mwako
  rationale: Imehifadhi picha ya “mkono” inayomaanisha mamlaka au uwezo, pamoja na urudiaji wake katika kishazi kinachofuata.
- source_word: רַק
  choice: lakini
  rationale: Katika katazo hili neno linaweka mpaka mmoja wa ruhusa iliyotolewa; “lakini” linaonyesha kwa kawaida utofauti huo katika Kiswahili.
- source_word: אֵלָיו אַל תִּשְׁלַח יָדֶךָ
  choice: usinyoshe mkono wako dhidi yake
  rationale: Tafsiri hii inadumisha sitiari na urudiaji wa “mkono,” huku “dhidi yake” ikionyesha wazi hatua ya madhara inayoelekezwa kwa Ayubu.
- source_word: וַיֵּצֵא
  choice: akaondoka
  rationale: Kitenzi hiki kinaendeleza simulizi kwa Kiswahili cha kawaida na kuonyesha kuondoka mahali hapo.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Nahau hii inaonyesha kuondoka katika uwepo wa Yahwe; “mbele za” huhifadhi taswira ya baraza bila ugumu usio wa lazima.
theological_decisions:
- issue: Tafsiri ya הַשָּׂטָן katika utangulizi wa Ayubu
  choice: Mshitaki
  alternative: Shetani; huyo mpinzani
  rationale: Kiebrania kina kibainishi, jambo linaloelekea kuonyesha cheo au jukumu. “Mshitaki” huhifadhi maana ya kisemantiki na mvutano wa kifungu bila kuingiza kwa lazima dhana ya baadaye ya jina binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida, huku taswira ya “mkono” na utata halisi wa הַשָּׂטָן vikihifadhiwa.
