  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: sw
  text: Je, hukuweka uzio[a] kumzunguka yeye, na kuizunguka nyumba yake, na kuzunguka kila kitu alicho nacho, pande zote? Umebariki kazi ya mikono yake, na mifugo yake imeenea[b] kotekote nchini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukumzungushia uzio.” Kiebrania kinatumia taswira halisi ya ua au uzio wa kinga unaozunguka.
    reason: lexical_alternative
  - marker: b
    text: Au, “imeongezeka sana nchini.” Kitenzi cha Kiebrania kihalisi hudokeza kufumuka, kuvuka mipaka, au kuenea kwa wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: hukuweka uzio kumzunguka
  rationale: Huhifadhi taswira halisi ya kuweka kinga inayozunguka, badala ya kuitafsiri kwa neno la jumla tu kama ‘kulinda.’
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ / מִסָּבִיב
  choice: kumzunguka yeye, nyumba yake, na kila kitu alicho nacho, pande zote
  rationale: Hutoa maana ya ulinzi unaowazunguka Ayubu, nyumba yake, na mali yake kikamilifu.
- source_word: מַעֲשֵׂה יָדָיו
  choice: kazi ya mikono yake
  rationale: Ni nahau inayoeleweka kwa kazi na shughuli za uzalishaji za mtu, huku ikihifadhi umbo la Kiebrania.
- source_word: בֵּרַכְתָּ
  choice: umebariki
  rationale: Hudumisha dai la wazi kwamba mafanikio hayo yametokana na baraka ya Mungu, si ustawi wa kiuchumi tu.
- source_word: מִקְנֵהוּ
  choice: mifugo yake
  rationale: Neno hili humaanisha hasa wanyama wanaomilikiwa au makundi ya mifugo, wala si mali yote kwa ujumla.
- source_word: פָּרַץ בָּאָרֶץ
  choice: imeenea kotekote nchini
  rationale: Huwasilisha picha ya mifugo kupanuka na kusambaa kwa wingi katika eneo lote, inayotokana na kitenzi chenye wazo la kufumuka au kuvuka mipaka.
- source_word: הֲלֹא
  choice: Je, huku-
  rationale: Huhifadhi nguvu ya swali la balagha na shtaka la msemaji.
theological_decisions:
- issue: Kudumisha lugha ya baraka badala ya kuipunguza kuwa ustawi wa mali
  choice: Umebariki kazi ya mikono yake
  alternative: Umefanikisha kazi ya mikono yake
  rationale: Kitenzi cha Kiebrania kinasema ‘bariki’; tafsiri hii huhifadhi dai kwamba Mungu ndiye chanzo cha mafanikio ya Ayubu.
- issue: Kuhifadhi taswira ya kinga inayozunguka
  choice: hukuweka uzio kumzunguka
  alternative: hukumkinga
  rationale: Uzio ni taswira halisi ya maandishi ya Kiebrania na huonyesha ulinzi kamili bila kuigeuza kuwa maelezo ya jumla.
- issue: Nguvu ya פָּרַץ kuhusu kuongezeka kwa mifugo
  choice: imeenea kotekote nchini
  alternative: imeongezeka sana nchini
  rationale: Chaguo kuu huhifadhi taswira ya kupanuka au kufumuka, huku chaguo jingine likibainisha zaidi wingi; maandishi yanaweza kubeba vivuli vyote viwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Swali la balagha na urudiaji wa ulinzi unaozunguka vimehifadhiwa; ‘kazi ya mikono yake’ imeachwa kama nahau iliyo wazi na ya kawaida.
