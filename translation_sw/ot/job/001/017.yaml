base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: sw
  text: Huyu alipokuwa bado anasema, mjumbe mwingine akaja akasema, “Wakaldayo walijigawa katika makundi matatu[a], wakavamia ngamia na kuwachukua. Nao wakawaua vijana kwa makali ya upanga[b][c]. Ni mimi peke yangu niliyenusurika kukupa habari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walijipanga katika vikosi vitatu” au “waligawanyika katika makundi matatu”; kwa neno halisi, “waliweka vichwa vitatu.”
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania ni “waliwapiga kwa kinywa cha upanga,” yaani waliwaua kwa upanga.
    reason: lexical_alternative
  - marker: c
    text: Katika muktadha huu, “vijana” huenda ikamaanisha watumishi au wahudumu wa nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: Huyo alipokuwa bado anasema
  rationale: Huonyesha kwamba ujumbe unaofuata uliwasili kabla mjumbe wa kwanza hajamaliza kusema; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: mjumbe mwingine akaja na kusema
  rationale: זֶה ya pili humtambulisha mtu mwingine katika mfululizo wa wajumbe; ‘mjumbe’ inaeleweka kutokana na muktadha.
- source_word: כַּשְׂדִּים
  choice: Wakaldayo
  rationale: Ni jina la kawaida la Kiswahili la kundi hili la watu.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: walijipanga katika vikundi vitatu vya kuvamia
  rationale: Usemi wa moja kwa moja ni ‘waliweka vichwa vitatu’; katika muktadha wa uvamizi unaashiria kujigawa au kujipanga katika vikosi vitatu.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: wakawashambulia
  rationale: Kitenzi hiki katika muktadha huu humaanisha kufanya uvamizi au kuwashukia kwa ghafla.
- source_word: הַגְּמַלִּים וַיִּקָּחוּם
  choice: ngamia na kuwachukua
  rationale: Kiwakilishi cha Kiebrania kinawarejelea ngamia; ‘kuwachukua’ kinaonyesha kutekwa kwao katika uvamizi.
- source_word: הַנְּעָרִים
  choice: vijana
  rationale: Hili ndilo wazo la msingi la neno, huku uwezekano wa kuwa watumishi au wahudumu ukihifadhiwa katika tanbihi.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: wakawaua ... kwa makali ya upanga
  rationale: Nahau ya Kiebrania ni ‘kwa kinywa cha upanga’ na humaanisha kuwaua kwa upanga; ‘makali’ huhifadhi picha hiyo kwa Kiswahili cha kawaida.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Ni mimi peke yangu niliyenusurika
  rationale: Huhifadhi msisitizo maradufu kwamba mjumbe ndiye pekee aliyepona.
- source_word: לְהַגִּיד לָךְ
  choice: kuja kukuarifu
  rationale: Huleta kwa Kiswahili cha asili kusudi la kunusurika kwake, yaani kufikisha taarifa kwa Ayubu.
