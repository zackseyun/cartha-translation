base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: sw
  text: Ikawa siku moja, wana wa Mungu[a] wakaja kujihudhurisha mbele za Yahwe, naye Mhasimu[b] akaja pia miongoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “wana wa Mungu” hapa wanarejelea viumbe wa mbinguni katika baraza la Mungu.
    reason: cultural_note
  - marker: b
    text: Au, kwa tafsiri ya kimapokeo, “Shetani.” Kiebrania kina neno “shetani/mhasimu” lenye kibainishi; hapa neno hilo huenda ni cheo badala ya jina la pekee.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Ikawa siku moja
  rationale: Hufungua tukio jipya la simulizi kwa Kiswahili cha kawaida huku ikihifadhi muundo wa utangulizi wa Kiebrania bila kuongeza kiashiria kisichokuwamo katika chanzo.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: wana wa Mungu
  rationale: Tafsiri ya karibu na muundo wa Kiebrania inayohifadhi taswira na utata wake; ‘viumbe wa mbinguni’ ingekuwa tayari ni ufafanuzi.
- source_word: לְהִתְיַצֵּב
  choice: kujihudhurisha
  rationale: Katika muktadha wa kufika mbele ya mwenye mamlaka, kitenzi hiki huonyesha kujitokeza rasmi na kuhudhuria, si kusimama kimwili tu.
- source_word: עַל יְהוָה
  choice: mbele za Yahwe
  rationale: Pamoja na kitenzi cha kujihudhurisha, עַל hapa hutoa maana ya kufika mbele ya mwenye mamlaka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: הַשָּׂטָן
  choice: Mhasimu
  rationale: Nomino ya Kiebrania ina kibainishi na hapa inaweza kuwa cheo au jukumu. ‘Mhasimu’ huhifadhi maana ya mpinzani bila kuifanya moja kwa moja kuwa jina la pekee.
- source_word: בְּתוֹכָם
  choice: katikati yao
  rationale: Tafsiri ya asili ya Kiswahili inayoonyesha kwamba Mhasimu alikuwamo pamoja na kundi hilo.
theological_decisions:
- issue: Iwapo הַשָּׂטָן litafsiriwe kama jina la pekee au cheo
  choice: Mhasimu
  alternative: Shetani; Mshitaki
  rationale: Kibainishi cha Kiebrania kinaunga mkono kulichukua neno hapa kama cheo au jukumu. Tafsiri hii inahifadhi maana yake ya msingi na haileti mapema matumizi ya baadaye kama jina la pekee; tafsiri ya kimapokeo imewekwa katika tanbihi.
- issue: Iwapo בְּנֵי הָאֱלֹהִים lifafanuliwe au litafsiriwe kwa ukaribu
  choice: wana wa Mungu
  alternative: viumbe wa mbinguni; viumbe vya kiungu
  rationale: Huenda maneno haya yanarejelea viumbe wa baraza la mbinguni, lakini tafsiri ya karibu inahifadhi taswira na utata wa Kiebrania badala ya kuamua utambulisho wao katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kujihudhurisha mbele za’ linaonyesha kufika rasmi mbele ya mwenye mamlaka. Herufi kubwa katika ‘Mhasimu’ inaashiria cheo cha mhusika bila kuamua kwamba tayari ni jina la pekee.
