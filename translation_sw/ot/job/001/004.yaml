base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: sw
  text: Wanawe wa kiume walikuwa na desturi ya kwenda kufanya karamu, kila mmoja nyumbani kwake katika siku yake[a]. Nao walikuwa wakiwatumia ujumbe na kuwaalika dada zao watatu ili wale na kunywa pamoja nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “katika siku yake ya kuzaliwa.” Kiebrania kinasema kihalisi, “katika siku yake,” jambo linaloweza kumaanisha siku ya zamu iliyowekwa kwa kila mwana au siku yake ya kuzaliwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: walikuwa wakienda
  rationale: Katika muktadha wa mistari 4–5, kitenzi kinaeleza desturi ya kurudiwa katika wakati uliopita; muundo huu wa Kiswahili unaonyesha tendo la mazoea.
- source_word: בָנָיו
  choice: wanawe wa kiume
  rationale: Nomino ya Kiebrania ni wingi wa kiume, na dada zao wanatajwa kando; ufafanuzi huu unaondoa uwezekano wa kueleweka kuwa ni watoto wote.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: kufanya karamu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau ya Kiebrania inayomaanisha kuandaa au kufanya sherehe yenye chakula na vinywaji.
- source_word: בֵּית אִישׁ
  choice: kila mmoja nyumbani kwake
  rationale: 'Muundo wa Kiebrania una maana ya mgawanyo: kila mwana alifanya karamu nyumbani kwake kwa zamu.'
- source_word: יוֹמוֹ
  choice: katika siku yake
  rationale: Huhifadhi usemi wa Kiebrania bila kuamua kama ulikuwa siku ya zamu iliyopangwa au siku yake ya kuzaliwa.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: walikuwa wakituma ujumbe na kuwaalika
  rationale: Vitenzi viwili vinaonyesha kutuma mwito na kutoa mwaliko; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la desturi.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: dada zao watatu
  rationale: Hutafsiri wazi nambari, jinsia, na uhusiano wa kifamilia uliomo katika Kiebrania.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: waje kula na kunywa
  rationale: Neno 'waje' linaonyesha kwa kawaida kusudi la mwaliko katika Kiswahili, huku 'kula na kunywa' ikihifadhi jozi ya vitenzi vya Kiebrania.
- source_word: עִמָּהֶם
  choice: pamoja nao
  rationale: Huonyesha ushiriki wa dada katika karamu pamoja na ndugu zao.
theological_decisions:
- issue: Maana ya יוֹמוֹ ('siku yake')
  choice: katika siku yake
  alternative: katika siku yake ya kuzaliwa; katika siku yake ya zamu
  rationale: Kiebrania hakibainishi ikiwa ni siku ya kuzaliwa au siku maalumu ya zamu ya kila mwana; matini kuu inadumisha utata huo, na tanbihi inaeleza uwezekano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo 'walikuwa waki-' umetumiwa kuonyesha desturi ya kurudiwa zamani. 'Wanawe wa kiume' hutofautisha wana saba na dada watatu bila kutumia lugha ya kimadhehebu.
