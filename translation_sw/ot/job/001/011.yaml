  text: וְ/אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֖ע בְּ/כָל אֲשֶׁר ל֑/וֹ אִם לֹ֥א עַל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: sw
  text: Lakini nyosha mkono wako, tafadhali, na uguse kila kitu alicho nacho, hakika atakulaani usoni pako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno lililotafsiriwa “atakulaani” kwa maana halisi ni “atakubariki.” Katika utangulizi wa kitabu cha Ayubu, kwa kawaida linaeleweka kuwa usemi wa staha badala ya kusema “atakulaani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini
  rationale: Huonyesha tofauti yenye mkazo na kauli iliyotangulia kwa Kiswahili cha kawaida na cha heshima.
- source_word: שְׁלַח נָא יָדְךָ
  choice: nyosha mkono wako, tafadhali
  rationale: Huhifadhi taswira ya Kiebrania ya kunyosha mkono ili kutumia nguvu, huku 'tafadhali' ikiwakilisha chembe נָא ya ombi au changamoto.
- source_word: וְגַע
  choice: uguse
  rationale: Huhifadhi maana ya msingi ya נגע, 'gusa'; katika muktadha huu mguso huo unadokeza tendo lenye kudhuru bila kulifanya wazi zaidi kuliko chanzo.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: kila kitu alicho nacho
  rationale: Ni usemi wa kawaida wa Kiswahili unaorejelea mali na vitu vyote vya Ayubu.
- source_word: אִם לֹא
  choice: hakika ata-
  rationale: Katika muundo huu wa kiapo au changamoto, אִם לֹא huonyesha uhakika wenye mkazo, si sharti la kawaida.
- source_word: עַל פָּנֶיךָ
  choice: mbele ya uso wako
  rationale: Huhifadhi taswira ya Kiebrania na maana ya kumkabili Mungu waziwazi; ingawa 'mbele yako' ni laini zaidi, umbo hili linaendeleza ukaribu na chanzo.
- source_word: יְבָרֲכֶךָּ
  choice: atakulaani
  rationale: Ingawa ברך kwa kawaida ni 'bariki,' hapa inaeleweka kama usemi wa staha unaomaanisha 'laani' katika utangulizi wa Ayubu; maana ya kawaida ya neno imeelezwa katika tanbihi.
theological_decisions:
- issue: Matumizi ya kiufemisti ya ברך katika utangulizi wa Ayubu
  choice: Kutafsiri יְבָרֲכֶךָּ kama 'atakulaani' katika matini kuu
  alternative: atakubariki
  rationale: Muktadha wa changamoto ya Shetani unaonyesha kwamba anadai Ayubu atamkataa Mungu akipata madhara. 'Atakulaani' huwasilisha maana inayokusudiwa, huku maana halisi ya kimsamiati ikihifadhiwa katika tanbihi.
- issue: Nguvu ya נגע katika tendo la Mungu
  choice: uguse
  alternative: upige
  rationale: Kitenzi kimsingi humaanisha 'kugusa,' ingawa hapa kinadokeza kudhuru. Tafsiri ya 'uguse' huhifadhi taswira na mvutano wa chanzo bila kufafanua kimya kimya aina ya madhara.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na taswira na mkazo wa Kiebrania bila kuwa mgumu kupita kiasi.
