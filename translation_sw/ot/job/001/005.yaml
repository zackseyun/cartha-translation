base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: sw
  text: Siku za karamu zilipokwisha, Ayubu alituma kuwaita wanawe na kuwatakasa. Aliamka asubuhi na mapema, akatoa sadaka za kuteketezwa kwa hesabu yao wote. Kwa maana Ayubu alisema, “Huenda wanangu wametenda dhambi na kumlaani Mungu mioyoni mwao.” Ayubu alifanya hivyo siku zote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: mzunguko wa siku za karamu ulipokwisha
  rationale: Kitenzi הִקִּיפוּ kina wazo la siku kukamilisha mzunguko wake; usemi huu unaonyesha kwamba karamu za kila mmoja zilipitia zamu yake na kisha mzunguko ukamalizika.
- source_word: וַיְקַדְּשֵׁם
  choice: ili awatakase
  rationale: Hifadhi maana ya kitamaduni na kiibada ya ‘kuweka wakfu/kutakasa’ bila kudai maelezo ambayo kifungu hakitoi kuhusu namna tendo hilo lilivyofanywa.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Hili ndilo jina la kawaida la sadaka iliyoteketezwa yote katika matumizi ya kibiblia ya Kiswahili.
- source_word: מִסְפַּר כֻּלָּם
  choice: kwa ajili ya kila mmoja wao
  rationale: Chanzo kinasema sadaka zilitolewa kulingana na idadi yao wote; Kiswahili hiki kinaeleza kwa kawaida kwamba sadaka moja ililingana na kila mwana, bila kupoteza maana.
- source_word: וּבֵרֲכוּ אֱלֹהִים
  choice: na kumlaani Mungu
  rationale: Ingawa mzizi ברך kwa kawaida ni ‘bariki,’ hapa ni tafsida ya ‘laani,’ kama muktadha wa dhambi na matumizi mengine katika Ayubu yanavyoonyesha.
- source_word: כָּל הַיָּמִים
  choice: kila mara
  rationale: Usemi huu hapa unaonyesha desturi ya Ayubu iliyorudiwa daima, si lazima tendo lililofanyika kila siku moja kwa moja.
theological_decisions:
- issue: Je, utakaso wa wanawe ulikuwa tendo la Ayubu mwenyewe au mwito wa wao kujitakasa?
  choice: Ayubu alituma watu kuwaita wanawe ili awatakase
  alternative: Ayubu aliwaita wanawe wajitakase
  rationale: Muundo wa Kiebrania unamfanya Ayubu kuwa mtendaji wa ויקדשם, lakini hautaji utaratibu. Tafsiri inahifadhi uwakala wake bila kubuni ibada maalumu.
- issue: Maana ya ‘kumlaani Mungu mioyoni mwao’
  choice: kumlaani Mungu mioyoni mwao
  alternative: kumkufuru Mungu mioyoni mwao
  rationale: ‘Kumlaani’ huhifadhi ukali na maana ya tafsida ya Kiebrania, huku ‘mioyoni mwao’ ikihifadhi uwezekano wa kosa la ndani lisilotamkwa.
- issue: Wanaotolewa sadaka ni ‘wana’ au watoto wote?
  choice: wanangu / kila mmoja wao
  alternative: watoto wangu / wote
  rationale: בני inaweza kutumiwa kwa watoto kwa upana katika baadhi ya mazingira, lakini katika simulizi hili wana wa kiume ndio waliokuwa wenye karamu; tafsiri hufuata rejeo la karibu bila kuingiza hitimisho kuhusu mabinti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimewekwa kwa mtiririko wa kawaida huku urudiaji wa tendo la Ayubu, lugha ya kiibada, na tahadhari yake ya ndani vikihifadhiwa.
