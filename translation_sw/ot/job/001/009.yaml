base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: sw
  text: Ndipo Mshtaki[a] akamjibu Yahwe, akasema, “Je, Ayubu anamcha Mungu bure[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mshtaki” au “mpinzani”; neno hili lina kibainishi (“the”) na hapa linatumika kama cheo au jukumu.'
    reason: alternative_reading
  - marker: b
    text: Au “bila sababu” au “bila kupata faida yoyote.” Swali linachunguza ikiwa Ayubu anamcha Mungu bila masilahi binafsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika mtindo huu wa masimulizi humaanisha ‘kujibu’; umbo hili pia linaonyesha kwamba Yahwe ndiye anayejibiwa.
- source_word: הַשָּׂטָן
  choice: Mshtaki
  rationale: Neno lina kibainishi cha Kiebrania na hapa linafanya kazi kama cheo au jukumu, si lazima kama jina la pekee. ‘Mshtaki’ linafaa mazingira ya mashtaka katika tukio hili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina la Mungu יהוה, hivyo limetoholewa badala ya kubadilishwa kuwa cheo kama ‘Bwana.’
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Huhifadhi mfuatano wa kawaida wa masimulizi ya Kiebrania unaotanguliza maneno ya moja kwa moja.
- source_word: הֲחִנָּם
  choice: bure
  rationale: ‘Bure’ huhifadhi wazo lenye pande mbili la kutokuwa na sababu na kutopata malipo au faida, huku swali likichunguza ikiwa uchaji wa Ayubu hauna masilahi binafsi.
- source_word: יָרֵא
  choice: anamcha
  rationale: Katika kumhusu Mungu, ירא hueleza hofu yenye heshima; ‘kumcha Mungu’ ni usemi wa kawaida, wenye uzito na unaoeleweka katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa אֱלֹהִים humrejelea Mungu wa kweli katika kauli kuhusu uchaji wa Ayubu.
theological_decisions:
- issue: Maana ya הַשָּׂטָן yenye kibainishi
  choice: Mshtaki
  alternative: Shetani; mpinzani
  rationale: Kibainishi kinaonyesha cheo au jukumu katika tukio hili. ‘Mshtaki’ huhifadhi hali hiyo bila kuamua kimya kimya kwamba neno hili tayari ni jina la pekee.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova; Bwana
  rationale: Andiko linatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa uchaji wa Ayubu hauna masilahi binafsi
  choice: bure
  alternative: bila sababu; bila kupata faida yoyote
  rationale: Neno hili halifungi maana kwenye sababu peke yake au malipo peke yake, bali huhifadhi mvutano wa swali la Mshtaki kuhusu motisha ya Ayubu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘akamjibu Yahwe, akasema’ umehifadhi urudiaji wa kimakusudi wa fomula ya masimulizi ya Kiebrania; ‘anamcha Mungu’ ni usemi wa kawaida wa kibiblia unaoeleweka kwa wasomaji wa leo.
