lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: Akazaliwa
  rationale: Nifali ya ילד inaeleza kuzaliwa kwa watoto kwa mtazamo wa baba. Kiswahili cha kawaida hutumia muundo wa ngeli ya mahali/uwepo, “akazaliwa,” pamoja na orodha ya watoto, badala ya tafsiri nzito kama “walizaliwa kwake.”
- source_word: לוֹ
  choice: a- katika “Akazaliwa”
  rationale: Kiambishi cha nafsi katika kitenzi kinaonyesha kwamba huyo mwanamume ndiye aliyepata watoto; muundo huu ni wa asili katika Kiswahili na huepuka “kwa ajili yake,” ambayo ingeashiria manufaa badala ya uhusiano wa uzazi.
- source_word: שִׁבְעָה בָנִים
  choice: wana saba
  rationale: “Wana” ni neno la kawaida, lenye hadhi, kwa watoto wa kiume katika uhusiano na mzazi; linahifadhi jinsia iliyo wazi katika Kiebrania.
- source_word: וְשָׁלֹשׁ בָּנוֹת
  choice: na binti watatu
  rationale: “Binti” hutaja watoto wa kike kwa usahihi na kwa lugha ya kawaida; “watatu” inafuata upatanisho wa ngeli unaotumiwa kwa watu.
theological_decisions: []
translation_notes:
  register: Lugha ni ya Kiswahili Sanifu cha Afrika Mashariki, fupi na yenye hadhi. Muundo “akazaliwa wana…” ni nahau ya kibiblia inayofahamika na hudumisha uhusiano wa watoto na Ayubu bila kudokeza kwamba yeye mwenyewe ndiye aliyejifungua.
