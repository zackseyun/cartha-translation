  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: sw
  text: Mjumbe huyu alipokuwa bado akisema, mjumbe mwingine akaja na kusema, “Wana wako wa kiume na wa kike walikuwa wakila na kunywa divai[a] nyumbani mwa ndugu yao mzaliwa wa kwanza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakifanya karamu na kunywa divai.” Kiebrania husema kihalisi, “wakila na kunywa divai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: Huyo alipokuwa bado akisema
  rationale: Muundo huu unaonyesha kuwa mjumbe aliyefuata aliwasili kabla yule wa awali hajamaliza kusema; unahifadhi hali inayoendelea ya מְדַבֵּר kwa Kiswahili cha kawaida.
- source_word: וְזֶה בָּא
  choice: mwingine akaja
  rationale: Ingawa tafsiri ya karibu sana ni ‘na huyu akaja,’ katika mtiririko wa simulizi neno hili linamtambulisha mjumbe mwingine mfululizo.
- source_word: וַיֹּאמַר
  choice: na kusema
  rationale: Hii inawakilisha kitenzi cha kawaida cha simulizi kinachoanzisha usemi wa moja kwa moja, na inaungana kwa asili na ‘akaja.’
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: Wana wako wa kiume na wa kike
  rationale: Kiebrania kinawataja wazi wana wa kiume na wa kike; ‘wana’ pamoja na vibainishi hivi ni ya asili na yenye heshima katika Kiswahili sanifu.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: walikuwa wakila na kunywa divai
  rationale: Vishirikishi vinaonyesha tendo lililokuwa likiendelea wakati wa tukio. Tafsiri hii inafuata maneno ya Kiebrania bila kuyafasiri moja kwa moja kuwa karamu.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: nyumbani mwa ndugu yao mzaliwa wa kwanza
  rationale: הַבְּכוֹר humtambulisha ndugu kwa mpangilio wa kuzaliwa. ‘Mzaliwa wa kwanza’ huhifadhi maana hiyo kwa usahihi kuliko ‘mkubwa’ pekee.
