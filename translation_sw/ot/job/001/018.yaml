translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Muundo ‘nyumbani mwa’ umetumiwa badala ya ‘katika nyumba ya’ kwa unaturalia, huku ‘mzaliwa wa kwanza’ ikihifadhi usahihi wa neno la Kiebrania.
