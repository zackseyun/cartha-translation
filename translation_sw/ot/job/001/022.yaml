  text: Katika hayo yote, Ayubu hakutenda dhambi, wala hakumhusisha Mungu na kosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hakusema kwamba Mungu ametenda upumbavu,” au “wala hakumhusisha Mungu na jambo lisilofaa.”
