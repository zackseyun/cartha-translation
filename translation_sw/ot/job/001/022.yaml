lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: Katika hayo yote
  rationale: Kirai hiki kinarejelea jumla ya mambo yote yaliyotangulia; tafsiri hii ni ya kawaida na inaendeleza maana hiyo pana.
- source_word: לֹא חָטָא
  choice: hakutenda dhambi
  rationale: Kitenzi חטא kwa kawaida humaanisha kutenda dhambi; tafsiri hii inadumisha uzito wake wa kimaadili na kidini.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וְלֹא נָתַן
  choice: wala hakumhesabia
  rationale: Ingawa נתן kimsingi ni ‘kutoa,’ pamoja na תִּפְלָה na yambwa isiyo ya moja kwa moja humaanisha kumhusisha mtu na jambo au kumwekea jambo hilo. ‘Hakumhesabia’ inawasilisha uhusishaji huo bila kuifasiri kauli kupita kiasi.
- source_word: תִּפְלָה
  choice: kosa
  rationale: Neno hili linaweza kumaanisha upumbavu, jambo lisilofaa, au kosa lenye uzito wa kimaadili au kidini. ‘Kosa’ ni wazi katika Kiswahili cha sasa, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: לֵאלֹהִים
  choice: Mungu
  rationale: Kihusishi ל humtambulisha Mungu kuwa ndiye ambaye Ayubu hakumhesabia kosa; ‘Mungu’ ndiyo tafsiri ya moja kwa moja ya אֱלֹהִים hapa.
theological_decisions:
- issue: Jinsi ya kutafsiri תִּפְלָה inapohusishwa na Mungu
  choice: Ayubu hakumhesabia Mungu kosa
  alternative: Ayubu hakumhesabia Mungu upumbavu; au hakumhusisha Mungu na jambo lisilofaa
  rationale: Tafsiri kuu inaonyesha kwamba Ayubu hakumwekea Mungu lawama ya kimaadili baada ya kupatwa na mateso. Tanbihi inahifadhi uwezekano wa maana ya ‘upumbavu’ au ‘jambo lisilofaa’ bila kudokeza kimakosa kwamba maandiko yanaamua kati ya vivuli hivyo vya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘katika hayo yote’ unaunganisha aya na matukio yaliyotangulia, na ‘hakumhesabia’ inadumisha wazo la kuhusisha au kuweka kosa juu ya Mungu.
