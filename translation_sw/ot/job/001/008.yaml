  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: sw
  text: 'Yahwe akamwambia Mshitaki[a], “Je, umemtilia maanani mtumishi wangu Ayubu[b]? Kwa maana hakuna mtu kama yeye duniani: ni mtu asiye na lawama na mnyofu, anayemcha Mungu na kujiepusha na uovu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule Shetani.” Neno la Kiebrania hapa lina kibainishi na linaonekana kutaja cheo au jukumu—“Mshitaki”—badala ya kutumika waziwazi kama jina la pekee.
    reason: alternative_reading
  - marker: b
    text: Kiebrania, kwa neno kwa neno, “umeweka moyo wako juu ya mtumishi wangu Ayubu?” Maana yake ni kumwelekezea Ayubu fikira au uangalifu wa makusudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili, badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: הַשָּׂטָן
  choice: Mshitaki
  rationale: Kibainishi cha Kiebrania kinaonyesha hapa cheo au jukumu, si lazima jina la pekee; “Mshitaki” pia linafaa katika mazingira ya baraza la mbinguni.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: Je, umemwangalia kwa makini
  rationale: Nahau hiyo, kwa neno kwa neno, ni “umeweka moyo wako juu ya”; maana yake ni kumwelekezea mtu fikira au uangalifu. Tafsiri kuu imetumia Kiswahili cha asili, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika muktadha huu neno linaonyesha kwamba Ayubu ni wa Mungu na anamtumikia, si kwamba mkazo uko katika utumwa wa kijamii.
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: Kwa maana hakuna mtu kama yeye duniani
  rationale: Kauli inaonyesha kwamba tabia ya Ayubu hailingani na ya mtu mwingine yeyote duniani, si katika eneo dogo tu.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: ni mtu asiye na lawama na mnyofu
  rationale: “Asiye na lawama” linaonyesha uadilifu na ukamilifu wa mwenendo bila kudai kutokuwa na dhambi kabisa; “mnyofu” linaonyesha unyoofu wa kimaadili.
- source_word: יְרֵא אֱלֹהִים
  choice: anayemcha Mungu
  rationale: Huhifadhi nahau ya kibiblia kuhusu uchaji na heshima ya kudumu kwa Mungu.
- source_word: וְסָר מֵרָע
  choice: na kujiepusha na uovu
  rationale: Kitenzi kishirikishi kinaonyesha tabia ya kawaida ya kukataa na kuepuka uovu.
theological_decisions:
- issue: Iwapo הַשָּׂטָן litafsiriwe kama jina la pekee au kama cheo/jukumu
  choice: Mshitaki
  alternative: Shetani; yule adui
  rationale: Kibainishi cha Kiebrania kinaelekeza kwenye cheo au jukumu katika muktadha huu. Tafsiri haijaingiza mapema matumizi ya baadaye ya neno hilo kama jina la pekee.
- issue: Iwapo תָּם linamaanisha ukamilifu usio na dhambi
  choice: asiye na lawama, kwa maana ya mtu mwenye uadilifu
  alternative: mkamilifu
  rationale: Muktadha wa fasihi ya hekima na uambatanisho wake na “mnyofu” vinaonyesha uadilifu wa mwenendo, si ukamilifu kamili usio na dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi; nahau ya Kiebrania isiyo ya kawaida imefafanuliwa katika tanbihi bila kupoteza maana yake katika matini kuu.
