base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: sw
  text: Na tazama, upepo mkubwa[a] ukaja kutoka upande wa pili wa nyika, ukaipiga pembe nne za nyumba, nayo ikaanguka juu ya vijana[b], wakafa. Ni mimi peke yangu niliyeponyoka ili kukuambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upepo mkali” au “upepo mkali wa dhoruba.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “vijana.” Neno hilo pia linaweza kumaanisha “watumishi” katika baadhi ya miktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Hudumisha msisitizo na uhai wa taarifa ya ghafla kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: רוּחַ גְּדוֹלָה
  choice: upepo mkali
  rationale: Katika muktadha huu רוּחַ ni upepo; 'mkali' huwasilisha nguvu ya גְּדוֹלָה kwa Kiswahili cha kawaida bila kulazimisha maana ya dhoruba.
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: ukaja kutoka upande wa pili wa nyika
  rationale: Huhifadhi maana ya mwelekeo ya מֵעֵבֶר, yaani kutoka upande mwingine au wa pili wa eneo la nyika.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: ukaipiga pembe nne za nyumba
  rationale: Kitenzi נגע kinaweza kumaanisha kugusa, kufikia, au kupiga; matokeo ya uharibifu hapa yanaunga mkono 'kupiga.'
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: nayo ikawaangukia vijana
  rationale: Kiwakilishi 'nayo' kinarejelea nyumba, ambayo ndiyo kiima cha kitenzi cha umoja katika Kiebrania; 'vijana' hudumisha upana wa נְעָרִים bila kuamua kimuktadha kuwa ni watumishi.
- source_word: וַיָּמֻתוּ
  choice: nao wakafa
  rationale: Ni tafsiri ya moja kwa moja ya מות, bila kuongeza dhana sababishi ya 'waliuawa.'
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Ni mimi peke yangu niliyeponyoka
  rationale: Hutoa kwa Kiswahili cha asili msisitizo maradufu wa upekee uliomo katika רַק na לְבַדִּי.
- source_word: לְהַגִּיד לָךְ
  choice: ili nikuletee habari
  rationale: Ni usemi wa kawaida wa Kiswahili unaofaa kwa taarifa ya mjumbe na unaonyesha kusudi la kuponyoka kwake.
theological_decisions:
- issue: Utambulisho wa הַנְּעָרִים
  choice: vijana
  alternative: watumishi
  rationale: Neno la Kiebrania linaweza kumaanisha vijana au watumishi kulingana na muktadha. Tafsiri haipaswi kulazimisha utambulisho wao kuwa watumishi, wala kuoanisha kimya kimya na 'watoto' wa Ayubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi unaendeleza mfululizo wa vitenzi vya taarifa ya janga, huku alama zote za tanbihi zikionekana katika matini.
