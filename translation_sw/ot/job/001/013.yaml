  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: sw
  text: Siku moja, wanawe wa kiume na binti zake walikuwa wakila na kunywa divai nyumbani kwa kaka yao mzaliwa wa kwanza[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
