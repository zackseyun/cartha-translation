translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa asili na hadhi ya simulizi. ‘Wanawe wa kiume na wa kike’ huepuka utata wa ‘watoto wake’ huku kikihifadhi kutajwa kwa makundi yote mawili katika Kiebrania.
