    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Siku moja
  rationale: Nahau hii ya Kiebrania huanzisha tukio jipya la simulizi na kwa kawaida humaanisha ‘siku moja,’ si lazima siku fulani iliyokwisha tajwa.
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: wanawe wa kiume na wa kike
  rationale: Kiebrania kinataja wazi wana wa kiume na mabinti; tafsiri hii inadumisha makundi yote mawili kwa Kiswahili cha kawaida.
- source_word: אֹכְלִים וְשֹׁתִים
  choice: walikuwa wakila na kunywa
  rationale: Vivumishi-tende vya Kiebrania vinaonyesha matendo yaliyokuwa yakiendelea wakati tukio lilipotokea.
- source_word: יַיִן
  choice: divai
  rationale: Hili ni neno mahususi kwa divai, wala muktadha hautoi sababu ya kulipanua kuwa kinywaji kwa ujumla.
- source_word: בְּבֵית אֲחִיהֶם
  choice: nyumbani kwa ndugu yao
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza mahali, yaani katika nyumba ya ndugu yao.
- source_word: הַבְּכוֹר
  choice: wa kwanza
  rationale: Neno hili humtambulisha ndugu aliyezaliwa kwanza. ‘Wa kwanza’ ni la kawaida na linaacha tanbihi ifafanue maana kamili ya mpangilio wa kuzaliwa.
