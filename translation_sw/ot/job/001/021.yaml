id: JOB.1.21
reference: Job 1:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: sw
  text: Akasema, “Nilitoka tumboni mwa mama yangu nikiwa uchi, nami nitarudi huko nikiwa uchi.[a] Yahwe alitoa, na Yahwe ametwaa. Jina la Yahwe libarikiwe.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “huko” bila kutaja wazi mahali panapokusudiwa. Huenda ni dokezo la kitamathali kwa tumbo la uzazi, ardhi au kaburi, au hali ya kutokuwa na kitu.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: YHWH, jina la Mungu; kwa desturi limetafsiriwa “BWANA.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: nikiwa uchi
  rationale: Huhifadhi picha halisi ya kuzaliwa bila mavazi na pia hudokeza hali ya kutokuwa na mali yoyote.
- source_word: יצתי
  choice: Nilitoka
  rationale: Kitenzi יצא katika muktadha huu kinamaanisha kutoka tumboni wakati wa kuzaliwa; ‘nilitoka’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִבֶּטֶן אִמִּי
  choice: tumboni mwa mama yangu
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi picha halisi ya tumbo la uzazi.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: nami nitarudi huko nikiwa uchi
  rationale: Neno ‘huko’ linatafsiri שָׁמָה bila kubainisha mahali ambapo Kiebrania hakubainishi; ‘nikiwa uchi’ hudumisha wazo la hali ileile ya mwanzo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu lililoandikwa kwa herufi YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: נָתַן
  choice: alitoa
  rationale: ‘Alitoa’ linafaa kwa tendo la kutoa au kukabidhi na linaendana kwa ufasaha na ‘ametwaa’; haliongezi kitu kisichokuwamo katika kitenzi.
- source_word: לָקָח
  choice: ametwaa
  rationale: ‘Ametwaa’ huonyesha tendo lililokamilika lenye matokeo ya sasa na ni la heshima katika muktadha huu wa kupokonywa vitu na wapendwa.
- source_word: יְהִי
  choice: libarikiwe
  rationale: 'Kauli hii ya kutakia huwasilisha hali ya jussive: Jobu anatamka ombi au tamko la baraka.'
- source_word: שֵׁם יְהוָה
  choice: Jina la Yahwe
  rationale: Huhifadhi muundo na msisitizo wa Kiebrania juu ya jina la Mungu.
- source_word: מְבֹרָךְ
  choice: libarikiwe
  rationale: Huhifadhi maana ya kubarikiwa; ‘lisifiwe’ lingehama kutoka uwanja wa maana wa baraka kwenda ule wa sifa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu YHWH. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ‘nitarudi huko’ (שָׁמָה)
  choice: Kuhifadhi ‘huko’ bila kutaja mahali hasa
  alternative: nitarudi ardhini; nitarudi kaburini; nitarudi tumboni mwa mama yangu
  rationale: Kiebrania kinasema ‘huko’ na kinaacha marejeo yake bila kufafanuliwa. Tafsiri hii haiamui kimya kimya kama Jobu anamaanisha tumbo kwa njia ya mfano, ardhi, kaburi, au hali ya kutokuwa na kitu.
- issue: Uhusiano wa Yahwe na kupoteza mali na watoto
  choice: ‘Yahwe ametwaa’
  alternative: Yahwe ameruhusu vitwaliwe
  rationale: Kitenzi cha chanzo kinamtaja Yahwe moja kwa moja kuwa mtendaji. Tafsiri haipunguzi mvutano wa kiteolojia kwa kuingiza wazo la ‘kuruhusu,’ ambalo halijasemwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kishairi lakini unaeleweka kwa urahisi. ‘Ametwaa’ huchaguliwa kwa uzito wa muktadha, huku ‘huko’ ikihifadhi utata wa chanzo.
