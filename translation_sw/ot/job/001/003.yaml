  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: sw
  text: Alikuwa na kondoo elfu saba[a], ngamia elfu tatu, jozi mia tano za ng’ombe wa kulimia, punda-jike mia tano, na watumishi wengi sana[b]. Mtu huyo alikuwa mkuu kuliko watu wote wa mashariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha kundi la kondoo na mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Au, huduma nyingi sana; neno la Kiebrania linaweza kurejelea watumishi au huduma na kazi nyingi za nyumba na mashamba.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: mifugo yake
  rationale: Neno hili linamaanisha mali iliyopatikana, hasa wanyama wa kufugwa; orodha inayofuata inaonyesha wazi kwamba hapa linarejelea mifugo.
- source_word: צֹאן
  choice: kondoo
  rationale: Katika orodha hii ya mifugo, ‘kondoo’ ni tafsiri ya kawaida na inayoeleweka, ingawa neno la Kiebrania linaweza kuhusisha pia mbuzi.
- source_word: גְמַלִּים
  choice: ngamia
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania.
- source_word: צֶמֶד בָּקָר
  choice: jozi za ng’ombe wa kulimia
  rationale: צֶמֶד ni jozi ya wanyama waliofungwa nira pamoja, na בָּקָר hapa ni ng’ombe waliotumiwa katika kazi za shamba.
- source_word: אֲתוֹנוֹת
  choice: punda-jike
  rationale: Kiebrania kinabainisha wazi kwamba punda hao walikuwa wa kike.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: watumishi wengi sana
  rationale: Katika muktadha wa mali ya Ayubu, usemi huu kwa kawaida hueleweka kuwa kundi kubwa la watumishi au wafanyakazi wa nyumba na mashamba, huku tanbihi ikihifadhi uwezekano wa kuelewa huduma au shughuli nyingi.
- source_word: גָּדוֹל מִכָּל
  choice: mkuu kuliko ... wote
  rationale: Muundo wa kulinganisha unaonyesha kwamba Ayubu aliwapita wengine kwa utajiri, hadhi, au umaarufu.
- source_word: בְּנֵי קֶדֶם
  choice: watu wa mashariki
  rationale: Hii ni Kiswahili cha asili na sahihi kwa nahau ya Kiebrania ‘wana wa mashariki,’ inayomaanisha watu walioishi upande wa mashariki.
theological_decisions:
- issue: Maana ya עֲבֻדָּה רַבָּה מְאֹד
  choice: watumishi wengi sana
  alternative: shughuli nyingi sana; jamaa kubwa sana ya nyumbani
  rationale: Muktadha wa orodha ya utajiri unaunga mkono maana ya wafanyakazi wengi, lakini tanbihi inahifadhi upana wa neno linaloweza kurejelea huduma au shughuli za nyumba na mashamba.
- issue: Nahau בְּנֵי קֶדֶם
  choice: watu wa mashariki
  alternative: wana wa mashariki
  rationale: Nahau hii si lazima iwahusu wana wa kiume pekee; inataja jamii za upande wa mashariki. Tafsiri ya kawaida ya Kiswahili huepuka kuifanya isikike kama uhusiano halisi wa uzazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Jozi za ng’ombe wa kulimia’ linaonyesha kwamba idadi ni jozi mia tano, si ng’ombe mia tano mmoja mmoja. ‘Watu wa mashariki’ ni nahau ya asili zaidi kuliko tafsiri sisisi ‘wana wa mashariki’.
