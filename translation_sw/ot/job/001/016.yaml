base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: sw
  text: Huyu alipokuwa angali akisema, mwingine akaja na kusema, “Moto wa Mungu umeanguka kutoka mbinguni, ukawaka kati ya kondoo na vijana na kuwateketeza. Ni mimi peke yangu niliyenusurika ili nikujulishe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: Moto wa Mungu
  rationale: Inahifadhi muundo wa Kiebrania na uwezekano wake wa kumaanisha moto unaohusishwa na Mungu au moto mkubwa sana, bila kuufasiri moja kwa moja kuwa umeme.
- source_word: בַצֹּאן
  choice: kati ya kondoo
  rationale: Kihusishi ב hapa kinaweza kuonyesha eneo au walengwa wa kuwaka; ‘kati ya kondoo’ huhifadhi tofauti kati ya kuwaka na tendo linalofuata la kuteketeza.
- source_word: בַנְּעָרִים
  choice: watumishi
  rationale: Ingawa נְעָרִים kimsingi ni vijana, katika simulizi hili neno linawarejelea watumishi wa Ayubu waliokuwa wakichunga mifugo; ‘watumishi’ ni ya asili na wazi katika muktadha.
- source_word: וַתֹּאכְלֵם
  choice: kuwateketeza
  rationale: Nahau ya Kiebrania ‘kuwala’ inapotumiwa kuhusu moto humaanisha kuwaangamiza kabisa; ‘kuwateketeza’ ni Kiswahili cha kawaida chenye nguvu inayolingana.
- source_word: וָאִמָּלְטָה
  choice: niliyenusurika
  rationale: Inaeleza kupona au kutoroka katika maangamizi, kwa Kiswahili cha kawaida na cha heshima.
theological_decisions:
- issue: Ikiwa ‘Moto wa Mungu’ unadai kwamba Mungu ndiye aliyetuma moto
  choice: Kudumisha usemi ‘Moto wa Mungu’
  alternative: Umeme / moto mkubwa sana
  rationale: Maandishi yanaripoti maneno ya mjumbe na hayafafanui hapa sababu ya usemi huo. Tafsiri haipaswi kuamua kimya kimya kama ni umeme, moto usio wa kawaida, au tendo la moja kwa moja la Mungu.
- issue: Maana ya נְעָרִים
  choice: watumishi
  alternative: vijana
  rationale: Katika muktadha wa mifugo ya Ayubu, hawa ni wafanyakazi wake. Chaguo hili linaonyesha jukumu lao bila kuingiza dai la ziada kuhusu umri wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Angali akisema’ huhifadhi hali ya tukio la pili kuingilia kabla taarifa ya kwanza haijamalizika; ‘mbinguni’ ni usemi wa kawaida kwa מִן־הַשָּׁמַיִם.
