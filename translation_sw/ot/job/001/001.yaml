id: JOB.1.1
reference: Job 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: sw
  text: Palikuwa na mtu katika nchi ya Usi, jina lake Ayubu. Mtu huyo alikuwa asiye na lawama na mnyofu, mwenye kumcha Mungu na kujiepusha na uovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kugeuka na kuuacha uovu. Kitenzi cha Kiebrania kinaweza kumaanisha kugeuka kutoka katika uovu, kuuacha, au kuuepuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mtu
  rationale: Katika muktadha huu nomino hii inamtaja mwanamume mmoja. Kiswahili hutumia “mtu” kwa kawaida katika utangulizi wa simulizi bila kupoteza maana hiyo.
- source_word: הָיָה
  choice: Palikuwa na
  rationale: Hii ni kauli ya kawaida ya Kiswahili ya kuanzisha mhusika na mahali katika simulizi, nayo inahifadhi maana rahisi ya kuwepo.
- source_word: בְאֶרֶץ עוּץ
  choice: katika nchi ya Usi
  rationale: “Nchi” inafaa kwa אֶרֶץ katika usemi wa kijiografia; “Usi” ni umbo la kawaida la Kiswahili la jina hili la mahali.
- source_word: אִיּוֹב שְׁמוֹ
  choice: jina lake Ayubu
  rationale: Kauli hii ya Kiswahili ni ya asili na inatambulisha jina la mhusika moja kwa moja; “Ayubu” ni umbo lililozoeleka katika Kiswahili.
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: Mtu huyo alikuwa
  rationale: “Huyo” inahifadhi nguvu ya kiashiria katika Kiebrania na kurudia kumrejelea mhusika aliyetangulizwa.
- source_word: תָּם
  choice: asiye na lawama
  rationale: Usemi huu unaonyesha uadilifu wa maadili bila kudai kwamba Ayubu hakuwa na dhambi kabisa au alikuwa mkamilifu kwa maana isiyo na mipaka.
- source_word: יָשָׁר
  choice: mnyofu
  rationale: Neno hili linaeleza unyofu wa kimaadili kwa lugha ya kawaida na yenye hadhi.
- source_word: וִירֵא אֱלֹהִים
  choice: mwenye kumcha Mungu
  rationale: “Kumcha Mungu” ni usemi wa kawaida unaoonyesha heshima na uchaji, si hofu tupu; אֱלֹהִים hapa inamtaja Mungu mmoja.
- source_word: וְסָר מֵרָע
  choice: na kujiepusha na uovu
  rationale: Usemi huu unaonyesha hatua ya kukataa na kuepuka uovu. Tanbihi inahifadhi taswira mbadala ya kugeuka au kuondoka kutoka katika uovu.
theological_decisions:
- issue: Maana ya maelezo ya maadili ya Ayubu
  choice: Ayubu anaelezwa kuwa mtu wa uadilifu na mwenendo usio na lawama, si kuwa hana dhambi kabisa.
  alternative: Ayubu ni mkamilifu kabisa au hana dhambi yoyote.
  rationale: Katika fasihi ya hekima, תָּם na יָשָׁר husifu ukamilifu wa tabia na unyofu wa maadili. “Asiye na lawama” na “mnyofu” zinahifadhi sifa hii yenye nguvu bila kuongeza dai ambalo Kiebrania halilazimishi.
- issue: Anayerejelewa na אֱלֹהִים
  choice: Mungu
  alternative: miungu
  rationale: Ingawa umbo la neno ni la wingi kisarufi, muktadha na usemi wa “kumcha Mungu” hapa vinamtaka mrejelewa mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi, wa sasa na wenye hadhi. “Palikuwa na” huanzisha tukio kwa kawaida; “Ayubu” na “Usi” ni maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
