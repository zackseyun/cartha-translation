  yaml_path: translation/ot/job/001/014.yaml
  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: sw
  text: Mjumbe mmoja akaja kwa Ayubu, akasema, “Ng’ombe walikuwa wakilima, nao punda[a] walikuwa wakila majani kando yao,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: punda-jike.'
