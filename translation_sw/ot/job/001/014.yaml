lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: Mjumbe mmoja
  rationale: Katika muktadha huu מַלְאָךְ ni mtu anayeleta taarifa, si malaika. ‘Mjumbe mmoja’ ni Kiswahili cha kawaida na huonyesha kuwa mhusika mpya anaingizwa katika simulizi.
- source_word: בָּא אֶל אִיּוֹב
  choice: akaja kwa Ayubu
  rationale: Kitenzi בוא pamoja na אֶל kinaonyesha kuja kuelekea kwa Ayubu; ‘akaja kwa Ayubu’ ni usemi wa asili katika Kiswahili.
- source_word: וַיֹּאמַר
  choice: na kusema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi. Baada ya ‘akaja,’ ‘na kusema’ ni wa asili na huepuka kurudia kiima bila ulazima.
- source_word: הַבָּקָר
  choice: Ng’ombe
  rationale: בָּקָר ni jina la jumla la ng’ombe; kitendo cha kulima kinaonyesha kwamba hapa ni wanyama wa kukokota jembe. ‘Ng’ombe’ ni wazi na ya kawaida kuliko neno maalumu zaidi ‘maksai,’ ambalo lingeongeza maana ya jinsia na kuhasiwa isiyotajwa wazi.
- source_word: הָיוּ חֹרְשׁוֹת
  choice: walikuwa wakilima
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati huo. ‘Walikuwa wakilima’ huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: וְהָאֲתֹנוֹת
  choice: nao punda[a]
  rationale: אֲתֹנוֹת humaanisha hasa punda wa kike. Katika Kiswahili, ‘punda’ hutumika kwa kawaida bila kutaja jinsia; umaalumu wa Kiebrania umehifadhiwa katika tanbihi.
- source_word: רֹעוֹת
  choice: walikuwa wakila majani
  rationale: Katika muktadha wa wanyama, רעה humaanisha kula malishoni. ‘Wakila majani’ ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: עַל יְדֵיהֶם
  choice: kando yao
  rationale: Nahau hii inaonyesha ukaribu wa mahali, yaani punda walikuwa pembeni mwa ng’ombe. ‘Kando yao’ huwasilisha maana bila kunakili nahau ya Kiebrania neno kwa neno.
