base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: sw
  text: Ndipo Ayubu akainuka, akararua joho lake, akanyoa kichwa chake, akaanguka chini, akasujudu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akainama chini.” Kitenzi cha Kiebrania chaweza kumaanisha kuinama au kusujudu kimwili, mara nyingi kama tendo la heshima au ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaonyesha hatua inayofuata; “akainuka” ni Kiswahili cha kawaida na huhifadhi maana ya kuinuka baada ya kupokea habari.
- source_word: מְעִילוֹ
  choice: joho lake
  rationale: מְעִיל ni vazi la nje, mara nyingi joho; “joho lake” ni wazi na linafaa kwa tendo la maombolezo la kulirarua.
- source_word: וַיִּקְרַע אֶת מְעִלוֹ
  choice: akararua joho lake
  rationale: קרע katika muktadha wa maombolezo humaanisha kurarua vazi; tafsiri hii huhifadhi tendo halisi bila kutumia lugha ya kizamani.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: akanyoa kichwa chake
  rationale: גזז humaanisha kukata au kunyoa nywele; katika muktadha huu ni ishara ya maombolezo, na usemi huu ni wa kawaida katika Kiswahili.
- source_word: וַיִּפֹּל אַרְצָה
  choice: akaanguka chini
  rationale: אַרְצָה huonyesha mwendo kuelekea ardhini; “akaanguka chini” ni usemi wa asili na wenye picha wazi.
- source_word: וַיִּשְׁתָּחוּ
  choice: kusujudu
  rationale: Kitenzi שׁחה katika umbo hili huonyesha kuinama au kujilaza chini kwa heshima, mara nyingi mbele za Mungu. “Kusujudu” huhifadhi tendo la mwili na mwelekeo wa heshima bila kuongeza wazi neno “kuabudu,” ambalo halipo kama neno tofauti katika mstari huu.
theological_decisions:
- issue: Iwapo tendo la mwisho litajwe wazi kuwa ibada au liachwe kama tendo la kusujudu lenye maana ya heshima
  choice: kusujudu
  alternative: kuinama chini na kuabudu
  rationale: Neno la Kiebrania linaweza kumaanisha kusujudu kimwili, mara nyingi kama tendo la heshima au ibada. “Kusujudu” huhifadhi upana huo wa maana; muktadha wa mstari unaofuata unaweza kuonyesha mwelekeo kwa Mungu bila tafsiri hii kuongeza “kuabudu” moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya “aka-” huhifadhi kasi ya masimulizi ya Kiebrania. Alama ya tanbihi imewekwa baada ya “kusujudu,” neno linalohusika nayo.
