base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Mshitaki[a], “Umetoka wapi?” Mshitaki akamjibu Yahweh, akasema, “Nimetoka kuzurura-zurura duniani na kutembea huku na huku humo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ha-Satani,” yaani “Mshitaki.” Neno hili lina kiambishi bainishi na hapa linatumika kama cheo au jukumu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina la kibinafsi katika matini.
- source_word: הַשָּׂטָן
  choice: Mshitaki
  rationale: Kiambishi bainishi cha Kiebrania kinaonyesha cheo au jukumu, si lazima jina la kibinafsi. “Mshitaki” ni Kiswahili cha kawaida kinachowasilisha jukumu hilo bila kuingiza matumizi ya baadaye ya “Shetani” kama jina.
- source_word: מֵאַיִן תָּבֹא
  choice: Unatoka wapi?
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili ya kuuliza mahali mtu alikotoka katika mazungumzo.
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Inahifadhi tendo la kujibu na mtiririko wa masimulizi ya Kiebrania.
- source_word: מִשּׁוּט
  choice: kuzurura-zurura
  rationale: Kitenzi kinaeleza kwenda huku na huku; uradidi unaonyesha mwendo unaoendelea bila kuweka maana ya kijeshi kama “doria.”
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Katika mazingira mapana ya kitabu cha Ayubu, “duniani” linafaa kuliko “katika nchi,” ambayo inaweza kueleweka kuwa eneo fulani tu.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: na kutembea huku na huku humo
  rationale: Huhifadhi maana ya mwendo unaorudiwa ndani au juu ya dunia kwa Kiswahili cha asili, bila kuufasiri kuwa doria.
theological_decisions:
- issue: Ikiwa הַשָּׂטָן ni jina la kibinafsi au cheo/jukumu
  choice: 'Cheo/jukumu: “Mshitaki”'
  alternative: 'Jina la kibinafsi: “Shetani”; au utohozi wa karibu zaidi: “ha-Satani”'
  rationale: Kiambishi bainishi katika Kiebrania kinaunga mkono zaidi matumizi ya neno hili kama cheo katika muktadha huu. Tafsiri “Mshitaki” inalinda tofauti hiyo bila kuamua kuwa mhusika ametajwa hapa kwa jina la kibinafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazungumzo ni wa kawaida; “akamjibu ... akasema” umehifadhiwa ili kuonyesha urudiaji wa kimakusudi wa masimulizi ya Kiebrania.
