base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: sw
  text: Ndipo Waseba wakawavamia na kuwachukua[a], wakawaua vijana kwa makali ya upanga[b][c]. Ni mimi peke yangu niliyepona ili nikuambie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia jina “Sheba,” ambalo hapa linarejelea Waseba, yaani wavamizi kutoka Sheba.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kwa kinywa cha upanga,” nahau inayomaanisha “kwa makali ya upanga.”'
    reason: lexical_alternative
  - marker: c
    text: “Vijana” hapa huenda ni watumishi wa Ayubu waliokuwa wakichunga wanyama.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּפֹּל
  choice: akawavamia
  rationale: Katika muktadha wa uvamizi, נפל inaonyesha kushambulia kwa ghafla; ‘akawavamia’ ni ya asili katika Kiswahili na inaweka wazi maana hiyo.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Maandishi ya Kiebrania yanatumia jina la pekee ‘Sheba,’ ingawa hapa linawakilisha kundi la wavamizi kutoka Sheba; umoja wa kisarufi umehifadhiwa.
- source_word: וַתִּקָּחֵם
  choice: na kuwachukua
  rationale: Kiwakilishi kinarejelea ng’ombe na punda waliotajwa katika mstari uliotangulia. ‘Kuwachukua’ huhifadhi kitenzi cha kawaida לקח bila kuongeza wazi wazo la kuwateka nyara.
- source_word: הַנְּעָרִים
  choice: vijana
  rationale: נערים inaweza kumaanisha vijana au watumishi/wahudumu. ‘Vijana’ huhifadhi maana ya msingi, huku tanbihi ikieleza kazi yao katika muktadha.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: wakawaua ... kwa makali ya upanga
  rationale: Nahau ya Kiebrania ina maana halisi ya kupiga ‘kwa kinywa cha upanga.’ Kiswahili ‘kwa makali ya upanga’ huhifadhi taswira ya nahau, na ‘wakawaua’ huwasilisha wazi matokeo katika muktadha.
- source_word: וָאִמָּלְטָה
  choice: niliyepona
  rationale: מלט hueleza kuokoka au kutoroka. Katika taarifa ya manusura, ‘niliyepona’ ni ya asili na inaonyesha hali ya mnenaji baada ya kunusurika.
- source_word: רַק אֲנִי לְבַדִּי
  choice: Ni mimi peke yangu
  rationale: Muundo huu huhifadhi msisitizo maradufu wa Kiebrania kwamba hakuna mwingine aliyenusurika.
- source_word: לְהַגִּיד לָךְ
  choice: ili nikuletee habari
  rationale: Katika muktadha wa mjumbe, נגד ni kutoa taarifa. ‘Nikuletee habari’ ni Kiswahili cha kawaida na chenye hadhi kinachofaa fomula ya simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi imehifadhi kasi ya taarifa ya mjumbe. Jina ‘Sheba’ limeachwa katika umoja kama lilivyo katika Kiebrania, na uwezekano wa maana ya ‘Waseba’ umewekwa katika tanbihi. Alama zote za tanbihi zimetokea katika matini kuu.
