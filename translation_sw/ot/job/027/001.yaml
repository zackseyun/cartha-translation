  yaml_path: translation/ot/job/027/001.yaml
  text: And Job again took up his discourse and said:[a]
translation:
  language: sw
  text: Ayubu akaendelea tena na hotuba yake, akasema:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “methali yake,” “mfano wake,” au “tamko lake”; neno la Kiebrania linaweza kumaanisha aina mbalimbali za kauli nzito au za mafumbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: akaendelea
  rationale: Kitenzi יסף kina maana ya kuongeza au kuendelea. Katika muundo huu wa nahau pamoja na שׂאת, “akaendelea” ni Kiswahili cha kawaida kinachoonyesha kwamba Ayubu alianza tena au aliendeleza hotuba yake.
- source_word: שְׂאֵת
  choice: kutoa
  rationale: Ingawa נשׂא kwa msingi humaanisha kuinua au kubeba, katika kirai שׂאת משל ni nahau ya kuanza au kutamka usemi rasmi. “Kutoa” hudumisha maana hiyo kwa Kiswahili cha asili bila tafsiri ngumu ya neno kwa neno.
- source_word: מְשָׁלוֹ
  choice: usemi wake
  rationale: מָשָׁל linaweza kumaanisha methali, mfano, fumbo, au usemi mzito wa kishairi. Katika muktadha huu ni hotuba ndefu ya kishairi; “usemi wake” ni pana na ya kawaida, huku tanbihi ikihifadhi uwezekano mwingine wa kileksika.
- source_word: וַיֹּאמַר
  choice: akisema
  rationale: Wayyiqtol ya אמר huanzisha maneno yanayofuata. “Akisema” ni muunganiko wa kawaida wa Kiswahili baada ya kishazi cha kuendelea kutoa usemi.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia na matumizi ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akaendelea kutoa usemi wake” unaeleweka kwa urahisi na unaakisi nahau ya Kiebrania bila kufanya usemi huu usikike kama methali fupi pekee.
