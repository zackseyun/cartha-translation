  text: Je, atajifurahisha katika Mwenyezi? Je, atamwita Mungu kila wakati?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Atamwita” pia inaweza kutafsiriwa “atamlilia” au “atamwomba.”
