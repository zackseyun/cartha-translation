lexical_decisions:
- source_word: אִם
  choice: Je, ...?
  rationale: Katika muktadha huu chembe אִם inaleta swali la balagha, si sentensi yenye sharti. Muundo wa Kiswahili wenye “Je” unaonyesha wazi nguvu hiyo ya kiulizi.
- source_word: עַל
  choice: katika
  rationale: Pamoja na kitenzi התענג, kihusishi hiki kinaonyesha yule ambaye mtu hupata furaha ndani yake; “kujisifurahisha katika” huhifadhi uhusiano huo bila kuufanya kuwa wa mahali halisi.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Hili ni jina la cheo la Mungu. “Mwenyezi” ni tafsiri ya kawaida, yenye hadhi na inayoeleweka katika Kiswahili, badala ya kulinakili kama Shaddai.
- source_word: יִתְעַנָּג
  choice: hujifurahisha
  rationale: Muundo wa Kiebrania wa Hitpael una maana ya mtu kupata au kujipatia furaha; “hujifurahisha” huhifadhi kwa kiasi fulani dhana ya kujirejelea na inafaa swali la balagha.
- source_word: יִקְרָא
  choice: humwita
  rationale: Kumwita Mungu hapa ni kumwomba au kumlilia. “Humwita” hudumisha upana wa kitenzi cha Kiebrania bila kukifungia katika aina moja tu ya sala.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Nomino hii ya umoja inayomhusu Mungu haitaji nyongeza yoyote katika Kiswahili.
- source_word: בְּכָל עֵת
  choice: nyakati zote
  rationale: Kirai hiki kinaonyesha kuendelea au kurudiwa bila kuwekewa kikomo; “nyakati zote” huhifadhi upana wa usemi wa Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la cheo שַׁדַּי
  choice: Mwenyezi
  alternative: Shaddai
  rationale: Kwa kuwa ni jina la cheo la Mungu, limetafsiriwa ili maana yake ipatikane kwa msomaji wa kawaida, bila kuingiza ufafanuzi wa kimadhehebu.
