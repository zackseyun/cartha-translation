base_translation:
  language: en
  yaml_path: translation/ot/job/027/019.yaml
  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: sw
  text: Tajiri hulala, lakini hatakusanywa; hufumbua macho yake, naye hayupo tena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Kihalisi, “naye hayupo.” Hii ni nahau inayoweza kumaanisha kwamba ametoweka au hayupo tena.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: akiwa tajiri
  rationale: Neno hili linaweza kuwa kivumishi au nomino yenye maana ya mtu tajiri. Muundo “akiwa tajiri” unadumisha ufupi wa Kiebrania bila kuongeza waziwazi “mtu”.
- source_word: יִשְׁכַּב
  choice: hujilaza
  rationale: Maana ya msingi ni kulala au kujilaza. Wakati wa sasa wa kishairi unaleta uhai na unaweza kubeba nguvu ya matokeo au wakati ujao katika muktadha.
- source_word: וְלֹא יֵאָסֵף
  choice: lakini hatakusanywa
  rationale: Kitenzi katika kauli ya kutendwa humaanisha “kukusanywa” na huweza kudokeza kufa, kuzikwa, au kukusanywa pamoja na watu wake. Tafsiri fupi inadumisha kutokubainishwa kwa Kiebrania; “lakini” huonyesha utofauti wa wazo.
- source_word: עֵינָיו פָּקַח
  choice: hufumbua macho yake
  rationale: Hii ni Kiswahili cha kawaida kwa tendo la kufungua macho, huku kikidumisha badiliko la ghafla katika mstari.
- source_word: וְאֵינֶנּוּ
  choice: naye hayupo tena
  rationale: Kihalisi ni “naye hayupo,” nahau inayoweza kuonyesha kutoweka au kutokuwapo tena. “Hayupo tena” ni ya asili katika Kiswahili na inadumisha ukali wa usemi.
theological_decisions:
- issue: Maana ya “hatakusanywa”
  choice: Kuacha usemi bila kufafanua kinachokusudiwa
  alternative: “Hatakusanywa pamoja na mababu zake” au “hatazikwa”
  rationale: Kiebrania hakitaji wazi mababu, watu wake, wala maziko. Kuongeza mojawapo kungeondoa utata halisi wa mstari na kuufanya useme zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Hatakusanywa” limehifadhiwa ili kutopanua kimadhehebu au kufuta utata wa Kiebrania.
