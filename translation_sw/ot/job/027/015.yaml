  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: sw
  text: Wale watakaobaki baada yake watazikwa kwa kifo[a], na wajane wake hawatalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watazikwa katika kifo.” Usemi wa Kiebrania umebanwa na unaweza kueleza jinsi au hatima ya maziko, au kuzikwa katikati ya mauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: wale watakaobaki baada yake
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya tatu ya kiume imetumiwa kwa maana ya pamoja, kama inavyoonyeshwa na kitenzi cha wingi. Usemi huu unaonyesha walioendelea kuwa hai baada yake bila kufanya maana ya 'mabaki' kuwa ya kiufundi.
- source_word: בַּמָּוֶת
  choice: kwa kifo
  rationale: Kihusishi ב pamoja na מָוֶת kinaweza kuonyesha njia au hali inayohusiana na maziko. 'Kwa kifo' inadumisha usemi mkali na uliobanwa wa Kiebrania; uwezekano wa 'katika kifo' umewekwa katika tanbihi.
- source_word: יִקָּבֵרוּ
  choice: watazikwa
  rationale: Hii ni nifali ya קבר yenye maana ya kutendwa, yaani 'kuzikwa'; 'watazikwa' ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: וְאַלְמְנֹתָיו
  choice: na wajane wake
  rationale: אַלְמָנָה ni 'mjane'; wingi wenye kiambishi chake unatafsiriwa kiasili kuwa 'wajane wake' bila kufafanua zaidi utambulisho wao kuliko maandishi yanavyofanya.
- source_word: לֹא תִבְכֶּינָה
  choice: hawatalia
  rationale: בכה humaanisha kulia au kutoa machozi. 'Hawatalia' ni sahihi na ya kawaida kuliko neno pana zaidi la kuomboleza.
