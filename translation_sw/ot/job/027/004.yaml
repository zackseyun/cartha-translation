translation:
  language: sw
  text: Midomo yangu haitasema udhalimu[a], wala ulimi wangu hautatamka udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia muundo wa kiapo wenye neno “ikiwa” (אִם) ili kusisitiza kukataa: kwa maana halisi, “ikiwa midomo yangu itasema udhalimu…,” yaani, “hakika midomo yangu haitasema udhalimu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: haitasema / hautatamka
  rationale: Katika muktadha huu אִם limetumiwa katika muundo wa kiapo unaosisitiza kukataa, si kama sharti la kawaida. Kiswahili cha kawaida huwasilisha maana hiyo kwa ukanushi wa moja kwa moja.
- source_word: תְּדַבֵּרְנָה
  choice: itasema
  rationale: Piel ya דבר ina maana ya kusema; hali ya kitenzi katika kiapo hiki inaonyesha azimio linaloelekea wakati ujao.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Huhifadhi taswira halisi ya kiungo cha mwili na usambamba wake na ‘ulimi wangu’; usemi huo ni wa asili katika Kiswahili.
- source_word: עַוְלָה
  choice: udhalimu
  rationale: Neno hili lina maana ya uovu, kutokuwa sawa, au kutenda isivyo haki. ‘Udhalimu’ huhifadhi uzito wa kimaadili na kutofautishwa na udanganyifu katika mstari wa pili.
- source_word: וּלְשׁוֹנִי
  choice: wala ulimi wangu
  rationale: Nguvu ya ukanushi wa kishazi cha kwanza inaendelea hapa; ‘wala’ huonyesha ukanushi huo na kuhifadhi usambamba wa midomo na ulimi.
- source_word: יֶהְגֶּה
  choice: hautatamka
  rationale: הגה inaweza kumaanisha kunong’ona, kutamka, au kutafakari. Ulimi ukiwa kiima na udanganyifu ukiwa yambwa, ‘kutamka’ inafaa kwa usemi unaotolewa kwa sauti.
- source_word: רְמִיָּה
  choice: udanganyifu
  rationale: Hutoa maana ya hila au udanganyifu kwa Kiswahili cha sasa, huku ikibaki tofauti na ‘udhalimu’ katika kishazi cha kwanza.
