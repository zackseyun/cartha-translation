  text: 'Huijenga nyumba yake kama nondo,[a]


    kama kibanda anachojenga mlinzi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama banda la muda anajenga mlinzi.” Maneno ya Kiebrania yanaweza kueleweka kwa mahususi zaidi kuwa kibanda cha muda cha shambani na mtu anayekilinda.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָה
  choice: Huijenga
  rationale: Ingawa kitenzi cha Kiebrania kiko katika hali timilifu, katika ushairi huu kinaeleza tabia ya kawaida ya mtu mwovu; wakati wa sasa unafaa katika Kiswahili.
- source_word: כָעָשׁ
  choice: kama nondo
  rationale: עָשׁ kwa kawaida ni nondo. Mfano unaonyesha nyumba dhaifu na isiyodumu; kiambishi כ־ kinaonyesha ulinganisho.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: Muktadha wa kujenga na ulinganifu na kibanda unaonyesha jengo halisi, si jamaa au watu wa nyumbani.
- source_word: וּכְסֻכָּה
  choice: kama kibanda
  rationale: סֻכָּה ni kibanda au makao ya muda; “kibanda” ni neno la kawaida linalodokeza jengo dogo lisilo la kudumu.
- source_word: עָשָׂה
  choice: anachojenga
  rationale: Kitenzi kimetafsiriwa kwa wakati wa sasa wa mazoea ili kuonyesha tendo la kawaida; “kujenga” ni la asili zaidi kwa kibanda kuliko “kutengeneza” katika mstari huu.
- source_word: נֹצֵר
  choice: mlinzi
  rationale: Neno hili ni umbo la kushiriki lenye maana ya mtu anayelinda au kukesha, hapa likielekea kwa mlinzi wa shamba au shamba la mizabibu.
