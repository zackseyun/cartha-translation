lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: atampigia makofi
  rationale: Kitenzi שׂפק pamoja na כפים kinaeleza kupiga au kugonganisha mikono. “Kumpigia makofi” ni Kiswahili cha kawaida kinachohifadhi ishara hiyo bila kuamua ikiwa ni ya dhihaka, ushindi, au mshangao.
- source_word: עָלֵימוֹ
  choice: -m- katika “atampigia makofi”
  rationale: Kihusishi על chenye kiambishi cha nafsi hapa kinaelekeza tendo kwa mhusika huyo; muundo wa Kiswahili “kumpigia makofi” huwasilisha maana hiyo kwa kawaida.
- source_word: כַפֵּימוֹ
  choice: makofi
  rationale: כף ni kiganja au mkono, lakini katika msemo huu wingi wake hurejelea mikono inayopigwa pamoja. “Makofi” ni usemi wa asili wa Kiswahili.
- source_word: וְיִשְׁרֹק
  choice: kumzomea
  rationale: שרק inaweza kumaanisha kupiga mluzi au kutoa mlio wa kuzomea. Katika muktadha huu wa uhasama, “kumzomea” huonyesha vizuri tendo la dharau bila maelezo marefu.
- source_word: עָלָיו
  choice: -m- katika “kumzomea”
  rationale: Kiambishi cha yambwa kinaonyesha kuwa sauti ya dharau inaelekezwa kwake.
- source_word: מִמְּקֹמוֹ
  choice: kutoka mahali pake
  rationale: מקום maana yake ya msingi ni “mahali.” Tafsiri hii ni ya moja kwa moja na haibainishi kama ni makao au eneo la aina nyingine.
theological_decisions:
- issue: Utambulisho wa mtendaji katika mstari huu
  choice: Kiima hakikutajwa wazi; kitenzi cha nafsi ya tatu kimetumiwa bila kuongeza jina la mtendaji.
  alternative: Kutaja Mungu, watu wengine, au upepo wa mashariki kuwa ndiye mtendaji.
  rationale: Kiebrania kina vitenzi vya nafsi ya tatu umoja bila kiima kilichotajwa. Muktadha umeruhusu maelezo tofauti, kwa hiyo tafsiri haiongezi utambulisho ambao mstari wenyewe haujaweka wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kawaida. Wakati ujao umetumiwa kwa vitenzi vya Kiebrania vya hali isiyotimilika katika mfululizo wa matendo ya hukumu, huku kiima kisichotajwa kikihifadhiwa.
