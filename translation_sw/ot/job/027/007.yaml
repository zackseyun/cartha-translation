base_translation:
  language: en
  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: sw
  text: Adui yangu na awe kama mwovu, naye anayeinuka dhidi yangu kama dhalimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Adui yangu na awe kama mtu mwovu, na mpinzani wangu kama mtu dhalimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: na awe
  rationale: Kauli ya kutakia ya kitenzi היה inaonyesha tamanio au laana; “na awe” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.
- source_word: כְרָשָׁע
  choice: kama mwovu
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na רָשָׁע humaanisha mtu mwovu; “kama mwovu” ni ya moja kwa moja na ya asili.
- source_word: אֹיְבִי
  choice: adui yangu
  rationale: Nomino אויב yenye kiambishi cha nafsi ya kwanza umoja ina maana ya adui wa msemaji.
- source_word: וּמִתְקוֹמְמִי
  choice: na yule anayeinuka dhidi yangu
  rationale: Umbo la kishirikishi kutoka קום linaonyesha mtu anayejisimamisha kwa uhasama dhidi ya msemaji; tafsiri hii inahifadhi taswira ya kitenzi.
- source_word: כְעַוָּל
  choice: kama mtu asiye haki
  rationale: עַוָּל humaanisha mtu mwenye sifa ya ukosefu wa haki au uovu; “mtu asiye haki” huhifadhi maana hiyo ya kimaadili.
