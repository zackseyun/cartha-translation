base_translation:
  language: en
  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
translation:
  language: sw
  text: Tazameni, ninyi nyote mmeona; kwa nini basi mnakuwa wabatili?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nini basi mnatenda kwa ubatili?” Kiebrania kinatumia nomino na kitenzi vya mzizi mmoja, הבל, unaohusiana na ubatili, utupu, au kutokuwa na maana; mchezo huo wa maneno ni vigumu kuuhifadhi kikamilifu katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazameni
  rationale: Ni neno la kuvuta usikivu na kusisitiza dai linalofuata. “Tazameni” lina nguvu hiyo kwa Kiswahili cha sasa.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: ninyi nyote
  rationale: Kiwakilishi pamoja na כֻּלְּכֶם kinasisitiza kuwa wote bila kuacha yeyote; “ninyi nyote” huhifadhi mkazo huo.
- source_word: חֲזִיתֶם
  choice: mmeona
  rationale: Kitenzi חזה humaanisha kuona au kutambua kwa uchunguzi. “Mmeona” kinaonyesha kwamba tayari wameushuhudia ukweli unaozungumziwa.
- source_word: וְלָמָּה
  choice: kwa nini basi
  rationale: Kiunganishi pamoja na swali kinaendeleza hoja kutokana na walichokiona; “basi” hudhihirisha uhusiano huo wa kimantiki.
- source_word: זֶּה
  choice: —
  rationale: Hapa זֶּה inaonekana kuwa ya kusisitiza katika kirai kizima badala ya kuwa kitu kinachoonyeshwa moja kwa moja. Haikutafsiriwa kwa neno tofauti ili kuepuka Kiswahili kisicho cha kawaida; nguvu yake inadokezwa na muundo wa swali.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: mnakuwa watu wa ubatili
  rationale: Nomino הֶבֶל na kitenzi cha mzizi huohuo huunda mchezo wa maneno wenye maana ya utupu, ubatili au kutokuwa na maana. “Mnakuwa watu wa ubatili” huhifadhi wazo la hali wanayoingia bila kulazimisha kuwa kinachokemewa ni maneno pekee au matendo pekee.
theological_decisions:
- issue: Je, ubatili unahusu maneno, matendo, au hali ya watu hao?
  choice: Imetafsiriwa kwa upana kuwa “mnakuwa watu wa ubatili.”
  alternative: “mnasema maneno ya ubatili” au “mnatenda kwa ubatili”
  rationale: Kiebrania hakitaji wazi kusema wala kutenda. Tafsiri pana huhifadhi utata wa chanzo na huepuka kuingiza ufafanuzi wa muktadha ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Ubatili” ni neno linalofaa katika sajili ya Biblia na huhifadhi upana wa maana ya הבל; muundo umeepuka kuongeza “maneno” au “matendo,” ambayo hayajasemwa wazi katika Kiebrania.
