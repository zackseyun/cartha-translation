  rationale: The revision improves idiomatic Swahili temporal phrasing and renders the singular Hebrew אַף with ‘pua yangu.’ It preserves the source’s concrete life-breath imagery, the lexical ambiguity of רוּחַ in the footnote, and the elevated poetic register.
