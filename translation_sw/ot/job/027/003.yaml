  text: כִּֽי כָל ע֣וֹד נִשְׁמָתִ֣/י בִ֑/י וְ/ר֖וּחַ אֱל֣וֹהַּ בְּ/אַפִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: sw
  text: Kwa maana, maadamu pumzi yangu ingali ndani yangu, na pumzi ya Mungu iko katika pua yangu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho wa Mungu iko katika pua yangu.” Neno la Kiebrania רוּחַ linaweza kumaanisha “pumzi,” “upepo,” au “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hilo linaanzisha uthibitisho mzito wa Ayubu na kuunganisha mstari huu na kiapo kinachoendelea, bila kulazimisha maana ya sababu pekee.
- source_word: כָל עוֹד
  choice: muda wote ... ingali
  rationale: Muundo huu unaonyesha kuendelea kwa muda, yaani, ‘kwa muda wote ambao bado’; Kiswahili hiki ni cha kawaida na kinahifadhi dhana ya kuendelea.
- source_word: נִשְׁמָתִי
  choice: pumzi yangu
  rationale: Neno נְשָׁמָה hapa linamaanisha pumzi au pumzi ya uhai, na linaendana na taswira ya pumzi kuwa puani katika kishazi kinachofuata.
- source_word: בִי
  choice: ndani yangu
  rationale: Kihusishi kinaonyesha kuwamo ndani ya mtu; ‘ndani yangu’ kinahifadhi taswira hiyo waziwazi.
- source_word: וְרוּחַ
  choice: na pumzi
  rationale: רוּחַ linaweza kumaanisha pumzi, upepo, au roho. Katika usambamba huu wa kishairi na נִשְׁמָתִי na katika kutajwa kwa pua, ‘pumzi’ linafaa zaidi kwa maana halisi ya uhai, huku ‘Roho’ ikihifadhiwa kama uwezekano katika tanbihi.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni jina la umoja la Mungu linalotumiwa sana katika kitabu cha Ayubu; ‘Mungu’ ni tafsiri sahihi na ya kawaida.
- source_word: בְּאַפִּי
  choice: puani mwangu
  rationale: אַף hapa linarejelea pua au matundu ya pua katika taswira halisi ya kupumua. ‘Puani mwangu’ ni Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Maana ya רוּחַ אֱלוֹהַּ katika usambamba na נִשְׁמָתִי
  choice: pumzi ya Mungu
  alternative: Roho wa Mungu
  rationale: Muktadha wa karibu unasisitiza uhai unaoendelea na kupumua—‘pumzi yangu’ na ‘puani mwangu’—kwa hiyo ‘pumzi ya Mungu’ inafaa zaidi katika usambamba wa Kiebrania. Hata hivyo, kwa kuwa רוּחַ pia linaweza kumaanisha ‘Roho,’ uwezekano huo hauondolewi bali unaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ingali’ ni kifupi kinachoeleweka cha ‘bado iko’ na kinafaa kwa ushairi; ‘puani mwangu’ huhifadhi taswira halisi bila kuwa nzito.
