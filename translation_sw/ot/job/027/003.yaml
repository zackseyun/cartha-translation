review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders כִּי as a discourse-grounding ‘Kwa maana,’ preserves the duration expressed by כָל עוֹד, and appropriately translates נִשְׁמָתִי as ‘pumzi yangu.’ It also rightly prefers ‘pumzi ya Mungu’ for וְרוּחַ אֱלוֹהַּ in this respiration/life-breath parallel, while retaining ‘Roho’ as a lexical alternative in the note. However, the final location should represent the singular Hebrew אַף (‘nose/nostril’) more directly.
  naturalness: ‘Muda wote ... ingali ndani yangu’ is understandable but is somewhat compressed and less idiomatic than ‘maadamu ... ingali ndani yangu.’ ‘Ipo puani mwangu’ is grammatically acceptable for ‘pumzi,’ but ‘katika pua yangu’ is clearer and more natural for the singular source noun and avoids an unnecessary bodily-location ambiguity.
  terminology: ‘Pumzi ya Mungu’ is contextually sound and avoids imposing a pneumatological reading. The footnote’s ‘Roho wa Mungu’ is a valid alternative. ‘Pua yangu’ is preferable to ‘puani mwangu’ here because the Hebrew noun is singular, though the latter can idiomatically evoke the nostrils.
  issues:
  - severity: medium
    issue: The main line renders בְּאַפִּי with ‘puani mwangu,’ a locative expression that naturally suggests plural nostrils, whereas the Hebrew אַף is singular.
    rationale: Using ‘katika pua yangu’ more directly reflects the singular noun while retaining the concrete breathing imagery.
  - severity: low
    issue: ‘Muda wote pumzi yangu ingali ndani yangu’ is slightly elliptical in modern Standard East African Swahili.
    rationale: ‘Maadamu pumzi yangu ingali ndani yangu’ expresses the temporal-continuative force smoothly and naturally without altering meaning.
