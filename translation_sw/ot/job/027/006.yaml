base_translation:
  language: en
  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: sw
  text: Ninaushikilia uadilifu wangu, wala sitauachilia[a]; moyo wangu haunilaumu kwa siku yoyote ya maisha yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haki yangu.” Neno la Kiebrania kwa kawaida humaanisha haki au hali ya kuwa sawa, lakini katika kitabu cha Ayubu linaweza pia kueleza uadilifu wa mtu binafsi.
    reason: lexical_alternative
  - marker: b
    text: Au, “moyo wangu haunitukani siku zote za maisha yangu.” Nahau ya Kiebrania inaweza kumaanisha lawama au shutuma ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: uadilifu wangu
  rationale: Neno צְדָקָה humaanisha haki au hali ya kuwa sawa. Katika dai la Ayubu kuhusu mwenendo wake mwenyewe, “uadilifu wangu” ni Kiswahili cha asili kinachobaki na uzito wa kimaadili bila kudokeza ukamilifu usio na dhambi.
- source_word: הֶחֱזַקְתִּי
  choice: ninaushikilia
  rationale: Hifili ya חזק hapa ina maana ya kushika kwa nguvu au kudumisha. Wakati wa sasa unaonyesha msimamo unaoendelea wa Ayubu katika muktadha.
- source_word: וְלֹא אַרְפֶּהָ
  choice: wala sitauachilia
  rationale: רפה katika hifili humaanisha kuachia au kulegeza mshiko. Kiambishi cha kike kinarejelea “uadilifu” (צִדְקָתִי).
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: moyo wangu haunilaumu
  rationale: חרף kwa kawaida ni kulaumu, kushutumu, au kutukana. Moyo ukiwa mtendaji, kirai kinaeleza kujilaumu kwa ndani; “moyo” umehifadhiwa badala ya kutafsiri kwa neno la kiufafanuzi “dhamiri.”
- source_word: מִיָּמָי
  choice: kwa siku yoyote ya maisha yangu
  rationale: מן pamoja na wingi wa “siku” chini ya ukanushi hutoa maana ya kwamba hakuna siku yoyote ya maisha yake ambayo moyo wake unamlaumu; tafsiri hii huweka wazi wigo wa ukanushi kwa Kiswahili.
theological_decisions:
- issue: Iwapo צִדְקָה itafsiriwe kwa maana ya moja kwa moja ya haki au kwa maana ya uadilifu wa mtu binafsi.
  choice: uadilifu wangu
  alternative: haki yangu
  rationale: Katika muktadha wa Ayubu kutetea mwenendo wake, “uadilifu” husikika kwa kawaida zaidi katika Kiswahili na huhifadhi dai la kimaadili. Tanbihi inahifadhi “haki yangu” kama tafsiri ya karibu zaidi ya neno lenyewe, ili kutopunguza mvutano wa dai la Ayubu.
- issue: Iwapo “moyo” ubadilishwe kuwa “dhamiri.”
  choice: moyo wangu haunilaumu
  alternative: dhamiri yangu hainishtaki
  rationale: Maandishi ya Kiebrania yanataja moyo. Kuihifadhi huepuka kuingiza dhana ya kiufafanuzi, huku kitenzi “haunilaumu” kikieleza kwa kawaida hali ya kujilaumu kwa ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ninaushikilia” na “sitauachilia” huendeleza taswira ya kushika kwa nguvu; “moyo wangu” huhifadhi nahau ya Kiebrania. Mpangilio wa alama za tanbihi umewekwa mahali zinapohusika moja kwa moja.
