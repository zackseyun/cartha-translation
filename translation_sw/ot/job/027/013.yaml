lexical_decisions:
- source_word: זֶה
  choice: Hili ndilo
  rationale: Kiashiria kinaanzisha kauli ya kutambulisha; muundo huu ni wa asili katika Kiswahili na unakubaliana na nomino ya ngeli ya li-ya, “fungu.”
- source_word: חֵלֶק
  choice: fungu
  rationale: “Fungu” huonyesha sehemu au jambo analopangiwa mtu, na linafaa katika muktadha wa matokeo yaliyowekwa huku likitofautishwa na “urithi.”
- source_word: אָדָם רָשָׁע
  choice: mtu mwovu
  rationale: “Mtu” hudumisha umoja wa Kiebrania bila kulazimisha jinsia katika Kiswahili; “mwovu” ni neno la kawaida la kifasihi kwa tabia mbaya katika fasihi ya hekima.
- source_word: עִם אֵל
  choice: kutoka kwa Mungu
  rationale: Ingawa עִם kwa kawaida ni “pamoja na/kwa,” hapa sambamba na “kutoka kwa Mwenyezi” na wazo la fungu linalotolewa vinaunga mkono maana ya kiuamilifu “kutoka kwa Mungu.” Utata wa usemi wa Kiebrania umeonyeshwa katika tanbihi.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Hutafsiri kwa kawaida mali au sehemu inayopokewa na kudumisha taswira tofauti lakini sambamba na “fungu.”
- source_word: עָרִיצִים
  choice: watu wakatili
  rationale: Neno hili huonyesha watu wenye ukatili na uonevu; “watu wakatili” ni la sasa, wazi, na lenye hadhi katika Kiswahili.
- source_word: מִשַּׁדַּי
  choice: kutoka kwa Mwenyezi
  rationale: שדי ni cheo cha Mungu; “Mwenyezi” ni tafsiri ya kawaida ya Kiswahili inayowasilisha maana badala ya kunakili matamshi.
- source_word: יִקָּחוּ
  choice: wanaupokea
  rationale: Kitenzi kimsingi ni “watachukua,” lakini katika muktadha wa fungu na urithi, “wanaupokea” huwasilisha kwa asili jambo linalowajia kama sehemu yao. Wakati wa sasa wa kimazoea unafaa kwa kauli ya jumla ya hekima; uwezekano wa wakati ujao umewekwa tanbihini.
theological_decisions:
- issue: Uhusiano unaoonyeshwa na עִם אֵל
  choice: kutoka kwa Mungu
  alternative: kwa Mungu / pamoja na Mungu
  rationale: Usambamba na מִשַּׁדַּי (“kutoka kwa Mwenyezi”) unaelekeza kwenye chanzo cha fungu, lakini tanbihi inahifadhi muundo halisi na utata wa Kiebrania badala ya kuufuta.
- issue: Cheo cha Mungu שדי
  choice: Mwenyezi
  alternative: Shaddai
  rationale: Hiki ni cheo cha Mungu, si jina binafsi katika tafsiri hii; kimetafsiriwa kwa maana yake ya kawaida bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mstari umehifadhi muundo sambamba wa “fungu” na “urithi,” pamoja na koloni la mwisho kwa sababu kauli hii inatanguliza maelezo yanayofuata.
