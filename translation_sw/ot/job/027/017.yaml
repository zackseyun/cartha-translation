  text: Anaweza kuandaa mavazi[a], lakini mwenye haki atayavaa[b], na asiye na hatia ataigawanya fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anaandaa mavazi, lakini mwenye haki atayavaa.” Kitenzi cha Kiebrania kinaweza kutafsiriwa bila maana ya kukubali jambo kwa muda; muktadha wa mstari uliotangulia unaunga mkono maana, “Anaweza kuandaa mavazi, lakini…”
    reason: lexical_alternative
