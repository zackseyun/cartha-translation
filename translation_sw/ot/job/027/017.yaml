lexical_decisions:
- source_word: יָכִין
  choice: Anaweza kuandaa hayo
  rationale: 'Hifili ya כון humaanisha ‘kuandaa’ au ‘kutayarisha.’ Muktadha wa mstari uliotangulia unaashiria mavazi na mali iliyokusanywa; ‘hayo’ linaelekeza hasa kwenye mavazi. ‘Anaweza’ huonyesha maana ya kukubali jambo kwa muda inayotokana na muktadha: hata akiyaandaa, mwingine atayavaa.'
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kivumishi hiki kimetumiwa kama nomino. ‘Mwenye haki’ ni Kiswahili cha kawaida na chenye heshima, nacho huhifadhi utofauti wa kimaadili dhidi ya mtu mwovu bila kulazimisha jinsia katika tafsiri.
- source_word: יִלְבָּשׁ
  choice: atayavaa
  rationale: Qal ya לבש humaanisha ‘kuvaa.’ Kiambishi cha yambwa ‘-ya-’ kinaonyesha mavazi yaliyotajwa katika mstari uliotangulia, ingawa yameachwa kudokezwa katika Kiebrania.
- source_word: כֶסֶף
  choice: fedha
  rationale: כֶסֶף inaweza kumaanisha fedha kama metali au pesa. Hapa ‘fedha’ huhifadhi maana pana ya Kiswahili na uhusiano na mali iliyokusanywa katika mstari uliotangulia.
- source_word: נָקִי
  choice: asiye na hatia
  rationale: Kivumishi kimetumiwa kama nomino na humtaja mtu asiye na kosa au hatia. Tafsiri hii ni ya kawaida na huweka wazi utofauti wa kimaadili.
- source_word: יַחֲלֹק
  choice: ataigawanya
  rationale: Qal ya חלק humaanisha ‘kugawa’ au ‘kutoa mafungu.’ ‘Ataigawanya’ huhifadhi maana ya moja kwa moja, huku kiambishi ‘-i-’ kikirejelea fedha.
