  text: חָלִ֣ילָ/ה לִּ/י֮ אִם אַצְדִּ֪יק אֶ֫תְ/כֶ֥ם עַד אֶגְוָ֑ע לֹא אָסִ֖יר תֻּמָּתִ֣/י מִמֶּֽ/נִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: sw
  text: Hasha! Niwatangaze kuwa mna haki[a]? Mpaka nife, sitajiondolea uadilifu wangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niwahesabie haki” au “niwatangaze kuwa wenye haki.” Kitenzi cha Kiebrania kina maana ya kimahakama ya kutangaza kwamba mtu yuko upande wa haki.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutokuwa kwangu na lawama.” Neno la Kiebrania linaweza kumaanisha uadilifu wa kimaadili au kutokuwa na lawama katika utetezi wa Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Hasha
  rationale: Tamko hili la Kiswahili linaonyesha kwa nguvu kukataa kabisa, bila kulazimisha taswira ya msingi ya jambo lililo najisi au marufuku.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: niwatangaze kuwa mko sawa
  rationale: Hifili ya צדק ina maana ya kimahakama ya kutangaza kwamba mtu yuko upande wa haki. Kauli hii ni wazi kwa msomaji wa kawaida na haileti maana maalumu ya kidhehebu.
- source_word: עַד אֶגְוָע
  choice: Mpaka nife
  rationale: גוע humaanisha kufa au kukata roho; tafsiri hii ni ya kawaida, wazi, na yenye uzito unaofaa.
- source_word: לֹא אָסִיר
  choice: sitajiondolea
  rationale: Kitenzi hiki kinahifadhi wazo la kuondoa, huku muundo wa kujirejelea ukitoa kwa Kiswahili maana ya 'kutoka kwangu mwenyewe' bila sentensi nzito isiyo ya kawaida.
- source_word: תֻּמָּתִי
  choice: uadilifu wangu
  rationale: תֻּמָּה hapa hueleza ukamilifu wa mwenendo au kutokuwa na lawama katika utetezi wa Ayubu. 'Uadilifu' ni wa asili katika Kiswahili na haudai kwamba Ayubu hana dhambi kabisa.
- source_word: מִמֶּנִּי
  choice: -ji- katika 'sitajiondolea'
  rationale: Kiambishi cha kujirejelea kinawasilisha msisitizo wa 'kutoka kwangu' kwa Kiswahili cha kawaida, bila kurudia maneno kwa namna isiyo asili.
theological_decisions:
- issue: Aina ya dai la Ayubu kuhusu hali yake ya kimaadili
  choice: uadilifu wangu
  alternative: kutokuwa kwangu na lawama; kutokuwa kwangu na hatia
  rationale: '''Uadilifu'' hudumisha dai la Ayubu kwamba hatakubali mashtaka ya rafiki zake, bila kulipanua kuwa dai la kutokuwa na dhambi kabisa.'
- issue: Maana ya kuwatangaza rafiki zake kuwa sawa
  choice: niwatangaze kuwa mko sawa
  alternative: niwahesabie haki; nikiri kwamba mna haki
  rationale: Tafsiri iliyochaguliwa inadumisha maana ya kimahakama ya צדק na pia utata wa kama Ayubu anakataa hoja zao au hukumu yao dhidi yake, bila kuingiza matumizi ya baadaye ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Hasha' limetumiwa kama tamko fupi lenye nguvu; 'sitajiondolea' huepuka usemi mzito wa neno kwa neno huku likihifadhi taswira na hali ya kujirejelea ya Kiebrania.
