  yaml_path: translation/ot/job/027/020.yaml
  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: sw
  text: 'Vitisho vinamfikia kama maji;[a]


    usiku, dhoruba humwiba.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama mafuriko.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tufani” au “upepo wa kisulisuli humwiba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: vinamfikia
  rationale: Kitenzi cha Kiebrania katika Hifili kinaonyesha kwamba vitisho vinamwandama na hatimaye vinamfikia; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha picha ya maafa yanayomfuata.
- source_word: כַמַּיִם
  choice: kama maji
  rationale: Uwingi wa Kiebrania una maana ya maji yenye nguvu nyingi; ‘kama maji’ inadumisha sitiari bila kuifasiri moja kwa moja kuwa mafuriko.
- source_word: בַּלָּהוֹת
  choice: Vitisho
  rationale: Neno hili humaanisha mambo ya kutisha au hofu kuu; ‘vitisho’ ni fupi, ya kishairi, na inaendana na maafa yanayomfikia mwovu.
- source_word: לַיְלָה
  choice: usiku
  rationale: Nomino imetumiwa kama kielezi cha wakati; ‘usiku’ ni tafsiri ya asili na ya moja kwa moja.
- source_word: גְּנָבַתּוּ
  choice: inamwiba na kumpeleka mbali
  rationale: Mzizi גנב humaanisha kuiba. Kauli hii inadumisha picha ya dhoruba inayemwondoa kama mwizi, huku ‘na kumpeleka mbali’ ikifanya maana yake ieleweke kwa Kiswahili cha kawaida.
- source_word: סוּפָה
  choice: dhoruba
  rationale: Neno hili hutaja tufani au dhoruba kali; ‘dhoruba’ ni neno pana, la sasa, na haliongezi wazo mahususi la upepo wa kisulisuli.
