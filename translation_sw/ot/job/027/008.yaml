  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: sw
  text: Kwa maana mtu asiyemcha Mungu[a] ana tumaini gani Mungu anapomkata mbali[b], anapouondoa uhai wake?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnafiki.” Neno la Kiebrania linaweza kumaanisha mtu asiye na uchaji, asiyemjali Mungu, au mnafiki.
    reason: lexical_alternative
  - marker: b
    text: Kifungu hiki cha Kiebrania ni kigumu. Tafsiri nyingine ni “anapopata faida” au “ingawa amepata faida.”
    reason: alternative_reading
  - marker: c
    text: Kwa tafsiri ya karibu zaidi, “Mungu anapoivuta nafsi/uhai wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: tumaini
  rationale: Neno hili humaanisha jambo ambalo mtu analitumainia au kulitarajia. “Tumaini” ni la kawaida na linafaa katika swali hili kuhusu matarajio ya mwisho ya mtu.
- source_word: חָנֵף
  choice: mtu asiyemcha Mungu
  rationale: Katika Ayubu neno hili kwa kawaida humtaja mtu asiye na uchaji au anayempuuza Mungu, si mnafiki tu. Usemi huu ni wa asili katika Kiswahili na unahifadhi maana ya kidini na kimaadili.
- source_word: יִבְצָע
  choice: anapokatiliwa mbali
  rationale: Kifungu hiki kifupi kina utata. Katika muktadha wa Mungu kuondoa uhai, tafsiri hii huonyesha kukomeshwa kwa mtu bila kuficha kwamba kitenzi kinaweza pia kueleweka kwa maana ya kupata faida; uwezekano huo umewekwa katika tanbihi.
- source_word: יֵשֶׁל
  choice: anapouondoa
  rationale: Kitenzi kinaonyesha kutoa, kuvuta nje, au kunyang’anya. “Kuondoa” ni Kiswahili cha kawaida na kinaeleza tendo la Mungu bila kuongeza ukali usiolazimishwa na neno lenyewe.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni jina la kishairi la umoja linalotumiwa sana kumhusu Mungu katika Ayubu; “Mungu” ndilo neno la moja kwa moja katika Kiswahili.
- source_word: נַפְשׁוֹ
  choice: uhai wake
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha uhai wa mtu unaoondolewa wakati wa kufa. “Uhai wake” huepuka kuingiza dai maalumu kuhusu hali ya nafsi baada ya kifo.
theological_decisions:
- issue: Maana ya kiantropolojia ya נֶפֶשׁ
  choice: uhai wake
  alternative: nafsi yake
  rationale: Mstari unazungumzia Mungu kuondoa uhai wa mtu, wala haulengi kufafanua kwa usahihi wa kimafundisho uhusiano kati ya mwili na nafsi.
- issue: Mhusika na maana ya יִבְצָע
  choice: anapokatiliwa mbali
  alternative: anapopata faida / ingawa amepata faida
  rationale: Muktadha unaunga mkono wazo la mwisho wa mtu asiye na uchaji, lakini muundo wa Kiebrania ni mgumu na unaweza kuhusishwa na kupata faida. Tafsiri kuu haifanyi faida kuwa mada bila shaka, na tanbihi inahifadhi usomaji mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa, pamoja na urudiaji wa “anapo-” unaounganisha vifungu viwili. “Mtu asiyemcha Mungu” ni wazi kwa wasomaji wa kawaida bila kulifanya neno hilo liwe dai finyu kuhusu unafiki.
