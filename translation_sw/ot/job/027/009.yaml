  text: Je, Mungu atasikia kilio chake[a] dhiki inapomjia?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwito wake wa kuomba msaada.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ikiwa dhiki itamjia”; kiunganishi cha Kiebrania kinaweza pia kueleweka kuwa cha sharti, ingawa maana ya wakati, “inapomjia,” inafaa vizuri katika muktadha.
