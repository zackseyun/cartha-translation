lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: kilio chake
  rationale: Neno צְעָקָה humaanisha kilio au mwito wa dharura, mara nyingi wa kuomba msaada wakati wa shida. “Kilio chake” ni kifupi, cha kawaida, na huhifadhi uzito wa ombi hilo.
- source_word: יִשְׁמַע
  choice: atasikia
  rationale: 'Katika swali hili, umbo la yiqtol linaeleweka kwa kawaida kuwa la wakati ujao: swali ni kama Mungu atasikia kilio cha mtu huyo dhiki itakapomjia.'
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la kawaida la Mungu. “Mungu” ndilo neno wazi na la kawaida katika Kiswahili.
- source_word: כִּי
  choice: inapo-
  rationale: כִּי lina maana kadhaa. Hapa maana ya wakati, “inapo-,” inafaa vizuri katika muktadha, huku uwezekano wa maana ya sharti ukihifadhiwa katika tanbihi.
- source_word: תָבוֹא עָלָיו
  choice: inapomjia
  rationale: Muundo wa Kiebrania unaonyesha dhiki ikimjia au ikimpata mtu. “Inapomjia” ni ya asili katika Kiswahili na inadumisha taswira ya kitu kinachokuja kwa mtu.
- source_word: צָרָה
  choice: dhiki
  rationale: צָרָה humaanisha hali ya shida, taabu, au mateso yenye kumbano. “Dhiki” ni neno la sasa, lenye hadhi, na linaonyesha uzito huo bila kulazimisha maana ya janga kubwa.
