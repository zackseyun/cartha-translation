  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: sw
  text: Humrushia, wala hamsazi[a]; naye hukimbia kwa hakika kutoka mkononi mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hutupa dhidi yake.” Kiebrania hakitaji wazi kitu kinachotupwa, na kiima kinaachwa kudokezwa; katika muktadha kinaweza kurejelea Mungu au nguvu ya dhoruba iliyotajwa awali.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “akikimbia, hukimbia,” muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi unaosisitiza tendo la kukimbia; pia yaweza kutafsiriwa “hukimbia kwa kasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: Humrushia
  rationale: Kitenzi שלך katika Hiphil humaanisha ‘kutupa/kurusha,’ na עָלָיו huelekeza tendo hilo juu yake au dhidi yake. ‘Humrushia’ ni usemi mfupi na wa kawaida unaohifadhi shambulio hilo bila kuongeza kiwakilishi rejeshi kisichomo wazi katika Kiebrania.
- source_word: וְלֹא יַחְמֹל
  choice: bila huruma
  rationale: חמל inaweza kumaanisha kuhurumia au kutosaza. Katika muktadha wa hukumu kali, ‘bila huruma’ ni ya asili na inaonyesha kwamba hashughuliki naye kwa upole wala kumsaza.
- source_word: מִיָּדוֹ
  choice: kutoka mkononi mwake
  rationale: Tafsiri hii inadumisha taswira halisi ya ‘mkono,’ ambayo pia inaweza kuwakilisha mamlaka, nguvu, au mshiko.
- source_word: בָּרוֹחַ יִבְרָח
  choice: hukimbia kabisa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye nafsi unasisitiza kukimbia. ‘Hukimbia kabisa’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila kuongeza wazo lisilo hakika la kasi.
theological_decisions:
- issue: Utambulisho wa mtendaji katika וְיַשְׁלֵךְ
  choice: Kiima kimeachwa kudokezwa katika ‘Humrushia,’ kama kilivyo katika mstari wa Kiebrania.
  alternative: Kutaja wazi ‘Mungu’ au ‘upepo’ kuwa ndiye anayemrushia.
  rationale: Kitenzi cha Kiebrania hakimtaji mtendaji kwa jina. Muktadha unaweza kueleweka kuwa unamrejelea Mungu au nguvu ya dhoruba iliyotajwa kabla; kwa hiyo tafsiri haifungi maana kwa mmoja wao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi kama Kiebrania, taswira ya ‘mkono’ imehifadhiwa, na utata kuhusu mtendaji haujaondolewa kimakusudi.
