  text: Ingawa anakusanya fedha kama mavumbi na anatayarisha mavazi kama udongo,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akikusanya fedha kama mavumbi na akitayarisha mavazi kama udongo.” Neno la Kiebrania אִם linaweza kusomwa kwa maana ya masharti (“ikiwa/aki-”) au ya kukubali hali (“ingawa”); maana ya “ingawa” inafaa zaidi kwa mtiririko wa hoja katika mistari inayofuata.
