translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Neno “nyingi” limerudiwa ili tashbihi za mavumbi na udongo zieleweke kwa kawaida kama picha za wingi. Alama ya tanbihi [a] imewekwa baada ya kishazi kizima kwa kuwa tanbihi inahusu usomaji wa sentensi nzima.
