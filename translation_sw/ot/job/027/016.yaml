lexical_decisions:
- source_word: אִם
  choice: Ingawa
  rationale: 'Katika muktadha huu wa kishairi, chembe hii inaeleweka kwa maana ya kukubali hali inayopingwa na matokeo yanayofuata: hata mwovu akikusanya mali nyingi, hatadumu kuwa nayo.'
- source_word: יִצְבֹּר
  choice: anakusanya ... nyingi
  rationale: Kitenzi kina picha ya kurundika au kukusanya kwa wingi. Kiswahili hiki ni cha kawaida na, pamoja na “nyingi,” kinawasilisha wazo la akiba kubwa.
- source_word: כֶּעָפָר
  choice: kama mavumbi
  rationale: Huhifadhi tashbihi ya kitu kilicho kingi mno na kisichohesabika kwa urahisi.
- source_word: כָּסֶף
  choice: fedha
  rationale: Neno la Kiebrania humaanisha hasa silver na pia fedha kama mali au pesa. “Fedha” huhifadhi upana huo wa maana katika Kiswahili.
- source_word: וְכַחֹמֶר
  choice: kama udongo
  rationale: חֹמֶר hapa inaelekea kumaanisha udongo wa mfinyanzi; “udongo” ni wazi na huhifadhi picha ya wingi na hali ya kawaida ya kitu hicho.
- source_word: יָכִין
  choice: kuandaa
  rationale: Hiphil ya כון hapa ina maana ya kutayarisha au kuweka tayari; “kuandaa” ni ya asili kwa mavazi.
- source_word: מַלְבּוּשׁ
  choice: mavazi
  rationale: Neno hilo hurejelea nguo au mavazi kwa ujumla. “Mavazi” ni la kisasa, lenye heshima, na linalofaa katika ushairi.
