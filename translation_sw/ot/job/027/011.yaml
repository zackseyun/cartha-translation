  text: אוֹרֶ֣ה אֶתְ/כֶ֣ם בְּ/יַד אֵ֑ל אֲשֶׁ֥ר עִם שַׁ֝דַּ֗י לֹ֣א אֲכַחֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: sw
  text: Nitawafundisha kuhusu mkono wa Mungu[a]; yaliyo kwa Mwenyezi sitayaficha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhusu nguvu au matendo ya Mungu.” Neno “mkono” linaweza kumaanisha nguvu, utendaji, au jinsi Mungu anavyotenda.
    reason: lexical_alternative
  - marker: b
    text: Au, “yaliyo ya Mwenyezi,” “shauri la Mwenyezi,” au “yatokayo kwa Mwenyezi.” Usemi wa Kiebrania ni mfupi na maana yake haijaelezwa kikamilifu.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: Nitawafundisha
  rationale: Ni Hifili ya ירה katika maana ya kutoa mafundisho; umbo la wakati ujao linafaa na kauli ya Ayubu kwa wasikilizaji wake wengi.
- source_word: אֶתְכֶם
  choice: -wa-
  rationale: Kiwakilishi cha nafsi ya pili wingi kimeingizwa kiasili katika kitenzi cha Kiswahili “Nitawafundisha.”
- source_word: בְּיַד אֵל
  choice: kuhusu mkono wa Mungu
  rationale: ב inaeleweka hapa kama kutaja mada ya mafundisho. “Mkono wa Mungu” huhifadhi sitiari ya Kiebrania kuhusu nguvu, utendaji, au matendo ya Mungu bila kuibana kwa maana moja.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina au cheo cha Mungu; “Mungu” ndilo neno la kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: yaliyo kwa Mwenyezi
  rationale: Kauli ya Kiebrania ni fupi na yenye pengo la kimantiki. Tafsiri hii huhifadhi upana wake bila kuingiza waziwazi “shauri,” “kusudi,” au “hukumu.”
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Ni tafsiri ya kawaida, yenye hadhi, ya cheo cha Mungu שַׁדַּי katika Ayubu.
- source_word: לֹא אֲכַחֵד
  choice: sitayaficha
  rationale: Pieli ya כחד ina maana ya kuficha au kusitiri; “sitayaficha” ni ya kawaida na inaafikiana na nomino iliyodokezwa katika kishazi kilichotangulia.
theological_decisions:
- issue: Utendaji wa Mungu unaoelezwa kwa “mkono wa Mungu”
  choice: Kuhifadhi sitiari “mkono wa Mungu.”
  alternative: nguvu za Mungu; yale Mungu anayofanya
  rationale: Sitiari ya Kiebrania ina upeo mpana wa nguvu, utendaji, na matendo ya Mungu. Kuihifadhi huepuka kuamua maana moja nyembamba.
- issue: Maana ya kishazi אֲשֶׁר עִם שַׁדַּי
  choice: “yaliyo kwa Mwenyezi”
  alternative: shauri la Mwenyezi; yaliyo ya Mwenyezi; yatokayo kwa Mwenyezi
  rationale: Kiebrania ni kifupi na kina utata halisi. Tafsiri iliyochaguliwa hudumisha upana huo badala ya kubainisha shauri, kusudi, au chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “yaliyo kwa Mwenyezi” umeachwa kwa makusudi ukiwa mpana kidogo ili kuhifadhi ufupi na utata wa Kiebrania. Alama za tanbihi zimewekwa karibu na vishazi vinavyohusika.
