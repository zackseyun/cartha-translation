lexical_decisions:
- source_word: חַי אֵל
  choice: Kama aishivyo Mungu
  rationale: Hii ni kauli ya kiapo, si maelezo tu kwamba Mungu yu hai. Muundo huu wa Kiswahili unahifadhi nguvu ya kiapo cha Kiebrania kwa lugha ya kawaida na yenye hadhi.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa אֵל ni cheo cha kawaida cha Mungu katika kauli ya kiapo, wala si jina linalohitaji kuandikwa kwa matamshi ya Kiebrania.
- source_word: הֵסִיר
  choice: ameninyima
  rationale: Kitenzi hiki katika Hiphil kina maana ya kuondoa au kutwaa. Pamoja na 'haki yangu,' 'ameninyima' kinaeleza kwa Kiswahili cha kawaida dai la Ayubu kwamba hakupata haki iliyomstahili.
- source_word: מִשְׁפָּטִי
  choice: haki yangu
  rationale: מִשְׁפָּט inaweza kumaanisha haki, hukumu, au dai halali. 'Haki yangu' ni ya asili katika Kiswahili na inadumisha maana ya kutendewa kwa haki pamoja na madai halali ya Ayubu.
- source_word: וְשַׁדַּי
  choice: na Mwenyezi
  rationale: שַׁדַּי imetafsiriwa kama cheo cha Mungu badala ya kunukuliwa kwa matamshi. 'Mwenyezi' ni cheo cha Kiswahili kilichozoeleka na kinachofaa usambamba wa kishairi.
- source_word: הֵמַר
  choice: ameyatia ... uchungu
  rationale: Hiphil ya מרר humaanisha kufanya kuwa chungu. Usemi 'ameyatia maisha yangu uchungu' unahifadhi sitiari halisi kwa Kiswahili kinachoeleweka.
- source_word: נַפְשִׁי
  choice: maisha yangu
  rationale: נֶפֶשׁ hapa inaweza kumaanisha nafsi, maisha, au mtu mwenyewe. 'Maisha yangu' ni Kiswahili cha asili, hakilazimishi mgawanyo wa baadaye wa mwili na roho, na kinafaa kwa malalamiko ya Ayubu.
theological_decisions:
- issue: Kutafsiri vyeo vya Mungu אֵל na שַׁדַּי
  choice: Mungu ... Mwenyezi
  alternative: Mungu ... Shaddai
  rationale: Vyeo vimetafsiriwa ili maana yake ieleweke kwa msomaji wa Kiswahili huku uzito na usambamba wa kiapo ukihifadhiwa.
- issue: Dai la Ayubu kwamba Mungu ameondoa מִשְׁפָּטִי
  choice: ameninyima haki yangu
  alternative: ameondoa hukumu yangu / dai langu halali
  rationale: Tafsiri inatunza ukali wa shtaka lililo katika maandishi bila kulipunguza au kulitatua kitheolojia; Ayubu mwenyewe anadai kuwa Mungu amemnyima haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiapo na usambamba wa majina ya Mungu umehifadhiwa; koma ya mwisho inaonyesha kuwa sentensi inaendelea katika mstari unaofuata.
