  text: Upepo wa mashariki humchukua, naye huondoka; humfagilia mbali kutoka mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: unamchukua
  rationale: Kitenzi נשׂא kina maana ya kuinua, kubeba, au kuchukua. Katika muktadha wa upepo wenye nguvu, “unamchukua” ni Kiswahili cha kawaida kinachoonyesha kuondolewa kwa nguvu bila kuongeza wazo lisilomo katika maandishi.
- source_word: קָדִים
  choice: Upepo wa mashariki
  rationale: קָדִים mara nyingi humaanisha upepo wa mashariki, hasa upepo wenye nguvu au uharibifu katika ushairi wa Kiebrania. Kutaja “upepo” wazi kunaonyesha wakala wa tendo.
- source_word: וְיֵלַךְ
  choice: naye anatoweka
  rationale: הלך kimsingi ni “kwenda,” lakini hapa inaonyesha matokeo ya kuchukuliwa na upepo. “Anatoweka” ni ya asili katika Kiswahili na hudumisha maana kwamba mtu huyo hayupo tena mahali pale.
- source_word: וִישָׂעֲרֵהוּ
  choice: unamfagilia mbali
  rationale: Mzizi סער huhusishwa na dhoruba, kuvuma kwa nguvu, au kusukuma kwa kishindo. “Unamfagilia mbali” huwasilisha tendo la ghafla na lenye nguvu la upepo huku likisomeka kwa kawaida katika Kiswahili.
- source_word: מִמְּקֹמוֹ
  choice: na mahali pake
  rationale: מקום ni “mahali.” Muundo wa Kiswahili “mbali na mahali pake” unaonyesha kwa uwazi kuondolewa kutoka mahali alipokuwa.
