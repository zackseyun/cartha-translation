translation:
  language: sw
  text: Kwa maana ni moto unaoteketeza hadi maangamizi[a], na ungeyang’oa mavuno yangu yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi Abadoni.” Neno la Kiebrania אֲבַדּוֹן linaweza kumaanisha “maangamizi” au, katika baadhi ya miktadha, mahali pa maangamizi au maangamizi yaliyopewa sifa za mtu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu au maelezo ya onyo lililotangulia katika kiapo cha Ayubu.
- source_word: אֵשׁ הִיא
  choice: ni moto
  rationale: Inadumisha sitiari halisi na yenye nguvu ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: עַד אֲבַדּוֹן
  choice: mpaka maangamizi
  rationale: Inaonyesha upeo wa kuteketeza; אֲבַדּוֹן hapa inaeleweka kwa kawaida kama maangamizi, huku uwezekano wa jina Abadoni ukihifadhiwa katika tanbihi.
- source_word: תֹּאכֵל
  choice: unaoteketeza
  rationale: Kitenzi kwa msingi humaanisha kula au kuteketeza; ‘kuteketeza’ kinafaa kwa moto na kinaonyesha uharibifu.
- source_word: וּבְכָל תְּבוּאָתִי
  choice: mavuno yangu yote
  rationale: ‘Mavuno’ yanaeleza zao au ongezeko la Ayubu kwa lugha ya kawaida na kudumisha taswira ya kilimo.
- source_word: תְשָׁרֵשׁ
  choice: ungeyang’oa
  rationale: Piel ya שׁרשׁ hapa ina maana ya kung’oa au kuharibu kutoka mizizini; hali ya masharti inaendelezwa kutoka muktadha wa kiapo uliotangulia.
theological_decisions:
- issue: Maana ya אֲבַדּוֹן
  choice: nomino ya kawaida ‘maangamizi’
  alternative: jina ‘Abadoni’
  rationale: Katika muktadha huu wa fasihi ya hekima, neno linaelekea kuonyesha kiwango cha uharibifu kuliko kutaja eneo au nafsi iliyopewa jina; uwezekano mwingine umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ungeyang’oa’ hudumisha taswira ya kuondoa kutoka mizizini na pia nguvu ya masharti inayotokana na muktadha.
