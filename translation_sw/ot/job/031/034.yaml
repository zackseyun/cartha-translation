base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: sw
  text: kwa sababu niliogopa umati mkubwa, na dharau ya koo[a] ikanitia hofu, nikanyamaza wala sikutoka mlangoni—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “familia.” Neno la Kiebrania מִשְׁפָּחוֹת linaweza kumaanisha familia pana au vikundi vikubwa vya undugu; hapa “koo” linaonyesha maana hiyo pana ya kijamii.
    reason: lexical_alternative
  - marker: b
    text: Mstari huu ni sehemu ya kiapo cha Ayubu cha kujitangaza kuwa hana hatia. Kiebrania kimeacha baadhi ya maneno yaeleweke kutokana na muktadha; maana ni, “kwa sababu niliogopa maoni ya watu … nikanyamaza na kubaki ndani.”
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ikiwa
  rationale: Katika mfululizo wa kiapo cha kujithibitisha kwa Ayubu, כִּי linaweza kuanzisha hali inayodhaniwa. “Ikiwa” huonyesha wazi masharti yaliyodokezwa bila kuyageuza kuwa sababu iliyothibitishwa.
- source_word: אֶעֱרוֹץ
  choice: niliogopa
  rationale: Kitenzi ערץ huonyesha kuogopa au kutishwa sana. “Niliogopa” ni cha kawaida na chenye uzito unaofaa katika Kiswahili.
- source_word: הָמוֹן רַבָּה
  choice: umati mkubwa
  rationale: הָמוֹן ni umati au kundi kubwa la watu, na רַבָּה linaonyesha ukubwa au wingi. “Umati mkubwa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: na dharau ya koo
  rationale: בּוּז ni dharau, huku מִשְׁפָּחוֹת likiwezesha maana ya familia pana au vikundi vya undugu. “Koo” huonyesha vizuri zaidi mazingira mapana ya kijamii kuliko “familia” katika matumizi ya kisasa.
- source_word: יְחִתֵּנִי
  choice: ikanitia hofu
  rationale: Hifili ya חתת huonyesha kusababisha hofu au kuvunja moyo. “Ikanitia hofu” ni ya kawaida na huhifadhi nguvu ya tendo bila kuzidisha maana.
- source_word: וָאֶדֹּם
  choice: hata nikanyamaza
  rationale: דמם humaanisha kuwa kimya au kutulia. “Hata nikanyamaza” huonyesha matokeo ya shinikizo la kijamii katika sentensi hii.
- source_word: לֹא אֵצֵא פָתַח
  choice: wala sikutoka mlangoni
  rationale: Kirai kina picha ya kutotoka kupitia mahali pa kuingilia. “Sikutoka mlangoni” ni kifupi na cha kawaida, huku kikihifadhi picha ya kubaki ndani.
theological_decisions:
- issue: Uhusiano wa כִּי na kiapo cha kutokuwa na hatia
  choice: 'Kulisoma kama sharti: “ikiwa”'
  alternative: 'Kulisoma kama sababu: “kwa sababu”'
  rationale: 'Muktadha wa Ayubu 31 una masharti ya kiapo ambayo mara nyingi yanadokezwa badala ya kutajwa kikamilifu. Tafsiri ya masharti huhifadhi hali ya kudhaniwa: Ayubu anakanusha kwamba aliwahi kunyamazishwa na hofu ya maoni ya watu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa masharti umechaguliwa ili kuhifadhi muktadha wa kiapo na hali ya kudhaniwa; alama ya mwisho ya mkato mrefu inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
