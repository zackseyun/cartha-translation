  text: ikiwa nimekula mazao yake bila malipo, au nimewafanya wamiliki wake wakate tamaa[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “nimeufanya uhai wa wamiliki wake ukome,” au “nimewafanya wamiliki wake wahemee.” Kitenzi cha Kiebrania ni adimu; kishazi hiki kinaweza kumaanisha ukandamizaji mkali sana au kusababisha kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: mazao yake
  rationale: Ingawa neno hilo kimsingi humaanisha ‘nguvu’ au ‘uwezo,’ katika muktadha wa kilimo linaweza kumaanisha nguvu ya ardhi ya kuzaa, yaani mazao yake.
- source_word: אָכַלְתִּי
  choice: nimekula
  rationale: Kitenzi cha kawaida cha kula hapa kinahusu kutumia mazao ya ardhi; hali timilifu inafaa katika muundo wa kiapo cha Ayubu.
- source_word: בְלִי כָסֶף
  choice: bila kulipia
  rationale: כֶּסֶף ni ‘fedha’ kihalisi, lakini hapa ina maana ya malipo; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: נֶפֶשׁ
  choice: pumzi
  rationale: נֶפֶשׁ inaweza kumaanisha uhai, nafsi, au pumzi. ‘Pumzi’ huhifadhi taswira ya kitenzi adimu kinachofuata bila kuamua kwamba lazima walikufa.
- source_word: בְּעָלֶיהָ
  choice: wenyewe
  rationale: Katika muktadha huu ni wale wenye ardhi. ‘Wenyewe’ ni usemi mfupi na wa asili unaorejelea wamiliki wa ardhi iliyotajwa.
- source_word: הִפָּחְתִּי
  choice: nimewakosesha pumzi
  rationale: Hifili hii ya נפח ni adimu na inaweza kueleza kuwafanya wahemee, kuwatesa sana, au hata kuwaua. ‘Nimewakosesha pumzi’ huhifadhi ukali na utata wa taswira.
theological_decisions:
- issue: Ikiwa kishazi cha mwisho kinamaanisha mateso makali au kusababisha kifo
  choice: Kishazi kikuu kimetafsiriwa ‘nimewakosesha pumzi,’ bila kuamua moja kwa moja kuwa walikufa.
  alternative: ‘nimekatisha uhai wa wenyewe’ au ‘nimewavunja moyo wenyewe’
  rationale: Kitenzi cha Kiebrania ni adimu; tafsiri inapaswa kuhifadhi uwezekano wa ukandamizaji mkali na wa kusababisha kifo badala ya kufunga maana kwa upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘ikiwa’ unaendeleza kiapo cha kujilaani katika muktadha; kistari mwishoni kinaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
