  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: sw
  text: Kwa maana hilo ni tendo la aibu, nalo ni uovu unaostahili kuhukumiwa na waamuzi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu unaostahili adhabu ya mahakama.”
    reason: Neno פְּלִילִים linaweza kurejelea waamuzi au hatua ya hukumu ya mahakama; usemi huu unaeleza maana ya kosa linalostahili adhabu ya kisheria.
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya kauli iliyotangulia katika kiapo cha Ayubu na ni muunganisho wa kawaida katika Kiswahili sanifu.
- source_word: הוא
  choice: hilo ni
  rationale: Kiwakilishi kinarejelea tendo lililotajwa katika muktadha uliotangulia; “hilo” hufanya rejeo hilo lieleweke bila kulifafanua zaidi ya maandishi.
- source_word: זִמָּה
  choice: tendo la aibu
  rationale: Neno hili humaanisha tendo ovu sana, hasa la uasherati. Tafsiri hii inadumisha uzito wa kimaadili huku ikiwa ya kawaida na yenye heshima katika Kiswahili cha sasa.
- source_word: וְהִיא
  choice: nalo ni
  rationale: Kiwakilishi cha kike kinapatana na זִמָּה na kinaendelea kulielezea tendo lilelile; “nalo ni” ni muundo wa asili wa Kiswahili.
- source_word: עָוֺן
  choice: uovu
  rationale: Neno linaweza kumaanisha kosa, hatia, au uovu. Hapa “uovu” linahifadhi uzito wa kimaadili na linaendana na muktadha wa hukumu.
- source_word: פְּלִילִים
  choice: unaopaswa kuhukumiwa na waamuzi
  rationale: Wingi huu unahusiana na waamuzi au mchakato wa kimahakama. Muundo huu unaeleza kwa Kiswahili cha kawaida kwamba tendo hilo ni kosa linalostahili kushughulikiwa kisheria, bila kuondoa uwezekano wa kuelewa neno hilo kuwa linahusu adhabu ya mahakama.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Tafsiri inadumisha sambamba ya kishairi kati ya “tendo la aibu” na “uovu,” huku tanbihi ikihifadhi uwezekano mwingine wa usemi wa kimahakama.
