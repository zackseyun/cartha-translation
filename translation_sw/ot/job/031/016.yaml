lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Kinaanzisha kisharti katika mfululizo wa kiapo cha kujilaani cha Ayubu; “Kama” ni ya kawaida na inafaa muundo huu.
- source_word: אֶמְנַע
  choice: niliwanyima
  rationale: Kitenzi מןע katika qal humaanisha kuzuia au kunyima. Hapa yambwa “maskini” imewekwa wazi kwa Kiswahili cha kawaida.
- source_word: מֵחֵפֶץ
  choice: kile walichotamani
  rationale: חֵפֶץ inaweza kumaanisha tamaa, kitu kinachotamaniwa, au jambo linalopendeza. Tafsiri hii inalinda maana pana bila kuibana moja kwa moja kuwa “mahitaji,” ingawa muktadha unaweza kuyadokeza.
- source_word: דַּלִּים
  choice: maskini
  rationale: דַּלִּים hurejelea watu maskini, dhaifu, au wanyonge; “maskini” ndiyo tafsiri ya kawaida na inayofaa muktadha wa haki ya kijamii.
- source_word: וְעֵינֵי
  choice: au kuyafanya macho ya
  rationale: Kiunganishi kinaunganisha shtaka jingine sambamba. “Au” linafaa mfululizo wa masharti hasi kwa Kiswahili, na “kuyafanya” kinakamilisha kwa uwazi uhusiano na kitenzi kinachofuata.
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Umoja wa Kiebrania unawakilisha kundi zima; “mjane” huhifadhi umoja huo wa kiwakilishi.
- source_word: אֲכַלֶּה
  choice: yadhoofike kwa kutazamia
  rationale: כלה katika piel inaweza kumaanisha kumaliza, kukomesha, au kufanya kitu kidhoofike. Ikiwa macho ndiyo yanayoathiriwa, nahau huonyesha kutazamia kwa muda mrefu huku tumaini likiahirishwa; tafsiri hii ni ya kueleweka huku tanbihi ikihifadhi picha halisi.
