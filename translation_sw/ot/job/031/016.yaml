  text: Kama niliwanyima maskini kile walichotamani[a], au nilifanya macho ya mjane yadhoofike kwa kutazamia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “niliwanyima maskini walichotaka,” au, kulingana na muktadha, “niliwanyima maskini walichohitaji.”
