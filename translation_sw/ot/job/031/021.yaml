  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
translation:
  language: sw
  text: ikiwa nimeinua mkono wangu dhidi ya mtoto asiye na baba[a], kwa sababu niliona kwamba nilikuwa na uungwaji mkono langoni[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yatima.” Neno la Kiebrania humaanisha hasa mtoto asiye na baba, na hivyo aliye katika hali dhaifu kijamii.
    reason: lexical_alternative
  - marker: b
    text: “Lango” ni lango la mji, ambako kesi zilisikilizwa na maamuzi ya umma kufanywa.
    reason: cultural_note
  - marker: c
    text: Kwa maana halisi, “msaada wangu”; hapa linamaanisha uungwaji mkono au backing katika mazingira ya kisheria au ya umma.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ikiwa
  rationale: Huanzisha sharti katika kiapo cha kujilaani cha Ayubu 31; muundo huo unaendelea hadi adhabu inayotajwa katika mstari unaofuata.
- source_word: הֲנִיפוֹתִי
  choice: nimeinua
  rationale: Kitenzi hiki katika kauli ya Hiphil kinaonyesha kuinua au kuutumia mkono kwa ishara ya kutisha au kumdhuru mtu; “nimeinua” ni ya kawaida na haibainishi kupita kiasi aina ya tendo.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha wa kuinua mkono kwa uhasama, “dhidi ya” huonyesha vizuri kuwa kitendo kilielekezwa kumdhuru mtu.
- source_word: יָתוֹם
  choice: mtoto asiye na baba
  rationale: Neno la Kiebrania humaanisha hasa mtoto aliyefiwa na baba na hivyo aliyekuwa katika hali dhaifu kijamii; tafsiri hii ni sahihi zaidi kuliko “yatima” bila maelezo.
- source_word: יָדִי
  choice: mkono wangu
  rationale: Taswira halisi ya mkono imedumishwa kwa kuwa inaeleweka kama ishara ya tishio, nguvu, au madhara.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaonyesha sababu iliyoweza kumshawishi Ayubu kutumia vibaya mamlaka yake.
- source_word: אֶרְאֶה
  choice: niliona kwamba
  rationale: Kitenzi cha kuona hapa kinahusu kutambua hali iliyokuwapo; wakati uliopita unasikika kwa kawaida ndani ya sharti hili.
- source_word: בַשַּׁעַר
  choice: langoni
  rationale: “Lango” ni lango la mji, mahali pa kusikiliza kesi na kufanya maamuzi ya umma; neno lenyewe limedumishwa na maana yake ya kitamaduni imefafanuliwa katika tanbihi.
- source_word: עֶזְרָתִי
  choice: nina watu wa kuniunga mkono
  rationale: Ingawa maana halisi ni “msaada wangu,” katika mazingira ya lango usemi huu unaashiria watu wenye kumpa uungwaji mkono katika shughuli ya kisheria au ya umma.
