  text: Does he not see my ways and count all my steps?[a]
translation:
  language: sw
  text: Je, yeye haoni njia zangu na hahesabu hatua zangu zote?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, yeye hachunguzi mwenendo wangu na hahesabu hatua zangu zote?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... ha-
  rationale: Muundo wa swali pamoja na kikanushi huwasilisha swali la balagha linalotarajia jibu la kukubali.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru kimehifadhiwa ili kuonyesha msisitizo uliopo katika Kiebrania bila kuongeza maana ya ‘yeye mwenyewe.’
- source_word: יִרְאֶה
  choice: haoni
  rationale: Kitenzi ראה kimsingi ni ‘kuona’; neno hili linahifadhi taswira halisi ya uchunguzi wa Mungu bila kuibadili kuwa maelezo ya kimafundisho.
- source_word: דְרָכָי
  choice: njia zangu
  rationale: Wingi na sitiari ya Kiebrania zimehifadhiwa; ‘njia’ zinaweza kumaanisha mwenendo wa maisha pamoja na njia anazopita mtu.
- source_word: וְכָל
  choice: na ... zote
  rationale: Muunganiko wa vifungu na maana inayojumuisha kila hatua zimewasilishwa kwa muundo wa kawaida wa Kiswahili.
- source_word: צְעָדַי
  choice: hatua zangu
  rationale: ‘Hatua’ ni tafsiri ya kawaida na ya moja kwa moja inayohifadhi taswira ya mienendo au matendo ya mtu.
- source_word: יִסְפּוֹר
  choice: kuhesabu
  rationale: Kitenzi ספר humaanisha ‘kuhesabu’; tafsiri hii ni ya asili na haiongezi wazo la kufuatilia au kuhukumu ambalo halijaelezwa moja kwa moja.
theological_decisions:
- issue: Ujuzi wa Mungu unaoelezwa kwa lugha ya kibinadamu ya kuona na kuhesabu
  choice: Kuhifadhi swali la balagha linalothibitisha kwamba Mungu anaona njia za Ayubu na kuhesabu hatua zake.
  alternative: Je, yeye hachunguzi mwenendo wangu na kuweka hesabu ya matendo yangu yote?
  rationale: Kiebrania kinatumia taswira thabiti za kuona na kuhesabu. Tafsiri inazihifadhi bila kuzigeuza kuwa kauli ya kinadharia kuhusu ujuzi wote wa Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa ‘Je, ... haoni’ unabeba swali la balagha, huku ‘njia zangu’ na ‘hatua zangu’ zikihifadhi sitiari za Kiebrania.
