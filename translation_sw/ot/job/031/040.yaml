  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: sw
  text: 'Badala ya ngano, miiba iote; na badala ya shayiri, magugu yenye harufu mbaya.[a]


    Maneno ya Ayubu yamefikia mwisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “magugu mabaya” au “magugu yenye madhara”; aina kamili ya mmea unaotajwa kwa neno la Kiebrania haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika laana hii inayohusu mazao ya shambani, neno hili linaonyesha kitu kimoja kuchukua nafasi ya kingine, si mahali kilipo.
- source_word: חִטָּה
  choice: ngano
  rationale: Hili ndilo jina la kawaida la zao hili la nafaka katika Kiswahili.
- source_word: יֵצֵא
  choice: na iote
  rationale: Kitenzi kihalisi kina maana ya kutoka, lakini kinapotumiwa kuhusu mimea humaanisha kuota kutoka ardhini; muundo wa kutakia unaendeleza laana ya Ayubu.
- source_word: חוֹחַ
  choice: miiba
  rationale: Neno hili linataja kwa ujumla mimea yenye miiba inayodhuru; “miiba” ni ya asili na inaeleweka kwa urahisi.
- source_word: שְׂעֹרָה
  choice: shayiri
  rationale: Hili ndilo jina la kawaida la zao hili la nafaka.
- source_word: בָאְשָׁה
  choice: magugu yenye harufu mbaya
  rationale: Neno linaonekana kumaanisha mimea mibaya au yenye uvundo, lakini aina kamili ya mmea haijulikani; tafsiri hii huhifadhi uhusiano unaowezekana na harufu mbaya bila kudai utambulisho mahususi.
- source_word: תַּמּוּ
  choice: yamefikia mwisho
  rationale: Hii ni taarifa ya kufunga sehemu inayoonyesha kwamba maneno ya Ayubu yamekamilika.
- source_word: דִּבְרֵי אִיּוֹב
  choice: Maneno ya Ayubu
  rationale: Muundo huu wa moja kwa moja huhifadhi uzito na namna rasmi ya taarifa ya kufunga.
