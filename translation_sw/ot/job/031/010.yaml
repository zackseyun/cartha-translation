lexical_decisions:
- source_word: תִּטְחַן
  choice: amsagie
  rationale: Kitenzi טחן kimsingi humaanisha ‘kusaga,’ hasa nafaka. Tafsiri hii inadumisha picha halisi ya kazi ya hali ya chini, bila kufuta dokezo la kingono lililopo katika muktadha.
- source_word: לְאַחֵר
  choice: mwanamume mwingine
  rationale: אַחֵר humaanisha ‘mwingine.’ Neno ‘mwanamume’ linawekwa wazi kwa sababu muktadha unamhusu mke wa Ayubu akiwa na wanaume wengine.
- source_word: אִשְׁתִּי
  choice: mke wangu
  rationale: Hii ndiyo maana ya kawaida ya אִשָּׁה yenye kiambishi cha nafsi ya kwanza katika muktadha huu.
- source_word: וְעָלֶיהָ
  choice: juu yake
  rationale: Kihusishi עַל pamoja na kiambishi chake kinadumishwa kwa maana ya mahali, ‘juu yake,’ ili picha ya Kiebrania isilainishwe.
- source_word: יִכְרְעוּן
  choice: wapige magoti
  rationale: כרע kwa kawaida humaanisha ‘kupiga magoti’ au ‘kuinama.’ Hapa huenda ni lugha ya staha inayodokeza tendo la ngono; tafsiri kuu inadumisha picha halisi, huku tanbihi ikieleza maana inayowezekana.
- source_word: אֲחֵרִין
  choice: wanaume wengine
  rationale: Kivumishi hiki cha wingi wa kiume kimetumiwa kama nomino na katika muktadha kinawarejelea wanaume wengine.
theological_decisions:
- issue: Iwapo dokezo la tendo la ngono lielezwe wazi katika matini kuu
  choice: Kudumisha picha halisi ya ‘kusaga’ na ‘kupiga magoti juu yake’ katika matini kuu, na kueleza maana ya kingono katika tanbihi.
  alternative: basi mke wangu na amsagie mwingine, na wanaume wengine walale naye
  rationale: Kiebrania kinatumia vitenzi halisi ambavyo huenda vinafanya kazi kama lugha ya staha katika muktadha huu, lakini hakitumii kitenzi cha wazi cha kujamiiana. Kwa hiyo, tafsiri inadumisha taswira na utata wa matini huku tanbihi ikihifadhi uwezekano wa maana ya kingono.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘na amsagie’ unaonyesha laana au ombi la kuruhusu jambo litokee, huku ‘kusaga’ na ‘kupiga magoti juu yake’ zikidumisha taswira ya Kiebrania.
