base_translation:
  language: en
  yaml_path: translation/ot/job/031/027.yaml
  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: sw
  text: 'moyo wangu ukashawishika kwa siri,

    na mkono wangu ukabusu kinywa changu[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi unaoeleza tendo hilo katika muktadha, “na nikatuma busu kwa mkono wangu”—huenda ilikuwa ishara ya kutoa heshima iliyohusishwa na kuabudu mianga ya angani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: ukashawishika
  rationale: Kitenzi פתה hapa kinaonyesha moyo kuvutwa au kushawishiwa kwa ndani. ‘Ukashawishika’ huhifadhi hali hiyo bila kuongeza wazi mhusika aliyeshawishi.
- source_word: בַּסֵּתֶר
  choice: kwa siri
  rationale: Neno סתר lina maana ya usiri au hali ya kufichika; ‘kwa siri’ ni Kiswahili cha kawaida na huhifadhi wazo la jambo lililotokea kwa ndani na kwa kificho.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: לֵב humaanisha moyo au utu wa ndani, ikijumuisha nia na hisia; ‘moyo wangu’ ni tafsiri ya kawaida na wazi.
- source_word: וַתִּשַּׁק
  choice: ukabusu
  rationale: נשק kwa kawaida humaanisha ‘kubusu.’ Tafsiri kuu inadumisha tendo halisi lililotajwa badala ya kulifasiri moja kwa moja kuwa tendo la ibada.
- source_word: יָדִי
  choice: mkono wangu
  rationale: Tafsiri ya moja kwa moja inayohifadhi mkono kama sehemu iliyotumika katika ishara hiyo.
- source_word: לְפִי
  choice: kinywa changu
  rationale: Kihalisi ni ‘kwenda/kwenye kinywa changu.’ Baada ya ‘ukabusu,’ Kiswahili cha kawaida hakihitaji kurudia kihusishi, lakini taswira halisi ya kinywa inadumishwa.
theological_decisions:
- issue: Huenda tendo hili likawa ishara ya kuabudu jua au mwezi
  choice: Kudumisha tendo halisi la mwili katika maandishi makuu bila kuongeza wazi kwamba lilikuwa tendo la ibada ya sanamu.
  alternative: na mkono wangu ukatuma busu kuelekea juu kama ishara ya heshima
  rationale: Muktadha wa aya 26–28 unaonyesha kuwa huenda hii ilikuwa ishara ya heshima ya kidini kwa mianga ya angani. Hata hivyo, aya yenyewe inataja tendo hilo bila kulifafanua moja kwa moja kuwa ibada; kwa hiyo maana ya kitamaduni inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na heshima. ‘Ukashawishika’ huhifadhi mvuto wa ndani, na kishazi cha pili hudumisha taswira halisi ya Kiebrania huku tanbihi ikifafanua maana inayowezekana ya ishara hiyo.
