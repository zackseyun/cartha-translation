  text: 'ikiwa viuno vyake havikunibariki[b],

    na ikiwa hakupata joto kwa sufu ya kondoo wangu[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokana na sufu iliyokatwa ya kondoo wangu.” Neno la Kiebrania linaweza kumaanisha sufu ya kondoo au sufu iliyokatwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “viuno vyake”; huu ni usemi wa kimwili unaorejelea mwili wa mhitaji uliovikwa na kupatiwa joto.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: ikiwa ... havi-/haku-
  rationale: Muundo huu ni sehemu ya kiapo cha Ayubu na unaweka sharti lenye maana ya kujilaani ikiwa dai lake si kweli. Tafsiri inadumisha hali ya sharti badala ya kufafanua kiapo kilichodokezwa.
- source_word: בֵרֲכוּנִי
  choice: havikunibariki
  rationale: Kitenzi ברך katika piel kwa kawaida humaanisha ‘bariki.’ Ingawa hapa baraka inaonyesha shukrani ya mhitaji, ‘kunibariki’ inadumisha nahau na uzito wa Kiebrania.
- source_word: חֲלָצָיו
  choice: viuno vyake
  rationale: Neno hili hutaja viuno au sehemu ya kiuno; hapa linawakilisha mwili wa mhitaji uliovikwa na kupata joto. Tafsiri ya moja kwa moja inadumishwa, huku tanbihi ikieleza nahau hiyo.
- source_word: וּמִגֵּז
  choice: kwa sufu
  rationale: גֵּז inaweza kumaanisha manyoya ya kondoo au sufu iliyonyolewa. ‘Kwa sufu’ ni Kiswahili cha kawaida na huonyesha kitu kilichotumiwa kumpatia mhitaji joto.
- source_word: כְּבָשַׂי
  choice: ya kondoo wangu
  rationale: Katika muktadha wa kupata sufu, ‘kondoo wangu’ ni ya asili na sahihi kuliko ‘wanakondoo wangu.’
- source_word: יִתְחַמָּם
  choice: hakupata joto
  rationale: Hitpael ya חם huonyesha kupata au kujifanya mwenye joto. ‘Hakupata joto’ ni ya asili katika Kiswahili na inadumisha matokeo yanayokusudiwa.
