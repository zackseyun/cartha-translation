  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ֤י יִתֶּן לִ֨/י שֹׁ֘מֵ֤עַֽ לִ֗/י הֶן תָּ֭וִ/י שַׁדַּ֣י יַעֲנֵ֑/נִי וְ/סֵ֥פֶר כָּ֝תַ֗ב אִ֣ישׁ רִיבִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: sw
  text: Laiti ningepata mtu wa kunisikiliza! Tazama, hii ndiyo sahihi yangu[a]; Mwenyezi anijibu, na mshtaki wangu aandike hati ya mashtaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘alama yangu’ au ‘ishara yangu.’ Huenda Kiebrania kinamaanisha alama ambayo Ayubu ameweka kuthibitisha tamko lake.
    reason: lexical_alternative
  - marker: b
    text: Au kwa kufuata maneno ya Kiebrania kwa karibu zaidi, ‘na hati aliyoandika mtu wa shauri langu.’ Katika muktadha, maneno hayo yanaweza kueleweka kama tamanio la Ayubu kwamba mpinzani wake aandike rasmi mashtaka dhidi yake.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: Laiti ningekuwa na
  rationale: Nahau hii ya Kiebrania inaonyesha tamanio kubwa, si swali halisi la kuuliza ni nani atakayetoa. ‘Laiti’ ni usemi wa kawaida wa Kiswahili unaohifadhi hali hiyo ya kutamani.
- source_word: שֹׁמֵעַ לִי
  choice: mtu wa kunisikiliza
  rationale: Kirai hiki kinamtaja mtu ambaye angesikiliza hoja ya Ayubu. ‘Kunisikiliza’ ni cha asili katika Kiswahili na bado kinaweza kubeba maana ya kusikiliza kesi.
- source_word: הֶן
  choice: Tazama, hii ndiyo
  rationale: Neno hili linavuta fikira kwa kitu kinachowasilishwa. Kauli hii inafaa kwa Ayubu anapowasilisha alama yake kama uthibitisho.
- source_word: תָּוִי
  choice: sahihi yangu
  rationale: תָּוִי ni alama ya Ayubu ya kuthibitisha tamko lake. ‘Sahihi yangu’ huwasilisha kazi yake ya kisheria kwa msomaji wa leo, huku ‘alama yangu’ ikihifadhiwa katika tanbihi.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Hili ni jina la cheo cha Mungu linalosisitiza uwezo wake. ‘Mwenyezi’ ni tafsiri fupi, yenye heshima na iliyozoeleka katika Kiswahili.
- source_word: יַעֲנֵנִי
  choice: anijibu
  rationale: Katika mazingira ya kesi, kitenzi kinamaanisha kutoa jibu kwa dai au hoja ya Ayubu. ‘Anijibu’ ni cha moja kwa moja na huhifadhi sauti ya ombi.
- source_word: וְסֵפֶר
  choice: hati ya mashtaka
  rationale: סֵפֶר ni maandishi, hati au gombo. Katika muktadha huu wa kisheria, hati hiyo ina mashtaka dhidi ya Ayubu, kwa hiyo kazi yake imewekwa wazi bila kusisitiza tu umbo la kitu kilichoandikwa.
- source_word: כָּתַב
  choice: aandike
  rationale: 'Ingawa umbo la Kiebrania ni timilifu, katika mfululizo wa tamanio la Ayubu linaweza kueleweka kwa maana ya ombi: ‘aandike.’ Tanbihi inahifadhi muundo wa karibu zaidi wa Kiebrania.'
- source_word: אִישׁ רִיבִי
  choice: mshtaki wangu
  rationale: Maana halisi ni ‘mtu wa shauri/mzozo wangu.’ Katika picha ya mahakama, huyu ndiye anayetoa shtaka dhidi ya Ayubu; hivyo ‘mshtaki wangu’ huonyesha jukumu hilo kwa ufupi.
theological_decisions:
- issue: Picha ya mahakama katika ombi la Ayubu
  choice: 'Kutumia lugha ya wazi ya kisheria: ‘sahihi,’ ‘mshtaki,’ na ‘hati ya mashtaka.’'
  alternative: 'Kutumia maneno yaliyo karibu zaidi na umbo la Kiebrania: ‘alama yangu,’ ‘mtu wa shauri langu,’ na ‘hati/gombo.’'
  rationale: Muktadha unaonyesha Ayubu akitaka madai yake yasikilizwe rasmi na upande unaompinga uweke shtaka kwa maandishi. Lugha hii huonyesha picha iliyomo katika Kiebrania bila kuamua mapema haki ya upande wowote au kuingiza fundisho la dhehebu.
- issue: Utambulisho wa ‘mshtaki wangu’
  choice: Kutoufafanua kuwa ni Shetani, Mungu, au mtu mwingine kwa jina.
  alternative: Kumtambulisha mhusika kwa kuzingatia tafsiri fulani ya kifungu.
  rationale: Kiebrania kinamtaja tu kama ‘mtu wa shauri langu.’ Tafsiri inapaswa kuhifadhi kutotajwa huko na mvutano wa Ayubu kumwomba Mwenyezi ajibu huku pia akitaka hati kutoka kwa mpinzani wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Laiti’ huhifadhi sauti ya tamanio; ‘Tazama’ hudumisha uzito wa tamko; na istilahi za kisheria ni za sasa bila kuwa za kiufundi kupita kiasi.
