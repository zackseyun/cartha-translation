  text: בְּ֭רִית כָּרַ֣תִּי לְ/עֵינָ֑/י וּ/מָ֥ה אֶ֝תְבּוֹנֵ֗ן עַל בְּתוּלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/001.yaml
  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: sw
  text: Nimefanya agano na macho yangu; basi ningewezaje kumkodolea macho bikira?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini basi nimtazame bikira?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית כָּרַתִּי
  choice: Nimefanya agano
  rationale: Nahau ya Kiebrania, kihalisi ‘kukata agano,’ inaonyesha ahadi nzito na inayofunga; Kiswahili cha kawaida hutumia ‘kufanya agano.’ Wakati timilifu unaonyesha tendo lililokamilika lenye uzito unaoendelea.
- source_word: לְעֵינָי
  choice: na macho yangu
  rationale: Katika nahau hii, lamed inaweza kuonyesha yale yanayohusishwa katika agano. ‘Na macho yangu’ ni ya asili na inadumisha taswira ya Ayubu kuyatia macho yake chini ya wajibu huo.
- source_word: וּמָה
  choice: basi ningewezaje
  rationale: Muungano na kiulizi vinaonyesha matokeo ya agano lililotajwa. Tafsiri hii inabeba maana ya swali la balagha, ingawa Kiebrania pia kinaweza kueleweka kama ‘kwa nini basi.’
- source_word: אֶתְבּוֹנֵן
  choice: kumkodolea macho
  rationale: Kitenzi kinaashiria kutazama kwa makini au kwa kudumu, si kuona kwa muda mfupi tu. ‘Kumkodolea macho’ huwasilisha kutazama kwa makusudi katika muktadha huu wa maadili.
- source_word: עַל בְּתוּלָה
  choice: bikira
  rationale: עַל pamoja na kitenzi cha kutazama inaelekezwa kwa mlengwa wa mtazamo; בְּתוּלָה kwa kawaida humaanisha mwanamke ambaye hajafanya ngono. ‘Bikira’ ni neno la kawaida na sahihi katika Kiswahili.
theological_decisions:
- issue: Nguvu ya swali la balagha katika וּמָה
  choice: basi ningewezaje
  alternative: kwa nini basi nimtazame
  rationale: ‘Ningewezaje’ linaonyesha kutopatana kwa kitendo hicho na agano la Ayubu bila kuongeza madai ya kiteolojia. Tanbihi inadumisha uwezekano halisi wa kulisoma kama swali la ‘kwa nini.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Agano’ huhifadhi uzito wa בְּרִית, na ‘kumkodolea macho’ huonyesha mtazamo wa makusudi na wa kudumu bila kuingiza neno ‘kwa tamaa,’ ambalo halipo wazi katika mstari wa Kiebrania.
