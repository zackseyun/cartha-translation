lexical_decisions:
- source_word: אִם
  choice: ikiwa
  rationale: Hutanguliza kishazi cha masharti katika kiapo cha Ayubu cha kujitetea; “ikiwa” ni ya kawaida na inafaa mfululizo wa matendo anayoyakana.
- source_word: אֶרְאֶה
  choice: niliitazama
  rationale: Katika muktadha huu wa kiapo, hali ya wakati uliopita inafaa; “tazama” pia huonyesha kutazama kwa makusudi kuliko kuona tu.
- source_word: אוֹר
  choice: nuru
  rationale: Huhifadhi maana halisi ya Kiebrania, huku muktadha na ulinganifu na mwezi vikidokeza kwamba huenda nuru hiyo ni jua.
- source_word: כִּי יָהֵל
  choice: ilipong'aa
  rationale: כִּי huonyesha hali au wakati wa kuitazama nuru, na יָהֵל hueleza kutoa mwangaza; muundo huu ni wa asili katika Kiswahili.
- source_word: וְיָרֵחַ
  choice: au mwezi
  rationale: Kiunganishi kinaunganisha kitu cha pili kinachotazamwa; “au” huonyesha vizuri vipengele viwili vya sharti hilo.
- source_word: יָקָר
  choice: kwa fahari
  rationale: Katika uhusiano na mwezi, neno hili huonyesha uzuri wenye utukufu au uangavu wa kuvutia, si thamani ya bei.
- source_word: הֹלֵךְ
  choice: uliposonga
  rationale: Kitenzi hiki kinaeleza mwendo unaoendelea wa mwezi angani; “kusonga” ni Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Muktadha unaowezekana wa kuabudu mianga ya angani
  choice: Kuhifadhi taswira halisi ya nuru na mwezi bila kutaja ibada moja kwa moja katika mstari huu.
  alternative: Kutafsiri אוֹר kuwa “jua” ili kufanya muktadha wa kupinga ibada ya mianga ya angani uwe wazi zaidi.
  rationale: Mistari 27–28 huonyesha maana ya kuvutiwa na mianga ya angani kwa namna inayohusiana na ibada, lakini mstari wa 26 wenyewe unasema “nuru” na “mwezi.” Tafsiri inaacha muktadha utoe maana hiyo ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nuru” huhifadhi istilahi ya chanzo; “kwa fahari” na “uliposonga” huwasilisha taswira ya mwezi kwa lugha inayoeleweka bila kuifafanua kupita kiasi.
