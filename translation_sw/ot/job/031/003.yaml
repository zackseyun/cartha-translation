  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: sw
  text: Je, maangamizi si kwa mtu dhalimu,[a] na msiba kwa watenda maovu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu asiye haki.”
    reason: lexical_alternative
  - marker: b
    text: Au “janga kwa wale wanaotenda uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... si
  rationale: Muundo huu unahifadhi swali la balagha linalotarajia jibu la kukubali na ni wa kawaida katika Kiswahili sanifu.
- source_word: אֵיד
  choice: maangamizi
  rationale: Neno hili linaonyesha janga lenye kuharibu au uangamivu; “maangamizi” lina uzito unaofaa muktadha wa matokeo ya maadili.
- source_word: לְעַוָּל
  choice: kwa mtu asiye haki
  rationale: Umoja wa nomino ya Kiebrania unamtaja mtu mwenye sifa ya kutenda isivyo haki; tafsiri hii ni ya kawaida na haiongezi maelezo yasiyokuwamo.
- source_word: וְנֵכֶר
  choice: na msiba
  rationale: Katika usambamba na אֵיד, neno hili linaelekea kumaanisha tukio baya au janga. “Msiba” hutofautisha mshororo wa pili bila kuondoa usambamba.
- source_word: לְפֹעֲלֵי
  choice: kwa watenda
  rationale: Umbo la kishirikishi linaweza kuonyesha watu wanaojulikana kwa matendo hayo; “watenda” ni fupi, fasaha, na linafaa ushairi.
- source_word: אָוֶן
  choice: maovu
  rationale: Katika muktadha huu neno linamaanisha uovu wenye hatia ya kimaadili. “Maovu” ni la sasa, wazi, na lenye uzito wa kimaadili.
theological_decisions:
- issue: Istilahi za maadili katika fasihi ya hekima
  choice: Kuutafsiri mstari kama kanuni ya jumla ya mpangilio wa maadili bila kubainisha jinsi hukumu hiyo inavyotekelezwa.
  alternative: Kuutafsiri waziwazi kuwa adhabu ya Mungu ya moja kwa moja, au kuwa matokeo ya kawaida tu ya matendo.
  rationale: Kiebrania kinahusianisha maangamizi na mtu asiye haki, na msiba na watenda maovu, lakini mstari huu hauelezi ikiwa hayo ni adhabu ya Mungu ya moja kwa moja au matokeo katika mpangilio mpana wa maadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na mdundo wa kishairi. Swali la balagha na usambamba wa mistari miwili vimehifadhiwa.
