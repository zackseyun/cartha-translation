  text: מִסְפַּ֣ר צְ֭עָדַ/י אַגִּידֶ֑/נּוּ כְּמוֹ נָ֝גִ֗יד אֲקָרֲבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/037.yaml
  text: I would declare to him the number of my steps[c][b][a]; like a prince I would approach him.
translation:
  language: sw
  text: Ningemtangazia hesabu ya hatua zangu[a][b]; ningemkaribia kama mkuu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ningemweleza habari kamili ya hatua zangu.”
    reason: lexical_alternative
  - marker: b
    text: Kiambishi “-m-” kinaweza kumrejelea Mungu au mshtaki wa Ayubu katika muktadha wa karibu.
    reason: alternative_reading
  - marker: c
    text: Au, “mtawala” au “mtu mashuhuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: hesabu ya
  rationale: Nomino hii humaanisha idadi au hesabu. ‘Hesabu ya hatua zangu’ inadumisha taswira halisi ya Kiebrania huku ikiruhusu maana ya kutoa taarifa kamili ya mwenendo.
- source_word: צְעָדַי
  choice: hatua zangu
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa hatua za mtu, nalo linahifadhi pia taswira ya mwenendo wa maisha bila kuifafanua kupita maandishi.
- source_word: אַגִּידֶנּוּ
  choice: ningemtangazia
  rationale: Hifili ya נגד ina maana ya kutangaza, kueleza, au kujulisha. Umbo hili linadumisha sauti rasmi ya kujitetea na kiambishi cha nafsi ya tatu bila kumtaja anayerejelewa.
- source_word: כְּמוֹ
  choice: kama
  rationale: ‘Kama’ huwasilisha ulinganisho kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: נָגִיד
  choice: mkuu
  rationale: נָגִיד humaanisha kiongozi, mtawala, au mtu mwenye cheo. ‘Mkuu’ ni pana na ya heshima, na haibani maana kwenye cheo cha kifalme pekee.
- source_word: אֲקָרֲבֶנּוּ
  choice: ningemkaribia
  rationale: Kitenzi קרב hapa kinaonyesha kumjia au kumsogelea mtu. ‘Ningemkaribia’ ni kifupi, cha asili, na kinahifadhi kiambishi cha nafsi ya tatu.
theological_decisions:
- issue: Anayerejelewa na viambishi vya nafsi ya tatu katika ‘ningemtangazia’ na ‘ningemkaribia’
  choice: Viambishi vya Kiswahili vimeachwa vimrejelee ‘yeye’ bila kumtaja wazi.
  alternative: Mungu; mshtaki wa Ayubu
  rationale: Muktadha unataja hati ya mashtaka ya mpinzani na utayari wa Ayubu kujibu, lakini Kiebrania cha aya hii hakimtambulishi mhusika moja kwa moja. Tafsiri inadumisha uwazi huo na mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi na kimahakama lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa vishazi umewekwa wa asili katika Kiswahili, huku marudio ya kiambishi cha nafsi ya tatu na fumbo la mhusika yakihifadhiwa.
