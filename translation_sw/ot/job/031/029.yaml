  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: sw
  text: Ikiwa nilifurahia maangamizi ya yule anayenichukia[a], na nikashangilia mabaya yalipompata[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafa” au “janga” badala ya “maangamizi”; “yule anayenichukia” kwa kawaida pia hutafsiriwa “adui yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au “nikajisisimua mabaya yalipompata.” Katika muktadha huu neno hilo linaweza kudokeza kufurahia madhara yake kwa njia isiyofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Hutanguliza sharti katika kiapo cha Ayubu cha kujitetea kuwa hana hatia; “ikiwa” ni ya kawaida na huhifadhi muundo usiokamilika unaoendelea katika mstari unaofuata.
- source_word: אֶשְׂמַח
  choice: nilifurahia
  rationale: Kitenzi שׂמח huonyesha kufurahi; wakati uliopita unafaa kwa Ayubu anapochunguza mwenendo wake wa zamani ndani ya kauli ya sharti.
- source_word: בְּפִיד
  choice: maangamizi
  rationale: פִיד humaanisha janga, maafa, au anguko lenye uharibifu. “Maangamizi” huhifadhi uzito wa neno bila kulifanya liwe tu tukio baya la kawaida.
- source_word: מְשַׂנְאִי
  choice: ya yule anayenichukia
  rationale: Umbo la kirai nomino kutoka katika kitenzi linamaanisha kihalisi “anayenichukia”; tafsiri hii huhifadhi nguvu ya kitenzi kuliko kutumia tu “adui yangu.”
- source_word: וְהִתְעֹרַרְתִּי
  choice: au nikashangilia
  rationale: Katika muktadha huu kitenzi kinaonyesha kusisimka au kujiamsha kihisia kwa furaha. “Nikashangilia” ni Kiswahili cha asili kinachoonyesha furaha iliyodhihirishwa bila kuongeza moja kwa moja wazo kali la kufurahia kwa nia mbaya.
- source_word: כִּי
  choice: yalipo-
  rationale: 'כִּי hapa inaeleweka vizuri kama kiunganishi cha wakati: kushangilia kungetokea mabaya yalipompata mtu huyo.'
- source_word: מְצָאוֹ רָע
  choice: mabaya yalipompata
  rationale: מצא pamoja na רָע huonyesha mabaya au madhara yanayomfikia mtu. “Yalipompata” ni ya kawaida katika Kiswahili na huhifadhi kwa kiasi taswira ya Kiebrania ya mabaya kumfikia mtu.
theological_decisions:
- issue: Maana ya kimaadili ya Ayubu kukana kufurahia anguko la anayemchukia
  choice: Kutafsiri kama kukana kufurahia na kushangilia maangamizi ya anayemchukia, bila kutumia katika matini kuu neno linalosisitiza mno furaha ya nia mbaya.
  alternative: Ikiwa nilifurahia maafa ya adui yangu na kufurahia kwa nia mbaya mabaya yalipompata
  rationale: Kiebrania kinadokeza furaha isiyofaa kwa madhara ya mwingine, lakini hakilazimishi neno kali zaidi katika matini kuu. Tafsiri huhifadhi uzito wa kimaadili bila kuongeza maana ya kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. Mstari umeachwa na alama ya mkato mrefu kwa sababu sharti la kiapo linaendelea katika mstari unaofuata.
