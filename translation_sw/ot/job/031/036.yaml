lexical_decisions:
- source_word: אִם לֹא
  choice: Hakika
  rationale: Katika muktadha huu wa kiapo, msemo huu unaonyesha uthibitisho wenye msisitizo, si sharti la kawaida.
- source_word: עַל שִׁכְמִי
  choice: begani mwangu
  rationale: Huhifadhi umoja wa neno la Kiebrania na picha ya kubeba hati au shtaka waziwazi begani.
- source_word: אֶשָּׂאֶנּוּ
  choice: ningeibeba
  rationale: Kitenzi נשׂא hapa kina maana ya kubeba; umbo la masharti linafaa muktadha wa kauli ya Ayubu kuhusu jambo ambalo angefanya.
- source_word: אֶעֶנְדֶנּוּ
  choice: ningejifunga nayo
  rationale: Kitenzi ענד humaanisha kufunga au kuvaa kitu, hasa pambo. Tafsiri hii huhifadhi picha ya kukifunga mwilini bila kuibadili kuwa pambo tu.
- source_word: עֲטָרוֹת
  choice: kama taji
  rationale: Ingawa umbo la Kiebrania ni la wingi, huenda ni wingi wa msisitizo au ni rejeo la pambo lenye sura ya taji. Umoja unasikika kwa kawaida katika Kiswahili, huku umbo la asili likielezwa katika tanbihi.
- source_word: לִי
  choice: -ji- katika “ningejifunga”
  rationale: Kiwakilishi hiki, pamoja na ענד, kinaonyesha kuwa Ayubu angejifunga au angejivika kitu hicho mwenyewe; Kiswahili huwasilisha maana hiyo kwa kiambishi rejeshi -ji-.
