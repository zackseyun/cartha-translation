  text: Hakika ningeibeba begani mwangu; ningeivaa kama taji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “mataji” (wingi); huenda wingi huo unatumiwa kwa msisitizo, hivyo “kama taji.”
