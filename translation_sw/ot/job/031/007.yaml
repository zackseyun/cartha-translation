base_translation:
  language: en
  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: sw
  text: Ikiwa hatua yangu imepotoka kutoka kwenye njia, na moyo wangu umefuata macho yangu, na doa lolote limeshikamana na mikono yangu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waa lolote” au “kasoro yoyote.” Neno la Kiebrania linaweza kumaanisha doa, waa, au kasoro.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה אַשֻּׁרִי
  choice: hatua yangu imepotoka
  rationale: Kitenzi נטה kinaonyesha kugeuka au kukengeuka, na אַשֻּׁרִי ni ‘hatua yangu.’ ‘Imepotoka’ huhifadhi picha ya kuacha mwenendo unaofaa na inasikika kwa kawaida katika Kiswahili.
- source_word: מִנִּי הַדָּרֶךְ
  choice: kutoka katika njia
  rationale: Huhifadhi taswira halisi ya njia inayotumiwa kueleza mwenendo wa kimaadili bila kuibadili kuwa maelezo ya moja kwa moja.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: na moyo wangu umefuata macho yangu
  rationale: 'Tafsiri hii huhifadhi mpangilio na taswira ya Kiebrania: tamaa na maamuzi ya ndani yanafuata kile ambacho macho yameona.'
- source_word: לִבִּי
  choice: moyo wangu
  rationale: ‘Moyo’ huhifadhi lugha ya kibiblia kuhusu utu wa ndani, ikijumuisha nia, tamaa na maamuzi, badala ya kuifupisha kuwa ‘akili.’
- source_word: וּבְכַפַּי דָּבַק
  choice: limeshikamana na mikono yangu
  rationale: דבק ni kushikamana au kuganda. ‘Mikono’ ni ya kawaida zaidi hapa kuliko ‘viganja’ na hudumisha picha ya uchafu wa kimaadili unaoambatana na matendo.
- source_word: מֻאוּם
  choice: waa lolote
  rationale: מֻאוּם inaweza kuwa doa, kasoro au waa. ‘Waa’ linaweza kueleza uchafu unaoonekana na pia lawama ya kimaadili, hivyo linafaa katika muktadha huu.
theological_decisions:
- issue: Taswira ya kimaadili ya ‘njia’
  choice: Kudumisha ‘njia’ kama taswira halisi
  alternative: Kuitafsiri moja kwa moja kuwa ‘mwenendo mwadilifu’
  rationale: Kiebrania kinatumia safari na njia kueleza uadilifu. Kudumisha taswira hiyo huhifadhi uzito wa kifasihi na kuepuka kuongeza ufafanuzi usiotajwa wazi.
- issue: Uhusiano wa moyo na macho
  choice: Kudumisha ‘moyo wangu umefuata macho yangu’
  alternative: ‘Tamaa yangu imefuata nilichokiona’
  rationale: Lugha halisi ya moyo na macho huhifadhi mvutano wa kifasihi kati ya kuona na kutamani bila kufungia maana katika tafsiri moja ya kisaikolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sharti umeachwa wazi kwa ‘ikiwa’ kwa sababu mstari huu ni sehemu ya kiapo chenye matokeo yanayotajwa katika mstari unaofuata.
