  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: sw
  text: basi nipande, na mwingine ale, na wazao wangu wang'olewe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mazao yangu yang'olewe.” Neno la Kiebrania צֶאֱצָא linaweza kumaanisha kile kinachochipuka, yaani wazao au mazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: nipande
  rationale: 'Kauli ya kohortativi katika muktadha wa kiapo cha kujilaani inaonyeshwa kwa hali ya kutakia: “nipande.”'
- source_word: וְאַחֵר
  choice: na mwingine
  rationale: Huhifadhi utofauti wa moja kwa moja kati ya Ayubu anayepanda na mtu mwingine anayenufaika.
- source_word: יֹאכֵל
  choice: ale
  rationale: Tafsiri halisi na ya kawaida ya אכל, ikidumisha picha ya kilimo na kula mavuno.
- source_word: וְצֶאֱצָאַי
  choice: na wazao wangu
  rationale: צֶאֱצָא inaweza kumaanisha wazao au kile kinachochipuka kama mazao. “Wazao wangu” hudumisha maana ya kifamilia inayowezekana huku tanbihi ikihifadhi uwezekano wa maana ya kilimo.
- source_word: יְשֹׁרָשׁוּ
  choice: wang'olewe
  rationale: Huwasilisha maana ya kuondolewa kwa mizizi kwa Kiswahili cha kawaida, na huhifadhi picha ya mzizi inayoweza kutumiwa kuhusu watu au mazao.
theological_decisions:
- issue: Je, צֶאֱצָאַי inarejelea wazao au mazao?
  choice: wazao wangu
  alternative: mazao yangu
  rationale: Maana ya kifamilia inawezekana sana kwa nomino yenye kiambishi cha nafsi katika kiapo hiki, lakini ulinganifu wa kilimo unaacha maana ya “mazao” ikiwa halali; kwa hiyo utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi unahifadhi nguvu ya kiapo cha kujilaani na picha halisi ya kupanda, kula, na kung'olewa kwa mizizi.
