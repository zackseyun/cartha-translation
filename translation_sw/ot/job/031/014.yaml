  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: sw
  text: Ningefanya nini Mungu atakapoinuka? Na atakaponitaka nitoe hesabu[a], ningemjibu nini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakaponitembelea” au “atakaponichunguza.” Kitenzi cha Kiebrania kinaweza kumaanisha kutembelea, kukagua, au kumwita mtu atoe hesabu; katika muktadha huu maana ya kuwajibishwa ndiyo inayofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה אֶעֱשֶׂה
  choice: Nami ningefanya nini
  rationale: Kiunganishi וּ־ na kiulizi מָה vinaendeleza hoja kwa swali la kujichunguza. Hali ya -nge- inaonyesha jambo linalotazamiwa katika mazingira ya kinadharia, huku אֶעֱשֶׂה ikitafsiriwa kwa kitenzi cha kawaida 'kufanya'.
- source_word: כִּי יָקוּם אֵל
  choice: Mungu atakapoinuka
  rationale: כִּי inaeleweka kwa maana ya wakati katika muktadha huu. 'Atakapoinuka' inadumisha taswira halisi ya קום ya Mungu kuinuka ili kutenda, bila kuifafanua kupita kiasi kuwa hukumu maalumu.
- source_word: וְכִי יִפְקֹד
  choice: Naye atakaponiita nitoe hesabu
  rationale: פקד inaweza kumaanisha kutembelea, kukagua, au kumwajibisha mtu. Sambamba na swali la kile Ayubu atakachomjibu Mungu, msemo 'kuniita nitoe hesabu' unawasilisha kwa Kiswahili cha kawaida wazo la uwajibikaji wa kimahakama.
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: ningemjibu nini
  rationale: Hifili ya שוב hapa ina maana ya kurudisha jibu, yaani kujibu; kiambishi cha nafsi ya tatu umoja wa kiume kinawakilishwa na '-m-' katika 'ningemjibu'.
theological_decisions:
- issue: Taswira ya Mungu kama hakimu
  choice: Mungu anaonyeshwa akiinuka na kumwita Ayubu atoe hesabu, bila kusema kuwa hii ni hukumu ya mwisho.
  alternative: Kutafsiri פקד kwa ujumla zaidi kuwa Mungu 'anatembelea' au 'anakagua,' au kuifanya ihusu moja kwa moja hukumu ya mwisho.
  rationale: Muktadha wa kujibu mbele za Mungu unaunga mkono wazo la uchunguzi na uwajibikaji. Hata hivyo, mstari hautaji hukumu ya mwisho kwa namna mahsusi, kwa hiyo tafsiri haiongezi ufafanuzi huo wa kidogma.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Kutoa hesabu' ni msemo wa kawaida wa uwajibikaji; urudiaji wa maswali unahifadhi mkazo wa kishairi na sauti ya Ayubu ya kujichunguza.
