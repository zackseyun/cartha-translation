  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: sw
  text: 'ikiwa nilikula tonge langu peke yangu,

    wala mtoto asiye na baba[a] hakula kutoka katika tonge hilo—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yatima.” Kiebrania humaanisha hasa mtu asiye na baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹכַל
  choice: ikiwa nilikula
  rationale: Ingawa וְ ni kiunganishi, muktadha wa viapo vya kujilaani katika Ayubu 31 unaonyesha kuwa huu ni mwanzo wa kisharti; kwa hiyo “ikiwa” huwasilisha kazi yake katika sentensi.
- source_word: פִּתִּי
  choice: kipande changu
  rationale: פַּת humaanisha kipande au tonge la chakula, mara nyingi mkate. “Kipande changu” huhifadhi picha halisi bila kulazimisha maana ya mkate.
- source_word: לְבַדִּי
  choice: peke yangu
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili ya kueleza kula akiwa mwenyewe au bila kushirikisha wengine.
- source_word: וְלֹא אָכַל
  choice: wala ... hakula
  rationale: “Wala” huunganisha kishazi hasi cha pili na kishazi cha kwanza ndani ya sharti lilelile, huku “hakula” ikiwakilisha kitenzi timilifu cha nafsi ya tatu umoja.
- source_word: יָתוֹם
  choice: mtoto asiye na baba
  rationale: Neno la Kiebrania humaanisha hasa mtu aliyekosa baba na kusisitiza hali yake ya kijamii ya kutokuwa na mlinzi; tafsiri hii ni sahihi kuliko “yatima” peke yake, ambalo katika Kiswahili linaweza kumaanisha aliyefiwa na mzazi mmoja au wote wawili.
- source_word: מִמֶּנָּה
  choice: sehemu yake
  rationale: Kihalisi ni “kutoka katika hicho,” ikirejelea kipande cha chakula. Katika Kiswahili, “hakula sehemu yake” hutoa kwa kawaida wazo la kushirikishwa katika kipande hicho bila kutumia muundo mgumu usio wa kawaida.
