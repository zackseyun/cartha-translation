  rationale: Neno linaweza kumaanisha ubatili, kutokuwa na maana, au uongo; sambamba na ‘udanganyifu’ hapa, maana ya kimaadili ya ‘uongo’ inafaa zaidi.
- source_word: וַתַּחַשׁ
  choice: umeharakia
  rationale: Hutoa maana ya kufanya haraka na kuhifadhi taswira ya kishairi inayoufanya mguu kuwa kama mtendaji.
- source_word: עַל
  choice: kuelekea, iliyomo katika kitenzi ‘umeharakia’
  rationale: Pamoja na kitenzi cha mwendo, kihusishi hiki kinaweza kuonyesha mwelekeo kuelekea lengo; Kiswahili ‘umeharakia udanganyifu’ hutoa maana hiyo kwa ufupi.
- source_word: מִרְמָה
  choice: udanganyifu
  rationale: Huonyesha mwenendo wa kudanganya bila kuufanya kuwa hasa ulaghai wa kibiashara au usaliti.
- source_word: רַגְלִי
  choice: mguu wangu
  rationale: Huhifadhi umoja wa Kiebrania na taswira ya kishairi ya mguu unaoelekea katika kosa.
