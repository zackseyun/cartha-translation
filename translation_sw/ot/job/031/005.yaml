lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Huanzisha sharti katika kiapo cha Ayubu cha kujitetea bila kuongeza mkazo usio wazi katika Kiebrania.
- source_word: הָלַכְתִּי
  choice: nimetembea
  rationale: Huhifadhi picha halisi ya kutembea, ambayo hapa pia ni nahau ya mwenendo wa maisha.
- source_word: עִם
  choice: na
  rationale: Huonyesha kuambatana au kushirikiana na uongo, sawasawa na maana ya msingi ya kihusishi cha Kiebrania.
- source_word: שָׁוְא
