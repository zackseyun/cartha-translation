  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: sw
  text: Hilo pia lingekuwa hatia ya kuhukumiwa na waamuzi[a], kwa maana ningekuwa nimemkana Mungu aliye juu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatia inayoadhibiwa na waamuzi,” “kosa la kimahakama,” au “hatia ya kuletwa hukumuni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ningekuwa nimekosa uaminifu kwa Mungu aliye juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Hilo pia
  rationale: Hurejelea tendo lililotajwa katika mstari uliotangulia na kuliongeza katika orodha ya matendo ambayo Ayubu anakana kuwa alifanya.
- source_word: עָוֺן
  choice: hatia
  rationale: Neno hili lina uzito wa kimaadili na wa kisheria; “hatia” linafaa katika muktadha huu wa hukumu.
- source_word: פְּלִילִי
  choice: ya kuhukumiwa na waamuzi
  rationale: Huwasilisha maana ya kosa linalohusika na uamuzi wa kisheria, huku maelezo mafupi yakihifadhi njia nyingine za kulielewa.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya tendo hilo kuhesabiwa kuwa hatia.
- source_word: כִחַשְׁתִּי
  choice: ningekuwa nimemkana
  rationale: Katika muktadha wa kuabudu viumbe vya mbinguni, kitenzi kinaonyesha kumkana Mungu au kukosa uaminifu kwake; hali ya masharti inatokana na mfululizo wa kauli za kudhania katika sura hii.
- source_word: לָאֵל
  choice: Mungu
  rationale: Kiswahili hutumia moja kwa moja “kumkana Mungu,” bila kuhitaji kuonyesha kihusishi cha Kiebrania.
- source_word: מִמָּעַל
  choice: aliye juu
  rationale: Hudumisha usemi mfupi wa Kiebrania na utofauti wake na vitu vya angani vilivyotajwa katika muktadha, bila kuongeza waziwazi neno “mbinguni.”
theological_decisions:
- issue: Iwapo מִמָּעַל ipanuliwe kuwa “Mungu aliye mbinguni juu”
  choice: Mungu aliye juu
  alternative: Mungu aliye mbinguni juu; Mungu wa huko juu
  rationale: Kiebrania ni kifupi. “Mungu aliye juu” huhifadhi taswira ya mahali na utofauti na mianga ya angani bila kuingiza neno lisilosemwa wazi katika chanzo.
- issue: Iwapo כִחַשְׁתִּי itafsiriwe kama kukana au kukosa uaminifu
  choice: nimemkana
  alternative: nimekosa uaminifu kwa
  rationale: Muktadha wa ibada ya sanamu unaunga mkono maana ya kumkana Mungu, lakini uwezekano wa maana ya kutokuwa mwaminifu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo wa masharti umehifadhiwa ili ulingane na hoja ya Ayubu katika muktadha.
