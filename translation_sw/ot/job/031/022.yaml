  text: basi bega langu na lianguke kutoka mahali pake[a], na mkono wangu uvunjike kutoka kwenye mfupa wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwenye bega.” Kiebrania huenda kinaeleza bega likitoka kwenye kiungo chake.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka kwenye kiungo chake.” Neno la Kiebrania hapa ni adimu na huenda linamaanisha mfupa au kiungo cha mkono.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: bega langu
  rationale: כָּתֵף kwa kawaida humaanisha bega au upande wa bega; hapa ni sehemu ya mwili inayolingana kwa usambamba na ‘mkono wangu.’
- source_word: מִשִּׁכְמָה
  choice: kutoka mahali pake
  rationale: שִׁכְמָה hutaja eneo la bega au sehemu ambako bega limeungana. Kiswahili ‘kutoka mahali pake’ kinawasilisha picha ya bega kuteguka bila kulazimisha maana moja ya neno hili lisilo wazi kabisa.
- source_word: תִפּוֹל
  choice: na lianguke
  rationale: Kitenzi נפל humaanisha ‘kuanguka.’ Muundo huu unadumisha taswira halisi ya laana huku muktadha ukidokeza kutenguka kwa bega.
- source_word: וְאֶזְרֹעִי
  choice: na mkono wangu
  rationale: זְרוֹעַ humaanisha mkono, hasa sehemu ya mkono kuanzia begani; ‘mkono wangu’ ndiyo lugha ya kawaida na ya asili katika Kiswahili.
- source_word: מִקָּנָה
  choice: kwenye mfupa wake
  rationale: קָנֶה ni neno adimu katika matumizi haya ya kimaumbile. Muktadha na usambamba vinaelekeza kwenye mfupa au kiungo cha mkono; ‘mfupa wake’ huhifadhi taswira halisi huku uwezekano mwingine ukitajwa katika tanbihi.
- source_word: תִשָּׁבֵר
  choice: uvunjike
  rationale: Nifali ya שׁבר ina maana ya kuvunjika; ‘uvunjike’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Muundo wa matakwa ‘na lianguke … uvunjike’ unafaa kwa laana ya kujitakia katika muktadha. Tanbihi zimehifadhi utata wa istilahi mbili za kimaumbile.
