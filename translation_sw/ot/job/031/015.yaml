base_translation:
  language: en
  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: sw
  text: Je, yeye aliyenifanya tumboni hakumfanya yeye pia? Je, si mmoja alituumba tumboni?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, yeye aliyenifanya tumboni hakumfanya yeye pia, na kutuumba katika tumbo moja?” Kiebrania kinaweza pia kueleweka kwamba “mmoja” ni sifa ya “tumbo,” yaani “tumbo lilelile,” ikisisitiza asili yao ya pamoja kama wanadamu, si lazima kwamba walikuwa na mama mmoja.
    reason: Kiebrania kinaruhusu אֶחָד (“mmoja”) kueleweka ama kama kiima cha kitenzi “alituumba” ama pamoja na “tumbo.”
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... haku-
  rationale: Huanzisha swali la balagha linalotarajia jibu la ndiyo; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בַבֶּטֶן
  choice: tumboni
  rationale: Katika muktadha huu neno linamaanisha tumbo la uzazi, mahali ambapo mtoto huumbwa kabla ya kuzaliwa.
- source_word: עֹשֵׂנִי
  choice: yeye aliyenifanya
  rationale: Huhifadhi umbo la kishiriki lenye maana ya ‘yule aliyenifanya’ badala ya kulibadili kuwa jina la cheo kama ‘Muumba wangu.’
- source_word: עָשָׂהוּ
  choice: hakumfanya huyo pia
  rationale: Kiwakilishi cha umoja kinamrejelea mtumishi wa kiume katika muktadha uliotangulia; ‘pia’ huonyesha ulinganifu wa wazi na kufanywa kwa Ayubu.
- source_word: וַיְכֻנֶנּוּ
  choice: na kutuumba sisi
  rationale: Kitenzi kina wazo la kutengeneza au kuumba tumboni, na kiambishi chake kinaeleweka vizuri kuwa nafsi ya kwanza wingi. ‘Sisi’ kimesisitizwa ili kuonyesha kwamba Ayubu na mtumishi wake wote wanahusika.
- source_word: בָּרֶחֶם
  choice: katika tumbo
  rationale: Neno hili humaanisha hasa tumbo la uzazi; ‘katika tumbo’ linafaa kwa picha ya uumbaji kabla ya kuzaliwa.
- source_word: אֶחָד
  choice: moja
  rationale: Tafsiri ya moja kwa moja huhifadhi usemi mfupi wa kishairi kuhusu asili ya pamoja, huku tanbihi ikieleza uwezekano mwingine wa kisintaksia.
theological_decisions:
- issue: Mhusika anayerejelewa na kiwakilishi cha umoja
  choice: ‘huyo’ anamrejelea mtumishi wa kiume wa Ayubu katika muktadha wa karibu.
  alternative: Kauli inaweza kutumiwa kwa upana kuhusu mwanadamu mwingine yeyote.
  rationale: Ayubu 31:13–14 inazungumzia watumishi wake wa kiume na wa kike. Mstari huu unaweka msingi wa maadili katika ukweli kwamba yeye na mtumishi wake waliumbwa na Muumba yuleyule, bila kupanua tafsiri kuu kuwa ufafanuzi wa jumla.
- issue: Maana ya ‘katika tumbo moja’
  choice: Usemi wa kishairi umehifadhiwa ili kusisitiza asili ya pamoja na usawa wao kama viumbe.
  alternative: ‘Je, si mmoja aliyetuumba tumboni?’
  rationale: Kiebrania kinaweza kuhusisha אֶחָד na ‘tumbo’ au kulifanya kuwa kiima cha kitenzi cha pili. Tafsiri kuu inafuata uwezekano wa kwanza lakini tanbihi huhifadhi wa pili; haisisitizi kwamba Ayubu na mtumishi wake walikuwa na mama mmoja kibayolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kishairi lakini kinachoeleweka kwa urahisi. ‘Huyo’ hudumisha rejeo la mtu wa tatu katika muktadha, na ‘sisi’ huweka wazi kiambishi cha wingi kilichomo katika Kiebrania.
