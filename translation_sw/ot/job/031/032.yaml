  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: sw
  text: Mgeni hakulala nje; nilimfungulia msafiri milango yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחוּץ
  choice: nje
  rationale: Neno hili humaanisha kuwa nje au mahali pa wazi; “nje” ni Kiswahili cha kawaida na cha moja kwa moja katika muktadha huu.
- source_word: יָלִין
  choice: hakulala
  rationale: Kitenzi kinahusu kukaa au kulala usiku. “Hak睡ulala” kwa kawaida hueleweka kuwa hakupitisha usiku huko na ni cha asili katika Kiswahili.
- source_word: גֵּר
  choice: mgeni
  rationale: גֵּר humaanisha mtu asiye mwenyeji anayeishi au kukaa miongoni mwa wengine. “Mgeni” ni neno linaloeleweka kwa urahisi, ingawa haliwakilishi kikamilifu hadhi ya kijamii ya neno la Kiebrania.
- source_word: דְּלָתַי
  choice: milango yangu
  rationale: Umbo la Kiebrania ni wingi lenye kiambishi cha nafsi ya kwanza umoja; “milango yangu” huhifadhi wingi huo na taswira ya ukarimu.
- source_word: לָאֹרַח
  choice: wasafiri
  rationale: אֹרַח hapa humrejelea mtu aliye safarini. Wingi wa jumla “wasafiri” unaendana kwa kawaida na “milango” na unaonyesha desturi ya Ayubu ya kuwakaribisha watu wa njiani.
- source_word: אֶפְתָּח
  choice: niliwafungulia
  rationale: Ingawa umbo ni la imperfect, katika utetezi wa Ayubu linaeleza tendo la kawaida la wakati uliopita. “Niliwafungulia” huwasilisha tendo hilo kwa Kiswahili cha asili.
