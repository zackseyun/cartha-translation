  text: אִם אֶ֭שְׂמַח כִּי רַ֣ב חֵילִ֑/י וְ/כִֽי כַ֝בִּ֗יר מָצְאָ֥ה יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: sw
  text: ikiwa nilifurahi kwa sababu utajiri wangu ulikuwa mwingi, na kwa sababu mkono wangu ulikuwa umepata mengi[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkono wangu ulikuwa umejipatia mengi.” Kiebrania husema kihalisi, “mkono wangu ulikuwa umepata makubwa/mengi,” yaani, kupata mali kwa uwezo au juhudi za mtu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ikiwa
  rationale: Hutanguliza sharti katika kiapo cha Ayubu cha kujitetea; “ikiwa” ni ya kawaida na huendeleza sentensi inayokamilishwa na laana katika muktadha mpana.
- source_word: אֶשְׂמַח
  choice: nilifurahi
  rationale: Huonyesha kufurahia au kupendezwa; hapa uzito wa kimaadili uko katika kufurahia utajiri, si kuwa nao tu.
- source_word: כִּי רַב חֵילִי
  choice: kwa sababu utajiri wangu ulikuwa mwingi
  rationale: כִּי ina maana ya kisababishi, רַב huonyesha wingi, na חֵילִי katika muktadha huu ni mali au utajiri.
- source_word: וְכִי כַבִּיר
  choice: na kwa sababu ... mengi
  rationale: Hudumisha ulinganifu wa vifungu viwili vya sababu; כַבִּיר hapa huonyesha kiasi kikubwa.
- source_word: מָצְאָה יָדִי
  choice: mkono wangu ulikuwa umepata
  rationale: Hudumisha taswira halisi ya Kiebrania, “mkono wangu ulipata,” huku ikieleweka kwa Kiswahili kuwa ni kile ambacho mtu amejipatia kwa uwezo au juhudi zake.
theological_decisions:
- issue: Je, mstari unalaumu utajiri wenyewe au kufurahia na kutegemea mali nyingi ambazo mtu amejipatia?
  choice: Tafsiri inaonyesha Ayubu akikana kwamba alifurahi kwa sababu ya wingi wa utajiri wake na kwa sababu mkono wake mwenyewe ulikuwa umepata mengi.
  alternative: Tafsiri pana zaidi ingeweza kudokeza kwamba kuwa na utajiri pekee ndilo kosa.
  rationale: Kiebrania kinakazia sababu ya furaha na taswira ya “mkono wangu,” hivyo hakidai kwamba mali yenyewe ni ovu; kinahifadhi mvutano kuhusu kujivunia au kutegemea mafanikio binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kiapo umeachwa wazi kwa kistari cha mwisho kwa kuwa sentensi inaendelea katika mistari inayofuata. Taswira ya “mkono wangu” imehifadhiwa badala ya kufafanuliwa kabisa.
