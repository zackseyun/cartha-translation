translation:
  language: sw
  text: Kwa maana tangu ujana wangu yatima alikulia nami kama kwa baba[a]; nami tangu tumboni mwa mama yangu nilimwongoza mjane[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania cha kishazi hiki ni kigumu. Tafsiri ya “yatima alikulia nami kama kwa baba” hufuata muktadha wa mistari inayozungumzia yatima. Kwa kufuata umbo la maneno kwa karibu zaidi, kinaweza pia kueleweka, “alinilea kama baba,” au, kwa usomaji mwingine, “nilimlea kama baba.”
    reason: alternative_reading
  - marker: b
    text: Neno “mjane” halitajwi tena katika Kiebrania; kiambishi cha yambwa cha kike katika kitenzi cha Kiebrania cha “nilimwongoza” yaelekea kinamrejelea mjane wa mstari wa 16.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: kwa maana
  rationale: Inaonyesha sababu ya kauli ya Ayubu katika muktadha, si kiapo cha kusisitiza.
- source_word: מִנְּעוּרַי
  choice: tangu ujana wangu
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya muda unaoanzia ujana.
- source_word: גְּדֵלַנִי
  choice: alikua chini ya uangalizi wangu
  rationale: Maandishi ya Kiebrania yana umbo gumu lenye kiambishi cha nafsi ya kwanza umoja; katika muktadha wa kumtunza yatima, kauli hii huwasilisha kwamba yatima alikua Ayubu akimtendea kama baba, bila kutumia tafsiri isiyo ya kawaida kwamba yatima ndiye aliyemlea Ayubu.
- source_word: כְאָב
  choice: kama chini ya baba
  rationale: Huhifadhi ulinganisho wa כְּ na kuunganika kwa kawaida na wazo la kukua chini ya uangalizi wa Ayubu.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: nami tangu tumboni mwa mama yangu
  rationale: Huhifadhi usemi wa Kiebrania unaoonyesha mwanzo wa mapema kabisa wa mwenendo huo.
- source_word: אַנְחֶנָּה
  choice: nilimwongoza
  rationale: Hiphil ya נחה pamoja na kiambishi cha kike umoja ina maana ya kumwongoza au kumwelekeza; kiwakilishi kimetajwa wazi kwa kurejelea mjane wa mstari uliotangulia.
theological_decisions:
- issue: Mhusika na mwelekeo wa tendo katika kishazi cha kwanza
  choice: Yatima alikua chini ya uangalizi wa Ayubu kama chini ya baba.
  alternative: Yatima alimlea Ayubu kama baba; au Ayubu alimlea yatima kama baba.
  rationale: Umbo גְּדֵלַנִי ni gumu na, likichukuliwa kwa ukali wa kimofolojia, linaweza kueleweka 'alinikuza/alinilea.' Hata hivyo muktadha wa Ayubu 31:17–18 unahusu Ayubu kumtunza yatima. Tafsiri kuu inaweka maana hiyo ya kimuktadha huku tanbihi ikihifadhi ugumu na uwezekano wa tafsiri ya moja kwa moja.
- issue: Kubadilika kwa mrejelewa ndani ya mstari
  choice: Kishazi cha kwanza kinamrejelea yatima, na cha pili kinamrejelea mjane.
  alternative: Vishazi vyote viwili vinaweza kuchukuliwa kwa ujumla kuwa picha ya huruma ya Ayubu kwa walio dhaifu.
  rationale: Kiebrania hutumia umbo la kiume katika kishazi cha kwanza na kiambishi cha kike umoja katika cha pili. Kutaja 'yatima' na 'mjane' huonyesha tofauti hiyo na kuunganisha mstari na mstari uliotangulia bila kufuta mvutano wa kisarufi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Chini ya uangalizi wangu kama chini ya baba' ni lugha ya asili inayoeleza malezi ya kibaba, huku tanbihi ikihifadhi ugumu halisi wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
