  text: Sikukiruhusu kinywa changu kutenda dhambi kwa kuomba uhai wake kwa laana[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kiapo.” Neno la Kiebrania linaweza kumaanisha ama “laana” ama “kiapo,” lakini hapa muktadha wa kumtakia mtu madhara unaunga mkono “laana.”
