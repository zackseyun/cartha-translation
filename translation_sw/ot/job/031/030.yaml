lexical_decisions:
- source_word: נָתַתִּי
  choice: Sikuuruhusu
  rationale: Muundo wa Kiebrania wa ‘kutoa’ pamoja na kitenzi-jina una maana ya kuruhusu; ‘sikuuruhusu’ ni Kiswahili cha kawaida kinachohifadhi wazo la kukataa kwa hiari.
- source_word: לַחֲטֹא
  choice: kitende dhambi
  rationale: Kitenzi חטא hapa kina maana yake ya kawaida ya kimaadili, yaani kutenda dhambi.
- source_word: חִכִּי
  choice: kinywa changu
  rationale: Neno hili kihalisi linaweza kumaanisha ‘kaakaa,’ lakini katika ushairi linawakilisha kiungo cha kusema; ‘kinywa changu’ ni wazi na cha kawaida katika muktadha huu.
- source_word: לִשְׁאֹל
  choice: kwa kuomba
  rationale: Kitenzi-jina hiki kinaeleza namna ambayo kinywa kingetenda dhambi; ‘kwa kuomba’ linaonyesha uhusiano huo kwa Kiswahili cha asili.
- source_word: בְּאָלָה
  choice: kwa laana
  rationale: אָלָה linaweza kumaanisha laana au kiapo. Muktadha wa kumtakia adui madhara unaunga mkono ‘laana,’ huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: נַפְשׁוֹ
  choice: uhai wake
  rationale: נפשׁ hapa linaashiria uhai wa mtu, si fundisho la kimetafizikia kuhusu nafsi; ‘uhai wake’ ni sahihi na la kawaida.
