  text: כִּ֤י פַ֣חַד אֵ֭לַ/י אֵ֣יד אֵ֑ל וּ֝/מִ/שְּׂאֵת֗/וֹ לֹ֣א אוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: sw
  text: Kwa maana maafa kutoka kwa Mungu yalikuwa kitisho kwangu[a], na kwa sababu ya ukuu wake sikuweza kustahimili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maafa ya Mungu yalikuwa jambo la kuogofya kwangu.” Kiebrania kinaweza kutafsiriwa rasmi zaidi kuwa “ya Mungu,” ingawa huenda maana yake ni maafa yanayotoka kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu ya kuinuliwa kwake sikuweza kusimama imara.” Nomino hiyo inaweza kusisitiza kuinuliwa au ukuu, na kitenzi kinaweza kutafsiriwa “kuweza” au “kustahimili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaanzisha sababu ya kujizuia kwa Ayubu iliyotajwa katika muktadha uliotangulia; “kwa maana” kinaonyesha uhusiano huo wa maelezo kwa Kiswahili cha kawaida.
- source_word: פַחַד
  choice: kitisho
  rationale: Nomino hii inaonyesha jambo linalotia hofu kuu, si tendo la kuogopa tu. “Kitisho” kinadumisha nguvu na muundo wa kinomino.
- source_word: אֵלַי
  choice: kwangu
  rationale: Kihusishi chenye kiambishi cha nafsi ya kwanza kinaonyesha jinsi maafa hayo yalivyomhusu Ayubu binafsi.
- source_word: אֵיד אֵל
  choice: maafa kutoka kwa Mungu
  rationale: Muundo huu unaeleweka kwa kawaida kuwa maafa yanayotoka kwa Mungu. Tafsiri hii ni wazi na ya asili bila kuondoa uwezekano wa tafsiri rasmi zaidi, “maafa ya Mungu.”
- source_word: וּמִשְּׂאֵתוֹ
  choice: na kwa sababu ya ukuu wake
  rationale: שְׂאֵת inaweza kumaanisha kuinuliwa, cheo cha juu, au ukuu. Hapa מִן inaeleweka kwa maana ya kisababishi; “ukuu wake” ni lugha ya kawaida na yenye heshima bila kuingiza dhana ya ziada ya “utukufu.”
- source_word: לֹא אוּכָל
  choice: sikuweza kustahimili
  rationale: Kitenzi יכל huonyesha uwezo. “Sikuweza kustahimili” kinaonyesha kutoweza kusimama imara mbele ya ukuu wa Mungu, huku kikidumisha kutotajwa wazi kwa yule au lile linalostahimiliwa.
theological_decisions:
- issue: Jinsi ya kutafsiri אֵל katika muktadha usiolazimisha jina maalumu
  choice: Mungu
  alternative: Mwenye Nguvu; El
  rationale: Muktadha unamhusu Mungu kama chanzo cha hukumu na mwenye ukuu. “Mungu” ni wazi kwa msomaji wa Kiswahili na hauongezi dai la kimafundisho.
- issue: Sababu ya mwenendo wa Ayubu
  choice: Kitisho cha maafa kutoka kwa Mungu na ukuu wake vilimzuia
  alternative: Ayubu aliogopa adhabu tu; Ayubu alifikiria ukuu wa Mungu kwa namna ya kinadharia tu
  rationale: Mstari unaweka pamoja hofu ya maafa ya kimungu na kutoweza kustahimili ukuu wa Mungu. Tafsiri inahifadhi mvutano huo bila kuupunguza kuwa hofu ya adhabu pekee au wazo la kinadharia kuhusu Mungu.
- issue: Kirejeleo kisichotajwa baada ya לֹא אוּכָל
  choice: Kuacha “kustahimili” bila kutaja kitu au nafsi inayostahimiliwa
  alternative: Sikuweza kumstahimili; sikuweza kuyastahimili; sikuweza kufanya hivyo
  rationale: Kiebrania hakitaji yambwa la kitenzi. Kuacha kirejeleo wazi kunahifadhi utata halisi badala ya kuamua kimya kimya kama ni Mungu, ukuu wake, maafa, au uwezo wa kutenda uovu unaokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Maafa,” “kitisho,” na “ukuu” vinaeleweka kwa wasomaji wa kawaida huku vikihifadhi uzito wa kishairi wa kauli ya Ayubu. Muundo wa sentensi unafuata kwa karibu hoja ya Kiebrania bila kuwa mgumu au wa kizamani.
