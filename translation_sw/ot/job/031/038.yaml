  yaml_path: translation/ot/job/031/038.yaml
  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: sw
  text: Ikiwa ardhi yangu inanilalamikia, na matuta yake yanalia pamoja,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Huanzisha sharti katika kiapo cha Ayubu cha kujitangaza kuwa hana hatia; “ikiwa” ni ya kawaida na wazi.
- source_word: עָלַי
  choice: inanilalamikia
  rationale: Pamoja na זעק, kihusishi hiki kinaonyesha kilio kinachomwelekea Ayubu kama malalamiko au ushahidi dhidi yake. Kitenzi hiki cha Kiswahili kinaingiza maana hiyo kwa kawaida bila kuhitaji kirai kizito.
- source_word: אַדְמָתִי
  choice: ardhi yangu
  rationale: אדמה hapa ni ardhi inayolimwa; “ardhi yangu” ni ya asili, wazi, na inadumisha umilikaji.
- source_word: תִזְעָק
  choice: inanilalamikia
  rationale: זעק ni kupaza kilio kikali cha dhiki au cha mashtaka. “Inanilalamikia” inadumisha uhuishaji wa ardhi na nguvu ya kimaadili ya kilio chake.
- source_word: וְיַחַד
  choice: pamoja
  rationale: יחד huonyesha tendo la pamoja; “pamoja” inadumisha picha ya matuta yote yakilia kwa wakati mmoja.
- source_word: תְּלָמֶיהָ
  choice: matuta yake yote
  rationale: תלם ni tuta au mstari wa udongo unaotokana na kulima. “Matuta” ni neno la kawaida katika muktadha wa kilimo; “yote” huweka wazi wazo la sauti zao za pamoja bila kubadili maana.
- source_word: יִבְכָּיוּן
  choice: yanalia
  rationale: בכה ni kulia. “Yanalia” inadumisha uhuishaji wa kishairi na kulitofautisha tendo hili na kilio cha malalamiko katika mstari wa kwanza.
