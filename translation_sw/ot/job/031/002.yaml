base_translation:
  language: en
  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: sw
  text: Basi, ni fungu gani litokalo kwa Mungu aliye juu[a], na urithi gani utokao kwa Mwenyezi kutoka mahali pa juu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Mungu kutoka juu ... kwa Mwenyezi kutoka mahali pa juu.” Virai vya Kiebrania vinaweza kueleweka kama vielezi vinavyokazia kwamba fungu na urithi huo hutoka juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶה
  choice: Basi, ni ... gani
  rationale: Kiunganishi na kiulizi vinaendeleza hoja kwa swali la balagha; “Basi” huonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: חֵלֶק
  choice: fungu
  rationale: “Fungu” ni sehemu anayogawiwa mtu na linaendana na “urithi” katika mstari sambamba.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni umbo la kishairi la umoja linalomtaja Mungu; haliongezi wazo la “Aliye Juu Zaidi.”
- source_word: מִמָּעַל
  choice: aliye juu
  rationale: Kirai kinaweza kuhusishwa na Mungu au kueleweka kama chanzo cha mbinguni; matini kuu huhifadhi usomaji wa sifa, huku tanbihi ikitaja uwezekano wa kielezi.
- source_word: וְנַחֲלַת
  choice: na urithi gani
  rationale: “Urithi” huhifadhi maana ya milki au sehemu iliyogawiwa na usambamba wake na “fungu.” Kurudia “gani” hufanya swali la Kiswahili liwe wazi.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Jina la cheo שַׁדַּי limetafsiriwa kwa cheo cha kawaida cha Kiswahili badala ya kunukuliwa kama Shaddai.
- source_word: מִמְּרֹמִים
  choice: kutoka mahali pa juu
  rationale: Huhifadhi kihusishi cha chanzo מִן na maana ya wingi ya “mahali palipo juu” bila kuongeza neno “mbinguni,” ambalo halipo wazi katika Kiebrania.
theological_decisions:
- issue: Majina ya cheo ya Mungu katika ushairi wa Kiebrania
  choice: Kutafsiri אֱלוֹהַּ kama “Mungu” na שַׁדַּי kama “Mwenyezi”
  alternative: Mungu ... Shaddai
  rationale: Kutafsiri vyeo vyote viwili huwasilisha maana kwa msomaji wa sasa huku kukihifadhi usambamba wa kishairi.
- issue: Uhusiano wa מִמָּעַל na אֱלוֹהַּ
  choice: “Mungu aliye juu” katika matini kuu, pamoja na tanbihi ya usomaji wa chanzo
  alternative: “kwa Mungu kutoka juu”
  rationale: Muundo wa Kiebrania unaweza kuruhusu kirai hiki kueleza Mungu au mahali chanzo kilipo. Tanbihi huhifadhi utata huo bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Fungu” na “urithi” hudumisha usambamba wa kishairi; “mahali pa juu” huepuka kuongeza “mbinguni” pasipo ulazima.
