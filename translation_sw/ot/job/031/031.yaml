  text: if the men of my tent have not said[b][a], ‘Who is there that has not been filled with his flesh?’
translation:
  language: sw
  text: ikiwa watu wa hema langu[a] hawakusema, “Ni nani ambaye hakushiba nyama yake?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa nyumba yangu”; “hema” linaweza kumaanisha nyumba au watu wa nyumbani.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka katika nyama yake.” Hapa huenda maana ni nyama au chakula alichotoa Ayubu. Kwa uchanganuzi mwingine wa sentensi, maneno hayo yanaweza kuwa ombi: “Ni nani atakayetupa nyama yake ili tushibe?”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אִם לֹא
  choice: ikiwa ... hawaku-
  rationale: Muundo wa masharti ‘ikiwa ... si’ umehifadhiwa kwa sababu ni sehemu ya kiapo cha Ayubu, ingawa katika muktadha una nguvu ya kusisitiza ‘hakika.’
- source_word: מְתֵי אָהֳלִי
  choice: watu wa hema langu
  rationale: Hii inahifadhi picha halisi ya hema huku ‘watu’ ikiwa ya kawaida na yenye kujumuisha washiriki au watumishi wa nyumba.
- source_word: מִי יִתֵּן
  choice: Ni nani ambaye
  rationale: Katika uchanganuzi huu, msemo unaanzisha swali la balagha, ‘Ni nani ambaye ...?’; utata wa kisintaksia umeelezwa katika tanbihi.
- source_word: מִבְּשָׂרוֹ
  choice: nyama yake
  rationale: בשר inaweza kumaanisha mwili/nyama, lakini katika muktadha wa ukarimu inaelekea kumaanisha nyama ya chakula iliyotolewa na Ayubu. Tafsiri fupi ‘nyama yake’ huhifadhi umilikaji wa Kiebrania bila kupanua matini.
- source_word: לֹא נִשְׂבָּע
  choice: hakushiba
  rationale: Kitenzi cha Nifali cha שׂבע humaanisha kushiba au kutosheka; ‘hakushiba’ ni Kiswahili cha kawaida na halisi katika muktadha wa chakula.
theological_decisions:
- issue: Utambulisho wa ‘watu wa hema’ na maana ya ‘nyama yake’
  choice: Matini kuu inaacha marejeo hayo kwa upana kama yalivyo katika Kiebrania.
  alternative: Kuyataja moja kwa moja kuwa watumishi wa Ayubu na chakula kutoka mezani pake.
  rationale: Ufafanuzi huo unawezekana sana lakini haupaswi kuingizwa kama jambo lililotamkwa wazi na matini.
- issue: Sintaksia tata ya מִי יִתֵּן ... לֹא נִשְׂבָּע
  choice: Imetafsiriwa kama swali la balagha kuhusu kutokuwapo kwa mtu ambaye hakushiba nyama ya Ayubu.
  alternative: “Ni nani atakayetupa sehemu ya mwili wake? Hatujashiba!”
  rationale: Kiebrania kinaruhusu uchanganuzi mbadala wenye kauli ya hamu au ombi; tanbihi inalinda utata huo bila kufanya matini kuu isiwe ya kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi. Kipande cha masharti kinachoanza kwa ‘ikiwa’ kimeachwa bila jibu kamili ili kuhifadhi muundo wa kiapo unaoendelea katika Ayubu 31. Alama zote za tanbihi zimewekwa katika matini kuu.
