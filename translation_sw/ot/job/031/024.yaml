revisions:
- from: Kama nimeifanya dhahabu kuwa tumaini langu[a], na kuiambia dhahabu safi[b], “Wewe ndiye usalama wangu[c],”
  to: Kama nimeifanya dhahabu kuwa tumaini langu[a], na nimeiambia dhahabu safi[b], “Wewe ndiye tegemeo langu[c],”
  rationale: The revision corrects the Swahili verbal coordination so that both actions are completed acts within Job’s conditional oath. It also uses “tegemeo langu” for the second Hebrew trust term, which more accurately denotes the object of reliance while keeping it distinct from the first term, rendered “tumaini langu.” The trailing comma is retained because this verse remains the protasis of Job’s continuing oath.
