lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Hutanguliza sharti katika kiapo cha Ayubu cha kujitetea kuwa hana hatia; “kama” ni ya kawaida na hudumisha muundo wa Kiebrania.
- source_word: שַׂמְתִּי
  choice: nimeifanya ... kuwa
  rationale: Kitenzi שׂים humaanisha kuweka; katika muundo huu, “nimeifanya ... kuwa” huwasilisha kwa Kiswahili cha kawaida wazo la kuipa dhahabu nafasi ya tumaini.
- source_word: זָהָב
  choice: dhahabu
  rationale: Tafsiri ya moja kwa moja ya neno la kawaida la dhahabu.
- source_word: כִּסְלִי
  choice: tumaini langu
  rationale: כֶּסֶל inaweza kumaanisha tumaini, utegemeo, au uhakika. “Tumaini langu” linaonyesha kutegemea mali bila kulifanya sawa kabisa na מִבְטַחִי katika sehemu inayofuata.
- source_word: וְלַכֶּתֶם
  choice: na kuiambia dhahabu safi
  rationale: כֶּתֶם hurejelea dhahabu iliyosafishwa au yenye ubora mkubwa; “dhahabu safi” ni ya asili katika Kiswahili na kihusishi ל־ kinaonyeshwa na “kuiambia.”
- source_word: אָמַרְתִּי
  choice: kuiambia
  rationale: Muundo wa kitenzi pamoja na kiambishi cha yambwa unatoa Kiswahili fasaha kwa maana ya “niliiambia.”
- source_word: מִבְטַחִי
  choice: usalama wangu
  rationale: מִבְטָח ni kitu ambacho mtu anakitegemea ili apate usalama. Chaguo hili linahifadhi tofauti ya msamiati na “tumaini langu.”
theological_decisions:
- issue: Ayubu kukana kwamba alitegemea utajiri
  choice: 'Kauli imehifadhiwa kama sharti: “Kama nimeifanya dhahabu kuwa tumaini langu...”'
  alternative: Kama nimeweka tumaini langu katika dhahabu...
  rationale: Muundo huu unadumisha namna ya kiapo cha kujitetea katika sura hii na nguvu ya kimaadili ya kukana utegemezi wa dhahabu, bila kuingiza istilahi za kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Tofauti kati ya כִּסְלִי na מִבְטַחִי imehifadhiwa kwa “tumaini” na “usalama.”
