  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: sw
  text: Kama nimeifanya dhahabu kuwa tumaini langu[a], na nimeiambia dhahabu safi[b], “Wewe ndiye tegemeo langu[c],”
  philosophy: optimal-equivalence
