lexical_decisions:
- source_word: נִפְתָּה
  choice: ulishawishiwa
  rationale: Kauli ya kutendwa ya פתה inaweza kumaanisha kushawishiwa, kudanganywa, au kuvutwa. Katika muktadha huu wa kishawishi cha kingono, “ulishawishiwa” ni ya kawaida na huhifadhi wazo la mvuto wa ndani bila kumfanya mwanamke waziwazi kuwa mtendaji.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: “Moyo” huhifadhi taswira ya Kiebrania ya utu wa ndani, ikijumuisha tamaa, nia, na maamuzi.
- source_word: עַל אִשָּׁה
  choice: na mwanamke
  rationale: Ingawa kihusishi עַל kinaweza kuwa “juu ya,” “kuhusu,” au “kwa,” hapa “na mwanamke” huunda Kiswahili cha kawaida pamoja na “ulishawishiwa” na kuonyesha mazingira ya kishawishi bila kuongeza maelezo.
- source_word: פֶּתַח
  choice: mlangoni
  rationale: “Mlangoni” ni tafsiri fupi na ya kawaida ya mahali pa kuingilia nyumba, na inafaa kitendo cha kuvizia.
- source_word: רֵעִי
  choice: jirani yangu
  rationale: רֵעַ inaweza kumaanisha jirani, rafiki, au mwenzake. “Jirani yangu” inafaa muktadha wa kijamii na kimaadili bila kudokeza lazima urafiki wa karibu.
- source_word: אָרָבְתִּי
  choice: nikavizia
  rationale: ארב hueleza kungoja kwa siri kwa nia fulani. “Nikavizia” huhifadhi hali ya kitendo cha makusudi na cha kificho kwa Kiswahili cha asili.
theological_decisions:
- issue: Mfumo wa kimaadili wa kiapo cha Ayubu kuhusu uzinzi
  choice: Kuhifadhi mwendelezo kutoka kushawishiwa kwa moyo hadi kuvizia kwa siri mlangoni mwa jirani.
  alternative: Kutafsiri kwa upole kama mvuto wa kimapenzi, au kueleza moja kwa moja kuwa ni jaribio la uzinzi.
  rationale: Kiebrania hutaja hali ya ndani na tendo la nje la kificho, lakini hakitamki moja kwa moja tendo la uzinzi katika mstari huu. Tafsiri inahifadhi uzito huo bila kuongeza jambo lisilotajwa.
translation_notes:
