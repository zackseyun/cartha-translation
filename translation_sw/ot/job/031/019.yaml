lexical_decisions:
- source_word: אִם
  choice: ikiwa
  rationale: Hutanguliza kishazi cha sharti katika kiapo cha Ayubu cha kujitetea; “ikiwa” huhifadhi muundo huo.
- source_word: אֶרְאֶה
  choice: nimemwona
  rationale: Kauli ya nafsi ya kwanza katika muktadha huu wa kujichunguza kwa kutazama yaliyopita inaelezwa kwa kawaida kwa wakati timilifu wa Kiswahili.
- source_word: אֹבֵד
  choice: mtu akiangamia
  rationale: Kivumishi-tendo hiki humaanisha mtu aliye katika hali ya kuangamia au kupotea; muundo huu huhifadhi hali inayoendelea bila kuamua kuwa ni kifo tu.
- source_word: מִבְּלִי לְבוּשׁ
  choice: kwa kukosa mavazi
  rationale: Hueleza upungufu unaosababisha hali hiyo; ni Kiswahili cha kawaida kinachohifadhi maana ya kunyimwa mavazi.
- source_word: וְאֵין
  choice: au ... akiwa hana
  rationale: Ingawa kiunganishi cha Kiebrania kwa msingi ni “na,” katika usambamba wa masharti hapa “au” huonyesha kwa kawaida vipengele viwili vinavyolingana vya hali moja.
- source_word: כְּסוּת
  choice: cha kujisitiri
  rationale: Hurejelea kifuniko au vazi; “cha kujisitiri” huhifadhi tofauti fulani na “mavazi” ya mstari wa kwanza na kuleta usambamba wa kishairi.
- source_word: לָאֶבְיוֹן
  choice: mhitaji
  rationale: Neno hili humaanisha mtu maskini au mwenye uhitaji; “mhitaji” ni wazi, la heshima, na haliongezi maana isiyokuwamo.
