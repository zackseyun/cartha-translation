  text: אִם כִּסִּ֣יתִי כְ/אָדָ֣ם פְּשָׁעָ֑/י לִ/טְמ֖וֹן בְּ/חֻבִּ֣/י עֲוֺֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/033.yaml
  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: sw
  text: ikiwa nimeyafunika maasi yangu kama mtu[a], kwa kuuficha uovu wangu kifuani mwangu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama Adamu.” Neno la Kiebrania אָדָם linaweza kueleweka kama nomino ya kawaida, “mtu,” au kama jina la pekee, “Adamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: ikiwa
  rationale: Huanzisha kishazi cha sharti katika kiapo cha Ayubu bila kuongeza mkazo usio wazi katika Kiebrania.
- source_word: כִּסִּיתִי
  choice: nimeyafunika
  rationale: Yahifadhi taswira halisi ya kufunika huku katika muktadha ikimaanisha kuficha.
- source_word: כְאָדָם
  choice: kama mwanadamu
  rationale: אָדָם inaweza kuwa nomino ya kawaida, ‘mwanadamu,’ au jina la pekee, ‘Adamu.’ Matini kuu yahifadhi maana ya kawaida, na uwezekano wa jina umewekwa katika tanbihi.
- source_word: פְּשָׁעָי
  choice: makosa yangu
  rationale: פֶּשַׁע hueleza kosa au uasi. ‘Makosa’ ni ya kawaida na ya kueleweka, ingawa bado yana uzito wa kimaadili katika muktadha.
- source_word: לִטְמוֹן
  choice: kwa kuuficha
  rationale: Infinitivu ya טמן yaweza kueleza namna au njia; ‘kwa kuuficha’ huunganisha vishazi kwa Kiswahili cha asili.
- source_word: בְּחֻבִּי
  choice: kifuani mwangu
  rationale: Yahifadhi taswira ya kitu kilichositiriwa kifuani au ndani ya nguo, badala ya kuibadili kuwa dhana ya jumla kama ‘kwa siri.’
- source_word: עֲוֺנִי
  choice: uovu wangu
  rationale: עָוֹן yaweza kumaanisha uovu, hatia, au adhabu inayotokana nao. ‘Uovu wangu’ yahifadhi maana ya kimaadili na kuitofautisha na ‘makosa yangu.’
theological_decisions:
- issue: Maana ya אָדָם katika כְאָדָם
  choice: 'nomino ya kawaida: “kama mwanadamu”'
  alternative: 'jina la pekee: “kama Adamu”'
  rationale: Kiebrania kinaruhusu maana zote mbili. Matini kuu haifungi kifungu kwa dokezo la Adamu, lakini tanbihi yahifadhi usomaji huo wa muda mrefu na muhimu kiufafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sharti umeachwa wazi kwa kuwa mstari huu ni sehemu ya kiapo kinachoendelea; kistari kirefu kinaonyesha sentensi haijakamilika hapa.
