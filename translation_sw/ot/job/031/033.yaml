  verdict: revise
  source_fidelity: The conditional oath structure, the metaphor of covering, the ambiguous comparison כְאָדָם, and the final image of concealing wrongdoing in one’s bosom are retained. However, “makosa” is too broad and often suggests ordinary mistakes, whereas פְּשָׁעִים carries a more serious sense of transgressions/rebellious offenses.
  naturalness: “Kama mtu” is the more idiomatic singular generic comparison in Standard East African Swahili. “Kifuani mwangu” naturally conveys the concrete image of the bosom/chest as a concealed inner place.
  terminology: “Maasi” better represents פְּשָׁעַי than “makosa,” while “uovu wangu” remains a suitable rendering of עֲוֹנִי in this parallel expression. The footnote appropriately preserves the possible proper-name reading “Adamu.”
