  - severity: low
    issue: “Kama mwanadamu” is less idiomatic in this generic singular comparison.
    rationale: “Kama mtu” is natural Standard East African Swahili and maintains the source’s singular common-noun reading without prejudging the alternative reading “Adamu.”
