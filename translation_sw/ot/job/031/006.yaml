lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: anipime
  rationale: Qal imperfect yenye kiambishi cha nafsi ya kwanza umoja ina nguvu ya ombi katika muktadha; “anipime” huhifadhi mwaliko wa Ayubu achunguzwe na taswira ya kupima.
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: kwa mizani ya haki
  rationale: מֹאזְנֵי ni mizani, na צֶדֶק hapa hudokeza haki na usawa wa kipimo. Usemi huu ni wa asili katika Kiswahili na huhifadhi taswira ya Kiebrania.
- source_word: וְיֵדַע
  choice: ili ... aujue
  rationale: Imperfect inayounganishwa na וְ inaweza kuendeleza wazo la ombi au kueleza kusudi/matokeo. “Ili ... aujue” huonyesha kwamba kupimwa kwa haki kutadhihirisha uadilifu wa Ayubu bila kuifanya sentensi kuwa taarifa rahisi ya wakati ujao.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni umbo la kishairi la umoja linalomaanisha Mungu; hakuna msingi katika mstari huu wa kulipanua kuwa “Mungu Mwenyezi.”
- source_word: תֻּמָּתִי
  choice: uadilifu wangu
  rationale: תֻּמָּה humaanisha ukamilifu wa tabia, kutokuwa na lawama, au uadilifu. “Uadilifu wangu” hufaa katika dai la Ayubu kuhusu unyoofu wake bila kudai wazi kwamba hana dhambi kabisa.
theological_decisions:
- issue: Nguvu ya maelezo ya Ayubu kujihusu
  choice: uadilifu wangu
  alternative: kutokuwa kwangu na hatia; kutokuwa kwangu na lawama
  rationale: Tafsiri hii huhifadhi dai la Ayubu la kuwa mnyoofu mbele ya uchunguzi wa haki, lakini hailazimishi maana ya kutokuwa na dhambi kabisa.
- issue: Uhusiano wa וְיֵדַע na ombi la kwanza
  choice: ili Mungu aujue
  alternative: na Mungu na aujue; ndipo Mungu atakapoujua
  rationale: Kiebrania kinaweza kuendeleza nguvu ya ombi au kuonyesha matokeo. Kiswahili cha kusudi kinaunganisha mawazo kwa kawaida huku tanbihi ikihifadhi uwezekano wa usomaji wa ombi sambamba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Mizani ya haki” huhifadhi sitiari ya uchunguzi wa haki; “uadilifu” huepuka kudai kutokuwa na dhambi kabisa.
