  text: Na anipime kwa mizani ya haki[a], na Mungu ajue uadilifu wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mizani ya uadilifu” au “kwa mizani ya haki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutokuwa na lawama kwangu” au “kutokuwa na hatia kwangu.”
