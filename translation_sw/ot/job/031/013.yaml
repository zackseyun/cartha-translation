lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Huanzisha kisharti katika kiapo cha Ayubu cha kujitetea; “Kama” ni ya kawaida na wazi katika Kiswahili.
- source_word: אֶמְאַס
  choice: niliikataa
  rationale: Katika muktadha wa kisheria, kitenzi hiki kinaonyesha kukataa au kutosikiliza madai, si hisia ya kudharau tu.
- source_word: מִשְׁפַּט
  choice: kesi
  rationale: Neno linaweza kumaanisha haki, hukumu, dai la kisheria, au kesi; hapa “kesi” hudumisha mazingira ya mgogoro wa kisheria.
- source_word: עַבְדִּי וַאֲמָתִי
  choice: mtumwa wangu wa kiume au wa kike
  rationale: Maneno ya Kiebrania yanataja mtumwa wa kiume na mtumwa wa kike. Tafsiri hii inaonyesha hali yao ya utumwa na tofauti ya jinsia bila kurudia maneno kwa uzito usio wa lazima.
- source_word: בְּרִיבָם
  choice: walipowasilisha malalamiko
  rationale: Neno linahusu ugomvi, shauri, au malalamiko yenye mwelekeo wa kisheria; usemi huu ni wa asili katika Kiswahili na huonyesha kuwa walikuwa wakidai kusikilizwa.
- source_word: עִמָּדִי
  choice: dhidi yangu
  rationale: Ingawa kihalisi ni “pamoja nami,” katika muktadha wa mgogoro humaanisha kuwa madai yalielekezwa dhidi ya Ayubu.
