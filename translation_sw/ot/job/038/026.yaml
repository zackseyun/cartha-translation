translation:
  language: sw
  text: ili kufanya mvua inyeshe juu ya nchi isiyo na mtu[a], juu ya nyika isiyo na mwanadamu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “isiyo na mwanamume ... isiyo na mtu.” Kiebrania hutumia maneno mawili yanayohusiana lakini tofauti: אִישׁ (“mtu, mwanamume”) na אָדָם (“mwanadamu, binadamu”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: ili kunyesha mvua
  rationale: Kitenzi cha Kiebrania kiko katika muundo wa kusababisha na kinaeleza kusababisha mvua inyeshe. Kiswahili cha kawaida hutumia ‘kunyesha mvua’ kwa tendo la kuleta mvua, huku ‘ili’ ikiunganisha kishazi hiki na muktadha uliotangulia.
- source_word: עַל אֶרֶץ
  choice: juu ya nchi
  rationale: ‘Juu ya’ huonyesha eneo linalopokea mvua, na ‘nchi’ hapa ni sehemu ya ardhi, si dunia nzima wala taifa kwa maana ya kisiasa.
- source_word: לֹא אִישׁ
  choice: isiyo na mtu
  rationale: Kishazi kifupi cha Kiebrania kina maana ya kutokuwapo kwa mtu katika nchi hiyo. ‘Isiyo na mtu’ ni ya kawaida na huacha tofauti ya msamiati na אָדָם inayoifuata.
- source_word: מִדְבָּר
  choice: nyika
  rationale: Neno hili humaanisha eneo lisilolimwa au lisilokaliwa, si lazima jangwa la mchanga. ‘Nyika’ linafaa kwa upana huo wa maana na kwa mtindo wa kishairi.
- source_word: לֹא אָדָם בּוֹ
  choice: isiyo na mwanadamu
  rationale: אָדָם hapa humaanisha binadamu kwa ujumla. ‘Mwanadamu’ linaonyesha maana hiyo na wakati huohuo linadumisha tofauti na ‘mtu’ lililotumika kwa אִישׁ.
theological_decisions:
- issue: Maana ya אָדָם inapowakilisha binadamu kwa ujumla
  choice: mwanadamu
  alternative: mtu; wanadamu
  rationale: Umoja ‘mwanadamu’ unafuata umbo la Kiebrania na kuonyesha ubinadamu kwa maana ya jumla bila kuufanya mstari useme hasa mwanamume. Pia unahifadhi tofauti ya kishairi na אִישׁ.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inaendeleza muundo wa kishairi wa virai viwili sambamba. Alama [a] imewekwa baada ya ‘mtu’ ili kufafanua tofauti ya maneno mawili ya Kiebrania.
