  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: sw
  text: Je, unaweza kuifanya Mazaroth itokee kwa majira yake[a], au kuiongoza Ayish pamoja na watoto wake[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mazaroth ni neno adimu la Kiebrania la elimu ya nyota; huenda linamaanisha makundi ya nyota au zodiaki.
    reason: lexical_alternative
  - marker: b
    text: Ayish ni jina la Kiebrania la nyota au kundinyota; katika baadhi ya tafsiri za Kiingereza limetafsiriwa “Arkturo,” na wengi hulielewa kuwa “Dubu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תֹצִיא
  choice: Je, unaweza kuitokeza
  rationale: Kauli ya kusababisha ya kitenzi יצא inauliza kama mtu anaweza kukifanya kitu cha angani kitokee; “kuitokeza” huhifadhi maana hiyo katika Kiswahili cha kawaida.
- source_word: מַזָּרוֹת
  choice: Mazarothi
  rationale: Hili ni neno adimu la elimu ya nyota ambalo maana yake kamili haijulikani; kulinakili kwa herufi za Kiswahili huepuka kulipa maana mahsusi isiyo na uhakika.
- source_word: בְּ/עִתּוֹ
  choice: kwa majira yake
  rationale: Kirai hiki kinaonyesha wakati au majira yanayofaa yaliyowekwa kwa kutokea kwake.
- source_word: וְ/עַיִשׁ
  choice: Ayishi
  rationale: Ni jina la Kiebrania la nyota au kundinyota lisilo na utambulisho wa hakika; umbo lililotoholewa huhifadhi hali hiyo ya kutokuwa na uhakika.
- source_word: עַל בָּנֶיהָ
  choice: pamoja na watoto wake
  rationale: Kiebrania hutumia sitiari ya kifamilia, kihalisi “watoto wake”; huenda inarejelea nyota zinazoandamana nalo. Tafsiri hii huhifadhi pia nafsi ya kike.
- source_word: תַנְחֵם
  choice: kuiongoza
  rationale: Kauli ya kusababisha ya נחה humaanisha kuongoza; hapa inaonyesha kuliongoza kundinyota na nyota zake angani.
