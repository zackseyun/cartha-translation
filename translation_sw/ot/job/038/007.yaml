  yaml_path: translation/ot/job/038/007.yaml
  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: sw
  text: 'wakati nyota za asubuhi zilipoimba pamoja,

    na wana wote wa Mungu[a] wakapaza sauti kwa shangwe?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “viumbe wa mbinguni” au “malaika.” Kiebrania: “wana wa Mungu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רָן
  choice: wakati ... zilipoimba
  rationale: Kiambishi בְּ pamoja na jina la kitendo la רנן kinaanzisha kishazi cha wakati katika muktadha huu. Kitenzi kinaeleza uimbaji au kilio cha furaha; “zilipoimba” kinafaa kwa taswira ya kishairi na ulinganifu wa mstari unaofuata.
- source_word: יַחַד
  choice: pamoja
  rationale: Neno hili huonyesha kutenda kwa wakati mmoja au kwa umoja; “pamoja” ni Kiswahili cha kawaida na huhifadhi maana hiyo ya kijumuiya.
- source_word: כּוֹכְבֵי בֹקֶר
  choice: nyota za asubuhi
  rationale: Hili ni tamko la muundo wa utegemezi lenye maana halisi ya “nyota za asubuhi”; tafsiri hii huhifadhi taswira ya kishairi bila kuifafanua kupita kiasi.
- source_word: וַ/יָּרִיעוּ
  choice: wakapaza sauti kwa shangwe
  rationale: Kitenzi ריע katika kausativi humaanisha kutoa au kupaza sauti, mara nyingi ya furaha. “Kwa shangwe” huonyesha muktadha wa kusherehekea na ulinganifu wake na kuimba.
- source_word: כָּל
  choice: wote
  rationale: כָּל husisitiza ujumla wa kundi. Kwa kuwa nomino inayorejelewa ni watu au viumbe wenye nafsi, upatanisho wa kawaida wa Kiswahili ni “wote.”
- source_word: בְּנֵי אֱלֹהִים
  choice: wana wa Mungu
  rationale: Tamko la Kiebrania kwa maana halisi ni “wana wa Mungu.” Kulihifadhi katika matini kuu kunaacha wazi lugha ya chanzo na umuhimu wake wa kiteolojia badala ya kulifasiri moja kwa moja kuwa “malaika.”
theological_decisions:
- issue: Utambulisho wa בְּנֵי אֱלֹהִים
  choice: wana wa Mungu
  alternative: viumbe wa mbinguni; malaika; viumbe wa kimungu
  rationale: Katika Ayubu, tamko hili huenda likarejelea washiriki wa baraza la mbinguni. Hata hivyo, “malaika” ingekuwa tafsiri ya kiufafanuzi. “Wana wa Mungu” huhifadhi tamko la Kiebrania na mvutano wake wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa swali unaendelea kutoka muktadha uliotangulia. Alama ya tanbihi imewekwa baada ya tamko linalofafanuliwa, “wana wa Mungu.”
