base_translation:
  language: en
  yaml_path: translation/ot/job/038/002.yaml
  text: Who is this who darkens counsel with words without knowledge?[a]
translation:
  language: sw
  text: Ni nani huyu anayefanya shauri kuwa giza kwa maneno yasiyo na maarifa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpango” au “kusudi” badala ya “shauri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Ni nani huyu
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi swali lenye changamoto na msisitizo katika Kiebrania.
- source_word: מַחְשִׁיךְ
  choice: anayelifanya ... kuwa giza
  rationale: Unahifadhi sitiari ya Kiebrania ya kutia giza, badala ya kuibadili kuwa tafsiri elezi kama ‘anayevuruga’ au ‘anayefanya lisieleweke.’
- source_word: עֵצָה
  choice: shauri
  rationale: ‘Shauri’ linaweza kumaanisha ushauri, mpango, au kusudi katika muktadha huu, hivyo linahifadhi upana wa maana wa neno la Kiebrania.
- source_word: בְמִלִּין
  choice: kwa maneno
  rationale: ‘Kwa’ linaonyesha kwamba maneno ndiyo njia anayotumia kutia shauri giza.
- source_word: בְּלִי דָעַת
  choice: yasiyo na maarifa
  rationale: Tafsiri hii inafuata maana ya moja kwa moja ya Kiebrania na haibadili ‘maarifa’ kuwa ‘ufahamu’ au kielezi kama ‘kwa ujinga.’
theological_decisions:
- issue: Maana ya עֵצָה katika hotuba ya Mungu
  choice: shauri
  alternative: mpango au kusudi
  rationale: ‘Shauri’ linadumisha uwezekano wa hekima inayoshauriwa na pia mpango au kusudi la Mungu, bila kuamua kimadhehebu maana nyembamba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘kulifanya shauri kuwa giza’ umehifadhiwa kwa makusudi ili kubeba sitiari ya Kiebrania, ingawa ni wa kifasihi kuliko usemi wa mazungumzo.
