  text: when I prescribed my boundary for it and set bars and doors,[a]
translation:
  language: sw
  text: nilipoiwekea mpaka wangu na kuweka makomeo na milango,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilipoiwekea amri yangu”; huenda Kiebrania kinamaanisha kuweka kikomo cha bahari, wala si ‘kuvunja’ kitu kihalisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: nilipoiwekea
  rationale: Ingawa kwa kawaida mzizi שׁבר humaanisha ‘kuvunja,’ maana hiyo ni ngumu hapa. Katika muktadha wa kuizuia bahari, kitenzi kinaeleweka kuwa kitendo cha kuiwekea mpaka uliowekwa rasmi.
- source_word: עָלָיו
  choice: -i-
  rationale: Kiwakilishi kinarejelea bahari iliyotajwa katika muktadha uliotangulia; Kiswahili huunganisha rejeo hilo kwa kiambishi cha yambwa katika ‘kuiwekea.’
- source_word: חֻקִּי
  choice: mpaka wangu
  rationale: חֹק inaweza kumaanisha amri, kiwango kilichowekwa, au mpaka. Hapa ‘mpaka wangu’ huonyesha kikomo ambacho Mungu ameiwekea bahari huku ikihifadhi wazo la agizo lake.
- source_word: וָאָשִׂים
  choice: na kuweka
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya שׂים, nayo inadumisha mfuatano wa vitendo vya Mungu.
- source_word: בְּרִיחַ
  choice: makomeo
  rationale: Neno hili humaanisha komeo au bolti ya kufungia mlango. ‘Makomeo’ linafaa kwa taswira ya kuizuia bahari pamoja na milango.
- source_word: וּדְלָתָיִם
  choice: milango
  rationale: Umbo la uwili linaashiria milango miwili, lakini ‘milango’ ni la asili katika Kiswahili na linahifadhi taswira ya bahari kufungiwa.
theological_decisions:
- issue: Taswira ya Mungu kwa namna ya kibinadamu akitawala bahari
  choice: Kudumisha taswira halisi ya Mungu akiiwekea bahari mpaka, makomeo na milango.
  alternative: Kubadili taswira hiyo iwe kauli ya jumla kuhusu mamlaka ya Mungu juu ya maumbile.
  rationale: Ubeti unaonyesha enzi ya Mungu kwa taswira hai ya ujenzi na kufungia. Kuidumisha kunaheshimu nguvu ya kishairi ya Kiebrania bila kuifafanua kupita kiasi kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Makomeo’ ni neno linaloeleweka kwa vifaa vya kufungia milango na linahifadhi taswira ya kishairi.
