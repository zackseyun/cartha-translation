translation:
  language: sw
  text: Hubadilika kama udongo chini ya muhuri,[a] na hujitokeza kama vazi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hugeuka kama udongo chini ya muhuri.” Kitenzi cha Kiebrania kinaweza pia kutafsiriwa kwa maana ya “hugeuka chenyewe” au “hubadilishwa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, kitenzi kinachotafsiriwa “hujitokeza” ni cha wingi, lakini kiima chake hakitajwi wazi. Yaelekea kinarejelea vipengele vya uso wa dunia vinavyoanza kuonekana wazi katika mwanga wa alfajiri.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: Hugeuka
  rationale: Kitenzi cha Kiebrania katika Hitpael kinaweza kuonyesha kugeuka au kubadilishwa. “Hugeuka” ni cha asili katika Kiswahili na kinadumisha kwa kiasi fulani utata wa iwapo mabadiliko hayo ni ya hali au mwonekano.
- source_word: כְּחֹמֶר
  choice: kama udongo
  rationale: חֹמֶר hapa ni udongo unaoweza kupokea chapa ya muhuri; “udongo” ni neno la kawaida na linaloeleweka kwa urahisi.
- source_word: חוֹתָם
  choice: chini ya muhuri
  rationale: Muundo wa Kiebrania ni mfupi na wa kishairi. “Chini ya muhuri” huwasilisha picha ya udongo unaobonyezwa na muhuri bila kufafanua zaidi ya lazima.
- source_word: וְיִתְיַצְּבוּ
  choice: maumbo yake hujitokeza
  rationale: Kitenzi ni cha wingi, lakini kiwakilishi chake hakikutajwa wazi. “Maumbo yake” hutoa rejeo la kawaida la vipengele vya uso wa dunia vinavyoonekana wazi alfajiri, huku tanbihi ikibainisha kwamba neno hilo limeelezwa katika tafsiri.
- source_word: כְּמוֹ לְבוּשׁ
  choice: kama vazi
  rationale: “Vazi” huhifadhi umoja wa לְבוּשׁ na taswira ya kishairi ya maumbo au mikunjo inayoonekana.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini wazi. Tafsiri imedumisha taswira ya udongo na muhuri; imeongeza “maumbo yake” kwa uwazi wa kisarufi, huku tanbihi ikihifadhi kutotajwa wazi kwa mtendaji katika Kiebrania.
