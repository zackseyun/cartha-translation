base_translation:
  language: en
  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: sw
  text: Je, malango ya mauti yamefunuliwa kwako? Na je, umeyaona malango ya giza nene[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uvuli wa mauti.” Neno la Kiebrania צַלְמָוֶת limetafsiriwa hivyo kwa mapokeo, lakini pia linaweza kumaanisha giza nene au utusitusi kwa ujumla zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִגְלוּ
  choice: Je, ... yamefunuliwa
  rationale: Kiulizi הֲ pamoja na kitenzi cha Nifali katika wakati timilifu huunda swali la balagha. “Yamefunuliwa” huhifadhi kauli ya kutendwa ya Kiebrania.
- source_word: לְךָ
  choice: kwako
  rationale: Kihusishi chenye kiambishi cha nafsi ya pili umoja wa kiume humtaja moja kwa moja anayefunuliwa malango hayo.
- source_word: שַׁעֲרֵי מָוֶת
  choice: malango ya mauti
  rationale: Tafsiri hii huhifadhi muundo na taswira halisi ya malango yanayoingiza katika eneo la mauti.
- source_word: וְשַׁעֲרֵי
  choice: Na je, ... malango ya
  rationale: וְ limetafsiriwa kwa maana yake ya kawaida “na.” Kurudia “je” kunafanya ulinganifu wa maswali mawili ya balagha uwe wazi na wa asili katika Kiswahili.
- source_word: צַלְמָוֶת
  choice: giza nene
  rationale: Neno hili linaweza kumaanisha giza zito au hali ya utusitusi, bila kumaanisha mauti moja kwa moja kila mahali. “Giza nene” ni Kiswahili cha kawaida kinachohifadhi uzito wa taswira hiyo.
- source_word: תִּרְאֶה
  choice: umeyaona
  rationale: Kitenzi cha Qali, nafsi ya pili umoja wa kiume, kimetafsiriwa kwa wakati timilifu ili kiendane na swali la kwanza na kuuliza kuhusu uzoefu wa mhusika hadi wakati huo.
