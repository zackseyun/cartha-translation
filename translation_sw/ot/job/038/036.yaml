  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: sw
  text: Ni nani aliyeweka hekima katika sehemu za ndani[a], au ni nani aliyeipa akili ufahamu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au huenda: “Ni nani aliyeweka hekima katika sehemu zilizofichika, au ni nani aliyempa jogoo ufahamu?” Baadhi hulichukulia neno la pili kuwa jina la ndege (kwa mapokeo, “jogoo,” na wakati mwingine “ibisi”) badala ya akili.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinachoanzisha swali la balagha la Mungu.
- source_word: שָׁת
  choice: aliyeweka
  rationale: Huwasilisha maana ya kuweka au kutia, na kinaendana kwa kawaida na kitenzi ‘aliyeipa’ katika mstari sambamba.
- source_word: בַּטֻּחוֹת
  choice: ndani ya nafsi
  rationale: Neno hili ni gumu na huenda linamaanisha sehemu za ndani au utu wa ndani. ‘Ndani ya nafsi’ huhifadhi maana ya ndani bila tafsiri ya moja kwa moja ya ‘figo,’ ambayo inaweza kuwapotosha wasomaji wa sasa.
- source_word: חָכְמָה
  choice: hekima
  rationale: Tafsiri ya kawaida ya nomino hii, sambamba na ‘ufahamu.’
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi cha uchaguzi kinachounganisha vipashio viwili sambamba.
- source_word: נָתַן
  choice: aliyeipa
  rationale: Tafsiri ya kawaida katika muktadha huu; kiambishi cha yambwa kinairejelea ‘akili.’
- source_word: לַשֶּׂכְוִי
  choice: akili
  rationale: Neno hili lina utata mkubwa. Usambamba na ‘ndani ya nafsi,’ pamoja na ‘hekima’ na ‘ufahamu,’ unaunga mkono maana ya uwezo wa ndani wa kufikiri; maana ya ndege imehifadhiwa katika tanbihi.
- source_word: בִינָה
  choice: ufahamu
  rationale: Huwasilisha uwezo wa kuelewa na kutambua, huku ukidumisha utofauti wake na ‘hekima.’
theological_decisions:
- issue: Maana ya maneno mawili yenye utata yanayohusu sehemu za ndani au viumbe katika muktadha wa hotuba ya Mungu kuhusu hekima
  choice: Mstari unazungumzia Mungu kuweka hekima ndani ya nafsi na kuipa akili ufahamu.
  alternative: Huenda mstari unazungumzia sehemu zilizofichika, na Mungu kumpa jogoo—au ndege kama ibisi—ufahamu wa kiasili.
  rationale: Hili hasa ni suala la kileksika na kimuktadha, si fundisho maalumu. Usambamba wa kishairi unaunga mkono ‘nafsi’ na ‘akili,’ lakini maana ya ndege ni ya kale na ina uwezekano wa kutosha kuhifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha na usambamba wa kishairi umehifadhiwa; utata halisi wa maneno mawili ya Kiebrania umeonyeshwa kwa tanbihi.
