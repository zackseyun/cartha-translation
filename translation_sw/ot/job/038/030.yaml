lexical_decisions:
- source_word: כָּאֶבֶן
  choice: kama jiwe
  rationale: Kiambishi כָּ־ kinaonyesha ulinganisho. “Kama jiwe” huhifadhi tashbihi ya ugumu bila kudai kwamba maji yanageuka kuwa jiwe.
- source_word: מַיִם
  choice: maji
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, Kiswahili hutumia nomino ya wingi “maji” kwa kawaida na kwa ufasaha.
- source_word: יִתְחַבָּאוּ
  choice: huwa magumu
  rationale: Kitenzi hiki kwa kawaida humaanisha “kujificha,” lakini hapa, sambamba na “kama jiwe” na kuganda kwa kilindi, kinaeleza maji kuingia katika hali ngumu. Maana ya moja kwa moja imehifadhiwa katika tanbihi kwa sababu matumizi haya si ya kawaida.
- source_word: וּפְנֵי
  choice: nao uso wa
  rationale: “Uso wa” huhifadhi taswira halisi ya Kiebrania na bado hueleweka kwa kawaida kuwa sehemu ya juu ya maji.
- source_word: תְהוֹם
  choice: kilindi
  rationale: “Kilindi” ni neno la kawaida na lenye hadhi kwa wingi mkuu wa maji wenye kina; haliongezi maana za kidhehebu zinazoweza kuambatana na “shimo lisilo na mwisho.”
- source_word: יִתְלַכָּדוּ
  choice: huganda
  rationale: Mzizi una wazo la kukamatwa, kushikwa pamoja, au kufungwa. Katika muktadha wa baridi, “huganda” hutoa maana wazi na ya asili, huku mbadala wa karibu zaidi na umbo la Kiebrania ukiwekwa katika tanbihi.
