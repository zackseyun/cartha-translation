  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “Maji hujificha kama jiwe.” Kitenzi cha Kiebrania si cha kawaida hapa, na huenda kinaonyesha maji yakijiondoa na kuwa katika hali ngumu iliyoganda.
