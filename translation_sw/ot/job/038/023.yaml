lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambazo
  rationale: Kiwakilishi hiki kinaanzisha kishazi tegemezi kinachorejelea yaliyotajwa katika mstari uliotangulia; umbo la wingi linaendana na muktadha huo.
- source_word: חָשַׂכְתִּי
  choice: nimeziweka akiba
  rationale: Kitenzi kina maana ya kuzuia, kubakiza, au kuhifadhi kwa matumizi ya baadaye. “Nimeziweka akiba” huonyesha kwa kawaida kusudi la kuzihifadhi hadi wakati unaofaa.
- source_word: לְעֶת
  choice: kwa ajili ya wakati wa
  rationale: Kiambishi לְ hapa kinaonyesha kusudi au wakati uliokusudiwa, na עֵת humaanisha wakati au kipindi.
- source_word: צָר
  choice: taabu
  rationale: Neno hili huonyesha hali ya shida, dhiki, au mateso. “Taabu” ni la kawaida, lenye uzito unaofaa, na halibani maana kuliko lazima.
- source_word: לְיוֹם
  choice: kwa ajili ya siku ya
  rationale: Kauli hii ni sambamba na לְעֶת na inadumisha wazo la siku iliyotengewa kusudi hilo.
- source_word: קְרָב
  choice: mapambano
  rationale: Ni neno la kijeshi linalomaanisha pambano au vita vya moja kwa moja; “mapambano” hutofautishwa kwa kiasi na neno linalofuata.
- source_word: וּמִלְחָמָה
  choice: na vita
  rationale: Tafsiri hii inadumisha jozi ya maneno ya kijeshi yanayokaribiana kimaana badala ya kuyaunganisha kuwa wazo moja.
theological_decisions:
- issue: Matumizi ya nguvu za asili na Mungu katika taswira ya hukumu
  choice: Kudumisha maana ya moja kwa moja kwamba Mungu ameyaweka mambo haya akiba kwa nyakati za taabu na vita.
  alternative: Kuchukulia lugha hii kuwa sitiari tupu ya majaliwa ya Mungu bila rejeo halisi la kijeshi.
  rationale: Mstari wenyewe hutaja wazi “siku ya mapambano na vita.” Tafsiri inadumisha taswira hiyo bila kuipunguza wala kuieleza kupita yale yanayosemwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuweka akiba” ni usemi wa kawaida unaowasilisha kusudi la kuhifadhi kwa matumizi ya baadaye; “mapambano na vita” huhifadhi ulinganifu wa maneno mawili ya Kiebrania.
