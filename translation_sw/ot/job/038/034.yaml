base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: sw
  text: Je, unaweza kuipaza sauti yako hadi mawinguni[a], ili maji mengi yakufunike[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi kwenye wingu” au “hadi kwenye wingu zito.” Neno la Kiebrania linaweza kuwa katika umoja na linaweza kukazia wingu zito lenye mvua.
    reason: lexical_alternative
  - marker: b
    text: Au, “na maji mengi yakufunike.” Kiebrania kinaweza kuonyesha uratibu badala ya kutaja matokeo moja kwa moja; usemi huo pia unaweza kudokeza maji yanayofurika kwa wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: Je, unaweza ... kupazia
  rationale: Hifili ya רוּם katika swali hili inauliza uwezo wa kuinua sauti. Usemi wa Kiswahili ‘kupazia ... sauti’ ni wa kawaida na unafaa kwa changamoto ya Mungu kwa Ayubu.
- source_word: לָעָב
  choice: mawingu
  rationale: עָב inaweza kumaanisha wingu au wingu zito lenye mvua. Wingi ‘mawingu’ unasikika kwa kawaida katika Kiswahili kama maana ya jumla, huku uwezekano wa umoja ukihifadhiwa katika tanbihi.
- source_word: קוֹלֶךָ
  choice: sauti yako
  rationale: קוֹל hapa ni sauti ya mtu anayeliita au kuliamuru wingu; ‘sauti yako’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְשִׁפְעַת מַיִם
  choice: ili maji mengi
  rationale: שִׁפְעָה huonyesha wingi au kufurika. ‘Maji mengi’ huhifadhi wazo la kiasi kikubwa bila kulazimisha maana ya mafuriko yenye uharibifu.
- source_word: תְּכַסֶּךָּ
  choice: yakufunike
  rationale: Pieli ya כסה humaanisha kufunika, na kiambishi cha nafsi ya pili ya kiume umoja humrejelea Ayubu. ‘Yakufunike’ ni wazi na ya kawaida.
theological_decisions:
- issue: Uhusiano wa vishazi viwili
  choice: 'Kishazi cha pili kimetafsiriwa kama matokeo au kusudi: ‘ili maji mengi yakufunike.’'
  alternative: 'Kinaweza pia kusomwa kama kishazi kinachoratibiwa: ‘na maji mengi yakufunike.’'
  rationale: Muktadha ni swali la balagha kuhusu kutoweza kwa mwanadamu kuyaamuru mawingu yatoe mvua. ‘Ili’ huonyesha uhusiano unaodokezwa bila kuondoa kabisa uwezekano wa uratibu, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo ‘kuyapazia mawingu sauti yako’ ni wa asili, na swali la ‘Je’ linadumisha changamoto ya balagha.
