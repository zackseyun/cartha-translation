  text: לֶ֭/אֱחֹז בְּ/כַנְפ֣וֹת הָ/אָ֑רֶץ וְ/יִנָּעֲר֖וּ רְשָׁ מִמֶּֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/013.yaml
  text: that it might take hold of the edges of the earth[a], and the wicked be shaken out of it[b],
translation:
  language: sw
  text: 'ili iyashike miisho ya dunia[a],

    na waovu wakung’utwe kutoka humo[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembe za dunia.” Kiebrania husema kihalisi “mabawa ya dunia,” picha ya kishairi inayomaanisha miisho yake ya nje.
    reason: lexical_alternative
  - marker: b
    text: Picha hapa ni ya mapambazuko kuishika dunia na kuwakung’uta waovu kutoka humo, kama vile vumbi linavyokung’utwa kutoka kwenye nguo.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: ili iyashike
  rationale: Kitenzi-jina chenye ל kinaendeleza kusudi au matokeo kutoka mstari uliotangulia. ‘Iyashike’ huhifadhi picha halisi ya mapambazuko kushika bila kuongeza wazo la kutumia nguvu.
- source_word: בְּכַנְפוֹת
  choice: miisho ya
  rationale: כָּנָף humaanisha kihalisi ‘bawa,’ lakini katika msemo huu wa mahali hurejelea ncha au sehemu za nje kabisa. ‘Miisho’ ni ya kishairi na ya kawaida katika Kiswahili bila kulazimisha picha ya kijiometri ya pembe.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Katika muktadha huu wa ulimwengu, uumbaji, na mapambazuko, neno hilo linarejelea dunia kwa ujumla, si nchi fulani tu.
- source_word: וְיִנָּעֲרוּ
  choice: na ... wakung’utwe
  rationale: Kauli ya kutendwa ya נער inaonyesha kuondolewa kwa kukung’uta. ‘Wakung’utwe’ huhifadhi vizuri picha ya kitu kinachokung’utwa kutoka kwenye nguo au kitu kinachofanana nayo.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Hili ni jina la kundi la watu wenye uovu. ‘Waovu’ ni fupi, wazi, na huhifadhi uainishaji wa kimaadili wa Kiebrania.
- source_word: מִמֶּנָּה
  choice: kutoka humo
  rationale: Kiambishi cha kike cha umoja kinarejelea dunia. ‘Kutoka humo’ huonyesha kuondolewa kutoka katika eneo hilo bila kufanya Kiswahili kuwa kizito.
