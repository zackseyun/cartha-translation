  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: sw
  text: Je, katika siku zako, umewahi kuiamuru asubuhi, na kuifanya alfajiri ijue mahali pake?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: tangu siku zako zilipoanza, umewahi
  rationale: Muundo huu unaeleza kwa Kiswahili cha kawaida maana ya kuuliza kama Ayubu amewahi kufanya jambo hilo wakati wowote katika maisha yake, huku ukihifadhi taswira ya Kiebrania ya ‘siku zako.’
- source_word: צִוִּיתָ
  choice: umewahi kuiamuru
  rationale: Kitenzi kina maana ya kutoa amri; ‘kuamuru’ kinadumisha wazo la mamlaka juu ya uumbaji.
- source_word: בֹּקֶר
  choice: asubuhi
  rationale: ‘Asubuhi’ ni tafsiri ya kawaida na ya kishairi hapa, ikionyeshwa kana kwamba inaweza kupokea amri.
- source_word: יָדַעְתָּה
  choice: kuufahamisha
  rationale: Umbo la Kiebrania lina maana sababishi, yaani kufanya kitu kijue; ‘kuufahamisha’ huhifadhi maana hiyo kwa Kiswahili cha asili.
- source_word: שַׁחַר
  choice: mapambazuko
  rationale: ‘Mapambazuko’ yanatofautisha neno hili na ‘asubuhi’ na kudumisha usambamba wa kishairi.
- source_word: מְקוֹמוֹ
  choice: mahali pake
  rationale: Hii ni maana ya moja kwa moja; haiongezi wazo la ‘mahali palipopangwa,’ ambalo halijasemwa wazi.
