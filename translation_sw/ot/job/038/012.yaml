translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la changamoto umehifadhiwa, pamoja na uhuishaji wa asubuhi na mapambazuko. ‘Umewahi’ huleta wazi nguvu ya swali la Kiebrania bila kutumia nahau ngumu isiyo ya kawaida kwa msomaji wa leo.
