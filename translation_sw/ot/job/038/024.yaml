base_translation:
  language: en
  yaml_path: translation/ot/job/038/024.yaml
  text: By what way is light divided[b][a], or the east wind scattered over the earth?
translation:
  language: sw
  text: Ni kwa njia gani nuru hugawanywa[b][a], au upepo wa mashariki hutawanywa juu ya dunia?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Iko wapi njia ambayo nuru hugawanywa?” Kirai cha Kiebrania cha kuuliza kinaweza kueleweka kuwa kinaulizia mahali au namna.
    reason: lexical_alternative
  - marker: b
    text: Au, “umeme” badala ya “nuru”; kwa kawaida neno la Kiebrania humaanisha nuru, lakini katika muktadha huu baadhi hulielewa kwa maana finyu ya tukio la nuru linalohusiana na dhoruba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: Ni ... ipi
  rationale: Kirai hiki cha kuuliza kinaweza kuulizia mahali au namna. Pamoja na הַדֶּרֶךְ, muundo “Ni njia ipi” ni wa asili katika Kiswahili na hudumisha uwezekano wa kuelewa swali kuwa la njia au mahali.
- source_word: הַדֶּרֶךְ
  choice: njia
  rationale: דֶּרֶךְ kwa kawaida humaanisha njia; neno hili linafaa kwa swali la kishairi bila kulifanya kuwa barabara halisi.
- source_word: יֵחָלֶק
  choice: hugawanywa
  rationale: Nifali ya חלק ina maana ya kugawanywa au kutengewa mafungu. Kauli ya kutendwa “hugawanywa” ni fupi, ya kawaida, na inadumisha fumbo la picha hii.
- source_word: אוֹר
  choice: nuru
  rationale: Maana ya kawaida ya אוֹר ni nuru. Ingawa wengine huielewa kuwa umeme katika muktadha wa dhoruba, “nuru” haibani maana isivyo lazima.
- source_word: יָפֵץ
  choice: hutawanywa
  rationale: Hifili ya פוץ hutoa maana ya kutawanya au kusambaza. “Hutawanywa” inalingana na taswira ya upepo kuenea sehemu mbalimbali.
- source_word: קָדִים
  choice: upepo wa mashariki
  rationale: קָדִים mara nyingi humaanisha upepo wa mashariki, hasa katika muktadha wa hali ya hewa, wala si upande wa mashariki pekee.
- source_word: עֲלֵי אָרֶץ
  choice: juu ya dunia
  rationale: Kirai hiki kinaweza kumaanisha juu ya dunia au nchi. “Dunia” inafaa upeo mpana wa hotuba ya Mungu katika Ayubu 38.
