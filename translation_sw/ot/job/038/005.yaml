translation:
  language: sw
  text: Ni nani aliyeweka vipimo vyake, ikiwa unajua, au ni nani aliyenyoosha kamba ya kupimia[a] juu yake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mstari wa kupimia.”
