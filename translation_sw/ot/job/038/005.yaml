lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha la Mungu.
- source_word: שָׂם
  choice: aliyeweka
  rationale: Kitenzi hiki humaanisha kuweka au kuamua; hapa kinafaa kwa picha ya kuainisha vipimo vya dunia.
- source_word: מְמַדֶּיהָ
  choice: vipimo vyake
  rationale: Wingi wenye kiambishi cha nafsi ya kike unarejelea dunia katika muktadha na unaendeleza taswira ya ujenzi.
- source_word: כִּי תֵדָע
  choice: ikiwa unajua
  rationale: Huhifadhi muundo wa sharti unaowezekana katika Kiebrania na kejeli ya swali bila kuifafanua kupita kiasi.
- source_word: אוֹ
  choice: Au
  rationale: Kiunganishi cha uchaguzi kinaunganisha swali la pili linalofanana na la kwanza.
- source_word: נָטָה
  choice: aliyenyoosha
  rationale: Katika taswira ya ujenzi, kitenzi kinaeleza kunyoosha kamba kwa ajili ya kupima.
- source_word: עָלֶיהָ
  choice: juu yake
  rationale: Huhifadhi uhusiano wa mahali na dunia kama rejeleo la kiambishi.
- source_word: קָּו
  choice: kamba
  rationale: Katika muktadha wa ujenzi, neno hili ni kamba au mstari wa kupimia; 'kamba' ni taswira ya kawaida na halisi katika Kiswahili.
