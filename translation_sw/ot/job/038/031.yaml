  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: sw
  text: Je, unaweza kufunga vifungo[a][b] vya Kilimia, au kulegeza kamba za Orioni?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikanda”; Kiebrania kinatumia taswira zinazohusiana za vifungo au miunganiko ya angani.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya tafsiri za zamani hutafsiri מַעֲדַנּוֹת kuwa “mivuto mitamu,” lakini huenda Kiebrania kinamaanisha vifungo, mikanda, au miunganiko.
    reason: lexical_alternative
  - marker: c
    text: כְּסִיל hapa huenda ni kundinyota la Orioni; mahali pengine neno hilo linaweza kumaanisha “mpumbavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְקַשֵּׁר
  choice: unaweza kufunga
  rationale: Kiulizi pamoja na kitenzi cha nafsi ya pili ya umoja huunda swali la balagha kuhusu kutoweza kwa mwanadamu; “kufunga” ni la kawaida na linadumisha taswira ya kufungamanisha.
- source_word: מַעֲדַנּוֹת
  choice: vifungo
  rationale: Nomino hii adimu huenda inamaanisha vifungo au mikanda inayounganisha. “Vifungo” huhifadhi maana pana bila kuifanya kwa lazima kuwa minyororo ya chuma.
- source_word: כִּימָה
  choice: Kilimia
  rationale: Hili ni jina la kundi la nyota linalotambuliwa kuwa Pleiades; “Kilimia” ni jina la kawaida la Kiswahili la kundi hilo.
- source_word: מֹשְׁכוֹת
  choice: kamba
  rationale: Neno hilo huonyesha vitu vya kuvutia au kufungia; “kamba” ni halisi, wazi, na linafaa sambamba na “vifungo.”
- source_word: כְּסִיל
  choice: Orioni
  rationale: Katika muktadha huu wa nyota, neno hilo linaeleweka kuwa kundinyota la Orion, si maana yake ya kawaida ya “mpumbavu.”
- source_word: תְּפַתֵּחַ
  choice: kulegeza
  rationale: Ingawa maana ya msingi ni “kufungua,” likiwa na kamba linamaanisha kuzilegeza au kuzifungua; “kulegeza” linadumisha ulinganifu na “kufunga.”
