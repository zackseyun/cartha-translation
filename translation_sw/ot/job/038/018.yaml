lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: umefahamu
  rationale: Kitenzi hiki kina wazo la kutambua kwa makini au kuelewa; “umefahamu” huwasilisha swali kuhusu ufahamu kamili, si kuona tu.
- source_word: רַחֲבֵי אָרֶץ
  choice: mapana yote ya dunia
  rationale: Wingi wa רַחֲבֵי unaonyesha maeneo au vipimo vipana vya dunia; “mapana yote” ni Kiswahili cha kawaida kinachohifadhi wazo la ukubwa mpana.
- source_word: הַגֵּד
  choice: Niambie
  rationale: Amri hii kihalisi ni “sema/eleza”; katika muktadha wa Mungu kumhoji Ayubu, “Niambie” ni ya asili na hudumisha nguvu ya changamoto.
- source_word: כֻּלָּהּ
  choice: yote
  rationale: Kiambishi cha kike kinarejelea “dunia”; “yote” huhifadhi maana ya kuijua dunia hiyo kwa ujumla bila kuongeza “mambo haya.”
theological_decisions:
- issue: Upeo wa maarifa ya Ayubu unaopinganishwa na maarifa ya Mungu
  choice: ikiwa unayajua yote
  alternative: ikiwa unajua yote kuhusu hayo
  rationale: Urejeo wa kiwakilishi cha Kiebrania unaelekezwa kwa “dunia” na unasisitiza jumla yake; tafsiri haiongezi maelezo ya kiteolojia yasiyokuwapo katika mstari.
translation_notes:
  register: Lugha ni sanifu, yenye heshima na inayoeleweka kwa wasomaji wa kawaida wa Afrika Mashariki. Muundo wa maswali mawili umehifadhi sauti ya Mungu ya kumhoji Ayubu.
