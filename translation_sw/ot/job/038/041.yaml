  text: מִ֤י יָכִ֥ין לָ/עֹרֵ֗ב צֵ֫יד֥/וֹ כִּֽי ילד/ו אֶל אֵ֣ל יְשַׁוֵּ֑עוּ יִ֝תְע֗וּ לִ/בְלִי אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: sw
  text: Ni nani anayemwandalia kunguru mawindo yake, wakati makinda yake yanapomlilia Mungu na kutangatanga kwa kukosa chakula?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayempa kunguru chakula.” Kitenzi cha Kiebrania humaanisha “kutayarisha” au “kutoa,” na “mawindo” yanaweza kutafsiriwa kwa ujumla zaidi kuwa “chakula.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu makinda yake yanamlilia Mungu.” Kiunganishi kinaweza kueleweka kwa maana ya sababu (“kwa sababu”) badala ya wakati (“wakati”).
    reason: lexical_alternative
  - marker: c
    text: Au, “kuzurura” au “kupotea.” Kitenzi cha Kiebrania kinaweza kumaanisha kutangatanga au kupotea katika kutafuta chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha katika hotuba ya Mungu.
- source_word: יָכִין
  choice: anayemwandalia
  rationale: Hifili ya כון hapa humaanisha kufanya kitu kiwe tayari au kukitoa kwa ajili ya mhusika; ‘anamwandalia’ ni ya asili katika Kiswahili na huonyesha kuwa kunguru ndiye mnufaika.
- source_word: לָעֹרֵב
  choice: kunguru
  rationale: Kihusishi ל huonyesha mnufaika na tayari kimewakilishwa katika muundo ‘anamwandalia’; umoja huu unamtaja kunguru kama mwakilishi wa aina yake.
- source_word: צֵידוֹ
  choice: mawindo yake
  rationale: ציד humaanisha mawindo au chakula kinachopatikana kwa kuwinda. ‘Mawindo yake’ huhifadhi taswira halisi ya mnyama na kiambishi cha nafsi ya tatu katika Kiebrania.
- source_word: כִּי
  choice: wakati ... yanapom-
  rationale: כִּי inaeleweka hapa kuwa inaanzisha hali ya wakati ambamo hitaji la kunguru linaonekana, huku uwezekano wa maana ya kisababishi ukihifadhiwa katika tanbihi.
- source_word: ילדיו
  choice: makinda yake
  rationale: Neno lenye kiambishi linamaanisha watoto wa kunguru; ‘makinda’ ni neno la kawaida kwa watoto wa ndege.
- source_word: אֶל־אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la kawaida la Mungu, si lazima jina maalumu la kutoholewa; kihusishi אֶל kimeonyeshwa na muundo wa kitenzi ‘kumlilia’.
- source_word: יְשַׁוֵּעוּ
  choice: yanapomlilia
  rationale: Pieli ya שוע humaanisha kulia au kuita ili kupata msaada. ‘Kumlilia’ huhifadhi mwito wenye dhiki bila kuongeza maelezo yasiyo katika matini.
- source_word: יִתְעוּ
  choice: kutangatanga
  rationale: Kitenzi תעה kinaweza kumaanisha kutangatanga au kupotea; katika muktadha wa ndege wenye njaa, ‘kutangatanga’ huonyesha kuzurura wakitafuta chakula.
- source_word: לִבְלִי אֹכֶל
  choice: kwa kukosa chakula
  rationale: Kirai kinaonyesha ukosefu wa chakula na uhusiano wake na kutangatanga; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
