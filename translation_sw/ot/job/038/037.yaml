  text: מִֽי יְסַפֵּ֣ר שְׁחָקִ֣ים בְּ/חָכְמָ֑ה וְ/נִבְלֵ֥י שָׁ֝מַ֗יִם מִ֣י יַשְׁכִּֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/037.yaml
  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: sw
  text: Ni nani awezaye kuyahesabu mawingu kwa hekima, au ni nani awezaye kuviinamisha viriba vya mbinguni?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mitungi ya mbinguni.” Neno la Kiebrania humaanisha kiriba, chupa ya ngozi, au chombo kingine; hapa ni taswira ya vyombo vya angani vinavyohifadhi mvua.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha kuhusu uwezo ambao ni wa Mungu pekee katika muktadha.
- source_word: יְסַפֵּר
  choice: awezaye kuyahesabu
  rationale: Kitenzi ספר katika piel hapa humaanisha kuhesabu au kuweka idadi; muundo wa ‘awezaye’ unaonyesha vizuri nguvu ya swali la balagha.
- source_word: שְׁחָקִים
  choice: mawingu
  rationale: Katika ushairi wa Kiebrania neno hili linaweza kumaanisha anga au mawingu; muktadha wa mvua katika mistari inayozunguka unaunga mkono ‘mawingu.’
- source_word: בְּחָכְמָה
  choice: kwa hekima
  rationale: Huhifadhi maana ya namna au chombo ya kihusishi ב pamoja na חָכְמָה kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: viriba vya mbinguni
  rationale: נֵבֶל ni kiriba, chupa ya ngozi, au chombo cha kuhifadhia. ‘Viriba’ huhifadhi taswira halisi ya vyombo vya angani vyenye mvua bila kuongeza neno ‘maji,’ ambalo halipo wazi katika chanzo.
- source_word: יַשְׁכִּיב
  choice: kuviinamisha
  rationale: Hiphil ya שכב kwa msingi ni ‘kusababisha vilale’; inapotumiwa kuhusu vyombo, kuviinamisha ili vimwage vilivyomo huwasilisha taswira hiyo kwa njia ya asili.
theological_decisions:
- issue: Nguvu ya swali la balagha
  choice: Muundo wa ‘Ni nani awezaye...?’
  alternative: Tafsiri kama dai la moja kwa moja kwamba Mungu pekee anaweza
  rationale: Swali la Kiebrania limehifadhiwa bila kuligeuza kuwa kauli ya ufafanuzi, hivyo mvutano na athari ya hotuba ya Mungu vinaendelea kuwapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Viriba’ limetumiwa kuhifadhi picha ya kishairi ya Kiebrania; tanbihi inafafanua mbadala unaoeleweka zaidi kwa baadhi ya wasomaji.
