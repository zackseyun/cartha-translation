base_translation:
  language: en
  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: sw
  text: Waovu hunyimwa nuru yao, na mkono ulioinuliwa[a] huvunjwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “mkono” huenda unawakilisha nguvu au uwezo, hasa nguvu ya jeuri.
    reason: lexical_alternative
  - marker: b
    text: Au, “mkono ulioinuliwa utavunjwa.” Imperfect ya Kiebrania inaweza kueleweka kuwa ya wakati ujao, na pia kuwa ya sasa wenye uhai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: inazuiliwa
  rationale: Niphal ya kitenzi מנע ina maana ya kuzuiwa au kunyimwa; umbo la kutendwa linahifadhiwa.
- source_word: מֵרְשָׁעִים
  choice: kutoka kwa waovu
  rationale: 'Kihusishi מִן kinaonyesha kutengwa au kunyimwa: nuru yao inaondolewa kwa watu waovu.'
- source_word: אוֹרָם
  choice: nuru yao
  rationale: Kiambishi cha nafsi ya tatu wingi kinahifadhiwa moja kwa moja; katika muktadha ni nuru ambayo waovu wangeifurahia.
- source_word: וּזְרוֹעַ
  choice: na mkono
  rationale: זְרוֹעַ ni mkono, na hapa inaashiria pia nguvu au uwezo; taswira halisi imehifadhiwa katika matini.
- source_word: רָמָה
  choice: ulioinuliwa
  rationale: Neno linaeleza mkono ulio juu, picha inayoweza kudokeza kiburi au nguvu ya kufanya jeuri bila kulazimisha maana moja.
- source_word: תִּשָּׁבֵר
  choice: unavunjwa
  rationale: Niphal imperfect inaweza kueleweka kama hali ya sasa iliyo hai katika ushairi; umbo la kutendwa linahifadhiwa.
theological_decisions:
- issue: Maana ya mfano wa mkono ulioinuliwa
  choice: Taswira ya “mkono” imehifadhiwa katika matini, huku tanbihi ikitaja uwezekano wa kuwakilisha nguvu, hasa nguvu ya jeuri.
  alternative: Kutafsiri moja kwa moja kuwa “nguvu ya jeuri.”
  rationale: Kiebrania kinatumia taswira halisi ya mkono; kuiweka wazi kuwa nguvu pekee kungeondoa utata na nguvu ya kishairi.
- issue: Wakati wa תִּשָּׁבֵר
  choice: 'Wakati wa sasa wa kishairi: “unavunjwa.”'
  alternative: 'Wakati ujao: “utavunjwa.”'
  rationale: Imperfect ya Kiebrania inaweza kuwa ya sasa wenye uhai au ya wakati ujao; matini kuu inafuata maelezo ya kishairi ya kile mapambazuko hufanya, na tanbihi inalinda uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Mpangilio umewekwa karibu na ushairi wa Kiebrania; “mkono ulioinuliwa” huhifadhi taswira na mvutano wa maana.
