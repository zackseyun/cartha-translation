translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa maswali mawili na taswira ya uzazi vimehifadhiwa; “sakafu” limetumiwa kwa maana ya tabaka jeupe la fuwele za barafu, si sehemu ya chini ya nyumba.
