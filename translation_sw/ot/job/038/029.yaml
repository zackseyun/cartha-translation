  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: sw
  text: Barafu ilitoka tumboni mwa nani? Na ni nani aliyezaa umande wa barafu wa mbinguni?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barafu ya mbinguni.”
    reason: Mbadala wa leksia kwa כְּפוֹר שָׁמַיִם; כְּפוֹר inaweza kurejelea barafu nyepesi au umande wa barafu.
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: katika tumbo la nani
  rationale: Neno בֶּטֶן linaweza kumaanisha tumbo au tumbo la uzazi. Katika swali hili la kishairi, “tumbo la nani” ni Kiswahili cha kawaida kinachohifadhi taswira ya kuzaliwa inayounganisha vipande vyote viwili.
- source_word: יָצָא
  choice: ilitoka
  rationale: Kitenzi hiki humaanisha kutoka. “Ilitoka” ni cha asili na wazi katika Kiswahili, huku taswira ya kuzaliwa ikibebwa na “tumbo” na kitenzi kinachofuata, “aliyeizaa.”
- source_word: הַקָּרַח
  choice: barafu
  rationale: קֶרַח humaanisha barafu. Kiswahili hakihitaji kiwakilishi maalumu cha uamilifu kinacholingana na ha- ya Kiebrania hapa.
- source_word: וּכְפֹר שָׁמַיִם
  choice: sakafu ya mbinguni
  rationale: כְּפוֹר ni tabaka la fuwele za barafu linalotokea kwa kuganda kwa umande au mvuke; “sakafu” ni neno la kawaida la Kiswahili kwa hali hiyo. “Ya mbinguni” inahifadhi muundo wa uhusiano na taswira pana ya שָׁמַיִם.
- source_word: יְלָדוֹ
  choice: aliyeizaa
  rationale: ילד katika Qal hapa ina maana ya kuzaa. “Aliyeizaa” huhifadhi sitiari ya uzazi na kiambishi cha kitu cha kiume kinachorejelea sakafu.
