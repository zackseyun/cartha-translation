  yaml_path: translation/ot/job/038/019.yaml
  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: sw
  text: Iko wapi njia iendayo kwenye makao ya nuru, na giza—mahali pake ni wapi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Ni ipi njia ambamo nuru hukaa, na giza—mahali pake ni wapi?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: Iko wapi / ni wapi
  rationale: Kirai hiki cha kuuliza kinatafuta njia au mahali. Miundo hii ni ya kawaida katika Kiswahili na inadumisha urudiaji wa swali katika mistari miwili.
- source_word: הַדֶּרֶךְ
  choice: njia
  rationale: Neno דֶּרֶךְ lina maana ya njia, barabara, au mapito; “njia” ni pana na linafaa kwa njia ya kufikia makao ya nuru.
- source_word: יִשְׁכָּן
  choice: iendayo kwenye makao
  rationale: Kitenzi שׁכן humaanisha kukaa au kuishi. Tafsiri hii inahifadhi taswira ya nuru kuwa na makao, huku ikiunganisha “njia” kwa kawaida na mwisho inakoelekea.
- source_word: אוֹר
  choice: nuru
  rationale: “Nuru” ni neno la kawaida na lenye hadhi kwa אור, katika utofautishaji wa nuru ya ulimwengu na giza.
- source_word: וְחֹשֶׁךְ
  choice: na giza
  rationale: Inahifadhi kiunganishi na ulinganifu wa kishairi kati ya nuru na giza.
- source_word: מְקוֹמוֹ
  choice: mahali pake
  rationale: מָקוֹם ni “mahali,” na kiambishi cha nafsi ya tatu umoja kinarejelea giza; “mahali pake” kinahifadhi umilikaji huo waziwazi.
