  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
translation:
  language: sw
  text: Nikafanya kusema, “Utafika mpaka hapa, wala hutakwenda mbali zaidi; hapa mawimbi yako yenye kiburi yatasimamishwa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hapa ndipo kiburi cha mawimbi yako kitawekwa.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kuweka” au “kutia”; umbo la kishazi hiki ni la tendi, lakini uhusiano wake kamili na “kiburi cha mawimbi yako” una utata. Katika muktadha, mstari unaonyesha mawimbi ya bahari yakizuiwa yasivuke mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: nikasema
  rationale: Kitenzi cha nafsi ya kwanza umoja kinaendeleza mfululizo wa simulizi katika hotuba ya Mungu; wakati uliopita wa Kiswahili unaonyesha vizuri tendo hilo.
- source_word: עַד פֹּה
  choice: mpaka hapa
  rationale: Kirai hiki kinaweka mpaka wa mahali. “Mpaka hapa” ni Kiswahili cha kawaida na huhifadhi maana ya mpaka uliowekwa.
- source_word: תָבוֹא
  choice: utafika
  rationale: Nafsi ya pili umoja inalielekea bahari kwa uhuishaji wa kishairi. “Utafika” huonyesha kikomo ambacho bahari imeruhusiwa kufikia.
- source_word: וְלֹא תֹסִיף
  choice: wala hutakwenda mbali zaidi
  rationale: Hifili ya יסף ina maana ya kuongeza au kuendelea. Katika muktadha wa mpaka, tafsiri hii inaeleza kwa kawaida kwamba bahari haitaruhusiwa kuvuka kikomo hicho.
- source_word: וּפֹא
  choice: hapa
  rationale: Kielezi hiki cha mahali kinarudia na kusisitiza mahali hasa ambapo nguvu za bahari zinazuiwa.
- source_word: יָשִׁית
  choice: yatasimamishwa
  rationale: Kitenzi kina maana ya kuweka au kutia. Katika muktadha huu kinaonyesha kwamba mawimbi yanawekewa kikomo na kuzuiwa yasiendelee; umbo la kutendwa huepuka kuongeza mtendaji ambaye hajatajwa wazi katika kishazi.
- source_word: בִּגְאוֹן
  choice: yenye kiburi
  rationale: גאון inaweza kumaanisha kiburi, ukuu, au fahari. Pamoja na mawimbi makali ya bahari, “yenye kiburi” huhifadhi taswira ya kishairi ya nguvu inayojivuna.
- source_word: גַּלֶּיךָ
  choice: mawimbi yako
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya pili umoja inarejelea mawimbi ya bahari; “mawimbi” ni neno wazi na la kawaida katika Kiswahili.
theological_decisions:
- issue: Bahari kupewa sifa za kiumbe kinachosemeshwa chini ya amri ya Mungu
  choice: Kudumisha usemi wa nafsi ya pili kwa bahari na lugha ya kuweka mpaka
  alternative: Kuiondoa taswira hiyo na kuieleza bahari kama nguvu ya asili isiyoelekezewa maneno
  rationale: Kiebrania kinaiambia bahari moja kwa moja “utafika” na “hutakwenda,” jambo linalosisitiza mamlaka ya Mungu juu ya uumbaji. Uhuishaji huu wa kishairi hauonyeshi kwamba bahari ni mungu au mpinzani wa kimungu.
- issue: Uhusiano wa kisarufi kati ya יָשִׁית na בִּגְאוֹן גַּלֶּיךָ
  choice: Kutoa maana ya mawimbi kuzuiwa, huku tanbihi ikihifadhi maana halisi na uwezekano mwingine wa kisarufi
  alternative: Kutafsiri moja kwa moja “hapa kiburi cha mawimbi yako kitawekwa”
  rationale: Kishazi cha Kiebrania ni kifupi na kina mvutano wa kisarufi; tafsiri ya moja kwa moja sana si ya kawaida kwa Kiswahili. Maana ya mpaka unaozuia mawimbi iko wazi katika muktadha, lakini tanbihi inalinda kutokuwa na uhakika kuhusu namna hasa ya kuhusisha kitenzi na “kiburi/ukuu wa mawimbi.”
translation_notes:
  register: Lugha ni ya sasa, yenye hadhi, na inayoeleweka kote Afrika Mashariki. “Wala hutakwenda mbali zaidi” ni ya kawaida kuliko tafsiri halisi ya “wala hutaongeza,” huku uhuishaji wa bahari na taswira ya “mawimbi yenye kiburi” vikihifadhi ushairi wa chanzo.
