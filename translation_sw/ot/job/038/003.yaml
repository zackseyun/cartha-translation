base_translation:
  language: en
  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: sw
  text: Basi, jifunge viuno kama mwanamume[a]; nitakuuliza, nawe unijulishe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jiandae kama shujaa.” Kiebrania husema kihalisi, “jifunge viuno kama mwanamume,” nahau ya kujiandaa kwa uthabiti.
    reason: lexical_alternative
  - marker: b
    text: Au, “nawe unifanye nijue.” Tafsiri za kimapokeo mara nyingi zina “nawe unijibu,” lakini kitenzi cha Kiebrania hapa maana yake ya msingi ni “fanya nijue.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא
  choice: Jifunge
  rationale: Kitenzi kinaonyesha kufunga vazi au mshipi kiunoni ili kujiandaa kwa uthabiti. Kauli ya amri pamoja na נָא hapa ina msisitizo wa changamoto; Kiswahili cha amri kinawasilisha nguvu hiyo bila kuongeza neno la wakati.
- source_word: כְגֶבֶר
  choice: kama mwanamume
  rationale: גֶּבֶר humaanisha mwanamume, mara nyingi ikiwa na wazo la nguvu au ushujaa. Tafsiri hii inahifadhi taswira ya kiume ya Kiebrania, huku tanbihi ikionyesha maana inayowezekana ya 'shujaa'.
- source_word: חֲלָצֶיךָ
  choice: viuno
  rationale: Neno hili hurejelea eneo la kiuno. 'Jifunge viuno' huhifadhi taswira halisi na ni nahau inayoeleweka ya kujiandaa kwa uthabiti.
- source_word: וְאֶשְׁאָלְךָ
  choice: nitakuuliza
  rationale: שׁאל ni 'kuuliza.' Katika muktadha huu ni kuuliza maswali ya changamoto, lakini 'nitakuuliza' ni ya kawaida na haiingizi wazo la mahakama lisilo wazi katika kitenzi chenyewe.
- source_word: וְהוֹדִיעֵנִי
  choice: nawe unijulishe
  rationale: Hifili ya ידע humaanisha 'kusababisha kujua' au 'kujulsisha.' 'Unijulishe' ni ya moja kwa moja na ya asili kuliko kutafsiri kwa tafsiri pana ya 'unijibu.'
theological_decisions:
- issue: Usemi wa kijinsia katika changamoto ya Mungu
  choice: kama mwanamume
  alternative: kama shujaa
  rationale: Kiebrania kinatumia nomino ya kiume גֶבֶר. Tafsiri inaihifadhi badala ya kuifanya isiyo na jinsia. Katika muktadha huu usemi huo ni mwito wa kujiandaa kwa ujasiri, wala si fundisho kuhusu ubora wa wanaume.
- issue: Mungu kuomba ajulishwe
  choice: nawe unijulishe
  alternative: nawe unijibu
  rationale: Tafsiri inahifadhi namna ya usemi wa Kiebrania, 'sababisha nijue,' bila kuufanya kuwa dai kwamba Mungu hana maarifa. Katika muktadha, huu ni usemi wa changamoto unaomtaka Ayubu atoe maelezo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau halisi 'jifunge viuno' imehifadhiwa na kufafanuliwa kwa tanbihi; mtiririko wa sentensi umewekwa wa kawaida kwa Kiswahili.
