base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: sw
  text: Je, unajua sheria za mbingu? Je, unaweza kuweka utawala wake duniani?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mamlaka yake” au “enzi yake” badala ya “utawala wake.” Kiambishi cha Kiebrania ni cha umoja (“wake”), na huenda kinarejelea mbingu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Je, unajua
  rationale: Kiambishi cha swali pamoja na kitenzi katika kauli timilifu hapa kinauliza kuhusu hali ya ufahamu ya sasa; usemi huu ni wa kawaida na huhifadhi nguvu ya swali la Mungu.
- source_word: חֻקּוֹת
  choice: sheria
  rationale: Neno hili linaonyesha masharti au mipaka iliyowekwa. Katika muktadha wa ulimwengu, “sheria” linaeleweka kwa urahisi kuwa utaratibu thabiti unaotawala mbingu bila kulifanya kuwa sheria ya wanadamu.
- source_word: שָׁמָיִם
  choice: mbingu
  rationale: “Mbingu” ni neno la kawaida la Kiswahili lenye maana ya anga au eneo la kimbingu, na linafaa kwa mtindo ulioinuliwa wa kifungu.
- source_word: אִם
  choice: Je, unaweza
  rationale: Hapa neno hili linaanzisha swali la pili linalolingana na la kwanza; tafsiri ya uwezo huwasilisha changamoto ya balagha kwa Kiswahili cha kawaida.
- source_word: תָּשִׂים
  choice: kuweka
  rationale: Maana ya msingi ni kuweka au kuanzisha. “Kuweka” huhifadhi taswira pana ya kuifanya mamlaka hiyo itende kazi bila kuongeza maana isiyo wazi katika Kiebrania.
- source_word: מִשְׁטָרוֹ
  choice: mamlaka yake
  rationale: Nomino hii humaanisha utawala, mamlaka, au enzi. Kiambishi cha Kiebrania ni cha umoja, kwa hiyo “yake” huhifadhi umbo hilo na kuruhusu “mbingu” kueleweka kwa ujumla kama kitu kimoja.
- source_word: בָאָרֶץ
  choice: juu ya dunia
  rationale: Katika muktadha huu kihusishi kinaonyesha eneo la kidunia linalokuwa chini ya mamlaka hiyo; “juu ya dunia” ni usemi wa asili na wazi.
theological_decisions:
- issue: Aina ya utaratibu wa mbingu unaokusudiwa
  choice: Mstari unasema kuhusu sheria thabiti za Mungu katika ulimwengu na mamlaka ya mbingu juu ya dunia, bila kubainisha imani ya kwamba nyota huamua matukio ya wanadamu.
  alternative: Kuufasiri mstari kuwa unafundisha moja kwa moja ushawishi wa unajimu au wa makundi ya nyota juu ya mambo ya duniani.
  rationale: Muktadha unahusu nyota na mbingu, lakini maneno ya Kiebrania yanasisitiza masharti yaliyowekwa na mamlaka. Tafsiri inadumisha lugha hiyo ya utawala wa ulimwengu bila kuingiza madai makali zaidi kuhusu unajimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili umehifadhiwa ili kuonyesha changamoto ya balagha. “Sheria za mbingu” ni rahisi kueleweka kuliko “maagizo ya mbingu,” huku “mamlaka yake” ikihifadhi kwa makusudi kiambishi cha umoja cha Kiebrania.
