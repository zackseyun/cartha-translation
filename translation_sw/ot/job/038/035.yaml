base_translation:
  language: en
  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: sw
  text: Je, unaweza kutuma miale ya radi[a], ikaenda na kukuambia, “Tupo hapa”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “radi.” Kiebrania kina nomino ya wingi, kikionyesha miale hiyo kana kwamba ni wajumbe watiifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: Je, unaweza kuituma
  rationale: Kiulizi הֲ pamoja na kitenzi cha Hifili cha nafsi ya pili umoja kinaunda swali la balagha linalomhusu Ayubu na uwezo wake. “Je, unaweza kuituma” ni ya kawaida katika Kiswahili na huhifadhi changamoto hiyo.
- source_word: בְּרָקִים
  choice: miale ya radi
  rationale: Nomino hii iko katika wingi na humaanisha miale au mipigo ya radi. “Miale ya radi” huonyesha wingi kwa Kiswahili cha kawaida na kuwezesha taswira inayofuata ya radi kama wajumbe wanaotii.
- source_word: וְיֵלֵכוּ
  choice: ikaenda
  rationale: Waw pamoja na kitenzi kisichotimilika huendeleza matokeo ya kutumwa. “Ikaenda” huwasilisha mfuatano huo kwa ufupi na kwa Kiswahili cha asili.
- source_word: וְיֹאמְרוּ לְךָ
  choice: na kukuambia
  rationale: Tafsiri hii huhifadhi usemi unaoelekezwa kwa Ayubu na uhuishaji wa miale ya radi, huku ikiunda sentensi ya kawaida ya Kiswahili.
- source_word: הִנֵּנוּ
  choice: Tupo hapa
  rationale: Huu ni mwitikio wa wingi unaoonyesha kuwapo na utayari wa mara moja. “Tupo hapa” ni wa sasa, unaeleweka, na hauna ladha ya kizamani.
theological_decisions:
- issue: Uhuishaji wa radi katika hotuba ya Mungu
  choice: Kudumisha picha ya miale ya radi inayokwenda na kusema, “Tupo hapa.”
  alternative: Kuondoa uhuishaji na kueleza tu kwamba matukio ya asili yako chini ya amri ya Mungu.
  rationale: Kiebrania kinazipa radi mwendo na usemi kama wajumbe watiifu. Kudumisha picha hiyo huhifadhi nguvu ya kishairi ya swali kuhusu mamlaka ya Mungu juu ya uumbaji bila kudai kwamba radi zina ufahamu halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa swali la balagha na uhuishaji wa radi vimehifadhiwa bila kutumia lugha ya kizamani.
