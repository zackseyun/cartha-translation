  text: 'nilipolifanya wingu kuwa vazi lake,

    na giza nene kuwa kitambaa cha kumfunga kama mtoto mchanga,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: nilipolifanya ... kuwa
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi ya kwanza una maana ya wakati, ‘nilipoweka/nilipofanya.’ Kiswahili cha ‘nilipolifanya ... kuwa’ ni cha asili na kinaonyesha tendo la Mungu.
- source_word: עָנָן
  choice: wingu
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa עָנָן.
- source_word: לְבֻשׁוֹ
  choice: vazi lake
  rationale: ‘Vazi’ linahifadhi taswira ya mavazi; kiambishi ‘lake’ kinarejelea bahari katika muktadha.
- source_word: וַעֲרָפֶל
  choice: na giza nene
  rationale: עֲרָפֶל hudokeza giza zito au hali ya anga yenye giza; ‘giza nene’ linahifadhi uzito wa kishairi.
- source_word: חֲתֻלָּתוֹ
  choice: kitambaa chake cha kumfunikia mtoto mchanga
  rationale: Neno linahusiana na kufunga au kumfunika mtoto mchanga. Ufafanuzi huu wa asili katika Kiswahili unahifadhi taswira ya kuzaliwa inayotawala muktadha, ingawa ni mrefu kuliko Kiebrania.
