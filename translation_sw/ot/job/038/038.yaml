translation:
  language: sw
  text: wakati mavumbi yanapoganda na kuwa donge gumu[a], na mabonge ya udongo yanaposhikamana?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati mavumbi yanapomiminwa yakawa magumu,” au “wakati mavumbi yanakuwa magumu kama kitu kilichosubiwa.” Kiebrania kinatumia taswira ya kumimina au kusubu kueleza ardhi inayoganda na kushikana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: wakati ... yanapoganda
  rationale: Muundo huu unaanzisha kishazi cha wakati. Kitenzi kina taswira ya kumimina au kusubu na pia matokeo ya kuwa imara; katika muktadha wa mavumbi na mabonge ya udongo, ‘yanapoganda’ huwasilisha udongo kulegea kisha kushikana bila kudai kwamba unamiminwa kihalisi.
- source_word: עָפָר
  choice: mavumbi
  rationale: Neno hili humaanisha mavumbi au udongo mkavu uliolegea. ‘Mavumbi’ ni neno la kawaida na linafaa kwa hali ya ardhi inayobadilishwa na maji.
- source_word: לַמּוּצָק
  choice: kuwa donge moja
  rationale: Neno linalotokana na יצק linaweza kuelekeza kwenye kitu kilichomiminwa au kusubiwa na kuwa kigumu. ‘Kuwa donge moja’ linaonyesha matokeo ya mavumbi kuungana kuwa kitu kilichoshikana, huku taswira nyingine ikihifadhiwa katika tanbihi.
- source_word: וּרְגָבִים
  choice: na mabonge ya udongo
  rationale: רְגָבִים ni mabonge au mafungu ya udongo. Kirai hiki ni wazi na cha kawaida katika Kiswahili.
- source_word: יְדֻבָּקוּ
  choice: kushikamana
  rationale: Umbo la kitenzi linaonyesha mabonge kuambatana au kuunganishwa. ‘Kushikamana’ huhifadhi picha ya kimwili kwa lugha ya kawaida.
