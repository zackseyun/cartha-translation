  text: Have you come to the springs of the sea[b][a], or walked in the recesses of the deep?
translation:
  language: sw
  text: Je, umefika mpaka chemchemi za bahari[a], au umetembea katika sehemu za ndani kabisa za kilindi[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyanzo vya bahari.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika sehemu za mbali kabisa za kilindi,” au “katika maficho ya kilindi.” Neno la Kiebrania linaweza pia kuhusisha upeo wa kilindi unaofikiwa kwa uchunguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ
  choice: Je, umefika
  rationale: Kitenzi בוא katika swali hili kinaonyesha kufika mahali; ‘umefika’ ni Kiswahili cha kawaida na kinahifadhi changamoto ya moja kwa moja kwa Ayubu.
- source_word: עַד
  choice: kwenye
  rationale: Kihusishi hiki kinaonyesha mwendo unaofikia mahali fulani; pamoja na ‘umefika,’ ‘kwenye’ ni cha asili katika Kiswahili.
- source_word: נִבְכֵי
  choice: chemchemi
  rationale: Neno linaweza kumaanisha vyanzo au mahali maji yanapotokea. ‘Chemchemi’ linatoa taswira halisi ya vyanzo vilivyofichika vya bahari, huku maana mbadala ikitajwa katika tanbihi.
- source_word: יָם
  choice: bahari
  rationale: Ni nomino ya kawaida inayomaanisha bahari, si jina maalumu katika muktadha huu.
- source_word: וּבְחֵקֶר
  choice: au ... katika sehemu za ndani kabisa
  rationale: חֵקֶר linaweza kuhusiana na kuchunguza, mpaka wa uchunguzi, au sehemu za ndani zisizofikika. Katika ulinganifu huu wa kishairi, ‘sehemu za ndani kabisa’ linaeleza mahali pa siri pasipoweza kufikiwa bila kurudia tu wazo la ‘kilindi.’ Kiunganishi kimetafsiriwa ‘au’ ili kuwasilisha maswali mawili sambamba.
- source_word: תְּהוֹם
  choice: kilindi
  rationale: ‘Kilindi’ linafaa kwa kina kikubwa cha maji na linadumisha uzito wa kishairi na mwangwi wa kina cha awali bila kuingiza maana maalumu ya ‘shimo lisilo na mwisho.’
- source_word: הִתְהַלָּכְתָּ
  choice: umetembea
  rationale: Muundo wa Hitpael wa הלך unaweza kuonyesha kutembea huku na huku. ‘Umetembea’ linahifadhi sitiari na nguvu ya swali kuhusu kuvuka mahali pasipofikika.
