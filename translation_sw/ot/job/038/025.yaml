  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: sw
  text: 'Ni nani aliyechimba mfereji kwa ajili ya mafuriko,[a]

    au njia kwa ajili ya umeme wa radi?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya mvua kubwa, au njia kwa ajili ya umeme wa radi?” Kihalisi, “kwa ajili ya mafuriko ... kwa ajili ya ḥaziz ya sauti.” Ḥaziz ni neno adimu la Kiebrania, linaloweza kumaanisha umeme au radi kali; “sauti” katika muktadha huu huweza kumaanisha radi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִלַּג
  choice: aliyechimba
  rationale: Kitenzi hiki kinaonyesha kugawanya au kupasua ili kutengeneza mkondo. Katika muktadha wa תְּעָלָה, “aliyechimba” ni Kiswahili cha kawaida kinachohifadhi picha ya kutengeneza njia ya maji.
- source_word: שֶּׁטֶף
  choice: mafuriko
  rationale: Nomino hii inaweza kumaanisha maji yanayofurika kwa nguvu, mkondo wa ghafla, au mvua kubwa. “Mafuriko” inafaa pamoja na mfereji, huku uwezekano wa “mvua kubwa” ukihifadhiwa katika tanbihi.
- source_word: תְּעָלָה
  choice: mfereji
  rationale: Neno hili humaanisha njia au mfereji wa kupitishia maji. “Mfereji” ni neno la kawaida na linafaa kwa picha ya kishairi ya mkondo uliotengenezwa.
- source_word: דֶרֶךְ
  choice: njia
  rationale: Katika usambamba na “mfereji,” neno hili linamaanisha mkondo au njia iliyowekwa kwa tukio la angani.
- source_word: חֲזִיז
  choice: umeme
  rationale: Nomino hii adimu kwa kawaida hueleweka kuwa umeme au radi kali. “Umeme” huhifadhi tukio linaloonekana na kuunganishwa kwa kawaida na קֹלוֹת kama “umeme wa radi.”
- source_word: קֹלוֹת
  choice: radi
  rationale: Kihalisi ni “sauti” au “sauti nyingi,” lakini katika muktadha wa hali ya hewa mara nyingi humaanisha radi. “Umeme wa radi” ni usemi wa asili unaohifadhi vipengele vyote viwili vya kirai cha Kiebrania bila kukifanya kuwa kisichoeleweka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa swali na usambamba wa kishairi vimehifadhiwa.
