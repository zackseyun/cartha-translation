lexical_decisions:
- source_word: עַל מָה
  choice: juu ya nini
  rationale: Huhifadhi swali la Kiebrania kuhusu kitu ambacho juu yake misingi iliwekwa, kwa Kiswahili cha kawaida.
- source_word: אֲדָנֶיהָ
  choice: misingi yake
  rationale: אֶדֶן humaanisha kitako, tako la msingi, au tegemeo la jengo. Katika sitiari hii ya ujenzi, “misingi” ni wazi na ya kawaida, ingawa “vitako vyake” pia yawezekana.
- source_word: הָטְבָּעוּ
  choice: ilizamishwa
  rationale: Umbo la Hofali la טָבַע lina maana ya kusababishwa kuzama au kupachikwa ndani. “Ilizamishwa” huhifadhi hali ya kutendwa na taswira yenye nguvu ya Kiebrania.
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi rahisi kinachounganisha maswali mawili ya balagha.
- source_word: מִי
  choice: ni nani
  rationale: Huwasilisha kiwakilishi cha kuuliza kwa Kiswahili cha kawaida.
- source_word: יָרָה
  choice: aliyeweka
  rationale: Ingawa יָרָה kwa maana halisi inaweza kumaanisha kurusha, katika taswira hii ya ujenzi tendo linalokusudiwa ni kuweka jiwe la pembeni mahali pake.
- source_word: אֶבֶן פִּנָּתָהּ
  choice: jiwe lake la pembeni
  rationale: Huhifadhi muundo wa neno kwa neno, “jiwe la pembe yake,” kwa namna ya asili katika Kiswahili; kiambishi “lake” humrejelea dunia katika muktadha.
theological_decisions:
- issue: Sitiari ya ujenzi katika kuumbwa kwa dunia
  choice: Kudumisha taswira ya misingi na jiwe la pembeni
  alternative: Kutafsiri kwa ufafanuzi kama “Dunia inategemezwa na nini?”
  rationale: Maswali ya Mungu kwa Ayubu ni mashairi yanayoieleza dunia kama jengo. Kudumisha taswira hiyo huepuka kuibadili kuwa maelezo ya kidhahania ya kosmolojia.
translation_notes:
