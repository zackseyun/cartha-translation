  text: הֲ֭/בָאתָ אֶל אֹצְר֣וֹת שָׁ֑לֶג וְ/אֹצְר֖וֹת בָּרָ֣ד תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/022.yaml
  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: sw
  text: Je, umeingia katika ghala za theluji,[a] au umeziona ghala za mvua ya mawe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hazina za theluji ... hazina za mvua ya mawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: umeingia katika
  rationale: Kitenzi בוא pamoja na אֶל hapa kinaeleza kufika na kuingia mahali; “umeingia katika” ni Kiswahili cha kawaida kinachohifadhi taswira halisi ya ghala.
- source_word: אֹצְרוֹת
  choice: ghala
  rationale: אֹצָר inaweza kumaanisha hazina au ghala. “Ghala” linaonyesha mahali pa kuhifadhi akiba bila kutoa hasa wazo la mali ya thamani au fedha.
- source_word: שָׁלֶג
  choice: theluji
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa hali hii ya hewa.
- source_word: וְאֹצְרוֹת
  choice: au ... ghala
  rationale: Ingawa וְ kwa kawaida ni “na,” hapa inaunganisha sehemu mbili za swali la balagha. “Au” huleta uratibu wa kawaida wa Kiswahili bila kubadili nguvu ya swali.
- source_word: בָּרָד
  choice: mvua ya mawe
  rationale: Hili ni neno la kawaida na linaloeleweka kwa hail katika Kiswahili cha Afrika Mashariki.
- source_word: תִּרְאֶה
  choice: umeziona
  rationale: Ingawa umbo la Kiebrania ni imperfect, katika mfuatano huu wa kishairi linaendana na swali la kwanza; timilifu “umeziona” huonyesha uzoefu wa kuona hadi wakati wa kuulizwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha na taswira ya mashairi zimehifadhiwa; “ghala” limetumiwa katika wingi wa kimuktadha kupitia “ghala za,” huku “hazina” likiwekwa kama chaguo la chini.
