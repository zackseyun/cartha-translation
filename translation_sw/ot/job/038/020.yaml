  language: sw
  text: ili uweze kupeleka hadi kwenye mpaka wake[a], na uweze kutambua njia za kuelekea nyumbani kwake[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, kiambishi cha kiwakilishi ni cha umoja; katika muktadha wa maswali yanayofuatana ya Ayubu 38:19–20, kinaweza kurejelea nuru au giza.
    reason: cross_reference
  - marker: b
    text: Au, “na uweze kuelewa mapito ya kwenda nyumbani kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ili uweze
  rationale: Katika swali hili la balagha, כִּי linaanzisha wazo la kusudi au matokeo; “ili uweze” ni la asili katika Kiswahili na linadumisha dhihaka ya swali bila kulifanya sababu ya moja kwa moja.
- source_word: תִקָּחֶנּוּ
  choice: kupeleka mojawapo
  rationale: לקח hapa linaweza kumaanisha kuchukua, kuleta, au kupeleka. “Kupeleka” linafaa kwa mwendo kuelekea mpaka. “Mojawapo” huepuka kulazimisha ngeli ya Kiswahili inayoweza kuamua kimya kimya kwamba kiwakilishi kinarejelea nuru badala ya giza, au kinyume chake.
- source_word: אֶל גְּבוּלוֹ
  choice: hadi kwenye mpaka wake
  rationale: גְּבוּל ni mpaka au kikomo. Tafsiri hii inadumisha taswira ya mahali na kikomo chake bila kuingiza wazo la eneo la kisiasa.
- source_word: וְכִי
  choice: na uweze
  rationale: Kirai hiki kinaunganisha kishazi cha pili sambamba na cha kwanza. Kurudia “uweze” kunafanya muundo wa swali uwe wazi na wa kawaida katika Kiswahili.
- source_word: תָבִין
  choice: kutambua
  rationale: בין hubeba maana ya kuelewa kwa utambuzi au kupambanua. “Kutambua” linafaa kwa kufahamu njia zinazoelekea mahali fulani.
- source_word: נְתִיבוֹת
  choice: njia
  rationale: נְתִיבוֹת ni mapito, vijia, au njia. “Njia” ni neno la kawaida na dhahiri huku likidumisha taswira halisi ya safari.
- source_word: בֵּיתוֹ
  choice: nyumbani kwake
  rationale: בַּיִת maana yake ya msingi ni nyumba, lakini katika uhusiano na njia, “njia za kuelekea nyumbani kwake” ni Kiswahili cha asili na kinadumisha uhuishaji wa nuru au giza kuwa na makao yake.
theological_decisions:
- issue: Kirejelewa cha viwakilishi vya umoja katika תִקָּחֶנּוּ, גְּבוּלוֹ, na בֵּיתוֹ
  choice: Kutumia “mojawapo” na kueleza utata katika tanbihi
  alternative: Kuchagua nuru au giza moja kwa moja kwa kutumia upatanisho wa ngeli yake
  rationale: Muktadha wa Ayubu 38:19–20 unataja nuru na giza kwa jozi, huku Kiebrania kikitumia viwakilishi vya umoja ambavyo vinaweza kuelekezwa kwa mojawapo katika maswali yanayolingana. Kuchagua ngeli ya “nuru” au “giza” kungeondoa utata halisi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa swali la balagha umehifadhiwa. “Mojawapo” ni ufafanuzi mdogo unaohitajika ili kuepuka upatanisho wa ngeli unaoweza kutatua kimakosa utata wa kiwakilishi cha Kiebrania.
