  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ ה/סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: sw
  text: Ndipo Yahweh akamjibu Ayubu kutoka katika dhoruba, akasema:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika tufani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika mtiririko huu wa kisimulizi humaanisha ‘kujibu.’ Umbo ‘akamjibu’ ni la kawaida katika Kiswahili na linaonyesha wazi kwamba Ayubu ndiye aliyejibiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la pekee lililo katika maandishi ya Kiebrania.
- source_word: אֶת אִיּוֹב
  choice: Ayubu
  rationale: אֶת ni kiashiria cha yambwa tendwa na hakihitaji neno tofauti katika Kiswahili; jina אִיּוֹב linatolewa kwa umbo la Kiswahili lililozoeleka, ‘Ayubu.’
- source_word: מִן־הַסְּעָרָה
  choice: kutoka katika dhoruba
  rationale: סְעָרָה huonyesha dhoruba kali, tufani, au upepo unaozunguka. ‘Dhoruba’ ni neno pana, wazi, na la kawaida ambalo halibani taswira kuwa kimbunga pekee; ‘tufani’ imehifadhiwa katika tanbihi kama uwezekano halali.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Umbo hili la אמר linaendeleza mfululizo wa kisimulizi. ‘Akasema’ ni la asili katika Kiswahili na linahifadhi hatua inayofuata baada ya Yahweh kumjibu Ayubu.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la pekee יהוה, si cheo. ‘Yahweh’ hulihifadhi kama jina bila kuingiza badala ya kimadhehebu.
- issue: Upana wa maana ya סְעָרָה katika tukio la kujidhihirisha kwa Mungu
  choice: dhoruba
  alternative: tufani; kimbunga
  rationale: Neno la Kiebrania linaweza kueleza dhoruba kali na si lazima liamue kwamba ni kimbunga kwa maana finyu. ‘Dhoruba’ huhifadhi upana huo, huku tanbihi ikionyesha tafsiri nyingine inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisimulizi unaoeleweka kwa wasomaji wa kawaida. ‘Ndipo’ huunganisha jibu hili na hotuba zilizotangulia, na vitenzi vya mfululizo ‘akamjibu … akasema’ vinafuata mtiririko wa Kiebrania bila kuwa vizito.
