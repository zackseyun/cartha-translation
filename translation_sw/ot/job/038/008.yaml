  yaml_path: translation/ot/job/038/008.yaml
  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: sw
  text: Au ni nani aliyeifungia bahari kwa milango, ilipofoka ikatoka tumboni[a][b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilipobubujika”; kitenzi cha Kiebrania kinaonyesha kujitokeza kwa nguvu.
    reason: lexical_alternative
  - marker: b
    text: Mstari huu unaifananishwa bahari na mtoto anayetoka tumboni, ukiendeleza taswira ya kishairi ya uumbaji.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: aliyeifungia
  rationale: Kitenzi hiki kinaonyesha kuzuia au kufungia. “Aliyeifungia” ni Kiswahili cha kawaida kinacholingana vizuri na mfano wa milango.
- source_word: בִּדְלָתַיִם
  choice: kwa milango
  rationale: Nomino hii iko katika umbo la uwili la ‘mlango’; “kwa milango” inadumisha maana ya chombo kilichotumiwa na taswira ya jengo.
- source_word: יָם
  choice: bahari
  rationale: Katika muktadha huu wa uumbaji, “bahari” hutambulika kwa kawaida kama kitu maalumu kinachozungumziwa bila kuhitaji kiashiria kingine cha uainisho.
- source_word: בְּגִיחוֹ
  choice: ilipofoka
  rationale: Neno hili linaonyesha kujitokeza kwa nguvu. “Ilipofoka” ni fupi, hai, na linadumisha nguvu ya taswira ya Kiebrania.
- source_word: מֵרֶחֶם
  choice: kutoka tumboni
  rationale: Huhifadhi taswira ya kuzaliwa ambamo bahari inafananishwa na mtoto anayetoka tumboni.
- source_word: יֵצֵא
  choice: ilipofoka kutoka
  rationale: Kitenzi cha mwisho kinakamilisha wazo la kutoka tumboni. Kwa Kiswahili, maana yake imeunganishwa kwa kawaida katika “ilipofoka kutoka tumboni” ili kuepuka marudio yasiyo ya lazima huku tendo la kutoka likibaki wazi.
theological_decisions:
- issue: Taswira ya kishairi ya kuumbwa kwa bahari
  choice: Kudumisha picha ya Mungu akiifungia bahari wakati wa kuzaliwa kwake kwa njia ya kishairi.
  alternative: Kusema kwa lugha dhahania tu kwamba Mungu aliiwekea bahari mipaka.
  rationale: Kiebrania kinaipa bahari sifa za mtoto anayetoka tumboni na kumwonyesha Mungu akiizuia kwa milango. Kudumisha picha hiyo kunaheshimu ushairi bila kuifanya kuwa dai la kimitholojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa swali umehifadhiwa kwa kuanza na “Au ni nani,” na lugha inabaki wazi kwa msomaji wa kawaida.
