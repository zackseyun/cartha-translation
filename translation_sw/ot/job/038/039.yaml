  yaml_path: translation/ot/job/038/039.yaml
  text: Do you hunt prey for the lioness[a], and satisfy the appetite of the young lions,
translation:
  language: sw
  text: 'Je, wewe humwindia simba mawindo,

    na kushibisha njaa[a] ya simba wachanga?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, “kujaza uhai/nafsi ya simba wachanga”; katika muktadha huu humaanisha kutosheleza njaa au hamu yao ya chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תָצ֣וּד
  choice: Je, wewe humwindia
  rationale: Kiulizi הֲ pamoja na kitenzi cha nafsi ya pili umoja huunda swali la balagha kwa Ayubu. Wakati wa mazoea katika Kiswahili unafaa kwa tendo la kuwinda linalozungumziwa kwa ujumla.
- source_word: לְ/לָבִ֣יא
  choice: simba jike
  rationale: לָבִיא inaweza kumaanisha simba bila kubainisha jinsia, lakini muktadha wa kuwalisha simba wachanga unaunga mkono maana ya simba jike. Kiambishi לְ kimewasilishwa ndani ya muundo wa kitenzi “humwindia.”
- source_word: טָ֑רֶף
  choice: mawindo
  rationale: Neno hili humaanisha mnyama aliyewindwa ambaye huwa chakula cha mnyama mla nyama; “mawindo” huhifadhi maana hiyo ya uwindaji.
- source_word: וְ/חַיַּ֖ת
  choice: njaa
  rationale: Ingawa חַיַּת kwa halisi inahusiana na “uhai,” katika muundo huu pamoja na מלא inaeleza hitaji au hamu ya chakula. “Njaa” ni Kiswahili cha kawaida kinachowasilisha maana ya nahau bila kuficha taswira ya kushibishwa.
- source_word: כְּפִירִ֣ים
  choice: simba wachanga
  rationale: כְּפִירִים humaanisha simba ambao bado ni wachanga; tafsiri hii ni sahihi na ya kawaida kuliko kuwafanya lazima wawe vitoto vidogo sana.
- source_word: תְּמַלֵּֽא
  choice: kushibisha
  rationale: Piel ya מלא ina maana ya “kujaza.” Ikiunganishwa na njaa, “kushibisha” ni ulinganifu wa asili wa Kiswahili unaohifadhi wazo la kuijaza au kuiondoa njaa.
