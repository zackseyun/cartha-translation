  yaml_path: translation/ot/job/038/028.yaml
  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: sw
  text: Je, mvua ina baba, au ni nani aliyezaa matone ya umande?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: Je, mvua ina
  rationale: Muundo wa Kiebrania ni swali la ndiyo-au-hapana linaloonyesha uhusiano wa umilikaji; Kiswahili cha kawaida huueleza kwa ‘Je, mvua ina …?’
- source_word: אָב
  choice: baba
  rationale: Neno hili humaanisha ‘baba.’ Tafsiri ya moja kwa moja inadumisha taswira ya uzazi na ulinganifu wa kishairi na kitenzi kinachofuata.
- source_word: אוֹ מִי
  choice: au ni nani
  rationale: Huhifadhi kiunganishi cha uchaguzi na swali la moja kwa moja kwa Kiswahili cha asili.
- source_word: הוֹלִיד
  choice: aliyezaa
  rationale: Hifili ya ילד humaanisha kusababisha kuzaliwa au kuzaa. ‘Aliyezaa’ ni ya sasa, yenye heshima, na huhifadhi taswira ya uzazi bila kuongeza jinsia isiyotajwa wazi katika kitenzi chenyewe.
- source_word: אֶגְלֵי טָל
  choice: matone ya umande
  rationale: 'Hutoa maana halisi ya muundo wa nomino mbili: matone yanayotokana na au kuunda umande.'
