  text: אֵיפֹ֣ה הָ֭יִיתָ בְּ/יָסְדִ/י אָ֑רֶץ הַ֝גֵּ֗ד אִם יָדַ֥עְתָּ בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: sw
  text: Ulikuwa wapi nilipoweka msingi wa dunia[a]? Niambie, ikiwa una ufahamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilipoiasisi dunia.”
    reason: Mbadala huu unaonyesha maana ya moja kwa moja ya יסד, yaani kuasisi au kuweka msingi.
lexical_decisions:
- source_word: אֵיפֹה
  choice: wapi
  rationale: Kielezi cha kuuliza mahali; “wapi” ni cha kawaida na kinadumisha nguvu ya changamoto ya Mungu.
- source_word: הָיִיתָ
  choice: ulikuwa
  rationale: Ni kitenzi cha wakati uliopita, nafsi ya pili umoja wa kiume; “ulikuwa” linafaa katika swali kuhusu tukio la zamani.
- source_word: בְּיָסְדִי
  choice: nilipoweka msingi
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina na kiambishi cha nafsi ya kwanza una maana ya wakati, “nilipoweka msingi.” Tafsiri hii inadumisha taswira ya ujenzi iliyo katika יסד na ni ya asili katika Kiswahili.
- source_word: אָרֶץ
  choice: dunia
  rationale: Katika muktadha huu wa uumbaji wa ulimwengu, neno linamaanisha dunia, si eneo fulani la nchi.
- source_word: הַגֵּד
  choice: Niambie
  rationale: Amri hii inataka Ayubu aseme au aeleze. “Niambie” ni ya asili na inadumisha sauti ya changamoto; kiambishi cha mtendewa “-ni-” kinatokana na muktadha, ingawa hakijaandikwa kando katika Kiebrania.
- source_word: אִם
  choice: ikiwa
  rationale: 'Linaanzisha sharti la changamoto: “ikiwa una…” bila kuligeuza kuwa dai kwamba Ayubu kweli ana ufahamu huo.'
- source_word: יָדַעְתָּ
  choice: una
  rationale: 'Ingawa umbo la Kiebrania ni timilifu, katika sharti hili la balagha maana ya sasa ni ya asili: “ikiwa una ufahamu.”'
- source_word: בִינָה
  choice: ufahamu
  rationale: Neno hili humaanisha ufahamu, uelewa, au utambuzi. “Ufahamu” ni neno la kawaida na linalofaa katika fasihi ya hekima.
theological_decisions:
- issue: Taswira ya uumbaji katika usemi wa Mungu
  choice: nilipoweka msingi wa dunia
  alternative: nilipoiasisi dunia
  rationale: Tafsiri iliyochaguliwa inadumisha taswira ya usanifu inayomwonyesha Mungu akiithibitisha dunia, bila kuongeza maelezo kuhusu namna ya uumbaji au kutatua maswali ambayo mstari hauyashughulikii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Dunia” limetumiwa badala ya “nchi” kwa sababu muktadha ni wa uumbaji wa ulimwengu. Alama ya tanbihi imewekwa mara tu baada ya kishazi inachokihusu.
