  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: sw
  text: Unajua, kwa maana wakati huo ulizaliwa, na idadi ya siku zako ni kubwa[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na siku zako ni nyingi.” Kiebrania kinasema kihalisi, “na idadi ya siku zako [ni] nyingi/kubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Unajua
  rationale: Kitenzi hiki ni Qal timilifu, nafsi ya pili umoja wa kiume, cha ידע. Katika usemi huu wa Mungu wenye kejeli ya balagha, wakati wa sasa “Unajua” unaonyesha vizuri nguvu ya swali la kejeli, ingawa kisarufi maana ya wakati uliopita pia inawezekana.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha maelezo ya kejeli yanayohusiana na swali la balagha lililotangulia; “kwa maana” kinaendeleza mtiririko huo kwa Kiswahili cha kawaida.
- source_word: אָז
  choice: wakati huo
  rationale: Kielezi hiki kinaelekeza kwenye wakati wa matukio ya uumbaji yaliyotajwa; “wakati huo” ni wazi na cha kawaida katika Kiswahili.
- source_word: תִּוָּלֵד
  choice: ulizaliwa
  rationale: 'Hii ni Nifali isiyotimilifu, nafsi ya pili umoja wa kiume, ya ילד. Katika muktadha imetumiwa kwa kejeli kuhusu wakati uliopita: Ayubu angepaswa kuwa hai wakati huo. “Ulizaliwa” huwasilisha hoja hiyo kwa ufupi na kwa lugha ya kawaida.'
- source_word: וּמִסְפַּר
  choice: na idadi
  rationale: Nomino katika hali ya kutegemea yenye kiunganishi awali; “na idadi” inahifadhi muundo na maana yake.
- source_word: יָמֶיךָ
  choice: ya siku zako
  rationale: Ni sehemu ya muundo tegemezi wenye kiambishi cha nafsi ya pili; “idadi ya siku zako” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: רַבִּים
  choice: ni kubwa
  rationale: Kivumishi hiki ni kiarifu kinachoeleza idadi ya siku za Ayubu. “Idadi ... ni kubwa” huhifadhi nomino kuu ya Kiebrania na kejeli yake; pia maana inaweza kutolewa kama “siku zako ni nyingi.”
theological_decisions: []
