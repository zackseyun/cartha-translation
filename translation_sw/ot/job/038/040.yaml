translation:
  language: sw
  text: wanapojikunyata mapangoni mwao na kuvizia kichakani[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa kujisitiri” au “mafichoni” badala ya “kichakani.” Neno la Kiebrania סֻכָּה hapa linamaanisha mahali penye kifuniko panapofaa kwa kuvizia, si kibanda kilichojengwa kwa maana inayohusiana na sikukuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: wanapo-
  rationale: Katika mfululizo huu wa maswali, neno hili linaonyesha wakati au hali ambamo simba hutafuta mawindo; kiambishi cha wakati “wanapo-” ni cha asili katika Kiswahili.
- source_word: יָשֹׁחוּ
  choice: wanapojikunyata
  rationale: Kitenzi kinaonyesha kujishusha chini katika mkao wa kuwinda. “Kujikunyata” kinaeleza mkao huo kwa lugha ya kawaida bila kudokeza kusujudu.
- source_word: בַמְּעוֹנוֹת
  choice: mapangoni mwao
  rationale: Neno hilo linamaanisha makao au malazi ya wanyama. Katika muktadha wa simba, “mapangoni mwao” ni usemi wa kawaida na huhifadhi wingi.
- source_word: יֵשְׁבוּ ... לְמוֹ אָרֶב
  choice: na kuvizia
  rationale: Ingawa יֵשְׁבוּ kwa msingi ni “hukaa,” pamoja na לְמוֹ אָרֶב kifungu kizima kinaeleza kukaa tayari kwa shambulio la kushtukiza. “Kuvizia” ni tafsiri fupi na ya asili ya tendo hilo.
- source_word: בַסֻּכָּה
  choice: kichakani
  rationale: Hapa סֻכָּה ni mahali penye kifuniko au maficho yanayofaa kwa kuvizia, si kibanda cha sikukuu. “Kichakani” kinafaa katika mazingira ya wanyama wawindaji, huku tanbihi ikihifadhi maana mbadala.
