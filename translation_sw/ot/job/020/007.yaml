base_translation:
  language: en
  yaml_path: translation/ot/job/020/007.yaml
  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: sw
  text: Kama mavi yake mwenyewe[a], ataangamia milele; wale waliomwona watasema, “Yuko wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama kinyesi chake mwenyewe.” Kiebrania kinatumia taswira ya makusudi ya kumfedhehesha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: Kama mavi yake mwenyewe
  rationale: Nomino גֶּלֶל humaanisha mavi au kinyesi. “Mavi” ni neno la kawaida na la moja kwa moja katika Kiswahili, nalo linahifadhi taswira ya makusudi ya kumfedhehesha; kiambishi cha umilikaji kimetolewa kwa “yake mwenyewe.”
- source_word: לָנֶצַח
  choice: milele
  rationale: Neno נֶצַח hapa linaonyesha muda usio na mwisho au hali ya kudumu; “milele” ni tafsiri ya kawaida na yenye nguvu katika muktadha huu wa kishairi.
- source_word: יֹאבֵד
  choice: ataangamia
  rationale: Kitenzi אבד kina maana ya kuangamia au kupotea. “Ataangamia” kinahifadhi wazo lenye nguvu la maangamizi bila kulipunguza kuwa kutoweka tu.
- source_word: רֹאָיו
  choice: wale waliomwona
  rationale: Umbo hili la kitenzi pamoja na kiambishi cha nafsi humaanisha wale waliomwona. Kauli hii ni ya asili katika Kiswahili na inaelekeza kwa watu waliopata kumwona kabla ya kuangamia kwake.
- source_word: יֹאמְרוּ
  choice: watasema
  rationale: Kitenzi אמר kimsingi ni “kusema.” Ingawa maneno yanayofuata ni swali, hakuna haja ya kukibadili kuwa “watauliza.”
- source_word: אַיּוֹ
  choice: Yuko wapi?
  rationale: Hiki ni kiulizi cha mahali chenye kiambishi cha nafsi, yaani “yuko wapi?” Tafsiri haiongezi neno “sasa,” ambalo halipo wazi katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Neno “mavi” limehifadhi ukali wa taswira ya Kiebrania badala ya kutumia tamathali laini inayoweza kuficha fedheha iliyokusudiwa.
