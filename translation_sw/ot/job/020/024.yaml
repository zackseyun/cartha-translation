  text: Ataikimbia silaha ya chuma; upinde wa shaba utampenya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “upinde wa shaba utapita ndani yake.” Upinde hapa unawakilisha mshale unaorushwa nao.
