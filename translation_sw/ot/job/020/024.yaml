lexical_decisions:
- source_word: יִבְרַח
  choice: Atakimbia
  rationale: Kitenzi cha Kiebrania ברח katika hali hii ya kishairi kinaonyesha jaribio la kukimbia au kuhepa; wakati ujao unafaa muktadha.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: silaha ya chuma
  rationale: נשק inaweza kumaanisha silaha kwa upana, na בַּרְזֶל ni chuma. Kiswahili hiki ni cha kawaida na hakibani maana kuwa aina moja maalumu ya silaha.
- source_word: תַּחְלְפֵהוּ
  choice: utampenya
  rationale: חלף kimsingi ni kupita au kupitia. Katika picha hii ya kivita, upinde unawakilisha mshale wake, unaopita ndani ya mtu; ‘utampenya’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: upinde wa shaba
  rationale: קֶשֶׁת ni upinde, na נְחוּשָׁה hurejelea shaba au aloi yake. ‘Shaba’ ni neno la kawaida la Kiswahili katika taswira hii ya silaha.
