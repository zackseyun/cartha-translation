lexical_decisions:
- source_word: רֹאשׁ
  choice: sumu
  rationale: Ingawa kwa kawaida neno hili humaanisha ‘kichwa,’ katika taswira hii ya kishairi linamaanisha sumu ya nyoka; ‘sumu’ ni ya kawaida na wazi katika Kiswahili.
- source_word: פְּתָנִים
  choice: nyoka aina ya kobra
  rationale: Neno hili hutaja nyoka mwenye sumu ambaye kwa mapokeo huitwa ‘asp’; ‘nyoka aina ya kobra’ ni wazi zaidi kwa msomaji wa kisasa bila kudai uhakika kamili wa kisayansi.
- source_word: יִינָק
  choice: ananyonya
  rationale: Huhifadhi picha halisi na yenye nguvu ya kitenzi cha Kiebrania ‘kunyonya,’ badala ya kuilegeza kuwa ‘kunywa.’
- source_word: תַּהַרְגֵהוּ
  choice: humwua
  rationale: Wakati wa mazoea katika Kiswahili unafaa kwa kauli ya kishairi inayoonyesha matokeo ya hakika.
- source_word: לְשׁוֹן
  choice: ulimi
  rationale: Huhifadhi taswira halisi ya Kiebrania badala ya kuibadili kwa ufafanuzi kama ‘jino’ au ‘kuumwa.’
- source_word: אֶפְעֶה
  choice: nyoka mwenye sumu
  rationale: Jina mahususi la spishi halina uhakika; tafsiri hii huwasilisha maana ya msingi kwa lugha ya kawaida huku ikiepuka usahihi wa kisayansi usiothibitishwa.
