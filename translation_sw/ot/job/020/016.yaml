  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: sw
  text: Ananyonya sumu ya kobra[a]; ulimi wa fira humwua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sumu ya nyoka aitwaye aspi.” Jina mahususi la nyoka huyu halijulikani kwa uhakika.
