lexical_decisions:
- source_word: חַיִל
  choice: mali
  rationale: Katika muktadha huu wa fasihi ya hekima, neno hili linamaanisha utajiri au vitu vya thamani; “mali” ni la kawaida na linaendana na picha ya faida iliyopatikana.
- source_word: בָּלַע
  choice: amemeza
  rationale: Linahifadhi picha halisi ya kumeza, ambayo inaendelezwa na kitendo cha kutapika.
- source_word: וַיְקִאֶנּוּ
  choice: lakini atayatapika
  rationale: 'Kitenzi kinamaanisha kutapika. “Lakini” huonyesha ugeuzi wa hali: mali aliyomeza hataweza kuibakiza. Kiambishi “-ya-” kinarejelea mali kama nomino ya ngeli ya 6 katika Kiswahili.'
- source_word: מִבִּטְנוֹ
  choice: tumboni mwake
  rationale: Linahifadhi taswira ya mwili ya kitu kilichomezwa na kisha kutolewa kutoka tumboni.
- source_word: יוֹרִשֶׁנּוּ
  choice: atayatoa
  rationale: Hifili hapa ina maana ya kusababisha mali itoke au iondolewe. Katika Kiswahili, “atayatoa tumboni mwake” huonyesha wazi kuwa Mungu ndiye anayesababisha yatoke.
- source_word: אֵל
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na linalofaa kwa אֵל katika muktadha huu; si jina la agano YHWH.
theological_decisions:
- issue: Utendaji wa hukumu katika kuondolewa kwa mali ya mwovu
  choice: Mungu ametajwa wazi kuwa ndiye anayesababisha mali itoke tumboni mwa mtu huyo.
  alternative: Kuiacha hasara ionekane kuwa tokeo lisilo na mtendaji maalumu au la mazingira pekee.
  rationale: Kiebrania kinamtaja אֵל wazi kuwa mtendaji wa יוֹרִשֶׁנּוּ; tafsiri kwa hiyo inadumisha utendaji wa Mungu bila kuufifisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira endelevu ya kumeza, kutapika, na kutolewa tumboni imehifadhiwa. Hakuna tanbihi ya pili iliyoongezwa kwa sababu neno “tumboni” tayari limo wazi katika matini kuu; alama zote zilizotumika zina tanbihi inayolingana.
