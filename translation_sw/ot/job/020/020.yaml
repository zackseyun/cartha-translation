  yaml_path: translation/ot/job/020/020.yaml
  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: sw
  text: 'Kwa maana hakujua utulivu tumboni mwake;

    kwa vitu vyake vya kutamanika hataokoka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika tamaa yake hataacha chochote kiokoke,” yaani hatahifadhi chochote cha vitu anavyovitaka.
    reason: Muundo mfupi wa Kiebrania katika mstari wa pili unaruhusu pia kueleweka kuwa mtu huyo hatahifadhi kitu chochote anachokitamania.
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya hukumu iliyotangulia na kudumisha mtiririko wa hoja.
- source_word: לֹא יָדַע שָׁלֵו
  choice: hakujua kuridhika
  rationale: Neno שָׁלֵו linaweza kumaanisha utulivu, raha, au hali ya kutosheka. Katika muktadha wa tamaa na tumbo, “kuridhika” ni Kiswahili cha kawaida kinachohifadhi wazo la kutopata utoshelevu.
- source_word: בְּבִטְנוֹ
  choice: tumboni mwake
  rationale: Linahifadhi taswira halisi ya בטן, inayohusiana hapa na hamu na ulafi, badala ya kuibadili kuwa “ndani yake.”
- source_word: בַּחֲמוּדוֹ
  choice: chochote alichokitamani
  rationale: Mzizi חמד hueleza kitu kinachotamaniwa au kuthaminiwa. Muundo huu unaonyesha vitu anavyovitaka bila kuufinyaza kuwa mali au hazina pekee.
- source_word: לֹא יְמַלֵּט
  choice: hataokoa
  rationale: Piel ya מלט inaweza kumaanisha kuokoa au kufanya kitu kiepuke. Hapa imetafsiriwa kwa maana ya kutoweza kuhifadhi au kuokoa kitu alichokitamani, huku uwezekano mwingine ukitajwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa בַּחֲמוּדוֹ na לֹא יְמַלֵּט
  choice: “hataokoa chochote alichokitamani”
  alternative: “hatajiokoa kwa vitu vyake vya thamani”
  rationale: Kiebrania ni kifupi na kinaweza kueleweka ama kwamba hataweza kuhifadhi vitu anavyovitamani ama kwamba vitu hivyo havitamwokoa. Maandishi makuu yanafuata uchanganuzi wa kitu kisichotajwa wazi cha kitenzi, na tanbihi inadumisha uchanganuzi wa njia ya kujiokoa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Tumboni mwake” inadumisha taswira halisi ya Kiebrania; “kuridhika” huwasilisha kwa kawaida hali ya kutokuwa na utulivu kwa sababu ya tamaa.
