  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: sw
  text: Hurejesha alichokitaabikia, wala hakimezi; kwa kadiri ya utajiri alioupata kwa kubadilishana[a], hafurahii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hurejesha taabu yake wala haimezi; kuhusu utajiri alioupata kwa kubadilishana, hafurahii.” Kiebrania cha mstari wa pili ni kifupi na kinaweza kutafsiriwa kwa njia kadhaa zinazokaribiana.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  choice: Hukirudisha
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi. ‘Hukirudisha’ ni ya kawaida na inadokeza kwamba mwovu analazimika kuachilia alichopata.
- source_word: יָגָע
  choice: alichokitaabikia
  rationale: Neno hili linaweza kumaanisha taabu/kazi au kilichopatikana kwa taabu. Pamoja na ‘kurudisha,’ hapa linaeleweka vizuri kuwa kitu alichokipata kwa juhudi.
- source_word: וְלֹא יִבְלָע
  choice: wala hatakimeza
  rationale: בלע humaanisha kihalisi ‘kumeza.’ Taswira hiyo imehifadhiwa ili kuonyesha kwamba hawezi kutumia au kujimilikisha alichopata.
- source_word: כְּחֵיל
  choice: kwa kadiri ya utajiri
  rationale: חֵיל hapa inaelekea kumaanisha utajiri au mali, si nguvu za kijeshi. כ imewakilishwa kwa maana ya uwiano, ingawa muundo wa Kiebrania ni mfupi na mgumu.
- source_word: תְּמוּרָתוֹ
  choice: alioupata kwa kubadilishana
  rationale: תמורה huashiria ubadilishaji, fidia, au kitu kilichopatikana kwa kubadilishana. Usemi huu ni wa asili zaidi katika Kiswahili huku ukihifadhi kiini cha maana.
- source_word: וְלֹא יַעֲלֹס
  choice: hatafurahi
  rationale: עלס humaanisha kufurahi sana au kushangilia. ‘Hatafurahi’ ni wazi na ya kawaida, na huhifadhi ukanushaji wa matini.
