translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Taswira halisi ya ‘kumeza’ imehifadhiwa; tanbihi inaonyesha ufupi na utata halisi wa mstari wa pili wa Kiebrania.
