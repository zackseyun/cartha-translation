  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֤י רִנְנַ֣ת רְ֭שָׁעִים מִ/קָּר֑וֹב וְ/שִׂמְחַ֖ת חָנֵ֣ף עֲדֵי רָֽגַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: sw
  text: 'Kwa maana shangwe ya waovu ni ya muda mfupi,

    na furaha ya mtu asiyemcha Mungu hudumu kwa kitambo tu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na furaha ya mnafiki hudumu kwa kitambo tu.” Neno la Kiebrania חָנֵף linaweza kumaanisha “mnafiki,” lakini katika kitabu cha Ayubu mara nyingi humaanisha kwa upana zaidi mtu asiye na uchaji kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa kauli iliyotangulia; “Kwa maana” huhifadhi dhima hiyo kwa Kiswahili cha kawaida.
- source_word: רִנְנַת
  choice: shangwe
  rationale: Neno hili huashiria kilio au wonyesho wa furaha; “shangwe” ni la kishairi na la kawaida, na linadokeza furaha inayoonyeshwa wazi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni tafsiri fupi na iliyozoeleka ya watu walio na hatia ya kimaadili, inayofaa katika fasihi ya hekima.
- source_word: מִקָּרוֹב
  choice: ni ya muda mfupi
  rationale: Katika muktadha huu kirai kina maana ya muda mfupi, si ukaribu wa mahali; tafsiri hii huwasilisha wazi kikomo cha shangwe hiyo.
- source_word: וְשִׂמְחַת
  choice: na furaha ya
  rationale: Huhifadhi muundo sambamba wa kishairi kati ya “shangwe” na “furaha.”
- source_word: חָנֵף
  choice: mtu asiyemcha Mungu
  rationale: Katika Ayubu neno hili linaweza kumaanisha mtu asiye na uchaji au mwaminifu kwa Mungu, kwa maana pana kuliko unafiki wa kujifanya tu.
- source_word: עֲדֵי רָגַע
  choice: hudumu kwa kitambo tu
  rationale: Kirai huweka mpaka mfupi sana wa muda; “hudumu kwa kitambo tu” ni Kiswahili cha asili kinachohifadhi mkazo wa muda mfupi.
theological_decisions:
- issue: Maana ya חָנֵף
  choice: mtu asiyemcha Mungu
  alternative: mnafiki
  rationale: Maana pana ya kutokuwa na uchaji inafaa zaidi sambamba na “waovu,” lakini maana ya “mnafiki” ni uwezekano halisi wa kileksika na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari miwili inadumisha usambamba wa kishairi. “Mtu asiyemcha Mungu” ni wazi kwa wasomaji wa kawaida bila kuingiza msimamo wa kimadhehebu; tanbihi inadumisha uwezekano wa “mnafiki.”
