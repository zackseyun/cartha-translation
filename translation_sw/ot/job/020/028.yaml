  source_fidelity: “Mazao ya nyumba yake” accurately reflects יְבוּל בֵּיתוֹ, and “yataondolewa” is a defensible contextual rendering of יִגֶל without adding an agent. The temporal phrase and the unresolved pronoun in “siku ya hasira yake” preserve the Hebrew’s ambiguity. However, נִגָּרוֹת more specifically evokes being poured out/spilled away; “yakitiririka” can merely describe flowing and does not as clearly convey loss.
