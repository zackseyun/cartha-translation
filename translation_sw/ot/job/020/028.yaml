  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: sw
  text: Mazao ya nyumba yake yataondolewa[a], yakimwagika siku ya hasira yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yataenda uhamishoni” au “yataondoka”; kitenzi kinaweza kumaanisha kwenda mbali au kuondolewa, hapa kikirejelea mazao au mali ya nyumba ya mtu mwovu.
    reason: lexical_alternative
  - marker: b
    text: Huenda hii inarejelea hasira ya Mungu, ingawa Kiebrania hakimtaji wazi mwenye hasira hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: yataondolewa
  rationale: Kitenzi גלה katika muktadha huu kinaonyesha mazao au mali kuondoka au kuondolewa. “Yataondolewa” ni Kiswahili cha kawaida kinachoeleza matokeo hayo bila kutaja mtendaji ambaye Kiebrania hakumtaji.
- source_word: יְבוּל
  choice: mazao
  rationale: Neno hili humaanisha mavuno, mazao, au ongezeko linalopatikana. “Mazao” linahifadhi picha ya kile kinachotokana na nyumba au mali yake.
- source_word: בֵּיתוֹ
  choice: ya nyumba yake
  rationale: Tafsiri hii inahifadhi picha halisi ya “nyumba yake,” huku “nyumba” ikiweza kueleweka kwa upana kuwa kaya na mali zake.
- source_word: נִגָּרוֹת
  choice: yakitiririka
  rationale: Umbo hili kutoka נגר hutoa picha ya vitu vinavyomiminika au kutiririka na kuondoka. “Yakitiririka” linahifadhi picha hiyo bila kuibadili kuwa tendo la kufagiliwa au kusombwa pekee.
- source_word: בְּיוֹם
  choice: siku ya
  rationale: Hii ni namna ya asili na yenye uzito katika Kiswahili ya kuwasilisha kirai cha wakati “katika/siku ya.”
- source_word: אַפּוֹ
  choice: hasira yake
  rationale: Kiambishi kinamaanisha nafsi ya tatu ya kiume, lakini Kiebrania hakimtaji wazi mwenye hasira. “Hasira yake” huhifadhi hali hiyo ya kutotajwa wazi.
theological_decisions:
- issue: Mhusika anayerejelewa na “hasira yake”
  choice: Imetafsiriwa “hasira yake” bila kuongeza jina la Mungu katika mstari mkuu.
  alternative: “hasira ya Mungu” au “ghadhabu yake”
  rationale: Muktadha unaelekeza kwa nguvu kwenye hukumu na hasira ya Mungu, lakini Kiebrania chenyewe hakimtaji Mungu wazi katika mstari huu. Kiwakilishi kimehifadhiwa ili kutatua kwa lazima jambo ambalo maandishi yameliacha likiwa la kudokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka. “Mazao ya nyumba” limehifadhiwa kama taswira ya kishairi inayoweza kujumuisha mavuno, ongezeko na mali ya kaya; “yakitiririka” linaendeleza taswira ya vitu vinavyomiminika na kupotea.
