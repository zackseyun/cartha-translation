  text: Hakuna chochote kilichosalia kwa ajili ya kula kwake[a]; kwa hiyo, ustawi wake hautadumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi na muundo wa Kiebrania, “Hakuna aliyenusurika, au kilichobaki, kwa ajili ya kula kwake”; yaani, hakuna chochote kilichobaki kutokana na vitu alivyotumia.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “utadumu” ni kigumu kutafsiri; tafsiri nyingine ni “utaendelea,” au, kwa uwezekano mdogo zaidi hapa, “utafanikiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: Hakuna chochote
  rationale: Kiashirio cha kutokuwapo kinaunganishwa na שָׂרִיד ili kutoa Kiswahili cha kawaida kinachoeleza kwamba hakuna kitu kilichobaki.
- source_word: שָׂרִיד
  choice: kilichosalia
  rationale: Neno hili humaanisha ‘aliyenusurika’ au ‘masalio.’ Katika muktadha wa kula, umbo lisilo la kibinadamu ‘kilichosalia’ linaeleza kwa kawaida kwamba hakuna kitu kilichoepuka ulaji wake.
- source_word: לְאָכְלוֹ
  choice: asile
  rationale: Infinitivu ya אכל yenye kiambishi cha nafsi ya tatu ya kiume ina maana halisi ya ‘kwa kula kwake.’ Muundo ‘kilichosalia asile’ unaonyesha kwa Kiswahili cha kawaida ulaji wake usioacha chochote bila kuliwa.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Ni msemo wa kuonyesha matokeo au hitimisho kutokana na kishazi kilichotangulia.
- source_word: לֹא
  choice: hata-
  rationale: Ukanushi umeunganishwa kimaumbile na kitenzi cha wakati ujao katika ‘hautadumu.’
- source_word: יָחִיל
  choice: utadumu
  rationale: Kitenzi hiki kina ugumu wa kileksika. Katika muktadha huu, ‘kudumu’ hutoa wazo kwamba mafanikio yake hayataendelea, bila kulazimisha maana finyu zaidi.
- source_word: טוּבוֹ
  choice: ustawi wake
  rationale: Ingawa neno hilo linaweza kumaanisha ‘wema wake’ au ‘vitu vyake vizuri,’ hapa linahusu hali yake njema au mafanikio yake ya mali; ‘ustawi wake’ ni ya asili na inafaa muktadha wa hukumu.
