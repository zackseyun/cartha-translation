  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: sw
  text: 'Hii ndiyo sehemu ya mtu mwovu kutoka kwa Mungu,

    na urithi aliowekewa na Mwenye Nguvu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “urithi wa neno lake kutoka kwa Mwenye Nguvu.” Kiebrania kinaweza kusomwa kwa karibu zaidi kuwa “neno lake” au “tamko lake”; lakini katika muktadha huu huenda kinamaanisha urithi ambao Mungu amemtamkia au amemwekea.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Hii ndiyo
  rationale: Kiashiria hiki kinaanzisha muhtasari wa mwisho wa Sofari; “ndiyo” hutoa muundo wa kawaida na wenye mkazo katika Kiswahili.
- source_word: חֵלֶק
  choice: sehemu
  rationale: Neno hili linaonyesha fungu au matokeo anayogawiwa mtu; “sehemu” linaeleweka kwa urahisi na linafaa katika muktadha wa hukumu.
- source_word: אָדָם רָשָׁע
  choice: mtu mwovu
  rationale: Ni usemi wa umoja wenye maana ya kijumla. Kiswahili “mtu” huhifadhi umoja huo bila kuifanya sentensi ionekane kumhusu mwanamume mmoja tu.
- source_word: מֵאֱלֹהִים
  choice: kutoka kwa Mungu
  rationale: Katika muktadha huu אֱלֹהִים humaanisha Mungu mmoja aliye chanzo cha fungu hilo.
- source_word: וְנַחֲלַת
  choice: urithi
  rationale: “Urithi” huhifadhi taswira ya kitu kilichogawiwa na ulinganifu wa kishairi na “sehemu.” Kiunganishi “na” hakijarudiwa kwa kuwa mstari wa pili unaeleza upya sehemu hiyo kwa apposition ya asili katika Kiswahili.
- source_word: אִמְרוֹ
  choice: alioamriwa
  rationale: Kwa mujibu wa muktadha na ulinganifu, neno linalotokana na אמר linaeleweka kuwa jambo lililotamkwa au kuamuliwa kwa ajili yake. “Alioamriwa” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuongeza maelezo marefu ndani ya mstari.
- source_word: מֵאֵל
  choice: na Mwenye Nguvu
  rationale: Ingawa kihusishi ni “kutoka kwa,” katika muundo wa kutendwa wa Kiswahili chanzo cha agizo huonyeshwa kwa “na.” “Mwenye Nguvu” huhifadhi tofauti ya kishairi ya jina אֵל badala ya kurudia tu “Mungu.”
theological_decisions:
- issue: Maana ya אִמְרוֹ
  choice: urithi alioamriwa
  alternative: urithi wa neno lake
  rationale: Kiebrania chaweza kutafsiriwa kwa kufuata umbo lake kama “neno lake,” lakini maana hiyo huwa tata sana katika Kiswahili. Muktadha wa sura unahusu fungu la hukumu analopewa mwovu na Mungu, hivyo tafsiri kuu inaonyesha jambo aliloamriwa huku tanbihi ikihifadhi uwezekano wa tafsiri halisi zaidi.
- issue: Uhusiano wa אֵל na hukumu iliyotajwa
  choice: Mwenye Nguvu ndiye anayemwamria mwovu urithi huu
  alternative: Kutaja tu kuwa urithi unatoka kwa Mungu bila kueleza tendo la kuamuru
  rationale: Muundo huu unaendeleza wazo la mstari wa kwanza kwamba fungu la mwovu linatoka kwa Mungu. Haufafanui zaidi asili au namna ya hukumu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari miwili imehifadhiwa ili kuonyesha ulinganifu wa shairi la Kiebrania.
