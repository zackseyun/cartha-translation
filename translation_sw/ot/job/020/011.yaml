  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַ֭צְמוֹתָי/ו מָלְא֣וּ עלומ/ו וְ֝/עִמּ֗/וֹ עַל עָפָ֥ר תִּשְׁכָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/011.yaml
  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: sw
  text: Mifupa yake imejaa nguvu za ujana wake[a], lakini nguvu hizo zitalala pamoja naye mavumbini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mifupa yake imejaa ujana wake”; neno la Kiebrania linaweza kumaanisha ujana wenyewe au nguvu zinazohusishwa na ujana.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: mifupa yake
  rationale: Nomino עֶצֶם kwa kawaida humaanisha ‘mfupa’; wingi wenye kiambishi cha nafsi ya tatu umoja wa kiume unatafsiriwa moja kwa moja ‘mifupa yake’ na kuhifadhi taswira halisi ya Kiebrania.
- source_word: מָלְאוּ
  choice: imejaa
  rationale: Kitenzi ni Qal timilifu, nafsi ya tatu wingi, kikirejelea mifupa. Kiswahili hutumia upatanisho wa ngeli ya mifupa kwa umoja wa kisarufi (‘imejaa’). Hali timilifu hapa inaweza kueleza hali iliyokamilika na inayoonekana katika maelezo ya kishairi.
- source_word: עֲלוּמָיו
  choice: nguvu za ujana wake
  rationale: Neno linaweza kumaanisha ujana wenyewe au nguvu zinazohusishwa na ujana. ‘Nguvu za ujana wake’ huwasilisha maana inayodokezwa katika muktadha bila kuficha uwezekano wa maana ya ‘ujana wake,’ ambao umewekwa katika tanbihi.
- source_word: וְעִמּוֹ
  choice: pamoja naye
  rationale: Kihusishi עִם pamoja na kiambishi chake kwa kawaida humaanisha ‘pamoja naye’; hapa kinaonyesha kwamba nguvu hizo zinafuatana naye hadi mautini.
- source_word: עַל־עָפָר
  choice: mavumbini
  rationale: Ingawa עַל kimsingi ni ‘juu ya,’ katika taswira ya kifo na kuzikwa, ‘mavumbini’ ni Kiswahili cha kawaida na huhifadhi wazo la vumbi kama mwisho wa mwanadamu.
- source_word: תִּשְׁכָּב
  choice: zitalala
  rationale: Ni Qal isiyotimilifu, nafsi ya tatu umoja wa kike. Kirejeleo chake kinaelekea kuwa ujana au nguvu za ujana. Kwa kuwa Kiswahili kinahitaji upatanisho wa wazi, ‘nguvu hizo zitalala’ huepuka kiwakilishi kisichoeleweka huku kikihifadhi taswira ya kulala mavumbini.
theological_decisions:
- issue: Kirejeleo cha תִּשְׁכָּב (‘kitalala’)
  choice: nguvu hizo zitalala
  alternative: ujana wake utalala
  rationale: Kiebrania kina kirejeleo cha kike kisichotajwa wazi, kinachoweza kueleweka kuwa ujana au nguvu za ujana. Tafsiri kuu inafuata maana ya nguvu za ujana katika kishazi cha kwanza, huku tanbihi ikihifadhi maana mbadala ya ujana wenyewe; hakuna hitimisho la kimadhehebu linaloingizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira halisi ya ‘mifupa’ na ‘kulala mavumbini’ imehifadhiwa. Kirai ‘nguvu hizo’ kinarudiwa kwa uwazi wa kawaida wa Kiswahili, kwa sababu kiwakilishi pekee kingekuwa na kirejeleo kisicho wazi.
