base_translation:
  language: en
  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: sw
  text: Kwa maana amewaponda maskini na kuwaacha; amepora nyumba, wala hataijenga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya hukumu iliyotajwa katika muktadha; “kwa maana” ni cha kawaida na kinadumisha nguvu yake ya ufafanuzi.
- source_word: רִצַּץ
  choice: amewaponda
  rationale: Kitenzi hiki kimsingi humaanisha kuponda au kuvunja. “Amewaponda” kinahifadhi picha kali ya Kiebrania bila kuibadili moja kwa moja kuwa dhana ya jumla ya ukandamizaji.
- source_word: עָזַב
  choice: kuwaacha
  rationale: “Kuwaacha” huwasilisha wazi tendo la kuwatelekeza au kutowajali maskini, huku kikibaki karibu na maana pana ya kitenzi cha Kiebrania.
- source_word: דַּלִּים
  choice: maskini
  rationale: Neno hili linaweza kumaanisha maskini, wanyonge, au wahitaji; “maskini” ndilo chaguo la kawaida na linalofaa katika muktadha wa unyang’anyi wa mali.
- source_word: בַּיִת
  choice: nyumba
  rationale: Pamoja na kitenzi cha kupora na kurejelea kujenga, maana ya jengo au mali ya nyumba ndiyo ya moja kwa moja hapa.
- source_word: גָּזַל
  choice: amepora
  rationale: Kitenzi hiki hudokeza kunyang’anya au kuchukua kwa nguvu; “amepora” ni cha asili katika Kiswahili na kinabeba wazo la unyang’anyi kuliko wizi wa siri.
- source_word: וְלֹא יִבְנֵהוּ
  choice: ambayo hakuijenga
  rationale: Ingawa umbo la kitenzi linaweza kusomwa kwa mwelekeo wa wakati ujao, katika muundo huu linaweza kueleza nyumba aliyopora bila kuwa yeye aliyeijenga. Tafsiri hii ni ya asili katika Kiswahili na mbadala wa wakati ujao umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mwelekeo wa wakati na uhusiano wa וְלֹא יִבְנֵהוּ na “nyumba”
  choice: nyumba ambayo hakuijenga
  alternative: nyumba, lakini hataijenga upya
  rationale: Kiebrania kinaruhusu kuelewa kishazi kuwa kinaifafanua nyumba aliyonyakua, lakini umbo la kitenzi pia linaweza kueleweka kuwa la wakati ujao katika muktadha wa hukumu. Hakuna fundisho maalumu la kidhehebu linalopaswa kuamua kati ya masomo hayo; kwa hiyo mbadala umeonyeshwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Amewaponda” kinahifadhi ukali wa taswira ya Kiebrania, huku “amepora nyumba” kikiwa cha kawaida na kinachoeleweka kwa wasomaji wa leo.
