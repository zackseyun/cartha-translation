  text: Ninasikia karipio linaloniaibisha, nayo roho itokanayo na ufahamu wangu[a] inanijibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ya ufahamu wangu”; Kiebrania kinaweza kueleweka kuwa roho hiyo inahusishwa kwa karibu na ufahamu wa msemaji, badala ya kusisitiza kwamba inatokana nao.
