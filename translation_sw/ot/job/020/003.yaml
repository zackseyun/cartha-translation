lexical_decisions:
- source_word: מוּסַר
  choice: karipio
  rationale: Katika muktadha huu neno hili linamaanisha maonyo au masahihisho ya maneno ambayo Sofari anayapokea kama shutuma, si nidhamu ya jumla.
- source_word: כְּלִמָּתִי
  choice: linaloniaibisha
  rationale: Kishazi hiki cha uhusiano kinaeleza kwa Kiswahili cha kawaida kwamba karipio hilo linamletea msemaji aibu au fedheha.
- source_word: אֶשְׁמָע
  choice: Ninasikia
  rationale: Wakati wa sasa unaonyesha kitendo cha Sofari kupokea karipio hilo wakati huu wa mazungumzo.
- source_word: רוּחַ
  choice: roho
  rationale: Neno hili linahifadhi taswira ya Kiebrania ya msukumo au hali ya ndani, bila kulifinya kuwa 'akili' pekee.
- source_word: מִבִּינָתִי
  choice: ya ufahamu wangu
  rationale: Huu ni usemi wa kawaida unaohusianisha roho ya ndani na ufahamu wa msemaji; tanbihi inahifadhi uwezekano wa kuelewa kihusishi kama chanzo, yaani 'kutokana na ufahamu wangu.'
- source_word: יַעֲנֵנִי
  choice: inanijibu
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi ענה pamoja na kiambishi cha nafsi ya kwanza; tanbihi inahifadhi maana inayowezekana ya roho kumsukuma msemaji ajibu.
