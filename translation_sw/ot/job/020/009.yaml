  text: עַ֣יִן שְׁ֭זָפַתּ/וּ וְ/לֹ֣א תוֹסִ֑יף וְ/לֹא ע֝֗וֹד תְּשׁוּרֶ֥/נּוּ מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/009.yaml
  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: sw
  text: Jicho lililomwona halitamwona tena[a], wala mahali pake hapatamwona tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jicho lililomtazama halitafanya hivyo tena.” Kiebrania kinatumia “jicho” katika umoja kwa njia ya kishairi, na katika mstari wa pili kinapa “mahali pake” uwezo wa kuona kama mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Jicho
  rationale: Nahifadhi nomino ya umoja ya kishairi badala ya kuirahisisha kuwa ‘hakuna mtu’; Kiswahili kinaweza kutumia ‘jicho’ kwa namna hii.
- source_word: שְׁזָפַתּוּ
  choice: lililomwona
  rationale: Kitenzi kina maana ya kumwona au kumtazama; ‘lililomwona’ ni cha kawaida na kinafaa katika ulinganifu wa mistari.
- source_word: וְלֹא תוֹסִיף
  choice: halitamwona tena
  rationale: Katika muktadha huu, יסף yenye ukanushi huonyesha jambo kutotokea tena; yambwa ‘-mw-’ imeendelezwa kutoka kishazi kilichotangulia ili maana iwe wazi.
- source_word: וְלֹא עוֹד
  choice: wala ... tena
  rationale: Kirai hiki hukazia kwamba jambo hilo halitatokea tena; ‘wala ... tena’ ni Kiswahili cha asili na huhifadhi ulinganifu.
- source_word: תְּשׁוּרֶנּוּ
  choice: hapatamwona
  rationale: Kitenzi שׁור humaanisha kumwangalia au kumwona. ‘Kumwona’ ni wazi na hudumisha taswira ya mahali palipopewa uwezo wa kuona.
- source_word: מְקוֹמוֹ
  choice: mahali pake
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi uhuishaji wa kishairi wa mahali pake kama kitu kinachoweza kumwona.
theological_decisions: []
