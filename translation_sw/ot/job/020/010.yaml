  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: sw
  text: Wanawe watajitafutia kibali kwa maskini,[a] na mikono yake itarejesha mali yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanawe watawatuliza maskini”; kitenzi cha Kiebrania kinaweza kumaanisha kutafuta kibali au kuwatuliza wale waliokosewa.
    reason: lexical_alternative
  - marker: b
    text: Au, “itarejesha mali zake” au “nguvu zake”; nomino ya Kiebrania inaweza kumaanisha mali, rasilimali, au nguvu, ingawa “mali” inafaa zaidi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: wanawe
  rationale: Nomino ya Kiebrania ni ya kiume katika wingi, ikiwa na kiambishi cha nafsi ya tatu umoja wa kiume; “wanawe” inadumisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יְרַצּוּ
  choice: wataomba kibali cha
  rationale: Katika kauli ya Piel, kitenzi hapa kinaweza kumaanisha kutafuta kukubaliwa au kuwatuliza waliokosewa; “kuomba kibali cha” ni usemi wa asili unaohifadhi wazo la kutafuta kukubaliwa bila kulazimisha maana moja tu.
- source_word: דַלִּים
  choice: maskini
  rationale: Neno hili humaanisha watu maskini, wahitaji, au walio dhaifu kijamii; “maskini” ndilo chaguo la moja kwa moja na linalofaa muktadha.
- source_word: יָדָיו
  choice: mikono yake mwenyewe
  rationale: “Mikono” ni tafsiri halisi, na “yake mwenyewe” huonyesha kwamba yeye binafsi ndiye anayefanya urejeshaji.
- source_word: תָּשֵׁבְנָה
  choice: itarudisha
  rationale: Hiphil ya שוב ina maana ya kusababisha kitu kirudi, yaani kukirudisha au kukirejesha; umoja wa kitenzi unafuata upatanisho wa kawaida wa Kiswahili na “mikono” katika ngeli ya mi-/mi-.
- source_word: אוֹנוֹ
  choice: mali yake
  rationale: אוֹן linaweza kutaja mali, rasilimali, au nguvu; “mali yake” linafaa zaidi katika muktadha wa kuwalipa au kuwarudishia maskini.
