  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: sw
  text: 'Mbingu zitafunua uovu wake[a],

    na dunia[b] itainuka dhidi yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatia yake”; neno la Kiebrania linaweza kumaanisha tendo ovu au hatia inayotokana nalo.
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi”; hata hivyo, “dunia” inalingana vizuri zaidi na “mbingu” katika muktadha huu wa kishairi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: zitafunua
  rationale: Kauli ya Piel isiyotimilika ina maana ya kuweka wazi au kufanya jambo lijulikane; “zitafunua” ni ya kawaida na inadumisha taswira ya kufichuliwa kwa uovu.
- source_word: שָׁמַיִם
  choice: Mbingu
  rationale: Nomino hii ya Kiebrania ni ya wingi kwa umbo na hapa inawakilishwa kama shahidi wa ulimwengu; “mbingu” inadumisha ushairi na ulinganifu wake na “dunia.”
- source_word: עֲוֺנוֹ
  choice: uovu wake
  rationale: עָוֹן inaweza kumaanisha tendo ovu au hatia inayotokana nalo. “Uovu wake” ni Kiswahili cha sasa kinachoeleweka na kinadumisha uzito wa kimaadili bila kuondoa uwezekano wa maana ya hatia, unaotajwa katika tanbihi.
- source_word: וְאֶרֶץ
  choice: na dunia
  rationale: אֶרֶץ inaweza kuwa “dunia” au “nchi,” lakini katika ulinganifu wa kishairi na “mbingu,” “dunia” ndiyo maana inayofaa zaidi.
- source_word: מִתְקוֹמָמָה
  choice: itainuka
  rationale: Umbo hili la קום linaonyesha kuinuka kwa upinzani. “Itainuka” linahifadhi uhuishaji wa dunia katika mstari huu.
- source_word: לוֹ
  choice: dhidi yake
  rationale: Ingawa ל mara nyingi humaanisha “kwa” au “kuelekea,” pamoja na kuinuka kwa uhasama hapa maana yake ni ya kumpinga; “dhidi yake” ni Kiswahili cha kawaida na sahihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. Mpangilio wa mistari miwili unadumisha ulinganifu wa mbingu na dunia na uhuishaji wake kama mashahidi dhidi ya mtu mwovu.
