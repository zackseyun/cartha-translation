translation:
  language: sw
  text: Anaichomoa[a], nayo inatoka mwilini mwake; ncha inayometameta inatoka katika nyongo yake; vitisho vinamjia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upanga unaometameta unatoka katika kibofu chake cha nyongo”; Kiebrania kinatumia taswira kali ya viungo vya mwili na huenda kinarejelea ncha ya silaha inayong'aa inapochomoza.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַף
  choice: Anauchomoa
  rationale: Kitenzi hiki humaanisha kuchomoa au kuvuta kitu nje, mara nyingi silaha. Kiambishi cha yambwa '-u-' kinarejelea silaha inayodokezwa na muktadha bila kuiainisha zaidi.
- source_word: וַיֵּצֵא
  choice: nao unatoka
  rationale: Kitenzi hiki ni 'kutoka.' Kiswahili kinahitaji upatanisho na silaha inayodokezwa; 'nao' huendeleza tendo la kuichomoa na kuonyesha kuwa silaha hiyo inatoka mwilini.
- source_word: מִגֵּוָה
  choice: mwilini mwake
  rationale: Neno גֵּוָה hapa huelekea kumaanisha mwili au kiwiliwili. 'Mwilini mwake' ni wazi na halibainishi sehemu ya mwili kupita ushahidi wa Kiebrania.
- source_word: וּבָרָק
  choice: ncha inayometameta
  rationale: בָּרָק kimsingi ni umeme au mng'ao. Katika taswira ya silaha iliyopenya mwilini, huenda linarejelea kwa njia ya sitiari ncha au makali yanayometameta; 'ncha inayometameta' huhifadhi mng'ao na muktadha wa silaha.
- source_word: מִמְּרֹרָתוֹ
  choice: katika nyongo yake
  rationale: Neno hili linaweza kutaja nyongo, kibofu cha nyongo, au uchungu. Muktadha wa jeraha la mwili unapendelea maana ya kianatomia; 'nyongo yake' ni ya kawaida na yenye nguvu bila kuwa ya kitabibu kupita kiasi.
- source_word: יַהֲלֹךְ עָלָיו
  choice: vinamjia
  rationale: Muundo wa הלך pamoja na על unaweza kuonyesha kitu kinachomjia au kumwangukia mtu. 'Vinamjia' ni Kiswahili cha asili kinachoeleza kuingiwa na hofu.
- source_word: אֵמִים
  choice: vitisho
  rationale: Nomino ya wingi humaanisha mambo ya kutisha au hofu kuu. 'Vitisho' huhifadhi wingi na uzito wa neno la Kiebrania.
