base_translation:
  language: en
  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: sw
  text: Hataona mikondo[a], mito, na vijito vya asali na maziwa yaliyoganda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Asione mikondo, mito, na vijito vya asali na maziwa yaliyoganda.”
    reason: Muundo wa אַל יֵרֶא unaweza pia kueleweka kama ombi au laana badala ya taarifa ya wakati ujao.
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: Hataona
  rationale: Katika muktadha huu wa kishairi, אַל pamoja na kitenzi kisichotimilika hueleza kuwa mtu mwovu hataushuhudia wala kuufurahia wingi huu. Kiswahili cha wakati ujao hasi ni cha kawaida na kinafaa katika muktadha, ingawa muundo wa ombi au laana unawezekana pia.
- source_word: בִפְלַגּוֹת
  choice: mifereji
  rationale: פְלַגּוֹת hurejelea njia au mikondo ya maji. ‘Mifereji’ huitofautisha kwa kiasi na נהרי na נחלי na kuhifadhi mlundikano wa taswira za maji katika Kiebrania.
- source_word: נַהֲרֵי
  choice: mito
  rationale: Huu ni wingi wa hali ya kutegemea wa נָהָר, ‘mto.’ Neno limetafsiriwa kando ili kuhifadhi msisitizo wa kishairi wa vyanzo vingi vya maji.
- source_word: נַחֲלֵי
  choice: vijito vya
  rationale: נַחַל inaweza kumaanisha kijito, mkondo wa msimu, au bonde la mto. ‘Vijito vya’ ni wazi kwa wasomaji wa sasa na hudumisha taswira ya maji yenye wingi.
- source_word: דְּבַשׁ
  choice: asali
  rationale: Hii ndiyo maana ya kawaida ya דְּבַשׁ na inafaa katika taswira ya wingi na ustawi.
- source_word: וְחֶמְאָה
  choice: na maziwa yaliyoganda
  rationale: חֶמְאָה linaweza kumaanisha maziwa mazito yaliyoganda, samli laini, au siagi. ‘Maziwa yaliyoganda’ yanaonyesha bidhaa ya maziwa ya ufugaji bila kuingiza wazo la siagi iliyosindikwa kwa njia ya kisasa.
theological_decisions:
- issue: Je, אַל יֵרֶא ni taarifa ya wakati ujao au ombi/laana?
  choice: Hataona
  alternative: Asione
  rationale: Muktadha unaeleza yatakayompata mtu mwovu, hivyo taarifa ya wakati ujao inaeleweka vizuri. Hata hivyo, nguvu ya kijusi ya אַל haijafichwa; imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mlundikano wa majina matatu ya njia za maji umehifadhiwa kwa sababu ni sehemu ya nguvu ya kishairi ya mstari.
