- source_word: בְּתוֹךְ חִכּוֹ
  choice: ndani ya kinywa chake
  rationale: חך humaanisha hasa kaakaa, lakini katika Kiswahili cha kawaida “ndani ya kinywa chake” huwasilisha picha hiyo kwa uwazi; maana halisi zaidi imewekwa katika tanbihi.
