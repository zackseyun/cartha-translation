translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vishazi viwili vinavyoonyesha chakula kikigeuka kuwa sumu ndani ya mwovu; lugha ya kiufundi au ya kizamani imeepukwa.
