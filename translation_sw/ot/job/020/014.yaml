translation:
  language: sw
  text: Chakula chake tumboni mwake hugeuka[a]; huwa sumu ya nyoka ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkate wake ndani ya matumbo yake hugeuka; ni nyongo ya nyoka ndani yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְמוֹ
  choice: chakula chake
  rationale: Ingawa לֶחֶם mara nyingi humaanisha kihalisi ‘mkate,’ hapa inawakilisha kwa upana zaidi kile alichokula; ‘chakula chake’ ni Kiswahili cha kawaida na huhifadhi taswira ya kitu kilicholiwa.
- source_word: בְּמֵעָיו
  choice: tumboni mwake
  rationale: Neno hilo hurejelea viungo vya ndani au matumbo. ‘Tumboni mwake’ ni usemi wa kawaida unaofaa taswira ya umeng’enyaji.
- source_word: נֶהְפָּךְ
  choice: hugeuka
  rationale: Nifali ya הפך inaonyesha kubadilika kwa hali ndani yake. ‘Hugeuka’ ni fupi na huhifadhi taswira ya chakula kubadilika kuwa kitu kingine.
- source_word: מְרוֹרַת
  choice: sumu ya
  rationale: Ingawa neno linahusiana na uchungu au nyongo, likitumiwa pamoja na nyoka hapa linaonyesha sumu. ‘Sumu’ huwasilisha maana hiyo wazi kwa wasomaji wa sasa.
- source_word: פְּתָנִים
  choice: nyoka wenye sumu
  rationale: Jina la Kiebrania linamaanisha aina ya nyoka mwenye sumu, lakini utambulisho wake mahususi hauna uhakika. Tafsiri pana ‘nyoka wenye sumu’ huepuka kutaja spishi isiyothibitishwa huku ikihifadhi taswira.
- source_word: בְּקִרְבּוֹ
  choice: ndani yake
  rationale: Kirai hiki hueleza kilicho ndani ya mtu; ‘ndani yake’ ni Kiswahili cha kawaida na huhifadhi nguvu ya taswira ya mwili.
