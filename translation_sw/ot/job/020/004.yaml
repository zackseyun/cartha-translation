  text: הֲ/זֹ֣את יָ֭דַעְתָּ מִנִּי עַ֑ד מִנִּ֤י שִׂ֖ים אָדָ֣ם עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: sw
  text: Je, umelijua hili tangu kale,[a] tangu mwanadamu alipowekwa duniani?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangu binadamu alipowekwa duniani.”
    reason: Hutoa mbadala wa maana ya kijumla ya אָדָם bila kubadili umoja wa uwakilishi kuwa wingi wa watu binafsi.
lexical_decisions:
- source_word: הֲזֹאת
  choice: Je, ... hili
  rationale: Kiulizi pamoja na kiwakilishi cha kuonyesha huanzisha swali la balagha; “Je, ... hili” ni Kiswahili cha kawaida na hudumisha umahususi wa Kiebrania.
- source_word: יָדַעְתָּ
  choice: hulijui
  rationale: Kitenzi timilifu cha nafsi ya pili ya kiume katika swali la balagha kinaeleza maarifa yanayotarajiwa kudumu; wakati uliopo wa Kiswahili unasikika kwa asili hapa.
- source_word: מִנִּי עַד
  choice: tangu zamani
  rationale: Nahau hii inaelekeza kwenye wakati wa kale sana; “tangu zamani” ni ya asili na wazi bila kuongeza ufafanuzi usiotajwa.
- source_word: מִנִּי שִׂים
  choice: tangu ... alipowekwa
  rationale: Kirai hiki huonyesha mwanzo wa kipindi, yaani wakati wa kuwekwa kwa mwanadamu; muundo wa “tangu ... alipowekwa” hudumisha nguvu hiyo ya wakati.
- source_word: שִׂים
  choice: alipowekwa
  rationale: Kitenzi kina maana ya kuweka au kusimamisha mahali; “kuwekwa” kinafaa moja kwa moja na kirai kinachofuata kuhusu dunia.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Nomino ya umoja imetumiwa kwa maana ya kijumla na ya uwakilishi. “Mwanadamu” huhifadhi umoja huo huku ikimaanisha jamii ya binadamu kwa kawaida katika Kiswahili.
- source_word: עֲלֵי אָרֶץ
  choice: duniani
  rationale: Hii ndiyo namna ya kawaida na yenye hadhi ya kusema “juu ya dunia/katika dunia” katika muktadha huu.
theological_decisions:
- issue: Maana ya kijumla ya אָדָם katika kauli kuhusu mwanzo wa binadamu
  choice: mwanadamu
  alternative: wanadamu
  rationale: Kiebrania kina nomino ya umoja inayowakilisha jamii nzima. “Mwanadamu” hudumisha umbo la umoja na maana ya kijumla; namna ya wingi imewekwa katika tanbihi ili kuonyesha wazi maana ya jamii ya binadamu bila kulazimisha mojawapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa, na sentensi imetungwa kwa urahisi wa kusomeka kwa sauti.
