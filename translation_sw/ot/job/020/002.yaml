base_translation:
  language: en
  yaml_path: translation/ot/job/020/002.yaml
  text: Therefore my thoughts answer me[b][a], because of my inward agitation.
translation:
  language: sw
  text: Kwa hiyo mawazo yangu yananifanya nijibu[a], kwa sababu ya msukumo ulio ndani yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawazo yangu yananijibu,” au, “mawazo yangu yanayonisumbua yananifanya nijibu.” Nahau ya Kiebrania imebanwa; inaweza kumaanisha kwamba mawazo yake yanajibu ndani yake au yanamlazimisha ajibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu ya haraka iliyo ndani yangu,” au, “kwa sababu ya fadhaa yangu ya ndani.” Neno la Kiebrania linaweza kumaanisha haraka, lakini hapa huenda linaonyesha msukumo wa haraka au hali ya ndani ya kutotulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha matokeo au hitimisho linalotokana na maneno yaliyotangulia.
- source_word: שְׂעִפַּי
  choice: mawazo yangu
  rationale: Neno hili linaweza kumaanisha mawazo yenye kusumbua au kugawanyika; tafsiri kuu inalibakiza kwa upana wake, huku muktadha na tanbihi vikionyesha hali ya kutotulia.
- source_word: יְשִׁיבוּנִי
  choice: yananifanya nijibu
  rationale: Muundo wa Kiebrania umebanwa na unaweza kueleza kwamba mawazo yake yanamchochea kutoa jibu. Kiswahili hiki ni cha kawaida na kinahifadhi uhusiano huo wa kisababishi.
- source_word: וּבַעֲבוּר
  choice: kwa sababu ya
  rationale: Kirai hiki kinaonyesha sababu; kiunganishi וּ kimeingizwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: חוּשִׁי
  choice: msukumo
  rationale: Neno hili linahusiana na haraka na hapa linaweza kuonyesha msukumo wa ghafla au hali ya ndani ya kutotulia inayomfanya Zofari ajibu.
- source_word: בִי
  choice: ulio ndani yangu
  rationale: Kirai hiki kinaonyesha kwamba msukumo huo unatokea ndani ya msemaji.
