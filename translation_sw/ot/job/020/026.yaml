  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: sw
  text: Giza lote limewekwa akiba kwa ajili ya vitu vyake vilivyofichwa[a]; moto ambao haukupuliziwa utamteketeza[b]; utadhuru kile kilichobaki katika hema lake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Giza lote limewekwa akiba kwa ajili yake.” Kirai cha Kiebrania kinachohusisha vitu vilivyofichwa au hazina zake ni kigumu; huenda kikarejelea maafa yaliyohifadhiwa kwa ajili yake, au yaliyofichwa miongoni mwa vitu alivyoweka akiba.
    reason: alternative_reading
  - marker: b
    text: “Moto ambao haukupuliziwa” huenda ukamaanisha moto ambao haukuwashwa wala kuchochewa kwa pumzi ya mwanadamu, labda ukidokeza moto uliotumwa na Mungu au usiohitaji kuchochewa na mwanadamu.
    reason: lexical_alternative
  - marker: c
    text: Au, “utamdhuru manusura katika hema lake,” au “utateketeza mabaki katika hema lake.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: Giza lote
  rationale: Hudumisha taswira halisi na ya kimafumbo ya giza, ambayo katika muktadha inaweza kumaanisha maafa au hukumu, bila kuifafanua kupita kiasi.
- source_word: טָמוּן
  choice: limewekwa akiba
  rationale: Huwasilisha wazo la kitu kilichofichwa au kuhifadhiwa kwa wakati ujao; hapa Kiswahili cha 'kuwekwa akiba' ni cha kawaida na kinafaa katika muktadha wa maafa yaliyohifadhiwa.
- source_word: לִצְפּוּנָיו
  choice: kwa ajili ya vitu vyake vilivyofichwa
  rationale: Kirai cha Kiebrania ni kigumu na kinaweza kuelekeza ama kwenye vitu vyake vilivyofichwa/hazina zake ama kwenye jambo lililowekwa akiba kwa ajili yake. Tafsiri hii huhifadhi uhusiano wake na mzizi wa kuficha na kuacha utata uelezwe katika tanbihi.
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: moto ... utamteketeza
  rationale: Kitenzi hicho kwa moto humaanisha kula au kuteketeza; 'utamteketeza' ni Kiswahili cha asili kinachohifadhi nguvu ya uharibifu.
- source_word: לֹא נֻפָּח
  choice: ambao haukupuliziwa
  rationale: Huhifadhi taswira ya moto usiopuliziwa au usiochochewa kwa pumzi ya mwanadamu, bila kutaja wazi chanzo chake.
- source_word: יֵרַע
  choice: utateketeza
  rationale: Mzizi kwa kawaida huhusiana na kutenda mabaya au kudhuru. Katika muktadha wa moto, 'utateketeza' hutoa maana ya uharibifu kwa lugha ya kawaida, huku uwezekano wa 'kudhuru' ukihifadhiwa katika tanbihi.
- source_word: שָׂרִיד
  choice: kile kilichobaki
  rationale: Neno linaweza kumaanisha mabaki au manusura. Uundaji huu wa jumla haubainishi kama kinachokusudiwa ni mtu, mali, au kaya iliyosalia.
- source_word: בְּאָהֳלוֹ
  choice: katika hema lake
  rationale: Huhifadhi taswira halisi ya hema, ambalo pia linaweza kuwakilisha makao au kaya ya mtu.
theological_decisions:
- issue: Chanzo cha moto ambao haukupuliziwa
  choice: Tafsiri haisemi wazi kuwa moto umetumwa na Mungu.
  alternative: Moto wa Mungu au moto usiowashwa na mwanadamu.
  rationale: Kiebrania kinasema tu kuwa moto haukupuliziwa. Dokezo la hukumu ya Mungu linawezekana, lakini kulifanya kuwa wazi katika matini kungeondoa utata wa asili.
- issue: Rejeo la שָׂרִיד katika hema
  choice: kile kilichobaki
  alternative: manusura katika hema lake
  rationale: Neno linaweza kurejelea manusura au mabaki. Tafsiri ya jumla huepuka kuamua bila msingi kama ni mtu aliyenusurika au mabaki ya mali/kaya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Taswira za “giza,” “moto,” na “hema” zimehifadhiwa. Mpangilio wa alama za tanbihi umewekwa karibu na vifungu vinavyohusika, na utata wa לִצְפּוּנָיו, לֹא נֻפָּח, יֵרַע, na שָׂרִיד haujafichwa.
