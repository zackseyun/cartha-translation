lexical_decisions:
- source_word: אִם
  choice: Hata kama
  rationale: Katika muktadha huu wa kishairi, neno hili linaanzisha hali ya kukubali jambo kabla ya kulipinga katika mstari unaofuata; ‘Hata kama’ pia huhifadhi uwezekano wa kulisoma kama sharti.
- source_word: יַעֲלֶה
  choice: inapanda
  rationale: Kitenzi kinaonyesha mwendo wa kwenda juu na kinadumisha taswira ya wima katika ushairi.
- source_word: לַשָּׁמַיִם
  choice: hadi mbinguni
  rationale: Hii ni usemi wa kawaida na wenye hadhi katika Kiswahili kwa kufikia upeo wa juu wa anga.
- source_word: שִׂיאוֹ
  choice: fahari yake
  rationale: Nomino inaweza kueleza kimo, ukuu, au hali ya kutukuzwa. ‘Fahari yake’ huwasilisha kuinuliwa kwa mtu bila kuifunga taswira kwenye urefu wa mwili pekee.
- source_word: וְרֹאשׁוֹ
  choice: na kichwa chake
  rationale: Tafsiri ya moja kwa moja huhifadhi taswira ya mtu aliyeinuka sana; inaweza pia kudokeza kilele chake.
- source_word: לָעָב
  choice: mawinguni
  rationale: עָב humaanisha wingu au wingu zito; ‘mawinguni’ ni ya asili katika Kiswahili na inaendana na ulinganifu wa ‘mbinguni.’
- source_word: יַגִּיעַ
  choice: kinafika
  rationale: Kitenzi hapa huonyesha kufikia mahali fulani, na ‘kinafika’ ni wazi na cha kawaida.
theological_decisions:
- issue: Iwapo שִׂיאוֹ inaonyesha kimo halisi au kuinuliwa kwa hadhi na kiburi
  choice: fahari yake
  alternative: kimo chake / ukuu wake
  rationale: Muktadha wa mwovu aliyeinuliwa unapendekeza fahari au ukuu, lakini taswira ya kufika mbinguni bado imehifadhiwa; tanbihi inaweka wazi maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa kishairi, wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa mstari na taswira ya kwenda juu vimehifadhiwa.
