base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: sw
  text: Anapokaribia kulijaza tumbo lake, Mungu atamtumia hasira yake inayowaka dhidi yake, na atamnyeshea hasira hiyo iwe chakula chake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na atamnyeshea hasira hiyo wakati mtu huyo anakula.” Kirai cha mwisho katika Kiebrania ni kigumu; huenda kinaonyesha wakati wa kula badala ya kuunganisha hukumu inayonyesha moja kwa moja na chakula chake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא
  choice: Anapokaribia kulijaza
  rationale: 'Muundo huu unaeleweka hapa kama hali ya wakati: hukumu inamfikia mtu mwovu anapokuwa karibu kushibisha tamaa yake. Tafsiri hii ni ya kawaida katika Kiswahili na bado inahifadhi wazo la ‘kujaza.’'
- source_word: בִטְנוֹ
  choice: tumbo lake
  rationale: ‘Tumbo’ linahifadhi taswira halisi ya mwili na kula, badala ya kuibadili kuwa dhana ya ‘tamaa’ au ‘hamu.’
- source_word: יְשַׁלַּח בּוֹ
  choice: atampelekea
  rationale: Kitenzi שלח kina maana ya kutuma au kupeleka, na בּוֹ hapa huonyesha tendo linalomwelekea kwa uhasama. ‘Atampelekea’ ni Kiswahili cha asili kinachowasilisha pande zote mbili.
- source_word: חֲרוֹן אַפּוֹ
  choice: joto kali la hasira yake
  rationale: Kirai hiki kina taswira ya hasira inayowaka au yenye joto. ‘Joto kali la hasira’ kinahifadhi sitiari hiyo kwa lugha inayoeleweka.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: na kumnyeshea hasira hiyo
  rationale: Kitenzi hiki husababisha taswira ya mvua ya hukumu inayomwangukia mtu. ‘Hasira hiyo’ huweka wazi kitu kinachonyeshwa bila kuongeza hukumu nyingine.
- source_word: בִּלְחוּמוֹ
  choice: akiwa anakula
  rationale: Neno la mwisho ni gumu, lakini lina uhusiano na chakula au tendo la kula. Tafsiri ya wakati inatoa Kiswahili cha kawaida huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Mtenda aliyedokezwa katika vitenzi vya hukumu
  choice: Mungu ametajwa wazi kuwa mtenda.
  alternative: Kutumia kiwakilishi ‘yeye’ tu au muundo usiotaja mtenda.
  rationale: Muktadha unaonyesha kwamba hasira na hukumu ni za Mungu. Kumtaja Mungu huondoa utata wa viwakilishi katika Kiswahili bila kuingiza dai jipya la kitheolojia.
- issue: Uhusiano wa hukumu na chakula katika kirai cha mwisho
  choice: Hukumu inamwangukia mtu akiwa anakula.
  alternative: Hasira inanyeshwa juu yake kama chakula chake.
  rationale: Kiebrania cha mwisho kina utata wa kweli. Matini kuu imechagua maana ya wakati iliyo wazi katika muktadha, huku maana inayohusisha hukumu moja kwa moja na chakula ikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Taswira za tumbo, joto la hasira, na kunyesha zimehifadhiwa. ‘Mungu’ ametajwa ili marejeo ya kiwakilishi yasiwe ya kutatanisha.
