base_translation:
  language: en
  yaml_path: translation/ot/job/020/008.yaml
  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: sw
  text: Kama ndoto, huruka, wala hapatikani[a]; hufukuzwa kama maono ya usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hawampati.” Kiebrania kina kitenzi cha nafsi ya tatu wingi kisichomtaja mtenda, chenye kiambishi cha yambwa kinachomaanisha “yeye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Kama ndoto
  rationale: Kiambishi כַּ־ kinaonyesha ulinganisho, na חֲלוֹם ni ‘ndoto.’ Tafsiri hii ni ya kawaida na inadumisha tashbihi.
- source_word: יָעוּף
  choice: anaruka na kutoweka
  rationale: Kitenzi עוּף kimsingi humaanisha ‘kuruka.’ Katika muktadha huu picha hiyo inaonyesha kuondoka na kutoweka upesi; nyongeza ‘na kutoweka’ huifanya maana hiyo ieleweke kwa Kiswahili bila kuondoa picha ya kuruka.
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: wala hapatikani
  rationale: 'Kiebrania kina kitenzi cha nafsi ya tatu wingi kisichotaja watendaji, pamoja na kiambishi cha yambwa: kihalisi, ‘wala hawampati.’ Kauli tendwa ya Kiswahili inahifadhi kutotajwa kwa watafutaji na kuweka mkazo kwa mtu aliyetoweka.'
- source_word: וְיֻדַּד
  choice: anafukuzwa
  rationale: Umbo la Hofali linaonyesha kwamba mhusika anasukumwa au kufukuzwa aondoke. ‘Anafukuzwa’ ni la asili katika Kiswahili na linadumisha nguvu ya picha.
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: kama maono ya usiku
  rationale: חֶזְיוֹן ni ‘maono,’ na לָיְלָה hapa ina uhusiano wa kijinsia wa nomino. ‘Maono ya usiku’ ni usemi wazi, wenye hadhi, na unaofuata muundo wa Kiebrania.
