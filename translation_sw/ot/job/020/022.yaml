review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two clauses and preserves the Hebrew metaphor of “hand.” However, “Katika utimilifu wa wingi wake” is a rather literal and unnatural double abstraction for בִּמְלֹאות שִׂפְקוֹ, whose temporal sense is better expressed as “Wakati wingi wake utakapokuwa kamili.”
  naturalness: “Wakati wingi wake utakapokuwa kamili” is more idiomatic Standard East African Swahili while retaining the compact, elevated poetic register. “Dhiki itamjia” and “kila mkono wa mwenye taabu utamkabili” are natural and suitably concise.
  terminology: “Mwenye taabu” appropriately preserves the lexical range of עָמֵל without prematurely specifying either an oppressed person or merely a laborer. “Dhiki” suitably renders the constriction/distress of יֵצֶר.
