  text: בִּ/מְלֹ֣אות שִׂ֭פְק/וֹ יֵ֣צֶר ל֑/וֹ כָּל יַ֖ד עָמֵ֣ל תְּבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: sw
  text: Wakati wingi wake utakapokuwa kamili[a], dhiki itamjia; kila mkono wa mwenye taabu utamkabili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakati utoshelevu wake utakapokuwa kamili.” Kiebrania ni kifupi; neno hili linaweza kumaanisha utoshelevu, wingi, au hali ya kuwa na vya kutosha.
    reason: lexical_alternative
  - marker: b
    text: “Mkono wa mwenye taabu” unaweza pia kutafsiriwa “mkono wa anayesumbuka” au “mkono wa mfanyakazi mwenye taabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות
  choice: Katika utimilifu wa
  rationale: Muundo wa ב pamoja na neno linalotokana na מלא una maana ya wakati na hali, yaani ‘wakati wa/katika utimilifu wa’; tafsiri hii inadumisha taswira fupi ya Kiebrania.
- source_word: שִׂפְקוֹ
  choice: wingi wake
  rationale: שׂפקו hapa huelekea kumaanisha kiasi cha kutosha, tele, au ufanisi. ‘Wingi wake’ ni Kiswahili cha kawaida kinachohifadhi wazo la kuwa na mali nyingi bila kulifungia kwenye maana moja tu.
- source_word: יֵצֶר לוֹ
  choice: dhiki itamjia
  rationale: Kitenzi kinaonyesha kubanwa au kuingia katika hali ya dhiki. ‘Dhiki itamjia’ huwasilisha tukio litakalompata kwa lugha ya asili na yenye heshima.
- source_word: כָּל יַד
  choice: kila mkono
  rationale: ‘Kila’ huhifadhi nguvu ya kugawa ya כָּל, na ‘mkono’ hudumisha sitiari ya Kiebrania ya uwezo au utendaji.
- source_word: עָמֵל
  choice: mwenye taabu
  rationale: עָמֵל linaweza kumaanisha mtu anayetaabika, mwenye huzuni au shida, au mfanyakazi anayesumbuka. ‘Mwenye taabu’ huhifadhi upana huu vizuri kuliko kulifanya wazi kuwa ‘aliyeonewa’.
- source_word: תְּבוֹאֶנּוּ
  choice: utamkabili
  rationale: בוא pamoja na kiwakilishi cha yambwa ni ‘kumjia/kumpata’; katika muktadha wa mkono wenye uhasama, ‘utamkabili’ huonyesha mwelekeo dhidi yake bila kupanua sana maana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka. Sitiari ya ‘mkono’ na ufupi wa sentensi ya Kiebrania vimedumishwa; alama zote za tanbihi ziko katika matini kuu.
