  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: sw
  text: Ingawa uovu ni mtamu kinywani mwake[a], huuficha chini ya ulimi wake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa uovu ni mtamu kinywani mwake.” Chembe ya Kiebrania inaweza kueleweka kwa maana ya sharti (“ikiwa”) au ya kukubali hali (“ingawa”); muktadha unaelekea kuunga mkono maana ya “ingawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ingawa
  rationale: Katika muktadha huu chembe אִם inaeleweka kwa maana ya kukubali hali inayotajwa (‘ingawa’), huku uwezekano wa maana ya sharti (‘ikiwa’) ukihifadhiwa katika tanbihi.
- source_word: תַּמְתִּיק
  choice: ni mtamu
  rationale: Hifili ya מתק pamoja na רָעָה kama kiima inaeleza uovu kuwa mtamu au wenye kupendeza; ‘ni mtamu’ ni ya kawaida na inadumisha taswira ya kuonja.
- source_word: בְּפִיו
  choice: kinywani mwake
  rationale: Tafsiri ya moja kwa moja inadumisha taswira halisi ya kinywa, inayokuzwa na kishazi sambamba ‘chini ya ulimi wake.’
- source_word: רָעָה
  choice: uovu
  rationale: Katika muktadha huu wa hekima neno linarejelea ubaya wa kimaadili ambao mtu mwovu anaufurahia.
- source_word: יַכְחִידֶנָּה
  choice: huuficha
  rationale: Hifili ya כחד ina maana ya kuficha; kiambishi cha ngeli ‘-u-’ kinarejelea ‘uovu.’ Wakati wa mazoea unafaa maelezo haya ya tabia yake.
- source_word: תַּחַת
  choice: chini ya
  rationale: Hii ni maana ya mahali inayofaa katika taswira ya kinywa na ulimi.
- source_word: לְשׁוֹנוֹ
  choice: ulimi wake
  rationale: Tafsiri ya moja kwa moja inadumisha picha ya mtu anayehifadhi na kufurahia uovu kwa siri.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kinywani mwake’ na ‘chini ya ulimi wake’ zinadumisha taswira halisi na usambamba wa Kiebrania; ‘huuficha’ ni ya asili katika maelezo ya tabia inayoendelea.
