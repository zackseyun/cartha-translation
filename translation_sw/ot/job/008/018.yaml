- source_word: וְכִחֶשׁ בּוֹ
  choice: ndipo mahali hapo patamkana
  rationale: כחש ב inaweza kumaanisha kumkana au kutomtambua. Kutaja ‘mahali hapo’ wazi kunafanya ubinafsishaji wa mahali ueleweke katika Kiswahili.
- source_word: לֹא רְאִיתִיךָ
  choice: Sijakuona
  rationale: Huhifadhi taswira halisi ya kuona na kauli ya moja kwa moja, bila kuipanua kuwa ‘sikujui.’
