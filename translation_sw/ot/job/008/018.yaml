  rationale: Kitenzi בלע katika muktadha huu kina wazo la kumezwa au kuondolewa kabisa. Kauli tendwa huhifadhi kutotajwa kwa mtendaji bila kufasiri moja kwa moja kuwa ‘kuangamizwa.’
- source_word: מִמְּקוֹמוֹ
  choice: kutoka mahali pake
