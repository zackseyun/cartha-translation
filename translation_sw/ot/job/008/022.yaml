base_translation:
  language: en
  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: sw
  text: Wanaokuchukia watavaa aibu, na hema la waovu halitakuwapo tena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “hema la waovu halipo.”
    reason: 'Tofauti ya wakati: Kiebrania kina kanusho la kuwapo ambalo kwa umbo ni la sasa, lakini muktadha unaweza kueleweka kuwa unaeleza matokeo ya wakati ujao.'
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: wanaokuchukia
  rationale: Kivumishi-tendo cha Qal katika wingi pamoja na kiambishi cha nafsi ya pili umoja kimetumiwa kama nomino. “Wanaokuchukia” ni Kiswahili cha kawaida na kinahifadhi yule anayelengwa na chuki hiyo.
- source_word: יִלְבְּשׁוּ
  choice: watavikwa
  rationale: Kitenzi לבשׁ humaanisha kuvaa au kujivika. Pamoja na nomino dhahania “aibu,” “watavikwa aibu” kinahifadhi taswira ya vazi kwa Kiswahili cha asili na chenye hadhi.
- source_word: בֹשֶׁת
  choice: aibu
  rationale: “Aibu” huwasilisha hali ya kuaibika na fedheha ya hadharani bila kuongeza ufafanuzi usiomo katika Kiebrania.
- source_word: וְאֹהֶל
  choice: na hema
  rationale: אֹהֶל ni “hema” kwa maana ya moja kwa moja. Ingawa inaweza kuwakilisha makao au nyumba ya watu, taswira halisi ya kishairi imehifadhiwa.
- source_word: רְשָׁעִים
  choice: la waovu
  rationale: Wingi huu unataja kundi la watu waovu. “Waovu” ni neno la kawaida na haliongezi aina maalumu ya uovu.
- source_word: אֵינֶנּוּ
  choice: halitakuwapo tena
  rationale: Kimuundo maana yake ni “halipo,” lakini muktadha wa matokeo yanayotarajiwa katika mistari ya 20–22 unaunga mkono usemi wa wakati ujao, “halitakuwapo tena.” Tanbihi inahifadhi tafsiri ya moja kwa moja zaidi.
theological_decisions:
- issue: Nguvu ya wakati katika kishazi cha mwisho
  choice: 'Wakati ujao/matokeo: “hema la waovu halitakuwapo tena”'
  alternative: 'Wakati wa sasa: “hema la waovu halipo”'
  rationale: Muktadha wa Ayubu 8:20–22 unaeleza matarajio kuhusu kurejeshwa kwa Ayubu na mwisho wa wapinzani wake. Wakati ujao unalingana vizuri na mtiririko huo, huku tanbihi ikihifadhi umbo la moja kwa moja la kanusho la kuwapo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira za “kuvikwa aibu” na “hema” zimehifadhiwa; sentensi imeandikwa kwa urahisi ili ieleweke na wasomaji wa kawaida.
