  text: Does papyrus grow where there is no marsh? Does reed grass flourish without water?[a]
translation:
  language: sw
  text: Je, mafunjo hukua pasipo kinamasi? Je, matete hustawi bila maji?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “papairosi” badala ya “mafunjo,” na “mwanzi” badala ya “matete”; Kiebrania hutaja mimea miwili ya maeneo oevu kwa usambamba wa kishairi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽגְאֶה
  choice: Je, ... yanaweza kukua
  rationale: Kiulizi הֲ kinaanzisha swali la balagha, na גאה hapa inaeleza ukuaji wa mmea. Muundo huu ni wa kawaida katika Kiswahili na unadumisha nguvu ya swali.
- source_word: גֹּמֶא
  choice: mafunjo
  rationale: Neno hili hutaja mmea wa maeneo oevu, hasa papairosi au aina ya unyasi mkubwa wa kinamasi. “Mafunjo” ni neno la Kiswahili linaloeleweka kwa mmea huo bila kuufanya kwa lazima kuwa spishi moja.
- source_word: בְּ/לֹ֣א בִצָּ֑ה
  choice: pasipo kinamasi
  rationale: בלא huonyesha kutokuwapo, na ביצה ni eneo lenye matope na maji. “Pasipo kinamasi” ni tafsiri fupi na ya asili inayohifadhi maana ya mahali.
- source_word: יִשְׂגֶּה
  choice: yanaweza kusitawi
  rationale: שׂגה hapa hudokeza kukua kwa nguvu au kustawi kwa mmea, si kuongezeka kwa idadi tu.
- source_word: אָ֥חוּ
  choice: majani ya matete
  rationale: Neno hili hutaja mimea ya majini au ya kinamasi; utambulisho wake mahususi hauna uhakika. “Majani ya matete” hutofautisha mstari huu na mafunjo huku ukihifadhi mazingira ya mimea ya majini.
- source_word: בְלִי מָֽיִם
  choice: bila maji
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa usemi unaoonyesha kutokuwapo kwa maji.
