  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: sw
  text: Ndivyo zilivyo njia za wote wanaomsahau Mungu; tumaini la mtu asiyemcha Mungu[a] litaangamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnafiki.” Neno la Kiebrania linaweza kumaanisha mtu mwovu, asiye na uchaji, au anayemkosea Mungu heshima; hapa “mtu asiyemcha Mungu” linafaa zaidi katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ndivyo zilivyo
  rationale: Inaonyesha hitimisho la kulinganisha na picha iliyotangulia, kwa Kiswahili cha kawaida na chenye nguvu ya kimantiki.
- source_word: אָרְחוֹת
  choice: njia
  rationale: Inahifadhi picha ya njia kama mwenendo au mkondo wa maisha.
- source_word: שֹׁכְחֵי אֵל
  choice: wote wanaomsahau Mungu
  rationale: Muundo wa kitenzi-jina umetafsiriwa kwa kishazi asilia cha Kiswahili; אֵל hapa ni cheo cha kawaida cha Mungu, si jina linalohitaji kunukuliwa kama “El.”
- source_word: תִקְוַת
  choice: tumaini la
  rationale: “Tumaini” ni neno la kawaida na linalofaa katika muktadha huu wa hekima na hukumu.
- source_word: חָנֵף
  choice: mtu asiyemcha Mungu
  rationale: Katika Ayubu neno hili humaanisha mtu asiye na uchaji au anayemkosea Mungu heshima, si lazima mnafiki kwa maana finyu ya kujifanya.
- source_word: תֹּאבֵד
  choice: litaangamia
  rationale: Linawasilisha uzito wa אבד, yaani kupotea au kufikia mwisho kabisa, na linapatana na “tumaini” kama kiima.
theological_decisions:
- issue: Maana ya חָנֵף katika muktadha wa hekima na hukumu
  choice: mtu asiyemcha Mungu
  alternative: mnafiki
  rationale: Chaguo hili linahifadhi maana pana ya kutokuwa na uchaji kwa Mungu bila kulibana neno kuwa unafiki wa kujifanya tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi sitiari ya “njia” na ulinganifu wa kishairi; alama ya nusu koloni inaunganisha hitimisho mbili bila kuongeza ufafanuzi usio katika Kiebrania.
