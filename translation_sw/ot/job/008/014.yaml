translation:
  language: sw
  text: 'ambaye tumaini lake hukatiliwa mbali,[a][b]

    na tegemeo lake ni nyumba ya buibui.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhakika wake”; nomino ya Kiebrania hapa inaweza kumaanisha tumaini, uhakika, au usalama.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kilichotafsiriwa “hukatiliwa mbali” ni nadra na maana yake inajadiliwa; huenda pia kikamaanisha “hukatikana,” au, kwa uwezekano mdogo hapa, “huchukiwa.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, tegemeo lake ni dhaifu kama nyumba au utando wa buibui.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Kiambishi cha uhusiano kinaunganisha mstari huu na mtu aliyefafanuliwa katika muktadha uliotangulia; “ambaye” ni ya kawaida na wazi katika Kiswahili.
- source_word: יָקוֹט
  choice: hukatiliwa mbali
  rationale: Kitenzi hiki ni nadra na maana yake inajadiliwa. Kauli hii inaonyesha kuondolewa au kukatika kwa tumaini, huku ikihifadhi picha ya kuanguka kwa usalama wa mtu.
- source_word: כִּסְלוֹ
  choice: tumaini lake
  rationale: Katika muktadha huu nomino inahusu tumaini, uhakika, au usalama, kama inavyothibitishwa na usambamba wake na מִבְטַחוֹ. “Tumaini” ni la kawaida na linafaa katika Kiswahili.
- source_word: וּבֵית
  choice: na ... nyumba
  rationale: “Nyumba” hudumisha taswira halisi ya kitu kilichojengwa, ambayo hapa inaonyesha udhaifu.
- source_word: עַכָּבִישׁ
  choice: ya buibui
  rationale: Hii ndiyo tafsiri ya kawaida ya nomino, na muundo “nyumba ya buibui” unawakilisha vizuri mnyororo wa hali ya umilikaji katika Kiebrania.
- source_word: מִבְטַחוֹ
  choice: tegemeo lake
  rationale: Nomino inaweza kumaanisha msingi au kitu anachokitegemea mtu. “Tegemeo lake” hudumisha usambamba na “tumaini lake” bila urudiaji usio wa lazima.
