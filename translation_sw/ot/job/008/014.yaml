  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa kishairi umehifadhiwa kwa “tumaini lake” na “tegemeo lake,” huku taswira ya Kiebrania “nyumba ya buibui” ikibaki katika matini na ufafanuzi wa “utando” kuwekwa katika tanbihi.
