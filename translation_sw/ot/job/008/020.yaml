base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: sw
  text: Tazama, Mungu hamkatai mtu asiye na lawama, wala hashiki mkono wa watenda maovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala haungi mkono watenda maovu”; kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “wala hashiki mkono wa watenda maovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Ni neno la kuvuta fikira na kusisitiza kauli; “Tazama” linahifadhi uzito wa kishairi kwa Kiswahili cha kawaida.
- source_word: אֵל
  choice: Mungu
  rationale: Hili ni jina la kawaida la kishairi kwa Mungu; mstari hauongezi wazi wazo la “Mwenyezi.”
- source_word: יִמְאַס
  choice: hamkatai
  rationale: Kitenzi מאס hapa kina maana ya kukataa au kutupilia mbali; “hamkatai” ni cha moja kwa moja bila kuingiza hisia kali zaidi ya kudharau.
- source_word: תָּם
  choice: mtu asiye na lawama
  rationale: Kivumishi hiki kilichotumiwa kama nomino humaanisha mtu mkamilifu katika uadilifu au asiye na lawama; “mtu” huweka wazi rejeleo la mtu bila kudai kuwa hana dhambi kabisa.
- source_word: יַחֲזִיק
  choice: haushiki
  rationale: Hifili ya חזק inaweza kumaanisha kushika, kutia nguvu, au kutegemeza. Pamoja na “mkono,” “haushiki” huhifadhi taswira halisi na kuacha maana ya kutegemeza isikike.
- source_word: בְּיַד
  choice: mkono wa
  rationale: Kirai hiki ni “kwa/katika mkono wa”; katika muundo huu huunda taswira ya kuushika mkono wa mtu ili kumsaidia.
- source_word: מְרֵעִים
  choice: watenda maovu
  rationale: Umbo hili la kishiriki linawataja watu wanaofanya maovu; “watenda maovu” linahifadhi nguvu ya kitendo.
theological_decisions:
- issue: Maana ya nahau וְלֹא יַחֲזִיק בְּיַד מְרֵעִים
  choice: wala haushiki mkono wa watenda maovu
  alternative: wala hawaungi mkono watenda maovu; wala hautii nguvu mkono wa watenda maovu
  rationale: Tafsiri kuu inahifadhi taswira ya Kiebrania ya kuushika mkono, huku tanbihi ikionyesha maana inayodokezwa ya kusaidia au kutegemeza. Hivyo utata halisi wa kileksika hauondolewi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Umoja wa “Mungu” umefuatwa katika vitenzi. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
