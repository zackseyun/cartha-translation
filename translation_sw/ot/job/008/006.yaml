base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: sw
  text: Ikiwa wewe ni safi na mnyoofu, hakika hata sasa ataamka kwa ajili yako[a] na kuyarejesha makao yako ya haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atachukua hatua kwa ajili yako.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa karibu zaidi: “makao ya haki yako.” Kitenzi kilichotafsiriwa “kuyarejesha” kinaweza pia kumaanisha “kufanya kamili” au “kulipa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Ni kiunganishi cha kawaida cha sharti kinachoanzisha dai la Bildadi.
- source_word: זַךְ
  choice: safi
  rationale: Huonyesha usafi wa kimaadili katika muktadha wa hekima bila kusisitiza mno kutokuwa na hatia kwa maana ya kisheria.
- source_word: יָשָׁר
  choice: mnyoofu
  rationale: Ni neno la kawaida na la asili kwa unyofu wa kimaadili, na linaendana vizuri na “safi.”
- source_word: כִּי עַתָּה
  choice: hakika hata sasa
  rationale: Hapa כִּי ina nguvu ya kusisitiza, nayo עַתָּה inaonyesha kwamba jambo hilo lingetokea sasa hivi.
- source_word: יָעִיר עָלֶיךָ
  choice: ataamka kwa ajili yako
  rationale: Inadumisha sitiari ya Kiebrania ya kuamka au kujitia katika hatua kwa manufaa ya mtu.
- source_word: וְשִׁלַּם
  choice: na kuirejesha
  rationale: Pieli ya שׁלם inaweza kumaanisha kufanya kamili, kulipa, au kurejesha; pamoja na makao, “kuirejesha” inafaa zaidi huku maana nyingine ikiwekwa katika tanbihi.
- source_word: נְוַת
  choice: makao
  rationale: Hurejelea mahali pa kukaa au maskani, na “makao” ni neno la Kiswahili lenye hadhi na upana unaofaa.
- source_word: צִדְקֶךָ
  choice: yako ya haki
  rationale: Inahifadhi kwa karibu muundo wa “makao ya haki yako” huku ikisomeka kwa urahisi; inaweza kueleweka kuwa makao yanayotambulishwa na haki ya mhusika.
theological_decisions:
- issue: Mtendaji asiyetajwa wazi wa vitenzi katika sehemu ya matokeo
  choice: Kuacha mtendaji kama nafsi ya tatu umoja, “ata-,” akieleweka katika muktadha kuwa Mungu.
  alternative: Kutaja “Mungu” waziwazi.
  rationale: Kiebrania hakitaji nomino ya mtendaji katika mstari huu. Kutomtaja Mungu kwa jina kunazuia kuongeza neno lisilokuwapo, ingawa muktadha unamtambulisha.
- issue: Nguvu ya dai la Bildadi
  choice: Kulitoa kama sharti lenye matokeo yaliyosisitizwa bila kulainisha dai lake.
  alternative: Kulifafanua kwa namna inayomtenga msimulizi na teolojia ya Bildadi.
  rationale: Mstari unapaswa kuwasilisha kwa uaminifu maneno ya Bildadi bila kuyathibitisha wala kuyasahihisha kimafundisho.
- issue: Uhusiano wa צִדְקֶךָ na נְוַת
  choice: “makao yako ya haki,” muundo unaohifadhi mvutano kati ya makao yenye sifa ya haki na makao yanayohusishwa na haki ya Ayubu.
  alternative: “makao yako ya uadilifu” au “makao yako ya haki yako.”
  rationale: Muundo wa Kiebrania ni wa nomino katika hali ya muunganiko, “makao ya haki yako.” Tafsiri iliyochaguliwa ni ya asili zaidi katika Kiswahili bila kuufanya uhusiano huo kuwa wazi kupita chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mnyoofu” na “makao” vinafaa kwa mtindo wa hekima; sentensi inabaki wazi kwa msomaji wa kawaida bila kuondoa sitiari au utata halisi wa Kiebrania.
