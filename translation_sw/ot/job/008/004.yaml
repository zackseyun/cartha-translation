  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: sw
  text: Kama wana wako walimtenda dhambi, aliwakabidhi mikononi mwa uasi wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, aliwaweka chini ya nguvu ya uasi wao. Usemi wa Kiebrania ni, kihalisi, “katika mkono wa uasi wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Hutambulisha sharti; inadumisha hali ya hoja ya Bildadi bila kuifanya kuwa kauli ya uhakika kwa kutumia ‘kwa kuwa’.
- source_word: בָּנֶיךָ
  choice: wana wako
  rationale: Nomino ya Kiebrania iko katika wingi wa kiume na humaanisha ‘wana’; tafsiri hii inadumisha usahihi huo badala ya kuitanua kuwa ‘watoto wako’.
- source_word: חָטְאוּ
  choice: walimtenda dhambi
  rationale: Kitenzi חטא humaanisha kutenda dhambi; pamoja na kiwakilishi kinachofuata, ‘walimtenda dhambi’ ni usemi wa kawaida wa Kiswahili unaoonyesha aliyekosewa.
- source_word: לוֹ
  choice: -m- katika ‘walimtenda’
  rationale: Kihusishi hiki humtaja aliyekosewa. Kiwakilishi kinadumishwa bila kubadilishwa wazi kuwa ‘Mungu’, ingawa muktadha unaelekeza kwake.
- source_word: וַיְשַׁלְּחֵם
  choice: aliwakabidhi
  rationale: Ingawa שלח kimsingi ni ‘kutuma’, pamoja na usemi ‘mkononi mwa’ hapa huonyesha kuwatia chini ya mamlaka au matokeo fulani; ‘aliwakabidhi’ hudumisha nguvu hiyo.
- source_word: בְּיַד
  choice: mkononi mwa
  rationale: Inadumisha sitiari ya Kiebrania ya ‘mkono’, ambayo huashiria mamlaka au nguvu.
- source_word: פִּשְׁעָם
  choice: uasi wao
  rationale: פשע mara nyingi hueleza uasi au kosa la kukusudia, na hivyo haitanazwi na neno la jumla la ‘dhambi’ lililotumiwa mapema katika mstari.
theological_decisions:
- issue: Anayerejelewa na kiwakilishi katika ‘walimtenda dhambi’
  choice: Kiwakilishi kinadumishwa, huku muktadha ukielekeza kwa Mungu.
  alternative: Kutaja moja kwa moja ‘walimtenda Mungu dhambi’.
  rationale: Muktadha wa hotuba ya Bildadi kuhusu haki ya Mungu unaonyesha kuwa Mungu ndiye anayerejelewa, lakini maandishi ya Kiebrania yanatumia kiwakilishi; tafsiri haifanyi jina hilo kuwa wazi kuliko chanzo.
- issue: Namna ya kutafsiri matokeo ya dhambi ya wana
  choice: ‘aliwakabidhi mkononi mwa uasi wao’
  alternative: ‘aliwaweka chini ya nguvu ya uasi wao’ au ‘aliwatupilia mbali kwa sababu ya uasi wao’.
  rationale: Tafsiri iliyochaguliwa inadumisha tendo la mhusika asiye tajwa kwa jina pamoja na sitiari inayofanya uasi wao kuwa nguvu iliyowapata, bila kuongeza maelezo mahususi ya kiitikadi kuhusu adhabu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kama’ ni ya kawaida na inadumisha sharti; ‘aliwakabidhi mkononi mwa’ inadumisha sitiari ya chanzo huku tanbihi ikiifafanua.
