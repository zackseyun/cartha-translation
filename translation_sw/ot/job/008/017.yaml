translation:
  language: sw
  text: Mizizi yake imesokotana juu ya rundo la mawe; anaiona nyumba ya mawe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anaiona nyumba iliyojengwa kwa mawe,” au “anatazama ndani ya nyumba ya mawe.” Kiebrania kwa hali halisi ni “nyumba ya mawe,” na huenda kikamaanisha jengo la mawe au mahali penye mawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: juu ya
  rationale: Kihusishi kinaonyesha mahali mizizi ilipo kuhusiana na rundo; “juu ya” kinahifadhi picha ya mizizi inayotanda juu ya mawe.
- source_word: גַּל
  choice: rundo la mawe
  rationale: Katika muktadha wa “nyumba ya mawe,” neno hili linaelekea kumaanisha rundo la mawe, si wimbi; ufafanuzi huu unaifanya taswira iwe wazi.
- source_word: שָׁרָשָׁיו
  choice: mizizi yake
  rationale: Huu ni wingi wenye kiambishi cha umilikaji, na unadumisha sitiari ya mtu anayefananishwa na mmea.
- source_word: יְסֻבָּכוּ
  choice: inajisokota
  rationale: Kitenzi kinaonyesha mizizi iliyofungamana au kujizungusha. “Inajisokota” ni Kiswahili cha kawaida na chenye taswira hai.
- source_word: בֵּית אֲבָנִים
  choice: nyumba ya mawe
  rationale: Tafsiri hii inafuata muundo halisi wa Kiebrania na kuhifadhi utata wa iwapo ni jengo la mawe au mahali penye mawe.
- source_word: יֶחֱזֶה
  choice: anaiona
  rationale: Kitenzi humaanisha kuona au kutazama; “anaiona” ni cha moja kwa moja na kinadumisha nafsi ya umoja ya taswira iliyohuishwa.
