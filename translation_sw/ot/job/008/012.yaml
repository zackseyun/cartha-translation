translation:
  language: sw
  text: Wakati bado iko katika uchipukizi wake[a], na haijakatwa[b], hunyauka kabla ya nyasi nyingine zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati bado ni mbichi” au “wakati bado iko katika chipukizi lake.” Neno la Kiebrania hurejelea ukuaji mpya na mbichi wa mmea.
    reason: lexical_alternative
  - marker: b
    text: Au “haijachumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: Ingawa bado ni
  rationale: Kirai hiki huonyesha hali inayoendelea ya mmea; pamoja na kishazi kinachofuata, “Ingawa bado ni” huwasilisha kwa Kiswahili hali ya kushangaza kwamba mmea hunyauka ukiwa bado mchanga.
- source_word: בְאִבּוֹ
  choice: chipukizi
  rationale: Neno hili la Kiebrania hurejelea ukuaji mpya na mbichi wa mmea; “chipukizi” huhifadhi picha halisi ya kibotania kwa lugha ya kawaida.
- source_word: לֹא יִקָּטֵף
  choice: bila kung’olewa
  rationale: Kitenzi kinaweza kumaanisha kukatwa au kuchumwa. “Kung’olewa” ni cha kawaida kwa mmea wa aina hii na huhifadhi wazo kwamba haujaondolewa na mtu.
- source_word: וְלִפְנֵי
  choice: kabla ya
  rationale: 'Hapa huonyesha ulinganisho wa wakati: mmea huu hukauka mapema kuliko mimea mingine.'
- source_word: כָל חָצִיר
  choice: majani mengine yote
  rationale: Katika muktadha wa ulinganisho, “mengine” huweka wazi kwamba mmea unaozungumziwa unalinganishwa na aina nyingine za majani bila kufanya dai lisilo la kawaida kwamba hukauka kabla ya kila mmea mmoja mmoja.
- source_word: יִיבָשׁ
  choice: hunyauka
  rationale: Kitenzi humaanisha kukauka au kunyauka; “hunyauka” ni cha asili kwa mmea na huonyesha kupoteza ubichi kwa kukosa maji.
