  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Chipukizi” na “hunyauka” huhifadhi taswira ya mmea kwa lugha inayoeleweka kwa wasomaji wa kawaida.
