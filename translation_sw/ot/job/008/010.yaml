  text: Will they not teach you and tell you[a], and bring forth words from their heart?
translation:
  language: sw
  text: Je, wao hawatakufundisha na kukuambia, nao hawatatoa maneno kutoka moyoni mwao[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akilini mwao” au “kutoka ndani yao”; katika Kiebrania, “moyo” mara nyingi humaanisha kitovu cha mawazo pamoja na hisia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... hawata-
  rationale: Muundo huu unahifadhi swali la balagha linalotarajia jibu la kukubali, huku ukisikika kwa kawaida katika Kiswahili.
- source_word: הֵם
  choice: wao
  rationale: Kiwakilishi hiki kinawarejelea watu wa vizazi vya zamani waliotajwa katika muktadha uliotangulia na kinahifadhi msisitizo wa kiwakilishi cha Kiebrania.
- source_word: יוֹרוּךָ
  choice: watakufundisha
  rationale: Hifili ya ירה hapa ina maana ya kufundisha au kuelekeza; “watakufundisha” inafaa katika muktadha wa hekima.
- source_word: יֹאמְרוּ לָךְ
  choice: kukuambia
  rationale: Chaguo hili linatofautisha kitenzi אמר na tendo la kufundisha, huku likiunda kirai cha kawaida cha Kiswahili.
- source_word: וּמִלִּבָּם
  choice: kutoka moyoni mwao
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya moyo kama utu wa ndani, unaohusisha mawazo pamoja na hisia; tanbihi inaonyesha maana mbadala.
- source_word: יוֹצִיאוּ
  choice: kutoa
  rationale: Hifili ya יצא ina wazo la kusababisha kitu kitoke; “kutoa” inadumisha taswira ya maneno yanayotoka ndani ya mtu.
- source_word: מִלִּים
  choice: maneno
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayofaa muktadha wa mafundisho ya hekima.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. Swali la balagha na taswira ya maneno kutoka moyoni zimehifadhiwa bila kufafanua maana kwa namna inayofuta upana wa neno la Kiebrania.
