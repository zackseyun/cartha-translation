  naturalness: “Je, wao hawatakufundisha na kukuambia, na kutoa maneno ...?” is understandable, but the finite future verb followed by an uninflected coordinated infinitive is awkward in this three-verb rhetorical question. A finite third verb gives clear, natural Standard East African Swahili.
  terminology: “Moyoni mwao” appropriately preserves לֵב imagery, and the footnote responsibly notes its cognitive as well as affective sense. “Maneno” is suitable. “Kutoa maneno” retains the image of bringing words out without adding interpretation.
