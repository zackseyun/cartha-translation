  text: עַד יְמַלֵּ֣ה שְׂח֣וֹק פִּ֑י/ךָ וּ/שְׂפָתֶ֥י/ךָ תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: sw
  text: 'Bado atakijaza kinywa chako kicheko[a],

    na midomo yako shangwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka atakapokijaza kinywa chako kicheko, na midomo yako shangwe.”
    reason: Neno עַד linaweza kueleweka kama “bado” au kama “mpaka,” likiunganisha mstari huu kwa karibu zaidi na sentensi iliyotangulia.
lexical_decisions:
- source_word: עַד
  choice: Bado
  rationale: Katika muktadha huu neno hilo linaelekeza kwenye jambo ambalo Mungu bado atalifanya. “Bado” ni Kiswahili cha kawaida kinacholeta maana hiyo ya ahadi ya wakati ujao, huku uwezekano wa maana ya “mpaka” ukihifadhiwa katika tanbihi.
- source_word: יְמַלֵּה
  choice: ataujaza
  rationale: Hii ni kauli ya wakati ujao inayolingana na kitenzi cha Kiebrania cha nafsi ya tatu, umoja, kiume. Kiambishi cha yambwa “-u-” kinarejelea “mdomo,” na Mungu ndiye mtendaji anayeeleweka kutokana na mstari uliotangulia.
- source_word: שְׂחוֹק
  choice: kicheko
  rationale: “Kicheko” kinatafsiri nomino moja kwa moja na kuhifadhi picha ya kishairi ya mdomo uliojaa kicheko; muktadha wa kurejeshwa hauungi mkono maana hasi ya dhihaka.
- source_word: פִּיךָ
  choice: mdomo wako
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya mwili na ulinganifu wa kishairi.
- source_word: וּשְׂפָתֶיךָ
  choice: na midomo yako
  rationale: Tafsiri halisi huhifadhi ulinganifu na “mdomo wako” badala ya kugeuza taswira hiyo kuwa “maneno yako.”
- source_word: תְרוּעָה
  choice: shangwe
  rationale: Neno la Kiebrania humaanisha sauti kubwa au kilio, mara nyingi cha furaha au ushindi. “Shangwe” ni neno la asili na lenye hadhi katika Kiswahili, na katika muktadha huu linaendana na “kicheko” bila kuingiza maana maalumu ya kijeshi au ya ibada.
theological_decisions:
- issue: Mtendaji anayeeleweka wa kitenzi
  choice: Kitenzi “ataujaza” kina Mungu kama mtendaji anayeeleweka kutokana na muktadha.
  alternative: Kauli isiyoonyesha mtendaji moja kwa moja, kama “mdomo wako utajazwa kicheko.”
  rationale: Mstari wa 20 unamtaja Mungu kama mtendaji, na mstari wa 21 unaendeleza wazo hilo. Muundo wa Kiswahili bila kiwakilishi huru bado huonyesha nafsi ya tatu na kulinda maana kwamba urejesho huu unatoka kwa Mungu.
- issue: Maana ya עַד mwanzoni mwa mstari
  choice: “Bado,” kama ahadi ya jambo litakalotokea.
  alternative: “Mpaka,” kama kishazi cha wakati kinachoendeleza sentensi ya mstari uliotangulia.
  rationale: Muundo wa Kiebrania unaruhusu uhusiano wa wakati, lakini katika muktadha una nguvu ya matarajio kwamba Mungu bado atafanya hivyo. Tanbihi inahifadhi usomaji mwingine bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa urahisi. “Shangwe” limechaguliwa ili kutoa sauti ya furaha inayodokezwa na muktadha, huku ulinganifu wa “mdomo” na “midomo” ukihifadhiwa.
