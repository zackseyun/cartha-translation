  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: sw
  text: Tazama, hii ndiyo furaha ya njia yake,[a] na mimea mingine itachipuka kutoka mavumbini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeye ndiye furaha ya njia yake.” Kiwakilishi cha Kiebrania kinaweza kueleweka kwa kumrejelea mtu moja kwa moja, lakini muktadha unaelekea kuonyesha muhtasari wa mwisho wa mmea huo.
    reason: alternative_reading
  - marker: b
    text: Au, “mmea mwingine utachipuka kutoka mavumbini.” Neno la Kiebrania אַחֵר lina umbo la umoja, lakini kitenzi cha wingi kinaunga mkono tafsiri “mimea mingine itachipuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Chembe ya usemi inayosisitiza na kuelekeza usikivu; “Tazama” inadumisha nguvu yake katika ushairi wa kibiblia.
- source_word: הוּא
  choice: hii
  rationale: Ingawa kimuundo inaweza kuwa “yeye,” hapa inaeleweka kwa namna ya kuonyesha hali au mwisho wa mmea ulioelezwa; “hii” ni ya kawaida zaidi katika Kiswahili bila kufuta uwezekano mwingine.
- source_word: מְשׂוֹשׂ
  choice: furaha
  rationale: Nomino hii humaanisha furaha au shangwe; “furaha” ni neno la kawaida, lenye hadhi, na linafaa katika muundo “furaha ya njia yake.”
- source_word: דַּרְכּוֹ
  choice: njia yake
  rationale: דרך inaweza kumaanisha njia, mwendo, au mwenendo. “Njia yake” inadumisha mwangwi wa maana halisi na ya mfano.
- source_word: וּמֵעָפָר
  choice: na ... kutoka mavumbini
  rationale: Muundo מן + עפר unaonyesha chanzo. “Mavumbini” hudumisha taswira ya ardhi/vumbi na lafudhi ya kibiblia.
- source_word: אַחֵר
  choice: wengine
  rationale: Ingawa neno hili lina umbo la umoja, kitenzi kinachofuata ni cha wingi; “wengine” huafikiana na kitenzi bila kuficha usomaji mbadala wa umoja.
- source_word: יִצְמָחוּ
  choice: watachipuka
  rationale: צמח hueleza kuchipuka au kuota kwa mimea. “Watachipuka” inadumisha wazi taswira ya mmea.
theological_decisions:
- issue: Kirejelewa cha הוּא na maana ya kauli “furaha ya njia yake”
  choice: Kutafsiri הוּא kwa “hii” kama muhtasari wa hali au mwisho wa mmea katika mfano
  alternative: “Yeye ndiye furaha ya njia yake”
  rationale: Muktadha wa mfano wa mmea unaunga mkono kauli ya muhtasari, lakini Kiebrania kinaruhusu pia usomaji wa kibinafsi; tanbihi inalinda utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. “Tazama” na “mavumbini” hudumisha hadhi na taswira ya kibiblia; tanbihi zimehifadhi utata halisi wa Kiebrania.
