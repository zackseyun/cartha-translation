lexical_decisions:
- source_word: אִם
  choice: Lakini ikiwa
  rationale: Chembe hii inaanzisha sharti. Neno “Lakini” linaonyesha utofauti wa kimuktadha na mstari uliotangulia, huku “ikiwa” likihifadhi maana ya sharti.
- source_word: אַתָּה
  choice: uta-
  rationale: Kiwakilishi cha nafsi ya pili umoja wa kiume kimedokezwa kwa kawaida katika kiambishi cha kitenzi cha Kiswahili; hakuna haja ya kuongeza “wewe” isipokuwa kwa mkazo mkubwa zaidi.
- source_word: תְּשַׁחֵר
  choice: utamtafuta ... kwa bidii
  rationale: Piel ya שׁחר inaweza kumaanisha kutafuta mapema au kutafuta kwa bidii. Katika muktadha huu inaelekea kueleza kumwelekea Mungu kwa juhudi na dhati katika sala.
- source_word: אֶל אֵל
  choice: Mungu
  rationale: Kihusishi cha mwelekeo kimeingizwa kwa kawaida katika kitenzi “kumtafuta,” na אֵל limetafsiriwa kwa jina la kawaida “Mungu.”
- source_word: וְ/אֶל
  choice: na kum-
  rationale: Kiunganishi kinaunganisha vishazi viwili, huku kihusishi cha mwelekeo kikionyeshwa kwa kawaida na muundo wa kitenzi “kumsihi.”
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Hili ni jina la cheo la Mungu. “Mwenyezi” ni tafsiri ya kawaida na ya asili katika Kiswahili, badala ya kunukuu sauti ya Kiebrania.
- source_word: תִּתְחַנָּן
  choice: kumsihi ... akupe fadhili
  rationale: Hitpael ya חנן ina maana ya kuomba kwa unyenyekevu ili kupata neema au fadhili. Muundo huu unaweka wazi kwamba Mungu ndiye anayeombwa na fadhili ndizo zinazoombwa.
theological_decisions:
- issue: Tafsiri ya jina la cheo שַׁדַּי
  choice: Mwenyezi
  alternative: Shaddai
  rationale: Kutafsiri jina hili la cheo huwasilisha maana yake kwa msomaji wa kawaida, huku umbo la Kiebrania likihifadhiwa katika tanbihi.
- issue: Maana ya ombi katika תִּתְחַנָּן
  choice: kumsihi ... akupe fadhili
  alternative: kumwomba rehema
  rationale: Neno la Kiebrania linahusu kuomba neema au fadhili; “fadhili” huhifadhi upana huo bila kulifanya ombi liwe hasa la msamaha au rehema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida na unaeleweka kwa urahisi; koma ya mwisho imehifadhiwa kwa kuwa mstari huu ni kishazi cha sharti kinachoendelea katika mstari unaofuata.
