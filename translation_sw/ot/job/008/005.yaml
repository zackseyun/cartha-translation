  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: sw
  text: Lakini ukimtafuta Mungu kwa bidii[a], na kumsihi Mwenyezi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukimtafuta Mungu mapema”; kitenzi cha Kiebrania kinaweza kuwa na maana ya kutafuta mapema, ingawa hapa huenda kinamaanisha kutafuta kwa bidii au kwa juhudi.
    reason: lexical_alternative
  - marker: b
