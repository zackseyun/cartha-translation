  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: sw
  text: Yeye ana unyevu mwingi mbele ya jua[a], na machipukizi yake yanaenea juu ya bustani yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mbele ya jua” huenda ikamaanisha mahali pa wazi mbele ya jua au katika mwanga wake, si lazima kabla ya jua kuchomoza.
    reason: lexical_alternative
  - marker: b
    text: Au, “na chipukizi lake hutokea juu ya bustani yake.” Nomino ya Kiebrania ya ukuaji mchanga iko katika umoja, lakini inaweza kueleweka kwa maana ya kijumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: mwenye unyevunyevu
  rationale: Huifadhi taswira halisi ya mmea ulio na maji mengi bila kuifanya moja kwa moja kuwa ‘uliostawi’ au ‘mbichi.’
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi cha kiume kinadumishwa kwa sababu mfano wa Bildadi unaendeleza uhuishaji wa mhusika kwa lugha ya kibinafsi.
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: mbele ya jua
  rationale: Ni tafsiri ya karibu ya Kiebrania inayohifadhi uwezekano wa maana ya mahali—akiwa wazi mbele ya mwanga wa jua—badala ya kuamua kuwa ni kabla ya kuchomoza kwa jua.
- source_word: וְעַל
  choice: na ... juu ya
  rationale: Huunganisha mshororo wa pili kwa Kiswahili cha kawaida huku ikihifadhi maana ya mahali ya עַל.
- source_word: גַּנָּתוֹ
  choice: bustani yake
  rationale: Hutoa maana ya kawaida ya nomino pamoja na kiambishi chake cha umilikaji cha nafsi ya tatu umoja wa kiume.
- source_word: יֹנַקְתּוֹ
  choice: machipukizi yake
  rationale: ‘Machipukizi’ ni neno la kawaida na linaloeleweka kwa vichipukizi au ukuaji mchanga; wingi unaonyesha uwezekano wa nomino ya umoja kutumiwa kwa maana ya kijumla.
- source_word: תֵצֵא
  choice: yanaenea
  rationale: Kitenzi kimsingi ni ‘hutoka/huenda nje’; katika taswira ya mimea inayofunika bustani, ‘yanaenea’ huwasilisha mwendo huo kwa Kiswahili cha kawaida bila kupoteza picha.
