translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mistari miwili na utata halisi wa ‘mbele ya jua’ vimehifadhiwa; lugha ya mimea imewekwa wazi bila kuongeza ufafanuzi wa kiteolojia.
