base_translation:
  language: en
  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: sw
  text: Kwa maana sisi ni watu wa jana tu, wala hatujui[a], kwa kuwa siku zetu duniani ni kivuli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sisi ni wa jana tu”; yaani, tumekuwapo kwa muda mfupi sana, kwa hiyo ujuzi wetu una mipaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu inayounga mkono hoja iliyotangulia, kwa lugha ya kawaida na yenye hadhi.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: sisi ni watu wa jana tu
  rationale: Nahau hii inaeleza kwamba wanadamu wamekuwapo kwa muda mfupi sana. Neno “watu” linafanya usemi huo uwe wa asili katika Kiswahili, huku “wa jana” ikihifadhi picha ya Kiebrania.
- source_word: וְלֹא נֵדָע
  choice: wala hatujui
  rationale: Inatafsiri moja kwa moja kitenzi cha nafsi ya kwanza wingi chenye ukanushi bila kuongeza maana kali ya kwamba hatujui kitu chochote kabisa.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Inaonyesha msingi wa kutokujua kwa wanadamu na kuhifadhi uhusiano wa kimantiki wa kishazi cha pili.
- source_word: צֵל
  choice: kivuli
  rationale: Inahifadhi sitiari ya maisha kuwa mafupi na yasiyodumu.
- source_word: יָמֵינוּ עֲלֵי אָרֶץ
  choice: siku zetu duniani
  rationale: Ni usemi wa Kiswahili ulio wazi na wa asili kwa muda wa maisha yetu hapa duniani.
