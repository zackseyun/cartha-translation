lexical_decisions:
- source_word: וְהָיָה
  choice: Ingawa ... ulikuwa
  rationale: Katika muktadha wa ushairi, kiunganishi pamoja na kitenzi kinaonyesha hali inayokinzana na ahadi ya kishoroba cha pili; “Ingawa” huwasilisha utofauti huo kwa Kiswahili cha kawaida bila kuongeza wazo jipya.
- source_word: רֵאשִׁיתְךָ
  choice: mwanzo wako
  rationale: Neno hili humaanisha mwanzo, sehemu ya kwanza, au hali ya awali; “mwanzo wako” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מִצְעָר
  choice: mdogo
  rationale: Hueleza udogo au kutokuwa na umuhimu mkubwa; “mdogo” huhifadhi ulinganisho na ongezeko kubwa la baadaye.
- source_word: אַחֲרִיתְךָ
  choice: hali yako ya baadaye
  rationale: Neno linaweza kumaanisha mwisho, matokeo ya mwisho, au wakati ujao. “Hali yako ya baadaye” ni ya asili katika Kiswahili na bado huonyesha matokeo yatakayofuata.
- source_word: יִשְׂגֶּה
  choice: itaongezeka
  rationale: Kitenzi huonyesha kuwa kikubwa, kuongezeka, au kukua; “itaongezeka” huhifadhi mwendo kutoka udogo wa mwanzo hadi ukubwa wa baadaye.
- source_word: מְאֹד
  choice: sana
  rationale: Ni kielezi cha kusisitiza kwa nguvu; “sana” ni cha kawaida na huambatana vizuri na “itaongezeka.”
