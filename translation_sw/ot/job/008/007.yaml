  text: Ingawa mwanzo wako ulikuwa mdogo[a], mwisho wako utakuwa mkubwa sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na mwanzo wako ulikuwa mdogo, lakini mwisho wako utakuwa mkubwa sana.”
