lexical_decisions:
- source_word: הַאֵל
  choice: Je, Mungu
  rationale: Kiulizi הַ kinaanzisha swali la ndiyo au hapana; אֵל hapa ni cheo cha kawaida cha Mungu, si jina la kutoholewa.
- source_word: יְעַוֵּת
  choice: hupotosha
  rationale: Piel ya עוה ina maana ya kupinda au kugeuza kilicho sawa, hasa katika muktadha wa kisheria na kimaadili; “hupotosha” ni Kiswahili cha sasa kinachobeba uzito huo.
- source_word: מִשְׁפָּט
  choice: hukumu
  rationale: Neno linaweza kumaanisha hukumu au haki ya kimahakama. “Hukumu” hapa huhifadhi tofauti ya kileksia na צֶדֶק katika mshororo unaofuata.
- source_word: וְאִם
  choice: au
  rationale: 'Ingawa muundo wake rasmi ni “na ikiwa,” katika maswali haya mawili yanayolingana hutenda kazi ya kutenganisha: “au.”'
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Cheo hiki cha Mungu kimetafsiriwa kwa cheo cha kawaida na chenye hadhi katika Kiswahili, badala ya kutoholewa kama Shadai.
- source_word: צֶדֶק
  choice: haki
  rationale: צֶדֶק humaanisha haki au uadilifu. “Haki” ni ya asili katika muktadha huu wa kisheria na kimaadili huku ikibaki tofauti na “hukumu.”
theological_decisions:
- issue: Kutafsiri vyeo vya Mungu אֵל na שַׁדַּי
  choice: Mungu ... Mwenyezi
  alternative: Eli ... Shadai
  rationale: Katika muktadha huu yote mawili ni vyeo, si majina binafsi; kuyatafsiri huwasilisha maana yake kwa msomaji wa kawaida.
- issue: Kudumisha tofauti kati ya מִשְׁפָּט na צֶדֶק
  choice: hukumu ... haki
  alternative: haki ... uadilifu
  rationale: Maneno haya mawili yanahusiana lakini si sawa kabisa. Tafsiri iliyochaguliwa hudumisha ulinganifu wa kishairi bila kuyafanya kuwa neno moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha na ulinganifu wa kishairi vimehifadhiwa; “hupotosha” limetumiwa mara mbili kama katika Kiebrania.
