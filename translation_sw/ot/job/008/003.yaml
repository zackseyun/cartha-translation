  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: sw
  text: Je, Mungu hupindisha hukumu,[a] au Mwenyezi hupindisha haki?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, Mungu hupindisha haki, au Mwenyezi hupindisha uadilifu?”
