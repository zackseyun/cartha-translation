lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Katika kauli hii ya kawaida ya kuanzisha mazungumzo, kitenzi ענה humaanisha ‘kujibu’ au ‘kuitikia.’ ‘Akajibu’ ni cha kawaida na huhifadhi maana ya mazungumzo.
- source_word: בִּלְדַּד
  choice: Bildadi
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: הַשּׁוּחִי
  choice: Mshuhi
  rationale: Jina hili la nasaba au asili linamtambulisha Bildadi kuwa mtu wa watu au eneo lililohusishwa na Shua; umbo ‘Mshuhi’ linafuata utaratibu wa kawaida wa Kiswahili wa kumtaja mtu wa kundi au mahali.
- source_word: וַיֹאמַר
  choice: na kusema
  rationale: Kitenzi אמר katika mfuatano huu wa kisimulizi ni ‘kusema.’ Kuhifadhi ‘akajibu na kusema’ kunaakisi mtindo wa Kiebrania bila kuufanya mstari usieleweke.
- source_word: וַ
  choice: Ndipo
  rationale: Waw ya kwanza inaendeleza mfuatano wa simulizi. ‘Ndipo’ huonyesha hatua inayofuata kwa Kiswahili cha asili; waw ya pili imewakilishwa kwa ‘na.’
