  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: sw
  text: '“Utaendelea kusema mambo haya[a] mpaka lini,

    na maneno ya kinywa chako yatakuwa upepo mkali?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utasema mambo haya mpaka lini, na maneno ya kinywa chako yatakuwa upepo mkali?”
    reason: Njia mbadala ya kutafsiri תְּמַלֶּל bila kuonyesha wazi msisitizo wa uendelevu.
lexical_decisions:
- source_word: עַד אָן
  choice: mpaka lini
  rationale: Hii ndiyo nahau ya kawaida ya Kiswahili inayowasilisha swali la kukemea kuhusu muda unaoendelea.
- source_word: תְּמַלֶּל
  choice: utaendelea kusema
  rationale: Umbo la kitenzi linaonyesha kunena au kutamka; ‘utaendelea kusema’ linaonyesha hali endelevu na kutoridhika kwa Bildadi katika muktadha.
- source_word: אֵלֶּה
  choice: mambo haya
  rationale: Kiwakilishi hiki ni cha wingi na kinarejelea kwa upana yale ambayo Ayubu ametangulia kusema, bila kurudia ‘maneno’ kabla ya kishazi cha pili.
- source_word: וְרוּחַ כַּבִּיר
  choice: na ... kuwa upepo wenye nguvu
  rationale: ‘Upepo’ linahifadhi taswira halisi ya Kiebrania inayotumiwa kama sitiari ya maneno yenye kishindo; ‘wenye nguvu’ linawasilisha maana ya כַּבִּיר bila kuongeza wazo la utupu ambalo halijasemwa wazi.
- source_word: אִמְרֵי פִיךָ
  choice: maneno ya kinywa chako
  rationale: Tafsiri hii inadumisha muundo wa kishairi na msisitizo halisi wa kirai cha Kiebrania huku ikiwa ya kawaida na inayoeleweka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi wa mistari miwili umehifadhiwa, pamoja na sitiari ya upepo. Hakuna tanbihi iliyohitajika kwa sababu chaguo la ‘kusema’ na ‘upepo wenye nguvu’ linaweza kuwasilishwa moja kwa moja bila kupoteza utata muhimu.
