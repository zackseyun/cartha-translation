lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: hujiegemeza
  rationale: Niphal ya שׁען huonyesha mtu kujiegemeza juu ya kitu au kukitegemea. “Hujiegemeza” inadumisha picha halisi huku ikiruhusu maana ya kukitegemea.
- source_word: עַל
  choice: juu ya
  rationale: Kihusishi hiki kinaonyesha mahali pa mgusano au kitu kinachotoa tegemeo; “juu ya” ni usemi wa kawaida katika Kiswahili.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: בַּיִת kwa kawaida ni “nyumba.” Ingawa katika muktadha inaweza kuwakilisha kile ambacho mwovu anakitegemea, picha ya shairi haipaswi kufasiriwa na kuondolewa.
- source_word: וְלֹא יַעֲמֹד
  choice: lakini nyumba hiyo haisimami
  rationale: עמד humaanisha kusimama au kubaki imara. Kutaja “nyumba hiyo” huondoa utata wa kisarufi wa Kiswahili kuhusu kiima, na “lakini” huwasilisha ukinzani wa kishairi.
- source_word: יַחֲזִיק בּוֹ
  choice: huikamata kwa nguvu
  rationale: Hiphil ya חזק pamoja na בּוֹ huonyesha kushika au kukamata kitu kwa nguvu. Tafsiri hii inadumisha tendo halisi na haiibadili picha kuwa utegemezi wa kiakili pekee.
- source_word: וְלֹא יָקוּם
  choice: lakini haibaki imesimama
  rationale: קום inaweza kumaanisha kuinuka au kusimama, lakini hapa inaendana na עמד na kuonyesha kwamba nyumba hiyo haidumu ikiwa imara. Usemi huu unahifadhi urudiaji wa picha ya kusimama.
