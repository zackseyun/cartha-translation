  text: Huiegemea nyumba yake[a], lakini nyumba hiyo haisimami; huikamata kwa nguvu[b], lakini haibaki imesimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huitegemea nyumba yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kutegemea kitu kwa msaada na pia kujiegemeza juu yake kimwili.
