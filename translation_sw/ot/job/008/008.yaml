  text: Kwa maana uliza, tafadhali, kizazi kilichotangulia, na yatafakari matokeo ya uchunguzi wa baba zao[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uchunguzi wa baba zao.” Nomino ya Kiebrania inaweza kumaanisha tendo la kuchunguza au mambo yaliyogunduliwa kwa uchunguzi huo.
    reason: lexical_alternative
  - marker: b
    text: “Baba zao” inaweza pia kueleweka kwa maana pana kuwa “wazee wao wa kale.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hapa neno hili linaunganisha himizo la Bildadi na hoja iliyotangulia kwa kutoa msingi wake.
- source_word: שְׁאַל נָא
  choice: tafadhali uliza
  rationale: Kitenzi ni amri ya kuuliza au kuchunguza, na נָא huonyesha ombi la upole kuliko maana ya wakati ya ‘sasa’.
- source_word: לְדֹר רִישׁוֹן
  choice: kizazi kilichotangulia
  rationale: רִאשׁוֹן hapa huelekea kumaanisha kizazi cha awali, si lazima kizazi cha kwanza kabisa.
- source_word: וְכוֹנֵן
  choice: uyazingatie
  rationale: Katika muktadha huu kitenzi kinaelekeza msikilizaji kuweka akili au umakini wake katika jambo linalofuata; ‘uyazingatie’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: לְחֵקֶר
  choice: matokeo ya uchunguzi
  rationale: Nomino חֵקֶר inaweza kutaja tendo la kuchunguza au yale yaliyogunduliwa kwa uchunguzi. Maana ya matokeo inafaa hapa kwa kuwa Bildadi anarejelea hekima iliyokusanywa na waliotangulia, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: אֲבוֹתָם
  choice: baba zao
  rationale: Kiambishi cha umilikaji kinaelekea kurejelea kizazi kilichotangulia. ‘Baba zao’ huhifadhi nahau ya Kiebrania; maana pana ya ‘mababu zao’ imeonyeshwa katika tanbihi.
