lexical_decisions:
- source_word: לְגֶבֶר
  choice: kwa mwanamume
  rationale: Kiambishi לְ kinaendeleza swali la balagha kutoka mstari wa 20, ‘Kwa nini ... hupewa ...?’ Nomino גֶּבֶר ni ya umoja wa kiume, kwa hiyo ‘mwanamume’ hudumisha jinsia na idadi ya Kiebrania.
- source_word: אֲשֶׁר דַּרְכּוֹ
  choice: ambaye njia yake
  rationale: ‘Njia’ hudumisha sitiari ya דֶּרֶךְ, ambayo inaweza kumaanisha njia halisi au mwenendo na mwelekeo wa maisha, bila kuifafanua kupita kiasi.
- source_word: נִסְתָּרָה
  choice: imefichika
  rationale: Huwasilisha hali ya kupasivu ya Niphal na kuhifadhi utata wa iwapo njia haionekani kwa mwanamume huyo au imefichwa kwa ujumla.
- source_word: וַיָּסֶךְ ... בַּעֲדוֹ
  choice: amemzingira kwa ua
  rationale: Kauli hii hudumisha picha ya kuwekwa uzio pande zote na hivyo kuzuiwa, huku wakati timilifu ukionyesha tendo lenye matokeo yanayoendelea.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni jina la kishairi la umoja linalotumiwa kwa Mungu katika Ayubu; ‘Mungu’ ni tafsiri ya moja kwa moja bila kuingiza wazo la ‘Mwenyezi’ ambalo halipo katika neno hili.
theological_decisions:
- issue: Utendaji katika kumzingira mwanamume
  choice: Mungu ametajwa wazi kuwa ndiye anayemzingira mwanamume huyo.
  alternative: Kutumia kauli isiyotaja mtendaji na hivyo kupunguza dhima ya Mungu.
  rationale: אֱלוֹהַּ ndiye kiima kilichotajwa wazi. Tafsiri inapaswa kuhifadhi ukali wa malalamiko ya Ayubu badala ya kuficha kwamba anasema Mungu ndiye aliyemwekea kizuizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mstari umeachwa kama kishazi kinachoendeleza swali la balagha lililoanza katika mstari wa 20. ‘Kumzingira kwa ua’ huhifadhi taswira halisi ya Kiebrania na ‘na’ huakisi kiunganishi וַ־.
