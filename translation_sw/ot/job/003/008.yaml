  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: sw
  text: 'Wale wanaolaani siku na wailaani siku hiyo,

    hao walio tayari kumwamsha Lewiathani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְּבֻהוּ
  choice: na walaaniwe
  rationale: Kitenzi katika kauli ya maombi kinaendeleza tamanio la Ayubu kwamba siku hiyo ilaaniwe; kiwakilishi cha umoja kinarejelea siku ya kuzaliwa kwake.
- source_word: אֹרְרֵי יוֹם
  choice: wale wanaolaani siku
  rationale: Nomino יוֹם haina kibainishi na inaweza kutumiwa kwa maana ya kijumla; tafsiri hii inahifadhi usemi wa Kiebrania bila kuubadili kuwa 'siku hiyo'.
- source_word: הָעֲתִידִים עֹרֵר
  choice: walio tayari kumwamsha
  rationale: הָעֲתִידִים ina maana ya walio tayari au wenye uwezo wa kufanya jambo, na עֹרֵר ni kuamsha au kuchochea.
- source_word: לִוְיָתָן
  choice: Lewiathani
  rationale: Jina la kiumbe huyu limehamishiwa kwa umbo linalotambulika katika Kiswahili, bila kulifafanua kwa namna inayofuta taswira au utata wake.
theological_decisions:
- issue: Utambulisho na asili ya Lewiathani
  choice: Jina 'Lewiathani' limehifadhiwa bila maelezo ndani ya mstari.
  alternative: Kuitafsiri kama 'joka la baharini' au kuifafanua kuwa kiumbe fulani wa kihistoria au wa kiroho.
  rationale: Muktadha wa kishairi unarejelea kiumbe mwenye nguvu anayeweza kuamshwa na walaani-siku, lakini mstari wenyewe hautoi ufafanuzi wa kutosha wa utambulisho wake; tafsiri haipaswi kutatua mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mgawanyo wa mistari unaonyesha ulinganifu wa kishairi wa Kiebrania.
