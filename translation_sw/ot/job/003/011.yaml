translation:
  language: sw
  text: Kwa nini sikufa tumboni, au nilipotoka tumboni mwa mama sikukata roho?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia maneno mawili yanayohusiana lakini tofauti kwa tumbo la uzazi, na vitenzi viwili tofauti vya kufa; kitenzi cha pili chaweza kumaanisha “kutoa pumzi ya mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Ni swali la sababu, na “Kwa nini” ni usemi wa kawaida na wa moja kwa moja katika maombolezo.
- source_word: לֹא
  choice: si-
  rationale: Kiambishi hasi katika “sikufa” kinaonyesha ukanushaji wa tendo katika nafsi ya kwanza, wakati uliopita.
- source_word: מֵרֶחֶם
  choice: nilipotoka tumboni
  rationale: רֶחֶם ni tumbo la uzazi; muundo huu huhifadhi picha ya kutoka tumboni huku ukiifanya sentensi iwe ya asili katika Kiswahili.
- source_word: אָמוּת
  choice: sikufa
  rationale: Ingawa kitenzi ni imperfect ya nafsi ya kwanza, katika swali hili la majuto kinaelekea tukio la zamani ambalo Ayubu anatamani lingetokea.
- source_word: מִבֶּטֶן
  choice: ndani ya tumbo la mama
  rationale: בֶּטֶן inaweza kumaanisha tumbo au tumbo la uzazi. Kutaja “la mama” kunaweka wazi picha ya kuzaliwa na kuhifadhi tofauti ndogo na usemi wa kwanza.
- source_word: יָצָאתִי
  choice: nilipotoka
  rationale: Huhifadhi picha halisi ya kutoka, badala ya kuibadili moja kwa moja kuwa “nilipozaliwa.”
- source_word: וְאֶגְוָע
  choice: wala sikukata roho
  rationale: גוע ni tofauti na מות na mara nyingi huonyesha kufa au kutoa pumzi ya mwisho; “kukata roho” ni usemi wa Kiswahili unaohifadhi tofauti hiyo.
