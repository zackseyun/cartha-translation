  terminology: “Tumbo”/“tumbo la mama” huhifadhi taswira ya uzazi na utofauti wa kiasi kati ya רֶחֶם na בֶּטֶן. “Kukata roho” ni usemi unaokubalika wa kufa/kutoa pumzi ya mwisho, unaotofautisha kwa upole גוע na “kufa.”
