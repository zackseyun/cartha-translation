  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: sw
  text: Usiku huo, giza liunyakue; usifurahi miongoni mwa siku za mwaka[a]; wala usiingie katika hesabu ya miezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usiunganishwe na siku za mwaka.” Kitenzi cha Kiebrania hapa ni adimu; wengine hukielewa kuwa usiku huo usijumuishwe katika kalenda, badala ya kutofurahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: Nao usiku ule
  rationale: Mpangilio huu unahifadhi uwekaji wa kishazi mbele kwa ajili ya msisitizo, huku ukisikika kwa kawaida katika Kiswahili.
- source_word: יִקָּחֵהוּ
  choice: liunyakue
  rationale: Kitenzi לקח kimsingi ni ‘chukua’; ‘nyakua’ hapa kinaonyesha giza likiutwaa usiku kwa nguvu na kinadumisha uhuishaji wa giza.
- source_word: אֹפֶל
  choice: giza
  rationale: Neno hili humaanisha giza au utusitusi; ‘giza’ ni wazi, la kawaida, na haliongezi ufafanuzi usio katika maandishi.
- source_word: אַל יִחַדְּ
  choice: usifurahi
  rationale: Katika matumizi haya adimu, יחד inaweza kueleweka kuwa kushiriki kwa furaha; tafsiri hii inadumisha maana iliyochaguliwa bila kuficha uwezekano wa maana ya ‘kuunganishwa,’ ambao umewekwa katika tanbihi.
- source_word: בִּימֵי שָׁנָה
  choice: miongoni mwa siku za mwaka
  rationale: Hii inaonyesha kwa kawaida kuwamo ndani ya kundi la siku zinazounda mwaka.
- source_word: בְּמִסְפַּר יְרָחִים
  choice: katika hesabu ya miezi
  rationale: Tafsiri hii inadumisha taswira ya kuhesabiwa katika orodha au jumla ya miezi.
- source_word: אַל יָבֹא
  choice: usiingie
  rationale: בוא ni ‘kuja/kuingia’; pamoja na ‘hesabu ya miezi,’ ‘kuingia’ huonyesha kujumuishwa katika hesabu hiyo.
