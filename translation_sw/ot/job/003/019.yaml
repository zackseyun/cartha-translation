  text: Mdogo na mkubwa wako huko, na mtumwa[a] yuko huru kutoka kwa bwana wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha “mtumwa” au “mtumishi.” Hapa “mtumwa” limetumiwa kwa sababu kauli ya kuwa huru kutoka kwa bwana wake inakazia hali ya kufungwa katika utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹן
  choice: mdogo
  rationale: Katika jozi na גָדוֹל, neno hili linaashiria hasa mtu wa hadhi au umuhimu mdogo. “Mdogo” huhifadhi mkabala mfupi wa Kiebrania bila kuufafanua kupita kiasi.
- source_word: גָדוֹל
  choice: mkubwa
  rationale: Katika mkabala na קָטֹן, humaanisha mtu mwenye hadhi au umuhimu mkubwa. “Mkubwa” ni tafsiri ya kawaida na yenye heshima katika Kiswahili.
- source_word: שָׁם
  choice: huko
  rationale: Hurejelea mahali pa wafu panapozungumziwa katika muktadha uliotangulia. “Huko” huhifadhi urejeo huo wa mahali.
- source_word: הוּא
  choice: wako
  rationale: Ingawa kiwakilishi cha Kiebrania ni cha umoja, kauli inawahusu kwa pamoja mdogo na mkubwa. Kiswahili huhitaji upatanisho wa wingi katika “wako”; hakuna neno lililoongezwa lenye maana ya “sawa” au “vivyo hivyo.”
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Neno linaweza kutaja mtumishi au mtumwa, lakini mkabala wake na kuwa huru kutoka kwa bwana unaonyesha hali ya utumwa kwa uwazi zaidi.
- source_word: חָפְשִׁי
  choice: yuko huru
  rationale: Kivumishi hiki humaanisha kuwa huru, kinyume cha hali ya utumwa. “Yuko huru” ni usemi wa moja kwa moja na wa kawaida.
- source_word: מֵאֲדֹנָיו
  choice: mbali na bwana wake
  rationale: Kihusishi kinaonyesha kutengwa au kuondolewa chini ya mamlaka ya bwana. “Mbali na bwana wake” huepuka kudokeza kwamba bwana ndiye aliyemweka huru, huku kikihifadhi wazo la kutokuwa chini yake.
