translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kishairi na urudiaji wa ‘kama’ umehifadhiwa; ‘nuru’ imetumiwa badala ya ‘mwanga’ ili kudumisha sajili yenye hadhi bila kuwa ya kizamani.
