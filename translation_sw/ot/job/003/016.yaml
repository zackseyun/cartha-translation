translation:
  language: sw
  text: Au kama kijusi kilichotoka kabla ya wakati, kilichofichwa, nisingekuwako, kama watoto wachanga ambao hawakuiona nuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “hawakuiona nuru”; usemi huu wa Kiebrania unamaanisha kutoingia katika maisha ya duniani wala kutoyapitia.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Au
  rationale: Inaendeleza mfululizo wa hali mbadala ambazo Ayubu anatamani; ni kiunganishi cha kawaida na cha moja kwa moja katika Kiswahili.
- source_word: כְנֵ֣פֶל
  choice: kama kijusi kilichoharibika
  rationale: Nomino נֵפֶל inaweza kumaanisha kijusi kilichotoka kabla ya wakati au mtoto aliyezaliwa mfu. Tafsiri hii inaonyesha kiumbe kinachokufa kabla ya kuanza kuishi ulimwenguni bila kuifunga maana katika namna moja tu.
- source_word: טָ֭מוּן
  choice: na kufichwa
  rationale: Kitenzi טמן humaanisha kuficha au kusitiri. ‘Kufichwa’ huhifadhi taswira ya Kiebrania bila kudai wazi kwamba kinachozungumziwa ni kuzikwa.
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: nisingekuwako
  rationale: Kauli hii ya masharti huonyesha tamanio la Ayubu kwamba asingekuwapo. ‘Nisingekuwako’ ni ya kawaida katika Kiswahili na inadumisha wazo la kutokuwapo.
- source_word: כְ֝עֹלְלִ֗ים
  choice: kama watoto wachanga
  rationale: עֹלְלִים hapa ni watoto wadogo sana; ‘watoto wachanga’ inafaa katika muktadha wa wale ambao hawakuupata uzoefu wa maisha.
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: ambao hawakuiona nuru
  rationale: Tafsiri hii inadumisha tamathali ya Kiebrania ya ‘kuiona nuru,’ yaani kuingia katika maisha ya duniani au kuyapata.
