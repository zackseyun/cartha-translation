lexical_decisions:
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaeleza sababu ya laana ya Ayubu katika muktadha unaotangulia.
- source_word: סָגַר
  choice: kufunga
  rationale: Kitenzi hiki humaanisha kufunga; kinaendana kwa kawaida na taswira halisi ya milango.
- source_word: דַּלְתֵי
  choice: milango
  rationale: Huhifadhi sitiari ya milango inayofunga mahali pa kuzaliwa.
- source_word: בִטְנִי
  choice: tumbo la mama yangu
  rationale: Kiebrania kinasema kihalisi ‘tumbo langu,’ lakini msemaji ni mwanamume na muktadha unarejelea mahali alikokuwa kabla ya kuzaliwa; Kiswahili cha asili huhitaji kuweka wazi kuwa ni tumbo la mama yake.
- source_word: וַיַּסְתֵּר
  choice: wala kunificha
  rationale: Ingawa umbo la Kiebrania ni ‘na kuficha,’ ukanushaji wa kishazi cha kwanza unaendelea kimantiki; ‘wala’ huwasilisha hilo kwa Kiswahili cha kawaida. Kiambishi ‘ni-’ huonyesha kuwa taabu ingefichwa kwa Ayubu.
- source_word: עָמָל
  choice: taabu
  rationale: Neno pana linaloweza kumaanisha shida, mateso, huzuni, au kazi yenye kuchosha; ‘taabu’ linafaa katika maombolezo haya bila kubana maana kupita kiasi.
- source_word: מֵעֵינָי
  choice: nisiione
  rationale: 'Hii ni tafsiri ya maana ya nahau ‘kutoka machoni pangu’: taabu hiyo ingezuiwa isionekane wala kuonwa na Ayubu.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Tumbo la mama yangu’ huweka wazi rejeo la kuzaliwa bila kupoteza tanbihi ya usemi halisi wa Kiebrania. Muundo ‘kunificha taabu nisiione’ ni wa kawaida zaidi kuliko kuiga moja kwa moja nahau ya Kiebrania ‘kuificha taabu kutoka machoni pangu.’
