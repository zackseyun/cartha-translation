  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: sw
  text: Nyota za jioni yake zitiwe giza[a]; usiku huo ungojee nuru, lakini isiwepo; wala usione kope za mapambazuko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyota za machweo yake.” Neno la Kiebrania linaweza kutaja wakati wa mwanga hafifu, hasa jioni.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kope za mapambazuko,” taswira ya kishairi ya Kiebrania ya kuonekana kwa kwanza kwa mwanga wa asubuhi.
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: na ziwe giza
  rationale: Kauli ya kutakia katika muktadha wa laana imehifadhiwa kwa muundo wa Kiswahili ‘na ziwe giza,’ badala ya kueleza tukio la kawaida.
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: nyota za machweo yake
  rationale: Muundo tegemezi ‘nyota za’ na kiambishi cha nafsi ‘yake’ vimehifadhiwa. ‘Machweo’ hutoa maana ya kipindi cha mwanga hafifu wa jioni kwa lugha ya kishairi na ya kawaida.
- source_word: יְקַו
  choice: na ingojee
  rationale: Kitenzi kinaweza kumaanisha kungoja au kutumaini; ‘ingojee’ kinaonyesha tarajio linalokatishwa bila kuliongezea hali ya kisaikolojia.
- source_word: לְאוֹר
  choice: nuru
  rationale: ‘Nuru’ huhifadhi utofauti wa kishairi na giza na ina sajili yenye hadhi bila kufafanua neno hilo kuwa mwanga wa mchana pekee.
- source_word: וָאַיִן
  choice: lakini isiwepo
  rationale: Muundo huu unaonyesha tarajio lisilotimia na unaendeleza nguvu ya tamko la kutakia katika mstari.
- source_word: וְאַל יִרְאֶה
  choice: wala isione
  rationale: Muundo hasi wa kutakia umehifadhiwa kwa ‘wala isione,’ ukirejelea usiku unaopewa sifa za kiumbe.
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: kope za mapambazuko
  rationale: Taswira halisi ya Kiebrania, ‘kope za mapambazuko,’ imehifadhiwa badala ya kuibadili moja kwa moja kuwa miale ya kwanza.
