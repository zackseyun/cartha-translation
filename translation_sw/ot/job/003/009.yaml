translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtiririko wa kishairi na wenye hadhi. Uhuishaji wa usiku, nguvu ya laana, na taswira ya ‘kope za mapambazuko’ vimehifadhiwa. ‘Machweo’ limetumiwa kwa twilight ya jioni; uwezekano mwingine umeonyeshwa katika tanbihi.
