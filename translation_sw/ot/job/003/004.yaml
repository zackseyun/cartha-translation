  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הַ/יּ֥וֹם הַ/ה֗וּא יְֽהִ֫י חֹ֥שֶׁךְ אַֽל יִדְרְשֵׁ֣/הוּ אֱל֣וֹהַּ מִ/מָּ֑עַל וְ/אַל תּוֹפַ֖ע עָלָ֣י/ו נְהָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: sw
  text: Siku hiyo na iwe giza; Mungu aliye juu asiitafute[a], wala nuru[b] isiangaze juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asiijali” au “asiitilie maanani”; kitenzi cha Kiebrania kinaweza kumaanisha kutafuta, kuulizia, kuitilia maanani, au kuijali.
    reason: lexical_alternative
  - marker: b
    text: Au “mwangaza” au “mng’ao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Hurejelea siku ya kuzaliwa kwa Ayubu; tafsiri hii ni ya kawaida na inahifadhi rejeo la moja kwa moja.
- source_word: יְהִי חֹשֶׁךְ
  choice: na iwe giza
  rationale: Muundo wa ‘na iwe’ unaonyesha ombi au laana ya kishairi, huku ‘giza’ likiwakilisha hali inayotajwa na nomino ya Kiebrania.
- source_word: יִדְרְשֵׁהוּ
  choice: asiitafute
  rationale: Huhifadhi taswira ya msingi ya kitenzi דרש, ‘kutafuta’ au ‘kuulizia,’ bila kuficha maana ya kimuktadha ya kuitilia maanani au kuijali.
- source_word: אֱלוֹהַּ מִמָּעַל
  choice: Mungu aliye juu
  rationale: אֱלוֹהַּ ni umbo la kishairi la umoja linalomaanisha ‘Mungu’; ‘aliye juu’ huhifadhi maana ya mahali ya מִמָּעַל kwa Kiswahili cha asili.
- source_word: תּוֹפַע עָלָיו נְהָרָה
  choice: nuru isiangaze juu yake
  rationale: Hutoa Kiswahili cha kawaida kinachohifadhi tendo la kung'aa na mwelekeo wake ‘juu yake’; ‘nuru’ inafaa katika usambamba wa kishairi na ‘giza.’
theological_decisions:
- issue: Kumtaja Mungu moja kwa moja katika tamko la laana au ombolezo
  choice: Mungu aliye juu asiitafute
  alternative: mbingu za juu zisiitafute; Mungu wa mbinguni asiijali
  rationale: Kiebrania kinamtaja Mungu waziwazi. Tafsiri inadumisha ujasiri na mvutano wa ombolezo la Ayubu bila kulainisha usemi huo au kuubadili kuwa rejeo lisilo la kibinafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa urahisi. Muundo wa matamanio ‘na iwe’ unafuatwa na vitenzi vya hali ya kutamani ‘asiitafute’ na ‘isiangaze.’ Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
