  text: Why did knees receive me[a], and why breasts[b], that I should nurse?
translation:
  language: sw
  text: Kwa nini magoti yalinipokea[a], na kwa nini matiti nipate kunyonya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda ‘magoti’ yanamaanisha kupokewa kwa mtoto mchanga juu ya magoti au mapajani wakati wa kuzaliwa.
    reason: cultural_note
  - marker: b
    text: Kitenzi cha Kiebrania humaanisha mtoto mchanga kuvuta maziwa kutoka kwenye matiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Kielezi hiki cha kuuliza kinaanzisha kilio cha Ayubu kwa nguvu ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: קִדְּמוּנִי
  choice: yalinipokea
  rationale: Katika muktadha wa magoti na kuzaliwa, kitenzi kina maana ya kuja kumlaki au kumpokea mtoto, si tu kukutana naye.
- source_word: בִרְכָּיִם
  choice: magoti
  rationale: Neno halisi la Kiebrania limehifadhiwa; taswira yake ni ya mtoto mchanga kupokewa juu ya magoti au mapajani.
- source_word: וּמַה
  choice: na kwa nini
  rationale: Ingawa kwa umbo ni ‘na nini,’ katika usambamba huu wa maswali linaendeleza maana ya ‘kwa nini.’
- source_word: שָׁדַיִם
  choice: matiti
  rationale: Hili ni neno la moja kwa moja na linaloeleweka; ‘ya mama’ halijaongezwa kwa kuwa haipo wazi katika maandishi ya Kiebrania.
- source_word: כִּי
  choice: ili
  rationale: Hapa linaingiza kusudi au matokeo yanayohusiana na kuwepo kwa matiti.
- source_word: אִינָק
  choice: ninyonye
  rationale: Kitenzi humaanisha mtoto kuvuta maziwa matitini; ‘kunyonya’ ni usemi wa kawaida na sahihi katika Kiswahili.
