lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya hali ya Ayubu katika maombolezo yake na kuhifadhi nguvu ya kiunganishi cha sababu.
- source_word: לִפְנֵי
  choice: kabla ya
  rationale: 'Katika muktadha huu inaonyesha uhusiano wa wakati: kuugua kunatangulia kula.'
- source_word: לַחְמִי
  choice: mkate wangu
  rationale: Huhifadhi taswira halisi ya לֶחֶם, huku maana pana ya chakula ikitajwa katika tanbihi.
- source_word: אַנְחָתִי
  choice: kuugua kwangu
  rationale: Neno hili humaanisha kuugua au kutweta kwa sababu ya dhiki; umbo la nomino ya kitendo linafaa kwa maana ya hali inayoendelea.
- source_word: תָבֹא
  choice: huja
  rationale: Wakati wa mazoea huwasilisha kwa Kiswahili hali ya Ayubu inayoendelea na kujirudia.
- source_word: וַיִּתְּכוּ
  choice: humwagika
  rationale: Huhifadhi picha ya kitu kinachomiminika au kutiririka kwa wingi, hasa pamoja na tashbihi ya maji.
- source_word: כַמַּיִם
  choice: kama maji
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tashbihi hiyo.
- source_word: שַׁאֲגֹתָי
  choice: vilio vyangu
  rationale: Huonyesha sauti kubwa za uchungu kwa Kiswahili cha kawaida; neno la Kiebrania linaweza pia kuashiria miungurumo, jambo linalohifadhiwa katika tanbihi.
