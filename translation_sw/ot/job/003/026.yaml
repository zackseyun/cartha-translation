lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: nilikuwa na utulivu
  rationale: Kitenzi kinaeleza hali ya kuwa na raha, amani, au usalama usiovurugwa. “Kuwa na utulivu” ni Kiswahili cha kawaida kinachohifadhi maana pana bila kuibana iwe usalama wa nje pekee.
- source_word: שָׁקַטְתִּי
  choice: nilikuwa nimetulia
  rationale: שׁקט hueleza kutulia au kutosumbuliwa. “Nilikuwa nimetulia” hutofautisha neno hili na “utulivu” wa kishazi cha kwanza huku kikidumisha urudiaji wa kishairi.
- source_word: נָחְתִּי
  choice: nilipumzika
  rationale: Mzizi נוח humaanisha kupumzika au kutua. “Nilipumzika” ni usemi wa asili na huendeleza kilele cha vitenzi vitatu vinavyokaribiana kimaana.
- source_word: רֹגֶז
  choice: msukosuko
  rationale: Nomino hii inaweza kumaanisha vurugu, fadhaa, kutetemeka, au hali ya kutotulia. “Msukosuko” huwasilisha kuvurugika kwa ndani na kwa nje bila kuibana maana kuwa hasira au taabu ya jumla tu.
- source_word: וַיָּבֹא
  choice: ukaja
  rationale: Kitenzi kinaonyesha kuwasili kwa msukosuko. “Ukaja” hudumisha maana ya kawaida bila kuongeza maneno kama “ukanipata,” ambayo hayajaelezwa wazi katika Kiebrania.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: Sikuwa ... wala sikuwa ... wala siku...
  rationale: Kurudiwa kwa ukanushi kunatoa mkazo na mdundo wa maombolezo. Kurudia muundo wa ukanushi katika Kiswahili kunahifadhi athari hiyo badala ya kuunganisha mawazo hayo kuwa usemi mmoja.
