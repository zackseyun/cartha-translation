  text: Sikuwa na utulivu[a], wala sikutulia, wala sikupumzika; na msukosuko ukaja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikuwa na amani, wala sikuwa shwari, wala sikupumzika.” Kiebrania kinatumia vitenzi vitatu vyenye maana zinazokaribiana ili kusisitiza kukosekana kwa nafuu kwa Ayubu.
    reason: lexical_alternative
  - marker: b
    text: Au, “taabu ikaja” au “fadhaa ikaja.” Nomino ya Kiebrania inaweza kumaanisha msukosuko, hali ya kutotulia, fadhaa, au vurugu.
