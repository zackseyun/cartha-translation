  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: sw
  text: wanaoingojea mauti[a], lakini haiji, na wanaichimba zaidi kuliko wanavyochimba hazina zilizofichwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nayo haipo”; Kiebrania husema kihalisi “nayo haipo,” yaani mauti haionekani au haifiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: wanaoingojea
  rationale: Kitenzi חכה kimsingi humaanisha kungoja kwa matarajio. “Wanaoingojea” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili, bila kuongeza wazi wazo la kutamani.
- source_word: לַמָּוֶת
  choice: mauti
  rationale: Muundo huu ni kihusishi pamoja na nomino, na mauti ndiyo kitu kinachongojewa. “Mauti” linafaa kwa sajili ya kishairi na yenye hadhi ya kifungu hiki.
- source_word: וְאֵינֶנּוּ
  choice: lakini haiji
  rationale: Kihalisi ni “nayo haipo,” huku kiambishi kikirejelea mauti. Katika muktadha, “haiji” huwasilisha kwa Kiswahili cha kawaida maana iliyodokezwa kwamba mauti haifiki, huku tanbihi ikihifadhi usemi halisi zaidi.
- source_word: וַיַּחְפְּרֻהוּ
  choice: na kuichimbia
  rationale: חפר humaanisha kuchimba. Hapa limetumiwa kisitiari kuhusu kuitafuta mauti kama mtu anavyochimba akitafuta vitu vya thamani; “kuichimbia” huhifadhi taswira hiyo hai.
- source_word: מִמַּטְמוֹנִים
  choice: kuliko hazina zilizofichwa
  rationale: מַטְמוֹן ni hazina iliyofichwa au kuhifadhiwa. “Hazina zilizofichwa” huhifadhi maana ya neno na kuendana na taswira ya kuchimba; “kuliko” huonyesha nguvu ya ulinganisho ya מִן.
