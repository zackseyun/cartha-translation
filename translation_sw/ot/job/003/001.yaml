- source_word: אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha wakati kinachoendeleza simulizi kwa Kiswahili cha kawaida na kuhifadhi maana ya ‘baada ya hayo.’
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: akafungua kinywa chake
  rationale: Nahau ya Kiebrania imehifadhiwa kwa kuwa inaeleweka katika Kiswahili na inadumisha uzito wa utangulizi wa maneno ya Ayubu.
- source_word: אִיּוֹב
