- source_word: אֶת יוֹמוֹ
  choice: siku yake
  rationale: Huhifadhi usemi mfupi wa Kiebrania; muktadha unaofuata unaonyesha kuwa ni siku ya kuzaliwa kwake.
theological_decisions:
- issue: Kama ielezwe wazi kwamba ‘siku yake’ ni siku ya kuzaliwa kwa Ayubu
  choice: Kudumisha usemi mfupi ‘siku yake’ katika matini kuu
  alternative: siku ya kuzaliwa kwake
  rationale: Kiebrania katika mstari huu hakitaji kuzaliwa waziwazi, ingawa mistari inayofuata inafafanua maana hiyo. Usemi wa asili umehifadhiwa ili kutotangulia ufafanuzi wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘akafungua kinywa chake’ umehifadhiwa kwa uzito wake wa kifasihi bila kuifanya lugha kuwa ya kizamani.
