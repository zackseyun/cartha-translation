lexical_decisions:
- source_word: מְלָכִים
  choice: wafalme
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno la Kiebrania linalomaanisha wafalme.
- source_word: יֹעֲצֵי אָרֶץ
  choice: washauri wa dunia
  rationale: Muundo wa Kiebrania umehifadhiwa kwa lugha ya kawaida; unaweza kumaanisha washauri au wakuu wenye kutoa mashauri duniani.
- source_word: הַבֹּנִים חֳרָבוֹת לָמוֹ
  choice: waliojijengea magofu
  rationale: Kitenzi 'kujenga' na nomino 'magofu' zimehifadhi mvutano wa kimakusudi katika Kiebrania; 'waliojijengea' huwasilisha maana ya לָמוֹ, yaani kwa ajili yao wenyewe.
theological_decisions:
- issue: Maana ya kujenga magofu
  choice: waliojijengea magofu
  alternative: waliojijengea mahali palipokuwa ukiwa / waliojenga upya magofu kwa ajili yao
  rationale: Kiebrania chenyewe kinasema kwa namna yenye utata 'wanaojenga magofu.' Tafsiri haijafafanua kimya kimya ikiwa walijenga majengo yaliyokuja kuwa magofu, walijenga upya maeneo yaliyoharibiwa, au walijenga makaburi makubwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. 'Pamoja na' huendeleza sentensi ya mstari uliotangulia; 'waliojijengea magofu' huhifadhi ufupi na mvutano wa kishairi wa chanzo.
