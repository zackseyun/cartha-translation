base_translation:
  language: en
  yaml_path: translation/ot/job/003/013.yaml
  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: sw
  text: Kwa maana sasa ningelala na kutulia[a]; ningepata usingizi—ndipo ningekuwa na pumziko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kuwa kimya” au “na kuwa katika utulivu.”
    reason: lexical_alternative
  - marker: b
    text: Au “ndipo pangekuwa na pumziko kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu au maelezo ya tamanio la Ayubu katika muktadha uliotangulia.
- source_word: עַתָּה
  choice: sasa
  rationale: Inaonyesha hali ya sasa ambayo, kinyume na uhalisi, ingekuwapo kama Ayubu angekufa wakati wa kuzaliwa.
- source_word: שָׁכַבְתִּי
  choice: ningekuwa nimelala chini
  rationale: Muundo wa masharti usiotimia unaonyesha matokeo ambayo yangetokea; ‘kulala chini’ inadumisha taswira ya mwili kujilaza inayohusishwa hapa na kifo.
- source_word: וְאֶשְׁקֹט
  choice: na kutulia
  rationale: ‘Kutulia’ huwasilisha hali ya utulivu usiovurugwa bila kuongeza moja kwa moja wazo la amani.
- source_word: יָשַׁנְתִּי
  choice: ningekuwa nimelala usingizi
  rationale: Inadumisha kitenzi cha kawaida cha kulala na hivyo kuhifadhi sitiari ya kifo badala ya kuifafanua moja kwa moja.
- source_word: אָז
  choice: ndipo
  rationale: Inaonyesha hatua inayofuata katika mfuatano wa kishairi na inasikika kwa kawaida katika Kiswahili.
- source_word: יָנוּחַ לִי
  choice: ningepata pumziko
  rationale: Ni Kiswahili cha kawaida kinachowasilisha maana ya hali ya pumziko ‘kwa ajili yangu’ huku kikitofautisha usemi huu na ‘kutulia’ uliotangulia.
theological_decisions:
- issue: Taswira ya kifo kupitia kulala chini, kulala usingizi, na kupata pumziko
  choice: Kudumisha lugha halisi ya kulala chini, kulala usingizi, na kupata pumziko bila kutoa dai la wazi la kimafundisho kuhusu hali ya wafu.
  alternative: Kutafsiri sitiari moja kwa moja kuwa ‘ningekuwa nimekufa’ au kuipanua kuwa ‘ningepumzika katika kifo.’
  rationale: Kiebrania kinaeleza pumziko linalotamaniwa katika kifo kwa kutumia vitenzi vya kawaida vya kulala na kupumzika. Kuhifadhi taswira hiyo kunadumisha ushairi na mvutano wa kiteolojia wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Miundo ya ‘ningekuwa’ na ‘ningepata’ inaweka wazi hali ya masharti isiyotimia, huku marudio ya kulala yakihifadhi usambamba wa kishairi wa Kiebrania.
