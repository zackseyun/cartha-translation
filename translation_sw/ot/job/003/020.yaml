base_translation:
  language: en
  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: sw
  text: Kwa nini mwenye taabu hupewa nuru,[a] na wenye uchungu wa nafsi hupewa uzima?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nuru” ni taswira ya kishairi ya kuendelea kuwapo au kuishi; Kiebrania kinadumisha taswira hiyo badala ya kusema “uzima” moja kwa moja katika kishazi cha kwanza.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kwa nini yeye humpa nuru mwenye taabu, na uzima wenye uchungu wa nafsi?” Kiebrania hakimtaji mtoaji wazi, ingawa katika muktadha huenda Mungu ndiye anayekusudiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Huwasilisha swali la maombolezo kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: יִתֵּן
  choice: hupewa
  rationale: Kitenzi cha Kiebrania kina nafsi ya tatu ya kiume, lakini mtendaji hajatajwa wazi. Kauli tendwa ya Kiswahili inaacha mtoaji bila kutajwa huku ikidokeza hali inayoendelea au ya kawaida.
- source_word: לְעָמֵל
  choice: mwenye taabu
  rationale: Hapa עָמֵל humaanisha mtu aliye katika taabu au mateso, si mfanyakazi wa kawaida. Usemi huu ni wa asili na unaeleweka kwa wasomaji wa sasa.
- source_word: אוֹר
  choice: nuru
  rationale: Inahifadhi taswira ya kishairi ya Kiebrania; katika muktadha nuru inadokeza kuendelea kuwapo au kuishi.
- source_word: וְחַיִּים
  choice: uzima
  rationale: חַיִּים ina umbo la wingi lakini kwa kawaida humaanisha uzima au maisha. “Uzima” unafaa kishairi na hapa unaeleza hali ya kuwa hai.
- source_word: לְמָרֵי נָפֶשׁ
  choice: wenye uchungu wa nafsi
  rationale: Inahifadhi nahau ya Kiebrania kuhusu watu walio na uchungu ndani kabisa ya nafsi, bila kuipunguza kuwa huzuni ya kawaida tu.
theological_decisions:
- issue: Mtendaji aliyedokezwa katika יִתֵּן
  choice: Kuacha mtoaji bila kutajwa kwa kutumia “hupewa”
  alternative: “Kwa nini yeye humpa...” au “Kwa nini Mungu humpa...”
  rationale: Muktadha huenda unamdokeza Mungu, lakini mstari haumtajii wazi. Kauli tendwa inadumisha utata na mvutano wa kitheolojia wa malalamiko ya Ayubu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Ulinganifu wa “mwenye taabu” na “wenye uchungu wa nafsi” unafuata mabadiliko ya Kiebrania kutoka umoja wa kijumla kwenda wingi.
