base_translation:
  language: en
  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: sw
  text: Giza na uvuli mzito vidai tena[a]; wingu likae juu yake; magiza ya mchana yautie hofu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uvuli wa mauti” au “giza kuu” kwa צַלְמָוֶת.
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kinachotafsiriwa “magiza ya mchana” ni kigumu; huenda pia kikamaanisha “weusi wa mchana,” “kupatwa kwa mchana,” au, kwa uwezekano mdogo zaidi, “machungu ya mchana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: viudai tena
  rationale: Kitenzi גאל kina wazo la kudai tena au kurudisha kilicho haki ya mdai. Katika laana hii, “viudai tena” huhifadhi picha ya siku hiyo kurudishwa chini ya mamlaka ya giza bila kuleta maana chanya ya ukombozi.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa darkness, nalo linafaa katika hamu ya Ayubu ya siku ya kuzaliwa kwake kufutwa.
- source_word: צַלְמָוֶת
  choice: uvuli mzito
  rationale: Neno linaweza kueleweka kuwa “uvuli wa mauti” au “giza kuu.” “Uvuli mzito” huhifadhi taswira nzito bila kuamua kwamba mauti imetajwa waziwazi.
- source_word: תִּשְׁכָּן עָלָיו
  choice: likae juu yake
  rationale: שׁכן humaanisha kukaa, kuishi, au kutulia. “Likae juu yake” ni Kiswahili cha asili kinachohifadhi hali endelevu ya wingu kufunika siku hiyo.
- source_word: עֲנָנָה
  choice: wingu
  rationale: Huhifadhi taswira halisi ya hali ya anga na umoja wa nomino ya Kiebrania.
- source_word: יְבַעֲתֻהוּ
  choice: liutie hofu
  rationale: בעת katika piel huonyesha kusababisha hofu kuu au mshutuko. “Liutie hofu” ni usemi wa kawaida na wenye nguvu unaofaa kwa laana hii.
- source_word: כִּמְרִירֵי יוֹם
  choice: giza zito la mchana
  rationale: Kirai hiki kigumu huenda kinamaanisha hali za kutiwa giza au weusi wa mchana. Tafsiri hii inafuata muktadha wa giza na wingu huku tanbihi ikihifadhi uwezekano mwingine.
