  text: Tazama, usiku huo uwe tasa; kilio cha shangwe kisiingie ndani yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki kinavuta fikira kwa msisitizo; “Tazama” ni cha hadhi na kinafaa katika usemi wa kishairi.
- source_word: גַלְמוּד
  choice: tasa
  rationale: Neno hili linaashiria hali ya kuwa ukiwa au kutokuwa na uzao. Katika muktadha wa usiku ambao kuzaliwa kulitangazwa, “tasa” huhifadhi taswira ya kutokuwa na matunda.
- source_word: רְנָנָה
  choice: sauti ya furaha
  rationale: Hurejelea kilio au mwangwi wa shangwe; kifungu hiki ni cha asili kwa Kiswahili na hakibani maana kuwa wimbo pekee.
- source_word: תָּבֹא ... בֽוֹ
  choice: isiingie ndani yake
  rationale: Hufuata taswira ya Kiebrania ya sauti ya shangwe kuingia katika usiku huo, badala ya kuifanya tu ‘isitokee’.
