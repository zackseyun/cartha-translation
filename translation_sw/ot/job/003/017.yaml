  text: 'Huko waovu hukoma kufanya fujo,[a]

    na huko waliochoka na kuishiwa nguvu[b] hupumzika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msukosuko,” “ghadhabu,” au “kutotulia” badala ya “fujo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu kabisa, “waliochoka wa nguvu,” yaani waliochoka hadi kuishiwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Huko
  rationale: Kielezi hiki cha mahali kinarejelea mahali panapozungumziwa katika maombolezo ya Ayubu. “Huko” ni cha kawaida na kinadumisha urudiaji wa kishairi.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni nomino ya kijumla inayowataja watu waovu kimaadili; “waovu” ni tafsiri fupi na ya kawaida.
- source_word: חָדְלוּ
  choice: huacha
  rationale: Kitenzi חדל humaanisha kuacha au kukoma. Wakati wa mazoea unafaa kwa maelezo haya ya jumla kuhusu hali ya mahali hapo.
- source_word: רֹגֶז
  choice: vurugu zao
  rationale: Nomino hii inaweza kuonyesha msukosuko, fujo, ghadhabu, au hali ya kutotulia. “Vurugu zao” ni ya asili katika Kiswahili na haifungi maana kwenye hasira ya moyoni pekee.
- source_word: וְשָׁם
  choice: na huko
  rationale: Muunganiko huu unadumisha urudiaji na usambamba wa kishairi wa mstari wa Kiebrania.
- source_word: יָנוּחוּ
  choice: hupumzika
  rationale: Kitenzi נוח humaanisha kupumzika au kutulia; “hupumzika” ni cha moja kwa moja na cha kawaida katika muktadha huu.
- source_word: יְגִיעֵי כֹחַ
  choice: waliochoka na kuishiwa nguvu
  rationale: Kirai hiki ni, kwa karibu kabisa, “waliochoka wa nguvu,” yaani watu walioelemewa hadi nguvu zao zimekwisha. Tafsiri hii ni ya asili huku ikihifadhi wazi wazo la nguvu.
