  text: א֣וֹ עִם שָׂ֭רִים זָהָ֣ב לָ/הֶ֑ם הַֽ/מְמַלְאִ֖ים בָּתֵּי/הֶ֣ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/015.yaml
  text: or with princes who had gold[b][a], who filled their houses with silver—
translation:
  language: sw
  text: 'au pamoja na wakuu[a] waliokuwa na dhahabu,

    waliozijaza nyumba zao[b] fedha—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watawala” au “watu wenye vyeo vya juu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nyumba zao”; “majumba yao” linawezekana kulingana na muktadha, lakini lina maana mahususi zaidi kuliko neno la asili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: au
  rationale: Inaendeleza mfululizo wa mambo ambayo Ayubu anawazia yangalitokea; kiunganishi rahisi “au” kinahifadhi mtiririko wa kishairi.
- source_word: עִם
  choice: pamoja na
  rationale: Kihusishi hiki kinaonyesha kuwa angekuwa katika kundi moja na hao wakuu waliokufa; “pamoja na” ni ya kawaida na wazi katika Kiswahili.
- source_word: שָׂרִים
  choice: wakuu
  rationale: Neno hili humaanisha viongozi au watu wenye cheo cha juu. “Wakuu” ni pana vya kutosha kuhifadhi maana hiyo bila kudokeza lazima kwamba wote walikuwa wana wa mfalme.
- source_word: זָהָב לָהֶם
  choice: waliokuwa na dhahabu
  rationale: Kirai cha Kiebrania kinaeleza umiliki; tafsiri hii ni ya asili katika Kiswahili na inadumisha picha halisi ya utajiri.
- source_word: הַמְמַלְאִים
  choice: waliozijaza
  rationale: Hali ya kuendelea katika Kiebrania inawafafanua hao wakuu. Kishazi rejeshi cha wakati uliopita kinafaa muktadha wa watu waliokufa ambao Ayubu anawazia kuwa pamoja nao.
- source_word: בָּתֵּיהֶם
  choice: nyumba zao
  rationale: Nomino ya msingi ni “nyumba.” “Majumba yao” au “majumba ya kifalme” ingeongeza umahususi usiolazimishwa na matini.
- source_word: כָּסֶף
  choice: fedha
  rationale: Katika muktadha huu wa dhahabu na utajiri, neno linamaanisha madini ya fedha, si pesa kwa maana ya jumla.
