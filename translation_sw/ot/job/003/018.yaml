lexical_decisions:
- source_word: יַחַד
  choice: pamoja
  rationale: Kielezi hiki kinaonyesha kwamba wafungwa wanashiriki hali hiyo kwa pamoja; mpangilio wa Kiswahili unaleta maana hiyo kwa kawaida.
- source_word: אֲסִירִים
  choice: wafungwa
  rationale: Ni neno la kawaida na wazi kwa watu waliofungwa au kuwekwa kizuizini, bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: שַׁאֲנָנוּ
  choice: wametulia
  rationale: Linawasilisha hali ya utulivu na kutosumbuliwa bila kuifanya iwe pumziko kamili au usalama wa kudumu.
- source_word: לֹא שָׁמְעוּ
  choice: hawaisikii
  rationale: Ingawa umbo la Kiebrania ni qatal, katika ushairi huu linaeleza hali inayoendelea; wakati wa sasa wa Kiswahili unafaa zaidi.
- source_word: קוֹל
  choice: sauti
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sauti inayosikika ya mwenye kutoa amri au madai.
- source_word: נֹגֵשׂ
  choice: msimamizi wa kazi
  rationale: Katika muktadha huu ni mtu anayeshurutisha na kusimamia kazi; tafsiri hii ni wazi kwa msomaji wa sasa huku tanbihi ikihifadhi maana pana za mdai na mkandamizaji.
