  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: sw
  text: Na iangamie siku niliyozaliwa, na usiku uliosema, “Mtoto wa kiume amechukuliwa mimba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹאבַד
  choice: na iangamie
  rationale: Umbo hili linaonyesha ombi la laana au tamanio kali, si taarifa rahisi kuhusu wakati ujao.
- source_word: יוֹם אִוָּלֶד בּוֹ
  choice: siku niliyozaliwa
  rationale: Hurejelea siku maalumu ya kuzaliwa kwa Ayubu; Kiswahili hiki ni cha kawaida na kinahifadhi maana ya usemi wa Kiebrania.
- source_word: וְהַלַּיְלָה
  choice: na ule usiku
  rationale: Huunganisha usiku na siku kama vitu viwili vinavyolaaniwa; “ule” huonyesha usiku maalumu unaokusudiwa.
- source_word: אָמַר
  choice: uliosema
  rationale: Huhifadhi tashihisi ya usiku unaotoa tangazo.
- source_word: הֹרָה
  choice: ametungwa mimba
  rationale: Katika muktadha huu kitenzi kinaeleza kutungwa kwa mimba, wala si kwamba usiku wenyewe ulipata mimba.
- source_word: גָבֶר
  choice: mtoto wa kiume
  rationale: Neno humaanisha mtu wa jinsia ya kiume; katika tangazo la kutungwa kwa mimba, “mtoto wa kiume” ni Kiswahili cha asili na wazi zaidi kuliko “mwanamume.”
