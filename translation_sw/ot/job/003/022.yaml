  yaml_path: translation/ot/job/003/022.yaml
  text: who rejoice exceedingly[c][b][a], who exult when they find the grave—
translation:
  language: sw
  text: wanaofurahi mno,[a] wanaoshangilia wanapopata kaburi.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaofurahi hadi shangwe”; kirai cha Kiebrania ni nahau ya kusisitiza ukubwa wa furaha.
    reason: lexical_alternative
  - marker: b
    text: Au, “wanaoshangilia kwa sababu wanapata kaburi.” Kiunganishi cha Kiebrania hapa kinaweza kueleza sababu au wakati.
    reason: alternative_reading
  - marker: c
    text: Au, “kaburi fulani.” Neno la Kiebrania linaweza kuwa lisilo maalumu, ingawa “kaburi” hapa pia linaweza kuwa na maana ya jumla ya mauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: wanaofurahi
  rationale: Kivumishi-tendo chenye kibainishi kimetumika kama nomino na kinaendeleza maelezo ya watu waliotajwa katika mstari uliotangulia. ‘Wanaofurahi’ ni ya kawaida na huhifadhi hali hiyo.
- source_word: אֱלֵי גִיל
  choice: kupita kiasi
  rationale: Kirai hiki, kihalisi ‘kuelekea/kwenda kwenye shangwe,’ kinafanya kazi kama msisitizo wa kiwango cha furaha. ‘Kupita kiasi’ huwasilisha nguvu yake kwa Kiswahili cha kawaida.
- source_word: יָשִׂישׂוּ
  choice: wanaoshangilia
  rationale: Kitenzi hiki kinaongeza wazo la furaha kubwa baada ya ‘wanaofurahi.’ ‘Wanaoshangilia’ hudumisha ongezeko hilo la kishairi bila kurudia kitenzi kilekile.
- source_word: כִּי
  choice: wanapo-
  rationale: Kiunganishi kinaweza kueleza wakati au sababu. Muundo wa ‘wanapoliona’ unatoa maana ya wakati kwa ufasaha, huku uwezekano wa maana ya sababu ukihifadhiwa katika tanbihi.
- source_word: יִמְצְאוּ
  choice: wanapoliona
  rationale: מצא kwa msingi ni ‘kupata/kukuta.’ Katika muktadha wa kulifikia kaburi kama mwisho unaotamaniwa, ‘kuliona’ ni Kiswahili cha kishairi na cha kawaida; maana ya moja kwa moja ‘kulipata’ imetolewa katika tanbihi.
- source_word: קָבֶר
  choice: kaburi
  rationale: Nomino ya Kiebrania haina kibainishi na inaweza kueleweka kama ‘kaburi’ kwa maana isiyo maalumu au kwa maana ya jumla ya mauti. Kiswahili ‘kaburi’ hudumisha uwazi huo kwa kiasi kikubwa.
theological_decisions:
- issue: Je, כִּי inaonyesha wakati au sababu?
  choice: 'Wakati: ‘wanapoliona kaburi’'
  alternative: 'Sababu: ‘kwa sababu wamelipata kaburi’'
  rationale: Katika mtiririko wa kishairi, tukio la kuliona/kulipata kaburi ndilo linaloambatana na shangwe yao. Hata hivyo, Kiebrania kinaweza pia kusomwa kwa maana ya sababu, kwa hiyo uwezekano huo umeonyeshwa katika tanbihi bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Urudiaji wa ‘furahi/shangilia’ umehifadhi ulinganifu na kuongezeka kwa nguvu katika Kiebrania. Alama zote za tanbihi zimewekwa mara baada ya vipashio vinavyohusika.
