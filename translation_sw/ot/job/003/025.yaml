  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
translation:
  language: sw
  text: Kwa maana hofu niliyoiogopa imenipata[a], na kile nilichokiogopa kimenijia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia nomino na kitenzi vyenye mzizi mmoja—kihalisi, “hofu niliyoihofu”—ili kutia mkazo. Kitenzi cha kishazi cha kwanza kinaweza pia kutafsiriwa “imenijia” au “imenifikia”; kishazi cha pili kinasema kwa karibu zaidi “kimenijia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno hilo linaanzisha maelezo ya sababu ya malalamiko yaliyotangulia; “Kwa maana” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: פַחַד / פָּחַדְתִּי
  choice: hofu niliyoihofu
  rationale: Nomino na kitenzi vyenye mzizi mmoja vimedumishwa ili kuhifadhi msisitizo wa Kiebrania, ingawa muundo huu una ladha ya kishairi katika Kiswahili.
- source_word: וַיֶּאֱתָיֵנִי
  choice: imenipata
  rationale: Kitenzi hapa kinaonyesha janga kumjia au kumpata mtu. “Imenipata” ni ya kawaida na pia inatofautisha kishazi hiki na יָבֹא לִי katika kishazi kinachofuata.
- source_word: וַאֲשֶׁר
  choice: na kile
  rationale: Hutambulisha kishazi cha pili chenye ulinganifu; “na kile” hudumisha maana ya kitu kisichotajwa wazi.
- source_word: יָגֹרְתִּי
  choice: nilichokiogopa
  rationale: Kitenzi kina maana ya kuogopa au kuhofia. “Kuogopa” ni cha kawaida na kinaendeleza ulinganifu bila kufuta msisitizo maalumu wa kishazi cha kwanza.
- source_word: יָבֹא לִי
  choice: kimenijia
  rationale: Ingawa umbo la Kiebrania ni lisilo timilifu, muktadha unaonyesha jambo lililotimia. “Kimenijia” huhifadhi picha ya kuja kwa mtu na tofauti ndogo na “imenipata” katika kishazi cha kwanza.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi unaofaa maombolezo ya Ayubu lakini unaoeleweka kwa msomaji wa kawaida. Urudiaji wa “hofu niliyoihofu” umehifadhiwa kwa makusudi ili kuonyesha msisitizo wa maandishi ya Kiebrania; tofauti ndogo kati ya “imenipata” na “kimenijia” inalinda ulinganifu wenye utofauti wa vitenzi.
