base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: sw
  text: Laiti ungenificha katika Sheoli[a], ungenisitiri mpaka hasira yako iondoke, ungenipangia muda maalumu[b] na unikumbuke!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kaburini” au “katika makao ya wafu.” Kiebrania: “Sheoli.”'
    reason: lexical_alternative
  - marker: b
    text: Au “uniwekee mpaka.” Neno la Kiebrania linaweza kumaanisha jambo lililowekwa, lililoamriwa, au lililowekewa mpaka.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Laiti
  rationale: Kirai hiki ni nahau ya Kiebrania inayoonyesha tamanio kubwa, si swali halisi la ‘ni nani atakayetoa.’ ‘Laiti’ ni ya asili na yenye uzito katika Kiswahili.
- source_word: בִּשְׁאוֹל
  choice: katika Sheoli
  rationale: ‘Sheoli’ huhifadhi dhana ya Kiebrania ya makao ya wafu bila kuipunguza kuwa kaburi moja au kuihusianisha moja kwa moja na fundisho la baadaye kuhusu jehanamu.
- source_word: תַּצְפִּנֵנִי / תַּסְתִּירֵנִי
  choice: ungenificha / unisitiri
  rationale: Vitenzi hivi vinavyokaribiana kimaana vinadumisha usambamba wa kishairi huku tofauti ndogo ya maneno ikionyesha msisitizo wa ombi.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: mpaka hasira yako iondoke
  rationale: ‘Hasira’ ndiyo maana ya nahau ya אַף hapa. ‘Iondoke’ huwasilisha kwa Kiswahili cha kawaida wazo la hasira kugeuka na kupita bila kutumia kauli isiyo ya kawaida.
- source_word: תָּשִׁית לִי חֹק
  choice: unipangie muda maalumu
  rationale: Katika muktadha huu חֹק inaelekea kumaanisha kipindi au wakati uliowekwa. Tafsiri hii ni wazi, lakini tanbihi huhifadhi uwezekano mpana wa mpaka au jambo lililowekwa.
- source_word: וְתִזְכְּרֵנִי
  choice: kisha unikumbuke
  rationale: ‘Unikumbuke’ huhifadhi maana ya moja kwa moja na nguvu ya kimahusiano ya kukumbukwa na Mungu; ‘kisha’ huonyesha mwendelezo unaokusudiwa katika tamanio hilo.
theological_decisions:
- issue: Maana ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: Unukuzi huhifadhi ulimwengu wa dhana za Kiebrania na mvutano wa kifungu bila kuifanya Sheoli iwe kaburi tu au kuisawazisha na jehanamu.
- issue: Maana ya חֹק katika ombi la Ayubu
  choice: muda maalumu
  alternative: mpaka uliowekwa; kipindi kilichoamriwa
  rationale: Muktadha wa kusubiri hadi hasira ya Mungu iondoke unaunga mkono muda uliowekwa, lakini tanbihi inahifadhi upana wa neno linaloweza kumaanisha jambo lililowekwa, kuamriwa, au kuwekewa mpaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Laiti’ huhifadhi sauti ya maombolezo ya kishairi; sentensi nzima imeundwa kama tamanio moja lenye nguvu. ‘Sheoli’ imefafanuliwa katika tanbihi ili msomaji wa kawaida aielewe bila kuingiza maana ya kimadhehebu.
