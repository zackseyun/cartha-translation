  text: יִכְבְּד֣וּ בָ֭נָי/ו וְ/לֹ֣א יֵדָ֑ע וְ֝/יִצְעֲר֗וּ וְֽ/לֹא יָבִ֥ין לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: sw
  text: Wanawe hupata heshima[a], naye hajui; wanakuwa duni, naye hatambui habari zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanawe wanaheshimiwa, naye hajui; wanakuwa duni, naye hatambui habari zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: wakiheshimiwa
  rationale: Qal ya כבד ikiwa na 'wanawe' kama kiima inaweza kueleza wao kuwa au kupata heshima. 'Wakiheshimiwa' ni Kiswahili cha kawaida na huhifadhi hali hiyo bila kuifanya kuwa tendo lao la kuwaheshimu wengine.
- source_word: בָנָיו
  choice: wanawe
  rationale: Nomino ya Kiebrania ni wingi wa kiume wenye kiambishi cha nafsi ya tatu umoja wa kiume; 'wanawe' huwakilisha kwa ufupi na kwa kawaida maana ya 'wana wake'.
- source_word: וְלֹא יֵדָע
  choice: yeye hajui
  rationale: ידע humaanisha 'kujua.' Kiwakilishi 'yeye' kinasisitiza tofauti kati ya hali ya wanawe na kutokujua kwake.
- source_word: וְיִצְעֲרוּ
  choice: wakishushwa
  rationale: צער hapa inatofautishwa na kuheshimiwa na ina wazo la kuwa duni, kupunguzwa hadhi, au kushushwa. 'Wakishushwa' ni ya asili na huhifadhi ulinganifu wa vifungu.
- source_word: וְלֹא יָבִין
  choice: yeye hatambui
  rationale: בין huonyesha kuelewa au kutambua kwa utambuzi; 'hatambui' inafaa kwa kutokuwa na habari kuhusu hali yao.
- source_word: לָמוֹ
  choice: habari zao
  rationale: Umbo hili la kiwakilishi linawarejelea wanawe. 'Hatambui habari zao' huonyesha uhusiano huo kwa Kiswahili cha kawaida bila kutumia muundo mgumu wa neno kwa neno.
