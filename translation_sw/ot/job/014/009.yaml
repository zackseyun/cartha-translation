translation:
  language: sw
  text: 'kwa harufu ya maji utachipua

    na kutoa machipukizi kama mmea.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kutoa ukuaji mpya kama kitu kilichopandwa.” Neno la Kiebrania lililotafsiriwa “machipukizi” kwa kawaida humaanisha “mavuno,” lakini hapa linaweza kumaanisha ukuaji mpya unaotolewa na mmea.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵיחַ
  choice: kwa harufu ya
  rationale: Neno רֵיחַ humaanisha harufu; kiambishi מִן hapa kinaonyesha kwamba mti huitikia hata harufu au ukaribu wa maji. Usemi huu unadumisha nguvu ya kishairi ya Kiebrania.
- source_word: מַיִם
  choice: maji
  rationale: Ingawa umbo la Kiebrania ni la wingi, מַיִם kwa kawaida ni nomino ya kitu kisichohesabika; “maji” ndiyo Kiswahili cha kawaida.
- source_word: יַפְרִחַ
  choice: utachipua
  rationale: Hifili ya פרח inaweza kumaanisha kuchipua, kutoa machipukizi, au kuchanua. “Utachipua” inafaa kwa mti uliokatwa unaoanza kuwa hai tena bila kudokeza kwamba tayari umechanua maua.
- source_word: וְעָשָׂה קָצִיר
  choice: na kutoa machipukizi
  rationale: עשה ni “kufanya/kutoa,” na קָצִיר kwa kawaida ni “mavuno,” lakini katika taswira hii ya mimea inaelekea kumaanisha ukuaji unaotolewa, yaani machipukizi. Tanbihi inadumisha uwezekano wa tafsiri halisi zaidi ya “mavuno.”
- source_word: כְּמוֹ נָטַע
  choice: kama mmea
  rationale: כְּמוֹ ni ulinganisho wa “kama,” na נָטַע hapa hurejelea kilichopandwa au mmea. “Mmea” ni ya asili katika Kiswahili na haiongezi kwa lazima neno “mti,” ambalo halipo wazi katika kirai hiki.
