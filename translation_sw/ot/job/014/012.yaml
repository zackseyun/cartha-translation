base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: sw
  text: Lakini mwanadamu hulala chini, wala hainuki; mpaka mbingu zisiwepo tena[a], wanadamu hawataamka wala hawataamshwa kutoka usingizini mwao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka mbingu zikome kuwapo.” Usemi huu wa Kiebrania unaonyesha kikomo ambacho kwa mtazamo wa kibinadamu hakiwezi kufikiwa.
    reason: lexical_alternative
  - marker: b
    text: 'Aya hii inatumia taswira ya usingizi kuzungumzia kifo: “hawataamka wala hawataamshwa kutoka usingizini mwao.”'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: Lakini mwanadamu
  rationale: Katika muktadha, וְ inaonyesha tofauti kati ya tumaini la mti katika mistari iliyotangulia na hali ya mwanadamu, hivyo imetafsiriwa “Lakini.” אִישׁ hapa humwakilisha mwanadamu katika hali yake ya kufa; “mwanadamu” ni ya asili na yenye hadhi katika Kiswahili bila kupunguza maana hiyo kuwa mtu fulani tu.
- source_word: שָׁכַב
  choice: hulala chini
  rationale: Kitenzi hiki humaanisha kulala chini na hapa ni tasfida ya kifo. Tafsiri inadumisha picha ya kulala badala ya kuifafanua moja kwa moja kuwa kufa.
- source_word: וְלֹא יָקוּם
  choice: wala hainuki
  rationale: “Kuinuka” huhifadhi sitiari ya Kiebrania na kauli ya jumla kuhusu hali ya mwanadamu baada ya kulala chini.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: mpaka mbingu zisiwepo tena
  rationale: 'Huu ni usemi wa Kiebrania unaoweka kikomo cha mbali mno: mpaka mbingu zitakapokoma kuwapo. Kiswahili hiki ni cha kawaida huku kikihifadhi upeo wa kishairi wa kauli hiyo.'
- source_word: לֹא יָקִיצוּ
  choice: wanadamu hawataamka
  rationale: Kitenzi cha Kiebrania ni cha wingi, baada ya nomino ya umoja inayomwakilisha mwanadamu kwa jumla. Kurudia “wanadamu” kunaonyesha mabadiliko hayo ya idadi kwa Kiswahili kinachoeleweka.
- source_word: וְלֹא יֵעֹרוּ
  choice: wala hawataamshwa
  rationale: Umbo la kitenzi lina maana ya kuamshwa au kuchochewa kutoka usingizini. “Hawataamshwa” huhifadhi hali ya kutendwa na usambamba wa kishairi.
- source_word: מִשְּׁנָתָם
  choice: kutoka usingizini mwao
  rationale: “Usingizi” ni maana ya moja kwa moja na huendeleza taswira ya kifo kama kulala; “mwao” inalingana na vitenzi vya wingi.
theological_decisions:
- issue: Iwapo taswira ya kifo ifafanuliwe kuwa maangamizi au kukataliwa kwa ufufuo
  choice: Kudumisha taswira ya kulala, kutoinuka na kutoamka bila kuiongezea hitimisho la kimafundisho
  alternative: Kutafsiri wazi kuwa “anakufa na hataishi tena,” au kuifanya kauli kuwa fundisho la moja kwa moja kuhusu ufufuo wa mwisho
  rationale: Aya inasema kwa lugha ya kishairi kutoka katika mtazamo wa Ayubu. Tafsiri inahifadhi mvutano wa maneno hayo bila kuamua kimya kimya suala la ufufuo wa mwisho au maangamizi.
- issue: Uwakilishi wa אִישׁ
  choice: mwanadamu
  alternative: mwanamume
  rationale: Ingawa nomino ya Kiebrania ni ya umoja wa kiume, hapa inatumiwa kiwakilishi kuzungumzia hali ya wanadamu kwa jumla, jambo linalothibitishwa na vitenzi vya wingi vinavyofuata. “Mwanadamu” hutoa maana hiyo kwa Kiswahili bila kuifanya aya ihusu wanaume pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Hulala chini,” “hainuki,” “hawataamka,” na “hawataamshwa” zinadumisha mfuatano wa taswira za Kiebrania. Alama za tanbihi zimewekwa baada ya maneno wanayoyaeleza.
