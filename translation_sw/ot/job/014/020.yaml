base_translation:
  language: en
  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: sw
  text: Unamshinda milele[a], naye anaondoka[b]; unabadilisha uso wake na unamwondoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “daima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “anaenda”; katika muktadha huu huenda ikamaanisha kuondoka katika maisha au kutoweka katika ulimwengu wa wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: Unamshinda kabisa
  rationale: Kitenzi תקף katika muktadha huu kina maana ya kuwa na nguvu dhidi ya mtu na kumshinda. ‘Unamshinda kabisa’ ni Kiswahili cha kawaida kinachoonyesha nguvu ya Mungu dhidi ya mwanadamu bila kuongeza wazo lisilokuwamo.
- source_word: לָנֶצַח
  choice: milele
  rationale: נֶצַח huonyesha muda usio na mwisho au hali ya kudumu; hapa ‘milele’ huhifadhi uzito wa ushindi usioweza kubadilishwa.
- source_word: וַיַּהֲלֹךְ
  choice: naye anaondoka
  rationale: הלך maana yake ya msingi ni ‘kwenda.’ Katika muktadha wa kufa inaweza kudokeza kuondoka katika maisha, lakini ‘anaondoka’ huhifadhi sitiari na kutolazimisha maana hiyo kuwa kifo waziwazi.
- source_word: מְשַׁנֶּה פָנָיו
  choice: unaubadili uso wake
  rationale: שנה ni ‘kubadili,’ na פנים ni ‘uso,’ ingawa inaweza pia kumaanisha sura au mwonekano. Tafsiri hii inadumisha taswira halisi ya Kiebrania.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: kisha unamwondoa
  rationale: שלח katika piel inaweza kuwa kumpeleka mtu mbali, kumwacha aende, au kumfukuza. ‘Unamwondoa’ ni ya asili katika Kiswahili na inaonyesha kuondolewa kwake bila kuamua ikiwa ni kuachiliwa au kufukuzwa.
theological_decisions:
- issue: Je, kuondoka kwa mwanadamu kunatajwa moja kwa moja kuwa kifo?
  choice: anaondoka
  alternative: anakufa / anapita kutoka duniani
  rationale: Kiebrania kinatumia kitenzi cha kawaida ‘kwenda’; muktadha unadokeza kifo, lakini tafsiri kuu inahifadhi utata wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Muundo wa nafsi ya pili umedumishwa kwa kuwa Ayubu anamwelekea Mungu moja kwa moja; ‘uso’ limehifadhiwa badala ya kufafanuliwa kuwa ‘mwonekano.’
