  text: Kwa kuwa siku zake zimeamuliwa[a], idadi ya miezi yake iko kwako; umeweka mpaka wake[b], naye hawezi kuuvuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Ikiwa siku zake zimeamuliwa.” Chembe ya Kiebrania inaweza kuanzisha sharti, lakini katika muktadha huu huenda inatoa msingi wa ombi la Ayubu: “Kwa kuwa siku zake zimeamuliwa.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “mpaka wake” au “agizo lake.” Neno la Kiebrania linaweza kumaanisha mpaka au kikomo kilichowekwa, na pia agizo au dekrii.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kwa kuwa
  rationale: Ingawa chembe hii inaweza kumaanisha “ikiwa,” katika muktadha huu inaeleweka kwa kawaida kuwa inatoa msingi wa ombi la Ayubu. “Kwa kuwa” huwasilisha maana hiyo bila kuondoa uwezekano wa tafsiri ya sharti, ambao umeonyeshwa katika tanbihi.
- source_word: חֲרוּצִים
  choice: zimeamuliwa
  rationale: Kauli hii ya kutendwa inaonyesha kwamba siku za mwanadamu zimekwisha kuamuliwa au kuwekwa. “Zimeamuliwa” ni ya kawaida, wazi, na haiongezi maelezo yasiyokuwamo katika Kiebrania.
- source_word: יָמָיו
  choice: siku zake
  rationale: Hii ni tafsiri ya moja kwa moja ya wingi wenye kiambishi cha nafsi ya tatu umoja, ikirejelea muda wa maisha ya mwanadamu.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: idadi ya miezi yake
  rationale: Tafsiri hii inadumisha muundo wa nomino wa Kiebrania na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: אִתָּךְ
  choice: iko kwako
  rationale: Kirai hiki kwa msingi ni “pamoja nawe/kwako.” Katika muktadha kinaweza kudokeza ujuzi na mamlaka ya Mungu, lakini “iko kwako” huhifadhi usemi wa chanzo bila kuufafanua kupita kiasi.
- source_word: חֻקּוֹ
  choice: mpaka wake
  rationale: Nomino hii inaweza kumaanisha mpaka uliowekwa au amri iliyopangwa. “Mpaka” inafaa hasa pamoja na kitenzi kinachofuata cha kuvuka, huku maana mbadala ikitajwa katika tanbihi.
- source_word: עָשִׂיתָ
  choice: umemwekea
  rationale: Ingawa kitenzi kwa kawaida ni “kufanya,” pamoja na “mpaka” maana ya kimuktadha ni kuweka au kuanzisha. Muundo huu pia unaonyesha wazi kuwa mpaka umewekwa kwa ajili ya mtu huyo.
- source_word: וְלֹא יַעֲבוֹר
  choice: naye hawezi kuuvuka
  rationale: Kitenzi cha umoja kinamhusu mwanadamu, na kiambishi “-u-” kinarejelea mpaka. “Hawezi kuuvuka” huonyesha katika muktadha kutoweza kwenda zaidi ya mpaka uliowekwa.
theological_decisions:
- issue: Mungu kuamua muda wa maisha ya mwanadamu
  choice: Mstari unasema kwamba siku za mwanadamu zimeamuliwa, idadi ya miezi yake iko kwa Mungu, na Mungu amemwekea mpaka asioweza kuuvuka.
  alternative: Mstari unaweza kueleweka kwa maana dhaifu zaidi kuwa unasisitiza tu ujuzi wa Mungu kuhusu muda wa maisha, badala ya uamuzi wake wa moja kwa moja.
  rationale: Muunganiko wa “zimeamuliwa,” “iko kwako,” na “umemwekea mpaka” unaunga mkono ujuzi na mamlaka ya Mungu. Tafsiri inadumisha dai hilo lenye nguvu bila kulipanua kuwa mfumo mpana wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi umehifadhiwa kwa vifungu viwili vilivyounganishwa kwa nuktamkato; tanbihi zinatunza utata halisi wa אִם na upana wa maana wa חֻקּוֹ.
