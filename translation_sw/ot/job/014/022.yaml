  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: sw
  text: Hakika[a] mwili wake humuuma, na nafsi yake[b] huomboleza kwa ajili yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwili wake tu humuuma, na nafsi yake huomboleza kwa ajili yake.” Neno la Kiebrania linaweza kumaanisha “hakika” au “tu.”
    reason: lexical_alternative
  - marker: b
    text: “Nafsi” pia inaweza kutafsiriwa “uhai,” “yeye mwenyewe,” au “utu wa ndani.” Kirai cha Kiebrania kinachorudiwa kina maana ya karibu “juu yake”; hapa kimetafsiriwa kwa namna ya asili kama kumhusu yeye au kwa ajili yake. Maana sahihi ya idiomu hii ina utata kwa kiasi fulani.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Chembe hii inaweza kusisitiza au kuweka mpaka. “Hakika” inaonyesha mkazo wa hitimisho bila kulazimisha maana ya “tu,” ambayo pia inawezekana.
- source_word: בְּשָׂרוֹ
  choice: mwili wake
  rationale: Ingawa בָּשָׂר kwa msingi ni “nyama,” hapa inamaanisha uwepo wa kimwili wa mtu; “mwili” ni Kiswahili cha kawaida na chenye heshima kuliko “nyama yake” katika muktadha huu.
- source_word: עָלָיו
  choice: ulio juu yake / iliyo juu yake
  rationale: Kirai hicho kimerudiwa katika mistari yote miwili. Tafsiri hii inadumisha taswira na urudiaji wa Kiebrania, ingawa usemi wake ni usio wa kawaida kwa kiasi fulani katika Kiswahili.
- source_word: יִכְאָב
  choice: huumia
  rationale: Kitenzi כאב huonyesha kuwa na maumivu; “huumia” ni kifupi, cha asili, na hakibainishi aina ya maumivu isiyotajwa.
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: נֶפֶשׁ inaweza kuwa nafsi, uhai, au mtu mwenyewe. “Nafsi” inadumisha ulinganifu wa kishairi na “mwili” bila kufafanua kwa lazima mtazamo fulani kuhusu muundo wa mwanadamu.
- source_word: תֶּאֱבָל
  choice: huomboleza
  rationale: אבל humaanisha kuomboleza au kuhuzunika; “huomboleza” inadumisha uzito na sajili ya kishairi.
theological_decisions:
- issue: Maana ya נֶפֶשׁ inapolinganishwa na בָּשָׂר
  choice: Imetafsiriwa “nafsi” ili kuhifadhi mvutano wa kishairi kati ya mwili na nafsi.
  alternative: “uhai wake,” “yeye mwenyewe,” au “utu wake wa ndani”
  rationale: Mstari unalinganisha maumivu ya kimwili na maombolezo ya nafsi. “Nafsi” huhifadhi taswira hiyo bila kudai kwamba aya inafundisha kwa ukamilifu kuhusu sehemu zinazounda mwanadamu.
- issue: Maana ya עָלָיו iliyorudiwa
  choice: Urudiaji umetafsiriwa kwa “ulio/iliyo juu yake.”
  alternative: “ndani yake,” “kwa ajili yake mwenyewe,” au kwa maana ya kumhusu yeye
  rationale: Kiebrania kinarudia kirai kilekile katika vipande vyote viwili. Kukihifadhi huacha wazi uhusiano wa mwili na nafsi kwa mtu badala ya kuamua kimyakimya kwamba nafsi iko “ndani” yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima. Kirai “ulio/iliyo juu yake” ni cha makusudi na kisicho cha kawaida kidogo ili kuhifadhi urudiaji na utata wa עָלָיו katika Kiebrania; maelezo ya chini yanatoa maana mbadala za asili.
