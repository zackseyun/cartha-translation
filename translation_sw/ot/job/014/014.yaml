id: JOB.14.14
reference: Job 14:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: sw
  text: Mtu akifa, je, ataishi tena? Siku zote za utumishi wangu wa taabu ningengoja, mpaka badiliko langu[a] lifike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafuu yangu” au “kufanywa upya kwangu.” Neno la Kiebrania linaweza kumaanisha badiliko, nafuu, au kufanywa upya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָמוּת גֶּבֶר
  choice: Mtu akifa
  rationale: Muundo wa -ki- unatoa sharti la kawaida kwa Kiswahili na kuhifadhi nguvu ya swali. Ingawa גֶּבֶר ni nomino ya kiume, hapa inawakilisha binadamu anayekufa; “mtu” ni ya kawaida na ya asili zaidi katika Kiswahili kuliko “mwanamume” katika kauli hii.
- source_word: הֲיִחְיֶה
  choice: je, ataishi tena?
  rationale: Kiulizi “je” kinaweka wazi swali la balagha. “Tena” haimo kama neno tofauti katika Kiebrania, lakini inadokezwa na mpangilio wa kufa kisha kuishi.
- source_word: כָּל יְמֵי צְבָאִי
  choice: Siku zote za utumishi wangu wa taabu
  rationale: צָבָא inaweza kumaanisha utumishi, kazi iliyopangiwa, au huduma ya kijeshi. “Utumishi ... wa taabu” huhifadhi wazo la kipindi kigumu alichopangiwa bila kulazimisha taswira ya vita.
- source_word: אֲיַחֵל
  choice: ningengoja
  rationale: Kitenzi kinaweza kuhusisha kungoja na kutumaini. Katika sentensi hii, kungoja mpaka tukio lifike ndilo wazo la mbele, huku hali ya masharti ikionyeshwa na “ninge-”.
- source_word: עַד בּוֹא חֲלִיפָתִי
  choice: mpaka badiliko langu lifike
  rationale: “Badiliko” linahifadhi upana wa חֲלִיפָה, ambalo linaweza kuelekeza kwenye mabadiliko, nafuu, au kufanywa upya, bila kuamua kwa uhakika aina ya tukio linalokusudiwa.
theological_decisions:
- issue: Ikiwa mstari huu unafundisha ufufuo waziwazi au unaacha swali kuhusu maisha baada ya kifo likiwa wazi
  choice: Kuhifadhi swali “ataishi tena?” na kutumia “badiliko langu”
  alternative: Kutafsiri kwa uwazi zaidi kuwa “ufufuo wangu” au “maisha yangu mapya,” au kuelekeza tu kwenye “nafuu yangu”
  rationale: Kiebrania kinaonyesha mvutano kati ya kifo, kungoja, na badiliko linalotarajiwa, lakini hakitoi hapa kauli ya moja kwa moja ya kimafundisho kuhusu ufufuo. Tafsiri inaruhusu tumaini hilo bila kulifanya kuwa hakika kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Utumishi wangu wa taabu” ni lugha inayoeleweka kwa urahisi huku ikihifadhi uzito wa maombolezo ya Ayubu; “badiliko langu” limeachwa pana kwa makusudi.
