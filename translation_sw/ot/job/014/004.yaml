  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: sw
  text: Ni nani awezaye kutoa kilicho safi kutoka katika kilicho najisi? Hakuna hata mmoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani anayeweza kutoa kilicho safi kutoka katika kilicho najisi? Hakuna hata mmoja.”
    reason: Mbadala huu hutumia muundo wa Kiswahili wa moja kwa moja zaidi kwa kitenzi cha swali, huku ukihifadhi maana ya chanzo katika מִטָּמֵא na msisitizo wa לֹא אֶחָד.
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha kwa namna ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: יִתֵּן
  choice: awezaye kutoa
  rationale: Ingawa kitenzi נתן kwa kawaida humaanisha ‘kutoa,’ hapa katika msemo huu kina wazo la kutokeza au kuleta kitu kutoka kingine; ‘awezaye kutoa’ huhifadhi swali na maana ya kutowezekana.
- source_word: טָהוֹר
  choice: kilicho safi
  rationale: Kivumishi kimetumika kama nomino. ‘Kilicho safi’ ni cha asili katika Kiswahili na huhifadhi utofautishaji wa usafi na unajisi bila kufafanua aina ya usafi.
- source_word: מִטָּמֵא
  choice: katika kilicho najisi
  rationale: Kiambishi מִן kinaonyesha chanzo, na טָמֵא kimetumika kama nomino. ‘Katika kilicho najisi’ huwasilisha maana ya kutoka ndani ya chanzo kilicho najisi kwa Kiswahili cha kawaida.
- source_word: לֹא אֶחָד
  choice: Hakuna hata mmoja
  rationale: Msemo huu ni jibu kamili la kukanusha kwa swali la balagha. ‘Hakuna hata mmoja’ ni wazi, wa asili, na huhifadhi msisitizo wa אֶחָד (‘mmoja’).
theological_decisions:
- issue: Kinachorejelewa na lugha ya usafi na unajisi
  choice: Kauli ya jumla kuhusu kutowezekana kwa kutoa kilicho safi katika kilicho najisi, ikitumika katika muktadha kwa hali ya mwanadamu.
  alternative: Kauli mahsusi kuhusu kuzaliwa na wazazi najisi, au methali pana kuhusu unajisi wa kimaadili na wa kiibada.
  rationale: Mstari wa Kiebrania ni mfupi na wa kimethali. Tafsiri haibainishi kama usafi na unajisi ni wa kiibada, kimaadili, wa kurithi, au wa hali ya kuwako, hivyo inadumisha utata na mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Najisi’ limetumiwa kwa kuwa linaweza kubeba maana ya kutokuwa safi kiibada au kimaadili bila kuilazimisha tafsiri kuwa ‘chafu’ kimwili tu.
