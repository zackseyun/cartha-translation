  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָ֭דָם יְל֣וּד אִשָּׁ֑ה קְצַ֥ר יָ֝מִ֗ים וּֽ/שְׂבַֽע רֹֽגֶז־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: sw
  text: Mwanadamu aliyezaliwa na mwanamke ana siku chache, naye amejaa taabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “misukosuko” au “mahangaiko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Mwanadamu
  rationale: Hapa nomino hii ni umoja wa kijumla unaowakilisha hali ya binadamu. “Mwanadamu” ni ya asili na yenye heshima katika Kiswahili, na haiwekei kauli hii maana ya wanaume pekee.
- source_word: יְלוּד אִשָּׁה
  choice: aliyezaliwa na mwanamke
  rationale: Huhifadhi muundo halisi unaosisitiza hali ya kawaida na udhaifu wa kila binadamu, huku ikiwa Kiswahili cha kawaida.
- source_word: קְצַר יָמִים
  choice: ana siku chache
  rationale: Huhifadhi taswira ya Kiebrania ya kuwa na siku chache na kueleza kwa kawaida ufupi wa maisha.
- source_word: וּשְׂבַע רֹגֶז
  choice: naye amejaa taabu
  rationale: “Amejaa” huwasilisha wazo la kushibishwa au kujazwa, na “taabu” linaweza kujumuisha shida za nje pamoja na hali ya msukosuko inayodokezwa na רֹגֶז.
theological_decisions:
- issue: Maana ya kijumla ya אָדָם
  choice: Mwanadamu
  alternative: Mtu; binadamu
  rationale: Mstari unaeleza ukweli wa kijumla kuhusu hali ya kila binadamu kwa kutumia umoja unaowakilisha wote. “Mwanadamu” huhifadhi umoja huo bila kuifanya kauli ihusu jinsia ya kiume pekee.
- issue: Upana wa maana ya רֹגֶז
  choice: taabu
  alternative: misukosuko; mahangaiko
  rationale: Neno la Kiebrania linaweza kumaanisha shida, fadhaa, au msukosuko. “Taabu” huhifadhi upana wa mateso ya maisha bila kuamua kimya-kimya kwamba yanahusu hali ya ndani au mazingira ya nje pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa msomaji wa kawaida. Muundo “ana siku chache” umechaguliwa ili kudumisha taswira ya Kiebrania bila kufanya sentensi kuwa ngumu.
