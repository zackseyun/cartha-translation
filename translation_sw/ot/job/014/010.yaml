base_translation:
  language: en
  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: sw
  text: Lakini mwanamume hufa na kudhoofika[a]; mwanadamu[c] hukata roho[b], naye yuko wapi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kuwa dhaifu” au “na kuishiwa nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Au “hutoa pumzi yake ya mwisho” au “hufa.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinatumia hapa maneno mawili tofauti, גבר (“mwanamume”) na אדם (“mwanadamu”), kwa mistari inayolingana, kikisisitiza kwamba wanadamu hufa.
    reason: cultural_note
lexical_decisions:
- source_word: גֶּבֶר
  choice: mwanamume
  rationale: Neno hili humaanisha mwanamume, wakati mwingine likiwa na dokezo la nguvu. Hapa “mwanamume” linahifadhi umoja wa kiume na linatofautishwa na אָדָם katika mstari unaofuatana nalo bila kuongeza maana ya “shujaa” au “mwenye nguvu.”
- source_word: יָמוּת
  choice: hufa
  rationale: Umbo hili linaeleza ukweli wa kawaida kuhusu hali ya binadamu, si tukio moja tu la wakati ujao; “hufa” linaonyesha vizuri maana hiyo ya jumla.
- source_word: וַיֶּחֱלָשׁ
  choice: kudhoofika
  rationale: Kitenzi חלש hueleza kuwa dhaifu au kupoteza nguvu. “Kudhoofika” kinabaki karibu na maana ya msingi na hakiongezi wazo lisilo wazi la kulazwa chini.
- source_word: וַיִּגְוַע
  choice: hukata roho
  rationale: Kitenzi גוע humaanisha kufa au kutoa pumzi ya mwisho. Nahau ya kawaida “hukata roho” inatofautisha usemi huu na “hufa” huku ikieleza kifo kwa uwazi.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Hapa neno hili ni la jumla kuhusu binadamu na linafanana kishairi na גֶּבֶר. “Mwanadamu” linahifadhi upeo huo wa kibinadamu na tofauti ya msamiati.
- source_word: וְאַיּוֹ
  choice: naye yuko wapi?
  rationale: Swali linauliza alipo mtu baada ya kufa. “Naye yuko wapi?” ni la moja kwa moja, linahifadhi kiunganishi, na haligeuzi swali kuwa dai kwamba hayupo kabisa.
theological_decisions:
- issue: Swali kuhusu hali au mahali pa mwanadamu baada ya kifo
  choice: naye yuko wapi?
  alternative: naye hayupo
  rationale: Kiebrania kina swali la makusudi. Tafsiri inahifadhi mvutano na utata huo badala ya kuamua kwamba mtu amekoma kuwapo au kufafanua mahali alipo baada ya kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na tofauti kati ya “mwanamume” na “mwanadamu” zimehifadhiwa. “Hukata roho” ni nahau inayoeleweka kwa urahisi; tanbihi inatoa usemi wa karibu zaidi na taswira ya pumzi.
