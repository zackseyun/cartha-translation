lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kina nguvu ya kutoa sababu au maelezo katika muktadha; “Kwa maana” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: עַתָּה
  choice: sasa
  rationale: Kielezi hiki cha wakati kinaonyesha hali ya sasa ikilinganishwa na hali ambayo Ayubu anaitamani.
- source_word: צְעָדַי
  choice: hatua zangu
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya taswira ya nyayo au hatua za mtu.
- source_word: תִּסְפּוֹר
  choice: unazihesabu
  rationale: Kitenzi ספר katika Qal humaanisha kuhesabu; umbo hili linadumisha taswira ya Mungu kuhesabu kila hatua.
- source_word: לֹא
  choice: hu-
  rationale: Katika kauli hii, “hu-” pamoja na kitenzi huwasilisha ukanushi wa hali ya sasa kwa Kiswahili fasaha.
- source_word: תִשְׁמוֹר עַל
  choice: hulichungi
  rationale: שׁמר pamoja na עַל inaweza kumaanisha kuchunga, kuangalia, au kuweka chini ya uangalizi. “Kulichunga” kinahifadhi wazo la kufuatilia kwa makini bila kulazimisha maana moja finyu.
- source_word: חַטָּאתִי
  choice: dhambi yangu
  rationale: Nomino hapa ni dhambi, si sadaka ya dhambi; umoja umehifadhiwa kwa kuwa unaweza kuwa wa jumla au wa kidhahania.
theological_decisions:
- issue: Maana ya kishazi kilichokanushwa לֹא תִשְׁמוֹר עַל חַטָּאתִי
  choice: 'Kauli ya wakati wa sasa: “hulichungi dhambi yangu.”'
  alternative: “hungeichunga dhambi yangu” au “huivizii dhambi yangu.”
  rationale: Kitenzi cha Kiebrania ni imperfecti rahisi iliyokanushwa na kwa kawaida hapa kinaweza kusomwa kama kauli ya sasa. Tafsiri haikibadilishi kuwa hali ya kudhania wala kuondoa mvutano wake na mistari ya karibu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira halisi ya kuhesabu hatua imehifadhiwa; pia utata wa kuchunga, kuangalia, au kuvizia dhambi umeonyeshwa katika tanbihi.
