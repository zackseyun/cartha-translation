  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: sw
  text: Hata hivyo, unafumbua macho yako juu ya mtu wa namna hii, na unanileta hukumuni pamoja nawe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele zako.” Kiebrania kinasema kihalisi “pamoja nawe,” jambo linaloweza kumaanisha kufikishwa mbele zako kwa hukumu au kuingia katika shauri la kisheria nawe.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: Hata hivyo
  rationale: Chembe hii ina nguvu ya kusisitiza na kupinga kwa mshangao malalamiko ya Ayubu baada ya kueleza udhaifu wa mwanadamu.
- source_word: עַל זֶה
  choice: juu ya mtu wa namna hii
  rationale: Kihalisi ni ‘juu ya huyu/hili’; muktadha wa mistari 1–2 unaonyesha kuwa inamrejelea mwanadamu dhaifu aliyeelezwa.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: unafumbua macho yako
  rationale: Huhifadhi taswira halisi ya Kiebrania ya kuelekeza macho au uchunguzi kwa mtu.
- source_word: וְאֹתִי
  choice: na kunileta
  rationale: Kiambishi cha nafsi ya kwanza kinadumisha mkazo wa Ayubu kwamba yeye mwenyewe ndiye anayeletwa.
- source_word: תָבִיא
  choice: kunileta
  rationale: Hifili ya בוא ina maana ya kuleta au kusababisha aje; ‘kuleta’ huhifadhi maana yake ya msingi bila kufasiri zaidi kuwa kuitwa mahakamani.
- source_word: בְמִשְׁפָּט
  choice: hukumuni
  rationale: Neno hili linaonyesha hukumu au shauri la kimahakama; ‘hukumuni’ ni Kiswahili cha kawaida kinachodumisha taswira ya kisheria.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: Hii ndiyo maana ya moja kwa moja ya kihusishi עם, na inadumisha mvutano wa kama Ayubu analetwa mbele za Mungu au kuingia naye katika shauri.
theological_decisions:
- issue: Uhusiano wa kisheria unaoonyeshwa na עִמָּךְ katika maneno ya Ayubu kwa Mungu
  choice: pamoja nawe
  alternative: mbele zako; dhidi yako
  rationale: Kiebrania kinasema kwa kawaida ‘pamoja nawe.’ Tafsiri hii haiondoi utata wa kama ni kufika mbele za Mungu kwa hukumu au kuwa katika shauri la kisheria naye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa sasa na wenye heshima. ‘Mtu wa namna hii’ huweka wazi rejeo kwa mwanadamu dhaifu bila kupanua maana kupita kiasi; ‘unafumbua macho yako’ huhifadhi taswira ya chanzo.
