translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. ‘Mti una tumaini’ huhifadhi uhuishaji wa taswira ya Kiebrania, na ‘chipukizi’ hutoa picha halisi ya uoto mpya.
