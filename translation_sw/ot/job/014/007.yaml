  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: sw
  text: 'Kwa maana mti una tumaini: ukikatwa, utachipua tena[a], na chipukizi lake[b] halitakoma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utabadilika upya.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kufanywa upya au kubadilika; katika muktadha wa mti, kinamaanisha kuchipua tena.
    reason: lexical_alternative
  - marker: b
    text: Au, “kimea chake” au “chipukizi chake kichanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya hoja iliyotangulia kwa nguvu ya kisababishi au ufafanuzi.
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: mti una tumaini
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi maana ya kuwepo kwa tumaini kwa mti unaotajwa kwa ujumla.
- source_word: אִם יִכָּרֵת
  choice: hata ukikatwa
  rationale: 'Ingawa אִם kwa msingi humaanisha ‘ikiwa,’ katika muktadha huu hali inayotajwa ina nguvu ya kukubali jambo: hata mti ukikatwa bado una tumaini. Tafsiri hii ni ya asili na huhifadhi mvutano wa kishairi.'
- source_word: וְעוֹד יַחֲלִיף
  choice: utachipua tena
  rationale: Katika taswira ya mti uliokatwa, חלף inaeleza kuota upya; ‘utachipua tena’ huwasilisha maana hiyo ya kibotania kwa uwazi.
- source_word: וְיֹנַקְתּוֹ
  choice: na chipukizi lake
  rationale: יֹנֶקֶת ni chipukizi changa linaloota kutoka kwenye mti; ‘chipukizi’ ni neno sahihi na linaloeleweka katika Kiswahili sanifu.
- source_word: לֹא תֶחְדָּל
  choice: halitakoma
  rationale: Huhifadhi maana ya kutokukoma au kutoshindwa kuendelea, pamoja na uzito wa kishairi wa Kiebrania.
