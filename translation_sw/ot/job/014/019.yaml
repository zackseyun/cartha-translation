  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: sw
  text: 'Maji huyachakaza mawe;


    wewe unasomba vitu vinavyoota kutoka mavumbini mwa nchi;


    ndivyo unavyoliangamiza tumaini la mwanadamu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָנִים
  choice: mawe
  rationale: Ni wingi wa nomino ya kawaida inayomaanisha mawe; inafaa katika taswira ya maji yanayomomonyoa.
- source_word: שָׁחֲקוּ
  choice: huyachakaza
  rationale: Kitenzi kinaonyesha kuchakaa au kumomonyolewa polepole. Kauli ya mazoea kwa kiambishi “hu-” inawasilisha ukweli wa jumla wa taswira hii.
- source_word: מַיִם
  choice: maji
  rationale: “Maji” ndiyo neno la kawaida la Kiswahili na kisarufi ni ya wingi, kama umbo la Kiebrania.
- source_word: תִּשְׁטֹף
  choice: huisomba
  rationale: Kitenzi kinaweza kumaanisha kusomba, kuosha na kuondoa, au kufurika. “Huisomba” linafaa kwa udongo unaoondolewa na mkondo wa maji.
- source_word: סְפִיחֶיהָ
  choice: mafuriko yake
  rationale: Neno hili adimu lina maana isiyo hakika. Katika muktadha wa mmomonyoko, “mafuriko yake” yanaeleza nguvu au mikondo ya maji inayosomba udongo; hali ya kutokuwa na uhakika imehifadhiwa katika tanbihi.
- source_word: עֲפַר אָרֶץ
  choice: udongo wa dunia
  rationale: Kwa halisi ni “mavumbi ya nchi/dunia.” Katika taswira ya mmomonyoko, “udongo” ni Kiswahili cha kawaida kwa tabaka laini la ardhi linalosombwa.
- source_word: וְתִקְוַת אֱנוֹשׁ
  choice: tumaini la mwanadamu
  rationale: אֱנוֹשׁ ni umoja wa kiwakilishi unaosisitiza mwanadamu aliye dhaifu na mwenye kufa. “Mwanadamu” huhifadhi umoja na humhusu mtu wa jinsi yoyote kwa kawaida katika Kiswahili.
- source_word: הֶאֱבַדְתָּ
  choice: unavyoliangamiza
  rationale: Hifili ya אבד humaanisha kusababisha kitu kipotee au kiangamie. Tafsiri hii ni ya moja kwa moja, na nafsi ya pili ya umoja huhifadhi Jobu akisema na Mungu.
theological_decisions:
- issue: Jobu anamwelekea Mungu moja kwa moja katika kishazi cha mwisho
  choice: ndivyo unavyoliangamiza tumaini la mwanadamu
  alternative: na tumaini la mwanadamu umeliangamiza
  rationale: Kitenzi cha nafsi ya pili ya kiume umoja kinaelekezwa kwa Mungu. “Ndivyo” linaonyesha ulinganisho unaodokezwa na picha za asili zilizotangulia bila kufuta uzito wa lawama ya Jobu.
- issue: Maana ya אֱנוֹשׁ
  choice: mwanadamu
  alternative: mtu mwenye kufa
  rationale: Neno la Kiebrania ni la umoja wa kiwakilishi na linadokeza udhaifu wa kibinadamu. “Mwanadamu” ni la asili, lenye hadhi, na huhifadhi umoja bila kuifanya aya imhusu mwanamume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa urahisi. Mistari mitatu imehifadhi usambamba wa picha mbili za mmomonyoko na hitimisho kuhusu tumaini la mwanadamu.
