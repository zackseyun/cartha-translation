  yaml_path: translation/ot/job/014/002.yaml
  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: sw
  text: Hujitokeza kama ua, kisha hunyauka[a]; hukimbia kama kivuli, wala hadumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukatwa”; kitenzi cha Kiebrania kinaweza kueleweka kuwa kunyauka au kufifia, au kuwa kukatwa, hasa katika taswira ya ua.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: Kama ua
  rationale: צִיץ humaanisha ua au chanua; “ua” ni neno la kawaida na la asili katika Kiswahili, nalo linadumisha taswira ya udhaifu wa maisha.
- source_word: יָצָא
  choice: huchanua
  rationale: Kitenzi hiki kimsingi ni “kutoka,” lakini kwa ua Kiswahili cha asili hutumia “kuchanua.” Hili linadumisha wazo la ua kujitokeza bila tafsiri nzito isiyo ya kawaida.
- source_word: וַיִּמָּל
  choice: na kunyauka
  rationale: Katika taswira ya ua, kitenzi kinaweza kueleweka kuwa kunyauka/kufifia; “kunyauka” ni wazi na cha kawaida. Maana nyingine ya kukatwa imehifadhiwa katika tanbihi.
- source_word: וַיִּבְרַח
  choice: hukimbia
  rationale: ברח ni kukimbia au kukimbia mbali. “Hukimbia” inadumisha nguvu ya picha ya maisha kupita upesi.
- source_word: כַּצֵּל
  choice: kama kivuli
  rationale: Ni ulinganisho wa moja kwa moja unaoonyesha hali ya kupita na kutodumu.
- source_word: וְלֹא יַעֲמוֹד
  choice: wala hakai
  rationale: עמד maana yake ya msingi ni kusimama, lakini hapa inaeleza kudumu au kubaki. “Hakai” ni ya asili, fupi, na inafaa kwa ushairi.
