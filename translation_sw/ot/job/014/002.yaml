  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Vitenzi vya mazoea (“huchanua,” “hukimbia”) vinaendeleza maelezo ya jumla kuhusu maisha ya mwanadamu kutoka muktadha, huku sentensi ikibaki fupi na yenye mlingano.
