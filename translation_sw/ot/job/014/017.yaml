base_translation:
  language: en
  yaml_path: translation/ot/job/014/017.yaml
  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: sw
  text: 'Uasi wangu umetiwa muhuri ndani ya mfuko,

    nawe unaifunika uovu wangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unabandika juu ya,” “unapaka juu ya,” au “unashonea” uovu wangu. Kitenzi cha Kiebrania hapa ni kigumu, na maana kamili ya taswira hii inajadiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: umetiwa muhuri
  rationale: 'Kauli tendwa yenye hali ya matokeo inadumishwa: uasi umefungwa na kuhifadhiwa kwa kutiwa muhuri.'
- source_word: בִּצְרוֹר
  choice: ndani ya mfuko
  rationale: צְרוֹר inaweza kumaanisha kifurushi, kibunda, au mfuko uliofungwa. “Mfuko” ni ya kawaida na inadumisha taswira halisi ya kitu kilichowekwa na kuhifadhiwa.
- source_word: פִּשְׁעִי
  choice: uasi wangu
  rationale: פֶּשַׁע huonyesha kosa zito au uasi. “Uasi” inadumisha uzito wake na kuitofautisha na עָוֹן katika mstari wa pili.
- source_word: וַתִּטְפֹּל
  choice: nawe unapaka
  rationale: Kitenzi טפל ni kigumu na kinaweza kuonyesha kupaka, kubandika, kufunika, au hata kufungia kwa kushona. “Unapaka” inadumisha taswira yake ya msingi bila kuamua kabisa kitu kinachopakwa; uwezekano mwingine umeelezwa katika tanbihi.
- source_word: עַל
  choice: juu ya
  rationale: Kihusishi hiki kinaonyesha kitu kinachowekwa au kupakwa juu ya kingine.
- source_word: עֲוֺנִי
  choice: uovu wangu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu itokanayo na hatia. “Uovu” inadumisha maana ya kimaadili na kutofautisha neno hili na פֶּשַׁע.
theological_decisions:
- issue: Maana ya taswira ya kuhifadhi na kupaka juu ya dhambi
  choice: Maneno yameachwa yaonyeshe Mungu akiweka uasi wa Ayubu kwa uangalifu na kuufunika au kuufungia kwa ajili ya kuuhesabu dhidi yake.
  alternative: Taswira inaweza kueleweka kuwa Mungu anaficha au anaondoa dhambi kwa kuisamehe.
  rationale: Katika muktadha wa maombolezo ya Ayubu, hasa mstari uliotangulia, Ayubu analalamika kwamba Mungu anaangalia makosa yake kwa makini. Kwa hiyo tafsiri haiongezi wazo la msamaha ambalo haliko wazi hapa, huku ikidumisha mvutano wa taswira yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari miwili unadumisha usambamba wa shairi la Kiebrania. Usemi “unapaka juu ya” umeachwa kwa makusudi ukiwa na ukali mdogo wa kisintaksia ili kutohitimisha maana ya kitenzi kigumu.
