lexical_decisions:
- source_word: אָזְלוּ
  choice: yanavyotoweka
  rationale: Kitenzi kina maana ya kuondoka, kupungua hadi kuisha, au kutoweka; katika tashbihi hii, “kutoweka” ni ya asili na inaeleweka wazi.
- source_word: מִנִּי יָם
  choice: baharini
  rationale: Kirai kihalisi ni ‘kutoka baharini’; katika Kiswahili, ‘maji yanavyotoweka baharini’ huhifadhi wazo la maji kuondoka au kuisha kutoka mahali yalipo bila kulazimisha ufafanuzi wa aina ya eneo la maji.
- source_word: נָהָר
  choice: mto
  rationale: Neno la kawaida la Kiswahili kwa mkondo wa maji; linafaa hapa bila kuamua ikiwa ni mto mkubwa au kijito.
- source_word: יֶחֱרַב
  choice: kukauka
  rationale: Hueleza kupoteza maji au kuwa ukiwa; “kukauka” ndiyo kauli ya kawaida kwa mto.
- source_word: וְיָבֵשׁ
  choice: na kuwa mkavu
  rationale: Huhifadhi kitenzi cha pili na msisitizo wa kishairi wa Kiebrania baada ya ‘kukauka,’ badala ya kukifuta kama marudio yasiyo ya lazima.
