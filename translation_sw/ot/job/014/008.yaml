lexical_decisions:
- source_word: אִם
  choice: Ingawa
  rationale: 'Katika mtiririko wa taswira ya mti, chembe hii inaeleweka kwa maana ya kukubali hali inayopingana na matokeo yanayofuata: hata mzizi na kisiki vikionekana kuwa vimekufa, bado kuna tumaini. Tanbihi inahifadhi uwezekano wa maana ya sharti.'
- source_word: יַזְקִין
  choice: huzeeka
  rationale: Huwasilisha hali ya kuendelea kuingia uzeeni kwa lugha ya kawaida na ya kishairi.
- source_word: בָּאָרֶץ
  choice: ardhini
  rationale: Katika taswira ya mimea, אָרֶץ humaanisha ardhi ambamo mzizi umo; ‘ardhini’ ni ya asili na inalingana vizuri na ‘mavumbini.’
- source_word: שָׁרְשׁוֹ
  choice: mzizi wake
  rationale: Inadumisha umoja wa kishairi wa Kiebrania, unaowakilisha mfumo wa mizizi wa mti.
- source_word: וּבֶעָפָר
  choice: na ... mavumbini
  rationale: ‘Mavumbi’ yanahifadhi picha ya עָפָר pamoja na mwangwi wake wa udhaifu na mauti, bila kuibadili kuwa udongo kwa ujumla.
- source_word: יָמוּת
  choice: hufa
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi מות na haiongezi wazo la kunyauka lisilotajwa wazi.
- source_word: גִּזְעוֹ
  choice: kisiki chake
  rationale: גֵּזַע hapa ni sehemu ya chini ya mti iliyobaki baada ya kukatwa; ‘kisiki’ ndiyo istilahi ya kawaida na inayofaa muktadha.
