review_pass:
  verdict: revise
  source_fidelity: The rendering preserves the adversative-emphatic opening, the mountain/rock parallelism, and the metaphorical use of יִבּוֹל. However, the conditional form “ukianguka” shifts the Hebrew participle (“falling”) toward a temporal condition (“when it falls”), and “mahali pake” should explicitly retain the preposition “from.”
  naturalness: “Mlima unaoanguka” is a natural Swahili relative construction for the participial image. “Hunyauka” is deliberately striking for a mountain, but is acceptable poetic Swahili and appropriately preserves the source metaphor. “Huondolewa kutoka mahali pake” is clearer and idiomatic.
  terminology: “Mlima” and “mwamba” are appropriate. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The phrase “mlima ukianguka” is conditional/temporal.
    rationale: It more naturally means “when a mountain falls,” whereas נוֹפֵל is a participle modifying or accompanying “mountain.” A relative participial expression better preserves the Hebrew image.
  - severity: low
    issue: The main text omits explicit “kutoka” with “mahali pake.”
    rationale: The Hebrew has מִן (“from”). Although “huondolewa mahali pake” may be understood correctly, “huondolewa kutoka mahali pake” is clearer and more formally complete.
