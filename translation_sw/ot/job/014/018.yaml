    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini hata
  rationale: Huonyesha badiliko lenye mkazo na upinzani; “Lakini hata” linatanguliza picha ya vitu vinavyoonekana kudumu lakini navyo hupotea.
- source_word: הַר נוֹפֵל
  choice: mlima ukianguka
  rationale: Nomino imetafsiriwa kwa maana yake ya kawaida, huku kishiriki נוֹפֵל kikionyesha hali au tukio la kuanguka kwa lugha ya kishairi iliyo ya asili katika Kiswahili.
- source_word: יִבּוֹל
  choice: hunyauka
  rationale: Kitenzi hiki kwa kawaida humaanisha kunyauka au kufifia. Maana hiyo ya msingi imehifadhiwa ingawa hapa imetumiwa kisitiari kuhusu mlima.
- source_word: וְצוּר
  choice: na mwamba
  rationale: “Mwamba” ni tafsiri pana na ya kawaida ya צוּר, na inalingana vizuri na “mlima” katika usambamba wa kishairi.
- source_word: יֶעְתַּק
  choice: huondolewa
  rationale: Huwasilisha maana ya kuhamishwa au kuondolewa bila kubainisha mtendaji, kama ilivyo katika muundo wa Kiebrania.
- source_word: מִמְּקֹמוֹ
  choice: mahali pake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki, ikihifadhi picha ya mwamba kung’olewa kutoka mahali ulipokuwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima na unaoeleweka. Wakati wa mazoea katika “hunyauka” na “huondolewa” unaipa sentensi tabia ya kauli ya jumla, huku taswira isiyo ya kawaida ya mlima kunyauka ikihifadhi sitiari ya chanzo.
