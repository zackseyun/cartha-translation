  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: sw
  text: Lakini hata mlima unaoanguka hunyauka[a], na mwamba huondolewa kutoka mahali pake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “humomonyoka” au “huharibika.” Kitenzi kwa kawaida humaanisha kunyauka au kufifia, lakini hapa kimetumiwa kisitiari kuhusu mlima.
