  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: sw
  text: Wewe ungeita, nami ningekujibu; ungeitamani[a] kazi ya mikono yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ungekuwa na hamu nayo.”
