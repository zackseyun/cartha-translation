lexical_decisions:
- source_word: תִּקְרָא
  choice: ungeita
  rationale: Kitenzi cha hali isiyotimilika kimefasiriwa kwa hali ya kutegemea ili kuendeleza tumaini la kinadharia la Ayubu katika muktadha huu, badala ya kukifanya kuwa ahadi ya wakati ujao.
- source_word: וְאָנֹכִי
  choice: nami
  rationale: Kiunganishi pamoja na kiwakilishi kilichosisitizwa huonyesha jibu la Ayubu kwa mwito wa Mungu; “nami” ni ya asili na huhifadhi ulinganifu huo.
- source_word: אֶעֱנֶךָּ
  choice: ningekujibu
  rationale: Hufasiri moja kwa moja maana ya ‘kukujibu’ huku hali ya kutegemea ikilingana na ‘ungeita.’
- source_word: לְמַעֲשֵׂה
  choice: kazi
  rationale: Neno linaweza kumaanisha kazi, tendo, au kitu kilichofanywa; hapa linamaanisha kile ambacho mikono ya Mungu imefanya.
- source_word: יָדֶיךָ
  choice: ya mikono yako
  rationale: Tafsiri hii huhifadhi taswira halisi ya Muumba na kazi ya mikono yake badala ya kuifupisha kuwa ‘kiumbe chako.’
- source_word: תִכְסֹף
  choice: ungeitamani
  rationale: Kitenzi huonyesha hamu kubwa au shauku. “Ungeitamani” ni Kiswahili cha kawaida kinachohifadhi nguvu ya hisia na hali ya tumaini la kinadharia.
theological_decisions:
- issue: Iwapo mstari uonyeshe tu kwamba Mungu angejali kiumbe chake au kwamba angekitamani kwa shauku
  choice: ungeitamani kazi ya mikono yako
  alternative: ungeijali kazi ya mikono yako
  rationale: Kitenzi כסף huonyesha kutamani au kuwa na shauku, si kuonyesha uangalifu tu. Tafsiri yenye nguvu zaidi huhifadhi mvutano wa tumaini la Ayubu kwamba Mungu angemwelekea tena kwa hamu badala ya kuendelea kumhukumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisharti ‘unge- ... ninge-’ unaendeleza hali ya tumaini katika muktadha, na taswira ya ‘kazi ya mikono yako’ imehifadhiwa. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
