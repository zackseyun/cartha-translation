review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the appeal that God withdraw attention from the human being and grant him respite. However, “Ondoa macho yako kwake” is not idiomatic for removal of one’s gaze from someone in Standard East African Swahili; it can sound as if the eyes are being directed toward him. The proposed wording states the requested withdrawal naturally while retaining the image of looking.
  naturalness: “Acha kumtazama” and “mfanyakazi wa ujira” are clear, natural contemporary Standard East African Swahili. “Mfanyakazi wa kuajiriwa” is understandable but unnecessarily cumbersome.
  terminology: “Nafuu” appropriately expresses the contextual force of וְיֶחְדָּל without claiming that the person ceases to exist. “Amalize siku yake” preserves one legitimate contextual sense of יִרְצֶה; the alternative sense of enjoying or being satisfied with the day remains in the footnote.
  issues:
  - severity: medium
    issue: The phrase “Ondoa macho yako kwake” is directionally awkward.
    rationale: With “kwake,” the expression can imply directing the eyes toward him rather than looking away from him. “Acha kumtazama” directly and idiomatically conveys withdrawal of attention.
  - severity: low
    issue: “Mfanyakazi wa kuajiriwa” is redundant and less idiomatic.
    rationale: A hired wage-worker is more naturally called “mfanyakazi wa ujira.”
  - severity: low
    issue: The footnote’s first alternative combines “akome” with an explanatory sense in a way that is less smooth than necessary.
    rationale: The note can state the literal cessation alternative and the contextual respite sense more clearly, while retaining the lexical ambiguity of חדל and רצה.
  revised_text: Acha kumtazama[a], ili apate nafuu, mpaka amalize siku yake kama mfanyakazi wa ujira.
  revised_footnotes:
  - marker: a
    text: Au, “Acha kumtazama, naye akome, mpaka aifurahie siku yake kama mfanyakazi wa ujira.” Kitenzi cha Kiebrania kinaweza kumaanisha kukoma au kupata nafuu; pia kinaweza kumaanisha kuifurahia au kuridhika na siku yake.
    reason: lexical_alternative
  revision_rationale: The revision corrects the gaze expression to idiomatic Swahili, improves the designation for a wage-worker, and refines the note to preserve the source’s lexical alternatives without overinterpreting them.
