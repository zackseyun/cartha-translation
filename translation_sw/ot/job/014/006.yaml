  yaml_path: translation/ot/job/014/006.yaml
  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: sw
  text: Acha kumtazama[a], ili apate nafuu, mpaka amalize siku yake kama mfanyakazi wa ujira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Acha kumtazama, naye akome, mpaka aifurahie siku yake kama mfanyakazi wa ujira.” Kitenzi cha Kiebrania kinaweza kumaanisha kukoma au kupata nafuu; pia kinaweza kumaanisha kuifurahia au kuridhika na siku yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה
  choice: Ondoa macho yako
  rationale: Ni amri ya kumtaka Mungu aondoe mtazamo au uangalizi wake; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: מֵעָלָיו
  choice: kwake
  rationale: Muundo huu unaonyesha kuondolewa kwa mtazamo au shinikizo kutoka kwa mtu anayezungumziwa.
- source_word: וְיֶחְדָּל
  choice: ili apate kupumzika
  rationale: Kitenzi חדל kimsingi ni ‘kukoma’; katika muktadha huu kinaeleza kupata nafuu au pumziko kutokana na uchunguzi na mateso.
- source_word: עַד
  choice: mpaka
  rationale: Ni kiashiria cha mpaka wa wakati wa pumziko linaloombwa.
- source_word: יִרְצֶה
  choice: amalize
  rationale: רצה inaweza kumaanisha kufurahia, kuridhika, au kukubali; pamoja na mfano wa mfanyakazi wa kuajiriwa, inaweza kueleza kufikia mwisho wa siku aliyopangiwa, huku uwezekano wa ‘kuifurahia’ ukihifadhiwa katika tanbihi.
- source_word: כְּשָׂכִיר
  choice: kama mfanyakazi wa kuajiriwa
  rationale: שָׂכִיר ni mfanyakazi anayefanya kazi kwa ujira; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: יוֹמוֹ
  choice: siku yake
  rationale: Ni tafsiri ya moja kwa moja; mfano wa mfanyakazi tayari unaonyesha kuwa ni siku yake ya kazi.
