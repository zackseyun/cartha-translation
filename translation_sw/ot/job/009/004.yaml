base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: sw
  text: Yeye ni mwenye hekima moyoni na mwenye nguvu kuu; ni nani aliyejifanya mgumu dhidi yake, akabaki salama?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafanikiwa”; au, “akatoka bila kudhurika.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoka katika jambo akiwa mzima au kwa amani.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: mwenye hekima moyoni
  rationale: Inahifadhi taswira ya Kiebrania ya moyo kama kitovu cha akili na nia, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וְאַמִּיץ כֹּחַ
  choice: na mwenye uweza mkuu
  rationale: Kirai hiki kinawakilisha msisitizo wa Kiebrania juu ya nguvu nyingi bila kuleta uradidi usio wa kawaida katika Kiswahili.
- source_word: מִי
  choice: ni nani
  rationale: Inatanguliza swali la balagha kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: הִקְשָׁה
  choice: aliyejifanya mgumu
  rationale: Inahifadhi wazo la mtu kujifanya mgumu au mkaidi, badala ya kulirahisisha kuwa upinzani wa kawaida tu.
- source_word: אֵלָיו
  choice: dhidi yake
  rationale: Katika nahau hii, kihusishi kinaonyesha upinzani wenye uhasama, si mwelekeo wa kawaida tu.
- source_word: וַיִּשְׁלָם
  choice: akabaki salama
  rationale: Kitenzi kinaweza kumaanisha kutoka katika jambo akiwa mzima, salama, au bila madhara; uchaguzi huu unafaa swali la balagha na ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Kiima kisichotajwa wazi mwanzoni mwa mstari
  choice: Yeye, ikirejelea Mungu kutokana na muktadha
  alternative: Kuacha kiima bila kutajwa
  rationale: Kiebrania hakitaji kiima wazi katika sifa za mwanzo, lakini muktadha wa maneno ya Ayubu unaonyesha kuwa ni Mungu. Kutumia “Yeye” kunakamilisha sentensi ya Kiswahili bila kuongeza dai jipya la kiteolojia.
- issue: Maana ya matokeo katika וַיִּשְׁלָם
  choice: akabaki salama
  alternative: akafanikiwa
  rationale: Maandishi yanaweza kueleza kufanikiwa au kutoka bila madhara. Tafsiri kuu inahifadhi wazo la kubaki mzima, huku tanbihi ikitaja uwezekano mwingine bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Taswira ya “hekima moyoni” na ugumu wa mtu dhidi ya Mungu zimehifadhiwa bila kuingiza msimamo wa dhehebu.
