lexical_decisions:
- source_word: אַף כִּי
  choice: Basi, ... ningewezaje
  rationale: 'Katika muktadha huu, usemi huu una nguvu ya hoja ya kutowezekana zaidi: ikiwa hakuna anayeweza kumpinga Mungu, Ayubu mwenyewe angewezaje kumjibu? Kiswahili hiki kinatoa swali la balagha kwa njia ya kawaida bila kupunguza nguvu yake.'
- source_word: אָנֹכִי
  choice: mimi
  rationale: Kiwakilishi huru cha nafsi ya kwanza kina mkazo; ‘mimi’ kinauhifadhi kwa njia ya asili katika Kiswahili.
- source_word: אֶעֱנֶנּוּ
  choice: ningewezaje kumjibu
  rationale: Kitenzi ענה hapa ni ‘jibu’ au ‘itikia.’ Muundo wa uwezekano katika swali la balagha unaonyesha kutoweza kwa Ayubu.
- source_word: אֶבְחֲרָה
  choice: kuchagua
  rationale: Huhifadhi maana ya kawaida ya בחר, yaani kuchagua kwa uangalifu.
- source_word: דְבָרַי
  choice: maneno yangu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi taswira ya Ayubu kuchagua atakayosema; ‘hoja zangu’ ni uwezekano unaotegemea zaidi muktadha wa shauri.
- source_word: עִמּוֹ
  choice: mbele yake
  rationale: Ingawa עם kwa msingi ni ‘pamoja na,’ katika mazingira haya ya kujitetea kwa Mungu, ‘mbele yake’ ni Kiswahili cha asili na hakilazimishi maana ya uhasama. Maana ya moja kwa moja ‘naye’ na ya kimabishano ‘dhidi yake’ zimeonyeshwa katika tanbihi.
