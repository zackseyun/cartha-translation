translation:
  language: sw
  text: atendaye mambo makuu yasiyochunguzika[a], na maajabu yasiyohesabika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yasiyoweza kuchunguzwa kikamilifu.” Nahau ya Kiebrania ina maana kwamba mambo yake makuu hayawezi kuchunguzwa au kufahamika mpaka mwisho.
    reason: lexical_alternative
  - marker: b
    text: Au, “yasiyo na idadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: atendaye
  rationale: Kitenzi kishirikishi cha Qal kinamfafanua Mungu aliyetajwa katika muktadha uliotangulia; “atendaye” huendeleza sentensi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: גְדֹלוֹת
  choice: mambo makuu
  rationale: Kivumishi cha wingi kimetumiwa kama nomino. “Mambo makuu” huhifadhi upana wake bila kuyafinya kuwa matendo ya aina fulani tu.
- source_word: עַד אֵין חֵקֶר
  choice: yasiyochunguzika
  rationale: Nahau inaonyesha kwamba mambo hayo hayawezi kuchunguzwa kikamilifu au kufahamika mpaka mwisho. Chaguo hili ni fupi, la asili, na linafaa katika usambamba wa kishairi.
- source_word: וְנִפְלָאוֹת
  choice: na maajabu
  rationale: “Maajabu” hueleza mambo au matendo ya ajabu yanayoamsha mshangao, bila kuongeza ufafanuzi usio katika Kiebrania.
- source_word: עַד אֵין מִסְפָּר
  choice: yasiyohesabika
  rationale: Kirai hiki kinamaanisha kwamba maajabu hayo hayana idadi inayoweza kuhesabiwa. “Yasiyohesabika” ni Kiswahili cha kawaida na huhifadhi usambamba na “yasiyochunguzika.”
