  text: Hakika, ninajua kwamba ndivyo ilivyo; lakini mwanadamu anawezaje kuwa mwenye haki mbele za Mungu?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anawezaje kuwa upande wa haki mbele za Mungu?”
    reason: lexical_alternative
  - marker: b
    text: “Mwanadamu” hapa hutafsiri neno la Kiebrania ʼenosh, linaloweza kumaanisha binadamu aliye dhaifu na wa kufa; pia linaweza kutafsiriwa “mwanadamu wa kufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: Hakika
  rationale: Neno hili linaanzisha ukubali wa Ayubu kwa msisitizo; “Hakika” ni la kawaida, lenye hadhi, na huhifadhi nguvu ya uthibitisho.
- source_word: יָדַעְתִּי
  choice: ninajua
  rationale: Kauli timilifu ya Kiebrania inaeleza ufahamu uliothibitika; wakati wa sasa wa Kiswahili huwasilisha vizuri hali hiyo.
- source_word: כִי כֵן
  choice: kwamba ndivyo ilivyo
  rationale: Kirai hiki kinathibitisha jambo lililotangulia kwa namna ya asili katika Kiswahili.
- source_word: וּמַה
  choice: lakini ... anawezaje
  rationale: Kiunganishi pamoja na neno la kuuliza kinaanzisha ugeuko wa hoja kutoka ukubali hadi swali lenye changamoto; “lakini ... anawezaje” huonyesha utofauti huo.
- source_word: יִצְדַּק
  choice: kuwa mwenye haki
  rationale: Huhifadhi maana ya msingi ya kuwa na haki au kuonekana kuwa upande wa haki bila kuingiza kimya kimya mfumo wa kiteolojia wa baadaye.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Nomino hiyo humaanisha binadamu dhaifu na anayeweza kufa; “mwanadamu” ni ya uwakilishi, ya kawaida, na haiibani maana kwa jinsia ya kiume pekee.
- source_word: עִם אֵל
  choice: mbele za Mungu
  rationale: Ingawa muundo wake wa karibu ni “pamoja na Mungu,” katika muktadha huu unaeleza msimamo wa mwanadamu katika uhusiano au kesi yake mbele za Mungu.
theological_decisions:
- issue: Dhana ya kimahakama ya haki ya mwanadamu katika uhusiano na Mungu
  choice: kuwa mwenye haki mbele za Mungu
  alternative: kuhesabiwa haki kwa Mungu; kuwa upande wa haki mbele za Mungu
  rationale: Kitenzi kinaweza kuwa na ladha ya kimahakama, lakini mstari haufafanui utaratibu wa baadaye wa kiteolojia wa kuhesabiwa haki. Tafsiri hii huhifadhi swali na mvutano wa kifungu bila kuutatua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa swali ni wa kawaida kwa wasomaji wa leo, huku “mbele za Mungu” ikihifadhi muktadha wa kiuhusiano na wa kimahakama. Alama zote za tanbihi zimewekwa katika matini kuu.
