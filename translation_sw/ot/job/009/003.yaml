  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: sw
  text: Kama mtu akitaka kushindana naye katika hoja[a], hataweza kumjibu hata mara moja kati ya elfu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kubishana naye” au “kuendesha shauri dhidi yake.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya mzozo wa kisheria.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “asingemjibu moja katika elfu”; maana yake ni kwamba hangeweza kumjibu hata mara moja kati ya elfu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Hutanguliza sharti la kudhaniwa; “kama” ni la kawaida na wazi katika Kiswahili.
- source_word: יַחְפֹּץ
  choice: akitaka
  rationale: Kitenzi חפץ hapa huonyesha kutaka au kuwa tayari, si lazima kufurahia.
- source_word: לָרִיב
  choice: kushindana naye katika hoja
  rationale: ריב huweza kumaanisha kubishana au kuendesha shauri. Kauli hii inahifadhi upinzani na ladha ya kutoa hoja bila kutumia istilahi ngumu mno ya kisheria.
- source_word: עִמּוֹ
  choice: naye
  rationale: Huwakilisha kihalisi maana ya “pamoja naye,” huku muktadha wa kushindana ukionyesha upinzani.
- source_word: לֹא יַעֲנֶנּוּ
  choice: hataweza kumjibu
  rationale: ענה ni kujibu; katika muktadha, kauli hasi inaeleweka kama kutoweza kutoa jibu, badala ya kukataa kujibu.
- source_word: אַחַת מִנִּי אָלֶף
  choice: hata mara moja katika elfu
  rationale: Huhifadhi tamathali ya kutoweza kujibu hata jibu moja kati ya nafasi au hoja elfu, kwa Kiswahili cha asili.
theological_decisions:
- issue: Warejelewa wa viwakilishi
  choice: Mtu ndiye anayetaka kushindana na Mungu, lakini jina “Mungu” halijaingizwa katika matini.
  alternative: Kuifanya sentensi ihusu watu wawili kwa ujumla, au kutaja Mungu waziwazi.
  rationale: Muktadha wa Ayubu 9:2–4 unaonyesha kuwa anayerejelewa ni Mungu. Hata hivyo, Kiebrania kinatumia viwakilishi, kwa hiyo tafsiri inavihifadhi ili kutoondoa udhahiri wa kimuktadha kwa kuongeza jina lisilomo katika mstari.
- issue: Nguvu ya לֹא יַעֲנֶנּוּ
  choice: Kutoweza kujibu
  alternative: Kutokubali au kutotaka kujibu
  rationale: Katika pambano la hoja na Mungu, wazo kuu ni udhaifu wa mwanadamu asiyeweza kutoa jibu linalotosha; si kukataa kwake tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kushindana naye katika hoja” ni rahisi kueleweka na bado huhifadhi hisia ya mabishano yenye sura ya shauri. Viwakilishi vimeachwa bila kubadilishwa kuwa “Mungu” ili kufuata muundo wa Kiebrania.
