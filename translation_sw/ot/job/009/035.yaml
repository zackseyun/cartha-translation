translation:
  language: sw
  text: Ndipo ningesema bila kumwogopa[a], kwa maana sivyo ilivyo kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndipo ningesema, wala nisingemwogopa.” Kishazi cha mwisho kinaweza kutafsiriwa, “kwa maana mambo hayako hivyo kwangu.” Kihalisi zaidi, muundo wa Kiebrania unasema, “kwa maana si hivyo mimi pamoja nami”; ni wa mkato na maana yake haijaelezwa kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: Ndipo ningesema
  rationale: Umbo la nafsi ya kwanza linaonyesha azimio au tendo la kinadharia linalotegemea hali inayotajwa katika muktadha uliotangulia; “Ndipo ningesema” huonyesha utegemezi huo kwa Kiswahili cha kawaida.
- source_word: וְלֹא אִירָאֶנּוּ
  choice: bila kumwogopa
  rationale: Kitenzi ירא pamoja na kiambishi cha nafsi ya tatu umoja wa kiume humrejelea Mungu katika muktadha. “Bila kumwogopa” ni njia ya asili ya kuunganisha negationi na tendo la kusema.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya kauli iliyotangulia.
- source_word: לֹא כֵן
  choice: mambo hayako hivyo
  rationale: Kirai hiki ni kifupi na kimeachwa na maana isiyotajwa wazi. Tafsiri hii ni ya kawaida kwa Kiswahili na inadumisha wazo la hali kutokuwa hivyo bila kulazimisha ufafanuzi mmoja.
- source_word: אָנֹכִי עִמָּדִי
  choice: kwangu
  rationale: Kihalisi muundo huu una jambo kama “mimi pamoja nami,” lakini ni wa kujirejelea na wenye utata. “Kwangu” hudumisha maana ya hali ilivyo kwa Ayubu bila kuingiza dai la kisaikolojia lisilo wazi katika Kiebrania.
theological_decisions:
- issue: Maana ya kishazi cha mwisho kilichoachwa kifupi
  choice: kwa maana mambo hayako hivyo kwangu
  alternative: kwa maana mimi siko hivyo ndani yangu; kwa maana sivyo ilivyo kwangu
  rationale: Kiebrania לֹא כֵן אָנֹכִי עִמָּדִי ni kifupi na chenye utata. Tafsiri kuu inasikika kwa kawaida lakini haibainishi kupita kiasi kama Ayubu anazungumzia hali yake ya ndani, mazingira yake ya sasa, au msimamo wake mbele za Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mambo hayako hivyo kwangu” ni rahisi kueleweka huku tanbihi ikihifadhi ufupi na utata halisi wa Kiebrania.
