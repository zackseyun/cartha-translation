  text: אִם אֶ֭צְדָּק פִּ֣/י יַרְשִׁיעֵ֑/נִי תָּֽם אָ֝֗נִי וַֽ/יַּעְקְשֵֽׁ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: sw
  text: Kama ningekuwa na haki, kinywa changu chenyewe kingenihukumu kuwa na hatia; hata nikiwa bila lawama, kingenithibitisha kuwa mpotovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata nikiwa bila lawama, yeye angenithibitisha kuwa mpotovu,” ikiwa Mungu anaeleweka kuwa kiima kinachodokezwa katika kipashio cha pili.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Huanzisha sharti; maana ya kukubali jambo kinyume na hali inayotarajiwa inajitokeza katika mstari mzima.
- source_word: אֶצְדָּק
  choice: ningekuwa na haki
  rationale: Qal ya צדק hapa ina maana ya kuwa upande wa haki katika muktadha wa hukumu, si kujihesabia haki.
- source_word: פִּי
  choice: kinywa changu chenyewe
  rationale: Maana halisi ni ‘kinywa changu’; ‘chenyewe’ inasisitiza kejeli kwamba maneno ya Ayubu mwenyewe yangemgeukia.
- source_word: יַרְשִׁיעֵנִי
  choice: kingenihukumu kuwa na hatia
  rationale: Hiphil ya רשע katika muktadha wa kimahakama humaanisha kutangaza mtu kuwa na hatia au kumhukumu.
- source_word: תָּם
  choice: bila lawama
  rationale: Katika Ayubu neno hili huonyesha uadilifu au ukamilifu wa mwenendo, bila kudai kutokuwa na dhambi kabisa.
- source_word: וַיַּעְקְשֵׁנִי
  choice: kingenithibitisha kuwa mpotovu
  rationale: Mzizi עקשׁ una wazo la kuwa kombo au mpotovu. Tafsiri hii inahifadhi mwelekeo wa kimahakama bila kudokeza kwamba kinywa kingebadili tabia yake kihalisia.
theological_decisions:
- issue: Kiima cha וַיַּעְקְשֵׁנִי
  choice: Kiima kinaendelezwa kutoka ‘kinywa changu’ (‘kingenithibitisha kuwa mpotovu’).
  alternative: Mungu ndiye kiima kinachodokezwa (‘angenithibitisha/angenifanya kuwa mpotovu’).
  rationale: Usambamba wa vipashio viwili unaunga mkono kuendelea kwa kiima kilekile, ‘kinywa changu.’ Hata hivyo, Kiebrania hakitaji kiima wazi katika kipashio cha pili, kwa hiyo uwezekano wa kumwelewa Mungu kuwa kiima umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Lugha ya kimahakama imehifadhiwa kwa ‘haki,’ ‘hukumu,’ ‘hatia,’ na ‘thibitisha’; ‘mpotovu’ inadumisha taswira ya kitu kilicho kombo bila kutumia lugha ya dhehebu fulani.
