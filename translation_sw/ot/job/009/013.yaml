  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: sw
  text: Mungu haiondoi hasira yake; chini yake wasaidizi wa Rahabu walijikunyata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahabu hapa si yule mwanamke wa Yeriko; huenda ni jina la kishairi la nguvu ya machafuko inayowakilishwa kama jitu la baharini.
    reason: Huzuia kuchanganywa na Rahabu wa Yoshua, huku ikihifadhi kutokuwa wazi kwa utambulisho wa Rahabu katika mstari huu.
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Jina la kawaida na lenye hadhi la Mungu, linalolingana moja kwa moja na neno la Kiebrania.
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: haugeuzi hasira yake
  rationale: Yāšîḇ hapa ni ‘kugeuza/kurudisha,’ na ’appô katika muktadha huu ni hasira yake; kauli inadumisha uthabiti wa tendo la Mungu bila kuongeza maelezo.
- source_word: תחתו
  choice: chini yake
  rationale: Tafsiri ya moja kwa moja inayoweza kuonyesha kutiishwa chini ya mamlaka yake.
- source_word: שָׁחֲחוּ
  choice: walijikunyata
  rationale: Kitenzi kinaonyesha kushushwa au kuinama kwa hali ya kutiishwa; ‘walijikunyata’ huhifadhi taswira kali kuliko ‘waliinama’ pekee.
- source_word: עֹזְרֵי רָהַב
  choice: wasaidizi wa Rahabu
  rationale: Rahabu limehifadhiwa kama jina la kiumbe au nguvu ya machafuko ya kale badala ya kutafsiriwa kwa maana ya kawaida kama kiburi; muundo wa wingi ‘wasaidizi’ unafuata Kiebrania.
theological_decisions:
- issue: Utambulisho wa Rahabu
  choice: Rahabu limeachwa kama jina maalumu
  alternative: ‘kiburi’ au ‘joka la bahari’
  rationale: Katika muktadha huu Rahabu huenda ni taswira ya nguvu ya machafuko, lakini mstari wenyewe hautambulishi kwa uwazi; kutunza jina kunahifadhi utata wa matini.
- issue: Wakati wa kitenzi שָׁחֲחוּ
  choice: 'wakati uliopita: ‘walijikunyata’'
  alternative: 'wakati wa sasa: ‘wanajikunyata’'
  rationale: Umbo la Kiebrania ni timilifu, hivyo wakati uliopita unaakisi umbo hilo, ingawa sentensi inaweza kueleza ukweli wa jumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umewekwa kwa urahisi wa kusomeka, huku taswira ya kishairi na utata wa Rahabu vikihifadhiwa.
