  variant: Standard East African Swahili
source:
  edition: WLC
  text: לֹ֣א יֵשׁ בֵּינֵ֣י/נוּ מוֹכִ֑יחַ יָשֵׁ֖ת יָד֣/וֹ עַל שְׁנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: sw
  text: Hakuna mwamuzi kati yetu[a] ambaye angeweka mkono wake juu yetu sote wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpatanishi.” Neno la Kiebrania linaweza kumaanisha mtu anayeamua shauri au kuingilia kati ya pande mbili zinazobishana.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: Hakuna
  rationale: Muundo wa Kiebrania unaokanusha kuwapo kwa mtu umetafsiriwa kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: בֵּינֵינוּ
  choice: kati yetu
  rationale: Kirai hiki kinaonyesha nafasi au uhusiano wa mtu wa tatu kati ya pande mbili zinazobishana.
- source_word: מוֹכִיחַ
  choice: mwamuzi
  rationale: Katika muktadha huu wa kisheria, neno linamaanisha mtu anayesikiliza na kuamua shauri kati ya pande mbili; ‘mwamuzi’ huhifadhi maana hiyo bila kuingiza dai la kitheolojia lisilo wazi katika mstari.
- source_word: יָשֵׁת
  choice: angeweka
  rationale: Huwasilisha tendo la kinadharia ambalo mwamuzi huyo asiyekuwapo angefanya.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Taswira halisi ya mkono imehifadhiwa badala ya kufasiriwa moja kwa moja kuwa mamlaka au nguvu.
- source_word: עַל שְׁנֵינוּ
  choice: juu yetu sote wawili
  rationale: Hueleza kuwa mwamuzi angehusiana kwa usawa na pande zote mbili, yaani Ayubu na Mungu.
theological_decisions:
- issue: Iwapo מוֹכִיחַ litafsiriwe kwa neno lenye dokezo la moja kwa moja la kitheolojia kama ‘mpatanishi’
  choice: mwamuzi
  alternative: mpatanishi
  rationale: Muktadha wa karibu ni malalamiko ya Ayubu kwamba hakuna mtu wa tatu wa kuamua shauri kati yake na Mungu. ‘Mwamuzi’ huhifadhi uzito wa kisheria; ‘mpatanishi’ ni uwezekano halali wa kileksia lakini unaweza kusikika kana kwamba mstari tayari unafafanua jukumu pana zaidi la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Juu yetu sote wawili’ huhifadhi taswira halisi ya mkono unaowafikia pande zote mbili.
