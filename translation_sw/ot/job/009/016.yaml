  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: sw
  text: Hata kama ningemwita, naye akanijibu,[a] singeamini kwamba alikuwa akiisikiliza sauti yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hata kama ningemlilia, naye akanijibu, singeamini kwamba alikuwa akiisikiliza sauti yangu kwa makini.”
    reason: Njia nyingine halali ya kutafsiri קרא kuwa ‘kulilia’ na אזן kuwa ‘kusikiliza kwa makini’.
lexical_decisions:
- source_word: אִם
  choice: Hata kama
  rationale: Katika muktadha huu neno linaanzisha hali ya kudhani yenye hisia ya kukubali jambo lisilotarajiwa; ‘hata kama’ huwasilisha vizuri mvutano huo bila kulifanya kuwa kauli ya wakati.
- source_word: קָרָאתִי
  choice: ningemwita
  rationale: קרא humaanisha kuita au kulia kwa sauti. ‘Ningemwita’ ni ya kawaida na pana, huku kiambishi cha yambwa kikimrejelea Mungu kutokana na muktadha.
- source_word: וַיַּעֲנֵנִי
  choice: naye akanijibu
  rationale: ענה hapa ni kujibu. Muundo huu ni wa asili katika Kiswahili na unaendeleza hali ya kudhani iliyoanzishwa na ‘hata kama’.
- source_word: לֹא אַאֲמִין
  choice: singeamini
  rationale: Katika sentensi hii ya sharti, hali ya kutotimilika ina nguvu ya kudhani; ‘singeamini’ huiwasilisha moja kwa moja.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי hapa linaanzisha maudhui ya kile ambacho Ayubu hangeamini, si sababu.
- source_word: יַאֲזִין
  choice: alikuwa akiisikiliza
  rationale: אוזן huonyesha kutega sikio au kusikiliza kwa makini. ‘Alikuwa akiisikiliza’ huhifadhi wazo la usikivu wenye makusudi na hufuata kwa kawaida baada ya ‘singeamini kwamba’.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: Hili ndilo neno la moja kwa moja kwa קוֹלִי, bila kulifasiri zaidi kuwa ombi au maneno yangu.
theological_decisions:
- issue: Kauli ya Ayubu kuhusu jibu la Mungu
  choice: Kauli imetafsiriwa kama kutokuamini kwa Ayubu kwamba Mungu alikuwa akiisikiliza sauti yake kwa kweli, hata kama angemjibu.
  alternative: Kuitafsiri kama kukana kabisa kwamba Mungu husikiliza, au kama mshangao tu.
  rationale: Kiebrania kinaonyesha hali ya kudhani na kutokuamini kwa Ayubu binafsi, si fundisho la jumla kwamba Mungu kamwe hasikii maombi. Tafsiri inadumisha mvutano huo bila kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hata kama ... singe-’ ni muundo wa kawaida wa hali ya kudhani; ‘akiisikiliza sauti yangu’ huhifadhi usemi wa Kiebrania bila kuufanya mzito kupita kiasi.
