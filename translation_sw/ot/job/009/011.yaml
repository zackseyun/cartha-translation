  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: sw
  text: Tazama[a], anapita kando yangu, na simwoni; anaendelea mbele[b], na simtambui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hakika.”
    reason: lexical_alternative
  - marker: b
    text: Au “anapita na kuendelea.”
    reason: lexical_alternative
  - marker: c
    text: Au “simwelewi”; neno la Kiebrania linaweza kumaanisha kutambua, kufahamu, au kuelewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili linaanzisha kauli yenye msisitizo na uhai. “Tazama” ni la kawaida katika lugha ya Biblia na linaeleweka katika Kiswahili cha sasa.
- source_word: יַעֲבֹר עָלַי
  choice: anapita karibu nami
  rationale: Muungano wa עבר na עָלַי unaonyesha kupita kwa uhusiano wa karibu na msemaji. “Karibu nami” huepuka kudokeza kukanyagwa au kupita juu kimwili, huku ukihifadhi wazo la uwepo usiotambulika.
- source_word: וְלֹא אֶרְאֶה
  choice: lakini simwoni
  rationale: Hili ni tafsiri ya moja kwa moja ya kitenzi ראה kilichokanushwa; haliongezi wazo la kutoweza ambalo halijasemwa wazi.
- source_word: וְיַחֲלֹף
  choice: anapita mbele
  rationale: חלף hudokeza kupita na kuendelea. “Anapita mbele” hutofautisha kidogo kitenzi hiki na cha kwanza na kuhifadhi mwendo unaoendelea.
- source_word: וְלֹא אָבִין לוֹ
  choice: lakini simtambui
  rationale: בין inaweza kumaanisha kutambua, kufahamu, au kuelewa. Katika muktadha wa kutomwona Mungu anapopita, “simtambui” huunganisha utambuzi wa kiakili na wa kimazingira bila kufunga maana kwa ‘kumwona’ tu.
theological_decisions:
- issue: Rejeo la mtenda na viwakilishi vya nafsi ya tatu
  choice: Mtenda na kiwakilishi vinamrejelea Mungu bila kutaja jina lake katika mstari huu.
  alternative: Kuelewa mtenda kuwa mtu au kiumbe fulani asiyeainishwa.
  rationale: Muktadha wa karibu wa Ayubu 9:10–12 unaeleza matendo ya Mungu yasiyochunguzika. Kiswahili cha kitenzi na kiwakilishi cha yambwa kinadumisha rejeo hilo la kibinafsi bila kuongeza cheo cha Mungu ambacho hakipo katika mstari.
- issue: Maana ya אָבִין לוֹ
  choice: simtambui
  alternative: simwelewi
  rationale: Kiebrania kinaweza kueleza utambuzi au uelewa. Muktadha wa kupita bila kuonekana unaunga mkono “simtambui,” huku tanbihi ikihifadhi uwezekano wa “simwelewi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wenye vipashio viwili sambamba umehifadhiwa; “lakini” huonyesha tofauti kati ya kupita kwake na kutotambuliwa kwake.
