  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: sw
  text: Mimi nitahukumiwa kuwa na hatia[a]; kwa nini basi nijitaabishe bure?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitakuwa mwovu.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kimaadili (“kuwa mwovu”) au ya kimahakama (“kuhukumiwa kuwa na hatia”).
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: nita- (nafsi ya kwanza katika kitenzi)
  rationale: Kiwakilishi huru cha nafsi ya kwanza kinasisitiza mhusika. Kiswahili huonyesha nafsi katika kitenzi; muktadha tayari unaweka msisitizo kwa Ayubu, hivyo 'mimi' si lazima kuongezwa.
- source_word: אֶרְשָׁע
  choice: nitahukumiwa kuwa na hatia
  rationale: Qal ya רשע inaweza kumaanisha kuwa mwovu au, katika muktadha wa kimahakama, kutangazwa kuwa na hatia. Hoja ya Ayubu kuhusu kutoweza kuthibitisha kutokuwa na hatia mbele za Mungu inaunga mkono maana ya kimahakama, huku tanbihi ikihifadhi maana ya kimaadili.
- source_word: לָמָה זֶּה
  choice: basi kwa nini
  rationale: Muundo huu wa kiidioma unauliza 'kwa nini basi?' Neno 'basi' linaonyesha hitimisho linalotokana na kauli iliyotangulia.
- source_word: הֶבֶל
  choice: bure
  rationale: Hapa הבל huonyesha ubatili au kutokuwa na matokeo kwa jitihada; 'bure' ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: אִיגָע
  choice: nijitaabishe
  rationale: Kitenzi יגע huhusu kufanya kazi kwa taabu au kujichosha. 'Nijitaabishe' huhifadhi wazo la jitihada yenye kuchosha ndani ya swali la balagha.
theological_decisions:
- issue: Maana ya kimahakama dhidi ya maana ya kimaadili ya רשע
  choice: Nitahukumiwa kuwa na hatia
  alternative: Nitakuwa mwovu
  rationale: Muktadha wa Ayubu 9:28–31 unahusu Ayubu kuhesabiwa au kutendewa kama mwenye hatia licha ya juhudi zake za kujisafisha. Tafsiri ya kimahakama inafaa zaidi, lakini tanbihi inahifadhi uwezekano halisi wa maana ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Nijitaabishe bure' ni ya asili na inaonyesha jitihada zinazochosha na zisizo na matokeo; alama ya tanbihi imewekwa mara baada ya kirai kinachohusika.
