id: JOB.9.23
reference: Job 9:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִם שׁ֭וֹט יָמִ֣ית פִּתְאֹ֑ם לְ/מַסַּ֖ת נְקִיִּ֣ם יִלְעָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: sw
  text: Ikiwa pigo linaua ghafula, yeye huyadhihaki maafa ya watu wasio na hatia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huyacheka majaribu ya watu wasio na hatia,” au “hudhihaki kuporomoka kwa watu wasio na hatia.” Nomino ya Kiebrania inaweza kumaanisha kujaribiwa au kuporomoka/kukata tamaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Huhifadhi kwa uwazi hali ya sharti au dhana inayoletwa na chembe ya Kiebrania bila kuibadili kuwa kauli ya wakati.
- source_word: שׁוֹט
  choice: pigo
  rationale: Neno la Kiebrania humaanisha mjeledi au kiboko na pia kwa njia ya sitiari janga linalofagia. “Pigo” ni la kawaida katika Kiswahili na linaweza kubeba maana ya tendo la kupiga pamoja na maafa makali.
- source_word: יָמִית
  choice: linaua
  rationale: Hifili ya מות humaanisha kusababisha kifo; “linaua” ni tafsiri ya moja kwa moja na ya kisasa.
- source_word: פִּתְאֹם
  choice: ghafula
  rationale: Hutoa maana ya kawaida ya jambo kutokea bila kutarajiwa au mara moja.
- source_word: לְמַסַּת
  choice: maafa
  rationale: Nomino hii adimu inaweza kuelekea kwenye kujaribiwa, kuyeyuka, kuporomoka au kukata tamaa. “Maafa” yanaeleza hali mbaya inayowapata wasio na hatia bila kuifanya kwa lazima kuwa hisia yao ya ndani.
- source_word: נְקִיִּם
  choice: watu wasio na hatia
  rationale: Huwaeleza wale ambao hawana kosa; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יִלְעָג
  choice: huyadhihaki
  rationale: Kitenzi humaanisha kucheka kwa dharau au kudhihaki. “Huyadhihaki” huhifadhi ukali wa shtaka la Ayubu.
theological_decisions:
- issue: Mtendaji wa “huyadhihaki”
  choice: Kiwakilishi “yeye” kinadokeza mtendaji wa kiume ambaye katika muktadha ni Mungu, bila kuingiza jina “Mungu” katika mstari.
  alternative: Pigo lenyewe lifanywe kama mtu anayeyadhihaki maafa, au mtendaji aachwe akiwa mtu asiyeainishwa.
  rationale: Mtiririko wa Ayubu 9 unaonyesha kwamba Ayubu anaeleza utawala wa Mungu kwa maneno yenye mvutano mkubwa wa kimaadili. Kutoingiza wazi jina “Mungu” kunahifadhi kiasi fulani cha kutotajwa kwa mtendaji katika Kiebrania, huku “yeye” ikisaidia sentensi ya Kiswahili kueleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kwa msomaji wa kawaida, huku tanbihi ikihifadhi utata wa nomino adimu ya Kiebrania na matini ikidumisha mvutano wa shtaka la Ayubu.
