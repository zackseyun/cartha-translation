lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Kiwakilishi hiki cha uhusiano kinaendeleza maelezo kuhusu Mungu kutoka muktadha uliotangulia; “ambaye” ni kiunganishi cha kawaida na cha asili kwa Kiswahili.
- source_word: בִּשְׂעָרָה
  choice: katika dhoruba
  rationale: שְׂעָרָה humaanisha dhoruba au tufani. Kihusishi ב kinaweza kueleza mahali/namna au chombo; “katika dhoruba” huhifadhi picha hai bila kulazimisha maana ya chombo.
- source_word: יְשׁוּפֵנִי
  choice: huniponda
  rationale: Kitenzi שׁוּף ni nadra na hapa huonyesha kudhuriwa kwa nguvu, sambamba na kuzidishwa kwa majeraha. “Huniponda” kina nguvu inayofaa, huku tanbihi ikihifadhi uwezekano wa “hunichubua.”
- source_word: וְהִרְבָּה
  choice: na kuyazidisha
  rationale: Hifili ya רבה ina maana ya kufanya yawe mengi au kuongeza. “Kuyazidisha” ni Kiswahili cha asili kinacholingana vizuri na “majeraha yangu.”
- source_word: פְצָעַי
  choice: majeraha yangu
  rationale: פצע hurejelea jeraha au dhara la mwili; “majeraha” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu wa kishairi.
- source_word: חִנָּם
  choice: bila sababu
  rationale: חִנָּם humaanisha bure, pasipo sababu, au bila msingi. “Bila sababu” huhifadhi uzito wa malalamiko ya Ayubu bila kuyaeleza kupita kiasi.
theological_decisions:
- issue: Iwapo חִנָּם inadai kutokuwa na hatia kabisa mbele za Mungu au inaeleza mtazamo wa Ayubu kwamba mateso yake hayakustahiliwa
  choice: bila sababu
  alternative: bila mimi kustahili; bure
  rationale: Kauli imetafsiriwa moja kwa moja bila kupunguza nguvu ya malalamiko ya Ayubu wala kuamua mvutano wa kitheolojia ambao mstari wenyewe hauutatui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Wakati wa mazoea (“huniponda”) unaonyesha tendo linalomtambulisha mhusika katika sentensi ya uhusiano. Alama zote za tanbihi zimewekwa mara baada ya vipashio vinavyohusika.
