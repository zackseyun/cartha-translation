  verdict: revise
  source_fidelity: Draft correctly preserves the conditional continuation, direct second-person address to God, the concrete pit/ditch image, and the personification of Job’s clothing. However, ‘yangenichukia’ can express ordinary dislike and is less forceful than the Hebrew תעב, which conveys disgust or abhorrence.
  naturalness: ‘Ungenitumbukiza shimoni’ is natural Standard East African Swahili. ‘Mavazi yangu mwenyewe’ is understandable but stylistically less idiomatic here; ‘hata mavazi yangu’ naturally supplies the intended ironic emphasis.
  terminology: ‘Shimoni’ is an appropriate primary rendering for שַׁחַת in this washing-and-defilement image. ‘Yangenikinai’ better communicates the revulsion of תעב than ‘yangenichukia.’
  issues:
  - severity: medium
    issue: The main rendering ‘yangenichukia’ understates the intensity of וְתִעֲבוּנִי.
    rationale: The Hebrew verb תעב denotes abhorrence, detestation, or revulsion. In this context, ‘yangenikinai’ retains the strong, vivid personification more closely.
  - severity: low
    issue: ‘Mavazi yangu mwenyewe’ is somewhat awkward and adds emphasis not required by the Hebrew.
    rationale: The possessive suffix already means ‘my clothes’; with ‘hata,’ the irony is clear in idiomatic Swahili without ‘mwenyewe.’
