lexical_decisions:
- source_word: אָז
  choice: ndipo
  rationale: Inaendeleza hoja ya masharti kutoka mstari uliotangulia na kuonyesha jambo ambalo lingefuata baada ya Ayubu kujiosha.
- source_word: בַּשַּׁחַת
  choice: shimoni
  rationale: Neno שַׁחַת linaweza kumaanisha shimo, handaki, au uharibifu. 'Shimoni' linadumisha picha halisi inayolingana na muktadha wa kuoshwa bila kuifasiri moja kwa moja kuwa uharibifu.
- source_word: תִּטְבְּלֵנִי
  choice: ungenitumbukiza
  rationale: Kitenzi טבל humaanisha kuchovya au kutumbukiza. 'Ungenitumbukiza' ni cha asili katika Kiswahili na kinahifadhi picha yenye nguvu ya Ayubu kutiwa ndani ya shimo.
- source_word: וְתִעֲבוּנִי
  choice: yangenichukia
  rationale: Kitenzi תעב huonyesha chuki kali au kinyaa. 'Yangenichukia' ni usemi wazi na wa kawaida unaodumisha tashhisi ya mavazi yake kumkataa.
- source_word: שַׂלְמוֹתָי
  choice: mavazi yangu mwenyewe
  rationale: Neno linataja mavazi au nguo. Kuongeza 'mwenyewe' kunasisitiza kejeli kwamba hata vitu vilivyo vya Ayubu mwenyewe vingemkataa.
theological_decisions:
- issue: Mtendaji anayeonyeshwa na kitenzi cha nafsi ya pili
  choice: 'Ayubu anamwelekea Mungu moja kwa moja: ''ungenitumbukiza.'''
  alternative: Kauli isiyoonyesha mtendaji, kana kwamba Ayubu angejikuta tu shimoni.
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya pili ya kiume umoja na kinaendeleza mazungumzo ya moja kwa moja na Mungu. Tafsiri hii inadumisha uzito wa malalamiko ya Ayubu bila kupunguza jukumu linalodokezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti 'ungenitumbukiza ... yangenichukia' unaunganisha mstari huu na wazo la mstari uliotangulia; tashhisi ya mavazi imehifadhiwa.
