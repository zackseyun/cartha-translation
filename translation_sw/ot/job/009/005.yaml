lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: huiondoa
  rationale: Hifili ya עתק inaonyesha kusababisha kitu kihame mahali pake. “Huiondoa” ni ya kawaida na inafaa katika taswira ya nguvu za Mungu; “huihamisha” pia inawezekana.
- source_word: הָרִים
  choice: milima
  rationale: Hili ndilo neno la kawaida la Kiswahili, na wingi wa Kiebrania umehifadhiwa.
- source_word: וְלֹא יָדָעוּ
  choice: nayo haijui
  rationale: Kitenzi cha wingi katika Kiebrania kinarejelea milima. Kiswahili hutumia upatanisho wa ngeli ya milima, “haijui,” na kuacha yambwa likieleweka; hii inadumisha uhuishaji wa kishairi.
- source_word: אֲשֶׁר
  choice: anapo-
  rationale: Katika muktadha huu אֲשֶׁר linaonyesha hali au wakati wa kitendo kinachofuata; muundo “anapoipindua” ni wa asili katika Kiswahili.
- source_word: הֲפָכָם
  choice: anapoipindua
  rationale: הפך humaanisha kugeuza au kupindua. Kiambishi “-i-” kinarejelea milima kwa kufuata upatanisho wa ngeli ya Kiswahili.
- source_word: בְּאַפּוֹ
  choice: kwa hasira yake
  rationale: אַף hapa ni nahau ya hasira. “Kwa hasira yake” ni wazi na huhifadhi uwezekano wa kueleza hali au nguvu inayotenda.
