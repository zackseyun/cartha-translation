  text: Yeye huiondoa milima[a], nayo haijui anapoipindua kwa hasira yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huihamisha milima.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha kitu kihame mahali pake.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika ghadhabu yake.”
