  text: They pass by like reed boats, like an eagle swooping on prey.
translation:
  language: sw
  text: Zinapita kama mashua za matete[a], kama tai anayerukia windo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mashua za mafunjo.” Maana kamili ya neno la Kiebrania linalofafanua mashua hizi si hakika.'
