lexical_decisions:
- source_word: אֳנִיּוֹת אֵבֶה
  choice: mashua za matete
  rationale: Kirai hiki kinaelekea kutaja mashua nyepesi zilizotengenezwa kwa mimea ya majini; “matete” ni neno la kawaida na linaloeleweka, huku tanbihi ikihifadhi kutokuwa na uhakika kwa maana ya אֵבֶה.
- source_word: נֶשֶׁר
  choice: tai
  rationale: Ni jina la ndege mkubwa mla nyama; “tai” ni tafsiri ya kawaida ya Kiswahili na haibani utambulisho wa spishi ambao hapa si lazima.
- source_word: יָטוּשׂ עֲלֵי אֹכֶל
  choice: anayelishukia windo kwa kasi
  rationale: Taswira ni ya ndege anayepiga mbizi au kushuka ghafula juu ya chakula chake; “windo” huwasilisha maana ya chakula kinachowindwa, na “kwa kasi” huhifadhi mwendo wa haraka.
