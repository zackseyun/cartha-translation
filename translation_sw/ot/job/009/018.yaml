  text: לֹֽא יִ֭תְּנֵ/נִי הָשֵׁ֣ב רוּחִ֑/י כִּ֥י יַ֝שְׂבִּעַ֗/נִי מַמְּרֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/018.yaml
  text: He does not let me catch my breath[b][a], for he fills me with bitterness.
translation:
  language: sw
  text: Haniruhusu hata kupata pumzi,[a] kwa maana hunijaza mambo machungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuirudisha pumzi yangu”; yaani, kupata nafasi ya kupumua au kujituliza.
    reason: lexical_alternative
  - marker: b
    text: Au, “machungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: haniruhusu
  rationale: Kitenzi נתן pamoja na kitenzi-jina kinamaanisha kwa njia ya nahau ‘kuruhusu’; ‘haniruhusu’ ni Kiswahili cha kawaida na sahihi.
- source_word: הָשֵׁב רוּחִי
  choice: hata kupata pumzi
  rationale: Kirai hicho kihalisi ni ‘kuirudisha pumzi/roho yangu,’ lakini katika muktadha kinaonyesha kutopata nafasi ya kupumua au kujituliza. ‘Kupata pumzi’ ni nahau ya asili ya Kiswahili, na ‘hata’ inaonyesha uzito wa hali bila kuongeza wazo jipya.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa sababu ya kauli iliyotangulia; ‘kwa maana’ inadumisha uhusiano huo na sajili ya kishairi.
- source_word: יַשְׂבִּיעַנִי
  choice: hunijaza
  rationale: Hifili ya שבע humaanisha kushibisha au kujaza. Katika muktadha hasi, ‘hunijaza’ ni ya kawaida na inaepuka maana chanya inayoweza kuambatana na ‘kunishibisha.’
- source_word: מַמְּרֹרִים
  choice: mambo machungu
  rationale: Nomino ya wingi inaweza kumaanisha ‘machungu’ au ‘mambo machungu.’ Uchaguzi huu unahifadhi kwa uwazi umbo halisi la wingi na wazo la mateso machungu.
