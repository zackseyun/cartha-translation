base_translation:
  language: en
  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: sw
  text: Dunia imekabidhiwa mkononi mwa mwovu[a]; hufunika nyuso za waamuzi wake. Kama sivyo[b], basi ni nani?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nchi imekabidhiwa mkononi mwa mtu mwovu.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “dunia” au “nchi,” na רָשָׁע linaweza kueleweka kuwa mtu mmoja mwovu au waovu kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Mtendaji wa “hufunika” hajatajwa wazi katika Kiebrania. Anaweza kueleweka kuwa Mungu, mtawala mwovu, au mtendaji asiyeainishwa.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: Dunia
  rationale: Neno linaweza kumaanisha “dunia” au “nchi.” Katika muktadha huu wa kishairi, “dunia” linaonyesha vizuri upeo mpana wa malalamiko ya Ayubu kuhusu utaratibu wa ulimwengu, huku “nchi” likihifadhiwa katika tanbihi kama uwezekano halali.
- source_word: נִתְּנָה בְיַד
  choice: imekabidhiwa mkononi mwa
  rationale: Kauli tendwa ya kitenzi נתן pamoja na nahau בְיַד inaeleza kutiwa chini ya mamlaka ya mtu. “Imekabidhiwa mkononi mwa” ni Kiswahili cha kawaida kinachohifadhi picha ya “mkono” na hali inayoendelea kutokana na tendo hilo.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Umbo la umoja linaweza kumaanisha mtu mmoja mwovu au mwovu kama mwakilishi wa waovu kwa ujumla. “Mwovu” halibainishi zaidi ya Kiebrania.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: nyuso za waamuzi wake
  rationale: Tafsiri hii inahifadhi picha halisi ya “nyuso” na maana ya “waamuzi”; kiambishi cha umilikaji kinarejelea dunia au nchi.
- source_word: יְכַסֶּה
  choice: hufunika
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu umoja lakini mtendaji wake hajatajwa. Kiswahili “hufunika” kinaacha mtendaji bila kutajwa na hakilazimishi kumtambulisha kuwa Mungu au mwovu.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: Kama sivyo, basi ni nani?
  rationale: Hili ni swali la changamoto. “Basi” linawakilisha nguvu ya אֵפוֹא, na “kama sivyo” huepuka kuongeza rejeleo ambalo halijaelezwa wazi katika Kiebrania.
theological_decisions:
- issue: Utambulisho wa mtendaji wa “hufunika” na wa anayelengwa na swali “ni nani?”
  choice: Mtendaji anaachwa bila kutajwa, kama katika Kiebrania.
  alternative: Kumtaja Mungu kuwa ndiye anayefunika, kumtaja mwovu kuwa ndiye anayefunika, au kutumia kauli tendwa.
  rationale: Muktadha unaweza kudokeza kwamba Ayubu anamwona Mungu kuwa mtendaji wa mwisho nyuma ya hali hiyo, lakini sentensi yenyewe haimtaji mtendaji. Tafsiri inahifadhi utata na mvutano huo wa kitheolojia badala ya kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye staha. Nahau “imekabidhiwa mkononi mwa” ni ya kawaida na inahifadhi taswira ya Kiebrania; muundo “hufunika” umechaguliwa ili kutomtaja mtendaji ambaye chanzo hakimwelezi wazi.
