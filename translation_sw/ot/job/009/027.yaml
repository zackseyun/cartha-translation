- source_word: אֶעֶזְבָה פָנַי
  choice: nitaacha uso wangu wenye huzuni
  rationale: Huhifadhi picha halisi ya ‘kuacha uso wangu’ huku ikifafanua kwa Kiswahili cha kawaida kwamba kinachowekwa kando ni sura ya huzuni.
- source_word: וְאַבְלִיגָה
  choice: na kuchangamka
  rationale: Kitenzi kinaashiria kupungua kwa huzuni na kubadilika kwa hali au sura; ‘kuchangamka’ huwasilisha hali hiyo kwa lugha ya kawaida bila kudai furaha kamili.
