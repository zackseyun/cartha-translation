- source_word: אֶשְׁכְּחָה
  choice: Nitasahau
  rationale: Huwasilisha azimio analojipendekezea Ayubu bila kuligeuza kuwa amri.
- source_word: שִׂיחִי
  choice: malalamiko yangu
