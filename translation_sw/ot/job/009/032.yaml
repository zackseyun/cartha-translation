  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: sw
  text: Kwa maana yeye si mwanadamu kama mimi, ili nimjibu, tupate kwenda pamoja mahakamani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili nimjibu, tupate kwenda pamoja kwa hukumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza hoja ya Ayubu kwa kutoa sababu ya malalamiko yaliyotangulia.
- source_word: לֹא אִישׁ כָּמֹנִי
  choice: yeye si mwanadamu kama mimi
  rationale: ‘Mwanadamu’ huonyesha wazi tofauti kati ya Mungu na Ayubu, aliye binadamu, bila kudokeza kwamba hoja kuu ni jinsia ya kiume.
- source_word: אֶעֱנֶנּוּ
  choice: hata nimjibu
  rationale: Kitenzi kina maana ya kumjibu au kuitikia; katika muktadha huu kinabeba pia wazo la kujibu katika shauri.
- source_word: נָבוֹא יַחְדָּו
  choice: nasi tukutane pamoja
  rationale: Nafsi ya kwanza wingi inawahusisha Ayubu na Mungu; ‘tukutane pamoja’ huwasilisha kufika kwao wote wawili mbele ya shauri moja.
- source_word: בַּמִּשְׁפָּט
  choice: mahakamani
  rationale: Katika taswira ya madai ya kisheria ya kifungu hiki, ‘mahakamani’ ni Kiswahili cha kawaida na wazi, huku maana mbadala ya ‘kwa hukumu’ ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Taswira ya kisheria kati ya Ayubu na Mungu
  choice: Kifungu kinaelezwa kama kutowezekana kwa Ayubu na Mungu kukutana kama washitaki wanaolingana mahakamani.
  alternative: 'Tafsiri ya jumla zaidi: ‘tukutane pamoja kwa hukumu.’'
  rationale: מִשְׁפָּט ina maana zinazohusiana na hukumu, haki, na shauri la kisheria. Muktadha unaunga mkono taswira ya mahakama, lakini tanbihi huhifadhi uwezekano wa usemi wa jumla zaidi.
- issue: Lugha ya jinsia katika אִישׁ
  choice: mwanadamu
  alternative: mwanamume
  rationale: Ingawa אִישׁ ni umbo la kiume umoja na Ayubu ni msemaji wa kiume, hapa tofauti ya msingi ni kati ya Mungu na binadamu. ‘Mwanadamu’ huwasilisha tofauti hiyo kwa usahihi katika Kiswahili cha kawaida bila kufuta nafsi ya Ayubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mahakamani’ hudumisha taswira hai ya kisheria; ‘hata nimjibu’ huhifadhi uhusiano wa kimantiki wa sentensi bila kuufanya usemi kuwa mzito kupita kiasi.
