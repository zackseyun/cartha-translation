  text: Mimi sina lawama; sijijui[a]; nayadharau maisha yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “siijui nafsi yangu.” Neno la Kiebrania linaweza kumaanisha nafsi, mtu mwenyewe, au uhai.'
