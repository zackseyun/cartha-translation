lexical_decisions:
- source_word: תָּם
  choice: sina lawama
  rationale: Neno hili linaonyesha ukamilifu wa mwenendo au uadilifu. “Sina lawama” linafaa katika madai ya Ayubu bila kudokeza kwamba hana dhambi kabisa.
- source_word: אָנִי
  choice: Mimi
  rationale: Kiwakilishi cha nafsi ya kwanza kimetajwa wazi ili kuhifadhi mkazo wa Kiebrania.
- source_word: לֹא אֵדַע
  choice: sijijui
  rationale: Kitenzi kimsingi ni “kujua.” Tafsiri hii inahifadhi usemi mkali na wenye utata badala ya kuufafanua kuwa “sijali” au “sitambui.”
- source_word: נַפְשִׁי
  choice: mwenyewe
  rationale: נֶפֶשׁ hapa inaweza kurejelea nafsi, mtu mwenyewe, au uhai. “Mwenyewe” huleta maana ya kujirejelea kwa Kiswahili cha kawaida, huku upana wa neno la Kiebrania ukielezwa katika tanbihi.
- source_word: אֶמְאַס
  choice: nayadharau
  rationale: מָאַס humaanisha kukataa au kudharau. “Nayadharau” huhifadhi nguvu ya kihisia bila kuongeza ukali wa “nachukia kabisa.”
- source_word: חַיָּי
  choice: maisha yangu
  rationale: Hurejelea uhai au maisha ya msemaji; “maisha yangu” ni tafsiri ya kawaida na iliyo wazi katika muktadha.
