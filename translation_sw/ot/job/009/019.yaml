  text: Ikiwa ni suala la nguvu—tazama, yeye ni hodari; na ikiwa ni suala la hukumu[a], ni nani awezaye kuniita?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki” au “shauri la kisheria.”
