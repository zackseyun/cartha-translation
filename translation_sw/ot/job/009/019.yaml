    text: Kitenzi cha Kiebrania ni kigumu. Umbo la Kimasoreti lina kiambishi “-ni” (“kuniita”) na linaweza kudokeza kumwita mtu au kumwekea muda wa kufika au kusikilizwa. Kwa kuzingatia muktadha, wengine huelewa “ni nani awezaye kumwita yeye [mahakamani]?”
