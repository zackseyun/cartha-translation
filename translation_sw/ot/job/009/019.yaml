lexical_decisions:
- source_word: אִם לְכֹחַ
  choice: Ikiwa ni suala la nguvu
  rationale: Kihusishi לְ kinaonyesha jambo au eneo linalozungumziwa; usemi huu ni wa kawaida katika Kiswahili na unadumisha muundo wa sharti.
- source_word: אַמִּיץ
  choice: hodari
  rationale: Neno hili linaonyesha nguvu nyingi. ‘Hodari’ huepuka kurudia ‘nguvu’ huku likidumisha uzito wa kauli.
- source_word: הִנֵּה
  choice: tazama
  rationale: Linaendeleza msisitizo wa chembe ya Kiebrania inayovuta fikira na linafaa kwa sajili ya Biblia.
- source_word: לְמִשְׁפָּט
  choice: la hukumu
  rationale: מִשְׁפָּט hapa linaweza kumaanisha hukumu, haki, au shauri la kisheria; ‘hukumu’ hudumisha taswira ya mahakama bila kuamua kupita kiasi.
- source_word: מִי יוֹעִידֵנִי
  choice: ni nani awezaye kuniitia mahakamani?
  rationale: Umbo la Kimasoreti lina kiambishi cha nafsi ya kwanza, ‘-ni,’ hivyo tafsiri kuu inakifuata. Katika muktadha wa kisheria, יעד katika Hifili linaweza kumaanisha kumwita au kumwekea mtu muda wa kufika mahakamani.
theological_decisions:
- issue: Taswira ya kisheria katika changamoto ya Ayubu kuhusu Mungu
  choice: 'Kudumisha lugha ya mahakama na kiambishi cha nafsi ya kwanza: ‘ni nani awezaye kuniitia mahakamani?’'
  alternative: ‘Ni nani awezaye kumwita yeye mahakamani?’
  rationale: Maandishi ya Kimasoreti yanaonyesha ‘kuni-’, ingawa muktadha unaweza kuifanya ‘kumwita yeye’ ionekane yenye uwezekano. Tafsiri kuu inafuata umbo lililopo, na tanbihi inahifadhi usomaji unaotokana na muktadha bila kuondoa mvutano wa kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ hudumisha msisitizo wa kishairi; ‘kuniitia mahakamani’ hufanya maana ya kisheria ieleweke kwa msomaji wa kawaida.
