translation:
  language: sw
  text: 'Yeye huitikisa dunia kutoka mahali pake,

    na nguzo zake hutetemeka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hutikisika” au “hutetemeka kwa nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: huitikisa
  rationale: Kauli ya kusababisha katika umbo la participle humweleza Mungu kuwa ndiye anayeifanya dunia itikisike; “huitikisa” ni ya kawaida na huhifadhi nguvu hiyo.
- source_word: אֶרֶץ
  choice: dunia
  rationale: Muktadha wa ulimwengu mzima, pamoja na dunia kuondolewa mahali pake na nguzo zake kutetemeka, unaunga mkono “dunia” kuliko “nchi.”
- source_word: מִמְּקוֹמָהּ
  choice: kutoka mahali pake
  rationale: Hii inawasilisha moja kwa moja kihusishi, nomino, na kiambishi cha nafsi ya tatu ya kike, huku ikihifadhi picha ya dunia kuhamishwa.
- source_word: וְעַמּוּדֶיהָ
  choice: na nguzo zake
  rationale: “Nguzo” huhifadhi taswira ya kishairi ya הקוסmolojia iliyomo katika עמוד, bila kuifasiri kuwa “misingi.”
- source_word: יִתְפַלָּצוּן
  choice: hutetemeka
  rationale: Kitenzi kinaonyesha kutikisika kwa nguvu. “Hutetemeka” ni Kiswahili cha kawaida na kinadumisha usambamba wa kishairi na “huitikisa,” bila kuipa taswira hiyo hisia za kibinadamu kupita kiasi.
theological_decisions:
- issue: Taswira ya kikosmolojia ya nguzo za dunia
  choice: Kudumisha taswira ya kishairi moja kwa moja kama “nguzo zake”
  alternative: Kufasiri kama “misingi yake” ili kuoanisha na mtazamo wa kisasa wa ulimwengu
  rationale: Mstari unatumia lugha ya kale ya kishairi kuhusu ulimwengu. Tafsiri inadumisha taswira ya Kiebrania badala ya kuisasaisha au kuondoa mvutano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Yeye” huanzisha kishazi cha Kiebrania kinachomweleza Mungu, na wakati wa mazoea katika “huitikisa/hutetemeka” unafaa maelezo ya uwezo wake.
