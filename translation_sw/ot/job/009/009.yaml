  text: who made the Bear[a], Orion, and the Pleiades[c][b], and the chambers of the south.
translation:
  language: sw
  text: 'aliyefanya[a] Dubu[b], Orioni na Kilimia,

    na vyumba vya kusini.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “anayefanya.” Neno la Kiebrania lililo katika umbo la participle linaweza kueleza tendo linaloendelea pamoja na tendo lililokamilika.
    reason: lexical_alternative
  - marker: b
    text: “Dubu” hapa ni jina la kundi la nyota. Tafsiri nyingine za zamani hulitaja kuwa “Arcturus.”
    reason: alternative_reading
  - marker: c
    text: Huenda maneno “vyumba vya kusini” yanamaanisha kwa lugha ya kishairi sehemu zilizofichika au makundi ya nyota ya anga ya kusini.
    reason: cultural_note
lexical_decisions:
- source_word: עֹשֶׂה
  choice: aliyefanya
  rationale: Kitenzi kishirikishi cha Kiebrania kinaendeleza maelezo kuhusu Mungu katika mstari uliotangulia. Wakati uliopita unaonyesha kazi yake ya uumbaji, huku tanbihi ikihifadhi uwezekano wa maana ya tendo linaloendelea.
- source_word: עָשׁ
  choice: Dubu
  rationale: Neno hili linataja kundi la nyota ambalo kwa kawaida huhusishwa na Dubu. Jina la kawaida limetumiwa badala ya kulinakili kwa herufi za Kiswahili au kulibainisha kupita kiasi kuwa nyota fulani moja.
- source_word: כְּסִיל
  choice: Orioni
  rationale: Katika muktadha wa nyota, neno hili kwa kawaida hutambulishwa kuwa kundi la nyota la Orion; Orioni ni umbo linaloeleweka katika Kiswahili.
- source_word: כִימָה
  choice: Kilimia
  rationale: Neno hili kwa kawaida hutambulishwa kuwa kundi la nyota la Pleiades, linalojulikana kwa Kiswahili kama Kilimia.
- source_word: חַדְרֵי תֵמָן
  choice: vyumba vya kusini
  rationale: Tafsiri hii inahifadhi picha ya kishairi ya 'vyumba' au sehemu za ndani za kusini. Katika muktadha huu תֵמָן linaeleweka kwa maana ya mwelekeo wa kusini, si jina la mahali.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wa kishairi. Majina yanayotambulika ya makundi ya nyota—Orioni na Kilimia—yametumiwa; taswira halisi ya 'vyumba vya kusini' imehifadhiwa bila kuifafanua kupita kiasi.
