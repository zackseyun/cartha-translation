  text: אֲשֶׁ֣ר אִם צָ֭דַקְתִּי לֹ֣א אֶעֱנֶ֑ה לִ֝/מְשֹׁפְטִ֗/י אֶתְחַנָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/015.yaml
  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: sw
  text: Hata kama ningekuwa na haki, nisingemjibu; ningemsihi mwamuzi wangu anirehemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: ningekuwa na haki
  rationale: Kitenzi hiki katika muktadha wa kesi kinamaanisha kuwa upande wa haki au kutokuwa na hatia; usemi huu wa Kiswahili huhifadhi maana ya kimahakama bila kudai ukamilifu wa kimaadili.
- source_word: לֹא אֶעֱנֶה
  choice: nisingemjibu
  rationale: Huhifadhi maana ya kujibu katika mabishano au kesi, huku kiambishi cha kitu kikirejelea mwamuzi anayetajwa katika kishazi kinachofuata.
- source_word: לִמְשֹׁפְטִי
  choice: mwamuzi wangu
  rationale: Muundo huu unaweza kumaanisha yule anayenihukumu au mwamuzi wangu; 'mwamuzi wangu' ni wa asili na huhifadhi taswira ya mahakama.
- source_word: אֶתְחַנָּן
  choice: ningemsihi ... anirehemu
  rationale: Kitenzi kinaeleza kuomba kwa unyenyekevu neema au huruma; tafsiri hii huwasilisha ombi hilo kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Uhusiano kati ya kuwa na haki na kuomba rehema
  choice: Hata kama ningekuwa na haki ... ningemsihi ... anirehemu
  alternative: Hata kama ningekuwa mwadilifu ... ningejitetea
  rationale: 'Aya inadumisha mvutano wa maneno ya Ayubu: hata akiwa upande wa haki, asingetegemea jibu lake bali angeomba rehema. Tafsiri haibadili ''kuwa na haki'' kuwa dai la kutokuwa na dhambi wala kuomba rehema kuwa kujitetea.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi na ya kimahakama imehifadhiwa; hakuna istilahi ya dhehebu iliyoingizwa.
