id: JOB.9.34
reference: Job 9:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: sw
  text: 'Aiondoe fimbo yake kutoka juu yangu,

    wala hofu yake isinitishe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָסֵר
  choice: Na aiondoe
  rationale: Hifili ya סור ina nguvu ya ombi au tamanio katika muktadha; muundo huu wa Kiswahili huhifadhi maana hiyo kwa lugha ya kawaida yenye hadhi.
- source_word: מֵעָלַי
  choice: juu yangu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya fimbo iliyo juu ya Ayubu kama mzigo au tisho, badala ya kuirahisisha kuwa ‘kwangu’ tu.
- source_word: שִׁבְטוֹ
  choice: fimbo yake
  rationale: שֵׁבֶט inaweza kuwa fimbo, gongo, au sceptre; hapa muktadha wa mateso na kupigwa unaunga mkono ‘fimbo.’
- source_word: וְאֵמָתוֹ
  choice: wala hofu yake
  rationale: אֵימָה ni hofu kuu au kitisho. ‘Hofu yake’ ni ya asili katika Kiswahili na inaonyesha hofu inayosababishwa na Mungu bila kulazimisha tafsiri ya maana hiyo.
- source_word: אַל תְּבַעֲתַנִּי
  choice: isinitishe
  rationale: אַל pamoja na kitenzi huonyesha ombi hasi; בעת humaanisha kutisha au kufadhaisha kwa hofu. ‘Isinitishe’ ni wazi na huepuka uradidi usio wa lazima.
theological_decisions:
- issue: Mrejelewa wa viwakilishi vya nafsi ya tatu
  choice: Mungu anatajwa kwa njia isiyo ya moja kwa moja kwa ‘-ye/-ake,’ si kusemewa moja kwa moja kwa ‘wewe/yako.’
  alternative: ‘Ondoa fimbo yako juu yangu, wala hofu yako isinitishe.’
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja na viambishi vya nafsi ya tatu. Tafsiri inahifadhi sarufi hiyo na mvutano wa hotuba ya Ayubu badala ya kuigeuza kuwa usemi wa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Mistari miwili inaakisi uwiano wa kishairi wa Kiebrania; viwakilishi vya nafsi ya tatu vimehifadhiwa.
