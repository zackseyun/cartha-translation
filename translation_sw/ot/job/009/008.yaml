  yaml_path: translation/ot/job/009/008.yaml
  text: who alone stretches out the heavens and treads on the heights of the sea[a].
translation:
  language: sw
  text: 'Yeye peke yake huzitandaza mbingu,

    na hukanyaga juu ya vilele vya bahari.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutembea juu ya mawimbi ya bahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: huzitandaza
  rationale: Kitenzi hiki katika kauli ya kishairi kinaonyesha tendo la kutandaza au kunyoosha; “huzitandaza” ni Kiswahili cha kawaida kinachodumisha hali ya maelezo ya kudumu.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: Katika muktadha huu wa kishairi kuhusu ulimwengu, “mbingu” linafaa kuliko “anga” pekee na linaakisi umbo na matumizi ya neno la Kiebrania.
- source_word: לְבַדּוֹ
  choice: yeye peke yake
  rationale: Kauli hii inasisitiza kwamba Mungu hutenda bila msaada wa mwingine; “yeye peke yake” inaweka msisitizo huo wazi na kwa lugha ya asili.
- source_word: וְדוֹרֵךְ
  choice: na hukanyaga
  rationale: דרך inaweza kumaanisha kukanyaga au kutembea juu ya kitu. “Hukanyaga” inadumisha taswira yenye nguvu bila kuingiza wazo la kuharibu.
- source_word: עַל
  choice: juu ya
  rationale: Hii ndiyo maana ya kawaida ya kihusishi hapa na inaeleza kuwa tendo linafanyika juu ya bahari.
- source_word: בָּמֳתֵי
  choice: vilele
  rationale: Neno במה kwa msingi humaanisha sehemu za juu au miinuko. “Vilele vya bahari” kinahifadhi sitiari ya Kiebrania badala ya kuifafanua moja kwa moja kuwa mawimbi.
- source_word: יָם
  choice: bahari
  rationale: Umoja “bahari” unaendana na Kiebrania na taswira ya kishairi ya ulimwengu.
theological_decisions:
- issue: Taswira ya ulimwengu inayoonyesha mamlaka ya Mungu juu ya uumbaji
  choice: Kudumisha taswira ya Mungu akiwa peke yake akitandaza mbingu na kukanyaga vilele vya bahari
  alternative: Kutafsiri kwa ufafanuzi zaidi kuwa “hutembea juu ya mawimbi ya bahari”
  rationale: Matini inatangaza ukuu na mamlaka ya pekee ya Mungu kwa lugha ya kishairi. Tafsiri kuu inahifadhi picha hiyo bila kuipunguza kuwa sitiari tu wala kuiongezea dai la kimafundisho lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari miwili unafuata usambamba wa Kiebrania; alama [a] imewekwa baada ya kishazi inachohusu.
