lexical_decisions:
- source_word: הָאֹמֵר
  choice: anayeliambia
  rationale: Kitenzi-shirikishi hiki kinaendeleza maelezo ya Mungu kutoka muktadha uliotangulia. Muundo wa uhusiano “anayeliambia” ni wa kawaida katika Kiswahili na unaunganisha kwa wazi kitendo cha kusema na jua.
- source_word: לַחֶרֶס
  choice: jua
  rationale: Katika muktadha huu wa kishairi, unaotaja kuchomoza na nyota, חֶרֶס humaanisha jua, si udongo au kigae.
- source_word: וְלֹא יִזְרָח
  choice: “Usichomoze,”
  rationale: 'Kauli hii imewasilishwa kama amri ya moja kwa moja kwa jua, jambo linalohifadhi uhuishaji wa kishairi. Hata hivyo, Kiebrania pia kinaweza kueleweka kuwa kinaeleza matokeo: “nalo halichomozi”; uwezekano huo umewekwa katika tanbihi.'
- source_word: וּבְעַד
  choice: na
  rationale: Pamoja na יַחְתֹּם, kihusishi hiki kinachangia taswira ya kufunga au kuziba. Katika Kiswahili cha kawaida maana hiyo inawasilishwa kwa muundo mzima “kuzifungia nyota,” bila kutafsiri kihusishi peke yake kwa namna isiyo ya kawaida.
- source_word: כּוֹכָבִים
  choice: nyota
  rationale: Hili ni neno la kawaida la wingi linalomaanisha nyota. Kiswahili hakihitaji kibainishi kinacholingana na ‘the’ katika kauli hii ya ulimwengu.
- source_word: יַחְתֹּם
  choice: kuzifungia
  rationale: Kitenzi חתם kina maana ya kutia muhuri. “Kuzifungia” kinawasilisha kwa Kiswahili cha asili taswira ya kuziba nyota zisionekane, bila kuondoa wazo la kufungwa linalodokezwa na muhuri.
