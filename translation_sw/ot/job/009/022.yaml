  yaml_path: translation/ot/job/009/022.yaml
  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: sw
  text: Yote ni mamoja; kwa hiyo nasema[a], “Yeye huwaangamiza wasio na lawama pamoja na waovu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimesema.” Hali timilifu ya kitenzi cha Kiebrania inaweza kutafsiriwa hapa kama kauli ya sasa au kama tendo lililokwisha kutendeka.
    reason: lexical_alternative
  - marker: b
    text: Au, “huwaangamiza wasio na lawama pamoja na waovu,” ikiwa kauli inaeleweka kwa maana isiyo ya mtu binafsi.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: Yote ni mamoja
  rationale: Nahau hii inaonyesha kuwa tofauti hiyo haibadili matokeo, si kwamba kitu kinahesabiwa kuwa kimoja tu. “Yote ni mamoja” ni Kiswahili cha kawaida na chenye nguvu kinachohifadhi dai la Ayubu kwamba hali hizi mbili huishia vivyo hivyo.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na kauli iliyotangulia kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: אָמַרְתִּי
  choice: nasema
  rationale: Ingawa kitenzi cha Kiebrania kiko katika hali timilifu, hapa kinaweza kutumiwa kuanzisha hitimisho ambalo Ayubu analitamka sasa. “Nasema” linafuata mtiririko wa mazungumzo; uwezekano wa “nimesema” umehifadhiwa katika tanbihi.
- source_word: תָּם
  choice: wasio na lawama
  rationale: Neno hili humaanisha watu wenye uadilifu au ukamilifu wa tabia, si watu wasio na dhambi kabisa. “Wasio na lawama” linahifadhi maana hiyo bila kudai ukamilifu usio na dhambi.
- source_word: רָשָׁע
  choice: waovu
  rationale: Hili ni neno la kawaida kwa watu wenye hatia ya kimaadili na linaonyesha wazi upinzani na “wasio na lawama.”
- source_word: הוּא מְכַלֶּה
  choice: Yeye huwaangamiza
  rationale: Kiwakilishi cha umoja wa kiume pamoja na muktadha wa Ayubu 9 kinaelekea kumrejelea Mungu kama mtendaji. “Huwaangamiza” linaonyesha tendo lenye nguvu la kukomesha au kuharibu, huku uwezekano wa maana isiyo ya mtu binafsi ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Mtendaji asiye tajwa kwa jina katika “Yeye huwaangamiza”
  choice: Kiwakilishi “Yeye” kimetumiwa kumrejelea Mungu katika malalamiko ya Ayubu.
  alternative: 'Kauli inaweza kueleweka kwa maana isiyo ya mtu binafsi: “Hilo huwaangamiza wasio na lawama pamoja na waovu.”'
  rationale: Katika Ayubu 9, mazungumzo yanahusu utawala na nguvu za Mungu, hivyo Mungu ndiye anayeeleweka kwa urahisi kuwa mtendaji. Tafsiri haipunguzi ukali wa malalamiko ya Ayubu wala kulitatua kitheolojia; usomaji mwingine umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Nahau “yote ni mamoja” imetumiwa kwa maana ya kutokuwapo kwa tofauti ya matokeo, si kwa maana ya kwamba hali hiyo ni nzuri au inakubalika. Wingi katika “wasio na lawama” na “waovu” unasikika kwa kawaida katika Kiswahili huku ukihifadhi makundi mawili yanayowakilishwa na nomino za umoja katika Kiebrania.
