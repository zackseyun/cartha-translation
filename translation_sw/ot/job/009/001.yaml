lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Kitenzi ענה katika fomula hii ya masimulizi huanzisha jibu kwa hotuba iliyotangulia; “akajibu” ni Kiswahili cha kawaida na huhifadhi maana ya mwitikio.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Jina limetolewa kwa umbo la Kiswahili lililozoeleka.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: אמר ni kitenzi cha kawaida cha kusema; “akasema” huhifadhi sehemu ya pili ya fomula ya Kiebrania bila kuipanua.
- source_word: וַ
  choice: Kisha / aka-
  rationale: Waw katika vitenzi vya wayyiqtol huonyesha mfuatano wa simulizi. “Kisha” pamoja na umbo la mfululizo “aka-” hutoa Kiswahili cha asili huku kikihifadhi mwendelezo kutoka kwa msemaji aliyetangulia.
theological_decisions: []
