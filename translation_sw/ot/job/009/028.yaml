  - marker: b
    text: Au, “hutaniacha bila adhabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: Ninaogopa
  rationale: Kitenzi hiki katika Qal kamilifu nafsi ya kwanza umoja kinaeleza hali ya kuogopa au kuhofia; wakati wa sasa ni wa kawaida na wa asili katika muktadha huu.
- source_word: כָל
  choice: yote
  rationale: Kihesabu cha ujumla kimehifadhiwa, kikikubaliana kisarufi na “maumivu.”
- source_word: עַצְּבֹתָי
  choice: maumivu yangu
  rationale: Neno linaweza kumaanisha maumivu, huzuni, au taabu. “Maumivu yangu” huhifadhi uzito wa mateso ya Ayubu bila kuyafanya kuwa ya kihisia pekee.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: 'Qal kamilifu hapa ina nguvu ya hali ya sasa: Ayubu anaeleza jambo analolijua.'
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha yaliyomo katika jambo ambalo Ayubu analijua.
- source_word: לֹא
  choice: hu-…-ni
  rationale: Ukanushi umejumuishwa katika muundo wa kitenzi cha Kiswahili “hutanihesabu.”
- source_word: תְנַקֵּנִי
  choice: hutanihesabu kuwa sina hatia
  rationale: Piel ya נקה ina maana ya kumwona au kumtangaza mtu kuwa hana hatia, au kutomwacha bila adhabu. Tafsiri hii huhifadhi maana ya kimahakama kwa lugha ya kawaida ya Kiswahili.
theological_decisions:
- issue: Maana ya kimahakama ya נקה katika maneno ya Ayubu kwa Mungu
  choice: hutanihesabu kuwa sina hatia
  alternative: hutaniacha bila adhabu
  rationale: 'Uchaguzi huu huhifadhi mvutano wa kimahakama: Ayubu anaamini Mungu hatamwona kuwa hana hatia. Hauelezi kwa nini wala kuingiza fundisho la baadaye; maana mbadala inayohusu kutoadhibiwa imehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kimahakama umetolewa kwa kirai cha kawaida badala ya istilahi nzito kama “kuniachilia.”
