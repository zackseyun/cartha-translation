  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: sw
  text: Ninaogopa maumivu yangu yote;[a] najua kwamba hutanihesabu kuwa sina hatia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninazihofia huzuni zangu zote,” au “Ninaziogopa taabu zangu zote.”
