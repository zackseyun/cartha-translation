  text: If I washed myself with snow and cleansed my hands with lye,[a]
translation:
  language: sw
  text: Hata kama ningejiosha kwa theluji na kuisafisha mikono yangu kwa magadi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sabuni”; neno la Kiebrania humaanisha kwa usahihi zaidi dutu ya alkali ya kusafishia, kama vile magadi.
