lexical_decisions:
- source_word: אִם
  choice: Hata kama
  rationale: Katika muktadha wa hoja ya Ayubu, kisharti hiki kinaeleza jambo la kudhaniwa ambalo hata likifanywa halingebadili matokeo; “Hata kama” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: הִתְרָחַצְתִּי
  choice: ningeoga
  rationale: Kauli ya kujirejelea ya רחץ inaonyesha Ayubu akijiosha mwenyewe. “Ningeoga” ni ya asili katika Kiswahili na, pamoja na “kwa theluji,” huhifadhi maana ya kujisafisha.
- source_word: במו שָׁלֶג
  choice: kwa theluji
  rationale: Kirai hiki kinaonyesha theluji kama njia ya kuoshea. Hakiongezi wazo la “maji ya theluji,” ambalo halijaelezwa wazi katika Kiebrania.
- source_word: וַהֲזִכּוֹתִי
  choice: na kuitakasa
  rationale: Hifili ya זכה ina maana ya kufanya kuwa safi. “Kuitakasa” huhifadhi usambamba na kuoga pamoja na mwangwi wa usafi wa kimwili na wa kimaadili bila kuamua upande mmoja.
- source_word: בְּבֹר
  choice: kwa magadi
  rationale: בֹּר ni dutu ya alkali iliyotumiwa kusafishia. “Magadi” ni neno linaloeleweka katika Kiswahili cha Afrika Mashariki kwa alkali ya kusafishia na ni sahihi zaidi kihistoria kuliko sabuni ya kisasa.
- source_word: כַּפָּי
  choice: mikono yangu
  rationale: Ingawa כַּפַּיִם inaweza kutaja viganja, “mikono yangu” ni usemi wa kawaida wa Kiswahili katika muktadha wa kuosha na kutakasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Hata kama ninge…” unaweka mstari kama hali ya kudhaniwa inayoendelea katika mstari unaofuata. Alama ya tanbihi [a] imewekwa baada ya neno linalohusika.
