  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: sw
  text: Siku zangu zina kasi kuliko mkimbiaji; zinakimbia, wala hazioni mema[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ustawi” au “hali njema” badala ya “mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Siku zangu
  rationale: Huhifadhi nahau ya Kiebrania inayorejelea siku za maisha ya Ayubu kwa umilikaji wa moja kwa moja.
- source_word: קַלוּ
  choice: ni nyepesi
  rationale: Neno lina maana ya kuwa mwepesi au wa haraka; pamoja na ulinganisho na mkimbiaji, usemi huu unaonyesha kasi huku ukihifadhi taswira ya msingi.
- source_word: מִנִּי רָץ
  choice: kuliko mkimbiaji
  rationale: מִן inaonyesha ulinganisho, na רָץ ni mtu anayekimbia; hakuna sababu ya kuibana maana iwe mjumbe maalumu.
- source_word: בָּרְחוּ
  choice: zinakimbia
  rationale: Kitenzi cha Kiebrania kina maana ya kukimbia au kutoroka; hapa kinazifanya siku zionekane zikiondoka kwa kasi.
- source_word: לֹא רָאוּ
  choice: wala hazioni
  rationale: Huhifadhi ukanushaji na tashihisi ya siku kuwa ndizo zinazoona.
- source_word: טוֹבָה
  choice: mema
  rationale: Huhifadhi upana wa maana ya טוֹבָה bila kuamua kimya kimya kuwa ni ustawi, heri, au jambo jingine jema.
