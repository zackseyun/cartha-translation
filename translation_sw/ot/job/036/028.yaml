  text: ambayo mawingu humwaga na kuyadondosha kwa wingi juu ya mwanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wanadamu; neno la Kiebrania liko katika umoja lakini hapa linamaanisha jamii ya binadamu kwa ujumla.
