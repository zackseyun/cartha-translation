lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiambishi cha uhusiano kinaunganisha mstari huu na kile kilichotajwa katika mstari uliotangulia bila kuongeza kiima au kitu kipya.
- source_word: יִזְּלוּ
  choice: humwaga
  rationale: Katika muktadha wa mvua, kitenzi hiki kinaeleza maji yanayotiririka au kumiminika kutoka mawinguni; ‘humwaga’ ni Kiswahili cha kawaida kinachohifadhi mwendo wa kuelekea chini.
- source_word: שְׁחָקִים
  choice: mawingu
  rationale: Katika taswira hii ya hali ya anga, neno hilo linamaanisha mawingu yanayotoa mvua, si anga kwa ujumla.
- source_word: יִרְעֲפוּ
  choice: hunyesha
  rationale: Kitenzi kinaeleza kudondosha au kumwaga mvua kutoka juu. ‘Honyesha’ hapa ni tafsiri ya asili ya tendo la mawingu na haiongezi kiwango kisichokuwapo, kwa kuwa wingi unaelezwa na רָב.
- source_word: עֲלֵי
  choice: juu ya
  rationale: Inahifadhi picha ya mvua ikishuka kutoka juu na kuwafikia walio chini.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Umoja wa jumla wa Kiebrania umehifadhiwa. Katika Kiswahili, ‘mwanadamu’ kwa kawaida humaanisha binadamu yeyote, si mwanamume pekee.
- source_word: רָב
  choice: kwa wingi
  rationale: Neno hili limetumiwa kwa maana ya kielezi kuonyesha kiasi kikubwa cha mvua.
theological_decisions:
- issue: Maana ya jumla ya אָדָם
  choice: mwanadamu
  alternative: wanadamu / watu
  rationale: ‘Mwanadamu’ huhifadhi umoja wa Kiebrania huku ikieleweka kwa kawaida kuwa jina la jumla la jamii ya binadamu. Tanbihi inaweka wazi maana hiyo bila kuifanya kuwa ya jinsia ya kiume pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini rahisi. Muundo tegemezi wa ‘ambayo’ umehifadhiwa ili kuendeleza sentensi ya mstari uliotangulia; mistari miwili inaakisi ulinganifu wa kishairi wa Kiebrania.
