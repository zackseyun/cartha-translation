base_translation:
  language: en
  yaml_path: translation/ot/job/036/008.yaml
  text: And if they are bound in chains[a], caught in cords of affliction[b],
translation:
  language: sw
  text: Na ikiwa wamefungwa kwa minyororo[a], wamenaswa kwa kamba za mateso[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa pingu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kamba za taabu” au “kwa kamba za umaskini”; neno la Kiebrania linaweza kumaanisha mateso, taabu, au umaskini kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Huhifadhi kiunganishi וְ pamoja na sharti אִם kwa Kiswahili cha kawaida na kuendeleza mtiririko wa hotuba ya Elihu.
- source_word: אֲסוּרִים
  choice: wamefungwa
  rationale: Huhifadhi maana ya hali tendwa ya kitenzi אסר, ‘kufunga,’ bila kuibadili kuwa nomino kama ‘wafungwa.’
- source_word: בַּזִּקִּים
  choice: kwa minyororo
  rationale: Neno hili humaanisha vyombo vya kumzuia mtu, kama minyororo au pingu. ‘Kwa minyororo’ ni wazi na huendeleza taswira halisi ya kufungwa.
- source_word: יִלָּכְדוּן
  choice: wamenaswa
  rationale: Huhifadhi maana tendwa ya Niphal ya לכד, yaani kukamatwa au kunaswa, na inaendana vizuri na taswira ya kamba.
- source_word: בְּחַבְלֵי
  choice: kwa kamba za
  rationale: חבל inaweza kumaanisha kamba au utepe wa kufungia. ‘Kamba za’ huhifadhi sitiari halisi na ulinganifu wake na minyororo.
- source_word: עֹנִי
  choice: mateso
  rationale: עֹנִי inaweza kuashiria dhiki, taabu, mateso, au umaskini. Katika muktadha huu ‘mateso’ huonyesha hali ya kuteseka kwa upana bila kuibana maana iwe umaskini pekee.
theological_decisions:
- issue: Asili ya taswira ya kufungwa
  choice: Kudumisha taswira halisi ya minyororo na kamba huku ikiruhusu pia kueleweka kisitiari kuwa mateso au nidhamu ya Mungu.
  alternative: Kuitafsiri kama kifungo halisi pekee, au kama shida ya kisitiari pekee.
  rationale: Maneno ya mstari ni halisi na dhahiri, lakini muktadha wa hotuba ya Elihu unahusu jinsi Mungu anavyoshughulika na wanaoteseka. Tafsiri hailazimishi upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na ulinganifu wa ‘minyororo’ na ‘kamba’ umehifadhiwa; alama zote za tanbihi zimo katika matini kuu.
