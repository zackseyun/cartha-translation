base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: sw
  text: Kama wakisikiliza[a] na kutumikia, wataishi siku zao katika hali njema[b], na miaka yao katika raha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakisikia na kutii”; kitenzi cha Kiebrania kinachotafsiriwa “kusikiliza” kinaweza pia kumaanisha kusikia kunakoambatana na utiifu katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “watamaliza siku zao katika mema, na miaka yao katika mambo ya kupendeza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Hutambulisha sharti wazi katika kauli ya Elihu.
- source_word: יִשְׁמְעוּ
  choice: wakisikiliza
  rationale: Kitenzi שׁמע kinaweza kumaanisha kusikia, kusikiliza, au kutii; ‘kusikiliza’ huhifadhi maana ya msingi huku muktadha ukidokeza kuitikia kwa utiifu.
- source_word: וְיַעֲבֹדוּ
  choice: na kutumikia
  rationale: עבד hapa ni ‘kutumikia’; neno hili ni pana kuliko ‘kuabudu’ na halifungi maana kwenye ibada za kidini pekee.
- source_word: יְכַלּוּ יְמֵיהֶם
  choice: wataishi siku zao
  rationale: Ingawa כלה kimsingi ni kumaliza au kukamilisha, pamoja na ‘siku zao’ ni nahau ya kuishi kipindi hicho hadi mwisho; Kiswahili hiki ni cha asili na hakipendekezi kwamba watazikatisha siku hizo.
- source_word: בַּטּוֹב
  choice: katika mema
  rationale: טוֹב iliyotumiwa kama nomino huonyesha hali njema au mambo mema; ‘katika mema’ huhifadhi upana wake bila kuibana kuwa utajiri wa mali.
- source_word: וּשְׁנֵיהֶם
  choice: na miaka yao
  rationale: Huhifadhi usambamba wa kishairi na ‘siku zao.’
- source_word: בַּנְּעִימִים
  choice: katika mambo ya kupendeza
  rationale: Wingi wa נעים unaweza kutaja raha, mambo yenye kupendeza, au hali ya kupendeza; tafsiri hii ni ya asili na huhifadhi upana huo.
theological_decisions:
- issue: Iwapo mstari huu unaahidi mafanikio ya kimwili kama kanuni ya lazima kwa wote
  choice: Kauli ya masharti ya Elihu imetafsiriwa moja kwa moja bila kuipanua kuwa ahadi ya ulimwengu wote.
  alternative: Kuitafsiri kama dhamana kwamba utiifu daima huleta utajiri wa kidunia, au kuifanya ihusu baraka za kiroho pekee.
  rationale: Kiebrania kinataja hali njema ya maisha katika madai ya hekima ya Elihu. Tafsiri inapaswa kuhifadhi madai hayo na mvutano wake ndani ya kitabu bila kuyafanya fundisho la lazima wala kuyageuza kuwa ya kiroho tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wataishi siku zao’ hutoa kwa njia ya kawaida nahau ya Kiebrania ya kuzimaliza siku; ‘mema’ huepuka kuingiza dhana finyu ya utajiri, na ‘mambo ya kupendeza’ huhifadhi usambamba wa kishairi.
