  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: sw
  text: Haondoi macho yake kwa wenye haki, bali huwaketisha pamoja na wafalme kwenye kiti cha enzi milele[a], nao huinuliwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “naye huwaketisha wafalme kwenye kiti cha enzi milele.” Kiebrania ni kifupi, na wengine huelewa kuwa kishazi hiki kinazungumza moja kwa moja kuhusu wafalme, si kuhusu wenye haki kuketishwa pamoja nao.'
    reason: alternative_reading
  - marker: b
    text: 'Au: “naye huwainua.” Kitenzi cha mwisho kinaweza kueleweka katika kauli tendi, Mungu akiwa mtendaji anayeeleweka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: hawaondolei
  rationale: Kitenzi גרע humaanisha kupunguza au kuondoa. Pamoja na ‘macho yake,’ ‘hawaondolei’ kinahifadhi picha ya Mungu kutoacha kuwatazama wenye haki na ni usemi wa asili katika Kiswahili.
- source_word: מִצַּדִּיק
  choice: wenye haki
  rationale: Umoja wa Kiebrania umetumiwa kwa maana ya kundi au tabaka. Wingi ‘wenye haki’ unaeleza maana hiyo kwa Kiswahili cha kawaida bila kuifungamanisha na mwanamume mmoja.
- source_word: עֵינָיו
  choice: macho yake
  rationale: Tafsiri halisi inadumisha lugha ya picha inayosema Mungu huwaangalia wenye haki, badala ya kuibadili kuwa dhana kama ‘uangalizi wake.’
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: bali ... pamoja na wafalme kwenye kiti cha enzi
  rationale: Kishazi cha Kiebrania ni kifupi na kina utata. Chaguo hili linaunganisha wenye haki na heshima ya kifalme bila kuongeza kitenzi kingine kisichotajwa wazi katika Kiebrania; uwezekano wa kwamba ‘wafalme’ ndio yambwa umewekwa katika tanbihi.
- source_word: וַיֹּשִׁיבֵם
  choice: huwaketisha
  rationale: Hifili ya ישׁב ina maana ya kusababisha wakae au kuwaketisha. ‘Huwaketisha’ ni wazi na haiongezi kwa lazima dhana maalumu zaidi ya kuwatawaza.
- source_word: לָנֶצַח
  choice: milele
  rationale: Neno hili linaonyesha muda unaodumu; ‘milele’ ni tafsiri fupi, ya kawaida, na inayofaa ushairi wa kifungu.
- source_word: וַיִּגְבָּהוּ
  choice: nao huinuliwa
  rationale: Kitenzi cha mwisho ni kifupi na kinaweza kueleza wao kuinuliwa au kuwa juu. Kauli tendwa ‘huinuliwa’ inaonyesha matokeo ya hadhi yao bila kulazimisha uchanganuzi mmoja wa kisarufi.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu uangalizi wa Mungu
  choice: Kudumisha usemi halisi ‘macho yake.’
  alternative: Kutafsiri ‘uangalizi wake’ au ‘utunzaji wake.’
  rationale: Picha ya Kiebrania inaeleza kwamba Mungu haachi kuwaangalia wenye haki. Kuidumisha kunahifadhi nguvu ya kishairi bila kuifanya kuwa kauli ya kifalsafa.
- issue: Wanaorejelewa na kiwakilishi katika kishazi cha kifalme
  choice: Kukielekeza kwa wenye haki, wanaoketishwa pamoja na wafalme na kuinuliwa.
  alternative: Kukielekeza kwa wafalme ambao Mungu huwaketisha kwenye kiti cha enzi milele.
  rationale: ‘Mwenye haki’ wa umoja wa kijumla anaweza kuwa rejeleo la wingi linalofuata, lakini muundo mfupi wa Kiebrania unaruhusu ufafanuzi mwingine; hivyo uwezekano huo umehifadhiwa katika tanbihi.
- issue: Mtendaji wa kitenzi cha mwisho
  choice: Kutumia kauli tendwa ‘huinuliwa.’
  alternative: Kutumia kauli tendi ‘naye huwainua,’ Mungu akiwa mtendaji anayeeleweka.
  rationale: Kauli tendwa inaonyesha matokeo bila kuamua kimyakimya utata wa umbo la mwisho; tafsiri tendi imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kishairi lakini unaeleweka kwa msomaji wa kawaida. ‘Wenye haki’ hutumika kwa maana ya kundi, na ‘kiti cha enzi’ huhifadhi taswira ya kifalme ya maandishi ya Kiebrania.
