  yaml_path: translation/ot/job/036/020.yaml
  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: sw
  text: Usiutamani usiku,[a] wakati mataifa yanapoondolewa mahali pao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na maneno ya Kiebrania, “Usiutamani usiku, kwa mataifa kupanda chini yao.” Kiebrania hapa ni kigumu; “yanapoondolewa mahali pao” kinaonyesha uelewa wa kawaida wa kimuktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Usi-
  rationale: אַל pamoja na kitenzi cha hali isiyotimilika hutoa katazo; kiambishi cha katazo katika Kiswahili kinawasilisha nguvu hiyo kwa kawaida.
- source_word: תִּשְׁאַף
  choice: utamani
  rationale: Kitenzi שׁאף kinaweza kumaanisha kuhema kwa hamu au kutamani sana. Hapa ‘kutamani’ ni lugha ya kawaida inayofaa kwa usiku kama yambwa.
- source_word: הַלָּיְלָה
  choice: usiku
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya nomino hiyo katika Kiswahili.
- source_word: לַעֲלוֹת
  choice: wakati ... yanapoondolewa
  rationale: Muundo huu wa Kiebrania ni mgumu. Tafsiri ya wakati yenye maana ya kuondolewa inatoa uelewa unaowezekana katika muktadha, bila kuficha tafsiri halisi mbadala kwenye tanbihi.
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi huu unarejelea makundi ya watu au mataifa; ‘mataifa’ huhifadhi maana ya kijamii na ya wingi kwa Kiswahili cha kawaida.
- source_word: תַּחְתָּם
  choice: mahali pao
  rationale: Ingawa תחת kwa kawaida humaanisha ‘chini,’ katika muktadha huu inaeleweka kuwa mahali au nafasi walipo; ‘mahali pao’ huwasilisha uelewa huo wa kimuktadha.
