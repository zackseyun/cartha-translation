  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: sw
  text: Lakini wasiposikiliza, wataangamia kwa upanga, nao watakufa bila maarifa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kukosa maarifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini wasipo-
  rationale: Muundo wa sharti wenye ‘lakini’ unaonyesha tofauti na ahadi ya mstari uliotangulia kwa Kiswahili cha kawaida.
- source_word: לֹא יִשְׁמְעוּ
  choice: wasiposikiliza
  rationale: ‘Kusikiliza’ huhifadhi upana wa maana ya kusikia na kuitikia, bila kuibana kuwa kusikia tu au kutii moja kwa moja.
- source_word: בְּשֶׁלַח
  choice: kwa upanga
  rationale: Katika muktadha wa hukumu, nomino hii inaashiria silaha ya kuua; ‘upanga’ ni tafsiri ya kawaida na inayoeleweka vizuri.
- source_word: יַעֲבֹרוּ
  choice: wataangamia
  rationale: Ingawa kitenzi kimsingi ni ‘kupita,’ hapa kinatumika katika muktadha wa kifo. ‘Wataangamia’ huwasilisha maana hiyo kwa Kiswahili cha asili na kudumisha ulinganifu na kishazi kinachofuata.
- source_word: וְיִגְוְעוּ
  choice: nao watakufa
  rationale: Kitenzi גוע humaanisha kufa au kukata roho; ‘watakufa’ ni wazi, cha heshima, na cha kawaida.
- source_word: כִּבְלִי דָעַת
  choice: bila maarifa
  rationale: Tafsiri hii inafuata kwa karibu wazo la hali ya kutokuwa na maarifa, huku uwezekano wa maana ya kisababishi ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Iwapo שׁמע ina maana ya kusikia tu au kuitikia kwa utii
  choice: wasiposikiliza
  alternative: wasiposikia; wasipotii
  rationale: ‘Kusikiliza’ huhifadhi mvutano wa maana kati ya kusikia na kuzingatia maagizo ya Mungu bila kuingiza ufafanuzi mwembamba.
- issue: Iwapo כִּבְלִי דָעַת inaonyesha hali au sababu
  choice: bila maarifa
  alternative: kwa kukosa maarifa
  rationale: Muundo wa Kiebrania unaunga mkono hali ya kutokuwa na maarifa, lakini maana ya kisababishi pia inawezekana na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Maarifa’ limetumiwa badala ya ‘ujuzi’ ili kufaa muktadha wa hekima na mafundisho; sentensi imewekwa fupi ili kuhifadhi ulinganifu wa kishairi.
