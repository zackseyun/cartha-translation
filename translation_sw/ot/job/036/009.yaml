  text: ndipo huwatangazia matendo yao na maasi yao[a], kwamba wamejivuna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “kwamba wamekuwa na nguvu”; katika muktadha huu huenda maana ni kwamba wamejiinua au wamejivuna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: ndipo huwaeleza
  rationale: Hifili ya נגד humaanisha kusema, kueleza, au kujulisha. Katika mfuatano wa masharti wa muktadha, “ndipo” huonyesha hatua inayofuata, na “huwaeleza” ni ya kawaida na yenye uzito unaofaa.
- source_word: לָהֶם
  choice: huwaeleza
  rationale: Kiambishi cha yambwa katika “huwaeleza” kinawakilisha kihusishi pamoja na kiwakilishi, yaani, ‘kwao.’
- source_word: פָּעֳלָם
  choice: matendo yao
  rationale: Neno hili linaweza kumaanisha kazi au tendo; likiwa sambamba na makosa yao, linarejelea mambo waliyotenda kwa upande wa maadili.
- source_word: וּפִשְׁעֵיהֶם
  choice: na makosa yao
  rationale: פשע hubeba maana ya kuvunja mipaka au kuasi mamlaka halali. “Makosa” ni neno la kawaida linalohifadhi uzito wa kimaadili bila kutumia istilahi nzito isiyo ya kawaida.
- source_word: כִּי
  choice: kwamba
  rationale: 'Hapa כִּי inaeleweka vizuri kuwa inaanzisha yaliyomo katika tangazo: Mungu huwaeleza kwamba wamejivuna.'
- source_word: יִתְגַּבָּרוּ
  choice: wamejivuna
  rationale: Hitpaeli ya גבר kwa maana halisi inaweza kueleza kujifanya mwenye nguvu; katika muktadha huu wa makosa inaashiria kujiinua kwa kiburi. “Wamejivuna” ni Kiswahili cha asili kinachowasilisha maana hiyo huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na umbo la Kiebrania.
theological_decisions:
- issue: Dokezo la kimaadili la יִתְגַּבָּרוּ
  choice: wamejivuna
  alternative: wamekuwa na nguvu; wamejifanya wenye nguvu
  rationale: Kutajwa pamoja na makosa yao kunafanya kujiinua kwa kiburi kuwa maana inayowezekana zaidi kuliko nguvu isiyo na upande wa kimaadili. Hata hivyo, tanbihi inadumisha uwazi kuhusu usemi halisi na utata wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Huwaeleza” linaendana na kauli ya jumla katika muktadha unaozungumzia jinsi Mungu hutenda; kistari kirefu kinaonyesha kwamba kishazi cha mwisho kinafafanua yaliyotangazwa.
