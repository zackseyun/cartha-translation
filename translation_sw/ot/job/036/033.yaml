  text: Ngurumo yake hutangaza habari kumhusu[a]; hata mifugo hutangaza[b] kuhusu kile kinachoinuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni kigumu. Kwa tafsiri ya moja kwa moja, maneno yanayotafsiriwa “ngurumo yake” yanaweza kusomwa “rafiki yake”; wengi huuelewa mstari huu kuwa unarejelea sauti ya dhoruba.
    reason: lexical_alternative
  - marker: b
    text: Au, “hata mifugo hutangaza kuhusu dhoruba inayokaribia.” Inaelekea kwamba kifungu cha mwisho kinarejelea dhoruba inayokaribia, lakini Kiebrania husema tu “kile kinachoinuka.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: hutangaza
  rationale: Hifili ya נגד ina maana ya kutangaza au kujulisha; ‘hutangaza’ inafaa kwa ushairi wenye hadhi.
- source_word: עָלָיו
  choice: habari zake
  rationale: על pamoja na kiambishi inaweza kumaanisha ‘kuhusu yeye’; ‘habari zake’ ni usemi wa kawaida wa Kiswahili bila kuamua kwa nguvu rejeo lenye utata.
- source_word: רֵעוֹ
  choice: ngurumo yake
  rationale: Umbo la Kiebrania ni gumu na kwa maana ya moja kwa moja linaweza kusomwa ‘rafiki yake’; muktadha wa dhoruba unaunga mkono kuelewa kelele au ngurumo.
- source_word: מִקְנֶה
  choice: mifugo
  rationale: Neno hili kwa kawaida humaanisha mifugo; hapa wanyama wanaweza kuashiria dhoruba inayokaribia.
- source_word: אַף
  choice: hata ... pia
  rationale: Huwakilisha nyongeza yenye mkazo katika mstari wa pili.
- source_word: עַל
  choice: kuhusu
  rationale: Huhifadhi maana ya kawaida ya ‘juu ya/kuhusu’ bila kulazimisha tafsiri maalumu.
- source_word: עוֹלֶה
  choice: kile kinachoinuka
  rationale: Kitenzi shirikishi cha עלה humaanisha kinachopanda au kuinuka; tafsiri hii haibainishi kuwa ni dhoruba ingawa muktadha unaelekea huko.
