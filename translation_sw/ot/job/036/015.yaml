  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: sw
  text: 'Huwaokoa wanaoteseka kwa mateso yao[a],

    na huyafungua masikio yao[b] kwa dhiki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huwaokoa maskini katika mateso yao.” Neno la Kiebrania linaweza kumaanisha maskini, mnyonge, au wanaoteseka; kihusishi kinaweza kutafsiriwa “kwa,” “kupitia,” au “katika.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni, “huyafunua masikio yao,” nahau inayomaanisha kuwafanya wasikilize au wapokee fundisho.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: Humwokoa
  rationale: Kitenzi hiki katika Piel kina maana ya kumtoa mtu katika hatari au shida; “humwokoa” ni Kiswahili cha sasa, wazi, na chenye nguvu ya tendo la kuokoa.
- source_word: עָנִי
  choice: mwenye kuteswa
  rationale: Neno linaweza kumaanisha maskini, mnyonge, au mtu anayeteswa. Muktadha sambamba wa עָנְיוֹ na לַחַץ unapendelea maana pana ya mtu aliye katika mateso kuliko umaskini wa kiuchumi pekee.
- source_word: בְעָנְיוֹ
  choice: kupitia mateso yake
  rationale: Kihusishi ב kinaweza kuonyesha njia au mazingira. “Kupitia” huhifadhi uwezekano wa mateso kuwa njia anayotumia Mungu, bila kufuta kabisa wazo la kuwa ndiyo mazingira ya wokovu; kiwakilishi cha umoja kinafuata עָנִי na עָנְיוֹ.
- source_word: וְיִגֶל
  choice: huyafungua
  rationale: Maana ya msingi ni kufunua, lakini ikiwa na “masikio” ni nahau ya kumwezesha mtu kusikia, kutii, au kupokea fundisho. “Huyafungua” huhifadhi picha ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: בַּלַּחַץ
  choice: kwa njia ya dhiki
  rationale: לַחַץ inaweza kuwa shinikizo, uonevu, au dhiki. “Dhiki” inafaa kwa upana wa maana hapa, na “kwa njia ya” huonyesha matumizi ya dhiki kama chombo, sambamba na kishazi cha kwanza.
- source_word: אָזְנָם
  choice: masikio yao
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu wingi. Tafsiri inadumisha wingi huo hata baada ya nomino ya umoja inayotumiwa kwa maana ya jumla.
theological_decisions:
- issue: Mateso kama njia ya Mungu ya kuokoa na kufundisha
  choice: 'Kutafsiri vihusishi kwa maana ya njia: “kupitia mateso” na “kwa njia ya dhiki,” huku bila kuongeza dai kwamba mateso yote ni mema au ni adhabu ya moja kwa moja.'
  alternative: Kutafsiri “katika mateso yake” na “katika dhiki,” kana kwamba mateso ni mazingira tu, si njia.
  rationale: Ulinganifu wa vishazi viwili vyenye ב unaunga mkono maana ya chombo au njia. Hata hivyo, mstari unasalia kuwa kauli ya Elihu ndani ya mvutano wa kitabu cha Ayubu; tafsiri haipaswi kuibadili kuwa kanuni rahisi ya kwamba mateso yote ni ya kuadhibu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwenye kuteswa” na “dhiki” hudumisha uwanja mpana wa mateso, uonevu, na shinikizo. Mpangilio wa alama za tanbihi umewekwa karibu na mada husika: [a] baada ya kishazi cha kwanza na [b] baada ya nahau ya kufungua masikio.'
