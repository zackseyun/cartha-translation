lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: Nivumilie kidogo
  rationale: Kauli hii ni ombi la Elihu kwa msikilizaji aendelee kumstahimili kwa muda mfupi; ni Kiswahili cha kawaida na chenye heshima.
- source_word: וַאֲחַוֶּךָּ
  choice: nami nitakuonyesha
  rationale: Huhifadhi maana ya kitenzi cha kuonyesha au kueleza jambo kwa mtu bila kuongeza kile kitakachoonyeshwa.
- source_word: כִּי עוֹד לֶאֱלוֹהַּ מִלִּים
  choice: kwa maana bado nina maneno kwa ajili ya Mungu
  rationale: Kirai cha Kiebrania kihalisi kina 'bado maneno kwa/ya Mungu'; kitenzi 'nina' kinawekwa wazi kwa Kiswahili asilia, huku 'kwa ajili ya Mungu' kikihifadhi wazo la kusema kwa upande au kwa heshima ya Mungu bila kulibana kuwa maana moja tu.
theological_decisions:
- issue: Maana ya לֶאֱלוֹהַּ katika kauli ya Elihu
  choice: kwa ajili ya Mungu
  alternative: kwa niaba ya Mungu
  rationale: '''Kwa ajili ya Mungu'' hufuata ushahidi wa chanzo na kuhifadhi upana wa kihusishi לְ; ''kwa niaba ya Mungu'' kingedai wazi zaidi kwamba Elihu ni mwakilishi rasmi wa Mungu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja, ikidumisha sauti ya Elihu bila kuongeza maelezo ya kimadhehebu.
