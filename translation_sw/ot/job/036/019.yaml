  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: sw
  text: Je, kilio chako kitakufaa dhiki inapokuja[b][a], au juhudi zako zote za nguvu zitakufaa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata ufafanuzi mwingine wa Kiebrania hiki kigumu, “Je, utajiri wako utakufaa ili usiwe katika dhiki, au nguvu zako zote?”
    reason: alternative_reading
  - marker: b
    text: Kiebrania cha mstari huu ni kigumu, hasa katika maneno ambayo kwa kawaida hutafsiriwa “kilio chako” na “si katika dhiki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: kitakufaa
  rationale: Kitenzi ערך kwa kawaida humaanisha ‘kupanga’ au ‘kuweka tayari,’ lakini katika muktadha huu mgumu wa kishairi kinaeleweka kwa njia ya kimethali kuwa ‘kufaa’ au ‘kutosha.’
- source_word: שׁוּעֲךָ
  choice: kilio chako
  rationale: Uwekaji wa irabu katika MT unaunga mkono maana ya ‘kilio cha kuomba msaada.’ Tafsiri mbadala ‘utajiri wako’ imehifadhiwa katika tanbihi kwa sababu Kiebrania cha mstari huu ni kigumu.
- source_word: לֹא בְצָר
  choice: dhiki inapokuja
  rationale: Ingawa לֹא kwa kawaida ni ‘si,’ kishazi hiki kifupi cha kishairi kinaweza kueleweka kuwa hali ya wakati wa dhiki. Tafsiri hii ni ya asili katika Kiswahili, huku uchambuzi wenye ukanushi ukihifadhiwa katika tanbihi mbadala.
- source_word: וְכֹל
  choice: au ... zote
  rationale: Kiunganishi ו kinaingiza njia nyingine inayodhaniwa ya msaada katika swali hili la balagha; ‘au’ huonyesha kwamba si kilio wala nguvu zote zitakazofaa.
- source_word: מַאֲמַצֵּי כֹחַ
  choice: juhudi zako zote za nguvu
  rationale: Neno מַאֲמַצֵּי linaonyesha juhudi au kujikaza, na כֹחַ nguvu. Usemi huu unahifadhi vipengele vyote viwili bila kufafanua kupita kiasi; ‘zako’ inaeleweka kutokana na mazungumzo ya moja kwa moja na usambamba.
