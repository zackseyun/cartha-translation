  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: sw
  text: Kwa maana ghadhabu—jihadhari isikuchochee kufanya dhihaka[a]; wala usiruhusu fidia kubwa[b][c] ikukengeushe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikakuchochea kupiga makofi.” Neno la Kiebrania lililotafsiriwa “kufanya dhihaka” ni gumu; huenda likarejelea kupiga mikono au kupiga makofi, labda kama ishara ya dharau.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala usiruhusu wingi wa fidia ukukengeushe,” au “wala usiruhusu fidia kubwa ikuelekeze kando.” Kiebrania kinaweza kueleweka kuwa “kubwa” linaifafanua “fidia” moja kwa moja.
    reason: alternative_reading
  - marker: c
    text: “Fidia” pia inaweza kueleweka kuwa “malipo ya upatanisho,” au katika baadhi ya miktadha, “hongo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha msingi wa onyo linalofuata; pia inaweza kutafsiriwa “kwa kuwa.”
- source_word: חֵמָה
  choice: ghadhabu
  rationale: Neno hili linaonyesha hasira kali. Tafsiri haibainishi ikiwa ni ghadhabu ya Mungu, ghadhabu ya Ayubu, au ghadhabu kwa ujumla, kwa kuwa Kiebrania hakitaji wazi mhusika.
- source_word: פֶּן
  choice: jihadhari isije
  rationale: Muundo huu wa Kiswahili unaonyesha onyo dhidi ya jambo linaloweza kutokea.
- source_word: יְסִיתְךָ
  choice: ikakuchochea
  rationale: Kitenzi hiki kinaweza kumaanisha kuchochea, kushawishi, au kupotosha. “Kukuchochea” kinafaa katika onyo la kuongozwa kwenye mwitikio mbaya.
- source_word: בְסָפֶק
  choice: kufanya dhihaka
  rationale: Neno hili ni gumu na maana yake inajadiliwa. Katika muktadha huu huenda likaonyesha tendo la dharau au dhihaka; uwezekano wa maana halisi ya kupiga mikono umehifadhiwa katika tanbihi.
- source_word: וְרָב
  choice: kubwa
  rationale: Linaonyesha ukubwa au wingi na hapa linaeleweka kwa kawaida kuwa linakifafanua “fidia.”
- source_word: כֹּפֶר
  choice: fidia
  rationale: Neno linaweza kumaanisha malipo ya kumkomboa mtu au ya kuepusha adhabu, na wakati mwingine hongo. “Fidia” huhifadhi upana wa maana bila kuamua muktadha kupita kiasi.
- source_word: אַל יַטֶּךָּ
  choice: usiruhusu ... ikupotoshe
  rationale: Kitenzi kina maana ya kugeuza, kukengeusha, au kuathiri upande fulani. “Ikupotoshe” ni cha asili katika Kiswahili na kinahifadhi wazo la kuondolewa katika njia inayofaa.
theological_decisions:
- issue: Mhusika anayehusishwa na “ghadhabu”
  choice: Kuacha “ghadhabu” bila kubainisha ni ya nani
  alternative: “ghadhabu ya Mungu” au “ghadhabu yako”
  rationale: Kiebrania hakimtaji wazi mwenye ghadhabu, na muktadha unaweza kuruhusu zaidi ya ufafanuzi mmoja. Tafsiri inaacha mvutano huo wa kitheolojia wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama ya mkato mrefu inadumisha msisitizo na mvutano wa onyo la Kiebrania.
