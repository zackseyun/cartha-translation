lexical_decisions:
- source_word: יְחַיֶּה
  choice: hawaachi ... waendelee kuishi
  rationale: Piel ya חיה hapa inaelekea kumaanisha kumwacha mtu aendelee kuwa hai au kumhifadhi hai, si kumfufua wala kumpa uhai kwa maana ya kiteolojia.
- source_word: רָשָׁע
  choice: waovu
  rationale: Ingawa neno la Kiebrania ni umoja kimaumbo, limetumiwa kwa maana ya jumla; wingi wa Kiswahili unasikika kwa kawaida na kuhifadhi maana hiyo.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha huu ni haki au matokeo ya haki wanayostahili walio taabuni, si tendo la hukumu pekee.
- source_word: עֲנִיִּים
  choice: walio taabuni
  rationale: Neno עָנִי linaweza kuwahusu maskini, wanyonge, wanaoonewa, au walioteseka; 'walio taabuni' huhifadhi upana huo bila kuufunga katika umaskini wa mali pekee.
- source_word: יִתֵּן
  choice: huwapatia
  rationale: Kitenzi נתן kimsingi ni 'kutoa'; kwa Kiswahili, 'kuwapatia haki' huwasilisha kwa kawaida kwamba Mungu anawapa haki wale wanaotaabika.
- source_word: וּ
  choice: bali
  rationale: Ingawa וּ kwa kawaida ni 'na', hapa inaunganisha vipashio viwili kwa ulinganisho wa kupingana; 'bali' huonyesha uhusiano huo wazi.
theological_decisions:
- issue: Iwapo יְחַיֶּה ieleweke kuwa kufufua au kutoa uhai kwa maana maalumu ya kiteolojia
  choice: Kutafsiriwa kama 'hawaachi ... waendelee kuishi', kwa maana ya kutowahifadhi waovu hai.
  alternative: '''hawapi uhai'' au ''hawafanyi waishi'''
  rationale: 'Muktadha unazungumzia utawala wa Mungu wenye haki: hawahifadhi waovu hai, bali huwapatia haki walio taabuni. Maana ya ufufuo ingeongeza dai ambalo mstari wenyewe haulazimishi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. 'Hawaachi ... waendelee kuishi' ni lugha ya kawaida inayoepuka kudokeza ufufuo; 'walio taabuni' huhifadhi wigo mpana wa עֲנִיִּים.
