  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: sw
  text: Hawahifadhi waovu hai,[a] bali huwapa haki walio taabuni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawaachi waovu waendelee kuishi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maskini”; neno la Kiebrania linaweza kumaanisha maskini, wanyonge, wanaoonewa, au walioteseka.
