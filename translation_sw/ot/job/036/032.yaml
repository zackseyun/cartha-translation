lexical_decisions:
- source_word: כַּפַּיִם
  choice: mikono yake
  rationale: Nomino hii katika umbo la uwili huonyesha viganja au mikono. “Mikono yake” ni ya kawaida zaidi katika Kiswahili huku ikihifadhi taswira ya mwili.
- source_word: כִּסָּה
  choice: huifunika
  rationale: Kitenzi kina maana ya kufunika au kusitiri. “Huifunika” kinadumisha taswira halisi bila kuifafanua kupita kiasi.
- source_word: אוֹר
  choice: umeme
  rationale: Kwa kawaida neno hili humaanisha “nuru,” lakini katika muktadha wa dhoruba hapa linaelekea kumaanisha umeme.
- source_word: וַיְצַו
  choice: kuuamuru
  rationale: Kitenzi צוה humaanisha kuamuru au kuagiza. Kiambishi cha yambwa kinaurejelea umeme katika tafsiri hii.
- source_word: עָלֶיהָ
  choice: kuuamuru
  rationale: Kiambishi cha kike kina rejeleo lisilo hakika. Kiswahili kinakirejelea kwa ngeli ya “umeme” ili sentensi iwe ya kawaida, bila kujaribu kutatua ugumu wote wa Kiebrania.
- source_word: בְמַפְגִּיעַ
  choice: upige shabaha
  rationale: Kirai hiki kigumu kinatokana na פגע, ambalo linaweza kuhusiana na kupiga, kukutana, au kuombea. Katika taswira ya dhoruba, kuelekeza umeme kwenye shabaha kunatoa maana yenye mshikamano.
theological_decisions:
- issue: Maana ya בְמַפְגִּיעַ
  choice: upige shabaha
  alternative: dhidi ya yule anayepigwa; dhidi ya mwombezi
  rationale: Muktadha wa dhoruba unaunga mkono wazo la umeme kuelekezwa kwenye shabaha, lakini tanbihi inahifadhi uwezekano mwingine badala ya kuingiza maana maalumu ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi umehifadhiwa katika mistari miwili; lugha ni wazi kwa msomaji wa kawaida huku tanbihi zikihifadhi utata halisi wa Kiebrania.
