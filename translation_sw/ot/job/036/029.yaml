  text: אַ֣ף אִם יָ֭בִין מִפְרְשֵׂי עָ֑ב תְּ֝שֻׁא֗וֹת סֻכָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/029.yaml
  text: Can anyone understand the spreading of the clouds[a], the thunderings of his shelter?
translation:
  language: sw
  text: Je, kuna yeyote anayeweza kuelewa kutanda kwa mawingu, miungurumo ya makao yake[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mishindo ya kibanda chake.” Maneno ya Kiebrania yanaweza kumaanisha miungurumo, mishindo, au makelele makubwa; neno lililotafsiriwa “makao” linaweza pia kumaanisha kibanda au kifuniko.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אִם
  choice: Je, kuna yeyote anayeweza
  rationale: Katika muktadha huu maneno haya yanaanzisha swali la balagha kuhusu uwezo wa mtu kuelewa matukio hayo; muundo huu ni wa asili katika Kiswahili.
- source_word: יָבִין
  choice: kuelewa
  rationale: Kitenzi hiki humaanisha kuelewa au kutambua kwa ufahamu; ‘kuelewa’ ni neno la kawaida na pana linalofaa hapa.
- source_word: מִפְרְשֵׂי
  choice: kutanda
  rationale: Neno hili linaonyesha hali ya kuenea au kutandazwa; ‘kutanda’ linaeleza kwa kawaida jinsi mawingu yanavyoenea angani.
- source_word: עָב
  choice: mawingu
  rationale: Ingawa umbo la Kiebrania ni la umoja, neno hilo linaweza kutaja mkusanyiko wa mawingu; wingi wa Kiswahili unaonyesha jambo hilo kwa kawaida.
- source_word: תְּשֻׁאוֹת
  choice: miungurumo
  rationale: Neno hili hutaja sauti kubwa, mishindo, au makelele. Katika muktadha wa dhoruba, ‘miungurumo’ linafaa bila kulifanya kuwa neno la kiufundi la radi pekee.
- source_word: סֻכָּתוֹ
  choice: makao yake
  rationale: סֻכָּה ni mahali pa kujisitiri, kibanda, au kifuniko. ‘Makao yake’ ni lugha ya kishairi inayoeleweka na inadumisha picha ya mahali pa Mungu pa kujisitiri bila kuingiza istilahi ya kidhehebu.
theological_decisions:
- issue: Kirejeleo cha kiambishi cha nafsi ya tatu ya kiume katika סֻכָּתוֹ
  choice: ‘yake’ kinamrejelea Mungu, ambaye mawingu ya dhoruba yanaelezwa kishairi kuwa makao yake.
  alternative: Kiambishi kinaweza kuhusishwa kwa jumla zaidi na dhoruba au wingu lenyewe kama mahali pake pa kufunika.
  rationale: Muktadha wa karibu unaeleza utawala wa Mungu juu ya hali ya anga. Kumchukua Mungu kuwa kirejeleo kunafaa zaidi katika mtiririko huo, huku sitiari ikiachwa bila kufafanuliwa kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Swali la balagha na picha ya kishairi ya mawingu kama makao ya Mungu zimehifadhiwa; tanbihi inaonyesha upana wa istilahi za Kiebrania.
