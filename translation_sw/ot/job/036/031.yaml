  text: כִּי בָ֭/ם יָדִ֣ין עַמִּ֑ים יִֽתֶּן אֹ֥כֶל לְ/מַכְבִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: sw
  text: 'Kwa maana kwa hayo yeye huhukumu mataifa;

    hutoa chakula kwa wingi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: kwa hayo
  rationale: Kiwakilishi cha wingi kinarejelea njia au matukio yaliyotangulia katika muktadha; “kwa hayo” huhifadhi rejeo lake bila kulibainisha zaidi kuliko Kiebrania.
- source_word: יָדִין
  choice: huhukumu
  rationale: Kitenzi דין hapa kina maana ya kuhukumu au kutawala kwa kutoa hukumu; kauli ya mazoea inafaa muktadha wa matendo ya Mungu.
- source_word: עַמִּים
  choice: mataifa
  rationale: Wingi wa עַם unaweza kumaanisha jamii za watu au mataifa; “mataifa” ni usemi wa kawaida na wenye hadhi katika muktadha huu.
- source_word: יִתֶּן אֹכֶל
  choice: hutoa chakula
  rationale: Tafsiri ya moja kwa moja na ya asili ya wazo la kumpa au kumruzuku mtu chakula.
- source_word: לְמַכְבִּיר
  choice: kwa wingi
  rationale: Neno hili adimu linaonyesha wingi au tele; “kwa wingi” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Njia zilezile za Mungu hutumika kwa hukumu na kwa riziki
  choice: 'Imehifadhiwa sambamba: “kwa hayo ... huhukumu ...; hutoa chakula kwa wingi.”'
  alternative: Kubainisha “kwa mvua” au “kwa mawingu”
  rationale: Kiebrania kinatumia kiwakilishi kisichoeleza wazi rejeo lake. Tafsiri haipaswi kutatua kimya kimya utata huo wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa sentensi umehifadhi usambamba wa hukumu na utoaji wa chakula, huku kiwakilishi “kwa hayo” kikibaki na utata halisi wa rejeo lake.
