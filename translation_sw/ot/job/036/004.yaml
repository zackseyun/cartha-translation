base_translation:
  language: en
  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: sw
  text: Kwa maana hakika, maneno yangu si ya uongo; aliye mkamilifu katika maarifa yuko pamoja nawe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘Yeye aliye mkamilifu katika maarifa yuko pamoja nawe,’ huenda ikimrejelea Mungu badala ya Elihu mwenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: Kwa maana hakika
  rationale: כִּי inaunganisha kauli hii na madai yaliyotangulia, huku אָמְנָם ikisisitiza uhakika wa maneno ya Elihu. Muunganiko huu unahifadhi nguvu ya ufafanuzi na msisitizo wa Kiebrania.
- source_word: לֹא שֶׁקֶר מִלָּי
  choice: maneno yangu si ya uongo
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi ukanushaji wa wazi wa uongo au udanganyifu katika maneno ya msemaji.
- source_word: תְּמִים
  choice: mkamilifu
  rationale: Neno hili lina wazo la ukamilifu, utimilifu au uadilifu. ‘Mkamilifu’ linahifadhi ujasiri wa kauli ya Elihu bila kuongeza dai maalumu la kutokuwa na dhambi.
- source_word: דֵּעוֹת
  choice: maarifa
  rationale: Ingawa umbo la Kiebrania ni la wingi, hapa linatumika kwa maana pana ya maarifa. ‘Maarifa’ ni chaguo la asili na lenye hadhi katika Kiswahili.
- source_word: עִמָּךְ
  choice: yuko pamoja nawe
  rationale: Tafsiri hii inafuata moja kwa moja maana ya ‘pamoja na wewe’ na inahifadhi uwezekano kwamba msemaji anamrejelea yeye mwenyewe au Mungu.
theological_decisions:
- issue: Anayerejelewa na ‘aliye mkamilifu katika maarifa’
  choice: Kauli kuu inaelekea kujirejelea kwa Elihu, lakini haimtaji wazi kwa jina.
  alternative: Huenda maneno hayo yakamrejelea Mungu kuwa ndiye aliye mkamilifu katika maarifa na aliye pamoja na Ayubu.
  rationale: Muktadha wa karibu ni utetezi wa Elihu kuhusu ukweli wa maneno yake, hivyo kujirejelea kuna uwezekano mkubwa. Hata hivyo, sarufi ya Kiebrania hairuhusu uwezekano wa kumrejelea Mungu uondolewe kabisa; kwa hiyo utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Kauli fupi na yenye msisitizo inafuata muundo wa kishairi wa Kiebrania.
