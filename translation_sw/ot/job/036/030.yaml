lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni neno la kuvuta fikira kwa jambo linalofuata. “Tazama” linaendeleza uzito wa kishairi na linaeleweka katika Kiswahili cha sasa.
- source_word: פָּרַשׂ
  choice: anaitandaza
  rationale: Kitenzi kina maana ya kutandaza au kueneza. “Anaitandaza” kinahifadhi picha ya nuru inayonyoshwa juu ya kitu.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiambishi cha Kiebrania ni cha umoja wa kiume, lakini kinachorejelewa hakijatajwa wazi. Kiswahili “juu yake” kinahifadhi hali hiyo bila kulazimisha kwamba ni mtu au kitu.
- source_word: אוֹרוֹ
  choice: nuru yake
  rationale: Maana ya msingi ni “nuru yake,” ingawa katika muktadha wa dhoruba inaweza kumaanisha umeme au mwangaza mkali. “Nuru” linahifadhi upana wa neno la Kiebrania.
- source_word: וְשָׁרְשֵׁי
  choice: naye anaifunika mizizi ya
  rationale: “Mizizi” ni tafsiri halisi ya picha ya kishairi; inaweza kuashiria sehemu za chini kabisa au misingi.
- source_word: הַיָּם
  choice: bahari
  rationale: Neno hilo humaanisha bahari moja kwa moja; “maji” lingepanua maana bila ulazima.
- source_word: כִּסָּה
  choice: anaifunika
  rationale: Kitenzi humaanisha kufunika. Wakati wa sasa unaendana na maelezo ya kishairi ya matendo yanayoendelea katika muktadha.
theological_decisions:
- issue: Kinachorejelewa na עָלָיו
  choice: Juu yake
  alternative: Juu ya wingu au dhoruba
  rationale: Mstari wenyewe hautaji wazi kinachorejelewa. Tafsiri kuu inahifadhi utata huo, huku tanbihi ikionyesha uwezekano unaotokana na muktadha wa karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio adhimu lakini wa sasa. “Juu yake” limekusudiwa kuhifadhi kutotajwa wazi kwa kile kinachorejelewa, na “mizizi ya bahari” imeachwa kama taswira hai ya Kiebrania.
