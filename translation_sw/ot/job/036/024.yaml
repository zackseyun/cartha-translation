  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: sw
  text: Kumbuka kuitukuza kazi yake[a], ambayo watu wameiadhimisha kwa wimbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ambayo watu wameiona” au “ambayo watu wameitafakari.” Kitenzi cha Kiebrania שֹׁרְרוּ ni kigumu; wengine hukielewa kwa maana ya kuona badala ya kuimba.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Kumbuka
  rationale: Ni amri ya moja kwa moja kwa nafsi ya pili umoja; “Kumbuka” ni ya kawaida, wazi, na yenye hadhi katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha yaliyomo katika jambo linalopaswa kukumbukwa, si sababu.
- source_word: תַשְׂגִּיא
  choice: unapaswa kuitukuza
  rationale: Hifili ya שׂגא/שׂגה ina maana ya kufanya ionekane kuu au kuitukuza. Muundo huu unahifadhi nguvu ya himizo baada ya “Kumbuka” na unasikika kwa kawaida katika Kiswahili.
- source_word: פָעֳלוֹ
  choice: kazi yake
  rationale: “Kazi” inahifadhi maana pana ya tendo, shughuli, au yale Mungu aliyoyafanya bila kuibana mno.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi rejeshi kinaunganisha “kazi yake” na kishazi kinachofuata.
- source_word: שֹׁרְרוּ
  choice: wameiimba
  rationale: Ufafanuzi wa kimapokeo unaichukua kama kuimba au kuadhimisha kwa wimbo; kiambishi “-i-” kinaonyesha kwamba kazi yake ndiyo iliyoimbwa. Maana mbadala ya kuona au kutafakari imehifadhiwa katika tanbihi.
- source_word: אֲנָשִׁים
  choice: watu
  rationale: Katika Kiswahili, “watu” ndiyo tafsiri ya kawaida ya wingi wa wanadamu na haifuti tofauti ya kijinsia ya kisarufi, kwa kuwa majina ya watu kwa kawaida hayabagui jinsia kama Kiingereza.
theological_decisions:
- issue: Rejeo la kiambishi cha nafsi ya tatu umoja katika “kazi yake”
  choice: Kazi ya Mungu, huku kiwakilishi “yake” kikihifadhiwa
  alternative: Kusema wazi “kazi ya Mungu”
  rationale: Muktadha unaonyesha kwamba Elihu anazungumzia kazi ya Mungu, lakini Kiebrania kinatumia kiwakilishi; tafsiri inakihifadhi bila kuongeza jina lisilokuwamo katika mstari.
- issue: Maana ya שֹׁרְרוּ
  choice: wameiimba
  alternative: wameiona / wameitafakari
  rationale: Maana ya kuimba inafaa katika lugha ya kishairi na mapokeo ya kifasiri, lakini umbo la Kiebrania ni gumu; kwa hiyo uwezekano wa kuona au kutafakari umewekwa wazi katika tanbihi badala ya kutatuliwa kimya kimya.
- issue: Uwakilishi wa אֲנָשִׁים
  choice: watu
  alternative: wanaume
  rationale: Kiswahili sanifu hutumia “watu” kwa kundi la wanadamu kwa ujumla; “wanaume” lingedokeza jinsia ya kiume pekee kwa nguvu zaidi kuliko matumizi ya neno la Kiebrania katika muktadha huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi himizo la moja kwa moja na mtindo wa kishairi bila kutumia msamiati wa dhehebu fulani.
