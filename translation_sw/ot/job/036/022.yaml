  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: sw
  text: Tazama, Mungu ametukuka kwa nguvu zake[a]; ni mwalimu gani aliye kama yeye?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uweza wake” au “kwa uweza wake.”
