lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu wa msikilizaji; “Tazama” linadumisha uzito wa kishairi kwa Kiswahili sanifu.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa ni cheo cha kawaida cha Mungu, si jina maalumu; “Mungu” ndilo neno la kawaida na la asili katika muktadha huu.
- source_word: יַשְׂגִּיב
  choice: ametukuka
  rationale: Hifili ya שׂגב hapa ina wazo la kuwa juu au kutukuka. “Ametukuka” linaonyesha ukuu wa Mungu bila kulazimisha maana mahsusi zaidi kama kuwafanya wengine wawe salama.
- source_word: בְּכֹחוֹ
  choice: kwa nguvu zake
  rationale: Kirai hiki kinaweza kueleza njia au hali inayohusiana na kutukuka kwa Mungu. “Kwa nguvu zake” ni kifupi na cha asili huku kikihifadhi uwezekano wa maana ya kitumizi ya kihusishi ב.
- source_word: מִי כָמֹהוּ
  choice: ni ... gani aliye kama yeye?
  rationale: Hili ni swali la balagha linalosisitiza kwamba hakuna anayelingana naye.
- source_word: מוֹרֶה
  choice: mwalimu
  rationale: Neno hili humaanisha anayefundisha. “Mwalimu” ni tafsiri ya moja kwa moja, ya kawaida, na inayofaa swali la balagha.
theological_decisions:
- issue: Maana ya kutukuka kwa Mungu kuhusiana na nguvu zake
  choice: Mungu ametukuka kwa nguvu zake
  alternative: Mungu hutenda kwa nguvu kuu; au Mungu huwafanya wengine kuwa salama kwa nguvu zake
  rationale: Katika muktadha huu wa kishairi, wazo kuu ni ukuu wa Mungu unaohusiana na nguvu zake na kutolinganishwa kwake kama mwalimu. Tafsiri haiongezi dai pana la kimafundisho ambalo Kiebrania hakilitaji wazi.
- issue: Muundo wa swali kuhusu Mungu kama mwalimu
  choice: Ni mwalimu gani aliye kama yeye?
  alternative: Ni nani afundishaye kama yeye?
  rationale: Muundo uliochaguliwa unahifadhi jina/kauli ya Kiebrania מוֹרֶה na kusisitiza kutolinganishwa kwa Mungu; mbadala unaeleza tendo la kufundisha na pia unawezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Tazama” limehifadhiwa kama mwito wa kuvuta usikivu, na swali la mwisho limeundwa kwa Kiswahili cha asili.
