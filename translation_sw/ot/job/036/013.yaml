base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: sw
  text: Lakini wasiomcha Mungu moyoni[a] huweka hasira moyoni; hawapigi kilio kuomba msaada anapowafunga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanafiki moyoni” au “waovu moyoni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu anawafunga.” Kiunganishi cha Kiebrania kinaweza kueleza sababu badala ya wakati.
    reason: alternative_reading
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: wenye mioyo isiyomcha Mungu
  rationale: חנף humaanisha mtu asiyemcha Mungu, mwovu au mnafiki. Katika kitabu cha Ayubu, kutomcha Mungu linafaa zaidi kuliko unafiki wa kijamii pekee, na לֵב inaonyesha hali ya ndani ya mtu.
- source_word: יָשִׂימוּ אָף
  choice: huweka hasira moyoni
  rationale: Kauli ya Kiebrania ina maana halisi ya ‘kuweka hasira.’ Tafsiri hii ya Kiswahili inaonyesha kwamba wanaishikilia hasira ndani yao bila kuifanya dhana hiyo kuwa ghadhabu ya Mungu.
- source_word: לֹא יְשַׁוְּעוּ
  choice: hawalii kuomba msaada
  rationale: Kitenzi שׁוע katika muundo huu humaanisha kulia au kupaza sauti ili kuomba msaada. Kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: כִּי
  choice: anapo-
  rationale: 'כִּי inaweza kueleza wakati au sababu. Hapa maana ya wakati inaendana vizuri na muktadha: hawaombi msaada wakati wanapofungwa. Maana ya sababu imehifadhiwa katika tanbihi.'
- source_word: אֲסָרָם
  choice: anapowafunga
  rationale: אָסַר humaanisha kufunga, kutia pingu au kufungia. ‘Kuwafunga’ ni tafsiri ya moja kwa moja na pana, nayo inadumisha kiima cha umoja kinachoeleweka kutokana na muktadha.
theological_decisions:
- issue: Mhusika wa kiima cha umoja katika אֲסָרָם
  choice: Kiima kinaachwa bila kutajwa kwa jina katika ‘anapowafunga,’ kikieleweka katika muktadha kuwa Mungu.
  alternative: Kutafsiri waziwazi ‘Mungu anapowafunga.’
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja bila kutaja jina la kiima. Muktadha unaelekeza kwa Mungu, lakini kutolitaja jina lake hapa kunahifadhi muundo na mvutano wa matini chanzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Mioyo isiyomcha Mungu’ inadumisha msisitizo wa Kiebrania juu ya hali ya ndani; ‘huweka hasira moyoni’ inadumisha kwa kiasi picha ya nahau ya chanzi.
