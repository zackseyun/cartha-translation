lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Ni kiashiria cha msisitizo kinachoanzisha dai kwa uzito; “Tazama” huhifadhi nguvu yake ya kishairi kwa Kiswahili cha Biblia.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa ni neno la kishairi linalomtaja Mungu, bila ulazima wa kulipanua kuwa cheo maalumu.
- source_word: כַּבִּיר
  choice: mwenye nguvu
  rationale: Hueleza ukuu au uwezo. Tafsiri hii ni ya kawaida na huhifadhi wazo la nguvu katika marudio ya mstari.
- source_word: וְלֹא יִמְאָס
  choice: naye hamdharau mtu yeyote
  rationale: Kitenzi kinaweza kumaanisha kudharau, kukataa, au kutupilia mbali. Ingawa Kiebrania hakitaji yambwa, “mtu yeyote” huonyesha yambwa linalodokezwa bila kulibana kuwa kundi fulani.
- source_word: כֹּחַ לֵב
  choice: moyo wenye uwezo
  rationale: Huhifadhi taswira ya Kiebrania ya “nguvu/uwezo wa moyo” kwa Kiswahili kinachoeleweka; “moyo” hapa unaweza kuhusisha akili, ufahamu, au uthabiti wa kusudi.
theological_decisions:
- issue: Yambwa lisilotajwa la “hamdharau/hakatai”
  choice: hamdharau mtu yeyote
  alternative: hakatai; hatupilii mbali; hamdharau [bila kutaja yambwa]
  rationale: Kiebrania hakitaji yambwa waziwazi. Kuongeza “mtu yeyote” kunafanya Kiswahili kiwe kamili na kueleweka, huku tanbihi ikihifadhi hali hiyo ya kutotajwa katika chanzo.
- issue: Maana ya “nguvu ya moyo”
  choice: mwenye moyo wenye uwezo
  alternative: mwenye nguvu katika ufahamu; mwenye kusudi thabiti
  rationale: Usemi wa Kiebrania ni mfupi na wenye maana pana. Kutunza “moyo” huzuia tafsiri isiamue bila sababu kati ya ufahamu, akili, na uthabiti wa kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya wazo la כַּבִּיר yamehifadhiwa, na utata wa כֹּחַ לֵב umewekwa wazi kwa tanbihi.
