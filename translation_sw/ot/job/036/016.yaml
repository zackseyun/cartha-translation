  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: sw
  text: Naam, yeye amekuvuta kutoka kinywani mwa dhiki[a] hadi mahali pana, pasipo na kizuizi chini yake[b], na kilichowekwa mezani pako kimejaa unono[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika taya za mateso,” au “kutoka katika kinywa cha mahali pembamba.” Kiebrania huunganisha taswira ya dhiki na kubanwa, kinyume cha “mahali pana” kinachofuata.
    reason: lexical_alternative
  - marker: b
    text: Au “hadi mahali penye nafasi nyingi, pasipo kizuizi chini yake.” Kifungu cha Kiebrania ni kigumu.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “unono”; yaani, wingi wa chakula kinono au neema tele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Naam
  rationale: Huonyesha msisitizo na mwendelezo; “Naam” ni ya hadhi na ya kawaida katika lugha ya Biblia bila kuongeza maana isiyokuwapo.
- source_word: הֲסִיתְךָ
  choice: yeye anakuvuta
  rationale: Kitenzi kinaweza kumaanisha kushawishi au kuvuta. Katika muktadha wa kuondolewa dhikini, “anakuvuta” hudumisha wazo la kuelekezwa kutoka hali moja kwenda nyingine bila kuingiza kwa lazima maana hasi ya udanganyifu.
- source_word: מִפִּי צָר
  choice: kutoka katika kinywa cha dhiki
  rationale: Hudumisha taswira halisi ya “kinywa” na maana ya צַר kama dhiki au hali ya kubanwa, ambayo inatofautishwa na mahali pana.
- source_word: רַחַב
  choice: mahali pana
  rationale: Hudumisha taswira ya nafasi pana na ni Kiswahili cha kawaida kinachoeleweka.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: pasipo na kubanwa chini yake
  rationale: Kirai cha Kiebrania ni kigumu; tafsiri hii huhifadhi “chini yake” na kulinganisha ukosefu wa kubanwa na dhiki iliyo kama nafasi nyembamba.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: na kilichowekwa mezani pako
  rationale: נַחַת ni neno adimu na lisilo hakika hapa. Kwa kuhusishwa na meza, linaeleweka kwa kawaida kuwa kile kilichowekwa juu yake.
- source_word: מָלֵא דָשֶׁן
  choice: kimejaa unono
  rationale: “Unono” huhifadhi sitiari ya דָּשֶׁן kuhusu mafuta, chakula kinono, na wingi, huku tanbihi ikifafanua maana yake.
theological_decisions:
- issue: Mtendaji wa הֲסִיתְךָ ambaye hatajwi kwa jina
  choice: Kutumia “yeye” bila kuongeza jina “Mungu.”
  alternative: “Mungu anakuvuta”
  rationale: Muktadha unamtambulisha mtendaji kuwa Mungu, lakini mstari wenyewe una kitenzi cha nafsi ya tatu bila nomino iliyo wazi; “yeye” huhifadhi hali hiyo.
- issue: Taswira ya dhiki na nafasi pana
  choice: Kuhifadhi “kinywa cha dhiki” na “mahali pana.”
  alternative: “Anakuondoa taabuni na kukuweka huru”
  rationale: Ushairi wa mstari unategemea tofauti kati ya hali ya kubanwa na nafasi pana; kuifanya kuwa maelezo ya moja kwa moja kungepunguza taswira hiyo.
- issue: Maana ya נַחַת katika kifungu cha meza
  choice: “kilichowekwa mezani pako”
  alternative: “utulivu wa meza yako” au “mpangilio wa meza yako”
  rationale: Neno ni adimu na lina utata, lakini uhusiano wake na meza unaunga mkono maana ya kitu kilichowekwa; tafsiri haibainishi zaidi kama ni chakula au mpangilio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira za kishairi za Kiebrania zimehifadhiwa, huku tanbihi zikifafanua maneno yenye utata. Viwakilishi vya umoja vinafuata mhusika Ayubu.
