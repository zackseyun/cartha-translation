  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: sw
  text: Tazama, Mungu ni mkuu, wala hatumjui[a]; idadi ya miaka yake haiwezi kuchunguzwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “wala hatujui.” Yambwa “yeye” inadokezwa na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hakuna kuchunguza idadi ya miaka yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa msisitizo na linaendeleza uzito wa kishairi wa tamko.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa ni jina la kawaida la kishairi linalomtaja Mungu, si jina maalumu linalopaswa kunukuliwa kwa herufi za Kiswahili.
- source_word: שַׂגִּיא
  choice: mkuu
  rationale: Linadokeza ukuu au hali ya kutukuka; “mkuu” ni la kawaida, lenye heshima, na halibani maana kuwa nguvu pekee.
- source_word: וְלֹא נֵדָע
  choice: wala hatumjui
  rationale: Kiebrania kinasema kihalisi “wala hatujui” bila kutaja yambwa. Kiswahili cha kawaida kinaweza kuonyesha yambwa inayodokezwa na muktadha, yaani Mungu, bila kufafanua kiwango au aina ya kumjua.
- source_word: מִסְפַּר
  choice: idadi
  rationale: “Idadi” linaonyesha kiasi kinachoweza kuhesabiwa na linaingia kwa kawaida katika kirai “idadi ya miaka yake.”
- source_word: שָׁנָיו
  choice: miaka yake
  rationale: Huhifadhi taswira ya kishairi na ya kibinadamu inayotumiwa kuzungumzia muda wa kuwako kwa Mungu, bila kuibadili moja kwa moja kuwa istilahi ya kimafundisho kama “umilele.”
- source_word: וְלֹא חֵקֶר
  choice: haiwezi kuchunguzika
  rationale: Huwasilisha wazo la kutokuwapo kwa uwezekano wa kuchunguza au kutafuta mpaka wake, kwa Kiswahili cha kawaida na chenye uzito.
theological_decisions:
- issue: Yambwa iliyodokezwa katika וְלֹא נֵדָע
  choice: 'Kutaja yambwa katika Kiswahili: “hatumjui”'
  alternative: 'Kuacha kauli bila yambwa: “hatujui”'
  rationale: Mungu ndiye rejeleo la karibu, na kiambishi “-m-” hufanya sentensi iwe ya kawaida katika Kiswahili. Tanbihi inaonyesha wazi kwamba yambwa haikutajwa moja kwa moja katika Kiebrania.
- issue: Maana ya “miaka” ya Mungu
  choice: Kuhifadhi usemi “miaka yake”
  alternative: Kufasiri kuwa “umilele wake” au “muda wa maisha yake”
  rationale: Kiebrania kinatumia taswira ya miaka. Kuihifadhi kunatunza mvutano na ushairi wa matini bila kuingiza ufafanuzi wa kimfumo usiotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” na mpangilio wa vishazi huhifadhi uzito wa kishairi, huku “idadi” na “haiwezi kuchunguzika” vikifanya maana ieleweke kwa msomaji wa kawaida.
