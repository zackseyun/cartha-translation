lexical_decisions:
- source_word: וַיִּגֶל אָזְנָם
  choice: Huyafungua masikio yao
  rationale: Kitenzi גלה pamoja na ‘sikio’ ni nahau ya kulifanya sikio liwe tayari kusikia. Kiswahili cha kawaida hutumia wingi ‘masikio yao’; ‘huyafungua’ huhifadhi picha ya Kiebrania kwa lugha ya asili.
- source_word: לַמּוּסָר
  choice: wapokee nidhamu
  rationale: מוּסָר hujumuisha mafundisho yenye kusahihisha na kuadibisha. ‘Wapokee nidhamu’ huonyesha kusudi la kufunguliwa masikio na ni cha kawaida kuliko ‘kwa nidhamu’.
- source_word: וַיֹּאמֶר כִּי
  choice: na kuwaambia
  rationale: Ingawa אמר haina yambwa wazi, muundo wa Kiswahili ‘kuwaambia’ huwasilisha kwa kawaida usemi unaowahusu watu wale wale; כִּי hutambulisha yaliyosemwa na haihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: יְשֻׁבוּן
  choice: waache
  rationale: שוב ina maana ya kugeuka au kurudi. Pamoja na ‘kutoka katika uovu,’ ‘waache uovu’ ni Kiswahili cha kawaida kinachohifadhi wito wa kubadili mwenendo.
- source_word: מֵאָוֶן
  choice: uovu
  rationale: Katika muktadha huu אָוֶן ina maana ya kimaadili ya uovu au ubaya, si ‘taabu.’ ‘Uovu’ ni wazi, wa heshima, na hauzidishi uzito wa neno.
theological_decisions:
- issue: Asili ya מוּסָר katika hotuba ya Elihu
  choice: nidhamu yenye kufundisha na kusahihisha
  alternative: mafundisho pekee, au adhabu yenye mkazo mkubwa zaidi
  rationale: Muktadha unaonyesha mateso kama njia ya kufundisha na kuwaita watu waache uovu. ‘Nidhamu’ huhifadhi mvutano kati ya kufundisha na kusahihisha bila kuingiza nadharia maalumu kuhusu mateso.
- issue: Maana ya אָוֶן
  choice: uovu wa kimaadili
  alternative: taabu
  rationale: Wito wa kugeuka au kuacha kitu unaelekeza kwenye mwenendo mbaya katika mstari huu, ingawa neno hilo linaweza kumaanisha pia taabu katika miktadha mingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi ‘masikio yao’ ni wa kawaida kuliko umoja wa kijumla wa Kiebrania. Muundo unahifadhi sitiari ya kufungua masikio huku ukifanya uhusiano wa kusudi uwe wazi.
