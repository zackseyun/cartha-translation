  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: sw
  text: Huyafungua masikio yao ili wapokee nidhamu[a], na huwaambia wageuke kutoka katika uovu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho” au “masahihisho.”
