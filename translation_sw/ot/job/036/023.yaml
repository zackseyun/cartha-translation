base_translation:
  language: en
  yaml_path: translation/ot/job/036/023.yaml
  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: sw
  text: Ni nani aliyemwekea njia yake[a]? Au ni nani aliyesema, “Umetenda uovu[b]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyemshtaki kuhusu njia yake?” Kitenzi cha Kiebrania kinaweza pia kumaanisha kuweka, kuagiza, kukabidhi wajibu, au kusimamia.
    reason: lexical_alternative
  - marker: b
    text: Au, “dhuluma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha kwa Kiswahili cha kawaida.
- source_word: פָקַד
  choice: aliyemwekea
  rationale: Katika muundo huu kitenzi kinaweza kumaanisha kuweka, kuagiza, au kumwekea mtu jambo; ‘aliyemwekea’ hudumisha wazo la mtu mwingine kumpangia Mungu mwendo wake bila kufanya tafsiri kuwa nzito.
- source_word: עָלָיו
  choice: -m-…-e- (kumwekea)
  rationale: Kihusishi עַל kinaingizwa kwa njia ya utendaji katika kitenzi cha Kiswahili ‘kumwekea’, yaani kumwekea yeye njia.
- source_word: דַּרְכּוֹ
  choice: njia yake
  rationale: ‘Njia’ huhifadhi maana halisi na ya kimfano ya דֶּרֶךְ, ikijumuisha mwenendo au mwendo wa kutenda.
- source_word: וּמִי
  choice: Au ni nani
  rationale: Huunganisha swali la pili la balagha kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: אָמַר
  choice: aliyesema
  rationale: 'Wakati wa uliopita katika kishazi cha uhusiano huwasilisha changamoto ya balagha: ni nani aliyewahi kutoa shtaka hilo?'
- source_word: פָּעַלְתָּ
  choice: Umetenda
  rationale: Kitenzi ‘kutenda’ kinafaa katika usemi wa shtaka la kimaadili na kinaakisi maana ya kufanya au kutekeleza.
- source_word: עַוְלָה
  choice: uovu
  rationale: ‘Uovu’ ni neno la kawaida na lenye hadhi linaloweza kueleza kosa la kimaadili au tendo lisilo la haki; uwezekano mahsusi wa ‘dhuluma’ umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mhusika wa viambishi vya nafsi ya tatu ya kiume na kitenzi cha nafsi ya pili
  choice: 'Muktadha unaelekeza maneno haya kwa Mungu: hakuna anayemwekea njia yake wala kumshtaki kuwa ametenda uovu.'
  alternative: Kauli ya jumla kuhusu mtawala au mtu mwenye nguvu.
  rationale: Ayubu 36:22–23 inazungumzia ukuu na haki ya Mungu. Tafsiri haiongezi jina ‘Mungu’ ndani ya mstari, hivyo inadumisha viwakilishi vya Kiebrania na utegemezi wake kwa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili ya balagha umehifadhiwa. ‘Kumwekea njia yake’ ni wa kifasihi kiasi lakini unaeleweka, huku tanbihi ikihifadhi upana wa kitenzi פקד.
