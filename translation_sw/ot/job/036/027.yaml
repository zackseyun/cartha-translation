  yaml_path: translation/ot/job/036/027.yaml
  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: sw
  text: 'Kwa maana yeye huyavuta juu matone ya maji;

    matone hayo humwaga mvua kutoka katika mvuke wake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matone hayo hutiririsha mvua kwa ukungu wake.” Kiebrania cha mstari wa pili ni kigumu; neno lililotafsiriwa “mvuke” linaweza pia kutafsiriwa “ukungu,” na uhusiano unaoonyeshwa na kihusishi unaweza kueleweka kwa namna tofauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha maelezo ya ukuu wa Mungu katika muktadha; ni kiunganishi cha sababu au ufafanuzi kinachosikika kwa kawaida katika Kiswahili.
- source_word: יְגָרַע
  choice: huyavuta juu
  rationale: Kitenzi kwa kawaida humaanisha kupunguza, kuondoa, au kuvuta; katika muktadha huu wa hali ya anga, kinaeleza Mungu kuyavuta matone ya maji juu.
- source_word: נִטְפֵי מָיִם
  choice: matone ya maji
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki cha muundo wa utegemezi.
- source_word: יָזֹקּוּ
  choice: yanayachuja kuwa
  rationale: Kitenzi זקק kinaweza kumaanisha kuchuja au kusafisha. Hapa taswira ni ya matone yanayochujwa au kutolewa yakiwa mvua; muundo huu unahifadhi taswira hiyo bila kuifanya aya kuwa maelezo ya kisayansi.
- source_word: מָטָר
  choice: mvua
  rationale: Hili ndilo neno la kawaida na sahihi katika Kiswahili.
- source_word: לְאֵדוֹ
  choice: kutoka katika ukungu wake
  rationale: אֵד ni ukungu au mvuke, na ל ni ngumu kufasiri hapa. 'Kutoka katika' huwasilisha uhusiano unaowezekana wa chanzo, huku kiambishi cha nafsi ya tatu umoja kikihifadhiwa kwa 'wake.'
theological_decisions:
- issue: Kirejelewa cha kiambishi cha nafsi ya tatu umoja katika לְאֵדוֹ
  choice: 'Kiambishi kinamrejelea Mungu: “ukungu wake.”'
  alternative: Maana isiyo ya nafsi, kama “ukungu wake” ukirejelea mvua au maji, au marekebisho ya matini/vokali yanayotoa “ukungu wao.”
  rationale: Katika hotuba ya Elihu, Mungu ndiye mhusika anayatawala maumbile. Kuhifadhi umoja wa kiume kama rejeleo kwa Mungu kunafuata matini iliyopokelewa na muktadha bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi umehifadhiwa kwa mistari miwili. “Huyavuta juu” huweka wazi maana ya kimuktadha ya גרע, huku tanbihi ikihifadhi ugumu halisi wa mstari wa pili.
