  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: sw
  text: Lakini umejaa hukumu ya mwovu[a]; hukumu na haki zitakushika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umejaa hukumu kama ya waovu,” au “umejaa hukumu inayompata mwovu.” Kiebrania kimebanwa na kinaweza kueleweka kwa njia hizi.
    reason: alternative_reading
  - marker: b
    text: Au, “hukumu na haki zitakutegemeza,” au “hukumu na haki zitakushikilia.” Kitenzi cha Kiebrania kinaweza kumaanisha kutegemeza, kushikilia, au kushika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  choice: Lakini ... hukumu
  rationale: Kiunganishi וְ kimeeleweka kwa maana ya kupambanua katika muktadha, huku דִּין ikitafsiriwa kama ‘hukumu’ ili kudumisha taswira ya kimahakama.
- source_word: רָשָׁע
  choice: mwovu
  rationale: Kivumishi hiki cha umoja kimetumika kama nomino; ‘mwovu’ huhifadhi umoja na maana ya jumla bila kuongeza ‘mtu’.
- source_word: מָלֵאתָ
  choice: umejaa
  rationale: Kitenzi cha nafsi ya pili umoja wa kiume kinaeleza hali ya sasa inayotokana na tendo lililotimia; ‘umejaa’ ni ya kawaida na huhifadhi sitiari ya kujazwa.
- source_word: דִּין וּמִשְׁפָּט
  choice: hukumu na haki
  rationale: Nomino hizi zinazokaribiana zimetofautishwa kama ‘hukumu’ na ‘haki’ ili kuhifadhi usambamba na maana ya kimahakama.
- source_word: יִתְמֹכוּ
  choice: zinakushika
  rationale: תמך inaweza kumaanisha kutegemeza, kushikilia, au kushika. ‘Zinakushika’ ni ya asili katika Kiswahili na inafaa muktadha hasi, huku tanbihi ikihifadhi maana mbadala ya kutegemeza.
theological_decisions:
- issue: Maana ya דִּין רָשָׁע
  choice: hukumu ya mwovu
  alternative: hukumu kama ya waovu / hukumu anayopata mwovu
  rationale: Kiebrania kimebanwa na kinaweza kumaanisha hukumu inayomhusu mwovu au aina ya hukumu inayohusishwa naye; maandishi makuu yanahifadhi muundo wa uhusiano bila kuufafanua kupita kiasi.
- issue: Maana na yambwa ya יִתְמֹכוּ
  choice: hukumu na haki zinakushika
  alternative: hukumu na haki zinakutegemeza / zinashikamana
  rationale: Kitenzi ni wingi nafsi ya tatu bila yambwa iliyoandikwa. ‘Zinakushika’ huweka yambwa inayodokezwa na muktadha, lakini tanbihi huhifadhi uwezekano wa maana ya kutegemeza au kushikilia bila yambwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya ‘hukumu’ na msamiati wa kimahakama yamehifadhiwa; utata halisi wa Kiebrania umeonyeshwa kwa tanbihi.
