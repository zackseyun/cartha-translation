  text: תָּמֹ֣ת בַּ/נֹּ֣עַר נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם בַּ/קְּדֵשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: sw
  text: Wanakufa wangali vijana, na maisha yao yanaishia miongoni mwa makahaba wa kiume wa ibada za kipagani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa waliowekwa wakfu.” Neno la Kiebrania huenda linarejelea makahaba wa kiume waliohusishwa na ibada za kipagani.
    reason: Usomaji mwingine unaowezekana wa קְדֵשִׁים na ufafanuzi wa maana yake ya kiibada.
lexical_decisions:
- source_word: תָּמֹת
  choice: wanakufa
  rationale: Kitenzi מות katika Qal kina maana ya kufa. Wingi katika Kiswahili unaakisi kiambishi cha wingi katika נַפְשָׁם na kundi linalozungumziwa katika muktadha.
- source_word: בַּנֹּעַר
  choice: wangali vijana
  rationale: נֹעַר hueleza ujana au kipindi cha mapema cha maisha. ‘Wangali vijana’ ni Kiswahili cha kawaida na huonyesha kwamba kifo kinatokea kabla ya wakati wa kawaida.
- source_word: נַפְשָׁם
  choice: wana-
  rationale: נֶפֶשׁ hapa ni nafsi, uhai, au mtu mwenyewe na ndiyo kiima cha kufa. Badala ya tafsiri isiyo ya kawaida ‘nafsi yao inakufa,’ maana yake imewasilishwa kwa kiima cha watu, ‘wanakufa.’
- source_word: וְחַיָּתָם
  choice: na maisha yao yanaishia
  rationale: Nomino hii hurejelea uhai au maisha yao. Kitenzi ‘yanaishia’ kinaendeleza maana ya kifo kutoka mstari wa kwanza, ingawa hakijaandikwa tena waziwazi katika Kiebrania.
- source_word: בַּקְּדֵשִׁים
  choice: miongoni mwa makahaba wa kiume wa ibada za kipagani
  rationale: Wingi wa קָדֵשׁ hapa huenda unarejelea wanaume waliohusishwa na ukahaba katika ibada zisizokubalika, si watu watakatifu kwa ujumla. Tafsiri hii inabainisha jinsia na mazingira ya kiibada bila kutumia neno la kimapokeo lenye maana pana na nzito zaidi.
theological_decisions:
- issue: Maana ya קְדֵשִׁים
  choice: makahaba wa kiume wa ibada za kipagani
  alternative: waliowekwa wakfu
  rationale: Matumizi ya קָדֵשׁ katika sehemu nyingine za Biblia ya Kiebrania na muktadha wa mwisho wa aibu yanaunga mkono maana ya wanaume waliohusishwa na ukahaba wa kiibada. Hata hivyo, maana ya msingi inayohusiana na kuwekwa wakfu imehifadhiwa katika tanbihi kwa sababu neno hilo lina utata wa kweli.
- issue: Kitenzi kinachodokezwa katika kishazi cha pili
  choice: maisha yao yanaishia
  alternative: na maisha yao miongoni mwa makahaba wa kiume wa ibada za kipagani
  rationale: Kiebrania hakirudii kitenzi katika kishazi cha pili, lakini ulinganifu wake na ‘wanakufa’ unadokeza mwisho wa maisha. Kiswahili sanifu huhitaji kiarifu ili sentensi hii iwe ya kawaida na wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘wangali vijana’ ni wa kawaida lakini wenye uzito unaofaa maandiko; ‘makahaba wa kiume wa ibada za kipagani’ hutoa maana ya kihistoria kwa uwazi bila kuingiza istilahi ya kimadhehebu.
