translation:
  language: sw
  text: Jihadhari; usigeukie uovu[a], kwa maana umechagua huo kuliko dhiki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania אָוֶן pia linaweza kumaanisha “ubaya” au, huenda, “taabu.”
    reason: lexical_alternative
  - marker: b
    text: Au “badala ya dhiki” au “kuliko mateso.” Maana yake ni kuupendelea uovu kuliko dhiki anayopitia.
