lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Jihadhari
  rationale: Kitenzi hiki cha amri katika Nifali kinatoa onyo la moja kwa moja. “Jihadhari” ni Kiswahili cha kawaida chenye uzito unaofaa.
- source_word: אַל תֵּפֶן
  choice: usigeukie
  rationale: Muundo huu ni katazo la kuelekea au kugeukia jambo fulani. “Usigeukie” ni wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: אֶל אָוֶן
  choice: uovu
  rationale: אָוֶן inaweza kumaanisha uovu, ubaya, au taabu. Katika himizo hili la kimaadili, “uovu” linaonyesha vyema tendo baya ambalo mtu anaweza kulichagua.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya onyo lililotangulia; “kwa maana” kinahifadhi uhusiano huo waziwazi.
- source_word: עַל זֶה
  choice: huo
  rationale: Kiwakilishi hiki kinaelekeza kwenye jambo lililotajwa, yaani uovu. “Huo” kinakubaliana kisarufi na “uovu” bila kuongeza ufafanuzi usio katika Kiebrania.
- source_word: בָּחַרְתָּ
  choice: umechagua
  rationale: Ni kitenzi timilifu cha nafsi ya pili umoja wa kiume. “Umechagua” kinaonyesha tendo lililofanyika lenye umuhimu katika onyo la sasa.
- source_word: מֵעֹנִי
  choice: kuliko dhiki
  rationale: 'עֹנִי hapa ina maana ya dhiki au mateso, na kiambishi מ־ kinaonyesha ulinganisho: kuuchagua uovu kuliko kuvumilia dhiki.'
theological_decisions:
- issue: Kama mstari unamshutumu Ayubu kwamba tayari amechagua uovu au unamwonya tu dhidi yake
  choice: umechagua huo
  alternative: usiuchague huo
  rationale: Kiebrania kina kitenzi timilifu cha nafsi ya pili, “umechagua,” si katazo jingine. Tafsiri inadumisha mvutano wa kauli ya Elihu bila kuipunguza kuwa onyo la uwezekano tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja, kama onyo la Kiebrania. Alama za tanbihi zimewekwa baada ya maneno yanayohusika.
