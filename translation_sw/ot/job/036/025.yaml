  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/025.yaml
  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: sw
  text: Wanadamu wote wameiona[a]; binadamu huitazama kwa mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanadamu wote wamemwona.” Kiwakilishi cha Kiebrania ni cha umoja wa kiume na kinaweza kumrejelea Mungu, lakini muktadha unaelekea zaidi kwenye kazi au tendo la Mungu lililotajwa.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל אָדָם
  choice: Wanadamu wote
  rationale: Kirai hiki kinatoa kauli inayowahusu wanadamu kwa ujumla. “Wanadamu wote” ni Kiswahili cha kawaida kinachohifadhi maana ya kijumla bila kuifanya אָדָם imaanishe mwanaume pekee.
- source_word: חָזוּ
  choice: wameiona
  rationale: Kitenzi חזה humaanisha kuona au kutazama kwa makini. “Wameiona” ni cha asili na wazi katika Kiswahili, huku muktadha wa kishairi ukidokeza kuangalia kazi iliyotajwa.
- source_word: בּוֹ
  choice: -iona
  rationale: Kiwakilishi hiki ni cha umoja wa kiume kisarufi, lakini huenda kinarejelea kazi ya Mungu iliyotajwa katika mstari uliotangulia. Kiswahili hutumia ngeli kulingana na nomino inayodhaniwa; “-iona” kinaonyesha “kazi” bila kuficha uwezekano wa kukirejeza kwa Mungu, ambao umeelezwa katika tanbihi.
- source_word: אֱנוֹשׁ
  choice: binadamu
  rationale: אֱנוֹשׁ humaanisha mwanadamu, wakati mwingine kwa kidokezo cha udhaifu au hali ya kufa. “Binadamu” huhifadhi maana ya kijumla na usambamba na “wanadamu wote” kwa lugha ya sasa.
- source_word: יַבִּיט
  choice: huitazama
  rationale: Hiphil ya נבט ina maana ya kuangalia au kutazama. “Huitazama” huonyesha tendo la kuangalia na pia inafaa kwa kauli ya jumla inayohusu binadamu.
- source_word: מֵרָחוֹק
  choice: kwa mbali
  rationale: Kirai hiki humaanisha kutoka mahali pa mbali au kwa umbali. “Kwa mbali” ni kifupi, cha kawaida, na kinafaa katika ushairi.
theological_decisions:
- issue: Kirejewa cha kiwakilishi בּוֹ
  choice: Kimewakilishwa kama kitu—yaani, kazi ya Mungu iliyotajwa katika muktadha.
  alternative: 'Kukirejeza kwa Mungu binafsi: “wamemwona.”'
  rationale: Kiwakilishi cha Kiebrania ni cha umoja wa kiume na kwa hiyo kinaweza kurejelea Mungu, lakini muktadha wa karibu unaelekea kwenye kazi au tendo lake. Tanbihi inadumisha utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Maneno ya kijinsia kama “mwanamume” yameepukwa kwa sababu אָדָם na אֱנוֹשׁ hapa zinawahusu wanadamu kwa ujumla.
