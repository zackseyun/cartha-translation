base_translation:
  language: en
  yaml_path: translation/ot/job/036/003.yaml
  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: sw
  text: Nitayaleta maarifa yangu kutoka mbali[a], na nitasema kwamba Muumba wangu ni mwadilifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitayachota maarifa yangu kutoka mbali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Muumba wangu ana haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: Nitayaleta
  rationale: Kitenzi נשׂא kwa msingi humaanisha kuinua, kubeba, au kuchukua. Pamoja na ‘maarifa yangu’ na ‘kutoka mbali,’ ‘nitayaleta’ kinaeleza kwa Kiswahili cha kawaida wazo la kuyatoa au kuyachota maarifa kutoka mbali huku kikidumisha sitiari ya Kiebrania.
- source_word: דֵעִי
  choice: maarifa yangu
  rationale: Nomino hii humaanisha maarifa au ufahamu. ‘Maarifa yangu’ ni tafsiri ya moja kwa moja na yenye lugha ya kawaida; ‘maoni yangu’ ingedhoofisha dai la Elihu.
- source_word: לְמֵרָחוֹק
  choice: kutoka mbali
  rationale: Kirai kinaweza kuonyesha umbali au chanzo cha mbali. Katika muundo huu, ‘kutoka mbali’ kinaeleza kwamba maarifa yanaletwa kutoka chanzo cha mbali bila kujaribu kufafanua chanzo hicho.
- source_word: וּלְפֹעֲלִי
  choice: Muumba wangu
  rationale: Kirai halisi ni ‘kwa yule anayenitenda/kunifanya.’ Katika muktadha kinamrejelea Mungu kama aliyemfanya msemaji; ‘Muumba wangu’ ni cha asili, cha heshima, na wazi.
- source_word: אֶתֵּן
  choice: nitamhusisha ... na
  rationale: נתן humaanisha ‘kutoa,’ lakini pamoja na צדק na yule anayepewa, maana ya kimatumizi ni kumtambulia au kumhusisha mtu na sifa hiyo. ‘Nitamhusisha ... na uadilifu’ ni ya kawaida kuliko tafsiri ya neno kwa neno ‘nitampa uadilifu.’
- source_word: צֶדֶק
  choice: uadilifu
  rationale: צדק inaweza kumaanisha unyofu wa kimaadili, haki, au utendaji ulio sawa. ‘Uadilifu’ huhifadhi maana pana ya unyofu unaohusishwa na Mungu, huku ‘haki’ ikibaki uwezekano halali katika tanbihi.
theological_decisions:
- issue: Maana ya צדק inapohusishwa na Mungu
  choice: uadilifu
  alternative: haki
  rationale: Neno la Kiebrania linajumuisha unyofu wa tabia na haki katika matendo au hukumu. ‘Uadilifu’ hudumisha maana pana bila kuondoa wazo la haki; tanbihi inalihifadhi chaguo hilo jingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unadumisha nafsi ya kwanza na ulinganifu wa vipashio viwili vya Kiebrania. Kiwakilishi cha ngeli katika ‘nitayaleta’ kinarejelea ‘maarifa.’
