  yaml_path: translation/ot/job/025/002.yaml
  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: sw
  text: Utawala na hofu kuu ziko pamoja naye;[a] yeye hufanya amani katika sehemu zake za juu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utawala na hofu kuu ni zake.”
    reason: alternative_reading
  - marker: b
    text: Au, “katika mahali pake pa juu”; inaelekea kirai hiki kinarejelea eneo la juu la mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: Utawala
  rationale: Nomino hii inaonyesha kutawala au mamlaka ya kutawala. “Utawala” ni ya kawaida, yenye hadhi, na inadumisha mtindo wa kinomino wa kishazi.
- source_word: וָפַחַד
  choice: na hofu kuu
  rationale: פחד inaweza kumaanisha hofu, kihoro, au woga mkubwa. “Hofu kuu” inaonyesha woga wenye uzito unaosababishwa na ukuu wa Mungu bila kuifanya iwe lazima “hofu ya kutisha.”
- source_word: עִמּוֹ
  choice: ziko pamoja naye
  rationale: Kirai hiki kihalisi ni “pamoja naye.” Kwa kuwa kishazi cha Kiebrania hakina kitenzi kilichoandikwa, “ziko” kinaongezwa kwa ufasaha wa Kiswahili huku taswira ya uwepo pamoja naye ikihifadhiwa.
- source_word: עֹשֶׂה
  choice: yeye huleta
  rationale: Kitenzi-shirikishi kinaonyesha tendo la kawaida au la kudumu. “Huleta” ni Kiswahili cha asili katika usemi “huleta amani,” bila kuongeza maana kali zaidi ya “huweka imara.”
- source_word: שָׁלוֹם
  choice: amani
  rationale: Neno linaweza kujumuisha amani, hali njema, ukamilifu, au utaratibu. “Amani” ndilo chaguo la kawaida na linalofaa katika muktadha huu wa ulimwengu wa juu.
- source_word: בִּמְרוֹמָיו
  choice: katika mahali pake pa juu
  rationale: מרום hurejelea kimo au mahali palipoinuka. Uwingi wa Kiebrania unaweza kutolewa kwa kawaida katika Kiswahili kwa dhana ya eneo la juu; tafsiri hii inadumisha taswira bila kuibana moja kwa moja kuwa “mbinguni.”
theological_decisions:
- issue: Maana ya kishazi cha mwanzo
  choice: Utawala na hofu kuu ziko pamoja na Mungu
  alternative: Utawala na hofu kuu ni zake
  rationale: Kishazi kisicho na kitenzi katika Kiebrania kinaweza kueleweka kama uwepo pamoja naye au kama umiliki. Matini kuu inahifadhi usemi wa karibu zaidi, “pamoja naye,” na tanbihi inaonyesha maana ya umiliki inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Hofu kuu” huepuka utata wa “hofu” peke yake, na “mahali pake pa juu” huhifadhi taswira pana ya Kiebrania.
