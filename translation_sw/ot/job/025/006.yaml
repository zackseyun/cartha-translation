  text: אַ֭ף כִּֽי אֱנ֣וֹשׁ רִמָּ֑ה וּ/בֶן אָ֝דָ֗ם תּוֹלֵעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/025/006.yaml
  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: sw
  text: Sembuse mwanadamu[a], ambaye ni funza, na mwana wa binadamu[b], ambaye ni mnyoo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “binadamu dhaifu”; neno la Kiebrania mara nyingi hukazia udhaifu na hali ya kufa ya mwanadamu.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mwana wa binadamu”; hapa ni msemo wa kishairi unaomaanisha binadamu, wala si cheo cha Kimasihi.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: Sembuse
  rationale: 'Katika muktadha huu, msemo huu unaendeleza hoja ya kulinganisha kutoka mstari uliotangulia: ikiwa hata vitu vya angani si safi mbele za Mungu, basi hali ya mwanadamu ni duni zaidi. “Sembuse” huonyesha kwa kawaida nguvu hiyo ya kimantiki katika Kiswahili.'
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Neno hili humaanisha binadamu, mara nyingi likisisitiza udhaifu na hali yake ya kufa. “Mwanadamu” ni la kawaida, lenye heshima, na linafaa kwa umoja wa kishairi; kidokezo kinabainisha wazo la udhaifu.
- source_word: רִמָּה
  choice: funza
  rationale: Neno hili kwa kawaida humaanisha funza anayehusishwa na uozo. “Funza” hulitofautisha na תּוֹלֵעָה katika mstari wa pili wa usambamba.
- source_word: בֶן אָדָם
  choice: mwana wa binadamu
  rationale: Tafsiri hii huhifadhi muundo wa kishairi wa Kiebrania na usambamba wake na “mwanadamu.” Katika muktadha huu ni msemo unaomaanisha binadamu, si cheo maalumu.
- source_word: תּוֹלֵעָה
  choice: mnyoo
  rationale: Hili ni neno pana zaidi kwa kiumbe kama mnyoo. “Mnyoo” ni la kawaida katika Kiswahili na hudumisha tofauti ya kishairi na “funza.”
theological_decisions:
- issue: Je, “mwana wa binadamu” ni cheo cha Kimasihi au msemo wa kishairi?
  choice: Msemo usio cheo unaomaanisha binadamu
  alternative: Cheo cha Kimasihi
  rationale: בֶן אָדָם hapa inalingana kishairi na אֱנוֹשׁ na kueleza udhaifu wa binadamu. Hakuna msingi wa kimuktadha wa kuifanya kuwa cheo cha Kimasihi, ingawa muundo halisi umehifadhiwa katika tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa ushairi wa hekima. “Sembuse” ni msemo wa sasa na wa kawaida unaobeba hoja ya ‘how much less’; “funza” na “mnyoo” zinahifadhi tofauti ya maneno mawili ya Kiebrania.
