id: JOB.25.5
reference: Job 25:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: sw
  text: Tazama, hata mwezi hauangazi[a], na nyota si safi machoni pake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwezi haung’ai” au “hautoi nuru.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nyota si angavu machoni pake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili linaelekeza usikivu na kusisitiza jambo linalofuata; “Tazama” linafaa katika ushairi wenye hadhi.
- source_word: עַד
  choice: hata
  rationale: Hapa lina nguvu ya kusisitiza nomino inayofuata, si maana ya mpaka wa mahali au wakati.
- source_word: יָרֵחַ
  choice: mwezi
  rationale: Ni tafsiri ya moja kwa moja ya kitu hiki cha angani.
- source_word: לֹא יַאֲהִיל
  choice: hauangazi
  rationale: Kitenzi hapa kinaweza kumaanisha kutoa nuru au kung’aa; “hauangazi” ni cha kawaida na huhifadhi wazo la kutoa mwanga.
- source_word: וְכוֹכָבִים
  choice: na nyota
  rationale: Inaendeleza kwa urahisi taswira ya vitu vya angani.
- source_word: לֹא זַכּוּ
  choice: si safi
  rationale: Mzizi unaweza kuhusiana na usafi au uangavu. “Si safi” huhifadhi tathmini pana bila kuifanya iwe ya kimaadili pekee.
- source_word: בְעֵינָיו
  choice: machoni pake
  rationale: Huhifadhi sitiari ya Kiebrania ya kutathmini kwa mtazamo wa mtu fulani na ni Kiswahili cha asili.
theological_decisions:
- issue: Mrejelewa wa kiambishi cha nafsi ya tatu umoja katika בְעֵינָיו
  choice: “pake” linamrejelea Mungu
  alternative: Mwangalizi asiyetajwa wazi katika hoja ya kishairi
  rationale: Katika muktadha wa Ayubu 25:2–6, Bildadi anazungumzia ukuu wa Mungu na kutokuwa safi kwa viumbe mbele zake. Tafsiri haiongezi jina “Mungu,” hivyo muundo wa chanzo unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya kishairi, yenye hadhi na inayoeleweka kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
