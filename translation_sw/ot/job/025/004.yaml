source:
  edition: WLC
  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: sw
  text: Basi, mwanadamu anawezaje kuwa mwadilifu mbele za Mungu?[a] Naye aliyezaliwa na mwanamke anawezaje kuwa safi?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na Mungu.” Kiebrania ni “pamoja na Mungu” kihalisi, lakini kirai hicho kinaweza kueleza hali ya mtu mbele zake.
    reason: lexical_alternative
  - marker: b
    text: Au, “asiye na doa” au “asiye na hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: Basi, ... anawezaje
  rationale: Kiunganishi pamoja na neno la kuuliza kinaanzisha swali la balagha linalotokana na muktadha. “Basi” huonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: יִצְדַּק
  choice: kuwa mwadilifu
  rationale: Kitenzi cha Kiebrania katika Qal humaanisha kuwa mwenye haki au kuwa sawa katika uhusiano na Mungu. “Kuwa mwadilifu” huhifadhi maana hiyo bila kuibana kuwa tamko la kisheria pekee.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Neno hili humaanisha binadamu, mara nyingi likidokeza udhaifu na hali yake ya kufa. “Mwanadamu” ni la asili na lina nguvu ya kijumla.
- source_word: עִם אֵל
  choice: mbele za Mungu
  rationale: Ingawa עִם kwa msingi ni “pamoja na,” katika swali hili kirai kinaeleza hali ya mtu katika uhusiano na Mungu. “Mbele za Mungu” ni nahau ya kawaida inayohifadhi pia kidokezo cha kusimama mbele yake.
- source_word: יִזְכֶּה
  choice: kuwa safi
  rationale: Kitenzi זכה katika Qal kinaweza kumaanisha kuwa safi, kutokuwa na hatia, au kutokuwa na doa. “Kuwa safi” ni pana na kinaendana na ulinganifu wa kishairi.
- source_word: יְלוּד אִשָּׁה
  choice: aliyezaliwa na mwanamke
  rationale: Kirai hiki ni namna ya kumtaja mwanadamu kwa kusisitiza hali yake ya kiumbe na ya kufa. Tafsiri hii huhifadhi umbo la Kiebrania na maana yake ya kijumla.
theological_decisions:
- issue: Lugha ya kijumla kuhusu ubinadamu
  choice: mwanadamu ... aliyezaliwa na mwanamke
  alternative: mtu mwenye kufa ... yeyote aliyezaliwa na mwanamke
  rationale: Misemo yote miwili ya Kiebrania inamwakilisha mwanadamu kwa ujumla. Tafsiri iliyochaguliwa ni jumuishi katika matumizi ya kawaida ya Kiswahili na huhifadhi usambamba wa kishairi.
- issue: Hali ya mwanadamu katika uhusiano na Mungu
  choice: mbele za Mungu
  alternative: pamoja na Mungu
  rationale: Kiebrania ni “pamoja na Mungu” kihalisi, lakini hapa swali linahusu iwapo mwanadamu anaweza kuhesabiwa au kuonekana mwadilifu katika uhusiano na Mungu. “Mbele za Mungu” huhifadhi mvutano wa kimaadili na wa kimahakama bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Mbele za Mungu” ni nahau ya kawaida; maswali mawili sambamba yanahifadhi mtindo wa kishairi wa mstari wa Kiebrania.
