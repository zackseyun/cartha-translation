lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: yanaweza kuhesabika
  rationale: Swali la Kiebrania linauliza kama kuna idadi ya majeshi yake; Kiswahili hiki cha kawaida huhifadhi maana ya kwamba hayawezi kuhesabika.
- source_word: לִגְדוּדָיו
  choice: majeshi yake
  rationale: גְּדוּד inaweza kumaanisha kikosi, kundi la askari, au jeshi; wingi wa 'majeshi' ni wa asili katika muktadha wa ukuu wa Mungu.
- source_word: וְעַל מִי
  choice: Na ... nani
  rationale: Muundo wa Kiswahili umegeuzwa kwa njia ya kawaida ili kuambatana na kitenzi 'mwangazia' huku swali la ujumla likihifadhiwa.
- source_word: לֹא יָקוּם
  choice: haimwangazii
  rationale: קוּם ni 'kuinuka,' lakini nuru inapoinuka juu ya mtu humwangazia; tafsiri hii ni ya asili bila kuondoa taswira ya nuru.
- source_word: אוֹרֵהוּ
  choice: nuru yake
  rationale: אוֹר ni nuru au mwanga, na kiambishi cha nafsi ya tatu umoja wa kiume kimehifadhiwa kwa 'yake.' 'Nuru' hudumisha uwezekano wa maana halisi au ya kitamathali.
theological_decisions:
- issue: Mrejelewa wa viambishi katika 'majeshi yake' na 'nuru yake'
  choice: Vinaelekezwa kwa Mungu, lakini tafsiri inadumisha kiwakilishi 'yake.'
  alternative: Kuvibainisha moja kwa moja kuwa 'majeshi ya Mungu' na 'nuru ya Mungu,' au kuvihusisha kwa ujumla na mtawala wa mbinguni.
  rationale: Katika muktadha wa Ayubu 25:2, Bildadi anazungumzia utawala na utisho wa Mungu. Hata hivyo, kutumia 'yake' huhifadhi muundo wa Kiebrania bila kuongeza ufafanuzi katika matini.
- issue: Maana ya 'nuru yake'
  choice: Taswira pana ya nuru ya Mungu ambayo huwafikia wote.
  alternative: Mwanga wa jua hasa, fahari ya kimungu, au kibali cha Mungu.
  rationale: Kiebrania hakibainishi maana hiyo kwa finyu; kwa hiyo matini inahifadhi 'nuru,' na tanbihi inaonyesha upana wa taswira.
translation_notes:
