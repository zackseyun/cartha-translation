  rationale: Nomino hii ya utambulisho humtaja Bildadi kwa ukoo au asili yake; ‘Mshuhi’ ni umbo fupi na la kawaida la Kiswahili bila kulazimisha iwapo ni ukoo au eneo.
- source_word: וַיֹּאמַר
  choice: akisema
  rationale: אמר humaanisha ‘kusema.’ Katika muundo wa Kiswahili, ‘akajibu akisema’ huhifadhi vitenzi vyote viwili vya fomula ya Kiebrania kwa lugha ya kawaida.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Kisha ... akajibu akisema
  rationale: ‘Kisha’ huonyesha hatua inayofuata katika mazungumzo, nayo ‘akajibu akisema’ huakisi fomula kamili ya utangulizi wa usemi bila kuwa nzito isivyo lazima.
