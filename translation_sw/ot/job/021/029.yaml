  yaml_path: translation/ot/job/021/029.yaml
  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: sw
  text: Je, hamjawauliza wale wanaopita njiani[a], wala hamzitambui ishara zao[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasafiri” au “wale wapitao njiani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alama zao” au “dalili zao”; huenda maneno haya yanarejelea ushahidi au viashiria vinavyojulikana kutokana na taarifa za wasafiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, hamjawauliza
  rationale: Muundo huu unahifadhi swali la balagha linalotarajia jibu la kukubali, pamoja na sauti ya kukemea.
- source_word: שְׁאֶלְתֶּם
  choice: mmewauliza
  rationale: Kitenzi hiki humaanisha kuuliza au kutafuta habari kutoka kwa mtu; ‘kuwauliza’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: עֹבְרֵי דָרֶךְ
  choice: wale wanaopita njiani
  rationale: Tafsiri hii inakaribia maana halisi ya ‘wapitao njia’ na kudokeza wasafiri wenye uzoefu mpana bila kutumia neno la kizamani.
- source_word: וְאֹתֹתָם
  choice: ishara zao
  rationale: אוֹת humaanisha ishara, alama, au dalili. ‘Ishara zao’ inadumisha upana wa neno la Kiebrania bila kulifasiri moja kwa moja kuwa ushuhuda wao.
- source_word: לֹא תְנַכֵּרוּ
  choice: hamzitambui
  rationale: Katika piel, נכר hapa inaelekea kumaanisha kutambua au kukubali. ‘Kuzitambua’ inaendana kwa kawaida na ‘ishara’ na inahifadhi swali la maandishi.
