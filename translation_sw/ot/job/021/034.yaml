  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: sw
  text: Basi, mnawezaje kunifariji kwa maneno matupu[a], ilhali majibu yenu yamebaki kuwa usaliti tu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnawezaje kunifariji bure, ilhali majibu yenu yamebaki kuwa usaliti?”
    reason: הָבֶל inaweza kueleweka kama maudhui matupu ya faraja au kwa maana ya kielezi, “bure/bila mafanikio.”
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Basi, mnawezaje
  rationale: “Basi” linaonyesha uhusiano wa hitimisho na hoja iliyotangulia, huku swali la balagha likibaki la kawaida katika Kiswahili.
- source_word: תְּנַחֲמוּנִי
  choice: kunifariji
  rationale: Piel ya נחם pamoja na kiambishi cha nafsi ya kwanza umoja ina maana ya kumfariji au kumliwaza msemaji.
- source_word: הָבֶל
  choice: kwa maneno matupu
  rationale: הבל humaanisha utupu au ubatili. Katika muktadha huu inafafanua yaliyomo katika faraja ya marafiki; “maneno matupu” ni Kiswahili cha kawaida kinachohifadhi wazo la maudhui yasiyo na maana, ingawa neno “maneno” limewekwa wazi kutokana na muktadha.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: majibu yenu
  rationale: תשובה hapa ni majibu au hoja walizompa Ayubu katika hotuba zao.
- source_word: נִשְׁאַר
  choice: yamebaki kuwa
  rationale: Niphal ya שׁאר ina maana ya kubaki au kuachwa; muundo huu wa Kiswahili unaonyesha hali inayosalia baada ya hoja zao kuchunguzwa.
- source_word: מָעַל
  choice: usaliti tu
  rationale: מעל huonyesha kukosa uaminifu au kuvunja uaminifu; “usaliti” huhifadhi uzito wa shtaka la Ayubu kuliko “udanganyifu” pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Maneno matupu” ni usemi wa kawaida unaowasilisha wazo la הָבֶל bila kutumia neno la kifalsafa kama “ubatili.”
