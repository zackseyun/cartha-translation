  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: sw
  text: Lakini wao humwambia Mungu[a], “Tuondokee, na hatutaki maarifa ya njia zako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tuache” / “Ondoka kwetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lakini wao humwambia
  rationale: Katika muktadha wa hotuba ya kishairi, kauli hii inaeleza msimamo wa kawaida wa waovu; wakati wa mazoea ‘humwambia’ ni wa asili katika Kiswahili. ‘Lakini’ huonyesha utofauti wa kimuktadha kati ya kufanikiwa kwao na kumkataa kwao Mungu.
- source_word: לָאֵל
  choice: Mungu
  rationale: אֵל hapa ni rejeo la kawaida kwa Mungu, si lazima jina maalumu; ‘Mungu’ ni tafsiri ya wazi na ya kawaida.
- source_word: סוּר מִמֶּנּוּ
  choice: Tuondokee
  rationale: Kitenzi סור katika hali ya amri humaanisha kugeuka kando, kuondoka, au kwenda mbali. ‘Tuondokee’ kinahifadhi amri ya moja kwa moja ya kumtaka Mungu aondoke kwao.
- source_word: וְדַעַת
  choice: wala … kuyajua
  rationale: Kiunganishi וְ kimewasilishwa kwa ‘wala,’ ambacho huunganisha kauli hasi ya pili na amri ya kwanza bila kuingiza uhusiano wa kisababishi usiosemwa wazi. Nomino ‘maarifa ya’ imetafsiriwa kwa muundo wa kawaida wa Kiswahili ‘kuyajua.’
- source_word: דְּרָכֶיךָ
  choice: njia zako
  rationale: דֶּרֶךְ inaweza kumaanisha njia halisi au namna ya kutenda na kuishi; ‘njia zako’ huhifadhi upana huo wa maana.
- source_word: לֹא חָפָצְנוּ
  choice: hatutaki
  rationale: חפץ huonyesha kutaka, kutamani, au kupendezwa. ‘Hatutaki’ ni ya moja kwa moja na huonyesha kukataa kwa hiari bila kuzidisha wazo la hisia.
theological_decisions:
- issue: Kauli ya waovu iliyoelekezwa kwa Mungu
  choice: 'Amri ya moja kwa moja imehifadhiwa: “Tuondokee”'
  alternative: “Tuache” au usemi usio wa moja kwa moja kama “hawataki Mungu awasumbue”
  rationale: Kiebrania kina amri kali inayosemwa moja kwa moja kwa Mungu. Kuihifadhi huonyesha uzito wa uasi wao bila kuipunguza kwa maelezo ya kifafanuzi.
- issue: Uhusiano wa vishazi viwili
  choice: “wala” imetumiwa badala ya kiunganishi cha sababu
  alternative: “kwa maana hatutaki…”
  rationale: וְ linaunganisha vishazi bila kueleza wazi kwamba cha pili ni sababu ya cha kwanza. ‘Wala’ huhifadhi muundo huo na mvutano wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tuondokee’ ni kauli kali lakini inayoeleweka kwa urahisi; ‘wala hatutaki kuyajua njia zako’ ni ya asili na huhifadhi ulinganifu wa kishairi.
