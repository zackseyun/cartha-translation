base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: sw
  text: Ni mara ngapi taa ya waovu huzimika[a][b], na msiba wao huwajia? Je, yeye huwagawia maumivu katika hasira yake?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni mara ngapi taa ya waovu huzima...?” Swali la Kiebrania ni la balagha, likipinga wazo kwamba waovu huhukumiwa kwa namna hii mara kwa mara.
    reason: lexical_alternative
  - marker: b
    text: “Taa” ni sitiari ya maisha ya mtu, ustawi wake, au kuendelea kwa hali yake njema.
    reason: cultural_note
  - marker: c
    text: Au, “Je, yeye huwagawia uchungu katika hasira yake?” Neno la Kiebrania linaweza kumaanisha maumivu, uchungu, au hata utungu wa kuzaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Ni mara ngapi
  rationale: Katika muktadha huu neno la kuuliza linahusu mara jambo linapotokea na lina nguvu ya swali la balagha; tafsiri hii haibadili swali kuwa kauli ya moja kwa moja.
- source_word: נֵר
  choice: taa
  rationale: Neno lenyewe humaanisha taa, huku hapa likiwa sitiari ya maisha, ustawi, au hali njema inayoendelea; picha ya Kiebrania imehifadhiwa.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni tafsiri ya kawaida, fupi, na ya asili kwa nomino hii ya wingi katika fasihi ya hekima.
- source_word: יִדְעָךְ
  choice: huzimika
  rationale: Kitenzi דעך hutumiwa kwa taa kuzimika. 'Huzimika' ni Kiswahili cha kawaida na kinaendana na swali kuhusu mara jambo hilo linapotokea.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: na msiba wao huwajia
  rationale: אֵיד ni msiba, maafa, au uangamizi. Muundo huu huhifadhi wazo la msiba kuwafikia bila kuliongezea ufafanuzi.
- source_word: חֲבָלִים
  choice: maumivu
  rationale: Katika muktadha wa msiba na hasira, neno hili linaweza kumaanisha maumivu, uchungu, au utungu. 'Maumivu' ni pana, wazi, na halifungi kabisa uwezekano wa maana nyingine.
- source_word: יְחַלֵּק
  choice: huwagawa
  rationale: Piel ya חלק humaanisha kugawa au kutenga sehemu. 'Huwagawa' huhifadhi picha ya kutoa mateso kwa mgao, ingawa Kiswahili pia kingeweza kusema 'huwagawia.'
- source_word: בְּאַפּוֹ
  choice: katika hasira yake
  rationale: אַף katika nahau hii ni hasira. Tafsiri hii ni ya moja kwa moja na huhifadhi kiwakilishi cha nafsi ya tatu.
theological_decisions:
- issue: Mtendaji wa kitenzi יְחַלֵּק katika 'katika hasira yake'
  choice: Kiwakilishi 'yeye' kimehifadhiwa bila kutaja 'Mungu' waziwazi.
  alternative: Kutaja 'Mungu' kuwa ndiye mtendaji, au kutumia muundo usio na mtendaji maalumu.
  rationale: Kiebrania hakimtaji mtendaji kwa jina, ingawa muktadha unaelekeza kwa Mungu. Kuhifadhi 'yeye' huepuka kufanya kilicho dokezo kuwa kauli iliyo wazi zaidi kuliko chanzo.
- issue: Nguvu ya swali la כַּמָּה
  choice: Swali la balagha limehifadhiwa kama 'Ni mara ngapi...?'
  alternative: Kuligeuza kuwa kauli kama 'Ni mara chache sana...'
  rationale: Ayubu anapinga wazo kwamba waovu hupatwa na hukumu hiyo mara kwa mara, lakini chanzo kinauliza badala ya kutoa jibu wazi; tafsiri imehifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. Muundo wa maswali ya balagha na sitiari ya taa umehifadhiwa. 'Huzimika' na 'huwajia' zinatoa maana ya kawaida/ya mara kwa mara inayolingana na swali la frequency, bila kulazimisha jibu.
