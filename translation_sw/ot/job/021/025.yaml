  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: sw
  text: lakini mwingine hufa akiwa na uchungu moyoni, bila kufurahia mema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na huyu hufa akiwa na nafsi yenye uchungu, naye hakula mema.” Kiebrania kinadumisha picha ya kula kama njia ya kueleza kushiriki mema ya maisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: lakini mwingine
  rationale: Katika muktadha huu kishirikishi na kiwakilishi vinaonyesha tofauti kati ya hali ya mtu wa mstari uliotangulia na mtu huyu. Kiswahili cha ‘lakini mwingine’ kinaonyesha ulinganisho huo kwa kawaida.
- source_word: יָמוּת
  choice: hufa
  rationale: Kauli hapa inaeleza hali ya kawaida katika ulinganisho wa kishairi, si unabii mahsusi wa wakati ujao; kwa hiyo ‘hufa’ inafaa.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: akiwa na uchungu moyoni
  rationale: Kirai cha Kiebrania kwa karibu ni ‘kwa nafsi yenye uchungu.’ Kiswahili ‘uchungu moyoni’ huwasilisha kwa kawaida hali nzito ya ndani bila kudokeza fundisho maalumu kuhusu sehemu za mwanadamu.
- source_word: וְ/לֹא אָכַל
  choice: bila kamwe kufurahia
  rationale: Kitenzi maana yake ya msingi ni ‘kula,’ lakini pamoja na ‘mema’ ni tamathali ya kushiriki au kufurahia mema. ‘Bila kamwe kufurahia’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi picha halisi ya kula.
- source_word: בַּ/טּוֹבָה
  choice: mema
  rationale: Neno hilo linaweza kumaanisha wema, hali njema, au mafanikio. ‘Mema’ linabaki pana na halifungi maana katika utajiri pekee.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika kirai cha kishairi
  choice: akiwa na uchungu moyoni
  alternative: akiwa na nafsi yenye uchungu
  rationale: Hapa neno linaeleza hali ya ndani ya mtu. ‘Moyoni’ ni idiomu ya kawaida ya Kiswahili na huepuka kulazimisha ufafanuzi wa kimadhehebu kuhusu ‘nafsi,’ huku maana ya kihisia ikibaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Uchungu moyoni’ na ‘kufurahia mema’ ni vya kawaida; tanbihi inahifadhi muundo na picha ya Kiebrania kwa ukaribu zaidi.
