  yaml_path: translation/ot/job/021/002.yaml
  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: sw
  text: Sikilizeni kwa makini neno langu, na hilo liwe faraja yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “faraja zenu”; katika Kiebrania neno hili liko katika wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Sikilizeni kwa makini
  rationale: Kitenzi cha amri cha wingi pamoja na kitenzi-jina cha kusisitiza kinatoa wito wa kusikiliza kwa uangalifu; Kiswahili cha kawaida huonyesha msisitizo huo kwa kirai “kwa makini.”
- source_word: מִלָּתִי
  choice: maneno yangu
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, hapa inamaanisha yale Ayubu anayosema; wingi ni wa asili zaidi katika Kiswahili bila kubadili maana ya hotuba yake.
- source_word: וּתְהִי
  choice: na ... liwe
  rationale: Umbo la hiari/ombi la היה limewasilishwa kwa “liwe,” linalohifadhi maana ya ombi au matakwa.
- source_word: זֹאת
  choice: hilo
  rationale: Kiwakilishi hiki kinaacha wazi kama kinarejelea tendo la kusikiliza au jambo linalosemwa, kama ilivyo katika Kiebrania.
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: faraja yenu
  rationale: Nomino ya Kiebrania ni ya wingi ikiwa na kiambishi cha nafsi ya pili wingi, lakini Kiswahili hutumia kwa kawaida nomino dhahania ya umoja “faraja”; “yenu” huhifadhi wanaoambiwa kuwa wengi.
theological_decisions:
- issue: Kinachorejelewa na זֹאת (“hilo”)
  choice: Kuacha rejeo lake wazi
  alternative: Kulifafanua kuwa “kusikiliza kwenu”
  rationale: Kiebrania hakisemi wazi ikiwa faraja hiyo ni tendo la marafiki kusikiliza au jambo jingine linalohusiana na hotuba ya Ayubu; tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Sikilizeni” na “yenu” vinaonyesha kwamba Ayubu anazungumza na watu wengi; sentensi fupi inadumisha uzito na msisitizo wa ombi lake.
