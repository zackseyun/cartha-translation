  text: Nivumilieni[a], nami nitasema; na baada ya kusema kwangu[b], unaweza kudhihaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nistahimilieni,” “Mnikubalie niseme.” Kiebrania kinatumia kitenzi ambacho maana yake ya msingi ni “kubeba”; hapa kinamaanisha kumvumilia mtu au kumpa nafasi ya kusema.
    reason: lexical_alternative
  - marker: b
    text: Au, “na baada ya kusema kwangu, utadhihaki.” Kiebrania kinaweza kueleweka kama wakati ujao wa kawaida (“utadhihaki”) au kuwa na maana ya ruhusa au makubaliano (“unaweza kudhihaki”); matini kuu imechagua maana ya pili kwa sababu inafaa zaidi katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּ/נִי
  choice: Nivumilieni
  rationale: Kitenzi נָשָׂא kimsingi humaanisha kuinua, kubeba, au kustahimili; katika muktadha huu ni ombi kwa wasikilizaji wamvumilie na wampe nafasi ya kusema. Wingi wa amri umehifadhiwa katika -eni.
- source_word: וְ/אָנֹכִי
  choice: nami
  rationale: Kiwakilishi אָנֹכִי kina msisitizo. “Nami” huonyesha uratibu pamoja na msisitizo wa msemaji kwa Kiswahili cha kawaida.
- source_word: אֲדַבֵּר
  choice: nitasema
  rationale: Hii ndiyo tafsiri ya moja kwa moja na yenye hadhi ya kitenzi cha kusema katika kauli hii.
- source_word: וְ/אַחַר
  choice: na baada ya
  rationale: Kirai hiki kinaonyesha tendo linalofuata kwa wakati na kuhifadhi uratibu wa Kiebrania.
- source_word: דַּבְּרִי
  choice: mimi kusema
  rationale: Nomino-kitenzi yenye kiambishi cha nafsi ya kwanza ina maana halisi ya “kusema kwangu.” “Baada ya mimi kusema” ni ya asili na huhifadhi tendo badala ya kulibadili kuwa maneno au hotuba.
- source_word: תַלְעִיג
  choice: unaweza kunidhihaki
  rationale: Hifili ya לעג humaanisha kudhihaki au kukejeli. Umbo ni la nafsi ya pili umoja; kwa hiyo “unaweza” huhifadhi umoja huo, huku “kunidhihaki” likiweka wazi mlengwa wa dhihaka kutokana na muktadha.
theological_decisions:
- issue: Nguvu ya kimodal ya תַלְעִיג
  choice: unaweza kunidhihaki
  alternative: utanidhihaki
  rationale: Kitenzi cha Kiebrania kinaweza kusomwa kama wakati ujao wa kawaida au kwa maana ya ruhusa/makubaliano. Muktadha wa ombi la Ayubu asikilizwe kwanza unaunga mkono “unaweza,” lakini tanbihi huhifadhi uwezekano wa “utadhihaki.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Wingi wa ombi la kwanza na umoja wa kitenzi cha mwisho vimehifadhiwa kwa makusudi ili kuakisi mabadiliko ya idadi katika Kiebrania.
