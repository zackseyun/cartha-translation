  choice: mwili wangu unashikwa na kutetemeka
  rationale: Taswira ya kitu kuushika mwili imehifadhiwa. ‘Kutetemeka’ huwasilisha פַלָּצוּת, yaani mtetemeko unaotokana na hofu kuu.
