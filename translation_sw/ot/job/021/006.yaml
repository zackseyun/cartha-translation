- issue: Kitu anachokumbuka Ayubu hakitajwi wazi katika mstari huu.
  choice: 'Kuacha kiwakilishi cha jambo hilo bila nyongeza: ‘Ninapokumbuka’.'
  alternative: ‘Ninapokumbuka jambo hili’ au ‘ninapowakumbuka waovu’.
  rationale: Kiebrania hakitaji kitu cha kitenzi hapa; kukitaja kungeondoa utata wa kweli na kuingiza ufafanuzi wa muktadha ndani ya tafsiri.
