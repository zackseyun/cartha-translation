  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Taswira halisi ya maziwa na uboho imehifadhiwa; utata wa neno adimu עֲטִינָיו umeonyeshwa katika tanbihi badala ya kuondolewa.
