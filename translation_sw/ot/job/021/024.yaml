  text: עֲ֭טִינָי/ו מָלְא֣וּ חָלָ֑ב וּ/מֹ֖חַ עַצְמוֹתָ֣י/ו יְשֻׁקֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/024.yaml
  text: His pails are full of milk[a], and the marrow of his bones is well-watered.
translation:
  language: sw
  text: Vyombo vyake vimejaa maziwa[a], na uboho wa mifupa yake una unyevunyevu wa kutosha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Viwele vyake vimejaa maziwa.” Neno la Kiebrania ni adimu na huenda likamaanisha viwele au vyombo vya maziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: ndoo zake
  rationale: Nomino hii ni adimu na maana yake inajadiliwa; huenda ikamaanisha vyombo vya maziwa au viwele. “Ndoo zake” ni lugha ya kawaida inayoonyesha wingi, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: מָלְאוּ
  choice: zimejaa
  rationale: Kitenzi kinaeleza hali ya ustawi ya mtu anayezungumziwa, hivyo kauli ya hali “zimejaa” inafaa katika muktadha.
- source_word: חָלָב
  choice: maziwa
  rationale: Hii ndiyo maana ya kawaida ya neno, na hapa ni picha ya wingi na ustawi.
- source_word: וּמֹחַ
  choice: na uboho
  rationale: “Uboho” ni neno la kawaida la Kiswahili kwa sehemu laini iliyo ndani ya mifupa na linahifadhi picha halisi ya Kiebrania.
- source_word: עַצְמוֹתָיו
  choice: wa mifupa yake
  rationale: 'Muundo huu unawakilisha moja kwa moja uhusiano wa Kiebrania: uboho ulio wa mifupa yake.'
- source_word: יְשֻׁקֶּה
  choice: umelowana vizuri
  rationale: Kauli ya kutendwa inaonyesha uboho ukiwa na unyevunyevu wa kutosha, picha ya afya na nguvu; “umelowana vizuri” ni ya asili na inaeleweka kwa wasomaji wa sasa.
