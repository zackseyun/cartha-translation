  variant: Standard East African Swahili
source:
  edition: WLC
  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: sw
  text: Wanapitisha siku zao katika fanaka, na kwa ghafula wanashuka kwenda Sheoli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburini,” “katika makao ya wafu,” au “mautini.” Neno la Kiebrania ni Sheoli.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבלו
  choice: wanapitisha
  rationale: Kitenzi hiki katika muktadha kinaonyesha kutumia au kumaliza muda wa maisha; “wanapitisha siku zao” ni Kiswahili cha kawaida kinachohifadhi wazo hilo la muda.
- source_word: בַטּוֹב
  choice: katika fanaka
  rationale: Neno טוֹב hapa linaonyesha hali njema ya maisha, si wema wa kimaadili. “Fanaka” huwasilisha ustawi na hali njema bila kuongeza wazo la utajiri pekee.
- source_word: יְמֵיהֶם
  choice: siku zao
  rationale: Tafsiri ya moja kwa moja inayohifadhi usemi wa Kiebrania kuhusu muda wa maisha yao.
- source_word: וּבְרֶגַע
  choice: na kwa ghafula
  rationale: רֶגַע huonyesha muda mfupi sana. “Kwa ghafula” ni usemi wa asili wa Kiswahili unaoonyesha ukinzani kati ya siku nyingi za fanaka na kushuka kwao kunakotokea mara moja.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Jina limetoholewa badala ya kufupishwa kuwa “kaburi,” “mauti,” au neno la baadaye la kimafundisho; hivyo upana wa dhana ya Kiebrania unahifadhiwa.
- source_word: יֵחָתּוּ
  choice: wanashuka kwenda
  rationale: Katika uhusiano wake na Sheoli, kitenzi kinaeleweka kuwa kushuka kwenda katika makao ya wafu. Usemi huu ni wazi na wa kawaida kwa Kiswahili.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu; mauti
  rationale: “Sheoli” huhifadhi uwazi wa dhana ya Kiebrania kuhusu mahali au hali ya wafu bila kuifanya sawasawa na kaburi la mwili, mauti yenyewe, au fundisho la baadaye kuhusu jehanamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi ukinzani wa kishairi kati ya maisha marefu ya fanaka na kushuka kwa ghafula kwenda Sheoli.
