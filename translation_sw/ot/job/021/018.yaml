  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: sw
  text: 'Na wawe kama mabua ya nafaka mbele ya upepo,

    na kama makapi ambayo tufani huyanyakua.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo tufani huyaiba.” Kitenzi cha Kiebrania humaanisha kihalisi “kuiba,” na hapa kimetumiwa kishairi kuonyesha kuondolewa kwa ghafula.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Na wawe
  rationale: Kauli ya wakati usiotimilika hapa inaweza kuwa na nguvu ya kutakia au kutaja hatima inayowafaa katika usemi wa kishairi. “Na wawe” huhifadhi hali hiyo bila kuifanya kuwa amri ya moja kwa moja.
- source_word: כְּתֶבֶן
  choice: kama majani makavu
  rationale: תבן ni mabaki makavu ya mashina ya nafaka. “Majani makavu” ni usemi wa kawaida na unaoeleweka kwa urahisi katika Kiswahili, huku ukihifadhi picha ya kitu chepesi kinachopeperushwa.
- source_word: לִפְנֵי רוּחַ
  choice: mbele ya upepo
  rationale: Tafsiri hii huhifadhi tamathali ya Kiebrania ya kitu kilicho wazi kwa nguvu ya upepo na kinachosukumwa mbele yake.
- source_word: וּכְמֹץ
  choice: na kama makapi
  rationale: מֹץ ni takataka nyepesi inayotenganishwa na nafaka. “Makapi” ndilo neno sahihi na la kawaida katika picha hii ya kishairi.
- source_word: גְּנָבַתּוּ
  choice: huyanyakua
  rationale: Kitenzi גנב humaanisha kihalisi “kuiba,” lakini pamoja na tufani kinaeleza kuondolewa kwa ghafula na kwa nguvu. “Huyanyakua” ni cha asili katika Kiswahili na huhifadhi ukali wa picha; maana halisi zaidi imewekwa katika tanbihi.
- source_word: סוּפָה
  choice: tufani
  rationale: סוּפָה ni dhoruba kali au tufani. “Tufani” ni neno fupi, la kishairi, na lisilobana maana kuwa lazima ni upepo wa kisulisuli.
