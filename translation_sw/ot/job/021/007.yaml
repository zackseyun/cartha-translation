  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: sw
  text: Kwa nini waovu huendelea kuishi, huzeeka, na hata huwa na nguvu nyingi[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huwa na mali nyingi.” Neno la Kiebrania חָיִל linaweza kumaanisha mali, rasilimali, nguvu, au uwezo wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Kielezi cha kuuliza kinachoanzisha swali la malalamiko la Ayubu; tafsiri hii ni ya kawaida na huhifadhi nguvu ya swali.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Neno la kawaida katika fasihi ya hekima kwa watu wenye mwenendo mwovu, si walio na hatia kisheria tu.
- source_word: יִחְיוּ
  choice: huendelea kuishi
  rationale: Kauli ya Kiebrania hapa inaonyesha kuendelea kuwa hai licha ya hukumu inayotarajiwa; ‘huendelea kuishi’ huonyesha vizuri kiini cha malalamiko.
- source_word: עָתְקוּ
  choice: huzeeka
  rationale: Katika muktadha huu linaelekea kumaanisha kusonga mbele katika miaka; ‘huzeeka’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: גַּם
  choice: naam
  rationale: Huonyesha msisitizo unaoongezeka katika mfululizo wa mambo yanayowapata waovu.
- source_word: גָּבְרוּ
  choice: huwa na nguvu nyingi
  rationale: Huonyesha kuongezeka au kuwa mkuu katika nguvu, uwezo, au mafanikio.
- source_word: חָיִל
  choice: nguvu nyingi
  rationale: חָיִל linaweza kumaanisha nguvu, uwezo, mali, au rasilimali. Tafsiri ya jumla ‘nguvu nyingi’ huhifadhi upana wa maana, huku uwezekano wa mali ukitajwa katika tanbihi.
theological_decisions:
- issue: Aina ya mafanikio ya waovu katika חָיִל
  choice: nguvu nyingi
  alternative: mali nyingi
  rationale: Muktadha unaruhusu ustawi wa mali, lakini neno la Kiebrania ni pana kuliko mali pekee. Maandishi makuu yanahifadhi upana huo bila kuamua kwa lazima aina ya nguvu inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa swali na mfululizo wa vitenzi umehifadhiwa; ‘naam’ huleta msisitizo bila kuwa wa kimadhehebu.
