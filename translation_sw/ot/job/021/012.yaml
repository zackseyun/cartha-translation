  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: Wanaimba
  rationale: Kitenzi hiki kimsingi humaanisha ‘kuinua’ au ‘kuanza’; katika muktadha wa ala za muziki kinaeleweka kuwa kuanza au kuimba wimbo. ‘Wanaimba’ ni Kiswahili cha kawaida kinachowasilisha maana ya kimuktadha bila kuongeza ‘sauti zao,’ maneno yasiyopo wazi katika Kiebrania.
- source_word: תֹף
  choice: matari
  rationale: Ni ala ya kugongwa ya aina ya tamburini au ngoma ndogo; ‘matari’ ni neno sanifu la Kiswahili linalofaa katika orodha ya ala.
- source_word: כִּנּוֹר
  choice: kinubi
  rationale: Ni ala ya nyuzi ya kale, inayoweza kuitwa kinubi au zeze; ‘kinubi’ ni istilahi ya kibiblia inayotambulika na haidai kuwa ala hiyo ilikuwa kinanda cha kisasa.
- source_word: עוּגָב
  choice: filimbi
  rationale: Ni ala ya kupuliza au bomba la muziki; ‘filimbi’ ni tafsiri ya kawaida na inayoeleweka, huku utambulisho kamili wa ala ya kale ukiwa na kutokuwa na hakika.
