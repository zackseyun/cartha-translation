  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: sw
  text: Kwa maana mtu mwovu huhifadhiwa kwa ajili ya siku ya maafa[a]; waovu huletwa kwa siku ya ghadhabu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu mwovu huzuiliwa kwa ajili ya siku ya maafa,” au “huwekwa akiba kwa ajili ya siku ya maafa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuhifadhiwa, kuzuiliwa, au kuepushwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “waovu hupelekwa kwa siku ya ghadhabu.” Kitenzi cha mwisho kinaweza kueleweka kuwa kuongozwa, kuletwa, au kupelekwa kwa siku hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha sababu au maelezo yanayounganisha kauli hii na hoja iliyotangulia.
- source_word: לְיוֹם אֵיד
  choice: kwa ajili ya siku ya maafa
  rationale: Kirai hiki kinaelekeza kwenye wakati ujao; אֵיד humaanisha maafa, msiba, au uangamizi.
- source_word: יֵחָשֶׂךְ
  choice: huhifadhiwa
  rationale: Niphal ya חשׂך inaweza kumaanisha kuachwa bila kudhuriwa, kuzuiliwa, au kuwekwa akiba. ‘Huhifadhiwa’ hudumisha wazo la kutopata hukumu mara moja bila kuondoa uwezekano wa maana nyingine.
- source_word: רָע
  choice: mtu mwovu
  rationale: Kivumishi cha umoja kimetumika kama nomino kumaanisha mtu mwovu; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: לְיוֹם עֲבָרוֹת
  choice: kwenye siku ya ghadhabu
  rationale: עֲבָרוֹת ni wingi unaoweza kusisitiza ukali wa hasira; ‘ghadhabu’ hudumisha maana ya hukumu kwa lugha ya heshima na inayoeleweka.
- source_word: יוּבָלוּ
  choice: hupelekwa
  rationale: Hophil ya יבל humaanisha kuletwa, kuongozwa, au kupelekwa. Kitenzi cha Kiswahili bila kiwakilishi wazi kinaweza kuakisi badiliko la Kiebrania kutoka umoja kwenda wingi bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Uhusiano wa mtu mwovu na hukumu ya Mungu
  choice: Mtu mwovu hahukumiwi mara moja bali huhifadhiwa kwa siku ya baadaye ya maafa na ghadhabu.
  alternative: Mtu mwovu huzuiliwa asipatwe kabisa na siku ya maafa, au huletwa wazi wakati wa siku hiyo.
  rationale: Virai viwili vya wakati vyenye לְיוֹם na vitenzi vinavyohusu kuhifadhiwa na kupelekwa vinaelekea kuonyesha hukumu iliyoahirishwa. Hata hivyo, tanbihi zinadumisha upana wa maana wa vitenzi badala ya kuufunga.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Maafa’ na ‘ghadhabu’ vinafaa sajili ya kishairi ya Ayubu. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
