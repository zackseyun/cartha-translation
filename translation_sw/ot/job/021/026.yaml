  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: sw
  text: Wote wawili hulala mavumbini, na funza huwafunika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na minyoo huwafunika.” Neno la Kiebrania רִמָּה linaweza kumaanisha funza au minyoo katika muktadha wa kuoza kwa mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Wote wawili
  rationale: Katika muktadha, neno hili linasisitiza hatima moja ya watu wawili waliotofautishwa katika mistari iliyotangulia. ‘Wote wawili’ ni ya asili katika Kiswahili na huweka wazi rejeo hilo bila kubadili maana.
- source_word: עַל עָפָר
  choice: mavumbini
  rationale: Ingawa עַל kwa kawaida humaanisha ‘juu ya,’ pamoja na kitenzi cha kulala katika muktadha wa kifo na maziko, ‘mavumbini’ hutoa Kiswahili cha asili huku ikihifadhi taswira ya mavumbi.
- source_word: יִשְׁכָּבוּ
  choice: hulala
  rationale: Kauli ya mazoea huonyesha matokeo ya jumla yanayowapata wote wawili. ‘Hulala’ huhifadhi taswira halisi ya kujilaza katika kifo badala ya kuitafsiri zaidi kuwa ‘hupumzika.’
- source_word: רִמָּה
  choice: funza
  rationale: Katika muktadha wa kuoza kwa mwili, nomino hii humaanisha funza au minyoo. ‘Funza’ ni neno la kawaida na mahususi la Kiswahili kwa viumbe wanaohusishwa na uozo wa mwili.
- source_word: תְּכַסֶּה
  choice: huwafunika
  rationale: Kitenzi kinadumisha taswira ya viumbe hao kuifunika miili. Kiambishi cha wingi ‘wa-’ kinakubaliana kwa kawaida na ‘funza,’ ingawa nomino ya Kiebrania ina umbo la umoja wa kijumla.
- source_word: עֲלֵיהֶם
  choice: -wa- katika ‘huwafunika’
  rationale: Maana ya kiwakilishi ‘wao’ imeingizwa kwa kawaida katika kitenzi cha Kiswahili; hivyo sentensi haisikiki nzito kama ‘hufunika juu yao.’
