  yaml_path: translation/ot/job/021/009.yaml
  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: sw
  text: Nyumba zao[a] ziko salama, bila hofu; wala fimbo ya Mungu[b] haiko juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kaya zao ziko salama, bila hofu.”
    reason: lexical_alternative
  - marker: b
    text: “Fimbo ya Mungu” ni sitiari inayoweza kuashiria pigo, nidhamu, au mateso yatokayo kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: nyumba zao
  rationale: Huhifadhi maana ya msingi ya wingi wa בַּיִת na taswira halisi ya makao; katika muktadha inaweza pia kumaanisha watu wa nyumbani.
- source_word: שָׁלוֹם
  choice: ziko salama
  rationale: Hapa שָׁלוֹם inaeleza hali ya usalama na ustawi wa nyumba zao mbele ya hatari, si salamu wala ukosefu wa vita pekee.
- source_word: מִפָּחַד
  choice: bila hofu
  rationale: מִן pamoja na פַּחַד huonyesha kutengwa na hofu au kuwa huru kutokana nayo. Kiswahili ‘bila hofu’ ni cha kawaida na hudumisha maana hiyo.
- source_word: שֵׁבֶט
  choice: fimbo
  rationale: ‘Fimbo’ huhifadhi sitiari pana ya שֵׁבֶט bila kuibadili moja kwa moja kuwa adhabu, nidhamu, au mateso.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni umbo la kishairi la umoja linalomtaja Mungu; hakuna msingi wa kuongeza cheo kingine.
- source_word: עֲלֵיהֶם
  choice: juu yao
  rationale: Tafsiri hii hufuata kwa karibu taswira ya fimbo kuwa juu yao au kuwajia, bila kubainisha zaidi namna ya tendo hilo.
- source_word: וְלֹא
  choice: wala ... haiko
  rationale: ‘Wala’ huunganisha kishairi kishazi cha pili chenye ukanushi na cha kwanza kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya tendo la Mungu linalowakilishwa na ‘fimbo ya Mungu’
  choice: Kudumisha sitiari ‘fimbo ya Mungu’ bila kutaja moja kwa moja adhabu, nidhamu, au mateso.
  alternative: adhabu ya Mungu; nidhamu ya Mungu; pigo la Mungu
  rationale: Sitiari ya Kiebrania inaweza kuhusisha kupiga, kuadibu, au kuleta mateso. Kutaja moja ya maana hizo pekee kungeondoa upana na mvutano uliopo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Nyumba zao’ huhifadhi taswira halisi huku tanbihi ikitaja maana pana ya watu wa nyumbani. Mpangilio ‘haiko juu yao’ umeachwa ili kuhifadhi sitiari na kutobainisha kupita kiasi aina ya tendo la Mungu.
