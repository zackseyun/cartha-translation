  naturalness: «Ni nani anayemwambia juu ya mwenendo wake usoni pake?» ni Kiswahili sanifu na cha sasa, na «usoni pake» huhifadhi usemi wa kumkabili moja kwa moja. Tanbihi ya kwanza imerekebishwa kidogo ili «kwa maneno halisi» iwe ya kawaida zaidi kuliko «kwa neno moja moja».
