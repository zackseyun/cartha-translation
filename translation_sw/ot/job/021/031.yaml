  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: sw
  text: Ni nani anayemwambia juu ya mwenendo wake usoni pake[a]? Na kwa yale aliyoyafanya[b], ni nani anayemlipa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele yake”; kwa maneno halisi, “juu ya uso wake,” yaani kumkabili moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kwa ufupi, “naye ametenda; ni nani anayemlipa?” Tafsiri inaweka wazi maana inayowezekana, “kwa yale aliyoyafanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha maswali ya balagha. Ingawa jibu linalodokezwa ni ‘hakuna,’ muundo wa swali umehifadhiwa.
- source_word: יַגִּיד
  choice: anayemweleza
  rationale: Hifili ya נגד humaanisha kueleza, kutangaza, au kujulisha. ‘Anayemweleza’ ni ya kawaida katika Kiswahili na hapa inadokeza kumkabili mtu kwa kumtaja mwenendo wake.
- source_word: עַל פָּנָיו
  choice: usoni pake
  rationale: Nahau hii, ambayo kwa neno moja moja ni ‘juu ya uso wake,’ humaanisha kumwambia mtu moja kwa moja akiwa mbele yako. ‘Usoni pake’ huhifadhi uzito wa makabiliano.
- source_word: דַּרְכּוֹ
  choice: mwenendo wake
  rationale: דֶּרֶךְ inaweza kumaanisha njia halisi au, kwa mfano, tabia na namna ya kuishi. ‘Mwenendo wake’ huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: וְהוּא עָשָׂה
  choice: kwa yale aliyoyafanya
  rationale: Kiebrania ni kifupi na kinaweza kutafsiriwa moja kwa moja ‘naye ametenda.’ Katika muktadha, kishazi kinaonyesha msingi wa malipo; kuongeza ‘kwa yale’ hufanya uhusiano huo uwe wazi bila kubadili maana.
- source_word: יְשַׁלֶּם לוֹ
  choice: anayemlipa
  rationale: Pieli ya שלם hapa ina maana ya kumlipa mtu kulingana na matendo yake. ‘Anayemlipa’ ni ya kawaida na bado inaweza kubeba maana ya malipo ya kulipiza.
