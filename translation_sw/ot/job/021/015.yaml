  text: Mwenyezi ni nani hata tumtumikie? Nasi tuna faida gani tukimsihi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: Mwenyezi ni nani
  rationale: Katika swali hili la kejeli, מַה huhoji umuhimu au hadhi ya Shaddai, si utambulisho wake tu. Kiswahili hutumia kwa kawaida “ni nani” kwa nafsi, huku “Mwenyezi” likitafsiri cheo cha Mungu kwa lugha inayoeleweka.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: hata tumtumikie
  rationale: כִּי linaunganisha swali na matokeo yanayodaiwa; “hata” huleta vizuri nguvu ya kejeli katika Kiswahili. עבד kuhusu Mungu ni kumtumikia kwa utiifu na ibada, hivyo “t umtumikie” linahifadhi maana pana.
- source_word: וּמַה נּוֹעִיל
  choice: Nasi tutapata faida gani
  rationale: הועיל hapa huhusu manufaa au faida. Kauli hii ya kawaida inaonyesha mtazamo wao wa kupima ibada kwa faida watakayopata.
- source_word: כִּי נִפְגַּע בּוֹ
  choice: tukimsihi
  rationale: פגע ב katika muktadha huu humaanisha kumsihi au kumwomba mtu kwa bidii. Muundo wa “tuki-” huwasilisha vizuri hali inayodokezwa na כִּי.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu שַׁדַּי
  choice: Mwenyezi
  alternative: Shadai
  rationale: שַׁדַּי ni cheo cha Mungu; kukitafsiri kuwa “Mwenyezi” kunawasilisha maana yake kwa msomaji wa kawaida bila kulifanya kuwa jina la pekee.
- issue: Nguvu ya swali מַה שַׁדַּי
  choice: Mwenyezi ni nani
  alternative: Mwenyezi ni nini
  rationale: “Nani” ni Kiswahili cha kawaida kinachofaa kwa nafsi. Muktadha bado unaonyesha wazi kuwa waovu wanadharau umuhimu na mamlaka yake, si kuuliza tu utambulisho wake.
translation_notes:
