  text: Kwa maana, ana haja gani na nyumba yake baada yake?[a][b] Wakati hesabu ya miezi yake imekatwa?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ana furaha gani katika nyumba yake baada yake?”
    reason: lexical_alternative
  - marker: b
