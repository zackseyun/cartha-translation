    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutanguliza sababu au ufafanuzi unaoendeleza hoja iliyotangulia.
- source_word: מַה חֶפְצוֹ
  choice: anajali nini
  rationale: Kirai hiki kina nguvu ya swali la balagha. חֵפֶץ inaweza kumaanisha furaha, tamaa, mapendezi au kujali; hapa ‘anajali nini’ ni Kiswahili cha kawaida kinachobaki na maana hiyo.
- source_word: בְּבֵיתוֹ
  choice: kuhusu nyumba yake
  rationale: Kihusishi ב pamoja na חֵפֶץ kinaweza kuonyesha kitu kinachohusika na kujali au kupendezwa. ‘Nyumba’ inadumisha picha halisi, huku uwezekano wa ‘watu wa nyumbani/familia’ ukielezwa katika tanbihi.
- source_word: אַחֲרָיו
  choice: baada yake
  rationale: Tafsiri hii inahifadhi usemi mfupi wa Kiebrania na kutodokeza wazi zaidi ya chanzo ikiwa maana ni baada ya kifo chake au baada ya kuondoka kwake.
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: Wakati idadi ya miezi yake
  rationale: וּ imewasilishwa kwa uhusiano wa wakati unaofaa muktadha, na ‘miezi’ imehifadhiwa badala ya kujumlishwa kuwa maisha.
- source_word: חֻצָּצוּ
  choice: imekatizwa
  rationale: Kitenzi cha hali ya kutendwa kinaweza kueleweka kuwa kipindi kimekatwa au kimefikia kikomo. Kiswahili kinapatanishwa na kiima cha karibu ‘idadi’; maana mbadala ya ‘imeamuliwa/imegawanywa’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Hali ya mtu baada ya kifo na uhusiano wake na walio nyumbani
  choice: Usemi ‘baada yake’ umeachwa bila kufafanuliwa zaidi.
  alternative: ‘baada ya kufa kwake’ au kauli inayodai kwamba hajui wala hajali lolote baada ya kifo
  rationale: Mstari unauliza swali la balagha kuhusu kujali nyumba baada yake, lakini hauhitaji tafsiri kuongeza fundisho maalumu kuhusu ufahamu wa wafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limehifadhiwa kwa mtindo wa kawaida; picha ya ‘nyumba’ na ‘miezi’ haijafupishwa kwa maneno ya jumla.
