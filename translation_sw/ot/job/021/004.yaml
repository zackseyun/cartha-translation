  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: sw
  text: Je, malalamiko yangu ni dhidi ya mwanadamu? Ikiwa sivyo, kwa nini roho yangu isikose subira?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: malalamiko yangu
  rationale: Katika muktadha huu nomino hii ina maana ya malalamiko au hoja ya huzuni, si mazungumzo ya kawaida.
- source_word: לְאָדָם
  choice: dhidi ya mwanadamu
  rationale: Kiambishi לְ kinaeleweka hapa kuwa kinaonyesha mlengwa wa malalamiko; 'mwanadamu' huhifadhi umoja wa jumla wa אָדָם.
- source_word: תִקְצַר רוּחִי
  choice: nisiwe na papara
  rationale: Nahau ya Kiebrania, kihalisi 'roho yangu iwe fupi,' huonyesha kukosa subira; usemi huu ni wa asili na unaeleweka katika Kiswahili.
theological_decisions:
- issue: Mlengwa wa malalamiko ya Ayubu
  choice: dhidi ya mwanadamu
  alternative: kwa mwanadamu
  rationale: Tafsiri hii hudokeza kuwa malalamiko yake hayalengwi kwa wanadamu, bila kutaja wazi mlengwa mwingine ambaye maandishi yenyewe hayamtaji.
- issue: Uhusiano wa וְאִם na swali la kwanza
  choice: Ikiwa sivyo
  alternative: Na ikiwa ndivyo / na kwa nini
  rationale: Huhifadhi usomaji wa masharti unaounganisha swali la pili na jibu hasi linalodokezwa na la kwanza, sambamba na ushahidi wa maandishi na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili umehifadhiwa; nahau ya Kiebrania imetolewa kwa Kiswahili cha kawaida badala ya tafsiri ngumu ya neno kwa neno.
