  text: זַרְעָ֤/ם נָכ֣וֹן לִ/פְנֵי/הֶ֣ם עִמָּ֑/ם וְ֝/צֶאֱצָאֵי/הֶ֗ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: sw
  text: Wazao wao wako imara mbele yao, pamoja nao; na vizazi vyao viko mbele ya macho yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַרְעָם
  choice: wazao wao
  rationale: Neno זֶרַע hapa linamaanisha uzao kwa maana ya pamoja; “wazao wao” ni Kiswahili cha kawaida kinachofaa katika muktadha wa ustawi wa familia.
- source_word: נָכוֹן
  choice: wameimarika
  rationale: Umbo hili linaeleza hali ya kuwa thabiti, imara, au salama. “Wameimarika” huhifadhi maana ya hali iliyothibitishwa bila kuifasiri moja kwa moja kuwa usalama pekee.
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Tafsiri ya karibu ya Kiebrania inayodumisha picha ya wazazi kuwaona wazao wao wakiendelea vizuri.
- source_word: עִמָּם
  choice: wakiwa pamoja nao
  rationale: Huwasilisha wazi maana ya “pamoja nao” na kudumisha msisitizo kwamba wazao hao wako hai na karibu nao.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: na vizazi vyao
  rationale: צֶאֱצָאִים humaanisha uzao au vizazi vinavyotokana nao. “Vizazi vyao” hutofautisha neno hili na “wazao” huku kikihifadhi ulinganifu wa kishairi.
- source_word: לְעֵינֵיהֶם
  choice: mbele ya macho yao
  rationale: Huhifadhi taswira halisi na yenye nguvu ya Kiebrania, ikimaanisha kwamba wanawaona wenyewe.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na urudiaji wa “mbele yao/mbele ya macho yao” umehifadhiwa; “wakiwa pamoja nao” umetengwa kwa koma ili kuonyesha kipashio tofauti cha Kiebrania.
