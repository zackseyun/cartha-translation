lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili la kuvuta fikira linatafsiriwa kwa Kiswahili cha kawaida na chenye hadhi, likihifadhi msisitizo wa msemaji.
- source_word: טוּבָם
  choice: ustawi wao
  rationale: Katika muktadha huu טוּב inaelekea kumaanisha hali njema au mafanikio ya waovu, si wema wao wa kimaadili.
- source_word: בְיָדָם
  choice: mikononi mwao
  rationale: Taswira ya Kiebrania imehifadhiwa; inaonyesha kuwa ustawi huo uko chini ya uwezo au udhibiti wao.
- source_word: עֲצַת רְשָׁעִים
  choice: Shauri la waovu
  rationale: Tafsiri hii inahifadhi maana pana ya עֵצָה kama shauri, mpango, au mtazamo unaoongoza.
- source_word: רָחֲקָה מֶנִּי
  choice: liko mbali nami
  rationale: Usemi wa chanzo umehifadhiwa kwa njia ya asili, ukionyesha kujitenga kwa Ayubu na shauri la waovu.
theological_decisions:
- issue: Nguvu ya לֹא katika sentensi iliyoanzishwa na הֵן
  choice: 'Imeandikwa kama swali la balagha: “je, ... hauko ...?”'
  alternative: “Tazama, ustawi wao hauko mikononi mwao.”
  rationale: Muundo wa Kiebrania unaweza kusomwa kama kauli yenye msisitizo au swali la balagha. Swali linahifadhi mvutano wa hoja ya Ayubu na linaendana na ushahidi wa safu ya mashauriano bila kuamua kimya kimya maana yake ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa msomaji wa kawaida. Taswira na utata wa hoja ya Kiebrania vimehifadhiwa.
