base_translation:
  language: en
  yaml_path: translation/ot/job/021/027.yaml
  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
translation:
  language: sw
  text: Tazama, ninajua mawazo yenu na hila mnazotumia kunidhulumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inaweza pia kutafsiriwa, “na hila mnazopanga dhidi yangu,” au “na mipango ya kikatili mnayonipangia.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kutenda jeuri, kuonea, au kudhulumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni neno la kusisitiza na kuvuta usikivu. “Tazama” linaweka nguvu hiyo kwa lugha ya heshima na inayoeleweka.
- source_word: יָדַעְתִּי
  choice: ninajua
  rationale: Kauli timilifu ya Kiebrania hapa inaeleza ujuzi wa sasa; wakati uliopo ni wa kawaida zaidi katika Kiswahili.
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: mawazo yenu
  rationale: “Mawazo” linabaki karibu na maana pana ya neno la Kiebrania, ambalo pia linaweza kumaanisha mipango au makusudi.
- source_word: וּמְזִמּוֹת
  choice: na hila
  rationale: Katika muktadha huu neno linaashiria mipango ya hila yenye nia mbaya, si mipango isiyo na upande.
- source_word: עָלַי
  choice: kunidhulumu
  rationale: Maana ya uadui wa kishazi hiki imewasilishwa kwa kumfanya Ayubu kuwa mlengwa wa tendo hilo, kwa mtindo wa asili wa Kiswahili.
- source_word: תַּחְמֹסוּ
  choice: mnazotumia kunidhulumu
  rationale: Kitenzi kinaweza kumaanisha kutenda jeuri, kuonea, au kumkosea mtu kwa dhuluma. “Kunidhulumu” huhifadhi wazo la tendo lisilo la haki bila kulifanya lazima liwe jeuri ya kimwili.
