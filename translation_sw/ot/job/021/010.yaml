  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
translation:
  language: sw
  text: Fahali wake hupanda wala hashindwi[a]; ng’ombe wake huzaa wala hapotezi mimba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “wala hakatai” au “wala hafanyi kuwa tasa.” Kitenzi cha Kiebrania hapa kina maana isiyo hakika; tafsiri katika mstari inafuata ulinganifu wa kishairi: kupanda kwa fahali kunafanikiwa, si bure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: fahali wake
  rationale: Katika muktadha wa uzazi, שׁוֹר ni ng’ombe dume wa kuzalisha; “fahali” ni sahihi kuliko neno pana “ng’ombe.”
- source_word: עִבַּר
  choice: hupandisha
  rationale: Hapa kitenzi kinaeleza tendo la fahali kumpandisha ng’ombe jike kwa mafanikio. “Hupandisha” ni usemi wa kawaida wa Kiswahili kuhusu uzalishaji wa mifugo.
- source_word: וְלֹא יַגְעִל
  choice: bila kushindwa
  rationale: Kitenzi געל ni kigumu katika mstari huu. Sambamba na kuzaa na kutoharibu mimba, maana ya muktadha ni kwamba tendo la kuzalisha halikosi matokeo; tafsiri hii haitilii mkazo maana finyu isiyo hakika.
- source_word: תְּפַלֵּט
  choice: huzaa
  rationale: Piel ya פלט hapa ni kuleta mtoto tumboni hadi kuzaliwa. “Huzaa” ni ya asili na wazi katika Kiswahili.
- source_word: פָּרָתוֹ
  choice: ng’ombe wake
  rationale: פָּרָה ni ng’ombe jike. Katika Kiswahili cha kawaida “ng’ombe” hutosha hapa, huku “fahali” katika kishazi cha kwanza ikibainisha tofauti ya jinsia.
- source_word: וְלֹא תְשַׁכֵּל
  choice: bila kuharibu mimba
  rationale: Katika muktadha wa kuzaa, Piel ya שׁכל inaonyesha kupoteza mtoto kabla ya kuzaliwa au kunyimwa uzao; “kuharibu mimba” ni usemi wa kawaida na mfupi.
