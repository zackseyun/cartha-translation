  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: sw
  text: 'Hata hivyo, yeye atapelekwa makaburini[a],

    na juu ya lundo[b] mtu atakesha[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “kwenye makaburi” kwa wingi; huenda kinamaanisha eneo la maziko kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: “Lundo” limetafsiri neno la Kiebrania linalomaanisha rundo au kitu kilichorundikwa; hapa huenda ni udongo ulioinuliwa juu ya kaburi.
    reason: cultural_note
  - marker: c
    text: Au, “naye atakesha juu ya lundo,” ikiwa marehemu ndiye mtendaji wa kitenzi; Kiebrania hakimtaji mtendaji waziwazi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Hata hivyo, yeye
  rationale: Kiunganishi וְ kinaweza kumaanisha “na” au kuwa na nguvu ya upinzani katika muktadha. “Hata hivyo” linaonyesha tofauti kati ya maisha ya mwovu yaliyotangulia na maziko yake yenye heshima, huku kiwakilishi “yeye” kikihifadhi msisitizo wa Kiebrania.
- source_word: לִקְבָרוֹת
  choice: makaburini
  rationale: Nomino ya Kiebrania iko katika wingi. “Makaburini” huhifadhi wingi huo na kwa Kiswahili inaweza pia kumaanisha eneo la maziko kwa ujumla.
- source_word: יוּבָל
  choice: hupelekwa
  rationale: Hii ni hali ya Hophal ya יבל, yenye maana ya kuongozwa, kuletwa, au kubebwa. “Hupelekwa” ni ya kawaida katika muktadha wa kupelekwa kuzikwa bila kulazimisha kwamba lazima abebwe kimwili.
- source_word: וְעַל
  choice: na juu ya
  rationale: Hili ni toleo la moja kwa moja la וְ pamoja na kihusishi עַל, likihifadhi mahali pa tendo kuhusiana na lundo.
- source_word: גָּדִישׁ
  choice: lundo
  rationale: גָּדִישׁ kimsingi ni rundo au kitu kilichokusanywa kwa kurundikwa. Katika muktadha huu linaelekea kumaanisha udongo ulioinuliwa juu ya kaburi; “lundo” huhifadhi picha halisi bila kulifanya neno lenyewe kuwa “kaburi.”
- source_word: יִשְׁקֹד
  choice: mtu hukesha
  rationale: Kitenzi שׁקד humaanisha kuwa macho, kukesha, au kulinda kwa uangalifu. Kiebrania hakitaji wazi mtendaji; “mtu hukesha” ni Kiswahili cha asili kinachowasilisha tendo bila kumtambulisha mlinzi maalumu, huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
theological_decisions:
- issue: Mtendaji wa יִשְׁקֹד hajatajwa wazi
  choice: Mstari mkuu unasema “mtu hukesha,” bila kumtambulisha mtu huyo.
  alternative: “Naye hukesha juu ya lundo,” ambapo marehemu ndiye mtendaji.
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja lakini hakina nomino au kiwakilishi cha mtendaji katika kishazi hiki. Tafsiri haipaswi kuamua kimyakimya ikiwa anayekesha ni marehemu au mtu mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Makaburini” ni cha kawaida na huhifadhi wingi wa chanzo; “lundo” huhifadhi taswira ya Kiebrania. Mpangilio “juu ya lundo mtu hukesha” umehifadhi uzito wa kishazi kilichotangulizwa katika chanzo.
