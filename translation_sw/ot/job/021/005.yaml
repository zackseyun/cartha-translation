  yaml_path: translation/ot/job/021/005.yaml
  text: Turn to me and be appalled[a], and put your hand over your mouth.
translation:
  language: sw
  text: Nigeukieni, mkastaajabu; kisha kila mmoja aweke mkono wake juu ya kinywa chake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Nigeukieni
  rationale: Amri ya wingi ya פנה pamoja na אֵלַי inaelekeza wasikilizaji wageuke na kumwelekea msemaji. “Nigeukieni” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וְהָשַׁמּוּ
  choice: na mshangae
  rationale: Kitenzi שׁמם katika muktadha huu kinaonyesha kushtushwa sana au kubaki katika mshangao. “Mshangae” huhifadhi upana wa maana bila kuamua kwamba hisia hiyo ni hofu pekee.
- source_word: וְשִׂימוּ
  choice: wekeni
  rationale: Amri ya wingi ya שׂים ina maana ya kuweka. “Wekeni” ni chaguo la kawaida na linalofaa kwa ishara inayofuata.
- source_word: יָד עַל פֶּה
  choice: mikono yenu juu ya vinywa vyenu
  rationale: Kiebrania hutumia nomino za umoja kwa maana ya kugawa kwa kila mmoja katika kundi. Kiswahili cha asili hutumia wingi hapa kwa kuwa amri inaelekezwa kwa watu wengi; ishara ni kufunika au kuweka mkono mdomoni kwa mshangao au kunyamaza.
