  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: sw
  text: Huwatuma watoto wao wadogo kama kundi la mifugo midogo[a], nao watoto wao huruka-ruka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama kundi la kondoo.” Neno la Kiebrania צֹאן linaweza kumaanisha kwa ujumla mifugo midogo, hasa kondoo na mbuzi.
    reason: lexical_alternative
  - marker: b
    text: Au, “hucheza” au “hudunda.” Kitenzi cha Kiebrania huonyesha mwendo mchangamfu na wa furaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: huwaacha ... watoke
  rationale: Pieli ya שלח ina maana ya kuwatuma au kuwaacha waende. Katika muktadha huu, usemi huu wa Kiswahili unaonyesha watoto wakiruhusiwa kutoka kwa uhuru bila kudokeza kwamba wanafukuzwa.
- source_word: כַצֹּאן
  choice: kama kundi la kondoo
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi. Taswira ya kundi ni ya asili katika Kiswahili na inahifadhi maana ya watoto wengi wanaotoka pamoja.
- source_word: עֲוִילֵיהֶם
  choice: watoto wao wadogo
  rationale: עויל humaanisha watoto wa umri mdogo sana. 'Watoto wao wadogo' huhifadhi maana hiyo bila kuibana kwa watoto wachanga pekee.
- source_word: יַלְדֵיהֶם
  choice: watoto wao
  rationale: Nomino ילד hapa humaanisha watoto au wazao kwa ujumla. 'Watoto wao' ni tafsiri ya kawaida na hudumisha usambamba na kishazi cha kwanza.
- source_word: יְרַקֵּדוּן
  choice: hucheza kwa kurukaruka
  rationale: רקד huonyesha mwendo mchangamfu wa kucheza, kuruka-ruka, au kudunda. 'Hucheza kwa kurukaruka' huwasilisha shangwe na mwendo wa kitenzi bila kuamua kwamba ni dansi iliyopangwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazoea ('huwaacha', 'hucheza') unafaa kwa maelezo ya hali ya kawaida ya watu waovu katika muktadha. Taswira ya mifugo imewekwa wazi kwa lugha ya kawaida.
