  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: sw
  text: Je, Mungu huwahifadhia wana wa mtu mwovu uovu wake[c]?[a] Na amlipe mtu huyo mwenyewe, ili apate kujua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa ukaribu zaidi: “Mungu huwahifadhia wana wa mtu mwovu uovu wake; na amlipe, ili apate kujua.” Kiebrania kinaweza kusomwa bila swali la balagha, lakini muktadha unaonyesha kwamba Ayubu analipinga wazo hilo.'
    reason: alternative_reading
  - marker: c
    text: Neno lililotafsiriwa “uovu” linaweza pia kumaanisha taabu au matokeo ya uovu, yaani adhabu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Ni neno la kawaida la umoja linalomtaja Mungu katika kitabu cha Ayubu; ‘Mungu’ ni sawa la asili katika Kiswahili bila kuongeza maana isiyokuwamo wazi.
- source_word: יִצְפֹּן
  choice: huwahifadhia
  rationale: Kitenzi צפן kina maana ya kuweka au kuhifadhi kitu kwa ajili ya wakati ujao. Muundo huu wa Kiswahili unaonyesha kwamba kile kinachohifadhiwa kimekusudiwa wana wa mtu huyo.
- source_word: לְבָנָיו
  choice: wanawe
  rationale: Kiebrania kinasema wazi ‘wana wake’ kwa wingi wa kiume. Tafsiri inadumisha usemi huo, huku tanbihi ikieleza uwezekano wa maana pana ya wazao.
- source_word: אוֹנוֹ
  choice: uovu wake
  rationale: אוֹן inaweza kumaanisha uovu, taabu, au matokeo ya uovu. ‘Uovu wake’ hudumisha maana ya msingi na utata wa Kiebrania badala ya kuamua kimya-kimya kuwa neno hilo linamaanisha adhabu.
- source_word: יְשַׁלֵּם
  choice: Na amlipe
  rationale: 'Katika Piel, שׁלם humaanisha kulipa au kulipiza. Hapa muundo wa ombi/amri unafaa hoja ya Ayubu: Mungu amlipo mtu huyo mwenyewe badala ya kuwawekea wanawe matokeo.'
- source_word: אֵלָיו
  choice: mtu huyo mwenyewe
  rationale: Kiwakilishi kinamrejelea mtu mwovu. ‘Mtu huyo mwenyewe’ huweka wazi tofauti iliyokusudiwa kati yake na wanawe bila kuongeza mhusika mpya.
- source_word: וְיֵדָע
  choice: ili apate kujua
  rationale: ידע humaanisha ‘kujua.’ Katika muktadha, kiunganishi pamoja na kitenzi kisichotimilika kinaweza kuonyesha kusudi au matokeo; Kiswahili hiki kinadumisha wazo hilo bila kubadili ‘kujua’ kuwa ‘kuhisi.’
theological_decisions:
- issue: Ikiwa kishazi cha kwanza ni dai la Ayubu mwenyewe au wazo analolipinga
  choice: Kukitafsiri kama swali la balagha, kisha kuonyesha dai la Ayubu kwamba mtu mwenyewe ndiye anayepaswa kulipwa.
  alternative: 'Kukitafsiri kama taarifa ya moja kwa moja: ‘Mungu huwahifadhia wanawe uovu wake; na amlipe, ili apate kujua.’'
  rationale: Muktadha wa Ayubu 21 unapinga jibu kwamba hukumu ya waovu inatosheleza inapowapata watoto wao. Swali la balagha linaonyesha mtiririko huo wa hoja, lakini tanbihi inadumisha uwezekano wa kusoma Kiebrania kama taarifa.
- issue: Maana ya אוֹנוֹ katika muktadha wa haki ya Mungu
  choice: Kutumia ‘uovu wake’ katika matini na kueleza maana nyingine katika tanbihi.
  alternative: Kutumia ‘adhabu yake’ au ‘taabu yake’ katika matini.
  rationale: Neno la Kiebrania lina wigo unaoweza kuhusisha uovu wenyewe au taabu/matokeo yake. ‘Uovu wake’ ni wa karibu zaidi na chanzo na huepuka kuamua mapema kwamba adhabu ndiyo maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Swali la balagha na muundo ‘Na amlipe’ vinadumisha nguvu ya pingamizi la Ayubu. Kiwakilishi kimefafanuliwa kuwa ‘mtu huyo mwenyewe’ ili kuonyesha tofauti na wanawe.
