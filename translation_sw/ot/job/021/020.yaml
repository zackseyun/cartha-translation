base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: sw
  text: Macho yake mwenyewe na yaone maangamizi yake[b][a], naye anywe ghadhabu ya Mwenyezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Macho yake yataona maangamizi yake, naye atakunywa ghadhabu ya Mwenyezi.” Vitenzi vya Kiebrania vinaweza kueleweka kama utabiri badala ya tamanio.
    reason: alternative_reading
  - marker: b
    text: “Maangamizi yake” pia yanaweza kutafsiriwa “msiba wake” au “janga lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: na yaone
  rationale: Qal imperfect 3mp ya ראה, ikipatana na kiima cha wingi ‘macho yake.’ Katika muktadha imewasilishwa kama tamanio au dai lenye nguvu, huku hali ya utabiri ikihifadhiwa katika tanbihi [a].
- source_word: עֵינָיו
  choice: macho yake mwenyewe
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume humaanisha ‘macho yake’; ‘mwenyewe’ huonyesha kwamba mtu mwovu ndiye anayepaswa kushuhudia matokeo hayo binafsi.
- source_word: כִּידוֹ
  choice: maangamizi yake
  rationale: כיד inaweza kumaanisha maangamizi, msiba, au janga. ‘Maangamizi’ huwasilisha kuanguka kwake bila kulazimisha wazo la kutoweka kabisa; chaguo jingine limetajwa katika tanbihi [b].
- source_word: וּמֵחֲמַת
  choice: naye anywe ghadhabu ya
  rationale: חֵמָה hapa ni ghadhabu kali ya hukumu. Kiswahili cha ‘anywe ghadhabu’ kinahifadhi sitiari ya Kiebrania kwa njia ya kawaida zaidi kuliko ‘anywe kutoka katika ghadhabu.’
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Hili ni jina la cheo cha Mungu שדי; ‘Mwenyezi’ ni tafsiri ya kawaida na yenye hadhi katika Kiswahili.
- source_word: יִשְׁתֶּה
  choice: anywe
  rationale: Qal imperfect 3ms ya שתה imetafsiriwa kwa hali ya kutakia, sambamba na ‘na yaone.’ Kitenzi ‘kunywa’ kinahifadhi sitiari ya kuipokea hukumu binafsi.
theological_decisions:
- issue: Nguvu ya vitenzi vya imperfect katika mstari huu
  choice: 'Vimetafsiriwa kama tamanio au dai: ‘na yaone … anywe.’'
  alternative: 'Utabiri wa wakati ujao: ‘Macho yake yataona … naye atakunywa.’'
  rationale: Muktadha unaonyesha Ayubu akisisitiza kwamba mtu mwovu mwenyewe akabili hukumu, si watoto wake tu. Hata hivyo, maumbo ya Kiebrania yanaweza pia kueleweka kama utabiri; uwezekano huo umehifadhiwa katika tanbihi [a].
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kutakia ‘na yaone … anywe’ umechaguliwa ili kudumisha msukumo wa mstari, huku sitiari ya ‘kunywa ghadhabu’ ikihifadhiwa.
