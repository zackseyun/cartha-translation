  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: sw
  text: Mabonge ya udongo wa bonde ni matamu kwake[a]; wanadamu wote humfuata[b][c], na waliomtangulia hawana idadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mabonge ya udongo wa korongo au wa mkondo wa maji wa msimu ni matamu kwake.” Neno la Kiebrania נחל linaweza kumaanisha bonde, korongo, au mkondo wa maji wa msimu.
    reason: lexical_alternative
  - marker: b
    text: Au, “watu wote humfuata”; kwa neno halisi, “kila adam/mtu.” Neno la Kiebrania אָדָם hapa lina maana ya kijumla ya binadamu.
    reason: lexical_alternative
  - marker: c
    text: 'Mstari huu unaweza kuonyesha msafara wa mazishi au mwendo wa wanadamu wote kuelekea kifo: watu wasiohesabika walimtangulia, na wanadamu wote humfuata.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ
  choice: ni matamu
  rationale: Kitenzi hiki hutaja utamu au hali ya kupendeza. Tafsiri hii inadumisha sitiari ya Kiebrania kwamba udongo wa kaburi ni mtamu au wa kupendeza kwake, badala ya kuifafanua moja kwa moja.
- source_word: לּוֹ
  choice: kwake
  rationale: Hii ni tafsiri ya kawaida ya kihusiano inayoonyesha jinsi mtu huyo anavyouona au kuupitia udongo huo.
- source_word: רִגְבֵי
  choice: mabonge ya udongo
  rationale: Neno hili linamaanisha mabonge au vipande vilivyoshikamana vya udongo; kirai hiki kinaweka wazi picha halisi ya maziko.
- source_word: נָחַל
  choice: bondeni
  rationale: Neno linaweza kumaanisha bonde, korongo, au mkondo wa maji wa msimu. 'Bondeni' ni la kawaida na linafaa katika picha ya mahali pa maziko, huku tanbihi ikihifadhi maana nyingine.
- source_word: וְאַחֲרָיו
  choice: humfuata
  rationale: Kirai cha Kiebrania kina maana ya kwenda nyuma au baada yake. Katika Kiswahili, 'humfuata' huwasilisha mwendo huo kwa kawaida.
- source_word: כָּל אָדָם
  choice: wanadamu wote
  rationale: אָדָם limetumiwa kwa maana ya jumla ya jamii yote ya binadamu, si wanaume pekee.
- source_word: יִמְשׁוֹךְ
  choice: humfuata
  rationale: Ingawa mzizi unaweza kumaanisha kuvuta, pamoja na 'baada yake' hapa unaonyesha kufuata au kusonga nyuma yake. Kauli ya mazoea inadumisha maana ya jumla bila kuamua ikiwa ni msafara wa mazishi au safari ya wote kuelekea kifo.
- source_word: וּלְפָנָיו
  choice: waliomtangulia
  rationale: Tafsiri hii inabeba maana ya kuwa mbele yake kwa nafasi au kwa wakati, hasa wale waliokwisha kwenda kabla yake.
- source_word: אֵין מִסְפָּר
  choice: hawana idadi
  rationale: Hii inadumisha nahau ya Kiebrania inayomaanisha kuwa hawawezi kuhesabiwa au ni wengi mno.
theological_decisions:
- issue: Maana ya picha ya maziko na kifo
  choice: 'Maneno yanabaki halisi: udongo ni mtamu kwake, wote humfuata, na waliomtangulia hawana idadi.'
  alternative: Mstari unaweza kueleweka hasa kama msafara wa mazishi, au kwa upana zaidi kama wanadamu wote kufuata njia ya kifo.
  rationale: Kiebrania kinaruhusu maana zote mbili. Tafsiri haibadili picha hiyo kuwa maelezo yanayochagua maana moja tu, bali tanbihi inaonyesha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Sitiari isiyo ya kawaida ya 'matamu' imehifadhiwa kwa sababu ni sehemu muhimu ya picha ya Kiebrania; tanbihi hutoa usemi wa kawaida zaidi bila kuondoa utata wa maandishi.
