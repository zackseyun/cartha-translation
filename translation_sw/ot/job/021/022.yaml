  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: sw
  text: Je, mtu yeyote anaweza kumfundisha Mungu maarifa, naye ndiye anayewahukumu walio juu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioinuliwa”; huenda ikimaanisha “viumbe wa mbinguni.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: Je, mtu yeyote anaweza kumfundisha Mungu
  rationale: Kiambishi cha swali הֲ pamoja na לְאֵל huanzisha swali la balagha. Kiswahili cha kawaida huhitaji mtendaji asiyeainishwa, “mtu yeyote,” na muundo “kumfundisha Mungu.”
- source_word: יְלַמֶּד
  choice: anaweza kumfundisha
  rationale: Piel ya למד humaanisha “fundisha.” Neno “anaweza” huonyesha kwa kawaida nguvu ya swali la balagha katika Kiswahili bila kubadili maana yake.
- source_word: דָּעַת
  choice: maarifa
  rationale: דָּעַת ni nomino dhahania yenye maana ya maarifa au ufahamu; “maarifa” huhifadhi muundo na maana hiyo.
- source_word: וְהוּא
  choice: naye ndiye
  rationale: Muundo huu huhifadhi kiunganishi “na” na wakati huohuo kusisitiza kwamba Mungu ndiye hakimu, bila kulazimisha uhusiano wa kisababu kuliko ulivyo wazi katika Kiebrania.
- source_word: רָמִים
  choice: walio juu
  rationale: Kivumishi hiki cha wingi kilichotumika kama nomino kinaweza kurejelea walioinuliwa duniani au viumbe wa mbinguni. “Walio juu” huhifadhi upana huo.
- source_word: יִשְׁפּוֹט
  choice: anayewahukumu
  rationale: Qal ya שפט ina maana ya “hukumu.” Umbo hili ni la moja kwa moja na la kawaida katika Kiswahili.
theological_decisions:
- issue: Wanaorejelewa na רָמִים
  choice: walio juu, bila kuwabainisha zaidi
  alternative: viumbe wa mbinguni; au watu wenye cheo kikubwa na watawala
  rationale: Kiebrania kinaruhusu marejeo mapana. Tafsiri hii haibani maana kuwa ya viumbe wa mbinguni pekee wala watawala wa duniani pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limetolewa kwa mtiririko wa kawaida, huku utata wa “walio juu” ukihifadhiwa.
