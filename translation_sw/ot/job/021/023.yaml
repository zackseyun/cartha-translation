  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: sw
  text: Mtu mmoja hufa akiwa na nguvu zake kamili,[a] akiwa ametulia kabisa na salama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu huyu hufa katika kilele cha nguvu zake, akiwa ametulia kabisa na bila kusumbuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Mtu mmoja
  rationale: Kiashiria hiki kinatambulisha mfano mmoja katika ulinganisho wa Ayubu. ‘Mtu mmoja’ ni Kiswahili cha kawaida kinachohifadhi maana ya mtu mwakilishi bila kuwa na ugumu wa ‘huyu.’
- source_word: יָמוּת
  choice: hufa
  rationale: Kauli hii inaeleza jambo la kijumla, si hasa utabiri wa wakati ujao; kwa hiyo wakati wa mazoea ‘hufa’ unafaa.
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: akiwa katika ukamilifu wa nguvu zake
  rationale: עֶצֶם inaweza kueleza kiini au nguvu, na תֻּמּוֹ ukamilifu au hali timamu. Pamoja zinaonyesha nguvu zilizo kamili na hali isiyodhoofika, si uadilifu wa kimaadili.
- source_word: כֻּלּוֹ
  choice: kabisa
  rationale: Neno hili linatilia mkazo hali nzima ya mtu na linafanya kazi kielezi katika Kiswahili cha kawaida.
- source_word: שַׁלְאֲנַן
  choice: ametulia
  rationale: Neno linaonyesha hali ya starehe, utulivu, na kutosumbuliwa; ‘ametulia’ haliongezi kwa lazima wazo la utajiri.
- source_word: וְשָׁלֵיו
  choice: na salama
  rationale: Kivumishi hiki kinaimarisha wazo la utulivu kwa kuonyesha hali ya amani na kutokuwa na usumbufu; ‘salama’ kinahifadhi ulinganifu bila marudio yasiyo ya kawaida.
