translation:
  language: sw
  text: Mimi nitakujibu kwa maneno[a], na nitawajibu rafiki zako pamoja nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitakujibu, na nitawajibu rafiki zako pamoja nawe.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoa jibu, na mstari huu unaweza kueleweka kuwa Elihu anamjibu Ayubu pamoja na rafiki zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Mimi
  rationale: Kiwakilishi cha nafsi ya kwanza kimetajwa wazi katika Kiebrania kwa ajili ya msisitizo; “Mimi” kinahifadhi msisitizo huo.
- source_word: אֲשִׁיבְךָ
  choice: nitakujibu
  rationale: Hifili ya שוב hapa ina maana ya kutoa jibu; “nitakujibu” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִלִּין
  choice: kwa maneno
  rationale: Nomino hii ina maana ya “maneno” au “usemi”; “kwa maneno” inahifadhi dhana ya njia au chombo cha kujibu bila kuifasiri kuwa “hoja.”
- source_word: וְאֶת רֵעֶיךָ עִמָּךְ
  choice: wewe pamoja na rafiki zako
  rationale: Kiashiria cha yambwa אֶת kinaunganisha yambwa la pili la kitenzi, huku עִמָּךְ ikionyesha kuwa rafiki zake wanajumuishwa pamoja naye. Mpangilio huu wa Kiswahili unaonyesha kwamba Elihu atamjibu Ayubu na pia rafiki zake.
theological_decisions:
- issue: Walengwa wa jibu la Elihu
  choice: wewe pamoja na rafiki zako
  alternative: na rafiki zako walio pamoja nawe
  rationale: Muundo wa Kiebrania unaweza kueleweka kuwa Elihu anawajibu Ayubu na rafiki zake kwa pamoja. Tafsiri iliyochaguliwa inahifadhi ujumuishaji huo bila kuamua zaidi ikiwa maneno “pamoja nawe” yanaeleza mahali walipo au ushirika wao tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mimi” limetumiwa kwa msisitizo wa kiwakilishi cha Kiebrania; “rafiki zako” ni la kawaida na linafaa kwa wazungumzaji wenzake Ayubu.
