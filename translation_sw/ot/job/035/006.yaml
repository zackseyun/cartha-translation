  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: sw
  text: Ukitenda dhambi, unatenda nini dhidi yake?[a] Na maasi yako yakiwa mengi, unamfanyia nini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unamfanyia nini?” Kitenzi cha Kiebrania kinaweza kumaanisha kwa upana “kufanya” au “kutenda”; “dhidi yake” huonyesha mwelekeo wa swali la balagha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: Ukitenda dhambi
  rationale: Muundo wa masharti unaonyesha hali ya jumla katika hoja ya Elihu; Kiswahili cha sasa hutumia kitenzi cha masharti kwa ufasaha bila kulazimisha tendo lililokamilika zamani.
- source_word: מַה תִּפְעָל בּוֹ
  choice: unamtendea nini?
  rationale: פעל inaweza kumaanisha kufanya au kusababisha, na בּוֹ humwelekeza tendo huyo anayetajwa. Tafsiri hii inahifadhi swali la balagha na ukaribu wa maana ya Kiebrania bila kuongeza wazi neno ‘madhara.’
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: Na makosa yako yakizidi
  rationale: רבו hapa huonyesha kuwa mengi au kuongezeka. Muundo ‘yakizidi’ huendeleza sharti la mstari wa kwanza kwa Kiswahili cha kawaida.
- source_word: פְשָׁעֶיךָ
  choice: makosa yako
  rationale: פשע hubeba maana ya kuvunja mipaka au kuasi. ‘Makosa’ ni neno linaloeleweka kwa urahisi katika muktadha huu, ingawa ni pana kuliko ‘maasi.’
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: unamfanyia nini?
  rationale: עשה pamoja na לּוֹ huuliza jambo analofanyiwa mtu; tafsiri rahisi inadumisha usambamba na nguvu ya swali la balagha.
theological_decisions:
- issue: Ikiwa mstari useme wazi kwamba dhambi humdhuru Mungu au ubaki na swali la Kiebrania.
  choice: 'Kuhifadhi maswali ya balagha: ‘unamtendea nini?’ na ‘unamfanyia nini?’'
  alternative: ‘Unamletea madhara gani?’
  rationale: Muktadha unaashiria kwamba dhambi ya mwanadamu haimpunguzi wala kumdhuru Mungu, lakini Kiebrania hakitumii neno la moja kwa moja la ‘madhara.’ Muundo wa swali huhifadhi hoja hiyo bila kudokeza kwamba dhambi haina umuhimu wa kimaadili mbele za Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usambamba wa kishairi umehifadhiwa kwa vitenzi ‘unamtendea’ na ‘unamfanyia’; hakuna tanbihi inayohitajika kwa rasimu hii.
