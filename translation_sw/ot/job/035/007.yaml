  text: אִם צָ֭דַקְתָּ מַה תִּתֶּן ל֑/וֹ א֥וֹ מַה מִ/יָּדְ/ךָ֥ יִקָּֽח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: sw
  text: Kama wewe ni mwadilifu, unampa nini[a]? Au anachukua[b] nini kutoka mkononi mwako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Mungu. Hoja ya Elihu katika muktadha huu ni kwamba uadilifu wa mwanadamu haumletei Mungu faida.
    reason: cross_reference
  - marker: b
    text: Au, “anapokea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Huanzisha sentensi ya sharti kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: צָדַקְתָּ
  choice: wewe ni mwadilifu
  rationale: Kitenzi צדק hapa kinaeleza hali ya kuwa mwadilifu au kuwa upande wa haki; usemi huu unafaa muktadha wa kimaadili na swali la jumla.
- source_word: מַה תִּתֶּן לּוֹ
  choice: unampa nini
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi swali la balagha pamoja na yule anayelengwa na kiwakilishi cha nafsi ya tatu bila kumtaja wazi katika matini.
- source_word: מִיָּדְךָ
  choice: kutoka mkononi mwako
  rationale: Unahifadhi taswira halisi ya Kiebrania kuhusu kitu kinachotolewa kutoka katika uwezo au milki ya mtu, huku ukiendelea kueleweka kwa msomaji wa Kiswahili.
- source_word: יִקָּח
  choice: anachukua
  rationale: לקח kimsingi humaanisha kuchukua, na pia inaweza kuwa na maana ya kupokea. 'Anachukua' ni tafsiri ya moja kwa moja; maana mbadala imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Yule anayerejelewa na לוֹ na kiima cha יִקָּח
  choice: Matini imetumia viwakilishi vilivyodokezwa katika vitenzi, huku tanbihi ikieleza kwamba vinamrejelea Mungu.
  alternative: Kumtaja Mungu moja kwa moja katika matini kuu.
  rationale: Muktadha wa hoja ya Elihu katika mistari 6–8 unaonyesha kuwa anayerejelewa ni Mungu, lakini Kiebrania chenyewe kinatumia kiwakilishi badala ya jina. Tafsiri inalinda tofauti hiyo na kuepuka kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Maswali mafupi ya balagha na taswira ya “mkono” vimehifadhiwa.
