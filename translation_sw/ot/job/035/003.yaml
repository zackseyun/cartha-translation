  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: sw
  text: Kwa maana unasema[a], “Hilo lina faida gani kwako? Ninapata faida gani kutokana na dhambi yangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Una faida gani? Ninapata faida gani zaidi ya ile ninayopata kwa kutenda dhambi?” Kiebrania ni kifupi na huenda kinadokeza ulinganisho kati ya kuwa mwadilifu na kutenda dhambi.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza hoja ya Elihu kwa kutoa sababu na kutambulisha dai analomnasibishia Ayubu.
- source_word: תֹאמַר
  choice: unasema
  rationale: Ni Qal imperfect nafsi ya pili umoja wa kiume; wakati wa sasa unasikika kwa kawaida katika muktadha huu.
- source_word: מַה יִּסְכָּן לָךְ
  choice: Hilo lina faida gani kwako?
  rationale: סכן hapa huhusu kuwa na manufaa au faida. Kiwakilishi “hilo” kinaacha rejeleo lake likiwa wazi, kama ilivyo katika Kiebrania kifupi.
- source_word: מָה אֹעִיל
  choice: Ninapata faida gani
  rationale: Hiphil ya יעל humaanisha kupata faida au kunufaika; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: מֵחַטָּאתִי
  choice: kutokana na dhambi yangu
  rationale: מן inaweza kuonyesha chanzo au ulinganisho. Tafsiri kuu inahifadhi maana ya chanzo bila kuingiza wazi neno la ulinganisho lisiloandikwa.
theological_decisions:
- issue: Nguvu ya kauli ya Elihu na rejeleo la kiwakilishi
  choice: Kauli inauliza faida inayopatikana, huku “kwako” na “hilo” zikiachwa bila rejeleo lililofafanuliwa zaidi.
  alternative: “Una faida gani? Ninapata faida gani zaidi ya ile ninayopata kwa kutenda dhambi?”
  rationale: Kiebrania ni kifupi na kinaweza kudokeza ulinganisho kati ya kuwa mwadilifu na kutenda dhambi. Tafsiri haipaswi kuamua kimya-kimya kama anayelengwa na faida ni Ayubu, haki yake, au jambo linalodokezwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Faida” hudumisha ulinganifu wa vishazi bila kufanya sentensi kuwa nzito; tanbihi huhifadhi uwezekano wa maana ya ulinganisho.
