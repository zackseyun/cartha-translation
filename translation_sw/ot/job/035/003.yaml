  source_fidelity: Tafsiri inawakilisha kwa uaminifu maswali mawili ya Kiebrania. “Hilo” huhifadhi kwa usahihi rejeleo la kike lisilotajwa wazi katika יִסְכָּן לָךְ, bila kulazimisha kama linamhusu Ayubu, haki yake, au jambo la muktadha. “Kutokana na dhambi yangu” huhifadhi maana ya msingi ya מֵחַטָּאתִי, huku tanbihi ikitoa kwa wazi uwezekano wa ulinganisho.
