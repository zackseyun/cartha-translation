  text: Hakika, Mungu hasikii jambo lisilo na maana[a], wala Mwenyezi halizingatii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ubatili,” “jambo la bure,” “lisilo na thamani,” au “la udanganyifu.” Neno la Kiebrania linaweza kueleza jambo lililo tupu, bure, lisilo na thamani, au la udanganyifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Hutoa mkazo wa kauli ya Elihu bila kuifanya kuwa na maana finyu ya ‘tu’.
- source_word: שָׁוְא
  choice: hali ya ubatili
  rationale: Neno hili la Kiebrania linaweza kumaanisha hali iliyo tupu, bure, isiyo na thamani, au ya udanganyifu. ‘Hali ya ubatili’ huhifadhi uasili wake kama dhana bila kuifasiri moja kwa moja kuwa kilio au ombi.
- source_word: יִשְׁמַע
  choice: haisikii
  rationale: Kauli ya sasa huwasilisha ukweli wa jumla katika muktadha; ‘kusikia’ hudumisha maana ya msingi ya kitenzi cha Kiebrania.
- source_word: אֵל
  choice: Mungu
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya jina hili la Mungu katika Kiswahili.
- source_word: וְשַׁדַּי
  choice: na Mwenyezi
  rationale: ‘Mwenyezi’ ni jina la heshima la Kiswahili linalowasilisha cheo cha Mungu Shaddai kwa lugha ya kawaida na yenye hadhi.
- source_word: יְשׁוּרֶנָּה
  choice: haiangalii
  rationale: Kitenzi שׁור humaanisha kutazama au kuangalia; hapa kinaashiria pia kuelekeza uangalifu, sambamba na ‘haisikii’. Kiambishi chake kinarejelea dhana iliyotajwa kabla.
theological_decisions:
- issue: Kirejelewa cha שָׁוְא katika kauli ya Elihu
  choice: Dhana ya hali iliyo tupu, bure, isiyo na thamani, au ya udanganyifu ndiyo ambayo Mungu haisikii wala kuiangalia.
  alternative: Kuitafsiri wazi kuwa ‘kilio cha bure’ au ‘ombi lisilo la kweli’.
  rationale: Tafsiri hii huhifadhi upana na mvutano wa neno la Kiebrania, na haigeuzi kauli hiyo kuwa madai kuhusu kutokuwa na uwezo wa Mungu kujua au kusikia mambo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Ulinganifu wa ‘haisikii’ na ‘haiangalii’ umehifadhiwa, pamoja na dhana dhahania ya שָׁוְא.
