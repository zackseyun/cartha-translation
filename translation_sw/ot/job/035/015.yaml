lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na mpito wa wakati unaoonyeshwa na עַתָּה bila kulazimisha uhusiano wa hoja.
- source_word: כִּי אַיִן פָּקַד אַפּוֹ
  choice: kwa sababu hajaadhibu kwa hasira yake
  rationale: כִּי inaeleweka kwa maana ya sababu; אַיִן inakanusha tendo; na פקד katika muktadha huu inaelekea kumaanisha kuja kuadhibu au kuchukua hatua ya adhabu. Kiswahili hiki ni cha kawaida huku tanbihi ikihifadhi upana wa kitenzi.
- source_word: וְלֹא יָדַע
  choice: wala hauzingatii
  rationale: ידע hapa yaelekea kumaanisha kutambua au kutilia maanani, si kukosa maarifa tu. ‘Hauzingatii’ hutoa maana hiyo bila kudai kwamba Mungu hajui.
- source_word: בַּפַּשׁ
  choice: uasi
  rationale: Neno hili adimu na lenye utata huenda linamaanisha uasi, ukaidi, au kosa kubwa. ‘Uasi’ linafaa muktadha wa hukumu, na utata wake umeonyeshwa katika tanbihi.
- source_word: מְאֹד
  choice: sana
  rationale: Ni kielezi cha kiwango kinachosisitiza tendo la kuzingatia.
theological_decisions:
- issue: Maana ya kishazi kigumu kuhusu hasira na tendo la Mungu
  choice: Mstari unasema kwamba Mungu hajaadhibu kwa hasira yake na hauzingatii sana uasi.
  alternative: Hasira yake haijaja kuadhibu, naye hajautambua kikamilifu ukaidi mkubwa.
  rationale: Uandishi wa Kiebrania ni mgumu, hasa katika nusu ya pili. Tafsiri hii inafaa karipio la Elihu katika muktadha, lakini haibadili kauli kuwa fundisho kwamba Mungu hana maarifa au hajali kabisa.
