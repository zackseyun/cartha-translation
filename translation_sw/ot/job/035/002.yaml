  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: sw
  text: Je, unafikiri hili ni haki, unaposema[a], “Haki yangu ni kubwa kuliko haki ya Mungu”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nina haki mbele ya Mungu,” au, “Haki yangu hutoka kwa Mungu.” Kiebrania ni kifupi, na uhusiano kati ya “haki yangu” na “Mungu” unajadiliwa.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: Je, unaona hili
  rationale: Kiulizi הֲ pamoja na זֹאת na kitenzi חשב huunda swali la balagha. ‘Je, unaona hili’ ni Kiswahili cha kawaida kinachobeba maana ya kufikiri au kuhesabu jambo kuwa fulani.
- source_word: לְמִשְׁפָּט
  choice: kuwa ni haki
  rationale: מִשְׁפָּט hapa ina maana ya haki au jambo lililo sawa; muundo huu unaonyesha tathmini anayopinga Elihu.
- source_word: אָמַרְתָּ
  choice: unaposema
  rationale: Ingawa kitenzi ni timilifu kwa umbo, kinarejelea dai la Ayubu lenye umuhimu katika hoja ya sasa. ‘Unaposema’ huunganisha dai hilo kwa kawaida na swali kuu.
- source_word: צִדְקִי
  choice: Haki yangu
  rationale: צֶדֶק inaweza kumaanisha uadilifu, kuwa na haki, au msimamo wa haki. ‘Haki yangu’ huhifadhi upeo wa kimaadili na kimahakama bila kuwa mzito isivyo lazima.
- source_word: מֵאֵל
  choice: ni kubwa kuliko ya Mungu
  rationale: מִן inaweza kutumiwa kwa ulinganisho. ‘Kuliko ya Mungu’ hufanya ulinganisho uliobanwa katika Kiebrania ueleweke, huku ‘ya’ ikirejelea haki ya Mungu.
theological_decisions:
- issue: Maana ya dai la Ayubu katika mashtaka ya Elihu
  choice: 'Ulinganisho: ‘Haki yangu ni kubwa kuliko ya Mungu’'
  alternative: ‘Nina haki mbele za Mungu’ au ‘Haki yangu hutoka kwa Mungu’
  rationale: Kishazi צִדְקִי מֵאֵל kimebanwa na kinaweza kufasiriwa kwa njia tofauti. Muktadha wa lawama ya Elihu unaunga mkono ulinganisho, lakini tafsiri nyingine za uhusiano wa מִן na אֵל ni halisi na zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limewekwa wazi, na utata halisi wa kishazi cha mwisho umehifadhiwa kwa tanbihi.
