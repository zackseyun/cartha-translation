  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: sw
  text: Kwa sababu ya wingi wa dhuluma, watu hulia kwa sauti; huomba msaada kwa sababu ya mkono[a] wa wenye nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huomba msaada kutokana na mkono wa wenye nguvu.” Kihusishi cha Kiebrania kinaweza kutafsiriwa kwa maana ya “kutokana na,” ingawa hapa huenda kinaonyesha sababu ya kilio chao. “Mkono” ni taswira ya Kiebrania inayomaanisha nguvu au uwezo.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מֵרֹב
  choice: Kwa sababu ya wingi wa
  rationale: Muundo wa מִן pamoja na רֹב unaonyesha sababu au chanzo cha kilio; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana hiyo.
- source_word: עֲשׁוּקִים
  choice: dhuluma
  rationale: Katika muktadha huu umbo hili la wingi linarejelea matendo au visa vya kuonea, si hasa watu wanaoonewa.
- source_word: יַזְעִיקוּ
  choice: watu hulia kwa sauti
  rationale: Kitenzi hiki kinaonyesha kutoa kilio cha dhiki. Neno 'watu' linaweka wazi kiima kisichotajwa bila kuwatambulisha zaidi.
- source_word: יְשַׁוְּעוּ
  choice: huomba msaada
  rationale: Kitenzi שוע katika umbo hili huonyesha kilio au ombi la kutaka msaada; uchaguzi huu pia unatofautisha kwa kiasi na kitenzi kilichotangulia.
- source_word: מִזְּרֹעַ
  choice: kwa sababu ya mkono wa
  rationale: Kirai kinatunza taswira halisi ya Kiebrania ya 'mkono' kama nguvu au uwezo, huku מִן ikieleweka kwa uwezekano mkubwa kuwa ya kisababishi hapa.
- source_word: רַבִּים
  choice: wenye nguvu
  rationale: Katika muktadha wa dhuluma, neno hili linaelekea kurejelea watu wenye uwezo au mamlaka, badala ya idadi kubwa tu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. 'Dhuluma' ni neno linaloeleweka kwa upana; 'mkono' umehifadhiwa ili kutunza taswira ya Kiebrania. Kiima kisichodhihirishwa katika Kiebrania kimetolewa kama 'watu' kwa ufasaha wa Kiswahili.
