  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: sw
  text: ambaye hutufundisha kuliko wanyama wa nchi, na kutufanya wenye hekima kuliko ndege wa angani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye hutufundisha kutoka kwa wanyama wa nchi, na kutupa hekima kutoka kwa ndege wa angani.” Kihusishi cha Kiebrania kinaweza kuonyesha chanzo badala ya ulinganisho.
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: hutufundisha
  rationale: Kitenzi cha Kiebrania ni umbo la Piel lenye kiambishi cha nafsi ya kwanza wingi, likimaanisha kutoa mafundisho kwa bidii. “Hutufundisha” ni Kiswahili cha kawaida, cha sasa, na kinaendana na kishazi sambamba.
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: kuliko wanyama wa nchi
  rationale: 'Kiambishi מִ־ kinaeleweka hapa kwa maana ya ulinganisho katika ushairi: Mungu huwafundisha wanadamu kwa kiwango kinachozidi kile cha wanyama. “Wanyama wa nchi” huhifadhi taswira halisi ya Kiebrania bila kutumia neno la kizamani.'
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: kuliko ndege wa angani
  rationale: מֵ־ limetafsiriwa kwa maana sambamba ya ulinganisho. “Ndege wa angani” ni usemi wa asili katika Kiswahili na huwakilisha עוֹף הַשָּׁמַיִם kwa uwazi.
- source_word: יְחַכְּמֵנוּ
  choice: kutufanya wenye hekima
  rationale: Piel ya חכם hapa ina maana ya kusababisha kuwa na hekima. Muundo huu wa Kiswahili unaeleweka vizuri, huku ulinganisho ukionyeshwa na “kuliko” katika kirai kinachofuata.
theological_decisions:
- issue: Maana ya kihusishi מ katika vishazi vyote viwili
  choice: 'Ulinganisho: Mungu hutufundisha kuliko wanyama na kutufanya wenye hekima kuliko ndege'
  alternative: 'Chanzo cha mafundisho: Mungu hutufundisha kutoka kwa wanyama wa nchi na kutupa hekima kutoka kwa ndege wa angani'
  rationale: Usambamba wa kishairi na muktadha unaunga mkono zaidi tofauti kati ya kipawa cha wanadamu na viumbe wengine. Hata hivyo, Kiebrania kinaweza pia kueleweka kuwa wanyama na ndege ndio chanzo cha mafundisho, hivyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Ndege wa angani” limetumiwa badala ya tafsiri ngumu zaidi ya neno kwa neno, na utata halisi wa kihusishi cha Kiebrania umehifadhiwa katika tanbihi.
