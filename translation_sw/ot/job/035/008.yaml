  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: sw
  text: Uovu wako unamwathiri mtu kama wewe, na uadilifu wako unamwathiri mwanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana halisi: “mwana wa binadamu.” Huu ni usemi wa kawaida wa Kiebrania unaomaanisha binadamu wa kufa, wala si cheo cha Kimasihi hapa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: unamwathiri mtu
  rationale: Kihusishi לְ katika kishazi hiki cha kishairi kinaonyesha mtu ambaye matokeo ya mwenendo yanamfikia. Kitenzi “unamwathiri” kinaweka wazi maana inayodokezwa na muktadha wa mistari 6–7 bila kuamua kwamba athari hiyo daima ni madhara.
- source_word: כָּמוֹךָ
  choice: kama wewe
  rationale: 'Huhifadhi ulinganisho wa wazi na wa kawaida katika Kiswahili: anayefikiwa ni mtu mwingine aliye binadamu kama Ayubu.'
- source_word: רִשְׁעֶךָ
  choice: uovu wako
  rationale: “Uovu” ni neno la kawaida na lenye uzito wa kimaadili unaofaa kwa רֶשַׁע katika muktadha huu.
- source_word: וּלְבֶן אָדָם
  choice: na ... mwanadamu
  rationale: בֶּן אָדָם ni usemi wa kawaida wa kishairi unaomaanisha binadamu anayekufa. “Mwanadamu” ni tafsiri ya asili na wazi katika Kiswahili na huepuka kuufanya usemi huu usikike kama cheo cha Kimasihi.
- source_word: צִדְקָתֶךָ
  choice: haki yako
  rationale: “Haki” huwasilisha moja kwa moja wazo la uadilifu au mwenendo ulio sawa, sambamba na “uovu wako.”
theological_decisions:
- issue: Maana ya בֶּן אָדָם katika muktadha
  choice: binadamu wa kawaida, iliyotafsiriwa “mwanadamu”
  alternative: “mwana wa binadamu” au cheo “Mwana wa Adamu”
  rationale: Katika Ayubu usemi huu ni sambamba na “mtu kama wewe” na humaanisha mwanadamu anayekufa; si cheo cha Kimasihi hapa. Tafsiri ya kawaida ya Kiswahili inalinda maana hiyo, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
- issue: Kitenzi kinachodokezwa katika kishazi cha kishairi
  choice: kurudia “unamwathiri” katika sehemu zote mbili
  alternative: “ni kwa ajili ya mtu” au kuacha kishazi bila kitenzi
  rationale: Kiebrania kina vishazi vifupi visivyo na kitenzi, vikitegemea muktadha wa mistari iliyotangulia. Kiswahili cha kawaida huhitaji kitenzi; “unamwathiri” huhifadhi hoja kwamba matendo ya binadamu yanawafikia binadamu wengine bila kueleza zaidi aina ya athari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Usambamba wa kishairi umehifadhiwa kwa kurudia muundo “... wako unamwathiri ...,” na “mwanadamu” limetumiwa badala ya tafsiri halisi yenye uwezekano wa kupotosha.
