  text: Look at the heavens and see; gaze at the clouds—they are higher than you.
translation:
  language: sw
  text: Tazama mbingu na uone; tazama kwa makini mawingu—yako juu kuliko wewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֵּט
  choice: Tazama
  rationale: Amri hii inamwelekeza msikilizaji aangalie mbingu kwa makusudi; “tazama” ni ya kawaida, yenye hadhi, na inafaa katika muktadha huu.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa anga au mbingu zinazoonekana juu.
- source_word: וּרְאֵה
  choice: uone
  rationale: Huhifadhi amri ya pili ya kuona na mtiririko wa kauli “Tazama ... uone.”
- source_word: וְשׁוּר
  choice: yakazie macho
  rationale: Kitenzi hiki adimu kina maana ya kutazama kwa makini; “yakazie macho” hutofautisha tendo hili na “tazama” la mwanzo.
- source_word: שְׁחָקִים
  choice: mawingu
  rationale: Katika usambamba na “mbingu,” neno hili linaweza kumaanisha mawingu au anga za juu; “mawingu” linafuata maana inayofaa hapa bila kurudia “mbingu.”
- source_word: גָּבְהוּ מִמֶּךָּ
  choice: yaliyo juu kuliko wewe
  rationale: Huwasilisha kwa Kiswahili cha asili wazo la kwamba mawingu yako juu zaidi ya mwanadamu anayehutubiwa.
theological_decisions:
- issue: Ulinganisho wa urefu wa mbingu na mwanadamu
  choice: yaliyo juu kuliko wewe
  alternative: yameinuka juu kuliko wewe
  rationale: Tafsiri haiongezi hitimisho la kitheolojia lisilotajwa; inadumisha hoja ya Elihu kupitia urefu wa anga unaozidi wa mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa kishairi umehifadhiwa kwa “Tazama ... uone” na “yakazie macho.”
