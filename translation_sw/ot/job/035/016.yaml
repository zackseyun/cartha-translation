lexical_decisions:
- source_word: וְאִיּוֹב
  choice: Kwa hiyo Ayubu
  rationale: Kiunganishi וְ kinaunganisha mstari huu na hitimisho la Elihu lililotangulia; “kwa hiyo” linaonyesha uhusiano wa kimantiki kwa Kiswahili cha kawaida.
- source_word: הֶבֶל
  choice: kwa maneno matupu
  rationale: הֶבֶל huweza kumaanisha pumzi, ubatili, utupu, au jambo lisilo na maana. Katika muktadha wa kusema, “kwa maneno matupu” huwasilisha kwamba usemi wa Ayubu unaonekana kuwa usio na maana au faida, bila kuufanya msemo kuwa mgumu kwa Kiswahili.
- source_word: יִפְצֶה פִּיהוּ
  choice: hufungua kinywa chake
  rationale: Msemo פצה פה humaanisha kufungua kinywa, mara nyingi kwa maana ya kuanza kusema. Tafsiri ya moja kwa moja pia ni msemo unaoeleweka kwa Kiswahili.
- source_word: בִּבְלִי דַעַת
  choice: bila maarifa
  rationale: בִּבְלִי huonyesha kutokuwapo kwa kitu, na דַעַת ni maarifa au ujuzi. “Bila maarifa” ni tafsiri ya moja kwa moja inayohifadhi shtaka la Elihu.
- source_word: מִלִּין
  choice: maneno
  rationale: Umbo hili la wingi lenye athari ya Kiaramu linamaanisha maneno au matamko; “maneno” ni la kawaida na sahihi.
- source_word: יַכְבִּר
  choice: huzidisha
  rationale: Hifili ya כָּבַר hapa ina maana ya kufanya yawe mengi. “Huzidisha” huhifadhi maana hiyo na kuambatana kwa kawaida na “maneno.”
