  text: וְֽ/לֹא אָמַ֗ר אַ֭יֵּה אֱל֣וֹהַּ עֹשָׂ֑/י נֹתֵ֖ן זְמִר֣וֹת בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/010.yaml
  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: sw
  text: Lakini hakuna anayesema, “Yuko wapi Mungu, Muumba wangu,[a] anayetoa nyimbo usiku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi “waumbaji wangu”; hapa umbo la wingi linamrejelea Mungu mmoja, hivyo limetafsiriwa “Muumba wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Lakini hakuna
  rationale: Kiunganishi pamoja na ukanushaji kinaonyesha utofauti na muktadha uliotangulia. Kwa Kiswahili, kuongeza kiima kisichotajwa wazi, ‘hakuna,’ kunawasilisha kwa kawaida maana ya kwamba hakuna mtu anayesema hivyo.
- source_word: אָמַר
  choice: anayesema
  rationale: Ingawa kitenzi cha Kiebrania kina umbo la wakati timilifu, hapa kinaeleza jambo la kawaida au la jumla; wakati wa sasa unafaa zaidi katika Kiswahili.
- source_word: אַיֵּה
  choice: Yuko wapi
  rationale: Ni kiulizi cha mahali au kuwapo. ‘Yuko wapi’ ni usemi wa kawaida wa Kiswahili kwa kumwulizia Mungu.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Ni jina la kawaida la Mungu katika kitabu cha Ayubu; ‘Mungu’ ni tafsiri iliyo wazi na ya kawaida.
- source_word: עֹשָׂי
  choice: Muumba wangu
  rationale: Umbo la Kiebrania ni la wingi na lina kiambishi cha nafsi ya kwanza umoja, lakini linamrejelea Mungu mmoja. ‘Muumba wangu’ huwasilisha maana bila kudokeza miungu mingi; umbo rasmi la wingi limehifadhiwa katika tanbihi.
- source_word: נֹתֵן
  choice: anayetoa
  rationale: Kivumishi-tendo hiki kinaeleza jambo ambalo Mungu hufanya kwa tabia. Kishazi ‘anayetoa’ ni cha kawaida na wazi katika Kiswahili cha sasa.
- source_word: זְמִרוֹת
  choice: nyimbo
  rationale: Neno hili humaanisha nyimbo na wakati mwingine linaweza kudokeza sifa, lakini ‘nyimbo’ huhifadhi upana wake bila kuongeza maana ya ibada ambayo haijaelezwa wazi.
- source_word: בַּלָּיְלָה
  choice: usiku
  rationale: ‘Usiku’ ni tafsiri ya kawaida na yenye uzito wa kishairi unaofaa katika muktadha huu.
theological_decisions:
- issue: Idadi ya עֹשָׂי inapomrejelea Mungu
  choice: 'Maana ya umoja: ‘Muumba wangu’'
  alternative: 'Umbo rasmi la wingi: ‘waumbaji wangu’'
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, linamrejelea Mungu mmoja. Umoja katika maandishi makuu huepuka kudokeza miungu mingi, huku tanbihi ikihifadhi umbo la chanzo kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa swali la moja kwa moja na picha ya kishairi ya nyimbo za usiku zimehifadhiwa.
