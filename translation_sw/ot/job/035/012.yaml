  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: sw
  text: Huko wanalia kwa sauti, lakini hajibu[a], kwa sababu ya kiburi[b] cha watu waovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakimtaji wazi mtendaji wa “hajibu”; muktadha unaonyesha kwamba ni Mungu.
    reason: alternative_reading
  - marker: b
    text: Au, “majivuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Huko
  rationale: Kielezi hiki kimsingi huonyesha mahali. “Huko” kinaelekeza kwenye hali iliyotajwa katika muktadha bila kukibadili kuwa kiashiria cha wakati.
- source_word: יִצְעֲקוּ
  choice: wanalia kwa sauti
  rationale: Kitenzi צעק huonyesha kilio cha dhiki au mwito wa haraka. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha uzito wa kilio hicho.
- source_word: וְלֹא
  choice: lakini ... haji-
  rationale: Ingawa ו inaweza kumaanisha “na,” hapa “lakini” linaonyesha kwa kawaida zaidi tofauti kati ya kulia kwao na kutopata jibu.
- source_word: יַעֲנֶה
  choice: yeye hajibu
  rationale: Kitenzi ni cha nafsi ya tatu umoja bila mtendaji kutajwa wazi. “Yeye hajibu” kinadumisha hali hiyo huku wakati wa sasa ukifaa kwa kauli hii ya jumla.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Katika muktadha huu kirai kinaonyesha sababu; tafsiri hii ni wazi na ya kawaida.
- source_word: גְּאוֹן
  choice: kiburi
  rationale: Neno linaweza kumaanisha ukuu, majivuno, au kiburi. Linapohusishwa na watu waovu, maana hasi ya “kiburi” inafaa; “majivuno” ni uwezekano mwingine.
- source_word: רָעִים
  choice: watu waovu
  rationale: Kivumishi cha wingi kinatumika kama nomino kwa wanadamu waovu. Kiswahili huhitaji kirai cha kawaida kama “watu waovu”; jinsia ya kisarufi ya Kiebrania haiwezi kuonyeshwa hapa kwa njia ya kawaida bila kuongeza maana isiyoelezwa.
theological_decisions:
- issue: Mtendaji asiyetajwa wa יַעֲנֶה, “hajibu”
  choice: yeye hajibu
  alternative: Mungu hajibu
  rationale: Muktadha unaonyesha kwamba Mungu ndiye anayetarajiwa kujibu, lakini kifungu cha Kiebrania hakimtaji kwa jina. Kiwakilishi kinahifadhi kiasi cha kutotaja kilichopo katika chanzo.
- issue: Maana ya גְּאוֹן katika uhusiano na רָעִים
  choice: kiburi cha watu waovu
  alternative: majivuno ya watu waovu
  rationale: Muktadha unahitaji maana hasi, lakini haupaswi kufinywa zaidi ya “kiburi” au “majivuno.” Tafsiri haiongezi maelezo kuhusu jinsi kiburi hicho kinavyosababisha kutopata jibu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Wanalia kwa sauti” linaonyesha kilio cha dhiki bila kutumia tamathali nzito; “yeye hajibu” linahifadhi mtendaji asiyetajwa katika Kiebrania.
