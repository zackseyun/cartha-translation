  text: אַ֣ף כִּֽי תֹ֭אמַר לֹ֣א תְשׁוּרֶ֑/נּוּ דִּ֥ין לְ֝/פָנָ֗י/ו וּ/תְח֥וֹלֵֽל לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: sw
  text: Sembuse unaposema, “Humwoni”; kesi iko mbele zake, nawe umngojee.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na maneno ya Kiebrania, “na ujipinde-pinde mbele zake.” Kitenzi cha Kiebrania ni kigumu; wengi hukielewa hapa kuwa “umngojee kwa matarajio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Si zaidi sana unaposema
  rationale: Kirai hiki kinaendeleza hoja ya Elihu kutoka mstari uliotangulia kwa nguvu ya kulinganisha. Muundo huu unahifadhi maana ya ‘how much less when,’ ingawa Kiswahili chake ni cha mtindo wa kishairi.
- source_word: תֹאמַר
  choice: unaposema
  rationale: Ni kitenzi rahisi cha nafsi ya pili umoja kinachomlenga Ayubu moja kwa moja.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: Humwoni
  rationale: Kitenzi שׁור hapa kinaeleweka kuwa kuona au kumtambua. Muktadha unaonyesha kuwa Ayubu ndiye asiyemwona Mungu, si kwamba Mungu haioni kesi.
- source_word: דִּין
  choice: kesi yako
  rationale: דִּין hapa ni shauri la kuamuliwa, si dhana ya jumla ya haki. Kiwakilishi ‘yako’ kinafafanua kwa Kiswahili cha kawaida kesi inayozungumziwa bila kubadili mhusika wa hoja.
- source_word: לְפָנָיו
  choice: iko mbele zake
  rationale: Huhifadhi taswira ya kisheria ya shauri lililo mbele za Mungu ili lihukumiwe.
- source_word: וּתְחוֹלֵל לוֹ
  choice: nawe unapaswa kumngojea
  rationale: Kitenzi hiki ni kigumu na kinaweza kuhusishwa na kujinyonganyonga au kujigeuza, lakini katika muktadha huu wengi hukielewa kuwa kungojea kwa matarajio. ‘Unapaswa’ huonyesha nguvu ya himizo la Elihu.
theological_decisions:
- issue: Kutoonekana kwa Mungu na haki yake
  choice: Ayubu anasema kwamba hamwoni Mungu, lakini kesi yake iko mbele za Mungu, naye anapaswa kumngojea.
  alternative: Mungu haioni kesi; au Ayubu anapaswa kujinyonganyonga mbele zake.
  rationale: Muktadha mpana unadhania ufahamu na haki ya Mungu. Hata hivyo, utata halisi wa kitenzi cha mwisho umehifadhiwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya kisheria ya ‘kesi yako iko mbele zake’ imehifadhiwa, huku tanbihi ikionyesha utata wa kitenzi cha mwisho.
