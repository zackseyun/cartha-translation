  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: sw
  text: Utamwomba, naye atakusikia; nawe utatimiza nadhiri zako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “utalipa nadhiri zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: Utamwomba
  rationale: Hifili ya עתר humaanisha kusihi au kuomba kwa bidii. Katika muktadha huu wa kumwelekea Mungu na yeye kusikia, “utamwomba” ni Kiswahili cha kawaida na chenye maana ya sala.
- source_word: אֵלָיו
  choice: -mw- (katika “Utamwomba”)
  rationale: Kiambishi cha nafsi ya tatu umoja kinawakilisha “kwake/yeye.” Kukijumuisha ndani ya kitenzi ni muundo wa asili wa Kiswahili, huku rejeleo lake kwa Mungu likibaki wazi kutokana na muktadha.
- source_word: וְיִשְׁמָעֶךָּ
  choice: naye atakusikia
  rationale: שׁמע humaanisha kusikia au kusikiliza. “Atakusikia” ni tafsiri ya moja kwa moja ambayo haiongezi wazo la “kujibu,” ingawa katika muktadha wa sala inaweza kudokeza kusikilizwa kwa kibali.
- source_word: וּנְדָרֶיךָ
  choice: nawe ... nadhiri zako
  rationale: נֶדֶר ni nadhiri iliyowekwa, hasa mbele za Mungu. “Nadhiri zako” huhifadhi wingi na maana ya kidini bila kuongeza dhana mahsusi ya sadaka.
- source_word: תְשַׁלֵּם
  choice: utatimiza
  rationale: Pieli ya שלם pamoja na nadhiri ni nahau yenye maana ya kulipa au kutekeleza nadhiri. “Utatimiza” huwasilisha maana hiyo kwa Kiswahili cha sasa bila kuifanya ionekane kuwa malipo ya fedha.
theological_decisions:
- issue: Iwapo kishazi cha mwisho kitafsiriwe kwa umbo la karibu zaidi na nahau ya Kiebrania (“utalipa nadhiri zako”) au kwa maana yake ya kawaida (“utatimiza nadhiri zako”).
  choice: utatimiza nadhiri zako
  alternative: utalipa nadhiri zako
  rationale: Nahau ya Kiebrania inahusu kutekeleza yale yaliyoahidiwa kwa Mungu. “Kutimiza” huonyesha wajibu huo kwa uwazi katika Kiswahili cha sasa, huku tanbihi ikihifadhi umbo la karibu zaidi na Kiebrania.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni mfupi na wa asili; nusu-koloni linaonyesha hatua mbili zinazohusiana: sala kusikiwa na nadhiri kutimizwa.'
