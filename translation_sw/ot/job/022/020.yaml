  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: sw
  text: Hakika, wale waliotuinukia[a] wameangamizwa, na moto umeteketeza mabaki yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania קִימָנוּ ni neno gumu. Kinaweza kueleweka kuwa “wale waliotuinukia” au “wapinzani wetu,” kama katika matini, au labda “mali yetu” katika baadhi ya tafsiri.
    reason: alternative_reading
