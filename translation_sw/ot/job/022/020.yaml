    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Hakika
  rationale: Hapa msemo huu unatumika kusisitiza dai, si kuanzisha sharti halisi; “Hakika” ni ya asili na yenye nguvu katika Kiswahili.
- source_word: נִכְחַד
  choice: wameangamizwa
  rationale: Niphal ya כחד ina maana ya kuondolewa au kuharibiwa kabisa. “Wameangamizwa” inadumisha hali ya kutendwa na matokeo ya uharibifu.
- source_word: קִימָנוּ
  choice: wale waliotuinukia
  rationale: Neno hili la Kiebrania ni gumu. Tafsiri hii inadumisha kwa kiasi picha ya watu walioinuka dhidi yetu na, katika muktadha, inaeleweka kuwa wapinzani bila kulifanya neno kuwa mahsusi kuliko ushahidi unavyoruhusu.
- source_word: וְיִתְרָם
  choice: mabaki yao
  rationale: יתר humaanisha kilichobaki; “mabaki yao” ni fupi, ya kawaida, na inadumisha kiambishi kinachowarejelea watu waliotangulia.
- source_word: אָכְלָה אֵשׁ
  choice: moto umeteketeza
  rationale: Hii ni taswira ya kawaida ya moto unaokula au kuharibu kabisa. “Umeteketeza” ni Kiswahili cha asili na chenye uzito unaofaa.
