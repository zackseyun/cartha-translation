  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: Tuache!
  rationale: Kauli ya moja kwa moja yenye maana ya kumtaka Mungu aondoke na kuwaacha; ni ya asili katika Kiswahili huku ikihifadhi wingi wa kiwakilishi.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Jina la kimungu Shaddai limetafsiriwa kwa jina la heshima linaloeleweka kwa wasomaji wa Kiswahili na linalolingana na maana ya ‘Mwenyezi.’
- source_word: לָמוֹ
  choice: kuwafanyia
  rationale: Umbo hili linaelekea kuwa nafsi ya tatu wingi, ‘kwao/kuwafanyia,’ na hivyo linahifadhi tofauti iliyopo kati ya ‘tuache’ na ‘kuwafanyia nini.’
- source_word: מַה יִּפְעַל
  choice: anaweza kuwafanyia nini?
  rationale: Swali la dharau limetolewa kwa Kiswahili cha kawaida; ‘anaweza’ huwasilisha nguvu ya kimuktadha ya kuuliza kile ambacho Mwenyezi angeweza kutenda.
theological_decisions:
- issue: Kiwakilishi katika לָמוֹ
  choice: 'wao: “kuwafanyia nini?”'
  alternative: 'sisi: “kutufanyia nini?”'
  rationale: Maandishi ya Kiebrania ya WLC yana לָמוֹ, kwa kawaida ‘kwao,’ ingawa mabadiliko kutoka nafsi ya kwanza katika מִמֶּנּוּ yanaweza kuonekana magumu. Tafsiri inahifadhi maandishi yaliyopokelewa na mvutano wake badala ya kuyasawazisha.
- issue: Nguvu ya swali kuhusu שַׁדַּי
  choice: “Mwenyezi anaweza kuwafanyia nini?”
  alternative: “Mwenyezi atawafanyia nini?”
  rationale: Katika muktadha, swali linaonyesha dharau kuhusu uwezo au hatua ya Mungu; “anaweza” huakisi maana hiyo bila kuingiza jibu la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Nukuu mbili na mabadiliko ya viwakilishi yamehifadhiwa kwa uaminifu kwa maandishi ya Kiebrania.
