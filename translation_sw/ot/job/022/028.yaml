  text: Utaamua jambo[a], nalo litathibitika kwako, na nuru itaangaza juu ya njia zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utatoa kauli, nayo itasimama imara kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִגְזַר
  choice: utaamua
  rationale: Kitenzi גזר kinaweza kumaanisha kukata au kugawanya, na kwa maana iliyopanuliwa kuamua au kutoa uamuzi. “Utaamua” ni Kiswahili cha sasa na cha kawaida kinachoonyesha uamuzi thabiti bila kuingiza wazo la mamlaka ya kifalme lisilolazimishwa na muktadha.
- source_word: אֹמֶר
  choice: jambo
  rationale: Ingawa אֹמֶר kwa kawaida ni “neno” au “kauli,” katika muungano huu na גזר inaelekea kumaanisha jambo linaloamuliwa au kutamkwa. “Jambo” linawasilisha maana hiyo ya kimatendo; tafsiri halisi zaidi imehifadhiwa katika tanbihi.
- source_word: יָקָם
  choice: litathibitika
  rationale: קום kimsingi ni kusimama au kuinuka; kuhusu uamuzi uliotamkwa, inaonyesha kwamba jambo hilo litasimama imara au litakuwa na uthabiti. “Litathibitika” linaonyesha matokeo hayo bila kuongeza hakikisho la kiteolojia lisilo katika maneno yenyewe.
- source_word: לָךְ
  choice: kwa ajili yako
  rationale: Kihusishi ל hapa kinaonyesha uhusiano au manufaa. “Kwa ajili yako” kinaweka wazi mwelekeo huo wa ahadi.
- source_word: דְּרָכֶיךָ
  choice: njia zako
  rationale: דרך humaanisha njia na pia mwenendo au mkondo wa maisha. “Njia zako” linahifadhi sitiari ya kishairi inayolingana na taswira ya nuru.
- source_word: נָגַהּ אֹור
  choice: nuru itaangaza
  rationale: נגה humaanisha kung'aa au kuangaza, huku אוֹר ikiwa kiima. “Nuru itaangaza” ni ya kawaida, wazi, na inahifadhi taswira ya Kiebrania.
theological_decisions:
- issue: Asili ya ahadi katika hotuba ya Elifazi
  choice: Kauli imetafsiriwa kama tamko la uhakika la matokeo yanayotarajiwa katika maneno ya Elifazi, bila kuongezwa nguvu ya kuwa dhamana ya kiteolojia isiyo na masharti.
  alternative: Kuitafsiri kama ahadi kamili ya mafanikio, au kuilegeza kuwa uwezekano tu.
  rationale: Ayubu 22 inawasilisha ushauri na mtazamo wa Elifazi, ambao si lazima uwe uamuzi wa mwisho wa kitabu. Tafsiri inadumisha ujasiri wa kauli yake huku ikihifadhi mvutano wa kiteolojia wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na picha ya nuru juu ya njia zimehifadhiwa, huku msamiati ukibaki rahisi kueleweka kwa msomaji wa kawaida.
