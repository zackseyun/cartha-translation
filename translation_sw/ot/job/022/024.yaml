lexical_decisions:
- source_word: וְשִׁית
  choice: na uweke
  rationale: Kitenzi שׁית humaanisha kuweka au kutia. Umbo la kuhimiza limeendelezwa kwa ‘uweke,’ huku וְ likitafsiriwa ‘na’ ili kuhifadhi mfuatano wa kishairi.
- source_word: עַל עָפָר
  choice: mavumbini
  rationale: Ingawa עַל kwa kawaida ni ‘juu ya,’ umbo la mahali ‘mavumbini’ ni la asili katika Kiswahili na linaonyesha dhahabu ikiwekwa chini katika mavumbi.
- source_word: בָּצֶר
  choice: dhahabu
  rationale: Katika muktadha huu neno linaweza kumaanisha madini ya thamani, hasa dhahabu au mawe yenye dhahabu. ‘Dhahabu’ ni wazi na inadumisha usambamba na Ofiri; uwezekano wa ‘madini ya dhahabu’ umehifadhiwa katika tanbihi.
- source_word: וּבְצוּר נְחָלִים
  choice: miongoni mwa mawe ya vijito vya msimu
  rationale: צוּר ni mwamba au jiwe, na נְחָלִים ni vijito, mabonde ya vijito, au mikondo inayotiririka kwa msimu. Usemi huu wa Kiswahili unawasilisha mandhari ya mawe katika mikondo hiyo bila kutumia neno la kigeni ‘wadi.’
- source_word: אוֹפִיר
  choice: dhahabu ya Ofiri
  rationale: Ofiri ni jina la mahali palipojulikana kwa dhahabu bora. ‘Dhahabu ya’ linaweka wazi maana inayodokezwa na usambamba wa kishairi.
theological_decisions:
- issue: Nguvu ya himizo katika muktadha wa maneno ya Elifazi
  choice: Taswira inaelekezwa katika kuacha kuitegemea mali ya kidunia kwa kuiweka mavumbini na kati ya mawe.
  alternative: Agizo la kuhifadhi dhahabu salama katika mahali pa asili.
  rationale: Muktadha wa aya 24–25 unalinganisha hazina ya kidunia na Mwenyezi kuwa hazina ya Ayubu. Hata hivyo, tafsiri haiongezi kitenzi chenye nguvu zaidi kama ‘tupa,’ kwa kuwa שׁית yenyewe ni ‘weka’; hivyo maana ya kuiacha dhahabu ijitokeze kupitia taswira na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Mavumbini’ na ‘vijito vya msimu’ ni misemo inayoeleweka kwa msomaji wa kawaida. Hakuna kimilikishi ‘yako’ kilichoongezwa kwa kuwa hakipo wazi katika neno בָּצֶר, ingawa anayesemeshwa ni mtu wa pili umoja.
