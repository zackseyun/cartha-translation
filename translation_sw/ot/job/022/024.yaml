  text: na uweke dhahabu mavumbini[a], na dhahabu ya Ofiri[c] miongoni mwa mawe ya vijito vya msimu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na uweke madini ya thamani mavumbini.” Neno la Kiebrania linaweza kumaanisha madini ya thamani au dhahabu ghafi, si dhahabu iliyosafishwa tu.
    reason: lexical_alternative
