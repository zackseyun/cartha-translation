  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: sw
  text: Tafadhali, pokea mafundisho[a] kutoka kinywani mwake, na weka maneno yake moyoni mwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “sheria” au “maelekezo” (Kiebrania: torah).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: pokea
  rationale: Kitenzi hiki humaanisha kihalisi ‘chukua,’ lakini katika muktadha wa kupokea mafundisho, ‘pokea’ kinaeleza kwa kawaida kukubali yanayofundishwa.
- source_word: נָא
  choice: Tafadhali
  rationale: Chembe hii inaonyesha ombi au himizo la upole hapa, si hasa wakati wa ‘sasa.’
- source_word: מִפִּיו
  choice: kutoka kinywani mwake
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya maneno yanayotoka moja kwa moja kinywani mwa msemaji.
- source_word: תּוֹרָה
  choice: mafundisho
  rationale: Katika hotuba hii ya hekima, neno hili lina maana ya maelekezo au mafundisho yenye mamlaka, bila kulazimisha maana mahsusi ya Sheria ya Musa.
- source_word: וְשִׂים
  choice: na uyaweke
  rationale: ‘Yaweke’ inadumisha taswira ya kuyaweka maneno ndani ya moyo ili yakumbukwe na kuongoza maisha.
- source_word: אֲמָרָיו
  choice: maneno yake
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi huu wa Kiebrania.
- source_word: בִּלְבָבֶךָ
  choice: moyoni mwako
  rationale: Hifadhi ya moyo kama kitovu cha fikira na nia inadumishwa kwa usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Maana ya תּוֹרָה katika hotuba ya hekima
  choice: mafundisho
  alternative: sheria; maelekezo
  rationale: ‘Mafundisho’ yanafaa kwa muktadha wa wito wa Elifazi wa kupokea maelekezo ya Mungu, huku yakiepuka kuingiza kimya kimya dhana mahsusi ya sheria ya agano ambayo muktadha haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira za ‘kinywa’ na ‘moyo’ zimehifadhiwa kwa sababu zinaeleweka kwa kawaida na zinaakisi kwa karibu maandishi ya Kiebrania.
