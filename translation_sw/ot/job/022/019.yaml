base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: sw
  text: Waadilifu wataona na watafurahi, na asiye na hatia atawadhihaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atawacheka kwa dharau” au “atawakejeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: wataona
  rationale: Kitenzi cha Qal, nafsi ya tatu wingi, kikimaanisha kuona au kushuhudia yaliyotokea; “wataona” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: צַדִּיקִים
  choice: wenye haki
  rationale: Kivumishi cha wingi kilichotumika kama nomino; “wenye haki” ni Kiswahili cha kawaida kinachohifadhi kundi la kimaadili linalotajwa.
- source_word: וְיִשְׂמָחוּ
  choice: na kufurahi
  rationale: Kitenzi שׂמח kinaonyesha kuwa na furaha; muundo huu unaunganisha kwa kawaida tendo la kuona na jibu la kufurahi bila kuongeza nguvu isiyokuwamo.
- source_word: וְנָקִי
  choice: naye asiye na hatia
  rationale: Kivumishi cha umoja kilichotumika kama nomino ya jumla. “Asiye na hatia” huhifadhi maana ya kutokuwa na kosa na pia umoja wa Kiebrania.
- source_word: יִלְעַג
  choice: atawadhihaki
  rationale: Kitenzi לעג huonyesha dharau au kejeli; “dhihaki” ni neno la sasa, lenye heshima ya kifasihi, na lenye nguvu inayofaa kuliko kucheka tu.
- source_word: לָמוֹ
  choice: wa- katika “atawadhihaki”
  rationale: Kiwakilishi hiki kinarejelea watu waovu katika muktadha uliotangulia; Kiswahili huonyesha yambwa hilo kiasili kwa kiambishi “wa-” ndani ya kitenzi.
theological_decisions:
- issue: Marejeo ya viwakilishi katika muktadha
  choice: Wenye haki na asiye na hatia wanaitikia kuanguka kwa waovu waliotajwa katika mistari inayozunguka.
  alternative: Kauli ya jumla kwamba wenye haki hufurahi wanaposhuhudia hukumu ya Mungu.
  rationale: Muktadha wa karibu unazungumzia kuangamizwa kwa waovu. Tafsiri inahifadhi kiwakilishi bila kutaja “waovu” moja kwa moja, hivyo haifungi zaidi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wenye haki” na “asiye na hatia” huhifadhi ulinganifu wa kimaadili, huku umoja wa נָקִי ukidumishwa. Alama ya tanbihi [a] imewekwa baada ya neno linalohusika.
