  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: sw
  text: Je, ni kwa sababu unamcha kwamba anakukemea na kuingia nawe katika hukumu?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya kumcha kwako”; Kiebrania halisi, “kutokana na/kwa sababu ya hofu au kicho chako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “anakukaripia” au “anakusahihisha.”
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri halisi, “anakuja pamoja nawe katika hukumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: ni kwa sababu ya kumcha kwako
  rationale: 'Kirai hiki ni cha swali na kinaonyesha sababu: ‘je, ni kwa sababu ya hofu/kicho chako?’ Katika muktadha, anayechwa ni Mungu. ‘Kumcha kwako’ ni Kiswahili cha kawaida kinachobeba maana ya hofu yenye kicho bila kulazimisha maana ya ‘uchaji’ pekee.'
- source_word: יֹכִיחֶךָ
  choice: anakukemea
  rationale: Hifili ya יכח inaweza kumaanisha kukemea, kusahihisha, au kumshitaki mtu. ‘Anakukemea’ huhifadhi nguvu ya maadili na pia inaweza kueleweka katika muktadha wa shauri la hukumu, bila kuifinya kuwa kosa la kisheria pekee.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: kuingia nawe katika hukumu
  rationale: Kauli ya Kiebrania ni halisi zaidi ‘kuja pamoja nawe katika hukumu.’ ‘Kuingia nawe katika hukumu’ ni ya asili kwa Kiswahili, huhifadhi taswira ya shauri la kimahakama, na haibadili Mungu kuwa mwenye kumleta Ayubu tu kwenye hukumu.
- source_word: מִּשְׁפָּט
  choice: hukumu
  rationale: Hapa neno linahusu hatua au shauri la kimahakama. ‘Hukumu’ ni pana na ya kawaida, huku muktadha ukionyesha maana ya kisheria.
theological_decisions:
- issue: Mhusika anayelengwa na ‘kumcha kwako’
  choice: Mungu ndiye anayechwa; jambo hilo linaachwa lieleweke kwa muktadha katika Kiswahili.
  alternative: Kutaja wazi ‘kumcha Mungu kwako’ au ‘kwa sababu unamcha.’
  rationale: Kiambishi cha nafsi ya pili katika Kiebrania kinasema kwa ufupi ‘hofu/kicho chako,’ na muktadha unaonyesha kuwa kinamwelekea Mungu. Kiswahili ‘kumcha kwako’ kinaeleweka bila kuongeza jina lisilokuwamo wazi katika mstari.
- issue: Nguvu ya swali la Elifazi
  choice: Swali la balagha linalotarajia jibu ‘la.’
  alternative: Swali lisiloegemea upande wowote.
  rationale: 'Kiulizi cha Kiebrania na hoja ya Elifazi vinaonyesha kejeli: anakanusha kwamba Mungu anamwingiza Ayubu hukumuni kwa sababu ya uchaji wake. Muundo wa ‘Je’ huhifadhi nguvu hiyo bila kuifafanua kupita kiasi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa swali na taswira ya kimahakama vimehifadhiwa; ‘kumcha’ hubakiza mvutano kati ya hofu na kicho.
