  text: הַסְכֶּן נָ֣א עִמּ֑/וֹ וּ/שְׁלם בָּ֝/הֶ֗ם תְּֽבוֹאַתְ/ךָ֥ טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: sw
  text: Tafadhali, patana naye[a] na uwe na amani; kwa kufanya hivyo[b], mema yatakujia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: jizoeshe naye; au mfahamu vizuri.'
    reason: Mzizi סכן hapa una maana inayoweza kueleweka kama kufahamiana au kujizoesha na mtu, na pia kwa muktadha kama kupatana naye.
  - marker: b
    text: 'Kihalisi: kwa hayo.'
    reason: Neno בָּהֶם ni kiwakilishi cha wingi na huenda linarejelea maagizo mawili yaliyotangulia.
lexical_decisions:
- source_word: הַסְכֶּן
  choice: patana
  rationale: Kitenzi hiki katika kauli ya hifili kinaweza kumaanisha kujizoesha au kufahamiana na mtu, na kwa muktadha huu kinahimiza kurekebisha uhusiano naye. “Patana naye” ni Kiswahili cha kawaida kinachowasilisha mwito huo bila kuongeza fundisho lisilokuwamo.
- source_word: וּשְׁלם
  choice: na uwe na amani
  rationale: Kauli hii ya amri inahifadhi wazo la kuwa katika hali ya amani baada ya kupatana.
- source_word: בָּהֶם
  choice: kwa kufanya hivyo
  rationale: Kiwakilishi cha wingi, kihalisi “kwa hayo,” kinaelekea kurejelea maagizo yaliyotangulia. Kiswahili “kwa kufanya hivyo” kinaonyesha rejeo hilo kwa kawaida huku tanbihi ikihifadhi umbo la karibu zaidi na asili.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: mema yatakujia
  rationale: Muundo wa Kiebrania unasema kwa kawaida kwamba yaliyo mema yatamjia msikilizaji; “mema” hutumika kwa maana ya pamoja katika Kiswahili.
theological_decisions:
- issue: Mhusika anayerejelewa na kiwakilishi “naye”
  choice: Kuhifadhi kiwakilishi bila kutaja jina
  alternative: Kutafsiri “patana na Mungu”
  rationale: Ingawa muktadha unaelekeza kwa Mungu, mstari wenyewe una kiwakilishi tu. Kutotaja jina kunahifadhi namna ya usemi ya maandishi ya asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tafadhali” huhifadhi נָא, huku sentensi fupi ya amri ikibaki wazi na ya kawaida kwa wasomaji wengi.
