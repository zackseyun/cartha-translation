  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: sw
  text: Lakini yeye alijaza nyumba zao vitu vyema[a], ila shauri la waovu liko mbali nami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri isiyo halisi sana, “ustawi.” Kiebrania kinasema “mema,” huenda kikimaanisha vitu vyema au mema aliyowatendea.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “shauri la waovu na liwe mbali nami.” Kiebrania kinasomeka moja kwa moja zaidi kama kauli: “shauri la waovu liko mbali nami.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Lakini yeye
  rationale: Kiunganishi pamoja na kiwakilishi kinaonyesha tofauti na mtazamo wa waovu katika muktadha uliotangulia, huku kikihifadhi mtendaji aliye wazi, yaani Mungu.
- source_word: מִלֵּא
  choice: alijaza
  rationale: Kitenzi kinamaanisha ‘kujaza’; wakati uliopita unafaa simulizi la kishairi la mambo yaliyotendeka.
- source_word: בָתֵּיהֶם
  choice: nyumba zao
  rationale: Huhifadhi picha halisi ya Kiebrania; katika muktadha nyumba hizo pia zinawakilisha maisha na mali zao.
- source_word: טוֹב
  choice: vitu vyema
  rationale: Neno ‘vyema’ limetumika kama nomino katika Kiebrania. Kiswahili cha kawaida huhitaji ‘vitu vyema’; ‘ufanisi’ lingeongeza ufafanuzi usio wazi moja kwa moja katika neno lenyewe.
- source_word: וַעֲצַת
  choice: ila shauri
  rationale: ‘Ila’ huonyesha tofauti kati ya wema ambao Mungu aliwapa na kujitenga kwa msemaji na shauri lao. ‘Shauri’ linaweza kumaanisha ushauri au mpango, kama עֵצָה.
- source_word: רְשָׁעִים
  choice: la waovu
  rationale: Ni tafsiri ya kawaida na sahihi ya kivumishi cha wingi kilichotumika kama nomino.
- source_word: רָחֲקָה מֶנִּי
  choice: liko mbali nami
  rationale: Kauli hii inaeleza kujitenga kwa msemaji na shauri la waovu. Wakati wa sasa wa Kiswahili huwasilisha vizuri maana ya hali inayotokana na qatal bila kuigeuza kuwa amri au ombi.
theological_decisions:
- issue: Msimamo wa msemaji katika sehemu ya mwisho
  choice: 'Kauli ya moja kwa moja: “shauri la waovu liko mbali nami.”'
  alternative: “shauri la waovu na liwe mbali nami.”
  rationale: Kiebrania kina umbo la qatal, si amri wala jussive. Tafsiri inadumisha kauli ya kujitenga bila kuongeza maana ya sala au matakwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na picha halisi ya ‘nyumba’ zimehifadhiwa; ‘ila’ linaweka tofauti ya vifungu bila kufanya sentensi kuwa nzito.
