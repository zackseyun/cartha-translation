  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Kitenzi ענה katika mfululizo huu wa kisimulizi huanzisha jibu katika mazungumzo; “akajibu” ni cha kawaida na huhifadhi nguvu ya kidialogia.
- source_word: אֱלִיפַז
  choice: Elifazi
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הַתֵּמָנִי
  choice: Mtemani
  rationale: Kivumishi cha nasaba au asili kutoka Temani kimetafsiriwa kwa umbo fupi na la kawaida la Kiswahili, “Mtemani.”
- source_word: וַיֹּאמַר
  choice: na kusema
  rationale: אמר ni kitenzi cha kawaida cha kunena. “Na kusema” huhifadhi fomula ya Kiebrania “akajibu na kusema” bila kuondoa urudiaji wake wa kimakusudi.
- source_word: וַ
  choice: Ndipo
  rationale: Waw ya mwanzo inaendeleza simulizi kwa hatua inayofuata; “Ndipo” huwasilisha mfuatano huo kwa Kiswahili cha asili.
