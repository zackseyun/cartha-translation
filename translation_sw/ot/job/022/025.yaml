  text: then the Almighty will be your gold[a], and choice silver for you.
translation:
  language: sw
  text: ndipo Mwenyezi atakuwa dhahabu yako[a], na fedha teule kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndipo Mwenyezi atakuwa hazina yako, na fedha nyingi kwako.” Maneno ya Kiebrania yanayotafsiriwa “dhahabu” na “teule” ni magumu; huenda yakasisitiza mali ambayo Mungu anatoa badala ya Mungu mwenyewe kuwa hazina.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: ndipo ... atakuwa
  rationale: Katika muktadha wa sharti na himizo la Elifazi, muundo huu unaonyesha matokeo ya wakati ujao; “ndipo” huwasilisha matokeo hayo kwa Kiswahili cha kawaida.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Hili ni jina la Mungu linalosisitiza uweza wake; “Mwenyezi” ni tafsiri ya kawaida, yenye heshima na inayoeleweka katika Kiswahili.
- source_word: בְּצָרֶיךָ
  choice: dhahabu yako
  rationale: Neno hili gumu linaweza kumaanisha madini au mali ya thamani. Ulinganifu wake na “fedha” unaunga mkono maana ya dhahabu, huku uwezekano wa “hazina” ukihifadhiwa katika tanbihi.
- source_word: וְכֶסֶף
  choice: na fedha
  rationale: Imehifadhiwa kama sehemu ya pili ya usambamba wa kishairi, huku kitenzi “atakuwa” kikieleweka kutoka sehemu ya kwanza.
- source_word: תּוֹעָפוֹת
  choice: teule
  rationale: Neno hili adimu lina maana isiyo hakika, huenda likidokeza ubora au wingi. “Teule” huhifadhi maana ya ubora bila kuamua kwa nguvu kuwa linamaanisha wingi.
- source_word: לָךְ
  choice: kwako
  rationale: “Kwako” huhifadhi wazo la kitu kuwa kwa manufaa au milki ya mhusika na husikika kwa kawaida katika kishairi hiki.
theological_decisions:
- issue: Maana ya ahadi katika hotuba ya Elifazi
  choice: Mstari mkuu unamtambulisha Mwenyezi mwenyewe kuwa dhahabu, yaani mali ya kweli ya Ayubu.
  alternative: Huenda mstari ukamaanisha kwamba Mwenyezi atampa Ayubu dhahabu na fedha nyingi.
  rationale: Muundo wa Kiebrania na usambamba wa kishairi huruhusu usomaji wa Mungu mwenyewe kama hazina, lakini maneno magumu yanaweza pia kuelekeza kwenye mali anayoitoa Mungu. Tanbihi huhifadhi mvutano huo bila kuutatua kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi unahifadhi usambamba wa kishairi; tanbihi inaweka wazi utata halisi wa Kiebrania.
