  text: וְ/אִ֣ישׁ זְ֭רוֹעַ ל֣/וֹ הָ/אָ֑רֶץ וּ/נְשׂ֥וּא פָ֝נִ֗ים יֵ֣שֶׁב בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: sw
  text: Lakini nchi ilikuwa ya mtu mwenye nguvu[a], na mtu aliyependelewa[b] aliishi humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mtu wa mkono,” yaani mtu mwenye nguvu au mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Au “mtu aliyeheshimiwa,” “aliyeonyeshwa upendeleo,” au “aliyetendewa kwa upendeleo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Lakini ... mtu
  rationale: 'Kiunganishi וְ kimetafsiriwa kwa maana ya upinzani inayofaa muktadha: hali ya mtu huyu inatofautishwa na kutendewa kwa wanyonge katika mistari inayozunguka.'
- source_word: זְרוֹעַ
  choice: mwenye nguvu
  rationale: Neno hili kihalisi ni ‘mkono,’ lakini katika kirai אִישׁ זְרוֹעַ ni nahau inayomaanisha mtu mwenye nguvu au mamlaka. ‘Mtu mwenye nguvu’ ni Kiswahili cha kawaida na huhifadhi picha hiyo kupitia tanbihi.
- source_word: לוֹ הָאָרֶץ
  choice: nchi ilikuwa ya
  rationale: 'Muundo wa ל pamoja na kiwakilishi unaonyesha umiliki au udhibiti: ‘nchi ilikuwa yake.’ Tafsiri hii ni ya asili na haibainishi kupita kiasi kama ulikuwa umiliki wa kisheria au udhibiti wa kiutendaji.'
- source_word: וּנְשׂוּא פָנִים
  choice: mtu aliyependelewa
  rationale: Kirai hiki, kihalisi ‘aliyeinuliwa uso,’ kinaweza kumaanisha mtu aliyeonyeshwa upendeleo au aliyeheshimiwa. ‘Aliyependelewa’ hudokeza nafasi yake ya kijamii huku tanbihi ikihifadhi maana mbadala.
- source_word: יֵשֶׁב בָּהּ
  choice: aliishi humo
  rationale: יָשַׁב hapa humaanisha kukaa au kuishi mahali. ‘Aliishi humo’ ni usemi wazi wa Kiswahili na kiambishi ‘humo’ hurejelea nchi iliyotajwa.
theological_decisions:
- issue: Ikiwa נְשׂוּא פָנִים inaonyesha heshima halali au upendeleo usio wa haki
  choice: aliyependelewa
  alternative: aliyeheshimiwa
  rationale: Muktadha wa shtaka la Elifazi unaelekea kwenye fursa maalumu au upendeleo, lakini Kiebrania kinaweza pia kueleweka kama heshima. Tafsiri kuu inafuata muktadha, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Ulinganifu wa kishairi kati ya ‘mtu mwenye nguvu’ na ‘mtu aliyependelewa’ umehifadhiwa, pamoja na utata wa kiwango cha heshima au upendeleo katika נְשׂוּא פָנִים.
