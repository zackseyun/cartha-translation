  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: sw
  text: Lakini unasema, “Mungu anajua nini? Je, anaweza kuhukumu[a] kupitia giza nene[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, anahukumu kupitia giza nene?” Kitenzi cha Kiebrania kinaweza pia kueleweka kuwa tendo la sasa au la baadaye, wala si lazima kionyeshe uwezo.
    reason: alternative_reading
  - marker: b
    text: “Giza nene” pia linaweza kutafsiriwa “wingu jeusi” au “utusitusi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Lakini unasema
  rationale: Kiunganishi pamoja na kitenzi cha nafsi ya pili ya kiume kina nguvu ya shtaka au kunukuu kauli. Wakati wa sasa ni wa kawaida katika Kiswahili kwa kauli inayodaiwa katika muktadha huu, na “Lakini” huonyesha utofautishaji wa hoja.
- source_word: מַה יָדַע אֵל
  choice: Mungu anajua nini?
  rationale: Muundo huu unahifadhi swali la kejeli kuhusu maarifa ya Mungu bila kuligeuza kuwa kauli ya uwezo; אֵל limetafsiriwa kwa neno la kawaida “Mungu.”
- source_word: הַבְעַד
  choice: kupitia
  rationale: Kihusishi kinaonyesha kitu kinachozuia au kilicho katikati; “kupitia” huwasilisha wazo la kuhukumu huku giza nene likiwa kizuizi.
- source_word: עֲרָפֶל
  choice: giza nene
  rationale: Nomino hii inaweza kumaanisha giza zito, mawingu mazito, au utusitusi. “Giza nene” ni ya asili na huhifadhi taswira ya uoni uliozuiwa.
- source_word: יִשְׁפּוֹט
  choice: anaweza kuhukumu
  rationale: Katika swali hili la kejeli, hali isiyokamilika inaweza kudokeza uwezo. “Anaweza kuhukumu” huwasilisha shaka inayodaiwa kuhusu uwezo wa Mungu wa kuona na kutoa hukumu.
theological_decisions:
- issue: Ikiwa יִשְׁפּוֹט itafsiriwe kama uwezo au kama tendo la kawaida/baadaye
  choice: Je, anaweza kuhukumu kupitia giza nene?
  alternative: Je, anahukumu kupitia giza nene? / Je, atahukumu kupitia giza nene?
  rationale: Muktadha unaonyesha Elifazi akimhusisha Ayubu na wazo kwamba giza humzuia Mungu asione na kutawala mambo ya wanadamu. Tafsiri ya uwezo ni ya kawaida katika swali la Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya tendo la sasa au la baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachohusika.
