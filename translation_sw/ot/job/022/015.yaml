lexical_decisions:
- source_word: הָאֹרַח
  choice: njia
  rationale: אֹרַח humaanisha njia, mara nyingi ikiwa sitiari ya mwenendo wa maisha; “njia” ni neno la kawaida na linahifadhi taswira hiyo.
- source_word: עוֹלָם
  choice: ya kale
  rationale: Katika muktadha huu עוֹלָם inaeleza njia iliyofuatwa zamani sana, si lazima njia ya milele.
- source_word: תִּשְׁמֹר
  choice: utaendelea kuifuata
  rationale: Ingawa שׁמר kimsingi ni kutunza au kushika, ikiwa na “njia” hapa ina maana ya kudumu katika mwenendo huo au kuifuata.
- source_word: אֲשֶׁר
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinaanzisha kishazi kinachoifafanua njia.
- source_word: דָּרְכוּ
  choice: waliikanyaga
  rationale: Kitenzi דרך kina maana ya kukanyaga au kutembea juu ya kitu; “waliikanyaga” kinahifadhi taswira halisi ya njia.
- source_word: מְתֵי אָוֶן
  choice: watu waovu
  rationale: Kirai hiki kihalisi ni “watu wa uovu”; “watu waovu” ni Kiswahili cha kawaida kinachohifadhi uzito wake wa kimaadili.
