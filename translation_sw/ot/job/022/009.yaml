  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: sw
  text: Uliwaacha wajane waende mikono mitupu,[a] na mikono[b] ya watoto wasio na baba ikapondwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kitu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mikono ya watoto wasio na baba”; “mikono” inaweza pia kumaanisha nguvu au uwezo wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: wajane
  rationale: Nomino hii ya wingi humaanisha wanawake waliofiwa na waume zao; “wajane” ni Kiswahili cha kawaida na hudumisha hali yao ya kudhulumiwa kijamii.
- source_word: שִׁלַּחְתָּ
  choice: uliwafukuza
  rationale: Piel ya שלח hapa ina maana ya kuwaondoa au kuwafukuza. “Uliwafukuza” inaonyesha uzito wa shtaka kwa lugha ya kawaida ya Kiswahili.
- source_word: רֵיקָם
  choice: mikono mitupu
  rationale: Kielezi hiki humaanisha kuondoka bila kitu. Nahau “mikono mitupu” ni ya asili katika Kiswahili na huwasilisha maana hiyo wazi.
- source_word: זְרֹעוֹת
  choice: mikono
  rationale: Maana ya msingi ni mikono, lakini katika Kiebrania inaweza pia kuashiria nguvu au uwezo. Neno halisi “mikono” linahifadhi taswira na pia uwezekano wa maana ya kitamathali.
- source_word: יְתֹמִים
  choice: watoto wasio na baba
  rationale: Katika mazingira haya neno humaanisha hasa watoto waliokosa baba na ulinzi wake wa kijamii; tafsiri hii ni sahihi kuliko “yatima,” ambalo kwa wasomaji wengine linaweza kumaanisha mtoto aliyefiwa na wazazi wote wawili.
- source_word: יְדֻכָּא
  choice: ikavunjwa
  rationale: Kitenzi cha kutendwa kutoka דכא kina maana ya kupondwa au kuvunjwa. Umbo la Kiebrania ni la umoja ingawa “mikono” ni wingi; Kiswahili “ikavunjwa” linakubaliana na “mikono” kama ngeli ya 4 na linahifadhi picha ya kuvunjwa bila kuamua kama ni halisi au ya kitamathali.
theological_decisions:
- issue: Je, “mikono” ni viungo vya mwili au ishara ya nguvu na uwezo?
  choice: Kuhifadhi taswira ya “mikono” katika matini kuu.
  alternative: “Nguvu za watoto wasio na baba zilikandamizwa.”
  rationale: Kiebrania kinaruhusu picha halisi pamoja na maana ya kitamathali. Kutafsiri “mikono” kunahifadhi utata huo bila kuamua kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mikono mitupu” ni nahau iliyo wazi; “watoto wasio na baba” huhifadhi kwa usahihi zaidi kundi la kijamii linalotajwa na Kiebrania. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
