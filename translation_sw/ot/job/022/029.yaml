base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: sw
  text: Kwa maana wanaposhushwa, wewe husema, “Kuinuliwa!”[a] naye humwokoa mtu mwenye macho yaliyotazama chini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanapoangushwa, utasema, ‘Kuna kuinuliwa!’” Kishazi cha Kiebrania ni kifupi na kina maneno yaliyoachwa kueleweka.
    reason: alternative_reading
  - marker: b
    text: Neno kwa neno, “aliye chini wa macho”; yaani, mtu mnyenyekevu au aliyefadhaika.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu linaanzisha msingi au hali inayohusiana na ahadi iliyotangulia. ‘Kwa maana’ ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: הִשְׁפִּילוּ
  choice: wanaposhushwa
  rationale: Kitenzi kutoka שׁפל kinaonyesha kufanywa kuwa chini au kudhalilishwa. Muundo wa wingi umehifadhiwa, bila kuufanya kuwa tendo la hiari la kujinyenyekeza.
- source_word: וַתֹּאמֶר
  choice: wewe husema
  rationale: Kitenzi kinamwelekea mtu mmoja. Wakati wa mazoea ‘husema’ unafaa kwa kauli yenye nguvu ya kimethali au ya ahadi, huku ‘wewe’ ikiweka wazi nafsi inayosemeshwa.
- source_word: גֵּוָה
  choice: Kuinuliwa!
  rationale: Nomino hii ni fupi na muktadha wake ni mgumu; hapa inaonyesha hali ya kuinuliwa, kinyume cha kushushwa. Nomino ya mshangao inalinda ufupi na hali ya sentensi ya Kiebrania kuliko kuongeza mtendwa asiyeandikwa.
- source_word: וְשַׁח עֵינַיִם
  choice: mtu mwenye macho yaliyoinama
  rationale: Neno kwa neno ni mtu ‘aliye chini wa macho’ au mwenye macho yaliyoshushwa. Tafsiri hii inahifadhi taswira ya macho na inaweza kumaanisha mnyenyekevu au aliyefadhaika.
- source_word: יוֹשִׁעַ
  choice: humwokoa
  rationale: Kutoka ישׁע, ‘kuokoa’ au ‘kukomboa.’ Kiambishi cha mazoea hu- kinaendana na mtindo wa kauli au ahadi; yule anayeokoa anaachwa kuwa mhusika anayeeleweka katika muktadha.
theological_decisions:
- issue: Mhusika wa יוֹשִׁעַ
  choice: Mhusika anaeleweka kuwa Mungu, lakini jina ‘Mungu’ halijaongezwa katika matini.
  alternative: 'Mhusika asiyeainishwa, au kumfanya anayeambiwa kuwa mhusika: ‘utaokoa.’'
  rationale: Kitenzi cha Kiebrania ni nafsi ya tatu umoja wa kiume, na muktadha unamdokeza Mungu. ‘Naye humwokoa’ huhifadhi ufupi wa Kiebrania bila kuingiza nomino isiyokuwamo.
- issue: Maana ya גֵּוָה katika kishazi hiki kigumu
  choice: 'Imetafsiriwa kama tangazo la kuinuliwa: ‘Kuinuliwa!’'
  alternative: ‘Kuna kuinuliwa!’; ‘Wainuliwe!’; au ‘kiburi’ kwa maana hasi.
  rationale: Ingawa neno linaweza kumaanisha ukuu, majivuno, au hali ya kuwa juu, hapa tofauti yake na kushushwa inaelekeza kwenye kugeuzwa kwa hali na kuinuliwa. Muundo wa nomino umehifadhiwa ili kutofanya kishazi kuwa amri bila ulazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. Taswira ya macho yaliyoinama na ufupi wenye utata wa ‘Kuinuliwa!’ vimehifadhiwa; maelezo ya ziada yamewekwa katika tanbihi badala ya kuingizwa kimya kimya katika matini.
