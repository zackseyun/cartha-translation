translation:
  language: sw
  text: walionyakuliwa kabla ya wakati wao[a], ambao msingi wao ulisombwa na mto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikatiliwa mbali kabla ya wakati wao.” Kitenzi cha Kiebrania ni kigumu na kinaweza kudokeza kukunjamana au kusinyaa, kushikwa, au kuondolewa ghafula.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kihalisi huhusiana na kumimina, lakini muundo wa taswira ya mto na msingi umebanwa na ni mgumu. Kinaweza kumaanisha kwamba msingi wao ulizidiwa na maji au ulisombwa. Huenda mstari huu unadokeza kizazi kilichoangamizwa katika gharika, au kwa ujumla kuanguka kwa ghafla kwa waovu.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambao
  rationale: Kiwakilishi rejeshi kinawaelezea watu waovu waliotajwa katika muktadha.
- source_word: קֻמְּטוּ
  choice: waliokunjamana
  rationale: Kitenzi hiki kwa kawaida huhusishwa na kukunjamana au kusinyaa. Tafsiri hii inahifadhi taswira ya Kiebrania na ugumu wake bila kuamua moja kwa moja kwamba maana yake ni kunyakuliwa au kukatiliwa mbali.
- source_word: וְלֹא עֵת
  choice: kabla ya wakati wao
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha mwisho uliowafikia mapema, ingawa Kiebrania kihalisi ni ‘na si wakati.’
- source_word: נָהָר
  choice: mto
  rationale: Neno hilo kwa kawaida humaanisha mto; kutafsiri ‘gharika’ kungeamua mapema kuwa mstari huu unarejelea gharika ya Nuhu.
- source_word: יוּצַק
  choice: ulisombwa
  rationale: Kitenzi kihalisi kinahusu kumiminwa, lakini katika muundo huu wenye ‘mto’ na ‘msingi’ taswira inaelekea kwenye msingi kuondolewa au kuzidiwa na maji. ‘Ulisombwa’ ni Kiswahili cha kawaida kinachohifadhi taswira ya maangamizi kwa maji.
- source_word: יְסוֹדָם
  choice: msingi wao
  rationale: Nomino ni umoja yenye kiambishi cha nafsi ya tatu wingi; ‘msingi wao’ huhifadhi umoja huo na sitiari ya kuporomoka.
theological_decisions:
- issue: Taswira ya hukumu kwa maji
  choice: Kuonyesha maangamizi ya ghafla kwa maji bila kubainisha kwamba ni tukio fulani la kihistoria au sitiari tu.
  alternative: Kutaja wazi kizazi kilichoangamizwa katika gharika ya Nuhu, au kuifanya kuwa sitiari ya jumla ya kuanguka kwa waovu.
  rationale: Muktadha na taswira ya maji zinaweza kudokeza gharika, lakini Kiebrania hakilazimishi utambulisho huo; tafsiri inadumisha uwezekano wote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. ‘Waliokunjamana’ huhifadhi maana ya msingi na ugumu wa קֻמְּטוּ; tanbihi hutoa maana mbadala zinazofaa katika muktadha. Alama zote za tanbihi zimewekwa katika matini kuu.
