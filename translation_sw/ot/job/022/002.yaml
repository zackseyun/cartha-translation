  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: sw
  text: Je, mwanadamu anaweza kumfaa Mungu? Kwa maana mwenye ufahamu hujifaidi mwenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mwanadamu anaweza kuwa wa manufaa kwa Mungu? Hakika mwenye ufahamu hujifaidi mwenyewe.”
    reason: Njia nyingine ya kutafsiri סכן kama “kuwa wa manufaa” na כִּי kwa msisitizo wa “hakika.”
lexical_decisions:
- source_word: הַלְאֵל
  choice: Je, ... kwa Mungu?
  rationale: Muundo wa swali unaweka Mungu kama anayelengwa na manufaa yanayodaiwa; tafsiri hii huhifadhi nguvu ya swali la balagha kwa Kiswahili cha kawaida.
- source_word: יִסְכָּן
  choice: anaweza kuwa na manufaa
  rationale: Kitenzi סכן hapa kina maana ya kuwa na faida au manufaa. Kauli hii ni ya asili na haifanyi picha hiyo iwe ya kibiashara kupita kiasi.
- source_word: גָּבֶר
  choice: mwanadamu
  rationale: Ingawa nomino ni ya kiume umoja, hapa inawakilisha binadamu kwa ujumla; “mwanadamu” huhifadhi maana hiyo ya jumla kwa Kiswahili sanifu.
- source_word: כִּי
  choice: Naam
  rationale: כִּי huanzisha kishazi cha pili kwa msisitizo au maelezo. “Naam” huendeleza mtiririko wa balagha bila kulazimisha uhusiano wa kisababishi pekee.
- source_word: יִסְכֹּן עָלֵימוֹ
  choice: hujifaidi mwenyewe
  rationale: Muunganiko wa סכן na על pamoja na kiambishi cha nafsi unaonyesha manufaa yanayomrudia mhusika mwenyewe. “Hujifaidi mwenyewe” ni fupi na ya asili.
- source_word: מַשְׂכִּיל
  choice: mwenye ufahamu
  rationale: Umbo hili la kishiriki humaanisha mtu mwenye utambuzi au anayetenda kwa hekima. “Mwenye ufahamu” huhifadhi wazo la utambuzi bila kulipanua.
theological_decisions:
- issue: Iwapo mwanadamu anaweza kumletea Mungu manufaa
  choice: Swali limetafsiriwa kwa namna ya balagha, huku kishazi cha pili kikisema kwamba manufaa ya ufahamu humrudia mwanadamu mwenyewe.
  alternative: 'Kishazi cha pili kinaweza kueleweka kwa ujumla tu: “mwenye ufahamu hujifaidi,” bila kusisitiza moja kwa moja tofauti kati yake na Mungu.'
  rationale: Usambamba wa Kiebrania unatofautisha manufaa kwa Mungu na manufaa yanayomrudia mwenye ufahamu, lakini tafsiri haiongezi hitimisho pana la kimafundisho lisilosemwa wazi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwanadamu” hutumika kwa maana ya jumla, na “mwenye ufahamu” huhifadhi upana wa מַשְׂכִּיל.
