  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: sw
  text: Hukumpa aliyechoka maji anywe, na ulimnyima mwenye njaa mkate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “mkate” linaweza pia kumaanisha “chakula” kwa ujumla, lakini maandishi yanahifadhi neno halisi lililotumiwa katika chanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: hukum-
  rationale: Kikanushi cha wakati uliopita kinaonyesha shtaka kwamba Ayubu hakufanya tendo hilo.
- source_word: מַיִם
  choice: maji
  rationale: Nomino ya kawaida inayomaanisha maji; Kiswahili hutumia umbo la wingi kwa maana hii.
- source_word: עָיֵף
  choice: aliyechoka
  rationale: Kivumishi kimetumiwa kama nomino kwa maana ya mtu aliyechoka au kuishiwa nguvu; tafsiri hii ni ya kawaida na haimfanyi kuwa mtu maalumu.
- source_word: תַּשְׁקֶה
  choice: umpa ... anywe
  rationale: Hifili ya שׁקה humaanisha kumpa mtu kinywaji au kumnywesha. Muundo huu ni wa asili katika Kiswahili na unabaki na maana ya kusababisha anywe.
- source_word: וּמֵרָעֵב
  choice: na ... mwenye njaa
  rationale: Kivumishi cha umoja kinamwakilisha kwa ujumla mtu mwenye njaa; 'mwenye njaa' ni Kiswahili cha kawaida.
- source_word: תִּמְנַע
  choice: ulimzuia ... asipate
  rationale: Kitenzi מנע humaanisha kuzuia au kunyima. Muundo huu unaonyesha kuwa chakula alichohitaji kilizuiliwa asikipate.
- source_word: לָחֶם
  choice: mkate
  rationale: Neno hilo kihalisi ni 'mkate.' Ingawa linaweza kumaanisha chakula kwa upana, taswira halisi ya chanzo imehifadhiwa.
