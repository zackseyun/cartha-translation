  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: sw
  text: Kwa hiyo mitego imekuzunguka, na hofu ya ghafula inakutisha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kifungu hiki kinaonyesha hitimisho au matokeo ya mashtaka yaliyotangulia; “Kwa hiyo” ni cha kawaida na huhifadhi nguvu hiyo ya kimantiki.
- source_word: סְבִיבוֹתֶיךָ
  choice: imekuzunguka
  rationale: Neno linaonyesha kuwapo pande zote za mtu. Pamoja na “mitego,” kitenzi hiki kinatoa Kiswahili cha asili na chenye picha wazi.
- source_word: פַחִים
  choice: mitego
  rationale: פַחִים humaanisha mitego au tanzi. “Mitego” ni neno la kawaida, wazi, na linafaa kwa hatari inayomzingira mtu.
- source_word: וִיבַהֶלְךָ
  choice: inakutisha
  rationale: Kitenzi בהל kina maana ya kutia hofu, kushtua, au kuingiza katika taharuki. “Inakutisha” hudumisha uhusiano wa moja kwa moja na nomino “hofu” bila kuongeza tafsiri isiyomo.
- source_word: פַּחַד
  choice: hofu
  rationale: Nomino hii inaweza kumaanisha hofu, woga, au kitisho. “Hofu” ni ya kawaida na inaweza kubeba uzito wa muktadha huu.
- source_word: פִּתְאֹם
  choice: ya ghafula
  rationale: Ingawa ni kielezi chenye maana ya “ghafula,” muundo wa Kiswahili “hofu ya ghafula” huwasilisha hali ya kutokea bila kutarajiwa kwa njia ya asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi na wa moja kwa moja; marudio ya kimaanana kati ya “hofu” na “inakutisha” yamehifadhiwa kwa kuwa yanaakisi פַּחַד pamoja na בהל katika Kiebrania.
