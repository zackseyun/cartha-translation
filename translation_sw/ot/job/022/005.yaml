  text: הֲ/לֹ֣א רָעָֽתְ/ךָ֣ רַבָּ֑ה וְ/אֵֽין קֵ֝֗ץ לַ/עֲוֺנֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: sw
  text: Je, uovu wako si mwingi, na maovu yako hayana mwisho?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hayana kikomo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... si
  rationale: Muundo huu unahifadhi swali la balagha linalotarajia jibu la kukubali, badala ya kuligeuza kuwa dai la moja kwa moja.
- source_word: רָעָתְךָ
  choice: uovu wako
  rationale: Katika muktadha huu neno linamaanisha ubaya wa kimaadili, kwa kuwa linasawazishwa na ‘maovu yako’; ‘uovu’ ni pana na ya asili katika Kiswahili.
- source_word: רַבָּה
  choice: mwingi
  rationale: Neno linaonyesha wingi au ukubwa; ‘mwingi’ linaendana kwa kawaida na nomino ya jumla ‘uovu’.
- source_word: וְאֵין קֵץ
  choice: na ... hayana mwisho
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kuwasilisha msemo wa Kiebrania unaomaanisha kutokuwa na mwisho au kikomo.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: maovu yako
  rationale: Katika mstari huu עֲוֹנוֹת hurejelea matendo yenye hatia ya kimaadili. ‘Maovu’ ni lugha ya sasa na yenye uzito unaofaa bila kuwa ya kitaalamu kupita kiasi.
theological_decisions:
- issue: Je, רָעָתְךָ ni uovu wa kimaadili au msiba?
  choice: uovu wa kimaadili
  alternative: msiba au taabu
  rationale: Usambamba wake na עֲוֺנֹתֶיךָ (‘maovu yako’) unaonyesha kwamba Elifazi anamshutumu Ayubu kwa mwenendo mbaya, si kwamba anaeleza tu mateso yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha na sauti ya shutuma zimehifadhiwa. ‘Uovu’ na ‘maovu’ hutofautisha kwa kiasi neno la kwanza la jumla na wingi wa makosa katika sehemu ya pili.
