  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי תַחְבֹּ֣ל אַחֶ֣י/ךָ חִנָּ֑ם וּ/בִגְדֵ֖י עֲרוּמִּ֣ים תַּפְשִֽׁיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/006.yaml
  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: sw
  text: Kwa maana ulichukua rehani kutoka kwa ndugu zako[a] bila sababu[b], na uliwavua nguo watu waliokuwa uchi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu zako” hapa yaweza kumaanisha kwa upana zaidi watu wenzako katika jamii, si ndugu wa damu tu.
    reason: cultural_note
  - marker: b
    text: Au, “ulichukua dhamana kutoka kwa ndugu zako pasipo haki.”
    reason: lexical_alternative
  - marker: c
    text: Au, “watu waliokuwa na mavazi machache.” Kiebrania kinaweza kumaanisha waliokuwa uchi au waliokuwa wamevaa mavazi yasiyotosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza shtaka la Elifazi kwa nguvu ya kueleza au kutoa sababu, huku ikiunganisha mstari huu na kauli iliyotangulia.
- source_word: תַחְבֹּל
  choice: ulichukua rehani
  rationale: Kitenzi חבל hapa kinamaanisha kuchukua kitu kama dhamana ya deni. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili bila kuamua kimyakimya kama rehani hiyo ilichukuliwa kwa nguvu.
- source_word: אַחֶיךָ
  choice: ndugu zako
  rationale: Hili ndilo maana la moja kwa moja la umbo la Kiebrania. Katika muktadha huu linaweza pia kuwahusu wanaume wengine wa jamii ya mtu, jambo linaloelezwa katika tanbihi.
- source_word: חִנָּם
  choice: bila sababu
  rationale: Hueleza kwamba hatua hiyo haikuwa na msingi wa haki, si tu kwamba haikuwa na malipo.
- source_word: וּבִגְדֵי
  choice: na ... nguo
  rationale: בגד ni vazi au nguo; 'nguo' ni neno la kawaida na lenye hadhi katika Kiswahili cha sasa.
- source_word: עֲרוּמִּים
  choice: watu waliokuwa uchi
  rationale: Huhifadhi picha kali na kinaya cha Kiebrania. Neno hilo pia linaweza kumaanisha waliokuwa na mavazi machache au duni, kama tanbihi inavyoonyesha.
- source_word: תַּפְשִׁיט
  choice: uliwavua
  rationale: Hifili ya פשט hapa ina maana ya kumvua mtu mavazi. 'Uliwavua nguo' ni ya moja kwa moja na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa asili katika Kiswahili, huku ukali wa shtaka na kinaya cha kuwavua nguo watu walio uchi vikihifadhiwa.
