lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Huanzisha sharti waziwazi na kwa lugha ya kawaida ya Kiswahili.
- source_word: תָּשׁוּב
  choice: ukimrudia
  rationale: Kitenzi שוב kimsingi humaanisha kurudi au kumrudia; tafsiri hii haiingizi moja kwa moja maana finyu zaidi ya ‘kutubu,’ ingawa muktadha unaweza kuidokeza.
- source_word: עַד שַׁדַּי
  choice: Mwenyezi
  rationale: עַד huonyesha mwelekeo wa kurudi kwa Mungu, na שַׁדַּי ni cheo cha Mungu kinachotafsiriwa kwa kawaida kuwa ‘Mwenyezi.’ Kiambishi cha yambwa katika ‘ukimrudia’ kinaonyesha kurudi kwake.
- source_word: תִּבָּנֶה
  choice: utarejeshwa
  rationale: Nifali ya בנה ni kihalisi ‘utajengwa’ au ‘utajengwa upya.’ Katika muktadha huu sitiari hiyo inaeleza kurejeshwa au kuimarishwa tena; ‘utarejeshwa’ ni ya asili kwa Kiswahili huku mbadala wa kihalisi ukiwekwa katika tanbihi.
- source_word: תַּרְחִיק
  choice: ukiondoa ... mbali
  rationale: Hifili ya רחק ina maana ya kusababisha kitu kiwe mbali. Muundo huu wa Kiswahili unahifadhi nguvu hiyo ya kisababishi na pia unaendeleza sharti la sentensi.
- source_word: עַוְלָה
  choice: udhalimu
  rationale: Neno hili linaweza kumaanisha dhuluma, uovu, kosa, au kutokuwa na haki. ‘Udhalimu’ linafaa kwa uzito wa kimaadili wa muktadha bila kulifinyanga kuwa kosa la aina moja tu.
- source_word: מֵאָהֳלֶךָ
  choice: mbali na hema lako
  rationale: Tafsiri hii inadumisha taswira halisi ya hema, ambayo pia inaweza kuwakilisha makao au nyumba ya mtu.
theological_decisions:
- issue: Iwapo sitiari ya kujengwa itafsiriwe kihalisi au kwa maana yake katika muktadha
  choice: utarejeshwa
  alternative: utajengwa; utajengwa upya
  rationale: ‘Utarejeshwa’ huwasilisha kwa Kiswahili cha kawaida maana ya kuanzishwa au kuwekwa tena katika hali njema, huku tanbihi ikihifadhi sitiari halisi na uwezekano wake wa kimaana.
- issue: Iwapo שוב itafsiriwe kama kurudi au kutubu
  choice: ukimrudia
  alternative: ukitubu; ukirudi kwa
  rationale: Maana ya msingi ya kitenzi ni kugeuka au kurudi. ‘Ukimrudia’ inadumisha mwelekeo wa mtu kwa Mungu na haifungi mapema maana katika istilahi maalumu ya kitheolojia.
- issue: Uhusiano wa kisharti wa kishazi cha pili
  choice: ukiondoa udhalimu mbali na hema lako
  alternative: na utaondoa udhalimu mbali na hema lako
  rationale: Umbo la kitenzi cha Kiebrania linaweza kusomwa kama mwendelezo wa sharti lililoanzishwa na אִם, ingawa pia linaweza kueleweka kama matokeo. Kiswahili kimedumisha usomaji wa kisharti bila kuongeza ‘kama’ mara ya pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mwenyezi’ ni cheo cha Mungu kinachoeleweka kwa urahisi; ‘hema lako’ limehifadhiwa badala ya kulainishwa kuwa ‘nyumba yako.’ Koma ya mwisho inadumisha hali ya sentensi inayoendelea katika mstari unaofuata.
