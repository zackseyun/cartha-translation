base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: sw
  text: Je, ni furaha kwa Mwenyezi kwamba wewe ni mwadilifu,[a] au ni faida kwake kwamba unazifanya njia zako kuwa bila lawama?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wewe uko katika haki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “unazifanya njia zako kuwa kamili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: ana furaha yoyote
  rationale: חֵפֶץ inaweza kumaanisha furaha, upendezwe, au tamaa. Katika swali hili la balagha, “ana furaha yoyote” ni Kiswahili cha kawaida kinachohifadhi wazo la kupendezwa.
- source_word: לְשַׁדַּי
  choice: Mwenyezi
  rationale: שַׁדַּי ni jina la Mungu linalotafsiriwa kwa kawaida kuwa “Mwenyezi,” hasa katika kitabu cha Ayubu.
- source_word: כִּי תִצְדָּק
  choice: kwa kuwa wewe ni mwadilifu
  rationale: Qal ya צדק hapa ina maana ya kuwa mwadilifu au kuwa katika haki, si kujihesabia haki.
- source_word: וְאִם
  choice: au
  rationale: Katika ulinganifu wa maswali mawili ya balagha, וְאִם huleta sehemu ya pili kwa maana ya “au.”
- source_word: בֶּצַע
  choice: faida yoyote
  rationale: בֶּצַע humaanisha faida au pato; “faida” huhifadhi taswira ya kunufaika.
- source_word: כִּי תַתֵּם
  choice: kwa wewe kuzifanya ... kuwa bila lawama
  rationale: Hiphil ya תמם ina maana ya kufanya kitu kiwe kamili au kisicho na lawama. Muundo huu unaonyesha kisababishi bila kupotosha maana ya kimaadili.
- source_word: דְּרָכֶיךָ
  choice: njia zako
  rationale: “Njia” huhifadhi sitiari ya Kiebrania inayorejelea mwenendo au namna ya kuishi.
- source_word: תַתֵּם דְּרָכֶיךָ
  choice: kuzifanya njia zako kuwa bila lawama
  rationale: Kirai hiki kinaeleza ukamilifu wa kimaadili wa mwenendo, huku kikihifadhi kwa kiasi cha kawaida muundo wa kisababishi wa Kiebrania.
theological_decisions:
- issue: Ikiwa mstari unadai kwamba uadilifu wa mwanadamu humletea Mungu manufaa ya asili
  choice: Maswali ya balagha yanaonyesha hoja ya Elifazi kwamba Mwenyezi hapati furaha yenye manufaa wala faida kutokana na uadilifu wa Ayubu.
  alternative: Kusisitiza tu kwamba Mungu hana uhitaji, bila kugusia ikiwa anapendezwa na uadilifu.
  rationale: Maneno ya Kiebrania חֵפֶץ na בֶּצַע yanahusu furaha/upendezwe na faida. Tafsiri inahifadhi nguvu ya hoja ya Elifazi bila kuifanya kuwa kauli ya jumla inayokanusha kwamba Mungu hupendezwa na haki katika sehemu nyingine za Maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali ya balagha na ulinganifu wa kishairi vimehifadhiwa; “njia zako” inadumisha sitiari ya Kiebrania.
