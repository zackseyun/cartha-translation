  source_fidelity: Tafsiri inahifadhi kwa uaminifu muundo wa mfululizo wa maafa unaoanzishwa na אוֹ (“au”), taswira ya חֹשֶׁךְ (“giza”) inayozuia kuona, na שִׁפְעַת מַיִם (“maji mengi/maji ya kufurika”) yanayomfunika mhusika. “Yakufunike” huhifadhi taswira ya kitenzi cha Kiebrania כסה, bila kuibadilisha kuwa tafsiri elekezi kama “yakushinde” au “yakugharikishe.”
