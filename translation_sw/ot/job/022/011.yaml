base_translation:
  language: en
  yaml_path: translation/ot/job/022/011.yaml
  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: sw
  text: 'au giza lisilokuruhusu kuona,

    na maji mengi yakufunike.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mafuriko yakufunike.” Kiebrania kinaweza kudokeza maji yanayofurika, lakini matini kuu inadumisha maana pana ya “maji mengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi hiki kinatambulisha kwa ufupi janga jingine katika maelezo ya Elifazi; “au” kinahifadhi nguvu hiyo bila kuongeza maana.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Neno hili humaanisha giza halisi au la kitamathali; “giza” ni la moja kwa moja na linafaa kwa picha ya kutoweza kuona.
- source_word: לֹא תִרְאֶה
  choice: lisilokuruhusu kuona
  rationale: Kiebrania ni, kihalisi, “huoni.” Muundo huu wa Kiswahili unaunganisha kishazi na “giza” kwa ufasaha huku ukionyesha matokeo yake bila kufafanua zaidi ya muktadha.
- source_word: וְשִׁפְעַת
  choice: na maji mengi
  rationale: שִׁפְעָה huonyesha wingi au kufurika. “Maji mengi” huhifadhi maana pana ya wingi bila kuamua kwamba ni lazima yawe mafuriko.
- source_word: מַיִם
  choice: maji
  rationale: Katika Kiswahili “maji” ni nomino ya kawaida ya wingi na huhifadhi picha ya kishairi kwa njia ya asili.
- source_word: תְּכַסֶּךָּ
  choice: yakufunike
  rationale: Kitenzi כסה katika Piel humaanisha kufunika. “Yakufunike” ni tafsiri ya wazi inayohifadhi taswira, badala ya kuitafsiri moja kwa moja kuwa kushinda au kugharikisha.
