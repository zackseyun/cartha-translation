base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: sw
  text: Atamwokoa hata mtu mwenye hatia[a]; naye ataokolewa kwa usafi wa mikono yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Humwokoa mtu asiye na hatia.” Kiebrania cha kishazi cha kwanza ni kigumu, na wengine hukielewa tofauti.
    reason: alternative_reading
  - marker: b
    text: Kwa maneno halisi, “kwa usafi wa mikono yako”; ni nahau ya kutokuwa na hatia au usafi wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: ataokolewa
  rationale: Piel ya מלט humaanisha kusababisha mtu aponyoke au kumwokoa. Kauli tendwa ya Kiswahili inasikika kwa kawaida hapa na kudumisha ulinganifu na kitenzi cha mstari wa pili.
- source_word: אִי נָקִי
  choice: hata mtu asiye na hatia
  rationale: Ingawa Kiebrania ni kigumu, usemi huu umechukuliwa katika maana ya kimapokeo ya mtu asiye na hatia, huku ‘hata’ ikionyesha kuwa wokovu unamfikia mtu huyo pia. Uwezekano wa ‘mtu asiye na hatia’ kwa maana ya mtu mwenye hatia umeelezwa katika tanbihi kwa sababu muundo unaweza kueleweka tofauti.
- source_word: נָקִי
  choice: asiye na hatia
  rationale: נָקִי huonyesha kutokuwa na hatia au kuwa safi kimaadili/kisheria; ‘asiye na hatia’ ni wazi na wa kawaida katika Kiswahili.
- source_word: וְנִמְלַט
  choice: ataokolewa
  rationale: Nifali ya מלט inaweza kumaanisha ‘kuokolewa’ au ‘kuponyoka.’ ‘Ataokolewa’ inadumisha ulinganifu wa vishazi na wazo la kuokolewa kwa njia ya usafi wa mikono ya msemaji anayeambiwa.
- source_word: בְּבֹר
  choice: kwa usafi
  rationale: בֹּר hapa inaeleweka kuwa usafi, na בְּ inaonyesha chombo au njia; ‘kwa usafi’ ni usemi wa asili wa Kiswahili.
- source_word: כַּפֶּיךָ
  choice: wa mikono yako
  rationale: Ingawa neno linaweza kumaanisha viganja, katika usemi huu ‘mikono’ ni tafsiri ya kawaida na inaashiria matendo na uadilifu wa mtu.
theological_decisions:
- issue: Maana ya kishazi cha kwanza cha aya
  choice: Mungu anaweza kumwokoa hata mtu asiye na hatia, yaani katika muktadha mtu ambaye si safi au hana uadilifu, kwa sababu ya usafi wa mikono ya Ayubu.
  alternative: Mungu humwokoa mtu asiye na hatia.
  rationale: Muundo wa Kiebrania una utata mkubwa. Tafsiri kuu inafuata uelewa wa kimapokeo unaoona אִי kama yenye nguvu ya ukanushi na kudumisha mvutano wa kwamba mtu mwingine anaokolewa kwa usafi wa mikono ya Ayubu. Tanbihi inahifadhi uwezekano wa kusoma kishazi hicho kuwa ‘mtu asiye na hatia’ kwa maana ya mtu mwadilifu, bila kuingiza fundisho pana zaidi la maombezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Ulinganifu wa vishazi umehifadhiwa, na utata halisi wa Kiebrania umeonyeshwa kwa tanbihi.
