base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: sw
  text: Je, Mungu hayuko juu mbinguni[a]? Tazama nyota zilizo juu kabisa[b], jinsi zilivyo juu sana!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kimo cha mbingu.” Kirai cha Kiebrania kwa tafsiri ya neno kwa neno ni “kimo cha mbingu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “kilele cha nyota”; maana yake hapa ni nyota zilizo juu kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... hayuko
  rationale: Huanzisha swali la balagha linalotarajia kukubaliwa. Muundo wa “Je, ... hayuko” unahifadhi nguvu ya swali bila kuongeza msisitizo usio wazi katika Kiebrania.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Ni neno la umoja linalomtaja Mungu; “Mungu” ndilo sawia la kawaida na lisilo na nyongeza ya kimafundisho.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: juu mbinguni
  rationale: Kirai hiki kwa maana ya msingi ni “kimo cha mbingu.” “Juu mbinguni” ni Kiswahili cha kawaida kinachohifadhi taswira ya mahali palipo juu; tafsiri ya karibu zaidi imewekwa katika tanbihi.
- source_word: וּרְאֵה
  choice: Tazama
  rationale: Kitenzi ni amri ya kuona au kutazama. “Tazama” ni ya heshima, ya sasa, na inafaa kwa mwito wa kuangalia unaotumika hapa.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: nyota zilizo juu kabisa
  rationale: רֹאשׁ kwa msingi ni “kichwa” au “kilele,” lakini hapa inaonyesha sehemu ya juu kabisa ya nyota. Tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi taswira halisi.
- source_word: כִּי
  choice: jinsi
  rationale: Hapa כִּי huanzisha mshangao au uchunguzi kuhusu kimo cha nyota. “Jinsi” huwasilisha kwa kawaida maana ya “jinsi zilivyo juu.”
- source_word: רָמּוּ
  choice: zilivyo juu sana
  rationale: Kitenzi רום humaanisha kuwa juu au kuinuka. Katika muktadha wa nyota, “juu sana” huhifadhi maana ya kimo cha kimahali bila kuingiza wazo la heshima au kutukuzwa.
theological_decisions:
- issue: Ikiwa maneno haya yaelezwe kama fundisho pana kuhusu Mungu kuwa mbali, au yahifadhiwe kama swali la balagha katika hotuba ya Elifazi
  choice: Swali la balagha limetafsiriwa moja kwa moja, likihifadhi taswira ya Mungu kuwa juu mbinguni na ya nyota zilizo juu sana.
  alternative: Kufafanua kwamba Mungu yuko mbali na wanadamu, au kuongeza ukosoaji wa Elifazi dhidi ya Ayubu.
  rationale: Kiebrania chenyewe kinatoa taswira ya kimahali ndani ya swali la balagha, lakini hakisemi wazi hitimisho pana la kitheolojia. Tafsiri haipaswi kutatua mvutano huo kwa kuongeza maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye heshima. “Juu mbinguni” na “nyota zilizo juu kabisa” ni miundo ya kawaida kwa msomaji wa leo, huku tanbihi zikihifadhi maumbo halisi ya Kiebrania.
