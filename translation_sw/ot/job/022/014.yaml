  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: sw
  text: Mawingu mazito ni kifuniko kwake, wala haoni; naye hutembea juu ya kuba ya mbingu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָבִים
  choice: Mawingu mazito
  rationale: Nomino ya wingi inaweza kumaanisha mawingu, hasa mawingu mazito ya mvua. Kivumishi “mazito” kinadhihirisha nguvu ya picha ya kitu kinachoficha bila kupotosha maana.
- source_word: סֵתֶר
  choice: kificho
  rationale: Neno hili huonyesha mahali au kitu cha kujisitiri na kufichika. “Kificho” ni la kawaida na linafaa kwa mawingu yanayodhaniwa kumzuia asione.
- source_word: לוֹ
  choice: kwake
  rationale: Kiambishi hiki kinaonyesha kwamba mawingu yanatumika kama kificho kuhusiana naye. “Kwake” huhifadhi ufupi wa Kiebrania na ni Kiswahili cha kawaida.
- source_word: וְלֹא יִרְאֶה
  choice: wala haoni
  rationale: Kiebrania kinaunganisha sentensi kwa uratibu, “na si/haoni.” “Wala haoni” huhifadhi uratibu huo badala ya kuamua kwamba ni sentensi ya matokeo.
- source_word: חוּג
  choice: kuba
  rationale: Neno hili laweza kumaanisha duara au uso uliopinda. “Kuba ya mbingu” huwasilisha picha ya anga lililopinda bila kuibadili kuwa maelezo ya kisayansi.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: “Mbingu” ndilo neno la kawaida na lenye hadhi kwa שָׁמַיִם katika Kiswahili, na linafaa katika kirai “kuba ya mbingu.”
- source_word: יִתְהַלָּךְ
  choice: hutembea
  rationale: Umbo la kitenzi linaweza kuonyesha kutembea huku na huku. “Hutembea” hudumisha picha hiyo kwa lugha ya kawaida bila kuongeza wazo lisilotajwa wazi.
theological_decisions:
- issue: Mtazamo wa msemaji na kiima kinachodokezwa
  choice: Kiwakilishi cha nafsi ya tatu “-” katika “haoni” na kiima kilichomo katika “hutembea” vimeachwa vimrejelee Mungu kutokana na muktadha, bila kuingiza jina “Mungu” katika mstari.
  alternative: Kutaja wazi “Mungu” au kuufanya mstari kuwa kauli huru kuhusu ukuu wake.
  rationale: Katika Ayubu 22:13–14, Elifazi anasimulia madai anayowahusisha waovu kuhusu Mungu. Kudumisha viwakilishi huhifadhi mtiririko na mvutano wa hotuba ya asili.
- issue: Uhusiano wa kificho na kutokuona
  choice: “wala haoni” limetafsiriwa kama kishazi kilichoratibiwa.
  alternative: “hivyo haoni” au “ili asione,” kama kishazi cha matokeo.
  rationale: וְ inaweza kuruhusu maana ya matokeo, lakini maandishi yana uratibu wa moja kwa moja. Tafsiri hii haiamui kwa lazima uhusiano ambao Kiebrania kimeuacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa kishairi na picha ya kale ya “kuba ya mbingu,” huku “wala haoni” ikihifadhi uratibu na utata halisi wa Kiebrania.
