  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: sw
  text: Kwa maana ndipo utakapojifurahisha katika Mwenyezi,[a] na utainua uso wako kuelekea Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utapata furaha katika Mwenyezi.”
    reason: lexical_alternative
  - marker: b
    text: “Kuinua uso wako kuelekea Mungu” ni nahau inayoweza kudokeza kumkaribia Mungu kwa ujasiri, kurejeshewa kibali, au kusali kwa uthabiti.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: Kwa maana ndipo
  rationale: Muunganiko huu unaonyesha matokeo yanayofuata masharti ya mawaidha yaliyotangulia; “ndipo” huwasilisha kwa kawaida uhusiano wa wakati na matokeo.
- source_word: עַל שַׁדַּי
  choice: katika Mwenyezi
  rationale: Kihusishi עַל pamoja na התענג humtaja yule ambaye mtu hupata furaha kwake. “Katika Mwenyezi” huhifadhi uhusiano huo bila kuacha cheo cha Mungu שַׁדַּי bila kufasiriwa.
- source_word: תִּתְעַנָּג
  choice: utakapofurahia
  rationale: Kitenzi cha Hitpael kinaeleza kupata au kujifurahisha sana; “kufurahia” ni Kiswahili cha sasa na cha kawaida kinachowasilisha hali hiyo.
- source_word: וְתִשָּׂא ... פָּנֶיךָ
  choice: na utainua uso wako
  rationale: Tafsiri hii huhifadhi picha halisi ya kuinua uso na pia huacha wazi maana zake za kimuktadha, kama kumkaribia Mungu kwa ujasiri au kurejeshewa kibali.
- source_word: אֶל אֱלוֹהַּ
  choice: kumwelekea Mungu
  rationale: אֶל huonyesha mwelekeo. “Kumwelekea Mungu” ni ya asili zaidi katika Kiswahili ndani ya tamathali ya kuinua uso kuliko “kwa Mungu,” huku אֱלוֹהַּ ikitafsiriwa moja kwa moja kuwa “Mungu.”
theological_decisions:
- issue: Maana ya nahau “kuinua uso kumwelekea Mungu”
  choice: Kuhifadhi picha halisi ya kuinua uso kumwelekea Mungu.
  alternative: Kumwomba Mungu kwa ujasiri; kumtazama Mungu; kusimama mbele za Mungu bila aibu.
  rationale: Nahau ya Kiebrania inaweza kuashiria kumkaribia Mungu kwa ujasiri, kurejeshewa kibali, au kusali kwa uthabiti. Kutopambanua maana moja pekee huhifadhi mvutano wa kishairi na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mwenyezi” limetumiwa kama cheo cha Mungu, na nahau ya uso imehifadhiwa badala ya kufafanuliwa ndani ya mstari.
