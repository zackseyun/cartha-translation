translation:
  language: sw
  text: Jinsi[a] ulivyomshauri mtu asiye na hekima, na ulivyofunua busara thabiti kwa wingi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ulimpa shauri gani mtu asiye na hekima, na uliifanya busara thabiti ijulikane kwa wingi kiasi gani!” Neno la Kiebrania la mwanzo linaweza kutafsiriwa “nini” au “jinsi”; maandishi yametumia mshangao ili kuonyesha kejeli ya Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Jinsi
  rationale: Katika muktadha huu neno linaanzisha mshangao wa kejeli, si swali la kawaida; “Jinsi ulivyo...” huwasilisha nguvu hiyo kwa Kiswahili cha asili.
- source_word: יָּעַצְתָּ
  choice: ulivyomshauri
  rationale: Kitenzi יעץ humaanisha kutoa shauri; “kumshauri” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְלֹא חָכְמָה
  choice: mtu asiye na hekima
  rationale: Muundo huu unaonyesha anayekosa hekima bila kumtaja wazi; “mtu” huifanya sentensi iwe ya kawaida kwa Kiswahili bila kubainisha mhusika kupita chanzo.
- source_word: חָכְמָה
  choice: hekima
  rationale: Hili ndilo neno la kawaida katika fasihi ya hekima na linahifadhi tofauti yake na תושיה katika nusu ya pili.
- source_word: וְתוּשִׁיָּה
  choice: busara thabiti
  rationale: תושיה huonyesha hekima au uamuzi wenye msingi na uwezo wa kutenda; “busara thabiti” huhifadhi maana hiyo bila kuipunguza kuwa mafanikio pekee.
- source_word: לָרֹב
  choice: kwa wingi
  rationale: Kirai hiki huonyesha kiwango kikubwa cha kile kilichofunuliwa na pia kuimarisha kejeli ya Ayubu.
- source_word: הוֹדָעְתָּ
  choice: kufunua
  rationale: Hifili ya ידע ni kufanya jambo lijulikane. “Kufunua” ni ya kawaida katika sentensi hii na haisisitizi ufunuo wa kiungu.
