translation:
  language: sw
  text: Jinsi ulivyemsaidia asiye na nguvu! Jinsi ulivyouokoa mkono usio na nguvu![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kiebrania kwa ukaribu zaidi, “Umemsaidia nini asiye na nguvu? Umeuokoa nini—mkono usio na nguvu?” Kiebrania kina kejeli kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה
  choice: Jinsi
  rationale: Katika maswali haya ya balagha, neno hili lina nguvu ya mshangao wa kejeli, ‘jinsi gani!’; ‘Jinsi’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: עָזַרְתָּ
  choice: ulivyemsaidia
  rationale: Kitenzi עזר humaanisha ‘kusaidia’; umbo hili linaendana na mshangao ‘Jinsi ulivyemsaidia...’ na kuhifadhi usemi wa moja kwa moja kwa Bildadi.
- source_word: לְלֹא כֹחַ
  choice: asiye na nguvu
  rationale: Kirai hiki humaanisha mtu asiye na nguvu. Tafsiri ya umoja inafuata usemi wa Kiebrania na inasikika kwa kawaida kwa Kiswahili.
- source_word: הוֹשַׁעְתָּ
  choice: ulivyouokoa
  rationale: Mzizi ישׁע una maana ya kuokoa au kukomboa; ‘kuokoa’ huhifadhi ulinganifu wa kejeli na ‘kusaidia’.
- source_word: זְרוֹעַ
  choice: mkono
  rationale: Neno hili kwa halisi ni ‘mkono’, picha ya kishairi ya nguvu. Taswira hiyo imehifadhiwa badala ya kufafanuliwa kuwa ‘nguvu’.
- source_word: לֹא עֹז
  choice: usio na uwezo
  rationale: עֹז ni nguvu au uwezo. ‘Usio na uwezo’ huepuka urudiaji mzito wa ‘nguvu’ huku ikihifadhi maana na ulinganifu wa kishairi.
theological_decisions:
- issue: Kejeli ya maswali ya Ayubu
  choice: 'Kutumia sentensi za mshangao: ‘Jinsi ...!’'
  alternative: 'Maswali halisi: ‘Umemsaidia nini ...?’'
  rationale: מֶה inaweza kusomwa kwa hali ya kuuliza kwa ukaribu zaidi na umbo la maneno, lakini katika muktadha usemi ni wa kejeli kali. Sentensi za mshangao huwasilisha kazi hiyo bila kuondoa uwezekano wa muundo halisi, ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Taswira ya ‘mkono’ imehifadhiwa, na kejeli imewasilishwa kwa mshangao bila kuifanya sentensi kuwa maelezo ya kawaida.
