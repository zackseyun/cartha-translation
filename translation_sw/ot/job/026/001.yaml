- source_word: וַ
  choice: Ndipo
  rationale: Waw ya mwanzo inaendeleza simulizi na kuonyesha mfuatano. “Ndipo” ni ya asili katika Kiswahili na huunganisha jibu hili na hotuba iliyotangulia.
