  text: הָ/רְפָאִ֥ים יְחוֹלָ֑לוּ מִ/תַּ֥חַת מַ֝֗יִם וְ/שֹׁכְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: sw
  text: Roho za waliokufa hutetemeka chini ya maji[a], pamoja na wale wanaokaa humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wafu hujikunyata kwa maumivu chini ya maji.” Neno la Kiebrania רְפָאִים linaweza kumaanisha “wafu” au “roho za waliokufa,” na יְחוֹלָלוּ linaweza pia kutafsiriwa “hujikunyata kwa maumivu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: Roho za waliokufa
  rationale: Katika muktadha huu wa kishairi, neno hilo linamaanisha waliokufa walio katika ulimwengu wa chini, si Warefai kama kabila la kale. Kauli hii inaonyesha maana ya viumbe waliokufa bila kutumia neno lisiloeleweka kwa urahisi kama ‘vivuli.’
- source_word: יְחוֹלָלוּ
  choice: hutetemeka
  rationale: Kitenzi kinaweza kueleza kutetemeka, kujikunyata kwa maumivu, au uchungu wa kuzaa. ‘Hutetemeka’ kinafaa kwa taswira ya hofu mbele za Mungu huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
- source_word: מִתַּחַת מַיִם
  choice: chini ya maji
  rationale: Hii ni kauli ya kawaida na ya asili katika Kiswahili inayoendeleza taswira ya mahali palipo chini ya maji.
- source_word: וְשֹׁכְנֵיהֶם
  choice: pamoja na wale wanaokaa humo
  rationale: Kiambishi cha umilikaji kinaelekea kurejelea maji. ‘Humo’ huhifadhi rejeleo hilo bila kufafanua zaidi utambulisho wa wakazi hao.
theological_decisions:
- issue: Rejeleo la רְפָאִים
  choice: roho za waliokufa katika ulimwengu wa chini
  alternative: Warefai, yaani watu wa kale
  rationale: Muktadha wa kishairi unaeleza mamlaka ya Mungu juu ya maeneo ya ulimwengu na ya wafu; kwa hiyo maana ya waliokufa inafaa kuliko jina la kabila.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Roho za waliokufa’ huepuka maana potovu ya Warefai, na ‘pamoja na’ huonyesha kuwa kishazi cha mwisho kinashiriki kitendo cha kutetemeka.
