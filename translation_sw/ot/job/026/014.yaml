base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: sw
  text: Tazama, hayo ni kingo tu za njia zake[a], nasi tunachosikia kumhusu ni mnong’ono hafifu tu![b] Lakini ni nani anayeweza kuielewa ngurumo ya nguvu zake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu za nje za njia zake.” Kiebrania kinaonyesha kwamba ni sehemu za nje kabisa tu za yale Mungu anayofanya zinazozungumziwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ni fununu hafifu tu ya jambo tunayoisikia kumhusu.” Kirai cha Kiebrania ni adimu na kinakazia jinsi tunavyosikia machache sana yakilinganishwa na “ngurumo” ya nguvu zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Kihisishi hiki kinavuta fikira kwa msisitizo; “Tazama” ni cha heshima, wazi, na cha kawaida katika ushairi wa kibiblia.
- source_word: קְצוֹת
  choice: miisho tu
  rationale: Neno linaonyesha ncha au kingo za nje. “Miisho tu” linaonyesha kwamba yanayotajwa ni sehemu za nje kabisa za matendo ya Mungu, si ukamilifu wake.
- source_word: דְּרָכָיו
  choice: njia zake
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu namna Mungu anavyotenda bila kuibana iwe “kazi” pekee.
- source_word: שֵׁמֶץ דָּבָר
  choice: mnong’ono hafifu tu
  rationale: Kirai hiki adimu kinaonyesha kiasi kidogo sana na, katika muktadha huu, sauti isiyosikika vizuri. Tafsiri hii hudumisha taswira ya kusikia na utofautishaji wake na “ngurumo.”
- source_word: נִשְׁמַע בּוֹ
  choice: tunachosikia kumhusu
  rationale: 'Muundo umetafsiriwa kwa maana ya pamoja isiyoainisha mtendaji: wanadamu husikia machache tu kumhusu Mungu. “Kumhusu” inafaa kuliko “kutoka kwake” katika muktadha.'
- source_word: רַעַם גְּבוּרָתוֹ
  choice: ngurumo ya nguvu zake
  rationale: Huhifadhi taswira kuu ya sauti kubwa inayotofautishwa na mnong’ono na kuonyesha ukuu wa nguvu za Mungu.
- source_word: יִתְבּוֹנָן
  choice: anayeweza kuielewa
  rationale: Kitenzi kina maana ya kufahamu kwa makini; usemi huu ni wa kawaida na hudumisha swali la balagha kuhusu mipaka ya ufahamu wa mwanadamu.
theological_decisions:
- issue: Kiwango cha wanadamu kumjua Mungu katika lugha ya kishairi
  choice: Mstari unasema kwamba wanadamu huona miisho tu ya njia za Mungu na husikia habari hafifu tu kumhusu.
  alternative: Kauli inaweza kueleweka kwa upeo mwembamba zaidi kuwa inahusu hasa matendo ya Mungu katika uumbaji yaliyoorodheshwa katika muktadha.
  rationale: Muktadha wa karibu unataja matendo ya Mungu katika ulimwengu, huku utofautishaji wa miisho, mnong’ono, na ngurumo ukisisitiza mipaka ya ufahamu wa viumbe bila kutoa dai pana zaidi kuliko shairi lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Mnong’ono hafifu” na “ngurumo” vinahifadhi utofautishaji wa kisauti wa Kiebrania; mpangilio wa swali la mwisho umefanywa wa kawaida katika Kiswahili.
