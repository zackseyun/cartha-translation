base_translation:
  language: en
  yaml_path: translation/ot/job/026/007.yaml
  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: sw
  text: Huitandaza kaskazini juu ya utupu[a][b]; huitundika dunia pasipo kitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anga la kaskazini.” Kiebrania kinasema tu “kaskazini,” ambayo katika muktadha huu wa kishairi huenda ikarejelea mbingu za kaskazini.
    reason: lexical_alternative
  - marker: b
    text: Au, “hali isiyo na umbo.” Neno la Kiebrania linaweza kumaanisha utupu, ukiwa, au hali isiyo na umbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: huitandaza
  rationale: Kitenzi hiki katika umbo la sifa tendaji kina maana ya kunyoosha au kutandaza; “huitandaza” ni cha asili katika Kiswahili na kinahifadhi taswira ya anga.
- source_word: צָפוֹן
  choice: kaskazini
  rationale: Nomino hiyo kwa kawaida humaanisha “kaskazini.” Katika muktadha huu wa kishairi inaweza kumaanisha anga la kaskazini, lakini tafsiri ya moja kwa moja inahifadhi uwezekano huo bila kuufanya kuwa wa lazima.
- source_word: תֹּהוּ
  choice: utupu
  rationale: Neno hili linaweza kumaanisha hali ya kutokuwa na kitu, ukiwa, au hali isiyo na umbo. “Utupu” ni wazi na linahifadhi taswira ya ombwe.
- source_word: תֹּלֶה
  choice: huitundika
  rationale: Kitenzi hiki humaanisha kutundika au kuning’iniza; “huitundika” kinatoa taswira hiyo moja kwa moja.
- source_word: אֶרֶץ
  choice: dunia
  rationale: Katika muktadha huu wa ulimwengu mzima, neno hilo linarejelea dunia, si nchi fulani.
- source_word: בְּלִי מָה
  choice: pasipo kitu
  rationale: Kirai hiki humaanisha bila kitu chochote. “Pasipo kitu” ni Kiswahili cha kawaida kinachohifadhi maana hiyo pamoja na uhusiano wa עַל.
- source_word: עַל
  choice: juu ya / pasipo
  rationale: Katika kishazi cha kwanza “juu ya” kinahifadhi maana ya mahali; katika cha pili, muundo wa Kiswahili “huitundika dunia pasipo kitu” unawasilisha kwa asili wazo la kutokuwa na tegemeo lolote.
theological_decisions:
- issue: Taswira ya ulimwengu
  choice: Kutafsiri mstari kama maelezo ya kishairi kuhusu mamlaka ya Mungu juu ya uumbaji bila kuingiza madai ya kisayansi ya kisasa.
  alternative: Kuuchukulia kuwa taarifa sahihi ya kisayansi kuhusu dunia iliyoning’inia angani, au kutafsiri “kaskazini” waziwazi kama rejeo la kimitholojia.
  rationale: Haya ni mashairi ya hekima yanayoeleza uwezo wa Mungu juu ya ulimwengu. Tafsiri inahifadhi taswira ya Kiebrania bila kuipunguza kuwa sitiari tupu wala kuibebesha madai yasiyotajwa.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa viashiria [a][b] umewekwa mara tu baada ya “utupu” kwa sababu tanbihi zote mbili zinafafanua maneno tofauti katika kishazi hicho: [a] “kaskazini” na [b] “utupu.”'
