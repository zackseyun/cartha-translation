lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: Kwa nguvu zake
  rationale: Muundo wa ב pamoja na כֹּחַ unaonyesha njia au chombo cha kutenda; “kwa nguvu zake” ni Kiswahili cha kawaida na kinadumisha upeo wa kiulimwengu wa mstari huu.
- source_word: רָגַע
  choice: aliituliza
  rationale: Katika muktadha wa bahari, kitenzi kinaeleweka kuwa kuifanya itulie. Tafsiri hii pia inadumisha picha ya Mungu akiyatiisha machafuko, bila kuifanya bahari kuwa kiumbe kwa lazima.
- source_word: הַיָּם
  choice: bahari
  rationale: Hii ndiyo maana ya kawaida ya יָם, huku ikiruhusu pia mwangwi wa kishairi wa bahari kama nguvu ya machafuko.
- source_word: וּבִתְבוּנָתוֹ
  choice: na kwa ufahamu wake
  rationale: תְּבוּנָה humaanisha ufahamu, umaizi, au utambuzi. “Ufahamu” ni neno la asili na linaloeleweka ambalo linahifadhi dhamira ya hekima katika Ayubu.
- source_word: מָחַץ
  choice: alimponda
  rationale: Kitenzi hiki huonyesha tendo lenye nguvu la kuponda au kuvunja. “Alimponda” ni cha kishairi, wazi, na kinaonyesha kushindwa kabisa kwa mpinzani.
- source_word: רָהַב
  choice: Rahabu
  rationale: Hapa neno linaeleweka vizuri zaidi kuwa jina la kishairi la nguvu au kiumbe cha machafuko, si Rahabu mwanamke wa Yeriko. Kutumia jina “Rahabu” kunahifadhi taswira ya Kiebrania, huku tanbihi ikifafanua maana inayowezekana.
theological_decisions:
- issue: Iwapo רָהַב itafsiriwe kama jina maalumu au kama nomino ya kawaida
  choice: Jina maalumu “Rahabu,” likimaanisha kwa ushairi nguvu au kiumbe cha machafuko kinachotiishwa na Mungu
  alternative: “jitu la baharini” au “kiburi”
  rationale: Muktadha wa kishairi na wa kiulimwengu katika Ayubu unaonyesha mpinzani anayewakilisha machafuko. Kulihifadhi kama jina hakufungi maana katika fasiri moja tu; tanbihi huwapa wasomaji ufafanuzi na tafsiri mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini wa sasa na unaoeleweka. Mpangilio sambamba wa “Kwa nguvu zake … na kwa ufahamu wake …” umehifadhiwa. Jina Rahabu limeandikwa kwa umbo linalotumika kawaida katika Kiswahili cha Biblia.
