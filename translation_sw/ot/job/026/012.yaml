  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: sw
  text: Kwa nguvu zake aliituliza bahari,[b] na kwa ufahamu wake alimponda Rahabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahabu ni jina la kishairi la nguvu ya machafuko au jitu la baharini linalompinga Mungu; au neno hili linaweza kutafsiriwa kwa ufafanuzi kuwa “jitu la baharini.”
