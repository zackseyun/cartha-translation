  yaml_path: translation/ot/job/026/011.yaml
  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: sw
  text: 'Nguzo za mbingu zinatetemeka[a],

    nazo zinastaajabu[b] kwa karipio lake.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zinatikisika.”
    reason: lexical_alternative
  - marker: b
    text: Au “zinapigwa na butwaa” / “zinashangaa.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kutoka kwa karipio lake”; maana inaweza pia kuwa “kwa sababu ya karipio lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: Nguzo za mbingu
  rationale: Huhifadhi taswira ya kishairi ya nguzo zinazohusishwa na mbingu bila kuifafanua kuwa milima au misingi, wala kuifanya maelezo ya moja kwa moja ya muundo wa ulimwengu.
- source_word: יְרוֹפָפוּ
  choice: zinatetemeka
  rationale: Kitenzi רפף huonyesha kutikisika au kutetemeka. “Zinatetemeka” ni Kiswahili cha kawaida na chenye nguvu kinachohifadhi mwendo na hali ya hofu au kustaajabu.
- source_word: וְיִתְמְהוּ
  choice: na zinashangazwa
  rationale: Kitenzi תמהּ huonyesha mshangao mkubwa au kupigwa na butwaa. “Zinashangazwa” huhifadhi mwitikio wa kustaajabu bila kuingiza wazo la kuchukizwa kimaadili.
- source_word: מִגַּעֲרָתוֹ
  choice: na karipio lake
  rationale: Kihusishi מִן kinaweza kuonyesha chanzo au sababu. Katika Kiswahili, “na karipio lake” hutoa kwa kawaida maana ya kuitikia karipio hilo huku maelezo ya chini yakihifadhi uwezekano wa “kwa sababu ya karipio lake.”
theological_decisions:
- issue: Taswira ya ulimwengu ya “nguzo za mbingu”
  choice: Kudumisha taswira ya kishairi ya ulimwengu bila kuiondoa fumbo wala kuifanya maelezo halisi ya kisayansi.
  alternative: Kuitafsiri kuwa milima, misingi ya mbingu, au maelezo halisi ya kosmolojia ya kale.
  rationale: Ushairi wa Ayubu hutumia taswira hai ya ulimwengu. Tafsiri inapaswa kuhifadhi taswira ya Kiebrania bila kuifafanua kupita kiasi au kuibadili ili ilingane na mtazamo wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari unadumisha usambamba wa ushairi wa Kiebrania; viwakilishi vya ngeli vinaonyesha uhuishaji wa kishairi wa nguzo.
