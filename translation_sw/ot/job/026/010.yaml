  language: sw
  text: Amechora duara juu ya uso wa maji[a], kwenye mpaka wa nuru na giza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ameweka mpaka juu ya uso wa maji, kwenye kikomo ambapo nuru hukutana na giza.”
