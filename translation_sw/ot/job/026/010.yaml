lexical_decisions:
- source_word: חֹק חָג
  choice: amechora duara
  rationale: Muunganiko huu unaonyesha tendo la kuweka au kuchora mpaka wa mviringo. “Amechora duara” huhifadhi taswira halisi ya mstari wa mviringo bila kuifanya kuwa amri ya kidhahania.
- source_word: עַל פְּנֵי מָיִם
  choice: juu ya uso wa maji
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha taswira ya mahali iliyo katika neno פְּנֵי, yaani uso wa maji.
- source_word: עַד תַּכְלִית
  choice: kwenye mpaka
  rationale: Kirai hiki kinaeleza kikomo au mwisho unaofikiwa. “Kwenye mpaka” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: wa nuru na giza
  rationale: Kiebrania kinasema kihalisi “nuru pamoja na giza.” Tafsiri hii inadumisha uhusiano wenye utata kiasi kati ya hali hizo mbili, huku muktadha ukidokeza mpaka zinapokutana.
