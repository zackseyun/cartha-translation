lexical_decisions:
- source_word: עָרוֹם
  choice: iko uchi
  rationale: Kivumishi hiki humaanisha kuwa uchi au kutofunikwa. “Iko uchi” inadumisha picha hai ya kishairi na ulinganifu wake na “kifuniko” katika mstari wa pili.
- source_word: שְׁאוֹל
  choice: Kuzimu
  rationale: “Kuzimu” ni neno la kawaida la Kiswahili kwa makao ya wafu na hapa linahifadhi wazo la eneo lililofichika la wafu bila kulipunguza kuwa kaburi moja tu.
- source_word: נֶגְדּוֹ
  choice: mbele yake
  rationale: Hili ni tafsiri ya moja kwa moja ya maana ya kuwa mbele au katika uwepo wa mtu; katika muktadha kiwakilishi kinamrejelea Mungu.
- source_word: אֵין
  choice: haina
  rationale: Muundo wa Kiswahili “haina kifuniko” ni wa kawaida na unawakilisha kwa usahihi kutokuwapo kwa kifuniko.
- source_word: כְּסוּת
  choice: kifuniko
  rationale: Neno hili humaanisha kitu cha kufunika. “Kifuniko” kinadumisha sitiari inayolingana na “uchi” katika sehemu ya kwanza.
- source_word: אֲבַדּוֹן
  choice: Abadoni
  rationale: Utohozi huu unahifadhi matumizi ya neno kama jina la kishairi la eneo au nguvu ya maangamizi, sambamba na Kuzimu, huku tanbihi ikitoa maana yake ya kileksika.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha nafsi ya tatu umoja katika נֶגְדּוֹ
  choice: Kimewasilishwa kwa “mbele yake,” kikimrejelea Mungu kwa mujibu wa muktadha.
  alternative: Kukichukulia kuwa kinamrejelea mtazamaji asiyetajwa moja kwa moja.
  rationale: Muktadha unaeleza ujuzi na mamlaka ya Mungu juu ya maeneo yaliyofichika. Hata hivyo, “mbele yake” haiongezi jina la Mungu ambalo halipo katika mstari wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi, wenye heshima na picha ya kishairi. “Nayo” inaunganisha mistari miwili kwa kawaida huku ikidumisha ulinganifu wa Kiebrania.
