  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: sw
  text: Kwa pumzi yake[a] mbingu zimepambwa; mkono wake umemtoboa[b] nyoka anayetoroka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa Roho yake,” au “Kwa upepo wake.” Neno la Kiebrania linaweza kumaanisha pumzi, upepo, au roho.
    reason: lexical_alternative
  - marker: b
    text: Au, “mkono wake umemwumba nyoka anayetoroka.” Kitenzi cha Kiebrania kinaweza kueleweka kwa njia tofauti, ingawa “umemtoboa” kinafaa zaidi na taswira ya mapambano katika mstari huu.
    reason: alternative_reading
  - marker: c
    text: Huenda “nyoka anayetoroka” hurejelea taswira ya kishairi ya nyoka wa vurugu za ulimwengu; linganisha Isaya 27:1.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: Kwa pumzi yake
  rationale: 'Neno רוּחַ linaweza kumaanisha pumzi, upepo, au roho. Katika ushairi huu, “pumzi” inadumisha taswira halisi ya nguvu ya Mungu ya kuumba bila kulazimisha maana ya nafsi tofauti; בְּ inaonyesha chombo au njia: “kwa/kupitia.”'
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: “Mbingu” ni tafsiri ya kawaida na yenye hadhi katika muktadha wa ushairi wa ulimwengu; inafaa zaidi hapa kuliko “anga” pekee.
- source_word: שִׁפְרָה
  choice: zikawa maridadi
  rationale: Kitenzi שׁפר kinaonyesha uzuri, uangavu, au hali ya kupambika. “Zikawa maridadi” kinaonyesha matokeo ya tendo la Mungu huku kikidumisha lugha ya kishairi inayoeleweka.
- source_word: חֹלֲלָה
  choice: ukamtoboa
  rationale: Katika matumizi haya ya kishairi, חול inaweza kueleweka kuwa kutoboa, kuumba, kuzaa, au kujipinda. Mkono wa Mungu ukiwa mtendaji na nyoka akiwa mtendwa, “ukamtoboa” inafaa vizuri na taswira ya mapambano, huku uwezekano wa “kuumba” ukihifadhiwa katika tanbihi.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Tafsiri ya moja kwa moja inayodumisha taswira ya mkono kama ishara ya nguvu inayotenda.
- source_word: נָחָשׁ בָּרִיחַ
  choice: nyoka anayekimbia
  rationale: בָּרִיחַ inaweza kueleza kukimbia, kuteleza kwa kasi, au kujinyoosha. “Anayekimbia” ni maana inayotetewa vizuri katika taswira ya mapambano ya ulimwengu na inalingana na usemi wa Isaya 27:1 bila kumtambulisha nyoka kwa jina lisilotajwa hapa.
theological_decisions:
- issue: Iwapo רוּחַ itafsiriwe “Roho” kwa namna inayodokeza wazi nafsi tofauti ya Utatu
  choice: “Pumzi” imetumiwa katika matini kuu
  alternative: “Roho” au “upepo”
  rationale: Mstari unasema kishairi kuhusu nguvu ya Mungu ya kuumba. “Roho” inawezekana, lakini Kiebrania hapa hakilazimishi rejeo la wazi kwa nafsi tofauti. “Pumzi” inadumisha mvutano huo wa maana, na tafsiri nyingine zimewekwa katika tanbihi.
- issue: Iwapo נָחָשׁ בָּרִיחַ itambulishwe wazi kuwa Shetani au Leviathani
  choice: Taswira imehifadhiwa kama “nyoka anayekimbia”
  alternative: “Leviathani,” “nyoka wa vurugu za ulimwengu,” au “Shetani”
  rationale: Kiebrania kinatoa taswira ya kishairi ya mapambano ya ulimwengu, lakini mstari huu haumtambui nyoka wazi kuwa Shetani au kumwita Leviathani. Tafsiri haipaswi kutatua utambulisho huo zaidi ya matini yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na wa kishairi. “Maridadi” linaeleweka kwa urahisi na kuhifadhi wazo la uzuri au uangavu wa mbingu. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
