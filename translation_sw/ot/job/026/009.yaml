base_translation:
  language: en
  yaml_path: translation/ot/job/026/009.yaml
  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: sw
  text: Hufunika uso wa kiti chake cha enzi[a][b], akitandaza wingu lake juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hushika uso wa kiti chake cha enzi.” Kitenzi cha Kiebrania kinaweza kumaanisha kihalisi zaidi “kushika” au “kukamata,” lakini hapa huenda kinamaanisha kufunika au kusitiri.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “uso wa kiti chake cha enzi,” yaani sehemu yake inayoonekana au ya mbele.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: Hufunika
  rationale: Kitenzi kwa kawaida humaanisha ‘kushika’ au ‘kukamata,’ lakini katika ushairi huu wingu linalotandazwa juu ya kiti cha enzi linaonyesha tendo la kukisitiri au kukifunika. ‘Hufunika’ huwasilisha picha hiyo kwa Kiswahili cha kawaida huku tanbihi ikihifadhi maana ya msingi.
- source_word: פְּנֵי
  choice: uso wa
  rationale: Neno פָּנִים linaweza kumaanisha uso, sehemu ya mbele, au sehemu inayoonekana. ‘Uso wa’ huhifadhi taswira halisi ya Kiebrania bila kuwa ngumu kueleweka.
- source_word: כִסֵּה
  choice: kiti chake cha enzi
  rationale: Neno hili limetafsiriwa kuwa ‘kiti cha enzi.’ Ingawa umilikishi haujaonyeshwa moja kwa moja katika nomino hii, Mungu ndiye mtendaji anayedokezwa, na ‘wingu lake’ katika kipande kinachofuata linaunga mkono marejeo ya kiti chake.
- source_word: פַּרְשֵׁז
  choice: akitandaza
  rationale: Kitenzi kinaonyesha kutandaza au kunyoosha kitu. Muundo ‘akitandaza’ unaunganisha tendo hili na tendo la kwanza kwa mtiririko wa kishairi.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi tamati kinarejelea kwa kawaida kiti cha enzi; ‘juu yake’ huonyesha wazi uhusiano wa mahali huku Kiswahili kikirejelea nomino hiyo kwa njia ya asili.
- source_word: עֲנָנוֹ
  choice: wingu lake
  rationale: Nomino iko katika umoja na ina kiwakilishi cha umilikishi; ‘wingu lake’ huakisi muundo huo moja kwa moja.
theological_decisions:
- issue: Mtendaji aliyedokezwa na umilikishi wa kiti cha enzi
  choice: Mungu anaelezwa akifunika kiti chake cha enzi kwa wingu lake.
  alternative: Kusema ‘kiti cha enzi’ bila kukifanya wazi kuwa ni chake.
  rationale: Muktadha unamtaja Mungu kama mtendaji, na usemi ‘wingu lake’ unafanya marejeo hayo kuwa ya asili. Umilikishi huu unaweka wazi uhusiano unaodokezwa bila kuongeza dai la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. ‘Kiti cha enzi’ ni usemi wa kawaida na unaoeleweka kwa throne; ‘uso wa’ huhifadhi taswira ya Kiebrania, na ‘akitandaza’ hudumisha mwendo wa mstari.
