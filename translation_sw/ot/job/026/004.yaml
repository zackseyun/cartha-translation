translation:
  language: sw
  text: Umemwambia nani maneno, na pumzi[a] ya nani imetoka kwako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ya nani imetoka kwako?” Neno la Kiebrania linaweza kumaanisha “pumzi” au, katika baadhi ya miktadha, “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי
  choice: nani
  rationale: Katika muundo wa Kiswahili, kitenzi ‘tangazia’ humruhusu mlengwa kuonyeshwa moja kwa moja bila kihusishi; hivyo ‘umemtangazia nani’ huwasilisha maana ya ‘to whom’ kwa kawaida.
- source_word: הִגַּדְתָּ
  choice: umemtangazia
  rationale: Hifili ya נגד ina maana ya kutangaza, kueleza, au kujulisha. ‘Umemtangazia’ inadumisha nguvu ya swali la kejeli na sajili ya kishairi.
- source_word: מִלִּין
  choice: maneno hayo
  rationale: Nomino hii ya wingi yenye athari ya Kiaramu humaanisha maneno au matamshi. ‘Hayo’ husaidia Kiswahili cha kawaida kurejelea maneno ambayo Bildadi ametoka kusema bila kubadili kiini cha maana.
- source_word: וְנִשְׁמַת
  choice: na pumzi
  rationale: נשמה inaweza kumaanisha pumzi au, katika baadhi ya miktadha, roho. ‘Pumzi’ inadumisha taswira halisi ya kitu kinachotoka kwa msemaji.
- source_word: מִי
  choice: ya nani
  rationale: Hapa kiulizi kinaonyesha umilikaji kuhusiana na נשמה; ‘ya nani’ ndiyo namna ya kawaida ya Kiswahili ya kusema ‘whose’.
- source_word: יָצְאָה מִמֶּךָּ
  choice: imetoka kwako
  rationale: Tafsiri hii inadumisha sitiari halisi ya יצא, yaani kutoka, na inaeleweka kwa urahisi katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya נשמה
  choice: pumzi
  alternative: roho
  rationale: Muktadha wa maneno yanayotoka kwa msemaji unaunga mkono taswira halisi ya pumzi, lakini uwezekano wa ‘roho’ ni halisi na umehifadhiwa katika tanbihi badala ya kuamuliwa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Swali la kejeli limehifadhiwa, huku sintaksia ikibaki ya kawaida kwa msomaji wa leo.
