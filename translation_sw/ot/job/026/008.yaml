  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: sw
  text: Huyafunga maji ndani ya mawingu yake[a], lakini wingu halipasuki[b] chini ya hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawingu yake mazito”; neno la Kiebrania linaweza kusisitiza wingu zito au mkusanyiko mzito wa mawingu.
    reason: lexical_alternative
  - marker: b
    text: Au, “halipasuliwi”; neno la Kiebrania husema kwamba haligawanyiki au halifunguki kwa kupasuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרֵר
  choice: huyafunga
  rationale: Kitenzi hiki kinahifadhi taswira ya kuyazuia au kuyafungia maji yasitoke, huku umbo la wakati wa sasa likifaa kwa kauli ya kishairi kuhusu tendo la Mungu.
- source_word: מַיִם
  choice: maji
  rationale: “Maji” ndilo neno la kawaida na la asili katika Kiswahili; tayari lina maana ya wingi bila kuhitaji nyongeza.
- source_word: בְּעָבָיו
  choice: ndani ya mawingu yake
  rationale: “Ndani ya” huonyesha wazi kwamba maji yamezuiliwa katika mawingu. Neno la Kiebrania linaweza pia kusisitiza mawingu mazito, jambo lililowekwa katika tanbihi.
- source_word: וְלֹא
  choice: lakini ... hali-
  rationale: '“Lakini” huonyesha utofauti wa kishairi: ingawa maji yamefungwa ndani ya mawingu, wingu halipasuki.'
- source_word: נִבְקַע
  choice: halipasuki
  rationale: Hili ni neno la asili la Kiswahili linalohifadhi picha ya kitu kugawanyika au kufunguka kwa kupasuka, bila kulazimisha kisababishi cha nje.
- source_word: עָנָן
  choice: wingu
  rationale: Umoja wa Kiebrania umehifadhiwa, hata baada ya kutajwa kwa “mawingu,” kama matumizi ya jumla au ya kishairi.
- source_word: תַּחְתָּם
  choice: chini yake
  rationale: Kiswahili cha kawaida hutumia “chini yake” kwa marejeo haya. Kauli hiyo pia haibani kabisa rejeo, kama ilivyo katika Kiebrania, ambapo kiambishi cha wingi kinaweza kurejelea maji au mawingu.
