  text: naye husahau kwamba huenda mguu ukayaponda[a], na mnyama wa porini[b] akayakanyaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana halisi, viambishi vya Kiebrania ni vya umoja wa kike: “mguu unaweza kuliponda ... na mnyama wa porini anaweza kulikanyaga.” Huenda vinarejelea kwa ujumla mayai au watoto walioachwa nyuma.'
    reason: lexical_alternative
  - marker: b
    text: Au “mnyama wa uwandani,” tafsiri rasmi zaidi ya usemi wa Kiebrania unaomaanisha mnyama wa nchi kavu anayeishi porini.
