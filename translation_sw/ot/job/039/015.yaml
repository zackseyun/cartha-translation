lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: naye husahau
  rationale: Kitenzi cha Qal wayyiqtol, nafsi ya tatu umoja wa kike, kinaendeleza maelezo hai kuhusu mbuni; wakati wa sasa wa mazoea unasikika kwa asili katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha jambo analolisahau, wala si sababu.
- source_word: רֶגֶל
  choice: mguu
  rationale: 'Umoja umetumiwa kwa maana isiyo bainifu: mguu wowote unaweza kusababisha madhara hayo.'
- source_word: תְּזוּרֶהָ
  choice: huenda ... ukayaponda
  rationale: Katika muktadha wa kukanyagwa kwa mayai, kitenzi kinaeleza uwezekano wa kuharibiwa kwa kupondwa. Kiambishi cha umoja wa kike cha Kiebrania kimetafsiriwa kwa wingi wa ngeli ya mayai kwa Kiswahili cha kawaida.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: na mnyama wa porini
  rationale: Hili ni tamko la asili na la sasa kwa maana halisi ya ‘mnyama wa shambani/uwandani,’ yaani mnyama asiye wa kufugwa.
- source_word: תְּדוּשֶׁהָ
  choice: akayakanyaga
  rationale: דושׁ hapa ina maana ya kukanyaga au kuponda kwa miguu; ‘kukanyaga’ huhifadhi taswira na ulinganifu na kishazi kilichotangulia.
