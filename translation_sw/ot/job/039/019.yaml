  text: Do you give the horse its strength? Do you clothe its neck with a mane?[a]
translation:
  language: sw
  text: Je, wewe unampa farasi nguvu? Je, unaivika shingo yake upanga?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kwa ngurumo,” kufuatana na mapokeo ya kale ya kutafsiri רַעְמָה; hapa limetafsiriwa “upanga” kwa sababu taswira ya muktadha wa karibu ni ya kuvikwa shingo ya farasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  choice: Je, wewe humpa
  rationale: Kiulizi pamoja na kitenzi cha nafsi ya pili umoja huunda swali la balagha linaloelekezwa kwa Ayubu. Kiwakilishi “wewe” kinasisitiza changamoto ya moja kwa moja bila kuifanya kuwa swali la uwezo.
- source_word: לַסּוּס
  choice: farasi
  rationale: Nomino yenye kiambishi cha uainisho katika Kiebrania inamtaja farasi kwa maana ya jumla; Kiswahili kwa kawaida hakihitaji neno maalumu la kuonyesha uainisho huo.
- source_word: גְּבוּרָה
  choice: nguvu zake
  rationale: Neno hilo humaanisha nguvu, uweza, au ushujaa. “Nguvu zake” linaeleweka kwa urahisi na linafaa kwa nguvu za mwili za farasi katika muktadha huu.
- source_word: הֲתַלְבִּישׁ
  choice: Je, huivika
  rationale: Hifili ya לבש ina maana ya kuvika. “Huivika” huhifadhi sitiari ya kuipamba shingo ya farasi kama kwa vazi.
- source_word: צַוָּארוֹ
  choice: shingo yake
  rationale: Kiambishi cha umoja wa kiume kinamrejelea farasi. “Yake” ni ya kawaida katika Kiswahili na hailazimishi dhana kwamba farasi huyo ni dume.
- source_word: רַעְמָה
  choice: manyoya ya shingoni
  rationale: Katika muktadha huu neno linaelekea kumaanisha manyoya marefu yanayoota shingoni mwa farasi. Usemi huu wa kawaida unaeleweka kuliko istilahi adimu, huku tanbihi ikihifadhi uwezekano wa tafsiri ya “ngurumo” katika mapokeo ya zamani.
