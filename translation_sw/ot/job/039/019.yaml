translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. Marudio ya “Je” yanahifadhi maswali mawili ya balagha, na “wewe” katika swali la kwanza yanabeba msisitizo wa changamoto inayomwelekea Ayubu.
