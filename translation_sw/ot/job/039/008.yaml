lexical_decisions:
- source_word: יְתוּר
  choice: huzunguka ... kutafuta
  rationale: Kitenzi תור katika Qal kina maana ya kupeleleza, kutafuta kwa kuzunguka, au kwenda huku na huku. Usemi huu wa Kiswahili unaonyesha kutangatanga kwa mnyama akitafuta chakula.
- source_word: הָרִים
  choice: milimani
  rationale: Nomino hii humaanisha milima; muundo wa mahali 'milimani' ni wa kawaida katika Kiswahili baada ya kitenzi cha mwendo.
- source_word: מִרְעֵהוּ
  choice: malisho yake
  rationale: מִרְעֶה ni eneo la kulishia au chakula cha malishoni, na kiambishi cha nafsi ya tatu ya kiume umoja kimehifadhiwa kwa 'yake.'
- source_word: וְאַחַר
  choice: naye ... kutafuta
  rationale: Katika muktadha huu אַחַר pamoja na kitenzi huonyesha kufuatilia au kutafuta kitu; Kiswahili asilia hakihitaji kutafsiri kihusishi hicho neno kwa neno.
- source_word: כָּל
  choice: kila
  rationale: כָּל limetumika kwa maana ya kigawanyo, hivyo 'kila' huhifadhi wazo la mimea yoyote inayopatikana.
- source_word: יָרוֹק
  choice: mmea wa kijani
  rationale: יָרוֹק hapa hurejelea kitu cha kijani, hasa uoto mpya. 'Mmea wa kijani' ni wazi na wa kawaida, huku tanbihi ikihifadhi upana wa maana.
- source_word: יִדְרֹשׁ
  choice: hutafuta
  rationale: דרשׁ katika Qal hapa humaanisha kutafuta kwa bidii, hasa katika muktadha wa mnyama kutafuta chakula.
