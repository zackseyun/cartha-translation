  yaml_path: translation/ot/job/039/024.yaml
  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: sw
  text: Kwa kishindo na ghadhabu anaimeza ardhi[a], wala hawezi kutulia aisikiapo sauti ya tarumbeta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “anaimeza ardhi,” taswira ya kasi na hamu ya farasi kukimbilia mbele.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hajizuii aisikiapo sauti ya tarumbeta.” Kitenzi hiki mara nyingi hutafsiriwa kihalisi kuwa “kuamini,” lakini hapa huenda ni nahau ya kutotulia au kutojizuia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ
  choice: Kwa kishindo
  rationale: רַעַשׁ huonyesha mtikisiko, mshindo, au vurugu kali. Katika muktadha wa farasi wa vita, “kwa kishindo” huwasilisha nguvu na msukosuko wa mbio zake kwa Kiswahili cha kawaida.
- source_word: וְרֹגֶז
  choice: na ghadhabu
  rationale: רֹגֶז inaweza kumaanisha msukosuko, kutetemeka, au hasira. “Ghadhabu” inahifadhi ukali wa farasi mwenye hamasa ya vita na inaendana na kishindo kilichotajwa kabla yake.
- source_word: יְגַמֶּא
  choice: anaimeza
  rationale: Kitenzi גמא kwa msingi humaanisha kumeza au kubugia. Hapa ni taswira ya farasi anayepita ardhini kwa kasi sana; “anaimeza” inahifadhi sitiari hai ya Kiebrania.
- source_word: אָרֶץ
  choice: ardhi
  rationale: Katika muktadha huu אֶרֶץ ni eneo analolikimbilia farasi. “Ardhi” ni ya asili na pia huiweka wazi taswira ya kuimeza ardhi kwa mwendo wa kasi.
- source_word: וְלֹא יַאֲמִין
  choice: wala hawezi kutulia
  rationale: Ingawa אמן katika hifili mara nyingi humaanisha kuamini, hapa muktadha wa farasi na tarumbeta unaunga mkono maana ya kutobaki imara au kutojizuia. “Hawezi kutulia” huwasilisha maana hiyo bila kuificha tafsiri halisi inayowezekana, ambayo imeelezwa katika tanbihi.
- source_word: כִּי
  choice: aisikiapo
  rationale: כִּי hapa inaunganisha kutotulia kwa farasi na tukio la kusikia sauti ya tarumbeta. Umbo “aisikiapo” linatoa uhusiano wa wakati kwa Kiswahili fasaha.
- source_word: קוֹל שׁוֹפָר
  choice: sauti ya tarumbeta
  rationale: שׁוֹפָר ni pembe ya kupulizwa iliyotumiwa kutoa ishara, hasa vitani. “Tarumbeta” ni neno linaloeleweka kwa urahisi katika muktadha huu, huku “sauti ya” ikifuata muundo wa Kiebrania.
theological_decisions:
- issue: Maana ya וְלֹא יַאֲמִין katika muktadha huu
  choice: wala hawezi kutulia
  alternative: wala haamini kwamba sauti ya tarumbeta imelia; au wala hajizuii aisikiapo sauti ya tarumbeta
  rationale: Maana ya msingi ya kitenzi inaweza kuwa “kuamini,” lakini muktadha unaelekea kwenye farasi kutoweza kubaki mahali au kujizuia anaposikia ishara ya vita. Tafsiri kuu inatoa maana ya kimuktadha, na tanbihi inalinda utata wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Sitiari ya Kiebrania “kuimeza ardhi” imehifadhiwa; “kishindo” na “ghadhabu” zinaendeleza nguvu ya mistari ya kishairi. Alama zote za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
