  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: sw
  text: Je, ni kwa amri yako tai hupaa juu na huweka kiota chake mahali pa juu?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huruka juu” badala ya “hupaa juu.”
    reason: lexical_alternative
  - marker: b
    text: Neno “tai” laweza pia kumaanisha kwa upana ndege mkubwa wa kuwinda au kula mizoga, huenda hata tai-mzoga katika baadhi ya miktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Je, ni
  rationale: Katika muktadha huu אִם inaanzisha swali la balagha, si sharti la kawaida; “Je, ni” ni muundo wa kawaida wa Kiswahili.
- source_word: עַל־פִּיךָ
  choice: kwa amri yako
  rationale: Kirai hiki kihalisi ni “kwa/juu ya kinywa chako,” lakini hapa ni nahau yenye maana ya kutenda kwa agizo au amri ya mtu.
- source_word: יַגְבִּיהַּ
  choice: hupaa juu
  rationale: Hifili ya גבה inaonyesha kwenda au kupanda juu; kwa tai, “hupaa juu” ni ya asili na huhifadhi wazo la kimo.
- source_word: נָשֶׁר
  choice: tai
  rationale: “Tai” ndiyo tafsiri ya kawaida na inafaa kwa picha ya ndege mkubwa anayepaa na kuweka kiota juu, ingawa neno la Kiebrania linaweza kutumiwa kwa upana zaidi kuhusu ndege mkubwa wa kuwinda au kula mizoga.
- source_word: וְכִי
  choice: na
  rationale: Huunganisha kishazi cha pili na cha kwanza ndani ya swali lilelile la balagha; Kiswahili hakihitaji kurudia kiulizi.
- source_word: יָרִים קִנּוֹ
  choice: kuweka kiota chake mahali pa juu
  rationale: Kihalisi kitenzi ni “kuinua,” lakini kwa kiota maana ya kimuktadha ni kukiweka au kukijenga katika mahali palipoinuka. Tafsiri hii huepuka picha isiyo ya asili ya tai kuinua kiota kilichokamilika.
