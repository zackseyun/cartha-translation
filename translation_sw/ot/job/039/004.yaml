  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: sw
  text: Watoto wao huimarika; hukua katika nchi ya wazi[a]; huondoka wala hawarudi kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “porini” au “katika nchi ya mwitu.”
