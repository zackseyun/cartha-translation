lexical_decisions:
- source_word: יַחְלְמוּ
  choice: huwa na nguvu
  rationale: Katika muktadha huu wa wanyama, kitenzi kinaeleza watoto wao kustawi kimwili na kuwa wenye nguvu.
- source_word: בְנֵיהֶם
  choice: watoto wao
  rationale: Ingawa neno linaweza kumaanisha wana, hapa linarejelea watoto wa wanyama kwa ujumla bila kuwalenga madume pekee.
- source_word: יִרְבּוּ
  choice: hukua
  rationale: Katika usambamba huu wa kishairi, maana inayofaa ni kukua au kufikia ukomavu, si lazima kuongezeka kwa idadi.
- source_word: בַבָּר
  choice: porini
  rationale: Neno linamaanisha eneo la wazi lisilolimwa au mazingira ya mwituni; “porini” ni Kiswahili cha kawaida na cha asili katika muktadha wa wanyama.
- source_word: יָצְאוּ
  choice: huondoka
  rationale: Huwasilisha kutoka kwao na kuwaacha wazazi kwa Kiswahili cha kawaida.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: wala hawawarudii tena
  rationale: Huhifadhi maana ya kutorudi kwa wanyama wazazi bila kuongeza kwa lazima wazo la “kamwe,” ambalo halijaelezwa moja kwa moja katika Kiebrania.
