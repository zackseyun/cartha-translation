  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: sw
  text: Huicheka hofu[a] wala havunjiki moyo; wala harudi nyuma mbele ya upanga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huidhihaki hofu.” Kitenzi cha Kiebrania kinaweza kumaanisha kudhihaki au kucheka kwa dharau.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hajiondoi mbele ya upanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: huicheka
  rationale: Kitenzi שׂחק kinaonyesha kucheka kwa namna inayoashiria kutodharau tishio; “huicheka” inadumisha taswira hai ya Kiebrania bila kuifanya moja kwa moja kuwa “huidharau.”
- source_word: לְפַחַד
  choice: hofu
  rationale: פחד ni hofu, kitisho, au woga. “Hofu” ni neno la kawaida na pana ambalo haliongezi ukali usiolazimu.
- source_word: יֵחָת
  choice: havunjiki moyo
  rationale: Nifali ya חתת hapa ina maana ya kufadhaika, kuingiwa na hofu, au kuvunjika moyo. Usemi “havunjiki moyo” ni wa asili katika Kiswahili na unafaa kwa picha ya ujasiri vitani.
- source_word: יָשׁוּב
  choice: harudi nyuma
  rationale: שׁוב kimsingi ni kurudi au kugeuka nyuma. “Harudi nyuma” huhifadhi taswira hiyo na pia hueleweka kama kutorudi nyuma vitani.
- source_word: מִפְּנֵי
  choice: mbele ya
  rationale: מִפְּנֵי kihalisi huhusisha kuwa ‘kutoka mbele ya’ au kukabili kitu. Katika muundo wa Kiswahili, “harudi nyuma mbele ya” huonyesha kutokwepa tishio linalomkabili.
- source_word: חָרֶב
  choice: upanga
  rationale: חרב ni upanga, hapa ukiwakilisha silaha na hatari ya vita kwa ujumla.
