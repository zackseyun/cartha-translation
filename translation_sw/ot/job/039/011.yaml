  yaml_path: translation/ot/job/039/011.yaml
  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: sw
  text: Je, utamtumaini kwa sababu ana nguvu nyingi, na kumwachia kazi yako[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taabu yako” au “mazao yako”; neno la Kiebrania linaweza kumaanisha kazi yenyewe au matokeo ya kazi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח בּוֹ
  choice: Je, utamtumaini
  rationale: Muundo wa swali pamoja na kitenzi בטח unauliza kwa kejeli ikiwa Ayubu atamtegemea fahali-mwitu; “utamtumaini” ni Kiswahili cha kawaida kinachodumisha wazo la kuwa na uhakika naye.
- source_word: כִּי רַב כֹּחוֹ
  choice: kwa sababu ana nguvu nyingi
  rationale: כִּי ina maana ya sababu, na רַב כֹּחוֹ huonyesha ukubwa wa nguvu za mnyama. Kauli hii ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: וְתַעֲזֹב אֵלָיו
  choice: na kumwachia
  rationale: עזב kimsingi ni “kuacha”; pamoja na אֵלָיו hapa ina wazo la kuacha kazi mikononi mwa mnyama. “Kumwachia” huhifadhi maana hiyo bila kuifanya wazi zaidi kuliko Kiebrania.
- source_word: יְגִיעֶךָ
  choice: kazi yako
  rationale: יְגִיעַ inaweza kumaanisha kazi au taabu, na pia matokeo ya kazi. “Kazi yako” inafaa katika muktadha wa kazi ya kilimo, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
