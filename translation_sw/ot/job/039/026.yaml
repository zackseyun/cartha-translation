lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: Je, ni kwa ufahamu wako
  rationale: Muundo wa swali הֲ pamoja na מִן na בִּינָה unauliza ikiwa tendo hilo hutokea kwa uwezo wa ufahamu wa Ayubu. “Ufahamu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: יַאֲבֶר
  choice: huruka juu
  rationale: Kitenzi hiki katika Hiphil huonyesha ndege kupaa au kuruka juu. “Huruka juu” ni Kiswahili cha kawaida kinachohifadhi wazo la mwendo wa juu bila kudai kwa uhakika aina maalumu ya urukaji.
- source_word: נֵץ
  choice: mwewe
  rationale: Neno hili hutaja ndege wa kuwinda wa jamii pana inayoweza kuitwa mwewe au falco. “Mwewe” ni neno linaloeleweka kwa upana katika Kiswahili bila kubainisha spishi isiyothibitishwa.
- source_word: יִפְרֹשׂ
  choice: akitandaza
  rationale: פרשׂ maana yake ni kutandaza au kunyoosha. Umbo la “akitandaza” linaonyesha tendo linaloandamana na kuruka juu.
- source_word: כְּנָפוֹ
  choice: mabawa yake
  rationale: Ingawa neno la Kiebrania ni umoja wenye maana ya kijumla, Kiswahili cha kawaida hutumia wingi “mabawa” kwa ndege anayeruka.
- source_word: לְתֵימָן
  choice: kuelekea kusini
  rationale: תֵימָן hapa ina maana ya upande wa kusini, na לְ inaonyesha mwelekeo. “Kuelekea kusini” huhifadhi maana hiyo wazi.
