  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
translation:
  language: sw
  text: Juu yake podo la mishale linagonga-gonga kwa sauti[a], na mng'ao wa mkuki na fumo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dhidi yake podo la mishale linasikika.” Kihusishi na kitenzi cha Kiebrania vinaweza kuonyesha kwa namna tofauti kidogo uhusiano wa mahali na aina ya sauti.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mwali/makali ya mkuki na fumo”; huu ni usemi wa kishairi unaoonyesha mng'ao wa silaha hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: juu yake
  rationale: Huhifadhi taswira ya mahali ya kihusishi עַל bila kuamua kimya kimya kwamba maana yake lazima iwe “dhidi yake”; katika muktadha silaha zinasikika juu ya farasi.
- source_word: תִּרְנֶה
  choice: linalia
  rationale: Kitenzi hiki cha kishairi kinaeleza sauti kali ya podo likitikiswa; “linalia” ni Kiswahili cha kawaida kinachoweza kuonyesha mlio huo bila kudai aina moja tu ya sauti.
- source_word: אַשְׁפָּה
  choice: podo la mishale
  rationale: “Podo la mishale” ni usemi unaoeleweka kwa kifaa cha kubebea mishale na unaepuka utata wa neno “podo” likisimama peke yake.
- source_word: לַהַב
  choice: vinavyometameta
  rationale: Ingawa neno kihalisi linaweza kumaanisha “mwali” au “makali,” hapa linaonyesha mwangaza wa silaha; kitenzi hiki huwasilisha taswira hiyo ya kishairi kwa Kiswahili asilia.
- source_word: חֲנִית
  choice: mkuki
  rationale: Ni kisawe cha kawaida na kipana cha silaha ndefu yenye ncha kali.
- source_word: כִידוֹן
  choice: fumo
  rationale: “Fumo” hutofautisha silaha hii na חֲנִית (“mkuki”) na kuwasilisha silaha nyepesi ya kurushwa.
