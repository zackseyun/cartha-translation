  text: כִּֽי הִשָּׁ֣/הּ אֱל֣וֹהַּ חָכְמָ֑ה וְ/לֹא חָ֥לַק לָ֝֗/הּ בַּ/בִּינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/017.yaml
  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
translation:
  language: sw
  text: kwa sababu Mungu amemnyima hekima, wala hakumpa fungu la ufahamu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu Mungu amemfanya aisahau hekima,” au “kwa sababu Mungu amesababisha akose hekima.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hakumgawia katika ufahamu,” yaani, hakumpa fungu la ufahamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: kwa sababu
  rationale: Inaonyesha sababu ya tabia ya mbuni katika muktadha unaotangulia, huku ikihifadhi nguvu ya kisababishi.
- source_word: הִשָּׁהּ
  choice: amemnyima
  rationale: Hifili ya נשה pamoja na kiambishi cha nafsi ya kike inaonyesha kwamba Mungu amesababisha hekima isiwe kwake. ‘Amemnyima’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi bila kuifanya kuwa kusahau tu.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Ni tafsiri ya kawaida ya jina hili la Mungu katika Ayubu; hakuna sababu ya kulipanua hapa.
- source_word: חָכְמָה
  choice: hekima
  rationale: Neno hili linaonyesha hekima, busara, au uwezo wa kufanya uamuzi mzuri; ‘hekima’ ndiyo tafsiri ya moja kwa moja na inayofaa katika muktadha.
- source_word: וְלֹא
  choice: wala hakumpa
  rationale: ‘Wala’ huunganisha kwa kawaida kishazi cha pili kilichokanushwa na cha kwanza katika Kiswahili, na ‘hakumpa’ huweka wazi tendo linalomhusu mbuni.
- source_word: חָלַק לָהּ
  choice: hakumpa fungu la
  rationale: חלק kimsingi humaanisha kugawa au kumgawia mtu sehemu. ‘Kumpa fungu la’ huhifadhi wazo la mgao badala ya kulifanya kuwa kutoa tu.
- source_word: בַּבִּינָה
  choice: ufahamu
  rationale: ‘Ufahamu’ hudokeza uwezo wa kuelewa na kupambanua, na pia huhifadhi tofauti ya kimaana na ‘hekima’ katika kishazi cha kwanza.
theological_decisions:
- issue: Utendaji wa Mungu katika ukosefu wa hekima wa mbuni
  choice: Mungu ametajwa wazi kuwa ndiye aliyemnyima hekima na ambaye hakumpa fungu la ufahamu.
  alternative: Kauli laini kama ‘hana hekima,’ ambayo ingeondoa au kupunguza utendaji wa Mungu.
  rationale: Kiebrania kinamtaja אֱלוֹהַּ wazi kuwa mtendaji wa vitenzi vyote viwili. Tafsiri inadumisha uhusishaji huo wa moja kwa moja bila kulainisha mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Amemnyima’ ni ya kawaida na wazi; ‘fungu la ufahamu’ huhifadhi taswira ya kugawiwa sehemu iliyomo katika Kiebrania. Viashiria vyote vya tanbihi vimewekwa katika matini.
