  yaml_path: translation/ot/job/039/002.yaml
  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
translation:
  language: sw
  text: Je, unahesabu miezi wanayotimiza[a], na je, unajua wakati wanapozaa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa Kiswahili cha kimazoea zaidi, “Je, unahesabu miezi mpaka kipindi chao cha mimba kitimie?” Kiebrania kinatumia kitenzi tendaji, kihalisi, “wanatimiza [miezi],” kikimaanisha kukamilika kwa kipindi cha mimba.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: unazihesabu
  rationale: Kauli ya sasa katika swali la balagha inadumisha mfululizo wa maswali ya Mungu; kiambishi cha yambwa kinaelekezwa kwa “miezi.”
- source_word: יְרָחִים
  choice: miezi
  rationale: Neno hili humaanisha miezi; hakuna haja ya kulipanua kuwa “miezi ya mwandamo.”
- source_word: תְּמַלֶּאנָה
  choice: wanayoitimiza
  rationale: Kitenzi cha Kiebrania kiko katika hali tendaji na mhusika wake ni wanyama wa kike waliotajwa katika muktadha. Tafsiri hii inadumisha hali tendaji na wazo la kufikia mwisho wa kipindi cha mimba.
- source_word: וְיָדַעְתָּ
  choice: na je, unajua
  rationale: Muundo wa sasa wa swali la balagha ni wa kawaida katika Kiswahili na unaendeleza mfululizo wa mahojiano.
- source_word: עֵת
  choice: wakati
  rationale: “Wakati” ni tafsiri ya kawaida na sahihi bila kuongeza dhana ya uteuzi ambayo haijawekwa wazi.
- source_word: לִדְתָּנָה
  choice: wanapozaa
  rationale: Kifungu cha wakati ni cha kawaida katika Kiswahili na kinaonyesha tendo la wanyama hao wa kike kuzaa.
