lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Kiambishi cha uhusiano kinamrejelea punda-mwitu katika mstari uliotangulia; “ambaye” ni cha kawaida na huweka wazi kwamba anayerejelewa ni mnyama huyo.
- source_word: שַׂמְתִּי
  choice: nimempa ... iwe
  rationale: Ingawa kitenzi kwa msingi humaanisha kuweka, katika muktadha huu kinaonyesha Mungu kumgawia mnyama mazingira ya kuwa makao yake. Muundo huu ni wa asili katika Kiswahili bila kupanua maana kupita kiasi.
- source_word: עֲרָבָה
  choice: nyika
  rationale: Neno hili huonyesha eneo kavu la pori au uwanda mkavu. “Nyika” ni neno linaloeleweka katika Kiswahili cha Afrika Mashariki na linafaa kwa picha ya kishairi ya mazingira ya punda-mwitu.
- source_word: בֵיתוֹ
  choice: makao yake
  rationale: Kiebrania kina maana halisi ya “nyumba yake,” lakini kwa makazi ya mnyama “makao yake” ni ya kawaida zaidi na bado huhifadhi taswira ya mahali anapoishi.
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: makazi yake
  rationale: Umbo la Kiebrania ni la wingi. “Makazi” pia lina umbo la wingi katika Kiswahili, hivyo linaweza kuhifadhi wingi huo kwa lugha ya asili bila kulazimisha maana ya maeneo kadhaa tofauti.
- source_word: מְלֵחָה
  choice: nchi ya chumvi
  rationale: Hurejelea ardhi yenye chumvi na isiyostawi vizuri. “Nchi ya chumvi” ni wazi, fupi, na haiibani maana kuwa tambarare maalumu ya chumvi pekee.
