  text: Je, unajua wakati mbuzi-mwitu wa milimani[a] wanapozaa? Je, unawatazama[b] kulungu jike wanapozaa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbuzi-mwitu wa miambani”; Kiebrania kinamaanisha mbuzi wa porini wanaoishi milimani, huenda mbuzi wa jamii ya ibex.
