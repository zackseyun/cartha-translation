lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Je, unajua
  rationale: Kiambishi cha kuuliza pamoja na kitenzi cha kujua kinatoa swali la balagha; wakati wa sasa ni wa kawaida na wazi katika Kiswahili.
- source_word: עֵת לֶדֶת
  choice: wakati ... wanapozaa
  rationale: Muundo huu unaonyesha wakati wa kuzaa; kishazi cha wakati ni cha asili katika Kiswahili.
- source_word: יַעֲלֵי סָלַע
  choice: mbuzi-mwitu wa milimani
  rationale: Kwa maana halisi ni mbuzi wa miambani, yaani mbuzi wa porini wanaoishi milimani; uchaguzi huu ni wazi bila kubainisha isivyo lazima spishi hususa.
- source_word: חֹלֵל
  choice: wanapokuwa na utungu
  rationale: Katika muktadha huu kitenzi kinaonyesha uchungu au kujikunyata kwa kuzaa; “kuwa na utungu” ni usemi wa kawaida wa Kiswahili.
- source_word: אַיָּלוֹת
  choice: kulungu jike
  rationale: Nomino ya Kiebrania inawahusu kulungu wa kike; “jike” linahifadhi taarifa hiyo badala ya kutumia neno la jumla pekee.
- source_word: תִּשְׁמֹר
  choice: unawaangalia
  rationale: Kitenzi kinaweza kumaanisha kuangalia, kuchunguza, au kulinda. “Unawaangalia” huhifadhi uwezekano wa uangalizi makini bila kulazimisha wazo la ulinzi.
