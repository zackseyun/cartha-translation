  text: Kwa maana huacha mayai yake ardhini, na huyapasha joto juu ya mavumbi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huyatelekeza mayai yake ardhini.” Kitenzi cha Kiebrania kinaweza kuwa na maana yenye nguvu zaidi kuliko “huacha,” lakini sehemu inayofuata ya mstari inaonyesha mayai yakiwa wazi ardhini, si kwamba yametelekezwa kabisa.
