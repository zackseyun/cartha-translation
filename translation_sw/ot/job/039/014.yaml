lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya kutoa sababu au maelezo kuhusu maelezo yaliyotangulia ya mbuni.
- source_word: תַעֲזֹב
  choice: huyaacha
  rationale: Kitenzi kinaweza kumaanisha kuacha au kutelekeza. “Huyaacha” ni cha kawaida katika muktadha huu bila kusisitiza kwamba ameyatelekeza kabisa; maana yenye nguvu zaidi imehifadhiwa katika tanbihi.
- source_word: לָאָרֶץ
  choice: ardhini
  rationale: Ni Kiswahili cha asili kinachowasilisha picha halisi ya mayai kuachwa kwenye ardhi.
- source_word: בֵּצֶיהָ
  choice: mayai yake
  rationale: Inawasilisha wazi nomino ya wingi pamoja na kiambishi cha nafsi ya tatu ya kike, ikirejelea mbuni jike katika muktadha.
- source_word: וְעַל עָפָר
  choice: juu ya mavumbi
  rationale: Inahifadhi kihusishi na taswira ya kishairi ya עָפָר; “mavumbi” lina sajili inayofaa maandishi ya Biblia.
- source_word: תְּחַמֵּם
  choice: kuyapasha joto
  rationale: Inatoa maana ya Piel, ‘kufanya yawe na joto,’ kwa Kiswahili cha kawaida bila kutumia neno la kitaalamu zaidi la kuatamia.
