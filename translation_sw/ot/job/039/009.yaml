  text: Je, ng’ombe wa mwitu[a] atakubali kukutumikia? Je, atalala usiku kando ya hori lako?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fahali wa mwitu” au “auroki”; haijulikani kwa uhakika neno la Kiebrania linamaanisha mnyama gani hasa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, chombo cha kulishia wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: atakubali
  rationale: Kitenzi אבה huonyesha hiari au kukubali, si uwezo tu. “Atakubali” huhifadhi maana hiyo katika swali la balagha.
- source_word: רֵּים
  choice: fahali-mwitu
  rationale: Utambulisho kamili wa mnyama huyu hauna uhakika. “Fahali-mwitu” ni neno la kawaida na linaepuka ubainishaji wa kisayansi usiothibitishwa.
- source_word: עָבְדֶךָ
  choice: kukutumikia
  rationale: Mzizi עבד hapa unahusu kumfanyia mtu kazi au huduma, katika kulinganisha mnyama wa kufugwa na mnyama wa porini.
- source_word: אִם
  choice: Je
  rationale: אִם huanzisha swali la pili linalolingana na la kwanza. Kurudia “Je” ni Kiswahili cha kawaida na huhifadhi usambamba wa kishairi.
- source_word: יָלִין
  choice: atalala usiku
  rationale: Kitenzi לין humaanisha kukaa au kulala mahali usiku. “Atalala usiku” ni usemi wa kawaida na wa wazi katika Kiswahili.
- source_word: עַל
  choice: kando ya
  rationale: Ingawa עַל mara nyingi humaanisha “juu ya,” hapa huonyesha mahali karibu na hori; “kando ya” huwasilisha taswira hiyo kwa kawaida.
- source_word: אֲבוּסֶךָ
  choice: hori lako
  rationale: אֲבוּס ni chombo au mahali pa kulishia wanyama. “Hori” ni neno sahihi na fupi la Kiswahili kwa chombo hicho.
