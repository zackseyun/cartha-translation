  yaml_path: translation/ot/job/039/020.yaml
  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
translation:
  language: sw
  text: Je, unaweza kumfanya aruke kama nzige? Mvumo wenye fahari wa pua zake unatisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, unaweza kumfanya avume kama nzige?” Kitenzi cha Kiebrania kinaweza kudokeza kusababisha mtikisiko, kutetemeka, au mwendo wa nguvu; baadhi huona picha hii ikikazia sauti pamoja na mwendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: unaweza kumfanya aruke
  rationale: Hifili ya רעשׁ inaweza kumaanisha kusababisha mtikisiko, kutetemeka, au mwendo wa nguvu. Katika muktadha wa farasi wa vita na ulinganisho na nzige, ‘kumfanya aruke’ huwasilisha mwendo wa ghafla na wenye nguvu, huku swali la Mungu likihifadhiwa.
- source_word: כָּאַרְבֶּה
  choice: kama nzige
  rationale: Nomino inaweza kutumiwa kwa maana ya kiumbe mmoja au kwa maana ya kijumla; Kiswahili ‘kama nzige’ ni ulinganisho wa kawaida na wenye picha wazi.
- source_word: הוֹד
  choice: fahari
  rationale: הוֹד humaanisha fahari, adhama, au utukufu. ‘Fahari’ inaendana na mtindo wa kishairi na sura ya kuvutia na kutisha ya farasi.
- source_word: נַחְרוֹ
  choice: ya mkoromo wake
  rationale: Neno hili linahusu sauti au pumzi yenye nguvu inayotoka puani. ‘Mkoromo’ ni neno la asili la Kiswahili linaloleta picha ya sauti nzito ya farasi bila kuichanganya na mlio wake wa kawaida.
- source_word: אֵימָה
  choice: inatisha
  rationale: Nomino ya Kiebrania humaanisha hofu kuu au kitisho. Kutafsiri kish predikati kuwa ‘inatisha’ ni Kiswahili cha kawaida na huhifadhi nguvu ya kishairi.
