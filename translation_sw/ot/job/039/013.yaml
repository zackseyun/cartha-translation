  text: The wings of the ostrich flap joyfully—are they the pinions and plumage of the stork?[a]
translation:
  language: sw
  text: Mabawa ya mbuni yanapepea kwa shangwe—je, ni manyoya makubwa ya mabawa na manyoya ya korongo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bawa la mbuni linapepea kwa majivuno, lakini je, ni manyoya makubwa ya mabawa na manyoya ya korongo?” Kiebrania cha mstari huu ni kigumu na kimeeleweka kwa njia mbalimbali.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: mabawa
  rationale: Umoja wa Kiebrania umetumika kwa maana ya jumla; wingi ni wa kawaida katika Kiswahili kwa mabawa mawili ya ndege.
- source_word: רְנָנִים
  choice: ya mbuni
  rationale: Katika muktadha wa maelezo ya wanyama na mistari inayofuata, neno hili linamtaja mbuni, ingawa kimuundo linaweza kuhusishwa na vilio au shangwe.
- source_word: נֶעֱלָסָה
  choice: hupiga kwa shangwe
  rationale: Kitenzi kinaunganisha mwendo wa mabawa na hisia ya kufurahi au kujivuna; tafsiri hii inahifadhi tendo na uchangamfu wake.
- source_word: אִם
  choice: je, ni
  rationale: Hapa neno linaanzisha swali la balagha katika sentensi ya Kiebrania iliyoachwa kwa ufupi.
- source_word: אֶבְרָה
  choice: manyoya ya mabawa
  rationale: Neno linamaanisha manyoya makubwa ya kurukia yaliyo kwenye bawa; usemi huu unaeleweka kuliko istilahi adimu ya kitaalamu.
- source_word: חֲסִידָה
  choice: korongo
  rationale: Katika muktadha huu ni jina la ndege aina ya stork, si kivumishi chenye maana ya mwaminifu au mwenye fadhili; 'korongo' ni jina linalotumika kwa ndege huyo katika Kiswahili cha kawaida.
- source_word: וְנֹצָה
  choice: na manyoya
  rationale: Neno linataja manyoya kwa ujumla; Kiswahili cha kawaida hakihitaji istilahi tofauti ya kishairi hapa.
