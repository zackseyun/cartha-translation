  naturalness: '"Hupiga kwa shangwe" inaeleweka, lakini kwa mabawa "hujigonga kwa shangwe" si ya kawaida; "huruka-ruka kwa shangwe" ingebadili tendo. "Mabawa ya mbuni yanapepea kwa shangwe" ni Kiswahili cha asili zaidi na huwasilisha mwendo wa mabawa kwa uwazi. "Korongo" hutumika pia kwa crane katika matumizi ya kawaida; "korongo (stork)" katika tanbihi si suluhisho zuri ndani ya tafsiri. "Korongo" linaweza kubaki kwa kuwa ni neno la kawaida la tafsiri za Biblia, lakini maana ya stork ifafanuliwe katika tanbihi ya ugumu wa kifungu.'
  terminology: Neno "manyoya makubwa ya mabawa" hutoa tofauti inayofaa kwa אֶבְרָה bila kutumia istilahi adimu. "Manyoya" kwa נֹצָה ni sahihi. "Korongo" ni chaguo linalokubalika katika rejista ya Biblia kwa חֲסִידָה, ingawa utambulisho wa ndege unaweza kutatanishwa na crane katika Kiswahili cha kisasa.
