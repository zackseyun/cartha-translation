  text: Huwatendea watoto wake kwa ukali[a], kana kwamba si wake; taabu yake ni bure, wala hana hofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ukaribu zaidi, “Huwafanya watoto wake kuwa wagumu kwake, kana kwamba si wake.”
