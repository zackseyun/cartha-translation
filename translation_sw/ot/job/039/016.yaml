lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: huwatendea ... kwa ukali
  rationale: Hifili ya קשׁח ina wazo la kufanya kuwa mgumu au kutenda kwa ukali. Katika muktadha wa mbuni na watoto wake, usemi huu ni wa asili katika Kiswahili na unabaki karibu na maana ya Kiebrania.
- source_word: בָּנֶיהָ
  choice: watoto wake
  rationale: Ingawa neno hilo linaweza kumaanisha wana au watoto, katika muktadha wa mnyama, “watoto wake” ni Kiswahili cha kawaida na wazi.
- source_word: לְלֹא לָהּ
  choice: kana kwamba si wake
  rationale: Kirai hiki kwa karibu ni “kama si wake.” Upanuzi wa “kana kwamba” unaonyesha wazi ulinganisho uliomo katika Kiebrania.
- source_word: לְרִיק
  choice: ni bure
  rationale: Hii ni njia fupi na ya kawaida ya kueleza kazi isiyo na matokeo au kusudi.
- source_word: יְגִיעָהּ
  choice: kazi yake
  rationale: Neno hilo humaanisha taabu, juhudi, au kazi. “Kazi yake” ni wazi na linafaa kwa juhudi zake zinazohusiana na watoto.
- source_word: בְּלִי פָחַד
  choice: wala hajali
  rationale: Kwa karibu ni “bila hofu,” lakini katika muktadha linaonyesha kutokuwa na wasiwasi kuhusu kupotea kwa juhudi au watoto wake. “Wala hajali” hutoa maana hiyo kwa Kiswahili cha kawaida.
