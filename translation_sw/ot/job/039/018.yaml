  text: Anapojiinua juu[a], huwacheka[b] farasi na mpandaji wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anapotandaza mabawa yake juu,” au “anapopigapiga mabawa na kuinuka.” Yaelekea kitenzi cha Kiebrania kinahusu kwenda juu, lakini maana yake kamili inajadiliwa.
