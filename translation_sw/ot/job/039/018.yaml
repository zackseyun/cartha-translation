lexical_decisions:
- source_word: כָּעֵת
  choice: Anapo-
  rationale: Kirai hiki kinaanzisha wakati au hali ambamo tendo linatokea. Kiambishi cha wakati “anapo-” ni cha kawaida na cha asili katika Kiswahili.
- source_word: בַּמָּרוֹם
  choice: kwenda juu
  rationale: Neno מָרוֹם linahusu kimo au mahali pa juu. Tafsiri hii inaonyesha mwendo wa kuinuka bila kudai kwa hakika kwamba ndege huyo anaruka angani.
- source_word: תַּמְרִיא
  choice: anapojiinua
  rationale: Kauli ya Hiphil hapa yaelekea kueleza kujifanya ainuke au kwenda juu. “Kujiinua” inadumisha picha hiyo, huku tanbihi ikihifadhi uwezekano wa maana inayohusu kutandaza au kupigapiga mabawa.
- source_word: תִּשְׂחַק
  choice: humcheka
  rationale: Kitenzi שׂחק kinaweza kumaanisha kucheka au kudhihaki. Katika muundo huu, kucheka kunaelekezwa kwa farasi na mpandaji wake, hivyo kunaweza kuwa na maana ya dharau.
- source_word: לַסּוּס
  choice: farasi
  rationale: Nomino yenye kibainishi katika Kiebrania imetumiwa kwa maana ya jumla; Kiswahili kinaweza kuwasilisha maana hiyo kwa “farasi” bila kibainishi.
- source_word: וּלְרֹכְבוֹ
  choice: pamoja na mpandaji wake
  rationale: Kiwakilishi tamati kinamrejelea farasi. “Mpandaji wake” hudumisha uhusiano huo wazi, na “pamoja na” huunganisha vitu viwili vinavyochekwa.
