  yaml_path: translation/ot/job/039/010.yaml
  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: sw
  text: Je, unaweza kumfunga ng’ombe-mwitu[a] kwenye mfuo kwa kamba yake, au atayalima mabonde kwa haro[b] nyuma yako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘ng’ombe-mwitu wa kale (auroksi)’ au ‘fahali-mwitu.’ Neno la Kiebrania רֵים humaanisha mnyama mwenye nguvu wa jamii ya ng’ombe, si kiumbe wa kubuniwa mwenye pembe moja wa tafsiri fulani za zamani.
    reason: lexical_alternative
  - marker: b
    text: Au ‘atalima mabonde nyuma yako.’ Kitenzi cha Kiebrania huenda kinamaanisha hasa kuivunja na kuisawazisha ardhi kwa haro.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: Je, unaweza kumfunga
  rationale: Kitenzi קָשַׁר humaanisha kufunga kwa kamba. Muundo huu unawasilisha kwa Kiswahili cha kawaida swali la balagha kuhusu uwezo wa kumtiisha mnyama kwa kazi.
- source_word: רֵים
  choice: ng’ombe-mwitu
  rationale: Neno hili humaanisha mnyama mkubwa na mwenye nguvu wa jamii ya ng’ombe, si nyati wala kiumbe wa kubuniwa. ‘Ng’ombe-mwitu’ linaeleweka kwa urahisi na linadumisha wazo la mnyama asiyefugika.
- source_word: בְּתֶלֶם
  choice: kwenye mfuo
  rationale: תֶּלֶם ni mfuo unaofanywa shambani wakati wa kulima. ‘Kwenye mfuo’ linaonyesha mahali ambapo mnyama angeongozwa katika kazi ya shamba.
- source_word: עֲבֹתוֹ
  choice: kwa kamba yake
  rationale: עֲבוֹת ni kamba au ugwe wa kufungia; kiambishi cha nafsi ya tatu ya kiume kinamrejelea huyo ng’ombe-mwitu.
- source_word: אִם
  choice: au
  rationale: Katika maswali haya mawili yanayolingana, אִם linaanzisha swali la pili, si sharti; kwa hiyo ‘au’ linaonyesha uhusiano huo kwa kawaida.
- source_word: יְשַׂדֵּד
  choice: atayalima ... kwa haro
  rationale: Katika muktadha wa kilimo, kitenzi שׂדד kinaelekea kumaanisha kuivunja na kuisawazisha ardhi baada ya kulimwa, yaani kulima kwa haro, wala si lazima kufanya malimaji ya kwanza.
- source_word: עֲמָקִים
  choice: mabonde
  rationale: Maana ya kawaida ya עֲמָקִים ni mabonde au sehemu za chini; tafsiri hii inadumisha taswira pana ya eneo la kilimo.
- source_word: אַחֲרֶיךָ
  choice: nyuma yako
  rationale: Kirai hiki kinaonyesha mnyama akimfuata na kuongozwa na mkulima; ‘nyuma yako’ ni cha kawaida na chenye taswira wazi.
