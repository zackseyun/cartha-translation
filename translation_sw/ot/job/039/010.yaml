  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Mfuo’ na ‘haro’ yanahifadhi taswira mahususi ya kazi ya shambani; tanbihi inafafanua maana ya ‘kulima kwa haro’ bila kufuta uwezekano mpana wa kitenzi cha Kiebrania.
