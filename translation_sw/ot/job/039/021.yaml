translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kauli ya sasa ya mazoea ‘hukwangua… hufurahia… hutoka’ inafaa maelezo hai ya tabia ya farasi. Kiashirio cha tanbihi [a] kimewekwa mara moja baada ya ‘silaha.’
