  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: sw
  text: Hukwangua ardhi bondeni na hufurahia nguvu zake; hutoka kukabiliana na silaha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukabiliana na vita.” Neno la Kiebrania linaweza kumaanisha silaha kwa ujumla, na kwa upanuzi vita vyenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: hukwangua ardhi
  rationale: Kitenzi חפר maana yake ya msingi ni ‘kuchimba,’ lakini hapa kinaeleza farasi wa vita akikwaruza au kukwangua ardhi kwa kwato zake. ‘Hukwangua ardhi’ hutoa picha hiyo kwa Kiswahili cha kawaida bila kuongeza maana isiyokuwamo.
- source_word: בָעֵמֶק
  choice: bondeni
  rationale: עֵמֶק humaanisha bonde au nchi tambarare ya chini; ‘bondeni’ ni tafsiri ya moja kwa moja na ya asili katika muktadha huu.
- source_word: וְיָשִׂישׂ
  choice: na kufurahia
  rationale: שׂושׂ huonyesha kufurahi sana au kushangilia. ‘Kufurahia’ ni ya kawaida na inaonyesha kuwa nguvu zake ndizo chanzo au jambo la furaha yake.
- source_word: בְּכֹחַ
  choice: nguvu zake
  rationale: Muundo בְּכֹחַ unaweza kuwa ‘katika nguvu’ au ‘kwa sababu ya nguvu.’ ‘Kufurahia nguvu zake’ ni Kiswahili cha asili huku kikihifadhi uhusiano huo bila kuufafanua kupita kiasi.
- source_word: יֵצֵא
  choice: hutoka
  rationale: יָצָא ni kitenzi cha kawaida cha ‘kutoka.’ ‘Hutoka’ huhifadhi kauli hiyo bila kuongeza wazo la kukimbia kwa kasi ambalo halijasemwa wazi.
- source_word: לִקְרַאת
  choice: kwenda kukabiliana na
  rationale: לִקְרַאת hueleza kwenda kuonana, kukutana, au kukabiliana na kitu kinachokuja. Katika muktadha wa vita, ‘kwenda kukabiliana na’ ni wazi na ya kawaida.
- source_word: נָשֶׁק
  choice: silaha
  rationale: נֶשֶׁק hapa inaweza kumaanisha silaha kwa ujumla, na kwa upanuzi vita vyenyewe. ‘Silaha’ huhifadhi maana halisi na thabiti ya neno.
