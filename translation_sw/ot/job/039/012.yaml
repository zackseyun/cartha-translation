  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: sw
  text: Je, utamwamini kwamba atarudisha mbegu yako na kuikusanya kwenye uwanja wako wa kupuria?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mbegu yako”; katika muktadha huu huenda inamaanisha nafaka au mazao yaliyovunwa na kurudishwa kutoka shambani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין
  choice: utamwamini
  rationale: Hifili ya אמן hapa inauliza kama Ayubu ataweka tumaini lake kwa nyati; ‘kumwamini’ linaonyesha utegemezi wa vitendo.
- source_word: בּוֹ
  choice: -m- (katika utamwamini)
  rationale: Kiwakilishi cha nafsi ya tatu, umoja wa kiume, kinamrejelea nyati aliyetajwa katika muktadha.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inatanguliza jambo ambalo nyati anaaminiwa kulifanya.
- source_word: יָשׁוּב
  choice: atarudisha
  rationale: Ingawa שׁוב kwa kawaida ni ‘kurudi,’ hapa ina yambwa ‘mbegu yako,’ hivyo maana ya kusababisha irudi imewasilishwa kwa ‘atarudisha.’
- source_word: זַרְעֶךָ
  choice: mbegu yako
  rationale: Huhifadhi neno halisi זרע pamoja na maana yake ya kimuktadha ya nafaka au mazao yaliyovunwa.
- source_word: גָּרְנְךָ
  choice: uwanja wako wa kupuria
  rationale: גֹּרֶן ni mahali pa kupuria nafaka, si ghala la kuhifadhia.
- source_word: יֶאֱסֹף
  choice: kuikusanya kwenye
  rationale: אָסַף ni kukusanya; kiwakilishi ‘-i-’ kinarejelea mbegu/nafaka, na ‘kwenye’ kinaonyesha mahali inapokusanywa.
