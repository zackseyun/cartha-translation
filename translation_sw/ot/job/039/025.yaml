  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: sw
  text: Kila tarumbeta inapolia, yeye husema[a], “Aha!” Kutoka mbali hunusa vita, ngurumo ya makamanda na kilio cha vita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tarumbeta inapolia”; nahau ya Kiebrania inaonyesha wakati ambapo tarumbeta inalia, na huenda pia ikadokeza “kila inapolia.”
    reason: lexical_alternative
  - marker: b
    text: “Ngurumo” ni sitiari ya kelele kubwa ya makamanda. “Kilio cha vita” kinaweza pia kutafsiriwa “kelele” au “mlio wa ishara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: Kila tarumbeta inapolia
  rationale: Nahau hii huonyesha wakati au tukio la kusikika kwa tarumbeta. Tafsiri hii ni ya asili katika Kiswahili na inaweza pia kudokeza kurudiwa kwa tukio.
- source_word: שֹׁפָר
  choice: tarumbeta
  rationale: Katika muktadha huu ni chombo cha kutoa ishara ya kijeshi; “tarumbeta” ni neno linaloeleweka kwa urahisi bila kulazimisha maelezo ya aina ya pembe.
- source_word: יֹאמַר
  choice: husema
  rationale: Kitenzi cha kawaida cha kusema kimehifadhiwa ili kudumisha uhuishaji wa kishairi wa farasi bila kuongeza maana ya “kupiga kelele.”
- source_word: הֶאָח
  choice: Ahaa!
  rationale: Mshangao huu unaonyesha hamu na msisimko wa farasi anayejiandaa kwa vita.
- source_word: וּמֵרָחוֹק
  choice: Akiwa mbali
  rationale: Huwasilisha wazi umbali ambao farasi akiwa huko anatambua vita.
- source_word: יָרִיחַ
  choice: hunusa
  rationale: Kitenzi hiki huonyesha kutambua kwa harufu; “hunusa” kinahifadhi taswira halisi na hai.
- source_word: מִלְחָמָה
  choice: vita
  rationale: Neno hili linafaa kwa mandhari ya mapigano na ni la kawaida katika Kiswahili.
- source_word: רַעַם
  choice: ngurumo
  rationale: Maana halisi ya “ngurumo” imehifadhiwa kama sitiari ya kelele kubwa ya uwanjani.
- source_word: שָׂרִים
  choice: makamanda
  rationale: Katika mazingira ya kijeshi, hawa ni viongozi wa vikosi, si lazima wakuu wa kifalme.
- source_word: וּתְרוּעָה
  choice: kilio cha vita
  rationale: Neno linaweza kumaanisha kelele ya watu au mlio wa ishara; hapa “kilio cha vita” kinafaa sambamba na makamanda na mandhari ya mapigano.
