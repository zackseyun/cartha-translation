  yaml_path: translation/ot/job/039/003.yaml
  text: They crouch down[a], they bring forth their young[b]; they cast off their labor pains.
translation:
  language: sw
  text: Hujikunyata, huzaa watoto wao; huondokana na utungu wao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: Huinama chini
  rationale: Kitenzi כרע kinaonyesha kushusha mwili au kupiga magoti. Katika muktadha wa wanyama wanaozaa, “huinama chini” ni Kiswahili cha kawaida kinachoonyesha mkao huo bila kuingiza maana ya ibada.
- source_word: יַלְדֵיהֶן
  choice: watoto wao
  rationale: Nomino inayotokana na ילד humaanisha wale waliozaliwa. Katika Kiswahili, “watoto wao” hutumika kwa kawaida pia kuhusu watoto wa wanyama na inaeleweka kwa urahisi.
- source_word: תְּפַלַּחְנָה
  choice: huzaa
  rationale: Katika muktadha huu kitenzi kinaeleza kitendo cha kutoa uzao. “Huzaa” ni sahihi, wazi, na cha asili zaidi katika Kiswahili kuliko tafsiri ndefu.
- source_word: חֶבְלֵיהֶם
  choice: utungu wao
  rationale: חבל hapa humaanisha maumivu ya kuzaa, si kamba. “Utungu” ni neno la kawaida na mahususi katika Kiswahili kwa maumivu ya kujifungua.
- source_word: תְּשַׁלַּחְנָה
  choice: huondokana na
  rationale: שלח kimsingi ni kupeleka mbali au kuachilia. Katika muktadha wa baada ya kuzaa, “huondokana na” huwasilisha kwa kawaida wazo la utungu kuachiliwa au kumalizika.
