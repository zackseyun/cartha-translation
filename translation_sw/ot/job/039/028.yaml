lexical_decisions:
- source_word: סֶלַע
  choice: jabali
  rationale: Katika sehemu ya kwanza neno hili linaonyesha mwamba mrefu na wenye mteremko mkali unaofaa kuwa makao ya tai; “jabali” ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: יִשְׁכֹּן
  choice: hukaa
  rationale: Wakati usiotimilika hapa unaeleza tabia ya kawaida ya ndege. “Hukaa” linafikisha maana ya kuishi au kufanya makao bila uzito usio wa lazima.
- source_word: וְיִתְלֹנָן
  choice: na hulala huko usiku
  rationale: Kitenzi kinamaanisha kukaa au kulala mahali usiku. “Huko” linadokezwa na mahali palipotajwa katika muktadha na linafanya Kiswahili kiwe cha asili.
- source_word: עַל
  choice: juu ya
  rationale: Kihusishi kinaonyesha mahali alipo juu ya mwamba.
- source_word: שֶׁן סֶלַע
  choice: jino la mwamba
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya sehemu ya mwamba iliyochongoka, huku tanbihi ikiifafanua.
- source_word: סֶלַע
  choice: mwamba
  rationale: Katika tukio la pili, “mwamba” linafaa katika muundo “jino la mwamba” na linaepusha urudiaji mzito wa “jabali,” huku likibaki katika uwanja uleule wa maana.
- source_word: וּמְצוּדָה
  choice: na ngome
  rationale: Neno linaweza kumaanisha ngome au mahali salama pasipofikika kwa urahisi. “Ngome” linahifadhi sitiari ya mahali pa kujilinda katika mazingira ya miamba.
