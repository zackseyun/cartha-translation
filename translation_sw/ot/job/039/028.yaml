translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Kauli za mazoea “hukaa” na “hulala” zinaendana na maelezo ya tabia ya tai katika muktadha. Taswira ya “jino la mwamba” imehifadhiwa badala ya kusawazishwa kuwa “kilele.”
