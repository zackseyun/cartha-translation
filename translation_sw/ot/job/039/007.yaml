  text: Huyacheka makelele ya mji[a]; hasikii kelele za mtu anayemwendesha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mshindo wa mji” au “ghasia za mji.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kelele za msimamizi wa kazi.” Neno la Kiebrania linaweza kumaanisha kwa upana zaidi mtu anayemwendesha, anayesimamia kwa shuruti, au anayewadai wengine kazi.
