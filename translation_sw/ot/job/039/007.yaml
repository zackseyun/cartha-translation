lexical_decisions:
- source_word: יִשְׂחַק
  choice: anayacheka
  rationale: Kitenzi שׂחק hapa kinaonyesha punda-mwitu akiyapuuza kwa dharau makelele ya mjini. ‘Anayacheka’ huhifadhi picha ya Kiebrania bila kuipanua kuwa ‘anayadhihaki.’
- source_word: לַהֲמוֹן
  choice: makelele ya
  rationale: הָמוֹן inaweza kumaanisha kelele, mshindo, au ghasia. ‘Makelele’ ni Kiswahili cha kawaida kinachosisitiza sauti na msongamano wa maisha ya mjini; uwezekano mpana zaidi umeonyeshwa katika tanbihi.
- source_word: קִרְיָה
  choice: mjini
  rationale: קִרְיָה ni mji. Usemi ‘makelele ya mjini’ ni wa asili katika Kiswahili na hapa unawakilisha kwa ujumla maisha ya makazi ya watu, yaliyo kinyume na uhuru wa punda-mwitu.
- source_word: תְּשֻׁאוֹת
  choice: kelele
  rationale: Nomino hii ya wingi humaanisha vilio au sauti kubwa. ‘Kelele’ ni ya kawaida na inaendana na sauti ya mtu anayemwendesha mnyama.
- source_word: נֹגֵשׂ
  choice: mwenye kumwendesha
  rationale: נֹגֵשׂ inaweza kumaanisha mtu anayeendesha, anayesimamia kwa shuruti, au anayedai kazi. Katika muktadha wa mnyama, ‘mwenye kumwendesha’ inaeleza moja kwa moja mtu anayetaka kumtawala bila kuingiza kwa lazima dhana maalumu ya msimamizi wa watumwa.
- source_word: לֹא יִשְׁמָע
  choice: hasikii
  rationale: Tafsiri hii huhifadhi maana ya moja kwa moja ya ‘hasikii.’ Muktadha unaweza kudokeza kwamba hajali, lakini tafsiri haibadilishi kitendo cha kusikia kuwa maelezo ya hali ya moyo.
