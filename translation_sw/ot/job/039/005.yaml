  text: Who has let the wild donkey go free? Who has untied the bonds of the swift donkey?[a]
translation:
  language: sw
  text: Ni nani aliyemwachilia punda-mwitu awe huru? Na ni nani aliyefungua vifungo vya punda-mwitu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa hutumia עָרוֹד (arod), neno jingine ambalo huenda likamaanisha punda-mwitu; wengine hulitafsiri “onager.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha maswali ya balagha yanayosemwa na Mungu.
- source_word: שִׁלַּח
  choice: aliyemwachilia
  rationale: Katika muktadha huu kitenzi kina maana ya kumwacha au kumfungua mnyama aende huru.
- source_word: פֶּרֶא
  choice: punda-mwitu
  rationale: Neno hili humaanisha punda wa porini asiye na kufugwa; “punda-mwitu” ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: חָפְשִׁי
  choice: awe huru
  rationale: Hueleza hali ya uhuru ambayo punda-mwitu anaachiliwa aingie; muundo huu ni wa asili katika Kiswahili.
- source_word: וּמֹסְרוֹת
  choice: kamba
  rationale: Neno la Kiebrania linataja vitu vya kumzuia au kumfunga mnyama. “Kamba” ni halisi na ya kawaida katika muktadha huu, bila kutumia lugha ya kizamani.
- source_word: עָרוֹד
  choice: punda-mwitu
  rationale: Ni neno jingine la Kiebrania kwa punda wa porini, huenda aina maalumu inayoitwa onaga. Tafsiri haiongezi wazo la “wepesi,” ambalo halijaelezwa wazi katika neno lenyewe.
- source_word: פִתֵּחַ
  choice: aliyefungua
  rationale: Likitumiwa pamoja na kamba au vifungo, kitenzi hiki humaanisha kuvilegeza au kuvifungua.
