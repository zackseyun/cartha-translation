lexical_decisions:
- source_word: מִשָּׁם
  choice: Kutoka huko
  rationale: Hutaja mahali ambapo tai yuko anapotazama; ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: חָפַר
  choice: hutafuta
  rationale: Ingawa kitenzi mara nyingi humaanisha ‘kuchimba,’ hapa kinaeleza kitendo cha tai kutafuta chakula, si kuchimba kihalisi.
- source_word: אֹכֶל
  choice: chakula
  rationale: Hili ndilo maana pana ya nomino; katika muktadha ni windo analokula tai, lakini ‘chakula’ hubaki karibu na Kiebrania.
- source_word: לְמֵרָחוֹק
  choice: mbali
  rationale: Huonyesha umbali mkubwa na kuungana kwa kawaida na ‘hutazama’ katika Kiswahili.
- source_word: עֵינָיו
  choice: macho yake
  rationale: Huhifadhi picha halisi ya macho ya tai na umbo la wingi la Kiebrania.
- source_word: יַבִּיטוּ
  choice: hutazama
  rationale: Hueleza kutazama kwa makusudi; umbo la Kiswahili linapatana na kiima ‘macho yake.’
