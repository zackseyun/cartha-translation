  text: ו/אפרח/ו יְעַלְעוּ דָ֑ם וּ/בַ/אֲשֶׁ֥ר חֲ֝לָלִ֗ים שָׁ֣ם הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/039/030.yaml
  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: sw
  text: Makinda yake hunyonya damu[a], na palipo na waliouawa[b], ndipo ilipo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Makinda yake hulamba damu.” Kitenzi cha Kiebrania kina taswira hai na kinaweza kumaanisha kunyonya, kubugia, au kulamba.
    reason: lexical_alternative
  - marker: b
    text: Au, “palipo na maiti.” Kiebrania kinasema “waliouawa,” kikikazia kifo cha vurugu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: makinda yake
  rationale: Katika muktadha huu neno linamaanisha watoto wa ndege; “makinda” ni neno la kawaida la Kiswahili kwa watoto wa ndege bila kubainisha hatua yao ya ukuaji kupita kiasi.
- source_word: יְעַלְעוּ
  choice: hunyonya
  rationale: Kitenzi hiki kinaonyesha tendo la kuvuta au kumeza kwa hamu. “Hunyonya” kinahifadhi taswira hai na ya kutisha inayohusishwa na damu, huku tanbihi ikitaja uwezekano wa “kulamba.”
- source_word: דָם
  choice: damu
  rationale: Hii ndiyo maana ya moja kwa moja, na hakuna sababu ya kuilainisha katika muktadha huu.
- source_word: וּבַאֲשֶׁר
  choice: na palipo na
  rationale: Muundo huu unatanguliza kishazi cha mahali; “palipo na” ni Kiswahili cha asili na wazi katika sentensi hii.
- source_word: חֲלָלִים
  choice: waliouawa
  rationale: Neno la Kiebrania huelekeza kwa watu au viumbe waliouawa, hasa kwa kifo cha vurugu; “waliouawa” huhifadhi mkazo huo kuliko “maiti.”
- source_word: שָׁם הוּא
  choice: ndipo ilipo
  rationale: Kiwakilishi kinamrejelea ndege wa muktadha uliotangulia. “Ndipo ilipo” ni usemi wa asili wa Kiswahili unaolingana na mkazo wa mahali wa Kiebrania.
