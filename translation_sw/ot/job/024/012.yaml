base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: sw
  text: Kutoka mjini, wanaokufa wanaugua[a], na nafsi za waliouawa zinalilia msaada; lakini Mungu halioni hilo kuwa jambo lisilofaa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka mjini watu wanaugua.” Neno la Kiebrania מְתִים ni gumu hapa na linaweza kumaanisha “watu” badala ya “wanaokufa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “lakini Mungu halioni hilo kuwa upumbavu,” au “lakini Mungu halihesabii kuwa kosa.” Nahau ya Kiebrania ni ngumu, na kinachorejelewa na “hilo” hakijaelezwa wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: Kutoka mjini
  rationale: Kihusishi מִן pamoja na עִיר kwa kawaida huonyesha mahali ambako kuugua kunatoka; tafsiri hii inadumisha taswira ya Kiebrania.
- source_word: מְתִים
  choice: wanaokufa
  rationale: Neno hili ni gumu na linaweza kueleweka kuwa ‘watu,’ lakini ulinganifu wake na waliouawa unaelekeza kwenye watu walio karibu kufa.
- source_word: יִנְאָקוּ
  choice: wanaugua
  rationale: Kitenzi kinaonyesha sauti ya maumivu makali; ‘kuugua’ ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: וְנֶפֶשׁ חֲלָלִים
  choice: na nafsi za waliouawa
  rationale: נֶפֶשׁ inaweza kuwa nafsi, uhai, au mtu; ‘nafsi’ inadumisha lugha ya chanzo, huku חֲלָלִים ikitaja waliopigwa na kuuawa. Wingi wa Kiswahili unafuata חֲלָלִים.
- source_word: תְּשַׁוֵּעַ
  choice: zinalilia msaada
  rationale: Umbo hili linaonyesha kilio cha dharura cha kutaka msaada; ‘kulilia msaada’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וֶאֱלוֹהַּ
  choice: lakini Mungu
  rationale: Kiunganishi kina nguvu ya kupinga hapa, kikitofautisha mateso ya watu na kutokuchukua hatua kunakoonekana kwa Mungu.
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: halioni hilo kuwa upotovu
  rationale: Nahau hii ni ngumu. תִּפְלָה inaweza kumaanisha upotovu, upumbavu, au jambo lisilofaa; ‘upotovu’ hudumisha hukumu hasi bila kuifanya hasa kuwa shtaka la kisheria.
theological_decisions:
- issue: Mungu kutoonekana kuitikia dhuluma
  choice: lakini Mungu halioni hilo kuwa upotovu
  alternative: lakini Mungu hawahesabii kuwa na hatia / lakini Mungu hakioni kilio hicho kuwa upumbavu
  rationale: Kauli inahifadhi malalamiko makali ya Ayubu kuhusu Mungu kuonekana kutochukua hatua, bila kuyageuza kuwa hitimisho la kimafundisho au kuyatatua kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na mvutano wa kifungu cha mwisho vimehifadhiwa; tanbihi zinaonyesha utata halisi wa Kiebrania.
