  text: הֵ֤ן פְּרָאִ֨ים בַּֽ/מִּדְבָּ֗ר יָצְא֣וּ בְּ֭/פָעֳלָ/ם מְשַׁחֲרֵ֣י לַ/טָּ֑רֶף עֲרָבָ֥ה ל֥/וֹ לֶ֝֗חֶם לַ/נְּעָרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: sw
  text: Tazama, kama punda-mwitu nyikani, hutoka kwenda kufanya kazi yao, wakitafuta chakula tangu mapema[a]; nyika ni chakula kwake, kwa ajili ya watoto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiamka mapema kutafuta chakula.” Neno lililotafsiriwa “chakula” linaweza pia kumaanisha mawindo au riziki, kutegemeana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina umoja, “kwake,” kisha neno linaloweza kutafsiriwa “watoto,” “vijana,” au “wavulana.” Umoja huo unaweza kueleweka kwa maana ya kugawa, yaani kwa kila mmoja wao.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili linavuta fikira za msomaji na kuanzisha picha kwa nguvu; “Tazama” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: פְּרָאִים
  choice: punda-mwitu
  rationale: Humaanisha punda wasiofugwa wanaoishi porini; umbo hili linaeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: Neno la Kiebrania linaweza kumaanisha eneo lisilolimwa, pori, au jangwa; “nyikani” linahifadhi upana huo kuliko “jangwani” pekee.
- source_word: בְּפָעֳלָם
  choice: kwenda kwenye kazi yao
  rationale: Hueleza shughuli yao ya kutafuta riziki; usemi huu ni wa asili katika Kiswahili na hauongezi wazo la ajira rasmi.
- source_word: מְשַׁחֲרֵי
  choice: wakitafuta ... tangu mapema
  rationale: Kitenzi hiki kinaweza kueleza kutafuta kwa bidii tangu alfajiri au kuamka mapema kwa kusudi hilo; tafsiri inahifadhi kutafuta pamoja na wazo la wakati wa mapema.
- source_word: לַטָּרֶף
  choice: mawindo
  rationale: Maana ya msingi ni kitu kilichowindwa au kupatikana; “mawindo” hudumisha taswira ya punda-mwitu, ingawa katika muktadha kinawakilisha chakula cha kuishi.
- source_word: עֲרָבָה
  choice: nyika
  rationale: Humaanisha uwanda mkavu au nyika; “nyika” ni neno la kawaida la Kiswahili linalofaa picha hii.
- source_word: לוֹ
  choice: chake
  rationale: Kiebrania kina umoja, “kwa ajili yake”; umoja umehifadhiwa kwa “chake” badala ya kusawazishwa kimya kuwa wingi.
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa maana halisi ni “mkate,” hapa neno hilo linawakilisha riziki ya msingi; “chakula” ni cha asili na wazi katika sentensi hii.
- source_word: לַנְּעָרִים
  choice: kwa ajili ya watoto
  rationale: Neno linaweza kumaanisha vijana, wavulana, au watoto; katika muktadha wa kutafuta riziki, “watoto” linaeleza vizuri wale wanaotegemea mtu huyo bila kuweka jinsia isiyolazimu.
theological_decisions:
- issue: Je, wahusika ni punda-mwitu halisi au watu maskini wanaofananishwa nao?
  choice: Imehifadhiwa kama tashbihi bila kuongeza utambulisho ndani ya aya.
  alternative: Kutaja wazi “maskini” au “watu hao.”
  rationale: Kiebrania huanza kwa taswira ya punda-mwitu lakini muktadha unaelekea kwa watu wanaotafuta riziki. Kutotaja wahusika kwa jina kunahifadhi nguvu na mvutano wa kishairi wa chanzo.
- issue: Umoja wa לוֹ katikati ya maelezo ya wingi
  choice: Umoja umehifadhiwa katika “chakula chake.”
  alternative: Kusawazisha kuwa “chakula chao.”
  rationale: Umoja unaweza kuwa wa kugawa, ukimwakilisha kila mmoja katika kundi, lakini maandishi hayatumii wingi. Tafsiri haipaswi kuondoa hali hiyo isiyo ya kawaida bila taarifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na mabadiliko yasiyo ya kawaida kutoka wingi kwenda umoja yamehifadhiwa kadiri ya uwezekano, huku tanbihi zikieleza tafsiri mbadala.
