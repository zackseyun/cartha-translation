  text: וְ/עֵ֤ין נֹאֵ֨ף שָׁ֤מְרָֽה נֶ֣שֶׁף לֵ֭/אמֹר לֹא תְשׁוּרֵ֣/נִי עָ֑יִן וְ/סֵ֖תֶר פָּנִ֣ים יָשִֽׂים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: sw
  text: Jicho la mzinzi hungojea machweo[a], akisema, “Hakuna jicho litakaloniona”; naye huufunika uso wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “giza la jioni.” Neno la Kiebrania linaweza kumaanisha kipindi cha mwanga hafifu mwishoni mwa mchana.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “naye huweka uficho wa uso.” Maana ni kwamba anafunika au anaficha uso wake ili asitambuliwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: jicho
  rationale: Neno halisi ni “jicho”; linahifadhi taswira ya mtu anayechunguza kwa siri na pia ya kuonekana na jicho la mwingine.
- source_word: נֹאֵף
  choice: mzinzi
  rationale: Kivumishi-jina hiki humaanisha mwanamume anayefanya uzinzi; “mzinzi” ni neno la kawaida, fupi, na lenye hadhi katika Kiswahili.
- source_word: שָׁמְרָה
  choice: hungojea
  rationale: Ingawa maana ya msingi ni kutunza au kuangalia, hapa muktadha unaonyesha kusubiri wakati wa giza kwa matarajio.
- source_word: נֶשֶׁף
  choice: machweo
  rationale: Neno linaweza kutaja wakati wa mwanga hafifu, hasa jioni; “machweo” ni la asili na linafaa kwa muktadha wa tendo la siri.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha kauli, iwe ya kutamkwa au ya moyoni, bila kulazimisha mojawapo.
- source_word: תְשׁוּרֵנִי
  choice: litakaloniona
  rationale: Kitenzi humaanisha kutazama au kuona; “kuniona” ni cha kawaida na huhifadhi wazo la kutambuliwa kwa macho.
- source_word: וְסֵתֶר פָּנִים
  choice: huufunika uso wake
  rationale: Kirai cha Kiebrania kimebanwa na kihalisi ni kuhusu “uficho wa uso”; tafsiri hii inaeleza kwa Kiswahili tendo la kuficha uso au utambulisho.
- source_word: יָשִׂים
  choice: huufunika
  rationale: Kihalisi ni kuweka au kutia; kwa kuhusishwa na uficho wa uso, “huufunika” ni Kiswahili cha kawaida kinachoeleza tendo hilo.
