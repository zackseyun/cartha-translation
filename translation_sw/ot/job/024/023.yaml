  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יִתֶּן ל֣/וֹ לָ֭/בֶטַח וְ/יִשָּׁעֵ֑ן וְ֝/עֵינֵ֗י/הוּ עַל דַּרְכֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: sw
  text: Huwapa usalama[a], nao hutegemezwa[b]; macho yake yako juu ya njia zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umoja, “humpa usalama” na “naye hutegemezwa”; hapa umetumiwa wingi kwa maana ya pamoja kwa sababu mstari unamalizia kwa “njia zao.”
    reason: alternative_reading
  - marker: b
    text: 'Au, kwa kufuata umbo la Kiebrania kwa karibu zaidi: “Humpa usalama, naye hutegemezwa; macho yake yako juu ya njia zao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: Huwapa
  rationale: Qal imperfect ya נתן inaeleza tendo la kutoa au kujalia; wakati wa mazoea unafaa kauli hii ya kishairi. Kiambishi cha wingi kinawakilisha maana ya pamoja inayodokezwa na mwisho wa mstari.
- source_word: לוֹ
  choice: -wa- (wao)
  rationale: Kimaumbo ni umoja, ‘kwake,’ lakini דַּרְכֵיהֶם ni wingi, ‘njia zao.’ Kiswahili kinatumia wingi kwa maana ya kundi, huku umoja halisi wa Kiebrania ukihifadhiwa katika tanbihi.
- source_word: לָבֶטַח
  choice: usalama
  rationale: Neno בטח hapa lina maana ya hali ya kuwa salama; ‘usalama’ ni la kawaida na halilazimishi maana ya ndani ya kujiamini.
- source_word: וְיִשָּׁעֵן
  choice: nao hutegemezwa
  rationale: Nifal ya שׁען inaweza kumaanisha kutegemezwa au kujiegemeza. Kauli tendwa ‘hutegemezwa’ inadumisha umbo na hali inayotokana na kupewa usalama.
- source_word: וְעֵינֵיהוּ
  choice: macho yake
  rationale: Wingi wa Kiebrania ‘macho yake’ umetafsiriwa moja kwa moja. Kiambishi cha umoja kinadumishwa bila kumtaja mhusika waziwazi.
- source_word: עַל
  choice: juu ya
  rationale: Katika usemi huu inaonyesha uangalizi unaoelekezwa kwenye mwenendo wao; ‘macho yake yako juu ya’ ni usemi wazi na wenye hadhi.
- source_word: דַּרְכֵיהֶם
  choice: njia zao
  rationale: ‘Njia’ inadumisha sitiari ya דרך na pia inaweza kueleweka kuwa mwenendo bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Mabadiliko kati ya umoja na wingi katika mstari
  choice: Sehemu ya kwanza imetafsiriwa kwa wingi (‘huwapa ... nao’), lakini ‘macho yake’ imebaki katika umoja.
  alternative: 'Kwa kufuata maumbo kwa karibu zaidi: ‘Humpa usalama, naye hutegemezwa; macho yake yako juu ya njia zao.’'
  rationale: Kiebrania kina ‘kwake’ na kitenzi cha umoja, lakini kinamalizia kwa ‘njia zao.’ Wingi katika tafsiri kuu unaonyesha kundi la waovu katika muktadha, huku tanbihi zikihifadhi sintaksia ya umoja na mvutano wa kifungu. Mwenye ‘macho’ hatajwi wazi katika mstari, kwa hiyo tafsiri haiongezi jina ‘Mungu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi; ‘njia zao’ inadumisha sitiari, na ‘hutegemezwa’ inadumisha uwezekano wa maana tendwa wa Kiebrania.
