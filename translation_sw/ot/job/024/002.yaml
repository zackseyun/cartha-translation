lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: alama za mipaka
  rationale: Nomino hii ya wingi inarejelea mipaka ya mali, yaelekea hasa mawe au alama halisi zilizotenganisha mashamba; “alama za mipaka” huonyesha wazi maana hiyo ya kijamii na kisheria.
- source_word: יַשִּׂיגוּ
  choice: husogeza
  rationale: Katika muktadha wa mipaka ya mashamba, kitenzi hiki hueleza kuhamisha alama kwa lengo la kuvamia ardhi ya mwingine. “Husogeza” ni ya kawaida na huhifadhi uwezekano wa kuhamisha bila kudai kwa lazima kuwa alama zinaondolewa kabisa.
- source_word: עֵדֶר
  choice: kundi la mifugo
  rationale: Nomino ya umoja yenye maana ya mkusanyiko kwa kawaida hurejelea kundi la kondoo au mbuzi. “Kundi la mifugo” ni wazi kwa msomaji wa Kiswahili bila kubainisha aina ambayo Kiebrania hakuitaji hapa.
- source_word: גָּזְלוּ
  choice: hunyakua
  rationale: Kitenzi kinaonyesha kuchukua isivyo halali, mara nyingi kwa nguvu. “Hunyakua” huhifadhi uzito wa uporaji wa wazi kuliko neno linaloweza kumaanisha wizi wa siri tu.
- source_word: וַיִּרְעוּ
  choice: na kulilisha
  rationale: Mzizi רעה hapa una maana ya kulisha au kuchunga kundi malishoni. “Kulilisha” ni Kiswahili cha kawaida na huonyesha kwamba baada ya kulinyakua, wahalifu hulitunza waziwazi kana kwamba ni lao.
