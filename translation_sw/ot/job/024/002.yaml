translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa na wenye heshima. Kauli ya mazoea “husogeza… hunyakua” inafaa kwa maelezo ya tabia ya waovu katika muktadha. Viwakilishi vya ngeli vimewekwa wazi ili “kulilisha” lirejelee kundi.
