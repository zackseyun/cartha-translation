  text: Wao husogeza alama za mipaka[a]; hunyakua kundi la mifugo na kulichunga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huondoa alama za mipaka.” Kitenzi cha Kiebrania kinaweza kumaanisha kuhamisha au kuondoa alama za mali ili kuvamia ardhi ya mwingine.
