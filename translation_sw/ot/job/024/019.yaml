  text: צִיָּ֤ה גַם חֹ֗ם יִגְזְל֥וּ מֵֽימֵי שֶׁ֗לֶג שְׁא֣וֹל חָטָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: sw
  text: Ukame na joto pia hunyakua maji ya theluji[a]; vivyo hivyo Sheoli[b] huwanyakua wale waliotenda dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maji yatokanayo na theluji inayoyeyuka.” Kiebrania ni “maji ya theluji.”
    reason: lexical_alternative
  - marker: b
    text: “Sheoli” ni istilahi ya Kiebrania inayomaanisha makao ya wafu; pia inaweza kutafsiriwa “kaburi.”
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: ukame
  rationale: Neno hili hueleza hali ya ukavu; “ukame” ni Kiswahili cha kawaida na kinafaa pamoja na “joto” kama nguvu zinazoyaondoa maji.
- source_word: גַם
  choice: pia
  rationale: Hudumisha maana ya nyongeza katika kishazi cha kwanza bila kulazimisha tafsiri ya “hata.”
- source_word: חֹם
  choice: joto
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino hii.
- source_word: יִגְזְלוּ
  choice: hunyakua
  rationale: Kitenzi גזל kina wazo la kupora au kutwaa kwa nguvu. “Hunyakua” kinadumisha taswira hiyo hai na kinaweza kutumiwa kishairi kwa ukame na joto.
- source_word: מֵימֵי שֶׁלֶג
  choice: maji ya theluji
  rationale: Tafsiri hii inafuata kwa karibu muundo halisi wa Kiebrania na kuacha wazi ikiwa ni theluji inayoyeyuka au maji yatokanayo nayo.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Uhawilishaji wa istilahi ya Kiebrania unahifadhi dhana ya makao ya wafu bila kuifanya moja kwa moja kuwa kaburi au adhabu ya mwisho. Umbo “Sheoli” linaingia kwa urahisi katika sarufi ya Kiswahili.
- source_word: חָטָאוּ
  choice: wale waliotenda dhambi
  rationale: Kitenzi timilifu cha wingi, kihalisi “walitenda dhambi,” kinaeleweka hapa kama wale wanaochukuliwa na Sheoli. Usemi huu unadumisha nguvu ya kitenzi badala ya kukibadili tu kuwa nomino “wenye dhambi.”
theological_decisions:
- issue: Maana ya שְׁאוֹל
  choice: Sheoli, yaani makao ya wafu
  alternative: kaburi; kuzimu; mauti
  rationale: Kutumia “Sheoli” katika mstari na kuifafanua katika tanbihi kunahifadhi upana wa istilahi ya Kiebrania na kuepuka kuingiza wazo maalumu la adhabu ya mwisho ambalo mstari wenyewe haulazimishi.
- issue: Uhusiano wa vishazi viwili
  choice: “vivyo hivyo” linaonyesha ulinganisho wa kishairi
  alternative: Kuviunganisha bila kiunganishi, kama ilivyo kwa ukaribu zaidi katika Kiebrania
  rationale: Kiebrania kinaweka vishazi kwa mfuatano na kuacha ulinganisho ueleweke. “Vivyo hivyo” huufanya uhusiano huo uwe wa asili katika Kiswahili bila kubadili dai la kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa wasomaji wa kawaida. “Hunyakua” huhifadhi nguvu ya taswira ya Kiebrania, na “vivyo hivyo” hufafanua ulinganisho uliodokezwa na mfuatano wa vishazi.
