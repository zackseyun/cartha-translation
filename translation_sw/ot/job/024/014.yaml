  yaml_path: translation/ot/job/024/014.yaml
  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: sw
  text: Kunapopambazuka muuaji huamka[a]; huwaua maskini na wahitaji[b], na wakati wa usiku huwa kama mwizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nuru inapokuja” au “Wakati wa nuru”; Kiebrania kinarejelea kihalisi kuja kwa nuru, yaelekea mapambazuko.
    reason: lexical_alternative
  - marker: b
    text: Au, “huua maskini na wahitaji”; hapa Kiebrania kimetumia kitenzi cha jumla cha “kuua,” tofauti na neno lililotafsiriwa “muuaji.” Maandishi makuu yanahifadhi tofauti hiyo kwa kusema “huwaua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: Kunapopambazuka
  rationale: Kirai hiki kihalisi kinahusu kuja kwa nuru na katika muktadha huu kinaonyesha wakati wa mapambazuko; ‘kunapopambazuka’ ni Kiswahili cha kawaida na cha kishairi.
- source_word: יָקוּם
  choice: huamka
  rationale: Kitenzi קום hapa kinaonyesha kuinuka au kuamka ili kuanza kutenda; hali ya mazoea ya Kiswahili inafaa kwa maelezo haya ya tabia.
- source_word: רוֹצֵחַ
  choice: muuaji
  rationale: Kivumishi-tendaji hiki kimetumiwa kama nomino kumtaja mtu anayeua; ‘muuaji’ ni neno la kawaida na lenye uzito unaofaa.
- source_word: יִקְטָל
  choice: huwaua
  rationale: Kiebrania kimetumia kitenzi cha kawaida cha kuua, tofauti na mzizi wa neno ‘muuaji’; tafsiri hii inadumisha tofauti hiyo ya msamiati.
- source_word: עָנִי וְאֶבְיוֹן
  choice: maskini na wahitaji
  rationale: Jozi hii inawataja watu walio dhaifu kijamii na wenye mahitaji; maneno yote mawili yamehifadhiwa kwa msisitizo wa asili.
- source_word: וּבַלַּיְלָה
  choice: na wakati wa usiku
  rationale: Kirai hiki kinaweka mazingira ya pili ya wakati na kuhifadhi utofautishaji kati ya mapambazuko na usiku.
- source_word: יְהִי
  choice: huwa
  rationale: Pamoja na kiambishi cha ulinganisho כ, kitenzi hiki kinaeleza hali au namna ya kutenda; ‘huwa’ huhifadhi usemi wa moja kwa moja bila kuufanya kuwa ‘hutenda’.
- source_word: כַגַּנָּב
  choice: kama mwizi
  rationale: Kiambishi כ kinaonyesha ulinganisho wa moja kwa moja; ‘kama mwizi’ ni Kiswahili asilia.
