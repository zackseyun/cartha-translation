  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: sw
  text: Humwinda mwanamke tasa asiyezaa[a], wala hamtendei mema mjane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humla mwanamke tasa”; kitenzi cha Kiebrania maana yake ya msingi ni “kuchunga/kulisha,” lakini katika muktadha huu huenda kina maana ya kumwinda au kumnyanyasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: Humwinda
  rationale: Kitenzi רעה kwa kawaida humaanisha kuchunga au kulisha, lakini hapa muktadha wa ukatili dhidi ya watu walio hatarini unaashiria kuwavamia au kuwanyonya. “Humwinda” huwasilisha maana hiyo hasi kwa Kiswahili cha kawaida huku tanbihi ikihifadhi maana halisi ya kimsingi.
- source_word: עֲקָרָה
  choice: mwanamke tasa
  rationale: Hutaja mwanamke asiyeweza kuzaa; “mwanamke tasa” ni wazi, ya kawaida, na huhifadhi jinsia na umoja wa neno la Kiebrania.
- source_word: לֹא תֵלֵד
  choice: asiyezaa
  rationale: Hufuata kwa karibu maana ya “hazai/asiyezaa” bila kuongeza dhana ya uwezo kwa kusema “asiyeweza kuzaa.”
- source_word: אַלְמָנָה
  choice: mjane
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi hili la kijamii lililo hatarini.
- source_word: לֹא יְיֵטִיב
  choice: hamtendei mema
  rationale: Hiphil ya יטב inaweza kumaanisha kutenda mema, kumtendea mtu vizuri, au kumnufaisha. “Hamtendei mema” ni ya asili na huhifadhi uzito wa kimaadili.
