  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: sw
  text: Yeye ni mwepesi juu ya uso wa maji[a]; sehemu yao katika nchi imelaaniwa[b]; haelekei kwenye njia ya mashamba ya mizabibu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye ni mwepesi juu ya maji.” Kiebrania ni kigumu; wengine huelewa mwanzo huu kuwa unaeleza hali ya kupita upesi badala ya mwendo wa haraka.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni kigumu; wengine husoma “sehemu yake katika nchi imelaaniwa” badala ya “sehemu yao katika nchi imelaaniwa.”
    reason: textual_variant
  - marker: c
    text: Au, “harudi kwenye njia ya mashamba ya mizabibu,” labda kwa maana kwamba harudi tena kwenye ardhi iliyolimwa au sehemu zenye ustawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: mwepesi
  rationale: Neno hili kimsingi humaanisha ‘mwepesi’ na linaweza kudokeza mwendo wa haraka au hali ya kupita upesi. Tafsiri hii inahifadhi utata wa mstari huu mgumu.
- source_word: עַל־פְּנֵי מַיִם
  choice: juu ya uso wa maji
  rationale: Hii inafuata taswira ya Kiebrania kwa karibu huku ikiwa Kiswahili kinachoeleweka.
- source_word: תְּקֻלַּל
  choice: imelaaniwa
  rationale: Umbo la Pual la קלל linaeleweka kwa urahisi zaidi kama hali tendwa ya ‘kulaaniwa’.
- source_word: חֶלְקָתָם
  choice: sehemu yao
  rationale: Kiambishi cha wingi katika maandishi yaliyotolewa kinaunga mkono ‘yao’; ‘sehemu’ inaweza kumaanisha fungu au milki yao.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: ‘Nchi’ inaendana kwa kawaida na sehemu au milki, ingawa ‘duniani’ pia inawezekana kisemantiki.
- source_word: לֹא יִפְנֶה
  choice: haelekei kwenye
  rationale: Huhifadhi maana ya msingi ya ‘kugeuka/kuelekea’ bila kuamua kwamba lazima iwe ‘kurudi’.
- source_word: דֶּרֶךְ כְּרָמִים
  choice: njia ya mashamba ya mizabibu
  rationale: Tafsiri hii huhifadhi muundo na taswira ya njia inayohusishwa na maeneo ya mizabibu bila kufafanua kupita kiasi.
