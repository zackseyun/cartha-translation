  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: sw
  text: Shambani wanavuna chakula cha mifugo[a], nao wanaokota masazo katika shamba la mizabibu[b] la mwovu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchanganyiko wa chakula cha mifugo” au “chakula chake cha mifugo.” Neno la Kiebrania linamaanisha chakula cha mifugo, si nafaka ya kawaida ya kuliwa na watu; kiambishi cha “-ke” kinaweza kumrejelea mhusika ambaye hajatambulishwa wazi.
    reason: lexical_alternative
  - marker: b
    text: Au, “wanaokota masazo ya shamba la mizabibu la mwovu.” Kiebrania hakirudii wazi kihusishi “katika”; kitenzi chake kinaweza kulichukua “shamba la mizabibu” kama yambwa.
    reason: lexical_alternative
  - marker: c
    text: “Mwovu” huenda akamrejelea mwenye shamba aliye mwovu; au neno hilo linaweza kumrejelea mtu mwovu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: Shambani
  rationale: Kiambishi בְּ ni cha mahali, na ‘shambani’ ni Kiswahili cha kawaida kinachohifadhi maana ya kuwa ndani au katika eneo la shamba bila kusisitiza umilikaji.
- source_word: בְּלִילוֹ
  choice: malisho[a]
  rationale: בְּלִיל ni chakula cha mifugo, hasa mchanganyiko wa malisho, si nafaka ya kawaida ya kuliwa na watu. Kiambishi cha nafsi ya tatu umoja wa kiume kimeachwa kisitajwe wazi katika mstari kwa sababu rejeleo lake haliko wazi, lakini kimeelezwa katika tanbihi.
- source_word: יקצירו
  choice: wanavuna
  rationale: Kitenzi קצר humaanisha kuvuna; ‘wanavuna’ ni neno la sasa na la kawaida linalofaa muktadha wa kilimo.
- source_word: וְכֶרֶם
  choice: nao ... katika shamba la mizabibu[b]
  rationale: וְ huunganisha kishazi cha pili, na כֶּרֶם ni shamba la mizabibu. ‘Katika’ limeongezwa kwa ufasaha wa Kiswahili, ingawa Kiebrania hakirudii kihusishi waziwazi.
- source_word: רָשָׁע
  choice: la mwovu[c]
  rationale: Kivumishi cha umoja רָשָׁע kimetumiwa kama nomino. ‘Mwovu’ huhifadhi umoja na kutomwekea mhusika utambulisho zaidi ya ule uliomo katika matini.
- source_word: יְלַקֵּשׁוּ
  choice: wanaokota masazo
  rationale: Piel ya לקשׁ huelekea kumaanisha kukusanya mazao yaliyobaki au yaliyoiva baadaye. ‘Wanaokota masazo’ huwasilisha tendo la kuokota mabaki ya mavuno kwa Kiswahili kinachoeleweka.
