translation:
  language: sw
  text: Wanamnyakua yatima kutoka kifuani[a], na huchukua rehani kutoka kwa maskini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanamnyakua yatima kutoka kifuani mwa mama yake.” Usemi wa Kiebrania ni mgumu; maana yake inaonekana kuwa waovu humchukua kwa nguvu hata mtoto yatima ambaye bado ananyonya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: Humwondoa ... kwa nguvu
  rationale: Kitenzi גזל huonyesha kuchukua kwa nguvu au kwa dhuluma. Kiswahili hiki kinaonyesha ukatili huo bila kudokeza tu wizi wa siri.
- source_word: מִשֹּׁד
  choice: kifuani
  rationale: Neno la Kiebrania hapa ni gumu. Tafsiri ya jadi inayolielewa kuwa ‘kifua’ au ‘kifua cha mama’ inafaa muktadha wa ukatili dhidi ya walio dhaifu; ‘kifuani’ hubaki fupi na huepuka kuongeza ‘mama’ katika mstari wenyewe.
- source_word: יָתוֹם
  choice: yatima
  rationale: יָתוֹם humaanisha mtoto asiye na mzazi, hasa asiye na baba, na ‘yatima’ ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: וְעַל
  choice: kutoka kwa
  rationale: Pamoja na חבל katika muktadha wa deni, kihusishi hiki humtambulisha mtu ambaye dhamana inachukuliwa kwake; ‘kutoka kwa’ ni Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja ‘juu ya.’
- source_word: עָנִי
  choice: maskini
  rationale: Katika muktadha wa kunyonywa kwa kuchukuliwa dhamana, maana ya hali ya kiuchumi ‘maskini’ inafaa zaidi kuliko ‘mteswa’ au ‘mhanga.’
- source_word: יַחְבֹּלוּ
  choice: kuchukua dhamana
  rationale: Kitenzi חבל hapa kinahusu kuchukua kitu kama rehani au dhamana ya deni. ‘Kuchukua dhamana’ ni wazi na cha kawaida katika Kiswahili.
