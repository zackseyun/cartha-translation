  text: עָר֣וֹם הִ֭לְּכוּ בְּלִ֣י לְב֑וּשׁ וּ֝/רְעֵבִ֗ים נָ֣שְׂאוּ עֹֽמֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: sw
  text: 'Wanatembea uchi, bila mavazi;

    wakiwa na njaa, wanabeba miganda ya nafaka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mganda wa nafaka.” Nomino ya Kiebrania iko katika umoja, lakini hapa huenda imetumiwa kwa maana ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: uchi
  rationale: Neno hili linaonyesha kutokuwa na nguo au kuwa na nguo chache sana. Katika muktadha huu, “uchi” ni tafsiri ya moja kwa moja na ya kawaida inayoonyesha hali yao ya kunyimwa mahitaji.
- source_word: הִלְּכוּ
  choice: wanatembea
  rationale: Kitenzi הלך humaanisha kwenda au kutembea. Wakati wa sasa wa Kiswahili unaonyesha hali na tendo linaloendelea katika maelezo haya.
- source_word: בְּלִי
  choice: bila
  rationale: Kihusishi hiki huonyesha kutokuwapo kwa kitu; “bila” ni sawa la kawaida na wazi katika Kiswahili.
- source_word: לְבוּשׁ
  choice: mavazi
  rationale: Nomino hii humaanisha vazi au mavazi. “Mavazi” ni ya kawaida baada ya “bila” na inaepuka kudokeza kwamba wanakosa vazi moja tu.
- source_word: רְעֵבִים
  choice: wakiwa na njaa
  rationale: Kivumishi hiki humaanisha wenye njaa. Kauli “wakiwa na njaa” ni ya asili katika Kiswahili na haiongezi kiwango cha njaa kisichotajwa na Kiebrania.
- source_word: נָשְׂאוּ
  choice: wanabeba
  rationale: נשא hapa humaanisha kubeba. “Wanabeba” ni usemi wa kawaida kwa wafanyakazi wanaosafirisha mazao yaliyovunwa.
- source_word: עֹמֶר
  choice: miganda ya nafaka
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, katika muktadha huu yaweza kutumiwa kwa maana ya jumla. Wingi “miganda ya nafaka” unaeleza kwa kawaida mizigo inayobebwa na wafanyakazi wengi, huku umoja ukihifadhiwa katika tanbihi kama uwezekano halisi.
