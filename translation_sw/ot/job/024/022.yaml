  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: sw
  text: Lakini anawaburuta wenye nguvu kwa nguvu zake; huinuka[a], lakini hana uhakika wa kuishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huinuka, wala haamini katika uhai,” au “huinuka, na hakuna aliye na uhakika wa kuishi.” Mhusika wa kifungu cha mwisho katika Kiebrania si wazi kabisa.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: huwaburuta
  rationale: Kitenzi משׁך kwa kawaida humaanisha kuvuta au kuburuta. Hapa, pamoja na ‘wenye nguvu’ na kirai ‘kwa nguvu zake,’ ‘huwaburuta’ kinaonyesha kitendo cha kutumia nguvu bila kutegemea maana ya kiidioma ya kurefusha maisha.
- source_word: אַבִּירִים
  choice: wenye nguvu
  rationale: Neno hili humaanisha walio na nguvu au uwezo. ‘Wenye nguvu’ ni Kiswahili cha kawaida kinachoweza kurejelea nguvu za kimwili au mamlaka ya kijamii.
- source_word: בְּכֹחוֹ
  choice: kwa nguvu zake
  rationale: Kirai hiki kinaonyesha chombo au njia inayotumiwa; ‘kwa nguvu zake’ kinahifadhi maana hiyo na kiambishi cha nafsi ya tatu.
- source_word: יָקוּם
  choice: huinuka
  rationale: קום katika qal humaanisha kuinuka au kusimama. ‘Huinuka’ kinahifadhi taswira ya Kiebrania bila kuamua ikiwa ni kuanza kutenda, kujitokeza kwa nguvu, au kuendelea kusimama.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: lakini hana uhakika kwamba ataendelea kuishi
  rationale: Kifungu hiki kwa muundo wake ni ‘wala/na haamini katika maisha.’ Kiswahili kilichochaguliwa kinaeleza kwa kawaida ukosefu wa uhakika kuhusu kubaki hai, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na pia utata wa mhusika.
theological_decisions:
- issue: Mhusika asiye wazi katika kifungu cha mwisho
  choice: 'Matini kuu inaendeleza mhusika yuleyule wa umoja: ‘hana uhakika kwamba ataendelea kuishi.’'
  alternative: ‘huinuka, wala haamini kuwa ataishi,’ au ‘huinuka, na hakuna aliye na uhakika wa kuishi.’
  rationale: Kitenzi יַאֲמִין kiko katika umoja wa kiume na kwa kawaida kinaweza kumrejelea mhusika wa kifungu kilichotangulia. Hata hivyo, Kiebrania ni kifupi na muktadha unaweza kuruhusu maana ya jumla kwamba maisha ya watu hayana usalama. Tanbihi inadumisha utata huo bila kuingiza hitimisho la kimadhehebu.
- issue: Mhusika wa matendo katika mstari
  choice: Kiwakilishi cha nafsi ya tatu hakitajwi wazi kwa jina, kama ilivyo katika Kiebrania.
  alternative: Kumtaja moja kwa moja ‘mwovu’ au ‘Mungu.’
  rationale: Kiebrania hakina nomino ya mhusika katika mstari huu. Kutaja ‘mwovu’ au ‘Mungu’ katika matini kuu kungeondoa utata wa marejeo ambao chanzo kimeuacha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Huwaburuta’ ni cha moja kwa moja na chenye nguvu; ‘ataendelea kuishi’ ni usemi wa kawaida unaowasilisha wazo la kuwa na uhai bila kuwa wa kitaalamu kupita kiasi.
