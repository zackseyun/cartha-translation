lexical_decisions:
- source_word: יַטּוּ
  choice: Huwageuza
  rationale: Hifili ya נטה ina maana ya kusababisha mtu ageuke au aondoke upande. “Huwageuza” inadumisha maana hiyo ya kisababishi bila kuongeza wazi wazo la kutumia nguvu ambalo halitajwi moja kwa moja.
- source_word: אֶבְיוֹנִים
  choice: wahitaji
  rationale: אֶבְיוֹנִים hurejelea watu maskini wenye mahitaji na walio katika hali ya kudhurika. “Wahitaji” pia huitofautisha kwa kiasi na עֲנִיֵּי katika sehemu ya pili.
- source_word: מִדָּרֶךְ
  choice: waache njia
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida wazo la kuwageuza watu kutoka katika njia, huku “njia” ikihifadhi uwezekano wa kumaanisha barabara, kijia, au mwenendo.
- source_word: יַחַד
  choice: pamoja
  rationale: “Pamoja” huonyesha hali ya kundi zima kama ilivyo katika יַחַד.
- source_word: חֻבְּאוּ
  choice: hujificha
  rationale: Puali ya חבא inaweza kueleweka kama hali ya kufichwa au kama kujificha kutokana na shinikizo. “Hujificha” ni ya kawaida katika Kiswahili na inadumisha picha ya maskini kujiondoa wasionekane, bila kutaja sababu isiyosemwa.
- source_word: עֲנִיֵּי אָרֶץ
  choice: maskini wa nchi
  rationale: עָנִי inaweza kumaanisha maskini, mwenye kuteswa, au mnyonge. Katika mazingira haya “maskini” ni wazi; אָרֶץ imetafsiriwa “nchi,” ingawa “dunia” pia inawezekana.
theological_decisions:
- issue: Iwapo חֻבְּאוּ ni hali ya kufichwa au tendo la kujificha
  choice: hujificha
  alternative: wamefichwa / wamejificha
  rationale: Umbo la Kiebrania ni Puali na linaweza kusisitiza hali inayotokana na kufichwa, lakini katika muktadha linaweza pia kuwasilisha maskini wanaojisitiri. Tafsiri kuu imetumia Kiswahili cha kawaida bila kuongeza mtendaji anayewaficha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ya mazoea “hu-” inafaa mfululizo wa matendo ya waovu katika muktadha; sentensi imewekwa fupi ili kuhifadhi usambamba wa kishairi.
