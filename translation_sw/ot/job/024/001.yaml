base_translation:
  language: en
  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: sw
  text: Kwa nini nyakati[a] hazijahifadhiwa na Mwenyezi, na kwa nini wale wanaomjua hawaoni siku zake[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyakati zilizowekwa”; mstari huu unaweza kumaanisha, “Kwa nini nyakati zilizowekwa hazijahifadhiwa na Mwenyezi?”
    reason: lexical_alternative
  - marker: b
    text: Huenda “siku zake” zikamaanisha siku ambazo Mungu hutenda kwa hukumu au kuingilia kati.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni njia ya kawaida na ya moja kwa moja ya kuanzisha swali la malalamiko katika Kiswahili.
- source_word: מִשַּׁדַּי
  choice: na Mwenyezi
  rationale: Pamoja na kitenzi cha hali ya kutendwa, kiambishi מ־ kinaeleweka hapa kuwa na uhusiano wa mtendaji au chanzo. “Mwenyezi” ni tafsiri fupi na yenye heshima ya שַׁדַּי.
- source_word: נִצְפְּנוּ
  choice: hazijawekwa
  rationale: צפן inaweza kumaanisha kuficha, kuhifadhi, au kuweka akiba. “Hazijawekwa” huhifadhi hali ya kutendwa bila kuingiza wazi wazo la kufichwa ambalo muktadha haujalifafanua.
- source_word: עִתִּים
  choice: nyakati
  rationale: Neno hili linaweza kumaanisha nyakati kwa ujumla au nyakati zilizowekwa. “Nyakati” huhifadhi ufupi na uwazi wa kishairi wa Kiebrania.
- source_word: וְיֹדְעָיו
  choice: wale wanaomjua
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili kwa kitenzi-jina chenye kiambishi cha nafsi, huku ikihifadhi maana ya uhusiano wa kumjua Mungu.
- source_word: חָזוּ
  choice: hawazioni
  rationale: חזָה humaanisha kuona au kutazama. “Hawazioni” inaendana na nomino ya wingi “siku” na kudumisha maana ya msingi.
- source_word: יָמָיו
  choice: siku zake
  rationale: Tafsiri halisi ya wingi wenye kiambishi cha nafsi ya tatu; inadumisha fumbo la kishairi bila kulifafanua kuwa hukumu au uingiliaji wa Mungu.
theological_decisions:
- issue: Maana ya “siku zake” kuhusiana na Mungu
  choice: Kudumisha usemi halisi “siku zake.”
  alternative: Siku zake za hukumu; nyakati anapotenda; hukumu zake zilizowekwa.
  rationale: Kiebrania kina usemi mfupi wa kishairi ambao huenda ukarejelea siku ambazo Mungu huingilia kati au kuhukumu. Matini kuu haifafanui zaidi ili kuhifadhi mvutano na utata wa kitheolojia wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali na urudiaji wa “kwa nini” hudumisha nguvu ya malalamiko ya Ayubu; usemi “siku zake” umeachwa kwa ufupi wake wa kishairi.
