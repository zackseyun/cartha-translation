  yaml_path: translation/ot/job/024/017.yaml
  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: sw
  text: Kwa maana asubuhi ni giza kuu kwao wote[a][b], kwa maana kila mmoja wao huyafahamu matisho ya giza kuu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana asubuhi ni kama giza kuu kwao wote.” Mpangilio wa maneno ya Kiebrania ni mfupi na unaweza kueleweka kwa namna hii.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania צַלְמָוֶת (tsalmaveth) linaweza pia kutafsiriwa “kivuli cha mauti.” Hapa yaelekea linamaanisha giza kuu au utusitusi badala ya mauti yenyewe.
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kiebrania kiko katika umoja, “yeye hujua/hutambua.” Huenda kinatumika kwa maana ya kijumla, kikimrejelea kila mmoja wa watu waovu wanaotajwa; ndiyo sababu tafsiri inasema “kila mmoja wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo kuhusu watu waovu kwa nguvu ya ufafanuzi au sababu.
- source_word: יַחְדָּו
  choice: wote
  rationale: Ingawa maana ya msingi ni ‘pamoja,’ hapa ina nguvu ya kijumla inayorejelea kundi lote.
- source_word: בֹּקֶר
  choice: asubuhi
  rationale: Ni maana ya kawaida ya neno hili na inadumisha utofauti mkali kati ya asubuhi na giza kuu.
- source_word: לָמוֹ
  choice: kwao
  rationale: Inaonyesha jinsi asubuhi ilivyo kwa kundi linalotajwa.
- source_word: צַלְמָוֶת
  choice: giza kuu
  rationale: Katika muktadha huu neno linaonyesha giza zito au utusitusi, si lazima kifo chenyewe.
- source_word: יַכִּיר
  choice: yeye hulijua
  rationale: Huhifadhi umoja wa kiume wa kitenzi cha Kiebrania na maana ya kumtambua au kulifahamu kutokana na uzoefu.
- source_word: בַּלְהוֹת
  choice: jambo la kutisha
  rationale: Wingi wa Kiebrania unaweza kutumiwa kwa maana ya jumla ya vitisho au mambo ya kutisha; umoja wa Kiswahili unaendana kwa kawaida na kiwakilishi cha kitu katika kitenzi.
