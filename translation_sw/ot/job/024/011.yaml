base_translation:
  language: en
  yaml_path: translation/ot/job/024/011.yaml
  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: sw
  text: Kati ya safu zao[a] wanakamua mafuta[b]; wanakanyaga vinu vya kukamulia divai, lakini wana kiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuta zao.” Neno la Kiebrania linaweza kumaanisha safu au kuta; katika muktadha huu huenda linarejelea maeneo ya kilimo yaliyopangwa kwa safu au kuzungushiwa kuta.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “wanakamua mafuta” ni kigumu. Kihalisi kinahusiana na mafuta au mwangaza, lakini katika muktadha huu huenda kinamaanisha kutoa mafuta ya zeituni.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין שׁוּרֹתָם
  choice: Katikati ya safu zao
  rationale: בֵּין inaonyesha mahali, na שׁוּרֹתָם inaweza kumaanisha safu au kuta zao. Katika mazingira haya ya kazi ya kilimo, “safu zao” ni tafsiri ya moja kwa moja na ya kawaida, huku tanbihi ikihifadhi uwezekano wa “kuta zao.”
- source_word: יַצְהִירוּ
  choice: wanakamua mafuta
  rationale: Kitenzi hiki ni kigumu, lakini katika muktadha wa kilimo kinaelekea kueleza utoaji wa mafuta, hasa mafuta ya zeituni. “Wanakamua mafuta” ni usemi wa asili unaoonyesha uchimbaji huo bila kutaja zeituni ambazo hazijasemwa wazi katika Kiebrania.
- source_word: יְקָבִים
  choice: mashinikizo ya divai
  rationale: Nomino hii hutaja mahali au kifaa cha kukamulia zabibu. “Mashinikizo ya divai” ni wazi kwa msomaji wa kisasa na hudumisha taswira ya uzalishaji wa divai.
- source_word: דָּרְכוּ
  choice: wanakanyaga
  rationale: Kitenzi hiki kwa kawaida humaanisha kukanyaga, na hapa kinaeleza tendo la kukanyaga zabibu katika mashinikizo.
- source_word: וַיִּצְמָאוּ
  choice: lakini wana kiu
  rationale: 'Ingawa ו inaweza kutafsiriwa “na,” muktadha unaonyesha kinaya: wafanyakazi huzalisha divai lakini wao wenyewe wana kiu. “Lakini” huwasilisha utofauti huo bila kuondoa maana ya msingi.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Katikati ya” na “wanakanyaga” ni maneno yanayoeleweka kwa urahisi; “mashinikizo ya divai” hudumisha istilahi ya kilimo. Tanbihi moja inaweka wazi utata wa שׁוּרֹתָם na יַצְהִירוּ bila kuubebesha mstari alama nyingi.
