  yaml_path: translation/ot/job/024/025.yaml
  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: sw
  text: Na ikiwa sivyo[a], basi ni nani atakayethibitisha kwamba mimi ni mwongo na kuifanya kauli yangu kuwa si kitu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nani atakayenikanusha na kuifanya kauli yangu kuwa si kitu?”
    reason: Hutoa mbadala wa kimsamiati wa יַכְזִיבֵנִי (“kunikanusha”) unaoruhusiwa na muktadha wa changamoto ya balagha.
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Lakini ikiwa sivyo
  rationale: Kifungu hiki kinaanzisha changamoto ya masharti inayotegemea madai yaliyotangulia ya Ayubu. “Ikiwa sivyo” ni Kiswahili cha kawaida na huhifadhi maana ya Kiebrania; “lakini” huonyesha nguvu ya changamoto katika muktadha.
- source_word: אֵפוֹ
  choice: imewasilishwa kwa nguvu ya mpangilio wa sentensi, bila neno la pekee
  rationale: Chembe hii ya mazungumzo huongeza msisitizo au hitimisho. Katika Kiswahili, nguvu yake inaonekana kwa kawaida katika muundo “ikiwa sivyo, ni nani...” bila kulazimisha neno kama “basi,” ingawa “basi” lingewezekana.
- source_word: מִי
  choice: ni nani
  rationale: Hili ni neno la kuuliza linaloanzisha changamoto ya balagha.
- source_word: יַכְזִיבֵנִי
  choice: atakayethibitisha kuwa mimi ni mwongo
  rationale: Hifili ya כזב inaweza kumaanisha kuonyesha mtu kuwa mwongo au kuthibitisha kuwa amesema uongo. Tafsiri hii huhifadhi nguvu ya binafsi na ya kimahakama ya changamoto ya Ayubu.
- source_word: וְיָשֵׂם
  choice: na kuyafanya
  rationale: Kitenzi “kuweka” kimetumiwa hapa kwa maana ya kusababisha hali fulani; “kuyafanya” ni Kiswahili cha asili katika muundo unaofuata.
- source_word: לְאַל
  choice: kuwa si kitu
  rationale: Kirai hiki humaanisha kufanya jambo liwe batili, lisilo na maana, au kama si kitu. Uchaguzi huu huhifadhi picha fupi ya Kiebrania bila kuieleza kupita kiasi.
- source_word: מִלָּתִי
  choice: maneno yangu
  rationale: Nomino ya Kiebrania ni umoja, “neno/kauli yangu,” lakini katika Kiswahili “maneno yangu” ni usemi wa kawaida kwa hotuba au hoja ya mtu na unaeleweka vizuri katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imehifadhi muundo wa changamoto ya balagha na kutatua kiwakilishi fiche cha “ikiwa sivyo” kwa njia ya kawaida ya Kiswahili bila kuongeza fundisho la kitheolojia.
