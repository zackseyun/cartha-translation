base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: sw
  text: 'Wanainuliwa kwa muda mfupi tu, kisha hawapo tena;

    wanadhoofishwa; wanakusanywa kama wale wengine wote,

    na wanakatwa kama kilele cha suke la nafaka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wananyauka.” Kitenzi cha Kiebrania kinaeleweka kwa namna mbalimbali; katika picha hii ya mavuno kinaweza kumaanisha kukatwa au kunyauka.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹמּוּ מְּעַט
  choice: Wanainuliwa kwa muda mfupi tu
  rationale: רום inaonyesha kuinuliwa au kufikia cheo cha juu, na מעט inaeleweka kwa maana ya muda kutokana na kauli inayofuata kuhusu kutokuwapo kwao.
- source_word: וְאֵינֶנּוּ
  choice: kisha hawapo tena
  rationale: Nahau hii ya Kiebrania huonyesha kutoweka au kutokuwapo tena. Ingawa umbo la kiambishi ni la umoja, hapa linatumika kwa kila mmoja katika kundi linalotajwa kwa vitenzi vya wingi.
- source_word: וְהֻמְּכוּ
  choice: wanashushwa
  rationale: Tafsiri hii inadumisha picha ya kugeuzwa kutoka hali ya kuinuliwa hadi hali ya chini bila kuongeza wazo maalumu la kuaibishwa.
- source_word: כַּכֹּל
  choice: kama watu wote
  rationale: Kauli hii inaonyesha kwamba nao wanapatwa na hatima ya kawaida ya wanadamu wote; “watu” imewekwa wazi kwa Kiswahili cha kawaida.
- source_word: יִקָּפְצוּן
  choice: wanakusanywa
  rationale: Kitenzi hiki ni nadra na maana yake inajadiliwa. “Wanakusanywa” huhifadhi wazo linalowezekana la kukusanywa pamoja, huku tanbihi ikitaja uwezekano wa kuondolewa.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: kama kichwa cha suke la nafaka
  rationale: שִׁבֹּלֶת ni suke, yaani sehemu ya mmea inayobeba punje, na רֹאשׁ ni kichwa au sehemu yake ya juu. Usemi huu unahifadhi picha ya mavuno.
- source_word: יִמָּלוּ
  choice: wanakatwa
  rationale: Katika picha ya suke la nafaka, neno hili linaweza kueleweka kuwa kukatwa. Kwa kuwa linaweza pia kuhusishwa na kunyauka, uwezekano huo umehifadhiwa katika tanbihi.
