  text: הֵ֤מָּה הָיוּ֮ בְּֽ/מֹרְדֵ֫י א֥וֹר לֹֽא הִכִּ֥ירוּ דְרָכָ֑י/ו וְ/לֹ֥א יָ֝שְׁב֗וּ בִּ/נְתִיבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: sw
  text: Hao ni miongoni mwa wanaoiasi nuru[a]; hawazitambui njia zake[b], wala hawadumu katika mapito yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hao walikuwa miongoni mwa walioiasi nuru.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa wakati uliopita (“walikuwa”), lakini katika muktadha huu wa kishairi huenda kinaeleza kundi la watu wenye tabia inayoendelea.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “njia zake ... mapito yake.” Viambishi hivyo vinaelekea zaidi kurejelea “nuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הָיוּ
  choice: Hao ni
  rationale: Kiwakilishi huru הֵמָּה kina mkazo na katika muktadha kinawaelekezea watu wa aina fulani. Ingawa הָיוּ kwa umbo ni wakati uliopita, hapa shairi linaeleza tabia ya kundi inayoendelea; kwa hiyo wakati wa sasa unasikika kwa kawaida katika Kiswahili.
- source_word: בְּמֹרְדֵי
  choice: miongoni mwa wanaoiasi
  rationale: בְּ hapa inaonyesha kuwa watu hao ni sehemu ya kundi, na umbo linalotokana na kitenzi מרד limewasilishwa kwa kauli tendaji ‘wanaoiasi.’
- source_word: אוֹר
  choice: nuru
  rationale: Neno linaweza kuwa na maana halisi na pia mwangwi wa kimaadili. ‘Nuru’ huhifadhi upana huo bila kuufafanua kupita kiasi.
- source_word: לֹא הִכִּירוּ
  choice: hawazitambui
  rationale: הכיר inaweza kumaanisha kutambua, kujua, au kukiri. ‘Kutambua’ linafaa pamoja na ‘njia’ na huhifadhi uwezekano wa kutokuona au kutokukubali.
- source_word: דְרָכָיו
  choice: njia zake
  rationale: Kiambishi cha nafsi ya tatu, umoja wa kiume katika Kiebrania kinaelekea zaidi kurejelea אוֹר (‘nuru’). Kiswahili ‘zake’ kinarejelea ‘nuru’ kwa upatanisho wa kawaida wa kisarufi.
- source_word: וְלֹא יָשְׁבוּ
  choice: wala hawadumu
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kubaki. Pamoja na mapito, ‘hawadumu’ linaonyesha kutobaki katika mwenendo huo bila kudokeza kuketi kihalisi.
- source_word: בִּנְתִיבֹתָיו
  choice: katika mapito yake
  rationale: נתיבה ni pito au kijia. ‘Mapito’ linahifadhi taswira ya kishairi na utofauti wake na ‘njia’; kiambishi tena kinarejelea ‘nuru.’
theological_decisions:
- issue: Kirejelewa cha viambishi katika ‘njia zake’ na ‘mapito yake’
  choice: Viambishi vinarejelea ‘nuru.’
  alternative: Viambishi vinaweza kueleweka kuwa vinamrejelea mtu anayefikiriwa, hivyo ‘njia zake’ na ‘mapito yake’ zikiwa na maana ya njia za mtu huyo.
  rationale: Kisarufi, nomino ya karibu zaidi ni אוֹר (‘nuru’), ambayo ni umoja wa kiume katika Kiebrania, na taswira ya mstari huu inahusu kuasi nuru. Tafsiri haifanyi nuru kuwa nafsi kwa uwazi zaidi kuliko maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kuasi nuru,’ ‘njia,’ na ‘mapito’ vimehifadhiwa kama taswira zinazoweza kuwa halisi na za kimaadili bila kuondoa mvutano huo.
