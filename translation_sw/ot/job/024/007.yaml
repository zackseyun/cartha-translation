review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence of deprivation in the Hebrew: lodging overnight naked, lacking clothing, and lacking a covering in the cold. However, “cha kujisitiri” can primarily suggest concealing one’s nakedness rather than a covering for warmth; the Hebrew כְּסוּת is best retained as a general covering, with its cold-weather function made clear by the final phrase.'
  naturalness: “Wanalala usiku wakiwa uchi” is understandable and idiomatic. “Cha kujifunika wakati wa baridi” is more natural and contextually precise than “cha kujisitiri dhidi ya baridi,” while avoiding an unnecessarily specific object such as a blanket.
  terminology: Use “mavazi” for לְבוּשׁ and “cha kujifunika” for כְּסוּת. “Wakati wa baridi” closely reflects בַּקָּרָה (‘in the cold’) without over-interpreting the preposition as ‘against.’
  issues:
  - severity: low
    issue: “Cha kujisitiri” is semantically less precise for כְּסוּת.
    rationale: In current Standard East African Swahili, kujisitiri commonly concerns covering oneself for modesty or privacy. Here the immediate concern is a covering amid cold conditions; “cha kujifunika” preserves the broad object and conveys its protective use.
  - severity: low
    issue: “Dhidi ya baridi” is slightly more interpretive than the Hebrew expression.
    rationale: The Hebrew literally situates the lack of covering ‘in the cold.’ “Wakati wa baridi” is natural Swahili and retains that framing.
  revised_text: Wanalala usiku wakiwa uchi[a], bila mavazi, wala hawana cha kujifunika wakati wa baridi.
