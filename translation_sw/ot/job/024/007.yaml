  text: עָר֣וֹם יָ֭לִינוּ מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת בַּ/קָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: sw
  text: Wanalala usiku wakiwa uchi[a], bila mavazi, wala hawana cha kujifunika wakati wa baridi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanapitisha usiku wakiwa uchi, bila vazi, wala hawana kifuniko wakati wa baridi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: wakiwa uchi
  rationale: Kivumishi hiki humaanisha kutokuwa na nguo au kuwa na nguo zisizotosha. ‘Wakiwa uchi’ ni tafsiri ya moja kwa moja na yenye nguvu, inayofaa picha ya dhiki katika muktadha.
- source_word: יָלִינוּ
  choice: wanalala usiku
  rationale: Kitenzi לין humaanisha kukaa au kupitisha usiku mahali. ‘Wanalala usiku’ ni Kiswahili cha kawaida kinachowasilisha tendo hilo katika hali hii ya kukosa makao na mavazi.
- source_word: מִבְּלִי
  choice: bila
  rationale: Muundo huu huonyesha ukosefu au kunyimwa kitu. ‘Bila’ ni tafsiri fupi na ya kawaida.
- source_word: לְבוּשׁ
  choice: mavazi
  rationale: Nomino hii humaanisha vazi au mavazi kwa ujumla. ‘Mavazi’ linahifadhi maana pana bila kutaja aina fulani ya nguo.
- source_word: כְּסוּת
  choice: cha kujisitiri
  rationale: Neno hili humaanisha kifuniko, mara nyingi vazi linalotumika kujisitiri au kujikinga. ‘Cha kujisitiri’ ni usemi wa asili unaohifadhi maana pana bila kulazimisha tafsiri ya ‘blanketi’ au ‘vazi’.
- source_word: בַּקָּרָה
  choice: dhidi ya baridi
  rationale: Nomino hii humaanisha baridi. ‘Dhidi ya baridi’ huonyesha kazi ya kinga inayodokezwa na kitu cha kujisitiri; tafsiri ya karibu zaidi na muundo wa Kiebrania ni ‘wakati wa baridi’ au ‘katika baridi’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wanalala usiku’ ni cha kawaida kwa wasomaji wengi; tanbihi inadumisha uwezekano wa ‘wanapitisha usiku’ na maana ya karibu zaidi ya בַּקָּרָה.
