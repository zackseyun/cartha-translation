  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: sw
  text: Gizani huvunja na kuingia katika nyumba[a]; mchana hujifungia ndani[b]; hawaijui nuru[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Gizani hutoboa nyumba.” Kitenzi cha Kiebrania kinaweza kumaanisha kihalisi kuchimba au kutoboa ili kupenya, yaelekea kupitia ukuta.
    reason: lexical_alternative
  - marker: b
    text: Au, “mchana hujifunga kabisa.” Kiebrania kinaweza kukazia kujifungia au kujificha wakati wa mchana.
    reason: lexical_alternative
  - marker: c
    text: “Nuru” inaweza kumaanisha mwanga wa mchana, lakini katika muktadha inaweza pia kuwa na mwangwi wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתַר
  choice: huvunja na kuingia
  rationale: Kitenzi hiki kimsingi humaanisha kuchimba au kutoboa ukuta ili kuingia. Katika muktadha wa wizi, usemi huu wa Kiswahili unaeleza tendo la kuvunja na kuingia bila kuondoa taswira ya uvamizi.
- source_word: בַּחֹשֶׁךְ
  choice: gizani
  rationale: Hueleza wakati au mazingira ya tendo na kudumisha taswira ya kujificha katika giza.
- source_word: בָּתִּים
  choice: nyumbani
  rationale: Neno la Kiebrania ni wingi wa 'nyumba'; katika Kiswahili, 'kuingia nyumbani' ni usemi wa kawaida unaorejelea makao ya watu kwa maana ya jumla.
- source_word: יוֹמָם
  choice: mchana
  rationale: Huhifadhi ulinganifu wa kishairi kati ya giza la usiku na wakati wa mchana.
- source_word: חִתְּמוּ לָמוֹ
  choice: hujifungia ndani
  rationale: Kitenzi kina maana ya kutia muhuri au kufunga. Pamoja na לָמוֹ, tafsiri hii inaonyesha kwamba wao hujificha kwa kujifungia wakati wa mchana, bila kulazimisha maana moja kupita kiasi.
- source_word: לֹא יָדְעוּ אוֹר
  choice: hawaijui nuru
  rationale: Tafsiri ya karibu inadumisha maana ya kutokuwa na uzoefu au ushirika na nuru, pamoja na uwezekano wa maana halisi na wa kimaadili.
theological_decisions:
- issue: Uwezekano wa 'nuru' kuwa na maana halisi na pia ya kimaadili
  choice: Hawaijui nuru
  alternative: Hawaijui nuru ya mchana; hawataki mambo yaliyo sawa
  rationale: Muktadha unahusu wahalifu wanaokwepa mwanga wa mchana, lakini 'nuru' inaweza pia kuwa na mwangwi wa kimaadili. Tafsiri kuu inadumisha mvutano huo badala ya kuufafanua kwa upande mmoja.
- issue: Kubadilika kutoka umoja katika חָתַר kwenda wingi katika vitenzi vinavyofuata
  choice: 'Kutumia wingi katika mstari wote: ''wao huvunja ... hujifungia ... hawaijui'''
  alternative: Gizani yeye hutoboa nyumba; mchana wao hujifungia
  rationale: Kiebrania huanza kwa umbo la umoja kisha hubadilika kuwa wingi, huenda likimtaja mwovu mmoja kama mwakilishi wa kundi. Kiswahili cha wingi huwasilisha kundi linalozungumziwa kwa uwazi, huku tanbihi ikihifadhi umbo la karibu zaidi na chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi unadumisha ulinganifu wa kishairi kati ya giza, mchana na nuru. 'Huvunja na kuingia' ni usemi unaoeleweka kwa urahisi; tanbihi huhifadhi picha halisi ya kutoboa ukuta.
