  yaml_path: translation/ot/job/024/008.yaml
  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: sw
  text: Wanalowa kwa mvua kubwa za milimani[a]; kwa kukosa mahali pa kujisitiri, wanaukumbatia mwamba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanalowa kwa mkondo wa maji ya mafuriko ya milimani,” au “kwa mvua ya dhoruba ya milimani.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, wanashikamana na mwamba ili kupata mahali pa kujisitiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  choice: na mvua kubwa za milimani
  rationale: זֶרֶם huonyesha mtiririko mkali, gharika ndogo, au mvua inayomiminika kwa nguvu. Katika muktadha wa watu walio wazi bila makao, “mvua kubwa za milimani” huwasilisha hali ya hewa kali kwa Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano wa kijito cha mafuriko au mvua ya dhoruba.
- source_word: יִרְטָבוּ
  choice: wanaloweshwa
  rationale: Kitenzi humaanisha kuwa na unyevunyevu au kulowa. Umbo la “wanaloweshwa” linaonyesha kwamba mvua ndiyo inayowapata, bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: מִבְּלִי מַחְסֶה
  choice: kwa kukosa mahali pa kujisitiri
  rationale: Kirai kinamaanisha kuwa bila hifadhi au kwa kukosa hifadhi. “Mahali pa kujisitiri” ni usemi wa kawaida na wenye heshima unaofaa kwa kinga ya kimwili dhidi ya mvua.
- source_word: חִבְּקוּ
  choice: wanaukumbatia
  rationale: Maana ya msingi ni kukumbatia. Tafsiri hii inahifadhi taswira hai ya Kiebrania; tanbihi inaeleza maana ya kushikamana au kujibana karibu na mwamba ili kupata kinga.
- source_word: צוּר
  choice: mwamba
  rationale: צוּר humaanisha mwamba au jabali. “Mwamba” ni neno la kawaida linalohifadhi picha halisi na linaweza kutumiwa kwa maana ya jumla hapa.
