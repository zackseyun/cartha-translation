  text: Wanawapeleka mbali punda wa yatima[a]; wanachukua ng’ombe wa mjane kama rehani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanawaondoa punda wa yatima.” Kiebrania kina neno “yatima” katika wingi, ambalo linaweza kueleweka kwa maana ya kila yatima mmoja-mmoja au kwa jumla.
