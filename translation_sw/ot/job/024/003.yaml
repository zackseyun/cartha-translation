lexical_decisions:
- source_word: חֲמוֹר
  choice: punda
  rationale: Neno la kawaida na la sasa la Kiswahili kwa mnyama huyu wa kufugwa na kubeba mizigo; umoja wa Kiebrania umehifadhiwa.
- source_word: יְתוֹמִים
  choice: wa yatima
  rationale: Wingi wa Kiebrania umehifadhiwa kwa Kiswahili cha kawaida; unaweza kueleweka kijumla au kwa kila yatima mmoja mmoja.
- source_word: יִנְהָגוּ
  choice: wanawafukuza
  rationale: Kitenzi נהג humaanisha kuendesha au kuongoza mnyama; katika muktadha huu kinaonyesha kuwa punda wanaondolewa kwa nguvu bila kuongeza moja kwa moja wazo la kuiba.
- source_word: יַחְבְּלוּ
  choice: wanamchukua ... kuwa rehani
  rationale: Huhifadhi maana mahususi ya kuchukua mali kama dhamana ya deni, badala ya kuitafsiri kwa ujumla kama kuchukua au kuiba.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Katika Kiswahili cha kawaida, “ng’ombe” ni jina linaloeleweka kwa mnyama huyu wa kazi; Kiebrania kinaweza kumaanisha ng’ombe dume wa kufanyishwa kazi.
- source_word: אַלְמָנָה
  choice: wa mjane
  rationale: Muundo wa umilikaji wa Kiebrania umewakilishwa kwa kawaida kama ng’ombe anayemilikiwa na mjane.
