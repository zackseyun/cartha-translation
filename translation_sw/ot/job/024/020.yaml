  text: יִשְׁכָּ֘חֵ֤/הוּ רֶ֨חֶם מְתָ֘ק֤/וֹ רִמָּ֗ה ע֥וֹד לֹֽא יִזָּכֵ֑ר וַ/תִּשָּׁבֵ֖ר כָּ/עֵ֣ץ עַוְלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: sw
  text: Tumbo la uzazi humsahau; funza humla kwa utamu[a]. Hakumbukwi tena, na udhalimu[b] unavunjwa kama mti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “funza humwona kuwa mtamu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mtu dhalimu anavunjwa kama mti.” Kiebrania kina nomino dhahania “udhalimu/uovu,” ambayo huenda ikamwakilisha mtenda uovu.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ
  choice: humsahau
  rationale: Kitenzi cha Kiebrania kiko katika Qal imperfect chenye kiambishi cha nafsi ya tatu umoja wa kiume. Wakati wa sasa wa mazoea unaendeleza maelezo hai ya hatima yake bila kulazimisha kuwa tukio moja tu la wakati ujao.
- source_word: רֶחֶם
  choice: tumbo la uzazi
  rationale: Hili linahifadhi taswira halisi ya kiungo kilichombeba mtu huyo, bila kuongeza kwa ufafanuzi neno ‘mama yake.’ Ni Kiswahili kinachoeleweka zaidi kwa wasomaji wa kawaida kuliko istilahi ya kitabibu ‘rahimu.’
- source_word: מְתָקוֹ רִמָּה
  choice: funza humla kwa utamu
  rationale: Mzizi מתק unahusu utamu; pamoja na רִמָּה, picha ni ya funza kumwona marehemu kuwa chakula kitamu. Tafsiri hii inafanya nahau ieleweke huku ikihifadhi taswira yake kali.
- source_word: רִמָּה
  choice: funza
  rationale: Nomino ya umoja imetumiwa kwa maana ya jumla. ‘Funza’ inafaa zaidi kwa kiumbe anayekula mwili unaooza kuliko neno pana ‘minyoo.’
- source_word: עוֹד לֹא יִזָּכֵר
  choice: Hakumbukwi tena
  rationale: Niphal imperfect ya זכר pamoja na עוֹד לֹא inaonyesha kukoma kwa kukumbukwa. Muundo wa kutendwa umehifadhiwa kwa Kiswahili kifupi na cha kishairi.
- source_word: וַתִּשָּׁבֵר
  choice: unavunjwa
  rationale: Maana ya kutendwa ya שׁבר imehifadhiwa. Wakati wa sasa unaunganisha mstari huu na maelezo ya jumla ya hatima katika sehemu iliyotangulia.
- source_word: כָּעֵץ
  choice: kama mti
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, na עֵץ hapa kwa kawaida humaanisha ‘mti.’
- source_word: עַוְלָה
  choice: udhalimu
  rationale: Nomino hii dhahania humaanisha uovu, ukosefu wa haki, au udhalimu. ‘Udhalimu’ ni ya asili na yenye hadhi katika Kiswahili, na inaendeleza umbo dhahania la Kiebrania badala ya kulibadili kimya kimya kuwa mtenda maovu.
theological_decisions:
- issue: Iwapo עַוְלָה itafsiriwe kama nomino dhahania au kama mtu dhalimu.
  choice: udhalimu unavunjwa kama mti
  alternative: mtu dhalimu anavunjwa kama mti
  rationale: Umbo la Kiebrania ni nomino dhahania, kwa hiyo matini kuu hulihifadhi. Hata hivyo, huenda nomino hiyo ikatumika kimetonimia kumaanisha mwenye kutenda uovu; uwezekano huo umeonyeshwa katika tanbihi bila kuondoa mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye hadhi. Taswira kali za Kiebrania zimehifadhiwa, huku istilahi na miundo ikibaki wazi kwa msomaji wa kawaida.
