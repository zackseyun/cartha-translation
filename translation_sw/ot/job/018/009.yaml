lexical_decisions:
- source_word: יֹאחֵז
  choice: unamnasa
  rationale: Kitenzi אחז hapa kinaeleza kushika au kunasa; katika taswira ya mtego, “unamnasa” ni Kiswahili cha kawaida na chenye nguvu.
- source_word: בְּעָקֵב
  choice: kisigino
  rationale: עָקֵב ni “kisigino”; muundo wa Kiswahili “unamnasa kisigino” unaonyesha sehemu anayokamatwa bila kulazimisha kihusishi kisicho cha kawaida.
- source_word: פָּח
  choice: mtego
  rationale: פָּח humaanisha mtego au tanzi; “mtego” imetumiwa hapa ili kuitofautisha na nomino adimu katika kipande cha pili.
- source_word: יַחֲזֵק
  choice: inamkamata kwa nguvu
  rationale: Hifili ya חזק hapa ina wazo la kumshika kwa uthabiti; “inamkamata kwa nguvu” huhifadhi uzito wa tendo na usambamba wa kishairi.
- source_word: עָלָיו
  choice: -m- (inamkamata)
  rationale: Kiswahili huonyesha mtu anayelengwa kwa kiambishi cha yambwa katika kitenzi; hivyo uhusiano wa עָלָיו umejumuishwa katika “inamkamata.”
- source_word: צַמִּים
  choice: tanzi
  rationale: Nomino hii adimu inaeleweka kuwa aina ya mtego au kitanzi; “tanzi” huhifadhi tofauti yake na פָּח huku ikiacha utambulisho wake mahususi wazi.
