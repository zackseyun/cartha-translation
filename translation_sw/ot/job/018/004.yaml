  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: sw
  text: Wewe unayejirarua kwa hasira—je, dunia itaachwa kwa ajili yako[a], au mwamba utaondolewa kutoka mahali pake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo wa karibu zaidi na Kiebrania: “Yeye anayeirarua nafsi yake kwa hasira yake.” Kiebrania huanza kwa usemi wa nafsi ya tatu, kisha hubadilika na kumwelekea anayesemeshwa moja kwa moja katika nafsi ya pili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: unayeirarua nafsi yako
  rationale: Kitenzi טֹרֵף kina picha ya kurarua kama mnyama anavyorarua mawindo. Pamoja na נַפְשׁוֹ, kinaonyesha hasira inayomwangamiza mwenyewe. Kiswahili hiki kinahifadhi picha hiyo na pia utata wa נֶפֶשׁ kuwa nafsi, uhai, au mtu mwenyewe.
- source_word: בְּאַפּוֹ
  choice: kwa hasira yako
  rationale: אַף, ingawa maana yake ya msingi ni ‘pua,’ hutumiwa kwa kawaida kumaanisha hasira. Nafsi ya pili inafaa kwa sababu mstari mara moja unamwelekea Ayubu moja kwa moja kwa לְמַעַנְךָ.
- source_word: הֲלְמַעַנְךָ
  choice: je, ... kwa ajili yako
  rationale: Muundo wa swali pamoja na לְמַעַן unauliza kwa kejeli kama utaratibu wa ulimwengu ubadilishwe kwa sababu ya Ayubu.
- source_word: תֵּעָזַב אָרֶץ
  choice: dunia itaachwa
  rationale: Katika ulinganifu huu wa upeo mpana, אָרֶץ inaeleweka vizuri kuwa dunia kuliko nchi. Niphal ya עזב imetafsiriwa kwa hali tendwa ‘itaachwa.’
- source_word: וְיֶעְתַּק צוּר
  choice: au mwamba utaondolewa
  rationale: עתק hapa humaanisha kuhamishwa au kuondolewa kutoka mahali fulani. ‘Utaondolewa’ huonyesha uhamisho huo kwa uwazi na kudumisha ulinganifu na ‘itaachwa.’
- source_word: מִמְּקֹמוֹ
  choice: mahali pake
  rationale: Kiwakilishi kinamrejelea mwamba; Kiswahili cha kawaida hutumia ‘mahali pake’ kwa kitu kisicho na uhai.
theological_decisions:
- issue: Mrejelewa na nguvu ya swali la kejeli
  choice: Bildadi anamkemea Ayubu moja kwa moja kana kwamba anatarajia utaratibu wa ulimwengu ubadilishwe kwa ajili yake.
  alternative: 'Kudumisha nafsi ya tatu katika mwanzo: ‘Yeye anayeirarua nafsi yake kwa hasira yake...’'
  rationale: Kifungu cha mwanzo ni cha nafsi ya tatu kimuundo, lakini לְמַעַנְךָ inayofuata ni nafsi ya pili umoja. Maandishi makuu yanatoa usemi wa moja kwa moja kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi badiliko halisi la kisarufi na utata wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kuirarua nafsi yako’ kimechaguliwa badala ya usemi unaofifisha picha ya Kiebrania; tanbihi inaeleza badiliko la nafsi ya tatu kwenda ya pili.
