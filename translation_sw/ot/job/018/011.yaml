lexical_decisions:
- source_word: סָבִיב
  choice: pande zote
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuzungukwa kutoka kila upande.
- source_word: בִּעֲתֻהוּ
  choice: vinamtia hofu
  rationale: Kitenzi בעת huonyesha kutishwa au kutiwa hofu kali; usemi huu ni wa asili na unaepuka marudio yasiyo laini ya ‘vitisho vinamtisha.’
- source_word: בַלָּהוֹת
  choice: Vitisho
  rationale: Nomino ya wingi ina maana ya mambo ya kutisha au hofu zinazomvamia mtu; ‘vitisho’ huhifadhi picha ya kishairi kwa lugha inayoeleweka.
- source_word: וֶהֱפִיצֻהוּ
  choice: navyo vinamfukuza
  rationale: Ingawa mzizi una maana ya kutawanya, katika muktadha huu kausativi inaeleza vitisho vinavyomsukuma na kumfanya akimbie; ‘vinamfukuza’ huleta maana hiyo kwa Kiswahili cha asili bila kutaja njia zaidi ya maandishi.
- source_word: לְרַגְלָיו
  choice: kwa kufuata nyayo zake
  rationale: Kiebrania ni kihalisi ‘kwenye/kuelekea miguu yake.’ Katika muktadha, huenda picha ni ya vitisho vinavyomwandama kila anapokanyaga; ‘kwa kufuata nyayo zake’ huhifadhi uhusiano na miguu huku ikieleweka vizuri.
