    navyo vinamtawanya miguuni pake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye visigino vyake.” Kiebrania ni kihalisi “miguuni pake,” na huenda kinaonyesha vitisho vinavyomsukuma kila anapokanyaga.
