  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: sw
  text: Nguvu zake zina njaa, na maafa yako tayari kando yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tayari kwa ajili ya kuchechemea kwake.” Neno la Kiebrania linaweza kueleweka kuwa “upande,” au, katika baadhi ya tafsiri, “kuchechemea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: zinadhoofika
  rationale: Katika ushairi huu, Qal imperfect ya היה inaeleza hali inayoendelea au inayotokea, si lazima ombi. Kiswahili cha sasa hutumia kitenzi kinachoeleza matokeo ya kuwa na njaa kwa ufasaha.
- source_word: רָעֵב
  choice: kwa njaa
  rationale: Kivumishi hiki humaanisha kuwa na njaa. Muundo huu pamoja na 'zinadhoofika' unaonyesha njaa kali na kupungua kwa nguvu bila kuongeza wazo lisilo katika Kiebrania.
- source_word: אֹנוֹ
  choice: nguvu zake
  rationale: אוֹן inaweza kumaanisha nguvu, uwezo, au mali. Katika picha hii ya hukumu na maafa yanayokaribia, 'nguvu zake' ndiyo maana inayofaa zaidi.
- source_word: וְאֵיד
  choice: na maafa
  rationale: אֵיד hueleza janga, msiba, au maangamizi. 'Maafa' ni neno la kawaida lakini lenye uzito unaofaa ushairi huu.
- source_word: נָכוֹן
  choice: yako tayari
  rationale: Neno hili huonyesha kitu kilichowekwa imara au kilichoandaliwa. 'Yako tayari' hudumisha picha ya maafa yaliyo karibu kumpata.
- source_word: לְצַלְעוֹ
  choice: kando yake
  rationale: צלע kwa kawaida humaanisha ubavu au upande. 'Kando yake' huwasilisha picha ya maafa yanayomngojea karibu, huku maana mbadala inayohusiana na kujikwaa ikihifadhiwa katika tanbihi.
