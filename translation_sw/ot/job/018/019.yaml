  yaml_path: translation/ot/job/018/019.yaml
  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: sw
  text: Hana mzao wala mjukuu[a] miongoni mwa watu wake, wala hakuna aliyenusurika katika makao yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mzao wa baadaye” badala ya “mjukuu”; maneno haya mawili ya Kiebrania kwa pamoja yanasisitiza kukatizwa kabisa kwa ukoo wake.
    reason: lexical_alternative
  - marker: b
    text: Au “katika maeneo alikokaa kwa muda” au “katika makazi yake”; neno la Kiebrania linaweza kutaja makao au maeneo ya kukaa kwa muda kama mgeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: mzao
  rationale: Neno hili humaanisha mtoto au mtu wa ukoo wa baadaye. “Mzao” ni la kawaida na linaweza kutaja mwendelezo wa kizazi bila kulifinya kuwa “mwana” pekee.
- source_word: נֶכֶד
  choice: mjukuu
  rationale: Neno hili linaweza kumaanisha mjukuu au mzao wa baadaye. Katika jozi hii, “mjukuu” hudumisha utofauti wa maneno mawili na kusisitiza kukatizwa kabisa kwa vizazi.
- source_word: בְּעַמּוֹ
  choice: miongoni mwa watu wake
  rationale: Kirai hiki hutaja jamii ambayo mtu huyo ni sehemu yake; “miongoni mwa watu wake” ni Kiswahili cha asili na huhifadhi maana ya kijamii.
- source_word: שָׂרִיד
  choice: aliyenusurika
  rationale: Neno hili humaanisha mtu aliyebaki au kupona baada ya maangamizi. “Aliyenusurika” ni wazi na huepuka maana maalumu za kitheolojia zinazoweza kuambatana na “masalia.”
- source_word: בִּמְגוּרָיו
  choice: katika makao yake
  rationale: מָגוּר inaweza kutaja makao au mahali pa kukaa kwa muda. “Katika makao yake” ni fupi na ya kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya maeneo ya ugenini.
