  text: יֹ֭אכַל בַּדֵּ֣י עוֹר֑/וֹ יֹאכַ֥ל בַּ֝דָּ֗י/ו בְּכ֣וֹר מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: sw
  text: 'Hula sehemu za ngozi yake;

    mzaliwa wa kwanza wa mauti[a] hula sehemu zake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mzaliwa mkuu wa mauti”; huenda hii ni taswira ya kishairi ya maradhi hatari kabisa au wakala mkuu wa mauti.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאכַל
  choice: hula
  rationale: Kitenzi hiki cha Kiebrania humaanisha kula au kuteketeza. Katika picha hii ya uharibifu, “hula” ni cha moja kwa moja, cha kishairi, na kinaweza kutumiwa bila kutaja wazi mtendaji katika mstari wa kwanza.
- source_word: בַּדֵּי / בַּדָּיו
  choice: sehemu za / sehemu zake
  rationale: Neno linaweza kumaanisha sehemu, viungo, au matawi. “Sehemu” huhifadhi upana wake wa maana na marudio ya neno lilelile bila kuleta usemi usio wa kawaida wa “viungo vya ngozi.”
- source_word: עוֹרוֹ
  choice: ngozi yake
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya עוֹר katika muktadha wa mwili.
- source_word: בְּכוֹר מָוֶת
  choice: mzaliwa wa kwanza wa mauti
  rationale: Tafsiri hii huhifadhi taswira ya kishairi na fumbo la kirai cha Kiebrania badala ya kukifafanua moja kwa moja kuwa ugonjwa au wakala fulani.
theological_decisions:
- issue: Maana ya בְּכוֹר מָוֶת
  choice: Kudumisha usemi “mzaliwa wa kwanza wa mauti” kama mtendaji aliyefananishwa na nafsi.
  alternative: Ugonjwa hatari zaidi; wakala mkuu wa mauti; kifo kibaya zaidi.
  rationale: Kiebrania hakibainishi kwa uhakika kitu kinachowakilishwa na taswira hiyo. Kuiacha katika umbo lake la kishairi huhifadhi mvutano na kutokamilika kwa maana ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko mfupi wa kishairi. “Mauti” limetumiwa badala ya “kifo” ili kudumisha hadhi na uhai wa taswira ya kishairi; marudio ya “hula” na “sehemu” yanaakisi usambamba wa Kiebrania.
