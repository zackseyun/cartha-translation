lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Kitenzi ענה katika fomula hii ya mazungumzo humaanisha kujibu; “akajibu” kinaonyesha kwamba Bildadi anamwitikia Ayubu.
- source_word: בִּלְדַּד
  choice: Bildadi
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: הַשֻּׁחִי
  choice: Mshuhi
  rationale: Ni jina la nasaba au asili ya eneo la Bildadi; umbo “Mshuhi” ni la kawaida na la asili katika Kiswahili.
- source_word: וַיֹּאמַר
  choice: akisema
  rationale: Kitenzi אמר kimewakilishwa ili kuhifadhi fomula ya Kiebrania yenye vitenzi viwili. “Akisema” huepuka uradidi usio wa kawaida wa “akajibu na kusema” huku kikidumisha maana.
- source_word: וַ
  choice: Ndipo
  rationale: Waw ya mwanzo inaendeleza simulizi; “Ndipo” huonyesha mfuatano wa mazungumzo kwa Kiswahili cha sasa.
