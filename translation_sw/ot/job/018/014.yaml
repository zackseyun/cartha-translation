  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: sw
  text: Anang’olewa kutoka katika usalama wa hema lake,[a] naye hupelekwa kwa mfalme wa vitisho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anang’olewa kutoka katika hema lake, ambalo ndilo tegemeo lake.” Kiebrania kinaweza kumaanisha kwamba anaondolewa mahali salama pa hema lake, au kwamba hema lenyewe ndilo alilolitegemea.
    reason: lexical_alternative
  - marker: b
    text: “Mfalme wa vitisho” ni usemi wa kishairi, ambao mara nyingi hueleweka kuwa kifo kinachowakilishwa kama mtu.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: anang’olewa
  rationale: Nifali ya נתק inaonyesha kutenganishwa au kung’olewa kwa nguvu; “anang’olewa” inadumisha hali ya kutendwa na ukali wa tendo.
- source_word: מֵאָהֳלוֹ
  choice: kutoka katika ... hema lake
  rationale: אֹהֶל ni “hema”; taswira halisi ya kishairi imehifadhiwa badala ya kuibadili kuwa “nyumba” au “makao.”
- source_word: מִבְטַחוֹ
  choice: usalama wa hema lake
  rationale: מִבְטָח inaweza kumaanisha usalama, tegemeo, au kitu kinachotumainiwa. Muundo huu unaweza kuonyesha hema kama mahali pake salama au kama kitu alichokitegemea; tafsiri na tanbihi zinahifadhi uwezekano huo.
- source_word: וְתַצְעִדֵהוּ
  choice: naye anaongozwa kwa nguvu kwenda
  rationale: Hifili ya צעד ni kusababisha mtu apige hatua au aende. Umbo la kike la nafsi ya tatu lina kiima kisichotajwa wazi; uundaji wa kutendwa katika Kiswahili huepuka kukibainisha kimabavu huku “kwa nguvu” ikidumisha msukumo wa tendo.
- source_word: לְמֶלֶךְ
  choice: kwenda kwa mfalme
  rationale: לְ hapa huonyesha mwelekeo, “kwa” au “kuelekea kwa”; “kwenda kwa” ni ya kawaida na wazi katika Kiswahili.
- source_word: בַּלָּהוֹת
  choice: wa vitisho
  rationale: Wingi huu humaanisha vitisho au mambo ya kutisha. “Mfalme wa vitisho” inadumisha jina la kishairi bila kulifafanua kupita maandishi.
theological_decisions:
- issue: Utambulisho wa “mfalme wa vitisho”
  choice: Kuhifadhi usemi wa kishairi bila kumtambulisha moja kwa moja
  alternative: Kifo kilichopewa utu, Kuzimu, au mtawala wa kiroho wa vitisho
  rationale: Kiebrania hakifafanui wazi anayerejelewa. Tafsiri inadumisha utata wa kishairi na wa kiteolojia; tanbihi inataja tu ufafanuzi wa kawaida bila kuuweka ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Taswira ya “hema” na utata wa “mfalme wa vitisho” vimehifadhiwa; kiima kisichotajwa cha kitenzi cha pili hakijabuniwa.
