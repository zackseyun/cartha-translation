lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: Wanamfukuza
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu wingi chenye kiambishi cha mtendwa wa kiume umoja; ‘wanamfukuza’ huhifadhi mtendaji wa wingi asiyeainishwa na wazo la kumwondoa kwa nguvu.
- source_word: מֵאוֹר
  choice: kutoka nuruni
  rationale: Kiambishi מ־ huonyesha kuondoka au kutenganishwa; ‘nuru’ hudumisha taswira ya kishairi inayokinzana na giza.
- source_word: אֶל חֹשֶׁךְ
  choice: hadi gizani
  rationale: אֶל huonyesha mwelekeo kuelekea eneo jingine; ‘hadi gizani’ ni Kiswahili cha kawaida kinachoonyesha kuhama kutoka nuru kwenda giza.
- source_word: וּמִתֵּבֵל
  choice: na ... kutoka ulimwenguni
  rationale: תֵּבֵל humaanisha ulimwengu, mara nyingi hasa ulimwengu unaokaliwa; ‘ulimwenguni’ ni tafsiri fupi na ya kawaida, huku maana mahususi ikihifadhiwa katika tanbihi.
- source_word: יְנִדֻּהוּ
  choice: kumfukuza
  rationale: Kitenzi kina wazo la kusababisha mtu aondolewe au atengwe. ‘Kumfukuza’ huwasilisha kufukuzwa kutoka katika jamii au makao bila kuongeza maelezo yasiyomo katika mstari.
