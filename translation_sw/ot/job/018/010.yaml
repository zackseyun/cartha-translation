  text: His rope is hidden in the ground[a], and his trap on the path.
translation:
  language: sw
  text: Kamba yake imefichwa ardhini,[a] na mtego wake uko njiani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kamba yake imefichwa udongoni, na tanzi yake iko njiani.”
