lexical_decisions:
- source_word: טָמוּן
  choice: imefichwa
  rationale: Huhifadhi maana ya hali ya kitu kilichofichwa au kufukiwa, kwa Kiswahili cha kawaida na cha sasa.
- source_word: בָּאָרֶץ
  choice: ardhini
  rationale: Katika muktadha wa kutega mtego, neno hili linaonyesha udongo ambamo kamba imefichwa, si nchi kwa maana ya eneo la kisiasa.
- source_word: חַבְלוֹ
  choice: kamba yake
  rationale: חבל humaanisha kamba; hapa ni kamba inayohusiana na mtego. Tafsiri hii ni wazi na inahifadhi taswira halisi.
- source_word: וּמַלְכֻּדְתּוֹ
  choice: na mtego wake
  rationale: מַלְכֹּדֶת ni mtego au tanzi. 'Mtego' ni pana, ya kawaida, na inaeleweka kwa urahisi.
- source_word: עֲלֵי נָתִיב
  choice: uko njiani
  rationale: Huonyesha mahali pa mtego katika njia ambako mtu hupita; muundo huu ni wa asili katika Kiswahili.
