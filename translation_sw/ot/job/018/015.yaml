  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: sw
  text: Katika hema lake kitakaa kitu ambacho si chake[a]; kiberiti kitatawanywa juu ya makao yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina sintaksia ngumu. Kitenzi cha kwanza ni cha umoja wa kike bila kiima kutajwa wazi; kinaweza kurejelea “kiberiti” mwishoni mwa mstari. Inawezekana pia: “Kiberiti kitakaa katika hema lake, na hema hilo si lake tena.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: kinakaa
  rationale: Kitenzi שכן humaanisha ‘kukaa’ au ‘kuishi mahali.’ Umbo lake ni nafsi ya tatu, umoja, kike; kwa kuwa kiima hakitajwi wazi kabla yake, Kiswahili kinatumia ‘kinakaa’ kwa kurejelea ‘kitu’ kinachoelezwa na kishazi kinachofuata, huku tanbihi ikihifadhi uwezekano mwingine wa kisintaksia.
- source_word: בְּאָהֳלוֹ
  choice: katika hema lake
  rationale: אֹהֶל ni ‘hema.’ Neno halisi limehifadhiwa ili kudumisha taswira thabiti ya nyumba ya mtu katika kitabu cha Ayubu.
- source_word: מִבְּלִי לוֹ
  choice: kitu kisicho chake
  rationale: Kirai hiki ni kifupi na kigumu kisintaksia, kikionyesha ukosefu wa uhusiano au umiliki kwake. Tafsiri hii hudokeza kuwa kilichomo hemani si chake bila kukitambulisha kwa kubuni.
- source_word: יְזֹרֶה
  choice: hutawanywa
  rationale: Pieli ya זרה humaanisha ‘kutawanya’ au ‘kutapakaza.’ Ingawa umbo ni tendaji la nafsi ya tatu ya kiume, hapa linaweza kutumiwa bila kumtaja mtendaji; kauli ya kutendwa ya Kiswahili haiongezi mtendaji asiye katika maandishi.
- source_word: עַל נָוֵהוּ
  choice: juu ya makao yake
  rationale: נָוֶה inaweza kumaanisha makao, maskani, au malisho. Sambamba na ‘hema lake,’ ‘makao yake’ inafaa zaidi kwa taswira ya nyumba iliyohukumiwa.
- source_word: גָפְרִית
  choice: kiberiti
  rationale: גָפְרִית ni salfa inayoweza kuwaka, ambayo kwa kawaida huitwa ‘kiberiti’ katika Kiswahili cha Biblia na inaeleweka katika taswira ya hukumu na uharibifu.
theological_decisions:
- issue: Kiima cha תִּשְׁכּוֹן na maana ya מִבְּלִי לוֹ
  choice: Kitu kisicho chake kinakaa katika hema lake baada ya kuanguka kwake.
  alternative: Kiberiti ndicho kinachokaa katika hema lake, au hema hilo si lake tena.
  rationale: 'Kiebrania kimebanwa na kina utata: kitenzi cha kwanza ni cha umoja wa kike bila kiima kilichotajwa wazi, na ‘kiberiti’ cha mwisho wa mstari pia ni nomino ya kike. Matini kuu inafuata usomaji wa kawaida wa uwepo usio wake, lakini haitambui uwepo huo ni nini; tanbihi huhifadhi uwezekano wa ‘kiberiti’ kuwa kiima kilichocheleweshwa na wa kupokonywa makao.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Hema’ na ‘makao’ huhifadhi ulinganifu wa picha halisi; ‘kiberiti’ ni neno la kawaida la kibiblia kwa salfa. Utata wa Kiebrania haujafichwa bali umeelezwa kwa tanbihi.
