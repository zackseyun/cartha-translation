  yaml_path: translation/ot/job/018/007.yaml
  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: sw
  text: 'Hatua zake za nguvu zinabanwa[a],

    na mpango wake mwenyewe unamwangusha[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hatua zake za nguvu zinawekewa mipaka”; אוֹן inaweza kumaanisha “nguvu” au “uwezo,” na kitenzi kinaweza kutafsiriwa “zinabanwa” au “zinawekewa mipaka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “shauri lake mwenyewe linamtupa chini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצְרוּ
  choice: zinabanwa
  rationale: Kitenzi kinaonyesha hatua kufanywa finyu au kuzuiwa. “Zinabanwa” ni Kiswahili cha kawaida kinachohifadhi picha ya mwendo unaowekewa mipaka.
- source_word: צַעֲדֵי
  choice: hatua
  rationale: Nomino hii humaanisha hatua au mapigo ya kutembea; “hatua” ndiyo tafsiri ya moja kwa moja na ya kawaida katika picha hii ya kishairi.
- source_word: אוֹנוֹ
  choice: zake zenye nguvu
  rationale: אוֹן inaweza kumaanisha nguvu au uwezo. Hapa inahusishwa na hatua zake, hivyo “zenye nguvu” huonyesha mwendo wake wa awali wenye nguvu bila kuchagua maana isiyofaa ya mali au taabu.
- source_word: וְתַשְׁלִיכֵהוּ
  choice: unamwangusha
  rationale: Hiphil ya שלך inaonyesha kusababisha mtu aanguke au kutupwa chini. Kiima cha umoja wa kike ni “mpango wake”; “unamwangusha” ni cha asili na huhifadhi matokeo ya kuanguka katika muktadha.
- source_word: עֲצָתוֹ
  choice: mpango wake mwenyewe
  rationale: עֵצָה inaweza kuwa shauri, kusudi, au mpango. Katika muktadha huu ni mipango yake mwenyewe inayomgeukia; “mpango wake mwenyewe” huwasilisha kejeli hiyo wazi kwa Kiswahili cha sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa mistari miwili unahifadhi usambamba wa kishairi wa Kiebrania; “mpango wake mwenyewe” huonyesha kwa kawaida kwamba shauri lake mwenyewe ndilo linalomwangusha.
