translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari miwili unadumisha usambamba wa Kiebrania; “mahali pa watu wote” linaeleza eneo la hadhara kwa lugha inayoeleweka kwa urahisi.
