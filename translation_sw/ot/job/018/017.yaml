  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: sw
  text: 'Kumbukumbu yake inapotea duniani[a],

    wala hana jina barabarani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kukumbukwa kwake kunatoweka nchini, wala hana jina katika uwanja wa umma.”
    reason: Huhifadhi maana mbadala za אֶרֶץ kuwa “nchi,” זִכְרוֹ kama “kukumbukwa kwake,” na חוּץ kama eneo la wazi au uwanja wa umma.
lexical_decisions:
- source_word: זִכְרוֹ
  choice: kumbukumbu yake
  rationale: Nomino hii humaanisha kumbukumbu au kukumbukwa kwa mtu; usemi huu ni wa kawaida na unadumisha wazo la kutoweka kwake katika mawazo ya watu.
- source_word: אָבַד
  choice: inapotea
  rationale: Kitenzi kinaweza kumaanisha kupotea, kuangamia, au kutoweka; “inapotea” kinaendana kwa kawaida na “kumbukumbu” na kuhifadhi ukali wa kauli.
- source_word: מִנִּי אָרֶץ
  choice: duniani
  rationale: אֶרֶץ inaweza kuwa nchi au dunia; hapa muktadha wa kishairi unaonyesha kufutwa kabisa, hivyo “duniani” linafaa zaidi.
- source_word: וְלֹא שֵׁם לוֹ
  choice: wala hana jina
  rationale: Muundo huu unadumisha maana ya kutokuwa na jina, sifa, au hadhi inayokumbukwa, kwa Kiswahili cha kawaida.
- source_word: עַל־פְּנֵי חוּץ
  choice: mahali pa watu wote
  rationale: חוּץ inaweza kutaja sehemu ya nje, barabara, au eneo la wazi la umma. Usemi huu unaonyesha wazi nyanja ya hadharani bila kulazimisha maana finyu ya barabara moja.
