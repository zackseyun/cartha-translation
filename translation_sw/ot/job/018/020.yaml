translation:
  language: sw
  text: 'Watu watakaokuja baadaye watastaajabishwa na siku yake[a],

    na wale wa zamani watashikwa na hofu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “siku yake,” yaelekea ikimaanisha siku ya msiba au hukumu yake.'
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “watashikwa na mtetemeko wa hofu.” Maneno “watakaokuja baadaye” na “wa zamani” yanaweza pia kueleweka kuwa “wa magharibi” na “wa mashariki.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַל יוֹמוֹ
  choice: kwa ... siku yake
  rationale: Kihusishi עַל hapa kinaonyesha sababu au tukio linalozua mwitikio, nalo יוֹמוֹ kihalisi ni “siku yake.” Tafsiri inadumisha usemi halisi huku “kwa” ikionyesha kwamba siku hiyo ndiyo sababu ya hofu.
- source_word: נָשַׁמּוּ
  choice: wanastaajabishwa kwa hofu
  rationale: Kitenzi hiki kinaeleza mshangao mzito wenye hali ya kufadhaika au kuogofya; usemi huu wa Kiswahili unaonyesha mshangao na hofu bila kudhoofisha uzito wake.
- source_word: אַחֲרֹנִים
  choice: wale wanaokuja baadaye
  rationale: Maana ya msingi katika jozi hii ni “wale wa baadaye.” Usomaji wa wakati ndio unaofaa zaidi sambamba na קַדְמֹנִים, huku uwezekano wa maana ya kijiografia ukihifadhiwa katika tanbihi.
- source_word: וְקַדְמֹנִים
  choice: na wale waliotangulia
  rationale: Neno linaweza kumaanisha wa zamani au wa mashariki; katika ulinganifu huu, maana ya wakati “waliotangulia” ni ya kawaida zaidi.
- source_word: אָחֲזוּ שָׂעַר
  choice: wanashikwa na kitisho
  rationale: Kihalisi ni “walishika/walipatwa na mtetemeko wa hofu.” Kiswahili “wanashikwa na kitisho” kinawasilisha nahau ya kuzidiwa na hofu kali kwa lugha ya kawaida na yenye hadhi.
