  variant: Standard East African Swahili
source:
  edition: WLC
  text: גַּ֤ם א֣וֹר רְשָׁעִ֣ים יִדְעָ֑ךְ וְ/לֹֽא יִ֝גַּ֗הּ שְׁבִ֣יב אִשּֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: sw
  text: 'Naam, nuru ya waovu itazimika,

    na mwali wa moto wake hautang''aa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na cheche ya moto wake haitang'aa.” Neno la Kiebrania שְׁבִיב linaweza kumaanisha “cheche” au “mwali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Naam
  rationale: Hapa neno hili linatilia mkazo dai la Bildadi badala ya kuongeza wazo jingine tu. “Naam” lina nguvu ya uthibitisho kwa Kiswahili cha heshima.
- source_word: אוֹר
  choice: nuru
  rationale: Neno la msingi ni nuru, likitumika hapa kwa picha kuhusu hali ya maisha au ustawi. Picha hiyo imehifadhiwa bila kufasiriwa moja kwa moja.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni jina la jumla la watu waovu katika wingi; “waovu” ni la kawaida na la moja kwa moja katika Kiswahili.
- source_word: יִדְעָךְ
  choice: itazimika
  rationale: Kitenzi kinaeleza nuru kufifia hadi kuzimika. Wakati ujao unalingana na umbo la Kiebrania na muktadha wa tamko la kishairi.
- source_word: וְלֹא
  choice: na ... hauta-
  rationale: Muunganiko wa sentensi na ukanushi umeonyeshwa kwa muundo wa kawaida wa Kiswahili.
- source_word: יִגַּהּ
  choice: hautang'aa
  rationale: Kitenzi kinamaanisha kutoa mwanga au kung'aa; “kung'aa” huhifadhi picha ya kishairi kwa lugha ya kawaida.
- source_word: שְׁבִיב
  choice: mwali
  rationale: Neno linaweza kumaanisha mwali au cheche. “Mwali” unalingana vizuri na sambamba ya “nuru” na kirai “wa moto wake,” huku uwezekano wa “cheche” ukihifadhiwa katika tanbihi.
- source_word: אִשּׁוֹ
  choice: moto wake
  rationale: Neno ni “moto” lenye kiambishi cha nafsi ya tatu umoja. Picha ya moto imehifadhiwa, bila kuibadili kuwa taa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari unahifadhi usambamba wa Kiebrania; taswira za nuru na moto hazijafasiriwa kwa maneno ya kiitikadi.
