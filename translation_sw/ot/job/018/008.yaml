  language: sw
  text: Kwa maana hupelekwa katika wavu kwa miguu yake mwenyewe, naye hutembea juu ya wavu wa kunasia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח
  choice: humpeleka
  rationale: Kitenzi hiki ni kauli tendwa, kihalisi ‘ametumwa/amepelekwa.’ Katika muktadha huu miguu yake ndiyo njia inayomfikisha wavuni; ‘humpeleka’ ni Kiswahili cha kawaida kinachohifadhi wazo hilo bila kuongeza kwamba ametupwa kwa nguvu.
- source_word: בְּרַגְלָיו
  choice: miguu yake mwenyewe
  rationale: Huhifadhi msisitizo kwamba hatua zake mwenyewe zinamwingiza katika mtego.
- source_word: רֶשֶׁת
  choice: wavu
  rationale: Neno la kawaida kwa wavu unaotumika kama mtego.
- source_word: שְׂבָכָה
  choice: wavu wa kunasia
  rationale: Humaanisha kitu kilichosokotwa au chenye matundu, hapa kama mtego; usemi huu unatofautisha kidogo na רֶשֶׁת huku ukidumisha usambamba wa kishairi.
- source_word: יִתְהַלָּךְ
  choice: hutembea
  rationale: Huwasilisha kitendo cha kutembea au kwenda juu ya eneo la mtego, kwa hali ya jumla inayofaa maelezo haya ya kishairi.
