  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: sw
  text: Mizizi yake hukauka chini, na juu, chipukizi lake[a] hukatwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavuno yake.” Neno la Kiebrania kwa kawaida humaanisha mavuno au kile kinachokatwa; hapa linaweza kutaja sehemu ya juu ya mmea.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  choice: chini
  rationale: Huonyesha upande wa chini na kuunda ulinganifu wa kishairi na “juu”; katika Kiswahili “chini” ni ya kawaida na wazi.
- source_word: שָׁרָשָׁיו
  choice: mizizi yake
  rationale: Ni nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja wa kiume; inadumisha taswira ya mmea.
- source_word: יִבָשׁוּ
  choice: hukauka
  rationale: Kitenzi kinamaanisha kuwa mikavu au kukauka; “hukauka” ni cha asili na kinaendana na mizizi.
- source_word: וּמִמַּעַל
  choice: na juu
  rationale: 'Hudumisha ulinganifu wa pande mbili: chini na juu.'
- source_word: יִמַּל
  choice: hukatwa
  rationale: Katika muktadha wa uoto, kitenzi kinaweza kumaanisha kukatwa au kuondolewa; “hukatwa” huhifadhi maana hiyo bila kuibadili kuwa kunyauka.
- source_word: קְצִירוֹ
  choice: chipukizi lake
  rationale: Ingawa nomino hii mara nyingi humaanisha mavuno, hapa inalinganishwa na mizizi na inaelekea kutaja sehemu ya juu ya mmea inayokatwa; “chipukizi” huwasilisha ukuaji wa juu kwa uwazi.
