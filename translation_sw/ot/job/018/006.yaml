  text: א֭וֹר חָשַׁ֣ךְ בְּ/אָהֳל֑/וֹ וְ֝/נֵר֗/וֹ עָלָ֥י/ו יִדְעָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/006.yaml
  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: sw
  text: 'Nuru katika hema yake inakuwa giza,

    na taa yake iliyo juu yake[a] itazimika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taa yake juu yake.” Kihusishi cha Kiebrania kinaweza kumaanisha mahali pa juu ya mtu au kitu; huenda picha hapa ni ya taa inayomwangazia kutoka juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: nuru
  rationale: Neno hili la kawaida linahifadhi taswira halisi ya mwanga ndani ya makao.
- source_word: חָשַׁךְ
  choice: itakuwa giza
  rationale: Kitenzi kinaonyesha nuru kuingia katika hali ya giza; usemi huu unahifadhi mkazo wa kishairi badala ya kuupunguza kuwa kufifia tu.
- source_word: בְּאָהֳלוֹ
  choice: hemani mwake
  rationale: ‘Hema’ linahifadhi taswira halisi ya Kiebrania, ambayo pia inaweza kuwakilisha makao au kaya ya mtu.
- source_word: וְנֵרוֹ
  choice: na taa yake
  rationale: נֵר ni taa au mwanga wa taa; ‘taa’ linadumisha taswira halisi na usambamba wa kishairi.
- source_word: עָלָיו
  choice: iliyo juu yake
  rationale: עַל inaweza kuonyesha mahali palipo juu ya mtu au kitu; ‘juu yake’ linahifadhi maana hiyo ya nafasi bila kuibana zaidi.
- source_word: יִדְעָךְ
  choice: itazimika
  rationale: Kitenzi hutumiwa kwa taa au moto unaozimika; ‘itazimika’ ni la kawaida, wazi, na lenye uzito unaofaa katika ushairi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na hadhi ya kishairi. Mpangilio wa mistari miwili unadumisha usambamba wa Kiebrania; ‘hema’ na ‘taa’ zimeachwa kuwa taswira halisi badala ya kufasiriwa kama nyumba, familia, au uhai.
