review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two poetic images, ‘tent’ (hema) and ‘lamp’ (taa), as well as the spatial ambiguity of עָלָיו (‘above/over him’). However, ‘itakuwa giza’ is future (‘will become dark’) and is less faithful to the Hebrew’s asserted/proverbial darkening than a present-process expression.
  naturalness: ‘Nuru itakuwa giza hemani mwake’ is understandable but awkward in standard modern East African Swahili because the locative phrase is displaced and the future form is unnecessarily strong. ‘Nuru katika hema yake inakuwa giza’ is natural while retaining the poetic image.
  terminology: ‘Nuru,’ ‘hema,’ ‘taa,’ and ‘itazimika’ are appropriate and dignified. The footnote correctly identifies the lexical-spatial alternative, but should not identify the referent as ‘mtu mwovu,’ since that qualification comes from the wider speech context rather than this clause itself.
  issues:
  - severity: medium
    issue: ‘itakuwa giza’ introduces a future sense and has an awkward word order.
    rationale: The Hebrew חָשַׁךְ depicts the light as darkened/becoming dark; the context may be rendered proverbially or as an imminent result, but the Swahili future ‘itakuwa’ is not the most direct equivalent. Recasting it as ‘inakuwa giza’ better expresses the image without adding a future temporal claim.
  - severity: low
    issue: The footnote says ‘juu ya mtu mwovu.’
    rationale: The verse itself says only ‘him.’ Although Bildad’s wider speech concerns the wicked, the note should remain anchored to the phrase being explained and avoid adding an unexpressed referential label.
  revised_text: 'Nuru katika hema yake inakuwa giza,

    na taa yake iliyo juu yake[a] itazimika.'
