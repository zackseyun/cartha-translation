  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
translation:
  language: sw
  text: Mtaendelea mpaka lini kuweka mitego kwa maneno?[a] Fahamuni, kisha tutasema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtaendelea mpaka lini kuweka mipaka kwa maneno?” Kirai cha Kiebrania ni kigumu; wengine hukielewa kuwa malalamiko kuhusu maneno yasiyokwisha badala ya kunasa kwa maneno.
    reason: lexical_alternative
  - marker: b
    text: Au, “kisha tuseme.” Kitenzi cha mwisho kinaweza kueleweka kuwa mwaliko na pia kauli ya wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: mpaka lini
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuuliza muda kwa sauti ya malalamiko au kukemea.
- source_word: תְּשִׂימוּן
  choice: mtaendelea ... kuweka
  rationale: Kitenzi שׂים humaanisha ‘kuweka.’ Katika swali linaloanza kwa ‘mpaka lini,’ ‘mtaendelea’ huonyesha kwa kawaida tendo linalodaiwa kuwa linaendelea, bila kupunguza nguvu ya lawama.
- source_word: קִנְצֵי לְמִלִּין
  choice: mitego kwa maneno
  rationale: Kirai cha Kiebrania ni kigumu. Tafsiri hii hutoa maana ya usemi wenye uhasama au wa kunasa kwa maneno, huku maana ya ‘miisho/mipaka ya maneno’ ikihifadhiwa katika tanbihi.
- source_word: תָּבִינוּ
  choice: Fahamuni
  rationale: Ni amri kwa watu wengi inayohifadhi mkazo wa kitenzi בין juu ya kuelewa au kutambua.
- source_word: וְאַחַר
  choice: kisha
  rationale: 'Huonyesha mfuatano wa matendo kwa Kiswahili cha kawaida: kwanza wafahamu, halafu usemi ufuate.'
- source_word: נְדַבֵּר
  choice: tutasema
  rationale: Ni nafsi ya kwanza wingi ya hali isiyotimilika. ‘Tutasema’ huhifadhi usomaji wa wakati ujao, huku uwezekano wa mwaliko ‘na tuseme’ ukitajwa katika tanbihi.
