  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: sw
  text: 'Hakika, haya ndiyo makao ya dhalimu[a],

    na hii ndiyo mahali pa mtu asiyemjua Mungu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwovu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mahali pa asiyemjua Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Katika hitimisho hili la hotuba ya Bildadi, neno hili linasisitiza uhakika wa kauli badala ya kuwa na maana ya ‘tu’.
- source_word: מִשְׁכְּנוֹת
  choice: makao
  rationale: Neno hili linaonyesha mahali au sehemu za kuishi kwa ujumla; ‘makao’ ni la kawaida, lenye hadhi, na halilazimishi maana finyu ya mahema.
- source_word: עַוָּל
  choice: dhalimu
  rationale: Neno hili humaanisha mtu mwenye udhalimu au atendaye yasiyo ya haki. ‘Dhalimu’ linadumisha uzito wa kimaadili na kisheria wa Kiebrania.
- source_word: וְזֶה מְקוֹם
  choice: na hapa ndipo mahali
  rationale: Kiebrania kina kiunganishi, kiashiria, na ‘mahali.’ Kiswahili cha asili hutumia ‘hapa ndipo mahali’ kuonyesha mahali panaporejelewa bila kubadili maana.
- source_word: לֹא יָדַע אֵל
  choice: mtu asiyemjua Mungu
  rationale: Muundo huu unaonyesha mtu anayehusishwa na mahali hapo. Tafsiri inadumisha kitenzi ‘kujua’ bila kukifafanua kuwa ukosefu wa taarifa tu au kuwa uhusiano maalumu pekee.
- source_word: אֵל
  choice: Mungu
  rationale: Katika muktadha huu wa kitabu cha Ayubu, neno hili linamrejelea Mungu; hakuna msingi wa kuongeza cheo kingine.
theological_decisions:
- issue: Maana ya ‘asiyemjua Mungu’
  choice: Kudumisha usemi halisi ‘asiyemjua Mungu,’ ambao unaweza kuhusisha kutomtambua Mungu kimaadili na kiuhusiano
  alternative: Kufafanua kuwa mtu huyo hana taarifa kuhusu kuwapo kwa Mungu
  rationale: Katika fasihi ya hekima, ‘kumjua Mungu’ mara nyingi ni zaidi ya ufahamu wa kiakili. Hata hivyo, tafsiri haifungi usemi huo katika ufafanuzi mmoja wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Usambamba wa kishairi kati ya ‘makao’ na ‘mahali’ umehifadhiwa.
