lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni kielezi cha kuuliza kinachoanzisha swali la kejeli la Bildadi; “Kwa nini” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: נֶחְשַׁבְנוּ
  choice: tunahesabiwa
  rationale: Kauli ya kutendwa ya חשׁב inaonyesha jinsi wasemaji wanavyokadiriwa au kuchukuliwa; “tunahesabiwa” inadumisha maana hiyo na ulinganifu wa kishairi.
- source_word: כַבְּהֵמָה
  choice: kama wanyama
  rationale: בְּהֵמָה ni neno pana linaloweza kumaanisha mnyama au mnyama wa kufugwa. “Wanyama” ni la kawaida, linaeleweka, na linahifadhi dharau ya ulinganisho bila kulibana kwa “ng’ombe” pekee.
- source_word: נִטְמִינוּ
  choice: kuonwa kuwa najisi
  rationale: Umbo hili la Kiebrania ni gumu. Chaguo hili hulihusisha na unajisi na kudumisha ulinganifu wa kauli ya kutendwa pamoja na נֶחְשַׁבְנוּ, huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine.
- source_word: בְּעֵינֵיכֶם
  choice: machoni penu
  rationale: Ni nahau ya Kiebrania ya kueleza tathmini au mtazamo. “Machoni penu” huhifadhi sitiari hiyo na pia wingi wa kiwakilishi.
theological_decisions:
- issue: Maana ya נִטְמִינוּ
  choice: kuonwa kuwa najisi
  alternative: kuonwa kuwa wajinga / tumekuwa wapumbavu
  rationale: Neno hilo lina utata wa kileksia na kimatini. Matini kuu inafuata maana ya unajisi inayofaa sambamba na wazo la kudharauliwa, lakini tanbihi haitatui kimya kimya uwezekano wa maana inayohusu ujinga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Machoni penu” huhifadhi nahau ya Kiebrania na wingi unaomlenga Ayubu kwa namna inayowahusisha anaowaelekea.
