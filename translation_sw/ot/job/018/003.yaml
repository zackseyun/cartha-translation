  text: Kwa nini tunahesabiwa kama wanyama[a], na tunaonwa kuwa najisi machoni penu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama wanyama wa kufugwa.” Neno la Kiebrania בְּהֵמָה ni pana, likimaanisha mnyama au mnyama wa kufugwa; hapa limetumiwa kwa dharau.
    reason: lexical_alternative
  - marker: b
