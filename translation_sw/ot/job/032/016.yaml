- source_word: לֹא עָנוּ עוֹד
  choice: wala hawakujibu tena
  rationale: עוד pamoja na ukanushaji huonyesha kwamba majibu yao yalikuwa yamekoma; ‘hawakujibu tena’ ni ya kawaida na wazi kwa wasomaji wa sasa.
