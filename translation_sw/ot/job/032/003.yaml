  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: sw
  text: Hasira yake iliwaka pia dhidi ya rafiki zake watatu, kwa sababu hawakuwa wamepata jawabu, lakini walimhukumu Ayubu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wamemtangaza Ayubu kuwa mwenye hatia,” au “walikuwa wamemtendea Ayubu kama mtu mwovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: dhidi ya wale rafiki zake watatu
  rationale: Kihusishi ב pamoja na nahau חרה אף huonyesha wale ambao hasira imeelekezwa kwao. ‘Dhidi ya’ ni Kiswahili cha kawaida kinachoonyesha mwelekeo huo; ‘wale’ huunganisha kifungu hiki na kutajwa kwao katika mstari uliotangulia.
- source_word: חָרָה אַפּוֹ
  choice: hasira yake ikawaka
  rationale: Hii ni nahau ya Kiebrania inayotumia picha ya kuwaka kwa hasira. Tafsiri hii huhifadhi sitiari kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: עַל אֲשֶׁר
  choice: kwa sababu
  rationale: Muundo huu unaanzisha sababu ya hasira ya Elihu; ‘kwa sababu’ ni usemi wa asili na wa moja kwa moja.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: hawakuwa wamepata jibu
  rationale: מַעֲנֶה ni ‘jibu’ au ‘jawabu’ katika muktadha wa mabishano. ‘Jibu’ linaeleweka kwa urahisi, na wakati uliotumiwa unaonyesha hali iliyokuwapo kabla ya hasira hiyo.
- source_word: וַיַּרְשִׁיעוּ
  choice: lakini walikuwa wamemhukumu ... kuwa na hatia
  rationale: 'Hifili ya רשע hapa ina maana ya kumtangaza mtu kuwa mwenye hatia au kumhukumu. ‘Kumhukumu kuwa na hatia’ huhifadhi maana ya kimahakama bila kudai kwamba walithibitisha hatia yake. ‘Lakini’ huonyesha mvutano wa kimantiki wa waw: hawakuwa na jibu, hata hivyo walimhukumu.'
- source_word: אֶת אִיּוֹב
  choice: Ayubu
  rationale: Hili ni jina la mtu linalotumiwa kwa namna iliyozoeleka katika Biblia za Kiswahili.
theological_decisions:
- issue: Maana ya tendo la rafiki za Ayubu
  choice: walikuwa wamemhukumu Ayubu kuwa na hatia
  alternative: walikuwa wamemtendea Ayubu kama mtu mwovu
  rationale: Hifili ya רשע kwa kawaida inaweza kuwa na maana ya kutangaza hatia katika muktadha wa mashindano ya hoja. Tafsiri iliyochaguliwa huhifadhi maana hiyo bila kuongeza dai kwamba hatia ya Ayubu ilithibitishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya hasira ‘kuwaka’ imehifadhiwa; msamiati wa kisheria umewekwa wazi kwa wasomaji wa kawaida.
