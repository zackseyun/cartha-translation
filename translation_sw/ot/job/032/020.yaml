  text: I will speak[a], that I may find relief; I will open my lips and answer.
translation:
  language: sw
  text: Nitasema[a] ili nipate nafuu; nitafungua midomo yangu na kujibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hilo litaniletea nafuu,” au, “nami nitapata nafuu.” Usemi wa Kiebrania unaweza kueleweka kuwa unaonyesha matokeo au kusudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: Nitasema
  rationale: Kitenzi cha nafsi ya kwanza katika hali ya kusisitiza nia kinaonyesha azimio la msemaji. “Nitasema” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya hiari na kusudi.
- source_word: וְיִרְוַח לִי
  choice: ili nipate nafuu
  rationale: Nahau hii ina maana ya kupata nafasi ya kupumua, kutulizwa, au kuondolewa uzito wa ndani. “Ili nipate nafuu” inaeleza kwa kawaida uhusiano wa kusudi unaowezekana katika muktadha, huku tanbihi ikihifadhi uwezekano wa matokeo.
- source_word: אֶפְתַּח
  choice: nitafungua
  rationale: Hii ni tafsiri ya moja kwa moja ya kitenzi “kufungua,” ikihifadhi taswira ya Kiebrania.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Kiebrania kinataja kihalisi midomo kama nahau ya kuanza kusema. Kiswahili “midomo yangu” kinahifadhi taswira hiyo badala ya kuibadili kuwa “kinywa changu.”
- source_word: וְאֶעֱנֶה
  choice: na kujibu
  rationale: Kitenzi kina maana ya kujibu au kuitikia. “Na kujibu” kinafaa katika muktadha wa mjadala na kinaendeleza kwa ufupi sentensi iliyotangulia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “midomo yangu” huhifadhi taswira halisi ya chanzo, na tanbihi huhifadhi utata wa uhusiano kati ya kusema na kupata nafuu.
