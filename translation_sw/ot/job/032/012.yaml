  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: sw
  text: Niliwasikiliza kwa makini[a], na tazama, hakuna yeyote miongoni mwenu aliyemkanusha Ayubu[b] kwa kuyajibu maneno yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niliwazingatia kwa makini.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzingatia au kuchunguza kwa uangalifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyemkemea au kumsahihisha Ayubu.” Neno la Kiebrania linaweza kumaanisha kupinga hoja na kuthibitisha kuwa mtu amekosea, au kumkemea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: Niliwasikiliza kwa makini
  rationale: Kitenzi אֶתְבּוֹנָן kinaonyesha kuzingatia au kuchunguza kwa makini; katika muktadha wa mazungumzo, usemi huu wa Kiswahili unaonyesha kwamba Elihu aliwasikiliza kwa uangalifu.
- source_word: וְהִנֵּה
  choice: lakini tazama
  rationale: תִּazama huhifadhi nguvu ya kiashiria cha hitimisho la kushangaza, huku 'lakini' ikionyesha tofauti kati ya kusikiliza kwake kwa makini na kushindwa kwao kumjibu Ayubu.
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: hakuna yeyote ... aliyemkanusha Ayubu
  rationale: מוֹכִיחַ hapa humaanisha anayepinga hoja na kuonyesha kuwa mwingine amekosea; 'aliyemkanusha' linafaa katika muktadha huu wa mabishano.
- source_word: עוֹנֶה אֲמָרָיו
  choice: na kuyajibu maneno yake
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania na inaeleweka kwa kawaida katika Kiswahili.
- source_word: מִכֶּם
  choice: miongoni mwenu
  rationale: Kihusishi kinaonyesha mtu anayetoka katika kundi la marafiki wa Ayubu; 'miongoni mwenu' ni usemi wa kawaida wa Kiswahili.
