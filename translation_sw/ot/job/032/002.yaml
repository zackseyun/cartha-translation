base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: sw
  text: Ndipo Elihu, mwana wa Barakeli, Mbuzi, wa jamaa ya Ramu, akawaka kwa hasira dhidi ya Ayubu. Hasira yake iliwaka kwa sababu Ayubu alijiona kuwa mwenye haki kuliko Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu alijihesabia haki kuliko Mungu.”
    reason: Kishazi cha Kiebrania עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים ni kigumu; tanbihi hii huhifadhi namna nyingine ya kueleza kitenzi cha kujihalalisha, bila kubadili ulinganisho unaoashiriwa na מִן.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: akawaka hasira
  rationale: Nahau hii ina picha ya hasira inayowaka; tafsiri hii huihifadhi kwa Kiswahili cha kawaida na chenye nguvu.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל
  choice: Elihu mwana wa Barakeli
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na uhusiano wa ukoo umetafsiriwa moja kwa moja.
- source_word: הַבּוּזִי
  choice: Mbuzi
  rationale: Ni jina la mtu wa Buzi au wa ukoo huo, si neno la kawaida linalomaanisha mnyama; umbo hili linafuata matumizi ya majina ya jamii katika mapokeo ya Biblia ya Kiswahili.
- source_word: מִמִּשְׁפַּחַת רָם
  choice: wa jamaa ya Ramu
  rationale: מִשְׁפָּחָה hapa ni kundi la kifamilia au ukoo; ‘jamaa’ ni wazi na la kawaida katika Kiswahili.
- source_word: בְּאִיּוֹב
  choice: dhidi ya Ayubu
  rationale: Baada ya kitenzi cha hasira, ב humtaja mtu ambaye hasira inaelekezwa kwake.
- source_word: חָרָה אַפּוֹ
  choice: Hasira yake iliwaka
  rationale: Marudio ya picha ileile ya Kiebrania yamehifadhiwa ili kuonyesha msisitizo wa mstari.
- source_word: עַל
  choice: kwa sababu
  rationale: Hapa neno hili linatanguliza sababu ya hasira ya Elihu.
- source_word: צַדְּקוֹ נַפְשׁוֹ
  choice: alijihesabia haki yeye mwenyewe
  rationale: צדק katika muundo huu ina maana ya kujitangaza au kujiona kuwa upande wa haki, huku נַפְשׁוֹ ikifanya kazi ya kujirejelea; ‘yeye mwenyewe’ huhifadhi msisitizo huo.
- source_word: מֵאֱלֹהִים
  choice: badala ya Mungu
  rationale: מִן ina nguvu ya ulinganisho hapa. ‘Badala ya Mungu’ huhifadhi utofautishaji bila kulazimisha dai lililo wazi zaidi kwamba Ayubu alitamka kuwa ana uadilifu mkubwa kuliko Mungu.
theological_decisions:
- issue: Maana ya עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  choice: kwa sababu Ayubu alijihesabia haki yeye mwenyewe badala ya Mungu
  alternative: kwa sababu alijiona kuwa mwenye haki zaidi kuliko Mungu
  rationale: 'Muundo wa Kiebrania una ugumu wa kimakusudi: kujitetea kwa Ayubu kunawekwa katika ulinganisho na Mungu. Tafsiri kuu inadumisha mvutano huo bila kudai zaidi ya maandishi; tafsiri yenye ulinganisho wa moja kwa moja imetolewa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘hasira ... iliwaka’ yamehifadhiwa kwa sababu ni msisitizo wa Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika nayo.
