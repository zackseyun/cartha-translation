  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
translation:
  language: sw
  text: Tazama, tumbo langu ni kama divai isiyofunguliwa; ni kama viriba vipya vilivyo karibu kupasuka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama, sehemu zangu za ndani ni kama divai isiyofunguliwa; ni kama viriba vipya vinavyokaribia kupasuka.” Kiebrania hutumia “tumbo langu,” ambalo pia linaweza kumaanisha sehemu za ndani za mtu. “Viriba” ni vyombo vya ngozi vilivyotumiwa kuhifadhia vimiminika, hasa divai.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki huvuta fikira kwenye tashbihi kali ya Elihu; “Tazama” ni Kiswahili cha kawaida chenye hadhi na kinahifadhi nguvu yake ya kuelekeza usikivu.
- source_word: בִטְנִי
  choice: tumbo langu
  rationale: בטן humaanisha tumbo na pia inaweza kueleza sehemu za ndani za mtu. Hapa “tumbo langu” kinahifadhi taswira halisi na maana ya shinikizo la ndani bila kufasiri kuwa moyo au roho.
- source_word: כְּיַיִן
  choice: kama divai
  rationale: Tafsiri ya moja kwa moja ya tashbihi na nomino; maandishi hayasemi wazi kwamba divai inachacha, hivyo wazo hilo halijaongezwa.
- source_word: לֹא יִפָּתֵחַ
  choice: isiyofunguliwa
  rationale: Nifali ya פתח ina maana halisi ya kutofunguliwa. Usemi huu unahifadhi picha ya divai iliyofungwa bila nafasi ya shinikizo kutoka, pasipo kuongeza “tundu” ambalo halitajwi wazi.
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: kama viriba vipya vya divai
  rationale: אֹבוֹת hapa ni vyombo vya ngozi vya kuhifadhia maji, hasa divai, wala si mizimu. “Viriba vipya vya divai” ni usemi unaoeleweka na unaweka wazi matumizi ya chombo katika muktadha huu.
- source_word: יִבָּקֵעַ
  choice: liko karibu kupasuka
  rationale: בקע humaanisha kupasuka au kupasuliwa wazi. Muundo huu unaonyesha shinikizo linalokaribia kufikia hatua ya kupasuka na unapatanisha kitenzi na “tumbo langu,” kiini cha tashbihi.
