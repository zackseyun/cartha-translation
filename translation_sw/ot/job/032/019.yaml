translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira halisi ya tumbo, divai iliyofungwa, na viriba vya ngozi imehifadhiwa; kirai “viriba vya divai” kinafafanua kwa kawaida chombo cha kale bila kuondoa mkazo wa kishairi.
