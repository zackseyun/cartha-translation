  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: sw
  text: Basi watu hawa watatu wakaacha kumjibu Ayubu[a], kwa sababu alikuwa mwadilifu machoni pake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kulingana na mapokeo mengine ya matini, “kwa sababu alikuwa mwadilifu machoni pao.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: wakaacha
  rationale: Kitenzi שבת hapa kina maana ya kukoma au kuacha kufanya jambo; pamoja na מֵעֲנוֹת, “wakaacha kumjibu” ni Kiswahili cha kawaida na sahihi.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: wale watu watatu
  rationale: Hurejelea wale watu watatu waliotajwa katika muktadha. “Wale” ni ya asili zaidi katika masimulizi ya Kiswahili kuliko tafsiri ya moja kwa moja “hawa” wakati wa kuwarejelea wahusika waliotangulia.
- source_word: מֵעֲנוֹת אֶת אִיּוֹב
  choice: kumjibu Ayubu
  rationale: ענה ina maana ya kujibu; kiambishi “-m-” kinamwakilisha Ayubu kama mtendewa, huku jina likiwekwa wazi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huanzisha sababu iliyowafanya waache kumjibu Ayubu.
- source_word: צַדִּיק
  choice: mwadilifu
  rationale: Neno hili linahifadhi maana ya kimaadili na ya hukumu ya צַדִּיק kwa lugha ya sasa yenye heshima.
- source_word: בְּעֵינָיו
  choice: machoni pake mwenyewe
  rationale: Kiambishi cha nafsi ya tatu umoja katika matini iliyotolewa kinaelekeza kwa Ayubu. “Mwenyewe” huonyesha kwa kawaida kwamba hii ni tathmini yake binafsi bila kusema kuwa tathmini hiyo ni kweli kwa hakika.
theological_decisions:
- issue: Je, Ayubu anaelezwa kuwa mwadilifu kwa hakika au kwa kujiona kwake tu?
  choice: alikuwa mwadilifu machoni pake mwenyewe
  alternative: alikuwa mwadilifu machoni pao
  rationale: Matini ya Kiebrania iliyotolewa ina kiambishi cha umoja, “machoni pake.” Tafsiri hii inadumisha mvutano wa simulizi bila kuthibitisha wala kukanusha hukumu ya Ayubu juu yake mwenyewe. Tofauti ya mapokeo ya matini imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakaacha kumjibu” ni usemi wa kawaida; “mwadilifu machoni pake mwenyewe” huhifadhi taswira na mvutano wa Kiebrania.
