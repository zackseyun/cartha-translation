  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: sw
  text: 'Si watu wengi walio na hekima,

    wala wazee wanaoelewa haki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hukumu” au “lililo sawa.” Neno la Kiebrania mishpat linaweza kumaanisha hukumu ya kisheria, haki, au utaratibu ulio sawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Si ... wala
  rationale: Muundo huu wa ukanushi ni wa kawaida katika Kiswahili na unaunganisha mishororo miwili ya Kiebrania bila kupunguza msisitizo wake.
- source_word: רַבִּים
  choice: watu wengi
  rationale: Neno hili limetumiwa kama nomino likimaanisha kundi la watu wengi; halimaanishi hapa watu wenye cheo kikubwa.
- source_word: יֶחְכָּמוּ
  choice: walio na hekima
  rationale: Katika kauli hii ya jumla, kitenzi kinaeleza hali ya kuwa na hekima, si lazima mchakato wa kuwa na hekima.
- source_word: וּזְקֵנִים
  choice: wala wazee
  rationale: Muktadha unasisitiza umri, si wadhifa rasmi wa uongozi; ‘wazee’ ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: יָבִינוּ
  choice: wanaoelewa
  rationale: Huwasilisha kwa uwazi maana ya kufahamu au kupambanua.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Neno la Kiebrania linaweza kumaanisha hukumu, haki, au lililo sawa. ‘Haki’ linafaa hapa kwa maana pana ya utambuzi wa kimaadili na kimahakama huku tanbihi ikihifadhi maana nyingine.
