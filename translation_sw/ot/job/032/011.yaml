  text: הֵ֤ן הוֹחַ֨לְתִּי לְֽ/דִבְרֵי/כֶ֗ם אָ֭זִין עַד תְּב֥וּנֹֽתֵי/כֶ֑ם עַֽד תַּחְקְר֥וּ/ן מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/011.yaml
  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: sw
  text: Tazama, nilingojea maneno yenu; nilisikiliza mawazo yenu[a], mpaka mlipotafuta maneno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ufahamu wenu” au “hoja zenu.”
    reason: lexical_alternative
  - marker: b
    text: Au “mpaka mlipochunguza maneno ya kusema.” Kifungu cha mwisho ni kifupi na kinaweza kumaanisha kutafuta kwa makini maneno ya kujibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni chembe ya usemi inayovuta usikivu; “Tazama” ni ya heshima na inaeleweka katika Kiswahili cha Biblia bila kuwa nzito kupita kiasi.
- source_word: הוֹחַלְתִּי
  choice: nilingojea
  rationale: Kitenzi יחל kinaweza kumaanisha kungoja au kutumaini. Muktadha unasisitiza Elihu kujizuia wakati wengine wakisema, hivyo “nilingojea” linafaa zaidi huku uwezekano wa matarajio ukibaki katika maelezo ya chini.
- source_word: לְדִבְרֵיכֶם
  choice: maneno yenu
  rationale: Hurejelea yale waliokuwa wakisema. Tafsiri hii inadumisha taswira ya kishairi ya “maneno” bila kuipanua kuwa “hoja”.
- source_word: אָזִין
  choice: nilisikiliza
  rationale: Hiphil ya אזן humaanisha kusikiliza kwa makini. “Nilisikiliza” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: תְּבוּנוֹתֵיכֶם
  choice: mawazo yenu
  rationale: Wingi huu unaweza kumaanisha ufahamu, utambuzi, au hoja zinazotokana nao. “Mawazo yenu” ni ya asili katika muktadha wa kusikiliza mjadala na haidai kwamba walikuwa na umaizi sahihi.
- source_word: תַּחְקְרוּן
  choice: mlipokuwa mkitafuta
  rationale: Mzizi חקר una wazo la kuchunguza au kutafuta kwa kina. Muundo endelevu unaonyesha juhudi yao ya kutafuta namna ya kujibu.
- source_word: מִלִּין
  choice: maneno
  rationale: Ni neno la kishairi lenye maana ya maneno au semi. “Maneno” huhifadhi ulinganifu wa kileksika bila kulazimisha maana ya “hoja” au “jibu” katika matini kuu.
