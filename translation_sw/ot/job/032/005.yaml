base_translation:
  language: en
  yaml_path: translation/ot/job/032/005.yaml
  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: sw
  text: Elihu alipoona kwamba wale watu watatu hawakuwa na jibu la kutoa[a], hasira yake ikawaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “hakukuwa na jibu kinywani mwa wale watu watatu,” nahau yenye maana kwamba hawakuwa na jibu la kutoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Muundo huu unaonyesha mfuatano wa simulizi na uhusiano wa wakati kati ya kuona kwa Elihu na kuwaka kwa hasira yake.
- source_word: אֱלִיהוּא
  choice: Elihu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linatanguliza maudhui ya kile Elihu alichoona, si sababu hasa.
- source_word: אֵין מַעֲנֶה
  choice: hawakuwa na jibu la kutoa
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayoeleza kwamba watu hao hawakuwa na jawabu la kumjibu Ayubu.
- source_word: בְּפִי
  choice: la kutoa
  rationale: Nahau halisi ya Kiebrania, ‘kinywani mwa,’ imewasilishwa kwa maana yake katika Kiswahili cha kawaida; taswira ya chanzo imeelezwa katika tanbihi.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: wale watu watatu
  rationale: ‘Wale’ huwatambulisha kwa kawaida washiriki watatu waliotajwa tayari katika muktadha, huku ‘watu watatu’ ikifuata maana ya kirai cha Kiebrania.
- source_word: וַיִּחַר אַפּוֹ
  choice: hasira yake ikawaka
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya hasira kuwaka na wakati huohuo ni ya asili na inayoeleweka katika Kiswahili.
