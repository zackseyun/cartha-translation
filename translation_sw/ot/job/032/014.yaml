  yaml_path: translation/ot/job/032/014.yaml
  text: He has not directed words against me[b][a], and I will not answer him with your sayings.
translation:
  language: sw
  text: Hakuelekeza maneno dhidi yangu[a], nami sitamjibu kwa kauli zenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakupanga maneno dhidi yangu”; kitenzi cha Kiebrania kinaweza kumaanisha kupanga au kuweka maneno kwa utaratibu, na hivyo kuwasilisha hoja.
    reason: lexical_alternative
  - marker: b
    text: Au, “sitamjibu kwa hoja zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: hakuelekeza
  rationale: Katika muktadha wa mabishano, kitenzi hiki pamoja na ‘maneno’ kinaeleza kuyaweka au kuyaelekeza maneno kwa mtu. ‘Hakuelekeza’ ni Kiswahili cha kawaida na kinahifadhi wazo la hoja kuelekezwa dhidi ya mtu.
- source_word: אֵלַי
  choice: dhidi yangu
  rationale: Ingawa kihusishi kinaweza kumaanisha ‘kwangu,’ hapa muktadha wa mjadala unaunga mkono maana ya maneno au hoja kuelekezwa dhidi ya Elihu.
- source_word: מִלִּין
  choice: maneno
  rationale: Hili ndilo neno la moja kwa moja kwa usemi unaotamkwa; uzito wa kimabishano unatolewa na kitenzi na kirai ‘dhidi yangu.’
- source_word: אִמְרֵיכֶם
  choice: kauli zenu
  rationale: ‘Kauli’ linaonyesha maneno yaliyosemwa na marafiki wa Ayubu, huku likitofautisha kwa kiasi neno hili na מִלִּין bila kulifanya moja kwa moja kuwa ‘hoja.’
- source_word: אֲשִׁיבֶנּוּ
  choice: sitamjibu
  rationale: Kitenzi hapa kina maana ya kujibu, na kiambishi cha nafsi ya tatu umoja wa kiume kinamrejelea Ayubu.
theological_decisions: []
