lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu ya Elihu kulazimika kusema na kuhifadhi nguvu ya ufafanuzi ya kiunganishi hiki.
- source_word: מָלֵתִי
  choice: nimejaa
  rationale: Hueleza hali ya sasa iliyotokana na kujazwa; ni usemi wa kawaida na wenye nguvu katika Kiswahili.
- source_word: מִלִּים
  choice: maneno
  rationale: Tafsiri ya moja kwa moja ya wingi huu inafaa muktadha wa maneno yaliyofungiwa moyoni yakitaka kutamkwa.
- source_word: הֱצִיקַתְנִי
  choice: inanibana
  rationale: Kitenzi kina wazo la kuweka chini ya shinikizo au kubana. ‘Inanibana’ huhifadhi taswira ya shinikizo la ndani bila kuamua kimyakimya kuwa maana yake ni ‘inanilazimisha.’
- source_word: רוּחַ
  choice: roho
  rationale: Hapa neno hilo linaelekea kumaanisha msukumo au uhai wa ndani, si upepo halisi; ‘roho’ huhifadhi pia uwezekano wa maana ya kiroho.
- source_word: בִּטְנִי
  choice: iliyo ndani yangu
  rationale: Neno halisi ni ‘tumbo langu,’ lakini katika anthropolojia ya Kiebrania humaanisha sehemu za ndani au nafsi ya ndani. Kiswahili hiki kinaeleweka kiasili, huku taswira halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa רוּחַ
  choice: roho
  alternative: Roho
  rationale: Herufi ndogo haitamki kwa lazima kwamba anayembana Elihu ni Roho wa Mungu; inadumisha utata wa kifungu, ambacho kinaweza kumaanisha roho au msukumo wake wa ndani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama ushairi wa chanzo; ‘nimejaa maneno’ na ‘inanibana’ huhifadhi taswira ya kujaa na shinikizo la ndani.
