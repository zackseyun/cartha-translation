  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: sw
  text: Kwa maana nimejaa maneno; roho iliyo ndani yangu[a] inanibana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri halisi: “roho ya tumbo langu,” au “roho iliyo katika sehemu zangu za ndani.”'
