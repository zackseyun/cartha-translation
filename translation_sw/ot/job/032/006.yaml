  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: sw
  text: Ndipo Elihu mwana wa Barakeli, Mbuzi, akajibu na kusema, “Mimi ni kijana kwa umri,[a] nanyi ni wazee; kwa hiyo nilijinywea kwa woga, nikaogopa kuwaeleza maarifa yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Mimi ni kijana kwa siku,” nahau yenye maana ya kuwa kijana kwa umri.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: akajibu, akasema
  rationale: Inahifadhi fomula mbili za Kiebrania za kuanzisha hotuba, huku ‘akajibu’ ikiwa na maana ya kuitikia katika mazungumzo bila kudokeza lazima swali la moja kwa moja.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: Elihu mwana wa Barakeli, Mbusi
  rationale: Majina yamenukuliwa kwa namna inayofaa Kiswahili; ‘Mbusi’ linawakilisha jina la ukoo au jamii linalotokana na Buzi.
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: Mimi ni kijana kwa umri
  rationale: Kiebrania halisi ni ‘mimi ni kijana kwa siku’; Kiswahili cha kawaida hutumia ‘kwa umri’ kuwasilisha nahau hiyo kwa uwazi bila kupoteza tofauti ya umri.
- source_word: יְשִׁישִׁים
  choice: wazee
  rationale: Neno linaonyesha watu wenye umri mkubwa; ‘wazee’ ni la heshima, la kawaida, na linafaa kwa wingi wa waandikiwa.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Inaonyesha matokeo ya kimantiki ya tofauti ya umri kwa Kiswahili cha sasa na chenye hadhi.
- source_word: זָחַלְתִּי וָאִירָא
  choice: nilisita na kuogopa
  rationale: ‘Nilisita’ linawasilisha hali ya kurudi nyuma au kuwa mwoga, na ‘kuogopa’ linahifadhi kitenzi cha pili kinachosisitiza kusita kwake.
- source_word: מֵחַוֺּת דֵּעִי אֶתְכֶם
  choice: kuwaeleza ninayojua
  rationale: Kitenzi חוה kina maana ya kueleza au kutangaza, na דֵּעִי ni ‘ujuzi wangu/ninayojua.’ Muundo huu ni wa asili katika Kiswahili na unahifadhi maana bila kuifanya kuwa ‘maoni’ tu.
