translation:
  language: sw
  text: Tafadhali, nisimwonyeshe mtu yeyote upendeleo, wala nisimwite mtu kwa cheo cha kujipendekeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala nisimpe mtu jina la kujipendekeza.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwita au kumtaja mtu kwa jina au cheo cha heshima kwa kusudi la kujipendekeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Tafadhali, nisi-
  rationale: Chembe אַל pamoja na נָא huonyesha ombi au azimio hasi lenye msisitizo wa upole; “Tafadhali, nisi-” linahifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: nisimpendelee mtu yeyote
  rationale: Kwa neno, nahau hii ni “kuinua uso wa mtu,” lakini hapa humaanisha kumwonyesha mtu upendeleo. “Kumpendelea” ni tafsiri ya asili na iliyo wazi katika Kiswahili.
- source_word: אִישׁ
  choice: mtu yeyote
  rationale: Ingawa אִישׁ ni nomino ya umoja yenye maana ya “mwanamume/mtu,” katika muktadha huu hutumiwa kwa maana isiyobainisha mtu fulani; “mtu yeyote” huwasilisha nguvu hiyo bila kuzuia maana kwa wanaume pekee.
- source_word: וְאֶל אָדָם
  choice: wala ... mtu
  rationale: אָדָם hapa humaanisha mwanadamu au mtu, sambamba na אִישׁ katika mstari wa kwanza.
- source_word: לֹא אֲכַנֶּה
  choice: nisimbembeleze mtu kwa majina ya heshima
  rationale: Kitenzi כנה katika muktadha huu kinaweza kumaanisha kumwita mtu kwa jina la heshima au la kujipendekeza. Tafsiri hii huhifadhi kipengele cha majina/vyeo na pia kusudi la kujipendekeza.
