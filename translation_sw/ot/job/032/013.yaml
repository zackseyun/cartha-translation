  text: פֶּן תֹּ֣֭אמְרוּ מָצָ֣אנוּ חָכְמָ֑ה אֵ֖ל יִדְּפֶ֣/נּוּ לֹא אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: sw
  text: Msije mkasema[a], “Tumepata hekima; Mungu ndiye atakayemshinda, wala si mwanadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu ndiye atakayemjibu, wala si mwanadamu,” au, “Mungu ndiye anayeweza kumtiisha, wala si mwanadamu.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kufukuza mbali” au “kupeperusha mbali,” lakini hapa huenda kikamaanisha kwa upana zaidi kumshinda Ayubu au kuyakanusha maneno yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Msije
  rationale: Huanzisha onyo dhidi ya jambo linaloweza kusemwa; muundo wa Kiswahili ‘msije mkasema’ unaonyesha kusudi la kulizuia.
- source_word: תֹּאמְרוּ
  choice: mkasema
  rationale: Ni nafsi ya pili wingi, na pamoja na ‘msije’ huwasilisha vizuri usemi unaotazamiwa.
- source_word: מָצָאנוּ חָכְמָה
  choice: Tumepata hekima
  rationale: Huhifadhi kitenzi timilifu na nomino ya kawaida ‘hekima’ bila kufafanua zaidi ya chanzo.
- source_word: אֵל
  choice: Mungu
  rationale: Katika muktadha huu humrejelea Mungu na humtofautisha na mwanadamu.
- source_word: יִדְּפֶנּוּ
  choice: atakayemshinda
  rationale: Mzizi נדף kwa kawaida una wazo la kufukuza au kupeperusha mbali; hapa kwa muktadha unaonekana kumaanisha kumlemea au kumshinda Ayubu. Tafsiri hii ni ya asili kwa Kiswahili huku chaguo za karibu zaidi na taswira ya Kiebrania zikiwekwa katika tanbihi.
- source_word: לֹא אִישׁ
  choice: wala si mwanadamu
  rationale: Huhifadhi utofautishaji kati ya Mungu na mtu wa kibinadamu kwa maana ya kijumla.
theological_decisions:
- issue: Maana ya אֵל יִדְּפֶנּוּ לֹא אִישׁ
  choice: Mungu ndiye atakayemshinda, wala si mwanadamu
  alternative: Mungu ndiye atakayemjibu, wala si mwanadamu; Mungu anaweza kumtiisha, wala si mwanadamu
  rationale: Kitenzi kina taswira ya kufukuza mbali, lakini katika muktadha kinaweza kuashiria kumshinda, kumtiisha, au kuyakanusha madai ya Ayubu. Matini kuu inatoa maana inayosomeka kwa kawaida, na tanbihi inalinda utata halisi.
- issue: אִישׁ kama jina la kijumla likitofautishwa na Mungu
  choice: mwanadamu
  alternative: mtu
  rationale: ‘Mwanadamu’ huonyesha wazi kuwa utofautishaji ni kati ya Mungu na wakala wa kibinadamu, si lazima mwanaume mahususi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida. ‘Msije mkasema’ ni onyo la asili; ‘mwanadamu’ huhifadhi utofautishaji wa kijumla na Mungu. Alama ya tanbihi [a] imewekwa baada ya kitenzi kinachohusika.
