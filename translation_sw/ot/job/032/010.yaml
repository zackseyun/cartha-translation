  yaml_path: translation/ot/job/032/010.yaml
  text: Therefore I say[a], ‘Listen to me; I too will declare my knowledge.’
translation:
  language: sw
  text: Kwa hiyo nasema[a], “Nisikilize; mimi pia nitatangaza ninayojua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hiyo nilisema, ‘Nisikilize; mimi pia nitatangaza ninayojua.’” Kitenzi cha Kiebrania kilicho katika umbo timilifu kinaweza kueleweka kuwa wakati uliopita, lakini hapa huenda kina nguvu ya kauli inayotolewa sasa katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha hoja kinachoonyesha hitimisho linalotokana na yaliyotangulia; ‘Kwa hiyo’ ni Kiswahili cha kawaida na wazi.
- source_word: אָמַרְתִּי
  choice: nasema
  rationale: Ingawa kimaumbo ni timilifu (‘nilisema’), katika muktadha huu inaweza kuwa kauli tendaji ya wakati huu inayoanzisha azimio la Elihu.
- source_word: שִׁמְעָה לִּי
  choice: Nisikilize
  rationale: Amri ya umoja inadai usikivu kwa msemaji; umbo hili ni la asili zaidi katika Kiswahili kuliko ‘sikia kwangu’.
- source_word: אֲחַוֶּה
  choice: nitatangaza
  rationale: Kitenzi kina maana ya kufanya jambo lijulikane au kulieleza wazi; ‘nitatangaza’ inadumisha uzito wa usemi bila kuongeza wazo la kufafanua.
- source_word: דֵּעִי
  choice: ninayojua
  rationale: Huwakilisha moja kwa moja ‘ujuzi wangu’ kwa Kiswahili cha asili, huku ikihifadhi dai la Elihu kuhusu anachokijua badala ya kulidhoofisha kuwa maoni tu.
- source_word: אַף אֲנִי
  choice: mimi pia
  rationale: Hudumisha nyongeza yenye mkazo kwamba Elihu naye atasema, kwa mpangilio wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ninayojua’ limetumiwa badala ya ‘ujuzi wangu’ ili sentensi iwe ya asili kwa wasomaji wa kawaida bila kupunguza maana ya דֵּעִי.
