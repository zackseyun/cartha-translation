base_translation:
  language: en
  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: sw
  text: Kwa maana sijui kutaja majina ya kubembeleza[a]; la sivyo, Muumba wangu angeniondoa upesi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwita mtu kwa jina la heshima ili kujipendekeza.” Kitenzi cha Kiebrania kinaweza kumaanisha kutumia majina au vyeo vya heshima kwa namna ya kubembeleza au kuonyesha upendeleo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Muumba wangu angenichukua upesi.” Kiebrania hakisemi wazi “angeniua,” ingawa kuondolewa kwa hukumu kunaweza kudokezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaanzisha sababu ya Elihu kukataa kuonyesha upendeleo katika muktadha uliotangulia.
- source_word: לֹא יָדַעְתִּי
  choice: sijui
  rationale: Pamoja na kitenzi kinachofuata, kauli hii inaonyesha kutokuwa na ujuzi au mazoea ya kufanya jambo hilo; wakati wa sasa ni wa asili katika Kiswahili hapa.
- source_word: אֲכַנֶּה
  choice: kubembeleza
  rationale: Katika muktadha wa upendeleo, kitenzi hiki kinahusu kumwita mtu kwa majina ya heshima ili kujipendekeza. 'Kubembeleza' huwasilisha maana hiyo hasi kwa lugha ya kawaida, huku ufafanuzi kamili ukihifadhiwa katika tanbihi.
- source_word: כִּמְעַט
  choice: upesi
  rationale: Katika onyo hili, neno linaonyesha kuwa matokeo yangekuja bila kukawia.
- source_word: יִשָּׂאֵנִי
  choice: angeniondoa
  rationale: Kitenzi נשא kinaweza kumaanisha kuinua, kuchukua, kubeba, au kuondoa. 'Angeniondoa' huhifadhi wazo la kuondolewa katika hukumu bila kusema wazi kwamba ni kuuawa.
- source_word: עֹשֵׂנִי
  choice: Muumba wangu
  rationale: Huwasilisha kwa ufupi na kwa hadhi maana ya 'yule aliyenifanya' pamoja na uhusiano binafsi wa kiumbe na Muumba wake.
theological_decisions:
- issue: Asili ya tendo la Mungu linalotishwa
  choice: Muumba wangu angeniondoa upesi
  alternative: Muumba wangu angeniua upesi; Muumba wangu angenichukua upesi
  rationale: Neno נשא halisemi wazi 'kuua,' ingawa kifo kama hukumu kinaweza kudokezwa. Tafsiri inaacha upana huo wa maana bila kudhoofisha uzito wa onyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa tanbihi umewekwa kulingana na maneno yanayofafanuliwa katika maandishi.
