translation:
  language: sw
  text: Lakini kuna roho ndani ya mwanadamu[a], na pumzi ya Mwenyezi huwapa ufahamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakika kuna roho ndani ya mtu, na pumzi ya Mwenyezi humpa ufahamu.” Kiebrania hubadilika kutoka “mwanadamu” katika umoja kwenda kiambishi cha yambwa cha wingi, “huwapa”; baadhi ya tafsiri hulainisha badiliko hilo kwa kutumia umoja.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: Lakini
  rationale: Katika mtiririko wa hoja ya Elihu, neno hili linaanzisha msisitizo wa kusahihisha au kutofautisha; “Lakini” linaonyesha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: רוּחַ
  choice: roho
  rationale: Hapa neno linaelekea kumaanisha hali au sehemu isiyo ya mwili ndani ya mwanadamu; “roho” pia hulitofautisha na נִשְׁמָה, ambalo limetafsiriwa “pumzi.”
- source_word: הִיא
  choice: kuna
  rationale: Kiwakilishi hiki katika kishazi kisicho na kitenzi kinaweza kutolewa kwa Kiswahili kwa muundo wa uwepo, “kuna,” bila kulazimisha muundo mzito wa neno kwa neno.
- source_word: בֶאֱנוֹשׁ
  choice: ndani ya mwanadamu
  rationale: אֱנוֹשׁ humaanisha binadamu anayeweza kufa. “Mwanadamu” huhifadhi umoja wa jumla na ni lugha ya asili na yenye heshima.
- source_word: וְנִשְׁמַת
  choice: na pumzi ya
  rationale: נִשְׁמָה kwa kawaida ni “pumzi,” hasa katika mazingira ya uhai au uwezo unaotoka kwa Mungu; tafsiri hii hudumisha utofauti wake na רוּחַ.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Hili ni jina la cheo cha Mungu. “Mwenyezi” ni tafsiri ya kawaida ya Kiswahili inayowasilisha mamlaka na uwezo mkuu bila kulazimika kulinakili kama Shaddai.
- source_word: תְּבִינֵם
  choice: huwapa ufahamu
  rationale: Umbo la Hifili la בין lina maana ya kusababisha waelewe au kuwapa utambuzi. Kiambishi cha wingi katika “huwapa” kinahifadhi rejeo la Kiebrania la nafsi ya tatu wingi.
theological_decisions:
- issue: Lugha kuhusu asili ya mwanadamu na badiliko la idadi
  choice: Kudumisha “mwanadamu” katika umoja wa jumla, kisha “huwapa” katika wingi.
  alternative: 'Kulainisha sentensi iwe katika umoja wote: “mwanadamu ... humpa ufahamu.”'
  rationale: Kiebrania hubadilika kutoka אֱנוֹשׁ katika umoja kwenda kiambishi cha wingi katika תְּבִינֵם. Tafsiri inadumisha mvutano huo badala ya kuupatanisha kimya kimya.
- issue: Uhusiano kati ya roho ya mwanadamu na pumzi ya Mwenyezi
  choice: Kutumia vishazi viwili vilivyounganishwa kwa “na,” bila kuvifanya viwe kitu kimoja waziwazi.
  alternative: “Ni roho ndani ya mwanadamu, yaani pumzi ya Mwenyezi, inayowapa ufahamu.”
  rationale: Ushairi wa Kiebrania unaweka mawazo haya sambamba, lakini hauamui wazi ikiwa ni maelezo ya kitu kilekile au vipengele vinavyohusiana. Tafsiri haiongezi utambulisho wa moja kwa moja usiotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwanadamu” hutumika kwa maana ya jumla, na badiliko la umoja kwenda wingi limehifadhiwa kwa makusudi. Muundo ni wa asili lakini unabaki karibu na ulinganifu wa kishairi wa Kiebrania.
