  language: sw
  text: Nilisema[a], “Watu wenye umri mkubwa wanapaswa kusema, na watu walioishi miaka mingi wanapaswa kuifanya hekima ijulikane.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nilidhani, ‘Umri mkubwa unapaswa kusema, na miaka mingi inapaswa kuifanya hekima ijulikane.’” Kiebrania hutumia “siku” na “wingi wa miaka” kimetonimia kumaanisha umri mkubwa au watu wenye umri mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Nilisema
  rationale: Ni kitenzi cha Qal timilifu, nafsi ya kwanza umoja, na maana yake ya moja kwa moja ni ‘nilisema.’ Katika muktadha kinaweza pia kueleza wazo la Elihu la awali, hivyo ‘Nilidhani’ limetajwa katika tanbihi kama chaguo jingine.
- source_word: יָמִים
  choice: Wenye umri mkubwa
  rationale: Neno halisi ni ‘siku,’ lakini hapa limetumiwa kimetonimia kumaanisha watu walioishi siku nyingi, yaani wenye umri mkubwa. Tafsiri ya maana hii ni ya kawaida na wazi kwa Kiswahili cha sasa.
- source_word: יְדַבֵּרוּ
  choice: wanapaswa kusema
  rationale: Piel imperfecti hapa huonyesha matarajio au jambo lililodhaniwa kuwa linafaa, si utabiri wa wakati ujao tu. ‘Wanapaswa kusema’ huhifadhi dhana hiyo.
- source_word: וְרֹב שָׁנִים
  choice: wenye miaka mingi
  rationale: Kirai hiki kihalisi ni ‘wingi wa miaka.’ Katika usambamba wa kishairi kinawarejelea watu walioishi miaka mingi, hivyo chaguo hili ni wazi na la asili kwa Kiswahili.
- source_word: יֹדִיעוּ
  choice: wanapaswa kudhihirisha
  rationale: Hiphil imperfecti ya ידע humaanisha ‘kusababisha kujulikana’ au ‘kujulisha.’ ‘Kudhihirisha’ huhifadhi wazo la kuifanya hekima ijulikane bila kulibana kuwa kufundisha pekee.
- source_word: חָכְמָה
  choice: hekima
  rationale: Nomino hii humaanisha moja kwa moja ‘hekima’ na inadumisha msamiati mkuu wa kitabu cha Ayubu.
