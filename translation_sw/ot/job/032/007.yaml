translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imeweka wazi marejeo kwa watu wazee yaliyomo kimetonimia katika ‘siku’ na ‘wingi wa miaka,’ huku tanbihi ikihifadhi taswira halisi ya Kiebrania na uwezekano wa kutafsiri אָמַרְתִּי kuwa ‘Nilidhani.’
