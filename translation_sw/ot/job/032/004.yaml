lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: Elihu
  rationale: Kiunganishi waw kinaendeleza simulizi, lakini Kiswahili hakihitaji kiunganishi cha mwanzo hapa. Jina limetoholewa kwa umbo lililozoeleka la Kiswahili.
- source_word: חִכָּה
  choice: alikuwa amengoja
  rationale: Kitenzi humaanisha ‘kungoja.’ Wakati timilifu wa zamani unaonyesha tendo hili lilikuwa limeendelea kabla ya hatua inayofuata katika simulizi.
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: kusema na Ayubu
  rationale: Muundo wa Kiebrania ni wa karibu na ‘alimngojea Ayubu kwa maneno.’ Katika muktadha, maana yake ni kwamba Elihu alingoja kabla ya kusema na Ayubu; tafsiri hii ni ya asili kwa Kiswahili bila kupoteza maana.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaeleza sababu iliyomfanya Elihu angoje.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ לְיָמִים
  choice: wao walikuwa na umri mkubwa kuliko yeye
  rationale: Hapa זְקֵנִים inaonyesha ulinganisho wa umri, si cheo cha wazee. Kirai לְיָמִים, kihalisi ‘kwa siku,’ ni nahau ya umri; Kiswahili cha kawaida husema ‘na umri mkubwa kuliko yeye.’
