  text: Elihu alikuwa amengoja kusema na Ayubu[a], kwa sababu wao walikuwa wakubwa kuliko yeye kwa umri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Elihu alimngojea Ayubu kwa maneno”; maana yake ni kwamba alingoja kusema na Ayubu.
