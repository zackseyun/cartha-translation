  yaml_path: translation/ot/job/032/017.yaml
  text: I too will answer for my part[b][a]; I too will declare my knowledge.
translation:
  language: sw
  text: Mimi pia nitajibu kwa upande wangu[a]; mimi pia nitaeleza ninachojua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu yangu” au “fungu langu.” Kiebrania kinazungumzia kihalisi fungu la Elihu, yaani, huenda, mchango wake katika mjadala.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “nitaeleza ujuzi wangu”; pia inaweza kutafsiriwa, “nitafanya ninachojua kijulikane.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַעֲנֶה
  choice: nitajibu
  rationale: Kitenzi ענה katika Qal humaanisha kujibu au kuitikia; “nitajibu” kinafaa katika muktadha wa mjadala.
- source_word: אַף אֲנִי
  choice: mimi pia
  rationale: Kirai hiki cha msisitizo kinaonyesha kuwa Elihu naye anaingia katika mazungumzo. Kurudiwa kwake kumedumishwa ili kuhifadhi usambamba wa Kiebrania.
- source_word: חֶלְקִי
  choice: kwa upande wangu
  rationale: חלק ni “sehemu” au “fungu”; hapa kinarejelea mchango wa Elihu katika mjadala. “Kwa upande wangu” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila tafsiri ngumu ya neno kwa neno.
- source_word: אֲחַוֶּה
  choice: nitaeleza
  rationale: חוה katika Piel inaweza kumaanisha kutangaza, kueleza, au kufanya jambo lijulikane. “Nitaeleza” ni ya asili katika muktadha wa kusema anachojua.
- source_word: דֵעִי
  choice: ninachojua
  rationale: דעה humaanisha ujuzi au ufahamu. “Ninachojua” ni usemi wa kawaida wa Kiswahili unaohifadhi maana bila kuifanya kuwa “maoni” tu.
