lexical_decisions:
- source_word: עַל
  choice: Ingawa
  rationale: 'Katika muktadha huu kihusishi kinaeleweka kwa maana ya kukubali hali inayokinzana: Ayubu anateseka ingawa anadai kwamba hakutenda ukatili. Tafsiri hii ni ya asili katika Kiswahili huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.'
- source_word: לֹא
  choice: hakuna
  rationale: Katika kishazi hiki cha kitenzi-jina, ‘hakuna’ ndiyo njia ya kawaida ya Kiswahili ya kueleza kutokuwapo kwa ukatili.
- source_word: חָמָס
  choice: ukatili
  rationale: Neno hili linaweza kumaanisha ukatili, dhuluma, au uovu. ‘Ukatili’ huhifadhi maana yake ya moja kwa moja bila kuifunga kwa shambulio la kimwili pekee.
- source_word: בְּכַפָּי
  choice: mikononi mwangu
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania ya mikono kama mahali pa matendo na hatia ya mtu.
- source_word: וּתְפִלָּתִי
  choice: na sala yangu
  rationale: ‘Sala’ ni neno la kawaida na la heshima kwa tendo la kumwelekea Mungu; umoja wake pia unaendana na nomino ya umoja katika Kiebrania.
- source_word: זַכָּה
  choice: ni safi
  rationale: Kivumishi hiki hueleza usafi au kutokuwa na uchafu. ‘Safi’ kinafaa kwa sala na huhifadhi maana ya kimaadili bila kufanya dai kuwa fundisho la kutokuwa na dhambi kabisa.
theological_decisions:
- issue: Dai la Ayubu kuhusu kutokuwa na hatia
  choice: 'Kuliwasilisha kama dai lenye upeo wa mstari huu: hana ukatili mikononi mwake, na sala yake ni safi.'
  alternative: Kulifanya kuwa dai kamili kwamba Ayubu hana dhambi yoyote, au kulipunguza liwe dai la usafi wa kiibada pekee.
  rationale: Mstari huu ni sehemu ya utetezi wa Ayubu dhidi ya wazo kwamba mateso yake yametokana na ukatili alioutenda. Tafsiri huhifadhi mvutano huo bila kuingiza dai pana la ukamilifu wa kimaadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Taswira ya ‘mikononi mwangu’ imehifadhiwa, na ‘sala’ imetumiwa ili kudumisha umoja wa neno la Kiebrania.
