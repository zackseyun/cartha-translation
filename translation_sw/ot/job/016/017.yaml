  text: Ingawa hakuna udhalimu mikononi mwangu[a], na sala yangu ni safi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana hakuna udhalimu mikononi mwangu.” Kihusishi cha Kiebrania kinaweza kueleweka kwa njia zaidi ya moja; matini kuu kimetumia maana ya kukubali hali inayokinzana kutokana na muktadha.
    reason: lexical_alternative
  - marker: b
