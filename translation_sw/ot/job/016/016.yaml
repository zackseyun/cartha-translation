  text: פָּנַ֣/י חמרמרה מִנִּי בֶ֑כִי וְ/עַ֖ל עַפְעַפַּ֣/י צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: sw
  text: 'Uso wangu umekuwa mwekundu kwa kulia,

    na juu ya kope zangu kuna giza nene.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kivuli cha mauti.” Neno la Kiebrania linaweza kumaanisha kivuli kinachohusishwa na mauti au giza zito sana; hapa muktadha unaelekea kuonyesha giza kuu juu ya kope.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: uso wangu
  rationale: Nomino ya Kiebrania yenye kiambishi cha nafsi ya kwanza hutumiwa hapa kwa maana ya uso mzima; “uso wangu” ni sahihi na ya kawaida katika Kiswahili.
- source_word: חמרמרה
  choice: umekuwa mwekundu
  rationale: Kitenzi hiki adimu kinaonyesha uso uliobadilika kwa huzuni au maumivu makali. Katika muktadha wa kulia, “umekuwa mwekundu” huwasilisha athari inayoonekana bila kudai kwa uhakika kuwa uso umevimba au umeungua.
- source_word: מִנִּי בֶכִי
  choice: kwa kulia
  rationale: Kihusishi kinaonyesha sababu ya hali ya uso, na nomino בֶכִי humaanisha kulia au kilio. “Kwa kulia” ni usemi wa kawaida unaohifadhi uhusiano huo wa kisababishi.
- source_word: וְעַל עַפְעַפַּי
  choice: na juu ya kope zangu
  rationale: Tafsiri hii inadumisha muundo wa mstari wa pili na maana mahususi ya עַפְעַפַּי, yaani kope, badala ya kuipanua kuwa macho.
- source_word: צַלְמָוֶת
  choice: giza nene
  rationale: Neno hili la kishairi linaweza kumaanisha giza zito sana au kivuli cha mauti. “Giza nene” linafaa katika picha ya kope na huzuni kali, huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye hadhi. Mistari miwili inadumisha usambamba wa Kiebrania. Alama ya tanbihi imewekwa baada ya “giza nene,” ambako neno husika צַלְמָוֶת limetafsiriwa.
