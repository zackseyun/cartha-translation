base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: sw
  text: Wapiga mishale wake[a] wananizunguka; anapasua figo zangu[b] wala hanihurumii; anamwaga nyongo yangu[c] ardhini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wake” au “watu wake mashuhuri.” Umbo la Kiebrania ni gumu; “wapiga mishale wake” linaendana na taswira ya shambulio katika mstari huu na muktadha mpana.
    reason: alternative_reading
  - marker: b
    text: Kiebrania ni “figo zangu,” yaani viungo halisi vya ndani ambavyo pia vinaweza kuwakilisha undani wa nafsi katika nahau ya Kiebrania.
    reason: cultural_note
  - marker: c
    text: Au “safura yangu” au “uchungu wangu.” Neno hilo humaanisha nyongo, lakini linaweza pia kutumiwa kwa maana ya uchungu; maana ya kiungo cha mwili inafaa taswira kali ya mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: wananizunguka
  rationale: Kitenzi cha Kiebrania kinaonyesha kuzunguka kwa nia ya kushambulia; “wananizunguka” ni Kiswahili cha kawaida na kinahifadhi taswira hiyo.
- source_word: רַבָּיו
  choice: wapiga mishale wake
  rationale: Umbo la Kiebrania ni gumu na linaweza kueleweka kuwa “wakuu wake” au “watu wake mashuhuri.” Hata hivyo, “wapiga mishale wake” linafaa taswira ya shambulio katika mstari huu na muktadha mpana.
- source_word: יְפַלַּח
  choice: anapasua
  rationale: Piel ya פלח inaeleza kupasua au kuchana kwa nguvu; “anapasua” ni wazi, ya sasa, na inahifadhi ukali wa picha.
- source_word: כִּלְיוֹתַי
  choice: figo zangu
  rationale: Neno hilo humaanisha figo kihalisi. Kiungo halisi kimehifadhiwa ili kudumisha taswira ya ndani ya mwili bila kuibadili kuwa dhana ya jumla.
- source_word: וְלֹא יַחְמוֹל
  choice: wala hanihurumii
  rationale: חמל hapa humaanisha kutomhurumia au kutomwacha mtu; “hanihurumii” ni ya asili katika Kiswahili na inaonyesha wazi ukosefu wa huruma.
- source_word: יִשְׁפֹּךְ
  choice: anamwaga
  rationale: שפך humaanisha kumwaga; chaguo hili linaendeleza taswira halisi na kali ya viungo vya ndani kumwagika.
- source_word: מְרֵרָתִי
  choice: nyongo yangu
  rationale: Neno linaweza kumaanisha nyongo kimwili na pia linahusiana na uchungu. “Nyongo” linafaa zaidi hapa kwa sababu mstari unatumia taswira ya viungo vya mwili.
theological_decisions:
- issue: Taswira ya mwili katika lugha ya kishairi kuhusu mateso
  choice: Kuhifadhi maneno halisi “figo” na “nyongo” katika matini kuu.
  alternative: Kutumia maneno ya kufasiri kama “undani wangu” na “uchungu wangu.”
  rationale: Mstari unaeleza mateso ya Ayubu kwa taswira kali ya viungo vya ndani. Kuhifadhi viungo halisi kunadumisha nguvu ya ushairi wa Kiebrania na hakulazimishi maana ya mfano.
- issue: Mabadiliko kutoka watendaji wengi hadi mtendaji mmoja
  choice: Kutafsiri wingi katika kishazi cha kwanza, kisha umoja katika vishazi vinavyofuata.
  alternative: Kufanya vitenzi vyote viwe vya wingi kwa kuwa wapiga mishale ndio waliotajwa moja kwa moja.
  rationale: Matini ya Kiebrania ina kitenzi cha wingi mwanzoni lakini vitenzi vya umoja baadaye. Tafsiri inahifadhi mvutano huo badala ya kuusawazisha kimyakimya; mtendaji wa umoja anaeleweka kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na kali ili kuhifadhi nguvu ya ushairi. “Nyongo” limechaguliwa badala ya “safura” kwa kuwa linaeleweka kwa urahisi zaidi na hudumisha maana ya kimwili; viambishi vya nafsi katika “wananizunguka” na “hanihurumii” vinaonyesha wazi kuwa Ayubu ndiye anayeteswa.
