  yaml_path: translation/ot/job/016/005.yaml
  text: I could strengthen you with my mouth[b][a], and the moving of my lips could hold back grief.
translation:
  language: sw
  text: 'Ningewatia nguvu kwa kinywa changu,

    na msogeo wa midomo yangu[a] ungezuia huzuni yenu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “faraja ya midomo yangu” au “ishara ya huruma ya midomo yangu.” Neno la Kiebrania נִיד linaweza kutaja msogeo au ishara inayoonyesha faraja na huruma, si mwendo wa kimwili tu.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja moja, “ungezuia.” Kiebrania hakitaji kitu kinachozuiwa; “huzuni yenu” limeongezwa kutokana na muktadha wa faraja.
    reason: implicit_object
lexical_decisions:
- source_word: אֲאַמִּצְכֶם
  choice: Ningewatia nguvu
  rationale: Kitenzi cha Piel cha אמץ pamoja na kiambishi cha nafsi ya pili wingi humaanisha ‘kuwatia nguvu.’ Hali ya masharti inaendeleza wazo la mstari wa 4 kwamba Ayubu anazungumzia hali ya kubadilishana nafasi.
- source_word: בְּמוֹ פִי
  choice: kwa kinywa changu
  rationale: Huhifadhi taswira halisi ya Kiebrania, ambapo kinywa ndicho chombo cha kusema, bila kuongeza neno ‘maneno’ lisilokuwamo wazi katika matini.
- source_word: נִיד
  choice: mwendo
  rationale: Neno hili linaweza kumaanisha mwendo au ishara, hasa mwendo unaoonyesha huruma au faraja. ‘Mwendo’ huhifadhi taswira ya midomo na pia huacha maana ya faraja ielezwe katika tanbihi.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Tafsiri ya moja kwa moja inayohifadhi usambamba wa kishairi kati ya ‘kinywa changu’ na ‘midomo yangu.’
- source_word: יַחְשֹׂךְ
  choice: ungepunguza
  rationale: חשׂך inaweza kumaanisha kuzuia, kunyima, au kupunguza. Katika muktadha wa kumfariji mwenye kuteseka, ‘ungepunguza’ ni Kiswahili cha asili kinachoeleza athari inayokusudiwa bila kudai kwamba huzuni ingeondolewa kabisa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na taswira za ‘kinywa’ na ‘midomo’ zimehifadhiwa, huku hali ya kudhania ikionyeshwa kwa ‘ninge-/unge-’.
