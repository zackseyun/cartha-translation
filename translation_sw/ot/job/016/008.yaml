  text: וַֽ֭/תִּקְמְטֵ/נִי לְ/עֵ֣ד הָיָ֑ה וַ/יָּ֥קָם בִּ֥/י כַ֝חֲשִׁ֗/י בְּ/פָנַ֥/י יַעֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: sw
  text: Umenifanya nikunjamane—hilo limekuwa shahidi; ukondefu wangu umesimama dhidi yangu na kunijibu usoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: Umenifanya nikunjamane
  rationale: Kitenzi קמט hueleza kukunjamana au kusinyaa. Tafsiri hii inaonyesha mwili wa Ayubu uliodhoofika bila kuongeza sababu ambayo Kiebrania hakuitaji.
- source_word: כַחֲשִׁי
  choice: ukondefu wangu
  rationale: Katika muktadha huu כחשׁ inaelekea kumaanisha hali ya kukonda au kudhoofika mwilini; “ukondefu” ni neno la kawaida na linaloeleweka katika Kiswahili sanifu.
- source_word: יַעֲנֶה
  choice: kunijibu
  rationale: Maana ya msingi ni “kujibu.” Imehifadhiwa badala ya kufasiri moja kwa moja kuwa “kunishuhudia” au “kunishtaki,” ingawa muktadha una ladha ya ushahidi dhidi ya Ayubu.
- source_word: בְּפָנַי
  choice: usoni
  rationale: 'Huhifadhi taswira ya “mbele ya uso wangu” kwa Kiswahili cha kawaida: “kunijibu usoni,” yaani moja kwa moja mbele yake.'
theological_decisions:
- issue: Utambulisho wa shahidi katika kishazi לְעֵד הָיָה
  choice: hilo limekuwa shahidi
  alternative: umekuwa shahidi
  rationale: Kiebrania kinaweza kuelekeza kwenye kukunjamana kwa Ayubu au hali yake ya mwili kama ushahidi. “Hilo” huhifadhi rejeo hilo bila kumtambulisha Mungu mwenyewe kuwa ndiye shahidi.
- issue: Nguvu ya kisheria ya יַעֲנֶה
  choice: kunijibu
  alternative: kunishuhudia
  rationale: “Kujibu” huhifadhi neno la Kiebrania na mvutano wake wa kimahakama bila kulifanya kwa lazima kuwa kauli rasmi ya ushahidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na uhuishaji wa “ukondefu” kama shahidi anayesimama dhidi ya Ayubu umehifadhiwa.
