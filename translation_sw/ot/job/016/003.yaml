  yaml_path: translation/ot/job/016/003.yaml
  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: sw
  text: Je, maneno ya upepo hayana mwisho? Au ni nini kinachokuchochea[a] hata ujibu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinachokupa ujasiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲקֵץ
  choice: Je, ... hayana mwisho?
  rationale: קֵץ ni ‘mwisho’ au ‘kikomo.’ Katika muktadha, kiulizi hiki ni cha balagha na kinaonyesha kukerwa kwa Ayubu; muundo huu wa Kiswahili unawasilisha nguvu hiyo kwa kawaida.
- source_word: לְדִבְרֵי רוּחַ
  choice: maneno ya upepo
  rationale: Kirai hiki kihalisi ni ‘maneno ya upepo/roho’ na hapa kinadokeza maneno yasiyo na uzito au maana. ‘Maneno ya upepo’ huhifadhi sitiari ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: אוֹ
  choice: Au
  rationale: Kiunganishi rahisi kinachoanzisha swali la pili la balagha.
- source_word: מַה
  choice: ni nini
  rationale: Kiwakilishi cha kuuliza kinachotafuta kisababishi au msukumo wa jibu la mwenzake.
- source_word: יַמְרִיצְךָ
  choice: kinachokuchochea
  rationale: Hifili ya מרץ hapa inaweza kueleza kuchochewa, kusukumwa, au kutiwa ujasiri wa kujibu. ‘Kinachokuchochea’ inafaa muktadha wa mabishano, huku uwezekano wa ‘kinachokupa ujasiri’ ukihifadhiwa katika tanbihi.
- source_word: כִּי
  choice: hata
  rationale: 'Katika muundo huu, כִּי inaunganisha msukumo na tendo linalofuata. ‘Hata’ huleta kwa Kiswahili wazo la matokeo: ni nini kinachomsukuma kiasi cha kujibu.'
- source_word: תַעֲנֶה
  choice: ujibu
  rationale: Kitenzi ענה katika Qal humaanisha ‘kujibu’ au ‘kuitikia.’ Tafsiri fupi ‘ujibu’ haiongezi namna ya jibu ambayo haijaelezwa wazi katika Kiebrania.
