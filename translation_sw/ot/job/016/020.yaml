translation:
  language: sw
  text: Rafiki zangu ndio wanaonidhihaki[a]; jicho langu humwaga machozi kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Rafiki zangu ndio waombezi au wapatanishi wangu.” Baadhi ya watafsiri hulielewa neno la Kiebrania מְלִיצַי kwa maana hii chanya; lakini katika muktadha huu maana ya “wanaonidhihaki” inafaa zaidi na malalamiko ya Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: wenye kunidhihaki
  rationale: Katika muktadha wa malalamiko ya Ayubu, neno hili linaeleweka vizuri kwa maana ya watu wanaomdhihaki. Maana chanya ya wapatanishi au waombezi imehifadhiwa katika tanbihi kwa sababu umbo la Kiebrania linaweza kufasiriwa hivyo.
- source_word: רֵעָי
  choice: rafiki zangu
  rationale: רֵעַ humaanisha rafiki au mwandamani. 'Rafiki zangu' ni Kiswahili cha kawaida na kinadumisha kinaya kwamba waliopaswa kumsaidia Ayubu ndio wanaomdhihaki.
- source_word: אֶל אֱלוֹהַ
  choice: Mungu
  rationale: אֶל huelekeza kitendo kwa Mungu, naye אֱלוֹהַ ni jina la kawaida la Mungu katika kitabu cha Ayubu. Muundo 'linamtolea Mungu' unaonyesha kwamba machozi yake yanaelekezwa kwake.
- source_word: דָּלְפָה
  choice: linamtolea ... machozi
  rationale: Kitenzi humaanisha kudondoka au kutiririka kwa majimaji. Katika Kiswahili, pamoja na 'jicho langu', usemi huu unaeleza kwa kawaida kilio cha kudumu huku ukihifadhi picha ya machozi yanayotiririka.
- source_word: עֵינִי
  choice: jicho langu
  rationale: Kiebrania ni umoja. Umoja umehifadhiwa ili kufuata picha ya kishairi ya maandishi ya chanzo.
