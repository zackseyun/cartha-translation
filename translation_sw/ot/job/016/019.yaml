  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: sw
  text: 'Hata sasa, tazama: shahidi wangu yuko mbinguni, naye anayenitolea ushahidi[a] yuko huko juu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shahidi wangu.” Neno la pili ni karibu sawa na neno la kwanza linalotafsiriwa “shahidi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika sehemu za juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Hata sasa
  rationale: Kirai hiki kinasisitiza hali ya Ayubu ya wakati huu; “Hata sasa” ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira kwa dai linalofuata. “Tazama” lina hadhi inayofaa na linahifadhi nguvu ya usemi wa Kiebrania.
- source_word: בַשָּׁמַיִם
  choice: mbinguni
  rationale: Katika muktadha huu שָׁמַיִם ni ulimwengu wa mbinguni, si anga la kawaida; “mbinguni” ni usemi wa asili katika Kiswahili.
- source_word: עֵדִי
  choice: shahidi wangu
  rationale: Tafsiri ya moja kwa moja inayohifadhi picha ya kisheria katika ombi la Ayubu.
- source_word: וְשָׂהֲדִי
  choice: naye anayenitolea ushahidi
  rationale: Nomino hii yenye asili ya Kiaramu ni karibu sawa na “shahidi.” Usemi huu unaonyesha kazi ya kutoa ushahidi bila kuifanya kuwa “mtetezi,” maana ambayo ingekuwa ya kufasiri zaidi.
- source_word: בַּמְּרוֹמִים
  choice: huko juu
  rationale: Hurejelea mahali palipoinuka na hapa inalingana kishairi na “mbinguni.” “Huko juu” ni ya asili na bado huhifadhi taswira ya mahali pa juu.
theological_decisions:
- issue: Utambulisho wa shahidi wa Ayubu aliye mbinguni
  choice: Kumweleza tu kwa kazi yake kama “shahidi wangu” na “anayenitolea ushahidi,” bila kumtambulisha zaidi.
  alternative: Kumtambulisha wazi kuwa Mungu, malaika mpatanishi, au ushahidi wa Ayubu uliofanywa kama mtu.
  rationale: Kiebrania hakimtambulishi shahidi huyo waziwazi. Tafsiri inaacha mvutano huo wa kiteolojia kama ulivyo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Alama zote za tanbihi zimewekwa katika matini kuu.
