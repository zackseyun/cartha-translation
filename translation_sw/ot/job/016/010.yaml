lexical_decisions:
- source_word: פָּעֲרוּ
  choice: wamepanua
  rationale: Kitenzi hiki huonyesha kufungua kinywa kwa upana, hasa kwa uhasama au dhihaka; “wamepanua” inadumisha picha hiyo kwa Kiswahili cha kawaida.
- source_word: עָלַי
  choice: dhidi yangu
  rationale: Katika muktadha wa mashambulizi na uhasama, kihusishi hiki kinaonyesha upinzani dhidi ya Ayubu.
- source_word: בְּפִיהֶם
  choice: vinywa vyao
  rationale: Ingawa Kiebrania kina umbo la umoja wa kijumla, wingi ni wa asili katika Kiswahili kwa sababu mtenda ni wa wingi.
- source_word: בְּחֶרְפָּה
  choice: kwa dharau
  rationale: Neno hili lina maana ya shutuma, fedheha au dharau; “kwa dharau” linaonyesha hali ya tendo bila kulazimisha kwamba pigo lilikuwa la maneno tu.
- source_word: הִכּוּ
  choice: wamenipiga
  rationale: Kitenzi נכה humaanisha kupiga; kiambishi cha yambwa kinaunganisha kwa kawaida tendo hilo na msemaji.
- source_word: לְחָיָי
  choice: shavuni
  rationale: לחי ni shavu au taya; “shavuni” ni usemi wa kawaida na huhifadhi picha ya shambulio la kudhalilisha.
- source_word: יַחַד
  choice: kwa pamoja
  rationale: Neno hili linasisitiza kitendo cha kundi kwa umoja.
- source_word: יִתְמַלָּאוּן
  choice: wamekusanyika
  rationale: Umbo hili la מלא ni la kinahau na gumu hapa; katika muktadha linaelekea kueleza maadui wanaojikusanya kwa nguvu dhidi ya Ayubu. Tanbihi inadumisha uwezekano mwingine wa maana.
