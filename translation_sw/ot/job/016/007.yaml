  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: sw
  text: Hakika sasa amenichosha[a]; wewe umeangamiza kusanyiko langu lote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amenimaliza nguvu” au “amenifanya nichoke.”
    reason: lexical_alternative
  - marker: b
    text: Au “kundi langu lote” au “jamaa yangu yote.” Neno la Kiebrania linaweza kumaanisha kusanyiko, kundi, au watu waliomzunguka Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Kihusishi hiki kinaweka mkazo katika mgeuko wa Ayubu kuelekea mateso yake ya sasa; “Hakika” huhifadhi nguvu hiyo bila kukifanya kiwe cha maana ya “tu” pekee.
- source_word: עַתָּה
  choice: sasa
  rationale: Kielezi cha wakati kinachoonyesha hali ya sasa ya Ayubu; “sasa” ni cha kawaida na hudumisha uharaka wa maombolezo.
- source_word: הֶלְאָנִי
  choice: amenichosha kabisa
  rationale: Kitenzi kutoka לאה kina maana ya kumchosha au kumfanya mtu awe taabani kwa uchovu. Kauli hii huonyesha tendo lililomwathiri Ayubu sana, huku kiima cha nafsi ya tatu kikiachwa bila kutajwa wazi kama katika Kiebrania.
- source_word: הֲשִׁמּוֹתָ
  choice: wewe umeangamiza
  rationale: Muundo wa kisababishi kutoka שמם una maana ya kufanya ukiwa au kuharibu vibaya. “Umeangamiza” ni lugha ya sasa yenye nguvu; “wewe” huhifadhi wazi mgeuko wa Kiebrania kwenda nafsi ya pili.
- source_word: כָּל
  choice: yote
  rationale: Hudumisha maana ya ujumla wa kundi zima na kupatana kisarufi na “jamaa.”
- source_word: עֲדָתִי
  choice: jamaa yangu
  rationale: עֵדָה huweza kumaanisha kusanyiko au kundi. Katika maombolezo ya Ayubu, “jamaa yangu” hueleweka kwa urahisi kuwa watu wake wa karibu au kundi lililomzunguka, bila kudokeza lazima kusanyiko rasmi la ibada; maana nyingine zimehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mgeuko wa nafsi ya kisarufi kati ya vitenzi viwili
  choice: 'Kuhifadhi mgeuko wa Kiebrania: “amenichosha ...; wewe umeangamiza ...”'
  alternative: Kusawazisha vitenzi vyote kuwa nafsi ya pili, “umenichosha ...; umeangamiza ...,” au vyote kuwa nafsi ya tatu.
  rationale: Maandishi ya Kimasora yana kitenzi cha kwanza katika nafsi ya tatu umoja wa kiume na cha pili katika nafsi ya pili umoja wa kiume. Kuhifadhi mgeuko huu hakutatui kimyakimya mvutano wa maandishi na kunaacha wazi uwezekano kwamba Ayubu anageuka kutoka kusema kumhusu Mungu hadi kusema naye moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “amenichosha kabisa” ni wa kawaida lakini una nguvu ya maombolezo; “jamaa yangu” huepuka dhana ya lazima ya kusanyiko rasmi la kidini. Mgeuko wa nafsi umehifadhiwa makusudi.
