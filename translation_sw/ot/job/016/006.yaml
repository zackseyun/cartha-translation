  yaml_path: translation/ot/job/016/006.yaml
  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: sw
  text: Nikisema, maumivu yangu hayapungui; na nikinyamaza, ni nini kinachoniacha?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nini kinachoondoka kwangu?” Kiebrania ni kifupi; huenda maana yake ni, “ni nini katika maumivu yangu kinachoniacha?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: Nikisema
  rationale: Muundo wa sharti unaelezwa kwa Kiswahili cha kawaida kwa kiambishi -ki-, bila kulazimisha maana ya wakati au hali ambayo Kiebrania haihitaji hapa.
- source_word: לֹא יֵחָשֵׂךְ
  choice: hayapungui
  rationale: Nifali ya חשׂך ina wazo la kuzuiliwa au kupunguzwa; ikiambatana na maumivu, 'hayapungui' ni ya asili na huhifadhi maana ya kwamba kusema hakuyatulizi.
- source_word: כְּאֵבִי
  choice: maumivu yangu
  rationale: Neno כְּאֵב linaweza kumaanisha maumivu ya mwili au ya ndani; 'maumivu' hudumisha upana huo.
- source_word: וְאַחְדְּלָה
  choice: na nikinyamaza
  rationale: חדל humaanisha kuacha au kujizuia. Kwa kuwa kishazi kilichotangulia kinahusu kusema, 'nikinyamaza' huwasilisha kinyume kinachodokezwa kwa Kiswahili cha kawaida.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: ni nini kinachoniondoka?
  rationale: 'Tafsiri hii huhifadhi ufupi na udokezi wa Kiebrania: kitu kinachoondoka hakitajwi wazi, ingawa kwa muktadha kinaweza kuwa maumivu.'
theological_decisions:
- issue: Kirejewa kisichotajwa katika מַה מִנִּי יַהֲלֹךְ
  choice: Kimeachwa bila kutajwa wazi katika matini kuu.
  alternative: Ni kiasi gani cha maumivu yangu kinachoondoka?
  rationale: Kiebrania ni kifupi na hakisemi wazi kwamba kinachoondoka ni maumivu; kuyataja moja kwa moja kungesuluhisha udokezi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Ulinganifu wa kusema na kunyamaza umewekwa wazi, huku ufupi wa swali la mwisho ukihifadhiwa.
