lexical_decisions:
- source_word: וְיוֹכַח
  choice: amhukumu ... katika shauri lake
  rationale: Hifili ya יכח hapa ina maana ya kisheria ya kuamua au kutetea shauri. Usemi huu wa Kiswahili unaonyesha tendo la kutoa uamuzi katika mzozo bila kulifanya kuwa karipio tu.
- source_word: לְגֶבֶר
  choice: mtu katika shauri lake
  rationale: גבר hapa humaanisha mtu wa kiume lakini katika ulinganifu wa kishairi humwakilisha binadamu anayehusika katika shauri; kiambishi ל kimehifadhiwa kwa maana ya kumnufaisha au kumwakilisha mtu huyo.
- source_word: עִם אֱלוֹהַּ
  choice: na Mungu
  rationale: עִם kimsingi ni ‘na’; katika muktadha wa kisheria inaonyesha kuwa Mungu ndiye upande mwingine wa shauri, bila kubadili kimyakimya kuwa ‘dhidi ya’ au ‘mbele ya.’
- source_word: וּבֶן אָדָם
  choice: kama vile mwanadamu
  rationale: בן אדם ni ‘mwana wa Adamu/mwanadamu’ kwa neno halisi, lakini hapa ni nahau ya kawaida ya kumaanisha binadamu. ‘Mwanadamu’ ni ya asili katika Kiswahili na huepuka kuifanya kimakosa kuwa cheo cha Kimasihi.
- source_word: לְרֵעֵהוּ
  choice: mwenzake
  rationale: רֵעַ inaweza kuwa jirani, rafiki, au mwenzi. ‘Mwenzake’ hudumisha upana wa uhusiano huo na ulinganifu wa mtu mmoja anayeshughulikia shauri la mwingine.
theological_decisions:
- issue: Uwezekano wa kusoma בן אדם kama cheo cha Kimasihi
  choice: Kutafsiri kama ‘mwanadamu,’ yaani binadamu katika muktadha wa sasa
  alternative: ‘mwana wa Adamu’ au ‘Mwana wa Adamu’ kama cheo
  rationale: Katika mstari huu בן אדם ni nahau ya kawaida inayolingana kishairi na גבר. Herufi kubwa au tafsiri ya kicheo ingeleta uhusiano wa baadaye wa kikristo ambao mstari wenyewe haulazimishi.
- issue: Jukumu la mhusika anayetamaniwa katika shauri
  choice: Kuhifadhi wazo la kumtendea mtu shauri lake na Mungu, si kuonyesha tu usuluhishi usioegemea upande wowote
  alternative: ‘apatanishe kati ya mtu na Mungu’
  rationale: Kiambishi ל katika לְגֶבֶר kinaweza kuonyesha mtu ambaye tendo linafanywa kwa ajili yake. Tafsiri haipaswi kuondoa mvutano wa Jobu kutamani mtu wa kushughulikia shauri lake na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na ulinganifu wa mistari umehifadhiwa kwa lugha inayoeleweka; ‘katika shauri lake’ huweka wazi muktadha wa kisheria bila kutatua kabisa utata wa kitenzi cha Kiebrania.
