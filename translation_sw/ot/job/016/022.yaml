  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: sw
  text: Kwa maana miaka michache[a] itawadia, nami nitaenda katika njia ambayo sitarudi kutoka humo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “miaka ya hesabu,” yaani miaka michache au yenye idadi ndogo.
    reason: lexical_alternative
  - marker: b
    text: Au “njia ambayo sitarudi kutoka humo.” Usemi huu unaelekeza kwenye safari isiyoweza kubatilishwa ya kuelekea kifoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia ya Ayubu; “Kwa maana” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: שְׁנוֹת מִסְפָּר
  choice: miaka michache
  rationale: Kirai hiki ni halisi “miaka ya hesabu,” nahau inayomaanisha miaka michache au yenye idadi ndogo. Tafsiri hii inawasilisha ufupi unaokusudiwa.
- source_word: יֶאֱתָיוּ
  choice: itawadia
  rationale: Kitenzi kina maana ya kuja au kuwasili. “Itawadia” kinafaa kwa miaka kama kiima na kinahifadhi taswira ya wakati unaokuja.
- source_word: וְאֹרַח
  choice: nami ... katika njia
  rationale: אֹרַח ni njia; hapa ni sitiari ya safari inayoelekea kifoni. “Nami” kinawakilisha kiunganishi וְ kwa mtiririko wa kawaida wa Kiswahili.
- source_word: לֹא אָשׁוּב
  choice: ambayo sitarudi kutoka humo
  rationale: Kauli halisi ni “sitarudi.” Muundo huu unaiunganisha kwa uwazi na njia bila kuondoa wazo la safari isiyoweza kubatilishwa.
- source_word: אֶהֱלֹךְ
  choice: nitaenda
  rationale: Qal imperfect ya הלך ina maana ya kwenda au kutembea; “nitaenda” inaonyesha mwendo wa Ayubu unaokuja kwa uwazi.
theological_decisions:
- issue: Je, “njia ambayo sitarudi” itajwe wazi kuwa ni kifo?
  choice: Kudumisha sitiari ya njia isiyo na kurudi katika aya
  alternative: Kutafsiri moja kwa moja kuwa “nitakufa”
  rationale: Muktadha unaelekeza kwenye kifo, lakini Kiebrania kinatumia sitiari ya safari. Kudumisha sitiari kunahifadhi mvutano na namna ya usemi wa chanzo bila kuongeza ufafanuzi wa kiteolojia ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Itawadia” ni neno la sasa lenye uzito wa kishairi unaofaa kitabu cha Ayubu; muundo wa sitiari umehifadhiwa.
