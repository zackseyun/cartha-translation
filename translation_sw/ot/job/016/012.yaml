base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: sw
  text: Nilikuwa nimetulia[a], lakini akanivunja-vunja; akanishika shingoni, akaniponda vipande-vipande; akaniweka kuwa shabaha yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi kilichotafsiriwa “akanivunja-vunja” ni adimu; kinaweza pia kueleweka kuwa “akanitikisa kwa nguvu” au “akanirarua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: nilikuwa nimetulia
  rationale: Kivumishi hiki hueleza hali ya utulivu na kutosumbuliwa; usemi huu ni wa kawaida na unaweka wazi tofauti na shambulio linalofuata.
- source_word: וַיְפַרְפְּרֵנִי
  choice: akanivunja-vunja
  rationale: Kitenzi hiki adimu kinaonyesha kuvurugwa kwa nguvu, huenda kuvunjwa, kutikiswa kwa nguvu, au kuraruliwa. 'Akanivunja-vunja' huhifadhi ukali wa picha huku tanbihi ikitaja uwezekano mwingine.
- source_word: וְאָחַז
  choice: akanishika
  rationale: Kitenzi kina maana ya kushika au kukamata; katika muktadha huu 'akanishika' pamoja na picha ya shingo huonyesha matumizi ya nguvu.
- source_word: בְּעָרְפִּי
  choice: shingoni
  rationale: Neno linarejelea shingo, hasa kisogo au sehemu ya nyuma ya shingo. 'Shingoni' ni fasaha na ya asili katika Kiswahili bila kuifanya picha kuwa nzito kupita kiasi.
- source_word: וַיְפַצְפְּצֵנִי
  choice: kuniponda vipande-vipande
  rationale: Umbo hili lenye msisitizo huonyesha kuvunjwa au kupondwa kwa nguvu. Tafsiri hii inahifadhi picha ya uharibifu mkali na kuitofautisha kwa kiasi na kitenzi adimu kilichotangulia.
- source_word: וַיְקִימֵנִי
  choice: akaniweka
  rationale: Hifili ya קום ina maana ya kusababisha kusimama au kuwekwa mahali; 'akaniweka' inaunganika kwa kawaida na mfano unaofuata wa shabaha.
- source_word: לוֹ
  choice: yake
  rationale: Kiwakilishi kinaonyesha kuwa msemaji amewekwa kwa matumizi au kusudi la mshambulizi mwenyewe; 'shabaha yake' hulieleza hilo kwa ufupi.
- source_word: לְמַטָּרָה
  choice: kuwa shabaha
  rationale: Nomino hii humaanisha shabaha au alama ya kushambuliwa. 'Kuwa shabaha' ni Kiswahili cha kawaida na huhifadhi sitiari ya mashambulizi.
theological_decisions:
- issue: Mrejelewa wa mtenda wa nafsi ya tatu katika mstari wote
  choice: Ameachwa kuwa 'yeye' kwa viambishi vya vitenzi bila kutajwa kwa jina.
  alternative: Kumtaja Mungu waziwazi kuwa ndiye mshambulizi, au kuelewa kuwa ni adui asiyeainishwa.
  rationale: Katika hotuba ya Ayubu, muktadha unaelekeza kwa Mungu, lakini mstari wa Kiebrania wenyewe una maumbo ya nafsi ya tatu tu. Tafsiri haiingizi jina ambalo halipo hapa, hivyo inadumisha mvutano wa usemi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mashambulizi yanayofuatana umehifadhiwa, pamoja na sitiari ya shabaha. Kiashiria cha tanbihi [a] kimewekwa katika matini kuu.
