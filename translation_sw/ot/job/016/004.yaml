base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: sw
  text: Mimi pia ningeweza kusema kama ninyi, kama mngekuwa mahali pangu; ningeweza kuunganisha maneno dhidi yenu[a] na kuwatikisia kichwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ningeweza kuwalundikia maneno.” Kitenzi cha Kiebrania kinaweza kumaanisha kuunganisha, kupanga, au kulundika maneno.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, kutikisa kichwa ni ishara ya dharau au kejeli.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Mimi pia
  rationale: Inahifadhi msisitizo wa nafsi ya kwanza na wazo la kwamba Ayubu angeweza kufanya vivyo hivyo.
- source_word: כָכֶם אֲדַבֵּרָה
  choice: ningeweza kusema kama ninyi
  rationale: Hali ya kudhania iliyoanzishwa na לוּ inaelezwa kwa Kiswahili cha kawaida kwa ‘ningeweza’; ‘kama ninyi’ hurejelea namna marafiki zake wanavyosema.
- source_word: יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: kama mngekuwa mahali pangu
  rationale: Ingawa נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe, hapa kishazi kizima ni njia ya kusema hali zao zingebadilishana; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: ningeweza kuunganisha maneno dhidi yenu
  rationale: ‘Kuunganisha maneno’ huhifadhi maana ya msingi ya kitenzi, yaani kukusanya au kupanga maneno, huku ‘dhidi yenu’ ikionyesha mwelekeo wa uhasama katika muktadha.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: na kuwatikishia kichwa
  rationale: Hii ni kauli ya asili ya Kiswahili kwa kutikisa kichwa kuelekea mtu; muktadha unaonyesha kuwa ishara hiyo ni ya dharau.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nimetumia wingi ‘ninyi’ kwa kuwa Ayubu anazungumza na marafiki zake. Nahau ‘mngekuwa mahali pangu’ imechaguliwa badala ya tafsiri sisisi ‘nafsi zenu zingekuwa mahali pa nafsi yangu’ ili kutoa maana ya Kiebrania kwa Kiswahili cha kawaida bila kuamua kwamba נֶפֶשׁ hapa ni fundisho maalumu kuhusu sehemu isiyo ya mwili.
