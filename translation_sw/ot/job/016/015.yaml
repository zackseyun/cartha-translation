  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: sw
  text: 'Nimeshona nguo ya gunia juu ya ngozi yangu,

    na nimeizamisha[a] pembe yangu[b] mavumbini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimeishusha pembe yangu mavumbini” au “nimeitia pembe yangu unajisi kwa mavumbi.” Kitenzi cha Kiebrania hapa ni kigumu, na maana yake kamili haina uhakika.
    reason: lexical_alternative
  - marker: b
    text: “Pembe” ni sitiari ya Kiebrania inayoweza kumaanisha nguvu, heshima, au kuinuliwa.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  choice: nguo ya gunia
  rationale: Katika muktadha wa maombolezo, neno hili linamaanisha vazi au kitambaa kigumu cha gunia; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: תָּפַרְתִּי
  choice: nimeshona
  rationale: Ni kitenzi cha nafsi ya kwanza umoja kinachomaanisha kushona; hali timilifu inaonyesha tendo lililofanywa ambalo matokeo yake yanaendelea.
- source_word: עֲלֵי גִלְדִּי
  choice: juu ya ngozi yangu
  rationale: Tafsiri hii inahifadhi picha ya nguo ya gunia iliyoshonwa juu ya ngozi ya Ayubu bila kupanua גֶּלֶד kuwa mwili mzima.
- source_word: וְעֹלַלְתִּי
  choice: na nimeitumbukiza
  rationale: Kitenzi hiki ni kigumu, lakini katika muktadha wa mavumbi kinaweza kuonyesha kitendo halisi cha kuishusha au kuiingiza chini; tanbihi inadumisha kutokuwa na uhakika kwa maana yake kamili.
- source_word: בֶעָפָר
  choice: mavumbini
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza mahali au mwelekeo unaohusiana na mavumbi baada ya kitenzi cha mwendo.
- source_word: קַרְנִי
  choice: pembe yangu
  rationale: Tafsiri halisi inahifadhi sitiari ya Kiebrania badala ya kuifasiri moja kwa moja kuwa nguvu au heshima.
theological_decisions:
- issue: Sitiari ya “pembe”
  choice: Kudumisha “pembe yangu” katika matini kuu
  alternative: nguvu zangu; heshima yangu
  rationale: Pembe ni picha ya kishairi inayoweza kuashiria nguvu, heshima au kuinuliwa. Kuihifadhi huepuka kuchagua kimya kimya maana moja tu.
- issue: Maana isiyo hakika ya וְעֹלַלְתִּי
  choice: Kutumia tendo halisi “nimeitumbukiza” na kuweka tanbihi
  alternative: nimeishusha; nimeitia unajisi; nimeiangusha
  rationale: Kitenzi kina utata wa kileksika. Chaguo hili linafaa kwa picha ya mavumbi na fedheha, lakini tanbihi inaonyesha tafsiri nyingine zinazowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unadumisha usambamba wa kishairi; “nguo ya gunia” ni wazi zaidi kwa msomaji wa kawaida kuliko “gunia” peke yake.
