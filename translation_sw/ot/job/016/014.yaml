  text: He breaks through me with breach upon breach[b][a]; he rushes at me like a warrior.
translation:
  language: sw
  text: Ananibomoa, akifanya ufa baada ya ufa[a]; ananikimbilia kama shujaa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa halisi zaidi: “ufa juu ya ufa.”'
