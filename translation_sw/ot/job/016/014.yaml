lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: ananibomoa
  rationale: Kitenzi פרץ hapa kinaonyesha kuvunja au kupenya kwa nguvu. “Ananibomoa” kinadumisha taswira ya kubomolewa kana kwamba mtu ni ukuta, huku kikisikika kwa kawaida katika Kiswahili.
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: akifanya ufa baada ya ufa
  rationale: Kirai hiki kinaonyesha mianya ya kuvunjwa inayofuatana au kuongezeka. Tafsiri hii inadumisha urudiaji na taswira halisi ya ufa bila kuwa nzito isivyo kawaida.
- source_word: יָרוּץ עָלַי
  choice: ananikimbilia
  rationale: רוץ ni kukimbia, na עָלַי katika muktadha huu huonyesha mwendo wa haraka wa kumshambulia Ayubu. “Ananikimbilia” ni ya moja kwa moja na hudumisha kasi na uhasama.
- source_word: כְגִבּוֹר
  choice: kama shujaa
  rationale: גִּבּוֹר inaweza kumaanisha shujaa wa vita, mtu hodari, au bingwa. “Shujaa” inafaa zaidi hapa kwa sababu muktadha unaonyesha mashambulizi ya nguvu.
