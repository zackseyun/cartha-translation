  text: I have heard many such things[a]; all of you are miserable comforters.
translation:
  language: sw
  text: Nimesikia mambo mengi kama hayo; ninyi nyote ni wafariji wa kuleta taabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi na muundo wa Kiebrania, “wafariji wa taabu”; pia yaweza kutafsiriwa “wafariji wa kusikitisha.”
