lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Nimesikia
  rationale: Kauli timilifu ya nafsi ya kwanza umoja inaeleza mambo ambayo Ayubu ameyasikia tayari na ambayo bado yanahusiana na malalamiko yake ya sasa.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: mambo mengi kama hayo
  rationale: Muundo huu unamaanisha mambo mengi ya aina hiyo; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha sauti ya Ayubu ya kuyapuuza maneno hayo.
- source_word: מְנַחֲמֵי
  choice: wafariji
  rationale: Hii ni participio iliyotumiwa kama nomino, ikiwataja wanaodai kumfariji Ayubu; neno hili linahifadhi kinaya cha muktadha.
- source_word: עָמָל
  choice: wenye kutaabisha
  rationale: Neno hili linaweza kumaanisha taabu, mateso, dhiki au kazi ngumu. Katika muundo huu linawatambulisha wafariji kuwa chanzo au sifa ya taabu, si wafariji wanaotoa faraja nzuri kwa wenye taabu.
- source_word: כֻּלְּכֶם
  choice: ninyi nyote
  rationale: Inadumisha msisitizo wa wingi na shutuma ya moja kwa moja kwa kundi lote.
