  text: אֶ֭רֶץ אַל תְּכַסִּ֣י דָמִ֑/י וְֽ/אַל יְהִ֥י מָ֝ק֗וֹם לְ/זַעֲקָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: sw
  text: Ee ardhi[a], usiifunike damu yangu[b], wala kilio changu[c] kisipate mahali pa kutulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi.” Neno la Kiebrania linaweza kumaanisha ardhi, nchi, au eneo la nchi kavu.
    reason: lexical_alternative
  - marker: b
    text: Au “damu yangu iliyomwagwa.” Kiebrania kinasema moja kwa moja “damu yangu,” lakini katika muktadha kinaweza kumaanisha damu iliyomwagwa isivyo haki.
    reason: lexical_alternative
  - marker: c
    text: Neno hili linaweza pia kumaanisha kilio cha dhiki kinachotumika kama ombi la kutendewa haki. Taswira ya damu inayolia kutoka ardhini inafanana na Mwanzo 4:10.
    reason: cross_reference
lexical_decisions:
- source_word: אֶרֶץ
  choice: Ee ardhi
  rationale: Nomino hii inaweza kumaanisha ardhi au nchi. Hapa inaelekezewa maneno moja kwa moja, kama inavyoonyeshwa na kitenzi cha nafsi ya pili ya kike. “Ardhi” inadumisha picha ya damu iliyo ardhini na mawanda mapana ya mwito wa kishairi.
- source_word: אַל־תְּכַסִּי
  choice: usiifunike
  rationale: אַל pamoja na umbo hili la kitenzi hutoa katazo au ombi kali la kukanusha. “Usiifunike” inadumisha taswira halisi ya damu kufunikwa bila kueleza moja kwa moja maana yake ya kufichwa isidai haki.
- source_word: דָמִי
  choice: damu yangu
  rationale: Hii ndiyo maana ya moja kwa moja ya neno lenye kiambishi cha nafsi ya kwanza. Muktadha unaweza kudokeza damu iliyomwagwa isivyo haki, lakini “damu yangu” huhifadhi utata wa kishairi.
- source_word: וְאַל יְהִי מָקוֹם
  choice: wala ... kisipate mahali
  rationale: Kiebrania kinaonyesha ombi la kukanusha kuhusu kuwapo kwa mahali. Muundo wa Kiswahili “kisipate mahali” ni wa kawaida na unaendeleza wazo la kutokuwapo kwa mahali ambapo kilio kinaweza kutulia.
- source_word: לְזַעֲקָתִי
  choice: kilio changu
  rationale: זְעָקָה ni kilio cha dhiki ambacho pia kinaweza kuwa mwito wa kuomba msaada au haki. “Kilio changu” ni cha asili na hakifungi maana katika upande mmoja tu.
- source_word: מָקוֹם לְזַעֲקָתִי
  choice: mahali pa kutulia
  rationale: Ingawa מָקוֹם yenyewe ni “mahali,” katika muktadha huu mahali hapo ni ambapo kilio kingetua au kunyamazishwa. “Mahali pa kutulia” huwasilisha taswira hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Damu ya mtu asiye na hatia inayodai haki
  choice: Kudumisha maneno halisi “damu yangu” na “kilio changu” bila kufafanua dai la haki ndani ya matini kuu.
  alternative: Kutafsiri “damu yangu iliyomwagwa” au “kilio changu cha kuomba haki.”
  rationale: Mstari unaendana na taswira ya kibiblia ya damu iliyomwagwa ikilia kutoka ardhini, lakini Kiebrania hakifafanui wazo hilo moja kwa moja. Tafsiri kuu huhifadhi mvutano kati ya damu halisi, mateso, na dai la kutetewa.
- issue: Mahali pa kilio kutulia
  choice: Kutumia “kisipate mahali pa kutulia.”
  alternative: Kutumia “pasiwe na mahali kwa ajili ya kilio changu.”
  rationale: Chaguo lililotumika linaweka hai taswira ya kilio kisichotulia wala kunyamazishwa, bila kutaja wazi kwamba Mungu lazima akijibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa urahisi. “Ee” huonyesha mwito wa moja kwa moja kwa heshima na uzito; “ardhi” huepuka maana finyu ya nchi kama taifa. Muundo wa sentensi hudumisha urari wa vipande viwili vya Kiebrania.
