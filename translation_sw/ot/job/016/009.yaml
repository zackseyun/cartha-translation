  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: sw
  text: 'Hasira yake imenirarua na kunichukia;

    ananisagia meno;

    adui yangu ananoa macho yake kunitazama.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ananitazama kwa macho makali yenye uhasama. Kiebrania kinasema kihalisi, “ananoa macho yake kunitazama.”
    reason: Sitiari ya Kiebrania ni isiyo ya kawaida katika Kiswahili, hivyo maelezo yanafafanua maana bila kuiondoa katika maandishi.
lexical_decisions:
- source_word: אַפּוֹ
  choice: Hasira yake
  rationale: Neno אַף linaweza kumaanisha pua, lakini hapa ni nahau ya hasira. Tafsiri hii inadumisha kiambishi cha umilikaji bila kumtaja wazi mwenye hasira.
- source_word: טָרַף
  choice: imenirarua
  rationale: Kitenzi hiki hutumiwa kwa kurarua mawindo; ‘imenirarua’ kinahifadhi taswira kali ya mnyama anayepasua mawindo yake.
- source_word: וַיִּשְׂטְמֵנִי
  choice: na kunichukia
  rationale: Mzizi שׂטם unaonyesha chuki au uadui. Muundo huu unaendeleza ‘hasira yake’ kama kiima kilichohuishwa katika ushairi, kama inavyowezekana katika Kiebrania.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: amenisagia meno yake
  rationale: Hii ni njia ya kawaida na yenye nguvu katika Kiswahili ya kueleza kusaga meno kwa hasira dhidi ya mtu.
- source_word: צָרִי
  choice: adui yangu
  rationale: Neno hili humaanisha mtu aliye katika uadui au upinzani. ‘Adui yangu’ ni la kawaida na haliongezi maana ya kijeshi, kisheria, au ya kibinadamu pekee.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: ananoa macho yake dhidi yangu
  rationale: Tafsiri hii inadumisha sitiari isiyo ya kawaida ya Kiebrania ya ‘kunoa’ macho na pia nguvu ya uhasama katika לִי.
theological_decisions:
- issue: Mhusika wa kiume mwenye uhasama katika maombolezo ya Ayubu
  choice: Kutomtaja mhusika kuwa Mungu au mwanadamu, bali kuhifadhi ‘yake,’ kiima kisichotajwa, na ‘adui yangu.’
  alternative: Kumtaja Mungu moja kwa moja, kumtaja adui wa kibinadamu, au kueleza wazi kwamba Mungu anatenda kama adui.
  rationale: Ingawa muktadha unaweza kumwelekeza msomaji kwa Mungu, mstari wenyewe haumtambui mhusika kwa jina. Tafsiri inadumisha utata na mvutano wa kitheolojia uliomo katika maombolezo.
- issue: Uhuishaji wa hasira katika kishazi cha kwanza
  choice: ‘Hasira yake imenirarua na kunichukia,’ huku hasira ikiwa kiima cha vitenzi vyote viwili.
  alternative: ‘Kwa hasira yake amenirarua, naye amenichukia,’ ambapo mwenye hasira ndiye kiima cha moja kwa moja.
  rationale: Muundo wa Kiebrania unaruhusu ‘hasira yake’ kuendelea kama kiima cha kitenzi cha pili. Uhuishaji huu wa kishairi unahifadhiwa badala ya kuufafanua kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari unaonyesha vifungu vitatu vya ushairi; taswira kali za kurarua, kusaga meno, na kunoa macho zimehifadhiwa.
