lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: ananikabidhi
  rationale: Hifili ya סגר hapa ina maana ya kumtia mtu chini ya mamlaka ya mwingine; ‘ananikabidhi’ ni ya kawaida na inadumisha wazo la kusalimishwa kwa wenye uadui.
- source_word: אֵל
  choice: Mungu
  rationale: Katika muktadha huu אֵל humrejelea Mungu, si ‘mwenye nguvu’ kwa ujumla.
- source_word: אֶל
  choice: kwa
  rationale: Kihusishi hiki kinaonyesha kuhamishwa na kuwekwa chini ya mamlaka ya mtu mwingine; maana hiyo inaingia kwa kawaida katika ‘ananikabidhi kwa’.
- source_word: עֲוִיל
  choice: mtu mwovu
  rationale: Nomino hii humaanisha mtu mpotovu kimaadili au asiye na uchaji; ‘mtu mwovu’ ni wazi na ya kawaida bila kuifanya kuwa upumbavu wa kiakili tu.
- source_word: וְעַל יְדֵי
  choice: mikononi mwa
  rationale: Nahau ya ‘mikono’ inaonyesha kuwekwa chini ya mamlaka au uwezo wa watu wengine; ‘mikononi mwa’ inadumisha sitiari hiyo kwa Kiswahili cha kawaida.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni tafsiri sanifu ya watu wenye sifa ya uovu, na inadumisha wingi wa Kiebrania.
- source_word: יִרְטֵנִי
  choice: kunitupa
  rationale: Kitenzi hiki ni kigumu, lakini kwa kawaida hueleweka kuwa tendo la kutupa au kurusha kwa nguvu. ‘Kunitupa’ hudumisha nguvu ya tendo bila kuongeza picha isiyo hakika.
theological_decisions:
- issue: Rejeo la אֵל
  choice: Msemaji anasema kwamba Mungu ndiye anayemkabidhi kwa mtu mwovu.
  alternative: ‘Mwenye nguvu’ kwa maana ya jumla ndiye anayemkabidhi.
  rationale: Katika kitabu cha Ayubu, אֵל kwa kawaida humrejelea Mungu; hapa uzito wa malalamiko ya Ayubu ni kwamba Mungu mwenyewe amemweka chini ya mamlaka ya waovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ananikabidhi’ na ‘mikononi mwa’ ni nahau zinazoeleweka kwa wasomaji wa kawaida; maelezo ya chini yanahifadhi kutokuwa na uhakika kwa kitenzi cha mwisho.
