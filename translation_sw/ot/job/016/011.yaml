  text: Mungu ananikabidhi kwa mtu mwovu[a], na ananitupa[b] mikononi mwa waovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mtu asiyemcha Mungu.”
