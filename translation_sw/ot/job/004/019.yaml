translation:
  language: sw
  text: Je, si zaidi sana[a] wale wanaokaa katika nyumba za udongo, ambao msingi wao umo mavumbini, wanaopondwa mbele ya nondo![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “hata wale wanaokaa katika nyumba za udongo.” Neno la Kiebrania linaweza kutafsiriwa kwa karibu zaidi kuwa “hata” au “naam”; lakini katika muktadha huu huenda linaimarisha ulinganisho: “zaidi sana.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “wanaopondwa upesi kuliko nondo” au “kwa urahisi kuliko nondo.” Usemi wa Kiebrania “mbele ya nondo” unaweza kuonyesha jinsi wanadamu wanavyoangamizwa haraka au kwa urahisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: si zaidi sana
  rationale: Katika hoja inayotoka kwa viumbe wa mbinguni katika mstari uliotangulia hadi kwa wanadamu dhaifu, chembe hii ina nguvu ya kulinganisha inayomaanisha ‘zaidi sana’; muundo wa Kiswahili unaonyesha ongezeko hilo la hoja.
- source_word: שֹׁכְנֵי
  choice: wale wanaokaa
  rationale: Huhifadhi maana ya hali endelevu ya kitenzi-shirikishi huku ikiwa ya kawaida katika Kiswahili cha sasa.
- source_word: בָתֵּי חֹמֶר
  choice: nyumba za udongo
  rationale: Huhifadhi sitiari ya makao yaliyofanywa kwa udongo, inayodokeza udhaifu wa mwili na maisha ya mwanadamu bila kuifafanua kupita kiasi.
- source_word: בֶּעָפָר יְסוֹדָם
  choice: ambao msingi wao umo mavumbini
  rationale: ‘Mavumbi’ huhifadhi taswira ya עָפָר na mwangwi wake wa hali ya kufa; ‘msingi wao’ hufuata nomino ya umoja yenye kiambishi cha wingi.
- source_word: יְדַכְּאוּם
  choice: wanaopondwa
  rationale: Kauli tendwa huepuka kuongeza mtendaji ambaye hajatajwa wazi katika Kiebrania na huwasilisha nguvu ya דכא, ‘kuponda.’
- source_word: לִפְנֵי עָשׁ
  choice: mbele ya nondo
  rationale: Tafsiri ya karibu huhifadhi utata wa kishairi wa לִפְנֵי; usemi huo pia unaweza kueleweka kwa maana ya kuangamizwa upesi au kwa urahisi kuliko nondo.
theological_decisions:
- issue: Rejeo la kisitiari la ‘nyumba za udongo’
  choice: Sitiari imehifadhiwa kama ‘nyumba za udongo,’ ikidokeza miili na maisha dhaifu ya wanadamu wanaoweza kufa.
  alternative: Nyumba halisi zilizojengwa kwa udongo kama picha pana ya udhaifu wa mwanadamu.
  rationale: Muktadha unalinganisha viumbe wa mbinguni na wanadamu; kutohalisi sitiari katika matini kuu kunahifadhi kina na mvutano wa picha ya Kiebrania.
- issue: Maana ya ‘mbele ya nondo’
  choice: Maneno halisi yamehifadhiwa katika matini kuu.
  alternative: ‘Wanaangamizwa upesi kuliko nondo’ au ‘kwa urahisi kuliko nondo.’
  rationale: Kiebrania kinaweza kueleza kuwa mwanadamu hupondwa mbele ya kitu dhaifu kama nondo, au huangamizwa kwa upesi/urahisi kuliko nondo. Tanbihi inaweka wazi uwezekano huo bila kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Nondo’ ni neno la kawaida kwa mdudu anayeharibu nguo; ‘mavumbi’ huhifadhi mwangwi wa uumbaji na hali ya kufa. Alama zote za tanbihi zimewekwa katika matini kuu.
