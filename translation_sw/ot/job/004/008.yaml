  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: sw
  text: Kwa kadiri nilivyoona, wale wanaolima uovu[a] na kupanda taabu[b] huyavuna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ubaya”; neno la Kiebrania linaweza kumaanisha uovu wa kimaadili na, katika baadhi ya miktadha, taabu inayotokana nao.
    reason: lexical_alternative
  - marker: b
    text: Au “mateso” au “madhara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kama
  rationale: Huanzisha ulinganisho unaotegemea yale ambayo Elifazi amejionea; ‘Kama nilivyoona’ ni Kiswahili cha kawaida na huhifadhi mvuto wa ushuhuda wa uzoefu.
- source_word: רָאִיתִי
  choice: nilivyoona
  rationale: Kitenzi cha nafsi ya kwanza kinaonyesha jambo ambalo msemaji amelishuhudia kwa uzoefu; muundo huu unaungana kwa kawaida na ‘Kama’.
- source_word: חֹרְשֵׁי
  choice: wale wanaolima
  rationale: Huhifadhi sitiari ya kilimo na kutafsiri kihusishi hiki kama jina la watu wanaofanya tendo hilo.
- source_word: אָוֶן
  choice: uovu
  rationale: Katika muktadha huu neno lina uzito wa kimaadili, ingawa linaweza pia kumaanisha ubaya au taabu inayotokana na uovu.
- source_word: וְזֹרְעֵי
  choice: na kupanda
  rationale: Huendeleza sitiari ya kilimo bila kurudia ‘wale wanao-’, jambo linalofanya sentensi iwe ya asili huku usambamba ukibaki wazi.
- source_word: עָמָל
  choice: taabu
  rationale: Neno linaweza kumaanisha taabu, mateso, au madhara; ‘taabu’ ni pana vya kutosha kuhifadhi maana hiyo katika usambamba huu.
- source_word: יִקְצְרֻהוּ
  choice: huvuna hayo
  rationale: Wakati wa mazoea ‘hu-’ unaonyesha kanuni inayodaiwa kutokana na uzoefu. ‘Hayo’ hurejelea kwa pamoja uovu na taabu bila kuacha sitiari ya mavuno.
theological_decisions:
- issue: Uhusiano wa kimaadili kati ya tendo na matokeo katika hotuba ya Elifazi
  choice: Methali imetafsiriwa moja kwa moja kama kanuni ambayo Elifazi anadai kuwa ameiona.
  alternative: Kuifanya kauli hii kuwa fundisho kamili lisilo na tofauti, au kuilegeza iwe uwezekano tu.
  rationale: Muktadha unaonyesha kwamba hii ni hoja ya Elifazi kwa Ayubu. Tafsiri inahifadhi nguvu ya dai lake bila kulifanya moja kwa moja kuwa uamuzi wa mwisho wa kitabu kizima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya kulima, kupanda, na kuvuna imehifadhiwa; sentensi ni rahisi kueleweka bila kupunguza uzito wa kauli ya Elifazi.
