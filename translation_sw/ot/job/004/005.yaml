  text: Lakini sasa umepatwa, nawe umechoka; umeguswa, nawe umefadhaika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Lakini
  rationale: Katika muktadha, Elifazi anatofautisha jinsi Ayubu alivyowatia wengine moyo zamani na jinsi anavyoitikia taabu iliyompata sasa. Ingawa kiunganishi hiki mara nyingi humaanisha “kwa maana,” maana ya kupinga inafaa hapa.
- source_word: עַתָּה
  choice: sasa
  rationale: Kielezi cha wakati kinachoonyesha hali ya sasa, tofauti na matendo ya Ayubu ya zamani.
- source_word: תָּבוֹא
  choice: yanakujia
  rationale: Kitenzi ni cha nafsi ya tatu, umoja wa kike, na huenda mtendaji wake asiyeelezwa wazi ni jambo kama balaa au taabu. Kiswahili hutumia kwa kawaida ngeli ya wingi kwa “matatizo/maafa” yanayodokezwa; “yanakujia” linaacha jambo hilo likiwa halijatajwa wazi.
- source_word: אֵלֶיךָ
  choice: -kujia
  rationale: Kiambishi cha yambwa pamoja na maana ya kuelekea humaanisha kuwa taabu hiyo imemfikia Ayubu mwenyewe.
- source_word: וַתֵּלֶא
  choice: nawe unachoka
  rationale: Mzizi לאה una maana ya kuchoka au kuishiwa nguvu. “Unachoka” ni lugha ya kawaida na haiongezi hukumu ya kimaadili kama “unakosa subira.”
- source_word: תִּגַּע
  choice: yanakugusa
  rationale: Mzizi נגע unaweza kumaanisha kugusa, kufikia, au kupiga. “Yanagusa” huhifadhi taswira ya jambo linalokuja kisha linamfikia mtu binafsi.
- source_word: עָדֶיךָ
  choice: -kugusa
  rationale: 'Ingawa kihalisi ni “hadi kwako,” katika Kiswahili yambwa linaunganishwa kwa kawaida na kitenzi: “yanakugusa.”'
- source_word: וַתִּבָּהֵל
  choice: nawe unafadhaika
  rationale: Mzizi בהל huonyesha kushtuka, kufadhaika, au kuingiwa na hofu. “Unafadhaika” huhifadhi nguvu ya kihisia bila kuifanya lazima iwe hofu kuu.
