  text: יַעֲמֹ֤ד וְֽ/לֹא אַכִּ֬יר מַרְאֵ֗/הוּ תְּ֭מוּנָה לְ/נֶ֣גֶד עֵינָ֑/י דְּמָמָ֖ה וָ/ק֣וֹל אֶשְׁמָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: sw
  text: 'Kikasimama tuli, lakini sikuweza kutambua sura yake; umbo fulani lilikuwa mbele ya macho yangu. Kulikuwa na ukimya[a], kisha nikasikia sauti:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utulivu.” Neno la Kiebrania linaweza kumaanisha ukimya au hali ya utulivu usio na sauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: Kikasimama tuli
  rationale: Kitenzi עמד humaanisha kusimama au kubaki kimesimama; katika maono haya, “kikasimama tuli” huonyesha kwamba kile kilichoonekana kilitulia mbele ya msemaji.
- source_word: וְלֹא אַכִּיר
  choice: lakini sikuweza kutambua
  rationale: Hifili ya נכר humaanisha kutambua au kubainisha. “Lakini” huonyesha tofauti kati ya kuwapo kwa umbo na kushindwa kwa msemaji kulitambua.
- source_word: מַרְאֵהוּ
  choice: sura yake
  rationale: מַרְאֶה ni mwonekano au sura inayoonekana. Kiswahili hakilazimishi kutaja jinsia katika “yake,” hivyo utata wa rejeleo lisilotambulika unabaki.
- source_word: תְּמוּנָה
  choice: umbo fulani
  rationale: תְּמוּנָה inaweza kumaanisha umbo, mfano, au sura. “Umbo fulani” linafaa kwa mwonekano usio dhahiri wa maono haya.
- source_word: לְנֶגֶד עֵינָי
  choice: lilikuwa mbele ya macho yangu
  rationale: Tafsiri hii inahifadhi taswira ya moja kwa moja ya kitu kilichokuwa mbele ya macho ya msemaji.
- source_word: דְּמָמָה
  choice: Kulikuwa na ukimya
  rationale: דְּמָמָה huweza kumaanisha ukimya, utulivu, au hali ya kunyamaza; “ukimya” ni ya kawaida na huhifadhi kitambo cha kutisha kabla ya sauti.
- source_word: וָקוֹל אֶשְׁמָע
  choice: kisha nikasikia sauti
  rationale: קוֹל inaweza kuwa sauti kwa ujumla au sauti ya kusema; muktadha wa maneno yanayofuata unaunga mkono “sauti.” “Kisha” huwasilisha kwa kawaida mfuatano wa ukimya na kusikia.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ngeli ya ki-vi katika “kikasimama” inarejelea kitu kisichotambulika katika maono bila kukifanya wazi kuwa mtu wa kiume. Alama ya tanbihi [a] imewekwa baada ya “ukimya.”
