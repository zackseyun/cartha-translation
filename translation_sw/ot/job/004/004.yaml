  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: sw
  text: Maneno yako yalimwinua[a] aliyekuwa akijikwaa, na magoti yaliyokuwa yakilegea[b] uliyatia nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yalimtegemeza” au “yalimfanya asimame.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “magoti yaliyokuwa yakiinama”; maana yake ni magoti yaliyokuwa yakilegea au kukosa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: aliyekuwa akijikwaa
  rationale: Kauli endelevu ya kitenzi כשל humaanisha mtu anayejikwaa, anayeyumba, au anayekaribia kuanguka. Tafsiri hii inadumisha taswira halisi na ni ya kawaida katika Kiswahili.
- source_word: יְקִימוּן
  choice: yalimwinua
  rationale: Hifili ya קום ina maana ya kusababisha mtu asimame, kumwinua, au kumtegemeza. “Yalimwinua” inafaa katika usambamba wa kishairi na kuyatia nguvu magoti dhaifu.
- source_word: מִלֶּיךָ
  choice: maneno yako
  rationale: Wingi wa מִלָּה humaanisha maneno au usemi. “Maneno yako” ni tafsiri ya moja kwa moja na ya asili.
- source_word: בִרְכַּיִם
  choice: magoti
  rationale: Neno la sehemu ya mwili limetafsiriwa kihalisi kwa sababu taswira ya udhaifu na kuanguka inaeleweka vizuri katika Kiswahili.
- source_word: כֹּרְעוֹת
  choice: yaliyokuwa yakilegea
  rationale: Kitenzi כרע humaanisha kuinama, kupiga magoti, au kudidimia. Kuhusu magoti, “yakilegea” huwasilisha kwa asili hali ya kukosa nguvu na kukaribia kuporomoka.
- source_word: תְּאַמֵּץ
  choice: uliyatia nguvu
  rationale: Pieli ya אמץ humaanisha kuimarisha au kufanya kuwa na nguvu. “Uliyatia nguvu” inadumisha sitiari ya kimwili na usambamba na “yalimwinua.”
