  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: sw
  text: Je, kumcha Mungu kwako[a] si tegemeo lako[b], na unyofu wa njia zako[c] si tumaini lako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hofu yako”; Kiebrania hakimtaji wazi mlengwa wa hofu hiyo, ingawa katika fasihi ya hekima mara nyingi humaanisha kumcha Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “uhakika wako” au “imani yako,” badala ya “tegemeo lako.”
    reason: lexical_alternative
  - marker: c
    text: Au, “hali ya njia zako kutokuwa na lawama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... si
  rationale: Muundo huu unaendeleza swali la balagha linalotarajia jibu la kukubali, bila kuligeuza kuwa kauli ya moja kwa moja.
- source_word: יִרְאָתְךָ
  choice: kumcha Mungu kwako
  rationale: Neno hilo humaanisha hofu au uchaji; katika fasihi ya hekima mara nyingi Mungu ndiye anayechwa, ingawa hapa ametajwa kwa kudokezwa tu. Muundo wa kitenzi-jina ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: כִּסְלָתֶךָ
  choice: tegemeo lako
  rationale: Katika muktadha huu nomino hiyo humaanisha kitu kinachompa mtu uhakika au imani, si upumbavu. “Tegemeo” linafaa katika Kiswahili na linatofautishwa vizuri na “tumaini” katika kipande cha pili.
- source_word: תִּקְוָתְךָ
  choice: tumaini lako
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa tarajio lenye matumaini na linaendeleza ulinganifu wa kishairi.
- source_word: וְתֹם
  choice: na uadilifu
  rationale: תֹּם huonyesha ukamilifu wa kimaadili, unyoofu, au hali ya kutokuwa na lawama. “Uadilifu” ni wa asili na wenye hadhi katika Kiswahili bila kudai ukamilifu usio na dosari.
- source_word: דְּרָכֶיךָ
  choice: wa njia zako
  rationale: “Njia” linahifadhi sitiari ya Kiebrania kuhusu mwenendo wa maisha, badala ya kuibadili moja kwa moja kuwa “mwenendo.”
theological_decisions:
- issue: Mlengwa asiyetajwa wazi wa neno “kumcha”
  choice: 'Mungu ametajwa katika matini kuu: “kumcha Mungu kwako”'
  alternative: “hofu yako” au “uchaji wako” bila kumtaja mlengwa
  rationale: Katika fasihi ya hekima, matumizi haya kwa kawaida huelekea kwa Mungu. Kumtaja kunasaidia uwazi kwa msomaji wa sasa, huku tanbihi ikihifadhi ukweli kwamba matini ya Kiebrania haitaji mlengwa waziwazi.
- issue: Uhusiano wa vipashio vinne vya nomino
  choice: 'Vimefasiriwa kama vifungu viwili sambamba: kumcha Mungu ni tegemeo, na uadilifu wa njia ni tumaini'
  alternative: Kuvichukulia kama orodha moja inayounganisha tegemeo, tumaini, na uadilifu wa njia
  rationale: Mpangilio wa Kiebrania una ulinganifu wa kishairi unaoeleweka vizuri zaidi kama sentensi mbili za nomino. Kurudia “si” katika Kiswahili kunafanya uhusiano huo uwe wazi bila kuondoa mvutano wa swali la balagha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sitiari ya “njia” na ulinganifu wa kishairi vimehifadhiwa; “tegemeo” na “tumaini” yametofautishwa ili kuakisi nomino mbili tofauti za Kiebrania.
