  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: sw
  text: Mngurumo wa simba, na sauti ya simba mkali, na meno ya simba wachanga yameng’olewa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yamevunjwa.” Kitenzi cha Kiebrania kinaonyesha kuondolewa au kuharibiwa kwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: Mngurumo
  rationale: Nomino hii inaeleza mlio mkubwa wa simba. “Mngurumo” ni neno la kawaida na la kishairi linalofaa kwa sauti hiyo.
- source_word: אַרְיֵה
  choice: simba
  rationale: Hili ndilo neno la kawaida la Kiebrania kwa simba, nalo limetafsiriwa moja kwa moja.
- source_word: קוֹל
  choice: sauti
  rationale: Neno hili linaweza kumaanisha “sauti” au “mlio.” “Sauti” inadumisha usambamba wa kishairi bila kurudia “mngurumo.”
- source_word: שָׁחַל
  choice: simba mkali
  rationale: Ni neno la kishairi kwa simba, lenye kudokeza nguvu au ukali. “Simba mkali” hulitofautisha na אַרְיֵה bila kuingiza maana isiyo na uhakika kama rangi ya simba.
- source_word: שִׁנֵּי
  choice: meno ya
  rationale: Ni wingi wa neno “jino” katika muundo wa umilikaji, hivyo limetafsiriwa kwa kawaida kuwa “meno ya.”
- source_word: כְפִירִים
  choice: simba wachanga
  rationale: Neno hili humaanisha simba vijana wenye nguvu, si lazima vitoto vidogo visivyojiweza. “Simba wachanga” linaendeleza picha ya nguvu za kuwinda.
- source_word: נִתָּעוּ
  choice: yameng’olewa
  rationale: Kitenzi hiki kinaonyesha meno kuondolewa kwa nguvu. “Yameng’olewa” kinawasilisha picha hiyo moja kwa moja; uwezekano wa meno kuvunjwa umewekwa katika tanbihi.
