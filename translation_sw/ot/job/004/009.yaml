    issue: ‘Mkupuo wa hasira yake’ is an unclear rendering of וּמֵרוּחַ אַפּוֹ.
    rationale: Although intended to convey ‘blast,’ ‘mkupuo’ is not the clearest standard expression here and weakens the transparent Hebrew imagery of wind/breath. ‘Upepo wa hasira yake’ is natural, poetic, and lexically closer to רוּחַ.
