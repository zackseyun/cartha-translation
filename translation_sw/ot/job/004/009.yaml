  text: מִ/נִּשְׁמַ֣ת אֱל֣וֹהַ יֹאבֵ֑דוּ וּ/מֵ/ר֖וּחַ אַפּ֣/וֹ יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: sw
  text: 'Kwa pumzi ya Mungu wanaangamia[a],

    na kwa upepo wa hasira yake wanafikia mwisho[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutokana na pumzi ya Mungu wanaangamia.” Kihusishi cha Kiebrania kinaweza kuonyesha chanzo au chombo; hapa kimetafsiriwa kwa maana ya chombo.
    reason: lexical_alternative
  - marker: c
    text: Au, “wanateketea,” au “wanaisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: kwa pumzi ya
  rationale: Neno נְשָׁמָה humaanisha pumzi au kupumua. Kihusishi מִן hapa kinaweza kuonyesha chanzo au chombo/sababu; “kwa pumzi ya” ni Kiswahili cha kawaida kinachoonyesha nguvu inayosababisha huku picha ya kishairi ikihifadhiwa.
- source_word: אֱלוֹהַ
  choice: Mungu
  rationale: Hili ni umbo la umoja la kishairi linalomaanisha “Mungu,” hasa katika Ayubu. Hakuna msingi wa kuongeza cheo kama “Mwenyezi.”
- source_word: יֹאבֵדוּ
  choice: wanaangamia
  rationale: Kitenzi אבד kina maana ya kuangamia au kupotea kabisa. “Wanaangamia” huhifadhi hali ya kitenzi kisichohitaji mtendaji aliyetajwa na inafaa katika ulinganifu wa kishairi.
- source_word: וּמֵרוּחַ
  choice: na kwa mkupuo wa
  rationale: רוּחַ linaweza kumaanisha upepo, pumzi, au roho. Katika ulinganifu na “pumzi,” likiambatana na hasira, “mkupuo” huwasilisha wazo la upepo au pumzi yenye nguvu bila kulifanya hapa kuwa neno la kiteolojia “roho.”
- source_word: אַפּוֹ
  choice: hasira yake
  rationale: אַף humaanisha kihalisi pua au tundu la pua, na kwa upanuzi hasira. Katika muundo huu maana ya nahau ni hasira, huku “mkupuo” ukiendeleza picha ya pumzi inayotoka puani.
- source_word: יִכְלוּ
  choice: wanafikia mwisho
  rationale: כלה katika Qal inaweza kumaanisha kuisha, kufikia mwisho, au kuteketea. “Wanafikia mwisho” huhifadhi maana ya matokeo bila kulazimisha picha ya kuteketezwa kwa moto.
theological_decisions:
- issue: Lugha ya kibinadamu inayotumiwa kueleza hasira ya Mungu
  choice: Kutafsiri אַפּוֹ kwa maana ya nahau kuwa “hasira yake,” huku picha ya pumzi au upepo ikihifadhiwa kwa “mkupuo.”
  alternative: “matundu ya pua yake” au “ghadhabu yake”
  rationale: “Matundu ya pua yake” yangehifadhi picha halisi lakini yangeweza kuficha maana ya nahau kwa msomaji wa kawaida. “Ghadhabu” inawezekana, lakini “hasira” ni ya sasa na ya moja kwa moja zaidi. Chaguo hili haliongezi dai lolote la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari miwili inadumisha ulinganifu wa kishairi wa Kiebrania. “Mkupuo” ni neno linaloeleweka kwa upepo au pumzi yenye nguvu, na maelezo ya chini yanahifadhi upana wa maana ya רוּחַ pamoja na uwezekano wa kutafsiri מִן kama chanzo.
