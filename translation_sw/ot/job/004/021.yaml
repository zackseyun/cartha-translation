  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: sw
  text: Je, kamba yao ya hema haing’olewi ndani yao? Wanakufa bila hekima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanakufa kabla ya kupata hekima,” au “wanakufa pasipo kuwa na hekima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... haing’olewi?
  rationale: Kishazi hiki kinaendeleza swali la balagha linalotarajia kukubaliwa; muundo wa “Je, ...?” unahifadhi nguvu yake ya kuuliza.
- source_word: נִסַּע
  choice: haing’olewi
  rationale: Kitenzi katika hali ya kutendwa kinaweza kumaanisha kung’olewa au kuondolewa, hasa katika taswira ya kuondoka kwa hema; “ng’olewa” inadumisha taswira hiyo bila kulazimisha wazo la kuraruliwa.
- source_word: יִתְרָם
  choice: kamba ya hema lao
  rationale: Nomino יתר inaweza kueleza kamba, hususa kamba ya hema. Muktadha wa makao dhaifu ya mwanadamu katika mstari uliotangulia unaunga mkono maana hii halisi kuliko “ubora wao” au “utukufu wao.”
- source_word: בָּם
  choice: ndani yao
  rationale: Tafsiri hii inahifadhi kihusishi ב pamoja na kiambishi cha nafsi na kuonyesha kwa lugha ya kawaida kuwa kamba inayowakilisha uhai wao inaondolewa kutoka ndani mwao.
- source_word: יָמוּתוּ
  choice: Wanakufa
  rationale: מות ni kitenzi cha kawaida cha kufa; tafsiri ya moja kwa moja haiongezi uzito wa maana usiokuwapo.
- source_word: וְלֹא בְחָכְמָה
  choice: bila hekima
  rationale: Hii ni Kiswahili cha asili na kifupi kinachohifadhi utata wa kama wanakufa pasipo hekima au kabla ya kuipata.
theological_decisions:
- issue: Maana ya kufa “bila hekima”
  choice: Utata umehifadhiwa katika matini kuu.
  alternative: “kabla ya kupata hekima” au “si kwa hekima”
  rationale: Kiebrania ni kifupi na hakibainishi ikiwa watu wanakufa bila kuwa na hekima, kabla ya kuipata, au kwa namna isiyo ya hekima; tafsiri haipaswi kuamua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Taswira halisi ya hema imehifadhiwa kwa uwazi, huku kishazi cha mwisho kikitolewa kwa lugha ya kawaida bila kuondoa utata wa Kiebrania.
