translation:
  language: sw
  text: Neno lililetwa kwangu kwa siri, na sikio langu likapata mnong'ono wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikio langu likapata dokezo lake,” au “likapata sauti hafifu kutoka katika neno hilo.”
