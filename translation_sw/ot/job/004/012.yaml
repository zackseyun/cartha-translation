lexical_decisions:
- source_word: וְאֵלַי
  choice: linijia
  rationale: Kiambishi cha nafsi katika “linijia” kinaonyesha wazi kwamba neno lilimjia msemaji; kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti katika mtiririko wa kawaida wa Kiswahili.
- source_word: דָּבָר
  choice: Neno
  rationale: “Neno” linadumisha ufupi na hali ya fumbo ya Kiebrania bila kulifafanua kupita kiasi kuwa ujumbe kamili.
- source_word: יְגֻנָּב
  choice: kwa siri
  rationale: Kitenzi cha kutendwa kinatokana na wazo la kuiba, lakini hapa kinaeleza kuwasili kwa kificho; “lilinijia kwa siri” ni Kiswahili cha kawaida kisicholeta picha potovu ya wizi halisi.
- source_word: וַתִּקַּח
  choice: likanasa
  rationale: Kitenzi hiki kihalisi ni “likachukua,” huku sikio likiwa mtendaji; “likanasa” linahifadhi taswira hiyo kwa lugha ya kawaida ya kusikia.
- source_word: אָזְנִי
  choice: sikio langu
  rationale: Umoja umehifadhiwa ili kudumisha taswira hai ya kiungo cha mwili katika Kiebrania.
- source_word: שֵׁמֶץ
  choice: mnong'ono
  rationale: Katika muktadha wa kusikia, neno hili linaashiria sauti hafifu, sehemu ndogo, au dokezo; “mnong'ono” linafaa kwa mazingira ya ufunuo wa kimya.
- source_word: מֶנְהוּ
  choice: wake
  rationale: Kiswahili cha kawaida hutumia “mnong'ono wake” kurejelea neno lililotangulia; maana ya msingi ya “kutoka kwake/kwalo” imeelezwa katika tanbihi.
