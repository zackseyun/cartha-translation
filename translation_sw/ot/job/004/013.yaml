  text: בִּ֭/שְׂעִפִּים מֵ/חֶזְיֹנ֣וֹת לָ֑יְלָה בִּ/נְפֹ֥ל תַּ֝רְדֵּמָ֗ה עַל אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: sw
  text: Katikati ya mawazo yanayosumbua yatokanayo na maono ya usiku[a], usingizi mzito unapowaangukia wanadamu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katikati ya mawazo yenye wasiwasi yatokanayo na maono ya usiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: Katikati ya mawazo yanayosumbua
  rationale: Nomino hii inaashiria mawazo yaliyogawanyika au yenye kuleta wasiwasi. Kauli hii ni ya asili katika Kiswahili na inadumisha hali ya kuvurugika kiakili katika muktadha.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: yatokanayo na maono ya usiku
  rationale: מִן inaonyesha chanzo au kisababishi cha mawazo hayo, huku חֶזְיֹנוֹת לָיְלָה ikitafsiriwa moja kwa moja kuwa “maono ya usiku.”
- source_word: בִּנְפֹל
  choice: unapowaangukia
  rationale: בְּ pamoja na kitenzi-jina huanzisha kishazi cha wakati; “unapo-” kinaonyesha wazi maana ya “wakati ... unapoanguka.”
- source_word: תַּרְדֵּמָה
  choice: usingizi mzito
  rationale: Neno hili linamaanisha usingizi mzito sana, si usingizi wa kawaida tu.
- source_word: עַל אֲנָשִׁים
  choice: wanadamu
  rationale: Ingawa אֲנָשִׁים ni wingi wa kiume kisarufi, hapa lina maana ya kijumla ya watu; “wanadamu” huwasilisha maana hiyo kwa usahihi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya kijumla ya אֲנָשִׁים
  choice: wanadamu
  alternative: wanaume
  rationale: Katika muktadha huu wingi wa kiume wa Kiebrania unawahusu wanadamu kwa ujumla. Kiswahili “wanadamu” huhifadhi upeo huo bila kudai kuwa ni watu wa jinsia ya kiume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa mstari umehifadhiwa, pamoja na koma ya mwisho kwa kuwa sentensi inaendelea katika mstari unaofuata.
