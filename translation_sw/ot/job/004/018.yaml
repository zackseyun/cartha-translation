reference: Job 4:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הֵ֣ן בַּ֭/עֲבָדָי/ו לֹ֣א יַאֲמִ֑ין וּ֝/בְ/מַלְאָכָ֗י/ו יָשִׂ֥ים תָּהֳלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: sw
  text: Tazama, yeye hawatumainii watumishi wake, na wajumbe wake[a] huwahesabia kuwa na kosa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malaika wake.” Neno la Kiebrania linaweza kumaanisha wajumbe wa kibinadamu au wa mbinguni; hapa muktadha huenda unawalenga viumbe wa mbinguni.
    reason: alternative_reading
  - marker: b
    text: Au “upumbavu,” “dosari,” au “kutokamilika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili linavuta fikira na kusisitiza dai linalofuata; “Tazama” lina nguvu inayofaa katika Kiswahili cha sasa chenye hadhi.
- source_word: בַּעֲבָדָיו
  choice: watumishi wake
  rationale: עבד hapa inaonyesha walio chini ya mamlaka ya Mungu, si lazima hali ya kijamii ya utumwa; kwa hiyo “watumishi” linafaa zaidi.
- source_word: לֹא יַאֲמִין
  choice: hawatumainii
  rationale: Hiphil ya אמן pamoja na ב ina maana ya kuweka imani au kuwa na hakika juu ya mtu; “hawatumainii” linaonyesha kutokuwa na imani nao, si kukataa tu ukweli wa kauli yao.
- source_word: וּבְמַלְאָכָיו
  choice: wajumbe wake
  rationale: מלאך kimsingi ni mjumbe na inaweza kumaanisha mjumbe wa kibinadamu au wa mbinguni. “Wajumbe” linahifadhi upana huo wa kileksika, ingawa muktadha unaelekea kwa viumbe wa mbinguni.
- source_word: יָשִׂים
  choice: huwahesabia kuwa na
  rationale: שׂים pamoja na nomino dhahania hapa ina maana ya kumwekea au kumhusabia mtu sifa fulani; muundo huu ni wa asili katika Kiswahili.
- source_word: תָּהֳלָה
  choice: kosa
  rationale: Nomino hii adimu inaweza kuonyesha kosa, upumbavu, dosari, au kutokamilika. “Kosa” ni wazi na fupi bila kufunga kabisa wigo wake wa maana.
theological_decisions:
- issue: Ikiwa מַלְאָכָיו itafsiriwe mahsusi kuwa “malaika wake” au kwa maana pana kuwa “wajumbe wake”
  choice: wajumbe wake
  alternative: malaika wake
  rationale: Neno la Kiebrania linaweza kutaja wajumbe wa kibinadamu au wa mbinguni. Muktadha huenda unawalenga malaika, lakini tafsiri pana katika matini na mbadala katika tanbihi huhifadhi utata halisi bila kuamua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi umehifadhiwa kwa sentensi fupi yenye vipashio viwili sambamba; viwakilishi vimewekwa wazi kiasi ili maana isomeke kwa urahisi.
