base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: sw
  text: Kuanzia asubuhi hadi jioni hupondwa; bila mtu yeyote kutambua[a], wanaangamia milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila mtu yeyote kujali” / “bila mtu yeyote kutia jambo hilo moyoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: Tangu asubuhi hadi jioni
  rationale: Kirai hiki kinahifadhi picha ya Kiebrania ya kipindi kinachoanzia asubuhi hadi jioni na kusisitiza ufupi na udhaifu wa maisha ya mwanadamu.
- source_word: יֻכַּתּוּ
  choice: wanapondwa
  rationale: Kauli ya kutendwa katika Kiebrania inaonyesha kwamba wanapigwa na kuvunjwa au kuangamizwa; “wanapondwa” ni ya kawaida, hudumisha uzito wa taswira, wala haitaji chombo au mtendaji.
- source_word: מִבְּלִי מֵשִׂים
  choice: pasipo mtu yeyote kujali
  rationale: Nahau hii ina wazo la kutoweka jambo moyoni au kutolizingatia. “Pasipo mtu yeyote kujali” huwasilisha kwa Kiswahili cha kawaida kwamba maangamizi yao hayapewi uzito, huku tanbihi ikihifadhi maana mbadala ya kutotambua.
- source_word: לָנֶצַח
  choice: milele
  rationale: Neno hili huonyesha hali ya kudumu; hapa linasisitiza kutoweza kubadilishwa kwa kuangamia kwao bila kufafanua zaidi upeo wake wa kitheolojia.
- source_word: יֹאבֵדוּ
  choice: wanaangamia
  rationale: Kitenzi hiki kina maana pana ya kupotea, kuharibika, au kuangamia. “Wanaangamia” huhifadhi maana ya jumla bila kuingiza wazo maalumu la hukumu ya mwisho.
theological_decisions:
- issue: Ukamilifu wa kifo cha mwanadamu katika maneno ya Elifazi
  choice: Kauli imetafsiriwa kama maelezo ya udhaifu wa muda wa mwanadamu na kifo kisichojaliwa, huku “milele” ikihifadhiwa.
  alternative: Kuelewa “milele” moja kwa moja kuwa maangamizi ya mwisho katika hukumu ya eskatolojia.
  rationale: Katika muktadha, Elifazi anaeleza jinsi wanadamu walivyo dhaifu mbele za Mungu. Tafsiri haiipanui kauli hii kuwa fundisho kamili kuhusu hukumu ya mwisho, lakini pia haiondoi mvutano uliomo katika neno “milele.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wanapondwa” huhifadhi taswira kali ya Kiebrania; “kujalia” limetumiwa kwa maana ya kulipa jambo uzito, na tanbihi inafafanua nahau ya asili.
