  text: The lion perishes for lack of prey[a], and the cubs of the lion are scattered.
translation:
  language: sw
  text: Simba huangamia kwa kukosa mawindo, na watoto wa simba[a] hutawanyika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa simba jike.” Neno la Kiebrania לָבִיא linaweza kumaanisha simba au simba jike.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: simba mwenye nguvu
  rationale: Neno hili humaanisha simba na linaweza kudokeza simba mwenye nguvu au aliyekomaa. Katika ushairi huu, “simba mwenye nguvu” huonyesha tofauti ya msamiati wa Kiebrania bila kulazimisha maana ya “mzee”.
- source_word: אֹבֵד
  choice: huangamia
  rationale: Kitenzi אבד huonyesha kufa au kuja kwenye uharibifu; “huangamia” huhifadhi uzito na mtindo wa kimethali.
- source_word: מִבְּלִי
  choice: kwa kukosa
  rationale: Kirai hiki huonyesha kutokuwapo au upungufu unaosababisha matokeo; “kwa kukosa” ni Kiswahili cha kawaida na wazi.
- source_word: טָרֶף
  choice: mawindo
  rationale: Neno hili hurejelea mnyama anayewindwa au chakula kinachopatikana kwa kuwinda, si chakula kwa ujumla.
- source_word: בְנֵי
  choice: watoto wa
  rationale: Ingawa maana halisi ni “wana wa,” katika taswira ya wanyama “watoto wa” ni ya kawaida na haibainishi umri usioelezwa.
- source_word: לָבִיא
  choice: simba
  rationale: Neno linaweza kumaanisha simba, na katika baadhi ya miktadha simba jike. “Simba” huhifadhi kutobainishwa kwa jinsia katika chanzo.
- source_word: יִתְפָּרָדוּ
  choice: hutawanyika
  rationale: Kitenzi huonyesha kutengana au kusambaratika; “hutawanyika” ni cha asili na kinafaa katika ulinganifu wa kishairi.
