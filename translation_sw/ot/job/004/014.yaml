lexical_decisions:
- source_word: פַּחַד
  choice: Hofu
  rationale: Neno hili hutaja hofu au woga mkubwa; “hofu” ni la kawaida na linaacha kiwango chake kielezwe na muktadha.
- source_word: קְרָאַנִי
  choice: ilinijia
  rationale: Hapa קרא ina maana ya kukutana na mtu au kumpata; “ilinijia” linaonyesha tukio la ghafla kwa Kiswahili cha kawaida.
- source_word: וּרְעָדָה
  choice: pamoja na kutetemeka
  rationale: Nomino hii inaonyesha mwitikio wa mwili unaoandamana na hofu.
- source_word: וְרֹב עַצְמוֹתַי
  choice: mifupa yangu yote
  rationale: Kiebrania kwa halisi ni “wingi wa mifupa yangu,” tamathali inayosisitiza mwili mzima; “mifupa yangu yote” ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi umbo halisi na utata.
- source_word: הִפְחִיד
  choice: ikaifanya ... itikisike
  rationale: Hiphil ni ya kusababisha hofu; pamoja na “mifupa” hapa huwasilisha athari kali ya mwili kwa lugha ya asili.
