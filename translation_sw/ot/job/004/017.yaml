  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: sw
  text: Je, mwanadamu dhaifu anaweza kuwa mwenye haki mbele za Mungu? Je, mtu anaweza kuwa safi mbele za Muumba wake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “Je, mwanadamu dhaifu anaweza kuwa mwenye haki kuliko Mungu? Je, mtu anaweza kuwa safi kuliko Muumba wake?”'
    reason: Usomaji mwingine unaowezekana wa kihusishi מן kama ulinganisho.
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: mwanadamu dhaifu
  rationale: אֱנוֹשׁ humtaja binadamu huku ikidokeza udhaifu na hali yake ya kufa; “mwanadamu dhaifu” huonyesha tofauti yake na Mungu kwa Kiswahili cha kawaida.
- source_word: מֵאֱלוֹהַ
  choice: mbele za Mungu
  rationale: מן pamoja na צדק inaweza kueleweka kwa uhusiano au kwa ulinganisho. “Mbele za Mungu” hutoa maana ya kusimama akiwa mwenye haki katika uhusiano na Mungu, bila kufuta usomaji wa kulinganisha unaowekwa katika tanbihi.
- source_word: יִצְדָּק
  choice: kuwa mwenye haki
  rationale: צדק hapa huhusu kuonekana au kusimama akiwa na haki; usemi huu huhifadhi uzito wa kimaadili na kimahakama kwa lugha yenye kueleweka.
- source_word: אִם
  choice: Je, ... anaweza
  rationale: Katika usambamba wa kishairi, אִם huanzisha swali la pili. Kurudia muundo wa swali hudhihirisha nguvu ya maswali ya balagha kwa Kiswahili.
- source_word: מֵעֹשֵׂהוּ
  choice: mbele za Muumba wake
  rationale: Kishiriki עֹשֵׂה pamoja na kiambishi humaanisha “Muumba wake.” “Mbele za” huonyesha uhusiano kama katika mstari wa kwanza, huku “Muumba” ikihifadhi tofauti kati ya kiumbe na aliyemuumba.
- source_word: יִטְהַר
  choice: kuwa safi
  rationale: טהר humaanisha kuwa safi au kutakasika. “Kuwa safi” inafaa katika usambamba na kuwa mwenye haki bila kubainisha kupita kiasi aina ya usafi.
- source_word: גָּבֶר
  choice: mtu
  rationale: גָּבֶר ni mwanamume au mtu, wakati mwingine ikidokeza nguvu, lakini hapa iko katika usambamba na אֱנוֹשׁ. “Mtu” ni ya asili na haiongezi wazo la shujaa lisilo la lazima.
theological_decisions:
- issue: Hali ya mwanadamu katika uhusiano na Mungu
  choice: Maswali yanauliza kama mwanadamu anaweza kuwa mwenye haki au safi mbele za Mungu, bila kuingiza ndani ya mstari mfumo wa mafundisho wa baadaye.
  alternative: Mwanadamu hawezi kuwa mwenye haki kuliko Mungu, wala mtu kuwa safi kuliko Muumba wake.
  rationale: מן inaweza kuwa ya ulinganisho (“kuliko”) au kuonyesha uhusiano (“mbele za”). Matini kuu inatumia usemi wa asili wa Kiswahili unaofaa muktadha, na tanbihi huhifadhi kwa uwazi usomaji halisi zaidi wa kulinganisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa kishairi na maswali mawili ya balagha umehifadhiwa; “Muumba” limeandikwa kwa herufi kubwa kama jina la heshima katika muktadha huu.
