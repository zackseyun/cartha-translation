  yaml_path: translation/ot/job/004/015.yaml
  text: Then a spirit passed before my face[a]; the hair of my flesh bristled.
translation:
  language: sw
  text: Ndipo roho ikapita mbele ya uso wangu[a]; nywele za mwili wangu zikasimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upepo” au “pumzi” ikapita mbele ya uso wangu. Neno la Kiebrania רוּחַ linaweza kumaanisha “roho,” “upepo,” au “pumzi”; hapa muktadha unaelekea kuunga mkono “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: roho
  rationale: Neno רוּחַ linaweza kumaanisha roho, upepo, au pumzi. Katika muktadha huu wa tukio la ajabu lenye kuogofya, “roho” linafaa zaidi, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: עַל פָּנַי
  choice: mbele ya uso wangu
  rationale: Ingawa kwa neno moja moja ni “juu ya uso wangu,” likitumiwa pamoja na יחלף linaonyesha kitu kinachopita mbele ya msemaji. Tafsiri hii inahifadhi picha halisi ya Kiebrania.
- source_word: יַחֲלֹף
  choice: ikapita
  rationale: Kitenzi חלף humaanisha kupita au kupita kando. “Ikapita” ni cha kawaida katika Kiswahili na kinaendana na kirai “mbele ya uso wangu.”
- source_word: תְּסַמֵּר
  choice: zikasimama
  rationale: Kitenzi hiki humaanisha kufanya kitu kiwe kigumu au kisimame wima. Kuhusu nywele, Kiswahili cha kawaida husema nywele zimesimama.
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: nywele za mwili wangu
  rationale: Kirai hiki kwa karibu ni “nywele za nyama yangu.” “Nywele za mwili wangu” huhifadhi maana na uzito wa usemi bila kuleta hali isiyo ya kawaida ya “nyama yangu” katika Kiswahili.
