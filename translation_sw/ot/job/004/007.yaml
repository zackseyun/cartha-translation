  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: sw
  text: 'Tafadhali kumbuka: ni mtu gani asiye na hatia[a] aliyewahi kuangamia? Au ni wapi watu wanyofu walikatiliwa mbali?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asiye na lawama” badala ya “asiye na hatia.”
    reason: lexical_alternative
  - marker: b
    text: Au “waliangamizwa” au “walifutiliwa mbali” badala ya “walikatiliwa mbali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Tafadhali kumbuka
  rationale: Amri זְכָר pamoja na chembe נָא inatoa mwito wa kukumbuka au kutafakari kwa namna iliyolainishwa; “Tafadhali kumbuka” ni Kiswahili cha sasa na cha kawaida.
- source_word: מִי הוּא
  choice: Ni mtu gani
  rationale: Muundo wa kiulizi pamoja na kiwakilishi unasisitiza swali la balagha; “Ni mtu gani” huhifadhi msisitizo huo kwa Kiswahili cha asili.
- source_word: נָקִי
  choice: asiye na hatia
  rationale: Neno hili humaanisha mtu asiye na kosa au hatia; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: אָבָד
  choice: aliyewahi kuangamia
  rationale: Kitenzi kinaonyesha kuangamia au kupotea kabisa. “Aliyewahi” huonyesha nguvu ya swali la balagha bila kubadili dai la Elifazi.
- source_word: וְאֵיפֹה
  choice: Au ni wapi
  rationale: Kiunganishi na kiulizi vinaanzisha swali sambamba la pili; “Au ni wapi” huwasilisha ulinganifu huo kwa ufasaha.
- source_word: יְשָׁרִים
  choice: watu wanyofu
  rationale: Kivumishi cha wingi kimetumiwa kama nomino kwa watu waadilifu; “watu wanyofu” ni wazi kwa msomaji wa kawaida.
- source_word: נִכְחָדוּ
  choice: walipofutiliwa mbali
  rationale: Niphal ya כחד inaweza kumaanisha kuondolewa, kufutwa, au kuangamizwa. “Kufutiliwa mbali” huhifadhi hali ya kutendwa na wazo la kuondolewa kabisa.
theological_decisions:
- issue: Dai la balagha la Elifazi kuhusu hatima ya wasio na hatia na watu wanyofu
  choice: Kulitoa moja kwa moja kama dai la Elifazi, bila kulilegeza wala kulithibitisha kuwa msimamo wa mwisho wa kitabu
  alternative: Kulitafsiri kwa maneno yanayoashiria wazi kwamba dai hilo litapingwa baadaye katika kitabu
  rationale: Mstari huu unawasilisha teolojia ya Elifazi kwa swali la balagha. Tafsiri inapaswa kuhifadhi dai lake na mvutano wake ndani ya kitabu bila kuingiza hukumu ya baadaye katika maneno yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Maswali ya balagha na ulinganifu wa kishairi yamehifadhiwa.
