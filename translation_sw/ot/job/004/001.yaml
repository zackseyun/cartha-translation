lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Katika fomula hii ya masimulizi, kitenzi ענה humaanisha kujibu au kuitikia. “Akajibu” ni Kiswahili cha kawaida na huhifadhi mfuatano wa mazungumzo.
- source_word: אֱלִיפַז
  choice: Elifazi
  rationale: Jina limetoholewa kwa umbo linalotambulika na lililozoeleka katika Kiswahili cha Biblia.
- source_word: הַתֵּימָנִי
  choice: Mtemani
  rationale: Kivumishi hiki cha asili humtambulisha mtu wa Temani. “Mtemani” ni kifupi, cha asili katika Kiswahili, na huhifadhi utambulisho wa mahali.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Hii ni fomula ya kawaida ya Kiebrania ya kuanzisha maneno yanayofuata. “Akasema” huhifadhi muundo huo kwa Kiswahili cha masimulizi.
- source_word: וַ
  choice: Ndipo / aka-
  rationale: Waw zinazofululiza matukio zimewasilishwa kwa “Ndipo” na viambishi vya mfululizo “aka-,” ili kuonyesha hatua inayofuata kwa mtiririko wa kawaida wa Kiswahili.
