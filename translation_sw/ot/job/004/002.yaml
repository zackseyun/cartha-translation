translation:
  language: sw
  text: Je, mtu akijaribu kukwambia neno[a], utachoka? Lakini ni nani awezaye kujizuia kusema?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu akithubutu kuleta jambo kwako.”
    reason: דָבָר inaweza kumaanisha “neno” au “jambo,” na הֲנִסָּה inaweza kuwa na wazo la kujaribu au kuthubutu kuanzisha jambo.
lexical_decisions:
- source_word: הֲנִסָּה
  choice: akijaribu
  rationale: Kitenzi hiki kinaonyesha kujaribu au kuthubutu kuanza kusema. “Akijaribu” ni cha kawaida katika Kiswahili na kinaendeleza tahadhari ya Elifazi bila kukipa maana ya kumjaribu Ayubu.
- source_word: דָבָר
  choice: neno
  rationale: דָבָר inaweza kumaanisha “neno” au “jambo.” “Neno” linafaa katika muktadha wa kuanza kusema na linadumisha uhusiano wa kimakusudi na “maneno” katika sehemu ya pili.
- source_word: אֵלֶיךָ
  choice: kukuambia
  rationale: Maana ya msingi ni kuelekeza neno kwa Ayubu. “Kukuambia” ni usemi wa kawaida wa Kiswahili kuliko tafsiri sisisi kama “neno kwako.”
- source_word: תִּלְאֶה
  choice: utachoka
  rationale: לאה humaanisha kuchoka au kulemewa. “Utachoka” huhifadhi maana hiyo bila kuibadili kimyakimya kuwa kukosa subira au kukasirika.
- source_word: וַעְצֹר
  choice: kuzuia
  rationale: עצר hapa ni kujizuia au kuyazuia maneno yasitamkwe. “Kuzuia” ni wazi na linafaa kwa swali la balagha.
- source_word: בְּמִלִּין
  choice: maneno
  rationale: Umbo hili la wingi linamaanisha “maneno”; wingi umehifadhiwa na pia unaitikia “neno” la mwanzo.
- source_word: מִי יוּכָל
  choice: ni nani anayeweza
  rationale: Huu ni usemi wa kawaida wa kuuliza kuhusu uwezo kwa namna ya swali la balagha.
