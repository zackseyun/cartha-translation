translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali umehifadhiwa, huku “je” ikisaidia usomaji wa kawaida. Tafsiri haiongezi “yake” baada ya “maneno,” kwa kuwa Kiebrania hakitaji wazi mwenye maneno hayo.
