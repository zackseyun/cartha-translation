  text: הִ֭נֵּה יִסַּ֣רְתָּ רַבִּ֑ים וְ/יָדַ֖יִם רָפ֣וֹת תְּחַזֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: sw
  text: 'Tazama, umewafundisha[a] wengi,

    nawe umetia nguvu mikono iliyolegea.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umewatia nidhamu” au “umewasahihisha”; kitenzi cha Kiebrania kinaweza kujumuisha wazo la kufundisha kwa kusahihisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashirio cha mazungumzo kinachovuta fikira kwenye yanayofuata; “Tazama” kinahifadhi msisitizo na hadhi ya kishairi.
- source_word: יִסַּרְתָּ
  choice: umewafundisha
  rationale: Kitenzi יסר kinaweza kumaanisha kufundisha kwa kuonya au kusahihisha, na pia kutia nidhamu. Katika muktadha huu Elifazi anakumbuka jinsi Ayubu alivyowaongoza wengine, hivyo “umewafundisha” linafaa huku tanbihi ikihifadhi maana nyingine.
- source_word: רַבִּים
  choice: wengi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya wingi wa watu.
- source_word: יָדַיִם רָפוֹת
  choice: mikono iliyolegea
  rationale: Inahifadhi sitiari ya mwili inayowakilisha udhaifu au kuvunjika moyo; “iliyolegea” ni ya asili na wazi katika Kiswahili.
- source_word: תְּחַזֵּק
  choice: umeitia nguvu
  rationale: Piel ya חזק humaanisha kufanya kuwa imara au kutia nguvu. Kauli hii inaeleweka kwa kurejelea matendo ya Ayubu ya wakati uliopita, sambamba na kitenzi kilichotangulia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mistari miwili inadumisha usambamba wa kishairi wa Kiebrania.
