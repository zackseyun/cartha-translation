  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: sw
  text: Jicho la anayeniona halitanitazama tena[a]; macho yako yataniangalia[b], nami sitakuwapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jicho linaloniona halitaniona.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “macho yako juu yangu, nami sipo”—yaani, utakaponitazama au kunitafuta, nitakuwa nimetoweka.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: halitanitazama tena
  rationale: Kitenzi שׁור humaanisha kutazama au kukazia macho. “Kunitazama” ni cha kawaida na chenye hadhi katika Kiswahili, huku “tena” kikionyesha kwa muktadha kwamba Ayubu hatakuwa akionekana tena.
- source_word: עֵין רֹאִי
  choice: jicho la anayeniona
  rationale: Huhifadhi taswira halisi ya Kiebrania ya “jicho” na muundo wa “yule anayeniona,” bila kuufanya usemi kuwa wa jumla kupita kiasi.
- source_word: לֹא
  choice: hali- ... tena
  rationale: Ingawa לֹא ni ukanushi sahili, katika maombolezo haya unaelekea kwenye kutoweka kwa Ayubu; “halita... tena” huwasilisha nguvu hiyo ya kimuktadha bila kubadili maana kuu.
- source_word: עֵינֶיךָ
  choice: macho yako
  rationale: Huhifadhi wingi wa Kiebrania na taswira ya kishairi ya macho ya anayeambiwa yakimwelekea Ayubu.
- source_word: בִּי
  choice: juu yangu
  rationale: Ni tafsiri ya karibu ya kihusishi בְּ pamoja na usemi wa macho kuelekezwa kwa mtu. Inahifadhi ukaribu wa muundo wa Kiebrania, ingawa Kiswahili cha kawaida pia kingeweza kusema “yatanitafuta.”
- source_word: וְאֵינֶנִּי
  choice: lakini mimi sitakuwapo
  rationale: Kihalisi ni “nami sipo.” Katika muktadha wenye mwelekeo wa wakati ujao, “sitakuwapo” huhifadhi kwa kiasi kikubwa usemi wa asili na uwezekano wake wa kumaanisha kutoweka au kufa.
theological_decisions:
- issue: Anayeambiwa kwa “macho yako”
  choice: Kauli inaachwa kama mazungumzo ya moja kwa moja yanayoeleweka kumlenga Mungu kutokana na muktadha.
  alternative: Kumchukulia anayeambiwa kuwa mtazamaji yeyote kwa ujumla.
  rationale: Mistari inayozunguka inaonyesha Ayubu akisema na Mungu. Hata hivyo, jina “Mungu” halijaongezwa kwa kuwa halipo katika mstari huu.
- issue: Maana ya kutokuwapo kwa Ayubu
  choice: “Sitakuwapo” inadumisha usemi wenyewe bila kufafanua moja kwa moja kuwa ni kifo.
  alternative: “Nitakuwa nimeondoka” au “sitakuwa hai tena.”
  rationale: וְאֵינֶנִּי inaweza kuashiria kutoweka au kifo. Tafsiri haipaswi kuondoa mvutano huo kwa kuweka ufafanuzi maalumu zaidi kuliko Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa “jicho ... macho” umehifadhiwa ili kudumisha taswira na urudiaji wa Kiebrania; “sitakuwapo” huepuka kufafanua kupita kiasi kama kutoweka au kifo.
