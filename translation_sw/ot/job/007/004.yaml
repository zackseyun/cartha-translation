  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: sw
  text: Ninapolala[a], nasema, “Nitaamka lini?” Lakini jioni hurefuka[b], nami nimeshiba kwa kujigeuzageuza mpaka mapambazuko[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nikilala.” Neno la Kiebrania linaweza kutafsiriwa kwa maana ya sharti, lakini hapa yaelekea linaonyesha jambo linalojirudia.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “jioni inapimwa.” Maana yake ni kwamba jioni, na kipindi cha usiku kinachofuata, huonekana kurefuka polepole.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza kumaanisha machweo au mapambazuko; hapa yaelekea linamaanisha mapambazuko.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ninapo-
  rationale: 'Ingawa אִם mara nyingi humaanisha ‘ikiwa,’ hapa inaeleweka vyema kuwa hali inayojirudia: ‘ninapolala.’'
- source_word: שָׁכַבְתִּי
  choice: lala
  rationale: Kauli hii inaeleza jambo linalotokea mara kwa mara katika maombolezo ya Ayubu, si tendo moja tu lililokamilika.
- source_word: וְאָמַרְתִּי
  choice: nasema
  rationale: Wakati wa sasa wa mazoea unaendana na hali ya kila usiku inayosimuliwa.
- source_word: מָתַי אָקוּם
  choice: Nitaamka lini?
  rationale: Kitenzi קום hapa ni kuinuka au kuamka; katika muktadha wa kulala, ‘kuamka’ ni Kiswahili cha kawaida na wazi.
- source_word: וּמִדַּד עָרֶב
  choice: Lakini usiku unaendelea polepole
  rationale: מדד kimsingi huhusiana na kupima, lakini hapa huonyesha muda unaoonekana kurefuka kwa taabu. עָרֶב kihalisi ni jioni, lakini katika muktadha huu inaenea katika kipindi cha usiku.
- source_word: וְשָׂבַעְתִּי
  choice: nami nageukageuka kitandani
  rationale: Kihalisi ni ‘nimeshiba/nimejaa’; Kiswahili hiki kinaeleza kwa kawaida kuwa Ayubu anapitisha muda wote katika hali hiyo, huku tanbihi ikihifadhi picha ya Kiebrania.
- source_word: נְדֻדִים
  choice: nageukageuka kitandani
  rationale: Nomino hiyo inaonyesha misukosuko au kugeukageuka kwa mtu asiyeweza kulala; kutaja kitanda huweka maana wazi kwa msomaji wa kawaida.
- source_word: עֲדֵי נָשֶׁף
  choice: mpaka mapambazuko
  rationale: נָשֶׁף inaweza kuwa wakati wa giza la jioni au alfajiri; hapa mwisho wa usiku unaonyesha mapambazuko.
