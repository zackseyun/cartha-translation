  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: sw
  text: Je, mwanadamu hana utumishi mgumu duniani[a], na siku zake si kama za mfanyakazi aliyeajiriwa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mwanadamu hana utumishi wa kijeshi au vita duniani?” Neno la Kiebrania צָבָא linaweza kumaanisha utumishi wa kijeshi au vita, lakini hapa huenda linarejelea kwa upana zaidi utumishi mzito au taabu, kama ulinganifu na “mfanyakazi aliyeajiriwa” unavyodokeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... hana ... si ...?
  rationale: Muundo wa swali la balagha unatarajia jibu la kukubali; Kiswahili asilia hutumia “Je” pamoja na ukanushi.
- source_word: צָבָא
  choice: utumishi mgumu
  rationale: Neno linaweza kumaanisha vita au utumishi wa kijeshi, lakini ulinganifu na mfanyakazi wa kuajiriwa unaelekeza kwenye kipindi kizito cha utumishi uliowekwa.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Huwakilisha binadamu kwa ujumla huku likidokeza udhaifu na hali yake ya kufa.
- source_word: עַל־אָרֶץ
  choice: duniani
  rationale: Ni usemi wa kawaida wa mahali unaohusu maisha ya binadamu juu ya dunia kwa ujumla.
- source_word: וְכִימֵי
  choice: na siku zake si kama siku za
  rationale: Hufanya ulinganisho wa nusu ya pili kuwa wazi na wa kawaida katika Kiswahili bila kupoteza nguvu ya swali la balagha.
- source_word: שָׂכִיר
  choice: mfanyakazi wa kuajiriwa
  rationale: Humaanisha mtu anayefanya kazi kwa ujira; tafsiri hii ni ya sasa na haina dharau isiyokuwamo katika Kiebrania.
- source_word: יָמָיו
  choice: siku zake
  rationale: Huhifadhi sitiari ya muda wa maisha kama “siku” za mtu.
