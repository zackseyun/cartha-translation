  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: sw
  text: 'Nyama yangu imefunikwa na funza na vibonge vya mavumbi;

    ngozi yangu hukakamaa[a], kisha hupasuka tena.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ngozi yangu hujifunga, kisha hutunga usaha tena.” Maana ya vitenzi viwili vya mwisho katika Kiebrania si wazi; huenda mstari unaeleza ngozi inayofunga kwa muda mfupi, kisha vidonda vinafunguka tena.
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: umevikwa
  rationale: Hudumisha sitiari halisi ya kujivika huku ikitoa Kiswahili cha kawaida kinachoonyesha mwili umefunikwa na funza na mavumbi.
- source_word: בְּשָׂרִי
  choice: mwili wangu
  rationale: Ingawa neno hilo kimsingi ni ‘nyama yangu’, katika muktadha huu linarejelea sehemu ya mwili iliyo hai; ‘mwili wangu’ ni ya asili zaidi kwa Kiswahili bila kupunguza mkazo wa mateso ya kimwili.
- source_word: רִמָּה
  choice: funza
  rationale: Neno hilo humaanisha viwavi au minyoo wanaohusishwa na kuoza; ‘funza’ ni neno mahususi na la kawaida katika Kiswahili kwa picha hii.
- source_word: גיש עפר
  choice: mabonge ya mavumbi
  rationale: עפר ni mavumbi, na neno adimu גיש linaelekea kumaanisha donge au kitu kilichoganda. Tafsiri hii huhifadhi picha ya mavumbi yaliyoganda mwilini.
- source_word: עוֹרִי
  choice: ngozi yangu
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida ya neno la Kiebrania.
- source_word: רָגַע
  choice: hukakamaa
  rationale: Katika muktadha wa ngozi yenye vidonda, kitenzi huenda kinaonyesha ngozi kujikaza, kufunga, au kuganda kwa muda. ‘Hukakamaa’ huonyesha hali hiyo bila kudai kwa uhakika kwamba imepona.
- source_word: וַיִּמָּאֵס
  choice: hupasuka tena
  rationale: Kitenzi ni kigumu hapa; katika mfuatano huu kinaeleweka kuwa ngozi inafunguka au kuharibika tena. ‘Hupasuka tena’ huwasilisha mzunguko wa kufunga na kufunguka kwa vidonda.
