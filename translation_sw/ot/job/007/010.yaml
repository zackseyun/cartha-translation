lexical_decisions:
- source_word: יָשׁוּב
  choice: atarudi
  rationale: Kitenzi שׁוב humaanisha kurudi; wakati ujao wenye ukanushi katika Kiswahili unawasilisha vizuri hali ya kutotokea tena inayozungumziwa.
- source_word: עוֹד (first occurrence)
  choice: tena
  rationale: Pamoja na ukanushi, neno hili linaonyesha kwamba kurudi hakutatokea tena.
- source_word: לְבֵיתוֹ
  choice: nyumbani kwake
  rationale: Ingawa בַּיִת kwa msingi ni ‘nyumba,’ katika mwelekeo wa kurudi kwenye makao ya mtu, ‘nyumbani kwake’ ni Kiswahili cha kawaida na cha asili bila kupanua maana.
- source_word: יַכִּירֶנּוּ
  choice: hapatamtambua
  rationale: Hiphil ya נכר inaweza kumaanisha kutambua au kukiri/kumtambua mtu. ‘Kumtambua’ huhifadhi uhuishaji wa kishairi wa mahali kama mtendaji na ni wazi kwa msomaji wa Kiswahili.
- source_word: עוֹד (second occurrence)
  choice: tena
  rationale: Katika kishazi chenye ukanushi, ‘tena’ huonyesha kutotambuliwa kabisa kuanzia hapo na kudumisha urudiaji wa Kiebrania.
- source_word: מְקֹמוֹ
  choice: mahali pake
  rationale: Hili ni tafsiri ya moja kwa moja ya מָקוֹם na huhifadhi taswira ya kishairi ya mahali palipohusishwa naye.
