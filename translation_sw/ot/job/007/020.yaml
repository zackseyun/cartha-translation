base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: sw
  text: Kama nimetenda dhambi, naweza kukufanyia nini, Ewe Mwangalizi wa wanadamu? Kwa nini umeniweka kuwa shabaha yako,[a] hata nikawa mzigo kwangu mwenyewe?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umeniweka kuwa shabaha kwa ajili yako.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya matoleo ya kale yanaakisi, “nikawa mzigo kwako.” Maandishi ya Kiebrania ya Kimasora yanasema, “kwangu mwenyewe.”
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  choice: Kama nimetenda dhambi
  rationale: Kitenzi ni timilifu nafsi ya kwanza umoja, kihalisi ‘nimetenda dhambi’; ‘kama’ kinaweka wazi nguvu ya usemi wa kukubali kwa hoja katika muktadha bila kuufanya kuwa ungamo la moja kwa moja.
- source_word: מָה אֶפְעַל לָךְ
  choice: nitakufanyia nini
  rationale: Huhifadhi swali la balagha kuhusu jambo ambalo Ayubu angeweza kumfanyia Mungu; Kiswahili cha wakati ujao hapa ni cha kawaida na hakibadili kitenzi kuwa tendo lililopita.
- source_word: נֹצֵר הָאָדָם
  choice: Ee wewe unayewachunguza wanadamu
  rationale: נֹצֵר inaweza kumaanisha kutunza, kulinda, kuangalia au kuchunguza. Katika malalamiko haya, ‘kuchunguza’ huwasilisha uangalizi wa karibu bila kuingiza wazo la ulinzi pekee; הָאָדָם ya umoja wa kijumla imetafsiriwa kwa ‘wanadamu’ kwa Kiswahili cha kawaida.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: Kwa nini umeniweka kuwa shabaha yako
  rationale: מִפְגָּע hudokeza kitu kinachopigwa au kuelekezewa shambulio; ‘shabaha yako’ ni ya asili na huingiza לָךְ katika umilikishi bila kupoteza maana.
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: hata nikawa mzigo kwangu mwenyewe
  rationale: Maandishi ya Kimasora yana עָלַי, ‘juu yangu/kwangu,’ na kwa asili zaidi hutoa ‘mzigo kwangu mwenyewe.’ ‘Hata’ huonyesha matokeo katika mtiririko wa malalamiko.
theological_decisions:
- issue: Maana ya נֹצֵר katika jina la Mungu
  choice: unayewachunguza
  alternative: unayewalinda / unayewaangalia
  rationale: Muktadha wa Ayubu ni wa kuhisi kuwa chini ya uchunguzi mkali, lakini neno la Kiebrania pia linaweza kuwa na maana ya kulinda. Tafsiri kuu haipaswi kulazimisha maana ya ulinzi katika malalamiko haya.
- issue: Mhusika anayelemewa katika וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: mzigo kwangu mwenyewe
  alternative: mzigo kwako
  rationale: ‘Kwangu mwenyewe’ hufuata עָלַי katika WLC/MT. Baadhi ya matoleo ya kale yanaakisi ‘kwako’; tofauti hiyo imehifadhiwa katika tanbihi badala ya kubadilisha maandishi ya msingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Ee’ linaonyesha mwito wa moja kwa moja; ‘shabaha’ ni neno la kawaida kwa kitu kinachoelekezewa shambulio. Alama zote za tanbihi zimo katika matini kuu.
