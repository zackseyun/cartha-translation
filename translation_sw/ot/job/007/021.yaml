  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: sw
  text: Kwa nini huisamehe uasi wangu, wala kuuondoa uovu wangu? Kwa maana sasa nitalala mavumbini; utanitafuta kwa bidii,[a] lakini sitakuwapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utanitafuta mapema.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kutafuta mapema asubuhi, lakini hapa huenda kinamaanisha kutafuta kwa hamu au kwa bidii.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: husamehe
  rationale: Kitenzi נשׂא maana yake ya msingi ni kuinua au kubeba, lakini kinapotumiwa na kosa kama yambwa huwa nahau ya kusamehe au kuondoa hatia. “Kusamehe” ni Kiswahili cha kawaida na wazi.
- source_word: פִשְׁעִי
  choice: uasi wangu
  rationale: פשע huonyesha kosa zito au uasi, mara nyingi ukiwa uvunjaji wa makusudi. “Uasi” huhifadhi uzito wake na kuutofautisha na עון.
- source_word: וְתַעֲבִיר
  choice: na kuondoa
  rationale: Hifili ya עבר hapa ina maana ya kuondosha au kufanya lipite; pamoja na עון, “kuondoa” hueleza kuondolewa kwa uovu au hatia kwa lugha ya kawaida.
- source_word: עֲוֺנִי
  choice: uovu wangu
  rationale: עון inaweza kumaanisha upotovu wa kimaadili, hatia, au adhabu inayotokana nao. “Uovu wangu” huhifadhi maana ya kimaadili na ulinganifu wake na “uasi wangu” bila kuifanya iwe sawa kabisa.
- source_word: כִּי עַתָּה
  choice: Kwa maana sasa
  rationale: Kirai hiki kinatoa sababu inayohusiana na kifo cha Ayubu kilicho karibu, huku kikihifadhi wazi kipengele cha wakati cha עתה.
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: nitalala mavumbini
  rationale: “Mavumbi” yanahifadhi taswira halisi ya kufa na kuzikwa; tafsiri haibadili taswira hiyo kuwa kauli ya moja kwa moja “nitakufa.”
- source_word: וְשִׁחֲרְתַּנִי
  choice: utanitafuta kwa bidii
  rationale: שחר katika Pieli mara nyingi humaanisha kutafuta kwa hamu au bidii, ingawa inaweza kuwa na kidokezo cha kutafuta mapema asubuhi.
- source_word: וְאֵינֶנִּי
  choice: lakini sitakuwapo
  rationale: Kiebrania ni “nami sipo,” nahau ya kutokuwapo au kutoweka. Wakati ujao na kiunganishi “lakini” vinafaa muktadha wa vitenzi vinavyoelekea wakati ujao.
theological_decisions:
- issue: Kutofautisha istilahi mbili za kosa
  choice: Kutumia “uasi” kwa פשע na “uovu” kwa עון
  alternative: Kutumia “dhambi” kwa maneno yote mawili, au “kosa” na “hatia”
  rationale: Kiebrania kinatumia maneno mawili yenye uhusiano lakini yasiyofanana. Kuyatofautisha huhifadhi ulinganifu wa kishairi na upana wa msamiati wa kimaadili.
- issue: Taswira ya kifo katika לֶעָפָר אֶשְׁכָּב
  choice: Kuhifadhi “nitalala mavumbini”
  alternative: Kutafsiri moja kwa moja “nitakufa”
  rationale: Chanzo kinatumia taswira ya kishairi ya mauti na maziko. Kuihifadhi huepuka kufafanua zaidi ya maandishi na hudumisha mvutano wa kifasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo ni wa kishairi lakini unaeleweka kwa wasomaji wa kawaida. “Mavumbini” ni usemi wa asili unaohifadhi taswira ya Kiebrania, na istilahi “uasi” na “uovu” zinabaki tofauti.
