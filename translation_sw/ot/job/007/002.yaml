  text: 'Kama mtumwa anayetamani kivuli,

    na kama kibarua anayengojea ujira wake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/עֶבֶד
  choice: kama mtumwa
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa; hapa taswira ya kazi ngumu na hali ya kutokuwa huru inaelezwa kwa nguvu zaidi na “mtumwa.”
- source_word: יִשְׁאַף
  choice: anayetamani
  rationale: שׁאף huonyesha hamu kubwa, hata kuhema kwa kutamani; “anayetamani” ni Kiswahili cha kawaida kinachohifadhi uzito wa hamu hiyo.
- source_word: צֵל
  choice: kivuli
  rationale: Katika mazingira ya kazi chini ya joto, צֵל ni kivuli kinacholeta nafuu; “kivuli” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: וּ/כְ/שָׂכִיר
  choice: na kama kibarua
  rationale: שָׂכִיר ni mfanyakazi aliyeajiriwa kwa ujira; “kibarua” huhifadhi wazo la mfanyakazi wa kulipwa, hasa wa kazi ya muda au ya siku.
- source_word: יְקַוֶּה
  choice: anayengojea
  rationale: קוה inaweza kumaanisha kungojea au kutumaini; kwa kuwa ujira unatarajiwa baada ya kazi, “anayengojea” inafaa katika muktadha huu.
- source_word: פָעֳל/וֹ
  choice: ujira wake
  rationale: Ingawa פעל inaweza kurejelea kazi au matokeo yake, ikihusishwa na kibarua hapa inaelekea kumaanisha malipo ya kazi; “ujira wake” hudumisha uhusiano huo.
