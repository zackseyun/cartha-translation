  text: Mwanadamu ni nini, hata unamfanya kuwa mkuu[a], na hata unauelekeza moyo wako kwake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unamkuza,” “unamtukuza,” au “unamwona kuwa wa maana sana.”
