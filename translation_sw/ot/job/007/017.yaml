lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: Mwanadamu ni nini
  rationale: Swali la balagha linahifadhi nomino ya umoja yenye kumwakilisha binadamu aliye dhaifu na mwenye kufa.
- source_word: כִּי תְגַדְּלֶנּוּ
  choice: hata unamtukuza
  rationale: Pieli ya גדל ina maana ya kumfanya kuwa mkuu, kumkuza, au kumpa hadhi kubwa. 'Unamtukuza' ni fasaha na hudumisha uzito wa kishairi bila kuamua ikiwa tendo hilo ni kumpa hadhi au kumwona kuwa wa maana sana.
- source_word: וְכִי
  choice: na hata
  rationale: Inaunganisha kishazi cha pili na cha kwanza katika muundo uleule wa swali la balagha.
- source_word: תָשִׁית אֵלָיו לִבֶּךָ
  choice: unaweka moyo wako kwake
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania ya kuweka moyo kwa mtu, yaani kuelekeza fikira na uangalifu kwake.
theological_decisions:
- issue: Umoja wakilishi wa אֱנוֹשׁ
  choice: Mwanadamu
  alternative: mtu; binadamu mwenye kufa
  rationale: '''Mwanadamu'' ni ya umoja lakini humwakilisha binadamu kwa jumla, huku ikidokeza hali yake ya udhaifu na kufa bila kuongeza maelezo yasiyosemwa wazi.'
- issue: Lugha ya kibinadamu kuhusu uangalifu wa Mungu
  choice: unaweka moyo wako kwake
  alternative: unamwelekezea fikira zako; unamjali
  rationale: Kuhifadhi 'moyo' kunatunza taswira ya kishairi na mvutano wa kifungu, badala ya kuifafanua kuwa akili, hisia, au uangalifu pekee.
- issue: Mwelekeo wa גדל katika muktadha wa Ayubu
  choice: unamtukuza
  alternative: unamkuza; unamfanya kuwa mkuu; unamwona kuwa wa maana sana
  rationale: Kitenzi kinaweza kuonyesha kumpa ukuu au kumfanya wa maana sana. Tafsiri kuu hudumisha usemi wenye nguvu, huku tanbihi ikihifadhi mbadala halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa swali la balagha na neno 'moyo' vimehifadhiwa. Alama ya tanbihi imewekwa mara tu baada ya neno linalohusika.
