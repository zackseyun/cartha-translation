  text: Siku zangu hupita kwa kasi kuliko kifaa cha mfumaji[a]; zinakoma bila tumaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha kwa upana kifaa cha mfumaji au kiunzi cha kufumia; wengine hulielewa hasa kuwa shatali ya mfumaji, ambayo huenda haraka huku na huku.
