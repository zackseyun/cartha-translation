lexical_decisions:
- source_word: יָמַי
  choice: Siku zangu
  rationale: Huhifadhi wingi halisi wenye kiambishi cha nafsi ya kwanza, na kueleza ufupi wa maisha ya Ayubu siku baada ya siku.
- source_word: קַלּוּ
  choice: ni zepesi kuliko
  rationale: Kitenzi קלל hapa kina maana ya kuwa mwepesi au kwenda kwa kasi; usemi huu unahifadhi muundo wa ulinganisho wa Kiebrania na picha ya mwendo wa haraka.
- source_word: מִנִּי אָרֶג
  choice: kuliko kitanzi cha mfumaji
  rationale: אֹרֶג inaweza kurejelea chombo cha kufumia; katika picha hii, kitanzi kinachoenda haraka huku na huku kinafaa zaidi kuliko mfumaji mwenyewe au mfumo mzima wa kufumia.
- source_word: וַיִּכְלוּ
  choice: nazo zinafikia mwisho
  rationale: כלה humaanisha kumalizika au kufikia mwisho. Tafsiri hii hudumisha maana ya siku za Ayubu kuisha.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: bila tumaini
  rationale: אפס huonyesha kutokuwapo au ukosefu, na תִּקְוָה ni tumaini; usemi huu ni wa kawaida, mfupi, na sahihi katika Kiswahili.
