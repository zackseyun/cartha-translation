  text: ndipo unanitisha kwa ndoto na unanitia hofu kwa maono[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nawe unanitisha katika ndoto, na kutokana na maono unanitia hofu.” Vihusishi vya Kiebrania vinaweza kutafsiriwa kwa namna rasmi zaidi kuwa “katika/kwa” na “kutokana na.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: ndipo
  rationale: Kiunganishi kinaunganisha kauli hii na malalamiko yaliyotangulia; katika muktadha huu kinaonyesha matokeo au mfuatano, si nyongeza tu.
- source_word: חִתַּתַּנִי
  choice: unanitisha
  rationale: Kitenzi cha Piel chenye kiambishi cha nafsi ya kwanza umoja kinaeleza kusababishwa kwa hofu kubwa; “unanitisha” ni Kiswahili cha kawaida na chenye nguvu bila kudokeza kuvunjwa kimwili.
- source_word: בַּחֲלֹמוֹת
  choice: kwa ndoto
  rationale: Kihusishi ב kinaweza kueleza njia au chombo; “kwa ndoto” kinaonyesha kwamba ndoto ndizo njia ya kumtisha Ayubu.
- source_word: וּמֵחֶזְיֹנוֹת
  choice: na kwa maono
  rationale: Kihusishi מן kinaweza kuonyesha chanzo, huku usambamba wa kishairi ukiruhusu maana ya njia; “na kwa maono” huhifadhi kiunganishi na usambamba kwa Kiswahili cha asili.
- source_word: תְּבַעֲתַנִּי
  choice: kunitia hofu
  rationale: Kitenzi cha Piel kinaashiria kumwingiza mtu katika fadhaa au hofu kali; usemi huu ni wa kawaida na huepuka kurudia “unanitisha” katika vipande vyote viwili.
