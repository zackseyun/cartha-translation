  text: Ninaposema[a], “Kitanda changu kitanifariji; malazi yangu yatabeba malalamiko yangu[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa maana nilisema” au “Nikisema.” Neno la Kiebrania כִּי linaweza kueleweka kwa njia zaidi ya moja hapa; “Ninaposema” linafaa zaidi katika muktadha wa karibu na mpito kwenda mstari unaofuata.
    reason: lexical_alternative
  - marker: b
    text: Au “mawazo yangu” au “tafakari yangu.” Neno la Kiebrania שִׂיחַ linaweza kumaanisha tafakari ya moyoni au maneno ya maombolezo; katika muktadha wa mateso ya Ayubu, “malalamiko” yana uwezekano mkubwa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ninaposema
  rationale: Katika muktadha huu כִּי inaeleweka kwa kawaida kama utangulizi wa hali au wakati wa wazo la Ayubu; tafsiri hii pia inaunganisha vizuri mstari huu na jibu la mstari unaofuata.
- source_word: אָמַרְתִּי
  choice: nasema
  rationale: Ingawa umbo la Kiebrania ni timilifu, hapa linaweza kueleza wazo la ndani linalojirudia; wakati wa sasa ni wa asili katika Kiswahili ndani ya muundo wa “ninaposema.”
- source_word: תְּנַחֲמֵנִי
  choice: kitanifariji
  rationale: Kitenzi נחם katika Piel kinamaanisha kufariji au kutuliza; “kitanifariji” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עַרְשִׂי
  choice: kitanda changu
  rationale: עֶרֶשׂ humaanisha kitanda au kochi; “kitanda” ni neno la kawaida na linafaa mahali pa kupumzikia usiku.
- source_word: יִשָּׂא
  choice: yatasaidia kubeba
  rationale: נשא kimsingi ni kuinua, kuchukua, au kubeba. “Yatasaidia kubeba” huhifadhi sitiari ya mzigo huku ikieleza kwa Kiswahili cha kawaida tumaini kwamba malazi yatapunguza uzito wa huzuni yake.
- source_word: בְשִׂיחִי
  choice: malalamiko yangu
  rationale: שִׂיחַ inaweza kumaanisha tafakari, mawazo yanayotamkwa, au maombolezo/malalamiko. Katika mateso na kilio cha Ayubu, “malalamiko” ndiyo maana inayowezekana zaidi, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: מִשְׁכָּבִי
  choice: malazi yangu
  rationale: מִשְׁכָּב ni mahali pa kulala au kitanda. “Malazi yangu” hudumisha ulinganifu wa kishairi bila kurudia neno “kitanda” sawasawa.
