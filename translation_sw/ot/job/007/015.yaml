translation:
  language: sw
  text: 'basi nafsi yangu huchagua kukabwa[a],

    kifo kuliko mifupa yangu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu ingechagua kusongwa” au “uhai wangu ungechagua kukosa pumzi.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kifo kutoka katika mifupa yangu.” Maana inaonekana kuwa kwamba anapendelea kifo kuliko kuendelea kuishi katika mwili wake unaoteseka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: huchagua
  rationale: Kitenzi בחר humaanisha ‘chagua.’ Hapa hali ya wakati uliopo inadumisha mtiririko wa kishairi bila kulazimisha maana ya masharti; ‘ingechagua’ pia inawezekana kutokana na muktadha.
- source_word: מַחֲנָק
  choice: kusongwa
  rationale: Nomino hii humaanisha kusongwa au kukabwa hadi kukosa pumzi. ‘Kusongwa’ ni ya asili katika Kiswahili na huepuka kuifanya picha hiyo iwe lazima kunyongwa kwa kamba.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. ‘Nafsi yangu’ inadumisha usemi halisi wa Kiebrania na uzito wake wa kishairi.
- source_word: מָוֶת
  choice: kifo
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya מָוֶת.
- source_word: מֵעַצְמוֹתָי
  choice: kuliko mifupa yangu
  rationale: 'Kihalisi ni ‘kutoka katika mifupa yangu,’ lakini מִן hapa inaeleweka kwa maana ya ulinganisho: kifo badala ya kuendelea kuishi katika mwili wake ulioteseka. ‘Mifupa’ imehifadhiwa ili kutoondoa picha ya kishairi.'
