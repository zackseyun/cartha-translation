lexical_decisions:
- source_word: כֵּן
  choice: Ndivyo
  rationale: Huunganisha kauli hii na mfano wa mstari uliotangulia kwa maana ya ulinganisho au hitimisho.
- source_word: הָנְחַ֣לְתִּי לִי
  choice: nilivyogawiwa
  rationale: Umbo la Kiebrania humwonyesha Ayubu kama mpokeaji wa fungu alilopewa; ‘nilivyogawiwa’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo ya kupokea.
- source_word: יַרְחֵי שָׁוְא
  choice: miezi ya ubatili
  rationale: ‘Miezi’ huonyesha kipindi cha muda, na ‘ubatili’ huhifadhi wazo la hali iliyo tupu, bure, au isiyo na manufaa.
- source_word: וְלֵילוֹת עָמָל
  choice: na ... usiku wa taabu
  rationale: ‘Taabu’ inafaa katika maombolezo ya Ayubu na inaweza kujumuisha shida, mateso, au kazi yenye kuchosha bila kuibana maana kwa aina moja tu.
- source_word: מִנּוּ לִי
  choice: kupangiwa
  rationale: Kitenzi cha kutendwa kinaonyesha kwamba usiku huo uliwekwa kuwa fungu la Ayubu; ‘kupangiwa’ ni usemi wa asili unaolingana na ‘nilivyogawiwa’ bila kurudia kitenzi kilekile.
