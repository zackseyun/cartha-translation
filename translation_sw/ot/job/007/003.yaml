  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: sw
  text: Ndivyo nilivyogawiwa miezi ya ubatili[a], na nimepangiwa nyakati za usiku za taabu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miezi ya bure” au “miezi isiyo na maana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nyakati za usiku za shida,” “nyakati za usiku za mateso,” au “nyakati za usiku za kazi ngumu.”
