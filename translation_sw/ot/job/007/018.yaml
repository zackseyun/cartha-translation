  text: hata unamwangalia[a] kila asubuhi na unamchunguza[b] kila wakati?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unamtembelea kila asubuhi.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtembelea, kumwangalia, au kumtilia maanani.
    reason: lexical_alternative
  - marker: b
    text: Au, “unamjaribu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: hata unamwangalia
  rationale: Kitenzi פקד kinaweza kumaanisha kumtembelea, kumwangalia au kumwekea mtu uangalifu. Katika malalamiko ya Ayubu na sambamba na ‘kumchunguza,’ ‘unamwangalia’ kinaonyesha uangalizi wa karibu bila kuufanya moja kwa moja kuwa ziara ya fadhili. ‘Hata’ linaendeleza swali la balagha kutoka mstari uliotangulia.
- source_word: לִבְקָרִים
  choice: kila asubuhi
  rationale: Wingi wa בקרים pamoja na ל unaonyesha tukio linalojirudia; ‘kila asubuhi’ ni Kiswahili cha kawaida chenye maana hiyo.
- source_word: לִרְגָעִים
  choice: kila wakati
  rationale: רגעים humaanisha nyakati fupi au muda wa kitambo. ‘Kila wakati’ ni usemi wa asili unaowasilisha uangalizi usiokoma katika muktadha huu.
- source_word: תִּבְחָנֶנּוּ
  choice: kumchunguza
  rationale: בחן humaanisha kupima au kuchunguza ili kubaini hali ya mtu. ‘Kumchunguza’ linafaa kwa wazo la uchunguzi wa karibu na linaepuka kudokeza jaribu la kumshawishi atende dhambi.
- source_word: ־נּוּ
  choice: m- (yeye)
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kinamrejelea mwanadamu wa mstari uliotangulia; Kiswahili kinakihifadhi kwa kiambishi cha yambwa ‘m-’ katika ‘unamwangalia’ na ‘kumchunguza.’
theological_decisions:
- issue: Toni ya uangalizi wa Mungu
  choice: Matendo ya Mungu yametafsiriwa kama uangalizi na uchunguzi wa karibu unaoendelea, unaohisiwa kuwa mzigo katika malalamiko ya Ayubu.
  alternative: Kuyatafsiri kama ziara ya fadhili au utunzaji wenye faraja pekee.
  rationale: Muktadha wa swali la balagha la Ayubu unaonyesha kuwa uangalizi huo unamsumbua. Tafsiri inahifadhi mvutano huo bila kukataa kwamba פקד katika miktadha mingine inaweza kuwa na maana chanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza swali la mstari uliotangulia; ‘hata’ linaonyesha mwendelezo huo. Lugha imewekwa wazi kwa msomaji wa kawaida huku toni ya malalamiko na uchunguzi usiokoma ikihifadhiwa.
