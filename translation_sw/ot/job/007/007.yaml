  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: sw
  text: Kumbuka kwamba maisha yangu ni pumzi[a]; jicho langu halitarudi tena kuona mema[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maisha yangu ni upepo.” Neno la Kiebrania רוּחַ linaweza kumaanisha “pumzi,” “upepo,” au “roho”; hapa linaonyesha jinsi maisha yanavyopita upesi.
    reason: lexical_alternative
  - marker: b
    text: Au, “jicho langu halitaona mema tena,” yaani, halitapata tena hali njema au ustawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Kumbuka
  rationale: Ni amri ya moja kwa moja kwa Mungu katika muktadha. “Kumbuka” ni ya kawaida, yenye heshima, na huhifadhi nguvu ya ombi bila kuongeza neno lisilokuwamo katika Kiebrania.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa linaanzisha maudhui ya jambo linalopaswa kukumbukwa, si lazima sababu iliyoelezwa wazi.
- source_word: רוּחַ
  choice: pumzi
  rationale: Katika maombolezo haya neno linaonyesha ufupi na hali ya kupita kwa maisha. “Pumzi” ni sitiari ya asili katika Kiswahili, huku “upepo” likibaki jambo linalowezekana.
- source_word: חַיָּי
  choice: maisha yangu
  rationale: Hii ndiyo tafsiri ya kawaida na wazi ya nomino yenye kiambishi cha nafsi ya kwanza umoja.
- source_word: לֹא תָשׁוּב
  choice: halitarudi tena
  rationale: Kitenzi kinakubaliana na “jicho langu.” Neno “tena” linaweka wazi maana ya kurudia iliyomo katika wazo la kurudi, bila kuondoa taswira ya Kiebrania.
- source_word: עֵינִי
  choice: jicho langu
  rationale: Umoja umehifadhiwa kama katika Kiebrania na kama nahau ya kishairi.
- source_word: לִרְאוֹת
  choice: kuona
  rationale: Huhifadhi maana ya msingi huku pia kikiruhusu maana pana ya kupata au kupitia jambo.
- source_word: טוֹב
  choice: mema
  rationale: “Mema” huhifadhi upana wa טוֹב, ambayo inaweza kumaanisha hali njema, furaha, au ustawi, bila kuibana kwa maana moja.
