translation:
  language: sw
  text: Mpaka lini hutauondoa mtazamo wako kwangu, wala hutaniacha hata nipate kumeza mate yangu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutageuza macho yako kutoka kwangu, wala hutaniacha mpaka nimeze mate yangu.” Usemi wa “kumeza mate” unamaanisha muda mfupi sana—hata wa muda wa kufanya tendo hilo.
