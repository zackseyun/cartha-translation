lexical_decisions:
- source_word: כַּמָּה
  choice: Mpaka lini
  rationale: Katika malalamiko, neno hili huuliza muda wa hali inayoendelea; “Mpaka lini” ni Kiswahili cha kawaida na chenye nguvu.
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: hutageuza macho yako kutoka kwangu
  rationale: Kitenzi hapa kinahusu kuuelekeza au kuuondoa mtazamo. Kauli hii inaonyesha ombi la Ayubu kwamba Mungu aache kumkazia macho.
- source_word: תַרְפֵּנִי
  choice: kuniacha
  rationale: Mzizi רפה katika muundo huu una maana ya kulegeza, kuachilia, au kuacha. “Kuniacha” ni ya asili katika Kiswahili na inafaa katika ulinganifu wa kishairi.
- source_word: עַד
  choice: hata
  rationale: Katika muktadha huu inaonyesha mpaka wa muda mfupi unaoombwa; “hata nimeze” huwasilisha kwa kawaida wazo la kupewa nafasi mpaka tendo hilo litendeke.
- source_word: בִּלְעִי רֻקִּי
  choice: nimeze mate yangu
  rationale: Hii huhifadhi taswira halisi na ya wazi ya Kiebrania. Usemi unaonyesha muda mfupi sana.
