base_translation:
  language: en
  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: sw
  text: Nimeyachukia maisha yangu[a]; sitaishi milele. Niache, kwa maana siku zangu ni pumzi tu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimeyakataa” au “Nimeyadharau”; katika Kiebrania yambwa halijatajwa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “pumzi” linaweza pia kumaanisha “mvuke,” likisisitiza jinsi maisha yalivyo mafupi na yasiyodumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: Nimeyachukia maisha yangu
  rationale: Kitenzi מאס humaanisha kukataa, kudharau, au kuchukia. Kiebrania hakitaji yambwa; muktadha wa maombolezo ya Ayubu unawezesha kuongeza “maisha yangu” kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi kutotajwa kwa yambwa katika chanzo.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: sitaishi milele
  rationale: Hii inawasilisha moja kwa moja ukanushi pamoja na wazo la kuishi daima, bila kuigeuza sentensi kuwa tamanio.
- source_word: חֲדַל מִמֶּנִּי
  choice: Niache
  rationale: Amri חדל pamoja na מן ina maana ya kuacha au kujiondoa kwa mtu; “Niache” ni Kiswahili cha kawaida na chenye nguvu katika ombi la Ayubu.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatoa sababu ya ombi lililotangulia.
- source_word: הֶבֶל
  choice: pumzi tu
  rationale: הבל huashiria pumzi au mvuke, na hivyo udhaifu, ufupi na kutodumu. “Pumzi tu” inaweka mbele ufupi wa maisha bila kutumia neno “ubatili,” ambalo lingeweza kupotosha maana hapa.
- source_word: יָמָי
  choice: siku zangu
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya kwanza, ikimaanisha muda wa maisha ya Ayubu.
theological_decisions:
- issue: Yambwa lisilotajwa la מָאַסְתִּי
  choice: Maisha yangu yamewekwa wazi katika matini, na kutotajwa kwa yambwa katika Kiebrania kumeelezwa katika tanbihi.
  alternative: Nimeyachukia / Nimeyakataa
  rationale: Kiswahili huhitaji rejeo lililo wazi zaidi hapa; “maisha yangu” linaendana na muktadha, lakini tanbihi inazuia hitimisho hili lisionekane kana kwamba limetamkwa wazi katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi zinatunza ukali wa maombolezo ya Ayubu. “Niache” ni ya moja kwa moja bila kuwa ya kizamani; “pumzi tu” huonyesha muda mfupi na udhaifu wa maisha.
