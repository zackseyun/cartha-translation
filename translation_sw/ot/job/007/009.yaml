base_translation:
  language: en
  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: sw
  text: Kama wingu linavyofifia na kutoweka, ndivyo mtu anayeshuka kwenda Sheoli[a] hapandi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburini” au “katika makao ya wafu” badala ya “Sheoli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: linavyofifia
  rationale: Kitenzi hiki humaanisha kufikia mwisho au kuisha. Kwa kuwa kiima ni wingu, “kufifia” huonyesha kwa lugha ya kawaida jinsi wingu linavyopoteza umbo na kutoweka.
- source_word: עָנָן
  choice: wingu
  rationale: Hii ndiyo maana ya kawaida ya nomino hiyo, na inadumisha taswira ya ulinganisho.
- source_word: וַיֵּלַךְ
  choice: na kutoweka
  rationale: Kihalisi ni “na likaenda,” lakini katika muktadha wa wingu linalofikia mwisho, “kutoweka” hutoa maana yake ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: כֵּן
  choice: ndivyo
  rationale: Neno hili linaunganisha taswira ya wingu na hali ya mtu anayeshuka Sheoli.
- source_word: יוֹרֵד
  choice: anayeshuka
  rationale: Kitenzi-shirikishi kimetumiwa kama nomino ya jumla kumaanisha mtu yeyote anayeshuka; “anayeshuka” huhifadhi hali hiyo.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Jina la Kiebrania limehifadhiwa katika umbo linalotamkika kwa Kiswahili ili kutolifupisha kuwa “kaburi” wala kulifasiri kikamilifu kuwa “makao ya wafu.”
- source_word: לֹא יַעֲלֶה
  choice: asivyopanda
  rationale: Huhifadhi ukanushaji na taswira ya kuelekea juu, iliyo kinyume na “anayeshuka,” huku ikieleza hali ya jumla katika ulinganisho.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: Neno la asili linaweza kuhusishwa na kaburi au ulimwengu wa wafu. Kulihifadhi kama “Sheoli” huepuka kuchagua kimya kimya fasiri moja nyembamba au kuingiza dhana ya kimadhehebu. Katika muktadha huu, Ayubu anaeleza mwisho wa kifo jinsi unavyoonekana katika maisha ya mwanadamu, bila kutoa maelezo kamili kuhusu ufufuo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “kama ... ndivyo ...” huhifadhi ulinganisho wa Kiebrania; lugha ni rahisi bila kuondoa taswira ya kushuka na kupanda.
