base_translation:
  language: en
  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: sw
  text: Je, mimi ni bahari, au mnyama mkubwa wa baharini[a], hata uniweke chini ya ulinzi[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “joka la baharini” au “nyoka mkubwa.” Neno la Kiebrania tannin humaanisha kiumbe mkubwa wa kutisha, mara nyingi katika taswira ya bahari na machafuko.
    reason: lexical_alternative
  - marker: b
    text: Au, “uniwekee lindo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: Je, mimi ni bahari
  rationale: Kiulizi הֲ pamoja na יָם kinaanzisha swali la balagha. “Bahari” ni tafsiri ya moja kwa moja na huhifadhi taswira ya kishairi ya bahari kama nguvu ya kutisha.
- source_word: אִם
  choice: au
  rationale: 'Hapa אִם inaunganisha vipashio viwili vya swali kwa maana ya uchaguzi: “bahari, au mnyama mkubwa wa baharini.”'
- source_word: תַּנִּין
  choice: mnyama mkubwa wa baharini
  rationale: Neno hili linaweza kumaanisha kiumbe mkubwa na wa kutisha wa baharini, joka, au nyoka. Tafsiri hii huhifadhi taswira bila kulazimisha utambulisho mahususi wa kimitholojia.
- source_word: כִּי
  choice: hata
  rationale: Katika swali hili כִּי linaingiza matokeo yanayolalamikiwa na Ayubu. “Hata” huunganisha kwa kawaida katika Kiswahili swali la balagha na tendo la kuwekwa chini ya uangalizi.
- source_word: תָשִׂים
  choice: ukaweka
  rationale: Kitenzi שׂים humaanisha kuweka au kupanga. “Ukaweka” kinaendeleza muundo wa swali la balagha kwa Kiswahili cha kawaida.
- source_word: עָלַי
  choice: juu yangu
  rationale: Kirai hiki kinaonyesha kwamba uangalizi umeelekezwa juu ya Ayubu; tafsiri ya moja kwa moja pia huhifadhi hisia ya kudhibitiwa.
- source_word: מִשְׁמָר
  choice: ulinzi
  rationale: מִשְׁמָר inaweza kumaanisha ulinzi, uangalizi, au lindo. “Ulinzi” inafaa pamoja na “ukaweka” na haibadili neno hilo kuwa mtu binafsi anayelinda.
theological_decisions:
- issue: Taswira ya תַּנִּין katika lugha ya kishairi kuhusu bahari na machafuko
  choice: mnyama mkubwa wa baharini
  alternative: joka la baharini; nyoka mkubwa
  rationale: Tafsiri inadumisha malalamiko ya Ayubu kwamba anatendewa kama tishio kubwa linalohitaji kudhibitiwa, bila kuongeza mfumo mahususi wa kimitholojia ambao mstari wenyewe hauuelezi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa, na taswira ya kishairi haijaelezwa kupita kiasi.
