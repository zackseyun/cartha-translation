base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: sw
  text: Mimi pia sitauzuia mdomo wangu[a]; nitasema katika dhiki ya roho yangu; nitalalamika[b] katika uchungu wa nafsi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitauzuia kinywa changu.” Kiebrania husema kihalisi kuhusu kutouzuia au kutokunyima kinywa.
    reason: lexical_alternative
  - marker: b
    text: Au, “nitaomboleza” au “nitasema.” Kitenzi cha Kiebrania kinaweza kumaanisha kusema, kutafakari, kuomboleza, au kulalamika kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: pia
  rationale: Neno hili kimsingi lina maana ya nyongeza, ‘pia’ au ‘hata.’ ‘Pia’ linaunganisha kauli hii na yaliyotangulia bila kuongeza kiunganishi cha sababu kisichotajwa wazi.
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: sitauzuia mdomo wangu
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya kutouzuia mdomo, huku ikieleweka kuwa Ayubu hatazuia maneno yake.
- source_word: אֲדַבְּרָה
  choice: nitasema
  rationale: Umbo hili linaonyesha azimio au kusudi la Ayubu la kusema.
- source_word: בְּצַר רוּחִי
  choice: katika dhiki ya roho yangu
  rationale: צַר huonyesha dhiki au taabu kali; ‘roho yangu’ inadumisha neno רוּחַ na hapa linarejelea hali ya ndani ya Ayubu.
- source_word: אָשִׂיחָה
  choice: nitalalamika
  rationale: Katika muktadha huu wa mateso na uchungu, kitenzi kina nguvu ya kusema kwa malalamiko au kuomboleza, ingawa kinaweza pia kumaanisha kusema au kutafakari.
- source_word: בְּמַר נַפְשִׁי
  choice: katika uchungu wa nafsi yangu
  rationale: ‘Uchungu’ huhifadhi taswira ya מַר, na ‘nafsi yangu’ huhifadhi נֶפֶשׁ bila kuifananisha kabisa na רוּחַ.
theological_decisions:
- issue: Maneno ya kianthropolojia רוּחַ na נֶפֶשׁ katika ushairi wa Kiebrania
  choice: Kutafsiri tofauti kama ‘roho’ na ‘nafsi’
  alternative: Kutumia ‘moyo’ au ‘hali yangu ya ndani’ kwa yote mawili
  rationale: Kuweka maneno hayo mawili tofauti kunadumisha ulinganifu na msisitizo wa kishairi bila kulazimisha fundisho maalumu kuhusu sehemu za mwanadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya ‘kuuzuia mdomo’ na tofauti kati ya ‘roho’ na ‘nafsi’ zimehifadhiwa.
