  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֭/עַתָּה נְגִינָתָ֣/ם הָיִ֑יתִי וָ/אֱהִ֖י לָ/הֶ֣ם לְ/מִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/009.yaml
  text: And now I have become their song[b][a], and I am a byword to them.
translation:
  language: sw
  text: Na sasa nimekuwa wimbo wao,[a] nami nimekuwa msemo wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wimbo wao wa dhihaka”—katika muktadha huu, “wimbo wao” huenda ni wimbo wa kumdhihaki.
    reason: lexical_alternative
  - marker: b
    text: Au, “methali yao” au “jambo lao la kuzungumzia”—neno la Kiebrania linaweza kumaanisha neno au msemo unaotumiwa kumhusu mtu, hapa kwa dharau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inaendeleza simulizi huku ikionyesha tofauti kati ya heshima ya Ayubu ya zamani na fedheha yake ya sasa, bila kufanya kiunganishi hicho kiwe na maana nzito kupita kiasi.
- source_word: נְגִינָתָם
  choice: wimbo wao
  rationale: Neno נְגִינָה humaanisha wimbo au muziki, mara nyingi unaohusishwa na ala. Katika muktadha huu Ayubu ndiye mada ya wimbo wa dhihaka; tafsiri ya moja kwa moja inahifadhi taswira hiyo, na maana ya dhihaka imeelezwa katika tanbihi.
- source_word: הָיִיתִי
  choice: nimekuwa
  rationale: Kauli timilifu ya היה hapa inaonyesha hali ya sasa iliyotokana na badiliko lililotokea; Kiswahili 'nimekuwa' huwasilisha jambo hilo kwa kawaida.
- source_word: וָאֱהִי
  choice: nami nimekuwa
  rationale: Inaendeleza kwa usambamba maelezo ya hali ya sasa ya Ayubu. Kurudia 'nimekuwa' ni kwa kawaida na hudumisha muundo wa kishairi wa vifungu viwili.
- source_word: לָהֶם
  choice: wao
  rationale: Uhusiano wa kidativi unaonyesha jinsi Ayubu alivyo katika mtazamo na usemi wao; katika Kiswahili, umilikishi ndani ya 'msemo wao' ni wa kawaida kuliko tafsiri neno kwa neno 'kwao'.
- source_word: לְמִלָּה
  choice: msemo
  rationale: מִלָּה kimsingi ni neno au usemi. Hapa humaanisha usemi unaotumiwa kumhusu Ayubu kwa dharau. 'Msemo' huhifadhi upana huo bila kuifanya lazima iwe methali kamili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wenye vifungu viwili umehifadhiwa; 'wimbo wao' na 'msemo wao' ni lugha rahisi kwa wasomaji wa kawaida, huku tanbihi zikihifadhi maana mbadala na dhihaka iliyodokezwa na muktadha.
