  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: sw
  text: Katika makorongo ya mikondo ya maji ya msimu,[a] wanaishi, katika mashimo ya mavumbi na miongoni mwa miamba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika makorongo ya wadi”; neno la Kiebrania נְחָלִים linaweza kumaanisha mikondo ya maji ya msimu, wadi, au mabonde.
    reason: lexical_alternative
  - marker: b
    text: Au “katika mashimo ya udongo na kwenye majabali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: katika makorongo
  rationale: Neno עָרוּץ huonyesha sehemu iliyochimbika au korongo lililokatwa na maji; “makorongo” ni Kiswahili cha kawaida kinachohifadhi sura hiyo ya kijiografia.
- source_word: נְחָלִים
  choice: ya vijito vya msimu
  rationale: נְחָלִים hapa yaelekea kumaanisha mikondo yenye maji wakati wa mvua na inayoweza kukauka, yaani wadi; “vijito vya msimu” hueleweka kwa urahisi bila kutumia istilahi ya kigeni.
- source_word: לִשְׁכֹּן
  choice: Wanaishi
  rationale: Ingawa Kiebrania kina umbo la kitenzi-jina “kukaa,” katika muktadha huu hutumika kueleza makao yao; kitenzi kamili “wanaishi” ni cha asili katika Kiswahili.
- source_word: חֹרֵי
  choice: mashimo
  rationale: חֹרֵי humaanisha mashimo au matundu; “mashimo” huhifadhi picha ya makao duni bila kuyafanya yaonekane kama mapango makubwa.
- source_word: עָפָר
  choice: udongo
  rationale: עָפָר inaweza kuwa mavumbi, udongo, au ardhi iliyolegea. Katika kirai “mashimo ya…,” “udongo” ni cha asili zaidi kwa Kiswahili huku kikidumisha picha ya hali ya chini.
- source_word: וְכֵפִים
  choice: na katikati ya miamba
  rationale: כֵפִים humaanisha miamba au majabali. Kihusishi “katikati ya” kinaweka wazi maana ya mahali inayodokezwa na muundo wa Kiebrania.
