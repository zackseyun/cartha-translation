  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֤י ט֣וֹב קִ֭וִּיתִי וַ/יָּ֣בֹא רָ֑ע וַֽ/אֲיַחֲלָ֥ה לְ֝/א֗וֹר וַ/יָּ֥בֹא אֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: sw
  text: Kwa maana nilitumaini mema, lakini mabaya[a] yakaja; nilingojea nuru, lakini giza likaja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafa” au “madhara”; hapa neno la Kiebrania huenda linamaanisha hali mbaya iliyompata mtu, si uovu wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au maelezo yanayoendeleza maombolezo ya Ayubu katika muktadha.
- source_word: טוֹב
  choice: mema
  rationale: Kivumishi hiki kimetumika kama nomino kuonyesha mambo yaliyo mazuri au yenye manufaa, bila kufafanua kupita kiasi kuwa ni ustawi wa mali.
- source_word: קִוִּיתִי
  choice: nilitumaini
  rationale: Kitenzi kinaeleza matarajio yenye tumaini; tafsiri hii ni ya kawaida na inafaa pamoja na “mema.”
- source_word: וַיָּבֹא
  choice: yakaja / likaja
  rationale: Kitenzi kilekile kimerudiwa katika Kiebrania; “kuja” huhifadhi urudiaji na mgeuko mkali wa matarajio, huku upatanisho wa kisarufi wa Kiswahili ukihitaji maumbo tofauti.
- source_word: רָע
  choice: mabaya
  rationale: Huhifadhi ulinganifu wa moja kwa moja na “mema,” huku muktadha ukionyesha kuwa maana hapa ni madhara au maafa, si lazima uovu wa kimaadili.
- source_word: אֲיַחֲלָה
  choice: nilingojea
  rationale: Kitenzi kina maana ya kungoja kwa matarajio au tumaini; “nilingojea” hutofautisha kwa kawaida na kitenzi cha kwanza bila kupoteza wazo la matarajio.
- source_word: לְאוֹר
  choice: nuru
  rationale: Taswira ya nuru imehifadhiwa bila kuifasiri kuwa nafuu au wokovu, hivyo kubakiza upana wake wa kishairi.
- source_word: אֹפֶל
  choice: giza
  rationale: Hutoa kinyume cha wazi na “nuru” kwa Kiswahili cha kawaida na chenye hadhi; neno la Kiebrania linaweza pia kumaanisha giza zito.
theological_decisions:
- issue: Maana ya רָע katika maombolezo haya
  choice: mabaya, kwa tanbihi inayoeleza maana ya maafa au madhara
  alternative: maafa / mabaya ya kimaadili
  rationale: Tafsiri hii huhifadhi ulinganifu wa kishairi kati ya mema na mabaya bila kulazimisha maana ya uovu wa kimaadili; muktadha wa Ayubu unaelekeza zaidi kwenye janga au madhara yaliyompata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba na urudiaji wa “likaja/yakaja” umehifadhiwa ili kuonyesha ushairi na mgeuko mkali wa matarajio.
