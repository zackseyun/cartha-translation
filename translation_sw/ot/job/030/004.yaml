lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: wanaochuma
  rationale: Kitenzi קטף humaanisha kuchuma au kukwanyua mimea; “wanaochuma” kinahifadhi tendo halisi la kutafuta chakula na muundo wa kirai endelevu.
- source_word: מַלּוּחַ
  choice: mmea wa chumvi
  rationale: Jina hili la mmea halina uhakika, lakini huenda linarejelea mmea wa porini unaostahimili udongo wenye chumvi. Maelezo haya yanaeleweka kwa msomaji wa Kiswahili bila kudai utambulisho wa kisayansi usio na hakika.
- source_word: עֲלֵי שִׂיחַ
  choice: katikati ya vichaka
  rationale: Katika muktadha huu על inaeleza mahali wanapochuma mimea, yaani katika eneo la vichaka. Usemi huu ni wa asili katika Kiswahili na unahifadhi picha ya kutafuta chakula porini.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: na mizizi ya vichaka vya mretemu
  rationale: רְתָמִים ni kichaka cha jangwani kinachojulikana kama broom kwa Kiingereza. “Mretemu” linaendeleza jina la mmea wa kibiblia, huku “vichaka” likifafanua aina yake. Wingi “mizizi” unawasilisha kwa Kiswahili maana ya jumla ya umoja wa Kiebrania.
- source_word: לַחְמָם
  choice: ndiyo chakula chao
  rationale: Ingawa לֶחֶם kwa msingi ni “mkate,” mara nyingi humaanisha chakula au riziki kwa ujumla. Hapa mizizi si mkate uliookwa, bali chakula cha kujikimu.
