  text: Natembea nikiwa na sura yenye giza[a], si kwa sababu ya jua[b]; ninasimama katika kusanyiko na kulilia msaada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikiwa na huzuni” au “nikiwa mweusi.” Neno la Kiebrania linaweza kudokeza kuomboleza na pia mwonekano wenye giza au weusi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “bila jua.” Maana yaelekea kuwa hali yake ya giza haikusababishwa na jua.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: nikiwa nimekuwa mweusi
  rationale: Kitenzi hiki kinaweza kueleza hali ya kuwa na sura nyeusi au yenye giza, na pia kuomboleza. Tafsiri hii inadumisha taswira ya nje bila kuondoa kabisa maana ya huzuni.
- source_word: הִלַּכְתִּי
  choice: Natembea
  rationale: Ingawa umbo la Kiebrania ni timilifu, katika maombolezo ya kishairi linaeleza hali inayoendelea; wakati wa sasa unasikika kwa kawaida katika Kiswahili.
- source_word: בְּלֹא חַמָּה
  choice: lakini si kwa sababu ya jua
  rationale: Kihalisi ni ‘bila jua.’ Katika muktadha, kirai hiki kinatofautisha hali yake ya kuwa mweusi na weusi unaotokana na jua, huku tanbihi ikihifadhi muundo halisi.
- source_word: קַמְתִּי
  choice: ninasimama
  rationale: Hueleza tendo la Ayubu kusimama hadharani mbele ya jamii; wakati wa sasa unalingana na mtindo hai wa maombolezo.
- source_word: בַקָּהָל
  choice: katika kusanyiko
  rationale: Neno קהל humaanisha kundi lililokusanyika; ‘kusanyiko’ ni pana na halileti maana maalumu ya dhehebu.
- source_word: אֲשַׁוֵּעַ
  choice: kulilia msaada
  rationale: Mzizi שוע hapa huonyesha kilio cha dhiki kinachoomba msaada, si kupaza sauti tu.
