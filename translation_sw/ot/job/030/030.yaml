  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
translation:
  language: sw
  text: Ngozi yangu imekuwa nyeusi, nayo inabanduka[a] kutoka mwilini mwangu; mifupa yangu inaungua kwa joto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ngozi yangu imekuwa nyeusi juu yangu”; usemi wa Kiebrania unaweza kueleza ngozi inayokuwa nyeusi na kubanduka, au inayoning’inia mwilini ikiwa imekuwa nyeusi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mifupa yangu inaungua kwa homa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: ngozi yangu
  rationale: Katika muktadha wa mwili wa mwanadamu, עוֹר humaanisha kwa kawaida ngozi; hili ndilo neno la asili na linaloeleweka katika Kiswahili cha sasa.
- source_word: שָׁחַר
  choice: imekuwa nyeusi
  rationale: Kitenzi hiki hapa kinaeleza ngozi kuwa nyeusi au kutiwa giza; 'imekuwa nyeusi' huhifadhi maana ya hali iliyotokea.
- source_word: מֵעָלָי
  choice: na kunidondoka
  rationale: Kihalisi ni 'kutoka juu yangu.' Katika muktadha wa ngozi iliyoathiriwa, tafsiri hii inaeleza uwezekano wa ngozi kujitenga na kudondoka, huku tanbihi ikihifadhi utata wa Kiebrania.
- source_word: וְעַצְמִי
  choice: na mifupa yangu
  rationale: Ingawa umbo la Kiebrania ni umoja, עֶצֶם linaweza kutumiwa kwa maana ya jumla; 'mifupa yangu' ni Kiswahili cha kawaida katika kauli hii kuhusu mwili.
- source_word: חָרָה
  choice: inaungua
  rationale: Kitenzi חרה hubeba taswira ya kuwaka au kuwa na joto kali; 'inaungua' huhifadhi taswira hiyo yenye nguvu.
- source_word: מִנִּי
  choice: kwa
  rationale: Ingawa kihalisi huweza kuwa 'kutokana na,' hapa linaonyesha sababu au hali inayoandamana na kuungua; 'kwa joto' ni usemi wa kawaida.
- source_word: חֹרֶב
  choice: joto
  rationale: חֹרֶב huashiria joto au ukavu mkali. 'Joto' ni tafsiri pana na salama kuliko 'homa,' ambayo ni ya kufasiri zaidi.
