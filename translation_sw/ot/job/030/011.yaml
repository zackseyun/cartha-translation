  text: Kwa sababu ameilegeza kamba yake na kunitesa[a], wameacha kujizuia mbele yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameilegeza uzi wa upinde wake na kunitesa.” Neno la Kiebrania linaweza kumaanisha hasa uzi wa upinde badala ya kamba kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu: “wameziachia hatamu kutoka mbele yangu”; yaani, wameacha kujizuia katika uwepo wangu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa sababu
  rationale: Inaonyesha sababu ya dhihaka na uadui unaoelezwa katika muktadha.
- source_word: יִתְרוֹ
  choice: kamba yake
  rationale: Neno la Kiebrania linaweza kumaanisha kamba kwa ujumla au hasa uzi wa upinde; “kamba” inadumisha sitiari bila kuibainisha kupita kiasi.
- source_word: פִּתַּח
  choice: amefungua
  rationale: Kwa kitu kama kamba, kitenzi kinaweza kueleza kuifungua au kuilegeza; “amefungua” kinadumisha maana ya msingi na kinaeleweka kwa kawaida.
- source_word: וַיְעַנֵּנִי
  choice: na kunitesa
  rationale: Hapa kitenzi kinatokana na ענה II, yaani kutesa au kunyenyekeza, si ענה I, “kujibu.” Muktadha unahusu mateso na fedheha ya Ayubu.
- source_word: וְרֶסֶן
  choice: hatamu
  rationale: Neno linataja kifaa halisi cha kumdhibiti mnyama na pia linabeba wazo la kujizuia; taswira halisi imehifadhiwa katika matini.
- source_word: מִפָּנַי
  choice: mbele yangu
  rationale: Inaonyesha jambo linalofanywa katika uwepo wa Ayubu, bila haya na likimlenga.
- source_word: שִׁלֵּחוּ
  choice: wamejitupilia mbali
  rationale: Pamoja na “hatamu,” kauli hii ina maana ya kuziacha au kuzitupilia mbali, yaani kuondoa kila kizuizi.
theological_decisions:
- issue: Mhusika wa umoja katika “amefungua ... na kunitesa”
  choice: Kiwakilishi hakijaongezwa; kitenzi cha Kiswahili kimeachwa na kiambishi cha nafsi ya tatu pekee.
  alternative: Kutaja wazi “Mungu.”
  rationale: Kiebrania hakitaji mhusika kwa jina katika mstari huu. Muktadha unaweza kuelekeza kwa Mungu, lakini kumtaja moja kwa moja kungeondoa kiwango cha kutokubainika kilichomo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira za “kamba” na “hatamu” zimehifadhiwa, huku tanbihi zikieleza maana mbadala na matumizi ya kiistiari.
