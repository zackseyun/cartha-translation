  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: sw
  text: Kwa nguvu nyingi, vazi langu limebadilishwa[a]; kama shingo ya kanzu yangu, linanibana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vazi langu umbo lake limeharibishwa”; huenda pia, “ananyakua vazi langu.” Kitenzi cha Kiebrania hapa ni kigumu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kama kinywa/uwazi wa kanzu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רָב כֹּחַ
  choice: Kwa nguvu nyingi
  rationale: Muundo huu unaeleza nguvu au kiwango kikubwa ambacho tendo linafanyika, na ni wa asili katika Kiswahili.
- source_word: יִתְחַפֵּשׂ
  choice: limebadilishwa
  rationale: Kitenzi hiki ni kigumu na kinaweza kumaanisha kubadilishwa au kuharibishwa umbo. 'Limebadilishwa' huhifadhi upana wa maana bila kulazimisha tafsiri moja yenye uhakika usiokuwapo.
- source_word: לְבוּשִׁי
  choice: vazi langu
  rationale: '''Vazi'' huhifadhi umoja na taswira ya nguo, huku likilingana vizuri na ''kanzu yangu'' katika mstari unaofuata.'
- source_word: כְּפִי
  choice: kama shingo ya
  rationale: Neno kwa neno ni 'kama kinywa/uwazi wa.' Katika muktadha wa nguo, 'shingo ya' ni Kiswahili cha kawaida kwa uwazi wa juu wa vazi.
- source_word: כֻתָּנְתִּי
  choice: kanzu yangu
  rationale: כֻּתֹּנֶת ni vazi refu la aina ya tuniki; 'kanzu' ni neno linaloeleweka katika Kiswahili cha Afrika Mashariki na linafaa kwa taswira hiyo.
- source_word: יַאַזְרֵנִי
  choice: linanibana
  rationale: Mzizi אזר humaanisha kujifunga au kuzungushia. Katika taswira ya vazi linalombana Ayubu, 'linanibana' huwasilisha hali ya kufungwa kwa lugha ya kawaida na yenye nguvu.
