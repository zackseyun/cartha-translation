base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: sw
  text: Vitisho vimenigeukia; vinaifukuza hadhi yangu[a] kama upepo, na wokovu wangu[b] unapita kama wingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “heshima yangu,” “hali yangu ya juu,” au “uungwana wangu.” Neno la Kiebrania linahusu hali ya juu au yenye kuheshimiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kuokolewa kwangu” au “hali yangu njema.” Neno la Kiebrania linaweza kumaanisha kuokolewa au ustawi, pamoja na wokovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ עָלַי
  choice: vimenigeukia
  rationale: Kitenzi cha Hophal kinaonyesha kugeuzwa au kugeukia kwa hali dhidi ya Ayubu. Kiswahili ‘vimenigeukia’ ni cha asili na huwasilisha kwamba vitisho sasa vimemwelekea kwa uadui.
- source_word: בַּלָּהוֹת
  choice: vitisho
  rationale: Neno hili humaanisha mambo ya kutisha au hofu kuu; ‘vitisho’ ni fupi, wazi, na lina nguvu inayofaa katika kilio hiki.
- source_word: תִּרְדֹּף
  choice: vinaifukuza
  rationale: רדף humaanisha kufuatilia, kuandama, au kufukuza. Umbo la umoja wa kike linaweza kuirejelea nomino ya wingi kama mkusanyiko; Kiswahili kinatumia upatanisho wa wingi kwa ‘vitisho.’
- source_word: כָּרוּחַ
  choice: kama upepo
  rationale: רוּחַ hapa linaeleweka kwa kawaida kuwa ‘upepo,’ likisisitiza nguvu na kutodumu, sambamba na mfano wa wingu.
- source_word: נְדִבָתִי
  choice: hadhi yangu
  rationale: Neno gumu lenye wazo la hali ya juu, heshima, au uungwana. ‘Hadhi yangu’ linafaa katika maombolezo ya Ayubu kuhusu kupoteza hali yake yenye kuheshimiwa, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: וּכְעָב
  choice: kama wingu
  rationale: עָב ni wingu, wakati mwingine wingu zito; ‘wingu’ linatosha na ni la kawaida katika tashbihi hii.
- source_word: עָבְרָה
  choice: unapita
  rationale: עבר hapa huonyesha kupita au kutoweka. Wakati wa sasa wa kishairi unaweka tukio mbele ya msomaji na kuendana na ‘vinaifukuza.’
- source_word: יְשֻׁעָתִי
  choice: wokovu wangu
  rationale: יְשׁוּעָה linaweza kumaanisha wokovu, ukombozi, kuokolewa, au hali njema. ‘Wokovu wangu’ huhifadhi uhusiano wa kileksia bila kufunga maana ya muktadha; mbadala umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Hatari ya kulipa יְשֻׁעָתִי maana maalumu ya kimafundisho isiyolazimishwa na muktadha
  choice: wokovu wangu
  alternative: kuokolewa kwangu; hali yangu njema
  rationale: Katika muktadha huu neno linaweza kumaanisha kuokolewa binafsi au ustawi, si lazima wokovu kwa maana maalumu ya baadaye ya kimafundisho. Tanbihi inadumisha upana huo.
- issue: Maana ya נְדִבָתִי katika maombolezo ya Ayubu
  choice: hadhi yangu
  alternative: heshima yangu; hali yangu ya juu; uungwana wangu
  rationale: Neno linaweza kuonyesha heshima au cheo cha juu. ‘Hadhi’ halilazimishi maana ya tabia ya ukarimu wala cheo rasmi, na hivyo linahifadhi utata wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari miwili, tashbihi za upepo na wingu, na utata wa maneno נְדִבָתִי na יְשֻׁעָתִי vimehifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa.
