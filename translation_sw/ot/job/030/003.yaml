  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: sw
  text: Kwa ukosefu na njaa wamekonda; wakikwaruza ardhi kavu usiku[a], katika ukiwa na uharibifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania אֶמֶשׁ mara nyingi humaanisha “jana” au “usiku uliopita”; hapa limetafsiriwa “usiku” kwa kufuata muktadha wa kishairi.
    reason: lexical_alternative
  - marker: b
    text: Maneno kadhaa katika mstari huu ni adimu na magumu. Kitenzi kilichotafsiriwa “wakikwaruza” hufasiriwa pia “wakila kwa kutafuna,” “wakisaka,” au “wakikimbilia.” Pia, “usiku” inaweza kueleweka “jana” au “usiku uliopita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: Kwa kukosa na kwa njaa
  rationale: Viambishi בְּ vinaonyesha hali au mazingira yao. “Kukosa” na “njaa” ni Kiswahili cha kawaida kinachoeleza upungufu na ukosefu wa chakula.
- source_word: גַּלְמוּד
  choice: wamekonda
  rationale: Neno hili ni adimu; katika muktadha linaelekea kueleza kudhoofika au kukauka kwa mwili kwa sababu ya njaa. “Wamekonda” ni la kawaida na linafaa kwa watu.
- source_word: הָעֹרְקִים
  choice: wanatafuta chakula
  rationale: Umbo hili ni gumu na maana yake hapa haina uhakika. Muktadha wa mstari unaofuata unaonyesha watu wanaotafuta kwa shida kitu cha kula nyikani; tafsiri hii huepuka picha isiyo ya kawaida ya ‘kuitafuna ardhi’ huku ikihifadhi maana ya kutafuta riziki kwa dhiki.
- source_word: צִיָּה
  choice: katika nchi kavu
  rationale: צִיָּה huonyesha eneo kavu au lililokauka. Kirai hiki kinahifadhi taswira halisi ya mazingira makavu.
- source_word: אֶמֶשׁ
  choice: usiku
  rationale: Kwa kawaida neno hili linaweza kumaanisha ‘jana’ au ‘usiku uliopita,’ lakini hapa maana ya wakati wa usiku inafaa katika muktadha wa kishairi. Utata umeonyeshwa katika tanbihi.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: mahali pa ukiwa na uharibifu
  rationale: Maneno haya yanayofanana yanaimarisha picha ya eneo lililo tupu, lililoharibiwa na lisilofaa kukaliwa.
