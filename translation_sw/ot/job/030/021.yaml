  text: Umegeuka ukawa mkatili kwangu[a]; kwa nguvu ya mkono wako unanipinga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umekuwa asiye na huruma kwangu.”
