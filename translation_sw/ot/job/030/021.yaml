lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: Umegeuka ukawa
  rationale: Nifali ya הפך inaonyesha badiliko la hali. Kiswahili hiki ni cha asili na kinahifadhi wazo la kwamba mtazamo au matendo kwa Ayubu yamebadilika.
- source_word: לְאַכְזָר
  choice: mkatili
  rationale: אַכְזָר humaanisha mwenye ukatili au asiye na huruma. “Mkatili” ni neno la moja kwa moja na lenye uzito unaofaa katika malalamiko haya.
- source_word: לִי
  choice: kwangu
  rationale: Huhifadhi uhusiano unaoelekezwa kwa Ayubu bila kuongeza mapema maana ya “dhidi yangu,” ambayo tayari inaonekana katika muktadha.
- source_word: בְּעֹצֶם
  choice: kwa nguvu za
  rationale: עֹצֶם hapa huonyesha nguvu au uwezo, na בְּ ina maana ya chombo au namna. “Kwa nguvu za” ni usemi wa kawaida wa Kiswahili.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Taswira halisi ya mkono imehifadhiwa badala ya kufasiriwa tu kuwa “uwezo wako,” ili kudumisha lugha hai ya Kiebrania.
- source_word: תִשְׂטְמֵנִי
  choice: unanipinga
  rationale: Kitenzi שׂטם huonyesha uadui, upinzani, au shambulio. “Unanipinga” huhifadhi maana pana ya kutenda kwa uadui bila kulazimisha wazo la kufuatilia kwa muda mrefu linaloweza kudokezwa na “unanitesa.”
theological_decisions:
- issue: Maelezo ya Mungu kwa lugha ya kibinadamu na shtaka la moja kwa moja
  choice: Kuhifadhi nafsi ya pili, shtaka “umekuwa mkatili kwangu,” na taswira “mkono wako.”
  alternative: Kulainisha kwa kusema, kwa mfano, “nguvu zako ziko dhidi yangu.”
  rationale: Ayubu anamwelekea Mungu moja kwa moja kwa lugha kali ya maombolezo. Tafsiri haipaswi kupunguza mvutano huo wa kiteolojia wala kuondoa taswira ya chanzo.
- issue: Kiwango cha uadui katika תִשְׂטְמֵנִי
  choice: unanipinga
  alternative: unanitesa / unanishambulia
  rationale: Neno la chanzo linaweza kuonyesha uadui wenye matendo, lakini halibainishi bila shaka mateso ya muda mrefu au shambulio moja mahsusi. “Unanipinga” huhifadhi upana huo; tanbihi inataja uwezekano wenye nguvu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi wa vipande viwili umehifadhiwa; lugha ni ya moja kwa moja na haipunguzi ukali wa malalamiko ya Ayubu.
