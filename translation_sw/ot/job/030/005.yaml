lexical_decisions:
- source_word: מִן־גֵּו
  choice: kutoka bondeni
  rationale: מִן huonyesha mahali wanakotolewa, na גֵּו hapa inaelekea kumaanisha bonde au korongo katika mazingira ya makazi ya ukiwa yanayotajwa katika muktadha.
- source_word: יְגֹרָשׁוּ
  choice: wanafukuzwa
  rationale: Umbo hili linaonyesha kufukuzwa kwa nguvu; kauli tendwa inadumisha mkazo wa Kiebrania juu ya jambo linalowatendekea.
- source_word: יָרִיעוּ
  choice: watu wanapigia kelele
  rationale: Kitenzi humaanisha kupaza sauti au kupiga kelele. Kwa kuwa mtendaji hajasemwa wazi katika Kiebrania, 'watu' hutumiwa kama kiima kisichotajwa maalumu kwa Kiswahili cha kawaida.
- source_word: עָלֵימוֹ
  choice: wanawapigia kelele
  rationale: עַל pamoja na kitenzi cha kupiga kelele huonyesha mwelekeo wa kilio cha uhasama dhidi yao.
- source_word: כַּגַּנָּב
  choice: kama mwizi
  rationale: 'כְּ huanzisha ulinganisho: wanapigiwa kelele kama vile mwizi anavyopigiwa kelele.'
