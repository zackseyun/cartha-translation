  naturalness: “Wanabiringika” ni ya asili na yenye nguvu katika Kiswahili cha kishairi. “Kama mwanya mpana, wanakuja” ni taswira ya kishairi inayokubalika na inafuata simile ya Kiebrania. “Katikati ya maangamizi” ni usemi wa kawaida zaidi kuliko “katikati ya kishindo cha maangamizi.”
