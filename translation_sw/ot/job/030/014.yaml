  text: Kama mwanya mpana, wanakuja[a]; katikati ya maangamizi wanabiringika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanakuja kana kwamba kupitia mwanya mpana; chini ya maangamizi wanajiviringisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/פֶרֶץ
  choice: kama ufa
  rationale: פֶרֶץ ni ufa au mwanya uliovunjwa, hasa katika ukuta; kiambishi כְּ kinaonyesha ulinganisho. “Kama ufa” kinahifadhi picha ya uvunjaji bila kuongeza wazi wazo la kupita ndani yake.
- source_word: רָחָב
  choice: mpana
  rationale: Kivumishi hiki kinaeleza ukubwa wa ufa. “Mpana” ni Kiswahili cha kawaida na chenye picha halisi.
- source_word: יֶאֱתָיוּ
  choice: wanakuja
  rationale: Kitenzi kina maana ya kuja au kusonga mbele. “Wanakuja” kinadumisha usemi wa kishairi ulio wazi bila kufasiri kupita kiasi.
- source_word: תַּחַת
  choice: katikati ya
  rationale: Ingawa kwa kawaida humaanisha “chini ya,” hapa kinaweza kueleza mazingira ambamo mwendo unatokea. “Katikati ya” ni cha asili katika Kiswahili; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: שֹׁאָה
  choice: kishindo cha maangamizi
  rationale: Neno linaweza kumaanisha uharibifu, maangamizi, au kishindo cha kuanguka. Kauli hii inadumisha kwa pamoja tukio la ghafla na matokeo yake ya uharibifu.
- source_word: הִתְגַּלְגָּלוּ
  choice: wanabiringika mbele
  rationale: Hitpaeli ya גלל inaonyesha kujiviringisha, kubingirika, au kusonga kwa mfululizo. “Wanabiringika mbele” kinatoa picha ya mwendo wenye nguvu usiozuilika.
