  text: Even the strength of their hands—what is it to me? Their vigor has perished[a].
translation:
  language: sw
  text: Hata nguvu za mikono yao zina faida gani kwangu? Nguvu zao za ukomavu zimepotea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu zao kamili zimepotea.” Nomino ya Kiebrania inayotumiwa hapa ni adimu, na inaweza kurejelea ukomavu, kilele cha maisha, au nguvu kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Hata
  rationale: Linaonyesha hoja nyingine ya dharau yenye mkazo, kwa namna ya kawaida katika Kiswahili.
- source_word: כֹּחַ יְדֵיהֶם
  choice: nguvu za mikono yao
  rationale: Taswira halisi ya mikono imehifadhiwa; hapa inamaanisha uwezo wao wa kufanya kazi.
- source_word: לָמָה לִּי
  choice: zina faida gani kwangu?
  rationale: Hili ni swali la balagha linaloonyesha kwamba uwezo wao haumsaidii Ayubu; tafsiri hii ni ya asili kuliko kufuata muundo wa Kiebrania neno kwa neno.
- source_word: עָלֵימוֹ אָבַד
  choice: zao ... zimepotea
  rationale: Kiwakilishi kimehusishwa na nomino inayofuata kwa mujibu wa sintaksia ya kishairi, na אָבַד limetafsiriwa kama kupotea kabisa.
- source_word: כָּלַח
  choice: nguvu ... za ujana
  rationale: Nomino hii adimu huenda inamaanisha nguvu kamili za umri wa kustawi; kifungu hiki kinaeleweka kwa wasomaji wa kawaida huku tanbihi ikihifadhi uwezekano wa maana nyingine.
