translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limewasilishwa kwa lugha ya kawaida; taswira ya “mikono” na utata wa nomino adimu כָּלַח vimehifadhiwa.
