  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kiebrania: kiunganishi na alama ya wakati («Na sasa»), taswira ya nafsi kumwagika, na «siku za taabu» zinazomshika msemaji. «Ndani yangu» ni ufasiri wa kiidiomu wa עָלַי unaolingana na mkondo wa ukaguzi wa Kiingereza, huku maana ya mahali ya «juu yangu» ikihifadhiwa kwa tanbihi.'
  naturalness: Kiswahili ni sanifu, cha kishairi, na kinaeleweka. «Nafsi yangu inamwagika ndani yangu» huhifadhi taswira ya kudhoofika kwa ndani bila kugeuza mstari kuwa maelezo ya kawaida. «Siku za taabu zinanishika» ina nguvu ya kishairi inayofaa muktadha wa Ayubu.
  terminology: «Nafsi», «taabu», na «kunishika» ni chaguo sahihi na yasiyo finyu kwa נַפְשִׁי, עֹנִי, na יֹאחֲזוּנִי. Tanbihi inataja kwa usahihi mbadala wa kihalisi wa kihusishi bila kudai tafsiri moja kuwa ya lazima.
