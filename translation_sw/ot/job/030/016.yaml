base_translation:
  language: en
  yaml_path: translation/ot/job/030/016.yaml
  text: And now my soul is poured out within me[a]; days of affliction seize me.
translation:
  language: sw
  text: Na sasa nafsi yangu inamwagika ndani yangu[a]; siku za taabu zinanishika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu inamwagika juu yangu.” Kihusishi cha Kiebrania kwa maana halisi ni “juu yangu,” lakini huenda usemi huu unaeleza kudhoofika kwa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi na alama ya wakati bila kulazimisha maana ya upinzani iliyo wazi zaidi katika ‘Lakini sasa’.
- source_word: עָלַי
  choice: ndani yangu
  rationale: Ingawa kihusishi kwa kawaida ni ‘juu yangu,’ katika tamathali hii Kiswahili cha kawaida hutumia ‘ndani yangu’ kueleza kudhoofika kwa utu wa ndani; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: תִּשְׁתַּפֵּךְ
  choice: inamwagika
  rationale: Inahifadhi picha ya kishairi ya kumiminika au kuishiwa badala ya kuibadili kuwa ufafanuzi kama ‘inadhoofika’.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: ‘Nafsi’ huhifadhi upana wa נֶפֶשׁ kama utu wa ndani au uhai, na inafaa kwa sajili ya kishairi ya Ayubu.
- source_word: יֹאחֲזוּנִי
  choice: zinanishika
  rationale: Kitenzi אחז humaanisha kushika au kukamata. ‘Zinanishika’ ni cha kawaida na bado kinaonyesha taabu zinazomtawala msemaji.
- source_word: יְמֵי
  choice: siku za
  rationale: Inawakilisha umbo la muunganiko wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: עֹנִי
  choice: taabu
  rationale: Katika muktadha huu neno linahusu mateso, dhiki, na unyonge kwa ujumla, si umaskini wa kiuchumi pekee; ‘taabu’ ni pana na ya kawaida.
theological_decisions: []
