  terminology: “Kundi la watu duni” huhifadhi dharau ya nomino ya pamoja bila maana finyu ya jinai inayoweza kusikika katika “genge.” “Maangamizi” na “njia” huhifadhi msamiati wa maafa na wa barabara/ujenzi wa matini ya chanzo.
