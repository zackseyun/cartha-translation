base_translation:
  language: en
  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: sw
  text: Upande wangu wa kulia, kundi la watu duni linainuka[a]; wanaisukuma miguu yangu mbali[b], nao wanajenga dhidi yangu njia za maangamizi yao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kundi la wahuni linainuka.” Neno la Kiebrania פִּרְחַח ni adimu na huweza kumaanisha kundi linalodharauliwa au lisilo na nidhamu.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “wanaituma miguu yangu mbali.” Maana inaweza kuwa kwamba wanaiondoa miguu yangu kwenye njia au wananikwaza.
    reason: lexical_alternative
  - marker: c
    text: Au, “wananiinulia njia za msiba wao.” Kiebrania kinadumisha sitiari ya kujenga barabara katika maana ya uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: Upande wangu wa kulia
  rationale: Kirai hiki kinaonyesha mahali ambapo washambuliaji wanajiweka. Kiwakilishi cha nafsi kimewekwa wazi kwa Kiswahili cha kawaida kulingana na muktadha wa Ayubu.
- source_word: פִּרְחַח
  choice: genge
  rationale: Neno hili adimu linaashiria kundi linalodharauliwa au lisilo na nidhamu. “Genge” ni la mkusanyiko, lina ladha ya kudharau, na halilazimishi maana mahususi ya umri.
- source_word: יָקוּמוּ
  choice: linainuka
  rationale: Kitenzi קום hapa kinaonyesha kuinuka au kujipanga kwa uhasama; umoja unapatana na nomino ya mkusanyiko “genge.”
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: wanaiondoa miguu yangu mahali pake
  rationale: Kiebrania ni kigumu na kwa karibu husema ‘wanaituma/kuiachia miguu yangu.’ Tafsiri hii inadumisha picha ya kuondolewa kwa miguu au uthabiti bila kuamua kimya kimya kama wanamkwaza au wanamfukuza.
- source_word: וַיָּסֹלּוּ
  choice: wanajenga
  rationale: סלל hutumiwa kwa kujenga au kuinua barabara. “Wanajenga” inadumisha sitiari ya utengenezaji wa njia kwa kusudi la uhasama.
- source_word: עָלַי
  choice: dhidi yangu
  rationale: Katika muktadha huu wa mashambulizi, uhusiano ni wa uhasama, si wa mahali tu.
- source_word: אָרְחוֹת אֵידָם
  choice: njia za maangamizi yao
  rationale: Tafsiri hii inadumisha ‘njia’ na kiambishi cha nafsi ya tatu wingi katika אֵידָם. Haifafanui kupita kiasi ikiwa maangamizi hayo ni yale wanayoleta au yanayowahusu.
