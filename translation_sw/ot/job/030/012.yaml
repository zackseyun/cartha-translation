    rationale: Kwa Kiswahili cha sasa neno hili mara nyingi hudokeza kundi la wahalifu. Neno la Kiebrania ni la dharau kwa kundi lisiloelezwa kwa usahihi, si lazima genge la jinai.
  - severity: low
