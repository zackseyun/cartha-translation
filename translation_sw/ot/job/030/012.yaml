  source_fidelity: 'Tafsiri ya rasimu kwa jumla hufuata muundo wa Kiebrania: mahali pa upande wa kulia, kundi la kudharauliwa, kuondoshwa kwa miguu, na sitiari ya kuinua njia dhidi ya Ayubu. Hata hivyo, “mahali pake” katika kirai cha miguu huongeza maelezo ambayo hayamo katika matini na hufanya usemi usio wa kawaida. “Genge” pia huweza kudokeza kwa lazima kundi la wahalifu wa kisasa, ilhali פִּרְחַח ni neno adimu lenye dharau lakini maana yake mahsusi haijathibitika.'
