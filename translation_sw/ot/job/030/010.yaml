  yaml_path: translation/ot/job/030/010.yaml
  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: sw
  text: Wananichukia sana; wanajiweka mbali nami, wala hawajizuii kutema mate mbele yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: wananichukia kabisa
  rationale: Kitenzi תעב kinaonyesha karaha na chuki kali. Kiswahili hiki kinawasilisha uzito huo kwa lugha ya kawaida na yenye heshima.
- source_word: רָחֲקוּ מֶנִּי
  choice: wanakaa mbali nami
  rationale: רחק humaanisha kuwa au kubaki mbali; usemi huu unahifadhi maana ya umbali wa kimwili na wa kijamii.
- source_word: וּמִפָּנַי
  choice: usoni
  rationale: Kwa maana ya msingi ni ‘kutoka/mbele ya uso wangu’; pamoja na רֹק, Kiswahili cha asili ‘kunitemea usoni’ kinaonyesha tendo la moja kwa moja la dharau.
- source_word: לֹא חָשְׂכוּ
  choice: wala hawajizuii
  rationale: חשׂך hapa ni kutosaza, kutozuia, au kutokataa kufanya jambo; ‘hawajizuii’ huonyesha kukosa kabisa kiasi katika tendo hilo.
- source_word: רֹק
  choice: kunitemea
  rationale: Nomino רֹק ni mate; muundo wa Kiswahili wa kitenzi ‘kunitemea’ huwasilisha tendo la kutema mate kwa mtu kwa uwazi na kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia muundo wa kawaida ‘kunitemea usoni’ ili kuwasilisha wazi fedheha ya moja kwa moja bila kuongeza ufafanuzi wa kimadhehebu.
