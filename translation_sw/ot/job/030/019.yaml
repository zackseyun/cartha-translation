  text: הֹרָ֥/נִי לַ/חֹ֑מֶר וָ֝/אֶתְמַשֵּׁ֗ל כֶּ/עָפָ֥ר וָ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: sw
  text: Amenitupa matopeni,[a] nami nimekuwa kama mavumbi na majivu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye udongo wa mfinyanzi” au “kwenye tope.” Neno la Kiebrania חֹמֶר linaweza kumaanisha udongo wa kufinyangia, matope, au tope zito.
    reason: lexical_alternative
  - marker: b
    text: Au “nimefanywa kuwa kama mavumbi na majivu” au “nimefananishwa na mavumbi na majivu.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: Amenitupa
  rationale: Kitenzi cha Kiebrania katika Hifili chenye kiambishi cha nafsi ya kwanza umoja kinaonyesha kutupwa kwa nguvu. Kiswahili hiki ni cha kawaida na chenye picha wazi; mtenda wa nafsi ya tatu umoja anaeleweka katika muktadha kuwa Mungu.
- source_word: לַחֹמֶר
  choice: matopeni
  rationale: חֹמֶר inaweza kumaanisha udongo wa kufinyangia, matope, au tope zito. Katika maombolezo haya, “matopeni” huonyesha kushushwa na kuaibishwa huku kikidumisha picha pana ya matope/udongo.
- source_word: וָאֶתְמַשֵּׁל
  choice: nimekuwa kama
  rationale: Umbo hili lina maana ya kuwa au kufanywa kama kitu kingine. “Nimekuwa kama” ni la asili katika Kiswahili na linaonyesha hali iliyotokea bila kufuta uwezekano wa maana ya kufananishwa.
- source_word: כֶּעָפָר
  choice: kama mavumbi
  rationale: עָפָר ni vumbi la ardhi na hapa linaashiria unyonge na hali ya kufa. “Mavumbi” ni usemi wa kawaida wa Kiswahili katika jozi hii ya kibiblia.
- source_word: וָאֵפֶר
  choice: na majivu
  rationale: אֵפֶר humaanisha majivu. Jozi “mavumbi na majivu” hudumisha taswira na mwangwi wa kibiblia wa Kiebrania.
theological_decisions:
- issue: Mtenda aliyefichika katika kitenzi cha nafsi ya tatu umoja
  choice: Kuonyesha mtenda kwa kiambishi “a-” katika “Amenitupa,” akieleweka kuwa Mungu kutokana na muktadha
  alternative: Kutumia usemi usiotaja mtenda, kama “Nimetupwa matopeni”
  rationale: Kiebrania kina mtenda wa kiume nafsi ya tatu umoja, na muktadha wa hotuba ya Ayubu unaelekeza kwa Mungu. Kiswahili huhitaji kuonyesha nafsi ndani ya kitenzi, bila kuongeza jina “Mungu” lisilotajwa wazi katika mstari.
- issue: Maana ya וָאֶתְמַשֵּׁל
  choice: nimekuwa kama
  alternative: nimefanywa kuwa kama / nimefananishwa na
  rationale: Tafsiri kuu ni ya kawaida na huonyesha hali iliyotokea, lakini tanbihi huhifadhi uwezekano wa maana ya kutendwa au kufananishwa uliomo katika umbo la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Amenitupa matopeni” ni taswira hai ya kudhalilishwa; “mavumbi na majivu” huhifadhi jozi ya kibiblia. Alama za tanbihi zimewekwa karibu na vipashio vinavyohusika.
