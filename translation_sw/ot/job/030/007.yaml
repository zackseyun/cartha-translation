  text: Among the bushes they bray[b][a]; under the nettles they huddle together.
translation:
  language: sw
  text: Miongoni mwa vichaka wanalia kama punda; chini ya mimea yenye miiba[a] wanasongamana pamoja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chini ya upupu,” “chini ya kichaka chenye miiba,” au “chini ya miiba.” Aina kamili ya mmea unaotajwa na neno la Kiebrania haina uhakika.
    reason: lexical_alternative
  - marker: b
    text: Au “wanakusanywa pamoja” au “wanajikunyata pamoja.” Kitenzi cha Kiebrania kinaonyesha kukusanyika au kubanwa pamoja; maana yake kamili katika muktadha huu haina uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: kati ya
  rationale: Kihusishi hiki kinaweza kumaanisha “katikati ya” au “miongoni mwa”; “kati ya” ni Kiswahili cha kawaida kinachofaa pamoja na wingi “vichaka.”
- source_word: שִׂיחִים
  choice: vichaka
  rationale: Neno hili linataja vichaka au mimea mifupi ya porini; “vichaka” ni la kawaida na haliongezi wazo la msitu mnene lisilolazimishwa na Kiebrania.
- source_word: יִנְהָקוּ
  choice: wanalia kama punda
  rationale: Kitenzi נהק hutumiwa hasa kwa mlio wa punda. Kiswahili hakina kitenzi kimoja cha kawaida kinacholingana moja kwa moja, hivyo msemo huu unahifadhi taswira kali ya watu wanaotoa sauti kama wanyama.
- source_word: תַּחַת
  choice: chini ya
  rationale: Hii ndiyo maana ya kawaida ya kihusishi cha mahali katika muktadha huu.
- source_word: חָרוּל
  choice: mimea yenye miiba
  rationale: Jina hususa la mmea halina uhakika, lakini linamaanisha mmea wa porini unaochoma au wenye miiba. Tafsiri hii huepuka kudai spishi fulani bila ushahidi wa kutosha.
- source_word: יְסֻפָּחוּ
  choice: wanasongamana pamoja
  rationale: Kitenzi kinaonyesha kukusanywa, kuunganishwa, au kuwa katika kundi lililobanwa. “Wanasongamana pamoja” ni cha asili na kinaendeleza picha ya watu waliojikuta wamebanana chini ya mimea ya porini, huku tanbihi ikihifadhi uwezekano wa hali ya kutendwa.
