  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: sw
  text: Je, sikumlilia mtu aliyekuwa na siku ngumu? Je, nafsi yangu haikuhuzunika kwa ajili ya mhitaji?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya mtu aliyekuwa katika siku ya taabu,” au “kwa ajili ya aliyekuwa taabuni.” Kiebrania hutumia msemo unaomaanisha kihalisi “mwenye siku ngumu” au “aliye wa siku ngumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Je, siku... ?
  rationale: Katika muktadha huu kirai hiki kinaanzisha swali la balagha katika utetezi wa Ayubu, si sentensi ya kawaida ya masharti.
- source_word: בָכִיתִי
  choice: sikumwezea machozi
  rationale: Usemi huu wa asili wa Kiswahili unaonyesha kulia kwa huruma kwa ajili ya mtu mwingine na kudumisha uzito wa kishairi.
- source_word: לִקְשֵׁה יוֹם
  choice: mtu ambaye siku yake ilikuwa ngumu
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya ‘siku ngumu’ huku ikieleweka kwa urahisi kama kipindi cha taabu.
- source_word: עָגְמָה
  choice: haikuhuzunika
  rationale: Kitenzi kinaonyesha kuumia moyoni au kuhuzunika, na kinaendana na mstari sambamba unaosema kulia.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Inahifadhi namna ya kishairi ya Kiebrania ya kumrejelea mtu wa ndani bila kuifafanua kama istilahi maalumu ya kidogma.
- source_word: לָאֶבְיוֹן
  choice: kwa ajili ya mhitaji
  rationale: אֶבְיוֹן humaanisha mtu maskini au mwenye uhitaji; ‘mhitaji’ ni ya asili, yenye heshima, na haipunguzi maana kuwa ukosefu wa fedha pekee.
theological_decisions:
- issue: Maana ya kianthropolojia ya נַפְשִׁי
  choice: ‘nafsi yangu’ kama usemi wa kishairi unaomaanisha utu wa ndani wa Ayubu
  alternative: ‘sikuhuzunika’ au ‘moyo wangu haukuhuzunika’
  rationale: Tafsiri inadumisha muundo na mvutano wa kishairi wa chanzo bila kudokeza fundisho maalumu kuhusu nafsi kuwa sehemu tofauti na mwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Maswali mawili ya balagha yamehifadhiwa, pamoja na usambamba wa mistari na taswira ya ‘siku ngumu.’
