  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: sw
  text: Wana wa wapumbavu, naam, wana wasio na jina[a], walifukuzwa kutoka nchi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wana wasio na jina” ni nahau ya Kiebrania inayomaanisha watu wasio na hadhi wala heshima.
    reason: cultural_note
  - marker: b
    text: Au, “walipigwa na kuondolewa kutoka nchi.” Kitenzi cha Kiebrania ni adimu na kinaweza kumaanisha kupigwa kwa nguvu au kufukuzwa; muktadha unaelekea kuunga mkono maana ya kufukuzwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: Wana wa wapumbavu
  rationale: Huhifadhi muundo wa Kiebrania wa uhusiano wa kundi na maana ya maadili ya נָבָל, yaani watu wapumbavu na wenye kudharaulika, si wasio na akili tu.
- source_word: גַּם
  choice: naam
  rationale: Hapa neno hili linatilia mkazo kirai cha pili kinachoeleza kundi lilelile.
- source_word: בְּנֵי בְלִי שֵׁם
  choice: watu wasio na jina
  rationale: Tafsiri hii ni ya asili kwa Kiswahili huku ikidumisha taswira ya kutokuwa na 'jina'; katika muktadha inaashiria kutokuwa na hadhi au heshima.
- source_word: נִכְּאוּ
  choice: walifukuzwa
  rationale: Kitenzi hiki adimu kinaweza kuashiria kupigwa au kuondolewa kwa nguvu. Pamoja na מִן הָאָרֶץ, maana ya kufukuzwa inaeleweka vizuri katika muktadha.
- source_word: מִן הָאָרֶץ
  choice: kutoka katika nchi
  rationale: אֶרֶץ hapa inaelekea kumaanisha nchi au eneo walimoishi, si dunia kwa maana ya ulimwengu mzima.
