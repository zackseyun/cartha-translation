base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: sw
  text: 'Kwa maana najua kwamba utanirudisha mautini[a],

    kwenye nyumba iliyowekwa kwa ajili ya kila aliye hai.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utanipeleka mautini.” Kitenzi cha Kiebrania kwa msingi kina maana ya kusababisha mtu arudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye nyumba iliyowekwa kwa ajili ya wote walio hai.” Huenda hii ni taswira ya kishairi ya kaburi au Kuzimu, mahali panapowangoja wanadamu wote.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza hoja ya Ayubu kwa kutoa msingi wa maneno yaliyotangulia, bila kuongeza mkazo usiokuwamo katika Kiebrania.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kitenzi hiki kinaonyesha ufahamu au uhakika wa Ayubu unaoendelea; wakati wa sasa ni wa kawaida na wazi katika Kiswahili.
- source_word: מָוֶת
  choice: mautini
  rationale: Nomino inamaanisha kifo. Umbo la mahali “mautini” linaonyesha kwa kawaida kwamba kifo ndicho anakopelekwa, bila kutaja moja kwa moja Kuzimu au kaburi.
- source_word: תְּשִׁיבֵנִי
  choice: utanirudisha
  rationale: Hifili ya שוב ina maana ya kusababisha mtu arudi. “Utanirudisha” huhifadhi dhana hiyo, huku tanbihi ikitaja tafsiri ya kimuktadha “utanipeleka,” ambayo haidokezi lazima kwamba Ayubu alikuwa amekufa hapo awali.
- source_word: וּבֵית מוֹעֵד
  choice: kwenye nyumba iliyowekwa
  rationale: Kirai kinaendeleza wazo la mahali anakoelekezwa. מוֹעֵד inaweza kumaanisha jambo, wakati, au mahali palipowekwa; “iliyowekwa” huhifadhi taswira bila kulazimisha maana ya mkutano.
- source_word: לְכָל חָי
  choice: kwa ajili ya kila aliye hai
  rationale: Huhifadhi umoja wenye maana ya ujumla katika Kiebrania na kusisitiza kwamba mwisho huu unawahusu wanadamu wote.
theological_decisions:
- issue: Taswira ya kifo na nyumba iliyowekwa
  choice: Kifo kinaelezwa kama mwisho wa wanadamu wote, kwa kutumia sitiari ya nyumba iliyowekwa kwa ajili ya kila aliye hai.
  alternative: Kirai kinaweza kumaanisha hasa kaburi au Kuzimu, au nyumba ya kukusanyika kwa wafu.
  rationale: Andiko linataja “mauti” na “nyumba iliyowekwa” lakini halitaji Kuzimu kwa jina. Tafsiri hiyo huhifadhi taswira na uwezekano wake bila kuingiza maelezo zaidi kuhusu hali ya baada ya kifo.
- issue: Maana ya kurudishwa mautini
  choice: “Utanirudisha” imetumiwa ili kuhifadhi maana ya kisababishi ya שוב.
  alternative: “Utanipeleka” ni Kiswahili cha kawaida zaidi na hakidokezi kurudi katika hali ambayo Ayubu alikuwa nayo zamani.
  rationale: Kiebrania chenyewe kina wazo la kusababisha kurudi, lakini katika muktadha kinaweza kuwa nahau ya kumfikisha mtu kwenye mwisho wake wa kawaida. Tanbihi huhifadhi mvutano huo badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi wenye heshima lakini unaoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari miwili unaakisi ulinganifu wa kishairi. “Mautini” ni la kawaida katika lugha ya Biblia na bado linaeleweka; “nyumba iliyowekwa” huhifadhi ufupi na utata wa taswira ya Kiebrania.
