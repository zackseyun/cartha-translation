  text: אָ֭ח הָיִ֣יתִי לְ/תַנִּ֑ים וְ֝/רֵ֗עַ לִ/בְנ֥וֹת יַעֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/029.yaml
  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: sw
  text: 'Nimekuwa ndugu wa mbwa-mwitu,

    na rafiki wa mbuni.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “binti za mbuni,” usemi wa Kiebrania unaomaanisha mbuni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: ndugu
  rationale: Neno hilo humaanisha kihalisi “ndugu” na hapa linadumisha sitiari ya Ayubu kujihusianisha kwa karibu na wanyama wa mahali pa ukiwa.
- source_word: הָיִיתִי
  choice: nimekuwa
  rationale: Kauli timilifu ya nafsi ya kwanza inaonyesha hali ya sasa iliyotokana na badiliko lililotangulia; “nimekuwa” ni ya kawaida na ya asili katika Kiswahili.
- source_word: לְתַנִּים
  choice: wa mbweha
  rationale: Katika ushairi wa maeneo yaliyoharibika, תַנִּים kwa kawaida hurejelea mbweha; muundo “ndugu wa” huwasilisha uhusiano unaowekwa na kiambishi לְ.
- source_word: וְרֵעַ
  choice: na mwandamani
  rationale: רֵעַ inaweza kumaanisha rafiki au mwenzi; “mwandamani” inafaa katika ulinganifu na “ndugu” bila kudokeza ukaribu wa kihisia usiotajwa wazi.
- source_word: לִבְנוֹת יַעֲנָה
  choice: wa mbuni
  rationale: Kirai hicho kihalisi ni “binti za mbuni,” lakini ni usemi wa Kiebrania unaowarejelea mbuni; Kiswahili cha kawaida hutumia jina “mbuni” bila kubadili umbo katika wingi.
