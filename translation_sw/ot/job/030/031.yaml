lexical_decisions:
- source_word: וַיְהִי
  choice: kimekuwa
  rationale: Kitenzi היה katika usimulizi kinaonyesha hali iliyotokea kutokana na mabadiliko ya hali ya Ayubu; wakati timilifu wa Kiswahili unaonyesha matokeo yanayoendelea.
- source_word: לְאֵבֶל
  choice: cha maombolezo
  rationale: אֵבֶל humaanisha hali au udhihirisho wa huzuni ya kuomboleza; muundo huu ni wa kawaida na wa kishairi katika Kiswahili.
- source_word: כִּנֹּרִי
  choice: kinubi changu
  rationale: כִּנּוֹר ni ala ya nyuzi inayofanana na kinubi au zeze. “Kinubi” ni neno linalotambulika katika sajili ya Biblia, ingawa umbo kamili la ala ya kale halijulikani.
- source_word: וְעֻגָבִי
  choice: filimbi yangu
  rationale: עוּגָב ni ala ya kupuliza ambayo umbo lake kamili halijulikani; “filimbi” huwasilisha kwa kawaida aina hiyo ya ala bila kudai usahihi usiowezekana.
- source_word: לְקוֹל
  choice: imekuwa sauti ya
  rationale: 'לְ pamoja na קוֹל hapa inaendeleza wazo la mabadiliko: ala hiyo sasa inahusishwa na, au imegeuka kuwa, sauti ya kilio. Kurudia “imekuwa” huweka maana hiyo wazi kwa Kiswahili cha kawaida.'
- source_word: בֹּכִים
  choice: wanaolia
  rationale: Kivumishi-tendo cha Kiebrania kinarejelea watu wanaoendelea kulia; “wanaolia” ni kifupi, cha kawaida, na kinahifadhi rejeleo la watu.
