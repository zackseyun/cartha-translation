  text: Kinubi changu[a] kimegeuka kuwa maombolezo, na filimbi yangu[b] kuwa sauti ya wanaolia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zeze langu.” Neno la Kiebrania כִּנּוֹר humaanisha ala ya nyuzi, ambayo yaweza kuwa kama kinubi au zeze.
