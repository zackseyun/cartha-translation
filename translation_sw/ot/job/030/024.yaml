  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: sw
  text: Hakika, mtu haunyoshi mkono dhidi ya rundo la magofu[a], ikiwa katika msiba wake kuna kilio cha kuomba msaada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakika, mtu haunyoshi mkono kuelekea rundo la magofu; ikiwa katika maafa yake kuna kilio cha kuomba msaada.” Kiebrania cha mstari huu ni kigumu, hasa maneno yaliyotafsiriwa “dhidi ya rundo la magofu” na umbo לָהֶן, ambalo maana yake katika muktadha huu haiko wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Chembe hii imeeleweka kama ya kusisitiza dai la Ayubu; “Hakika” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: בְּעִי
  choice: dhidi ya magofu
  rationale: Neno hili ni adimu na gumu, na huenda linamaanisha magofu au rundo la magofu. “Dhidi ya” huonyesha tendo linaloelekezwa kwa uhasama huku ikiifadhi picha hiyo.
- source_word: יִשְׁלַח יָד
  choice: hanyoshi mkono
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania badala ya kuifafanua kabisa kuwa kushambulia.
- source_word: אִם
  choice: ikiwa
  rationale: Huhifadhi maana ya sharti ya chembe hiyo bila kutatua kupita kiasi sintaksia yenye utata.
- source_word: בְּפִידוֹ
  choice: katika msiba wake
  rationale: פיד hurejelea maafa au msiba; chaguo hili linahifadhi kiambishi cha nafsi na ni Kiswahili cha asili.
- source_word: לָהֶן
  choice: kuna
  rationale: Umbo hili ni gumu sana katika muktadha. Halijatafsiriwa moja kwa moja katika mstari mkuu kwa sababu uhusiano wake wa kisintaksia haueleweki; utata huo umeelezwa katika tanbihi.
- source_word: שׁוּעַ
  choice: kilio cha kuomba msaada
  rationale: Nomino hii humaanisha kilio kinachotolewa wakati wa dhiki ili kuomba msaada; tafsiri hii inaweka maana hiyo wazi kwa msomaji wa kawaida.
