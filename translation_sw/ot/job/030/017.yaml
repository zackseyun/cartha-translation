  yaml_path: translation/ot/job/030/017.yaml
  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
translation:
  language: sw
  text: Usiku, mifupa yangu hutobolewa ndani yangu,[a] na mishipa yangu[b] hailali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifupa yangu hutobolewa kutoka juu yangu.” Maneno ya Kiebrania ni magumu; wengine hutafsiri kitenzi kwa maana ya jumla zaidi, “hutafunwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maumivu yangu yanayonitafuna.” Neno la Kiebrania ni adimu na huenda likamaanisha mishipa au njia nyingine za mwilini, au kwa upanuzi maumivu yanayopita humo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: Usiku
  rationale: Hutumia neno hili kama kielezi cha wakati kwa Kiswahili cha kawaida na huhifadhi mkazo wa mateso ya wakati wa usiku.
- source_word: עֲצָמַי
  choice: mifupa yangu
  rationale: Tafsiri halisi inayohifadhi taswira dhahiri ya mateso ya mwili.
- source_word: נִקַּר
  choice: hutobolewa
  rationale: Kitenzi נקר kimsingi humaanisha kutoboa au kuchimba tundu; kauli ya kutendwa huhifadhi taswira kali ya kimwili.
- source_word: מֵעָלָי
  choice: ndani yangu
  rationale: Kirai cha Kiebrania ni kigumu kwa tafsiri ya moja kwa moja; katika muktadha huu, ‘ndani yangu’ huwasilisha kwa kawaida mateso yaliyo ndani ya mwili.
- source_word: וְעֹרְקַי
  choice: mishipa yangu
  rationale: עֹרְקַי ni neno adimu linaloweza kutaja mishipa au njia za mwilini. Tafsiri ya kiungo halisi inahifadhi utata badala ya kulibadili moja kwa moja kuwa ‘maumivu.’
- source_word: לֹא יִשְׁכָּבוּן
  choice: hailali
  rationale: Huhifadhi sitiari halisi ya ‘kutolala,’ yaani mishipa au mateso yanayohusishwa nayo hayatulii.
