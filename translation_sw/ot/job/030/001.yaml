  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: sw
  text: Lakini sasa wale walio wadogo kuniliko kwa umri wananicheka—wale ambao baba zao sikukubali kuwaweka pamoja na mbwa wa kundi langu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na mbwa wangu wa kuchunga kondoo.” Kiebrania kinasema kihalisi, “pamoja na mbwa wa kundi langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Inaonyesha tofauti kali kati ya heshima ya Ayubu hapo awali na hali yake ya sasa.
- source_word: שָׂחֲקוּ עָלַי
  choice: wananicheka
  rationale: Inadumisha picha halisi ya kuchekwa huku muktadha ukionyesha dharau.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: wale walio wadogo kwangu kwa umri
  rationale: Kirai 'kwa siku' ni nahau ya Kiebrania inayohusu umri; tafsiri hii ni ya kawaida kwa Kiswahili na haiongezi wazi jinsia ambayo haikutajwa moja kwa moja.
- source_word: אֲשֶׁר מָאַסְתִּי
  choice: wale ambao ... niliwakataa
  rationale: Kitenzi kina maana ya kukataa au kudharau; 'niliwakataa' kinaendana vizuri na tendo linalofuata bila kuzidisha hisia kuliko matini.
- source_word: אֲבוֹתָם
  choice: baba zao
  rationale: Hii ndiyo maana ya kawaida na inarejelea baba za wale vijana wanaomcheka Ayubu.
- source_word: לָשִׁית
  choice: kuwaweka
  rationale: Kinawasilisha kitendo halisi cha kuweka au kupanga pamoja na wengine.
- source_word: עִם כַּלְבֵי צֹאנִי
  choice: pamoja na mbwa wa kundi langu
  rationale: Inahifadhi usemi mpana na halisi wa Kiebrania bila kuamua kimyakimya kwamba walikuwa mbwa maalumu wa kuchunga kondoo.
