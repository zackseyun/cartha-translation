translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Hata' limetumiwa kuonyesha nguvu ya dharau iliyo katika kukataa kuwaweka baba hao pamoja na mbwa, huku usemi halisi kuhusu mbwa wa kundi ukihifadhiwa na ufafanuzi mbadala kuwekwa katika tanbihi.
