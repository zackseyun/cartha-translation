  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: sw
  text: Ninakulilia, lakini hunijibu; ninasimama, nawe unanitazama tu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilisimama, nawe ukanitazama kwa makini.” Kiebrania kinaweza kueleweka kwa wakati uliopita, na kitenzi hicho pia kinaweza kumaanisha kutazama kwa makini au kuzingatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: Ninakulilia
  rationale: Kitenzi cha Kiebrania katika Piel kinaonyesha kilio kikali cha kuomba msaada. “Ninakulilia” ni usemi wa kawaida na wenye hadhi unaohifadhi uzito wa ombi bila kuongeza jambo lisilotajwa wazi.
- source_word: אֵלֶיךָ
  choice: -ku- … -lia
  rationale: Kiwakilishi cha nafsi ya pili pamoja na אֶל kinaingizwa kiasili katika muundo wa kitenzi “ninakulilia,” yaani, ninatoa kilio changu kwako.
- source_word: תַעֲנֵנִי
  choice: hunijibu
  rationale: ענה katika Qal humaanisha kujibu au kuitikia. “Hunijibu” ni tafsiri ya moja kwa moja na ya asili katika muktadha wa sala ya maombolezo.
- source_word: עָמַדְתִּי
  choice: ninasimama
  rationale: Ingawa umbo la Kiebrania ni timilifu, hapa linaweza kuwasilisha hali hai inayoendelea sambamba na malalamiko ya mstari wa kwanza. Wakati uliopo unaleta nguvu hiyo kwa Kiswahili, huku uwezekano wa wakati uliopita ukihifadhiwa katika tanbihi.
- source_word: וַתִּתְבֹּנֶן
  choice: nawe unanitazama tu
  rationale: התבונן inaweza kumaanisha kutazama kwa makini au kufikiria. Katika maombolezo haya, “tu” huonyesha tofauti iliyodokezwa kati ya kujibu na kutazama bila kudai kwamba Mungu anampuuza.
- source_word: בִּי
  choice: unani-
  rationale: Kwa kuwa בִּי ni yambwa ya התבונן, maana yake inatolewa kiasili kwa kiambishi cha yambwa “-ni-” katika “unanitazama.”
theological_decisions:
- issue: Iwapo kutokujibu kwa Mungu kuelezwe kwa maneno makali zaidi kuliko Kiebrania
  choice: Kuhifadhi malalamiko kwamba Mungu hajibu bali anatazama tu
  alternative: “Ninakulilia msaada, lakini huniokoi” au “ninasimama, nawe unanipuuza”
  rationale: Kiebrania hakisemi wazi kwamba Mungu haokoi au anampuuza Ayubu. Tafsiri inaacha mvutano wa maombolezo kama ulivyo bila kuongeza shtaka la kiteolojia.
- issue: Wakati wa vitenzi katika sehemu ya pili
  choice: Wakati uliopo katika maandishi makuu, huku wakati uliopita ukitajwa katika tanbihi
  alternative: “Nilisimama, nawe ukanitazama kwa makini”
  rationale: עָמַדְתִּי ni timilifu na וַתִּתְבֹּנֶן inaweza kusomwa kama tendo la wakati uliopita, lakini muktadha pia unaruhusu uwasilishaji hai wa hali ya sasa. Tanbihi huhifadhi uwezekano halisi wa kisarufi na maana ya kutazama kwa makini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; “tu” huhifadhi tofauti ya kimuktadha kati ya kutokujibu na kutazama bila kuongeza wazo la kupuuza.
