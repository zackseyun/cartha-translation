base_translation:
  language: en
  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: sw
  text: Unaniinua kuelekea upepo[a]; unanipandisha juu yake, kisha unanifanya niyeyuke katika tufani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unaniinua juu ya upepo; unanipandisha juu yake.”
    reason: lexical_alternative
  - marker: b
    text: Neno la mwisho la Kiebrania ni gumu kuelewa. Huenda likahusu tufani, kishindo cha msukosuko, au maangamizi. Mstari huu pia unaweza kutafsiriwa, “unanitupa huku na huku katika tufani,” au “unaniyeyusha hadi kuangamia.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: Unaniinua
  rationale: Kitenzi נשׂא kina maana ya kuinua, kubeba, au kuchukua. “Unaniinua” kinahifadhi taswira halisi ya Ayubu kuinuliwa kwa nguvu.
- source_word: אֶל רוּחַ
  choice: kuelekea upepo
  rationale: רוּחַ linaweza kumaanisha upepo, pumzi, au roho. Muktadha wa msukosuko wa hali ya hewa unaunga mkono “upepo,” na אֶל limetafsiriwa “kuelekea” ili kuhifadhi mwelekeo unaoonyeshwa na Kiebrania.
- source_word: תַּרְכִּיבֵנִי
  choice: unanifanya niupande
  rationale: Hifili ya רכב humaanisha kumsababisha mtu apande au aendeshe. Kiambishi “-u-” kinarejelea upepo na kuweka taswira hiyo wazi kwa Kiswahili cha kawaida.
- source_word: וּתְמֹגְגֵנִי
  choice: unanifanya niyeyuke
  rationale: Mzizi מוג kwa kawaida huonyesha kuyeyuka, kulegea, au kufanywa dhaifu. Tafsiri hii inahifadhi picha ya Ayubu kufanywa kana kwamba anavunjika au kutoweka, badala ya kuibadili moja kwa moja kuwa kutupwa huku na huku.
- source_word: תשוה
  choice: katika tufani
  rationale: Umbo hili la mwisho ni gumu na maana yake haina uhakika. “Katika tufani” linafuata taswira ya upepo na maangamizi katika muktadha, huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions:
- issue: Mungu anatajwa kuwa mtendaji wa mateso ya Ayubu
  choice: 'Vitenzi vya nafsi ya pili vimehifadhiwa moja kwa moja: “Unaniinua… unanifanya…”'
  alternative: Kutumia kauli zisizoonyesha wazi mtendaji, kama “nimeinuliwa”
  rationale: Kiebrania kinamwelekezea Mungu maneno haya moja kwa moja. Tafsiri haipaswi kupunguza mvutano wa kitheolojia uliomo katika malalamiko ya Ayubu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wazi na wenye staha. “Tufani” ni neno la kawaida la kifasihi linalofaa taswira ya upepo mkali; utata wa mwisho wa mstari umeelezwa katika tanbihi badala ya kutatuliwa kimyakimya.
