  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha picha ya njia inayobomolewa na utata wa kishazi cha mwisho kupitia tanbihi. Alama zote za tanbihi zimewekwa katika matini kuu kwa mpangilio wa kutokea.
