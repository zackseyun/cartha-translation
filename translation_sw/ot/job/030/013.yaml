base_translation:
  language: en
  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: sw
  text: Wanabomoa njia yangu kwa ajili ya maangamizi yangu; wanayaendeleza[a]—bila mtu yeyote kuwasaidia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wananufaika nayo” au “wanayasaidia yasonge mbele.” Kitenzi cha Kiebrania kinaweza kumaanisha kunufaika au kusaidia jambo lisonga mbele; hapa huenda kinarejelea maangamizi ya Ayubu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hawana msaidizi.” Kishazi cha mwisho katika Kiebrania ni kifupi na kinaweza kumaanisha kwamba wanatenda bila kusaidiwa au kwamba hawana msaidizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: wanabomoa
  rationale: Kitenzi hiki kina maana ya kubomoa au kuvunja-vunja; ‘wanabomoa’ kinadumisha picha halisi ya kuiharibu njia kwa nguvu.
- source_word: נְתִיבָתִי
  choice: njia yangu
  rationale: ‘Njia’ ni tafsiri ya kawaida na ya asili ya נְתִיבָה, na inaweza kudumisha pia maana ya kisitiari bila kuifafanua kupita kiasi.
- source_word: לְהַוָּתִי
  choice: ili waniangamize
  rationale: הַוָּה huonyesha maangamizi, uharibifu, au msiba. Muundo huu wa Kiswahili unaonyesha kwa kawaida kuwa kubomolewa kwa njia kunalenga kumletea Ayubu maangamizi.
- source_word: יֹעִילוּ
  choice: wanachochea maangamizi yangu
  rationale: Hifili ya יעל inaweza kumaanisha kusaidia jambo lisonge mbele au kulifanikisha. ‘Wanachochea’ inaonyesha kuwa wanaendeleza maangamizi yaliyotajwa, bila kuipa hapa maana isiyo ya kawaida ya kupata faida.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: bila mtu yeyote kuwasaidia
  rationale: Kishazi hiki kifupi kinaweza kueleweka kuwa wanatenda bila msaada wa mtu. Tafsiri hii ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya ‘hawana msaidizi.’
