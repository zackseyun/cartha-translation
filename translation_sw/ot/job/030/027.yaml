  text: מֵעַ֖/י רֻתְּח֥וּ וְ/לֹא דָ֗מּוּ קִדְּמֻ֥/נִי יְמֵי עֹֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: sw
  text: Viungo vyangu vya ndani vinachemka wala havitulii[a]; siku za mateso zinanikabili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Matumbo yangu yanafoka wala hayatulii; siku za taabu zimenijia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  choice: viungo vyangu vya ndani
  rationale: Neno hili hurejelea viungo vya ndani na, katika ushairi, nafsi au hisia za ndani. Tafsiri hii inadumisha taswira halisi ya mwili bila kutumia neno linaloweza kueleweka kuwa moyo pekee.
- source_word: רֻתְּחוּ
  choice: vinachemka
  rationale: Kitenzi kina maana ya kuchemka au kufoka kama kitu kinachochemka. ‘Vinachemka’ inadumisha taswira ya msukosuko mkali ndani ya mwili.
- source_word: וְלֹא דָמּוּ
  choice: wala havitulii
  rationale: דמם inaweza kumaanisha kutulia, kunyamaza, au kukoma. Katika muktadha wa msukosuko wa ndani, ‘havitulii’ ni ya asili na huhifadhi wazo la hali isiyokoma.
- source_word: קִדְּמֻנִי
  choice: zinanikabili
  rationale: Kitenzi kinaweza kueleza kuja mbele ya mtu au kukutana naye. ‘Zinanikabili’ huhifadhi uhuishaji wa siku za mateso na uzito wake wa kiadui.
- source_word: יְמֵי עֹנִי
  choice: siku za mateso
  rationale: עֹנִי hapa ina maana pana ya dhiki, taabu, au mateso, si umaskini wa kiuchumi pekee. ‘Mateso’ inafaa kwa maombolezo ya Ayubu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Viungo vyangu vya ndani’ huhifadhi taswira ya Kiebrania; tanbihi inatoa usemi wa moja kwa moja zaidi bila kuondoa utata wa דמם na קדם.
