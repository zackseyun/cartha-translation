  text: Je, aambiwe[a] kwamba ningesema? Mtu[b] akisema[c], hakika atamezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Mungu aambiwe.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mwanamume”; hapa linaweza kumaanisha mtu yeyote.'
