lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: Je, aambiwe
  rationale: Kauli ya kutendwa ya ספר pamoja na kiulizi הֲ inaelezwa kwa swali lisilotaja mtendaji, kwa Kiswahili cha kawaida na kilicho karibu na muundo wa Kiebrania.
- source_word: לוֹ
  choice: aambiwe
  rationale: Kiambishi cha mtendewa katika kitenzi cha Kiswahili kinawakilisha ‘kwake’; katika muktadha kinamrejelea Mungu bila kuongeza herufi kubwa ya heshima ambayo Kiebrania haiwekwi.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha yaliyomo katika taarifa inayoweza kutolewa.
- source_word: אֲדַבֵּר
  choice: nitasema
  rationale: Kauli isiyotimilika inaeleza tendo la kusema linalofikiriwa au linalotarajiwa. Wakati ujao wa Kiswahili unaweka wazo hilo wazi bila kuongeza sharti lisilokuwapo katika maandishi.
- source_word: אִם אָמַר אִישׁ
  choice: Mtu akisema
  rationale: Muundo wa -ki- unaonyesha hali ya masharti inayotambulishwa na אִם. ‘Mtu’ ni tafsiri ya kawaida ya אִישׁ hapa na inaweza kumaanisha mwanadamu yeyote.
- source_word: כִּי יְבֻלָּע
  choice: hakika atamezwa
  rationale: ‘Atamezwa’ inadumisha picha hai ya kauli ya kutendwa ya בלע, nayo ‘hakika’ inaonyesha nguvu ya כִּי katika uhusiano huu wa sentensi.
theological_decisions:
- issue: Mrejelewa wa לוֹ
  choice: Kumwakilisha kwa kiambishi cha mtendewa katika ‘aambiwe,’ huku muktadha ukionyesha kuwa ni Mungu
  alternative: Kutaja wazi ‘Mungu aambiwe’
  rationale: Kiebrania kinatumia kiwakilishi, si jina la Mungu. Tafsiri inadumisha hilo na tanbihi inaeleza mrejelewa bila kuubadili kuwa jina katika matini.
- issue: Maana ya kijumla ya אִישׁ
  choice: Mtu
  alternative: Mwanamume
  rationale: Katika muktadha huu אִישׁ inaweza kumaanisha mwanadamu yeyote, na ‘mtu’ ni Kiswahili cha kawaida kinachodumisha umoja bila kuweka jinsia ambayo si lazima kwa maana.
- issue: Sintaksia ngumu ya mstari
  choice: Kudumisha swali la kwanza na sharti katika la pili bila kulazimisha ujenzi mmoja wa kifungu
  alternative: ‘Je, aambiwe kuwa ninasema? Au mtu aseme kwamba atamezwa?’
  rationale: Kiebrania ni kifupi na kinaweza kupangwa kwa zaidi ya njia moja. Matini kuu inafuata mtiririko unaowezekana zaidi, huku tanbihi ikihifadhi uchambuzi mwingine wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Swali la balagha na picha ya ‘kumezwa’ zimedumishwa; sintaksia ngumu haijalainishwa kupita kiasi.
