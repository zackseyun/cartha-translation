base_translation:
  language: en
  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: sw
  text: Sikiliza[a] jambo hili, Ayubu; simama[b] na uyatafakari maajabu[c] ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tega sikio kwa jambo hili, Ayubu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kaa kimya” au “tulia.” Neno la Kiebrania kimsingi ni “simama,” lakini katika muktadha huu linaweza kueleza kutulia ili kutafakari.
    reason: lexical_alternative
  - marker: c
    text: Au, “matendo ya ajabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Sikiliza
  rationale: Kitenzi hiki cha amri kinamtaka Ayubu asikilize kwa makini. “Sikiliza” ni Kiswahili cha sasa, cha kawaida na chenye nguvu inayofaa.
- source_word: זֹּאת
  choice: jambo hili
  rationale: Kiwakilishi cha kuonyesha cha umoja kinarejelea jambo linalosemwa. Kuongeza “jambo” kunafanya usemi “Sikiliza jambo hili” uwe wa asili katika Kiswahili bila kubadili maana.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Hili ndilo umbo la kawaida la jina hilo katika matumizi ya Biblia ya Kiswahili.
- source_word: עֲמֹד
  choice: simama
  rationale: Amri hii kimsingi inamaanisha kusimama au kubaki mahali. “Simama” huhifadhi taswira ya Kiebrania bila kulazimisha maana ya ziada.
- source_word: וְהִתְבּוֹנֵן
  choice: na uyatafakari
  rationale: Kitenzi kinaeleza kuangalia au kufikiria kwa makini ili kuelewa. “Yatafakari” ni cha asili na kinabeba uzito wa kutafakari kwa makini; kiambishi “ya-” kinarejelea maajabu.
- source_word: נִפְלְאוֹת
  choice: maajabu
  rationale: Nomino ya wingi inaweza kumaanisha mambo ya ajabu au matendo ya kushangaza. “Maajabu” huhifadhi upana huo kwa ufupi na kwa lugha inayoeleweka.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa jina la kiungu אֵל linamtaja Mungu kwa kawaida. “Mungu” ni tafsiri ya moja kwa moja isiyoongeza sifa ambayo haijaelezwa wazi katika mstari.
theological_decisions:
- issue: Tafsiri ya jina la kiungu אֵל
  choice: Mungu
  alternative: Mungu Mwenye nguvu
  rationale: Ingawa אֵל wakati mwingine huhusishwa na wazo la nguvu, katika muktadha huu linamtaja Mungu bila sifa ya ziada. “Mungu” huhifadhi maana ya wazi na huepuka kuongeza mkazo wa kitafsiri.
- issue: Maana ya נִפְלְאוֹת kama vitu au matendo
  choice: maajabu
  alternative: matendo ya ajabu
  rationale: Nomino inaweza kuelekeza kwenye mambo ya kushangaza au matendo ya Mungu. “Maajabu” huhifadhi utata huo badala ya kuamua kimya kimya kwamba yanamaanisha matendo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa amri umehifadhiwa, na “jambo hili” limetumiwa ili kufanya sentensi iwe ya asili katika Kiswahili.
