base_translation:
  language: en
  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: sw
  text: Baada yake[a], sauti hunguruma; yeye hupiga radi kwa sauti yake yenye adhama, wala yeye havizuii sauti yake inaposikika[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baadaye, sauti hunguruma.” Kiebrania kinaweza kueleweka kama kielezi cha wakati, lakini huenda muktadha unarejelea umeme katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa sababu sauti yake inasikika.” Kiunganishi cha Kiebrania kinaweza kuonyesha sababu au wakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Kiambishi cha nafsi ya tatu umoja kinaelekea kurejelea umeme wa mstari uliotangulia. Tafsiri hii inadumisha kiungo hicho, huku uwezekano wa maana ya kielezi ukitajwa katika tanbihi.
- source_word: יִשְׁאַג קוֹל
  choice: sauti hunguruma
  rationale: Kitenzi שׁאג hutumiwa hasa kuhusu mngurumo wa simba na hapa kinaumba taswira hai ya radi. Kiswahili ‘sauti hunguruma’ kinadumisha taswira hiyo bila kuongeza kimbele kuwa ni sauti yake.
- source_word: יַרְעֵם
  choice: yeye hupiga radi
  rationale: Hifili ya רעם humwonyesha Mungu akisababisha radi. ‘Hupiga radi’ ni usemi wa kawaida wa Kiswahili unaohifadhi utendaji wa mhusika wa kimungu.
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: kwa sauti yake yenye fahari
  rationale: גָּאוֹן hapa huonyesha ukuu, fahari, au utukufu. ‘Yenye fahari’ ni lugha ya sasa na yenye hadhi bila kuifanya sentensi kuwa nzito.
- source_word: וְלֹא יְעַקְּבֵם
  choice: wala hazizuii
  rationale: Pieli ya עקב inaweza kumaanisha kuzuia, kuchelewesha, au kushikilia nyuma. Kiambishi cha wingi kinadumishwa bila kutaja wazi kinachorejelewa, kama ilivyo katika Kiebrania; muundo wa Kiswahili hapa hueleza kwamba sauti yake haizuii matokeo hayo ya dhoruba.
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: sauti yake inaposikika
  rationale: כִּי inaweza kuwa ya wakati au ya sababu. ‘Inaposikika’ linafaa kwa mfuatano wa umeme na radi, lakini uwezekano wa maana ya kisababishi umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mhusika anayenguruma na kupiga radi
  choice: Mungu ndiye anayepiga radi, na sauti yake inadhihirika katika radi.
  alternative: Sauti au dhoruba inaweza kueleweka kama mhusika asiyeainishwa wazi.
  rationale: Muktadha wa karibu unaeleza kazi ya Mungu katika dhoruba, na ‘sauti yake yenye fahari’ inaunga mkono mhusika binafsi wa kimungu. Tafsiri haiongezi jina ‘Mungu’ mahali ambapo halipo wazi katika mstari.
- issue: Mhusika wa וְלֹא יְעַקְּבֵם
  choice: Kauli imeeleweka kwa namna inayoweza kumaanisha kwamba sauti yake haizuii vitu vya wingi vinavyodokezwa na muktadha.
  alternative: Kauli inaweza kueleweka kuwa yeye havizuii au havicheleweshi vitu hivyo.
  rationale: Umbile la Kiebrania lina utata wa kisarufi na kile kinachorejelewa na kiambishi cha wingi hakijatajwa. Tafsiri kuu na tanbihi zinahifadhi mvutano huu badala ya kuutanzua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Hunguruma’ huhifadhi taswira ya kishairi; ‘hupiga radi’ ni usemi wa kawaida. Utata wa kiambishi cha wingi na wa kiunganishi כִּי umehifadhiwa kwa tanbihi.
