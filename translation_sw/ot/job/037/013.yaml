base_translation:
  language: en
  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: sw
  text: Iwe ni kwa ajili ya kuadibu[a], au kwa ajili ya nchi yake, au kwa ajili ya upendo wa kudumu[b], yeye huisababisha itokee[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya fimbo,” yaani, kwa ajili ya adhabu au nidhamu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ajili ya rehema” au “kwa ajili ya fadhili.”
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kiebrania kinaweza pia kutafsiriwa, “yeye huileta” au “yeye huifanya ifike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: iwe ni ... au ... au
  rationale: Katika mfuatano huu wa mara tatu, אִם haitangulizi sharti la kawaida, bali inaonyesha makusudi mbadala; muundo huu wa Kiswahili unaakisi mfuatano huo.
- source_word: לְשֵׁבֶט
  choice: kwa ajili ya kuadibu
  rationale: שֵׁבֶט maana yake ya msingi ni ‘fimbo,’ lakini hapa imetumiwa kwa maana ya kuadhibu au kurekebisha. ‘Kuadibu’ huhifadhi wazo hilo bila kulifanya liwe adhabu kali tu.
- source_word: לְאַרְצוֹ
  choice: kwa ajili ya nchi yake
  rationale: אֶרֶץ inaweza kumaanisha nchi au dunia; kiambishi cha nafsi ya tatu ya kiume kinaonyeshwa kwa ‘yake.’ ‘Nchi yake’ ni ya kawaida na inaacha upana unaofaa katika muktadha.
- source_word: לְחֶסֶד
  choice: kwa ajili ya upendo thabiti
  rationale: חֶסֶד hubeba maana pana ya upendo mwaminifu, rehema, na fadhili. ‘Upendo thabiti’ huhifadhi uzito wake bila kuingiza kwa lazima muktadha wa agano usiotajwa wazi hapa.
- source_word: יַמְצִאֵהוּ
  choice: yeye huifanya ije
  rationale: Hifili ya מצא hapa ina maana ya kusababisha jambo linalozungumziwa katika muktadha—wingu, mvua, au tufani—lifike. ‘Huifanya ije’ ni ya asili na huhifadhi wazo la kusababisha kufika kuliko kuligeuza tu kuwa ‘kutokea.’
theological_decisions:
- issue: Kusudi la Mungu katika vifungu vitatu vya אִם
  choice: 'Mstari unaonyesha makusudi mbadala ya tukio la hali ya hewa: kuadibu, kuitunza nchi yake, au kuonyesha upendo thabiti.'
  alternative: Vifungu vinaweza kueleweka kuwa vinaonyesha mahali linapoelekezwa; pia ‘fimbo’ inaweza kueleweka hasa kama hukumu ya adhabu.
  rationale: Muktadha unahusu utawala wa Mungu juu ya mawingu na dhoruba. Muundo wa לְ pamoja na אִם inayorudiwa unaelekea kuonyesha kusudi au matokeo, lakini tafsiri haifanyi ‘kuadibu’ kuwa adhabu pekee wala ‘upendo thabiti’ kuwa fundisho maalumu la kiitikadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Iwe ni ... au ... au’ hudumisha muundo wa chaguzi tatu; viwakilishi ‘yeye’ na ‘i-’ vinaacha rejeleo la Mungu na tukio la hali ya hewa lieleweke kutokana na muktadha.
