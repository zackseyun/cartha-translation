base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: sw
  text: Je, unaweza, pamoja naye, kutandaza[a] mbingu zilizo imara kama kioo cha chuma kilichomiminwa[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufua mbingu” au “kuzinyosha mbingu.” Kitenzi cha Kiebrania kinaweza kuleta picha ya kufua chuma hadi kiwe chembamba, na pia ya kutandaza kitu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kama kioo kilichomiminwa.” Vioo vya kale vilitengenezwa kwa chuma kilichong'arishwa; picha hapa ni ya mbingu zilizo imara na zenye kung'aa kama kazi ya chuma.
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: kuyatandaza
  rationale: Hifili ya רקע inaweza kumaanisha kutandaza au kufua kitu hadi kiwe chembamba, hasa chuma. ‘Kuyatandaza’ ni ya asili katika Kiswahili huku dokezo la chini likihifadhi taswira ya kufua.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Kiebrania kina kiwakilishi ‘naye’; muktadha humrejelea Mungu, lakini tafsiri haibadilishi kiwakilishi hicho kuwa jina.
- source_word: לִשְׁחָקִים
  choice: anga
  rationale: שׁחקים ni neno la kishairi linaloweza kumaanisha anga, mbingu, au wakati mwingine mawingu. Hapa mfano wa kioo cha chuma unaelekeza kwenye anga linaloonekana; ‘anga’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: חֲזָקִים
  choice: yaliyo magumu
  rationale: Kivumishi kinaonyesha uimara wa anga katika tashbihi ya chuma. ‘Magumu’ hudumisha dhana ya ugumu na uthabiti kuliko ‘yenye nguvu.’
- source_word: כִּרְאִי
  choice: kama kioo
  rationale: ראי humaanisha kioo cha kujitazamia, na kiambishi כ huonyesha ulinganisho.
- source_word: מוּצָק
  choice: cha chuma kilichomiminwa
  rationale: Umbo hili hueleza kitu kilichomiminwa katika kalibu, hasa chuma. Tafsiri haibainishi shaba kwa kuwa maandishi hayasemi aina ya chuma.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Wingi wa kisemantiki wa שׁחקים umefasiriwa kwa nomino ya mkusanyiko ‘anga’; upatanisho wa wingi ‘yaliyo’ unaakisi umbo la wingi la Kiebrania. Alama zote za tanbihi zimo katika matini kuu.
