lexical_decisions:
- source_word: אַף לְזֹאת
  choice: Hata kwa hili
  rationale: Muunganiko huu unaendeleza wazo la jambo linalotajwa katika muktadha na kulisisitiza; “Hata kwa hili” huhifadhi nguvu ya kiunganishi na maana ya kuitikia jambo hilo.
- source_word: יֶחֱרַד
  choice: hutetemeka
  rationale: Kitenzi חרד huonyesha kutetemeka kwa hofu, kicho, au msukosuko; “hutetemeka” huhifadhi upana huo bila kuifanya hofu kuwa maana pekee.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: Hii ni tafsiri ya moja kwa moja inayohifadhi taswira ya Kiebrania ya moyo kama kitovu cha hali ya ndani.
- source_word: וְיִתַּר
  choice: na kuruka
  rationale: Kitenzi hiki kigumu kinaonyesha mwendo wa ghafla wa moyo; “kuruka” huhifadhi taswira hai bila kuipunguza kuwa hisia isiyo dhahiri.
- source_word: מִמְּקוֹמוֹ
  choice: kutoka mahali pake
  rationale: Kiambishi kinarejelea moyo, na usemi huo huonyesha kana kwamba moyo unasukumwa kutoka mahali pake pa kawaida.
