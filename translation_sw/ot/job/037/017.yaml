  text: you whose garments are hot when the earth is still because of the south wind?[a]
translation:
  language: sw
  text: Je, wewe ambaye mavazi yako yana joto wakati nchi imetulia kwa sababu ya upepo wa kusini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kusini.” Kiebrania husema kihalisi “kutoka kusini”; usemi huo unaweza kumaanisha kwa upana zaidi upande wa kusini. “Upepo wa kusini” huweka wazi maana inayohusu hali ya hewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: wewe ambaye
  rationale: Kihusishi hiki kinaendeleza swali kwa kumwelekea Ayubu moja kwa moja; “wewe ambaye” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בְּגָדֶיךָ
  choice: mavazi yako
  rationale: בגד humaanisha vazi au nguo; “mavazi” linafaa kwa mtindo wa kishairi wenye hadhi bila kuwa la kizamani.
- source_word: חַמִּים
  choice: huwa moto
  rationale: Kivumishi hiki humaanisha kuwa na joto au moto. “Huwa moto” kinaeleza hali ya mavazi katika joto kali kwa lugha ya kawaida.
- source_word: בְּהַשְׁקִט
  choice: wakati ... imetulia
  rationale: Umbo hili la שקט lina maana ya kuwa kimya, bila kusumbuliwa, au kutulia; בְּ hapa lina kazi ya wakati.
- source_word: אֶרֶץ
  choice: nchi
  rationale: אֶרֶץ inaweza kumaanisha dunia au nchi/ardhi. Katika maelezo haya ya hali ya hewa, “nchi” ni ya asili na haipanui maana bila lazima.
- source_word: מִדָּרוֹם
  choice: kwa sababu ya upepo wa kusini
  rationale: Kwa maana halisi ni “kutoka kusini,” lakini katika muktadha wa hali ya hewa kusini hudokeza upepo wa kusini wenye joto; tafsiri hii inaweka wazi maana ya kisababishi inayolingana na muktadha.
