  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: sw
  text: Chini ya mbingu zote huituma, na mwanga wake[a] hadi miisho ya dunia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umeme wake.” Kiebrania kinasema “mwanga wake,” ambao katika muktadha huu huenda unarejelea umeme.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “mabawa ya dunia,” usemi wa Kiebrania unaomaanisha sehemu za mbali kabisa za dunia.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: chini ya mbingu zote
  rationale: Huhifadhi taswira ya mahali ya Kiebrania, ‘chini ya mbingu zote,’ kwa Kiswahili cha kawaida chenye hadhi ya kishairi.
- source_word: יִשְׁרֵהוּ
  choice: huipeleka
  rationale: Kitenzi hiki cha kishairi kinaweza kumaanisha kupeleka, kuelekeza, au kuachilia. ‘Huipeleka’ ni cha asili katika Kiswahili na kinadumisha kiwakilishi cha kitu kilichotajwa katika muktadha uliotangulia bila kukitaja upya.
- source_word: וְאוֹרוֹ
  choice: na mwanga wake
  rationale: אוֹר kwa msingi ni ‘mwanga.’ Tafsiri hii inadumisha neno la chanzo na utata wake wa kishairi; muktadha wa dhoruba unaonyesha kwamba huenda mwanga huo ni umeme, jambo linaloelezwa katika tanbihi.
- source_word: עַל
  choice: hadi
  rationale: Ingawa עַל kwa kawaida ni ‘juu ya’ au ‘juu,’ hapa inaonyesha kufika au kuenea kwa mwanga mpaka sehemu za mbali; ‘hadi’ hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: כַּנְפוֹת הָאָרֶץ
  choice: miisho ya dunia
  rationale: Kwa neno moja moja ni ‘mabawa ya dunia,’ lakini huu ni usemi wa kishairi unaorejelea sehemu zake za mbali kabisa. ‘Miisho ya dunia’ huwasilisha maana hiyo kwa uwazi bila kupoteza uzito wa kishairi.
theological_decisions:
- issue: Utambulisho wa אוֹרוֹ katika taswira ya dhoruba
  choice: mwanga wake
  alternative: umeme wake
  rationale: Neno la Kiebrania lenyewe ni ‘mwanga,’ ingawa katika muktadha huenda linamaanisha umeme. Maandishi makuu yanahifadhi maana ya moja kwa moja na tanbihi inaonyesha uwezekano wa kimuktadha, bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa sentensi unafuata kwa karibu usambamba wa Kiebrania, huku ‘miisho ya dunia’ ikitumika kama usemi wa kawaida na unaoeleweka.
