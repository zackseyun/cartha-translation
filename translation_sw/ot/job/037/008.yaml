base_translation:
  language: en
  yaml_path: translation/ot/job/037/008.yaml
  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: sw
  text: Kisha mnyama wa mwituni huingia mahali pake pa kujificha[a], na hukaa katika makao yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huingia mahali pake pa kuvizia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Ndipo ... huingia
  rationale: Kitenzi hiki kinaendeleza mfuatano wa kishairi. Kauli ya mazoea katika wakati wa sasa inafaa maelezo ya matukio ya asili na tabia ya wanyama wakati wa hali hiyo ya hewa.
- source_word: חַיָּה
  choice: mnyama wa mwituni
  rationale: Neno linaweza kumaanisha mnyama kwa ujumla au mnyama asiye wa kufugwa. Katika muktadha huu ni jina la jumla, si spishi fulani.
- source_word: בְמוֹ אָרֶב
  choice: mafichoni pake
  rationale: אָרֶב huonyesha mahali pa kujificha au kuvizia. “Mafichoni pake” ni Kiswahili cha kawaida kinachohifadhi wazo la mahali palipositirika bila kulazimisha maana ya aina maalumu ya makao.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: na ... katika mapango yake
  rationale: מְעוֹנוֹת ni makao katika wingi, hapa yakiwa makao ya mnyama. “Mapango” ni usemi wa kawaida kwa makao hayo na huhifadhi wingi wa Kiebrania.
- source_word: תִשְׁכֹּן
  choice: kukaa
  rationale: שכן humaanisha kukaa au kuishi mahali. Hapa “kukaa” huonyesha mnyama kubaki katika makao baada ya kuingia humo.
