  terminology: '"Mnyama wa mwituni" is an appropriate generic rendering of חַיָּה in context. "Mahali pake pa kujificha" appropriately renders the first shelter term; "makao yake" is preferable for the plural מְעוֹנוֹתֶיהָ. No theological terminology is involved.'
