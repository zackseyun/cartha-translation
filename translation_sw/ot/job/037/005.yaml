  text: יַרְעֵ֤ם אֵ֣ל בְּ֭/קוֹל/וֹ נִפְלָא֑וֹת עֹשֶׂ֥ה גְ֝דֹל֗וֹת וְ/לֹ֣א נֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: sw
  text: Mungu hunguruma kwa sauti yake kwa namna ya ajabu[a]; hufanya mambo makuu tusiyoyajua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Mungu hunguruma maajabu kwa sauti yake.” Neno la Kiebrania linaweza kutafsiriwa kihalisi “maajabu,” lakini hapa huenda linaeleza jinsi anavyonguruma: “kwa namna ya ajabu.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “mambo makuu yaliyo nje ya ujuzi wetu,” au “mambo makuu tusiyoweza kuyaelewa.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: hunguruma
  rationale: Hifili ya רעם inaonyesha kutoa ngurumo. Katika muktadha wa dhoruba na sauti ya Mungu, “hunguruma” ni Kiswahili cha asili na chenye nguvu.
- source_word: אֵל
  choice: Mungu
  rationale: Jina la Mungu אֵל hapa halihitaji kupanuliwa kuwa cheo kama “Mungu Mwenyezi.”
- source_word: בְּקוֹלוֹ
  choice: kwa sauti yake
  rationale: Kiambishi ב kina maana ya chombo au njia hapa; “kwa sauti yake” huonyesha kuwa sauti ya Mungu ndiyo inayotoa ngurumo.
- source_word: נִפְלָאוֹת
  choice: kwa namna ya ajabu
  rationale: Ingawa kimuundo ni wingi unaoweza kumaanisha “maajabu,” hapa linaeleweka vizuri kama kielezi kinachoeleza jinsi Mungu anavyonguruma.
- source_word: עֹשֶׂה גְדֹלוֹת
  choice: hufanya mambo makuu
  rationale: 'עשה ni kitenzi kipana cha kufanya, na גְדֹלוֹת limetumiwa kama nomino ya wingi: “mambo makuu.”'
- source_word: וְלֹא נֵדָע
  choice: tusiyoyajua
  rationale: Tafsiri hii inaunganisha kifungu hicho na “mambo makuu” kwa Kiswahili cha kawaida bila kuimarisha ידע kuwa “hatuwezi kuelewa.”
theological_decisions:
- issue: Upeo wa kutokujua kwa wanadamu katika kifungu cha mwisho
  choice: mambo makuu tusiyoyajua
  alternative: mambo makuu yasiyoweza kufahamika kwetu
  rationale: Kiebrania kinasema kwa msingi “wala hatujui.” Tafsiri haipaswi kukifanya kuwa dai kali zaidi kwamba mambo hayo hayawezi kabisa kufahamika.
- issue: Kazi ya נִפְלָאוֹת katika kifungu cha kwanza
  choice: 'kielezi: “kwa namna ya ajabu”'
  alternative: 'kitu cha kitenzi: “hunguruma maajabu”'
  rationale: Muundo wa Kiebrania unaruhusu maana halisi ya “maajabu,” lakini matumizi ya kielezi yanafaa zaidi katika muktadha na yanatoa Kiswahili cha asili huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Wakati wa mazoea (“hunguruma,” “hufanya”) unaendana na kauli ya jumla kuhusu matendo ya Mungu. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
