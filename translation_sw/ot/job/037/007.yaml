  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: sw
  text: Hutia muhuri kwenye mkono wa kila mtu[a], ili watu wote wajue kazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hufunga mkono wa kila mtu.” Huenda usemi huu wa Kiebrania ukamaanisha kwamba Mungu husimamisha kazi za kawaida za wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: mkono
  rationale: Pamoja na kitenzi חתם, kihusishi ב kimetafsiriwa kwa njia ya kimatumizi kama yambwa la moja kwa moja; Kiswahili cha kawaida husema “hutia muhuri mkono,” huku taswira ya Kiebrania ikihifadhiwa.
- source_word: כָּל אָדָם
  choice: kila mtu
  rationale: אָדָם hapa ni umoja wenye maana ya jumla kwa wanadamu; “kila mtu” ni ya asili, jumuishi, na sahihi katika Kiswahili.
- source_word: יַחְתּוֹם
  choice: hutia muhuri
  rationale: Qal ya חתם ina maana ya kutia muhuri. Kauli hii huhifadhi sitiari bila kuamua kwa uhakika kama mkono unafungwa au kazi inakomeshwa.
- source_word: לָדַעַת
  choice: ili ... wajue
  rationale: Infinitivu yenye ל inaweza kuonyesha kusudi au matokeo; “ili ... wajue” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כָּל אַנְשֵׁי
  choice: watu wote
  rationale: Ingawa אַנְשֵׁי ni umbo la wingi wa kiume, maana yake hapa ni ya wanadamu kwa ujumla; “watu wote” ni sahihi na ya asili.
- source_word: מַעֲשֵׂהוּ
  choice: kazi yake
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya tatu ya kiume imetafsiriwa moja kwa moja. Katika muktadha inaelekea kumaanisha utendaji wa Mungu kwa ujumla.
theological_decisions:
- issue: Mhusika wa “hutia” na mwenye “kazi yake”
  choice: Mungu ndiye anayetiwa maanani katika kauli zote mbili.
  alternative: Dhoruba au majira ya baridi kuwa mtendaji.
  rationale: Katika hotuba ya Elihu kuhusu mamlaka ya Mungu juu ya hali ya hewa na uumbaji, Mungu ndiye mtangulizi wa kimuktadha aliye wazi zaidi; hata hivyo jina lake halijaongezwa katika matini.
- issue: Maana ya kutia muhuri mkono
  choice: Taswira ya kutia muhuri imehifadhiwa katika matini.
  alternative: Kutafsiri moja kwa moja kuwa Mungu hukomesha kazi za kawaida za wanadamu.
  rationale: Kielezi hicho ni kigumu na huenda kikamaanisha kuzuia shughuli ya binadamu, lakini tafsiri ya ufafanuzi ingefunga maana ambayo Kiebrania huiacha katika sitiari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kila mtu” na “watu wote” zinaonyesha maana ya jumla ya wanadamu bila kuingiza jinsia isiyokusudiwa. Alama ya tanbihi [a] imewekwa mara tu baada ya usemi mgumu unaofafanuliwa.
