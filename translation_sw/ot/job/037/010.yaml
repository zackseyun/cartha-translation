  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: sw
  text: 'Mungu hutoa barafu kwa pumzi yake[a],

    na eneo pana la maji huganda imara.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutokana na pumzi ya Mungu.” Kihusishi cha Kiebrania kinaweza kuonyesha chanzo (“kutokana na”) au njia (“kwa”).
    reason: lexical_alternative
  - marker: b
    text: Au, “na upana wa maji huganda imara,” au “huwa mgumu.” Usemi wa Kiebrania ni wa kishairi; unaweza kumaanisha eneo lililotandaa la maji linapoganda na kuwa imara.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: Kwa pumzi ya
  rationale: נִשְׁמָה ni ‘pumzi,’ na kiambishi מִן hapa kinaweza kuonyesha chanzo au njia. ‘Kwa pumzi ya’ ni Kiswahili cha asili kinachohifadhi taswira halisi na pia uwezekano wa maana hizo mbili.
- source_word: אֵל
  choice: Mungu
  rationale: אֵל hapa ni jina la kawaida la Mungu; hakuna sababu ya kulipanua kuwa ‘Mungu Mwenyezi.’
- source_word: יִתֶּן
  choice: hutokea
  rationale: Kitenzi נתן kwa kawaida ni ‘kutoa,’ lakini muundo ‘barafu hutolewa’ si wa kawaida katika Kiswahili. ‘Hutokea’ huwasilisha kwa uwazi kwamba barafu inakuja kwa pumzi ya Mungu bila kuongeza wazo la kisayansi la ‘kutengenezwa.’
- source_word: קָרַח
  choice: barafu
  rationale: קָרַח humaanisha barafu, si umande ulioganda tu, na inalingana na maji kuganda katika mstari unaofuata.
- source_word: וְרֹחַב מַיִם
  choice: na eneo pana la maji
  rationale: רֹחַב ni upana au eneo pana. Katika muktadha huu wa kishairi, ‘eneo pana la maji’ hueleweka kwa urahisi kuwa sehemu kubwa iliyotandaa ya maji.
- source_word: בְּמוּצָק
  choice: huganda kabisa
  rationale: מוּצָק huonyesha hali ya kufanywa imara au kuwa ngumu kama kitu kilichomiminwa na kukaza. Kwa maji, ‘huganda kabisa’ hutoa maana ya kimuktadha kwa Kiswahili cha sasa.
theological_decisions:
- issue: Je, מִן katika מִנִּשְׁמַת inaonyesha chanzo au njia?
  choice: Kwa pumzi ya Mungu
  alternative: Kutokana na pumzi ya Mungu
  rationale: Kiebrania kinaruhusu maana zote mbili. ‘Kwa’ linaweza kueleweka kama njia au sababu, huku tanbihi ikihifadhi wazi maana mbadala ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mpangilio wa mistari miwili unadumisha usambamba wa shairi la Kiebrania. ‘Huganda kabisa’ ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi taswira pana ya Kiebrania ya kuwa imara au ngumu.
