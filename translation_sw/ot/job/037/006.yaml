base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: sw
  text: Kwa maana huiambia theluji[a], “Ianguke ardhini,” na mvua, “Iwe manyunyu,” na mvua nyingi[b], “Iwe mvua kubwa ya nguvu zake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Iwe juu ya ardhi,” yaani theluji inaamriwa itokee au itande ardhini.
    reason: lexical_alternative
  - marker: b
    text: Kishazi cha mwisho kinaweza pia kutafsiriwa “na mvua zake zenye nguvu” au “na manyunyu makubwa ya nguvu zake.” Kiebrania ni kifupi na cha kishairi; “zake” katika muktadha inaweza kumrejelea Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya jinsi Mungu anavyotawala hali ya anga; kauli ya sababu au ufafanuzi inafaa katika muktadha.
- source_word: לַשֶּׁלַג
  choice: huiambia theluji
  rationale: Herufi ל pamoja na אמר humtaja anayeambiwa; tafsiri hii inadumisha taswira ya Mungu akiihutubia theluji.
- source_word: יֹאמַר
  choice: huiambia
  rationale: Hali ya kitenzi cha Kiebrania hapa inaeleza tendo la kawaida kwa uhai wa kishairi, si lazima wakati ujao.
- source_word: הֱוֵא אָרֶץ
  choice: Ianguke ardhini
  rationale: Kwa theluji, amri ya kuwa au kujitokeza duniani inaelezwa kwa Kiswahili cha kawaida kama kuanguka ardhini; uwezekano wa tafsiri ya moja kwa moja zaidi umehifadhiwa katika tanbihi.
- source_word: וְגֶשֶׁם מָטָר
  choice: na mvua, “Iwe manyunyu”
  rationale: Maneno mawili yanayohusiana na mvua yamewakilishwa bila urudiaji usioeleweka, huku usambamba wa amri ukiendelea.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: na mvua nyingi, “Ziandamane kwa nguvu zake”
  rationale: Wingi wa מִטְרוֹת unaashiria mvua nyingi au zilizoimarishwa; kishazi kilichobanwa kishairi kimetafsiriwa kama mwendelezo wa amri.
- source_word: עֻזּוֹ
  choice: kwa nguvu zake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kinaelekea kumrejelea Mungu, ambaye ndiye msemaji na mtawala wa hali ya anga katika muktadha.
theological_decisions:
- issue: Mrejelewa wa kiambishi katika עֻזּוֹ
  choice: 'Kinamrejelea Mungu: “nguvu zake.”'
  alternative: 'Kinaweza kurejelea mvua: “nguvu zake yenyewe” au “kwa kishindo chake.”'
  rationale: Mungu ndiye mhusika anayesema na kuamuru hali ya anga katika muktadha wa karibu. Hata hivyo, muundo wa Kiebrania ni mfupi na wa kishairi, kwa hiyo uwezekano mwingine umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na taswira ya Mungu akizungumza na hali ya anga vimedumishwa; tanbihi zinahifadhi utata wa הֱוֵא na kishazi cha mwisho.
