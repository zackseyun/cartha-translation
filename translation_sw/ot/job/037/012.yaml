base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: sw
  text: Hiyo huzunguka-zunguka kwa uongozi wake,[a] ili vifanye yote anayoviamuru juu ya uso wa ulimwengu unaokaliwa, duniani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa uelekezaji wake” au “kwa uendeshaji wake”; neno la Kiebrania linaweza kumaanisha uongozi au udhibiti wa ustadi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina usemi wenye tabaka, “ulimwengu unaokaliwa, kuelekea duniani,” unaosisitiza eneo la kidunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Huzunguka
  rationale: Kiwakilishi cha kiume cha umoja kinarejelea kwa upana hali au mkusanyiko wa mawingu unaozungumziwa katika muktadha; Kiswahili kinaweza kuiacha dhamira hiyo idokezwe na kitenzi bila kuibana kuwa kitu maalumu.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: Huzunguka huku na huku
  rationale: Muungano huu unaonyesha mwendo wa kugeuka na kubadili mwelekeo kwa kurudiarudia. Usemi huu ni wa kawaida na huhifadhi taswira bila kudokeza vurugu isiyotajwa.
- source_word: בְתחבולתו
  choice: kwa uongozi wake
  rationale: Nomino hiyo inaweza kumaanisha uelekezaji au uendeshaji wa ustadi; katika muktadha huu inaeleza udhibiti wa Mungu juu ya hali ya anga.
- source_word: לְפָעֳלָם
  choice: ili kutekeleza
  rationale: Muundo unaonyesha kusudi la mawakala hao kutenda walichoamriwa; 'kutekeleza' ni Kiswahili cha asili kinachoonyesha utendaji wenye kusudi.
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: yote anayoviamuru
  rationale: Kiambishi cha wingi katika kitenzi cha Kiebrania kinahifadhiwa kwa 'vi-', kikirejelea kwa upana vitu au nguvu za hali ya anga bila kuzitambulisha kwa namna finyu.
- source_word: עַל פְּנֵי תֵבֵל אָרְצָה
  choice: juu ya uso wa ulimwengu unaokaliwa, duniani
  rationale: Tafsiri hii huhifadhi taswira ya 'uso', maana ya תֵבֵל kama ulimwengu unaokaliwa, na neno la mwisho lenye mwelekeo wa kuelekea au eneo la dunia.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi cha umoja na viambishi vya wingi katika muktadha wa hali ya anga
  choice: Kirejelewa kinaachwa kuwa hali au mkusanyiko wa mawingu kwa upana, huku vitu vinavyoamriwa vikionyeshwa kwa kiambishi cha wingi.
  alternative: Kutaja moja kwa moja wingu, mawingu, radi, au mfumo wa dhoruba.
  rationale: Muktadha unahusu mawingu, umeme na dhoruba chini ya uongozi wa Mungu, lakini mstari huu hauhitaji utambulisho mwembamba wa kisayansi. Tafsiri huhifadhi mamlaka ya Mungu na utata halisi wa kirejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Huku na huku' huwasilisha kuzunguka na kubadili mwelekeo kwa kurudiarudia; sentensi haimtambulishi kwa lazima mhusika kama wingu moja wala mfumo maalumu wa hali ya anga.
