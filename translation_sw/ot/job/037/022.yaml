  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: sw
  text: Kutoka kaskazini huja fahari ya dhahabu; juu ya Mungu kuna utukufu wa kuogofya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצָּפוֹן
  choice: Kutoka kaskazini
  rationale: Huwakilisha kwa kawaida maana ya mahali pa asili iliyo katika maandishi.
- source_word: זָהָב
  choice: fahari ya dhahabu
  rationale: Neno lenyewe ni ‘dhahabu’, lakini hapa linaunganishwa na wazo la mng’ao au fahari; tafsiri hii inadumisha picha ya dhahabu bila kulazimisha iwapo kinachokusudiwa ni mwanga, hali ya anga, au fahari.
- source_word: יֶאֱתֶה
  choice: huja
  rationale: Hutoa maana ya kitenzi ‘kuja’ kwa usemi wa kishairi na wa jumla.
- source_word: עַל אֱלוֹהַּ
  choice: kumzunguka Mungu
  rationale: Ingawa עַל kwa kawaida ni ‘juu ya’ au ‘juu yake’, katika mstari huu uhusiano wa mahali unaweza kueleweka kama utukufu unaomzunguka au unaoambatana na Mungu; ‘kumzunguka’ ni Kiswahili cha asili na kinafuata muktadha wa kishairi.
- source_word: נוֹרָא הוֹד
  choice: utukufu wa kutisha
  rationale: Huhifadhi nguvu ya נורא (‘wenye kuogofya/kutisha’) na הוד (‘utukufu/fahari’) bila kuupunguza kuwa heshima tu.
theological_decisions:
- issue: Uhusiano wa utukufu na Mungu katika עַל אֱלוֹהַּ
  choice: kumzunguka Mungu kuna utukufu wa kutisha
  alternative: juu ya Mungu kuna utukufu wa kutisha
  rationale: ‘Kumzunguka’ hutoa picha inayoeleweka kwa Kiswahili na kuendana na matumizi mapana ya kihusishi עַל, bila kudai kwamba kuna kitu kilicho juu ya Mungu kwa cheo au mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Fahari ya dhahabu’ na ‘utukufu wa kutisha’ huhifadhi taswira na uzito wa mstari wa Kiebrania.
