  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: sw
  text: Kwa hiyo watu humwogopa; yeye hamjali mtu yeyote mwenye hekima moyoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “yeye hawaoni wenye hekima wote moyoni.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuona” au “kujali”; usemi huu huenda unasisitiza kwamba Mungu hawajali watu wenye hekima moyoni mbele zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo yaliyotangulia kuhusu ukuu wa Mungu, kwa Kiswahili cha kawaida na cha heshima.
- source_word: יְרֵאוּהוּ
  choice: humwogopa
  rationale: Kitenzi ירא kinaweza kumaanisha kuogopa, kustahi, au kustaajabu kwa hofu. “Humwogopa” kinadumisha uzito na upana wa maana ya msingi bila kuifanya iwe heshima tu.
- source_word: אֲנָשִׁים
  choice: watu
  rationale: Nomino hii inawahusu wanadamu kwa ujumla; “watu” ni tafsiri asilia na jumuishi katika Kiswahili.
- source_word: לֹא יִרְאֶה
  choice: yeye hawajali
  rationale: ראה maana yake ya moja kwa moja ni “kuona,” lakini hapa inaweza kutumiwa kwa maana ya kumwangalia mtu kwa kumthamini au kumjali. Kiwakilishi “yeye” kinaweka wazi mhusika bila kubadili rejeo lake la kimuktadha kwa Mungu.
- source_word: כָּל
  choice: wote
  rationale: “Wote” linahifadhi kwa karibu umbo la Kiebrania. Likiwa pamoja na ukanushi, linatoa maana ya kwamba hakuna hata mmoja katika kundi hilo anayejaliwa.
- source_word: חַכְמֵי לֵב
  choice: wenye hekima moyoni
  rationale: Linahifadhi sitiari ya Kiebrania kuhusu moyo kama kitovu cha ufahamu, bila kuongeza wazo lisilo wazi la kuwa wenye hekima machoni pao wenyewe.
theological_decisions:
- issue: Maana ya Mungu kutowaangalia wenye hekima moyoni
  choice: Mungu hawajali wale wenye hekima moyoni.
  alternative: Mungu hawaoni wale wote wenye hekima moyoni.
  rationale: Mhusika wa kitenzi cha umoja anaeleweka kwa kawaida kuwa Mungu kutokana na muktadha. “Hawajali” linawasilisha matumizi ya kiishara ya “kuona,” huku tanbihi ikihifadhi maana ya moja kwa moja na mvutano wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Humwogopa” huhifadhi uzito wa itikio la wanadamu kwa ukuu wa Mungu; “wenye hekima moyoni” huhifadhi nahau na sitiari ya chanzo.
