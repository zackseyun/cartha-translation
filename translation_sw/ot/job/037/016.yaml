  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: sw
  text: 'Je, unajua jinsi mawingu yanavyoning''inia[a],

    na maajabu ya yule aliye mkamilifu katika maarifa?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jinsi mawingu yanavyotandazwa.” Neno la Kiebrania ni adimu, na maana yake kamili si hakika; huenda linarejelea jinsi mawingu yanavyotandazwa au kusimamishwa angani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Je, unajua
  rationale: Kiulizi הֲ pamoja na kitenzi ידע kinaweka swali la balagha linalomwelekea Ayubu. ‘Je, unajua’ ni la moja kwa moja na la kawaida katika Kiswahili.
- source_word: עַל
  choice: jinsi
  rationale: Katika muundo wa Kiswahili, wazo la kujua kuhusu hali au utendaji wa mawingu linaelezwa kwa kawaida kwa ‘unajua jinsi...’; hii inawasilisha uhusiano wa mada unaoonyeshwa na עַל.
- source_word: מִפְלְשֵׂי עָב
  choice: jinsi mawingu yanavyoning'inia
  rationale: Nomino מִפְלְשֵׂי ni adimu na maana yake kamili si hakika. Katika muktadha huenda inaeleza mawingu yaliyotandazwa au kusimamishwa angani. ‘Yanavyoning'inia’ ni Kiswahili cha asili kinachodumisha picha ya mawingu kusalia yamesimamishwa, huku dokezo likihifadhi maana mbadala.
- source_word: מִפְלְאוֹת
  choice: maajabu
  rationale: ‘Maajabu’ huwasilisha kwa ufupi matendo au matukio ya kustaajabisha yanayomaanishwa na מִפְלְאוֹת.
- source_word: תְּמִים
  choice: mkamilifu
  rationale: Hapa תְּמִים inaonyesha ukamilifu au utimilifu, si kutokuwa na lawama kwa maana finyu ya kimaadili.
- source_word: דֵּעִים
  choice: katika maarifa
  rationale: Wingi wa Kiebrania huenda unasisitiza utimilifu au wingi wa ujuzi. ‘Katika maarifa’ ni usemi wa heshima unaohifadhi maana hiyo bila kutumia wingi usio wa kawaida katika Kiswahili.
theological_decisions:
- issue: Anayerejelewa na ‘yeye aliye mkamilifu katika maarifa’
  choice: Kuacha mrejelewa akiwa ametajwa kwa njia isiyo ya moja kwa moja, kama katika Kiebrania
  alternative: Kumtaja wazi kuwa Mungu
  rationale: Muktadha unaelekeza kwa Mungu, lakini Kiebrania hakiingizi jina ‘Mungu’ katika kishazi hiki. Tafsiri inadumisha usemi huo ili muktadha ndio utambulishe mrejelewa bila kuondoa mvutano uliopo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa. Mstari umegawanywa kishairi ili kuonyesha ulinganifu wa vishazi, na alama ya dokezo [a] imewekwa mara baada ya kirai kinachohusika.
