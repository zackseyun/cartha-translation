  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: sw
  text: Tujulishe tutamwambia nini; hatuwezi kuyapanga maneno yetu[a] kwa sababu ya giza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatuwezi kupanga hoja zetu” au “hatuwezi kuweka kesi yetu kwa utaratibu.”
    reason: lexical_alternative
  - marker: b
    text: “Giza” huenda likamaanisha kwa njia ya mfano kutojua au kutoweza kwa mwanadamu, ingawa maana halisi pia inawezekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: Tujulishe
  rationale: Kitenzi hiki katika kausativi na hali ya kuamuru humaanisha ‘tufanye tujue’ au ‘tujulishe.’ ‘Tujulishe’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza wazo lisilokuwamo.
- source_word: מַה נֹּאמַר לוֹ
  choice: tumwambie nini
  rationale: Muundo huu unaeleza jambo ambalo wasemaji wanataka kujulishwa. ‘Tumwambie nini’ huwasilisha kwa kawaida nguvu ya swali la kutafakari kuhusu watakalosema kwake.
- source_word: לֹא נַעֲרֹךְ
  choice: hatuwezi kuyapanga maneno yetu
  rationale: Kitenzi ערך humaanisha kupanga au kuweka kwa utaratibu. Ingawa ‘maneno yetu’ hayajasemwa wazi katika Kiebrania, yamedokezwa na muktadha wa kusema na yanafanya kauli iwe wazi na ya kawaida kwa Kiswahili; tanbihi huhifadhi uwezekano wa maana ya kupanga hoja au kesi.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: kwa sababu ya giza
  rationale: מִפְּנֵי hapa inaeleweka kwa kawaida kuwa ‘kwa sababu ya,’ huku חֹשֶׁךְ ikibaki ‘giza’ bila kuamua kama ni giza halisi au taswira ya kutojua na kutoweza kwa mwanadamu.
theological_decisions:
- issue: Maana ya ‘giza’ katika kishazi cha mwisho
  choice: Kudumisha neno pana ‘giza’ bila kulifafanua zaidi
  alternative: kwa sababu ya ujinga wetu; kwa sababu kuna giza
  rationale: Ushairi wa Kiebrania unaacha wazi kama giza ni halisi au ni taswira ya ukomo, kutojua, au kutoweza kwa mwanadamu mbele za Mungu. Tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Tujulishe’ na ‘tumwambie nini’ ni miundo ya kawaida na inayoeleweka; taswira fupi ya ‘giza’ imehifadhiwa bila maelezo ya kimadhehebu.
