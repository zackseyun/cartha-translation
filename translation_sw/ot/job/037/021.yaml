base_translation:
  language: en
  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: sw
  text: Na sasa hawaioni nuru[a], ingawa ni angavu mbinguni[b]; lakini upepo hupita na kuzisafisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawajaiona nuru iliyo angavu mbinguni”; mfuatano wa maneno ya Kiebrania ni mfupi na unaweza kueleweka bila maana ya “ingawa”.
    reason: alternative_reading
  - marker: b
    text: Kiambishi cha yambwa katika “kuzisafisha” ni cha wingi, na huenda kinarejelea mbingu au mawingu; wengine huelewa maana ya jumla kuwa “kulifanya anga liwe safi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Hudumisha kiunganishi ו pamoja na maana ya wakati ya עַתָּה kwa Kiswahili cha kawaida.
- source_word: לֹא רָאוּ
  choice: hawaioni
  rationale: Wakati timilifu wa Kiebrania unaweza kueleza hali ya sasa au ya kawaida katika muktadha huu; umbo la wingi lisilo na kiima kilichotajwa limehifadhiwa.
- source_word: אוֹר
  choice: nuru
  rationale: Neno la jumla ‘nuru’ linashikamana na Kiebrania bila kulibana kuwa mwanga wa jua pekee.
- source_word: בָּהִיר הוּא
  choice: ingawa inang'aa
  rationale: Huwasilisha uangavu wa nuru na uhusiano wa kukubali hali inayokinzana—nuru iko angavu lakini haionekani—bila kufanya sentensi kuwa nzito.
- source_word: בַּשְּׁחָקִים
  choice: mbinguni
  rationale: שְׁחָקִים inaweza kumaanisha anga za juu au mawingu; ‘mbinguni’ huhifadhi taswira pana ya kishairi bila kuamua kwamba ni mawingu pekee.
- source_word: וְרוּחַ
  choice: lakini upepo
  rationale: רוּחַ hapa ni upepo wa hali ya hewa. ‘Lakini’ huonyesha badiliko linalotokea baada ya nuru kutoonekana.
- source_word: עָבְרָה
  choice: hupita
  rationale: Hutoa maelezo hai ya mwendo wa upepo katika hali ya kawaida au inayoshuhudiwa sasa.
- source_word: וַתְּטַהֲרֵם
  choice: na kuzisafisha
  rationale: טהר hapa ina maana ya kufanya safi au wazi. Kiambishi cha yambwa cha wingi kimehifadhiwa kwa ‘-zi-’, kikirejelea kwa uwezekano mkubwa mbingu au mawingu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mbinguni’ na ‘nuru’ hudumisha hadhi ya lugha ya hekima; tanbihi huhifadhi utata wa muundo wa Kiebrania na wa yambwa ya wingi.
