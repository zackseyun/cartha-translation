translation:
  language: sw
  text: Sikilizeni kwa makini[a] mtetemeko wa sauti yake, na ngurumo[b] inayotoka kinywani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikilizeni, naam, sikilizeni.” Muundo wa Kiebrania unasisitiza amri ya kusikiliza.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “ngurumo” linaweza pia kumaanisha “mvumo,” “mguno,” au “sauti ya chini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Sikiliza kwa makini
  rationale: Kitenzi cha amri pamoja na kitenzi-jina cha kusisitiza huipa amri nguvu. Kiswahili ‘kwa makini’ kinawasilisha msisitizo huo kwa lugha ya kawaida bila marudio yasiyo ya asili.
- source_word: בְּרֹגֶז
  choice: mtetemeko wa
  rationale: רֹגֶז inaweza kumaanisha kutetemeka, kufadhaika, au kughadhibika. Katika taswira ya dhoruba, ‘mtetemeko’ hudokeza nguvu ya sauti inayotikisa bila kuifanya moja kwa moja kuwa hasira.
- source_word: קֹלוֹ
  choice: sauti yake
  rationale: קוֹל inaweza kuwa sauti au sauti ya usemi. Kutaja kinywa katika mstari unaofuata kunaunga mkono kuhifadhi taswira ya sauti yake.
- source_word: וְהֶגֶה
  choice: ngurumo
  rationale: הֶגֶה hueleza sauti ya chini kama mnong’ono, mguno, au mvumo. Katika muktadha wa dhoruba, ‘ngurumo’ ni ya asili na inafaa taswira ya radi.
- source_word: מִפִּיו יֵצֵא
  choice: inayotoka kinywani mwake
  rationale: Huhifadhi picha halisi ya kitu kinachotoka katika kinywa chake na ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa viungo vya kibinadamu katika taswira ya dhoruba
  choice: Kuhifadhi ‘sauti yake’ na ‘kinywani mwake’
  alternative: Kuondoa ubinadamu wa taswira kwa kusema ‘sauti ya radi’ au ‘mvumo wake’
  rationale: Kiebrania kinaonyesha dhoruba kishairi kama usemi wa Mungu mwenyewe. Kuhifadhi taswira hiyo kunalinda nguvu yake ya kifasihi na kitheolojia bila kuifafanua kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ngurumo’ hutoa taswira ya dhoruba kwa ufasaha; ‘mtetemeko wa sauti yake’ huhifadhi utata wa רֹגֶז badala ya kuamua kwamba ni hasira.
