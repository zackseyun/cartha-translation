  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: sw
  text: Je, unajua jinsi Mungu anavyoweka hayo juu yao[a], na kuufanya mwanga wa wingu lake uangaze[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu anapoyaweka mahali pake,” au “jinsi Mungu anavyoyaamuru.” Kiebrania ni kifupi na hakitaji wazi kitu kinachowekwa wala wale wanaorejelewa na “wao.”
    reason: alternative_reading
  - marker: b
    text: Au, “kuufanya mng’ao wa wingu lake umulike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Je, unajua
  rationale: Kitenzi ידע katika swali la balagha kinauliza moja kwa moja kama Ayubu anajua; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּשׂוּם
  choice: jinsi ... anavyoweka
  rationale: ב pamoja na kitenzi-jina שום inaweza kuonyesha namna au wakati. Baada ya ‘unajua,’ ‘jinsi ... anavyoweka’ ni ya asili na bado haitaji kitendo mahususi zaidi ya Kiebrania.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni umbo la kishairi la umoja linalomaanisha Mungu; hakuna msingi wa kuongeza jina au sifa nyingine.
- source_word: עֲלֵיהֶם
  choice: juu yao
  rationale: Tafsiri hii huhifadhi kiwakilishi cha wingi na haibainishi kinachorejelewa, kwa kuwa muktadha pekee ndio unaodokeza mawingu au matukio ya hali ya anga.
- source_word: וְהוֹפִיעַ
  choice: na kuufanya ... uangaze
  rationale: Hifili ya יפע ina maana ya kusababisha nuru ionekane au iangaze. Muundo huu unaeleweka na unaonyesha usababishaji.
- source_word: אוֹר
  choice: mwanga
  rationale: אוֹר humaanisha nuru au mwanga; ‘mwanga’ ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: עֲנָנוֹ
  choice: wingu lake
  rationale: Nomino iko katika umoja ikiwa na kiambishi cha nafsi ya tatu umoja; tafsiri inadumisha umoja huo bila kuongeza wazo la dhoruba.
theological_decisions:
- issue: Kitu ambacho Mungu anaweka na rejeleo la ‘wao’
  choice: Kutumia ‘hayo juu yao’ bila kufafanua ‘hayo’ au ‘wao’ ni nini
  alternative: Kusema Mungu anaweka amri yake juu ya mawingu au kuyaweka mawingu mahali pake
  rationale: Kiebrania hakitaji wazi yambwa la שום, na kiwakilishi ‘wao’ hutegemea muktadha. Tafsiri hii hudumisha utata wa kifungu badala ya kuingiza maelezo mahususi ya hali ya anga.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa, pamoja na utata wa kishairi wa Kiebrania. ‘Hayo’ hurejelea kwa namna isiyo bayana mambo ya hali ya anga katika muktadha, bila kuyataja moja kwa moja.
