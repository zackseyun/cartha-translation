  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: sw
  text: Kutoka chumbani[a] huja dhoruba, na kutoka kwa pepo zinazotawanya[b] huja baridi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kusini huja dhoruba.” Kiebrania kinasema kihalisi “kutoka chumbani”; huenda hii ni picha ya kishairi ya eneo la kusini au ghala la siri la dhoruba.
    reason: alternative_reading
  - marker: b
    text: Au, “kutoka kaskazini huja baridi,” au “kutoka kwa pepo zinazosambaza huja baridi.” Neno la Kiebrania ni adimu, na maana yake kamili haijulikani kwa uhakika.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: kutoka chumbani
  rationale: Neno חֶדֶר kimsingi humaanisha chumba au chumba cha ndani. Katika ushairi huu linaweza kuashiria mahali pa siri ambako dhoruba hutokea, lakini tafsiri kuu inadumisha picha halisi bila kulifanya moja kwa moja kuwa upande wa kusini.
- source_word: תָּבוֹא
  choice: huja
  rationale: Kitenzi בוא humaanisha kuja au kufika. Kauli “huja” ni ya kawaida na inafaa kwa maelezo ya hali ya hewa.
- source_word: סוּפָה
  choice: dhoruba
  rationale: סוּפָה huonyesha tufani au dhoruba kali. “Dhoruba” ni neno la kawaida na pana kuliko “kisulisuli,” ambalo lingeweka maana nyembamba zaidi.
- source_word: וּמִמְּזָרִים
  choice: kutoka kwa pepo zinazotawanya
  rationale: מְזָרִים ni neno adimu lenye maana isiyo hakika. Linaweza kuhusishwa na kutawanya, hivyo tafsiri hii inadumisha uwezekano huo bila kulifanya kwa uhakika kuwa jina la upande wa kaskazini.
- source_word: קָרָה
  choice: baridi
  rationale: קָרָה humaanisha baridi, hali ya kuganda, au sakafu ya barafu. “Baridi” ni fupi, ya asili, na hailazimishi maana mahususi zaidi ya maandishi.
