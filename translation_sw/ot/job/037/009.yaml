  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Mpangilio wa vishazi umefanywa kuwa wa kawaida kwa msomaji wa leo huku usambamba wa dhoruba na baridi ukihifadhiwa. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
