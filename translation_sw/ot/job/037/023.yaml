base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: sw
  text: Mwenyezi—hatuwezi kumfahamu kikamilifu[a]—ni mkuu kwa nguvu; ana haki[b] na uadilifu mwingi, wala haonei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hatuwezi kumchunguza kabisa” au “hatuwezi kumfikia.”
    reason: lexical_alternative
  - marker: b
    text: Au “hukumu.”
    reason: lexical_alternative
  - marker: c
    text: Au “hatesi.” Wengine huelewa kitenzi hiki kuwa “hajibu,” lakini maana hiyo haipatani vizuri sana na muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Jina hili la cheo humtaja Mungu kuwa mwenye uwezo mkuu; “Mwenyezi” ni tafsiri ya kawaida na inayoeleweka katika Kiswahili, badala ya kuandika tu “Shadai.”
- source_word: לֹא מְצָאנֻהוּ
  choice: hatuwezi kumfahamu kikamilifu
  rationale: Kitenzi מצא kimsingi ni “kupata/kumfikia,” lakini hapa kinaeleza kutoweza kumchunguza au kumwelewa Mungu kikamilifu. Tafsiri hii inaonyesha maana ya muktadha bila kudai kwamba wanadamu hawawezi kumjua Mungu kwa namna yoyote.
- source_word: שַׂגִּיא כֹחַ
  choice: ni mkuu kwa nguvu
  rationale: שַׂגִּיא hueleza ukuu au wingi, na כֹחַ ni nguvu. Usemi huu wa Kiswahili unafuata muundo na maana ya Kiebrania kwa njia ya kawaida.
- source_word: וּמִשְׁפָּט
  choice: katika haki
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu au haki. Hapa inaunganishwa na uadilifu kama sifa ya Mungu, kwa hiyo “haki” inafaa katika muktadha.
- source_word: וְרֹב צְדָקָה
  choice: na uadilifu mwingi
  rationale: רֹב huonyesha wingi, na צְדָקָה huonyesha unyofu au uadilifu wa kimaadili. Tafsiri hii inahifadhi nomino pamoja na msisitizo wake.
- source_word: לֹא יְעַנֶּה
  choice: yeye haonei
  rationale: Katika umbo la Piel, ענה kwa kawaida humaanisha kutesa, kunyanyasa, au kuonea. “Haonei” ni ya kawaida katika Kiswahili na inaendana na kutajwa kwa haki na uadilifu, bila kupanua dai kupita kiasi.
theological_decisions:
- issue: Jinsi ya kuelewa לֹא יְעַנֶּה kuhusiana na haki na uadilifu wa Mungu
  choice: Kauli inasema kwamba Mungu haonei.
  alternative: Kauli inaweza kueleweka kuwa “hajibu,” ikisisitiza kwamba Mungu hayuko chini ya wito wa mwanadamu wa kujieleza.
  rationale: Katika sifa ya Elihu kuhusu ukuu na unyofu wa Mungu, maana ya kuonea/kutesa inaendana vizuri zaidi na kutajwa kwa haki na uadilifu. Hata hivyo, maana mbadala ya “kujibu” imehifadhiwa katika tanbihi badala ya kuondoa utata wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari ya katikati imetumiwa kuhifadhi mkazo wa kishairi, na istilahi za haki na uadilifu zimetofautishwa bila kutumia lugha ya dhehebu.
