lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: Hatarajii
  rationale: Kitenzi katika muktadha huu kinaonyesha kutokuwa na matarajio au uhakika wa jambo la wakati ujao, si imani ya kidini.
- source_word: שׁוּב
  choice: kurudi
  rationale: Hueleza kurudi au kutoka tena katika hali iliyotajwa.
- source_word: מִנִּי חֹשֶׁךְ
  choice: kutoka gizani
  rationale: Kihusishi מן pamoja na 'giza' huonyesha kutoka katika hali ya taabu, maangamizi, au huzuni; tafsiri hii pia inadumisha picha ya Kiebrania.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: naye amekusudiwa kuuawa kwa upanga
  rationale: Umbo la צפה ni gumu hapa. Tafsiri hii huwasilisha tishio la kifo cha vurugu kwa Kiswahili cha kawaida, bila kuficha kwamba tungo ya Kiebrania inaweza kueleweka kwa namna nyingine.
- source_word: חָרֶב
  choice: upanga
  rationale: Upanga hapa ni chombo na pia picha ya kifo cha vurugu au hukumu.
theological_decisions:
- issue: Maana ya giza na upanga
  choice: Picha zimedumishwa bila kuzifafanua moja kwa moja kuwa hukumu ya Mungu.
  alternative: Kutaja wazi maangamizi au hukumu ya Mungu.
  rationale: Mstari unaonyesha hatari na kifo kinachokaribia, lakini hauitaji tafsiri kuainisha kwa undani chanzo au namna ya hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. 'Kuuawa kwa upanga' ni ya asili zaidi kuliko 'amekusudiwa kwa upanga,' huku tanbihi ikihifadhi utata wa kitenzi cha Kiebrania.
