  text: Hatarajii kurudi kutoka gizani, naye amewekewa upanga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye upanga unamngojea,” “naye amekusudiwa kwa upanga,” au “naye anatazamiwa na upanga.” Kitenzi cha Kiebrania ni kigumu; huenda tungo hii ikaonyesha tishio la kifo cha vurugu kinachokaribia.
