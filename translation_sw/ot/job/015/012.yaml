  text: Why does your heart carry you away[a], and why do your eyes flash?
translation:
  language: sw
  text: Kwa nini moyo wako unakupeleka mbali, na kwa nini macho yako yanakonyeza[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yanatoa ishara,” au huenda “yanageuza-geuza macho”; kitenzi cha Kiebrania ni adimu, na maana yake mahsusi haina uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Kwa nini
  rationale: Ingawa kihalisi ni ‘nini’, hapa linaanzisha swali la balagha kuhusu sababu au msukumo; ‘Kwa nini’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: יִקָּחֲךָ
  choice: unakuchukua
  rationale: Kitenzi לקח humaanisha ‘chukua’. Moyo ndio kiima na kiambishi cha nafsi ya pili ndio yambwa; tafsiri hii inadumisha sitiari ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: לִבֶּךָ
  choice: moyo wako
  rationale: ‘Moyo’ humaanisha utu wa ndani, ukiwemo uwezo wa kufikiri na kuhisi. Taswira ya moja kwa moja inaeleweka katika Kiswahili.
- source_word: וּמַה
  choice: na kwa nini
  rationale: Kiunganishi pamoja na kiulizi kinaendeleza swali la balagha kuhusu sababu au msukumo.
- source_word: יִרְזְמוּן
  choice: yanakonyeza
  rationale: Kitenzi hiki ni adimu na maana yake kamili haina uhakika. ‘Konyeza’ ni mojawapo ya maana zinazoshuhudiwa na inadumisha kitendo cha macho bila kulazimisha wazo la hasira ambalo haliko wazi katika neno lenyewe.
- source_word: עֵינֶיךָ
  choice: macho yako
  rationale: Tafsiri ya moja kwa moja ni ya kawaida na inadumisha taswira ya mwili katika shutuma ya Elifazi.
