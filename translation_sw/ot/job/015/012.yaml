  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili ya balagha na sitiari ya moyo umehifadhiwa. Kutokuwa na uhakika kwa kitenzi adimu יִרְזְמוּן kumeachwa wazi katika uamuzi wa kileksika; ‘yanakonyeza’ imechaguliwa kuliko tafsiri yenye kuongeza hisia kama ‘yanawaka.’
