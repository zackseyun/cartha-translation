  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: sw
  text: Hataondokana na giza; mwali utakausha machipukizi yake[b], naye atatoweka kwa pumzi ya kinywa chake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye atatoweka kwa pumzi ya kinywa Chake,” ikiwa kishazi cha mwisho kinaeleweka kuwa kinamrejelea Mungu badala ya mtu mwovu.
    reason: alternative_reading
  - marker: b
    text: '“Machipukizi yake” huhifadhi taswira ya mmea: mtu mwovu anaonyeshwa kama mti ambao ukuaji wake mchanga unaunguzwa na kukaushwa.'
    reason: cultural_note
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: Hataondoka gizani
  rationale: Kitenzi סור humaanisha kuondoka au kugeuka kando. Pamoja na מן na ‘giza,’ kauli hii inaonyesha kwamba mtu mwovu hataweza kuondokana na giza au maafa, huku ikibaki karibu na muundo wa Kiebrania.
- source_word: יֹנַקְתּוֹ
  choice: machipukizi yake
  rationale: Nomino hii hutaja chipukizi au tawi changa la mmea. ‘Machipukizi yake’ ni Kiswahili cha kawaida kinachohifadhi taswira ya mtu mwovu kama mti.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: mwali wa moto utakausha
  rationale: Katika Piel, יבש humaanisha kukausha au kunyauusha, na שַׁלְהֶבֶת ni mwali. Tafsiri hii inahifadhi picha ya ukuaji wa mmea unaochomwa na kukauka.
- source_word: וְיָסוּר
  choice: naye atatoweka
  rationale: Ingawa kitenzi kilekile kinaweza kutafsiriwa ‘ataondoka,’ hapa kinaelekea kueleza kuondolewa au kuangamia kwa mtu mwovu. ‘Atatoweka’ ni ya asili kwa Kiswahili na huwasilisha matokeo bila kuongeza maelezo ya kidhehebu.
- source_word: בְּרוּחַ פִּיו
  choice: kwa pumzi ya kinywa chake
  rationale: רוּחַ inaweza kuwa pumzi, upepo, au roho. Ikiunganishwa na ‘kinywa,’ ‘pumzi’ ndiyo maana halisi iliyo ya kawaida na inadumisha uwezekano wa kuelewa kauli hiyo kama pumzi yenye kuangamiza.
- source_word: פִּיו
  choice: kinywa chake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kwa kawaida humrejelea mtu mwovu aliyetajwa katika muktadha wa karibu. Kiebrania hakionyeshi wazi mabadiliko ya mhusika; uwezekano wa kumrejelea Mungu umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mhusika anayerejelewa na ‘kinywa chake’ katika kishazi cha mwisho
  choice: kinywa cha mtu mwovu
  alternative: kinywa cha Mungu
  rationale: Kisarufi, rejeleo la karibu zaidi ni mtu mwovu anayeelezwa katika muktadha. Hata hivyo, kwa kuwa ‘pumzi ya kinywa’ inaweza pia kueleza hukumu ya Mungu, uwezekano huo umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama ushairi wa hekima; ‘machipukizi’ huhifadhi sitiari ya mmea, na ‘pumzi ya kinywa’ huhifadhi utata wa רוּחַ. Tanbihi [c] lazima iwe na alama yake katika matini kuu ili kutimiza ulinganifu wa alama.
