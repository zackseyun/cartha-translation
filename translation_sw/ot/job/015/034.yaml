lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa kauli iliyotangulia bila kufafanua uhusiano huo kupita kiasi.
- source_word: עֲדַת
  choice: kusanyiko la
  rationale: Neno hilo humaanisha kundi au jamii iliyokusanyika; ‘kusanyiko’ ni la kawaida na halilazimishi maana maalumu ya kidini.
- source_word: חָנֵף
  choice: wasiomcha Mungu
  rationale: Katika Ayubu neno hili mara nyingi huonyesha watu wasiomjali au wasiomcha Mungu, si unafiki wa kijamii peke yake. Wingi unafaa kwa maana ya pamoja baada ya ‘kusanyiko.’
- source_word: גַּלְמוּד
  choice: halizai matunda
  rationale: Kivumishi huonyesha hali ya kuwa tasa, tupu, au isiyo na uzao; usemi huu wa Kiswahili huhifadhi picha ya kutokuwa na matokeo ya kudumu.
- source_word: וְאֵשׁ
  choice: na moto
  rationale: Huhifadhi kiunganishi na taswira ya moja kwa moja ya moto.
- source_word: אָכְלָה
  choice: huteketeza
  rationale: Kauli timilifu ya Kiebrania hapa inaweza kueleza ukweli wa jumla kwa nguvu; ‘huteketeza’ huwasilisha maana hiyo ya kimethali.
- source_word: אָהֳלֵי
  choice: mahema
  rationale: Huhifadhi taswira halisi na mazingira ya kale badala ya kuibadili kuwa ‘nyumba’.
- source_word: שֹׁחַד
  choice: yaliyojengwa kwa hongo
  rationale: Kihalisi ni ‘mahema ya hongo’; usemi uliochaguliwa unaonyesha mali au makao yaliyopatikana kwa faida ya ufisadi bila kuongeza wazi wahusika ambao hawakutajwa.
