  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: sw
  text: Kwa maana kusanyiko la watu wasiomcha Mungu ni tasa[a], na moto huteketeza mahema ya hongo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanyiko la mnafiki ni tasa.” Neno la Kiebrania חָנֵף linaweza kumaanisha “mnafiki,” lakini katika kitabu cha Ayubu mara nyingi lina maana pana ya mtu asiye mcha Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mahema ya hongo.” Usemi huu wa mkato unamaanisha makao yanayohusishwa na hongo au faida ya hongo.
