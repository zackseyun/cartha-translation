translation:
  language: sw
  text: Je, wewe ndiye mwanadamu wa kwanza kuzaliwa[a]? Je, ulizaliwa kabla ya vilima?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, wewe ulizaliwa ukiwa Adamu, mwanadamu wa kwanza?” Kiebrania kinasema “mwanadamu wa kwanza” na huenda kinamdokeza Adamu bila kutumia waziwazi neno hilo kama jina maalumu.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: ukiwa mwanadamu wa kwanza
  rationale: Kiulizi הֲ kinaanzisha swali la balagha. רִאשׁוֹן huonyesha kutangulia kwa wakati, na אָדָם hapa inaeleweka kwa kawaida kama ‘mwanadamu’ kuliko jina maalumu Adamu.
- source_word: תִּוָּלֵד
  choice: ulizaliwa
  rationale: Nifali ya ילד kwa kawaida humaanisha ‘kuzaliwa’; Kiswahili hiki ni cha moja kwa moja na cha kawaida.
- source_word: וְ/לִ/פְנֵי גְבָעוֹת
  choice: kabla ya vilima
  rationale: Huhifadhi uhusiano wa wakati na taswira ya kishairi ya vilima vya kale.
- source_word: חוֹלָלְתָּ
  choice: ulizaliwa
  rationale: Kitenzi kina taswira ya kuzaa au kuletwa duniani. Kurudia ‘ulizaliwa’ ni kwa kawaida zaidi katika Kiswahili kuliko ‘uliletwa duniani,’ ingawa kunapunguza tofauti ya kitenzi na ילד.
theological_decisions:
- issue: Iwapo אָדָם ni jina maalumu Adamu au nomino ya jumla ‘mwanadamu’
  choice: mwanadamu wa kwanza
  alternative: Adamu, mwanadamu wa kwanza
  rationale: Kiebrania hakilazimishi kusoma אָדָם kama jina maalumu hapa. Tafsiri ya jumla huhifadhi uwezekano wa dokezo kwa Adamu bila kulifanya wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali mawili mafupi yanahifadhi nguvu ya changamoto ya balagha; ‘vilima’ kinadumisha taswira ya kishairi.
