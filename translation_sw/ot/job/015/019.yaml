  text: לָ/הֶ֣ם לְ֭/בַדָּ/ם נִתְּנָ֣ה הָ/אָ֑רֶץ וְ/לֹא עָ֖בַר זָ֣ר בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/019.yaml
  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: sw
  text: Ni wao peke yao waliopewa nchi[a], wala hakuna mgeni aliyepita katikati yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dunia.” Neno la Kiebrania linaweza kumaanisha “nchi” au “dunia”; hapa “nchi” imependekezwa kwa sababu inazungumzia eneo walilopewa watu fulani na ambalo halikupitiwa na watu wa nje.
    reason: lexical_alternative
  - marker: b
    text: Au “wala hakuna mtu wa kigeni aliyepita miongoni mwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: wao peke yao
  rationale: Muunganiko huu unasisitiza kwamba nchi ilitolewa kwao tu. Kiswahili hiki ni cha asili na kinahifadhi mkazo wa upekee.
- source_word: נִתְּנָה
  choice: waliopewa
  rationale: Kitenzi cha Kiebrania kiko katika hali ya kutendwa. Muundo wa Kiswahili ‘Ni wao ... waliopewa’ unahifadhi hali hiyo huku ukitoa sentensi iliyo wazi na ya kawaida.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: אֶרֶץ inaweza kumaanisha ‘nchi’ au ‘dunia’; hapa wazo la eneo lililopewa watu fulani na kutopitiwa na watu wa nje linaunga mkono ‘nchi’.
- source_word: וְלֹא
  choice: wala hakuna
  rationale: Huu ni ukanushaji wa Kiswahili ulio wa asili katika kishazi cha pili na unaendeleza kwa nguvu wazo la kutengwa.
- source_word: עָבַר
  choice: aliyepita
  rationale: עבר humaanisha kupita au kuvuka. ‘Aliyepita’ huhifadhi maana ya mwendo bila kuongeza maelezo yasiyokuwapo wazi katika kitenzi.
- source_word: זָר
  choice: mgeni
  rationale: זָר humaanisha mtu wa nje au asiye wa kundi hilo. ‘Mgeni’ ni neno la kawaida na lenye hadhi, ingawa linaweza pia kueleweka kama ‘mtu wa kigeni’.
- source_word: בְּתוֹכָם
  choice: katikati yao
  rationale: Kirai hiki kwa msingi humaanisha ‘katika sehemu yao ya ndani/katikati yao.’ Tafsiri hii inahifadhi taswira ya Kiebrania kuliko kuifanya tu ‘miongoni mwao’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Muundo wa utambulisho ‘Ni wao peke yao’ unatunza mkazo wa Kiebrania, na tanbihi zinahifadhi uwezekano wa maana mbadala bila kuutatua kimyakimya.
