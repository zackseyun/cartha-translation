base_translation:
  language: en
  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: sw
  text: Je, umesikiliza katika baraza la Mungu[a], na umejitengea hekima wewe peke yako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika siri ya Mungu” au “katika shauri la siri la Mungu.” Neno la Kiebrania linaweza kumaanisha baraza la watu wa karibu, mazungumzo ya siri, au shauri la siri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: katika baraza
  rationale: סוֹד hapa inaweza kumaanisha baraza la watu wa karibu ambamo mashauri ya siri hufanywa. “Katika baraza” inadumisha taswira ya kuwa ndani ya mkutano wa mashauriano, huku tanbihi ikihifadhi maana mbadala za siri na shauri la siri.
- source_word: אֱלוֹהַ
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na la asili la Kiswahili kwa אֱלוֹהַ katika muktadha huu.
- source_word: תִּשְׁמָע
  choice: umesikiliza
  rationale: שׁמע inaweza kuwa kusikia au kusikiliza; hapa kusikiliza kunaonyesha kufuatilia kwa makini mashauriano ya baraza. Wakati timilifu unafaa kwa swali hili la kejeli.
- source_word: וְ/תִגְרַע ... חָכְמָה
  choice: na kujitengea hekima
  rationale: גרע inaweza kumaanisha kupunguza, kuzuia, au kuhifadhi kitu kwa mtu fulani. Katika muundo huu, “kujitengea hekima” huwasilisha kwa Kiswahili cha kawaida wazo la kuifanya hekima kuwa mali ya mhusika pekee bila kuifanya sentensi kuwa nzito.
- source_word: אֵלֶיךָ
  choice: wewe peke yako
  rationale: Kirai hiki kinaonyesha kuelekezwa kwa hekima kwa mhusika mwenyewe; “wewe peke yako” husisitiza dai la kujihodhi lililomo katika swali.
theological_decisions:
- issue: Maana ya סוֹד ya Mungu katika kejeli ya Elifazi
  choice: baraza la Mungu
  alternative: siri ya Mungu; shauri la siri la Mungu
  rationale: “Baraza” hudumisha uwezekano wa taswira ya mkutano wa mashauriano ya Mungu, ambamo Ayubu anakejeliwa kana kwamba alipata ufikiaji wa pekee. Tanbihi inaacha wazi maana nyingine halali za neno hilo.
- issue: Iwapo mstari unadai kwamba Ayubu ana hekima yote
  choice: Swali linaonyesha kwa kejeli kwamba Ayubu amejitengea hekima, bila kuthibitisha dai hilo kuwa kweli.
  alternative: Kutafsiri moja kwa moja kana kwamba Ayubu kweli ana hekima ya pekee
  rationale: Muktadha na muundo wa swali la balagha ni shtaka la Elifazi, si kauli ya msimulizi kuhusu hali halisi ya hekima ya Ayubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kujitengea hekima wewe peke yako” ni usemi wa kawaida unaobeba shtaka la kujihodhi, na “baraza” pamoja na tanbihi huhifadhi upana wa maana wa סוֹד.
