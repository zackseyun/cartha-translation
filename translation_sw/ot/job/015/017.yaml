  yaml_path: translation/ot/job/015/017.yaml
  text: I will tell you; listen to me. What I have seen[a], I will recount—
translation:
  language: sw
  text: Nitakueleza[a]; nisikilize. Hili ndilo nililoliona, nami nitalisimulia—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nitakuonyesha.”
    reason: Kitenzi cha Kiebrania kinaweza kumaanisha kueleza, kutangaza, au kuonyesha; katika muktadha huu ni hotuba, si lazima wonyesho wa kitu kinachoonekana.
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: Nitakueleza
  rationale: Kitenzi hiki katika Piel kinatanguliza maelezo ya Elifazi. “Nitakueleza” ni Kiswahili cha kawaida kinachoonyesha kuwa atatoa habari au ufafanuzi, bila kudokeza lazima kwamba ataonyesha kitu kwa macho.
- source_word: שְׁמַע לִי
  choice: nisikilize
  rationale: Amri pamoja na kihusishi inaomba usikivu wa makusudi kwa msemaji; “nisikilize” ni ya moja kwa moja na ya asili.
- source_word: וְזֶה
  choice: Hili ndilo
  rationale: Muundo huu unahifadhi nguvu ya kiashiria “hili” huku ukiunganisha kwa Kiswahili cha asili jambo linalofuata ambalo Elifazi anadai kuwa ameliona.
- source_word: חָזִיתִי
  choice: nililoliona
  rationale: Huhifadhi dai la Elifazi la ushuhuda au ujuzi alioupata mwenyewe, bila kuligeuza kuwa hitimisho la kiakili tu.
- source_word: וַאֲסַפֵּרָה
  choice: nami nitalisimulia
  rationale: “Nitalisimulia” huonyesha kusudi la kuweka wazi kwa mpangilio jambo aliloliona; “nami” huendeleza kiunganishi cha Kiebrania kwa Kiswahili cha asili.
