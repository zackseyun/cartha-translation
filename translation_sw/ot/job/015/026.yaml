  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: sw
  text: Humkimbilia, shingo yake mbele, kwa vinundu vinene vya ngao zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Humkimbilia akiwa amenyoosha shingo, kwa vinundu vinene vya ngao zake.” Taswira ya Kiebrania ni hai lakini imebanwa kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: humkimbilia
  rationale: Kitenzi רוץ kimsingi humaanisha ‘kukimbia’; katika muktadha huu wa uhasama, ‘humkimbilia’ huonyesha mwendo wa haraka wa kumshambulia bila kuongeza taswira ya kijeshi isiyosemwa wazi.
- source_word: אֵלָיו
  choice: hum-
  rationale: Kihusishi אֶל pamoja na רוץ hapa kinaelekeza tendo kwa anayelengwa; kiambishi ‘-m-’ katika ‘humkimbilia’ kinatoa maana ya ‘kwake/dhidi yake’ kwa Kiswahili cha kawaida.
- source_word: בְּצַוָּאר
  choice: kwa shingo yake
  rationale: Hifadhi taswira halisi na iliyobanwa ya Kiebrania, ‘kwa shingo,’ bila kuingiza moja kwa moja ‘iliyonyoshwa’ au ‘ngumu,’ ambazo ni tafsiri zinazowezekana lakini hazikutajwa wazi.
- source_word: בַּעֲבִי
  choice: vinene
  rationale: עֳבִי huonyesha unene au ukubwa; ‘vinene’ ni ya kawaida na inaeleza vinundu vya ngao bila kuzidisha maana.
- source_word: גַּבֵּי
  choice: vinundu
  rationale: Katika uhusiano na ngao, neno hili linaeleweka kuwa sehemu zilizoinuka au zilizovimba; ‘vinundu’ huwasilisha umbo hilo kwa lugha inayoeleweka kuliko istilahi adimu ya kitaalamu.
- source_word: מָגִנָּיו
  choice: ngao zake
  rationale: Umbo la Kiebrania ni wingi lenye kiambishi cha nafsi ya tatu ya kiume, hivyo ‘ngao zake’ huhifadhi wingi wa chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Vinundu vya ngao’ kinaeleza kwa uwazi sehemu za ngao zilizoinuka, huku sentensi kuu ikihifadhi taswira isiyo ya kawaida ya Kiebrania na tanbihi ikitoa ufafanuzi unaowezekana.
