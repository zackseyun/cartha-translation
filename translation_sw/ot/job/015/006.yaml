  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: sw
  text: Kinywa chako chenyewe kinakuhukumu, si mimi; midomo yako yenyewe inashuhudia dhidi yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “midomo yako yenyewe inajibu dhidi yako.” Kitenzi cha Kiebrania kwa maana ya msingi ni “kujibu,” lakini katika muktadha huu kinaweza kueleweka kuwa kutoa ushahidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: kinakuhukumu
  rationale: Hifili ya רשע ina maana ya kumtangaza mtu kuwa na hatia au kumhukumu. ‘Kinakuhukumu’ ni usemi wa kawaida wa Kiswahili na unadumisha taswira ya kimahakama.
- source_word: פִיךָ
  choice: kinywa chako mwenyewe
  rationale: Kiebrania ni ‘kinywa chako’; ‘mwenyewe’ hukazia kwamba maneno ya Ayubu ndiyo yanayomhukumu, si Elifazi.
- source_word: וְלֹא אָנִי
  choice: wala si mimi
  rationale: Huhifadhi ulinganisho wa moja kwa moja na mkazo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: וּשְׂפָתֶיךָ
  choice: midomo yako mwenyewe
  rationale: Huhifadhi usambamba na ‘kinywa chako mwenyewe’ na kukazia kujishtaki kwa maneno yake mwenyewe.
- source_word: יַעֲנוּ
  choice: inashuhudia
  rationale: Ingawa kitenzi ענה kwa msingi kinaweza kumaanisha ‘kujibu,’ hapa kinaweza kuwa na maana ya kimahakama ya kutoa ushahidi.
- source_word: בָךְ
  choice: dhidi yako
  rationale: Katika muktadha wa ushahidi wa kimahakama, kihusishi kinaeleweka kwa maana ya ushahidi unaomkabili Ayubu.
