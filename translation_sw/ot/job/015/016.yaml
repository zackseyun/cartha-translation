  text: how much less a man who is detestable and corrupt[b][a], who drinks injustice like water!
translation:
  language: sw
  text: sembuse mwanadamu mwenye kuchukiza na mchafu[a], anayekunywa ukosefu wa haki[b] kama maji!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye unajisi,” “mwenye uchafu,” au “aliyeharibika.” Neno la Kiebrania ni adimu na linaweza kumaanisha mtu aliyechafuliwa au aliye najisi, kimwili au kimaadili.
    reason: lexical_alternative
  - marker: b
