lexical_decisions:
- source_word: אַף כִּי
  choice: sembuse
  rationale: 'Katika muktadha huu ni hoja ya kulinganisha kwa uzito: ikiwa hata waliotajwa katika mstari uliotangulia si safi mbele za Mungu, sembuse mwanadamu. ‘Sembuse’ ni ya asili na huonyesha wazi mantiki hiyo.'
- source_word: נִתְעָב
  choice: mwenye kuchukiza
  rationale: Huhifadhi maana yenye nguvu ya mtu aliye chukizo au kinyaa, huku ikiwa wazi kwa msomaji wa Kiswahili cha leo.
- source_word: נֶאֱלָח
  choice: aliyepotoka
  rationale: Neno hili adimu lina wazo la kutiwa unajisi, kuwa ovyo au kuharibika kimaadili. ‘Aliyepotoka’ huwasilisha hali mbaya ya kimaadili bila kuifanya ionekane kuwa uchafu wa mwili tu; ‘aliyenajisika’ ni uwezekano mwingine.
- source_word: אִישׁ
  choice: mwanadamu
  rationale: Ingawa nomino ya Kiebrania ni umoja wa kiume, hapa inatumiwa kiuwakilishi kuhusu binadamu. ‘Mwanadamu’ huhifadhi umoja na maana hiyo pana kwa Kiswahili cha kawaida.
- source_word: שֹׁתֶה
  choice: anayekunywa
  rationale: Kishiriki kinaonyesha tendo la kawaida au tabia inayoendelea; kishazi rejeshi ni cha asili katika Kiswahili.
- source_word: כַמַּיִם
  choice: kama maji
  rationale: Huhifadhi tashbihi ya moja kwa moja inayoonyesha urahisi na mazoea.
- source_word: עַוְלָה
  choice: udhalimu
  rationale: Nomino hii inaweza kumaanisha uovu, kosa, au ukosefu wa haki. ‘Udhalimu’ huhifadhi uzito wa kimaadili na inafaa kwa taswira ya kuunywa kama maji.
theological_decisions:
- issue: Lugha ya kiume yenye maana ya uwakilishi
  choice: mwanadamu
  alternative: mwanamume; mtu
  rationale: אִישׁ ni umoja wa kiume, lakini kauli hii inamhusu binadamu kwa ujumla. Katika Kiswahili, ‘mwanadamu’ ni umoja na haiingizi dai kwamba ni wanaume pekee wanaokusudiwa.
- issue: Maana ya neno la kimaadili עַוְלָה
  choice: udhalimu
  alternative: uovu; kosa; ukosefu wa haki
  rationale: ‘Udhalimu’ huonyesha upotovu na kutenda yasiyo ya haki bila kuingiza istilahi maalumu ya kimadhehebu. Tanbihi huhifadhi wigo wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Sembuse’ huendeleza hoja ya mstari uliotangulia; mpangilio wa kishazi na tashbihi umehifadhiwa.
