lexical_decisions:
- source_word: הוֹכֵחַ
  choice: kubishana
  rationale: Hifili ya יכח inaweza kumaanisha kujadiliana, kubishana, au kukaripia. Katika muktadha wa mabishano ya Ayubu, “kubishana” linaonyesha mvutano wa maneno bila kuingiza maana mahsusi ya kisheria.
- source_word: בְּדָבָר
  choice: kwa maneno
  rationale: דָבָר hapa inahusu usemi, kama inavyoonyeshwa na ulinganifu wake na מִלִּים katika kipande cha pili.
- source_word: לֹא יִסְכּוֹן
  choice: yasiyofaa kitu
  rationale: Kitenzi סכן hapa kina wazo la kuwa na manufaa au kufaa. Kauli hii ni ya kawaida na yenye kueleweka katika Kiswahili cha sasa.
- source_word: וּמִלִּים
  choice: au kwa usemi
  rationale: מִלִּים maana yake ni “maneno.” “Usemi” huepusha marudio mazito huku ukihifadhi ulinganifu wa kishairi; “au” huwasilisha vipashio sambamba vya swali la balagha.
- source_word: לֹא יוֹעִיל בָּם
  choice: usio na faida
  rationale: יועיל humaanisha kuleta faida, kunufaisha, au kusaidia. Tafsiri hii huhifadhi wazo kwamba usemi huo hauleti manufaa.
