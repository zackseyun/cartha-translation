  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: sw
  text: Atayapukutisha zabibu zake changa kama mzabibu,[a] na atayatupa maua yake kama mzeituni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Atazinyang’anya zabibu zake changa kama mzabibu.” Kitenzi cha Kiebrania mara nyingi kina maana kali zaidi ya kutumia nguvu au kunyang’anya, lakini hapa taswira ya kilimo inaonyesha kupotea kwa matunda kabla ya kukomaa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ua lake” au “machanua yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: atayapukutisha
  rationale: Kitenzi cha Kiebrania mara nyingi hudokeza kutumia nguvu, kunyang’anya, au kuharibu. Katika taswira hii ya kilimo, “kupukutisha” kinaeleza kwa kawaida kuondolewa kwa zabibu kabla ya kukomaa, huku wazo la upotevu wa ghafla au wa nguvu likibaki.
- source_word: כַּגֶּפֶן
  choice: kama mzabibu
  rationale: Hili ni neno la kawaida la Kiswahili kwa mmea wa zabibu na linahifadhi tashbihi ya Kiebrania.
- source_word: בִּסְרוֹ
  choice: zabibu zake changa
  rationale: Nomino hii humaanisha zabibu ambazo bado hazijaiva. “Zabibu changa” ni ya kawaida na wazi katika Kiswahili cha sasa; kiambishi cha nafsi ya tatu kimehifadhiwa kwa “zake.”
- source_word: וְיַשְׁלֵךְ
  choice: na kuyatupa
  rationale: Hifili ya kitenzi hiki ina maana ya kutupa au kuangusha. “Kuyatupa” huhifadhi kitendo hai cha mzeituni kuyaondoa maua yake katika tashihisi ya mstari huu.
- source_word: כַּזַּיִת
  choice: kama mzeituni
  rationale: Katika muktadha wa mti unaoangusha maua, זית humaanisha mzeituni, si tunda la zeituni.
- source_word: נִצָּתוֹ
  choice: maua yake
  rationale: Nomino hii yaweza kumaanisha ua au maua ya mmea. “Maua yake” ni usemi wa kawaida kwa maua ya mzeituni na huhifadhi umilikaji wa Kiebrania.
