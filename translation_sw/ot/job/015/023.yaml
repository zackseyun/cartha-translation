  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: sw
  text: 'Hutangatanga akitafuta mkate[a]: “Uko wapi?” Anajua kwamba siku ya giza iko tayari kumfikia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chakula.” Neno la Kiebrania kwa kawaida humaanisha “mkate,” lakini pia linaweza kumaanisha chakula kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja moja, “mkononi mwake”; hapa yaelekea maana ni kwamba siku ya giza iko karibu sana kumfikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: Hutangatanga
  rationale: Kitenzi hiki kinaonyesha kuzungukazunguka kwa kuendelea bila utulivu. “Hutangatanga” ni Kiswahili cha kawaida kinachohifadhi hali hiyo bila kudai kwamba mtu huyo ni mhamishwa.
- source_word: לַלֶּחֶם
  choice: akitafuta mkate
  rationale: Neno לֶחֶם kwa msingi ni “mkate,” ingawa linaweza kumaanisha chakula kwa ujumla. Kiambishi ל־ katika muktadha huu kinaonyesha kusudi la kutangatanga, hivyo “akitafuta” kinaifanya maana iwe wazi kwa Kiswahili cha kawaida.
- source_word: אַיֵּה
  choice: Uko wapi?
  rationale: Kiulizi hiki humaanisha “wapi?” Kiwakilishi “u-” kinarejelea mkate uliotajwa na kinawezesha swali lisomeke kwa kawaida katika Kiswahili.
- source_word: יָדַע
  choice: Anajua
  rationale: Hii ni tafsiri ya moja kwa moja ya kitenzi kinachoonyesha ufahamu uliothibitika.
- source_word: נָכוֹן
  choice: iko tayari
  rationale: Umbo hili linaonyesha kitu kilichoandaliwa, kilichowekwa imara, au kilicho tayari. “Iko tayari” linafaa kwa hatari inayokaribia bila kuongeza ufafanuzi wa aina ya hatari hiyo.
- source_word: בְּיָדוֹ
  choice: karibu naye
  rationale: Kwa neno moja moja ni “mkononi mwake,” lakini hapa usemi unaelekea kuonyesha kwamba siku hiyo iko karibu sana kumfikia. Tafsiri kuu inawasilisha ukaribu huo, huku tanbihi ikihifadhi sura halisi ya Kiebrania.
- source_word: יוֹם חֹשֶׁךְ
  choice: siku ya giza
  rationale: Huu ni muundo unaomaanisha siku yenye sifa ya giza. Taswira ya asili imehifadhiwa badala ya kufafanuliwa moja kwa moja kuwa maafa, hukumu, au maangamizi.
theological_decisions:
- issue: Nguvu ya sitiari ya “siku ya giza”
  choice: siku ya giza
  alternative: siku ya maafa; siku ya maangamizi; siku ya hukumu
  rationale: Muktadha wa hotuba ya Elifazi unaashiria maafa yanayomjia mwovu, lakini maneno ya Kiebrania yenyewe yanatumia taswira pana. Tafsiri haibainishi aina ya tukio zaidi ya maandishi yenyewe.
- issue: Maana ya “mkononi mwake”
  choice: karibu naye
  alternative: mkononi mwake
  rationale: Tafsiri ya moja kwa moja inaweza kueleweka kana kwamba mtu huyo anaitawala siku ya giza. “Karibu naye” huonyesha uwezekano wa ukaribu na uharaka unaokusudiwa, bila kuamua kwa undani namna siku hiyo itakavyompata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Hutangatanga” huonyesha utafutaji usio na utulivu; “siku ya giza” huhifadhi taswira na mvutano wa kiteolojia wa Kiebrania.
