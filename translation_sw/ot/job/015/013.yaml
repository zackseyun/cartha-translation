  text: kwamba unaelekeza roho yako dhidi ya Mungu, na unatoa maneno kutoka kinywani mwako?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Mungu” au “kumwelekea Mungu.” Kiebrania kinasema kihalisi “kwa/kuelekea Mungu”; “dhidi ya Mungu” limetumiwa katika tafsiri kuu kwa sababu muktadha wa shtaka unadokeza upinzani.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: hivi kwamba
  rationale: Katika mfululizo wa swali la mstari uliotangulia, neno hili linaingiza tendo linaloshutumiwa; ‘hivi kwamba’ huunganisha sentensi kwa Kiswahili cha kawaida bila kulifanya kuwa sababu iliyo wazi zaidi kuliko Kiebrania.
- source_word: תָשִׁיב
  choice: unaelekeza
  rationale: Hifili ya שוב hapa ina maana ya kugeuza au kuelekeza msimamo wa ndani, si kurudi mahali fulani.
- source_word: אֶל אֵל
  choice: dhidi ya Mungu
  rationale: אֶל kwa kawaida ni ‘kwa/kuelekea,’ lakini muktadha wa shtaka unaonyesha mwelekeo wa upinzani. Tafsiri kuu inadhihirisha nguvu hiyo huku tanbihi ikihifadhi maana ya msingi ya kihusishi.
- source_word: רוּחֶךָ
  choice: roho yako
  rationale: רוּחַ hapa ni hali au msimamo wa ndani wa Ayubu, si upepo wala pumzi halisi; ‘roho’ huhifadhi upana wa maana kuliko ‘hasira’.
- source_word: וְהֹצֵאתָ
  choice: na kutoa
  rationale: Hifili ya יצא ni kusababisha kitu kitoke. ‘Kutoa’ ni ya asili katika Kiswahili na inahifadhi taswira ya maneno kutoka kinywani.
- source_word: מִפִּיךָ
  choice: kinywani mwako
  rationale: מן inaonyesha chanzo. Kiswahili hutumia kwa kawaida ‘kutoa maneno kinywani,’ na umbo hili linadumisha taswira ya chanzo.
- source_word: מִלִּין
  choice: maneno
  rationale: Wingi huu wenye athari ya Kiaramu humaanisha maneno au matamshi; ‘maneno’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Ikiwa roho inaelekezwa kwa Mungu au dhidi ya Mungu
  choice: dhidi ya Mungu
  alternative: kwa Mungu / kumwelekea Mungu
  rationale: Kihusishi cha Kiebrania kimsingi huonyesha mwelekeo ‘kwa/kuelekea,’ lakini shtaka la Elifazi katika muktadha linadokeza upinzani. Tofauti halisi imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Muundo unaendelea kama sehemu ya swali lililoanza katika mstari uliotangulia; alama ya swali imehifadhiwa. ‘Roho yako’ hudumisha taswira ya ndani bila kufasiri neno hilo kwa finyu kuwa ‘hasira’ au ‘tabia.’
