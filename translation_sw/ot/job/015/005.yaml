lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha msingi wa shtaka la Elifazi na kuendeleza hoja kutoka muktadha uliotangulia.
- source_word: יְאַלֵּף
  choice: huufundisha
  rationale: Kitenzi hiki katika Piel humaanisha kufundisha au kuzoeza; ‘huufundisha’ huhifadhi taswira ya uovu unaouelekeza mdomo wa Ayubu.
- source_word: עֲוֺנְךָ
  choice: uovu wako
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu ya hatia. Hapa inaelekea kuwa kosa la kimaadili linalounda usemi wa Ayubu.
- source_word: פִיךָ
  choice: mdomo wako
  rationale: Tafsiri halisi na ya kawaida inayohifadhi taswira ya Kiebrania ya usemi unaotoka mdomoni.
- source_word: וְתִבְחַר
  choice: nawe huchagua
  rationale: Huhifadhi shtaka la moja kwa moja katika nafsi ya pili na maana ya msingi ya בחר, yaani kuchagua.
- source_word: לְשׁוֹן
  choice: ulimi
  rationale: Huhifadhi taswira ya kishairi na ulinganifu wake na ‘mdomo’ katika mstari wa kwanza.
- source_word: עֲרוּמִים
  choice: wenye hila
  rationale: Katika shtaka hili neno lina maana hasi ya watu wajanja kwa udanganyifu, si maana chanya ya wenye busara.
theological_decisions:
- issue: Maana ya kimaadili ya עָוֹן katika shtaka
  choice: uovu wako
  alternative: hatia yako; dhambi yako
  rationale: ‘Uovu’ huhifadhi nguvu ya shtaka la kimaadili bila kulifungia neno katika dhana ya uwajibikaji wa kisheria pekee au kulifanya liwe neno la jumla zaidi ‘dhambi’.
- issue: Maana ya עֲרוּמִים
  choice: wenye hila
  alternative: wenye ujanja; werevu
  rationale: Muktadha wa shtaka la Elifazi unaonyesha maana hasi, lakini tanbihi huhifadhi uwezekano wa kutafsiri neno hilo kwa ‘wenye ujanja’.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Mdomo’ na ‘ulimi’ zimehifadhiwa ili kudumisha ulinganifu wa picha za Kiebrania; ‘wenye hila’ ni usemi wa kawaida unaobeba maana hasi ya muktadha.
