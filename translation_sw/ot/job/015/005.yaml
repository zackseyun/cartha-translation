  text: Kwa maana uovu wako[a] huufundisha mdomo wako, nawe huchagua ulimi wa wenye hila[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatia yako huufundisha mdomo wako”; neno la Kiebrania linaweza kumaanisha uovu, hatia, au adhabu ya hatia, kutegemea muktadha.
