  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: sw
  text: Siku zote za mtu mwovu yeye hujipinda-pinda kwa uchungu,[a][c] na idadi ya miaka imehifadhiwa kwa ajili ya mtu mkatili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huwa katika uchungu”; kitenzi cha Kiebrania kinaweza kueleza kujipinda-pinda, kutetemeka, au uchungu unaofanana na utungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “imefichwa” au “imewekwa akiba” kwa ajili ya mtu mkatili.
    reason: lexical_alternative
  - marker: c
    text: “Mtu mwovu” ni umoja wa kiume kisarufi katika Kiebrania na humwakilisha mtu mwovu kama kielelezo cha aina.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Siku zote za
  rationale: Huhifadhi usemi wa jumla wa wakati katika muundo wa Kiebrania, huku ukiwa wa kawaida katika Kiswahili.
- source_word: רָשָׁע
  choice: mtu mwovu
  rationale: Kivumishi hiki kimetumika kama nomino katika umoja wa kiume; “mtu mwovu” humwakilisha mtu wa aina hiyo kwa lugha ya kawaida.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru kina nguvu ya kurejelea au kusisitiza mhusika; kimedhihirishwa bila kuongeza msisitizo usio wa lazima.
- source_word: מִתְחוֹלֵל
  choice: hugaagaa kwa maumivu
  rationale: Umbo hili huweza kuonyesha kujipinda-pinda, kutetemeka, au kuwa katika uchungu unaofanana na utungu; “hugaagaa kwa maumivu” linaonyesha tendo lenye kuendelea na ukali wake.
- source_word: וּמִסְפַּר שָׁנִים
  choice: na miaka iliyohesabiwa
  rationale: Hutoa maana ya kipindi maalumu lakini kisichotajwa idadi yake, badala ya miaka isiyo na kikomo.
- source_word: נִצְפְּנוּ
  choice: imewekwa akiba
  rationale: Niphal ya צפן inaweza kumaanisha kufichwa au kuwekwa/kuhifadhiwa kwa ajili ya wakati fulani; usemi huu huhifadhi sitiari hiyo.
- source_word: לֶעָרִיץ
  choice: kwa ajili ya mtu mkatili
  rationale: עָרִיץ humaanisha mtu mwenye ukatili, jeuri, au uonevu; “mtu mkatili” haibani maana kwenye mtawala wa kisiasa pekee.
theological_decisions:
- issue: Je, miaka hiyo ni miaka ya maisha au miaka ya mateso?
  choice: Tafsiri haisemi wazi ni miaka ya nini.
  alternative: Kusema “miaka ya mateso” au “miaka ya kuishi.”
  rationale: Kiebrania kinataja tu miaka iliyohesabiwa/iliyohifadhiwa kwa mtu mkatili; kuongeza aina ya miaka kungeondoa utata halisi wa mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Hugaagaa” huonyesha tendo endelevu la kujipinda kwa uchungu; “miaka iliyohesabiwa” huwasilisha kipindi maalumu kisichotajwa idadi yake.
