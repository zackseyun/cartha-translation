  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: sw
  text: Je, faraja za Mungu ni ndogo mno kwako[a], au neno lililosemwa kwa upole kwako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, faraja za Mungu ni ndogo mno kwako, na neno lililosemwa kwa upole kwako?”
    reason: Kiebrania kina kiunganishi ambacho kwa kawaida humaanisha “na,” lakini katika swali hili kinaweza kueleweka kwa maana ya “au.”
lexical_decisions:
- source_word: הַמְעַט
  choice: ni ndogo mno
  rationale: Muundo wa swali la balagha unauliza kama faraja hizo zinaonekana kuwa ndogo au zisizotosha; “ni ndogo mno” huhifadhi picha ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: מִמְּךָ
  choice: kwako
  rationale: 'Katika muundo huu kihusishi kinaonyesha uhusiano na anayezungumziwa: ndogo mno kwake, si mwendo kutoka kwake.'
- source_word: תַּנְחֻמוֹת
  choice: faraja
  rationale: Neno hili hurejelea matendo au maneno ya kutia moyo; “faraja” ni la kawaida, lenye heshima, na linaweza kuwakilisha wingi wa Kiebrania kulingana na matumizi ya Kiswahili.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa אֵל ni jina la cheo linalomtaja Mungu, si tu mtu mwenye nguvu.
- source_word: וְדָבָר
  choice: au neno
  rationale: “Neno” linafaa katika muktadha wa mazungumzo. Kiunganishi kimetafsiriwa “au” ili swali la balagha lisomeke kwa kawaida, huku maana halisi ya “na” ikihifadhiwa katika tanbihi.
- source_word: לָאַט
  choice: kwa upole
  rationale: Kielezi hiki kinaonyesha namna ya upole au utaratibu; “kwa upole” ni fasaha na hakiongezi wazo lisilokuwapo.
- source_word: עִמָּךְ
  choice: nawe
  rationale: Kihusishi עִם kwa msingi ni “pamoja na/na”; hapa kinaonyesha kwamba neno linaelekezwa kwa Ayubu katika mazungumzo.
