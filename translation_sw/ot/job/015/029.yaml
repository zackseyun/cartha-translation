  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: sw
  text: Hatakuwa tajiri, na mali yake haitadumu, wala mazao yao[a] hayatainama kuelekea ardhini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mali yao,” “faida yao,” au “wingi wao.” Neno la Kiebrania ni adimu na maana yake si hakika.
    reason: lexical_alternative
  - marker: b
    text: Kishazi hiki huenda kikatoa taswira ya mazao au matawi yasiyoinama kuelekea ardhini kwa wingi. Wengine hukielewa kwa ujumla kuwa mali yao haitaenea katika nchi.
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: hatakuwa tajiri
  rationale: Kitenzi cha Kiebrania katika muktadha huu kinaeleza kufikia hali ya utajiri; Kiswahili ‘hatakuwa tajiri’ ni cha kawaida na huwasilisha maana hiyo kwa uwazi.
- source_word: יָקוּם
  choice: haitadumu
  rationale: Maana ya msingi ni ‘haitasimama,’ lakini mali ikiwa kiima, maana ya kimuktadha ni kwamba haitabaki imara au kudumu.
- source_word: חֵילוֹ
  choice: mali yake
  rationale: חַיִל inaweza kumaanisha nguvu, uwezo, raslimali, au mali. Mazungumzo kuhusu utajiri yanaunga mkono ‘mali yake.’
- source_word: יִטֶּה
  choice: hayatainama
  rationale: נטה inaweza kumaanisha kuinama, kuelekezwa, kutandazwa, au kuenea. ‘Hayatainama’ huhifadhi taswira halisi inayowezekana ya mazao mazito yanayoning’inia kuelekea chini.
- source_word: מִנְלָם
  choice: mazao yake
  rationale: Neno hili adimu halina uhakika. ‘Mazao yake’ huleta maana inayopatana na taswira ya kitu kinachoinama mpaka ardhini, huku tanbihi ikihifadhi uwezekano wa ‘mali,’ ‘faida,’ au ‘wingi.’
theological_decisions:
- issue: Taswira ya kishairi katika kishazi cha mwisho
  choice: mazao yake hayatainama mpaka ardhini
  alternative: mali yake haitaenea juu ya nchi
  rationale: Kiebrania kinaweza kueleweka kama taswira ya mazao au matawi yanayoinama kwa wingi, au kwa ujumla kama mali isiyoenea katika nchi. Tafsiri kuu huhifadhi taswira halisi, na tanbihi hutaja usomaji mwingine bila kutatua kimabavu utata wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vishazi vitatu sambamba; ‘haitadumu’ ni ya kawaida kuliko tafsiri halisi ‘haitasimama,’ na tanbihi huhifadhi utata wa kishazi cha mwisho.
