lexical_decisions:
- source_word: מָה
  choice: ni nini
  rationale: Katika swali hili la balagha, “ni nini” linauliza kuhusu hadhi au uwezo wa mwanadamu, huku likihifadhi muundo wa Kiebrania.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Neno hili humaanisha binadamu, mara nyingi likidokeza udhaifu na hali yake ya kufa. “Mwanadamu” ni la kawaida, la heshima, na lina maana ya jumla hapa.
- source_word: כִּי
  choice: hata
  rationale: 'Baada ya swali la balagha, “hata” linaunganisha kwa kawaida hali inayotiliwa shaka: mwanadamu ni nini hata awe safi?'
- source_word: יִזְכֶּה
  choice: awe safi
  rationale: Kitenzi זכה kinaweza kumaanisha kuwa safi au kutokuwa na uchafu/hatia. “Awe safi” kinahifadhi upana wa maana ya kimaadili bila kuifanya kuwa istilahi finyu.
- source_word: וְכִי
  choice: au ... hata
  rationale: Ingawa וְ kimsingi ni “na,” hapa kinaanzisha mshororo wa pili unaolingana katika swali la balagha. “Au ... hata” ni Kiswahili cha asili na kinaonyesha ulinganifu huo bila kubadili hoja.
- source_word: יִצְדַּק
  choice: awe mwenye haki
  rationale: Kitenzi צדק hapa kinaeleza hali ya kuwa mwadilifu au kuwa upande wa haki. “Mwenye haki” huhifadhi maana pana ya kimaadili na ya tathmini bila kuingiza istilahi maalumu ya kiteolojia.
- source_word: יְלוּד אִשָּׁה
  choice: aliyezaliwa na mwanamke
  rationale: Hii ni nahau ya Kiebrania inayomtaja binadamu kwa kusisitiza hali yake ya kawaida na dhaifu. Tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Upeo wa אֱנוֹשׁ na יְלוּד אִשָּׁה
  choice: “Mwanadamu” na “aliyezaliwa na mwanamke” zimetumiwa kwa maana inayowakilisha wanadamu kwa ujumla.
  alternative: “Binadamu” au “yeyote aliyezaliwa na mwanamke.”
  rationale: Umoja wa Kiebrania una nguvu ya uwakilishi. Kiswahili “mwanadamu” kinaweza kutumiwa kwa maana ya jamii yote ya wanadamu bila kuficha taswira ya umoja katika shairi.
- issue: Maana ya kimaadili au ya kimahakama katika יִצְדַּק
  choice: “Awe mwenye haki,” likihifadhi hali pana ya kuwa mwadilifu au kuwa sawa mbele ya kipimo cha haki.
  alternative: “Ahesabiwe haki” au “aonekane kuwa hana kosa.”
  rationale: Muktadha ni hoja ya kishairi kuhusu usafi na haki ya mwanadamu, si ufafanuzi wa kiufundi wa fundisho la kuhesabiwa haki. Tafsiri iliyochaguliwa haifungi maana katika mfumo mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa swali la balagha umehifadhiwa, na maneno ya kiufundi au ya kimadhehebu yameepukwa.
