  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: sw
  text: Mwanadamu[a] ni nini hata awe safi[b], na mzaliwa wa mwanamke hata awe mwenye haki[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “binadamu.” Neno la Kiebrania linaweza pia kudokeza udhaifu na hali ya kufa ya mwanadamu.
    reason: lexical_alternative
  - marker: b
    text: Au “asiye na unajisi” au “asiye na hatia.” Neno la Kiebrania linaweza kumaanisha usafi wa kimaadili au kutokuwa na uchafu.
    reason: lexical_alternative
  - marker: c
    text: Au “aliye sawa” au “asiye na kosa.”
