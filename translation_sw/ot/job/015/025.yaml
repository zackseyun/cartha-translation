  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: sw
  text: 'Kwa sababu amenyoosha mkono wake dhidi ya Mungu[a],

    na hujionyesha mwenye nguvu dhidi ya Mwenyezi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana amenyoosha mkono wake kuelekea Mungu, na hujiimarisha dhidi ya Mwenyezi.”
    reason: Mbadala huu huhifadhi maana ya msingi ya אֶל, ‘kuelekea’, na tafsiri ya moja kwa moja zaidi ya kitenzi יִתְגַּבָּר.
lexical_decisions:
- source_word: כִּי
  choice: Kwa sababu
  rationale: Inaonyesha sababu ya hukumu ya mtu mwovu katika muktadha; Kiswahili hiki kinaweka wazi uhusiano wa kisababishi.
- source_word: נָטָה
  choice: amenyoosha
  rationale: Inahifadhi taswira halisi ya kunyoosha mkono, ambayo katika muktadha huu inaonyesha tendo la uhasama.
- source_word: אֶל
  choice: dhidi ya
  rationale: Ingawa kwa kawaida humaanisha ‘kwa/kuelekea’, muktadha wa uasi unaonyesha upinzani; ‘dhidi ya’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֵל
  choice: Mungu
  rationale: Ni tafsiri ya kawaida ya cheo hiki cha Mungu na inadumisha utofauti wake na שַׁדַּי katika mstari wa pili.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Inafuata umoja wa Kiebrania na kuhifadhi nahau yenye taswira ya tendo la uhasama.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Inatafsiri cheo cha Mungu badala ya kukinakili kwa matamshi, na ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: יִתְגַּבָּר
  choice: kujionyesha kuwa mwenye nguvu
  rationale: Inahifadhi wazo la kujifanya au kujidhihirisha kuwa na nguvu, pamoja na kinaya cha mtu kujitukuza kwa nguvu mbele ya Mwenyezi.
theological_decisions:
- issue: Tafsiri ya vyeo viwili vya Mungu katika usambamba wa kishairi
  choice: אֵל imetafsiriwa ‘Mungu’ na שַׁדַּי ‘Mwenyezi’.
  alternative: ‘Mungu’ na ‘Shadai’, au ‘Mungu Mwenye Nguvu’ na ‘Mwenyezi’.
  rationale: Kutafsiri vyeo vyote viwili kunawasilisha maana yake kwa msomaji wa kawaida huku kukidumisha utofauti wa usambamba wa Kiebrania bila kuvifanya kuwa cheo kilekile.
- issue: Nguvu ya kihusiano ya אֶל
  choice: Maandishi makuu yana ‘dhidi ya’.
  alternative: ‘kuelekea’.
  rationale: Muktadha unaonyesha uasi na upinzani dhidi ya Mungu, lakini maana ya msingi ya uelekeo imehifadhiwa katika tanbihi ili kutoficha uwezekano wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi wa vipande viwili umehifadhiwa, na taswira ya ‘kunyoosha mkono’ haijabadilishwa kuwa maelezo ya kiufafanuzi.
