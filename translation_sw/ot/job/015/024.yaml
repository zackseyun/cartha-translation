base_translation:
  language: en
  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: sw
  text: Dhiki na taabu humtia hofu; humshinda kama mfalme aliye tayari kwa shambulio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama mfalme aliye tayari kwa vita.” Neno la Kiebrania lililotafsiriwa “shambulio” ni adimu, na maana yake kamili si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: humtia hofu
  rationale: Kauli ya Piel inaonyesha kusababisha hofu kuu; usemi huu ni wa kawaida katika Kiswahili na unadumisha nguvu ya kisababishi.
- source_word: צַר
  choice: dhiki
  rationale: Neno hili linaonyesha hali ya kusongwa au shida kali; “dhiki” linafaa katika muktadha na katika ushairi wa mstari huu.
- source_word: מְצוּקָה
  choice: taabu
  rationale: Linaonyesha shinikizo au hali ngumu yenye kuumiza. “Taabu” linatofautisha neno hili na “dhiki” huku likidumisha ulinganifu wa kishairi.
- source_word: תִּתְקְפֵהוּ
  choice: humshinda
  rationale: Kitenzi kina maana ya kumlemea au kumzidi nguvu. Umoja wa kisarufi wa Kiswahili unafuata jozi “dhiki na taabu” inayotazamwa kwa pamoja, sawasawa na kitenzi cha umoja katika Kiebrania.
- source_word: כְּמֶלֶךְ
  choice: kama mfalme
  rationale: Hii inadumisha wazi tashbihi iliyoletwa na kiambishi cha ulinganishi.
- source_word: עָתִיד
  choice: aliye tayari
  rationale: Katika muktadha huu neno linaonyesha kuwa tayari au kujiandaa kwa hatua inayofuata.
- source_word: לַכִּידוֹר
  choice: kwa shambulio
  rationale: כידור ni neno adimu la kijeshi lenye maana isiyo hakika. “Shambulio” linaonyesha vizuri tukio la kijeshi bila kulifanya kuwa pana sana kama “vita”; uwezekano wa tafsiri pana umewekwa katika tanbihi.
