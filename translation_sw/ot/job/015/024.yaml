  source_fidelity: 'Tafsiri inadumisha vizuri muundo na maana ya Kiebrania: dhiki na msongo humletea mtu hofu na humlemea, kwa tashbihi ya mfalme aliyejiandaa kushambulia. “Humtia hofu” huwasilisha nguvu ya causative ya יְבַעֲתֻהוּ, na “humshinda” huwasilisha תקף kwa ufasaha. Ingawa תִּתְקְפֵהוּ ni umoja wa kike kisarufi, Kiswahili huruhusu rejeo lisilo na utata kwa jozi ya “dhiki na taabu”; tafsiri haiongezi dai la kisarufi lisilopo.'
  naturalness: Kiswahili ni sanifu, cha sasa, na cha kishairi bila kuwa cha kizamani. “Dhiki na taabu humtia hofu; humshinda” kina mtiririko wa kawaida na kiwakilishi cha mtendewa kinabaki wazi.
