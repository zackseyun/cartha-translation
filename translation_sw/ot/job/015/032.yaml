translation:
  language: sw
  text: Kabla ya wakati wake, itatimia[a], na tawi lake[b] halitakuwa la kijani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itajazwa kikamilifu.” Kihalisi, kitenzi cha Kiebrania humaanisha “kujazwa” au “kuwa kamili,” na maana yake hasa katika muktadha huu inajadiliwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “tawi lake la mtende” au “chipukizi lake la juu.” Neno la Kiebrania hutaja sehemu ya mti au mmea inayofanana na tawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: kabla ya wakati wake
  rationale: Kirai hiki kwa neno halisi ni ‘si katika siku yake’; katika muktadha kinaonyesha jambo kutokea kabla ya wakati wake unaofaa.
- source_word: תִּמָּלֵא
  choice: itatimia
  rationale: Kitenzi cha Kiebrania katika Niphal kina maana ya msingi ya ‘kujazwa/kuwa kamili.’ ‘Itatimia’ kinadumisha wazo la kufikia ukamilifu bila kuingiza wazi taswira ya kifedha ambayo haimo moja kwa moja katika kitenzi.
- source_word: כִפָּתוֹ
  choice: tawi lake
  rationale: Neno linaweza kutaja sehemu inayofanana na tawi, hasa tawi la mtende au chipukizi la juu. ‘Tawi lake’ ni la kawaida na linahifadhi taswira ya mmea bila kubainisha aina ya mti isiyo hakika.
- source_word: לֹא רַעֲנָנָה
  choice: halitakuwa la kijani
  rationale: Kivumishi kinaonyesha ubichi, ukijani, au kustawi kwa mimea. Usemi huu unahifadhi taswira halisi ya mmea na unaeleweka kwa urahisi.
theological_decisions:
- issue: Kitu kinachosemwa ‘kitatimia’ hakitajwi wazi katika mstari huu.
  choice: Kimeachwa bila kutajwa wazi kwa kutumia ‘itatimia.’
  alternative: ‘Malipo yake yatatolewa kikamilifu’ au ‘mwisho wake utafika.’
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja wa kike bila nomino wazi katika mstari huu. Kutaja malipo au mwisho kungeamua maana ambayo maandishi yenyewe yanaiacha wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka. Muundo usio na kiima wazi katika kishazi cha kwanza umehifadhiwa kwa sababu maandishi ya Kiebrania hayaelezi wazi ni kitu gani kinachotimia.
