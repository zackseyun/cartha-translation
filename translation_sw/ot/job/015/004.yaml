  text: אַף אַ֭תָּה תָּפֵ֣ר יִרְאָ֑ה וְ/תִגְרַ֥ע שִׂ֝יחָ֗ה לִ/פְנֵי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/004.yaml
  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: sw
  text: Kwa kweli, wewe unabatilisha kumcha Mungu[a], na unapunguza tafakari[b] mbele za Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania ni “hofu”; hapa yaelekea ni hofu ya Mungu, yaani kicho au uchaji unaoelekezwa kwake. Pia: “unadhoofisha kumcha Mungu” au “unafanya kumcha Mungu kusiwe na nguvu.”'
    reason: lexical_alternative
  - marker: b
    text: Au “sala,” “ibada,” “mazungumzo,” au “malalamiko.” Neno la Kiebrania linaweza kumaanisha mawazo ya kutafakari au maneno yanayotolewa katika sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Kwa kweli
  rationale: Hapa chembe hii inasisitiza shtaka la Elifazi; “Kwa kweli” hutoa mkazo huo kwa Kiswahili cha kawaida.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi cha nafsi ya pili umoja kimetajwa wazi katika Kiebrania kwa ajili ya mkazo, kwa hiyo kimehifadhiwa.
- source_word: תָּפֵר
  choice: unabatilisha
  rationale: Kitenzi hiki katika kausativi kina maana ya kuvunja, kubatilisha, au kufanya jambo lisifae; “unabatilisha” huhifadhi ukali wa shtaka.
- source_word: יִרְאָה
  choice: kumcha Mungu
  rationale: Neno lenyewe ni “hofu/kicho,” lakini muktadha na ulinganifu na “mbele za Mungu” huonyesha hofu ya kidini, yaani kumcha Mungu.
- source_word: וְתִגְרַע
  choice: na unapunguza
  rationale: Kitenzi kina maana ya kupunguza, kufanya kidogo, au kuzuia; “unapunguza” huhifadhi maana pana bila kuifinya.
- source_word: שִׂיחָה
  choice: tafakari
  rationale: Neno linaweza kumaanisha kutafakari, mazungumzo ya ndani, sala, au hata malalamiko; “tafakari” huhifadhi upana wake wa kiroho kuliko “sala” peke yake.
- source_word: לִפְנֵי אֵל
  choice: mbele za Mungu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kuwa mbele au katika uwepo wa Mungu.
theological_decisions:
- issue: Maana ya kidini ya יִרְאָה
  choice: kumcha Mungu
  alternative: hofu; kicho
  rationale: Shtaka linahusu athari ya Ayubu juu ya uchaji wa Mungu, si hofu ya kawaida. “Kumcha Mungu” huonyesha uhusiano huo bila kuifanya iwe hisia tupu.
- issue: Maana ya שִׂיחָה mbele za Mungu
  choice: tafakari
  alternative: sala; ibada; mazungumzo; malalamiko
  rationale: Neno la Kiebrania lina maana pana. “Tafakari” huhifadhi mvutano kati ya mawazo ya ndani, usemi wa sala, na mazungumzo yanayoelekezwa kwa Mungu, badala ya kuamua kimya kuwa ni sala tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mistari miwili na shtaka kali la Elifazi vimehifadhiwa; “mbele za Mungu” ni usemi wa kibiblia ulio wa kawaida.
