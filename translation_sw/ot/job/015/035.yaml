  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: sw
  text: Hupata mimba ya taabu na huzaa uovu[a]; tumbo lao huandaa udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wana mimba ya taabu na huzaa uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹה
  choice: wanachukua mimba ya
  rationale: Kirai hiki kinahifadhi sitiari ya kupata mimba na kuzaa, huku kikitoa kauli ya kawaida na inayoeleweka katika Kiswahili.
- source_word: עָמָל
  choice: taabu
  rationale: Katika mashairi ya hekima neno hili linaweza kumaanisha taabu, madhara, au hila mbaya; “taabu” huhifadhi upana wake bila kulifanya kazi ya kawaida.
- source_word: וְיָלֹד
  choice: na kuzaa
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayodumisha taswira ya uzazi.
- source_word: אָוֶן
  choice: uovu
  rationale: Neno hili linaweza kumaanisha uovu, ubaya, au taabu; hapa muktadha wa shutuma za kimaadili na ulinganifu na udanganyifu unaunga mkono “uovu.”
- source_word: וּבִטְנָם
  choice: tumbo lao
  rationale: בטן linaweza kuwa tumbo au tumbo la uzazi. “Tumbo lao” ni la asili kwa Kiswahili na bado linaendeleza taswira ya ujauzito kwa sababu ya mistari iliyotangulia.
- source_word: תָּכִין
  choice: huandaa
  rationale: Hiphil ya כון humaanisha kuandaa, kuweka tayari, au kuimarisha; “huandaa” hudokeza mchakato wa ndani wa kutengeneza kitakachotokea.
- source_word: מִרְמָה
  choice: udanganyifu
  rationale: Hutoa maana ya hila au udanganyifu kwa lugha ya sasa na yenye hadhi bila kuifanya iwe mahususi kupita chanzo.
theological_decisions:
- issue: Idadi na jinsia ya mhusika aliyedokezwa
  choice: 'Wingi wa kijumla: “Wanachukua ... tumbo lao”'
  alternative: 'Umoja wa kiwakilishi: “Anachukua ... tumbo lake”'
  rationale: Ingawa הָרֹה ni umbo la umoja, kiambishi cha nafsi ya tatu wingi katika וּבִטְנָם pamoja na muktadha unaowazungumzia waovu kama kundi kinaunga mkono wingi wa kijumla. Hii pia huepuka kutopatana kwa umoja na wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari endelevu ya ujauzito na kuzaa imehifadhiwa; “huandaa” linaonyesha tendo la kawaida au la kitabia linalowafafanua waovu.
