  text: yale ambayo wenye hekima huyatangaza, na hawakuyaficha kutoka kwa baba zao[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yale ambayo baba zao hawakuyaficha,” au, “na hawakuficha chochote walichopokea kutoka kwa baba zao.” Kiebrania kinaruhusu namna zaidi ya moja ya kuelewa uhusiano kati ya “kuficha” na “baba zao.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yale ambayo
  rationale: Kiwakilishi hiki kinaanzisha maudhui yanayoendelezwa kutoka mstari uliotangulia; “yale ambayo” ni cha asili katika Kiswahili na huhifadhi maana ya kishazi rejeshi.
- source_word: חֲכָמִים
  choice: wenye hekima
  rationale: Nomino ya wingi inawarejelea watu wenye hekima; “wenye hekima” ni Kiswahili sanifu, cha heshima, na si dhana dhahania.
- source_word: יַגִּידוּ
  choice: huyatangaza
  rationale: Hiphil ya נגד ina maana ya kufanya jambo lijulikane au kulitangaza. Hali ya mazoea “hu-” inafaa kwa usemi huu kuhusu kupitishwa kwa hekima.
- source_word: וְלֹא
  choice: wala hawa-
  rationale: “Wala” huunganisha kwa kawaida wazo la pili lenye ukanushi na la kwanza katika Kiswahili.
- source_word: כִחֲדוּ
  choice: hawakuyaficha
  rationale: Kitenzi kina maana ya kuficha au kusitiri; “kuficha” ni cha kawaida na kinahifadhi picha ya kutokuzuia mafundisho yasijulikane.
- source_word: מֵאֲבוֹתָם
  choice: kutoka kwa baba zao
  rationale: Huhifadhi kwa ukaribu kihusishi מִן pamoja na “baba zao,” bila kubadili waziwazi kuwa “mababu” au kuamua kabisa kama baba ndio chanzo au wale waliofichwa jambo.
theological_decisions:
- issue: Uhusiano wa מֵאֲבוֹתָם na כִחֲדוּ
  choice: hawakuyaficha kutoka kwa baba zao
  alternative: yale ambayo baba zao hawakuyaficha; au hawakuficha chochote walichopokea kutoka kwa baba zao
  rationale: 'Kiebrania ni kifupi kisintaksia na kinaweza kueleweka kwa namna zaidi ya moja: baba zao wanaweza kuwa chanzo cha mapokeo, au watu ambao jambo halikufichwa kwao. Matini kuu inafuata kwa karibu mpangilio wa Kiebrania, na tanbihi inalinda utata huo wa kweli.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Wenye hekima” na “baba zao” huhifadhi uhalisi wa kihistoria; tanbihi inaeleza utata wa kisintaksia bila kuutatua kimadhehebu.
