  text: קוֹל פְּחָדִ֥ים בְּ/אָזְנָ֑י/ו בַּ֝/שָּׁל֗וֹם שׁוֹדֵ֥ד יְבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/021.yaml
  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
translation:
  language: sw
  text: Sauti ya vitisho imo masikioni mwake; akiwa na ustawi[a], mharibu humjia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa na amani” au “akiwa salama”; neno la Kiebrania שָׁלוֹם linaweza kumaanisha amani, hali njema, usalama, au ustawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Sauti
  rationale: Neno hili humaanisha sauti au kilio; hapa muundo wake pamoja na פְּחָדִים unaonyesha jambo linalosikika, si lazima maneno yanayotamkwa.
- source_word: פְּחָדִים
  choice: vitisho
  rationale: Wingi huu unaonyesha mambo mengi ya kutisha au ishara za hofu, si hisia ya ndani tu; “vitisho” huhifadhi nguvu ya picha hiyo.
- source_word: בְּאָזְנָיו
  choice: imo masikioni mwake
  rationale: Huhifadhi picha halisi ya Kiebrania, “katika masikio yake,” kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בַּשָּׁלוֹם
  choice: akiwa na ustawi
  rationale: שָׁלוֹם inaweza kumaanisha amani, usalama, hali njema, au ustawi. Katika muktadha wa maangamizi ya ghafla, “akiwa na ustawi” huonyesha hali yake ya kuonekana kuwa njema bila kufuta uwezekano mwingine.
- source_word: שׁוֹדֵד
  choice: mharibu
  rationale: Neno hili humaanisha mtu anayeharibu au kupora. “Mharibu” ni pana, wazi, na linafaa kwa tishio la maangamizi katika muktadha.
- source_word: יְבוֹאֶנּוּ
  choice: humjia
  rationale: Kitenzi kina kiambishi cha nafsi ya tatu umoja, yaani kwa maana halisi “anamjia.” Kauli ya mazoea ya Kiswahili huhifadhi hali ya sasa ya kishairi ya Kiebrania, huku muktadha ukiruhusu pia maana ya wakati ujao.
