translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na picha halisi ya sauti iliyo masikioni zimehifadhiwa; “akiwa na ustawi” limetumiwa kwa ufasaha, huku wigo wa maana wa שָׁלוֹם ukihifadhiwa katika tanbihi.
