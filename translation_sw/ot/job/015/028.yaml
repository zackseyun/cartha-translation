  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: sw
  text: Ameishi katika miji iliyoharibiwa,[a] katika nyumba ambazo hakuna mtu anayekaa, ambazo zilikusudiwa kuwa marundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliishi katika miji iliyoangamizwa, katika nyumba ambazo wao hawakai, zilizotengewa kuwa marundo.” Kiebrania cha mstari huu ni kifupi na kinaweza kutafsiriwa kwa njia kadhaa zinazokaribiana, hasa katika sehemu ya katikati.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: Amekaa
  rationale: Kitenzi שכן humaanisha kukaa au kuishi mahali. Kauli ya wakati timilifu inaleta kwa Kiswahili hali inayotokana na tendo hilo huku ikibaki karibu na umbo la simulizi la Kiebrania.
- source_word: עָרִים נִכְחָדוֹת
  choice: miji iliyoharibiwa
  rationale: Kirai hiki kinaeleza miji iliyofutiliwa mbali au kuachwa katika hali ya uharibifu; ‘iliyoharibiwa’ ni wazi na ya kawaida katika Kiswahili.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: katika nyumba ambazo hakuna mtu anayekaa
  rationale: Kiebrania ni kifupi na kina utata fulani kuhusu kiwakilishi. Tafsiri hii inawasilisha maana ya nyumba zisizokaliwa bila kulazimisha ufafanuzi usio wa hakika.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: ambazo zilikusudiwa
  rationale: Hitpaeli ya עתד inaweza kumaanisha kutayarishwa, kuteuliwa, au kukusudiwa. ‘Zilikusudiwa’ huhifadhi wazo la kuelekezwa kwenye hali fulani.
- source_word: לְגַלִּים
  choice: kuwa marundo ya mawe
  rationale: גַּלִּים ni marundo, hasa ya mawe au mabaki ya majengo. Kutaja mawe kunafanya taswira ya magofu ieleweke kwa kawaida katika Kiswahili.
