base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: sw
  text: Tazama, yeye hawatumainii hata watakatifu wake[a], wala mbingu si safi machoni pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viumbe wake watakatifu.” Kiebrania husema “watakatifu wake”; huenda hapa inawarejelea viumbe watakatifu wa mbinguni.
    reason: Huhifadhi maana pana ya neno la Kiebrania katika matini kuu huku ikieleza rejeleo linalowezekana bila kuliamua.
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni neno la kuvuta fikira kwa mkazo; “Tazama” ni la kawaida, lenye hadhi, na linaendeleza nguvu ya usemi wa Kiebrania.
- source_word: בִּקְדֹשָׁיו
  choice: watakatifu wake
  rationale: Huhifadhi maana ya moja kwa moja ya “walio watakatifu wake” bila kutaja wazi malaika; muktadha na ulinganifu na mbingu hudokeza viumbe wa mbinguni.
- source_word: לֹא יַאֲמִין
  choice: hawaaminiwi naye
  rationale: Kitenzi katika muktadha huu humaanisha kutoweka tumaini au imani katika mtu. Muundo huu wa Kiswahili unaonyesha kuwa Mungu ndiye asiyewaamini, huku ukihifadhi mpangilio wa kishairi.
- source_word: וְשָׁמַיִם
  choice: wala mbingu
  rationale: “Mbingu” hutoa wingi wa Kiebrania kwa kawaida katika Kiswahili; “wala” huendeleza ukanushaji sambamba wa mistari miwili.
- source_word: לֹא זַכּוּ
  choice: si safi
  rationale: Katika muktadha huu mzizi זכה unahusu usafi badala ya kutokuwa na hatia kisheria; “safi” linafaa kwa taswira ya kishairi ya ulimwengu.
- source_word: בְּעֵינָיו
  choice: machoni pake
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini “machoni pake” na ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Wanaorejelewa na “watakatifu wake”
  choice: Kuacha “watakatifu wake” katika matini huku tanbihi ikieleza kwamba huenda ni viumbe watakatifu wa mbinguni
  alternative: Kutafsiri moja kwa moja “malaika wake” au kuelewa kuwa ni waumini wanadamu
  rationale: Ulinganifu na “mbingu” unaelekea kuonyesha viumbe wa mbinguni, lakini Kiebrania hakisemi wazi “malaika.” Uamuzi huu unahifadhi upana na mvutano wa asili bila kuufunga kwa tafsiri moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. “Watakatifu wake” linahifadhi istilahi pana ya Kiebrania; tanbihi huzuia maana ya kawaida ya watakatifu wanadamu isifiche rejeleo linalowezekana la viumbe wa mbinguni.
