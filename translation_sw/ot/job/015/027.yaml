  text: 'kwa maana amejifunika uso kwa mafuta yake,

    na ameweka unene kwenye viuno vyake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa maelezo yaliyotangulia na ni kiunganishi cha kawaida katika Kiswahili sanifu.
- source_word: כִסָּה
  choice: ameufunika
  rationale: Inahifadhi maana halisi ya kufunika au kusitiri; kauli timilifu inaonyesha hali iliyotokana na tendo hilo.
- source_word: פָנָיו
  choice: uso wake
  rationale: Maana halisi ya uso inafaa zaidi katika muktadha huu wa taswira ya mwili.
- source_word: בְּחֶלְבּוֹ
  choice: kwa mafuta yake
  rationale: Inadumisha taswira halisi ya mafuta ya mwili badala ya kuibadili moja kwa moja kuwa dhana ya anasa au ustawi.
- source_word: וַיַּעַשׂ
  choice: ameweka
  rationale: Ingawa kitenzi kwa msingi humaanisha kufanya au kutengeneza, hapa 'ameweka' huwasilisha kwa Kiswahili cha kawaida wazo la kujiongezea unene mwilini.
- source_word: פִּימָה
  choice: unene
  rationale: Nomino hii adimu huenda inaashiria unene au tabaka la mafuta; 'unene' ni wazi na haifafanui kupita ushahidi wa neno.
- source_word: עֲלֵי
  choice: ki-
  rationale: Maana ya mahali ya 'juu ya/kwenye' imewasilishwa kwa muundo wa Kiswahili 'kiunoni,' ambao ni wa kawaida zaidi kuliko tafsiri ya neno kwa neno.
- source_word: כָסֶל
  choice: kiunoni mwake
  rationale: Neno linaweza kumaanisha kiuno, mbavu za pembeni, au sehemu za nyonga; 'kiunoni mwake' ni ya kawaida na inadumisha rejeleo la jumla la sehemu hiyo ya mwili.
