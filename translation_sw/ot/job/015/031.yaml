lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: Asitumainie
  rationale: Kauli ya kukataza yenye maana ya kutoweka tumaini au tegemeo katika kitu; umbo hili la Kiswahili linaendeleza onyo linalomhusu mtu huyo.
- source_word: בַשָּׁוְא / שָׁוְא
  choice: ubatili … ubatili
  rationale: שָׁוְא inaweza kumaanisha ubatili, utupu, uongo, au kitu kisicho na thamani. Kurudia neno lilelile kunahifadhi msisitizo na nguvu ya kishairi ya Kiebrania.
- source_word: נִתְעָה
  choice: huku akidanganyika
  rationale: Niphal ya תעה inaweza kueleza kudanganyika, kupotoshwa, au kupotea njia. Tafsiri hii ni ya kawaida katika Kiswahili na haifungi kauli hiyo kwa wazo la kujidanganya pekee.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu au matokeo yanayothibitisha onyo lililotangulia.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: utakuwa malipo yake
  rationale: תְּמוּרָה ni kile kinachopatikana badala ya kitu au kama marejesho; ‘malipo yake’ huwasilisha matokeo anayopata bila kutumia lugha nzito isiyo ya kawaida.
