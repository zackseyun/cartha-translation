  yaml_path: translation/ot/job/015/002.yaml
  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: sw
  text: Je, mtu mwenye hekima ajibu kwa maarifa ya upepo[a], na kujaza tumbo lake kwa upepo wa mashariki?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maarifa yaliyo kama upepo,” yaani, maarifa matupu au yasiyo na uzito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: mtu mwenye hekima
  rationale: Kiulizi הֲ pamoja na חָכָם kinaanzisha swali la balagha. Kiswahili cha kawaida hutumia ‘mtu mwenye hekima’ kwa maana ya jumla bila kulazimisha kuwa mtu fulani maalumu.
- source_word: יַעֲנֶה
  choice: ajibu
  rationale: Kauli tegemezi katika swali la balagha inaonyesha jambo linalotarajiwa au kufaa, na hivyo inadumisha nguvu ya karipio.
- source_word: דַעַת רוּחַ
  choice: maarifa ya upepo
  rationale: Muundo huu unaweza kumaanisha kihalisi ‘maarifa ya upepo’; hapa upepo unaashiria maarifa matupu au yasiyo na uzito. Taswira ya chanzo imehifadhiwa, huku maana yake ikifafanuliwa katika tanbihi.
- source_word: וִימַלֵּא
  choice: na kulijaza
  rationale: Kitenzi kinaendeleza swali lilelile la balagha. ‘Kulijaza’ kinahifadhi maana ya moja kwa moja na taswira ya tumbo.
- source_word: קָדִים
  choice: upepo wa mashariki
  rationale: קָדִים humaanisha upepo wa mashariki, ambao mara nyingi ni mkali au wenye madhara; tafsiri inadumisha taswira halisi bila kuongeza sifa isiyotajwa wazi.
- source_word: בִּטְנוֹ
  choice: tumbo lake
  rationale: בֶּטֶן hapa ni ‘tumbo’; uchaguzi huu unahifadhi taswira hai ya mwili kujazwa upepo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha na taswira mbili za upepo zimehifadhiwa; ‘maarifa ya upepo’ linaacha wazi uhusiano wa kisarufi wa דַעַת רוּחַ huku tanbihi ikieleza maana ya kimuktadha.
