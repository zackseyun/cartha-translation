  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: sw
  text: Wenye mvi na wazee wako miongoni mwetu, nao ni wazee kuliko baba yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mkuu kuliko baba yako kwa siku”; katika muktadha maana yake ni “mwenye umri mkubwa kuliko baba yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: wenye mvi na wazee
  rationale: Urudiaji huu unaunganisha makundi mawili yenye msisitizo. Kiswahili cha kawaida hakihitaji kurudia “pia”; kiunganishi “na” kinawasilisha jozi hiyo kwa ufasaha.
- source_word: שָׂב
  choice: wenye mvi
  rationale: Neno hili humaanisha waliokomaa kwa umri, likiwa na taswira halisi ya mvi. “Wenye mvi” huhifadhi taswira hiyo kwa lugha ya kawaida na yenye heshima.
- source_word: יָשִׁישׁ
  choice: wazee
  rationale: Neno hili humaanisha watu walioendelea sana kwa umri. “Wazee” linatofautisha kwa kiasi na “wenye mvi” bila kupoteza ulinganifu wa kishairi.
- source_word: בָּנוּ
  choice: wako miongoni mwetu
  rationale: Muundo wa kihusiano hapa unaonyesha kwamba wazee hao wako katika kundi au mapokeo yanayowakilishwa na Elifazi; “miongoni mwetu” ni usemi wa asili wa Kiswahili.
- source_word: כַּבִּיר
  choice: walio na siku nyingi
  rationale: Kwa kawaida neno hili ni “mkuu” au “mwenye nguvu,” lakini katika ulinganisho unaofuatwa na “siku” linaonyesha kuzidi kwa umri. Usemi huu pia huhifadhi nahau ya Kiebrania badala ya kuibana kuwa “wakubwa kwa umri” pekee.
- source_word: מֵאָבִיךָ יָמִים
  choice: kuliko baba yako
  rationale: Kihusishi מִן kinaweka ulinganisho na baba ya Ayubu; “kuliko baba yako” ni muundo wazi wa Kiswahili, huku “siku nyingi” ikibeba kipimo cha umri.
