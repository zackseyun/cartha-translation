translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi taswira ya “mwanga wa uso” huku “kuufifisha” ukifanya kishazi cha pili kiwe cha kawaida na kinachoeleweka kwa msomaji wa leo.
