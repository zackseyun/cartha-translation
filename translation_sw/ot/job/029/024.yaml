base_translation:
  language: en
  yaml_path: translation/ot/job/029/024.yaml
  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: sw
  text: Niliwatabasamia[a]—hawakuamini; wala hawakuufifisha[c] mwanga wa uso wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niliwachekea”; kitenzi cha Kiebrania kinaweza kumaanisha kucheka au kutabasamu. Kauli hiyo pia inaweza kuonyesha mshangao wao kwa kibali alichowaonyesha Ayubu.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mwanga wa uso wangu,” yaani, sura yenye uchangamfu au kibali.
    reason: cultural_note
  - marker: c
    text: Kwa maana halisi, “hawakuangusha mwanga wa uso wangu.”
    reason: literal_rendering
lexical_decisions:
- source_word: אֶשְׂחַק
  choice: Niliwatabasamia
  rationale: Kitenzi שׂחק kinaweza kumaanisha kucheka au kutabasamu. Katika muktadha wa heshima na kibali cha Ayubu kwa watu, “kutabasamu” kinaonyesha vizuri uso wake mwangavu bila kudokeza dhihaka.
- source_word: אֲלֵהֶם
  choice: -wa- katika “niliwatabasamia”
  rationale: Kihusishi אֶל kinaelekeza tendo kwa watu hao; Kiswahili cha kawaida huonyesha uelekeo huo kwa kiambishi cha yambwa katika “kuwatabasamia.”
- source_word: לֹא יַאֲמִינוּ
  choice: hawakuamini
  rationale: Hili ndilo wazo la moja kwa moja la Kiebrania. Muktadha unaweza kudokeza kwamba walishangazwa na tabasamu au kibali cha Ayubu, lakini tafsiri haiongezi maana hiyo kimya-kimya.
- source_word: וְאוֹר פָּנַי
  choice: mwanga wa uso wangu
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya uso wenye nuru, inayoweza kuashiria hali ya uchangamfu au kibali.
- source_word: לֹא יַפִּילוּן
  choice: hawakuufifisha
  rationale: Kwa maana ya msingi, muundo huu unasema hawakuufanya mwanga uanguke. “Hawakuufifisha” ni Kiswahili cha asili kinachodumisha sitiari ya mwanga na kueleza kwamba hawakufanya uso wake mwangavu upoteze nuru.
