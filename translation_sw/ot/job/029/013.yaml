  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: sw
  text: Baraka ya mtu aliyekuwa akiangamia ilinijia[a], nami niliufanya moyo wa mjane uimbe kwa furaha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baraka ya mtu aliyekuwa akielekea kufa ilinijia.” Neno la Kiebrania linaweza kumaanisha mtu anayeangamia, aliyeharibikiwa, au aliye karibu kufa.
    reason: lexical_alternative
  - marker: b
    text: Au, “niliufanya moyo wa mjane ushangilie,” au “upige kelele kwa furaha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: Baraka ya
  rationale: Huhifadhi muundo wa hali ya kuambatana unaoonyesha kuwa baraka ilitoka kwa mtu anayeelezwa baada yake.
- source_word: אֹבֵד
  choice: mtu aliyekuwa akiangamia
  rationale: Kitenzi-jina hiki cha Qal kinaweza kumaanisha mtu anayeangamia, aliye katika hali ya uharibifu, au aliye karibu kufa; tafsiri hii huhifadhi maana pana bila kuibana kuwa kifo pekee.
- source_word: עָלַי תָּבֹא
  choice: ilinijia
  rationale: Ni Kiswahili cha kawaida kinachowasilisha mwendo wa baraka kumfikia Ayubu; umbo lisilotimilika linaeleweka kwa wakati uliopita katika kumbukumbu ya kishairi ya sura hii.
- source_word: לֵב אַלְמָנָה
  choice: moyo wa mjane
  rationale: Huhifadhi taswira ya moyo kama nafsi ya ndani na uhusiano wa moja kwa moja na mjane.
- source_word: אַרְנִן
  choice: niliufanya ... uimbe kwa furaha
  rationale: Huhifadhi nguvu ya kisababishi ya Hiphil na maana ya kutoa sauti au kuimba kwa shangwe.
