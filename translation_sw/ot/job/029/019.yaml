  yaml_path: translation/ot/job/029/019.yaml
  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: sw
  text: Mzizi wangu ulienea kuelekea kwenye maji, na umande ulikaa usiku kucha juu ya matawi yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mavuno yangu.” Neno la Kiebrania hapa si la kawaida katika muktadha huu; “matawi” yamechaguliwa kwa sababu yanaendana kwa urahisi zaidi na taswira ya mmea yenye mzizi na umande.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: Mzizi wangu
  rationale: Nomino ya Kiebrania iko katika umoja ikiwa na kiambishi cha nafsi ya kwanza; umoja pia unasikika kwa kawaida katika taswira hii ya kishairi ya Kiswahili.
- source_word: פָתוּחַ
  choice: ulienea
  rationale: Kirai hiki kinaonyesha hali ya kuwa wazi au kujitanua. “Ulienea” huwasilisha kwa kawaida taswira ya mzizi unaojitanua bila kufanya sentensi kuwa ngumu.
- source_word: אֱלֵי מָיִם
  choice: kuelekea kwenye maji
  rationale: אֱלֵי huonyesha mwelekeo au uhusiano wa kuelekea kitu, huku מָיִם likiwa neno la wingi kwa umbo lakini mara nyingi lenye maana ya jumla. Tafsiri hii huhifadhi mwelekeo wa mzizi kuelekea maji.
- source_word: וְטַל
  choice: na umande
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya טַל.
- source_word: יָלִין
  choice: ulikaa usiku kucha
  rationale: Kitenzi לון humaanisha kukaa au kulala mahali usiku. Kauli hii ya Kiswahili ni wazi na huhifadhi wazo la kudumu usiku kucha.
- source_word: בִּקְצִירִי
  choice: juu ya matawi yangu
  rationale: Ingawa קָצִיר kwa kawaida humaanisha “mavuno,” maana hiyo si rahisi katika muktadha wa umande. “Matawi yangu” inaendeleza taswira ya mmea iliyoanza na mzizi; tafsiri ya kawaida zaidi ya neno imehifadhiwa katika tanbihi kwa sababu maandishi ya Kiebrania si ya kawaida hapa.
