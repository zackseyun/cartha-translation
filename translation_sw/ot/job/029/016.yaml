  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: sw
  text: 'Nilikuwa baba wa wahitaji,

    na shauri nisilolijua[a] nililichunguza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kesi ya mtu nisiyemjua niliichunguza.”
    reason: Kiebrania kinaruhusu usomaji unaohusisha “sikumjua” na mtu mwenye shauri, badala ya shauri lenyewe.
lexical_decisions:
- source_word: אָב
  choice: baba
  rationale: Neno hili kihalisi ni “baba.” Hapa limetumiwa kisitiari kuonyesha ulinzi, utunzaji, na utetezi wa wahitaji; taswira ya asili imehifadhiwa.
- source_word: אָנֹכִי
  choice: Nilikuwa
  rationale: Kiwakilishi huru kinasisitiza mhusika, lakini katika Kiswahili msisitizo huo unaweza kubebwa kiasili na muktadha. Kishazi cha Kiebrania hakina kitenzi wazi, na simulizi la wakati uliopita katika Ayubu 29 linahitaji “Nilikuwa.”
- source_word: לָאֶבְיוֹנִים
  choice: kwa wahitaji
  rationale: אֶבְיוֹן humaanisha maskini au mhitaji. “Wahitaji” linaonyesha hali pana ya uhitaji na linaungana kiasili na usemi “baba kwa.”
- source_word: וְרִיב
  choice: na kesi
  rationale: רִיב linaweza kumaanisha shauri, mgogoro, au kesi. “Kesi” linafaa katika muktadha wa kuchunguza na kutetea madai ya mtu.
- source_word: לֹא יָדַעְתִּי
  choice: ya mtu nisiyemjua
  rationale: Kitenzi ידע hapa kinaweza kueleza kutofahamiana na mtu au kutokuwa na ujuzi wa awali kuhusu jambo. Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba mhusika alikuwa mtu asiyejulikana kwa Ayubu, huku ukiacha uwezekano wa kisarufi kuhusu shauri katika tanbihi.
- source_word: אֶחְקְרֵהוּ
  choice: niliichunguza
  rationale: חקר humaanisha kutafuta kwa makini, kuchunguza, au kudadisi. “Niliichunguza” huonyesha uchunguzi wa makusudi, na kiambishi -i- kinarejelea “kesi.”
theological_decisions:
- issue: Kirejewa cha kiambishi cha nafsi ya tatu katika אֶחְקְרֵהוּ na uhusiano wa לֹא יָדַעְתִּי
  choice: Maandishi makuu yanaeleza kwamba Ayubu alichunguza kesi ya mtu ambaye hakumjua.
  alternative: Ayubu alichunguza shauri ambalo hakulijua.
  rationale: Kiebrania kinaruhusu mvutano fulani kuhusu iwapo kutokujua kunamhusu mtu au shauri. Tafsiri kuu inafuata usomaji wa kawaida wa kumtetea mgeni, huku mbadala halisi ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku usambamba wa mistari miwili ya Kiebrania ukihifadhiwa. Hakuna tanbihi iliyowekwa kwa sababu mbadala wa Kiingereza uliotolewa unaonekana kutolingana na alama yake; hata hivyo, utata wa Kiebrania umeandikwa katika maamuzi ya tafsiri.
