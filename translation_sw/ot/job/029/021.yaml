  text: They listened to me and waited[b][a], and they kept silent for my counsel.
translation:
  language: sw
  text: Walinisikiliza, wakaningojea[a], wakanyamaza kwa shauri langu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakangoja kwa matarajio.” Kitenzi hicho kinaweza pia kuwa na maana ya kutumaini au kutarajia.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakanyamaza mbele ya shauri langu” au “walinyamaza kwa sababu ya shauri langu.” Uhusiano wa kirai “kwa shauri langu” na kitendo cha kunyamaza unaweza kueleweka kwa njia zaidi ya moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי שָׁמְעוּ
  choice: Walinisikiliza
  rationale: Muundo huu unaonyesha kuwa Ayubu ndiye aliyesikilizwa; ‘kunisikiliza’ ni Kiswahili cha kawaida na huonyesha usikivu wa makini, si kusikia sauti tu.
- source_word: וְיִחֵלּוּ
  choice: na kuningojea
  rationale: Kitenzi יחל hapa kina maana ya kungoja kwa matarajio. ‘Kuningoj ea’ katika mfuatano huu kinaeleweka kuwa walikuwa wakingojea Ayubu aseme.
- source_word: וְיִדְּמוּ
  choice: wakanyamaza
  rationale: דמם huonyesha kunyamaza au kutulia; ‘wakanyamaza’ ni usemi wa asili unaofaa muktadha wa watu wanaosubiri shauri.
- source_word: לְמוֹ עֲצָתִי
  choice: ili kusikia shauri langu
  rationale: לְמוֹ ni umbo la kishairi lenye uhusiano usio bayana kabisa na ‘shauri langu.’ Tafsiri hii huonyesha kusudi linalodokezwa na muktadha, huku tanbihi ikihifadhi uwezekano wa kuelewa kuwa walinyamaza kwa sababu ya au mbele ya shauri hilo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Shauri’ limechaguliwa badala ya ‘ushauri’ ili kudumisha ladha ya hekima na uamuzi wa mtu mwenye kuheshimiwa, bila kuwa la kizamani kupita kiasi.
