  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: sw
  text: 'Walinisubiri kama wanavyoingojea mvua;

    nao wakafungua vinywa vyao kwa upana kwa ajili ya mvua za mwisho za msimu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mvua ya masika.” Neno la Kiebrania מַלְקוֹשׁ linamaanisha mvua ya msimu inayonyesha baadaye, au mwishoni mwa msimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: walinisubiri
  rationale: Kitenzi יחל hapa kinaonyesha kusubiri kwa matarajio. Muundo wenye kiambishi cha nafsi unahifadhi לִי, ‘kwa ajili yangu,’ kwa Kiswahili cha kawaida.
- source_word: כַמָּטָר
  choice: kama wanavyoisubiri mvua
  rationale: כ ya ulinganisho inaonyesha namna walivyomsubiri Ayubu. Kurudia ‘wanavyoisubiri’ hufanya ulinganisho uwe wazi na wa asili kwa Kiswahili.
- source_word: לִי
  choice: -ni- katika ‘walinisubiri’
  rationale: Kiebrania kinasema moja kwa moja ‘kwa ajili yangu,’ si ‘neno langu’ wala ‘ushauri wangu’; kiambishi cha yambwa kinahifadhi maana hiyo bila kuongeza ufafanuzi.
- source_word: וּפִיהֶם
  choice: walifungua vinywa vyao
  rationale: Tafsiri inadumisha wingi wa ‘vinywa vyao’ na kuunganisha kiunganishi katika mtiririko wa kishairi.
- source_word: פָּעֲרוּ
  choice: walifungua
  rationale: פער humaanisha kufungua, hasa kinywa, kwa upana. Katika Kiswahili, tendo la kufungua vinywa kwa kutarajia mvua linadokeza kufungua kwa upana bila kutumia usemi usio wa kawaida.
- source_word: לְמַלְקוֹשׁ
  choice: kwa ajili ya mvua ya masika
  rationale: מַלְקוֹשׁ ni mvua ya mwisho ya msimu, inayonyesha karibu na mwisho wa kipindi cha kilimo. ‘Mvua ya masika’ ni usemi unaoeleweka Afrika Mashariki, huku tanbihi ikihifadhi maana mahususi ya mvua ya mwisho.
theological_decisions: []
translation_notes:
  register: Lugha ni ya sasa, yenye hadhi na ya kishairi kwa kiasi. Mgawanyo wa mistari unadumisha usambamba wa Kiebrania. ‘Mvua ya masika’ ni ya kawaida katika Kiswahili cha Afrika Mashariki, na tanbihi huepusha kuifanya ilingane kikamilifu na misimu ya kila eneo.
