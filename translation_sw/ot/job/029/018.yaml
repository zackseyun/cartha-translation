  yaml_path: translation/ot/job/029/018.yaml
  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: sw
  text: Ndipo nilisema, “Nitakufa katika kiota changu, nami nitazidisha siku zangu kama mchanga[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “nami nitazidisha siku zangu kama feniksi.” Neno la Kiebrania lililotafsiriwa “mchanga” hapa limeeleweka na baadhi ya watu kuwa jina la ndege, lakini maana ya “mchanga” ina uwezekano mkubwa zaidi katika muktadha huu na inapatana na taswira ya kawaida ya kibiblia ya wingi mkubwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Ndipo nilisema
  rationale: Waw inaendeleza kumbukumbu ya Ayubu; “Ndipo nilisema” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: עִם קִנִּי
  choice: katika kiota changu
  rationale: Ingawa עִם kwa kawaida ni “pamoja na,” hapa muungano wake na “kiota” unaeleza mahali pa kufia. “Katika” huwasilisha maana hiyo kwa Kiswahili cha asili huku ikihifadhi taswira ya kiota.
- source_word: אֶגְוָע
  choice: Nitakufa
  rationale: Kitenzi hiki humaanisha kufa au kukata roho; “nitakufa” ni wazi, sahili, na chenye hadhi.
- source_word: וְכַחוֹל
  choice: kama mchanga
  rationale: Maana ya kawaida ya חוֹל ni “mchanga,” na hapa inafaa taswira ya kibiblia ya wingi mkubwa. Uwezekano wa kuielewa kama jina la ndege umehifadhiwa katika tanbihi.
- source_word: אַרְבֶּה יָמִים
  choice: nitazidisha siku zangu
  rationale: Hifili ya רבה ina maana ya kufanya ziwe nyingi au kuongeza. “Nitazidisha siku zangu” huhifadhi nguvu ya kitenzi na kueleza matarajio ya maisha marefu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya kishairi ya “kiota” imehifadhiwa badala ya kurahisishwa kuwa “nyumbani.” Alama ya tanbihi imewekwa baada ya “nilisema” ili kuendana na safu ya mashairi iliyotolewa, ingawa tanbihi yenyewe inahusu usomaji mbadala wa חוֹל.
