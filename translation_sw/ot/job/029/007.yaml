lexical_decisions:
- source_word: בְּצֵאתִי
  choice: Nilipotoka kwenda
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi ya kwanza una maana ya wakati. Nyongeza ya “kwenda” inaonyesha kwa Kiswahili cha kawaida kwamba lango ndilo alilolielekea.
- source_word: שַׁעַר
  choice: langoni
  rationale: Katika mazingira ya Mashariki ya Karibu ya kale, lango lilikuwa pia mahali pa shughuli za kiraia na hukumu. Hali ya mahali “langoni” ni ya asili katika Kiswahili.
- source_word: עֲלֵי קָרֶת
  choice: karibu na mji
  rationale: Kirai hiki kisicho cha kawaida kinaweka lango katika uhusiano wa mahali na mji bila kuunganisha kimyakimya maneno ‘lango’ na ‘mji’ kuwa neno moja.
- source_word: בָּרְחוֹב
  choice: katika uwanja
  rationale: רְחוֹב hapa ni eneo pana la wazi la umma, si lazima barabara nyembamba; “uwanja” huwasilisha vizuri mazingira hayo.
- source_word: אָכִין
  choice: nilipojiandalia
  rationale: Hifili ya כון inaweza kumaanisha kuandaa, kuweka, au kuimarisha. “Kujiandalia” inaonyesha Jobu akitayarisha mahali pake pa kuketi bila kudokeza udumu usiotajwa.
- source_word: מוֹשָׁבִי
  choice: kiti changu
  rationale: Katika muktadha wa lango na eneo la umma, neno hili linamaanisha kiti au mahali pa kuketi, wala si makao ya kuishi.
