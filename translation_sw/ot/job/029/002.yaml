lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: Laiti ningekuwa
  rationale: Kirai hiki cha Kiebrania, ambacho kwa neno moja moja huanza ‘Ni nani atakayenipa…?’, ni nahau inayoonyesha tamanio lenye huzuni. ‘Laiti ningekuwa’ kinawasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כְיַרְחֵי קֶדֶם
  choice: kama nilivyokuwa miezi iliyopita
  rationale: כְּ huonyesha ulinganisho, יֶרַח ni ‘mwezi’, na קֶדֶם hapa hurejelea wakati uliopita. Neno ‘nilivyokuwa’ limewekwa wazi kwa Kiswahili ili kukamilisha ulinganisho unaodokezwa na Kiebrania.
- source_word: כִּימֵי
  choice: kama siku zile
  rationale: Huhifadhi ulinganifu wa kishairi na mstari wa ‘miezi iliyopita’ kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni umbo la kishairi la umoja linalomaanisha ‘Mungu’, linalotumiwa mara nyingi katika Ayubu; hakuna msingi wa kulipanua kuwa ‘Mungu Mwenyezi’ katika mstari huu.
- source_word: יִשְׁמְרֵנִי
  choice: aliponilinda
  rationale: Kitenzi שׁמר kinaweza kumaanisha kulinda, kutunza, au kuangalia kwa ulinzi. ‘Aliponilinda’ ni cha asili katika Kiswahili na kinaonyesha uangalizi wa Mungu wenye ulinzi.
theological_decisions:
- issue: Tendo la Mungu katika kumbukumbu ya Ayubu
  choice: Mungu aliponilinda
  alternative: Mungu aliponitunza / Mungu aliponiangalia
  rationale: Tafsiri inaonyesha kumbukumbu ya Ayubu kuhusu ulinzi wa Mungu wa zamani bila kuongeza maelezo ya kiteolojia ambayo hayajasemwa katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini kinachoeleweka kwa urahisi. ‘Laiti’ huhifadhi sauti ya tamanio na maombolezo; urudiaji wa ‘kama’ huhifadhi usambamba wa Kiebrania.
