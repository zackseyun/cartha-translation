  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: sw
  text: Sauti ya wakuu ilinyamaza[a], na ulimi wao ukashikamana na kaakaa lao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sauti ya viongozi ikafichika.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ulimi wao ukashikamana na kaakaa lao”; ni taswira ya kutoweza au kutotaka kusema.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: sauti
  rationale: Katika muktadha huu neno hilo linamaanisha sauti ya watu wanaposema; “sauti” ni la kawaida na linafaa kwa taswira ya kishairi.
- source_word: נְגִידִים
  choice: wakuu
  rationale: Neno hili linaweza kumaanisha viongozi, watawala, au watu wenye cheo. “Wakuu” linaonyesha hadhi yao bila kulifanya lihusu ufalme pekee.
- source_word: נֶחְבָּאוּ
  choice: ilinyamaza
  rationale: Maana ya msingi ni kufichwa, lakini sauti ikiwa kiima, wazo ni kwamba haikusikika tena. “Ilinyamaza” linaeleza nahau hiyo kwa Kiswahili cha asili.
- source_word: וּלְשׁוֹנָם
  choice: na ulimi wao
  rationale: Kiebrania kimetumia umoja wa kijumla wenye kiambishi cha wingi; umoja “ulimi wao” unahifadhi muundo na taswira ya kishairi.
- source_word: לְחִכָּם
  choice: na kaakaa lao
  rationale: Neno hili humaanisha kaakaa, yaani sehemu ya juu ndani ya kinywa. “Kaakaa” ni neno sahihi na fupi katika Kiswahili Sanifu.
- source_word: דָּבֵקָה
  choice: ukashikamana
  rationale: Kitenzi humaanisha kushikamana au kuganda. “Ukashikamana” kinahifadhi maana ya moja kwa moja na taswira ya kushindwa au kukataa kusema.
