  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: sw
  text: Nilivaa uadilifu[a], nao ukanivika; haki yangu ilikuwa kama joho na kilemba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki.” Neno la Kiebrania צֶדֶק linaweza kutafsiriwa “uadilifu” au “haki.”
    reason: lexical_alternative
  - marker: b
    text: Kilemba hapa ni vazi la kichwani lililofungwa kwa kuzungushwa, sehemu ya taswira ya heshima na hadhi mbele ya watu.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: uadilifu
  rationale: Neno hili linaweza kumaanisha uadilifu au haki. Hapa “uadilifu” huhifadhi sifa ya kimaadili na kulitofautisha na מִשְׁפָּטִי katika kishazi cha pili.
- source_word: לָבַשְׁתִּי
  choice: Nilivaa
  rationale: Kitenzi hiki kwa kawaida humaanisha kuvaa vazi; uchaguzi huu ni wa asili katika Kiswahili na unadumisha sitiari hai ya mavazi.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: nao ukanivika
  rationale: 'Urudiaji wa mzizi לבש unahifadhiwa: Ayubu alivaa uadilifu, nao uadilifu ukamvika. Kiambishi “-o” hurejelea uadilifu.'
- source_word: כִּמְעִיל
  choice: kama joho
  rationale: מְעִיל ni vazi la nje au joho; “joho” ni neno linaloeleweka na linafaa kwa taswira ya heshima.
- source_word: וְצָנִיף
  choice: na kilemba
  rationale: צָנִיף ni kitambaa cha kichwani kilichozingirwa; “kilemba” ni kisawe cha kawaida na cha moja kwa moja katika Kiswahili.
- source_word: מִשְׁפָּטִי
  choice: haki yangu
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, haki, au utekelezaji wa haki. Katika muktadha wa mwenendo wa Ayubu hadharani, “haki yangu” huonyesha utendaji wake wa haki bila kuifanya ifanane kabisa na “uadilifu” wa kishazi cha kwanza.
