lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: nilipokuwa
  rationale: Katika muktadha wa kumbukumbu ya siku za zamani, kishazi cha wakati ni cha asili katika Kiswahili na kinaunganika na mstari uliotangulia.
- source_word: הָיִיתִי בִּימֵי
  choice: nilipokuwa katika siku za
  rationale: Kinahifadhi usemi wa Kiebrania wa kipindi cha maisha kwa Kiswahili sanifu kinachoeleweka.
- source_word: חָרְפִּי
  choice: ustawi wangu
  rationale: Neno linaweza kumaanisha majira ya vuli au wakati wa kukomaa na kusitawi. 'Ustawi wangu' linaeleza hali ya Ayubu alipokuwa akisitawi bila kulifanya neno limaanishe ujana tu.
- source_word: בְּסוֹד
  choice: wakati shauri la siri
  rationale: סוֹד hujumuisha shauri la siri, ukaribu wa kuaminiana, au ushirika wa karibu. Tafsiri hii inadumisha wazo la siri na shauri huku tanbihi ikionyesha maana ya uhusiano wa karibu.
- source_word: אֱלוֹהַּ
  choice: la Mungu
  rationale: Ni uhusiano wa umilikaji katika muundo 'shauri la siri la Mungu,' na 'Mungu' ndiyo tafsiri ya kawaida hapa.
- source_word: עֲלֵי
  choice: lilipokuwa juu ya
  rationale: Inahifadhi taswira ya uwepo au fadhili za Mungu zikiwa juu ya hema, bila kuibadili moja kwa moja kuwa dhana ya jumla ya baraka.
- source_word: אָהֳלִי
  choice: hema langu
  rationale: Inadumisha taswira halisi ya Kiebrania; kwa maana pana hema linaweza kuwakilisha makao au jamaa ya Ayubu.
theological_decisions:
- issue: Maana ya uhusiano wa zamani wa Ayubu na Mungu katika בְּסוֹד אֱלוֹהַּ
  choice: shauri la siri la Mungu lilikuwa juu ya hema lake
  alternative: ukaribu wa Mungu wa kuaminiana ulikuwa juu ya hema lake
  rationale: Neno la Kiebrania linaweza kuashiria shauri la faragha na pia ushirika wa karibu. Matini kuu inadumisha kipengele cha siri na shauri, huku tanbihi ikihifadhi maana ya ukaribu bila kudai ufunuo maalumu wa kifumbo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendelea kutoka ombi la Ayubu katika mstari uliotangulia; koma ya mwisho inaonyesha kuwa sentensi inaendelea.
