  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: sw
  text: Kwa maana sikio liliponisikia, liliniita mwenye heri, na jicho liliponiona, lilinishuhudia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lilitoa ushahidi kwa ajili yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kushuhudia au kutoa ushahidi; katika muktadha huu ushahidi huo ni wa kumpendelea Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza maelezo ya heshima ambayo Ayubu alikuwa nayo hapo awali na kuunganisha mstari huu kwa kawaida na yaliyotangulia.
- source_word: אֹזֶן שָׁמְעָה
  choice: sikio liliponisikia
  rationale: Inahifadhi taswira ya kiungo cha mwili katika umoja kinachowakilisha kwa ujumla mtu yeyote aliyesikia habari za Ayubu.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: liliniita mwenye heri
  rationale: Kitenzi kinamaanisha kumtangaza au kumhesabu mtu kuwa mwenye heri; 'mwenye heri' ni cha heshima na hakipunguzi maana kuwa furaha ya hisia tu.
- source_word: וְעַיִן רָאֲתָה
  choice: na jicho liliponiona
  rationale: Inadumisha usambamba mfupi wa kusikia na kuona, huku kiambishi cha yambwa kikieleweka kutokana na muktadha wa Kiebrania.
- source_word: וַתְּעִידֵנִי
  choice: lilinitolea ushahidi mzuri
  rationale: Kitenzi ni kutoa au kubeba ushahidi. Muktadha unaonyesha ushahidi wa kumpendelea Ayubu, na 'mzuri' huifanya maana hiyo iwe wazi katika Kiswahili cha kawaida.
