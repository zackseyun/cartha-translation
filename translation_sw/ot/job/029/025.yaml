base_translation:
  language: en
  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: sw
  text: Nilichagua njia yao, nikaketi mbele yao[a]; niliishi kama mfalme katika kikosi[b], kama mtu anayewafariji waombolezaji.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilichagua mwendo wao, nikaketi kama mkuu.” Kiebrania kinaweza kumaanisha kwamba Ayubu alichagua au aliidhinisha njia ambayo wengine walipaswa kufuata, kisha akashika nafasi ya uongozi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama mfalme katika kundi.” Neno la Kiebrania גְּדוּד linaweza kumaanisha kikosi, kundi, au jeshi dogo.
    reason: lexical_alternative
  - marker: c
    text: Ulinganisho huu wa mwisho ni mgumu. Kiebrania huenda kikamaanisha “kama mtu anayewafariji waombolezaji,” kikisisitiza jukumu la Ayubu la kufariji hata alipokuwa katika nafasi ya heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: Nilichagua njia yao
  rationale: Kitenzi cha Kiebrania katika muktadha huu wa kukumbuka maisha ya zamani kinaeleweka kama tendo la wakati uliopita. “Njia yao” inadumisha picha ya njia na uwezekano wa Ayubu kuchagua au kuidhinisha mwendo ambao wengine wangeufuata.
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: nikaketi kama mkuu
  rationale: Tafsiri hii inadumisha picha halisi ya kuketi na maana ya kushika nafasi ya uongozi.
- source_word: וְאֶשְׁכּוֹן
  choice: nilikaa
  rationale: “Nilikaa” ni Kiswahili cha sasa na cha heshima, na kinaweza kuonyesha kuwapo au kudumu mahali bila kutumia neno lisilo la kawaida.
- source_word: כְּמֶלֶךְ
  choice: kama mfalme
  rationale: Kiambishi כְּ kinaonyesha ulinganisho, kwa hiyo “kama mfalme” kinadumisha tashbihi wazi.
- source_word: בַּגְּדוּד
  choice: katikati ya kikosi
  rationale: גְּדוּד inaweza kumaanisha kikosi, kundi, au jeshi dogo. Umoja wa “kikosi” unafuata umbo la Kiebrania huku tanbihi ikihifadhi upana wa maana.
- source_word: אֲבֵלִים יְנַחֵם
  choice: mtu anayewafariji waombolezaji
  rationale: Kitenzi cha umoja kinadokeza mfariji mmoja, naye אֲבֵלִים ni watu wanaoomboleza. Muundo huu ni wa asili katika Kiswahili na unadumisha ulinganisho wenye ugumu wa kifasiri.
theological_decisions:
- issue: Uhusiano wa tashbihi ya mwisho na nafasi ya Ayubu ya heshima
  choice: kama mtu anayewafariji waombolezaji
  alternative: kama mfalme katikati ya kikosi, wakati anapowafariji waombolezaji
  rationale: Kiebrania kinaweza kusomwa kama tashbihi nyingine inayosisitiza jukumu la Ayubu la kufariji. Tafsiri kuu haiongezi kiunganishi cha wakati wala kuamua zaidi ya maandishi yanavyoruhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha mfululizo wa matendo na tashbihi za Kiebrania; tanbihi zinaonyesha maana mbadala bila kuondoa utata halisi.
