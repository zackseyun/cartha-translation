  text: Kwa maana nilimwokoa maskini aliyelia akiomba msaada, na yatima[a] ambaye hakuwa na mtu wa kumsaidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asiye na baba.” Neno la Kiebrania humaanisha hasa mtu asiye na baba, ambaye alikuwa katika hali ya udhaifu wa kijamii.
