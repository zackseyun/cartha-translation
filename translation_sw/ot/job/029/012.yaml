lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya heshima ambayo Ayubu aliipata katika muktadha uliotangulia.
- source_word: אֲמַלֵּט
  choice: nilimwokoa
  rationale: Kauli ya Piel ya מלט inaonyesha tendo la kuingilia kati na kumwokoa mtu kutoka katika shida.
- source_word: עָנִי
  choice: maskini
  rationale: Katika muktadha huu wa haki kwa walio hatarini kijamii, neno hili linaeleweka kwa kawaida kuwa mtu maskini, ingawa linaweza pia kumaanisha mtu aliyeteseka.
- source_word: מְשַׁוֵּעַ
  choice: aliyelia akiomba msaada
  rationale: Kirai hiki kinaonyesha kilio cha dhati cha kutafuta msaada na kudumisha hali endelevu ya participle ya Kiebrania.
- source_word: יָתוֹם
  choice: yatima
  rationale: Hili ndilo neno la kawaida na la heshima katika Kiswahili kwa mtoto aliyefiwa na mzazi au wazazi; katika matumizi ya Kiebrania hapa humaanisha hasa asiye na baba.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: ambaye hakuwa na mtu wa kumsaidia
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha kwamba yatima huyo hakupata mtu yeyote wa kumsaidia.
