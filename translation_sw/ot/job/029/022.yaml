translation:
  language: sw
  text: Baada ya maneno yangu, hawakusema tena[a]; neno langu liliwatonea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakujibu tena”; kitenzi cha Kiebrania kinaweza kumaanisha kutosema tena au kutojibu baada ya Ayubu kusema.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “neno langu liliwatonea”; kitenzi kina taswira ya kishairi ya kudondoka matone juu yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: Baada ya mimi kusema
  rationale: Huwasilisha kwa Kiswahili cha kawaida uhusiano wa wakati na maana ya maneno ya Ayubu, bila kugeuza usemi kuwa kitu cha kufuatwa kihalisi.
- source_word: לֹא יִשְׁנוּ
  choice: hawakusema tena
  rationale: Katika muktadha wa mazungumzo, kitenzi kinaeleza kwamba wasikilizaji hawakuendelea kusema baada ya Ayubu; tanbihi huhifadhi uwezekano wa maana ya kutojibu tena.
- source_word: וְעָלֵימוֹ
  choice: liliwadondokea
  rationale: Kiambishi cha yambwa katika kitenzi kinawasilisha maana ya 'juu yao' kwa Kiswahili asilia huku kikihifadhi mwelekeo wa taswira.
- source_word: תִּטֹּף
  choice: liliwadondokea
  rationale: Huhifadhi taswira ya kishairi ya kitu kinachodondoka matone juu ya wasikilizaji, badala ya kuifafanua kuwa usemi mpole au wenye mamlaka.
- source_word: מִלָּתִי
  choice: neno langu
  rationale: Umoja wa nomino umehifadhiwa, na 'neno' linaweza kumaanisha usemi wa msemaji katika Kiswahili cha kishairi.
