  text: when his lamp shone above my head[a], and by his light I walked through darkness.
translation:
  language: sw
  text: 'wakati taa yake ilipong’aa juu ya kichwa changu,

    na kwa nuru yake nilitembea gizani.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nuru ya taa hiyo nilitembea gizani.” Kiambishi cha umilikishi cha Kiebrania katika “kwa nuru yake” kinaweza kumrejelea Mungu katika muktadha, au, kwa ukaribu zaidi, taa iliyotajwa.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: wakati taa yake ilipong’aa
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha wakati, na נֵר ni taa halisi, si nuru kwa ujumla. Kiswahili hiki kinaendeleza picha halisi kwa njia ya kawaida.
- source_word: עֲלֵי רֹאשִׁי
  choice: juu ya kichwa changu
  rationale: Kirai hiki kina maana ya mahali; tafsiri hii ni ya asili na inadumisha picha ya taa inayong’aa juu ya Ayubu.
- source_word: לְאוֹרוֹ
  choice: kwa nuru yake
  rationale: ל hapa inaonyesha njia au msaada ambao kwao Ayubu alitembea. Kiambishi cha nafsi ya kiume kinaweza kuelekezwa kwa Mungu katika muktadha, ingawa pia kinaweza kuhusishwa moja kwa moja na taa.
- source_word: אֵלֶךְ
  choice: nilitembea
  rationale: Ingawa umbo la Kiebrania ni imperfect, katika kumbukumbu hii linaeleza tendo la wakati uliopita. 'Nilitembea' ni la kawaida na la moja kwa moja.
- source_word: חֹשֶׁךְ
  choice: gizani
  rationale: Kiebrania hakina kihusishi kinachosema wazi 'kupitia.' 'Gizani' hudumisha ufupi na uwezekano wa maana ya kutembea ndani ya hali ya giza bila kuongeza mwelekeo usiotajwa wazi.
theological_decisions:
- issue: Kinachorejelewa na viambishi vya nafsi ya kiume katika 'taa yake' na 'nuru yake'
  choice: Katika matini kuu, 'yake' inarejelea Mungu kwa kuzingatia muktadha wa Ayubu kukumbuka ulinzi na kibali cha Mungu.
  alternative: Katika 'kwa nuru yake,' kiambishi kinaweza kuelekezwa kwa taa iliyotajwa mara moja kabla, yaani 'kwa nuru ya taa hiyo.'
  rationale: Muktadha mpana unamfanya Mungu kuwa mwenye taa na chanzo cha mwongozo, lakini ukaribu wa neno 'taa' unaruhusu uhusiano wa kisarufi na taa. Tanbihi inadumisha utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari unadumisha picha halisi ya taa na nuru, huku 'gizani' ikifuata kwa karibu ufupi wa Kiebrania na kuepuka kufafanua kupita kiasi.
