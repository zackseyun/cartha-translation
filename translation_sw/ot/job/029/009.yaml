lexical_decisions:
- source_word: שָׂרִים
  choice: Wakuu
  rationale: Neno hili humaanisha watu wenye cheo au mamlaka ya juu. “Wakuu” ni la kawaida na lenye hadhi katika Kiswahili, bila kulazimisha maana finyu ya wana wa kifalme.
- source_word: עָצְרוּ בְמִלִּים
  choice: walijizuia kusema
  rationale: Muundo huu unaonyesha kuzuia au kusitisha usemi. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi tendo la kujinyamazisha.
- source_word: וְכַף
  choice: mikono yao
  rationale: כַּף inaweza kumaanisha kiganja au mkono. Katika ishara hii ya kunyamaza, Kiswahili cha kawaida hutumia “mkono”; wingi unalingana kwa kawaida na kundi la watu.
- source_word: יָשִׂימוּ לְפִיהֶם
  choice: wakaweka mikono yao juu ya vinywa vyao
  rationale: Kihalisi ni kuweka mkono kwenye/juu ya kinywa. Usemi huu unaeleza wazi ishara ya kufunika kinywa na kunyamaza.
