translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Wakuu” huepuka maana finyu ya “wana wa mfalme,” huku tanbihi ikihifadhi uwezekano wa “waheshimiwa.”
