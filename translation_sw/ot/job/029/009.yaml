  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: sw
  text: Wakuu walijizuia kusema[a], wakaweka kiganja chao kinywani mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waheshimiwa walijizuia kusema.”
