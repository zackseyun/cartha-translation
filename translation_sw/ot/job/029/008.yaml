  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: sw
  text: Vijana waliniona, wakajificha; nao wazee waliinuka wakasimama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאוּנִי
  choice: waliponiona
  rationale: Kitenzi ראה kina maana ya kawaida ya kuona. Muundo wa Kiswahili wa wakati, “waliponiona,” unaonyesha kwa kawaida kuwa kitendo kilichofuata kilitokea baada ya wao kumwona Ayubu.
- source_word: נְעָרִים
  choice: Vijana
  rationale: Nomino hii ya wingi wa kiume inarejelea vijana wa kiume; katika muktadha huu “vijana” ni ya kawaida na inaeleweka bila kuongeza neno lisilohitajika.
- source_word: וְנֶחְבָּאוּ
  choice: walijificha
  rationale: Nifali ya חבא kimsingi humaanisha kujificha. Tafsiri ya moja kwa moja inalinda taswira ya Kiebrania na kutohitimisha kimya kimya kwamba waliondoka tu kwa heshima.
- source_word: וִישִׁישִׁים
  choice: wazee
  rationale: יְשִׁישִׁים humaanisha watu wenye umri mkubwa, hasa wanaume wazee. “Wazee” ni neno la heshima na la kawaida; hapa muktadha unaonyesha umri, si lazima cheo rasmi.
- source_word: קָמוּ
  choice: waliinuka
  rationale: קום inaonyesha hatua ya kwanza ya kuinuka kwa heshima.
- source_word: עָמָדוּ
  choice: wakasimama
  rationale: 'עמד baada ya קום hukamilisha taswira: waliinuka kisha wakasimama. Kutafsiri vitenzi vyote viwili kunahifadhi msisitizo wa Kiebrania.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi ulio wazi na wa heshima. Kiunganishi “nao” na mfuatano “waliinuka wakasimama” vinahifadhi ulinganifu wa mistari ya Kiebrania.
