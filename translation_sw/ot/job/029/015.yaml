translation:
  language: sw
  text: Mimi nilikuwa macho kwa kipofu,[a] na miguu kwa kiwete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye kufafanua zaidi, “Mimi nilikuwa kama macho kwa kipofu na kama miguu kwa kiwete.”
