lexical_decisions:
- source_word: עֵינַיִם
  choice: macho
  rationale: Neno la wingi limetumiwa kiarifu katika sitiari ya kumpa mtu mwongozo au msaada wa kuona; taswira halisi ya 'macho' imehifadhiwa.
- source_word: הָיִיתִי
  choice: Nilikuwa
  rationale: Qal timilifu nafsi ya kwanza umoja inaeleza hali au jukumu la Ayubu wakati uliopita.
- source_word: לַעִוֵּר
  choice: kwa kipofu
  rationale: Kihusishi ל kinaonyesha uhusiano au manufaa. Umoja wa Kiebrania umehifadhiwa kwa 'kipofu,' huku 'kwa' ikionyesha kwamba Ayubu alimhudumia.
- source_word: וְרַגְלַיִם
  choice: na miguu
  rationale: Taswira sambamba na 'macho' imehifadhiwa, ikidokeza msaada wa kutembea au kwenda mahali.
- source_word: לַפִּסֵּחַ
  choice: kwa kiwete
  rationale: Kivumishi cha Kiebrania kinamtaja mtu mwenye ulemavu wa kutembea; 'kiwete' ni neno fupi na linaloeleweka katika Kiswahili sanifu.
- source_word: אָֽנִי
  choice: imewakilishwa kwa mkazo wa mpangilio wa sentensi, bila neno la ziada
  rationale: Kiwakilishi huru kinasisitiza mhusika, lakini kuongeza 'mimi mwenyewe' mwishoni kungekuwa kizito na kisicho cha kawaida katika Kiswahili. Nafsi ya kwanza katika 'Nilikuwa' pamoja na muundo wa kishairi hubeba mkazo huo kwa kiasi kinachofaa.
