base_translation:
  language: en
  yaml_path: translation/ot/job/029/020.yaml
  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: sw
  text: 'Utukufu wangu uliendelea kuwa mpya pamoja nami,[a]

    na upinde wangu ulifanywa upya mkononi mwangu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utukufu wangu ulikuwa mpya pamoja nami.” Neno la Kiebrania linaweza kutafsiriwa “mpya”; katika muktadha linaweza kumaanisha utukufu uliodumu ukiwa mpya, wenye nguvu, au usiofifia.
    reason: lexical_alternative
  - marker: b
    text: Huenda “upinde” hapa ni taswira ya nguvu au uhodari, lakini Kiebrania huhifadhi taswira halisi.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: utukufu wangu
  rationale: Neno כָּבוֹד linaweza kumaanisha utukufu, heshima, au hadhi. “Utukufu wangu” huhifadhi upana na taswira ya Kiebrania bila kuifupisha iwe sifa ya kijamii tu.
- source_word: חָדָשׁ
  choice: mpya daima
  rationale: Maana ya msingi ni “mpya.” Katika muktadha wa ushairi sambamba na kufanywa upya kwa upinde, “mpya daima” huonyesha hali ya kuendelea bila kuondoa maana ya msingi au kuamua kimyakimya kuwa ni “fresh” pekee.
- source_word: עִמָּדִי
  choice: pamoja nami
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya kirai hicho na inaonyesha kwamba utukufu wa Ayubu uliendelea kukaa naye.
- source_word: קַשְׁתִּי
  choice: upinde wangu
  rationale: Neno hili linamaanisha upinde kihalisi. Taswira halisi imehifadhiwa ingawa huenda hapa ikawakilisha nguvu au uwezo.
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Huhifadhi mahali na taswira ya Kiebrania ya upinde ulio tayari kutumiwa mkononi.
- source_word: תַחֲלִיף
  choice: ulifanywa mpya
  rationale: Kitenzi cha Hiphil cha חלף kinaweza kueleza kubadilishwa au kufanywa upya. “Ulifanywa mpya” hulingana na kiima cha Kiswahili “upinde” na kudumisha uhusiano wa kishairi na “mpya” katika mstari wa kwanza.
theological_decisions:
- issue: Maana ya mfano wa upinde
  choice: Taswira halisi ya “upinde” imehifadhiwa katika matini.
  alternative: Kutafsiri moja kwa moja kuwa “nguvu zangu” au “uwezo wangu.”
  rationale: Kiebrania hakifafanui wazi kwamba upinde ni mfano, ingawa muktadha unaweza kuashiria nguvu au uhodari. Kutunza taswira huepuka kufunga maana kwa ufafanuzi mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari miwili huhifadhi usambamba wa Kiebrania. “Mpya daima” ni ya asili kuliko “safi daima” kwa utukufu na bado huhifadhi kiini cha חָדָשׁ.
