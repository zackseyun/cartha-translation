  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: sw
  text: Nilizivunja taya za dhalimu, nikayang'oa mawindo kutoka katika meno yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַלְּעוֹת
  choice: meno
  rationale: Neno hili linamaanisha taya au meno ya kutafunia; katika muktadha wa taswira ya mnyama anayeshikilia mawindo, “meno” ni ya kawaida na yanaeleweka vizuri kwa Kiswahili.
- source_word: עַוָּל
  choice: yule dhalimu
  rationale: Nomino hii humaanisha mtu asiye haki au dhalimu. Umoja wa Kiebrania umehifadhiwa, na “dhalimu” huonyesha tabia ya kukandamiza katika muktadha wa kuwaokoa waathiriwa.
- source_word: אַשְׁלִיךְ
  choice: nikakitoa
  rationale: Kitenzi kwa msingi wake ni “kutupa/kuondoa.” Hapa kitu kinatolewa kutoka katika meno; tafsiri hii huhifadhi tendo la kuondoa bila kutoa picha isiyo ya kawaida kwamba mawindo yalitupwa.
- source_word: טָרֶף
  choice: kile alichokamata
  rationale: Neno humaanisha mawindo au kitu kilichonyakuliwa. Kirai hiki kinaifanya taswira ieleweke kwa msomaji wa kawaida huku kikihifadhi maana ya kitu kilichotekwa na dhalimu.
theological_decisions:
- issue: Taswira ya kumwokoa aliyeonewa kutoka kwa dhalimu
  choice: Taswira ya mnyama na mawindo imehifadhiwa kwa kutaja meno na kile kilichokamatwa.
  alternative: Kutafsiri moja kwa moja kama “nilimwokoa mwathiriwa kutoka kwa dhalimu.”
  rationale: Maandishi ya Kiebrania yanatumia sitiari yenye nguvu; haifai kuibadili kuwa maelezo ya moja kwa moja na hivyo kupoteza taswira yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa nafsi ya kwanza na wakati uliopita umehifadhiwa.
