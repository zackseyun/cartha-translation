lexical_decisions:
- source_word: וַיֹּסֶף
  choice: akaendelea
  rationale: Kitenzi יסף kina maana ya kuongeza au kuendelea. Hapa, pamoja na kitenzi-jina kinachofuata, kinaonyesha kwamba Ayubu aliendelea kusema.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: שְׂאֵת
  choice: akianza tena
  rationale: Neno hili linatokana na נשׂא, ‘kuinua/kuchukua.’ Katika nahau נשׂא משל humaanisha kuanza au kutoa hotuba; ‘akianza tena’ ni ya asili kwa Kiswahili huku ikihifadhi wazo la kuichukua tena hotuba.
- source_word: מְשָׁלוֹ
  choice: hotuba yake
  rationale: מָשָׁל lina maana pana, ikiwemo methali, mfano, usemi na hotuba ya kishairi. Katika muktadha huu linaanzisha hotuba ndefu ya kishairi ya Ayubu, hivyo ‘hotuba’ linafaa zaidi kuliko ‘methali’ au ‘mfano.’
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Ni namna ya kawaida ya simulizi ya kuanzisha maneno yanayofuata moja kwa moja.
