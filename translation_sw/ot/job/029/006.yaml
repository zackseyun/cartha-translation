lexical_decisions:
- source_word: בִּרְחֹץ
  choice: wakati ... zilipooshwa
  rationale: Muundo wa kitenzi-jina wenye בִּ unaweza kueleza wakati; tafsiri hii inadumisha picha halisi ya kuoshwa.
- source_word: הֲלִיכַי
  choice: hatua zangu
  rationale: Neno linaweza kumaanisha kutembea au mwenendo; “hatua zangu” ni la kawaida na linahifadhi taswira halisi ya kishairi.
- source_word: בְּחֵמָה
  choice: kwa maziwa yaliyoganda
  rationale: חֵמָה hurejelea bidhaa nzito ya maziwa, kama maziwa yaliyoganda, krimu, au siagi. “Maziwa yaliyoganda” linaeleweka vizuri na halileti picha ya siagi ya kisasa bila lazima.
- source_word: וְצוּר
  choice: na mwamba
  rationale: צוּר ni mwamba au jabali; umoja wenye maana ya kijumla unafaa katika taswira hii ya wingi usiotarajiwa.
- source_word: יָצוּק
  choice: ukamimina
  rationale: יצק humaanisha kumimina; “ukamimina” linahifadhi uhai wa picha ya utoaji mwingi.
- source_word: עִמָּדִי
  choice: kando yangu
  rationale: Maana yake ya msingi ni “pamoja nami” au “kando yangu.” Tafsiri ya mahali inadumisha utata wa Kiebrania badala ya kuibadili moja kwa moja kuwa “kwa ajili yangu.”
- source_word: פַּלְגֵי
  choice: vijito vya
  rationale: פַּלְגֵי hueleza mikondo au vijito vya kitu kinachotiririka; “vijito” ni ya asili katika ushairi wa Kiswahili.
- source_word: שָׁמֶן
  choice: mafuta
  rationale: שָׁמֶן ni mafuta, mara nyingi mafuta ya zeituni katika muktadha huu; “mafuta” huhifadhi ufupi wa kishairi bila kuongeza maelezo yasiyotajwa wazi.
