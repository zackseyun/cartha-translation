  text: וְ/ה֤וּא יַשְׁקִ֨ט וּ/מִ֥י יַרְשִׁ֗עַ וְ/יַסְתֵּ֣ר פָּ֭נִים וּ/מִ֣י יְשׁוּרֶ֑/נּוּ וְ/עַל גּ֖וֹי וְ/עַל אָדָ֣ם יָֽחַד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: sw
  text: Yeye akileta utulivu, ni nani anayeweza kumtia hatiani?[a] Akificha uso wake,[b] ni nani anayeweza kumwona?[c] Hivyo ndivyo ilivyo kwa taifa na kwa mtu binafsi vilevile.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtangaza kuwa mwovu.” Kitenzi cha Kiebrania kinaweza kumaanisha kutamka kisheria kwamba mtu ni mwovu au ana hatia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “akificha uso wake.” Nahau hii inaweza kuonyesha Mungu kujisitiri au kujiondoa, lakini haielezi athari hiyo kwa namna moja tu.
    reason: theological_ambiguity
  - marker: c
    text: Au, “ni nani anayeweza kumtazama?” Kitenzi cha Kiebrania humaanisha kutazama au kuona.
    reason: lexical_alternative
  - marker: d
    text: Kiebrania kwa karibu zaidi, “na juu ya taifa na juu ya mtu pamoja.” Maana ni kwamba kauli hii inatumika kwa taifa na kwa mtu binafsi sawasawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: akileta utulivu
  rationale: Hifili ya שׁקט ina maana ya kusababisha hali ya utulivu. “Kuleta utulivu” huhifadhi maana hiyo ya kisababishi bila kuibana iwe amani ya kisiasa au pumziko pekee.
- source_word: יַרְשִׁיעַ
  choice: kumtia hatiani
  rationale: Hifili ya רשׁע mara nyingi ni tamko la kimahakama la kwamba mtu ni mwovu au ana hatia. “Kumtia hatiani” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisheria.
- source_word: יַסְתֵּר פָּנִים
  choice: akificha uso wake
  rationale: Tafsiri ya karibu ya nahau hii huhifadhi taswira muhimu ya Mungu kujisitiri au kujiondoa bila kuifasiri kwa lazima kuwa kuondoa kibali chake tu.
- source_word: יְשׁוּרֶנּוּ
  choice: kumwona
  rationale: Kitenzi שׁור humaanisha kutazama au kuona; kiambishi cha umoja wa kiume kinamrejelea Mungu. “Kumwona” ni cha asili na wazi katika Kiswahili cha sasa.
- source_word: גּוֹי
  choice: taifa
  rationale: Neno hili hapa linataja jumuiya ya kijamii au kisiasa, si lazima watu wa mataifa mengine kwa maana ya kidini.
- source_word: אָדָם
  choice: mtu mmoja
  rationale: Katika kulinganisha na taifa, אָדָם humaanisha mwanadamu binafsi. “Mtu mmoja” huweka wazi utofauti kati ya jumuiya na mtu binafsi.
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: kwa taifa na kwa mtu mmoja
  rationale: על hapa inaonyesha eneo la matumizi ya kauli iliyotangulia, na יחד huonyesha kuwa inawahusu wote sawasawa. Sentensi ya Kiswahili “Hali hii ni vivyo hivyo…” huwasilisha kazi hiyo kwa kawaida.
theological_decisions:
- issue: Nahau ya Mungu kuficha uso wake
  choice: Kuhifadhi usemi “akificha uso wake.”
  alternative: “Akijiondoa” au “akiondoa kibali chake.”
  rationale: Usemi wa Kiebrania una upana wa kitheolojia kuhusu kujisitiri kwa Mungu. Kuutafsiri kuwa kuondoa kibali pekee kungepunguza maana inayowezekana.
- issue: Anayelengwa na “kumtia hatiani”
  choice: Kuelewa kiwakilishi kisichotajwa wazi kuwa kinamrejelea Mungu.
  alternative: 'Kuacha kitenzi bila yambwa: “ni nani anayeweza kutia hatiani?”'
  rationale: Mfululizo wa maswali unahusu matendo ya Mungu yasiyoweza kupingwa; Kiswahili huhitaji yambwa iliyo wazi zaidi, na “kumtia” huendeleza rejeo hilo bila kuongeza mhusika mwingine.
- issue: Upeo wa kishazi cha mwisho
  choice: Kauli inatumika sawasawa kwa taifa na kwa mtu binafsi.
  alternative: 'Kutafsiri על kwa maana ya upinzani: “dhidi ya taifa na dhidi ya mtu.”'
  rationale: Kihusishi על kinaweza kuwa na maana kadhaa. Muktadha hapa unapanua upeo wa kanuni iliyotangulia, bila kulazimisha maana ya adhabu au upinzani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kuleta utulivu” ni cha kawaida na huhifadhi kisababishi cha Kiebrania; “mtu mmoja” huonyesha wazi tofauti kati ya taifa zima na mtu binafsi. Taswira ya “kuficha uso” imehifadhiwa makusudi.
