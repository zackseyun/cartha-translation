  text: יָרֹ֣עַ כַּבִּירִ֣ים לֹא חֵ֑קֶר וַ/יַּעֲמֵ֖ד אֲחֵרִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: sw
  text: 'Huwavunja wenye nguvu bila uchunguzi[a],

    na huweka wengine mahali pao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila kuchunguza” au “pasipo kutafuta.” Kihalisi, “bila uchunguzi.” Katika muktadha, kauli hii huonyesha kwamba hahitaji uchunguzi wa muda mrefu kabla ya kuwaangusha wenye nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: Huwavunja
  rationale: Kitenzi hiki katika kausativi kinaonyesha kuvunja au kuangusha kwa nguvu. “Huwavunja” kinadumisha ukali wa hukumu bila kuongeza wazo la kuwaua ambalo halijasemwa wazi.
- source_word: כַּבִּירִים
  choice: wenye nguvu
  rationale: Hurejelea watu wenye nguvu au mamlaka, huenda watawala au watu mashuhuri. “Wenye nguvu” ni wazi na hakifungii maana katika cheo maalumu.
- source_word: לֹא חֵקֶר
  choice: bila uchunguzi
  rationale: Kiebrania kinasema kwa ufupi “si uchunguzi/utafutaji.” Tafsiri hii inadumisha muundo na mvutano wa kauli hiyo badala ya kuamua kimya-kimya ikiwa inamaanisha kutohitaji uchunguzi au kutowezekana kuchunguza.
- source_word: וַיַּעֲמֵד
  choice: na kuwaweka
  rationale: Kitenzi cha kausativi humaanisha kusimamisha, kuweka, au kuteua. Pamoja na “mahali pao,” “kuwaweka” ni Kiswahili cha kawaida na huonyesha kuwafanya wachukue nafasi hiyo.
- source_word: אֲחֵרִים
  choice: wengine
  rationale: Ni wingi usioainishwa wa watu wanaochukua nafasi ya waliotangulia; “wengine” hudumisha kutotajwa kwa utambulisho wao.
- source_word: תַּחְתָּם
  choice: mahali pao
  rationale: Ingawa kihalisi inaweza kuwa “chini yao,” katika muktadha wa kubadilishana watu humaanisha kuchukua nafasi yao.
theological_decisions:
- issue: Mtendaji anayeeleweka katika vitenzi
  choice: Mungu anaeleweka kuwa mtendaji; umbo “hu-” katika “Huwavunja” na “kuwaweka” linaendeleza rejeo hilo la muktadha.
  alternative: Kauli inaweza kusomwa bila kumtaja mtendaji wazi katika mstari wenyewe.
  rationale: Muktadha wa hotuba ya Elihu unamhusu Mungu anayewahukumu watawala. Kiswahili kinaweza kudumisha kiwakilishi cha nafsi ndani ya kitenzi bila kuongeza jina “Mungu” lisilopo katika mstari huu.
- issue: Maana ya לֹא חֵקֶר
  choice: “bila uchunguzi” imeachwa katika matini, huku ufafanuzi wa uwezekano wa maana ukiwekwa katika tanbihi.
  alternative: “bila kuhitaji uchunguzi” au “pasipo kuchunguzika.”
  rationale: Kauli ya Kiebrania ni fupi na inaweza kueleweka kwa namna zaidi ya moja. Kuongeza “kuhitaji” katika matini kungeamua tafsiri ya kiteolojia na kimuktadha ambayo haijawekwa wazi kisarufi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Mpangilio wa mistari unadumisha usambamba wa vitendo viwili: kuwaangusha wenye nguvu na kuwaweka wengine badala yao.'
