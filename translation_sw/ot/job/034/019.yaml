  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: sw
  text: 'asiyewapendelea wakuu,

    wala hamhesabu tajiri kuwa bora kuliko maskini,

    kwa maana wote ni kazi ya mikono yake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא פְנֵי שָׂרִים
  choice: hawapendelei wakuu
  rationale: Nahau ya Kiebrania ‘kuinua/kukubali uso’ humaanisha kuonyesha upendeleo; ‘wakuu’ linaakisi שָׂרִים kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וְלֹא נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: wala hamhesabu tajiri kuwa bora kuliko maskini
  rationale: נכר katika muktadha huu ni kumtambua au kumstahi mtu kwa namna ya upendeleo; לִפְנֵי inaonyesha kumweka tajiri mbele/juu ya maskini. Tafsiri hii huhifadhi ulinganisho bila kuingiza wazo la msaada lisilosemwa.
- source_word: מַעֲשֵׂה יָדָיו כֻּלָּם
  choice: wote ni kazi ya mikono yake
  rationale: Huhifadhi taswira halisi ya Muumba na usawa wa makundi yote mawili mbele zake.
theological_decisions:
- issue: Kutopendelea kwa Mungu kati ya wenye mamlaka au mali na maskini
  choice: 'Kauli imeachwa kuwa ya jumla: hawapendelei wakuu wala hamhesabu tajiri kuwa bora kuliko maskini.'
  alternative: ‘hamkubali tajiri kuliko maskini’ au ‘hampendelei tajiri dhidi ya maskini’
  rationale: Uundaji huu huhifadhi msisitizo wa maandishi kuhusu hukumu isiyo na upendeleo, bila kuigeuza kuwa dai pana la kisiasa au la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa mistari mitatu umehifadhiwa; ‘hamhesabu ... kuwa bora kuliko’ ni wa kawaida na unaeleza kwa uwazi uhusiano wa tajiri na maskini katika Kiebrania.
