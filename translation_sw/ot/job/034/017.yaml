base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: sw
  text: Je, anayechukia haki anaweza kutawala?[a] Na je, utamhukumu kuwa na hatia yule mwenye nguvu aliye mwadilifu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuongoza,” “kudhibiti,” au, kwa tafsiri halisi zaidi, “kufunga.” Kitenzi cha Kiebrania hapa huenda kina maana ya kutawala au kudhibiti katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au “mwenye haki aliye mwenye nguvu” au “mwenye haki aliye mkuu.” Katika muktadha huu, kirai hiki kinaelekea kumrejelea Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: Je, ... anaweza
  rationale: Kiulizi hiki kinaanzisha swali la balagha lenye msisitizo. Muundo huu ni wa kawaida katika Kiswahili na hudokeza kuwa jibu linalotarajiwa ni la.
- source_word: שׂוֹנֵא
  choice: anayechukia
  rationale: Kivumishi-tendo hiki cha Kiebrania kinatumika kama nomino kumtaja mtu mwenye sifa ya kuendelea kuchukia.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha wa utawala na maamuzi ya kimaadili, neno hili linamaanisha haki au utaratibu wa haki, si hukumu moja tu.
- source_word: יַחֲבוֹשׁ
  choice: kutawala
  rationale: Maana ya msingi ni ‘kufunga,’ lakini hapa huenda limetumiwa kwa maana ya kudhibiti au kutumia mamlaka; ‘kutawala’ linafaa katika swali kuhusu uwezo wa kuongoza kwa haki.
- source_word: וְאִם
  choice: Je
  rationale: Muundo huu unaendeleza swali la pili la balagha sambamba na la kwanza. Kurudia ‘Je’ ni kwa kawaida na wazi katika Kiswahili.
- source_word: צַדִּיק
  choice: aliye mwadilifu
  rationale: Neno hili linaonyesha unyoofu wa kimaadili na haki. Muundo wa kishazi unaunganisha sifa hiyo kwa kawaida na ‘Yule Mwenye Nguvu.’
- source_word: כַּבִּיר
  choice: Yule Mwenye Nguvu
  rationale: Kivumishi hiki kimetumiwa kama nomino na katika muktadha kinaelekea kumrejelea Mungu. Herufi kubwa zinaashiria rejeo hilo linalowezekana bila kulifanya kuwa wazi kuliko Kiebrania.
- source_word: תַּרְשִׁיעַ
  choice: utamhukumu kuwa na hatia
  rationale: Hifili ya רשע humaanisha kutangaza mtu kuwa na hatia au kumtia hatiani. Tafsiri hii inahifadhi maana yake ya kimahakama kwa uwazi.
theological_decisions:
- issue: Anayerejelewa na צַדִּיק כַּבִּיר
  choice: Yule Mwenye Nguvu aliye mwadilifu, ikiashiria kwamba ni Mungu
  alternative: mtawala mwenye nguvu aliye mwadilifu kwa ujumla
  rationale: Hoja ya Elihu inaelekea kumhusu Mungu kama Mtawala mwenye haki ambaye si sahihi kumhukumu kuwa na hatia. Hata hivyo, kwa kuwa Kiebrania hakitumii jina la Mungu hapa, tanbihi inahifadhi uwezekano wa kisarufi wa maana ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali mafupi ya balagha yamehifadhiwa; istilahi za haki na hukumu ni rahisi kueleweka lakini zina uzito unaofaa.
