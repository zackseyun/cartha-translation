  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: sw
  text: Ayubu anazungumza bila maarifa, na maneno yake hayana ufahamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: bila maarifa
  rationale: Muundo wa ב pamoja na nomino dhahania hapa unaonyesha namna ya kusema; “bila maarifa” ni Kiswahili cha kawaida na huhifadhi maana ya ukosefu wa ujuzi unaodaiwa.
- source_word: יְדַבֵּר
  choice: anazungumza
  rationale: Kauli isiyotimilika hapa inaeleweka kama wakati wa sasa katika tathmini ya Elihu kuhusu maneno ya Ayubu, si hasa wakati ujao.
- source_word: דְבָרָיו
  choice: maneno yake
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya nomino ya wingi, likirejelea yale ambayo Ayubu amesema.
- source_word: בְהַשְׂכֵּיל
  choice: hayana ufahamu
  rationale: Mzizi שכל hubeba wazo la kuelewa au kuwa na utambuzi; usemi huu ni wa asili katika Kiswahili na hudumisha ulinganifu wa kishairi na “bila maarifa.”
- source_word: לֹא
  choice: bila / hayana
  rationale: Ingawa לֹא kimsingi ni “si/hapana,” miundo hasi ya namna imetafsiriwa kwa Kiswahili asilia kuwa “bila” katika mstari wa kwanza na “hayana” katika wa pili.
