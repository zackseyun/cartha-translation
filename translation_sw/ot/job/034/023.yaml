  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: sw
  text: Kwa maana hampangii mtu muda mwingine wa kwenda mbele za Mungu hukumuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana hampangii mtu muda zaidi wa kwenda mbele za Mungu hukumuni.” Kiebrania ni kigumu na kimebanwa; maana yaelekea kuwa kwamba Mungu hahitaji kusikilizwa tena au kuchelewa kabla ya kuhukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu au maelezo ya kauli iliyotangulia na kufaa katika mtiririko wa hoja ya Elihu.
- source_word: עַל אִישׁ
  choice: mtu
  rationale: Katika muundo huu, עַל pamoja na שׂים inaeleza jambo analowekewa mtu. Neno “mtu” ni la kawaida na linaweza kumwakilisha mwanadamu yeyote kama ilivyo katika matumizi ya jumla ya אִישׁ hapa.
- source_word: יָשִׂים
  choice: hamwekei
  rationale: Kitenzi שׂים kina maana pana ya kuweka au kupanga. “Hamwekei” huonyesha kwa kawaida kwa Kiswahili kwamba muda unapangwa kwa ajili ya mtu.
- source_word: עוֹד
  choice: muda mwingine
  rationale: עוֹד humaanisha tena, zaidi, au mwingine. Kwa kuwa sentensi ya Kiebrania imebanwa na kitu cha kitenzi hakikutajwa wazi, “muda” kimejazwa kutokana na muktadha, huku “mwingine” kikihifadhi wazo la nyongeza.
- source_word: לַהֲלֹךְ
  choice: wa kwenda
  rationale: Ni kitenzi-jina cha הלך, kwenda au kutembea; “kwenda” ndilo neno la kawaida na linalofaa hapa.
- source_word: אֶל אֵל
  choice: mbele za Mungu
  rationale: Kihalisi ni “kwa Mungu,” lakini katika muktadha wa mahakama, “mbele za Mungu” huwasilisha wazo la kufika mbele ya hakimu bila kubadili mhusika.
- source_word: בַּמִּשְׁפָּט
  choice: hukumuni
  rationale: מִשְׁפָּט linaweza kumaanisha hukumu, haki, au shauri la kisheria. “Hukumuni” ni kifupi na huhifadhi mazingira ya kimahakama.
theological_decisions:
- issue: Maana ya kishazi kigumu chenye עוֹד na kitu kisichotajwa baada ya יָשִׂים
  choice: Mungu hamwekei mtu muda mwingine wa kufika mbele zake hukumuni.
  alternative: Mungu hamwangalii mtu zaidi kabla ya kumleta hukumuni; au Mungu hapangi wakati maalumu wa mtu kwenda kwake hukumuni.
  rationale: Kiebrania kimebanwa na kinaweza kueleweka kwa njia zaidi ya moja. Katika muktadha wa hoja ya Elihu kuhusu ujuzi kamili wa Mungu, tafsiri iliyochaguliwa inaeleza kwamba Mungu hahitaji muda au usikilizaji mwingine kabla ya kuhukumu, lakini tanbihi inadumisha ugumu na uwezekano wa tafsiri nyingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku “mbele za Mungu” na “hukumuni” vikihifadhi taswira ya kimahakama. Tanbihi inaonyesha wazi kwamba neno “muda” limeeleweka kutokana na kishazi cha Kiebrania kilichofupishwa.
