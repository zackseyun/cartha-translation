base_translation:
  language: en
  yaml_path: translation/ot/job/034/027.yaml
  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: sw
  text: kwa sababu waligeuka wakaacha kumfuata, wala hawakuzingatia njia zake zozote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hawakuelewa njia zake zote.”
    reason: Neno la Kiebrania linaweza kumaanisha kuelewa au kuzingatia; pia “njia zake zote” ndilo umbo la karibu zaidi na maneno ya Kiebrania.
lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: kwa sababu
  rationale: Kirai hiki kinatoa sababu ya hukumu iliyotajwa katika muktadha uliotangulia; “kwa sababu” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi.
- source_word: סָרוּ מֵאַחֲרָיו
  choice: waligeuka wakaacha kumfuata
  rationale: Kitenzi סור kina maana ya kugeuka, kukengeuka, au kuondoka, na מֵאַחֲרָיו ni nahau ya Kiebrania inayomaanisha kuacha kumfuata mtu. Tafsiri hii inahifadhi wazo la kukengeuka kimahusiano na kimaadili bila kutafsiri nahau hiyo neno kwa neno.
- source_word: וְכָל דְּרָכָיו
  choice: wala ... njia zake zozote
  rationale: Ingawa muundo wa Kiebrania unasema kihalisi “na njia zake zote,” ukiwa chini ya ukanushaji maana ya asili katika Kiswahili ni “wala ... njia zake zozote.” “Njia” inaweza kumaanisha mwenendo, matakwa, au namna ya kutenda.
- source_word: לֹא הִשְׂכִּילוּ
  choice: hawakuzingatia
  rationale: Hifili ya שׂכל inaweza kumaanisha kuelewa, kuwa na ufahamu, kutenda kwa hekima, au kuzingatia. Katika muktadha wa “njia zake,” “hawakuzingatia” huonyesha kutotilia maanani, huku maana ya “hawakuelewa” ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Mhusika anayerejelewa na viambishi vya nafsi ya tatu katika “kumfuata” na “njia zake”
  choice: Viambishi vya kawaida vya nafsi ya tatu vimetumiwa bila kumtaja mhusika waziwazi; muktadha unaelekeza kwa Mungu.
  alternative: Mhusika angeweza kueleweka kuwa mtawala au mwamuzi wa kidunia anayetajwa karibu na kifungu hiki.
  rationale: Kiebrania kinatumia viambishi tu. Hotuba pana ya Elihu inahusu Mungu kuona, kuhukumu, na kulipiza matendo ya wanadamu; hata hivyo, kutotaja “Mungu” moja kwa moja kunahifadhi namna ya usemi na mvutano wa rejeleo katika matini.
- issue: Maana ya לֹא הִשְׂכִּילוּ
  choice: hawakuzingatia
  alternative: hawakuelewa; hawakutenda kwa hekima kuhusiana na
  rationale: Chaguo kuu linaonyesha kupuuza njia za Mungu kwa makusudi, lakini tanbihi inahifadhi uwezekano wa maana inayohusu ufahamu. Hivyo tafsiri haifungi neno kwenye maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Waligeuka wakaacha kumfuata” ni usemi wa kawaida unaowasilisha nahau ya Kiebrania kwa uwazi, na “wala” huunganisha ukanushaji kwa mtiririko wa asili.
