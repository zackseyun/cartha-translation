base_translation:
  language: en
  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: sw
  text: 'naye huandamana na watenda maovu[a],

    na hutembea pamoja na wanaume waovu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hujihusisha na watenda maovu.” Kitenzi cha Kiebrania kinaweza kumaanisha kwenda pamoja na wengine au kujiunga nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: naye huandamana
  rationale: Muunganiko huu unaeleza kwenda katika ushirika au kujihusisha na wengine. “Huandamana” ni Kiswahili cha kawaida kinachoweza kubeba wazo la kwenda pamoja na la kuwa katika ushirika, bila kuifanya safari halisi kuwa maana pekee.
- source_word: עִם
  choice: na / pamoja na
  rationale: Kihusishi hiki huonyesha kuwa pamoja au kushirikiana; tofauti ndogo ya mtindo kati ya vifungu viwili hufanya Kiswahili kisomeke kwa kawaida.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watenda uovu
  rationale: “Watenda” huhifadhi maana ya msingi ya פֹּעֲלֵי, yaani wale wanaofanya, na “uovu” huwasilisha nguvu ya kimaadili ya אָוֶן katika muktadha huu.
- source_word: וְ/לָ/לֶכֶת
  choice: na kutembea
  rationale: “Kutembea” huhifadhi taswira ya Kiebrania ya kwenda au kuenenda, ambayo katika fasihi ya hekima inaweza pia kueleza mwenendo na ushirika wa mtu.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: watu waovu
  rationale: “Watu waovu” ni usemi wa kawaida na wenye hadhi katika Kiswahili. Ingawa אַנְשֵׁי ni nomino ya wingi yenye umbo la kiume, Kiswahili hakilazimishi utofautishaji huo wa kijinsia katika nomino “watu”; maana ya kundi la wanadamu waovu imehifadhiwa.
theological_decisions:
- issue: Uhusiano wa kimaadili unaodokezwa na lugha ya kwenda pamoja
  choice: huandamana na ... kutembea pamoja na
  alternative: husafiri pamoja na ... huenda pamoja na
  rationale: Tafsiri inahifadhi uwezekano wa kwenda pamoja, lakini katika usambamba huu inaruhusu pia maana ya ushirika na kujihusisha na waovu bila kuamua kwamba mstari unazungumzia safari halisi tu.
- issue: Jinsia katika אַנְשֵׁי רֶשַׁע
  choice: watu waovu
  alternative: wanaume waovu
  rationale: Katika Kiebrania, umbo la kiume la wingi linaweza kutaja kundi la watu bila kusisitiza jinsia yao. “Wanaume waovu” lingeongeza msisitizo wa jinsia ambao muktadha hauhitaji; “watu waovu” huhifadhi rejeo la kawaida kwa kundi hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa urahisi. Usambamba wa mistari miwili na taswira ya kutembea umehifadhiwa; “naye” linaunganisha kipande hiki na sentensi inayotangulia.
