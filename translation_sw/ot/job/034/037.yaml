  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: sw
  text: Kwa maana anaongeza uasi kwa dhambi yake; miongoni mwetu anapiga makofi[a], naye anazidisha maneno yake dhidi ya Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anagonganisha mikono yake.” Huenda ishara hiyo inaonyesha dharau, ukaidi, au kejeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa Mungu.” Kihusishi cha Kiebrania kinaweza kuonyesha tu mwelekeo, lakini muktadha unaunga mkono maana ya “dhidi ya Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inatoa sababu ya hukumu iliyotangulia; ni kiunganishi cha ufafanuzi kinachoeleweka kwa kawaida katika Kiswahili.
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: anaongeza ... juu ya dhambi yake
  rationale: Inahifadhi picha ya kuweka kosa jingine juu ya dhambi iliyopo, bila kuifanya sentensi kuwa ngumu kueleweka.
- source_word: פֶשַׁע
  choice: uasi
  rationale: Neno hili lina maana ya kosa lenye hali ya kuasi au kukaidi, si kosa la kawaida tu.
- source_word: בֵּינֵינוּ
  choice: katikati yetu
  rationale: Hii ndiyo maana ya kawaida ya usemi wa Kiebrania unaomaanisha kuwa miongoni mwa waliokuwapo.
- source_word: יִסְפּוֹק
  choice: anapiga makofi
  rationale: Inadumisha kitendo halisi cha mikono kinachotajwa na kitenzi, huku tanbihi ikieleza maana yake inayowezekana katika muktadha.
- source_word: וְיֶרֶב אֲמָרָיו
  choice: naye anazidisha maneno yake
  rationale: ‘Anazidisha’ inatoa kwa Kiswahili picha ya kuongeza maneno kwa wingi, na ‘maneno yake’ ni tafsiri ya moja kwa moja isiyoongeza tafsiri ya ziada.
- source_word: לָאֵל
  choice: dhidi ya Mungu
  rationale: Ingawa kihusishi kinaweza kumaanisha mwelekeo wa ‘kwa Mungu,’ mfululizo wa mashtaka katika mstari huu unaunga mkono maana ya upinzani, ‘dhidi ya Mungu.’
theological_decisions:
- issue: Ikiwa maneno ya Ayubu yanaelekezwa tu ‘kwa Mungu’ au yanasemwa ‘dhidi ya Mungu.’
  choice: dhidi ya Mungu
  alternative: kwa Mungu
  rationale: 'Muktadha unaongeza uzito wa shtaka: uasi unaongezwa juu ya dhambi, kuna ishara ya mikono katikati ya waliopo, kisha maneno yanazidishwa katika kumpinga Mungu. Tanbihi inadumisha uwezekano halisi wa kisarufi wa ‘kwa Mungu.’'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku taswira ya kuongeza uasi juu ya dhambi na kitendo halisi cha mikono vikihifadhiwa.
