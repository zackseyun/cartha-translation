  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: sw
  text: Kile nisichokiona[a], unifundishe; ikiwa nimetenda uovu, sitautenda tena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Mbali na kile ninachokiona, unifundishe.” Kiebrania ni cha mkato na kinaweza pia kumaanisha, “Kile nisichokiona, nionyeshe/unifundishe.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “sitaongeza tena,” yaani, “sitaendelea” au “sitarudia kufanya hivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: Kile nisichokiona
  rationale: Kirai cha Kiebrania ni cha mkato na kinaweza kueleweka kuwa jambo ambalo msemaji halioni au halitambui. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha taswira ya kuona.
- source_word: אַתָּה הֹרֵנִי
  choice: unifundishe
  rationale: Kitenzi ירה katika Hifili mara nyingi humaanisha kufundisha au kuelekeza. Hapa ni ombi kwa Mungu amfundishe msemaji kuhusu jambo asilolitambua.
- source_word: אִם
  choice: ikiwa
  rationale: Neno hili linaanzisha sharti bila kulifanya kosa kuwa jambo lililokubaliwa moja kwa moja.
- source_word: עָוֶל
  choice: uovu
  rationale: עָוֶל hurejelea kosa, uovu, au udhalimu. 'Uovu' ni neno pana na la kawaida, lisilobainisha aina ya kosa kupita chanzo.
- source_word: פָּעַלְתִּי
  choice: nimetenda
  rationale: פעל ni kitenzi cha jumla cha kufanya au kutenda; umbo la 'nimetenda' linafaa katika sharti hili.
- source_word: לֹא אֹסִיף
  choice: sitautenda tena
  rationale: Kwa kukanushwa, יסף hutumiwa kiidioma kwa kutorudia au kutoendelea kufanya jambo. Kiwakilishi '-u-' kinarejelea uovu uliotajwa.
theological_decisions:
- issue: Kauli ya unyenyekevu na utayari wa kufundishwa mbele za Mungu
  choice: Kudumisha ombi la kufundishwa na azimio la kutorudia uovu, bila kuongeza istilahi rasmi za toba au kukiri hatia kamili.
  alternative: 'Tafsiri ya karibu zaidi na muundo: ''Mbali na kile ninachokiona, unifundishe; ikiwa nimetenda uovu, sitaongeza tena.'''
  rationale: Kiebrania kinaonyesha utayari wa kusahihishwa na kuacha kosa, lakini hakihalalishi kuongeza madai mapana zaidi ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa Kiebrania ulio wa mkato umewekwa wazi katika maandishi na kubainishwa katika tanbihi bila kuondoa utata wake halisi.
