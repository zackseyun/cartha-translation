  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: sw
  text: Ni nani aliyemweka kuwa msimamizi wa dunia[a], na ni nani aliyeuweka ulimwengu wote mahali pake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani aliyemkabidhi dunia, na ni nani aliyeweka ulimwengu wote juu yake?” Kitenzi cha Kiebrania פקד kinaweza kumaanisha kuteua, kukabidhi, au kumpa mtu wajibu. Katika usomaji huu, “juu yake” katika sehemu ya pili hueleweka kutokana na muundo wa kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד
  choice: aliyemweka juu ya
  rationale: Katika muundo פקד על, kitenzi kinaonyesha kumpa mtu mamlaka au wajibu juu ya kitu. ‘Aliyemweka juu ya’ ni Kiswahili cha kawaida kinachohifadhi swali la balagha kuhusu kama kuna yeyote aliyempa Mungu usimamizi wa dunia.
- source_word: עָלָיו
  choice: juu ya
  rationale: Kiambishi cha nafsi ya kiume umoja kinamrejelea Mungu katika muktadha; muundo huu umejumuishwa katika ‘aliyemweka juu ya dunia’ ili kutoa Kiswahili cha asili.
- source_word: אָרְצָה
  choice: dunia
  rationale: Kwa kuwa neno hili linalingana kishairi na תבל, upeo wake hapa ni wa ulimwengu mzima, si nchi fulani.
- source_word: שָׂם
  choice: aliyeuweka ... mahali pake
  rationale: שׂים humaanisha kuweka au kutia. ‘Kuweka mahali pake’ ni usemi wa asili unaoeleza upangaji bila kuongeza wazo lenye nguvu zaidi la kuumba au kuimarisha.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Neno hili hutaja ulimwengu uliopangwa na kukaliwa; ‘ulimwengu’ ni sawia ya kawaida na yenye heshima katika Kiswahili.
- source_word: כֻּלָּהּ
  choice: wote
  rationale: Neno hili linasisitiza ukamilifu wa תבל; ‘ulimwengu wote’ huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mrejelewa wa kiambishi katika עָלָיו
  choice: 'Kiambishi kinamrejelea Mungu: ‘aliyemweka [Mungu] juu ya dunia.’'
  alternative: Baadhi wanaweza kuelewa muundo huo kama kuweka dunia juu yake au kumkabidhi dunia.
  rationale: Muktadha wa Ayubu 34:10–15 unaunga mkono swali la kama mamlaka yoyote ya juu ilimweka Mungu kuwa msimamizi wa dunia. Hata hivyo, kwa kuwa פקד על inaweza pia kueleza kukabidhi wajibu, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa kishairi wa maswali mawili umehifadhiwa, na tanbihi inaonyesha maana nyingine halisi ya פקד pamoja na uhusiano unaowezekana wa עָלָיו.
