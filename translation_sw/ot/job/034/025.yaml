  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: sw
  text: Kwa hiyo, huyatambua matendo yao; huwapindua usiku[a], nao hupondwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huwapindua wakati wa usiku.” Kiebrania hakitaji wazi mtendwa wa “huwapindua,” lakini muktadha unaelekeza kwa watawala waovu wanaohukumiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Huonyesha matokeo ya kimantiki kutokana na hoja iliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יַכִּיר
  choice: huyatambua
  rationale: Hifili ya נכר hapa ina maana ya kutambua au kufahamu kikamilifu; kiambishi -ya- kinarejelea matendo yao.
- source_word: מַעְבָּדֵיהֶם
  choice: matendo yao
  rationale: Hurejelea mambo wanayofanya; 'matendo' ni neno la asili na lenye uzito wa kimaadili katika muktadha huu.
- source_word: וְהָפַךְ
  choice: huwaangusha
  rationale: הפך inaweza kumaanisha kupindua au kuangusha. Kiwakilishi cha watu kimeongezwa kutokana na muktadha, unaowarejelea watawala waovu wanaohukumiwa.
- source_word: לַיְלָה
  choice: usiku
  rationale: Imetumika kama kielezi cha wakati; 'usiku' huwasilisha kwa ufupi hukumu inayowajia wakati huo.
- source_word: וְיִדַּכָּאוּ
  choice: nao hupondwa
  rationale: Kitenzi דכא kina maana ya kuponda au kuvunja, na umbo hapa lina maana ya kutendwa; 'hupondwa' huhifadhi nguvu ya hukumu.
theological_decisions:
- issue: Mtendaji na mtendwa ambao hawakutajwa wazi katika tukio la hukumu
  choice: Mungu ndiye mtendaji wa vitenzi vyote, na watu waovu wanaozungumziwa ndio watendwa wa 'huwaangusha.'
  alternative: Kuelewa kuwa 'anaupindua usiku,' au kuchukulia vitenzi bila mtendaji maalumu.
  rationale: Muktadha wa Ayubu 34:24–26 unamweleza Mungu akiwajua na kuwahukumu watu wakuu waovu. Kiebrania hakitaji mtendwa wa וְהָפַךְ waziwazi, lakini muktadha unawaonyesha watu hao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na yenye nguvu; imedumisha ukali wa taswira ya hukumu pamoja na kutotajwa wazi kwa mtendwa katika Kiebrania kupitia tanbihi.
