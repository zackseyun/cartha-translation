  yaml_path: translation/ot/job/034/034.yaml
  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: sw
  text: 'Watu wenye ufahamu[a] wataniambia,

    na mtu mwenye hekima anayenisikiliza,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “watu wa moyo,” nahau inayomaanisha watu wenye ufahamu au utambuzi.
