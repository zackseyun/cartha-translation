lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: watu wenye ufahamu
  rationale: Kirai hiki humaanisha kihalisi “watu wa moyo,” lakini katika Kiebrania “moyo” hapa ni kitovu cha fikira na utambuzi. “Watu wenye ufahamu” huwasilisha maana ya nahau hiyo kwa Kiswahili cha kawaida.
- source_word: יֹאמְרוּ לִי
  choice: wataniambia
  rationale: Muundo wa yiqtol unaweza kuwa na maana ya wakati ujao katika muktadha huu; “wataniambia” linaonyesha matarajio ya Elihu kuhusu kauli ya wasikilizaji wenye ufahamu.
- source_word: וְגֶבֶר חָכָם
  choice: na mtu mwenye hekima
  rationale: Ingawa גֶּבֶר kwa kawaida humaanisha mwanamume mzima na wakati mwingine hudokeza nguvu, usambamba hapa unaunga mkono maana ya kawaida “mtu”; חָכָם ni “mwenye hekima.”
- source_word: שֹׁמֵעַ לִי
  choice: anayenisikiliza
  rationale: Kivumishi-tendo cha Kiebrania kinamweleza mtu mwenye hekima kuwa anamsikia Elihu. Katika muktadha wa hotuba, “anayenisikiliza” ni Kiswahili cha asili na huonyesha usikivu unaokusudiwa.
