base_translation:
  language: en
  yaml_path: translation/ot/job/034/002.yaml
  text: Hear my words[a], you wise men, and give ear to me, you who know.
translation:
  language: sw
  text: Sikilizeni maneno yangu, enyi wenye hekima; nanyi wenye maarifa, nitegeeni sikio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nisikilizeni.” Kitenzi cha Kiebrania kinahusiana moja kwa moja na sikio.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Sikilizeni
  rationale: Amri ya wingi ya שׁמע ina maana ya kusikia kwa makini au kusikiliza; “Sikilizeni” ni ya asili katika Kiswahili na inaweka wazi mwito wa kuzingatia maneno yanayofuata.
- source_word: חֲכָמִים
  choice: enyi wenye hekima
  rationale: Kivumishi cha wingi kimetumiwa kama nomino katika mwito. “Enyi wenye hekima” ni lugha ya heshima na ya kawaida, bila kulazimisha jinsia katika Kiswahili ambapo umbo la asili linaweza kujumuisha kundi linaloitwa kwa sifa hiyo.
- source_word: מִלָּי
  choice: maneno yangu
  rationale: Nomino ya wingi yenye kiambishi cha nafsi ya kwanza umoja humaanisha maneno au matamshi yangu; tafsiri hii inadumisha maana halisi na wingi.
- source_word: וְיֹדְעִים
  choice: nanyi wenye maarifa
  rationale: Kitenzi-shirikishi cha wingi kimetumiwa kama nomino ya mwito, yaani watu wanaojua. “Wenye maarifa” ni ya asili na inadumisha ulinganifu na “wenye hekima.”
- source_word: הַאֲזִינוּ
  choice: nitegeeni sikio
  rationale: Amri hii inatokana na mzizi unaohusiana na sikio na humaanisha kusikiliza kwa makini. Nahau “nitegeeni sikio” inahifadhi taswira hiyo na kutofautisha kwa kiasi na שִׁמְעוּ.
- source_word: לִי
  choice: ni- katika “nitegeeni”
  rationale: Kihusishi chenye kiambishi cha nafsi ya kwanza umoja kimewakilishwa kiasili kwa kiambishi cha yambwa “ni-” katika kitenzi cha Kiswahili.
