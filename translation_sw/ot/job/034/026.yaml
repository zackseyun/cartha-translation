  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them as wicked people in full view[a].
translation:
  language: sw
  text: Huwapiga kama watu waovu hadharani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huwapiga kwa sababu ya uovu wao hadharani.” Kishazi cha mwanzo ni kigumu; huenda kinaeleza sababu ya adhabu yao badala ya hali yao wanapopigwa.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: kama
  rationale: Katika kishazi hiki kigumu, kihusishi kinaeleweka vizuri zaidi kuwa kinaonyesha hali au hadhi ambayo wanapigwa; maana ya sababu imehifadhiwa katika tanbihi.
- source_word: רְשָׁעִים
  choice: watu waovu
  rationale: Kivumishi cha wingi kimetumika kama nomino na kinawahusu watu kwa ujumla bila kuweka ukomo wa kijinsia.
- source_word: סְפָקָם
  choice: Huwapiga
  rationale: Kitenzi kina maana ya kupiga; tafsiri haiongezi matokeo kama vile kuangusha au kuwaua, ambayo hayajasemwa wazi katika umbo la Kiebrania.
- source_word: בִּמְקוֹם רֹאִים
  choice: mbele ya wote
  rationale: Muunganiko huu unaonyesha tendo linalofanyika wazi, mahali ambapo watazamaji wanaweza kuliona. Kiswahili hiki cha kawaida kinaeleza hadhara bila kurudia wazo la mahali.
theological_decisions:
- issue: Je, תַּחַת רְשָׁעִים inaonyesha hadhi yao au sababu ya adhabu?
  choice: kama watu waovu
  alternative: kwa sababu ya uovu wao
  rationale: Muundo wa Kiebrania una utata wa kweli. Matini kuu inafuata uelewa wa hadhi yao wanapopigwa, huku tanbihi ikihifadhi uelewa wa kisababishi bila kuamua mvutano huo kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mbele ya wote” limetumiwa kueleza kuonekana hadharani kwa njia ya kawaida; “huwapiga” linaendeleza muktadha wa maelezo ya matendo ya Mungu bila kuongeza matokeo yasiyotajwa.
