  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: sw
  text: 'Kwa maana humlipa mtu kulingana na tendo lake,

    na humfanya apate[a] kulingana na njia yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humletea [matokeo]” au “humkutanisha na [matokeo],” ikionyesha maana ya kisababishi ya kitenzi cha Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu inayounga mkono dai la Elihu katika muktadha; ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: פֹעַל
  choice: tendo
  rationale: Hurejelea jambo analofanya mtu; “tendo” linafaa katika muktadha wa maadili na malipo bila kuongeza maana isiyokuwamo.
- source_word: אָדָם
  choice: mtu
  rationale: Umoja huu unawakilisha binadamu kwa ujumla. Kiswahili “mtu” huhifadhi umoja na maana jumuishi kwa kawaida.
- source_word: יְשַׁלֶּם לוֹ
  choice: humlipa mtu
  rationale: Piel ya שׁלם hapa ina maana ya kulipa au kutoa malipo yanayolingana na mwenendo. “Humlipa” ni ya asili na huhifadhi wazo la malipo.
- source_word: וּכְאֹרַח
  choice: kulingana na njia yake
  rationale: אֹרַח ni njia halisi au, kwa sitiari, mwenendo wa maisha. “Njia” huhifadhi sitiari ya Kiebrania.
- source_word: אִישׁ
  choice: yake
  rationale: Kiwakilishi hiki kinamrejelea “mtu” wa mstari wa kwanza na kuwasilisha umoja wa uwakilishi kwa Kiswahili cha kawaida bila kurudia neno kwa namna nzito.
- source_word: יַמְצִאֶנּוּ
  choice: humfanya apatwe
  rationale: Hiphil ya מצא inaweza kumaanisha kusababisha mtu akute au apatwe na jambo. “Humfanya apatwe” huhifadhi kisababishi na kueleweka kama kupatwa na matokeo yanayoafikiana na njia yake.
theological_decisions:
- issue: Malipo ya Mungu kulingana na mwenendo wa mwanadamu
  choice: Aya inasema kwamba Mungu humlipa mtu kwa kulingana na tendo na njia yake.
  alternative: Kuifanya aya idai kwamba kila tukio la mateso ni adhabu ya moja kwa moja na sawia kwa dhambi binafsi.
  rationale: Maneno ya aya yanatangaza kanuni ya haki ya Mungu, lakini hayapaswi kupanuliwa ili kutatua kimyakimya mvutano mpana wa kitabu cha Ayubu kuhusu mateso.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari miwili inahifadhi usambamba wa Kiebrania. Kitenzi cha umoja bila kiima kilichotajwa wazi kinamrejelea Mungu kutokana na muktadha.
