  naturalness: “Kwa maana humlipa mtu kulingana na tendo lake” ni Kiswahili sanifu na chenye hadhi. “Na humfanya apate kulingana na njia yake” ni ya asili zaidi kuliko “humfanya apatwe,” huku ikidumisha usambamba wa mistari.
