base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: sw
  text: 'Kwa hiyo, enyi watu wenye ufahamu[a], nisikilizeni: Hasha Mungu kutenda uovu[b], wala Mwenyezi kutenda udhalimu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “watu wa moyo,” nahau inayomaanisha watu wenye ufahamu au utambuzi.'
    reason: lexical_alternative
  - marker: b
    text: Au, “Uovu na uwe mbali na Mungu, na udhalimu uwe mbali na Mwenyezi.” Kiebrania kinakataa kwa nguvu kwamba uovu wowote unaweza kuhusishwa na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha hoja kinachoonyesha hitimisho linalotokana na yaliyotangulia; “Kwa hiyo” ni Kiswahili cha kawaida na wazi.
- source_word: אַנֲשֵׁי לֵבָב
  choice: watu wenye ufahamu
  rationale: Kihalisi ni “watu wa moyo,” lakini katika nahau ya Kiebrania moyo hapa ni kitovu cha akili na utambuzi; “watu wenye ufahamu” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: שִׁמְעוּ לִי
  choice: nisikilizeni
  rationale: Amri hii inadai kusikiliza kwa makini maneno ya msemaji; “nisikilizeni” huhifadhi nguvu na mwelekeo wa ombi.
- source_word: חָלִילָה
  choice: Hasha
  rationale: Ni tamko lenye nguvu la kukataa jambo kuwa lisilowazika au lisilokubalika; “Hasha” linafaa kwa mtindo mzito wa kifungu.
- source_word: לָאֵל מֵרֶשַׁע
  choice: Mungu kutenda uovu
  rationale: Muundo unaonyesha kwamba uovu uko mbali kabisa na Mungu. Kitenzi “kutenda” kinaweka wazi wazo la kitendo lililodokezwa bila kuongeza maana mpya.
- source_word: וְשַׁדַּי
  choice: wala Mwenyezi
  rationale: שַׁדַּי ni cheo cha Mungu; “Mwenyezi” hukitafsiri kama cheo na “wala” huendeleza ukanushaji sambamba.
- source_word: מֵעָוֶל
  choice: kutenda udhalimu
  rationale: עָוֶל inaweza kumaanisha kosa, ukosefu wa haki, au udhalimu. “Udhalimu” hapa huonyesha kosa la kimaadili na ukosefu wa haki, sambamba na “uovu.”
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu שַׁדַּי
  choice: Mwenyezi
  alternative: Shadai
  rationale: Neno hili limetumiwa hapa kama cheo cha Mungu, hivyo limetafsiriwa ili maana yake ieleweke badala ya kuandikwa kama jina lisilotafsiriwa.
- issue: Uhusiano wa חָלִילָה na vishazi vinavyofuata
  choice: Hasha Mungu kutenda uovu, wala Mwenyezi kutenda udhalimu
  alternative: Uovu na uwe mbali na Mungu, na udhalimu uwe mbali na Mwenyezi
  rationale: Tafsiri kuu huwasilisha ukataaji mkali kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi kwa karibu zaidi taswira ya Kiebrania ya kutenganisha uovu na Mungu.
- issue: Usemi אַנֲשֵׁי לֵבָב
  choice: watu wenye ufahamu
  alternative: watu wa moyo
  rationale: Ingawa umbo la Kiebrania ni la kiume kisarufi, nahau inalenga sifa ya utambuzi. Kiswahili “watu wenye ufahamu” ni cha asili na hakibadili kundi kuwa lenye maana tofauti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mzito lakini unaoeleweka kwa wasomaji wa kawaida. “Hasha” limechaguliwa kwa ukataaji wa dhati, na ulinganifu wa “kutenda uovu ... kutenda udhalimu” umehifadhiwa.
