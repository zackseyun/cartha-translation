base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: sw
  text: Je, Mungu atalipa kulingana na uamuzi wako kwa sababu umekataa[a]? Kwa maana wewe ndiye unayepaswa kuchagua, si mimi; basi sema unalolijua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mwanzo wa mstari huu ni wa kiidioma na mgumu katika Kiebrania; unaweza pia kutafsiriwa, “Je, atalipa kulingana nawe?” Kitu ambacho Ayubu amekataa hakitajwi wazi; huenda ni hukumu ya Mungu, njia yake ya kutawala, au malipo yanayozungumziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: kulingana na uamuzi wako
  rationale: Kirai hiki cha Kiebrania ni kigumu na cha kiidioma (kihalisi, ‘kutoka pamoja nawe’). Katika muktadha, kinahoji kama malipo ya Mungu yataamuliwa na maoni ya Ayubu.
- source_word: יְשַׁלְמֶנָּה
  choice: atalipa
  rationale: Kitenzi שלם katika Piel humaanisha kulipa au kutoa malipo yanayostahili. Kiswahili ‘atalipa’ ni cha kawaida na kinahifadhi wazo la malipo bila kulazimisha kiwakilishi cha kitu kisicho wazi.
- source_word: כִּי מָאַסְתָּ
  choice: kwa sababu umeukataa
  rationale: מאס humaanisha kukataa, kukataa kabisa, au kudharau. Kiwakilishi ‘-u-’ kinarejelea kwa jumla uamuzi au utaratibu uliotajwa katika muktadha, ingawa rejeo lenyewe haliko wazi kabisa.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: Kwa maana ni wewe unayepaswa kuchagua, si mimi
  rationale: בחר ni ‘chagua.’ Muundo huu unasisitiza tofauti kati ya wajibu wa Ayubu wa kueleza msimamo wake na Elihu kutomchagulia.
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: basi sema unalolijua
  rationale: Amri דַבֵּר inamtaka Ayubu aseme anachojua. ‘Basi’ huonyesha mtiririko wa hoja kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Rejeo la kitu kilichokataliwa katika כִּי מָאַסְתָּ
  choice: umeukataa, huku rejeo likifafanuliwa katika tanbihi kuwa haliko wazi
  alternative: umeikataa hukumu ya Mungu / umekataa njia ya Mungu ya kutawala
  rationale: Kiebrania hakitaji wazi kitu kilichokataliwa. Kutaja moja kwa moja ‘hukumu ya Mungu’ au ‘njia ya Mungu’ kungeondoa utata halisi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Neno ‘Mungu’ limetajwa ili kuweka wazi mhusika wa kitenzi ambacho Kiebrania kinamwacha akieleweka kwa muktadha. Alama ya tanbihi imewekwa baada ya mstari mzima kwa kuwa inaeleza utata wa sehemu mbili za sentensi.
