base_translation:
  language: en
  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: sw
  text: Baba yangu[a], Ayubu ajaribiwe mpaka mwisho[b], kwa sababu ya majibu yake kama yale ya watu waovu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ee baba yangu.” Kiebrania kwa halisi ni “baba yangu,” na huenda ni namna ya kumwita mtu, ingawa wengine hulielewa tofauti.
    reason: lexical_alternative
  - marker: b
    text: Kwa halisi, “mpaka umilele” au “daima”; hapa huenda maana yake ni kujaribiwa kwa ukamilifu au hadi kiwango cha mwisho, badala ya kujaribiwa bila mwisho.
    reason: lexical_alternative
  - marker: c
    text: Au “pamoja na watu waovu” au “miongoni mwa watu waovu.” Kihusishi cha Kiebrania kinaweza kuonyesha ulinganisho au ushirika.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: Baba yangu
  rationale: Neno hili kwa halisi ni “baba yangu” na hapa linaeleweka kwa urahisi zaidi kama namna ya kumwita anayesikiliza, ingawa uchanganuzi mwingine unawezekana.
- source_word: יִבָּחֵן
  choice: na ajaribiwe
  rationale: Niphal ya בחן ina maana ya kujaribiwa au kuchunguzwa. Muundo wa “na ajaribiwe” unaonyesha ombi au matakwa yanayodokezwa katika muktadha.
- source_word: עַד נֶצַח
  choice: kikamilifu
  rationale: Kwa halisi ni “mpaka milele/daima,” lakini katika muktadha wa kumchunguza Ayubu inaelekea kusisitiza jaribio kamili au la kiwango cha mwisho, si muda usio na mwisho.
- source_word: עַל
  choice: kwa sababu ya
  rationale: Hapa עַל inaonyesha msingi au sababu ya ombi hilo.
- source_word: תְּשֻׁבוֹת
  choice: majibu yake
  rationale: Nomino hii humaanisha majibu au majibu ya kurudisha katika mjadala; kiwakilishi cha umilikaji kinafafanua kwa kawaida kwamba ni majibu ya Ayubu.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: kama ya watu waovu
  rationale: Kihusishi בְּ kinaweza kuonyesha ulinganisho au ushirika. Katika sentensi hii, “kama ya watu waovu” ni Kiswahili cha kawaida kinachoonyesha ulinganisho bila kuficha uwezekano mwingine.
theological_decisions:
- issue: Maana ya matakwa ya Elihu kuhusu kujaribiwa kwa Ayubu
  choice: Elihu anatamani Ayubu ajaribiwe kikamilifu kwa sababu majibu yake yanafanana na ya watu waovu.
  alternative: Elihu anataka Ayubu ajaribiwe pamoja na au miongoni mwa watu waovu; au ajaribiwe daima.
  rationale: Kiebrania kina utata wa kisintaksia, hasa katika עַד נֶצַח na בְּאַנְשֵׁי אָוֶן. Tafsiri kuu inatoa maana inayofaa zaidi katika muktadha, huku tanbihi zikihifadhi maana halisi na uwezekano wa ushirika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Na ajaribiwe” ni muundo wa kawaida wa kuonyesha ombi au matakwa; “kikamilifu” huepuka dhana isiyokusudiwa ya mateso ya milele, huku tanbihi ikihifadhi usemi halisi wa Kiebrania.
