lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huleta sababu au maelezo ya himizo lililotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֹזֶן
  choice: sikio
  rationale: Nomino ya umoja imetumiwa kwa maana ya jumla katika kauli ya kimethali.
- source_word: מִלִּין
  choice: maneno
  rationale: Hurejelea maneno yanayosemwa; “maneno” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: תִּבְחָן
  choice: huyapima
  rationale: Kitenzi בחן kina maana ya kujaribu au kuchunguza ili kutathmini; “huyapima” hudumisha wazo la kutathmini na ulinganifu na kuonja.
- source_word: חֵךְ
  choice: kaakaa
  rationale: Hutaja hasa sehemu ya juu ya ndani ya kinywa inayohusishwa na kuonja, si kinywa kwa ujumla.
- source_word: יִטְעַם
  choice: lionjavyo
  rationale: Huhifadhi picha halisi ya kuonja na kuunda ulinganisho wa asili katika Kiswahili.
- source_word: לֶאֱכֹל
  choice: chakula
  rationale: Muundo wa kitenzi-jina wenye ל unaweza kutumiwa kama nomino, yaani kitu cha kuliwa; “chakula” ni wazi na ya kawaida.
