lexical_decisions:
- source_word: אֵין
  choice: Hakuna
  rationale: Hutoa ukanushi wa kuwapo kwa namna ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hili ndilo neno la kawaida kwa giza; hapa linaonyesha mahali panapoweza kudhaniwa kuficha.
- source_word: צַלְמָוֶת
  choice: kivuli kizito
  rationale: Katika ushairi wa hekima neno hili linaweza kumaanisha giza au kivuli kikubwa sana, bila lazima kurejelea kifo. Tafsiri hii pia inadumisha ulinganifu wa kishairi na 'giza'.
- source_word: לְהִסָּתֶר
  choice: wanaweza kujificha
  rationale: Kitenzi-jina chenye ל baada ya majina yaliyokanushwa kinaeleza uwezekano au kusudi la kujificha; muundo wa kitenzi kikamilifu ni wa asili katika Kiswahili.
- source_word: שָׁם
  choice: ambamo
  rationale: Ingawa maana yake ya msingi ni 'huko,' hapa inaunganisha kwa asili mahali palipotajwa na tendo la kujificha.
- source_word: פֹּעֲלֵי אָוֶן
  choice: watenda maovu
  rationale: Huhifadhi wazo la watu wanaotenda uovu huku ikitumia usemi wa kawaida, wenye hadhi, na unaoeleweka katika Kiswahili.
- source_word: אָוֶן
  choice: maovu
  rationale: Katika muktadha huu neno linahusu ubaya wa kimaadili, si taabu kwa ujumla.
theological_decisions:
- issue: Maana ya צַלְמָוֶת katika muktadha wa kishairi
  choice: kivuli kizito
  alternative: kivuli cha mauti; giza nene
  rationale: Mstari unasisitiza kwamba haiwezekani kujificha, wala hauzungumzi moja kwa moja kuhusu kifo. 'Kivuli kizito' hudumisha picha ya kishairi na kutotatua kimabavu upana wa maana; tafsiri ya jadi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kishairi; 'ambamo' hufanya uhusiano wa mahali kuwa wazi bila kuongeza wazo lisilokuwamo katika chanzo.
