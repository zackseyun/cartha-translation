  text: Hakuna giza wala kivuli kizito[a] ambamo watenda maovu wanaweza kujificha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kivuli cha mauti”; neno la Kiebrania linaweza pia kumaanisha giza nene au giza kuu katika ushairi.
