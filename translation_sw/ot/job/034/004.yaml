review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys both cohortative appeals and preserves the ethical sense of מִשְׁפָּט. Its reflexive form in “tujichagulie” adequately expresses לָנוּ (“for ourselves”). However, “sisi kwa sisi” normally means “one another/each to each” and does not naturally express the collective-deliberative sense of בֵינֵינוּ.
  naturalness: “Na tujichagulie yaliyo ya haki” is idiomatic Standard East African Swahili. Replacing “sisi kwa sisi” with “miongoni mwetu” makes the second clause natural and clear. Singular “lililo jema” is a natural Swahili rendering of the Hebrew interrogative expression “what is good.”
  terminology: “Haki” appropriately represents מִשְׁפָּט in this context without prematurely narrowing it to a courtroom judgment. “Tambue” suitably communicates discerning or recognizing what is good. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: “sisi kwa sisi” for בֵינֵינוּ
    rationale: This phrase ordinarily denotes reciprocal action (“one another”), whereas the Hebrew refers to discernment within or among the group. “Miongoni mwetu” better preserves the intended collective setting.
  - severity: low
    issue: Plural “yaliyo mema” for מַה־טּוֹב
    rationale: The plural is understandable, but “lililo jema” more directly and naturally renders the singular, indefinite sense “what is good.”
  revised_text: Na tujichagulie yaliyo ya haki[a]; na tutambue miongoni mwetu lililo jema.
