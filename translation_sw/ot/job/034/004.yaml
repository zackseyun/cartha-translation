  yaml_path: translation/ot/job/034/004.yaml
  text: Let us choose for ourselves what is just[a]; let us know among ourselves what is good.
translation:
  language: sw
  text: Na tujichagulie yaliyo ya haki[a]; na tutambue miongoni mwetu lililo jema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na tujichagulie haki; na tutambue miongoni mwetu lililo jema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: yaliyo ya haki
  rationale: Neno hili linaweza kumaanisha haki, hukumu, au uamuzi wa kisheria. Katika wito huu wa kuchunguza jambo kwa pamoja, “yaliyo ya haki” ni Kiswahili cha kawaida kinachohifadhi maana ya kimaadili na kimahakama.
- source_word: נִבְחֲרָה
  choice: na tujichagulie
  rationale: Ni kitenzi cha nafsi ya kwanza wingi chenye nguvu ya kuhimizana. “Na tujichagulie” huonyesha kuchagua na pia maana ya לָנוּ, yaani kwa ajili yetu wenyewe.
- source_word: לָּנוּ
  choice: -ji- ... -ie (tujichagulie)
  rationale: Muundo huu wa Kiswahili huleta kwa kawaida wazo la “kwa ajili yetu wenyewe” bila kulazimisha kirai kizito.
- source_word: נֵדְעָה
  choice: na tutambue
  rationale: Ingawa ידע kwa msingi ni “kujua,” hapa inahusu kutathmini na kutofautisha lililo jema. “Tutambue” huhifadhi wazo la kufikia ujuzi kwa uchunguzi.
- source_word: בֵינֵינוּ
  choice: sisi kwa sisi
  rationale: Kirai hiki kinaonyesha uchunguzi wa pamoja miongoni mwa wahusika. “Sisi kwa sisi” ni cha asili na hudumisha hali ya kuhimizana.
- source_word: מַה טּוֹב
  choice: yaliyo mema
  rationale: טוֹב lina upana wa maana ya mema, yenye kufaa, au yenye manufaa. “Yaliyo mema” huhifadhi upana huo na ulinganifu wake na “yaliyo ya haki.”
