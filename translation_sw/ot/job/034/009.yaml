  text: כִּֽי אָ֭מַר לֹ֣א יִסְכָּן גָּ֑בֶר בִּ֝/רְצֹת֗/וֹ עִם אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: sw
  text: Kwa maana amesema[a], “Mtu hapati faida yoyote kwa kumfurahia Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu hapati faida Mungu anapopendezwa naye,” au, “Mtu hapati faida kwa kutafuta kibali cha Mungu.” Kifungu cha Kiebrania ni kifupi na kinaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu inayounga mkono shtaka la Elihu katika muktadha uliotangulia na kudumisha mtiririko wa hoja.
- source_word: אָמַר
  choice: amesema
  rationale: Kauli timilifu ya Kiebrania inarejelea jambo lililosemwa awali ambalo bado lina umuhimu katika hoja ya sasa.
- source_word: לֹא יִסְכָּן
  choice: hapati faida yoyote
  rationale: Kitenzi kina maana ya kupata manufaa au faida; usemi huu ni wa kawaida katika Kiswahili na unaonyesha wazi ukanushi.
- source_word: גָּבֶר
  choice: Mtu
  rationale: Nomino ya Kiebrania iko katika umoja wa kiume lakini hapa inawakilisha mwanadamu kwa ujumla; “mtu” ni tafsiri ya asili na jumuishi katika Kiswahili.
- source_word: בִּרְצֹתוֹ
  choice: kwa kumfurahia
  rationale: Muundo huu mfupi unaweza kuonyesha kupendezwa au kufurahia; katika usomaji mkuu, mtu ndiye mhusika anayemfurahia Mungu.
- source_word: עִם אֱלֹהִים
  choice: Mungu
  rationale: Ingawa עִם kwa kawaida ni “pamoja na,” hapa inaonyesha uhusiano unaolengwa na tendo la kufurahia. “Kumfurahia Mungu” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila usemi mgumu.
theological_decisions:
- issue: Maana ya kifungu בִּרְצֹתוֹ עִם אֱלֹהִים
  choice: Mtu hapati faida kwa kumfurahia Mungu.
  alternative: Mtu hapati faida Mungu anapopendezwa naye; au mtu hapati faida kwa kutafuta kibali cha Mungu.
  rationale: Kiambishi cha nafsi katika בִּרְצֹתוֹ kinaweza kueleweka kwa urahisi kuwa kinamtaja mtu kama mhusika, hivyo shtaka ni kwamba kumfurahia Mungu hakuleti faida. Hata hivyo, muundo wa Kiebrania ni mfupi na unaweza kuchanganuliwa kwa njia nyingine; tafsiri hizo zimehifadhiwa katika tanbihi badala ya kuondoa mvutano wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hapati faida yoyote” ni usemi unaoeleweka kwa urahisi, na tanbihi inalinda utata halisi wa Kiebrania.
