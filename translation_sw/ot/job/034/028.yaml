  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: sw
  text: ili kufikisha mbele yake[a] kilio cha maskini[b], naye husikia kilio cha wanaoteseka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu yake” au “dhidi yake”; kihusishi cha Kiebrania hapa kinaweza kueleweka kwa njia zaidi ya moja.
    reason: lexical_alternative
  - marker: b
    text: Au “mnyonge ... wanaoonewa.” Maneno haya mawili ya Kiebrania yana maana zinazokaribiana, lakini hayafanani kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: ili kufikisha
  rationale: Kiambishi לְ pamoja na kitenzi cha Hifili katika hali ya jina-kitenzi kinaonyesha kusudi au matokeo. “Ili kufikisha” ni Kiswahili cha kawaida na kinaendeleza uhusiano wa kishazi hiki na muktadha uliotangulia.
- source_word: עָלָיו
  choice: mbele zake
  rationale: Pamoja na בוא, kirai hiki kinaweza kueleza kilio kinachowasilishwa ili kipate kuzingatiwa. “Mbele zake” kinafaa kwa muktadha wa Mungu kama mwamuzi, huku uwezekano mwingine wa kihusishi ukihifadhiwa katika tanbihi.
- source_word: צַעֲקַת
  choice: kilio cha
  rationale: צְעָקָה ni kilio, hasa kilio cha dhiki au cha kuomba msaada. “Kilio” ni cha moja kwa moja na cha kawaida bila kuongeza ufafanuzi usio katika neno lenyewe.
- source_word: דָּל
  choice: maskini
  rationale: דַּל humaanisha mtu maskini, dhaifu, au asiye na uwezo katika jamii. “Maskini” ni tafsiri ya kawaida katika muktadha huu na bado inadokeza hali ya kutokuwa na nguvu.
- source_word: וְצַעֲקַת
  choice: naye ... kilio cha
  rationale: Nomino “kilio” imerudiwa ili kuhifadhi usambamba wa kishairi wa Kiebrania; kiunganishi kimetolewa kwa “naye” pamoja na kitenzi ili sentensi iwe ya asili katika Kiswahili.
- source_word: עֲנִיִּים
  choice: wanaoteseka
  rationale: עֲנִיִּים inaweza kumaanisha maskini, wenye dhiki, au wanaoonewa. “Wanaoteseka” inatofautisha neno hili na דָּל bila kufuta mwingiliano wa maana zao.
- source_word: יִשְׁמָע
  choice: husikia
  rationale: Hali ya kitenzi cha Kiebrania inaweza kueleza tendo la kawaida katika ushairi wa hekima. “Husikia” huonyesha kwamba Mungu anasikia vilio hivyo kwa kawaida, badala ya kuweka tendo hilo katika wakati ujao tu.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi katika עָלָיו na mtenda wa יִשְׁמָע
  choice: Kilio kinafikishwa mbele za Mungu, naye Mungu anakisikia kilio cha wanaoteseka.
  alternative: Kilio kinaletwa dhidi ya mwovu huku Mungu akisikia; au kilio kinamjia mkandamizaji naye ndiye anayekisikia.
  rationale: Katika muktadha Elihu anaeleza uovu wa wakandamizaji na ufahamu wa Mungu katika hukumu. Mtenda asiye tajwa wa “husikia” anaeleweka kwa kawaida kuwa Mungu; hata hivyo, uwezekano wa kuelewa עָלָיו kwa namna nyingine umeonyeshwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “kilio” yamehifadhiwa kwa sababu ya usambamba wa kishairi. “Mbele zake” ni usemi wa kawaida wa kuwasilisha jambo kwa mwamuzi; “husikia” inaonyesha tendo la kawaida la Mungu.
