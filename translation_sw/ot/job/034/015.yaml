translation:
  language: sw
  text: Wenye mwili wote wangekufa pamoja, na mwanadamu[a] angerudi mavumbini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanadamu wangerudi mavumbini.” Neno la Kiebrania liko katika umoja lakini linaweza kuwakilisha wanadamu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: wangekufa
  rationale: Kitenzi גוע humaanisha kukata roho au kufa. Hapa hali ya masharti inaendelezwa kutoka mstari wa 14, hivyo “wangekufa” ni ya kawaida na sahihi katika Kiswahili.
- source_word: כָּל בָּשָׂר
  choice: wote wenye mwili
  rationale: Huhifadhi nahau ya Kiebrania “mwili wote” bila kutumia Kiswahili kisicho wazi kama “mwili wote,” ambacho kingeweza kueleweka kuwa mwili mzima wa mtu mmoja. Usemi huu unadumisha upeo mpana wa viumbe vyenye uhai wa kufa.
- source_word: יָחַד
  choice: pamoja
  rationale: Neno hili linasisitiza kufa kwa wote kwa wakati mmoja au kwa ujumla mmoja; “pamoja” ni tafsiri fupi na ya kawaida.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Nomino ya Kiebrania iko katika umoja lakini hapa inamtaja mwanadamu kwa maana ya jumla. “Mwanadamu” huhifadhi umoja huo na inaweza kumaanisha jamii yote ya wanadamu.
- source_word: עַל עָפָר
  choice: mavumbini
  rationale: Ingawa עַל kwa kawaida ni “juu ya,” pamoja na kitenzi “kurudi” usemi huu unaonyesha kurudi katika mavumbi. “Mavumbini” ni Kiswahili cha kawaida chenye taswira hiyo ya kibiblia.
- source_word: יָשׁוּב
  choice: angerudi
  rationale: שוב humaanisha “kurudi.” Umbo la masharti “angerudi” linaendeleza sharti kutoka mstari uliotangulia.
theological_decisions:
- issue: Maana ya jumla ya אָדָם
  choice: mwanadamu
  alternative: wanadamu
  rationale: “Mwanadamu” huhifadhi umoja wa neno la Kiebrania na uhusiano wake na lugha ya kuumbwa kutoka mavumbini, huku katika Kiswahili likiweza kuwakilisha wanadamu wote. Tanbihi inataja wazi uwezekano wa maana ya pamoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. “Wote wenye mwili” huepuka utata wa “mwili wote,” na “mavumbini” hudumisha nahau ya kawaida ya kurudi katika mavumbi.
