  text: מִ֭/מְּלֹךְ אָדָ֥ם חָנֵ֗ף מִ/מֹּ֥קְשֵׁי עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/030.yaml
  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: sw
  text: ili mtu asiyemcha Mungu asitawale[a], wala watu wasinaswe kwa mitego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asije akatawala mtu asiyemcha Mungu, wala kusiwe na mitego kwa watu.” Kiebrania cha mstari huu kimebanwa na kinaweza kutafsiriwa kwa njia kadhaa zinazokaribiana, zikitumia mawazo ya “kutawala” na “mtego.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: ili ... asitawale
  rationale: Muundo wa מִן pamoja na kitenzi-jina cha מלך unaeleweka katika muktadha kama kuzuia au kusudi/matokeo. Kiswahili cha kawaida hutumia “ili ... asitawale,” badala ya tafsiri ngumu ya neno kwa neno kama “kutoka kutawala.”
- source_word: אָדָם
  choice: mtu
  rationale: Hapa neno hili linamtaja mtawala mmoja wa kibinadamu, si wanadamu wote kwa ujumla.
- source_word: חָנֵף
  choice: asiyemcha Mungu
  rationale: Katika fasihi ya hekima neno hili humaanisha mtu mwovu mbele za Mungu au asiyemheshimu Mungu, si mnafiki tu. Kauli hii ni ya kawaida na inaonyesha uzito wa kimaadili na kidini.
- source_word: מִמֹּקְשֵׁי
  choice: watu wasinaswe kwa mitego
  rationale: מוֹקֵשׁ ni mtego au tanzi. Kwa kuwa mstari wa Kiebrania umebanwa kisarufi, tafsiri hii inaonyesha maana ya kuwalinda watu wasinaswe, huku tanbihi ikihifadhi uwezekano mwingine wa muundo.
- source_word: עָם
  choice: watu
  rationale: Katika muktadha wa utawala na ukandamizaji, neno hili linamaanisha jamii iliyo chini ya mtawala.
theological_decisions:
- issue: Maana ya muundo wa Kiebrania uliobanwa
  choice: Mungu hutenda ili mtu asiyemcha Mungu asitawale na watu wasinaswe kwa mitego.
  alternative: Asitawale mtu asiyemcha Mungu, wala kusiwe na mitego kwa watu; au Mungu hutenda kwa sababu ya mitego ya watu.
  rationale: Mstari huu ni wa kimkato na unategemea muktadha wa mstari uliotangulia. Tafsiri iliyochaguliwa inaonyesha kusudi au matokeo ya tendo la Mungu bila kuficha kwamba uhusiano sahihi wa kisarufi kati ya “kutawala,” “mitego,” na “watu” unaweza kueleweka kwa njia kadhaa zinazokaribiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi na yenye heshima. “Asiyemcha Mungu” huepuka maana finyu ya “mnafiki,” na “wasinaswe kwa mitego” ni ya kawaida zaidi kuliko muundo mgumu wa nomino huku tanbihi ikihifadhi utata wa asili.
