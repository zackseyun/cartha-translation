  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: sw
  text: 'Ni mwanamume gani aliye kama Ayubu,

    anayekunywa dhihaka kama maji?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Ni mwanamume gani
  rationale: Muundo huu unawasilisha swali la balagha lenye mshangao na kutaja wazi mtu wa kiume, kama ilivyo katika Kiebrania.
- source_word: כְּאִיּוֹב
  choice: aliye kama Ayubu
  rationale: Kiambishi כְּ kinaonyesha ulinganisho; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יִשְׁתֶּה
  choice: anayekunywa
  rationale: Kitenzi kisichotimilika hapa kinaeleza tendo linalomtambulisha mhusika; wakati wa sasa wa mazoea unafaa katika Kiswahili.
- source_word: לַּעַג
  choice: dhihaka
  rationale: Neno hili huonyesha kubeza au kejeli; “dhihaka” ni neno la sasa, lenye hadhi, na linalofaa kwa taswira ya kunywa.
- source_word: כַּמָּיִם
  choice: kama maji
  rationale: Huhifadhi moja kwa moja tashbihi hai ya kitu kinachonywewa kwa urahisi au kwa wingi.
