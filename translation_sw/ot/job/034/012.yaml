  text: אַף אָמְנָ֗ם אֵ֥ל לֹֽא יַרְשִׁ֑יעַ וְ֝/שַׁדַּ֗י לֹֽא יְעַוֵּ֥ת מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: sw
  text: Hakika, Mungu hatendi uovu[a], wala Mwenyezi hapotoshi haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu hahukumu isivyo haki” au “Mungu hamtangazi mtu kuwa mwenye hatia.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kimahakama katika baadhi ya miktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: Hakika
  rationale: Muungano huu unasisitiza na kuthibitisha kauli. “Hakika” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa neno hili linamtaja Mungu; “Mungu” ni tafsiri ya kawaida na ya moja kwa moja katika muktadha huu.
- source_word: יַרְשִׁיעַ
  choice: hatendi uovu
  rationale: Hifili ya רשע inaweza kuwa na maana ya kimahakama ya kumtangaza mtu kuwa mwenye hatia, lakini usambamba wake na kutopotosha haki unaunga mkono maana pana ya kutenda uovu. Tanbihi inahifadhi uwezekano wa maana ya kimahakama.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: “Mwenyezi” ni cheo cha Mungu kinachoeleweka kwa urahisi na kuwasilisha maana ya Shaddai katika muktadha huu.
- source_word: יְעַוֵּת
  choice: hapotoshi
  rationale: Kitenzi hiki hueleza kupinda, kugeuza, au kufanya kitu kipotoke; “hapotoshi” huambatana kwa kawaida na “haki” na kudumisha maana ya kimahakama.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha huu neno linahusu hukumu ya haki au haki yenyewe kama kiwango; “haki” ni ya asili na wazi katika Kiswahili.
theological_decisions:
- issue: Maana ya יַרְשִׁיעַ kuhusiana na tabia ya Mungu
  choice: Mungu hatendi uovu
  alternative: Mungu hahukumu isivyo haki; Mungu hamtangazi mtu kuwa mwenye hatia
  rationale: Mstari unathibitisha uadilifu wa Mungu katika tabia na hukumu. Usambamba na “hapotoshi haki” unaunga mkono maana pana ya kutenda uovu, huku tanbihi ikihifadhi maana halisi inayowezekana ya kimahakama bila kuamua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa usambamba wa kishairi umehifadhiwa kwa kutumia “wala”.
