  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uelewa mwingine wa muundo wa Kiebrania: “Je, inafaa kumwambia mfalme, ‘Wewe usiyefaa kitu!’ ...?” Neno lililotafsiriwa “usiyefaa kitu” ni tusi linalomaanisha asiye na thamani au mhuni; hapa si lazima liwe jina maalumu “Beliali.”'
