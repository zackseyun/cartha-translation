lexical_decisions:
- source_word: הַאֲמֹר
  choice: anayemwambia
  rationale: Muundo huu unamtaja yule anayesema maneno hayo na unaendelea kwa kawaida kutoka muktadha wa mstari uliotangulia. Kiswahili cha kishazi tegemezi kinahifadhi uhusiano huo.
- source_word: לְמֶלֶךְ
  choice: mfalme
  rationale: Kiambishi לְ kinaonyesha anayeelekezewa maneno; nomino isiyo na kibainishi imetafsiriwa kwa maana ya jumla, si lazima mfalme fulani.
- source_word: בְּלִיָּעַל
  choice: Wewe usiyefaa kitu!
  rationale: Hapa neno ni tusi linalomaanisha mtu asiye na thamani au asiyefaa, wala si jina maalumu la baadaye ‘Beliali.’ Tamko hili pia linabaki katika umoja kulingana na ‘mfalme.’
- source_word: רָשָׁע
  choice: Ninyi waovu!
  rationale: Ingawa neno la Kiebrania lina umbo la umoja, linaelekezwa kwa wakuu wengi. Wingi wa Kiswahili unaweka wazi walengwa wa tusi huku tanbihi ikihifadhi taarifa ya umbo la chanzo.
- source_word: אֶל
  choice: na
  rationale: Katika mshororo sambamba, אֶל humtambulisha anayeelekezewa usemi. Kiswahili ‘na’ kinaunganisha kwa kawaida sehemu ya pili huku maana ya ‘kuwaambia’ ikieleweka kutoka sehemu ya kwanza.
- source_word: נְדִיבִים
  choice: wakuu
  rationale: Katika muktadha wa kisiasa na kijamii sambamba na mfalme, neno hili linamaanisha watu wenye cheo au hadhi. ‘Wakuu’ ni la kawaida na pana bila kulazimisha cheo maalumu.
theological_decisions:
- issue: Je, הַאֲמֹר ni kishazi kinachomtaja msemaji au swali kuhusu kufaa kusema?
  choice: anayemwambia
  alternative: Je, inafaa kumwambia
  rationale: Katika muktadha, tafsiri ya kishazi cha kumtaja msemaji inaunganika na maelezo ya Mungu katika mistari inayozunguka. Hata hivyo, umbo la Kiebrania linaweza kueleweka kwa njia ya swali, kwa hiyo uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Matamko ya moja kwa moja yamepewa viwakilishi ‘wewe’ na ‘ninyi’ ili tusi lisikike kwa kawaida na tofauti ya umoja na wingi iwe wazi.
