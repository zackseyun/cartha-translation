  text: אִם יָשִׂ֣ים אֵלָ֣י/ו לִבּ֑/וֹ רוּח֥/וֹ וְ֝/נִשְׁמָת֗/וֹ אֵלָ֥י/ו יֶאֱסֹֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: sw
  text: Kama angeuelekeza moyo wake kwake mwenyewe[a], na angezikusanya kwake roho yake na pumzi yake,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama angeuelekeza moyo wake kwenye jambo hili, na angezikusanya kwake roho yake na pumzi yake.” Usemi wa Kiebrania “kuelekeza moyo” unaweza kumaanisha kuelekeza uangalifu au kusudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָשִׂים
  choice: Kama angeuelekeza
  rationale: אִם huanzisha sharti la kudhaniwa, na יָשִׂים ni ‘kuweka/kuelekeza.’ Muundo ‘kama angeuelekeza’ unasikika kwa kawaida katika Kiswahili na kuhifadhi hali ya jambo linalodhaniwa.
- source_word: אֵלָיו לִבּוֹ
  choice: moyo wake kwake mwenyewe
  rationale: Neno ‘moyo’ limehifadhiwa ili kuonyesha lugha ya Kiebrania kuhusu nia, kusudi, au uangalifu wa ndani. ‘Kwake mwenyewe’ huwasilisha maana ya kujirejelea inayowezekana katika אֵלָיו bila kuondoa uwezekano mwingine, ambao umeelezwa katika tanbihi.
- source_word: רוּחוֹ
  choice: roho yake
  rationale: רוּחַ inaweza kumaanisha roho, upepo, au pumzi. Hapa ‘roho’ inaitofautisha na נְשָׁמָה huku ikifaa katika muktadha wa uhai ambao Mungu anaweza kuurudisha kwake.
- source_word: וְנִשְׁמָתוֹ
  choice: na pumzi yake
  rationale: נְשָׁמָה mara nyingi ni pumzi au pumzi ya uhai. ‘Pumzi’ huhifadhi ulinganifu na ‘roho’ bila kuyafanya maneno hayo mawili kuwa sawa kabisa.
- source_word: אֵלָיו יֶאֱסֹף
  choice: kujikusanyia
  rationale: אָסַף ni ‘kukusanya.’ ‘Kujikusanyia’ huhifadhi picha ya kukusanya kwake mwenyewe; wazo la kuiondoa au kuirudisha pumzi ya uhai linafafanuliwa na muktadha.
theological_decisions:
- issue: Marejeo ya viwakilishi vya nafsi ya tatu
  choice: 'Viwakilishi vimeeleweka kumrejelea Mungu, na אֵלָיו ya kwanza imetafsiriwa kwa maana ya kujirejelea: ‘kwake mwenyewe.’'
  alternative: אֵלָיו ya kwanza inaweza kueleweka kuwa ‘kwenye jambo hili’ au kama kuelekeza uangalifu wake kwa mwingine.
  rationale: Hoja ya Elihu katika muktadha inamhusu Mungu kama mwenye uwezo wa kukusanya kwake roho na pumzi. Hata hivyo, kwa kuwa usemi wa Kiebrania una utata wa kweli, tanbihi inahifadhi tafsiri nyingine badala ya kuifuta.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. ‘Kuelekeza moyo’ huhifadhi taswira ya Kiebrania lakini ni wazi zaidi kuliko tafsiri ya neno kwa neno ‘kuweka moyo.’ Koma ya mwisho inaonyesha kwamba sentensi ya sharti inaendelea katika mstari unaofuata.
