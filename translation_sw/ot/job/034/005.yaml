  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: sw
  text: Kwa maana Ayubu amesema, “Mimi nina haki, na Mungu ameninyima haki yangu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “madai yangu halali,” “haki niliyostahili,” au “hukumu yangu.”
