lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha kauli hii na hoja ya Elihu kwa kutoa sababu au ufafanuzi wa anachosema.
- source_word: אָמַר
  choice: amesema
  rationale: Wakati timilifu unaonyesha kauli iliyotolewa awali ambayo bado ni muhimu katika hoja ya sasa.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: צָדַקְתִּי
  choice: Mimi ndiye niliye na haki
  rationale: Usemi huu unaeleza dai la Ayubu kwamba yeye yuko upande wa haki katika shauri hili, bila kuupanua kuwa dai la kutokuwa na dhambi kabisa.
- source_word: וְאֵל
  choice: na Mungu
  rationale: Kiunganishi kimetafsiriwa kwa maana yake ya kawaida ya kujumlisha; hakuna ulazima wa kuongeza wazo la ukinzani kwa kutumia “lakini.”
- source_word: הֵסִיר
  choice: ameninyima
  rationale: Ingawa kitenzi kimsingi humaanisha kuondoa, katika muktadha wa haki inayodaiwa kuwa ya mtu, “ameninyima” ni Kiswahili cha kawaida kinachoeleza kunyimwa kile anachostahili.
- source_word: מִשְׁפָּטִי
  choice: haki yangu
  rationale: Neno hili linaweza kumaanisha haki, madai halali, au hukumu inayomstahili mtu. “Haki yangu” ni ya kawaida na bado huhifadhi maana yake ya kisheria na kimaadili.
theological_decisions:
- issue: Maana ya kiforensiki ya dai la Ayubu
  choice: Mimi ndiye niliye na haki
  alternative: Mimi ni mwenye haki
  rationale: Chaguo hili linaelekeza dai la Ayubu kwenye shauri lake mbele za Mungu, badala ya kulifanya dai pana la ukamilifu wa kimaadili.
- issue: Maana ya מִשְׁפָּטִי
  choice: haki yangu
  alternative: madai yangu halali; haki niliyostahili; shauri langu
  rationale: “Haki yangu” huhifadhi upana wa maana ya neno la Kiebrania bila kulifinyanga kuwa hukumu, shauri, au dai pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Mimi ndiye niliye na haki” ni wa kawaida na unaweka mkazo wa kiforensiki; “ameninyima haki yangu” ni wa asili zaidi kuliko tafsiri sisisi ya ‘ameondoa haki yangu.’
