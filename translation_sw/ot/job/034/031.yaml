  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: sw
  text: Kwa maana, je, kuna yeyote ambaye amemwambia Mungu, “Nimebeba adhabu[a]; sitatenda mabaya” ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Nimebeba; sitatenda mabaya.” Kiebrania hakitaji kilichobebwa; huenda kinachokusudiwa ni adhabu, nidhamu, au hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huhifadhi kazi ya kiunganishi inayoleta sababu au ufafanuzi wa hoja iliyotangulia.
- source_word: אֶל אֵל
  choice: aliyemwambia Mungu
  rationale: אֶל pamoja na אֵל humaanisha kuelekeza usemi kwa Mungu; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הֶאָמַר
  choice: je, kuna yeyote aliyemwambia
  rationale: Ingawa umbo la kitenzi linaweza kuonekana kuwa nafsi ya tatu umoja, muktadha una swali la balagha lenye mhusika asiyeainishwa; 'kuna yeyote' huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: נָשָׂאתִי
  choice: Nimebeba adhabu
  rationale: Maana ya msingi ni 'kubeba,' lakini yambwa halijatajwa. 'Adhabu' huonyesha maana inayowezekana katika muktadha huku tanbihi ikihifadhi ukosefu huo wa ubainifu katika Kiebrania.
- source_word: לֹא אֶחְבֹּל
  choice: sitatenda uovu tena
  rationale: חבל hapa inaeleweka kimaadili kuwa kutenda vibaya au kwa upotovu. 'Sitatenda uovu tena' ni ahadi ya wazi na ya asili ya kuacha matendo mabaya; 'tena' inadokezwa na muktadha wa kutorudia kosa.
theological_decisions:
- issue: Yambwa lisilotajwa la נָשָׂאתִי
  choice: Adhabu imewekwa katika matini kwa uwazi wa maana, huku tanbihi ikionyesha kuwa haipo wazi katika Kiebrania.
  alternative: “Nimebeba” bila kutaja kilichobebwa, au kuelewa kuwa ni maonyo, mateso ya nidhamu, au hatia.
  rationale: Muktadha wa kukiri mbele za Mungu unaunga mkono adhabu, lakini Kiebrania hakifungi tafsiri hiyo; kwa hiyo uwezekano mwingine haupaswi kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limewasilishwa kwa muundo wa kawaida wa “je, kuna yeyote,” na tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
