  yaml_path: translation/ot/job/034/016.yaml
  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: sw
  text: Ikiwa una ufahamu, sikia hili; sikiliza sauti ya maneno yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikiliza maneno yangu.” Kiebrania ni, kwa tafsiri ya moja kwa moja, “sikiliza sauti ya maneno yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ikiwa
  rationale: Kiunganishi pamoja na chembe ya sharti kinaanzisha mwito unaotegemea msikilizaji kuwa na ufahamu. ‘Ikiwa’ ni ya kawaida na wazi katika Kiswahili; kiunganishi cha mwanzo hakihitaji kutafsiriwa kando.
- source_word: בִּינָה
  choice: ufahamu
  rationale: Neno hili humaanisha uwezo wa kuelewa au kupambanua. ‘Ufahamu’ ni neno la kawaida na linafaa kwa mwito wa Elihu kwa msikilizaji aelewe hoja yake.
- source_word: שִׁמְעָה
  choice: sikia
  rationale: Ni amri ya moja kwa moja kutoka katika kitenzi cha kusikia. ‘Sikia’ huhifadhi tofauti na kitenzi kinachofuata, ambacho husisitiza kusikiliza kwa makini.
- source_word: זֹּאת
  choice: hili
  rationale: Kiwakilishi hiki huelekeza kwa jambo ambalo Elihu analisema bila kuongeza nomino ya ufafanuzi isiyokuwapo katika Kiebrania.
- source_word: הַאֲזִינָה
  choice: isikilize
  rationale: Kitenzi hiki kinatoa mwito wa kusikiliza kwa makini. ‘Isikilize’ ni cha asili katika Kiswahili cha sasa na huepuka usemi wa kizamani zaidi wa ‘tega sikio.’
- source_word: לְקוֹל
  choice: sauti ya
  rationale: קוֹל inaweza kumaanisha sauti au sauti ya mtu. Muundo ‘sauti ya maneno yangu’ unahifadhi kwa karibu ujenzi halisi wa Kiebrania badala ya kuurahisisha kuwa ‘maneno yangu’ pekee.
- source_word: מִלָּי
  choice: maneno yangu
  rationale: Nomino hii inarejelea maneno au matamshi yaliyosemwa. ‘Maneno yangu’ ni tafsiri ya moja kwa moja inayohifadhi umbo la wingi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. Kirai ‘sauti ya maneno yangu’ kimehifadhiwa kwa sababu ndicho kinachoonyesha muundo na taswira ya Kiebrania, ingawa ‘sikiliza maneno yangu’ kingekuwa laini zaidi katika Kiswahili.
