  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: sw
  text: Je, niseme uongo kuhusu haki yangu?[a] Jeraha langu haliponi,[b] ingawa sina kosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Licha ya haki yangu, nahesabiwa kuwa mwongo,” ikiwa kifungu cha kwanza kinasomwa kama taarifa badala ya swali la balagha.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “mshale wangu hauponi”; huenda “mshale” ni mfano wa jeraha au mateso yaliyompata.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: kuhusu
  rationale: Pamoja na מִשְׁפָּטִי na אֲכַזֵּב, neno hili linaeleweka kwa kawaida kuwa ‘kuhusu’ au ‘juu ya,’ ingawa maana ya ‘dhidi ya’ bado inawezekana katika usomaji mwingine.
- source_word: מִשְׁפָּטִי
  choice: haki yangu
  rationale: Katika muktadha wa kujitetea kisheria, מִשְׁפָּט inaweza kumaanisha haki ya mtu, hukumu, au shauri lake. ‘Haki yangu’ ni ya kawaida na inadumisha uzito wa kisheria.
- source_word: אֲכַזֵּב
  choice: Je, niseme uongo
  rationale: Pieli ya כזב inaweza kumaanisha kusema uongo au kuonekana kuwa mwongo. Swali la balagha linafaa katika muktadha, lakini usomaji wa taarifa umehifadhiwa katika tanbihi.
- source_word: אָנ֖וּשׁ
  choice: haliponi
  rationale: Kivumishi hiki huonyesha hali isiyotibika au yenye kukata tamaa. ‘Haliponi’ ni Kiswahili cha kawaida kinachowasilisha hali ya kudumu ya jeraha.
- source_word: חִצִּי
  choice: jeraha langu
  rationale: Kihalisi ni ‘mshale wangu,’ lakini hapa mshale unaelekea kuwa taswira ya jeraha au mateso yaliyompata Ayubu. Taswira halisi imehifadhiwa katika tanbihi.
- source_word: בְלִי
  choice: ingawa sina
  rationale: בְּלִי huonyesha kutokuwapo kwa kitu. Katika uhusiano wa vifungu hivi, ‘ingawa sina’ huwasilisha kwa ufasaha nguvu ya kukinzana inayodokezwa na muktadha.
- source_word: פָשַׁע
  choice: kosa
  rationale: פֶּשַׁע hubeba maana ya kosa zito, uasi, au uvunjaji wa maadili. ‘Kosa’ ni la kawaida na linafaa katika dai la kutokuwa na hatia; tanbihi si lazima kuongeza tafsiri ya kimadhehebu.
theological_decisions:
- issue: Jinsi ya kuelewa dai la Ayubu linalonukuliwa na Elihu
  choice: Kifungu cha kwanza kimetafsiriwa kama swali la balagha, kikifuatiwa na malalamiko kwamba mateso yake hayaponi licha ya kutokuwa na kosa.
  alternative: 'Kifungu cha kwanza kinaweza kutafsiriwa kama taarifa: ‘Kinyume cha haki yangu, nahesabiwa kuwa mwongo’; חִצִּי pia inaweza kubaki kihalisi kuwa ‘mshale wangu.’'
  rationale: Kiebrania ni kifupi na kina utata wa kisintaksia. Tafsiri kuu ni ya kawaida katika Kiswahili, huku tanbihi zikihifadhi usomaji wa taarifa na taswira ya mshale bila kutatua kimya kimya mvutano wa kitheolojia kuhusu haki na mateso.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Je’ linaweka wazi swali la balagha; ‘haliponi’ ni la kawaida zaidi kuliko usemi wa kitabibu ‘halitibiki.’ Alama zote za tanbihi zimewekwa katika matini kuu.
