base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: sw
  text: Hufa kwa ghafula; usiku wa manane watu hutikiswa, nao huondoka; mwenye nguvu huondolewa, si kwa mkono.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila mkono wa mwanadamu.” Kiebrania kinasema kihalisi “si kwa mkono,” huenda kikimaanisha kwamba huondolewa bila tendo la mwanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: kwa ghafula
  rationale: Neno hili huonyesha muda mfupi sana; katika muktadha huu, “kwa ghafula” linaeleza kifo kinachotokea mara moja bila kuongeza wazo lisilokuwamo.
- source_word: יָמֻתוּ
  choice: hufa
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kawaida cha kufa, huku wingi wa wahusika ukihifadhiwa katika muundo wa Kiswahili.
- source_word: וַחֲצוֹת לָיְלָה
  choice: usiku wa manane
  rationale: Hii ndiyo nahau ya kawaida ya Kiswahili kwa nusu ya usiku; kiunganishi cha Kiebrania kinaingizwa katika mtiririko wa kishairi kupitia alama ya mkato.
- source_word: יְגֹעֲשׁוּ
  choice: hutikiswa
  rationale: Mzizi געשׁ huweza kumaanisha kutikisika, kufadhaika, au kuwa katika ghasia. “Hutikiswa” huhifadhi taswira pana bila kuamua kama ni mtikisiko halisi au msukosuko.
- source_word: עָם
  choice: watu
  rationale: Nomino hii ni ya umoja wa kijumla ikimaanisha jamii au taifa. “Watu” ni ya asili katika Kiswahili na inaweza kuwakilisha kundi hilo kwa pamoja.
- source_word: וְיַעֲבֹרוּ
  choice: nao hupita
  rationale: Kitenzi עבר kimsingi ni kupita. Kutumia “hupita” huhifadhi sitiari na utata wake katika muktadha wa kifo na kutoweka.
- source_word: וְיָסִירוּ
  choice: huondolewa
  rationale: Ingawa umbo la Kiebrania linaweza kusomeka kwa mtendaji asiyeainishwa, tafsiri ya kutendwa ni ya asili hapa na huhifadhi kutotajwa kwa mtendaji.
- source_word: אַבִּיר
  choice: mwenye nguvu
  rationale: Nomino ya kivumishi humaanisha mtu mwenye nguvu au mamlaka. Umoja “mwenye nguvu” huhifadhi umbo la Kiebrania bila kulazimisha maana ya kijumla.
- source_word: לֹא בְיָד
  choice: si kwa mkono
  rationale: Hii huhifadhi kwa ukaribu nahau ya Kiebrania “si kwa mkono,” bila kutaja moja kwa moja kwamba ni mkono wa mwanadamu.
theological_decisions:
- issue: Mtendaji anayedokezwa na “si kwa mkono”
  choice: Nahau imehifadhiwa kihalisi katika matini kuu, ikiacha wazi kwamba mwenye nguvu huondolewa bila njia ya kawaida ya mkono.
  alternative: bila mkono wa mwanadamu
  rationale: Muktadha unaweza kudokeza tendo la Mungu lisilotegemea nguvu ya mwanadamu, lakini matini haitaji “mwanadamu” wala kumtaja mtendaji moja kwa moja. Kutohitimisha zaidi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Vitenzi vya wakati wa sasa wa kimazoea vinawasilisha kauli ya jumla kuhusu kufa na kuondolewa kwa ghafula. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
