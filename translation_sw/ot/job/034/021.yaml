  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: sw
  text: Kwa maana macho yake huziangalia njia za mwanadamu,[a] naye huziona hatua zake zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia za mtu.” Kiebrania kinasema kihalisi “njia za mwanamume,” kwa kutumia umbo la kiume la umoja kwa maana ya wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutambulisha sababu au maelezo ya kauli iliyotangulia na ni kiunganishi cha kawaida katika Kiswahili sanifu.
- source_word: עֵינָיו עַל
  choice: macho yake huziangalia
  rationale: Kirai hiki kinaonyesha uangalizi endelevu. Kitenzi 'huziangalia' ni cha asili katika Kiswahili na kinadumisha picha ya macho yaliyowekwa juu ya mwenendo wa mtu.
- source_word: דַּרְכֵי אִישׁ
  choice: njia za mwanadamu
  rationale: '''Njia'' huhifadhi picha halisi na maana ya kimfano ya mwenendo. ''Mwanadamu'' huwasilisha matumizi ya jumla ya nomino ya Kiebrania ya kiume bila kuifanya ihusu mwanaume pekee.'
- source_word: וְכָל צְעָדָיו
  choice: naye ... hatua zake zote
  rationale: '''Hatua'' huhifadhi taswira halisi ambayo pia huashiria matendo na mwenendo; ''zote'' huwasilisha ujumla wa כָל.'
- source_word: יִרְאֶה
  choice: huziona
  rationale: Kauli ya mazoea huonyesha ukweli wa kudumu wa kuona kwa Mungu, badala ya wakati ujao wa moja kwa moja.
theological_decisions:
- issue: Matumizi ya jumla ya אִישׁ yenye umbo la kiume
  choice: mwanadamu
  alternative: mwanaume
  rationale: Katika muktadha huu אִישׁ ina nguvu ya uwakilishi kwa wanadamu kwa ujumla. 'Mwanadamu' ni ya kawaida, yenye heshima, na haipunguzi matumizi hayo kuwa wanaume pekee; tanbihi inahifadhi taarifa kwamba Kiebrania kina umbo la kiume la umoja.
- issue: Rejeo la kiwakilishi cha nafsi katika עֵינָיו na יִרְאֶה
  choice: yake ... naye
  alternative: Mungu ... Mungu
  rationale: Muktadha humtambulisha Mungu kuwa rejeo, lakini mstari wenyewe hutumia viwakilishi. Tafsiri inavihifadhi ili kutoingiza jina lisilotajwa wazi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ni mfupi na wazi; taswira za “njia” na “hatua” zimehifadhiwa.
