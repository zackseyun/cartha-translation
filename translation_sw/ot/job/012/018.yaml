  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: sw
  text: 'Hulegeza vifungo vya wafalme,

    na hufunga mkanda kiunoni mwao.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nidhamu ya wafalme.” Neno la Kiebrania linaweza kumaanisha “nidhamu” au “kifungo”; hapa “vifungo” inafaa zaidi kwa ulinganifu wake na “hufunga mkanda.”
    reason: lexical_alternative
  - marker: b
    text: 'Picha hii huenda inaonyesha kufedheheshwa au kutiishwa: Mungu huwaondolea wafalme mamlaka yao na kuwafunga kama watu wa kawaida au mateka.'
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: vifungo
  rationale: Nomino hii inaweza kumaanisha nidhamu au kifungo. Hapa maana halisi ya “vifungo” inafaa kwa kitenzi “hulegeza” na inadumisha ulinganifu na “kuwafunga” katika mstari wa pili.
- source_word: פִּתֵּחַ
  choice: hulegeza
  rationale: Kitenzi hiki kina maana ya kufungua au kulegeza. “Hulegeza” inadumisha picha halisi ya vifungo bila kuifasiri kupita kiasi kuwa kuachilia.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya neno la Kiebrania.
- source_word: וַיֶּאְסֹר
  choice: kuwafunga
  rationale: Kitenzi kina maana ya kufunga au kutia kifungo. “Kuwafunga” kinadumisha utofautishaji wa kimakusudi na “hulegeza.”
- source_word: אֵזוֹר
  choice: mkanda
  rationale: Neno hili humaanisha mkanda unaovaliwa kiunoni. “Mkanda” ni neno la kawaida, la sasa, na lisiloamua ikiwa picha hiyo ni ya utumishi, maandalizi, au fedheha.
- source_word: בְּמָתְנֵיהֶם
  choice: viunoni mwao
  rationale: Kirai hiki hurejelea sehemu ya kiuno. “Viunoni mwao” ni Kiswahili cha kawaida na sahihi bila kutumia lugha ya kizamani.
theological_decisions:
- issue: Maana ya picha ya kubadilishwa kwa hali ya wafalme
  choice: Tafsiri inadumisha picha ya Mungu akilegeza vifungo vya wafalme kisha akiwafunga mkanda, bila kufafanua kimya kimya aina ya mabadiliko hayo.
  alternative: Mungu huwaachilia wafalme kutoka vifungoni na kuwafunga mkanda ili wawe tayari kutenda; au huondoa mamlaka yao na kuwatiisha.
  rationale: Kiebrania ni kifupi na kinaweza kufasiriwa kwa njia mbalimbali. Vitenzi vinavyokinzana, “kulegeza” na “kufunga,” vinaonyesha mabadiliko yaliyo chini ya enzi ya Mungu, lakini tafsiri haipaswi kulazimisha maana moja ya picha hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mistari miwili unadumisha ushairi na ulinganifu wa Kiebrania; fumbo la picha limehifadhiwa katika matini kuu na maelezo yamewekwa katika tanbihi.
