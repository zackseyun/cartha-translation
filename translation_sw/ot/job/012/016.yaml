  text: עִ֭מּ/וֹ עֹ֣ז וְ/תֽוּשִׁיָּ֑ה ל֝֗/וֹ שֹׁגֵ֥ג וּ/מַשְׁגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: sw
  text: Kwake kuna nguvu na hekima madhubuti; anayepotoka na anayepotosha[a] ni wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyedanganywa na mdanganyifu.” Hata hivyo, muundo wa Kiebrania unatofautisha kati ya mtu anayepotoka na mtu anayemsababisha mwingine apotoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: Kwake kuna
  rationale: Muundo huu unaonyesha kuwa nguvu na hekima ziko kwake na ni mali au uwezo ulio chini ya mamlaka yake, huku ukihifadhi kwa njia ya kawaida nahau ya Kiebrania.
- source_word: עֹז
  choice: nguvu
  rationale: Neno hili kwa kawaida humaanisha nguvu au uwezo; “nguvu” ni la kawaida na wazi katika Kiswahili cha sasa.
- source_word: תּוּשִׁיָּה
  choice: hekima madhubuti
  rationale: Katika fasihi ya hekima neno hili humaanisha hekima yenye msingi na yenye kufaa kwa vitendo. “Hekima madhubuti” huhifadhi maana pana kuliko “hekima” peke yake bila kuigeuza kuwa “mafanikio.”
- source_word: לוֹ
  choice: ni wake
  rationale: Kiambishi ל pamoja na kiwakilishi kinaonyesha umilikaji au uhusiano. “Ni wake” ni kauli fupi na ya asili inayodumisha wazo kwamba wote wawili wako chini ya milki au mamlaka yake.
- source_word: שֹׁגֵג
  choice: anayepotoka
  rationale: Hii ni participo ya Qal ya שׁגה, ikimaanisha mtu anayekosea au kupotoka. Tafsiri hii huhifadhi tendo lisiloelekezwa kwa mtu mwingine badala ya kulifanya moja kwa moja kuwa hali ya kudanganywa.
- source_word: מַשְׁגֶּה
  choice: anayepotosha
  rationale: Hii ni participo ya Hiphil, yaani mtu anayemsababisha mwingine apotoke. “Anayepotosha” hudumisha ulinganifu wa kimatendo na “anayepotoka.”
theological_decisions:
- issue: Uhusiano wa Mungu na anayepotoka pamoja na anayepotosha
  choice: Wote wawili wanasemwa kuwa ni wake, bila kubainisha kwamba yeye ndiye chanzo cha kimaadili cha upotovu wao.
  alternative: Kusema kwamba Mungu anawadhibiti wote kwa majaliwa yake, au kwamba yeye ndiye anayesababisha moja kwa moja upotovu na upotoshaji.
  rationale: Kiebrania kinasema kwa ufupi kuwa wote wawili ni “wake.” Tafsiri “ni wake” inadumisha dai lenye uzito kuhusu enzi yake bila kuongeza maelezo ambayo aya yenyewe haitoi, hivyo mvutano wa kiteolojia unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa “anayepotoka na anayepotosha” unaakisi kwa uwazi tofauti ya miundo miwili ya Kiebrania, na “ni wake” hudumisha ufupi na mvutano wa kauli asilia.
