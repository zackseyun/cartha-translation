  text: יְמַֽשְׁשׁוּ חֹ֥שֶׁךְ וְ/לֹא א֑וֹר וַ֝/יַּתְעֵ֗/ם כַּ/שִּׁכּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: sw
  text: Wanapapasa gizani pasipo nuru; naye huwafanya wayumbe[a] kama mlevi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watanga-tange.” Kitenzi cha Kiebrania kinaweza kumaanisha kutanga au kupotea njia; hapa giza na mfano wa mlevi vinaunga mkono maana ya kuyumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: wanapapasa
  rationale: Kitenzi cha Kiebrania kinaonyesha kutafuta njia kwa kugusa wakati mtu hawezi kuona; “wanapapasa” ni usemi wa kawaida na unaohifadhi taswira hiyo.
- source_word: חֹשֶׁךְ
  choice: gizani
  rationale: Hutoa maana ya kuwa ndani ya giza na inafaa kwa taswira halisi na ya kimajazi bila kuifafanua kupita kiasi.
- source_word: וְלֹא אוֹר
  choice: pasipo nuru
  rationale: Ingawa muundo halisi ni “wala si nuru,” Kiswahili “pasipo nuru” ni cha asili na kinahifadhi ukinzani mkali kati ya giza na nuru.
- source_word: וַיַּתְעֵם
  choice: huwafanya wayumbe
  rationale: Kitenzi תעה kinaweza kumaanisha kutanga, kupotea njia, au kwenda kombo. Katika muktadha wa kupapasa gizani na kulinganishwa na mlevi, “wayumbe” huonyesha hali ya kukosa mwelekeo huku tanbihi ikihifadhi uwezekano wa “watange-tange.”
- source_word: ־ם (kiambishi katika וַיַּתְעֵם)
  choice: wa- katika “huwafanya”
  rationale: Kiambishi cha nafsi ya tatu wingi ni yambwa kinachowarejelea watu waliotajwa katika muktadha.
- source_word: כַּשִּׁכּוֹר
  choice: kama mlevi
  rationale: Neno la umoja linamaanisha mtu aliyelewa; “kama mlevi” ni linganisho la moja kwa moja, la sasa, na lenye hadhi.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha וַיַּתְעֵם
  choice: naye huwafanya wayumbe
  alternative: wao huyumba
  rationale: Muundo wa Kiebrania ni kitenzi cha nafsi ya tatu umoja pamoja na yambwa ya nafsi ya tatu wingi. Kwa hiyo “naye” huhifadhi kiima cha umoja, ambacho katika muktadha mpana kinamrejelea Mungu, bila kukibadili kuwa tendo la watu wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. “Wanapapasa gizani” ni ya asili na hudumisha picha ya kishairi; “naye” huunganisha mstari na muktadha huku ikihifadhi kiima cha Kiebrania. Alama ya tanbihi imewekwa baada ya “wayumbe,” ambako tofauti ya kimsamiati inahusika.
