  text: 'Huwaondolea watu wanaoaminika usemi[a],

    na huwanyang’anya wazee utambuzi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huwaondolea waaminifu mdomo”—yaani, huwanyang’anya uwezo wa kusema au ufasaha.
    reason: lexical_alternative
  - marker: b
    text: Au, “busara,” “uamuzi mzuri,” au “ufahamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: huwaondolea
  rationale: Umbo la kisababishi linaonyesha kuondoa au kumnyang’anya mtu kitu; hapa kauli ya mazoea inaendana na mfululizo wa matendo ya Mungu katika muktadha.
- source_word: שָׂפָה
  choice: usemi
  rationale: Neno hilo kwa maana halisi ni ‘mdomo,’ lakini hapa linatumika kimajazi kumaanisha uwezo wa kusema au usemi wenye ushawishi.
- source_word: לְנֶאֱמָנִים
  choice: watu wanaoaminika
  rationale: Uchaguzi huu unahifadhi wazo la watu wa kutegemewa au wanaopewa imani bila kulifanya neno lihusu uaminifu wa kidini pekee.
- source_word: טַעַם
  choice: utambuzi
  rationale: Ingawa maana ya msingi ni ‘ladha,’ hapa maana ya kimajazi ni uwezo wa kupambanua, kuelewa, au kutoa uamuzi wenye busara.
- source_word: זְקֵנִים
  choice: wazee
  rationale: ‘Wazee’ huwasilisha umri, uzoefu, na hadhi ya kijamii inayoweza kudokezwa na neno la Kiebrania.
- source_word: יִקָּח
  choice: kuwanyang’anya
  rationale: Kitenzi kwa msingi ni ‘kuchukua’; katika usambamba huu maana ni kuondoa kitu walichokuwa nacho. ‘Kuwanyang’anya’ hufanya maana hiyo iwe wazi na ya asili kwa Kiswahili.
