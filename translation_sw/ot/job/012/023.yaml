  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: sw
  text: Huyafanya mataifa kuwa makubwa[a], kisha huyaangamiza; huyapanua, kisha huyapeleka mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Huyapanua mataifa na kuyaongoza.” Vitenzi vya Kiebrania vinaweza kueleweka kuwa vinazungumzia kupanua mataifa na kisha kuyaongoza; tafsiri kuu inaonyesha ulinganifu wa mgeuko unaoonekana kufaa zaidi katika muktadha.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: Huyafanya ... kuwa makubwa
  rationale: Kitenzi hiki cha kisababishi kina maana ya kusababisha mataifa yawe makubwa au yaongezeke; tafsiri hii huhifadhi maana hiyo bila kuibana iwe ustawi pekee.
- source_word: לַגּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu neno linahusu jamii za kisiasa au mataifa kwa ujumla, si watu wasio Wayahudi pekee.
- source_word: וַיְאַבְּדֵם
  choice: huyaangamiza
  rationale: Hutoa kwa ufupi maana ya kuyafanya yapotee au kuyaharibu kabisa, na inafaa katika ulinganifu wa kishairi.
- source_word: שֹׁטֵחַ
  choice: huyapanua
  rationale: Neno lina picha ya kutandaza au kupanua; likihusu mataifa, linaweza kuonyesha kupanuka kwa eneo au ushawishi.
- source_word: וַיַּנְחֵם
  choice: huyapeleka mbali
  rationale: Mzizi נחה kwa kawaida humaanisha kuongoza au kupeleka. Hapa nyongeza ya 'mbali' huwasilisha uwezekano wa kuondolewa kwa mataifa katika ulinganifu wenye kuonyesha mabadiliko, huku tanbihi ikihifadhi maana ya kawaida ya kuongoza.
theological_decisions:
- issue: Maana ya mwendo wa mataifa katika sehemu ya pili ya mstari
  choice: Mungu huyapanua mataifa kisha huyapeleka mbali.
  alternative: Mungu huyapanua mataifa na kuyaongoza.
  rationale: Muktadha unasisitiza mamlaka ya Mungu juu ya kuinuka na kuanguka kwa mataifa. Kwa kuwa נחה inaweza kumaanisha 'kuongoza,' tafsiri kuu hudokeza mgeuko unaolingana na kuangamizwa, lakini tanbihi huhifadhi uwezekano wa uongozi usio na maana ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazoea 'hu-' unafaa kwa vishazi vya kishairi vinavyoeleza matendo ya Mungu kwa jumla; 'kisha' huweka wazi mfuatano na mgeuko wa kishairi bila kuongeza fundisho la kidhehebu.
