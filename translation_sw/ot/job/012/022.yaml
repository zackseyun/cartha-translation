  text: מְגַלֶּ֣ה עֲ֭מֻקוֹת מִנִּי חֹ֑שֶׁךְ וַ/יֹּצֵ֖א לָ/א֣וֹר צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: sw
  text: Hufunua mambo ya kina kutoka gizani, na huleta uvuli wa mauti[a] nuruni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “giza kuu” au “giza la mauti” kwa neno la Kiebrania צַלְמָוֶת.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: Hufunua
  rationale: Kitenzi hiki katika umbo la hali endelevu humaanisha kufichua au kufanya yaliyofichika yajulikane; “hufunua” ni la asili na huhifadhi maana zote mbili.
- source_word: עֲמֻקוֹת
  choice: mambo ya kina
  rationale: Kivumishi cha wingi kilichotumiwa kama nomino kinaweza kurejelea mambo au mahali pa kina na yaliyofichika. “Mambo ya kina” huhifadhi wingi na maana ya kimethali inayofaa muktadha wa hekima.
- source_word: מִנִּי חֹשֶׁךְ
  choice: kutoka gizani
  rationale: Kihusishi kinaonyesha chanzo au mahali ambapo mambo yaliyofichika hutolewa; “kutoka gizani” ni Kiswahili cha kawaida na huhifadhi taswira hiyo.
- source_word: וַיֹּצֵא
  choice: huleta
  rationale: Hifili ya יצא ina maana ya kusababisha kitu kitoke. “Huleta ... nuruni” huwasilisha nguvu hiyo ya kisababishi kwa lugha ya asili.
- source_word: לָאוֹר
  choice: nuruni
  rationale: Kirai kinaonyesha mwendo kuelekea kwenye nuru; “nuruni” ni kifupi, cha kishairi, na cha kawaida katika Kiswahili.
- source_word: צַלְמָוֶת
  choice: uvuli wa mauti
  rationale: Neno hili linaweza kueleweka kwa mapokeo kama “uvuli wa mauti,” au kama giza zito sana. Tafsiri ya mapokeo ni halali na hudumisha uzito wa kishairi; uwezekano mwingine umeandikwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya צַלְמָוֶת
  choice: uvuli wa mauti
  alternative: giza kuu au giza la mauti
  rationale: Hili hasa ni suala la kileksika na kishairi, si uamuzi wa kimadhehebu. Tafsiri ya “uvuli wa mauti” ina msingi wa kileksika na huhifadhi taswira ya kishairi, huku tanbihi ikihifadhi uwezekano kwamba neno hilo humaanisha giza kali sana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishairi umehifadhiwa bila kuwa mgumu kwa msomaji wa kawaida; hali endelevu ya vitenzi vya Kiebrania imewasilishwa kwa “hu-”.
