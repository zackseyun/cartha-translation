- source_word: וַיַּעַן
  choice: akajibu
  rationale: Kitenzi ענה katika mfuatano wa usimulizi kinatanguliza jibu la Ayubu kwa hotuba iliyotangulia; “akajibu” ni cha kawaida na huhifadhi muundo wa mazungumzo.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili sanifu.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Kitenzi אמר ni kitenzi cha kawaida cha kusema; “akasema” huhifadhi fomula ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: וַ
  choice: Ndipo
  rationale: Waw ya mwanzo inaonyesha mwendelezo wa usimulizi. “Ndipo” ni ya asili katika Kiswahili na inaonyesha kwamba jibu linafuata hotuba iliyotangulia; “Naye” pia yawezekana.
