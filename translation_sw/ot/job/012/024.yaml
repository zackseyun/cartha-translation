base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: sw
  text: Huondoa ufahamu[b] wa viongozi wa watu wa nchi[a], na kuwafanya watangetange katika ukiwa usio na njia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “viongozi wa watu wa dunia.” Kiebrania: “vichwa vya watu wa nchi/dunia.”'
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “moyo”; hapa humaanisha ufahamu au uwezo wa kutoa uamuzi.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “katika ukiwa, pasipo njia”—yaani, katika eneo la ukiwa lisilo na njia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: Huondoa
  rationale: Kitenzi hiki cha Kiebrania kina maana ya kuondoa au kutwaa; “huondoa” ni cha kawaida na huhifadhi kauli ya tendo la Mungu.
- source_word: לֵב
  choice: ufahamu
  rationale: Ingawa maana ya moja kwa moja ni “moyo,” hapa neno hilo linataja uwezo wa kufikiri na kutoa uamuzi, si hisia tu.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: viongozi wa watu wa nchi
  rationale: “Vichwa vya” ni nahau ya Kiebrania inayomaanisha viongozi. “Nchi” linafaa katika muktadha huu, huku uwezekano wa “dunia” ukihifadhiwa katika tanbihi.
- source_word: וַיַּתְעֵם
  choice: na kuwafanya watangetange
  rationale: Muundo wa kisababishi wa תעה unaonyesha kuwa anawasababisha kwenda ovyo au kupotea; tafsiri hii huhifadhi kisababishi na taswira.
- source_word: בְּתֹהוּ
  choice: katika ukiwa
  rationale: תֹהוּ hapa hueleza mahali pasipo kitu, penye upweke na vurugu ya mwelekeo; “ukiwa” ni neno la asili na lenye hadhi katika Kiswahili.
- source_word: לֹא דָרֶךְ
  choice: usio na njia
  rationale: Hii hufuata kwa karibu usemi wa Kiebrania “hakuna njia” na kueleza ukiwa ambao hauna barabara wala kijia cha kufuata.
theological_decisions:
- issue: Mtendaji asiyetajwa wazi katika mstari
  choice: Kitenzi kimetafsiriwa katika nafsi ya tatu umoja, huku muktadha ukionyesha kuwa mtendaji ni Mungu.
  alternative: Kutaja “Mungu” wazi mwanzoni mwa mstari.
  rationale: Kiebrania hakirudii jina la Mungu katika mstari huu, lakini muktadha wa Ayubu 12 unaendeleza Mungu kama mtendaji. Kutotaja jina hapa kunahifadhi muundo wa chanzo bila kuficha mwelekeo wa muktadha.
- issue: Maana ya לֵב kwa viongozi
  choice: ufahamu
  alternative: moyo
  rationale: Katika muktadha huu “moyo” ni kitovu cha fikira na uamuzi. “Ufahamu” huepuka dhana ya hisia pekee bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Viongozi” ni ya asili kuliko tafsiri ya moja kwa moja “vichwa,” huku tanbihi ikihifadhi nahau ya Kiebrania. Mpangilio wa alama umewekwa karibu na vipashio vinavyofafanuliwa.
