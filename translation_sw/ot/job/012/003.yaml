base_translation:
  language: en
  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: sw
  text: Mimi pia nina akili kama ninyi; si duni kuliko ninyi.[a] Nani asiyejua mambo kama haya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri iliyo karibu zaidi na maneno ya Kiebrania, “Mimi pia nina moyo kama ninyi.” Hapa “moyo” unamaanisha uwezo wa kufikiri au kuelewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: Mimi pia nina akili
  rationale: Neno לֵבָב kwa msingi humaanisha “moyo,” lakini hapa linataja uwezo wa kufikiri na kuelewa. “Akili” huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku “pia” ikisisitiza kuwa Ayubu ana uwezo huo kama rafiki zake.
- source_word: כְּמוֹכֶם
  choice: kama ninyi
  rationale: Hutoa ulinganisho wa moja kwa moja kati ya Ayubu na watu anaowahutubia; umbo la wingi “ninyi” linahifadhi idadi ya Kiebrania.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: si duni kuliko ninyi
  rationale: Nahau ya נפל pamoja na מן ina maana ya kuwa chini au kuwa pungufu ukilinganishwa na wengine. “Si duni kuliko ninyi” ni ya asili na inahifadhi madai ya usawa.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: Nani asiyejua mambo kama haya?
  rationale: Kishazi hiki ni cha mkato na maana yake halisi ina utata kiasi. Katika muktadha, swali la balagha linaonyesha kuwa maneno ya marafiki zake ni maarifa ya kawaida; tafsiri hii huwasilisha nguvu hiyo kwa uwazi bila kuongeza maelezo yasiyokuwapo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akili” limetumiwa katika matini kuu kwa uelewekaji wa kawaida, huku taswira halisi ya “moyo” ikihifadhiwa katika tanbihi. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
