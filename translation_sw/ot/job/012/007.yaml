translation_notes:
  register: Lugha ni ya sasa, yenye heshima na mtiririko wa kishairi. Kurudiwa kwa “waulize” katika sehemu ya pili kunafanya uhusiano wa kisarufi uwe wazi katika Kiswahili bila kubadili maana ya ombi moja linalowahusu wanyama na ndege.
