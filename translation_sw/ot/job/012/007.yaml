  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: sw
  text: Lakini tafadhali waulize wanyama, nao watakufundisha; na ndege wa angani[a] watakuambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kiebrania kinasema, “ndege wa mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini
  rationale: Inaonyesha badiliko lenye ulinganisho au upinzani katika maneno ya Ayubu; “Lakini” ni ya kawaida na wazi katika Kiswahili.
- source_word: שְׁאַל נָא
  choice: tafadhali waulize
  rationale: Kitenzi ni agizo la kuuliza, huku נָא ikiongeza ombi au msisitizo wa upole badala ya kumaanisha tu wakati wa “sasa.”
- source_word: בְהֵמוֹת
  choice: wanyama
  rationale: Hapa neno hili linawahusu kwa upana wanyama wa nchi kavu, si mifugo pekee.
- source_word: וְתֹרֶךָּ
  choice: nao watakufundisha
  rationale: Kitenzi cha Kiebrania kinamaanisha “kufundisha” au “kuelekeza.” Ingawa umbo lake ni la umoja wa kike kwa sababu ya nomino ya mkusanyiko, Kiswahili hutumia wingi kwa “wanyama.”
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: Katika muktadha huu עוֹף ni viumbe warukao, hasa ndege. “Wa angani” ni Kiswahili cha asili kinachoeleza mahali wanaporuka, huku tanbihi ikihifadhi usemi halisi zaidi “wa mbingu.”
- source_word: וְיַגֶּד לָךְ
  choice: nao watakuambia
  rationale: Kitenzi נגד katika kausativi humaanisha kusema, kutangaza, au kujulisha. “Watakuambia” ni wazi na cha kawaida, na wingi unapatana na “ndege.”
