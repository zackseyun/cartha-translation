  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: sw
  text: Ambaye mkononi mwake kuna uhai wa kila kiumbe hai[a], na pumzi ya wanadamu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi ya kila kiumbe hai, na roho ya mwili wa kila mwanadamu.”
    reason: Nֶפֶשׁ na רוּחַ yanaweza pia kutafsiriwa “nafsi” na “roho”; sehemu ya mwisho kwa halisi zaidi hutaja mwili wa mwanadamu.
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Ambaye mkononi mwake
  rationale: Kishazi cha uhusiano na sitiari ya Kiebrania ya kitu kuwa ‘mkononi’ mwa Mungu vimehifadhiwa; sitiari hii huonyesha mamlaka na udhibiti wake.
- source_word: נֶפֶשׁ
  choice: uhai
  rationale: Katika ulinganifu huu neno hilo linaelekea kumaanisha uhai unaohuisha viumbe, si lazima ‘nafsi’ kama sehemu isiyo ya mwili.
- source_word: כָּל חָי
  choice: kila kiumbe hai
  rationale: Huwasilisha kwa lugha ya kawaida maana pana ya kila kilicho hai.
- source_word: וְרוּחַ
  choice: na pumzi
  rationale: Katika muktadha wa uhai wa viumbe na wanadamu, ‘pumzi’ hudumisha maana halisi ya nguvu ya uhai bila kulazimisha tafsiri ya ‘roho’.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: wanadamu wote
  rationale: Hutoa maana ya jumla ya wanadamu kwa Kiswahili cha kawaida; dhana halisi ya ‘mwili’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya maneno ya kianthropolojia נֶפֶשׁ na רוּחַ
  choice: uhai na pumzi
  alternative: nafsi na roho
  rationale: Uchaguzi huu unasisitiza kwamba uhai wa viumbe na pumzi ya wanadamu viko katika mamlaka ya Mungu, bila kuingiza mgawanyo mkali wa mwili, nafsi na roho ambao mstari wenyewe haulazimishi.
- issue: Usemi כָּל בְּשַׂר אִישׁ
  choice: wanadamu wote
  alternative: mwili wote wa mwanadamu
  rationale: Tafsiri kuu ni ya kawaida na wazi, huku tanbihi ikihifadhi muundo halisi zaidi na mvutano wake wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka. Kishazi ‘Ambaye’ hudumisha utegemezi wa mstari huu kwa muktadha uliotangulia, kama ilivyo katika Kiebrania.
