  yaml_path: translation/ot/job/012/005.yaml
  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: sw
  text: 'Mwenge hudharauliwa katika mawazo ya mtu aliye na raha;

    uko tayari kwa wale ambao mguu wao unateleza.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania cha mstari huu ni kigumu. Pia yaweza kueleweka: “Msiba hudharauliwa katika mawazo ya mtu aliye na raha; uko tayari kwa wale ambao mguu wao unateleza.”'
    reason: Huhifadhi uwazi kuhusu uwezekano wa kuelewa taswira ya ‘mwenge’ kwa maana ya msiba bila kuibadilisha kimya kimya katika maandishi makuu.
lexical_decisions:
- source_word: לַפִּיד
  choice: mwenge
  rationale: Maana ya kawaida ya nomino hii ni mwenge au taa inayowaka; uchaguzi huu huhifadhi taswira halisi ya Kiebrania na ulinganifu wake wa kisarufi na נָכוֹן.
- source_word: בּוּז
  choice: hudharauliwa
  rationale: Nomino ya Kiebrania ina maana ya dharau; katika Kiswahili imewasilishwa kwa kauli ya hali ili sentensi iwe ya kawaida bila kubadili maana.
- source_word: לְעַשְׁתּוּת שַׁאֲנָן
  choice: katika mawazo ya mtu aliye na raha
  rationale: עַשְׁתּוּת hapa inaelekea kumaanisha mawazo, na שַׁאֲנָן humtaja mtu aliye salama, ametulia, au mwenye raha.
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: kwa wale ambao mguu wao unateleza
  rationale: Kirai kigumu chenye maana ya kuyumba au kuteleza kwa mguu; uundaji huu huhifadhi umoja wa רָגֶל na wazo la watu wanaokaribia kuanguka.
theological_decisions:
- issue: Taswira tata ya mwenge na mtu ambaye mguu wake unateleza
  choice: Taswira imehifadhiwa bila kuifasiri kuwa ‘msiba’ au hukumu.
  alternative: ‘Msiba hudharauliwa na mtu aliye na raha, lakini uko tayari kwa wale wanaoteleza.’
  rationale: Kiebrania kilichopokelewa kinasoma לַפִּיד, yaani ‘mwenge’; ingawa muktadha ni mgumu na tafsiri nyingine huweka maana ya msiba, si lazima kuondoa utata wa kishairi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka. ‘Aliye na raha’ ni ya kawaida na yenye heshima; umoja wa ‘mguu wao’ umehifadhiwa kwa ukaribu na Kiebrania.
