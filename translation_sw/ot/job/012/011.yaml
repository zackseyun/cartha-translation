translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Taswira sawia ya sikio linalojaribu maneno na kaakaa linaloonja chakula imehifadhiwa; 'kaakaa' ni sahihi zaidi kuliko 'kinywa'.
