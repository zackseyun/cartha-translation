  text: Je, sikio halipimi maneno[a], kama vile kaakaa huonja chakula?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, sikio halichunguzi usemi, kama vile kaakaa huonja chakula?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... hali-
  rationale: Muundo huu unaendeleza swali la balagha linalotarajia jibu la kukubali, kwa Kiswahili cha kawaida.
- source_word: אֹזֶן
  choice: sikio
  rationale: Neno halisi la kiungo cha mwili linahifadhi taswira ya Kiebrania, huku likidokeza uwezo wa kusikia na kupambanua.
- source_word: מִלִּין
  choice: maneno
  rationale: Ni tafsiri ya moja kwa moja ya wingi unaoweza kumaanisha maneno, usemi, au mambo yaliyosemwa.
- source_word: תִּבְחָן
  choice: linajaribu
  rationale: Kitenzi kina maana ya kuchunguza au kupima ili kutambua ubora; 'kujaribu' kinahifadhi ulinganifu na tendo la kuonja.
- source_word: חֵךְ
  choice: kaakaa
  rationale: Hiki ndicho kiungo mahususi ndani ya kinywa kinachotajwa, hivyo taswira ya mwili na ulinganifu wake na sikio vinahifadhiwa.
- source_word: אֹכֶל
  choice: chakula
  rationale: Ni nomino halisi na ya kawaida kwa kile kinacholiwa.
- source_word: יִטְעַם
  choice: linavyoonja
  rationale: Inawakilisha moja kwa moja tendo la kuonja; wakati wa sasa unafaa kauli hii ya jumla.
- source_word: לוֹ
  choice: (haikutafsiriwa kando)
  rationale: Kiwakilishi hiki ni cha kiidioma katika kishazi hiki na hakihitaji kirai tofauti katika Kiswahili; maana yake imo katika tendo la kaakaa lenyewe kuonja, na kuongeza 'kwa ajili yake lenyewe' kungekuwa kigeni na kunaweza kupotosha.
