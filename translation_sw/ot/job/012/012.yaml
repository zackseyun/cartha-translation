lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: Kwa wazee
  rationale: Kihusishi ב kinaweza kuonyesha uhusiano au mahali. “Kwa wazee” ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kwamba hekima hupatikana pamoja na au miongoni mwa watu wenye umri mkubwa, bila kuwahusisha wanaume pekee.
- source_word: חָכְמָה
  choice: hekima
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa חָכְמָה katika fasihi ya hekima.
- source_word: וְאֹרֶךְ יָמִים
  choice: na katika wingi wa siku
  rationale: Usemi huu unahifadhi taswira halisi ya Kiebrania ya “urefu wa siku” kwa Kiswahili cha asili zaidi; unaelekea kumaanisha maisha marefu au siku nyingi.
- source_word: תְּבוּנָה
  choice: ufahamu
  rationale: “Ufahamu” huwasilisha uwezo wa kuelewa na kupambanua, huku ukidumisha tofauti ya kimaanisho na “hekima.”
