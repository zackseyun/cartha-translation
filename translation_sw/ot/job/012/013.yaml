  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: sw
  text: Pamoja naye kuna hekima na nguvu; ushauri na ufahamu ni wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִמּוֹ
  choice: Kwake kuna
  rationale: עִם pamoja na kiambishi cha nafsi kwa kawaida humaanisha ‘pamoja naye’ au ‘kwake’; katika kishazi hiki cha kishairi inaonyesha kwamba sifa hizi ziko kwake bila kuingiza moja kwa moja wazo la ‘ndani yake’.
- source_word: חָכְמָה
  choice: hekima
  rationale: ‘Hekima’ ni tafsiri ya kawaida na ya asili ya חָכְמָה, ikimaanisha utambuzi na ujuzi wa kweli.
- source_word: וּגְבוּרָה
  choice: na nguvu
  rationale: גְבוּרָה humaanisha nguvu, uwezo, au uweza; ‘nguvu’ ni neno la kawaida, lenye heshima, na linafaa katika ulinganifu wa kishairi na ‘hekima’.
- source_word: לוֹ
  choice: ni vyake
  rationale: ל pamoja na kiambishi hapa huonyesha umilikaji katika kishazi kisicho na kitenzi; ‘ni vyake’ huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: עֵצָה
  choice: shauri
  rationale: עֵצָה linaweza kumaanisha shauri, mpango, au ushauri; ‘shauri’ linadumisha maana ya uamuzi na upangaji katika mtindo wa kishairi.
- source_word: וּתְבוּנָה
  choice: na ufahamu
  rationale: תְבוּנָה humaanisha ufahamu, utambuzi, au busara; ‘ufahamu’ linafaa katika ulinganifu na ‘shauri’ na ni wazi kwa wasomaji wa sasa.
theological_decisions:
- issue: Mrejelewa wa viambishi vya nafsi
  choice: Viambishi vinamrejelea Mungu, lakini jina ‘Mungu’ halijaongezwa katika mstari.
  alternative: Kumtaja Mungu wazi badala ya kutumia umbo la kiwakilishi.
  rationale: Muktadha humtambulisha Mungu kuwa mrejelewa, lakini Kiebrania kinatumia viambishi vya nafsi. Tafsiri inadumisha jambo hilo na kuacha muktadha utoe utambulisho.
- issue: Uhusiano wa hekima na nguvu na Mungu
  choice: ‘Kwake kuna’ linaonyesha kuwa sifa hizo ziko pamoja naye au anazo.
  alternative: ‘Ndani yake kuna’ lingesisitiza kwamba sifa hizo zinakaa ndani yake.
  rationale: עִמּוֹ kwa msingi ni ‘pamoja naye/kwake’; hivyo tafsiri haiongezi dai kali zaidi la kiontolojia kuliko linalotolewa moja kwa moja na kihusishi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa urahisi. Ulinganifu wa mistari miwili umehifadhiwa: ‘hekima na nguvu’ / ‘shauri na ufahamu’.'
