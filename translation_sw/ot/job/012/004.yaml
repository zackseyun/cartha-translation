base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: sw
  text: Mimi ni mtu wa kuchekwa na rafiki yangu[a], mimi niliyemwita Mungu, naye akanijibu[b]. Mwenye haki na asiye na lawama ni mtu wa kuchekwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “rafiki yake”; kiambishi tamati cha Kiebrania kinaweza kusomeka hivyo, ingawa muktadha unapendelea “rafiki yangu,” kwa kuwa Ayubu anazungumza kuhusu rafiki zake mwenyewe.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “naye akamjibu”; anayerejelewa ni Ayubu mwenyewe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק / שְׂחוֹק
  choice: mtu wa kuchekwa
  rationale: Nomino hii inaonyesha mtu anayefanywa kitu cha dhihaka. Kauli hii ni ya kawaida na wazi katika Kiswahili cha sasa, na marudio yake yanahifadhi msisitizo wa Kiebrania.
- source_word: לְרֵעֵהוּ
  choice: na rafiki yangu
  rationale: Kiambishi cha maandishi ya Kiebrania kinaweza kueleweka kihalisi kuwa ‘rafiki yake,’ lakini muktadha unaonyesha Ayubu akizungumza kuhusu jinsi rafiki yake mwenyewe anavyomcheka. Utofauti huo umehifadhiwa katika tanbihi.
- source_word: אֶהְיֶה
  choice: nimekuwa
  rationale: Ingawa kitenzi ni cha hali isiyotimilika, katika muktadha kinaeleza hali aliyofikia Ayubu. ‘Nimekuwa’ huwasilisha kwa kawaida wazo la kuwa sasa amefanywa mtu wa kuchekwa.
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: mimi niliyemwita Mungu
  rationale: Kirai cha urejeshi kinamtambulisha Ayubu kuwa ndiye aliyemwomba Mungu. ‘Kumwita Mungu’ kinahifadhi taswira ya Kiebrania ya kumlilia au kumwomba Mungu bila kuipanua kupita kiasi.
- source_word: וַיַּעֲנֵהוּ
  choice: naye akanijibu
  rationale: Umbo la Kiebrania lina kiambishi cha nafsi ya tatu, ‘akamjibu,’ lakini katika muktadha anayerejelewa ni Ayubu mwenyewe. Kiswahili hutaja rejeleo hilo wazi; umbo la karibu zaidi na sarufi ya Kiebrania limetolewa katika tanbihi.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Hili ni neno la kawaida la Kiswahili kwa uadilifu wa kimaadili katika fasihi ya hekima.
- source_word: תָּמִים
  choice: asiye na lawama
  rationale: Neno hili linaonyesha ukamilifu wa uadilifu au mwenendo usiolaumika, si lazima kutokuwa na dhambi kabisa.
theological_decisions:
- issue: Ikiwa תָּמִים linamaanisha ukamilifu usio na dhambi
  choice: ‘asiye na lawama’ kama lugha ya uadilifu
  alternative: ‘mkamilifu’
  rationale: Katika Ayubu, neno hili humweleza mtu mwenye uadilifu kamili wa mwenendo; halilazimishi dai la kwamba hana dhambi kabisa.
- issue: Uhusiano wa צַדִּיק תָּמִים na שְׂחוֹק katika kishazi cha mwisho
  choice: ‘Mwenye haki na asiye na lawama amekuwa mtu wa kuchekwa’
  alternative: Kuyafanya maneno hayo kuwa maelezo ya moja kwa moja ya ‘mimi’ katika kishazi kilichotangulia
  rationale: Mpangilio wa Kiebrania unaruhusu kishazi kisicho na kitenzi ambamo mwenye haki na asiye na lawama ndiye anayekuwa mtu wa kuchekwa. Tafsiri hii inadumisha uzito na mvutano wa kauli bila kuongeza kiunganishi kisichokuwapo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mtu wa kuchekwa’ kimetumiwa badala ya neno la kiufundi au la kale ili maana ya dhihaka ieleweke kwa urahisi. Sentensi ya mwisho imetenganishwa ili muundo na msisitizo wa Kiebrania ubaki wazi.
