base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: sw
  text: Tazama[a], akibomoa, hakitajengwa tena; akimfungia mtu[b], hakuna awezaye kufungua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa hakika” kwa chembe ya ufunguzi.
    reason: lexical_alternative
  - marker: b
    text: Au “akimzuia mtu” au “akimweka mtu kifungoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Chembe hii huvuta uangalifu na kusisitiza dai linalofuata. “Tazama” ni ya kawaida, yenye heshima, na inadumisha nguvu yake bila kuifanya kuwa maelezo tu.
- source_word: יַהֲרוֹס
  choice: akibomoa
  rationale: Kitenzi הרס humaanisha kubomoa au kuangusha kilichojengwa. “Akibomoa” huhifadhi taswira ya jengo inayofuatwa na “hakitajengwa tena.”
- source_word: וְלֹא יִבָּנֶה
  choice: hakitajengwa tena
  rationale: Nifali ya בנה ni ya kutendwa, “kujengwa.” Neno “tena” linaonyesha kwa kawaida kwamba kilichobomolewa hakitajengwa upya, huku muundo wa Kiswahili ukidumisha matokeo yasiyoweza kubadilishwa.
- source_word: יִסְגֹּר עַל אִישׁ
  choice: akimfungia mtu ndani
  rationale: סגר pamoja na עַל אִישׁ hapa inaonyesha kumfungia au kumzuia mtu asitoke. “Kumfungia mtu ndani” huhifadhi taswira halisi bila kuingiza dhana maalumu ya kifungo cha kisheria.
- source_word: וְלֹא יִפָּתֵחַ
  choice: hakutafunguliwa
  rationale: Nifali ya פתח ni ya kutendwa, “kufunguliwa.” Kiswahili kinaweza kuacha yule anayefunguliwa akiwa amedokezwa, kama ilivyo katika Kiebrania, na hivyo kudumisha ulinganifu wa sentensi.
theological_decisions:
- issue: Kiima kinachomrejelea Mungu
  choice: kiima kisichotajwa wazi katika vitenzi “akibomoa” na “akimfungia”
  alternative: Mungu / BWANA
  rationale: Kiebrania kina vitenzi vya nafsi ya tatu umoja bila kulitaja jina la Mungu katika mstari huu. Kiswahili huruhusu kiima hicho kibaki ndani ya umbo la kitenzi; hivyo mtiririko wa habari unadumishwa bila kuongeza cheo au jina lisilomo katika mstari.
- issue: Nguvu ya kauli hasi baada ya tendo la Mungu
  choice: 'wakati ujao hasi: “hakitajengwa tena” na “hakutafunguliwa”'
  alternative: “hakiwezi kujengwa tena” na “hawezi kufunguliwa”
  rationale: Muundo wa Kiebrania ni וְלֹא pamoja na vitenzi vya hali isiyotimilika, ambao unaweza kueleza matokeo ya baadaye yaliyo thabiti. Tafsiri hii haitamki moja kwa moja modaliti ya “haiwezekani,” lakini katika muktadha bado inaonyesha kutobadilika kwa matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masharti “akibomoa …; akimfungia …” ni wa asili katika Kiswahili na hudumisha ulinganifu wa kishairi. “Mtu” limetumiwa kwa אִישׁ kwa kuwa Kiswahili kwa kawaida halilazimishi jinsia ya kiume katika nomino hii; kiambishi “-m-” bado huonyesha nafsi ya tatu umoja bila kuongeza jinsia isiyohitajika.
