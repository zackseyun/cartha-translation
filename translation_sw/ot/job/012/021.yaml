  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: sw
  text: 'Huwamwagia wakuu dharau,

    na hulegeza mkanda[b] wa wenye nguvu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye mamlaka” au “wenye uwezo.”
    reason: lexical_alternative
  - marker: b
    text: Kulegeza mkanda ni taswira inayoweza kumaanisha kuondoa nguvu, utayari, au mamlaka.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: humwaga
  rationale: Kitenzi hiki huhifadhi picha halisi ya ‘kumwaga’ kitu; katika muktadha huu dharau inamiminwa juu ya watu wenye hadhi.
- source_word: בּוּז
  choice: dharau
  rationale: ‘Dharau’ ni neno la kawaida na lenye nguvu linaloeleza kudharauliwa na kuaibishwa hadharani.
- source_word: נְדִיבִים
  choice: wakuu
  rationale: Katika muktadha wa kupinduliwa kwa hadhi za kijamii, neno hili linarejelea watu mashuhuri au watawala. ‘Wakuu’ ni pana na halibani maana kwa wana wa mfalme pekee.
- source_word: מְזִיחַ
  choice: mkanda
  rationale: Neno hili linaeleweka kuwa mkanda wa kujifunga kiunoni; tafsiri hii inadumisha taswira halisi ya kishairi.
- source_word: אֲפִיקִים
  choice: wenye nguvu
  rationale: Katika ulinganifu na ‘wakuu,’ neno hili linaeleweka kuwa watu wenye nguvu au uwezo, ingawa maana yake ya Kiebrania si nyembamba kabisa.
- source_word: רִפָּה
  choice: kulegeza
  rationale: Kitenzi kinamaanisha kufanya kitu kiwe legevu. ‘Kulegeza’ kinaendeleza picha ya mkanda unaolegezwa bila kuifasiri kupita kiasi.
theological_decisions:
- issue: Taswira ya Mungu kuwadhalilisha na kuwaondolea uwezo wenye mamlaka
  choice: Kudumisha usemi ‘kulegeza mkanda wa wenye nguvu’ katika maandishi makuu.
  alternative: Kuwapokonya wenye nguvu uwezo wao; kuwanyang’anya silaha mashujaa.
  rationale: Kiebrania kinatumia taswira thabiti ya mkanda unaolegezwa. Kuidumisha kunahifadhi nguvu ya kishairi na hali ya wazi ya maana, bila kuifanya iwe ya kijeshi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mistari miwili unadumisha ulinganifu wa kishairi wa Kiebrania; taswira halisi haijabadilishwa kuwa maelezo ya moja kwa moja.
