  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: sw
  text: 'Huwapeleka washauri mbali, wakiwa wameporwa[a],

    na huwafanya waamuzi kuwa wapumbavu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakiwa wamevuliwa vitu vyao.” Kiebrania kinaweza kumaanisha kwamba washauri hao wanaondolewa wakiwa wamenyang’anywa mali yao na kufedheheshwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: huwaongoza
  rationale: Kauli ya kusababisha ya kitenzi הלך inaonyesha kuwafanya waende; katika muktadha huu, “huwaongoza” ni ya kawaida na hudumisha wazo la kuwapeleka mbali bila kuongeza ukali usiotajwa wazi.
- source_word: יוֹעֲצִים
  choice: washauri
  rationale: Neno hili humaanisha watu wanaotoa shauri; “washauri” ni Kiswahili cha sasa na linafaa katika muktadha wa viongozi wa jamii.
- source_word: שׁוֹלָל
  choice: wakiwa wamevuliwa mali
  rationale: Neno linaweza kueleza watu walioporwa au kunyang’anywa mali na kuongozwa kwa fedheha. Kauli hii inawasilisha hali hiyo kwa Kiswahili cha kawaida bila kuifungamanisha na maana finyu ya kuwa peku.
- source_word: שֹׁפְטִים
  choice: waamuzi
  rationale: Hili ndilo neno la moja kwa moja kwa wenye jukumu la kuhukumu, huku uwezekano wa wao pia kuwa viongozi ukibaki katika muktadha.
- source_word: יְהוֹלֵל
  choice: huwafanya ... kuwa wapumbavu
  rationale: 'Piel ya הלל katika maana hii ni ya kusababisha: kuwafanya watu wawe wajinga au watende bila akili. Tafsiri hii inaweka wazi usababishaji na kudumisha ulinganifu wa kishairi.'
theological_decisions:
- issue: Kiima kisichotajwa wazi katika mstari
  choice: Kiima cha nafsi ya tatu kimeonyeshwa kwa viambishi “hu-” na “-wa-”, kikimrejelea Mungu.
  alternative: Kutaja “Mungu” au “Yeye” moja kwa moja.
  rationale: Muktadha wa Ayubu 12 unamtambulisha Mungu kuwa mtendaji. Kiswahili kinaweza kuonyesha kiima kwa kitenzi bila kuongeza jina lisilomo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mistari miwili umehifadhi ulinganifu wa kishairi. “Huwa-” linaonyesha tendo la kawaida au lenye tabia ya kuendelea katika maelezo ya matendo ya Mungu.
