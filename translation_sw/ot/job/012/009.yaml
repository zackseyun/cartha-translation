  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: sw
  text: Ni nani kati ya hawa wote asiyejua kwamba mkono wa Yahwe umefanya hili?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: Ni nani ... asiyejua
  rationale: Swali la balagha la Kiebrania limetafsiriwa kwa muundo wa kawaida wa Kiswahili unaodumisha maana ya kwamba wote wanajua.
- source_word: בְּ/כָל אֵלֶּה
  choice: kati ya hawa wote
  rationale: ב hapa ina maana ya kigawanyo, ‘kati ya.’ ‘Hawa’ inafaa kwa viumbe hai vilivyotajwa katika muktadha uliotangulia.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya kile kinachojulikana, si sababu.
- source_word: יַד
  choice: mkono
  rationale: Taswira halisi ya ‘mkono’ imehifadhiwa kwa kuwa inaeleweka kama ishara ya utendaji na nguvu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo.
- source_word: עָשְׂתָה זֹּאת
  choice: umefanya hili
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya’; kauli ‘umefanya hili’ inadumisha kiwakilishi cha umoja זֹאת na hali ya tendo lenye matokeo yanayoonekana.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; kulitaja ‘Yahwe’ huhifadhi jina binafsi badala ya kulibadilisha na cheo.
- issue: Taswira ya ‘mkono wa Yahwe’
  choice: mkono wa Yahwe
  alternative: nguvu za Yahwe
  rationale: Taswira ya chanzo imehifadhiwa bila kufafanua kimya-kimya ikiwa inamaanisha nguvu, mamlaka, au utendaji; hivyo mvutano na upana wa kishairi hubaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na unaeleweka kwa wasomaji wa kawaida, huku swali la balagha, taswira ya kishairi, na jina la Mungu vikihifadhiwa.
