  yaml_path: translation/ot/job/012/019.yaml
  text: He leads priests away stripped[b][a], and he overthrows the mighty.
translation:
  language: sw
  text: Yeye huwapeleka mbali makuhani wakiwa wameporwa[a], na huwapindua walio imara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwa wamevuliwa,” au “wakiwa kama nyara.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wenye nguvu”; neno hilo pia linaweza kumaanisha watu wanaodhaniwa kuwa wenye kudumu au waliosimama thabiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: huwapeleka
  rationale: Hii ni kauli ya kusababisha ya kitenzi הלך; katika muktadha inaonyesha kuwafanya waende au kuwaondoa, hapa kwa maana ya kuwapeleka mbali katika hukumu.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Hii ndiyo maana ya kawaida ya neno hilo, na inawahusu watu wenye cheo cha kidini na kijamii.
- source_word: שׁוֹלָל
  choice: wakiwa wamepokonywa mali
  rationale: Neno linaonyesha hali ya kuporwa au kunyang'anywa vitu na heshima. Tafsiri hii ni ya kawaida katika Kiswahili na inaweka wazi fedheha na upotevu bila kulifanya neno limaanishe lazima kuwa peku.
- source_word: אֵתָנִים
  choice: walio imara
  rationale: Neno linaweza kueleza nguvu, uthabiti, au kudumu. 'Walio imara' huhifadhi upana huo vizuri kuliko kulibana kuwa nguvu za kimwili pekee.
- source_word: יְסַלֵּף
  choice: huwapindua
  rationale: Kitenzi kina wazo la kupotosha, kupindisha, au kuondoa kutoka hali yake thabiti. Katika muktadha wa Mungu kuwashusha wenye mamlaka, 'huwapindua' ni ya asili na huhifadhi nguvu ya tendo hilo.
theological_decisions:
- issue: Kuendelea kwa mtenda asiye tajwa wazi katika muktadha wa Ayubu 12
  choice: Kutumia ‘Yeye’ kumrejelea Mungu bila kuliongeza jina lake
  alternative: Kutaja ‘Mungu’ waziwazi
  rationale: Mistari inayozunguka inaendeleza matendo ya Mungu kama mtenda mmoja. ‘Yeye’ huhifadhi mtiririko wa kishairi wa Kiebrania na haiongezi jina lisilorudiwa katika mstari huu.
- issue: Maana ya אֵתָנִים kama kundi linalopinduliwa
  choice: ‘walio imara,’ ikihifadhi maana ya nguvu na uthabiti
  alternative: ‘wenye nguvu’ au ‘wanaodumu’
  rationale: Muktadha unawahusu watu wanaoonekana kuwa na cheo au uthabiti, lakini neno lenyewe halibainishi aina moja tu ya nguvu. Tafsiri pana inaacha mvutano huo wa maana wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Huwapeleka’ na ‘huwapindua’ zinaendeleza muundo sambamba wa mstari, huku maelezo ya chini yakihifadhi uwezekano wa maana nyingine za maneno yenye utata.
