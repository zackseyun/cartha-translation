base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: sw
  text: 'Mahema ya waporaji yako kwa raha,

    na wale wanaomchokoza Mungu wako salama—

    wale ambao Mungu huwaleta mkononi mwake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale ambao Mungu huleta [kitu] mikononi mwao.” Kifungu cha mwisho cha Kiebrania ni kigumu; huenda kinarejelea matendo ya Mungu wa kweli au, kwa kejeli, wale ambao “mungu wao” huleta [vitu] mikononi mwao.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: yana utulivu
  rationale: Kitenzi kinamaanisha kuwa katika hali ya utulivu bila kusumbuliwa; tafsiri hii inadumisha kejeli ya waporaji kuishi kwa raha.
- source_word: אֹהָלִים
  choice: mahema
  rationale: Taswira halisi ya mahema imehifadhiwa, ingawa katika ushairi inaweza pia kumaanisha makao au familia.
- source_word: לְשֹׁדְדִים
  choice: ya waporaji
  rationale: Neno linawaeleza watu wanaoteka mali kwa nguvu; “waporaji” linaonyesha uporaji wa kijeuri bila kulifanya kuwa uharibifu wa jumla tu.
- source_word: וּבַטֻּחוֹת
  choice: wako salama
  rationale: Kauli hii inalingana kishairi na “yana utulivu” na inaonyesha usalama wao unaoonekana.
- source_word: לְמַרְגִּיזֵי אֵל
  choice: wanaomkasirisha Mungu
  rationale: Hifili ya רגז hapa ina maana ya kumsababisha Mungu kukasirika, yaani kumchokoza au kumkera.
- source_word: אֵל
  choice: Mungu
  rationale: Katika muktadha huu ni jina la kawaida la Mungu, si lazima litafsiriwe kwa cheo kama “Mwenye Nguvu.”
- source_word: לַאֲשֶׁר
  choice: wale ambao
  rationale: Kifungu hiki kinaanzisha maelezo ya ziada kuhusu waovu walio salama, huku ugumu wa uhusiano wa kisarufi ukielezwa katika tanbihi.
- source_word: הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: mungu wao huleta mkononi mwao
  rationale: Tafsiri hii inachukua אֱלוֹהַּ kama mhusika wa tendo na “mkono” kama ishara ya uwezo au milki. Herufi ndogo katika “mungu” inadokeza kwa kejeli kwamba nguvu ya mwovu ndiyo mungu wake; miundo mingine inayowezekana imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mhusika anayerejelewa na אֱלוֹהַּ katika kifungu cha mwisho
  choice: “mungu” kwa herufi ndogo, akimaanisha kile ambacho mwovu anakitumainia, yaani nguvu yake
  alternative: '“Mungu” wa kweli: “wale ambao Mungu huwatia mkononi mwake,” au “wale ambao Mungu huwaletea mkononi mwao”'
  rationale: Muktadha unasisitiza utulivu wa waovu na uasi wao. Usomaji uliochaguliwa unaweza kuendeleza kejeli hiyo, lakini Kiebrania kina utata wa kweli; kwa hiyo usomaji unaomhusisha Mungu wa kweli haujaondolewa bali umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari imepangwa kishairi ili kuonyesha ulinganifu wa vipashio. “Waporaji” ni neno la kawaida lakini lenye uzito unaofaa, na tofauti ya “Mungu/mungu” imetumiwa kwa makusudi kuhifadhi mvutano wa kifungu.
