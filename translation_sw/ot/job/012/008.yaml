id: JOB.12.8
reference: Job 12:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: א֤וֹ שִׂ֣יחַ לָ/אָ֣רֶץ וְ/תֹרֶ֑/ךָּ וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗ דְּגֵ֣י הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: sw
  text: Au sema na dunia[a], nayo itakufundisha; na samaki wa baharini watakusimulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ardhi” au “nchi”; neno la Kiebrania אֶרֶץ linaweza kuwa na maana yoyote kati ya hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: Au
  rationale: Kiunganishi hiki kinaendeleza mfululizo wa njia mbadala katika muktadha; “Au” ni cha kawaida na sahihi katika Kiswahili.
- source_word: שִׂ֣יחַ
  choice: sema na
  rationale: Katika kauli hii ya amri yenye לָאָרֶץ, kitenzi kina maana ya kuzungumza na au kuelekeza maneno kwa dunia, si kutafakari kimoyomoyo.
- source_word: לָ/אָ֣רֶץ
  choice: dunia
  rationale: אֶרֶץ inaweza kuwa “dunia” au “nchi/ardhi”; upeo wa viumbe waliotajwa katika muktadha—wanyama, ndege na samaki wa baharini—unaunga mkono “dunia.”
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: nayo itakufundisha
  rationale: Hifili ya ירה humaanisha kufundisha au kuelekeza. “Nayo itakufundisha” ni ya asili katika Kiswahili na inadumisha uhuishaji wa dunia.
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: watakusimulia
  rationale: Pieli ya ספר inaweza kumaanisha kusimulia, kueleza au kutangaza. “Watakusimulia” inadumisha wazo la viumbe kutoa habari na inaendana na lugha ya kishairi.
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: samaki wa baharini
  rationale: Hii inawasilisha kwa kawaida muundo wa Kiebrania na kuhifadhi taswira ya bahari.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Uhuishaji wa dunia na samaki umehifadhiwa. Jinsia ya kisarufi ya Kiebrania katika kitenzi kinachorejelea dunia haihitaji tanbihi tofauti kwa sababu ngeli ya Kiswahili tayari hudai “nayo,” bila kudokeza jinsia ya kike.
