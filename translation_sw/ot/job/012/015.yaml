  text: הֵ֤ן יַעְצֹ֣ר בַּ/מַּ֣יִם וְ/יִבָ֑שׁוּ וִֽ֝/ישַׁלְּחֵ֗/ם וְ/יַ֖הַפְכוּ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: sw
  text: Tazama, akizuia maji, hukauka; akiyaachilia, maji hayo huipindua dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha dunia au nchi kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili huvuta fikira na kusisitiza dai linalofuata; “Tazama” lina uzito wa kishairi lakini bado linaeleweka katika Kiswahili cha sasa.
- source_word: יַעְצֹר בַּמַּיִם
  choice: akizuia maji
  rationale: Kitenzi עצר hapa kinaeleza kuyazuia au kuyashikilia maji yasitiririke. “Kuzuia maji” ni usemi wa kawaida unaohifadhi maana ya mamlaka juu yake.
- source_word: וְיִבָשׁוּ
  choice: hukauka
  rationale: Kitenzi kiko katika wingi na kiima chake hakikutajwa wazi. Kiswahili huruhusu kurejelea “maji” kwa ngeli ya wingi; tafsiri hii inahifadhi ufupi na hali ya matokeo bila kuongeza kiima kingine.
- source_word: וִישַׁלְּחֵם
  choice: akiyaachilia
  rationale: Kiambishi cha yambwa kinarejelea maji. “Kuachilia” kinaonyesha kuyaacha yatiririke kwa uhuru na kinafaa zaidi hapa kuliko “kutuma,” bila kuifanya picha kuwa mafuriko kwa lazima.
- source_word: וְיַהַפְכוּ
  choice: huipindua
  rationale: הפך huonyesha kupindua au kugeuza kwa nguvu. “Huipindua” inadumisha picha ya uharibifu mkubwa bila kuibana maana kuwa tukio fulani mahsusi.
- source_word: אָרֶץ
  choice: dunia
  rationale: Neno linaweza kumaanisha dunia au nchi/ardhi. Katika kauli hii ya kishairi kuhusu uwezo mpana wa Mungu, “dunia” linafaa, huku uwezekano wa “nchi” au “ardhi” ukitajwa katika tanbihi.
theological_decisions:
- issue: Upeo wa אָרֶץ katika maelezo ya kishairi kuhusu mamlaka ya Mungu
  choice: dunia
  alternative: nchi au ardhi
  rationale: Muktadha unaonyesha uwezo mpana wa Mungu juu ya maji bila kulazimisha kurejelea simulizi maalumu la gharika. Hata hivyo, maana finyu ya nchi au ardhi inawezekana, kwa hiyo imedumishwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo sambamba wa masharti umehifadhiwa kwa “akizuia …; akiyaachilia …,” na sentensi imewekwa kwa ufupi kama ilivyo katika ushairi wa Kiebrania.
