  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: sw
  text: Hakika, ninyi ndio watu[a], na hekima itakufa pamoja nanyi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakika, ninyi ndio wale watu, na hekima itaangamia pamoja nanyi.” Kwa kawaida mstari huu hueleweka kuwa kejeli inayoelekezwa kwa marafiki wa Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: Hakika
  rationale: Kirai hiki kinatilia mkazo dai la Ayubu. “Hakika” ni cha asili katika Kiswahili na, kwa muktadha, kinahifadhi kejeli yake bila kuifafanua ndani ya mstari.
- source_word: אַתֶּם
  choice: ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kinawaelekea moja kwa moja rafiki za Ayubu; umbo huru “ninyi” linatoa mkazo uliopo katika Kiebrania.
- source_word: עָם
  choice: watu
  rationale: Neno hili kwa kawaida humaanisha watu au taifa. Katika kauli “ninyi ndio watu,” linatumika kwa kejeli kana kwamba wao peke yao ndio watu wenye maana au wawakilishi wa wanadamu wote.
- source_word: וְעִמָּכֶם
  choice: pamoja nanyi
  rationale: 'Huwasilisha wazi wazo la kuandamana: hekima ingekufa wakati wao watakapokufa.'
- source_word: תָּמוּת
  choice: itakufa
  rationale: Kitenzi cha moja kwa moja cha kufa kinakubaliana na “hekima” na kuhifadhi picha kali pamoja na kejeli ya Kiebrania.
- source_word: חָכְמָה
  choice: hekima
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dhana ya חָכְמָה, ambayo hapa inaelekezwa kwa hekima ambayo rafiki za Ayubu wanaonekana kujidai kuwa nayo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ninyi ndio watu” huhifadhi usemi mfupi na wenye maana mbili wa Kiebrania; alama ya mshangao husaidia kuonyesha ukali wa kejeli bila kuibadili kuwa maelezo ya wazi.
