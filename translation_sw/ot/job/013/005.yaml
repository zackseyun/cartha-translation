  text: Laiti mnyamaze kabisa; hilo lingekuwa hekima kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Laiti mkae kimya kabisa; hilo lingekuwa hekima kwenu.”
