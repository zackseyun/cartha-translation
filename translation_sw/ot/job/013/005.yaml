lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Laiti
  rationale: Nahau hii huonyesha tamanio au shauku, si swali la moja kwa moja. “Laiti” ni usemi wa kawaida na wenye hadhi unaohifadhi nguvu ya tamanio.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: mnyamaze kabisa
  rationale: Jina-kitenzi lisilo na kikomo pamoja na kitenzi chenye nafsi kutoka חרשׁ yanatilia tendo mkazo. “Mnyamaze kabisa” huonyesha ukimya kamili bila kuwa mzito katika Kiswahili.
- source_word: וּתְהִי
  choice: nayo hiyo ingekuwa
  rationale: Kitenzi cha kike katika umoja kinaelekea kurejelea kitendo au hali ya kunyamaza iliyotangulia. “Nayo hiyo ingekuwa” kinaacha uhusiano huo wazi na kubaki karibu na maana ya ‘ingekuwa’.
- source_word: לָכֶם
  choice: kwenu
  rationale: Kihusishi ל hapa huonyesha uhusiano au manufaa; “kwenu” ni usemi mfupi na wa asili katika sentensi hii.
- source_word: לְחָכְמָה
  choice: hekima
  rationale: חָכְמָה humaanisha “hekima.” Muundo “ingekuwa hekima kwenu” unahifadhi usemi wa chanzo bila kuufafanua kupita kiasi kuwa ‘ingehesabiwa kuwa’.
