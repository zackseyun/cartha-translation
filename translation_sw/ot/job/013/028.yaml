  yaml_path: translation/ot/job/013/028.yaml
  text: while he wastes away like something rotten[a], like a garment eaten by moths.
translation:
  language: sw
  text: Naye huchakaa kama kitu kilichooza,[a] kama vazi lililoliwa na nondo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye huoza kama uozo, kama vazi lililoliwa na nondo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Naye
  rationale: Kiunganishi pamoja na kiwakilishi hurejelea mhusika katika muktadha na kuendeleza taswira; “Naye” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: כְּרָקָב
  choice: kama kitu kilichooza
  rationale: רָקָב humaanisha uozo au kitu kilichooza. Usemi huu halisi unaifanya tashbihi ieleweke kwa Kiswahili bila kupoteza taswira.
- source_word: יִבְלֶה
  choice: huchakaa
  rationale: בלה huonyesha kuchakaa, kuharibika, au kudhoofika hatua kwa hatua. “Huchakaa” inafaa kwa taswira inayohusisha mwili na vazi.
- source_word: כְּבֶגֶד
  choice: kama vazi
  rationale: בֶּגֶד ni neno la jumla kwa vazi; “vazi” huhifadhi umoja na mtindo wa kishairi.
- source_word: אֲכָלוֹ
  choice: lililoliwa na
  rationale: Muundo huu huonyesha kwamba vazi limeathiriwa kwa kuliwa; kauli tendwa ni ya kawaida na wazi katika Kiswahili.
- source_word: עָשׁ
  choice: nondo
  rationale: עָשׁ ni mdudu anayeharibu nguo. “Nondo” ni neno sanifu la Kiswahili na umoja wake unalingana na Kiebrania.
