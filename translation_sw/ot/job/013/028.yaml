  verdict: approve
  source_fidelity: '“Naye huchakaa kama kitu kilichooza, kama vazi lililoliwa na nondo” faithfully represents the two parallel Hebrew images: the person wasting away in comparison with decay/rottenness and a garment consumed by a moth. The singular collective “nondo” appropriately follows the Hebrew singular עָשׁ; the passive perfect phrasing naturally conveys the moth-damaged-garment image.'
  naturalness: The translation is idiomatic, concise Standard East African Swahili with an appropriately dignified poetic register. “Huchakaa” naturally conveys progressive wearing away in this figurative context, and the parallel “kama …, kama …” is clear.
  terminology: “Vazi” is a good singular equivalent for בֶּגֶד, and “nondo” is the standard, readily understood term for a clothes moth. “Kitu kilichooza” communicates the concrete force of the comparison without introducing theological or interpretive content.
