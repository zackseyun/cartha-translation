  text: הַ֭/לְ/אֵל תְּדַבְּר֣וּ עַוְלָ֑ה וְ֝/ל֗/וֹ תְּֽדַבְּר֥וּ רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: sw
  text: Je, mtasema yasiyo haki kwa ajili ya Mungu[a], na udanganyifu kwa ajili yake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa niaba ya Mungu” au “kwa Mungu”; vivyo hivyo katika sehemu ya pili, “kwa niaba yake” au “kwake.” Kihusishi cha Kiebrania kinaweza kueleweka kwa njia zaidi ya moja, ingawa muktadha unapendelea maana ya kusema kwa kumtetea Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: kwa ajili ya Mungu
  rationale: Kihusishi ל־ hapa kinaweza kumaanisha ‘kwa’, ‘kwa niaba ya’, au ‘kwa Mungu’. Muktadha wa Ayubu 13:4, 8 unapendelea maana ya marafiki kusema wakimtetea Mungu; ‘kwa ajili ya Mungu’ ni ya asili na haipanui mno usemi wa Kiebrania.
- source_word: תְּדַבְּרוּ
  choice: Je, mtasema
  rationale: Kauli isiyokamilika katika swali hili la kukemea ina nguvu ya changamoto ya kimaadili. ‘Je, mtasema’ huiwasilisha kwa Kiswahili cha kawaida.
- source_word: עַוְלָה
  choice: yasiyo haki
  rationale: עַוְלָה humaanisha uovu, kutokuwa na haki, au jambo lisilo la haki. ‘Yasiyo haki’ huungana kwa kawaida na kitenzi ‘kusema’ na kuhifadhi uzito wa kimaadili bila kuyachanganya na ‘udanganyifu’ katika mshororo wa pili.
- source_word: וְלוֹ
  choice: kwa ajili yake
  rationale: Kiwakilishi kinamrejelea Mungu, na ל־ kinaendeleza wazo la kusema kwa kumtetea au kwa manufaa yake. Tafsiri hii inadumisha ulinganifu na ‘kwa ajili ya Mungu’.
- source_word: רְמִיָּה
  choice: udanganyifu
  rationale: רְמִיָּה ni udanganyifu, hila, au uongo wa kupotosha. ‘Udanganyifu’ huhifadhi umbo la nomino dhahania na ni pana kuliko ‘uongo’.
theological_decisions:
- issue: Ikiwa Ayubu anawashutumu rafiki zake kwa kusema wakimtetea Mungu au kwa kusema moja kwa moja na Mungu
  choice: Ayubu anawakemea kwa kusema yasiyo haki wakimtetea Mungu
  alternative: Ayubu anawakemea kwa kumwambia Mungu mambo yasiyo haki
  rationale: Muktadha wa karibu, hasa Ayubu 13:4 na 13:8, unawahusu rafiki zake kama watetezi wenye upendeleo kwa Mungu. Hata hivyo, kwa kuwa ל־ linaweza pia kuonyesha anayeelekezewa maneno, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la kukemea umehifadhiwa, pamoja na ulinganifu wa kishairi. Kitenzi ‘mtasema’ hakijarudiwa katika mshororo wa pili kwa kuwa Kiswahili kinaeleweka kwa urahisi bila marudio hayo.
