  text: Je, utalitisha[a] jani linalopeperushwa na upepo, na kuyafuatilia makapi[b] makavu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utaliogofya.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha hofu au woga mkubwa, na katika muktadha huu huenda pia kikadokeza kulitendea kwa ukali.
    reason: lexical_alternative
  - marker: b
