  text: See now[a], I have prepared my case; I know that I will be vindicated.
translation:
  language: sw
  text: Tazama sasa, nimeandaa shauri langu; najua kwamba mimi nitathibitishwa kuwa nina haki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitahesabiwa kuwa nina haki.” Kitenzi cha Kiebrania kina maana ya kimahakama na kinaweza kumaanisha kuthibitishwa au kuonyeshwa kuwa mtu ana haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tazama, sasa
  rationale: Muungano huu unavuta usikivu kwa msisitizo na hali ya mara moja. “Tazama, sasa” ni wa heshima na unaeleweka katika Kiswahili cha sasa.
- source_word: עָרַכְתִּי
  choice: nimeandaa
  rationale: Kitenzi kina maana ya kupanga au kuweka kwa utaratibu; katika muktadha wa kimahakama, “nimeandaa” huonyesha Ayubu ameweka hoja zake tayari.
- source_word: מִשְׁפָּט
  choice: hoja yangu
  rationale: Hapa neno lina maana ya shauri au hoja ya mtu katika mzozo wa kimahakama. “Hoja yangu” ni ya kawaida na inafaa kwa kitendo cha kuiandaa, huku umilikaji ukitokana na muktadha.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kauli timilifu ya Kiebrania inaonyesha uhakika uliothibitika; wakati wa sasa wa Kiswahili huwasilisha hali hiyo kwa kawaida.
- source_word: כִּי אֲנִי
  choice: kwamba
  rationale: כִּי inaanzisha maudhui ya kile Ayubu anachojua. Kiima cha nafsi ya kwanza kimekwishaonyeshwa katika “nitaonekana,” hivyo msisitizo wa אֲנִי unabaki katika dai lenyewe bila kuongeza maneno yasiyo ya lazima.
- source_word: אֶצְדָּק
  choice: nitaonekana kuwa nina haki
  rationale: Kitenzi צדק katika mazingira haya ya mahakama humaanisha kuonyeshwa au kutambuliwa kuwa upande wa haki. Tafsiri hii huhifadhi maana ya kimahakama bila kuingiza mapema maana maalumu ya kidogma inayoweza kuambatana na “kuhesabiwa haki.”
theological_decisions:
- issue: Maana ya kimahakama ya dai la Ayubu
  choice: nitaonekana kuwa nina haki
  alternative: nitahesabiwa haki
  rationale: Ayubu anaonyesha uhakika kwamba shauri lake litathibitisha kuwa yuko upande wa haki. Chaguo hili linadumisha taswira ya mahakama na huepuka kulifanya dai hili kuwa kauli iliyokuzwa kuhusu fundisho la kuhesabiwa haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya kimahakama imehifadhiwa kwa maneno yanayoeleweka kwa wasomaji wa kawaida.
