lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Sikilizeni kwa makini
  rationale: Muundo wa kitenzi pamoja na jina-kitenzi la mzizi huongeza msisitizo wa amri. Kiswahili cha kawaida huwasilisha nguvu hiyo kwa njia ya asili kwa kusema “kwa makini.”
- source_word: מִלָּתִי
  choice: neno langu
  rationale: Umoja wa Kiebrania umehifadhiwa. “Neno langu” ni usemi mfupi na wenye uzito unaofaa ombi hili la Ayubu, ingawa “maneno yangu” lingeweza kusikika kwa urahisi zaidi katika Kiswahili.
- source_word: וַאֲחֲוָתִי
  choice: maelezo yangu
  rationale: Nomino hii inaweza kumaanisha jambo linalotamkwa, kuelezwa, au kuwekwa wazi. “Maelezo yangu” ni ya asili katika Kiswahili na haifungi maana kwenye tamko rasmi pekee.
- source_word: בְּאָזְנֵיכֶם
  choice: yaingie masikioni mwenu
  rationale: Usemi huu unahifadhi taswira halisi ya Kiebrania ya jambo kuwa masikioni mwa wasikilizaji, huku kitenzi “yaingie” kikifanya sentensi iwe ya kawaida na inayoeleweka katika Kiswahili.
