translation:
  language: sw
  text: Maovu yangu na dhambi zangu ni ngapi?[a] Nijulishe uasi wangu na dhambi yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maovu yangu na dhambi zangu ni makubwa kiasi gani?” Neno la swali la Kiebrania linaweza kuelekea idadi au kiwango, ingawa maandishi makuu yanahifadhi maana ya moja kwa moja ya idadi.
    reason: lexical_alternative
  - marker: b
    text: “Uasi” hutafsiri פֶּשַׁע, ambalo pia linaweza kumaanisha “uvunjaji” au “kuasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: ni nyingi kiasi gani
  rationale: Kirai hiki kinauliza idadi au kiwango. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi swali la moja kwa moja kuhusu wingi wa nomino zinazofuata.
- source_word: עֲוֺנוֹת
  choice: maovu
  rationale: Neno hili hubeba uzito wa kosa la kimaadili au uovu. “Maovu” ni la asili na lenye kueleweka katika Kiswahili, huku likitofautishwa na “dhambi” inayofuata.
- source_word: וְחַטָּאוֹת
  choice: na dhambi
  rationale: “Dhambi” ni tafsiri ya moja kwa moja na ya kawaida ya חַטָּאת katika wingi; katika Kiswahili umbo la nomino hubaki lilelile, huku wingi ukionyeshwa na muktadha na kivumishi.
- source_word: פִּשְׁעִי
  choice: uasi wangu
  rationale: פֶּשַׁע huashiria kosa la kuvuka mipaka, mara nyingi likiwa na wazo la uasi wa makusudi. “Uasi wangu” huhifadhi uzito huo vizuri kuliko “kosa langu.”
- source_word: וְחַטָּאתִי
  choice: na dhambi yangu
  rationale: Tafsiri hii huhifadhi umoja wa neno la Kiebrania na uwiano wake na “uasi wangu.”
- source_word: הֹדִיעֵנִי
  choice: Nijulishe
  rationale: Hifili ya ידע ina maana ya kusababisha mtu ajue au kumjulisha. “Nijulishe” ni fupi, ya asili, na huhifadhi maana hiyo ya kisababishi.
