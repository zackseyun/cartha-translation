  yaml_path: translation/ot/job/013/003.yaml
  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: sw
  text: Lakini mimi nitasema na Mwenyezi, nami natamani kujadiliana[a] na Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kubishana na Mungu,” au, “kuwasilisha shauri langu mbele za Mungu.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kimahakama ya kutoa hoja, kuthibitisha, au kubishana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Lakini
  rationale: Inaonyesha utofauti mkubwa na maneno yaliyotangulia kuhusu rafiki za Ayubu; ni kiunganishi cha kawaida na chenye nguvu ya kupinga katika Kiswahili.
- source_word: אֲנִי
  choice: mimi
  rationale: Kiwakilishi kilichotajwa wazi katika Kiebrania kinakazia kwamba Ayubu mwenyewe anataka kumwelekea Mungu; kukihifadhi kunadumisha mkazo huo.
- source_word: אֶל שַׁדַּי אֲדַבֵּר
  choice: nataka kusema na Mwenyezi
  rationale: Kauli ya wakati usiotimilika inaonyesha nia au azimio. ‘Kusema na’ ni Kiswahili cha kawaida kwa mazungumzo yanayoelekezwa kwa mtu, na ‘Mwenyezi’ hutafsiri cheo שַׁדַּי bila kukifanya jina la kutoholewa.
- source_word: וְהוֹכֵחַ
  choice: kujadiliana
  rationale: Hifili ya יכח hapa ina maana ya kimahakama au ya hoja—kubishana, kuthibitisha, au kuwasilisha shauri. ‘Kujadiliana’ huhifadhi wazo la hoja bila kudokeza tu ugomvi mkali.
- source_word: אֶל אֵל
  choice: na Mungu
  rationale: Katika Kiswahili, ‘kujadiliana na Mungu’ ni muundo wa kawaida. אֵל hapa inamtaja Mungu, huku ikitofautishwa kimtindo na שַׁדַּי katika mstari wa kwanza.
- source_word: אֶחְפָּץ
  choice: natamani
  rationale: Huonyesha hiari na hamu kubwa; ‘natamani’ inafaa sauti nzito ya Ayubu na ni ya kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Kutafsiri majina ya cheo שַׁדַּי na אֵל
  choice: Mwenyezi ... Mungu
  alternative: Shadai ... Mungu; Mwenyezi ... Mwenye Nguvu
  rationale: Kiebrania kimetumia majina mawili tofauti ya Mungu katika mistari inayolingana. Kuyatafsiri kwa ‘Mwenyezi’ na ‘Mungu’ huhifadhi maana na utofauti wa kimtindo bila kuyaunganisha au kuongeza dai la kiteolojia.
- issue: Nguvu ya kimahakama ya וְהוֹכֵחַ
  choice: kujadiliana na Mungu, huku maana mbadala ikielezwa katika tanbihi
  alternative: kubishana na Mungu; kuwasilisha shauri langu mbele za Mungu
  rationale: Kitenzi kinaweza kuonyesha kubishana kwa hoja, kuthibitisha, au kuwasilisha shauri. Tafsiri kuu ya kawaida haifungi maana kwenye taswira moja tu ya mahakama, na tanbihi huhifadhi upana wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mimi’ huhifadhi mkazo wa kiwakilishi cha Kiebrania; ‘nataka ... natamani’ huonyesha nia na hamu badala ya wakati ujao tu. Alama ya tanbihi imewekwa moja kwa moja baada ya sentensi inayohusika.
