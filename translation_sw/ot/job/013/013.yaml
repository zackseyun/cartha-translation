lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: Nyamazeni
  rationale: Kauli ya kuamuru kwa wingi ya mzizi חרשׁ hapa inadai wasikilizaji waache kusema; “Nyamazeni” ni ya moja kwa moja, ya kawaida, na ina nguvu ya amri.
- source_word: מִמֶּנִּי
  choice: mbele yangu
  rationale: Kihalisi ni “kutoka kwangu,” lakini pamoja na הַחֲרִישׁוּ inaonyesha kunyamaza kwa habari ya Jobu au katika uwepo wake. “Mbele yangu” huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: וַאֲדַבְּרָה
  choice: nami niseme
  rationale: Umbo la cohortative la nafsi ya kwanza huonyesha nia au ombi la kupewa nafasi ya kusema. “Nami niseme” huhifadhi msisitizo wa אָנִי na kusikika kwa kawaida.
- source_word: אָנִי
  choice: nami
  rationale: Kiwakilishi huru kinakazia kwamba Jobu mwenyewe ndiye atakayesema; “nami” kinabeba msisitizo huo kwa ufupi.
- source_word: וְיַעֲבֹר
  choice: na linipate
  rationale: עבר pamoja na עַל inaweza kueleza jambo linalompitia au kumjia mtu. Katika Kiswahili, “linipate” huonyesha kwa kawaida jambo lolote linaloweza kumjia Jobu, huku “na” ikihifadhi nguvu ya kuruhusu au kukubali.
- source_word: עָלַי
  choice: -nipate
  rationale: Kiambishi “-ni-” kinaonyesha kwamba jambo hilo linamjia Jobu, sawa na nguvu ya עָלַי katika muktadha.
- source_word: מָה
  choice: lolote liwezalo
  rationale: מָה hapa ni isiyobainishwa, yaani “chochote kitakachoweza kuwa.” “Lolote liwezalo” huhifadhi kutokujulikana kwa jambo na hali ya Jobu ya kukubali matokeo.
