  text: Je, mtamwonyesha upendeleo?[a] Je, mtabishana kwa ajili ya Mungu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “Je, mtainua uso wake?” Hii ni nahau ya Kiebrania yenye maana ya kumwonyesha mtu upendeleo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Je, mtamtetea Mungu?”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: mtampendelea yeye
  rationale: Nahau hiyo ya Kiebrania, ambayo kwa maana halisi ni ‘kuinua uso wake,’ hapa ina maana ya kumwonyesha mtu upendeleo. ‘Mtampendelea yeye’ ni Kiswahili cha kawaida na hudumisha msisitizo wa kiambishi cha nafsi ya tatu.
- source_word: אִם
  choice: Je
  rationale: Hapa neno hili linaanzisha swali la pili la balagha linalolingana na la kwanza. Katika Kiswahili, ‘Je’ na alama ya swali huwasilisha nguvu hiyo ya kiulizi kwa ufasaha kuliko tafsiri ya neno kwa neno.
- source_word: לָאֵל
  choice: Mungu
  rationale: אֵל hapa humrejelea Mungu, na kihusishi ל־ kinaonyesha kwamba mabishano hayo yanafanywa kwa ajili yake au kwa niaba yake.
- source_word: תְּרִיבוּן
  choice: mtamtetea
  rationale: Kitenzi ריב kinaweza kumaanisha kushindana, kubishana, au kutetea hoja katika muktadha wa mgogoro wa kisheria. ‘Mtamtetea’ ni cha asili katika Kiswahili na kinaonyesha utetezi kwa niaba ya Mungu bila kuufunga muktadha kwenye utaratibu maalumu wa mahakama.
theological_decisions:
- issue: Iwapo Ayubu anawashutumu rafiki zake kwa kumtetea Mungu kwa upendeleo
  choice: Mstari umetafsiriwa kama maswali mawili ya balagha yanayowashutumu kwa upendeleo na kwa kumtetea Mungu.
  alternative: Kishazi cha pili kinaweza kutafsiriwa ‘Je, mtabishana kwa ajili ya Mungu?’
  rationale: Muktadha unaonyesha kwamba Ayubu anakosoa utetezi wao wenye upendeleo. Hata hivyo, maana pana ya ריב imehifadhiwa katika tanbihi ili kutoficha uwezekano wa ‘kubishana’ au ‘kushindana kwa hoja.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Mtampendelea yeye’ hudumisha msisitizo wa Kiebrania, huku ‘mtamtetea Mungu’ ikitoa kwa ufasaha taswira ya utetezi katika mabishano.
