  source_fidelity: Nusu ya kwanza, “Semi zenu ni methali za majivu,” huwasilisha kwa ufasaha maana ya kimuktadha ya זִכְרֹנֵיכֶם na hudumisha taswira ya מִשְׁלֵי אֵפֶר. Hata hivyo, “ngome zenu” kwa גַּבֵּיכֶם huelekeza mstari kwa tafsiri ya kimuktadha ya Kiingereza (“defenses”) kuliko maana ya msingi ya Kiebrania, “migongo.” Kwa kuwa kifungu cha mwisho ni kigumu na kinabishaniwa, tafsiri kuu inapaswa kuhifadhi maana hiyo ya msingi, huku tanbihi ikitaja usomaji wa kimuktadha wa ulinzi/ngome.
