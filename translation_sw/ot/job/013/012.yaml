  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: sw
  text: Semi zenu ni methali za majivu[a]; migongo yenu ni migongo ya udongo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kumbukumbu zenu ni methali za majivu; ngome zenu ni ngome za udongo.” Kiebrania ni kifupi, na kifungu cha mwisho ni kigumu. Neno lililotafsiriwa “migongo” kwa kawaida humaanisha migongo, lakini wengine hulielewa katika muktadha huu kuwa ulinzi au ngome.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: semi zenu
  rationale: Nomino inayotokana na זכר kwa kawaida huhusu kukumbuka au kumbukumbu, lakini hapa inaelekea kumaanisha kauli zinazowasilishwa kuwa za kukumbukwa na zenye mamlaka. “Semi zenu” ni Kiswahili cha kawaida kinachofaa muktadha wa hekima bila kuficha uwezekano wa maana halisi, ambao umewekwa katika tanbihi.
- source_word: מִשְׁלֵי
  choice: methali za
  rationale: מָשָׁל inaweza kumaanisha methali, msemo au ulinganisho. “Methali za” inadumisha muundo wa nomino na ladha ya fasihi ya hekima badala ya kuufanya ulinganisho wa moja kwa moja.
- source_word: אֵפֶר
  choice: majivu
  rationale: Maana ya kawaida ya אֵפֶר ni majivu; picha hiyo inadokeza ubatili na udhaifu wa kauli za marafiki wa Ayubu.
- source_word: לְגַבֵּי
  choice: ni
  rationale: Katika mstari huu wa kishairi uliobanwa, kifungu hiki kinafanya kazi ya uhusiano wa kiarifu au ulinganisho. Kiswahili kinahitaji kiunganishi “ni” ili sentensi ieleweke kwa kawaida.
- source_word: חֹמֶר
  choice: udongo
  rationale: חֹמֶר humaanisha udongo wa kufinyanga, tope au nyenzo kama chokaa. “Udongo” ni neno pana na la kawaida linalohifadhi picha ya kitu dhaifu cha ardhini.
- source_word: גַּבֵּיכֶם
  choice: ngome zenu
  rationale: 'Ingawa גַּב kimsingi inaweza kumaanisha mgongo au sehemu iliyoinuka, katika muktadha huu inaweza kueleweka kama kinga au boma. “Ngome zenu” huwasilisha picha ya ulinzi dhaifu na pia huruhusu urudiaji wa kishairi: “ngome zenu ni ngome za udongo.”'
