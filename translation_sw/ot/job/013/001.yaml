  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
translation:
  language: sw
  text: Tazama, jicho langu limeona haya yote; sikio langu limesikia na kuyaelewa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kuyatambua” au “na kuyafikiri kwa makini.” Kihalisi, Kiebrania huendelea, “nalo likafahamu kwa ajili yake lenyewe”; huu ni usemi wa kinahau unaoonyesha kuwa yaliyosikiwa yalieleweka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu na kusisitiza dai linalofuata; “Tazama” ni la kawaida, lenye hadhi, na linahifadhi nguvu ya Kiebrania.
- source_word: כֹּל
  choice: haya yote
  rationale: Ingawa neno hilo kihalisi ni “yote,” muktadha unaelekeza kwa mambo yote yaliyokuwa yakizungumziwa; “haya yote” ni Kiswahili cha asili bila kufafanua kupita kiasi.
- source_word: רָאֲתָה עֵינִי
  choice: jicho langu limeyaona
  rationale: Muundo wa Kiebrania una jicho katika umoja kama kiima. Umehifadhiwa ili kudumisha taswira na ulinganifu wa kishairi.
- source_word: שָׁמְעָה אָזְנִי
  choice: sikio langu limesikia
  rationale: Umoja wa kiungo cha mwili umehifadhiwa kulingana na Kiebrania na sambamba na “jicho langu.”
- source_word: וַתָּבֶן לָהּ
  choice: na kuyaelewa
  rationale: Kitenzi מן בין kina maana ya kuelewa au kutambua. Kiima cha kike katika umoja kinaendelea kwa kawaida na “sikio langu”; kiambishi “-ya-” kinarejelea mambo yaliyosikiwa. Tafsiri hii inatoa maana ya nahau bila Kiswahili kisicho cha kawaida cha “kujielewea.”
