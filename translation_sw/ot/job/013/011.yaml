lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... haita-?
  rationale: Huanzisha swali la balagha linalotarajia jibu la ndiyo; muundo wa ‘Je ... haita-?’ unahifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: שְׂאֵתוֹ
  choice: adhama yake
  rationale: Nomino hii inaweza kumaanisha kuinuliwa, hadhi kuu, au ukuu. ‘Adhama yake’ inaeleza hadhi kuu ya Mungu kwa lugha ya heshima na inaendana na wazo la kuwatisha.
- source_word: תְּבַעֵת
  choice: haitawatisha
  rationale: Kitenzi בעת katika Piel humaanisha kusababisha hofu kali. ‘Kuwatisha’ ni cha asili katika Kiswahili na kinabeba nguvu ya kauli ya Kiebrania.
- source_word: אֶתְכֶם
  choice: -wa-
  rationale: Kiambishi hiki kinaonyesha yambwa wa nafsi ya pili wingi, yaani ‘ninyi.’
- source_word: וּפַחְדּוֹ
  choice: na hofu yake
  rationale: Muundo wa umilikaji umehifadhiwa bila kuamua kimyakimya ikiwa ni hofu anayoisababisha au hofu ya kumwelekea yeye.
- source_word: יִפֹּל עֲלֵיכֶם
  choice: haitawaangukia
  rationale: Huhifadhi taswira ya Kiebrania ya hofu kushuka na kumlemea mtu; pia ni muundo unaoeleweka kwa Kiswahili.
