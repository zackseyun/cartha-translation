  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: sw
  text: Basi, niite, nami nitakujibu; au niseme, nawe unijibu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְרָא
  choice: Basi, niite
  rationale: Kitenzi cha amri katika nafsi ya pili umoja kinaanzisha njia ya kwanza ya mazungumzo. “Basi” linawasilisha kwa Kiswahili cha kawaida mwendelezo wa hoja unaoonyeshwa na kiunganishi וּ.
- source_word: וְאָנֹכִי
  choice: nami
  rationale: Kiwakilishi huru אָנֹכִי kina msisitizo; “nami” linaonyesha wazi kuwa Ayubu, kwa upande wake, ndiye atakayejibu bila kufanya sentensi kuwa nzito.
- source_word: אֶעֱנֶה
  choice: nitakujibu
  rationale: Kauli ya Qal katika nafsi ya kwanza umoja hapa inaeleza jibu la Ayubu iwapo Mungu atamwita. Kiambishi “-ku-” kinaweka wazi yule anayeambiwa jibu, jambo linaloeleweka kutokana na muktadha.
- source_word: אוֹ
  choice: au
  rationale: Kiunganishi hiki kinatambulisha mpangilio mwingine wa kusema na kujibu.
- source_word: אֲדַבֵּר
  choice: niseme
  rationale: 'Ingawa umbo ni la wakati usiotimilika katika Piel, katika muundo huu lina nguvu ya pendekezo au ombi: Ayubu apewe nafasi ya kusema.'
- source_word: וַהֲשִׁיבֵנִי
  choice: nawe unijibu
  rationale: Amri ya Hiphil yenye kiambishi cha nafsi ya kwanza ina maana ya kumjibu Ayubu. “Nawe unijibu” ni ya asili katika Kiswahili na inadumisha ubadilishanaji wa pande mbili.
