  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi wa pande mbili unahifadhi sauti ya Ayubu ya kumwomba Mungu wachague nani aanze kusema na nani ajibu.
