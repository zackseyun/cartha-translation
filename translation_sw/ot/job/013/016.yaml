  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: sw
  text: Hili pia litakuwa wokovu wangu[a], kwa maana mtu asiyemcha Mungu hawezi kuja mbele yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukombozi” au “kutetewa.”
    reason: lexical_alternative
  - marker: b
    text: “Mtu asiyemcha Mungu” pia anaweza kutafsiriwa “mnafiki” au “mtu asiye na uchaji wa Mungu.” Neno la Kiebrania humaanisha mtu asiye na uchaji au heshima kwa Mungu, si mnafiki tu kwa maana ya mtu asiye mkweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Hili pia
  rationale: Kiunganishi גַּם kinaonyesha nyongeza au mkazo, huku הוּא hapa ikirejelea jambo au hali iliyotangulia; “Hili pia” ni ya asili katika Kiswahili.
- source_word: לִי לִישׁוּעָה
  choice: litakuwa wokovu wangu
  rationale: Muundo unaonyesha kwamba jambo hilo litakuwa wokovu au ukombozi kwa Ayubu. “Wokovu wangu” huhifadhi uzito wa neno huku tanbihi ikionyesha maana pana ya ukombozi au kuthibitishwa kuwa hana hatia.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu inayounga mkono kauli iliyotangulia.
- source_word: חָנֵף
  choice: mtu asiyemcha Mungu
  rationale: Neno hili humaanisha mtu asiye na uchaji au anayekosa heshima kwa Mungu, si mnafiki tu kwa maana ya mtu asiye mkweli.
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Ni nahau ya kuwa au kufika katika uwepo wake; kiwakilishi kinamrejelea Mungu katika muktadha.
- source_word: יָבוֹא
  choice: hawezi kuja
  rationale: Pamoja na לֹא, hapa linaeleza kutokubalika au kutowezekana kwa mtu huyo kufika mbele za Mungu; “hawezi kuja” ni wazi na ya kawaida.
theological_decisions:
- issue: Anayerejelewa na kiwakilishi katika לְפָנָיו
  choice: Mungu, bila kuongeza jina lake katika mstari
  alternative: Mtu mwingine ambaye Ayubu angefika mbele yake
  rationale: Muktadha wa Ayubu kujitetea mbele za Mungu unaunga mkono rejeo la Mungu. Kuweka “mbele zake” huhifadhi kiwakilishi cha Kiebrania bila kufafanua kupita maandishi.
- issue: Maana ya יְשׁוּעָה katika dai la Ayubu
  choice: wokovu, likijumuisha wazo la ukombozi au kuthibitishwa kuwa hana hatia
  alternative: ukombozi; kutetewa au kuthibitishwa kuwa hana hatia
  rationale: “Wokovu” huhifadhi neno pana na lenye uzito, lakini muktadha wa kesi ya Ayubu unaruhusu maana ya kuokolewa na pia kutetewa. Tanbihi huhifadhi upana huo bila kuamua maana moja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio umehifadhi uhusiano wa sababu katika sentensi na pia utata halisi wa “wokovu” kama ukombozi au uthibitisho wa kutokuwa na hatia.
