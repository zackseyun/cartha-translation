  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: sw
  text: Kwa maana unaandika mambo machungu dhidi yangu[a], na unanifanya nirithi maovu ya ujana wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unatoa hukumu zenye uchungu dhidi yangu.” Kiebrania kinasema kihalisi, “unaandika mambo machungu dhidi yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “unanifanya nibebe hatia ya maovu ya ujana wangu,” au “adhabu kwa ajili ya maovu ya ujana wangu.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, au matokeo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya maneno ya Ayubu na kinaendeleza hoja yake kwa njia ya kawaida katika Kiswahili.
- source_word: תִכְתֹּב עָלַי
  choice: unaandika ... dhidi yangu
  rationale: Kitenzi כתב maana yake ya msingi ni ‘andika,’ huku עָלַי hapa ikionyesha tendo linalomwelekea Ayubu kwa uhasama. Tafsiri hii inadumisha taswira ya kuandika bila kuifanya moja kwa moja kuwa ‘kutoa hukumu.’
- source_word: מְרֹרוֹת
  choice: mambo machungu
  rationale: Nomino ya wingi inaashiria mambo yenye uchungu. ‘Mambo machungu’ huacha wazi kama ni mashtaka, hukumu, au mateso.
- source_word: וְתוֹרִישֵׁנִי
  choice: na unanifanya niyarithi
  rationale: Hifili ya ירשׁ ina maana ya kusababisha mtu arithi au amiliki. Muundo huu wa Kiswahili ni wa kawaida na unadumisha maana hiyo ya kisababishi.
- source_word: עֲוֺנוֹת
  choice: maovu
  rationale: עָוֹן inaweza kumaanisha matendo maovu, hatia yake, au adhabu inayotokana nayo. ‘Maovu’ hudumisha rejeo la msingi kwa makosa ya kimaadili bila kufuta maana zinazohusiana za hatia na matokeo.
- source_word: נְעוּרָי
  choice: ya ujana wangu
  rationale: Huu ni muundo wa umilikaji unaomaanisha mambo yanayohusiana na kipindi cha ujana wa Ayubu.
theological_decisions:
- issue: Maana ya עֲוֺנוֹת katika muktadha
  choice: maovu ya ujana wa Ayubu, huku mzigo wa hatia au matokeo yake ukidokezwa
  alternative: hatia ya ujana wangu; adhabu kwa ajili ya maovu ya ujana wangu
  rationale: Neno la Kiebrania linaweza kutaja uovu, hatia, au adhabu yake. Mstari haulazimishi kuchagua maana moja tu, kwa hiyo matini kuu inadumisha upana huo na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Taswira za ‘kuandika’ na ‘kurithi’ zimedumishwa, huku tanbihi zikihifadhi utata wa kimsamiati.
