  text: Who is it that will contend with me? For then I would be silent and die[a].
translation:
  language: sw
  text: Ni nani atakayeshindana nami? Kwa maana basi ningekaa kimya na kufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana sasa ningekaa kimya na kufa.” Neno la Kiebrania mara nyingi humaanisha “sasa,” lakini hapa wengi hulielewa kuwa “basi” katika mtiririko wa hoja ya Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: Ni nani
  rationale: Muundo huu wa Kiswahili unaonyesha swali la mkazo kwa kawaida bila tafsiri ngumu ya kiwakilishi cha Kiebrania.
- source_word: יָרִיב
  choice: atakayeshindana
  rationale: Kitenzi hiki huhifadhi wazo la kupingana au kuingia katika shauri, bila kulazimisha mazingira rasmi ya mahakama.
- source_word: עִמָּדִי
  choice: nami
  rationale: Hii ni tafsiri ya kawaida ya ‘pamoja nami’; hali ya uadui tayari inaonyeshwa na ‘kushindana.’
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi kinaanzisha sababu au matokeo yanayounga mkono changamoto ya Ayubu.
- source_word: עַתָּה
  choice: hapo
  rationale: Katika hoja hii, neno linaeleweka kwa kawaida kuwa na maana ya kimatokeo, ‘hapo/basi,’ ingawa maana yake ya kawaida ni ‘sasa’; utata huo umehifadhiwa katika tanbihi.
- source_word: אַחֲרִישׁ
  choice: ningekaa kimya
  rationale: Kauli ya masharti inaendana na changamoto iliyotangulia na inatoa Kiswahili cha asili kwa maana ya kunyamaza.
- source_word: וְאֶגְוָע
  choice: na kufa
  rationale: Tafsiri hii ni wazi na yenye nguvu, ikihifadhi maana ya kuaga dunia bila kutumia lugha isiyo ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kushindana nami’ huhifadhi mwelekeo wa kisheria au wa mabishano bila kuwa lugha ya kitaalamu kupita kiasi; ‘hapo’ huonyesha matokeo ya changamoto iliyotangulia huku tanbihi ikihifadhi uwezekano wa ‘sasa.’
