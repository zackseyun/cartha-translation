translation:
  language: sw
  text: Tafadhali sikieni hoja yangu[a], na sikilizeni madai ya midomo yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karipio langu” au “uthibitisho wangu”; neno la Kiebrania linaweza kumaanisha usahihishaji, karipio, au hoja yenye uthibitisho.
    reason: lexical_alternative
  - marker: b
    text: Au, “mabishano ya midomo yangu”; usemi wa Kiebrania unaweza kuwa na maana ya mabishano ya maneno au madai yanayotolewa katika shauri.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Tafadhali sikieni
  rationale: Kitenzi ni amri ya wingi inayowataka wasikilizaji watoe usikivu, huku נָא ikipunguza ukali wa amri kwa ombi la heshima; “Tafadhali sikieni” ni Kiswahili cha sasa na cha kawaida.
- source_word: תוֹכַחְתִּי
  choice: hoja yangu
  rationale: Nomino hii inaweza kumaanisha karipio, usahihishaji, hoja, au utetezi wa jambo. Katika muktadha huu wa mabishano wenye mwelekeo wa kimahakama, “hoja yangu” huonyesha jambo analoliwasilisha Ayubu bila kulifupisha kuwa karipio pekee.
- source_word: וְרִבוֹת
  choice: na madai
  rationale: Neno hili linaweza kutaja mabishano, mashindano ya maneno, au madai katika shauri. “Madai” yanahifadhi mwelekeo wa kimahakama huku yakibaki yanaeleweka katika Kiswahili cha kawaida.
- source_word: שְׂפָתַי
  choice: ya midomo yangu
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya “midomo yangu,” badala ya kuibadilisha tu kuwa “maneno yangu.”
- source_word: הַקְשִׁיבוּ
  choice: msikilize
  rationale: Amri hii ya wingi inamaanisha kusikiliza kwa makini. “Msikilize” ni ya asili katika Kiswahili na inadumisha ulinganifu wa kishairi na “sikieni” katika sehemu ya kwanza.
