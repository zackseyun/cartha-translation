  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: sw
  text: Kwa nini unauficha uso wako na kunihesabu kuwa adui yako?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kunichukulia kama adui yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Kwa nini
  rationale: Hili ni swali la moja kwa moja linalotaka sababu; “Kwa nini” ni Kiswahili cha kawaida na cha asili.
- source_word: פָנֶיךָ
  choice: uso wako
  rationale: Tafsiri halisi inadumisha taswira ya Kiebrania, ambayo inaweza pia kuashiria uwepo au fadhili za Mungu.
- source_word: תַסְתִּיר
  choice: unauficha
  rationale: Kitenzi סתר katika Hifili kina maana ya kuficha; umbo hili linaungana kwa kawaida na “uso wako.”
- source_word: וְתַחְשְׁבֵנִי
  choice: na kunihesabu
  rationale: חשב hapa ni kumhesabu au kumchukulia mtu kuwa kitu fulani; “kunihesabu” inadumisha nguvu ya kimahesabu ya kitenzi na muundo wa kiarifu.
- source_word: לְאוֹיֵב
  choice: kuwa adui
  rationale: Herufi לְ inaweka “adui” kama hali au nafasi ambayo Ayubu anahesabiwa kuwa nayo.
- source_word: לָךְ
  choice: yako
  rationale: Ingawa kimuundo ni “kwako,” katika tungo hii uhusiano huo unaelezwa kwa Kiswahili cha asili kama “adui yako.”
theological_decisions:
- issue: Lugha ya kibinadamu kumhusu Mungu katika kauli “unauficha uso wako”
  choice: Kudumisha taswira halisi “unauficha uso wako” katika matini kuu.
  alternative: Kuondoa uwepo wako / kunikataa
  rationale: Kiebrania kinatumia taswira halisi ya uso wa Mungu, ambayo katika Biblia mara nyingi huonyesha uwepo au fadhili zake. Kuitunza huepuka kuifafanua kupita kiasi na huhifadhi uzito wa kishairi na kitheolojia.
- issue: Maana ya חשב katika kumweka Ayubu katika nafasi ya adui
  choice: kunihesabu kuwa adui yako
  alternative: kunichukulia kuwa adui yako
  rationale: “Kunihesabu kuwa” hudumisha kwa karibu maana ya kufikiri, kuhesabu, au kumweka mtu katika kundi fulani, bila kuamua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya “uso” imehifadhiwa, na “adui yako” limetumiwa badala ya “adui kwako” kwa ufasaha wa kawaida; tanbihi inadumisha muundo mbadala ulio karibu zaidi na לָךְ.
