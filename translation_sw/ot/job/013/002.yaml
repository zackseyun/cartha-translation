  yaml_path: translation/ot/job/013/002.yaml
  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: sw
  text: Mnachojua, mimi pia ninajua; mimi si duni kuliko ninyi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: mnachojua
  rationale: Muundo huu unalinganisha ujuzi wa Ayubu na wa rafiki zake. “Mnachojua” ni Kiswahili cha kawaida kinachoendana vizuri na “mimi pia ninajua.”
- source_word: יָדַעְתִּי
  choice: ninajua
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umbo timilifu, hapa kinaeleza hali ya sasa ya kuwa na ujuzi; kwa hiyo “ninajua” huwasilisha maana hiyo kiasili.
- source_word: גַם אָנִי
  choice: mimi pia
  rationale: Kauli hii inasisitiza kwamba Ayubu naye ana ujuzi uleule. “Mimi pia” huhifadhi msisitizo huo kwa Kiswahili cha sasa.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: mimi si duni kuliko ninyi
  rationale: Kishiriki נֹפֵל pamoja na מן kinaonyesha kutokuwa chini au kupungukiwa kwa kulinganisha. Katika muktadha huu Ayubu anakataa kwamba ujuzi wake ni mdogo kuliko wa rafiki zake; “si duni kuliko ninyi” huhifadhi ulinganisho bila kufafanua kupita kiasi.
- source_word: אָנֹכִי
  choice: mimi
  rationale: Kiwakilishi huru kinasisitiza nafsi ya Ayubu; kurudia “mimi” katika kishazi cha pili kunahifadhi msisitizo huo.
