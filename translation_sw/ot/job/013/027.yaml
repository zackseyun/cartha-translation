  yaml_path: translation/ot/job/013/027.yaml
  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: sw
  text: Unaweka miguu yangu katika mkatale, na unayaangalia mapito yangu yote; unatia alama kuzunguka nyayo za miguu yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unachora alama kuzunguka nyayo za miguu yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchora au kutia alama, na huenda kikadokeza pia kuweka mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסַּד
  choice: katika mkatale
  rationale: סַד ni kifaa cha kuzuia miguu; “mkatale” ni neno la Kiswahili linalofaa kwa kifaa cha kufungia miguu katika picha hii ya kifungo.
- source_word: וְתָשֵׂם
  choice: unaiweka
  rationale: שׂים humaanisha kuweka; umbo hili la kawaida linaeleza kuingizwa kwa miguu katika kifaa cha kuizuia.
- source_word: וְתִשְׁמוֹר
  choice: kuyachunguza
  rationale: שׁמר hapa inaonyesha uangalizi mkali wa mienendo ya Ayubu, si ulinzi wenye fadhili.
- source_word: כָּל אָרְחוֹתַי
  choice: mapito yangu yote
  rationale: אֹרַח ni njia au pito; “mapito” huhifadhi picha halisi ya njia huku ikiruhusu maana pana ya mwenendo.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: kuzunguka nyayo za miguu yangu
  rationale: Ingawa שֹׁרֶשׁ kwa kawaida ni “mzizi,” katika usemi huu inaelekea kutaja sehemu ya chini au msingi wa mguu; “nyayo” hutoa maana hiyo kwa uwazi.
- source_word: תִּתְחַקֶּה
  choice: unaweka alama kuzunguka
  rationale: Hitpael ya חקה inaweza kumaanisha kuchora, kuandika alama, au kuweka mpaka; tafsiri hii huhifadhi taswira ya kuweka alama au mpaka bila kuifafanua kupita kiasi.
