lexical_decisions:
- source_word: כַּפְּךָ
  choice: mkono wako
  rationale: כַּף kwa msingi ni kiganja au mkono; hapa “mkono” huhifadhi taswira halisi ya tendo au shinikizo la Mungu kwa Kiswahili cha kawaida.
- source_word: מֵעָלַי הַרְחַק
  choice: Uuondoe ... juu yangu
  rationale: Hifili ya רחק ina maana ya kuweka mbali au kuondoa, na מֵעָלַי inaonyesha kuondolewa kutoka juu ya Ayubu. Muundo huu huhifadhi picha ya mkono uliokuwa ukimlemea huku ukisomeka kwa kawaida.
- source_word: אֵמָתְךָ
  choice: kitisho chako
  rationale: אֵימָה humaanisha hofu kuu, kitisho, au jambo linalotia hofu. “Kitisho chako” huhifadhi uwezekano kwamba kinachomaanishwa ni hali au athari ya kutisha inayotokana na Mungu, si hisia ya Ayubu pekee.
- source_word: אַל תְּבַעֲתַנִּי
  choice: wala ... kisinitishe
  rationale: אַל pamoja na kitenzi hiki hutoa katazo; בעת humaanisha kutisha, kushtua, au kufadhaisha. “Kisinitishe” ni wazi na huhifadhi ulinganifu wa kisarufi kati ya kitisho na tendo lake.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa taswira ya kibinadamu (“mkono wako”)
  choice: Kudumisha usemi halisi “mkono wako.”
  alternative: nguvu zako; pigo lako
  rationale: Kiebrania kinatumia taswira dhahiri ya mkono. Kuibakiza hakufungii maana katika nguvu, adhabu, au mateso pekee, hivyo huhifadhi mvutano wa kishairi na kitheolojia.
- issue: Maana ya אֵמָתְךָ kama kitisho kinachohusishwa na Mungu
  choice: kitisho chako
  alternative: hofu yako; utisho wako
  rationale: “Kitisho chako” kinaweza kumaanisha hali au athari ya kutisha inayotokana na uwepo au tendo la Mungu bila kuamua kwamba ni sifa ya Mungu mwenyewe au hisia ya Ayubu tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kishairi lakini unaeleweka kwa urahisi; taswira ya “mkono” na mkazo wa kitisho vimehifadhiwa bila kuongeza tafsiri ya kimadhehebu.
