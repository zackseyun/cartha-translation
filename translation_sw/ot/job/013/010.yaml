  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: sw
  text: Hakika atawakemea ikiwa kwa siri mtaonyesha upendeleo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mtainua nyuso,” nahau ya Kiebrania yenye maana ya kuonyesha upendeleo au kumpendelea mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: Hakika atawakemea
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo unasisitiza tendo. “Hakika” huhifadhi msisitizo huo, na “atawakemea” linafaa kwa onyo la Ayubu kuhusu lawama kali ya Mungu.
- source_word: אֶתְכֶם
  choice: -wa- katika “atawakemea”
  rationale: Kiambishi hiki cha yambwa huonyesha nafsi ya pili wingi, yaani marafiki wa Ayubu kwa pamoja.
- source_word: אִם
  choice: ikiwa
  rationale: “Ikiwa” huhifadhi hali ya sharti katika onyo; kutafsiri “wakati” kungedokeza kwamba tendo hilo limethibitishwa zaidi ya ilivyo katika Kiebrania.
- source_word: בַּסֵּתֶר
  choice: kwa siri
  rationale: Kirai hiki huonyesha tendo linalofanywa kwa namna iliyofichika; “kwa siri” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: mtaonyesha upendeleo
  rationale: Hii ni nahau ambayo maana yake ni kumpendelea mtu au kutokuwa na usawa katika hukumu. Tafsiri ya maana yake ni wazi kwa msomaji wa sasa, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.
theological_decisions:
- issue: Tafsiri ya nahau נשׂא פנים
  choice: mtaonyesha upendeleo
  alternative: mtainua nyuso; mtapendelea watu
  rationale: Nahau ina nguvu ya kimaadili na kimahakama, ikionya dhidi ya upendeleo katika kuwatetea wengine. “Mtaonyesha upendeleo” ni ya asili na haiongezi msimamo wa kimadhehebu.
- issue: Mhusika wa kitenzi “atawakemea”
  choice: Kiima kisichotajwa wazi, kinachoeleweka katika muktadha kuwa Mungu
  alternative: Mungu atawakemea
  rationale: Kiebrania hakitaji nomino “Mungu” katika mstari huu. Kuacha kiima katika nafsi ya tatu huhifadhi mshikamano na utata wa kisarufi wa matini huku muktadha ukimtambulisha anayerejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hakika” huonyesha msisitizo wa Kiebrania, na “kwa siri mtaonyesha upendeleo” huhifadhi mpangilio na hali ya sharti bila kuwa nzito.
