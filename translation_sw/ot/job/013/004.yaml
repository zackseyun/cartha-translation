  yaml_path: translation/ot/job/013/004.yaml
  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: sw
  text: Lakini ninyi ni wapakaji wa uongo[a]; ninyi nyote ni matabibu wasio na manufaa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watandazaji wa uongo” au “watungaji wa uongo.” Kitenzi cha Kiebrania kinaweza kuleta taswira ya kupaka au kutandaza kitu juu ya kingine, kana kwamba wanafunika ukweli kwa uongo.
    reason: lexical_alternative
  - marker: b
    text: Au “matabibu wasio na thamani.” Usemi wa Kiebrania unawaeleza kuwa waponyaji wasio na manufaa; tafsiri “matabibu wa sanamu” inawezekana kwa maana nyingine ya nomino hiyo, lakini haielekei kufaa sana hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha upinzani mkali na maneno yaliyotangulia; “Lakini” ni cha kawaida na chenye nguvu inayofaa katika Kiswahili.
- source_word: אַתֶּם
  choice: ninyi
  rationale: Kiwakilishi hiki cha nafsi ya pili wingi kinawahusu moja kwa moja rafiki za Ayubu na kinaweka mkazo unaopatikana katika Kiebrania.
- source_word: טֹפְלֵי
  choice: wapakaji wa
  rationale: Kitenzi cha msingi kinaweza kumaanisha kupaka au kutandaza kitu juu ya kingine. “Wapakaji wa” kinahifadhi taswira halisi ya kufunika ukweli kwa uongo bila kuibadili kuwa maelezo tu.
- source_word: שָׁקֶר
  choice: uongo
  rationale: “Uongo” ni nomino ya jumla iliyo ya kawaida katika Kiswahili na inafaa baada ya “wapakaji wa,” huku ikiwakilisha umoja wa Kiebrania wenye maana ya kijumla.
- source_word: רֹפְאֵי
  choice: waganga
  rationale: Neno hili linahifadhi taswira ya watu wanaodai kuponya. Katika muktadha huu halimaanishi lazima waganga wa jadi, bali watu wanaojifanya kutoa tiba kwa hali ya Ayubu.
- source_word: אֱלִל
  choice: wasiofaa
  rationale: Hapa nomino hii inaelekea kueleza ubatili, kutokuwa na thamani, au kutokuwa na manufaa. “Wasiofaa” linaonyesha wazi kwamba wao ni waponyaji wasioweza kusaidia.
- source_word: כֻּלְּכֶם
  choice: ninyi nyote
  rationale: Kauli hii inawahusisha wasemaji wote bila kumwacha yeyote na kuhifadhi mkazo wa Kiebrania.
theological_decisions:
- issue: Maana ya אֱלִל katika usemi רֹפְאֵי אֱלִל
  choice: waganga wasiofaa
  alternative: waganga wa sanamu
  rationale: Ingawa אֱלִל linaweza kumaanisha “sanamu” katika miktadha mingine, hapa maana ya “ubatili” au “kutokuwa na thamani” inaendana vizuri zaidi na sitiari ya washauri wasioweza kuponya.
translation_notes:
  register: Lugha ni ya Kiswahili Sanifu cha Afrika Mashariki, ya sasa na yenye hadhi. “Wapakaji wa uongo” limechaguliwa ili kuhifadhi sitiari kali ya Kiebrania, ingawa si usemi wa kawaida sana; tanbihi inatoa njia mbadala. Nusu ya pili imerudia “ninyi” ili sentensi iwe wazi na ya asili huku “nyote” ikisisitiza kuwa hukumu hiyo inawahusu wote.
