  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Lakini ... tu
  rationale: Neno hili linaweka mpaka katika ombi la Ayubu. Muundo wa Kiswahili “lakini ... tu” unaonyesha kuwa anaomba mambo mawili pekee yasitendwe kwake.
- source_word: שְׁתַּיִם
  choice: mambo mawili
  rationale: Kiebrania kina namba ya kike “mawili” bila nomino iliyotajwa; “mambo” imeongezwa kwa uwazi na ni ya kawaida katika Kiswahili.
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: usinitendee
  rationale: Kitenzi עשה pamoja na עִם hapa kina maana ya kufanya au kumtendea mtu jambo; “usinitendee” ni kifupi, cha kawaida, na huandaa mambo mawili yatakayotajwa.
- source_word: אָז
  choice: ndipo
  rationale: “Ndipo” linaonyesha matokeo yatakayofuata Mungu akikubali ombi hilo.
- source_word: מִפָּנֶיךָ
  choice: mbali na uso wako
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya “uso,” huku “mbali na” ikionyesha kujificha kutoka mbele ya Mungu.
- source_word: לֹא אֶסָּתֵר
  choice: sitajificha
  rationale: Nifali ya סתר inaeleweka hapa kwa maana ya kujificha au kujisitiri; Ayubu anasema hatakwepa kukutana na Mungu ikiwa masharti hayo yatakubaliwa.
