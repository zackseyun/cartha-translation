base_translation:
  language: en
  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: sw
  text: Je, itakuwa vyema atakapowachunguza? Au mtamdhihaki kama mtu anavyodhihakiwa?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtamdanganya” au “mtamfanyia mzaha”; kitenzi cha Kiebrania kinaweza kumaanisha kudhihaki, kudanganya, au kumfanyia mtu mzaha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mwanadamu”; yaani, binadamu wa kawaida, tofauti na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: Je, itakuwa vyema
  rationale: Kiulizi הֲ pamoja na טוֹב kinaunda swali la balagha. Wakati ujao unafaa muktadha wa onyo kuhusu matokeo ya uchunguzi wa Mungu.
- source_word: כִּי
  choice: atakapowachunguza
  rationale: כִּי hapa hutambulisha hali ya wakati; kiambishi '-kapo-' kinawasilisha kwa Kiswahili maana ya 'wakati atakapo-' kwa ufasaha.
- source_word: יַחְקֹר אֶתְכֶם
  choice: atawachunguza
  rationale: חקר humaanisha kuchunguza au kupeleleza kwa kina, na kiambishi '-wa-' kinaonyesha kuwa wanaozungumziwa ni wengi.
- source_word: אִם
  choice: Au
  rationale: Katika swali hili sambamba la balagha, אִם hutambulisha uwezekano wa pili.
- source_word: כְּהָתֵל ... תְּהָתֵלּוּ בוֹ
  choice: mtamdanganya kama ... anavyodanganywa
  rationale: התל inaweza kumaanisha kudanganya, kubeza, au kumfanyia mtu mchezo. 'Kudanganya' huleta ulinganisho wa namna wanavyoweza kumtendea mwanadamu, huku tanbihi ikihifadhi maana nyingine.
- source_word: בֶּאֱנוֹשׁ
  choice: mtu
  rationale: אֱנוֹשׁ humaanisha mwanadamu, mara nyingi kwa dokezo la udhaifu au hali ya kufa. 'Mtu' ni ya kawaida na huweka tofauti iliyopo na Mungu; dokezo hilo limefafanuliwa katika tanbihi.
theological_decisions:
- issue: Mhusika wa viwakilishi vya nafsi ya tatu umoja
  choice: Vinamrejelea Mungu
  alternative: Mchunguzi au mwamuzi asiyetajwa
  rationale: Muktadha wa Ayubu 13:7–11 unaonyesha kuwa Ayubu anawaonya wanaosema kwa niaba ya Mungu kuhusu uchunguzi wake. Tafsiri haiongezi jina 'Mungu' katika mstari, hivyo huhifadhi muundo wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Je' na 'Au' huhifadhi maswali mawili ya balagha; umbo la wingi katika 'wa-' na 'mta-' huonyesha kuwa Ayubu anawahutubia watu kadhaa.
