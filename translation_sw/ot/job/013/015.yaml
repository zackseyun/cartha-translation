  text: הֵ֣ן יִ֭קְטְלֵ/נִי לא אֲיַחֵ֑ל אַךְ דְּ֝רָכַ֗/י אֶל פָּנָ֥י/ו אוֹכִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/015.yaml
  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: sw
  text: Hata akiniua[a], sitatumaini; hata hivyo, nitatetea njia zangu mbele zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya kimapokeo: “Hata akiniua, bado nitamtumaini.” Hii inafuata usomaji mwingine wa Kiebrania.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Hata
  rationale: Katika muktadha huu linaingiza hali ya kukubali jambo linaloweza kutokea kabla ya kauli kuu; “Hata” ni ya kawaida na hubeba nguvu ya “ijapokuwa.”
- source_word: יִקְטְלֵנִי
  choice: akiniua
  rationale: Kitenzi קטל kinamaanisha kuua; “akiniua” ni cha asili, kizito, na wazi katika Kiswahili cha sasa.
- source_word: לֹא אֲיַחֵל
  choice: sitatumaini
  rationale: Maandishi ya konsonanti yana לֹא, “si/sio,” na יחל hapa inaweza kumaanisha kutumaini au kungoja. “Sitatumaini” huhifadhi maana ya tumaini iliyo katika kitenzi bila kuondoa ukanushi wa maandishi.
- source_word: אַךְ
  choice: hata hivyo
  rationale: 'Huonyesha ugeukaji wa kimawazo: licha ya kukosa tumaini, Ayubu bado ataweka hoja yake wazi.'
- source_word: דְּרָכַי
  choice: njia zangu
  rationale: Huhifadhi taswira halisi ya Kiebrania huku ikiruhusu maana ya mwenendo na maisha ya Ayubu.
- source_word: אֶל־פָּנָיו
  choice: mbele zake
  rationale: Ni usemi wa Kiswahili unaowasilisha maana ya kuwa mbele yake au katika uwepo wake.
- source_word: אוֹכִיחַ
  choice: nitatetea
  rationale: Katika mazingira ya kisheria na mabishano ya kitabu cha Ayubu, Hiphil ya יכח ina maana ya kuwasilisha na kutetea hoja au mwenendo; “nitatetea” ni ya asili kuliko tafsiri ya moja kwa moja “nitabishana.”
theological_decisions:
- issue: Iwapo kufuata maandishi ya Kimasora yenye ukanushi au usomaji wa kimapokeo wenye maana ya kumtumaini Mungu
  choice: 'Maandishi makuu yanafuata לֹא: “sitatumaini.”'
  alternative: “Hata akiniua, bado nitamtumaini.”
  rationale: Chanzo kilichotolewa kina לֹא (“si”), si לוֹ (“kwake/katika yeye”). Kipaumbele kwa ushahidi wa lugha ya asili kinahitaji ukanushi ubaki katika maandishi makuu, huku usomaji muhimu wa kimapokeo ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unahifadhi mkazo na mvutano wa kauli ya Ayubu bila kuingiza ufafanuzi wa kimadhehebu.
