  text: Why should I take my flesh in my teeth and put my life in my hand?[a][b]
translation:
  language: sw
  text: Kwa nini niuchukue mwili wangu kwa meno yangu na kuyaweka maisha yangu mkononi mwangu?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini niichukue nyama yangu kwa meno yangu?” Usemi wa Kiebrania ni wa kinahau na ni mgumu; unaonyesha kujitia hatarini bila kujali usalama.
    reason: lexical_alternative
  - marker: b
    text: Au, “nafsi yangu.” Neno la Kiebrania nefesh linaweza kumaanisha “maisha,” “nafsi,” au “mtu mwenyewe”; hapa “maisha” linafaa zaidi kwa maana ya kujihatarisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Kwa nini
  rationale: Kirai hiki kinaanzisha swali la balagha kuhusu sababu au kusudi; “Kwa nini” ni Kiswahili cha kawaida na huhifadhi nguvu ya swali.
- source_word: אֶשָּׂא
  choice: niuchukue
  rationale: Kitenzi נשא kinaweza kumaanisha kuinua, kubeba, au kuchukua; katika taswira hii ya kinahau, “niuchukue” kinafaa kwa swali la balagha.
- source_word: בְשָׂרִי
  choice: mwili wangu
  rationale: Ingawa בשר kimsingi ni “nyama,” hapa inamaanisha mwili wa mtu; “mwili wangu” ni ya asili katika Kiswahili na bado huhifadhi taswira ya kujihatarisha kimwili.
- source_word: בְשִׁנָּי
  choice: kwa meno yangu
  rationale: Kihusishi ב kinaweza kuonyesha chombo; “kwa meno yangu” ni cha asili zaidi katika Kiswahili kuliko “ndani ya meno yangu,” huku kikihifadhi taswira ngumu ya Kiebrania.
- source_word: נַפְשִׁי
  choice: maisha yangu
  rationale: נפש inaweza kumaanisha uhai, nafsi, au mtu mwenyewe; katika nahau ya kuyaweka mkononi, “maisha yangu” huwasilisha wazi wazo la kujitia hatarini.
- source_word: אָשִׂים
  choice: kuyaweka
  rationale: שׂים humaanisha kuweka au kutia; “kuyaweka” ni la kawaida na linapatana kisarufi na “maisha.”
- source_word: בְכַפִּי
  choice: mkononi mwangu
  rationale: כף ni kiganja au mkono; “mkononi mwangu” huhifadhi nahau ya kuhatarisha maisha kwa Kiswahili cha kawaida.
