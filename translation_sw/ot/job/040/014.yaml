  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: sw
  text: Ndipo hata mimi nitakusifu, kwa sababu mkono wako wa kuume unaweza kukuokoa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujiokoa mwenyewe”; Kiebrania kina kiambishi chenye maana ya “kwa ajili yako/mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Ndipo hata
  rationale: 'Inaendeleza changamoto iliyotangulia na wakati huohuo inatia mkazo: ikiwa Ayubu angeweza kuitimiza, ndipo Mungu mwenyewe angekubali kumsifu.'
- source_word: אֲנִי
  choice: mimi
  rationale: Kiwakilishi cha wazi kimehifadhiwa kwa ajili ya mkazo, kwa kuwa Mungu ndiye anayesema.
- source_word: אוֹדֶךָ
  choice: nitakusifu
  rationale: Katika muktadha huu, kitenzi ידה katika Hifili humaanisha kutoa sifa au kukiri kwa sifa; “nitakusifu” ni lugha ya kawaida na yenye heshima.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kinaanzisha sababu ya kauli iliyotangulia.
- source_word: תוֹשִׁיעַ
  choice: unaweza kukuokoa
  rationale: Hifili ya ישׁע humaanisha kuokoa au kukomboa. Katika changamoto hii ya masharti, wazo kuu ni uwezo ambao Ayubu angeuthibitisha kwa tendo, hivyo “unaweza” linafaa kuliko usemi wa utabiri tu.
- source_word: לְךָ
  choice: kukuokoa
  rationale: Lamedi inaonyesha manufaa kwa mhusika, yaani “kwa ajili yako/mwenyewe.” Kiswahili cha kawaida kinaweza kulieleza katika kitenzi “kukuokoa,” huku maana ya kujinufaisha ikiwekwa wazi katika tanbihi.
- source_word: יְמִינֶךָ
  choice: mkono wako wa kuume
  rationale: Taswira halisi ya Kiebrania imehifadhiwa; mkono wa kuume huwakilisha nguvu au uwezo, lakini tafsiri haiondoi sitiari hiyo.
theological_decisions:
- issue: Sitiari ya kibinadamu kuhusu nguvu
  choice: mkono wako wa kuume unaweza kukuokoa
  alternative: nguvu zako mwenyewe zinaweza kukuokoa
  rationale: Kiebrania kinatumia taswira dhahiri ya “mkono wa kuume.” Kuihifadhi kunatunza lugha ya kishairi bila kuibadili moja kwa moja kuwa ufafanuzi wake.
- issue: Uwezo dhidi ya utabiri katika תוֹשִׁיעַ
  choice: unaweza kukuokoa
  alternative: utakuokoa
  rationale: Muktadha wa changamoto ya masharti unaelekeza kwenye uwezo wa Ayubu wa kujikomboa, si hasa utabiri wa tendo la baadaye; hata hivyo umbo la kitenzi lenyewe linaweza kutafsiriwa kwa namna ya wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kishairi. Kiwakilishi “mimi” na taswira “mkono wako wa kuume” vimehifadhiwa kwa mkazo na uaminifu kwa matini ya Kiebrania.
