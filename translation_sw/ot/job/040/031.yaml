  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: sw
  text: Je, unaweza kuijaza ngozi yake kwa vifaa vyenye ncha kali[a], au kichwa chake kwa mikuki ya kuvulia samaki[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vyuma vyenye miiba” au “kwa kulabu.” Neno la Kiebrania ni adimu na huenda likamaanisha kwa ujumla vifaa vyenye ncha kali au miiba vya kuwinda au kuvua.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kulabu za kuvulia samaki.” Kirai cha Kiebrania huenda kikamaanisha kwa ujumla kifaa cha kukamata samaki, ingawa “mikuki ya kuvulia samaki” inafaa katika usambamba hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: Je, unaweza kuijaza
  rationale: Kiulizi pamoja na kitenzi cha Piel kisichotimilika, nafsi ya pili umoja wa kiume, huleta swali la changamoto. ‘Je, unaweza kuijaza’ hudumisha maana ya uwezo na nguvu ya swali la balagha.
- source_word: בְשֻׂכּוֹת
  choice: kwa vyuma vyenye ncha kali
  rationale: Nomino hii ni adimu na huenda ikamaanisha vifaa vyenye ncha kali au miiba vinavyotumiwa kuwinda au kuvua. Kauli hii pana inadumisha kutokuwa na uhakika kwa maana huku ikionyesha silaha za kutoboa.
- source_word: עוֹרוֹ
  choice: ngozi yake
  rationale: ‘Ngozi’ ni neno la kawaida, wazi, na la asili kwa sehemu ya nje ya mwili wa mnyama mkubwa.
- source_word: וּבְצִלְצַל דָּגִים
  choice: kwa mikuki ya kuvulia samaki
  rationale: Kirai hiki kinataja kifaa kinachohusiana na samaki. ‘Mikuki ya kuvulia samaki’ inafaa katika usambamba na vifaa vyenye ncha kali na katika taswira ya kukishambulia kichwa.
- source_word: רֹאשׁוֹ
  choice: kichwa chake
  rationale: 'Tafsiri ya moja kwa moja inayohifadhi usambamba wa viungo vya mwili: ngozi yake na kichwa chake.'
