lexical_decisions:
- source_word: רֵאשִׁית
  choice: wa kwanza
  rationale: Huhifadhi wazo la ukuu au nafasi ya kwanza bila kulazimisha maana ya mwanzo wa wakati pekee.
- source_word: דַּרְכֵי אֵל
  choice: kati ya kazi za Mungu
  rationale: Katika muktadha wa uumbaji, ‘kazi’ huwasilisha kwa uwazi matendo ya Mungu huku tanbihi ikihifadhi tafsiri halisi zaidi ya ‘njia.’
- source_word: אֵל
  choice: Mungu
  rationale: Hili ni jina la kawaida la Mungu katika mstari huu na tafsiri ya kawaida ya Kiswahili ni ‘Mungu.’
- source_word: הָעֹשׂוֹ
  choice: Muumba wake
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya ‘yule aliyemuumba,’ na ‘wake’ humrejelea kiumbe huyo.
- source_word: יַגֵּשׁ
  choice: anayeweza kuuleta karibu
  rationale: Hufuata maana ya kisababishi ya kitenzi, ‘kuleta karibu,’ huku ‘anaweza’ ikiwasilisha usomaji wa muktadha kwamba Muumba peke yake ndiye mwenye uwezo huo.
- source_word: חַרְבּוֹ
  choice: upanga wake
  rationale: Huhifadhi kiambishi cha nafsi ya tatu ya kiume na pia utata wa anayemiliki upanga.
theological_decisions:
- issue: Tafsiri ya kishazi kigumu cha mwisho
  choice: ni Muumba wake tu anayeweza kuuleta karibu upanga wake
  alternative: Muumba wake na aulete karibu upanga wake; au Muumba wake alimpatia upanga wake
  rationale: Kiebrania ni kifupi na kinaweza kufasiriwa kwa njia kadhaa. Tafsiri kuu inaonyesha kwamba Muumba pekee anaweza kumkabili, lakini tanbihi huhifadhi uwezekano mwingine bila kuingiza dai la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa alama za tanbihi umewekwa kwa kufuatana na mahali zinapotokea katika maandishi.
