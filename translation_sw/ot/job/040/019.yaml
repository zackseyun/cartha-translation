  text: Yeye ndiye wa kwanza kati ya kazi za Mungu[a]; yeye aliyemuumba na aulete karibu upanga wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye ndiye mkuu wa njia za Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania cha kishazi cha mwisho ni kigumu. Huenda maana yake ni, “Yeye aliyemuumba na aulete karibu upanga wake,” “Muumba wake pekee anaweza kumkaribia kwa upanga,” au “Muumba wake alimpatia upanga wake.”
