  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: sw
  text: Tazama, mimi ni duni[a]; nimjibu nini? Nimeweka mkono wangu juu ya kinywa changu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mimi ni wa maana kidogo”; tafsiri ya jadi, “mimi ni mwovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Chembe hii huvuta fikira na kuanzisha jibu la Ayubu kwa msisitizo; “Tazama” ni ya heshima na inaeleweka katika Kiswahili cha sasa.
- source_word: קַלֹּתִי
  choice: mimi si kitu cha maana
  rationale: Kitenzi kutoka קלל hapa huonyesha kuwa mdogo, hafifu, au asiye na uzito mkubwa. Kauli hii inaonyesha kujishusha kwa Ayubu bila kuingiza maana nzito zaidi ya uovu wa kimaadili.
- source_word: מָה אֲשִׁיבֶךָּ
  choice: nitakujibuje?
  rationale: 'Muundo wa Kiswahili wenye “-je” unawasilisha swali la balagha kwa kawaida: Ayubu hana jibu linalofaa mbele za Mungu.'
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: Nimeweka mkono wangu juu ya kinywa changu
  rationale: Tafsiri ya karibu inayohifadhi ishara ya kimwili ya kunyamaza na kujizuia kusema.
theological_decisions:
- issue: Iwapo maelezo ya Ayubu kuhusu nafsi yake yatumie neno lenye hukumu ya kimaadili
  choice: mimi si kitu cha maana
  alternative: mimi ni mwovu / mimi ni mbaya sana
  rationale: קַלֹּתִי kwa kawaida zaidi huonyesha udogo, kutokuwa na uzito, au kutokuwa wa maana katika muktadha huu. Tafsiri yenye “mwovu” ingeongeza dai la upotovu wa kimaadili ambalo mstari wenyewe haulitamki wazi.
- issue: Nguvu ya swali la Ayubu
  choice: nitakujibuje?
  alternative: nikujibu nini?
  rationale: Zote zinawezekana, lakini “nitakujibuje?” hudokeza kutoweza kwake kutoa jibu linalostahili bila kuamua zaidi ya maandishi iwapo tatizo ni yaliyomo katika jibu au namna ya kujibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” huhifadhi nguvu ya chembe ya Kiebrania, huku sentensi ya mwisho ikihifadhi taswira ya kunyamaza.
