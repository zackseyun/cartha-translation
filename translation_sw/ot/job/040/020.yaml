source:
  edition: WLC
  text: כִּֽי ב֭וּל הָרִ֣ים יִשְׂאוּ ל֑/וֹ וְֽ/כָל חַיַּ֥ת הַ֝/שָּׂדֶ֗ה יְשַֽׂחֲקוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: sw
  text: Kwa maana milima humzalia chakula[a], na wanyama wote wa porini hucheza huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “milima humtolea mazao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza zaidi jinsi mnyama huyo anavyopata riziki katika mazingira yaliyotajwa; “Kwa maana” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בּוּל
  choice: chakula
  rationale: Neno hili humaanisha mazao au kile kinachozalishwa. Katika muktadha wa riziki ya mnyama, “chakula” ni wazi na la kawaida, huku tanbihi ikihifadhi maana ya “mazao.”
- source_word: הָרִים
  choice: milima
  rationale: Hili ndilo neno la moja kwa moja la Kiswahili kwa eneo la milima linalompatia mnyama riziki.
- source_word: יִשְׂאוּ לוֹ
  choice: humzalia
  rationale: Kitenzi נשׂא pamoja na בּוּל hapa kina maana ya kuzaa au kutoa mazao kwa ajili yake. “Humzalia” huhifadhi taswira ya milima kutoa chakula.
- source_word: וְכָל
  choice: na ... wote
  rationale: Muundo huu unawakilisha kiunganishi na wingi-jumla kwa Kiswahili cha kawaida.
- source_word: חַיַּת הַשָּׂדֶה
  choice: wanyama wote wa porini
  rationale: Kirai hiki kinarejelea wanyama wa nchi kavu wanaoishi mwituni. “Wa porini” ni cha sasa na cha kawaida kuliko tafsiri ya kimapokeo “wanyama wa kondeni.”
- source_word: יְשַׂחֲקוּ
  choice: hucheza
  rationale: Katika kauli hii שׂחק inaonyesha tendo la kucheza; “hucheza” ni la asili na linaonyesha jambo la kawaida katika mazingira hayo.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki kinaelekeza kwenye eneo la milima lililotajwa; “huko” ni cha asili katika muktadha huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia “wanyama wa porini” kwa maana ya חַיַּת הַשָּׂדֶה bila kuhitaji tanbihi tofauti, kwa kuwa ndilo chaguo la wazi la kisasa; tanbihi imehifadhi uwezekano wa kutafsiri בּוּל kwa “mazao.”
