lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Huhifadhi kishazi cha kuvuta fikira mwanzoni mwa mstari kwa lugha ya kawaida na yenye hadhi.
- source_word: יַעֲשֹׁק נָהָר
  choice: mto ukifurika kwa nguvu
  rationale: Kitenzi kina wazo la kushambulia au kufurika kwa nguvu; tafsiri hii huwasilisha picha ya mto mkali bila kudai kwa uhakika maana finyu ya 'kughadhabika'.
- source_word: לֹא יַחְפּוֹז
  choice: hashtuki
  rationale: Hueleza kutofadhaika au kutoharakishwa kwa hofu kwa Kiswahili cha sasa.
- source_word: יִבְטַח
  choice: ana utulivu
  rationale: Katika muktadha huu humaanisha kuwa salama na bila hofu; 'ana utulivu' ni ya asili zaidi kuliko kudokeza imani ya kidini.
- source_word: יָגִיחַ
  choice: ikifurika
  rationale: Huhifadhi taswira ya maji yanayobubujika au kusonga kwa nguvu.
- source_word: יַרְדֵּן אֶל־פִּיהוּ
  choice: Yordani ikifurika mpaka kinywani mwake
  rationale: Hufuata taswira halisi ya mto unaofika kinywani mwa mnyama na kuhifadhi jina maalumu Yordani.
