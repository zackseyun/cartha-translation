base_translation:
  language: en
  yaml_path: translation/ot/job/040/005.yaml
  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: sw
  text: Nimenena mara moja[a], nami sitajibu; mara mbili, nami sitaongeza tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilinena mara moja, lakini sitajibu; mara mbili, lakini sitaendelea zaidi.” Nahau ya Kiebrania inayotafsiriwa “kuongeza” inaweza kumaanisha kuendelea au kurudia tendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: mara moja
  rationale: Namba ya kike ‘moja’ imetumiwa kama kielezi pamoja na kitenzi ‘nimenena’; kwa hiyo maana ya kawaida hapa ni ‘mara moja,’ si ‘jambo moja.’
- source_word: דִּבַּרְתִּי
  choice: nimenena
  rationale: Kitenzi timilifu cha nafsi ya kwanza kinaeleza maneno ambayo Ayubu tayari amesema na ambayo bado yana umuhimu katika jibu lake. ‘Nimenena’ ni lugha yenye hadhi na inayoeleweka katika muktadha huu.
- source_word: וְלֹא אֶעֱנֶה
  choice: nami sitajibu
  rationale: Kitenzi ענה katika Qal humaanisha ‘kujibu.’ ‘Nami’ kinahifadhi uratibu wa kiunganishi cha Kiebrania bila kulazimisha maana ya upinzani.
- source_word: וּשְׁתַּיִם
  choice: mara mbili
  rationale: Namba ‘mbili’ imetumiwa kama kielezi sambamba na ‘mara moja,’ hivyo tafsiri ya asili ni ‘mara mbili.’
- source_word: וְלֹא אוֹסִיף
  choice: nami sitaongeza tena
  rationale: יסף katika Hifili inaweza kumaanisha kuongeza, kuendelea, au kufanya tena. ‘Sitaongeza tena’ kinahifadhi sitiari ya Kiebrania huku kikionyesha kwamba Ayubu hataendelea kusema.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa vipashio sambamba ‘mara moja ... mara mbili’ umehifadhiwa, pamoja na sitiari ya ‘kuongeza.’
