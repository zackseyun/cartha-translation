base_translation:
  language: en
  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: sw
  text: Je, kweli utaibatilisha haki yangu? Utanihukumu kuwa mwenye hatia ili uthibitike kuwa mwenye haki?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hukumu yangu.” Neno la Kiebrania mishpati linaweza kumaanisha hukumu, haki, au dai la kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: Je, kweli
  rationale: Muunganiko wa kiulizi הֲ na אַף unatia mkazo wa mshangao; “Je, kweli” ni Kiswahili cha kawaida kinachohifadhi swali na mkazo huo.
- source_word: תָּפֵר
  choice: utaibatilisha
  rationale: Kitenzi פרר katika Hiphil kina maana ya kufanya jambo lisiwe na nguvu au uhalali. “Batilisha” linafaa katika muktadha wa kisheria na wa hukumu.
- source_word: מִשְׁפָּטִי
  choice: haki yangu
  rationale: מִשְׁפָּט inaweza kumaanisha haki, hukumu, au dai la kisheria. Hapa “haki yangu” linaonyesha haki ya Mungu katika kutawala na kuhukumu, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: תַּרְשִׁיעֵנִי
  choice: utanihukumu kuwa mwenye hatia
  rationale: Hiphil ya רשע ina maana ya kumtangaza mtu kuwa na hatia. Kauli hii inahifadhi wazi muktadha wa mahakama kuliko neno “utanihukumu” peke yake.
- source_word: לְמַעַן
  choice: ili
  rationale: Neno hili huonyesha kusudi au matokeo; “ili” ni fupi, wazi, na la asili katika Kiswahili.
- source_word: תִּצְדָּק
  choice: uonekane kuwa mwenye haki
  rationale: Katika muktadha huu wa kisheria, צדק humaanisha kuonekana au kuthibitishwa kuwa upande wa haki. Tafsiri hii huhifadhi ulinganifu na kutangazwa kwa hatia bila kuingiza maana maalumu ya kimadhehebu.
theological_decisions:
- issue: Lugha ya kisheria dhidi ya maelezo ya jumla ya kimaadili
  choice: 'Aya imetafsiriwa kwa lugha ya kimahakama: “batilisha haki yangu ... hukumu kuwa mwenye hatia ... uonekane kuwa mwenye haki.”'
  alternative: “Kataa uadilifu wangu ... unifanye kuwa mkosaji ili wewe uwe sahihi.”
  rationale: Msamiati wa Kiebrania (מִשְׁפָּט, רשע, צדק) una mwelekeo thabiti wa kisheria. Lugha ya mahakama huhifadhi mvutano wa hoja ya Ayubu kuhusu haki ya Mungu.
- issue: Maana ya מִשְׁפָּטִי
  choice: haki yangu
  alternative: hukumu yangu
  rationale: Muktadha unahusu haki ya Mungu na utawala wake wa kuhukumu, si lazima uamuzi mmoja tu. Hata hivyo, “hukumu yangu” ni maana halali ya neno hilo na imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili umehifadhiwa, pamoja na msamiati wa kimahakama. “Je, kweli” huwasilisha mkazo wa swali bila kuwa wa kizamani.
