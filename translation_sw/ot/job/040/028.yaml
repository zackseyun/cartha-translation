  text: Will he make a covenant with you[b][a], that you would take him as a servant forever?
translation:
  language: sw
  text: Je, atafanya agano nawe[a]? Je, utamchukua kuwa mtumwa wako milele[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “atakata agano nawe,” nahau ya kawaida yenye maana ya “atafanya agano nawe.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuwa mtumishi wako milele.” Neno la Kiebrania עֶבֶד linaweza kumaanisha “mtumishi” au “mtumwa”; hapa “mtumwa” limetumiwa kwa sababu muktadha unasisitiza hali ya utumwa wa kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִכְרֹת בְּרִית
  choice: Je, atafanya agano
  rationale: Kitenzi כרת pamoja na בְּרִית ni nahau ya kawaida yenye maana ya ‘kufanya agano’; ‘atafanya agano’ ni Kiswahili cha kawaida na huhifadhi uzito rasmi wa usemi huo. הֲ inaonyesha swali.
- source_word: עִמָּךְ
  choice: nawe
  rationale: Huwakilisha kwa ufupi na kwa kawaida maana ya ‘pamoja nawe/na wewe’ katika mazungumzo ya moja kwa moja.
- source_word: תִּקָּחֶנּוּ
  choice: ili umchukue
  rationale: לקח ni ‘chukua’; hapa muunganiko wa sentensi unaweza kueleweka kwa wazo la kusudi au tokeo. Kiwakilishi tamati kinamrejelea kiumbe huyo kwa umoja wa kiume.
- source_word: לְעֶבֶד
  choice: kuwa mtumwa wako
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Muktadha wa kuchukuliwa katika hali ya kudumu unaifanya ‘mtumwa’ ionyeshe vizuri zaidi hali ya umiliki na utumwa inayokusudiwa; ‘wako’ huweka wazi uhusiano unaodokezwa na sentensi.
- source_word: עוֹלָם
  choice: milele
  rationale: Neno hili linaonyesha muda usio na mwisho au hali ya kudumu; ‘milele’ ni usemi wa kawaida unaohifadhi nguvu ya swali la Kiebrania.
