  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: sw
  text: Je, waweza kumvuta Lewiathani kwa ndoana,[a] au kuushusha ulimi wake kwa kamba?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumkokota Lewiathani kwa ndoana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuuzamisha ulimi wake kwa kamba,” au “kuushikilia ulimi wake chini kwa kamba.” Taswira ya Kiebrania ni ngumu kueleweka na huenda inahusu kumtiisha kiumbe huyo kupitia kinywa chake.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: kumvuta
  rationale: Kitenzi משׁך katika muktadha wa uvuvi humaanisha kuvuta au kukokota. “Kumvuta” ni Kiswahili cha kawaida na kinahifadhi taswira ya kumtoa kiumbe kwa ndoana.
- source_word: לִוְיָתָן
  choice: Lewiathani
  rationale: Ni jina au designation ya kiumbe huyu; limetoholewa kwa tahajia inayosomeka kwa Kiswahili bila kulifasiri kuwa mnyama fulani mahsusi.
- source_word: בְּחַכָּה
  choice: kwa ndoana
  rationale: חכה ni ndoana ya kuvulia samaki. “Ndoana” kwa kawaida tayari hubeba maana hiyo katika Kiswahili.
- source_word: וּבְחֶבֶל
  choice: kwa kamba
  rationale: חבל humaanisha kamba au ugwe. “Kamba” ni neno la kawaida, pana, na linalofaa uzito wa taswira hii.
- source_word: תַּשְׁקִיעַ
  choice: kuubana
  rationale: Hifili ya שׁקע kimsingi ni kusababisha kitu kishuke au kizame. Katika taswira ngumu ya kuutiisha ulimi kwa kamba, “kuubana” hutoa maana inayowezekana ya kuushikilia chini bila kudai kujua mbinu hasa; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: לְשֹׁנוֹ
  choice: ulimi wake
  rationale: Kiebrania kinataja wazi ulimi, si kinywa kwa ujumla, hivyo taswira hiyo inadumishwa.
