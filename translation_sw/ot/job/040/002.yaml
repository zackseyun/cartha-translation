  text: הֲ֭/רֹב עִם שַׁדַּ֣י יִסּ֑וֹר מוֹכִ֖יחַ אֱל֣וֹהַּ יַעֲנֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: sw
  text: Je, anayeshindana na Mwenyezi atamsahihisha? Anayebishana na Mungu na ajibu jambo hili[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mwenye kumlaumu Mwenyezi atamfundisha au atamkaripia?” Kiebrania huunganisha lugha ya mabishano ya shauri na ya kusahihisha.
    reason: lexical_alternative
  - marker: b
    text: Au, “na ajibu hili,” au “na amjibu.” Kiambishi cha Kiebrania kinaweza kurejelea jambo lililotajwa badala ya kumrejelea Mungu moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: anayeshindana
  rationale: Mzizi ריב una maana ya kushindana au kuingia katika mabishano, hasa katika muktadha wa madai. Usemi huu wa Kiswahili ni wa kawaida na unahifadhi maana hiyo.
- source_word: עִם
  choice: na
  rationale: Kihusishi hiki kimsingi ni ‘na/pamoja na,’ lakini hapa kinaonyesha upinzani katika shindano; ‘kushindana na’ huleta maana zote mbili kwa Kiswahili cha kawaida.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Hii ni tafsiri ya cheo cha Mungu שדי inayotambulika katika Kiswahili na kuonyesha uwezo wake mkuu bila kukinakili tu kama jina.
- source_word: יִסּוֹר
  choice: atamsahihisha
  rationale: Kitenzi יסר kinaweza kumaanisha kuadibu, kufundisha, kukaripia, au kusahihisha. Muundo na ulinganifu wa sentensi unaonyesha kwamba mshindani wa kibinadamu ndiye anayedhani anaweza kumsahihisha Mwenyezi.
- source_word: מוֹכִיחַ
  choice: anayebishana
  rationale: Kitenzi יכח kinaweza kueleza kubishana, kukaripia, au kutetea hoja katika shauri. ‘Anayebishana’ ni wazi na cha sasa, huku kidokezo kikihifadhi maana ya kukosoa au kukaripia.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni umbo la kishairi la umoja linalotumiwa sana katika Ayubu; tafsiri ya moja kwa moja ‘Mungu’ haitii mkazo usiokuwamo katika Kiebrania.
- source_word: יַעֲנֶנָּה
  choice: na ajibu jambo hili
  rationale: Kiambishi cha umoja wa kike huenda kinarejelea jambo au hoja iliyotolewa, si Mungu moja kwa moja. ‘Jambo hili’ huifanya maana hiyo ieleweke, huku uwezekano mwingine ukibaki katika kidokezo.
theological_decisions:
- issue: Ikiwa mstari unamwonyesha mwanadamu akimsahihisha Mungu au Mungu akimsahihisha mwanadamu
  choice: Swali la balagha linamkabili mwanadamu anayeshindana na Mungu kana kwamba anaweza kumsahihisha Mwenyezi.
  alternative: Anayeshindana na Mwenyezi ndiye anayepaswa kukubali kusahihishwa.
  rationale: Sintaksia na ulinganifu wa mishororo vinaunga mkono mwanadamu kuwa kiima cha יִסּוֹר; mshororo wa pili unamtaka huyo anayebishana na Mungu ajibu. Tafsiri haipunguzi ukali wa karipio wala kuongeza fundisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mwenyezi’ imetumiwa kama cheo cha Mungu, na miundo ya mabishano imewekwa kwa lugha inayoeleweka kwa wasomaji wa kawaida. Alama zote za vidokezo zimewekwa katika matini kuu.
