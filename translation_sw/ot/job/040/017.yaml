translation:
  language: sw
  text: Hufanya mkia wake kuwa mgumu kama mwerezi; mishipa ya mapaja yake[a] imefungamana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mishipa ya viuno vyake,” au, kwa maana mahususi zaidi, “misuli au mishipa ya viungo vyake vya uzazi.” Neno la Kiebrania halina maana iliyo hakika na linajadiliwa. “Mishipa” pia inaweza kutafsiriwa “kano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: Huufanya ... kuwa mgumu
  rationale: Katika muktadha huu kitenzi kinaeleza hali au tendo la kimwili la mkia, ingawa kwa kawaida mzizi huu unaweza kumaanisha ‘kupendezwa’. Tafsiri hii inafaa kwa ulinganisho na mwerezi huku ikihifadhi wazo la uimara.
- source_word: זְנָבוֹ
  choice: mkia wake
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume.
- source_word: כְמוֹ אָרֶז
  choice: kama mwerezi
  rationale: Inahifadhi taswira ya kishairi ya nguvu na uimara wa mwerezi.
- source_word: גִּידֵי
  choice: mishipa ya
  rationale: Neno linaweza kumaanisha mishipa mikakamavu au kano. ‘Mishipa’ ni neno la kawaida na linaloeleweka, huku tanbihi ikieleza uwezekano wa ‘kano’.
- source_word: פחדו
  choice: mapaja yake
  rationale: Neno la Kiebrania hapa lina maana isiyo hakika. ‘Mapaja’ linafaa katika maelezo ya mwili na ni la kawaida, lakini maana nyingine zinahifadhiwa katika tanbihi.
- source_word: יְשֹׂרָגוּ
  choice: imesokotana
  rationale: Kitenzi kinaonyesha kufungamana kwa kusokotana au kufumwa pamoja. ‘Imesokotana’ ni ya asili na yenye nguvu ya kishairi katika Kiswahili.
