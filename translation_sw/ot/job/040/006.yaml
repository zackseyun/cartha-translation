  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: sw
  text: Ndipo Yahweh akamjibu Ayubu kutoka katika dhoruba, akasema:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika kimbunga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Ndipo ... akamjibu
  rationale: Muundo wa simulizi unaendeleza mfuatano wa matukio, huku kitenzi ענה hapa kikimaanisha kujibu. “Ndipo” na “akamjibu” ni Kiswahili cha kawaida kinachohifadhi uendelevu huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶת אִיּוֹב
  choice: Ayubu
  rationale: Kiashiria cha yambwa אֶת kinamtambulisha Ayubu kuwa anayejibiwa; katika Kiswahili kiambishi cha yambwa katika “akamjibu” huonyesha uhusiano huo kwa kawaida.
- source_word: מִן סְעָרָה
  choice: kutoka katika dhoruba
  rationale: סְעָרָה inaweza kumaanisha dhoruba, tufani, au kimbunga. “Dhoruba” ni neno la sasa, linaloeleweka kwa upana na lisilobainisha kupita kiasi aina ya hali hiyo ya hewa.
- source_word: וַיֹּאמַר
  choice: 'akasema:'
  rationale: Huu ni utangulizi wa kawaida wa maneno ya moja kwa moja. Alama ya nukta mbili inaonyesha kuwa hotuba inaanza katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu la herufi nne. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya סְעָרָה
  choice: dhoruba
  alternative: kimbunga
  rationale: Neno la Kiebrania lina wigo unaojumuisha dhoruba au kimbunga. Tafsiri kuu inaacha taswira hiyo ikiwa pana, na maana nyembamba inayowezekana imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndipo ... akamjibu” ni mtiririko wa kawaida wa simulizi, na “dhoruba” inaeleweka kwa wasomaji wengi bila kupoteza uzito wa tukio.
