lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika Qal wayyiqtol kinaanzisha jibu la Ayubu. “Akamjibu” ni simulizi la kawaida la Kiswahili na pia huonyesha kwamba Yahwe ndiye anayejibiwa.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Jina hili limetolewa kwa umbo lake lililozoeleka katika Kiswahili sanifu.
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa dhahiri katika Kiebrania; kazi yake imewakilishwa na kiambishi cha yambwa “-m-” katika “akamjibu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: וַיֹּאמַר
  choice: akisema
  rationale: Kitenzi אמר katika Qal wayyiqtol ni sehemu ya fomula ya Kiebrania “akajibu ... akasema.” “Akisema” huhifadhi kitenzi cha pili kwa Kiswahili cha kawaida bila kufanya utangulizi wa maneno usikike mzito.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko lina Tetragramatoni יהוה moja kwa moja. “Yahwe” huhifadhi jina binafsi la Mungu; “Yehova” ni toleo jingine la kimapokeo na limeonyeshwa katika tanbihi bila kuingiza jina hilo katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “akamjibu ... akisema” huhifadhi fomula ya usemi ya Kiebrania kwa namna ya kawaida katika Kiswahili.
