  text: Can you put a rope through his nose[b][a], or pierce his jaw with a hook?
translation:
  language: sw
  text: Je, unaweza kupitisha kamba puani mwake,[a] au kutoboa taya yake kwa ndoana?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuweka unyasi puani mwake.” Neno la Kiebrania אַגְמוֹן humaanisha tete au unyasi, lakini hapa huenda linamaanisha kamba iliyotengenezwa kwa unyasi.
    reason: lexical_alternative
  - marker: b
    text: Au, “shavu lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: Je, unaweza kupitisha
  rationale: Kiulizi הֲ pamoja na kitenzi huleta swali la balagha linalompa Ayubu changamoto; “Je, unaweza” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo.
- source_word: אַגְמוֹן
  choice: kamba
  rationale: Neno hili kimsingi humaanisha tete au unyasi, lakini hapa yaelekea ni kamba iliyotengenezwa kwa unyasi kwa ajili ya kumdhibiti mnyama.
- source_word: בְּאַפּוֹ
  choice: puani mwake
  rationale: אַף humaanisha pua au tundu la pua; “puani mwake” hudumisha taswira ya kupitisha kamba kwenye pua bila kulazimisha iwapo ni tundu moja.
- source_word: וּבְחוֹחַ
  choice: kwa ndoana
  rationale: חוֹחַ inaweza kumaanisha mwiba au ndoana; katika muktadha wa kumkamata na kumzuia mnyama, “ndoana” inafaa zaidi.
- source_word: תִּקּוֹב
  choice: kutoboa
  rationale: Kitenzi hiki humaanisha kutoboa au kupenya kwa kutengeneza tundu; “kutoboa” ni wazi na cha kawaida.
- source_word: לֶחֱיוֹ
  choice: taya yake
  rationale: לְחִי inaweza kumaanisha taya au shavu; “taya” inafaa katika taswira ya kutumia ndoana kumdhibiti mnyama, huku maana nyingine ikihifadhiwa katika tanbihi.
