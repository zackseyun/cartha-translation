  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
translation:
  language: sw
  text: Miti ya lotasi[a] humfunika kwa vivuli vyake; mierebi ya kijito humzunguka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miti ya kivuli”; utambulisho kamili wa צֶאֱלִים kama mmea hauna uhakika, ingawa “miti ya lotasi” ni tafsiri ya jadi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mipopla ya bonde la mto wa msimu” kwa עַרְבֵי נָחַל.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: humfunika
  rationale: Kitenzi סכך hapa kina maana ya kufunika au kukinga; “humfunika” ni cha moja kwa moja na kinaendana kwa kawaida na kivuli.
- source_word: צֶאֱלִים
  choice: miti ya lotus
  rationale: Utambulisho sahihi wa mmea huu hauna uhakika. “Miti ya lotus” huhifadhi tafsiri ya jadi bila kuficha kutokuwa na uhakika, ambako kumeelezwa katika tanbihi.
- source_word: צִלֲלוֹ
  choice: kwa kivuli chake
  rationale: Nomino צֵל humaanisha kivuli. Kiwakilishi cha umoja kimehifadhiwa kama kilivyo katika Kiebrania, kikirejelea miti kama kundi.
- source_word: יְסֻבּוּהוּ
  choice: humzunguka
  rationale: Kitenzi סבב humaanisha kuzunguka au kuzingira; “humzunguka” ni cha asili na hudumisha taswira ya kishairi.
- source_word: עַרְבֵי נָחַל
  choice: mierebi ya kijito
  rationale: עַרְבֵי inaweza kutaja mierebi au miti inayofanana na mipopla, na נַחַל inaweza kuwa kijito, korongo lenye maji, au mto wa msimu. “Mierebi ya kijito” ni tafsiri wazi na ya jadi; chaguo jingine limetolewa katika tanbihi.
