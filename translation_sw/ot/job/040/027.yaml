lexical_decisions:
- source_word: הֲ/יַרְבֶּה
  choice: Je, atakusihi sana
  rationale: Kiulizi הֲ kinawakilishwa na “Je,” na Hiphil ya רבה pamoja na תַּחֲנוּנִים inatolewa kwa Kiswahili cha kawaida kama “atakusihi sana,” ikihifadhi wazo la kusihi kwa wingi au kwa bidii bila tafsiri ngumu ya neno kwa neno.
- source_word: אֵלֶיךָ
  choice: -ku-
  rationale: Kiwakilishi cha nafsi ya pili umoja katika אֵלֶיךָ kimeunganishwa kiasili katika kitenzi “atakusihi”; kinamaanisha maombi yanaelekezwa kwako.
- source_word: תַּחֲנוּנִים
  choice: kusihi
  rationale: Nomino hii humaanisha maombi ya dhati ya kutaka fadhili au rehema. “Kusihi” ni lugha ya sasa, inayoeleweka, na yenye uzito unaofaa.
- source_word: אִם
  choice: au
  rationale: Katika maswali haya mawili yanayolingana, אִם inaanzisha swali la pili la uchaguzi; kwa hiyo “au” ni ya asili zaidi kuliko “ikiwa.”
- source_word: יְדַבֵּר
  choice: atakuambia
  rationale: Piel ya דבר ina maana ya kusema au kunena. “Atakuambia” ni ya kawaida katika Kiswahili na inaonyesha wazi kuwa maneno yanaelekezwa kwa msikilizaji.
- source_word: רַכּוֹת
  choice: maneno ya upole
  rationale: Kivumishi cha wingi wa kike kimetumiwa kama nomino kwa maana ya mambo au maneno laini. “Maneno ya upole” huhifadhi maana ya usemi mpole bila kudokeza kwa lazima kujipendekeza.
