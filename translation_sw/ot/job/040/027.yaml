  text: Je, atakusihi tena na tena[a], au atakuambia maneno ya upole[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakutolea maombi ya dhati.” Neno la Kiebrania linamaanisha maombi ya dhati ya kutaka fadhili au rehema.
