    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tazama sasa
  rationale: Huhifadhi mwito wa kuelekeza fikira na msisitizo wa papo hapo wa kishairi kwa Kiswahili cha sasa.
- source_word: כֹחוֹ
  choice: nguvu zake
  rationale: כֹחַ hapa inaeleza nguvu za kimwili za kiumbe; “nguvu” ni wazi na ya kawaida.
- source_word: בְמָתְנָיו
  choice: viunoni mwake
  rationale: מָתְנַיִם hurejelea eneo la kiuno/nyonga; “viunoni” huhifadhi upana wa maana na hadhi ya kishairi.
- source_word: וְאֹנוֹ
  choice: na uwezo wake
  rationale: אוֹן huweza kumaanisha nguvu, uwezo, au uhodari. “Uwezo” huleta utofauti wa kawaida katika usambamba bila kuondoa wazo la nguvu za mwili.
- source_word: בִּשְׁרִירֵי
  choice: katika misuli ya
  rationale: שְׁרִירִים inaashiria misuli, mishipa, au sehemu imara za nyama; “misuli” ndiyo tafsiri ya kisasa iliyo wazi zaidi.
- source_word: בִטְנוֹ
  choice: tumbo lake
  rationale: בֶּטֶן katika muktadha huu ni tumbo au sehemu ya ndani ya mwili; “tumbo” ni neno la kawaida na la moja kwa moja.
