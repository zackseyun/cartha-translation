  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: sw
  text: Tazama sasa, nguvu zake ziko viunoni mwake, na uwezo wake[a] uko katika misuli[b] ya tumbo lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguvu wake” au “uhodari wake.” Kiebrania kinatumia maneno mawili yanayokaribiana kwa nguvu za mwili.
