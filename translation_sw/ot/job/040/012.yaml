  text: רְאֵ֣ה כָל גֵּ֭אֶה הַכְנִיעֵ֑/הוּ וַ/הֲדֹ֖ךְ רְשָׁעִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: sw
  text: Mtazame kila mwenye kiburi, umshushe; na uwakanyage waovu mahali walipo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Mtazame
  rationale: Kauli ya amri inaelekeza Ayubu kumtazama mwenye kiburi kama mlengwa wa hukumu; umoja unapatana na kiambishi cha umoja katika kitenzi kinachofuata.
- source_word: כָל גֵּאֶה
  choice: kila mwenye kiburi
  rationale: 'Kivumishi kimetumiwa kama nomino na כָל ina maana ya kugawa: kila mtu mwenye kiburi.'
- source_word: הַכְנִיעֵהוּ
  choice: umshushe
  rationale: Hifili ya כנע humaanisha kumsababisha mtu ashuke au aletwe chini; hapa inatofautisha kiburi na kushushwa.
- source_word: וַהֲדֹךְ
  choice: na uwakanyage
  rationale: Kitenzi kinaonyesha kuwaponda au kuwakanyaga chini kwa hukumu; 'uwakanyage' huhifadhi picha halisi na nguvu ya tendo.
- source_word: רְשָׁעִים
  choice: waovu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kundi la watu wenye uovu.
- source_word: תַּחְתָּם
  choice: mahali walipo
  rationale: Katika muktadha huu תחתם yaweza kueleweka kwa maana ya mahali walipo, yaani hukumu iwafikie hapo hapo; maana ya karibu zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Asili ya amri aliyopewa Ayubu
  choice: Imehifadhiwa kama amri ya moja kwa moja ndani ya changamoto ya Mungu, bila kudai kwamba Ayubu amepewa mamlaka halisi ya Mungu ya kuhukumu.
  alternative: Kuifanya iwe sharti la wazi lisilo halisi, au kuieleza kama kukabidhiwa rasmi mamlaka ya hukumu.
  rationale: Muktadha unaonyesha Mungu akimtaka Ayubu afanye matendo yanayodhihirisha utawala wa Mungu. Muundo wa amri unapaswa kubaki bila kuondoa mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa umoja katika sehemu ya kwanza na wingi katika sehemu ya pili umehifadhi mabadiliko ya kisarufi ya Kiebrania.
