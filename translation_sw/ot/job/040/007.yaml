base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: sw
  text: Jifunge viuno kama mwanamume[a]; nitakuuliza, nawe unijulishe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jiandae kama shujaa.” Kiebrania kinasema kihalisi, “Jifunge viuno kama mwanamume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר ... חֲלָצֶיךָ
  choice: Jifunge viuno
  rationale: Inahifadhi taswira halisi ya kujifunga viuno ili kujiandaa kwa kazi au pambano, huku ikibaki sentensi ya Kiswahili inayoeleweka.
- source_word: נָא
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Chembe hii huongeza msisitizo au himizo. Katika changamoto hii, nguvu yake inaonekana kwa kawaida katika amri yenyewe; ‘tafadhali’ ingesikika ya upole kupita kiasi, na ‘sasa’ ingeweza kueleweka kimakosa kuwa kielezi cha wakati.
- source_word: כְגֶבֶר
  choice: kama mwanamume
  rationale: Inahifadhi nomino ya kiume na wazo lake la nguvu bila kuifanya moja kwa moja kuwa ‘shujaa,’ ingawa maana hiyo inawezekana katika muktadha.
- source_word: אֶשְׁאָלְךָ
  choice: nitakuuliza
  rationale: Kitenzi שאל humaanisha kuuliza; katika muktadha huu maswali yana nguvu ya kumhoji Ayubu, lakini ‘nitakuuliza’ ni ya asili na haiongezi taswira ya mahakama isiyo wazi katika kitenzi chenyewe.
- source_word: וְהוֹדִיעֵנִי
  choice: nawe unijulishe
  rationale: Inahifadhi muundo wa kisababishi wa ידע, yaani kumfanya msemaji ajue, badala ya kuufupisha kwa tafsiri ya kimuktadha ‘unijibu.’
theological_decisions:
- issue: Lugha ya kijinsia katika גבר
  choice: kama mwanamume
  alternative: kama shujaa / kama mtu mwenye nguvu
  rationale: Mungu anamwambia Ayubu kwa umoja wa kiume, na nomino גבר ni ya kiume yenye kidokezo cha nguvu. Tafsiri haiondoi wala haipanui jinsia ya usemi wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Nahau halisi imehifadhiwa katika matini, na maana yake ya kimuktadha imetolewa katika tanbihi.
