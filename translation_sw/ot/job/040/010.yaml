base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: sw
  text: Jipambe[a], tafadhali, kwa ukuu na utukufu; ujivike fahari na heshima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jipambe sasa kwa kiburi na majivuno; ujivike utukufu na adhama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדֵה
  choice: Jipambe
  rationale: Kitenzi cha amri, nafsi ya pili umoja, kinamaanisha mtu ajitie mapambo. “Jipambe” ni Kiswahili cha kawaida na kinadumisha ulinganifu na “ujivike” katika sehemu ya pili.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe hii huonyesha ombi au msisitizo katika himizo. “Tafadhali” linafikisha nguvu ya ombi, huku uwezekano wa “sasa” ukitajwa katika tanbihi.
- source_word: גָאוֹן
  choice: ukuu
  rationale: Katika changamoto ya Mungu kwa Ayubu, neno hili linaonyesha adhama au cheo kilichoinuka, si lazima kiburi cha dhambi. “Ukuu” linafaa kwa sifa ya kifalme na ya kimungu.
- source_word: גֹבַהּ
  choice: utukufu
  rationale: Maana ya msingi ni “kimo” au “hali ya kuinuka”; hapa, sambamba na גָאוֹן, linaonyesha ubora wa juu na adhama. “Utukufu” ni usemi wa kawaida wa Kiswahili kwa dhana hiyo, ingawa “kuinuka” au “majivuno” yanawezekana kulingana na muktadha.
- source_word: הוֹד
  choice: fahari
  rationale: Neno hili huonyesha uzuri wenye kuvutia, adhama, au uangavu wa kifalme. “Fahari” linatofautisha wazo hilo na “ukuu” huku likihifadhi mkusanyiko wa kishairi wa sifa.
- source_word: הָדָר
  choice: heshima
  rationale: Neno hili linaweza kumaanisha heshima, adhama, au uzuri wa kifalme. “Heshima” linatoa kivuli tofauti lakini kinachohusiana na “fahari” bila kurudia neno lilelile.
- source_word: תִּלְבָּשׁ
  choice: ujivike
  rationale: Umbo hili linaendeleza nguvu ya amri ya mwanzo. “Ujivike” linahifadhi wazi taswira ya kuvaa sifa kama vazi.
theological_decisions:
- issue: Iwapo גָאוֹן na גֹבַהּ yatafsiriwe kwa maana hasi ya kiburi na majivuno au kwa maana ya ukuu wa kifalme na wa kimungu
  choice: Yametafsiriwa kama “ukuu na utukufu,” yaani sifa chanya za adhama katika changamoto ya Mungu kwa Ayubu.
  alternative: “Kiburi na majivuno” au “majivuno na cheo.”
  rationale: Muktadha unamtaka Ayubu, kwa njia ya changamoto, ajitwike adhama na mamlaka yanayomstahili Mungu. Taswira ya mavazi na mfuatano wa הוֹד na הָדָר vinaelekeza zaidi kwenye fahari ya kifalme kuliko uovu wa kimaadili, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari miwili na taswira ya kujipamba na kujivika vimehifadhiwa; msamiati umechaguliwa ili ueleweke kwa msomaji wa kawaida bila kupoteza mvutano wa maana katika Kiebrania.
