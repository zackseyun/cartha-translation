lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika fomula hii ya masimulizi humaanisha ‘kujibu.’ ‘Akamjibu’ huhifadhi muundo wa mazungumzo na kuonyesha kwamba Ayubu ndiye anayejibiwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo kama ‘BWANA.’
- source_word: אֶת
  choice: '[halijatafsiriwa moja kwa moja]'
  rationale: אֶת ni kiashiria cha shamirisho tendwa katika Kiebrania; Kiswahili hakihitaji neno tofauti hapa, kwa kuwa kiambishi ‘-m-’ katika ‘akamjibu’ tayari humrejelea Ayubu kama shamirisho.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: ‘Ayubu’ ni umbo la jina hili lililozoeleka katika Kiswahili sanifu.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: אמר ni kitenzi cha kawaida chenye maana ya ‘kusema.’ Kutafsiri ‘akasema’ huhifadhi kitenzi cha pili cha usemi kilichopo wazi katika matini ya Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ina jina binafsi la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo; tanbihi inataja umbo jingine la kawaida bila kudai uhakika usiokuwapo kuhusu matamshi ya kale.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye heshima. ‘Ndipo ... akamjibu ... akasema’ hudumisha mfululizo wa masimulizi wa Kiebrania na fomula yake ya usemi bila kusikika kuwa ya kigeni kupita kiasi.
