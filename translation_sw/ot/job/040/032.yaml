  text: שִׂים עָלָ֥י/ו כַּפֶּ֑/ךָ זְכֹ֥ר מִ֝לְחָמָ֗ה אַל תּוֹסַֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: sw
  text: Weka mkono wako juu yake; kumbuka pambano hilo—usirudie tena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “usiongeze”; maana yake hapa ni “usirudie tena,” au huenda, “hutarudia tena.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים
  choice: Weka
  rationale: Kauli ya amri ya שׂים ina maana ya kuweka; hapa inaeleza tendo la kuweka mkono juu ya Leviathani.
- source_word: עָלָיו
  choice: juu yake
  rationale: עַל pamoja na kiambishi cha nafsi ya tatu ya kiume umoja kwa kawaida ni ‘juu yake’; inahifadhi taswira ya kimwili ya kumgusa au kumshika.
- source_word: כַּפֶּךָ
  choice: mkono wako
  rationale: כַּף inaweza kumaanisha kiganja au mkono; ‘mkono wako’ ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: זְכֹר
  choice: kumbuka
  rationale: Kauli ya amri ya זכר imetafsiriwa moja kwa moja, ikihifadhi nguvu ya onyo.
- source_word: מִלְחָמָה
  choice: pambano hilo
  rationale: Neno linaweza kumaanisha vita au pambano; ‘pambano’ linafaa kwa kukabiliana na kiumbe mmoja, na ‘hilo’ hufanya rejeo hilo lieleweke kwa kawaida.
- source_word: אַל תּוֹסַף
  choice: usirudie tena
  rationale: Kihalisi ni ‘usiongeze’; katika muktadha huu ni nahau inayokataza kurudia tendo lililotajwa.
