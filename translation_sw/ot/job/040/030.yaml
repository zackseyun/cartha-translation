  text: Je, wafanyabiashara watapiga bei kwa ajili yake?[a] Je, watamgawana miongoni mwa wachuuzi?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, washirika watafanya karamu juu yake?” Kiebrania cha kishazi cha kwanza ni kigumu, na wengine huchukua חַבָּרִים kwa maana isiyo ya kibiashara.
    reason: alternative_reading
  - marker: b
    text: Kiebrania ni “Wakanaani”; katika muktadha huu huenda neno hilo linamaanisha “wachuuzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ
  choice: watafanya biashara
  rationale: Kitenzi kina maana ya msingi ya ‘kuchimba,’ lakini hapa, pamoja na wahusika wa kibinadamu na mstari sambamba wa kibiashara, kinaeleweka kiidioma kuwa kufanya biashara au mapatano kuhusu kiumbe huyo.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kihusishi kinaonyesha kwamba mazungumzo au biashara hiyo inamhusu kiumbe huyo; ‘juu yake’ huhifadhi muundo na maana hiyo kwa Kiswahili.
- source_word: חַבָּרִים
  choice: wafanyabiashara
  rationale: Neno hilo linaweza kumaanisha washirika au marafiki, lakini usambamba na wachuuzi katika kishazi cha pili unaunga mkono maana ya kibiashara.
- source_word: יֶחֱצוּהוּ
  choice: watamgawana
  rationale: Kitenzi kinamaanisha kugawa. ‘Watamgawana’ kinaonyesha kugawanya kiumbe huyo kati ya watu bila kuamua wazi kama ni kumkatakata au kugawa kama bidhaa.
- source_word: בֵּין
  choice: miongoni mwa
  rationale: Kwa kundi la watu wengi, ‘miongoni mwa’ ni Kiswahili cha kawaida kinacholeta maana ya usambazaji ndani ya kundi.
- source_word: כְּנַעֲנִים
  choice: wachuuzi
  rationale: Ingawa kwa umbo ni ‘Wakanaani,’ katika muktadha huu linaonekana kutumiwa kwa maana ya wafanyabiashara; ‘wachuuzi’ pia huepuka kurudia neno la kishazi cha kwanza.
