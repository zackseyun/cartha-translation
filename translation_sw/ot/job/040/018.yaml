  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
translation:
  language: sw
  text: Mifupa yake ni mirija ya shaba[a]; mifupa yake ni kama pau za chuma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mifupa yake ni mifereji ya shaba.” Neno la Kiebrania linaweza kumaanisha mifereji, njia za kupitishia kitu, au mirija.
    reason: lexical_alternative
  - marker: b
    text: Au, “mifupa yake ni kama vitu vya chuma vilivyomiminwa.” Neno lililotafsiriwa “mifupa” linaweza pia kumaanisha umbo au kiunzi cha mwili, na neno lililotafsiriwa “pau” linaweza kurejelea kitu cha metali kilichomiminwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: mifupa yake
  rationale: Maana ya kawaida ya עֶצֶם ni ‘mfupa’; pia inafaa katika usambamba na גְּרָמָיו.
- source_word: אֲפִיקֵי
  choice: kama mirija ya
  rationale: אֲפִיקִים inaweza kumaanisha mifereji au njia za kupitishia kitu; ‘mirija’ huhifadhi picha ya maumbo makubwa yenye nguvu. Neno ‘kama’ limeongezwa ili picha ya kishairi isisikike kana kwamba mifupa hiyo ni shaba halisi.
- source_word: נְחוּשָׁה
  choice: shaba
  rationale: Katika Kiswahili cha kawaida ‘shaba’ ni neno linaloeleweka kwa metali hii na linafaa katika picha ya kishairi ya nguvu, ingawa neno la Kiebrania linaweza kurejelea shaba au aloi yake.
- source_word: גְּרָמָיו
  choice: viungo vyake
  rationale: גֶּרֶם inaweza kumaanisha mifupa au sehemu za mwili. ‘Viungo’ huhifadhi utofauti wa kishairi wa mstari wa pili bila kurudia tu ‘mifupa,’ huku uwezekano wa ‘mifupa’ ukibainishwa katika tanbihi.
- source_word: כִּמְטִיל
  choice: ni kama fito za
  rationale: מָטִיל huelekeza kwenye kitu cha metali kilichotengenezwa au kumiminwa; ‘fito’ huwasilisha kwa Kiswahili picha ya ugumu na uimara katika muktadha huu.
- source_word: בַּרְזֶל
  choice: chuma
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa בַּרְזֶל, na linaendana na picha ya shaba katika sehemu ya kwanza.
