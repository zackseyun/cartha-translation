base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: sw
  text: Tazama sasa Behemothi[a], ambaye nilimwumba pamoja nawe; yeye hula nyasi kama ng'ombe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnyama.” Wafafanuzi wengi hulielewa “Behemothi” kuwa jina au istilahi ya kiumbe fulani; wengine humtambua kuwa kiboko au mnyama mwingine mkubwa.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Sasa mtazame
  rationale: Muungano huu unavuta fikira kwa msisitizo wa papo hapo. ‘Sasa mtazame’ ni wa kawaida na wenye hadhi katika Kiswahili, huku ukihifadhi nguvu ya usemi unaoelekeza umakini.
- source_word: בְהֵמוֹת
  choice: Behemothi
  rationale: Katika muktadha huu neno linafanya kazi kama jina au designation ya kiumbe fulani mkubwa. Kulitohoa kama ‘Behemothi’ kunahifadhi upekee wake bila kulazimisha utambulisho wa mnyama fulani.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: niliyemuumba
  rationale: Kitenzi עשה humaanisha kufanya au kuumba; hapa ‘kuumba’ kinafaa kwa sababu Mungu anazungumzia uumbaji wake. Kiambishi cha ngeli ya viumbe hai kinatoa Kiswahili cha asili.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: Huhifadhi maana ya uandamani au uhusiano wa viumbe wote wawili kuwa kazi ya Mungu, bila kudokeza lazima ukaribu wa mahali.
- source_word: חָצִיר
  choice: majani
  rationale: Neno hutaja nyasi au mimea inayoliwa. ‘Majani’ ni usemi wa kawaida wa Kiswahili kwa chakula cha mnyama katika sentensi hii.
- source_word: כַּבָּקָר
  choice: kama ng’ombe
  rationale: בקר linaweza kuwa jina la jumla kwa ng’ombe. Kiswahili ‘ng’ombe’ huhifadhi ulinganisho bila kubainisha isivyohitajika kwamba ni dume.
- source_word: יֹאכֵל
  choice: yeye hula
  rationale: Kitenzi cha Kiebrania ni umoja wa kiume. ‘Yeye hula’ humrejelea wazi kiumbe huyo na kuhifadhi msisitizo wa maelezo.
theological_decisions:
- issue: Utambulisho wa בְהֵמוֹת
  choice: Kulihifadhi kama jina/designation ‘Behemothi’ katika matini kuu.
  alternative: Kutafsiri ‘mnyama mkubwa’ au kulitambulisha moja kwa moja kuwa kiboko au mnyama mwingine.
  rationale: Kiebrania na muktadha wa kishairi vinamwasilisha kiumbe wa pekee lakini havimtambulishi wazi kwa spishi inayojulikana. Utohozi huhifadhi utata huo halisi na huepuka kuingiza hitimisho la mfasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mtazame’ linamwelekeza Ayubu kumwangalia kiumbe hai; ‘Behemothi’ limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili. Alama ya tanbihi [a] imewekwa katika matini kuu.
