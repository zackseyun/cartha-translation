  yaml_path: translation/ot/job/040/021.yaml
  text: Under the lotus trees he lies down[a], in the shelter of the reeds and the marsh.
translation:
  language: sw
  text: Hujilaza chini ya miti ya lotus[a], mafichoni mwa matete na kinamasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miti yenye kivuli.” Aina kamili ya mti unaotajwa na neno hili la Kiebrania haijulikani kwa uhakika; “miti ya lotus” ni utambulisho unaokubalika na wengi kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: chini ya
  rationale: Kihusishi hiki kinaonyesha mahali palipo chini ya kitu; “chini ya” ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: צֶאֱלִים
  choice: miti ya lotus
  rationale: Neno hili linaeleweka kwa kawaida kuwa aina fulani ya miti yenye kivuli, huenda miti ya lotus, katika mazingira ya kandokando ya maji. Utambulisho kamili wa mmea huu hauna uhakika, hivyo maana mbadala imehifadhiwa katika tanbihi.
- source_word: יִשְׁכָּב
  choice: hujilaza
  rationale: Kitenzi cha Kiebrania kinaweza kueleza tendo la kawaida katika muktadha huu. “Hujilaza” linaonyesha wazi hali ya mnyama kupumzika akiwa amelala.
- source_word: בְּסֵתֶר
  choice: mafichoni mwa
  rationale: סֵתֶר humaanisha mahali pa kujificha, kinga, au sehemu iliyofunikwa. “Mafichoni mwa” ni usemi wa asili unaohifadhi picha ya kufichwa na mimea.
- source_word: קָנֶה
  choice: matete
  rationale: Ingawa umbo la Kiebrania ni la umoja, hapa linaweza kuwa nomino ya jumla inayotaja uoto wa matete kwa pamoja.
- source_word: וּבִצָּה
  choice: na bwawa
  rationale: בִּצָּה hutaja eneo la majimaji au kinamasi. “Bwawa” ni neno linaloeleweka kwa urahisi na linafaa katika picha ya makazi yenye maji, bila kusisitiza matope kupita kiasi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “hujilaza” kuonyesha tendo la kawaida, na “mafichoni mwa” kudumisha picha ya kujisitiri katika uoto wa kandokando ya maji.
