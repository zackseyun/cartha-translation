translation:
  language: sw
  text: Wafiche pamoja mavumbini[a]; funga nyuso zao mahali palipofichika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wazike pamoja mavumbini.” Kitenzi cha Kiebrania kinaweza kumaanisha “ficha,” lakini katika muktadha huu kinaweza kudokeza maziko.
    reason: lexical_alternative
  - marker: b
    text: Au, “funga nyuso zao kwa siri” au “mafichoni.” Maneno ya mwisho katika Kiebrania ni magumu; yaelekea yanarejelea mahali palipofichika na yanatoa mwangwi wa kitenzi “ficha” kilicho mwanzoni mwa mstari.
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: Wafiche
  rationale: Kitenzi טמן kimsingi humaanisha kuficha au kusitiri. Katika muktadha wa mavumbi kinaweza pia kudokeza kuzika, lakini “wafiche” huhifadhi maana ya msingi bila kufunga tafsiri hiyo kwenye wazo la maziko pekee.
- source_word: בֶּעָפָר
  choice: mavumbini
  rationale: עָפָר ni mavumbi au udongo uliolegea. “Mavumbini” ni usemi mfupi wa kishairi unaofaa pia taswira ya kifo katika muktadha huu.
- source_word: יָחַד
  choice: pamoja
  rationale: Neno hili linaonyesha kwamba wote watendewe jambo hilo kwa pamoja.
- source_word: פְּנֵיהֶם
  choice: nyuso zao
  rationale: Tafsiri halisi ya wingi huu ni “nyuso zao.” Taswira hiyo ya wazi imehifadhiwa badala ya kuibadili kuwa “wao wenyewe.”
- source_word: חֲבֹשׁ
  choice: zifunge
  rationale: חבשׁ humaanisha kufunga, ingawa hapa inaweza pia kudokeza kuzuia au kufungia. “Zifunge” huhifadhi kiini cha kitenzi na inaelekezwa kwa “nyuso zao.”
- source_word: בַּטָּמוּן
  choice: mahali palipofichika
  rationale: Huenda ni matumizi ya nomino ya kitu au mahali palipofichwa, kutoka mzizi uleule טמן uliotumiwa mwanzoni mwa mstari. Tafsiri hii huhifadhi mwangwi wa “wafiche” bila kuongeza wazo la giza lisilotajwa wazi.
