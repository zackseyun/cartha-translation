translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye heshima. Amri za umoja zinaonyesha kwamba Mungu anamwelekeza Ayubu. Taswira halisi ya kuficha, mavumbi, nyuso na kufunga imehifadhiwa; utata wa uwezekano wa maziko na wa kishazi cha mwisho umewekwa katika tanbihi.
