  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali ya balagha yamewekwa wazi kwa ‘Je,’ na sentensi imebaki fupi kama Kiebrania. Ugumu wa ‘kutoboa pua kwa mitego’ haujarekebishwa kimyakimya; umehifadhiwa na kufafanuliwa katika tanbihi.
