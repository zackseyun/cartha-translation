  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: sw
  text: Je, mtu anaweza kumkamata mbele ya macho yake? Je, anaweza kutoboa pua yake kwa mitego?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, atamkamata mbele ya macho yake? Je, atatoboa pua yake kwa mitego?” Kiebrania ni kifupi na kigumu; vitenzi vinaweza kueleweka bila kuongezwa mhusika wa jumla, “mtu.”
    reason: alternative_reading
  - marker: b
    text: Kiebrania, “kwa mitego.” Tafsiri za jadi wakati mwingine hutumia taswira iliyo karibu na “ndoana,” lakini nomino hiyo kwa kawaida humaanisha mitego au tanzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: huku akitazama
  rationale: Kirai hiki kihalisi kinahusisha ‘macho yake’ na hapa kinaeleweka kuwa kumkamata mnyama akiwa anaona kinachofanywa. ‘Huku akitazama’ ni Kiswahili cha kawaida kinachohifadhi wazo la tendo kufanywa wazi mbele yake.
- source_word: יִקָּחֶנּוּ
  choice: mtu anaweza kumkamata
  rationale: Kitenzi לקח kwa msingi ni ‘chukua,’ lakini katika muktadha wa kuwinda mnyama kinamaanisha kumkamata. Muundo wa swali la balagha unaendana na changamoto ya Mungu kuhusu nguvu za Behemothi, ingawa Kiebrania hakitaji wazi neno ‘mtu.’
- source_word: בְּמוֹקְשִׁים
  choice: kwa mitego
  rationale: מוֹקֵשׁ kwa kawaida ni mtego au tanzi, si ndoana. ‘Mitego’ huhifadhi maana ya kawaida ya nomino hiyo, licha ya ugumu wa taswira ya kutoboa pua kwa mitego.
- source_word: יִנְקָב
  choice: kutoboa
  rationale: נקב humaanisha kutoboa au kupenya kwa kutengeneza tundu. ‘Kutoboa’ ni neno la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: אָף
  choice: pua
  rationale: Hapa אַף ina maana halisi ya sehemu ya mwili, si hasira. ‘Pua’ ni pana na ya kawaida zaidi kuliko ‘tundu la pua.’
