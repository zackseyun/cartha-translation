base_translation:
  language: en
  yaml_path: translation/ot/job/040/029.yaml
  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: sw
  text: Je, utacheza naye kama ndege,[a] au utamfunga kwa ajili ya wasichana wako?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama vile unavyocheza na ndege.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wanawake wako vijana”; neno la Kiebrania linaweza pia kumaanisha wanawali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: utacheza
  rationale: Kitenzi שׂחק katika Qal kinaweza kumaanisha kucheza au kufanya kitu kuwa mchezo; “utacheza” ni Kiswahili cha kawaida na kinafaa kwa picha ya kumfanya mnyama kuwa kipenzi au kitu cha kuchezea.
- source_word: בּוֹ
  choice: naye
  rationale: Kiwakilishi ni cha kiume, umoja, na kinamrejelea Leviathani; “naye” huhifadhi urejeo huo kwa njia ya asili katika Kiswahili.
- source_word: כַּצִּפּוֹר
  choice: kama ndege
  rationale: צִפּוֹר ni neno la kawaida kwa ndege, mara nyingi ndege mdogo; “kama ndege” huhifadhi tashbihi bila kuongeza maelezo yasiyokuwamo wazi katika Kiebrania.
- source_word: וְתִקְשְׁרֶנּוּ
  choice: au utamfunga
  rationale: קשר humaanisha kufunga au kutia kifungoni. Katika maswali haya mawili ya balagha, kiunganishi kinaeleweka kwa asili kuwa “au” katika Kiswahili.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: kwa ajili ya wasichana wako
  rationale: נַעֲרוֹת ni wingi wa kike unaoweza kumaanisha wasichana, mabinti, au wanawake vijana; “wasichana wako” ni ya sasa, wazi, na haiongezi kwa lazima uhusiano wa kifamilia.
