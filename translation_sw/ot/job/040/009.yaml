  text: Au je, una mkono kama wa Mungu[a]? Na je, unaweza kunguruma kwa sauti kama yake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwezekano mdogo zaidi, “kama wa mungu,” ikiwa אֵל ingeeleweka kwa maana ya jumla; muktadha unaunga mkono sana “Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Au una
  rationale: Katika mfululizo huu wa maswali ya changamoto, “Au” linaendeleza hoja kwa njia ya kawaida katika Kiswahili kuliko tafsiri ya moja kwa moja “Na ikiwa.”
- source_word: זְרוֹעַ
  choice: mkono
  rationale: Neno hilo humaanisha kihalisi mkono na hapa ni taswira ya nguvu; kuhifadhi “mkono” kunatunza sitiari ya Kiebrania.
- source_word: כָּאֵל
  choice: kama wa Mungu
  rationale: 'Muundo huu unaendeleza nomino “mkono”: mkono kama wa Mungu. Muktadha wa Mungu anayemhoji Ayubu unaunga mkono rejeo mahususi kwa Mungu.'
- source_word: לָךְ
  choice: una
  rationale: Ingawa kihalisi ni “kwako,” katika kishazi hiki humaanisha kuwa na kitu; “una” ni Kiswahili cha kawaida na sahihi.
- source_word: וּבְקוֹל
  choice: nawe ... kwa sauti
  rationale: Herufi ב inaonyesha njia au chombo hapa; “kwa sauti” huonyesha kwamba kunguruma kunafanywa kwa sauti.
- source_word: כָּמֹהוּ
  choice: kama yake
  rationale: Kiambishi kinamrejelea Mungu, na kwa kuwa kinacholinganishwa ni sauti, “kama yake” ni muundo wa kawaida wa Kiswahili.
- source_word: תַרְעֵם
  choice: unaweza kunguruma
  rationale: Hifili ya רעם huonyesha kutoa au kusababisha ngurumo. “Unaweza kunguruma” huhifadhi swali kuhusu uwezo na mwangwi wa dhoruba unaohusishwa na sauti ya Mungu.
theological_decisions:
- issue: Rejeo la אֵל katika ulinganisho wa kimungu
  choice: Mungu
  alternative: mungu fulani
  rationale: Katika muktadha wa karibu, Mungu wa Israeli ndiye anayesema na kumhoji Ayubu kuhusu sifa za kimungu. “Mungu” hudumisha maana iliyo wazi zaidi bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa, pamoja na taswira halisi ya “mkono” na lugha ya ngurumo.
