  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: sw
  text: Tawanya mawimbi ya hasira yako,[a] umtazame kila mwenye kiburi na umshushe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwaga mafuriko ya hasira yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: Tawanya
  rationale: Kitenzi cha amri kina wazo la kutawanya au kueneza kwa nguvu; “tawanya” kinafuata maana ya msingi ya Kiebrania na kinaendana na wingi wa “milipuko.”
- source_word: עֶבְרוֹת אַפֶּךָ
  choice: milipuko ya hasira yako
  rationale: Wingi עֶבְרוֹת unaonyesha mawimbi au milipuko mikali ya ghadhabu, huku אַף hapa ikiwa nahau ya hasira, si pua kwa maana halisi.
- source_word: וּרְאֵה
  choice: umtazame
  rationale: Amri hii inamaanisha kumwelekezea mtu macho kwa makusudi, si kuona tu kwa kawaida.
- source_word: כָל גֵּאֶה
  choice: kila mwenye kiburi
  rationale: 'Kivumishi cha umoja kilichotumiwa kama nomino kina maana gawanyifu: kila mtu mwenye kiburi.'
- source_word: וְהַשְׁפִּילֵהוּ
  choice: na umshushe
  rationale: Hifili ya שׁפל ni kumfanya mtu awe chini. “Umshushe” ni ya picha na huhifadhi ulinganifu wa kishairi kati ya kiburi na kushushwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Muundo wa umoja katika “kila mwenye kiburi ... umshushe” umehifadhiwa ili kuonyesha kwamba kila mwenye kiburi anatajwa mmoja mmoja.
