  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la agano limetafsiriwa kwa desturi iliyozoeleka ya Biblia za Kiswahili, kwa herufi kubwa ili kulitofautisha.
- source_word: הַשָּׂטָן
  choice: Mshitaki
  rationale: Katika muktadha wa utangulizi wa Ayubu, nomino hii ina kiambishi cha uhusiano na inaonyesha cheo au jukumu la anayeshtaki, si lazima jina maalumu.
- source_word: הִנּוֹ
  choice: Tazama
  rationale: Inahifadhi usemi wa kuvuta fikira na kusisitiza idhini inayofuata.
- source_word: בְיָדֶךָ
  choice: yuko mkononi mwako
  rationale: Inahifadhi nahau ya Kiebrania inayomaanisha kuwekwa chini ya mamlaka au uwezo wa mwingine, nayo pia ni ya kawaida kwa Kiswahili.
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: Neno linaweza kumaanisha uhai wake au yeye mwenyewe; 'nafsi yake' huhifadhi kwa kiasi fulani upana huo wa kisemantiki.
- source_word: שְׁמֹר
  choice: uihifadhi hai
  rationale: Amri ya kulinda au kuhifadhi hapa, kwa kuhusishwa na נֶפֶשׁ, inaweka mpaka kwamba Ayubu asiuwawe.
theological_decisions:
- issue: Utambulisho wa הַשָּׂטָן
  choice: Mshitaki
  alternative: Shetani
  rationale: Kiambishi הַ־ na kazi ya mhusika katika kikao cha mbinguni vinaunga mkono tafsiri ya cheo; uchaguzi huu haushurutishi mapema utambulisho wa baadaye wa kitheolojia.
- issue: Maana ya נַפְשׁוֹ שְׁמֹר
  choice: ila uihifadhi hai nafsi yake
  alternative: ila usiutoe uhai wake
  rationale: Tafsiri iliyochaguliwa inadumisha amri chanya ya Kiebrania na neno 'nafsi', huku 'hai' ikifanya mpaka wa kutomuua uwe wazi kwa msomaji wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. Muundo wa Kiebrania umehifadhiwa pale unapokuwa wa kawaida kwa Kiswahili; sentensi haijatumia istilahi ya kimadhehebu.
