base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: sw
  text: Ndipo Mshitaki akamjibu YAHWE, akasema[a], “Ngozi kwa ngozi!”[b] Naam, kila kitu alicho nacho mtu atakitoa kwa ajili ya uhai wake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Shetani”; Kiebrania kina umbo linalofanana na cheo, “mshitaki/mpinzani.”
    reason: alternative_reading
  - marker: b
    text: “Ngozi kwa ngozi” ni usemi wa kimethali ambao maana yake kamili si hakika. Huenda unamaanisha kwamba mtu atatoa kitu kimoja ili kuokoa uhai wake.
    reason: cultural_note
  - marker: c
    text: Au “nafsi yake” au “yeye mwenyewe.” Katika muktadha huu, “uhai wake” linafaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: Mshitaki
  rationale: Kibainishi cha Kiebrania kinaonyesha cheo au jukumu badala ya kulazimisha jina maalumu la baadaye; “Mshitaki” linafaa katika mazingira ya kimahakama ya utangulizi wa Ayubu.
- source_word: יְהוָה
  choice: YAHWE
  rationale: Linatunza jina la agano la Mungu badala ya kulibadilisha kwa cheo; herufi kubwa zinalifanya litambulike wazi kama jina la Mungu.
- source_word: עוֹר בְּעַד עוֹר
  choice: Ngozi kwa ngozi
  rationale: Linatunza usemi mfupi wa kimethali na fumbo halisi la Kiebrania bila kuufafanua kupita kiasi ndani ya matini.
- source_word: בְּעַד
  choice: kwa / kwa ajili ya
  rationale: Katika methali “kwa” ni fupi na la asili; katika kishazi kinachofuata “kwa ajili ya” linaeleza kwa uwazi thamani inayotolewa ili kuuhifadhi uhai.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ni ya umoja wa kiume, hapa inatumiwa kwa maana ya jumla kuhusu mwanadamu; “mtu” ni Kiswahili cha kawaida na sahihi kwa usemi huo wa jumla.
- source_word: נַפְשׁוֹ
  choice: uhai wake
  rationale: Katika muktadha huu neno linahusu kuendelea kuishi au maisha ya mtu, si lazima nafsi isiyo ya kimwili.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: kila kitu alicho nacho mtu
  rationale: Ni muundo wa kawaida wa Kiswahili unaowasilisha maana ya umiliki iliyo katika Kiebrania.
- source_word: יִתֵּן
  choice: atakitoa
  rationale: Wakati ujao wa jumla unafaa kwa dai la kimethali kuhusu jambo ambalo mtu yuko tayari kufanya; kiambishi cha kitu kinarejelea “kila kitu.”
theological_decisions:
- issue: Jinsi ya kutafsiri הַשָּׂטָן katika utangulizi wa Ayubu
  choice: Mshitaki
  alternative: Shetani
  rationale: Kiebrania kina kibainishi na kinamwonyesha mhusika kwa jukumu linalofanana na la mahakamani. Tafsiri ya cheo inalinda hali hiyo bila kukataa utambulisho unaoweza kufanywa katika mapokeo ya baadaye.
- issue: Maana ya נֶפֶשׁ katika dai la Mshitaki
  choice: uhai
  alternative: nafsi / yeye mwenyewe
  rationale: Hoja inahusu kile ambacho mtu atatoa ili asiangamie; “uhai” linafaa zaidi kimuktadha, huku uwezekano wa “nafsi” au “yeye mwenyewe” ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Ndipo ... akamjibu ... na kusema” unatilia maanani mfuatano wa masimulizi wa Kiebrania. Methali imeachwa kwa ufupi wake wa kifumbo, na ufafanuzi umewekwa katika tanbihi.
