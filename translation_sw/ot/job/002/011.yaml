base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: sw
  text: 'Marafiki watatu wa Ayubu waliposikia habari za maafa haya yote yaliyompata[a], wakaja, kila mmoja kutoka mahali pake: Elifazi Mtemani, Bildadi Mshuhi, na Sofari Mnaamathi. Walikubaliana pamoja[b] kuja kumwonea huruma[c] na kumfariji.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taabu hizi zote” au “misiba hii yote.” Neno la Kiebrania hapa linamaanisha maafa yaliyompata Ayubu, si uovu wa kimaadili alioutenda.
    reason: lexical_alternative
  - marker: b
    text: Au, “walikutana pamoja” au “walifanya miadi pamoja.” Kitenzi cha Kiebrania kinaonyesha uratibu wa makusudi.
    reason: lexical_alternative
  - marker: c
    text: Au, “kuomboleza pamoja naye.” Kitenzi cha Kiebrania kinaweza kumaanisha kuonyesha huruma au rambirambi, mara nyingi kwa kushiriki maombolezo ya mwenye kuteseka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: waliposikia
  rationale: Muundo wa kiwakati unaendeleza simulizi kwa Kiswahili cha kawaida na kuunganisha kusikia kwao na kuja kwao.
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: marafiki watatu wa Ayubu
  rationale: Huu ni uwasilishaji wa kawaida wa mnyororo wa umilikaji; רֵעִים hapa ni marafiki.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: maafa haya yote
  rationale: Katika muktadha huu רָעָה ni msiba au taabu iliyompata Ayubu, wala si uovu wa kimaadili alioutenda.
- source_word: הַבָּאָה עָלָיו
  choice: yaliyompata
  rationale: Kiswahili hiki cha asili kinaeleza kwa usahihi maafa yaliyomjia Ayubu bila kulazimisha sitiari ya mwendo.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: kila mmoja alitoka mahali pake akaja
  rationale: אִישׁ ina maana ya mgawanyo, 'kila mmoja'; tafsiri hii pia inaonyesha kwamba walitoka maeneo yao tofauti na kuja.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: Mtemani ... Mshuhi ... Mnaamathi
  rationale: 'Majina ya asili au maeneo yamewasilishwa kwa miundo ya Kiswahili inayotambulika: mtu wa Temani, Shuhi, na Naamathi.'
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: walipanga pamoja
  rationale: Nifali ya יעד inaonyesha uratibu au kufanya makubaliano ya kukutana; 'walipanga pamoja' ni ya asili na huhifadhi kusudi hilo.
- source_word: לָבוֹא
  choice: kuja
  rationale: Kitenzi-jina cha kusudi kimetafsiriwa moja kwa moja kwa kuzingatia mtazamo wa msimulizi.
- source_word: לָנוּד לוֹ
  choice: kumwonyesha huruma
  rationale: נוּד hapa ni kuonyesha hisia za kushiriki huzuni au rambirambi; uchaguzi huu unaitofautisha na kitenzi kinachofuata cha kufariji.
- source_word: וּלְנַחֲמוֹ
  choice: na kumfariji
  rationale: נחם katika shina hili humaanisha kufariji au kutuliza mwenye huzuni.
