base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: sw
  text: Yahwe akamwambia Mshitaki[a], “Unatoka wapi?” Mshitaki akamjibu Yahwe, akasema, “Nimetoka kuzurura duniani na kutembea huku na huku humo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ha-shetani” (yaani, “mshitaki”); hapa yaelekea ni cheo chenye maana ya “mshitaki” au “mpinzani,” si lazima jina maalumu.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili linalotambulika, badala ya kulibadilisha kuwa cheo kama ‘BWANA’.
- source_word: הַשָּׂטָן
  choice: Mshitaki
  rationale: Kibainishi cha Kiebrania kinaonyesha zaidi cheo au jukumu kuliko jina maalumu; ‘Mshitaki’ huhifadhi maana ya anayeshtaki katika mazingira ya baraza la mbinguni.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: Unatoka wapi?
  rationale: Ni swali la Kiswahili la kawaida linalohifadhi wazo la mahali alikotoka mhusika.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: akamjibu ... akasema
  rationale: Vitenzi vyote viwili vimehifadhiwa ili kufuata mtindo wa masimulizi wa Kiebrania bila kufanya Kiswahili kuwa kigumu.
- source_word: מִשֻּׁט
  choice: Nimetoka kuzurura
  rationale: ‘Kuzurura’ huonyesha kwenda huku na huku bila kuingiza wazo mahususi zaidi la kufanya doria.
- source_word: בָּאָרֶץ
  choice: duniani
  rationale: Katika muktadha huu אֶרֶץ inaelekea kumaanisha dunia, si nchi fulani.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: na kutembea huku na huku humo
  rationale: Kauli hii huhifadhi mwendo unaorudiwa huku na huku pamoja na kiwakilishi kinachorejelea dunia.
theological_decisions:
- issue: Iwapo הַשָּׂטָן itafsiriwe kama jina maalumu ‘Shetani’ au cheo/jukumu
  choice: Mshitaki
  alternative: Shetani; mpinzani
  rationale: Neno la Kiebrania lina kibainishi na katika Ayubu 1–2 linafanya kazi kama cheo katika baraza la mbinguni. Tafsiri hii haibainishi kimya kimya kwamba tayari ni jina maalumu, wala haiondoi uwezekano wa uhusiano na Shetani katika uelewa mpana wa Maandiko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetolewa kwa vitenzi vya mfululizo; ‘humo’ hurejelea dunia kwa uwazi. Alama ya tanbihi [a] imewekwa mara baada ya ‘Mshitaki’.
