  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: sw
  text: Nao wakaketi pamoja naye juu ya ardhi kwa siku saba na usiku saba, wala hakuna aliyemwambia neno lolote, kwa sababu waliona kwamba maumivu yake yalikuwa makubwa sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mateso yake yalikuwa makubwa sana,” au “uchungu wake ulikuwa mkubwa sana.” Neno la Kiebrania linaweza kumaanisha maumivu kwa upana, kutia ndani mateso ya mwili na uchungu wa moyoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: wakaketi
  rationale: Kitenzi ישׁב hapa kinaonyesha tendo halisi la kuketi katika muktadha wa maombolezo; “wakaketi” ni cha kawaida na huhifadhi uzito wa tukio.
- source_word: אִתּוֹ
  choice: pamoja naye
  rationale: Huhifadhi maana ya kuwa katika ushirika na Ayubu, wakiwa mbele yake kimwili.
- source_word: לָאָרֶץ
  choice: chini
  rationale: Katika muktadha wa mkao wa maombolezo, ארץ humaanisha ardhi wanayokalia; “chini” ni usemi wa asili katika Kiswahili.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: kwa siku saba na usiku saba
  rationale: Tafsiri ya moja kwa moja ni ya asili katika Kiswahili na huhifadhi kipindi kizima kilichotajwa.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: wala hakuna aliyemwambia neno lolote
  rationale: Muundo huu huonyesha ukimya kamili. “Neno lolote” huhifadhi msisitizo wa דָּבָר bila kuwa mgumu katika Kiswahili.
- source_word: כִּי רָאוּ
  choice: kwa sababu waliona
  rationale: כִּי hapa hutaja sababu ya wao kukaa kimya.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: kwamba maumivu yake yalikuwa makali sana
  rationale: כאב inaweza kumaanisha maumivu, mateso, au uchungu. “Maumivu yake” yanafaa katika muktadha wa maradhi ya mwili, huku “makali sana” kikitoa kwa Kiswahili cha asili nguvu ya גָדַל ... מְאֹד.
