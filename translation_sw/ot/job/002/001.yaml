  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: sw
  text: Tena ikawa siku moja, wana wa Mungu[a] walikuja kusimama mbele za Yahwe, na Mpinzani[b] pia akaja miongoni mwao kusimama mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Mungu.” Huenda usemi huu unawahusu viumbe wa mbinguni au washiriki wa baraza la mbinguni.'
    reason: lexical_alternative
  - marker: b
    text: 'Au “Shetani” au “Mshtaki.” Kiebrania kina kibainishi: “mpinzani huyo.” Hapa huenda neno hilo linatumika kama cheo chenye maana ya mpinzani au mshtaki.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Tena ikawa siku moja
  rationale: Mfumo huu unarudia tukio la Ayubu 1:6. “Tena” huonyesha kurudiwa kwa tukio, huku “ikawa siku moja” ikihifadhi ladha ya simulizi ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: wana wa Mungu
  rationale: Hili ni tafsiri ya karibu ya nahau ya Kiebrania na huhifadhi utata wake badala ya kuifasiri moja kwa moja kuwa “viumbe wa mbinguni” au washiriki wa baraza la mbinguni.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: kujihudhurisha mbele za Yahwe
  rationale: Katika mazingira ya mkutano wa kifalme au wa kimbingu, kitenzi kina maana ya kufika na kusimama tayari mbele ya mwenye mamlaka. “Kujihudhurisha” huwasilisha tendo la kufika rasmi, si kusimama tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA,” hivyo kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: הַשָּׂטָן
  choice: Mpinzani
  rationale: Kiebrania kina kibainishi, kwa hiyo hapa neno linaelekea kuwa cheo au jukumu. “Mpinzani” huhifadhi maana pana ya mzizi bila kulifanya moja kwa moja kuwa jina maalumu.
- source_word: בְּתוֹכָם
  choice: miongoni mwao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba Mpinzani alikuwamo katika kundi lililokusanyika.
theological_decisions:
- issue: Ikiwa הַשָּׂטָן litafsiriwe kama jina maalumu au cheo
  choice: Mpinzani
  alternative: Shetani; Mshtaki
  rationale: Kibainishi cha Kiebrania kinaashiria cheo au jukumu katika muktadha huu. “Mpinzani” huhifadhi ishara hiyo ya kisarufi na haileti kwa nguvu zaidi matumizi ya baadaye ya neno hilo kama jina maalumu.
- issue: Utambulisho wa בְּנֵי הָאֱלֹהִים
  choice: wana wa Mungu
  alternative: viumbe wa mbinguni; washiriki wa baraza la mbinguni
  rationale: Tafsiri ya karibu huhifadhi nahau na mvutano wa kitheolojia wa matini bila kuamua kimyakimya utambulisho wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mbele za” na “kujihudhurisha” huhifadhi mazingira rasmi ya mkutano bila kuwa ya kizamani kupita kiasi. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
