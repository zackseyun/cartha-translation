  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: sw
  text: Basi Mshitaki akatoka mbele za Yahweh, akampiga Ayubu kwa majipu makali kuanzia wayo wa mguu wake mpaka utosi wa kichwa chake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “yule Mshitaki”; kwa kawaida hutafsiriwa “Shetani.” Hapa neno lina kibainishi na huenda linatumika kama cheo, “Mshitaki.”'
    reason: alternative_reading
  - marker: b
    text: Au “kwa vidonda vibaya” au “kwa majipu mabaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: Mshitaki
  rationale: Neno la Kiebrania lina kibainishi na katika utangulizi wa Ayubu linaelekea kuwa cheo au jukumu. “Mshitaki” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kulifanya kimyakimya kuwa jina maalumu.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Muundo huu unamaanisha kutoka katika uwepo wa Yahweh; “mbele za” ni usemi wa asili wa Kiswahili unaodumisha taswira ya Kiebrania.
- source_word: וַיַּךְ
  choice: akampiga
  rationale: Kitenzi נכה humaanisha kupiga au kushambulia. “Akampiga” huhifadhi tendo la moja kwa moja na ni Kiswahili cha sasa.
- source_word: בִּשְׁחִין רָע
  choice: kwa majipu mabaya
  rationale: שְׁחִין hurejelea vidonda vya ngozi vilivyovimba, mara nyingi majipu; רָע hapa huonyesha ukali au ubaya wa maradhi, si uovu wa kimaadili.
- source_word: מִכַּף רַגְלוֹ
  choice: kuanzia wayo wa mguu wake
  rationale: כַּף inapohusishwa na mguu ni wayo. “Kuanzia” huonyesha kikomo cha kwanza cha maradhi kwa Kiswahili cha kawaida.
- source_word: עַד קָדְקֳדוֹ
  choice: mpaka utosi wa kichwa chake
  rationale: קָדְקֹד ni sehemu ya juu kabisa ya kichwa; “utosi wa kichwa” ni sawa sahihi na inayoeleweka.
theological_decisions:
- issue: Utafsiri wa הַשָּׂטָן katika utangulizi wa Ayubu
  choice: Mshitaki
  alternative: Shetani
  rationale: Kibainishi cha Kiebrania kinaashiria cheo au jukumu katika muktadha huu. “Mshitaki” huhifadhi mvutano huo bila kuingiza mapema dhana ya baadaye kwamba hapa tayari ni jina maalumu; tafsiri ya jadi imewekwa tanbihini.
- issue: Utafsiri wa יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mbele za Yahweh” na “way[o] wa mguu” ni misemo inayoeleweka kwa wasomaji wa kawaida; “majipu mabaya” huhifadhi upana na ukali wa ugonjwa bila kuufafanua kupita ushahidi wa maandishi.
