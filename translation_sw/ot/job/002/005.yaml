base_translation:
  language: en
  yaml_path: translation/ot/job/002/005.yaml
  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: sw
  text: Lakini, tafadhali, nyosha mkono wako na uguse mfupa wake na nyama yake; hakika atakulaani[a] waziwazi mbele yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana halisi ni “atakubariki”; hapa kitenzi hicho kimetumiwa kwa namna ya staha kumaanisha “atakulaani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Lakini
  rationale: Kiunganishi hiki kinaanzisha hoja ya kupinga inayotolewa na Shetani; “Lakini” ni ya kawaida na inabeba nguvu inayofaa.
- source_word: שְׁלַח נָא יָדְךָ
  choice: tafadhali, nyosha mkono wako
  rationale: Nahau ya Kiebrania ya ‘kutuma mkono’ humaanisha kuunyosha ili kutenda jambo dhidi ya mtu. “Tafadhali” linaakisi chembe ya ombi נָא bila kupunguza ujasiri wa changamoto hiyo.
- source_word: וְגַע
  choice: uguse
  rationale: Kitenzi hiki humaanisha moja kwa moja ‘gusa,’ ingawa katika muktadha huu mguso huo ni wa kumdhuru. Tafsiri hii inadumisha taswira ya Kiebrania bila kuficha maana ya muktadha.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: mfupa wake na nyama yake
  rationale: Maneno ya umoja yanatumiwa kwa maana ya kijumla kuhusu mwili wa Ayubu. Taswira halisi ya mfupa na nyama imehifadhiwa badala ya kufupishwa kuwa ‘mwili wake.’
- source_word: אִם לֹא
  choice: hakika ata-
  rationale: Katika muundo huu wa kiapo au msisitizo, maneno haya si sharti la kawaida bali ni dai lenye uhakika mkubwa.
- source_word: אֶל פָּנֶיךָ
  choice: waziwazi mbele yako
  rationale: Nahau hiyo inaeleza tendo la moja kwa moja na la wazi mbele ya Mungu. Kiswahili hiki ni cha asili zaidi kuliko tafsiri neno kwa neno ‘kwa uso wako,’ huku kikihifadhi maana yake.
- source_word: יְבָרֲכֶךָּ
  choice: atakulaani
  rationale: Ingawa ברך kwa kawaida humaanisha ‘bariki,’ hapa limetumiwa kwa namna ya staha badala ya kusema ‘laani.’ Muktadha wa changamoto ya Shetani unadai maana hasi; umbo halisi limeelezwa katika tanbihi.
theological_decisions:
- issue: Matumizi ya kistaha ya ברך katika masimulizi ya kujaribiwa kwa Ayubu
  choice: Kutafsiri “atakulaani” katika andiko kuu
  alternative: Kutafsiri neno kwa neno “atakubariki” na kueleza maana yake katika tanbihi
  rationale: Shetani anadai kwamba mateso yatamfanya Ayubu amkatae Mungu kwa uhasama. “Atakubariki” lingempotosha msomaji wa sasa, lakini maana ya kawaida ya neno la Kiebrania imehifadhiwa katika tanbihi ili kuweka uwazi na mvutano wa maandishi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha taswira halisi ya ‘mfupa na nyama,’ lakini nahau ya ‘kwa uso wako’ imetolewa kwa Kiswahili cha asili zaidi: ‘waziwazi mbele yako.’'
