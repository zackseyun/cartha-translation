base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: sw
  text: Lakini akamwambia, “Unasema kama mmoja wa wanawake wapumbavu asemavyo. Je, tupokee mema kutoka kwa Mungu, na tusipokee mabaya[a]?” Katika hayo yote Ayubu hakutenda dhambi kwa midomo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taabu”; kwa tafsiri ya jadi, “uovu.” Neno la Kiebrania hapa linamaanisha hali za madhara au taabu, kinyume cha “mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: Unasema kama asemavyo mmoja wa wanawake wapumbavu
  rationale: Neno נְבָלוֹת linaonyesha upumbavu wenye uzito wa kimaadili na kidini, si ukosefu wa akili tu. “Wapumbavu” ni lugha ya kawaida inayohifadhi uzito huo; “wanawake” inaeleweka kutokana na umbo la kike la Kiebrania na muktadha.
- source_word: גַּם אֶת־הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: Je, tupokee mema kutoka kwa Mungu
  rationale: Kitenzi נְקַבֵּל kinafanya kazi ndani ya swali la balagha linalounganishwa na kishazi kinachofuata. “Mema” huhifadhi wazo pana la mambo mema au baraka.
- source_word: וְאֶת־הָרָע לֹא נְקַבֵּל
  choice: lakini tusipokee mabaya
  rationale: Katika muktadha huu רָע ni kinyume cha mema na inaelekea kumaanisha hali mbaya, madhara, au taabu, si lazima uovu wa kimaadili. “Mabaya” huhifadhi ulinganifu wa moja kwa moja na “mema,” huku tanbihi ikifafanua uwezekano wa maana.
- source_word: בְּכָל־זֹאת
  choice: Katika hayo yote
  rationale: Hii ni tafsiri ya kawaida na ya asili ya muhtasari wa msimulizi bila kuongeza wazo la ‘licha ya’ ambalo halijasemwa wazi.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: Ayubu hakutenda dhambi kwa midomo yake
  rationale: Tafsiri hii huhifadhi taswira halisi ya “midomo” na kuacha wazi msisitizo wa msimulizi kwamba tathmini hii inahusu hasa maneno ya Ayubu.
theological_decisions:
- issue: Maana ya הָרָע kuhusiana na Mungu
  choice: mabaya
  alternative: taabu; uovu
  rationale: Muktadha unatofautisha mambo mazuri na hali zenye madhara zinazompata mtu. “Mabaya” huhifadhi mvutano na ulinganifu wa Kiebrania bila kudai wazi kwamba Mungu ndiye mtendaji wa uovu wa kimaadili. Tanbihi inaonyesha maana ya kimuktadha na tafsiri ya jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa, pamoja na taswira ya “midomo yake.”
