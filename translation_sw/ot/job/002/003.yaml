source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: sw
  text: Ndipo Yahweh akamwambia Mshtaki[a], “Je, umemwangalia kwa makini mtumishi wangu Ayubu?[b] Kwa maana hakuna mtu mwingine kama yeye duniani—mtu asiye na lawama na mnyofu, anayemcha Mungu na kujiepusha na uovu. Bado anashikilia uadilifu wake, ingawa ulinichochea dhidi yake ili nimwangamize bure[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: ha-satan, yaani “Mshtaki”; kwa mapokeo, “Shetani.”'
    reason: alternative_reading
  - marker: b
    text: Kiebrania kwa maana halisi, “Je, umeweka moyo wako kwa mtumishi wangu Ayubu?”
    reason: lexical_alternative
  - marker: c
    text: “Bure” pia inaweza kumaanisha “bila sababu,” na huenda inarudia kwa makusudi Ayubu 1:9, ambako Mshtaki anauliza kama Ayubu anamcha Mungu “bure.” Kitenzi “nimwangamize” kwa maana halisi ni “nimmeze.”
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: הַשָּׂטָן
  choice: Mshtaki
  rationale: Kibainishi cha Kiebrania kinaonyesha cheo au jukumu katika simulizi hili, si lazima jina maalumu; “Mshtaki” pia huhifadhi maana ya kimahakama na upinzani.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: umeweka moyo wako kwa
  rationale: Huhifadhi kwa karibu taswira ya Kiebrania ya ‘kuweka moyo’ huku tanbihi ikitoa maana ya kawaida zaidi ya ‘kumwangalia kwa makini/kumfikiria.’
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Huwasilisha uhusiano wa Ayubu kuwa wa Mungu na kumtumikia bila kusisitiza isivyohitajika hali ya utumwa.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: hakuna mtu mwingine kama yeye duniani
  rationale: “Duniani” inafaa upeo mpana wa tukio la simulizi kuliko “katika nchi.”
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: mtu asiye na lawama na mnyofu
  rationale: “Asiye na lawama” huonyesha ukamilifu wa mwenendo na uadilifu, si dai la kutokuwa na dhambi kabisa; “mnyofu” ni Kiswahili cha kawaida kwa יָשָׁר.
- source_word: יְרֵא אֱלֹהִים
  choice: anayemcha Mungu
  rationale: Huhifadhi nguvu ya kitenzi na wazo la hofu yenye heshima kwa Mungu.
- source_word: וְסָר מֵרָע
  choice: na kujiepusha na uovu
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha mwenendo wa kuondoka au kukaa mbali na uovu.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: Bado anashikilia uadilifu wake
  rationale: “Anashikilia” huonyesha uthabiti wa מחזיק, na “uadilifu” huonyesha ukamilifu wa tabia unaohusiana na תָּם.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: ingawa ulinichochea dhidi yake
  rationale: Huhifadhi moja kwa moja wakala wa Mungu na nguvu ya kusababisha ya kitenzi; “ingawa” huonyesha uhusiano wa kimuktadha na uthabiti wa Ayubu.
- source_word: לְבַלְּעוֹ
  choice: ili nimwangamize
  rationale: Kitenzi maana yake halisi ni ‘kumeza,’ lakini hapa kimetumika kwa njia ya sitiari kumaanisha kumharibu au kumwangamiza; chaguo hili ni wazi na la asili katika Kiswahili.
- source_word: חִנָּם
  choice: bila sababu
  rationale: Huwasilisha maana ya kutokuwa na msingi au kisababishi halali; tanbihi huhifadhi maana mbadala na mwangwi wa Ayubu 1:9.
theological_decisions:
- issue: Jinsi ya kutafsiri kuhusika kwa Mungu katika mateso ya Ayubu
  choice: “ulinichochea dhidi yake ili nimwangamize” bila kupunguza kauli kuhusu wakala wa Mungu
  alternative: “ulinishawishi niruhusu madhara yampate”
  rationale: Kiebrania kinahusisha moja kwa moja hatua ya Yahweh na uchochezi wa Mshtaki. Kutafsiri kwa kuipunguza kauli hiyo kungeingiza suluhisho la kiteolojia ambalo mstari wenyewe hautoi.
- issue: Utambulisho wa הַשָּׂטָן
  choice: Cheo “Mshtaki”
  alternative: Jina “Shetani”
  rationale: Kibainishi katika Kiebrania kinaelekeza kwenye jukumu au cheo katika tukio hili. Chaguo hili halilazimishi utambulisho wa baadaye wa kiteolojia ndani ya simulizi.
- issue: Maana ya תָּם na תֻמָּה
  choice: “asiye na lawama” na “uadilifu”
  alternative: “mkamilifu” na “ukamilifu”
  rationale: Maneno haya yanaonyesha ukamilifu na unyofu wa tabia, si lazima kutokuwa na dhambi kabisa; hivyo tafsiri huepuka dai kubwa kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa “umeweka moyo wako kwa” umehifadhiwa kwa makusudi kwa ukaribu na taswira ya Kiebrania na kufafanuliwa katika tanbihi. “Mshtaki” limetumiwa kama cheo, na mkazo mgumu kuhusu wakala wa Mungu umeachwa bila kulainishwa.
