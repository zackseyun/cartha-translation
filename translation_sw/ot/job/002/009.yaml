base_translation:
  language: en
  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: sw
  text: Ndipo mke wake akamwambia, “Je, bado unashikilia uadilifu wako? Mbariki Mungu, ufe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Mbariki Mungu, ufe”; wengi huelewa neno “bariki” hapa kuwa usemi wa kiistaha wenye maana ya “laani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio; “Ndipo” pamoja na kitenzi cha -ka- huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Huu ni muundo wa kawaida wa nomino pamoja na kimilikishi.
- source_word: עֹדְךָ
  choice: Je, bado
  rationale: Kielezi kinaonyesha kuendelea kwa hali na kinamwelekea Ayubu; muundo wa swali unafaa muktadha.
- source_word: מַחֲזִיק
  choice: unashikilia
  rationale: Kitenzi hiki hapa humaanisha kuendelea kushika au kudumisha jambo kwa uthabiti.
- source_word: בְּתֻמָּתֶךָ
  choice: uadilifu wako
  rationale: תֻּמָּה huonyesha uadilifu, kutokuwa na hatia, au ukamilifu wa mwenendo; “uadilifu” ni neno la asili na la kawaida lisilodai kutokuwa na dhambi kabisa.
- source_word: בָּרֵךְ
  choice: Mbariki
  rationale: Kitenzi cha Kiebrania kwa maana ya moja kwa moja ni “bariki.” Maana inayowezekana ya kiistaha ya “laani” imehifadhiwa katika tanbihi badala ya kuamua utata kimya kimya.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hili ni jina la jumla la Uungu, si jina la agano YHWH.
- source_word: וָמֻת
  choice: ufe
  rationale: Ni amri inayofuata amri ya kwanza; muundo mfupi unahifadhi ukali wa usemi wa Kiebrania.
theological_decisions:
- issue: Matumizi ya kiistaha ya “bariki” kuhusiana na Mungu
  choice: Kuhifadhi “Mbariki Mungu, ufe” katika matini kuu na kueleza katika tanbihi kwamba wengi hulielewa kama “Mlaani Mungu, ufe.”
  alternative: Mlaani Mungu, ufe.
  rationale: Matini ya Kiebrania hutumia ברך (“bariki”), lakini katika muktadha huu wengi huliona kuwa neno la kiistaha linalomaanisha kinyume chake. Kuhifadhi umbo halisi katika matini kuu pamoja na tanbihi kunatanguliza ushahidi wa lugha asilia na kuhifadhi mvutano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ni mfupi na mkali kama ulivyo katika Kiebrania; alama ya tanbihi imewekwa baada ya sentensi inayohusika.
