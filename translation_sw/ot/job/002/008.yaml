  yaml_path: translation/ot/job/002/008.yaml
  text: And he took a potsherd to scrape himself with while he was sitting among the ashes[a][b].
translation:
  language: sw
  text: Kisha akachukua kigae[a] ili ajikwangue nacho[b], huku akiwa ameketi katikati ya majivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kipande cha chombo cha udongo kilichovunjika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ili ajikune nacho.” Kitenzi cha Kiebrania kinaweza kumaanisha kujikuna, lakini “kujikwangua” hufaa zaidi kwa matumizi ya kigae.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha akachukua
  rationale: Umbo la wayyiqtol la לקח linaendeleza mfululizo wa simulizi; “Kisha” linaonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: לוֹ
  choice: akachukua
  rationale: Kiwakilishi cha dative hakihitaji kutafsiriwa wazi kuwa “kwa ajili yake mwenyewe”; maana hiyo tayari inaeleweka katika muktadha.
- source_word: חֶרֶשׂ
  choice: kigae cha chungu
  rationale: Neno hili humaanisha kipande cha chombo cha udongo kilichovunjika. “Kigae cha chungu” ni lugha inayoeleweka na inahifadhi picha ya kipande cha ufinyanzi.
- source_word: לְהִתְגָּרֵד
  choice: ili kujikuna nacho
  rationale: Infinitivu ya hitpael inaonyesha kwamba Ayubu alijifanyia tendo hilo. “Kujikuna” ni Kiswahili cha kawaida kinachoweza pia kueleza kujisugua au kujikwangua kwa kipande hicho.
- source_word: בּוֹ
  choice: nacho
  rationale: Kihusishi pamoja na kiwakilishi kinaonyesha kifaa alichotumia, yaani kigae cha chungu.
- source_word: וְהוּא יֹשֵׁב
  choice: akiwa ameketi
  rationale: Kishazi hiki kinaonyesha hali iliyokuwa ikiendelea wakati wa tendo kuu, na muundo huu ni wa asili katika Kiswahili.
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: katikati ya majivu
  rationale: Tafsiri hii inahifadhi maana ya moja kwa moja ya בְּתוֹךְ, “katikati ya,” bila kuongeza wazo lisilotajwa wazi la lundo la majivu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kigae cha chungu” kimetumiwa badala ya istilahi ya kitaalamu isiyozoeleka, huku tanbihi ikifafanua kitu kinachokusudiwa. Mpangilio wa sentensi umefanywa wa asili bila kupoteza ufuatano, chombo kilichotumiwa, au mahali Ayubu alipoketi.
