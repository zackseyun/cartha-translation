  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׂא֨וּ אֶת עֵינֵי/הֶ֤ם מֵ/רָחוֹק֙ וְ/לֹ֣א הִכִּירֻ֔/הוּ וַ/יִּשְׂא֥וּ קוֹלָ֖/ם וַ/יִּבְכּ֑וּ וַֽ/יִּקְרְעוּ֙ אִ֣ישׁ מְעִל֔/וֹ וַ/יִּזְרְק֥וּ עָפָ֛ר עַל רָאשֵׁי/הֶ֖ם הַ/שָּׁמָֽיְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: sw
  text: Walipoinua macho yao wakiwa mbali[a], hawakumtambua. Ndipo wakapaza sauti zao na kulia; kila mmoja akararua joho lake, nao wakarusha mavumbi juu ya vichwa vyao kuelekea mbinguni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka mbali.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “kuelekea mbinguni” yanaonyesha kwamba walirusha mavumbi juu kama ishara ya kuomboleza.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: walipoinua macho yao
  rationale: Inahifadhi nahau ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi; katika muktadha huu tendo hilo linaunganika na kuwaona kwa mbali.
- source_word: מֵרָחוֹק
  choice: wakiwa mbali
  rationale: Inaonyesha umbali uliokuwapo kati yao na Ayubu bila kudokeza kwamba macho yenyewe ndiyo yaliyoinuliwa kutoka mahali fulani.
- source_word: וְלֹא הִכִּירֻהוּ
  choice: hawakumtambua
  rationale: Kitenzi kinahusu kushindwa kumtambua Ayubu kwa sura yake, si kutomjua.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: wakapaza sauti zao na kulia
  rationale: “Kupaza sauti” ni usemi wa asili unaokaribia nahau ya Kiebrania, huku “kulia” likieleza maombolezo yao wazi.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: kila mmoja akararua joho lake
  rationale: אִישׁ imetumika kwa maana ya mgawanyo, “kila mmoja,” na מְעִיל ni vazi la nje linaloweza kuitwa joho.
- source_word: וַיִּזְרְקוּ עָפָר עַל רָאשֵׁיהֶם
  choice: wakarusha mavumbi juu ya vichwa vyao
  rationale: Inahifadhi tendo halisi la maombolezo na wingi wa Kiebrania, “vichwa vyao.”
- source_word: הַשָּׁמָיְמָה
  choice: kuelekea mbinguni
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo wa kuelekea juu; tafsiri hii hailifuti wala kulieleza kupita kiasi.
