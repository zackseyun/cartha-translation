base_translation:
  language: en
  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: sw
  text: na kukufunulia mambo yaliyofichika ya hekima[a], kwa maana hekima timamu ina pande mbili[b]. Basi ujue kwamba Mungu amepuuza baadhi ya uovu wako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siri za hekima.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “kwa maana ni maradufu kwa hekima timamu.” Huenda usemi huu unaonyesha kwamba hekima ina kina au pande nyingi kuliko inavyoonekana.'
    reason: lexical_alternative
  - marker: c
    text: Au, “Mungu anakudai kidogo kuliko hatia yako inavyostahili,” au “Mungu amesahau baadhi ya uovu wako.” Kitenzi cha Kiebrania ni kigumu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד
  choice: na kukufunulia
  rationale: Hifili ya נגד humaanisha kusema, kutangaza, au kujulisha. Katika mwendelezo wa tamanio la mstari uliotangulia, kitenzi-jina ‘kukufunulia’ kinaendeleza kwa kawaida wazo la ‘laiti Mungu angesema ... na kukufunulia.’
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: mambo yaliyofichika ya hekima
  rationale: תעלמות ni mambo yaliyofichwa au yaliyositirika. Tafsiri hii inadumisha wingi halisi na uhusiano wake na hekima bila kufafanua kupita maandishi.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: hekima timamu ina pande mbili
  rationale: כפלים hudokeza uwili, huku תושיה ikiwa istilahi ngumu ya fasihi ya hekima inayoweza kumaanisha hekima timamu au ufahamu wenye matokeo. ‘Ina pande mbili’ ni usemi wa kawaida unaodumisha picha ya uwili na wazo la kina kisichoonekana mara moja.
- source_word: וְדַע
  choice: Basi ujue
  rationale: Amri ya ידע inatoa himizo. ‘Basi’ inaonyesha kuwa kauli hii ni hitimisho linalotokana na yaliyotangulia.
- source_word: יַשֶּׁה לְךָ ... מֵעֲוֺנֶךָ
  choice: amepuuza baadhi ya uovu wako
  rationale: Kitenzi נשׁה ni kigumu na kinaweza kuhusishwa na kusahau au kutodai. Katika muktadha wa shtaka la Sofari, maana inayowezekana ni kwamba Mungu hajamhesabishia Ayubu uovu wake wote. ‘Baadhi ya’ huwakilisha מן kwa maana ya sehemu.
- source_word: אֱלוֹהַ
  choice: Mungu
  rationale: Hili ni umbo la kishairi la umoja linalomaanisha Mungu; hakuna msingi wa kulipanua kuwa jina jingine.
theological_decisions:
- issue: Dai la Sofari kuhusu jinsi Mungu anavyomtendea Ayubu
  choice: Mungu amepuuza baadhi ya uovu wa Ayubu, yaani hajauhesabu wote dhidi yake
  alternative: Mungu amemsahaulisha Ayubu uovu wake; au Mungu anamdai Ayubu chini ya anavyostahili kwa hatia yake
  rationale: Kitenzi cha Kiebrania kina utata wa kweli, ingawa muktadha unaelekea kwenye shtaka la Sofari kwamba Ayubu amepata adhabu ndogo kuliko anayostahili. Tafsiri inaonyesha kuwa haya ni maneno ya Sofari bila kuthibitisha dai lake kuwa fundisho la msimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendelea na tamanio la muktadha uliotangulia. Alama zote za tanbihi zimewekwa mara moja katika matini, karibu na maneno yanayohusika.
