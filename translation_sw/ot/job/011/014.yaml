  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: sw
  text: Ikiwa kuna uovu mkononi mwako[a], uondoe mbali, wala usiache udhalimu ukae katika mahema yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “mkononi mwako” inaweza kumaanisha uovu unaoutenda, unaoumiliki, au ulio chini ya uwezo wako.
    reason: idiom_note
  - marker: b
    text: “Katika mahema yako” hurejelea mazingira ya nyumbani au maisha ya watu wa nyumbani mwako.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Huanzisha sentensi ya sharti kwa njia ya kawaida na ya asili katika Kiswahili.
- source_word: אָוֶן
  choice: uovu
  rationale: Katika himizo hili la kimaadili, neno lina maana ya uovu au tendo baya; “uovu” huhifadhi uzito wake bila kulifanya kuwa istilahi finyu ya kiteolojia.
- source_word: בְּיָדְךָ
  choice: mkononi mwako
  rationale: Huhifadhi taswira ya Kiebrania ya jambo lililo mikononi mwa mtu, yaani analomiliki, analotenda, au lililo chini ya uwezo wake.
- source_word: הַרְחִיקֵהוּ
  choice: uondoe mbali
  rationale: Kauli ya amri katika Hiphil inataka hatua ya kuliondoa na kuliweka mbali.
- source_word: וְאַל
  choice: wala usiache
  rationale: Hutoa katazo linalounganisha mstari wa pili na wa kwanza kwa mtiririko wa kawaida wa Kiswahili.
- source_word: תַּשְׁכֵּן
  choice: ukae
  rationale: Kitenzi שכן kina wazo la kukaa au kuishi mahali; pamoja na “usiache” kinamaanisha kutoruhusu udhalimu ukae.
- source_word: בְּאֹהָלֶיךָ
  choice: katika mahema yako
  rationale: Wingi wa Kiebrania umehifadhiwa, pamoja na mazingira halisi ya makao ya kale.
- source_word: עַוְלָה
  choice: udhalimu
  rationale: Neno humaanisha kosa, upotovu, au ukosefu wa haki. “Udhalimu” hulitofautisha na אָוֶן huku likihifadhi ulinganifu wa kishairi wa maneno yanayokaribiana.
theological_decisions:
- issue: Istilahi za maadili katika ulinganifu wa kishairi
  choice: Kutafsiri אָוֶן kuwa “uovu” na עַוְלָה kuwa “udhalimu”
  alternative: Kutumia neno lilelile kwa yote mawili, au kutafsiri yote kwa jumla kuwa “uovu”
  rationale: Maneno mawili yanahusiana lakini si lazima yawe istilahi mbili za kiufundi. Kuyatofautisha huhifadhi msamiati na ulinganifu wa Kiebrania bila kuingiza tofauti ya kimafundisho ambayo mstari haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira halisi za “mkono” na “mahema” zimehifadhiwa, huku maelezo mafupi yakifafanua maana zake za kimuktadha.
