base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: sw
  text: Kwa maana yeye huwajua watu wa udanganyifu; anapoona uovu, je, hatambui?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “naye hafikirii/hazingatii.” Kishazi cha mwisho cha Kiebrania kinaweza kusomwa kama ukanushi wa kawaida, lakini muktadha unaunga mkono zaidi swali la balagha: “je, hatambui?”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huonyesha msingi wa hoja ya Sofari na kuunganisha mstari huu kwa kawaida na muktadha uliotangulia.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi hiki kinamrejelea Mungu katika muktadha; kimetajwa wazi ili kuhifadhi msisitizo wa Kiebrania.
- source_word: יָדַע
  choice: huwajua
  rationale: Kauli ya sasa ya mazoea huwasilisha maarifa ya Mungu yaliyo thabiti na ya kudumu.
- source_word: מְתֵי שָׁוְא
  choice: watu wa udanganyifu
  rationale: Neno שָׁוְא linaweza kumaanisha uongo, ubatili au kutokuwa na thamani. Hapa 'udanganyifu' huhifadhi maana ya kimaadili bila kuwaita watu wenyewe 'wasio na thamani.'
- source_word: וַיַּרְא
  choice: anapoona
  rationale: Muundo wa wakati unaunganisha kuona kwa Mungu na swali la balagha linalofuata kwa Kiswahili cha kawaida.
- source_word: אָוֶן
  choice: uovu
  rationale: Katika muktadha huu neno hilo linaonyesha ubaya au uovu wa kimaadili, ingawa mahali pengine linaweza pia kuhusisha taabu inayotokana na uovu.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: je, hautambui?
  rationale: Limetafsiriwa kama swali la balagha linalosisitiza kwamba Mungu huutambua uovu anaouona. Kitenzi 'kutambua' kinafikisha wazo la kuangalia kwa makini au kulipa jambo uzito.
theological_decisions:
- issue: Nguvu ya kishazi cha mwisho וְלֹא יִתְבּוֹנָן
  choice: 'Kukitafsiri kama swali la balagha: “je, hautambui?”'
  alternative: 'Kukitafsiri kama taarifa yenye ukanushi wa kawaida: “wala hautafakari/hautambui.”'
  rationale: Muktadha wa hoja ya Sofari unasisitiza ufahamu wa Mungu kuhusu uovu wa binadamu, hivyo swali la balagha linaendana vizuri na mtiririko huo. Hata hivyo, umbo la Kiebrania pia linaweza kusomwa kama ukanushi wa kawaida; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Watu' limetumiwa badala ya 'wanaume' kwa maana ya jumla ya binadamu; 'watu wa udanganyifu' huhifadhi muundo na maana ya kimaadili ya Kiebrania bila lugha ya kizamani.
