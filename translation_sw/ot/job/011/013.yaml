  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: sw
  text: Kama utatayarisha moyo wako na kunyoosha mikono yako kwake,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na kunyoosha kiganja chako kwake.” Kiebrania kinatumia nomino ya umoja yenye maana ya “kiganja/mkono,” lakini usemi huo kwa kawaida hurejelea ishara ya sala ya kunyoosha mikono.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Hutanguliza sharti katika wito wa Sofari kwa Ayubu; “kama” huhifadhi wazi hali hiyo ya masharti.
- source_word: אַתָּה
  choice: uki-
  rationale: Kiwakilishi cha nafsi ya pili umoja kimewakilishwa kiasili katika kiambishi cha kitenzi cha Kiswahili, bila kulazimisha “wewe” isiyohitajika.
- source_word: הֲכִינוֹתָ
  choice: ukiutayarisha
  rationale: Hifili ya כון ina maana ya kufanya tayari, imara, au kuelekeza sawasawa. “Kutayarisha” inaeleweka kwa urahisi pamoja na “moyo” bila kufafanua mno tendo la ndani.
- source_word: לִבֶּךָ
  choice: moyo wako
  rationale: Huhifadhi taswira ya Kiebrania ya moyo kama utu wa ndani, unaohusisha mawazo na nia, badala ya kuibana kuwa akili pekee.
- source_word: וּפָרַשְׂתָּ
  choice: na kumnyooshea
  rationale: פרשׂ humaanisha kunyoosha au kutandaza. “Kumnyooshea” ni usemi wa kawaida wa Kiswahili kwa kuelekeza mikono kwa Mungu katika sala.
- source_word: אֵלָיו
  choice: -m- ... -ea
  rationale: Kielekezo kwa nafsi ya tatu umoja kimejengwa katika “kumnyooshea,” hivyo huhifadhi maana ya kuelekea kwake bila kuongeza nomino “Mungu” ambayo haipo wazi katika mstari.
- source_word: כַּפֶּךָ
  choice: mikono yako
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, usemi huo unaeleweka kama ishara ya sala ya kunyoosha mikono. Wingi ni wa kawaida na wazi katika Kiswahili; umoja umehifadhiwa kama mbadala katika tanbihi.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi katika אֵלָיו
  choice: Kiwakilishi kimerejelewa kwa “-m-” katika “kumnyooshea,” kikimaanisha Mungu kutokana na muktadha bila kumtaja wazi.
  alternative: Kutafsiri moja kwa moja “kwa Mungu” au “kwake.”
  rationale: Muktadha unaonyesha kuwa anayelengwa ni Mungu, lakini Kiebrania kimetumia kiwakilishi. Tafsiri hii hudumisha kiwango hicho cha uwazi bila kuongeza jina lisilomo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti umewekwa kwa “Kama uki-”; “moyo wako” huhifadhi taswira ya chanzo, na “mikono” hutoa kwa ufasaha ishara ya sala huku umoja wa Kiebrania ukibainishwa katika tanbihi.
