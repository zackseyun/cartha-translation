lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini
  rationale: Inaonyesha geuko lenye mkazo kutoka kwa malalamiko yaliyotangulia ya Sofari, kwa lugha ya kawaida na yenye heshima.
- source_word: מִי יִתֵּן
  choice: laiti
  rationale: Nahau hii inaonyesha tamanio, si swali halisi la nani atakayetoa; “laiti” ni Kiswahili cha kawaida kinachobeba nguvu ya tamanio hilo.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Jina hili la Mungu katika umoja halihitaji kupanuliwa kuwa “Mungu Mwenyezi.”
- source_word: דַּבֵּר
  choice: angesema
  rationale: Baada ya nahau ya tamanio, hali ya masharti huwasilisha kwa kawaida tendo linalotamaniwa.
- source_word: וְיִפְתַּח
  choice: na kufungua
  rationale: Tendo hili linaunganishwa na “angesema” kama sehemu ya tamanio lilelile, huku maana ya msingi ya kitenzi ikihifadhiwa.
- source_word: שְׂפָתָיו
  choice: midomo yake
  rationale: Huhifadhi taswira ya moja kwa moja ya Kiebrania badala ya kuirahisisha kuwa “kinywa chake” au “kusema.”
- source_word: עִמָּךְ
  choice: dhidi yako
  rationale: Ingawa kihusishi kwa msingi humaanisha “pamoja na/wewe,” muktadha unaonyesha Mungu akimjibu Ayubu kwa namna ya kumpinga; uwezekano wa maana halisi umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa viungo vya mwili (“kufungua midomo yake”)
  choice: Taswira imehifadhiwa moja kwa moja
  alternative: “azungumze nawe”
  rationale: Kiebrania kinatumia taswira ya kibinadamu kuhusu usemi wa Mungu. Kuihifadhi kunaiheshimu matini bila kulazimisha dai la kimwili kuhusu asili ya Mungu.
- issue: Nguvu ya עִמָּךְ katika muktadha
  choice: “dhidi yako”
  alternative: “nawe” au “kwako”
  rationale: Sofari anatamani Mungu ayajibu madai ya Ayubu, hivyo muktadha unaelekea kwenye maana ya upinzani. Tanbihi inahifadhi utata halisi wa kihusishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Laiti” huwasilisha tamanio kwa ufupi; “kufungua midomo yake” huhifadhi taswira ya Kiebrania. Alama ya tanbihi [a] imewekwa katika matini.
