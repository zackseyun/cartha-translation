  text: 'Je, wingi wa maneno usijibiwe?


    Na je, mtu wa maneno mengi[a] athibitishwe kuwa yuko sahihi?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mtu wa midomo,” yaani mtu anayejulikana kwa kusema sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: wingi wa maneno
  rationale: Huhifadhi dhana ya maneno mengi kupita kiasi na nguvu ya swali la balagha bila kuongeza hukumu kwamba maneno hayo ni matupu.
- source_word: לֹא יֵעָנֶה
  choice: usijibiwe
  rationale: Kauli ya kutendwa ya kitenzi ina maana ya ‘kutojibiwa’; umbo la utegemezi linaonyesha kwa kawaida wazo la ‘je, yafaa yasijibiwe?’ katika swali hili la balagha.
- source_word: וְאִם
  choice: Je
  rationale: Katika ushairi huu kishazi cha pili ni swali la balagha linalolingana na la kwanza. Kurudia ‘Je’ kunawasilisha ulinganifu huo kwa Kiswahili cha kawaida, ingawa kiunganishi cha Kiebrania hakikutafsiriwa kwa neno tofauti.
- source_word: אִישׁ שְׂפָתַיִם
  choice: mtu wa maneno mengi
  rationale: Kihalisi ni ‘mtu wa midomo,’ nahau inayomtaja mtu anayejulikana kwa kusema sana. Tafsiri hii ni wazi na ya asili kwa Kiswahili huku tanbihi ikihifadhi taswira halisi.
- source_word: יִצְדָּק
  choice: athibitishwe kuwa yuko sahihi
  rationale: Katika muktadha huu kitenzi kinahusu kuonyeshwa au kuthibitishwa kuwa mtu yuko upande wa haki katika hoja, si lazima kutangazwa kuwa mwadilifu kwa maana pana ya kiteolojia.
theological_decisions:
- issue: Maana ya יִצְדָּק
  choice: athibitishwe kuwa yuko sahihi
  alternative: ahesabiwe kuwa mwenye haki
  rationale: Chaguo kuu linaonyesha maana ya kimahakama au ya kutathmini katika mabishano haya na huepuka kuingiza bila sababu maana maalumu ya kiteolojia ya ‘kuhesabiwa haki.’
translation_notes:
  register: Lugha ni ya sasa, yenye heshima, na inafaa kwa ushairi wa hekima. Maswali mawili mafupi yanahifadhi ulinganifu na ukali wa balagha wa Kiebrania.
