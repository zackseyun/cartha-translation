  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: sw
  text: Je, waweza kuyagundua mambo ya kina ya Mungu? Je, waweza kuufikia ukomo wa Mwenyezi?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, waweza kuchunguza undani wa Mungu?” Neno la Kiebrania חֵקֶר linaweza kumaanisha uchunguzi, utafiti, au kile kinachochunguzwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwisho,” “upeo kamili,” au “ukamilifu” wa Mwenyezi badala ya “ukomo wa Mwenyezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: mambo ya kina
  rationale: Nomino חֵקֶר inaweza kumaanisha uchunguzi au kile kinachochunguzwa. Katika swali hili la balagha, “mambo ya kina” huonyesha yale yaliyo ndani ya Mungu ambayo mwanadamu hawezi kuyachunguza kikamilifu.
- source_word: אֱלוֹהַ
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa jina hili la Mungu katika Ayubu, nalo linalingana na שַׁדַּי katika mstari sambamba.
- source_word: תִּמְצָא
  choice: kuyagundua
  rationale: Kitenzi מצא kimsingi ni “kupata”; hapa “kugundua” kinaendana kwa kawaida na wazo la uchunguzi lililomo katika חֵקֶר.
- source_word: אִם
  choice: Je, waweza
  rationale: Hapa אִם linaanzisha swali la balagha sambamba na swali la kwanza, si sentensi ya sharti.
- source_word: עַד תַּכְלִית
  choice: kuufikia ukomo
  rationale: Muungano huu huonyesha kufikia mwisho, mpaka, au upeo kamili. “Kuufikia ukomo” ni Kiswahili cha kawaida kinachohifadhi taswira hiyo.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: “Mwenyezi” ni tafsiri ya kawaida ya cheo cha Mungu שַׁדַּי katika Kiswahili na huhifadhi usambamba na “Mungu.”
- source_word: תִּמְצָא
  choice: kuufikia
  rationale: Ingawa kitenzi kilichorudiwa ni “kupata,” “kuufikia” huambatana kwa ufasaha na “ukomo” bila kupoteza wazo la kufanikiwa kuufikia upeo.
theological_decisions:
- issue: Lugha kuhusu uwezo wa mwanadamu kumfahamu Mungu
  choice: Maswali yanaonyesha kwamba mwanadamu hawezi kuchunguza kikamilifu mambo ya kina ya Mungu wala kufikia ukomo wake.
  alternative: Kusema kwamba mwanadamu hawezi kumjua Mungu kwa namna yoyote.
  rationale: Kiebrania kinakataa ufahamu kamili au wenye kufikia upeo, lakini hakisemi kwamba hakuna maarifa yoyote ya kweli kumhusu Mungu. Tafsiri inadumisha mvutano huo bila kuuondoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Waweza” hudumisha ufupi na usambamba wa maswali mawili; “mambo ya kina” huepuka usemi usio wa kawaida wa “vina vya Mungu.”
