  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: sw
  text: 'Lakini macho ya waovu yatafifia,

    mahali pa kukimbilia patapotea kwao,

    na tumaini lao litakuwa pumzi ya mwisho.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tumaini lao ni pumzi ya uhai.” Kirai cha Kiebrania ni kigumu; huenda kinamaanisha pumzi ya mtu anayekufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים תִּכְלֶינָה
  choice: macho ya waovu yatafifia
  rationale: Inahifadhi taswira halisi ya macho huku ‘yatafifia’ ikieleza macho kuchoka au kudhoofika kwa kutazamia jambo lisilotimia.
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: mahali pa kukimbilia patawapotea
  rationale: מָנוֹס inaweza kumaanisha mahali au njia ya kukimbilia. Kauli hii ni ya kawaida kwa Kiswahili na inadumisha wazo la uwezekano wa kuokoka kuondolewa kwao.
- source_word: תִקְוָתָם
  choice: tumaini lao
  rationale: ‘Tumaini’ ni tafsiri ya kawaida na ya moja kwa moja, na hapa linaelekeza kwa jambo pekee ambalo waovu watabaki wakilitazamia.
- source_word: מַפַּח נָפֶשׁ
  choice: kutoa pumzi ya mwisho
  rationale: Kirai hiki kigumu kinahusiana na kupumua au kutoa uhai. Tafsiri hii inadumisha taswira ya pumzi na kuwasilisha maana inayowezekana ya kufa bila kutumia neno la kufasiri kama ‘kukata tamaa.’
theological_decisions:
- issue: Maana ya מַפַּח נָפֶשׁ
  choice: kutoa pumzi ya mwisho
  alternative: kukata tamaa; kupuliza uhai
  rationale: Kirai cha Kiebrania ni kigumu, lakini muktadha unaonyesha kufa kama mwisho wa tumaini lao. Tafsiri iliyochaguliwa inadumisha taswira ya pumzi na kutokuwa na uhakika wa kirai hicho kwa kukieleza katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Mistari mitatu inadumisha ulinganifu wa kishairi wa Kiebrania.
