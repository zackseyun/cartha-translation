  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: sw
  text: Maisha yako yatainuka, yakiwa angavu kuliko adhuhuri[a]; hata giza likiwapo[b], litakuwa kama asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maisha yako yatakuwa angavu kuliko adhuhuri; giza litakuwa kama asubuhi.” Kiebrania kina misemo kadhaa ya kishairi iliyofupishwa, hasa katika mstari wa pili.
    reason: alternative_reading
  - marker: b
    text: Neno adimu la Kiebrania lililotafsiriwa “giza” halina uhakika; linaweza pia kumaanisha “utando wa giza” au “hali ya kutokuonekana wazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: kuliko adhuhuri
  rationale: Kiambishi מִן kinaeleweka kwa maana ya ulinganisho, ‘kuliko’; ‘adhuhuri’ ni neno la kawaida na lenye hadhi kwa mwanga wa katikati ya mchana.
- source_word: יָקוּם
  choice: yatang'aa
  rationale: Kitenzi קום kwa kawaida ni ‘kuinuka,’ lakini hapa kimetumiwa kishairi pamoja na ulinganisho wa adhuhuri. Kiswahili ‘yatang'aa’ huwasilisha kwa kawaida hali ya maisha kuwa yenye nuru, bila kulazimisha picha isiyo ya kawaida ya maisha kuinuka.
- source_word: חָלֶד
  choice: maisha yako
  rationale: חָלֶד inaweza kumaanisha muda wa maisha, maisha, au kuwepo duniani. ‘Maisha yako’ ni ya kawaida katika Kiswahili na huhifadhi upana huo vizuri kuliko ‘muda wako wa kuishi.’
- source_word: תָּעֻפָה
  choice: giza
  rationale: Neno hili adimu halina uhakika; katika muktadha wa tofauti na asubuhi, ‘giza’ ni tafsiri wazi huku tanbihi ikihifadhi uwezekano wa ‘utando wa giza’ au ‘hali ya kutokuonekana wazi.’
- source_word: כַּבֹּקֶר
  choice: kama asubuhi
  rationale: Huhifadhi tashbihi ya כ na maana ya kawaida ya בֹּקֶר, ‘asubuhi.’
- source_word: תִּהְיֶה
  choice: yatakuwa
  rationale: היה kimsingi ni ‘kuwa.’ Wingi wa kisarufi unafuata nomino ya Kiswahili ‘maisha’; muktadha unaonyesha hali ya giza kugeuka kuwa kama asubuhi bila kuongeza kwa lazima kitenzi ‘kubadilika.’
