review_pass:
  verdict: revise
  source_fidelity: The first colon should retain, where natural, the Hebrew image of the life/lifetime ‘rising’; ‘yatang'aa’ communicates brightness but omits this verbal image. In the second colon, the Hebrew verb is singular and its implied subject is the rare term understood as darkness/gloom, not ‘maisha yako.’
  naturalness: The draft is generally clear Standard East African Swahili, but ‘yatakuwa kama asubuhi’ is grammatically linked to the plural ‘maisha’ and consequently obscures the intended subject and contrast. Explicitly referring to giza yields a natural, coherent poetic line.
  terminology: ‘adhuhuri,’ ‘maisha yako,’ ‘giza,’ and ‘asubuhi’ are appropriate. ‘Hata giza likiwapo’ preserves the concessive sense without claiming more certainty about the rare Hebrew term than the footnote permits.
  issues:
  - severity: medium
    issue: The clause ‘hata kukiwa na giza, yatakuwa kama asubuhi’ makes ‘maisha yako’ the subject of ‘yatakuwa.’
    rationale: 'The Hebrew has singular ‘it will be,’ referring to the difficult term commonly understood as darkness/gloom. The Swahili should make giza the referent: ‘Hata giza likiwapo, litakuwa kama asubuhi.’'
  - severity: low
    issue: ‘yatang'aa’ does not represent יָקוּם (‘will rise’).
    rationale: The image can be retained idiomatically in Swahili by combining ‘yatainuka’ with the implied brightness supplied by the comparison to noon.
  revised_text: Maisha yako yatainuka, yakiwa angavu kuliko adhuhuri[a]; hata giza likiwapo[b], litakuwa kama asubuhi.
