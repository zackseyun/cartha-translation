id: JOB.11.9
reference: Job 11:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲרֻכָּ֣ה מֵ/אֶ֣רֶץ מִדָּ֑/הּ וּ֝/רְחָבָ֗ה מִנִּי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: sw
  text: Kipimo chake ni kirefu kuliko dunia, na ni kipana kuliko bahari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Urefu wake unapita ule wa dunia, na upana wake unapita ule wa bahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: ni kirefu kuliko
  rationale: Kivumishi cha kike umoja kinaafikiana na מִדָּהּ; pamoja na מִן kinaonyesha ulinganisho. Kiswahili cha kawaida hutumia muundo ‘kirefu kuliko’.
- source_word: מֵאֶרֶץ
  choice: kuliko dunia
  rationale: Kiambishi מִן hapa ni cha ulinganisho, si cha kutengana. Katika usambamba na bahari, אֶרֶץ inaeleweka kwa maana pana ya dunia.
- source_word: מִדָּהּ
  choice: kipimo chake
  rationale: מִדָּה humaanisha kipimo, ukubwa, au kiwango. ‘Kipimo chake’ huhifadhi taswira halisi na kiambishi cha nafsi ya tatu umoja.
- source_word: וּרְחָבָה
  choice: na ni kipana kuliko
  rationale: Kivumishi hiki kinaenda sambamba na אֲרֻכָּה na pia kina maana ya ulinganisho kutokana na מִן; ‘kipana kuliko’ ni Kiswahili cha kawaida na cha wazi.
- source_word: מִנִּי יָם
  choice: kuliko bahari
  rationale: מִנִּי ni umbo la kishairi la מִן linaloonyesha ulinganisho, na יָם kwa kawaida ni ‘bahari’; uchaguzi huu huhifadhi usambamba na taswira ya Kiebrania.
theological_decisions:
- issue: Kirejeleo cha kiambishi ‘-ake’ katika מִדָּהּ
  choice: Kimeachwa kama ‘kipimo chake’ bila kutaja nomino inayorejelewa.
  alternative: ‘Kipimo cha hekima hiyo’ au ‘kipimo cha siri za Mungu’
  rationale: Kiebrania kina kiambishi tu, na kirejeleo chake hutegemea muktadha wa mstari uliotangulia. Kutokitaja wazi kunahifadhi mshikamano na uwezekano wa maana wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa ulinganisho na usambamba wa kishairi umehifadhiwa; ‘dunia’ na ‘bahari’ zinaendeleza ukubwa wa taswira ya asili.
