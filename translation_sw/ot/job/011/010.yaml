base_translation:
  language: en
  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: sw
  text: Akipita, akamfunga mtu, na akaitisha kusanyiko[a], ni nani awezaye kumrudisha nyuma[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kuitisha kusanyiko” pia inaweza kutafsiriwa “kukusanya” au “kuwaita watu wakusanyike”; huenda kuna wazo la kikao cha hukumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ni nani awezaye kubatilisha alichofanya?” Kiebrania kinaweza kueleweka kuwa ni kumrudisha nyuma mtendaji mwenyewe au, kwa upana zaidi, kugeuza kitendo chake.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Aki-
  rationale: Kiambishi cha hali “aki-” huwasilisha hali ya masharti au ya kudhaniwa kwa Kiswahili cha kawaida, sambamba na אִם katika kauli hii ya balagha.
- source_word: יַחֲלֹף
  choice: akipita
  rationale: Huhifadhi maana ya msingi ya kupita bila kuongeza wazo lisilo wazi la kuharibu au kufagia.
- source_word: וְיַסְגִּיר
  choice: akamfunga mtu
  rationale: Kitenzi סגר katika Hiphil kinaweza kumaanisha kufungia, kufunga gerezani, au kukabidhi. “Kumfunga mtu” ni cha asili katika Kiswahili na kinaendeleza picha halisi, ingawa Kiebrania hakitaji mtendwa waziwazi.
- source_word: וְיַקְהִיל
  choice: akaitisha kusanyiko
  rationale: Huwasilisha umbo la kusababisha la קהל—kukusanya au kuitisha watu—na pia huacha uwezekano wa mazingira ya hadhara au ya hukumu.
- source_word: וּמִי
  choice: ni nani
  rationale: Swali hili la balagha linaonyesha kwamba hakuna anayeweza kuzuia kitendo kinachoelezwa.
- source_word: יְשִׁיבֶנּוּ
  choice: awezaye kumrudisha nyuma
  rationale: Huwasilisha maana ya Hiphil ya שוב, ‘kusababisha arudi’ au ‘kumrudisha nyuma,’ huku kiambishi cha nafsi ya tatu umoja wa kiume kikitafsiriwa kama mtu.
theological_decisions:
- issue: Rejeo la mtendaji na la kiambishi cha mwisho cha umoja wa kiume
  choice: 'Mungu ndiye mtendaji anayeeleweka kutokana na muktadha, na kiambishi cha mwisho kimetafsiriwa kwa nafsi: “kumrudisha nyuma.”'
  alternative: Kauli inaweza kueleweka kwa upana zaidi kuwa hakuna anayeweza kubatilisha au kugeuza alichofanya.
  rationale: Muktadha mpana unazungumzia matendo ya Mungu yasiyozuilika. Tafsiri ya nafsi inafuata sarufi ya karibu, lakini tanbihi inahifadhi uwezekano wa kuelewa kitendo chenyewe kuwa ndicho kisichoweza kubatilishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Mfuatano wa vitenzi vya “aki-” unadumisha hali ya masharti, na “awezaye” inaleta uzito unaofaa kwa swali la balagha.
