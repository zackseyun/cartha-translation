  text: גָּבְהֵ֣י שָׁ֭מַיִם מַה תִּפְעָ֑ל עֲמֻקָּ֥ה מִ֝/שְּׁא֗וֹל מַה תֵּדָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: sw
  text: Ni juu kuliko mbingu—unaweza kufanya nini? Ni kirefu kuliko Sheoli—unaweza kujua nini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kirefu kuliko kaburi” au “kirefu kuliko makao ya wafu.” Kiebrania: Sheoli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: kiko juu kuliko mbingu
  rationale: Kirai hiki huonyesha vilele au kimo cha mbingu. Usemi wa kulinganisha ni wa kawaida katika Kiswahili na unadumisha taswira ya kitu kisichoweza kufikiwa.
- source_word: מַה תִּפְעָל
  choice: unaweza kufanya nini?
  rationale: Kitenzi cha wakati usiotimilika katika swali hili la balagha kinaonyesha uwezo; tafsiri hii inahifadhi changamoto ya moja kwa moja kwa msikilizaji.
- source_word: עֲמֻקָּה מִשְּׁאוֹל
  choice: kina chake ni kirefu kuliko Sheoli
  rationale: Tafsiri hii inaonyesha wazi ulinganisho wa kina na kudumisha usambamba wa kishairi, huku ikiepuka kutumia “kirefu” peke yake kwa namna ambayo ingeweza kueleweka kuwa urefu badala ya kina.
- source_word: מַה תֵּדָע
  choice: unaweza kujua nini?
  rationale: Katika usambamba na swali la kwanza, swali hili la balagha linahusu mipaka ya uwezo wa mwanadamu kujua.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu; kuzimu
  rationale: Kutumia jina la Kiebrania lililorekebishwa kwa matamshi ya Kiswahili kunahifadhi dhana pana ya ulimwengu wa wafu bila kuibana iwe kaburi la mwili tu au kuipa moja kwa moja maana maalumu ya adhabu. Tanbihi inaeleza mbadala wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali mafupi na alama za vistari virefu zinadumisha nguvu na usambamba wa ushairi wa Kiebrania.
