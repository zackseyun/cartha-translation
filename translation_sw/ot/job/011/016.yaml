  source_fidelity: “Kwa maana utasahau taabu yako; utaikumbuka kama maji yaliyopita” accurately renders the explanatory כִּי, the future verbs, עָמָל as broadly conceived hardship, and the comparison with waters that have passed. The supplied object marker in “utaikumbuka” naturally refers to “taabu” and appropriately makes explicit what the Hebrew leaves implicit.
