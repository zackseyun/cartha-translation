  text: כִּי אַ֭תָּה עָמָ֣ל תִּשְׁכָּ֑ח כְּ/מַ֖יִם עָבְר֣וּ תִזְכֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/016.yaml
  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: sw
  text: Kwa maana utasahau taabu yako; utaikumbuka kama maji yaliyopita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu au ufafanuzi unaotokana na ahadi iliyotangulia; “Kwa maana” ni ya kawaida na yenye uzito unaofaa katika Kiswahili.
- source_word: אַתָּה
  choice: uta- (nafsi ya pili umoja)
  rationale: Kiswahili huonyesha nafsi katika kiambishi cha kitenzi. Hakuna haja ya kuongeza “wewe,” kwa kuwa msisitizo wa Kiebrania hauhitaji lazima kiwakilishi huru hapa.
- source_word: עָמָל
  choice: taabu yako
  rationale: Neno linaweza kumaanisha taabu, mateso, au dhiki. “Taabu” ni pana, ya kawaida, na inafaa kwa hali ya Ayubu bila kuifunga maana kwenye kazi ngumu pekee.
- source_word: תִּשְׁכָּח
  choice: utasahau
  rationale: Qal imperfect nafsi ya pili ya kiume umoja ina maana ya wakati ujao katika muktadha huu.
- source_word: כְמַיִם
  choice: kama maji
  rationale: Huhifadhi wazi taswira ya ulinganisho. Katika Kiswahili “maji” tayari ni nomino ya wingi/kikusanyiko, hivyo huwakilisha vizuri umbo la Kiebrania.
- source_word: עָבְרוּ
  choice: yaliyopita
  rationale: Huonyesha tendo lililokamilika la maji ambayo tayari yamepita, bila kulazimisha tafsiri maalumu kama “yaliyotiririka.”
- source_word: תִזְכֹּר
  choice: utaikumbuka
  rationale: Kitenzi ni Qal imperfect nafsi ya pili ya kiume umoja. Kiambishi kitu “-i-” kinarejelea “taabu,” kama inavyodaiwa na muktadha wa ulinganisho.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa sentensi mbili zinazolingana, huku taswira ya maji yaliyopita ikibaki wazi bila maelezo ya ziada.
