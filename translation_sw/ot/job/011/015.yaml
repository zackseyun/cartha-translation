  verdict: revise
  source_fidelity: Draft preserves the verse’s sequence and central imagery, including lifting the face, freedom from blemish, firmness, and fearlessness. However, “utakapoinua” is a conditional/temporal form (“when you lift”) rather than the Hebrew imperfect future consequent, “you will lift.”
  naturalness: The wording is otherwise clear, dignified Standard East African Swahili, and suitably concise for Job’s poetry. Replacing the conditional verb with the simple future makes the syntax both natural and faithful.
  terminology: “Dosari” appropriately represents the concrete lexical image of מוּם (“blemish/defect”) without prematurely reducing it to shame. “Imara” suitably conveys מֻצָק in context. The footnotes are accurate and their anchors correspond to the relevant expressions.
  issues:
  - severity: medium
    issue: The main verb “utakapoinua” is conditional/temporal rather than future indicative.
    rationale: 'תִּשָּׂא is the future result introduced by כִּי אָז: “then you will lift up your face.” “Utakapoinua” adds a “when/if” sense not expressed in this clause.'
