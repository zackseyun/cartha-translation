  text: כִּי אָ֤ז תִּשָּׂ֣א פָנֶ֣י/ךָ מִ/מּ֑וּם וְ/הָיִ֥יתָ מֻ֝צָ֗ק וְ/לֹ֣א תִירָֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/015.yaml
  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
translation:
  language: sw
  text: Kwa maana ndipo utainua uso wako bila dosari[a]; utakuwa imara[b], wala hutaogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utainua kichwa chako bila aibu.” Kiebrania kinasema kihalisi “utainua uso wako bila dosari,” taswira ya ujasiri uliorejeshwa na kutokuwa na fedheha.
    reason: lexical_alternative
  - marker: b
    text: Au, “utakuwa thabiti” au “utaimarishwa kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: Kwa maana ndipo
  rationale: Muunganiko huu unaonyesha matokeo ya masharti yaliyotangulia katika hotuba ya Sofari; “ndipo” huwasilisha kwa kawaida maana ya wakati na matokeo.
- source_word: תִּשָּׂא פָנֶיךָ
  choice: utakapoinua uso wako
  rationale: Kauli hii inadumisha taswira ya Kiebrania ya kuinua uso, inayodokeza kurejeshewa ujasiri na kuondolewa fedheha.
- source_word: מִמּוּם
  choice: bila dosari
  rationale: Neno מוּם kwa kawaida humaanisha dosari au kasoro. Hapa limetumiwa kitamathali, lakini “bila dosari” inadumisha taswira ya chanzo bila kuifasiri moja kwa moja kuwa aibu.
- source_word: וְהָיִיתָ מֻצָק
  choice: utakuwa imara
  rationale: מֻצָק huonyesha hali ya uthabiti au kuimarishwa. “Utakuwa imara” ni Kiswahili cha kawaida na huwasilisha hali hiyo kwa uwazi.
- source_word: וְלֹא תִירָא
  choice: wala hutaogopa
  rationale: Hii ni kauli ya moja kwa moja ya wakati ujao yenye ukanushaji; “wala” huunganisha kwa kawaida matokeo ya mwisho katika mstari huu.
