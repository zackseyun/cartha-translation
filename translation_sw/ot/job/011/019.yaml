lexical_decisions:
- source_word: רָבַצְתָּ
  choice: utajilaza
  rationale: Kitenzi hiki huonyesha kujilaza au kupumzika kwa utulivu. “Utajilaza” kinahifadhi taswira halisi na katika muktadha kinadokeza usalama bila kuongeza wazo la usingizi.
- source_word: מַחֲרִיד
  choice: atakayekutia hofu
  rationale: Umbo hili humaanisha mtu anayesababisha kutetemeka au kuogopa. Usemi huu ni wa kawaida katika Kiswahili na unaeleza matokeo hayo wazi.
- source_word: חִלּוּ פָנֶיךָ
  choice: watatafuta kibali chako
  rationale: Hii ni nahau ya Kiebrania yenye maana ya kuomba au kutafuta upendeleo wa mtu. Tafsiri hii inawasilisha maana ya nahau kwa Kiswahili cha kawaida bila kutumia usemi mgumu wa moja kwa moja kuhusu uso.
- source_word: רַבִּים
  choice: wengi
  rationale: Neno hili linamaanisha watu wengi; “wengi” ni tafsiri ya moja kwa moja na ya asili katika mstari huu wa kishairi.
- source_word: וְאֵין
  choice: wala hakuna
  rationale: Muungano pamoja na ukanushi wa kuwepo unaelezwa kwa kawaida kama “wala hakuna,” huku ukihifadhi mtiririko wa kishairi wa Kiebrania.
