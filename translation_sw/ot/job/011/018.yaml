  text: And you will be secure[a], because there is hope; you will look around and lie down in safety.
translation:
  language: sw
  text: Utakuwa na uhakika, kwa sababu kuna tumaini; utatazama huku na huku[a], kisha utalala salama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utachimba huku na huku.” Kitenzi cha Kiebrania kwa kawaida huhusishwa na kuchimba, lakini hapa huenda kinamaanisha kukagua au kuandaa mahali kabla ya kulala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: Utakuwa na uhakika
  rationale: Kitenzi בטח hapa kinaonyesha hali ya kuwa na moyo thabiti na kujihisi salama kwa sababu ya tumaini. “Utakuwa na uhakika” ni Kiswahili cha kawaida kinachobeba wazo la kujiamini bila kukifanya kuwa dai la usalama wa kimwili pekee.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: kwa sababu kuna tumaini
  rationale: תִּקְוָה humaanisha “tumaini” au “matarajio”; kifungu hiki kinahifadhi uhusiano wa kisababishi unaoonyeshwa na כִּי.
- source_word: וְחָפַרְתָּ
  choice: utatazama huku na huku
  rationale: חפר kwa kawaida huhusishwa na kuchimba, lakini katika muktadha huu huenda ikaonyesha kukagua au kuandaa mazingira kabla ya kupumzika. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi taswira halisi na utata wa Kiebrania.
- source_word: לָבֶטַח
  choice: salama
  rationale: Usemi huu una maana ya usalama au hali ya kutokuwa na hofu; “kulala salama” ni Kiswahili cha kawaida na huhifadhi wazo la pumziko lenye usalama.
- source_word: תִּשְׁכָּב
  choice: kulala
  rationale: שׁכב humaanisha kulala chini. “Kulala” huhifadhi picha halisi na ni ya kawaida katika muktadha wa kupumzika.
