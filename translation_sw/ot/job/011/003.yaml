  variant: Standard East African Swahili
source:
  edition: WLC
  text: בַּ֭דֶּי/ךָ מְתִ֣ים יַחֲרִ֑ישׁו וַ֝/תִּלְעַ֗ג וְ/אֵ֣ין מַכְלִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: sw
  text: Je, maneno yako matupu yatawanyamazisha watu[a]? Je, utakapodhihaki, hakuna atakayekuaibisha?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majivuno yako” au “porojo zako” badala ya “maneno yako matupu.” Neno la Kiebrania linaweza kumaanisha maneno matupu, yasiyo na maana, ya kujigamba, au ya uongo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: maneno yako matupu
  rationale: Kirai hiki kinadumisha wazo la maneno yasiyo na maana au msingi, huku kikiacha wazi kivuli cha majivuno au udanganyifu kinachoweza kuwamo katika neno la Kiebrania.
- source_word: מְתִים
  choice: watu
  rationale: Ingawa umbo la Kiebrania linaweza kumaanisha wanaume au wanadamu, hapa marejeo ni ya jumla kwa wale wanaosikia; “watu” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: יַחֲרִישׁו
  choice: yatawanyamazisha
  rationale: 'Hifadhi maana ya kisababishi ya kitenzi cha Kiebrania: maneno hayo yanadaiwa kuwafanya watu wakae kimya.'
- source_word: וַתִּלְעַג
  choice: utakapodhihaki
  rationale: “Kudhihaki” huonyesha kejeli au dharau, na muundo wa “utakapodhihaki” unaunganisha kwa kawaida hali hiyo na swali linalofuata bila kuibadili kuwa dai.
- source_word: מַכְלִם
  choice: atakayekuaibisha
  rationale: Huwakilisha moja kwa moja tendo la kumsababishia mtu aibu au fedheha, badala ya kulifanya kuwa “kukemea,” ambalo ni fasiri finyu zaidi.
