lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: unasema
  rationale: Ingawa umbo la Kiebrania linaweza kutafsiriwa kwa wakati uliopita, katika mabishano haya Sofari anataja dai la Ayubu kama jambo analolisisitiza sasa; wakati wa sasa unasikika kwa kawaida katika Kiswahili.
- source_word: זַךְ
  choice: safi
  rationale: Kivumishi hiki humaanisha safi au isiyo na dosari, na hapa kinaeleza ubora wa mafundisho ya Ayubu.
- source_word: לִקְחִי
  choice: mafundisho yangu
  rationale: Nomino לקח inaweza kumaanisha yale ambayo mtu amejifunza au anayoyatoa kuwa fundisho; “mafundisho yangu” inaeleza maudhui ya msimamo alioutoa Ayubu.
- source_word: וּבַר
  choice: sikuwa na hatia
  rationale: בַר humaanisha safi au asiye na hatia. Katika madai kuhusu hali ya mtu mbele za Mungu, “sikuwa na hatia” ni Kiswahili cha kawaida na hutofautisha usemi huu na זַךְ, iliyotafsiriwa “safi.”
- source_word: הָיִיתִי
  choice: sikuwa
  rationale: Ni kauli timilifu ya nafsi ya kwanza umoja. Kiswahili cha wakati uliopita kinahifadhi umbo lake bila kuzuia maana ya hali ambayo msemaji anadai kuwa nayo.
- source_word: בְעֵינֶיךָ
  choice: machoni pako
  rationale: Huhifadhi taswira ya Kiebrania ya kupimwa kwa mtazamo wa mwingine na ni usemi unaoeleweka katika Kiswahili; kiwakilishi ni cha umoja na katika dai lililonukuliwa kinaelekezwa kwa Mungu.
theological_decisions:
- issue: Mrejelewa wa nafsi ya pili umoja katika “machoni pako”
  choice: Mungu ndiye anayeambiwa katika dai linalonukuliwa
  alternative: Mzungumziwa au msikilizaji kwa maana ya jumla
  rationale: Sofari anafupisha dai la Ayubu kuhusu hali yake mbele za Mungu. Tafsiri inadumisha nafsi ya pili umoja bila kuongeza ufafanuzi usiokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi wa sentensi mbili zinazolingana umehifadhiwa; hakuna tanbihi iliyoongezwa kwa sababu “mafundisho” linawasilisha vizuri maana kuu ya לִקְחִי.
