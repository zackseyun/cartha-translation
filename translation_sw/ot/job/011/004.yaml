  text: Kwa maana unasema[a], “Mafundisho yangu ni safi, nami ni safi machoni pako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maagizo yangu” au “usemi wangu.” Nomino ya Kiebrania inaweza kumaanisha kile mtu alichopokea au kukitoa kama fundisho.
