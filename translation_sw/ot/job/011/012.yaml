base_translation:
  language: en
  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: sw
  text: Lakini mtu asiye na akili atapata ufahamu wakati mwana wa punda wa porini atakapozaliwa mwanadamu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “mtu mtupu atapata moyo.” Nahau ya Kiebrania ina maana ya kupata akili au ufahamu.
    reason: lexical_alternative
  - marker: b
    text: 'Huenda mstari huu ni wa kejeli: mtu mpumbavu atakuwa na akili wakati tu ambapo mwana wa punda wa porini atazaliwa mwanadamu.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: mtu
  rationale: Nomino hii humaanisha mtu wa kiume, lakini hapa imetumiwa katika kauli ya jumla ya kimethali; “mtu” ni tafsiri ya kawaida na ya asili katika Kiswahili bila kubadili maana.
- source_word: נָבוּב
  choice: asiye na akili
  rationale: Neno hilo kimsingi lina wazo la kuwa tupu au na uwazi ndani, lakini hapa linamwelezea mtu mpumbavu au asiye na ufahamu. “Asiye na akili” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יִלָּבֵב
  choice: atapata ufahamu
  rationale: Kitenzi hiki kwa namna ya moja kwa moja kinaweza kueleweka kama “atapata moyo,” ambapo moyo ni kitovu cha akili na utambuzi. “Atapata ufahamu” huwasilisha nahau hiyo kwa uwazi huku wakati ujao ukionyesha hali ya kitenzi cha Kiebrania.
- source_word: וְ
  choice: Lakini
  rationale: Kiunganishi hapa kinaweza kuwa “na,” lakini katika muktadha kinatanguliza utofautishaji wa kejeli; “Lakini” huonyesha nguvu hiyo kwa kawaida.
- source_word: עַיִר פֶּרֶא
  choice: mwana wa punda wa porini
  rationale: Kirai hiki kinamaanisha mtoto wa punda wa mwituni. “Punda wa porini” huepuka mkanganyiko wa “punda-mwitu,” ambalo katika Kiswahili mara nyingi humaanisha pundamilia.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Hapa neno linatofautisha kiumbe wa kibinadamu na mwana wa mnyama; “mwanadamu” ni sahihi na wazi katika Kiswahili.
- source_word: יִוָּלֵד
  choice: atakapozaliwa
  rationale: Hii ni Niphal ya ילד, yenye maana ya kuzaliwa. Umbo la “atakapozaliwa” linaunganisha tukio hilo na sharti la kimethali linalotangulia.
theological_decisions:
- issue: Nguvu ya kimaanisho ya methali au kejeli
  choice: 'Kauli imetafsiriwa kama ulinganisho wa kejeli: mtu asiye na akili atapata ufahamu wakati mwana wa punda wa porini atakapozaliwa mwanadamu.'
  alternative: 'Inaweza kusomwa kwa muundo usiofafanua kejeli moja kwa moja: “mtu mtupu atapata moyo, na mwana wa punda wa porini anazaliwa mwanadamu.”'
  rationale: Kiebrania ni kifupi na kigumu, lakini usambamba unaelekea kulinganisha kupata kwa mpumbavu ufahamu na jambo lisilowezekana la mwana wa punda kuzaliwa mwanadamu. Tafsiri inadumisha ulinganisho huo bila kuongeza neno “tu,” hivyo haifungi kabisa utata wa muundo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Punda wa porini” limetumiwa badala ya “punda-mwitu” ili kuepuka maana ya kawaida ya pundamilia. Muundo mgumu wa Kiebrania na kejeli yake vimehifadhiwa, huku maelezo ya tafsiri ya moja kwa moja na nguvu ya kejeli yakiwekwa katika tanbihi.
