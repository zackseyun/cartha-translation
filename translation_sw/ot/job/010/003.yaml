base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: sw
  text: Je, ni vyema kwako kukandamiza, kuidharau kazi ya mikono yako, na kuuangazia mpango wa waovu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuupendelea mpango wa waovu.” Kitenzi cha Kiebrania kwa maana halisi ni “kuangaza” au “kung’aa”; hapa huenda kinamaanisha kuonyesha kibali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: Je, ni vyema kwako
  rationale: Huhifadhi swali la balagha kuhusu jambo lililo jema au linalofaa kwa Mungu, bila kuligeuza kuwa kauli yenye kufasiri zaidi kama ‘Je, inapendeza kwako’.
- source_word: תַעֲשֹׁק
  choice: unakandamiza
  rationale: Kitenzi עָשַׁק huonyesha kukandamiza au kudhulumu; ‘unakandamiza’ ni Kiswahili cha kawaida chenye nguvu inayolingana na lawama ya Ayubu.
- source_word: תִמְאַס
  choice: unaidharau
  rationale: מָאַס hubeba maana ya kukataa kwa dharau; ‘unaidharau’ huhifadhi dharau hiyo katika muktadha huu.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: kazi ya mikono yako
  rationale: Kirai hiki kinaweza kumaanisha taabu ya kazi au zao lake; hapa kinarejelea kile ambacho Mungu amekiumba, na msemo huu ni wa kawaida na wazi.
- source_word: עֲצַת רְשָׁעִים
  choice: mpango wa waovu
  rationale: עֵצָה inaweza kuwa shauri, kusudi, au mpango. ‘Mpango’ ni wa asili katika Kiswahili hapa na huhifadhi wazo pana la jambo ambalo waovu wamekusudia.
- source_word: הוֹפָעְתָּ
  choice: kuuangazia
  rationale: Hifili ya יָפַע kimsingi huhusiana na kung’aa au kuangaza. Tafsiri hii huhifadhi sitiari, huku maana inayowezekana ya kuonyesha kibali ikielezwa katika tanbihi.
theological_decisions:
- issue: Lawama ya Ayubu kwa Mungu iliyoelezwa kwa lugha ya moja kwa moja
  choice: Kuhifadhi swali kali la Ayubu bila kulainisha vitenzi
  alternative: Je, ni vyema kwako kuonekana kana kwamba unakandamiza...
  rationale: Kiebrania kinatoa malalamiko ya Ayubu kwa lugha kali na ya moja kwa moja. Kuongeza ‘kuonekana kana kwamba’ kungeondoa mvutano wa kitheolojia uliomo katika mstari.
- issue: Maana ya הוֹפָעְתָּ kuhusu mpango wa waovu
  choice: Kuhifadhi sitiari ‘kuuangazia’ katika matini
  alternative: kuupendelea mpango wa waovu
  rationale: Kitenzi kina maana halisi ya kuangaza, lakini katika muktadha kinaweza kudokeza kuonyesha kibali. Matini huhifadhi picha ya Kiebrania, na tanbihi huonyesha maana mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa, pamoja na lugha kali ya maombolezo. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
