base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: sw
  text: 'Je, siku zako ni kama siku za mwanadamu,[a]

    au miaka yako ni kama siku za mwanamume hodari?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanadamu anayekufa”; neno la Kiebrania אֱנוֹשׁ linaweza kusisitiza udhaifu na hali ya kufa ya binadamu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania גָבֶר linaweza pia kutafsiriwa “mwanamume”; hapa “mwanamume hodari” linahifadhi tofauti yake na אֱנוֹשׁ katika mstari wa kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: Je, siku zako ni kama siku za
  rationale: Kiulizi הֲ pamoja na kiulinganishi כ־ na יְמֵי huanzisha swali la balagha linalolinganisha muda wa Mungu na maisha ya binadamu. Muundo huu ni wa asili katika Kiswahili.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: Neno hili humaanisha binadamu na mara nyingi hudokeza udhaifu au hali yake ya kufa. “Mwanadamu” linafaa kwa maana ya kiwakilishi na pia linatofautishwa na גָבֶר katika mstari unaofuata.
- source_word: יָמֶיךָ
  choice: siku zako
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya pili umoja, ikimrejelea Mungu.
- source_word: אִם
  choice: au
  rationale: Katika usambamba huu wa kishairi, אִם huanzisha sehemu ya pili ya ulinganisho, si sharti; kwa hiyo “au” linaonyesha maana hiyo vizuri.
- source_word: שְׁנוֹתֶיךָ
  choice: miaka yako
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya pili umoja, sambamba na “siku zako.”
- source_word: כִּימֵי
  choice: kama siku za
  rationale: Inarudia ulinganisho wa sehemu ya kwanza na inatafsiriwa kwa mtindo uleule.
- source_word: גָבֶר
  choice: mwanamume hodari
  rationale: גָבֶר humaanisha mwanamume na linaweza kudokeza nguvu au ushujaa. “Mwanamume hodari” linahifadhi tofauti yake na אֱנוֹשׁ bila kulibana neno hilo kumaanisha mpiganaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Usambamba wa kishairi umehifadhiwa katika mistari miwili, na “ni” imerudiwa katika mstari wa pili ili sentensi isomeke kwa kawaida.
