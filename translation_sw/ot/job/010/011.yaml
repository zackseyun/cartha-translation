  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: sw
  text: Ulinivika ngozi na nyama, kisha ukanifuma kwa mifupa na kano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukanifunika kwa mifupa na kano.” Kitenzi cha Kiebrania kinaweza pia kumaanisha kufunika au kuzungushia.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: ngozi
  rationale: Katika muktadha wa mwili wa binadamu, neno hili linamaanisha ngozi; ndilo neno la kawaida na la moja kwa moja katika Kiswahili.
- source_word: בָשָׂר
  choice: nyama
  rationale: “Nyama” huhifadhi taswira halisi ya tishu za mwili na ulinganifu wake na “ngozi,” bila kupanua maana kuwa mwili mzima.
- source_word: תַּלְבִּישֵׁנִי
  choice: ulinivika
  rationale: Hifil ya לבש ina maana ya kumvika mtu. “Ulinivika” huhifadhi sitiari ya Mungu kuweka ngozi na nyama juu ya Ayubu na ni Kiswahili cha kawaida chenye hadhi.
- source_word: בַּעֲצָמוֹת
  choice: kwa mifupa
  rationale: Kihusishi ב hapa kinaeleweka kwa maana ya nyenzo au uhusiano; “kwa mifupa” huonyesha vilivyotumiwa katika kuunda mwili.
- source_word: גִידִים
  choice: mishipa
  rationale: Neno hili hutaja tishu zinazounganisha sehemu za mwili. “Mishipa” linaeleweka kwa urahisi na hudumisha lugha ya kishairi, ingawa “kano” ni mbadala wenye maana finyu zaidi.
- source_word: תְּסֹכְכֵנִי
  choice: ukanifuma
  rationale: Kitenzi סכך kinaweza kuonyesha kufunika, kuzungushia, au kuunganisha kwa kufuma. “Ukanifuma” huwasilisha taswira ya kuundwa na kuunganishwa kwa mwili huku tanbihi ikihifadhi maana mbadala ya kufunikwa.
theological_decisions:
- issue: Taswira ya Mungu kuunda mwili wa Ayubu
  choice: Mstari umetafsiriwa kama maelezo ya kishairi ya Mungu akiunda mwili wa Ayubu, bila kuongeza madai ya kimafundisho yasiyotajwa wazi.
  alternative: Kutafsiri kitenzi cha pili kwa maana halisi zaidi ya kufunika au kuzungushia.
  rationale: Muktadha unaeleza uundaji wa mwili wa Ayubu. “Ukanifuma” huwasilisha uundaji huo bila kuondoa uwezekano wa maana ya kufunika, ambao umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira halisi za “kuvika” na “kufuma” zimehifadhiwa kwa mtindo wa kishairi unaoeleweka kwa msomaji wa kawaida.
