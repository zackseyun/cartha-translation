  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: sw
  text: Nafsi yangu imekinai maisha yangu[a]; nitaliachia lalamiko langu huru[b]; nitasema kwa uchungu wa nafsi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nafsi yangu imechoshwa na maisha yangu.” Kitenzi cha Kiebrania kinaweza kueleza kuchoshwa sana pamoja na kuchukizwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “Nitaliacha lalamiko langu lisizuiwe.” Nahau ya Kiebrania ina maana kwamba Ayubu hatalizuia tena lalamiko lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה
  choice: imechoshwa na
  rationale: Kitenzi kinaweza kueleza kuchukizwa sana au kuchoshwa kabisa. Kiswahili ‘imechoshwa na’ ni cha kawaida na hudumisha uwezekano wa uchovu mkubwa bila kufuta maana kali ya kuchukizwa, ambayo imeelezwa katika tanbihi.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Hudumisha nahau ya Kiebrania na marudio yake katika mstari, huku ikionyesha utu wa ndani wa Ayubu.
- source_word: בְּחַיָּי
  choice: maisha yangu
  rationale: Hapa kifungu hiki kinataja maisha ya Ayubu kama kitu kinachomchosha au kumchukiza.
- source_word: אֶעֶזְבָה עָלַי שִׂיחִי
  choice: nitaliacha lalamiko langu litiririke bila kulizuia
  rationale: Nahau hii inaonyesha kwamba Ayubu hatalizuia tena lalamiko lake. ‘Litiririke bila kulizuia’ ni Kiswahili cha asili kinachowasilisha wazo la kuliacha liende kwa uhuru.
- source_word: שִׂיחִי
  choice: lalamiko langu
  rationale: Katika muktadha huu neno linahusu usemi wa huzuni na malalamiko, si tafakari isiyoegemea upande wowote.
- source_word: אֲדַבְּרָה
  choice: nitasema
  rationale: Umbo la Kiebrania linaonyesha azimio la kusema; ‘nitasema’ linawasilisha azimio hilo kwa uwazi.
- source_word: בְּמַר נַפְשִׁי
  choice: kwa uchungu wa nafsi yangu
  rationale: Kifungu kinaonyesha hali au chanzo cha kihisia cha maneno ya Ayubu. ‘Kwa uchungu wa nafsi yangu’ ni cha asili na hudumisha sitiari.
