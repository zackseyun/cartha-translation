translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unadumisha marudio ya ‘nafsi yangu’ na nguvu ya maombolezo, huku tanbihi zikihifadhi wigo wa maana wa kitenzi cha kwanza na nahau ya kuachilia lalamiko.
