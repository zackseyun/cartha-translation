base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: sw
  text: Unaleta upya mashahidi wako dhidi yangu[a], na unaongeza hasira yako juu yangu; mabadiliko na vita vimenikabili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushahidi wako”; neno la Kiebrania linaweza kumaanisha mashahidi wanaotoa ushuhuda au ushahidi unaotolewa dhidi ya Ayubu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mabadiliko na utumishi mgumu viko pamoja nami.” Maneno ya Kiebrania yanaweza pia kudokeza mafungu yanayofuatana na jeshi; huenda kuna taswira ya mashambulizi ya kijeshi yanayofuatana.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: unafanya upya
  rationale: Piel ya חדש ina maana ya kufanya upya au kuleta tena; hapa inadumisha wazo la Mungu kuleta mashahidi wapya mfululizo dhidi ya Ayubu.
- source_word: עֵדֶיךָ
  choice: mashahidi wako
  rationale: Wingi wa עֵד kwa kawaida humaanisha mashahidi, ingawa unaweza pia kumaanisha ushahidi; tafsiri hii inadumisha taswira ya kesi mahakamani.
- source_word: נֶגְדִּי
  choice: dhidi yangu
  rationale: Ingawa kimsingi ni ‘mbele yangu,’ katika muktadha wa uadui au mashtaka humaanisha kwa kawaida ‘dhidi yangu.’
- source_word: וְתֶרֶב
  choice: na kuzidisha
  rationale: Kitenzi רבה hapa kinaeleza kufanya kitu kiongezeke; ‘kuzidisha’ linaendana kwa kawaida na ‘hasira.’
- source_word: כַּעַשְׂךָ
  choice: hasira yako
  rationale: כעס inaweza kuwa hasira, ghadhabu, au kukerwa; ‘hasira yako’ ni wazi na ya kawaida katika muktadha huu.
- source_word: עִמָּדִי
  choice: kwangu
  rationale: Kihusishi ni ‘pamoja nami,’ lakini katika Kiswahili ‘hasira yako kwangu’ hutoa maana ya uhusiano unaolengwa bila kurudia ‘dhidi yangu.’
- source_word: חֲלִיפוֹת
  choice: vikosi vinavyopokezana
  rationale: Neno linaweza kumaanisha mabadiliko, zamu, au makundi yanayofuatana. Likioanishwa na צבא, linaelekea kuonyesha mawimbi ya mashambulizi au vikosi vinavyopokezana.
- source_word: וְצָבָא
  choice: na jeshi
  rationale: צבא inaweza kumaanisha jeshi, vita, au utumishi mgumu. Muunganiko wake na חֲלִיפוֹת unaunga mkono taswira ya kijeshi, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: עִמִּי
  choice: vinanikabili
  rationale: Kwa neno ni ‘pamoja nami,’ lakini muktadha wa uadui unahitaji Kiswahili cha kawaida kinachoonyesha kuwa vikosi hivyo vimemwelekea Ayubu kwa shambulio.
theological_decisions:
- issue: Iwapo mstari unapaswa kutaja utumishi mgumu au shambulio la kijeshi
  choice: Taswira ya kijeshi katika matini kuu
  alternative: ‘mabadiliko na utumishi mgumu viko pamoja nami’
  rationale: Ukaribu wa חֲלִיפוֹת na צבא pamoja na muktadha wa mashambulizi yanayorudiwa unaunga mkono taswira ya vikosi vinavyopokezana, lakini maana ya ‘utumishi mgumu’ bado inawezekana na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. ‘Vikosi vinavyopokezana’ kinafafanua usemi wa Kiebrania uliobanwa bila kuondoa utata wake, ambao umehifadhiwa katika tanbihi.
