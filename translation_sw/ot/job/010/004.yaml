  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: sw
  text: Je, una macho ya nyama, au unaona kama mwanadamu aonavyo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַ/עֵינֵי בָשָׂר לָךְ
  choice: Je, una macho ya mwili
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida umilikaji unaodokezwa na לָךְ na kuhifadhi taswira halisi ya ‘macho ya mwili’ bila kuibadili kuwa maelezo ya jumla kuhusu mtazamo wa kibinadamu.
- source_word: אִם
  choice: au
  rationale: Hapa אִם inaanzisha sehemu ya pili ya swali la balagha, si sharti; ‘au’ huwasilisha ulinganisho huo kwa Kiswahili cha kawaida.
- source_word: כִּ/רְאוֹת ... תִּרְאֶה
  choice: unaona kama ... aonavyo
  rationale: Tafsiri hii huhifadhi kitenzi ‘kuona’ na nguvu ya ulinganisho wa כ, huku ikitoa sentensi ya Kiswahili iliyo ya asili na yenye hadhi.
- source_word: אֱנוֹשׁ
  choice: mwanadamu
  rationale: ‘Mwanadamu’ ni nomino ya umoja yenye maana ya jumla kwa binadamu na inaweza kudokeza hali ya kibinadamu iliyo dhaifu na yenye kufa, bila kuongeza wazi neno ‘mwenye kufa’ lisilosemwa moja kwa moja.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa sifa za kibinadamu katika kuona
  choice: Kuhifadhi swali halisi kuhusu ‘macho ya mwili’ na kuona kama mwanadamu
  alternative: Kufafanua kuwa ‘Je, unahukumu kwa sura ya nje kama wanadamu?’
  rationale: Kiebrania kinatumia taswira thabiti inayotofautisha kuona kwa Mungu na kuona kwa mwanadamu aliye wa mwili. Kuiacha taswira hiyo hudumisha nguvu na mvutano wa swali bila kuingiza ufafanuzi wa kiteolojia.
- issue: Maana ya jumla ya nomino ya umoja אֱנוֹשׁ
  choice: mwanadamu
  alternative: mtu; binadamu mwenye kufa
  rationale: ‘Mwanadamu’ huhifadhi umoja wa mwakilishi na maana ya jumla ya jamii ya binadamu. Haibani maana kwa mwanamume pekee wala haitilii mkazo kupita kiasi wazo la kufa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kama mwanadamu aonavyo’ una ladha ya kifasihi inayofaa maandiko lakini bado unaeleweka kwa urahisi; taswira ya ‘macho ya mwili’ imehifadhiwa.
