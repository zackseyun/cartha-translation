  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: sw
  text: Basi, kwa nini ulinitoa tumboni? Ningalikufa, wala jicho lolote lisingaliniona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ningekufa, wala jicho lolote lisingeniona.” Vitenzi vya Kiebrania vinaweza kutafsiriwa kwa namna ya moja kwa moja zaidi, lakini muktadha unapendelea maana ya hali isiyotokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Basi, kwa nini
  rationale: Kiunganishi na kiulizi vinaendeleza malalamiko yaliyotangulia; “basi” huonyesha uhusiano huo wa kimantiki kwa Kiswahili cha kawaida.
- source_word: מֵרֶחֶם
  choice: tumboni
  rationale: Huhifadhi taswira halisi ya tumbo la uzazi na chanzo cha kutoka wakati wa kuzaliwa.
- source_word: הֹצֵאתָנִי
  choice: ulinitoa
  rationale: Hifili ya יצא humtaja Mungu kuwa aliyesababisha Ayubu atoke tumboni; kauli hii ni ya moja kwa moja na ya asili.
- source_word: אֶגְוַע
  choice: Ningalikufa
  rationale: Kauli ya imperfecti katika muktadha huu inaeleza matokeo yasiyotokea ambayo Ayubu anatamani yangalitokea.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: wala jicho lolote lisingaliniona
  rationale: “Jicho” limehifadhiwa kama sitiari ya mtu anayeona; “wala ... lolote” huwasilisha ukanushi kwa Kiswahili cha kawaida, na hali ya masharti huendeleza maana isiyotokea.
theological_decisions:
- issue: Hali ya vitenzi אֶגְוַע na תִרְאֵנִי
  choice: 'Kutafsiri kama matokeo ya masharti yasiyotokea: “Ningalikufa ... lisingaliniona.”'
  alternative: “Nife, wala jicho lolote lisinione” au “Ningekufa, wala jicho lolote lingeniona.”
  rationale: Imperfecti za Kiebrania zinaweza kuachwa zikiwa na maana pana zaidi, lakini muktadha wa Ayubu kutamani asingalizaliwa unaunga mkono maana ya jambo lisilotokea, bila kuifanya kauli kuwa fundisho kuhusu maisha au kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Umbo “-ngali-” limetumiwa kuonyesha kwa usahihi hali ya zamani isiyotokea; sentensi imehifadhi lugha ya kishairi ya “jicho” bila kuifanya kuwa ngumu.
