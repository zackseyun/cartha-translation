  yaml_path: translation/ot/job/010/022.yaml
  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: sw
  text: nchi ya giza, kama giza nene, ya uvuli wa mauti[a] na isiyo na utaratibu, ambako hung’aa kama giza nene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “giza zito”; neno la Kiebrania linaweza kumaanisha uvuli unaohusishwa hasa na mauti au giza lenye kina sana kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: nchi
  rationale: Katika muktadha huu neno hilo linaonyesha eneo au makao ambayo Ayubu anaelekea, si dunia kwa ujumla.
- source_word: עֵיפָתָה
  choice: giza totoro
  rationale: Neno linaeleza hali ya giza au utusitusi mkubwa; “giza totoro” ni Kiswahili cha kawaida kinachoonyesha uzito wa taswira hiyo.
- source_word: כְּמוֹ אֹפֶל
  choice: kama giza nene
  rationale: אֹפֶל ni giza zito au lenye kina, si ukosefu wa nuru tu. Kurudia kifungu hiki kunahifadhi msisitizo wa Kiebrania.
- source_word: צַלְמָוֶת
  choice: uvuli wa mauti
  rationale: Tafsiri hii inadumisha uhusiano unaowezekana na mauti katika muktadha wa Ayubu, huku maana nyingine ya giza zito ikiwekwa katika tanbihi.
- source_word: וְלֹא סְדָרִים
  choice: isiyo na utaratibu
  rationale: סְדָרִים hurejelea mpangilio au utaratibu; usemi huu unaonyesha hali ya vurugu na kutopangika kwa nchi hiyo.
- source_word: וַתֹּפַע
  choice: nayo hung’aa
  rationale: 'Kitenzi יפע humaanisha kung’aa au kuonekana kwa mwangaza. Muundo huu unaacha taswira ya fumbo ilivyo: nchi hiyo hung’aa, lakini kung’aa kwake ni kama giza nene.'
theological_decisions:
- issue: Maana ya צַלְמָוֶת
  choice: uvuli wa mauti
  alternative: giza zito
  rationale: Muundo wa neno unaweza kueleweka kuwa kivuli kinachohusishwa na mauti au giza lenye kina sana. Matini kuu inadumisha taswira ya mauti, bila kuficha uwezekano mwingine wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na hadhi ya kishairi. Marudio ya “giza nene” na fumbo la nchi kung’aa kama giza yamehifadhiwa makusudi ili kuakisi muundo na mvutano wa matini ya Kiebrania.
