  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: sw
  text: Ikiwa nimetenda uovu, ole wangu! Hata ikiwa mimi ni mwenye haki, siwezi kuinua kichwa changu; nimejaa fedheha na ninatazama mateso yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na uyaone mateso yangu,” au “tazama mateso yangu.” Muundo wa Kiebrania hapa ni mgumu; wengine huchukulia maneno haya kuwa ombi la moja kwa moja kwa Mungu badala ya mwendelezo wa Ayubu kujieleza.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: Nikitenda uovu
  rationale: Kitenzi timilifu kinaweza kueleza kutenda kwa uovu; muundo wa sharti ni wa kawaida katika Kiswahili na unahifadhi maana ya kimaadili kuliko tafsiri ya kimahakama tu kama ‘nikiwa na hatia.’
- source_word: אַלְלַי לִי
  choice: ole wangu
  rationale: Ni kilio cha maombolezo kilicho cha asili, kifupi, na chenye nguvu katika Kiswahili cha sasa.
- source_word: וְצָדַקְתִּי
  choice: Hata ikiwa nina haki
  rationale: ‘Hata ikiwa’ linaonyesha nguvu ya kukubali jambo kinyume na matarajio; ‘nina haki’ huhifadhi mchanganyiko wa maana ya uadilifu na kuwa upande wa haki.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: siwezi kuinua kichwa changu
  rationale: Nahau hiyo inaonyesha kukosa uwezo wa kusimama kwa kujiamini au kwa heshima; ‘siwezi’ linafaa na hali ya Ayubu katika muktadha.
- source_word: שְׂבַע קָלוֹן
  choice: nimejaa aibu
  rationale: שְׂבַע lina maana ya kujaa au kushibishwa, na קָלוֹן ni aibu ya kudhalilishwa; kauli hii ni ya asili na wazi kwa msomaji wa kawaida.
- source_word: וּרְאֵה עָנְיִי
  choice: na ninatazama mateso yangu
  rationale: Hii inachukulia maneno hayo kuwa mwendelezo wa maelezo ya hali ya Ayubu, huku ‘ninatazama’ likihifadhi tendo la kuona bila kulifanya waziwazi kuwa agizo kwa Mungu.
theological_decisions:
- issue: Jinsi ya kuelewa וּרְאֵה עָנְיִי
  choice: 'Mwendelezo wa Ayubu kujieleza: ‘na ninatazama mateso yangu.’'
  alternative: 'Ombi la moja kwa moja kwa Mungu: ‘na uyaone mateso yangu,’ au mshangao: ‘tazama mateso yangu.’'
  rationale: Muundo wa Kiebrania ni mgumu na unaruhusu mitazamo yote. Muktadha unaweza kuunga mkono mwendelezo wa hali ya Ayubu, lakini tanbihi inahifadhi uwezekano wa kwamba anazungumza moja kwa moja na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni rahisi kueleweka lakini inadumisha uzito wa maombolezo ya Ayubu na utata halisi wa kifungu cha mwisho.
