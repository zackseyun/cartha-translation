  text: Ningekuwa kana kwamba sikuwahi kuwako; ningechukuliwa kutoka tumboni hadi kaburini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: kana kwamba
  rationale: Katika muktadha huu neno hili linaonyesha hali isiyotimia, si wakati; “kana kwamba” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: Ningekuwa ... sikuwahi kuwako
  rationale: Mfuatano wa maumbo ya היה unaeleza hali isiyotimia ambayo Ayubu anatamani; muundo huu wa Kiswahili unatoa maana hiyo kwa uwazi bila kuugeuza kuwa wakati ujao wa kawaida.
- source_word: מִבֶּטֶן
  choice: kutoka tumboni
  rationale: Tafsiri hii inahifadhi taswira halisi ya tumbo la uzazi na mlingano wa safari kutoka tumboni hadi kaburini.
- source_word: לַקֶּבֶר
  choice: hadi kaburini
  rationale: קבר hapa ni kaburi au mahali pa kuzikia, si Sheoli; “kaburini” ni sahihi na ya kawaida.
- source_word: אוּבָל
  choice: ningechukuliwa
  rationale: Hofali ya יבל ina maana ya kupelekwa au kuchukuliwa. “Ningechukuliwa” ni ya asili katika Kiswahili na inafaa kwa taswira ya mtoto kupelekwa moja kwa moja kutoka tumboni hadi kaburini.
