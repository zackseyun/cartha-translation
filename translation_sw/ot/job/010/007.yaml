  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: sw
  text: Ingawa unajua kwamba mimi si mwovu,[a] hakuna mtu awezaye kuokoa kutoka mkononi mwako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mimi sina hatia.” Kiebrania kinasema “si mwovu,” kikisisitiza kwamba Ayubu anakataa kuwa mtu mwovu, wala si lazima adai kwamba hana dhambi kabisa.
    reason: lexical_alternative
  - marker: b
    text: “Kutoka mkononi mwako” ni msemo wa Kiebrania unaomaanisha kuokolewa kutoka chini ya mamlaka au udhibiti wa mtu.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: Ingawa unajua
  rationale: Kirai hiki kinafanya kazi kwa maana ya kukubali hali inayopingana na tendo linalolalamikiwa; ‘Ingawa unajua’ ni Kiswahili cha kawaida na huhifadhi mkazo wa Ayubu juu ya ufahamu wa Mungu.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha maudhui ya kile Mungu anachojua.
- source_word: לֹא אֶרְשָׁע
  choice: mimi si mwovu
  rationale: Kitenzi cha Kiebrania kinaweza kueleza hali hapa. ‘Si mwovu’ huhifadhi neno la kimaadili bila kulipanua kuwa dai la kutokuwa na dhambi kabisa.
- source_word: וְאֵין
  choice: hakuna mtu
  rationale: Hii ni tafsiri ya asili ya muundo wa Kiebrania unaokanusha kuwapo kwa mtu yeyote.
- source_word: מִיָּדְךָ
  choice: kutoka mkononi mwako
  rationale: Huhifadhi taswira ya Kiebrania ya ‘mkono’ kama mamlaka au udhibiti.
- source_word: מַצִּיל
  choice: awezaye kuokoa
  rationale: Nomino-tendo ya Kiebrania humaanisha mtu anayeokoa; katika muundo huu, ‘awezaye kuokoa’ huwasilisha kwa kawaida kutowezekana kwa mtu kumtoa Ayubu katika mamlaka ya Mungu.
theological_decisions:
- issue: Dai la Ayubu la kutokuwa mwovu mbele za Mungu
  choice: mimi si mwovu
  alternative: mimi sina hatia
  rationale: Kiebrania kinatumia neno lenye maana ya ‘mwovu,’ si dai la wazi la kutokuwa na dhambi kabisa. Tafsiri hii huhifadhi mvutano wa kitheolojia katika malalamiko ya Ayubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Ingawa unajua’ ni wa kawaida, na taswira ya ‘mkono’ imehifadhiwa huku ikifafanuliwa katika tanbihi.
