  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: sw
  text: Lakini mambo haya uliyaficha moyoni mwako[a]; nilijua kwamba jambo hili lilikuwa nawe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliyahifadhi moyoni mwako.” Kitenzi cha Kiebrania kinaweza kumaanisha kuficha, kuhifadhi, au kuweka akiba.
    reason: lexical_alternative
  - marker: b
    text: Maneno “lilikuwa nawe” yanaweza kumaanisha kwamba jambo hilo lilikuwa akilini mwa Mungu au lilikuwa sehemu ya kusudi lake lililofichika.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Lakini mambo haya
  rationale: Kiunganishi וְ kinaweza kumaanisha ‘na,’ lakini hapa kinaonyesha tofauti kati ya matendo mema yaliyotajwa katika mstari uliotangulia na kusudi lililofichika; ‘lakini’ huonyesha tofauti hiyo kwa Kiswahili cha kawaida. אֵלֶּה ni kiashiria cha wingi, hivyo ‘mambo haya.’
- source_word: צָפַנְתָּ
  choice: uliyaficha
  rationale: Kitenzi צפן kinaweza kumaanisha kuficha, kuweka akiba, au kuhifadhi. Katika muktadha wa kusudi lisilowekwa wazi, ‘uliyaficha’ kinadumisha vizuri wazo la usiri bila kulifafanua kupita maandishi.
- source_word: בִלְבָבֶךָ
  choice: moyoni mwako
  rationale: לֵבָב hurejelea moyo, akili, nia, au utu wa ndani. ‘Moyoni mwako’ huhifadhi sitiari ya Kiebrania na ni usemi wa asili katika Kiswahili.
- source_word: יָדַעְתִּי
  choice: nilijua
  rationale: Kauli ya nafsi ya kwanza umoja katika hali timilifu imetafsiriwa moja kwa moja kuwa ‘nilijua,’ bila kuongeza wazo la kugundua au kutambua baadaye.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי kinatanguliza maudhui ya jambo ambalo Ayubu alijua, hivyo ‘kwamba’ linafaa.
- source_word: זֹאת
  choice: jambo hili
  rationale: Kiashiria cha umoja זֹאת kimetolewa kama ‘jambo hili.’ Neno ‘jambo’ limeongezwa kwa uwazi wa kisarufi wa Kiswahili, huku rejeo lake likibaki lenye utata kama katika Kiebrania.
- source_word: עִמָּךְ
  choice: ulikuwa nalo
  rationale: עִם pamoja na kiambishi cha nafsi humaanisha kihalisi ‘pamoja nawe/kwako.’ Usemi ‘ulikuwa nalo’ ni Kiswahili cha asili kinachodumisha wazo kwamba jambo hilo lilikuwa kwa Mungu au katika kusudi lake, bila kulifafanua zaidi.
theological_decisions:
- issue: Asili ya jambo lililofichika katika maneno ya Ayubu
  choice: Kudumisha utata wa kile kinachorejelewa na ‘jambo hili,’ huku kauli ikiwasilisha malalamiko ya Ayubu kuhusu kusudi la Mungu lisilowekwa wazi.
  alternative: Kulieleza wazi kuwa mpango wa siri wa Mungu wa kumtesa Ayubu, au kuyafanya ‘mambo haya’ yarejelee tu baraka za mstari uliotangulia.
  rationale: Mstari hauelezi wazi jambo hilo ni nini. Tafsiri haipaswi kuamua mvutano wa kiteolojia ambao maandishi yenyewe yanauacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi umehifadhiwa kwa vifungu viwili vinavyotenganishwa na nukta mkato; sitiari ya ‘moyo’ na utata wa kusudi lililofichika vimedumishwa.
