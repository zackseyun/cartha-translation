lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... si
  rationale: Huanzisha swali la balagha linalotarajia kukubaliwa; muundo huu ni wa kawaida katika Kiswahili.
- source_word: מְעַט יָמַי
  choice: siku zangu si chache
  rationale: Huhifadhi maana ya kwamba siku za Ayubu zilizobaki ni chache na pia muundo wa swali la Kiebrania.
- source_word: יחדל ישית ממני
  choice: Basi acha, uniondokee
  rationale: Maneno ya Kiebrania ni mafupi na yenye ugumu wa kisarufi; kwa pamoja yanaeleza ombi kwamba Mungu akome kumshughulikia Ayubu na ajitenge naye. 'Acha, uniondokee' huhifadhi vitenzi viwili bila kufanya Kiswahili kuwa kizito.
- source_word: וְאַבְלִיגָה
  choice: ili nichangamke
  rationale: Kitenzi kinaashiria nafuu fupi, kurudi kwa moyo, au kuchangamka; 'nichangamke' ni cha kawaida na hakilazimishi maana kuwa ya nguvu za mwili pekee.
- source_word: מְעָט
  choice: kidogo
  rationale: Hueleza kiwango au muda mfupi wa nafuu kwa namna ya moja kwa moja.
