  text: Je, siku zangu si chache? Basi acha, uniondokee[a], ili nichangamke kidogo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niache” au “ugeuke mbali nami.” Usemi wa Kiebrania unaomaanisha “acha” na “ugeuke mbali nami” ni wa mkato na wa kiidioma.
    reason: alternative_reading
  - marker: b
