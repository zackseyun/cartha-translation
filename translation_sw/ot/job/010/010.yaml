  language: sw
  text: Je, hukunimimina kama maziwa, na kunifanya nigande kama jibini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kunifanya nigande kama maziwa yaliyoganda.” Nomino ya Kiebrania inaweza kutafsiriwa kwa maana mahususi zaidi kuwa “jibini,” au kwa maana ya jumla zaidi kuwa maziwa yaliyoganda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, huku-
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukubali; muundo huu ni wa kawaida na huhifadhi nguvu ya swali.
- source_word: כֶחָלָב
  choice: kama maziwa
  rationale: Kiambishi כ kinaonyesha ulinganisho; “kama maziwa” huhifadhi tashbihi kwa Kiswahili cha kawaida.
- source_word: תַּתִּיכֵנִי
  choice: hukunimimina
  rationale: Kitenzi cha Kiebrania katika Hiphil kinaonyesha kusababisha kitu kimiminike; “kunimimina” kinaendana na taswira ya maziwa na uumbaji wa mwili.
- source_word: וְכַגְּבִנָּה
  choice: na ... kama jibini
  rationale: Muunganiko pamoja na kihusishi cha ulinganisho unaanzisha tashbihi ya pili; “jibini” ni maana ya moja kwa moja ya nomino hiyo.
- source_word: תַּקְפִּיאֵנִי
  choice: kunigandisha
  rationale: Kitenzi kina maana ya kusababisha kitu kuwa kizito au kuganda. “Kunigandisha” ni cha asili katika Kiswahili na huhifadhi taswira ya maziwa yanayogeuka kuwa jibini.
