lexical_decisions:
- source_word: אֹמַר
  choice: Nitamwambia
  rationale: Kitenzi cha Qal imperfect nafsi ya kwanza umoja kinaweza kuwa cha wakati ujao au cha nia; hapa kinaanzisha yale Ayubu anayokusudia kumwambia Mungu.
- source_word: אֶל אֱלוֹהַּ
  choice: Mungu
  rationale: אֱלוֹהַּ ni jina la kawaida la Mungu katika Ayubu; “Mungu” ni tafsiri ya kawaida na yenye heshima katika Kiswahili.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: Usinihukumu kuwa na hatia
  rationale: Hiphil ya רשע ina maana ya kimahakama ya kumtangaza au kumhukumu mtu kuwa na hatia; usemi huu wa Kiswahili unahifadhi maana hiyo wazi.
- source_word: הוֹדִיעֵנִי
  choice: nijulishe
  rationale: Hiphil imperative ya ידע humaanisha kusababisha mtu ajue au kumfahamisha; “nijulishe” ni ya asili na fupi.
- source_word: עַל מַה
  choice: kwa nini
  rationale: Katika muundo huu wa swali, maneno haya yanauliza sababu au msingi wa tendo.
- source_word: תְּרִיבֵנִי
  choice: unashindana nami
  rationale: ריב inaweza kumaanisha kushindana, kubishana, au kuendesha kesi; “unashindana nami” huhifadhi upana huo bila kuifanya lugha iwe ya mahakama pekee.
theological_decisions:
- issue: Lugha ya kimahakama katika ombi la Ayubu kwa Mungu
  choice: “Usinihukumu kuwa na hatia” na “unashindana nami”
  alternative: “Usinitangaze kuwa mwenye hatia” na “unaniletea kesi”
  rationale: Tafsiri inadumisha taswira ya hukumu na mgogoro katika Kiebrania bila kuifanya aya kuwa maelezo ya kiufundi ya mahakama au kutatua mvutano wa Ayubu kumhoji Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nitamwambia” ni ya kawaida kuliko “Nitasema kwa Mungu,” na “nijulishe” hudumisha mtindo wa moja kwa moja wa ombi. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
