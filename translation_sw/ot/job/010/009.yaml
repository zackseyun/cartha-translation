  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: sw
  text: Kumbuka, tafadhali, kwamba ulinifanya kama udongo wa mfinyanzi[a]; je, utanirudisha mavumbini?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama udongo.” Maneno ya Kiebrania yanaonyesha ulinganisho, si kusema wazi “kutokana na udongo,” ingawa yanakumbusha picha ya uumbaji.
    reason: lexical_alternative
  - marker: b
    text: Au, “na utanirudisha mavumbini.” Umbo la Kiebrania linaweza kusomwa kama taarifa au, kulingana na muktadha, kama swali la balagha.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר נָא
  choice: Kumbuka, tafadhali
  rationale: Kitenzi ni amri kwa nafsi ya pili ya kiume umoja, kikielekezwa kwa Mungu; נָא huifanya amri iwe ombi la heshima. Mpangilio huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha jambo ambalo Ayubu anamwomba Mungu alikumbuke.
- source_word: כַחֹמֶר
  choice: kama udongo
  rationale: Kiambishi כַ־ kinaonyesha ulinganisho, ‘kama.’ ‘Udongo’ ni neno la kawaida la Kiswahili linaloweza kubeba picha ya udongo unaofinyangwa bila kubadili ulinganisho kuwa kauli ya wazi kwamba aliumbwa ‘kutokana na’ udongo.
- source_word: עֲשִׂיתָנִי
  choice: ulinifanya
  rationale: עשה ni kitenzi kipana chenye maana ya kufanya au kutengeneza. ‘Ulinifanya’ ni sahihi na hakiongezi maana mahsusi zaidi ya kufinyanga ambayo kitenzi chenyewe hakisemi wazi.
- source_word: וְאֶל עָפָר
  choice: mavumbini
  rationale: עָפָר katika muktadha wa uumbaji na kufa ni ‘mavumbi.’ Umbo ‘mavumbini’ linaonyesha mahali au mwisho wa kurudishwa kwa njia ya kawaida katika Kiswahili.
- source_word: תְּשִׁיבֵנִי
  choice: utanirudisha
  rationale: Hifili ya שוב ina maana ya kusababisha mtu arudi au kumrudisha. Wakati ujao wa Kiswahili unafaa katika swali la malalamiko kuhusu kurudishwa mavumbini.
theological_decisions:
- issue: Iwapo kishazi cha pili ni taarifa au swali la balagha
  choice: 'Kimetafsiriwa kama swali la balagha: ‘je, utanirudisha mavumbini?’'
  alternative: ‘na utanirudisha mavumbini.’
  rationale: Kiebrania hakina kiashiria cha swali kilicho wazi, hivyo kisarufi kinaweza kuwa taarifa. Hata hivyo, katika muktadha wa ombi na malalamiko ya Ayubu, swali la balagha linaonyesha nguvu ya maneno bila kuongeza dai jipya; tanbihi inahifadhi uwezekano wa usomaji wa taarifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kumbuka, tafadhali’ huhifadhi sauti ya ombi; ‘je’ huweka wazi usomaji wa swali la balagha, huku tanbihi ikihifadhi utata wa Kiebrania. Alama za tanbihi zimewekwa baada ya ‘udongo’ [a] na baada ya swali [b] kulingana na mambo yanayofafanuliwa.
