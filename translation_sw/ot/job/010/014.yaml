lexical_decisions:
- source_word: אִם
  choice: Nikifanya
  rationale: Muundo huu wa masharti unahifadhi maana ya ‘ikiwa’ huku ukisomeka kwa kawaida katika Kiswahili; hauamui kimya kimya kama dhambi hiyo ni ya kudhaniwa au ya kawaida.
- source_word: חָטָאתִי
  choice: Nikifanya dhambi
  rationale: Kitenzi kamilifu cha Kiebrania kinaweza kurejelea tendo lililotimia, lakini katika sentensi hii ya masharti maana ya jumla inawezekana; Kiswahili hiki kinadumisha matumizi hayo ya kimasharti.
- source_word: וּשְׁמַרְתָּנִי
  choice: wewe huniangalia kwa makini
  rationale: Katika muktadha huu שׁמר haisisitizi ulinzi wa neema bali uchunguzi wa karibu kwa sababu ya kosa; ‘huniangalia kwa makini’ huepuka maana ya kunilinda.
- source_word: וּמֵעֲוֺנִי
  choice: ya uovu wangu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu inayotokana nao. ‘Uovu wangu’ huhifadhi upande wa kimaadili bila kuufanya uwe adhabu pekee.
- source_word: לֹא תְנַקֵּנִי
  choice: wala hunitangazi kuwa sina hatia
  rationale: Piel ya נקה hapa ina maana ya kimahakama ya kumhesabia au kumtangaza mtu kuwa hana hatia. Usemi huu ni wa kawaida na wazi zaidi kwa wasomaji kuliko istilahi nzito ya kisheria.
theological_decisions:
- issue: Maana ya kimahakama dhidi ya maana ya kutakasa katika נקה
  choice: wala hunitangazi kuwa sina hatia
  alternative: wala hunitakasi; wala huniachi bila adhabu
  rationale: Muktadha wa malalamiko ya Ayubu una sura ya uchunguzi na hukumu. Tafsiri ya kimahakama inadumisha shtaka la mstari bila kuingiza dhana za ibada au mafundisho ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mstari umetumia lugha ya kawaida lakini umehifadhi sauti ya kimahakama na hali ya masharti ya Kiebrania.
