  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: sw
  text: Nikifanya dhambi[a], wewe huniangalia kwa makini[b], wala hunitangazi kuwa sina hatia ya uovu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa nimetenda dhambi.”
