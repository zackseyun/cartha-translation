  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: sw
  text: Umenijalia uhai na upendo wa kudumu, na utunzaji wako[a] umeihifadhi roho yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uangalizi wako” au “kutembelea kwako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “pumzi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: uhai
  rationale: Ingawa neno la Kiebrania lina umbo la wingi, hapa linatumika kwa maana ya jumla ya ‘uhai’; ‘uhai’ ni Kiswahili cha kawaida na linafaa katika muktadha wa Mungu kumjalia Ayubu kuishi.
- source_word: וָחֶסֶד
  choice: na upendo wa kudumu
  rationale: חֶסֶד huunganisha wema, uaminifu na upendo usioacha. ‘Upendo wa kudumu’ huhifadhi uzito huo bila kulazimisha maana finyu ya rehema au agano.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: umenijalia
  rationale: Kirai hicho kwa neno moja moja ni ‘ulifanya pamoja nami,’ lakini hapa kinaonyesha Mungu kumpa Ayubu mema yaliyotajwa. ‘Umenijalia’ ni cha asili na huhifadhi wazo la kipawa.
- source_word: וּפְקֻדָּתְךָ
  choice: na utunzaji wako
  rationale: פְקֻדָּה linaweza kumaanisha uangalizi, kujilia au utunzaji makini. Kwa kuwa utunzaji huo unaelezwa kuwa umeihifadhi roho ya Ayubu, ‘utunzaji wako’ linaonyesha vizuri maana chanya katika muktadha, huku maana nyingine zikiwekwa katika tanbihi.
- source_word: שָׁמְרָה
  choice: umeihifadhi
  rationale: Kitenzi kina maana ya kulinda, kutunza au kuhifadhi. ‘Umeihifadhi’ kinaeleza kwa uwazi kuendelezwa kwa roho au pumzi ya Ayubu.
- source_word: רוּחִי
  choice: roho yangu
  rationale: רוּחַ linaweza kumaanisha roho, pumzi au upepo. ‘Roho yangu’ linafaa kwa nafsi au uhai wa ndani unaohifadhiwa, na ‘pumzi yangu’ limehifadhiwa kama uwezekano katika tanbihi.
theological_decisions:
- issue: Maana ya חֶסֶד kuhusu tendo la Mungu
  choice: upendo wa kudumu
  alternative: fadhili; rehema; upendo mwaminifu
  rationale: Chaguo hili linahifadhi wema wenye uaminifu na udumifu bila kuingiza dai maalumu kwamba mstari unazungumzia moja kwa moja agano fulani.
- issue: Maana ya פְקֻדָּה
  choice: utunzaji mwema wa Mungu
  alternative: uangalizi; kujilia
  rationale: Kishazi kinachofuata, ‘umeihifadhi roho yangu,’ kinaelekeza kwenye utunzaji wenye manufaa, lakini upana wa neno la Kiebrania umeonyeshwa katika tanbihi badala ya kuondolewa.
- issue: Maana ya רוּחִי
  choice: roho yangu
  alternative: pumzi yangu
  rationale: Muktadha unaruhusu maana ya nafsi au uhai wa ndani, lakini maana halisi ya pumzi bado inawezekana; kwa hiyo haijafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Umenijalia’ na ‘utunzaji wako’ ni maneno yanayoeleweka kwa urahisi bila kupoteza uzito wa kishairi; tanbihi zinaendeleza utata halisi wa maneno פְקֻדָּה na רוּחַ.
