base_translation:
  language: en
  yaml_path: translation/ot/job/010/021.yaml
  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: sw
  text: kabla sijaenda—nisirudi tena—kwenye nchi ya giza na uvuli mzito,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo, “nchi ya giza na uvuli wa mauti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: kabla
  rationale: Ni kiunganishi cha wakati chenye maana ya ‘kabla’ au ‘kabla ya’; hapa kinaanzisha kwa kawaida kishazi ‘kabla sijaenda.’
- source_word: אֵלֵךְ
  choice: sijaenda
  rationale: Kitenzi הלך katika muktadha huu ni ‘kwenda.’ Muundo ‘kabla sijaenda’ ni wa kawaida katika Kiswahili na haubadili kwenda kuwa ‘kufa,’ ingawa muktadha unaelekea kwenye mauti.
- source_word: וְלֹא אָשׁוּב
  choice: nisirudi tena
  rationale: שׁוב ni ‘kurudi.’ ‘Nisirudi tena’ huonyesha kwa Kiswahili sanifu kwamba baada ya kwenda huko hatarudi, bila kutumia neno lenye mkazo zaidi kama ‘kamwe.’
- source_word: אֶל
  choice: kwenye
  rationale: Kihusishi kinaonyesha mwelekeo wa kwenda mahali. ‘Kwenye nchi’ ni usemi wa asili wa Kiswahili katika sentensi hii.
- source_word: אֶרֶץ
  choice: nchi
  rationale: Hapa אֶרֶץ ni nchi au eneo linalowakilisha makao ya wafu, si dunia kwa ujumla.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hii ndiyo maana ya msingi na ya moja kwa moja ya חֹשֶׁךְ.
- source_word: צַלְמָוֶת
  choice: uvuli mzito
  rationale: Neno hili linaweza kumaanisha uvuli au giza zito, na kwa mapokeo ‘uvuli wa mauti.’ ‘Uvuli mzito’ huhifadhi taswira ya kishairi na sambamba yake na ‘giza’ bila kulazimisha neno ‘mauti’ katika matini kuu.
theological_decisions:
- issue: Tafsiri ya צַלְמָוֶת katika muktadha wa kishairi unaohusu mauti
  choice: uvuli mzito
  alternative: uvuli wa mauti; giza nene
  rationale: Neno la Kiebrania lina utata wa kileksika kati ya tafsiri ya kimapokeo ‘uvuli wa mauti’ na maana ya giza au uvuli mzito. Matini kuu inatumia usemi wa asili unaohifadhi taswira na utata huo, huku tafsiri ya kimapokeo ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari yenye vistari virefu huhifadhi msisitizo wa sentensi ya Ayubu; ‘nisirudi tena’ inaeleweka kama matokeo ya kwenda, si amri.
