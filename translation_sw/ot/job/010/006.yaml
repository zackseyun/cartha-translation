translation:
  language: sw
  text: kwamba unautafuta uovu wangu na unaichunguza dhambi yangu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba unaitafuta hatia yangu na unaichunguza dhambi yangu.”
    reason: Neno עָוֹן linaweza kumaanisha “uovu” au “hatia” katika muktadha huu.
lexical_decisions:
- source_word: כִּי
  choice: hata
  rationale: Katika muktadha huu neno linaendeleza swali la balagha lililoanza katika mistari iliyotangulia. “Hata” huunganisha tendo hili na maswali hayo bila kulifanya kuwa sababu ya moja kwa moja.
- source_word: תְבַקֵּשׁ
  choice: uutafute
  rationale: Kitenzi בקש katika piel kinaonyesha kutafuta kwa makusudi; “uutafute” ni cha kawaida na huhifadhi wazo la kuchunguza ili kupata kosa.
- source_word: לַעֲוֺנִי
  choice: uovu wangu
  rationale: עָוֹן inaweza kumaanisha uovu, hatia, au adhabu ya hatia. “Uovu wangu” huhifadhi maana ya kosa la kimaadili katika ulinganifu huu bila kudai kwamba Ayubu kweli ana hatia.
- source_word: וּלְחַטָּאתִי
  choice: dhambi yangu
  rationale: חַטָּאת hapa ni “dhambi,” neno linalolingana na עָוֹן huku likihifadhi istilahi mbili tofauti za Kiebrania.
- source_word: תִדְרֹשׁ
  choice: kuichunguza
  rationale: דרש inaweza kumaanisha kutafuta, kuulizia, au kuchunguza. “Kuichunguza” huonyesha uchunguzi wa kina na kutofautisha kwa kawaida kitenzi hiki na “uutafute” katika mstari sambamba.
theological_decisions:
- issue: Uwasilishaji wa maneno sambamba עָוֹן na חַטָּאת
  choice: “uovu wangu” na “dhambi yangu,” bila kudokeza kwamba Ayubu anakiri kuwa na hatia
  alternative: “hatia yangu” na “dhambi yangu”
  rationale: Ayubu analalamika kwamba Mungu anaonekana kutafuta kosa ndani yake. Tafsiri inahifadhi mvutano huo wa kiteolojia bila kuamua kimbele kwamba Ayubu kweli ana hatia.
- issue: Uhusiano wa כִּי na maswali yaliyotangulia
  choice: “hata,” kama mwendelezo wa swali la balagha
  alternative: “kwa sababu” au “ili”
  rationale: “Kwa sababu” ingefanya kauli iwe ya kisababishi, na “ili” ingeweza kusisitiza kusudi kupita kiasi. “Hata” hutoa mwendelezo wa kawaida wa Kiswahili huku ikihifadhi utegemezi wa kishazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unaendelea moja kwa moja kutoka swali la balagha la mistari iliyotangulia.
