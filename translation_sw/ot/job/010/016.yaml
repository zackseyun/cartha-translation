base_translation:
  language: en
  yaml_path: translation/ot/job/010/016.yaml
  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: sw
  text: Nikijiinua[a], unaniwinda kama simba, na tena unajionyesha wa ajabu[b] dhidi yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni kigumu na kina usemi wa mkato. Kwa maana ya moja kwa moja, kitenzi ni cha nafsi ya tatu, umoja wa kiume; pia inaweza kueleweka, “Na ikiwa kinainuka,” “Na ikiwa anainuka,” au “Nikitukuzwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “unatenda mambo ya ajabu dhidi yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kujionyesha kuwa wa ajabu au kutenda mambo yasiyo ya kawaida; hapa kinatumika katika muktadha wa uadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: Akijiinua
  rationale: Kitenzi גאה kina maana ya kuinuka au kutukuzwa. Umbo la Kiebrania ni nafsi ya tatu, umoja wa kiume, na kirai ni cha mkato; tafsiri inadumisha nafsi hiyo na kutoweka wazi ni nani au nini kinachoinuka.
- source_word: כַּשַּׁחַל
  choice: kama simba
  rationale: שַׁחַל humaanisha simba, hasa kwa picha ya nguvu na ukali; “simba” ni wazi na ya kawaida bila kuongeza jinsia isiyotajwa.
- source_word: תְּצוּדֵנִי
  choice: unaniwinda
  rationale: Mzizi צוד huonyesha kuwinda au kumfuatia windo; “unaniwinda” inadumisha picha ya mtu kuwa windo.
- source_word: וְתָשֹׁב
  choice: kisha ... tena
  rationale: שׁוב kwa msingi ni kurudi, lakini hapa inaonyesha kutendeka kwa jambo kwa mara nyingine; muundo huu ni wa asili katika Kiswahili.
- source_word: תִּתְפַּלָּא
  choice: unatenda ... mambo ya ajabu
  rationale: Hitpaeli ya פלא inaweza kumaanisha kujionyesha kuwa wa ajabu au kutenda jambo lisilo la kawaida. Kiswahili hiki kinahifadhi wazo la tendo la kushangaza bila kulifanya liwe tendo jema.
- source_word: בִי
  choice: dhidi yangu
  rationale: Ingawa ב inaweza kuwa “ndani yangu,” “kwangu,” au “juu yangu,” muktadha wa uadui na mateso unaunga mkono “dhidi yangu.”
theological_decisions:
- issue: Maana ya פלא katika muktadha wa tendo la Mungu linalomtesa Ayubu
  choice: unatenda tena mambo ya ajabu dhidi yangu
  alternative: unajionyesha tena kuwa wa ajabu dhidi yangu
  rationale: Tafsiri inahifadhi mvutano wa matendo ya Mungu kuwa ya kushangaza huku Ayubu akiyaona yakielekezwa dhidi yake; haibadili “ajabu” kuwa wema wala kuwa shambulio tu.
- issue: Kiima cha וְיִגְאֶה kilichoachwa katika usemi wa mkato
  choice: Akijiinua
  alternative: Nikijiinua
  rationale: Umbo la Kiebrania ni nafsi ya tatu, umoja wa kiume. Kulibadili moja kwa moja kuwa nafsi ya kwanza kungesuluhisha utata wa maandishi; tanbihi inaonyesha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “Akijiinua” umechaguliwa ili kuhifadhi nafsi ya tatu na utata wa usemi wa Kiebrania; tanbihi hutoa usomaji wa nafsi ya kwanza unaowezekana katika muktadha.
