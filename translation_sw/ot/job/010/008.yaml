base_translation:
  language: en
  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: sw
  text: Mikono yako ilinifinyanga na kunifanya[a], kwa pamoja, pande zote[b]; lakini unanimeza[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliniumba” au “ilinitengeneza.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kwa pamoja, pande zote,” kikionyesha kwamba Mungu alimuumba Ayubu kikamilifu, kila upande.
    reason: cultural_note
  - marker: c
    text: Au “unaniangamiza.” Kiebrania kinasema kihalisi “unanimeza,” picha yenye nguvu ya maangamizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  choice: Mikono yako
  rationale: Nomino ya Kiebrania ni ya wingi ikiwa na kiambishi cha nafsi ya pili umoja; wingi umehifadhiwa ili kuendeleza picha ya Mungu kama mfanyaji anayehusika binafsi.
- source_word: עִצְּבוּנִי
  choice: ilinifinyanga
  rationale: Kitenzi עצב katika Piel hapa kina maana ya kuumba au kutengeneza kwa makusudi. “Kufinyanga” huhifadhi picha ya ufundi na uundaji wa umbo bila kuifanya kuwa maelezo ya jumla tu.
- source_word: וַיַּעֲשׂוּנִי
  choice: na kunifanya
  rationale: עשה ni kitenzi cha kawaida cha kufanya au kutengeneza. “Kunifuanya” kinafuata kwa kawaida baada ya “kunifinyanga” na kuhifadhi urudiaji wa kishairi.
- source_word: יַחַד סָבִיב
  choice: pande zote kwa pamoja
  rationale: Maneno haya yana maana halisi ya “kwa pamoja, kuzunguka/pande zote” na yanaonyesha uundaji kamili wa Ayubu. Mpangilio huu huhifadhi picha ya pande zote bila kuingiza neno lisilokuwapo kama “mzima.”
- source_word: וַתְּבַלְּעֵנִי
  choice: lakini unanimeza kabisa
  rationale: בלע humaanisha kumeza, na mara nyingi hutumiwa kisitiari kwa kuangamiza. Picha hai ya kumezwa imehifadhiwa; “lakini” huonyesha tofauti kali inayotokana na muktadha wa malalamiko.
theological_decisions:
- issue: Lugha ya kumweleza Mungu kwa viungo vya kibinadamu katika uumbaji
  choice: Kuhifadhi usemi halisi “Mikono yako” pamoja na vitenzi viwili vya uundaji.
  alternative: Uliumba; uliumba mwili wangu.
  rationale: Ayubu anarejelea ustadi wa karibu na wa binafsi wa Mungu katika kumuumba. Kuifanya kuwa kauli ya jumla tu kungepunguza nguvu ya picha ya Kiebrania.
- issue: Mvutano kati ya Mungu kumuumba Ayubu na kuonekana kumwangamiza
  choice: 'Kuhifadhi tofauti kali: “lakini unanimeza kabisa.”'
  alternative: na sasa unaniangamiza; ili uniangamize.
  rationale: Malalamiko ya Ayubu yanaweka kwa makusudi uumbaji wa Mungu kando ya tendo lake linaloonekana kuwa la uharibifu. Tafsiri hailainishi wala kutatua mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. “Kufinyanga” hudumisha taswira ya fundi; alama ya nukta mkato huunganisha na pia kutofautisha uumbaji na maangamizi.
