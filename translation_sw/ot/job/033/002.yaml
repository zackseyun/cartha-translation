translation:
  language: sw
  text: Tazama sasa[a], nimefungua kinywa changu; ulimi wangu umenena katika kaakaa langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama, tafadhali, nimefungua kinywa changu; ulimi wangu umenena kinywani mwangu.” Kiebrania kina taswira dhahiri sana, na kishazi chake cha mwisho si cha kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kiingizi hiki kinavuta usikivu kwa yale yanayofuata. “Tazama” ni la sasa, lenye hadhi, na linahifadhi nguvu ya usemi wa Kiebrania.
- source_word: נָא
  choice: sasa
  rationale: Chembe hii huongeza msisitizo au ombi. Hapa Elihu anavuta usikivu kwa hotuba yake, kwa hiyo “sasa” linafaa kuliko kulifanya ombi la adabu moja kwa moja.
- source_word: פָּתַחְתִּי פִי
  choice: nimefungua kinywa changu
  rationale: Tafsiri hii inahifadhi picha halisi ya nahau ya Kiebrania ya kuanza kusema, pamoja na hali timilifu ya kitenzi.
- source_word: דִּבְּרָה
  choice: unanena
  rationale: Umbo hili lisilo la kawaida linaeleweka kama kitenzi ambacho kiima chake ni “ulimi wangu.” Wakati wa sasa unawasilisha kwa uwazi tendo linaloendelea la kusema bila kuongeza wazo lisilotajwa la ‘kuanza.’
- source_word: לְשׁוֹנִי
  choice: ulimi wangu
  rationale: Kiungo cha mwili kimetajwa moja kwa moja lakini kinawakilisha usemi; hivyo usambamba wa kishairi na “kinywa changu” unabaki.
- source_word: בְחִכִּי
  choice: kaakaani mwangu
  rationale: חֵךְ ni kaakaa, yaani paa la kinywa. Umbo la mahali “kaakaani mwangu” linahifadhi picha halisi na usemi usio wa kawaida wa Kiebrania badala ya kuufanya kuwa “kinywani mwangu.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye hadhi na unaoeleweka. “Kaakaani mwangu” ni usemi wa makusudi ulio halisi na usio wa kawaida kidogo, kwa kuwa ndivyo ilivyo picha ya chanzo.
