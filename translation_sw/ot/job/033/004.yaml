  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: sw
  text: 'Roho ya Mungu imeniumba[a],

    na pumzi ya Mwenyezi hunipa uhai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pumzi ya Mungu imeniumba.” Neno la Kiebrania רוּחַ linaweza pia kumaanisha “pumzi” au “upepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Roho
  rationale: Katika muundo wa ‘Roho ya Mungu’ na sambamba na ‘pumzi ya Mwenyezi,’ neno hili linaeleweka kama nguvu/uwepo wa Mungu unaotoa uhai. ‘Roho’ huhifadhi maana kuu huku tanbihi ikitaja maana nyingine halisi ya neno hilo.
- source_word: אֵל
  choice: Mungu
  rationale: Hapa ni jina la Mungu, likiwa sambamba na שַׁדַּי; ‘Mungu’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: עָשָׂתְנִי
  choice: imeniumba
  rationale: Kitenzi עשה humaanisha kufanya au kutengeneza; katika muktadha wa asili na uhai wa msemaji, ‘imeniumba’ ni Kiswahili cha asili kinachoeleza tendo la Mungu bila kuongeza wazo maalumu la kufinyanga.
- source_word: נִשְׁמַת
  choice: pumzi
  rationale: Neno hili linaonyesha pumzi inayohuisha. ‘Pumzi’ huhifadhi taswira ya uhai na usambamba wa kishairi na ‘Roho.’
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: ‘Mwenyezi’ ni tafsiri ya heshima na iliyozoeleka ya cheo שַׁדַּי katika Kiswahili, badala ya kulinakili kama Shaddai.
- source_word: תְּחַיֵּנִי
  choice: hunipa uhai
  rationale: Muundo wa kisababishi wa חיה una maana ya kufanya mtu aishi. ‘Hunipa uhai’ ni wa sasa, wa asili, na huonyesha tendo la Mungu la kuhuisha.
theological_decisions:
- issue: Iwapo רוּחַ אֵל itafsiriwe kuwa ‘Roho ya Mungu’ au ‘pumzi ya Mungu’
  choice: Roho ya Mungu
  alternative: pumzi ya Mungu
  rationale: ‘Roho ya Mungu’ hutofautisha רוּחַ na נִשְׁמַת katika mstari wa pili na kuhifadhi usambamba wa kishairi. Hata hivyo, kwa kuwa רוּחַ pia inaweza kumaanisha pumzi au upepo, tanbihi huhifadhi utata huo wa asili bila kuulazimisha kuwa dai pana zaidi la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari miwili unahifadhi usambamba wa kishairi. ‘Imeniumba’ inapatana kisarufi na ‘Roho,’ na ‘hunipa uhai’ ni usemi wa kawaida unaowasilisha tendo endelevu la kutoa uhai.
