  source_fidelity: The draft correctly renders the imperatives and the promise to teach wisdom. However, אִם אַיִן is tersely elliptical ('if not/otherwise'); rendering it as 'Lakini kama huna la kusema' adds both an adversative ('Lakini') and the specific object 'la kusema.' The latter is inferable from the preceding context but is not stated in this verse.
  naturalness: '''Kama sivyo, nisikilize; nyamaza, nami nitakufundisha hekima'' is natural, clear Standard East African Swahili and retains the dignified directness of Elihu''s speech.'
  terminology: '''hekima'' appropriately renders חָכְמָה, and ''nyamaza'' appropriately renders the imperative הַחֲרֵשׁ. ''Nisikilize'' accurately conveys attentive listening directed to the speaker.'
