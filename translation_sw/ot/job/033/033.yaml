  text: Kama sivyo, nisikilize; nyamaza, nami nitakufundisha hekima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אַיִן
  choice: lakini kama huna la kusema
  rationale: 'Kirai hiki kinaweka hali iliyo kinyume na mwaliko wa mstari uliotangulia: ikiwa Ayubu hana jambo la kujibu, anapaswa kumsikiliza Elihu. Nyongeza ya kimuktadha ‘la kusema’ inaifanya sentensi iwe wazi na ya kawaida kwa Kiswahili bila kubadili sharti hilo.'
- source_word: שְׁמַע לִי
  choice: nisikilize
  rationale: Kitenzi שׁמע pamoja na ל kinaonyesha kumsikiliza msemaji kwa makini. ‘Nisikilize’ ni amri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: הַחֲרֵשׁ
  choice: nyamaza
  rationale: Amri ya חרש hapa inamtaka Ayubu akae kimya. ‘Nyamaza’ ni fupi, wazi, na yenye hadhi katika muktadha huu.
- source_word: וַאֲאַלֶּפְךָ
  choice: nami nitakufundisha
  rationale: Kitenzi אלף katika piel humaanisha kufundisha au kuelekeza. Muundo huu wa wakati ujao unaofuata amri mbili unawasilishwa kwa kawaida kama ‘nami nitakufundisha.’
- source_word: חָכְמָה
  choice: hekima
  rationale: ‘Hekima’ ni neno la kawaida la Kiswahili kwa חָכְמָה na linadumisha msamiati mkuu wa fasihi ya hekima.
