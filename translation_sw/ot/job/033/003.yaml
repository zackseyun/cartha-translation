  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: sw
  text: Unyofu wa moyo wangu unaonekana katika maneno yangu, na midomo yangu hunena maarifa kwa uwazi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “midomo yangu hunena maarifa safi,” au, “midomo yangu hutamka wazi yale ninayoyajua.” Neno la Kiebrania lililotafsiriwa “kwa uwazi” linaweza pia kuwa na maana ya usafi au usemi wa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: unyofu
  rationale: Neno hili huonyesha unyookevu au uadilifu wa kimaadili. “Unyofu” ni la kawaida na linafaa kwa dai la Elihu kuhusu hali ya ndani iliyo ya kweli na yenye haki.
- source_word: לִבִּי
  choice: moyo wangu
  rationale: “Moyo” huhifadhi taswira ya Kiebrania ya utu wa ndani, ikihusisha mawazo, nia na maamuzi.
- source_word: אֲמָרַי
  choice: maneno yangu
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kauli au matamshi ya Elihu.
- source_word: וְדַעַת
  choice: maarifa
  rationale: Neno hili linataja yale yanayojulikana au ufahamu unaotamkwa; “maarifa” huhifadhi maana ya msingi bila kuifafanua kupita kiasi.
- source_word: שְׂפָתַי
  choice: midomo yangu
  rationale: Taswira ya kishairi imehifadhiwa, pamoja na ulinganifu wake na “moyo wangu.”
- source_word: בָּרוּר
  choice: kwa uwazi
  rationale: Katika muktadha wa kunena, kirai hiki kinasomeka kwa kawaida na kuonyesha usemi ulio wazi; hata hivyo, neno la Kiebrania linaweza pia kumaanisha usafi au unyofu wa usemi.
- source_word: מִלֵּלוּ
  choice: hunena
  rationale: “Hunena” lina hadhi ya kishairi lakini bado linaeleweka katika Kiswahili cha sasa; hali ya sasa inaendana na maelezo ya Elihu kuhusu usemi wake.
theological_decisions: []
