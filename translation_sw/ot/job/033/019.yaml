  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: sw
  text: 'Pia hukemewa kwa maumivu akiwa kitandani mwake,

    na kwa mapambano yasiyokoma katika mifupa yake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwa mapambano makali katika mifupa yake.” Kivumishi cha Kiebrania kinaweza kumaanisha “ya kudumu/yasiyokoma” au “makali/yenye nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  choice: Pia anaonywa
  rationale: Hophal ya יכח inaonyesha kwamba mtu anaonywa, anasahihishwa, au anatiwa nidhamu. “Anaonywa” inadumisha wazo la Mungu kumrekebisha mtu kupitia mateso bila kudai kwamba hayo ni adhabu tu; וְ imetafsiriwa “Pia” kuunganisha njia hii na njia zilizotajwa kabla.
- source_word: בְּמַכְאוֹב
  choice: kwa maumivu
  rationale: מַכְאוֹב humaanisha maumivu au mateso, na ב hapa inaonyesha chombo au njia ambayo onyo linatolewa.
- source_word: עַל מִשְׁכָּבוֹ
  choice: kitandani mwake
  rationale: Kirai hiki kinaonyesha mahali na hali ya mgonjwa aliyelazwa; “kitandani mwake” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: וְרִיב
  choice: na kwa mateso
  rationale: רִיב kwa kawaida ni ugomvi, pambano, au mzozo. Inapotumiwa pamoja na mifupa, ni sitiari ya maumivu makali ya ndani; “mateso” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila picha isiyoeleweka ya mifupa kugombana.
- source_word: עֲצָמָיו
  choice: mifupani mwake
  rationale: Tafsiri inadumisha taswira halisi ya mifupa, ambayo huonyesha mateso ya ndani kabisa ya mwili.
- source_word: אֵתָן
  choice: yasiyokoma
  rationale: אֵתָן inaweza kumaanisha kinachodumu au kilicho imara/chenye nguvu. “Yasiyokoma” hufaa kwa mateso ya kudumu katika muktadha huu; maana nyingine imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Hali ya mateso kuwa tendo la Mungu
  choice: Mateso yanaonyeshwa kuwa njia ya onyo au marekebisho ya Mungu, bila kuyaeleza moja kwa moja kuwa adhabu.
  alternative: Mateso ni hukumu ya adhabu pekee, au ni ugonjwa wa kawaida usio na utendaji wa Mungu.
  rationale: Katika hoja ya Elihu, Mungu humfikia mtu kwa njia ya mateso. “Anaonywa” huhifadhi wazo la marekebisho bila kuingiza fundisho kamili la malipo au adhabu ambalo mstari wenyewe halitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa kishairi umehifadhiwa kwa mistari miwili. “Mateso” limetumiwa kwa רִיב katika muktadha wa mwili ili kutoa maana ya sitiari kwa uwazi, huku utata wa אֵתָן ukihifadhiwa katika tanbihi.
