  text: פָּדָ֣ה נפש/י מֵ/עֲבֹ֣ר בַּ/שָּׁ֑חַת ו/חית/י בָּ/א֥וֹר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: sw
  text: 'Ameikomboa nafsi yangu isije ikaingia shimoni[a][b],

    na uhai wangu utauona mwanga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ameukomboa uhai wangu usije ukaingia shimoni.”
    reason: lexical_alternative
  - marker: b
    text: “Shimo” ni picha inayotumiwa mara nyingi katika Kiebrania kumaanisha mauti au kaburi.
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: ameikomboa
  rationale: Kitenzi hiki huonyesha kukomboa au kuokoa kutoka hatarini. “Ameikomboa” kinahifadhi wazo la tendo lililotimizwa lenye matokeo ya sasa bila kudokeza wazi kwamba bei ililipwa.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yangu” inadumisha utofauti wa kishairi na חַיָּתִי (“uhai wangu”) katika mstari unaofuata.
- source_word: מֵעֲבֹר
  choice: isiingie
  rationale: Muundo huu unaonyesha kuzuiwa kuvuka mpaka na kuingia mahali fulani. “Isiingie” ni Kiswahili cha kawaida kinachowasilisha mwendo wa kuelekea shimoni bila kuwa kizito.
- source_word: בַּשַּׁחַת
  choice: shimoni
  rationale: שַׁחַת kimsingi ni shimo na katika ushairi huwakilisha mauti au kaburi. “Shimoni” kinahifadhi picha halisi na maana yake pana.
- source_word: וְחַיָּתִי
  choice: na uhai wangu
  rationale: Nomino hii inamaanisha uhai au kuwako hai. Tafsiri hii inadumisha usambamba wa kishairi na “nafsi yangu.”
- source_word: בָּאוֹר
  choice: mwanga
  rationale: Mwanga hapa unatofautishwa na shimo na huenda unawakilisha kuendelea kuishi; tafsiri inahifadhi picha hiyo bila kuifafanua kupita kiasi.
- source_word: תִּרְאֶה
  choice: utauona
  rationale: Kitenzi cha wakati usiotimilika kinaeleweka hapa kwa maana ya wakati ujao. “Utauona” ni cha kawaida na huonyesha kushuhudia au kufurahia mwanga baada ya kuokolewa.
theological_decisions:
- issue: Mhusika wa kitenzi cha mwanzo
  choice: Ameikomboa nafsi yangu
  alternative: Mungu ameikomboa nafsi yangu
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya tatu ya kiume lakini mhusika hatajwi wazi katika aya hii. Muktadha unaelekeza kwa Mungu, lakini tafsiri haiongezi jina “Mungu,” hivyo inadumisha udokezo wa matini.
- issue: Uhusiano kati ya nafsi na uhai
  choice: nafsi yangu … uhai wangu
  alternative: uhai wangu … mimi
  rationale: Maneno mawili tofauti ya Kiebrania yamedumishwa ili kuhifadhi usambamba na utofauti wa kishairi bila kuyafanya kuwa maelezo madhubuti ya sehemu mbili tofauti za mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mistari miwili unahifadhi usambamba wa kishairi; “shimoni” na “mwanga” zinadumisha utofauti wa picha za kifo na uhai.
