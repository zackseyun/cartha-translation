translation:
  language: sw
  text: Lakini sasa, Ayubu, tafadhali sikia maneno yangu, na usikilize maneno yangu yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na utege sikio kwa maneno yangu yote.” Kiebrania kinatumia nomino mbili zinazokaribiana (“maneno yangu” / “maneno yangu yote”) na vitenzi viwili vya kusikia ili kutia msisitizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini sasa
  rationale: Kifungu hiki kinaashiria badiliko lenye msisitizo katika hotuba ya Elihu; “Lakini sasa” huwasilisha nguvu ya upinzani na mpito kwa Kiswahili cha kawaida.
- source_word: שְׁמַע
  choice: yasikie
  rationale: Kitenzi cha kuamuru cha שׁמע kimefasiriwa moja kwa moja kama “yasikie,” kikielekezwa kwa “maneno yangu” na kutofautishwa na kitenzi cha pili cha kusikiliza kwa makini.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe hii hulainisha amri na kuifanya ombi la heshima; “tafadhali” ni ya sasa na ya kawaida katika Kiswahili.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika mapokeo ya Kiswahili.
- source_word: מִלָּי
  choice: maneno yangu
  rationale: Huhifadhi kwa uwazi nomino ya wingi pamoja na kiambishi cha nafsi ya kwanza.
- source_word: וְכָל
  choice: na ... yote
  rationale: Huhifadhi maana jumuishi ya כָּל kwa muundo wa kawaida wa Kiswahili.
- source_word: דְּבָרַי
  choice: ninayosema
  rationale: Kifungu hiki cha asili kinakaribiana kimaana na “maneno yangu.” “Ninayosema” huonyesha utofauti huo mdogo bila kuunda Kiswahili kisicho cha kawaida.
- source_word: הַאֲזִינָה
  choice: usikilize
  rationale: Kitenzi hiki cha kuamuru kinadokeza kutega sikio au kusikiliza kwa makini; “usikilize” ni cha asili na kinahifadhi ulinganifu na “yasikie.”
