  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: sw
  text: ‘Mimi ni safi[a], sina kosa; mimi sina hatia, wala uovu[b] haumo ndani yangu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asiye na doa.”
    reason: lexical_alternative
  - marker: b
    text: Au “hatia”; neno la Kiebrania linaweza kumaanisha uovu, kosa, au hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  choice: safi
  rationale: Katika muktadha huu kivumishi hiki kinaeleza usafi wa kimaadili. “Safi” ni neno la kawaida na lenye hadhi, huku tofauti yake na חַף ikihifadhiwa kwa kutumia “sina hatia” baadaye.
- source_word: בְּלִי פָשַׁע
  choice: sina kosa
  rationale: בְּלִי huonyesha kutokuwapo kwa kitu, na פֶּשַׁע inaweza kumaanisha kosa au uasi. “Sina kosa” ni Kiswahili cha asili kinachohifadhi maana ya kimaadili na kisheria bila kuifanya iwe hasa uasi wa kiagano.
- source_word: חַף
  choice: sina hatia
  rationale: Neno hili huonyesha kuwa safi au kutokuwa na hatia. “Sina hatia” huwasilisha wazi maana yake ya kimahakama na kuepuka kurudia “safi.”
- source_word: עָוֺן
  choice: uovu
  rationale: עָוֺן inaweza kumaanisha uovu, hatia, au kosa. “Uovu” huhifadhi uzito wa kimaadili, huku uwezekano wa maana ya “hatia” ukitajwa katika tanbihi.
- source_word: לִי
  choice: haumo ndani yangu
  rationale: Ingawa kihalisi ni “kwangu,” katika sentensi hii Kiswahili cha kawaida huonyesha hali au sifa inayohusishwa na mtu kwa kusema “ndani yangu.”
theological_decisions:
- issue: Kiwango cha dai la Ayubu katika nukuu ya Elihu
  choice: Kauli imetafsiriwa moja kwa moja kuwa dai la usafi wa kimaadili na kutokuwa na hatia, bila kuipunguza wala kuiongeza.
  alternative: “Najiona kuwa safi,” au lugha ya kutokuwa na dhambi kabisa iliyo kali kuliko maneno ya Kiebrania.
  rationale: Kiebrania kina viarifu vya moja kwa moja na vyenye mkazo. Tafsiri inadumisha mvutano wa kitheolojia bila kuamua kama tathmini hiyo ya Ayubu ni sahihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa kishairi wenye vipashio sambamba umehifadhiwa, na viwakilishi vya “mimi” vinadumisha mkazo wa Kiebrania.
