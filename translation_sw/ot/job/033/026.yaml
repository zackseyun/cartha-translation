id: JOB.33.26
reference: Job 33:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יֶעְתַּ֤ר אֶל אֱל֨וֹהַּ וַ/יִּרְצֵ֗/הוּ וַ/יַּ֣רְא פָּ֭נָי/ו בִּ/תְרוּעָ֑ה וַ/יָּ֥שֶׁב לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: sw
  text: Anamwomba Mungu kwa bidii[a], naye Mungu anamkubali. Anaona uso wake[b] kwa shangwe, naye Mungu anamrudishia mwanadamu haki yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anamsihi Mungu.” Kitenzi cha Kiebrania kinaweza kusisitiza ombi la dhati katika sala.
    reason: lexical_alternative
  - marker: b
    text: Yaani, anaona uso wa Mungu; Kiebrania kinasema tu “uso wake.”
    reason: alternative_reading
  - marker: c
    text: Au, “hali yake ya kuwa sawa” au “uthibitisho wa haki yake.” Neno la Kiebrania “haki” hapa linaweza kumaanisha hali yake iliyorejeshwa mbele za Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: anamwomba Mungu kwa bidii
  rationale: Kitenzi עתר kinaonyesha sala ya kusihi au kuomba kwa dhati. Kauli hii ni ya kawaida katika Kiswahili na inahifadhi uzito wa ombi.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: אֱלוֹהַּ ni neno la kishairi la umoja linalomtaja Mungu; hakuna msingi wa kuongeza jina au sifa nyingine.
- source_word: וַיִּרְצֵהוּ
  choice: naye Mungu anamkubali
  rationale: רצה hapa ina maana ya kumpokea mwombaji kwa kibali. Kutaja Mungu tena kunaondoa utata usio wa lazima wa viwakilishi katika Kiswahili.
- source_word: וַיַּרְא פָּנָיו
  choice: Anaona uso wake
  rationale: Tafsiri hii inahifadhi ufupi na kiwakilishi cha Kiebrania. Muktadha unaelekea kumaanisha kuwa mwanadamu anaona uso wa Mungu, lakini dokezo linaeleza rejeleo hilo.
- source_word: בִּתְרוּעָה
  choice: kwa shangwe
  rationale: תְּרוּעָה linaweza kuashiria kilio au sauti ya furaha. 'Kwa shangwe' ni ya asili katika Kiswahili, huku dokezo likihifadhi picha ya sauti ya furaha.
- source_word: וַיָּשֶׁב
  choice: anamrudishia
  rationale: 'Hifili ya שוב ni ya kusababisha: kurudisha au kurejesha kitu kwa mtu.'
- source_word: לֶאֱנוֹשׁ
  choice: mwanadamu
  rationale: אֱנוֹשׁ humaanisha binadamu, mara nyingi kwa kusisitiza hali yake ya kufa. 'Mwanadamu' ni ya heshima na haibani maana kwa jinsia moja.
- source_word: צִדְקָתוֹ
  choice: haki yake
  rationale: צדקה kimsingi ni haki au uadilifu. 'Haki yake' huhifadhi upana wa neno bila kulazimisha fundisho maalumu kuhusu namna haki hiyo inavyopatikana.
theological_decisions:
- issue: Rejeleo la viwakilishi katika 'anamkubali; anaona uso wake'
  choice: Mungu anamkubali mwanadamu anayeomba, kisha mwanadamu anaona uso wa Mungu.
  alternative: Mungu ndiye anayeona uso wa mwanadamu; au, kwa uwezekano mdogo zaidi, mwanadamu ndiye anayemkubali Mungu.
  rationale: Mtiririko wa muktadha unaonyesha mwanadamu akimwendea Mungu na kupokea kibali, na kuona uso wa Mungu ni picha ya ushirika uliorejeshwa. Hata hivyo, kiwakilishi cha Kiebrania pekee hakimtaji Mungu wazi, hivyo dokezo linabainisha tafsiri iliyofuatwa.
- issue: Maana ya צִדְקָתוֹ, 'haki yake'
  choice: Mungu anamrudishia mwanadamu haki yake, yaani hali yake ya kuwa sawa au kuthibitishwa kuwa mwenye haki.
  alternative: Mungu anamrejeshea uthibitisho wa haki yake mbele ya wengine; au neno hilo linaweza kueleweka kuwa haki ya Mungu anayopewa mwanadamu.
  rationale: Kiambishi cha umilikaji kinaelekea kwa mwanadamu katika muktadha huu. Kutafsiri 'haki yake' huhifadhi mvutano na upana wa Kiebrania bila kuingiza dhana maalumu ya kiteolojia isiyotajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa sentensi fupi, huku marudio ya 'Mungu' yakisaidia uwazi wa mtendaji bila kufuta utata halisi wa viwakilishi.
