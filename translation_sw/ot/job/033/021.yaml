  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
translation:
  language: sw
  text: Nyama yake hukonda hadi isionekane tena[a], na mifupa yake, iliyokuwa haionekani, hujitokeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nyama yake huisha isionekane tena, na mifupa yake iliyokuwa haionekani huwekwa wazi.” Kiebrania cha mstari huu ni kifupi na kina ugumu fulani, hasa kitenzi kilichotafsiriwa “hujitokeza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכֶל
  choice: hukonda
  rationale: Kitenzi מן כלה kinaeleza mwili kuisha au kudhoofika; “hukonda” ni Kiswahili cha kawaida kinachowasilisha kudhoofika kwa nyama katika muktadha wa ugonjwa.
- source_word: בְּשָׂרוֹ
  choice: nyama yake
  rationale: Huhifadhi taswira halisi ya בשר na kutofautisha nyama na mifupa katika mstari huu.
- source_word: מֵרֹאִי
  choice: hata isionekane
  rationale: מן pamoja na רֹאִי huonyesha kutoweka machoni; usemi huu wa asili unaeleza matokeo ya kukonda bila kuufanya mstari kuwa mgumu.
- source_word: וְשֻׁפִי
  choice: hutokeza
  rationale: Umbo hili ni gumu na maana yake si hakika kabisa; katika muktadha linaonyesha mifupa kuwa wazi au kujitokeza baada ya nyama kukonda.
- source_word: עַצְמוֹתָיו
  choice: mifupa yake
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi yenye kiambishi cha nafsi ya tatu umoja.
- source_word: לֹא רֻאּוּ
  choice: ambayo haikuonekana
  rationale: Huhifadhi hali ya kutendwa na ukanushi wa ראה, ikionyesha kwamba mifupa haikuwa ikionekana hapo awali.
