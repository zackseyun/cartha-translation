  text: Look[a], my terror will not frighten you, and my hand on you will not be heavy.
translation:
  language: sw
  text: Tazama, utisho wangu hautakutisha, wala mkono wangu juu yako hautakuwa mzito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala shinikizo langu juu yako halitakuwa zito.” Nomino ya Kiebrania אַכְפִּי ni ngumu kufasiri; inaweza kudokeza shinikizo au uzito, ingawa tafsiri ya karibu zaidi huonyesha picha ya mkono uliowekwa juu ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki huvuta fikira na kuanzisha uhakikisho kwa mkazo; “Tazama” ni Kiswahili sanifu na chenye hadhi.
- source_word: אֵמָתִי
  choice: utisho wangu
  rationale: Neno hili humaanisha hofu kuu au utisho unaohusishwa na msemaji. “Utisho wangu” huhifadhi maana ya kitu kinachoweza kumtia mwingine hofu, badala ya kudokeza kwamba msemaji mwenyewe anaogopa.
- source_word: תְבַעֲתֶךָ
  choice: hautakutisha
  rationale: Kitenzi בעת katika piel humaanisha kutia hofu kali au kutisha. Tafsiri hii ni ya kawaida na inaendeleza uhakikisho wa Elihu kwa Ayubu.
- source_word: אַכְפִּי
  choice: shinikizo langu
  rationale: Nomino hii ni ngumu kufasiri. Katika muundo wake pamoja na “juu yako” na kitenzi “kuwa mzito,” inaelekea kueleza shinikizo au uzito unaowekwa juu ya mtu. Chaguo hili linaweka maana inayowezekana katika Kiswahili cha kawaida huku tofauti ya kimapokeo ikihifadhiwa katika tanbihi.
- source_word: עָלֶיךָ לֹא יִכְבָּד
  choice: halitakulemea
  rationale: Kiswahili hiki cha kawaida huwasilisha kwa pamoja picha ya kitu kilicho juu ya mtu na kisicho kuwa kizito kwake, bila kupoteza wazo la kumtwika au kumkandamiza.
