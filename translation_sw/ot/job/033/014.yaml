  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: sw
  text: 'Kwa maana Mungu hunena kwa njia moja,[a]

    na kwa njia mbili, lakini mtu hatambui jambo hilo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu hunena mara moja, na mara mbili, lakini mtu hatambui jambo hilo.” Namba za Kiebrania zinaweza kueleweka kwa maana ya kiidadi (“mara moja ... mara mbili”) au kwa namna ya nahau (“kwa njia moja ... kwa njia mbili”).
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya Elihu kuhusu jinsi Mungu anavyowasiliana na watu, hivyo inadumisha nguvu ya kisababishi au ufafanuzi.
- source_word: בְאַחַת
  choice: kwa njia moja
  rationale: Muundo wa kihesabu unaweza kueleza namna ya kunena au idadi ya mara. Tafsiri hii inafaa muktadha unaofuata, huku maana ya 'mara moja' ikihifadhiwa katika tanbihi.
- source_word: יְדַבֶּר
  choice: hunena
  rationale: Kauli ya wakati usiotimilika hapa inaeleza tendo la kawaida; 'hunena' ni Kiswahili cha sasa, chenye hadhi, kinachoonyesha mazoea hayo.
- source_word: אֵל
  choice: Mungu
  rationale: Hiki ni cheo cha kawaida cha Mungu katika muktadha huu; hakuna haja ya kuongeza sifa isiyotajwa wazi.
- source_word: וּבִשְׁתַּיִם
  choice: naam, kwa njia ya pili
  rationale: Inadumisha ulinganifu wa namba na kuleta kwa Kiswahili cha kawaida wazo la namna nyingine ya Mungu kusema; uwezekano wa 'mara ya pili' umewekwa katika tanbihi.
- source_word: לֹא
  choice: lakini ... ha-
  rationale: Kiunganishi cha upinzani kinaonyesha tofauti kati ya Mungu kusema na mwanadamu kutotambua.
- source_word: יְשׁוּרֶנָּה
  choice: mtu hatambui
  rationale: Kitenzi שׁור kina maana ya kuona, kuangalia, au kutambua. Hapa 'hatambui' huonyesha kushindwa kufahamu kuwa Mungu amesema, kama mifano inayofuata inavyoeleza.
theological_decisions:
- issue: Mtendaji wa kibinadamu asiyeelezwa wazi katika kishazi cha mwisho
  choice: mtu
  alternative: yeye
  rationale: Kiebrania kina mtendaji wa nafsi ya tatu umoja wa kiume asiyeandikwa wazi. 'Mtu' hudumisha maana ya jumla bila kumtambulisha mtu fulani.
- issue: Rejeo la kiambishi cha kitu cha kike katika יְשׁוּרֶנָּה
  choice: limeachwa likieleweka katika 'hatambui'
  alternative: hatambui hilo
  rationale: Kiambishi hicho huenda kikarejelea tendo au namna ya Mungu kusema. Kiswahili kinaweza kuacha kitu hicho kieleweke bila kulazimisha rejeo mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Hunena' hudumisha sauti ya kishairi bila kuwa ya kizamani kupita kiasi. Mgawanyo wa mistari unaonyesha ulinganifu wa mashairi ya Kiebrania.
