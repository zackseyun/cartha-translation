  text: ili kumgeuza mtu kutoka katika tendo lake[a], na kumficha mtu mwenye nguvu kiburi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “ili kuondoa tendo la mtu, na kumficha mtu mwenye nguvu kiburi.” Kiebrania kimebanwa, na mstari unaweza kueleweka kuwa Mungu humgeuza mtu kutoka katika tendo lake, au kwamba huliondoa tendo lenyewe kutoka kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: kumgeuza ... aiache
  rationale: Hifili ya סור ina maana ya kusababisha mtu aondoke au ajiepushe na jambo; muundo huu ni wa kawaida katika Kiswahili na unaonyesha maana hiyo ya kisababishi.
- source_word: אָדָם
  choice: mtu
  rationale: Hapa nomino ni ya umoja. 'Mtu' ni Kiswahili cha kawaida na haiongezi wazo la jinsia lisilohitajika, huku ulinganifu wa kishairi ukihifadhiwa.
- source_word: מַעֲשֶׂה
  choice: kazi yake
  rationale: מַעֲשֶׂה inaweza kumaanisha kazi, tendo, au kitendo. 'Kazi yake' inabaki karibu na upana wa neno la Kiebrania; umilikaji unaeleweka kutokana na uhusiano wa maneno katika mstari.
- source_word: וְגֵוָה
  choice: kiburi chake
  rationale: גֵּוָה hapa ni kujikweza kwa maana mbaya. 'Kiburi' ni neno la kawaida na lenye uzito unaofaa; kiambishi cha umilikaji kinaeleza uhusiano unaodokezwa na muktadha.
- source_word: מִגֶּבֶר
  choice: mtu mwenye nguvu
  rationale: גֶּבֶר humtaja mwanamume kwa upande wa nguvu au uhodari. 'Mtu mwenye nguvu' huhifadhi tofauti ya kileksia kati yake na אָדָם bila kutumia lugha isiyo ya kawaida.
- source_word: יְכַסֶּה
  choice: kumficha
  rationale: Ingawa ni kitenzi cha hali isiyotimilika, katika ulinganifu huu kinaendeleza kusudi lililoanzishwa na kitenzi-jina cha kwanza. 'Kumficha ... kiburi chake' huhifadhi sitiari ya kufunika/kuficha, huku ikisomeka kwa kawaida.
theological_decisions:
- issue: Maana ya kishazi cha kusudi katika maelezo ya Elihu kuhusu Mungu kusema
  choice: Kusudi ni kumgeuza mtu aiache kazi au hatua yake na kukificha au kukizuia kiburi chake.
  alternative: Kusudi ni kuondoa kazi ya mtu kutoka kwake na kufunika kiburi kutoka kwa mtu.
  rationale: Kiebrania kimebanwa kisintaksia. Muktadha wa Ayubu 33:14–18 unaunga mkono wazo la Mungu kumwonya mtu ili amzuie asitende uovu na asiwe na kiburi, lakini tanbihi inahifadhi uwezekano wa usomaji wa moja kwa moja zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa, na tanbihi inaonyesha utata halisi wa Kiebrania bila kuutatua kimadhehebu.
