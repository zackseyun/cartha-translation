  text: הֶן כָּל אֵ֭לֶּה יִפְעַל אֵ֑ל פַּעֲמַ֖יִם שָׁל֣וֹשׁ עִם גָּֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: sw
  text: Tazama, Mungu hufanya mambo haya yote mara mbili au tatu kwa mtu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Ni chembe ya usemi inayovuta fikira kwenye kauli; “Tazama” ni ya kawaida, yenye heshima, na huhifadhi msisitizo.
- source_word: כָּל אֵלֶּה
  choice: mambo haya yote
  rationale: Inarejelea matendo mbalimbali ya Mungu yaliyotajwa kabla; “mambo” hukamilisha usemi kwa Kiswahili cha kawaida.
- source_word: יִפְעַל
  choice: hufanya
  rationale: Kitenzi kinaeleza kutenda au kutekeleza; hali ya mazoea ya “hufanya” inafaa kwa kauli hii ya jumla.
- source_word: אֵל
  choice: Mungu
  rationale: Hili ni neno la kawaida la Kisemiti linalomtaja Mungu katika muktadha huu.
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: mara mbili au tatu
  rationale: Huhifadhi mpangilio wa namba za Kiebrania na maana ya kutokea tena bila kufafanua kupita kiasi kuwa “mara kwa mara.”
- source_word: עִם
  choice: kwa
  rationale: Katika Kiswahili, “hufanya ... kwa mtu” hueleza kwa kawaida matendo ya Mungu yanayomhusu mtu; “pamoja na mtu” ingeweza kudokeza ushirikiano usiokusudiwa.
- source_word: גָּבֶר
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume umoja, hapa imetumiwa kwa maana wakilishi ya mwanadamu mmoja. “Mtu” ni tafsiri ya asili ya Kiswahili isiyobadili upeo wa kauli.
theological_decisions:
- issue: Lugha wakilishi ya kiume katika גָּבֶר
  choice: mtu
  alternative: mwanamume
  rationale: Katika muktadha, nomino ya kiume umoja inawakilisha mwanadamu kwa jumla. Kiswahili “mtu” huhifadhi maana hiyo ya jumla kwa njia ya asili bila kuifanya kauli iwahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama Kiebrania; “Tazama” huhifadhi nguvu ya kuvuta fikira, na “mara mbili au tatu” huhifadhi nahau ya kurudiwa kwa tendo.
