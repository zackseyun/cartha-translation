  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: sw
  text: Ikiwa kuna malaika kwa ajili yake[a], mpatanishi, mmoja katika elfu, ili kumweleza mtu unyoofu wake[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malaika, mkalimani,” au “mjumbe, mpatanishi.”
