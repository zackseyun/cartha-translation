lexical_decisions:
- source_word: אִם יֵשׁ עָלָיו
  choice: Ikiwa yuko pamoja naye
  rationale: Huhifadhi muundo wa sharti na kuonyesha kuwa huyo malaika yupo kwa ajili yake au upande wake, bila kufafanua kupita kiasi aina ya uhusiano huo.
- source_word: מַלְאָךְ
  choice: malaika
  rationale: Katika muktadha huu inaelekea kumaanisha mjumbe wa mbinguni, ingawa maana ya jumla ya ‘mjumbe’ imehifadhiwa katika tanbihi.
- source_word: מֵלִיץ
  choice: mpatanishi
  rationale: Neno linaweza kumaanisha mpatanishi, mkalimani, msemaji, au mwombezi. ‘Mpatanishi’ linaonyesha kazi ya kusimama kati ya pande, huku uwezekano wa ‘mkalimani’ ukihifadhiwa katika tanbihi.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: mmoja kati ya elfu
  rationale: Ni usemi wa kawaida unaodokeza nadra au upekee na unaakisi kwa karibu muundo wa Kiebrania.
- source_word: לְהַגִּיד לְאָדָם
  choice: ili kumweleza mtu
  rationale: Infinitivu inaonyesha kusudi. ‘Kumweleza’ ni ya asili katika Kiswahili na inaweza kuhusisha kutangaza au kufafanua.
- source_word: יָשְׁרוֹ
  choice: unyoofu wake
  rationale: Hufuata kwa karibu nomino inayotokana na mzizi ישר na kiambishi cha nafsi. Kwa kuwa msemo unaweza pia kumaanisha jambo lililo sawa kwake, maana hiyo imewekwa katika tanbihi.
theological_decisions:
- issue: Utambulisho na kazi ya מַלְאָךְ מֵלִיץ
  choice: malaika, mpatanishi
  alternative: mjumbe, mkalimani; au mwombezi wa mbinguni mwenye maana pana zaidi ya kitheolojia
  rationale: Aya haimtambulishi mhusika huyu kwa undani zaidi. Tafsiri inabaki ya jumla na haingizi fundisho maalumu la kimalaika au usomaji wa Kikristo usiotajwa wazi katika mstari.
- issue: Mhusika anayerejelewa na kiambishi katika יָשְׁרוֹ
  choice: unyoofu wake, ikirejelea mtu
  alternative: jambo lililo sawa kwake
  rationale: Kiambishi kwa kawaida kinaweza kurejelea mtu, lakini maana halisi ya msemo inabaki yenye utata; tanbihi huhifadhi uwezekano wa maana ya jambo linalomfaa au lililo sawa katika hali yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kisharti na utata wa maneno ya Kiebrania umehifadhiwa; tanbihi zote zimewekewa alama katika matini.
