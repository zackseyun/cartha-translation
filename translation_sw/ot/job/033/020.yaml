lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: yanachukia / inachukia
  rationale: Kitenzi kinaonyesha kuchukizwa sana au kukataa kwa kinyaa. “Kuchukia” ni cha kawaida na wazi katika muktadha wa chakula; kimerudiwa katika mshororo wa pili ili ukamilifu wa sentensi uwe wa asili kwa Kiswahili.
- source_word: חַיָּתוֹ
  choice: maisha yake
  rationale: Neno hili linahusu maisha au uhai wa mtu. “Maisha yake” huhifadhi taswira na ulinganifu wa kishairi bila kulifasiri moja kwa moja kuwa hamu ya kula.
- source_word: לָחֶם
  choice: mkate
  rationale: Maana ya msingi ni “mkate.” Neno hilo limehifadhiwa ili kudumisha taswira halisi na ulinganifu na chakula katika sehemu ya pili.
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: Neno linaweza kumaanisha nafsi, maisha, mtu mwenyewe, au hamu. “Nafsi yake” huhifadhi lugha ya kishairi na kutatua maana hiyo kwa kiwango kidogo zaidi.
- source_word: מַאֲכַל
  choice: chakula
  rationale: Ni neno la jumla kwa kile kinacholiwa; “chakula” ni tafsiri ya kawaida na yenye upana unaofaa.
- source_word: תַּאֲוָה
  choice: kitamanikacho
  rationale: Neno linadokeza kitu kinachotamaniwa au kuvutia. “Chakula kitamanikacho” huhifadhi wazo la tamaa bila kulazimisha maana maalumu ya chakula bora.
