  text: ndipo hufunua masikio ya watu, na huyatia maonyo yao muhuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mafundisho yao,” au “nidhamu yao.” Neno la Kiebrania מוּסָר linaweza kumaanisha maonyo, mafundisho, marekebisho, au nidhamu.
