lexical_decisions:
- source_word: אָז
  choice: ndipo
  rationale: Kielezi hiki kinaonyesha hatua inayofuata katika maelezo yaliyotangulia kuhusu Mungu kusema kupitia ndoto na maono; “ndipo” ni cha asili na huhifadhi mtiririko huo.
- source_word: יִגְלֶה אֹזֶן
  choice: huyafungua masikio
  rationale: Kitenzi גלה humaanisha kufunua au kufungua. Pamoja na “sikio,” ni nahau ya kumwezesha mtu kusikia na kupokea ujumbe; Kiswahili “kufungua masikio” huhifadhi picha hiyo kwa uwazi.
- source_word: אֲנָשִׁים
  choice: watu
  rationale: Katika muktadha huu neno hilo linawarejelea wanadamu kwa jumla. “Watu” ni Kiswahili cha kawaida na cha sasa bila kubadili upeo wa maana.
- source_word: וּבְמֹסָרָם
  choice: maonyo yao
  rationale: מוּסָר inaweza kumaanisha maonyo, mafundisho, marekebisho, au nidhamu. Katika muktadha wa Mungu kuwazuia watu wasitende mabaya (aya 14–18), “maonyo” huwasilisha vizuri ujumbe wa kuwaonya, huku tanbihi ikihifadhi maana nyingine halali.
- source_word: יַחְתֹּם
  choice: kuyatia muhuri
  rationale: חתם humaanisha kutia muhuri, kwa wazo la kuthibitisha au kukazia. Usemi huu huhifadhi sitiari ya Kiebrania badala ya kuifafanua kimyakimya.
theological_decisions:
- issue: Kirejeleo cha kiambishi cha nafsi katika מֹסָרָם
  choice: “maonyo yao,” yaani maonyo yanayolengwa kwa watu hao
  alternative: “onyo lake kwao” au “mafundisho kwao”
  rationale: Kiebrania kina kiambishi cha wingi cha nafsi ya tatu, lakini uhusiano wake wa kimaana unaweza kueleweka kwa namna zaidi ya moja. Tafsiri inahifadhi umbo la “yao” bila kulifanya fundisho kuwa mali au chanzo chao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. “Huyafungua” na “kuyatia” zinaonyesha tendo linaloelezwa katika muktadha huu; sitiari za kufungua masikio na kutia muhuri zimehifadhiwa.
