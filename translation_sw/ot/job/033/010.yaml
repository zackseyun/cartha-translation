    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni neno la kusisitiza na kuvuta fikira; “Tazama” lina nguvu hiyo katika Kiswahili sanifu bila kuwa la maelezo kupita kiasi.
- source_word: תְּנוּאוֹת
  choice: sababu za kuwa na uadui
  rationale: Nomino hii ni adimu na maana yake hutegemea muktadha. Chaguo hili linaonyesha visingizio au sababu za upinzani bila kudai kwamba Mungu anazibuni.
- source_word: עָלַי
  choice: nami
  rationale: Katika kirai “kuwa na uadui nami,” maana ya kuelekezwa dhidi ya msemaji inaelezwa kwa Kiswahili cha kawaida.
- source_word: יִמְצָא
  choice: anapata
  rationale: Huhifadhi maana ya msingi ya kitenzi, ‘kupata,’ bila kuifasiri kwa nguvu zaidi kuwa ‘anabuni.’
- source_word: יַחְשְׁבֵנִי
  choice: ananihesabu
  rationale: Huwasilisha maana ya kumwona au kumweka mtu katika hali fulani, huku ikifuata taswira ya Kiebrania kwa njia inayoeleweka.
- source_word: לְאוֹיֵב לוֹ
  choice: kuwa adui yake
  rationale: Hueleza kwa kawaida katika Kiswahili hadhi ambayo msemaji anadai amepewa.
theological_decisions:
- issue: Mtazamo wa msemaji kuhusu jinsi Mungu anavyomtendea Ayubu
  choice: 'Kauli ya malalamiko imetafsiriwa: “anapata sababu za kuwa na uadui nami; ananihesabu kuwa adui yake.”'
  alternative: “anatafuta visingizio dhidi yangu” au “anabuni mashtaka dhidi yangu”
  rationale: Mstari unanukuu jinsi malalamiko ya Ayubu yanavyosimuliwa na Elihu, si uthibitisho wa msimulizi kwamba Mungu hutenda isivyo haki. “Anapata” huhifadhi uzito na mvutano wa kauli bila kuongeza wazo la kubuni mashtaka ambalo haliko wazi katika kitenzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi kutokuwa na uhakika kwa nomino adimu ya Kiebrania.
