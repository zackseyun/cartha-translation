  text: Kwa nini unabishana naye, kwa sababu hajibu kuhusu mambo yake yote?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa nini unabishana naye, ukidai kwamba hajibu jambo lolote kuhusu mambo yake?”'
    reason: Huhifadhi uwezekano wa kuelewa כִּי kuwa “kwamba/ukidai kwamba” badala ya “kwa sababu,” pamoja na uwezekano kwamba kukanusha kunaenea kwa kila jambo (“jambo lolote”) badala ya “mambo yake yote.”
lexical_decisions:
- source_word: רִיבוֹתָ
  choice: unashindana
  rationale: Kitenzi ריב katika muktadha huu humaanisha kugombana, kushindana, au kuleta hoja ya malalamiko dhidi ya mwingine; “unashindana” ni ya kawaida na yenye hadhi bila kuifanya iwe kesi rasmi ya mahakama.
- source_word: דְּבָרָיו
  choice: mambo yake
  rationale: דברים inaweza kumaanisha maneno, mambo, au matendo. Hapa “mambo yake” linafaa zaidi kwa wazo la Mungu kutotoa jibu au maelezo kuhusu yote yanayomhusu, huku likiepuka kuifanya sentensi ihusu tu maneno yaliyotamkwa.
- source_word: יַעֲנֶה
  choice: hajibu
  rationale: “Hajibu” huwakilisha moja kwa moja maana ya msingi ya ענה na kudumisha mvutano wa kauli kwamba Mungu hajibu kuhusu mambo yake yote.
theological_decisions:
- issue: Uhusiano wa כִּי na swali lililotangulia
  choice: kwa sababu
  alternative: kwamba / kwa madai kwamba
  rationale: כִּי inaweza kutoa sababu (“kwa sababu”) au kuanzisha yaliyomo katika malalamiko (“kwamba”). Matini kuu inafuata usomaji wa kisababishi unaolingana na muundo wa sentensi na tabaka la mashauriano la POB, huku tanbihi ikihifadhi uwezekano mwingine.
- issue: Upeo wa kukanusha katika כָּל דְּבָרָיו לֹא יַעֲנֶה
  choice: hajibu kuhusu mambo yake yote
  alternative: hajibu kuhusu jambo lolote la mambo yake
  rationale: Kiebrania kinaweza kusikika kama kutokujibu kuhusu “yote” au “lolote” kati ya mambo yake. Tafsiri kuu inadumisha mpangilio na upeo wa maneno ya chanzo bila kuamua zaidi ya inavyolazimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa rahisi kwa msomaji wa kawaida; “mambo yake” hutoa maana pana ya דְּבָרָיו kuliko “maneno yake” katika muktadha huu.
