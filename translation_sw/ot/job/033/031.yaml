base_translation:
  language: en
  yaml_path: translation/ot/job/033/031.yaml
  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: sw
  text: Sikiliza kwa makini, Ayubu; nisikilize[a]. Kaa kimya[b], nami nitasema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unisikie.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nyamaza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: Sikiliza kwa makini
  rationale: Kauli ya amri katika hifili ya קשׁב inadai usikivu wa makini, si kusikia sauti tu. Usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Jina limetolewa kwa namna iliyozoeleka katika Kiswahili sanifu.
- source_word: שְׁמַע לִי
  choice: nisikilize
  rationale: Kitenzi שׁמע pamoja na ל kinaeleza kumsikiliza mtu anayesema. “Nisikilize” ni usemi wa moja kwa moja na wa kawaida.
- source_word: הַחֲרֵשׁ
  choice: Kaa kimya
  rationale: Amri hii ya חרשׁ inamtaka Ayubu asiseme. “Kaa kimya” ni ya heshima na ya kawaida kuliko “nyamaza,” huku ikihifadhi nguvu ya amri.
- source_word: וְאָנֹכִי
  choice: nami
  rationale: Kiunganishi pamoja na kiwakilishi cha nafsi ya kwanza chenye mkazo kimetolewa kwa “nami,” ambacho kwa ufupi huleta maana ya “na mimi” katika mfuatano huu.
- source_word: אֲדַבֵּר
  choice: nitasema
  rationale: Kauli isiyotimilika ya pieli hapa inaeleza tendo ambalo Elihu anakusudia kufanya Ayubu akikaa kimya. “Nitasema” ni ya asili na wazi.
theological_decisions: []
