  text: Mwili wake unakuwa changa kuliko ulivyokuwa wakati wa ujana wake[a]; anarudi katika siku za ujana wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwili wake unafanywa upya kama wa mtoto,” au “mwili wake unakuwa changa kuliko wa kijana.” Kitenzi cha Kiebrania ni adimu, na ulinganisho na ujana unaweza kueleweka kwa njia tofauti kidogo.
    reason: lexical_alternative
  - marker: b
