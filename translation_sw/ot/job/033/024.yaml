translation:
  language: sw
  text: Ndipo akamrehemu, akasema, “Mwokoe asishuke shimoni[a]; nimepata fidia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Shimo” linaweza pia kudokeza kaburi au maangamizi, wala si shimo halisi ardhini tu.
    reason: lexical_alternative
  - marker: b
    text: Au “malipo ya upatanisho.” Neno la Kiebrania כֹּפֶר linaweza kumaanisha fidia au malipo yanayowezesha kuachiliwa, na katika baadhi ya miktadha lina vidokezo vya upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: anamwonyesha neema
  rationale: Kitenzi חנן humaanisha kumwonyesha mtu neema, fadhili, au rehema. Kauli hii inahifadhi wazo la neema bila kulifanya kuwa huruma tu.
- source_word: וַיֹּאמֶר
  choice: na kusema
  rationale: Inaendeleza mfuatano wa tendo na kuingiza maneno yanayonukuliwa kwa Kiswahili cha kawaida.
- source_word: פְּדָעֵהוּ
  choice: Mwokoe
  rationale: Mzizi פדה unaweza kumaanisha kukomboa, kufidia, au kuokoa kwa hatua au malipo. “Mwokoe” ni amri ya kawaida na haipachiki mapema maana maalumu ya kifundisho, kwa kuwa כֹפֶר ndiyo inayotaja fidia.
- source_word: מֵרֶדֶת
  choice: asishuke
  rationale: Muundo wa ירד pamoja na מִן unaonyesha kuzuiwa kushuka; “asishuke” ni usemi mfupi na wa asili katika Kiswahili.
- source_word: שָׁחַת
  choice: shimoni
  rationale: Neno hili humaanisha shimo na linaweza pia kudokeza kaburi au maangamizi. “Shimoni” linahifadhi taswira halisi bila kuondoa vidokezo hivyo.
- source_word: מָצָאתִי
  choice: nimepata
  rationale: 'Kauli timilifu ya nafsi ya kwanza inaonyesha tendo lenye matokeo ya sasa: msingi wa kumwokoa umepatikana.'
- source_word: כֹפֶר
  choice: fidia
  rationale: כֹפֶר ni malipo au thamani inayowezesha kuachiliwa. “Fidia” ni neno la kawaida la Kiswahili linalofaa katika muktadha huu, huku maana zinazohusiana na upatanisho zikibaki katika tanbihi.
theological_decisions:
- issue: Maana ya כֹפֶר katika hotuba ya Elihu
  choice: fidia
  alternative: malipo ya upatanisho; kifuniko
  rationale: Muktadha unaeleza msingi wa kumzuia mtu asishuke shimoni. “Fidia” huhifadhi maana ya thamani inayowezesha kuachiliwa bila kulazimisha katika mstari huu mfumo wa baadaye wa mafundisho. Uwezekano wa maana inayohusiana na upatanisho umeonyeshwa katika tanbihi.
- issue: Anayemwonyesha mtu neema
  choice: kiwakilishi cha nafsi kimeachwa bila kutajwa kwa jina
  alternative: Mungu; mjumbe au mpatanishi wa mstari uliotangulia
  rationale: Kitenzi cha Kiebrania kina kiima cha nafsi ya tatu lakini hakimtaji kwa jina katika mstari huu. Tafsiri haiongezi utambulisho ambao mstari wenyewe haujaueleza wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mfuatano wa wakati wa sasa umehifadhiwa kwa kuzingatia mtiririko wa sentensi ya masharti katika muktadha, huku taswira ya “shimo” na utata wa “fidia” vikihifadhiwa.
