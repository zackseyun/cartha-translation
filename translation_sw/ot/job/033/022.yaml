base_translation:
  language: en
  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: sw
  text: 'Nafsi yake inakaribia shimo[a],

    na uhai wake unawakaribia waletao mauti[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburi” au “maangamizi” badala ya “shimo.”
    reason: lexical_alternative
  - marker: b
    text: Au “wafu” au “wanaosababisha kifo.” Usemi wa Kiebrania ni mgumu na huenda ukarejelea watendaji wanaoleta kifo, au eneo au nguvu za mauti.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: inakaribia
  rationale: Kitenzi קרב humaanisha kukaribia. Wakati wa sasa unafaa katika maelezo haya ya kishairi kuhusu hali ya mtu anayeteseka, ingawa umbo la Kiebrania linaweza pia kuwa na nguvu ya wakati uliopita katika masimulizi.
- source_word: לַשַּׁחַת
  choice: shimo
  rationale: שַׁחַת inaweza kumaanisha shimo, kaburi, au maangamizi. “Shimo” huhifadhi taswira halisi ya kishairi huku maana yake ya kifo ikibaki wazi kutokana na muktadha.
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, uhai, mtu mwenyewe, au mtu. “Nafsi yake” huhifadhi tofauti ya kishairi na “uhai wake” bila kulazimisha fundisho maalumu kuhusu muundo wa mwanadamu.
- source_word: וְחַיָּתוֹ
  choice: na uhai wake
  rationale: Neno hili linaonyesha uhai au kuwapo hai. “Uhai wake” ni Kiswahili cha kawaida na linafaa katika ulinganifu na “nafsi yake.”
- source_word: לַמְמִתִים
  choice: unawakaribia waletao mauti
  rationale: Usemi huu mgumu unaweza kueleweka kwa maana tendaji kama “wanaosababisha kifo.” “Waletao mauti” huhifadhi nguvu hiyo bila kuwataja hasa kuwa wauaji au watekelezaji wa hukumu; uwezekano wa kumaanisha wafu au nguvu za mauti umewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya kiantropolojia ya נַפְשׁוֹ na וְחַיָּתוֹ katika ulinganifu
  choice: Kutafsiri jozi hiyo kuwa “nafsi yake” na “uhai wake” bila kudokeza kwamba lazima kuna mgawanyo mkali wa mwili na nafsi.
  alternative: Kutafsiri yote mawili kwa maana pana kama “uhai wake” na “kuwapo kwake,” au kuelewa “nafsi” kuwa sehemu ya kiroho yenye maana maalumu ya kiufundi.
  rationale: Mstari ni wa kishairi na una ulinganifu wa maneno yenye maana zinazokaribiana. Tafsiri inahifadhi tofauti ya msamiati bila kuamua zaidi ya maandishi kuhusu muundo wa mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Mauti” limetumiwa ili kuhifadhi uzito wa kishairi wa mstari; “waletao” ni umbo fasaha linaloonyesha maana tendaji ya neno la Kiebrania.
