  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: sw
  text: Tazama, katika hili huna haki; nitakujibu, kwa maana Mungu ni mkuu kuliko mwanadamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanadamu wa kufa.” Neno la Kiebrania אֱנוֹשׁ mara nyingi husisitiza udhaifu wa mwanadamu na hali yake ya kufa.
    reason: Mbadala huu unahifadhi dokezo la kileksika la אֱנוֹשׁ bila kulifanya kuwa wazi zaidi kuliko lilivyo katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: הֶן
  choice: Tazama
  rationale: Ni kiashiria cha mazungumzo kinachovuta usikivu kwa msisitizo. “Tazama” ni neno la Kiswahili sanifu, lenye hadhi, na linahifadhi nguvu ya usemi wa Kiebrania.
- source_word: זֹאת
  choice: katika hili
  rationale: Kiwakilishi hiki kinaelekeza kwenye jambo ambalo Ayubu amesema. “Katika hili” kinaonyesha kwamba Elihu anapinga hoja hiyo, si kila jambo alilosema Ayubu.
- source_word: לֹא צָדַקְתָּ
  choice: huko sahihi
  rationale: Katika muktadha huu kitenzi צדק kinahusu kutokuwa upande wa haki katika hoja. “Huko sahihi” huepuka maana potovu ya kukosa ruhusa au kudai kwamba Ayubu si mwadilifu kwa ujumla.
- source_word: אֶעֱנֶךָּ
  choice: nitakujibu
  rationale: Umbo la kitenzi linaonyesha jibu ambalo Elihu anakaribia kutoa, na kiambishi cha yambwa kinamrejelea Ayubu moja kwa moja.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi kinaanzisha sababu ya jibu la Elihu. “Kwa maana” kinahifadhi uhusiano huo wa kisababishi kwa Kiswahili cha asili.
- source_word: יִרְבֶּה
  choice: ni mkuu kuliko
  rationale: Pamoja na מן, kitenzi רבה kina maana ya ulinganisho wa ukuu au ubora hapa, si kuongezeka kwa idadi.
- source_word: אֱלוֹהַ
  choice: Mungu
  rationale: Jina hili la umoja la Uungu linamrejelea Mungu; “Mungu” ndilo neno la moja kwa moja na la kawaida katika Kiswahili.
- source_word: מֵאֱנוֹשׁ
  choice: kuliko mwanadamu
  rationale: אֱנוֹשׁ ni nomino ya umoja inayotumiwa kwa mwanadamu kwa ujumla, mara nyingi ikidokeza udhaifu na hali ya kufa. “Mwanadamu” linahifadhi ulinganisho wa moja kwa moja kati ya Mungu na binadamu.
theological_decisions:
- issue: Maana ya neno אֱנוֹשׁ kuhusu hali ya mwanadamu
  choice: mwanadamu
  alternative: mwanadamu mwenye kufa
  rationale: “Mwanadamu” ni tafsiri ya kawaida inayohifadhi tofauti ya kimantiki kati ya Mungu na binadamu bila kuongeza ufafanuzi ndani ya mstari. Dokezo la udhaifu na hali ya kufa, ambalo linaweza kuwamo katika אֱנוֹשׁ, limehifadhiwa katika tanbihi badala ya kulazimishwa kuwa maana pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. “Tazama” linatoa msisitizo wa usemi bila kutumia lugha nzito kupita kiasi; “huko sahihi” ni ya kawaida na inaendana na muktadha wa mabishano.
