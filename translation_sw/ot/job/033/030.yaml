  source_fidelity: 'Tafsiri inadumisha kwa uaminifu mtiririko wa Kiebrania: infinitivu ya kusababisha katika “kuirudisha,” נַפְשׁוֹ kama “nafsi yake,” taswira ya שַׁחַת kama “shimoni,” na usemi wa kishairi wenye utata wa לֵאוֹר pamoja na “nuru ya uzima.” Matumizi ya “ili iangaziwe” yanaendana kisarufi na “nafsi” (ngeli ya 9) na huepuka kufafanua zaidi utata wa kifungu cha Kiebrania.'
