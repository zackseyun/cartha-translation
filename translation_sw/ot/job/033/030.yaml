  text: לְ/הָשִׁ֣יב נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת לֵ֝/א֗וֹר בְּ/א֣וֹר הַֽ/חַיִּים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: sw
  text: kuirudisha nafsi yake kutoka shimoni[b], ili iangaziwe kwa nuru ya uzima.[c][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uhai wake” badala ya “nafsi yake”; neno la Kiebrania nefesh linaweza kumaanisha nafsi, uhai, au mtu mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au “kutoka kaburini” au “kutoka katika maangamizi” badala ya “kutoka shimoni.”
    reason: lexical_alternative
  - marker: c
    text: Au “ili aione nuru” au “ili aletwe nuruni.” Kiebrania hapa ni kifupi na cha kishairi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: kuirudisha
  rationale: Kauli ya kusababisha ya kitenzi שוב inaonyesha kusababisha kitu kirudi. “Kuirudisha” inadumisha picha hiyo halisi na inaendana na “nafsi yake.”
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: נפש inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yake” inadumisha upana wa kishairi na kina cha usemi wa Kiebrania; “uhai wake” imehifadhiwa kama uwezekano katika tanbihi.
- source_word: מִנִּי שָׁחַת
  choice: kutoka shimoni
  rationale: שחת inaweza kuwa shimo, kaburi, au maangamizi. “Shimoni” inadumisha taswira halisi ya kishairi na utofautishaji wake na nuru ya uzima.
- source_word: לֵאוֹר
  choice: ili iangaziwe
  rationale: Muundo wa Kiebrania ni mfupi na una maana isiyobainika kikamilifu. “Ili iangaziwe” huonyesha kusudi au matokeo na kudumisha mzizi wa taswira ya nuru bila kuifafanua kupita kiasi.
- source_word: בְּאוֹר הַחַיִּים
  choice: kwa nuru ya uzima
  rationale: “Kwa” inaweza kubeba maana ya chombo au kuhusishwa na hali, huku “nuru ya uzima” ikidumisha usemi wa kishairi wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
