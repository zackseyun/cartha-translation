translation:
  language: sw
  text: Kama unaweza, nijibu; panga hoja zako mbele yangu[a]; simama tayari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “panga maneno yako mbele yangu.” Kitenzi cha Kiebrania humaanisha “panga” au “weka kwa utaratibu,” na kinaweza kurejelea hoja za Ayubu au, kwa upana zaidi, jibu alilolitayarisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Huanzisha sharti lenye changamoto ya moja kwa moja; “Kama” ni ya kawaida na ya asili katika Kiswahili.
- source_word: תּוּכַל
  choice: unaweza
  rationale: Kitenzi יכל kinaeleza uwezo; “unaweza” ni tafsiri ya moja kwa moja na ya sasa.
- source_word: הֲשִׁיבֵנִי
  choice: nijibu
  rationale: Katika muktadha wa mabishano, umbo hili humaanisha kumjibu msemaji; “nijibu” ni fupi na wazi.
- source_word: עֶרְכָה
  choice: panga hoja zako
  rationale: Kitenzi ערך humaanisha kupanga au kuweka kwa utaratibu. Muktadha wa mjadala unaruhusu yambwa iliyodokezwa kueleweka kuwa hoja, lakini tanbihi inahifadhi uwezekano wa “maneno yako.”
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Ni usemi wa kawaida wa kuwapo mbele ya msemaji na unadumisha hali ya kukabiliana ana kwa ana.
- source_word: הִתְיַצָּבָה
  choice: simama tayari
  rationale: Umbo la Hitpael lina maana ya mtu kujiweka mahali au kusimama akiwa tayari. “Simama tayari” linaonyesha utayari wa kujitetea bila kuwa la kizamani.
