base_translation:
  language: en
  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: sw
  text: Huzuia nafsi yake isiingie shimoni[a], na uhai wake usiangamie kwa silaha[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asiende kaburini” au “asiangamie.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha hasa mshale au silaha nyingine ya kurushwa, na huenda pia upanga; mstari unazungumzia kulindwa na kifo cha vurugu.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “uhai wake usipite kwa silaha.”'
    reason: previous_rendering
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: Huizuia
  rationale: Kitenzi חשׂך katika kausativi kina maana ya kuzuia, kuhifadhi, au kutopoteza. “Huizuia” kinaonyesha kwamba mhusika anakingwa asiingie katika hatari ya kifo.
- source_word: נַפְשׁוֹ
  choice: nafsi yake
  rationale: נפש inaweza kumaanisha nafsi, uhai, au mtu mwenyewe. “Nafsi yake” huhifadhi taswira ya kishairi na ulinganifu wake na “uhai wake” katika mstari unaofuata.
- source_word: מִנִּי שָׁחַת
  choice: isiingie shimoni
  rationale: שׁחת inaweza kuwa shimo, kaburi, au maangamizi. Muundo huu wa Kiswahili unaeleza kwa kawaida kuzuiwa kufikia shimo linalowakilisha kifo, bila kudokeza kwamba tayari alikuwa ndani yake.
- source_word: וְחַיָּתוֹ
  choice: uhai wake
  rationale: Katika muktadha huu neno linamaanisha uhai wa mtu. “Uhai wake” ni la kawaida na linaendeleza usambamba wa kishairi.
- source_word: מֵעֲבֹר
  choice: usiangamie
  rationale: Ingawa עבר kimsingi ni “kupita” au “kuvuka,” katika kishazi hiki maana ya jumla ni kuzuiwa kufikia kifo cha vurugu. “Usiangamie” ni Kiswahili cha kawaida; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: בַּשָּׁלַח
  choice: kwa silaha
  rationale: שׁלח hapa inaelekea kutaja silaha, huenda silaha ya kurushwa au upanga. “Silaha” huepuka kudai kwa uhakika aina ambayo haijulikani na “kwa” huonyesha chombo cha mauti.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika usambamba huu
  choice: Kutumia “nafsi” bila kuitofautisha kidhana na “uhai”
  alternative: Kutafsiri sehemu zote mbili kwa “uhai” au “maisha”
  rationale: Mistari miwili ni ya kishairi na huenda maneno hayo yanaelekeza kwa maisha ya mtu mzima, si lazima vipengele viwili tofauti vya mwanadamu. Tafsiri inadumisha tofauti ya maneno bila kuingiza fundisho maalumu kuhusu maumbile ya mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ushairi lakini kinachoeleweka kwa urahisi. “Huizuia … isiingie” ni muundo wa kawaida kuliko tafsiri sisisi ya “kupita kwa silaha,” huku tanbihi zikihifadhi utata wa msamiati na muundo wa Kiebrania.
