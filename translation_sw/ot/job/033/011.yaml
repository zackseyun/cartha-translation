  text: יָשֵׂ֣ם בַּ/סַּ֣ד רַגְלָ֑/י יִ֝שְׁמֹ֗ר כָּל אָרְחֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/011.yaml
  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: sw
  text: Anaweka miguu yangu kwenye mkatale; hufuatilia njia zangu zote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huzilinda njia zangu zote.” Kitenzi cha Kiebrania kinaweza kumaanisha kufuatilia, kuchunga, au kulinda; hapa muktadha unaelekea kuonyesha uchunguzi mkali badala ya ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: Anaweka
  rationale: Kitenzi שׂים humaanisha kuweka au kutia; “anaweka” ni Kiswahili cha kawaida na kinadumisha taswira halisi.
- source_word: בַּסַּד
  choice: kwenye mkatale
  rationale: סַד ni kifaa cha kuzuia miguu isisogee. “Mkatale” linadumisha taswira ya kifungo cha adhabu kuliko neno la jumla kama “pingu.”
- source_word: רַגְלָי
  choice: miguu yangu
  rationale: Umbo hili linarejelea miguu ya msemaji; tafsiri ya wingi ni ya kawaida na wazi katika Kiswahili.
- source_word: יִשְׁמֹר
  choice: hufuatilia
  rationale: שׁמר inaweza kumaanisha kuangalia, kuchunga, au kulinda. Katika muktadha wa malalamiko kwamba Mungu anamwekea Ayubu mipaka na kuchunguza mwenendo wake, “hufuatilia” linaonyesha uangalizi wa karibu bila kuudokeza moja kwa moja kuwa ulinzi wa fadhili.
- source_word: כָּל
  choice: zote
  rationale: Kivumishi hiki kinawasilisha kwa kawaida maana ya ujumla ya כָּל na kupatana na “njia.”
- source_word: אָרְחֹתָי
  choice: njia zangu
  rationale: אֹרַח ni njia au mapito, na mara nyingi ni sitiari ya mwenendo wa maisha. “Njia zangu” ni ya kawaida huku ikidumisha sitiari hiyo.
theological_decisions:
- issue: Ikiwa uangalizi wa Mungu katika kishazi cha pili ni ulinzi au uchunguzi wa kuadhibu
  choice: 'Uangalizi wa kuchunguza: “hufuatilia njia zangu zote”'
  alternative: 'Ulinzi: “huzilinda njia zangu zote”'
  rationale: Katika muktadha Elihu anasimulia malalamiko ya Ayubu kwamba Mungu anamchukulia kama adui na kumzuia. Hivyo שׁמר hapa yaelekea kuonyesha uchunguzi mkali kuliko ulinzi wa fadhili, lakini uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mkatale” ni neno mahsusi la kifaa cha kuzuia miguu; “hufuatilia” ni la kawaida na linafaa kwa uangalizi wa karibu. Alama ya tanbihi imewekwa baada ya kishazi kinachohusu kitenzi chenye utata.
