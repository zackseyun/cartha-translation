  text: בַּ/חֲל֤וֹם חֶזְי֬וֹן לַ֗יְלָה בִּ/נְפֹ֣ל תַּ֭רְדֵּמָה עַל אֲנָשִׁ֑ים בִּ֝/תְנוּמ֗וֹת עֲלֵ֣י מִשְׁכָּֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: sw
  text: Katika ndoto, maono ya usiku, usingizi mzito unapowajia watu, wanaposinzia kitandani,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: Katika ndoto
  rationale: Kirai hiki huonyesha mazingira au njia ambayo ndani yake ujumbe hutolewa; “katika ndoto” ni Kiswahili cha kawaida na huhifadhi usambamba wa kishairi.
- source_word: חֶזְיוֹן לַיְלָה
  choice: maono ya usiku
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania ‘maono ya usiku’ na usambamba wake na ‘ndoto’.
- source_word: בִּנְפֹל תַּרְדֵּמָה עַל אֲנָשִׁים
  choice: usingizi mzito unapowajia watu
  rationale: בִּנְפֹל huanzisha kishazi cha wakati, תַּרְדֵּמָה ni usingizi mzito, na ‘kuwajia’ ni njia ya asili ya Kiswahili ya kueleza usingizi unaowapata watu.
- source_word: אֲנָשִׁים
  choice: watu
  rationale: Ingawa nomino ya Kiebrania ina umbo la kiume la wingi, hapa hutumiwa kwa maana ya jumla ya wanadamu; ‘watu’ hutoa maana hiyo ya kimuktadha bila kuibana kwa wanaume pekee.
- source_word: בִּתְנוּמוֹת
  choice: wanaposinzia
  rationale: Wingi wa kishairi wa hali za kusinzia umetolewa kwa kitenzi cha kawaida kinachoeleweka vizuri katika Kiswahili; kishazi pia kinaendeleza mazingira ya wakati.
- source_word: עֲלֵי מִשְׁכָּב
  choice: kitandani
  rationale: Ni tafsiri ya asili ya ‘juu ya mahali pa kulala/kitanda’; umoja wa kishairi umehifadhiwa bila kuongeza kimilikishi kisichotajwa.
theological_decisions:
- issue: Maana ya jumla ya אֲנָשִׁים yenye umbo la kiume
  choice: watu
  alternative: wanaume
  rationale: Katika muktadha huu neno linawarejelea wanadamu kwa jumla. Kiswahili ‘watu’ huhifadhi maana pana ya asili, ilhali ‘wanaume’ lingedokeza jinsia ya kiume pekee.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na mtiririko wa kishairi. Mstari umeachwa ukiishia kwa koma kwa kuwa kisintaksia unaendelea katika mstari unaofuata.
