  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: sw
  text: 'Hakika, umesema masikioni mwangu,[a]


    nami nimesikia sauti ya maneno yako:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “katika masikio yangu, nami nasikia sauti ya maneno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa neno hili linasisitiza ukweli wa kauli inayofuata, si kuweka kikomo; “Hakika” ni la kawaida na lenye uzito unaofaa.
- source_word: אָמַרְתָּ
  choice: umesema
  rationale: Kitenzi cha nafsi ya pili umoja wa kiume kinaeleza usemi uliotangulia ambao Elihu sasa anaukumbuka.
- source_word: בְאָזְנָי
  choice: masikioni mwangu
  rationale: Hii inahifadhi taswira halisi ya Kiebrania, “katika masikio yangu,” kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: וְקוֹל
  choice: nami ... sauti
  rationale: קוֹל inaweza kuwa “sauti” au “mlio.” “Sauti ya maneno yako” inadumisha mkazo wa kusikia na ni ya asili katika muktadha huu.
- source_word: מִלִּין
  choice: maneno yako
  rationale: Umbo hili la wingi lenye athari ya Kiaramu humaanisha “maneno.” Kimilikishi “yako” kimetolewa wazi kutokana na muktadha, kwa kuwa Elihu anarejelea maneno ya Ayubu.
- source_word: אֶשְׁמָע
  choice: nimesikia
  rationale: Ingawa umbo la Kiebrania linaweza kutafsiriwa “ninasikia,” katika muktadha huu linaendana na taarifa ya usemi uliotangulia; “nimesikia” ni Kiswahili cha asili bila kufuta kabisa uhusiano wake na kusikia kwa Elihu.
