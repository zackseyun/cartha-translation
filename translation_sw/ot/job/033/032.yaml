base_translation:
  language: en
  yaml_path: translation/ot/job/033/032.yaml
  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: sw
  text: Ikiwa una la kusema, nijibu; sema, kwa maana nataka kuthibitisha kuwa uko sawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutetea kuwa una haki,” au, “kutangaza kuwa uko sahihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: Ikiwa una la kusema
  rationale: Muundo wa uwepo una maana ya kuwa na jambo la kusema. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi mwaliko wa Elihu kwa Ayubu ajibu.
- source_word: הֲשִׁיבֵנִי
  choice: nijibu
  rationale: Amri hii ina maana ya kujibu au kuitikia; “nijibu” ni fupi, ya moja kwa moja, na ya asili katika muktadha.
- source_word: דַּבֵּר
  choice: sema
  rationale: Inahifadhi nguvu ya amri rahisi na kuendeleza mwaliko wa Elihu.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya mwaliko uliotangulia.
- source_word: חָפַצְתִּי
  choice: nataka
  rationale: Kitenzi kinaonyesha nia au hamu. “Nataka” ni cha sasa na cha kawaida, bila kupunguza uzito wa kauli.
- source_word: צַדְּקֶךָ
  choice: kuthibitisha kuwa uko sawa
  rationale: Katika muktadha, Elihu anasema angependa kumwona Ayubu akiwa na haki katika hoja yake. Kauli hii huepuka maana ya kiufundi ya kitheolojia ambayo “kuhesabia haki” ingeweza kuleta.
theological_decisions:
- issue: Maana ya צַדְּקֶךָ inayotokana na mzizi צדק
  choice: kuthibitisha kuwa uko sawa
  alternative: kutetea kuwa una haki; kutangaza kuwa uko sahihi
  rationale: Hapa Elihu hasemi moja kwa moja kuhusu kuhesabiwa haki mbele za Mungu katika maana maalumu ya kidoktrini, bali kuhusu nia yake ya kukubali au kuonyesha kwamba Ayubu yuko sawa ikiwa ana jibu. Tanbihi huhifadhi uwezekano wa maana ya kumtetea au kumthibitishia haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Una la kusema” ni nahau ya kawaida inayowasilisha מִלִּין bila kuwa nzito; marudio “nijibu; sema” yanahifadhi msisitizo wa Kiebrania.
