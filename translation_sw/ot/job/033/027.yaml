  text: Anaimba mbele ya watu, akisema, “Nimetenda dhambi, na nimepotosha yaliyo sawa, wala sikulipiziwa kwa hayo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala haikunifaa.” Kifungu cha Kiebrania kinaweza kumaanisha kwamba hakulipiziwa kwa aliyotenda, au kwamba tendo hilo halikumfaa.
    reason: Kuhifadhi utata wa וְלֹא שָׁוָה לִי bila kuongeza dhana ya ‘kama nilivyostahili’ katika matini kuu.
lexical_decisions:
- source_word: יָשֹׁר עַל אֲנָשִׁים
  choice: Anaimba mbele ya watu
  rationale: Kitenzi hapa kinaeleweka kuwa kuimba au kutangaza kwa sauti mbele ya watu; ‘mbele ya’ huwasilisha matumizi ya עַל katika muktadha huu kwa Kiswahili cha kawaida.
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  choice: na kupotosha yaliyo sawa
  rationale: Hifil ya עוה ina maana ya kufanya kipotoke au kukipotosha; יָשָׁר ni kilicho sawa au cha haki. Tafsiri hii inadumisha utofautishaji wa kukiri kosa dhidi ya haki.
- source_word: וְלֹא שָׁוָה לִי
  choice: lakini sikulipwa kama nilivyostahili
  rationale: Kirai kifupi cha Kiebrania kina wazo la kutopata malipo yanayolingana na tendo. Kiswahili hiki kinaeleza kwa kawaida kwamba adhabu inayostahili haikumfikia msemaji, huku tanbihi ikihifadhi uwezekano mwingine wa maana.
theological_decisions:
- issue: Je, kauli ya mwisho inamaanisha kutoadhibiwa ipasavyo au kwamba dhambi haikuleta faida?
  choice: sikulipwa kama nilivyostahili
  alternative: haikunifaa
  rationale: Muktadha wa kuokolewa na Mungu katika mistari inayozunguka unaunga mkono wazo la kutopokea malipo kamili ya dhambi. Hata hivyo, muundo wa Kiebrania ni mgumu na unaweza kueleweka kuwa tendo hilo halikumfaa; uwezekano huo umewekwa katika tanbihi bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima lakini wa kawaida na unaoeleweka. Kauli ya kukiri imetolewa moja kwa moja, bila kuingiza istilahi za kimadhehebu.
