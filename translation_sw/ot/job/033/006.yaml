  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: sw
  text: Tazama, mimi ni kama kinywa chako kwa Mungu[a]; mimi pia nilifinyangwa kutokana na udongo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mimi ni kama kinywa chako kwa Mungu.” Huenda maana yake ikawa “msemaji wako mbele za Mungu,” “kama ulivyotaka mbele za Mungu,” au labda “sawa nawe mbele za Mungu.”
    reason: alternative_reading
  - marker: b
    text: Au, “mimi pia nilimegwa kutoka udongoni.” Kitenzi cha Kiebrania huweza kuleta picha ya kubana, kukata, au kufanyiza kitu kutokana na udongo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni chembe ya usemi inayovuta fikira kwa mkazo. “Tazama” ni ya kawaida katika mtindo wenye heshima wa Biblia ya Kiswahili na inahifadhi nguvu ya kuonyesha jambo.
- source_word: כְפִיךָ לָאֵל
  choice: kama kinywa chako mbele za Mungu
  rationale: Tafsiri hii inafuata kwa karibu usemi mgumu wa Kiebrania, kihalisi “kama kinywa chako kwa Mungu,” bila kuufungia katika maana moja. “Kinywa” kinaweza kumaanisha msemaji au mwakilishi, huku “mbele za Mungu” ikitoa Kiswahili cha kawaida kwa uhusiano unaoonyeshwa na ל katika muktadha huu.
- source_word: מֵחֹמֶר
  choice: kutoka katika udongo
  rationale: חֹמֶר ni udongo wa kufinyangia, tope zito, au malighafi ya udongo. “Udongo” ni neno la kawaida na linafaa kwa picha ya mwanadamu aliyeumbwa kutokana na ardhi.
- source_word: קֹרַצְתִּי
  choice: nilifinyangwa
  rationale: Kitenzi kinaweza kuleta picha ya kumega kwa kubana au kufanyiza udongo kwa vidole. “Nilifinyangwa” ni Kiswahili cha asili kinachohifadhi picha ya ufundi wa udongo; maana halisi zaidi ya kumegwa imehifadhiwa katika tanbihi.
- source_word: גַם אֲנִי
  choice: mimi pia
  rationale: Inahifadhi mkazo wa Elihu kwamba yeye, kama Ayubu, ni mwanadamu aliyeumbwa kwa udongo.
theological_decisions:
- issue: Maana ya dai la Elihu kuhusu uhusiano wake na Ayubu mbele za Mungu
  choice: Kudumisha picha ya “kinywa chako” katika matini na kueleza uwezekano wa “msemaji wako” katika tanbihi
  alternative: “msemaji wako mbele za Mungu,” “kulingana na matakwa yako mbele za Mungu,” au “sawa nawe mbele za Mungu”
  rationale: Kiebrania ni kifupi na kina utata wa kweli. Sentensi inayofuata inasisitiza ubinadamu wa pamoja, lakini haitoshi kuthibitisha kabisa kwamba Elihu anadai kuwa mpatanishi au msemaji wa Ayubu. Kwa hiyo tafsiri haiongezi fundisho maalumu la upatanishi.
- issue: Picha ya kuumbwa kwa udongo
  choice: nilifinyangwa kutoka katika udongo
  alternative: “nilimegwa kutoka katika udongo” au “niliumbwa kwa udongo”
  rationale: “Nilifinyangwa” inaonyesha tendo la kufanyiza udongo bila kugeuza mstari kuwa kauli pana zaidi ya kiteolojia. Tanbihi inadumisha picha ya kumega kwa kubana iliyomo katika kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo usio wa kawaida “kama kinywa chako” umehifadhiwa kwa sababu unaakisi utata halisi wa Kiebrania; tanbihi inafafanua maana zinazowezekana.
