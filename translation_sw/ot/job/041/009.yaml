  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: sw
  text: Kila moja hushikamana na mwenzake[a]; yamefungamana pamoja, wala hayawezi kutengana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Kila moja hushikamana na ndugu yake”; “ndugu” ni tafsiri ya karibu zaidi na umbo la Kiebrania katika maelezo haya ya kishairi kuhusu magamba ya Lewiathani.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Kila moja
  rationale: Katika maelezo haya ya magamba ya Lewiathani, neno hili limetumiwa kwa maana ya kugawa kila kitu kimoja kimoja, si kumaanisha mwanamume.
- source_word: בְּאָחִיהוּ
  choice: na mwenzake
  rationale: Kihalisi ni “na ndugu yake.” Kwa vitu visivyo watu, “mwenzake” ni Kiswahili cha kawaida kinachohifadhi wazo la uhusiano wa karibu kati ya magamba yaliyo jirani; tafsiri halisi imewekwa katika tanbihi.
- source_word: יְדֻבָּקוּ
  choice: hushikamana
  rationale: Kitenzi דבק kinaonyesha kushikamana kwa karibu. Umbo la umoja linaendana na “kila moja,” huku maana ya mgawanyo katika Kiebrania ikihifadhiwa.
- source_word: יִתְלַכְּדוּ
  choice: zimefungamana pamoja
  rationale: Kitenzi kinaonyesha kushikwa au kuunganishwa kwa nguvu. Kauli hii ni ya asili katika Kiswahili na inaendeleza picha ya magamba yaliyofungamana.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: wala haziwezi kutengana
  rationale: 'Kauli hii inaeleza matokeo ya kufungamana kwao sana: magamba hayo hayawezi kuachana. “Kutengana” pia huhifadhi hali ya kitenzi cha Kiebrania kuliko kauli tendwa.'
