  text: Who has stripped off the front of his garment? Who can come within his double bridle?[a]
translation:
  language: sw
  text: Ni nani aliyefunua sehemu ya mbele ya vazi lake? Ni nani anayeweza kuingia katika sehemu maradufu ya lijamu yake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani anayeweza kuingia katika mkunjo wa lijamu yake?” Usemi wa Kiebrania ni mgumu; huenda ukarejelea kwa njia ya sitiari mdomo au taya za Lewiathani, au safu mbili za meno yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: aliyefunua
  rationale: Kitenzi hiki humaanisha kufunua au kuweka wazi. “Aliyefunua” ni cha kawaida na huhifadhi maana bila kuongeza wazo lisilo wazi la kuvua kwa nguvu.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: sehemu ya mbele ya vazi lake
  rationale: Huhifadhi taswira halisi ya “uso/sehemu ya mbele ya vazi lake” bila kuitafsiri moja kwa moja kuwa ngozi au magamba.
- source_word: בְּכֶפֶל
  choice: katikati ya ... maradufu
  rationale: כפל huonyesha hali ya kuwa maradufu au mkunjo. Usemi huu unaacha ugumu wa taswira ya Kiebrania badala ya kuamua kwamba inamaanisha taya au safu za meno.
- source_word: רִסְנוֹ
  choice: lijamu yake
  rationale: רסן kwa kawaida ni lijamu au kifaa cha kudhibiti mdomo. “Lijamu” huhifadhi sitiari ya mdomo wa Leviathani.
- source_word: מִי יָבוֹא
  choice: Ni nani anayeweza kuingia
  rationale: Swali hili ni changamoto inayoashiria kutowezekana; “anayeweza” huwasilisha nguvu hiyo, na “kuingia” hufaa kwa בְּ inayofuata.
