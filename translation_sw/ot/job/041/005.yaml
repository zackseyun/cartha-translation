translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi wenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira tata ya Kiebrania imehifadhiwa, na ufafanuzi unaowezekana umewekwa katika tanbihi.
