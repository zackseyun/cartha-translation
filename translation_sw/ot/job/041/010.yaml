  yaml_path: translation/ot/job/041/010.yaml
  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: sw
  text: Chafya zake hufanya nuru ing'ae,[a] na macho yake ni kama kope za mapambazuko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Chafya zake huangaza nuru.” Kitenzi cha Kiebrania kina maana ya kusababisha nuru iangaze, na usemi huu ni wa kishairi sana.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kama kope za mapambazuko,” picha ya kishairi ya Kiebrania inayoonyesha mwanga wa kwanza wa siku ukifunguka.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: kupiga chafya kwake
  rationale: Nomino inayotokana na עטש inahusu kupiga chafya. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi picha halisi ya matini kuliko ‘kukoroma’.
- source_word: תָּהֶל
  choice: huangaza
  rationale: Hiphil ya הלל hapa ina maana ya kusababisha nuru iangaze. ‘Huangaza’ ni ya kishairi na ya kawaida, huku tanbihi ikihifadhi uwezekano wa kuelewa nuru kuwa inamulika kwa ghafla.
- source_word: אוֹר
  choice: nuru
  rationale: Neno la kawaida la Kiebrania humaanisha nuru. ‘Nuru’ linafaa kwa mtindo wa kishairi na wenye heshima.
- source_word: וְעֵינָיו
  choice: na macho yake
  rationale: Huu ni uhamishaji wa moja kwa moja wa kiunganishi na nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume.
- source_word: כְּעַפְעַפֵּי
  choice: kama kope za
  rationale: עפעפים humaanisha kope. Picha halisi ya kishairi imehifadhiwa badala ya kufasiriwa kuwa miale ya kwanza.
- source_word: שָׁחַר
  choice: mapambazuko
  rationale: Nomino humaanisha alfajiri au mapambazuko. ‘Mapambazuko’ huwasilisha kwa ufasaha mwanga wa kwanza wa siku katika tashbihi hii.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na ya kishairi. Taswira halisi ya ‘kope za mapambazuko’ imehifadhiwa, huku tanbihi zikifafanua maana yake na upeo wa kitenzi.
