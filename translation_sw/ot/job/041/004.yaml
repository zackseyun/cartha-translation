  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: sw
  text: Sitanyamaza kuhusu viungo vyake, kuhusu nguvu zake kuu, na uzuri wa mpangilio wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sitanyamaza kuhusu sehemu zake, au kuhusu maelezo ya nguvu zake na uzuri wa mpangilio wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: Sitanyamaza
  rationale: Kitenzi hiki kinaonyesha azimio la msemaji la kutokujizuia kusema; Kiswahili hiki ni cha kawaida na kinadumisha nafsi ya kwanza.
- source_word: בַּדָּיו
  choice: viungo vyake
  rationale: Katika maelezo ya kiumbe huyu, neno hilo linaeleweka kwa kawaida kuwa sehemu au viungo vya mwili.
- source_word: דְבַר
  choice: kuhusu
  rationale: Katika muundo huu neno linaanzisha jambo litakaloelezwa. 'Kuhusu' ni ya asili katika Kiswahili na huepuka nomino nzito isiyo ya lazima.
- source_word: גְּבוּרוֹת
  choice: nguvu zake kuu
  rationale: Wingi wa neno unaweza kumaanisha nguvu, uwezo, au matendo makuu; muktadha wa maumbile na uwezo wa kiumbe unaunga mkono maana ya nguvu nyingi au kuu.
- source_word: חִין
  choice: uzuri
  rationale: Hapa neno la neema, haiba, au uzuri lina nguvu ya kimwonekano, likisifu jinsi umbo lake lilivyopangwa.
- source_word: עֶרְכּוֹ
  choice: mpangilio wa mwili wake
  rationale: Neno linatokana na wazo la kupanga au kuweka kwa utaratibu. Kutaja mwili kwa uwazi kunafanya maana iwe ya kawaida katika muktadha bila kuibana kuwa 'uwiano' pekee.
