  yaml_path: translation/ot/job/041/018.yaml
  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: sw
  text: Upanga unaomfikia hauwezi kusimama[a]; wala mkuki, mshale[b], au mkuki wa kurusha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Upanga unaompata haushindi.” Usemi wa Kiebrania unasema kihalisi kwamba upanga “hausimami.”
    reason: lexical_alternative
  - marker: b
    text: Maneno ya Kiebrania yaliyotafsiriwa “mshale” na “mkuki wa kurusha” ni adimu, na maana zake hazina hakika. Neno la kwanza linaweza pia kumaanisha “silaha ya kurushwa” au “fito”; la pili linaweza kumaanisha “vazi la chuma” au “silaha ya kujikinga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: unaomfikia
  rationale: Kitenzi נשׂג/השיג kina maana ya ‘kufikia, kumpata, kumwandama.’ Hapa kinaueleza upanga unaofanikiwa kumfikia; ‘unaomfikia’ ni ya asili na haiongezi wazo la kumjeruhi.
- source_word: חֶרֶב
  choice: upanga
  rationale: Neno la kawaida kwa silaha ya upanga; limetumiwa hapa kwa maana ya jumla.
- source_word: בְּלִי תָקוּם
  choice: hauwezi kusimama
  rationale: Bila + קום kihalisi huonyesha kwamba silaha ‘haitasimama’; tafsiri hii inadumisha taswira halisi ya Kiebrania huku ikidokeza kutofanikiwa kwake.
- source_word: חֲנִית
  choice: mkuki
  rationale: Neno la kawaida kwa silaha ndefu ya kuchoma; ‘mkuki’ linaeleweka wazi katika Kiswahili cha sasa.
- source_word: מַסָּע
  choice: mshale
  rationale: Neno hili ni adimu na maana yake haina hakika, lakini katika mfululizo huu linaelekea kutaja silaha inayorushwa. ‘Mshale’ ni chaguo linaloeleweka, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וְשִׁרְיָה
  choice: au mkuki wa kurusha
  rationale: Ingawa neno hili ni adimu na linaweza pia kumaanisha vazi la chuma au silaha ya kujikinga, muktadha wa orodha ya silaha unaunga mkono silaha yenye ncha inayorushwa. ‘Mkuki wa kurusha’ hutofautisha silaha hii na חֲנִית.
