lexical_decisions:
- source_word: לִבּוֹ
  choice: moyo wake
  rationale: לֵב hapa ni moyo kama kitovu cha utu wa ndani; “moyo wake” ni tafsiri ya kawaida na huhifadhi taswira halisi ya kishairi.
- source_word: יָצוּק
  choice: ni mgumu
  rationale: Kitenzi יצק kwa maana ya msingi huhusu kumimina au kutengeneza kwa kuyeyusha, lakini hapa hali ya kitu kilichogandishwa na kuwa thabiti inaelezwa; “ni mgumu” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כְּמוֹ אָבֶן
  choice: kama jiwe
  rationale: Huhifadhi moja kwa moja tashbihi halisi ya Kiebrania.
- source_word: וְיָצוּק
  choice: ni mgumu
  rationale: Kurudia “ni mgumu” huhifadhi usambamba na msisitizo wa kishairi wa prediketi iliyorudiwa.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: kama jiwe la chini la kusagia
  rationale: Katika muktadha huu פֶלַח תַּחְתִּית hueleweka kuwa jiwe la chini la kinu; msemo huu unaeleweka kwa urahisi na kudumisha taswira ya uzito na ugumu.
