  language: sw
  text: Safu zake za magamba yenye mfano wa ngao ni fahari; zimefungwa kama kwa muhuri mkali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּאֲוָה
  choice: fahari yake
  rationale: Nomino hii ina maana ya fahari au kiburi; hapa inaweza kueleza uzuri wa kutisha wa safu za magamba bila kulazimisha hisia ya maadili.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: safu za magamba yake
  rationale: Kihalisi ni mikondo au safu za ngao. Katika maelezo ya mwili wa Leviathani, 'magamba' huwasilisha picha inayokusudiwa, huku 'safu' ikihifadhi mpangilio wake.
- source_word: סָגוּר
  choice: yamefungwa
  rationale: Huhifadhi maana ya kufungwa kabisa au kushikamana bila nafasi wazi.
- source_word: חוֹתָם צָר
  choice: kwa muhuri uliobana
  rationale: Kihalisi ni muhuri mwembamba au uliokaza; usemi huu wa Kiswahili huhifadhi picha ya kutiwa muhuri kwa ukaribu sana.
theological_decisions:
- issue: Uhusiano wa גַּאֲוָה na אֲפִיקֵי מָגִנִּים
  choice: '''Safu za magamba yake ni fahari yake'''
  alternative: '''Safu zake za magamba ya fahari'''
  rationale: Muundo wa Kiebrania ni mgumu na unaweza kueleweka kwa njia zote mbili. Tafsiri iliyochaguliwa ni ya asili zaidi kwa Kiswahili na haiingizi fundisho maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya ngao imetafsiriwa kimuktadha kuwa magamba.
