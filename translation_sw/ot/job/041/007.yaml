  terminology: “Ngao” ihifadhiwe kama taswira ya msingi ya maandishi ya Kiebrania; “magamba” yaelezwe kama ulinganisho ili kuzingatia muktadha wa kiumbe bila kufuta taswira hiyo. “Fahari” inafaa kwa גַּאֲוָה.
