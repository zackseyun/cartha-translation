translation:
  language: sw
  text: Rungu[a] huhesabiwa kuwa kama majani makavu[b], naye huicheka kelele ya mkuki wa kurushwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Silaha ya kurushwa huhesabiwa kuwa kama majani makavu”; neno la Kiebrania תוֹתָח ni nadra, na maana yake kamili haina uhakika.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama mabua makavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקַשׁ
  choice: kama majani makavu
  rationale: קַשׁ humaanisha majani au mabua yaliyokauka baada ya mavuno. Usemi huu ni wa kawaida na unaonyesha kitu chepesi kisicho na madhara; tanbihi huhifadhi mbadala wa ‘makapi’.
- source_word: נֶחְשְׁבוּ
  choice: huhesabiwa kuwa
  rationale: Ni kauli tendwa ya חשׁב, ‘kuhesabu/kufikiri kuwa.’ Kiswahili hiki kinahifadhi tathmini ya silaha machoni pa Leviathani.
- source_word: תוֹתָח
  choice: rungu
  rationale: Neno hili ni nadra na maana yake kamili haina uhakika. ‘Rungu’ hufaa katika muktadha wa silaha na usambamba na כִּידוֹן, huku tanbihi ikitaja uwezekano wa silaha ya kurushwa.
- source_word: וְיִשְׂחַק
  choice: naye huicheka
  rationale: Kitenzi שׂחק humaanisha ‘kucheka.’ Kiambishi cha nafsi kinamrejelea Leviathani, naye anadharau tishio la silaha.
- source_word: לְרַעַשׁ
  choice: kelele ya
  rationale: רַעַשׁ inaweza kueleza kelele, mtikisiko, au mgongano. ‘Kelele’ ni pana vya kutosha kuhifadhi uwezekano huo katika muktadha wa silaha.
- source_word: כִּידוֹן
  choice: mkuki wa kurushwa
  rationale: כִּידוֹן ni mkuki mwepesi au silaha inayofanana na mkuki, mara nyingi ya kurushwa. Tafsiri hii ni wazi kwa msomaji wa kisasa na huitofautisha na mkuki wa kawaida.
