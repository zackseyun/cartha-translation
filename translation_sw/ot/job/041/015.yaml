lexical_decisions:
- source_word: מַפְּלֵי
  choice: mikunjo
  rationale: Neno hilo linaonyesha sehemu zinazoning’inia au kukunjamana; “mikunjo” linafaa kwa taswira ya nyama ya kiumbe.
- source_word: בְשָׂרוֹ
  choice: nyama yake
  rationale: Huhifadhi maana ya msingi ya בשר, ‘nyama,’ badala ya kuifasiri kuwa ngozi au mwili kwa ujumla.
- source_word: דָבֵקוּ
  choice: imeshikamana
  rationale: Kitenzi דבק huonyesha kushikana kwa karibu; umoja wa kisarufi katika Kiswahili unaendana na kiima cha ngeli ya MI, “mikunjo.”
- source_word: יָצוּק
  choice: imemiminwa ... kama kitu kigumu
  rationale: Huhifadhi picha ya kitu kilichomiminwa au kusubu na kisha kuwa thabiti, huku Kiswahili kikibaki wazi na cha kawaida.
- source_word: עָלָיו
  choice: juu yake
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kihusishi chenye kiambishi cha nafsi.
- source_word: בַּל יִמּוֹט
  choice: wala haitikisiki
  rationale: Hutoa maana ya kutosogezeka au kutoyumba kwa lugha ya kishairi iliyo ya kawaida; haiongezi wazo la wakati la ‘kamwe.’
