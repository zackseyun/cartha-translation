  text: מִ֣י הִ֭קְדִּימַ/נִי וַ/אֲשַׁלֵּ֑ם תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם לִ/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: sw
  text: Ni nani aliyenipa kitu kwanza[a], hata nimlipe? Kila kilicho chini ya mbingu zote ni changu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri rasmi zaidi, “aliyenitangulia.” Kitenzi cha Kiebrania kinaweza kumaanisha kutangulia au kufanya jambo kabla ya mwingine; hapa huenda kinamaanisha kutoa kwanza na hivyo kumweka mwingine chini ya wajibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha; “Ni nani” ni usemi wa kawaida na wenye nguvu katika Kiswahili.
- source_word: הִקְדִּימַנִי
  choice: aliyenipa kitu kwanza
  rationale: Kitenzi cha Kiebrania kinaweza kumaanisha kutangulia au kufanya jambo kabla ya mwingine; hapa, kwa kuunganishwa na wazo la kulipa, kinadokeza kumpa Mungu kitu kwanza na hivyo kumweka chini ya wajibu. Neno “kitu” linafanya maana hiyo ieleweke bila kubainisha aina ya zawadi.
- source_word: וַאֲשַׁלֵּם
  choice: hata nimlipe
  rationale: Katika swali hili la balagha, kishazi kinaonyesha matokeo yanayodhaniwa ya tendo la kwanza. “Hata nimlipe” ni Kiswahili cha asili na hakisikiki kama ahadi ya wakati ujao.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: chini ya mbingu zote
  rationale: Tafsiri hii inadumisha wingi wa neno la Kiebrania “mbingu” na inaeleza eneo lote la uumbaji lililo chini yake.
- source_word: לִי הוּא
  choice: ni changu
  rationale: Kauli hii fupi ya umilikaji inahifadhi mkazo wa Kiebrania kwamba vyote ni mali ya Mungu. “Kila kilicho” hutaja kwa njia ya kawaida jumla inayodokezwa na kishazi kilichotangulia.
theological_decisions:
- issue: Mungu kutowiwa na umiliki wake
  choice: Swali linakanusha kwamba mtu yeyote amempa Mungu kitu kwanza na hivyo kumfanya awe na deni; kisha mstari unathibitisha kwamba kila kilicho chini ya mbingu ni chake.
  alternative: Kutafsiri kwa namna rasmi zaidi, “Ni nani aliyenitangulia, hata nimlipe?” na kuacha wazo la kutoa kwanza likiwa fiche.
  rationale: Uhusiano kati ya הִקְדִּימַנִי na וַאֲשַׁלֵּם unaonyesha tendo la awali ambalo lingedai malipo. Kauli inayofuata kuhusu umiliki wa Mungu inaunga mkono maana hiyo, bila kuingiza mfumo wa mafundisho ulio nje ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa; “nimlipe” ni wa kawaida na wazi, huku tanbihi ikihifadhi maana pana ya kitenzi cha Kiebrania.
