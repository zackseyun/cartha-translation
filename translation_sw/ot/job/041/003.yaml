  terminology: “Mbingu zote” hudumisha wingi wa השמים, na “ni changu” ni usemi sahihi wa umilikaji katika sauti ya nafsi ya kwanza ya Mungu. Tanbihi inaweka wazi mbadala wa kimsamiati bila kuondoa maana ya muktadha.
