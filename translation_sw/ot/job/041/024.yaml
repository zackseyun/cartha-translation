  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. ‘Hung’aa’ linaonyesha hali ya njia anayoiwacha nyuma yake; ‘kilindi kina mvi’ huhifadhi taswira ya Kiebrania badala ya kuibadili kuwa maelezo ya moja kwa moja kuhusu povu.
