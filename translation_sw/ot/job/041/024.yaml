base_translation:
  language: en
  yaml_path: translation/ot/job/041/024.yaml
  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: sw
  text: Nyuma yake njia hung’aa[a]; mtu angefikiri kilindi kina mvi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada yake njia hung’aa.” Kiebrania kinaweza kueleweka kwa maana ya wakati (“baada yake”) au ya mahali (“nyuma yake”); muktadha wa mkondo unaoachwa majini unapendelea “nyuma yake.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kilindi kuwa mvi.” Hii ni taswira ya bahari inayoonekana nyeupe kwa povu, kana kwamba ina mvi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Nyuma yake
  rationale: Kirai hiki kinaweza kuonyesha mfuatano wa mahali au wa wakati. Katika picha ya kiumbe anayepita baharini na kuacha mkondo, maana ya mahali, ‘nyuma yake,’ inafaa zaidi.
- source_word: יָאִיר
  choice: hung’aa
  rationale: Hifili ya אור humaanisha kutoa nuru au kung’aa. Hapa inaeleza mwonekano angavu wa mkondo unaoachwa majini.
- source_word: נָתִיב
  choice: njia
  rationale: Nomino hii humaanisha njia au mkondo. Katika muktadha huu ni taswira ya mkondo unaoachwa na kiumbe anapopita majini.
- source_word: יַחְשֹׁב
  choice: mtu angefikiri
  rationale: Ingawa kitenzi ni nafsi ya tatu umoja wa kiume, kinaweza kutumiwa kwa maana isiyotaja mhusika mahsusi. Kiswahili hiki huonyesha hisia ya mtazamaji bila kumtambulisha.
- source_word: תְּהוֹם
  choice: kilindi
  rationale: Neno hili hurejelea maji ya kina. ‘Kilindi’ huhifadhi uzito wa kishairi bila kufafanua zaidi ya Kiebrania.
- source_word: לְשֵׂיבָה
  choice: kina mvi
  rationale: Nomino שֵׂיבָה inaweza kumaanisha mvi, uzee, au weupe wa mvi. Povu jeupe la mkondo linafanya kilindi kionekane kana kwamba kina mvi.
theological_decisions: []
