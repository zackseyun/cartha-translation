  yaml_path: translation/ot/job/041/020.yaml
  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: sw
  text: Mpiga upinde[a] hawezi kumfanya akimbie; mawe ya kombeo huwa kama mabua makavu kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwana wa upinde,” yaani, mpiga upinde.'
