lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: hawezi kumfanya akimbie
  rationale: Hifili ya ברח yenye kiambishi cha yambwa cha nafsi ya tatu, umoja wa kiume, ina maana ya kumsababisha mtu akimbie. Tafsiri hii inaonyesha wazi maana hiyo ya kisababishi katika Kiswahili cha kawaida.
- source_word: בֶן קָשֶׁת
  choice: mwana wa upinde
  rationale: Kirai hiki kwa neno kwa neno ni “mwana wa upinde,” nahau ya Kiebrania inayomaanisha mtu anayehusishwa na upinde, yaani mpiga upinde. Muundo halisi umehifadhiwa katika matini, na maana ya nahau imefafanuliwa katika tanbihi.
- source_word: לְקַשׁ
  choice: kama mabua makavu
  rationale: Nomino קשׁ humaanisha mabua au masalia makavu ya nafaka. “Mabua makavu” huhifadhi taswira ya kitu chepesi na kisicho na nguvu mbele yake.
- source_word: נֶהְפְּכוּ לוֹ
  choice: huwa ... kwake
  rationale: Nifali ya הפך hapa inaonyesha kuwa mawe hayo yanakuwa kama kitu kingine kwa habari yake. “Huwa ... kwake” ni usemi wa asili wa Kiswahili unaohifadhi uhusiano huo bila kuongeza maelezo yasiyokuwamo.
- source_word: אַבְנֵי קָלַע
  choice: mawe ya kombeo
  rationale: Kirai unganifu kinataja mawe yanayotumiwa kwa kombeo. “Mawe ya kombeo” ni wazi na ya kawaida katika Kiswahili.
