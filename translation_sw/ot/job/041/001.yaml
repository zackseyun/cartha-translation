lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Neno hili linaelekeza usikivu na kusisitiza kauli inayofuata; “Tazama” linahifadhi uzito wa kishairi kwa Kiswahili cha sasa.
- source_word: תֹּחַלְתּוֹ
  choice: tumaini lake
  rationale: Nomino hii humaanisha tumaini au tarajio. “Tumaini lake” ni tafsiri ya moja kwa moja na ya kawaida bila kufafanua kupita kiasi tumaini hilo ni la nani au la aina gani.
- source_word: נִכְזָבָה
  choice: linathibitika kuwa la uongo
  rationale: Kitenzi cha hali ya kutendwa/matokeo kutoka כזב huonyesha kuwa tumaini linageuka kuwa la udanganyifu, lisilo na msingi, au lililokatishwa. Kauli hii inadumisha wazo la matokeo bila kulifanya tu kuwa hisia ya kuvunjika moyo.
- source_word: הֲגַם
  choice: je, mtu ... hata
  rationale: Muungano wa kiulizi na chembe ya nyongeza unaanzisha swali la balagha lenye msisitizo. Kiswahili “je ... hata” kinawasilisha nguvu hiyo kwa kawaida.
- source_word: אֶל מַרְאָיו
  choice: kwa kumwona tu
  rationale: Kirai hiki kinahusu mwonekano au kumwona kwake. “Kwa kumwona tu” ni cha kawaida katika Kiswahili na kinaonyesha kwamba mwonekano wenyewe unatosha kuleta mwitikio, huku uwezekano wa “mbele ya sura yake” ukibaki katika tanbihi.
- source_word: יֻטָל
  choice: haangushwi chini
  rationale: Umbo la Hophal lina maana ya kutupwa au kuangushwa chini. Tafsiri hii inahifadhi hali ya kutendwa na taswira ya kuanguka bila kuamua kwamba ni kushindwa vitani au kuzidiwa na hofu pekee.
