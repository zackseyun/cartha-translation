  text: לֹֽא אַ֭כְזָר כִּ֣י יְעוּרֶ֑/נּוּ וּ/מִ֥י ה֝֗וּא לְ/פָנַ֥/י יִתְיַצָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: sw
  text: Hakuna mtu aliye mkali hata athubutu kumchokoza[a]. Basi, ni nani awezaye kusimama mbele yangu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumwamsha.” Kitenzi cha Kiebrania humaanisha “kuamsha” au “kumwamsha”; hapa kinatumika kwa maana ya kumchokoza Leviathani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: Hakuna mtu mkali kiasi
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida wazo la kwamba hakuna mwenye ukali au ujasiri wa kutosha kufanya tendo linalofuata; ‘mkali’ hapa hudokeza ukali na kutisha bila kuingiza hukumu ya kimaadili ya ‘katili.’
- source_word: כִּי יְעוּרֶנּוּ
  choice: cha kuthubutu kumchokoza
  rationale: Kitenzi עור humaanisha kuamsha au kuchochea. Katika muktadha wa Leviathani, ‘kumchokoza’ kinaonyesha kumwamsha kwa maana ya kumtia katika hali ya kushambulia; ‘kuthubutu’ huweka wazi nguvu ya swali la balagha bila kubadili hoja yake.
- source_word: וּמִי הוּא
  choice: Basi, ni nani
  rationale: Kiunganishi pamoja na kiulizi kinaendeleza hitimisho la hoja. ‘Basi’ huonyesha uhusiano huo wa kimantiki kwa Kiswahili cha kawaida, huku ‘ni nani’ kikihifadhi msisitizo wa kiulizi.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kuwa mbele ya uso au uwepo wa msemaji, na katika muktadha inaweza pia kudokeza kukabiliana naye.
- source_word: יִתְיַצָּב
  choice: awezaye kusimama
  rationale: Kitenzi kina maana ya kujiweka au kusimama mahali. Katika swali hili la balagha, ‘awezaye kusimama’ huwasilisha uwezo wa kujitokeza au kustahimili mbele za Mungu.
theological_decisions:
- issue: Uhusiano wa kishazi kuhusu Leviathani na swali kuhusu Mungu
  choice: 'Kishazi cha pili kinamrejelea Mungu: ikiwa hakuna anayethubutu kumchokoza Leviathani, ni nani basi anayeweza kusimama mbele za Mungu?'
  alternative: Vishazi vyote viwili vimrejelee Leviathani pekee.
  rationale: Kiambishi cha nafsi ya kwanza katika לְפָנַי (‘mbele yangu’) kinaonyesha wazi kwamba Mungu ndiye msemaji na mrejelewa wa swali la pili. Hoja inasonga kutoka kwa kiumbe kwenda kwa Muumba bila kuondoa mvutano wa usemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Leviathani’ halijaongezwa katika mstari kwa kuwa Kiebrania kinatumia kiwakilishi, lakini limewekwa katika tanbihi ili kufafanua mrejelewa. Muundo wa balagha na mabadiliko kutoka kwa Leviathani kwenda kwa Mungu yamehifadhiwa.
