  yaml_path: translation/ot/job/041/026.yaml
  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: sw
  text: Hukitazama kila kilicho juu; yeye ni mfalme wa wana wote wa kiburi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote wenye kiburi.” Kiebrania ni “wana wa kiburi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: kila kilicho juu
  rationale: Kirai hiki kinatumia kivumishi cha umoja kwa maana ya jumla. Tafsiri hii inadumisha picha halisi ya kuwa juu bila kuondoa maana inayoweza kudokezwa ya majivuno au ukuu.
- source_word: יִרְאֶה
  choice: hukitazama
  rationale: Kitenzi ראה humaanisha kuona au kutazama. Hapa hali ya mazoea inaafiki maelezo ya tabia ya kiumbe huyu, na ‘kutazama’ ni ya asili katika Kiswahili.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru kina mkazo katika Kiebrania; ‘yeye’ kinaudumisha mkazo huo katika kishazi cha pili.
- source_word: מֶלֶךְ עַל
  choice: mfalme juu ya
  rationale: Hii inadumisha sitiari ya kifalme na wazo la kutawala au kuwa mkuu kuliko wengine.
- source_word: כָּל בְּנֵי שָׁחַץ
  choice: wana wote wa kiburi
  rationale: Tafsiri hii inadumisha muundo wa kishairi ‘wana wa’ na maana ya שָׁחַץ kama kiburi au majivuno, bila kuamua kama wanaorejelewa ni wanyama wakali, viumbe wenye majivuno, au nguvu za kifumbo.
theological_decisions:
- issue: Maana ya ‘wana wote wa kiburi’
  choice: Kirai cha kishairi kinachoweza kutaja kwa upana viumbe au walio na sifa ya kiburi, huku kiumbe huyu akionyeshwa kuwa mkuu wao.
  alternative: Kukitafsiri mahsusi kuwa wanyama wakali au nguvu za ulimwengu wa kifumbo.
  rationale: Kiebrania hakibainishi kundi moja tu. Muundo halisi umehifadhiwa ili kutofuta utata na mvutano wa kishairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi ‘wana wa kiburi’ umehifadhiwa, huku tanbihi ikitoa usemi wa kawaida zaidi.
