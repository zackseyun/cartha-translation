translation:
  language: sw
  text: 'Huyachemsha maji ya vilindi kama chungu;

    huifanya bahari iwe kama mchanganyiko wa marhamu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama mchanganyiko unaotengenezwa na mtengenezaji wa manukato,” au “kama marhamu.” Neno la Kiebrania linamaanisha mchanganyiko uliotayarishwa, ambao mara nyingi huhusianishwa na marhamu au manukato.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: huyachemsha
  rationale: Hifili ya רתח ina maana ya kusababisha kitu kichemke. “Huyachemsha” huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: כַּסִּיר
  choice: kama chungu
  rationale: סִיר ni chombo cha kupikia, yaani chungu. Tafsiri hii ni wazi na huhifadhi taswira ya kishairi.
- source_word: מְצוּלָה
  choice: maji ya vilindi
  rationale: Neno hili hurejelea vilindi, hasa maji ya kina kirefu. “Maji ya vilindi” ni ya asili kwa Kiswahili na yanaendana na “bahari” katika mstari unaofuata.
- source_word: יָם
  choice: bahari
  rationale: Maana ya kawaida ya יָם ni bahari; neno hilo huhifadhi taswira halisi na usambamba wa kishairi.
- source_word: יָשִׂים
  choice: huifanya ... iwe
  rationale: Ingawa שׂים mara nyingi humaanisha kuweka, katika muundo huu wa ulinganisho ina maana ya kukifanya kitu kiwe katika hali fulani.
- source_word: כַּמֶּרְקָחָה
  choice: kama mchanganyiko wa marhamu
  rationale: מֶרְקָחָה ni mchanganyiko uliotayarishwa kwa kuchanganya viambato, mara nyingi marhamu au manukato. Chaguo hili huhifadhi wazo la kitu kilichochanganywa bila kuongeza chungu ambacho hakitajwi wazi katika kishazi hiki.
