  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: sw
  text: 'Shingoni mwake nguvu hukaa,

    na mbele yake hofu huchupa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mbele yake fadhaa huchupa.” Nomino ya Kiebrania דְּאָבָה ni adimu; katika muktadha huu wa kishairi inaweza kumaanisha hofu, fadhaa, au kuvunjika moyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: Shingoni mwake
  rationale: Muundo wa ב pamoja na צַוָּאר na kiambishi cha nafsi ya tatu ya kiume ni wa mahali; “shingoni mwake” ni Kiswahili cha kawaida na huhifadhi taswira ya nguvu kukaa katika shingo.
- source_word: יָלִין
  choice: hukaa
  rationale: Kitenzi לין humaanisha kukaa au kulala mahali kwa usiku; hapa kimetumiwa kisitiari kuhusu nguvu yenye makao ya kudumu. “Hukaa” ni ya asili katika Kiswahili na huhifadhi uhuishaji huo bila kulazimisha wazo la kulala usiku.
- source_word: עֹז
  choice: nguvu
  rationale: Nomino hii humaanisha nguvu au uweza; “nguvu” ndiyo tafsiri ya moja kwa moja na ya kawaida zaidi katika muktadha huu.
- source_word: וּלְפָנָיו
  choice: na mbele yake
  rationale: Nahau yenye פָּנִים hapa humaanisha mbele ya mtu au kitu; “mbele yake” ni fupi, wazi, na huhifadhi rejeo la kibinafsi.
- source_word: תָּדוּץ
  choice: hurukaruka
  rationale: Kitenzi adimu דוץ huonyesha kuruka-ruka, kuchupa, au kucheza. “Hurukaruka” huhifadhi mwendo hai wa kishairi bila ladha chanya ambayo “hucheza” ingeweza kuleta.
- source_word: דְּאָבָה
  choice: hofu
  rationale: Nomino hii adimu inaweza kuashiria kuvunjika moyo, fadhaa, au hofu kuu. “Hofu” ni pana na ya kawaida kwa wasomaji, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
