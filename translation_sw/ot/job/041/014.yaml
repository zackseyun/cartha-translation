  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wa heshima. Mpangilio wa mistari huhifadhi usambamba wa Kiebrania, na wakati wa mazoea katika “hukaa/hurukaruka” huonyesha sifa ya kudumu ya kiumbe.
