  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: sw
  text: Moshi hutoka katika matundu ya pua yake, kama ule wa chungu[a] kilichopuliziwa moto, na wa matete[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sufuria kubwa” au “kalibu.” Neno la Kiebrania דּוּד linaweza kumaanisha chungu cha kupikia au chombo kikubwa zaidi. Neno linalofuata hudokeza chombo kilichopuliziwa moto au kuchochewa kwa kupuliza.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “na matete” au “na manyasi ya majini.” Huenda matete yalihusishwa na moto na moshi, lakini uhusiano wake kamili na chungu katika taswira hii ya kishairi hauko wazi.'
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: puani mwake
  rationale: Kirai hiki humaanisha ‘kutoka katika matundu ya pua yake’; Kiswahili cha kawaida ‘puani mwake’ kinahifadhi picha ya moshi kutoka puani bila kuwa kizito.
- source_word: יֵצֵא
  choice: hutoka
  rationale: Kauli ya hali ya kawaida katika maelezo haya ya kishairi inaelezwa vizuri kwa ‘hutoka,’ ikionyesha tendo linalomtambulisha kiumbe huyo.
- source_word: עָשָׁן
  choice: moshi
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la Kiswahili.
- source_word: כְּדוּד
  choice: kama ule wa chungu
  rationale: דּוּד ni chombo cha kupikia, ambacho kinaweza kuwa chungu, sufuria, au chombo kikubwa kama sufuria kubwa. ‘Chungu’ ni neno linaloeleweka kwa urahisi; ‘ule wa’ linaunganisha kwa kawaida moshi na picha inayofuata.
- source_word: נָפוּחַ
  choice: kinachotokota
  rationale: Neno la Kiebrania lina wazo la kitu kilichopuliziwa au kuchochewa kwa pumzi. Katika picha ya chombo cha kupikia chenye moshi, ‘kinachotokota’ linaeleza kwa Kiswahili hali inayotokana na moto mkali, huku tanbihi ikihifadhi maana halisi zaidi ya kupuliziwa.
- source_word: וְאַגְמֹן
  choice: na matete yanayowaka
  rationale: אַגְמוֹן hutaja tete au unyasi wa majini. Muktadha wa moshi unaelekea kuyaonyesha yakitumika kama kuni; ‘yanayowaka’ linafanya picha ieleweke bila kuyafanya kuwa aina nyingine ya mmea.
