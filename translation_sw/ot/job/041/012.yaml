translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘kama ule wa’ unaweka wazi kuwa kinacholinganishwa ni moshi. Tanbihi zinahifadhi upana wa דּוּד na utata wa נָפוּחַ pamoja na dhima inayodhaniwa ya matete.
