  yaml_path: translation/ot/job/041/011.yaml
  text: From his mouth torches go out[a]; sparks of fire leap forth.
translation:
  language: sw
  text: Mienge hutoka kinywani mwake; cheche za moto huruka nje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vinga vya moto vinavyowaka” au “mishale ya moto”; neno la Kiebrania linalotafsiriwa “cheche za moto” ni adimu na maana yake si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  choice: kinywani mwake
  rationale: Kirai hiki kinawasilisha moja kwa moja maana ya 'kutoka katika kinywa chake'; katika Kiswahili, kitenzi 'hutoka' tayari hubeba wazo la 'kutoka,' hivyo si lazima kurudia kihusishi.
- source_word: לַפִּידִים
  choice: vinga vya moto
  rationale: Neno hili humaanisha mienge au vinga vinavyowaka. 'Vinga vya moto' huhifadhi picha halisi ya vitu vinavyowaka na ni ya kawaida zaidi katika muktadha huu kuliko kudokeza mienge ya kubebwa.
- source_word: יַהֲלֹכוּ
  choice: hutoka
  rationale: Ingawa kitenzi kimsingi ni 'kwenda/kutembea,' hapa kinaeleza vinga vinavyojitokeza kinywani; 'hutoka' ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: כִּידֹדֵי אֵשׁ
  choice: cheche za moto
  rationale: Nomino adimu ina utata na huenda ikaashiria vitu vinavyowaka au mishale yenye moto. 'Cheche za moto' inafaa usambamba wa kishairi na kitendo cha kuruka nje bila kuifanya picha ya kivita kuwa mahususi kupita ushahidi.
- source_word: יִתְמַלָּטוּ
  choice: huruka nje
  rationale: Maana ya msingi ni kujiponya au kutoroka, lakini katika taswira hii ya kishairi inaeleza moto unaotoka kwa ghafla na kwa nguvu; 'huruka nje' ni ya asili na yenye uhai.
