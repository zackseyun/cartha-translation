  text: מִ֭/שֵּׂת/וֹ יָג֣וּרוּ אֵלִ֑ים מִ֝/שְּׁבָרִ֗ים יִתְחַטָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: sw
  text: Anapoinuka, hata mashujaa huogopa; kwa kishindo huchanganyikiwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: Anapoinuka
  rationale: Nomino שֵׂת katika muktadha huu inaeleweka kuwa kuinuka au kujinyanyua kwa kiumbe; muundo wa Kiswahili unaonyesha tukio hilo kwa kawaida.
- source_word: אֵלִים
  choice: hata mashujaa
  rationale: Ingawa neno hili mara nyingi humaanisha 'miungu', hapa linaweza kutaja wenye nguvu. 'Mashujaa' linaendana na muktadha wa hofu mbele ya kiumbe bila kuingiza dai kwamba miungu halisi ipo; 'hata' huonyesha mshangao uliomo katika wazo.
- source_word: מִשְּׁבָרִים
  choice: kwa kishindo chake
  rationale: שְׁבָרִים inaweza kumaanisha kuvunjika, mawimbi yanayovunjika, au kishindo. Katika muktadha wa kiumbe wa kutisha, 'kishindo chake' ni cha asili na huhifadhi taswira ya sauti au vurugu kali.
- source_word: יִתְחַטָּאוּ
  choice: hupoteza fahamu
  rationale: Kitenzi hiki kwa kawaida huhusishwa na kujitakasa au kujiepusha na kosa, lakini hapa matumizi yake ni nadra na huenda yanaonyesha kuvurugika kabisa au kupoteza uwezo wa kujitawala. Tafsiri hii inawasilisha athari kali bila kuipa maana ya dhambi isiyofaa katika muktadha.
theological_decisions:
- issue: Maana ya אֵלִים
  choice: mashujaa
  alternative: miungu
  rationale: Muktadha unasisitiza kwamba hata wenye nguvu huingiwa na hofu. 'Miungu' ni tafsiri ya moja kwa moja inayowezekana, lakini inaweza kueleweka kama uthibitisho wa kuwepo kwa miungu mingine; 'mashujaa' huhifadhi maana ya nguvu bila kutatua kifungu kwa mtazamo wa kidhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. Sentensi sambamba na fupi inafaa mtindo wa kishairi wa Ayubu.
