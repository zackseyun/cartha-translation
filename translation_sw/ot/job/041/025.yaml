  yaml_path: translation/ot/job/041/025.yaml
  text: On earth there is none like him[b][a], one made without fear.
translation:
  language: sw
  text: Duniani hakuna aliye kama yeye,[a] aliyeumbwa bila hofu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Duniani hakuna anayelingana naye”; neno la Kiebrania hapa linaweza kumaanisha kufanana au kuwa sawa.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyeumbwa asiwe na hofu,” yaani, aliumbwa bila hofu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: hakuna
  rationale: Ni neno la kukanusha kuwapo kwa kitu; “hakuna” ni Kiswahili cha kawaida kinachohifadhi ukanushaji kamili.
- source_word: עַל עָפָר
  choice: duniani
  rationale: Ingawa kwa neno moja moja ni “juu ya mavumbi/ardhi,” katika muktadha huu usemi huo unahusu ulimwengu wa nchi kavu; “duniani” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: מָשְׁלוֹ
  choice: aliye kama yeye
  rationale: Neno hili hapa linaweza kuonyesha kufanana au kuwa sawa; “aliye kama yeye” huhifadhi ulinganisho bila kulifanya kwa lazima kuwa dai la usawa kamili.
- source_word: הֶעָשׂוּ
  choice: ameumbwa
  rationale: Umbo hili lina maana ya kutendwa kutokana na עשה, yaani kiumbe huyu alifanywa; “ameumbwa” ni la asili zaidi kwa kiumbe katika muktadha huu.
- source_word: לִבְלִי
  choice: bila
  rationale: Muundo huu huonyesha kutokuwapo kwa kitu; “bila” ni tafsiri fupi na ya moja kwa moja.
- source_word: חָת
  choice: woga
  rationale: Neno linamaanisha hofu, kitisho, au kufadhaika; “woga” linaeleza hali ya kuogopa ambayo kiumbe huyu hana.
