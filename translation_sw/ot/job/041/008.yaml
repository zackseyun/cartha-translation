  yaml_path: translation/ot/job/041/008.yaml
  text: They press close[a], one to another, and no air can come between them.
translation:
  language: sw
  text: Vinabanana[a], kimoja kwa kingine, wala hewa haiwezi kupenya kati yavyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vimekaribiana.” Kitenzi cha Kiebrania kinaeleza magamba yaliyokaribiana sana kwa kubanana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד בְּאֶחָד
  choice: kimoja karibu na kingine
  rationale: Urudiaji wa אֶחָד pamoja na בְּ unaonyesha kuwa kila gamba liko karibu kabisa na linalofuata; usemi huu ni wa kawaida katika Kiswahili na unadumisha maana hiyo ya mpangilio wa moja kwa moja.
- source_word: יִגַּשׁוּ
  choice: vinakaa ... karibu
  rationale: Katika muktadha wa magamba ya Leviathani, kitenzi kinaeleza ukaribu mkubwa, si tendo la kusogea tu. 'Vinakaa karibu' huwasilisha hali ya kushikamana kwao kwa lugha ya kawaida.
- source_word: וְרוּחַ
  choice: hewa
  rationale: רוּחַ linaweza kumaanisha hewa, upepo, pumzi, au roho. Hapa maelezo ni ya kimwili, na 'hewa' linafaa kwa wazo la kutokuwapo kwa mwanya kati ya magamba.
- source_word: לֹא יָבֹא
  choice: haiingii
  rationale: Kauli hasi inaeleza kuwa hewa haipiti wala kuingia katikati kwa sababu ya ukaribu wa magamba. 'Haiingii' ni ya asili na wazi katika Kiswahili.
- source_word: בֵינֵיהֶם
  choice: katikati yake
  rationale: Kiwakilishi cha Kiebrania ni cha wingi na kinarejelea magamba; katika Kiswahili, nomino ya ngeli ya LI-YA kwa wingi huchukua 'yake,' huku 'katikati' ikidumisha maana ya nafasi baina yao.
