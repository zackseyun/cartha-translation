lexical_decisions:
- source_word: יַחְשֹׁב
  choice: Huiona
  rationale: Kitenzi hiki hapa kinaonyesha jinsi anavyoihesabu au kuichukulia metali; “huiona ... kama” ni Kiswahili cha kawaida kinachohifadhi maana ya tathmini.
- source_word: לְתֶבֶן
  choice: kama majani makavu
  rationale: תבן ni mabaki makavu ya nafaka, yaani majani; “majani makavu” huwasilisha picha ya kitu chepesi na dhaifu kwa msomaji wa kawaida.
- source_word: בַּרְזֶל
  choice: chuma
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali hii.
- source_word: לְעֵץ רִקָּבוֹן
  choice: kama mti uliooza
  rationale: Kirai hicho ni kihalisi “kama mti wa uozo”; “mti uliooza” ni usemi wa asili unaohifadhi picha ya udhaifu.
- source_word: נְחוּשָׁה
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba au aloi yake, bronzi. “Shaba” ni neno la kawaida na linaloeleweka kwa urahisi, huku tanbihi ikihifadhi uwezekano wa “bronzi”.
