  yaml_path: translation/ot/job/041/013.yaml
  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: sw
  text: 'Pumzi yake huwasha makaa[a],

    na mwali hutoka kinywani mwake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nafsi yake huwasha makaa,” au, “Koo lake huwasha makaa.” Nomino ya Kiebrania נֶפֶשׁ inaweza kumaanisha “nafsi,” “uhai,” “koo,” au, kutokana na muktadha huu, “pumzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: Pumzi yake
  rationale: Ingawa נֶפֶשׁ kwa kawaida inaweza kumaanisha ‘nafsi’ au ‘uhai,’ pia inaweza kurejelea koo au, katika muktadha huu wa kiumbo, pumzi. Sambamba na ‘kinywani mwake’ na taswira ya moto, ‘pumzi yake’ hutoa maana ya wazi kwa Kiswahili cha kawaida.
- source_word: גֶּחָלִים
  choice: makaa
  rationale: Neno hili humaanisha makaa au makaa yenye moto. ‘Makaa’ ni tafsiri fupi na ya kawaida; kitenzi chenyewe kinaonyesha kuwashwa.
- source_word: תְּלַהֵט
  choice: huwasha
  rationale: Muundo wa Piel una maana ya kusababisha kitu kiwake au kiwe na moto mkali. ‘Huwasha’ huhifadhi nguvu hiyo ya kisababishi kwa lugha ya asili na inayoeleweka.
- source_word: וְלַהַב
  choice: na mwali
  rationale: לַהַב ni nomino ya umoja yenye maana ya mwali wa moto. ‘Mwali’ huhifadhi taswira hiyo ya umoja kwa Kiswahili fasaha.
- source_word: מִפִּיו
  choice: kinywani mwake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kihusishi pamoja na nomino yenye kiambishi cha nafsi.
- source_word: יֵצֵא
  choice: hutoka
  rationale: Kitenzi kina maana ya kutoka. ‘Hutoka’ ni cha kawaida na kinaendana vizuri na ‘kinywani mwake.’
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Wakati wa sasa wa mazoea (‘huwasha,’ ‘hutoka’) unafaa kwa maelezo ya sifa ya kudumu ya kiumbe huyu.
