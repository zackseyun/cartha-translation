  text: Under him are sharp shards of pottery[b][a]; he spreads himself like a threshing sledge over the mud.
translation:
  language: sw
  text: Chini yake kuna vipande vya vyungu vyenye ncha kali[a]; hutandaza ubao wa kupuria juu ya matope.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vigae vyenye ncha kali.”
    reason: lexical_alternative
  - marker: b
    text: 'Inawezekana pia: “huyafanya matope kuwa kama ubao wa kupuria.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחְתָּיו
  choice: Chini yake
  rationale: Inahifadhi maana ya mahali kilicho chini ya Leviathani na ni Kiswahili cha kawaida.
- source_word: חַדּוּדֵי
  choice: ncha kali
  rationale: Muundo huu unaonyesha vitu vyenye makali au ncha kali bila kulainisha picha ya Kiebrania.
- source_word: חָרֶשׂ
  choice: vipande vya vyungu
  rationale: Katika muktadha huu neno linaashiria vipande vya vyombo vya udongo; usemi huu unaeleweka kwa urahisi kuliko istilahi adimu.
- source_word: יִרְפַּד
  choice: hujitandaza
  rationale: Kitenzi kinaweza kumaanisha kutandaza au kutengeneza tabaka la kulalia; kiwakilishi rejeshi kinafaa kwa taswira ya Leviathani mwenyewe kujilaza juu ya matope.
- source_word: חָרוּץ
  choice: ubao wa kupuria
  rationale: Neno linaelekea kutaja chombo chenye makali kilichotumiwa kupuria nafaka; tafsiri hii ni wazi na halisi katika Kiswahili.
- source_word: עֲלֵי
  choice: juu ya
  rationale: Inawakilisha kwa kawaida nafasi juu ya matope.
- source_word: טִיט
  choice: matope
  rationale: Ni neno la kawaida la Kiswahili kwa udongo wenye maji au tope na linadumisha picha halisi.
theological_decisions:
- issue: Uhusiano wa kisintaksia katika kishazi cha pili
  choice: hujitandaza kama ubao wa kupuria juu ya matope
  alternative: huyafanya matope kuwa kama ubao wa kupuria
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kama taswira inayomlinganisha Leviathani na chombo cha kupuria au kama kitendo kinachoyaacha matope yakiwa kama chombo hicho. Matini kuu inafuata ulinganisho unaoendana na kitenzi, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ubao wa kupuria” hutoa picha inayoeleweka ya chombo cha kale cha kupuria bila kutumia istilahi ya kitaalamu isiyojulikana sana.
