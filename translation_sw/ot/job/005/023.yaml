  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: sw
  text: Kwa maana utakuwa na agano na mawe ya shamba[a], na wanyama wa porini[b] watakuwa na amani nawe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe ya shambani.” Huenda usemi huu ukadokeza mawe yanayozuia shughuli za kilimo, lakini taswira ya Kiebrania imeachwa wazi katika maandishi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wanyama wa shamba”; katika msemo huu, maana yake ni wanyama wa porini.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “amefanya amani nawe” au “yuko katika amani nawe.” Kiebrania kinaeleza uhusiano wa amani kati ya mtu huyo na wanyama wa porini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na uhakikisho uliotangulia kwa kuonyesha msingi au maelezo yake.
- source_word: עִם אַבְנֵי הַשָּׂדֶה
  choice: na mawe ya shambani
  rationale: Kihusishi עִם kinaonyesha uhusiano wa agano, huku usemi halisi wa kishairi kuhusu mawe ukihifadhiwa bila kuufasiri kupita kiasi.
- source_word: בְרִיתֶךָ
  choice: utakuwa na agano
  rationale: Kiebrania hakina kitenzi wazi katika kishazi hiki; kitenzi hiki kilichoongezwa kwa Kiswahili huonyesha hali ya baadaye katika muktadha bila kubadili taswira ya agano.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: na wanyama wa porini
  rationale: Katika muunganiko huu חַיָּה huelekea kumaanisha wanyama wa mwituni; ‘wanyama wa porini’ ni lugha ya sasa, wazi na ya kawaida.
- source_word: הָשְׁלְמָה לָךְ
  choice: watakuwa na amani nawe
  rationale: Umbo la שׁלם linaeleza kufanya amani au kuwa katika uhusiano wa amani; tafsiri hii ni ya asili kwa Kiswahili na inahifadhi ulinganifu na agano.
