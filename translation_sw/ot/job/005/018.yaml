  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: sw
  text: Kwa maana yeye husababisha maumivu, lakini hufunga jeraha; huponda, lakini mkono wake huponya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, «mkono wake» ni umoja, lakini kitenzi «huponya» kina umbo la kike la wingi. Kiswahili hakiwezi kuonyesha kutolingana huku kwa njia ya asili; tafsiri nyingine hutumia «mikono yake huponya.»
    reason: textual_grammar
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha maelezo ya sababu yanayohusiana na kauli iliyotangulia, bila kufafanua kupita kiasi.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; “yeye” kinauhifadhi kwa Kiswahili cha kawaida.
- source_word: יַכְאִיב
  choice: husababisha maumivu
  rationale: Hifili ya כאב ina maana ya kusababisha maumivu au kuumiza; tafsiri hii ni ya moja kwa moja na haiingizi taswira mahususi ya kujeruhi.
- source_word: וְיֶחְבָּשׁ
  choice: lakini hufunga jeraha
  rationale: חבש hapa ni kufunga sehemu iliyojeruhiwa ili kuitibu. “Jeraha” linawekwa wazi kwa Kiswahili cha asili, na “lakini” linaonyesha ulinganifu wa kinyume katika ushairi.
- source_word: יִמְחַץ
  choice: yeye huponda
  rationale: מחץ huonyesha kupiga au kuponda kwa nguvu; “huponda” linahifadhi ukali wa picha bila kuibadili kuwa kitendo kingine.
- source_word: וְיָדוֹ
  choice: lakini mkono wake
  rationale: Nomino ya Kiebrania ni umoja, “mkono wake”; imehifadhiwa badala ya kulainishwa kuwa wingi.
- source_word: תִּרְפֶּינָה
  choice: huponya
  rationale: רפא kwa kawaida humaanisha kuponya. Kitenzi cha Kiebrania kina umbo la wingi licha ya nomino iliyotangulia kuwa umoja; Kiswahili hakiwezi kuonyesha kutolingana huko kwa njia ya asili, hivyo jambo hilo linaelezwa katika tanbihi.
theological_decisions:
- issue: Utendaji wa Mungu katika kusababisha maumivu na kuponya
  choice: Kumwonyesha Mungu moja kwa moja kuwa mtendaji wa maumivu, kuponda, kufunga jeraha na kuponya.
  alternative: Kulainisha kauli ya kwanza kuwa Mungu “huruhusu maumivu.”
  rationale: Kiebrania kinamhusisha Mungu moja kwa moja na matendo ya kuumiza na kurejesha. Tafsiri inahifadhi mvutano huu wa kiteolojia bila kuupunguza au kuutatua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari miwili sambamba imehifadhiwa kwa vitenzi vya mazoea ili kuwasilisha kauli ya jumla. Alama ya tanbihi [a] imewekwa mara tu baada ya kishazi kinachohusika.
