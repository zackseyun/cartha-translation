base_translation:
  language: en
  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: sw
  text: Kwa hiyo, maskini huwa na tumaini, nao udhalimu hufunga kinywa chake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu hufunga kinywa chake”; kwa maana ya karibu, “udhalimu hufumba kinywa chake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: huwa na
  rationale: Muundo huu unaonyesha matokeo ya maelezo yaliyotangulia na pia unatoa kauli yenye nguvu ya jumla; “Kwa hiyo” huhifadhi uhusiano wa kimantiki.
- source_word: לַדַּל
  choice: maskini
  rationale: דַּל humaanisha mtu maskini, dhaifu, au asiye na uwezo wa kijamii. “Maskini” ni neno la kawaida linalofaa muktadha huku likidokeza hali ya kuonewa.
- source_word: תִּקְוָה
  choice: tumaini
  rationale: Hili ndilo neno la kawaida na la asili kwa wazo la kutazamia mema au kupata matumaini.
- source_word: וְעֹלָתָה
  choice: udhalimu
  rationale: עַוְלָה huonyesha ukosefu wa haki au kutenda mabaya. “Udhalimu” unafaa muktadha wa kijamii na unatofautishwa na tumaini la maskini.
- source_word: קָפְצָה פִּיהָ
  choice: hufunga kinywa chake
  rationale: Tafsiri hii huhifadhi taswira hai ya Kiebrania ya udhalimu unaonyamazishwa, badala ya kuibadili kuwa maelezo yasiyo ya kitamathali.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ni rahisi kueleweka, huku uhuishaji wa “udhalimu” na taswira ya kufunga kinywa vikihifadhiwa.
