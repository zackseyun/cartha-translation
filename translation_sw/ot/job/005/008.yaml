  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: sw
  text: Lakini mimi, ningemtafuta Mungu, na kwa Mungu ningepeleka shauri langu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ningeliweka jambo langu mbele za Mungu.”
