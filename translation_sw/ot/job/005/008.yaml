lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: Lakini mimi
  rationale: Huonyesha mgeuko wa kulinganisha pamoja na msisitizo wa kiwakilishi huru; Kiswahili cha kawaida kinaweza kuhifadhi yote kwa ‘Lakini mimi’.
- source_word: אֶדְרֹשׁ
  choice: ningemtafuta
  rationale: Kitenzi דרשׁ hapa kina maana ya kumgeukia Mungu ili kumwomba au kutafuta msaada wake. Hali ya masharti ‘ninge-’ inafaa ushauri wa Elifazi.
- source_word: אֶל אֵל
  choice: ningemtafuta Mungu
  rationale: Kihusishi cha mwelekeo kinaingizwa kwa kawaida katika kitenzi cha Kiswahili ‘kumtafuta’; אֵל limetafsiriwa ‘Mungu’ bila kuongeza maana isiyodaiwa na muktadha.
- source_word: וְאֶל אֱלֹהִים
  choice: na mbele za Mungu
  rationale: Kirai kinaonyesha kuelekeza shauri kwa Mungu. ‘Mbele za Mungu’ ni usemi wa kawaida unaoendana na kitendo cha kuweka jambo ili lishughulikiwe.
- source_word: אָשִׂים
  choice: ningeweka
  rationale: שׂים kimsingi ni ‘kuweka’; hapa linamaanisha kuliwasilisha jambo kwa Mungu. ‘Ningeweka’ huhifadhi picha ya asili kwa Kiswahili kinachoeleweka.
- source_word: דִּבְרָתִי
  choice: shauri langu
  rationale: Neno hili linaweza kumaanisha jambo, dai, au kesi inayowasilishwa. ‘Shauri langu’ huhifadhi maana pana ya jambo linalowekwa mbele ya mwamuzi bila kulifanya lazima kuwa malalamiko.
theological_decisions:
- issue: Majina ya Mungu אֵל na אֱלֹהִים katika usambamba
  choice: Yote yametafsiriwa ‘Mungu’
  alternative: Kutofautisha kwa ‘Mungu Mwenye nguvu’ na ‘Mungu’ au kuacha ‘Eli’ na ‘Mungu’
  rationale: Usambamba wa kishairi unaelekeza kwa mhusika yuleyule, wala maandishi hayalazimishi tofauti ya kiteolojia kati ya majina hayo hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa vishazi viwili sambamba; ‘shauri langu’ ni wa kawaida lakini pia una uzito unaofaa muktadha wa kumpelekea Mungu jambo.
