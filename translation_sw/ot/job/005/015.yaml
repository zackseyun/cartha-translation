  text: וַ/יֹּ֣שַׁע מֵ֭/חֶרֶב מִ/פִּי/הֶ֑ם וּ/מִ/יַּ֖ד חָזָ֣ק אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: sw
  text: Lakini humwokoa mhitaji kutokana na upanga wa kinywa chao[a], na kutoka mkononi mwa mwenye nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humwokoa mhitaji kutoka kwa upanga, kutoka kinywani mwao, na kutoka mkononi mwa mwenye nguvu.” Maneno ya Kiebrania yamebanwa; wengine hutenganisha “kutoka kinywani mwao” badala ya kuelewa “upanga wa kinywa chao.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: humwokoa
  rationale: Kitenzi ישׁע kina maana ya kuokoa au kukomboa. Ingawa umbo hili la Kiebrania linaweza kutafsiriwa kwa wakati uliopita, wakati wa sasa wa mazoea unafaa kwa usemi huu wa kishairi unaoeleza jinsi Mungu atendavyo.
- source_word: מֵחֶרֶב
  choice: kutokana na upanga
  rationale: חֶרֶב ni ‘upanga,’ na kiambishi מִן kinaonyesha kuondolewa au kuokolewa kutoka katika hatari hiyo.
- source_word: מִפִּיהֶם
  choice: wa kinywa chao
  rationale: Kihalisi ni ‘kutoka kinywani mwao,’ lakini muunganiko wake uliobanwa na מֵחֶרֶב unaweza kueleweka kuwa ‘upanga wa kinywa chao,’ picha ya maneno yenye kuumiza au kuangamiza. Umoja wa ‘kinywa’ pamoja na kiwakilishi cha wingi umehifadhiwa.
- source_word: וּמִיַּד
  choice: na kutoka mkononi mwa
  rationale: יָד maana yake ya msingi ni ‘mkono,’ ingawa pia huashiria mamlaka au nguvu. Picha halisi ya mkono imehifadhiwa.
- source_word: חָזָק
  choice: mwenye nguvu
  rationale: Kivumishi hiki kimetumiwa kama nomino kumaanisha mtu mwenye nguvu au mamlaka.
- source_word: אֶבְיוֹן
  choice: mhitaji
  rationale: אֶבְיוֹן humaanisha mtu maskini au mwenye mahitaji. ‘Mhitaji’ huhifadhi wazo pana la udhaifu wa kiuchumi na kijamii.
theological_decisions:
- issue: Maana ya sitiari ‘upanga wa kinywa chao’
  choice: Sitiari ya maneno yenye nguvu ya kuharibu imehifadhiwa bila kuibadili kuwa maelezo ya moja kwa moja.
  alternative: Kutenganisha virai kuwa ‘kutoka kwa upanga, kutoka kinywani mwao.’
  rationale: Kiebrania kinaweka ‘upanga’ na ‘kinywa chao’ pamoja kwa namna fupi na yenye utata. Tafsiri kuu inadumisha picha ya kishairi, huku tanbihi ikihifadhi uwezekano wa kusoma virai hivyo tofauti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. ‘Upanga wa kinywa chao’ umeachwa kama picha ya kishairi, na ‘mkononi mwa’ ni usemi wa kawaida unaoweza kumaanisha kuwa chini ya uwezo wa mtu.
