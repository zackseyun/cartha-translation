  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: sw
  text: Utajua kwamba uzao wako[a] ni mwingi, na wazao wako ni kama nyasi za ardhi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbegu yako”; neno la Kiebrania זַרְעֶךָ ni jina la mkusanyo linalomaanisha kizazi au watoto wa mtu.
    reason: lexical_alternative
  - marker: b
    text: Au “nyasi za nchi.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “ardhi,” “dunia,” au “nchi,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Utajua
  rationale: Kitenzi cha Kiebrania katika muktadha huu wa kishairi kina maana ya wakati ujao na uhakikisho. “Utajua” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo bila kulazimisha kiunganishi cha mwanzo.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי kinaanzisha jambo litakalojulikana, si sababu; kwa hiyo “kwamba” kinaonyesha uhusiano wa kisintaksia kwa uwazi.
- source_word: רַב
  choice: ni mwingi
  rationale: Kivumishi hiki kinaonyesha wingi wa זֶרַע, ambalo ni jina la mkusanyo. “Ni mwingi” linapatana na umoja wa kisarufi wa “uzao” huku likitoa maana ya idadi kubwa.
- source_word: זַרְעֶךָ
  choice: uzao wako
  rationale: Katika muktadha wa kifamilia, זֶרַע linamaanisha watoto au kizazi cha mtu kwa pamoja. “Uzao wako” ni la asili na huhifadhi maana hiyo ya mkusanyo; maana halisi ya “mbegu” imeonyeshwa katika tanbihi.
- source_word: וְצֶאֱצָאֶיךָ
  choice: na wazao wako
  rationale: Neno hili linarejelea wale wanaotokana na mtu, yaani vizazi vyake. “Wazao wako” ni wazi na huhifadhi usambamba na “uzao wako.”
- source_word: כְּעֵשֶׂב
  choice: kama majani
  rationale: עֵשֶׂב hapa ni mimea au majani yanayotumiwa kama mfano wa wingi. “Kama majani” ni tashbihi ya kawaida na inayoeleweka katika Kiswahili.
- source_word: הָאָרֶץ
  choice: ya ardhi
  rationale: אֶרֶץ linaweza kumaanisha dunia, ardhi, au nchi. “Ardhi” linafaa kwa taswira ya majani yanayoota na halifanyi rejeo kuwa eneo maalumu; uwezekano wa “nchi” umehifadhiwa katika tanbihi.
