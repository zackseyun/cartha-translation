  text: בְּ/שׁ֣וֹט לָ֭שׁוֹן תֵּחָבֵ֑א וְֽ/לֹא תִירָ֥א מִ֝/שֹּׁ֗ד כִּ֣י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/021.yaml
  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: sw
  text: Utafichwa mbali na mjeledi wa ulimi[a], wala hutaogopa maangamizi[b] yatakapokuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mjeledi wa ulimi,” ni sitiari ya maneno ya kuumiza au ya kashfa.
    reason: lexical_alternative
  - marker: b
    text: Au “uharibifu” au “maafa” badala ya “maangamizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט
  choice: mbali na mjeledi
  rationale: שׁוֹט ni mjeledi au kiboko. Pamoja na kitenzi cha kufichwa, “mbali na mjeledi” huonyesha kulindwa huku ikidumisha picha halisi ya shambulio.
- source_word: לָשׁוֹן
  choice: wa ulimi
  rationale: לָשׁוֹן ni “ulimi,” unaowakilisha maneno au usemi. Kutaja ulimi kunahifadhi sitiari ya Kiebrania badala ya kuibadili moja kwa moja kuwa “maneno ya kashfa.”
- source_word: תֵּחָבֵא
  choice: utafichwa
  rationale: Nifali ya חבא ina maana ya kufichwa au kuwekwa mahali pasipoonekana. “Utafichwa” inafuata kauli tendwa ya chanzo bila kufafanua kupita kiasi namna ya ulinzi.
- source_word: וְלֹא תִירָא
  choice: wala hutaogopa
  rationale: Hili linadumisha ukanushi na uhakikisho wa wakati ujao wa kitenzi cha Kiebrania; “wala” huunganisha kwa kawaida sehemu mbili za mstari huu.
- source_word: מִשֹּׁד
  choice: maangamizi
  rationale: שֹׁד hueleza uharibifu mkali, ukiwa mara nyingi wa ghafla au wa kikatili. “Maangamizi” yanawasilisha uzito huo kwa Kiswahili cha kawaida.
- source_word: כִּי יָבֹוא
  choice: yatakapokuja
  rationale: 'כִּי inaeleweka hapa kwa maana ya wakati: maangamizi yatakapofika. Upatanisho wa kisarufi “yatakapokuja” unaendana na nomino “maangamizi.”'
