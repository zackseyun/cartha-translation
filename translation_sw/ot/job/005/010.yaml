    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: anayenyesha
  rationale: Kitenzi kishirikishi cha Kiebrania kinaendeleza maelezo kuhusu Mungu. Katika muktadha wa מָטָר, Kiswahili cha kawaida husema ‘kunyesha mvua’; umbo ‘anayenyesha’ linadumisha nguvu ya kishazi cha uhusiano.
- source_word: מָטָר
  choice: mvua
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la mvua.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: juu ya uso wa dunia
  rationale: ‘Uso’ unahifadhi taswira ya Kiebrania, na ‘dunia’ inafaa kwa kauli hii ya jumla kuhusu utunzaji wa Mungu.
- source_word: וְשֹׁלֵחַ
  choice: na kupeleka
  rationale: Kitenzi hiki kiko sambamba na הַנֹּתֵן. ‘Kupeleka’ huonyesha maji yakielekezwa au kusambazwa bila kulazimisha maana isiyo katika matini.
- source_word: מַיִם
  choice: maji
  rationale: מַיִם hutafsiriwa kwa kawaida kwa nomino ya Kiswahili ‘maji’.
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: kwenye maeneo ya wazi
  rationale: חוּצוֹת linaweza kumaanisha sehemu zilizo wazi, maeneo ya nje, au barabara. Muktadha wa mvua unapendelea maeneo ya wazi; Kiswahili hiki ni cha asili kuliko tafsiri halisi ya ‘juu ya uso wa’ katika mshororo huu wa pili.
theological_decisions:
- issue: Upeo wa אָרֶץ
  choice: dunia
  alternative: nchi
  rationale: Kauli inaeleza kwa upana utunzaji wa Mungu kupitia mvua na maji, wala haitaji eneo fulani. Hata hivyo, maana ya ‘nchi’ inabaki kuwa uwezekano halisi wa kileksika na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mshororo wa kwanza unahifadhi taswira ya ‘uso wa dunia’; wa pili umetolewa kwa usemi wa asili zaidi ili kuepuka tungo nzito ya ‘uso wa maeneo.’ Herufi ndogo mwanzoni na koma mwishoni zinaonyesha kuwa mstari unaendeleza sentensi ya muktadha mpana.
