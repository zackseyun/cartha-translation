translation:
  language: sw
  text: Tazama, jambo hili tumelichunguza; ndivyo lilivyo. Lisikie, nawe ulijue mwenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Nahau ya kuvuta usikivu wa msikilizaji, ikihifadhi msisitizo wa Kiebrania.
- source_word: זֹאת חֲקַרְנוּהָ
  choice: jambo hili tumelichunguza
  rationale: Kitenzi חקר kina maana ya kuchunguza kwa makini; kiwakilishi cha kitu kimewasilishwa kwa ‘jambo hili’ kwa Kiswahili cha kawaida.
- source_word: כֶּן הִיא
  choice: nasi tumegundua kuwa ni kweli
  rationale: Kirai kinathibitisha kuwa matokeo ya uchunguzi yako hivyo kweli; ‘tumegundua’ huunganisha uthibitisho huo kwa kawaida na uchunguzi uliotajwa.
- source_word: שְׁמָעֶנָּה
  choice: Lisikilize
  rationale: Umbo la amri lenye kiambishi cha kitu cha kike linarejelea jambo lililotangulia.
- source_word: וְאַתָּה דַע לָךְ
  choice: nawe ulijue kwa ajili yako mwenyewe
  rationale: Kiwakilishi cha wazi ‘wewe’ kimehifadhiwa kwa ‘nawe’; לָךְ inaleta wazo la kulifahamu kwa manufaa au matumizi ya mhusika mwenyewe.
theological_decisions:
- issue: Kauli ni ya Elifazi ndani ya mazungumzo ya Ayubu
  choice: Imetafsiriwa kama dai thabiti la msemaji bila kulifanya moja kwa moja kuwa uthibitisho wa msimulizi au wa Mungu.
  alternative: Kulainisha kuwa ‘tunaamini ni kweli’ au kuifanya kuwa tamko lisilo na masharti la ukweli wa Mungu.
  rationale: Chanzo kinasema כֶּן הִיא kwa uthabiti, lakini muktadha wa kitabu unahitaji kutofautisha madai ya wahusika na uamuzi wa mwisho wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri na msisitizo wa ‘nawe’ umehifadhiwa bila kufanya sentensi kuwa nzito.
