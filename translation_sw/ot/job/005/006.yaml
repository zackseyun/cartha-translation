  text: כִּ֤י לֹא יֵצֵ֣א מֵ/עָפָ֣ר אָ֑וֶן וּ֝/מֵ/אֲדָמָ֗ה לֹא יִצְמַ֥ח עָמָֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: sw
  text: Kwa maana taabu haitoki mavumbini[a], wala shida haichipuki ardhini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu hautoki mavumbini, wala mateso hayachipuki ardhini.” Maneno ya Kiebrania yanaweza pia kumaanisha uovu wa kimaadili, msiba, kazi ngumu, au mateso.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huunganisha kauli hii na hoja iliyotangulia kwa namna ya maelezo, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יֵצֵא
  choice: haitoki
  rationale: Kitenzi kina maana ya kutoka au kujitokeza; pamoja na kihusishi cha chanzo, “haitoki” ni cha asili katika Kiswahili.
- source_word: מֵעָפָר
  choice: mavumbini
  rationale: עָפָר ni mavumbi; umbo la mahali “mavumbini” linaonyesha chanzo kinachokanushwa na kuhifadhi picha ya kishairi.
- source_word: אָוֶן
  choice: taabu
  rationale: Neno hili linaweza kumaanisha uovu, madhara, au taabu. Katika muktadha wa Ayubu na sambamba yake עָמָל, “taabu” hudumisha maana ya mateso bila kuifanya iwe dhambi moja kwa moja.
- source_word: וּמֵאֲדָמָה
  choice: wala ... ardhini
  rationale: אֲדָמָה ni ardhi au udongo. “Ardhini” ni ya kawaida na inafaa picha ya kitu kinachochipuka.
- source_word: יִצְמַח
  choice: haichipuki
  rationale: צמח ni kitenzi cha mimea kuota au kuchipuka; “haichipuki” huhifadhi sitiari ya ukuaji kutoka ardhini.
- source_word: עָמָל
  choice: shida
  rationale: עָמָל inaweza kumaanisha kazi ngumu, taabu, au mateso. “Shida” inalingana kishairi na “taabu” na haisisitizi kazi ya mikono pekee.
theological_decisions:
- issue: Maana ya אָוֶן na עָמָל katika kauli ya Elifazi
  choice: Aya inazungumzia taabu na shida ambazo hazijitokezi tu zenyewe kutoka ardhini.
  alternative: Aya inaweza kueleweka kuwa uovu na mateso havitoki mavumbini, au kuwa dhiki na kazi ngumu hazichipuki ardhini.
  rationale: Muktadha unahusu mateso ya binadamu, lakini maneno yote mawili yana wigo mpana wa kimaadili na wa maafa. Tafsiri kuu haitoi madai yenye nguvu kuliko maandishi, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa kishairi na picha ya kilimo umehifadhiwa kwa “mavumbini / ardhini” na “haitoki / haichipuki.”
