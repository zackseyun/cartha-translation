  text: לָ/שׂ֣וּם שְׁפָלִ֣ים לְ/מָר֑וֹם וְ֝/קֹדְרִ֗ים שָׂ֣גְבוּ יֶֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/011.yaml
  text: to set the lowly on high[b][a], and those who mourn are lifted up to salvation.
translation:
  language: sw
  text: 'ili kuwaweka wanyonge juu,

    na wenye huzuni[a] huinuliwa wapate wokovu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliotiwa giza” au “waombolezao”; umbo la Kiebrania linaeleza majonzi kwa taswira ya giza.
    reason: lexical_alternative
  - marker: b
    text: Au, “ukombozi” au “usalama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: kuwaweka
  rationale: Kitenzi hiki cha kutendea kinaonyesha kusudi au matokeo yanayohusiana na muktadha uliotangulia. ‘Kuwaweka’ ni cha kawaida na kinahifadhi nguvu ya kitenzi bila kuongeza ufafanuzi.
- source_word: שְׁפָלִים
  choice: walio chini
  rationale: Neno linaweza kumaanisha watu wa hali ya chini, walioshushwa, au wanyenyekevu. ‘Walio chini’ linahifadhi upana wa hali ya kijamii na ya maisha bila kulifanya hasa sifa ya kiadili.
- source_word: לְמָרוֹם
  choice: mahali pa juu
  rationale: מָרוֹם huonyesha kimo au mahali pa juu. Tafsiri hii inadumisha taswira ya kuinuliwa na tofauti yake na ‘walio chini.’
- source_word: וְקֹדְרִים
  choice: wale wanaoomboleza
  rationale: Kitenzi קדר kinaweza kuhusisha kuwa na giza, huzuni, au maombolezo. ‘Wanaoomboleza’ ni Kiswahili cha asili kinachoeleza hali ya huzuni huku tanbihi ikihifadhi taswira ya kutiwa giza.
- source_word: שָׂגְבוּ
  choice: huinuliwa
  rationale: Kitenzi kina maana ya kuwa juu, salama pasipofikika, au kutukuzwa. ‘Huinuliwa’ kinadumisha ulinganifu na kuwekwa mahali pa juu na kuwasilisha matokeo bila kulazimisha maana moja tu.
- source_word: יֶשַׁע
  choice: wokovu
  rationale: Neno lina wigo wa wokovu, ukombozi, na usalama. ‘Wokovu’ linahifadhi uzito na upana wake, huku muktadha ukiruhusu pia uokozi wa hali halisi.
theological_decisions:
- issue: Tafsiri ya יֶשַׁע katika muktadha wa fasihi ya hekima
  choice: wokovu
  alternative: ukombozi au usalama
  rationale: ‘Wokovu’ linahifadhi wigo mpana wa neno la Kiebrania bila kuingiza kwa lazima mafundisho ya baadaye; katika muktadha huu linaweza kueleweka pia kama kuokolewa kutoka taabani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unahifadhi usambamba wa kishairi wa Kiebrania. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
