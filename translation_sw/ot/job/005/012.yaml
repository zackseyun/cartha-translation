  text: מֵ֭פֵר מַחְשְׁב֣וֹת עֲרוּמִ֑ים וְֽ/לֹא תַעֲשֶׂ֥ינָה יְ֝דֵי/הֶ֗ם תּוּשִׁיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/012.yaml
  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: sw
  text: Yeye huyabatilisha mipango ya wenye hila, ili mikono yao isifanikiwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: huyabatilisha
  rationale: Kitenzi hiki kina maana ya kuvunja, kuzuia, au kufanya jambo lisitimie; “huyabatilisha” huonyesha kwamba Mungu hufanya mipango hiyo ishindwe kutekelezeka.
- source_word: מַחְשְׁבוֹת
  choice: mipango
  rationale: Katika muktadha huu neno hilo linahusu mawazo yaliyokusudiwa kutekelezwa, hivyo “mipango” ni ya kawaida na wazi.
- source_word: עֲרוּמִים
  choice: wenye hila
  rationale: Neno linaweza kumaanisha wenye ujanja au werevu; hapa lina maana hasi ya watu wanaotumia ujanja kwa hila.
- source_word: יְדֵיהֶם
  choice: mikono yao
  rationale: Taswira halisi ya mikono imehifadhiwa kama ishara ya matendo na utekelezaji wao.
- source_word: תּוּשִׁיָּה
  choice: kufanikiwa
  rationale: Neno lina wigo mpana unaoweza kujumuisha mafanikio, matokeo yenye nguvu, au jambo thabiti; katika muundo huu maana ya kutopata mafanikio ndiyo inayofaa zaidi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mhusika wa kitenzi hajatajwa wazi ndani ya mstari huu.
  choice: Yeye
  alternative: Mungu
  rationale: Kiwakilishi hudumisha mshikamano na mistari inayotangulia bila kuongeza jina ambalo halipo wazi katika mstari huu.
- issue: Maana ya תּוּשִׁיָּה ina uwezekano wa kutafsiriwa kwa njia kadhaa.
  choice: isifanikiwe
  alternative: isitimize jambo lenye manufaa
  rationale: Chaguo hili linafikisha matokeo ya mipango kuzuiwa bila kuingiza hukumu ya ziada kuhusu ubora wa jambo linalotekelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi umehifadhiwa kwa sentensi yenye sehemu mbili, huku lugha ikibaki rahisi kueleweka.
