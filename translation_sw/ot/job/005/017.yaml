lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linadumisha kazi ya neno hili ya kuvuta fikira kwa tamko muhimu, katika mtindo wenye hadhi lakini unaoeleweka.
- source_word: אַשְׁרֵי
  choice: heri
  rationale: “Heri” ni kauli ya kawaida ya baraka katika Kiswahili na inaonyesha hali njema yenye kutamanika, si hisia ya furaha tu.
- source_word: אֱנוֹשׁ
  choice: mtu
  rationale: Neno la Kiebrania humaanisha mwanadamu au binadamu anayekufa; hapa ni umoja wa kijumla katika methali ya hekima. “Mtu” ni tafsiri ya asili na jumuishi katika Kiswahili.
- source_word: יוֹכִחֶנּוּ
  choice: Mungu humkaripia
  rationale: Hiphil ya יכח hapa ina maana ya kukaripia au kusahihisha kwa kusudi la kurekebisha. “Humkaripia” huhifadhi nguvu ya onyo bila kulifanya kuwa adhabu tu.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hii ndiyo tafsiri ya kawaida ya jina hili la Mungu katika muktadha wa Ayubu.
- source_word: מוּסַר
  choice: kuadibu
  rationale: Katika fasihi ya hekima, מוסר huhusisha mafunzo na marekebisho yanayojenga. “Kuadibu” hubeba wazo la nidhamu ya kurekebisha bila kulazimisha maana ya kuadhibu kwa kisasi.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Ni tafsiri ya kawaida na yenye maana ya cheo שַׁדַּי katika Kiswahili, hasa katika kitabu cha Ayubu.
- source_word: אַל תִּמְאָס
  choice: usidharau
  rationale: Kitenzi kinaonyesha kukataa kitu kwa kukiona hakifai au kwa dharau; “usidharau” huhifadhi nguvu hiyo ya kimaadili.
- source_word: וּ
  choice: basi
  rationale: Kiunganishi kinaunganisha hali ya heri na himizo linalofuata. “Basi” huonyesha matokeo ya kimantiki kwa Kiswahili cha asili bila kuongeza dai kali kupita muktadha.
theological_decisions:
- issue: Maana ya kijumla ya אֱנוֹשׁ
  choice: mtu
  alternative: mwanadamu; binadamu anayekufa
  rationale: Kauli hii ya hekima inamhusu mwanadamu yeyote. Kiswahili “mtu” hutoa maana hiyo ya kijumla bila kuingiza ubainishaji wa jinsia ambao si wa lazima katika sarufi ya Kiswahili.
- issue: Uhusiano kati ya kukaripia kwa Mungu na מוסר
  choice: humkaripia ... kuadibu
  alternative: humsahihisha ... mafunzo; humkemea ... nidhamu
  rationale: Maneno haya yanaonyesha marekebisho ya Mungu kuwa sehemu ya hali ya heri. Tafsiri inadumisha mvutano wa kitheolojia kwamba jambo lenye kuumiza linaweza kuwa la kujenga, bila kulifanya kwa lazima kuwa adhabu ya kisasi.
- issue: Cheo שַׁדַּי
  choice: Mwenyezi
  alternative: Shaddai
  rationale: Kutafsiri cheo hiki kunawasilisha maana yake kwa msomaji wa kawaida, huku tanbihi ikihifadhi umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa hekima ulio wa hadhi lakini wa kawaida. “Heri mtu” hudumisha umbo la kauli ya baraka; “kuadibu” limetumiwa kwa maana ya marekebisho yanayojenga, si adhabu ya kisasi tu.
