  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּ/שֵׁ֣שׁ צָ֭רוֹת יַצִּילֶ֑/ךָּ וּ/בְ/שֶׁ֓בַע לֹא יִגַּ֖ע בְּ/ךָ֣ רָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: sw
  text: Katika taabu sita atakuokoa; hata katika saba[a], hakuna jambo baya litakalokugusa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Msemo wa kishairi wa Kiebrania, “sita ... saba,” unaonyesha kuokolewa tena na tena au kikamilifu; si lazima umaanishe kikomo halisi cha taabu saba tu.
    reason: cultural_note
  - marker: b
    text: Au, “hakuna madhara yatakayokugusa,” au “hakuna maafa yatakayokufikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֵׁשׁ
  choice: katika ... sita
  rationale: Kihusishi ב pamoja na namba kinaonyesha mazingira au idadi ya taabu. “Katika” ni ya asili katika Kiswahili na inadumisha muundo wa msemo wa kishairi.
- source_word: צָרוֹת
  choice: taabu
  rationale: Neno hili hurejelea hali za dhiki, shida, au matatizo. “Taabu” ni pana, ya kawaida, na inafaa sajili ya kishairi bila kuifanya iwe mateso ya kimwili pekee.
- source_word: יַצִּילֶךָּ
  choice: atakuokoa
  rationale: Kitenzi cha Hiphil cha נצל humaanisha kuokoa au kukomboa kutoka hatarini. “Atakuokoa” ni usemi wa kawaida na wenye hadhi unaohifadhi wazo la kuondolewa katika hatari.
- source_word: וּבְשֶׁבַע
  choice: hata katika saba
  rationale: Muundo wa namba “sita ... saba” ni usambamba wa kishairi unaoongeza mkazo. “Hata katika saba” huonyesha kilele hicho huku ikihifadhi namba za Kiebrania.
- source_word: לֹא יִגַּע
  choice: litakalokugusa
  rationale: נגע inaweza kumaanisha kugusa, kufikia, au kupiga. “Kugusa” huhifadhi taswira ya chanzo na kuruhusu maana pana ya jambo baya au madhara.
- source_word: בְּךָ
  choice: -ku-
  rationale: Kihusishi cha Kiebrania humtambulisha mtu anayeathiriwa. Katika Kiswahili huwakilishwa kwa kawaida na kiambishi-yambwa “-ku-” katika “litakalokugusa.”
- source_word: רָע
  choice: jambo baya
  rationale: רָע inaweza kumaanisha uovu, madhara, au maafa kulingana na muktadha. “Jambo baya” huhifadhi upana wake na, katika muktadha wa kuokolewa kutoka taabuni, linaelekea kwa ubaya unaompata mtu bila kulifunga kwa maadili pekee.
theological_decisions:
- issue: Mrejelewa wa kiima kisichotajwa wazi katika “atakuokoa”
  choice: Kitenzi “atakuokoa” kinaachwa bila kuongeza nomino “Mungu.”
  alternative: “Mungu atakuokoa”
  rationale: Muktadha unaonyesha kuwa kiima ni Mungu, lakini mstari wa Kiebrania una kitenzi cha nafsi ya tatu umoja bila kumtaja wazi hapa. Muundo wa Kiswahili unahifadhi hali hiyo bila kuongeza jina lisilomo katika mstari.
- issue: Maana ya fomula ya namba “sita ... saba”
  choice: Namba zimehifadhiwa kama msemo wa kishairi unaodokeza ukombozi unaorudiwa au ulio kamili.
  alternative: Kuzichukulia kama kikomo halisi cha taabu saba tu
  rationale: Tafsiri kuu inadumisha usambamba wa namba na kutumia “hata” kuonyesha ongezeko la mkazo, bila kuufanya msemo kuwa ufafanuzi wa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Usambamba mfupi wa kishairi umehifadhiwa; neno “hata” linaonyesha kilele cha “sita ... saba” bila kufuta utata wa msemo.
