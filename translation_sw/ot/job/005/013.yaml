  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: sw
  text: Huwakamata wenye hekima kwa hila zao,[a] na shauri la wadanganyifu[b] huharakishwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ujanja wao.” Neno la Kiebrania laweza kumaanisha busara katika miktadha mingine, lakini hapa lina maana hasi.
    reason: lexical_alternative
  - marker: b
    text: Au “wenye hila” au “waliopotoka.” Kiebrania kina picha ya watu waliopindika au wenye njia za hila.
    reason: lexical_alternative
  - marker: c
    text: Au “hupelekwa kwa pupa” au “huondoshwa haraka.” Maana yake inaweza kuwa kwamba shauri lao linasukumwa kwa haraka kuelekea kushindwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: huwakamata
  rationale: Kauli ya kushiriki ya Qal inafanya kazi kama kitenzi chenye Mungu kama kiima kinachoeleweka kutokana na muktadha; wakati wa mazoea unaonyesha tendo lake kwa ujumla na kudumisha picha ya kunaswa.
- source_word: חֲכָמִים
  choice: wenye hekima
  rationale: Kivumishi cha wingi kimetumiwa kama nomino; tafsiri hii huhifadhi kejeli kwamba wale wanaodhaniwa kuwa na hekima ndio wanaokamatwa.
- source_word: בְּעָרְמָם
  choice: kwa hila zao
  rationale: Ingawa עָרְמָה inaweza kumaanisha busara katika miktadha mingine, hapa ulinganifu unaipa maana hasi ya ujanja wa kudanganya.
- source_word: וַעֲצַת
  choice: na shauri la
  rationale: עֵצָה yaweza kuwa shauri, mpango, au ushauri; 'shauri' linafaa katika muktadha wa hekima na linaacha upana wa maana.
- source_word: נִפְתָּלִים
  choice: wapotovu
  rationale: Neno kutoka פתל hubeba picha ya kupindika na maana ya kimaadili ya kuwa mkaidi au mdanganyifu; 'wapotovu' ni ya asili na yenye heshima katika Kiswahili.
- source_word: נִמְהָרָה
  choice: huharakishwa
  rationale: Niphal ya umoja wa kike inapatana na 'shauri' na kuonyesha kwamba shauri hilo linasukumwa kwa haraka; tafsiri haiongezi wazi wazo la kuangamia ambalo limedokezwa tu na muktadha.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha לֹכֵד
  choice: Kiima cha Mungu kinaendelezwa kwa kitenzi cha Kiswahili bila kutaja kiwakilishi wazi.
  alternative: Kutaja wazi, 'Yeye huwakamata,' au kutumia kiima kisichojulikana.
  rationale: Muktadha wa Ayubu 5:9–16 unamtaja Mungu kama mtendaji. Kiswahili huruhusu kiima hicho kubebwa na kiambishi 'hu-' bila kuongeza jina au kiwakilishi kisichopo katika mstari.
- issue: Nguvu ya kimaadili ya עָרְמָה na נִפְתָּלִים
  choice: 'Maneno yametafsiriwa kwa maana hasi: ''hila'' na ''wapotovu.'''
  alternative: Maana isiyo hasi sana kama 'busara' na 'waliopindika.'
  rationale: Ulinganifu na muktadha wa mipango inayobatilishwa unaonyesha ujanja wenye lawama na upotovu, si busara isiyo na upande.
- issue: Maana ya נִמְהָרָה
  choice: '''huharakishwa'' huhifadhi hali ya kutendwa na wazo la mwendo wa haraka.'
  alternative: '''hupelekwa kwa pupa'' au ''hufikishwa upesi kwenye kushindwa.'''
  rationale: Kiebrania kinasema kuharakishwa lakini hakitaji moja kwa moja matokeo; tafsiri kuu inaacha mvutano huo bila kuongeza kushindwa waziwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama ushairi wa hekima; alama za tanbihi zimewekwa karibu na maneno husika kwa mpangilio wa kawaida.
