  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: sw
  text: Ita sasa—je, yuko yeyote atakayekujibu? Na utamgeukia nani miongoni mwa watakatifu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viumbe watakatifu.” Neno la Kiebrania linalotafsiriwa “watakatifu” huenda hapa linamaanisha viumbe wa mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא
  choice: Piga kelele
  rationale: Kauli ya amri ya קרא hapa ni changamoto ya Elifazi kwa Ayubu. “Piga kelele” ni usemi wa kawaida wa Kiswahili unaoonyesha kumwita mtu kwa sauti bila kuongeza dhana ya ibada.
- source_word: נָא
  choice: sasa
  rationale: Chembe hii huongeza msisitizo au uharaka; katika mabishano haya, “sasa” inafaa kuliko “tafadhali,” ambalo lingesikika kama ombi la heshima.
- source_word: הֲיֵשׁ
  choice: je, yuko yeyote
  rationale: Muundo wa swali pamoja na kitenzi cha kuwapo unaanzisha swali la balagha. Kiswahili cha asili hutumia “je, yuko yeyote” kwa mtu anayetarajiwa kujibu.
- source_word: עוֹנֶךָ
  choice: atakayekujibu
  rationale: Umbo la ענה lina maana ya mtu anayekujibu; wakati ujao katika Kiswahili unatoa kwa kawaida nguvu ya swali hili la balagha.
- source_word: וְאֶל־מִי
  choice: Na ... yupi
  rationale: Huu unaanzisha swali la pili na kuomba uchaguzi kutoka katika kundi linalofuata.
- source_word: מִקְּדֹשִׁים
  choice: kati ya watakatifu
  rationale: Wingi wa קדושׁ umetumiwa kama nomino. “Watakatifu” ni tafsiri ya moja kwa moja na yenye upeo mpana; rejeo linalowezekana kwa viumbe wa mbinguni linaelezwa katika tanbihi bila kuingizwa kimya katika maandishi.
- source_word: תִּפְנֶה
  choice: utamgeukia
  rationale: Kitenzi פנה kimsingi ni kugeukia mtu. Tafsiri hii inadumisha sitiari na katika muktadha hudokeza kumwendea mtu ili kupata msaada.
theological_decisions:
- issue: Utambulisho wa מִקְּדֹשִׁים (“watakatifu”)
  choice: Neno pana “watakatifu” limehifadhiwa katika maandishi, huku uwezekano wa kuwa viumbe watakatifu wa mbinguni ukielezwa katika tanbihi.
  alternative: “viumbe watakatifu” au “malaika”
  rationale: Muktadha wa kitabu cha Ayubu unaelekea kwa viumbe wa mbinguni, lakini neno la Kiebrania lenyewe halisemi wazi “malaika.” Kutaja “watakatifu” huhifadhi upeo wa neno na huepuka kuingiza mafundisho ya baadaye kuhusu waumini waliokufa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mistari miwili ya maswali ya balagha na sitiari ya “kugeukia” imehifadhiwa.
