  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
translation:
  language: sw
  text: Mchana wanakumbana na giza, na adhuhuri wanapapasa kana kwamba ni usiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama usiku” au “kama wakati wa usiku.” Kiebrania kina kiambishi cha ulinganisho kwenye neno “usiku,” kikionyesha kwamba wanapapasa adhuhuri kana kwamba ni usiku.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: Mchana
  rationale: Ni matumizi ya kielezi yenye maana ya “wakati wa mchana”; neno hili ni la kawaida na linadumisha utofauti na usiku.
- source_word: יְפַגְּשׁוּ
  choice: hukumbana na
  rationale: Kitenzi פגשׁ humaanisha kukutana au kukumbana na kitu; “hukumbana na” huonyesha wazi kuwa giza ndilo wanalolipata.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hili ndilo neno la kawaida kwa חשך na linahifadhi uwezekano wa maana halisi na ya kimfano.
- source_word: וְכַלַּיְלָה
  choice: kana kwamba ni usiku
  rationale: Kiambishi כ־ kinaonyesha ulinganisho; usemi huu wa Kiswahili unawasilisha picha ya kupapasa adhuhuri kana kwamba hali ni ya usiku.
- source_word: יְמַשְׁשׁוּ
  choice: hupapasa
  rationale: משׁשׁ ni kutafuta njia kwa kugusa-gusa gizani; “hupapasa” ni fasiri fupi, sahihi, na ya kawaida.
- source_word: בַצָּהֳרָיִם
  choice: adhuhuri
  rationale: Neno hili hurejelea wakati wa katikati ya mchana na kudumisha kinaya cha kupapasa wakati wenye mwanga mwingi.
