  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa tanbihi umesahihishwa ili tanbihi ya maana mbadala ifuate “usalama,” na maelezo ya kitamaduni yafuate “langoni.”
