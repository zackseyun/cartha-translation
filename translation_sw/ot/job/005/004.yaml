  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: sw
  text: Watoto wake wako mbali na usalama[a]; wanapondwa langoni[b], wala hakuna wa kuwaokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wako mbali na ukombozi” au “wako mbali na wokovu.”
    reason: lexical_alternative
  - marker: b
    text: “Langoni” humaanisha kwenye lango la mji, mahali ambapo kwa kawaida hukumu za kisheria na maamuzi ya umma yalifanywa.
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: wako mbali
  rationale: Kitenzi רחק kinaeleza hali ya kuwa mbali. Kauli “wako mbali” ni ya kawaida katika Kiswahili na inadumisha hali inayoelezwa na Kiebrania.
- source_word: בָנָיו
  choice: watoto wake
  rationale: בנים inaweza kumaanisha “wana” au “watoto.” Hapa inarejelea wazao kwa ujumla bila kusisitiza jinsia ya kiume, hivyo “watoto wake” ni wazi na ya asili.
- source_word: מִיֶּשַׁע
  choice: na usalama
  rationale: יֶשַׁע inaweza kumaanisha wokovu, ukombozi, msaada au usalama. Katika muktadha huu wa hatari ya kijamii na kisheria, “usalama” linafaa, huku maana mbadala zikihifadhiwa katika tanbihi.
- source_word: וְיִדַּכְּאוּ
  choice: wanapondwa
  rationale: דכא hubeba maana yenye nguvu ya kupondwa au kuvunjwa. “Wanapondwa” inadumisha nguvu na hali ya kutendewa ya kitenzi bila kuifafanua kimadhehebu.
- source_word: בַשַּׁעַר
  choice: langoni
  rationale: “Langoni” ni tafsiri fupi na ya asili ya בַשַּׁעַר. Katika ulimwengu wa kale, lango la mji lilikuwa mahali pa hukumu na maamuzi ya umma; jambo hilo linafafanuliwa katika tanbihi.
- source_word: וְאֵין מַצִּיל
  choice: wala hakuna wa kuwaokoa
  rationale: Muundo אֵין pamoja na participle מַצִּיל unaonyesha kwamba hakuna mtu anayewakomboa au kuwaokoa. Kauli hii ni ya asili katika Kiswahili na inadumisha nguvu ya tamko la Kiebrania.
