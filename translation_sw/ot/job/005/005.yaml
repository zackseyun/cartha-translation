  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: sw
  text: Mwenye njaa hula mavuno yake, naye huyachukua hata kutoka miongoni mwa miiba; wenye kiu huhema kwa hamu ya mali yao.[a]
  philosophy: optimal-equivalence
  footnotes:
