review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the explanatory כִּי, the destructive force of anger/vexation, and the negative emotional sense of קִנְאָה. However, translating פֹּתֶה as “mjinga” collapses its distinction from אֱוִיל (“mpumbavu”): the former is the naïve or easily persuaded person. “Humwangamiza” can imply ruin without necessarily expressing the explicit death-result of תָּמִית.'
  naturalness: The wording is fluent Standard East African Swahili. “Mtu asiye na busara” is a natural, non-stigmatizing way to express the wisdom-literature sense of the naïve person, and “humfisha” clearly expresses causation of death.
  terminology: “Hasira,” “mpumbavu,” and “wivu” are suitable in this proverbial register. The footnote’s “husuda” appropriately preserves the viable lexical alternative for קִנְאָה.
  issues:
  - severity: medium
    issue: “Mjinga” does not adequately distinguish פֹּתֶה from אֱוִיל.
    rationale: The first term denotes a fool in the moral/practical wisdom sense, while פֹּתֶה particularly denotes a naïve, readily deceived person. Using “mpumbavu” and “mjinga” makes the parallel sound largely synonymous and obscures this lexical contrast.
  - severity: low
    issue: “Humwangamiza” is less specific than the death-causative verb תָּמִית.
    rationale: Although destruction may entail death in context, “humfisha” directly represents the Hiphil causative sense, ‘causes to die.’
  revised_text: Kwa maana hasira humwua mpumbavu, na wivu[a] humfisha mtu asiye na busara.
  revised_footnotes:
  - marker: a
    text: Au “husuda.” Neno la Kiebrania linaweza kumaanisha wivu au husuda; hapa linahusu hisia haribifu.
    reason: lexical_alternative
  revision_rationale: The revision preserves the verse’s parallelism while distinguishing the morally/practically foolish person from the naïve person and rendering the second verb’s causative death sense explicitly. No doctrinal interpretation has been added.
