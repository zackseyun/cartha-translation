base_translation:
  language: en
  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: sw
  text: Kwa maana hasira humwua mpumbavu, na wivu[a] humfisha mtu asiye na busara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “husuda.” Neno la Kiebrania linaweza kumaanisha wivu au husuda; hapa linahusu hisia haribifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutanguliza maelezo ya Elifazi yanayoendeleza hoja ya mstari uliotangulia.
- source_word: לֶאֱוִיל
  choice: mpumbavu
  rationale: Neno אֱוִיל humaanisha mtu mpumbavu kimaadili na kimatendo, si mtu asiye na akili tu.
- source_word: יַהֲרָג
  choice: humwua
  rationale: Kauli ya hekima ya jumla imewasilishwa kwa wakati wa sasa wa mazoea, huku nguvu ya maana ya kuua ikihifadhiwa.
- source_word: כָּעַשׂ
  choice: hasira
  rationale: כַּעַשׂ inaweza kumaanisha ghadhabu, uchungu, au mfadhaiko unaotokana na kukasirishwa; “hasira” ni neno la kawaida na la asili linalofaa hapa kama hisia haribifu.
- source_word: וּפֹתֶה
  choice: mjinga
  rationale: פֹּתֶה ni mtu asiye na busara na anayedanganyika kwa urahisi. “Mjinga” ni ya kawaida katika Kiswahili, ingawa tofauti yake na אֱוִיל si rahisi kuhifadhi kikamilifu kwa neno moja.
- source_word: תָּמִית
  choice: humwangamiza
  rationale: Hifili ya מות ina maana ya kusababisha kifo. “Humwangamiza” hudumisha matokeo ya mauti na pia utofauti wa kimtindo katika usambamba.
- source_word: קִנְאָה
  choice: wivu
  rationale: Katika muktadha huu, קִנְאָה ni hisia haribifu inayoweza kueleweka kama wivu au husuda; “wivu” ni chaguo pana na la kawaida.
