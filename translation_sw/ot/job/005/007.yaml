  yaml_path: translation/ot/job/005/007.yaml
  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: sw
  text: 'Kwa maana mwanadamu huzaliwa kwa ajili ya taabu,

    na wana wa mwali huruka juu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “cheche huruka juu.” Kiebrania kinasema kihalisi, “wana wa mwali” (au labda, “wana wa Reshefu”), usemi unaoeleweka kwa kawaida kuwa cheche.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha kauli hii ya maelezo na mstari uliotangulia kwa namna ya kawaida katika Kiswahili.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Ni nomino ya umoja yenye maana ya jumla; ‘mwanadamu’ huhifadhi umoja wa kimethali bila kuifanya kauli ihusu wanaume pekee.
- source_word: לְעָמָל
  choice: kwa ajili ya taabu
  rationale: עָמָל inaweza kumaanisha kazi ngumu, taabu, au mateso; ‘taabu’ ni pana na inafaa muktadha wa mateso katika Ayubu.
- source_word: יוּלָּד
  choice: huzaliwa
  rationale: Kauli ni ukweli wa jumla, hivyo hali ya mazoea ya Kiswahili huwasilishwa kwa kiambishi hu-.
- source_word: וּבְנֵי רֶשֶׁף
  choice: wana wa mwali
  rationale: Huhifadhi taswira halisi na utata wa Kiebrania, badala ya kuamua moja kwa moja kuwa ni ‘cheche’; uwezekano huo umewekwa katika tanbihi.
- source_word: יַגְבִּיהוּ עוּף
  choice: huruka juu
  rationale: Vitenzi hivi kwa pamoja vinaonyesha mwendo wa kuruka kuelekea juu; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa בְנֵי רֶשֶׁף
  choice: wana wa mwali
  alternative: cheche; wana wa Reshefu
  rationale: Maandishi yanaweza kuwa nahau ya cheche, lakini yanaweza pia kuhifadhi taswira au jina Reshefu. Tafsiri kuu inaacha utata huo wazi bila kuingiza ufafanuzi wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kimethali ulio wa kawaida, wa heshima, na unaoeleweka. ‘Huzaliwa’ na ‘huruka’ zinaonyesha ukweli wa jumla; taswira isiyo ya kawaida ya Kiebrania imehifadhiwa na kufafanuliwa katika tanbihi.
