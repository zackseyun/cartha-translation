base_translation:
  language: en
  yaml_path: translation/ot/job/005/026.yaml
  text: You will come to the grave in full vigor[b][a], like a sheaf gathered up in its season.
translation:
  language: sw
  text: Utafika kaburini ukiwa katika ukomavu[a], kama rundo la nafaka linavyokusanywa kwa wakati wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukiwa katika uzee ulioiva,” au “ukiwa na nguvu kamili.” Neno la Kiebrania כֶּלַח ni adimu na huenda likarejelea umri uliokomaa au nguvu za ukomavu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama rundo la nafaka linavyoletwa kwa wakati wake.” Taswira ya Kiebrania inalinganisha kifo kinachokuja kwa wakati unaofaa na nafaka iliyovunwa na kurundikwa inapokuwa tayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: utafika
  rationale: Kitenzi בוא ni Qal isiyotimilifu, nafsi ya pili umoja wa kiume. “Utafika” ni ya kawaida katika Kiswahili kwa kufikia mwisho au mahali fulani na hudumisha maana ya mwelekeo.
- source_word: בְכֶלַח
  choice: ukiwa katika ukomavu kamili
  rationale: כֶּלַח ni neno adimu lenye maana inayojadiliwa; huenda likarejelea umri uliokomaa, nguvu kamili, au hatua kamili ya maisha. “Ukomavu kamili” huhifadhi upana huo na pia inaendana na mfano wa nafaka iliyofikia majira ya kukusanywa.
- source_word: אֱלֵי קָבֶר
  choice: kaburini
  rationale: אֱלֵי huonyesha mwelekeo, na קֶבֶר ni kaburi au mahali pa kuzikia. Kiswahili cha mahali “kaburini” huwasilisha kwa kawaida wazo la kuelekea kaburini.
- source_word: כַּעֲלוֹת
  choice: kama ... linavyokusanywa
  rationale: כ prefiksi ni ya ulinganisho, na עלה katika picha hii ya kilimo inaeleweka kwa maana ya kuletwa au kuondolewa baada ya kuvunwa. “Linavyokusanywa” huifanya picha hiyo ieleweke bila kupoteza wazo la mavuno.
- source_word: גָּדִישׁ
  choice: rundo la nafaka
  rationale: גָּדִישׁ kwa usahihi zaidi ni rundo au lundo la nafaka iliyokatwa, si lazima mganda mmoja. “Rundo la nafaka” huhifadhi taswira ya Kiebrania.
- source_word: בְּעִתּוֹ
  choice: kwa majira yake
  rationale: Kirai hiki humaanisha wakati wake unaofaa. “Kwa majira yake” huhifadhi maana ya wakati mwafaka pamoja na mwangwi wa kilimo.
theological_decisions:
- issue: Je, כֶּלַח inaahidi uzee mkubwa au nguvu kamili?
  choice: ukiwa katika ukomavu kamili
  alternative: ukiwa katika uzee ulioiva / ukiwa na nguvu kamili
  rationale: Neno la Kiebrania ni adimu na halilazimishi kwa uhakika ama umri mkubwa ama nguvu za mwili. Tafsiri kuu imeacha mvutano huo wazi, huku tanbihi ikitaja uwezekano wa uzee ulioiva.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. “Ukomavu kamili” huteuliwa ili kuhifadhi utata wa neno adimu כֶּלַח, na “rundo la nafaka” hufuata kwa karibu taswira halisi ya kilimo.
