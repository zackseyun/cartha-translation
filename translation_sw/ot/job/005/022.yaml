reference: Job 5:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ/שֹׁ֣ד וּ/לְ/כָפָ֣ן תִּשְׂחָ֑ק וּֽ/מֵ/חַיַּ֥ת הָ֝/אָ֗רֶץ אַל תִּירָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: sw
  text: 'Utacheka maangamizi na njaa,

    na hutawaogopa wanyama wa porini.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usiwaogope wanyama wa porini.” Muundo wa Kiebrania unaweza kueleweka kama katazo, ingawa hapa yaelekea unatumika kama ahadi ya usalama.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: maangamizi
  rationale: Neno hili humaanisha uharibifu mkubwa au maangamizi, mara nyingi yanayotokana na nguvu au vurugu. “Maangamizi” ni neno la kawaida na lenye uzito unaofaa ushairi huu.
- source_word: כָּפָן
  choice: njaa
  rationale: Nomino hii humaanisha njaa au ukosefu mkubwa wa chakula. “Njaa” ni tafsiri ya moja kwa moja na inaendana na maangamizi kama aina nyingine ya janga.
- source_word: תִּשְׂחָק
  choice: utacheka
  rationale: Kitenzi שׂחק humaanisha kucheka na wakati mwingine huonyesha dharau au kutokuwa na hofu. “Utacheka” inadumisha taswira wazi bila kulazimisha maana ya kudhihaki.
- source_word: מֵחַיַּת הָאָרֶץ
  choice: wanyama wa porini
  rationale: חַיָּה katika muktadha huu huelekea kumaanisha wanyama wa mwituni. “Wanyama wa porini” ni Kiswahili cha kawaida kinachowatofautisha na wanyama wa kufugwa bila kudokeza kwamba lazima wawe wakali.
- source_word: אַל תִּירָא
  choice: hutawaogopa
  rationale: Ingawa אַל pamoja na kitenzi kisichotimilika mara nyingi hutoa katazo, katika mfululizo huu wa ahadi inaweza kueleweka kama uhakikisho wa usalama. “Hutawaogopa” inaendeleza mtiririko huo, huku tanbihi ikihifadhi uwezekano wa katazo.
theological_decisions:
- issue: Nguvu ya אַל תִּירָא katika muktadha
  choice: 'Uhakikisho wa ahadi: “hutawaogopa”'
  alternative: 'Katazo: “usiwaogope”'
  rationale: Mstari huu ni sehemu ya mfululizo wa baraka na ulinzi unaotarajiwa. Kauli ya uhakikisho inaendana na “utacheka” na mtiririko wa kifungu, lakini muundo wa Kiebrania pia unaweza kuwa katazo; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wa kishairi. “Wanyama wa porini” ni la kawaida na wazi zaidi kuliko “wanyama wa nchi,” huku “utacheka” ikihifadhi taswira ya Kiebrania na mvutano wake wa kihisia.
