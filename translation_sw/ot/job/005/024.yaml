  text: וְֽ֭/יָדַעְתָּ כִּי שָׁל֣וֹם אָהֳלֶ֑/ךָ וּֽ/פָקַדְתָּ֥ נָ֝וְ/ךָ וְ/לֹ֣א תֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: sw
  text: Utajua kwamba hema lako lina amani, nawe utakapoyakagua makao yako, hutakosa chochote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutafanya dhambi.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutenda dhambi,” lakini katika muktadha huu huenda kinamaanisha “kukosa” au “kukuta kitu kinakosekana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Utajua
  rationale: Kauli timilifu ya Kiebrania yenye kiunganishi ina nguvu ya wakati ujao katika mfululizo huu wa ahadi; Kiswahili cha wakati ujao kinaifikisha kwa kawaida.
- source_word: כִּי שָׁלוֹם אָהֳלֶךָ
  choice: kwamba hema lako lina amani
  rationale: כִּי hapa hutambulisha maudhui ya jambo litakalojulikana. 'Lina amani' huhifadhi maana pana ya שָׁלוֹם—amani, usalama na hali njema—bila kuibana kuwa usalama pekee.
- source_word: וּפָקַדְתָּ
  choice: nawe utakapoikagua
  rationale: פקד inaweza kumaanisha kutembelea, kuangalia au kukagua. Katika muktadha wa kuhakikisha hali ya makao, 'kukagua' inaendana vizuri na kishazi kinachofuata; umbo la 'utakapo-' linaonyesha uhusiano wa wakati kwa Kiswahili cha kawaida.
- source_word: נָוְךָ
  choice: makao yako
  rationale: נָוֶה inaweza kuwa makao, maskani au malisho. Hapa inalingana na 'hema,' hivyo 'makao' inafaa kwa mazingira ya nyumbani huku ikibakiza upana wa neno.
- source_word: וְלֹא תֶחֱטָא
  choice: hutakosa chochote
  rationale: Ingawa חטא mara nyingi humaanisha 'kutenda dhambi,' maana yake ya msingi inaweza kuwa kukosa shabaha au kukuta kitu kinakosekana. Baada ya kukagua makao, maana ya kutokuta chochote kimekosekana inafaa zaidi katika muktadha.
theological_decisions:
- issue: Maana ya וְלֹא תֶחֱטָא
  choice: hutakosa chochote
  alternative: hutafanya dhambi
  rationale: Muktadha unahusu amani na ukamilifu wa nyumba baada ya kukaguliwa. Hata hivyo, kwa kuwa maana ya kimaadili ni tafsiri halisi inayowezekana ya kitenzi, imehifadhiwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Hema' huhifadhi taswira ya kale; 'makao' ni ya kawaida na pana. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
