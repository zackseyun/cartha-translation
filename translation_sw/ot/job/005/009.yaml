lexical_decisions:
- source_word: עֹשֶׂה
  choice: anayefanya
  rationale: Kitenzi cha Qal katika umbo la sifa endelevu kinamtaja Mungu kwa maelezo ya uhusiano katika muktadha. “Anayefanya” ni Kiswahili cha sasa na cha kawaida kinachohifadhi nguvu hiyo.
- source_word: גְדֹלוֹת
  choice: mambo makuu
  rationale: Kivumishi cha wingi kimetumiwa kama nomino. “Mambo makuu” ni tafsiri ya moja kwa moja isiyobana maana kuwa matendo ya aina fulani tu.
- source_word: וְאֵין חֵקֶר
  choice: yasiyochunguzika
  rationale: Kirai hiki kihalisi kinaeleza kutokuwapo kwa uchunguzi unaoweza kuyafikia. “Yasiyochunguzika” kinawasilisha maana ya kutoweza kuchunguzwa hadi kueleweka na kinafaa katika ushairi wa Kiswahili; muundo wa kihalisi umehifadhiwa katika tanbihi.
- source_word: נִפְלָאוֹת
  choice: maajabu
  rationale: Nomino hii humaanisha matendo au mambo ya kushangaza yaliyo nje ya kawaida. “Maajabu” ni neno la kawaida, lenye hadhi, na linalolingana kishairi na “mambo makuu.”
- source_word: עַד אֵין מִסְפָּר
  choice: yasiyohesabika
  rationale: Nahau hii inaonyesha wingi usioweza kuhesabiwa. “Yasiyohesabika” ni ya asili katika Kiswahili na inadumisha ulinganifu wa kishairi na “yasiyochunguzika.”
