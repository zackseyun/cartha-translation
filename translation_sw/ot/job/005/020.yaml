  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: sw
  text: Wakati wa njaa atakukomboa[a] kutoka mautini, na wakati wa vita, kutoka katika nguvu za upanga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakuokoa” au “atakuachilia kwa fidia.” Kitenzi cha Kiebrania kina maana ya kumwachilia au kumwokoa mtu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka mikononi mwa upanga,” nahau yenye maana ya “kutoka katika nguvu za upanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: Wakati wa njaa
  rationale: רָעָב hapa ni janga la njaa, si hisia ya mtu kuwa na njaa tu; בְּ inaonyesha hali au wakati ambamo ukombozi unatokea.
- source_word: פָּדְךָ
  choice: atakukomboa
  rationale: פדה hubeba maana ya kumwachilia, kumwokoa, au kumkomboa mtu. “Atakukomboa” huhifadhi uzito wa kitenzi bila kudai wazi kwamba fidia imelipwa katika muktadha huu.
- source_word: מִמָּוֶת
  choice: kutoka mautini
  rationale: מִן inaonyesha kutolewa au kuondolewa katika hatari ya kifo; “mautini” ni usemi wa kawaida wa Kiswahili unaofaa hapa.
- source_word: וּבְמִלְחָמָה
  choice: na wakati wa vita
  rationale: מִלְחָמָה inaweza kumaanisha vita au mapambano; “vita” huhifadhi maana pana na usambamba na “wakati wa njaa.”
- source_word: מִידֵי
  choice: kutoka katika nguvu za
  rationale: Kiebrania kinasema kihalisi “kutoka mikononi mwa”; huu ni usemi wa mamlaka au uwezo. Kwa kuwa upanga hauna mikono kihalisi, “nguvu za” hutoa maana ya nahau kwa Kiswahili cha kawaida.
- source_word: חָרֶב
  choice: upanga
  rationale: חָרֶב ni neno la kawaida la upanga na hapa pia linawakilisha maangamizi ya kivita.
theological_decisions:
- issue: Maana ya פדה katika muktadha wa hekima
  choice: atakukomboa
  alternative: atakuokoa; atakuachilia kwa fidia
  rationale: Mstari unazungumzia kuokolewa na kifo cha kimwili katika majanga. “Atakukomboa” huhifadhi lugha yenye nguvu ya kuachiliwa ya Kiebrania, lakini haitii ndani ya mstari mafundisho mapana zaidi ya wokovu ambayo muktadha hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wakati wa” ni cha asili kuliko muundo mkavu wa “katika njaa/vita”; nahau ya Kiebrania imewasilishwa kwa maana katika maandishi na kuhifadhiwa kihalisi katika tanbihi.
