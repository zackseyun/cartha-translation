lexical_decisions:
- source_word: אֲנִי
  choice: Mimi
  rationale: Kiwakilishi cha nafsi kilicho wazi katika Kiebrania kimehifadhiwa ili kuonyesha msisitizo wa msemaji.
- source_word: רָאִיתִי
  choice: nimemwona
  rationale: Kauli timilifu inaeleza jambo ambalo msemaji amelishuhudia; wakati timilifu wa Kiswahili huwasilisha vizuri ushuhuda huo.
- source_word: אֱוִיל
  choice: mpumbavu
  rationale: Neno hili linahifadhi maana ya kimaadili na ya kifasihi katika fasihi ya hekima, si ukosefu wa akili tu.
- source_word: מַשְׁרִישׁ
  choice: akitia mizizi
  rationale: Huhifadhi sitiari ya kuota au kuweka mizizi, yaani kuonekana akiimarika au kustawi.
- source_word: וָאֶקּוֹב
  choice: nikalaani
  rationale: Maana ya moja kwa moja ya kitenzi hapa ni kutamka laana; tafsiri zisizo kali sana zimehifadhiwa katika tanbihi.
- source_word: נָוֵהוּ
  choice: makao yake
  rationale: Makao ni neno la kawaida na lenye hadhi linaloweza kumaanisha mahali anapoishi bila kubana picha hiyo kuwa nyumba pekee.
- source_word: פִתְאֹם
  choice: ghafla
  rationale: Huwakilisha hali ya kutokea bila kutazamiwa na ukali wa mfuatano wa kishairi.
theological_decisions:
- issue: Maana ya itikio la msemaji katika וָאֶקּוֹב
  choice: Elifazi anasema kwamba yeye mwenyewe aliyalaani makao ya mpumbavu baada ya kumwona akitia mizizi.
  alternative: Huenda Elifazi alitangaza kwamba makao hayo yamelaaniwa au aliyatambua kuwa yamehukumiwa kuangamia.
  rationale: Maana ya msingi ya kitenzi inaunga mkono kitendo cha kutamka laana, bila kudokeza kwamba maneno hayo yana nguvu za kichawi. Kwa kuwa tamko la hukumu pia linawezekana katika muktadha huu, uwezekano huo umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akitia mizizi” huhifadhi sitiari ya Kiebrania; “makao” ni pana na ya kawaida kuliko “maskani.” Kiunganishi “ndipo” kinaonyesha mfuatano wa ו bila kuingiza utofautishaji usiokuwapo katika chanzo.
