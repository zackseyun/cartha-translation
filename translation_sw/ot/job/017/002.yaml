  text: Hakika wenye dhihaka[a] wako pamoja nami, na jicho langu hukaa likitazama uchokozi wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wadanganyifu”; neno la Kiebrania linaweza kumaanisha watu wadanganyifu au wenye dhihaka.
    reason: lexical_alternative
  - marker: b
    text: Au, “jicho langu hukaa likitazama uasi wao” au “uchungu wao”; usemi wa Kiebrania ni mgumu na unaweza kumaanisha mwenendo wa kuchokoza, wa kuasi, au wenye uchungu.
