lexical_decisions:
- source_word: אִם לֹא
  choice: Hakika
  rationale: Kirai hiki kinatumika kama kiapo cha kusisitiza, si kama sharti; “Hakika” kinawasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: הֲתֻלִים
  choice: wenye kunidhihaki
  rationale: Neno hilo linaweza kuwataja watu wanaodhihaki au kudanganya. Katika muktadha wa maneno makali ya wenzake Ayubu, maana ya kudhihaki inafaa zaidi, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: עִמָּדִי
  choice: wako pamoja nami
  rationale: Kihusishi chenye kiambishi cha nafsi ya kwanza kinaonyesha kuwapo kwao katika mazingira au ushirika wa karibu wa Ayubu.
- source_word: וּבְהַמְּרוֹתָם
  choice: juu ya uchokozi wao
  rationale: Umbo hili linaweza kuonyesha mwenendo wa kuchokoza, uasi, au uchungu. “Uchokozi wao” linafaa kwa muktadha wa maneno ya kuudhi bila kulifanya hasa kuwa uasi dhidi ya Mungu.
- source_word: תָּלַן
  choice: linakaa
  rationale: Kitenzi kwa maana halisi ni kukaa au kulala mahali usiku. Kuhusu jicho, ni sitiari ya kuendelea kutazama; “linakaa” huhifadhi picha hiyo kwa namna ya asili kuliko “linabaki” pekee.
- source_word: עֵינִי
  choice: jicho langu
  rationale: Kiebrania kina umoja, nao umehifadhiwa kwa sababu unaeleweka na kuhifadhi taswira ya mstari.
