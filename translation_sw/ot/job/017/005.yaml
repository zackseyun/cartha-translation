  text: Mtu anayewashutumu rafiki zake kwa ajili ya fungu[a], macho ya watoto wake yatafifia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu,” “faida,” au, kwa tafsiri nyingine, “kwa kujipendekeza.” Maneno ya Kiebrania hapa ni magumu, lakini yanaonekana kudokeza kuwatendea rafiki vibaya kwa manufaa binafsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: ili apate fungu
  rationale: Neno חֵלֶק kwa kawaida humaanisha ‘fungu’ au ‘sehemu.’ Katika muktadha huu mgumu, linaweza kudokeza kutenda kwa faida binafsi; tafsiri inaweka maana ya msingi bila kuongeza wazi wazo la nyara.
- source_word: יַגִּיד
  choice: anawashitaki
  rationale: Hifili ya נגד humaanisha kutangaza au kueleza. Hapa muktadha wa rafiki na faida binafsi unaipa kauli hiyo maana hasi ya kuwafichua au kuwashtaki, bila kuifunga kwenye mazingira mahususi ya kisheria.
- source_word: רֵעִים
  choice: rafiki zake
  rationale: רֵעִים humaanisha rafiki au wenzi. ‘Rafiki zake’ ni Kiswahili cha kawaida na huonyesha usaliti wa uhusiano unaodokezwa.
- source_word: וְעֵינֵי בָנָיו
  choice: macho ya watoto wake
  rationale: בנים inaweza kumaanisha wana wa kiume au watoto kwa ujumla. ‘Watoto’ ni ya kawaida na haisuluhishi zaidi ya lazima utambulisho wao.
- source_word: תִּכְלֶנָה
  choice: yatafifia
  rationale: כלה inaweza kumaanisha kuisha, kudhoofika, au kufifia. Ikiwa macho ndiyo kiima, ‘yatafifia’ huhifadhi taswira ya macho yanayopoteza nguvu au nuru.
theological_decisions:
- issue: Uhusiano kati ya kumshtaki rafiki na kufifia kwa macho ya watoto
  choice: Umeachwa kama kauli ya matokeo bila kueleza utaratibu wake
  alternative: Kuufafanua moja kwa moja kama adhabu ya Mungu au kama matokeo ya umaskini
  rationale: Kiebrania hakitaji wazi kwa nini macho ya watoto yanafifia; kuongeza sababu kungeondoa mvutano na utata wa mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘anayewashtaki … macho … yatafifia’ unasikika kama kauli ya hekima huku ukibakiza ufupi na ugumu wa Kiebrania.
