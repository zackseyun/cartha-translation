base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: sw
  text: Tafadhali, weka dhamana kwa ajili yangu kwako mwenyewe[a]; ni nani atakayeshikana nami mikono[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwe mdhamini wangu kwako mwenyewe.” Kiebrania kinatumia lugha ya kisheria ya kutoa dhamana au kuwa mdhamini.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ni nani atakayepiga mkono pamoja nami?” Kushikana mikono kulikuwa ishara ya kuingia katika makubaliano ya dhamana.
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה
  choice: niwekee
  rationale: Kauli ya amri ya שׂים ina maana ya kuweka au kuanzisha; pamoja na kiambishi cha mtendewa katika עָרְבֵנִי, ‘niwekee’ ni Kiswahili cha kawaida kinachofaa muktadha wa dhamana.
- source_word: נָּא
  choice: Tafadhali
  rationale: Chembe hii hulainisha ombi; ‘tafadhali’ linaonyesha vizuri sauti ya kusihi.
- source_word: עָרְבֵנִי
  choice: dhamana
  rationale: Mzizi ערב hapa ni lugha ya kisheria ya kuwa mdhamini au kutoa dhamana kwa niaba ya mtu. ‘Dhamana’ ni neno la sasa na linaloeleweka, huku maana mbadala ikielezwa katika tanbihi.
- source_word: עִמָּךְ
  choice: kwako mwenyewe
  rationale: Kirai hiki kinaelekeza dhamana iwe kwa Mungu mwenyewe; ‘mwenyewe’ huhifadhi mkazo wa ajabu wa ombi bila kuufafanua kupita kiasi.
- source_word: מִי הוּא
  choice: ni nani
  rationale: Swali la balagha linahifadhiwa moja kwa moja bila kuongeza ‘mwingine,’ ambalo halipo wazi katika Kiebrania.
- source_word: לְיָדִי
  choice: mkono wangu
  rationale: Tafsiri halisi ya taswira ya mkono imehifadhiwa kwa sababu ni sehemu ya nahau ya kufanya makubaliano ya dhamana.
- source_word: יִתָּקֵעַ
  choice: atakayepiga
  rationale: Kitenzi תקע pamoja na ‘mkono’ kinaeleza ishara ya kupiga au kushikana mikono ili kuthibitisha makubaliano; ‘kupiga mkono’ huhifadhi taswira hiyo, ikifafanuliwa katika tanbihi.
theological_decisions:
- issue: Sitiari ya kisheria inayoelekezwa kwa Mungu
  choice: Ayubu anamwomba Mungu amwekee dhamana kwake Mungu mwenyewe.
  alternative: Ayubu anaomba tu apatikane mdhamini bila kudokeza kwamba Mungu anahusika kwa pande zote mbili.
  rationale: Muunganiko wa עָרְבֵנִי na עִמָּךְ unaelekeza ombi kwa Mungu na mahali pa dhamana kuwa ‘kwako mwenyewe.’ Tafsiri inahifadhi mvutano huu usio wa kawaida bila kuugeuza kuwa dai pana la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi umewekwa wa moja kwa moja, na taswira ya mkono imehifadhiwa kwa tanbihi ya kitamaduni.
