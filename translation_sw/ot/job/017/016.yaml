base_translation:
  language: en
  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
translation:
  language: sw
  text: Je, yatashuka kwenye makomeo ya Sheoli?[a] Je, tutashuka pamoja mavumbini?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu za Sheoli,” au, “mapingo ya Sheoli.” Huenda picha ya Kiebrania inarejelea malango yenye makomeo yanayofungia makao ya wafu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Je, tutapumzika pamoja mavumbini?” Neno la mwisho la Kiebrania linaweza kueleweka kuwa kushuka au, kulingana na baadhi ya wafasiri, kupumzika.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: makomeo ya
  rationale: Katika muktadha wa Sheoli, neno hili linaeleweka vizuri kama makomeo au mapingo ya malango, picha ya kishairi inayoonyesha kufungiwa katika makao ya wafu; maana nyingine ya ‘sehemu za’ imehifadhiwa katika tanbihi.
- source_word: שְׁאֹל
  choice: Sheoli
  rationale: Jina limetoholewa badala ya kupunguzwa kuwa ‘kaburi,’ ili kuhifadhi wigo wake wa maana kama makao au ulimwengu wa wafu katika fikra za Kiebrania.
- source_word: תֵּרַדְנָה
  choice: yatashuka
  rationale: Kitenzi ni cha nafsi ya tatu, wingi wa kike, na kwa muktadha kinaelekea kurejelea matumaini ya Ayubu yaliyotajwa awali. Muundo wa swali unafaa mfululizo wa maswali ya balagha.
- source_word: אִם
  choice: Je
  rationale: Ingawa mara nyingi humaanisha ‘ikiwa,’ hapa lina nguvu ya kuanzisha swali la balagha; ‘Je’ ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo.
- source_word: יַחַד
  choice: pamoja
  rationale: Huhifadhi wazi wazo la kuwa wote pamoja katika kushuka au kupumzika mavumbini.
- source_word: עַל עָפָר
  choice: mavumbini
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa mwelekeo wa kwenda kwenye mavumbi katika muktadha wa kifo, ingawa kihusishi cha Kiebrania kwa kawaida ni ‘juu ya.’
- source_word: נָחַת
  choice: tutashuka
  rationale: Imetafsiriwa kwa maana ya kushuka, ikiendeleza ulinganifu wa kishairi na תֵּרַדְנָה. Uwezekano wa maana ‘kupumzika’ umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: Kutumia ‘Sheoli’ hakulazimishi neno hilo kumaanisha kaburi moja la kimwili wala kulifafanua kwa mfumo fulani wa mafundisho kuhusu maisha baada ya kifo; kunahifadhi utata na upana wa istilahi ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. ‘Makomeo’ linaendeleza picha halisi ya malango yaliyofungwa, na ‘Sheoli’ limehifadhiwa kama istilahi muhimu ya Kiebrania. Viwakilishi vya ngeli katika ‘yatashuka’ vinaelekeza kwa kawaida kwenye ‘matumaini’ yaliyotajwa katika muktadha uliotangulia.
