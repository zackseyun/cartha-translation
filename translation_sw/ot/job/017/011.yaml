  text: Siku zangu zimepita; mipango yangu imekatizwa—matamanio ya moyo wangu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali za moyo wangu,” “mambo yaliyothaminiwa na moyo wangu,” au “urithi wa moyo wangu.” Usemi wa Kiebrania ni adimu na mgumu kufasiri.
