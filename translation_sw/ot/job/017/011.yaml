lexical_decisions:
- source_word: יָמַי
  choice: Siku zangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya Kiswahili kwa siku za maisha ya msemaji.
- source_word: עָבְרוּ
  choice: zimepita
  rationale: Kauli timilifu inaonyesha kuwa siku zimekwisha kupita; Kiswahili hiki ni cha kawaida na kinahifadhi taswira ya muda kupita.
- source_word: זִמֹּתַי
  choice: mipango yangu
  rationale: Katika muktadha wa maombolezo, neno hili linaonyesha makusudi au mipango ya Ayubu bila maana hasi ambayo wakati mwingine huambatana na hila.
- source_word: נִתְּקוּ
  choice: imekatizwa
  rationale: Nifali ya נתק hubeba wazo la kukatwa, kutenganishwa, au kung’olewa. ‘Imekatizwa’ inaeleza kwa Kiswahili cha kawaida kwamba mipango hiyo imekomeshwa kwa nguvu kabla ya kutimia.
- source_word: מוֹרָשֵׁי לְבָבִי
  choice: mambo ambayo moyo wangu uliyatamani
  rationale: Kirai hiki ni adimu na kigumu. Tafsiri hii huonyesha vitu vilivyothaminiwa au kutamaniwa moyoni na kudumisha ulinganifu wake na ‘mipango yangu,’ bila kuficha uwezekano wa maana nyingine.
