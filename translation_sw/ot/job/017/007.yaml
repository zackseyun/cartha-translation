lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: limedhoofika
  rationale: Kitenzi כהה hudokeza kufifia au kudhoofika. Katika Kiswahili, “limedhoofika” huonyesha hali iliyotokea na inaweza kueleweka kuhusu uwezo wa kuona bila kuondoa taswira ya kishairi.
- source_word: מִכַּעַשׂ
  choice: kwa huzuni
  rationale: כַּעַשׂ inaweza kumaanisha huzuni, mfadhaiko, ghadhabu, au msukosuko wa hisia. Katika maombolezo haya, “huzuni” inafaa muktadha wa mateso, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: עֵינִי
  choice: Jicho langu
  rationale: Nomino ya Kiebrania iko katika umoja ikiwa na kiambishi cha nafsi ya kwanza. Kiswahili pia kinaweza kutumia “jicho langu” kishairi kwa uwezo wa kuona.
- source_word: וִיצֻרַי
  choice: viungo vyangu
  rationale: Neno hili lisilo la kawaida linaweza kurejelea maumbile, umbo, au sehemu za mwili wa Ayubu. “Viungo vyangu” ni wazi na kinaendana na marejeo ya mwili, bila kuficha kutokuwa na uhakika kwa maana yake.
- source_word: כַּצֵּל
  choice: kama kivuli
  rationale: Huhifadhi tashbihi ya Kiebrania ya udhaifu, kufifia, au kutokuwa na uthabiti.
- source_word: כֻּלָּם
  choice: vyote
  rationale: Hurejelea kwa ujumla viungo vilivyotajwa na hudumisha maana ya ‘vyote’ kwa Kiswahili cha kawaida.
