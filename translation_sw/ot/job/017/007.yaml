  text: Jicho langu limefifia kwa huzuni[a], na viungo vyangu vyote ni kama kivuli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ghadhabu,” “kwa fadhaa,” au “kwa majonzi.” Neno la Kiebrania linaweza kumaanisha aina mbalimbali za msukosuko wa hisia; hapa limetafsiriwa “huzuni” kwa sababu muktadha ni wa maombolezo na mateso.
    reason: lexical_alternative
  - marker: b
    text: Au “maumbile yangu,” “umbo langu,” au “sehemu zote za mwili wangu.” Maana kamili ya neno la Kiebrania hapa si hakika; huenda linarejelea sura au sehemu za mwili wa Ayubu kwa ujumla.
