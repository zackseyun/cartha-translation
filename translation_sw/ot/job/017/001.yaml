  source_fidelity: 'The main rendering follows the Hebrew threefold lament closely: רוּחִי is rendered “Roho yangu,” the passive damage in חֻבָּלָה is conveyed by “imevunjika,” the plural “siku zangu” and extinguishing imagery of נִזְעָכוּ are retained, and the plural קְבָרִים is preserved in “makaburi.” “Yananingoja” idiomatically communicates לִי in context without materially adding to the sense.'
