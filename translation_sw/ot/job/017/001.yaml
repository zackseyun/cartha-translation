  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: sw
  text: Roho yangu imevunjika[a]; siku zangu zimezimika[b]; makaburi yananingoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Pumzi yangu imekatika.” Neno la Kiebrania רוּחַ linaweza kumaanisha “roho” au “pumzi.”
    reason: lexical_alternative
  - marker: b
    text: Au “siku zangu zimezimwa.” Kitenzi huenda kina picha ya kitu kinachozimwa, kama taa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: roho yangu
  rationale: רוּחַ inaweza kumaanisha roho au pumzi. Katika maombolezo ya Ayubu, “roho yangu” huonyesha uhai wake wa ndani uliovunjika, huku “pumzi yangu” ikibaki kuwa maana halali katika tanbihi.
- source_word: חֻבָּלָה
  choice: imevunjika
  rationale: Kauli ya kutendwa inaonyesha kuharibiwa au kuvunjwa. “Imevunjika” ni Kiswahili cha kawaida na chenye uzito wa maombolezo bila kubainisha kupita kiasi namna ya uharibifu.
- source_word: יָמַי
  choice: siku zangu
  rationale: Tafsiri ya moja kwa moja ya wingi wenye umilikaji, ikimaanisha muda uliobaki wa maisha ya Ayubu.
- source_word: נִזְעָכוּ
  choice: zimezimika
  rationale: Kitenzi kina picha ya kitu kilichozimwa, huenda taa. “Zimezimika” huhifadhi sitiari ya maisha yanayofikia mwisho.
- source_word: קְבָרִים
  choice: makaburi
  rationale: Wingi wa Kiebrania umehifadhiwa badala ya kugeuzwa kuwa umoja wa kijumla.
- source_word: לִי
  choice: yananingoja
  rationale: Kirai hicho humaanisha kihalisi “kwa ajili yangu” au “ni yangu”; katika muktadha, “yananingoja” hutoa kwa Kiswahili maana ya makaburi kuwa mbele yake bila kuongeza wazo geni.
