  text: וְ֭/אַיֵּה אֵפ֣וֹ תִקְוָתִ֑/י וְ֝/תִקְוָתִ֗/י מִ֣י יְשׁוּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: sw
  text: Basi, tumaini langu liko wapi? Na tumaini langu—ni nani awezaye kuliona?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nani atakayelitazama?” Kitenzi cha Kiebrania kinaweza kutafsiriwa “kuona” au “kutazama,” na umbo lake linaweza kueleweka kuwa la wakati ujao (“atakaye”) au la uwezekano (“awezaye”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: liko wapi?
  rationale: אַיֵּה ni kiulizi cha mahali, ‘wapi?’; katika Kiswahili, ‘tumaini langu liko wapi?’ ni swali la kawaida na lenye kuhifadhi maana ya Kiebrania.
- source_word: אֵפוֹ
  choice: Basi
  rationale: אֵפוֹ huongeza mkazo au hitimisho la kimantiki. ‘Basi’ huonyesha mwendelezo huo kwa Kiswahili cha kawaida bila kuongeza maana isiyokuwapo.
- source_word: תִקְוָתִי
  choice: tumaini langu
  rationale: תִּקְוָה humaanisha tumaini au tarajio; ‘tumaini’ linafaa zaidi katika kilio cha Ayubu.
- source_word: וְתִקְוָתִי
  choice: Na tumaini langu
  rationale: Kurudiwa kwa ‘tumaini langu’ kumehifadhiwa kwa ajili ya mkazo na nguvu ya kishairi ya mstari wa Kiebrania.
- source_word: מִי
  choice: ni nani
  rationale: Hiki ndicho kiulizi cha kawaida cha Kiswahili kinacholingana na מִי, ‘nani?’
- source_word: יְשׁוּרֶנָּה
  choice: awezaye kuliona
  rationale: Kitenzi שׁוּר kinaweza kumaanisha kuona, kutazama, au kukiona kwa makini. Hapa hali ya uwezekano imewasilishwa kwa ‘awezaye,’ huku kiambishi cha yambwa ‘-li-’ kikirejelea ‘tumaini.’
theological_decisions:
- issue: Iwapo יְשׁוּרֶנָּה inaonyesha uwezo au wakati ujao
  choice: awezaye kuliona
  alternative: atakayeliona
  rationale: Muktadha wa kilio cha Ayubu unaruhusu maana ya kuuliza ni nani anayeweza kuliona tumaini hilo, lakini umbo la Kiebrania linaweza pia kueleweka kuwa la wakati ujao. Tofauti hiyo imewekwa wazi katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. Mpangilio wa kishairi na kurudiwa kwa ‘tumaini langu’ vimehifadhiwa; kiunganishi ‘Na’ kinaendeleza kilio cha Ayubu, huku ‘Basi’ kikibeba mkazo wa אֵפוֹ.
