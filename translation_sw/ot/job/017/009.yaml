  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa kishairi na taswira ya “mikono safi” vimehifadhiwa; kiunganishi kimetafsiriwa kwa nguvu ndogo ya upinzani inayolingana na muktadha.
