  text: וְ/יֹאחֵ֣ז צַדִּ֣יק דַּרְכּ֑/וֹ וּֽ/טֳהָר יָ֝דַ֗יִם יֹסִ֥יף אֹֽמֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: sw
  text: Lakini mwenye haki huishikilia njia yake, na mwenye mikono safi huzidi kuwa na nguvu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huongeza nguvu.” Neno la Kiebrania linaweza kumaanisha nguvu, uthabiti, au, kwa maana finyu zaidi, ujasiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: Lakini ... huishikilia
  rationale: Kiunganishi kinaweza kuwa “na,” lakini katika muktadha kina nguvu ndogo ya kupinga hali ya kukatisha tamaa iliyoelezwa kabla. “Lakini” huonyesha hilo bila kulizidisha. Kitenzi אחז hapa kina maana ya kushika kwa uthabiti au kudumu.
- source_word: צַדִּיק
  choice: mwenye haki
  rationale: Kivumishi hiki kimetumiwa kama nomino ya kumwakilisha mtu mwenye haki kwa ujumla; “mwenye haki” ni Kiswahili cha kawaida na hakiongezi jinsia isiyotajwa wazi.
- source_word: דַּרְכּוֹ
  choice: njia yake
  rationale: דֶּרֶךְ inaweza kumaanisha njia halisi au mwenendo wa maisha. “Njia yake” huhifadhi upana huo na taswira ya Kiebrania.
- source_word: וּטֳהָר יָדַיִם
  choice: mwenye mikono safi
  rationale: Hii ni nahau ya kutokuwa na hatia au ya usafi wa kimaadili. Tafsiri hii huhifadhi taswira halisi huku ikieleweka katika Kiswahili.
- source_word: יֹסִיף אֹמֶץ
  choice: huzidi kuwa na nguvu
  rationale: Kifungu hiki husema kihalisi “huongeza nguvu.” “Huzidi kuwa na nguvu” ni cha asili katika Kiswahili na huhifadhi wazo la kuongezeka kwa nguvu, uthabiti, au moyo.
theological_decisions: []
