  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: sw
  text: Watu wanyoofu wanashangazwa na jambo hili, naye asiye na hatia huinuka dhidi ya mtu asiyemcha Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnafiki.” Neno la Kiebrania חָנֵף linaweza kumaanisha mtu asiye na uchaji au heshima kwa Mungu; katika baadhi ya miktadha limetafsiriwa kimapokeo kuwa “mnafiki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: wanashtushwa
  rationale: Kitenzi hiki hapa kinaonyesha mshangao wenye hofu au mshtuko mkubwa. “Wanashtushwa” kinaeleza nguvu hiyo kwa Kiswahili cha kawaida bila kukielekeza kwenye maana ya kuachwa ukiwa.
- source_word: יְשָׁרִים
  choice: wanyofu
  rationale: Kivumishi cha wingi kimetumiwa kama nomino kumaanisha watu wenye unyofu wa kimaadili; “wanyofu” ni kifupi na cha asili katika Kiswahili.
- source_word: עַל זֹאת
  choice: na jambo hili
  rationale: עַל hapa inaonyesha jambo linalosababisha mshtuko. Muundo “wanashtushwa na jambo hili” ni wa kawaida na wazi katika Kiswahili.
- source_word: נָקִי
  choice: mtu asiye na hatia
  rationale: Neno hili humaanisha aliye safi kutokana na hatia. Kutaja “mtu” kunafanya matumizi ya kivumishi kama nomino yawe wazi na ya asili katika Kiswahili.
- source_word: חָנֵף
  choice: mtu asiyemcha Mungu
  rationale: Katika muktadha huu neno linamtaja mtu asiyemheshimu Mungu au mwovu kidini, si lazima mnafiki kwa maana finyu ya kujifanya. Chaguo hili linahifadhi utofauti wa kimaadili na kidini katika mstari.
- source_word: יִתְעֹרָר
  choice: hujiamsha
  rationale: Muundo wa kitenzi una maana ya kujichochea au kujiamsha mwenyewe ili kuchukua hatua. “Hujiamsha” linahifadhi dhana hiyo ya urejeshi.
- source_word: עַל חָנֵף
  choice: dhidi ya mtu asiyemcha Mungu
  rationale: Pamoja na kitenzi cha kujiamsha, עַל inaeleweka hapa kuwa ya upinzani; kwa hiyo “dhidi ya” linaonyesha kwamba mtu asiye na hatia anachochewa kumpinga huyo mtu.
theological_decisions:
- issue: Maana ya חָנֵף
  choice: mtu asiyemcha Mungu
  alternative: mnafiki
  rationale: Neno la Kiebrania lina wigo mpana wa kumaanisha mtu asiye na uchaji au anayemkosea Mungu heshima. “Mtu asiyemcha Mungu” linahifadhi utofauti kati ya wanyofu/wasio na hatia na waovu bila kuibana maana kuwa unafiki wa kujifanya tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Kurudiwa kwa “mtu” kunatambulisha wazi makundi mawili ya kimaadili, huku “hujiamsha” kikihifadhi hali ya kujichochea mwenyewe iliyo katika Kiebrania.
