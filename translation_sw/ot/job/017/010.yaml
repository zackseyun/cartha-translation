  text: וְֽ/אוּלָ֗ם כֻּלָּ֣/ם תָּ֭שֻׁבוּ וּ/בֹ֣אוּ נָ֑א וְ/לֹֽא אֶמְצָ֖א בָ/כֶ֣ם חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: sw
  text: Lakini ninyi nyote, rudini na njooni sasa[a]; sitampata mtu mwenye hekima miongoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “geukeni tena, kisha njooni”; Kiebrania kina mwito wenye msisitizo, ambao huenda unawapa changamoto marafiki wa Ayubu wajaribu tena hoja zao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini
  rationale: Inaonyesha badiliko lenye upinzani mkali na ni ya kawaida katika Kiswahili cha sasa.
- source_word: כֻּלָּם
  choice: ninyi nyote
  rationale: Vitenzi vinavyofuata ni vya nafsi ya pili wingi, hivyo Ayubu anazungumza moja kwa moja na waandamani wake wote.
- source_word: תָּשֻׁבוּ
  choice: rudini
  rationale: Kitenzi שוב hapa kina nguvu ya amri au changamoto ya kurudia; “rudini” huhifadhi maana hiyo bila kuifafanua kupita kiasi.
- source_word: וּבֹאוּ נָא
  choice: na njooni sasa
  rationale: “Njooni” huhifadhi kitenzi cha kuja, na “sasa” huwasilisha msisitizo wa נָא katika mwito huu kuliko ombi la upole.
- source_word: וְלֹא אֶמְצָא
  choice: sitampata
  rationale: Kauli ya wakati ujao inaonyesha matokeo yanayotarajiwa baada ya changamoto hiyo, bila kuongeza wazo la kutoweza.
- source_word: בָכֶם
  choice: miongoni mwenu
  rationale: Huwasilisha kwa Kiswahili cha kawaida mahali ndani ya kundi la wanaosemeshwa.
- source_word: חָכָם
  choice: mtu mwenye hekima
  rationale: Kivumishi cha Kiebrania kimetumiwa kama nomino ya umoja. Kiswahili “mtu mwenye hekima” ni cha asili na hakiongezi ubainishaji wa jinsia usio lazima kisarufi, huku muktadha ukionyesha kuwa wanaosemeshwa ni waandamani wa Ayubu.
theological_decisions:
- issue: Uwasilishaji wa חָכָם ya umoja wa kiume
  choice: mtu mwenye hekima
  alternative: mwanamume mwenye hekima
  rationale: Kiswahili hakina jinsia ya kisarufi inayolingana moja kwa moja na umbo la Kiebrania. “Mtu mwenye hekima” huhifadhi umoja na maana ya msingi, bila kugeuza jinsia ya kisarufi kuwa dai la ziada kuhusu jinsia ya kibayolojia; muktadha wenyewe tayari unawahusu waandamani wa kiume wa Ayubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya amri mbili yamehifadhiwa kwa sababu ndiyo yanayobeba ukali wa changamoto ya Ayubu.
