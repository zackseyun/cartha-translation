  yaml_path: translation/ot/job/017/006.yaml
  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: sw
  text: Amenifanya kuwa msemo wa dhihaka miongoni mwa mataifa[a], nami nimekuwa kitu cha kutemewa mate mbele ya watu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amenifanya kuwa methali miongoni mwa mataifa.” Neno la Kiebrania linaelekea kumaanisha msemo wa kimithali unaomhusu mtu kwa dhihaka.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “nami nimekuwa mate mbele ya nyuso,” yaani, kitu cha kudharauliwa waziwazi kwa kutemewa mate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: Amenifanya kuwa
  rationale: Hifili yenye kiambishi cha nafsi ya kwanza ina maana ya kusababisha Ayubu awe au kuwekwa katika hali fulani; Kiswahili hiki ni cha kawaida na hudumisha tendo la anayemtenda Ayubu.
- source_word: לִמְשֹׁל
  choice: kitu cha kudhihakiwa kwa mfano
  rationale: Neno hili lisilo la kawaida linaelekea kumaanisha mtu aliyefanywa mfano au msemo wa dhihaka. Tafsiri hii hudumisha wazo la fedheha ya kimithali bila kutumia neno lisiloeleweka kwa urahisi.
- source_word: עַמִּים
  choice: miongoni mwa mataifa
  rationale: Wingi wa עַמִּים umehifadhiwa kwa 'mataifa'; 'miongoni mwa' huonyesha kwa ufasaha eneo la kijamii ambamo Ayubu amekuwa mfano wa dhihaka.
- source_word: וְתֹפֶת
  choice: mtu ambaye watu humtemea mate
  rationale: Nomino hii inaashiria kutemewa mate au kuwa kitu cha kutemewa mate. Kiswahili hiki huweka wazi picha ya fedheha badala ya usemi halisi usio wa kawaida, 'mate mbele ya nyuso.'
- source_word: לְפָנִים
  choice: usoni
  rationale: Kirai halisi ni 'mbele ya nyuso'; katika muktadha huu kinamaanisha dharau ya wazi inayofanywa mbele ya mtu au usoni pake.
- source_word: אֶהְיֶה
  choice: nimekuwa
  rationale: Ingawa umbo ni kauli isiyotimilika, katika ushairi linaweza kueleza hali ya sasa iliyotokana na tendo lililotangulia; 'nimekuwa' hudumisha ulinganifu na 'amenifanya kuwa.'
theological_decisions:
- issue: Mhusika wa kitenzi 'amenifanya' hajatajwa wazi katika mstari huu
  choice: Kiwakilishi fiche cha Kiswahili kimehifadhiwa katika 'Amenifanya' bila kuongeza jina 'Mungu'
  alternative: Mungu amenifanya
  rationale: Kiebrania kina kiima cha nafsi ya tatu umoja lakini hakitaji jina katika mstari huu; kutolitaja hudumisha hali hiyo bila kuamua wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kitu cha kudhihakiwa kwa mfano' kinaeleweka kwa wasomaji wa kawaida huku tanbihi ikihifadhi uwezekano wa 'msemo wa dhihaka.' Taswira kali ya kutemewa mate usoni imehifadhiwa.
