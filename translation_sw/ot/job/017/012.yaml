  language: sw
  text: Wao hugeuza usiku kuwa mchana; husema, “Nuru iko karibu,” huku giza likiwapo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: hugeuza
  rationale: Kitenzi hiki hapa kina maana ya kufanya au kuweka kitu kiwe kingine; “hugeuza” ni Kiswahili cha kawaida kinachoonyesha kuufanya usiku kuwa mchana.
- source_word: אוֹר קָרוֹב
  choice: “Nuru iko karibu”
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira na tumaini linalodaiwa kuwa karibu.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: huku giza likiwapo
  rationale: Kirai hiki kihalisi ni “mbele ya/katika uso wa giza”; uchaguzi huu unatoa maana ya dai la nuru kutolewa licha ya uwepo wa giza, bila kutumia tamathali isiyo ya kawaida katika Kiswahili.
theological_decisions:
- issue: Mhusika wa kauli “Nuru iko karibu”
  choice: husema, “Nuru iko karibu”
  alternative: Nuru iko karibu
  rationale: Kiebrania hakina kitenzi cha kusema hapa, lakini muktadha na mpangilio wa kishairi vinaweza kueleza maneno hayo kuwa dai la wale wanaogeuza usiku kuwa mchana. Kuweka “husema” huifanya sentensi iwe ya kawaida katika Kiswahili bila kuibadili kuwa kauli ya mwandishi mwenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya usiku, mchana, nuru na giza imehifadhiwa; sentensi imeundwa kwa urahisi wa kueleweka na msomaji wa kawaida.
