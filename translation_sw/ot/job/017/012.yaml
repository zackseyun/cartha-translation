  source_fidelity: 'Tafsiri inahifadhi muundo na taswira ya Kiebrania: usiku kufanywa mchana, nuru kudaiwa kuwa karibu, na mkabala wa giza. Kuongeza “husema” ni ufafanuzi mdogo unaoendana na usomaji wa Kiingereza wa POB na hufanya kauli ya pili isikike kawaida kwa Kiswahili; hauleti madai mapya ya kiteolojia. “Huku giza likiwapo” huwasilisha kwa kawaida maana ya kimuktadha ya מִפְּנֵי חֹשֶׁךְ (‘katika uso wa/licha ya giza’), bila kudai kwa nguvu maana moja katika kirai chenye uwezekano wa tafsiri tofauti.'
