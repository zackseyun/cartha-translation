  text: Ninauita shimo, ‘Wewe ni baba yangu,’ na buu, ‘Wewe ni mama yangu na dada yangu.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: shimo
  rationale: Neno hili linaweza kumaanisha shimo au kaburi; ‘shimo’ huhifadhi picha halisi na uhusiano wake na mauti bila kulazimisha maana moja iliyo finyu zaidi.
- source_word: קָרָאתִי
  choice: Ninaliita
  rationale: Kitenzi קרא pamoja na kihusishi ל hapa kina maana ya kuita au kumwita mtu/kitu kwa jina la uhusiano; hali ya Kiswahili ‘ninaliita’ huonyesha tendo la sasa linalotokana na kauli ya Kiebrania.
- source_word: רִמָּה
  choice: buu
  rationale: Humaanisha funza/buu anayehusishwa na uozo wa maiti. ‘Buu’ ni neno la kawaida na lenye hadhi inayofaa katika muktadha huu.
theological_decisions:
- issue: Taswira ya uhusiano wa karibu na mauti na uozo
  choice: Kuhifadhi kauli za moja kwa moja ‘baba yangu,’ ‘mama yangu na dada yangu’
  alternative: Kufafanua kwamba Ayubu anajiona kuwa karibu sana na kaburi na uozo
  rationale: Kiebrania kinatumia sitiari kali ya kifamilia bila maelezo; tafsiri inapaswa kuhifadhi mvutano na picha hiyo badala ya kuifasiri ndani ya mstari.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanya vitenzi kwa kawaida ya Kiswahili: ‘kuliambia buu’ hufanya kauli ya pili iwe wazi, huku ukihifadhi usambamba wa Kiebrania.'
