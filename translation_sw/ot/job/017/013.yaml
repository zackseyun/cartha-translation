lexical_decisions:
- source_word: אִם
  choice: Ikiwa
  rationale: Huhifadhi nguvu ya sharti au dhana katika Kiebrania bila kuigeuza kimyakimya kuwa kauli ya wakati.
- source_word: אֲקַוֶּה
  choice: ninaitazamia
  rationale: Kitenzi קוה hapa kina wazo la kungojea kwa matarajio. ‘Ninaitazamia’ ni Kiswahili cha kawaida kinachobeba matarajio bila kutoa hisia chanya isiyofaa ambayo ‘natumainia’ ingeweza kuleta.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Unukuzi huhifadhi upana wa dhana ya Kiebrania kuhusu makao ya wafu badala ya kuifupisha kuwa kaburi la kuzikia tu.
- source_word: בֵּיתִי
  choice: kuwa makao yangu
  rationale: Uhusiano usio na kitenzi kati ya ‘Sheoli’ na ‘nyumba yangu’ unaelezwa kwa Kiswahili kwa ‘kuwa makao yangu’; ‘makao’ ni ya asili zaidi katika taswira ya mahali pa kudumu.
- source_word: בַּחֹשֶׁךְ
  choice: gizani
  rationale: Ni usemi wa kawaida na wenye hadhi unaowakilisha ‘katika giza’ na kudumisha taswira ya Sheoli.
- source_word: רִפַּדְתִּי
  choice: nimetandika
  rationale: Huhifadhi picha halisi ya kuandaa mahali pa kulala; wakati timilifu wa Kiebrania unaakisiwa kwa ‘nimetandika’.
- source_word: יְצוּעָי
  choice: kitanda changu
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya mahali pa kujilaza, huku ikidumisha taswira ya kifo kama pumziko.
theological_decisions:
- issue: Iwapo שְׁאוֹל itafsiriwe kwa neno lenye maana finyu
  choice: Sheoli
  alternative: kaburi; makao ya wafu
  rationale: ‘Sheoli’ huhifadhi upana na mvutano wa dhana ya Kiebrania bila kuifanya iwe kaburi la mwili pekee au kuingiza fundisho lililokuzwa baadaye kuhusu hali ya baada ya kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ninaitazamia’ huepuka maana chanya iliyo wazi ya ‘natumainia,’ na ‘makao’ huifanya sentensi iwe ya asili huku ikihifadhi sitiari ya nyumba. Alama ya koma ya mwisho inadumisha mwendelezo wa sentensi kwenda mstari unaofuata.
