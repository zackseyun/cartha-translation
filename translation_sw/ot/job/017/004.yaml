  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּֽי לִ֭בָּ/ם צָפַ֣נְתָּ מִּ/שָּׂ֑כֶל עַל כֵּ֝֗ן לֹ֣א תְרֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: sw
  text: Kwa maana umeificha mioyo yao mbali na ufahamu[a]; kwa hiyo hutawainua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mioyo yao isipate ufahamu.” Katika Kiebrania, “moyo” mara nyingi ni kitovu cha fikra na utambuzi, si hisia tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “hutawatukuza” au “hutawawezesha kushinda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Hutambulisha sababu au msingi wa kauli inayofuata na linafaa katika mtiririko wa kishairi.
- source_word: לִבָּם
  choice: mioyo yao
  rationale: Neno la Kiebrania 'moyo' humaanisha pia kitovu cha fikra, utashi na utambuzi. Kiswahili hutumia wingi kwa kawaida unapowarejelea watu wengi.
- source_word: צָפַנְתָּ
  choice: umeificha
  rationale: Huhifadhi tendo la moja kwa moja la Mungu la kuficha au kufunika na hali ya tendo lililokamilika.
- source_word: מִשָּׂכֶל
  choice: mbali na ufahamu
  rationale: Kiambishi מִן kinaonyesha kutengwa; 'ufahamu' hueleza uwezo wa kuelewa na kupambanua.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Ni kishazi cha kawaida cha kuonyesha matokeo yanayotokana na kauli ya kwanza.
- source_word: לֹא תְרֹמֵם
  choice: hutawainua
  rationale: Kitenzi רום humaanisha kuinua au kutukuza. 'Kuwainua' huhifadhi picha pana ya Kiebrania bila kuamua kimya kimya ikiwa maana ni kuwapa heshima au ushindi.
theological_decisions:
- issue: Wanaorejelewa na viambishi vya wingi ('yao' na 'wa')
  choice: Viambishi vinaachwa bila kutaja wazi kundi hilo; Ayubu anamwambia Mungu kuhusu 'wao'.
  alternative: Kuwataja kuwa wapinzani wa Ayubu au washirika wao.
  rationale: Vitenzi vya nafsi ya pili vinaonyesha kuwa Mungu ndiye anayeambiwa, lakini maandishi yenyewe hayatambulishi wazi kundi la nafsi ya tatu; hivyo tafsiri haiongezi utambulisho usiotajwa.
- issue: Maana ya 'kuwainua'
  choice: Kudumisha sitiari pana ya kuinua.
  alternative: Kuwatukuza au kuwawezesha kushinda.
  rationale: Muktadha unaweza kuhusisha cheo, heshima, au ushindi; neno pana linahifadhi mvutano huo wa kimaana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na usemi wa moja kwa moja kwa Mungu umehifadhiwa; 'mioyo yao' ni wa asili zaidi katika Kiswahili kuliko umoja wa Kiebrania wenye kiambishi cha wingi.
