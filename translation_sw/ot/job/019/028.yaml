  text: Mkisema[a], “Tutamwandamaje, kwa kuwa mzizi wa jambo unapatikana ndani yangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania cha mstari huu ni kigumu. Kishazi cha mwisho kinaweza pia kueleweka kuwa, “mzizi wa jambo unapatikana ndani yake,” kutegemea jinsi maandishi ya konsonanti na tafsiri za kale zinavyotathminiwa. Pia, wengine hulielewa neno lililotafsiriwa “kumwandama” kwa maana kali zaidi ya “kumtesa.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Mkisema
  rationale: Katika muktadha huu כִּי pamoja na kitenzi kinachofuata huanzisha kauli ya masharti; Kiswahili ‘Mkisema’ huiwasilisha kwa kawaida.
- source_word: תֹאמְרוּ
  choice: mkisema
  rationale: Ni Qal imperfect nafsi ya pili wingi; katika muundo huu wa masharti, ‘mkisema’ ni Kiswahili cha kawaida na huhifadhi wingi.
- source_word: מַה
  choice: -je
  rationale: מַה hapa ina maana ya kielezi cha kuuliza, ‘jinsi gani’; kiambishi ‘-je’ katika ‘Tutamfuatiliaje?’ ni cha asili katika Kiswahili.
- source_word: נִּרְדָּף
  choice: tutamfuatilia
  rationale: Mzizi רדף unaweza kumaanisha kufuatilia, kukimbiza, au kutesa. ‘Kumfuatilia’ huhifadhi taswira ya kumwandama bila kulazimisha maana kali zaidi.
- source_word: לוֹ
  choice: -m-
  rationale: ל־ inaonyesha anayefuatiliwa; katika Kiswahili yule anayelengwa huwakilishwa kawaida na kiambishi cha yambwa katika ‘tutamfuatilia.’
- source_word: וְשֹׁרֶשׁ
  choice: kwa kuwa mzizi
  rationale: וְ hapa linaweza kuunganisha kishazi kinachotoa sababu. ‘Kwa kuwa’ huonyesha uhusiano huo, huku ‘mzizi’ ukihifadhi sitiari ya שֹׁרֶשׁ.
- source_word: דָּבָר
  choice: wa jambo hili
  rationale: דָּבָר hapa ni suala linalozungumziwa, si lazima neno lililosemwa. ‘Jambo hili’ ni wazi na la kawaida katika Kiswahili.
- source_word: נִמְצָא
  choice: unapatikana
  rationale: Nifali ina maana ya hali tendwa au tokeo; ‘unapatikana’ huhifadhi maana hiyo bila kuifafanua kupita kiasi.
- source_word: בִי
  choice: ndani yangu
  rationale: בִי kwa kawaida ni ‘ndani yangu.’ Usomaji huu mgumu umehifadhiwa katika maandishi, huku uwezekano mwingine ukielezwa katika tanbihi.
