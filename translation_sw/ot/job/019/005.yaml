  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnajifanya wakuu juu yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kujikweza kwa gharama ya mtu mwingine.
