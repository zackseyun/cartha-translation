lexical_decisions:
- source_word: אִם אָמְנָם
  choice: Ikiwa kweli
  rationale: Muungano huu unaanzisha sharti lenye mkazo. “Ikiwa kweli” ni wa kawaida katika Kiswahili na huhifadhi hali ya sharti pamoja na msisitizo.
- source_word: עָלַי
  choice: dhidi yangu
  rationale: Katika vifungu vyote viwili kihusishi kinaonyesha uhasama, si mahali tu. “Dhidi yangu” kinafaa kwa muktadha wa marafiki wa Ayubu kujitenga naye na kujenga hoja dhidi yake.
- source_word: תַּגְדִּילוּ
  choice: mnajikweza
  rationale: Hifili ya גדל hapa ina wazo la mtu kujifanya mkuu juu ya mwingine. “Mnajikweza” ni usemi wa sasa, wa asili, unaobeba wazo la kujitukuza kwa gharama ya Ayubu.
- source_word: וְתוֹכִיחוּ
  choice: na kutumia ... kama ushahidi
  rationale: Hifili ya יכח inaweza kumaanisha kuthibitisha, kujenga hoja, au kusimamisha kesi. Kiswahili hiki kinaonyesha nguvu yake ya kimahakama bila kutumia tungo isiyo ya kawaida kama “kuthibitisha fedheha dhidi yangu.”
- source_word: חֶרְפָּתִי
  choice: fedheha yangu
  rationale: חֶרְפָּה huonyesha aibu, fedheha, au shutuma ya kijamii. “Fedheha” ni neno la kawaida lenye uzito unaofaa katika usemi huu.
