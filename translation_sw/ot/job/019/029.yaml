  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: sw
  text: Ogopeni upanga ninyi wenyewe, kwa maana ghadhabu huleta adhabu za upanga, ili mjue kwamba kuna hukumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba Mwenyezi yupo.” Usemi wa mwisho wa Kiebrania ni mgumu, na pia umeeleweka kuwa “kwamba kuna hukumu mbalimbali” au “kwamba kuna mwamuzi.”
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: Ninyi wenyewe iogopeni
  rationale: Kitenzi cha amri kwa wingi kinatoa onyo la kuogopa, na לָכֶם huongeza msisitizo unaowalenga wao wenyewe.
- source_word: מִפְּנֵי חֶרֶב
  choice: upanga
  rationale: Baada ya ‘iogopeni,’ Kiswahili cha kawaida hutaja kitu kinachoogopwa moja kwa moja; maana ni kuogopa kwa sababu ya tishio la upanga.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya onyo lililotangulia.
- source_word: חֵמָה
  choice: ghadhabu
  rationale: Neno hili huonyesha hasira kali yenye uzito wa kimaadili na wa hukumu.
- source_word: עֲוֺנוֹת חָרֶב
  choice: adhabu za upanga
  rationale: Ingawa עֲוֺנוֹת kwa kawaida huweza kumaanisha maovu au hatia, hapa muktadha wa upanga na hukumu unaunga mkono maana ya matokeo ya hatia, yaani adhabu zinazotekelezwa kwa upanga.
- source_word: לְמַעַן תֵּדְעוּן
  choice: ili mjue
  rationale: Muundo huu unaonyesha kusudi au matokeo yanayokusudiwa.
- source_word: שדין
  choice: kwamba kuna hukumu
  rationale: Usemi wa mwisho ni mgumu kimaandishi na kileksika. ‘Kuna hukumu’ unafaa katika muktadha wa onyo kuhusu haki ya kulipiza bila kuficha uwezekano wa tafsiri nyingine.
theological_decisions:
- issue: Maana ya usemi mgumu wa mwisho שדין
  choice: kwamba kuna hukumu
  alternative: kwamba Mwenyezi yupo; kwamba kuna hukumu mbalimbali; kwamba kuna mwamuzi
  rationale: Muktadha unaonya marafiki wa Ayubu kwamba wao pia wako chini ya haki ya hukumu. Tafsiri kuu inadumisha wazo hilo bila kubainisha kupita ushahidi wa maandishi; tafsiri nyingine muhimu zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ninyi wenyewe’ huhifadhi msisitizo wa kiwakilishi, huku ‘iogopeni upanga’ ikiwa onyo la kawaida na linaloeleweka. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
