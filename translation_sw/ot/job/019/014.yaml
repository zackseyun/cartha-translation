  text: חָדְל֥וּ קְרוֹבָ֑/י וּֽ/מְיֻדָּעַ֥/י שְׁכֵחֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: sw
  text: Jamaa zangu wameniacha,[a] na watu ninaofahamiana nao wamenisahau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jamaa zangu wamekoma kuwa karibu nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ
  choice: wameniacha
  rationale: Kitenzi חדל kimsingi humaanisha ‘kukoma’ au ‘kuacha.’ Kwa kuwa kiima ni jamaa za Ayubu, ‘wameniacha’ kinaeleza kwa Kiswahili cha kawaida kwamba wameacha kuwa karibu naye au kumsaidia, bila kuongeza wazo lisilokuwamo la kuondoka kimwili pekee.
- source_word: קְרוֹבָי
  choice: jamaa zangu
  rationale: קרוב ni ‘aliye karibu’ na katika muktadha huu humaanisha ndugu au watu wa ukoo. ‘Jamaa zangu’ ni usemi wa kawaida na mpana unaofaa hapa.
- source_word: וּמְיֻדָּעַי
  choice: watu ninaofahamiana nao
  rationale: Nomino hii inayotokana na ידע inawahusu watu wanaojulikana na msemaji. Tafsiri hii huhifadhi kiwango kisichobainishwa cha ukaribu bila kuwafanya moja kwa moja kuwa ‘marafiki.’
- source_word: שְׁכֵחוּנִי
  choice: wamenisahau
  rationale: שכח humaanisha ‘kusahau.’ Tafsiri ya moja kwa moja ‘wamenisahau’ inadumisha nguvu ya malalamiko ya Ayubu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Watu ninaofahamiana nao’ ni cha asili zaidi kuliko nomino ‘wafahamiani’ na huepuka kuzidisha ukaribu kwa kusema ‘marafiki.’ Alama ya tanbihi [a] imewekwa mara baada ya kishazi kinachohusika.
