  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: sw
  text: Tazama, ninapiga kelele, “Dhuluma!”[a] lakini sijibiwi; nalia kuomba msaada,[b] lakini hakuna haki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jeuri!” au “Ukatili!” Neno la Kiebrania linaweza kumaanisha vurugu, uovu, au kilio cha kisheria cha mtu aliyefanyiwa kosa zito.
    reason: lexical_alternative
  - marker: b
    text: Au, “nalia kwa ajili ya msaada.” Kitenzi hiki hurejelea kilio cha dharura cha kuomba msaada.
    reason: lexical_alternative
  - marker: c
    text: Au, “hakuna hukumu” au “hakuna uamuzi wa haki.” Neno la Kiebrania lina maana ya haki au uamuzi unaofaa katika shauri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tazama
  rationale: Ni neno la kusisitiza na kuvuta fikira. “Tazama” linahifadhi nguvu hiyo kwa lugha yenye hadhi bila kuifanya sentensi kuwa maelezo tu.
- source_word: אֶצְעַק
  choice: ninapaza sauti
  rationale: Kitenzi צעק huonyesha kilio kikubwa cha mtu aliye katika dhiki. “Ninapaza sauti” kinaonyesha ukubwa na uharaka wa kilio hicho.
- source_word: חָמָס
  choice: Dhuluma!
  rationale: Neno hili linaweza kumaanisha ukatili, jeuri, au kosa zito linalolalamikiwa. “Dhuluma!” ni kilio cha kawaida na chenye nguvu cha mtu anayedai ametendewa vibaya, huku upana wa neno la Kiebrania ukielezwa katika tanbihi.
- source_word: אֵעָנֶה
  choice: sijibiwi
  rationale: 'Hii inahifadhi hali ya kutendwa ya kitenzi: Ayubu anapaza sauti lakini hapati jibu. Haibadili kauli kuwa maelezo kwamba hasikilizwi.'
- source_word: אֲשַׁוַּע
  choice: ninalilia msaada
  rationale: Kitenzi hiki humaanisha kutoa kilio cha dharura ili kupata msaada. “Ninalilia msaada” ni Kiswahili cha kawaida na kinahifadhi usambamba wa kishairi na kishazi cha kwanza.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha huu neno lina maana ya haki inayotolewa kupitia uamuzi au usikilizwaji unaofaa. “Haki” ni wazi na ya kawaida, huku maana zake za kisheria zikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Asili ya malalamiko ya Ayubu kuhusu Mungu
  choice: Kauli imewasilishwa kama kilio kisichojibiwa na malalamiko kwamba hakuna haki, bila kupunguza uzito wa shutuma ya Ayubu.
  alternative: Kutumia maneno yasiyo ya moja kwa moja ili kuepuka kudokeza kwamba Mungu hampatii Ayubu haki.
  rationale: Kiebrania kinaonyesha wazi kwamba Ayubu analalamikia dhuluma, hajibiwi, na haoni haki. Tafsiri inapaswa kuhifadhi mvutano huu wa kiteolojia badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usambamba wa kishairi umehifadhiwa kwa “ninapaza sauti” na “ninalilia msaada,” na sentensi fupi zinatunza ukali wa maombolezo ya Ayubu.
