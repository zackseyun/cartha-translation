base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: sw
  text: Nihurumieni[a], nihurumieni, enyi rafiki zangu, kwa maana mkono wa Mungu umenipiga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nionyesheni neema” au “Nirehemuni.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mkono wa Mungu umenigusa”; hapa kugusa huko kunamaanisha kuniletea madhara, ndiyo maana imetafsiriwa “umenipiga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: Nihurumieni
  rationale: Kitenzi hiki ni amri ya wingi inayowaelekea rafiki za Ayubu. Katika muktadha huu, “nihurumieni” linaeleza ombi la kutendewa kwa rehema na huruma kwa Kiswahili cha kawaida na chenye heshima.
- source_word: חָנֻּנִי (repeated)
  choice: nihurumieni
  rationale: Urudiaji umehifadhiwa ili kudumisha uzito wa kihisia na msisitizo wa kishairi wa ombi la Ayubu.
- source_word: רֵעַי
  choice: enyi rafiki zangu
  rationale: Neno רֵעַ humaanisha rafiki au mwenzi. “Enyi rafiki zangu” linahifadhi wito wa moja kwa moja na matarajio kwamba watu hao wangemwonea Ayubu huruma.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya ombi. “Kwa maana” kinafaa katika lugha yenye hadhi bila kuwa cha kizamani.
- source_word: יַד אֱלוֹהַּ
  choice: mkono wa Mungu
  rationale: Taswira ya Kiebrania ya tendo au nguvu ya Mungu imehifadhiwa badala ya kufafanuliwa kwa maneno yasiyo ya kitamathali.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni umbo la kishairi la umoja linalomtaja Mungu; muktadha hauhitaji kuongezwa kwa jina au sifa nyingine.
- source_word: נָגְעָה בִּי
  choice: umenipiga
  rationale: נגע pamoja na ב inaweza kumaanisha kugusa, kupiga, au kuleta madhara. Katika muktadha wa mateso ya Ayubu, “umenipiga” linafikisha athari yenye kuumiza, huku tanbihi ikihifadhi maana halisi ya msingi, “umenigusa.”
theological_decisions:
- issue: Uhusika wa Mungu katika mateso ya Ayubu
  choice: mkono wa Mungu umenipiga
  alternative: mkono wa Mungu umenigusa / mkono wa Mungu umenitesa
  rationale: Kiebrania kinayahusisha mateso ya Ayubu moja kwa moja na tendo la Mungu kupitia taswira ya mkono wake. Tafsiri inahifadhi mvutano huo wa kiteolojia bila kuupunguza au kuueleza kwa mfumo fulani wa mafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa ombi na taswira ya “mkono wa Mungu” zimehifadhiwa; “enyi” limetumiwa kuonyesha wito wa moja kwa moja kwa rafiki wengi.
