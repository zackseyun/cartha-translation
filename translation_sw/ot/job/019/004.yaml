  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: sw
  text: Na hata ikiwa kweli nimekosea, kosa langu linabaki kwangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi zaidi, “kosa langu linakaa nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אָמְנָם
  choice: Na hata ikiwa kweli
  rationale: Muunganiko huu unaendeleza hoja ya mstari uliotangulia na kuwasilisha kauli ya kukubali jambo kwa sharti huku ukilisisitiza. Tafsiri hii ni ya kawaida katika Kiswahili na haiifanyi kauli kuwa ungamo la moja kwa moja lisilo na sharti.
- source_word: שָׁגִיתִי
  choice: nimekosea
  rationale: Kitenzi hiki humaanisha kupotoka au kufanya kosa. “Nimekosea” ni Kiswahili cha sasa kinachoeleweka vizuri na hakiongezi wazo mahsusi la dhambi ambalo neno lenyewe halilazimishi hapa.
- source_word: אִתִּי
  choice: kwangu
  rationale: Katika muundo huu maana yake ni kwamba kosa hilo linabaki kuwa jambo la Ayubu mwenyewe. “Kwangu” hutoa maana hiyo kwa Kiswahili cha kawaida bila kuligeuza kuwa kosa lililo “dhidi yangu.”
- source_word: תָּלִין
  choice: linabaki
  rationale: Kitenzi לין kwa msingi humaanisha kukaa au kulala mahali, lakini hapa kinatumika kwa maana ya kuendelea kuwapo. “Linabaki” huwasilisha maana ya msemo huo kwa uwazi; taswira halisi imehifadhiwa katika tanbihi.
- source_word: מְשׁוּגָתִי
  choice: kosa langu
  rationale: Nomino hii huonyesha kosa au kupotoka. “Kosa langu” inaendana na “nimekosea” na haifasiri neno hilo kwa upana zaidi kuwa “dhambi yangu.”
