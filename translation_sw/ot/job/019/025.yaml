  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: sw
  text: Lakini mimi najua kwamba Mkombozi wangu[a] yu hai, na baadaye atainuka juu ya vumbi[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtetezi wangu.” Neno la Kiebrania גֹּאֵל linaweza kumaanisha mkombozi, mtetezi, au mtu anayesimamia haki ya mwanafamilia.
    reason: lexical_alternative
  - marker: b
    text: Au, “na mwishowe atasimama juu ya nchi.” Kifungu hiki cha Kiebrania ni kigumu, na pia kimeeleweka kuwa, “naye akiwa wa mwisho atasimama juu ya vumbi.”
    reason: alternative_reading
  - marker: c
    text: “Vumbi” linaweza kudokeza mauti, kaburi, au ardhi; neno la Kiebrania kihalisi ni “vumbi.”
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lakini mimi
  rationale: Kiwakilishi huru pamoja na kiunganishi kinakazia dai la Ayubu na kulinganisha msimamo wake na yaliyotangulia; “Lakini mimi” huleta mkazo huo kwa Kiswahili cha kawaida.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kauli timilifu ya Kiebrania hapa inaonyesha uhakika uliothibitika wenye umuhimu wa sasa; “najua” huwasilisha maana hiyo kwa ufasaha.
- source_word: גֹּאֲלִי
  choice: Mkombozi wangu
  rationale: Neno גאל humaanisha mwenye wajibu wa kifamilia wa kukomboa, kutetea, au kusimamia haki ya ndugu. “Mkombozi wangu” huhifadhi upana na uzito wa neno bila kumtambulisha mhusika kwa undani usiotajwa na mstari.
- source_word: חָי
  choice: yu hai
  rationale: Kivumishi cha Kiebrania kinathibitisha kwamba Mkombozi anaishi. “Yu hai” ni usemi wa sasa, wenye hadhi na unaoeleweka kwa urahisi.
- source_word: וְאַחֲרוֹן
  choice: na baadaye
  rationale: אַחֲרוֹן inaweza kueleweka kama kielezi, “baadaye/mwishowe,” au kama nomino, “wa mwisho.” “Baadaye” huhifadhi uwezekano wa kielezi bila kuingiza dai maalumu zaidi la kieskatolojia.
- source_word: יָקוּם
  choice: atainuka
  rationale: קום inaweza kumaanisha kuinuka, kusimama, au kujitokeza. “Atainuka” huhifadhi mwendo wa picha na haifungi maana katika tukio la mahakama pekee.
- source_word: עַל עָפָר
  choice: juu ya vumbi
  rationale: עַל inaweza kumaanisha juu ya, katika, au dhidi ya; עָפָר ni “vumbi” kihalisi. Tafsiri hii huhifadhi picha na kutofafanua mapema kuwa ni dunia au kaburi.
theological_decisions:
- issue: Utambulisho na kazi ya גֹּאֵל wa Ayubu
  choice: Mkombozi wangu
  alternative: Mtetezi wangu; mkombozi wa ukoo wangu
  rationale: Kiebrania hakisemi wazi kama mhusika ni Mungu moja kwa moja, shahidi wa mbinguni, au Mkombozi anayeeleweka kimasihi. Tafsiri pana huhifadhi mvutano huo wa kiteolojia.
- issue: Nguvu ya kieskatolojia ya וְאַחֲרוֹן ... יָקוּם
  choice: na baadaye atainuka juu ya vumbi
  alternative: na mwishowe atasimama juu ya nchi; naye akiwa wa mwisho atasimama juu ya vumbi
  rationale: Muundo huu una utata wa kisintaksia na kiteolojia. Tafsiri kuu haubadili mstari kuwa kauli iliyo wazi zaidi kuhusu ufufuo kuliko Kiebrania chenyewe, huku chaguo muhimu zikihifadhiwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yu hai” hudumisha mtindo wa kishairi unaoeleweka, huku sentensi nyingine ikibaki ya kawaida. Tanbihi zimewekwa kwenye maneno husika: [a] baada ya “Mkombozi wangu,” na [b][c] baada ya kifungu chenye utata kuhusu vumbi.'
