  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: sw
  text: 'Pumzi yangu inamchukiza mke wangu,

    nami ni chukizo kwa wana wa mwili wangu.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata uelewa mwingine wa Kiebrania hiki kigumu: “na ombi langu ni kwa wana wa mwili wangu,” au “ninawasihi wana wa mwili wangu wanihurumie.”'
    reason: alternative_reading
  - marker: b
    text: Kiebrania kwa tafsiri halisi ni “wana wa tumbo langu.” Usemi huo unaweza kumaanisha watoto wa Ayubu mwenyewe au, kwa maana pana zaidi, ndugu zake wa karibu wa damu.
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: Pumzi yangu
  rationale: רוּחַ inaweza kumaanisha pumzi, upepo, au roho; katika muktadha wa mateso ya mwili wa Ayubu na jinsi mke wake anavyoitikia, maana halisi ya ‘pumzi’ inafaa zaidi.
- source_word: זָרָה
  choice: inamchukiza
  rationale: Neno hili kimsingi huonyesha kuwa kitu ni kigeni au kisicho cha kawaida, na katika muktadha huu linadokeza hali inayomfanya mke wake ajitenge naye kwa kuchukizwa. Tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: לְאִשְׁתִּי
  choice: mke wangu
  rationale: Kihusishi לְ humtaja mtu anayeathiriwa; kitenzi cha Kiswahili ‘inamchukiza’ huonyesha uhusiano huo moja kwa moja bila kulazimisha kihusishi tofauti.
- source_word: וְחַנֹּתִי
  choice: nami ni chukizo
  rationale: Umbo hili la Kiebrania ni gumu. Maana ya kuchukiza inaendeleza usambamba wa kishairi na kishazi cha kwanza, lakini uwezekano wa kulielewa kuwa ombi la kuhurumiwa umehifadhiwa katika tanbihi.
- source_word: לִבְנֵי
  choice: kwa wana wa
  rationale: בְּנֵי ni ‘wana wa.’ Neno ‘wana’ linadumisha uwazi wa muundo wa Kiebrania, huku tanbihi ikieleza upana unaowezekana wa usemi huo.
- source_word: בִטְנִי
  choice: mwili wangu
  rationale: בֶּטֶן kwa kawaida ni tumbo au tumbo la uzazi. Katika usemi huu, ‘mwili wangu’ linawasilisha uhusiano wa kimwili au wa damu kwa Kiswahili kinachoeleweka, huku maana halisi zaidi ikitajwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa ‘wana wa mwili wangu’
  choice: Usemi umeachwa wazi unaweza kutaja watoto wa Ayubu au ndugu zake wa karibu wa damu.
  alternative: Kuufanya usemi umaanishe watoto wake mwenyewe tu.
  rationale: Kiebrania hakiondoi uwezekano mpana wa jamaa wa damu, na muktadha wa kitabu hufanya utambulisho huo kuwa mgumu; hivyo haifai kuamua zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mistari miwili inadumisha usambamba wa kishairi. ‘Ni chukizo’ ni usemi wenye uzito unaofaa kwa maombolezo ya Ayubu, huku tanbihi zikihifadhi ugumu wa Kiebrania na kutokuweka maana moja kwa lazima.
