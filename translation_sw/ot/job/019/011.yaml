base_translation:
  language: en
  yaml_path: translation/ot/job/019/011.yaml
  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: sw
  text: Hasira yake ikawaka dhidi yangu, naye akanihesabu kuwa mmoja wa adui zake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחַר
  choice: ikawaka
  rationale: Kitenzi חרה pamoja na אַף ni nahau ya hasira kuwaka. Kiswahili “ikawaka” huhifadhi sitiari ya Kiebrania kwa lugha ya kawaida na yenye hadhi; wakati uliopita pia unaakisi umbo la wayyiqtol.
- source_word: עָלַי
  choice: dhidi yangu
  rationale: עַל pamoja na hasira huonyesha uhasama unaoelekezwa kwa mtu; “dhidi yangu” huwasilisha maana hiyo kwa uwazi.
- source_word: אַפּוֹ
  choice: hasira yake
  rationale: Ingawa אַף maana yake ya msingi ni “pua,” katika nahau hii humaanisha hasira. Tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: וַיַּחְשְׁבֵנִי
  choice: akanihesabu
  rationale: חשב hapa humaanisha kumwona au kumweka mtu katika kundi fulani. “Akanihesabu” ni fupi na hudumisha taswira ya kumhesabu Jobu miongoni mwa maadui.
- source_word: לוֹ
  choice: zake
  rationale: 'Kiwakilishi hiki huonyesha uhusiano na mtazamo wa mhusika wa kiume: Jobu anahesabiwa kuwa katika kundi la adui zake.'
- source_word: כְצָרָיו
  choice: kuwa mmoja wa adui zake
  rationale: צָר ni adui au mpinzani, na umbo la hapa ni wingi lenye kiambishi cha nafsi ya tatu ya kiume. “Mmoja wa adui zake” huhifadhi wingi wa kundi huku likitoa Kiswahili cha kawaida kwa mtu mmoja anayehesabiwa miongoni mwao.
theological_decisions:
- issue: Mhusika wa nafsi ya tatu na mwenye viambishi
  choice: Mhusika anaendelea kuwa Mungu katika malalamiko ya Jobu.
  alternative: Mhusika fulani wa uhasama ambaye hajatajwa
  rationale: Muktadha wa Jobu 19:6–12 unaonyesha kuwa Jobu anayahusisha matendo haya na Mungu. Tafsiri inadumisha mvutano huo wa kiteolojia bila kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hasira yake ikawaka” huhifadhi sitiari ya chanzo, na “mmoja wa adui zake” huhifadhi maana ya wingi bila kufanya sentensi iwe ngumu.
