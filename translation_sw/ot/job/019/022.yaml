  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: sw
  text: Kwa nini mnaniniandama kama Mungu[a], wala hamshibi kwa nyama yangu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama mungu.” Neno la Kiebrania אֵל laweza pia kumaanisha “mungu” au, kwa uwezekano mdogo zaidi hapa, “mwenye nguvu.”
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “kutoka katika nyama yangu.” Huenda usemi huu unamaanisha kujishibisha kwa kuila au kuila kwa uhasama nyama yenyewe ya Ayubu—taswira kali ya uhasama usiokoma.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Ni kielezi cha kuuliza kinachoanzisha malalamiko ya Ayubu.
- source_word: תִּרְדְּפֻנִי
  choice: mnanifuatilia
  rationale: Kitenzi רדף humaanisha kufuatilia, kukimbiza, au kutesa. Hapa ‘mnanifuatilia’ kinadumisha picha ya kumwandama kwa uhasama bila kufafanua mno aina ya mateso.
- source_word: כְמוֹ
  choice: kama
  rationale: Ni kiunganishi cha ulinganisho; ‘kama’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: אֵל
  choice: Mungu
  rationale: Ingawa אֵל yaweza kumaanisha mungu au mwenye nguvu, katika muktadha huu yaelekea Ayubu analinganisha ukali wa rafiki zake na tendo la Mungu la kumwandama au kumhukumu.
- source_word: וּמִבְּשָׂרִי
  choice: na nyama yangu
  rationale: Kihalisi ni ‘kutoka katika nyama yangu’; pamoja na שבע, מן huonyesha kitu ambacho mtu anajishibisha nacho. ‘Nyama yangu’ inadumisha taswira halisi na kali ya Kiebrania kuliko ‘mwili wangu.’
- source_word: לֹא תִשְׂבָּעוּ
  choice: wala hamshibishwi
  rationale: Kitenzi שבע ni kushiba au kutosheka. ‘Hamshibishwi’ kinahifadhi sitiari ya uhasama usiotosheka na kinaendana kwa kawaida na ‘nyama yangu.’
theological_decisions:
- issue: Mrejelewa wa אֵל katika כְמוֹ אֵל
  choice: Mungu
  alternative: mungu; mwenye nguvu
  rationale: Muktadha unaunga mkono ulinganisho na Mungu anayemwandama au kumhukumu Ayubu. Hata hivyo, maana pana ya neno la Kiebrania imehifadhiwa katika tanbihi badala ya kuondoa utata kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Wingi katika ‘mnanifuatilia/hamshibishwi’ unaonyesha kwamba Ayubu anawaambia rafiki zake. Taswira ya ‘nyama’ imehifadhiwa kwa sababu ni ya makusudi na yenye nguvu katika chanzo.
