  text: How long will you torment me and crush me with words?[a]
translation:
  language: sw
  text: Mpaka lini mtanitesa na kuniponda kwa maneno?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mpaka lini mtaihuzunisha nafsi yangu na kuniponda kwa maneno?”
    reason: Neno la Kiebrania linalotafsiriwa “mtanitesa” linaweza kumaanisha “mtaihuzunisha,” na נַפְשִׁי linaweza kutafsiriwa moja kwa moja “nafsi yangu.”
lexical_decisions:
- source_word: עַד אָנָה
  choice: Mpaka lini
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi swali la kilio kuhusu muda.
- source_word: תּוֹגְיוּן
  choice: mtanitesa
  rationale: Kitenzi katika muktadha huu kinaonyesha kusababisha huzuni au mateso ya ndani; “kunitesa” ni cha asili na chenye nguvu katika Kiswahili.
- source_word: נַפְשִׁי
  choice: -ni- (mimi)
  rationale: Neno נֶפֶשׁ hapa linamwakilisha Ayubu mwenyewe, hasa utu wake wa ndani. Kiambishi cha yambwa “-ni-” kinaeleza maana hiyo bila kuleta mgawanyo usiokusudiwa kati ya nafsi na mtu.
- source_word: וּתְדַכְּאוּנַנִי
  choice: na kuniponda
  rationale: “Kuniponda” huhifadhi taswira kali ya kuvunjwa au kukandamizwa iliyomo katika mzizi דכא.
- source_word: בְמִלִּים
  choice: kwa maneno
  rationale: 'Kihusishi בְּ kinaonyesha njia au chombo: maneno yao ndiyo yanayomponda.'
