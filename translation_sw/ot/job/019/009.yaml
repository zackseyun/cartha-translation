  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: sw
  text: Amenivua heshima yangu, na akaondoa taji kichwani mwangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utukufu wangu” au “hadhi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: heshima yangu
  rationale: Katika maombolezo haya, neno hili linaonyesha heshima, hadhi, au utukufu wa Ayubu uliopotea. ‘Heshima yangu’ ni ya kawaida na inaeleza vizuri kushushwa kwa hadhi yake.
- source_word: מֵעָלַי
  choice: yangu
  rationale: Kiebrania kina maana halisi ya ‘kutoka juu yangu’; pamoja na kitenzi cha kuvua, Kiswahili cha asili husema ‘amenivua heshima yangu,’ kikidumisha wazo la kuondolewa kitu kilichokuwa juu yake.
- source_word: הִפְשִׁיט
  choice: amenivua
  rationale: Kitenzi hiki hutumiwa kwa kuvua au kuondoa kilichofunika. ‘Amenivua’ kinahifadhi taswira hai ya Ayubu kupokonywa heshima kana kwamba ni vazi.
- source_word: וַיָּסַר
  choice: kuliondoa
  rationale: Hifili ya סור ina maana ya kuondoa au kuchukua. ‘Kuliondoa’ ni wazi na hudumisha ulinganifu wa kishairi na ‘amenivua.’
- source_word: עֲטֶרֶת
  choice: taji
  rationale: Neno hili humaanisha taji au shada linalowakilisha heshima na hadhi. ‘Taji’ linaeleweka kwa urahisi na linahifadhi sitiari.
- source_word: רֹאשִׁי
  choice: kichwani mwangu
  rationale: Hii ni namna ya asili ya Kiswahili kueleza kuondolewa kwa taji lililokuwa juu ya kichwa, bila kupoteza taswira ya Kiebrania.
theological_decisions:
- issue: Mtendaji ambaye hajatajwa kwa jina
  choice: Kiambishi cha nafsi ‘a-’ kinamrejelea Mungu katika muktadha, bila kumtaja moja kwa moja.
  alternative: Adui au hali fulani isiyotajwa ndiyo inayotenda.
  rationale: Muktadha wa karibu unaonyesha kuwa Ayubu anamhesabia Mungu mateso haya. Tafsiri haiongezi jina ‘Mungu,’ hivyo inadumisha ufupi wa Kiebrania na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kishairi lakini unaeleweka kwa urahisi; taswira mbili za kuvuliwa heshima na kuondolewa taji zimehifadhiwa.
