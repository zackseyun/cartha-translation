lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: wananichukia kabisa
  rationale: Kitenzi תעב kinaonyesha chuki kali yenye hisia ya kukirihika, si kutopenda tu. Kauli hii ya Kiswahili ni ya kawaida na inadumisha uzito wa kilio cha Ayubu.
- source_word: כָּל
  choice: wote
  rationale: Neno hili lina maana jumuishi; “wote” ni tafsiri ya kawaida ya Kiswahili inayolingana na nomino ya watu.
- source_word: מְתֵי סוֹדִי
  choice: watu wa faragha yangu
  rationale: Kirai hiki kihalisi kinahusu watu wa kikao au siri ya mtu, yaani watu wa mduara wake wa ndani anaowaamini. “Watu wa faragha yangu” kinadumisha wazo la usiri na ukaribu bila kukifanya kiwe urafiki tu.
- source_word: וְזֶה
  choice: nao
  rationale: Ingawa זֶה ni umbo la umoja, hapa linafuatwa na kitenzi cha wingi na linaeleweka kwa maana ya kijumla. “Nao” ni ya asili katika Kiswahili na huunganisha kundi hilo na kishazi kinachofuata.
- source_word: אָהַבְתִּי
  choice: niliowapenda
  rationale: Kauli hii inaonyesha upendo wa Ayubu kwa watu hao; wakati uliopita unafaa katika muktadha wa maombolezo.
- source_word: נֶהְפְּכוּ
  choice: wamenigeuka
  rationale: Nifali ya הפך hapa inaonyesha mabadiliko au kugeuka kwa msimamo. “Wamenigeuka” ni usemi wa kawaida unaoonyesha kwamba waliokuwa karibu naye sasa wamekuwa dhidi yake.
- source_word: בִי
  choice: -ni- katika “wamenigeuka”
  rationale: Kihusishi בִי kina maana ya uelekeo wenye uadui katika muktadha huu. Kiswahili huiwasilisha kwa kawaida kwa kiambishi cha yambwa katika kitenzi “wamenigeuka.”
