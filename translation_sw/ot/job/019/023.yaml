  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: sw
  text: Laiti sasa maneno yangu yangeandikwa! Laiti yangeandikwa kwa kuchongwa katika kitabu[a][b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika gombo” au “katika hati.” Neno la Kiebrania סֵפֶר linaweza kumaanisha kitabu, gombo, au hati iliyoandikwa.
    reason: cultural_note
  - marker: b
    text: Au, “yangeandikwa kwa kuchorwa.” Kitenzi cha Kiebrania חקק hudokeza kuandika au kutia alama kwa namna ya kudumu, kama kwa kuchonga.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Laiti
  rationale: Nahau hii inaeleza tamanio kubwa, wala si swali halisi kuhusu mtu atakayetoa kitu. “Laiti” ni Kiswahili cha kawaida na chenye nguvu ya kioptativi.
- source_word: אֵפוֹ
  choice: sasa
  rationale: Chembe hii inaongeza msisitizo na hisia ya haraka; “sasa” inadumisha uzito huo bila kufafanua kupita kiasi.
- source_word: וְיִכָּתְבוּן
  choice: yangeandikwa
  rationale: Umbo hili lina maana ya kutendwa na limo ndani ya tamani; umbo la “yange-” linaeleza vizuri jambo linalotamaniwa.
- source_word: מִלָּי
  choice: maneno yangu
  rationale: Hili ndilo tafsiri ya moja kwa moja na ya kawaida ya nomino ya wingi yenye kiambishi cha nafsi ya kwanza.
- source_word: בַּסֵּפֶר
  choice: kitabuni
  rationale: סֵפֶר inaweza kuwa kitabu, hati, au gombo. “Kitabuni” ni ya asili katika Kiswahili cha sasa, huku upana wa neno la Kiebrania ukihifadhiwa katika tanbihi.
- source_word: וְיֻחָקוּ
  choice: yangeandikwa
  rationale: Kitenzi חקק hapa kinaweza kumaanisha kuandika kwa kuchora au kuchonga ili maneno yadumu. Katika muktadha wa סֵפֶר, “yangeandikwa” ni ya asili; maana maalumu zaidi ya kuchorwa au kuchongwa imewekwa katika tanbihi.
