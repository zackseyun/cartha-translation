base_translation:
  language: en
  yaml_path: translation/ot/job/019/010.yaml
  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: sw
  text: Ananibomoa kutoka pande zote[a], nami nimepotea; analing'oa tumaini langu kama mti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami ninaenda.” Kihalisi Kiebrania husema, “nami ninaenda”; baada ya kubomolewa, huenda ikimaanisha kwamba Ayubu amekwisha au ametoweka.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: ananibomoa
  rationale: Kitenzi נתץ humaanisha kubomoa au kuangusha. ‘Ananibomoa’ huhifadhi nguvu ya uharibifu na kiambishi cha mtendwa ‘-ni’ kilicho wazi katika Kiebrania.
- source_word: סָבִיב
  choice: pande zote
  rationale: Hutoa maana ya kuzungukwa kabisa au kushambuliwa kutoka kila upande kwa Kiswahili cha kawaida.
- source_word: וָאֵלַךְ
  choice: nami ninaangamia
  rationale: Kihalisi ni ‘nami ninaenda,’ lakini katika muktadha wa kubomolewa huonyesha matokeo ya kuondolewa au kuangamia. ‘Ninaangamia’ ni ya asili na hudumisha uzito wa kilio cha Ayubu.
- source_word: וַיַּסַּע
  choice: analing'oa
  rationale: נסע hapa ina maana ya kung'oa au kuondoa kitu kilichokita. Pamoja na mfano wa mti, ‘analing'oa’ hudumisha taswira hiyo kwa usahihi.
- source_word: כָּעֵץ
  choice: kama mti
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya tashbihi hiyo.
- source_word: תִּקְוָתִי
  choice: tumaini langu
  rationale: תקוה humaanisha tumaini au matarajio; ‘tumaini langu’ ni wazi, la kawaida, na linafaa katika kilio hiki.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wenye nguvu, ukiendeleza taswira mbili za kubomolewa na kung'olewa. Hakuna tanbihi iliyoongezwa kwa sababu ‘ninaangamia’ huwasilisha kwa uwazi maana ya kimuktadha ya וָאֵלַךְ bila kuhitaji mbadala katika matini.
