  naturalness: The proposed revision is idiomatic, concise Standard East African Swahili. Adding ‘kutoka’ makes the comprehensive directional force of ‘on every side’ more natural. ‘Nami nimepotea’ naturally communicates the contextual result, while the note retains the literal alternative.
