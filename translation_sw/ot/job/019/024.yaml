  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Kalamu ya kuchongea' huepuka neno la kitaalamu lisilo la kawaida, na 'mwambani' huhifadhi picha halisi ya mwamba.
