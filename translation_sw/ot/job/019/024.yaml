translation:
  language: sw
  text: kwa kalamu ya chuma na risasi[a]—yachongwe mwambani milele![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda risasi ilikuwa metali iliyotumiwa pamoja na kifaa cha chuma, labda kujaza herufi zilizochongwa ili zionekane wazi; hata hivyo, maandishi hayasemi hivyo moja kwa moja.
    reason: cultural_note
  - marker: b
    text: Au, “yakatwe mwambani milele.” Kwa kawaida kitenzi cha Kiebrania humaanisha kuchonga au kukata; hapa kinahusu maneno yanayochongwa mwambani ili yadumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט
  choice: kwa kalamu ya kuchongea
  rationale: עֵט ni kifaa cha kuandikia au kuchongea. Kwa kuwa hapa kimetengenezwa kwa chuma na kinatumika mwambani, maana inayofaa ni kalamu ya kuchongea, si kalamu ya wino.
- source_word: בַּרְזֶל
  choice: ya chuma
  rationale: Neno hilo hutaja metali ya chuma na linaonyesha nyenzo iliyotengeneza kalamu ya kuchongea.
- source_word: וְעֹפָרֶת
  choice: pamoja na risasi
  rationale: עֹפָרֶת ni metali ya risasi. Tafsiri inaitaja bila kufafanua matumizi yake, kwa sababu maandishi ya Kiebrania hayatoi ufafanuzi huo.
- source_word: לָעַד
  choice: milele
  rationale: Neno hilo linaonyesha kudumu bila kukoma na linafaa kwa tamanio la kuhifadhi maneno kwa kudumu.
- source_word: בַּצּוּר
  choice: mwambani
  rationale: צוּר humaanisha mwamba. Umbo la mahali 'mwambani' linaonyesha kwamba maneno yanakatwa ndani ya mwamba, huku likibaki la kawaida katika Kiswahili.
- source_word: יֵחָצְבוּן
  choice: yachongwe
  rationale: Kitenzi חצב kwa kawaida humaanisha kuchonga, kukata, au kutoboa. Katika muktadha wa maneno yanayowekwa mwambani, 'yachongwe' huwasilisha tendo hilo na hali ya tamanio ya kitenzi.
