translation:
  language: sw
  text: Mfupa wangu umeshikamana na ngozi yangu na nyama yangu[a], nami nimenusurika kwa ngozi ya meno yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “mfupa wangu” katika umoja; huenda umoja huo unawakilisha mifupa yote au kiunzi cha mwili wa Ayubu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ngozi ya meno yangu.” Msemo huu wa Kiebrania huonyesha kunusurika kwa shida sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: na ngozi yangu na nyama yangu
  rationale: Katika muundo unaotawaliwa na דבק, viambishi ב vinaonyesha vitu ambavyo mfupa umeshikamana navyo. “Ngozi” na “nyama” huhifadhi taswira halisi ya hali ya mwili wa Ayubu.
- source_word: דָּבְקָה עַצְמִי
  choice: Mfupa wangu umeshikamana
  rationale: דבק humaanisha kushikamana au kung’ang’ania. Umoja wa עַצְמִי umehifadhiwa kama “mfupa wangu,” ingawa huenda umetumiwa kwa maana ya jumla ya mifupa au kiunzi cha mwili.
- source_word: וָאֶתְמַלְּטָה
  choice: nami nimenusurika
  rationale: Kitenzi מלט huonyesha kuponyoka au kunusurika. “Nimenusurika” kinaeleza kwamba Ayubu amebaki hai katika hali yake mbaya bila kuingiza maana ya kidini inayoweza kudokezwa na “nimeokoka.”
- source_word: בְּעוֹר שִׁנָּי
  choice: kwa ngozi ya meno yangu
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania, ambayo ni isiyo ya kawaida na ina utata. Maelezo ya chini yanaonyesha maana ya kawaida ya kunusurika kwa shida sana bila kuficha uwezekano mwingine wa kuielewa.
