translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Umeshikamana” ni cha kawaida na wazi kwa hali ya mwili; “nimenusurika” huepuka maana ya kimadhehebu. Taswira ngumu ya “ngozi ya meno” imehifadhiwa katika matini na kufafanuliwa kwa tahadhari katika tanbihi.
