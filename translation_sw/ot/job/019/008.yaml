  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: sw
  text: Ameiziba njia yangu kwa ukuta, hata nisiweze kupita[a], naye ameweka giza juu ya mapito yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mhusika wa kitenzi hakutajwa wazi katika Kiebrania; katika muktadha Ayubu anamzungumzia Mungu, ingawa mstari wenyewe humwacha akiwa wa nafsi ya tatu asiyeelezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: njia yangu
  rationale: Neno hilo humaanisha njia, barabara, au mwendo wa maisha. “Njia yangu” ni usemi wa kawaida wa Kiswahili unaohifadhi maana halisi na ya kitamathali.
- source_word: גָדַר
  choice: ameuziba ... kwa ukuta
  rationale: Kitenzi kina picha ya kujenga ukuta au kizuizi. Usemi huu ni wa asili katika Kiswahili na huhifadhi picha halisi kuliko kusema tu “amezuia.”
- source_word: וְלֹא אֶעֱבוֹר
  choice: hata nisiweze kupita
  rationale: Kishazi kinaonyesha matokeo ya njia kuzibwa. “Hata nisiweze kupita” huonyesha wazi kutowezekana kwa kupita bila kupoteza uhusiano wa Kiebrania.
- source_word: נְתִיבוֹתַי
  choice: mapito yangu
  rationale: Nomino ya wingi hurejelea vijia au mapito. “Mapito yangu” huhifadhi wingi na mtindo wa kishairi huku ikitofautisha neno hili na “njia” katika mstari wa kwanza.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida, inayoweza kueleweka kihalisi na kitamathali.
- source_word: יָשִׂים
  choice: ameweka
  rationale: Kitenzi humaanisha kuweka au kutia. “Ameweka” huhifadhi picha ya giza lililowekwa juu ya mapito na kuonyesha tendo lenye athari ya sasa.
- source_word: וְעַל נְתִיבוֹתַי חֹשֶׁךְ יָשִׂים
  choice: naye ameweka giza juu ya mapito yangu
  rationale: Mpangilio huu huhifadhi picha ya kishairi ya giza kuwekwa juu ya mapito, badala ya kuifupisha kuwa “ameyatia mapito yangu giza.”
theological_decisions:
- issue: Mhusika wa kitenzi katika nafsi ya tatu
  choice: yeye aliyedokezwa na viambishi vya “ame-” na “naye”
  alternative: Mungu/BWANA
  rationale: Kiebrania hakimtaji mhusika kwa jina; muktadha unaonyesha kwamba Ayubu anamzungumzia Mungu. Kiswahili kinaweza kudumisha hali hiyo kwa viambishi vya nafsi na “naye,” bila kuongeza jina la Mungu lisilomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Ameuziba ... kwa ukuta” huhifadhi taswira ya Kiebrania; “mapito” huhifadhi wingi na urari wa kishairi. Alama ya tanbihi [a] imewekwa katika matini kuu.
