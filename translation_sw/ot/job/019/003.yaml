  text: Hizi mara kumi mmeniaibisha; hamwoni aibu kunitendea kama mgeni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kunitendea vibaya,” “kunionea,” au “kunitendea kwa ukali.” Kitenzi cha Kiebrania hapa ni kigumu na huenda kikamaanisha kumtendea Ayubu kana kwamba ni mgeni au mtu asiyetambuliwa.
