lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: Mara hizi kumi
  rationale: Inahifadhi nahau ya Kiebrania ya kuhesabu matukio kama “mara kumi,” ambayo pia inaweza kudokeza tendo lililorudiwa mara nyingi.
- source_word: תַּכְלִימוּנִי
  choice: mmeniaibisha
  rationale: Hifili ya כלם ina maana ya kumsababishia mtu aibu au fedheha; “mmeniaibisha” ni ya kawaida, ya moja kwa moja, na inadumisha nguvu ya kisababishi.
- source_word: לֹא תֵבֹשׁוּ
  choice: hamwoni aibu
  rationale: בוש hueleza kuona au kuhisi aibu; usemi huu ni Kiswahili cha kawaida na unadumisha shtaka la kimaadili.
- source_word: תַּהְכְּרוּ לִי
  choice: kunitendea kama mgeni
  rationale: Kitenzi hiki kigumu, kinachohusiana na נכר, kinaweza kueleza kumtendea mtu kama asiyejulikana au mgeni. Tafsiri hii inahifadhi taswira ya msingi bila kuifunga kwa maana moja ya jumla kama “kunidhulumu.”
