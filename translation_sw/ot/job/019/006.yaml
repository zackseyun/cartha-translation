  text: דְּֽעוּ אֵ֭פוֹ כִּי אֱל֣וֹהַּ עִוְּתָ֑/נִי וּ֝/מְצוּד֗/וֹ עָלַ֥/י הִקִּֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: sw
  text: Basi jueni kwamba Mungu amenitendea isivyo haki[a], na amenizungushia wavu wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amenidhulumu” au “amepotosha haki dhidi yangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kupinda au kupotosha lililo sawa.
    reason: lexical_alternative
  - marker: b
    text: Au “mtego wake” au “wavu wake wa kuwinda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ
  choice: jueni
  rationale: Ni amri ya wingi inayowataka wasikilizaji wakubali au watambue jambo; “jueni” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: אֵפוֹ
  choice: basi
  rationale: Kihisishi hiki cha mazungumzo huongeza msisitizo au hitimisho katika hoja; “basi” kinafaa katika mtiririko wa mabishano.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Ni jina la kawaida la Mungu katika umoja, bila maana maalumu ya cheo kama “Mwenyezi.”
- source_word: עִוְּתָנִי
  choice: amenitendea isivyo haki
  rationale: Kitenzi עות kinaweza kumaanisha kupinda au kupotosha lililo sawa, na kwa muktadha huu kinaonyesha madai ya Ayubu kwamba Mungu amemtendea kwa dhuluma. Kauli hii ni ya asili katika Kiswahili huku ikihifadhi uzito wa kimaadili na kimahakama.
- source_word: מְצוּדוֹ
  choice: wavu wake
  rationale: Nomino hiyo hurejelea wavu au mtego wa kuwinda. “Wavu” huhifadhi taswira ya uwindaji kwa ufupi na uwazi.
- source_word: הִקִּיף עָלַי
  choice: amenizungushia
  rationale: Kitenzi humaanisha kuzunguka au kuzingira. “Amenizungushia” huunganisha kwa kawaida tendo hilo na chombo kinachofuata, yaani wavu.
theological_decisions:
- issue: Shtaka la Ayubu dhidi ya Mungu
  choice: Kuhifadhi madai ya moja kwa moja kwamba Mungu “amenitendea isivyo haki.”
  alternative: Mungu amenitesa; Mungu amenigeukia.
  rationale: Kitenzi cha Kiebrania kina uzito wa kupotosha haki au kutenda isivyo haki. Tafsiri haipaswi kupunguza makali ya kilio cha Ayubu wala kutatua mvutano wa kiteolojia uliomo katika matini. Hii inawasilisha maneno ya Ayubu bila kuyatangaza kuwa fundisho la kawaida kuhusu tabia ya Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi jueni” huhifadhi amri ya wingi na mtiririko wa hoja. Kauli “amenitendea isivyo haki” ni ya wazi kwa msomaji wa kawaida na inadumisha kwa makusudi ukali wa shtaka la Ayubu.
