  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: sw
  text: Hata watoto wadogo[a] wananidharau; ninaposimama, wananisema vibaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wapumbavu,” “wenye jeuri,” au “wavulana.” Kwa kawaida neno la Kiebrania עֲוִילִים humaanisha watu wapumbavu au wasio na utambuzi wa maadili, lakini katika muktadha huu wengi hulielewa kuwa watoto au vijana wasio na ukomavu au hadhi wanaomdhihaki Ayubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Hata
  rationale: Huendeleza maombolezo na kusisitiza kwamba hata watu wasiotazamiwa kumdharau Ayubu wanafanya hivyo.
- source_word: עֲוִילִים
  choice: watoto wadogo
  rationale: Katika muktadha huu neno linaweza kueleweka kuwa watoto au vijana wasio na hadhi wanaomdharau Ayubu, jambo linalokazia aibu yake ya kijamii. Kwa kuwa maana yake inaweza pia kuwa wapumbavu au watu wenye jeuri, utata huo umehifadhiwa katika tanbihi.
- source_word: מָאֲסוּ בִי
  choice: wananidharau
  rationale: Kitenzi מאס huonyesha kukataa kwa dharau; ‘wananidharau’ ni usemi wa kawaida wa Kiswahili unaofaa hisia za mstari huu.
- source_word: אָקוּמָה
  choice: ninaposimama
  rationale: Muundo huu unaeleweka kwa kawaida hapa kama kishazi cha wakati kinachoonyesha kwamba anaposimama, wao humsema vibaya.
- source_word: וַיְדַבְּרוּ בִי
  choice: wananisema vibaya
  rationale: Kihusishi ב pamoja na דבר kina maana yenye uhasama katika muktadha huu. Tafsiri hii ni ya asili katika Kiswahili na haiongezi kwa uwazi wazo la kumdhihaki ambalo limedokezwa tu.
