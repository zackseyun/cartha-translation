- source_word: וַ
  choice: Ndipo / aka-
  rationale: Waw zinazofuatana zinaonyesha mwendelezo wa simulizi. ‘Ndipo’ pamoja na umbo la mfululizo ‘aka-’ huwasilisha mfuatano huo kwa Kiswahili cha asili.
