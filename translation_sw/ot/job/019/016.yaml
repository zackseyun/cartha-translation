  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: sw
  text: Ninamwita mtumishi wangu[a], lakini hanijibu[b]; ninamsihi kwa kinywa changu mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumwa wangu.” Neno la Kiebrania עֶבֶד linaweza kumaanisha mtumishi au mtumwa kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “Nilimwita mtumishi wangu, lakini hakunijibu; nilimsihi kwa kinywa changu mwenyewe.” Maumbo ya vitenzi vya Kiebrania yanaweza kutafsiriwa kwa kufuata zaidi wakati uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: mtumishi wangu
  rationale: עֶבֶד huweza kumaanisha mtumishi au mtumwa. Katika muktadha huu ni mtu wa nyumbani aliye chini ya mamlaka ya Ayubu; “mtumishi” ni ya kawaida na yenye heshima katika Kiswahili, huku “mtumwa” ikibaki kuwa maana inayowezekana katika tanbihi.
- source_word: קָרָאתִי
  choice: Ninamwita
  rationale: Ingawa umbo la Kiebrania ni timilifu, katika maombolezo ya kishairi linaweza kuonyesha hali inayowasilishwa kwa uhai kama ya sasa. “Ninamwita” pia hudhihirisha kwamba Ayubu anamwita mtumishi aje au aitikie.
- source_word: וְלֹא יַעֲנֶה
  choice: lakini hanijibu
  rationale: ענה humaanisha kujibu au kuitikia. Kiunganishi kimetafsiriwa kwa ulinganishi kama “lakini,” na kiwakilishi cha yambwa “-ni-” kinaweka wazi kwamba mtumishi hamjibu Ayubu.
- source_word: אֶתְחַנֶּן לוֹ
  choice: ninamsihi
  rationale: Hitpaeli ya חנן huonyesha kuomba fadhili au kusihi. “Ninamsihi” ni ya asili na huhifadhi fedheha ya Ayubu kulazimika kumsihi aliye chini yake bila kuongeza dhana ya ulazima ambayo haijaonyeshwa moja kwa moja na kitenzi.
- source_word: בְּמוֹ פִי
  choice: kwa kinywa changu mwenyewe
  rationale: במו pamoja na “kinywa changu” ina mkazo wa kibinafsi. Tafsiri hii huhifadhi msisitizo kwamba Ayubu mwenyewe analazimika kusema ombi hilo moja kwa moja.
