  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֭חַ/י מֵ/עָלַ֣/י הִרְחִ֑יק וְ֝/יֹדְעַ֗/י אַךְ זָ֥רוּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: sw
  text: Amewaweka ndugu zangu mbali nami[a], nao wanaonijua wamekuwa wageni kabisa kwangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amewaondoa ndugu zangu kutoka kwangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nao wanaonijua wamejitenga nami kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: ndugu zangu
  rationale: Nomino ya kiume wingi yenye kiambishi cha nafsi ya kwanza umoja humaanisha moja kwa moja ‘ndugu zangu’; inaweza kujumuisha jamaa wa karibu katika muktadha, lakini tafsiri hii inadumisha umbo na nguvu ya kijamii ya Kiebrania.
- source_word: מֵעָלַי
  choice: mbali nami
  rationale: Muungano wa מן na עַל pamoja na הִרְחִיק unaonyesha kuondolewa kutoka karibu na Ayubu au katika mazingira yake; ‘mbali nami’ ni Kiswahili cha kawaida kinachodumisha wazo la umbali.
- source_word: הִרְחִיק
  choice: amewaweka ... mbali
  rationale: Hiphil timilifu ya רחק ina maana ya kusababisha kuwa mbali au kuondoa. ‘Amewaweka ... mbali’ huonyesha usababishaji bila kuongeza wazo lisilo lazima la kuwafukuza kwa nguvu.
- source_word: וְיֹדְעַי
  choice: nao wanaonijua
  rationale: Kirai hiki, kihalisi ‘wanaonijua,’ kinarejelea watu waliozoeana na Ayubu; usemi huu ni wazi na wa asili kuliko neno linaloweza kuwabana kuwa marafiki tu.
- source_word: אַךְ
  choice: kabisa
  rationale: Hapa אַךְ inatilia mkazo ukamilifu wa kutengana; ‘kabisa’ hutoa nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: זָרוּ
  choice: wamekuwa wageni
  rationale: Kitenzi timilifu hapa kinaonyesha kuwa watu hao wamekuwa kama wageni katika uhusiano wao na Ayubu. Tafsiri hii inadumisha taswira ya ‘wageni’ badala ya kutumia neno la kidhahania pekee.
- source_word: מִמֶּנִּי
  choice: kwangu
  rationale: Katika Kiswahili, ‘wamekuwa wageni kwangu’ huonyesha kwa kawaida kuvunjika kwa uhusiano unaoelekezwa kwa msemaji; tanbihi inahifadhi uwezekano wa kutafsiri מן kwa wazi zaidi kama ‘wamejitenga nami.’
theological_decisions:
- issue: Mtendaji asiye tajwa wa הִרְחִיק
  choice: Kiwakilishi ‘A-’ katika ‘Amewaweka’ kinadumisha mtendaji wa nafsi ya tatu umoja bila kumtaja.
  alternative: Mungu amewaweka ndugu zangu mbali nami.
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja bila nomino ya mtendaji. Muktadha unamwelekeza msomaji kwa Mungu, lakini kutomtaja hapa kunadumisha ufupi wa chanzo na mvutano wa kilio cha Ayubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha usambamba wa kishairi wa mistari miwili; ‘ndugu zangu’ ni ya moja kwa moja, na ‘wamekuwa wageni kabisa kwangu’ ni ya asili huku ikihifadhi taswira na mkazo wa Kiebrania.
