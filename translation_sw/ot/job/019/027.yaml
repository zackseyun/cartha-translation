lexical_decisions:
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Kiwakilishi hiki kinamrejelea mtu aliyetajwa katika mstari uliotangulia na kinafanya kazi kama yambwa wa kitenzi ‘nitamwona.’
- source_word: אֲנִי
  choice: mimi mwenyewe
  rationale: Kiwakilishi huru cha Kiebrania kinasisitiza kuwa Ayubu ndiye atakayeona; ‘mimi mwenyewe’ kinahifadhi msisitizo huo.
- source_word: אֶחֱזֶה
  choice: nitamwona
  rationale: Kitenzi kina maana ya kuona au kutazama. Wakati ujao unafaa katika ulinganifu wake na tumaini lililoelezwa katika muktadha.
- source_word: לִּי
  choice: kwa nafsi yangu
  rationale: Dativi hii ina maana ngumu na yenye msisitizo. ‘Kwa nafsi yangu’ inaonyesha kwamba kuona huko kutakuwa kwa Ayubu binafsi bila kulazimisha maana ya ‘akiwa upande wangu.’
- source_word: וְעֵינַי רָאוּ
  choice: macho yangu yatamwona
  rationale: Ingawa רָאוּ kimaumbo ni qatal, hapa iko sambamba na kitenzi kilichotangulia na inaeleweka kwa mtazamo wa wakati ujao. Kirai kinahifadhi taswira na ulinganifu wa kishairi.
- source_word: וְלֹא זָר
  choice: wala si mtu mwingine
  rationale: זָר inaweza kumaanisha ‘mgeni’ au ‘mtu mwingine.’ Katika muktadha, tofauti inayosisitizwa ni kwamba Ayubu mwenyewe, si mtu mwingine, ndiye atakayeona; maana halisi zaidi imewekwa katika tanbihi.
- source_word: כָּלוּ
  choice: zinadhoofika
  rationale: Kitenzi kinaweza kueleza kuisha nguvu, kudhoofika, au kufifia kwa shauku. ‘Zinadhoofika’ huhifadhi hali ya ndani inayomlemea Ayubu bila kuongeza sababu isiyotajwa wazi.
- source_word: כִלְיֹתַי
  choice: figo zangu
  rationale: Hii ndiyo maana halisi ya neno la Kiebrania. Taswira yake ya kitamaduni kama kitovu cha nafsi na hisia za ndani inaelezwa katika tanbihi.
- source_word: בְּחֵקִי
  choice: kifuani mwangu
  rationale: חֵיק humaanisha kifua au sehemu ya mbele ya mwili. ‘Kifuani mwangu’ kinahifadhi picha halisi kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Asili ya kuona kunakotarajiwa na Ayubu
  choice: Mstari umetafsiriwa kama tumaini la Ayubu kwamba yeye binafsi atamwona yule aliyetajwa katika mstari uliotangulia, bila kufafanua wakati au namna ya kuona huko.
  alternative: Kulieleza moja kwa moja kuwa tumaini la ufufuo wa mwili, kuthibitishwa kuwa mwenye haki kabla ya kufa, au kumwona Mungu baada ya kifo.
  rationale: Kiebrania kinasisitiza kwamba Ayubu mwenyewe ataona, lakini mstari huu pekee hauamui mjadala kuhusu wakati na namna ya tukio hilo. Tafsiri inalinda utata na mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi, wenye heshima na unaoeleweka. Muundo unahifadhi msisitizo wa nafsi ya kwanza na taswira halisi za ‘macho,’ ‘figo,’ na ‘kifua,’ huku tanbihi zikifafanua semi ngumu za Kiebrania.
