  text: ambaye mimi mwenyewe nitamwona kwa ajili yangu[a]; macho yangu yatamwona, wala si mtu mwingine[b]. Figo zangu[c] zinadhoofika ndani ya kifua changu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania kina maana halisi ya ‘nitamwona kwa ajili yangu’ au ‘nitamwona kwa upande wangu’; maana yake hapa si hakika kabisa.
    reason: lexical_alternative
