lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: Wageni wa nyumbani mwangu
  rationale: Neno גָּר linaweza kumaanisha mgeni, mkazi wa muda, au mgeni anayeishi kwa mtu. Katika muktadha huu wingi wake unaelekea kwa watu waliokaa au kukaribishwa nyumbani mwa Ayubu; “wageni wa nyumbani mwangu” ni Kiswahili cha kawaida na hakibani maana kuwa lazima ni wapitaji tu.
- source_word: אַמְהֹתַי
  choice: wajakazi wangu
  rationale: אמה hapa humaanisha watumishi wa kike; “wajakazi” ni neno la heshima, linaloeleweka, na linalotofautisha jinsia kama Kiebrania.
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: hunihesabu kuwa mgeni
  rationale: Kitenzi חשב kina maana ya kuhesabu au kumwona kuwa; usemi huu unahifadhi tendo lao la kumchukulia Ayubu kama mtu asiye wao.
- source_word: נָכְרִי הָיִיתִי בְעֵינֵיהֶם
  choice: nimekuwa mtu wa kigeni machoni pao
  rationale: Tafsiri hii inadumisha picha halisi ya “machoni pao” na tofauti ndogo ya msamiati kati ya זָר na נָכְרִי.
