lexical_decisions:
- source_word: וְ/אַחַר
  choice: Na baada ya
  rationale: Huhifadhi kiunganishi na maana ya wakati katika Kiebrania, huku ikiwa ya kawaida katika Kiswahili.
- source_word: עוֹרִי
  choice: ngozi yangu
  rationale: Hii ndiyo maana ya kawaida ya עוֹר katika muktadha wa mwili wa binadamu na inadumisha taswira ya mateso ya Ayubu.
- source_word: נִקְּפוּ זֹאת
  choice: kuharibiwa
  rationale: Kishazi hiki ni kigumu kisarufi na kimsamiati. Kauli tendwa inaeleza kwa ufasaha kuangamizwa kwa ngozi bila kulazimisha tafsiri finyu ya זֹאת.
- source_word: וּמִבְּשָׂרִי
  choice: bado kutoka katika mwili wangu
  rationale: מִן kwa kawaida humaanisha ‘kutoka’. ‘Bado’ huonyesha mkabala wa kimuktadha, na ‘kutoka katika mwili wangu’ huhifadhi utata wa Kiebrania badala ya kuamua kati ya ‘katika mwili wangu’ na ‘bila mwili wangu’.
- source_word: אֶחֱזֶה
  choice: nitamwona
  rationale: חזה humaanisha kuona au kutazama; ‘nitamwona’ ni wazi, ya asili, na yenye hadhi katika Kiswahili cha sasa.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Ni nomino ya umoja inayomtaja Mungu na hutafsiriwa moja kwa moja kuwa ‘Mungu’.
theological_decisions:
- issue: Iwapo וּמִבְּשָׂרִי inafundisha wazi ufufuo wa mwili
  choice: kutoka katika mwili wangu
  alternative: katika mwili wangu; bila mwili wangu
  rationale: Kihusishi na sintaksia ya Kiebrania vinabishaniwa. Tafsiri kuu inadumisha mvutano huo badala ya kuamua wazi kuwa ni kuona Mungu katika mwili uliofufuliwa au pasipo mwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni rahisi kueleweka lakini inadumisha taswira ya mwili na utata halisi wa mstari. Alama zote za tanbihi zimewekwa katika maandishi makuu.
