  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: sw
  text: Vikosi vyake vinakuja pamoja; vinajenga njia yao dhidi yangu[a], na vinapiga kambi pande zote za hema yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vinainua njia yao dhidi yangu”; kitenzi cha Kiebrania kinaweza kuleta picha ya kujenga barabara iliyoinuliwa au tuta la kuzingiria.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: pamoja
  rationale: Kielezi hiki kinaonyesha kwamba vikosi vinakuja kwa umoja au kwa wakati mmoja; “pamoja” ni Kiswahili cha kawaida na huhifadhi wazo la shambulio lililoratibiwa.
- source_word: יָבֹאוּ
  choice: vinakuja
  rationale: Kitenzi בוא kimsingi humaanisha “kuja.” Wakati wa sasa unafaa katika usimulizi hai wa kishairi.
- source_word: גְדוּדָיו
  choice: vikosi vyake
  rationale: גְּדוּד inaweza kumaanisha kikosi au kundi la washambuliaji. Wingi wenye kiambishi cha nafsi ya tatu umoja wa kiume umehifadhiwa kwa “vikosi vyake,” bila kubainisha zaidi ukubwa wa jeshi.
- source_word: וַיָּסֹלּוּ
  choice: vinajitengenezea
  rationale: Mzizi סלל unaweza kueleza kuinua, kutandaza, au kujenga njia, na pia unaweza kuhusishwa na tuta la kuzingira. Katika Kiswahili, “vinajitengenezea njia” huwasilisha kwa kawaida kitendo cha kuandaa njia ya kusonga kwa shambulio.
- source_word: עָלַי
  choice: ya kunishambulia
  rationale: Ingawa kihalisi ni “juu yangu,” muktadha wa kijeshi unaipa maana ya uadui; muundo huu unaonyesha wazi kwamba njia hiyo inaelekezwa dhidi ya Ayubu.
- source_word: דַּרְכָּם
  choice: njia
  rationale: דֶּרֶךְ humaanisha njia, barabara, au mwendo. “Njia” ni ya kawaida na, pamoja na kitenzi cha kuitengeneza, huhifadhi taswira ya maandalizi ya kijeshi.
- source_word: וַיַּחֲנוּ
  choice: vinapiga kambi
  rationale: חנה ni kupiga kambi. Kauli “kupiga kambi” ni ya sasa, ya asili, na hudumisha mazingira ya kijeshi.
- source_word: סָבִיב
  choice: kuizunguka
  rationale: Neno hili linaonyesha kuzunguka pande zote. “Kuizunguka” huleta wazi picha ya hema iliyozingirwa.
- source_word: לְאָהֳלִי
  choice: hema yangu
  rationale: אֹהֶל kihalisi ni hema. Tafsiri hii huhifadhi picha halisi ya kishairi, ingawa hema inaweza pia kuwakilisha makao au nyumba ya Ayubu.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha nafsi ya tatu katika “vikosi vyake”
  choice: Kiwakilishi “vyake” kimehifadhiwa, huku muktadha ukidokeza kwamba kinamrejelea Mungu ambaye Ayubu anamweleza kwa lugha ya mshambuliaji.
  alternative: Kukitaja kama kiambishi kinachomrejelea kamanda fulani wa adui asiyeainishwa katika sitiari.
  rationale: Muktadha wa karibu unamwonyesha Ayubu akieleza matendo ya Mungu dhidi yake kwa taswira ya kuzingirwa. Kutotaja “Mungu” moja kwa moja huhifadhi muundo na kiwango cha uwazi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Upatanisho wa ngeli katika “vikosi ... vinakuja ... vinajitengenezea ... vinapiga” hufanya mstari usomeke kwa kawaida. Taswira za kijeshi za vikosi, njia, kambi, na hema zimehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
