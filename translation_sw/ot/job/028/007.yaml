  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari unahifadhi ulinganifu wa kishairi; kiwakilishi “hiyo” kinabainisha kwamba kiambishi cha yambwa katika vitenzi kinarejelea njia.
