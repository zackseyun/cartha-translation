  text: נָ֭תִיב לֹֽא יְדָ֣ע/וֹ עָ֑יִט וְ/לֹ֥א שְׁ֝זָפַ֗תּ/וּ עֵ֣ין אַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/007.yaml
  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: sw
  text: 'Njia ambayo hakuna ndege wa kuwinda anayeijua,

    wala jicho la kipanga[a] halijaiona.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwewe.” Kiebrania hutaja ndege wa kuwinda, lakini aina kamili haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: njia
  rationale: Neno hili humaanisha njia au kijia. “Njia” ni la kawaida na la kishairi, nalo linafaa kwa picha ya njia iliyofichika.
- source_word: לֹא יְדָעוֹ
  choice: hakuna ... anayeijua
  rationale: Kitenzi kina kiambishi cha nafsi ya tatu umoja wa kiume, “anaijua.” Muundo huu wa Kiswahili unaonyesha wazi kuwa njia hiyo haijulikani kwa ndege huyo.
- source_word: עָיִט
  choice: ndege awindaye
  rationale: Hili ni jina la jumla la ndege anayewinda, si lazima aina moja maalumu. “Ndege awindaye” huhifadhi maana hiyo pana kwa Kiswahili cha kawaida.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: wala ... halijaiona
  rationale: Kitenzi humaanisha kuona, kutazama, au kupata kukiona. “Halijaiona” ni wazi na huhifadhi ulinganifu na “anayeijua.”
- source_word: עֵין
  choice: jicho la
  rationale: Tafsiri halisi ya muundo huu ni “jicho la”; kuuhifadhi kunadumisha taswira ya kishairi ya Kiebrania.
- source_word: אַיָּה
  choice: kipanga
  rationale: Neno hilo hutaja ndege wa kuwinda ambaye utambulisho wake kamili haujulikani kwa hakika, mara nyingi akihusishwa na kite au falcon. “Kipanga” ni jina la Kiswahili linalofaa, huku kutokuwa na uhakika kukielezwa katika tanbihi.
