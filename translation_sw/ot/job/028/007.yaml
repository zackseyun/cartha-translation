review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the hidden path, the general bird of prey, and the parallel statement that the eye of a raptor has not seen it. However, “hiyo” makes the path more explicitly definite than the Hebrew’s poetic indefinite opening, and the first colon is syntactically awkward.
  naturalness: “Hakuna ndege awindaye anayeijua” has an unnecessarily doubled relative construction and is not the most natural Standard East African Swahili expression. “Ndege wa kuwinda anayeijua” is clear, idiomatic, and retains the generic singular sense.
  terminology: “Ndege wa kuwinda” appropriately renders the general Hebrew עָיִט. “Kipanga” is a reasonable conventional rendering for אַיָּה provided its uncertain identification is retained in a footnote. “Falconi” is not suitable standard Swahili in this footnote; “mwewe” is a natural alternative label.
  issues:
  - severity: medium
    issue: Awkward doubled relative in the first colon
    rationale: The wording “ndege awindaye anayeijua” combines two relative forms where one descriptive noun phrase plus one relative verb is sufficient. It can momentarily obscure the relation of “anayeijua” to the path.
  - severity: low
    issue: Unwarranted demonstrative “hiyo”
    rationale: The Hebrew begins simply with “a path”; removing “hiyo” better preserves its poetic, non-demonstrative presentation.
  - severity: medium
    issue: Footnote alternative “falconi”
    rationale: This is not a natural Standard East African Swahili bird name. A Swahili alternative should be used while retaining the source’s taxonomic uncertainty.
  revised_text: 'Njia ambayo hakuna ndege wa kuwinda anayeijua,

    wala jicho la kipanga[a] halijaiona.'
