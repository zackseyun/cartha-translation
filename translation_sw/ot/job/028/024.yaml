  yaml_path: translation/ot/job/028/024.yaml
  text: For he looks to the ends of the earth[b][a]; he sees under all the heavens.
translation:
  language: sw
  text: Kwa maana yeye hutazama hadi miisho ya dunia; huona kila kilicho chini ya mbingu zote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya dai lililotangulia kuhusu Mungu kujua mahali pa hekima; “Kwa maana” hudumisha nguvu hiyo ya ufafanuzi kwa Kiswahili cha kawaida.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi kinamrejelea Mungu katika muktadha. “Yeye” kinahifadhi msisitizo wa kiwakilishi cha Kiebrania bila kuongeza jina ambalo halipo katika mstari.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: hadi miisho ya dunia
  rationale: Kirai hiki kinamaanisha sehemu za mbali kabisa au mipaka ya dunia. “Miisho ya dunia” ni tamathali inayoeleweka na inayodumisha taswira ya chanzo.
- source_word: יַבִּיט
  choice: hutazama
  rationale: Kitenzi hiki kinaonyesha kutazama kwa kuelekeza macho. “Hutazama” ni cha asili na pia kinaendana na tendo linalofuata la kuona.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: kila kilicho chini ya mbingu zote
  rationale: Tafsiri hii huhifadhi taswira ya “chini ya,” wingi wa “mbingu,” na wazo la upeo unaojumuisha kila kitu; neno “kilicho” huifanya sentensi iwe ya asili katika Kiswahili.
- source_word: יִרְאֶה
  choice: huona
  rationale: ראה ni kitenzi cha kawaida cha kuona. “Huona” hudumisha maana yake ya moja kwa moja na usambamba na “hutazama.”
theological_decisions:
- issue: Rejeleo la kiwakilishi הוּא
  choice: Kiwakilishi “yeye” kinamrejelea Mungu, anayeendelea kuelezwa kuwa anajua mahali pa hekima na kuona uumbaji wote.
  alternative: Kuacha mhusika bila kutambuliwa kabisa au kutaja “Mungu” moja kwa moja katika maandishi.
  rationale: Muktadha wa karibu unamtambulisha Mungu wazi, lakini kuhifadhi “yeye” badala ya kuingiza jina lake kunafuata muundo wa mstari wa Kiebrania bila kupanua maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi usambamba wa kishairi kati ya “hutazama” na “huona,” pamoja na wingi wa “mbingu.”
