base_translation:
  language: en
  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: sw
  text: Dhahabu safi haiwezi kutolewa kwa ajili ya hekima,[a] wala fedha haiwezi kupimwa ili kuwa bei yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhahabu iliyosafishwa.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, fedha haiwezi kupimwa kwa uzito ili kulipa bei yake. Katika nyakati za kale, fedha ilitumiwa kama malipo kwa kupimwa uzito.
    reason: cultural_note
lexical_decisions:
- source_word: יֻתַּן
  choice: haiwezi kutolewa
  rationale: Kauli ya kutendwa ya נתן pamoja na לֹא inaonyesha kutowezekana kwa kutoa kitu kama malipo; Kiswahili hiki ni cha kawaida na kinadumisha dhahabu kuwa kiima.
- source_word: סְגוֹר
  choice: dhahabu safi
  rationale: Katika muktadha huu wa kishairi wa kupima thamani, neno hili humaanisha dhahabu iliyosafishwa au ya hali bora, si dhahabu kwa ujumla.
- source_word: תַּחְתֶּיהָ
  choice: badala yake
  rationale: תחת hapa huonyesha ubadilishanaji au kitu kinachotolewa mahali pa kingine, wala si maana ya mahali ya 'chini yake'; kiambishi kinarejelea hekima katika muktadha.
- source_word: יִשָּׁקֵל
  choice: haiwezi kupimwa
  rationale: Kauli ya kutendwa ya שקל inarejelea kupima fedha kwa uzito ili kulipa, kama ilivyokuwa desturi ya kale; muundo huu pia unasawazisha vipashio viwili vya mstari.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Neno linaweza kumaanisha madini ya fedha na pia fedha ya malipo. Kiswahili 'fedha' kinahifadhi kwa kiasi fulani maana zote mbili, huku muktadha wa kupima ukidokeza malipo kwa uzito.
- source_word: מְחִירָהּ
  choice: bei yake
  rationale: מְחִיר humaanisha bei au thamani ya kununulia; 'bei yake' ni fupi, ya asili, na inaendeleza taswira ya kibiashara.
theological_decisions:
- issue: Kirejewa cha kiambishi cha kike katika תַּחְתֶּיהָ na מְחִירָהּ
  choice: yake, kikirejelea hekima katika muktadha unaotangulia
  alternative: kutaja wazi 'hekima' katika mstari
  rationale: Kiebrania kinatumia viambishi badala ya kurudia nomino. Tafsiri inadumisha hilo bila kuongeza ufafanuzi ndani ya mstari, huku muktadha ukionyesha kuwa kinachorejelewa ni hekima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye hadhi ya kishairi. Mpangilio unahifadhi dhahabu kuwa kiima cha kishazi cha kwanza, kulingana na Kiebrania, na alama zote za tanbihi zilizoorodheshwa zinaonekana katika matini.
