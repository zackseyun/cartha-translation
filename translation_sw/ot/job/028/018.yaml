  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: sw
  text: Marijani na fuwele hazitajwi; bei ya hekima inapita lulu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאמוֹת
  choice: marijani
  rationale: Neno hili adimu katika muktadha wa vitu vya thamani kwa kawaida hueleweka kuwa aina ya marijani; tafsiri hii pia inafaa katika ulinganisho wa hazina za baharini.
- source_word: גָבִישׁ
  choice: fuwele
  rationale: Hutaja kitu kigumu, king'aacho na cha thamani, kinachoeleweka kwa asili kuwa fuwele.
- source_word: לֹא יִזָּכֵר
  choice: hazistahili hata kutajwa
  rationale: Kauli halisi ni 'haitatajwa/haitakumbukwa'; katika muktadha wa kulinganisha thamani, maana ni kwamba vitu hivyo havifai kuhesabiwa pamoja na hekima.
- source_word: מֶשֶׁךְ חָכְמָה
  choice: thamani ya hekima
  rationale: מֶשֶׁךְ ni neno adimu linaloweza kuhusishwa na gharama au upatikanaji; 'thamani' hutoa ulinganisho wa wazi bila kuongeza wazo la shughuli ya kununua.
- source_word: פְּנִינִים
  choice: lulu
  rationale: Hutaja vito vya thamani, mara nyingi vikieleweka kuwa lulu; hili ni neno la kawaida na la asili katika Kiswahili.
theological_decisions:
- issue: Ukuu usiolinganishwa wa hekima dhidi ya mali ya thamani
  choice: thamani ya hekima ni kubwa kuliko lulu
  alternative: gharama ya kuipata hekima ni kubwa kuliko lulu
  rationale: Tafsiri iliyochaguliwa inadumisha hoja ya kishairi kwamba hekima inapita vito kwa thamani, bila kuamua kwamba hekima inaweza kununuliwa kwa bei ya kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mistari miwili umeunganishwa kwa alama ya nuktamkato ili kuhifadhi ulinganisho wa ushairi.
