  yaml_path: translation/ot/job/028/027.yaml
  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: sw
  text: Ndipo akaiona, akaieleza[a]; akaiimarisha, na pia akaichunguza kwa undani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaihesabu,” “akaisimulia,” au “akaiweka wazi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuhesabu au kueleza.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kielezi hiki kinaonyesha mfuatano katika ushairi; “ndipo” ni cha kawaida na huhifadhi mtiririko wa matendo.
- source_word: רָאָהּ
  choice: akauona
  rationale: Kitenzi ראה pamoja na kiambishi cha umoja wa kike kinarejelea hekima; “kuona” huhifadhi taswira halisi huku kikiruhusu maana ya kuitambua kikamilifu.
- source_word: וַיְסַפְּרָהּ
  choice: na kuueleza
  rationale: ספר inaweza kumaanisha kuhesabu, kusimulia, au kueleza. “Kuueleza” inafaa katika muktadha huu na pia huhifadhi uwezekano wa kuuweka wazi; maana nyingine zimetajwa katika tanbihi.
- source_word: הֱכִינָהּ
  choice: akauimarisha
  rationale: Hifili ya כון hubeba maana ya kufanya kitu kiwe thabiti, kukiweka imara, au kukitayarisha. “Kuimarisha” ni ya asili katika Kiswahili na huhifadhi wazo la uthabiti.
- source_word: וְגַם
  choice: tena
  rationale: “Tena” huonyesha nyongeza ya tendo la mwisho kwa namna fupi na ya kishairi.
- source_word: חֲקָרָהּ
  choice: akauchunguza kwa undani
  rationale: חקר huonyesha kuchunguza au kutafiti kabisa; kirai hiki huwasilisha uzito wa uchunguzi wa kina kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kirejelewa cha viambishi vya umoja wa kike
  choice: Viambishi vyote vinarejelea “hekima” iliyotajwa katika muktadha wa karibu.
  alternative: Viambishi vinaweza kueleweka kwa namna dhahania zaidi kuwa vinarejelea kipimo au mpangilio wa hekima.
  rationale: Muktadha uliotangulia unaifanya hekima kuwa kitu kinachoonekana, kinachoelezwa, kinachoimarishwa, na kinachochunguzwa na Mungu. Ngeli ya “hekima” katika Kiswahili imehifadhiwa bila kuongeza ubinafsishaji usio wazi zaidi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mfuatano wa vitenzi umehifadhiwa kwa miundo ya “aka-”; ngeli ya hekima imetumika kwa uthabiti.
