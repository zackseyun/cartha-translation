  terminology: '“Hekima” huhitaji urejeleaji wa ngeli ya N-: akaiona, akaieleza, akaiimarisha, akaichunguza. “Akaiimarisha” hufaa kwa Hifili ya כון; “akaichunguza kwa undani” hufaa kwa חקר. “Akaieleza” ni tafsiri salama ya uchaguzi wa POB “declared it,” huku tanbihi ikihifadhi maana mbadala za kuhesabu, kusimulia, au kuweka wazi.'
