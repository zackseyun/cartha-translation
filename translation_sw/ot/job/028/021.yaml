base_translation:
  language: en
  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: sw
  text: 'Hekima imefichwa machoni pa kila kilicho hai,

    na imefichwa machoni pa ndege wa angani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: imefichwa mbali
  rationale: Nifali timilifu ya עלם inaonyesha hali ya kutoweza kuonekana. Kiima cha kike, yaani hekima kutoka muktadha wa mstari uliotangulia, kimetajwa wazi kwa Kiswahili cha asili.
- source_word: מֵעֵינֵי
  choice: na macho ya
  rationale: Muundo huu unahifadhi taswira ya Kiebrania ya kitu kufichwa machoni, huku 'mbali na macho ya' ikiwa nahau inayoeleweka vizuri kwa Kiswahili.
- source_word: כָל חָי
  choice: kila kilicho hai
  rationale: Uchaguzi huu unadumisha upana na upeo wa jumla wa Kiebrania bila kuufanya usemi huo uwahusu wanadamu pekee.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: na hata ndege wa angani
  rationale: 'עוֹף hapa inafaa kutafsiriwa ''ndege,'' na הַשָּׁמַיִם kwa muktadha huu ni ''angani.'' ''Hata'' huwasilisha nguvu ya ulinganisho wa kishairi: hata viumbe wenye mtazamo kutoka juu hawaioni.'
- source_word: נִסְתָּרָה
  choice: hawawezi kuiona
  rationale: Nifali ya סתר inaendeleza wazo la kufichwa. Ubadilishaji huu wa kawaida katika Kiswahili huepuka marudio mazito huku ukihifadhi maana kwamba hekima haionekani kwa ndege.
theological_decisions: []
translation_notes:
  register: Lugha ni ya kishairi, ya heshima, na ya sasa. Mistari miwili inadumisha usambamba wa Kiebrania. 'Hekima' imetajwa wazi kwa sababu Kiswahili hakiwezi kuonyesha kiima hicho kwa jinsia ya kisarufi kama Kiebrania, na muktadha wa Ayubu 28:20–21 unaibainisha.
