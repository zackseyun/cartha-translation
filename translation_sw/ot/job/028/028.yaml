base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: sw
  text: Naye akamwambia mwanadamu[a], “Tazama, kumcha Bwana—hiyo ndiyo hekima; na kujiepusha na uovu ni ufahamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanadamu.” Neno la Kiebrania liko katika umoja lakini hapa linawakilisha binadamu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akamwambia
  rationale: Inaendeleza uhusiano wa simulizi kwa kiunganishi, bila kulazimisha maana mahsusi ya mfuatano wa wakati.
- source_word: לָאָדָם
  choice: mwanadamu
  rationale: אָדָם hapa ni umoja unaomwakilisha binadamu kwa ujumla. ‘Mwanadamu’ ni neno la kawaida na lenye heshima katika Kiswahili, nalo halibani maana kwa mwanamume pekee.
- source_word: הֵן
  choice: Tazama
  rationale: Linahifadhi mwito wa kusikiliza na uzito wa tamko la Kiebrania katika muktadha wa fasihi ya hekima.
- source_word: יִרְאַת אֲדֹנָי
  choice: kumcha Bwana
  rationale: ‘Kumcha’ huhifadhi maana ya hofu yenye kicho na heshima badala ya kuipunguza kuwa heshima tu; muundo wa kitenzi-jina ni wa asili katika Kiswahili.
- source_word: הִיא חָכְמָה
  choice: hiyo ndiyo hekima
  rationale: ‘Hiyo ndiyo’ linaonyesha msisitizo wa kiwakilishi huru הִיא na nguvu ya utambulisho katika kauli.
- source_word: וְסוּר מֵרָע
  choice: na kujiepusha na uovu
  rationale: ‘Kujiepusha’ linaonyesha tendo la makusudi la kukataa na kuacha uovu wa kimaadili.
- source_word: בִּינָה
  choice: ufahamu
  rationale: Ni neno la kawaida la Kiswahili linalowasilisha uwezo wa kuelewa na kupambanua, huku likidumisha ulinganifu na ‘hekima.’
theological_decisions:
- issue: Maana ya אָדָם kama nomino ya umoja yenye uwakilishi wa wote
  choice: mwanadamu
  alternative: wanadamu
  rationale: Kiebrania kina umoja lakini kinarejelea jamii yote ya binadamu. ‘Mwanadamu’ huhifadhi umoja huo na wakati huohuo huwasilisha maana jumuishi; wingi umewekwa katika tanbihi kama ufafanuzi unaowezekana.
- issue: Maana ya יִרְאַת אֲדֹנָי
  choice: kumcha Bwana
  alternative: kumstahi Bwana
  rationale: Neno la Kiebrania linajumuisha hofu, kicho na heshima. ‘Kumcha’ huhifadhi mvutano huo wa kitheolojia bila kuupunguza kuwa staha pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tazama’ limetumiwa kwa uzito wa kishairi; sentensi imehifadhi ulinganifu wa kishairi kati ya hekima na ufahamu.
