lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: Mwanadamu
  rationale: Neno hili humaanisha binadamu, hasa kwa kuzingatia udhaifu na hali yake ya kufa. “Mwanadamu” ni la kawaida na huhifadhi nguvu ya umoja unaowakilisha watu kwa ujumla.
- source_word: יָדַע
  choice: hajui
  rationale: Kauli iliyokamilika hapa inaeleza ukweli wa jumla; wakati wa sasa wa Kiswahili unafaa. Tafsiri “hawezi kujua” ingeongeza wazo la kutoweza ambalo halijasemwa wazi.
- source_word: עֶרְכָּהּ
  choice: thamani yake
  rationale: Nomino hii inaweza kumaanisha thamani, kadirio la thamani, au bei. “Thamani yake” ni ya asili katika Kiswahili na haifanyi maana kuwa ya kibiashara kupita kiasi.
- source_word: תִּמָּצֵא
  choice: haipatikani
  rationale: Hii huhifadhi muundo wa kutendwa bila kuongeza wazo la kwamba haiwezekani kupatikana.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: katika nchi ya walio hai
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania na mtindo wake wa kishairi, ikirejelea eneo la maisha ya wanadamu duniani.
