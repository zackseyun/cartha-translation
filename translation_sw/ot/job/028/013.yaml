  text: Mwanadamu[a] hajui thamani ya hekima[b], wala hekima haipatikani katika nchi ya walio hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwanadamu” hapa ni neno la umoja linalomwakilisha binadamu kwa ujumla, likisisitiza pia hali yake ya kufa.
    reason: lexical_alternative
