  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: sw
  text: Huweka mwisho wa giza, naye huchunguza hadi kila upeo mawe ya giza kuu na giza nene.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya jadi zaidi, “mawe ya giza kuu na kivuli cha mauti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: Huweka mwisho wa giza
  rationale: Muundo huu unaendeleza picha halisi ya kuweka kikomo au mwisho kwa giza, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וּלְכָל תַּכְלִית
  choice: mpaka wa mwisho kabisa
  rationale: תַּכְלִית hapa ni mpaka au ukingo wa mbali kabisa, si ukamilifu wa kimaadili; usemi huu unasisitiza upekuzi unaofika kila mwisho.
- source_word: הוּא חוֹקֵר
  choice: huchunguza
  rationale: חקר humaanisha kutafuta au kuchunguza kwa kina; 'huchunguza' inafaa muktadha wa uchimbaji.
- source_word: אֶבֶן
  choice: mawe
  rationale: Ingawa ni umoja katika Kiebrania, אֶבֶן inaweza kutumiwa kwa maana ya pamoja; wingi 'mawe' ni wa kawaida zaidi katika picha ya uchimbaji.
- source_word: אֹפֶל
  choice: yaliyo gizani
  rationale: אֹפֶל ni giza zito au hali ya giza; muundo huu unaunganisha mawe na mazingira ya chini ya ardhi bila kufanya 'giza' lionekane kuwa sifa ya kimaumbile ya mawe.
- source_word: צַלְמָוֶת
  choice: giza nene
  rationale: Katika muktadha huu wa uchimbaji, neno hilo linaelekea kutaja giza kuu la chini ya ardhi; tafsiri ya jadi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya צַלְמָוֶת
  choice: giza nene
  alternative: kivuli cha mauti
  rationale: Muktadha wa uchimbaji unaunga mkono giza kuu la chini ya ardhi, lakini maana ya jadi yenye kiashirio cha mauti haijafutwa na imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kitenzi cha mazoea katika wakati wa sasa kinafaa maelezo ya jumla kuhusu mchimbaji katika muktadha. Tanbihi [a] imewekwa baada ya kishazi kinachohusika.
