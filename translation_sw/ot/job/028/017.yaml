  yaml_path: translation/ot/job/028/017.yaml
  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: sw
  text: Dhahabu na kioo haviwezi kulinganishwa nayo,[a] wala chombo cha dhahabu safi hakiwezi kutolewa badala yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dhahabu na fuwele haviwezi kulinganishwa nayo.” Neno la Kiebrania lililotafsiriwa “kioo” huenda likamaanisha nyenzo angavu ya thamani.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala chombo cha dhahabu safi hakiwezi kutolewa kwa kubadilishana nayo.” Neno la Kiebrania kwa “chombo” linaweza pia kumaanisha kitu au kifaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: haviwezi kulinganishwa nayo
  rationale: Kitenzi ערך hapa kina wazo la kupima au kulinganisha thamani. Umbo la wingi linaafikiana na vitu viwili, dhahabu na kioo; kiwakilishi kinarejelea hekima, ambayo ni nomino ya ngeli ya I katika Kiswahili.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ndilo neno la kawaida na sahihi kwa madini hayo ya thamani.
- source_word: זְכוֹכִית
  choice: kioo
  rationale: Neno la Kiebrania linaelekea kumaanisha glass, nyenzo angavu na ya thamani katika ulimwengu wa kale. Kiswahili “kioo” ni cha asili, ingawa kinaweza pia kueleweka kuwa bilauri au kristali kulingana na muktadha.
- source_word: תְמוּרָתָהּ
  choice: kutolewa badala yake
  rationale: תמורה hudumisha taswira halisi ya kubadilishana kitu kwa kingine. Muundo huu wa Kiswahili unaonyesha kwamba hata kitu hicho cha dhahabu hakiwezi kuwa thamani ya kubadilishia hekima.
- source_word: כְּלִי פָז
  choice: chombo cha dhahabu safi
  rationale: כְּלִי inaweza kuwa chombo, kifaa, au kitu kilichotengenezwa; “chombo” huhifadhi picha halisi bila kuifanya kuwa ya jumla kupita kiasi. פָּז ni dhahabu bora iliyosafishwa, hivyo “dhahabu safi.”
