translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Tafsiri inadumisha sitiari ya biashara na ulinganisho wa thamani katika Kiebrania, huku ikitumia sentensi inayoeleweka kwa urahisi.
