  text: As for the earth[a], from it bread comes out, but underneath it is turned up as by fire.
translation:
  language: sw
  text: Ardhi—humo hutoka mkate, lakini chini yake hugeuzwa kama kwa moto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na chini yake hugeuzwa kama moto.” Ulinganisho wa Kiebrania unaweza kueleza namna ya kugeuzwa (“kama kwa moto”) au kufanana moja kwa moja (“kama moto”).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: ardhi
  rationale: “Ardhi” inaonyesha udongo au uso wa dunia unaotoa mazao, ikilinganishwa na sehemu yake ya chini inayochimbuliwa; hapa si eneo maalumu la kisiasa.
- source_word: מִמֶּנָּה
  choice: kutoka humo
  rationale: Kiwakilishi kinarejelea ardhi. “Kutoka humo” ni Kiswahili cha kawaida kinachohifadhi wazo la kitu kutoka ndani ya ardhi.
- source_word: יֵצֵא
  choice: hutoka
  rationale: Kitenzi kina maana halisi ya kutoka. Hali ya mazoea katika “hutoka” inafaa kwa maelezo ya ardhi kutoa mazao.
- source_word: לָחֶם
  choice: mkate
  rationale: Neno halisi ni “mkate.” Tafsiri hii inadumisha taswira ya kishairi ya chakula kinachotokana na ardhi badala ya kulipanua kuwa “chakula.”
- source_word: וְתַחְתֶּיהָ
  choice: lakini chini yake
  rationale: Ingawa kiunganishi kinaweza kuwa “na,” “lakini” kinaonyesha utofauti uliopo kati ya uso wa ardhi unaotoa mkate na sehemu yake ya chini inayogeuzwa.
- source_word: נֶהְפַּךְ
  choice: hugeuzwa
  rationale: Kauli hii hubeba maana ya kugeuzwa au kupinduliwa. “Hugeuzwa” ni ya kawaida na inafaa muktadha wa uchimbaji unaovuruga ardhi ya chini.
- source_word: כְּמוֹ אֵשׁ
  choice: kana kwamba kwa moto
  rationale: Hii inaeleza kugeuzwa kwa namna inayofanana na athari ya moto, huku tanbihi ikihifadhi uwezekano wa ulinganisho wa moja kwa moja, “kama moto.”
