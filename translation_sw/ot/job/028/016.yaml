  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: sw
  text: Haiwezi kuthaminiwa kwa dhahabu safi ya Ofiri, kwa shohamu ya thamani[a] na yakuti samawi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “oniksi” au “berili”; utambulisho kamili wa jiwe linaloitwa kwa neno hili la Kiebrania hauna uhakika.
    reason: lexical_alternative
  - marker: b
    text: Huenda ni “lapis lazuli” badala ya yakuti samawi, kwa kuzingatia uainishaji wa madini wa nyakati za kale badala ya ule wa kisasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: kuthaminiwa
  rationale: Katika muktadha wa kulinganisha hekima na mali za thamani, kitenzi hiki katika Pual kinaonyesha kukadiria au kuweka thamani; “kuthaminiwa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: kwa dhahabu ya Ofiri
  rationale: כֶּתֶם ni dhahabu safi au bora, na Ofiri ni mahali palipojulikana kwa dhahabu yake. “Kwa” linaonyesha kitu kinachotumiwa kama kipimo cha thamani kwa njia ya asili katika Kiswahili.
- source_word: שֹׁהַם
  choice: shohamu
  rationale: Utambulisho kamili wa jiwe hili la kale hauna uhakika. “Shohamu” huepuka kulazimisha utambulisho wa kisasa usio na hakika, huku tanbihi ikitoa mbadala zinazojulikana.
- source_word: יָקָר
  choice: ya thamani
  rationale: Kirai hiki kinaeleza gharama au ubora mkubwa wa jiwe na ni cha kawaida katika Kiswahili cha kisasa.
- source_word: סַפִּיר
  choice: yakuti samawi
  rationale: Hili ndilo jina la kawaida la sapphire katika Kiswahili; hata hivyo, jiwe la kale huenda lilikuwa lapis lazuli, jambo linalohifadhiwa katika tanbihi.
