  yaml_path: translation/ot/job/028/011.yaml
  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: sw
  text: 'Huzuia machuruziko ya mito[a],

    na hukileta nuruni kile kilichofichwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hufunga maji yanayochuruzika ya mito.” Neno la Kiebrania lililotafsiriwa “machuruziko” ni adimu; linaweza kudokeza “kulia” au maji yanayovuja/churuzika kidogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: mahali ... inapovuja
  rationale: Neno hili ni adimu na linaweza kuashiria ‘kulia’ au maji yanayotiririka kidogo. Katika muktadha wa uchimbaji na kudhibiti maji, usemi huu unaeleweka kama sehemu ambako maji ya mito huvuja au kuchuruzika.
- source_word: נְהָרוֹת
  choice: mito
  rationale: Hili ndilo neno la kawaida la Kiebrania kwa mito; hapa linaweza pia kurejelea mikondo ya maji iliyo chini ya ardhi.
- source_word: חִבֵּשׁ
  choice: huyazuia
  rationale: Kitenzi humaanisha kufunga au kuzuia. ‘Huyazuia’ kinaonyesha kudhibiti maji katika shughuli ya uchimbaji bila kuingiza kwa lazima wazo maalumu la kujenga bwawa.
- source_word: תַּעֲלֻמָהּ
  choice: kile kilichofichwa
  rationale: Nomino hii humaanisha kitu kilichofichwa au kusitirika. Tafsiri pana inadumisha uwezekano wa kurejelea madini au vitu vingine vilivyofichika.
- source_word: יֹצִא
  choice: kukitoa
  rationale: Hifili ya יצא humaanisha kusababisha kitu kitoke; ‘kukitoa’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: אוֹר
  choice: gizani
  rationale: Kirai cha Kiebrania ni ‘kwenye nuru.’ Kiswahili cha kawaida husema ‘kutoa gizani,’ ambacho huhifadhi utofauti wa kufichwa na kufunuliwa; maana halisi imefafanuliwa kwenye tanbihi.
