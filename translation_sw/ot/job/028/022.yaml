  text: אֲבַדּ֣וֹן וָ֭/מָוֶת אָ֣מְר֑וּ בְּ֝/אָזְנֵ֗י/נוּ שָׁמַ֥עְנוּ שִׁמְעָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/022.yaml
  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: sw
  text: Abadoni na Mauti husema[a], “Kwa masikio yetu tumesikia habari zake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maangamizi na mauti zilisema, ‘Tumesikia uvumi wake.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: Abadoni
  rationale: Jina la Kiebrania limetoholewa kwa tahajia ya Kiswahili ili kudumisha uhuishaji wake sambamba na Mauti; maana yake ya msingi, “Maangamizi,” imeonyeshwa katika tanbihi.
- source_word: וָמָוֶת
  choice: na Mauti
  rationale: “Mauti” ni neno la Kiswahili lenye hadhi ya kishairi na linafaa kama mhusika aliyehuishwa anayesema pamoja na Abadoni.
- source_word: אָמְרוּ
  choice: husema
  rationale: Ingawa kitenzi cha Kiebrania ni timilifu, hapa usemi wa sasa wa kimazoea unaendana na muktadha wa kishairi unaoeleza yale maeneo mbalimbali yanayosema kuhusu hekima.
- source_word: בְּאָזְנֵינוּ
  choice: Kwa masikio yetu
  rationale: Tafsiri hii ya karibu na asili inadumisha taswira ya kusikia moja kwa moja bila kuifupisha kuwa kitenzi pekee.
- source_word: שָׁמַעְנוּ
  choice: tumesikia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotokea ambalo matokeo yake yana umuhimu katika usemi wa sasa.
- source_word: שִׁמְעָהּ
  choice: habari zake
  rationale: Neno linaweza kumaanisha habari, taarifa, au uvumi. “Habari zake” ni Kiswahili cha kawaida na huonyesha maarifa ya kusikia tu; kiambishi cha kike katika Kiebrania kinarejelea hekima katika muktadha.
theological_decisions:
- issue: Uhuishaji wa Abadoni na Mauti
  choice: Kuwasilisha wote wawili kama wasemaji waliohuishwa katika matini kuu
  alternative: Kutafsiri אֲבַדּוֹן kuwa “maangamizi” na kuelewa mauti bila uhuishaji dhahiri
  rationale: Matini inawapa uwezo wa kusema na kusikia. Kutumia “Abadoni” na “Mauti” kunadumisha taswira hiyo ya kishairi bila kudai kuwa ni viumbe halisi tofauti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa lakini wa heshima na kishairi. “Abadoni” limetoholewa ili lisomeke kwa kawaida kwa Kiswahili; tanbihi inadumisha uwezekano wa maana ya kawaida “Maangamizi” na pia nyakati ya kitenzi na “uvumi” kama mbadala.
