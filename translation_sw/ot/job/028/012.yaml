  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: sw
  text: Lakini hekima inaweza kupatikana kutoka wapi[a]? Na mahali pa ufahamu ni wapi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri halisi: “Hekima itapatikana kutoka wapi?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Lakini hekima
  rationale: Kiunganishi וְ kinaonyesha mgeuko wa hoja kutoka uchimbaji wa hazina za dunia katika muktadha uliotangulia kwenda kwenye swali kuhusu hekima; “lakini” huwasilisha mgeuko huo kwa Kiswahili cha kawaida.
- source_word: מֵאַיִן
  choice: kutoka wapi
  rationale: Kirai hiki huuliza chanzo au asili, si mahali tu; “kutoka wapi” kinahifadhi maana hiyo ya Kiebrania.
- source_word: תִּמָּצֵא
  choice: itapatikana
  rationale: Ni Nifali isiyotimilifu ya מצא, yenye maana ya “kupatikana.” Wakati ujao wa Kiswahili unafaa kwa swali hili la kishairi kuhusu mahali ambako hekima inaweza kupatikana.
- source_word: וְאֵי זֶה מְקוֹם
  choice: Na mahali ... ni wapi
  rationale: Muundo wa asili ni swali la mahali. Kiswahili huuwasilisha kwa kawaida kama “mahali ... ni wapi,” huku kikihifadhi kiunganishi kinachounganisha mistari sambamba.
- source_word: בִּינָה
  choice: ufahamu
  rationale: Neno hili linamaanisha uwezo wa kuelewa au kutambua kwa kina. “Ufahamu” ni la kawaida, lenye hadhi, na linadumisha ulinganifu na “hekima.”
