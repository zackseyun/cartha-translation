translation:
  language: sw
  text: Ananyoosha mkono wake dhidi ya mwamba mgumu[a]; anapindua milima kutoka mizizini mwa milima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mwamba mgumu,” au “kwenye mwamba wa gumegume.” Kiebrania kinaweza kueleza kuuweka mkono dhidi ya mwamba mgumu katika kazi ya uchimbaji.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja, “kutoka mzizi wa milima”; “mizizini mwa milima” huonyesha maana ya pamoja ya usemi wa Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: juu ya mwamba mgumu
  rationale: חַלָּמִישׁ humaanisha jiwe gumu sana au gumegume. Katika muktadha wa uchimbaji, “mwamba mgumu” ni Kiswahili cha kawaida na huonyesha kitu kinachofanyiwa kazi; “juu ya” huhifadhi kwa kiasi fulani uwezekano wa kihusishi ב bila kudai kwa uhakika kuwa mkono unaingia ndani ya mwamba.
- source_word: שָׁלַח יָדוֹ
  choice: Ananyoosha mkono wake
  rationale: Nahau שׁלח יד inaeleza kuunyosha au kuuelekeza mkono ili kutenda jambo. “Ananyoosha mkono wake” ni ya asili na inaendeleza picha halisi ya kazi ya mchimbaji.
- source_word: הָפַךְ
  choice: anapindua
  rationale: הפך humaanisha kugeuza au kupindua. “Anapindua” huwasilisha kuvurugwa kabisa kwa milima kutokana na uchimbaji.
- source_word: מִשֹּׁרֶשׁ
  choice: kutoka mizizi yake
  rationale: Ingawa שֹׁרֶשׁ ni umoja katika Kiebrania, ina maana ya pamoja kwa kurejelea milima. Kiswahili hutumia kwa kawaida “mizizi yake,” huku kiwakilishi “yake” kikikubaliana na nomino ya ngeli ya milima.
- source_word: הָרִים
  choice: milima
  rationale: הָרִים humaanisha “milima.” Kutotumia kiashiria maalumu kunafaa kwa kauli hii ya kishairi yenye maana ya jumla.
