lexical_decisions:
- source_word: כִּי
  choice: Kwa hakika
  rationale: Katika mwanzo huu wa kishairi, chembe hii ina nguvu ya kusisitiza, si lazima kutoa sababu; “Kwa hakika” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: יֵשׁ
  choice: ina
  rationale: Muundo wa Kiebrania unaonyesha kuwapo; katika Kiswahili, “fedha ina...” huwasilisha kwa kawaida wazo kwamba kuna mahali panapohusiana nayo.
- source_word: לַכֶּסֶף מוֹצָא
  choice: fedha ina mgodi
  rationale: מוֹצָא kimsingi ni chanzo au mahali pa asili, lakini muktadha wa uchimbaji katika sura hii unaunga mkono “mgodi”; uwezekano mpana zaidi umehifadhiwa katika tanbihi.
- source_word: וּמָקוֹם לַזָּהָב
  choice: na dhahabu ina mahali
  rationale: Huhifadhi ulinganifu wa kishairi kati ya fedha na dhahabu na uhusiano unaoonyeshwa na kihusishi ל.
- source_word: יָזֹקּוּ
  choice: ambapo huisafisha
  rationale: Kitenzi kinaweza kumaanisha kusafisha madini au kuyeyusha ili kutenganisha chuma; “huisafisha” kinaeleweka kwa wasomaji wengi na huhifadhi mtenda asiyeainishwa wa umoja wa jumla katika Kiswahili.
