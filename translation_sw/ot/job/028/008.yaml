  yaml_path: translation/ot/job/028/008.yaml
  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
translation:
  language: sw
  text: Wanyama wenye kiburi hawajaikanyaga njia hiyo[a]; simba hajaipitia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wana wa kiburi.” Huenda msemo huu unamaanisha wanyama wa mwituni wenye kiburi, hasa wanyama wanaowinda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: hawajaikanyaga njia hiyo
  rationale: Katika muktadha wa njia iliyofichika, Hiphil ya דרך inaeleza kuikanyaga au kuipitia njia. Kutaja “njia hiyo” huweka wazi kiwakilishi cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: בְנֵי שָׁחַץ
  choice: wanyama wenye kiburi
  rationale: Kwa neno neno ni “wana wa kiburi,” lakini katika ushairi huu na kwa kuambatana na שׁחל, inaelekea kumaanisha wanyama wa mwituni wenye majivuno au ukali. Tafsiri hii ni ya asili huku tanbihi ikihifadhi tamathali halisi.
- source_word: עָדָה עָלָיו
  choice: hajaipitia
  rationale: Kitenzi pamoja na על kinaonyesha kwenda juu ya kitu au kukivuka. “Hajaipitia” ni Kiswahili cha kawaida na kinaendana na mstari sambamba bila kuingiza maana nyingine ya kiteolojia.
- source_word: שָׁחַל
  choice: simba
  rationale: Hili ni neno la kishairi la kumaanisha simba, huenda likidokeza nguvu au ukali. “Simba” ni wazi na la asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo sambamba wa mistari miwili umehifadhiwa, na lugha imewekwa wazi kwa msomaji wa kawaida.
