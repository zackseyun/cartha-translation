  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari imepangwa kishairi. “Wachimbaji” imeongezwa kwa uwazi wa rejeo katika taswira ya mgodi; utata wa Kiebrania kuhusu shimo/mkondo, mguu, na kuning’inia au kuteremshwa umehifadhiwa katika tanbihi.
