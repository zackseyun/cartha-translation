  text: פָּ֤רַץ נַ֨חַל מֵֽ/עִם גָּ֗ר הַֽ/נִּשְׁכָּחִ֥ים מִנִּי רָ֑גֶל דַּ֖לּוּ מֵ/אֱנ֣וֹשׁ נָֽעוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: sw
  text: 'Hufungua shimo mbali na makao ya watu;[a]


    wamesahauliwa na mguu,[b]


    huning’inia mbali na wanadamu,[c]


    huyumba huku na huku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hufungua mkondo mbali na mahali anapokaa mgeni.” Kiebrania ni kigumu, hasa maneno yanayoweza kumaanisha “mkondo” na “mgeni.” Kwa kuzingatia uchimbaji unaozungumziwa katika sura hii, wengi hulielewa kuwa shimo la mgodi.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “waliosahauliwa na/kutoka kwa mguu.” Huenda maana yake ni mahali au watu walio nje ya macho au mbali na kufikiwa na watu wanaotembea juu ya ardhi.
    reason: lexical_alternative
  - marker: c
    text: Au, “huteremshwa” au “huning’inia chini.” Kitenzi cha Kiebrania kinaweza kuonyesha kuning’inizwa au kuteremshwa, labda kwa kamba ndani ya mgodi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  choice: hufukua
  rationale: Kitenzi kina maana ya kupenya au kufungua kwa nguvu; katika muktadha wa uchimbaji, “hufukua” ni usemi wa kawaida unaoonyesha kufungua ardhi.
- source_word: נַחַל
  choice: shimo
  rationale: Kwa kawaida neno hili humaanisha kijito, bonde la mto, au mkondo, lakini taswira ya uchimbaji katika sura hii inaunga mkono maana ya njia au shimo lililochimbwa. Utata umehifadhiwa katika tanbihi.
- source_word: מֵעִם גָּר
  choice: mbali na makao ya watu
  rationale: Kirai kigumu kinaonyesha kutengwa na aliye mgeni au anayekaa mahali; tafsiri hii ya kimuktadha inaeleza kwamba uchimbaji hufanyika mbali na makazi.
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: mahali ambapo mguu hausogei
  rationale: Kiebrania kinasema kwa mkazo “waliosahauliwa na/kutoka kwa mguu.” Tafsiri inaonyesha mahali pasipofikiwa wala kuonekana na wapita njia, huku maana halisi ikielezwa katika tanbihi.
- source_word: דַּלּוּ
  choice: huning’inia
  rationale: Kitenzi kinaweza kumaanisha kuning’inia, kuteremshwa, au kuelea chini; katika mgodi huenda wachimbaji wanateremshwa kwa kamba.
- source_word: מֵאֱנוֹשׁ
  choice: mbali na wanadamu
  rationale: אֱנוֹשׁ humaanisha mwanadamu aliye dhaifu au binadamu kwa ujumla; “wanadamu” ni ya kijumla na yenye hadhi katika Kiswahili.
- source_word: נָעוּ
  choice: kuyumba huku na huku
  rationale: Kitenzi kinaonyesha kutikisika, kuyumba, au kwenda huku na huku; kinafaa kwa wachimbaji wanaoning’inia.
