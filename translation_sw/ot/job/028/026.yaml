lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: alipoiwekea
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi una maana ya wakati, ‘alipofanya/alipoweka.’ Katika Kiswahili, ‘alipoiwekea’ huunganisha kwa kawaida tendo hilo na vitu vinavyowekewa utaratibu.
- source_word: לַמָּטָר
  choice: mvua
  rationale: מָטָר ni mvua; kihusishi cha Kiebrania kinawakilishwa katika muundo wa Kiswahili ‘kuiwekea mvua.’
- source_word: חֹק
  choice: kanuni
  rationale: חֹק hapa ni jambo lililowekwa au kuamriwa kuwa utaratibu thabiti. ‘Kanuni’ linafaa katika muktadha wa mpangilio wa uumbaji bila kuifanya kauli isikike kama sheria ya kibinadamu pekee.
- source_word: וְדֶרֶךְ
  choice: na ... njia
  rationale: דֶּרֶךְ ni njia au mapito. ‘Njia’ inadumisha taswira ya mkondo uliowekwa kwa tukio la angani.
- source_word: לַחֲזִיז
  choice: umeme wa radi
  rationale: חֲזִיז humaanisha mwako wa umeme au radi katika ushairi. ‘Umeme wa radi’ ni usemi wa kawaida wa Kiswahili unaoonyesha mwako huo kwa uwazi.
- source_word: קֹלוֹת
  choice: radi
  rationale: קוֹל kwa msingi ni sauti, na katika hali ya hewa hutumiwa kwa ngurumo. ‘Radi’ katika kishazi ‘umeme wa radi’ huwasilisha tukio la umeme lenye ngurumo; maana halisi zaidi ya ‘ngurumo’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Mungu kuweka utaratibu katika maumbile
  choice: Kumtaja Mungu kuwa ndiye anayeiwekea mvua kanuni na umeme njia, bila kuongeza maelezo ya kimafundisho.
  alternative: Kutafsiri kwa upanuzi kwamba Mungu anatawala kila tukio la hali ya hewa kwa uangalizi wake.
  rationale: Mstari unaonyesha kwa ushairi hekima ya Mungu katika kuupanga uumbaji. Tafsiri inadumisha wazo hilo bila kuingiza madai ya kimfumo yasiyotajwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari unadumisha usambamba wa kishairi wa Kiebrania.
