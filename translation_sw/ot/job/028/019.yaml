lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: haiwezi kulingana nayo
  rationale: Kitenzi ערך hapa kinaonyesha kulingana kwa thamani au cheo. Kauli hii ni ya kawaida katika Kiswahili na inadumisha wazo la kwamba hekima haina kifani; kiambishi kinarejelea hekima katika muktadha.
- source_word: פִּטְדַת כּוּשׁ
  choice: Topazi ya Kushi
  rationale: פִּטְדָה ni jiwe la thamani ambalo utambulisho wake kamili haujulikani. “Topazi” ni tafsiri ya jadi inayotambulika sana, huku uwezekano mwingine ukihifadhiwa katika tanbihi. כּוּשׁ limetoholewa kuwa “Kushi.”
- source_word: בְּכֶתֶם טָהוֹר
  choice: kwa dhahabu safi
  rationale: כֶּתֶם humaanisha dhahabu bora au iliyosafishwa, na טָהוֹר huongeza maana ya usafi. Kihusishi ב kinaeleweka kwa kawaida kama kipimo au njia ya kuthaminia.
- source_word: תְסֻלֶּה
  choice: haiwezi kuthaminiwa
  rationale: Katika muktadha wa ushairi huu kuhusu thamani ya hekima, kitenzi kinaonyesha kukadiria thamani, si kupima uzito halisi tu. Tafsiri hii pia inadumisha ulinganifu wa mishororo.
