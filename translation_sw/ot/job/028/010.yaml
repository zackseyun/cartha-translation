  yaml_path: translation/ot/job/028/010.yaml
  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: sw
  text: Huchonga mifereji miambani[a], na jicho lake huona kila kitu cha thamani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vijito” au “mifereji ya maji”; neno la Kiebrania linaweza kumaanisha mikondo ya maji, lakini hapa huenda linarejelea njia zilizochongwa miambani katika taswira ya uchimbaji.
    reason: lexical_alternative
  - marker: b
    text: Au “kila kilicho cha thamani” au “kila madini ya thamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: miambani
  rationale: Neno צוּר humaanisha mwamba au jabali, hasa mwamba mgumu. Umbo lenye ב linaeleweka hapa kwa maana ya mahali ambamo mchimbaji anachonga, hivyo “miambani” ni la asili na linafaa muktadha wa uchimbaji.
- source_word: יְאֹרִים
  choice: mifereji
  rationale: יְאֹרִים inaweza kumaanisha vijito, mikondo ya maji, au mifereji. Katika taswira hii ya uchimbaji, “mifereji” inadokeza njia zilizochongwa bila kulazimisha maana maalumu zaidi ya mashimo ya migodi.
- source_word: בִּקֵּעַ
  choice: huchonga
  rationale: Kitenzi בקע kina maana ya kupasua au kufungua kwa kupasua. “Huchonga” kinaeleza kwa Kiswahili cha kawaida tendo la kutengeneza njia ndani ya mwamba, huku muktadha wa uchimbaji ukihifadhiwa.
- source_word: יְקָר
  choice: kitu cha thamani
  rationale: יְקָר hurejelea kilicho cha thamani au ghali. “Kitu cha thamani” hudumisha upana wa maana bila kukifunga kwa madini au vito pekee.
- source_word: רָאֲתָה עֵינוֹ
  choice: jicho lake huona
  rationale: Kiebrania kinasema kihalisi “jicho lake limeona.” Kauli ya mazoea “jicho lake huona” inafaa maelezo ya kishairi ya mstari huu na kuhifadhi picha ya jicho badala ya kuirahisisha kuwa “huona.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa urahisi. “Huchonga” na “miambani” ni maneno ya kawaida yanayowasilisha taswira ya uchimbaji; mpangilio “jicho lake huona” unahifadhi uzito wa usemi wa Kiebrania.
