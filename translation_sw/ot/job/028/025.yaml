lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: alipoupa
  rationale: Muundo wa kitenzi-jina chenye ל unaendeleza maana ya wakati kutoka muktadha wa mstari uliotangulia. Kiswahili “alipoupa” kinaonyesha kwa kawaida tendo la Mungu la kuuwekea upepo uzito.
- source_word: לָרוּחַ
  choice: upepo
  rationale: Ingawa רוּחַ pia inaweza kumaanisha roho au pumzi, hapa usambamba wake na maji katika mpangilio wa ulimwengu unaonyesha maana ya upepo.
- source_word: מִשְׁקָל
  choice: uzito wake
  rationale: Neno hili linamaanisha uzito au upimaji. “Uzito wake” linaeleza kwamba Mungu aliuwekea upepo uzito unaoufaa huku likidumisha taswira ya mpangilio uliopimwa.
- source_word: וּמַיִם
  choice: maji
  rationale: מַיִם lina umbo la wingi katika Kiebrania lakini hutumiwa kama nomino ya kitu kisichohesabika; “maji” ndilo neno la kawaida na sahihi katika Kiswahili.
- source_word: תִּכֵּן
  choice: kuyapima
  rationale: Kitenzi hiki huonyesha kupima, kupimia uzito, au kuamua kwa usahihi. “Kuyapima” kinadumisha taswira ya upangaji kwa vipimo na usambamba na “uzito.”
- source_word: בְּמִדָּה
  choice: kwa kipimo
  rationale: Kirai hiki kinaonyesha kipimo au kiwango kilichoamuliwa. “Kwa kipimo” ni cha asili katika Kiswahili na kinahifadhi wazo la upangaji sahihi.
theological_decisions:
- issue: Kuendelea kwa mtendaji kutoka mstari uliotangulia
  choice: Kiambishi cha nafsi katika “alipoupa” na “kuyapima” kinamrejelea Mungu.
  alternative: Kutafsiri bila kumtaja mtendaji waziwazi, kwa kufuata kwa karibu zaidi muundo wa kitenzi-jina cha Kiebrania.
  rationale: Muktadha unaonyesha kwamba Mungu ndiye mtendaji anayeendelea kutoka mstari wa 24. Kiswahili huhitaji kuonyesha nafsi katika kitenzi; kufanya hivyo hakutii dai jipya la kiteolojia.
