  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: sw
  text: Mungu anaifahamu njia ya hekima,[a] naye anajua mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anaifahamu njia ya kuifikia hekima.” Kiebrania kinaweza kumaanisha njia ya hekima yenyewe au njia inayoifikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kimofolojia, kitenzi cha umoja kinaonyesha wazi kuwa hapa linamtaja Mungu mmoja.
- source_word: הֵבִין
  choice: anaijua
  rationale: Hifili ya בין humaanisha kufahamu au kutambua kwa utambuzi. Katika Kiswahili, ‘anaijua njia’ ni ya kawaida na inaonyesha ukweli wa kudumu kuhusu ujuzi wa Mungu.
- source_word: דַּרְכָּהּ
  choice: njia ya hekima
  rationale: Kiambishi cha kike kinarejelea hekima katika muktadha. Kurudia nomino ‘hekima’ huondoa utata wa kiwakilishi katika Kiswahili huku ‘njia’ ikihifadhi sitiari ya Kiebrania bila kuamua kimya-kimya kuwa ni ‘njia ya kuifikia.’
- source_word: וְהוּא
  choice: naye
  rationale: Kiwakilishi huru kinasisitiza mhusika; ‘naye’ kinawasilisha kwa kawaida muunganiko na msisitizo huo katika Kiswahili.
- source_word: יָדַע
  choice: anajua
  rationale: Kitenzi kinaeleza kujua; wakati wa sasa unafaa kwa kauli hii ya kishairi kuhusu ujuzi wa Mungu usio na kikomo cha wakati.
- source_word: אֶת מְקוֹמָהּ
  choice: mahali pake
  rationale: מקום ni ‘mahali.’ Kiambishi ‘-ke’ kinarejelea hekima na pia kinaweza kuhifadhi mwangwi wa uwasilishaji wake kama wa kike katika Kiebrania.
theological_decisions:
- issue: Kirejelewa cha viambishi vya kike katika ‘njia yake’ na ‘mahali pake’
  choice: Viambishi vinarejelea hekima; nomino ‘hekima’ imetajwa wazi katika kishazi cha kwanza, na ‘mahali pake’ imetumiwa katika cha pili.
  alternative: ‘Njia yake ... mahali pake,’ kwa kuacha kirejelewa kitegemee muktadha pekee.
  rationale: Muktadha wa Ayubu 28 unaifanya hekima kuwa kirejelewa. Kiswahili hakina jinsia ya kisarufi inayolingana moja kwa moja na umbo la kike la Kiebrania, hivyo kutaja ‘hekima’ kunaleta uwazi bila kuifanya lazima kuwa nafsi halisi. Tanbihi inahifadhi uwezekano wa kuelewa ‘njia’ kuwa njia ya kuifikia hekima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa kishairi. ‘Naye’ huhifadhi msisitizo wa kiwakilishi cha Kiebrania; tanbihi huhifadhi utata halisi wa דַּרְכָּהּ.
