  text: Kilindi kinasema, “Hekima[a] haimo ndani yangu,” nayo bahari inasema, “Haiko pamoja nami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “yeye hayumo ndani yangu”; kiwakilishi hicho ni cha kike na kinarejelea hekima, inayotajwa kwa namna ya mtu katika muktadha unaozunguka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם
  choice: kilindi
  rationale: Neno hili linamaanisha kina kikubwa cha maji au vilindi. “Kilindi” ni fupi, cha kishairi, na kinadumisha ulinganifu na “bahari” bila kuongeza maelezo ya kimytholojia.
- source_word: אָמַר
  choice: kinasema / inasema
  rationale: Ingawa umbo la Kiebrania ni qatal, katika ushairi hapa linaonyesha tamko hai la wakati wa sasa. Upatanisho wa kisarufi wa Kiswahili unahitaji “kinasema” kwa “kilindi” na “inasema” kwa “bahari.”
- source_word: לֹא בִי הִיא
  choice: Hekima haimo ndani yangu
  rationale: Kiwakilishi cha kike cha Kiebrania kinarejelea hekima katika muktadha. Kutaja “Hekima” wazi kunafanya rejeo lieleweke kwa Kiswahili, ambacho hakitumii kiwakilishi chenye jinsia hapa, huku “haimo ndani yangu” kikihifadhi maana ya moja kwa moja ya בִי.
- source_word: יָם
  choice: bahari
  rationale: Hili ndilo neno la kawaida na sahihi kwa יָם, nalo linahifadhi taswira ya Kiebrania na ulinganifu wake na “kilindi.”
- source_word: אֵין עִמָּדִי
  choice: Haiko pamoja nami
  rationale: Kirai hiki kinaonyesha kwamba hekima haipo katika ushirika au milki ya bahari. Tafsiri hii inadumisha taswira ya mahali na nafsi kuliko tafsiri ya kifafanuzi kama “Sina hekima.”
