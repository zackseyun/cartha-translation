  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: sw
  text: Chuma hutolewa mavumbini, na shaba[a] hutolewa kutoka kwenye mawe kwa kuyeyushwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bronzi.” Neno la Kiebrania linaweza kumaanisha shaba au bronzi; “shaba” imechaguliwa hapa kwa sababu muktadha unahusu kupata metali kutoka kwenye mawe yenye madini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: chuma
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali ya iron na maana ya kawaida ya nomino ya Kiebrania.
- source_word: מֵעָפָר
  choice: mavumbini
  rationale: Neno עָפָר linaweza kumaanisha mavumbi, udongo, au ardhi iliyolegea. “Mavumbini” linahifadhi taswira halisi na ya kishairi ya Kiebrania.
- source_word: יֻקָּח
  choice: hutolewa
  rationale: Kauli ya kutendwa ya לקח kimsingi ni “huchukuliwa.” Katika muktadha wa madini, “hutolewa” ni ya kawaida zaidi kwa Kiswahili bila kufikia ufafanuzi mahsusi zaidi wa “huchimbwa.”
- source_word: וְאֶבֶן
  choice: na ... kutoka kwenye mawe
  rationale: אֶבֶן ni “jiwe.” Wingi “mawe” unasikika kwa kawaida katika Kiswahili unapozungumzia miamba yenye madini, huku kirai “kutoka kwenye” kikieleza uhusiano unaodokezwa na sentensi ya Kiebrania.
- source_word: יָצוּק
  choice: huyeyushwa
  rationale: יצק inaweza kumaanisha kumimina, kusubu, au kuyeyusha metali. Pamoja na taswira ya uchimbaji na metali inayotoka katika mawe, “huyeyushwa” linafikisha hapa wazo la kuitenga metali na madini kwa joto.
- source_word: נְחוּשָׁה
  choice: shaba
  rationale: Neno la Kiebrania linaweza kurejelea copper au bronze. “Shaba” linafaa zaidi katika muktadha huu wa kupata metali kutoka kwenye mawe yenye madini, badala ya kutaja aloi iliyokwisha kutengenezwa.
