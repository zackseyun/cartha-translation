  yaml_path: translation/ot/job/028/006.yaml
  text: Its stones are the place of sapphire[a], and it has dust of gold.
translation:
  language: sw
  text: Mawe yake ni mahali pa yakuti samawi[a], na mavumbi yake ni dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “lazuriti”; utambulisho kamili wa jiwe la kale linalomaanishwa na neno la Kiebrania hauna uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: mahali pa
  rationale: Neno hili kwa kawaida humaanisha mahali au eneo. Katika muktadha wa uchimbaji wa madini, tafsiri hii inadumisha taswira halisi ya mahali ambako jiwe la thamani linapatikana.
- source_word: סַפִּיר
  choice: yakuti samawi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sapphire; hata hivyo, utambulisho kamili wa jiwe hilo la kale hauna uhakika, kwa hiyo uwezekano wa lazuriti umewekwa katika tanbihi.
- source_word: אֲבָנֶיהָ
  choice: mawe yake
  rationale: Tafsiri hii inadumisha wingi wa 'mawe' na kiambishi cha umilikaji kinachorejelea ardhi au eneo la uchimbaji linalotajwa katika muktadha.
- source_word: וְעַפְרֹת
  choice: na mavumbi yake
  rationale: Umbo hili la wingi linahusiana na vumbi au udongo laini. 'Mavumbi' yanahifadhi taswira ya kishairi bila kufasiri neno hilo moja kwa moja kuwa madini ghafi.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali hii ya thamani.
- source_word: לוֹ
  choice: yake yana
  rationale: Kiebrania kinasema kihalisi 'kwake/kwayo'; katika Kiswahili, muundo wa umilikaji 'mavumbi yake yana dhahabu' unaeleza kwa kawaida kwamba eneo hilo lina dhahabu katika mavumbi yake.
