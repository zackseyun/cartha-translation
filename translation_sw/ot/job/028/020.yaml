  yaml_path: translation/ot/job/028/020.yaml
  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: sw
  text: Lakini hekima—inatoka wapi? Na mahali pa ufahamu ni wapi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo rasmi zaidi, “Hekima inatoka wapi, na mahali pa ufahamu ni wapi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Lakini hekima
  rationale: חָכְמָה ni “hekima.” Kiunganishi וְ hapa kinaendeleza swali kuu kwa mgeuko wa balagha; “Lakini” linaonyesha utofauti huo kwa Kiswahili cha kawaida bila kufafanua kupita kiasi.
- source_word: מֵאַיִן
  choice: inatoka wapi
  rationale: מֵאַיִן huuliza chanzo, yaani “kutoka wapi.” Muundo “inatoka wapi” ni wa asili katika Kiswahili na unadumisha mkazo juu ya asili ya hekima.
- source_word: תָּבוֹא
  choice: inatoka
  rationale: Kitenzi בוא kwa msingi humaanisha “kuja,” lakini pamoja na מֵאַיִן swali la Kiswahili “inatoka wapi?” huwasilisha kwa kawaida maana ya chanzo. Wakati wa sasa unafaa swali hili la jumla la kishairi.
- source_word: וְאֵי זֶה
  choice: Na ... ni wapi?
  rationale: אֵי זֶה ni usemi wa kuuliza mahali. Kiswahili “ni wapi?” ni wazi, cha sasa, na kinahifadhi maana ya mahali.
- source_word: מְקוֹם
  choice: mahali
  rationale: מְקוֹם humaanisha “mahali.” Neno hili ni la kawaida na lenye hadhi katika Kiswahili kuliko “eneo,” ambalo lingekuwa mahususi zaidi.
- source_word: בִּינָה
  choice: ufahamu
  rationale: בִּינָה humaanisha ufahamu au utambuzi. “Ufahamu” linaoana vizuri na “hekima” na halibani maana kuwa aina moja tu ya utambuzi.
