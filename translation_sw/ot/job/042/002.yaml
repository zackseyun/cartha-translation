  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
translation:
  language: sw
  text: Ninajua kwamba unaweza kufanya mambo yote, wala hakuna kusudi lako linaloweza kuzuiwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna mpango wako unaoweza kukwamishwa.” Nomino ya Kiebrania inaweza kumaanisha “mpango” au “kusudi,” na kitenzi kinaweza kuwa na maana ya kuzuiliwa, kukwamishwa, au kufanywa kutotimia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Ninajua
  rationale: Kitenzi cha Kiebrania ni hali timilifu kinachoelekezwa kwa Mungu; katika ungamo la sasa la Ayubu, Kiswahili cha wakati uliopo ‘ninajua’ huwasilisha maana ya hali kwa kawaida.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha yaliyomo katika ungamo la Ayubu; ‘kwamba’ ni kiunganishi cha kawaida na wazi katika Kiswahili.
- source_word: כֹל תּוּכָל
  choice: unaweza kufanya mambo yote
  rationale: יכל huonyesha uwezo, na כֹל huonyesha upeo usio na kikomo katika muktadha huu. ‘Kufanya’ hukamilisha usemi kwa Kiswahili cha kawaida bila kuongeza wazo geni.
- source_word: וְלֹא
  choice: wala hakuna
  rationale: ‘Wala’ huunganisha kishazi cha pili kilichokanushwa, na ‘hakuna’ huandaa kwa kawaida nomino inayofuata.
- source_word: יִבָּצֵר
  choice: linaloweza kuzuiwa
  rationale: Nifali ya בצר pamoja na מן hubeba wazo la kuzuiliwa, kukwamishwa, au kutowezekana. Kwa sababu kiima ni kusudi la Mungu, ‘kuzuiwa’ huwasilisha maana kwa uwazi huku tanbihi ikihifadhi uwezekano wa ‘kukwamishwa.’
- source_word: מִמְּךָ
  choice: lako
  rationale: Ingawa kimuundo ni ‘kutoka kwako,’ katika uhusiano na מְזִמָּה Kiswahili cha umilikaji ‘lako’ huonyesha kwa kawaida kwamba kusudi hilo ni la Mungu.
- source_word: מְזִמָּה
  choice: kusudi
  rationale: Nomino inaweza kumaanisha mpango, kusudi, au wazo lililokusudiwa. ‘Kusudi’ linafaa kwa muktadha wa nia ya Mungu bila kuingiza hisia hasi zinazoweza kuambatana na maneno kama ‘hila.’
theological_decisions:
- issue: Kauli kuhusu uwezo wa Mungu na kutokuzuilika kwa nia yake
  choice: unaweza kufanya mambo yote, wala hakuna kusudi lako linaloweza kuzuiwa
  alternative: unaweza kufanya kila kitu, wala hakuna mpango wako unaoweza kukwamishwa
  rationale: Tafsiri inathibitisha uwezo mpana wa Mungu na kutoweza kuzuiliwa kwa nia yake bila kuongeza maelezo ya kimfumo kuhusu uweza wake. Tanbihi inahifadhi upana wa maana wa nomino na kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima, na inayoeleweka kwa urahisi. ‘Wala hakuna’ hudumisha uzito wa kishairi bila kuwa ya kizamani; ‘mambo yote’ ni ya kawaida na huhifadhi upeo wa כֹל.
