  text: Kisha Ayubu akamjibu Yahwe, akasema:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi jina hili hutolewa kuwa “BWANA.” Namna nyingine za kulitoa ni “Yahwe” na “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika fomula hii ya masimulizi humaanisha ‘kujibu’; ‘akamjibu’ huhifadhi muundo wa mazungumzo na pia humtaja Yahwe kama yambwa.
- source_word: אִיּוֹב
  choice: Ayubu
  rationale: Hili ndilo umbo la kawaida la jina אִיּוֹב katika Kiswahili cha Biblia.
- source_word: אֶת
  choice: '[alama ya yambwa maalumu, haitafsiriwi kwa neno tofauti]'
  rationale: אֶת hutambulisha yambwa maalumu katika Kiebrania; maana yake imewakilishwa na kiambishi cha yambwa ‘-m-’ katika ‘akamjibu.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi wa kawaida wa Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
- source_word: וַיֹּאמַר
  choice: akisema
  rationale: Katika Kiswahili, ‘akisema’ huwasilisha kwa ufasaha fomula ya Kiebrania ‘na akasema’ baada ya ‘akamjibu,’ bila kurudia viunganishi kwa namna isiyo ya kawaida.
- source_word: וַ
  choice: Kisha
  rationale: Waw ya masimulizi huendeleza mfuatano; ‘Kisha’ huonyesha hatua inayofuata kwa Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina יהוה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi la Mungu, huku tanbihi ikitaja desturi na namna nyingine za kulitoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo ‘akamjibu Yahwe, akisema’ huhifadhi fomula ya mazungumzo ya Kiebrania huku ukisomeka kwa ufasaha.
