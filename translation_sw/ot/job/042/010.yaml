  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: sw
  text: Yahwe akairejesha hali ya Ayubu[a] alipowaombea rafiki zake[b], naye Yahwe akampa Ayubu mara mbili ya yote aliyokuwa nayo hapo awali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaigeuza hali ya Ayubu” au “akaurejesha ustawi wa Ayubu.” Nahau ya Kiebrania inamaanisha kurejesha hali ya mtu, si lazima kumtoa katika utekwaji halisi.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliposali kwa niaba ya rafiki zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la Mungu lililo katika maandishi ya Kiebrania kwa umbo la kawaida la Kiswahili.
- source_word: שָׁב אֶת שבית
  choice: akarejesha hali njema ya Ayubu
  rationale: Hii ni nahau ya kugeuza au kurejesha hali ya mtu; katika muktadha huu haimaanishi lazima kumtoa katika utekwaji halisi.
- source_word: בְּהִתְפַּלְלוֹ
  choice: alipowaombea
  rationale: Kiambishi ב pamoja na kitenzi-jina huonyesha wakati au mazingira; 'alipo-' huhifadhi uhusiano wa wakati bila kudai wazi kuwa sala ndiyo sababu ya urejesho.
- source_word: בְּעַד רֵעֵהוּ
  choice: rafiki zake
  rationale: בְּעַד huonyesha kuomba kwa ajili au kwa niaba ya wengine, na רֵעַ hapa hurejelea kwa maana ya pamoja marafiki wa Ayubu.
- source_word: וַיֹּסֶף יְהוָה אֶת כָּל אֲשֶׁר לְאִיּוֹב לְמִשְׁנֶה
  choice: naye Yahwe akampa Ayubu mara mbili ya yote aliyokuwa nayo hapo awali
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la Mungu kuongeza mali ya Ayubu hadi kuwa maradufu ya aliyokuwa nayo kabla.
theological_decisions:
- issue: Uhusiano kati ya maombi ya Ayubu na kurejeshwa kwa hali yake
  choice: alipowaombea
  alternative: kwa sababu aliwaombea
  rationale: Muundo wa Kiebrania unaonyesha wakati au mazingira, lakini haulazimishi tafsiri ya kisababishi. Tafsiri hii huhifadhi uhusiano huo bila kuingiza fundisho la moja kwa moja la thawabu kwa matendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi 'akarejesha ... naye ... akampa' unaendeleza mtiririko wa aya bila kuwa mgumu.
