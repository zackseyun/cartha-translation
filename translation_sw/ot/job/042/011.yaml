  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: sw
  text: Kisha ndugu zake wote wa kiume, ndugu zake wote wa kike, na wote waliomfahamu hapo awali wakaja kwake. Wakakula chakula pamoja naye nyumbani mwake.[a] Wakamsikitikia na kumfariji kwa ajili ya maafa yote ambayo Yahwe alikuwa amemletea. Kila mmoja akampa kesita moja[b] na pete moja ya dhahabu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kiebrania kinasema “wakala mkate pamoja naye,” usemi wa kawaida wenye maana ya kushiriki mlo.
    reason: cultural_note
  - marker: b
    text: Kesita ilikuwa kipande au kipimo cha thamani cha kale; thamani yake kamili haijulikani.
    reason: cultural_note
  - marker: c
    text: Au “pete moja ya dhahabu ya puani”; neno la Kiebrania linaweza kumaanisha pete iliyovaliwa puani au sikioni.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: ndugu zake wote wa kiume, ndugu zake wote wa kike
  rationale: Hutofautisha wazi ndugu wa kiume na wa kike na kuhifadhi kurudiwa kwa כָּל (‘wote’) katika Kiebrania, bila kutumia ‘kaka’ au ‘dada’ kwa maana inayoweza kudokeza umri.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: na wote waliokuwa wamemfahamu hapo awali
  rationale: יֹדְעָיו ni watu waliomjua au waliomfahamu, na לְפָנִים huonyesha wakati wa zamani. Kauli hii ni ya asili katika Kiswahili na inadumisha tofauti ya wakati.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם בְּבֵיתוֹ
  choice: Wakakula chakula pamoja naye nyumbani mwake
  rationale: Usemi wa Kiebrania ‘kula mkate’ humaanisha kushiriki mlo. ‘Kula chakula pamoja naye’ huwasilisha maana ya kawaida na ushirika wa mlo kwa Kiswahili cha sasa; maana halisi imeelezwa katika tanbihi.
- source_word: וַיָּנֻדוּ לוֹ
  choice: Wakamwonea huruma
  rationale: Katika muktadha huu נוד huonyesha kumhurumia au kuonyesha masikitiko pamoja na mwenye kuteseka, wala si dhihaka.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: na kumfariji
  rationale: ‘Kumfariji’ ni kitenzi cha kawaida na cha heshima kwa tendo la kumpa mtesekaji faraja.
- source_word: עַל כָּל הָרָעָה
  choice: kwa sababu ya maafa yote
  rationale: רָעָה hapa ni mabaya yaliyompata mtu—maafa au msiba—si lazima uovu wa kimaadili.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: ambayo Yahwe alikuwa amemletea
  rationale: Huhifadhi usemi wa kisababishi הֵבִיא ... עָלָיו na kumtaja Yahwe moja kwa moja kuwa ndiye aliyeleta maafa, bila kuupunguza kuwa kuruhusu tu.
- source_word: קְשִׂיטָה אֶחָת
  choice: kesita moja
  rationale: Kesita ilikuwa kipande au kipimo cha thamani cha kale ambacho thamani yake kamili haijulikani; unukuzi huepuka kukipa thamani ya kisasa isiyo na uhakika.
- source_word: נֶזֶם זָהָב אֶחָד
  choice: pete moja ya dhahabu
  rationale: נֶזֶם ni pambo la duara la dhahabu linaloweza kuvaliwa puani au sikioni. ‘Pete’ huhifadhi kutokubainishwa huku tanbihi ikieleza uwezekano huo.
theological_decisions:
- issue: Jinsi ya kutafsiri uhusika wa Mungu katika mateso ya Ayubu
  choice: maafa yote ambayo Yahwe alikuwa amemletea
  alternative: maafa yote ambayo Yahwe alikuwa ameruhusu yampate
  rationale: Kiebrania kinatumia kauli ya wazi kwamba Yahwe ‘alileta’ maafa juu ya Ayubu. Tafsiri inadumisha mvutano huo wa kiteolojia badala ya kuubadili kuwa ruhusa pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa masimulizi umetumia mfululizo wa ‘waka-’. ‘Ndugu wa kiume/kike’ umetumiwa kwa usahihi bila kudokeza umri, na jina la Mungu limetolewa kama ‘Yahwe’.
