base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: sw
  text: Basi Elifazi Mtemani, Bildadi Mshuhi, na Sofari Mnaamathi wakaenda wakafanya kama Yahwe alivyowaambia. Naye Yahwe akamkubali Ayubu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yahwe akainua uso wa Ayubu,” nahau yenye maana ya kumwonyesha kibali au kumkubali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: Wayyiqtol ya הלך inaendeleza simulizi kwa tendo linalofuata; “wakaenda” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: Mtemani / Mshuhi / Mnaamathi
  rationale: Haya ni majina ya utambulisho wa mahali au ukoo. Miundo yenye kiambishi M- ni ya asili katika Kiswahili kwa mtu anayetoka mahali fulani, huku ikihifadhi tabia ya majina maalumu.
- source_word: וַיַּעֲשׂוּ
  choice: na kufanya
  rationale: Kitenzi עשה ni kipana, na hapa kinatumiwa pamoja na כַּאֲשֶׁר kwa maana ya kufanya kama walivyoagizwa; tafsiri hii haiongezi tendo lisilotajwa.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם
  choice: kama Yahwe alivyowaambia
  rationale: Kiswahili hiki kinaonyesha kwa kawaida kwamba walitekeleza yale ambayo Yahwe alikuwa amewaambia hapo awali.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּשָּׂא ... אֶת פְּנֵי אִיּוֹב
  choice: akamkubali Ayubu
  rationale: Nahau נשׂא פנים hapa inaonyesha kumpokea mtu kwa kibali. “Akamkubali Ayubu” huwasilisha maana hiyo wazi, huku taswira halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Nahau ya kibali cha Mungu kwa Ayubu
  choice: Yahwe akamkubali Ayubu
  alternative: Yahwe akamwonyesha Ayubu kibali / Yahwe akainua uso wa Ayubu
  rationale: Muktadha unaonyesha kwamba Mungu alimpokea Ayubu kwa kibali, hasa katika jukumu lake la kuwaombea rafiki zake. Tafsiri haiongezi dai jingine la kiteolojia.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Majina yametoholewa kwa maumbo yanayoeleweka: Elifazi, Bildadi, Sofari, na Ayubu. Kiunganishi “Basi” kinaendeleza matokeo ya maagizo yaliyotangulia.'
