  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi na yenye hadhi. Majina yametoholewa kwa tahajia inayofaa Kiswahili, na urudiaji mzito wa muundo wa Kiebrania ‘akaita jina la’ umebadilishwa kuwa ‘akamwita’ kwa uasilia.
