  text: He named the first Jemimah[a], the second Keziah, and the third Keren-happuch.
translation:
  language: sw
  text: Akamwita binti wa kwanza Yemima, wa pili Kesia, na wa tatu Keren-Hapuki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda jina Keren-Hapuki linamaanisha “pembe ya antimoni” au “pembe ya rangi ya macho,” yaani chombo cha kuhifadhia kipodozi au rangi yenyewe ya kujipaka machoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: Akamwita
  rationale: Muundo wa Kiebrania una maana ya kumpa mtu jina. Kiswahili cha kawaida hutumia ‘akamwita’ kwa tendo hili la kumpa jina; mtenda wa kiume katika muktadha ni Ayubu.
- source_word: הָאַחַת
  choice: wa kwanza
  rationale: Ingawa neno hilo kihalisi ni ‘mmoja,’ katika orodha hii linaonyesha mpangilio wa binti wa kwanza.
- source_word: יְמִימָה
  choice: Yemima
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: הַשֵּׁנִית
  choice: wa pili
  rationale: Ni uwasilishaji wa kawaida wa nambari ya mpangilio katika orodha hii.
- source_word: קְצִיעָה
  choice: Kesia
  rationale: Jina la mtu limetoholewa kwa kufuata sauti ya Kiebrania na mfumo wa tahajia ya Kiswahili.
- source_word: הַשְּׁלִישִׁית
  choice: wa tatu
  rationale: Ni uwasilishaji wa kawaida wa nambari ya mpangilio katika orodha hii.
- source_word: קֶרֶן הַפּוּךְ
  choice: Keren-Hapuki
  rationale: Jina ambatani limetoholewa badala ya kutafsiriwa; kistari kinadumisha muundo wake wa sehemu mbili, huku maana yake ya kileksika ikielezwa katika tanbihi.
