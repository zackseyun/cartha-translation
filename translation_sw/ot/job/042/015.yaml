base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: sw
  text: Katika nchi yote hawakupatikana wanawake wazuri kama binti za Ayubu[a]. Naye baba yao akawapa urithi miongoni mwa ndugu zao wa kiume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika dunia yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְצָא
  choice: hawakupatikana
  rationale: Kauli ya kutendwa ya מצא hapa inaeleza kwamba hakukuwa na wanawake waliopatikana waliofanana nao kwa uzuri. Kiswahili hutumia upatanisho wa wingi kwa nomino 'wanawake'.
- source_word: נָשִׁים יָפוֹת
  choice: wanawake wazuri
  rationale: נָשִׁים ni 'wanawake,' si lazima 'wake,' na יָפוֹת hapa hueleza uzuri wa sura. 'Wazuri' ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: כִּבְנוֹת אִיּוֹב
  choice: kama binti za Ayubu
  rationale: Kiambishi כ kinaonyesha ulinganisho; 'kama binti za Ayubu' ni ulinganisho wa moja kwa moja na wa kawaida.
- source_word: בְּכָל הָאָרֶץ
  choice: katika nchi yote
  rationale: הָאָרֶץ inaweza kumaanisha 'nchi' au 'dunia.' Muktadha wa simulizi unaunga mkono 'nchi' huku tanbihi ikihifadhi maana nyingine halali.
- source_word: וַיִּתֵּן לָהֶם
  choice: akawapa
  rationale: Hii inawakilisha kwa ufupi na kwa kawaida tendo la baba kuwapa mabinti zake kitu.
- source_word: נַחֲלָה
  choice: urithi
  rationale: נַחֲלָה ni urithi au mali ya kurithi; 'urithi' ni tafsiri wazi na ya kawaida.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: miongoni mwa ndugu zao wa kiume
  rationale: בְּתוֹךְ ni 'miongoni mwa,' na אֲחֵיהֶם humaanisha hasa ndugu zao wa kiume. Ufafanuzi 'wa kiume' huepusha utata wa neno la Kiswahili 'ndugu' na kuhifadhi jambo muhimu la kijamii katika mstari huu.
theological_decisions:
- issue: Neno la ukoo lenye jinsia maalumu
  choice: miongoni mwa ndugu zao wa kiume
  alternative: miongoni mwa ndugu zao
  rationale: Kiebrania kinataja ndugu wa kiume hasa. Kwa kuwa 'ndugu' katika Kiswahili linaweza kujumuisha jinsia zote, 'wa kiume' hudumisha maana ya chanzo bila kuibadili kuwa ya kijinsia isiyo maalumu.
- issue: Upeo wa הָאָרֶץ
  choice: katika nchi yote
  alternative: katika dunia yote
  rationale: Neno hilo linaweza kumaanisha nchi au dunia. 'Nchi' inafaa zaidi kwa upeo wa kisimulizi, huku tanbihi ikihifadhi uwezekano wa 'dunia.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili kwa usomaji wa kawaida; 'Naye ... akawapa' huhifadhi mwendelezo wa simulizi. Alama ya tanbihi [a] imewekwa mara tu baada ya dai linalohusu upeo wa nchi.
