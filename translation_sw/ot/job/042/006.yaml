  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: sw
  text: Kwa hiyo najidharau[a], na ninatubu katika mavumbi na majivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hiyo nakataa niliyosema, nami nabadili nia kuhusu mavumbi na majivu.” Kiebrania ni kifupi na maana yake inajadiliwa, hasa kwa kuwa hakitaji wazi kile ambacho Ayubu anakikataa au kujidharau, na kitenzi kilichotafsiriwa “ninatubu” kinaweza pia kumaanisha “nabadili nia,” “nalegeza msimamo,” au “nafarijika.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kirai hiki kinaonyesha hitimisho la Ayubu kutokana na kukutana kwake na Mungu na maneno yaliyotangulia. “Kwa hiyo” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kutoa hitimisho.
- source_word: אֶמְאַס
  choice: najichukia
  rationale: Kitenzi מאס humaanisha kukataa au kudharau/kuchukia. Kiebrania hakitaji yambwa; “-ji-” limeongezwa kwa kuzingatia muktadha wa kujinyenyekeza kwa Ayubu, ingawa uwezekano wa kuyakataa maneno au madai yake umehifadhiwa katika tanbihi.
- source_word: וְנִחַמְתִּי
  choice: na ninatubu
  rationale: Katika kauli ya Niphal, נחם inaweza kumaanisha kusikitika, kubadili nia, kutubu, kulegeza msimamo, au kufarijika. Muktadha wa jibu la Ayubu mbele za Mungu unaunga mkono “ninatubu,” bila kuficha maana nyingine zinazowezekana katika tanbihi.
- source_word: עַל
  choice: katika
  rationale: Ingawa עַל kwa kawaida humaanisha “juu ya” au “kuhusu,” hapa “katika” linaeleza kwa Kiswahili cha kawaida hali au mazingira ya kujinyenyekeza yanayohusishwa na mavumbi na majivu.
- source_word: עָפָר וָאֵפֶר
  choice: mavumbi na majivu
  rationale: Hiki ni kirai kinachoashiria hali ya kufa, maombolezo, na kujinyenyekeza. “Mavumbi na majivu” ni usemi wa kawaida na wenye hadhi katika Kiswahili cha Biblia.
theological_decisions:
- issue: 'Maana ya jibu la mwisho la Ayubu: kujishusha na kutubu, au kufuta maneno na hoja yake'
  choice: 'Ayubu anajishusha mwenyewe na kutubu: “najichukia, na ninatubu katika mavumbi na majivu.”'
  alternative: Ayubu anakana au anafuta maneno/hoja yake na kubadili nia kuhusu mavumbi na majivu; pia inawezekana kuwa anakataa malalamiko yake bila kujitaja mwenyewe waziwazi.
  rationale: Kiebrania ni kifupi na hakitaji yambwa la אֶמְאַס; vilevile וְנִחַמְתִּי lina maana kadhaa. Muktadha wa 42:5 unaunga mkono jibu la kujinyenyekeza na kutubu, lakini usomaji wa kufuta maneno au kulegeza msimamo unawezekana na umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Najichukia” ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi ufupi na utata halisi wa Kiebrania. Kirai “katika mavumbi na majivu” kimetumiwa kwa ufasaha wa Kiswahili na kwa kuhifadhi taswira ya maombolezo na kujinyenyekeza.
