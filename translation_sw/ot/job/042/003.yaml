  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: sw
  text: “Ni nani huyu anayeficha shauri pasipo maarifa?”[a] Kwa hiyo nimesema, lakini sikuelewa—mambo ya ajabu kupita uwezo wangu[b], ambayo sikuyajua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo, “Ni nani huyu anayelifanya shauri kuwa giza pasipo maarifa?” Maneno ya Ayubu hapa yanatofautiana katika Kiebrania na yale ya Ayubu 38:2.
    reason: lexical_alternative
  - marker: b
    text: Au “mambo yaliyonishinda” au “maajabu yaliyo juu ya uwezo wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Ni nani huyu
  rationale: Hudumisha nguvu ya swali la moja kwa moja na ni Kiswahili cha kawaida na chenye heshima.
- source_word: מַעְלִים
  choice: anayeficha
  rationale: Hifili ya עלם ina maana ya kuficha au kusitiri. Uchaguzi huu unafuata neno la Kiebrania katika 42:3 bila kulilinganisha kimabavu na חשך la 38:2.
- source_word: עֵצָה
  choice: shauri
  rationale: ‘Shauri’ linaweza kumaanisha kusudi au mpango unaotokana na hekima, na linadumisha upana wa neno la Kiebrania.
- source_word: בְּלִי דָעַת
  choice: pasipo maarifa
  rationale: Ni tafsiri ya karibu inayodumisha dhana ya kutokuwa na maarifa; ‘pasipo’ inafaa kwa sajili ya kifasihi yenye kueleweka.
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Huonyesha uhusiano wa kimantiki kati ya karipio lililonukuliwa na ungamo la Ayubu.
- source_word: הִגַּדְתִּי
  choice: nimesema
  rationale: Katika muktadha huu kitenzi kinarejelea maneno ambayo Ayubu ameyatoa; ‘nimesema’ ni cha kawaida na hakiongezi mkazo wa ‘kutangaza’ usiolazimishwa na muktadha.
- source_word: וְלֹא אָבִין
  choice: lakini sikuelewa
  rationale: ‘Lakini’ huonyesha tofauti iliyodokezwa kati ya kusema na kutokuelewa; wakati uliopita unafaa kwa ungamo la Ayubu kuhusu maneno yake ya awali.
- source_word: נִפְלָאוֹת
  choice: mambo ya ajabu mno
  rationale: Huonyesha mambo yanayostaajabisha na yaliyo juu ya uwezo wa Ayubu kuyafahamu, bila kuyafanya tu kuwa miujiza.
- source_word: מִמֶּנִּי
  choice: kwangu
  rationale: Pamoja na ‘ya ajabu mno,’ neno hili huunda Kiswahili cha asili kinachoonyesha kwamba mambo hayo yalizidi ufahamu wa Ayubu; maana ya ‘yaliyonishinda’ imewekwa katika tanbihi.
- source_word: וְלֹא אֵדָע
  choice: ambayo sikuyajua
  rationale: Kiunganishi cha uhusiano kimeongezwa kwa ulaini wa Kiswahili huku maana ya kifungu cha mwisho ikidumishwa.
theological_decisions:
- issue: Uhusiano wa Ayubu 42:3 na karipio la Mungu katika Ayubu 38:2
  choice: Kutafsiri neno lililopo katika 42:3 kama ‘anayeficha shauri’
  alternative: ‘anayetia shauri giza’ au ‘anayelifanya shauri kuwa giza’
  rationale: Ingawa Ayubu anaonekana kunukuu au kurejelea karipio la awali, Kiebrania cha 42:3 kinatumia עלם, tofauti na חשך katika 38:2. Tafsiri haipaswi kusawazisha tofauti hiyo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Shauri’ na ‘pasipo maarifa’ vinadumisha uzito wa kishairi bila kuwa vya kizamani kupita kiasi. Alama za tanbihi zimewekwa mara moja kila moja katika matini kuu.
