base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: sw
  text: Yahwe akabariki kipindi cha baadaye cha maisha ya Ayubu kuliko mwanzo wake[a]. Akawa na kondoo elfu kumi na nne, ngamia elfu sita, jozi elfu moja za ng’ombe[b], na punda-jike elfu moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwisho wa Ayubu kuliko mwanzo wake.”'
    reason: lexical_alternative
  - marker: b
    text: Au “jozi elfu moja za ng’ombe wa kulimia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu lililo katika Kiebrania badala ya kulibadili kuwa cheo.
- source_word: בֵּרַךְ
  choice: akaubariki
  rationale: Kitenzi hiki huonyesha baraka ya Mungu; hapa baraka hiyo inaonekana pia katika ustawi wa Ayubu.
- source_word: אַחֲרִית אִיּוֹב
  choice: mwisho wa maisha ya Ayubu
  rationale: אַחֲרִית huweza kumaanisha mwisho au kipindi cha baadaye. Usemi huu wa Kiswahili unaonyesha sehemu ya baadaye ya maisha yake bila kuibana kuwa siku zake za mwisho tu.
- source_word: מֵרֵאשִׁתוֹ
  choice: kuliko mwanzo wake
  rationale: Kihusishi מִן kinaonyesha ulinganisho kati ya hali ya Ayubu ya baadaye na hali yake ya mwanzo.
- source_word: וַיְהִי לוֹ
  choice: Akawa na
  rationale: Ni Kiswahili cha kawaida kwa muundo wa Kiebrania unaomaanisha kwamba mali hizo zilikuwa zake.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: kondoo elfu kumi na nne
  rationale: צֹאן ni jina la jumla la mifugo midogo na laweza kujumuisha kondoo na mbuzi, lakini hapa ‘kondoo’ linafuata maana ya kawaida katika orodha inayolingana na Ayubu 1:3.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: ngamia elfu sita
  rationale: Ni tafsiri ya moja kwa moja ya idadi na nomino.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: jozi elfu moja za ng’ombe
  rationale: צֶמֶד hurejelea jozi ya wanyama wa kazi waliofungwa pamoja; tanbihi inaeleza uwezekano wa kueleza kwa ‘jozi za ng’ombe wa kulimia.’
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: punda-jike elfu moja
  rationale: אֲתוֹנוֹת hutaja hasa punda wa kike, na ‘punda-jike’ linatunza ubainifu huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; ‘Yahwe’ linahifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Maana ya baraka katika mstari huu
  choice: akaubariki
  alternative: akamfanikisha
  rationale: ‘Akaubariki’ hudumisha kwamba Mungu ndiye chanzo cha neema na ustawi, bila kupunguza baraka kuwa mali pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa sentensi ni wa kawaida kwa msomaji wa leo, huku ulinganisho wa mwanzo na mwisho wa Ayubu na ubainifu wa punda wa kike vikihifadhiwa.
