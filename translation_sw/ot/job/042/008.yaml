source:
  edition: WLC
  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: sw
  text: Basi, jichukulieni mafahali saba na kondoo dume saba, mwende kwa mtumishi wangu Ayubu, mkatoe sadaka ya kuteketezwa kwa ajili yenu. Naye mtumishi wangu Ayubu atawaombea, kwa maana nitamkubali yeye,[a] ili nisiwatendee jambo la aibu.[b] Kwa maana hamkusema yaliyo sawa kunihusu,[c] kama alivyosema mtumishi wangu Ayubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “kwa maana ni uso wake tu nitakaouinua,” nahau yenye maana ya “nitamkubali” au “nitamwonyesha kibali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ili nisiwatendee sawasawa na upumbavu wenu.” Neno la Kiebrania linaweza kumaanisha upumbavu mbaya, tendo la aibu, au fedheha.
    reason: lexical_alternative
  - marker: c
    text: Au, “hamkusema yaliyo sawa kwangu.” Kiebrania kinaweza kueleweka kuwa “kwangu” au, kulingana na muktadha, “kunihusu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה קְחוּ לָכֶם
  choice: Basi, jichukulieni
  rationale: וְעַתָּה hapa lina nguvu ya kuendeleza hitimisho na agizo, hivyo “Basi” ni ya asili kuliko “Sasa” ya wakati halisi. Dativi לָכֶם imewakilishwa kwa umbo la kujirejelea “jichukulieni.”
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: mafahali saba na kondoo dume saba
  rationale: פָרִים ni ng’ombe wa kiume/mafahali, na אֵילִים ni kondoo wa kiume; “kondoo dume” ni Kiswahili sanifu na kinachoeleweka kwa urahisi.
- source_word: עַבְדִּי אִיּוֹב
  choice: mtumishi wangu Ayubu
  rationale: עֶבֶד hapa ni cheo cha heshima kinachoonyesha uaminifu kwa Mungu, si msisitizo wa hali ya utumwa.
- source_word: וְהַעֲלִיתֶם עוֹלָה בַּעַדְכֶם
  choice: mkajitolee sadaka ya kuteketezwa
  rationale: העלה עֹלָה ni nahau ya ibada ya kutoa sadaka inayoteketezwa kabisa. Umbo “jlitolee” linaendeleza maana ya בַּעַדְכֶם, yaani kwa ajili yao wenyewe.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: atawaombea
  rationale: Kitenzi pamoja na kihusishi kinaonyesha sala ya kuwaombea wengine; “atawaombea” ni kifupi, wazi, na cha asili.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: kwa maana nitamkubali yeye
  rationale: Nahau ya Kiebrania “kuinua uso” humaanisha kumpokea au kumwonyesha mtu kibali. Kiwakilishi “yeye” kinadumisha msisitizo wa kwamba Ayubu ndiye atakayekubaliwa kama mwombezi.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: ili nisiwatendee jambo la aibu
  rationale: נְבָלָה linaweza kumaanisha upumbavu mbaya, fedheha, au tendo la aibu. Tafsiri hii inadumisha muundo wa karibu wa Kiebrania bila kuamua kimya kimya kwamba neno linamaanisha tu “upumbavu wao.”
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: hamkusema yaliyo sawa kunihusu
  rationale: אֵלַי kimsingi ni “kwangu,” lakini katika muktadha inaweza kueleweka “kunihusu.” Chaguo la maandishi linafuata maana ya mjadala kuhusu Mungu, huku tanbihi ikihifadhi uwezekano wa “kwangu.”
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: kama alivyosema mtumishi wangu Ayubu
  rationale: Kitenzi kilichoachwa katika Kiebrania kimejazwa kwa Kiswahili ili kulifanya linganisho liwe kamili na la asili, bila kuongeza maana mpya.
theological_decisions:
- issue: Kukubaliwa kwa Ayubu na nafasi ya sala yake
  choice: Mungu anamkubali Ayubu katika nafasi ya kuwaombea rafiki zake, na sala hiyo inahusishwa na kuepushwa kwa hukumu juu yao.
  alternative: Kauli hiyo inaweza kusisitiza tu kibali binafsi cha Mungu kwa Ayubu.
  rationale: Mfuatano wa agizo la sadaka, sala ya Ayubu, na nahau ya “kuinua uso wake” unaonyesha wazi kazi ya maombezi, bila kuingiza mafundisho ya baadaye yasiyotajwa katika aya.
- issue: Maana ya נְבָלָה katika kitendo kinachoweza kufanywa na Mungu
  choice: “jambo la aibu” limetumiwa kwa uaminifu kwa upana wa neno, huku likieleweka kama adhabu ya kufedhehesha inayowapata.
  alternative: “kuwatendea sawasawa na upumbavu wenu” au “kuwatendea kwa fedheha.”
  rationale: Neno linaweza kueleza upumbavu wa kulaumika au jambo la kuchukiza/aibu. Tafsiri haipaswi kulainisha mvutano wa usemi wa Kiebrania kwa kuubadilisha moja kwa moja kuwa maelezo ya hukumu kulingana na upumbavu wao.
- issue: אֵלַי kama “kwangu” au “kunihusu”
  choice: Maandishi yanasema “kunihusu,” na tanbihi inadumisha “kwangu.”
  alternative: “hamkuniambia yaliyo sawa.”
  rationale: Sarufi inaruhusu uelekeo wa “kwangu,” lakini muktadha wa hotuba za marafiki kuhusu Mungu unaunga mkono “kunihusu.” Uwezekano halisi wa kifungu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. “Basi” limetumiwa kama kiunganishi cha hitimisho cha וְעַתָּה; majina ya sadaka na wanyama yametolewa kwa lugha ya kawaida ya Biblia. Alama zote za tanbihi [a], [b], na [c] zimo katika maandishi.
