lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: akawa na
  rationale: Muundo wa Kiebrania wa kuwepo pamoja na ל־ yenye kiambishi cha nafsi unaonyesha umiliki, yaani ‘alikuwa na/akawa na.’ Katika muktadha wa kurejeshewa hali yake, ‘akawa na’ ni Kiswahili cha kawaida na huonyesha matokeo katika mwendelezo wa simulizi.
- source_word: שִׁבְעָנָה
  choice: saba
  rationale: Namba ya Kiebrania imetafsiriwa moja kwa moja kwa namba ya Kiswahili ‘saba.’
- source_word: בָנִים
  choice: wana
  rationale: Neno la Kiebrania linamaanisha watoto wa kiume. ‘Wana’ ni neno la heshima na la kawaida katika sajili ya Biblia ya Kiswahili, na hapa linatofautishwa wazi na ‘binti.’
- source_word: וְשָׁלֹשׁ
  choice: na watatu
  rationale: Kiunganishi na namba vimetolewa kwa mpangilio wa kawaida wa Kiswahili; umbo ‘watatu’ linapatana kisarufi na ‘binti.’
- source_word: בָּנוֹת
  choice: binti
  rationale: Neno la Kiebrania linamaanisha watoto wa kike; ‘binti’ ni tafsiri ya kawaida, ya sasa, na yenye heshima.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. ‘Pia’ huhifadhi mwendelezo wa kifungu, huku ‘akawa na’ ikiwasilisha kwa kawaida nahau ya umiliki ya Kiebrania.
