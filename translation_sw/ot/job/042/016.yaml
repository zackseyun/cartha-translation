translation:
  language: sw
  text: Baada ya hayo, Ayubu aliishi miaka mia moja na arobaini, akawaona wanawe na wana wa wanawe, hata kizazi cha nne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi חיה hapa kinaeleza kuendelea kwa maisha ya Ayubu baada ya matukio yaliyotangulia; “aliishi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אַחֲרֵי זֹאת
  choice: Baada ya hayo
  rationale: Kirai hiki kinaonyesha wakati uliofuata mambo yaliyosimuliwa kabla; “Baada ya hayo” ni Kiswahili cha kawaida na kinaweza kurejelea jumla ya yaliyotangulia.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: miaka mia moja na arobaini
  rationale: Hii inatoa idadi ya Kiebrania kwa usahihi na kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וַיַּרְא
  choice: akawaona
  rationale: ראה maana yake ya msingi ni “kuona.” “Akawaona” hudumisha maana hiyo huku ikiunganisha sentensi kwa Kiswahili cha asili bila kuongeza wazi wazo la “aliishi hata akawaona.”
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania ni wingi wa kiume, “wanawe”; uchaguzi huu huhifadhi rejeo hilo bila kulifanya kuwa “watoto wake” kwa ujumla.
- source_word: בְּנֵי בָנָיו
  choice: wana wa wanawe
  rationale: Kirai hiki kinafuata kwa karibu muundo wa Kiebrania, “wana wa wanawe,” na kuhifadhi rejeo la kiume badala ya kutumia neno pana la uzao.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: vizazi vinne
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi na nomino, na inaeleza upeo wa vizazi ambavyo Ayubu aliviona.
