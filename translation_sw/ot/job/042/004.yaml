lexical_decisions:
- source_word: שְׁמַע
  choice: Sikiliza
  rationale: Kauli ya amri ya שׁמע. ‘Sikiliza’ ni amri ya moja kwa moja na ya kawaida katika Kiswahili, huku ikihifadhi mwangwi wa maneno ya BWANA katika Ayubu 38:3 na 40:7.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe ya ombi au adabu; ‘tafadhali’ hutoa maana hiyo kwa Kiswahili cha sasa bila kuifanya kuwa ya kizamani.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: nami nitasema
  rationale: Huhifadhi kiunganishi, msisitizo wa kiwakilishi huru, na tendo la wakati ujao kwa usemi wa asili wa Kiswahili.
- source_word: אֶשְׁאָלְךָ
  choice: nitakuuliza
  rationale: Hutoa maana ya msingi ya שאל pamoja na kiambishi cha nafsi ya pili umoja, bila kuongeza nguvu ya ‘nitakuhoji.’
- source_word: וְהוֹדִיעֵנִי
  choice: nawe unijulishe
  rationale: Kitenzi cha Hiphil cha ידע kina maana ya kisababishi, ‘fanya nijue.’ ‘Unijulishe’ huhifadhi maana hiyo kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Uhusiano wa mstari huu na Ayubu 38:3 na 40:7
  choice: Maneno yametafsiriwa moja kwa moja kama mwangwi wa changamoto ya BWANA ya awali, bila kuongeza ‘ulisema’ katika matini.
  alternative: Kuongeza utangulizi kama ‘Ulisema’ au alama zinazoonyesha wazi kuwa ni nukuu.
  rationale: Kiebrania hakina utangulizi huo. Mwangwi wa karibu sana unafafanuliwa katika tanbihi ili matini isiongezwe maneno yasiyokuwamo.
- issue: Nguvu ya וְהוֹדִיעֵנִי
  choice: nawe unijulishe
  alternative: nawe unitangazie / nawe unijibu
  rationale: ‘Unijulishe’ huhifadhi kisababishi ‘fanya nijue’ bila kukibana kiimani au kukigeuza moja kwa moja kuwa ‘nijibu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sikiliza’ ni ya kawaida kuliko ‘sikia’ kama amri ya kutega sikio, na ‘unijulishe’ ni ya asili huku ikihifadhi nguvu ya kisababishi cha Kiebrania. Alama zote za tanbihi zimewekwa katika matini.
