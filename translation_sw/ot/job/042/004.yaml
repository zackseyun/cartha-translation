  text: Hear[a], please, and I will speak; I will ask you[b], and you declare to me.
translation:
  language: sw
  text: “Sikiliza[a], tafadhali, nami nitasema; nitakuuliza, nawe unijulishe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa Ayubu anarudia karibu neno kwa neno maneno ya BWANA ya awali katika Ayubu 38:3 na 40:7.
