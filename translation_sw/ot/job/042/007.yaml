  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: sw
  text: Ikawa baada ya Yahwe kumwambia Ayubu maneno hayo, Yahwe akamwambia Elifazi Mtemani, “Hasira yangu inawaka dhidi yako na dhidi ya rafiki zako wawili, kwa sababu hamkusema yaliyo sawa kunihusu,[a] kama alivyosema mtumishi wangu Ayubu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamkusema yaliyo sawa kwangu, kama alivyosema mtumishi wangu Ayubu.” Kihusishi cha Kiebrania kwa tafsiri ya moja kwa moja ni “kwangu,” lakini katika muktadha kinaweza kumaanisha “kunihusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililo katika maandishi ya Kiebrania kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: וַיְהִי אַחַר
  choice: Ikawa baada ya
  rationale: Linadumisha mpito wa kisimulizi wa Kiebrania bila kufanya sentensi kuwa ngumu isivyo lazima.
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: kumwambia Ayubu maneno hayo
  rationale: Kitenzi דבר pamoja na אֶל אִיּוֹב humtaja Ayubu kama anayeelekezewa maneno; ‘maneno hayo’ huhifadhi maana halisi ya דְּבָרִים.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: Elifazi Mtemani
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina na neno linaloonyesha mtu wa Temani.
- source_word: חָרָה אַפִּי
  choice: Hasira yangu inawaka
  rationale: Linahifadhi sitiari hai ya Kiebrania ya hasira kuwaka, huku likibaki Kiswahili cha kawaida.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: dhidi yako na dhidi ya rafiki zako wawili
  rationale: Katika nahau hii, kihusishi kinaonyesha walengwa wa hasira; kurudia ‘dhidi ya’ kunafanya uhusiano huo uwe wazi.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: hamkusema yaliyo sawa kunihusu
  rationale: ‘Yaliyo sawa’ huhifadhi upana wa נְכוֹנָה, nao muktadha unaunga mkono kuelewa אֵלַי kuwa kuhusu Mungu, ingawa kwa umbo la moja kwa moja ni ‘kwangu.’
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: kama alivyosema mtumishi wangu Ayubu
  rationale: Linahifadhi ulinganisho na cheo muhimu ‘mtumishi wangu,’ huku kitenzi kinachodokezwa kikikamilishwa kwa Kiswahili cha asili.
theological_decisions:
- issue: Iwapo אֵלַי itafsiriwe ‘kwangu’ au ‘kunihusu’
  choice: kunihusu
  alternative: kwangu
  rationale: Muktadha unatathmini yaliyosemwa na marafiki kuhusu Mungu katika majadiliano. Hata hivyo, kwa kuwa kihusishi cha Kiebrania kwa umbo la moja kwa moja ni ‘kwangu,’ uwezekano huo umehifadhiwa katika tanbihi.
- issue: Nguvu ya נְכוֹנָה katika tathmini ya Mungu
  choice: yaliyo sawa
  alternative: kwa usahihi
  rationale: ‘Yaliyo sawa’ halibanwi na wazo la usahihi wa taarifa pekee; linaweza kujumuisha ukweli, ufaafu, na unyoofu wa maneno, hivyo huhifadhi mvutano wa kiteolojia wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisimulizi umehifadhiwa, lakini sentensi imetolewa kwa mtiririko wa kawaida wa Kiswahili. Jina ‘Yahwe’ limetumiwa badala ya kulibadilisha kuwa cheo.
