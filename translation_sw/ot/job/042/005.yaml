  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: sw
  text: Nilikuwa nimesikia habari zako[a], lakini sasa jicho langu limekuona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kusikia kwa sikio”; Kiebrania, kihalisi, “kwa kusikia kwa sikio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: nimesikia habari zako tu
  rationale: Kirai hiki cha Kiebrania, kihalisi ‘kwa kusikia kwa sikio,’ ni nahau inayomaanisha kujua kwa taarifa iliyosikiwa. Kiswahili ‘kusikia habari zako tu’ ni cha kawaida na kinaendeleza tofauti kati ya taarifa ya awali na kuona kwa moja kwa moja.
- source_word: שְׁמַעְתִּיךָ
  choice: nilikuwa nimesikia habari zako
  rationale: Ingawa umbo la Kiebrania ni ‘nilikusikia,’ katika muktadha huu maana yake ni kusikia habari kumhusu Mungu. ‘Nilikuwa nimesikia’ pia huonyesha hali iliyotangulia inayotofautishwa na ‘sasa.’
- source_word: וְעַתָּה
  choice: lakini sasa
  rationale: Kiunganishi kinaonyesha tofauti kubwa kati ya ufahamu wa awali uliotokana na taarifa na tukio la sasa; ‘lakini sasa’ huleta tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: עֵינִי
  choice: jicho langu
  rationale: Kiebrania kimetumia umoja. Kuuhifadhi kunadumisha usemi wa kishairi na hali ya kibinafsi ya ungamo la Ayubu.
- source_word: רָאָתְךָ
  choice: limekuona
  rationale: Kitenzi timilifu kinaonyesha tendo lililotimia lenye umuhimu wa sasa. ‘Limekuona’ huwasilisha maana hiyo kwa kawaida bila kuifanya ‘kuona’ kuwa maelezo ya kiufafanuzi.
theological_decisions:
- issue: Asili ya Ayubu ‘kumwona’ Mungu
  choice: limekuona
  alternative: limekutambua; limekutana nawe moja kwa moja
  rationale: Kitenzi cha Kiebrania cha kuona kimetafsiriwa moja kwa moja. Mstari unatofautisha kusikia kwa njia ya taarifa na kuona, lakini hauelezi kwa undani aina ya kuona huko; kwa hiyo tafsiri haikulazimishi kuwa sitiari wala maono kamili ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Habari zako’ ni nahau ya kawaida kwa kusikia kumhusu mtu, huku ‘jicho langu’ likihifadhi umoja na taswira ya kishairi ya Kiebrania.
