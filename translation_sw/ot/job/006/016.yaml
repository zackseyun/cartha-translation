translation:
  language: sw
  text: ambavyo huwa vyeusi kwa sababu ya barafu[a], na theluji hujificha juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambavyo huwa na tope kwa sababu ya barafu.” Kishirikishi cha Kiebrania kimsingi humaanisha “vilivyo vyeusi” au “vilivyotiwa giza,” lakini katika muktadha huu huenda kikadokeza maji yaliyotiwa tope na hali za majira ya baridi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: ambayo huwa meusi
  rationale: Kitenzi kishirikishi kutoka קדר kimsingi huonyesha kuwa na rangi nyeusi au kutiwa giza. Katika muktadha huu kinarejelea vijito vya msimu vilivyotajwa katika mstari uliotangulia.
- source_word: מִנִּי
  choice: kwa sababu ya
  rationale: Kihusishi kinaweza kuonyesha chanzo au sababu; hapa kinaeleweka kwa kawaida kuwa barafu ndiyo inayosababisha vijito hivyo kuonekana vyeusi.
- source_word: קָרַח
  choice: barafu
  rationale: Neno linaweza kumaanisha barafu au sakitu; 'barafu' inafaa katika taswira hii ya majira ya baridi na inaendana na kutajwa kwa theluji.
- source_word: עָלֵימוֹ
  choice: juu yake
  rationale: Ingawa kiambishi cha Kiebrania ni cha wingi, rejeleo lake ni mkusanyo wa vijito vya msimu; Kiswahili kwa kawaida hutumia umoja wa ngeli ya mto/kijito katika mstari huu.
- source_word: יִתְעַלֶּם
  choice: hujificha
  rationale: Muundo wa hitpael unahifadhi maana rejeshi ya kujificha badala ya kugeuzwa moja kwa moja kuwa kauli tendwa.
- source_word: שָׁלֶג
  choice: theluji
  rationale: '''Theluji'' ni neno la kawaida na lenye heshima kwa snow; Kiswahili hakihitaji kibainishi kinacholingana na ''the'' ya Kiingereza.'
