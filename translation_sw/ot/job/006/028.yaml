  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: sw
  text: Lakini sasa, tafadhali nitazameni; je, ningesema uongo mbele yenu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “je, ningewadanganya ana kwa ana?” Kitenzi cha Kiebrania kilichotafsiriwa “ningesema uongo” kinaweza pia kumaanisha kusema kwa udanganyifu. “Mbele yenu” ni, kihalisi, “juu ya nyuso zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Katika muktadha, waw inaonyesha utofauti na hoja iliyotangulia, huku עַתָּה ikielekeza kwenye ombi la sasa.
- source_word: הוֹאִילוּ
  choice: tafadhali
  rationale: Amri hii ya kuwa tayari au kukubali hutumiwa hapa kama ombi la heshima na kwa Kiswahili cha kawaida inaelezwa vizuri kwa “tafadhali.”
- source_word: פְנוּ בִי
  choice: nitazameni
  rationale: Kirai kinaweza kumaanisha kugeukia mtu au kumwelekezea macho na fikira. “Nitazameni” ni cha asili katika Kiswahili na kinafaa kwa ombi la Ayubu la kuchunguzwa moja kwa moja.
- source_word: וְעַל פְּנֵיכֶם
  choice: mbele yenu
  rationale: Huhifadhi wazo la kusema katika uwepo wao na ana kwa ana, bila kutumia tafsiri ngumu isiyo ya kawaida ya “juu ya nyuso zenu.”
- source_word: אִם אֲכַזֵּב
  choice: je, ningesema uongo?
  rationale: אִם hapa ina nguvu ya swali la balagha, si sharti la kawaida. Kitenzi kinaweza kumaanisha kusema uongo au kusema kwa udanganyifu.
