translation:
  language: sw
  text: Wakati zinapopata joto, hutoweka; katika joto lake[a], hukauka kutoka mahali pao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “katika joto lake”; yaweza pia kutafsiriwa “katika joto.”
    reason: lexical_alternative
  - marker: b
    text: “Mahali pao” katika muktadha huenda pakamaanisha hasa njia au bonde ambamo kijito hutiririka.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעֵת
  choice: Wakati
  rationale: Kirai hiki kinaanzisha kishazi cha wakati; “Wakati” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יְזֹרְבוּ
  choice: zinapopata joto
  rationale: Kitenzi hiki adimu humaanisha kupata joto au kutiwa joto. Usemi huu ni wa asili kwa vijito vya msimu vinavyozungumziwa katika muktadha.
- source_word: נִצְמָתוּ
  choice: hutoweka
  rationale: Umbo hili linaweza kueleza kuisha, kuangamizwa, au kutoweka. Kwa maji ya vijito vya msimu, “hutoweka” huwasilisha picha bila kuifafanua kupita kiasi.
- source_word: בְּחֻמּוֹ
  choice: joto linapozidi
  rationale: Kihalisi ni “katika joto lake,” lakini kiwakilishi chake hakina rejeleo lisilo na utata. Tafsiri hii ya kimazingira ni ya kawaida na hudumisha ulinganifu wa vishazi vya wakati; maana halisi imehifadhiwa katika tanbihi.
- source_word: נִדְעֲכוּ
  choice: hukauka na kutoweka
  rationale: Kitenzi kinaweza kumaanisha kuzimwa au kufifia. Katika picha ya vijito chini ya joto, usemi huu unaonyesha maji kukauka na kuacha kuonekana, huku ukidumisha mwangwi wa kutoweka.
- source_word: מִמְּקוֹמָם
  choice: mahali pake
  rationale: Nomino humaanisha mahali au eneo. Umoja wa Kiswahili unapatana na rejeleo la kijumla kwa maji au mkondo, bila kulazimisha maana maalumu ya “njia ya kijito.”
