  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: sw
  text: Kwa maana sasa mmekuwa bure[a]; mnaona kitisho[b], nanyi mnaogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema, kwa tafsiri ya neno kwa neno, takribani, “mmekuwa si.” Wengi huelewa maana kuwa “mmekuwa bure” au “mmekuwa kama vijito hivyo,” yaani vijito visivyotegemeka vilivyotajwa katika mistari iliyotangulia.
    reason: textual_variant
  - marker: b
    text: Au, “mnaona janga, nanyi mnaogopa.” Neno hili linaweza kumaanisha kitisho, fadhaa, au janga linaloharibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha kauli hii na mfano uliotangulia wa vijito visivyotegemeka, bila kulazimisha sababu iliyo wazi kupita kiasi.
- source_word: עַתָּה
  choice: sasa
  rationale: Inaonyesha hali ya sasa, kinyume na msaada ambao Ayubu alikuwa ameutarajia.
- source_word: הֱיִיתֶם
  choice: mmekuwa
  rationale: 'Kitenzi היה hapa kinaeleweka kama badiliko la hali: rafiki zake wamegeuka kuwa wasio na msaada, kama vijito vilivyotajwa kabla.'
- source_word: לא
  choice: bure
  rationale: Maandishi yana לא, yaani kwa namna halisi 'si/hapana,' lakini muundo huo hauna ukamilifu wa kawaida. 'Mmekuwa bure' hudokeza kwamba wameonekana kutofaa kitu huku tanbihi ikihifadhi tatizo la maandishi.
- source_word: תִּרְאוּ
  choice: mnaona
  rationale: Maana ya msingi ya ראה ni kuona; hapa ni kuyaona maafa yaliyompata Ayubu.
- source_word: חֲתַת
  choice: maafa ya kutisha
  rationale: Neno linaweza kumaanisha hofu, kuvunjika moyo, au janga lenye kuangamiza. Usemi huu unahifadhi pande za janga linaloonekana na hofu inayosababishwa nalo.
- source_word: וַתִּירָאוּ
  choice: nanyi mnaogopa
  rationale: Inaeleza mwitikio wa sasa wa rafiki zake kwa hali ya Ayubu kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mmekuwa bure' ni rahisi kueleweka lakini tanbihi imehifadhi hali isiyo ya kawaida ya maandishi ya Kiebrania. 'Maafa ya kutisha' huepuka urudiaji hafifu wa 'mnaona hofu ... mnaogopa' na kuhifadhi uwezekano wa janga pamoja na kitisho.
