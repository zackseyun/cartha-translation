- source_word: וַ
  choice: Ndipo
  rationale: Waw ya mwanzo katika wayyiqtol inaendeleza mfuatano wa simulizi. “Ndipo” huonyesha kwamba jibu hili linafuata hotuba iliyotangulia kwa Kiswahili cha kawaida.
