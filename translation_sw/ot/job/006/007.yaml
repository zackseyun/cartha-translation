lexical_decisions:
- source_word: מֵאֲנָה
  choice: inakataa
  rationale: Kitenzi מאן humaanisha kukataa au kutotaka. Wakati wa sasa unafaa kwa malalamiko ya kishairi ya Ayubu na kuhifadhi maana ya uamuzi wa kutokubali.
- source_word: לִנְגּוֹעַ
  choice: kuvigusa
  rationale: נגע kwa kawaida ni ‘kugusa.’ Kiambishi ‘vi-’ kinarejelea vitu vinavyochukiza vilivyotajwa katika mstari uliotangulia.
- source_word: נַפְשִׁי
  choice: Nafsi yangu
  rationale: נפש inaweza kumaanisha nafsi, mtu mwenyewe, uhai, koo, au hamu ya chakula. ‘Nafsi yangu’ huhifadhi upana na kina cha picha ya Kiebrania bila kuibana kuwa hamu ya chakula pekee.
- source_word: הֵמָּה
  choice: ni
  rationale: Kiwakilishi hiki kinarejelea vitu vya mstari uliotangulia. Katika Kiswahili, muundo wa asili ‘ni kama’ huwasilisha urejeo huo bila kulazimisha kiwakilishi kisicho cha lazima.
- source_word: כִּדְוֵי
  choice: kama ugonjwa wa
  rationale: Neno hili, kutoka דוה, linahusu ugonjwa. Muundo wa Kiebrania umebanwa na ni mgumu; tafsiri hii huhifadhi picha yake badala ya kuamua kimya kimya kwamba chakula ni chenye kuchukiza au kimeharibika.
- source_word: לַחְמִי
  choice: chakula changu
  rationale: לחם inaweza kuwa ‘mkate’ kihalisi au ‘chakula’ kwa maana pana. ‘Chakula changu’ linafaa katika muktadha huu na halibani picha kuwa mkate pekee.
