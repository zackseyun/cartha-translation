lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na maelezo ya Ayubu yaliyotangulia kwa kutoa sababu ya kilio chake.
- source_word: עַתָּה
  choice: sasa
  rationale: Inasisitiza hali yake ya sasa.
- source_word: מֵחוֹל יַמִּים
  choice: kuliko mchanga wa bahari
  rationale: Ni ulinganisho wa uzito; Kiswahili cha kawaida hutumia umoja ‘bahari’ kwa maana ya jumla ingawa Kiebrania kina wingi.
- source_word: יִכְבָּד
  choice: ungekuwa mzito
  rationale: Kitenzi כבד humaanisha kuwa mzito. Kiima kilichodokezwa ni huzuni au taabu ya mstari uliotangulia, na hali ya masharti inaleta ulinganisho huo kwa Kiswahili cha asili.
- source_word: עַל־כֵּן
  choice: ndiyo maana
  rationale: Inaonyesha matokeo ya uzito mkubwa wa mateso yake.
- source_word: דְּבָרַי
  choice: maneno yangu
  rationale: Inahifadhi nomino ya wingi na maana yake ya moja kwa moja.
- source_word: לָעוּ
  choice: yamekuwa ya papara
  rationale: Kitenzi hiki ni kigumu na huenda kinamaanisha maneno yasiyodhibitiwa, yaliyovurugika, au ya haraka. ‘Ya papara’ ni Kiswahili cha sasa kinachoeleza usemi usiozingatiwa vizuri bila kuficha ugumu wa neno.
