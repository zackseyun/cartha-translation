  text: Ndugu zangu wametenda kwa hila kama kijito cha msimu[a], kama mikondo ya vijito vya msimu inayopita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama kijito ... kama mikondo ya vijito.” Neno la Kiebrania נחל linaweza kumaanisha kijito, bonde la mto, au mkondo wa maji wa msimu; hapa “kijito cha msimu” limetumiwa kuhifadhi taswira ya eneo kame.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: Ndugu zangu
  rationale: Neno la Kiebrania humaanisha kihalisi ‘ndugu zangu’ na linaweza pia kuwahusu watu wa karibu; Kiswahili ‘ndugu zangu’ huhifadhi maana ya kifamilia bila kuzuia matumizi yake mapana katika muktadha.
- source_word: בָּגְדוּ
  choice: wamenitendea kwa hila
  rationale: Kitenzi hiki huonyesha kutokuwa mwaminifu au kutenda kwa hila katika uhusiano. Kiambishi ‘-ni-’ kinaweka wazi kwa Kiswahili cha kawaida kwamba Ayubu ndiye aliyetendewa hivyo, jambo linalodokezwa na muktadha.
- source_word: כְמוֹ
  choice: kama
  rationale: Hiki ndicho kiunganishi cha kawaida cha ulinganisho katika Kiswahili.
- source_word: נָחַל
  choice: kijito cha msimu
  rationale: Katika muktadha huu neno linaashiria mkondo wa maji wa eneo kame ambao hujaa kwa msimu na baadaye hukauka. ‘Kijito cha msimu’ kinaeleweka kwa urahisi kuliko neno la mkopo ‘wadi’ na huhifadhi taswira hiyo.
- source_word: כַאֲפִיק
  choice: kama mifereji ya
  rationale: אפיק hurejelea njia, mfereji, au kitanda ambamo maji hupitia. ‘Mifereji’ huwasilisha umbo la mikondo hiyo kwa Kiswahili cha sasa.
- source_word: נְחָלִים
  choice: vijito vya msimu
  rationale: Wingi wa נחל umetafsiriwa kwa uthabiti ili kudumisha taswira ya mikondo ya maji isiyodumu mwaka mzima.
- source_word: יַעֲבֹרוּ
  choice: inayotoweka
  rationale: Maana ya msingi ni kupita au kupita zake; hapa muktadha wa vijito vya msimu unaonyesha maji yanayopita na kutoweka. Tafsiri hii inabeba wazo la kutodumu bila kulifafanua kupita kiasi.
