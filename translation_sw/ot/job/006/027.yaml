lexical_decisions:
- source_word: אַף
  choice: Hata
  rationale: 'Hapa neno hili linakazia uzito wa shtaka na kuonyesha hatua ya kushtua: wangethubutu kufanya hivyo hata kwa yatima.'
- source_word: יָתוֹם
  choice: yatima
  rationale: Neno hili humaanisha mtu aliyefiwa na mzazi, hasa baba; “yatima” ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: תַּפִּילוּ
  choice: mngewapigia kura
  rationale: Hifili ya נפל pamoja na עַל inaeleweka hapa kama kufanya kura imwangukie mtu, yaani kumpigia kura kwa nia ya kumchukulia au kumgawia kama mali.
- source_word: תִכְרוּ
  choice: kumnadi
  rationale: Kitenzi hiki ni kigumu katika muktadha huu. “Kumnadi” kinaonyesha kumfanya rafiki kuwa kitu cha biashara au faida, na kinaendana na mstari sambamba kuhusu kumtumia vibaya yatima.
- source_word: רֵיעֲכֶם
  choice: rafiki yenu
  rationale: “Rafiki” linafaa kwa kuwa Ayubu anawakemea wenzake waliopaswa kuwa marafiki zake, hivyo likisisitiza usaliti wao.
- source_word: עַל ... עַל
  choice: kwa ... [kama kitu kinachonadiwa]
  rationale: Kiswahili hakiwezi kurudia kihusishi kilekile kwa unaturali bila kuficha maana. Muundo uliochaguliwa unahifadhi wazo la watu kutendewa kama vitu vya kugawiwa au kuuzwa.
