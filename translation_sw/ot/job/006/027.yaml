  text: Hata mngepiga kura juu ya yatima[a], na mngemnadi rafiki yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hata mngeifanya kura iangukie yatima.” Kiebrania husema kihalisi, “kufanya ianguke juu ya yatima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na mngemchimbia rafiki yenu shimo.” Kitenzi cha Kiebrania hapa ni kigumu; wengi hukielewa kuwa kufanya biashara juu ya rafiki au kumtumia vibaya kwa faida.
