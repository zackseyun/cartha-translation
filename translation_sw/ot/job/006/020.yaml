  naturalness: «Waliaibika ... walifika huko, wakafedheheka» ni Kiswahili sanifu, cha kisasa, na kinaweka tofauti inayokusudiwa kati ya aibu ya kwanza na fedheha/aibu kuu ya pili. Tanbihi b pia imerekebishwa kutoka usemi usio wa kawaida «kwa neno moja moja» hadi «Kwa tafsiri ya neno kwa neno».
