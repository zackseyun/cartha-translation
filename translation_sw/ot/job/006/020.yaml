translation:
  language: sw
  text: Waliaibika kwa sababu walikitegemea; walifika huko[b], wakafedheheka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaona haya” au “wakaaibishwa.” Kiebrania kimetumia vitenzi viwili vinavyohusiana na aibu na fedheha.
    reason: lexical_alternative
  - marker: b
    text: Yaani, walifika kwenye kile kijito cha msimu kilichotajwa katika mistari iliyotangulia; kwa tafsiri ya neno kwa neno, “walikifikia.”
    reason: cross_reference
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: wameaibika
  rationale: Kitenzi בוש kinaonyesha hali au matokeo ya kuaibika. Kauli hii huhifadhi maana ya aibu bila kuifanya tu kuwa kuvunjika moyo.
- source_word: כִּי
  choice: kwa sababu
  rationale: 'כִּי hapa inaeleweka vizuri zaidi kuwa kiunganishi cha sababu: tumaini lao ndilo lililosababisha kuaibika kwao.'
- source_word: בָטָח
  choice: waliitumainia
  rationale: Ingawa umbo la Kiebrania ni nafsi ya tatu umoja wa kiume, muktadha una kundi la wasafiri linalotajwa kwa vitenzi vya wingi. Kiswahili kimetumia wingi na kiambishi cha yambwa -i- kinachorejelea kijito cha msimu.
- source_word: בָּאוּ
  choice: walifika
  rationale: Katika muktadha wa wasafiri wanaoenda mahali walikotarajia kupata maji, 'walifika' huonyesha kwa kawaida kukamilika kwa safari kwenda huko.
- source_word: עָדֶיהָ
  choice: huko
  rationale: Kiambishi cha kike katika Kiebrania kinarejelea kijito cha msimu katika muktadha uliotangulia. 'Huko' ni ya asili katika Kiswahili huku tanbihi ikibainisha rejeo hilo.
- source_word: וַיֶּחְפָּרוּ
  choice: wakafedheheka
  rationale: חפר hapa ina maana ya kufadhaishwa kwa aibu, kufedheheka, au kuaibishwa. 'Wakafedheheka' huhifadhi uhusiano wake na kitenzi cha kwanza cha aibu na pia tofauti yake, badala ya kuipunguza kuwa kuvunjika moyo pekee.
