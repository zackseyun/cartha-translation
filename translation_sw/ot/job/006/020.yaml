translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. 'Kijito cha msimu' kimewekwa katika tanbihi ili kufafanua rejeo bila kukiongeza ndani ya mstari. Alama zote za tanbihi zinaonekana katika matini kuu.
