translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi lakini unaoeleweka kwa urahisi. ‘Mapito ya mwendo wake’ inadumisha taswira ngumu ya Kiebrania; tanbihi inaweka wazi uwezekano wa kuielewa אָרְחוֹת kuwa misafara.
