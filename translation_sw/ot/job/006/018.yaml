translation:
  language: sw
  text: Mapito ya njia zao hupinda[a]; hupanda hadi kwenye ukiwa na kupotea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Njia za misafara hugeuka kando; misafara hiyo hupanda kwenda kwenye nyika na kutoweka.” Taswira ya Kiebrania ni ngumu, na wengine huelewa mstari huu kuwa unazungumzia misafara badala ya mapito au mikondo yenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: hupinda na kwenda kando
  rationale: Kitenzi hiki katika Nifali kinaweza kueleza kupinda, kujipinda, au kugeuka kando. Kauli hii inadumisha taswira ya mapito au mikondo inayokengeuka bila kuamua kwa uhakika kuwa kinachozungumziwa ni misafara.
- source_word: אָרְחוֹת
  choice: mapito
  rationale: Neno hili kwa kawaida humaanisha mapito au njia. Tafsiri ya kimetonimia kuwa ‘misafara’ inawezekana, lakini maana halisi ya mapito imewekwa katika andiko kuu.
- source_word: דַּרְכָּם
  choice: mwendo wake
  rationale: דֶּרֶךְ humaanisha njia au mwendo. ‘Mwendo wake’ huepuka urudiaji usio wa kawaida wa ‘mapito ya njia’ na inafaa kwa taswira ya njia ya mkondo, huku umoja wa kisarufi katika Kiswahili ukirejelea kwa kawaida wingi wa mapito kama kundi.
- source_word: יַעֲלוּ
  choice: hupanda kuelekea
  rationale: Tafsiri hii inadumisha maana halisi ya kupanda au kwenda juu na kuonyesha mwelekeo wa mwendo bila kuibadili kimafumbo kuwa ‘kutoweka.’
- source_word: בַתֹּהוּ
  choice: eneo la ukiwa
  rationale: תֹהוּ huonyesha ukiwa, utupu, au eneo lisilo na kitu. ‘Eneo la ukiwa’ ni Kiswahili cha kawaida na hakibani maana kuwa jangwa pekee.
- source_word: וְיֹאבֵדוּ
  choice: na kupotea
  rationale: אבד inaweza kumaanisha kuangamia, kupotea, au kutoweka. ‘Kupotea’ inafaa kwa mapito au maji yanayotoweka katika eneo la ukiwa na inadumisha upana wa maana ya Kiebrania.
