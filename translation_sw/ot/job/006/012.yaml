  text: אִם כֹּ֣חַ אֲבָנִ֣ים כֹּחִ֑/י אִֽם בְּשָׂרִ֥/י נָחֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/012.yaml
  text: Is my strength the strength of stones[a], or is my flesh bronze?
translation:
  language: sw
  text: Je, nguvu zangu ni nguvu za mawe, au mwili wangu ni shaba[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “nyama yangu ni shaba?” Neno la Kiebrania linalotafsiriwa “mwili” ni “nyama,” na linasisitiza udhaifu wa kibinadamu ukilinganishwa na ugumu wa metali.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Je, ... ni
  rationale: Hapa אִם inaanzisha swali la balagha, si sentensi ya sharti; muundo wa “Je” unaonyesha hilo kwa Kiswahili cha kawaida.
- source_word: כֹּחַ ... כֹּחִי
  choice: nguvu ... nguvu zangu
  rationale: Kurudia “nguvu” kunafuata urudiaji wa Kiebrania na kuhifadhi ulinganifu wa kishairi.
- source_word: אֲבָנִים
  choice: mawe
  rationale: Hili ndilo neno halisi na la kawaida, nalo linadumisha picha thabiti ya ugumu.
- source_word: בְּשָׂרִי
  choice: mwili wangu
  rationale: Ingawa maana ya moja kwa moja ni “nyama yangu,” katika Kiswahili “mwili wangu” huwasilisha kwa kawaida hali ya kimwili ya Ayubu bila kuleta maana isiyokusudiwa ya nyama ya kuliwa.
- source_word: נָחוּשׁ
  choice: shaba
  rationale: Neno hilo linaweza kurejelea shaba au aloi yake; “shaba” ni neno la Kiswahili linaloeleweka kwa urahisi na linahifadhi picha ya metali ngumu.
