  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: sw
  text: Je, mnadhani kuyakosoa maneno, wakati maneno ya mtu aliyekata tamaa ni ya upepo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mnakusudia kusahihisha maneno tu, na kuyachukulia maneno ya mtu aliyekata tamaa kuwa upepo?” Mpangilio wa maneno wa Kiebrania unaruhusu kishazi cha pili kueleweka ama kama taarifa (“maneno ... ni ya upepo”) ama kama sehemu ya kile wanachokusudia kukosoa (“kuyachukulia ... kuwa upepo”).
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: kuyakemea
  rationale: Kitenzi יכח hapa kina maana ya kukosoa au kusahihisha kwa kumtia mtu hatiani. “Kuyakemea” kinahifadhi uzito wa upinzani huo bila kuongeza wazo lisilomo katika maandishi.
- source_word: מִלִּים
  choice: maneno
  rationale: Tafsiri ya moja kwa moja inayohifadhi ufupi wa kauli na ulinganifu wake na אִמְרֵי katika kishazi kinachofuata.
- source_word: תַּחְשֹׁבוּ
  choice: mnadhani
  rationale: חשב linaweza kumaanisha kufikiri, kuhesabu, au kukusudia. Katika swali hili la changamoto, “mnadhani” ni la kawaida na linadumisha uwezekano wa maana ya nia.
- source_word: וּ/לְ/רוּחַ
  choice: ni ya upepo
  rationale: “Upepo” linahifadhi taswira halisi ya רוּחַ na kudokeza jambo linalopita au lisilo na uzito. Muundo huu pia unahifadhi usomaji wa kishazi cha pili kama taarifa.
- source_word: אִמְרֵי
  choice: maneno
  rationale: Neno hili la wingi katika hali ya muundo linatafsiriwa kwa “maneno,” likidumisha ulinganifu na מִלִּים.
- source_word: נֹאָשׁ
  choice: mtu aliyekata tamaa
  rationale: Umbo la participio la Niphal linaeleza mtu aliyepoteza tumaini. Usemi huu ni wa kawaida, wazi, na unahifadhi nguvu ya mtu mmoja anayeteseka.
