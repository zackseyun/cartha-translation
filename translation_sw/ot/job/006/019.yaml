  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
translation:
  language: sw
  text: Misafara[a] ya Tema ilitazama; wasafiri wa Sheba walivitarajia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Misafara’ limetafsiri neno la Kiebrania linaloweza kumaanisha kihalisi ‘njia’; hapa linaonyesha makundi ya wasafiri waliotumia njia hizo.
    reason: lexical_alternative
  - marker: b
    text: Au ‘walivingojea kwa matumaini.’ Kiambishi ‘-vi-’ huenda kinarejelea vijito vya msimu vilivyoelezwa katika mistari iliyotangulia.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: ilitazama
  rationale: Kitenzi נבט humaanisha kutazama au kuelekeza macho. Katika muktadha huu misafara inatafuta vijito vya msimu; ‘ilitazama’ ni ya asili na haiongezi mkazo usiotajwa wazi.
- source_word: אָרְחוֹת
  choice: misafara
  rationale: Ingawa neno hili linaweza kumaanisha ‘njia,’ hapa limetumiwa kimajazi kwa makundi yanayosafiri katika njia hizo, sambamba na wasafiri wa Sheba.
- source_word: תֵּמָא
  choice: Tema
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: הֲלִיכֹת
  choice: wasafiri
  rationale: Neno linahusiana kihalisi na kwenda au safari, lakini hapa linawarejelea wanaosafiri; ‘wasafiri’ ni wazi na hudumisha usambamba wa kishairi.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika Kiswahili cha Biblia.
- source_word: קִוּוּ
  choice: waliwatarajia
  rationale: Kitenzi קוה kinaweza kumaanisha kutumaini au kungoja kwa matarajio. ‘Waliwatarajia’ huhifadhi matarajio ya kupata maji bila kuamua kwa nguvu kati ya kutumaini na kungoja.
- source_word: לָמוֹ
  choice: -wa- (waliwatarajia)
  rationale: Kiwakilishi hiki huenda kinarejelea vijito vya msimu vilivyotajwa katika mistari iliyotangulia. Kimehifadhiwa kama kiambishi cha yambwa cha ngeli ya wingi.
