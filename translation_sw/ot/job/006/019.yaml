translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa mistari miwili na usambamba wa misafara ya Tema na wasafiri wa Sheba umehifadhiwa; viwakilishi vya umoja kwa ‘misafara’ na wingi kwa ‘wasafiri’ vinafuata upatanisho wa kawaida wa Kiswahili.
