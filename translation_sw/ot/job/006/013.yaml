lexical_decisions:
- source_word: הַאִם אֵין
  choice: Je, sina
  rationale: 'Muundo huu unaendeleza swali la balagha lenye ukanushaji: ‘Je, hakuna...?’ Katika Kiswahili, ‘Je, sina...?’ ni wa kawaida na unaacha nguvu ya swali wazi bila kuongeza mkazo.'
- source_word: עֶזְרָתִי
  choice: msaada
  rationale: Neno עֶזְרָה humaanisha msaada au usaidizi. ‘Msaada’ ni tafsiri ya moja kwa moja na inafaa katika malalamiko ya Ayubu kuhusu kukosa uwezo wa ndani wa kujisaidia.
- source_word: בִי
  choice: ndani yangu
  rationale: Kihusishi ב pamoja na kiambishi cha nafsi kinaweza kumaanisha ‘ndani yangu’ au ‘kwangu.’ ‘Ndani yangu’ kinaonyesha wazi kuwa Ayubu anazungumzia rasilimali au uwezo wa ndani.
- source_word: וְתֻשִׁיָּה
  choice: na hekima yenye kufaa
  rationale: תּוּשִׁיָּה katika fasihi ya hekima linaweza kumaanisha hekima thabiti ya vitendo, uwezo, au shauri lenye matokeo. ‘Hekima yenye kufaa’ huhifadhi uhusiano wake na hekima huku ikidokeza ufanisi wa vitendo.
- source_word: נִדְּחָה
  choice: imefukuzwa mbali
  rationale: Nifali ya נדח ina maana ya kufukuzwa, kutengwa, au kuondoshwa. ‘Imefukuzwa mbali’ inahifadhi hali tendwa na picha ya kitu kilichoondolewa kwa nguvu.
- source_word: מִמֶּנִּי
  choice: nami
  rationale: Katika muundo ‘imefukuzwa mbali nami,’ ‘nami’ huwasilisha maana ya מן yenye kiambishi cha nafsi, yaani kuondolewa kutoka kwa msemaji, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Nguvu ya swali la balagha katika הַאִם אֵין
  choice: Je, sina msaada ndani yangu...?
  alternative: Je, si kweli kwamba sina msaada ndani yangu...?
  rationale: Chaguo kuu halilazimishi jibu kwa kuongeza ‘si kweli kwamba’; hivyo linahifadhi uwezekano na mvutano wa swali la Kiebrania katika muktadha wa kukata tamaa kwa Ayubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi muundo wa swali la balagha na usambamba wa kishairi bila kutatua kimya kimya utata wa maana ya תּוּשִׁיָּה.
