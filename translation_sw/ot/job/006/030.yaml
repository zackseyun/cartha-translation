  text: Je, kuna udhalimu katika ulimi wangu? Je, kaakaa langu halipambanui mambo ya kuangamiza?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafa,” “mambo potovu,” au “mambo yenye kuleta uharibifu.” Neno la Kiebrania linaweza kurejelea maafa au mambo ya kuangamiza, na pia linaweza kumaanisha mambo yaliyopotoka kimaadili.
