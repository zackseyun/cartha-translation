lexical_decisions:
- source_word: הֲיֵשׁ
  choice: Je, kuna
  rationale: Huanzisha swali la balagha la ndiyo au hapana kwa Kiswahili cha kawaida na kifupi.
- source_word: בִּלְשׁוֹנִי
  choice: katika ulimi wangu
  rationale: Hudumisha taswira halisi ya ulimi kama kiungo cha kusema, badala ya kuifafanua moja kwa moja kuwa maneno au midomo.
- source_word: עַוְלָה
  choice: udhalimu
  rationale: Hueleza uovu au upotovu wa kimaadili wenye kuvunja haki, kwa lugha yenye uzito unaofaa muktadha.
- source_word: אִם
  choice: Je
  rationale: Katika ulinganifu huu neno linaanzisha swali la pili la balagha; 'Je' huwasilisha kazi hiyo kwa Kiswahili cha asili.
- source_word: חִכִּי
  choice: kaakaa langu
  rationale: חֵךְ ni kaakaa la kinywa; tafsiri hii huhifadhi taswira ya kuonja na kutofautisha.
- source_word: לֹא יָבִין
  choice: halitambui
  rationale: בין hapa ni kuelewa au kupambanua; 'kutambua' huonyesha uwezo wa kaakaa kutofautisha kinachoonjwa kwa maana ya sitiari.
- source_word: הַוּוֹת
  choice: maovu yenye kuleta maangamizi
  rationale: Wingi huu unaweza kumaanisha maafa au mambo maovu na potovu yenye kuangamiza. Kauli hii hudumisha kwa kiasi fulani vipengele vyote viwili bila kuficha utata wa Kiebrania.
