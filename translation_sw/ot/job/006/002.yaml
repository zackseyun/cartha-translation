  rationale: Huanzisha tamanio lenye maombolezo kwa njia ya kawaida na yenye nguvu katika Kiswahili.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: ungepimwa kwa ukamilifu
  rationale: Muundo wa kitenzi pamoja na jina la kitenzi la mzizi huohuo unasisitiza tendo la kupima; ‘kwa ukamilifu’ huwasilisha msisitizo huo bila kurudia kitenzi kwa namna isiyo ya kawaida katika Kiswahili.
- source_word: כַּעְשִׂי
  choice: uchungu wangu
  rationale: Neno linaweza kueleza maumivu ya ndani, masikitiko, kukerwa, au ghadhabu. ‘Uchungu’ linafaa katika maombolezo ya Ayubu huku likibaki pana kuliko ‘huzuni’ au ‘ghadhabu’ pekee.
- source_word: וְהַוָּתִי
  choice: msiba wangu
  rationale: Hurejelea janga, maangamizi, au hali mbaya iliyompata mtu. ‘Msiba’ ni neno la kawaida na lenye hadhi linaloeleza upande halisi wa mateso ya Ayubu.
- source_word: בְּמֹאזְנַיִם
  choice: kwenye mizani
  rationale: Hurejelea kifaa cha kupimia uzito. ‘Kwenye mizani’ ni usemi wa asili katika Kiswahili cha sasa.
- source_word: יִשְׂאוּ
  choice: ukawekwa
  rationale: Kitenzi kimsingi ni ‘kuinua/kubeba’; katika muktadha wa kupima, maana inayokusudiwa kwa kawaida ni kuweka kitu kwenye mizani. Tanbihi inadumisha taswira halisi ya kuinuliwa.
- source_word: יָחַד
  choice: pamoja nao
  rationale: Huonyesha kwamba uchungu na msiba wa Ayubu vipimwe kwa pamoja. Kiwakilishi kinarejelea uchungu uliotajwa katika mstari wa kwanza.
