  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: sw
  text: Je, chakula kisicho na ladha kinaweza kuliwa bila chumvi? Au je, ute wa mmea wa halamuthi una ladha yoyote?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya maneno ya Kiebrania katika sehemu ya pili haijulikani kwa uhakika. “Ute wa mmea wa halamuthi” unaweza pia kueleweka kuwa “maji ya mmea wa halamuthi”; kimapokeo, wengine wametafsiri kirai hiki kuwa “ute mweupe wa yai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: Je, ... kinaweza kuliwa
  rationale: Kiulizi הֲ pamoja na kitenzi cha Niphal cha אכל huanzisha swali la balagha; muundo huu ni wa kawaida katika Kiswahili na huhifadhi nguvu ya swali.
- source_word: תָּפֵל
  choice: chakula kisicho na ladha
  rationale: Neno hili humaanisha kitu kisicho na ladha au kisichokolezwa. Kutaja “chakula” huweka wazi nomino inayodokezwa na muktadha.
- source_word: מִ/בְּלִי מֶלַח
  choice: bila chumvi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai kinachoonyesha kutokuwapo kwa chumvi.
- source_word: אִם יֶשׁ
  choice: Au je, ... una ... yoyote
  rationale: אִם hapa huanzisha swali la pili la balagha linalolingana na la kwanza; muundo huu huonyesha ulinganifu huo kwa Kiswahili cha asili.
- source_word: טַעַם
  choice: ladha
  rationale: “Ladha” ni kisawe cha moja kwa moja na pia hudumisha uhusiano wa kimsamiati na “kisicho na ladha” katika sehemu ya kwanza.
- source_word: בְּ/רִיר
  choice: ute wa
  rationale: Neno hili gumu huenda linamaanisha kimiminika chenye kunata, ute, au maji ya mmea. “Ute” ni neno la kawaida linalohifadhi taswira hiyo bila kulifanya liwe maalumu kupita ushahidi.
- source_word: חַלָּמוּת
  choice: mmea wa halamuthi
  rationale: Jina la mmea halijulikani kwa uhakika. Uhawilishaji “halamuthi” huepuka kutambulisha mmea huo kwa uhakika usiokuwapo katika Kiebrania, huku tanbihi ikieleza mapendekezo mengine.
