base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: sw
  text: Hiyo bado ingekuwa faraja yangu[a], nami ningeshangilia katika maumivu yasiyokoma; kwa maana sikuyakana maneno ya Aliye Mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “nami ningeshangilia katika maumivu asiyoyahurumia.” Kirai hiki cha Kiebrania ni kigumu na kifupi sana.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: faraja yangu
  rationale: Neno hili lina maana ya faraja au kitulizo. “Faraja yangu” ni Kiswahili cha kawaida na huhifadhi wazo la jambo ambalo bado lingempa Ayubu moyo.
- source_word: וַאֲסַלְּדָה
  choice: nami ningefurahi sana
  rationale: Kitenzi hiki ni nadra na maana yake si hakika kabisa, lakini hapa kinaonyesha furaha yenye nguvu. “Ningefurahi sana” ni ya asili na inaeleweka bila kulazimisha taswira isiyo na uhakika.
- source_word: בְחִילָה לֹא יַחְמוֹל
  choice: katika maumivu yasiyopungua
  rationale: Kirai cha Kiebrania ni kifupi na kigumu kisarufi. Tafsiri hii inaonyesha maumivu makali yanayoendelea bila nafuu, huku namna rasmi zaidi ikihifadhiwa katika tanbihi.
- source_word: כִחַדְתִּי
  choice: sikuyakana
  rationale: Katika hali hii kitenzi kinaweza kumaanisha kukana, kuficha, au kuzuia. Kwa kuwa kinahusishwa na maneno ya Mungu, “sikuyakana” huwasilisha kwa kawaida madai ya Ayubu kwamba hakuyapinga wala kuyakataa.
- source_word: אִמְרֵי
  choice: maneno ya
  rationale: Hii ni namna pana na ya kawaida ya kutafsiri usemi unaorejelea maneno au semi zilizotamkwa.
- source_word: קָדוֹשׁ
  choice: Aliye Mtakatifu
  rationale: Kivumishi hiki kimetumiwa kama cheo kinachomrejelea Mungu. “Aliye Mtakatifu” ni cheo cha heshima, cha kawaida, na kisichoingiza ufafanuzi wa ziada.
theological_decisions:
- issue: Cheo cha Mungu קָדוֹשׁ
  choice: Aliye Mtakatifu
  alternative: mtakatifu
  rationale: Muktadha unaonyesha kwamba neno hili linamrejelea Mungu, si mtu yeyote mtakatifu. Tafsiri ya cheo huhifadhi uzito wake wa kitheolojia bila kuongeza fundisho la dhehebu.
- issue: Tafsiri ya kirai kigumu בְחִילָה לֹא יַחְמֹל
  choice: katika maumivu yasiyopungua
  alternative: katika maumivu ambayo yeye hayapunguzi
  rationale: Kiebrania ni kifupi na kina utata wa kisarufi. Chaguo kuu ni la kawaida katika Kiswahili na huhifadhi wazo la maumivu yanayoendelea; tanbihi inaonyesha tafsiri rasmi zaidi na uwezekano wa mhusika wa kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika, na nukta mkato imetumiwa kuonyesha uhusiano wa sababu bila kuufanya kuwa sentensi tofauti.
