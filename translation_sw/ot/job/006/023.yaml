  text: au, ‘Niokoeni kutoka mkononi mwa adui, na nikomboeni kutoka mkononi mwa watu wakatili’?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: Niokoeni
  rationale: Hifili ya amri, nafsi ya pili wingi, yenye kiambishi cha nafsi ya kwanza umoja, inaomba wasikilizaji wamsababishie msemaji kuponyoka. ‘Niokoeni’ ni Kiswahili cha kawaida na hudumisha maana ya kumtoa mtu hatarini.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Nahau ya Kiebrania inaonyesha kuokolewa kutoka katika uwezo au udhibiti wa mtu. Taswira ya ‘mkono’ inaeleweka kwa Kiswahili na imehifadhiwa.
- source_word: צָר
  choice: adui
  rationale: Neno humaanisha mtu mwenye uhasama, mpinzani au adui. ‘Adui’ ni la kawaida, hudumisha umoja, na halibainishi kupita kiasi aina ya uhasama.
- source_word: עָרִיצִים
  choice: watu wakatili
  rationale: Nomino ya wingi humaanisha watu wakatili, wenye jeuri au wenye kuonea. ‘Watu wakatili’ ni ya asili katika Kiswahili na huhifadhi nguvu ya kimaadili bila kuifanya maana kuwa ya kisiasa tu.
- source_word: תִּפְדּוּנִי
  choice: Nikomboeni
  rationale: Qal isiyotimilifu, nafsi ya pili wingi, yenye kiambishi cha nafsi ya kwanza umoja, kutoka פדה, ina maana ya kukomboa au kuachilia, wakati mwingine kwa fidia. ‘Nikomboeni’ huhifadhi tofauti yake na מלט bila kulazimisha kwamba fidia imelipwa hapa.
theological_decisions:
- issue: Tafsiri ya פדה katika muktadha usio wa ibada wala wa wokovu wa kiroho
  choice: Nikomboeni
  alternative: Nifidieni; Niokoeni
  rationale: ‘Nikomboeni’ huhifadhi wazo pana la kuachiliwa kutoka hatarini au utumwani na tofauti ya kileksia na ‘Niokoeni.’ Haitafsiri tendo hili moja kwa moja kuwa fundisho maalumu la ukombozi wa kiroho wala haisemi wazi kwamba bei ya fidia imelipwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa balagha unaendelea kutoka mstari uliotangulia kwa ‘au’; amri za wingi zinaonyesha kwamba Ayubu anawaambia rafiki zake. Usambamba wa vishazi na taswira ya ‘mkono’ umehifadhiwa.
