  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: sw
  text: Nina nguvu gani hata niendelee kutumaini? Na mwisho wangu ni nini hata niurefushe uhai wangu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niendelee kuvumilia.” Kiebrania husema kihalisi, “niirefushe nafsi yangu,” nahau inayoweza kumaanisha kuendeleza uhai au kuendelea kuvumilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: Nina nguvu gani
  rationale: Swali la balagha linaonyesha kuwa Ayubu haoni ndani yake nguvu au uwezo wa kuendelea; usemi huu ni wa kawaida na huhifadhi maana ya כֹּחַ.
- source_word: כִּי אֲיַחֵל
  choice: hata niendelee kutumaini
  rationale: Kitenzi יחל katika muktadha huu kinaweza kumaanisha kutumaini au kusubiri. 'Niendelee kutumaini' huonyesha hali inayoendelea bila kufuta uwezekano wa maana ya kusubiri.
- source_word: וּמַה קִצִּי
  choice: Na mwisho wangu ni nini
  rationale: Huhifadhi usambamba wa swali la pili na maana pana ya קֵץ kama mwisho au kikomo.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: hata niendelee kuvumilia
  rationale: Kwa maana halisi usemi huu ni 'niurefushe uhai/nafsi yangu'; katika muktadha unauliza sababu ya kuendelea kustahimili. Tafsiri hii ni ya kawaida kwa Kiswahili huku tanbihi ikihifadhi taswira na maana nyingine inayowezekana.
theological_decisions:
- issue: Je, Ayubu anauliza kuhusu kurefusha maisha yake au kuendelea kuwa na subira?
  choice: niendelee kuvumilia
  alternative: niurefushe uhai wangu
  rationale: Nahau ya Kiebrania inaweza kuelekeza kwenye kuendeleza maisha au kustahimili kwa muda mrefu. Matini kuu hutumia Kiswahili cha kawaida kinachoafikiana na malalamiko ya Ayubu, huku tanbihi ikihifadhi utata wa nahau hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Maswali mawili ya balagha na usambamba wa kishairi vimehifadhiwa.
