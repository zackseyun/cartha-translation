  text: הֲ/יִֽנְהַק פֶּ֥רֶא עֲלֵי דֶ֑שֶׁא אִ֥ם יִגְעֶה שּׁ֝֗וֹר עַל בְּלִילֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/005.yaml
  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: sw
  text: Je, punda-mwitu[a] hulia akiwa na majani, au ng’ombe hulia akiwa na chakula chake kilichochanganywa[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, punda wa porini; Kiebrania hutaja hasa aina ya punda asiye wa kufugwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutaja chakula cha mifugo kilichochanganywa, au mash.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽנְהַק
  choice: Je, ... hulia
  rationale: Kitenzi נהק hutaja mlio wa punda. Kiswahili cha kawaida hakina kitenzi kimoja kinachotumiwa kwa upana na kinacholingana kabisa na ‘bray’; ‘hulia’ ni cha asili na kinaeleweka katika muktadha wa mnyama.
- source_word: פֶּרֶא
  choice: punda-mwitu
  rationale: פֶּרֶא ni punda wa porini (onager), si punda aliyefugwa. ‘Punda-mwitu’ ni wazi, fupi, na ya Kiswahili sanifu.
- source_word: עֲלֵי דֶשֶׁא
  choice: akiwa na majani
  rationale: Ingawa עֲלֵי inaweza kumaanisha ‘juu ya,’ hapa inaonyesha hali ya mnyama kuwa na malisho mbele yake. ‘Akiwa na majani’ huwasilisha maana ya swali la balagha kwa Kiswahili cha kawaida bila kudai kwamba punda amesimama juu ya majani.
- source_word: אִם
  choice: au
  rationale: Katika jozi hii ya maswali ya balagha, אִם inaleta sehemu ya pili kwa maana ya ‘au.’
- source_word: יִגְעֶה
  choice: hulia
  rationale: Kitenzi געה hutaja mlio wa ng’ombe. ‘Hulia’ ni usemi wa kawaida wa Kiswahili kwa sauti ya mnyama na hudumisha ulinganifu na sehemu ya kwanza.
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: שׁוֹר humaanisha mnyama wa jamii ya ng’ombe, mara nyingi fahali au maksai. ‘Ng’ombe’ huhifadhi upana wa neno bila kubainisha jinsia au matumizi ambayo muktadha hauyalazimishi.
- source_word: עַל בְּלִילֽ/וֹ
  choice: akiwa na chakula chake kilichochanganywa
  rationale: בְּלִיל ni chakula cha mifugo kilichochanganywa, au mash. Tafsiri hii ni ya kawaida na inaonyesha kiambishi cha umilikaji ‘-וֹ’ (‘chake’).
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo wa maswali mawili ya balagha na ulinganifu wa punda na ng’ombe umehifadhiwa. ‘Hulia’ limetumiwa kwa wanyama wote wawili kwa kuwa ndilo neno la kawaida na linaloeleweka, ingawa vitenzi vya Kiebrania hutaja milio yao tofauti.
