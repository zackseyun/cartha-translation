base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: sw
  text: Anayekata tamaa anapaswa kuonyeshwa fadhili na rafiki yake[b][a], hata kama ameacha kumcha Mwenye Nguvu Zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Rafiki anayemnyima mtu anayekata tamaa fadhili anaacha kumcha Mwenye Nguvu Zote.” Muundo wa Kiebrania umebanwa na unaweza kueleweka kwa njia hii.
    reason: alternative_reading
  - marker: b
    text: Neno “fadhili” linatafsiri חֶסֶד, ambalo pia linaweza kumaanisha upendo thabiti, rehema, au uaminifu katika uhusiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  choice: anayekata tamaa
  rationale: Neno hili linatokana na mzizi wenye maana ya kuyeyuka au kudhoofika, na hapa linaonyesha mtu anayevunjika moyo kwa sababu ya mateso. ‘Anayekata tamaa’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo ya kitamathali.
- source_word: מֵרֵעֵהוּ
  choice: na rafiki yake
  rationale: Kihusishi מִן kinaonyesha chanzo cha fadhili, yaani rafiki wa mwenye kuteseka. Katika muundo wa Kiswahili, ‘kuonyeshwa ... na rafiki yake’ huwasilisha chanzo hicho kwa kawaida huku ikihifadhi kiambishi cha nafsi ya tatu umoja.
- source_word: חָסֶד
  choice: fadhili
  rationale: Katika uhusiano wa wanadamu hapa, חֶסֶד ina maana ya wema wenye uaminifu, huruma, au upendo thabiti. ‘Fadhili’ ni neno la asili na lenye heshima katika Kiswahili; upana zaidi wa maana umeonyeshwa katika tanbihi.
- source_word: וְיִרְאַת שַׁדַּי
  choice: kumcha Mwenye Nguvu Zote
  rationale: יִרְאָה kwa Mungu huhusisha hofu yenye heshima na uchaji. ‘Kumcha’ huhifadhi nahau ya kibiblia na uzito wake wa kiteolojia.
- source_word: יַעֲזֹב
  choice: ameacha
  rationale: Kitenzi עזב humaanisha kuacha au kutelekeza. ‘Ameacha’ ni cha kawaida na kinafaa baada ya ‘hata kama,’ bila kuongeza maana isiyokuwapo katika Kiebrania.
- source_word: שַׁדַּי
  choice: Mwenye Nguvu Zote
  rationale: Hii ni tafsiri ya kawaida ya cheo cha Mungu שַׁדַּי, ikionyesha uwezo wake mkuu bila kukitaja kama jina lililotoholewa.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa kishazi cha mwisho
  choice: Mtu anayekata tamaa anastahili fadhili za rafiki yake, hata kama yeye mwenye kuteseka ameacha kumcha Mwenye Nguvu Zote.
  alternative: Rafiki anayemnyima fadhili mtu anayekata tamaa anaacha kumcha Mwenye Nguvu Zote.
  rationale: Kiebrania kimebanwa na kinaweza kueleweka kwa njia zote mbili. Maandishi makuu yanafuata usomaji unaomweka mwenye kuteseka kuwa mtendaji wa יַעֲזֹב, huku usomaji mwingine muhimu ukihifadhiwa katika tanbihi ili kutatua kimya kimya utata wa asili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘anapaswa kuonyeshwa’ unaeleza wajibu unaodokezwa na kishazi nomino cha Kiebrania bila kufanya sentensi kuwa ngumu; alama za tanbihi zote zimewekwa katika maandishi makuu.
