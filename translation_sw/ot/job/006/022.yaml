  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: sw
  text: Je, niliwahi kusema[a], ‘Nipeni,’ au, ‘Kwa mali yenu, mtoe hongo kwa ajili yangu[b]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, nilisema.” Swali hili la balagha linaonyesha kwamba Ayubu anakana kuwa aliwaomba rafiki zake wampe chochote.
    reason: discourse_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinahusiana na nomino inayomaanisha “hongo” au “zawadi.” Hapa kinaweza kueleweka kwa upana zaidi kuwa kutoa malipo au kitu cha kumshawishi mtu kwa niaba ya Ayubu. Neno lililotafsiriwa “mali” kwa maana yake ya msingi humaanisha “nguvu” au “uwezo,” lakini hapa yaelekea linarejelea raslimali au uwezo wa kifedha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: Je, niliwahi kusema
  rationale: הֲכִי huanzisha swali la balagha lenye msisitizo. ‘Je, niliwahi kusema’ huonyesha kwa Kiswahili cha kawaida kwamba Ayubu anakana kuwa aliwahi kuwaomba rafiki zake jambo hilo, huku ‘kusema’ ikibaki karibu na אָמַרְתִּי.
- source_word: הָבוּ לִי
  choice: Nipeni
  rationale: Ni amri ya wingi pamoja na kiwakilishi cha mtendewa. ‘Nipeni’ ni ya asili na wazi katika Kiswahili.
- source_word: וּמִכֹּחֲכֶם
  choice: Tumia mali yenu
  rationale: כֹּחַ maana yake ya msingi ni ‘nguvu’ au ‘uwezo,’ lakini katika muktadha wa kutoa malipo inaelekea kumaanisha raslimali au mali ya mtu. ‘Mali yenu’ huwasilisha maana hiyo ya kiuchumi kwa lugha ya kawaida; kitenzi ‘tumia’ huonyesha wazo la kutoa kutoka katika mali hizo.
- source_word: שִׁחֲדוּ
  choice: kunilipia hongo
  rationale: Kitenzi hiki kinahusiana na nomino שֹׁחַד, ‘hongo’ au zawadi ya ushawishi. ‘Kunilipia hongo’ huhifadhi maana yake ya malipo ya kumshawishi mtu bila kuipunguza kuwa zawadi ya kawaida.
- source_word: בַעֲדִי
  choice: kunilipia
  rationale: בַעֲדִי humaanisha ‘kwa ajili yangu’ au ‘kwa niaba yangu.’ Katika Kiswahili, kiambishi ‘-ni-’ ndani ya ‘kunilipia’ huonyesha kwa ufupi na kwa kawaida kwamba malipo hayo yangetolewa kwa niaba ya Ayubu.
