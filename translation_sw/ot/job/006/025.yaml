  text: How forceful are upright words! But what does reproof from you prove?[a]
translation:
  language: sw
  text: Maneno ya unyoofu yana nguvu iliyoje! Lakini kukemea kwenu kunathibitisha nini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maneno ya kweli yanaumiza kiasi gani! Lakini mabishano yenu yanathibitisha nini?” Kiebrania kinaweza kumaanisha “yanaumiza,” “yanashawishi,” au “yana nguvu” katika sehemu ya kwanza, na “kubishana,” “kukemea,” au “kusahihisha” katika sehemu ya pili.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: yana nguvu iliyoje
  rationale: Muundo huu unaonyesha mshangao kuhusu kiwango cha nguvu ya maneno. Kitenzi נמרץ kinaweza kudokeza nguvu, ushawishi, au hata uchungu; tafsiri hii haibani maana kuwa ushawishi wa kimantiki pekee.
- source_word: אִמְרֵי יֹשֶׁר
  choice: maneno ya unyoofu
  rationale: Huhifadhi maana ya kimaadili ya יֹשֶׁר—unyofu au uadilifu—kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: וּמַה
  choice: Lakini ... nini
  rationale: Ingawa ו inaweza kuwa 'na,' hapa muktadha unaonyesha utofautishaji kati ya nguvu ya maneno manyoofu na kutofaa kwa maonyo ya marafiki.
- source_word: יוֹכִיחַ הוֹכֵחַ
  choice: kukemea ... kunathibitisha
  rationale: Mzizi יכח una upana wa maana unaojumuisha kuthibitisha, kubishana, kusahihisha, na kukemea. Kiswahili hakiwezi kuhifadhi kwa urahisi urudiaji wa mzizi wa Kiebrania bila kuwa kisicho cha kawaida; maneno haya yanaonyesha tendo la kukemea na swali kuhusu kile linachodhihirisha.
- source_word: מִכֶּם
  choice: kwenu
  rationale: 'Kiambishi מן pamoja na kiwakilishi cha wingi kinaonyesha chanzo: kukemea kunakotoka kwa wale wanaozungumziwa.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Maneno ya unyoofu’ huhifadhi picha na uzito wa kimaadili wa Kiebrania, huku ‘kukemea kwenu’ ikiwa ya kawaida zaidi kuliko muundo halisi wa ‘kukemea kutoka kwenu.’
