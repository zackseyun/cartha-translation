  text: ה֭וֹרוּ/נִי וַ/אֲנִ֣י אַחֲרִ֑ישׁ וּ/מַה שָּׁ֝גִ֗יתִי הָבִ֥ינוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: sw
  text: Nifundisheni, nami nitanyamaza; nifahamisheni nilipokosea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: Nifundisheni
  rationale: Kauli ya kuamuru katika wingi kutoka ירה katika Hifili ina maana ya kufundisha au kuelekeza. Wingi unaelekezwa kwa marafiki wa Ayubu, na kiambishi -ni kinahifadhi maana ya ‘mimi’.
- source_word: וַאֲנִי
  choice: nami
  rationale: 'Muungano wa kiunganishi na kiwakilishi unatoa msisitizo wa kawaida na wa asili katika Kiswahili: ‘nami nitanyamaza.’'
- source_word: אַחֲרִישׁ
  choice: nitanyamaza
  rationale: Kitenzi kina maana ya kuwa kimya au kunyamaza. ‘Nitanyamaza’ kinahifadhi ahadi ya Ayubu ya kuacha kusema akifundishwa kosa lake.
- source_word: וּמַה שָּׁגִיתִי
  choice: nilipokosea
  rationale: Ingawa מַה kwa msingi ni ‘nini,’ katika muundo huu inaomba waonyeshe kosa au sehemu aliyopotoka. ‘Nilipokosea’ ni Kiswahili cha asili kinachohifadhi kutotajwa kwa kosa mahsusi.
- source_word: הָבִינוּ לִי
  choice: nifahamisheni
  rationale: Hifili ya בין ina wazo la kumsababisha mtu aelewe. ‘Nifahamisheni’ ni ombi la moja kwa moja na la asili kwa watu wengi wamweleze Ayubu kosa lake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Maumbo ya wingi ‘Nifundisheni’ na ‘nifahamisheni’ yanahifadhi kwamba Ayubu anawahutubia marafiki wake. Hakuna tanbihi iliyohitajika, kwa kuwa ‘nilipokosea’ hubeba kwa asili maana ya sehemu au namna ya kosa bila kulazimisha tafsiri finyu.
