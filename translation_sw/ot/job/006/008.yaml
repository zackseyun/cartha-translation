translation:
  language: sw
  text: Laiti ombi langu lingetimia, na Mungu angenijalia tumaini langu![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na Mungu angenipa nitumainilo!”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Laiti
  rationale: Nahau hii ni kauli ya kutamani sana, si swali halisi la ‘nani atatoa?’ ‘Laiti’ ni ya asili katika Kiswahili na inadumisha sauti ya maombolezo.
- source_word: תָּבוֹא
  choice: lingetimizwa
  rationale: Kitenzi kwa maana ya msingi ni ‘lingekuja,’ lakini hapa ombi ‘kuja’ humaanisha kufikiwa au kutimia. ‘Lingetimizwa’ hutoa maana hiyo wazi na kwa Kiswahili cha kawaida.
- source_word: שֶׁאֱלָתִי
  choice: ombi langu
  rationale: Nomino hii humaanisha ombi au dua. ‘Ombi langu’ ni wazi, fupi, na inafaa kwa kilio cha Ayubu.
- source_word: וְתִקְוָתִי
  choice: ninachokitumaini
  rationale: תִּקְוָה linaweza kumaanisha tumaini, tarajio, au tamanio. Muundo huu unahifadhi wazo la jambo analolitumaini huku ukifanya kishirikishi cha kitenzi ‘kutoa’ kiwe cha kawaida katika Kiswahili.
- source_word: יִתֵּן
  choice: angenipa
  rationale: Maana ya msingi ni ‘angetoa/angempa.’ ‘Angenipa’ inadumisha taswira ya Mungu kutoa jambo linalotumainiwa na ni Kiswahili cha asili.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni jina la umoja linalomaanisha ‘Mungu’; neno lenyewe halina msingi wa kuongeza ‘Mwenyezi.’
theological_decisions:
- issue: Kitu ambacho Ayubu anakitumaini hakitajwi wazi katika mstari huu.
  choice: ninachokitumaini
  alternative: tamanio langu
  rationale: Tafsiri haikitaji kitu hicho wala kukitambulisha moja kwa moja na kifo; inaacha muktadha unaofuata ukifafanue.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Laiti’ inadumisha msisitizo wa tamanio, na alama ya mshangao inaakisi nguvu ya kilio bila kuongeza fundisho la kitheolojia.
