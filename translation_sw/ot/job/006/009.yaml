  text: וְ/יֹאֵ֣ל אֱ֭לוֹהַּ וִֽ/ידַכְּאֵ֑/נִי יַתֵּ֥ר יָ֝ד֗/וֹ וִֽ/יבַצְּעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/009.yaml
  text: that God would be willing to crush me[c][b][a], that he would let loose his hand and cut me off.
translation:
  language: sw
  text: Laiti Mungu angekubali kuniponda[a], angeuachilia mkono wake[b] na kunikatilia mbali[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “angeona vema kuniponda.” Kitenzi cha Kiebrania huonyesha hiari au ridhaa.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “angeuachilia mkono wake”; huu ni usemi unaomaanisha kuondoa kizuizi ili apige.
    reason: cultural_note
  - marker: c
    text: Au, “anikate kabisa” au “anikomeshe kabisa.” Kiebrania kinaonyesha uharibifu wa mwisho usioweza kutenguliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאֵל
  choice: angekubali
  rationale: Kitenzi hiki katika Hiphil huonyesha hiari au ridhaa. “Angekubali” ni Kiswahili cha sasa kinachohifadhi wazo la Mungu kuwa tayari kufanya jambo hilo katika ombi la Ayubu.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Hili ni neno la kawaida la umoja linalomtaja Mungu katika kitabu cha Ayubu; halihitaji kunukuliwa kwa herufi za Kiswahili kama jina maalumu.
- source_word: וִידַכְּאֵנִי
  choice: kuniponda
  rationale: Mzizi דכא katika Piel una maana ya kuponda au kuvunja kwa nguvu. “Kuniponda” huhifadhi ukali wa maombolezo ya Ayubu bila kuupunguza.
- source_word: יַתֵּר
  choice: angeuachilia
  rationale: Neno hili lina wazo la kulegeza au kuachilia. Likiwa na “mkono wake,” linaonyesha kuondoa kizuizi ili atende kwa nguvu.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: Tafsiri halisi inahifadhi taswira ya Kiebrania kuhusu tendo na uwezo wa Mungu.
- source_word: וִיבַצְּעֵנִי
  choice: kunikatilia mbali
  rationale: בצע inaweza kumaanisha kukata au kukomesha kabisa. Katika muktadha wa Ayubu kutamani kufa, “kunikatilia mbali” huhifadhi uzito na ukamilifu wa uharibifu huo bila kubainisha njia yake.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kwa mfano wa viungo vya kibinadamu
  choice: Kuhifadhi usemi halisi “mkono wake.”
  alternative: uwezo wake; hukumu yake
  rationale: Kiebrania kinatumia taswira ya mwili kueleza utendaji wa Mungu. Kuihifadhi kunadumisha nguvu ya kihisia ya ombi la Ayubu bila kudai kwamba Mungu ana mwili wa kibinadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa “Laiti ... ange-” unaonyesha wazi ombi-tamani la Ayubu. Taswira kali za “kuniponda” na “mkono wake” zimehifadhiwa, huku “kunikatilia mbali” ikitoa maana ya mwisho wa maisha kwa lugha ya asili na nzito.
