base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: sw
  text: Kwa maana mishale ya Mwenyezi iko ndani yangu[a]; roho yangu inakunywa sumu yao[b]; vitisho vya Mungu vinajipanga dhidi yangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iko pamoja nami.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kihalisi, lakini taswira ya mishale na sumu inadokeza kuwa mishale hiyo imo ndani yangu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ghadhabu yao”; wengine hulielewa neno hili kwa maana ya dhahania kuwa ukali au ghadhabu.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “vinajiweka kwa mpangilio dhidi yangu,” ikiwa ni taswira ya kijeshi.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo ya Ayubu kuhusu sababu ya kulalamika kwake bila kulazimisha maana kuwa kiapo au sababu ya kimantiki tu.
- source_word: חִצֵּי
  choice: mishale ya
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya silaha.
- source_word: שַׁדַּי
  choice: Mwenyezi
  rationale: Ni cheo cha Mungu; ‘Mwenyezi’ ni tafsiri ya kawaida na ya asili katika Kiswahili sanifu.
- source_word: עִמָּדִי
  choice: iko ndani yangu
  rationale: Kihalisi kihusishi kinaweza kumaanisha ‘pamoja nami,’ lakini muktadha wa mishale na sumu unaonyesha mishale iliyompiga na kubaki ndani yake.
- source_word: חֲמָתָם
  choice: sumu yao
  rationale: Katika taswira ya mishale, neno linaeleweka kwa uhalisi kama sumu yake kuliko maana ya dhahania ya ghadhabu.
- source_word: שֹׁתָה
  choice: inakunywa
  rationale: Inahifadhi picha hai ya mateso yanayoendelea kumpenya Ayubu.
- source_word: רוּחִי
  choice: roho yangu
  rationale: Hapa neno linahusu nafsi au uhai wa ndani wa Ayubu, si upepo wala pumzi ya kawaida.
- source_word: בִּעוּתֵי
  choice: vitisho vya
  rationale: ‘Vitisho’ ni lugha inayoeleweka na inayowasilisha mambo yanayotia hofu kuu, huku ikifaa na shambulio linaloelezwa.
- source_word: אֱלוֹהַּ
  choice: Mungu
  rationale: Ni tafsiri ya kawaida ya jina hili la Mungu na inadumisha tofauti yake na cheo ‘Mwenyezi’ katika kishazi cha kwanza.
- source_word: יַעַרְכוּנִי
  choice: vinajipanga dhidi yangu
  rationale: Inahifadhi taswira ya kijeshi ya majeshi yanayojipanga kwa vita dhidi ya mtu.
theological_decisions:
- issue: Kutafsiri majina ya Mungu שַׁדַּי na אֱלוֹהַּ katika mistari sambamba
  choice: שַׁדַּי imetafsiriwa ‘Mwenyezi,’ na אֱלוֹהַּ ‘Mungu.’
  alternative: Kutumia ‘Shaddai,’ au kutafsiri yote mawili kwa cheo kilekile.
  rationale: Kiebrania kinatumia majina mawili tofauti. Kuyatafsiri kwa namna tofauti huhifadhi utofauti huo bila kuyaunganisha kimafundisho.
- issue: Maana ya חֲמָתָם katika taswira ya mishale
  choice: sumu yao
  alternative: ghadhabu yao; ukali wao
  rationale: Muktadha wa mishale na tendo la ‘kunywa’ unaunga mkono maana halisi ya sumu, bila kuondoa kabisa uhusiano wa neno hilo na ukali au ghadhabu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi taswira tatu zinazoungana—mishale, sumu, na safu ya vita—kwa lugha rahisi kueleweka. ‘Vitisho’ limetumiwa kwa wingi ili kuhifadhi wingi wa Kiebrania na kuonyesha mashambulizi yanayotia hofu.
