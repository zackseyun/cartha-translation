  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: sw
  text: Rudini[a], tafadhali; kusiwe na dhuluma. Rudini tena; haki yangu bado iko humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Fikirini upya; haki yangu bado iko katika jambo hili.”'
    reason: Neno la kurudi linaweza katika muktadha huu kumaanisha kugeuza hukumu au kufikiri upya, na “haki yangu bado iko humo” inaweza kueleweka kuwa Ayubu ana haki katika shauri hili.
lexical_decisions:
- source_word: שֻׁבוּ
  choice: Rudini
  rationale: Ni amri ya wingi ya שוב. Katika muktadha huu Ayubu anawasihi rafiki zake wageuze msimamo wao na waipime upya hukumu yao; “rudini” inadumisha picha ya kurudi bila kuifafanua kupita kiasi.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe hii hulainisha ombi. “Tafadhali” ni Kiswahili cha sasa na cha kawaida kuliko miundo ya kale au tafsiri ya wakati kama “sasa.”
- source_word: אַל תְּהִי עַוְלָה
  choice: kusiwe na dhuluma
  rationale: Muundo usio na mtenda maalumu unahifadhi kauli ya Kiebrania, “dhuluma isiwepo,” bila kuongeza wazi kwamba rafiki zake ndio watendaji.
- source_word: עַוְלָה
  choice: dhuluma
  rationale: Katika mabishano haya neno linaonyesha ukosefu wa haki au hukumu isiyo ya haki. “Dhuluma” ni neno la kawaida, lenye uzito wa kimaadili na kimahakama.
- source_word: וְשֻׁבוּ
  choice: Naam, rudini tena
  rationale: Kurudiwa kwa amri kunasisitiza ombi. “Naam” linaonyesha msisitizo wa kiunganishi, na “rudini tena” linahifadhi marudio ya wito.
- source_word: עוֹד
  choice: bado
  rationale: Hapa neno linaeleweka kwa kawaida kuwa “bado,” likionyesha kwamba haki ya Ayubu inaendelea kuwapo, badala ya kuwa amri nyingine ya kurudia.
- source_word: צִדְקִי
  choice: haki yangu
  rationale: Neno linaweza kumaanisha uadilifu au dai la kuwa upande wa haki katika shauri. “Haki yangu” huhifadhi upana wa kimaadili na kimahakama bila kudai ukamilifu usio na dhambi.
- source_word: בָהּ
  choice: imo humo
  rationale: Kiwakilishi cha kike hakina rejeleo lililotajwa wazi, huenda ni jambo au shauri linalozungumziwa. “Humo” huhifadhi kutotajwa wazi kwa rejeleo badala ya kuliingiza moja kwa moja katika matini.
theological_decisions:
- issue: Maana ya dai la Ayubu kuhusu צִדְקִי
  choice: Ayubu anasisitiza kwamba bado ana haki au uadilifu katika jambo linalobishaniwa.
  alternative: Ayubu anadai kutokuwa na dhambi yoyote; au anasema kwa ujumla tu kwamba haki ndiyo inayohusika.
  rationale: Muktadha ni hukumu ya rafiki zake juu yake. “Haki yangu” inadumisha maana ya kimaadili na kimahakama, lakini haisuluhishi dai hilo kuwa tangazo la ukamilifu usio na dhambi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo mfupi na marudio ya amri yamehifadhiwa; “humo” limeachwa na utata wake wa rejeleo, huku tanbihi ikitoa maana ya kimuktadha.
