base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: sw
  text: Akawachukua uhamishoni watu wote wa Yerusalemu, maafisa wote, mashujaa wote—jumla ya wahamishwa elfu kumi—pamoja na mafundi wote na wahunzi[a]. Hakuna mtu aliyebaki isipokuwa watu maskini zaidi miongoni mwa watu wa nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundi wa metali”; neno la Kiebrania linalotafsiriwa kwa kawaida “wahunzi” huenda linamaanisha kwa upana zaidi wafanyakazi stadi wa metali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: Akawachukua uhamishoni
  rationale: Hifili ya גלה inaonyesha kuwalazimisha watu kwenda uhamishoni; usemi huu ni wa kawaida katika Kiswahili na unaweka wazi kuondolewa kwa nguvu.
- source_word: כָּל יְרוּשָׁלִַם
  choice: watu wote wa Yerusalemu
  rationale: Yerusalemu imetumiwa kimetonimia kumaanisha wakazi wake, si majengo ya jiji; kuongeza ‘watu’ huifanya maana hiyo iwe wazi katika Kiswahili.
- source_word: הַשָּׂרִים
  choice: maafisa
  rationale: Neno שׂרים linaweza kumaanisha wakuu, watawala, au maafisa; ‘maafisa’ linafaa kwa tabaka la viongozi bila kudokeza kwamba wote walikuwa wana wa kifalme.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: mashujaa wote hodari
  rationale: Kirai hiki humaanisha wapiganaji wenye uwezo na ushujaa; tafsiri hii inadumisha uzito wa usemi wa Kiebrania kwa lugha ya asili ya Kiswahili.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: jumla ya wahamishwa elfu kumi
  rationale: גולה ni nomino ya mkusanyiko kwa watu waliopelekwa uhamishoni. ‘Wahamishwa’ inaonyesha kuwa waliondolewa kwa lazima, na ‘jumla ya’ huunganisha idadi hiyo na orodha iliyotangulia.
- source_word: הֶחָרָשׁ
  choice: mafundi
  rationale: חרש humaanisha kwa upana fundi stadi au mwanaufundi; ‘mafundi’ ni neno la kawaida na lenye maana pana katika Kiswahili.
- source_word: הַמַּסְגֵּר
  choice: wahunzi
  rationale: Hili ni neno lenye maana isiyo hakika, ambalo kwa kawaida hufasiriwa kuwa wahunzi lakini huenda linamaanisha kwa upana zaidi mafundi wa metali; tanbihi inalihifadhi jambo hilo.
- source_word: לֹא נִשְׁאַר
  choice: Hakuna mtu aliyebaki
  rationale: Kauli ya Kiebrania inaonyesha kwamba hakuna aliyesalia; huu ni usemi wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: isipokuwa walio maskini zaidi miongoni mwa watu wa nchi
  rationale: דלת humaanisha sehemu maskini au dhaifu ya watu. Tafsiri hii inaonyesha hali yao ya kijamii na kiuchumi huku ikihifadhi maana ya kwamba walikuwa sehemu ya watu wa nchi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi wa kimetonimia ‘Yerusalemu’ umefafanuliwa kwa ‘watu wa Yerusalemu,’ na alama ya tanbihi imewekwa baada ya neno linalohusika, ‘wahunzi.’
