base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: sw
  text: Wakati huo, watumishi wa Nebukadneza mfalme wa Babeli walipanda kwenda Yerusalemu[a], nao mji ukazingirwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipanda dhidi ya Yerusalemu.” Kitenzi cha Kiebrania kinaweza kuonyesha kupanda kwenda mahali palipo juu na pia kusonga mbele kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “mji ukaingia katika hali ya kuzingirwa,” jambo linaloweza kusisitiza mwanzo wa mzingiro huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweka tukio katika kipindi kilichotajwa katika simulizi na kuhifadhi nguvu ya rejeleo la Kiebrania.
- source_word: עָלָה
  choice: walipanda kwenda
  rationale: Kitenzi kina maana ya msingi ya kupanda au kwenda juu. Katika muktadha huu kinaeleza mwendo wa kijeshi kuelekea Yerusalemu; tafsiri hii huhifadhi nahau ya Kiebrania bila kuongeza wazi maneno yasiyokuwapo kama ‘kuushambulia.’
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Neno lina maana ya watumishi au walio chini ya mamlaka ya mtu. Huenda hapa likarejelea maafisa au vikosi, lakini ‘watumishi’ huepuka kubainisha zaidi ya chanzo.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadneza
  rationale: Hili ni umbo la jina linalotambulika na kutumiwa kwa kawaida katika mapokeo ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Cheo cha kifalme kimetafsiriwa moja kwa moja kwa Kiswahili cha kawaida.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Ni umbo la kawaida la jina la mahali katika Kiswahili.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: nao mji ukazingirwa
  rationale: Kiebrania husema kwa karibu zaidi kwamba mji ‘uliingia katika hali ya kuzingirwa.’ Kiswahili ‘mji ukazingirwa’ ni cha asili na, kwa kiambishi cha matukio ‘-ka-’, kinaonyesha kuanza kwa hali hiyo katika mfululizo wa simulizi.
- source_word: מָצוֹר
  choice: kuzingirwa
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa hali ya kijeshi ya kuwekewa mzingiro.
