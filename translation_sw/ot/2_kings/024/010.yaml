  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Watumishi’ huhifadhi upana wa neno la chanzo, na maelezo ya chini huhifadhi uwezekano wa maana ya kijeshi na hali ya kuanza kwa mzingiro.
