base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: sw
  text: Katika siku zake, Nebukadneza, mfalme wa Babeli, alikuja, na Yehoyakimu akawa mtumishi wake kwa miaka mitatu.[a] Kisha Yehoyakimu akageuka na kumwasi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa chini ya mamlaka yake kwa miaka mitatu.” Kiebrania husema kihalisi, “akawa kwake mtumishi,” usemi wa kisiasa unaoonyesha kutiishwa chini ya mtawala mwenye nguvu zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “akarudi na kumwasi.” Kitenzi “akageuka” huenda kinaonyesha kwamba Yehoyakimu alibadili utii wake kabla ya kuasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Katika siku zake
  rationale: Huhifadhi nahau ya Kiebrania inayoonyesha kipindi cha utawala wa mfalme aliyetajwa kabla, huku ikiwa ya kawaida katika Kiswahili cha kibiblia.
- source_word: עָלָה
  choice: alikuja kupigana naye
  rationale: Kitenzi עלה kimsingi ni ‘kupanda/kwenda juu,’ lakini katika muktadha wa mfalme wa kigeni huonyesha kusonga kijeshi dhidi ya nchi; kirai hiki huwasilisha maana ya kimuktadha bila kutumia ‘alipanda,’ ambayo ingekuwa tata kwa msomaji wa kawaida.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadneza
  rationale: Hili ndilo umbo la jina linalotambulika sana katika mapokeo ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kirai unganifu cha Kiebrania.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: Yehoyakimu akawa mtumishi wake
  rationale: ‘Akawa’ huonyesha kuingia katika hali ya kutiishwa, nayo ‘mtumishi’ huhifadhi taswira ya עֶבֶד; katika muktadha huu ni uhusiano wa kisiasa.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: kwa miaka mitatu
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha muda uliodumu hali hiyo.
- source_word: וַיָּשָׁב
  choice: Kisha akageuka
  rationale: Huhifadhi maana ya msingi ya שוב, ‘kugeuka/kurudi,’ na kudokeza kubadili utii bila kuifuta kuwa kitenzi tofauti kabla ya uasi.
- source_word: וַיִּמְרָד בּוֹ
  choice: akamwasi
  rationale: ‘Kumwasi’ huwasilisha kwa uwazi uasi dhidi ya mtawala mkuu na husikika kwa kawaida katika Kiswahili.
