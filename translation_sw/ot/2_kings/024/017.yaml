translation:
  language: sw
  text: Kisha mfalme wa Babeli akamfanya Matania[a], ami ya Yehoyakini, kuwa mfalme mahali pa Yehoyakini, na akabadilisha jina lake kuwa Sedekia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “akamtawaza Matania ... kuwa mfalme.” Kitenzi cha Kiebrania kina maana ya kisababishi: mfalme wa Babeli alimweka Matania kuwa mtawala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: akamweka ... kuwa mfalme
  rationale: 'Kauli ya Hifili ya מלך ina maana ya kisababishi: mfalme wa Babeli alimsimika Matania atawale. Usemi huu ni wa asili katika Kiswahili na unahifadhi maana hiyo.'
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Muundo wa tegemezi unamtambulisha wazi mtendaji; huu ndio usemi wa kawaida na ulio wazi katika Kiswahili.
- source_word: מַתַּנְיָה
  choice: Matania
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: דֹדוֹ
  choice: mjomba wake
  rationale: דּוֹד hapa humaanisha ndugu wa kiume wa mzazi; katika muktadha wa kihistoria Matania alikuwa ndugu wa baba wa Yehoyakini. Kiswahili sanifu hutumia 'mjomba' kwa mjomba au ami, ingawa hakibainishi upande wa ukoo.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa kutawazwa, תחת huonyesha kuchukua nafasi ya mtawala mwingine.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: akalibadili jina lake
  rationale: Ingawa סבב kimsingi huhusu kugeuza, inapohusishwa na jina humaanisha kulibadili au kumpa mtu jina jingine.
- source_word: צִדְקִיָּהוּ
  choice: Sedekia
  rationale: Hili ndilo umbo la jina lililozoeleka katika matumizi ya Biblia za Kiswahili.
