  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: sw
  text: Sedekia alikuwa na umri wa miaka ishirini na mmoja alipoanza kutawala, naye akatawala Yerusalemu kwa miaka kumi na mmoja. Mama yake aliitwa Hamutali[a], binti ya Yeremia, kutoka Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia huandikwa Hamitali.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na mmoja
  rationale: Nahau ya Kiebrania, kihalisi ‘mwana wa miaka ishirini na mmoja,’ imetafsiriwa kwa Kiswahili sanifu na cha kawaida bila kupoteza taarifa ya umri.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo wenye ב na kitenzi-jina unaonyesha wakati wa kuingia madarakani; usemi huu ni wa kawaida na sahihi katika Kiswahili.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki kinamaanisha kutawala akiwa mfalme; ‘akatawala’ kinaendeleza kwa asili simulizi ya Kiswahili.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Kiambishi ב kina maana ya mahali; katika Kiswahili jina la mahali lenyewe baada ya ‘kutawala’ linaeleweka kwa kawaida kuwa eneo la utawala.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa fomula ya Kiebrania ‘na jina la mama yake lilikuwa.’
- source_word: חמיטל
  choice: Hamutali
  rationale: Jina limetoholewa kwa mfumo unaofaa matamshi ya Kiswahili; maandishi ya Kiebrania yanaweza kuwakilishwa pia kama ‘Hamitali.’
- source_word: בַּת יִרְמְיָהוּ
  choice: binti ya Yeremia
  rationale: Usemi wa ukoo unaonyesha kuwa Hamutali alikuwa binti wa Yeremia.
- source_word: מִלִּבְנָה
  choice: kutoka Libna
  rationale: Kiambishi מ kinaonyesha asili au mahali alikotoka.
