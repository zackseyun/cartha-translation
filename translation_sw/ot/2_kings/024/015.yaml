base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: sw
  text: Akampeleka Yehoyakini uhamishoni Babeli, pamoja na mama ya mfalme[a], wake za mfalme, maofisa wake wa ikulu[b], na wakuu wa nchi[c]; akawapeleka uhamishoni kutoka Yerusalemu hadi Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mama ya mfalme.” Inaweza pia kusemwa “mama malkia,” ikiwa maneno hayo yanaeleweka kama cheo rasmi cha kifalme.'
    reason: lexical_alternative
  - marker: b
    text: Au “matowashi wake”; neno la Kiebrania linaweza kumaanisha matowashi hasa au, kwa maana pana, maofisa wa mfalme au wa ikulu.
    reason: lexical_alternative
  - marker: c
    text: Au “watu wenye nguvu wa nchi” au “watu mashuhuri wa nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: akamhamisha
  rationale: Kitenzi גלה katika muundo wa kusababisha kinaonyesha kumwondoa mtu mahali pake na kumpeleka uhamishoni. “Akamhamisha” kinaendeleza wazo la mwendo, huku sehemu ya pili ya mstari ikitaja uhamisho waziwazi.
- source_word: בָּבֶלָה
  choice: kwenda Babeli
  rationale: He ya mwelekeo inaonyesha mwendo kuelekea Babeli; “kwenda Babeli” ni Kiswahili cha kawaida na cha wazi.
- source_word: אֵם הַמֶּלֶךְ
  choice: mama ya mfalme
  rationale: Hii inafuata maana ya kifamilia ya Kiebrania, “mama wa mfalme,” bila kuifanya moja kwa moja kuwa cheo rasmi cha kifalme.
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: wake za mfalme
  rationale: Wingi wa Kiebrania unarejelea wake wa mfalme; kurudia “mfalme” kunadumisha muundo wa chanzo.
- source_word: סָרִיסָיו
  choice: maofisa wake wa ikulu
  rationale: סָרִיס inaweza kumaanisha matowashi hasa au maofisa wa kifalme kwa ujumla. Tafsiri kuu inaonyesha kazi yao katika mazingira ya ikulu, huku tanbihi ikihifadhi maana nyingine.
- source_word: אֵילֵי הָאָרֶץ
  choice: wakuu wa nchi
  rationale: Usemi huu unawahusu watu wenye nguvu, hadhi, au ushawishi nchini. “Wakuu wa nchi” ni wa heshima na unaeleweka kwa urahisi bila kubainisha kupita kiasi aina ya mamlaka yao.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: akawapeleka uhamishoni
  rationale: Muungano huu unaonyesha kuwasababisha watu waende wakiwa wahamishwa; “akawapeleka uhamishoni” ni wa asili na unaweka wazi wazo la uhamisho.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: kutoka Yerusalemu hadi Babeli
  rationale: Majina haya yanaonyesha mahali walikotolewa na walikopelekwa.
