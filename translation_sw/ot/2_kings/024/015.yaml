translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha kurudiwa kwa “mfalme” na marudio ya safari kwenda Babeli yaliyomo katika Kiebrania, huku tanbihi zikihifadhi utata wa סָרִיסָיו na אֵילֵי הָאָרֶץ.
