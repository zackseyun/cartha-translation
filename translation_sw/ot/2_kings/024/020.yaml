base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: sw
  text: Kwa maana, mambo yalifikia hivi katika Yerusalemu na Yuda kwa sababu ya hasira ya Yahweh, mpaka akawafukuza kutoka mbele zake.[a] Naye Sedekia alimwasi mfalme wa Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana hasira ya Yahweh ilikuwa dhidi ya Yerusalemu na Yuda, mpaka akawafukuza kutoka mbele zake.” Kiebrania cha kishazi cha kwanza kimebanwa na kinaweza kutafsiriwa kwa namna hii iliyo rasmi zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana, kwa sababu
  rationale: כִּי linaunganisha aya hii na muktadha uliotangulia kwa kutoa maelezo yenye nguvu ya kisababishi; Kiswahili hiki kinahifadhi kazi zote mbili bila kuacha uhusiano huo.
- source_word: עַל אַף יְהוָה
  choice: kwa sababu ya hasira ya Yahweh
  rationale: Nahau עַל אַף inaonyesha hasira kali ya Mungu. ‘Hasira’ ni ya kawaida na yenye uzito unaofaa, huku jina la agano יְהוָה likitolewa kama ‘Yahweh’.
- source_word: הָיְתָה
  choice: mambo yalifikia hivi
  rationale: Kitenzi cha umoja wa kike hakina kiima kilichotajwa wazi. Usemi huu wa Kiswahili unaeleza kwa asili kwamba hali ya Yerusalemu na Yuda ilifikia matokeo hayo, bila kubuni kiima mahsusi.
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: katika Yerusalemu na Yuda
  rationale: ב limetafsiriwa kwa maana ya mahali au nyanja ambamo hali hiyo ilitokea.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: mpaka akawatupa mbali
  rationale: עַד pamoja na kitenzi-jina huonyesha kikomo au matokeo ya hali hiyo; ‘akawatupa mbali’ kinahifadhi nguvu ya הִשְׁלִיךְ.
- source_word: מֵעַל פָּנָיו
  choice: na uwepo wake
  rationale: Nahau ya Kiebrania, kihalisi ‘kutoka mbele ya uso wake,’ hapa inamaanisha kuondolewa katika uwepo wake.
- source_word: וַיִּמְרֹד
  choice: Naye ... alimwasi
  rationale: מרד humaanisha kuasi dhidi ya mtawala; ‘alimwasi’ ni muundo wa kawaida wa Kiswahili na unafaa kwa kishamirisho kinachofuata.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Baada ya מרד, ב lina maana ya kiadui, ambayo tayari imebeba katika kitenzi cha Kiswahili ‘alimwasi’.
- source_word: צִדְקִיָּהוּ
  choice: Sedekia
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Uhusiano wa sababu na matokeo katika kishazi cha kwanza
  choice: Hasira ya Yahweh ilisababisha mambo ya Yerusalemu na Yuda yafikie hatua ya wao kutupwa mbali na uwepo wake.
  alternative: Hasira ya Yahweh ilikuwa dhidi ya Yerusalemu na Yuda mpaka alipowatupa mbali naye.
  rationale: Sintaksia ya Kiebrania imebanwa na inaweza kueleweka kwa njia zote mbili. Maandishi makuu yanaonyesha mwelekeo wa matokeo, na tanbihi inahifadhi tafsiri rasmi zaidi bila kuondoa utata halisi.
- issue: Tafsiri ya יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la Mungu la herufi nne moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mambo yalifikia hivi’ huepuka Kiswahili kisicho cha kawaida cha tafsiri ya neno kwa neno, huku tanbihi ikihifadhi uwezekano mwingine wa sintaksia. Alama ya tanbihi [a] imewekwa katika maandishi makuu.
