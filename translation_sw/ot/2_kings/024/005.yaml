base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Yehoyakimu, na yote aliyoyafanya, je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumbukumbu za wafalme wa Yuda.” Jina la Kiebrania linamaanisha chanzo cha kumbukumbu za kifalme kinachotajwa mara nyingi katika vitabu vya Wafalme; si lazima kiwe kitabu cha kikanoni cha Mambo ya Nyakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika muundo huu wa taarifa za kifalme, maneno haya yanamaanisha mambo au matendo mengine yaliyosalia kutajwa, si ‘maneno’ ya mfalme pekee.
- source_word: יְהוֹיָקִים
  choice: Yehoyakimu
  rationale: Umbo hili linafuata namna ya kawaida ya kuandika jina hili katika Kiswahili cha Biblia.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyoyafanya
  rationale: Tafsiri hii inahifadhi upana wa kifungu cha Kiebrania bila kufafanua matendo hayo zaidi ya chanzo.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Hili linahifadhi swali la balagha la Kiebrania na linapatanisha kisarufi na ‘matendo’ na ‘yote’ yaliyotajwa.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa kihalisi ni ‘juu ya kitabu/ hati-kunjo,’ ‘katika Kitabu’ ni Kiswahili cha kawaida kwa habari zilizoandikwa ndani ya kumbukumbu.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda
  rationale: Hili linawasilisha jina la kumbukumbu ya kifalme kwa lugha yenye staha na inayotambulika, huku tanbihi ikizuia kuchanganywa moja kwa moja na kitabu cha kikanoni cha Mambo ya Nyakati.
theological_decisions:
- issue: Utambulisho wa Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda
  choice: Jina la chanzo limehifadhiwa, huku tanbihi ikieleza kuwa ni kumbukumbu ya kifalme inayotajwa katika Wafalme.
  alternative: Kulitambulisha moja kwa moja kuwa kitabu cha kikanoni cha Mambo ya Nyakati.
  rationale: Kiebrania kinataja chanzo cha kumbukumbu za kifalme lakini hakilazimishi utambulisho wake na kitabu cha kikanoni cha Mambo ya Nyakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Swali la balagha limehifadhiwa, na kiunganishi cha Kiebrania hakijapanuliwa kuwa kielezi cha wakati kama ‘basi’ au ‘sasa’.
