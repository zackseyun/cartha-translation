  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: sw
  text: Hakika, jambo hili liliipata Yuda kwa amri ya Yahwe, ili kuwaondoa kutoka mbele za uso wake[a] kwa sababu ya dhambi za Manase, sawasawa na yote aliyoyafanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika uwepo wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hakika
  rationale: Katika muktadha huu neno hili linasisitiza uhakika wa maelezo, si kuweka mpaka wa maana kama ‘tu’.
- source_word: עַל פִּי
  choice: kwa amri ya
  rationale: Nahau hii, ambayo kihalisi ni ‘kwa kinywa cha,’ hapa inaonyesha kwamba jambo hilo lilitokea kwa mujibu wa amri au neno la Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kwa umbo la ‘Yahwe,’ linalokaribia matamshi ya jina la Kiebrania na kufuata matumizi ya mradi.
- source_word: הָיְתָה בִּיהוּדָה
  choice: jambo hili liliipata Yuda
  rationale: Kifungu cha Kiebrania ni cha kidokezo na kinarejelea hukumu iliyotangulia katika muktadha. Tafsiri hii huweka wazi tukio lililodokezwa bila kulifafanua kupita kiasi.
- source_word: לְהָסִיר
  choice: ili kuwaondoa
  rationale: Kitenzi hiki katika muundo wa Hifili kina maana ya kusababisha kuondoka. Kiambishi ‘-wa-’ kinarejelea kwa kawaida watu wa Yuda wanaodokezwa na muktadha.
- source_word: מֵעַל פָּנָיו
  choice: mbele za uso wake
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania ya kuondolewa mbele ya uso wa Mungu; maana laini zaidi imewekwa katika tanbihi.
- source_word: בְּחַטֹּאת
  choice: kwa sababu ya dhambi za
  rationale: Kihusishi kinaonyesha sababu, na nomino inaweza kueleweka kwa maana ya jumla ya makosa mengi ya Manase.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: sawasawa na yote aliyoyafanya
  rationale: ‘Sawasawa na’ huhifadhi wazo la ulinganifu au kipimo katika כְּכֹל, huku kishazi kizima kikibaki cha kawaida katika Kiswahili.
theological_decisions:
- issue: Yule anayeondolewa katika kishazi ambacho Kiebrania hakitaji yambwa waziwazi
  choice: Kuwaondoa watu wa Yuda, kama inavyodokezwa na muktadha
  alternative: 'Kuacha yambwa bila kutajwa: ‘ili kuondoa mbele za uso wake’'
  rationale: Muktadha unahusu Yuda na Yerusalemu kutupwa mbali. Kiswahili huhitaji yambwa ili sentensi isomeke wazi, lakini tafsiri haibainishi zaidi ya kile kinachodokezwa na muktadha.
- issue: Lugha inayohusu uwepo wa Mungu
  choice: Kudumisha taswira ya ‘mbele za uso wake’ katika matini kuu
  alternative: kutoka katika uwepo wake
  rationale: Kiebrania kinatumia taswira halisi ya uso wa Mungu. Kuihifadhi kunaendeleza uzito wa kufukuzwa mbele zake bila kulazimisha ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Mbele za uso wake’ imehifadhiwa makusudi ili kuendeleza taswira ya Kiebrania, huku tanbihi ikitoa usemi laini zaidi.
