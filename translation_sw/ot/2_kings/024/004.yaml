base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: sw
  text: na pia kwa sababu ya damu isiyo na hatia aliyoimwaga[a], kwa maana aliijaza Yerusalemu kwa damu isiyo na hatia; naye Yahwe hakutaka kusamehe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “damu ya watu wasio na hatia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “naye Yahwe hakuwa tayari kusamehe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: na pia
  rationale: Huhifadhi nguvu ya kiunganishi na ya kuongeza sababu nyingine kwenye sababu za hukumu zilizotajwa kabla.
- source_word: דַּם הַנָּקִי
  choice: damu isiyo na hatia
  rationale: Ni usemi wa kawaida wa Kiswahili unaoeleza damu iliyomwagwa kwa kuwaua watu wasio na hatia; urejeo wake maalumu unaeleweka katika muktadha.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: aliyoimwaga
  rationale: Kumwaga damu ni nahau ya kawaida inayolingana na שׁפך inapohusishwa na damu.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: kwa maana aliujaza Yerusalemu damu isiyo na hatia
  rationale: Kitenzi cha Kiebrania kinasema kwamba aliujaza mji damu isiyo na hatia. ‘Kwa maana’ kinaonyesha uhusiano wa ufafanuzi unaoonekana katika muktadha bila kubadili dai lenyewe.
- source_word: וְלֹא אָבָה
  choice: naye ... hakutaka
  rationale: אָבָה hueleza kutaka au kuwa tayari; ‘hakutaka’ ni wazi na ya kawaida huku ikihifadhi msisitizo wa kutokuwa tayari.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadili kuwa cheo.
- source_word: לִסְלֹחַ
  choice: kusamehe
  rationale: Ni kitenzi cha kawaida na wazi cha Kiswahili kwa msamaha wa Mungu katika muktadha huu.
theological_decisions:
- issue: Kukataa kwa Mungu kusamehe katika muktadha wa hatia ya Manase ya kumwaga damu
  choice: Aya inasema kwamba Yahwe hakutaka kusamehe kutokana na hatia iliyokusanywa ya kumwaga damu isiyo na hatia.
  alternative: Yahwe hakusamehe, bila kutaja kutotaka kwake.
  rationale: Kiebrania kinatumia אָבָה, kitenzi cha kutaka au kuwa tayari, pamoja na ‘kusamehe.’ Tafsiri inadumisha uzito na mvutano wa kauli hiyo bila kuupunguza wala kueleza zaidi ya aya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendelea kutoka aya iliyotangulia, na ‘kwa sababu ya’ imeongezwa ili kufanya uhusiano wa kisintaksia wa kipande hiki uwe wazi kwa Kiswahili.
