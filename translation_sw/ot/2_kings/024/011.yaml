translation:
  language: sw
  text: Ndipo Nebukadneza mfalme wa Babeli akaja kuushambulia mji, huku watumishi wake wakiuzingira[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huku watumishi wake wakiuweka mji chini ya mzingiro.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “watumishi wake” yanaweza kumaanisha maafisa, mawakala, au vikosi vya mfalme wa Babeli vilivyokuwa katika utumishi wake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi hiki ni cha kawaida katika masimulizi na humaanisha ‘akaja’; mwelekeo wa uhasama unaelezwa na עַל na muktadha wa kuzingirwa.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadneza
  rationale: Hili ndilo umbo la kawaida la jina la mfalme huyu katika matumizi ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Tafsiri ya moja kwa moja ya muundo unaotaja cheo chake cha kifalme na ufalme wake.
- source_word: עַל הָעִיר
  choice: kuushambulia mji
  rationale: Katika muktadha wa kijeshi na kuzingirwa kwa mji, עַל huonyesha kumjia mji kwa uhasama; ‘kuushambulia’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַעֲבָדָיו
  choice: watumishi wake
  rationale: Neno עֲבָדִים kimsingi ni ‘watumishi’; katika mazingira ya kifalme linaweza kuwahusu maafisa, mawakala, au vikosi vinavyomtumikia mfalme bila kulazimisha kundi moja maalumu.
- source_word: צָרִים
  choice: wakiuzingira
  rationale: Kivumishi-tendo cha צור hapa kinaonyesha kitendo cha kuzingira kilichokuwa kikiendelea wakati Nebukadneza alipofika.
- source_word: עָלֶיהָ
  choice: -u- katika ‘wakiuzingira’
  rationale: Kiwakilishi hiki kinarejelea mji; Kiswahili huingiza yambwa katika kitenzi ‘wakiuzingira’ badala ya kurudia kihusishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘huku ... waki-’ unaonyesha wazi kwamba kuzingirwa kulikuwa kukiendelea wakati mfalme alipofika. Neno ‘watumishi’ limehifadhiwa ili kuepuka kubainisha kupita kiasi ikiwa walikuwa maafisa au wanajeshi.
