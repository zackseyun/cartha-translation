language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: sw
  text: Yahwe akatuma dhidi yake vikosi vya Wakaldayo, vikosi vya Aramu[a], vikosi vya Moabu, na vikosi vya Waamoni. Akavituma dhidi ya Yuda ili kuiangamiza[b], sawasawa na neno la Yahwe alilokuwa amesema kupitia watumishi wake, manabii.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aramu ndilo jina la Kiebrania; kwa kawaida eneo hilo limeitwa Siria.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili kumwangamiza,” ikimrejelea Yehoyakimu badala ya Yuda.
    reason: alternative_reading
  - marker: c
    text: Neno la Kiebrania linaweza pia kutafsiriwa “makundi ya wavamizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: akatuma
  rationale: Ni tafsiri ya kawaida ya kitenzi שלח katika simulizi, nayo inadumisha tendo la Yahwe bila kuongeza maelezo yasiyokuwamo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inadumisha jina binafsi la Mungu lililo katika maandishi ya Kiebrania.
- source_word: בּוֹ
  choice: dhidi yake
  rationale: Katika muktadha huu wa mashambulizi, kihusishi kinaonyesha uhasama ulioelekezwa kwa Yehoyakimu.
- source_word: גְּדוּדֵי
  choice: vikosi
  rationale: Neno גדוד linaweza kumaanisha makundi au vikosi vya kijeshi, hasa vya kuvamia. “Vikosi” ni la kawaida na lenye heshima katika Kiswahili bila kudokeza majeshi makubwa rasmi.
- source_word: כַשְׂדִּים
  choice: Wakaldayo
  rationale: Inafuata jina mahususi la watu katika Kiebrania badala ya kulibadilisha kuwa “Wababeli.”
- source_word: אֲרָם
  choice: Aramu
  rationale: Inahifadhi jina la Kiebrania badala ya jina la jadi “Siria.”
- source_word: מְוֹאָב
  choice: Moabu
  rationale: Ni umbo la kawaida la Kiswahili la jina la mahali na watu hawa.
- source_word: בְנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ni jina la kawaida la Kiswahili kwa kundi la watu linaloitwa kihalisi “wana wa Amoni.”
- source_word: וַיְשַׁלְּחֵם
  choice: Akavituma
  rationale: Marudio ya kitenzi katika Kiebrania yamedumishwa kwa ajili ya msisitizo na mwendelezo wa simulizi.
- source_word: בִּיהוּדָה
  choice: dhidi ya Yuda
  rationale: Ingawa kihusishi kinaweza kumaanisha “katika” au “kuingia,” muktadha wa kijeshi unaonyesha wazi tendo la uhasama dhidi ya Yuda.
- source_word: לְהַאֲבִידוֹ
  choice: ili kuiangamiza
  rationale: Kiambishi cha umoja wa kiume kinaweza kurejelea Yuda kama ufalme unaotazamwa kwa umoja; rejeleo kwa Yehoyakimu pia linawezekana na limehifadhiwa katika tanbihi.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: Inadumisha kwa uwazi muundo wa kinabii unaoonyesha kwamba tukio lilitimiza neno lililonenwa na Yahwe.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: kupitia watumishi wake, manabii
  rationale: “Kwa mkono wa” ni nahau ya Kiebrania inayomaanisha kupitia kwa wakala; tafsiri hii ni ya asili katika Kiswahili na inadumisha jukumu la manabii kama wajumbe.
theological_decisions:
- issue: Kirejelewa cha kiambishi katika לְהַאֲבִידוֹ
  choice: 'Yuda ndiyo inayorejelewa: “ili kuiangamiza.”'
  alternative: 'Yehoyakimu ndiye anayerejelewa: “ili kumwangamiza.”'
  rationale: Yuda imetajwa mara moja kabla ya kishazi hiki na ndiyo shabaha kuu ya hukumu katika muktadha. Hata hivyo, umbo la kisarufi linaweza pia kumrejelea Yehoyakimu, kwa hiyo uwezekano huo haujafichwa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. Marudio ya “vikosi” na ya kitenzi “kutuma” yamehifadhiwa ili kuakisi msisitizo wa Kiebrania. Jina “Yahwe” limetumiwa kwa יהוה, na utata halisi kuhusu anayelengwa na “kuiangamiza” umehifadhiwa kwa tanbihi.
