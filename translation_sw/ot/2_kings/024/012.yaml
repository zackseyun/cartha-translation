source:
  edition: WLC
  text: וַ/יֵּצֵ֞א יְהוֹיָכִ֤ין מֶֽלֶךְ יְהוּדָה֙ עַל מֶ֣לֶךְ בָּבֶ֔ל ה֣וּא וְ/אִמּ֔/וֹ וַ/עֲבָדָ֖י/ו וְ/שָׂרָ֣י/ו וְ/סָֽרִיסָ֑י/ו וַ/יִּקַּ֤ח אֹת/וֹ֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַ֥ת שְׁמֹנֶ֖ה לְ/מָלְכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: sw
  text: Ndipo Yehoyakini, mfalme wa Yuda, akatoka kwenda kwa mfalme wa Babeli, yeye pamoja na mama yake, watumishi wake, maofisa wake na matowashi wake[a]. Mfalme wa Babeli akamchukua katika mwaka wa nane wa utawala wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maofisa wake wa ikulu”; neno la Kiebrania linaweza kumaanisha matowashi hasa au, kwa upana zaidi, maofisa wa jumba la kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka kwenda
  rationale: Kitenzi יצא kimsingi humaanisha ‘kutoka.’ Katika mazingira ya kuzingirwa kinaashiria kwenda kujikabidhi mbele ya mfalme wa Babeli, lakini tafsiri hii haiingizi moja kwa moja maana ya ‘alisalimu amri.’
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: kwa mfalme wa Babeli
  rationale: Pamoja na kitenzi cha kutoka, עַל hapa inaelekeza mwendo kwa mtu. ‘Kwenda kwa’ ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: הוּא וְאִמּוֹ
  choice: yeye pamoja na mama yake
  rationale: Kiwakilishi kinamrejelea tena mhusika na kuanzisha waliotoka pamoja naye; ‘pamoja na’ huwasilisha uambatano huo kwa Kiswahili cha asili.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עבד inaweza kumaanisha watumishi au maafisa. ‘Watumishi’ ni neno pana na linautofautisha kundi hili na שׂריו.
- source_word: שָׂרָיו
  choice: maofisa wake
  rationale: שׂרים hapa ni viongozi au wenye vyeo katika utawala wa kifalme. ‘Maofisa’ linafaa mazingira hayo bila kulifanya neno kuwa la kijeshi pekee.
- source_word: סָרִיסָיו
  choice: matowashi wake
  rationale: סָרִיס inaweza kumaanisha matowashi hasa au maofisa wa ikulu kwa upana. ‘Matowashi’ linahifadhi maana ya moja kwa moja na kutofautisha neno hili na ‘maofisa,’ huku tanbihi ikitaja maana nyingine inayowezekana.
- source_word: וַיִּקַּח אֹתוֹ
  choice: akamchukua
  rationale: לקח ni kitenzi cha kawaida cha ‘kuchukua.’ Mazingira yanaonyesha kuwekwa chini ya mamlaka ya Babeli, lakini ‘akamchukua’ huepuka kuongeza waziwazi ‘akamkamata.’
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: katika mwaka wa nane wa utawala wake
  rationale: Muundo huu unaonyesha mwaka wa nane wa kutawala. Kiwakilishi ‘wake’ kinahifadhi namna ya Kiebrania, huku muktadha ukielekeza kwa mfalme wa Babeli.
theological_decisions:
- issue: Mhusika anayerejelewa na ‘utawala wake’ katika taarifa ya mwisho ya wakati
  choice: Utawala wa mfalme wa Babeli
  alternative: Utawala wa Yehoyakini
  rationale: Mfalme wa Babeli ndiye mtangulizi wa karibu wa kisarufi, na mpangilio wa kihistoria wa sura unaafikiana na mwaka wa utawala wa Nebukadneza. Tafsiri inahifadhi kiwakilishi cha Kiebrania badala ya kuingiza jina.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi bila kupoteza mfuatano wa simulizi. ‘Akatoka kwenda’ huhifadhi kitendo cha kutoka bila kukitafsiri moja kwa moja kuwa kusalimu amri.
