base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: sw
  text: Yehoyakini alikuwa na umri wa miaka kumi na minane alipoanza kutawala, naye alitawala kwa miezi mitatu huko Yerusalemu. Jina la mama yake lilikuwa Nehushta, binti ya Elnathani, kutoka Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: alikuwa na umri wa miaka kumi na minane
  rationale: Hii ndiyo namna ya kawaida na ya asili ya kuwasilisha nahau ya Kiebrania inayotaja umri.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo wenye בְּ unaonyesha wakati Yehoyakini alipoingia katika utawala; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: naye alitawala ... kwa miezi mitatu
  rationale: Kitenzi מָלַךְ kimetafsiriwa kwa nguvu yake ya kitendo, na 'kwa miezi mitatu' linaonyesha wazi muda wa utawala.
- source_word: בִּירוּשָׁלָם
  choice: Yerusalemu
  rationale: Katika Kiswahili, kitenzi 'kutawala' kinaweza kufuatiwa moja kwa moja na mahali; maana ya kuwa alitawala akiwa Yerusalemu inabaki wazi.
- source_word: וְשֵׁם אִמּוֹ
  choice: Jina la mama yake lilikuwa
  rationale: Huhifadhi muundo wa taarifa ya ukoo wa Kiebrania kwa Kiswahili cha kawaida na chenye heshima.
- source_word: נְחֻשְׁתָּא
  choice: Nehushta
  rationale: Jina la mtu limetoholewa kwa karibu na umbo la Kiebrania.
- source_word: בַת אֶלְנָתָן
  choice: binti ya Elnathani
  rationale: Mnyororo wa viambata unaonyesha uhusiano wa kifamilia; 'binti ya' ni usemi wa kawaida wa Kiswahili.
- source_word: מִירוּשָׁלָם
  choice: kutoka Yerusalemu
  rationale: Kihusishi מִן kwa msingi wake kinaonyesha asili au mahali alikotoka; tafsiri ya moja kwa moja haileti ugumu katika Kiswahili.
