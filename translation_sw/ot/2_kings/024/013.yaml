id: 2KI.24.13
reference: 2 Kings 24:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: sw
  text: Naye akatoa humo[a] hazina zote za nyumba ya Yahweh na hazina za nyumba ya mfalme, akavikata vipande-vipande vyombo vyote vya dhahabu ambavyo Sulemani, mfalme wa Israeli, alikuwa ametengeneza katika hekalu la Yahweh[b], kama Yahweh alivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akavitoa kutoka humo” au “akachukua kutoka humo.”
    reason: Hifili ya וַיּוֹצֵא ina maana ya kutoa au kuondoa vitu kutoka mahali hapo; tafsiri hizi ni mbadala za Kiswahili zenye maana inayokaribiana.
  - marker: b
    text: Mwanzoni mwa mstari Kiebrania kinasema “nyumba ya Yahweh”; hapa kinatumia neno tofauti, linalorejelea hasa jengo la hekalu au patakatifu.
    reason: Kueleza tofauti ya kileksia kati ya בֵּית na הֵיכַל iliyohifadhiwa katika tafsiri.
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: akatoa humo
  rationale: Hifili ya יצא inaonyesha kusababisha vitu vitoke mahali; “akatoa humo” ni ya asili katika Kiswahili na inadumisha maana ya kuondoa hazina kutoka humo bila kuongeza namna zilivyosafirishwa.
- source_word: אוֹצְרוֹת
  choice: hazina
  rationale: Katika muktadha huu neno linarejelea mali za thamani zilizochukuliwa, si hasa vyumba vya kuzihifadhia.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Tafsiri hii ya karibu inadumisha sitiari ya “nyumba” na kuweka tofauti ya kileksia na הֵיכַל baadaye katika mstari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa Tetragramatoni linawakilishwa moja kwa moja kama “Yahweh.”
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Tafsiri ya karibu inadumisha ulinganifu na “nyumba ya Yahweh”; kwa muktadha maana yake ni makao ya kifalme.
- source_word: וַיְקַצֵּץ
  choice: akavikata vipande-vipande
  rationale: Pieli ya קצץ inaeleza kukata vitu viwe vipande; usemi huu wa Kiswahili unaonyesha kitendo halisi kwa uwazi.
- source_word: כְּלֵי הַזָּהָב
  choice: vyombo vya dhahabu
  rationale: כְּלִי ni neno pana la vifaa au vyombo; “vyombo” linafaa kwa vitu vya matumizi ya hekaluni bila kuvifanya mahususi kupita chanzo.
- source_word: עָשָׂה
  choice: alikuwa ametengeneza
  rationale: Muundo huu unaonyesha kuwa utengenezaji wa Sulemani ulitangulia kitendo cha baadaye cha kuvunjwa kwa vyombo.
- source_word: בְּהֵיכַל יְהוָה
  choice: katika hekalu la Yahweh
  rationale: הֵיכַל hapa ni jengo au patakatifu pa hekalu; “hekalu” ni ya kawaida na pia inadumisha tofauti na בֵּית iliyotafsiriwa “nyumba” mapema.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: sawasawa na Yahweh alivyokuwa amesema
  rationale: Usemi huu unaonyesha kutimia kwa neno la Yahweh lililotangulia; “sawasawa na” inadumisha ulinganifu huo.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Tofauti kati ya בֵּית יְהוָה na הֵיכַל יְהוָה
  choice: “nyumba ya Yahweh” kisha “hekalu la Yahweh”
  alternative: Kutafsiri yote mawili kuwa “hekalu la Yahweh”
  rationale: Maneno mawili tofauti ya Kiebrania yametumika; kuyatofautisha kunahifadhi mtindo na upeo wa chanzo bila kudai tofauti ya kiteolojia isiyoelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi umetunzwa kwa vitenzi vinavyofuatana (“akatoa … akavikata”), huku koma zikisaidia kutambulisha cheo cha Sulemani. Kila alama ya tanbihi imewekwa katika matini kuu.
