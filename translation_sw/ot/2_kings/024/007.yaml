base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: sw
  text: Naye mfalme wa Misri hakutoka tena nchini mwake, kwa sababu mfalme wa Babeli alikuwa ametwaa yote yaliyokuwa ya mfalme wa Misri, kuanzia Kijito cha Misri[a] hadi Mto Frati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wadi wa Misri.” Neno la Kiebrania linaweza kumaanisha mkondo wa maji wa msimu au kijito; hapa si lazima limaanishe mto mkubwa, na halipaswi kuchanganywa na Mto Naili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: hakutoka tena
  rationale: 'Muundo wa הוסיף pamoja na kitenzi-jina, ukiwa na לא na עוד, unaonyesha kukoma kwa tendo: hakutoka tena. Kiswahili hiki ni cha kawaida na hakiongezi wazi maana ya kijeshi ambayo muktadha unaweza kudokeza.'
- source_word: מֵאַרְצוֹ
  choice: katika nchi yake
  rationale: Neno אֶרֶץ hapa ni nchi au eneo la utawala wake; 'katika nchi yake' linaonyesha mahali alipotoka bila kulazimisha maana finyu ya ardhi binafsi.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי inaanzisha sababu ya mfalme wa Misri kutotoka tena.
- source_word: לָקַח
  choice: alikuwa ametwaa
  rationale: לקח ni 'chukua/twaa.' Hali timilifu 'alikuwa ametwaa' huonyesha kuwa kutwaa huko kulitangulia hali ya mfalme wa Misri kutotoka tena; 'twaa' pia inafaa katika muktadha wa kisiasa na kijeshi.
- source_word: מִנַּחַל מִצְרַיִם
  choice: kuanzia Kijito cha Misri
  rationale: נַחַל kwa kawaida ni kijito, bonde la mto wa msimu, au mkondo wa maji, si lazima mto mkubwa wa kudumu. 'Kijito cha Misri' ni wazi kwa wasomaji na huepuka kukichanganya na Naili.
- source_word: עַד נְהַר פְּרָת
  choice: hadi Mto Frati
  rationale: נְהַר ni mto na פְּרָת ni Frati; 'Mto Frati' ni jina la kawaida katika Kiswahili.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: kila kitu kilichokuwa cha mfalme wa Misri
  rationale: Tafsiri hii huhifadhi upana wa kishazi cha Kiebrania bila kukifinya kuwa ardhi pekee, ingawa mipaka inayotajwa inaonyesha hasa maeneo yaliyokuwa chini ya mamlaka ya Misri.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa urahisi. 'Hakutoka tena' huhifadhi usemi wa jumla wa Kiebrania bila kuongeza moja kwa moja 'kwenda vitani,' na 'alikuwa ametwaa' huweka wazi uhusiano wa wakati na sababu.
