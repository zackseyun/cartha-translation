  to: Naye mfalme wa Misri hakutoka tena nchini mwake, kwa sababu mfalme wa Babeli alikuwa ametwaa yote yaliyokuwa ya mfalme wa Misri, kuanzia Kijito cha Misri[a] hadi Mto Frati.
