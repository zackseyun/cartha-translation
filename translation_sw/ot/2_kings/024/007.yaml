    rationale: 'Hii si tafsiri sahihi ya mbadala ‘Wadi of Egypt’: huweza kumaanisha bonde linalohusiana na mto, ilhali נַחַל hapa yaweza kuwa wadi, mkondo wa msimu, au kijito. «Wadi wa Misri» huhifadhi mbadala bila kudai kwamba ni mto mkubwa.'
