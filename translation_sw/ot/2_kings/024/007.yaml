  verdict: revise
  source_fidelity: 'Tafsiri inafuata kwa usahihi hoja ya Kiebrania: mfalme wa Misri hakuendelea kutoka, kwa kuwa mfalme wa Babeli alikuwa amechukua eneo lote lililokuwa chini yake, kutoka Nahali ya Misri hadi Frati. Hata hivyo, «katika nchi yake» haionyeshi wazi kihusishi מִן, ‘kutoka’; «nchini mwake» ni sahihi zaidi. Tanbihi ya sasa pia hailingani na mbadala ‘Wadi of Egypt,’ kwa kuwa «Bonde la Mto wa Misri» huashiria bonde la mto badala ya mkondo/bondi kavu wa msimu.'
  naturalness: «Hakutoka tena nchini mwake» ni Kiswahili Sanifu cha kawaida na kinahifadhi usemi wa jumla bila kuongeza ‘kwenda vitani.’ «Yote yaliyokuwa ya mfalme wa Misri» husikika kwa urahisi na hudumisha upana wa כֹּל אֲשֶׁר.
  terminology: «Kijito cha Misri» ni tafsiri salama katika maandishi makuu kwa נַחַל מִצְרַיִם, na «Mto Frati» ni jina linalotambulika. Tanbihi irejeshe uwezekano wa ‘wadi’ kwa neno sahihi la Kiswahili, «Wadi wa Misri»; si lazima itambulishe mahali hapa na Naili.
