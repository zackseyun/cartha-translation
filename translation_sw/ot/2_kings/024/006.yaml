base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: sw
  text: Kisha Yehoyakimu akalala pamoja na mababu zake[a], na Yehoyakini mwanawe akawa mfalme mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufafanua maana, “akafa.” Kiebrania kinasema kihalisi “akalala pamoja na mababu zake,” fomula ya kawaida inayotaja kifo cha mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Katika muundo huu wa kifalme, kitenzi hiki ni nahau ya kifo. Kutafsiri ‘akalala’ kunahifadhi taswira ya Kiebrania bila kuifafanua kimyakimya kuwa ‘alikufa.’
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: ‘Mababu’ huwasilisha maana ya waliomtangulia katika ukoo kwa Kiswahili cha kawaida na inaungana kiasili na nahau ‘akalala pamoja na.’
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Hapa kitenzi kinaonyesha kuingia madarakani, si tu kipindi cha kutawala; ‘akawa mfalme’ huonyesha mrithi kuchukua ufalme.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Ni tafsiri ya moja kwa moja ya uhusiano wa mwana na baba, na muundo huu ni wa kawaida katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa urithi wa kiti cha enzi, usemi huu unaonyesha kuchukua nafasi ya mtawala aliyetangulia.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: Yehoyakimu / Yehoyakini
  rationale: Majina yamenakiliwa kwa tahajia inayolingana na matamshi na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
theological_decisions:
- issue: Kutafsiri fomula ya kifalme ya kifo bila kuongeza habari kuhusu mazishi
  choice: Nahau ‘akalala pamoja na mababu zake’ imehifadhiwa katika matini kuu.
  alternative: ‘Alikufa,’ au ‘alikufa akazikwa pamoja na mababu zake.’
  rationale: Kiebrania kinatumia fomula ya kawaida ya kifo, lakini mstari huu hautaji mazishi waziwazi. Kuhifadhi nahau kunazuia kuingiza habari isiyosemwa na kunadumisha namna ya usemi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Kiashiria cha tanbihi [a] kimewekwa mara moja katika matini kuu.
