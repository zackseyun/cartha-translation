  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: sw
  text: Akafanya yaliyo maovu machoni pa Yahweh, sawasawa na yote ambayo baba yake alikuwa amefanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Qal wayyiqtol ya עשה inaendeleza simulizi; “Akafanya” ni ya kawaida katika mtiririko wa simulizi la Kiswahili na huhifadhi kiunganishi cha Kiebrania kwa ufupi.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Kivumishi chenye kiambishi bainishi kimetumika kama nomino katika kauli ya kawaida ya Wafalme. “Yaliyo maovu” ni Kiswahili cha asili kinachowasilisha maana ya kufanya mambo yaliyotathminiwa kuwa maovu.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi sitiari ya Kiebrania ya kutathmini jambo kwa mtazamo wa mtu, huku ikiwa usemi unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kwa cheo.
- source_word: כְּכֹל
  choice: sawasawa na yote ambayo
  rationale: Huwasilisha ulinganisho pamoja na nguvu ya ujumla ya כֹּל, yaani matendo yote ya baba yake yanatumika kama kielelezo.
- source_word: עָשָׂה
  choice: alikuwa amefanya
  rationale: Qatal inaeleza matendo ya baba yaliyotangulia utawala na matendo ya mwana; wakati timilifu uliopita unaonyesha vizuri uhusiano huo wa wakati.
- source_word: אָבִיו
  choice: baba yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina binafsi la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya masimulizi ya kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “machoni pa Yahweh” umehifadhi kwa makusudi nahau ya chanzo; hakuna tanbihi inayohitajika.
