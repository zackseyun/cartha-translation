base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: sw
  text: Alifanya yaliyo maovu machoni pa Yahweh, sawasawa na yote aliyokuwa amefanya Yehoyakimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Alifanya
  rationale: Kitenzi cha usimulizi kinaendeleza simulizi; Kiswahili hakihitaji kutaja kiunganishi cha mwanzo ili maana ibaki ya kawaida.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Usemi huu wa Kiebrania unamaanisha kufanya mambo yaliyo maovu, si kitu maalumu kinachoitwa ‘uovu’; tafsiri hii ni ya kawaida na huhifadhi tathmini ya kimaadili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi sitiari ya Kiebrania inayoonyesha tathmini kutoka kwa mtazamo wa Yahweh, huku ikiwa usemi wa Kiswahili unaoeleweka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililo katika maandishi limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: כְּכֹל אֲשֶׁר
  choice: sawasawa na yote
  rationale: Huhifadhi wazo la ulinganifu kamili na mwenendo wote wa Yehoyakimu kwa Kiswahili cha kawaida.
- source_word: עָשָׂה
  choice: aliyokuwa amefanya
  rationale: Muundo huu unaonyesha kwa kawaida kwamba matendo ya Yehoyakimu yalitangulia matendo ya mhusika wa sasa, bila kudai kwamba hali hiyo ya wakati imebainishwa kisarufi kwa lazima katika Kiebrania.
- source_word: יְהוֹיָקִים
  choice: Yehoyakimu
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya majina ya Biblia katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi; ‘Yahweh’ hulihifadhi badala ya kulibadilisha na cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi ‘machoni pa Yahweh’ unahifadhi taswira ya Kiebrania; sentensi ni fupi na wazi kwa msomaji wa kawaida.
