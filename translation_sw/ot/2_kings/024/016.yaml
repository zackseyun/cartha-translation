base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: sw
  text: Aliwachukua watu wote hodari, elfu saba, pamoja na mafundi na wahunzi[a], elfu moja—wote mashujaa wenye uwezo wa kupigana vita[b]. Mfalme wa Babeli akawapeleka uhamishoni Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundi stadi na wafanyakazi wa metali.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “watendao vita,” yaani, watu wenye uwezo wa kufanya huduma ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: watu hodari
  rationale: Kirai hiki kinamaanisha watu wenye nguvu na uwezo, hasa waliofaa kwa matumizi ya kijeshi. “Watu hodari” ni cha asili katika Kiswahili na hakizidishi maana kuwa tayari walikuwa wanajeshi rasmi.
- source_word: שִׁבְעַת אֲלָפִים
  choice: elfu saba
  rationale: Hii ni idadi ya moja kwa moja ya kundi la watu hodari.
- source_word: הֶחָרָשׁ
  choice: mafundi
  rationale: Neno hili humaanisha wafanyakazi stadi katika ufundi mbalimbali; “mafundi” huhifadhi upana huo bila kutaja aina moja tu ya kazi.
- source_word: הַמַּסְגֵּר
  choice: wahunzi
  rationale: Huenda neno hili linarejelea wahunzi au wafanyakazi wa metali. “Wahunzi” ni neno fupi, linaloeleweka, huku tanbihi ikihifadhi uwezekano mpana zaidi.
- source_word: אֶלֶף
  choice: elfu moja
  rationale: Hii ndiyo jumla iliyotajwa kwa mafundi na wahunzi.
- source_word: הַכֹּל
  choice: wote
  rationale: Neno hili linajumlisha watu waliotajwa kabla yake.
- source_word: גִּבּוֹרִים
  choice: mashujaa
  rationale: Neno hili hueleza watu wenye nguvu na ushujaa, mara nyingi katika muktadha wa kijeshi.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: waliofaa kupigana vita
  rationale: Maana ya neno kwa neno ni “watendao vita,” lakini katika muktadha huu kirai kinaonyesha uwezo wa kufanya huduma ya kijeshi. Tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וַיְבִיאֵם ... גּוֹלָה
  choice: akawapeleka uhamishoni
  rationale: Kitenzi pamoja na nomino inayotumika kielezi kinaonyesha kuwapeleka watu hao wakiwa wahamishwa; Kiswahili hiki kinaeleza tendo na matokeo yake kwa kawaida.
- source_word: בָּבֶלָה
  choice: Babeli
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda Babeli; kitenzi “akawapeleka” tayari kinaonyesha mwelekeo huo kwa Kiswahili.
