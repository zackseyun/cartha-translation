translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa makundi na idadi umehifadhiwa, huku istilahi za kazi na uwezo wa kijeshi zikitafsiriwa bila kuzibana kuliko Kiebrania.
