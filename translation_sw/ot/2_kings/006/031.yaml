  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: sw
  text: Naye akasema, “Mungu anitendee hivi, na zaidi ya hivi, ikiwa kichwa cha Elisha mwana wa Shafati kitabaki juu yake leo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kihalisi, Kiebrania: “ikiwa kichwa cha Elisha mwana wa Shafati kitasimama juu yake leo”—yaani, ikiwa kichwa cha Elisha kitabaki juu ya mwili wake leo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: Mungu na anitende hivi, na azidi kufanya hivyo
  rationale: Hii ni kauli maalumu ya Kihebrania ya kiapo kinachojiletea laana. Tafsiri hii inadumisha nguvu ya kiapo na kutotaja wazi adhabu inayokusudiwa, huku ikiwa ya kueleweka katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno ni la wingi, hapa linamtaja Mungu mmoja na linaambatana na maana ya kitenzi cha umoja katika kauli hii ya kiapo.
- source_word: אִם
  choice: ikiwa
  rationale: Katika viapo, neno hili linaweza kudokeza kiapo hasi, yaani ‘hakika ... hatabaki.’ Kulihifadhi kama ‘ikiwa’ kunadumisha muundo wa Kihebrania na hali ya kiapo chenye sharti.
- source_word: יַעֲמֹד
  choice: kitabaki
  rationale: Maana ya msingi ni ‘kusimama,’ lakini katika tishio hili la kukata kichwa maana yake ni kichwa kuendelea kuwa mwilini. ‘Kitabaki’ huwasilisha maana hiyo bila kupanua sana.
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: kichwa cha Elisha mwana wa Shafati
  rationale: Muundo huu unabaki karibu na mnyororo wa umilikaji wa Kihebrania na kuhifadhi ukali wa tishio.
- source_word: עָלָיו
  choice: juu yake
  rationale: Kiwakilishi humrejelea Elisha. Tafsiri ya moja kwa moja ‘juu yake’ huhifadhi usemi mfupi na wa picha wa Kihebrania; maana ya ‘juu ya mwili wake’ inaelezwa katika tanbihi.
- source_word: הַיּוֹם
  choice: leo
  rationale: ‘Leo’ ni Kiswahili cha kawaida na cha sasa kinachohifadhi uharaka wa kiapo cha mfalme.
theological_decisions:
- issue: Mrejelewa na nguvu ya kauli ya kiapo
  choice: 'Kiapo cha kujilaani mbele za Mungu: msemaji anajitakia hukumu ya Mungu ikiwa Elisha hatawauawa siku hiyo.'
  alternative: Kauli ya hasira isiyo kiapo kamili.
  rationale: Kauli hii ni mfumo unaojulikana wa kiapo cha kifalme katika Biblia ya Kiebrania; kwa hiyo nguvu yake ya kiapo haipaswi kupunguzwa kuwa mshangao wa hasira tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiapo umehifadhiwa kwa ukaribu, na tanbihi inafafanua taswira ya Kiebrania bila kuiondoa katika matini kuu.
