  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: sw
  text: Lakini mmoja wa watumishi wake akasema, “Hapana, bwana wangu, mfalme. Bali Elisha, nabii aliye katika Israeli, humwambia mfalme wa Israeli maneno unayosema katika chumba chako cha kulala.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא ... כִּי
  choice: Sivyo ... Bali
  rationale: Muundo huu wa Kiebrania unakanusha dhana iliyotangulia na kuleta maelezo sahihi; ‘Sivyo ... Bali’ ni wa kawaida na wazi katika Kiswahili.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Inahifadhi namna ya heshima ya kumwendea mfalme bila kuongeza cheo kisichokuwamo katika chanzo.
- source_word: יַגִּיד
  choice: humwambia
  rationale: Hali ya kitenzi katika muktadha inaonyesha jambo linalotendeka kwa kawaida; ‘humwambia’ linafikisha maana hiyo kwa Kiswahili cha asili.
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: katika chumba chako cha kulala
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali pa faragha panapotajwa katika Kiebrania.
