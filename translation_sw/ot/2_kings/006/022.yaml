  text: וַ/יֹּ֨אמֶר֙ לֹ֣א תַכֶּ֔ה הַ/אֲשֶׁ֥ר שָׁבִ֛יתָ בְּ/חַרְבְּ/ךָ֥ וּֽ/בְ/קַשְׁתְּ/ךָ֖ אַתָּ֣ה מַכֶּ֑ה שִׂים֩ לֶ֨חֶם וָ/מַ֜יִם לִ/פְנֵי/הֶ֗ם וְ/יֹֽאכְלוּ֙ וְ/יִשְׁתּ֔וּ וְ/יֵלְכ֖וּ אֶל אֲדֹנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: sw
  text: Lakini akasema, “Usiwaue. Je, ungeua wale uliowateka kwa upanga wako na upinde wako?[a] Weka mbele yao mkate na maji[b], ili wale, wanywe, kisha waende kwa bwana wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, huwaua wale uliowateka kwa upanga wako na upinde wako?” Maneno ya Kiebrania ni swali la balagha linalotilia mkazo amri ya kutowaua.
    reason: alternative_reading
  - marker: b
    text: “Mkate na maji” huenda ikawa njia ya kusema mahitaji ya msingi ya chakula na kinywaji, lakini Kiebrania kinavitaja vitu hivi moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: usiwaue / ungeua
  rationale: Katika muktadha huu נכה ina maana ya kuwapiga hadi kuwaua au kuwaua. ‘Kuua’ linaweka wazi kwamba mfalme anakatazwa kuwaua mateka, huku kurudiwa kwa kitenzi katika amri na swali la balagha kukihifadhiwa.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: wale uliowateka
  rationale: Kitenzi שבה ni kuteka watu vitani na kuwafanya mateka; ‘uliowateka’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kijeshi.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: kwa upanga wako na upinde wako
  rationale: Silaha zote mbili zimetajwa wazi na ni sehemu ya hoja kwamba hawa hawakuwa mateka ambao mfalme aliwapata kwa ushindi wake mwenyewe.
- source_word: שִׂים
  choice: Wekeni
  rationale: Amri hii inaelekezwa kwa mfalme kwa maana ya kuagiza maandalizi yafanywe. Wingi wa heshima katika Kiswahili unaepuka sauti isiyo ya kawaida ya kumwamuru mfalme binafsi aweke chakula, bila kubadili maana ya msingi.
- source_word: לֶחֶם וָמַיִם
  choice: mkate na maji
  rationale: Tafsiri hii inahifadhi vitu viwili vilivyotajwa moja kwa moja katika Kiebrania, badala ya kuvitanua kimya kimya kuwa ‘chakula na maji.’
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Hii ni nahau ya kawaida ya Kiswahili kwa kuwaandalia watu chakula na kukiweka mahali pao.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: ili wale, wanywe, kisha waende
  rationale: ‘Ili’ linaonyesha kusudi au matokeo yaliyokusudiwa baada ya amri; ‘kisha’ linaonyesha kwa kawaida mfuatano wa kula, kunywa, na kuondoka.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: kwa bwana wao
  rationale: Umbo אֲדֹנֵיהֶם linaweza kumtaja mwenye mamlaka juu yao; katika simulizi hili linaeleweka kwa kawaida kuwa mtawala au mkuu wao mmoja, yaani mfalme wa Aramu. ‘Bwana wao’ huhifadhi maana ya mamlaka bila kuongeza cheo kisichotajwa hapa.
theological_decisions:
- issue: Nguvu ya swali la Elisha kuhusu kuwaua mateka
  choice: Limetafsiriwa kama swali la balagha linalosisitiza katazo la kuwaua, hasa kwa kuwa mfalme hakuwateka kwa silaha zake mwenyewe.
  alternative: Kulitafsiri kama kauli tambarare, au kulifanya kuwa kanuni pana kuhusu kila mfungwa wa vita.
  rationale: Kiambishi cha swali katika Kiebrania na mtiririko baada ya ‘Usiwaue’ vinaunga mkono swali la balagha. Tafsiri haipanui mstari huu kuwa sheria ya jumla isiyotamkwa.
- issue: Rejeo la אֲדֹנֵיהֶם
  choice: bwana wao
  alternative: mabwana wao / wakuu wao
  rationale: Ingawa nomino ina umbo la wingi, אֲדֹנִים hutumiwa pia kumrejelea bwana mmoja, na muktadha unaelekea kwa mfalme wa Aramu. Uwezekano wa maana ya mamlaka kwa ujumla unatambuliwa bila kuingiza utambulisho wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. ‘Usiwaue’ linafaa zaidi kuliko ‘usiwapige’ kwa sababu muktadha ni ombi la mfalme la kuwaua watu hawa. Swali la balagha limehifadhiwa bila kulifanya fundisho pana lisilotajwa katika mstari.
