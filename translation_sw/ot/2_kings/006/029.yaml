base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: sw
  text: Basi tulimchemsha mwanangu na tukamla.[a] Siku iliyofuata nikamwambia, ‘Mtoe mwanao ili tumle,’[b] lakini akamficha mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tulimpika mwanangu na tukamla.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na tutamla.” Umbo la Kiebrania linaweza kueleweka kwa urahisi zaidi kuwa la wakati ujao, ingawa muktadha baada ya “Mtoe mwanao” unaunga mkono maana ya kusudi au matokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: tukamtokosa
  rationale: Kitenzi בשׁל hapa kina maana ya kupika kwa kuchemsha. ‘Kumtokosa’ ni usemi wa Kiswahili unaoonyesha njia hiyo mahususi ya kupika na kudumisha ukali wa simulizi.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Neno בן linamaanisha mwana wa kiume hapa, na kiambishi tamati kinaonyesha kuwa ni mwana wa msemaji.
- source_word: וַנֹּאכְלֵהוּ
  choice: na tukamla
  rationale: Kitenzi אכל ni ‘kula’; kiambishi cha yambwa cha kiume kimedumishwa katika ‘-m-’, na muundo wa Kiswahili unaonyesha wazi mhusika wa wingi.
- source_word: וָאֹמַר אֵלֶיהָ
  choice: nikamwambia
  rationale: Muundo wa masimulizi unaendeleza mfuatano wa matukio; ‘nikamwambia’ ni wa asili na hujumuisha maana ya ‘nilisema kwake’.
- source_word: בַּיּוֹם הָאַחֵר
  choice: Siku iliyofuata
  rationale: Nahau hii inaonyesha siku iliyokuja baada ya tukio la kwanza.
- source_word: תְּנִי
  choice: Mtoe
  rationale: Ingawa נתן kwa msingi ni ‘toa/peana’, katika muktadha huu ‘mtoe mwanao’ ni amri ya kawaida ya Kiswahili ya kumkabidhi au kumleta mwana huyo ili achukuliwe.
- source_word: בְּנֵךְ
  choice: mwanao
  rationale: בן ni mwana wa kiume, na kiambishi cha nafsi ya pili ya kike kinaonyesha mwana wa mwanamke anayesemeshwa.
- source_word: וְנֹאכְלֶנּוּ
  choice: ili tumle
  rationale: Imperfecti iliyo na kiunganishi baada ya amri inaweza kuonyesha kusudi au matokeo yaliyokusudiwa; ‘ili tumle’ huwasilisha maana hiyo bila kuficha uwezekano wa kuielewa kama kauli ya wakati ujao.
- source_word: וַתַּחְבִּא
  choice: lakini akamficha
  rationale: Waw ya Kiebrania inaweza kuwa ‘na’, lakini muktadha unaonyesha tendo linalokwenda kinyume na ombi; ‘lakini’ huweka wazi utofauti huo wa kimasimulizi.
- source_word: בְּנָהּ
  choice: mwanawe
  rationale: בן pamoja na kiambishi cha nafsi ya tatu ya kike ni ‘mwanawe’; neno la undugu na jinsia ya mwana vimedumishwa.
