base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: sw
  text: Wana wa manabii[a] wakamwambia Elisha, “Tazama, tafadhali, kwamba mahali tunapoishi mbele yako[b] ni finyu mno kwetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jumuiya ya manabii” au “wanafunzi wa manabii.” Nahau ya Kiebrania “wana wa manabii” inaelekea kurejelea jumuiya ya kinabii iliyokuwa chini ya mafundisho au uangalizi fulani.
    reason: lexical_alternative
  - marker: b
    text: Huenda pia ikamaanisha “chini ya uangalizi wako.” Usemi “mbele yako” unaweza kuonyesha kwamba waliishi chini ya usimamizi wa Elisha, wala si kwamba walikuwa mbele yake kimahali tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: wana wa manabii
  rationale: Huhifadhi nahau ya Kiebrania kwa uwazi, huku tanbihi ikieleza kwamba inaelekea kumaanisha jumuiya au wanafunzi wa kinabii, si lazima watoto wa kuzaa.
- source_word: הִנֵּה נָא
  choice: Tafadhali, tazama
  rationale: “Tazama” huvuta fikira kama הִנֵּה, na “tafadhali” huwasilisha nguvu ya ombi lenye upole ya נָא.
- source_word: הַמָּקוֹם
  choice: mahali
  rationale: Ni neno pana na la kawaida linaloacha wazi kama panazungumziwa makao, eneo la kukutania, au aina nyingine ya mahali.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: tunapoishi mbele yako
  rationale: “Tunapoishi” hutoa maana ya ukaaji ya יָשַׁב katika muktadha huu. “Mbele yako” huhifadhi uwezekano wa kuwapo mbele ya Elisha au kuwa chini ya uangalizi wake. שָׁם haijatafsiriwa kando kwa sababu maana yake imejumuishwa kwa kawaida katika muundo wa “mahali tunapoishi.”
- source_word: צַר מִמֶּנּוּ
  choice: ni finyu mno kwetu
  rationale: “Finyu” huwasilisha maana ya nafasi nyembamba au iliyosongamana, na “mno kwetu” huonyesha kwamba nafasi hiyo haitoshi kwao.
- source_word: וַיֹּאמְרוּ
  choice: wakamwambia
  rationale: Muundo wa “waka-” unaendeleza simulizi kwa kawaida katika Kiswahili bila kuongeza neno la wakati lisilokuwapo wazi katika chanzo.
theological_decisions:
- issue: Uhusiano wa “wana wa manabii” na Elisha
  choice: Nahau imehifadhiwa kama “wana wa manabii,” huku tanbihi ikitaja jumuiya au wanafunzi wa kinabii.
  alternative: “Wanafunzi wa manabii” au “jumuiya ya manabii.”
  rationale: Chanzo hakifafanui kabisa aina rasmi ya uhusiano wao; hivyo tafsiri haipaswi kuamua kimya-kimya kwamba walikuwa wanafunzi kwa maana maalumu tu.
- issue: Maana ya לְפָנֶיךָ
  choice: mbele yako
  alternative: chini ya uangalizi wako
  rationale: Usemi unaweza kuonyesha kuwapo mbele ya Elisha au kuishi chini ya usimamizi wake. Tafsiri kuu huhifadhi mvutano huo, na tanbihi inaeleza uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Finyu mno” ni ya kawaida lakini bado ina uzito unaofaa matini ya Biblia. Alama zote za tanbihi zimewekwa kwenye sehemu husika za matini.
