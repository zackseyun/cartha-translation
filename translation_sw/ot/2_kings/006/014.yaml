  text: וַ/יִּשְׁלַח שָׁ֛מָּ/ה סוּסִ֥ים וְ/רֶ֖כֶב וְ/חַ֣יִל כָּבֵ֑ד וַ/יָּבֹ֣אוּ לַ֔יְלָה וַ/יַּקִּ֖פוּ עַל הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/014.yaml
  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: sw
  text: Basi akatuma huko farasi, magari ya vita, na jeshi kubwa. Wakaja usiku na kuuzingira mji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Wayyiqtol ya שׁלח inaendeleza simulizi kwa tendo lililofuata; “akatuma” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: שָׁמָּה
  choice: huko
  rationale: Kielezi hiki huonyesha mahali panapolengwa, palipotajwa katika muktadha uliotangulia; “huko” ni kifupi na cha kawaida.
- source_word: סוּסִים
  choice: farasi
  rationale: Nomino hii hutaja farasi moja kwa moja. Ingawa muktadha ni wa kijeshi, hakuna haja ya kuibadili kuwa “wapanda farasi.”
- source_word: וְרֶכֶב
  choice: magari ya vita
  rationale: רֶכֶב hapa hurejelea magari ya kijeshi; “magari ya vita” huweka wazi maana kwa msomaji wa kisasa bila kutumia istilahi isiyo ya kawaida.
- source_word: וְחַיִל כָּבֵד
  choice: jeshi kubwa
  rationale: Katika muktadha wa kijeshi, חַיִל ni jeshi au kikosi, na כָּבֵד, kwa maana ya nahau, huonyesha ukubwa au nguvu kubwa. “Jeshi kubwa” ni wazi na la asili.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: Wakaja usiku
  rationale: Kirai hiki hueleza kwamba walifika wakati wa usiku; “wakaja usiku” ni cha moja kwa moja na kinaendeleza mtiririko wa simulizi.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: na kuuzingira mji
  rationale: Kitenzi hiki kina maana ya kuzunguka au kuzingira. Katika tukio la kijeshi, “kuuzingira mji” hutoa maana iliyo wazi na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. Muundo umehifadhi picha halisi za farasi na magari ya vita, huku nahau וְחַיִל כָּבֵד ikitolewa kwa maana yake ya kawaida kama “jeshi kubwa.” Hakuna tanbihi inayohitajika kwa kuwa mbadala wa “kikosi kikubwa” hauongezi utata muhimu katika aya hii.
