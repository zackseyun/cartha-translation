  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: sw
  text: Mtumishi wa mtu wa Mungu alipoamka asubuhi na mapema na kutoka nje, kumbe jeshi lenye farasi na magari ya vita lilikuwa limeuzingira mji. Mtumishi wake[a] akamwambia, “Ole, bwana wangu! Tutafanya nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha “kijana,” “mtumishi,” au “mhudumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: alipoamka asubuhi na mapema
  rationale: Muundo huu unaonyesha kuamka au kuanza shughuli mapema. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi wazo la wakati wa mapema.
- source_word: מְשָׁרֵת
  choice: mtumishi
  rationale: Neno hili humaanisha mtu anayemhudumia mwingine katika nafasi ya kibinafsi au rasmi. “Mtumishi” linafaa katika simulizi hili.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hiki ni cheo cha kawaida cha kinabii katika Agano la Kale; tafsiri ya moja kwa moja huhifadhi uhusiano wake na matumizi mengine ya Biblia.
- source_word: וַיֵּצֵא
  choice: kutoka nje
  rationale: Hueleza mwendo wa mtumishi kutoka ndani kwenda nje na ni usemi wa asili katika Kiswahili.
- source_word: וְהִנֵּה
  choice: kumbe
  rationale: Katika muktadha huu neno linaonyesha jambo lililoonekana ghafla na kwa mshangao. “Kumbe” huhifadhi ugunduzi huo kwa Kiswahili cha kawaida.
- source_word: חַיִל
  choice: jeshi
  rationale: Katika muktadha wa kijeshi, neno hili linamaanisha kikosi chenye silaha; “jeshi” ni wazi na la kawaida.
- source_word: סוֹבֵב
  choice: lilikuwa limeuzingira
  rationale: Hali ya kuzingirwa ilikuwa tayari inaendelea mtumishi alipotoka nje. Muundo huu huwasilisha hali aliyokuta bila kuifanya kuwa tukio jipya.
- source_word: וְסוּס וָרָכֶב
  choice: lenye farasi na magari ya vita
  rationale: Farasi na magari ya vita vinaeleza vifaa na nguvu za jeshi. “Magari ya vita” hutofautisha רֶכֶב na magari ya kawaida ya kisasa.
- source_word: נַעֲרוֹ
  choice: mtumishi wake
  rationale: נַעַר linaweza kumaanisha kijana, mtumishi, au mhudumu. Kwa kuwa mtu huyo tayari ametambulishwa kama מְשָׁרֵת, “mtumishi wake” huweka rejeo wazi huku tanbihi ikihifadhi upana wa neno.
- source_word: אֲהָהּ
  choice: Ole
  rationale: Ni mshangao wa hofu na dhiki. “Ole” lina uzito unaofaa bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa ni namna ya heshima ambayo mtumishi anamwita mkuu wake, wala si jina la Mungu.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: Tutafanya nini?
  rationale: Hili ndilo swali la asili katika Kiswahili kwa mtu anayehangaika kuhusu hatua ya kuchukua.
