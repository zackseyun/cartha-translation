translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. “Kumbe” hudumisha mshangao wa וְהִנֵּה kwa njia ya asili, na “magari ya vita” huepuka utata wa neno “magari” pekee.
