source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: sw
  text: Ndipo mtu wa Mungu akatuma ujumbe kwa mfalme wa Israeli, akisema, “Jihadhari usipite mahali hapa, kwa sababu Waaramu wanateremka huko.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waaramu wanashuka huko.”
    reason: Njia nyingine ya kutafsiri נְחִתִּים, ambayo inaeleza mwendo wa kushuka.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma ujumbe
  rationale: Kitenzi chenyewe ni ‘akatuma’, lakini kitu kilichotumwa hakitajwi wazi; muktadha unaonyesha kuwa mtu wa Mungu alituma ujumbe. Kiswahili cha kawaida kinahitaji kuonyesha hilo bila kuongeza habari isiyodokezwa na maandishi.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ndilo jina la cheo lililotumiwa katika Kiebrania; limehifadhiwa badala ya kufasiriwa kuwa ‘nabii’.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Tafsiri ya moja kwa moja ya cheo cha kifalme na jina la taifa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Namna ya kawaida ya Kiswahili ya kuanzisha maneno ya moja kwa moja katika simulizi.
- source_word: הִשָּׁמֶר
  choice: Jihadhari
  rationale: Amri hii ina nguvu ya onyo; ‘Jihadhari’ ni ya asili, yenye heshima, na inafaa pamoja na muundo unaofuata.
- source_word: מֵעֲבֹר
  choice: usipite
  rationale: Baada ya הִשָּׁמֶר na kihusishi מִן, maana ni kujiepusha na kupita katika au karibu na mahali hapo. ‘Usipite’ huwasilisha onyo hilo kwa uwazi.
- source_word: הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya kirai cha kuonyesha mahali.
- source_word: כִּי שָׁם
  choice: kwa sababu ... huko
  rationale: כִּי inaeleza sababu ya onyo, na שָׁם inaonyesha mahali pa mwendo wa Waaramu.
- source_word: אֲרָם
  choice: Waaramu
  rationale: Katika muktadha huu wa kijeshi, jina Aramu linawarejelea watu au jeshi la Aramu; ‘Waaramu’ huepuka jina la baadaye ‘Wasiria’.
- source_word: נְחִתִּים
  choice: wanateremka
  rationale: Kauli hii ya hali inatokana na mzizi wenye maana ya kushuka au kuteremka. Wakati wa sasa unaoendelea unafaa kwa onyo kuhusu mwendo wa adui.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Ndipo’ huendeleza mfululizo wa simulizi, na ‘Jihadhari usipite’ hutoa onyo kwa njia ya asili bila kupunguza nguvu yake.
