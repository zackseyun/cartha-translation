  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: sw
  text: Mfalme akamwambia, “Una shida gani?” Naye akasema, “Mwanamke huyu aliniambia, ‘Mtoe mwanao ili tumle leo, na kesho tutamla mwanangu.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָךְ
  choice: Una shida gani?
  rationale: Nahau hii inauliza tatizo au jambo lililompata mtu; tafsiri hii ni ya kawaida na wazi katika Kiswahili sanifu.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: Mtoe mwanao
  rationale: Kitenzi נתן hapa kina maana ya kumkabidhi au kumtoa mwana kwa kusudi linalofuata; “mtoe” ni cha asili katika muktadha huu.
- source_word: וְנֹאכְלֶנּוּ
  choice: ili tumle
  rationale: Waw ya Kiebrania inaonyesha kusudi au matokeo baada ya agizo; “ili” huwasilisha uhusiano huo kwa uwazi.
- source_word: וְאֶת־בְּנִי נֹאכַל מָחָר
  choice: na kesho tutamla mwanangu
  rationale: Inahifadhi mpangilio wa wakati na ahadi ya kula mwana wa msemaji siku inayofuata.
