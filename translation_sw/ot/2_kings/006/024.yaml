  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: sw
  text: Ikawa baada ya hayo, Ben-Hadadi, mfalme wa Aramu[a], alikusanya jeshi lake lote[b], akapanda na kuizingira Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Siria”; Kiebrania: “Aramu.”'
    reason: alternative_reading
  - marker: b
    text: Au “majeshi yake yote”; neno la Kiebrania linaweza kumaanisha “kambi” au “jeshi.”
