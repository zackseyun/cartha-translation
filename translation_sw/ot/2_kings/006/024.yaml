lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Ikawa baada ya hayo
  rationale: Inahifadhi mtindo wa Kiebrania wa kuanzisha tukio linalofuata, huku ikiwa Kiswahili cha asili na chenye hadhi.
- source_word: וַיִּקְבֹּץ
  choice: al الا?
  rationale: Kitenzi hiki humaanisha kukusanya au kuwakusanya pamoja; katika muktadha wa kijeshi, “al جمع?” huwasilisha tendo hilo moja kwa moja bila kuongeza maana ya kiufundi ya kuandikisha wanajeshi.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadadi
  rationale: Jina limeandikwa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: “Aramu” linafuata jina la mahali katika Kiebrania badala ya kutumia jina la kimapokeo “Siria.”
- source_word: כָּל מַחֲנֵהוּ
  choice: jeshi lake lote
  rationale: מַחֲנֶה inaweza kumaanisha kambi, jeshi, au majeshi; hapa muktadha wa vita unaonyesha jeshi, na tafsiri hii ni ya kawaida katika Kiswahili.
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Inahifadhi kwa ufupi usemi wa Kiebrania wa kwenda juu kuelekea mahali fulani bila kuongeza kwa wazi wazo la kuandamana kijeshi.
- source_word: וַיָּצַר עַל
  choice: na kuuzingira
  rationale: Kitenzi pamoja na עַל humaanisha kuzingira mji; kauli hii ni sahihi na ya asili katika Kiswahili.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili.
