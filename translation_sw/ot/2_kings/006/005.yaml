  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: sw
  text: Lakini mmoja wao alipokuwa akiangusha boriti[a], chuma cha shoka kikaanguka majini. Akapiga kelele, akasema, “Ole! Bwana wangu, nilikuwa nimekiazima!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “gogo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל
  choice: akiangusha
  rationale: Hifili ya נפל hapa ina maana ya kusababisha boriti au mti uanguke kwa kuukata; ‘akiangusha’ huhifadhi picha ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: הַקּוֹרָה
  choice: boriti
  rationale: קוֹרָה humaanisha boriti au gogo la ujenzi; ‘boriti’ linafaa katika muktadha wa kukata mbao kwa ajili ya jengo.
- source_word: הַבַּרְזֶל
  choice: chuma cha shoka
  rationale: Kiebrania kinasema kihalisi ‘chuma,’ kikimaanisha kwa metonimia sehemu ya chuma ya shoka. ‘Chuma cha shoka’ kinaeleweka wazi bila kuondoa taswira ya asili.
- source_word: וַיִּצְעַק
  choice: akapaza sauti
  rationale: Huwasilisha kilio cha ghafla cha mtu aliyeshtuka na kufadhaika.
- source_word: אֲהָהּ
  choice: Ole wangu
  rationale: Ni mshangao wa huzuni au fadhaa; ‘Ole wangu’ ni wa heshima na wa kawaida katika simulizi la kibiblia.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya kumwita Elisha kama mkuu au mwalimu, bila kumtambua hapa kuwa Mungu.
- source_word: שָׁאוּל
  choice: Nilikuwa nimeazima
  rationale: Neno linaonyesha kuwa kifaa hicho kilikuwa cha kuazimwa. Kiswahili hutaja mhusika aliyekiazima kwa kawaida zaidi kuliko kusema kifaa ‘kilikuwa kimeazimwa.’
