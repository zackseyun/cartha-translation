translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi zinaendeleza kasi ya simulizi; ‘bwana wangu’ inaonyesha heshima kwa Elisha, na ‘chuma cha shoka’ hufafanua metonimia ya Kiebrania huku ikiendelea kusisitiza sehemu ya chuma.
