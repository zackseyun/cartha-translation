  text: וַ/יִּתְפַּלֵּ֤ל אֱלִישָׁע֙ וַ/יֹּאמַ֔ר יְהוָ֕ה פְּקַח נָ֥א אֶת עֵינָ֖י/ו וְ/יִרְאֶ֑ה וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵינֵ֣י הַ/נַּ֔עַר וַ/יַּ֗רְא וְ/הִנֵּ֨ה הָ/הָ֜ר מָלֵ֨א סוּסִ֥ים וְ/רֶ֛כֶב אֵ֖שׁ סְבִיבֹ֥ת אֱלִישָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: sw
  text: Ndipo Elisha akaomba, akisema, “Ee Yahwe[a], tafadhali yafungue macho yake ili aone.” Basi Yahwe akayafungua macho ya yule kijana[b], naye akaona. Na tazama, mlima ulikuwa umejaa farasi na magari ya vita ya moto pande zote kumzunguka Elisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina la Mungu יהוה (YHWH), linalonukuliwa hapa kuwa “Yahwe”; kwa desturi nyingine hutafsiriwa “BWANA.”
    reason: alternative_reading
  - marker: b
    text: Au, “mtumishi.” Neno la Kiebrania נער (na‘ar) linaweza kumaanisha kijana au mtumishi/msaidizi, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: akaomba
  rationale: Kitenzi hiki katika muktadha huu kinamaanisha kusali au kuomba kwa Mungu; “akaomba” ni cha kawaida na wazi katika simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa kunukuliwa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: פְּקַח נָא
  choice: tafadhali yafungue
  rationale: פקח ni kufungua, hasa macho, na נא hapa huonyesha ombi la heshima, si lazima wakati wa “sasa.”
- source_word: וְיִרְאֶה
  choice: ili aone
  rationale: Muundo huu unaonyesha kusudi la kufunguliwa kwa macho yake.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: נער inaweza kumaanisha kijana au mtumishi/msaidizi; “yule kijana” huhifadhi maana yake ya msingi, huku muktadha ukitambulisha mhusika.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: הנה huvuta fikira kwenye jambo la kushangaza linaloonekana; “Na tazama” huhifadhi msisitizo huo wa kisimulizi.
- source_word: הָהָר מָלֵא
  choice: mlima ulikuwa umejaa
  rationale: Hii inatoa kwa njia ya kawaida maana ya mlima kuwa mwingi au uliojaa vitu vilivyotajwa.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: farasi na magari ya vita ya moto
  rationale: רכב hapa ni magari ya kivita, si magari ya kawaida. Muundo unaacha “ya moto” ikiambatana moja kwa moja na magari ya vita, kama ilivyo katika Kiebrania.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: pande zote kumzunguka Elisha
  rationale: Usemi huu unaonyesha kuwa ulinzi huo ulikuwa ukimzunguka Elisha.
theological_decisions:
- issue: Kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia jina binafsi la Mungu, יהוה. “Yahwe” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Asili ya maono hayo
  choice: Maandishi yanasema macho ya kijana yalifunguliwa naye akaona farasi na magari ya vita ya moto.
  alternative: Kulieleza jeshi hilo moja kwa moja kuwa la kimalaika halisi au kuwa ishara tu
  rationale: Aya haisemi kwa undani kama jambo hilo lilikuwa la kimwili, la kimaono, au la kimalaika kwa namna gani; tafsiri haiongezi uamuzi usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Magari ya vita” limetumiwa kuweka wazi kuwa רכב ni magari ya kivita ya kale. Alama za tanbihi zimewekwa moja kwa moja baada ya “Yahwe” na “kijana,” ambako maelezo yake yanahusika.
