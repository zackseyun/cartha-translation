base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: sw
  text: Alipokuwa bado akizungumza nao, tazama, yule mjumbe akashuka kumjia, akasema, “Tazama, janga hili limetoka kwa Yahwe. Kwa nini niendelee kumngojea Yahwe?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bado nitumainie nini kutoka kwa Yahwe?” Kitenzi cha Kiebrania kinaweza kumaanisha “kungoja” au “kutumaini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Alipokuwa bado akizungumza nao
  rationale: Muundo huu unaonyesha kwamba tendo la kuzungumza lilikuwa bado linaendelea, na kwa Kiswahili ni wa kawaida na wazi.
- source_word: הַמַּלְאָךְ
  choice: yule mjumbe
  rationale: Katika muktadha huu ni mjumbe wa mfalme, si kiumbe wa mbinguni; hivyo “mjumbe” huepuka maana potovu ya “malaika.”
- source_word: יֹרֵד אֵלָיו
  choice: akashuka kumjia
  rationale: “Akashuka” huhifadhi wazo la mwendo wa kuelekea chini, na “kumjia” huonyesha kwamba alikuwa akimkaribia Elisha.
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili linadumisha nguvu ya kuvuta fikira katika simulizi na tena ndani ya maneno yaliyonukuliwa.
- source_word: זֹאת הָרָעָה
  choice: janga hili
  rationale: Katika muktadha, רָעָה ni maafa au janga linalowapata watu, si lazima uovu wa kimaadili. “Janga hili” ni Kiswahili cha kawaida na huhifadhi uzito wa lawama ya msemaji.
- source_word: מֵאֵת יְהוָה
  choice: limetoka kwa Yahwe
  rationale: Kirai hiki kinamtaja Yahwe kuwa chanzo cha janga kulingana na malalamiko ya msemaji.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: Kwa nini niendelee kumngojea Yahwe?
  rationale: Katika muktadha, swali linaonyesha kukata tamaa kuhusu kuendelea kusubiri msaada wa Yahwe. “Niendelee” huwasilisha nguvu ya עוֹד, huku maana mbadala ya kutumaini ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya יחל katika malalamiko ya msemaji
  choice: kumngojea Yahwe
  alternative: kumtumainia Yahwe
  rationale: Kitenzi kinaweza kumaanisha kungoja au kutumaini. Muktadha unasisitiza kukataa kuendelea kusubiri kuingilia kati kwa Mungu, lakini tanbihi inadumisha maana halisi mbadala.
- issue: Utambulisho wa msemaji katika ויאמר
  choice: akasema (bila kutaja kiima waziwazi)
  alternative: mjumbe akasema; mfalme akasema
  rationale: Kiebrania kinasema tu “akasema.” Mjumbe ndiye kiima kinachoelekea zaidi kisarufi, lakini kutotaja kiima wazi katika Kiswahili kunahifadhi kiasi cha utata wa maandishi bila kuufanya mstari usiwe wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Tazama” kimetumiwa ili kuhifadhi msisitizo wa הִנֵּה; “janga” limechaguliwa badala ya “uovu” kwa sababu hapa מדובר kuhusu maafa yanayoendelea. Muundo “akasema” haumlazimishi msomaji kumtambua msemaji kwa jina zaidi ya Kiebrania chenyewe.
