base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: sw
  text: Akasema[a], “Yahwe asipokusaidia, mimi nitakusaidia kutoka wapi? Kutoka kwenye uwanja wa kupuria, au kutoka kwenye shinikizo la kukamulia zabibu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe asipokuokoa, mimi nitakuokoa kutoka wapi?” Kitenzi cha Kiebrania katika sehemu zote mbili kinaweza kumaanisha kusaidia, kuokoa, au kunusuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Muundo huu unaendeleza simulizi. “Akasema” ni wa kawaida na unaofaa katika Kiswahili bila kulazimisha kiunganishi cha Kiebrania.
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: Yahwe asipokusaidia
  rationale: 'Ingawa אַל kwa kawaida ni neno la kukanusha, hapa pamoja na swali linalofuata linaeleweka vizuri kama hali ya kukata tamaa: “Yahwe asipokusaidia.” Muundo huu ni wa asili katika Kiswahili na haugeuzi kauli kuwa katazo.'
- source_word: יוֹשִׁעֵךְ / אֹשִׁיעֵךְ
  choice: asipokusaidia / nitakusaidia
  rationale: Kitenzi ישׁע kinaweza kumaanisha kusaidia, kuokoa, au kukomboa. Katika muktadha wa njaa na ukosefu wa chakula, “kusaidia” kinaeleza msaada halisi unaotafutwa na pia kinahifadhi ulinganifu wa vitenzi viwili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi “Yahwe,” si kubadilishwa kuwa cheo.
- source_word: מֵאַיִן
  choice: kutoka wapi
  rationale: Kirai hiki kinauliza chanzo cha msaada; “kutoka wapi” ni Kiswahili cha kawaida na kinadumisha nguvu ya swali la balagha.
- source_word: הֲמִן הַגֹּרֶן
  choice: Kutoka kwenye uwanja wa kupuria nafaka
  rationale: Hii inataja mahali ambapo nafaka hupuriwa na ambako chakula kingetarajiwa kupatikana. Neno “nafaka” linaweka maana wazi kwa msomaji wa sasa.
- source_word: הַיָּקֶב
  choice: shinikizo la divai
  rationale: Neno יֶקֶב linamaanisha shinikizo au chombo cha kukamulia zabibu. “Shinikizo la divai” ni istilahi fupi, halisi, na linaendana na “uwanja wa kupuria nafaka” kama chanzo kinachotarajiwa cha mazao.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. “Yahwe” linahifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Maana ya ישׁע katika mazingira haya
  choice: kusaidia
  alternative: kuokoa
  rationale: “Kusaidia” linafaa zaidi kwa ombi la kupata nafuu wakati wa njaa, huku tanbihi ikihifadhi maana nyingine halali ya “kuokoa.” Hivyo tafsiri haifanyi kitenzi hiki kiwe na maana ya kiroho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa swali la balagha na ulinganifu wa vitenzi viwili umehifadhiwa; tanbihi inaonyesha upana wa maana ya kitenzi cha Kiebrania.
