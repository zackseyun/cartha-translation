base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: sw
  text: Moyo wa mfalme wa Aramu ukafadhaika sana kwa sababu ya jambo hilo. Basi akawaita watumishi wake na kuwaambia, “Je, hamtaniambia ni nani miongoni mwetu aliye upande wa mfalme wa Israeli?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסָּעֵר
  choice: ukafadhaika sana
  rationale: Kitenzi hiki kinaonyesha msukosuko mkubwa wa ndani. ‘Ukafadhaika sana’ ni Kiswahili cha kawaida kinachowasilisha hali hiyo bila kuifanya iwe hasira peke yake.
- source_word: לֵב
  choice: moyo
  rationale: ‘Moyo’ huhifadhi taswira ya Kiebrania ya nafsi ya ndani, inayohusisha mawazo na hisia, na inaeleweka kwa urahisi katika Kiswahili.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: kwa sababu ya jambo hilo
  rationale: Kirai hiki kinaeleza sababu ya kufadhaika kwake; ‘jambo hilo’ ni cha asili zaidi kuliko tafsiri halisi ‘kitu hicho’.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha wa kifalme neno linaweza kumaanisha watumishi au maafisa wa mfalme. ‘Watumishi wake’ huhifadhi upana wa neno la Kiebrania bila kuongeza cheo kisichotajwa.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: Je, hamtaniambia
  rationale: Huhifadhi muundo wa swali la mkazo lenye ukanushi na wakati huohuo kuwasilisha dai la haraka la mfalme kwa Kiswahili cha kawaida.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: ni nani miongoni mwetu
  rationale: Kirai hiki kinatafuta mtu wa ndani ya kundi la Waaramu; uchaguzi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: aliye upande wa mfalme wa Israeli
  rationale: Kiebrania ni kifupi na huonyesha kuelekea, uaminifu, au ushirikiano na mfalme wa Israeli. ‘Aliye upande wa’ huwasilisha tuhuma hiyo wazi bila kudai aina mahususi ya usaliti.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ‘ukafadhaika… akawaita… kuwaambia’ unadumisha mfuatano wa Kiebrania. Hakuna tanbihi iliyohitajika kwa kuwa maana ya kirai cha mwisho imewasilishwa wazi katika matini bila kuondoa utata wake wa msingi.
