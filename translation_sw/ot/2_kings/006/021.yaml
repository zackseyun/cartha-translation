  text: Ndipo mfalme wa Israeli alipowaona, akamwambia Elisha, “Je, niwaue? Niwaue, baba yangu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa lugha ya kawaida ya Kiswahili na pia unaonyesha kuwa maneno yanaelekezwa kwa Elisha.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huu ni uhamishaji wa moja kwa moja wa muundo wa Kiebrania.
- source_word: אֶל אֱלִישָׁע
  choice: akamwambia Elisha
  rationale: Kihusishi אֶל kinaonyesha anayeelekezewa maneno; hakuna msingi wa kuongeza cheo kama “nabii.”
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: alipowaona
  rationale: Kitenzi-jina chenye kiambishi cha nafsi kina maana ya wakati; kwa muktadha, mfalme ndiye aliyewaona.
- source_word: הַאַכֶּה אַכֶּה
  choice: Je, niwaue? Niwaue?
  rationale: Katika muktadha wa kijeshi, נכה hapa inaelekea kumaanisha kuwaua. Kurudia swali kunawasilisha msisitizo wa muundo wa Kiebrania bila kuupunguza.
- source_word: אָבִי
  choice: Baba yangu
  rationale: Maneno hayo yanahifadhi taswira ya kifamilia ya Kiebrania huku yakieleweka kwa muktadha kama namna ya heshima.
theological_decisions:
- issue: Kumwita Elisha kwa heshima
  choice: Baba yangu
  alternative: Bwana wangu; mheshimiwa
  rationale: Kiebrania kinasema kihalisi “baba yangu.” Kuhifadhi maneno hayo hakufuti maana yake ya heshima wala kuyalazimisha yamaanishe uhusiano wa kibaiolojia.
- issue: Nguvu ya swali lililorudiwa
  choice: Je, niwaue? Niwaue?
  alternative: Je, niwapige?; Je, niwaangamize?
  rationale: Muktadha unaonyesha kuwa mfalme anaomba ruhusa ya kuwaua mateka. Kurudia swali kunahifadhi msisitizo na shauku ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “Niwaue” huwasilisha maana ya kijeshi katika muktadha huu, na marudio yamehifadhiwa kwa msisitizo.
