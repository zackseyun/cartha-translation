base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: sw
  text: Ndipo mtu wa Mungu akasema, “Kilianguka wapi?” Mtu yule akamwonyesha mahali pale. Kisha akakata kipande cha mti, akakitupa pale, na kile chuma[a] kikaelea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “chuma.” Katika muktadha, ni kichwa cha shoka cha chuma kilichotajwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni tafsiri ya moja kwa moja ya cheo cha Kiebrania kinachotumiwa kwa nabii, bila kuongeza ufafanuzi usiomo katika maandishi.
- source_word: אָנָה נָפָל
  choice: Kilianguka wapi?
  rationale: Swali linauliza mahali ambapo kichwa cha shoka kilikuwa kimeanguka; umbo hili ni la kawaida na wazi katika Kiswahili.
- source_word: וַיַּרְאֵהוּ אֶת הַמָּקוֹם
  choice: Naye akamwonyesha mahali pale
  rationale: Hifili ya ראה ina maana ya ‘kumwonyesha’; sentensi huru inadumisha mfuatano wa vitenzi vya simulizi.
- source_word: וַיִּקְצָב עֵץ
  choice: akakata kipande cha mti
  rationale: עֵץ inaweza kumaanisha mti au kuni, na קצב hapa ni kukata; ‘kipande cha mti’ ni halisi na hakidai ukubwa au umbo lisilotajwa.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: akakitupa pale
  rationale: Inadumisha kitendo cha kutupa na kielezi cha mahali bila kuongeza kwamba alikitupa majini, ingawa hilo linaeleweka kutokana na muktadha.
- source_word: וַיָּצֶף הַבַּרְזֶל
  choice: kile chuma kikaelea
  rationale: Kitenzi kinaeleza kuelea au kutokea juu ya maji, na nomino yenyewe ni ‘chuma’; tafsiri hii ni ya moja kwa moja na haisawazishi tukio la ajabu.
theological_decisions:
- issue: Tukio la kimiujiza katika simulizi
  choice: kile chuma kikaelea
  alternative: kile chuma kikajitokeza juu ya maji
  rationale: Maandishi yanasimulia tukio hilo moja kwa moja. Tafsiri hailielezi kwa namna ya kawaida wala kulipamba, bali inadumisha dai la Kiebrania kwamba chuma kilielea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Ndipo’ na ‘kisha’ huonyesha mfuatano wa matendo bila kufanya sentensi kuwa nzito.
