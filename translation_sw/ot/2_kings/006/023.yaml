base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: sw
  text: Basi akawaandalia karamu kubwa[a], nao wakala na wakanywa. Kisha akawaacha waende, nao wakaenda kwa bwana wao[b]. Makundi ya wavamizi wa Aramu[c] hayakuingia tena katika nchi ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sherehe kubwa ya chakula.” Kiebrania kinatumia kitenzi na nomino za mzizi mmoja kuonyesha kuandaliwa kwa chakula kingi.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa mkuu wao.” Inaelekea usemi huu unamtaja mfalme wa Aramu.
    reason: lexical_alternative
  - marker: c
    text: “Aramu” ni jina la Kiebrania ambalo katika tafsiri nyingine huitwa “Shamu” au “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: akawaandalia karamu kubwa
  rationale: Kitenzi כרה pamoja na nomino ya mzizi uleule כֵּרָה ni nahau ya kuandaa chakula kikubwa au karamu. “Akawaandalia karamu kubwa” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa גְדוֹלָה.
- source_word: לָהֶם
  choice: -wa- ... -lia (akawaandalia)
  rationale: Kiambishi cha yambwa na kauli ya kutendea vinaonyesha kwa njia ya kawaida kwamba karamu iliandaliwa kwa ajili yao.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: nao wakala na kunywa
  rationale: Hili linawasilisha moja kwa moja jozi ya vitenzi vya Kiebrania kwa mtiririko wa kawaida wa Kiswahili.
- source_word: וַיְשַׁלְּחֵם
  choice: akawaacha waende
  rationale: Katika muktadha wa watu waliokuwa wameshikiliwa, usemi huu unaonyesha kwamba aliwaruhusu waondoke, bila kuongeza wazo lisilotajwa wazi la kuwasindikiza au kuwarudisha.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: kwa bwana wao
  rationale: Ingawa umbo la Kiebrania linaweza kuonekana la wingi, hapa linaelekea kumtaja mtu mmoja mwenye mamlaka, yaani mfalme wa Aramu. “Bwana wao” huhifadhi maana ya mwenye mamlaka bila kumtaja mfalme moja kwa moja katika matini.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: havikuja tena
  rationale: Muundo wa יסף pamoja na עוד unaonyesha kwamba tendo halikurudiwa; Kiswahili “havikuja tena” ni wazi na cha kawaida.
- source_word: גְּדוּדֵי אֲרָם
  choice: vikosi vya wavamizi vya Aramu
  rationale: גְּדוּדֵי hutaja makundi au vikosi vinavyofanya mashambulizi ya kuvamia, si lazima jeshi lote rasmi. “Aramu” hufuata jina la Kiebrania badala ya kulibadilisha kuwa jina la kisasa la nchi.
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: kuja katika nchi ya Israeli
  rationale: Usemi huu unahifadhi tendo la kuingia au kuja ndani ya eneo linaloitwa nchi ya Israeli kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Lugha ni ya Kiswahili Sanifu cha Afrika Mashariki, yenye hadhi ya simulizi la Maandiko lakini inayoeleweka kwa msomaji wa kawaida. “Karamu,” “bwana wao,” na “vikosi vya wavamizi” ni maneno ya sasa yasiyofungamana na msamiati wa dhehebu fulani. Alama zote za tanbihi zimewekwa mara moja katika matini karibu na maneno yanayohusika.
