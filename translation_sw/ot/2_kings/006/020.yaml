  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: kishazi cha wakati, ombi la Elisha, kutimizwa kwake na Yahweh, tendo la wao kuona, na ugunduzi kwamba wako katikati ya Samaria. “Yafumbue macho ya hawa” huwakilisha vizuri idiomu ya פְּקַח אֶת־עֵינֵי na huacha kiwakilishi אֵלֶּה bila kuongeza nomino katika matini.'
