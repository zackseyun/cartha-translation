  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִי֮ כְּ/בֹאָ֣/ם שֹׁמְרוֹן֒ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע יְהוָ֕ה פְּקַ֥ח אֶת עֵינֵֽי אֵ֖לֶּה וְ/יִרְא֑וּ וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵ֣ינֵי/הֶ֔ם וַ/יִּרְא֕וּ וְ/הִנֵּ֖ה בְּ/ת֥וֹךְ שֹׁמְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: sw
  text: Walipoingia Samaria, Elisha akasema, “Ee Yahweh, yafumbue macho ya hawa[a] ili waone.” Basi Yahweh akayafumbua macho yao, nao wakaona; na tazama, walikuwa katikati ya Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hawa”; neno hili linawarejelea askari Waaramu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: Walipoingia
  rationale: Muundo huu unawasilisha kwa Kiswahili cha kawaida kishazi cha wakati kinachoendeleza simulizi, bila kulazimisha kutafsiri וַיְהִי kwa maneno yasiyo ya lazima kama “ikawa.”
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili; katika muktadha huu linamaanisha mji wa Samaria.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: פְּקַח ... אֶת עֵינֵי
  choice: yafumbue macho
  rationale: Hii inahifadhi nahau halisi ya Kiebrania kuhusu kufumbua macho na pia uhusiano wake na kuondolewa kwa upofu au kutoona kulikosababishwa na Mungu.
- source_word: אֵלֶּה
  choice: hawa
  rationale: Kiebrania kina kiwakilishi kionyeshi pekee, nacho kinawarejelea askari Waaramu; Kiswahili kinaweza kukitumia kwa kawaida bila kuongeza nomino.
- source_word: וְיִרְאוּ
  choice: ili waone
  rationale: “Ili” inaonyesha kusudi la ombi la Elisha kwa njia ya asili na iliyo wazi.
- source_word: וַיִּפְקַח יְהוָה אֶת עֵינֵיהֶם
  choice: Basi Yahweh akayafumbua macho yao
  rationale: “Basi” inaonyesha kutimizwa kwa ombi, huku mfululizo wa vitenzi vya simulizi ukihifadhiwa kwa umbo la “aka-”.
- source_word: וַיִּרְאוּ
  choice: nao wakaona
  rationale: Tafsiri hii inahifadhi kitendo cha kuona badala ya kukifasiri kuwa kutambua, kwa kuwa kishazi kinachofuata kinaeleza walichoona.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Usemi huu wa hadithi unavuta fikira kwenye ugunduzi wa ghafla na kuhifadhi uzito wa kifasihi wa maandishi.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: katikati ya Samaria
  rationale: Hii inahifadhi maana ya kuwa ndani kabisa au katikati ya Samaria na athari ya kushangaza ya eneo walimojikuta.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida na wazi, huku nahau ya “kufumbua macho” na kishindo cha “na tazama” vikihifadhiwa.
