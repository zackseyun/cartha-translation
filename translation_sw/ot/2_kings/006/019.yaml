base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: sw
  text: Elisha akawaambia, “Hii siyo njia, wala huu siyo mji. Nifuateni[a], nami nitawaongoza kwa yule mtu mnayemtafuta.” Naye akawaongoza hadi Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “Nendeni nyuma yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: njia
  rationale: Neno דֶּרֶךְ humaanisha njia, barabara, au mapito. “Njia” ni la kawaida na linadumisha maana pana ya neno la Kiebrania bila kubainisha kupita kiasi.
- source_word: הָעִיר
  choice: mji
  rationale: Neno עִיר ni neno la kawaida kwa mji. “Huu siyo mji” linahifadhi uoneshaji wa moja kwa moja wa Kiebrania.
- source_word: לְכוּ אַחֲרַי
  choice: Nifuateni[a]
  rationale: Kirai hiki kwa karibu ni “nendeni nyuma yangu,” lakini “Nifuateni” ni Kiswahili cha kawaida kinachoeleza wazi amri ya kwenda pamoja naye.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: nami nitawaongoza
  rationale: Hiphil ya הלך ina maana ya kusababisha mtu aende, yaani kumwongoza. “Nitawaongoza” ni ya asili na hudumisha tendo la kuongoza.
- source_word: הָאִישׁ
  choice: mtu
  rationale: Ingawa אִישׁ mara nyingi humaanisha mwanamume, katika Kiswahili “mtu mnayemtafuta” ni usemi wa asili kwa mtu fulani anayelengwa, bila kuondoa rejeleo lake la umoja.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: mnayemtafuta
  rationale: בקשׁ hapa ni kumtafuta mtu. Muundo huu unaeleza kwa kawaida utafutaji unaoendelea katika muktadha.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: Naye akawaongoza
  rationale: Tafsiri hii hudumisha ulinganifu na “nitawaongoza” na inaonyesha kwamba Elisha aliwaelekeza njiani.
- source_word: שֹׁמְרוֹנָה
  choice: hadi Samaria
  rationale: He ya mwelekeo inaonyesha mwendo kuelekea Samaria. “Hadi Samaria” ni usemi wa kawaida unaoonyesha mahali walikofikishwa.
theological_decisions:
- issue: Kauli ya Elisha inayoweza kueleweka kuwa ya udanganyifu kwa Waaramu
  choice: “Hii siyo njia, wala huu siyo mji.”
  alternative: Kufafanua kauli hiyo ili ionekane wazi kuwa kweli kwa sehemu au kuwa udanganyifu wa moja kwa moja.
  rationale: Tafsiri inahifadhi maneno ya moja kwa moja ya simulizi bila kuyapunguza makali, kuyatetea, au kuyahukumu kimaadili. Hivyo mvutano wa kimaadili na kitheolojia unaachwa kwa msomaji na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Siyo” na muundo “wala huu siyo” huleta utofautishaji wa wazi; “Nifuateni” ni wa kawaida kuliko tafsiri sisisi.
