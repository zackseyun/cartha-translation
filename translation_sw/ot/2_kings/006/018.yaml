  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: sw
  text: Waliposhuka kumwelekea, Elisha akamwomba Yahweh, akisema, “Tafadhali, lipige taifa hili kwa upofu[a].” Basi akawapiga kwa upofu, kulingana na neno la Elisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mkanganyiko unaopofusha.” Neno la Kiebrania linaweza kumaanisha hali ya kuona iliyoharibika iliyosababishwa na Mungu, inayowafanya wasiweze kutambua vizuri, si lazima upofu kamili au wa kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: Walipomshukia
  rationale: ירד ni ‘shuka,’ na muktadha wa kijeshi unaonyesha kuwa walimjia kwa uhasama. ‘Kumshukia’ kwa Kiswahili huwasilisha kwa ufupi mwendo huo wa kumvamia bila kuondoa maana ya kushuka.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: Elisha akamwomba Yahweh
  rationale: התפלל ni kitenzi cha kawaida cha kusali au kuomba. ‘Akamwomba’ ni Kiswahili cha sasa na cha kawaida kinachoeleza sala iliyoelekezwa kwa Yahweh.
- source_word: הַךְ נָא
  choice: Tafadhali, wapige
  rationale: נכה humaanisha ‘piga,’ huku נָא ikifanya ombi hilo liwe la kusihi. Tafsiri inadumisha nguvu ya amri ndani ya sala pamoja na unyenyekevu wa ombi.
- source_word: הַגּוֹי הַזֶּה
  choice: watu hawa
  rationale: גוי inaweza kumaanisha taifa au jamii ya watu. Hapa inarejelea kikosi cha Waaramu kwa pamoja; ‘watu hawa’ ni ya kawaida zaidi katika Kiswahili na haimaanishi kwamba taifa zima lilikuwapo mahali hapo.
- source_word: בַּסַּנְוֵרִים
  choice: kwa upofu
  rationale: סַנְוֵרִים hueleza udhaifu wa kuona uliosababishwa na Mungu. ‘Upofu’ ni tafsiri iliyo wazi zaidi, huku uwezekano wa mkanganyiko wa kuona unaopofusha ukihifadhiwa katika tanbihi.
- source_word: וַיַּכֵּם
  choice: Basi akawapiga
  rationale: Kiima kinachoeleweka kutokana na muktadha ni Yahweh, aliyejibu ombi la Elisha. ‘Basi’ huonyesha matokeo katika mtiririko wa simulizi.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: kulingana na neno la Elisha
  rationale: דבר hapa ni ‘neno’ au ‘tamko.’ Uundaji huu unahifadhi nahau ya Kiebrania na uhusiano kati ya ombi la nabii na tendo la Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Aina ya upofu uliowapata Waaramu
  choice: upofu, huku maana pana ikielezwa katika tanbihi
  alternative: mkanganyiko unaopofusha
  rationale: Neno adimu סַנְוֵרִים linaweza kuonyesha kushindwa kutambua wanachokiona, si lazima kupoteza uwezo wa kuona kabisa au daima. Maandishi makuu yanatumia neno linaloeleweka, lakini tanbihi inalinda utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Walipomshukia’ huwasilisha mwendo wa kushuka pamoja na uhasama wa kijeshi; ‘watu hawa’ huepuka usemi usio wa kawaida wa kudai kwamba taifa lote lilikuwa hapo. Muundo wa simulizi umehifadhiwa kwa sentensi fupi na wazi.
