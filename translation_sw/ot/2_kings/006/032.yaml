  text: וֶ/אֱלִישָׁע֙ יֹשֵׁ֣ב בְּ/בֵית֔/וֹ וְ/הַ/זְּקֵנִ֖ים יֹשְׁבִ֣ים אִתּ֑/וֹ וַ/יִּשְׁלַ֨ח אִ֜ישׁ מִ/לְּ/פָנָ֗י/ו בְּ/טֶ֣רֶם יָבֹא֩ הַ/מַּלְאָ֨ךְ אֵלָ֜י/ו וְ/ה֣וּא אָמַ֣ר אֶל הַ/זְּקֵנִ֗ים הַ/רְּאִיתֶם֙ כִּֽי שָׁלַ֞ח בֶּן הַֽ/מְרַצֵּ֤חַ הַ/זֶּה֙ לְ/הָסִ֣יר אֶת רֹאשִׁ֔/י רְא֣וּ כְּ/בֹ֣א הַ/מַּלְאָ֗ךְ סִגְר֤וּ הַ/דֶּ֨לֶת֙ וּ/לְחַצְתֶּ֤ם אֹת/וֹ֙ בַּ/דֶּ֔לֶת הֲ/ל֗וֹא ק֛וֹל רַגְלֵ֥י אֲדֹנָ֖י/ו אַחֲרָֽי/ו׀־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: sw
  text: Elisha alikuwa ameketi nyumbani mwake, na wazee walikuwa wameketi pamoja naye. Mfalme akamtuma mtu mbele yake. Lakini kabla mjumbe[b] hajamfikia Elisha, Elisha akawaambia wazee, “Je, mnaona jinsi huyu mwana wa muuaji alivyotuma mtu ili anikate kichwa[a]? Angalieni, mjumbe atakapofika, fungeni mlango na mzuieni pale mlangoni. Je, sauti ya hatua za bwana wake haisikiki nyuma yake?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “kuondoa kichwa changu,” nahau inayomaanisha kumuua mtu kwa kumkata kichwa.
    reason: lexical_alternative
  - marker: b
    text: “Mjumbe” hapa ni mwakilishi wa kibinadamu aliyetumwa na mfalme, si malaika.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: alikuwa ameketi / walikuwa wameketi
  rationale: Vivumishi-tendo vya Kiebrania vinaonyesha hali iliyokuwa ikiendelea; miundo hii ya Kiswahili huweka mandhari ya simulizi kwa kawaida.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: Mfalme akamtuma mtu atangulie mbele yake
  rationale: Muktadha unamtambulisha mfalme kuwa mtendaji, na מִלְּפָנָיו hapa ina maana ya kumtuma mtu mbele yake.
- source_word: הַמַּלְאָךְ
  choice: mjumbe
  rationale: Katika muktadha huu ni mjumbe wa kibinadamu wa mfalme, si malaika.
- source_word: הֲרְאִיתֶם
  choice: Je, mnaona
  rationale: Swali la balagha linawataka wazee watambue jambo linalotokea sasa.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: huyu mwana wa muuaji
  rationale: Huhifadhi muundo wa dharau wa Kiebrania bila kuamua zaidi utambulisho au hatia inayodokezwa.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: kuniondoa kichwa changu
  rationale: Huhifadhi kwa ukaribu nahau halisi ya Kiebrania, huku tanbihi ikifafanua kuwa inamaanisha kuuawa kwa kukatwa kichwa.
- source_word: סִגְרוּ הַדֶּלֶת
  choice: fungeni mlango
  rationale: Ni amri ya haraka na ya kawaida katika Kiswahili cha sasa.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: mzuieni pale mlangoni
  rationale: Kitenzi kinaonyesha kumkandamiza au kumzuia asiingie; tafsiri hii huwasilisha tendo linalokusudiwa kwa Kiswahili cha kawaida bila kuongeza namna isiyo hakika.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: Je, sauti ya hatua za bwana wake haisikiki nyuma yake?
  rationale: Huhifadhi swali la balagha na wazo kwamba bwana wa mjumbe anakuja mara moja nyuma yake.
theological_decisions:
- issue: Mtendaji asiye tajwa wazi katika וַיִּשְׁלַח
  choice: Mfalme akamtuma mtu
  alternative: Akamtuma mtu
  rationale: Muktadha wa karibu unamtambulisha mfalme wa Israeli kuwa mtendaji; kumtaja huondoa utata wa kisarufi bila kuongeza dai jipya.
- issue: Utambulisho wa הַמַּלְאָךְ
  choice: mjumbe wa kibinadamu
  alternative: malaika
  rationale: Ni mtu aliyetumwa na mfalme kutekeleza amri katika simulizi la kifalme; hakuna dalili ya kiumbe wa mbinguni hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina ya wahusika yamerudiwa katika sehemu moja ili kuondoa utata wa viwakilishi vya Kiebrania. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
