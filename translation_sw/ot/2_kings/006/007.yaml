  text: And he said, “Pick it up for yourself.” So he reached out his hand and took it.
translation:
  language: sw
  text: Akasema, “Jiokotee.[a]” Naye akanyoosha mkono wake, akaichukua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Iinue kwa ajili yako.” Kitenzi cha Kiebrania kina maana ya msingi ya “inua”; katika muktadha huu kinaweza kumaanisha “okota.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi kwa njia ya kawaida na ya asili katika Kiswahili.
- source_word: הָרֶם
  choice: Iokote
  rationale: Ingawa maana ya msingi ni kuinua, katika muktadha huu amri inamhimiza mtu kukichukua chuma kilichokuwa juu ya maji; “iokote” ni ya kawaida na sahihi kimuktadha.
- source_word: לָךְ
  choice: mwenyewe
  rationale: Neno hili linaonyesha kwamba mtu huyo alipaswa kufanya tendo hilo binafsi; “mwenyewe” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: akanyoosha mkono wake
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kitendo cha kuufikisha mkono ili kukamata kitu.
- source_word: וַיִּקָּחֵהוּ
  choice: akaichukua
  rationale: לקח kwa kawaida humaanisha kuchukua; kiambishi “-i-” kinarejelea chuma cha shoka kinachotajwa katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi, wa kawaida na wenye heshima. Tafsiri “iokote” inatanguliza uasilia wa kimuktadha, huku tanbihi ikihifadhi maana ya moja kwa moja ya kitenzi cha Kiebrania.
