- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ni namna ya kawaida na ya asili ya Kiswahili ya kuanzisha maneno yaliyonukuliwa.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: mahali fulani hivi
  rationale: Jozi ya maneno ya Kiebrania ni nahau inayotaja mahali pasipotajwa kwa jina; ‘mahali fulani hivi’ huhifadhi kutobainishwa huko kwa Kiswahili cha kawaida.
- source_word: תַּחֲנֹתִי
  choice: Kambi yangu itakuwa
  rationale: Nomino inahusu kambi au eneo la kupiga kambi. Katika muktadha wa kupanga operesheni ya kijeshi, wakati ujao unaeleza kwa kawaida mpango wa mfalme bila kubadili nomino kuwa kitenzi.
