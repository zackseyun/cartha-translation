  rationale: Pamoja na kitenzi kupigana, Kiswahili sanifu hutumia ‘kupigana na’ kumtaja mpinzani; maana ni dhidi ya Israeli, si kwa ushirikiano nayo.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
