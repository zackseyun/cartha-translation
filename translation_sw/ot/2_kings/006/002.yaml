base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: sw
  text: “Tafadhali, twende mpaka Mto Yordani. Kila mtu achukue kutoka huko boriti moja, nasi tujitengenezee huko mahali pa kukaa.” Naye akasema, “Nendeni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: Tafadhali, twende
  rationale: Kauli ya kuhimiza katika nafsi ya kwanza wingi pamoja na נָא inaonyesha ombi la heshima; tafsiri hii ni ya kawaida na huhifadhi wazo la kwenda pamoja.
- source_word: עַד הַיַּרְדֵּן
  choice: mpaka Mto Yordani
  rationale: עַד hapa ina maana ya kufika hadi au kwenda mpaka mahali fulani; kutaja “Mto” kunabainisha kwa msomaji wa Kiswahili kwamba Yordani ni mto.
- source_word: אִישׁ קוֹרָה אֶחָת
  choice: Kila mmoja wetu achukue ... boriti moja
  rationale: 'Muundo huu una maana ya ugawaji: kila mtu katika kundi achukue kipande kimoja. קוֹרָה ni boriti au gogo la ujenzi; “boriti” inafaa zaidi katika muktadha wa kujenga.'
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: nasi tujijengee huko mahali
  rationale: Ingawa עשה kwa msingi ni “fanya/tengeneza,” boriti na kusudi la kupata mahali pa kukaa zinaonyesha kazi ya ujenzi. “Tujijengee” pia huwasilisha wazi לָּנוּ, yaani, kwa ajili yetu wenyewe.
- source_word: לָשֶׁבֶת שָׁם
  choice: pa kukaa
  rationale: ישב inaweza kumaanisha kukaa au kuishi mahali. “Mahali pa kukaa” ni usemi wa kawaida wa Kiswahili na haubani maana kuwa kuketi tu wala kudai kwa lazima makazi ya kudumu.
- source_word: וַיֹּאמֶר לֵכוּ
  choice: Naye akasema, “Nendeni.”
  rationale: Amri ya wingi לֵכוּ inajibiwa kwa kifupi kama ilivyo katika Kiebrania; “Nendeni” pia hudokeza ruhusa iliyotolewa kwa kundi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Marudio ya “huko” yamehifadhiwa kwa kiasi ili kufuata msisitizo wa maandishi ya Kiebrania bila kufanya sentensi iwe nzito. Hakuna tanbihi iliyohitajika kwa sababu tofauti za kimsamiati zinaweza kuwakilishwa ipasavyo katika matini yenyewe.
