  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: sw
  text: Mfalme wa Israeli alipokuwa akipita juu ya ukuta, mwanamke mmoja alimlilia kwa sauti kubwa, akisema, “Nisaidie,[a] bwana wangu mfalme!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niokoe, bwana wangu mfalme!” Amri ya Kiebrania ina maana halisi ya “okoa,” lakini hapa inatumika kama ombi la dharura la msaada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: alipokuwa akipita
  rationale: Muundo huu unaweka tukio katika hali ya tendo lililokuwa likiendelea. Kiswahili cha wakati ‘alipokuwa akipita’ ni cha asili na kinaonyesha vizuri mazingira ya simulizi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Huu ni mfuatano wa kawaida wa umilikaji unaomtambulisha mtawala.
- source_word: עַל הַחֹמָה
  choice: juu ya ukuta
  rationale: עַל maana yake ya moja kwa moja ni ‘juu ya.’ Katika mazingira ya kuzingirwa kwa mji, ni ukuta wa mji ambao mfalme alikuwa akipita juu yake.
- source_word: וְאִשָּׁה
  choice: mwanamke mmoja
  rationale: Mwanamke anatambulishwa kwa mara ya kwanza bila kuwa maalumu; ‘mmoja’ huonyesha hali hiyo kwa Kiswahili cha asili.
- source_word: צָעֲקָה אֵלָיו
  choice: alimpazia sauti
  rationale: Kitenzi kinaonyesha kilio au mwito wa sauti kubwa wenye dhiki na ombi la haraka. ‘Alimpazia sauti’ huwasilisha kwamba alimwita mfalme kwa sauti kubwa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ni kauli ya kawaida inayotanguliza maneno ya moja kwa moja.
- source_word: הוֹשִׁיעָה
  choice: Nisaidie
  rationale: Amri hii kutoka ישׁע ina maana ya msingi ya ‘okoa,’ lakini hapa ni ombi la dharura kwa mfalme aingilie kati. ‘Nisaidie’ ni Kiswahili cha asili kinachofaa muktadha, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Hii huhifadhi heshima ya kifalme na muundo wa kumwita mtawala moja kwa moja bila kuongeza cheo kisichokuwamo katika Kiebrania.
