base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: sw
  text: Ikawa mfalme aliposikia maneno ya yule mwanamke, akararua mavazi yake alipokuwa akipita juu ya ukuta. Watu wakaona, na tazama, alikuwa amevaa nguo ya gunia mwilini, chini ya mavazi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa ndani,” yaani nguo ya gunia ilikuwa imevaliwa chini ya mavazi yake ya nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo wenye כ na kitenzi-jina unaanzisha kishazi cha wakati; “aliposikia” ni Kiswahili cha kawaida kinachohifadhi mfuatano wa simulizi.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: maneno ya yule mwanamke
  rationale: דְּבָרִים hapa inarejelea yale ambayo mwanamke amesema; “maneno” ni tafsiri ya moja kwa moja bila kuyageuza kuwa maelezo au jambo kwa ujumla.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: akararua mavazi yake
  rationale: Huhifadhi tendo la kuyararua mavazi kama ishara ya huzuni au mshtuko, bila kuongeza maelezo ya sababu.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: alipokuwa akipita juu ya ukuta
  rationale: Kishazi hiki kinaeleza mazingira ya tendo; עַל־הַחֹמָה inaonyesha mwendo juu ya ukuta wa mji.
- source_word: וַיַּרְא הָעָם
  choice: Watu wakaona
  rationale: ראה kwa msingi ni “kuona”; tafsiri hii ni ya moja kwa moja na inafaa katika mtiririko wa simulizi.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi ishara ya simulizi inayovuta fikira kwenye jambo la kushangaza lililoonekana.
- source_word: הַשַּׂק
  choice: nguo ya gunia
  rationale: Neno hili linamaanisha kitambaa au vazi gumu lililovaliwa wakati wa maombolezo; “nguo ya gunia” ni usemi unaoeleweka katika Kiswahili.
- source_word: עַל־בְּשָׂרוֹ
  choice: mwilini
  rationale: בשר hapa ni mwili wake uliofunikwa na nguo ya gunia; “mwilini” ni ya kawaida kuliko “juu ya nyama yake” na haibadili maana.
- source_word: מִבָּיִת
  choice: chini ya mavazi yake
  rationale: Kihalisi ni “kwa ndani.” Katika muktadha inaonyesha kwamba nguo ya gunia ilikuwa imevaliwa ndani ya mavazi ya nje; tanbihi inahifadhi usemi halisi.
theological_decisions: []
