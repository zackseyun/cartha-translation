  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Na tazama” limedumishwa ili kuhifadhi msisitizo wa ghafla wa Kiebrania; “nguo ya gunia” huepuka usemi usio wa kawaida huku ikibakiza mazingira ya maombolezo.
