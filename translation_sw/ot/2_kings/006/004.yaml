  text: So he went with them[a], and they came to the Jordan and cut down the trees.
translation:
  language: sw
  text: Basi akaenda pamoja nao; wakafika Yordani, wakakata miti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakakata mbao.” Neno la Kiebrania linaweza kumaanisha miti au mbao kwa upana; lakini katika muktadha huu wa kukata miti, “miti” inafaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אִתָּם
  choice: Basi akaenda pamoja nao
  rationale: Muundo wa masimulizi unaendeleza tukio; “Basi” huleta mtiririko wa kawaida wa Kiswahili, na “pamoja nao” huonyesha wazi kuandamana nao.
- source_word: וַיָּבֹאוּ הַיַּרְדֵּנָה
  choice: nao wakafika Yordani
  rationale: Kitenzi בוא pamoja na he ya mwelekeo kinaonyesha kufika mahali palipotajwa. “Wakafika Yordani” ni Kiswahili cha kawaida na hakiongezi neno “Mto,” ambalo halipo wazi katika maandishi haya.
- source_word: וַיִּגְזְרוּ
  choice: na kukata
  rationale: Katika muktadha wa kupata boriti kwa kuangusha miti, גזר ina maana ya kukata. Kirai hiki ni cha kawaida na kitu chake, “miti,” kinaweka tendo katika muktadha unaofaa.
- source_word: הָעֵצִים
  choice: miti
  rationale: עֵץ inaweza kumaanisha mti au mbao; hapa wingi na muktadha wa kukata boriti unaelekea kwa miti iliyokuwa ikikatwa. Kiswahili kwa kawaida hakihitaji kuonyesha kibainishi cha Kiebrania kwa neno tofauti.
