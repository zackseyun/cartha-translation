base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/003.yaml
  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: sw
  text: Ndipo mmoja wao akasema, “Tafadhali, ukubali kwenda pamoja na watumishi wako.” Naye akasema, “Nitakwenda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֶחָד
  choice: mmoja wao
  rationale: Ingawa kihalisi ni ‘yule mmoja,’ katika muktadha huu ni mmoja wa kundi la wana wa manabii; ‘mmoja wao’ ni wazi na ya kawaida katika Kiswahili.
- source_word: הוֹאֶל נָא
  choice: Tafadhali, ukubali
  rationale: Muundo huu ni ombi la heshima linalotaka ridhaa au utayari. ‘Tafadhali, ukubali’ huhifadhi adabu pamoja na wazo la kukubali ombi.
- source_word: וְלֵךְ
  choice: kwenda
  rationale: Kitenzi hiki kinaeleza jambo analoombwa akubali kufanya. Baada ya ‘ukubali,’ Kiswahili cha kawaida hutumia kitenzi-jina ‘kwenda.’
- source_word: אֶת עֲבָדֶיךָ
  choice: pamoja na watumishi wako
  rationale: Hapa אֶת huonyesha kuandamana, si yambwa. ‘Watumishi wako’ huhifadhi namna ya heshima ambayo wafuasi wa nabii wanajitaja bila kudokeza kwa lazima hali ya utumwa.
- source_word: אֲנִי אֵלֵךְ
  choice: Nitakwenda
  rationale: Jibu hili la moja kwa moja linatoa ahadi ya kwenda. Kiwakilishi cha wazi katika Kiebrania kina msisitizo mdogo, lakini Kiswahili hulibeba kwa kawaida ndani ya kiambishi ‘ni-’ bila kuhitaji ‘mimi mwenyewe.’
