  source_fidelity: Tafsiri inawakilisha kwa uaminifu הָאֶחָד kama “mmoja wao,” ombi la heshima הוֹאֶל נָא kama “Tafadhali, ukubali,” uandamani katika אֶת עֲבָדֶיךָ kama “pamoja na watumishi wako,” na jibu אֲנִי אֵלֵךְ kama “Nitakwenda.” “Mmoja wao” hufafanua kwa kawaida dokezo la kimuktadha lililo katika “yule mmoja” bila kuongeza maana ya maana.
