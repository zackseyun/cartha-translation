base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: sw
  text: Njaa kali ikawa katika Samaria. Na tazama, walikuwa wakiuzingira mji huo, mpaka kichwa cha punda kikauzwa kwa vipande themanini vya fedha, na robo ya kabi ya kinyesi cha njiwa[a] ikauzwa kwa vipande vitano vya fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kinyesi cha hua.” Baadhi ya wafafanuzi huelewa maneno haya kuwa kinyesi halisi; wengine huyachukulia kuwa jina la chakula cha bei nafuu au bidhaa ya mmea iliyouzwa wakati wa njaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: Njaa kali ikawa
  rationale: Huwasilisha mazingira mapya ya simulizi na uzito wa njaa kwa Kiswahili cha kawaida; 'kali' ni mwambatano wa asili zaidi na 'njaa' kuliko 'kubwa'.
- source_word: בְּשֹׁמְרוֹן
  choice: katika Samaria
  rationale: Kihusishi cha mahali kinaonyesha kwamba njaa ilikuwa ndani ya Samaria.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Huhifadhi kishazi cha kuvuta fikira kuelekea hali ya kushangaza inayofuata.
- source_word: צָרִים עָלֶיהָ
  choice: walikuwa wameuzingira mji huo
  rationale: Kauli ya Kiebrania inaonyesha hali ya kuendelea ya kuzingirwa; 'mji huo' huweka wazi rejeo la kiwakilishi cha kike kwa Samaria.
- source_word: עַד הֱיוֹת
  choice: mpaka ... kikauzwa kwa
  rationale: Muundo unaonyesha kiwango au matokeo ya kuzingirwa, yaani bei kupanda kupita kiasi.
- source_word: רֹאשׁ חֲמוֹר
  choice: kichwa cha punda
  rationale: Huhifadhi taswira ya moja kwa moja na ya kutisha ya chakula cha wakati wa njaa.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: kwa vipande themanini vya fedha
  rationale: Kiebrania hakitaji wazi shekeli; 'vipande vya fedha' huepuka kubainisha kipimo cha fedha kisichotajwa.
- source_word: רֹבַע הַקַּב
  choice: robo ya kipimo cha kabi
  rationale: Huhifadhi sehemu ya robo na jina la kipimo cha kale bila kukibadilisha kuwa ujazo wa kisasa usio na uhakika.
- source_word: חרי יונים
  choice: kinyesi cha njiwa
  rationale: Maana ya moja kwa moja ya maneno hayo ni kinyesi cha njiwa, ingawa utambulisho wa bidhaa inayokusudiwa unabishaniwa; utata huo umehifadhiwa katika tanbihi.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: kwa vipande vitano vya fedha
  rationale: Hufuata kwa uwiano muundo wa bei uliotangulia bila kuongeza kitengo maalumu kisichotajwa katika Kiebrania.
