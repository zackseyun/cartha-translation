  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: sw
  text: Basi mfalme wa Israeli akatuma watu[a] mahali pale ambako mtu wa Mungu alikuwa amemwambia mfalme habari zake na kumwonya. Naye akajihadhari huko[b]—si mara moja wala mbili tu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu “akatuma”; hakitaji wazi alichotuma. Inawezekana pia kutafsiri, “akatuma kwenda mahali pale.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akawa macho huko,” au, “akachukua tahadhari kuhusu mahali hapo.”
    reason: lexical_alternative
  - marker: c
    text: Nahau hii ina maana kwamba jambo hilo lilitokea mara nyingi, si mara moja au mbili tu.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi cha Kiebrania maana yake ya msingi ni ‘akatuma’ bila kutaja wazi alichotuma. Kwa kuwa Kiswahili huhitaji kijalizo hapa ili sentensi iwe ya kawaida, ‘watu’ limetolewa kutokana na muktadha, huku tanbihi ikihifadhi kutokutajwa kwake katika chanzo.
- source_word: הַמָּקוֹם
  choice: mahali pale
  rationale: Huhifadhi urejeleaji maalumu wa mahali palipotajwa katika simulizi na ni Kiswahili cha kawaida.
- source_word: אֲשֶׁר אָמַר לוֹ
  choice: ambapo ... alikuwa amemwambia ... juu pake
  rationale: Muundo huu unaonyesha kwamba mtu wa Mungu alikuwa amemweleza mfalme kuhusu mahali hapo, bila kufanya mahali penyewe kuwa ndicho kilichoambiwa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni tafsiri ya moja kwa moja ya cheo cha Kiebrania na haikifasiri kwa namna finyu zaidi kuwa ‘nabii.’
- source_word: וְהִזְהִירֹה
  choice: na kumwonya
  rationale: Huwasilisha maana ya Hifili ya זהר, yaani kutoa onyo au tahadhari, na kiambishi cha yambwa kinarejelea mfalme.
- source_word: וְנִשְׁמַר
  choice: Naye akajihadhari
  rationale: Huwasilisha maana ya kujilinda au kuchukua tahadhari ya muundo wa Nifali, kwa Kiswahili cha sasa na cha kawaida.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki kinarejelea mahali pale alipoonywa mfalme.
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: si mara moja wala mbili
  rationale: Huhifadhi nahau ya Kiebrania kwa karibu, huku ikidokeza kwamba jambo hilo lilitokea mara nyingi.
