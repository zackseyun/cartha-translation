  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: sw
  text: Akasema, “Usiogope, kwa maana walio pamoja nasi ni wengi kuliko walio pamoja nao.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata mpangilio wa maneno kwa ukaribu zaidi: “kwa maana ni wengi walio pamoja nasi kuliko walio pamoja nao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Kitenzi hiki kinaendeleza simulizi. “Akasema” ni Kiswahili cha kawaida na huhifadhi maana ya kitendo kilichofuata katika simulizi bila kulazimisha kiunganishi “na”.
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: אַל pamoja na kitenzi kinachofuata huonyesha katazo. “Usiogope” ni tafsiri fupi, ya kawaida, na inayomwelekea mtu mmoja kama ilivyo katika Kiebrania.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaleta sababu ya kutokuogopa. “Kwa maana” huonyesha uhusiano huo wazi na kwa lugha yenye hadhi.
- source_word: רַבִּים
  choice: ni wengi kuliko
  rationale: Ingawa neno lenyewe humaanisha “wengi,” muundo unaofuata wenye מִן unaifanya sentensi kuwa ya ulinganisho. “Ni wengi kuliko” ni Kiswahili cha asili kinachohifadhi ulinganisho huo.
- source_word: אֲשֶׁר אִתָּנוּ
  choice: walio pamoja nasi
  rationale: Kishazi hiki kinatumika kama nomino na kumaanisha wale walio upande mmoja nasi. “Walio pamoja nasi” huhifadhi muundo na kutotaja utambulisho wao.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: kuliko walio pamoja nao
  rationale: מִן inaleta kipimo cha ulinganisho. Kitenzi cha kuwa pamoja kimeachwa katika sehemu ya pili ya Kiebrania lakini kinaeleweka kutokana na usambamba; kukitaja katika Kiswahili hufanya maana iwe wazi na ya kawaida.
theological_decisions:
- issue: Utambulisho wa walio pamoja nasi
  choice: Umeachwa bila kutajwa, kama katika mstari wa Kiebrania.
  alternative: Kuwataja kuwa jeshi la mbinguni au malaika kwa kuzingatia muktadha unaofuata.
  rationale: Mstari huu wenyewe hautambulishi walio pamoja nao. Kutowataja kunahifadhi ufupi na mvutano wa simulizi bila kuingiza ufafanuzi wa muktadha katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. “Pamoja nasi/nao” imechaguliwa badala ya “upande wetu/wao” ili kuhifadhi picha pana ya Kiebrania bila kuifasiri kupita kiasi.
