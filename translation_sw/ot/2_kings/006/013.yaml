lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Kauli ya kawaida ya masimulizi ya Kiebrania; “akasema” huendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: לְכוּ וּרְאוּ
  choice: Nendeni mkaone
  rationale: Vitenzi vyote ni amri za wingi. Muundo wa “nendeni mkaone” ni wa asili katika Kiswahili na unadumisha maana ya kwenda kuchunguza.
- source_word: אֵיכֹה הוּא
  choice: aliko
  rationale: Hueleza mahali alipo kwa kifupi na kwa Kiswahili cha kawaida bila kuongeza uhakika au mashaka yasiyomo wazi katika chanzo.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: ili nitume watu wakamkamate
  rationale: Mfuatano huu unaeleweka kwa asili kama kusudi. Kitenzi “nitume” kwa muktadha kinadokeza watu watakaotumwa; “wakamkamate” hutoa maana ya kumtia mtu mikononi katika mazingira haya ya uhasama.
- source_word: וַיֻּגַּד לוֹ
  choice: Kisha akaambiwa
  rationale: Hudumisha hali ya kutendwa ya Kiebrania kwa Kiswahili cha asili; “kisha” huendeleza mfuatano wa simulizi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira za msikilizaji kwenye taarifa inayofuata; “Tazama” ni la sasa, lenye hadhi, na linalotambulika katika usomaji wa Biblia.
- source_word: בְדֹתָן
  choice: yuko Dothani
  rationale: Kihusishi ni cha mahali. “Dothani” ni umbo la jina la mahali lililozoeleka katika Kiswahili cha Biblia.
