  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: sw
  text: Akasema[a], “Nendeni mkaone aliko, ili nitume nikamchukue.” Na akaambiwa, “Tazama[b], yuko Dothani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata mfuatano wa maneno ya Kiebrania kwa karibu zaidi, “nami nitatuma na kumchukua”; hapa mfuatano huo huenda unaonyesha kusudi: “ili nitume nikamchukue.”'
    reason: lexical_alternative
  - marker: b
    text: Dothani ulikuwa mji uliokuwa kaskazini mwa Samaria; pia unatajwa katika simulizi la Yosefu (Mwa. 37:17).
