translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi wa amri umehifadhiwa katika “Nendeni mkaone.” Usemi “nitume watu” unaweka wazi yambwa linalodokezwa na kitenzi cha kutuma kwa Kiswahili, bila kubadili mhusika au kusudi. Alama zote za tanbihi [a] na [b] zipo katika matini kuu.
