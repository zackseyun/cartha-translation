  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: sw
  text: Basi, Naamanu akaja pamoja na farasi wake na magari yake ya vita[a], akasimama kwenye mlango wa nyumba ya Elisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, neno kwa neno, “kwa farasi wake na kwa gari lake la vita”; maumbo ya umoja huenda yametumiwa kwa maana ya jumla, yaani farasi na magari ya vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Katika mfululizo huu wa masimulizi, בוא inaonyesha Naamanu kuwasili mahali alipokuwa Elisha; “akaja” ni ya kawaida na inadumisha mwendo rahisi wa simulizi.
- source_word: נַעֲמָן
  choice: Naamanu
  rationale: Jina limeandikwa kwa umbo linalotumika kwa kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: בְסוּסוֹ
  choice: pamoja na farasi wake
  rationale: Ingawa umbo la Kiebrania ni la umoja, linaweza kutumiwa kwa maana ya jumla katika muktadha huu wa msafara; wingi unaeleweka kwa kawaida katika Kiswahili.
- source_word: וּבְרִכְבּוֹ
  choice: na magari yake ya vita
  rationale: רֶכֶב inaweza kumaanisha gari la vita au magari ya vita kwa maana ya jumla. Hapa wingi unafaa muktadha wa farasi na msafara wa afisa mkuu, huku “ya vita” ikibainisha aina ya magari.
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: עָמַד kwa kawaida humaanisha kusimama; tafsiri hii inadumisha taswira ya Naamanu akiwa mbele ya nyumba badala ya kupunguza maana kuwa “akasimama safari.”
- source_word: פֶּתַח הַבַּיִת
  choice: kwenye mlango wa nyumba
  rationale: פֶּתַח ni nafasi ya kuingilia au mlango. “Kwenye mlango wa nyumba” ni Kiswahili cha kawaida na cha wazi.
- source_word: לֶאֱלִישָׁע
  choice: ya Elisha
  rationale: Katika muktadha huu, ל inaonyesha nyumba inayomhusu au inayomilikiwa na Elisha; “ya Elisha” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
