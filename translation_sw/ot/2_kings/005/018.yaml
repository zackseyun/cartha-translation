  to: '“Kwa jambo hili, Yahwe na amsamehe mtumishi wako: bwana wangu anapoingia katika nyumba ya Rimoni[b] ili kuinama[a] huko, naye akijitegemeza kwa mkono wangu, nami ninainama katika nyumba ya Rimoni—ninapoinama katika nyumba ya Rimoni, Yahwe na amsamehe mtumishi wako, tafadhali, kwa jambo hili.”'
