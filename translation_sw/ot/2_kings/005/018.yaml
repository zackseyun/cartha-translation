base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: sw
  text: '“Kwa jambo hili, Yahwe na amsamehe mtumishi wako: bwana wangu anapoingia katika nyumba ya Rimoni[b] ili kuinama[a] huko, naye akijitegemeza kwa mkono wangu, nami ninainama katika nyumba ya Rimoni—ninapoinama katika nyumba ya Rimoni, Yahwe na amsamehe mtumishi wako, tafadhali, kwa jambo hili.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuabudu huko”; kitenzi cha Kiebrania kinaweza kumaanisha tendo la kuinama kwa mwili au tendo la kuabudu.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Rimoni” ni hekalu au mahali patakatifu pa Rimoni, mungu wa Waaramu.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: na amsamehe
  rationale: Umbo hili linawasilisha ombi la Naamani kwamba Mungu amsamehe katika jambo maalumu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: לְעַבְדֶּךָ
  choice: mtumishi wako
  rationale: Hii ni lugha ya heshima ambayo Naamani anatumia kujitaja mbele ya nabii; “mtumishi” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: בְּבוֹא אֲדֹנִי
  choice: bwana wangu anapoingia
  rationale: Kiambishi ב pamoja na kitenzi-jina kinaonyesha wakati; “bwana wangu” hapa ni mfalme anayehudumiwa na Naamani.
- source_word: בֵית רִמּוֹן
  choice: nyumba ya Rimoni
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania, huku tanbihi ikifafanua kuwa ni hekalu au mahali patakatifu pa mungu huyo.
- source_word: לְהִשְׁתַּחֲוֺת / וְהִשְׁתַּחֲוֵיתִי / בְּהִשְׁתַּחֲוָיָתִי
  choice: kuinama / ninainama / ninapoinama
  rationale: Mzizi huu unaweza kumaanisha tendo la kimwili la kuinama au ibada. “Kuinama” huhifadhi utata kuhusu kusudi la ndani la Naamani.
- source_word: נִשְׁעָן עַל יָדִי
  choice: akiegemea mkono wangu
  rationale: Inadumisha taswira ya mfalme kujisaidia kwa mkono wa Naamani anapoingia na kuinama.
- source_word: נָא
  choice: tafadhali
  rationale: Neno hili linaonyesha ombi la heshima na kusisitiza dua ya Naamani.
theological_decisions:
- issue: Iwapo הִשְׁתַּחֲוָה itafsiriwe kama “kuabudu” au kama tendo la kimwili la “kuinama” katika hekalu la kipagani
  choice: kuinama
  alternative: kuabudu; kusujudu
  rationale: Kitenzi cha Kiebrania kinaweza kueleza kuabudu au kuinama kwa mwili. Tafsiri “kuinama” haikatui kimya kimya swali la uaminifu wa ndani wa Naamani, bali inadumisha mvutano wa simulizi na wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “nyumba ya Rimoni” na ombi la msamaha umehifadhiwa kwa sababu ni sehemu ya msisitizo wa maandishi ya Kiebrania. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
