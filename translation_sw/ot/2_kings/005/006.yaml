  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: sw
  text: Akaileta barua hiyo kwa mfalme wa Israeli, nayo ilisema, “Na sasa, barua hii itakapokufikia, tazama, nimekutumia Naamani, mtumishi wangu, ili umponye ugonjwa wake wa ngozi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa maneno halisi, “umkusanye kutoka katika ugonjwa wake wa ngozi,” usemi usio wa kawaida wenye maana ya kumponya. Neno la Kiebrania hutafsiriwa kwa desturi kuwa “ukoma,” lakini linaweza kumaanisha magonjwa mbalimbali ya ngozi, si lazima ugonjwa wa Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Akaileta
  rationale: Hifili ya בוא ina ‘barua’ kama yambwa wake; ‘akaileta’ inaonyesha maana hiyo ya kusababisha kitu kifike bila kuongeza wazo la kukabidhi rasmi.
- source_word: הַסֵּפֶר
  choice: barua hiyo
  rationale: Katika muktadha huu wa mawasiliano kati ya wafalme, סֵפֶר ni ujumbe ulioandikwa, hivyo ‘barua’ ni Kiswahili cha kawaida na sahihi.
- source_word: לֵאמֹר
  choice: nayo ilisema
  rationale: Hufanya wazi kwa Kiswahili kwamba maneno yanayofuata ni yaliyomo katika barua, huku ikihifadhi kazi ya fomula ya Kiebrania ya kuanzisha nukuu.
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi na alama rasmi ya kuendeleza mazungumzo katika barua ya kifalme.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: barua hii itakapokufikia
  rationale: Muundo wa כ pamoja na kitenzi-jina una maana ya wakati; ‘itakapokufikia’ ni ya asili katika Kiswahili na inabaki karibu na picha ya barua kumjia mpokeaji.
- source_word: הִנֵּה
  choice: tazama
  rationale: Inahifadhi nguvu ya neno la kuvuta uangalifu na sauti rasmi ya ujumbe, bila kuligeuza kuwa kauli ya maelezo tu.
- source_word: שָׁלַחְתִּי
  choice: nimekutumia
  rationale: Wakati timilifu wa Kiswahili unaonyesha kwamba Naamani ametumwa na sasa anafika kwa mpokeaji wa barua.
- source_word: נַעֲמָן
  choice: Naamani
  rationale: Hufuata umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: עבד katika lugha ya ikulu inaweza kumaanisha mtumishi au afisa aliye chini ya mfalme; ‘mtumishi wangu’ haiweke hadhi maalumu isiyotajwa wazi.
- source_word: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: ili umponye ugonjwa wake wa ngozi
  rationale: אסף pamoja na מן na jina la ugonjwa ni usemi usio wa kawaida ambao katika muktadha huu unadai kuondolewa kwa ugonjwa. Kiswahili cha neno kwa neno, ‘umkusanye kutoka katika ugonjwa wake,’ kingekuwa kisichoeleweka; maana ya kimuktadha imetolewa katika matini, na picha halisi pamoja na tafsiri ya jadi zimehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya צָרַעַת
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: צָרַעַת ya Biblia ya Kiebrania ina wigo mpana kuliko ugonjwa wa Hansen unaoitwa ukoma leo. Tafsiri kuu huepuka usahihi wa kitabibu usiokuwamo katika chanzo, huku tanbihi ikihifadhi istilahi ya jadi.
- issue: Usemi וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: ili umponye ugonjwa wake wa ngozi
  alternative: ili umkusanye kutoka katika ugonjwa wake wa ngozi
  rationale: Maana inayokusudiwa katika ombi la mfalme ni kuondolewa kwa maradhi, lakini kitenzi אסף kwa kawaida humaanisha ‘kukusanya’ au ‘kuingiza.’ Tafsiri ya matini ni ya asili na inayoeleweka, huku tanbihi ikihifadhi usemi halisi usio wa kawaida badala ya kuficha mvutano wake wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa barua ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. ‘Tazama’ huhifadhi sauti rasmi ya הִנֵּה; ‘nayo ilisema’ ni ya asili kuliko ‘akisema’ kwa kuwa msemaji hapa ni barua. Tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja.
