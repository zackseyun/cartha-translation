base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: sw
  text: Kisha akarudi kwa mtu wa Mungu, yeye pamoja na msafara wake wote. Akafika, akasimama mbele yake, akasema, “Tazama, nimejua sasa kwamba hakuna Mungu katika dunia yote isipokuwa katika Israeli. Na sasa, tafadhali pokea zawadi[a] kutoka kwa mtumishi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “baraka.” Hapa neno la Kiebrania linamaanisha zawadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi jina la cheo la Kiebrania kwa nabii au msemaji wa Mungu bila kulifafanua zaidi kuwa ‘nabii wa Mungu.’
- source_word: מַחֲנֵהוּ
  choice: msafara wake
  rationale: Ingawa neno hilo linaweza kumaanisha ‘kambi yake,’ hapa linarejelea kundi lililoandamana na Naamani; ‘msafara wake’ ni Kiswahili cha kawaida kinachofaa muktadha.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: akasimama mbele yake
  rationale: Huhifadhi usemi wa Kiebrania wa kufika na kujitokeza mbele ya mtu kwa lugha wazi na ya kawaida.
- source_word: הִנֵּה נָא
  choice: Tazama, sasa
  rationale: Huonyesha mwito wa kusikiliza kwa makini na msisitizo wa usemi bila kutumia lugha ya kizamani isiyo ya lazima.
- source_word: יָדַעְתִּי
  choice: najua
  rationale: Kauli timilifu ya Kiebrania inaonyesha hali ya sasa iliyotokana na utambuzi mpya; ‘najua’ ni ya asili katika Kiswahili.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: hakuna Mungu katika dunia yote isipokuwa katika Israeli
  rationale: Huhifadhi dai thabiti kuhusu upekee wa Mungu na pia maneno ya mahali ‘katika Israeli’ bila kuongeza ‘Mungu wa Israeli.’
- source_word: בְרָכָה
  choice: zawadi
  rationale: Maana ya msingi ni ‘baraka,’ lakini katika muktadha wa kumpa mtu kitu, neno hili humaanisha zawadi; maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Hapa ni namna ya Naamani kujitaja kwa heshima, si msisitizo wa hali ya utumwa.
- source_word: קַח נָא
  choice: tafadhali pokea
  rationale: Ingawa kitenzi ni ‘chukua,’ katika muktadha huu ni ombi la kukubali zawadi, hivyo ‘pokea’ huwasilisha kusudi lake kwa ufasaha.
theological_decisions:
- issue: Ungamo la Naamani kwamba hakuna Mungu isipokuwa katika Israeli
  choice: Limetafsiriwa kama ungamo la moja kwa moja kuhusu upekee wa Mungu, huku maneno ‘katika Israeli’ yakihifadhiwa.
  alternative: ‘Hakuna mungu katika dunia yote isipokuwa Mungu wa Israeli.’
  rationale: Kiebrania kinatoa dai lenye nguvu lakini hakisemi moja kwa moja ‘Mungu wa Israeli’ katika kifungu hiki; tafsiri haipaswi kulainisha dai hilo wala kuongeza maneno ya kulifafanua kimfumo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi umesawazishwa kwa usomaji wa kawaida, huku marudio na msisitizo wa msingi wa Kiebrania vikihifadhiwa.
