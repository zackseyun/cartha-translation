base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: sw
  text: Ndipo mfalme wa Aramu[a] akasema, “Nenda basi,[b] nami nitatuma barua kwa mfalme wa Israeli.” Basi akaenda, akachukua pamoja naye talanta kumi za fedha, vipande elfu sita vya dhahabu,[c] na seti kumi za mavazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aramu ni jina la Kiebrania; katika tafsiri na mapokeo mengine huitwa Shamu au Siria.
    reason: alternative_reading
  - marker: b
    text: Kiebrania kina amri mbili, kihalisi “Nenda, njoo,” ambazo huenda zinaonyesha ruhusa au himizo la kuondoka mara moja.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema “elfu sita dhahabu”; hakitaji wazi kitu au kipimo kilichohesabiwa. Neno “vipande” limeongezwa ili maana isomeke kwa kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: Nenda basi
  rationale: Amri mbili za Kiebrania, kihalisi ‘nenda, njoo,’ zinafanya kazi kama ruhusa au himizo la kuondoka mara moja. ‘Nenda basi’ ni Kiswahili cha kawaida kinachowasilisha nguvu hiyo bila kudokeza kwamba mfalme angeandamana naye.
- source_word: סֵפֶר
  choice: barua
  rationale: Katika mawasiliano ya kidiplomasia kati ya wafalme, neno hili linamaanisha ujumbe ulioandikwa; ‘barua’ ndilo neno la kawaida na sahihi katika muktadha huu.
- source_word: בְּיָדוֹ
  choice: pamoja naye
  rationale: Kihalisi ni ‘mkononi mwake,’ lakini hapa ni nahau ya kuwa na vitu na kuvisafirisha. ‘Pamoja naye’ ni ya asili katika Kiswahili na haimaanishi kwamba kiasi chote kilibebwa mkononi halisi.
- source_word: כִּכְּרֵי כֶסֶף
  choice: talanta kumi za fedha
  rationale: Talanta ni kipimo kikubwa cha uzito cha kale. Kuhifadhi kipimo hicho huepuka ubadilishaji wa kukisia.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: vipande elfu sita vya dhahabu
  rationale: Kiebrania kinasema kihalisi ‘elfu sita dhahabu’ bila kutaja wazi kipimo au kitu kinachohesabiwa. ‘Vipande’ kinaongezwa ili sentensi iwe ya kawaida katika Kiswahili, huku tanbihi ikihifadhi ukosefu huo wa ubainisho.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: mavazi kumi ya kubadilisha
  rationale: Kirai kinamaanisha mavazi mbadala au seti za nguo, ambazo katika muktadha huu ni zawadi za thamani. Utoaji huu ni wazi bila kuongeza aina maalumu ya vazi.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: ‘Aramu’ huhifadhi jina la Kiebrania la eneo na watu hawa badala ya kulibadilisha kuwa jina la baadaye la kijiografia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Ndipo’ na ‘basi’ huhifadhi mwendelezo wa simulizi bila kufanya lugha iwe ya kizamani. Vipimo vya kale na majina ya asili yamehifadhiwa, na mahali ambapo Kiebrania hakibainishi kipimo cha dhahabu, utata huo umeelezwa katika tanbihi.
