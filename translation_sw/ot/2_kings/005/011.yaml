  text: וַ/יִּקְצֹ֥ף נַעֲמָ֖ן וַ/יֵּלַ֑ךְ וַ/יֹּאמֶר֩ הִנֵּ֨ה אָמַ֜רְתִּי אֵלַ֣/י יֵצֵ֣א יָצ֗וֹא וְ/עָמַד֙ וְ/קָרָא֙ בְּ/שֵׁם יְהוָ֣ה אֱלֹהָ֔י/ו וְ/הֵנִ֥יף יָד֛/וֹ אֶל הַ/מָּק֖וֹם וְ/אָסַ֥ף הַ/מְּצֹרָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: sw
  text: Lakini Naamani akakasirika, akaondoka, akasema, “Tazama, nilijiambia, ‘Bila shaka atatoka nje na kuja kwangu, atasimama na kuliitia jina la Yahwe, Mungu wake, atapunga mkono wake kuelekea mahali pale, na kumponya mwenye ugonjwa wa ngozi[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuondoa ugonjwa wa ngozi.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kukusanya” au “kuondoa,” na neno la mwisho linaweza kurejelea mtu aliyeathiriwa na hali ya ngozi. Hali hiyo haikuwa lazima iwe ukoma (ugonjwa wa Hansen) unaotambuliwa leo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: akakasirika
  rationale: Kitenzi קצף huonyesha hasira; ‘akakasirika’ ni Kiswahili cha kawaida kinachodumisha mabadiliko ya hali bila kuzidisha kiwango cha ghadhabu.
- source_word: וַיֵּלַךְ
  choice: akaondoka
  rationale: Katika muktadha huu הלך inaonyesha Naamani kuondoka kwa hasira kutoka nyumbani kwa Elisha, si kwenda kusikoelezwa tu.
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: Tazama, nilijiambia
  rationale: ‘Tazama’ inadumisha msisitizo wa הִנֵּה, na ‘nilijiambia’ inaakisi moja kwa moja nahau ya Kiebrania ya kusema moyoni.
- source_word: יֵצֵא יָצוֹא
  choice: Bila shaka atatoka nje
  rationale: Muundo wa kitenzi pamoja na infinitivu kamili unasisitiza matarajio ya Naamani; ‘bila shaka’ huwasilisha msisitizo huo kwa Kiswahili cha asili.
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: kuliitia jina la Yahwe, Mungu wake
  rationale: Usemi ‘kuliitia jina’ unadumisha nahau ya kumwomba au kumwita Mungu kwa jina lake, bila kuibadili kuwa maelezo ya dhehebu fulani.
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: atapunga mkono wake kuelekea mahali pale
  rationale: הניף huonyesha mwendo wa kupunga, na אֶל huonyesha mwelekeo; ‘kuelekea mahali pale’ huepuka kulazimisha maana ya ‘juu ya’ isiyo lazima.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: kumponya mwenye ugonjwa wa ngozi
  rationale: הַמְּצֹרָע kwa kawaida humaanisha mtu aliyeathiriwa, huku אסף katika muktadha huu ikieleza kuondolewa kwa hali yake. Tafsiri hii ni ya asili na haifanyi ugonjwa huo wa kibiblia kuwa utambuzi maalumu wa kisasa.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina maalumu יהוה; ‘Yahwe’ hulitambulisha kama jina badala ya kulibadili kuwa cheo.
- issue: Lugha inayohusiana na צרעת
  choice: mwenye ugonjwa wa ngozi
  alternative: mwenye ukoma
  rationale: Neno la kibiblia linaweza kuhusisha hali mbalimbali za ngozi na si lazima ugonjwa wa Hansen unaoitwa ukoma leo; chaguo hili huepuka utambuzi wa kitabibu usiohakikishwa.
- issue: Yule anayeponywa katika הַמְּצֹרָע
  choice: mtu aliyeathiriwa
  alternative: ugonjwa wenyewe unaondolewa
  rationale: Umbo la Kiebrania linaweza kueleweka kwa kawaida kama nomino iliyotokana na kivumishi, ‘mtu mwenye hali hiyo’; tanbihi inadumisha usemi mbadala unaolenga kuondolewa kwa ugonjwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa Maandiko. Mfululizo wa vitenzi wenye ‘aka-’ unadumisha mwendo wa simulizi; ndani ya nukuu, lugha ni ya kisasa lakini inahifadhi msisitizo na taswira ya Kiebrania.
