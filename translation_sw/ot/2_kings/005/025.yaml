base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: sw
  text: Lakini akaja, akasimama mbele ya bwana wake. Elisha akamwambia, “Umetoka wapi, Gehazi?”[a] Naye akasema, “Mtumishi wako hakuenda popote.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Kutoka wapi, Gehazi?”'
    reason: lexical_alternative
  - marker: b
    text: 'Nahau ya Kiebrania: “Mtumishi wako hakuenda huku wala kule.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Lakini
  rationale: Kiunganishi pamoja na kiwakilishi kinaendeleza simulizi huku kikionyesha tofauti ndogo baada ya matendo ya siri ya Gehazi; “Lakini” huleta mgeuko huo kwa Kiswahili cha kawaida.
- source_word: בָא
  choice: akaingia
  rationale: Kitenzi kimsingi ni “akaja,” lakini katika muktadha Gehazi anaingia tena mbele ya Elisha; “akaingia” huonyesha mwendo huo kwa lugha ya kawaida bila kupanua maana kupita kiasi.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: na kusimama mbele ya bwana wake
  rationale: Usemi huu unaonyesha kusimama mbele ya mwenye mamlaka katika hali ya kumhudumia au kutoa taarifa; “mbele ya” huhifadhi picha ya Kiebrania.
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Hapa neno linamtaja Elisha kama mkuu wa Gehazi, si Mungu; “bwana wake” ni la kawaida katika uhusiano wa bwana na mtumishi.
- source_word: מֵאָן
  choice: Umetoka wapi
  rationale: Swali la Kiebrania kihalisi ni “Kutoka wapi?” Kiswahili “Umetoka wapi?” ni cha asili na huhifadhi wazo la mahali alikotoka, bila kuongeza wazi wazo la muda.
- source_word: גֵּחֲזִי
  choice: Gehazi
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: Mtumishi wako hakuenda
  rationale: Kauli ya kujitaja kwa heshima, “mtumishi wako,” imehifadhiwa badala ya kuibadilisha kuwa “mimi,” kwa kuwa inaonyesha uhusiano na namna ya kusema.
- source_word: אָנֶה וָאָנָה
  choice: popote
  rationale: Nahau ina maana ya “huku au kule,” yaani kwenda mahali popote; “popote” ni fupi, ya kawaida, na huhifadhi nguvu ya kukana.
