base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: sw
  text: Akasema, “Ni salama.[a] Bwana wangu amenituma niseme, ‘Tazama, sasa hivi vijana wawili kutoka nchi ya milima ya Efraimu, miongoni mwa wana wa manabii,[b] wamekuja kwangu. Tafadhali uwape talanta moja ya fedha[c] na seti mbili za mavazi.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Salama” au “Mambo ni salama.” Neno la Kiebrania shalom hapa linatumika kama uhakikisho kwamba hakuna tatizo.
    reason: lexical_alternative
  - marker: b
    text: “Wana wa manabii” ni usemi wa Kiebrania unaomaanisha wanachama wa jumuiya au kundi la manabii.
    reason: cultural_note
  - marker: c
    text: Talanta ni kipimo kikubwa cha uzito kilichotumiwa kupimia madini ya thamani.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Kila kitu kiko salama
  rationale: Katika mazungumzo haya neno hili linatoa uhakikisho kwamba hakuna tatizo; tafsiri hii inawasilisha maana hiyo ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Gehazi anamrejelea Elisha kama mkuu wake. ‘Bwana wangu’ ni usemi wa heshima unaoeleweka katika muktadha wa mtumishi na mkuu wake.
- source_word: שְׁלָחַנִי לֵאמֹר
  choice: amenituma niseme
  rationale: Muundo huu unaonyesha tendo lililokamilika lenye umuhimu wa sasa na kusudi la kuwasilisha ujumbe; usemi huu ni wa asili katika Kiswahili.
- source_word: הִנֵּה עַתָּה זֶה
  choice: Tazama, sasa hivi
  rationale: ‘Tazama’ hudumisha kiashiria cha kuvuta fikira, na ‘sasa hivi’ huhifadhi wazo la jambo lililotokea muda mfupi uliopita.
- source_word: נְעָרִים
  choice: vijana
  rationale: Neno linaweza kumaanisha vijana au watumishi; kwa kuwa wanatajwa kuwa sehemu ya jumuiya ya kinabii, ‘vijana’ ndiyo tafsiri isiyoingiza dhana ya ziada.
- source_word: מֵהַר אֶפְרַיִם
  choice: kutoka nchi ya milima ya Efraimu
  rationale: Kirai hiki kwa kawaida hurejelea eneo la nyanda za juu la Efraimu, si mlima mmoja tu.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: miongoni mwa wana wa manabii
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania huku tanbihi ikifafanua kuwa ni wanachama wa jumuiya ya kinabii.
- source_word: תְּנָה נָּא
  choice: Tafadhali uwape
  rationale: Neno נָא hulainisha amri na kuifanya ombi la adabu; ‘tafadhali’ huwasilisha sauti hiyo kwa kawaida.
- source_word: כִּכַּר כֶּסֶף
  choice: talanta moja ya fedha
  rationale: ‘Talanta’ huhifadhi kipimo mahususi cha uzito badala ya kukibadili kuwa kiasi kisicho dhahiri cha pesa.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: seti mbili za mavazi
  rationale: Kirai kinamaanisha mavazi mawili kamili ya kubadilisha; ‘seti mbili za mavazi’ ni wazi na ya kawaida kwa msomaji wa sasa.
