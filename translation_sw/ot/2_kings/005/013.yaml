base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: sw
  text: Ndipo watumishi wake wakamkaribia, wakamwambia, “Baba yangu, kama nabii angekuambia jambo kubwa, je, usingelifanya? Basi, je, si zaidi sana akikuambia, ‘Oga, nawe uwe safi[a]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nawe utakasike.” Neno la Kiebrania linaweza kumaanisha kuwa safi au kutakasika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: wakamkaribia
  rationale: Kitenzi hiki kinaonyesha watumishi wakimsogelea Naamani; ‘wakamkaribia’ ni cha kawaida katika Kiswahili cha simulizi na kinahifadhi mwendo pamoja na tahadhari ya kijamii.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha huu ni watu walio chini ya mamlaka ya Naamani wanaomsemesha kwa heshima. ‘Watumishi’ linafaa bila kusisitiza hali ya utumwa ambayo kifungu hakiiweki mbele.
- source_word: אָבִי
  choice: Baba yangu
  rationale: Hili ni neno la heshima kutoka kwa walio chini kwenda kwa mkuu wao, si dai la uhusiano wa kimwili. Taswira ya asili imehifadhiwa.
- source_word: דָּבָר גָּדוֹל
  choice: jambo kubwa
  rationale: Kirai kinaweza kueleza jambo zito, la ajabu, au lenye masharti magumu. ‘Jambo kubwa’ kinahifadhi upana huo bila kulifafanua kupita kiasi.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: je, usingelifanya?
  rationale: Swali hili la balagha linatarajia jibu la ndiyo; umbo la masharti la Kiswahili linaendana na hoja ya sentensi.
- source_word: וְאַף כִּי
  choice: Basi, si zaidi sana
  rationale: Kirai hiki kinatoa hoja kutoka jambo kubwa kwenda jambo jepesi zaidi. Tafsiri hii inahifadhi msisitizo wa ‘zaidi sana’ bila kuongeza maelezo yasiyo katika matini.
- source_word: רְחַץ
  choice: Oga
  rationale: Amri fupi na ya moja kwa moja inayofaa muktadha wa Naamani kujizamisha au kuosha mwili wake.
- source_word: וּטְהָר
  choice: nawe uwe safi
  rationale: Huhifadhi matokeo ya kuwa safi huku ikiruhusu maana za kupona na utakaso zinazokutana katika muktadha huu.
theological_decisions:
- issue: Maana ya טהר katika kuponywa kwa Naamani
  choice: nawe uwe safi
  alternative: nawe utakasike
  rationale: Kifungu kinahusu kuondolewa kwa ugonjwa wa ngozi, huku lugha yake pia ikiwa na mwangwi wa usafi au utakaso. ‘Uwe safi’ kinahifadhi mvutano huo bila kuingiza istilahi maalumu ya kimadhehebu; chaguo jingine limewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi umetumia viambishi vya mfululizo (‘wakamkaribia ... kusema’), na ‘Baba yangu’ limehifadhiwa kama tamko la heshima. Muundo wa hoja ya Kiebrania umehifadhiwa kwa ukaribu ingawa ‘si zaidi sana’ una ladha ya balagha ya kifasihi.
