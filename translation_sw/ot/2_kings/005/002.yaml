base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: sw
  text: Vikosi vya Waaramu vilikuwa vimetoka, navyo vikamchukua mateka kutoka nchi ya Israeli msichana mdogo[a]. Msichana huyo akawa akimhudumia mke wa Naamani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msichana mchanga.” Maneno ya Kiebrania נַעֲרָה קְטַנָּה yanamweleza kuwa msichana mdogo.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “akawa mbele ya mke wa Naamani,” yaani, alikuwa akimhudumia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: Vikosi vya Waaramu
  rationale: Ingawa muundo wa Kiebrania unaanza kwa jina Aramu na baadaye kutaja vikosi, kitenzi cha wingi kinaonyesha kuwa watendaji ni vikosi vya Waaramu, si nchi yenyewe.
- source_word: יָצְאוּ
  choice: vilikuwa vimetoka
  rationale: Kauli timilifu inaonyesha tendo la awali linaloweka mazingira kabla ya kuchukuliwa kwa mateka; hali ya wakati uliopita timilifu huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: גְדוּדִים
  choice: vikosi
  rationale: Neno linamaanisha vikundi vya kijeshi au vya uvamizi. “Vikosi” ni la kawaida na lenye hadhi, huku muktadha wa kuchukua mateka ukidokeza uvamizi.
- source_word: וַיִּשְׁבּוּ
  choice: navyo vikamchukua mateka
  rationale: Kitenzi kinamaanisha kumkamata mtu na kumfanya mateka, si kumshika tu; “kumchukua mateka” huhifadhi maana hiyo.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: kutoka nchi ya Israeli
  rationale: Tafsiri hii huhifadhi rejeo la wazi la kijiografia lililo katika neno אֶרֶץ.
- source_word: נַעֲרָה קְטַנָּה
  choice: msichana mdogo
  rationale: Muunganiko huu unasisitiza ujana na udogo wake bila kuongeza kwamba tayari alikuwa mtumishi.
- source_word: וַתְּהִי לִפְנֵי
  choice: akawa akimhudumia
  rationale: Kwa neno ni “akawa mbele ya,” lakini hapa ni nahau ya kuwa katika huduma au kuhudumu mbele ya mtu. Tafsiri hii hutoa maana ya nahau kwa Kiswahili asilia.
- source_word: אֵשֶׁת נַעֲמָן
  choice: mke wa Naamani
  rationale: Muundo huu wa umilikaji ni wa kawaida katika Kiswahili na huhifadhi uhusiano wa maneno ya Kiebrania.
