  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: sw
  text: Akamwambia, “Nenda kwa amani.” Naye akaondoka kwake, akasafiri umbali fulani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kipande cha nchi.” Kirai hiki huonyesha umbali wa safari bila kutaja kipimo kamili.'
