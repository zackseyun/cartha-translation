lexical_decisions:
- source_word: וַיֹּאמֶר לּוֹ
  choice: Akamwambia
  rationale: Muundo huu wa kawaida wa masimulizi unaunganisha kitenzi ‘alisema’ na yambwa ‘yeye’ kwa Kiswahili cha asili, bila kuongeza jina ambalo halipo katika mstari huu.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Nenda kwa amani
  rationale: Ni tamko fupi la kumruhusu mtu aondoke huku akimtakia amani; linahifadhi maana ya שָׁלוֹם bila kulipanua kuwa kibali au hukumu ya kimaadili.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: Basi akaondoka kwake, akaenda
  rationale: ‘Akaondoka kwake’ huonyesha kuondoka mbele ya Elisha, na ‘akaenda’ huendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: כִּבְרַת אָרֶץ
  choice: umbali fulani
  rationale: Kirai hiki huonyesha sehemu au kipimo kisichotajwa kwa usahihi cha safari ya ardhini. ‘Umbali fulani’ huepuka kudokeza kwamba ulikuwa umbali mkubwa kwa lazima.
theological_decisions:
- issue: Jibu la Elisha baada ya ombi la Naamani kuhusu nyumba ya Rimoni
  choice: Kutafsiri tu tamko ‘Nenda kwa amani’ bila kulifafanua zaidi
  alternative: Kulieleza kuwa kibali cha wazi kwa tendo alilopendekeza Naamani, au kuwa maneno ya kuagana yasiyo na uzito wowote wa kimaadili
  rationale: Kiebrania kina tamko fupi la baraka na kuagana pekee. Tafsiri haipaswi kuamua mvutano wa kimaadili na kiteolojia ambao maandishi yenyewe hayauamui wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi kama Kiebrania, huku ‘Basi’ ikifanya mfuatano wa masimulizi uwe wazi. Kielezi ‘kwake’ kinamrejelea Elisha kulingana na muktadha.
