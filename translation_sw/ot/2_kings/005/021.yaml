base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: sw
  text: Basi Gehazi akamfuata Naamani. Naamani alipomwona Gehazi akimfuata kwa mbio, akashuka kutoka kwenye gari la farasi ili kumlaki, akamuuliza, “Je, mambo ni salama?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia neno shalom, ambalo hapa ni swali kuhusu hali njema: “Je, ni salama?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: akamfuata
  rationale: Kitenzi רדף kina maana ya kufuatilia au kukimbiza. Katika muktadha huu, “akamfuata” kinaonyesha kumwandama kwa kusudi bila kudokeza uhasama usiotajwa.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: alipomwona akikimbia nyuma yake
  rationale: Tafsiri hii inahifadhi tendo la kuona pamoja na kitendo kinachoendelea cha Gehazi kukimbia nyuma ya Naamani.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: akashuka kutoka kwenye gari la farasi
  rationale: Ingawa נפל kwa kawaida ni “kuanguka,” hapa ni nahau ya kushuka kwenye gari, si ajali. “Gari la farasi” linaeleza kwa kawaida aina ya gari la kale linalokusudiwa na הַמֶּרְכָּבָה.
- source_word: לִקְרָאתוֹ
  choice: ili kumlaki
  rationale: לקראת מציין kwenda kukutana na mtu anayekuja; “kumlaki” ni usemi fasaha na wa kawaida katika Kiswahili Sanifu.
- source_word: הֲשָׁלוֹם
  choice: Je, mambo ni salama?
  rationale: שלום hapa ni swali fupi la kuuliza kama hali ni njema, wala si kauli ya moja kwa moja kuhusu amani.
- source_word: וַ
  choice: Basi / aka-
  rationale: Viunganishi hivi vinaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida bila kurudia “na” kupita kiasi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. “Gari la farasi” limetumiwa kuepuka picha ya gari la kisasa, na “kumlaki” huhifadhi uzito wa lugha bila kuwa ngumu kueleweka.
