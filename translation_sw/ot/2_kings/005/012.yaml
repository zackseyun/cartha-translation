  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: sw
  text: “Je, Abana na Farpari[a], mito ya Damasko, si bora kuliko maji yote ya Israeli? Je, singeweza kuoga katika mito hiyo na kuwa safi?” Akageuka, akaondoka kwa ghadhabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mapokeo yana jina “Amana” badala ya “Abana.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... si / Je, singeweza
  rationale: Chembe hii huanzisha maswali ya balagha yanayotarajia jibu la kukubali; miundo hii ni ya kawaida na ya asili katika Kiswahili.
- source_word: טוֹב ... מִכֹּל
  choice: bora kuliko ... yote
  rationale: Muundo wa kulinganisha unahitaji 'bora kuliko' katika Kiswahili.
- source_word: אבנה
  choice: Abana
  rationale: Jina limenukuliwa kwa kuzingatia umbo la Kiebrania la maandishi ya Kimasora; umbo jingine la kimapokeo, 'Amana,' limehifadhiwa katika tanbihi.
- source_word: וּפַרְפַּר
  choice: na Farpari
  rationale: Unukuzi 'Farpari' unafuata matamshi ya kawaida ya Kiswahili kwa jina hili na kuepuka mkusanyiko wa konsonanti mwishoni usio wa asili.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: mito ya Damasko
  rationale: Huhifadhi uhusiano wa umilikaji/mahali kwa Kiswahili cha kawaida.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: kuliko maji yote ya Israeli
  rationale: Neno pana 'maji' limehifadhiwa badala ya kulifanya mahususi kuwa 'mito,' na wazo la ujumla la 'yote' limebakizwa.
- source_word: אֶרְחַץ בָּהֶם
  choice: kuoga ndani yake
  rationale: Katika muktadha wa kuingia mtoni ili kuoshwa, 'kuoga' ni ya asili; 'ndani yake' hurejelea mito miwili inayotazamwa kwa pamoja kama maji ya kuogea.
- source_word: וְטָהָרְתִּי
  choice: na kuwa safi
  rationale: Huhifadhi mwingiliano wa maana ya kupona/kuwa safi kimwili na usafi mpana bila kuingiza maana ya kiibada kwa lazima.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: akageuka, akaondoka
  rationale: Huwakilisha vitenzi vyote viwili kwa mtiririko wa kawaida wa masimulizi ya Kiswahili.
- source_word: בְּחֵמָה
  choice: kwa ghadhabu
  rationale: '''Ghadhabu'' huwasilisha hasira kali ya neno la Kiebrania kwa lugha yenye hadhi na inayoeleweka.'
theological_decisions:
- issue: Asili ya lugha ya kutakaswa/kuwa safi
  choice: kuwa safi
  alternative: kutakaswa / kusafishwa
  rationale: Muktadha unahusu ugonjwa wa ngozi na agizo la kuoga, lakini Kiebrania kinaweza pia kuwa na wazo pana la usafi. 'Kuwa safi' huhifadhi mvutano huo bila kuamua kuwa ni utakaso wa kiibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Maswali ya balagha na ukali wa hasira ya Naamani vimehifadhiwa.
