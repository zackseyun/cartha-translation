base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: sw
  text: Basi Elisha akatuma mjumbe kwake, akisema, “Nenda ukaoge mara saba katika Mto Yordani; mwili wako utarudia hali yake ya awali[a], nawe utakuwa safi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “nyama yako itarejea kwako.” Usemi huu wa Kiebrania unaonyesha kurejeshwa kwa hali ya afya ya awali.
    reason: lexical_alternative
  - marker: b
    text: Au, “nawe utatakaswa.” Kitenzi hiki kinaweza kumaanisha kuwa safi au kutakaswa, kikiwa na maana za kimwili na za kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: akamtumia
  rationale: Katika simulizi, kitenzi hiki kinaonyesha kwamba Elisha alituma mtu kwenda kwa Naamani. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: מַלְאָךְ
  choice: mjumbe
  rationale: Muktadha unamhusu mjumbe wa kibinadamu, si malaika wa mbinguni.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi fomula ya Kiebrania ya kuanzisha ujumbe ulionukuliwa kwa lugha ya kawaida ya simulizi.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: Nenda ukaoge
  rationale: Huwasilisha agizo na mfuatano wa kwenda kisha kuoga kwa Kiswahili cha kawaida.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Ni tafsiri ya moja kwa moja ya idadi na marudio yaliyotajwa.
- source_word: בַּיַּרְדֵּן
  choice: katika Mto Yordani
  rationale: Kuongeza neno 'Mto' hufanya jina la mahali lieleweke mara moja kwa msomaji wa kawaida bila kubadili maana.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: mwili wako utarudia hali yake
  rationale: Kitenzi kina maana ya msingi ya kurudi, lakini hapa ni nahau ya kurejeshwa kwa hali ya awali. 'Mwili' ni neno la kawaida linalowakilisha בשר katika muktadha huu wa ugonjwa wa mwili.
- source_word: וּטְהָר
  choice: nawe utakuwa safi
  rationale: Huhifadhi maana ya kuwa safi bila kuamua kimyakimya kama usafi huo ni wa kimwili pekee au pia wa kiibada.
theological_decisions:
- issue: Iwapo בשר itafsiriwe kwa neno halisi zaidi 'nyama' au kwa 'mwili' katika muktadha wa kuponywa
  choice: mwili
  alternative: nyama
  rationale: '''Mwili'' ni wa asili zaidi katika Kiswahili unapozungumzia kurejeshwa kwa afya ya mtu, huku tanbihi ikihifadhi taswira halisi ya Kiebrania.'
- issue: Iwapo טהר ielezwe kuwa kuponywa kimwili au kutakaswa kiibada
  choice: utakuwa safi
  alternative: utatakaswa
  rationale: Usemi huu huacha wazi mwangwi wa usafi wa kimwili na wa kiibada uliomo katika kitenzi cha Kiebrania, bila kuufungia upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kusomeka kwa sauti, huku tanbihi zikihifadhi nahau halisi na utata wa kitenzi cha usafi.
