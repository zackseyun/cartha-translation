base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: sw
  text: Ndipo Naamani akasema, “Kama sivyo, tafadhali, mtumishi wako apewe udongo kiasi cha mzigo wa nyumbu wawili[a][b]; kwa maana mtumishi wako hatatoa tena sadaka ya kuteketezwa wala dhabihu kwa miungu mingine, bali kwa Yahwe pekee[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mzigo wa udongo wa nyumbu wawili.” Usemi wa Kiebrania unamaanisha kiasi cha udongo ambacho nyumbu wawili wanaweza kubeba.
    reason: lexical_alternative
  - marker: b
    text: Huenda ombi la Naamani la kupata udongo wa Israeli linaonyesha uhusiano wa kale kati ya mungu na nchi fulani, au nia ya kumwabudu Yahwe juu ya udongo wa Israeli. Matini haisemi sababu yake waziwazi.
    reason: cultural_note
  - marker: c
    text: Kiebrania kina YHWH, jina binafsi la Mungu; linaweza pia kutoholewa kuwa “Yehova” au kuwakilishwa kwa cheo “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָלֹא
  choice: Kama sivyo
  rationale: Katika muktadha huu Naamani anaitikia kukataliwa kwa zawadi yake. Usemi huu wa Kiebrania una maana ya jibu la masharti lililo la heshima, si tu ‘na si.’
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: tafadhali mtumishi wako na apewe
  rationale: Huhifadhi muundo wa kutendwa, ombi la heshima linaloonyeshwa na נָא, na namna ya Naamani kujishusha kwa kujiita mtumishi.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: udongo wa kiasi ambacho nyumbu wawili wanaweza kubeba
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya udongo wenye uzito au kiasi cha mzigo wa jozi ya nyumbu, bila kutumia muundo mgumu wa kimatini.
- source_word: כִּי לֹא יַעֲשֶׂה עוֹד עַבְדְּךָ
  choice: kwa maana mtumishi wako hatatoa tena
  rationale: Ingawa עשה kwa kawaida ni ‘kufanya,’ pamoja na maneno ya dhabihu ina maana ya kutoa au kuwasilisha sadaka.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi ya kawaida na iliyo wazi kwa sadaka iliyoteketezwa kwa moto.
- source_word: זֶבַח
  choice: dhabihu
  rationale: Neno hili la jumla la ibada ya kutoa mnyama linaelezwa kwa usahihi na ‘dhabihu.’
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: kwa miungu mingine
  rationale: Kihusishi kinaonyesha wale wanaopokea ibada; ‘kwa’ ni cha kawaida na wazi katika Kiswahili.
- source_word: כִּי אִם לַיהוָה
  choice: bali kwa Yahwe peke yake
  rationale: ‘Bali ... peke yake’ huonyesha kwa uwazi upekee na tofauti kali ya כִּי אִם.
- source_word: יהוה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Sababu ya Naamani kuomba udongo wa Israeli
  choice: Ombi limetafsiriwa moja kwa moja bila kuamua sababu yake katika matini kuu.
  alternative: Kueleza wazi kwamba alitaka msingi wa madhabahu au aliamini Yahwe angeabudiwa tu juu ya ardhi ya Israeli.
  rationale: Mstari unahusianisha udongo huo na uamuzi wa kumwabudu Yahwe peke yake, lakini hautaji wazi sababu ya ombi; tanbihi inaonyesha uwezekano bila kuufanya kuwa hakika.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina maalumu la Mungu, YHWH. ‘Yahwe’ huhifadhi jina hilo na kulitofautisha na cheo cha kawaida ‘Bwana.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Muundo ‘mtumishi wako na apewe’ umehifadhi unyenyekevu na hali ya kutendwa ya ombi, huku maelezo ya mzigo yakitolewa kwa lugha ya asili na iliyo wazi.
