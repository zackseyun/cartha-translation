base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: sw
  text: Basi akashuka, akajizamisha katika Mto Yordani mara saba[a], sawasawa na neno la mtu wa Mungu. Mwili wake ukarejea kuwa kama mwili wa mvulana mdogo, naye akatakasika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajichovya.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchovya au kujizamisha.
    reason: lexical_alternative
  - marker: b
    text: Au, “naye akawa safi.” Kitenzi cha Kiebrania kinaweza kueleza kuingia katika hali ya usafi au matokeo ya kutakaswa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Basi akashuka
  rationale: “Basi” linaonyesha kuwa tendo hili lilifuata uamuzi na maagizo yaliyotangulia, huku “akashuka” likihifadhi mwendo halisi wa ירד.
- source_word: וַיִּטְבֹּל
  choice: akajitumbukiza
  rationale: טבל humaanisha kutumbukiza au kuzamisha. “Akajitumbukiza” ni Kiswahili cha kawaida kinachoonyesha kuwa Naamani mwenyewe alifanya tendo hilo bila kufafanua kupita kiasi namna yake.
- source_word: בַּיַּרְדֵּן
  choice: katika Mto Yordani
  rationale: Jina Yordani limehifadhiwa, na “Mto” limeongezwa kwa uwazi wa kawaida katika Kiswahili.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: Hii ndiyo namna ya kawaida na ya moja kwa moja ya kuonyesha tendo lililorudiwa mara saba.
- source_word: כִּדְבַר
  choice: sawasawa na neno la
  rationale: דבר inaweza kumaanisha neno, agizo, au jambo. “Neno” linabaki karibu na Kiebrania huku muktadha ukionyesha kuwa lilikuwa agizo la kutekelezwa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la cheo la kawaida la kinabii katika Biblia ya Kiebrania na limehifadhiwa kwa namna ya moja kwa moja.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: Mwili wake ukawa tena
  rationale: שׁוב ina wazo la kurudi au kurejeshwa. Kauli hii ya Kiswahili inaeleza kwa kawaida kwamba hali ya mwili wake ilirejea, bila kubadili taswira ya kimwili kuwa lugha ya kitabibu pekee.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: kama mwili wa mvulana mdogo
  rationale: נער קָטֹן humaanisha mvulana mdogo au mtoto wa kiume aliye mdogo. Kurudia “mwili” kunahifadhi ulinganisho dhahiri wa Kiebrania.
- source_word: וַיִּטְהָר
  choice: naye akatakasika
  rationale: טהר hapa huonyesha kuingia katika hali ya kuwa safi. “Akatakasika” huhifadhi matokeo ya tendo na pia mwangwi wa usafi wa kiibada, bila kupunguza maana kuwa uponyaji wa kitabibu pekee.
theological_decisions:
- issue: Hali ya kurejeshwa kwa Naamani
  choice: Kueleza kurejea kwa mwili wake na kutakasika kwake kama vipengele viwili vinavyohusiana.
  alternative: Kutafsiri yote kwa neno la kitabibu kama “akapona,” au kutumia “akawa safi” pekee.
  rationale: Mstari wenyewe unaunganisha urejesho wa kimwili (בשר) na kuwa safi au kutakasika (טהר). Tafsiri inadumisha vipengele vyote bila kuingiza madai ya kisakramenti, ya kitipolojia, au ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Sawasawa na neno la mtu wa Mungu” huhifadhi mtindo wa kibiblia bila kuwa mzito kupita kiasi. Alama zote za tanbihi zimewekwa katika matini kuu.
