source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: sw
  text: Elisha, mtu wa Mungu, aliposikia kwamba mfalme wa Israeli alikuwa amerarua mavazi yake[a], alituma ujumbe kwa mfalme akisema, “Kwa nini umerarua mavazi yako? Tafadhali, na aje kwangu[b], naye atajua kwamba kuna nabii katika Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kurarua mavazi kulikuwa ishara ya huzuni au dhiki kubwa.
    reason: Maelezo ya desturi inayodokezwa na tendo la Kiebrania.
  - marker: b
    text: Maneno “na aje kwangu” yanamhusu Naamani, si mfalme wa Israeli.
    reason: Kufafanua rejeo la nafsi ya tatu kutokana na muktadha.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo wa wakati unaendeleza simulizi kwa Kiswahili cha kawaida bila kuongeza neno lisilokuwapo kama ‘basi’ au ‘sasa’.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi cheo kinachotambulika cha kinabii na uhusiano wake na Mungu bila kukifanya kiwe maelezo ya uchaji tu.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: alikuwa amerarua mavazi yake
  rationale: ‘Kurarua’ huwakilisha kitendo cha kupasua vazi, na wakati uliotumika unaonyesha kwamba kitendo hicho kilitangulia habari kumfikia Elisha.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: alituma ujumbe kwa mfalme akisema
  rationale: Kiswahili huhitaji kutaja kwa kawaida kile kilichotumwa; ‘ujumbe’ unaeleweka kutokana na maneno yanayofuata bila kuongeza mjumbe ambaye maandishi hayamtaji.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: Kwa nini umerarua mavazi yako?
  rationale: Swali la moja kwa moja na wakati timilifu huonyesha kitendo cha karibuni chenye umuhimu katika hali ya sasa.
- source_word: יָבֹא נָא אֵלַי
  choice: Tafadhali, na aje kwangu
  rationale: ‘Na aje’ huhifadhi nafsi ya tatu ya ombi, huku ‘tafadhali’ ikiwakilisha chembe ya ombi נָא.
- source_word: וְיֵדַע
  choice: naye atajua
  rationale: Huhifadhi matokeo yanayotarajiwa bila kulazimisha maana iwe kusudi pekee.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: kwamba kuna nabii katika Israeli
  rationale: Huwasilisha kauli ya uwepo kwa uwazi na kuhifadhi msisitizo kwamba nabii yupo Israeli.
theological_decisions:
- issue: Nguvu ya kinabii ya אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  alternative: mtu mcha Mungu
  rationale: Hapa kirai hiki ni cheo cha mwakilishi wa Mungu, si maelezo ya jumla kuhusu tabia ya uchaji.
- issue: Mhusika wa nafsi ya tatu katika יָבֹא na וְיֵדַע
  choice: Maneno ‘na aje’ na ‘atajua’ yanamhusu Naamani
  alternative: Yamrejelee mfalme wa Israeli
  rationale: Ingawa kiwakilishi hakitaji jina ndani ya mstari huu, muktadha unamtambulisha Naamani kuwa ndiye anayepaswa kuja na kujua kwamba kuna nabii Israeli; tanbihi huhifadhi uwazi bila kubadili maandishi kuwa jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi umefanywa wa kawaida kwa Kiswahili huku cheo cha kinabii, mpangilio wa matukio, na nafsi ya tatu ya ombi vikihifadhiwa.
