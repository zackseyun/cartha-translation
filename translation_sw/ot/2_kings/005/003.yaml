translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa tamanio “Laiti ... angekuwa” na matokeo “Ndipo angemponya” ni wa asili na huhifadhi uhusiano wa sentensi ya Kiebrania. Tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
