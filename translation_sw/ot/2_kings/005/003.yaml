base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: sw
  text: Akamwambia bibi yake, “Laiti bwana wangu angekuwa mbele ya nabii aliye Samaria! Ndipo angemponya[a] ukoma wake[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kwa maana ya msingi ni “kukusanya” au “kuondoa”; hapa kimetumiwa kwa maana ya kumwondolea ugonjwa, yaani kumponya.
    reason: lexical_alternative
  - marker: b
    text: “Ukoma” hapa hutafsiri neno la Kiebrania צָרַעַת (tsara‘at), ambalo linaweza kumaanisha kwa upana zaidi ugonjwa mbaya wa ngozi, si lazima ugonjwa unaoitwa ukoma leo.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: bibi yake
  rationale: Katika muktadha wa nyumba, neno hili humaanisha mwanamke mwenye mamlaka juu yake. “Bibi yake” ni kauli ya kawaida ya heshima kwa mkuu wa kike, ingawa muktadha ndio unaondoa maana nyingine zinazowezekana za neno “bibi.”
- source_word: אַחֲלֵי
  choice: Laiti
  rationale: “Laiti” huonyesha tamanio lenye nguvu na kuhifadhi hali ya kutamani iliyo katika Kiebrania.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Huhifadhi usemi wa heshima ambao msichana anautumia kumrejelea Naamani bila kuongeza jina lisilotajwa katika aya.
- source_word: לִפְנֵי
  choice: angekuwa mbele ya
  rationale: Huhifadhi taswira ya Kiebrania ya kuwa mbele au katika uwepo wa mtu, na inaeleweka katika Kiswahili.
- source_word: הַנָּבִיא
  choice: nabii
  rationale: Chanzo kinatumia cheo hicho badala ya jina la Elisha; tafsiri haiongezi jina.
- source_word: בְּשֹׁמְרוֹן
  choice: aliye Samaria
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha kuwa nabii huyo yuko Samaria.
- source_word: אָז
  choice: Ndipo
  rationale: Huonyesha matokeo ambayo yangetokea ikiwa tamanio hilo lingetimizwa.
- source_word: יֶאֱסֹף
  choice: angemponya
  rationale: Ingawa maana ya msingi ya kitenzi ni “kukusanya/kuondoa,” katika muktadha huu kinaeleza kuondolewa kwa ugonjwa au kupona. “Angemponya” huwasilisha maana hiyo kwa Kiswahili cha kawaida; taswira ya kitenzi cha chanzo imeelezwa katika tanbihi.
- source_word: מִצָּרַעְתּוֹ
  choice: ukoma wake
  rationale: “Ukoma” ni tafsiri ya kibiblia iliyozoeleka ya צָרַעַת, huku tanbihi ikihifadhi uwezekano kwamba neno hilo lina maana pana kuliko ugonjwa wa Hansen wa kisasa.
