translation:
  language: sw
  text: Basi akaingia akamweleza bwana wake, akisema, “Hivi na hivi[a] ndivyo alivyosema yule msichana kutoka nchi ya Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “hivi na hivi” ni msemo unaofupisha mambo aliyosema bila kuyarudia neno kwa neno; pia unaweza kutafsiriwa “mambo kama haya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaenda
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kuingia kulingana na mtazamo. Katika mfululizo huu wa simulizi, akaenda linaeleza kwa kawaida kwamba mhusika alimwendea bwana wake ili kutoa taarifa.
- source_word: וַיַּגֵּד
  choice: akamweleza
  rationale: Katika Hifili, נגד humaanisha kueleza, kutoa taarifa, au kujulisha. Akamweleza ni Kiswahili cha kawaida na pia kinaonyesha kwamba taarifa ilielekezwa kwa bwana wake.
- source_word: לַאדֹנָיו
  choice: bwana wake
  rationale: אָדוֹן inaweza kumaanisha bwana, mkuu, au mwenye mamlaka. Bwana wake ni tafsiri ya kawaida katika mazingira haya ya mtu aliye chini ya mamlaka ya mwingine, bila kuongeza cheo kisichotajwa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Muundo huu wa Kiebrania hutanguliza usemi wa moja kwa moja. Akisema unaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: כָּזֹאת וְכָזֹאת
  choice: hivi na hivi
  rationale: Huu ni msemo unaofupisha yaliyosemwa bila kuyarudia neno kwa neno. Hivi na hivi ni wa asili katika Kiswahili na huhifadhi kutotajwa kwa maneno halisi.
- source_word: דִּבְּרָה
  choice: alisema
  rationale: דבר ni kitenzi cha kawaida cha kusema au kunena. Alisema kinafaa katika taarifa hii ya maneno ya msichana.
- source_word: הַנַּעֲרָה
  choice: yule msichana
  rationale: נַעֲרָה humaanisha msichana au mwanamke kijana. Msichana ni tafsiri ya moja kwa moja; yule humtambulisha mhusika aliyekwisha tajwa bila kuongeza hadhi yake ya utumishi ndani ya neno lenyewe.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: kutoka nchi ya Israeli
  rationale: Kirai hiki kinamtambulisha msichana kwa asili yake. Nchi ya Israeli huakisi אֶרֶץ יִשְׂרָאֵל kwa lugha ya kawaida na yenye heshima.
