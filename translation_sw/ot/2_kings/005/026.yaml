base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: sw
  text: Lakini akamwambia, “Je, moyo wangu[a] haukuenda wakati yule mtu alipogeuka kutoka kwenye gari lake ili kukutana nawe? Je, huu ndio wakati wa kuchukua fedha, mavazi, mashamba ya mizeituni na mashamba ya mizabibu, kondoo na ng’ombe, watumishi wa kiume na wa kike[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufafanua zaidi, “Je, sikuwa pamoja nawe rohoni wakati yule mtu alipogeuka kutoka kwenye gari lake ili kukutana nawe?”
    reason: lexical_alternative
  - marker: b
    text: Au “watumwa wa kiume na watumwa wa kike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: moyo wangu haukwenda pamoja nawe
  rationale: Inahifadhi tamathali ya Kiebrania ya ‘moyo wangu kwenda’ huku ‘pamoja nawe’ ikifanya uhusiano wake na tukio hilo uwe wa kawaida na kueleweka kwa Kiswahili.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: wakati yule mtu alipogeuka kutoka kwenye gari lake ili kukutana nawe
  rationale: ‘Alipogeuka’ inadumisha maana ya msingi ya הָפַךְ bila kuamua wazi kama alishuka au alirudi nyuma; ‘yule mtu’ humrejelea mtu maalumu katika muktadha bila kuingiza jina lake.
- source_word: הָעֵת
  choice: Je, huu ndio wakati
  rationale: Swali la balagha linaonyesha karipio la Elisha kwamba wakati huo haukufaa kutafuta faida.
- source_word: לָקַחַת אֶת־הַכֶּסֶף
  choice: kuchukua fedha
  rationale: ‘Fedha’ linaweza kumaanisha metali ya fedha au pesa, kama כֶּסֶף, na hivyo linahifadhi upana wa neno la asili.
- source_word: בְּגָדִים
  choice: mavazi
  rationale: Ni neno la sasa, lenye heshima na linaloeleweka kwa urahisi.
- source_word: זֵיתִים
  choice: mashamba ya mizeituni
  rationale: Katika orodha ya mali, wingi huu unaeleweka kwa kawaida kuwa miti au mashamba yenye kuzaa, si matunda pekee.
- source_word: כְרָמִים
  choice: mashamba ya mizabibu
  rationale: Ni tafsiri ya kawaida ya ardhi iliyopandwa mizabibu na inaendana na orodha ya mali.
- source_word: צֹאן וּבָקָר
  choice: kondoo na ng’ombe
  rationale: Inahifadhi majina mahususi ya mifugo badala ya kuyajumlisha kama makundi na makundi ya ng’ombe.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: watumishi wa kiume na watumishi wa kike
  rationale: Inahifadhi tofauti ya jinsia iliyo wazi katika Kiebrania; tanbihi inadokeza maana mbadala ya hali ya utumwa.
theological_decisions:
- issue: Maana ya uwepo au ufahamu wa kinabii katika לִבִּי הָלַךְ
  choice: moyo wangu haukwenda pamoja nawe
  alternative: sikuwa pamoja nawe rohoni
  rationale: Tamathali ya Kiebrania imehifadhiwa badala ya kufafanua kwa uhakika namna Elisha alivyolijua tukio.
- issue: Hadhi ya kijamii katika עֲבָדִים וּשְׁפָחוֹת
  choice: watumishi wa kiume na watumishi wa kike
  alternative: watumwa wa kiume na watumwa wa kike
  rationale: Maneno ya Kiebrania yanaweza kumaanisha watumishi au watumwa kulingana na muktadha. Tafsiri kuu inatumia ‘watumishi,’ huku maana ya utumwa ikihifadhiwa katika tanbihi bila kuficha uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la karipio umehifadhiwa, pamoja na tamathali ya ‘moyo kwenda.’ ‘Gari’ limetumiwa kwa gari la kukokotwa la kale kwa sababu ni neno la kawaida katika muktadha wa Biblia; ‘mashamba ya mizeituni’ na ‘mashamba ya mizabibu’ yanaonyesha mali inayozalisha.
