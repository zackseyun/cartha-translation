  naturalness: Kiswahili ni sanifu na cha heshima. “Moyo wangu haukuenda wakati …” huhifadhi tamathali ya asili kwa usahihi zaidi kuliko “haukwenda pamoja nawe,” bila kuifanya sentensi isiwe ya kawaida. “Watumishi wa kiume na wa kike” ni muundo mfupi na wa kawaida.
  terminology: “Fedha,” “mavazi,” “mashamba ya mizeituni,” “mashamba ya mizabibu,” “kondoo na ng’ombe” ni sahihi katika muktadha wa orodha ya mali. “Watumishi” ni chaguo linalowezekana kwa עֲבָדִים וּשְׁפָחוֹת, na tanbihi inayotoa “watumwa” inahifadhi uwezekano wa maana ya utumwa. “Gari” linaweza kueleweka kama gari la kale katika sajili ya Kibiblia na halilazimishi tafsiri ya ziada ya tendo la Naamani.
