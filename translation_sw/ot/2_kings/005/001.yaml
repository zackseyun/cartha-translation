id: 2KI.5.1
reference: 2 Kings 5:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: sw
  text: Naamani, mkuu wa jeshi la mfalme wa Aramu[c], alikuwa mtu mashuhuri mbele ya bwana wake, naye aliheshimiwa sana, kwa sababu kupitia kwake Yahwe alikuwa ameipa Aramu ushindi[a]. Naamani alikuwa shujaa hodari, lakini alikuwa na ugonjwa wa ngozi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukombozi” au “wokovu.” Neno la Kiebrania lina maana pana, lakini hapa muktadha unaonyesha mafanikio ya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia neno ambalo kwa desturi limetafsiriwa “ukoma.” Linahusu ugonjwa mkubwa wa ngozi katika ulimwengu wa kale na huenda lisilingane kabisa na ukoma wa kitabibu (ugonjwa wa Hansen).
    reason: cultural_note
  - marker: c
    text: Kwa desturi “Siria”; Kiebrania ni “Aramu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: Naamanu
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili; kiunganishi ו hapa kinaanzisha simulizi jipya bila kuhitaji neno la wakati kama “sasa.”
- source_word: שַׂר צְבָא
  choice: mkuu wa jeshi
  rationale: Hueleza cheo cha juu cha kijeshi kwa Kiswahili cha sasa na cha kawaida.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: Aramu linahifadhi jina la ufalme wa Kiaramu katika Kiebrania badala ya kulitambulisha moja kwa moja na Siria ya baadaye.
- source_word: הָיָה אִישׁ גָּדוֹל
  choice: alikuwa mtu mashuhuri
  rationale: Kirai hiki kinahusu hadhi na umuhimu wa kijamii, si ukubwa wa mwili.
- source_word: לִפְנֵי אֲדֹנָיו
  choice: mbele ya bwana wake
  rationale: Kinahifadhi maana ya kuwa katika mtazamo au mbele ya mkuu wake; hapa “bwana” ni mfalme aliyekuwa mkuu wa Naamanu, si jina la Mungu.
- source_word: וּנְשֻׂא פָנִים
  choice: mwenye kuheshimiwa sana
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kupewa heshima au hadhi kubwa.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: kwa sababu kupitia kwake Yahwe alikuwa ameipa Aramu ushindi
  rationale: בוֹ inaonyesha Naamanu kuwa chombo; תְּשׁוּעָה katika muktadha huu wa kijeshi linaelekea kumaanisha ushindi, ingawa linaweza pia kumaanisha ukombozi au wokovu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja katika umbo linalofaa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: גִּבּוֹר חַיִל
  choice: shujaa hodari
  rationale: Kirai kinaonyesha uwezo, ushujaa na sifa za kivita kwa lugha ya kawaida ya Kiswahili.
- source_word: מְצֹרָע
  choice: alikuwa na ugonjwa wa ngozi
  rationale: Neno la kale linataja mtu mwenye צָרַעַת, hali ya ngozi ambayo si lazima ilingane kikamilifu na ukoma wa kitabibu unaojulikana leo.
theological_decisions:
- issue: Kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia jina binafsi יהוה; kulihifadhi kama Yahwe kunatofautisha jina hilo na cheo אֲדֹנָיו kinachomtaja mfalme kama bwana wa Naamanu.
- issue: Yahwe kuipa Aramu ushindi kupitia Naamanu
  choice: kwa sababu kupitia kwake Yahwe alikuwa ameipa Aramu ushindi
  alternative: kwa sababu kupitia kwake Yahwe alikuwa ameikomboa Aramu
  rationale: Tafsiri inadumisha dai la wazi kwamba Yahwe ndiye aliyesababisha mafanikio ya kijeshi ya taifa la kigeni, bila kupunguza mvutano wa kitheolojia kuhusu enzi yake juu ya mataifa yote.
- issue: Utambulisho wa ugonjwa wa Naamanu
  choice: ugonjwa wa ngozi
  alternative: ukoma
  rationale: צָרַעַת ni hali ya kale isiyoweza kutambuliwa kwa uhakika kuwa ugonjwa wa Hansen; tafsiri haipaswi kutoa utambuzi wa kitabibu usiohakikishwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ya pili inarudia jina “Naamanu” badala ya “mtu huyo” ili iwe ya asili na wazi katika Kiswahili, huku ikihifadhi msisitizo wa kurejea kwake katika Kiebrania.
