  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: sw
  text: Lakini Gehazi, mtumishi wa Elisha, mtu wa Mungu, akasema, “Tazama, bwana wangu amemwacha Naamani, huyu Mwaramu, bila kuchukua mkononi mwake kile alicholeta.[a] Kama Yahweh aishivyo,[b] nitamfuata kwa mbio na kuchukua kitu kutoka kwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bwana wangu amejizuia kuchukua kutoka kwa Naamani huyu Mwaramu kile alicholeta.”
    reason: alternative_reading
  - marker: b
    text: 'Huu ni mfumo wa kiapo cha Kiebrania: “Kama Yahweh aishivyo.”'
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: mtumishi
  rationale: Katika muktadha huu neno linaonyesha nafasi ya Gehazi chini ya Elisha; ‘mtumishi’ ni la kawaida na halidai kwamba umri wake ndio jambo linalosisitizwa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni cheo cha kawaida cha kinabii na kimetafsiriwa wazi bila kufafanuliwa kwa maneno ya ziada.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi msisitizo wa maneno ya Gehazi kwa lugha yenye hadhi na inayoeleweka.
- source_word: חָשַׂךְ
  choice: amemwachilia
  rationale: Katika muundo huu kitenzi kinaonyesha kwamba Elisha alimwacha Naamani aende bila kupokea zawadi yake; ‘amemwachilia’ linabeba maana ya kumwondolea wajibu huo bila kuficha uwezekano wa kutafsiri kuwa ‘amejizuia’.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa ni namna ya Gehazi kumtaja mkuu wake wa kibinadamu, Elisha, si jina au cheo cha Mungu.
- source_word: הָאֲרַמִּי
  choice: Mwaramu
  rationale: Linawakilisha moja kwa moja utambulisho wa kikabila na kijiografia wa Kiebrania kuliko ‘Msiria’.
- source_word: מִקַּחַת מִיָּדוֹ
  choice: bila kuchukua kutoka mkononi mwake
  rationale: Linahifadhi picha ya Kiebrania ya kupokea kitu kutoka katika mkono wa mtoaji, huku ‘bila’ likionyesha tendo ambalo Elisha hakulifanya.
- source_word: אֵת אֲשֶׁר הֵבִיא
  choice: kile alicholeta
  rationale: Ni Kiswahili cha asili kwa kishazi husishi cha Kiebrania na hakiongezi aina ya zawadi ambayo haikutajwa hapa.
- source_word: חַי יְהוָה
  choice: Kama Yahweh aishivyo
  rationale: Ni kiapo cha Kiebrania kinachotegemea uhai wa Yahweh; muundo huu unahifadhi nguvu yake kama kiapo.
- source_word: רַצְתִּי אַחֲרָיו
  choice: nitamfuata mbio
  rationale: Kiswahili hiki kinaonyesha wazi kufuatilia kwa haraka, bila kutoa maana yenye nguvu zaidi ya kumfukuza adui.
- source_word: וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  choice: na kuchukua kitu kutoka kwake
  rationale: Katika muktadha huu מְאוּמָה humaanisha kitu fulani ambacho Gehazi anakusudia kupata kwa Naamani.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, יהוה. ‘Yahweh’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya maneno חַי יְהוָה
  choice: Kama Yahweh aishivyo
  alternative: Yahweh yu hai
  rationale: Katika muktadha huu maneno hayo ni kiapo, si kauli huru tu kuhusu uhai wa Mungu; tafsiri iliyochaguliwa inaonyesha matumizi hayo bila kuongeza maudhui ya kiapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini wa sasa. ‘Tazama’ linaendeleza msisitizo wa הִנֵּה, na ‘nitamfuata mbio’ ni la kawaida zaidi kuliko tafsiri ngumu ya neno kwa neno. Mpangilio ‘Naamani huyu Mwaramu’ umehifadhiwa kwa sababu unasikika kawaida katika Kiswahili na unaakisi msisitizo wa usemi wa Gehazi.
