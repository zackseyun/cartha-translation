  - marker: b
    text: Au “kuvihifadhi” au “kuviweka salama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: kilima
  rationale: Neno עֹפֶל linaweza kumaanisha mahali palipoinuka, kilima, au kilima chenye ngome. Katika simulizi hili maana ya kijiografia inafaa zaidi, na “kilima” ni ya asili na inayoeleweka katika Kiswahili cha kawaida.
- source_word: מִיָּדָם
  choice: kutoka mikononi mwao
  rationale: Ingawa Kiebrania kimetumia “mkono” katika umoja pamoja na kiambishi cha wingi, usemi huu unamaanisha kupokea vitu moja kwa moja kutoka kwao. Wingi “mikononi mwao” ni wa kawaida zaidi katika Kiswahili huku ukihifadhi taswira ya Kiebrania.
- source_word: וַיִּפְקֹד
  choice: kuviweka
  rationale: Katika muktadha huu פקד inaeleza kuweka vitu ndani ya nyumba kwa ajili ya kuvihifadhi. “Kuviweka” ni wazi na ya kawaida, bila kulazimisha maana mahususi kupita kiasi.
- source_word: בַּבָּיִת
  choice: ndani ya nyumba
  rationale: בית hapa inaelekea kutaja nyumba yenyewe kama mahali vitu vilipowekwa; “ndani ya nyumba” hutoa maana hiyo ya mahali kwa uwazi.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Kiebrania kinasema kwa jumla “watu/wanaume,” si neno mahususi la watumishi. “Wale watu” huhifadhi ujumla huo na kurejelea watu waliotajwa katika muktadha.
- source_word: וַיְשַׁלַּח
  choice: akawaacha ... waende
  rationale: Kitenzi kinaweza kumaanisha kuwatuma au kuwaaga na kuwaacha waondoke. Katika muktadha huu, usemi huu wa Kiswahili unaonyesha kwa kawaida kwamba aliwaruhusu waondoke.
