  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: sw
  text: Alipofika kwenye kilima[a], alivichukua vitu hivyo kutoka mikononi mwao na kuviweka[b] ndani ya nyumba. Kisha akawaacha wale watu waende, nao wakaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye sehemu iliyoinuka,” “kwenye kilima chenye ngome,” au “kwenye Ofeli.”
