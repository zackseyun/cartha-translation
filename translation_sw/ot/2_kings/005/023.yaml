base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: sw
  text: Naamani akasema, “Tafadhali, chukua talanta mbili.” Akamsihi sana[a], kisha akafunga talanta mbili za fedha katika mifuko miwili[b], pamoja na mavazi mawili ya kubadilisha. Akawapa watumishi wake wawili vitu hivyo, nao wakavibeba mbele yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamshawishi kwa kusisitiza” au “akamlazimisha akubali.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, mifuko miwili ya kubebea fedha au vitu vya thamani.
    reason: cultural_note
  - marker: c
    text: 'Au “mbele yake.” Katika muktadha, kiwakilishi hiki kinaelekea kumrejelea Gehazi: watumishi wa Naamani walibeba zawadi wakimtangulia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: Tafadhali, chukua
  rationale: הוֹאֵל hutumika hapa kama ombi la heshima linaloandamana na amri קַח. “Tafadhali, chukua” ni Kiswahili cha sasa, cha kawaida, na kinadumisha msisitizo wa kitendo cha kuchukua badala ya kufafanua kuwa ni kukubali zawadi.
- source_word: כִּכָּרָיִם
  choice: talanta mbili
  rationale: כִּכָּר ni kipimo cha uzito. “Talanta” ni istilahi ya kibiblia inayotambulika na hapa haipaswi kubadilishwa kuwa thamani ya kisasa isiyo hakika.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Akamsisitiza
  rationale: Nahau hii inaonyesha kuwa Naamani alimsukuma Gehazi kwa maneno akubali kiasi hicho. “Akamsisitiza” ni ya asili na haiongezi wazo la matumizi ya nguvu.
- source_word: וַיָּצַר
  choice: akafunga
  rationale: Kitenzi kinaeleza kufunga au kuweka salama fedha ndani ya vyombo vilivyotajwa. “Akafunga” ni kifupi na kinafuata tendo halisi.
- source_word: כִּכְּרַיִם כֶּסֶף
  choice: talanta mbili za fedha
  rationale: Muundo huu unaonyesha kiasi cha fedha kwa uzito; “talanta mbili za fedha” ni wazi na sahihi.
- source_word: חֲרִטִים
  choice: mifuko
  rationale: Neno hilo linamaanisha mifuko au vibeti vya kubebea fedha na vitu vya thamani. “Mifuko” ni neno pana na la kawaida lisilobainisha ukubwa usiotajwa.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: seti mbili za mavazi
  rationale: Kirai hiki kinamaanisha mavazi mawili kamili ya kubadilisha. “Seti mbili za mavazi” kinaeleweka kwa urahisi katika Kiswahili cha sasa na huepuka dhana kwamba ni vipande viwili tu vya nguo.
- source_word: שְׁנֵי נְעָרָיו
  choice: watumishi wake wawili
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au mhudumu. Katika muktadha huu hao ni watu wa Naamani waliopewa jukumu la kubeba zawadi, hivyo “watumishi” huonyesha kazi yao bila kusisitiza umri.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: wakavibeba mbele yake
  rationale: Tafsiri hii inadumisha maana ya kubeba vitu mbele ya mtu anayetajwa kwa kiwakilishi, huku “vibeba” ikirejelea fedha na mavazi kwa pamoja. Kiwakilishi hakijatatuliwa kimyakimya katika matini kuu.
