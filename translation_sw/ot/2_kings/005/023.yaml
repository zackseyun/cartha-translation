translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi zimehifadhi mwendo wa simulizi ya Kiebrania. “Talanta” imetumiwa kama kipimo cha uzito, “seti” kwa mavazi kamili ya kubadilisha, na utata wa kiwakilishi katika לְפָנָיו umehifadhiwa katika matini kuu na kufafanuliwa kwa tahadhari katika tanbihi.
