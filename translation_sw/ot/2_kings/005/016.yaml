  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: sw
  text: Elisha akasema, “Aishivyo Yahwe,[a] ambaye ninasimama mbele zake,[b] sitapokea.” Naamani akamsihi sana apokee, lakini Elisha akakataa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kauli ya kiapo ya Kiebrania ni, kihalisi, “Aishivyo Yahwe ... ikiwa nitapokea.” Katika kiapo hiki, “ikiwa” huonyesha ukanushaji mkali: “hakika sitapokea.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “ambaye ninasimama katika uwepo wake”; maneno haya pia yanaweza kudokeza, “ambaye ninamtumikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Kama aishivyo Yahwe
  rationale: Hii ni kauli ya kawaida ya kiapo cha Kiebrania. Tafsiri hii ni ya asili katika Kiswahili na inadumisha uzito wa kiapo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: ambaye ninasimama mbele zake
  rationale: Inahifadhi taswira ya kihalisi ya kusimama mbele za Mungu, ambayo pia inaweza kudokeza kuhudumu katika uwepo wake.
- source_word: אִם אֶקָּח
  choice: sitapokea
  rationale: Katika muktadha wa kiapo, אִם hutumiwa kwa ukanushaji mkali. “Kupokea” linaonyesha kwa kawaida kukubali zawadi inayotolewa, bila kuongeza kitu kisichotajwa moja kwa moja katika mstari.
- source_word: וַיִּפְצַר בּוֹ
  choice: alimsihi sana
  rationale: Kitenzi פצר kinaonyesha kusihi au kushinikiza kwa nguvu; “alimsihi sana” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: לָקַחַת
  choice: apokee
  rationale: Kitenzi hiki kinakamilisha wazo la kusihi na, katika muktadha huu, kinamaanisha kupokea zawadi.
- source_word: וַיְמָאֵן
  choice: akakataa
  rationale: מאן huonyesha kukataa moja kwa moja; “akakataa” ni tafsiri wazi na ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה. “Yahwe” linahifadhi jina hilo kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kusimama mbele za Yahwe
  choice: ambaye ninasimama mbele zake
  alternative: ambaye ninamtumikia; ambaye ninasimama katika uwepo wake
  rationale: Tafsiri ya karibu na Kiebrania inadumisha taswira ya kinabii na ya kifalme bila kuifafanua kimadhehebu kuwa huduma pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina “Elisha” na “Naam” yametumiwa kufafanua warejelewaji wa viwakilishi ambao wanaeleweka kutokana na muktadha wa Kiebrania; hakuna msimamo wa kimadhehebu ulioongezwa.
