reference: 2 Kings 5:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: sw
  text: Ikawa, mfalme wa Israeli alipoisoma barua, akararua mavazi yake na kusema, “Je, mimi ni Mungu, hata niweze kuua na kuhuisha, hata huyu ananitumia ujumbe kwamba nimponye mtu ukoma wake?[a] Tafadhali, tambueni na mwone jinsi anavyotafuta ugomvi nami.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha kwa upana zaidi ugonjwa mkali wa ngozi, si lazima ugonjwa wa Hansen pekee.
    reason: lexical_alternative
  - marker: b
    text: Au “anatafuta kisingizio dhidi yangu” au “anatafuta sababu dhidi yangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: barua
  rationale: Katika muktadha huu סֵפֶר ni ujumbe wa maandishi uliotumwa na mfalme wa Aramu; “barua” ni Kiswahili cha kawaida na sahihi kuliko “kitabu” au “hati.”
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: akararua mavazi yake
  rationale: Inahifadhi kitendo cha nahau ya Kiebrania inayoonyesha dhiki au hofu kubwa kwa lugha ya Kiswahili yenye hadhi na inayoeleweka.
- source_word: הַאֱלֹהִים אָנִי
  choice: Je, mimi ni Mungu
  rationale: Swali la balagha linatofautisha uwezo wa mfalme na mamlaka ya Mungu juu ya uhai na kifo.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: niue na kuhuisha
  rationale: Huhifadhi usambamba wa vitenzi viwili na uzito wa usemi kuhusu mamlaka ya kuondoa na kurudisha uhai.
- source_word: שֹׁלֵחַ אֵלַי ... אִישׁ
  choice: ananitumia mtu
  rationale: Inafuata kwa kawaida muktadha wa simulizi kwamba mfalme wa Aramu amemtuma Naamani kwa mfalme wa Israeli, bila kuingiza “ujumbe” kama kitu kisichotajwa wazi hapa.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: ili nimponye ugonjwa wake wa ukoma
  rationale: אָסַף pamoja na מן hapa ina maana ya kumwondolea mtu hali hiyo au kumponya. Kiswahili hiki huwasilisha maana ya nahau kwa uwazi.
- source_word: צָּרַעַת
  choice: ugonjwa wa ukoma
  rationale: “Ukoma” huhifadhi istilahi ya mapokeo katika simulizi la Naamani, huku tanbihi ikieleza kwamba neno la Kiebrania linaweza kumaanisha magonjwa mengine makali ya ngozi.
- source_word: דְּעוּ נָא וּרְאוּ
  choice: Tafadhalini, zingatieni na kuona
  rationale: “Zingatieni na kuona” huwasilisha amri mbili zinazowataka wasikilizaji watambue kwa makini jambo analolishuku mfalme; “tafadhalini” huakisi נָא.
- source_word: מִתְאַנֶּה ... לִי
  choice: anavyotafuta sababu ya kugombana nami
  rationale: Kitenzi hiki adimu kinaonyesha kutafuta nafasi, kisingizio, au ugomvi dhidi ya mtu; tafsiri hii ni ya kawaida na huhifadhi wazo la uhasama.
theological_decisions:
- issue: Maana ya הָאֱלֹהִים katika swali la mfalme
  choice: Je, mimi ni Mungu
  alternative: Je, mimi ni mungu
  rationale: Katika simulizi la Israeli, uwezo wa kuua na kuhuisha unaelezwa kuwa mamlaka ya Mungu. Herufi kubwa inafaa muktadha bila kuongeza dai lisilokuwamo katika matini.
- issue: Upeo wa maana ya צָּרַעַת
  choice: ugonjwa wa ukoma
  alternative: ugonjwa mkali wa ngozi
  rationale: Istilahi ya mapokeo imedumishwa katika matini kwa utambuzi na mwendelezo wa simulizi, lakini upeo mpana wa neno la Kiebrania umeelezwa katika tanbihi ili kuepuka kulitambulisha bila shaka na ugonjwa wa Hansen.
- issue: Maana ya מִתְאַנֶּה
  choice: kutafuta sababu ya kugombana nami
  alternative: kutafuta kisingizio dhidi yangu
  rationale: Matini inaweza kueleza kutafuta ugomvi au kutafuta nafasi ya kuchukua hatua ya uhasama. Chaguo kuu ni la asili katika Kiswahili, na uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. “Ikawa” huhifadhi mpito wa kisimulizi bila kufanya sentensi kuwa nzito; “mavazi,” “kuhuisha,” na “zingatieni” hudumisha uzito wa tukio. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
