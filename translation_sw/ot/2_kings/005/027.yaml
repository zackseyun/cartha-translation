base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: sw
  text: “Basi ugonjwa wa ngozi wa Naamani utakushika wewe na uzao wako milele.” Kisha akaondoka kutoka mbele yake, akiwa na ugonjwa wa ngozi[a], mweupe kama theluji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya jadi: “ukoma wa Naamani utakushika ... akaondoka akiwa mwenye ukoma, mweupe kama theluji.” Maneno ya Kiebrania צָרַעַת na מְצֹרָע yanahusu kwa upana ugonjwa au hali mbaya ya ngozi, wala si lazima ukoma wa kisasa (ugonjwa wa Hansen).'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: ugonjwa wa ngozi
  rationale: Neno la Kiebrania linahusu hali mbalimbali mbaya za ngozi, si lazima ugonjwa wa Hansen unaoitwa ukoma leo. Tafsiri hii huepuka utambuzi wa kitabibu usiothibitishwa na maandishi.
- source_word: נַעֲמָן
  choice: Naamani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: תִּדְבַּק
  choice: utakushikilia
  rationale: Kitenzi דבק kinaonyesha kushikamana kwa karibu; ‘utakushikilia’ ni cha asili na kinadumisha taswira yenye nguvu ya hukumu.
- source_word: וּבְזַרְעֲךָ
  choice: na uzao wako
  rationale: זֶרַע hapa humaanisha wazao. ‘Uzao’ ni neno la heshima, linaloeleweka, na huhifadhi ufupi wa Kiebrania.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Katika tamko hili la hukumu, neno linaonyesha kuendelea bila kikomo kilichotajwa.
- source_word: וַיֵּצֵא
  choice: akaondoka
  rationale: Huwasilisha kwa Kiswahili cha masimulizi tendo la kutoka au kuondoka.
- source_word: מִלְּפָנָיו
  choice: mbele yake
  rationale: Huhifadhi kwa ufasaha msemo wa Kiebrania ‘kutoka mbele zake,’ yaani kuondoka alipokuwapo Elisha.
- source_word: מְצֹרָע
  choice: akiwa na ugonjwa huo
  rationale: Neno linatokana na uwanja uleule wa maana kama צָרַעַת. ‘Ugonjwa huo’ linaunganisha wazi hali yake na ugonjwa wa Naamani bila kuutambulisha kimakosa kuwa ukoma wa kisasa.
- source_word: כַּשָּׁלֶג
  choice: mweupe kama theluji
  rationale: Kiebrania kinasema ‘kama theluji’; weupe ndio sifa inayodokezwa katika muktadha wa hali ya ngozi, hivyo umeelezwa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya צָרַעַת / מְצֹרָע
  choice: ugonjwa wa ngozi / akiwa na ugonjwa huo
  alternative: ukoma / akiwa mwenye ukoma
  rationale: Andiko linaeleza ugonjwa uliowekwa kama hukumu ya Mungu na kuendelea katika uzao, lakini halilazimishi kuutambulisha kuwa ugonjwa wa Hansen. Tafsiri pana huhifadhi ushahidi wa Kiebrania, huku tafsiri ya jadi ikitajwa katika tanbihi.
- issue: Maana ya לְעוֹלָם katika tamko la hukumu
  choice: milele
  alternative: daima
  rationale: ‘Milele’ huhifadhi uzito na kutokuwa na kikomo kulikotajwa katika tamko lenyewe bila kujaribu kutatua mvutano wa kitheolojia kuhusu uzao wa Gehazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa masimulizi ya Biblia lakini si wa kizamani; ‘uzao,’ ‘mbele yake,’ na ‘milele’ huhifadhi uzito wa tamko la hukumu.
