base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: sw
  text: Nao watu waliobaki katika nchi ya Yuda[a], ambao Nebukadneza mfalme wa Babeli alikuwa amewaacha, akamteua Gedalia mwana wa Ahikamu, mwana wa Shafani, kuwa juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioachwa”; neno la Kiebrania linaweza kutafsiriwa kwa njia zote mbili, likiwahusu wale waliokuwa bado katika Yuda baada ya watu wengine kuhamishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: watu
  rationale: Ni tafsiri ya kawaida ya nomino ya kijumla עָם katika simulizi la kihistoria.
- source_word: הַנִּשְׁאָר
  choice: waliobaki
  rationale: Kitenzi kishirikishi cha Niphal kinaeleza watu waliobaki baada ya wengine kuhamishwa, bila kutumia neno lenye uzito wa kitheolojia kama 'mabaki'.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: katika nchi ya Yuda
  rationale: Huhifadhi maana ya kijiografia ya אֶרֶץ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: ambao ... alikuwa amewaacha
  rationale: Hiphil ya שׁאר inaonyesha kwamba Nebukadneza aliwaacha watu hao wabaki; wakati uliopita timilifu unaonyesha kitendo kilichotangulia uteuzi.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadneza mfalme wa Babeli
  rationale: Majina yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili, huku cheo cha kifalme kikihifadhiwa.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: aliwaweka chini ya Gedalia
  rationale: Katika muktadha huu wa utawala, פקד pamoja na עַל humaanisha kumteua mtu awe na mamlaka juu ya wengine; muundo huu ni wa asili katika Kiswahili.
- source_word: גְּדַלְיָהוּ
  choice: Gedalia
  rationale: Umbo la jina lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: mwana wa Ahikamu, mwana wa Shafani
  rationale: Mlolongo wa nasaba wa Kiebrania umehifadhiwa kwa usahihi wa kihistoria.
- source_word: וְ
  choice: Nao
  rationale: Huonyesha mpito wa mada huku ukidumisha muunganiko wa simulizi kwa Kiswahili cha kawaida.
