  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: sw
  text: Basi, mji ukaendelea kuzingirwa mpaka mwaka wa kumi na moja wa utawala wa Mfalme Sedekia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mji ukaingia katika mzingiro,” nahau ya Kiebrania inayomaanisha kwamba mji ulikuwa katika hali ya kuzingirwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: ukaendelea
  rationale: Kitenzi בוא kwa msingi humaanisha ‘kuja/kuingia,’ lakini katika tamathali hii kinaonyesha hali iliyoendelea; ‘ukaendelea’ hutoa maana hiyo kwa Kiswahili cha kawaida bila kudai kwamba ni mwanzo wa kuzingirwa.
- source_word: הָעִיר
  choice: mji
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya עִיר yenye kiambishi cha uainishaji.
- source_word: בַּמָּצוֹר
  choice: kuzingirwa
  rationale: מָצוֹר humaanisha mazingira ya kijeshi au hali ya mji uliozingirwa. Muundo ‘ukaendelea kuzingirwa’ ni wa asili katika Kiswahili.
- source_word: עַד
  choice: mpaka
  rationale: Huonyesha kikomo cha wakati wa hali ya kuzingirwa.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: mwaka wa kumi na moja
  rationale: Katika fomula ya kutaja miaka ya utawala, idadi ya Kiebrania hutolewa kwa Kiswahili kwa namba ya mpangilio.
- source_word: לַמֶּלֶךְ
  choice: wa utawala wa Mfalme
  rationale: ל katika fomula hii hutaja mwaka wa utawala wa mfalme; kuongeza ‘utawala’ huifanya maana iwe wazi na ya kawaida kwa Kiswahili.
- source_word: צִדְקִיָּהוּ
  choice: Sedekia
  rationale: Hili ndilo umbo la jina lililozoeleka katika matumizi ya Biblia ya Kiswahili.
