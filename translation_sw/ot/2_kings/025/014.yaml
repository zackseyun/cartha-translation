translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Maandiko. “Hekalu” limeongezwa kwa uwazi wa kimuktadha katika kirai cha huduma, bila kubadili rejeo la ibada la kitenzi שרת.
