base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: sw
  text: Nao wakachukua vyungu, sepetu, mikasi ya kupunguzia utambi wa taa[a], visahani, na vyombo vyote vya shaba walivyovitumia kuhudumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “visu” au “visu vya kupogolea”; neno la Kiebrania huenda linamaanisha kifaa cha kukatia, lakini katika muktadha huu wa vyombo vya Hekalu kwa kawaida hueleweka kuwa kifaa cha kupunguzia utambi wa taa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: vyungu
  rationale: Neno סִירוֹת kwa kawaida humaanisha vyungu au vyombo; “vyungu” ni tafsiri ya kawaida na isiyobainisha kazi kuliko inavyoruhusu muktadha.
- source_word: הַיָּעִים
  choice: sepetu
  rationale: Neno יָעִים hurejelea vifaa vya kuondolea majivu au kushughulikia makaa; “sepetu” linafaa katika orodha ya vifaa vya Hekalu.
- source_word: הַמְזַמְּרוֹת
  choice: mikasi ya kutengenezea taa
  rationale: Ingawa neno hili linaweza kumaanisha vifaa vya kukatia, katika orodha za vifaa vya Hekalu kwa kawaida hueleweka kuwa vifaa vya kupunguzia tambi za taa. Maelezo ya chini yanahifadhi uwezekano mwingine wa kileksika.
- source_word: הַכַּפּוֹת
  choice: visahani
  rationale: כַּף linaweza kutaja chombo kidogo, bakuli, au chombo kinachofanana na kijiko; “visahani” ni pana na inaeleweka bila kulazimisha umbo mahususi.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: vyombo vyote vya shaba
  rationale: כְּלִים ni neno pana kwa vyombo au vifaa, na נְחֹשֶׁת katika muktadha huu hurejelea metali inayotafsiriwa kwa kawaida katika Kiswahili cha Biblia kuwa “shaba.”
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: vilivyotumiwa katika huduma ya Hekalu
  rationale: שרת hapa huhusu huduma ya ibada. Muundo huu wa Kiswahili ni wa asili, unaweka wazi muktadha wa huduma, na huepuka kiwakilishi cha mtendaji asiyeainishwa katika Kiebrania.
- source_word: לָקָחוּ
  choice: wakachukua
  rationale: Kitenzi kinamaanisha “walichukua”; kiunganishi “waka-” kinaendeleza simulizi, huku muktadha ukionyesha kuwa vyombo viliondolewa kama nyara.
