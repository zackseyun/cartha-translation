  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: sw
  text: Naye akamchukua kutoka mjini ofisa mmoja[a], aliyewekwa kusimamia wapiganaji, na watu watano kati ya wale waliouona uso wa mfalme[b], waliopatikana mjini; pia mwandishi, mkuu wa jeshi, aliyekuwa akiwakusanya watu wa nchi kwa ajili ya utumishi wa kijeshi[c], na watu sitini kutoka miongoni mwa watu wa nchi waliopatikana mjini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “towashi”; neno la Kiebrania linaweza kumaanisha towashi halisi au ofisa wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: “Waliouona uso wa mfalme” ni nahau ya Kiebrania inayomaanisha watu walioweza kufika moja kwa moja mbele ya mfalme, huenda watumishi wake wa karibu au maofisa wa ikulu.
    reason: cultural_note
  - marker: c
    text: Au “aliyekuwa akiwaandikisha” au “akiwaita” watu wa nchi kwa utumishi wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: ofisa
  rationale: Neno la Kiebrania linaweza kumaanisha towashi halisi au ofisa wa kifalme. “Ofisa” linafaa katika muktadha huu wa kiutawala na kijeshi bila kuamua hali yake ya kimwili.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: aliyekuwa amewekwa kuwa mkuu wa askari wa vita
  rationale: פָקִיד humaanisha mtu aliyewekwa kusimamia wengine. Tafsiri hii inaonyesha jukumu lake la uongozi na kuhifadhi lugha ya kijeshi.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: kati ya wale waliouona uso wa mfalme
  rationale: Tafsiri ya karibu inahifadhi nahau ya Kiebrania, huku tanbihi ikieleza kuwa inawahusu watu walioweza kufika moja kwa moja mbele ya mfalme.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: mwandishi, mkuu wa jeshi
  rationale: Muundo mfupi wa Kiebrania unaweka majina haya kwa ukaribu. Tafsiri inayaacha yote mawili yaonekane bila kulazimisha uhusiano usio wazi kabisa.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: aliyekuwa akiwakusanya watu wa nchi kwa ajili ya utumishi wa kijeshi
  rationale: Kitenzi cha Kiebrania hapa kinahusu kupanga, kuandikisha, au kuita watu kwa huduma ya kijeshi. “Kuwakusanya ... kwa ajili ya utumishi wa kijeshi” ni wazi kwa msomaji wa kawaida bila kudai kwa hakika kuwa walilazimishwa.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Tafsiri hii inahifadhi upana na uwezekano wa maana ya kijamii ya msemo wa Kiebrania bila kuufanya umaanishe tabaka fulani tu.
- source_word: נִמְצְאוּ / הַנִּמְצָאִים
  choice: waliopatikana
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na wazo kwamba watu hao walipatikana ndani ya mji baada ya kuanguka kwake.
- source_word: לָקַח
  choice: akamchukua / akamchukua ... pia
  rationale: Kitenzi cha msingi ni “kuchukua.” Muktadha unaonyesha kuwakamata na kuwaondoa, lakini tafsiri haiongezi kwa lazima nguvu isiyotajwa moja kwa moja.
