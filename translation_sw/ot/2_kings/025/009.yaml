  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: sw
  text: Akachoma kwa moto nyumba ya Yahwe[a], nyumba ya mfalme, nyumba zote za Yerusalemu, na kila nyumba kubwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “hekalu la Yahwe.” Kiebrania: “nyumba ya Yahwe.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “kila nyumba kubwa kwa ukubwa” au “kila nyumba mashuhuri.” Neno la Kiebrania linaweza kumaanisha nyumba kubwa kwa ukubwa au muhimu kwa hadhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Akaiteketeza kwa moto
  rationale: Kitenzi cha Kiebrania שׂרף kinaonyesha kuchoma kabisa au kuteketeza. Muundo wa ‘aka-’ unaendeleza mfululizo wa simulizi, na ‘kwa moto’ pia huakisi kifungu cha mwisho בָּאֵשׁ.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri hii inahifadhi kwa karibu usemi halisi wa Kiebrania, ‘nyumba ya Yahwe’; ‘hekalu la Yahwe’ ni ufafanuzi wa kimuktadha na umetolewa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa herufi YHWH limetolewa kama ‘Yahwe’, umbo la kawaida na linaloeleweka katika Kiswahili.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Huhifadhi maana halisi na ulinganifu wa kifungu hiki na ‘nyumba ya Yahwe’; ‘jumba la kifalme’ lingeongeza ufafanuzi wa kimuktadha.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: nyumba zote za Yerusalemu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania unaomaanisha nyumba zote zilizohusishwa na mji wa Yerusalemu.
- source_word: כָּל בֵּית גָּדוֹל
  choice: kila nyumba kubwa
  rationale: Umoja baada ya כָּל umetafsiriwa kwa namna ya mgawanyo, ‘kila’. ‘Kubwa’ huhifadhi kwa kiasi fulani uwezekano wa kurejelea ukubwa wa jengo au umuhimu wake bila kuamua upande mmoja.
- source_word: שָׂרַף בָּאֵשׁ
  choice: akaiteketeza kwa moto
  rationale: Kifungu cha Kiebrania kinarudia tendo la kuchoma na kutaja moto waziwazi. Kiswahili kinaunganisha msisitizo huo mwanzoni mwa orodha kwa mtiririko wa kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina lenyewe la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye hadhi. Muundo wa ‘aka-’ unaunganisha tendo hili na matukio yaliyotangulia. Tafsiri inahifadhi urudiaji wa neno ‘nyumba’ na utata wa ‘kubwa’ huku ikiepuka lugha ya kale isiyo ya lazima.
