  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: sw
  text: Naye alipewa posho yake[a], posho ya daima, kutoka kwa mfalme—sehemu iliyotengwa kwa kila siku, siku kwa siku[b]—siku zote za maisha yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mgao,” “sehemu,” au “mahitaji” badala ya “posho.” Neno la Kiebrania linamaanisha mahitaji aliyotengewa na kupewa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “jambo la siku kwa siku yake,” nahau inayomaanisha kwamba posho ilitolewa siku baada ya siku kulingana na sehemu iliyotengwa kwa kila siku.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: posho
  rationale: Katika muktadha huu neno hilo linamaanisha mgao wa mahitaji aliotengewa Yehoyakini na mfalme. “Posho” ni neno la kawaida linalofaa kwa riziki inayotolewa kwa utaratibu.
- source_word: תָּמִיד
  choice: ya kudumu
  rationale: Neno hili linaeleza kwamba posho hiyo iliendelea kutolewa bila kukoma kwa kipindi kilichotajwa.
- source_word: נִתְּנָה
  choice: alipewa
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa kitenzi cha Kiebrania katika hali ya kutendwa, huku kiwakilishi kikirejelea Yehoyakini.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: kutoka kwa mfalme
  rationale: Huhifadhi wazi wazo la chanzo au asili ya posho hiyo.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: sehemu ya kila siku kwa siku yake
  rationale: Huhifadhi muundo wa Kiebrania wenye maana ya ugawaji kwa kila siku, badala ya kuufupisha tu kuwa “kila siku.”
- source_word: כֹּל יְמֵי חַיָּו
  choice: siku zote za maisha yake
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na inayoeleweka ya nahau inayomaanisha muda wote wa maisha yake.
