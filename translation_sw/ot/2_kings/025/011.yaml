  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: sw
  text: Nebuzaradani, mkuu wa walinzi,[a] aliwapeleka uhamishoni watu waliokuwa wamebaki mjini, wale waliokuwa wamejiunga na mfalme wa Babeli,[b] na mabaki ya umati wa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkuu wa wachinjaji”; huenda hiki kilikuwa cheo cha mkuu wa walinzi wa kifalme.'
    reason: cultural_note
  - marker: b
    text: Kihalisi, “wale walioanguka kwa mfalme wa Babeli,” yaani, wale walioenda upande wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: watu wengine waliokuwa wamebaki mjini
  rationale: Huwatambulisha wale waliosalia Yerusalemu baada ya kuzingirwa; Kiswahili hiki ni cha kawaida na hakiongezi wazo la kuachwa kwa makusudi.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: wale waliokuwa wamejiunga na mfalme wa Babeli
  rationale: Katika muktadha wa kijeshi na kisiasa, nahau נפל על humaanisha kwenda upande wa mtawala au kujiunga naye, si kuanguka kihalisi. Usemi huu hauamui ikiwa wote walikuwa wanajeshi, kama neno 'waasi' lingeweza kudokeza.
- source_word: יֶתֶר הֶהָמוֹן
  choice: watu wengine waliobaki
  rationale: הָמוֹן hapa ni kundi kubwa au umati wa watu. Uamuzi huu ni wa asili katika Kiswahili, ingawa tofauti yake na kundi la kwanza si dhahiri kabisa katika Kiebrania.
- source_word: הֶגְלָה
  choice: aliwapeleka uhamishoni
  rationale: Hifili ya גלה inaonyesha kuwahamisha watu kwa nguvu na kuwapeleka ugenini.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradani
  rationale: Umbo hili la jina linafuata uandikaji unaosomeka kwa kawaida katika Kiswahili.
- source_word: רַב טַבָּחִים
  choice: mkuu wa walinzi
  rationale: Hiki ni cheo cha afisa wa Babeli. Tafsiri ya kiutendaji inaepuka picha potovu ya mchinjaji wa kawaida, huku tanbihi ikihifadhi maana halisi ya maneno.
