  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: sw
  text: Naye akabadilisha mavazi yake ya kifungoni, akala chakula daima mbele yake[a] siku zote za maisha yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uwepo wake”; maneno haya yanaweza pia kudokeza kwamba alikula kwenye meza ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: Naye akabadilisha
  rationale: Kitenzi katika piel kinamaanisha kubadilisha. Katika muktadha huu kinaonyesha kwamba Yehoyakini aliacha mavazi aliyovaa kifungoni.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: mavazi yake ya kifungoni
  rationale: Tafsiri hii inahifadhi maana ya mavazi yanayohusiana na hali yake ya kufungwa, huku ikisikika kwa kawaida na kwa heshima katika Kiswahili.
- source_word: וְאָכַל לֶחֶם
  choice: akawa akila chakula
  rationale: Ingawa neno kwa neno ni ‘alikula mkate,’ usemi wa Kiebrania hapa unamaanisha kula milo. ‘Chakula’ huwasilisha maana hiyo ya kawaida bila kudokeza kuwa alikula mkate pekee.
- source_word: תָּמִיד
  choice: daima
  rationale: Neno hili linaonyesha mwendelezo au utaratibu usiokoma; ‘daima’ linafaa pamoja na kirai kinachofuata kuhusu maisha yake yote.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Hii inafuata kwa karibu usemi wa Kiebrania na kuhifadhi uwezekano wa kumaanisha katika uwepo wa mfalme au kula mezani pake bila kuufanya udokezo huo kuwa tafsiri kuu.
- source_word: כָּל יְמֵי חַיָּיו
  choice: siku zote za maisha yake
  rationale: Ni usemi wa kawaida unaohifadhi muundo na maana ya Kiebrania ya muda wa maisha yake yote.
