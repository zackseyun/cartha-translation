  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֣ךְ אֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִיתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: sw
  text: Mfalme wa Babeli akawapiga na kuwaua huko Ribla, katika nchi ya Hamathi.[a] Hivyo Yuda akapelekwa uhamishoni kutoka katika nchi yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina vitenzi viwili vinavyofuatana: “akawapiga” na “kuwaua.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “Yuda akaenda uhamishoni kutoka katika nchi yake.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa kauli tendaji au tendwa katika muktadha huu; kauli tendwa hukazia kuhamishwa kwa lazima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: akawapiga
  rationale: Neno נכה kwa kawaida humaanisha kupiga. Tafsiri hii inadumisha kitenzi cha kwanza bila kukiunganisha na וַיְמִיתֵם, kinachotaja wazi kuwaua.
- source_word: וַיְמִיתֵם
  choice: na kuwaua
  rationale: Katika kausativi, מות humaanisha kusababisha kufa au kuua. Muundo huu ni wa kawaida katika Kiswahili na huhifadhi tendo la pili.
- source_word: מֶלֶךְ בָּבֶל
  choice: Mfalme wa Babeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: בְּרִבְלָה
  choice: huko Ribla
  rationale: Hutaja mahali tukio lilipotokea kwa Kiswahili cha kawaida.
- source_word: בְּאֶרֶץ חֲמָת
  choice: katika nchi ya Hamathi
  rationale: Huhifadhi istilahi ya kijiografia אֶרֶץ na kutofautisha eneo la Hamathi na mji wa Ribla.
- source_word: וַיִּגֶל
  choice: akapelekwa uhamishoni
  rationale: Katika muktadha huu גלה hutaja kuhamishwa kwa lazima. Kauli tendwa huonyesha kuwa Yuda ndiye aliyeondolewa, bila kutaja mtendaji ambaye Kiebrania hakumtaji wazi katika kishazi hiki.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina linaachwa kwa ufupi kama katika Kiebrania, likiweka uwezekano wa kurejelea taifa au watu wake.
- source_word: מֵעַל אַדְמָתוֹ
  choice: kutoka katika nchi yake
  rationale: Katika muktadha wa uhamisho, אֲדָמָה humaanisha nchi au ardhi. 'Nchi yake' ni ya asili na hudumisha uhusiano wa Yuda na nchi hiyo.
theological_decisions:
- issue: Kauli ya uhamisho katika וַיִּגֶל
  choice: Yuda akapelekwa uhamishoni
  alternative: Yuda akaenda uhamishoni
  rationale: Umbo la Kiebrania linaweza kuwasilishwa kwa kauli inayoonekana tendaji au tendwa kulingana na uchanganuzi wa kimuktadha. Kauli tendwa inaonyesha vizuri uhamisho wa kulazimishwa bila kuondoa uwezekano huo wa kisarufi, ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa Biblia ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Babeli, Ribla, na Hamathi. Vitenzi viwili vya hukumu vimedumishwa, na uhamisho umetafsiriwa kwa kauli tendwa ili kuonyesha kulazimishwa.
