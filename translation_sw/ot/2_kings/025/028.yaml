  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: sw
  text: Akasema naye kwa fadhili[a], na akakiweka kiti chake cha enzi juu ya viti vya enzi vya wafalme waliokuwa pamoja naye huko Babeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akasema naye mambo mema”; hii ni nahau yenye maana ya kusema naye kwa wema au kwa upendeleo.
    reason: lexical_alternative
  - marker: b
    text: “Kiti cha enzi” kinaweza pia kumaanisha “kiti” halisi; maana ni kwamba Yehoyakini alipewa cheo au nafasi ya heshima iliyo juu ya wafalme wengine waliokuwa Babeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: Akasema naye kwa fadhili
  rationale: Kirai cha Kiebrania kinamaanisha kihalisi ‘alisema naye mambo mema,’ lakini katika muktadha ni nahau ya kusema naye kwa namna ya wema au upendeleo. ‘Kwa fadhili’ ni Kiswahili cha kawaida na chenye heshima kinachowasilisha maana hiyo.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: akakiweka kiti chake cha enzi
  rationale: Kitenzi נתן pamoja na ‘kiti cha enzi’ hapa kinaeleza kukipangia au kukiweka katika nafasi fulani, si kumpa kitu kama zawadi. ‘Akakiweka’ hudumisha picha halisi huku muktadha ukionyesha hadhi.
- source_word: כִּסְאוֹ
  choice: kiti chake cha enzi
  rationale: כִּסֵּא inaweza kuwa kiti halisi au kiti cha enzi. Tafsiri hii inadumisha picha ya kifalme na maana ya hadhi, huku tanbihi ikitaja uwezekano wa kuelewa kiti halisi cha heshima.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: juu ya viti vya enzi vya wafalme
  rationale: מֵעַל huonyesha nafasi ya juu, hapa ikidokeza cheo au heshima kubwa zaidi. Wingi ‘viti vya enzi’ ni wa asili katika Kiswahili kwa kuwa kila mfalme ana kiti chake, ingawa muundo wa Kiebrania una nomino ya umoja katika kirai tegemezi.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: wafalme waliokuwa pamoja naye
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha Kiebrania, bila kulazimisha ikiwa walikuwa mateka, wageni wa ikulu, au watawala wa aina nyingine.
- source_word: בְּבָבֶל
  choice: huko Babeli
  rationale: ‘Huko’ huonyesha mahali kwa Kiswahili cha kawaida, na ‘Babeli’ ni jina la jadi la mahali hapo katika tafsiri za Biblia za Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia ‘Akasema ... akakiweka’; istilahi ‘kiti cha enzi’ inalinda picha na maana ya kifalme ya Kiebrania, huku tanbihi zikihifadhi maana mbadala za kileksika.
