  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa kitu kabla ya mtendaji na marudio ya “dhahabu” na “fedha” yanahifadhi ladha ya orodha ya Kiebrania; vistari virefu vinasaidia kutenganisha uainishaji huo na kishazi kikuu.
