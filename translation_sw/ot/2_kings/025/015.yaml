  text: וְ/אֶת הַ/מַּחְתּוֹת֙ וְ/אֶת הַ/מִּזְרָק֗וֹת אֲשֶׁ֤ר זָהָב֙ זָהָ֔ב וַ/אֲשֶׁר כֶּ֖סֶף כָּ֑סֶף לָקַ֖ח רַב טַבָּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/015.yaml
  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: sw
  text: Na vyombo vya kubebea makaa[a] na mabakuli[b]—vilivyokuwa vya dhahabu, dhahabu, na vilivyokuwa vya fedha, fedha[c]—mkuu wa walinzi[d] akavichukua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyetezo.”
    reason: lexical_alternative
  - marker: b
    text: Au “mabeseni.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kinarudia majina ya nyenzo: “vilivyokuwa vya dhahabu, dhahabu, na vilivyokuwa vya fedha, fedha,” ili kusisitiza uainishaji wake kulingana na nyenzo.'
    reason: lexical_alternative
  - marker: d
    text: Au “mkuu wa wauaji” au “kamanda wa walinzi wa mfalme.” Hiki kilikuwa cheo cha afisa wa Babeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: vyombo vya kubebea makaa
  rationale: Neno מַחְתָּה linataja chombo cha kuchukulia au kubebea makaa katika huduma ya Hekalu. Usemi huu ni wazi kwa msomaji wa kisasa bila kulazimisha maana ya uvumba.
- source_word: הַמִּזְרָקוֹת
  choice: mabakuli
  rationale: מִזְרָק ni chombo cha ibada kilichotumiwa kuhifadhia au kunyunyizia kimiminika. “Mabakuli” ni Kiswahili cha kawaida; “mabeseni” ni tafsiri nyingine inayowezekana.
- source_word: אֲשֶׁר זָהָב זָהָב
  choice: vilivyokuwa vya dhahabu, dhahabu
  rationale: Marudio ya nomino ya nyenzo yamehifadhiwa ili kuonyesha mtindo mfupi wa orodha na uainishaji wenye mkazo katika Kiebrania.
- source_word: וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: na vilivyokuwa vya fedha, fedha
  rationale: Kama ilivyo kwa dhahabu, marudio ya “fedha” yanahifadhi uainishaji na mkazo wa maandishi ya Kiebrania.
- source_word: לָקַח
  choice: akavichukua
  rationale: Maana ya msingi ya kitenzi ni “alichukua.” Kiambishi “-vi-” kinarejelea vyombo vilivyotajwa, huku muktadha ukionyesha kuwa vilichukuliwa kama nyara.
- source_word: רַב טַבָּחִים
  choice: mkuu wa walinzi
  rationale: Katika muktadha huu kirai hiki ni cheo cha afisa mkuu wa Babeli. “Mkuu wa walinzi” ni cha kawaida na hakifungii maana kwenye mojawapo ya asili zinazowezekana za cheo hicho.
