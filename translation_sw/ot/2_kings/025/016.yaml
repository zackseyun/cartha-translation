  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: sw
  text: Kuhusu zile nguzo mbili, Bahari ile moja, na vibebeo ambavyo Sulemani alikuwa ametengeneza kwa ajili ya nyumba ya Yahweh, hapakuwa na kipimo cha uzito wa shaba ya vyombo hivyo vyote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hapakuwa na uzito wa shaba ya vyombo hivyo vyote.” Huenda usemi huu unamaanisha kwamba shaba ilikuwa nyingi sana hivi kwamba haikupimwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: zile nguzo mbili
  rationale: Nguzo ni neno la kawaida na linalofaa kwa עַמּוּדִים katika muktadha wa jengo la hekalu; kiashiria 'zile' kinarejelea vitu vilivyotajwa katika muktadha uliotangulia.
- source_word: הַיָּם הָאֶחָד
  choice: Bahari ile moja
  rationale: Bahari ni jina la chombo kikubwa cha shaba cha hekaluni. Herufi kubwa inaonyesha matumizi yake kama jina maalumu huku maana halisi ya Kiebrania ikihifadhiwa.
- source_word: וְהַמְּכֹנוֹת
  choice: vikalio
  rationale: מְכֹנוֹת ni miundo ya msingi iliyobeba mabirika. 'Vikalio' linaeleza kazi yake kwa Kiswahili cha kawaida bila kuongeza wazo la kwamba lazima vilikuwa vya kuhamishwa.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: ambavyo Sulemani alikuwa ametengeneza
  rationale: Wakati timilifu wa zamani unaonyesha kwamba utengenezaji ulitangulia kuvunjwa na kuchukuliwa kwa vifaa hivi katika simulizi.
- source_word: לְבֵית יְהוָה
  choice: kwa ajili ya nyumba ya Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania 'nyumba' na kulitaja jina la agano יְהוָה kama Yahweh.
- source_word: לֹא הָיָה מִשְׁקָל
  choice: haikuwezekana kupima uzito
  rationale: Usemi huu wa asili unaonyesha kwamba kiasi cha shaba kilikuwa kikubwa mno kuhesabiwa kwa uzito; tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi uwezekano wa muundo halisi zaidi.
- source_word: לִנְחֹשֶׁת
  choice: shaba
  rationale: Katika muktadha wa vifaa vya hekalu, נְחֹשֶׁת hurejelea metali ya shaba, kwa kawaida aloi ya bronzi; 'shaba' ndilo neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: vyombo hivyo vyote
  rationale: Vyombo ni neno pana na la kawaida kwa כֵּלִים katika muktadha wa vifaa vya hekalu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni; 'Yahweh' huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לֹא הָיָה מִשְׁקָל
  choice: haikuwezekana kupima uzito
  alternative: hapakuwa na uzito kwa shaba
  rationale: Chaguo kuu linafikisha maana ya wingi usiopimika katika Kiswahili cha asili, lakini tanbihi huhifadhi muundo na utata wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Bahari' imeandikwa kwa herufi kubwa kama jina maalumu la birika kubwa la hekaluni; 'vikalio' limetumiwa kwa miundo iliyobeba mabirika.
