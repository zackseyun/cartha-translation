translation:
  language: sw
  text: Nalo jeshi lote la Wakaldayo lililokuwa pamoja na mkuu wa walinzi lilibomoa kuta za Yerusalemu pande zote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wa wachinjaji” au “mkuu wa walinzi wa karibu”; haya ni maana mbadala za cheo cha Kiebrania rab-tabbaḥim.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת
  choice: kuta
  rationale: Wingi wa חוֹמָה hapa unarejelea kuta za ulinzi za jiji; “kuta” ni tafsiri ya kawaida na ya wazi katika Kiswahili.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili cha Biblia.
- source_word: סָבִיב
  choice: pande zote
  rationale: Kirai hiki kinaonyesha kwamba kuta zilizozunguka jiji lote zilibomolewa.
- source_word: נָתְצוּ
  choice: lilibomoa
  rationale: Kitenzi נתץ humaanisha kubomoa au kuangusha jengo; umoja unapatana na nomino ya mkusanyiko “jeshi lote.”
- source_word: כָּל חֵיל
  choice: jeshi lote
  rationale: חֵיל katika muktadha huu ni kikosi cha kijeshi, na כָּל hukihusisha kwa ukamilifu.
- source_word: כַּשְׂדִּים
  choice: Wakaldayo
  rationale: Huhifadhi jina la kabila lililotumiwa moja kwa moja katika Kiebrania badala ya kulibadili kuwa “Wababeli.”
- source_word: אֲשֶׁר
  choice: lililokuwa pamoja na
  rationale: Kihusishi hiki kinaunganisha jeshi na afisa aliyetajwa; “pamoja na” huweka wazi uhusiano uliodokezwa bila kuamua kwamba lilikuwa chini ya amri yake moja kwa moja.
- source_word: רַב טַבָּחִים
  choice: mkuu wa walinzi
  rationale: Ni cheo cha afisa mkuu wa kifalme aliyehusishwa na ulinzi na pia utekelezaji wa hukumu; “mkuu wa walinzi” ni cha asili na cha kueleweka katika muktadha.
