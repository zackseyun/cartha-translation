translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi hufuata msisitizo wa chanzo huku ukitumia upatanisho wa kawaida wa Kiswahili kwa nomino ya mkusanyiko “jeshi.”
