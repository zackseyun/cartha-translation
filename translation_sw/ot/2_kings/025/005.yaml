  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: sw
  text: Lakini jeshi la Wakaldayo[a] lilimfuatilia mfalme na likamfikia katika tambarare za Yeriko[b], nalo jeshi lake lote likatawanyika mbali naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jeshi la Wababeli.” Kiebrania kinasema “Wakaldayo,” jina linalotumiwa katika muktadha huu kurejelea majeshi ya Babeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika nyika za Yeriko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: jeshi la Wakaldayo
  rationale: חֵיל katika simulizi la kijeshi humaanisha jeshi au nguvu za kijeshi, na כַּשְׂדִּים ni jina la moja kwa moja la Wakaldayo; hapa linarejelea majeshi ya Babeli.
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  choice: lilimfuatilia mfalme
  rationale: Kitenzi רדף pamoja na אַחַר kinaonyesha kuwinda au kufuatilia kwa lengo la kumkamata. Kiswahili 'kumfuatilia' ni cha kawaida katika muktadha huu wa kijeshi.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: na kumpata
  rationale: נשׂג hapa ni kumfikia mtu baada ya kumfuatilia. 'Kumpata' huwasilisha kwa lugha ya kawaida kwamba jeshi lilimfikia na kumkamata katika harakati zake.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: katika tambarare za Yeriko
  rationale: עֲרָבוֹת hurejelea maeneo tambarare, makavu au ya nyika; 'tambarare' ni wazi na ya kawaida, huku tanbihi ikihifadhi maana mbadala ya 'nyika.'
- source_word: וְכָל חֵילוֹ
  choice: nalo jeshi lake lote
  rationale: חֵיל ni nomino ya kijumla inayoweza kutafsiriwa 'jeshi'; כָל inasisitiza jeshi lote.
- source_word: נָפֹצוּ מֵעָלָיו
  choice: likatawanyika na kumwacha
  rationale: נפץ inaonyesha kutawanyika, na מֵעָלָיו inaonyesha kuondoka kutoka karibu naye. 'Na kumwacha' huonyesha utengano huo kwa Kiswahili cha asili bila kuongeza sababu yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Jina la jadi 'Wakaldayo' limehifadhiwa kwa ulinganifu rasmi na Kiebrania, huku 'Wababeli' likitolewa katika tanbihi. 'Tambarare' limetumiwa badala ya neno la kitaalamu zaidi 'stepu.'
