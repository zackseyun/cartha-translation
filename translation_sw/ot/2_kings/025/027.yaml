  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: sw
  text: Ikawa katika mwaka wa thelathini na saba wa uhamisho wa Yehoyakini, mfalme wa Yuda, katika mwezi wa kumi na mbili, siku ya ishirini na saba ya mwezi huo, Evil-Merodaki[a], mfalme wa Babeli, katika mwaka wa utawala wake[b], aliinua kichwa cha Yehoyakini, mfalme wa Yuda, kutoka gerezani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Evil-Merodaki anajulikana pia katika historia kwa jina Amel-Marduki.
    reason: cultural_note
  - marker: b
    text: Maneno “katika mwaka wa utawala wake” huenda yakamaanisha “katika mwaka wa kwanza wa utawala wake.”
    reason: alternative_reading
  - marker: c
    text: Nahau ya Kiebrania “aliinua kichwa cha” hapa inamaanisha kwamba alimwinua hadhi ya Yehoyakini au alimwonyesha fadhili, jambo lililoanza kwa kumtoa gerezani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hufungua tukio jipya la simulizi kwa njia fupi, ya asili na yenye hadhi katika Kiswahili.
- source_word: לְגָלוּת
  choice: wa uhamisho
  rationale: Neno גָּלוּת linahusu kupelekwa uhamishoni na hali iliyotokana na kuondolewa katika nchi; “uhamisho” ni wazi na la kawaida.
- source_word: יְהוֹיָכִין
  choice: Yehoyakini
  rationale: Hufuata namna ya kawaida ya kuandika jina hili katika Kiswahili cha Biblia huku ikikaribia matamshi ya Kiebrania.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: katika mwezi wa kumi na mbili
  rationale: Ni namna ya kawaida ya Kiswahili ya kutoa tarehe hii ya Kiebrania.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: siku ya ishirini na saba ya mwezi huo
  rationale: Huonyesha wazi kuwa ni siku ya mwezi uliotajwa, bila kubadili taarifa ya chanzo.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Evil-Merodaki
  rationale: Ni unukuzi wa jina la kifalme kama linavyoonekana katika maandishi ya Kiebrania; umbo la kihistoria la Kiakadi linaelezwa katika tanbihi.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: katika mwaka wa kutawala kwake
  rationale: Huhifadhi maana halisi bila kuingiza katika matini kuu hitimisho kwamba ulikuwa mwaka wa kwanza.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: aliinua kichwa cha
  rationale: Huhifadhi nahau halisi ya Kiebrania na mvutano wake wa kimaana; tanbihi inaeleza kwamba katika muktadha huu ni kumwinua hadhi au kumfadhili.
- source_word: מִבֵּית כֶּלֶא
  choice: kutoka gerezani
  rationale: Ni tafsiri ya kawaida na wazi ya mahali pa kufungwa, huku ikihifadhi uhusiano wa kisarufi na nahau iliyotangulia.
theological_decisions:
- issue: Ikiwa בִּשְׁנַת מָלְכוֹ hutaja hasa mwaka wa kwanza wa utawala
  choice: katika mwaka wa kutawala kwake
  alternative: katika mwaka wa kwanza wa utawala wake
  rationale: Kiebrania chenyewe hakina neno la wazi la “kwanza.” Ingawa muktadha unaweza kudokeza hivyo, tafsiri kuu haiongezi ufafanuzi huo; uwezekano huo unawekwa katika tanbihi.
- issue: Maana ya nahau נָשָׂא אֶת רֹאשׁ
  choice: aliinua kichwa cha
  alternative: alimfadhili / alimwinua hadhi na kumtoa gerezani
  rationale: Nahau inaweza kuonyesha kuinuliwa hadhi au kuonyeshwa fadhili, na hapa kunahusiana na kutoka gerezani. Kutunza nahau katika matini na kuifafanua katika tanbihi huepuka kufuta taswira ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa tarehe umewekwa wazi kwa msomaji wa kawaida, huku nahau ya Kiebrania na uwezekano wa maana ya mwaka wa utawala vikihifadhiwa kwa tanbihi.
