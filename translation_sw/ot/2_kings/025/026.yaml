translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau “kuanzia mdogo hadi mkubwa” imeachwa ikiwa pana ili isihusishwe kwa lazima na umri au cheo pekee. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
