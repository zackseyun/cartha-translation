base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: sw
  text: Ndipo watu wote, kuanzia mdogo hadi mkubwa, pamoja na makamanda wa vikosi[a], wakainuka wakaenda Misri, kwa sababu waliwaogopa Wakaldayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wa vikosi” au “maofisa wa jeshi.”
    reason: Njia mbadala za kutafsiri שָׂרֵי הַחֲיָלִים, ambayo inaweza kueleza makamanda au maofisa wanaoongoza vikosi vya kijeshi.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Kitenzi hiki kinaonyesha hatua ya makusudi katika mfululizo wa simulizi; “wakainuka” hakifanyi maana iwe kusimama kimwili tu wala kuondoka tu.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Huhifadhi maana ya jumla ya kundi lote kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: kuanzia mdogo hadi mkubwa
  rationale: Huhifadhi nahau ya Kiebrania inayojumuisha wote bila kuifunga kwa tofauti ya umri au hadhi pekee.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: pamoja na makamanda wa majeshi
  rationale: שָׂרֵי ni viongozi au makamanda, na הַחֲיָלִים hapa inaelekea kumaanisha vikosi vya kijeshi; “makamanda wa majeshi” ni lugha ya sasa na inayoeleweka.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: wakaenda Misri
  rationale: Ingawa בוא kimsingi inaweza kuwa “kuja,” mtazamo wa msimulizi katika Kiswahili unahitaji “wakaenda Misri.”
- source_word: כִּי
  choice: kwa sababu
  rationale: Huanzisha sababu ya wao kuondoka na ni wazi katika Kiswahili cha sasa.
- source_word: יָרְאוּ מִפְּנֵי כַשְׂדִּים
  choice: waliwaogopa Wakaldayo
  rationale: Muundo huu unaonyesha kuwa Wakaldayo ndio waliowatia hofu; “waliwaogopa” ni usemi wa kawaida wa Kiswahili.
