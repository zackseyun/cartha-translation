  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: sw
  text: Siku ya tisa ya mwezi, njaa ikawa kali mjini, na hakukuwa na mkate[a] kwa ajili ya watu wa nchi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chakula,” kwa kuwa neno “mkate” linaweza kutumiwa kwa maana pana ya chakula.
    reason: lexical_alternative
  - marker: b
    text: Katika baadhi ya mazingira, “watu wa nchi” kinaweza kumaanisha hasa watu wa kawaida au wakazi wa eneo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: Siku ya tisa ya mwezi
  rationale: Kiebrania kinasema kihalisi ‘tarehe tisa ya mwezi’; kuongeza ‘siku’ ni kawaida ya Kiswahili na hufanya tarehe ieleweke wazi.
- source_word: וַיֶּחֱזַק
  choice: ikawa kali
  rationale: Kitenzi חזק humaanisha kuwa na nguvu au kuimarika; kinapotumiwa kuhusu njaa, ‘ikawa kali’ ni Kiswahili cha kawaida kinachoonyesha kuongezeka kwa ukali.
- source_word: הָרָעָב
  choice: njaa
  rationale: Katika mazingira ya kuzingirwa kwa mji, רָעָב ni upungufu mkubwa wa chakula, yaani njaa, si hisia ya kuwa na njaa tu.
- source_word: בָּעִיר
  choice: mjini
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya mahali, ‘katika mji.’
- source_word: וְלֹא הָיָה לֶחֶם
  choice: wala hapakuwa na mkate
  rationale: לֶחֶם humaanisha kihalisi ‘mkate,’ ingawa pia inaweza kutumiwa kwa maana pana ya chakula. Tafsiri kuu inadumisha picha halisi ya chanzo, huku tanbihi ikionyesha maana pana inayowezekana.
- source_word: לְעַם הָאָרֶץ
  choice: kwa ajili ya watu wa nchi
  rationale: Hii inadumisha muundo na upana wa maana ya Kiebrania. Katika baadhi ya mazingira kirai hiki kinaweza kumaanisha watu wa kawaida au wakazi wa eneo, lakini mstari huu pekee haulazimishi maana hiyo nyembamba.
