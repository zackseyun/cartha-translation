base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: sw
  text: Ikawa katika mwezi wa saba, Ishmaeli mwana wa Nethania, mwana wa Elishama, aliyetokana na ukoo wa kifalme,[a] akaja pamoja na watu kumi. Nao wakampiga Gedalia, naye akafa; wakawapiga pia Wayuda na Wakaldayo[b] waliokuwa pamoja naye huko Mispa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wa uzao wa kifalme”; yaani, Ishmaeli alikuwa wa nasaba ya nyumba ya kifalme.
    reason: lexical_alternative
  - marker: b
    text: “Wakaldayo” pia wanaweza kuitwa “Wababeli” katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni mwanzo wa kawaida wa tukio katika masimulizi ya Kiebrania; “Ikawa” huhifadhi kazi hiyo bila kutumia lugha nzito au ya kizamani kupita kiasi.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: katika mwezi wa saba
  rationale: Hutoa kwa uwazi usemi wa wakati ulio katika Kiebrania.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: aliyetokana na ukoo wa kifalme
  rationale: Usemi huu wa asili unaeleza nasaba ya nyumba ya kifalme. Tafsiri hii ni ya kawaida katika Kiswahili huku tanbihi ikihifadhi picha halisi ya “uzao.”
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: pamoja na watu kumi
  rationale: Ni Kiswahili cha asili kinachoonyesha kwamba watu hao waliandamana naye.
- source_word: וַיַּכּוּ
  choice: Wakampiga
  rationale: Kitenzi נכה kina maana ya kupiga au kuangusha kwa shambulio. “Wakampiga” hakichanganyi tendo hili na taarifa inayofuata kwamba Gedalia alikufa.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Kitenzi ni cha umoja na kwa kawaida kinamrejelea Gedalia. Tafsiri inadumisha mfuatano wa Kiebrania na haitoi hitimisho lisilotajwa moja kwa moja.
- source_word: הַיְּהוּדִים
  choice: Wayuda
  rationale: Katika muktadha huu wa kihistoria, jina hili linawaonyesha watu wa Yuda kwa usahihi kuliko neno lenye maana pana ya baadaye.
- source_word: הַכַּשְׂדִּים
  choice: Wakaldayo
  rationale: Hili ndilo jina la kikabila lililo katika Kiebrania; katika muktadha linaweza kumaanisha Wababeli.
- source_word: בַּמִּצְפָּה
  choice: huko Mispa
  rationale: Ni usemi wa kawaida wa Kiswahili kwa eneo lililotajwa tayari katika simulizi.
