translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio rasmi lakini unaoeleweka kwa urahisi. Muundo “Wakampiga Gedalia, naye akafa” umehifadhi tofauti ya Kiebrania kati ya shambulio na kifo, huku “pamoja na” ikiunganisha Wayuda na Wakaldayo kama walengwa wengine wa shambulio.
