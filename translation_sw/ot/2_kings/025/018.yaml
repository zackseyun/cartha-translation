base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: sw
  text: Mkuu wa walinzi akawachukua Seraya, kuhani mkuu[a], Sefania, kuhani wa pili, na wale walinzi watatu wa kizingiti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhani aliye mkuu” au “kuhani kiongozi.” Kiebrania kihalisi ni “kuhani, mkuu/kichwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walinzi wa lango” au “walinzi wa mwingilio wa hekalu.” Kiebrania kihalisi ni “walinzi wa kizingiti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: Mkuu wa walinzi
  rationale: Katika muktadha wa kifalme na kijeshi, cheo hiki kinamtaja kamanda wa walinzi wa mfalme; tafsiri ya neno kwa neno kama ‘mkuu wa wachinjaji’ ingepotosha maana ya cheo hicho.
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: Kitenzi לקח kimsingi ni ‘chukua.’ Kiambishi cha wingi kinaonyesha kwa kawaida katika Kiswahili kwamba maofisa wote waliotajwa ndio waliochukuliwa, huku muktadha ukidokeza kukamatwa kwao bila kulazimisha maana hiyo ndani ya kitenzi.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: kuhani mkuu
  rationale: Huwakilisha kwa ufupi na kwa kawaida ‘kuhani aliye mkuu/kiongozi,’ yaani ofisa mkuu wa ukuhani, bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
- source_word: כֹּהֵן מִשְׁנֶה
  choice: kuhani wa pili
  rationale: מִשְׁנֶה huonyesha cheo cha pili au naibu. ‘Kuhani wa pili’ huhifadhi muundo na utata wa Kiebrania; maana ya cheo inaelezwa katika uamuzi wa kitafsiri.
- source_word: שֹׁמְרֵי הַסַּף
  choice: walinzi wa kizingiti
  rationale: Huhifadhi taswira halisi ya ‘walinzi/watunza kizingiti,’ huku tanbihi ikitoa maana inayowezekana ya kiutendaji katika lango la hekalu.
- source_word: שְׁלֹשֶׁת
  choice: wale ... watatu
  rationale: Muundo huu wa Kiswahili unaonyesha kundi maalumu la watu watatu linalotajwa katika Kiebrania.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Jina limenukuliwa kwa umbo linalotambulika na linalofaa mfumo wa sauti wa Kiswahili.
- source_word: צְפַנְיָהוּ
  choice: Sefania
  rationale: Jina limenukuliwa kwa umbo la kawaida na linalotambulika katika Kiswahili.
theological_decisions:
- issue: Maana ya כֹּהֵן הָרֹאשׁ
  choice: kuhani mkuu
  alternative: kuhani aliye mkuu; kuhani kiongozi
  rationale: Kiebrania ni ‘kuhani, mkuu/kichwa.’ Tafsiri hii inaonyesha hadhi yake ya uongozi bila kuamua zaidi ya maandishi iwapo jina rasmi la kiufundi linakusudiwa.
- issue: Maana ya כֹּהֵן מִשְׁנֶה
  choice: kuhani wa pili
  alternative: naibu kuhani; kuhani wa cheo cha pili
  rationale: Neno linaweza kumaanisha aliyeshika nafasi ya pili au naibu. Tafsiri kuu inahifadhi ufupi na utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Akawachukua’ ni lugha ya kawaida inayohifadhi kitenzi cha Kiebrania huku muktadha ukionyesha kuwa walikamatwa. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
