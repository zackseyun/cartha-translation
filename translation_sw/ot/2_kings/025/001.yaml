source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבֻכַדְנֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֧וּא וְ/כָל חֵיל֛/וֹ עַל יְרוּשָׁלִַ֖ם וַ/יִּ֣חַן עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֖י/הָ דָּיֵ֥ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: sw
  text: Ikawa, katika mwaka wa tisa wa utawala wake, katika mwezi wa kumi, siku ya kumi ya mwezi, Nebukadneza[a], mfalme wa Babeli, akaja dhidi ya Yerusalemu, yeye pamoja na jeshi lake lote. Wakapiga kambi dhidi ya mji huo, wakajenga ukuta wa kuuzingira pande zote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia linaweza kuandikwa “Nebukadreza” katika mapokeo mengine ya tahajia.
    reason: lexical_alternative
  - marker: b
    text: Au “ngome za kuzingiria” au “miundo ya kuzingiria.” Neno la Kiebrania דָּיֵק humaanisha ujenzi wa kijeshi uliowekwa dhidi ya mji wakati wa kuzingirwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kiunganishi cha simulizi cha Kiebrania kwa lugha yenye hadhi bila kutumia usemi mrefu au wa kizamani kupita kiasi.
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: katika mwaka wa tisa wa utawala wake
  rationale: Ni fomula ya kawaida ya kuhesabu miaka ya utawala wa mfalme; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: mwezi wa kumi, siku ya kumi ya mwezi
  rationale: Huhifadhi mfumo wa tarehe wa maandishi bila kuugeuza kuwa jina la mwezi wa kalenda ya kisasa.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadneza
  rationale: Hili ndilo umbo linalotambulika sana katika mapokeo ya Kiswahili na linalolingana na tahajia ya jina katika WLC hapa.
- source_word: הוּא וְכָל חֵילוֹ
  choice: yeye pamoja na jeshi lake lote
  rationale: Neno 'yeye' huhifadhi msisitizo kwamba mfalme mwenyewe alikuja pamoja na nguvu zake zote za kijeshi.
- source_word: עַל יְרוּשָׁלַםִ
  choice: dhidi ya Yerusalemu
  rationale: Katika muktadha wa kijeshi, עַל ina maana ya uadui; 'dhidi ya' huepuka kuonyesha kwamba walikwenda mjini kwa kusudi lisilo la kivita.
- source_word: וַיִּחַן עָלֶיהָ
  choice: Wakapiga kambi dhidi ya mji huo
  rationale: Hueleza kuweka kambi ya kijeshi kwa kusudi la kuuzingira mji, huku 'mji huo' ikifanya rejeleo la kike la Kiebrania lieleweke kwa kawaida katika Kiswahili.
- source_word: דָּיֵק
  choice: ukuta wa kuuzingira
  rationale: Neno hilo hutaja ujenzi wa kijeshi uliowekwa dhidi ya mji wakati wa kuzingirwa. 'Ukuta wa kuuzingira' ni halisi, wazi, na rahisi kueleweka, huku tanbihi ikihifadhi upana wa maana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa tarehe na msisitizo wa mfalme kuja pamoja na jeshi lake lote umehifadhiwa. Sentensi imegawanywa sehemu mbili ili isomeke kwa urahisi bila kubadili mfuatano wa matukio.
