base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: sw
  text: Wakawachinja wana wa Sedekia mbele ya macho yake. Kisha akamng’oa Sedekia macho yake[a], akamfunga kwa pingu za shaba, na akampeleka Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akampofusha Sedekia.” Kitenzi cha Kiebrania humaanisha “kufanya kipofu,” lakini katika muktadha huu huenda kinaeleza tendo la kimwili la kumng’oa macho yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: wakawachinja
  rationale: Kitenzi hiki hudokeza kuua kwa ukatili, mara nyingi kama kuchinja; “wakawachinja” kinahifadhi uzito na ukatili wa simulizi kuliko “wakawaua.”
- source_word: לְעֵינָיו
  choice: mbele ya macho yake
  rationale: Hii ni nahau inayoonyesha kwamba Sedekia alilazimika kushuhudia jambo hilo moja kwa moja; tafsiri hii ni ya asili na yenye nguvu katika Kiswahili.
- source_word: עִוֵּר
  choice: akamng’oa Sedekia macho
  rationale: Kitenzi chenyewe humaanisha kufanya kipofu, lakini kutajwa kwa macho katika muktadha huu wa ukatili kunaelekea kueleza tendo la kimwili la kuyatoa. Tanbihi inahifadhi tafsiri pana zaidi ya “akampofusha.”
- source_word: וַיַּאַסְרֵהוּ
  choice: akamfunga
  rationale: Kitenzi kina maana ya kufunga au kuweka kifungoni; kwa kuwa kinachofuata kinataja pingu, “akamfunga” ndilo chaguo la moja kwa moja.
- source_word: בַנְחֻשְׁתַּיִם
  choice: kwa pingu za shaba
  rationale: Neno hili linarejelea vifaa vya chuma vya kumzuia mfungwa. “Pingu za shaba” ni wazi, ya kawaida, na huhifadhi aina ya metali iliyotajwa.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: akampeleka Babeli
  rationale: Katika muktadha huu, kitenzi cha kuleta kinatafsirika kwa kawaida kama kumpeleka mtu mahali palipotajwa.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: wana wa Sedekia
  rationale: Hii ni tafsiri ya kawaida na wazi ya muundo wa umilikaji wa Kiebrania.
