base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: sw
  text: Ndipo mji ukapenyiwa, na wapiganaji wote wakakimbia usiku kwa njia ya lango lililokuwa kati ya zile kuta mbili, karibu na bustani ya mfalme. Wakaldayo[a] walikuwa wameuzunguka mji pande zote; mfalme[b] akaenda kwa njia ya Araba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wababeli.” Kiebrania kinasema kihususa “Wakaldayo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akaenda.” Kiebrania hakitaji kiima wazi; muktadha unaonyesha kwamba ni mfalme.
    reason: lexical_alternative
  - marker: c
    text: Araba ni eneo la bonde la ufa linaloendelea kuelekea kusini kutoka Bonde la Yordani; kwa mapokeo jina hili pia limetafsiriwa “tambarare.”
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: mji ukapenyiwa
  rationale: Kauli ya kutendwa ya בקע katika mazingira ya kuzingirwa inaonyesha kwamba ulinzi wa mji ulivunjwa na nafasi ya kuingia ikapatikana. “Ukapenyiwa” ni Kiswahili cha kawaida cha kijeshi kuliko tafsiri halisi ya “ukapasuliwa.”
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: watu wote wa vita
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha wapiganaji bila kuifanya kuwa istilahi ya kisasa kupita kiasi.
- source_word: הַלַּיְלָה
  choice: usiku
  rationale: Neno limetumiwa kama kielezi cha wakati.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: kupitia lango lililokuwa kati ya kuta mbili
  rationale: “Kupitia” huonyesha njia kwa Kiswahili cha asili, na umbo la uwili la חֹמֹתַיִם limewakilishwa wazi kwa “kuta mbili.”
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: karibu na bustani ya mfalme
  rationale: עַל hapa ina maana ya ukaribu wa mahali, si lazima kuwa juu ya bustani.
- source_word: וְכַשְׂדִּים
  choice: Wakaldayo
  rationale: Hili ndilo jina mahsusi lililo katika Kiebrania; “Wababeli” ni ufafanuzi wa kihistoria unaofaa kutajwa katika tanbihi.
- source_word: עַל הָעִיר סָבִיב
  choice: walikuwa wameuzunguka mji pande zote
  rationale: Hueleza kwa kawaida hali ya mji kuzingirwa kila upande.
- source_word: וַיֵּלֶךְ
  choice: mfalme akaenda
  rationale: Kitenzi cha Kiebrania kina kiima cha nafsi ya tatu umoja ambacho hakikutajwa wazi; muktadha unaonyesha kuwa ni mfalme.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: kuelekea Araba
  rationale: דֶּרֶךְ hapa huonyesha njia au mwelekeo. “Araba” limehifadhiwa kama jina la eneo badala ya kutafsiriwa kwa neno pana “tambarare.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha masimulizi yenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa ili kuepuka mfuatano mzito, huku mpangilio wa matukio na maelezo ya kijiografia yakihifadhiwa. Kitenzi “wakakimbia” kimetolewa kwa mujibu wa maana ya muktadha wa simulizi, ingawa katika maandishi ya Kiebrania yaliyotolewa kishazi hicho ni cha mkato.
