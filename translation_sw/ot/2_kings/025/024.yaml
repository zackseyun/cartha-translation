base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: sw
  text: Gedalia akawaapia wao na watu wao, akawaambia, “Msiwaogope watumishi wa Wakaldayo.[a] Kaeni katika nchi na kumtumikia mfalme wa Babeli, na itakuwa vema kwenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maofisa wa Wababeli.” Kiebrania kinasema “watumishi wa Wakaldayo”; katika muktadha huu huenda ikamaanisha mawakala au wasimamizi wa utawala wa Babeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: akawaapia
  rationale: Kitenzi cha Kiebrania katika Nifali humaanisha kuapa. ‘Akawaapia’ kinaonyesha kwamba Gedalia alitoa kiapo cha kuwahakikishia, si kwamba aliwalazimisha wao waape.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: wao na watu wao
  rationale: Neno אַנְשֵׁי kihalisi ni ‘watu/wanaume wa’. Katika muktadha huu linawahusu watu walio chini ya viongozi hao, huenda askari au wafuasi wao; ‘watu wao’ halibani maana kwa kundi moja tu.
- source_word: אַל תִּירְאוּ
  choice: Msiwaogope
  rationale: Hii ni amri hasi ya wingi. Umbo hili ni la kawaida na la moja kwa moja katika Kiswahili cha sasa.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: watumishi wa Wakaldayo
  rationale: עבדים kihalisi ni ‘watumishi’, ingawa hapa huenda ikamaanisha mawakala au maofisa wa utawala wa Babeli. Tafsiri kuu inadumisha upana huo wa asili.
- source_word: הַכַּשְׂדִּים
  choice: Wakaldayo
  rationale: Hili ndilo jina la kabila lililotumiwa katika Kiebrania, ambalo katika muktadha huu linaweza kutaja Wababeli, yaani mamlaka ya Babeli.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Kaeni katika nchi
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kubaki. ‘Kaeni katika nchi’ ni ya asili na inadumisha uwezekano wa kuishi au kubaki humo.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: na kumtumikia mfalme wa Babeli
  rationale: עבד inapokuwa na mtu kama yambwa humaanisha kumtumikia; hapa ina maana ya huduma na utiifu wa kisiasa bila kuibadili moja kwa moja kuwa ‘jitiisheni’.
- source_word: וְיִטַב לָכֶם
  choice: nanyi mtafanikiwa
  rationale: Nahau hii ina maana kwamba mambo yatakuwa mema kwao. ‘Mtafanikiwa’ ni fupi na ya kawaida, ikieleza matokeo mazuri yaliyoahidiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa heshima na unaoeleweka kwa urahisi. Jina ‘Wakaldayo’ limehifadhiwa katika maandishi, huku maana ya kimuktadha ‘Wababeli’ ikielezwa katika tanbihi.
