translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya heshima lakini inayoeleweka kwa wasomaji wa kawaida. “Taji” limetumiwa kwa sehemu ya juu ya nguzo, na muktadha wa usanifu umewekwa wazi ili lisieleweke kama taji ya kifalme.
