base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: sw
  text: Nguzo moja ilikuwa na urefu wa dhiraa kumi na nane,[a] na juu yake palikuwa na taji ya shaba. Taji hiyo ilikuwa na urefu wa dhiraa tatu, na juu yake kulikuwa na kazi ya wavu na mapambo ya makomamanga kuizunguka pande zote; vyote vilikuwa vya shaba. Nguzo ya pili pia ilikuwa na vitu kama hivyo,[b] pamoja na kazi ya wavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dhiraa moja ilikuwa kipimo cha urefu cha takriban sentimita 45; dhiraa kumi na nane ni karibu mita 8.1.
    reason: measurement_clarification
  - marker: b
    text: Kishazi cha mwisho ni cha mkato katika Kiebrania; kihalisi, “na kama hivi kwa nguzo ya pili juu ya kazi ya wavu.” Maana yake inaonekana kuwa nguzo ya pili ilikuwa na mapambo yanayolingana.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: urefu
  rationale: Katika maelezo haya ya usanifu, neno hili linataja kipimo cha kwenda juu; “urefu” ni la kawaida na wazi katika Kiswahili.
- source_word: עַמּוּד
  choice: nguzo
  rationale: “Nguzo” ni neno la kawaida la Kiswahili kwa sehemu hii ya usanifu wa Hekalu.
- source_word: כֹתֶרֶת
  choice: taji
  rationale: Hapa ni sehemu ya mapambo iliyo juu ya nguzo. “Taji” linaeleweka kwa wasomaji wengi, ingawa si taji ya kifalme.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: “Shaba” ni tafsiri ya kawaida ya Kiswahili kwa metali hii katika vifaa vya Hekalu; neno la Kiebrania linaweza kurejelea shaba au aloi yake.
- source_word: שְׂבָכָה
  choice: kazi ya wavu
  rationale: Neno linaeleza pambo lenye muundo kama wavu; usemi huu ni wa kawaida na unaonyesha kuwa ni kazi ya mapambo.
- source_word: רִמֹּנִים
  choice: mapambo ya makomamanga
  rationale: Katika muktadha huu ni maumbo ya tunda la komamanga yaliyotumiwa kama mapambo, si matunda halisi.
- source_word: סָבִיב
  choice: kuizunguka pande zote
  rationale: Huhifadhi maana ya mapambo yaliyowekwa kuzunguka taji nzima.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: vyote vilikuwa vya shaba
  rationale: Hutoa kwa uwazi muhtasari wa malighafi ya kazi ya wavu na mapambo yaliyotajwa.
- source_word: וְכָאֵלֶּה
  choice: pia ilikuwa na vitu kama hivyo
  rationale: Kiebrania ni kifupi na hurejelea sifa zilizotangulia; tafsiri hii inaifanya maana isomeke bila kuongeza sifa mpya.
- source_word: עַל הַשְּׂבָכָה
  choice: pamoja na kazi ya wavu
  rationale: Kishazi cha mwisho ni cha mkato katika Kiebrania. Chaguo hili huhifadhi rejeo la kazi ya wavu bila kudai kwa uhakika zaidi uhusiano wake wa kisintaksia.
