source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: sw
  text: 'Makamanda wote wa vikosi, wao na watu wao, waliposikia kwamba mfalme wa Babeli alikuwa amemteua Gedalia[a], walikuja kwa Gedalia huko Mispa: Ishmaeli mwana wa Nethania, Yohanani mwana wa Karea, Seraya Mnetofathi, mwana wa Tanhumethi, na Yaazania mwana wa Mmaakathi—wao na watu wao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amemweka Gedalia asimamie.”
    reason: Kitenzi cha Kiebrania kinaweza kumaanisha kumteua mtu au kumweka asimamie jambo.
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: makamanda wa vikosi
  rationale: שָׂרִים ni viongozi au maafisa wenye mamlaka, na חַיִל hapa ina maana ya vikosi vya kijeshi. Usemi huu ni wa sasa na haubainishi cheo mahususi kisichotajwa katika Kiebrania.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: wao na watu wao
  rationale: Muundo huu unawasisitiza makamanda na kuwatofautisha na watu walioandamana nao. Neno 'watu' linahifadhi upana wa אֲנָשִׁים bila kulazimisha tafsiri ya 'askari'.
- source_word: הִפְקִיד
  choice: alikuwa amemteua
  rationale: Kitenzi hiki kinaweza kumaanisha kumteua, kumpa jukumu, au kumweka katika usimamizi. 'Kumteua' ni pana na sahihi bila kuongeza cheo cha 'gavana' ambacho hakitajwi wazi hapa.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: kwa Gedalia huko Mispa
  rationale: Jina la mahali linaonyesha mahali Gedalia alipokuwa. 'Kwa Gedalia huko Mispa' ni Kiswahili cha kawaida na huonyesha kwa uwazi mtu na mahali.
- source_word: הַנְּטֹפָתִי
  choice: Mnetofathi
  rationale: Jina la kiukoo au kijiografia limehifadhiwa kwa unukuzi badala ya kufafanuliwa kama 'mtu wa Netofa'.
- source_word: הַמַּעֲכָתִי
  choice: Mmaakathi
  rationale: Jina la kiukoo au kijiografia limehifadhiwa kwa unukuzi, sambamba na הַנְּטֹפָתִי.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן
  choice: 'walikuja ...: Ishmaeli ... Yohanani ... Seraya ... na Yaazania'
  rationale: Majina ni ufafanuzi wa makamanda waliokuja. Nukta mbili huwasilisha orodha hiyo kwa uwazi huku ikihifadhi mpangilio wa sentensi ya Kiebrania.
- source_word: וְאַנְשֵׁיהֶם
  choice: wao na watu wao
  rationale: Kirai cha mwisho kinahitimisha orodha kwa kuonyesha kwamba makamanda waliotajwa walikuja pamoja na watu wao; kinarudia kwa makusudi wazo la mwanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaoeleweka. Majina ya watu na mahali yameandikwa kwa maumbo yanayofaa Kiswahili. Alama ya tanbihi imewekwa baada ya neno linalohusika, yaani 'amemteua Gedalia'.
