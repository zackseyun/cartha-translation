  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֞א נְבוּזַרְאֲדָ֧ן רַב טַבָּחִ֛ים עֶ֥בֶד מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: sw
  text: Katika mwezi wa tano, siku ya saba ya mwezi huo—huo ulikuwa mwaka wa kumi na tisa wa utawala wa Mfalme Nebukadneza, mfalme wa Babeli—Nebuzaradani, mkuu wa walinzi[a], mtumishi wa mfalme wa Babeli, akaja Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kiebrania kinasema “mkuu wa wachinjaji”; yaelekea cheo hiki kilimaanisha mkuu wa walinzi wa kifalme au wa watekelezaji wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: Katika mwezi wa tano
  rationale: Muundo huu unaendeleza simulizi na kutaja mwezi kwa nambari yake. Kiswahili hakihitaji kuanza kwa “Na” ili mwendelezo huo uwe wazi.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: siku ya saba ya mwezi huo
  rationale: Neno “siku” linawekwa wazi kwa mujibu wa matumizi ya kawaida ya tarehe katika Kiswahili, bila kubadili maana ya Kiebrania.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: huo ulikuwa mwaka wa kumi na tisa wa utawala wa Mfalme Nebukadneza
  rationale: “Huo” hurejelea wakati uliotajwa, na “wa utawala” huonyesha kwa kawaida kwamba mwaka unahesabiwa tangu mwanzo wa utawala wa mfalme.
- source_word: בָּא
  choice: akaja
  rationale: Kitenzi hiki cha kawaida cha simulizi kinahifadhi maana ya moja kwa moja ya kuja na kuendeleza mfululizo wa matukio.
- source_word: רַב טַבָּחִים
  choice: mkuu wa walinzi
  rationale: Ingawa maana ya msingi inahusiana na wachinjaji au watekelezaji wa hukumu, katika mazingira ya kifalme ni cheo cha mkuu wa walinzi; tanbihi huhifadhi maana halisi inayowezekana.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: mtumishi wa mfalme wa Babeli
  rationale: “Mtumishi” huhifadhi upana wa עֶבֶד, ambalo hapa linaweza kumaanisha mhudumu au afisa aliye chini ya mamlaka ya mfalme, bila kulazimisha maana ya mtumwa.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
