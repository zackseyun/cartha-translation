revisions:
- from: Nao Wakaldayo wakazivunja vipande nguzo za shaba zilizokuwa katika nyumba ya Yahweh, pamoja na vikalio[a] na Bahari ya shaba iliyokuwa katika nyumba ya Yahweh; kisha wakaichukua shaba yake kwenda Babeli.[b]
  to: Nao Wakaldayo wakazivunja-vunja nguzo za shaba zilizokuwa katika nyumba ya Yahweh, na vibebeo[a], na Bahari ya shaba iliyokuwa katika nyumba ya Yahweh; kisha wakachukua shaba yao kwenda Babeli.[b]
  rationale: The revision corrects the verb phrase, replaces a potentially misleading term for the stands with a natural functional equivalent, and makes the collective referent of the final possessive explicit. It otherwise preserves the Hebrew sequence, the repeated location in Yahweh’s house, the proper designation “Bahari,” and the source’s use of “Wakaldayo.”
