  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: sw
  text: Nao Wakaldayo wakazivunja-vunja nguzo za shaba zilizokuwa katika nyumba ya Yahweh, na vibebeo[a], na Bahari ya shaba iliyokuwa katika nyumba ya Yahweh; kisha wakachukua shaba yao kwenda Babeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “misingi”; yaani, miundo iliyoyashikilia mabeseni ya hekalu.
    reason: lexical_alternative
  - marker: b
    text: “Wakaldayo” hapa ni majeshi ya Babeli.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: nguzo za shaba
  rationale: עַמּוּדִים ni nguzo, na נְחֹשֶׁת katika vyombo vya hekalu hurejelea shaba ya bronzi; katika Kiswahili cha kawaida, ‘shaba’ ni neno linaloeleweka zaidi.
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: zilizokuwa katika nyumba ya Yahweh
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa; muktadha unaonyesha mahali vilipokuwa, hivyo ‘zilizokuwa katika’ huweka wazi maana iliyodokezwa.
- source_word: הַמְּכֹנוֹת
  choice: vikalio
  rationale: מְכֹנוֹת ni miundo ya kushikilia mabeseni ya hekalu. ‘Vikalio’ kinaeleza kazi yake bila kuongeza wazo la kuhamishika lisilotajwa hapa.
- source_word: יָם הַנְּחֹשֶׁת
  choice: Bahari ya shaba
  rationale: ‘Bahari’ huhifadhi taswira halisi ya יָם na jina maalumu la birika kubwa la hekalu, badala ya kulifafanua tu kuwa beseni.
- source_word: שִׁבְּרוּ
  choice: wakazivunja vipande
  rationale: Kitenzi kinaonyesha kuvunjwa kwa vitu vikubwa vya shaba ili chuma chake kibebwe; ‘kuvunja vipande’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: כַשְׂדִּים
  choice: Wakaldayo
  rationale: Hili ni tafsiri ya moja kwa moja ya jina כַשְׂדִּים; tanbihi inaeleza kuwa katika muktadha huu ni majeshi ya Babeli.
- source_word: וַיִּשְׂאוּ
  choice: wakaichukua
  rationale: נשא hapa ni kuchukua na kubeba nyara kuelekea mahali palipotajwa. ‘Wakaichukua’ ni ya kawaida katika Kiswahili na lengo la safari linafuata.
- source_word: נְחֻשְׁתָּם
  choice: shaba yake
  rationale: Kiambishi cha wingi wa Kiebrania kinarejelea vitu vilivyotajwa kwa pamoja; Kiswahili hutumia umoja wa kitu ‘shaba’, hivyo ‘yake’ ni upatanisho wa asili.
- source_word: בָּבֶלָה
  choice: kwenda Babeli
  rationale: Kiishio elekezi cha Kiebrania kinaonyesha mwendo kuelekea Babeli; ‘kwenda Babeli’ ni usemi wa asili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limehifadhiwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia Tetragramatoni yenyewe; ‘Yahweh’ huhifadhi jina binafsi bila kulibadilisha kuwa cheo.
- issue: Utambulisho wa כַשְׂדִּים
  choice: Wakaldayo katika maandishi, na ufafanuzi wa majeshi ya Babeli katika tanbihi
  alternative: Wababeli moja kwa moja
  rationale: ‘Wakaldayo’ huhifadhi jina mahsusi la chanzo, huku tanbihi ikimsaidia msomaji kuelewa matumizi yake ya kihistoria hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sentensi umewekwa wa asili katika Kiswahili, huku majina ya vyombo vya hekalu na jina Yahweh yakihifadhiwa.
