  source_fidelity: 'Tafsiri inafuata kwa uaminifu mtiririko na maana ya Kiebrania: mfalme alikamatwa, akapelekwa/pandishwa kwa mfalme wa Babeli huko Ribla, kisha hukumu ya kimahakama ikatolewa juu yake. “Wakampandisha” huhifadhi kwa kutosha wazo la עלה, na “wakatoa hukumu juu yake” huwasilisha idiomu דבר ... משפט kwa maana yake ya kisheria.'
