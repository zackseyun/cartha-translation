  text: וַֽ/יִּתְפְּשׂוּ֙ אֶת הַ/מֶּ֔לֶךְ וַ/יַּעֲל֥וּ אֹת֛/וֹ אֶל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָ֑תָ/ה וַ/יְדַבְּר֥וּ אִתּ֖/וֹ מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: sw
  text: Ndipo wakamkamata mfalme, wakampandisha kwa mfalme wa Babeli huko Ribla, nao wakatoa hukumu juu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “wakasema naye hukumu”; huu ni usemi unaomaanisha kwamba walitoa hukumu ya kimahakama juu yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: wakamkamata
  rationale: Kitenzi תפשׂ hapa kinaeleza kukamatwa kwa mfalme aliyekuwa akikimbia; “wakamkamata” ni Kiswahili cha kawaida na sahihi.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho inamrejelea mfalme aliyetajwa tayari, yaani Sedekia; hakuna haja ya kuongeza jina lake ambalo halipo katika mstari huu.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: wakampandisha
  rationale: Huhifadhi maana ya mwelekeo ya עלה, ‘kupandisha/kuleta juu,’ kwa namna inayokubalika katika Kiswahili.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: kwa mfalme wa Babeli
  rationale: אֶל kimsingi huonyesha kuelekea kwa mtu au mahali; “kwa” ni ya asili katika Kiswahili na haiongezi wazo la ‘mbele ya’ lisilotajwa wazi.
- source_word: רִבְלָתָה
  choice: huko Ribla
  rationale: He ya mwelekeo katika jina la mahali inaendana na safari kuelekea Ribla, huku “huko” pia ikitaja mahali ambapo mfalme wa Babeli alikuwapo.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: wakatoa hukumu juu yake
  rationale: Usemi huu wa Kiebrania una maana ya kutamka uamuzi wa kimahakama, si mazungumzo ya kawaida. Tafsiri hii ni wazi, ya asili, na inadumisha wazo la hukumu.
