  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kiunganishi “ndipo” kinaendeleza simulizi, na “nao” kinaweka wazi mfuatano wa tendo bila kutaja wahusika ambao hawajatajwa kwa majina katika mstari.
