  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: sw
  text: Lakini mkuu wa walinzi[b] aliwaacha baadhi ya watu maskini zaidi wa nchi wawe wafanyakazi wa mashamba ya mizabibu na wafanyakazi wa mashambani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakulima” au “walimaji.” Neno la Kiebrania huenda linamaanisha kwa upana wafanyakazi waliolima ardhi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mkuu wa wachinjaji” au “mkuu wa watekelezaji wa hukumu.” Katika muktadha huu, cheo hicho kinamaanisha mkuu wa walinzi wa Babeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/דַּלַּת הָ/אָרֶץ
  choice: baadhi ya watu maskini zaidi wa nchi
  rationale: 'Muundo wenye מִן una maana ya kuchagua sehemu ya kundi: baadhi ya watu wa tabaka maskini zaidi. ‘Nchi’ hapa ni nchi ya Yuda, si dunia kwa ujumla.'
- source_word: הִשְׁאִיר
  choice: aliwaacha
  rationale: Hifili ya שׁאר ina maana ya kuwaacha watu wabaki; ‘aliwaacha’ ni fupi na ya kawaida katika simulizi hili.
- source_word: רַב טַבָּחִים
  choice: mkuu wa walinzi
  rationale: Ingawa kihalisi cheo hiki kinahusiana na mkuu wa wachinjaji au watekelezaji wa hukumu, katika mazingira ya kifalme na kijeshi kinamtaja kamanda wa walinzi wa Babeli.
- source_word: לְכֹרְמִים
  choice: wawe watunzaji wa mashamba ya mizabibu
  rationale: Neno linawataja wafanyakazi wanaotunza mizabibu; usemi huu ni wazi na wa kawaida kwa msomaji wa Kiswahili.
- source_word: וּ/לְ/יֹגְבִים
  choice: na wafanyakazi wa mashambani
  rationale: Neno hili adimu linaelekea kutaja watu wanaofanya kazi ya udongo au kilimo. Tafsiri pana inahifadhi kutokuwa na uhakika kuhusu kazi yao mahususi.
