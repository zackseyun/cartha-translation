  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: sw
  text: Nebuzaradani, mkuu wa walinzi,[a] akawachukua na kuwapeleka kwa mfalme wa Babeli huko Ribla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “mkuu wa wachinjaji”; huenda hiki kilikuwa cheo cha kifalme cha kijeshi au usalama.
    reason: cultural_note
  - marker: b
    text: Au “na kuwapeleka mbele ya mfalme wa Babeli huko Ribla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: Kitenzi לקח hapa kina maana ya kawaida ya ‘kuwachukua’; ‘kuwakamata’ kingeongeza wazo la kukamatwa kwa nguvu ambalo halijasemwa wazi.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: רַב טַבָּחִים
  choice: mkuu wa walinzi
  rationale: Ingawa kwa neno kwa neno cheo hiki ni ‘mkuu wa wachinjaji,’ katika mazingira ya kifalme ya Babeli kinaashiria cheo cha juu cha kijeshi au usalama; ‘mkuu wa walinzi’ ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha kazi hiyo.
- source_word: וַיֹּלֶךְ
  choice: kuwapeleka
  rationale: Hili ni umbo la kusababisha la הלך; likiwa na watu kama yambwa na mahali wanakoelekezwa, maana yake ya kawaida hapa ni ‘kuwapeleka.’
- source_word: עַל
  choice: kwa
  rationale: Baada ya kitenzi cha mwendo, עַל hapa humaanisha kwenda kwa mtu au kuingia mbele yake. ‘Kwa’ ni ya asili katika Kiswahili, huku maana iliyo wazi zaidi ya ‘mbele ya’ ikihifadhiwa katika tanbihi.
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Huu ni muundo wa kawaida wa umilikaji unaotafsiriwa moja kwa moja.
- source_word: רִבְלָתָה
  choice: huko Ribla
  rationale: Kiambishi cha Kiebrania kinaonyesha mwelekeo au mahali. Katika sentensi hii, ‘huko Ribla’ huonyesha kwa kawaida mahali alipokuwa mfalme walipopelekwa kwake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo ‘akawachukua na kuwapeleka’ umehifadhi mwendo wa simulizi la Kiebrania.
