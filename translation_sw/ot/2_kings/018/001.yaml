base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: sw
  text: Katika mwaka wa tatu wa Hoshea mwana wa Ela, mfalme wa Israeli, Hezekia mwana wa Ahazi akawa mfalme[a] wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alianza kutawala.” Kitenzi cha Kiebrania katika mtindo huu wa taarifa za kifalme kinaonyesha Hezekia kuingia madarakani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Katika
  rationale: Kiunganishi hiki kinaanzisha taarifa mpya ya kihistoria. Kiswahili cha sasa hakihitaji kuongeza neno kama “basi”; mtiririko wa simulizi unadumishwa kwa kuanza moja kwa moja na tarehe.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: katika mwaka wa tatu
  rationale: Hii ndiyo namna ya kawaida na ya wazi ya kutaja mwaka wa utawala unaotumiwa kuweka tarehe ya tukio.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: wa Hoshea mwana wa Ela
  rationale: Kihusishi ל kinaonyesha kwamba mwaka unahesabiwa kwa kurejelea utawala wa Hoshea. Majina yametoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Tafsiri ya moja kwa moja ya cheo na eneo la utawala wa Hoshea.
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika taarifa za kifalme, kitenzi hiki hapa kinaonyesha kuingia madarakani, si muda wote wa kutawala. “Akawa mfalme” ni Kiswahili cha kawaida kinachoeleza kuanza kwa ufalme.
- source_word: חִזְקִיָּה
  choice: Hezekia
  rationale: Umbo la jina linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בֶן אָחָז
  choice: mwana wa Ahazi
  rationale: Tafsiri ya kawaida ya utambulisho wa kifamilia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Kirai hiki kinaeleza cheo na eneo la utawala; kimeunganishwa na kitenzi ili kutoa Kiswahili cha asili bila kurudia cheo kisivyo lazima.
