base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: sw
  text: Mfalme wa Ashuru aliipeleka Israeli[a] uhamishoni Ashuru, akawakalisha huko Hala, kwenye Habori, mto wa Gozani[b], na katika miji ya Wamedi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “Israeli” inamaanisha ufalme wa kaskazini na watu wake waliopelekwa uhamishoni.
    reason: cultural_note
  - marker: b
    text: Kirai hiki kinaweza pia kutafsiriwa “Habori, mto wa Gozani” au “mto Habori wa Gozani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: akaihamisha ... kwenda
  rationale: Hiphili ya גלה inaonyesha kuondolewa kwa nguvu na kupelekwa uhamishoni. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha wazi tendo la mfalme dhidi ya Israeli.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: Mfalme wa Ashuru
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Neno hilo linaitaja kwa ujumla falme ya kaskazini pamoja na watu wake, bila kulibadili kuwa tu ‘Waisraeli.’
- source_word: אַשּׁוּרָה
  choice: kwenda Ashuru
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha mwendo kuelekea Ashuru.
- source_word: וַיַּנְחֵם
  choice: akawakalisha
  rationale: Katika muktadha wa uhamisho, kausativi hii ina maana ya kuwafanya watu wakae katika maeneo waliyopangiwa. Kiwakilishi cha wingi kinaelekezwa kwa watu wa Israeli.
- source_word: בַּחְלַח
  choice: huko Hala
  rationale: Hala ni jina la mahali; ‘huko’ linafanya orodha ya maeneo isomeke kwa kawaida katika Kiswahili.
- source_word: וּבְחָבוֹר
  choice: kando ya Habori
  rationale: Kwa kuwa kirai kinachofuata kinaitambulisha Habori kuwa mto, ‘kando ya’ linafaa kwa makazi yaliyo karibu na mto.
- source_word: נְהַר גּוֹזָן
  choice: mto wa Gozani
  rationale: Inahifadhi muundo wa Kiebrania unaouhusianisha mto Habori na Gozani bila kuamua kwa uhakika aina kamili ya uhusiano huo wa kijiografia.
- source_word: וְעָרֵי מָדָי
  choice: na katika miji ya Wamedi
  rationale: מָדָי hapa huonyesha Wamedi au nchi yao; ‘miji ya Wamedi’ ni tafsiri ya karibu ya kirai cha Kiebrania.
theological_decisions:
- issue: Maana ya ‘Israeli’ katika muktadha huu
  choice: Jina ‘Israeli’ limehifadhiwa kama jina la pamoja la kisiasa na kitaifa.
  alternative: Waisraeli
  rationale: Kiebrania kinatumia jina la pamoja ‘Israeli.’ Tanbihi inafafanua kuwa hapa linamaanisha ufalme wa kaskazini na watu wake bila kuondoa maana yake ya kitaifa.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Majina ya kale yametoholewa kwa maumbo yanayotamkika kwa urahisi: Ashuru, Hala, Habori, Gozani, na Wamedi. Mabadiliko kutoka umoja wa pamoja ‘Israeli’ kwenda wingi ‘akawakalisha’ ni ya kawaida na yanaonyesha kwamba watu wa taifa hilo ndio waliokalishwa katika maeneo hayo.'
