base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: sw
  text: Lakini mkiniambia, ‘Tunamtumaini BWANA Mungu wetu,’ je, si yeye ambaye Hezekia aliondoa mahali pake pa juu na madhabahu zake, akawaambia Yuda na Yerusalemu, ‘Mtaabudu mbele ya madhabahu hii huko Yerusalemu’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטָחְנוּ
  choice: Tunamtumaini
  rationale: Kitenzi hiki kinaeleza kumtegemea mtu kwa imani; kiambishi cha yambwa ‘-m-’ kinaweka wazi kwamba BWANA ndiye anayetumainiwa.
- source_word: בָּמוֹתָיו
  choice: mahali pake pa juu
  rationale: ‘Mahali pa juu’ ni istilahi inayotambulika kwa maeneo ya ibada yaliyoinuliwa; umilikishi umehifadhi hoja ya msemaji kwamba yalikuwa ya BWANA.
- source_word: מִזְבְּחֹתָיו
  choice: madhabahu zake
  rationale: Huhifadhi wingi na kiambishi cha umilikishi cha Kiebrania.
- source_word: תִּשְׁתַּחֲווּ
  choice: Mnapaswa kuabudu
  rationale: Katika muktadha huu kujisujudu mbele ya madhabahu ni tendo la ibada; muundo huu unaonyesha agizo bila kutumia Kiswahili kisicho cha kawaida.
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: mbele ya madhabahu hii
  rationale: Tafsiri ya moja kwa moja na ya asili ya mahali pa ibada palipotajwa.
theological_decisions:
- issue: Madai ya Rabsheka kwamba mahali pa juu na madhabahu zilikuwa za BWANA
  choice: 'Umilikishi umehifadhiwa: ‘mahali pake pa juu na madhabahu zake.’'
  alternative: Kufafanua kwamba maeneo hayo yalikuwa haramu au kwamba Rabsheka alikosea
  rationale: Aya inawasilisha kejeli na mtazamo wa Rabsheka; tafsiri haipaswi kusahihisha dai lake ndani ya matini.
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwakilishi wa kawaida na wenye heshima katika Biblia za Kiswahili kwa Tetragramatoni, huku herufi kubwa zikiitofautisha kama jina la agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nukuu zilizopachikwa zimehifadhiwa, na usemi umefanywa wa kawaida bila kuondoa kejeli ya msemaji.
