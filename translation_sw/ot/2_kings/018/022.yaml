  source_fidelity: 'Msingi wa tafsiri umehifadhiwa: sharti la msemaji, tumaini kwa BWANA, na madai ya Rabsheka kuhusu mahali pa juu na madhabahu vimebaki bila kusahihishwa kiteolojia. Hata hivyo, “Mnapaswa kuabudu” hudhoofisha agizo la pili wingi la Kiebrania (תשתחוו) kwa kulifanya kauli ya wajibu badala ya amri/kauli yenye nguvu ya “mtamwabudu.” Pia, ויאמר ni tendo linalofuata la simulizi, hivyo “akawaambia” ni sahihi zaidi kuliko “akiwaambia.”'
