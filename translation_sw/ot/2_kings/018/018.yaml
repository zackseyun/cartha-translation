translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi inadumisha mfuatano wa simulizi ya Kiebrania huku vyeo vya maafisa vikielezwa kwa istilahi za kisasa. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
