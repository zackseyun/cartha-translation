base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: sw
  text: Nao wakamwita mfalme, naye Eliakimu mwana wa Hilkia, msimamizi wa jumba la kifalme,[a] akatoka kwenda kwao pamoja na Shebna mwandishi[b] na Yoa mwana wa Asafu, mtunza kumbukumbu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “aliyekuwa juu ya nyumba”; hiki kilikuwa cheo cha kiutawala cha msimamizi wa nyumba au ikulu ya mfalme.
    reason: cultural_note
  - marker: b
    text: Au “katibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: wakamwita mfalme
  rationale: Kitenzi קרא pamoja na אֶל hapa kinaweza kumaanisha kumwita mtu au kumtaka aje. Katika muktadha huu wa ujumbe wa kidiplomasia, “wakamwita mfalme” ni Kiswahili cha kawaida na hakiongezi wazo la amri rasmi.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: akawatokea
  rationale: יצא ina maana ya kutoka na kuelekea kwa watu waliopo nje. “Akawatokea” kwa ufupi huonyesha kuwa Eliakimu alitoka kwenda kukutana nao, bila kulazimisha mtazamo wa “alikuja” au “alienda.”
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Eliakimu mwana wa Hilkia
  rationale: Majina yameandikwa kwa umbo lililozoeleka katika Kiswahili, na muundo wa ukoo wa Kiebrania umehifadhiwa kwa “mwana wa.”
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: msimamizi wa jumba la kifalme
  rationale: Hiki ni cheo cha kiutawala cha afisa aliyesimamia nyumba au ikulu ya mfalme. “Msimamizi wa jumba la kifalme” huwasilisha kazi hiyo kwa Kiswahili cha sasa; tanbihi huhifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo wa Kiebrania.
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: סֹפֵר hapa ni cheo cha afisa wa serikali, yaani mwandishi au katibu. “Mwandishi” ni tafsiri ya moja kwa moja, huku “katibu” ikitajwa kama uwezekano katika tanbihi.
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: na Yoa mwana wa Asafu
  rationale: Majina yametoholewa kwa Kiswahili, na patronimu imehifadhiwa kwa “mwana wa.”
- source_word: הַמַּזְכִּיר
  choice: mtunza kumbukumbu
  rationale: Neno hili humtaja afisa wa kifalme aliyehusika na kumbukumbu au taarifa rasmi. “Mtunza kumbukumbu” linaeleweka kwa wasomaji wa sasa bila kutumia istilahi ya kale.
