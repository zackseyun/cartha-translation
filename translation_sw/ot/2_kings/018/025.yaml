  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: sw
  text: Sasa, je, nimekuja kushambulia mahali hapa na kupaharibu bila Yahwe?[a] Yahwe aliniambia, ‘Nenda ukashambulie nchi hii na kuiharibu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pasipo Yahwe?” au “kwa kujitegemea pasipo Yahwe?”
    reason: 'Huhifadhi maana ya מִבַּלְעֲדֵי: kutenda bila Yahwe au bila kutegemea mamlaka/ushiriki wake, bila kuifanya kwa lazima kuwa dai mahsusi la kutumwa.'
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: je ... bila
  rationale: Kiulizi הֲ pamoja na מִבַּלְעֲדֵי huunda swali la balagha. ‘Bila Yahwe’ ni Kiswahili cha kawaida kinachohifadhi dai kwamba msemaji hakutenda pasipo idhini au ushiriki wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kwa namna ya kawaida ya Kiswahili kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: עָלִיתִי עַל
  choice: nimekuja kushambulia
  rationale: Katika muktadha huu wa kijeshi, עלה על inaonyesha kusonga dhidi ya mahali fulani. ‘Nimekuja kushambulia’ ni ya asili kwa Kiswahili na haitaji maelezo ya kijiografia yasiyo wazi kwa msomaji.
- source_word: הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Huhifadhi nomino pana מָקוֹם bila kuibadili kimafasiri kuwa Yerusalemu au mji huu.
- source_word: לְהַשְׁחִיתוֹ
  choice: kupaharibu
  rationale: Hifili ya שׁחת ina maana ya kusababisha uharibifu. Kiambishi -pa kinaelekeza kwa usahihi kwenye ‘mahali hapa.’
- source_word: אָמַר אֵלַי
  choice: ndiye aliyeniambia
  rationale: Huwasilisha dai la msemaji la agizo la moja kwa moja kutoka kwa Yahwe; ‘ndiye’ hukazia kiima kilichotajwa wazi katika Kiebrania bila kuongeza fundisho.
- source_word: עֲלֵה עַל
  choice: Nenda ukashambulie
  rationale: Amri ya עלה pamoja na עַל ina nguvu ya kusonga dhidi ya nchi katika uvamizi. Muundo ‘nenda uka-’ ni wa asili kwa agizo la Kiswahili.
- source_word: הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: אֶרֶץ katika muktadha wa uvamizi ni ‘nchi’; uteuzi huu huhifadhi tofauti na ‘mahali hapa’ katika sehemu ya kwanza.
- source_word: וְהַשְׁחִיתָהּ
  choice: na kuiharibu
  rationale: Huhifadhi kurudiwa kwa mzizi שׁחת na kuelekeza kiambishi kwa ‘nchi hii.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni yenyewe. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Iwapo madai ya msemaji kwamba ametumwa na Yahwe yathibitishwe kuwa ya kweli
  choice: Yameachwa kama dai la msemaji katika usemi wa moja kwa moja
  alternative: Kuongeza maneno yanayoonyesha wazi kuwa dai hilo ni la kweli au la uongo
  rationale: Aya inanukuu dai la afisa wa Ashuru lakini hapa haitoi hukumu ya wazi juu ya ukweli wake. Tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
- issue: Utambulisho wa ‘mahali hapa’ na ‘nchi hii’
  choice: Mahali hapa; nchi hii
  alternative: Yerusalemu; Yuda
  rationale: Kiebrania kinatumia מָקוֹם na אֶרֶץ, maneno mawili tofauti. Kuyahifadhi huepuka kubana marejeo kwa ufafanuzi usiotamkwa katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa swali la balagha umehifadhiwa; ‘mahali hapa’ na ‘nchi hii’ zinabaki tofauti kama katika Kiebrania. Vitenzi vya kijeshi vimetolewa kwa lugha ya kawaida inayoeleweka, huku kurudiwa kwa wazo la kuharibu kukihifadhiwa.
