  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: sw
  text: Akafanya yaliyo sawa machoni pa Yahwe, kama yote aliyofanya Daudi baba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “baba” hapa linaweza kumaanisha babu au mtangulizi wa nasaba ya Daudi, wala si mzazi wake wa moja kwa moja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatenda
  rationale: Kitenzi cha Kiebrania kinaendeleza simulizi na kueleza tendo la mfalme; “akatenda” ni Kiswahili cha kawaida na chenye hadhi katika simulizi.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Kivumishi chenye kiambishi cha uainishaji kimetumika kama nomino, kikimaanisha jambo lililo sawa au la haki. “Yaliyo sawa” linaeleza tathmini ya kimaadili kwa lugha ya asili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha tathmini kwa mtazamo wa Yahwe, huku ikibaki wazi na ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: כְּכֹל אֲשֶׁר
  choice: sawasawa na yote
  rationale: Kifungu hiki kinaonyesha ulinganifu kamili na kielelezo; “sawasawa na yote” huhifadhi nguvu ya כְּכֹל kwa Kiswahili kinachoeleweka.
- source_word: עָשָׂה
  choice: aliyofanya
  rationale: Kitendo cha Daudi kilitangulia na kinatumika kama kielelezo. Muundo wa Kiswahili unaonyesha uhusiano huo bila kulazimisha wakati maalumu usio wa kawaida.
- source_word: דָּוִד אָבִיו
  choice: Daudi baba yake
  rationale: Huhifadhi tamko la kifalme linalomunganisha Hezekia na ukoo na kielelezo cha Daudi. Maana pana ya “baba” kama babu wa ukoo imefafanuliwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya “baba” katika uhusiano wa Daudi na Hezekia
  choice: Kudumisha “Daudi baba yake” katika matini kuu
  alternative: Daudi babu yake wa ukoo
  rationale: Tamko la Kiebrania lina uzito wa kifalme na wa nasaba. Neno “baba” limehifadhiwa, lakini tanbihi inaondoa uwezekano wa kulielewa kuwa mzazi wa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Nahau “machoni pa” imehifadhiwa kwa sababu inaeleweka na inaakisi kwa karibu tathmini iliyo katika matini ya Kiebrania.
