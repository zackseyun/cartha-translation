    issue: Muundo wa “akawatuma ... wakiwa na jeshi kubwa, waende Yerusalemu”
    rationale: Muundo huu unasikika kama kuwaagiza waende badala ya simulizi la kuwatuma pamoja na nguvu ya kijeshi. Pia haufungamanishi kwa ulaini “kutoka Lakishi” na “kwa Mfalme Hezekia huko Yerusalemu.”
  - severity: low
    issue: Alama ya tanbihi ya vyeo imewekwa baada ya Rab-shake pekee
    rationale: Tanbihi yenyewe inahusu vyeo vyote vitatu; alama iwekwe baada ya orodha nzima ili rejeo lake liwe wazi.
  - severity: low
    issue: Tanbihi b hutumia “Mfulishaji” na maelezo mapana
    rationale: “Mfulishaji” si mbadala wa kawaida ulio wazi hapa, na maelezo ya kutayarisha vitambaa huzidi kile kinachohitajika kwa mbadala wa kileksia. Tanbihi fupi ya mapokeo ni sahihi zaidi.
