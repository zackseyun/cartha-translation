translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Vyeo vya Ashuru vimenukuliwa na kuelezwa katika tanbihi; marudio ya Kiebrania yamehifadhiwa kwa makusudi.
