  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: sw
  text: Kisha mfalme wa Ashuru akawatuma Tartani, Rab-sarisi, na Rab-shake[a] pamoja na jeshi kubwa, kutoka Lakishi kwenda kwa Mfalme Hezekia huko Yerusalemu. Wakapanda na kufika Yerusalemu; wakapanda, wakafika, wakasimama karibu na mfereji wa bwawa la juu, lililo kando ya barabara ya Shamba la Mfuaji.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tartani, Rab-sarisi, na Rab-shake yaelekea kuwa vyeo vya maafisa wa Ashuru, wala si majina ya watu. Huenda vilimaanisha mkuu wa jeshi, afisa mkuu wa ikulu au towashi mkuu, na mnyweshaji mkuu au afisa mwingine wa cheo cha juu.
    reason: cultural_note
  - marker: b
    text: Kwa mapokeo, “Shamba la Mfuliaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן
  choice: Tartani
  rationale: Ni cheo cha afisa wa Ashuru, si lazima jina la mtu; umbo la kunukuu limetumiwa kwa sababu kazi yake kamili haina uhakika.
- source_word: רַב סָרִיס
  choice: Rab-sarisi
  rationale: Cheo cha ikulu ya Ashuru kimenukuliwa ili kutoamua kim kimakosa kati ya ‘towashi mkuu’ na ‘afisa mkuu.’
- source_word: רַב שָׁקֵה
  choice: Rab-shake
  rationale: Cheo hiki cha Ashuru kina tafsiri kadhaa zinazowezekana; kunukuu kunahifadhi kutokuwa na uhakika kuhusu wadhifa halisi.
- source_word: בְּחֵיל כָּבֵד
  choice: wakiwa na jeshi kubwa
  rationale: חַיִל katika muktadha huu ni jeshi au nguvu ya kijeshi, na כָּבֵד inaonyesha ukubwa; Kiswahili hiki ni cha kawaida na sahihi.
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ
  choice: Wakapanda na kufika
  rationale: ‘Kupanda’ huhifadhi usemi wa Kiebrania kuhusu kwenda Yerusalemu, huku ‘kufika’ ikiwa ya kawaida katika simulizi la Kiswahili.
- source_word: וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: wakapanda, wakafika, wakasimama
  rationale: Marudio na mfuatano wa vitenzi vya Kiebrania umehifadhiwa badala ya kufupishwa.
- source_word: תְעָלַת
  choice: mfereji
  rationale: Neno linaonyesha njia ya kupitishia maji inayohusiana na bwawa; ‘mfereji’ ni neno la kawaida na linaloeleweka.
- source_word: הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: bwawa la juu
  rationale: בְּרֵכָה ni bwawa au hifadhi ya maji; ‘bwawa’ linafaa kwa rejeo hili la mahali.
- source_word: מְסִלַּת
  choice: barabara
  rationale: Neno linaweza kumaanisha njia iliyojengwa au barabara; ‘barabara’ ni Kiswahili cha sasa na cha kawaida.
- source_word: שְׂדֵה כוֹבֵס
  choice: Shamba la Mfuaji
  rationale: כּוֹבֵס ni mtu anayefua au kusafisha nguo; ‘mfuaji’ linaeleweka kwa wasomaji wa sasa na jina la mahali limeandikwa kwa herufi kubwa.
