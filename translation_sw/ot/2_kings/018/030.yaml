base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: sw
  text: Wala msikubali Hezekia awafanye mmtumaini Yahwe, akisema, “Yahwe hakika atatuokoa[a], na mji huu hautatiwa mikononi mwa mfalme wa Ashuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Kuokoa, atatuokoa,” muundo wa kusisitiza unaomaanisha, “Hakika atatuokoa.”
    reason: Maelezo ya muundo wa Kiebrania wenye msisitizo.
lexical_decisions:
- source_word: וְ/אַל יַבְטַח אֶתְ/כֶם
  choice: Wala msikubali Hezekia awafanye mumtumaini
  rationale: Hifili ya בטח pamoja na kiambishi cha yambwa ina maana ya kusababisha watu watumaini. Muundo huu unahifadhi nguvu hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: חִזְקִיָּהוּ
  choice: Hezekia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אֶל יְהוָה
  choice: mumtumaini Yahwe
  rationale: Ingawa אֶל kwa kawaida humaanisha ‘kwa/kuelekea,’ pamoja na בטח hapa Kiswahili cha kawaida hutumia ‘kumtumaini.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni utangulizi wa kawaida wa maneno yaliyonukuliwa, ukiunganishwa kwa asili na tendo la Hezekia.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: atatuokoa hakika
  rationale: Kitenzi-jina halisi kikifuatiwa na kitenzi chenye nafsi husisitiza uhakika wa tendo; ‘hakika’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: וְלֹא תִנָּתֵן
  choice: wala ... hautatiwa
  rationale: Kauli tendwa ya נתן hapa inaonyesha mji kutiwa chini ya mamlaka ya adui. ‘Hautatiwa mkononi’ huhifadhi kauli tendwa na kuungana na nahau inayofuata.
- source_word: הָעִיר הַזֹּאת
  choice: mji huu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nomino pamoja na kiashiria.
- source_word: בְּיַד
  choice: mkononi mwa
  rationale: Nahau halisi ya Kiebrania imehifadhiwa; katika muktadha wa kijeshi inaeleweka kuwa chini ya mamlaka au udhibiti wa mtu.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Hili ndilo jina la kawaida la kihistoria la ufalme huo kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msikubali ... awafanye’ ni muundo wa kawaida unaohifadhi maana ya kisababishi; ‘mkononi mwa’ inadumisha picha halisi ya Kiebrania huku ikieleweka katika muktadha wa kutekwa kwa mji.
