base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: sw
  text: Tazama, unategemea Misri, ile fimbo ya mwanzi iliyovunjika[a], ambayo mtu akiiegemea[b], itamwingia kiganjani na kukitoboa. Hivyo ndivyo Farao, mfalme wa Misri, alivyo kwa wote wanaomtegemea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyopondwa.” Neno la Kiebrania linaweza kumaanisha kitu kilichopondwa, kilichopondeka, au kilichovunjika; “iliyovunjika” inafaa zaidi kwa picha ya tegemeo linalovunjika na kujeruhi mkono.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mtu akiiegemea.” Umoja wa kiume umetumiwa hapa kwa maana ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: unategemea Misri
  rationale: Kitenzi בטח kinaonyesha kutumainia au kutegemea. Hapa kauli ya wakati uliotimilika ina nguvu ya tendo la sasa katika dhihaka hii; “unategemea” ni ya kawaida na inaonyesha utegemezi unaoendelea.
- source_word: מִשְׁעֶנֶת הַקָּנֶה
  choice: fimbo ya mwanzi
  rationale: מִשְׁעֶנֶת ni kitu kinachotumiwa kama tegemeo. “Fimbo ya mwanzi” huhifadhi picha ya kitu cha kushikilia na kukiegemea.
- source_word: הָרָצוּץ
  choice: uliovunjika
  rationale: רצוץ inaweza kumaanisha uliopondwa, uliopondeka, au uliovunjika. “Uliovunjika” inafaa zaidi kwa picha ya mwanzi unaochanika na kujeruhi mkono.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: ambao mtu akiuegemea
  rationale: Nifali ya סמך ina maana ya kuegemea kitu ili kupata msaada. Muundo wa masharti unaeleweka katika kishazi cha Kiebrania na unaonyeshwa kwa kawaida kwa “akiuegemea.” “Mtu” huhifadhi umoja wa kawaida unaowakilisha yeyote.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: utapenya kiganja chake na kukitoboa
  rationale: כף hapa ni kiganja cha mkono, na נקב ni kutoboa au kupenya. Tafsiri hii huhifadhi picha halisi ya mwanzi uliovunjika unaoingia kiganjani na kukijeruhi.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Hivyo ndivyo Farao, mfalme wa Misri, alivyo
  rationale: כֵּן inakamilisha ulinganisho kati ya mwanzi uliovunjika na Farao. Muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: kwa wote wanaomtegemea
  rationale: 'Lamed inaonyesha uhusiano: Farao ni kama fimbo hiyo kwa wale wanaomtegemea. “Wote” huhifadhi maana ya ujumla ya kishirikishi.'
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutegemea” limetumiwa badala ya “kutumainia” ili kudumisha mchezo wa picha kati ya kumtegemea Misri na kuuegemea mwanzi. Viambishi vya ngeli ya mwanzi vimehifadhiwa kwa usahihi: “ambao,” “akiuegemea,” na “utapenya.”'
