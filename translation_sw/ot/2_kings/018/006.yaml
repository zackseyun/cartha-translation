base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: sw
  text: Alishikamana na Yahweh[a]; hakuacha kumfuata, na alizishika amri zake ambazo Yahweh alimwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alimng’ang’ania Yahweh.” Kitenzi cha Kiebrania kinaonyesha kushikamana kwa nguvu na uaminifu thabiti wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: Alishikamana
  rationale: Kitenzi דבק kinaonyesha kushikamana kwa uthabiti na uaminifu wa agano, si mguso wa kimwili tu. ‘Alishikamana’ ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya uhusiano.
- source_word: בַּיהוָה
  choice: na Yahweh
  rationale: Kiambishi ב pamoja na דבק huonyesha yule ambaye mtu anashikamana naye; ‘na Yahweh’ ni muundo wa asili katika Kiswahili.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: hakuacha kumfuata
  rationale: Muundo סור מן + אחר humaanisha kugeuka au kuacha kumfuata mtu. Tafsiri hii inaweka wazi uaminifu unaoendelea bila kuongeza wazo lisilokuwamo.
- source_word: וַיִּשְׁמֹר
  choice: alizishika
  rationale: שׁמר inapotumiwa kuhusu amri humaanisha kuzitii au kuzifuata; ‘kuzishika amri’ huhifadhi istilahi ya kibiblia na inaeleweka katika Kiswahili.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: מִצְוֹת ni wingi wa ‘amri’; kiwakilishi ‘zake’ kinamrejelea Yahweh kama katika Kiebrania.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ambazo Yahweh alimwamuru Musa
  rationale: Kitenzi צוה pamoja na kiambishi cha mtendewa אֶת humtaja Musa kama aliyepokea maagizo. ‘Alimwamuru Musa’ hufuata muundo wa chanzo bila kulazimisha wakati timilifu usio na ulazima katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ hulitambulisha kama jina binafsi na kuendana na safu ya mashauriano iliyotolewa, bila kulibadili kuwa cheo.
- issue: Nguvu ya kiagano ya דבק
  choice: alishikamana na Yahweh
  alternative: aliambatana na Yahweh; alimng’ang’ania Yahweh
  rationale: ‘Alishikamana’ huhifadhi wazo la uhusiano wa karibu na uaminifu thabiti bila kufanya usemi usikike wa kimwili kupita kiasi. Tanbihi inaonyesha maana mbadala iliyo halisi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘bali’ kuunganisha kwa kawaida kutokuacha kumfuata Yahweh na kuzishika amri zake, bila kubadili mantiki ya mstari.
