base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: sw
  text: Ndipo Rabshake akawaambia, “Je, bwana wangu amenituma kusema maneno haya kwa bwana wako na kwako? Je, hakunituma pia kwa watu wanaoketi juu ya ukuta, ambao watakula kinyesi chao na kunywa mkojo wao[a] pamoja nanyi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kilichoandikwa hutumia maneno makali ya dhihaka ya kuzingirwa: “kinyesi chao” na “mkojo wao.” Mapokeo ya usomaji wa Kiebrania hutumia maneno yenye ukali uliopunguzwa; usemi wa pili hutafsiriwa mara nyingi “maji ya miguu yao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabshake
  rationale: Jina la cheo cha afisa mkuu wa Ashuru limeendelezwa kwa unukuzi, kwa kuwa kazi yake hususa haijulikani kwa uhakika na katika simulizi hili cheo hicho kinatumika karibu kama jina.
- source_word: הַעַל אֲדֹנֶיךָ וְאֵלֶיךָ שְׁלָחַנִי אֲדֹנִי
  choice: Je, bwana wangu amenituma ... kwa bwana wako na kwako tu?
  rationale: Muundo wa swali la balagha umewekwa katika Kiswahili cha kawaida. Neno “tu” linaonyesha utofautishaji unaofuatia—si viongozi pekee, bali pia watu walio ukutani—bila kubadili hoja ya msemaji.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: bwana wako / bwana wangu
  rationale: Hapa maneno hayo yanawahusu wafalme au wakubwa wa kisiasa, si jina la Mungu; “bwana” linafaa kwa uhusiano huo wa mamlaka.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: kusema maneno haya
  rationale: Tafsiri hii inahifadhi picha halisi ya ‘maneno’ na ni ya kawaida katika Kiswahili sanifu.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: Je, hakunituma pia kwa watu wanaoketi juu ya ukuta
  rationale: Swali linatarajia jibu la kukubali. “Pia” linaweka wazi utofautishaji uliomo katika muktadha.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: ambao watakula ... na kunywa
  rationale: Wakati ujao unaeleza matokeo mabaya ya kuzingirwa kwa uwazi na kiasili, bila kuongeza wazo la hatima lililoamuliwa.
- source_word: חרי/הם
  choice: kinyesi chao wenyewe
  rationale: Neno lililoandikwa ni la moja kwa moja na kali; “kinyesi” linafikisha maana yake wazi bila kuficha ukali wa dhihaka.
- source_word: שיני/הם
  choice: mkojo wao wenyewe
  rationale: Maana ya wazi katika picha ya mateso ya kuzingirwa ni mkojo. Tafsiri ya moja kwa moja inaeleweka kuliko nahau ya ‘maji ya miguu yao.’
- source_word: עִמָּכֶם
  choice: pamoja nanyi
  rationale: Kiambishi cha nafsi ya pili wingi kimehifadhiwa, kikionyesha kwamba waliokuwa ukutani na watu waliozungumziwa wangepata mateso hayo pamoja.
