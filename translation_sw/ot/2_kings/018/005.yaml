  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: sw
  text: Alimtumaini Yahwe[a], Mungu wa Israeli. Baada yake, hakukuwa na yeyote kama yeye miongoni mwa wafalme wote wa Yuda, wala miongoni mwa wale waliomtangulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika Yahwe,” yaani, alimtegemea Yahwe.'
    reason: Ufafanuzi wa kihusishi בְּ kinachotaja mlengwa wa tumaini.
lexical_decisions:
- source_word: בַּיהוָה
  choice: Alimtumaini Yahwe
  rationale: Kihusishi בְּ huonyesha anayelengwa na tumaini, na kitenzi בָּטָח humaanisha kutumaini au kumtegemea. Jina la Mungu יְהוָה limetolewa kama “Yahwe.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo wa tegemezi unamtambulisha Yahwe kuwa Mungu wa Israeli; katika Kiswahili unasomeka kwa kawaida kama kirai cha ufafanuzi.
- source_word: בָּטָח
  choice: alimtumaini
  rationale: Qal timilifu ya בטח ina maana ya kutumaini au kutegemea. “Alimtumaini” ni ya kawaida na huonyesha wazi kuwa Yahwe ndiye mlengwa.
- source_word: וְאַחֲרָיו
  choice: Baada yake
  rationale: Kirai hiki ni cha wakati na kinaanzisha ulinganisho na wafalme waliokuja baada yake.
- source_word: לֹא הָיָה כָמֹהוּ
  choice: hakukuwa na yeyote kama yeye
  rationale: Huhifadhi usemi wa Kiebrania unaosisitiza kutokuwa na mwingine wa kulinganishwa naye bila kubadili kuwa dai pana kuliko muktadha.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: miongoni mwa wafalme wote wa Yuda
  rationale: Kihusishi בְּ hapa kinaonyesha ulinganisho ndani ya kundi la wafalme wa Yuda; “miongoni mwa” ni Kiswahili cha kawaida.
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: wala miongoni mwa wale waliomtangulia
  rationale: Kirai husika kinapanua ulinganisho kwa wafalme waliokuwapo kabla yake. “Waliomtangulia” hutoa maana ya לְפָנָיו kwa ufupi na kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Upeo wa dai la kutokuwa na mwingine kama Hezekia
  choice: Ulinganisho umewekewa mipaka kwa wafalme wa Yuda
  alternative: Dai la jumla kwamba hakuna mtu yeyote aliyekuwa kama yeye
  rationale: Kirai בְּכֹל מַלְכֵי יְהוּדָה kinaweka kundi linalolinganishwa; tafsiri haipaswi kupanua dai zaidi ya kundi hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Alimtumaini” ni cha kawaida na wazi; “waliomtangulia” huepuka kirai kizito cha “waliokuwa kabla yake.” Alama ya tanbihi [a] imewekwa mara tu baada ya “Yahwe.”
