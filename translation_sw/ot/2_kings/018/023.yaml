translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Basi sasa’ huhifadhi mpito wa וְעַתָּה, huku sentensi mbili zikisaidia usomaji wa kawaida bila kuondoa uhusiano wa changamoto na toleo la farasi.
