base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: sw
  text: “Basi sasa, tafadhali weka dau[a] na bwana wangu, mfalme wa Ashuru. Nitakupa farasi elfu mbili, ikiwa utaweza kupata wapanda farasi wa kuwapanda farasi hao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fanya mapatano na bwana wangu,” au “jiweke rehani kwa bwana wangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuingia katika makubaliano au kujifunga kama dhamana, lakini hapa huenda kina maana ya dau au changamoto ya kejeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב
  choice: weka dau
  rationale: Katika muktadha huu wa kejeli na changamoto, kitenzi hiki kinaelekea kumaanisha kuingia katika dau au mashindano ya kuthibitisha uwezo, si kufanya makubaliano ya kawaida tu. ‘Weka dau’ ni Kiswahili cha sasa na kinaendeleza dhihaka inayofuatiwa na sharti kuhusu wapanda farasi.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe hii hulainisha agizo. ‘Tafadhali’ huhifadhi umbo la heshima ambalo hapa lina ladha ya kejeli.
- source_word: אֶת אֲדֹנִי
  choice: na bwana wangu
  rationale: אֶת hapa ina maana ya ‘na’ baada ya הִתְעָרֶב. ‘Bwana wangu’ humtaja mkuu wa Rabshake, wala si jina la Mungu; muktadha unaweka maana hiyo wazi.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: וְאֶתְּנָה לְךָ
  choice: Nitakupa
  rationale: Kauli hii ni toleo la msemaji ndani ya changamoto. Wakati ujao wa Kiswahili unaonyesha vizuri ahadi hiyo.
- source_word: אַלְפַּיִם סוּסִים
  choice: farasi elfu mbili
  rationale: Huhifadhi idadi na nomino ya chanzo moja kwa moja kwa mpangilio wa kawaida wa Kiswahili.
- source_word: אִם תּוּכַל
  choice: ikiwa utaweza
  rationale: Huhifadhi sharti linalotilia shaka uwezo wa Yuda na hivyo kuendeleza sauti ya dhihaka.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: kupata wapanda farasi wa kuwapanda
  rationale: Kiebrania ni kwa maana ya kuwapatia au kuwaweka wapanda farasi juu yao. Usemi huu wa Kiswahili ni wa asili na unaonyesha kwamba tatizo ni ukosefu wa watu wa kutosha wa kuwapanda farasi hao.
