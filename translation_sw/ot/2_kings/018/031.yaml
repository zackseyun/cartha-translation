  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר מֶ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵֽנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵֽי בוֹרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: sw
  text: '“Msimsikilize Hezekia, kwa maana mfalme wa Ashuru anasema hivi: ‘Fanyeni amani nami[a], kisha mtoke mnijie. Kila mtu ale matunda ya mzabibu wake mwenyewe na ya mtini wake mwenyewe, na anywe maji ya shimo lake mwenyewe la kuhifadhia maji,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi ya Kiebrania, “fanyeni baraka nami”; hii ni nahau yenye maana ya kufanya amani au kuingia katika mapatano.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: msimsikilize
  rationale: Kitenzi שׁמע pamoja na אֶל hapa kina maana ya kumsikiliza au kumtii mtu. “Msimsikilize” ni Kiswahili cha kawaida na kinahifadhi maana ya moja kwa moja bila kulazimisha wazo kamili la kutii.
- source_word: חִזְקִיָּהוּ
  choice: Hezekia
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: כִּי כֹה אָמַר
  choice: kwa maana ... anasema hivi
  rationale: Hii ni fomula ya kuanzisha maneno ya moja kwa moja; tafsiri hii ni ya asili katika Kiswahili cha sasa.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Huu ni uwasilishaji wa moja kwa moja na uliozoeleka wa muundo wa Kiebrania.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: fanyeni amani nami
  rationale: Kirai hiki, ambacho kwa maneno halisi kinataja ‘baraka,’ ni nahau ya kuingia katika mapatano mazuri au kufanya amani. Maana ya nahau imewekwa katika matini, na umbo lake lisilo la kawaida limehifadhiwa katika tanbihi.
- source_word: וּצְאוּ אֵלַי
  choice: kisha mtoke mnijie
  rationale: Tafsiri inahifadhi tendo halisi la kutoka mjini na kumjia msemaji; muktadha unaashiria kujisalimisha, lakini jambo hilo halijaongezwa waziwazi.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: kila mtu ale matunda ya mzabibu wake mwenyewe na ya mtini wake mwenyewe
  rationale: “Kila mtu” huonyesha matumizi ya kugawa ya אִישׁ kwa Kiswahili cha kawaida. Neno “matunda” limeongezwa kwa uwazi kwa sababu kinacholiwa ni matunda ya mzabibu na mtini, si miti yenyewe.
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: na anywe maji ya shimo lake mwenyewe la kuhifadhia maji
  rationale: בּוֹר hapa ni shimo au hifadhi ya kukusanya maji, si lazima kisima chenye chemchemi. Kirai hiki ni wazi kwa msomaji wa kawaida kuliko “birika,” ambalo katika Kiswahili cha sasa mara nyingi humaanisha chombo kidogo cha maji.
theological_decisions:
- issue: Nomino ya kugawa אִישׁ inayorudiwa
  choice: kila mtu
  alternative: kila mwanamume
  rationale: Katika muktadha huu אִישׁ inatumika kwa maana ya kugawa watu mmoja mmoja. Kiswahili “kila mtu” hudumisha nguvu hiyo bila kuingiza dai lisilo la lazima kwamba ahadi iliwahusu wanaume pekee.
- issue: Nahau ya kisiasa עֲשׂוּ אִתִּי בְרָכָה
  choice: fanyeni amani nami
  alternative: fanyeni baraka nami
  rationale: Maana inayokusudiwa ni kufanya mapatano au kukubali masharti ya amani na mfalme wa Ashuru. Tafsiri ya neno kwa neno isingeeleweka kwa urahisi katika Kiswahili, hivyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Usemi wa hotuba ya kifalme umehifadhiwa bila kutumia msamiati wa kale usio wa lazima. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika, si baada ya jina Hezekia.
