  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: sw
  text: Je, kila mmoja wa miungu ya mataifa amewahi kweli kuiokoa nchi yake kutoka mkononi mwa mfalme wa Ashuru?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: imewahi kweli kuokoa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kilichokamilika unasisitiza tendo la kuokoa. Katika swali hili la kejeli, “imewahi kweli kuokoa” huwasilisha changamoto hiyo kwa Kiswahili cha kawaida bila kurudia kitenzi kwa namna isiyo ya asili.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: miungu ya mataifa
  rationale: Hii ni hali ya uambatanisho ya wingi, ikirejelea miungu ya mataifa au jamii mbalimbali. “Miungu ya mataifa” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Hapa neno hili lina maana ya mgawanyo—kila mungu kwa upande wake—wala halimaanishi mwanamume mmoja.
- source_word: אֶת אַרְצוֹ
  choice: nchi yake
  rationale: 'Kiambishi cha umoja kinafuata maana ya mgawanyo ya אִישׁ: kila mungu na nchi yake husika. “Nchi yake” huhifadhi umoja huo na uhusishaji wa miungu kama watendaji.'
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Nahau hii humaanisha kuokolewa kutoka katika mamlaka au nguvu za mtu. Taswira ya “mkono” inaeleweka katika Kiswahili na huhifadhi picha ya Kiebrania.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya muundo wa uambatanisho wa Kiebrania.
