  variant: Standard East African Swahili
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ אֲבִ֖י בַּת זְכַרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: sw
  text: Alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, naye akatawala miaka ishirini na tisa huko Yerusalemu. Mama yake aliitwa Abi, binti ya Zekaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri. Kiswahili cha asili hutumia ‘alikuwa na umri wa miaka...’ badala ya tafsiri sisisi isiyo ya kawaida ‘mwana wa miaka...’.
- source_word: הָיָה בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha umri wake wakati alipoingia katika ufalme; ‘alipoanza kutawala’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki humaanisha kutumia mamlaka ya kifalme au kutawala, si kuwa na cheo cha mfalme tu.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi kinaonyesha mahali ambapo utawala wake ulikuwa; ‘huko’ ni ya asili katika Kiswahili kwa mji uliotajwa.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Huu ni uwasilishaji wa asili wa Kiswahili wa taarifa ya Kiebrania ‘jina la mama yake lilikuwa’, bila kupoteza maana.
- source_word: אֲבִי
  choice: Abi
  rationale: Jina la mtu limenukuliwa kwa herufi za Kiswahili kwa namna inayokaribia umbo la Kiebrania.
- source_word: בַּת זְכַרְיָה
  choice: binti ya Zekaria
  rationale: Kirai unganishi kinaonyesha ukoo wa Abi. ‘Binti ya Zekaria’ ni Kiswahili sanifu na cha moja kwa moja.
