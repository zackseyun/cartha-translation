base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: sw
  text: Unasema, ‘Ni neno la mdomo tu’—lakini shauri na nguvu ni kwa ajili ya vita. Sasa unamtumaini nani, hata umeniasi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: maneno ya midomo
  rationale: Nahau ya Kiebrania imehifadhiwa kwa ukaribu ili kuonyesha tofauti kati ya maneno matupu na uwezo halisi wa vita; wingi wa Kiswahili unasikika kwa kawaida katika muktadha huu.
- source_word: עֵצָה
  choice: shauri
  rationale: Neno hili lina maana ya ushauri, mpango, au mkakati; “shauri” huhifadhi upana wake bila kulifunga kwa mkakati wa kijeshi pekee.
- source_word: גְבוּרָה
  choice: nguvu
  rationale: Katika muktadha wa vita, neno linamaanisha uwezo au nguvu za kutekeleza; “nguvu” ni wazi na ya kawaida.
- source_word: בָטַחְתָּ
  choice: unamtumaini
  rationale: Kitenzi kinaonyesha kumtegemea au kuweka tumaini kwa mtu; kiambishi cha nafsi kinafaa kwa swali עַל מִי, “nani?”
- source_word: מָרַדְתָּ
  choice: ukaasi
  rationale: Hutoa maana ya uasi dhidi ya mamlaka ya kisiasa na kuhifadhi uzito wa shtaka.
theological_decisions:
- issue: Uhusiano wa kishazi cha “maneno ya midomo” na “shauri na nguvu”
  choice: 'Kutumia kistari kirefu na “lakini” kuonyesha utofautishaji: maneno pekee dhidi ya mahitaji halisi ya vita.'
  alternative: “Unasema, ‘Shauri na nguvu za vita ni maneno ya midomo tu.’”
  rationale: Sintaksia ya Kiebrania ni ngumu na inaweza kupangwa kwa njia zaidi ya moja. Chaguo hili linafuata usomaji unaowakilishwa na maandishi ya mashauriano bila kudai kwamba uwezekano mwingine haupo.
- issue: Mlengwa wa tumaini
  choice: Kuacha swali likimtaja “nani” bila kumtambua.
  alternative: Kumtaja Misri au mamlaka nyingine kwa ufafanuzi.
  rationale: Mstari wenyewe haumtambui anayeturnainiwa; kumtaja kungeleta habari kutoka muktadha na kupunguza nguvu ya swali la balozi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Vita vinahitaji” hutiririsha kishazi kifupi cha Kiebrania kwa njia ya kawaida bila kupoteza utofautishaji wake.
