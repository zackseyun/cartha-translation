base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: sw
  text: Miungu ya Hamathi na Arpadi iko wapi? Miungu ya Sefarvaimu, Hena na Iva[a] iko wapi? Je, zimeiokoa Samaria kutoka mkononi mwangu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina “Iva” pia huandikwa “Ava” katika mapokeo fulani ya tafsiri.
    reason: Tofauti za utohoaji wa jina la Kiebrania עִוָּה.
lexical_decisions:
- source_word: אַיֵּה
  choice: iko wapi
  rationale: Ni kiulizi cha mahali. Muundo huu ni wa kawaida katika Kiswahili na unadumisha dhihaka ya swali la balagha.
- source_word: אֱלֹהֵי
  choice: miungu ya
  rationale: Ni wingi katika hali ya uambatano, ukirejelea miungu ya miji au mataifa yaliyotajwa, bila kudai chochote kuhusu uhalisi au uwezo wake.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamathi na Arpadi
  rationale: Majina haya ya mahali yametoholewa kwa maumbo yaliyozoeleka na yanayosomeka kwa urahisi katika Kiswahili.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: Sefarvaimu, Hena na Iva
  rationale: Majina ya mahali yametoholewa kwa Kiswahili. Tofauti ya tahajia ya Iva imehifadhiwa katika tanbihi.
- source_word: כִּי
  choice: Je
  rationale: Katika muktadha huu neno hilo linaanzisha au kuimarisha swali la balagha. “Je” huwasilisha kazi hiyo kwa Kiswahili bila tafsiri ngumu ya neno kwa neno.
- source_word: הִצִּילוּ
  choice: imeiokoa
  rationale: Kitenzi נצל katika Hifili humaanisha kuokoa au kukomboa kutoka hatarini au chini ya mamlaka ya mwingine. “Kuokoa” ni cha kawaida na kinafaa katika muktadha huu wa kijeshi.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: מִיָּדִי
  choice: kutoka mkononi mwangu
  rationale: Nahau ya Kiebrania imehifadhiwa kwa sababu inaeleweka katika Kiswahili na inaonyesha kwa nguvu mamlaka au udhibiti wa msemaji.
theological_decisions:
- issue: Dai la msemaji kuhusu miungu ya mataifa na kuokolewa kwa Samaria
  choice: Kauli imetafsiriwa kama dhihaka ya msemaji kwamba miungu iliyotajwa haikuiokoa Samaria kutoka mamlakani mwake.
  alternative: Kauli inaweza kueleweka kwa upana zaidi kama dhihaka ya jumla dhidi ya miungu yote ya mataifa, si madai mahususi kuhusu kila mungu aliyetajwa.
  rationale: Kiebrania kinataja miungu ya maeneo kadhaa kisha kinauliza kwa balagha ikiwa imeiokoa Samaria “kutoka mkononi mwangu.” Tafsiri inadumisha dhihaka hiyo bila kuthibitisha wala kukataa moja kwa moja uhalisi au uwezo wa miungu hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa “iko wapi” umehifadhiwa ili kudumisha nguvu ya dhihaka ya Kiebrania. Upatanisho wa ngeli katika “imeiokoa” unafuata nomino “miungu,” huku swali likibaki la balagha.
