base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: sw
  text: Naye Yahwe alikuwa pamoja naye; popote alipokwenda[a], alifanikiwa. Akamwasi mfalme wa Ashuru, wala hakumtumikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kila jambo alilofanya, alifanikiwa,” au, “alitenda kwa hekima katika yote aliyofanya.” Neno la Kiebrania linaunganisha mawazo ya hekima na mafanikio.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu lililoandikwa moja kwa moja katika Kiebrania, kwa tahajia ya kawaida na inayosomeka kwa Kiswahili.
- source_word: וְהָיָה ... עִמּוֹ
  choice: alikuwa pamoja naye
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha uwepo na kibali cha Mungu vilivyoendelea.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: kila alikokwenda
  rationale: Kiebrania kwa halisi kina wazo la ‘kutoka’; katika muktadha huu kinahusu kila mahali alikokwenda au kila jambo alilofanya. Chaguo hili ni la asili kwa Kiswahili bila kuzuia maana pana.
- source_word: יַשְׂכִּיל
  choice: alifanikiwa
  rationale: Hifili ya שׂכל inaweza kumaanisha kutenda kwa hekima au kufanikiwa. Katika simulizi hili la kifalme, matokeo ya mafanikio ndiyo yaliyo mbele, huku tanbihi ikihifadhi maana nyingine.
- source_word: וַיִּמְרֹד
  choice: akamwasi
  rationale: Kitenzi ‘kuasi’ kinafaa kwa uasi wa kisiasa dhidi ya mamlaka ya kifalme na kinaakisi מרד kwa ufupi.
- source_word: בְּמֶלֶךְ אַשׁוּר
  choice: mfalme wa Ashuru
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mtawala ambaye uasi ulimwelekea.
- source_word: וְלֹא עֲבָדוֹ
  choice: wala hakumtumikia
  rationale: Kinahifadhi kitenzi cha Kiebrania ‘kutumikia’; katika muktadha wa kisiasa kinadokeza kukataa hali ya kuwa chini ya mfalme huyo bila kuongeza maelezo ndani ya aya.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja. ‘Yahwe’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo, huku likifuata tahajia inayofaa Kiswahili.
- issue: Uhusiano kati ya hekima na mafanikio katika יַשְׂכִּיל
  choice: alifanikiwa, huku maana ya kutenda kwa hekima ikitajwa katika tanbihi
  alternative: alitenda kwa hekima
  rationale: Neno la Kiebrania linabeba mvutano wa maana kati ya mwenendo wa busara na matokeo yenye mafanikio; tanbihi huepuka kuufuta mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi la Biblia ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Kiunganishi ‘Naye’ kinaendeleza simulizi, na ‘wala’ kinaunganisha kwa asili uasi wake na kukataa kwake kumtumikia mfalme wa Ashuru.
