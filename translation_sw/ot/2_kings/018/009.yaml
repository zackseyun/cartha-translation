  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: sw
  text: Ikawa[a] katika mwaka wa nne wa mfalme Hezekia—ambao ulikuwa mwaka wa saba wa Hoshea mwana wa Ela, mfalme wa Israeli—Shalmaneseri, mfalme wa Ashuru, akapanda dhidi ya Samaria[b] na kuizingira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ilitukia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akaenda kupigana na Samaria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hii ni kauli ya kawaida ya Kiebrania inayotanguliza tukio katika simulizi. “Ikawa” inadumisha mtiririko huo kwa Kiswahili sanifu na chenye hadhi.
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: katika mwaka wa nne
  rationale: Hii ni fomula ya kawaida ya kutaja mwaka wa utawala; tafsiri hii ni sahihi na ya asili katika Kiswahili.
- source_word: לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: wa Mfalme Hezekia
  rationale: Herufi lamed inaonyesha mwaka unaohusishwa na utawala wa Hezekia; “wa Mfalme Hezekia” ni usemi wa kawaida wa Kiswahili.
- source_word: הִיא
  choice: ambao ulikuwa
  rationale: Kiwakilishi hiki kinaunganisha tarehe mbili za miaka ya utawala. “Ambao ulikuwa” humrejelea “mwaka wa nne” kwa uwazi.
- source_word: הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ בֶּן־אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: mwaka wa saba wa Hoshea mwana wa Ela, mfalme wa Israeli
  rationale: Tafsiri inadumisha ulinganisho wa miaka ya utawala pamoja na nasaba na cheo cha Hoshea.
- source_word: עָלָה
  choice: akapanda kwenda kuishambulia
  rationale: Katika muktadha wa kijeshi, kitenzi hiki humaanisha kupanda au kwenda kufanya kampeni dhidi ya mahali fulani. Usemi huu unadumisha wazo la kupanda na kuweka wazi kusudi la kijeshi bila kudai kwamba shambulio lilikuwa tayari limefanikiwa.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Shalmaneseri
  rationale: Hili ni umbo la jina la mfalme wa Ashuru linalofaa mfumo wa matamshi na uandishi wa Kiswahili.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Muundo huu hutaja cheo cha Shalmaneseri na nchi aliyotawala kwa Kiswahili cha kawaida.
- source_word: עַל שֹׁמְרוֹן
  choice: kuishambulia Samaria
  rationale: Baada ya kitenzi cha mwendo wa kijeshi, עַל huonyesha kwamba Samaria ndiyo iliyolengwa kwa uhasama.
- source_word: וַיָּצַר עָלֶיהָ
  choice: na kuizingira
  rationale: Kitenzi צור katika muktadha huu humaanisha kuuzingira mji kwa vita. Kiwakilishi “-i-” kinamrejelea Samaria.
