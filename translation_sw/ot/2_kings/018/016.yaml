  text: בָּ/עֵ֣ת הַ/הִ֗יא קִצַּ֨ץ חִזְקִיָּ֜ה אֶת דַּלְת֨וֹת הֵיכַ֤ל יְהוָה֙ וְ/אֶת הָ/אֹ֣מְנ֔וֹת אֲשֶׁ֣ר צִפָּ֔ה חִזְקִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַֽ/יִּתְּנֵ֖/ם לְ/מֶ֥לֶךְ אַשּֽׁוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: sw
  text: Wakati huo Hezekia alikata milango ya hekalu la Yahweh na miimo ya milango[a] ambayo Hezekia, mfalme wa Yuda, alikuwa amevifunika, akampa mfalme wa Ashuru vitu hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fremu za milango,” “nguzo,” au “vitegemezo.” Neno la Kiebrania ni adimu na huenda linataja kwa upana zaidi sehemu za kimuundo zilizohusiana na milango ya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoendeleza mfululizo wa matukio katika simulizi.
- source_word: קִצַּץ
  choice: alikata
  rationale: Kitenzi kina maana ya kukata au kuondoa kwa kukata; tafsiri hii inadumisha tendo halisi bila kulifanya kuwa kuambua tu.
- source_word: דַּלְתוֹת
  choice: milango
  rationale: Ni tafsiri ya wazi na ya kawaida ya neno linaloweza kumaanisha milango au mabamba ya milango.
- source_word: הֵיכַל יְהוָה
  choice: hekalu la Yahweh
  rationale: Katika muktadha huu הֵיכָל ni hekalu la Yerusalemu, na jina la agano יְהוָה limetoholewa kuwa Yahweh.
- source_word: הָאֹמְנוֹת
  choice: miimo ya milango
  rationale: Neno hili adimu linataja sehemu za kimuundo zinazohusiana na milango; 'miimo ya milango' inafaa katika muktadha huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: צִפָּה
  choice: alikuwa ameifunika kwa madini
  rationale: Kitenzi hueleza kufunika uso kwa tabaka, mara nyingi la metali. Kiswahili hiki ni cha kawaida na hakitaji aina ya madini ambayo haikutajwa katika mstari huu.
- source_word: וַיִּתְּנֵם
  choice: akampa ... vitu hivyo
  rationale: Kiwakilishi cha Kiebrania ni cha wingi na kinaelekea kwa vitu vilivyoondolewa; 'vitu hivyo' huifanya rejea iwe wazi katika Kiswahili.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja; 'Yahweh' huhifadhi jina la agano badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi bila kuondoa utata wa neno האמנות; tanbihi inahifadhi tafsiri mbadala.
