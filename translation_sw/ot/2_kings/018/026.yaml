base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: sw
  text: Ndipo Eliakimu mwana wa Hilkia, Shebna na Yoa wakamwambia Rabshake, “Tafadhali sema na watumishi wako kwa Kiaramu, kwa maana tunakielewa. Usiseme nasi kwa lugha ya Yuda[a] masikioni mwa watu walio juu ya ukuta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Kiebrania.” Neno la Kiebrania יְהוּדִית humaanisha kihalisi “Kiyuda” au “cha Yuda,” likirejelea lugha ya Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabshake
  rationale: Jina la cheo la Kiashuru limetoholewa badala ya kubashiri kwa uhakika kupita kiasi wajibu halisi wa afisa huyo.
- source_word: דַּבֶּר נָא
  choice: Tafadhali sema
  rationale: Kauli ya kuamuru pamoja na נָא ni ombi la heshima; Kiswahili hiki ni cha kawaida na kinahifadhi upole wake.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazungumzo haya ya kidiplomasia, neno hilo ni namna ya kujishusha kwa heshima, si msisitizo wa hali ya utumwa.
- source_word: אֲרָמִית
  choice: kwa Kiaramu
  rationale: Umbo hilo linatumika kueleza lugha ambayo waseme nayo; ‘kwa Kiaramu’ ni usemi wa kawaida wa Kiswahili.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: kwa maana tunakielewa
  rationale: Katika muktadha wa uwezo wa lugha, שׁמע humaanisha kuelewa, si kusikia sauti tu; kiambishi ‘-ki-’ kinarejelea Kiaramu.
- source_word: יְהוּדִית
  choice: Kiyahudi
  rationale: Neno la Kiebrania linamaanisha lugha ya Yuda. ‘Kiyahudi’ linahifadhi uhusiano huo bila kulifanya kwa lazima kuwa jina la kitaalamu la Kiebrania; tanbihi inaeleza uwezekano huo.
- source_word: בְּאָזְנֵי
  choice: masikioni mwa
  rationale: Tafsiri hii inahifadhi picha halisi ya kusikika na inaeleweka vizuri katika Kiswahili.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: watu walioko juu ya ukuta
  rationale: Chanzo kinasema ‘watu,’ si hasa wanajeshi, na kinawaweka juu ya ukuta.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Ndipo ... wakamwambia
  rationale: ‘Ndipo’ pamoja na umbo la simulizi ‘wakamwambia’ huendeleza mfuatano wa masimulizi kwa Kiswahili cha kawaida.
