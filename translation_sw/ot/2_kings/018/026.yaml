translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Orodha ya majina imerahisishwa kwa sarufi ya Kiswahili, huku lugha ya kidiplomasia na picha ya watu kusikia kutoka ukutani zikihifadhiwa.
