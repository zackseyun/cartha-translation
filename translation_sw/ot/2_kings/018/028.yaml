  text: וַֽ/יַּעֲמֹד֙ רַב שָׁקֵ֔ה וַ/יִּקְרָ֥א בְ/קוֹל גָּד֖וֹל יְהוּדִ֑ית וַ/יְדַבֵּ֣ר וַ/יֹּ֔אמֶר שִׁמְע֛וּ דְּבַר הַ/מֶּ֥לֶךְ הַ/גָּד֖וֹל מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: sw
  text: Ndipo Rabshake akasimama, akaita kwa sauti kubwa kwa lugha ya Yuda[a], akasema, “Sikieni neno la mfalme mkuu, mfalme wa Ashuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Kiebrania.” Neno la Kiebrania linamaanisha hasa lugha ya Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Kitenzi עמד katika mfululizo wa masimulizi kina maana ya moja kwa moja ya kusimama; 'akasimama' ni Kiswahili cha kawaida na hakiongezi wazo lisilokuwamo.
- source_word: רַב שָׁקֵה
  choice: Rabshake
  rationale: Jina hili la cheo cha Kiashuru limeandikwa kwa unukuzi ili kuhifadhi utambulisho wake wa kihistoria bila kulazimisha tafsiri ya cheo ambayo haijathibitishwa kikamilifu katika muktadha huu.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: akaita kwa sauti kubwa
  rationale: Muungano wa קרא na בְקוֹל גָּדוֹל unaonyesha kuita hadharani kwa sauti yenye nguvu; usemi huu ni wa asili na wazi katika Kiswahili.
- source_word: יְהוּדִית
  choice: kwa lugha ya Yuda
  rationale: Neno hili linataja hasa lugha au lahaja ya Yuda. Tafsiri hii huhifadhi umahususi wa kihistoria kuliko kusema tu 'kwa Kiebrania'.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: akasema
  rationale: Ingawa Kiebrania kina vitenzi viwili vya utangulizi wa usemi, kuvirudia kama 'akanena na kusema' kungekuwa kizito na kisicho cha kawaida katika Kiswahili cha sasa; 'akasema' huwasilisha kazi yake ya kisimulizi bila kupoteza maudhui.
- source_word: שִׁמְעוּ
  choice: Sikieni
  rationale: Ni amri ya wingi yenye sauti rasmi ya tangazo la kifalme; 'Sikieni' huhifadhi uzito huo.
- source_word: דְּבַר
  choice: neno
  rationale: דבר hapa ni tamko rasmi la mfalme. 'Neno' huhifadhi lugha halisi na mtindo wa kibiblia, huku 'ujumbe' ukiwa tafsiri pana zaidi.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: mfalme mkuu
  rationale: Hii ni tafsiri ya moja kwa moja inayolingana na cheo cha kifalme cha Kiashuru na ina mtindo rasmi wa Kiswahili.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Hii ni tafsiri wazi na ya kawaida ya muundo wa Kiebrania unaoonyesha mtawala wa Ashuru.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tangazo rasmi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kisimulizi umefanywa wa asili kwa Kiswahili, huku cheo cha kihistoria na umahususi wa lugha ya Yuda vikihifadhiwa.
