  text: הֽוּא הִכָּ֧ה אֶת פְּלִשְׁתִּ֛ים עַד עַזָּ֖ה וְ/אֶת גְּבוּלֶ֑י/הָ מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/008.yaml
  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: sw
  text: Aliwapiga Wafilisti mpaka Gaza na eneo lake[b], kuanzia mnara wa walinzi mpaka mji wenye ngome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kuanzia mnara wa walinzi mpaka mji wenye ngome”; huu ni usemi unaomaanisha kutoka kituo kidogo kabisa cha ulinzi mpaka makazi makubwa kabisa yaliyolindwa.
    reason: cultural_note
  - marker: b
    text: Au “na mipaka yake.” Neno la Kiebrania linaweza kumaanisha mistari ya mipaka au eneo linalomilikiwa na mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Ali-
  rationale: Kiswahili huonyesha nafsi ya mtenda katika kitenzi; kiambishi cha nafsi ya tatu umoja kinawakilisha kiwakilishi cha Kiebrania kwa njia ya kawaida bila kuongeza kiwakilishi huru kisicho cha lazima.
- source_word: הִכָּה
  choice: aliwapiga
  rationale: Neno נכה lina maana ya kupiga na katika muktadha wa kijeshi linaweza kudokeza kuwashinda. 'Aliwapiga' huhifadhi taswira ya kitenzi cha Kiebrania bila kulazimisha maana finyu ya ushindi kamili.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la taifa hili katika Kiswahili cha Biblia.
- source_word: עַד עַזָּה
  choice: mpaka Gaza
  rationale: עַד huonyesha mwisho wa eneo lililofikiwa; 'mpaka Gaza' ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: na eneo lake
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lililo chini ya mji. Katika muktadha huu, 'eneo lake' linaeleza kwa kawaida milki inayohusiana na Gaza huku tanbihi ikihifadhi maana mbadala ya mipaka.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: kuanzia mnara wa walinzi
  rationale: Usemi huu kwa uhalisi ni mnara wa walinzi au waangalizi. 'Mnara wa walinzi' ni wa asili katika Kiswahili na huhifadhi umoja wa Kiebrania.
- source_word: עַד עִיר מִבְצָר
  choice: mpaka mji wenye ngome
  rationale: Usemi huu unaonyesha mji uliolindwa kwa ngome. Pamoja na 'mnara wa walinzi' unaunda tamathali inayoonyesha aina zote za makazi, kutoka kituo kidogo hadi mji mkubwa uliolindwa.
