base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: sw
  text: 'Ndipo Rabshake akawaambia, “Tafadhali mwambieni Hezekia, ‘Mfalme mkuu, mfalme wa Ashuru, anasema hivi: Ni kitu gani hiki unachokitumainia?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabshake
  rationale: Jina la cheo cha afisa wa Ashuru limetoholewa badala ya kutafsiriwa kwa kubahatisha; matumizi haya pia yanadumisha utambulisho wake katika simulizi.
- source_word: בִּטָּחוֹן / בָּטָחְתָּ
  choice: ujasiri / unaoutegemea
  rationale: Nomino inaonyesha hali au msingi wa kujiamini, na kitenzi kinaonyesha kutegemea; tafsiri inadumisha mchezo wa maneno kwa namna ya asili katika Kiswahili bila kulazimisha uradidi usio wa kawaida.
- source_word: כֹּה אָמַר
  choice: anasema hivi
  rationale: Hii ni fomula ya kawaida ya kuwasilisha ujumbe kwa mamlaka, imetolewa kwa Kiswahili cha sasa na chenye hadhi.
- source_word: אִמְרוּ נָא
  choice: Tafadhali mwambieni
  rationale: נָא inaweka ombi au msisitizo wa kiungwana; wingi wa kitenzi umeelekezwa kwa wajumbe, huku ujumbe ukimlenga Hezekia mmoja.
