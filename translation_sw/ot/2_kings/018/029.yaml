base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: sw
  text: 'Mfalme asema hivi: ‘Hezekia asiwadanganye[a], kwa maana hataweza kuwaokoa kutoka mkononi mwake.’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “awapotoshe.” Kitenzi cha Kiebrania kinaweza kumaanisha kupotosha au kudanganya.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kutoka mkononi mwake,” yaani, kutoka katika mamlaka yake. Kifungu sambamba katika Isaya 36:14 kinasema, “kutoka mkononi mwangu.”
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Mfalme asema hivi
  rationale: Huhifadhi mtindo wa tangazo rasmi la kifalme kwa Kiswahili cha sasa na chenye hadhi.
- source_word: אַל יַשִּׁיא לָכֶם חִזְקִיָּהוּ
  choice: Msikubali Hezekia awadanganye
  rationale: Muundo huu wa Kiswahili huwasilisha katazo linalowataka wasiruhusu Hezekia kuwapotosha au kuwahadaa; kitenzi cha Kiebrania kina maana ya kupotosha au kudanganya.
- source_word: כִּי לֹא יוּכַל
  choice: kwa maana hataweza
  rationale: Huonyesha sababu ya katazo na kudumisha dai la kutokuwa na uwezo lenye mwelekeo wa wakati ujao.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: kuwaokoa
  rationale: Katika muktadha wa kijeshi, 'kuwaokoa' huwasilisha tendo la kuwaondoa watu katika hatari au mamlaka ya adui kwa lugha ya kawaida na yenye hadhi.
- source_word: מִיָּדוֹ
  choice: kutoka mkononi mwake
  rationale: Huhifadhi nahau halisi ya Kiebrania kuhusu kuwa chini ya mamlaka ya mtu bila kuibadili kuwa usomaji wa kifungu sambamba.
theological_decisions:
- issue: Mhusika anayerejelewa na kiambishi katika מִיָּדוֹ ('mkono wake')
  choice: kutoka mkononi mwake
  alternative: kutoka mkononi mwangu; kutoka katika mamlaka yake
  rationale: Maandishi ya WLC yana kiambishi cha nafsi ya tatu, umoja, kiume ('wake'), hivyo tafsiri inafuata ushahidi huo badala ya kuoanisha kimya kimya na Isaya 36:14, yenye 'mkono wangu.' Nahau yenyewe imehifadhiwa, na tanbihi inaeleza maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. Mfumo wa tangazo la kifalme umehifadhiwa bila kutumia miundo mizito au ya kizamani. Viambishi vya wingi katika 'Msikubali' na 'awadanganye' vinaonyesha kwamba hotuba inaelekezwa kwa watu wengi.
