  text: מִ֚י בְּ/כָל אֱלֹהֵ֣י הָֽ/אֲרָצ֔וֹת אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: sw
  text: Ni nani miongoni mwa miungu yote ya nchi hizo ambaye ameiokoa nchi yake kutoka mkononi mwangu, hata Yahwe auokoe Yerusalemu kutoka mkononi mwangu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Ni nani kati ya miungu yote ya nchi mbalimbali ambaye ameiokoa nchi yake kutoka mkononi mwangu, kwamba Yahwe ataiokoa Yerusalemu kutoka mkononi mwangu?”'
    reason: Kitenzi cha Kiebrania na kiambishi katika “waliokoa” na “nchi yao” ni vya wingi, ingawa Kiswahili cha umoja wa mgawanyo (“ambaye ... nchi yake”) kinaeleza swali la “Ni nani” kwa ufasaha. כִּי יַצִּיל pia inaweza kutafsiriwa kwa umbo la wakati ujao.
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: Ni nani miongoni mwa miungu yote ya nchi hizo
  rationale: Muundo huu unaonyesha swali la kejeli na maana ya sehemu ndani ya kundi inayobebwa na בְּכָל; ‘nchi hizo’ hurejelea mataifa au maeneo mbalimbali, si dunia yote.
- source_word: אֲשֶׁר הִצִּילוּ אֶת אַרְצָם
  choice: ambaye ameiokoa nchi yake
  rationale: 'Kitenzi נצל kina maana ya kuokoa au kukomboa kutoka hatarini. Ingawa Kiebrania kina kitenzi na kiambishi cha wingi, kauli inaeleweka kwa mgawanyo: ni mungu gani ameokoa nchi inayomhusu. Kiswahili cha umoja kinafuata ‘ni nani’ kwa ufasaha.'
- source_word: מִיָּדִי
  choice: kutoka mkononi mwangu
  rationale: Hudumisha sitiari ya Kiebrania ya mkono kama mamlaka au uwezo wa kumshikilia mtu.
- source_word: כִּי יַצִּיל
  choice: hata ... auokoe
  rationale: 'Katika swali hili la dhihaka, כִּי pamoja na imperfecti huanzisha dai linalopingwa: kwa msingi gani Yahwe angeweza kuokoa? ‘Hata ... auokoe’ huwasilisha nguvu hiyo bila kuifanya ahadi ya moja kwa moja.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mji huo katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya swali la mnenaji kuhusu uwezo wa Yahwe
  choice: hata Yahwe auokoe Yerusalemu
  alternative: ili Yahwe aiokoe Yerusalemu / kwamba Yahwe ataiokoa Yerusalemu
  rationale: Kauli ni dhihaka ya msemaji, si tamko la mwandishi kwamba Yahwe hawezi kuokoa. Umbo la utegemezi ‘auokoe’ huhifadhi changamoto ya balagha na mvutano wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “kutoka mkononi mwangu” yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa dhihaka katika Kiebrania.
