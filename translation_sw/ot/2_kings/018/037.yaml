base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: sw
  text: Ndipo Eliakimu mwana wa Hilkia, aliyekuwa msimamizi wa nyumba, na Shebna, katibu, na Yoa mwana wa Asafu, mtunza kumbukumbu, wakamjia Hezekia, nguo zao zikiwa zimeraruliwa, wakamweleza maneno ya Rabshake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabshake ni cheo cha afisa wa Ashuru, huenda kikimaanisha afisa wa cheo cha juu, kama vile mnyweshaji mkuu au msemaji rasmi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ndipo ... wakamwendea
  rationale: Kiunganishi cha masimulizi kimetafsiriwa kwa “Ndipo,” na kitenzi cha Kiswahili kimewekwa katika wingi kwa sababu kiima kamili ni watu watatu.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: aliyekuwa msimamizi wa nyumba ya mfalme
  rationale: Kirai hiki ni cheo cha afisa aliyesimamia nyumba au utawala wa ikulu; “nyumba ya mfalme” huonyesha mazingira ya kifalme kwa lugha inayoeleweka bila kukibana cheo kuwa kazi moja tu.
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: Neno hili humaanisha mwandishi au katibu rasmi; “mwandishi” linadumisha maana ya msingi na linafaa katika muktadha wa maafisa wa kifalme.
- source_word: הַמַּזְכִּיר
  choice: mtunza kumbukumbu
  rationale: Hiki ni cheo cha afisa mwenye jukumu la kuweka au kuwasilisha kumbukumbu; tafsiri hii ni wazi katika Kiswahili cha sasa.
- source_word: קְרוּעֵי בְגָדִים
  choice: huku nguo zao zikiwa zimeraruliwa
  rationale: Muundo huu unaonyesha hali yao walipofika na kuhifadhi picha halisi ya kurarua nguo kama ishara ya huzuni au mfadhaiko.
- source_word: וַיַּגִּדוּ לוֹ
  choice: wakamweleza
  rationale: “Wakamweleza” ni ya kawaida na wazi kwa taarifa waliyoifikisha kwa Hezekia.
- source_word: דִּבְרֵי
  choice: maneno ya
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania na kuhifadhi kwamba walirudia yaliyosemwa.
- source_word: רַב שָׁקֵה
  choice: Rabshake
  rationale: Cheo cha Kiashuru kimeandikwa kwa kunukuu sauti badala ya kukitafsiri kwa cheo kimoja kisicho na uhakika; maelezo yametolewa katika tanbihi.
