  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maudhui ya Kiebrania: maafisa watatu wanamjia Hezekia wakiwa na nguo zilizoraruliwa na kumweleza maneno ya Rabshake. Hata hivyo, “nyumba ya mfalme” huongeza neno ambalo halipo katika matini, ingawa muktadha wa cheo ni wa kifalme. “Katibu” hueleza kwa usahihi zaidi cheo cha afisa katika muktadha huu kuliko “mwandishi.”'
  naturalness: Mtindo ni wa Kiswahili Sanifu na sentensi inaeleweka. “Wakamjia Hezekia” ni mwafaka na wa moja kwa moja kwa maana ya ‘came to Hezekiah’; “nguo zao zikiwa zimeraruliwa” huhifadhi hali iliyotajwa na matini.
  terminology: Majina Eliakimu, Hilkia, Shebna, Yoa, Asafu, na Hezekia yanafaa. Rabshake lihifadhiwe kama cheo cha Kiashuru kisichobainika kikamilifu; tanbihi ifafanue bila kulazimisha maana moja. “Katibu” kwa הַסֹּפֵר na “mtunza kumbukumbu” kwa הַמַּזְכִּיר zinafaa katika lugha ya sasa.
  issues:
