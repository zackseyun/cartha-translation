    rationale: “Mnyweshaji mkuu” ni usemi wa Kiswahili ulio wazi zaidi, huku ‘huenda’ ikiendelea kuonyesha kutokuwa na uhakika wa maana mahsusi ya cheo.
  revised_text: Ndipo Eliakimu mwana wa Hilkia, aliyekuwa msimamizi wa nyumba, na Shebna, katibu, na Yoa mwana wa Asafu, mtunza kumbukumbu, wakamjia Hezekia, nguo zao zikiwa zimeraruliwa, wakamweleza maneno ya Rabshake[a].
