source:
  edition: WLC
  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: sw
  text: kwa sababu hawakuisikiliza sauti ya Yahwe, Mungu wao[a], bali walikiuka agano lake[b]—yaani, yote ambayo Musa, mtumishi wa Yahwe, aliamuru. Hawakusikiliza wala hawakuyatenda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawakuitii sauti ya Yahwe, Mungu wao.” Usemi wa Kiebrania “kuisikiliza sauti” mara nyingi unahusisha kutii.
    reason: lexical_alternative
  - marker: b
    text: Au “walivunja agano lake.”
    reason: lexical_alternative
  - marker: c
    text: Kurudiwa kwa “hawakusikiliza” kunasisitiza kukataa kwao kwa makusudi na kwa kudumu, si tukio moja tu la kutotii.
    reason: literary_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinaeleza sababu ya uhamisho uliotajwa katika mstari uliotangulia; “kwa sababu” ni ya kawaida na inaonyesha uhusiano huo wazi.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: hawakuisikiliza sauti ya
  rationale: Usemi huu wa Kiebrania unaweza kumaanisha kusikia pamoja na kutii. Kutaja “kuisikiliza sauti” kunahifadhi picha ya asili bila kuficha maana ya utii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  choice: walikiuka agano lake
  rationale: Katika muktadha wa agano, kitenzi kina maana ya kuvunja au kukiuka agano; “walikiuka” ni wazi, cha heshima, na cha sasa katika Kiswahili sanifu.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: yaani, yote ambayo ... aliamuru
  rationale: “Yaani” linaonyesha kwamba yaliyokiukwa katika agano yanafafanuliwa kuwa yote Musa aliyoamuru, huku “yote” likihifadhi upeo kamili wa Kiebrania.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Musa, mtumishi wa Yahwe
  rationale: “Mtumishi” linafaa kwa cheo hiki cha heshima na utume kuliko neno linalosisitiza hali ya utumwa.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: Hawakusikiliza wala hawakutenda
  rationale: Urudiaji na ulinganifu wa vitenzi umehifadhiwa ili kusisitiza kukataa kwao kusikiliza na kutekeleza walichoamriwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Iwapo שׁמע itafsiriwe moja kwa moja kuwa “kutii”
  choice: kuisikiliza sauti
  alternative: kuitii sauti; kumtii
  rationale: Usemi wa Kiebrania unahusisha utii, lakini tafsiri hii inahifadhi taswira ya kusikiliza na urudiaji wa kifungu cha mwisho bila kuondoa upana wake wa maana.
- issue: Uhusiano wa “agano lake” na “yote ambayo Musa ... aliamuru”
  choice: kifungu cha pili kinaeleza yaliyomo katika agano
  alternative: kuyachukulia kama makosa mawili tofauti
  rationale: Muundo wa Kiebrania unaweka “yote ambayo Musa ... aliamuru” kama ufafanuzi wa agano lililokiukwa; “yaani” huonyesha uhusiano huo bila kudai kwamba agano linaishia katika maelezo hayo pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sababu unaendeleza uhusiano na mstari uliotangulia; em dash na “yaani” hufafanua sintaksia nzito ya Kiebrania. Jina “Yahwe” limetumika kwa uthabiti.
