  text: וַֽ/יִּלְכְּדֻ֗/הָ מִ/קְצֵה֙ שָׁלֹ֣שׁ שָׁנִ֔ים בִּ/שְׁנַת שֵׁ֖שׁ לְ/חִזְקִיָּ֑ה הִ֣יא שְׁנַת תֵּ֗שַׁע לְ/הוֹשֵׁ֨עַ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל נִלְכְּדָ֖ה שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: sw
  text: Miaka mitatu ilipokwisha[a], waliuteka. Katika mwaka wa sita wa utawala wa Hezekia—yaani, mwaka wa tisa wa utawala wa Hoshea, mfalme wa Israeli—Samaria ilitekwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya miaka mitatu.” Nahau ya Kiebrania, kwa tafsiri ya karibu zaidi, ni “mwishoni mwa miaka mitatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: waliuteka
  rationale: Kitenzi cha wingi chenye kiambishi cha yambwa cha kike kinarejelea Samaria katika muktadha uliotangulia. Kauli tendi na mfuatano wa simulizi wa Kiebrania vimehifadhiwa.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: Baada ya miaka mitatu kufikia mwisho wake
  rationale: Huwasilisha nahau ya kipindi kinapofikia mwisho wake kwa Kiswahili cha kawaida, bila kuifanya iseme tu wakati fulani usiojulikana baada ya miaka mitatu.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: Katika mwaka wa sita wa utawala wa Hezekia
  rationale: Ni fomula ya mwaka wa kifalme; neno 'utawala' linaweka wazi kwa kawaida kwamba mwaka unahesabiwa tangu kuanza kwa utawala wa Hezekia.
- source_word: הִיא
  choice: yaani
  rationale: Kiwakilishi kinaunganisha tarehe mbili za kifalme kama maelezo yanayolingana; 'yaani' hutoa ulinganisho huo kwa ufupi na kwa ufasaha.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: mwaka wa tisa wa utawala wa Hoshea, mfalme wa Israeli
  rationale: Huhifadhi tarehe ya pili ya kifalme na cheo cha Hoshea kilicho wazi katika Kiebrania.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: Samaria ilitekwa
  rationale: Kauli tendwa ya Kiebrania imehifadhiwa, pamoja na kurudiwa kwa mzizi לכד uliotafsiriwa kwa kitenzi kilekile cha msingi, 'teka'.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo umbo la kawaida la jina la mji huo katika Kiswahili cha Biblia; upatanisho wa ngeli wa jina la mahali unatoa 'ilitekwa'.
theological_decisions: []
