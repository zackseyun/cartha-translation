  terminology: '"Bwana wangu" ni sahihi kwa אדני yenye kiambishi cha nafsi ya kwanza na haipaswi kupewa maana ya kimungu. "Magari ya vita" na "wapanda farasi" ni sahihi. Kwa פחת, "afisa" huepuka kubana maana kuwa mtawala wa eneo pekee au cheo maalumu cha kisasa.'
