  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Swali la kejeli na dharau ya msemaji vimehifadhiwa. Nahau ya Kiebrania ya ‘kuurudisha uso’ imetolewa kwa maana yake ya asili, “kumzuia.”
