base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: sw
  text: Basi, unawezaje kumrudisha nyuma hata afisa mmoja wa watumishi wa cheo cha chini wa bwana wangu[a], huku ukiitegemea Misri kwa magari ya vita na wapanda farasi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “liwali” au “kamanda.” Neno la Kiebrania linaweza kumaanisha mtawala wa eneo au afisa wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: kumzuia
  rationale: Muundo huu wa Kiebrania una maana ya kumrudisha nyuma, kumpinga, au kumzuia adui. Katika Kiswahili cha kawaida, “kumzuia” huwasilisha maana ya kijeshi kwa ufasaha bila kuiga nahau isiyo ya kawaida ya ‘kuurudisha uso.’
- source_word: פַחַת
  choice: liwali
  rationale: Neno hili linaweza kumaanisha mtawala wa eneo au afisa mwenye mamlaka. “Liwali” linafaa kwa cheo cha utawala katika himaya ya Ashuru, huku muktadha ukiweza pia kuhusisha uongozi wa kijeshi.
- source_word: אַחַד
  choice: hata ... mmoja
  rationale: '“Hata ... mmoja” huimarisha kejeli ya swali: Yuda haiwezi kumzuia hata afisa mmoja wa cheo cha chini.'
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: watumishi walio wadogo zaidi wa bwana wangu
  rationale: “Wadogo zaidi” hapa hueleza cheo au umuhimu mdogo, si ukubwa wa mwili; “bwana wangu” ni mkuu wa msemaji, si jina la Mungu.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: huku ukiitegemea Misri ikuandalie
  rationale: Kitenzi בטח pamoja na על humaanisha kutegemea au kuweka tumaini kwa mtu. Kiambishi לְךָ kinaweza kuonyesha manufaa kwa mhusika, hivyo “ikuandalie” huunganisha utegemezi huo na rasilimali zinazofuata.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: magari ya vita na wapanda farasi
  rationale: Hizi ni rasilimali za kijeshi ambazo Yuda ilitarajia kupata kutoka Misri; “magari ya vita” huzuia kuchanganya רֶכֶב na magari ya kawaida ya kisasa.
