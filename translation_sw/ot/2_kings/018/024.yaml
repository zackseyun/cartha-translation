  source_fidelity: 'Maana ya msingi imehifadhiwa vizuri: swali la kejeli, afisa mmoja wa cheo cha chini, na kutegemea Misri kwa magari na wapanda farasi. Hata hivyo, "ikuandalie" huongeza dhana ya Misri kuwaandalia au kuwapatia vifaa, ilhali Kiebrania husema tu kutegemea Misri kuhusiana na magari na wapanda farasi. Pia "kumzuia" ni pana kidogo; "kumrudisha nyuma" hudumisha vyema taswira na maana ya kumzuia/kuwashinda katika muktadha wa kijeshi.'
