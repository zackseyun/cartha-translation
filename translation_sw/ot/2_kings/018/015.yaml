  text: וַ/יִּתֵּן֙ חִזְקִיָּ֔ה אֶת כָּל הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בֵית יְהוָ֑ה וּ/בְ/אֹצְר֖וֹת בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: sw
  text: Basi Hezekia akatoa fedha yote iliyopatikana katika nyumba ya Yahweh[a] na katika hazina za nyumba ya mfalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Yahweh”; kwa neno halisi, “nyumba ya Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au, “jumba la kifalme”; kwa neno halisi, “nyumba ya mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akatoa
  rationale: Katika muktadha wa kulipa ushuru, נתן ina maana ya kutoa au kukabidhi. “Akatoa” ni ya asili katika Kiswahili na haibani maana kuwa malipo rasmi pekee.
- source_word: חִזְקִיָּה
  choice: Hezekia
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: כָּל הַכֶּסֶף
  choice: fedha yote
  rationale: כֶּסֶף kimsingi ni fedha kama madini, lakini pia hutumika kumaanisha mali au pesa. “Fedha yote” huhifadhi neno halisi na linafaa kwa muktadha wa hazina.
- source_word: הַנִּמְצָא
  choice: iliyopatikana
  rationale: Huhifadhi hali tendwa ya kishiriki cha Nifali cha מצא, yaani kile kilichopatikana au kuwapo mahali hapo.
- source_word: בֵית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Tafsiri hii huhifadhi kwa ukaribu usemi wa Kiebrania “nyumba ya Yahweh”; kimuktadha ni hekalu.
- source_word: וּבְאֹצְרוֹת
  choice: na katika hazina
  rationale: אֹצָרוֹת hapa ni mahali pa kuhifadhi mali; “hazina” ni neno la kawaida na linalofaa katika muktadha wa mali ya kifalme.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Huhifadhi usemi halisi wa Kiebrania na ulinganifu wake na “nyumba ya Yahweh,” ingawa kimuktadha inaweza kumaanisha jumba la kifalme.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa “nyumba ... nyumba” umehifadhiwa ili kuonyesha ulinganifu wa maandishi ya Kiebrania.
