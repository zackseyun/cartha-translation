  to: Aliondoa mahali pa juu pa ibada, akazivunja nguzo za ibada, akaikata nguzo ya Ashera,[a] na akaivunja vipande-vipande nyoka wa shaba ambaye Musa alikuwa amemtengeneza; kwa maana mpaka siku zile Waisraeli walikuwa wakiifukizia uvumba. Nayo ikaitwa Nehushtani.[b][c]
  rationale: Tafsiri imerekebishwa ili kufuata wingi wa matini ya Kiebrania, kurekebisha upatanisho wa ngeli wa nyoka, na kuunganisha sababu ya kuharibiwa kwake na kufukiziwa uvumba. Kauli “Nayo ikaitwa” hufuata chaguo la audit trail la kutohitimisha katika tafsiri kuu ni nani hasa aliyetoa jina, huku tanbihi ikitoa uwezekano wa Hezekia kuwa mhusika.
