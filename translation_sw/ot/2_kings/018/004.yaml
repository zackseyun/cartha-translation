  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: sw
  text: Aliondoa mahali pa juu pa ibada, akazivunja nguzo za ibada, akaikata nguzo ya Ashera,[a] na akaivunja vipande-vipande nyoka wa shaba ambaye Musa alikuwa amemtengeneza; kwa maana mpaka siku zile Waisraeli walikuwa wakiifukizia uvumba. Nayo ikaitwa Nehushtani.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaikata Ashera” au “akaikata nguzo takatifu.” Neno la Kiebrania linaweza kumaanisha kitu cha ibada kilichohusishwa na Ashera.
    reason: lexical_alternative
  - marker: b
    text: Jina Nehushtani huenda ni mchezo wa maneno unaohusiana na neno la Kiebrania la “shaba,” labda likimaanisha kitu kama “kipande tu cha shaba.”
    reason: cultural_note
  - marker: c
    text: Au “akamwita Nehushtani.” Kitenzi cha Kiebrania kina mhusika wa umoja wa kiume ambaye hakutajwa wazi katika kishazi hiki; kinaweza kumrejelea Hezekia.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵסִיר אֶת הַבָּמוֹת
  choice: aliondoa mahali pa juu pa ibada
  rationale: “Mahali pa juu” huhifadhi picha ya Kiebrania, huku “pa ibada” ikibainisha kwamba מדובר maeneo ya ibada, si sehemu yoyote iliyoinuka.
- source_word: וְשִׁבַּר אֶת הַמַּצֵּבֹת
  choice: akazivunja nguzo za ibada
  rationale: מַצֵּבוֹת ni mawe au nguzo zilizosimamishwa kwa kusudi la kidini; “nguzo za ibada” ni wazi na ya kawaida kuliko tafsiri ya kijengo tu.
- source_word: וְכָרַת אֶת הָאֲשֵׁרָה
  choice: akaikata nguzo ya Ashera
  rationale: Kitendo cha kukata kinaonyesha kitu halisi cha ibada kilichohusishwa na Ashera. “Nguzo ya Ashera” huwasilisha maana hiyo kwa msomaji wa kawaida bila kuifanya kuwa mti kwa lazima.
- source_word: וְכִתַּת
  choice: na kuuvunja vipandevipande
  rationale: Kitenzi kinaonyesha uharibifu kamili zaidi ya kuvunja tu; “kuvunja vipandevipande” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: nyoka wa shaba
  rationale: Hii ni tafsiri ya kawaida na inayoeleweka ya nyoka aliyetengenezwa kwa shaba, huku ikidumisha uhusiano na simulizi la Musa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Kirai cha Kiebrania kinamaanisha watu wa Israeli kwa ujumla. “Waisraeli” ni Kiswahili asilia na hakidokezi kwamba wanaume pekee ndio waliokuwa wakihusika.
- source_word: מְקַטְּרִים לוֹ
  choice: walikuwa wakiufukizia uvumba
  rationale: Umbo endelevu linaonyesha desturi iliyoendelea hadi wakati huo; kiambishi “-u-” kinarejelea nyoka wa shaba.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: Akauita Nehushtani
  rationale: Kitenzi ni umoja wa nafsi ya tatu ya kiume na kwa kawaida humrejelea Hezekia, mhusika wa matendo ya mstari huu. Tanbihi huhifadhi uwezekano wa usemi usiotaja mtajaji waziwazi.
theological_decisions:
- issue: Maana ya אֲשֵׁרָה katika muktadha wa kitu kinachokatwa
  choice: nguzo ya Ashera
  alternative: Ashera; nguzo takatifu
  rationale: Neno linaweza kuhusishwa na mungu wa kike Ashera au kitu cha ibada kilichomwakilisha. Kwa kuwa kitu hicho kinakatwa, maana ya kifaa cha ibada ndiyo inayotawala, lakini tanbihi huhifadhi upana wa neno.
- issue: Mhusika wa וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: 'Hezekia kama mhusika aliyedokezwa: “Akauita Nehushtani”'
  alternative: “Naye aliitwa Nehushtani” au “watu waliuita Nehushtani”
  rationale: Sarufi ya Kiebrania ina kitenzi cha umoja wa kiume, kinachofaa kumrejelea Hezekia, lakini mhusika hajatajwa tena kwa jina katika kishazi hicho. Tanbihi inaonyesha uwezekano wa tafsiri isiyomtaja moja kwa moja.
- issue: Ibada iliyotolewa kwa nyoka wa shaba
  choice: wakiufukizia uvumba
  alternative: wakiutolea uvumba
  rationale: Tafsiri inasema wazi kuwa uvumba ulielekezwa kwa nyoka huyo, bila kuongeza hukumu ya kidhehebu au maelezo kuhusu asili ya desturi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi vya “aka-” unadumisha kasi ya simulizi. “Mahali pa juu pa ibada,” “nguzo za ibada,” na “nguzo ya Ashera” huepuka istilahi nzito za kitaalamu huku zikieleza mazingira ya kidini ya vitu hivyo.
