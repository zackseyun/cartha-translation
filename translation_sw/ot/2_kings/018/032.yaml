  variant: Standard East African Swahili
source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: sw
  text: mpaka nitakapokuja kuwachukua na kuwapeleka katika nchi iliyo kama nchi yenu, nchi ya nafaka na divai mpya[a], nchi ya mkate na mashamba ya mizabibu, nchi ya mafuta ya zeituni[b] na asali, ili mpate kuishi na msife. Wala msimsikilize Hezekia, kwa maana anawapotosha akisema, “Yahwe atatuokoa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “divai”; neno la Kiebrania תִּירוֹשׁ kwa kawaida humaanisha divai mpya.
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kimebanwa na kinahusisha zeituni na mafuta; tafsiri “mafuta ya zeituni” hutoa maana yake kwa kawaida katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: mpaka nitakapokuja
  rationale: Inaonyesha wakati ujao ambao hadi hapo wasikilizaji wanatakiwa kufuata agizo; ‘kuja’ ni maana ya moja kwa moja na ya kawaida.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: na kuwachukua, niwapeleke
  rationale: Katika muktadha huu לקח ni kuwachukua watu na kuwahamisha; ‘niwapeleke’ huonyesha uhamisho unaokusudiwa bila kuongeza ukali usiotajwa wazi katika kitenzi chenyewe.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: katika nchi iliyo kama nchi yenu
  rationale: Kihusishi כְּ kinaonyesha ulinganisho, si kwamba nchi hizo ni ileile; tafsiri inadumisha mvuto wa hoja ya msemaji.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: nchi ya nafaka na divai mpya
  rationale: דָּגָן ni nafaka kwa ujumla, na תִּירוֹשׁ kwa kawaida ni divai mpya au changa, si lazima divai kwa maana pana.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: nchi ya mikate na mashamba ya mizabibu
  rationale: ‘Mikate’ huhifadhi maana halisi ya לֶחֶם, na ‘mashamba ya mizabibu’ ni Kiswahili cha kawaida kinachoeleweka kwa כְּרָמִים.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: nchi ya mafuta ya zeituni na asali
  rationale: Kirai cha Kiebrania kimebanwa; יִצְהָר humaanisha mafuta mapya, kwa kawaida mafuta ya zeituni. Tafsiri hii hutoa maana ya asili kwa Kiswahili bila kulazimisha muundo usio wa kawaida.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: ili mpate kuishi wala msife
  rationale: Mfuatano huo unaeleza kusudi au matokeo ya kukubali pendekezo; ‘wala’ huunganisha kwa kawaida kauli chanya na hasi katika Kiswahili.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: Wala msimsikilize Hezekia
  rationale: שׁמע אל hapa ni kumsikiliza au kumtii mtu; ‘msimsikilize’ ni ya moja kwa moja na hudumisha taswira ya hotuba.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: kwa maana anawapotosha
  rationale: סות katika Hifili inaweza kumaanisha kushawishi, kuchochea, au kupotosha. ‘Anawapotosha’ inafaa shtaka la msemaji bila kulifanya kwa lazima kuwa udanganyifu wa makusudi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja katika chanzo; ‘Yahwe’ ni umbo la Kiswahili la jina hilo, badala ya kulibadili kuwa cheo.
- source_word: יַצִּילֵנוּ
  choice: atatuokoa
  rationale: נצל katika Hifili humaanisha kuokoa au kukomboa kutoka hatarini; ‘atatuokoa’ ni ya kawaida katika Kiswahili na inafaa muktadha wa tishio la kijeshi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. Umbo la Kiswahili ‘Yahwe’ huhifadhi jina hilo wazi bila kulibadili kuwa ‘BWANA’.
- issue: Shtaka la Rabshake kuhusu maneno ya Hezekia
  choice: anawapotosha
  alternative: anawadanganya
  rationale: Kitenzi cha Kiebrania kinaweza kueleza kushawishi au kupotosha na hakilazimishi hitimisho kwamba Hezekia anadanganya kwa makusudi. Tafsiri iliyochaguliwa inadumisha upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kurudiarudia ‘nchi ya...’ umehifadhiwa kwa sababu ni sehemu ya ushawishi wa hotuba. Alama za tanbihi zimewekwa karibu na maneno yanayohusika, kwa kuwa nafasi zake katika safu ya mashauriano ya Kiingereza hazikulingana na maelezo ya tanbihi.
