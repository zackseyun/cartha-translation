base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: sw
  text: Lakini watu wakaendelea kukaa kimya, wala hawakumjibu hata neno moja[a], kwa maana amri ya mfalme ilikuwa, “Msimjibu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hawakumjibu neno,” nahau yenye maana kwamba hawakutoa jibu lolote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: wakaendelea kukaa kimya
  rationale: Hifili ya חרשׁ hapa inaeleza kuendelea kunyamaza au kujizuia kusema. Usemi huu wa Kiswahili unaonyesha ukimya wao wa makusudi na unaoendelea.
- source_word: הָעָם
  choice: watu
  rationale: עָם kwa kawaida humaanisha watu. Muktadha unaonyesha watu wa Yuda waliokuwa wakisikiliza, bila kuhitaji kuwataja kwa maelezo yasiyomo katika mstari.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: wala hawakumjibu hata neno moja
  rationale: Muundo huu unahifadhi picha ya nahau ya Kiebrania huku “hata neno moja” ikieleweka kwa kawaida katika Kiswahili kuwa hawakutoa jibu lolote.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inaingiza sababu ya watu kukaa kimya. “Kwa maana” hudumisha uhusiano huo wa kisababishi katika usimulizi wa heshima.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: amri ya mfalme
  rationale: מִצְוָה hapa ni agizo lenye mamlaka. “Amri ya mfalme” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הִיא לֵאמֹר
  choice: ilikuwa
  rationale: Kiwakilishi pamoja na kitenzi-jina cha אמר hutanguliza yaliyomo katika nukuu. Kiswahili cha kawaida kinaweza kuyatambulisha moja kwa moja kwa “ilikuwa” kabla ya maneno yaliyonukuliwa.
- source_word: לֹא תַעֲנֻהוּ
  choice: Msimjibu
  rationale: Hii ni katazo linaloelekezwa kwa kundi la watu. “Msimjibu” huhifadhi nafsi ya wingi na kurudia kitenzi cha kujibu kilichotumiwa awali.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa usimulizi wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Wakaendelea kukaa kimya” huonyesha kujizuia kwao kuzungumza, na “hata neno moja” hudumisha nahau ya Kiebrania kwa njia ya asili katika Kiswahili.
