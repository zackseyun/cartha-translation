source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: sw
  text: Basi Hezekia, mfalme wa Yuda, akatuma ujumbe kwa mfalme wa Ashuru huko Lakishi[a], akisema, “Nimekosa. Niondokee. Chochote utakachonitwika[b], nitakibeba.” Ndipo mfalme wa Ashuru akamtoza Hezekia, mfalme wa Yuda, talanta mia tatu za fedha na talanta thelathini za dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, umbo la Kiebrania laweza kuonyesha kwamba ujumbe ulitumwa kuelekea Lakishi; katika muktadha huu yaelekea linaonyesha mahali mfalme wa Ashuru alipokuwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “Chochote utakachoweka juu yangu, nitakibeba.” Kitenzi kinaweza kumaanisha kubeba mzigo uliowekwa juu yake, yaani kuutimiza au kuulipa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma ujumbe
  rationale: Kitenzi kinamaanisha ‘alituma’; katika muktadha huu ujumbe au wajumbe wanaeleweka kutokana na maneno yanayofuata. ‘Akatuma ujumbe’ ni Kiswahili cha kawaida bila kubadili kiini cha tendo.
- source_word: לָכִישָׁה
  choice: huko Lakishi
  rationale: Kiambishi cha mwelekeo kinaweza kumaanisha ‘kwenda Lakishi,’ lakini hapa huenda kinaonyesha mahali mfalme wa Ashuru alipokuwa. Tanbihi inahifadhi uwezekano huo wa kisarufi.
- source_word: חָטָאתִי
  choice: Nimekosa
  rationale: חטא inaweza kueleza kutenda dhambi, kukosea, au kuwa na hatia. Katika kauli hii ya kidiplomasia, ‘Nimekosa’ huhifadhi uzito wa kukiri kosa bila kulazimisha maana kuwa ya kidini tu au ya kisiasa tu.
- source_word: שׁוּב מֵעָלַי
  choice: Niondokee
  rationale: Kauli hii inaomba mfalme wa Ashuru aondoe shinikizo au uvamizi wake. ‘Niondokee’ ni fupi, ya asili, na haiingizi wazi majeshi ambayo hayatajwi moja kwa moja.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: Chochote utakachonitwika
  rationale: Muundo wa Kiebrania una picha ya kuweka mzigo au wajibu juu ya mtu. ‘Utakachonitwika’ huhifadhi picha hiyo na inafaa kwa ushuru unaofuata.
- source_word: אֶשָּׂא
  choice: nitakibeba
  rationale: נשא ni ‘kubeba.’ Tafsiri hii inadumisha picha ya kubeba mzigo huku muktadha ukionyesha kuwa kutimiza au kulipa sharti ndiko kunakokusudiwa.
- source_word: וַיָּשֶׂם ... עַל
  choice: akamtoza
  rationale: Katika muktadha wa fedha na dhahabu, tendo ni kumwekea Hezekia kiwango cha ushuru. ‘Akamtoza’ ni Kiswahili wazi na cha kawaida.
- source_word: כִּכַּר
  choice: talanta
  rationale: ככר ni kipimo cha kale cha uzito kinachotafsiriwa kwa kawaida ‘talanta’; neno hilo limetumika kwa uthabiti katika tafsiri za Biblia za Kiswahili.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Neno linataja metali ya fedha iliyopimwa kwa uzito, si pesa kwa ujumla.
- source_word: זָהָב
  choice: dhahabu
  rationale: Hii ndiyo maana ya moja kwa moja ya neno, nayo hapa inapimwa kwa talanta.
theological_decisions:
- issue: Uzito wa kukiri kwa Hezekia
  choice: Nimekosa
  alternative: Nimetenda dhambi; Nimekukosea
  rationale: ‘Nimekosa’ huhifadhi uwezekano wa kukiri kosa lenye uzito wa kimaadili, lakini pia inafaa kwa kukiri hatia mbele ya mtawala katika mazingira ya kisiasa. Hivyo tafsiri haifuti wala hailazimishi maana ya kidini.
- issue: Kiwango cha ufafanuzi katika lugha ya ushuru
  choice: Chochote utakachonitwika, nitakibeba
  alternative: Ushuru wowote utakaonitoza, nitaulipa
  rationale: Chaguo la kwanza huhifadhi picha na upana wa Kiebrania; sentensi inayofuata inaonyesha wazi kwamba dai lililowekwa lilikuwa la fedha na dhahabu.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka na hadhi inayofaa maandiko. ‘Nimekosa’ huhifadhi utata wa kukiri kosa katika mazingira ya kidiplomasia; ‘kun twika/kubeba’ huhifadhi sitiari ya Kiebrania. Majina yametolewa kwa maumbo yaliyozoeleka: Hezekia, Yuda, Ashuru, na Lakishi.'
