base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: sw
  text: Katika mwaka wa kumi na nne wa utawala wa Mfalme Hezekia, Senakeribu mfalme wa Ashuru aliishambulia miji yote ya Yuda yenye ngome, akaiteka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּה
  choice: Katika mwaka wa kumi na nne wa utawala wa Mfalme Hezekia
  rationale: Hii ni fomula ya kutaja mwaka wa utawala wa mfalme. Neno “utawala” linaifanya sentensi iwe wazi na ya kawaida katika Kiswahili bila kuongeza wazo jipya.
- source_word: עָלָה ... עַל
  choice: aliishambulia
  rationale: Katika muktadha wa kijeshi, kitenzi hiki pamoja na kihusishi kina maana ya kusonga dhidi ya mahali au kulishambulia. “Aliishambulia” ni Kiswahili cha kawaida na chenye maana wazi hapa.
- source_word: סַנְחֵרִיב
  choice: Senakeribu
  rationale: Hili ni umbo la jina linalofaa matamshi na tahajia ya Kiswahili.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Muundo huu unamtambulisha Senakeribu kwa cheo chake na milki aliyotawala.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: miji yote ya Yuda yenye ngome
  rationale: הַבְּצֻרוֹת inaeleza miji iliyolindwa kwa ngome. “Yenye ngome” ni usemi wa kawaida na unaoeleweka kwa wasomaji wa Kiswahili.
- source_word: וַיִּתְפְּשֵׂם
  choice: akaiteka
  rationale: Kitenzi kinaonyesha kuitwaa miji kwa ushindi wa kijeshi. Kiambishi “-i-” kinarejelea miji, na “aka-” kinaonyesha tendo lililofuata shambulio hilo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo wa simulizi umehifadhi mfuatano wa shambulio na kutekwa kwa miji bila kuongeza kiunganishi cha mwanzo kisichohitajika.
