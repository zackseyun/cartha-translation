  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט יֵ֥שׁ אוֹת֖/וֹ דְּבַר יְהוָ֑ה וַ/יֵּרְד֣וּ אֵלָ֗י/ו מֶ֧לֶךְ יִשְׂרָאֵ֛ל וִ/יהוֹשָׁפָ֖ט וּ/מֶ֥לֶךְ אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: sw
  text: Yehoshafati akasema[a], “Neno la Yahwe liko kwake.” Basi mfalme wa Israeli, Yehoshafati, na mfalme wa Edomu wakashuka kumwendea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ana neno kutoka kwa Yahwe.”
    reason: Njia nyingine halali ya kueleza muundo יֵשׁ אֹתוֹ pamoja na דְּבַר יְהוָה, ambao unaweza kuonyesha kwamba Elisha ana ujumbe kutoka kwa Yahwe.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni kitenzi cha kawaida cha usimulizi kinachoanzisha maneno ya moja kwa moja; ‘akasema’ kinaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: יֵשׁ אֹתוֹ
  choice: liko kwake
  rationale: Muundo huu wa Kiebrania huonyesha kuwapo pamoja na mtu au kuwa kwake. ‘Liko kwake’ huhifadhi wazo kwamba neno la kiunabii linapatikana kupitia Elisha bila kulifafanua kupita kiasi kuwa mali yake.
- source_word: דְּבַר יְהוָה
  choice: Neno la Yahwe
  rationale: Huhifadhi usemi wa kiunabii uliozoeleka na maana ya ujumbe au ufunuo unaotoka kwa Yahwe. Uwezekano wa kutafsiri ‘neno kutoka kwa Yahwe’ umewekwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיֵּרְדוּ
  choice: wakashuka
  rationale: Huhifadhi wazi maana ya mwendo wa kuelekea chini, iwe ni kwa sababu ya jiografia au mahali alipokuwa nabii.
- source_word: אֵלָיו
  choice: kwenda kwake
  rationale: Huonyesha kwamba hao wafalme walielekea mahali alipokuwa Elisha; pamoja na ‘wakashuka’ inatoa kwa kawaida maana ya ‘walishuka kumwendea.’
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Cheo rasmi na jina la taifa vimetolewa kwa muundo wa kawaida wa Kiswahili.
- source_word: וִיהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina la mtu limetolewa kwa umbo linalotambulika na linalofaa muundo wa sauti wa Kiswahili.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: na mfalme wa Edomu
  rationale: Huhifadhi cheo rasmi na muundo sambamba wa orodha ya wafalme watatu.
theological_decisions:
- issue: Uhusiano wa usemi דְּבַר יְהוָה na Elisha
  choice: “Neno la Yahwe liko kwake”
  alternative: “Ana neno kutoka kwa Yahwe”
  rationale: 'Tafsiri kuu inadumisha usemi wenyewe na mvutano wake: neno la kiunabii liko pamoja na Elisha na linapatikana kupitia kwake, bila kuamua kwamba tayari ana ujumbe maalumu mkononi. Tanbihi inahifadhi uwezekano wa maana ya umilikaji au kupokea ujumbe.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa simulizi umetolewa kwa vitenzi vya mfululizo ‘akasema’ na ‘wakashuka’; majina yametolewa kama Yehoshafati, Israeli, Edomu, na Yahwe.
