base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: sw
  text: Alifanya yaliyo maovu machoni pa Yahweh, lakini[a] si kama baba yake na mama yake; naye akaiondoa nguzo ya Baali[b] ambayo baba yake alikuwa ameifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “ila si kama baba yake na mama yake.” Neno la Kiebrania linaweka mpaka katika hukumu hiyo: alifanya maovu, lakini si kwa namna au kiwango kilekile kama baba yake na mama yake.'
    reason: lexical_alternative
  - marker: b
    text: Au, “nguzo takatifu ya Baali” au “jiwe lililosimamishwa la Baali.” Neno la Kiebrania linamaanisha nguzo au jiwe lililosimamishwa lililohusishwa na ibada ya Baali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Alitenda yaliyo maovu
  rationale: Nahau hii ya Kiebrania ina maana ya kutenda yaliyo maovu. Tafsiri hii ni ya kawaida na inahifadhi hukumu ya kimaadili ya kifungu.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kwa kadiri ya tathmini ya Yahweh; tafsiri hii inahifadhi pia taswira ya matini ya chanzo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama Yahweh badala ya kubadilishwa kuwa cheo.
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  choice: lakini si kama baba yake na mama yake
  rationale: 'רַק linaweka mpaka au sifa katika hukumu iliyotangulia: alifanya maovu, lakini si kwa namna au kiwango kilekile kama wazazi wake.'
- source_word: וַיָּסַר
  choice: kwa maana aliiondoa
  rationale: Kitenzi kinamaanisha kuondoa. 'Kwa maana' kinaonyesha uhusiano wa maelezo unaodokezwa katika muktadha, huku 'aliiondoa' kikitafsiri tendo lenyewe moja kwa moja.
- source_word: מַצְּבַת הַבַּעַל
  choice: nguzo ya Baali
  rationale: מַצֵּבָה ni jiwe lililosimamishwa au nguzo ya kiibada. 'Nguzo' ni fupi na sahihi, na uhusiano wake na ibada unaelezwa katika tanbihi.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: ambayo baba yake alikuwa ameitengeneza
  rationale: Muundo huu unaonyesha kuwa baba yake alitengeneza nguzo hiyo kabla ya kuondolewa; wakati timilifu uliopita unaonyesha mpangilio huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina binafsi la Mungu, si cheo. 'Yahweh' linahifadhi jina hilo kwa kulitohowa badala ya kulibadilisha kuwa 'BWANA'.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “machoni pa” unahifadhi nahau ya Kiebrania bila kuwa mgumu. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika: [a] kwa sifa inayoletwa na רַק, na [b] kwa maana ya מַצֵּבָה.'
