  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: sw
  text: Basi siku hiyo Mfalme Yehoramu aliondoka kutoka Samaria, akawakusanya Waisraeli wote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawahesabu Waisraeli wote” au “akawakagua Waisraeli wote.” Kitenzi cha Kiebrania kinaweza kumaanisha kuhesabu watu au kufanya ukaguzi wa kijeshi; hapa muktadha unapendelea maana ya kuwakusanya kwa ajili ya vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: aliondoka
  rationale: Kitenzi יצא katika simulizi kina maana ya kutoka au kuondoka. “Aliondoka” ni Kiswahili cha kawaida kinachoonyesha kuanza safari kutoka Samaria bila kuongeza maana ya kijeshi ambayo inaelezwa na kitenzi kinachofuata.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: Mfalme Yehoramu
  rationale: Muundo huu ni wa kawaida na wenye heshima katika Kiswahili, huku jina la Kiebrania likinakiliwa kama Yehoramu.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hutoa kwa kawaida maana ya moja kwa moja ya “katika siku hiyo” katika muktadha wa simulizi.
- source_word: מִשֹּׁמְרוֹן
  choice: Samaria
  rationale: Pamoja na kitenzi “aliondoka,” jina hili linaonyesha mahali alikotoka; Kiswahili cha kawaida hakihitaji kurudia kihusishi “kutoka,” ingawa “aliondoka kutoka Samaria” pia lingewezekana.
- source_word: וַיִּפְקֹד
  choice: akawakusanya
  rationale: Katika muktadha wa kampeni ya kijeshi, פקד inaelekea kumaanisha kuwakusanya na kuwapanga watu kwa ajili ya vita. “Akawakusanya” ni wazi kwa msomaji wa kawaida, huku tanbihi ikihifadhi uwezekano wa kuhesabu au kukagua.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Hurejelea kwa ujumla watu au majeshi ya ufalme wa Israeli. “Israeli wote” huhifadhi usemi wa pamoja wa Kiebrania bila kuupanua kuwa kundi lililofafanuliwa zaidi.
