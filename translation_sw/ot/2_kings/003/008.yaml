  text: Akasema, “Tutapanda kwa njia gani?” Akasema, “Kwa njia ya nyika ya Edomu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema / Naye akasema
  rationale: Kauli ya wakati uliopita yenye kuendeleza simulizi inaakisiwa kwa umbo la Kiswahili lenye kiambishi -ka-. Katika mara ya pili, “naye” huonyesha kwa kawaida kwamba msemaji mwingine anajibu bila kutaja mhusika ambaye Kiebrania hakumtaji hapa.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: kwa njia gani
  rationale: Muundo huu wa kuuliza unamaanisha kwa kawaida kuchagua njia au mkondo fulani; “kwa njia gani” ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: נַעֲלֶה
  choice: tutapanda
  rationale: Kitenzi עלה humaanisha kwenda au kupanda juu na katika muktadha huu kinaweza pia kurejelea safari ya kijeshi. “Tutapanda” huhifadhi picha ya kitenzi bila kuongeza wazi wazo la kuandamana kijeshi.
- source_word: דֶּרֶךְ
  choice: njia
  rationale: “Njia” ni tafsiri ya kawaida na pana, inayofaa katika swali na katika jibu.
- source_word: מִדְבַּר
  choice: nyika
  rationale: “Nyika” huonyesha eneo kame na lisilokaliwa sana bila kulazimisha maana ya jangwa la mchanga.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: “Edomu” ni umbo la jina la mahali lililozoeleka katika Kiswahili cha Biblia.
