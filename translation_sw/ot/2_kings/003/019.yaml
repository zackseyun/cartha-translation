base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: sw
  text: Nanyi mtashambulia kila mji wenye ngome na kila mji bora[a]; mtaangusha kila mti mzuri, mtaziba chemchemi zote za maji, na mtaharibu kila shamba zuri kwa mawe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mji uliochaguliwa,” au “kila mji ulio bora zaidi.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “mtaliumiza kwa mawe”; usemi wa Kiebrania unaelekea kumaanisha kuharibu ardhi ya kilimo kwa kuitapakazia mawe.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: mtashambulia
  rationale: Katika muktadha wa vita, kitenzi hiki kina maana ya kupiga au kushambulia. “Mtashambulia” ni Kiswahili cha kawaida kinachoeleza tendo dhidi ya miji bila kuongeza wazo la kuiteka.
- source_word: עִיר מִבְצָר
  choice: mji wenye ngome
  rationale: מִבְצָר hueleza mahali palipoimarishwa kwa ulinzi; “mji wenye ngome” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: עִיר מִבְחוֹר
  choice: mji bora
  rationale: מִבְחוֹר humaanisha kitu kilichochaguliwa, kilicho bora, au cha thamani. “Mji bora” ni fupi na ya asili, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: תַּפִּילוּ
  choice: mtaangusha
  rationale: Hifili ya נפל hapa ni kusababisha miti ianguke. “Mtaangusha” huhifadhi taswira ya Kiebrania bila kulazimisha kuwa miti hiyo lazima ikatwe kwa njia fulani.
- source_word: כָּל עֵץ טוֹב
  choice: kila mti mzuri
  rationale: טוֹב ni “mzuri” kwa maana pana; huenda ikihusu miti yenye thamani au yenye mazao, lakini tafsiri hii haiibani maana hiyo.
- source_word: מַעְיְנֵי מַיִם
  choice: chemchemi zote za maji
  rationale: Kirai hiki kinataja vyanzo vya asili vya maji. “Chemchemi za maji” ni wazi na cha kawaida katika Kiswahili.
- source_word: תִּסְתֹּמוּ
  choice: mtaziba
  rationale: Kitenzi humaanisha kufunga au kuziba, hasa kisima au chemchemi; “mtaziba” linafaa moja kwa moja katika muktadha huu.
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: kila shamba zuri
  rationale: חֶלְקָה ni sehemu au kipande cha ardhi, mara nyingi shamba. “Shamba” ni neno la kawaida na linafaa kwa ardhi inayoweza kuharibiwa kwa mawe.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: kuharibu kwa mawe
  rationale: Muundo wa Kiebrania ni usio wa kawaida na kwa neno moja ni kama “kufanya liumie kwa mawe.” Katika muktadha, tendo ni kuharibu ardhi ya kilimo kwa kuitapakazia mawe; “kuharibu kwa mawe” huwasilisha athari bila kuficha taswira ya mawe.
