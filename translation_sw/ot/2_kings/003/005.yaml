  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: sw
  text: Ikawa Ahabu alipokufa,[a] mfalme wa Moabu alimwasi mfalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri rasmi zaidi, “baada ya kufa kwa Ahabu.” Usemi wa wakati katika Kiebrania unaweza kutafsiriwa kwa njia zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha tukio linalofuata katika masimulizi; “Ikawa” ni mpito wa kisimulizi wenye hadhi na unaoeleweka katika Kiswahili cha Biblia.
- source_word: כְּמוֹת
  choice: alipokufa
  rationale: Muundo wa כ pamoja na kitenzi-jina cha מות una maana ya wakati, yaani “alipokufa” au “baada ya kufa.” Chaguo hili ni la asili na halifafanui zaidi ya Kiebrania.
- source_word: אַחְאָב
  choice: Ahabu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וַיִּפְשַׁע
  choice: alimwasi
  rationale: Katika muktadha huu wa kisiasa, פשע humaanisha kuasi mamlaka ya mtawala mkuu; “alimwasi” huonyesha wazi kitendo na yule aliyeasiwa.
- source_word: מֶלֶךְ מוֹאָב
  choice: mfalme wa Moabu
  rationale: Muundo tegemezi umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Pamoja na פשע, kihusishi ב humtaja yule ambaye uasi unaelekezwa kwake; kiambishi “-mw-” katika “alimwasi” tayari hubeba maana ya “dhidi ya,” hivyo huepuka uradidi usio wa asili.
