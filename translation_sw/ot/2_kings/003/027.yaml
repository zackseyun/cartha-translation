base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: sw
  text: Ndipo akamchukua mwanawe mzaliwa wa kwanza, ambaye angetawala mahali pake, akamtoa kuwa sadaka ya kuteketezwa juu ya ukuta. Kukawa na ghadhabu kubwa dhidi ya Israeli[a]; basi wakaondoka kwake na kurudi katika nchi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakisemi ghadhabu hii ilikuwa ya nani. Wengine huielewa kuwa ghadhabu ya Mungu, hasira kali ya Wamoabu dhidi ya Israeli, au kuvunjika moyo na hofu iliyowapata Waisraeli baada ya dhabihu hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: mwanawe mzaliwa wa kwanza
  rationale: Neno בְּכוֹר humaanisha mzaliwa wa kwanza, si mwana aliye mkubwa kwa umri tu; pia linaonyesha umuhimu wake katika urithi na urithi wa kiti cha enzi.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: ambaye angetawala mahali pake
  rationale: Kauli hii inamtambulisha mwana kuwa mrithi aliyekusudiwa wa kiti cha enzi, huku “mahali pake” ikihifadhi maana ya תַּחְתָּיו.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: akamtoa kuwa sadaka ya kuteketezwa
  rationale: Hii ni lugha ya dhabihu. Tafsiri hii inaeleza wazi kwamba alimtoa mwanawe kama sadaka ya kuteketezwa bila kupunguza uzito wa tendo hilo.
- source_word: עַל הַחֹמָה
  choice: juu ya ukuta
  rationale: Kirai kinarejelea ukuta wa mji; “juu ya ukuta” ni cha moja kwa moja na hakiongezi neno lisilokuwamo wazi katika Kiebrania.
- source_word: קֶצֶף גָּדוֹל
  choice: ghadhabu kubwa
  rationale: קֶצֶף huonyesha ghadhabu au hasira kali. “Ghadhabu kubwa” inadumisha uzito wa usemi na kutotajwa kwa mwenye ghadhabu hiyo.
- source_word: עַל יִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Pamoja na קֶצֶף, kihusishi עַל kinaonyesha kwamba ghadhabu ilielekezwa dhidi ya Israeli.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: wakaondoka kwake
  rationale: Katika muktadha wa kijeshi, נסע huweza kumaanisha kuvunja kambi na kuondoka. Tafsiri hii inaonyesha kwamba majeshi yaliacha kumshambulia bila kuongeza maelezo yasiyotajwa.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: kurudi katika nchi yao
  rationale: Muktadha unaonyesha majeshi ya muungano yalirudi katika nchi yao; umilikishi huu unaeleweka kutokana na muktadha na ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana na chanzo cha “ghadhabu kubwa dhidi ya Israeli”
  choice: 'Kudumisha usemi usiofafanua chanzo chake: “ghadhabu kubwa dhidi ya Israeli.”'
  alternative: Kuitaja kuwa ghadhabu ya Mungu, hasira ya Wamoabu, au kuvunjika moyo na hofu kwa Israeli.
  rationale: Kiebrania hakimtaji mwenye ghadhabu hiyo. Kwa hiyo, tafsiri kuu haichagui kati ya maelezo yanayobishaniwa, bali inadumisha utata na mvutano wa kifungu cha asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Lugha ya dhabihu imehifadhiwa wazi, na utata wa kitheolojia wa קֶצֶף גָּדוֹל haujaondolewa.
