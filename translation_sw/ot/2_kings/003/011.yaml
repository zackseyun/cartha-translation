base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: sw
  text: Yehoshafati akasema[a], “Je, hapa hakuna nabii wa Yahwe, ili tumwulize Yahwe kupitia kwake?” Ndipo mmoja wa watumishi wa mfalme wa Israeli akajibu, “Elisha mwana wa Shafati yuko hapa[b], ambaye alikuwa akimimina maji juu ya mikono ya Eliya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “ili tumtafute Yahwe kupitia kwake.” Maana yake ni kumwuliza Yahwe kwa njia ya nabii huyo.'
    reason: lexical_alternative
  - marker: b
    text: Maneno haya huenda yanaeleza huduma binafsi ya Elisha kwa Eliya, huku yakihifadhi picha ya Kiebrania ya kumimina maji kwa ajili ya kunawa mikono.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: Je, hapa hakuna
  rationale: Huleta swali lenye ukanushi kwa Kiswahili cha kawaida huku likihifadhi msisitizo wa swali la Yehoshafati.
- source_word: נָבִיא לַיהוָה
  choice: nabii wa Yahwe
  rationale: Kiambishi ל kinaonyesha uhusiano; ‘nabii wa Yahwe’ ni usemi wa kawaida na wenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa umbo la kawaida la Kiswahili.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: ili tumwulize Yahwe kupitia kwake
  rationale: דרשׁ hapa ni kutafuta jibu au mwongozo kutoka kwa Yahwe, na מֵאֹתוֹ humtaja nabii kuwa njia ya kuulizia.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: mmoja wa watumishi wa mfalme wa Israeli
  rationale: Katika mazingira ya kifalme עֶבֶד humaanisha mtumishi au mhudumu wa mfalme, si lazima mtumwa.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: ambaye alikuwa akimiminia Eliya maji mikononi
  rationale: Inahifadhi picha halisi ya Kiebrania na kuonyesha huduma ya kawaida ya Elisha kwa Eliya bila kuibadili kuwa maelezo pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina maalumu la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Namna ya kumwuliza Yahwe kwa njia ya nabii
  choice: tumwulize Yahwe kupitia kwake
  alternative: tumtafute Yahwe kwake
  rationale: Uchaguzi huu unaonyesha kwamba swali linaelekezwa kwa Yahwe huku nabii akiwa njia ya kupata jibu, bila kumpa nabii nafasi ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kama Yehoshafati, Shafati, Elisha na Eliya; muundo wa simulizi umetafsiriwa kwa mtiririko wa kawaida wa Kiswahili.
