  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: sw
  text: Hata hivyo, alishikamana na dhambi za Yeroboamu mwana wa Nebati, ambazo kwazo aliwafanya Waisraeli watende dhambi; hakuziacha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno linaweka kizuizi dhidi ya tathmini chanya iliyotangulia; “Lakini” ni ya kawaida na wazi katika simulizi la Kiswahili.
- source_word: בְּחַטֹּאות
  choice: na dhambi
  rationale: Pamoja na kitenzi דבק, “alishikamana na dhambi” huonyesha kuendelea kuzifuata, si mahali alikokuwa.
- source_word: חַטֹּאות
  choice: dhambi
  rationale: Hudumisha hukumu ya kimaadili na kidini ya Kiebrania bila kuibana kuwa sera au desturi pekee.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametolewa kwa tahajia inayotambulika katika Kiswahili, huku mfumo wa utambulisho wa baba ukihifadhiwa.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambazo kwa hizo aliwasababisha Israeli kutenda dhambi
  rationale: Kauli ya kusababisha katika הֶחֱטִיא imehifadhiwa wazi, na kishazi kimehusishwa na dhambi zilizotajwa kama njia ambayo Yeroboamu aliingiza Israeli katika dhambi.
- source_word: דָּבֵק
  choice: alishikamana
  rationale: Huonyesha kufungamana kwa nguvu na kuendelea katika mwenendo huo.
- source_word: לֹא סָר
  choice: hakuziacha
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba hakugeuka wala kuacha mwenendo huo.
- source_word: מִמֶּנָּה
  choice: -ziacha
  rationale: Kiambishi cha wingi kinarejelea dhambi kwa kawaida katika Kiswahili, ingawa kiambishi cha Kiebrania ni cha umoja wa kike.
theological_decisions:
- issue: Mfumo wa tathmini ya kifalme kuhusu uasi
  choice: Kuhifadhi maneno ya wazi “dhambi” na “aliwasababisha Israeli kutenda dhambi.”
  alternative: Kutumia maneno yasiyo makali kama “matendo” au “makosa.”
  rationale: Kiebrania chenyewe kinatoa hukumu ya kimaadili na kidini; tafsiri haipaswi kuigeuza kuwa maelezo ya kisiasa au ya ibada yasiyo na hukumu hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umehifadhi msisitizo wa kushikamana na dhambi na kauli ya kusababisha.
