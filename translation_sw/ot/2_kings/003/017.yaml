source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: sw
  text: 'Kwa maana Yahweh asema hivi: “Hamtaona upepo, wala hamtaona mvua, lakini mkondo huo wa maji wa msimu[a] utajaa maji. Ninyi, mifugo yenu na wanyama wenu mtakunywa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bonde hilo” au “njia hiyo ya maji.” Neno la Kiebrania נחל mara nyingi humaanisha bonde au mkondo wa maji wa msimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי כֹה אָמַר
  choice: Kwa maana Yahweh asema hivi
  rationale: Muundo huu huhalalisha kauli inayotangulia na kuingiza tamko la Mungu; “Kwa maana ... asema hivi” ni wa asili na wenye hadhi katika Kiswahili.
- source_word: לֹא תִרְאוּ רוּחַ וְלֹא תִרְאוּ גֶשֶׁם
  choice: Hamtaona upepo, wala hamtaona mvua
  rationale: Vitenzi vya hali isiyotimilika vinaeleza yatakayotokea, na kurudia “hamtaona” kunahifadhi ulinganifu na msisitizo wa Kiebrania. Katika muktadha wa hali ya hewa, רוּחַ ni “upepo.”
- source_word: הַנַּחַל הַהוּא
  choice: bonde hilo la mto mkavu
  rationale: נחל katika mazingira haya inaweza kumaanisha bonde au njia ya maji inayokauka wakati fulani. Kauli hii inaeleweka kwa wasomaji wa Kiswahili kuliko neno la mkopo “wadi,” huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: יִמָּלֵא מָיִם
  choice: litajaa maji
  rationale: Kauli hii huonyesha hali itakayotokea—bonde hilo litakuwa limejaa maji—kwa Kiswahili cha kawaida bila kulazimisha kutaja kisababishi.
- source_word: וּשְׁתִיתֶם
  choice: mtakunywa
  rationale: Wakati ujao unafaa katika mfuatano wa ahadi hii.
- source_word: מִקְנֵיכֶם וּבְהֶמְתְּכֶם
  choice: mifugo yenu na wanyama wenu
  rationale: 'Tafsiri hii inadumisha maneno mawili tofauti ya Kiebrania: la kwanza linahusu wanyama wanaomilikiwa kama mifugo, na la pili wanyama kwa maana pana zaidi.'
theological_decisions:
- issue: Kutafsiri jina la Mungu YHWH
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi יְהוָה. Kulitoholea kama “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Chanzo kisichoonekana cha maji
  choice: lakini bonde hilo la mto mkavu litajaa maji
  alternative: kwa hiyo bonde hilo litajaa maji
  rationale: Kiunganishi kimetafsiriwa kwa utofautishaji wa kawaida bila kueleza jinsi maji yatakavyofika; hivyo fumbo na msisitizo wa tendo la Mungu vinabaki bila kuongezewa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Bonde la mto mkavu” limetumiwa badala ya neno la mkopo “wadi” ili maana ieleweke kwa urahisi. Marudio ya “hamtaona” yanahifadhi msisitizo wa chanzo cha Kiebrania.
