  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: sw
  text: Mfalme wa Moabu alipoona kwamba vita vilikuwa vimemzidi, akachukua pamoja naye wanaume mia saba waliokuwa wamechomoa panga, ili wapenye hadi kwa mfalme wa Edomu[a], lakini hawakuweza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya mfalme wa Edomu.” Kihusishi cha Kiebrania kinaweza kueleweka kuwa cha mwelekeo (“hadi kwa”) au cha uhasama (“dhidi ya”) katika muktadha huu wa kijeshi.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: vita vilikuwa vimemzidi
  rationale: Huwasilisha kwa Kiswahili cha kawaida hali ya vita kuwa na nguvu kuliko mfalme na kumlemea, bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: אֹתוֹ
  choice: pamoja naye
  rationale: Katika muktadha huu, kishirikishi hiki kinaonyesha kwamba mfalme aliwachukua watu hao waende naye; tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: wanaume mia saba
  rationale: אִישׁ ni nomino ya kuhesabia watu wa kiume katika kikosi hiki; “wanaume” ni ya moja kwa moja kuliko “wanajeshi,” ambalo lingeongeza ufafanuzi.
- source_word: שֹׁלֵף חֶרֶב
  choice: wenye kufuta upanga
  rationale: Nahau “kufuta upanga” huhifadhi taswira ya Kiebrania ya kuuchomoa upanga na hutambulisha wapiganaji walio tayari kwa vita.
- source_word: לְהַבְקִיעַ
  choice: ili wapenye
  rationale: Kitenzi hiki katika Hiphil kinaeleza kuvunja au kupenya safu za adui; “wapenye” ni fupi, ya kijeshi, na ya kawaida katika Kiswahili.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: kuelekea kwa mfalme wa Edomu
  rationale: אֶל inaweza kumaanisha kuelekea kwa au dhidi ya. “Kuelekea kwa” hudumisha maana ya mwelekeo katika matini kuu bila kuondoa uwezekano wa maana ya uhasama.
- source_word: וְלֹא יָכֹלוּ
  choice: lakini hawakuweza
  rationale: Huhifadhi wingi wa kitenzi, unaomhusisha mfalme pamoja na watu wake, na kutaja wazi kushindwa kwa jaribio hilo bila kufafanua kupita kiasi.
theological_decisions:
- issue: Mwelekeo au uhasama katika אֶל מֶלֶךְ אֱדוֹם
  choice: kuelekea kwa mfalme wa Edomu
  alternative: dhidi ya mfalme wa Edomu
  rationale: Kihusishi אֶל kinaweza kueleweka kwa maana ya mwelekeo au uhasama katika muktadha wa kijeshi. Matini kuu inadumisha maana pana ya mwelekeo, huku tanbihi ikihifadhi usomaji wa uhasama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa masimulizi ya Biblia lakini unasomeka kwa urahisi; “kufuta upanga” huhifadhi nahau ya kijeshi, na tanbihi huhifadhi utata halisi wa kihusishi cha Kiebrania.
