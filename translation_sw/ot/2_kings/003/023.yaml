  text: וַ/יֹּֽאמְרוּ֙ דָּ֣ם זֶ֔ה הָחֳרֵ֤ב נֶֽחֶרְבוּ֙ הַ/מְּלָכִ֔ים וַ/יַּכּ֖וּ אִ֣ישׁ אֶת רֵעֵ֑/הוּ וְ/עַתָּ֥ה לַ/שָּׁלָ֖ל מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: sw
  text: Wakasema, “Hii ni damu! Bila shaka wafalme wameangamizana[a], kila mmoja akampiga mwenzake. Sasa basi, Moabu[b], twende tukachukue nyara!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafalme wameangamizwa kabisa.” Kiebrania kinatumia muundo wa msisitizo wa kitenzi chenye maana ya ‘kuangamizwa’ au ‘kuharibiwa’; katika muktadha, Wamoabu walidhani wafalme walikuwa wamegeukiana.
    reason: lexical_alternative
  - marker: b
    text: Au, “Enyi Wamoabu, twendeni tukachukue nyara!”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: Hii ni damu!
  rationale: Ni kishangao kisicho na kitenzi katika Kiebrania. Tafsiri hii inadumisha nguvu ya kiashiria זֶה na inasikika kwa kawaida katika Kiswahili.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: bila shaka ... wameangamizana
  rationale: Muundo wa kitenzi-jina na kitenzi cha mzizi חרב unasisitiza uharibifu mkubwa. Muktadha pamoja na sentensi inayofuata unaonyesha kwamba Wamoabu walidhani wafalme walikuwa wamegeukiana; umbo la kutendeana ‘wameangamizana’ linawasilisha hitimisho hilo huku tanbihi ikihifadhi uwezekano wa tafsiri ya kutendwa.
- source_word: הַמְּלָכִים
  choice: wafalme
  rationale: Ni wingi wenye uainisho unaowarejelea watawala wa muungano waliotajwa awali; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: kila mmoja akampiga mwenzake
  rationale: Nahau אִישׁ אֶת־רֵעֵהוּ huonyesha tendo la kutendeana. Tafsiri hii inadumisha picha halisi ya kila mmoja kumpiga mwenzake bila kulazimisha kwamba kitenzi וַיַּכּוּ chenyewe lazima kimaanishe kuua.
- source_word: וְעַתָּה
  choice: Sasa basi
  rationale: Inaonyesha mpito wa haraka na wenye msisimko kutoka katika walichodhani wameona hadi mwito wa kuchukua hatua.
- source_word: לַשָּׁלָל
  choice: twende tukachukue nyara
  rationale: Ni mwito wa kivita wa kuelekea kupora mali. Kiswahili hiki cha kawaida kinawasilisha mwendo unaodokezwa na ל pamoja na kusudi la kutwaa nyara.
- source_word: מוֹאָב
  choice: Moabu
  rationale: Jina la taifa limetumiwa kama mwito. ‘Moabu’ linahifadhi namna ya Kiebrania, huku alama za uandishi zikionyesha kwamba taifa linaambiwa moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Usemi wa moja kwa moja una kasi ya mshangao na mwito wa kivita; ‘akampiga’ huepuka kufafanua kupita kiasi ikiwa pigo lenyewe lilikuwa la kuua.
