base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: sw
  text: Elisha akasema, “Kama aishivyo Yahwe wa majeshi, ambaye ninasimama mbele zake[a], kama si kwa heshima niliyo nayo kwa Yehoshafati mfalme wa Yuda[b], nisingekutazama wala kukuona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa tafsiri halisi, ni “ambaye nimesimama mbele zake.” Nahau hiyo pia inaweza kumaanisha kumtumikia Mungu kama nabii.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia nahau ya “kuinua uso” wa Yehoshafati, yaani kumwonyesha heshima au kibali. Pia inaweza kutafsiriwa, “kama si kwa ajili ya Yehoshafati mfalme wa Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: Kama aishivyo Yahwe wa majeshi
  rationale: Huhifadhi muundo na uzito wa kiapo cha Kiebrania kwa Kiswahili cha kawaida, huku צְבָאוֹת ikitafsiriwa kwa neno pana “majeshi” bila kubainisha kupita kiasi aina ya majeshi hayo.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: ambaye ninasimama mbele zake
  rationale: Huhifadhi taswira halisi ya kusimama mbele za Mungu na pia kuacha wazi maana yake ya kiidioma ya kumhudumia Mungu kama nabii.
- source_word: לוּלֵי פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: kama si kwa kuwa namjali Yehoshafati mfalme wa Yuda
  rationale: Muundo huu unawasilisha sharti la לוּלֵי na maana ya nahau ya “kuinua uso,” yaani kumjali au kumwonyesha mtu kibali, kwa Kiswahili cha asili.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: nisingekutazama wala kukuona
  rationale: Hufanya ukanushi unaodokezwa na muundo wa kiapo uwe wazi na huhifadhi vitenzi vyote viwili vya Kiebrania pamoja na mkazo wake sambamba.
- source_word: יְהוֹשָׁפָט / יְהוּדָה
  choice: Yehoshafati / Yuda
  rationale: Majina yametolewa kwa maumbo yanayotambulika na yaliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo pekee; “Yahwe” hulihifadhi kwa unukuzi bila kulibadilisha kuwa cheo.
- issue: Msimamo wa kinabii mbele za Mungu
  choice: ambaye ninasimama mbele zake
  alternative: ninayemtumikia
  rationale: Tafsiri kuu huhifadhi taswira ya Kiebrania na kutatua kidogo iwezekanavyo maana yake; dokezo linaeleza kuwa nahau hiyo pia inaweza kumaanisha utumishi wa kinabii.
- issue: Nahau ya kuinua uso wa Yehoshafati
  choice: namjali Yehoshafati
  alternative: nauinua uso wa Yehoshafati; namwonyesha Yehoshafati kibali
  rationale: “Namjali” ni Kiswahili cha kawaida kinachowasilisha heshima au kibali kinachodokezwa na nahau, bila kudai kwa lazima aina maalumu ya upendeleo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiapo, ulinganifu wa vitenzi vya mwisho, na utata wa nahau za kinabii umehifadhiwa kadiri Kiswahili kinavyoruhusu.
