translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Kir-Haresethi limetoholewa kama jina la mahali; viwakilishi vya ngeli ya mji vimetumiwa kulirejelea.
