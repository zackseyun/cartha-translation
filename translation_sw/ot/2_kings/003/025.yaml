source:
  edition: WLC
  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: sw
  text: Waliibomoa miji, na katika kila kipande kizuri cha ardhi[a], kila mtu alitupa jiwe lake na kukijaza. Waliziba kila chemchemi ya maji na wakaangusha kila mti mzuri[b], mpaka wakaacha mawe yake tu huko Kir-Haresethi[c]. Kisha wapiga kombeo waliuzingira na kuushambulia[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila shamba zuri.” Neno la Kiebrania חֶלְקָה humaanisha sehemu au kipande cha ardhi.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kila mti mzuri”; huenda usemi huu unamaanisha hasa miti yenye thamani au yenye mazao.
    reason: lexical_alternative
  - marker: c
    text: Kir-Haresethi ni jina la mahali, huenda ulikuwa mji mkuu wa Moabu wenye ngome katika muktadha huu.
    reason: cultural_note
  - marker: d
    text: Au, “kuupiga.” Kitenzi cha Kiebrania humaanisha kihalisi kupiga, lakini hapa kinatumika kuhusu shambulio la kijeshi dhidi ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: Waliibomoa miji
  rationale: Kitenzi הרס huonyesha kubomoa au kuangusha majengo; “waliibomoa” kinadumisha picha hiyo halisi katika muktadha wa vita.
- source_word: חֶלְקָה טוֹבָה
  choice: kila kipande kizuri cha ardhi
  rationale: חֶלְקָה ni sehemu au kipande cha ardhi; usemi huu haubani maana iwe shamba lililolimwa pekee.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: kila mtu alitupa jiwe lake mpaka wakaijaza
  rationale: Muundo wa kugawa kwa kila mtu umehifadhiwa, na “mpaka wakaijaza” unaonyesha matokeo ya kurusha mawe katika kila kipande cha ardhi.
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: Waliziba kila chemchemi ya maji
  rationale: סתם katika muktadha huu ni kuzuia au kuziba chanzo cha maji; “chemchemi ya maji” ni tafsiri wazi ya מַעְיַן מַיִם.
- source_word: כָל עֵץ טוֹב יַפִּילוּ
  choice: wakaangusha kila mti mzuri
  rationale: Maandishi yanasema kihalisi “mti mzuri” na hayataji moja kwa moja mti wa matunda; Hifili ya נפל ni kusababisha uanguke.
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: mpaka wakaacha mawe yake tu huko Kir-Haresethi
  rationale: Tafsiri inadumisha wazo la mawe kubaki katika Kir-Haresethi bila kujaribu kutatua kabisa badiliko la ghafla la idadi katika kitenzi cha Kiebrania.
- source_word: הַקַּלָּעִים
  choice: wapiga kombeo
  rationale: Nomino hii humaanisha askari waliotumia kombeo; “wapiga kombeo” ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: waliuzingira na kuushambulia
  rationale: סבב hapa huonyesha kuzunguka au kuzingira mji, na נכה katika muktadha wa kijeshi huonyesha kuupiga au kuushambulia.
