  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: sw
  text: Waliamka asubuhi na mapema, na jua likaangaza juu ya maji. Wamoabu wakaona maji yaliyokuwa ng’ambo yao[a] yakiwa mekundu kama damu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania halisi kinasema “Moabu” kwa maana ya watu wa Moabu. Usemi wa mahali unaweza pia kutafsiriwa “mbele yao” au “upande wa pili kutoka kwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Waliamka asubuhi na mapema
  rationale: Kitenzi cha Kiebrania kinaonyesha kuamka mapema; usemi huu ni wa kawaida katika Kiswahili na unadumisha msisitizo wa wakati.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: na jua likaangaza juu ya maji
  rationale: זרח hapa inaweza kumaanisha kuchomoza au kuangaza. Muktadha unasisitiza mwanga wa jua juu ya maji, kwa hiyo “likaangaza” linaeleza athari ya kuona bila kufafanua zaidi ya matini.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: Wamoabu wakaona
  rationale: Jina “Moabu” limetumiwa kwa maana ya pamoja kuwakilisha watu wa Moabu. Kiswahili cha kawaida hutumia “Wamoabu” ili maana hiyo ieleweke wazi.
- source_word: מִנֶּגֶד
  choice: ng’ambo yao
  rationale: Neno hili linaonyesha mahali palipoelekeana na watazamaji au upande wa pili kutoka walipokuwa. “Ng’ambo yao” linadumisha uhusiano huo wa kimahali.
- source_word: אֲדֻמִּים כַּדָּם
  choice: yakiwa mekundu kama damu
  rationale: Hii inadumisha rangi iliyoonekana na tashbihi dhahiri ya Kiebrania. Upatanisho wa “mekundu” unafuata nomino ya Kiswahili “maji”.
