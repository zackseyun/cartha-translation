  text: וַ/יֵּ֡לֶךְ וַ/יִּשְׁלַח֩ אֶל יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֜ה לֵ/אמֹ֗ר מֶ֤לֶךְ מוֹאָב֙ פָּשַׁ֣ע בִּ֔/י הֲ/תֵלֵ֥ךְ אִתִּ֛/י אֶל מוֹאָ֖ב לַ/מִּלְחָמָ֑ה וַ/יֹּ֣אמֶר אֶעֱלֶ֔ה כָּמ֧וֹ/נִי כָמ֛וֹ/ךָ כְּ/עַמִּ֥/י כְ/עַמֶּ֖/ךָ כְּ/סוּסַ֥/י כְּ/סוּסֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: sw
  text: Basi akaenda, akatuma ujumbe kwa Yehoshafati, mfalme wa Yuda, akisema, “Mfalme wa Moabu ameniasi[a]. Je, utaenda pamoja nami kupigana na Moabu?” Akajibu, “Nitakwenda[b]. Mimi ni kama wewe, watu wangu ni kama watu wako, na farasi wangu ni kama farasi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amejitenga nami.” Kitenzi cha Kiebrania kinaweza kumaanisha kuasi kisiasa au kuvunja utiifu; hapa kinahusu uasi wa Moabu dhidi ya utawala wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “Nitapanda.” Kitenzi hiki hutumiwa mara nyingi kwa kwenda vitani au kuelekea sehemu ya juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Basi akaenda
  rationale: Kitenzi chenye waw mfululizo kinaendeleza simulizi; ‘Basi akaenda’ huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: וַיִּשְׁלַח אֶל
  choice: akatuma ujumbe kwa
  rationale: Kwa kuwa maneno ya ujumbe yanafuata, usemi huu unamaanisha kutuma ujumbe kwa mtu, si kutuma kitu kisichotajwa.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Yehoshafati, mfalme wa Yuda
  rationale: Majina yametolewa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili, huku cheo cha kifalme kikihifadhiwa.
- source_word: מֶלֶךְ מוֹאָב
  choice: Mfalme wa Moabu
  rationale: Ni mtawala anayejulikana katika muktadha, hivyo usemi wa kawaida wa Kiswahili unafaa.
- source_word: פָּשַׁע בִּי
  choice: ameniasi
  rationale: Katika muktadha wa kisiasa, kitenzi kinaonyesha uasi dhidi ya mamlaka au kuvunja utiifu; ‘ameniasi’ ni kifupi na cha asili.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Je, utaenda pamoja nami
  rationale: Huhifadhi maana ya kwenda pamoja na msemaji bila kuibadili kuwa ‘kuja’.
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: kupigana na Moabu
  rationale: Hutoa kwa Kiswahili cha asili kusudi la kwenda Moabu kwa vita, bila kuongeza maelezo yasiyokuwapo.
- source_word: אֶעֱלֶה
  choice: Nitakwenda
  rationale: Ingawa kitenzi kihalisi ni ‘nitapanda,’ hapa kinatumika kwa mwendo wa kijeshi; ‘Nitakwenda’ ni wazi, na maana halisi imehifadhiwa katika tanbihi.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Mimi ni kama wewe
  rationale: Huhifadhi kauli fupi ya mshikamano na kujitambulisha pamoja na mwenzake.
- source_word: כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: watu wangu ni kama watu wako, na farasi wangu ni kama farasi wako
  rationale: Virai vya Kiebrania vilivyoachwa bila kitenzi vimekamilishwa kwa ‘ni’ ili viwe vya kawaida na wazi kwa Kiswahili.
theological_decisions:
- issue: Nguvu ya kisiasa ya פָּשַׁע בִּי
  choice: ameniasi
  alternative: amejitenga nami
  rationale: Muktadha unaonyesha uasi wa Moabu dhidi ya utawala wa Israeli. Tafsiri kuu inaonyesha uasi huo, huku uwezekano wa kuvunja utiifu ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi la heshima lakini kinachoeleweka kwa urahisi. Majina ‘Yehoshafati,’ ‘Yuda,’ na ‘Moabu’ yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika, badala ya kufuata uwekaji usiolingana wa safu ya ushauri ya Kiingereza.
