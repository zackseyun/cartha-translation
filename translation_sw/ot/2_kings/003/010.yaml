base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: sw
  text: Ndipo mfalme wa Israeli akasema, “Ole! Yahwe amewaita[a] wafalme hawa watatu ili awatie mikononi mwa Moabu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amewakusanya”; kitenzi cha Kiebrania kihalisi ni “amewaita.”
    reason: lexical_alternative
  - marker: b
    text: “Mikononi mwa Moabu” ni nahau ya Kiebrania yenye maana ya “chini ya uwezo wa Moabu.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida, sawa na nguvu ya waw-consecutive.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Ni tafsiri ya kawaida ya muundo wa umilikaji, huku cheo kikibaki wazi kwa kuwa jina la mfalme halitajwi katika mstari huu.
- source_word: אֲהָהּ
  choice: Ole!
  rationale: Ni mshangao wa huzuni na dhiki; “Ole!” huhifadhi uzito wa kauli bila kuongeza maneno yasiyokuwapo katika Kiebrania.
- source_word: קָרָא
  choice: amewaita
  rationale: Huhifadhi maana ya msingi ya kitenzi, ‘kuita,’ bila kuamua kimyakimya kwamba maana yake ni kuwakusanya tu au kuwaita jeshini.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja kwa tahajia iliyozoeleka katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: hawa wafalme watatu
  rationale: Huwatambulisha kwa kawaida na kwa usahihi wafalme watatu mahsusi wanaozungumziwa.
- source_word: לָתֵת אֹתָם
  choice: ili awatie
  rationale: Huwasilisha kusudi linalodokezwa na infinitivu na kumweka Yahwe kama mtendaji, huku maana ya kutiwa chini ya mamlaka ikikamilishwa na kirai kinachofuata.
- source_word: בְּיַד מוֹאָב
  choice: mikononi mwa Moabu
  rationale: Huhifadhi taswira ya nahau ya Kiebrania kuhusu kutiwa chini ya uwezo wa mwingine; wingi ‘mikononi’ ni usemi wa kawaida zaidi katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu lenye konsonanti nne moja kwa moja; kulitaja kama ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa קָרָא inamaanisha kuita au kuwakusanya kwa uongozi wa Mungu
  choice: amewaita
  alternative: amewakusanya
  rationale: Kitenzi chenyewe kina maana ya msingi ya ‘kuita.’ Tafsiri haipaswi kupanua dai la mfalme zaidi ya ushahidi wa maneno ya Kiebrania.
- issue: Ikiwa kauli ya mfalme inathibitisha kusudi la Mungu au inaonyesha tu tafsiri yake ya hali
  choice: Kauli imeachwa kama madai ya moja kwa moja ya mfalme
  alternative: Kuongeza maneno kama ‘inaonekana kwamba’
  rationale: Mstari unaripoti hitimisho la mfalme bila maelezo ya msimulizi yanayolihakikisha au kulikanusha; tafsiri huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa maandiko. ‘Ole!’ imechaguliwa kama mshangao mfupi wa dhiki, na nahau ya ‘mikononi mwa’ imehifadhiwa kwa kuwa inaeleweka kwa wasomaji wa kawaida.
