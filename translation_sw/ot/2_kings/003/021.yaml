base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: sw
  text: Wamoabu wote wakasikia kwamba wafalme walikuwa wamekuja kupigana nao. Basi wakaitwa wakusanyike[a], kuanzia kila mtu mwenye kufunga mkanda na kuendelea[b], nao wakasimama mpakani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakakusanywa” au “wakaandikishwa kwa ajili ya vita.” Kitenzi cha Kiebrania hapa kinaelekea kumaanisha kuhamasishwa kukusanyika, si kupiga kelele tu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “kila afungaye mkanda na kuendelea,” yaani watu waliokuwa wamefikia umri wa kwenda vitani na waliozidi umri huo.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: Wamoabu wote
  rationale: Jina la pamoja ‘Moabu’ linamaanisha taifa au watu wake; Kiswahili cha kawaida hutumia ‘Wamoabu wote’ kwa maana hiyo.
- source_word: שָׁמְעוּ
  choice: wakasikia
  rationale: Hutoa maana ya moja kwa moja ya kusikia habari na pia huendeleza simulizi kwa asili katika Kiswahili.
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: kwamba wafalme walikuwa wamekuja
  rationale: Kitenzi עָלוּ kinaweza kumaanisha kupanda au kuja dhidi ya mahali fulani; ‘wamekuja’ huhifadhi mwelekeo bila kuongeza maelezo yasiyokuwapo.
- source_word: לְהִלָּחֶם בָּם
  choice: kupigana nao
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kuingia vitani dhidi yao.
- source_word: וַיִּצָּעֲקוּ
  choice: wakaitwa wakusanyike
  rationale: Katika muktadha wa uvamizi, kitenzi kinaonyesha kuitwa au kuhamasishwa kukusanyika, si kulia kwa sauti tu; muundo wa kutendwa umehifadhiwa.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: watu wote kuanzia wenye umri wa kujifunga mkanda na kuendelea
  rationale: Huhifadhi taswira halisi ya kufunga mkanda huku ikionyesha kwamba msemo huo unaweka kiwango cha chini cha umri.
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: na wakasimama mpakani
  rationale: Ni tafsiri ya karibu ya kusimama kwenye mpaka; muktadha unaonyesha kwamba walikuwa wamejipanga huko.
