  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּלֶךְ֩ מֶ֨לֶךְ יִשְׂרָאֵ֤ל וּ/מֶֽלֶך יְהוּדָה֙ וּ/מֶ֣לֶךְ אֱד֔וֹם וַ/יָּסֹ֕בּוּ דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא הָיָ֨ה מַ֧יִם לַֽ/מַּחֲנֶ֛ה וְ/לַ/בְּהֵמָ֖ה אֲשֶׁ֥ר בְּ/רַגְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: sw
  text: Basi mfalme wa Israeli akaenda pamoja na mfalme wa Yuda na mfalme wa Edomu. Wakasafiri kwa njia ya kuzunguka kwa siku saba, lakini hapakuwa na maji kwa ajili ya kambi wala kwa ajili ya mifugo iliyofuatana nao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mifugo iliyokuwa miguuni pao,” yaani, wanyama walioandamana nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך hapa ni kitenzi cha kawaida cha simulizi kinachoanzisha safari; muktadha unaonyesha kuwa ilikuwa safari ya kijeshi bila kulazimisha maana hiyo ndani ya kitenzi chenyewe.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: mfalme wa Israeli ... mfalme wa Yuda na mfalme wa Edomu
  rationale: Kurudia cheo cha kila mfalme kunahifadhi uratibu wa Kiebrania na kuonyesha wazi muungano wa wafalme hao watatu.
- source_word: וַיָּסֹבּוּ
  choice: Wakasafiri kwa njia ya kuzunguka
  rationale: Mzizi סבב unaonyesha mwendo wa kuzunguka au kutumia njia isiyo ya moja kwa moja; usemi huu ni wa kawaida katika Kiswahili na unahifadhi wazo la mzunguko.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: kwa siku saba
  rationale: Katika muktadha huu דֶּרֶךְ hueleza mwendo au safari yenye muda wa siku saba. Kauli hii inaunganika kiasili na 'kwa njia ya kuzunguka' bila kufanya Kiebrania kuwa kigumu katika Kiswahili.
- source_word: וְלֹא הָיָה מַיִם
  choice: hapakuwa na maji
  rationale: Hii ni kauli ya uwepo yenye היה; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לַמַּחֲנֶה
  choice: kwa ajili ya kambi
  rationale: מַחֲנֶה inaweza kumaanisha kambi au kambi ya jeshi. 'Kambi' inatosha katika muktadha na haiongezi ufafanuzi usiotajwa wazi.
- source_word: וְלַבְּהֵמָה
  choice: kwa ajili ya mifugo
  rationale: בְּהֵמָה hapa ni jina la jumla la wanyama walioandamana na msafara, huenda wanyama wa kufugwa na wa kubeba mizigo; 'mifugo' linafaa kuliko neno pana 'wanyama'.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: iliyofuatana nao
  rationale: Kihalisi ni 'iliyokuwa miguuni pao,' lakini katika muktadha huu ni nahau ya wanyama walioandamana nao. Tafsiri ya matini inatoa maana ya kawaida, na taswira halisi imehifadhiwa katika tanbihi.
