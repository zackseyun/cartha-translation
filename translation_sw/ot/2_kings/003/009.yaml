translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Mfuatano wa vitenzi vya simulizi umeonyeshwa kwa viambishi vya -ka-, huku sentensi ikigawanywa mara mbili ili isomeke kwa ufasaha.
