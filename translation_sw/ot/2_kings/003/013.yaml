base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: sw
  text: Elisha akamwambia mfalme wa Israeli, “Nina nini nawe?[a] Nenda kwa manabii wa baba yako na kwa manabii wa mama yako.” Lakini mfalme wa Israeli akamwambia, “Hapana,[b] kwa maana Yahwe amewaita wafalme hawa watatu ili kuwatia mikononi mwa Moabu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “Kuna nini kwangu na kwako?” Huu ni msemo wa Kiebrania unaoonyesha kujitenga au kukataa kuhusika.'
    reason: lexical_alternative
  - marker: b
    text: Au, “Tafadhali usifanye hivyo, kwa maana Yahwe amewaita wafalme hawa watatu ...” Kirai cha Kiebrania ni kigumu na kinaweza kueleweka kama ombi badala ya pingamizi la moja kwa moja.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Mimi nina nini nawe?
  rationale: Huu ni msemo wa Kiebrania unaoonyesha kujitenga au kukataa kuhusika. Tafsiri hii inahifadhi umbo na ukali wa swali huku tanbihi ikifafanua maana yake.
- source_word: לֵךְ
  choice: Nenda
  rationale: Amri rahisi ya Kiebrania imetafsiriwa moja kwa moja kwa Kiswahili cha kawaida.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: manabii wa baba yako ... manabii wa mama yako
  rationale: Muundo wa karibu na chanzo unadumisha rejeo lenye makusudi kwa manabii waliohusishwa na wazazi wa mfalme.
- source_word: אַל כִּי
  choice: La, kwa maana
  rationale: Kirai hiki ni kigumu na kifupi. Katika muktadha kinaeleweka vizuri kama pingamizi la mfalme, lakini uwezekano wa kuwa ombi umehifadhiwa katika tanbihi.
- source_word: קָרָא
  choice: amewaita pamoja
  rationale: Kitenzi kinaweza kumaanisha kuita au kuwakusanya. Neno “pamoja” linaonyesha kwamba wafalme hao watatu waliitwa katika shughuli moja bila kubadili mhusika wa kitendo.
- source_word: לָתֵת אוֹתָם בְּיַד מוֹאָב
  choice: ili kuwatia mikononi mwa Moabu
  rationale: Msemo wa “kutia mikononi mwa” ni wa asili katika Kiswahili na unahifadhi taswira ya Kiebrania ya kuwekwa chini ya mamlaka au nguvu za adui.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetolewa kama jina maalumu “Yahwe,” si kubadilishwa kuwa cheo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya jibu אַל כִּי
  choice: 'Pingamizi: “La, kwa maana...”'
  alternative: 'Ombi: “Tafadhali usifanye hivyo, kwa maana...”'
  rationale: Kiebrania ni kifupi na kina utata. Muktadha unaunga mkono pingamizi kwa kukataliwa kwa Elisha, lakini tafsiri ya ombi pia inawezekana na imetajwa katika tanbihi.
- issue: Kusudi au matokeo katika לָתֵת אוֹתָם
  choice: ili kuwatia mikononi mwa Moabu
  alternative: hata akawatia mikononi mwa Moabu
  rationale: Kiswahili “ili” hudumisha usomaji wa kusudi unaopatikana kwa kawaida baada ya “amewaita,” ingawa katika muktadha inaweza pia kueleweka kuwa matokeo yanayotarajiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Akamwambia” linaendeleza mtiririko wa masimulizi; “Lakini” linaweka wazi tofauti ya jibu la mfalme. Taswira ya “mikononi mwa Moabu” imehifadhiwa kwa sababu ni ya kawaida na inaeleweka katika Kiswahili.
