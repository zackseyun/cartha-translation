base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: sw
  text: Yehoramu mwana wa Ahabu akawa mfalme wa Israeli katika Samaria, katika mwaka wa kumi na nane wa utawala wa Yehoshafati, mfalme wa Yuda,[a] naye akatawala kwa miaka kumi na miwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Naye Yehoramu mwana wa Ahabu akawa mfalme wa Israeli…” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa neno “naye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: Yehoramu
  rationale: Jina limetoholewa kwa namna inayofaa Kiswahili. Kiunganishi cha mwanzo ו־ hakijaonyeshwa katika matini kuu ili sentensi ianze kwa mtiririko wa kawaida wa Kiswahili, lakini maana yake mbadala imehifadhiwa katika tanbihi.
- source_word: בֶּן אַחְאָב
  choice: mwana wa Ahabu
  rationale: Hili ni tamko la moja kwa moja la uhusiano wa kifamilia, kwa lugha ya kawaida na yenye heshima.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: alianza kuwa mfalme wa Israeli
  rationale: Katika fomula hii kitenzi kinaonyesha kuingia madarakani. Tafsiri hii pia inatofautisha kuanza kwa ufalme na kishazi cha mwisho kinachoeleza muda wa utawala.
- source_word: בְּ/שֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kihusishi ב־ kina maana ya mahali; hapa Samaria ni mji mkuu ambako Yehoramu alitawala.
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה לִ/יהוֹשָׁפָט
  choice: katika mwaka wa kumi na nane wa utawala wa Yehoshafati
  rationale: Hii ni fomula ya kulinganisha miaka ya utawala wa wafalme. Neno “utawala” linaweka wazi kwa Kiswahili maana inayodokezwa na muundo wa Kiebrania.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo na eneo la utawala vimetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: naye akatawala kwa miaka kumi na miwili
  rationale: Hapa kitenzi מלך kinaeleza muda wa utawala. “Akatawala kwa miaka” ni usemi wa asili wa Kiswahili na kiunganishi “naye” kinaendeleza simulizi.
