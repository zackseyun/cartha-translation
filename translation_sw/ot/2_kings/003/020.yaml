base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: sw
  text: Ikawa asubuhi, wakati wa kutolewa kwa sadaka ya nafaka[a], tazama, maji yalikuwa yakija kutoka upande wa Edomu[b], nayo nchi ikajazwa maji[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati sadaka ya nafaka ilipotolewa.” Kiebrania husema, “wakati wa kupandishwa kwa sadaka,” lugha ya ibada inayohusu kuiwasilisha sadaka madhabahuni.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka njia ya Edomu” au “kupitia njia ya Edomu.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania husema, “nchi ikajazwa yale maji”; kwa Kiswahili cha kawaida, “nchi ikajazwa maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Ikawa asubuhi
  rationale: Muundo huu unaendeleza simulizi kwa njia ya kawaida ya Kiswahili huku ukihifadhi alama ya wakati ya Kiebrania.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: wakati wa kutolewa kwa sadaka ya nafaka
  rationale: Neno מִנְחָה katika muktadha wa ibada linamaanisha sadaka ya nafaka; עלה lina picha ya sadaka kupandishwa au kutolewa, ambayo hapa imewasilishwa kwa Kiswahili cha kawaida bila kupoteza maana ya kiibada.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linavuta fikira kwenye tukio la kushangaza na kudumisha uhai wa simulizi.
- source_word: מַיִם בָּאִים
  choice: maji yalikuwa yakija
  rationale: Kirai cha Kiebrania kina umbo la wakati unaoendelea; tafsiri hii inaonyesha maji yakiwa yanaonekana yakija, badala ya tukio la papo hapo tu.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: kutoka upande wa Edomu
  rationale: דֶּרֶךְ kwa msingi ni njia, lakini katika muundo huu linaonyesha njia au upande maji yalikotokea. 'Upande wa Edomu' ni Kiswahili cha asili kinachohifadhi maana ya kijiografia.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: nchi ikajaa maji
  rationale: הָאָרֶץ hapa ni nchi au eneo la ardhi, si dunia yote. Kiswahili cha kawaida hakihitaji kibainishi kinacholingana na 'yale' katika kirai hiki.
