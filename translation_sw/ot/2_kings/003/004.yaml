  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מֵישַׁ֥ע מֶֽלֶךְ מוֹאָ֖ב הָיָ֣ה נֹקֵ֑ד וְ/הֵשִׁ֤יב לְ/מֶֽלֶךְ יִשְׂרָאֵל֙ מֵאָה אֶ֣לֶף כָּרִ֔ים וּ/מֵ֥אָה אֶ֖לֶף אֵילִ֥ים צָֽמֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: sw
  text: Mesha mfalme wa Moabu alikuwa mfugaji wa kondoo, naye alikuwa akimlipa mfalme wa Israeli ushuru wa wana-kondoo laki moja na sufu ya kondoo-dume laki moja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, kihalisi, “kondoo-dume laki moja, sufu.” Usemi huu umedondosha baadhi ya maneno; unaweza kumaanisha “kondoo-dume laki moja wenye sufu,” au, kama inavyoelekea zaidi katika muktadha huu, “sufu ya kondoo-dume laki moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: mfugaji wa kondoo
  rationale: Neno hili humaanisha mtu anayefuga au kuzalisha kondoo. “Mfugaji wa kondoo” ni Kiswahili cha kawaida, wazi, na kinachofaa muktadha wa uchumi.
- source_word: וְהֵשִׁיב
  choice: naye alikuwa akimlipa
  rationale: Hifili ya שׁוב hapa ina maana ya kutoa malipo au ushuru kwa desturi. Muundo “alikuwa akimlipa” unaonyesha tendo lililokuwa likifanyika kwa kawaida.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: wana-kondoo laki moja
  rationale: כָּרִים hurejelea wana-kondoo au kondoo-dume wachanga. “Wana-kondoo” ni tafsiri ya asili na inayoeleweka katika orodha hii ya ushuru.
- source_word: אֵילִים צָמֶר
  choice: sufu ya kondoo-dume laki moja
  rationale: Kiebrania kinaweka “sufu” baada ya “kondoo-dume” katika usemi uliodondosha baadhi ya maneno. Tafsiri hii inaeleza maana inayowezekana zaidi katika muktadha huku tanbihi ikihifadhi utata wa muundo wa asili.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Moabu / mfalme wa Israeli
  rationale: Huu ni uwasilishaji wa kawaida wa miundo ya Kiebrania, huku vyeo vikitafsiriwa na majina ya mahali yakitoholewa kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Laki moja” limetumiwa badala ya muundo mrefu “elfu mia moja” kwa ufasaha wa kawaida. Kiunganishi cha mwanzo kisichokuwapo wazi katika chanzo hakijaongezwa.
