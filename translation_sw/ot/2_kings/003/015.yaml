  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: sw
  text: Lakini sasa, nileteeni mpiga ala[a]. Mpiga ala alipokuwa akipiga, mkono wa Yahwe ukaja juu yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamuziki” au “mpigaji wa ala.” Kiebrania kinamaanisha kwa ujumla mtu anayepiga ala ya muziki bila kutaja ala yenyewe.
    reason: lexical_alternative
  - marker: b
    text: “Mkono wa Yahwe” ni msemo wa Kiebrania unaoweza kumaanisha nguvu za Mungu au ushawishi wa kinabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Kifungu hiki kinaanzisha badiliko la haraka kutoka katika maneno yaliyotangulia kwenda kwenye ombi jipya; “Lakini sasa” linaonyesha mgeuko huo kwa Kiswahili cha kawaida.
- source_word: קְחוּ לִי
  choice: nileteeni
  rationale: Amri ya wingi pamoja na kiwakilishi cha yule anayesema ina maana ya kumtafutia au kumleta mtu; “nileteeni” ni ya asili na huhifadhi amri ya wingi.
- source_word: מְנַגֵּן
  choice: mpiga ala
  rationale: Neno hili humaanisha mtu anayepiga ala ya muziki, lakini Kiebrania hakitaji ala fulani. “Mpiga ala” ni sahihi kuliko kutaja kinubi au ala nyingine.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: Ikawa mpiga ala alipokuwa akipiga
  rationale: Muundo huu unaonyesha mazingira ya wakati ambapo tukio linalofuata lilitokea. Tafsiri hii huhifadhi pia ladha ya simulizi ya “ikawa” bila kuwa ngumu.
- source_word: יַד יְהוָה
  choice: mkono wa Yahwe
  rationale: Taswira halisi ya Kiebrania imehifadhiwa badala ya kufasiri moja kwa moja kuwa nguvu au uvuvio wa kinabii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַתְּהִי עָלָיו
  choice: ukaja juu yake
  rationale: Kauli hii inaonyesha kuanza kwa tendo au ushawishi wa Mungu juu yake; “ukaja juu yake” ni ya kawaida katika Kiswahili na huhifadhi usemi wa chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kuweka cheo mahali pake.
- issue: Maana ya kiibada au ya kinabii ya יַד יְהוָה
  choice: mkono wa Yahwe ukaja juu yake
  alternative: nguvu za Yahwe zilimjia au uvuvio wa Yahwe ukamjia
  rationale: Katika muktadha huu usemi huenda ukaashiria nguvu au ushawishi wa kinabii, lakini tafsiri inahifadhi taswira na upana wa maana wa Kiebrania bila kuamua namna hususa ya tendo la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye heshima na unaoeleweka kwa urahisi. “Mpiga ala” huepuka kutaja ala ambayo haipo katika chanzo, na “mkono wa Yahwe” huhifadhi taswira na mvutano wa kiteolojia wa Kiebrania.
