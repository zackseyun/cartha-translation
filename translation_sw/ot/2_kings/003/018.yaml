lexical_decisions:
- source_word: וְנָקַל
  choice: ni dogo
  rationale: Kitenzi hiki kinaonyesha jambo kuwa jepesi, rahisi, au lisilo kubwa. ‘Ni dogo’ ni Kiswahili cha kawaida kinachohifadhi maana ya tathmini katika muktadha huu.
- source_word: זֹאת
  choice: jambo hili
  rationale: Kiwakilishi hiki kinarejelea tendo lililotangulia la kutoa maji; kuongeza ‘jambo’ hufanya rejeo hilo lisomeke kwa kawaida katika Kiswahili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi sitiari ya Kiebrania ya kutathmini jambo kwa mtazamo wa mtu, huku ikiwa usemi unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: וְנָתַן
  choice: pia ataikabidhi
  rationale: Katika usemi huu wa kinabii, umbo hili lina maana ya wakati ujao. ‘Pia’ huonyesha kuwa kukabidhi Moabu ni tendo la nyongeza baada ya muujiza wa maji.
- source_word: אֶת מוֹאָב
  choice: Moabu
  rationale: Jina la taifa limehifadhiwa kama lilivyo katika chanzo, badala ya kulibadili kuwa ‘Wamoabu.’
- source_word: בְּיֶדְכֶם
  choice: mikononi mwenu
  rationale: Ni usemi wa kawaida wa Kiswahili unaomaanisha kukabidhi mtu au taifa chini ya mamlaka ya wengine, na unahifadhi picha ya ‘mkono’ kutoka Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya וְנָקַל katika tathmini ya Mungu
  choice: ni dogo
  alternative: ni rahisi
  rationale: Maneno ya Kiebrania yanaweza kumaanisha jambo lisilo na uzito mkubwa au jambo rahisi. Matini kuu inahifadhi wazo la ‘jambo dogo,’ huku maana halisi mbadala ikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ‘machoni pa’ unahifadhi sitiari ya Kiebrania, na ‘mikononi mwenu’ ni nahau ya kawaida inayoonyesha kutiwa chini ya mamlaka.
