  text: Na jambo hili ni dogo machoni pa Yahwe[a]; pia atawatia Wamoabu mikononi mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na jambo hili ni rahisi machoni pa Yahwe.”
