lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Muundo wa kisimulizi wa Kiebrania unaendeleza mfululizo wa matukio na kutambulisha maneno ya moja kwa moja; “Naye akasema” unahifadhi uhusiano huo bila kuongeza maana ya wakati.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Huu ni mtindo rasmi wa ujumbe wa kinabii. Mpangilio huu ni wa asili katika Kiswahili na unadumisha uzito wa tamko.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi nne YHWH limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: עָשֹׂה
  choice: Lifanyeni ... liwe
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutengeneza. Muundo huu wa Kiswahili unaonyesha matokeo yanayotakiwa bila kuifanya “chimba” kuwa maana pekee ya kitenzi.
- source_word: הַנַּחַל הַזֶּה
  choice: bonde hili la mto
  rationale: נחל hapa huweza kumaanisha bonde au njia ya maji inayoweza kukauka. “Bonde la mto” linaeleweka kwa wasomaji wengi na linaacha wazi kama maji hutiririka daima au kwa majira.
- source_word: גֵּבִים גֵּבִים
  choice: mashimo kila mahali
  rationale: Kurudiwa kwa nomino ya wingi kunatoa maana ya ugawaji au wingi—mashimo mengi katika eneo lote—ambayo Kiswahili cha asili huwasilisha kwa “kila mahali.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA (au Yehova)
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikionyesha desturi nyingine za tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye hadhi ya tamko la kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Muundo usio wa kawaida wa Kiebrania umeelezwa kwa Kiswahili cha asili bila kuondoa msisitizo wa mashimo mengi.
