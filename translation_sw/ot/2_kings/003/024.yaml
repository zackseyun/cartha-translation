  text: וַ/יָּבֹאוּ֮ אֶל מַחֲנֵ֣ה יִשְׂרָאֵל֒ וַ/יָּקֻ֤מוּ יִשְׂרָאֵל֙ וַ/יַּכּ֣וּ אֶת מוֹאָ֔ב וַ/יָּנֻ֖סוּ מִ/פְּנֵי/הֶ֑ם ו/יבו בָ֔/הּ וְ/הַכּ֖וֹת אֶת מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: sw
  text: Walipofika katika kambi ya Israeli, Waisraeli wakainuka, wakawapiga Wamoabu, nao wakawakimbia. Kisha Waisraeli wakaingia humo[a], huku wakiendelea kuwapiga Wamoabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaingia nchini” au “wakasonga mbele ndani ya Moabu.” Kiebrania kinasema kihalisi “wakaingia ndani yake”; kiambishi cha kike huenda kinarejelea nchi au eneo, si watu moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲנֵה
  choice: kambi
  rationale: Katika muktadha huu wa vita, neno hili linamaanisha kambi ya kijeshi; “kambi” ni tafsiri ya kawaida na ya wazi katika Kiswahili.
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Kitenzi קום hapa kinaonyesha kuanza kuchukua hatua madhubuti vitani. “Wakainuka” huhifadhi picha ya simulizi bila kukifanya kimaanishe tu “wakashambulia.”
- source_word: וַיַּכּוּ / וְהַכּוֹת
  choice: wakawapiga / wakiendelea kuwapiga
  rationale: נכה humaanisha kupiga au kushambulia. “Kuwapiga” huhifadhi tendo halisi la kijeshi, na “wakiendelea” huonyesha mwendelezo unaodokezwa na umbo la mwisho la kitenzi.
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: nao wakawakimbia
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha kwamba Wamoabu walikimbia mbele ya Waisraeli waliokuwa wakiwafuatilia.
- source_word: וַיָּבֹאוּ בָהּ
  choice: wakaingia humo
  rationale: “Humo” huhifadhi ufupi wa Kiebrania na kutotajwa wazi kwa kitu kinachorejelewa na kiambishi cha kike, ambacho huenda ni nchi au eneo.
- source_word: מוֹאָב
  choice: Wamoabu
  rationale: Kiebrania hutumia jina “Moabu” kwa maana ya pamoja, yaani watu au jeshi. Kiswahili cha kawaida huhitaji “Wamoabu” wanapotajwa kama watu wanaopigwa na kukimbia.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa mfululizo wa vitenzi huhifadhi mwendo wa haraka wa simulizi la vita, huku tanbihi ikiacha wazi rejeo lenye utata la בָהּ.
