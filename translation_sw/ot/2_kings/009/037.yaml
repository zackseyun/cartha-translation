base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: sw
  text: Na maiti ya Yezebeli itakuwa kama samadi juu ya uso wa shamba, katika sehemu ya Yezreeli[a], hivi kwamba hawatasema, “Huyu ni Yezebeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kipande cha ardhi cha Yezreeli.” Neno la Kiebrania חֵלֶק linaweza kumaanisha eneo maalumu au kipande cha ardhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Na ... itakuwa
  rationale: Kauli timilifu yenye kiunganishi inaendeleza unabii uliotangulia na ina maana ya wakati ujao.
- source_word: נִבְלַת אִיזֶבֶל
  choice: maiti ya Yezebeli
  rationale: Nִבְלָה humaanisha mwili uliokufa; “maiti” ni neno la kawaida, lenye heshima lakini linalohifadhi ukali wa picha.
- source_word: כְּדֹמֶן
  choice: kama samadi
  rationale: דֹּמֶן ni kinyesi au samadi; “samadi” inafaa katika mazingira ya shamba huku ikihifadhi ulinganisho wa moja kwa moja.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: juu ya ardhi
  rationale: Kirai halisi ni “juu ya uso wa shamba”; Kiswahili cha kawaida hutumia “juu ya ardhi” kueleza maiti iliyotapakaa kwenye eneo la wazi.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: katika eneo la Yezreeli
  rationale: חֵלֶק inaweza kumaanisha sehemu, kipande, au eneo la ardhi; “eneo” ni la asili na halibani maana kuwa kiwanja kidogo.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: hata watu wasiweze kusema
  rationale: 'Kirai kinaonyesha matokeo: mabaki hayatambulika kiasi cha watu kushindwa kumtambulisha Yezebeli.'
- source_word: זֹאת אִיזָבֶל
  choice: Huyu ni Yezebeli
  rationale: Hii ni kauli rahisi ya kumtambua mtu; “huyu” hutumiwa kwa mtu katika Kiswahili.
