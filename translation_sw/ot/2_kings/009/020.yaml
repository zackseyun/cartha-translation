base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: sw
  text: Mlinzi akatoa habari, akisema, “Amefika walipo, lakini hajarudi. Namna yake ya kuendesha ni kama ya Yehu mwana wa Nimshi, kwa maana yeye huendesha kwa wazimu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huendesha kama mwenye wazimu” au “huendesha kwa namna ya kichaa.” Kiebrania kinakazia namna ya Yehu ya kuendesha kwa kufurukuta na bila tahadhari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד הַצֹּפֶה
  choice: Mlinzi akatoa habari
  rationale: Kitenzi נגד katika muktadha wa mlinzi wa kifalme kina maana ya kutoa taarifa; ‘akatoa habari’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בָּא עַד אֲלֵיהֶם
  choice: Amefika walipo
  rationale: Muundo huu unaonyesha kwamba mjumbe amewafikia wale wanaokuja. Wakati timilifu wa Kiswahili unaonyesha matokeo yanayoendelea kuwa muhimu wakati mlinzi anaporipoti.
- source_word: וְלֹא שָׁב
  choice: lakini hajarudi
  rationale: Kiunganishi kinawasilisha tofauti inayokusudiwa katika muktadha, na ‘hajarudi’ huhifadhi hali ya sasa kwamba bado mjumbe hajarudi.
- source_word: הַמִּנְהָג כְּמִנְהַג
  choice: Namna yake ya kuendesha ni kama ya
  rationale: מִנְהָג hapa ni mtindo au namna ya kuendesha gari la vita. Kiswahili kinaepuka urudiaji mzito bila kupoteza ulinganisho wa Kiebrania.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Yehu mwana wa Nimshi
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika katika Kiswahili cha Biblia, na patronimu imewasilishwa kwa ‘mwana wa.’
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: kwa maana yeye huendesha kwa wazimu
  rationale: כִּי inatoa sababu ya utambuzi huo, huku בְשִׁגָּעוֹן ikieleza namna ya kuendesha kama ya kufurukuta, isiyodhibitiwa, au ya kichaa. ‘Kwa wazimu’ huhifadhi taswira kali ya chanzo bila kuibadili kuwa kasi tu.
