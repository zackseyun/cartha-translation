  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: sw
  text: Katika mwaka wa kumi na moja wa utawala wa Yoramu mwana wa Ahabu[a], Ahazia akawa mfalme wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Taarifa za mpangilio wa miaka zinazohusu tawala za Yoramu na Ahazia ni vigumu kupatanisha katika vitabu vya Wafalme na Mambo ya Nyakati. Tafsiri hii inafuata maandishi ya Kiebrania kama yalivyo bila kujaribu kutatua mpangilio huo katika andiko kuu.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: Katika mwaka wa
  rationale: Muundo huu unaonyesha wakati wa tukio kwa Kiswahili cha kawaida; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa neno tofauti mwanzoni mwa taarifa hii ya kihistoria.
- source_word: אַחַת עֶשְׂרֵה שָׁנָה
  choice: kumi na moja
  rationale: Katika fomula ya miaka ya utawala, usemi huu unamaanisha mwaka wa kumi na moja.
- source_word: לְיוֹרָם
  choice: wa utawala wa Yoramu
  rationale: Katika taarifa za kifalme, לְ huonyesha kwamba mwaka unahesabiwa kwa kurejelea utawala wa Yoramu; kuongeza 'utawala' huifanya maana hiyo iwe wazi na ya kawaida kwa Kiswahili.
- source_word: בֶּן אַחְאָב
  choice: mwana wa Ahabu
  rationale: Ni utambulisho wa moja kwa moja wa Yoramu kwa jina la baba yake.
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika muktadha huu kitenzi kinaonyesha kuingia madarakani, si muda wote wa kutawala.
- source_word: אֲחַזְיָה
  choice: Ahazia
  rationale: Hili ni umbo la jina linalotumiwa kwa kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: עַל יְהוּדָה
  choice: wa Yuda
  rationale: Pamoja na 'akawa mfalme,' umbo 'mfalme wa Yuda' ni Kiswahili cha kawaida kinachoeleza mamlaka yake juu ya ufalme huo.
