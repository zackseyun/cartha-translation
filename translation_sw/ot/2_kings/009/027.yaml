reference: 2 Kings 9:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: sw
  text: Ahazia, mfalme wa Yuda, alipoona hayo, akakimbia kupitia njia ya Beth-hagani.[a] Yehu akamfuatilia na kusema, “Mpigeni yeye pia akiwa garini![b]” Wakampiga kwenye mwinuko wa Guri, ulio karibu na Ibleamu. Lakini Ahazia akakimbilia Megido, akafia huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Beth-hagani linaweza kumaanisha “nyumba ya bustani,” lakini hapa huenda ni jina la mahali; kwa hiyo limetoholewa.
    reason: cultural_note
  - marker: b
    text: Au, “Mpigeni yeye pia kwenye gari!” Kihusishi cha Kiebrania kinaweza kuonyesha mahali au mwelekeo kuelekea gari.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: alipoona hayo
  rationale: Kitenzi cha Kiebrania ni ‘aliona’ bila kutaja kitu kilichoonekana. ‘Hayo’ huleta Kiswahili cha kawaida huku kikirejelea matukio aliyoshuhudia bila kuyafafanua kupita maandishi.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: kupitia njia ya Beth-hagani
  rationale: דֶּרֶךְ ni njia au barabara. בֵּית הַגָּן inaonekana kutumiwa hapa kama jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa kihalisi.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: akamfuatilia
  rationale: Muundo wa רדף pamoja na אַחַר unaonyesha kumfuata mtu kwa nia ya kumkamata au kumshambulia; ‘akamfuatilia’ ni wa kawaida na unaendeleza maana hiyo.
- source_word: גַּם אֹתוֹ
  choice: yeye pia
  rationale: גַּם huongeza Ahazia kwa yule ambaye tayari ameshambuliwa; ‘yeye pia’ huhifadhi mkazo huo.
- source_word: הַכֻּהוּ
  choice: Mpigeni
  rationale: Amri ya נכה ina maana pana ya kupiga au kushambulia. ‘Mpigeni’ haiongezi kwa lazima maana maalumu ya ‘muue’ au ‘mjeruhi.’
- source_word: אֶל הַמֶּרְכָּבָה
  choice: akiwa garini
  rationale: אֶל kwa kawaida huonyesha mwelekeo kuelekea kitu, lakini hapa inaweza kueleweka kwa uhusiano na gari. Tafsiri ya ‘akiwa garini’ inatoa maana inayowezekana katika muktadha huku tanbihi ikihifadhi uwezekano wa mwelekeo.
- source_word: בְּמַעֲלֵה גוּר
  choice: kwenye njia ya kupandia Guri
  rationale: מַעֲלֶה ni sehemu ya kupandia, mwinuko, au njia inayopanda. Usemi huu ni wa asili katika Kiswahili na huhifadhi maelezo ya mandhari.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: iliyo karibu na Ibleamu
  rationale: Kirai hiki kinaweka Guri katika uhusiano wa mahali na Ibleamu. ‘Karibu na’ hakilazimishi usahihi wa mahali ambao kihusishi cha Kiebrania hakitoi wazi.
- source_word: וַיָּנָס מְגִדּוֹ
  choice: akakimbilia Megido
  rationale: Kitenzi kinaonyesha kukimbia, na jina la mahali linalofuata linaeleweka kama alikokwenda.
- source_word: וַיָּמָת שָׁם
  choice: akafia huko
  rationale: Tafsiri hii ya moja kwa moja huhifadhi mlolongo wa simulizi na mahali alipofia.
theological_decisions:
- issue: Kama amri ya Yehu ilimaanisha lazima kumuua Ahazia
  choice: Mpigeni
  alternative: Muue
  rationale: נכה haina ulazima wa maana ya ‘kuua’ katika amri hii. Tafsiri iliyochaguliwa huepuka kuamua zaidi ya ushahidi wa kileksia, ingawa baadaye Ahazia anakufa.
- issue: Uhusiano wa אֶל הַמֶּרְכָּבָה na shambulio
  choice: akiwa garini
  alternative: kulielekea gari / kwenye gari
  rationale: Kihusishi אֶל kinaweza kuelekeza shambulio upande wa gari, ilhali muktadha unaweza kumaanisha Ahazia alipigwa akiwa ndani yake. Maana kuu imewasilishwa kwa njia ya kawaida, na hali ya kutokuwa na uhakika imehifadhiwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. Majina yametoholewa kwa maumbo yanayotamkika kwa urahisi: Ahazia, Yuda, Beth-hagani, Yehu, Guri, Ibleamu, na Megido. Viunganishi vya simulizi ‘aka-’ vimetumiwa kudumisha mwendo wa matukio. Alama za tanbihi zimewekwa moja kwa moja baada ya vipashio vinavyoelezwa.'
