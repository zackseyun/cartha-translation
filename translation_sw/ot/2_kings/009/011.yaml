base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: sw
  text: Kisha Yehu akatoka kwenda kwa watumishi wa bwana wake. Mmoja wao akamuuliza, “Je, mambo ni shwari?[a] Kwa nini huyu mwendawazimu[b] alikuja kwako?” Akawaambia, “Ninyi mnamjua mtu huyo na maneno yake.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “Je, ni amani?” Pia yaweza kutafsiriwa, “Je, kila jambo liko salama?”
    reason: lexical_alternative
  - marker: b
    text: Au, “huyu mtu aliyerukwa na akili.” Neno la Kiebrania ni jina la dharau.
    reason: lexical_alternative
  - marker: c
    text: Au, “mazungumzo yake,” “usemi wake,” au “namna yake ya kusema.” Neno la Kiebrania linaweza kurejelea kwa upana maneno au mazungumzo ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: watumishi wa bwana wake
  rationale: Neno עֶבֶד hapa linawahusu walio chini ya mkuu wa Yehu; ‘watumishi’ ni la kawaida na halilazimishi maana ya utumwa. אֲדֹנָיו limetafsiriwa ‘bwana wake’ bila kuongeza ‘mfalme,’ ambalo halipo wazi katika kishazi hiki.
- source_word: הֲשָׁלוֹם
  choice: Je, mambo ni shwari?
  rationale: Swali la Kiebrania kwa maana halisi ni ‘Je, ni amani?’ lakini katika muktadha huu ni nahau ya kuuliza kama mambo yako sawa; ‘mambo ni shwari’ ni Kiswahili cha kawaida kinachohifadhi wazo la amani na hali njema.
- source_word: מַדּוּעַ בָּא
  choice: Kwa nini ... alikuja
  rationale: Katika mazungumzo ya simulizi, kitenzi hiki kinauliza sababu ya ujio uliokwisha kutokea; wakati uliopita ni wa kawaida katika Kiswahili.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: huyu mwendawazimu
  rationale: Hili ni jina la dharau kwa mtu anayeonwa kuwa amerukwa na akili. ‘Mwendawazimu’ hudumisha ukali wa kauli bila kuipunguza.
- source_word: וַיֹּאמֶר לוֹ
  choice: Mmoja wao akamuuliza
  rationale: Kitenzi ni umoja ingawa waliotajwa ni watumishi wengi; ‘mmoja wao’ huonyesha kwa kawaida kwamba mmoja wa kundi ndiye aliyesema. ‘Akamuuliza’ linafaa kwa sababu maneno yanayofuata ni maswali.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: Ninyi mnamjua mtu huyo
  rationale: Jibu la Yehu linaonekana kuwa la kukwepa; ‘mtu huyo’ hudumisha marejeo yenye sauti ya kumweka mbali.
- source_word: שִׂיחוֹ
  choice: maneno yake
  rationale: שִׂיחַ linaweza kumaanisha mazungumzo, usemi, au namna ya kusema. ‘Maneno yake’ ni pana na halibani maana kuwa ‘ujumbe’ wala kuongeza moja kwa moja dharau ya ‘porojo.’
