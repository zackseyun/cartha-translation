  edition: WLC
  text: וְ/הִ֨כִּיתָ֔ה אֶת בֵּ֥ית אַחְאָ֖ב אֲדֹנֶ֑י/ךָ וְ/נִקַּמְתִּ֞י דְּמֵ֣י עֲבָדַ֣/י הַ/נְּבִיאִ֗ים וּ/דְמֵ֛י כָּל עַבְדֵ֥י יְהוָ֖ה מִ/יַּ֥ד אִיזָֽבֶל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: sw
  text: Nawe utauangamiza ukoo wa Ahabu, bwana wako, nami nitalipiza kisasi kwa ajili ya damu ya watumishi wangu manabii na damu ya watumishi wote wa Yahwe, mikononi mwa Yezebeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mkononi mwa Yezebeli”; hii ni nahau inayomaanisha kwamba Yezebeli alihusika au aliwajibika kwa damu hiyo kumwagwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: utauangamiza
  rationale: Katika muktadha wa hukumu dhidi ya nasaba ya kifalme, נכה inaonyesha kupiga kwa uamuzi hadi kuiondoa; ‘utauangamiza’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: בֵּית אַחְאָב
  choice: ukoo wa Ahabu
  rationale: בֵּית katika muktadha huu ni nyumba kwa maana ya jamaa au nasaba inayotawala. ‘Ukoo’ huwasilisha maana hiyo wazi kuliko ‘nyumba’ bila kuifupisha kuwa watu wa nyumbani pekee.
- source_word: אֲדֹנֶיךָ
  choice: bwana wako
  rationale: Neno hili linamtaja mkuu wa kibinadamu wa Yehu, yaani Ahabu, wala si Mungu; ‘bwana wako’ linafaa katika mazingira ya kifalme na kijeshi.
- source_word: וְנִקַּמְתִּי
  choice: nitalipiza kisasi
  rationale: נקם hapa ni tendo la Mungu la kutoa adhabu ya haki kwa ajili ya waliouawa; usemi huu unabaki na uzito wa kisasi cha kimahakama bila kuupunguza.
- source_word: דְּמֵי
  choice: damu ya
  rationale: Wingi wa Kiebrania ‘damu’ ni nahau ya damu iliyomwagwa au hatia ya mauaji. Kiswahili ‘damu ya’ ni cha kawaida na hudumisha taswira ya chanzo.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: watumishi wangu manabii
  rationale: Kirai kinawatambulisha manabii kuwa watumishi wa Mungu; mpangilio huu ni wa asili na wazi katika Kiswahili.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: watumishi wote wa Yahwe
  rationale: Huhifadhi uhusiano wa umilikaji katika Kiebrania na jina binafsi la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, kwa kufuata ushahidi wa chanzo.
- source_word: מִיַּד אִיזָבֶל
  choice: kwa mkono wa Yezebeli
  rationale: Nahau ya ‘mkono’ inaonyesha uwakala au uwajibikaji wa Yezebeli bila kuamua kimya-kimya kama aliwaua mwenyewe au alisababisha kuuawa kwao.
theological_decisions:
- issue: Lugha ya kisasi cha Mungu
  choice: nitalipiza kisasi kwa ajili ya damu
  alternative: nitatenda haki kwa ajili ya damu
  rationale: Andiko linatumia wazi נקם, yaani kulipiza kisasi au kutoa adhabu ya haki. Tafsiri hailegezi dai hilo la kitheolojia wala kulipanua.
- issue: Kiwango cha uwakala wa Yezebeli
  choice: kwa mkono wa Yezebeli
  alternative: ambayo Yezebeli aliimwaga
  rationale: Nahau ya chanzo inaweza kuonyesha tendo la moja kwa moja au uwajibikaji mpana. Tafsiri inahifadhi uwezekano huo badala ya kudai kwamba Yezebeli mwenyewe aliwaua wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ukoo’ hufafanua maana ya kisiasa na kifamilia ya ‘nyumba,’ huku ‘kwa mkono wa’ ikihifadhi nahau na utata halisi kuhusu namna Yezebeli alivyohusika.
