  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: sw
  text: Basi Yehu akapanda[a], akaenda Yezreeli, kwa sababu Yoramu alikuwa amelala huko; naye Ahazia, mfalme wa Yuda, alikuwa ameshuka kwenda kumwona Yoramu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akapanda.” Kiebrania hakitaji alichokipanda; kitenzi kinatofautishwa na tendo linalofuata la kwenda Yezreeli.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja, “kumwona”; katika muktadha huu inaweza kudokeza kumtembelea au kumjulia hali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: akapanda gari lake
  rationale: Kitenzi רכב humaanisha kupanda au kusafiri juu ya mnyama au chombo cha usafiri. Kiswahili huhitaji kwa kawaida kitu kinachopandwa; muktadha unaonyesha gari la vita, ingawa neno lenyewe halitajwi wazi katika mstari huu.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda; tafsiri hii pia inadumisha tofauti kati ya kupanda na kisha kwenda.
- source_word: יִזְרְעֶאלָה
  choice: Yezreeli
  rationale: Herufi ya mwelekeo mwishoni mwa jina inaonyesha kwenda Yezreeli; katika Kiswahili mwelekeo unaeleweka kutokana na kitenzi 'akaenda'.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inaeleza sababu ya Yehu kwenda Yezreeli.
- source_word: שֹׁכֵב שָׁמָּה
  choice: alikuwa amelala huko
  rationale: Tafsiri ya karibu ya hali ya שכב pamoja na kielezi 'huko'; haiongezi kwa wazi kwamba Yoramu alikuwa kitandani au mahututi.
- source_word: יָרַד
  choice: alikuwa ameshuka
  rationale: Muundo huu unaonyesha tendo lililotangulia kuondoka kwa Yehu na kuhifadhi maana ya kushuka ya ירד.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: kwenda kumwona Yoramu
  rationale: Huhifadhi maana ya moja kwa moja ya 'kumwona,' huku muktadha ukionyesha kuwa ilikuwa ziara ya kumjulia hali.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mnyororo huu wa nomino.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: Yehu / Yoramu / Ahazia / Yezreeli / Yuda
  rationale: Majina yametoholewa kwa tahajia zinazotumika kwa kawaida katika Biblia za Kiswahili.
