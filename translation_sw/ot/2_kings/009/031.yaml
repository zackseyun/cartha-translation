base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: sw
  text: Yehu alipoingia langoni, Yezebeli akasema, “Je, kuna amani,[a] Zimri,[b] muuaji wa bwana wake?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mambo ni salama?”
    reason: lexical_alternative
  - marker: b
    text: Yezebeli anamwita Yehu “Zimri” kwa dhihaka, akimlinganisha na Zimri aliyemuua bwana wake na kutwaa ufalme (tazama 1 Wafalme 16:9–20).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: alipokuwa akiingia langoni
  rationale: Muundo huu unaonyesha Yehu akiwa katika tendo la kuingia kwenye eneo la lango, na unasikika kwa kawaida katika Kiswahili bila kupanua maana ya Kiebrania.
- source_word: וַתֹּאמֶר
  choice: Yezebeli akasema
  rationale: Kitenzi ni cha kike umoja; jina Yezebeli limetolewa wazi kutokana na muktadha ili kuepuka utata wa kiwakilishi katika Kiswahili.
- source_word: הֲשָׁלוֹם
  choice: Je, kuna amani
  rationale: Hifadhi swali fupi na lenye ukali kuhusu amani au hali kuwa salama; maana mbadala ya kuuliza kama mambo ni mema imewekwa katika tanbihi.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Jina limenukuliwa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili. Hapa Yezebeli anamwita Yehu kwa jina la Zimri kwa dhihaka.
- source_word: הֹרֵג
  choice: muuaji wa
  rationale: Nomino hii ya Kiswahili inawasilisha nguvu ya shutuma ya participio ya Kiebrania, yaani ‘anayemuua’ au ‘muuaji.’
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika muktadha huu neno linamaanisha mkuu au mtawala wa kibinadamu, si jina la Mungu; herufi ndogo inahifadhi tofauti hiyo.
theological_decisions:
- issue: Maana ya kumwita Yehu “Zimri, muuaji wa bwana wake”
  choice: Kauli imetafsiriwa kama dhihaka inayomlinganisha Yehu na Zimri wa zamani bila kuongeza ufafanuzi ndani ya mstari.
  alternative: Kuchukulia “Zimri” kana kwamba ni jina halisi la anayezungumziwa, bila kuonyesha dokezo la kihistoria.
  rationale: Muktadha na simulizi la 1 Wafalme 16:9–20 vinaonyesha kwamba Yezebeli anamlinganisha Yehu na Zimri, aliyemuua bwana wake na kutwaa ufalme. Tanbihi inaeleza dokezo hilo huku maandishi makuu yakihifadhi ufupi wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Je, kuna amani” limehifadhi ukali na utata wa שָׁלוֹם, huku “mambo ni salama” likitolewa kama maana mbadala. Alama zote za tanbihi zilizotolewa zinaonekana katika maandishi makuu.
