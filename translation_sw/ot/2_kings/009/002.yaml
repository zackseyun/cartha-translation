base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: sw
  text: Utakapofika huko, mtafute Yehu mwana wa Yehoshafati, mwana wa Nimshi. Ingia, umsimamishe kutoka miongoni mwa ndugu zake, kisha umpeleke katika chumba cha ndani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “chumba ndani ya chumba,” yaani, chumba cha ndani kilicho faraghani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: Utakapofika huko
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kufika kulingana na mtazamo; hapa ‘kufika huko’ huonyesha kwa kawaida kwamba safari inakamilika kabla ya maagizo yanayofuata.
- source_word: וּרְאֵה שָׁם
  choice: mtafute
  rationale: Ingawa ראה kimsingi ni ‘kuona,’ katika agizo hili linalofuatwa na jina la mtu maana ya kimuktadha ni kumtafuta na kumtambua.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: Yehu mwana wa Yehoshafati, mwana wa Nimshi
  rationale: Majina yamenukuliwa kwa tahajia ya Kiswahili, na בן katika mfululizo huu wa ukoo limetafsiriwa moja kwa moja kuwa ‘mwana wa.’
- source_word: וּבָאתָ
  choice: Ingia
  rationale: Matumizi haya ya pili ya בוא yanaelekeza kuingia mahali alipo Yehu kabla ya kumtenga na wenzake.
- source_word: וַהֲקֵמֹתוֹ
  choice: umwinue
  rationale: Hifili ya קום humaanisha kumsababisha mtu ainuke au asimame; ‘umwinue’ huhifadhi kitendo hicho bila kukitafsiri kama uteuzi au kupandishwa cheo.
- source_word: מִתּוֹךְ אֶחָיו
  choice: kutoka miongoni mwa ndugu zake
  rationale: אחים kwa maana ya msingi ni ‘ndugu’; ingawa katika mazingira haya huenda ikawarejelea washirika au wanajeshi wenzake, tafsiri huhifadhi usemi wa chanzo.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: kisha umpeleke
  rationale: Hifili ya בוא inaweza kuwa ‘kuleta’ au ‘kupeleka’ kulingana na mtazamo. Kwa kuwa mjumbe anaagizwa kuondoka pamoja na Yehu kwenda chumba kingine, ‘umpeleke’ ni Kiswahili cha kawaida.
- source_word: חֶדֶר בְּחָדֶר
  choice: katika chumba cha ndani
  rationale: Usemi wa Kiebrania ‘chumba ndani ya chumba’ unaonyesha chumba cha ndani kilicho faraghani; tafsiri kuu ni ya kawaida, huku muundo halisi ukihifadhiwa katika tanbihi.
