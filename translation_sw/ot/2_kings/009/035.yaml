base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: sw
  text: Basi wakaenda kumzika, lakini hawakupata chochote cha mwili wake[a] isipokuwa fuvu, miguu, na viganja vya mikono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “hawakupata ndani yake.” Katika muktadha, usemi huu unamaanisha sehemu zilizobaki za mwili wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Basi wakaenda
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; “Basi wakaenda” ni mtiririko wa kawaida wa Kiswahili unaoonyesha mfuatano.
- source_word: לְקָבְרָהּ
  choice: kumzika
  rationale: Kitenzi קבר chenye kiambishi cha nafsi ya tatu umoja wa kike kinamrejelea Yezebeli; “kumzika” ni usemi wa kawaida na wa moja kwa moja.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: lakini hawakupata chochote kilichobaki mwilini mwake
  rationale: Kiunganishi kimetafsiriwa kwa maana ya upinzani unaofaa muktadha. בָהּ, kihalisi “ndani yake,” hapa kinarejelea mabaki ya mwili wake; tafsiri hii inaweka maana wazi bila kudai kwamba hawakupata sehemu yoyote kabisa.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Jozi hii ya chembe za Kiebrania inaonyesha jambo linalotengwa; “isipokuwa” ni tafsiri fupi na ya kawaida.
- source_word: הַגֻּלְגֹּלֶת
  choice: fuvu la kichwa
  rationale: גֻּלְגֹּלֶת humaanisha fuvu, si kichwa kizima; usemi huu unabaki wazi kwa msomaji wa kawaida.
- source_word: וְהָרַגְלַיִם
  choice: nyayo
  rationale: רַגְלַיִם hapa inataja sehemu za chini za miguu zilizobaki, sambamba na viganja; “nyayo” huhifadhi utofautishaji wa kianatomia unaofaa muktadha.
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: viganja vya mikono
  rationale: כַּפּוֹת ni sehemu tambarare au zenye uvungu za mikono; “viganja vya mikono” huhifadhi umahususi wa Kiebrania.
