id: 2KI.9.9
reference: 2 Kings 9:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: sw
  text: Nami nitaifanya nyumba ya Ahabu iwe kama nyumba ya Yeroboamu mwana wa Nebati, na kama nyumba ya Baasha mwana wa Ahiya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nasaba ya Ahabu ... nasaba ya Yeroboamu ... nasaba ya Baasha.” Neno la Kiebrania “nyumba” hapa linamaanisha ukoo au nasaba ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתִּי
  choice: Nami nitaifanya ... iwe
  rationale: Katika kauli hii ya hukumu, kitenzi נתן pamoja na yambwa na vifungu vya kulinganisha kina maana ya kusababisha nyumba ya Ahabu iwe kama falme zilizotangulia kuangamizwa. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi nguvu ya kisababishi.
- source_word: אֶת
  choice: '[alama ya yambwa dhahiri, haijatafsiriwa]'
  rationale: אֶת ni alama ya yambwa dhahiri katika Kiebrania, hivyo haina neno la pekee katika Kiswahili.
- source_word: בֵּית אַחְאָב
  choice: nyumba ya Ahabu
  rationale: “Nyumba” inahifadhi sitiari ya Kiebrania בַּיִת na hapa humaanisha ukoo wa kifalme; maana hiyo imefafanuliwa katika tanbihi badala ya kubadilishwa kimya kimya kuwa “nasaba.”
- source_word: כְּ/בֵית
  choice: kama nyumba ya
  rationale: Kiambishi כ kinaonyesha ulinganisho; “kama nyumba ya” ni tafsiri wazi na ya kawaida.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya Biblia ya Kiswahili, na uhusiano wa mwana umeonyeshwa moja kwa moja.
- source_word: וּ/כְ/בֵית
  choice: na kama nyumba ya
  rationale: Muundo huu unahifadhi kiunganishi pamoja na ulinganisho na kudumisha usambamba wa sentensi.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baasha mwana wa Ahiya
  rationale: Majina yametoholewa, na kifungu cha ukoo kimetafsiriwa kwa Kiswahili cha kawaida huku dokezo la kihistoria likihifadhiwa.
theological_decisions:
- issue: Tafsiri ya kauli ya hukumu juu ya ukoo wa kifalme
  choice: nyumba ya Ahabu ... kama nyumba ya Yeroboamu ... na kama nyumba ya Baasha
  alternative: nasaba ya Ahabu ... kama nasaba ya Yeroboamu ... na nasaba ya Baasha
  rationale: “Nyumba” inahifadhi lugha ya picha ya Kiebrania na mwangwi wake wa kihistoria kuhusu hukumu ya Mungu juu ya koo za kifalme, bila kuongeza tafsiri ya kimadhehebu. Tanbihi inaeleza maana ya kifalme ya neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “nitaifanya ... iwe” unaeleweka kwa urahisi, huku “nyumba” ikihifadhi sitiari muhimu ya chanzo. Alama ya tanbihi imewekwa baada ya sentensi.
