base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: sw
  text: Yehu alipofika Yezreeli, Yezebeli akasikia habari hiyo. Akapaka wanja machoni pake[a], akapamba kichwa chake[b], kisha akatazama nje kupitia dirishani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kipodozi cheusi kilichopakwa kuzunguka macho.
    reason: cultural_clarification
  - marker: b
    text: Au, “akapanga nywele zake”; Kiebrania kinasema kihalisi, “akafanya kichwa chake kuwa kizuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... יִזְרְעֶאלָה
  choice: alipofika Yezreeli
  rationale: Kiambishi cha mwelekeo katika יִזְרְעֶאלָה kinaonyesha mwendo kuelekea Yezreeli. ‘Alipofika Yezreeli’ ni Kiswahili cha kawaida kinachoonyesha kuwasili bila kulazimisha maana ya kuingia ndani.
- source_word: שָׁמְעָה
  choice: akasikia habari hiyo
  rationale: Kitenzi kina yambwa inayodokezwa na muktadha, yaani habari ya kufika kwa Yehu. ‘Habari hiyo’ huifanya sentensi iwe ya kawaida katika Kiswahili bila kuongeza jambo jipya.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: akapaka wanja machoni pake
  rationale: פּוּךְ ni rangi nyeusi ya mapambo iliyotumiwa kuzunguka macho. ‘Wanja’ ni neno la Kiswahili linaloeleweka kwa kipodozi hicho na linahifadhi tendo halisi la kujipamba macho.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: akapamba kichwa chake
  rationale: Kiebrania husema kihalisi ‘akafanya kichwa chake kuwa kizuri.’ ‘Akapamba kichwa chake’ huhifadhi upana wa usemi huo bila kuufanya umaanishe nywele pekee.
- source_word: וַתַּשְׁקֵף בְּעַד הַחַלּוֹן
  choice: akachungulia nje kupitia dirishani
  rationale: Kitenzi kinaonyesha kutazama kutoka sehemu iliyo juu kupitia uwazi. ‘Kuchungulia nje kupitia dirishani’ huwasilisha mwelekeo na mahali pa kutazamia kwa Kiswahili cha kawaida.
