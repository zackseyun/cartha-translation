translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa masimulizi umetumia mfuatano wa vitenzi kwa ‘aka-’. Jina יֵהוּא limetolewa kama ‘Yehu’ na אִיזֶבֶל kama ‘Yezebeli’ kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
