  edition: WLC
  text: וְ/אָבַ֖ד כָּל בֵּ֣ית אַחְאָ֑ב וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: sw
  text: Na nyumba yote ya Ahabu itaangamia[a], nami nitamkatilia mbali Ahabu kila mwanamume, aliyefungwa na aliyeachwa katika Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno Kiebrania, “kila anayekojoa ukutani,” nahau kali inayomaanisha “kila mwanamume.”
    reason: lexical_alternative
  - marker: b
    text: Maana ya maneno ya Kiebrania yaliyotafsiriwa “aliyefungwa na aliyeachwa” si hakika. Huenda jozi hiyo ikamaanisha watu wa hali zote, kwa mfano “mtumwa na mtu huru.”
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: itaangamia
  rationale: Kauli timilifu ya Kiebrania yenye kiunganishi, katika unabii huu wa hukumu, inaelekeza kwa wakati ujao. “Itaangamia” huhifadhi wazo la kuangamia bila kutaja kwa ziada namna au chombo cha hukumu.
- source_word: כָּל בֵּית אַחְאָב
  choice: nyumba yote ya Ahabu
  rationale: “Nyumba” imehifadhiwa kama nahau ya ukoo wa kifalme au jamaa, yenye umuhimu katika muktadha wa hukumu dhidi ya nasaba.
- source_word: וְהִכְרַתִּי
  choice: nitakatilia mbali
  rationale: Hifili ya כרת ina maana ya kuondoa au kukatilia mbali. Usemi huu wa Kiswahili huhifadhi taswira na uzito wa tamko la hukumu kuliko ufafanuzi mpana kama “nitaangamiza kabisa.”
- source_word: לְאַחְאָב
  choice: kutoka kwa Ahabu
  rationale: Herufi ל hapa huonyesha uhusiano au milki katika kauli hii; pamoja na “nitakatilia mbali,” tafsiri inaonyesha kuwa wanaoondolewa ni wa ukoo au nyumba ya Ahabu.
- source_word: מַשְׁתִּין בְּקִיר
  choice: kila mwanamume
  rationale: Hii ni nahau kali ya Kiebrania inayowarejelea wanaume. Maana yake ya kawaida imewekwa katika matini, huku tafsiri yake ya neno kwa neno ikihifadhiwa katika tanbihi.
- source_word: וְעָצוּר וְעָזוּב
  choice: aliyefungwa na aliyeachwa huru
  rationale: Tafsiri hii huhifadhi ulinganifu wa maneno ya Kiebrania na kutokamilika kwa uhakika wa maana yake. Jozi hii inaonekana kuwajumuisha wanaume wa hali zote, lakini haijalazimishwa kuwa mgawanyo mahususi wa kisheria wa watumwa na watu huru.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: 'Kihusishi kimetafsiriwa kwa maana ya mahali: hukumu inaihusu nyumba ya Ahabu ndani ya Israeli.'
theological_decisions:
- issue: Namna ya kutafsiri tamko la hukumu dhidi ya nasaba
  choice: Kuhifadhi “nyumba ya Ahabu” na “nitakatilia mbali,” lakini kutafsiri nahau inayolenga wanaume kwa “kila mwanamume” katika matini kuu.
  alternative: Kufafanua kwa upana kuwa “nitaangamiza kabisa familia yote ya Ahabu,” au kuweka usemi wa neno kwa neno “kila anayekojoa ukutani” katika matini kuu.
  rationale: Hili ni tamko la hukumu dhidi ya nyumba ya kifalme. “Nyumba” na “katilia mbali” huhifadhi muundo na uzito wa lugha ya Kiebrania, ilhali “kila mwanamume” huwasilisha maana ya nahau waziwazi. Tanbihi hudumisha uwazi kuhusu maneno halisi ya chanzo.
- issue: Maana ya וְעָצוּר וְעָזוּב
  choice: Kuhifadhi jozi kama “aliyefungwa na aliyeachwa huru” na kueleza kutokuwa na uhakika katika tanbihi.
  alternative: Kutafsiri kwa uthabiti zaidi kuwa “mtumwa na mtu huru.”
  rationale: Jozi hiyo ni sehemu ya kauli inayojirudia ya kuondolewa kabisa, lakini maana sahihi ya hali hizo mbili inabishaniwa. Tafsiri haipaswi kuifanya kuwa migawanyo mahususi ya kijamii au kisheria bila ushahidi wa kutosha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa unabii wa hukumu umehifadhiwa bila kutumia lugha ya kale kupita kiasi. Jina “Ahabu” na “Israeli” yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili.
