  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: sw
  text: 'Basi akamtuma mpanda farasi wa pili. Alipowafikia, akasema, “Mfalme asema hivi: ‘Je, kuna amani[a]?’” Lakini Yehu akasema, “Wewe una nini na amani? Geuka, uende nyuma yangu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mambo ni salama?” Neno la Kiebrania שָׁלוֹם linaweza kumaanisha “amani,” “usalama,” au “hali njema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: mpanda farasi wa pili
  rationale: Huhifadhi maana halisi ya mpanda farasi wa pili aliyetumwa, kwa Kiswahili cha kawaida na cha kimasimulizi.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Mfalme asema hivi
  rationale: Huhifadhi mfumo rasmi wa ujumbe wa kifalme huku ukisikika kwa kawaida katika Kiswahili cha Biblia.
- source_word: שָׁלוֹם
  choice: amani
  rationale: Neno linaweza kumaanisha amani, usalama, au hali njema. “Amani” huhifadhi urudiaji wa neno hilo katika swali la mfalme na jibu la Yehu.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Wewe una nini na amani?
  rationale: Huwasilisha kwa ukaribu nahau ya Kiebrania na nguvu yake ya kumkemea au kumfukuza mjumbe bila kuondoa mvutano wa usemi.
- source_word: סֹב אֶל אַחֲרָי
  choice: Geuka, ukae nyuma yangu
  rationale: Hufuata kwa karibu mwelekeo wa Kiebrania, “geuka kuelekea/nyuma yangu,” bila kuongeza wazi wazo la “nifuate,” ingawa muktadha unaweza kulidokeza.
