  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: sw
  text: 'Kisha Yehu akamwambia Bidkari, ofisa wake[a], “Mnyanyue na umtupe katika kipande cha shamba la Nabothi Myezreeli. Kwa maana kumbuka: mimi na wewe tulikuwa tukipanda sambamba[b] nyuma ya Ahabu, baba yake, wakati Yahweh alipotoa tamko hili dhidi yake[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wake wa tatu”; huenda hili lilikuwa jina maalumu la cheo au nafasi ya Bidkari.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “tukipanda kwa jozi”; yaelekea Yehu na Bidkari walikuwa wakipanda pamoja nyuma ya Ahabu.
    reason: lexical_alternative
  - marker: c
    text: Au, “unabii huu” au “mzigo huu.” Neno la Kiebrania humaanisha tamko zito la kinabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: Bidkari
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: שלשה
  choice: ofisa wake
  rationale: Katika muktadha huu neno hilo linaonekana kuwa cheo au kazi ya Bidkari, si tu namba ‘wa tatu’; ‘ofisa wake’ ni wazi bila kubainisha kupita kiasi cheo cha kijeshi kisicho hakika.
- source_word: שָׂא
  choice: Mnyanyue
  rationale: Amri ya נשׂא hapa inahusu kuuinua au kuuchukua mwili ili uondolewe na kutupwa.
- source_word: הַשְׁלִיכֵהוּ
  choice: umtupe
  rationale: Huhifadhi nguvu na uelekevu wa amri ya kumtupa.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: katika sehemu ya shamba
  rationale: ‘Sehemu ya shamba’ huwasilisha חלקה kama kipande maalumu cha ardhi na pia huhifadhi שדה, shamba.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabothi, Myezreeli
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya Kiswahili; jina la mahali limetumiwa kuonyesha asili ya Nabothi.
- source_word: זְכֹר
  choice: Kumbuka
  rationale: Ni amri ya moja kwa moja inayotanguliza sababu ya agizo.
- source_word: רֹכְבִים צְמָדִים
  choice: tulikuwa tukipanda sambamba
  rationale: Kirai halisi kinahusu kupanda ‘kwa jozi’; ‘sambamba’ huwasilisha kuwa Yehu na Bidkari walikuwa pamoja nyuma ya Ahabu bila kulazimisha maelezo yasiyo hakika kuhusu magari yao.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: nyuma ya Ahabu, baba yake
  rationale: Huhifadhi maana ya mahali au ufuatano; ‘baba yake’ anamrejelea Yoramu.
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi ‘Yahwe’, badala ya kubadilishwa kuwa cheo.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: alipotoa tangazo hili zito dhidi yake
  rationale: מַשָּׂא ni tamko la kinabii lenye uzito, mara nyingi la hukumu; ‘tangazo hili zito’ huonyesha uzito huo huku ‘dhidi yake’ ikihifadhi mwelekeo wa hukumu.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni kama jina la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מַשָּׂא katika tamko la kinabii
  choice: tangazo hili zito dhidi yake
  alternative: unabii huu dhidi yake
  rationale: Neno linaweza kumaanisha tamko, unabii, au mzigo wa kinabii. Tafsiri iliyochaguliwa huhifadhi uzito na hali ya hukumu bila kulifungia katika aina moja tu ya ujumbe wa kinabii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa simulizi na amri umehifadhiwa, huku istilahi za kijeshi na za kinabii zisizo hakika zikielezwa katika tanbihi.
