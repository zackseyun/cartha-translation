  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: sw
  text: Akainua uso wake kuelekea dirishani, akasema, “Ni nani aliye pamoja nami? Nani?” Kisha matowashi[a] wawili au watatu wakamtazama kutoka juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafisa wa ikulu”; neno la Kiebrania linaweza kumaanisha matowashi au maafisa wa ikulu, ingawa katika mazingira haya ya jumba la kifalme huenda zaidi linamaanisha matowashi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: Akainua uso wake
  rationale: Inahifadhi taswira ya Kiebrania ya kuinua uso, huku muktadha ukionyesha kwamba alitazama juu.
- source_word: הַחַלּוֹן
  choice: dirishani
  rationale: Ni tafsiri ya kawaida na ya asili katika Kiswahili kwa dirisha la jumba lililokuwa juu yake.
- source_word: מִי אִתִּי מִי
  choice: Ni nani aliye pamoja nami? Nani?
  rationale: Inafuata kwa karibu maana ya ‘pamoja nami’ na kuhifadhi urudiaji wenye msisitizo bila kuufasiri moja kwa moja kuwa ‘upande wangu.’
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: wakamtazama kutoka juu
  rationale: Inaonyesha kwamba maofisa walimtazama kutoka mahali palipoinuka, bila kuongeza wazo lisilo hakika la kuinama au kuchungulia.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: wawili au watatu
  rationale: Ni namna ya kawaida ya Kiswahili ya kueleza jozi hii ya namba ya Kiebrania inayomaanisha idadi ndogo isiyobainishwa kabisa.
- source_word: סָרִיסִים
  choice: matowashi
  rationale: Katika mazingira ya jumba la kifalme, maana ya matowashi ndiyo inayowezekana zaidi; maana pana ya maofisa wa ikulu imehifadhiwa katika tanbihi.
