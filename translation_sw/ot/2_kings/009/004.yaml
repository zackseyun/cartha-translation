  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: sw
  text: Basi yule kijana, yule kijana nabii[a], akaenda Ramoth-gileadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia “yule kijana”: “yule kijana, yule kijana nabii.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Basi ... akaenda
  rationale: Muundo wa waw-consecutive unaendeleza simulizi kwa hatua inayofuata; “Basi ... akaenda” ni mtiririko wa kawaida wa Kiswahili unaohifadhi mfuatano huo.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: Neno נַעַר hapa humtaja kijana aliyetumwa na Elisha. “Kijana” ni tafsiri ya kawaida isiyoongeza wazo la utumishi ambalo halijaonyeshwa wazi na neno lenyewe.
- source_word: הַנַּעַר הַנָּבִיא
  choice: yule nabii kijana
  rationale: Kiebrania kinarudia הַנַּעַר na kisha kinaongeza הַנָּבִיא kwa namna ya ufafanuzi. Tafsiri hii inahifadhi kurudiwa huko na maana iliyo wazi kisarufi kwamba kijana huyo anatambulishwa kuwa nabii, bila kuibadili kuwa “mtumishi wa nabii.”
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Hili ni jina ambatani la mahali; umbo hili la unukuzi linasomeka kwa kawaida katika Kiswahili huku likihifadhi vipengele vyote viwili vya jina la Kiebrania.
theological_decisions:
- issue: Ikiwa kijana huyo mwenyewe anaitwa nabii au ni mtumishi wa nabii
  choice: yule nabii kijana
  alternative: mtumishi wa nabii
  rationale: Muundo wenye viambishi vya uamilifu katika הַנַּעַר הַנָּבִיא hauungi mkono kwa kawaida uhusiano wa umilikaji wa “mtumishi wa nabii.” Tafsiri iliyochaguliwa inafuata ushahidi wa maandishi bila kuingiza hadhi ya utumishi isiyotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kurudiwa kwa maneno ya Kiebrania kumehifadhiwa ingawa si mtindo wa kawaida kabisa wa Kiswahili, kwa sababu kunaonekana kuwa kwa msisitizo na utambulisho.
