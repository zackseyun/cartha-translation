translation:
  language: sw
  text: Wakaharakisha; kila mtu akachukua vazi lake na kuliweka chini yake juu ya ngazi zilizo wazi[a]. Kisha wakapiga pembe[b] na kusema, “Yehu ni mfalme!”
  philosophy: optimal-equivalence
  footnotes:
