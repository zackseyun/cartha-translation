lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: wakafanya haraka
  rationale: Kitenzi מהר kinaonyesha kutenda upesi; usemi huu ni wa kawaida katika Kiswahili na unadumisha mwitikio wao wa mara moja.
- source_word: אִישׁ בִּגְדוֹ
  choice: kila mtu akachukua vazi lake
  rationale: אִישׁ imetumika kwa maana ya kugawa tendo kwa kila mmoja, na בגד ni neno pana linalomaanisha vazi.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: kuliweka chini yake
  rationale: Kiwakilishi cha kitu kinarejelea vazi, huku 'yake' kikirejelea Yehu; tafsiri hii haiongezi maelezo yasiyothibitishwa kuhusu jinsi mavazi yalivyotandazwa.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: juu ya ngazi zilizo wazi
  rationale: Usemi huu wa Kiebrania ni adimu na maana yake sahihi haijulikani; chaguo hili linaakisi uwezekano wa uso ulio wazi wa ngazi bila kuficha utata huo.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: wakapiga pembe
  rationale: שׁוֹפָר ni ala ya pembe iliyotumiwa kutoa ishara. 'Pembe' ni ya asili na inayoeleweka, bila kudai kwamba lazima ilikuwa pembe ya kondoo dume.
- source_word: מָלַךְ יֵהוּא
  choice: Yehu ni mfalme
  rationale: Ingawa kitenzi timilifu kinaweza kueleza kutawazwa au kuanza kutawala, katika tangazo hili Kiswahili cha moja kwa moja 'ni mfalme' kinatoa vizuri nguvu ya tamko la kumtangaza.
