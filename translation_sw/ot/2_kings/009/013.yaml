    text: Au “juu kabisa ya ngazi” au “kwenye sehemu tambarare ya ngazi”; usemi wa Kiebrania ni adimu, na maana yake sahihi haijulikani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania shofar, pembe iliyotumiwa kutoa ishara; kwa kawaida hutafsiriwa “tarumbeta.”
