base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: sw
  text: Mfalme Yehoramu alikuwa amerudi Yezreeli ili apone majeraha ambayo Waaramu walikuwa wamemsababishia alipokuwa akipigana na Hazaeli, mfalme wa Aramu. Yehu akasema, “Ikiwa ndivyo mnavyotaka, mtu yeyote asitoroke kutoka mjini kwenda kutoa habari huko Yezreeli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: alikuwa amerudi
  rationale: Wakati timilifu wa zamani unaonyesha kwamba kurudi kwa Yehoramu kulikuwa kumetokea kabla ya maneno ya Yehu; שוב humaanisha kurudi.
- source_word: לְהִתְרַפֵּא
  choice: ili apone
  rationale: Muundo wa kitenzi רפא hapa unaeleza kupona kutokana na majeraha, bila kudokeza kwamba alijiponya mwenyewe.
- source_word: מִן הַמַּכִּים אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: majeraha aliyotiwa na Waaramu
  rationale: Ingawa מכים kwa msingi ni mapigo, muktadha wa vita na kupona unaonyesha majeraha; נכה inaeleza kuyasababisha kwa kumpiga.
- source_word: אֲרַמִּים
  choice: Waaramu
  rationale: Jina hili linahifadhi utambulisho wa kihistoria wa watu wa Aramu badala ya kutumia jina la baadaye la Wasiria.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: alipokuwa akipigana na Hazaeli
  rationale: Kiambishi ב pamoja na kitenzi-jina kinaonyesha mazingira au wakati wa mapigano; Kiswahili hiki ni cha kawaida na kinaonyesha uadui wa pande hizo.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: Ikiwa ndivyo mnavyotaka
  rationale: Nahau hii inaeleza nia au matakwa ya kundi; tafsiri hii ni wazi na ya kawaida bila kutafsiri נֶפֶשׁ kwa neno halisi lisilofaa katika muktadha.
- source_word: אַל יֵצֵא פָלִיט מִן הָעִיר
  choice: mtu yeyote asitoroke kutoka mjini
  rationale: פָלִיט hapa humaanisha mtu atakayefanikiwa kuponyoka, si lazima mtu ambaye tayari ana hadhi ya mkimbizi.
- source_word: לָלֶכֶת לְהַגִּיד בְּיִזְרְעֶאל
  choice: kwenda kutoa habari huko Yezreeli
  rationale: Vitenzi-jina viwili vinaeleza kwenda mahali ili kufikisha taarifa; 'huko' huonyesha kwamba Yezreeli ndilo eneo la kufikisha habari.
