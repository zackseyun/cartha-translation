source:
  edition: WLC
  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: sw
  text: “Hakika, jana niliona damu ya Nabothi na damu ya wanawe,” asema Yahweh[a], “nami nitakulipa katika kipande hiki cha ardhi,” asema Yahweh. “Basi sasa, mwinue umtupe katika kipande hiki cha ardhi, sawasawa na neno la Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naam, jana niliona damu ya Nabothi na damu ya wanawe.” Nahau ya Kiebrania mwanzoni ni tamko lenye msisitizo linalofanana na kiapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Hakika
  rationale: Nahau hii hapa ni tamko lenye msisitizo, linalofanana na kiapo, wala si sentensi ya sharti; “Hakika” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: דְּמֵי
  choice: damu
  rationale: Wingi wa Kiebrania “damu za” ni nahau inayohusu damu iliyomwagika au hatia ya mauaji; Kiswahili hutumia “damu” kwa kawaida huku maana ya vifo vya kikatili ikibaki wazi katika muktadha.
- source_word: נָבוֹת
  choice: Nabothi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בָנָיו
  choice: wanawe
  rationale: Kiebrania kinataja wana wa kiume hasa; “wanawe” huhifadhi umahususi huo bila kulipanua kuwa watoto kwa ujumla.
- source_word: רָאִיתִי
  choice: niliiona
  rationale: Kitenzi cha nafsi ya kwanza umoja katika wakati timilifu, pamoja na “jana,” kinaelezwa kwa wakati uliopita wa Kiswahili; kiambishi cha ngeli katika “niliiona” kinarejelea damu.
- source_word: אֶמֶשׁ
  choice: jana
  rationale: Neno linaweza kurejelea siku au usiku uliotangulia; “jana” ndiyo tafsiri pana na isiyoongeza ufafanuzi usiotolewa na matini.
- source_word: נְאֻם יְהוָה
  choice: asema Yahweh
  rationale: Hii ni fomula nzito ya tangazo la kinabii; “asema Yahweh” ni ya asili, yenye hadhi, na inaeleweka kwa wasomaji wa sasa.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: nami nitakulipa kisasi
  rationale: Piel ya שלם hapa ina maana ya kulipiza au kutoa malipo ya hukumu; kuongeza “kisasi” hufanya maana ya adhabu iwe wazi kwa Kiswahili bila kutumia usemi wa mazungumzo mno.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: katika kipande hiki cha ardhi
  rationale: חֶלְקָה ni sehemu au kipande maalumu cha ardhi; tafsiri hii ni sahihi na inafaa muktadha wa shamba la mizabibu la Nabothi.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Usemi huu unahamisha hotuba kutoka tangazo la Mungu kwenda amri inayotokana nalo; “Basi sasa” huhifadhi uhusiano huo wa matokeo.
- source_word: שָׂא
  choice: mwinue
  rationale: Amri hii kimsingi ni kuinua au kuchukua; “mwinue” hukaa karibu na Kiebrania na inafaa kwa kuinua mwili.
- source_word: הַשְׁלִכֵהוּ
  choice: umtupe
  rationale: Amri yenye kiambishi cha yambwa ina maana ya kumtupa; “umtupe” ni ya moja kwa moja na ya asili katika simulizi.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahweh
  rationale: Tafsiri hii huhifadhi uhusiano wa tendo hilo na tamko la Yahweh bila kufafanua zaidi ya matini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Kuhifadhi umahususi wa בָנָיו katika muktadha wa hukumu
  choice: wanawe
  alternative: watoto wake
  rationale: Kiebrania kinataja wana wa kiume hasa, kwa hiyo tafsiri hailifanyi neno hilo kuwa la jumla zaidi.
- issue: Maana ya malipo katika וְשִׁלַּמְתִּי לְךָ
  choice: nitakulipa kisasi
  alternative: nitakulipa; nitakulipiza
  rationale: Muktadha ni wa hukumu ya Mungu kwa damu iliyomwagika. Tafsiri hii huonyesha malipo ya adhabu bila kuondoa mvutano wa tamko la kimahakama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi marudio ya “asema Yahweh” na “kipande hiki cha ardhi” kwa sababu marudio hayo yana uzito wa kimahakama na yanaunganisha hukumu na mahali pa kosa.
