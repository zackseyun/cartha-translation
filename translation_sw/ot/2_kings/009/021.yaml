base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: sw
  text: Ndipo Yoramu akasema, “Funga farasi kwenye gari!” Naye akafunga farasi kwenye gari lake.[a] Kisha Yoramu, mfalme wa Israeli, na Ahazia, mfalme wa Yuda, wakaondoka, kila mmoja akiwa katika gari lake, kwenda kukutana na Yehu. Wakampata katika sehemu ya shamba la Nabothi, Myezreeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema rasmi, “naye akafunga gari lake,” kwa kitenzi cha nafsi ya tatu umoja. Katika muktadha, huenda anayetekeleza amri ni mtumishi wa gari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: Fungia gari farasi!
  rationale: Kitenzi cha amri אסר katika muktadha wa gari kinamaanisha kufunga farasi au wanyama wa kuvuta kwenye gari. Usemi huu ni mfupi, wa kawaida, na unaonyesha uharaka wa amri.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: Gari lake likafungiwa farasi
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja wa kiume, lakini muktadha unaelekea kuonyesha kuwa mhudumu alitekeleza amri. Kauli tendwa ya Kiswahili ni ya asili na haidai kwamba mfalme mwenyewe ndiye aliyefanya kazi hiyo.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: kila mmoja katika gari lake
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo, ikionyesha kwamba kila mfalme alikuwa katika gari lake mwenyewe.
- source_word: לִקְרַאת יֵהוּא
  choice: kwenda kukutana na Yehu
  rationale: Usemi huu kwa kawaida humaanisha kutoka kwenda kukutana na mtu. Tafsiri hii ni wazi na haiongezi kama mkutano huo ulikuwa wa kirafiki au wa uhasama.
- source_word: וַיִּמְצָאֻהוּ
  choice: Wakampata
  rationale: מצא katika simulizi inaweza kumaanisha kumpata au kukutana naye. “Wakampata” ni ya moja kwa moja na huiwachia muktadha kueleza hali ya mkutano.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: katika kiwanja cha Nabothi
  rationale: חֶלְקָה ni sehemu maalumu ya ardhi au mali. “Kiwanja” ni Kiswahili cha kawaida kinachohifadhi wazo la eneo la ardhi linalomilikiwa, muhimu kwa simulizi la Nabothi.
- source_word: הַיִּזְרְעֵאלִי
  choice: Myezreeli
  rationale: Jina hili la mahali lililotumika kumtambulisha Nabothi limehifadhiwa kwa umbo la kawaida la Kiswahili linalomaanisha mtu wa Yezreeli.
theological_decisions: []
