  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Majina yametolewa katika maumbo yanayotambulika kwa urahisi katika matumizi ya Biblia ya Kiswahili: Yoramu, Ahazia, Yehu, Nabothi, na Myezreeli.'
