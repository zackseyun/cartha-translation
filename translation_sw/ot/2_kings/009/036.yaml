base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: sw
  text: 'Basi wakarudi wakamwambia, naye akasema, “Hili ni neno la Yahweh, alilosema kupitia mtumishi wake Eliya Mtishbi: ‘Katika eneo la Yezreeli[a], mbwa watakula nyama ya Yezebeli.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika sehemu ya Yezreeli” au “katika kipande cha ardhi cha Yezreeli”; neno la Kiebrania linaweza kumaanisha sehemu au kipande fulani cha ardhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: Basi wakarudi wakamwambia
  rationale: Inafuata mfululizo wa simulizi wa vitenzi vya Kiebrania kwa Kiswahili cha kawaida na wazi.
- source_word: דְּבַר יְהוָה הוּא
  choice: Hili ni neno la Yahwe
  rationale: Inadumisha msisitizo wa kishazi kisicho na kitenzi na kulitaja neno hilo moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: בְּיַד עַבְדּוֹ
  choice: kupitia mtumishi wake
  rationale: Nahau ya Kiebrania inaonyesha uwakala; ‘kupitia’ huwasilisha maana hiyo kwa Kiswahili cha asili bila kuleta picha isiyokusudiwa ya mkono halisi.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: Eliya Mtishbi
  rationale: Majina na jina la mahali/utambulisho wa mhusika yametolewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: Katika eneo la Yezreeli
  rationale: חֵלֶק inaweza kumaanisha sehemu, kipande, au eneo la ardhi; ‘eneo’ ni wazi na halibani maana bila lazima.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: mbwa wataila
  rationale: ‘Kula’ ni maana ya moja kwa moja na inadumisha ukali wa unabii bila kuongeza wazo la ‘kurarua’ au ‘kutafuna’.
- source_word: בְּשַׂר אִיזָבֶל
  choice: nyama ya Yezebeli
  rationale: ‘Nyama’ inalingana kwa karibu na בָּשָׂר na kuhifadhi hali halisi na ya kutisha ya hukumu iliyotabiriwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Namna Mungu alivyotoa neno kupitia nabii
  choice: alilosema kupitia mtumishi wake
  alternative: alilosema kwa mkono wa mtumishi wake
  rationale: Chaguo hili linahifadhi wazo la nabii kuwa wakala wa Mungu huku likitumia Kiswahili cha kawaida; haliongezi fundisho kuhusu namna ya uvuvio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa simulizi la Biblia, wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Jina ‘Yahwe’ limetumiwa kwa יְהוָה, na ukali wa kauli kuhusu nyama ya Yezebeli umehifadhiwa.
