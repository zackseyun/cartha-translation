base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: sw
  text: 'Nao wakasema, “Uongo! Tafadhali tuambie.” Basi akasema, “Aliniambia hivi na hivi[a], akisema, ‘Yahweh asema hivi: Nimekutia mafuta uwe mfalme juu ya Israeli.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hivi na hivi,” nahau inayotoa muhtasari usio kamili au usio wazi; pia yaweza kutafsiriwa “mambo fulani fulani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Uongo!
  rationale: Nomino hii ina maana ya ‘uongo’ au ‘jambo lisilo kweli.’ Kauli fupi ya Kiswahili ‘Uongo!’ inadumisha shutuma kwamba Yehu anaficha ujumbe.
- source_word: הַגֶּד נָא לָנוּ
  choice: Tafadhali tuambie
  rationale: Kitenzi cha amri kinamaanisha ‘sema/eleza,’ na נָא huonyesha ombi lenye adabu au msisitizo. Tafsiri hii ni ya kawaida na ya sasa.
- source_word: כָּזֹאת וְכָזֹאת
  choice: mambo haya na haya
  rationale: Nahau hii inatoa muhtasari usio kamili au usiotaja maneno yote. Kiswahili hiki kinahifadhi kutokuwa bayana bila kudai kuwa ni nukuu ya neno kwa neno.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Hii ni fomula ya kawaida ya ujumbe wa kinabii; mpangilio huu ni wa asili katika Kiswahili na unadumisha uzito wake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama ‘Yahweh,’ si cheo mbadala.
- source_word: מְשַׁחְתִּיךָ
  choice: Nimekutia mafuta
  rationale: Kitenzi משׁח kinamaanisha kutia mafuta kwa ajili ya kuwekwa rasmi. Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika.
- source_word: לְמֶלֶךְ
  choice: uwe mfalme
  rationale: Kihusishi kinaonyesha kuwekwa katika wadhifa. ‘Uwe mfalme’ ni Kiswahili cha asili kinachoeleza uteuzi huo.
- source_word: אֶל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Katika muktadha wa ufalme, maana ni mamlaka ya kutawala Israeli, si mwendo kuelekea Israeli.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kutia mafuta
  choice: Nimekutia mafuta uwe mfalme
  alternative: Nimekuweka wakfu kuwa mfalme
  rationale: ‘Kutia mafuta’ huhifadhi picha halisi na maana ya kifalme na kitheolojia ya משׁח bila kuipanua kuwa istilahi ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo yamewekwa kwa ufupi na kwa kawaida; fomula ya kinabii imehifadhiwa kwa uzito wake.
