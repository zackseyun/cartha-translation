  text: Ndipo Yehoramu akageuza mikono yake, akakimbia[a], akamwambia Ahazia, “Usaliti[b], Ahazia!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akageuza mikono yake kuelekea upande mwingine.” Huenda usemi huu unamaanisha kwamba aligeuza gari lake la vita kwa kutumia hatamu, lakini Kiebrania hakitaji wazi hatamu wala gari hapa.
    reason: lexical_alternative
  - marker: b
