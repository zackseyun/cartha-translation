translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. “Na tazama” huhifadhi msisitizo wa Kiebrania; “makamanda” na “ujumbe” ni maneno ya sasa na yaliyo wazi.
