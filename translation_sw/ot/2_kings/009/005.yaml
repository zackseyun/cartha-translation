base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: sw
  text: Basi akaja, na tazama, makamanda wa jeshi walikuwa wameketi. Akasema, “Nina ujumbe[a] kwa ajili yako, kamanda.” Yehu akauliza, “Kwa nani miongoni mwetu?” Akajibu, “Kwako, kamanda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nina neno kwako, kamanda.” Kiebrania hutumia “neno,” yaani ujumbe au jambo la kusema.
    reason: Huhifadhi mbadala wa kileksika wa דָּבָר na kueleza matumizi yake ya kimuktadha bila kulazimisha muundo wa nahau ya Kiebrania katika Kiswahili.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Basi akaingia
  rationale: Kitenzi בוא kinaendeleza simulizi na katika muktadha huu kinaeleza kuingia kwake mahali makamanda walipokuwa; “basi” huleta mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: “Tazama” huhifadhi nguvu ya הִנֵּה ya kuvuta fikira na kuwasilisha mandhari kwa uhai, ingawa ni ya mtindo wa juu kidogo.
- source_word: שָׂרֵי הַחַיִל
  choice: makamanda wa jeshi
  rationale: Katika muktadha wa kijeshi, שָׂרִים ni viongozi au makamanda, na הַחַיִל hapa ni jeshi.
- source_word: יֹשְׁבִים
  choice: walikuwa wameketi
  rationale: Huhifadhi hali inayoendelea inayoonyeshwa na umbo la kitenzi tegemezi cha Kiebrania na kuweka mandhari kwa Kiswahili cha kawaida.
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: Nina ujumbe kwa ajili yako
  rationale: Kirai cha Kiebrania kwa maana halisi ni karibu na “neno liko kwangu kwa ajili yako,” lakini maana yake ya kawaida ni kwamba msemaji ana ujumbe unaomlenga msikilizaji.
- source_word: הַשָּׂר
  choice: kamanda
  rationale: Ni neno la kumwita kiongozi wa kijeshi moja kwa moja; “kamanda” ni wazi na la kisasa katika muktadha huu.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: Kwa yupi kati yetu?
  rationale: Huonyesha swali la Yehu kuhusu ni mtu gani miongoni mwa makamanda waliokusanyika aliyelengwa.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: Kwa ajili yako, kamanda
  rationale: Jibu linarudia kwa uwazi kwamba ujumbe unamlenga Yehu, huku likihifadhi namna ya kumwita kama kiongozi wa kijeshi.
