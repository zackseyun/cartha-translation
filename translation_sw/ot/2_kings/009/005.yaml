  to: Basi akaja, na tazama, makamanda wa jeshi walikuwa wameketi. Akasema, “Nina ujumbe[a] kwa ajili yako, kamanda.” Yehu akauliza, “Kwa nani miongoni mwetu?” Akajibu, “Kwako, kamanda.”
