base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: sw
  text: Kisha akaingia ndani, akala na kunywa. Halafu akasema, “Tafadhali mshughulikieni huyu mwanamke aliyelaaniwa[a] na kumzika, kwa maana yeye ni binti wa mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huyu aliyelaaniwa.”
    reason: Kiebrania kina umbo la kike “aliyelaaniwa” bila nomino iliyoandikwa wazi; “mwanamke” imetolewa katika maandishi makuu kwa ufafanuzi.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaingia ndani
  rationale: Katika muktadha huu בוא inaonyesha kuingia ndani baada ya kifo cha Yezebeli; “akaingia ndani” ni ya kawaida na inaweka wazi mwendo huo.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: akala na kunywa
  rationale: Vitenzi hivyo havina yambwa katika Kiebrania, kwa hiyo tafsiri haiongezi chakula, divai, au kitu kingine.
- source_word: פִּקְדוּ נָא
  choice: Tafadhali mshughulikieni
  rationale: פקד hapa ni agizo la kuwajibikia au kushughulikia mabaki ya Yezebeli; wingi wa amri umehifadhiwa, na נָא imetafsiriwa kwa “tafadhali.”
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: huyu mwanamke aliyelaaniwa
  rationale: Umbo la kike linamrejelea Yezebeli. Neno “mwanamke” limewekwa wazi kwa Kiswahili cha kawaida, huku “aliyelaaniwa” likihifadhi maana ya kuwa chini ya laana.
- source_word: וְקִבְרֻהָ
  choice: na kumzika
  rationale: Hii ni amri yenye kiambishi cha nafsi ya tatu, kike, umoja; “kumzika” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: kwa maana yeye ni binti wa mfalme
  rationale: Kishazi kinatoa sababu ya maziko na kinadumisha hadhi yake ya kifalme bila kumtaja mfalme fulani ambaye maandishi hayamtaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na heshima ya masimulizi. Kiunganishi cha mfululizo “aka-” kimetumiwa kuhifadhi mwendo wa simulizi, na lugha haiongezi kitu alichokunywa wala utambulisho wa mfalme.
