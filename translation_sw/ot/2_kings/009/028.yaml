    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: wakamsafirisha
  rationale: Hifili ya רכב kihalisi ni ‘kumpandisha’ au ‘kumfanya asafiri’; kwa kuwa Ahazia alikuwa amekufa, ‘wakamsafirisha’ huonyesha kuuhamisha mwili wake bila kudokeza kwamba alikuwa hai.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עבד humaanisha mtumishi na katika muktadha wa kifalme inaweza pia kuwahusu wahudumu au maafisa wa mfalme. ‘Watumishi wake’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: יְרוּשָׁלָמָה
  choice: hadi Yerusalemu
  rationale: Kiambishi cha mwelekeo kinaonyesha mwendo kuelekea Yerusalemu; ‘hadi Yerusalemu’ ni usemi wa kawaida wa Kiswahili.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: wakamzika
  rationale: Hutafsiri kwa ufupi na kwa kawaida kitenzi chenye yambwa; watumishi wake wanaendelea kuwa kiima kinachoeleweka.
- source_word: בִּקְבֻרָתוֹ
  choice: katika kaburi lake
  rationale: Nomino inaonyesha mahali pake pa kuzikwa. ‘Kaburi lake’ ni ya asili katika Kiswahili na inafaa muktadha wa kifalme.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Huhifadhi nahau ya Kiebrania na maana yake ya ukoo wa kifalme bila kuifafanua kupita kiasi katika matini kuu.
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Ni tafsiri ya moja kwa moja ya jina la mahali; herufi kubwa hutambulisha jina maalumu.
