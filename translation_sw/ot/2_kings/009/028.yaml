  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: sw
  text: Watumishi wake wakamsafirisha kwenda Yerusalemu, wakamzika katika kaburi lake pamoja na baba zake katika mji wa Daudi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakambeba kwenda Yerusalemu”; kitenzi cha Kiebrania kihalisi kina maana ya “walimpandisha” au “walimfanya apande.”
    reason: lexical_alternative
  - marker: b
