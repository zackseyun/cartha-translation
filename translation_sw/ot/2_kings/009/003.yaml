base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: sw
  text: 'Kisha chukua chupa ndogo ya mafuta, uyamimine kichwani mwake, useme, “Yahweh asema hivi: ‘Nimekutia mafuta uwe mfalme juu ya Israeli[a].’” Kisha ufungue mlango, ukimbie; usikawie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa maana halisi zaidi: “kwa Israeli”; katika fomula hii ya kumweka mfalme, maana ni “juu ya Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַךְ
  choice: chupa ndogo
  rationale: Neno hili humaanisha chombo kidogo cha kuhifadhia kimiminika. “Chupa ndogo” ni usemi wa kawaida unaoonyesha ukubwa wake bila kudokeza umbo lisilotajwa.
- source_word: הַשֶּׁמֶן
  choice: mafuta
  rationale: Kiebrania kinasema tu “mafuta”; hakitaji wazi kuwa ni mafuta ya zeituni, hivyo tafsiri haiongezi maelezo hayo.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: uyamimine kichwani mwake
  rationale: Hutoa kwa kawaida tendo la kumimina mafuta juu ya kichwa chake.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Huhifadhi mtindo rasmi wa fomula ya ujumbe wa kinabii huku ikisomeka kwa Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne linatolewa kama jina binafsi “Yahweh,” si kubadilishwa na cheo.
- source_word: מְשַׁחְתִּיךָ
  choice: Nimekutia mafuta
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo lililotekelezwa, na pia inafaa katika tangazo la uteuzi linaloambatana na upako.
- source_word: לְמֶלֶךְ
  choice: uwe mfalme
  rationale: Kiambishi ל kinaonyesha kuteuliwa kwa wadhifa; “uwe mfalme” ni Kiswahili cha kawaida na wazi.
- source_word: אֶל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Ingawa אֶל kwa msingi huelekea kumaanisha “kwa/kuelekea,” katika fomula hii ya kumweka mfalme inaonyesha mamlaka yake ya kutawala Israeli.
- source_word: וּפָתַחְתָּ הַדֶּלֶת
  choice: Kisha ufungue mlango
  rationale: “Kisha” huonyesha wazi hatua inayofuata katika mfululizo wa maagizo.
- source_word: וְנַסְתָּה
  choice: ukimbie
  rationale: Kitenzi נוס kinaeleza kuondoka upesi ili kujiepusha na hatari; “ukimbie” huhifadhi uharaka huo.
- source_word: וְלֹא תְחַכֶּה
  choice: usikawie
  rationale: Katika muktadha huu maana ni kutobaki au kutochelewa; “usikawie” ni fupi, ya kawaida, na yenye uzito wa agizo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia jina la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha na cheo.
- issue: Uhusiano wa mfalme na Israeli katika אֶל יִשְׂרָאֵל
  choice: juu ya Israeli
  alternative: kwa Israeli
  rationale: Katika fomula ya uteuzi wa kifalme, maana inayolengwa ni mamlaka ya kutawala Israeli. Tanbihi huhifadhi ufahamu wa maana halisi zaidi ya kihusishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kinabii lakini kinachoeleweka kwa urahisi. Mfululizo wa vitenzi vya kutegemeana unaonyesha maagizo ya haraka na yanayofuatana. Alama ya tanbihi imewekwa baada ya “Israeli,” mahali inapohusika kimaana.
