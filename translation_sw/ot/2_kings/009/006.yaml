base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: sw
  text: 'Basi akainuka, akaingia ndani ya nyumba, akamimina mafuta juu ya kichwa chake, kisha akamwambia, “Yahweh, Mungu wa Israeli, asema hivi: ‘Nimekutia mafuta[a] uwe mfalme juu ya watu wa Yahweh, yaani Israeli.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninakutia mafuta uwe mfalme juu ya watu wa Yahweh, yaani Israeli.” Kauli timilifu ya Kiebrania inaweza kueleweka kuwa tamko tendaji katika fomula hii ya kumtia mtu mafuta.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mfululizo wa masimulizi kinaonyesha kuinuka ili kutenda jambo linalofuata; “akainuka” ni Kiswahili cha kawaida na chenye heshima.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: akaingia ndani ya nyumba
  rationale: בוא pamoja na kiambishi cha mwelekeo kwenye בַּיִת huonyesha kusogea kuingia nyumbani; tafsiri hii inaweka wazi mwelekeo huo.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: akamimina mafuta juu ya kichwa chake
  rationale: יצק ni “kumimina,” na אֶל רֹאשׁוֹ hapa inaonyesha mafuta yakimiminwa juu ya kichwa chake katika tendo la kumtia mafuta.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni fomula ya kawaida ya mjumbe wa kinabii; wakati uliopo katika Kiswahili huwasilisha kwa kawaida ujumbe wenye mamlaka unaotangazwa sasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa moja kwa moja kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo wa kimilikishi wa Kiebrania umetafsiriwa moja kwa moja na kwa Kiswahili cha asili.
- source_word: מְשַׁחְתִּיךָ
  choice: Nimekutia mafuta
  rationale: Kauli timilifu ya Kiebrania inalingana na tendo lililokamilika la kumimina mafuta, huku muktadha ukibakiza nguvu yake ya kumweka rasmi.
- source_word: לְמֶלֶךְ
  choice: uwe mfalme
  rationale: Baada ya משׁח, לְמֶלֶךְ huonyesha cheo au matokeo ya kutiwa mafuta; “uwe mfalme” ni usemi wa kawaida wa Kiswahili.
- source_word: אֶל עַם יְהוָה
  choice: juu ya watu wa Yahweh
  rationale: Katika muktadha wa kumweka mfalme, אֶל inaonyesha eneo la mamlaka; “juu ya” huwasilisha utawala bila kuongeza maelezo yasiyokuwapo.
- source_word: אֶל יִשְׂרָאֵל
  choice: yaani, juu ya Israeli
  rationale: Kirai hiki kinafafanua kwamba watu wa Yahweh wanaotajwa hapa ni Israeli; “yaani” huonyesha uhusiano huo wa ufafanuzi.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina maalumu la Mungu, יהוה. “Yahweh” hulihifadhi kama jina bila kulibadilisha kuwa cheo au kuingiza mapokeo ya dhehebu.
- issue: Nguvu ya kauli מְשַׁחְתִּיךָ
  choice: Nimekutia mafuta
  alternative: Ninakutia mafuta
  rationale: Kauli timilifu inaweza kurejelea tendo lililofanyika mara hiyo, lakini katika fomula hii pia inaweza kuwa tamko tendaji linalomweka Yehu rasmi. Tafsiri kuu inalinda hali ya tendo kukamilika, na tanbihi inahifadhi uwezekano wa maana tendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa vitenzi vya masimulizi umetolewa kwa viambishi vya “aka-,” huku “kisha” ikisaidia mtiririko wa kawaida. Alama ya tanbihi imewekwa kwenye kirai husika cha kutiwa mafuta, si baada ya “nyumba.”
