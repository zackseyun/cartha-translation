translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na heshima. Nahau ya Kiebrania imewasilishwa kwa taswira inayoeleweka badala ya usemi wa kale usio wa kawaida; tanbihi inadumisha umbo lake halisi.
