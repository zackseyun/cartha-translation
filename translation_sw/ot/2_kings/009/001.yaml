source:
  edition: WLC
  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: sw
  text: Kisha nabii Elisha akamwita mmoja wa wana wa manabii[a] na kumwambia, “Jifunge viuno vyako[b], chukua chupa hii ya mafuta mkononi mwako, uende Ramoth-gileadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wana wa manabii” ni washiriki wa kundi la manabii au wanafunzi wao, si lazima wana wao wa kuzaa.
    reason: cultural_note
  - marker: b
    text: Kwa maana halisi, “funga viuno vyako.” Hii ni nahau inayomaanisha kujiandaa kutenda au kusafiri kwa kuikusanya na kuifunga nguo ndefu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: Kisha nabii Elisha
  rationale: Kiunganishi kinaendeleza simulizi; “Kisha” kinaonyesha mfuatano kwa Kiswahili cha kawaida, huku cheo cha Elisha kikihifadhiwa.
- source_word: קָרָא לְאַחַד
  choice: akamwita mmoja
  rationale: Kitenzi קרא kina maana ya kumwita; muundo huu unaunganika kwa kawaida na kirai kinachofuata cha kuonyesha mmoja kutoka katika kundi.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: wa wana wa manabii
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania, huku tanbihi ikifafanua kuwa ni washiriki wa kundi la kinabii, si lazima watoto wao wa kuzaa.
- source_word: וַיֹּאמֶר לוֹ
  choice: na kumwambia
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kuanzisha maneno aliyoambiwa mtu huyo.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Jifunge nguo yako kiunoni
  rationale: Kauli hii inawasilisha tendo halisi lililokusudiwa na nahau ya Kiebrania—kuikusanya na kuifunga nguo ili kuwa tayari kutenda au kusafiri—kwa Kiswahili kinachoeleweka.
- source_word: וְקַח
  choice: chukua
  rationale: Ni amri ya moja kwa moja na ya kawaida.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: chupa hii ya mafuta
  rationale: פַּךְ ni chombo kidogo cha kubebea kimiminika, hasa mafuta; “chupa” ni neno la kawaida na linafaa katika muktadha huu.
- source_word: בְּיָדֶךָ
  choice: mkononi mwako
  rationale: Inahifadhi usemi halisi na wa wazi wa Kiebrania badala ya kuupanua kuwa “pamoja nawe.”
- source_word: וְלֵךְ
  choice: uende
  rationale: Inaendeleza mfululizo wa amri kwa Kiswahili cha asili.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Hili ni umbo la jina la mahali lililozoeleka katika Kiswahili cha Biblia, likikaribiana na matamshi ya jina la Kiebrania.
