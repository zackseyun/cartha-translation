translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka. Neno ‘amani’ limerudiwa ili kuhifadhi mchezo wa kimatini wa שָׁלוֹם. Kiwakilishi katika ‘kumlaki’ kimefafanuliwa kuwa ‘Yehu’ kwa uwazi wa kawaida wa Kiswahili.
