base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: sw
  text: 'Basi yule mpanda farasi akaenda kumlaki Yehu, akasema, “Mfalme asema hivi: ‘Je, kuna amani?’” Yehu akamjibu, “Wewe una nini na amani? Geuka, unifuate nyuma yangu.[a]” Kisha mwangalizi akaripoti, “Mjumbe amewafikia, lakini hajarudi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “Geuka kuelekea nyuma yangu.” Inaweza kumaanisha, “Jiunge nami kwa kunifuata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: mpanda farasi
  rationale: Ni tafsiri ya asili na ya kawaida ya ‘mpandaji wa farasi’ katika Kiswahili, na inafaa muktadha wa mjumbe wa kijeshi.
- source_word: לִקְרָאתוֹ
  choice: kملaki Yehu
  rationale: Kitenzi ‘kulaki’ huonyesha kwenda kukutana na mtu anayekuja; jina ‘Yehu’ linaweka wazi kiwakilishi cha Kiebrania bila kubadili maana.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Mfalme asema hivi
  rationale: Huhifadhi mtindo rasmi wa ujumbe wa kifalme kwa lugha ya Biblia iliyo wazi na yenye heshima.
- source_word: הֲשָׁלוֹם
  choice: Je, kuna amani?
  rationale: Huhifadhi neno kuu שָׁלוֹם na mwangwi wake katika jibu la Yehu, huku swali likisomeka kwa kawaida katika Kiswahili.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Wewe una nini na amani?
  rationale: Huhifadhi muundo wa nahau na ukali wa jibu la Yehu bila kuamua kimya kimya kama swali linahusu usalama, ustawi, au nia ya amani.
- source_word: סֹב אֶל אַחֲרָי
  choice: Geuka, ufuate nyuma yangu
  rationale: Huwakilisha kwa uwazi amri ya kugeuka na kujiunga nyuma ya Yehu; tanbihi inatoa tafsiri iliyo karibu zaidi na umbo halisi.
- source_word: הַצֹּפֶה
  choice: mlinzi
  rationale: Katika muktadha huu ni mtu anayetazama kutoka mahali pa ulinzi; ‘mlinzi’ ni neno la kawaida na linaloeleweka.
- source_word: הַמַּלְאָךְ
  choice: mjumbe
  rationale: Muktadha unamtaja mjumbe wa kibinadamu, si malaika.
- source_word: בָּא ... עַד הֵם
  choice: amewafikia
  rationale: Hutoa maana ya kufika walipo kwa Kiswahili kifupi na cha kawaida.
- source_word: וְלֹא שָׁב
  choice: lakini hajarudi
  rationale: Huwasilisha taarifa ya mlinzi kuhusu hali inayoonekana wakati huo na tofauti iliyokusudiwa na kishazi kilichotangulia.
