base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: sw
  text: Naye Yehu akavuta upinde wake mpaka mwisho, akampiga Yehoramu kati ya mikono yake[a]. Mshale ukatoka moyoni mwake, naye akaporomoka katika gari lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kati ya mabega yake” au “kati ya mabawa ya mabega yake.” Kiebrania husema kihalisi, “kati ya mikono yake,” lakini huenda usemi huo unarejelea sehemu ya juu ya mgongo au eneo la mabega.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: akavuta upinde wake kwa nguvu zote
  rationale: Nahau ya Kiebrania, kwa tafsiri halisi ‘akaujaza mkono wake kwa upinde,’ inaeleza kuuvuta upinde kikamilifu ili kurusha mshale. Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha ukamilifu wa tendo.
- source_word: וַיַּךְ
  choice: akampiga
  rationale: Kitenzi נכה kina maana pana ya kupiga. ‘Akampiga’ kinadumisha maana hiyo bila kuongeza wazi kwamba Yehu alimpiga kwa mshale, ingawa muktadha unaonyesha hivyo.
- source_word: בֵּין זְרֹעָיו
  choice: katikati ya mikono yake
  rationale: זְרוֹעַ kwa kawaida humaanisha mkono. Tafsiri ya karibu imehifadhiwa katika matini, huku uwezekano wa nahau inayorejelea eneo kati ya mabega ukielezwa katika tanbihi.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: Mshale ukatokea kupitia moyoni mwake
  rationale: לֵב hapa inaweza kurejelea moyo wa kimwili katika simulizi la jeraha la kufisha. ‘Kupitia moyoni mwake’ huonyesha kwa kawaida kwamba mshale ulipenya na kutoka upande mwingine.
- source_word: וַיִּכְרַע
  choice: akaanguka
  rationale: כרע humaanisha kupinda, kupiga magoti, au kushuka. Katika muktadha wa jeraha la kufisha, ‘akaanguka’ hueleza mwili wake kulegea na kuanguka bila kutumia lugha isiyo ya kawaida.
- source_word: בְּרִכְבּוֹ
  choice: ndani ya gari lake
  rationale: Kiambishi cha umilikaji kinarejelea gari la Yehoramu. Katika muktadha huu רֶכֶב ni gari la vita, na ‘gari lake’ ni fupi na wazi.
