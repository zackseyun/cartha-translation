translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Tafsiri inafuata muundo na taswira za Kiebrania kadiri zinavyoweza kueleweka kwa msomaji wa kawaida, huku utata wa anatomia katika בֵּין זְרֹעָיו ukihifadhiwa kwa tanbihi.
