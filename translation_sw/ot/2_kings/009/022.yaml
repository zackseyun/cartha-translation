base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: sw
  text: Ikawa Yehoramu alipomwona Yehu, akasema, “Je, kuna amani, Yehu?” Yehu akajibu, “Amani gani inaweza kuwapo[b] maadamu ukahaba[a] wa Yezebeli, mama yako, na matendo yake mengi ya uchawi vinaendelea?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uzinzi.” Neno la Kiebrania linaweza kuwa na maana halisi na ya kitamathali, ikiwemo ukosefu wa uaminifu wa kimaadili na wa kiibada.
    reason: lexical_alternative
  - marker: b
    text: Au “Amani gani?” Kiebrania kinarudia neno “amani” kutoka katika swali la Yehoramu kwa kusudi la balagha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Ikawa ... alipomwona
  rationale: Inahifadhi mtiririko wa kisimulizi wa fomula ya Kiebrania huku ikisikika kwa kawaida katika Kiswahili.
- source_word: הֲשָׁלוֹם
  choice: Je, kuna amani
  rationale: Neno “amani” linawekwa wazi ili kuhifadhi maana ya nia ya amani na kurudiwa kwake katika jibu la Yehu.
- source_word: מָה הַשָּׁלוֹם
  choice: Amani gani inaweza kuwapo
  rationale: Ni swali la balagha linalokanusha uwezekano wa amani katika hali iliyopo, huku likirudia neno “amani.”
- source_word: עַד
  choice: maadamu ... unaendelea
  rationale: Inawasilisha hali inayoendelea inayofanya amani isiwezekane.
- source_word: זְנוּנֵי
  choice: ukahaba
  rationale: Linahifadhi sitiari kali ya Kiebrania na linaweza kubeba vidokezo vya ukosefu wa uaminifu wa kimaadili na wa kiibada.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: Yezebeli mama yako
  rationale: Tafsiri ya moja kwa moja inayohifadhi ukali wa shtaka la Yehu.
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: na uchawi wake mwingi
  rationale: “Uchawi” ni nomino ya jumla ya kawaida katika Kiswahili; “mwingi” huhifadhi msisitizo wa wingi wa matendo hayo.
theological_decisions:
- issue: Ikiwa זְנוּנֵי itafsiriwe kwa sitiari yake kali au ilainishwe kuwa neno la jumla la kidini
  choice: ukahaba
  alternative: uzinzi; ukosefu wa uaminifu; ibada ya sanamu
  rationale: Kiebrania kinatumia neno la kushtua ambalo huenda linahusisha ukosefu wa uaminifu wa kimaadili na wa kiibada. “Ukahaba” huhifadhi sitiari bila kuifungia katika maana ya ibada ya sanamu pekee.
- issue: Ikiwa שָׁלוֹם itafsiriwe kwa neno lilelile katika swali na jibu
  choice: amani katika sehemu zote mbili
  alternative: Je, mambo ni salama? / Amani gani?
  rationale: Kurudia “amani” kunahifadhi mwangwi na mgongano wa balagha uliomo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa kisimulizi ni rahisi kueleweka, huku urudiaji wa “amani” na ukali wa “ukahaba” vikihifadhiwa.
