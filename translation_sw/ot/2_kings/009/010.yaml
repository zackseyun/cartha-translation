  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: sw
  text: Mbwa watamla Yezebeli katika sehemu ya Yezreeli[a], na hakuna atakayemzika.” Kisha akafungua mlango, akakimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kipande cha ardhi cha Yezreeli.” Neno la Kiebrania חֵלֶק humaanisha sehemu au kipande cha ardhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: watamla
  rationale: Kitenzi אכל kina maana ya moja kwa moja ya ‘kula’; wakati ujao unafaa katika tangazo hili la kinabii. Kiswahili kinahitaji kiambishi cha yambwa kinachomrejelea Yezebeli.
- source_word: הַכְּלָבִים
  choice: Mbwa
  rationale: Nomino ya Kiswahili ‘mbwa’ inaweza kuwa dhahiri kutokana na muktadha bila neno tofauti la kuonyesha artikeli ya Kiebrania; mtendaji wa hukumu anawekwa wazi.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: katika eneo la Yezreeli
  rationale: חֵלֶק hapa ni sehemu au kipande cha ardhi. ‘Eneo’ ni la kawaida na pana vya kutosha bila kuamua kwamba ni shamba dogo.
- source_word: וְאֵין קֹבֵר
  choice: wala hatakuwa na mtu wa kumzika
  rationale: Kiebrania ni kwa ufupi ‘hakuna anayezika.’ Kiswahili cha kawaida huweka wazi yambwa wa kike kutokana na muktadha, huku maana ya wakati ujao ya unabii ikihifadhiwa.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: Kisha akafungua mlango
  rationale: Wayyiqtol inaendeleza simulizi kwa tendo linalofuata; ‘Kisha’ huonyesha mfuatano kwa Kiswahili cha asili.
- source_word: וַיָּנֹס
  choice: akakimbia
  rationale: נוס humaanisha kukimbia au kukimbia mbali na hatari. ‘Akakimbia’ ni fupi, ya asili, na huhifadhi haraka ya tendo.
- source_word: אִיזֶבֶל
  choice: Yezebeli
  rationale: Jina limenukuliwa kwa umbo linalotambulika na kutumika kwa kawaida katika Kiswahili.
