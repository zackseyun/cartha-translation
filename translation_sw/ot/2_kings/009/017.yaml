  text: וְ/הַ/צֹּפֶה֩ עֹמֵ֨ד עַֽל הַ/מִּגְדָּ֜ל בְּ/יִזְרְעֶ֗אל וַ/יַּ֞רְא אֶת שִׁפְעַ֤ת יֵהוּא֙ בְּ/בֹא֔/וֹ וַ/יֹּ֕אמֶר שִׁפְעַ֖ת אֲנִ֣י רֹאֶ֑ה וַ/יֹּ֣אמֶר יְהוֹרָ֗ם קַ֥ח רַכָּ֛ב וּֽ/שְׁלַ֥ח לִ/קְרָאתָ֖/ם וְ/יֹאמַ֥ר הֲ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: sw
  text: Mlinzi alikuwa amesimama juu ya mnara huko Yezreeli. Aliliona kundi la Yehu wakati Yehu alipokuwa akija, akasema, “Ninaona kundi.” Yehoramu akasema, “Chukua mpanda farasi, umtume akakutane nao na awaambie, ‘Je, kuna amani?’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mambo ni shwari?”
    reason: Neno la Kiebrania linaweza kuwa swali la kawaida kuhusu hali njema, si lazima swali kuhusu amani pekee.
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: mlinzi
  rationale: Neno hili humaanisha mtu anayeangalia ili kutoa taarifa au tahadhari. “Mlinzi” ni neno la kawaida na linalofaa katika mazingira haya.
- source_word: עֹמֵד
  choice: alikuwa amesimama
  rationale: Umbo la kisifa linaonyesha hali iliyokuwa ikiendelea na linaweka mazingira ya simulizi.
- source_word: הַמִּגְדָּל
  choice: mnara
  rationale: Hili ndilo maana ya msingi ya neno la Kiebrania; kazi yake kama mahali pa ulinzi inaeleweka kutokana na muktadha.
- source_word: בְּיִזְרְעֶאל
  choice: huko Yezreeli
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili, na “huko” linaonyesha mahali kwa lugha ya asili.
- source_word: שִׁפְעַת
  choice: kundi
  rationale: Katika muktadha huu neno linataja mkusanyiko unaoonekana wa watu. “Kundi” ni la kawaida na halikadirii ukubwa wao kupita kiasi.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Hili ni toleo la kawaida la jina hilo katika Kiswahili.
- source_word: בְּבֹאוֹ
  choice: likija
  rationale: Kiswahili cha asili huhusisha tendo la kuja na kundi linaloonekana. Hii inawasilisha tendo la kukaribia bila kufanya sentensi kuwa nzito.
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: Ninaona kundi
  rationale: Tafsiri inarudia neno “kundi” kama Kiebrania kinavyofanya na kuhifadhi taarifa fupi ya mlinzi.
- source_word: קַח רַכָּב
  choice: Mchukue mpanda farasi
  rationale: Umoja wa nomino na wa vitenzi vinavyofuata unaonyesha mjumbe mmoja aliyepanda farasi.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: umtume akakutane nao
  rationale: Kiwakilishi cha Kiebrania ni cha wingi, kwa hiyo “nao” kinarejelea kundi lote badala ya Yehu peke yake.
- source_word: וְיֹאמַר
  choice: na kuwauliza
  rationale: Baada ya amri, kitenzi hiki kinaendeleza agizo kuhusu ujumbe ambao mpanda farasi anapaswa kuutoa. “Kuwauliza” ni Kiswahili cha asili kwa kauli hii ya kuuliza.
- source_word: הֲשָׁלוֹם
  choice: Je, kuna amani?
  rationale: Neno la Kiebrania ni swali fupi kuhusu amani, hali njema, au nia ya amani. Tafsiri hii inadumisha ufupi na dhamira ya “amani” inayorudiwa katika kifungu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima, na wa kisasa. Majina yametolewa kama Yezreeli, Yehu, na Yehoramu. Swali la mwisho limehifadhi neno “amani,” huku maana yake ya kawaida zaidi ikionyeshwa katika tanbihi.
