  yaml_path: translation/ot/2_kings/009/033.yaml
  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: sw
  text: Akasema, “Mtupeni chini!” Basi wakamtupa chini, na baadhi ya damu yake ikatapakaa ukutani na juu ya farasi,[a] naye akamkanyaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “damu yake ikarukia ukuta na farasi.” Kiebrania kinasema kihalisi, “na ikatapakaa kutoka katika damu yake kuelekea ukutani na kuelekea kwa farasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו
  choice: Mtupeni chini!
  rationale: Amri hii inawataka waliokuwa dirishani wamsababishe Yezebeli aanguke. “Mtupeni chini” ni usemi wa kawaida, wenye nguvu, na unaofaa katika muktadha huu wa vurugu.
- source_word: וישמטוה
  choice: wakamtupa chini
  rationale: Mzizi uleule wa kitenzi katika amri unarudiwa katika simulizi la utekelezaji; kurudia “tupa chini” kunahifadhi uhusiano huo wa kileksia.
- source_word: ויז
  choice: ikatapakaa
  rationale: Kitenzi kinaonyesha damu kuruka na kugonga sehemu mbalimbali. “Ikatapakaa” ni Kiswahili cha kawaida kinachoonyesha damu kusambaa kwa matone juu ya nyuso zilizokuwa karibu.
- source_word: מדמה
  choice: baadhi ya damu yake
  rationale: Kihusishi מן pamoja na “damu” kina maana ya sehemu hapa. “Baadhi ya damu yake” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kulazimisha muundo wa Kiebrania.
- source_word: הקיר
  choice: ukutani
  rationale: קיר ni neno la kawaida kwa ukuta; hali ya mahali “ukutani” inafaa baada ya kitenzi “ikatapakaa.”
- source_word: הסוסים
  choice: juu ya farasi
  rationale: Tafsiri ya moja kwa moja ya wingi; “juu ya” inaonyesha damu kuwafikia farasi kama uso ilipotapakaa.
- source_word: וירמסנה
  choice: naye akamkanyaga
  rationale: רמס humaanisha kukanyaga au kuponda kwa kukanyaga. Kitenzi cha umoja humrejelea Yehu kama mtendaji; “akamkanyaga” huhifadhi sarufi na ukali wa tendo bila kutaja wazi chombo ambacho Kiebrania hakikutaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa moja kwa moja ili kuhifadhi kasi na ukali wa simulizi. Kiashiria [a] kimewekwa baada ya kishazi kinachohusu damu, ambacho ndicho kinachoelezwa katika tanbihi.
