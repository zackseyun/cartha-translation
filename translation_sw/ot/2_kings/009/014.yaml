translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Majina yametoholewa kwa matumizi ya kawaida ya kibiblia ya Kiswahili, huku ‘Aramu’ ikihifadhi istilahi ya chanzo. Alama za tanbihi zimewekwa mahali zinapohusika na kupangwa [a], [b], [c].
