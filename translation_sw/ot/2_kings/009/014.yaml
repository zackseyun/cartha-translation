base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: sw
  text: Basi Yehu mwana wa Yehoshafati, mwana wa Nimshi, akapanga njama dhidi ya Yoramu. Wakati huo Yoramu alikuwa akilinda Ramoth-gileadi[a], yeye pamoja na Israeli wote[b], kwa sababu ya Hazaeli mfalme wa Aramu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akifanya ulinzi huko Ramoth-gileadi.” Kitenzi cha Kiebrania kinaweza kumaanisha kulinda, kuchunga au kusimamia ulinzi katika mazingira ya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, ufalme au majeshi ya Israeli; maandishi yanasema kihalisi, “Israeli wote.”
    reason: cultural_note
  - marker: c
    text: Kwa kawaida hutafsiriwa “Siria”; Kiebrania ni “Aramu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: akapanga njama dhidi ya
  rationale: Katika muktadha huu, kitenzi cha Kiebrania kinaonyesha kupanga uasi au njama ya kisiasa. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha wazi kuwa Yoramu ndiye aliyelengwa.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: mwana wa Yehoshafati, mwana wa Nimshi
  rationale: Muundo huu unahifadhi nasaba ya baba iliyorudiwa katika Kiebrania bila kuibadili kuwa maana pana ya ‘mzao.’
- source_word: הָיָה שֹׁמֵר
  choice: alikuwa akilinda
  rationale: Muundo wa kitenzi timilifu pamoja na umbo endelevu unaonyesha tendo la nyuma lililokuwa likiendelea. ‘Alikuwa akilinda’ linafaa katika mazingira ya kijeshi na linaacha wazi wazo la kulinda, kuchunga au kusimamia ulinzi.
- source_word: בְּרָמֹת גִּלְעָד
  choice: Ramoth-gileadi
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika Kiswahili badala ya kutafsiriwa kama kirai cha kawaida.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: yeye pamoja na Israeli wote
  rationale: Tafsiri inahifadhi usemi halisi ‘Israeli wote’; katika mazingira haya ya vita, huenda unarejelea majeshi au watu wa ufalme waliokuwa pamoja na mfalme.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Kirai hiki kinamtaja Hazaeli kama sababu au tishio lililosababisha ulinzi huo, bila kulazimisha maana finyu kuliko ilivyo katika Kiebrania.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: ‘Aramu’ linawakilisha moja kwa moja jina la Kiebrania la eneo na watu hao, badala ya kutumia jina la baadaye ‘Siria.’
