  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: sw
  text: Ahazi alikuwa na umri wa miaka ishirini alipoanza kutawala, naye akatawala miaka kumi na sita katika Yerusalemu. Hakufanya yaliyo sawa machoni pa Yahwe Mungu wake[a], kama Daudi baba yake[b] alivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakufanya yaliyonyooka mbele za Yahwe Mungu wake.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “baba yake” humaanisha babu wa nasaba au mtangulizi wa kifalme, si mzazi wake wa moja kwa moja.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: alikuwa na umri wa miaka ishirini
  rationale: Hii ndiyo maana ya nahau ya Kiebrania ya kutaja umri; tafsiri ya neno kwa neno ‘mwana wa miaka ishirini’ si Kiswahili cha kawaida.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu wa Kiebrania unaonyesha wakati Ahazi alipoingia katika ufalme; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi kinaeleza kutenda kazi ya kifalme, si kuwa na cheo cha mfalme tu.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi kinaonyesha mahali palipokuwa makao ya utawala wake.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: Hakufanya yaliyo sawa
  rationale: Huu ni usemi wa kawaida wa tathmini katika Wafalme. ‘Yaliyo sawa’ huwasilisha hukumu ya kimaadili kwa Kiswahili cha asili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Nahau ya Kiebrania imehifadhiwa kwa namna inayoeleweka katika Kiswahili na inaonyesha tathmini kutoka kwa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalotumika kwa kawaida katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Kiambishi cha umilikaji ni cha nafsi ya tatu umoja na kinamrejelea Ahazi.
- source_word: כְּדָוִד אָבִיו
  choice: kama Daudi baba yake alivyofanya
  rationale: Tafsiri inadumisha neno ‘baba’ la Kiebrania, huku ‘alivyofanya’ ikiweka wazi ulinganisho uliodokezwa na kishazi kilichotangulia.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; kulitafsiri ‘Yahwe’ kunalihifadhi badala ya kuliweka kwa cheo.
- issue: Maana ya ‘Daudi baba yake’
  choice: Kudumisha ‘baba yake’ katika matini na kufafanua kuwa ni babu wa nasaba katika tanbihi
  alternative: Daudi babu yake
  rationale: אָבִיו inaweza kumaanisha babu wa nasaba katika muktadha wa kifalme. Kudumisha usemi wa chanzo huepuka kufifisha lugha ya nasaba, huku tanbihi ikizuia kueleweka kuwa Daudi alikuwa mzazi wake wa moja kwa moja.
- issue: Kipimo cha maadili katika usemi ‘machoni pa Yahwe Mungu wake’
  choice: Kudumisha nahau ya mtazamo wa kimungu
  alternative: mbele za Yahwe Mungu wake
  rationale: Usemi huo unaweka wazi kwamba tathmini ya utawala wa Ahazi inatokana na Yahwe; tafsiri haibadilishi wala kupunguza mvutano wa maneno ‘Mungu wake’ licha ya kutotii kwake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata fomula ya kifalme ya Kiebrania bila kuwa mgumu, na jina ‘Yahwe’ limepewa tahajia ya kawaida ya Kiswahili.
