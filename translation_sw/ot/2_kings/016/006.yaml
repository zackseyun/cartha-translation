base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: sw
  text: Wakati huo Resini, mfalme wa Aramu, aliirudisha Elathi chini ya mamlaka ya Aramu[a], akawafukuza Wayuda kutoka Elathi[b]. Kisha Waaramu wakaja Elathi, wakaanza kuishi huko mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania katika kishazi cha mwisho kinasema “Waaramu.” Baadhi ya mashahidi wa kale na watafsiri hupendelea “Waedomu,” huenda kwa sababu usomaji huo unalingana na muktadha mpana na simulizi sambamba katika 2 Mambo ya Nyakati 28:17.
    reason: textual_variant
  - marker: b
    text: Katika utokeaji wa pili wa jina hili katika mstari, Kiebrania lina umbo tofauti kidogo, ambalo linaweza kutoholewa “Elothi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: aliirudisha ... chini ya mamlaka ya
  rationale: Hifili ya שוב hapa inaonyesha kusababisha Elathi irejee katika milki au mamlaka fulani; usemi huu ni wa kawaida katika Kiswahili na unaweka wazi muktadha wa kisiasa.
- source_word: אֵילַת / אֵילוֹת
  choice: Elathi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Waswahili; tofauti ya maumbo mawili ya jina katika Kiebrania imehifadhiwa katika tanbihi.
- source_word: לַאֲרָם
  choice: chini ya mamlaka ya Aramu
  rationale: Kirai hiki kinaonyesha kurejeshwa kwa umiliki au udhibiti kwa Aramu, si mwendo wa kawaida wa kuelekea mahali.
- source_word: וַיְנַשֵּׁל
  choice: akawafukuza
  rationale: Kitenzi kina maana ya kuwaondoa watu katika milki au makao yao; ‘kuwafukuza’ ni cha asili na huhifadhi nguvu ya tendo hilo.
- source_word: הַיְהוּדִים
  choice: Wayuda
  rationale: Katika mazingira ya kifalme, neno hili linarejelea watu wa ufalme wa Yuda; ‘Wayuda’ huhifadhi maana hiyo ya kihistoria.
- source_word: ו/ארמים
  choice: Waaramu
  rationale: Maandishi ya konsonanti ya Kiebrania yaliyopokelewa yanasoma ‘Waaramu’; usomaji mwingine ‘Waedomu’ umeelezwa katika tanbihi badala ya kuingizwa kimya kimya.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: wamekaa huko mpaka leo
  rationale: Usemi huu unaonyesha makao yaliyoendelea tangu tukio lililosimuliwa hadi wakati wa mwandishi; wakati timilifu wa Kiswahili unaonyesha mwendelezo huo kwa kawaida.
theological_decisions:
- issue: Utata wa jina la taifa katika kishazi cha mwisho
  choice: Waaramu wakaja Elathi
  alternative: Waedomu wakaja Elathi
  rationale: Maandishi ya Kimasora yanasoma ‘Waaramu’, hivyo huo ndio usomaji wa msingi. Kwa kuwa ‘Waedomu’ ni usomaji wa kale unaojadiliwa na unaungwa mkono na muktadha mpana, umehifadhiwa katika tanbihi ili kutoficha utata wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umefuata mtiririko wa Kiebrania huku ‘chini ya mamlaka ya’ ikitumika kufafanua urejeshwaji wa kisiasa kwa njia ya asili.
