base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: sw
  text: Alitoa dhabihu na akafukiza uvumba katika mahali pa juu, juu ya vilima, na chini ya kila mti wenye majani mabichi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mti wenye majani mengi,” au “kila mti unaositawi.” Kivumishi cha Kiebrania kinaweza kumaanisha kitu kibichi, chenye majani mengi, au kinachositawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Alitoa dhabihu
  rationale: Kitenzi זבח kinaeleza tendo la kutoa dhabihu. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya ibada bila kutaja kitu kisichokuwapo katika Kiebrania.
- source_word: וַיְקַטֵּר
  choice: na kufukiza uvumba
  rationale: Katika muktadha wa ibada, piel ya קטר mara nyingi humaanisha kufukiza uvumba au kufanya sadaka itoe moshi. Hapa 'kufukiza uvumba' ni usemi wa asili na unaofahamika katika Kiswahili.
- source_word: בַּבָּמוֹת
  choice: mahali pa juu
  rationale: במות humaanisha maeneo ya ibada yaliyoinuka. 'Mahali pa juu' linahifadhi istilahi halisi ya ibada bila kuifasiri moja kwa moja kuwa ibada ya kipagani.
- source_word: וְעַל הַגְּבָעוֹת
  choice: juu ya vilima
  rationale: גבעות ni vilima. Tafsiri hii inatofautisha vilima vya kijiografia na 'mahali pa juu' pa ibada.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: na chini ya kila mti wenye majani mabichi
  rationale: רענן inaweza kueleza kitu kibichi, chenye majani mengi, au kinachositawi. 'Mti wenye majani mabichi' ni wazi katika Kiswahili na huhifadhi taswira halisi ya maneno hayo.
theological_decisions:
- issue: Namna ya kutafsiri kauli kuhusu ibada isiyoruhusiwa
  choice: 'Kuhifadhi matendo na mahali palipotajwa: ''Alitoa dhabihu na kufukiza uvumba mahali pa juu, juu ya vilima, na chini ya kila mti wenye majani mabichi.'''
  alternative: Kutafsiri kwa ufafanuzi zaidi, kama vile 'Aliabudu miungu ya kipagani kwenye madhabahu vilimani na chini ya kila mti wenye majani.'
  rationale: Aya yenyewe inataja matendo na mahali bila kutumia neno 'kipagani' au kutaja miungu mingine. Tafsiri isiyoingiza ufafanuzi huo inaacha muktadha mpana utoe hukumu hasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na unaofuata urudiaji wa Kiebrania; 'mahali pa juu' limetumiwa kama istilahi ya eneo la ibada, huku 'vilima' vikihifadhiwa kama maelezo tofauti ya kijiografia.
