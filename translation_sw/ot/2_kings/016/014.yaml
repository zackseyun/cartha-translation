  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: sw
  text: Na madhabahu ya shaba iliyokuwa mbele ya Yahwe[a], akaisogeza kutoka mbele ya nyumba, kutoka kati ya madhabahu na nyumba ya Yahwe[b], akaiweka upande wa kaskazini wa madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “madhabahu ya bronzi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “nyumba ya Yahwe”; yaani, hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: madhabahu ya shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha shaba au metali ya shaba; katika muktadha wa vifaa vya hekalu, “shaba” ni usemi wa kawaida na unaoeleweka, huku mbadala ukibainishwa katika tanbihi.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: iliyokuwa mbele za Yahwe
  rationale: לִפְנֵי ina maana ya mahali, “mbele ya,” na “mbele za Yahwe” ni usemi wa Kiswahili unaohifadhi pia dhana ya kuwapo mbele zake.
- source_word: וַיַּקְרֵב
  choice: akaiondoa
  rationale: Ingawa kitenzi קרב kwa msingi ni “kuleta karibu,” muktadha unaeleza kuhamishwa kwa madhabahu kutoka mahali pake mbele ya nyumba. “Akaiondoa kutoka” huwasilisha mwendo huo kwa Kiswahili cha kawaida bila kudai ililetwa karibu na kitu kisichotajwa wazi.
- source_word: מֵאֵת פְּנֵי הַבַּיִת
  choice: kutoka mbele ya nyumba
  rationale: פְּנֵי הַבַּיִת ni usemi wa mahali unaorejelea eneo la mbele la jengo; “mbele ya nyumba” huhifadhi picha ya Kiebrania kwa lugha ya asili.
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: kutoka katikati ya madhabahu na nyumba ya Yahwe
  rationale: מִבֵּין inayorudiwa inaonyesha kwamba madhabahu ya shaba ilikuwa katika nafasi baina ya madhabahu nyingine na nyumba ya Yahwe.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: akaiweka
  rationale: Katika muktadha wa kupanga kitu mahali, נתן humaanisha “kuweka”; “akaiweka” ni wazi na ya kawaida.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: upande wa kaskazini wa madhabahu
  rationale: יֶרֶךְ hapa ni “ubavu/upande,” na צָפוֹנָה inaelekeza kaskazini; tafsiri hii inaunganisha vipengele hivyo kwa Kiswahili fasaha.
- source_word: הַבַּיִת / בֵּית יְהוָה
  choice: nyumba / nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi istilahi halisi ya Kiebrania badala ya kuibadili kimafafanuzi kuwa “hekalu”; tanbihi inaeleza rejeleo lake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Jina la agano limetafsiriwa kwa umbo la kawaida la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo. Hii huhifadhi tofauti kati ya jina hilo na majina ya cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetumia viambishi vinavyofuatana “aka-”. “Madhabahu” imetumiwa kwa umoja kulingana na kitu kinachorejelewa, na “nyumba ya Yahwe” imehifadhiwa ili kuakisi istilahi ya chanzo.
