base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: sw
  text: Mfalme alipokuja kutoka Damasko, aliona madhabahu; kisha mfalme akaikaribia na akapanda juu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme aliikaribia madhabahu na akatoa dhabihu juu yake.” Baadhi huelewa “akapanda juu yake” kuwa usemi uliofupishwa unaomaanisha kuanza kutoa dhabihu, ingawa Kiebrania kwa maana ya moja kwa moja kinaeleza kupanda juu ya madhabahu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא ... מִדַּמֶּשֶׂק
  choice: aliporudi kutoka Damasko
  rationale: בוא pamoja na מן huonyesha kuja kutoka Damasko. Katika muktadha wa mfalme kurejea Yerusalemu, “aliporudi” ni Kiswahili cha kawaida kinachoweka wazi mwendo bila kubadili tukio.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho imerudiwa katika Kiebrania. Tafsiri imedumisha marudio katika kishazi cha pili, huku kiwakilishi cha kitenzi katika kishazi cha kwanza kikitosha kwa Kiswahili cha kawaida.
- source_word: וַיַּרְא
  choice: aliona
  rationale: ראה hapa ina maana ya kawaida ya kuona kwa macho.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa מִזְבֵּחַ katika muktadha wa ibada na dhabihu.
- source_word: וַיִּקְרַב עַל־הַמִּזְבֵּחַ
  choice: akaikaribia madhabahu
  rationale: קרב ni kukaribia, na עַל baada ya kitenzi hiki huonyesha kitu kinachokaribiwa. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וַיַּעַל עָלָיו
  choice: akapanda juu yake
  rationale: עלה pamoja na עליו kwa maana yake ya moja kwa moja huonyesha kupanda juu ya kitu. Tafsiri haijaingiza tendo la kutoa dhabihu ambalo halijatajwa wazi katika kishazi hiki.
theological_decisions:
- issue: Iwapo וַיַּעַל עָלָיו inaeleza kupanda kimwili au kutoa dhabihu
  choice: akapanda juu yake
  alternative: akatoa dhabihu juu yake; akapanda kuifikia
  rationale: Sarufi ya Kiebrania, עלה ikifuatwa na על yenye kiambishi cha kiwakilishi, kwa kawaida hueleza kupanda juu yake. Maana ya kutoa dhabihu inawezekana kama usemi uliofupishwa kutokana na muktadha, lakini si wazi katika maneno yenyewe; kwa hiyo imetajwa katika tanbihi badala ya kuingizwa katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi na wenye staha. “Damasko” na “madhabahu” ni maumbo yaliyozoeleka katika matumizi ya Biblia. Alama ya tanbihi imewekwa mara tu baada ya kishazi kinachohusika.
