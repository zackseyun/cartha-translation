base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: sw
  text: Kisha Mfalme Ahazi akaenda Damasko kukutana na Tiglath-Pileseri, mfalme wa Ashuru. Akaiona madhabahu iliyokuwa Damasko. Kisha Mfalme Ahazi akamtumia kuhani Uria mfano wa madhabahu hiyo na mchoro wake wa kazi yake yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: kukutana na
  rationale: Huonyesha kwenda kumlaki au kukutana na mtu; hapa tafsiri hii ni ya asili na haiongezi kusudi lisilotajwa.
- source_word: דְּמוּת
  choice: mfano
  rationale: Neno hili lina maana ya sura au mfano unaowakilisha kitu; “mfano” linafaa katika muktadha wa taarifa iliyotumwa ili madhabahu iigwe.
- source_word: תַּבְנִיתוֹ
  choice: mchoro wake
  rationale: Huashiria umbo, mpangilio, au kielelezo cha ujenzi. “Mchoro” ni wazi kwa msomaji wa kisasa huku ukitofautishwa na “mfano.”
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: unaoonyesha jinsi ilivyotengenezwa kwa kila sehemu
  rationale: Kirai kinaeleza maelezo ya kazi au utengenezaji wake wote; tafsiri hii huwasilisha kwa Kiswahili cha kawaida kwamba mpangilio ulihusisha vipengele vyote vya madhabahu.
