base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: sw
  text: Alifuata mwenendo wa wafalme wa Israeli, na hata akampitisha mwanawe katika moto[a], kufuatana na machukizo ya mataifa ambayo Yahwe alikuwa ameyafukuza mbele ya wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtoa mwanawe kuwa dhabihu katika moto.” Kiebrania kinasema kihalisi, “akampitisha mwanawe katika moto,” nahau inayohusishwa na tambiko la kipagani lililohukumiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Alifuata mwenendo
  rationale: Muungano huu ni nahau ya kuishi au kutenda kwa kufuata kielelezo fulani. Kiswahili ‘alifuata mwenendo’ kinaeleza maana hiyo kwa lugha ya kawaida na yenye hadhi bila kulazimisha sitiari ya kutembea.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: wafalme wa Israeli
  rationale: Ni muundo wa kawaida unaowataja watawala wa ufalme wa kaskazini kama kielelezo kibaya cha maadili.
- source_word: וְגַם
  choice: na hata
  rationale: ‘Hata’ huhifadhi msisitizo wa hatua iliyozidi mwenendo uliotajwa kwanza.
- source_word: אֶת־בְּנוֹ
  choice: mwanawe
  rationale: Huhifadhi umoja na kiambishi cha umilikaji cha nafsi ya tatu.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: akampitisha ... motoni
  rationale: Huhifadhi nahau ya Kiebrania bila kuamua kimya-kimya kama ibada hiyo ilikuwa dhabihu iliyokamilika ya mtoto au tambiko jingine la moto.
- source_word: כְּתֹעֲבוֹת
  choice: kufuatana na machukizo
  rationale: ‘Kufuatana na’ huonyesha kwamba tendo lake lilifuata mfano wa desturi hizo; ‘machukizo’ huhifadhi tathmini kali ya kimaadili na kiibada ya neno תּוֹעֵבָה.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Ni tafsiri isiyoegemea upande fulani kwa watu wasio Waisraeli waliokuwa katika nchi hiyo.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: ambayo ... alikuwa ameyafukuza
  rationale: Hiphil ya ירשׁ hapa ina maana ya kuwatoa au kuwafukuza wakaaji katika nchi; wakati timilifu ‘alikuwa ameyafukuza’ unaonyesha tendo lililotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa uhamishaji wa sauti unaotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: mbele ya wana wa Israeli
  rationale: Huhifadhi kwa karibu taswira ya kufukuzwa kutoka mbele yao na pia muundo wa kifungu בְּנֵי יִשְׂרָאֵל.
theological_decisions:
- issue: Iwapo הֶעֱבִיר בָּאֵשׁ itafsiriwe wazi kuwa dhabihu ya mtoto au nahau yake ihifadhiwe
  choice: Nahau ‘akampitisha mwanawe motoni’ imehifadhiwa katika matini kuu.
  alternative: ‘akamtoa mwanawe kuwa dhabihu motoni’ au ‘akamteketeza mwanawe motoni’
  rationale: Kifungu kinashutumu wazi tambiko la kipagani, lakini maneno yenyewe hayaelezi moja kwa moja maelezo yote ya tendo hilo. Tafsiri ya karibu huhifadhi utata halisi, huku tanbihi ikitaja fasiri iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka. ‘Alifuata mwenendo’ ni ya asili zaidi kuliko kunakili moja kwa moja sitiari ya Kiebrania ya ‘kutembea katika njia.’ Alama ya tanbihi [a] imewekwa mara tu baada ya kifungu kinachohusika.
