translation:
  language: sw
  text: Matendo mengine ya Ahazi, aliyoyafanya, je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati[a] ya Wafalme wa Yuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha Kumbukumbu za Wafalme wa Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika muhtasari huu wa kifalme, יֶתֶר ni yaliyobaki au mengine, na דִּבְרֵי hurejelea matendo au shughuli zilizorekodiwa; “matendo mengine” ni Kiswahili cha kawaida na chenye staha.
- source_word: אָחָז
  choice: Ahazi
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyoyafanya
  rationale: Inahifadhi kishazi cha Kiebrania kinachosisitiza matendo ambayo mfalme mwenyewe alifanya.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: “Je” pamoja na ukanushi huwasilisha swali la balagha linalotarajia jibu la ndiyo, huku “kuandikwa” kikihifadhi maana halisi ya כְּתוּבִים.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni “juu ya,” katika rejeo la hati Kiswahili cha kawaida husema habari zimeandikwa “katika kitabu.”
- source_word: דִּבְרֵי הַיָּמִים
  choice: Mambo ya Nyakati
  rationale: Hili ni jina la kawaida na linaloeleweka kwa rekodi ya matukio ya siku au historia ya kifalme; “Kumbukumbu” pia linawezekana.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: za Wafalme wa Yuda
  rationale: לְ hapa huonyesha uhusiano wa rekodi hiyo na wafalme wa Yuda; “za” ni muundo wa asili wa Kiswahili kwa jina la hati.
