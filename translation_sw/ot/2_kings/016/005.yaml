  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: sw
  text: Ndipo Resini mfalme wa Aramu na Peka mwana wa Remalia, mfalme wa Israeli, walipanda kwenda Yerusalemu kwa ajili ya vita. Wakamzingira Ahazi, lakini hawakuweza kupigana naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “lakini hawakuweza kupigana na Yerusalemu.” Kiebrania hakitaji wazi mtendwa baada ya “kupigana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: יַעֲלֶה
  choice: walipopanda kwenda
  rationale: Kitenzi עלה kinaonyesha kwenda juu/kupanda, na kwa Yerusalemu pia hutumiwa kuhusu safari au mwendo wa kijeshi kuelekea huko; wingi unafuata wahusika wawili.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Resini mfalme wa Aramu
  rationale: Majina yametoholewa kwa matumizi ya Kiswahili, huku Aramu ikihifadhi jina la kijiografia la Kiebrania badala ya kulibadilisha kuwa Siria/Shamu.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: na Peka mwana wa Remalia, mfalme wa Israeli
  rationale: Inahifadhi uhusiano wa kifamilia na cheo cha kifalme katika mpangilio wa kawaida wa Kiswahili.
- source_word: יְרוּשָׁלַםִ לַמִּלְחָמָה
  choice: kwenda Yerusalemu kwa ajili ya vita
  rationale: Inaonyesha mahali walikokwenda na kusudi la kijeshi bila kuongeza dai kwamba walikuwa tayari wameanza kushambulia.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: Wakamzingira Ahazi
  rationale: צור katika muktadha wa kijeshi humaanisha kuzingira; Kiswahili hutumia mtendwa moja kwa moja bila kihusishi cha Kiebrania עַל.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: lakini hawakuweza kupigana naye
  rationale: לחם humaanisha kupigana au kufanya vita. Kiebrania hakirudii mtendwa, hivyo 'naye' linafuata rejeleo la karibu, Ahazi, huku uwezekano wa kurejelea Yerusalemu ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Mtendwa asiyeelezwa baada ya לְהִלָּחֵם
  choice: kupigana naye, yaani Ahazi
  alternative: kupigana na Yerusalemu
  rationale: Kiebrania hakitaji mtendwa wa kitenzi hiki waziwazi. Ahazi ndiye rejeleo la karibu, lakini mji uliozingirwa unaweza pia kuwa unaokusudiwa; kwa hiyo maana mbadala haijafutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa kwa mtiririko wa asili, huku uhusiano wa matukio wa Kiebrania ukihifadhiwa.
