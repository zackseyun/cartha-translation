base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: sw
  text: Akateketeza sadaka yake ya kuteketezwa na sadaka yake ya nafaka, akamimina sadaka yake ya kinywaji, akarusha damu ya sadaka za amani zilizokuwa zake[a] juu ya madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika” au “sadaka za ustawi.” Neno la Kiebrania linataja aina maalumu ya dhabihu (שְׁלָמִים).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: akaiteketeza juu ya madhabahu
  rationale: Katika muktadha wa dhabihu, Hiphil ya קטר humaanisha kuifanya sadaka ipande kwa moshi juu ya madhabahu. Kauli hii ya Kiswahili ni ya kawaida na inaonyesha tendo la ibada bila kulifanya kuwa kuchoma kwa kawaida tu.
- source_word: עֹלָתוֹ
  choice: sadaka yake ya kuteketezwa
  rationale: עֹלָה ni aina maalumu ya dhabihu inayoteketezwa; tafsiri hii ni sahihi na inaeleweka katika Kiswahili cha Biblia.
- source_word: מִנְחָתוֹ
  choice: sadaka yake ya nafaka
  rationale: Katika muktadha wa ibada, מִנְחָה hapa ni sadaka ya nafaka, si zawadi ya jumla.
- source_word: וַיַּסֵּךְ
  choice: akamimina
  rationale: נסך katika ibada hueleza tendo la kumimina kinywaji kama sadaka.
- source_word: נִסְכּוֹ
  choice: sadaka yake ya kinywaji
  rationale: נֶסֶךְ ni kinywaji kinachomiminwa kama sadaka; usemi huu ni wazi kwa msomaji wa kawaida kuliko istilahi ya kitaalamu.
- source_word: וַיִּזְרֹק
  choice: kuirusha
  rationale: זרק huonyesha damu ikitupwa au kurushwa kuelekea madhabahuni, si kunyunyizwa kwa upole. 'Kuirusha' inadumisha nguvu ya kitenzi cha Kiebrania.
- source_word: דַּם הַשְּׁלָמִים
  choice: damu ya sadaka zake za amani
  rationale: שְׁלָמִים ni aina maalumu ya dhabihu. 'Sadaka za amani' ni tafsiri iliyozoeleka na bado inaeleweka; maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר לוֹ
  choice: zake
  rationale: Kiambishi cha umilikaji kinawasilisha kwa ufupi maana kwamba sadaka hizo zilikuwa zake, bila kuongeza ufafanuzi usio katika matini.
- source_word: עַל הַמִּזְבֵּחַ
  choice: kwenye madhabahu
  rationale: Pamoja na זרק, עַל inaweza kumaanisha damu ilirushwa juu ya madhabahu au dhidi yake. 'Kwenye madhabahu' ni ya asili katika Kiswahili na haibani kupita kiasi namna halisi ilivyogonga madhabahu.
theological_decisions:
- issue: Maana ya שְׁלָמִים kama aina ya dhabihu
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Neno la Kiebrania linaweza kuwasilishwa kwa majina kadhaa yanayosisitiza amani, ushirika, au ustawi. Matini kuu inatumia istilahi iliyozoeleka, huku tanbihi ikihifadhi uwezekano huo wa kileksia bila kulazimisha fasiri moja ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitendo vya ibada umehifadhiwa, na istilahi za dhabihu zimetafsiriwa kwa uwazi bila kuingiza msimamo wa kimadhehebu.
