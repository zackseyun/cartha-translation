  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: sw
  text: Basi Ahazi akatuma wajumbe kwa Tiglath-Pileseri, mfalme wa Ashuru, akisema, “Mimi ni mtumishi wako na mwana wako.[a] Panda, uniokoe kutoka mkononi mwa[b] mfalme wa Aramu[c] na kutoka mkononi mwa mfalme wa Israeli, ambao wanainuka dhidi yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hii ni lugha ya kidiplomasia ya kujitiisha; kwa maana ya kisiasa inaweza kueleweka, “Mimi ni mtumishi wako aliye chini ya mamlaka yako, na mwana wako.”
    reason: lexical_alternative
  - marker: b
    text: “Kutoka mkononi mwa” ni nahau ya Kiebrania inayomaanisha “kutoka katika nguvu au mamlaka ya.”
    reason: lexical_alternative
  - marker: c
    text: Kwa desturi, “Aramu” pia limetafsiriwa “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachowasilisha tendo linalofuata katika simulizi.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa kisiasa ni watu waliotumwa kupeleka ujumbe, si malaika.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: Tiglath-Pileseri
  rationale: Unukuzi unaosomeka kwa urahisi katika Kiswahili huku ukihifadhi umbo linalotambulika la jina la mfalme wa Ashuru.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Hutoa kwa usahihi cheo na ufalme wa Tiglath-Pileseri; 'Ashuru' ndilo jina la kihistoria linalofaa hapa.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: mtumishi wako na mwana wako
  rationale: Huhifadhi lugha halisi ya kidiplomasia ya kujishusha na kujitiisha badala ya kuiwekea neno la kitaalamu pekee.
- source_word: עֲלֵה
  choice: Panda uje
  rationale: Huhifadhi wazo la msingi la kupanda/kwenda juu na wakati huohuo huonyesha kwamba Ahazi anamwita mfalme aje kwake; muktadha unaonyesha ni mwito wa msaada wa kijeshi.
- source_word: וְהוֹשִׁיעֵנִי
  choice: uniokoe
  rationale: Kitenzi hiki humaanisha kuokoa au kukomboa; hapa muktadha unaonyesha wokovu wa kisiasa na kijeshi bila kulazimisha maana hiyo ndani ya kitenzi chenyewe.
- source_word: מִכַּף
  choice: kutoka mkononi mwa
  rationale: Huhifadhi taswira halisi ya Kiebrania, ambayo ni nahau ya kuwa chini ya nguvu au mamlaka ya mtu.
- source_word: אֲרָם
  choice: Aramu
  rationale: Huhifadhi jina la kihistoria la eneo na watu badala ya kutumia jina la baadaye 'Siria'.
- source_word: הַקּוֹמִים עָלָי
  choice: ambao wanainuka dhidi yangu
  rationale: Huhifadhi hali endelevu ya kivumishi-tendo na taswira ya kuinuka kwa uhasama dhidi ya Ahazi.
theological_decisions:
- issue: Lugha ya Ahazi ya kujishusha kidiplomasia
  choice: mtumishi wako na mwana wako
  alternative: mtegemezi wako na mwana wako; mtawala wako wa chini
  rationale: Maneno hayo yanaonyesha kujitiisha kisiasa, lakini Kiebrania kinatumia moja kwa moja taswira za utumishi na uhusiano wa mwana. Tafsiri halisi huhifadhi uzito na mvutano wa kauli hiyo.
- issue: Maana ya kijeshi na kisiasa ya וְהוֹשִׁיעֵנִי
  choice: uniokoe
  alternative: unikomboe; uniokoe na adui
  rationale: Ingawa katika mstari huu ombi linahusu kuondolewa katika hatari ya kijeshi, 'uniokoe' hudumisha upana wa kitenzi cha Kiebrania na uhusiano wake wa kileksia na matumizi mengine ya kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo “Panda uje” umechaguliwa ili kuhifadhi kitenzi cha mwelekeo cha Kiebrania bila kufanya sentensi kuwa ya kitaalamu kupita kiasi. Majina yametolewa kwa maumbo yanayoweza kutamkwa kwa kawaida katika Kiswahili.
