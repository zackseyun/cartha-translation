base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: sw
  text: Katika mwaka wa kumi na saba wa utawala wa Peka mwana wa Remalia, Ahazi mwana wa Yothamu, mfalme wa Yuda, alianza kutawala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: Katika mwaka wa kumi na saba
  rationale: Huu ni mtindo wa kutaja mwaka wa utawala kwa kusawazisha tawala mbili; katika muktadha huu namba ina maana ya mpangilio, si muda wa miaka kumi na saba.
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: wa utawala wa Peka mwana wa Remalia
  rationale: Kiambishi לְ kinamtaja mfalme ambaye miaka ya utawala wake inahesabiwa. Kuongeza ‘utawala’ kunafanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili bila kubadili maana.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika fomula za kifalme, kitenzi hiki mara nyingi huonyesha kuanza kwa ufalme; tafsiri hii inaepuka kueleweka kuwa sentensi inatoa muda wote wa utawala.
- source_word: אָחָז בֶּן יוֹתָם
  choice: Ahazi mwana wa Yothamu
  rationale: Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili, huku patronimiki ya Kiebrania ikihifadhiwa kwa ‘mwana wa’.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo hiki kiko katika uhusiano wa ufafanuzi na Ahazi na kimetafsiriwa moja kwa moja kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kihistoria, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Muundo wa taarifa ya mwaka wa kifalme umewekwa wazi bila kuongeza ufafanuzi wa kitheolojia.
