base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: sw
  text: Naye aliondoa[c] kutoka katika nyumba ya Yahwe njia yenye kifuniko ya Sabato, ambayo walikuwa wameijenga ndani ya nyumba hiyo[a], pamoja na ingilio la nje la mfalme[b], kwa sababu ya mfalme wa Ashuru[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jengo lenye kifuniko la Sabato,” “kibanda cha Sabato,” au “ukumbi wenye kifuniko wa Sabato.” Maana kamili ya istilahi hii adimu ya usanifu katika Kiebrania haijulikani.
    reason: lexical_alternative
  - marker: b
    text: Au “ingilio la nje la mfalme” kwa maana ya “ingilio la mfalme lililokuwa nje,” au “njia ya nje ya kuingilia kwa mfalme.”
    reason: lexical_alternative
  - marker: c
    text: Au “aligeuza kando,” “alibadili,” au “alihamisha.” Kitenzi cha Kiebrania chaweza kumaanisha kugeuza kando au kubadili mahali/pangilio, wala si kuondoa kabisa pekee.
    reason: lexical_alternative
  - marker: d
    text: Au “kwa ajili ya mfalme wa Ashuru”; yaweza pia kumaanisha “kwa kumwogopa mfalme wa Ashuru.”
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: njia yenye kifuniko ya Sabato
  rationale: Neno מיסך ni istilahi adimu ya usanifu, huenda likimaanisha jengo, njia, ukumbi, au kivuli chenye kifuniko kilichohusishwa na Sabato. Tafsiri hii ni ya kueleweka lakini kutokuwa na uhakika kumehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: ambayo walikuwa wameijenga ndani ya nyumba
  rationale: Inadumisha kishazi rejeshi na mtenda wa wingi asiyeainishwa katika בָּנוּ. Pia inahifadhi usemi wa Kiebrania 'nyumba,' unaomaanisha hekalu katika muktadha.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: ingilio la nje la mfalme
  rationale: מְבוֹא ni ingilio au njia ya kuingilia; muundo huu unabaki karibu na Kiebrania bila kuamua kama lilikuwa ingilio lililomilikiwa na mfalme au lililotumiwa naye.
- source_word: הֵסֵב
  choice: aligeuza mbali
  rationale: Hifili ya סבב inaweza kumaanisha kugeuza, kuelekeza kando, kubadili, au kuhamisha. 'Aligeuza mbali' huhifadhi upana huo kuliko 'aliondoa,' ingawa Kiswahili chake si cha kubainisha aina kamili ya badiliko la usanifu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Inahifadhi sitiari ya Kiebrania ya 'nyumba' kwa hekalu na kutaja jina la Mungu יהוה kama Yahwe.
- source_word: מִפְּנֵי מֶלֶךְ אַשׁוּר
  choice: kwa sababu ya mfalme wa Ashuru
  rationale: Hii ndiyo tafsiri pana zaidi ya sababu au msukumo; haiamui bila ushahidi wa kutosha kwamba Ahazi alifanya hivyo hasa kwa hofu.
theological_decisions:
- issue: Sababu ya mabadiliko yaliyofanywa na Ahazi chini ya shinikizo la Ashuru
  choice: kwa sababu ya mfalme wa Ashuru
  alternative: kwa kumwogopa mfalme wa Ashuru
  rationale: מִפְּנֵי inaweza kuonyesha sababu au hofu mbele ya mtu. Matini kuu inahifadhi maana pana, huku uwezekano wa hofu ukitajwa katika tanbihi.
- issue: Aina ya tendo lililoelezwa na הֵסֵב
  choice: aligeuza mbali
  alternative: aliondoa; alibadili; alihamisha
  rationale: Kitenzi hakilazimishi wazo la kuondoa kabisa. Tafsiri iliyochaguliwa inaacha wazi kama vitu hivyo vilibadilishwa, vilihamishwa, au vilielekezwa kando.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili kadiri inavyowezekana bila kuficha utata wa istilahi za usanifu, tendo la הֵסֵב, au nia ya Ahazi.
