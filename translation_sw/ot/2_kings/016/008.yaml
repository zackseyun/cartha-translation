  text: וַ/יִּקַּ֨ח אָחָ֜ז אֶת הַ/כֶּ֣סֶף וְ/אֶת הַ/זָּהָ֗ב הַ/נִּמְצָא֙ בֵּ֣ית יְהוָ֔ה וּ/בְ/אֹֽצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֥ח לְ/מֶֽלֶךְ אַשּׁ֖וּר שֹֽׁחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: sw
  text: Ahazi akachukua fedha na dhahabu zilizopatikana katika nyumba ya Yahwe na katika hazina za nyumba ya mfalme, akazipeleka kama rushwa[a] kwa mfalme wa Ashuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ushuru” au “zawadi”; neno la Kiebrania kwa kawaida humaanisha rushwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Ni simulizi endelevu la wakati uliopita; ‘akachukua’ ni la kawaida na linafuata moja kwa moja maana ya לקח.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: fedha na dhahabu
  rationale: Huhifadhi majina halisi ya madini yenye thamani; ‘fedha’ katika muktadha huu inaeleweka kuwa silver/utajiri wa fedha.
- source_word: הַנִּמְצָא
  choice: iliyopatikana
  rationale: Huwakilisha umbo la kutendwa la מצא na kuonyesha mali iliyokuwapo katika maeneo hayo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi neno halisi ‘nyumba’ na jina la Mungu, huku likibaki wazi katika muktadha wa hekalu.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: na katika hazina za nyumba ya mfalme
  rationale: ‘Hazina’ ni Kiswahili cha kawaida kwa mahali pa kuhifadhi mali; ‘nyumba ya mfalme’ huhifadhi ulinganifu wa בֵּית katika vifungu vyote viwili.
- source_word: וַיִּשְׁלַח
  choice: akaipeleka
  rationale: Kiambishi ‘-i-’ kinarejelea kwa kawaida jumla ya fedha na dhahabu kama malipo moja.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: kwa mfalme wa Ashuru
  rationale: Ni muundo wa kawaida na wa wazi wa Kiswahili kwa lengwa la kitu kilichopelekwa.
- source_word: שֹׁחַד
  choice: rushwa
  rationale: Neno hilo kwa kawaida lina maana hasi ya malipo ya kushawishi, si kodi tu isiyo na upande.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Tabia ya malipo kwa mfalme wa Ashuru
  choice: rushwa
  alternative: kodi; zawadi
  rationale: שֹׁחַד hubeba kwa kawaida dhana hasi ya malipo ya kushawishi. Tanbihi huhifadhi uwezekano wa kulitafsiri katika muktadha wa kisiasa kama kodi au zawadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi na chenye hadhi. Muundo ‘nyumba ya Yahwe’ na ‘nyumba ya mfalme’ umehifadhi urudiaji wa Kiebrania; ‘akaipeleka’ ni wa asili zaidi kuliko kutaja tena mali yote.
