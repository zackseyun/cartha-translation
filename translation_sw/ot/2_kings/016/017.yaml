translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa sentensi umegawanywa mara mbili ili kuonyesha wazi hatua za kuvunjwa kwa vifaa. Umoja wa “birika” umehifadhiwa kulingana na maandishi ya Kiebrania, ingawa “misingi” ni wingi.
