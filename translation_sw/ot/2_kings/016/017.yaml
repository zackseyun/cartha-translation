base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: sw
  text: Kisha Mfalme Ahazi akakata fremu za vibebeo, akaondoa birika[a] kutoka juu ya vibebeo hivyo. Akaishusha ile Bahari[b] kutoka juu ya ng’ombe wa shaba[c] waliokuwa chini yake, akaiweka juu ya sakafu ya mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “beseni la kuoshea.” Birika hili lilitumiwa katika huduma ya Hekalu.
    reason: lexical_alternative
  - marker: b
    text: “Bahari” ni jina la birika kubwa lililotengenezwa kwa ajili ya Hekalu la Sulemani (tazama 1 Wafalme 7:23–26).
    reason: cross_reference
  - marker: c
    text: Au, “mafahali wa shaba.” Neno la Kiebrania linaweza kumaanisha ng’ombe kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: akakata
  rationale: Kitenzi קצץ humaanisha kukata au kuondoa kwa kukata; “akakata” ni wazi na kinafaa katika muktadha wa kuvunjavunja vifaa.
- source_word: הַמִּסְגְּרוֹת
  choice: viunzi
  rationale: מִסְגְּרוֹת ni sehemu za fremu au mipaka ya muundo; “viunzi” ni neno la kawaida la Kiswahili linaloeleza fremu za kimuundo bila kuzifanya kuwa mapambo tu.
- source_word: הַמְּכֹנוֹת
  choice: misingi
  rationale: Katika muktadha wa vifaa vya Hekalu, מְכֹנוֹת ni miundo iliyobeba mabirika. “Misingi” inaeleza kazi yake ya kutegemeza, ingawa miundo hiyo ilikuwa na magurudumu.
- source_word: הַכִּיּוֹר
  choice: birika
  rationale: כִּיּוֹר ni chombo cha kuoshea kilichotumika katika huduma ya Hekalu. “Birika” ni neno linaloeleweka kwa urahisi kuliko istilahi ya kale.
- source_word: הַיָּם
  choice: ile Bahari
  rationale: Hili ni jina la chombo kikubwa cha maji katika Hekalu la Sulemani. Herufi kubwa na kiashiria “ile” vinaonyesha kwamba si bahari ya kawaida.
- source_word: הוֹרִיד
  choice: akaishusha
  rationale: Hifili ya ירד hapa inaeleza kukiondoa kitu kutoka juu ya vitegemezo vyake na kukiweka chini.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: ng’ombe wa shaba
  rationale: בָּקָר ni neno pana kwa ng’ombe; “ng’ombe” linahifadhi upana huo, nalo “shaba” ni istilahi ya kawaida ya Kiswahili kwa metali hii katika vifaa vya Hekalu.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: juu ya sakafu ya mawe
  rationale: מַרְצֶפֶת hueleza sehemu iliyotandikwa au kujengwa kwa mawe; “sakafu ya mawe” ni ya asili na haidokezi jukwaa lililoinuliwa.
