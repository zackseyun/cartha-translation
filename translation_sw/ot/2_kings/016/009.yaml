base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: sw
  text: Basi mfalme wa Ashuru akamsikiliza[a]. Mfalme wa Ashuru akapanda kwenda kuishambulia Damasko, akauteka, akawapeleka wakazi wa Damasko uhamishoni Kiri[b], naye akamuua Resini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaitikia ombi lake.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikiliza na kisha kutenda kulingana na yaliyosemwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “akaupeleka Kiri,” ambapo mji umetajwa badala ya wakazi wake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: akamsikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל hapa kina maana ya kumsikiliza mtu na kuitikia ombi lake; “akamsikiliza” ni cha kawaida na huacha matendo yanayofuata yaonyeshe jinsi alivyoitikia.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Muundo huu wa umilikaji umetafsiriwa moja kwa moja, na kirai kamili kimerudiwa kama katika Kiebrania ili kuhifadhi msisitizo wa simulizi.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: akapanda kwenda kuishambulia Damasko
  rationale: עלה katika simulizi la kijeshi huonyesha kusonga kwenda dhidi ya mji; “akapanda kwenda kuishambulia” huhifadhi wazo la kupanda na kuweka wazi muktadha wa kijeshi.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: akauteka
  rationale: תפשׂ hapa ni kuutwaa na kuudhibiti mji; kiambishi “-u-” kinarejelea mji wa Damasko.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: akawahamisha kwa nguvu wakazi wake hadi Kiri
  rationale: Kisarufi kiambishi kinarejelea Damasko, lakini mji unasimama badala ya wakazi wake. Tafsiri inaweka wazi kwamba wakazi ndio waliohamishwa kwa lazima, huku קִירָה ikionyesha mwelekeo “hadi Kiri.”
- source_word: קִירָה
  choice: Kiri
  rationale: Ni jina la mahali, hivyo limetoholewa kwa tahajia inayofaa Kiswahili badala ya kutafsiriwa.
- source_word: וְאֶת רְצִין הֵמִית
  choice: naye akamuua Resini
  rationale: Hifili ya מות ina maana ya kusababisha afe. “Akamuua” ni ya asili na sahihi katika Kiswahili bila kulazimisha hitimisho kwamba lilikuwa tendo rasmi la hukumu.
