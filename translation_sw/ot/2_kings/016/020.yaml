base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: sw
  text: Ahazi akalala na baba zake[a], akazikwa pamoja na baba zake katika Mji wa Daudi; Hezekia mwanawe akawa mfalme badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya Kiebrania “alilala na baba zake” ni fomula ya kawaida katika taarifa za vifo vya wafalme; hapa inamaanisha kwamba Ahazi alikufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Inahifadhi tamathali ya kawaida ya taarifa za kifalme kuhusu kifo, badala ya kuifasiri moja kwa moja kuwa “alikufa.”
- source_word: עִם אֲבֹתָיו
  choice: pamoja na babu zake
  rationale: Katika muktadha huu אבות humaanisha waliotangulia katika ukoo; “babu zake” ni Kiswahili cha kawaida kinachobeba maana hiyo vizuri kuliko “baba zake,” ambayo inaweza kueleweka kuwa mzazi wa kiume pekee.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Kauli hii ya Kiswahili huwasilisha kwa kawaida hali ya kutendwa ya kitenzi cha Kiebrania.
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Hili ni jina la mahali linalotambulika na linalolingana moja kwa moja na muundo wa Kiebrania.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika taarifa ya urithi wa ufalme, kitenzi hiki kinaonyesha kuingia madarakani; “akawa mfalme” ni cha asili na wazi kwa msomaji wa kisasa.
- source_word: חִזְקִיָּהוּ
  choice: Hezekia
  rationale: Limetumika umbo la jina lililozoeleka katika Biblia za Kiswahili.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Linahifadhi wazi uhusiano wa kifamilia uliotajwa katika Kiebrania.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Linahifadhi maana ya kuchukua nafasi ya mtawala aliyemtangulia katika mfululizo wa kifalme.
theological_decisions:
- issue: Tamathali “kulala pamoja na babu zake”
  choice: Tamathali ya Kiebrania imehifadhiwa katika matini na kufafanuliwa katika tanbihi kuwa taarifa ya kifo.
  alternative: Kutafsiri moja kwa moja “alikufa na kujiunga na babu zake.”
  rationale: Hii huhifadhi mtindo unaojirudia wa taarifa za vifo vya wafalme bila kulazimisha hitimisho la ziada kuhusu hali ya wafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kifalme umehifadhiwa kwa lugha inayoeleweka kwa urahisi; “pamoja nao” huepuka kurudia “pamoja na babu zake” bila kupoteza maana.
