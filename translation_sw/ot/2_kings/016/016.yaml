  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: sw
  text: Basi, kuhani Uria akafanya sawasawa na yote ambayo Mfalme Ahazi alikuwa amemwamuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Kitenzi עשה kina maana pana ya ‘kufanya’ au ‘kutengeneza.’ Hapa kinafuatwa na kauli inayoonyesha kufuata maagizo, hivyo ‘akafanya’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: אוּרִיָּה
  choice: Uria
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Nomino yenye uainisho humtambulisha Uria kwa wadhifa wake; Kiswahili kinaweza kuiweka kabla ya jina kwa mtiririko wa kawaida.
- source_word: כְּכֹל אֲשֶׁר
  choice: sawasawa na yote ambayo
  rationale: Kauli hii inaonyesha kwamba Uria alifuata kikamilifu kila jambo lililoamriwa, huku ikibaki wazi na ya asili katika Kiswahili.
- source_word: צִוָּה
  choice: alikuwa amemwamuru
  rationale: צוה humaanisha ‘kuamuru.’ Muundo huu unaonyesha kuwa amri ya mfalme ilitangulia kitendo cha Uria.
- source_word: הַמֶּלֶךְ אָחָז
  choice: Mfalme Ahazi
  rationale: Kiswahili huweka cheo kabla ya jina; ‘Ahazi’ ni namna ya jina hilo iliyozoeleka katika mapokeo ya Biblia ya Kiswahili.
theological_decisions:
- issue: Tathmini ya usimulizi kuhusu Uria kutii
  choice: Aya imetafsiriwa kama taarifa ya kitendo bila kuongeza hukumu ya kimaadili.
  alternative: Kutumia maneno yanayoonyesha wazi kwamba kitendo chake kilikubaliwa au kililaumiwa.
  rationale: Kiebrania kinasema tu kwamba Uria alitenda sawasawa na amri ya Ahazi. Muktadha mpana unaweza kufanya msomaji aione vibaya, lakini aya yenyewe haitoi hukumu hiyo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Basi’ hudumisha mwendelezo wa usimulizi; sentensi haiongezi idhini wala lawama isiyotajwa katika chanzo.
