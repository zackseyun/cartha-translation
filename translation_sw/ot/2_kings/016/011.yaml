base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: sw
  text: Basi Uria kuhani akaijenga madhabahu kulingana na yote ambayo Mfalme Ahazi alikuwa ametuma kutoka Damasko. Ndivyo Uria kuhani alivyofanya[a] mpaka Mfalme Ahazi alipokuja kutoka Damasko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafanya sawasawa.” Usemi wa Kiebrania “ndivyo ... alivyofanya” unasisitiza kwamba Uria alifanya sawasawa na yote aliyotuma Ahazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akaijenga
  rationale: Kitenzi בנה humaanisha kujenga; umbo la masimulizi limetolewa kwa “akaijenga,” likiunganisha tendo hili na muktadha uliotangulia.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: כהן ni neno la kawaida la “kuhani.” Jina hilo la cheo limerudiwa pamoja na Uria mara zote mbili kama ilivyo katika Kiebrania.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: מזבח ni “madhabahu”; kiambishi cha yambwa “-i-” katika “akaijenga” kinaonyesha nomino hii inayojulikana katika muktadha.
- source_word: כְּכֹל אֲשֶׁר
  choice: kulingana na yote ambayo
  rationale: Kauli hii inaonyesha ulinganifu kamili na maelezo au mfano uliotumwa, bila kuongeza kitu kisichotajwa wazi katika mstari huu.
- source_word: שָׁלַח
  choice: alikuwa ametuma
  rationale: Wakati timilifu unaonyesha kwamba Ahazi alituma hayo kabla Uria hajajenga; “alikuwa ametuma” huweka wazi mpangilio huo wa matukio.
- source_word: מִדַּמֶּשֶׂק
  choice: kutoka Damasko
  rationale: Kihusishi מִן huonyesha chanzo au mahali pa kuanzia. “Kutoka Damasko” ni tafsiri ya moja kwa moja katika sehemu zote mbili, huku mara ya pili kitenzi “kurudi” kikifanya mwelekeo wa safari uwe wa kawaida kwa Kiswahili.
- source_word: כֵּן עָשָׂה
  choice: Ndivyo ... alivyofanya
  rationale: Muundo huu wa Kiswahili unahifadhi msisitizo wa Kiebrania kwamba Uria alitekeleza mambo sawasawa na maagizo aliyopokea.
- source_word: עַד בּוֹא
  choice: kabla ... hajarudi
  rationale: 'Katika muktadha, עַד pamoja na kitenzi-jina בוא huweka kikomo cha wakati: kazi hiyo ilifanywa kufikia wakati wa kuwasili kwa mfalme. Kiswahili cha kawaida hueleza hapa kwa “kabla ... hajarudi,” bila kudokeza kuwa tendo liliendelea baada ya madhabahu kukamilika.'
- source_word: הַמֶּלֶךְ אָחָז
  choice: Mfalme Ahazi
  rationale: Huu ni mpangilio wa kawaida na wa heshima wa cheo pamoja na jina katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Biblia. “Madhabahu” na “kuhani” ni istilahi zilizozoeleka. Marudio ya “Uria kuhani” yamehifadhiwa kwa uaminifu na msisitizo.
