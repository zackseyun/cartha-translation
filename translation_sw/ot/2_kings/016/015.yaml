    issue: '"itakuwa yangu kwa ajili ya kuulizia"'
    rationale: Kitenzi "kuulizia" kwa kawaida huhitaji kitu au suala linalouliziwa; muundo uliopo unabaki wa kukatika na hausawazishi vizuri usemi mgumu wa Kiebrania.
  - severity: low
    issue: '"damu yote ... uirushe juu yake"'
    rationale: Ingawa inaeleweka, "kuirusha damu" si muundo wa kawaida zaidi wa Kiswahili kwa tendo la kitamaduni la kuweka damu madhabahuni. "Uimwage juu yake" ni ya asili zaidi na bado haipunguzi tendo hilo kuwa kunyunyiza kidogo.
