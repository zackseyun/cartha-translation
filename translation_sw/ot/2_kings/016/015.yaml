  source_fidelity: Orodha ya sadaka, uhusiano wa viwakilishi, na tofauti kati ya madhabahu kubwa na madhabahu ya shaba zimewasilishwa kwa uaminifu. Hata hivyo, kifungu cha mwisho "kwa ajili ya kuulizia" hakisikiki kiasili bila kitu kinachouliziwa. "Kwa kuulia shauri" ni usemi wa Kiswahili unaofaa katika muktadha huu na huhifadhi hali ya kutotambulikana kwa hakika ya לְבַקֵּר bila kutaja uaguzi mahususi.
  naturalness: Matini kwa ujumla ni Kiswahili Sanifu kinachoeleweka. Marekebisho ya mwisho hufanya amri ya Ahazi isikike ya kawaida zaidi; "damu ... uirushe" imebadilishwa kuwa "uimwage" ili isikike kwa kawaida katika Kiswahili huku ikidumisha tendo la kuitupa/dashi damu madhabahuni.
  terminology: Istilahi "sadaka ya kuteketezwa," "sadaka ya nafaka," "sadaka ya kinywaji," "dhabihu," na "madhabahu ya shaba" zinafaa na zimetumiwa kwa uthabiti. Tanbihi imerekebishwa kidogo ili mbadala wa "consider" uwe wa Kiswahili asilia.
