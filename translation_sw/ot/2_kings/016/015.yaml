base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: sw
  text: 'Kisha Mfalme Ahazi akamwamuru Uria kuhani, akisema, “Juu ya madhabahu kubwa uteketeze sadaka ya kuteketezwa ya asubuhi na sadaka ya nafaka ya jioni, pia sadaka ya kuteketezwa ya mfalme na sadaka yake ya nafaka, na sadaka ya kuteketezwa ya watu wote wa nchi, pamoja na sadaka zao za nafaka na sadaka zao za kinywaji. Damu yote ya sadaka ya kuteketezwa na damu yote ya dhabihu uimwage juu yake. Lakini madhabahu ya shaba itakuwa yangu kwa kuulia shauri.”[a]


    [a] Au “kwa ajili ya kuichunguza,” “kwa ajili ya kuitafakari,” au labda “kwa ajili ya kutafuta mwongozo kupitia kwayo.” Usemi wa Kiebrania ni mgumu, na kazi hasa ambayo Ahazi anaipa madhabahu ya shaba haijulikani kwa hakika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya kuichunguza,” “kwa ajili ya kuitafakari,” au labda “kwa ajili ya kutafuta mwongozo kupitia kwayo.” Usemi wa Kiebrania ni mgumu, na kazi hasa ambayo Ahazi anaipa madhabahu ya shaba haijulikani kwa hakika.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז
  choice: Kisha Mfalme Ahazi akamwamuru
  rationale: “Akamwamuru” huhifadhi nguvu ya amri ya kifalme; mpangilio wa cheo na jina ni wa kawaida katika Kiswahili.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: Uria kuhani
  rationale: Jina limetoholewa kwa umbo linalotumika katika Kiswahili, na cheo kimetafsiriwa kwa lugha ya kawaida.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: Juu ya madhabahu kubwa
  rationale: Huhifadhi kihusishi cha mahali na kivumishi kinachoitofautisha na madhabahu ya shaba.
- source_word: הַקְטֵר
  choice: uteketeze
  rationale: Katika muktadha wa dhabihu, kitenzi kinaeleza kuiteketeza sadaka juu ya madhabahu ili moshi wake upande; “uteketeze” ni wazi na cha kawaida.
- source_word: עֹלַת הַבֹּקֶר
  choice: sadaka ya kuteketezwa ya asubuhi
  rationale: Hutofautisha sadaka hii ya kuteketezwa kabisa na aina nyingine za sadaka.
- source_word: מִנְחַת הָעֶרֶב
  choice: sadaka ya nafaka ya jioni
  rationale: “Sadaka ya nafaka” inaonyesha maana ya kimatambiko ya מִנְחָה badala ya kutumia neno pana “sadaka” pekee.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: sadaka ya kuteketezwa ya watu wote wa nchi
  rationale: Tafsiri hii huhifadhi maana ya jumla ya kundi la watu bila kulifanya kwa lazima kuwa tabaka maalumu la watu wa kawaida.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: sadaka zao za nafaka na sadaka zao za kinywaji
  rationale: Wingi katika viambishi vya Kiebrania umehifadhiwa, na aina mbili za sadaka zimetofautishwa.
- source_word: עָלָיו תִּזְרֹק
  choice: uirushe juu yake
  rationale: Kitenzi זרק kinaonyesha kuitupa au kuirusha damu madhabahuni, si kuinyunyiza kidogo tu; rejeo la “yake” ni madhabahu kubwa.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: madhabahu ya shaba
  rationale: Hili ni neno la kawaida la Kiswahili kwa madhabahu iliyotengenezwa kwa bronze/copper alloy katika muktadha wa kibiblia.
- source_word: יִהְיֶה לִּי לְבַקֵּר
  choice: itakuwa yangu kwa ajili ya kuulizia
  rationale: Huhifadhi wazo linalowezekana la mashauriano au kutafuta mwongozo bila kubainisha utaratibu ambao Kiebrania hakielezi wazi.
theological_decisions:
- issue: Maana ya לְבַקֵּר kuhusu matumizi yaliyotengewa madhabahu ya shaba
  choice: kwa ajili ya kuulizia
  alternative: kwa ajili ya kuichunguza; kwa ajili ya kuifikiria; kwa ajili ya kutafuta mwongozo kupitia kwayo
  rationale: Usemi huu una utata wa kweli. Tafsiri kuu inadokeza matumizi ya kuulizia bila kuamua kuwa ulikuwa utaratibu maalumu wa uaguzi; tanbihi huhifadhi uwezekano mwingine wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi za dhabihu zimetumiwa kwa uthabiti; sentensi ndefu ya orodha imegawanywa kwa alama za uakifishaji bila kuvunja uhusiano wake wa kisarufi.
