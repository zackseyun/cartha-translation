base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: sw
  text: Kisha Elisha akafika Damasko. Ben-hadadi, mfalme wa Aramu,[a] alikuwa mgonjwa, naye akaambiwa, “Mtu wa Mungu amefika hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfalme wa Siria.” Kiebrania kinasema “Aramu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kisha ... akaenda
  rationale: Waw ya mfululizo inaendeleza simulizi. Katika muktadha huu, akaenda ni ya kawaida kwa Kiswahili kinachotazama mwendo wa Elisha kuelekea Damasko.
- source_word: אֱלִישָׁע
  choice: Elisha
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: דַּמֶּשֶׂק
  choice: Damasko
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali.
- source_word: וּבֶן־הֲדַד
  choice: Wakati huo Ben-hadadi
  rationale: Waw inaanzisha taarifa ya mazingira kuhusu hali ya Ben-hadadi badala ya tukio jingine tu katika mfululizo.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: Aramu inafuata moja kwa moja jina la Kiebrania la eneo na watu, bila kulibadili kimafsiri kuwa Siria.
- source_word: חֹלֶה
  choice: alikuwa mgonjwa
  rationale: Kivumishi-tendo hiki kinaeleza hali ya Ben-hadadi kwa lugha ya kawaida na wazi.
- source_word: וַיֻּגַּד לוֹ
  choice: Akaambiwa
  rationale: Hifadhi hali ya kutendwa ya Kiebrania kwa Kiswahili cha asili bila kuongeza mtendaji ambaye hakutajwa.
- source_word: לֵאמֹר
  choice: —
  rationale: Mfumo wa kunukuu katika Kiswahili hauhitaji neno tofauti linalolingana na kusema; maana yake inawasilishwa moja kwa moja kwa nukuu.
- source_word: בָּא
  choice: amefika
  rationale: 'Kauli timilifu katika taarifa inaonyesha kuwasili ambako matokeo yake yanaendelea: mtu huyo sasa yupo hapo.'
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mtu wa Mungu
  rationale: Huhifadhi cheo halisi cha Kiebrania badala ya kukifafanua kuwa nabii wa Mungu.
- source_word: עַד הֵנָּה
  choice: hapa
  rationale: Hili ndilo tamko la kawaida la Kiswahili kwa kuwasili mahali alipo msemaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wa heshima. Muundo wa kutendwa na cheo “Mtu wa Mungu” vimehifadhiwa, huku fomula ya Kiebrania ya kuanzisha nukuu ikitolewa kwa njia ya kawaida ya Kiswahili.
