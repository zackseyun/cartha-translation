revisions:
- from: Kisha Elisha akaenda Damasko. Wakati huo Ben-hadadi, mfalme wa Aramu,[a] alikuwa mgonjwa. Akaambiwa, “Mtu wa Mungu amefika hapa.”
  to: Kisha Elisha akafika Damasko. Ben-hadadi, mfalme wa Aramu,[a] alikuwa mgonjwa, naye akaambiwa, “Mtu wa Mungu amefika hapa.”
  rationale: The revision replaces "akaenda" with "akafika" to represent Elisha's arrival as stated by the Hebrew, and omits the added temporal phrase "Wakati huo." "Naye akaambiwa" keeps the passive, links the report to Ben-hadad unambiguously, and remains idiomatic Swahili. No theological or interpretive expansion has been introduced.
  reviewer_model: gpt-5.6-terra
