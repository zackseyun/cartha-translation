  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: sw
  text: Na katika mwaka wa tano wa Yoramu mwana wa Ahabu, mfalme wa Israeli[a], Yehoshafati akiwa mfalme wa Yuda, Yehoramu mwana wa Yehoshafati, mfalme wa Yuda[b], alianza kutawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “na Yehoshafati mfalme wa Yuda.” Kishazi cha Kiebrania kimebanwa; baadhi ya watu hukielewa kuwa kinaonyesha kipindi cha utawala wa pamoja.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania hutofautisha majina haya: “Yoramu” (mfalme wa Israeli) na “Yehoramu” (mwana wa Yehoshafati, mfalme wa Yuda), ingawa maumbo hayo yanakaribiana sana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: Katika mwaka wa tano
  rationale: Muundo huu unatoa taarifa ya wakati kwa Kiswahili cha kawaida. Namba ya Kiebrania ina kazi ya namba ya mpango katika fomula hii ya miaka ya utawala.
- source_word: לְ/יוֹרָם
  choice: wa Yoramu
  rationale: Kihusishi kinaonyesha kwamba mwaka huo ulihesabiwa katika utawala wa Yoramu; “wa” ni muundo wa kawaida wa Kiswahili katika taarifa kama hii.
- source_word: בֶּן אַחְאָב
  choice: mwana wa Ahabu
  rationale: Uhusiano wa ukoo umetafsiriwa moja kwa moja kwa utambulisho wa kihistoria.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Ni cheo cha kifalme kilicho wazi na cha kawaida.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Yehoshafati akiwa mfalme wa Yuda
  rationale: Kishazi cha Kiebrania hakina kitenzi na kimebanwa. “Akiwa” huwasilisha mazingira ya wakati kwa Kiswahili cha asili bila kudai wazi kwamba kulikuwa na utawala wa pamoja.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika taarifa za kifalme, kitenzi hiki hapa kinaashiria kuanza kwa utawala, si kueleza muda wote wa kutawala.
- source_word: יְהוֹרָם
  choice: Yehoramu
  rationale: Tahajia hii inahifadhi tofauti iliyopo katika Kiebrania kati ya יְהוֹרָם, mfalme wa Yuda, na יוֹרָם, mfalme wa Israeli.
- source_word: בֶּן יְהוֹשָׁפָט
  choice: mwana wa Yehoshafati
  rationale: Uhusiano wa ukoo umehifadhiwa kwa uwazi na utambulisho wa kihistoria.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo hiki cha mwisho kimedumishwa kwa sababu kipo katika Kiebrania na kinabainisha ufalme wa Yehoramu.
theological_decisions:
- issue: Kishazi cha wakati kilichobanwa kinachohusisha utawala wa Yehoshafati na kuanza kutawala kwa Yehoramu
  choice: Kutafsiri kishazi kisicho na kitenzi kwa “Yehoshafati akiwa mfalme wa Yuda,” bila kueleza zaidi mpangilio wa tawala hizo.
  alternative: Kutafsiri kwa namna ya moja kwa moja zaidi, “na Yehoshafati mfalme wa Yuda,” au kutaja wazi utawala wa pamoja.
  rationale: Kiebrania hakisemi wazi kwamba kulikuwa na utawala wa pamoja. Tafsiri kuu inaeleza mazingira ya wakati kwa Kiswahili kinachoeleweka huku ikiacha mvutano wa mpangilio wa matukio bila kuutatua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa na unaosomeka kwa urahisi. Majina “Yoramu” na “Yehoramu” yametofautishwa ili kuakisi maumbo tofauti ya Kiebrania. Muundo “akiwa mfalme” ni wa asili lakini hauingizi hitimisho lisilotajwa kuhusu utawala wa pamoja.
