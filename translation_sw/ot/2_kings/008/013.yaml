review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Hazael’s self-abasing rhetorical response, the unspecified ‘great thing,’ Yahweh’s revelation to Elisha, and Hazael’s future kingship over Aram. The rendering ‘mfalme juu ya Aramu’ appropriately reflects the Hebrew preposition עַל, with a suitable idiomatic alternative in the note.
  naturalness: 'The first clause is awkwardly punctuated: in ‘mtumishi wako ni nani—mbwa huyu—,’ the appositional phrase ‘mbwa huyu’ is visually attached to ‘nani’ rather than clearly identifying the speaker as the self-deprecating ‘dog.’ Reordering it produces clear, natural Standard East African Swahili while retaining the rhetorical question.'
  terminology: ‘Hazaeli,’ ‘Elisa,’ ‘Yahwe,’ and ‘Aramu’ are appropriate. ‘Mtumishi wako’ correctly conveys the conventional courtly self-humbling expression without needlessly specifying slave status. ‘Jambo hili kubwa’ preserves the Hebrew’s broad expression.
  issues:
  - severity: medium
    issue: Unclear placement of the self-deprecating apposition
    rationale: In ‘Lakini mtumishi wako ni nani—mbwa huyu—hata afanye,’ the dashes make ‘mbwa huyu’ interrupt the predicate ‘ni nani,’ which can obscure that Hazael calls himself a dog. Place the apposition immediately after ‘mtumishi wako’ and introduce the question with ‘Je,’ for clear Swahili syntax.
  revised_text: Hazaeli akasema, “Je, mtumishi wako, mbwa huyu, ni nani hata afanye jambo hili kubwa?” Elisa akasema, “Yahwe amenionyesha kwamba utakuwa mfalme juu ya Aramu[a].”
