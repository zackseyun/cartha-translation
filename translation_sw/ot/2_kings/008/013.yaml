  text: וַ/יֹּ֣אמֶר חֲזָהאֵ֔ל כִּ֣י מָ֤ה עַבְדְּ/ךָ֙ הַ/כֶּ֔לֶב כִּ֣י יַעֲשֶׂ֔ה הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע הִרְאַ֧/נִי יְהוָ֛ה אֹתְ/ךָ֖ מֶ֥לֶךְ עַל אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: sw
  text: Hazaeli akasema, “Je, mtumishi wako, mbwa huyu, ni nani hata afanye jambo hili kubwa?” Elisa akasema, “Yahwe amenionyesha kwamba utakuwa mfalme juu ya Aramu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme wa Aramu.” Kiebrania kihalisi, “mfalme juu ya Aramu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מָה
  choice: Lakini ... ni nani
  rationale: Katika muktadha huu maneno haya yanaanzisha pingamizi la Hazaeli lenye mshangao na kutoamini; “Lakini ... ni nani” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya usemi.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Huu ni usemi wa kujishusha mbele ya mwenye cheo; “mtumishi” unafaa bila kudokeza isivyo lazima kwamba alikuwa mtumwa kisheria.
- source_word: הַכֶּלֶב
  choice: mbwa huyu
  rationale: Nomino hiyo ni bainifu na inatumika kama maelezo ya kujidunisha. “Mbwa huyu” huhifadhi taswira kali na kurejelea msemaji mwenyewe.
- source_word: כִּי יַעֲשֶׂה
  choice: hata afanye
  rationale: Muundo huu unaonyesha kutokuamini kwamba mtu duni kama huyo angefanya jambo lililotajwa; “hata afanye” huhifadhi nguvu ya swali bila kulifunga kwa uwezo au wakati ujao pekee.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: jambo hili kubwa
  rationale: דבר lina maana pana ya jambo, tendo, au tukio. “Jambo hili kubwa” huhifadhi upana huo na ukubwa wa yale yaliyotabiriwa bila kuongeza tafsiri ya kimaadili.
- source_word: הִרְאַנִי
  choice: amenionyesha
  rationale: Hali timilifu ya Kiswahili inaonyesha ufunuo uliotolewa ambao matokeo yake yanaendelea kuwa muhimu katika kauli ya sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetolewa moja kwa moja kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: mfalme juu ya Aramu
  rationale: Huhifadhi kwa karibu kihusishi עַל, “juu ya,” na jina la kale Aramu; usemi wa kawaida zaidi “mfalme wa Aramu” umewekwa katika tanbihi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja Tetragramatoni; “Yahwe” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Kauli ya ufunuo kuhusu ufalme wa Hazaeli
  choice: Yahwe amenionyesha kwamba utakuwa mfalme
  alternative: Yahwe amenionyesha wewe ukiwa mfalme
  rationale: Tafsiri hii inawasilisha wazi maudhui ya ufunuo wa kinabii bila kuongeza madai kuhusu kibali cha Mungu kwa matendo ya Hazaeli au namna atakavyopata ufalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mistari mirefu imetenganishwa kwa vistari ili kuonyesha kwamba “mbwa huyu” ni kujirejelea kwa kujidunisha. Tanbihi imewekwa baada ya “Aramu,” mahali inapohusika moja kwa moja.
