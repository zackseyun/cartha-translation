  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: sw
  text: Basi Edomu iliasi, ikajiondoa chini ya utawala wa Yuda mpaka leo[a]. Ndipo Libna nayo ikaasi wakati huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikaasi” au “ikajitenga.” Kitenzi cha Kiebrania hapa kina maana ya uasi wa kisiasa dhidi ya utawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: ikaasi
  rationale: Katika muktadha huu wa kisiasa, kitenzi פשע kinaonyesha uasi dhidi ya mamlaka iliyokuwa ikitawala. ‘Ikaasi’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: utawala wa Yuda
  rationale: Nahau ya Kiebrania ‘kutoka chini ya mkono wa Yuda’ humaanisha kujiondoa chini ya mamlaka au udhibiti wa Yuda. ‘Utawala wa Yuda’ huwasilisha maana hiyo kwa Kiswahili cha asili bila kudai kwamba ni mkono halisi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni kauli ya kawaida ya wakati inayoonyesha kwamba hali hiyo iliendelea hadi wakati wa mwandishi.
- source_word: אָז
  choice: Wakati huo
  rationale: Neno hili linaunganisha uasi wa Libna na kipindi kilekile cha kihistoria; Kiswahili hiki pia huepuka kurudia ‘wakati huo’ mwishoni mwa sentensi.
- source_word: תִּפְשַׁע
  choice: ikaasi
  rationale: Ni kitenzi kilekile cha kisiasa kilichotumiwa kwa Edomu; uchaguzi uleule huhifadhi ulinganifu wa mstari.
- source_word: לִבְנָה
  choice: Libna
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Kirai hiki huweka uasi wa Libna katika kipindi kilekile. Kwa Kiswahili cha asili kimeunganishwa na אָז, ambayo ina maana inayokaribiana, kuwa kirai kimoja mwanzoni.
