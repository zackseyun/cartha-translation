language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֤ם אִמּ/וֹ֙ עֲתַלְיָ֔הוּ בַּת עָמְרִ֖י מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: sw
  text: Ahazia alikuwa na umri wa miaka ishirini na miwili alipoanza kutawala, naye alitawala kwa mwaka mmoja huko Yerusalemu. Mama yake aliitwa Athalia, binti[a] ya Omri, mfalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mzao wa Omri.” Katika Kiebrania, neno “binti” wakati mwingine linaweza kumaanisha mzao wa kike au mshiriki wa nasaba ya kifalme, si lazima binti wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na miwili
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; tafsiri hii ni ya asili katika Kiswahili na inahifadhi umri kamili.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Kauli hii ya kifalme inaeleza wakati Ahazia alipoingia madarakani; Kiswahili hiki ni wazi na cha kawaida.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: naye alitawala kwa mwaka mmoja
  rationale: Inahifadhi moja kwa moja muda wa utawala uliotajwa katika Kiebrania.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kiashirio cha mahali 'huko' kinafanya sentensi iwe ya asili katika Kiswahili huku kikihifadhi mahali pa utawala.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Ni Kiswahili cha sasa na cha asili kwa kauli ya Kiebrania inayosema jina la mama yake.
- source_word: עֲתַלְיָהוּ
  choice: Athalia
  rationale: Tahajia ya jina inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בַּת עָמְרִי
  choice: binti ya Omri
  rationale: Neno la msingi בַּת linamaanisha 'binti'; uwezekano wa maana pana ya ukoo umehifadhiwa katika tanbihi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Hutambulisha kwa usahihi cheo cha kifalme cha Omri.
theological_decisions:
- issue: Maana ya ukoo katika kauli ‘binti ya Omri’
  choice: Kudumisha neno halisi la kindugu ‘binti ya Omri’ katika matini kuu.
  alternative: mzao wa Omri
  rationale: Neno la Kiebrania linaweza kumaanisha binti wa moja kwa moja au mwanamke wa ukoo au nasaba fulani. Matini kuu inahifadhi maana ya msingi, huku tanbihi ikihifadhi uwezekano mpana bila kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Majina yametolewa kwa tahajia zinazotambulika katika mapokeo ya Biblia ya Kiswahili.
