base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: sw
  text: Mfalme akamwambia Hazaeli, “Chukua zawadi mkononi mwako, uende ukakutane na mtu wa Mungu. Kisha umwulize Yahweh kupitia kwa mtu huyo, ukisema, ‘Je, nitapona ugonjwa huu?[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, nitaishi na kupona ugonjwa huu?” Kitenzi cha Kiebrania kihalisi ni “kuishi,” hapa kikiwa na maana ya kunusurika au kupona.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: zawadi
  rationale: Katika simulizi hili ni zawadi inayopelekwa kwa mtu wa Mungu wakati wa kutafuta jibu, si sadaka ya ibada wala kodi.
- source_word: לִקְרַאת
  choice: ukakutane na
  rationale: Kiswahili hiki kinaonyesha kusudi la kwenda na ni cha kawaida katika muktadha huu.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Inahifadhi cheo cha Kiebrania badala ya kukibadili moja kwa moja kuwa ‘nabii,’ hivyo kudumisha uzito wake wa kisimulizi na kitheolojia.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: umwulize Yahweh kupitia kwake
  rationale: Hapa דרשׁ inahusu kutafuta jibu kutoka kwa Yahweh, na מֵאֹתוֹ inaonyesha kuwa mtu wa Mungu ndiye mpatanishi wa jibu hilo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kama jina binafsi ‘Yahweh,’ si kwa cheo.
- source_word: הַאֶחְיֶה
  choice: nitapona
  rationale: Ingawa kitenzi hicho kihalisi ni ‘kuishi,’ katika swali kuhusu ugonjwa kinamaanisha kunusurika au kupona.
- source_word: מֵחֳלִי זֶה
  choice: ugonjwa huu
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi kwa hali ya ugonjwa wa mfalme.
- source_word: בְּיָדְךָ
  choice: mkononi mwako
  rationale: Inahifadhi taswira ya Kiebrania ya kubeba zawadi mwenyewe na inaeleweka vizuri kwa Kiswahili.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Maana ya הַאֶחְיֶה katika muktadha wa ugonjwa
  choice: nitapona
  alternative: nitaishi
  rationale: ‘Nitapona’ huwasilisha maana ya kimuktadha bila kuficha maana halisi ya ‘kuishi,’ ambayo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya swali la kupona, ambako tofauti ya kimaana inahusika.
