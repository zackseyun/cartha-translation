  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: sw
  text: Basi akaondoka kwa Elisha, akaja kwa bwana wake. Bwana huyo akamwuliza, “Elisha alikuambia nini?” Naye akasema, “Aliniambia, ‘Hakika utapona[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Hakika utaishi.” Kiebrania hutumia kitenzi katika umbo la infinitivu pamoja na kitenzi kilichonyambuliwa ili kusisitiza: kihalisi, “kuishi utaishi.” Katika muktadha huu maneno hayo yanahusu kupona ugonjwa.'
    reason: Tofauti ya kileksika na ufafanuzi wa muundo wa Kiebrania.
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: akaondoka kwa Elisha
  rationale: Kitenzi na kihusishi vinaonyesha kuondoka mbele ya Elisha; usemi huu ni wa kawaida na unaendeleza simulizi kwa ufasaha.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: akarudi kwa bwana wake
  rationale: Katika muktadha, Hazaeli anarudi kwa mfalme aliyemtuma. ‘Akarudi kwa’ huwasilisha mwendo huo kwa Kiswahili cha kawaida, huku ‘bwana wake’ ikihifadhi uhusiano wa aliye chini ya mamlaka ya mwingine.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: Elisha alikuambia nini?
  rationale: Huu ni mpangilio wa kawaida wa swali katika Kiswahili na unawakilisha kwa usahihi maana ya maneno ya Kiebrania.
- source_word: אָמַר לִי
  choice: Aliniambia
  rationale: Ni njia ya asili ya kutanguliza taarifa iliyonukuliwa katika Kiswahili.
- source_word: חָיֹה תִחְיֶה
  choice: Hakika utapona
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza uhakika. Kwa kuwa mazungumzo yanahusu ugonjwa wa mfalme, ‘utapona’ huwasilisha maana ya kimuktadha, huku maana halisi ya ‘utaishi’ ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya אֲדֹנָיו katika mazingira ya kifalme
  choice: bwana wake
  alternative: mkuu wake
  rationale: Neno hili linamtaja Ben-hadadi kama mwenye mamlaka juu ya Hazaeli, wala si cheo cha Mungu. Herufi ndogo na muktadha huzuia kulifanya kuwa jina la Mungu.
- issue: Maana ya חָיֹה תִחְיֶה katika taarifa ya Hazaeli
  choice: Hakika utapona
  alternative: Hakika utaishi
  rationale: Muktadha wa ugonjwa unaunga mkono maana ya kupona, lakini tanbihi inadumisha usemi halisi wa Kiebrania na mvutano wake wa kimasimulizi bila kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimewekwa kwa mtiririko wa kawaida wa simulizi; ‘bwana’ limeandikwa kwa herufi ndogo kwa sababu linamtaja mtawala wa kibinadamu.
