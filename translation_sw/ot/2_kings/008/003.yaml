  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: sw
  text: Miaka saba ilipokwisha, yule mwanamke akarudi kutoka nchi ya Wafilisti, akatoka kumlilia mfalme kwa ajili ya nyumba yake na shamba lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumsihi mfalme” au “kumwomba mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: Baada ya miaka saba kumalizika
  rationale: Kirai hiki kinaonyesha mwisho wa kipindi cha miaka saba. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya wakati.
- source_word: וַתָּשָׁב
  choice: akarudi
  rationale: Kitenzi שׁוּב hapa kinaonyesha kurudi kutoka mahali alikokuwa ameishi kwa muda.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: nchi ya Wafilisti
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kiebrania ‘nchi ya Wafilisti.’
- source_word: וַתֵּצֵא
  choice: akaenda
  rationale: Ingawa יָצָא kimsingi ni ‘kutoka,’ katika mfuatano huu inaeleza kwenda kwake kwa mfalme. ‘Akaenda’ ni Kiswahili cha asili bila kuongeza mahali alipotoka.
- source_word: לִצְעֹק
  choice: kumlilia
  rationale: צָעַק humaanisha kulia kwa sauti kwa kutaka msaada au haki. ‘Kumlilia’ kinahifadhi nguvu ya neno hilo na katika muktadha huu kinaeleweka kama kuwasilisha ombi la kutendewa haki.
- source_word: אֶל הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiambishi cha yambwa katika ‘kumlilia’ humtambulisha mfalme kuwa ndiye anayeombwa msaada, kwa Kiswahili cha kawaida.
- source_word: בֵּיתָהּ
  choice: nyumba yake
  rationale: Kwa kuwa neno hili limeambatanishwa na shamba katika suala la mali, maana halisi ya nyumba ndiyo inayofaa zaidi.
- source_word: שָׂדָהּ
  choice: shamba lake
  rationale: שָׂדֶה hapa ni shamba au ardhi inayolimwa; ‘shamba’ linahifadhi umahususi wa neno kuliko ‘ardhi.’
