translation:
  language: sw
  text: Mfalme alikuwa akimwambia Gehazi, mtumishi[a] wa mtu wa Mungu, “Tafadhali, nisimulie mambo yote makuu aliyofanya Elisha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mhudumu” au “kijana”; neno la Kiebrania נַעַר linaweza kumaanisha mtumishi, mhudumu, au kijana kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: alikuwa akizungumza
  rationale: Kirai cha wakati uliopita kinachoendelea kinaonyesha tendo la usuli lililokuwa likiendelea katika simulizi.
- source_word: גֵּחֲזִי
  choice: Gehazi
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: נַעַר
  choice: mtumishi
  rationale: Katika uhusiano wa Gehazi na mtu wa Mungu, neno hili linaeleweka hasa kama jukumu la utumishi, ingawa linaweza pia kumaanisha mhudumu au kijana.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Huhifadhi cheo cha Kiebrania bila kukifafanua zaidi kuwa ‘nabii wa Mungu.’
- source_word: סַפְּרָה נָּא לִי
  choice: Tafadhali nieleze
  rationale: Kitenzi kinadai kusimulia au kueleza, na נָא huonyesha ombi la heshima; Kiswahili hiki ni cha kawaida na huhifadhi vyote.
- source_word: כָּל הַגְּדֹלוֹת
  choice: mambo yote makuu
  rationale: Kivumishi cha wingi kimetumiwa kama nomino kwa matendo au mambo makubwa; tafsiri hii haibani maana kuwa miujiza pekee.
- source_word: עָשָׂה
  choice: amefanya
  rationale: Wakati timilifu unaonyesha matendo yaliyotendwa hadi wakati wa mazungumzo na ambayo bado ndiyo mada ya ombi.
- source_word: וְהַמֶּלֶךְ
  choice: Mfalme
  rationale: Kiunganishi cha mwanzo kinaendeleza simulizi; katika Kiswahili si lazima kutafsiriwa kwa neno tofauti hapa.
