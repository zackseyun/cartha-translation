  yaml_path: translation/ot/2_kings/008/017.yaml
  text: He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: sw
  text: Alikuwa na umri wa miaka thelathini na miwili alipoanza kutawala, naye akatawala huko Yerusalemu kwa miaka minane.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: Alikuwa na umri wa miaka thelathini na miwili
  rationale: Hii ni nahau ya Kiebrania inayoeleza umri; Kiswahili cha kawaida hutumia muundo ‘alikuwa na umri wa miaka ...’ badala ya tafsiri ya neno kwa neno ‘mwana wa miaka ...’.
- source_word: הָיָה בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha umri wake wakati wa kuingia madarakani; ‘alipoanza kutawala’ ni wa asili na sahihi katika Kiswahili.
- source_word: וּשְׁמֹנֶה שנה
  choice: kwa miaka minane
  rationale: Kirai hiki kinaonyesha muda wa utawala; kihusishi ‘kwa’ kinaifanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki humaanisha kutenda kama mfalme au kuendesha utawala, si kuwa na cheo tu.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi cha Kiebrania kinaonyesha mahali alipotekeleza utawala wake; ‘huko’ ni rejeo la kawaida kwa mji uliotajwa.
