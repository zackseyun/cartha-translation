  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: sw
  text: 'Hazaeli akasema, “Kwa nini bwana wangu analia?” Akasema, “Kwa sababu najua uovu utakaowatendea wana wa Israeli[a]: ngome zao utazitia moto[b], vijana wao utawaua kwa upanga, watoto wao wadogo utawaponda vipande vipande, na wanawake wao wajawazito utawapasua.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watu wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “utaziteketeza ngome zao kwa moto.” Kwa neno halisi, “utazipeleka motoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni cheo cha heshima ambacho Hazaeli anatumia kumwelekea Elisha, wala si jina la Mungu. ‘Bwana wangu’ ni Kiswahili cha kawaida na chenye staha.
- source_word: בֹכֶה
  choice: analia
  rationale: Kitenzi kishirikishi kinaonyesha tendo linaloendelea. ‘Analia’ ni cha asili katika Kiswahili na kinafaa kwa uzito wa tukio.
- source_word: כִּי יָדַעְתִּי
  choice: Kwa sababu najua
  rationale: כִּי linaanzisha sababu ya kulia, na hali timilifu ya יָדַע ina maana ya sasa katika muktadha huu.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: uovu utakaowatendea
  rationale: Muundo huu unaunganisha רָעָה na tendo litakalofanywa dhidi ya Israeli. ‘Uovu’ huhifadhi uzito wa kimaadili wa matendo yanayotajwa.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi nahau ya Kiebrania kwa karibu, huku ikirejelea watu wa Israeli kwa ujumla.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: ngome zao utazitia moto
  rationale: ‘Ngome’ huwasilisha sehemu zenye ulinzi, na ‘kuzitia moto’ ni usemi wa asili unaohifadhi picha ya Kiebrania ya kuzipeleka motoni.
- source_word: וּבַחֻרֵיהֶם
  choice: vijana wao
  rationale: Neno hilo humaanisha vijana wa kiume walio katika nguvu zao, ambao katika muktadha huu wanaweza kuwa watu wa kupigana.
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: utawaua kwa upanga
  rationale: Tafsiri ya moja kwa moja huhifadhi chombo cha mauaji na ukali wa unabii.
- source_word: עֹלְלֵיהֶם
  choice: watoto wao wadogo
  rationale: Neno hilo linarejelea watoto wadogo au wachanga; uchaguzi huu hauzuii maana kwa watoto waliozaliwa karibuni pekee.
- source_word: תְּרַטֵּשׁ
  choice: utawaponda vipandevipande
  rationale: Kitenzi kinaonyesha kuponda au kubamiza kwa ukatili. Usemi huu wa Kiswahili huhifadhi ukali na picha ya tendo hilo.
- source_word: הָרֹתֵיהֶם תְּבַקֵּעַ
  choice: wanawake wao wajawazito utawapasua
  rationale: Maneno ya moja kwa moja huhifadhi ukatili wa unabii bila kuongeza ufafanuzi wa kianatomia usiotajwa wazi katika Kiebrania.
theological_decisions:
- issue: Maana ya לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Nahau ya Kiebrania imehifadhiwa, lakini tanbihi inaonyesha kwamba inawarejelea watu wa Israeli kwa ujumla.
- issue: Ukatili unaoelezwa katika unabii
  choice: Kutaja matendo hayo wazi bila kuyapunguza makali
  alternative: Kutumia maneno mepesi kama ‘kuwadhuru’ au ‘kuwashambulia’
  rationale: Kiebrania kinaeleza ukatili huu kwa makusudi na kwa maneno makali; kuupunguza kungebadili uzito wa kimaadili na kihisia wa unabii.
- issue: Mtendaji wa kauli ya pili וַיֹּאמֶר
  choice: Akasema
  alternative: Elisha akasema
  rationale: Kiebrania kinatumia kiwakilishi cha mtendaji bila kulitaja tena jina. Kiswahili kinaweza kuhifadhi muundo huo; muktadha unaonyesha kuwa anayejibu ni Elisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa viambajengo katika orodha (‘ngome zao ... vijana wao ...’) unahifadhi mkazo wa Kiebrania. Lugha ya ukatili imeachwa wazi kwa sababu ndiyo tabia ya matini chanzi; haijalainishwa wala kuongezewa maelezo.
