base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: sw
  text: Basi Yoramu akavuka kwenda Zairi[a], akiwa na magari yote ya vita aliyokuwa nayo. Akainuka usiku, akawapiga Waedomu waliomzunguka na makamanda wa magari ya vita; lakini watu wakakimbilia mahema yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “kwenda Seiri.” Jina la mahali צָעִירָה katika Kiebrania ni gumu; wengine hulichukulia kuwa umbo linalohusiana na Seiri/Edomu badala ya jina tofauti la Zairi.
    reason: alternative_reading
  - marker: b
    text: “Kukimbilia mahema yao” ni nahau ya Kiebrania yenye maana kwamba walitawanyika na kurudi nyumbani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: akavuka kwenda
  rationale: Kitenzi עבר kina maana ya kupita au kuvuka. Katika muktadha huu wa kijeshi, “akavuka kwenda” kinaonyesha kusonga kuelekea mahali fulani bila kubainisha njia ambayo Kiebrania hakuitaji.
- source_word: צָעִירָה
  choice: kwenda Zairi
  rationale: Umbo la Kimasoreti limechukuliwa kama jina la mahali lenye kiambishi cha kuelekea. Kwa kuwa usomaji huu ni mgumu na huenda ukahusiana na Seiri, uwezekano huo umewekwa katika tanbihi.
- source_word: הָרֶכֶב
  choice: magari yote ya vita
  rationale: רכב hapa inaonyesha magari ya vita au kikosi chake kwa ujumla. Tafsiri hii ni wazi kwa msomaji wa kisasa na inafaa katika muktadha wa kijeshi.
- source_word: קָם לַיְלָה
  choice: Akainuka usiku
  rationale: Tafsiri hii inahifadhi picha ya Kiebrania ya kuinuka na kuchukua hatua wakati wa usiku bila kudai kwamba alikuwa amelala.
- source_word: וַיַּכֶּה
  choice: akawashambulia
  rationale: נכה ni kitenzi kipana cha kupiga au kushambulia. “Akawashambulia” ni cha kawaida katika simulizi la kijeshi na hakidai ushindi kamili.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: Waedomu waliokuwa wamemzunguka
  rationale: Jina la taifa limetafsiriwa kwa watu wake kulingana na muktadha, huku kirai kishirikishi kikihifadhi hali ya Yoramu kuzingirwa.
- source_word: שָׂרֵי הָרֶכֶב
  choice: makamanda wa magari yao ya vita
  rationale: שׂרים hapa ni viongozi wa kijeshi. Kiwakilishi “yao” kinaweka wazi kuwa hawa ni makamanda wa magari ya Waedomu wanaotajwa katika kishazi hicho.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: watu wakakimbilia mahemani mwao
  rationale: Tafsiri inahifadhi neno pana העם na taswira ya Kiebrania ya kukimbilia mahema, huku tanbihi ikieleza maana ya nahau hiyo.
