base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: sw
  text: Ikawa siku iliyofuata, akachukua kitambaa cha kufunika[a], akakichovya majini, akakitandaza juu ya uso wake, naye akafa[b]. Kisha Hazaeli akawa mfalme badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tandiko,” “kitambaa cha kitandani,” au “kitambaa kilichofumwa kwa matundu.” Neno la Kiebrania ni nadra, kwa hiyo aina kamili ya kitambaa hicho haijulikani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakitaji wazi ni nani aliyefanya vitendo hivi. Kutokana na muktadha, wengi huelewa kuwa alikuwa Hazaeli, lakini matini yenyewe haimtaji kwa jina mpaka kishazi cha mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: siku iliyofuata
  rationale: Kirai hiki kinaonyesha siku iliyofuata baada ya matukio yaliyotangulia; tafsiri hii ni ya kawaida na huhifadhi mfuatano wa simulizi.
- source_word: הַמַּכְבֵּר
  choice: kitambaa cha kufunika
  rationale: Nomino hii ya Kiebrania ni nadra na aina kamili ya kitu hicho haijulikani. Tafsiri hii inaonyesha kazi yake bila kukifanya kwa uhakika kuwa tandiko, foronya nzito, au kitambaa cha kusokotwa kwa matundu.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: akakichovya majini
  rationale: Kitenzi kina maana ya kuchovya au kuzamisha; ‘kuchovya majini’ ni usemi wa asili wa Kiswahili unaofaa mfuatano wa vitendo.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: akakitandaza juu ya uso wake
  rationale: Kitenzi kinaonyesha kutandaza au kuweka kitu kikiwa kimekunjuliwa; tafsiri hii huhifadhi tendo la kimwili linalosimuliwa.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Tafsiri hii huhifadhi uendelezaji rahisi wa simulizi wa Kiebrania bila kuongeza wazi maana ya kusudi au sababu.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: Kisha Hazaeli akatawala mahali pake
  rationale: Huhifadhi maana ya kutawala au kuwa mfalme na fomula ya kumrithi mtawala mwingine.
theological_decisions:
- issue: Mtendaji wa vitenzi ‘akachukua,’ ‘akakichovya,’ na ‘akakitandaza’ hatajwi wazi
  choice: Kuacha mtendaji bila kutajwa kwa jina katika matini kuu kwa kutumia kiambishi cha nafsi ‘a-’
  alternative: Kumtaja Hazaeli moja kwa moja kuwa ndiye mtendaji
  rationale: Kiebrania hakimtaji mtendaji kwa jina katika vitenzi hivyo. Ingawa muktadha huwafanya wengi waelewe kuwa ni Hazaeli, jina lake halitajwi mpaka kishazi cha mwisho; hivyo tafsiri huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa heshima, na unaoeleweka kwa urahisi. Mfululizo wa ‘aka-’ huhifadhi mwendo wa simulizi, huku kutotaja jina la mtendaji kukihifadhi kutokubainishwa kwa Kiebrania.
