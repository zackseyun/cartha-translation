base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: sw
  text: Katika mwaka wa kumi na mbili wa utawala wa Yoramu mwana wa Ahabu[a], mfalme wa Israeli, Ahazia mwana wa Yehoramu, mfalme wa Yuda, alianza kutawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia “Yoramu” kwa mfalme wa Israeli na “Yehoramu” kwa mfalme wa Yuda; haya ni maumbo yanayohusiana ya jina moja, na wakati mwingine yote mawili hutafsiriwa “Yoramu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Katika mwaka wa kumi na mbili wa utawala
  rationale: Hii ni fomula ya Kiebrania ya kuhesabu miaka ya utawala. Neno “utawala” limewekwa wazi kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: לְ/יוֹרָם
  choice: wa Yoramu
  rationale: Katika fomula ya miaka ya kifalme, kihusishi ל huonyesha mfalme ambaye miaka ya utawala wake inahesabiwa.
- source_word: בֶּן אַחְאָב
  choice: mwana wa Ahabu
  rationale: Muundo wa kawaida wa kuonyesha nasaba umehifadhiwa moja kwa moja.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Cheo cha kifalme kimetafsiriwa moja kwa moja kwa Kiswahili sanifu.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika taarifa za kupanda kwa mfalme, kitenzi hiki kwa kawaida huonyesha mwanzo wa utawala, si tu tendo linaloendelea la kutawala.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בֶן יְהוֹרָם
  choice: mwana wa Yehoramu
  rationale: Umbo la jina יְהוֹרָם limetofautishwa na יוֹרָם kwa kutumia “Yehoramu,” huku uhusiano wa maumbo hayo ukielezwa katika tanbihi.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo cha kifalme kimetafsiriwa moja kwa moja.
