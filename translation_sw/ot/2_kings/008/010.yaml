base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: sw
  text: Elisha akamwambia, “Nenda ukamwambie, ‘Hakika utapona’;[a] lakini Yahwe amenionyesha kwamba hakika atakufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kiebrania husema, “Hakika hutaishi.” Matini ya Kiebrania ni ngumu hapa; wengi huelewa maana kuwa, “Hakika utapona,” tofauti na ufunuo unaofuata kwamba kwa kweli atakufa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: Elisha akamwambia
  rationale: Jina Elisha ndilo kiima kilichotajwa wazi. Muundo huu ni wa kawaida katika simulizi la Kiswahili na unawakilisha kwa usahihi ‘Elisha akasema naye.’
- source_word: לֵךְ אֱמָר
  choice: Nenda ukamwambie
  rationale: Vitenzi viwili vya amri vimewasilishwa kwa muundo wa Kiswahili unaoeleweka na wa kawaida, huku maana ya kwenda na kusema ikihifadhiwa.
- source_word: לא חָיֹה תִחְיֶה
  choice: Hakika utapona
  rationale: Katika muktadha wa ugonjwa, חיה ina maana ya kupona au kuendelea kuishi, na muundo wa kitenzi-jina pamoja na kitenzi huonyesha msisitizo wa uhakika. Maandishi ya Kiebrania yana ugumu kwa kuwa לא kwa kawaida humaanisha ‘si,’ hivyo usomaji halisi umewekwa katika tanbihi.
- source_word: וְהִרְאַנִי יְהוָה
  choice: lakini Yahwe amenionyesha
  rationale: Kiunganishi וְ kimetafsiriwa ‘lakini’ ili kuonyesha tofauti iliyopo kati ya ujumbe wa kupona na ufunuo kwamba mfalme atakufa. Jina la Mungu יהוה limetolewa kama Yahwe kulingana na desturi ya mradi.
- source_word: כִּי מוֹת יָמוּת
  choice: kwamba hakika atakufa
  rationale: Muundo wa infinitive absolute pamoja na imperfect unasisitiza uhakika; ‘hakika atakufa’ ni Kiswahili cha sasa, wazi na chenye nguvu hiyo.
theological_decisions:
- issue: Tafsiri ya kishazi kigumu לא חיה תחיה
  choice: Maandishi makuu yaseme, ‘Hakika utapona,’ na usomaji hasi wa Kiebrania uhifadhiwe katika tanbihi.
  alternative: ‘Hakika hutaishi’ au, katika muktadha wa ugonjwa, ‘Hakika hutapona.’
  rationale: 'Maandishi ya Kimasora yaliyowekewa irabu yana לא, ‘si,’ lakini maana hiyo inaleta ugumu katika tofauti na kishazi kinachofuata na katika simulizi pana: ugonjwa wenyewe haukulazimika kumuua Ben-hadadi, ingawa baadaye angeuawa. Tafsiri ya maana inayokusudiwa zaidi katika muktadha imewekwa katika maandishi, bila kuficha ushahidi tofauti wa Kiebrania.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Utapona’ linafaa kwa muktadha wa ugonjwa kuliko ‘utaishi.’ Msisitizo wa miundo yote miwili ya Kiebrania umehifadhiwa kwa ‘hakika.’
