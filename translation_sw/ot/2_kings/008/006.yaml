base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: sw
  text: Mfalme akamuuliza yule mwanamke, naye akamsimulia. Kisha mfalme akamteua afisa mmoja[a] kwa ajili yake, akisema, “Mrejeshee kila kitu kilicho chake, pamoja na mazao yote ya shamba tangu siku alipoondoka nchini hadi sasa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “towashi.” Neno hili linaweza kumaanisha towashi halisi au, kwa maana pana zaidi, afisa wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: Mfalme akamuuliza yule mwanamke
  rationale: ‘Yule mwanamke’ humrejelea kwa kawaida mwanamke Mshunemu aliyekwisha kutajwa; kitenzi ‘akamuuliza’ kinaendeleza simulizi bila kulazimisha kiunganishi tofauti.
- source_word: וַתְּסַפֵּר לוֹ
  choice: naye akamsimulia
  rationale: Katika piel, ספר hapa ni kusimulia au kueleza yaliyotokea; ‘akamsimulia’ ni ya asili na huhifadhi wazo la kutoa maelezo.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: Kisha mfalme akamteua afisa mmoja amsaidie
  rationale: Muundo unaonyesha mfalme alimpa au kumwekea mtu wa kutekeleza agizo. ‘Afisa’ linafaa katika mazingira ya kifalme, huku uwezekano wa maana ‘towashi’ ukihifadhiwa katika tanbihi; ‘mmoja’ huhifadhi אֶחָד.
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: Mrudishieni kila kitu kilicho chake
  rationale: Hiphil ya שוב ni agizo la kusababisha mali irudishwe. Wingi wa heshima/utekelezaji katika ‘Mrudishieni’ humlenga huyo afisa kwa lugha ya kawaida ya agizo.
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: mazao yote ya shamba
  rationale: תְּבוּאָה hapa hurejelea mazao au mavuno ya kilimo. ‘Mazao yote ya shamba’ ni wazi na hayabadilishi dhana kuwa mapato ya fedha pekee.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: tangu siku alipoondoka nchini hadi sasa
  rationale: Katika muktadha, אֶרֶץ ni nchi au eneo aliloondoka. ‘Nchini’ ni Kiswahili asilia na ‘hadi sasa’ huhifadhi kikomo cha wakati.
