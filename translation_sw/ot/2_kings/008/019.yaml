base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: sw
  text: Lakini Yahweh hakutaka kuiangamiza Yuda kwa ajili ya Daudi, mtumishi wake, kama alivyomwambia[a] kwamba angempatia taa[b] kwa ajili ya wanawe siku zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama alivyomwahidi.”
    reason: lexical_alternative
  - marker: b
    text: “Taa” ni taswira ya kifalme inayowakilisha kuendelea kwa ukoo au nasaba ya Daudi.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Lakini ... hakutaka
  rationale: Kiunganishi kinaonyesha tofauti na hukumu iliyotangulia, na אָבָה huhusu utashi au nia; ‘hakutaka’ ni ya kawaida na inadumisha maana hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: kuiangamiza Yuda
  rationale: Hifili ya שׁחת hapa inaeleza hukumu yenye kuleta maangamizi juu ya Yuda.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: kwa ajili ya Daudi mtumishi wake
  rationale: ‘Kwa ajili ya’ huonyesha kuwa Mungu alimjali Daudi, huku ‘mtumishi wake’ ikihifadhi hadhi ya Daudi mbele za Mungu.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: kama alivyomwambia
  rationale: Maandishi yanasema kihalisi kwamba Mungu ‘alimwambia’; katika muktadha maneno hayo ni ahadi, lakini tafsiri kuu haifuti tofauti hiyo.
- source_word: לָתֵת לוֹ נִיר לְבָנָיו
  choice: kwamba angempatia taa kwa ajili ya wanawe
  rationale: Muundo huu unaonyesha kwamba taa anapewa Daudi na inahusishwa na wanawe, bila kubadili moja kwa moja taswira hiyo kuwa ‘nasaba’.
- source_word: כָּל־הַיָּמִים
  choice: siku zote
  rationale: Hii inafuata nahau ya Kiebrania kwa karibu na kudumisha wazo la mwendelezo bila kulazimisha tafsiri ya ‘milele’.
theological_decisions:
- issue: Taswira ya kifalme נִיר
  choice: taa
  alternative: mwanga; nasaba inayoendelea
  rationale: ‘Taa’ inadumisha taswira halisi ya ahadi kwa nyumba ya Daudi na miunganiko yake na vifungu vingine, badala ya kuifafanua kimya kimya kuwa nasaba.
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Unukuzi ‘Yahweh’ huhifadhi jina binafsi lililo katika matini ya Kiebrania.
- issue: Maana ya אָמַר katika muktadha wa agano
  choice: alimwambia
  alternative: alimwahidi
  rationale: Kitenzi chenyewe ni ‘sema,’ ingawa usemi huo unafanya kazi kama ahadi; uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. ‘Kuiangamiza’ ni wazi na yenye uzito unaofaa; ‘taa’ na ‘siku zote’ zinahifadhi nahau na mvutano wa matini ya Kiebrania.
