  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: sw
  text: Akafuata njia ya wafalme wa Israeli, kama nyumba ya Ahabu ilivyofanya, kwa maana binti ya Ahabu alikuwa mke wake; akatenda maovu machoni pa Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Akaifuata njia
  rationale: Kirai hiki ni sitiari ya kuishi au kujiendesha kwa kufuata mwenendo fulani. ‘Akaifuata njia’ huhifadhi picha ya Kiebrania na ni Kiswahili cha kawaida.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: wafalme wa Israeli
  rationale: Ni muundo wa kawaida unaowataja watawala wa ufalme wa kaskazini kama kielelezo cha mwenendo.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: kama walivyofanya watu wa nyumba ya Ahabu
  rationale: Kitenzi cha wingi עָשׂוּ kinaelekeza kwa washiriki wa nyumba au nasaba ya Ahabu; kuongeza ‘watu wa’ hufanya upatanisho wa wingi uwe wazi na wa asili katika Kiswahili huku sitiari ya ‘nyumba’ ikihifadhiwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu inayoeleza uhusiano wa mwenendo wake na nyumba ya Ahabu.
- source_word: בַּת אַחְאָב
  choice: binti ya Ahabu
  rationale: Hutoa kwa uwazi uhusiano wa ukoo unaoonyeshwa na muundo wa Kiebrania.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: alikuwa mke wake
  rationale: Nahau ya Kiebrania, kihalisi ‘alikuwa kwake kuwa mke,’ inaeleza hali ya ndoa iliyokuwapo.
- source_word: וַיַּעַשׂ הָרַע
  choice: Akatenda yaliyo maovu
  rationale: Huhifadhi fomula ya tathmini ya kimaadili na kuakisi uainishaji wa ‘maovu’ bila kuifanya kuwa kivumishi cha namna pekee.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini mbele za Mungu na kulitaja jina la agano moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, YHWH; ‘Yahweh’ hulitofautisha na cheo na kulihifadhi kama jina.
- issue: Uhusiano kati ya ndoa na mwenendo mwovu
  choice: Kishazi cha sababu kimehifadhiwa bila kuongeza maelezo ya moja kwa moja kuhusu kiwango au namna ya ushawishi wa mke
  alternative: Kusema kwamba mke wake ndiye aliyemsababisha kutenda maovu
  rationale: כִּי huunganisha ndoa hiyo na kufuata kwake nyumba ya Ahabu, lakini mstari hausemi kwa undani kuwa mke wake ndiye sababu pekee au mtendaji wa moja kwa moja wa maamuzi yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imehifadhi sitiari za ‘njia,’ ‘nyumba,’ na ‘machoni,’ huku ikitumia miundo inayoeleweka kwa msomaji wa kawaida.
