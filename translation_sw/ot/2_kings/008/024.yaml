base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: sw
  text: Yoramu akalala pamoja na baba zake,[a] akazikwa pamoja na baba zake katika Mji wa Daudi. Ahazia mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, alikufa. Kiebrania kinatumia msemo wa kawaida wa kifalme, ‘alilala pamoja na baba zake.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Kitenzi שׁכב maana yake ya msingi ni ‘kulala’ au ‘kujilaza,’ na hapa ni sehemu ya msemo wa kawaida wa kifalme unaoashiria kifo. ‘Akalala’ huhifadhi taswira ya Kiebrania bila kuibadili moja kwa moja kuwa ‘akafa.’
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Huhifadhi kwa ukaribu msemo wa ukoo unaorudiwa katika Wafalme; ‘mababu zake’ ni tafsiri ya maana iliyo wazi zaidi lakini si ya moja kwa moja kama ‘baba zake.’
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Umbo la Nifali hapa lina maana ya kutendwa, na ‘akazikwa’ huwasilisha mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: ‘Mji wa Daudi’ ni jina linalotambulika la mahali na linahifadhi muundo wa Kiebrania.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya urithi wa kifalme, מלך humaanisha kutawala akiwa mfalme. ‘Akatawala’ ni ya kawaida na haitoi maelezo ya ziada kuhusu muda wa kuanza.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa urithi wa ufalme, תַּחַת humaanisha kuchukua nafasi ya mtangulizi; ‘mahali pake’ huhifadhi maana hiyo kwa ufupi.
- source_word: יוֹרָם
  choice: Yoramu
  rationale: Ni umbo la kawaida la Kiswahili linalofuata jina la Kiebrania יוֹרָם, badala ya kulilinganisha na umbo refu Yehoramu.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Ni umbo la kawaida na linaloeleweka la jina hili katika Kiswahili cha Biblia.
theological_decisions:
- issue: Msemo wa kifalme wa kifo וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: akalala pamoja na baba zake
  alternative: akafa na kuungana na mababu zake
  rationale: Tafsiri iliyochaguliwa huhifadhi msemo na taswira ya chanzo bila kuamua zaidi kuhusu hali ya mtu baada ya kifo; tanbihi inaeleza kazi yake katika taarifa za kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Yoramu na Ahazia kwa kufuata maumbo ya Kiebrania na matumizi ya kawaida ya Kiswahili. Alama ya tanbihi imewekwa mara tu baada ya msemo unaoelezwa.
