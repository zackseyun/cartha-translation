  variant: Standard East African Swahili
source:
  edition: WLC
  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: sw
  text: Elisha alikuwa amemwambia yule mwanamke ambaye Elisha alikuwa amemfufulia mwanawe, “Ondoka, uende, wewe na watu wa nyumba yako, ukae kwa muda mahali popote utakapopata pa kukaa[a], kwa maana Yahweh ameamuru njaa ije, nayo itakuja juu ya nchi kwa miaka saba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukae kama mgeni mahali popote utakapopata pa kukaa.” Kitenzi cha Kiebrania גור mara nyingi humaanisha kuishi mahali kama mkazi wa muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: alikuwa amemwambia
  rationale: Muundo wa wakati uliopita unaotangulia tukio jingine unaonyesha kwamba Elisha alikuwa ametoa onyo hili kabla ya matukio yanayosimuliwa katika muktadha unaofuata.
- source_word: אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: ambaye alikuwa amemrudishia mwanawe uhai
  rationale: Huwasilisha maana ya kisababishi ya החיה kwa Kiswahili cha kawaida bila kulazimisha neno lenye maana finyu zaidi.
- source_word: קוּמִי וּלְכִי
  choice: Ondoka uende
  rationale: Amri mbili kwa mwanamke mmoja zimewasilishwa kwa usemi wa kawaida wenye msisitizo na uharaka.
- source_word: אתי וּבֵיתֵךְ
  choice: wewe pamoja na watu wa nyumba yako
  rationale: בֵּית hapa inamaanisha kaya au watu walio chini ya nyumba yake, si jengo lenyewe.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: ukaishi kwa muda mahali popote utakapoweza kuishi
  rationale: גור mara nyingi humaanisha kukaa kama mgeni au mkazi wa muda. Tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo la makazi ya muda.
- source_word: קָרָא יְהוָה לָרָעָב
  choice: Yahwe ameagiza njaa
  rationale: קרא pamoja na ל ina maana ya kuita au kuamuru jambo lije; 'ameagiza' huonyesha mamlaka ya Mungu juu ya tukio bila kudai kwamba ametangaza tu habari zake.
- source_word: וְגַם בָּא אֶל הָאָרֶץ שֶׁבַע שָׁנִים
  choice: nayo itaijia nchi kwa miaka saba
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umbo timilifu, muktadha wa onyo kabla ya njaa unaelekeza kwenye tukio lililo karibu na hakika; wakati ujao ni wa kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה; 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Wakala wa Mungu katika njaa
  choice: Yahwe ameagiza njaa
  alternative: Yahwe ametangaza njaa
  rationale: Tafsiri inadumisha tamko lenye nguvu la קרא ל kwamba njaa imeitwa au kuagizwa, bila kupunguza mvutano wa kiteolojia kuhusu mamlaka ya Mungu juu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Watu wa nyumba yako' ni wazi kwa wasomaji wa kawaida, na 'ukaishi kwa muda' huepuka neno zito huku ikihifadhi maana ya ukaaji wa muda.
