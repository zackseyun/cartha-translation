  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: sw
  text: Katika siku zake, Edomu aliasi kutoka chini ya mamlaka ya Yuda, wakajiwekea mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “Edomu aliasi kutoka chini ya mkono wa Yuda, wakajiwekea mfalme juu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Katika siku zake
  rationale: Nahau hii ya wakati inaonyesha kipindi cha utawala wa mfalme; tafsiri hii inadumisha umbo la Kiebrania na inaeleweka katika Kiswahili sanifu.
- source_word: פָּשַׁע
  choice: aliasi
  rationale: Katika muktadha huu wa kisiasa, kitenzi kina maana ya kuasi au kujitenga na utawala, si kufanya kosa la kimaadili tu.
- source_word: אֱדוֹם
  choice: Edomu
  rationale: Hili ndilo umbo la kawaida la jina la nchi na watu hawa katika Kiswahili cha Biblia.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: na kujiondoa chini ya mamlaka ya Yuda
  rationale: Nahau ya Kiebrania, kihalisi ‘kutoka chini ya mkono wa Yuda,’ inaonyesha kujiondoa katika udhibiti au utawala wa Yuda. ‘Mamlaka’ huwasilisha maana hiyo wazi bila kupoteza taswira ya kuwa chini ya mwingine.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Umbo la kawaida la Kiswahili kwa ufalme au kabila hili.
- source_word: וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ
  choice: nao wakajitawazia mfalme
  rationale: Hifili ya מלך hapa humaanisha kumweka mtu awe mfalme. ‘Kujitawazia mfalme’ huonyesha kwa lugha ya kawaida kwamba Waedomu walijiwekea mfalme wao wenyewe.
