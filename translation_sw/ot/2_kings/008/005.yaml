  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: sw
  text: Ikawa, alipokuwa akimsimulia mfalme jinsi Elisha alivyemrudisha mfu kwenye uhai[a], tazama[b], yule mwanamke ambaye mwanawe Elisha alikuwa amemrudisha kwenye uhai akamlilia mfalme kwa ajili ya nyumba yake na shamba lake. Gehazi akasema, “Bwana wangu mfalme, huyu ndiye yule mwanamke, na huyu ndiye mwanawe ambaye Elisha alimrudisha kwenye uhai.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jinsi Elisha alivyemfufua mfu” au “jinsi Elisha alivyemrudisha mfu kuwa hai.” Kiebrania kinatumia umbo la kisababishi la kitenzi “kuishi” (החיה).
    reason: lexical_alternative
  - marker: b
    text: 'Neno “tazama” linaonyesha sadfa ya ghafla na ya kushangaza: mwanamke huyo alifika wakati huohuo Gehazi alipokuwa akisimulia habari zake.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: Ikawa, alipokuwa akimsimulia mfalme
  rationale: Muundo huu unahifadhi utangulizi wa kisimulizi wa וַיְהִי pamoja na tendo linaloendelea linaloonyeshwa na מְסַפֵּר, huku ukiwa wa kawaida katika Kiswahili cha simulizi.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: jinsi Elisha alivyemrudisha mfu kwenye uhai
  rationale: Kitenzi cha Kiebrania הֶחֱיָה ni kisababishi, ‘kusababisha aishi’ au ‘kurudisha kwenye uhai.’ Nomino הַמֵּת iko katika umoja, hivyo ‘mfu’ inafuata umbo la chanzo. Jina ‘Elisha’ limetumiwa kwa uwazi kwa kuwa ndiye mhusika wa tendo hilo katika muktadha na ametajwa wazi mwishoni mwa aya.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: ‘Tazama’ huhifadhi nguvu ya kis立imulizi ya particle hii, inayovuta fikira kwenye kufika kwa kushangaza kwa mwanamke wakati huo huo.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: yule mwanamke ambaye Elisha alikuwa amemrudisha mwanawe kwenye uhai
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza uhusiano ambao Kiebrania huutoa kwa muundo halisi wa ‘mwanamke ambaye alimfanya mwanawe aishi,’ bila kupoteza nguvu ya kisababishi.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: akamlilia mfalme
  rationale: צעק inaonyesha kilio cha dharura cha kuomba msaada au haki. ‘Akamlilia mfalme’ ni ya asili na huhifadhi uzito wa ombi kuliko neno la kiutawala kama ‘alikata rufaa.’
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: kuhusu nyumba yake na shamba lake
  rationale: עַל hapa hutambulisha jambo lililohusu ombi lake. ‘Shamba’ linaakisi שָׂדֶה kwa usahihi zaidi kuliko neno pana ‘ardhi.’
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Bwana wangu mfalme
  rationale: Hii huhifadhi heshima ya kawaida ya lugha ya ikulu bila kuongeza maana ya kidhehebu.
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: huyu ndiye yule mwanamke, na huyu ndiye mwanawe
  rationale: Vionyeshi vinawatambulisha watu waliopo mbele ya mfalme; ‘ndiye’ hutoa mkazo wa utambulisho unaofaa kwa mshangao wa tukio.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: ambaye Elisha alimrudisha kwenye uhai
  rationale: Usemi uleule ‘alimrudisha kwenye uhai’ umetumiwa kwa uthabiti kwa kurudia kitenzi kilekile הֶחֱיָה.
