base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: sw
  text: Kisha Mfalme Yoramu akarudi Yezreeli ili apate kupona majeraha waliyomjeruhi Waaramu huko Rama, alipokuwa akipigana na Hazaeli, mfalme wa Aramu. Naye Ahazia mwana wa Yehoramu, mfalme wa Yuda, akashuka kwenda kumwona Yoramu mwana wa Ahabu huko Yezreeli, kwa sababu alikuwa mgonjwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika mfululizo wa simulizi kinaonyesha kwamba Yoramu alirudi Yezreeli baada ya mapigano.
- source_word: לְהִתְרַפֵּא
  choice: ili apate kupona
  rationale: Kauli hii inaeleza kusudi la kurudi kwake, yaani kupata nafuu kutokana na majeraha, bila kudokeza kwamba alijiponya mwenyewe.
- source_word: מִן הַמַּכִּים
  choice: majeraha
  rationale: Ingawa neno hilo linaweza kumaanisha mapigo, katika muktadha huu wa vita linataja majeraha yaliyotokana na mapigo hayo.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: ambayo Waaramu walimtia
  rationale: Hii ni njia ya kawaida na iliyo wazi ya kusema kwamba Waaramu ndio waliomsababishia majeraha hayo.
- source_word: בָּרָמָה
  choice: huko Rama
  rationale: Kihusishi ב kinaonyesha mahali ambapo Yoramu alijeruhiwa; 'huko Rama' ni Kiswahili cha kawaida katika simulizi.
- source_word: בְּהִלָּחֲמוֹ
  choice: alipokuwa akipigana
  rationale: Muundo wa Kiebrania unaonyesha hali au wakati ambapo majeraha yalitokea.
- source_word: אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: na Hazaeli mfalme wa Aramu
  rationale: Pamoja na kitenzi 'kupigana,' Kiswahili hutumia kwa kawaida 'kupigana na'; 'Aramu' huhifadhi jina la taifa la kale.
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: Naye Ahazia...akashuka
  rationale: Kauli hii inaendeleza simulizi na kuhifadhi maana ya mwelekeo iliyo katika ירד.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: kwenda kumwona Yoramu
  rationale: Tafsiri hii huhifadhi maana ya msingi ya 'kumwona' huku muktadha ukionyesha kwamba lilikuwa ziara kwa mgonjwa.
- source_word: כִּי חֹלֶה הוּא
  choice: kwa sababu alikuwa mgonjwa
  rationale: חֹלֶה inaeleza hali yake ya ugonjwa wakati huo, ingawa hali hiyo ilisababishwa na majeraha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina ya kale yameandikwa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, na 'Aramu/Waaramu' limetumiwa badala ya 'Siria/Wasiria' ili kuakisi maandishi ya Kiebrania na mazingira ya kale.
