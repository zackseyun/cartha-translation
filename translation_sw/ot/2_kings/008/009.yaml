  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: sw
  text: Basi Hazaeli akaenda kumlaki, akachukua zawadi mkononi mwake, yaani kila kitu chema cha Damasko, mizigo iliyotosha kwa ngamia arobaini. Akaja, akasimama mbele yake, akasema, “Mwanao[a] Ben-hadadi, mfalme wa Aramu, amenituma kwako, akisema, ‘Je, nitapona ugonjwa huu?’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwanao” ni namna ya heshima na unyenyekevu anayotumia mtu kwa mwenye cheo au heshima kubwa; si lazima imaanishe kuwa yeye ni mwana wa kuzaliwa.
    reason: cultural_note
  - marker: b
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “Je, nitaishi kutokana na ugonjwa huu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: kumlaki
  rationale: Muundo wa קרא pamoja na ל unaonyesha kwenda kukutana na mtu anayekuja; “kumlaki” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: מִנְחָה
  choice: zawadi
  rationale: Katika mazingira haya ya kidiplomasia, neno hilo linamaanisha zawadi inayopelekwa kwa mtu mwenye heshima, si sadaka ya ibada wala ushuru wa lazima.
- source_word: בְיָדוֹ
  choice: pamoja naye
  rationale: Ingawa Kiebrania kinasema kihalisi “mkononi mwake,” hapa ni nahau ya kubeba au kuja na kitu; “pamoja naye” ni ya asili zaidi kwa Kiswahili bila kubadili maana.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: yaani kila kitu chema cha Damasko
  rationale: Kirai kinafafanua ukubwa na ubora wa zawadi; “yaani” huonyesha uhusiano wa ufafanuzi, huku “kila kitu chema” kikihifadhi wingi uliokusudiwa.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: mzigo wa ngamia arobaini
  rationale: Kirai kinaeleza kiasi cha bidhaa kilichobebwa na ngamia arobaini. Muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: akasimama mbele yake
  rationale: Huhifadhi moja kwa moja lugha rasmi ya kujihudhurisha mbele ya Elisha bila kuongeza ufafanuzi.
- source_word: בִּנְךָ
  choice: Mwanao
  rationale: Huhifadhi sitiari halisi ya kifamilia na lugha ya heshima; tanbihi inaeleza kwamba si lazima iwe uhusiano wa damu.
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: amenituma kwako kuuliza
  rationale: Katika muktadha huu, “akisema” hutambulisha swali lililotumwa; “kuuliza” ni Kiswahili cha asili kinachowasilisha kazi ya ujumbe huo.
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: Je, nitapona ugonjwa huu?
  rationale: Kihalisi kitenzi ni “kuishi,” lakini pamoja na “kutokana na ugonjwa huu” swali linahusu kupona. Tafsiri hii ni wazi na ya kawaida, huku tanbihi ikihifadhi usemi wa karibu zaidi na Kiebrania.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la kihistoria limetoholewa badala ya kubadilishwa na jina la baadaye la kijiografia, “Siria.”
