translation:
  language: sw
  text: Akamkazia macho na akaendelea kumtazama mpaka akaona aibu[a], na mtu wa Mungu akalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka Hazaeli akaona aibu.” Kiebrania hakibainishi wazi ni nani aliyeona aibu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: Akamkazia macho
  rationale: Kauli ya Kiebrania ina maana ya kuushikilia uso au mtazamo bila kuugeuza. Kiswahili ‘akamkazia macho’ huwasilisha picha ya kumtazama mtu kwa uthabiti kwa lugha ya kawaida na ya asili.
- source_word: וַיָּשֶׂם
  choice: na kuendelea kumtazama
  rationale: Kitenzi שׂים kwa kawaida ni ‘kuweka,’ lakini hapa kinaendeleza wazo la mtazamo uliokazwa. Tafsiri hii inaepuka Kiswahili kisicho cha kawaida kama ‘akaweka’ huku ikihifadhi mwendelezo wa kitendo.
- source_word: עַד־בֹּשׁ
  choice: mpaka akaona aibu
  rationale: בוש hueleza kuona aibu au kufadhaika. Kiswahili hakitaji kiwakilishi cha mtenda hapa, hivyo ‘akaona aibu’ kinaacha utambulisho wake bila kutajwa wazi, kama ilivyo katika Kiebrania.
- source_word: וַיֵּבְךְּ
  choice: akalia
  rationale: בכה humaanisha kulia; ‘akalia’ ni tafsiri ya moja kwa moja, ya kawaida, na inayofaa uzito wa simulizi.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la cheo la kawaida la nabii katika simulizi. Limetafsiriwa moja kwa moja badala ya kubadilishwa kuwa ‘nabii.’
theological_decisions:
- issue: Utambulisho wa aliyeona aibu katika עַד־בֹּשׁ
  choice: Kuacha mtenda bila kutajwa wazi katika ‘mpaka akaona aibu’
  alternative: mpaka Hazaeli akaona aibu
  rationale: Kiebrania hakumtaji wazi mtenda wa בוש, na kifungu kimeeleweka kwa njia zaidi ya moja. Kiswahili kinaweza kuhifadhi mvutano huo kwa kuacha jina au kiwakilishi cha msisitizo bila kuongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unahifadhi uzito wa simulizi na utata halisi wa Kiebrania bila kuingiza ufafanuzi wa kimadhehebu.
