  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Mambo mengine ya Yoramu[a], na yote aliyoyafanya, je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Yoram; kwa mapokeo pia Yehoramu.
    reason: alternative_reading
  - marker: b
    text: Au “kitabu cha kumbukumbu za wafalme wa Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Mambo mengine
  rationale: Katika muhtasari huu wa utawala, kifungu hiki kinamaanisha mambo au matendo yaliyobaki katika habari za mfalme. “Mambo mengine” ni Kiswahili cha kawaida na huhifadhi upana wa דִּבְרֵי kuliko “matendo” pekee.
- source_word: יוֹרָם
  choice: Yoramu
  rationale: Hili linawakilisha moja kwa moja jina la Kiebrania Yoram kwa umbo la kawaida la majina katika Kiswahili; umbo la kimapokeo “Yehoramu” limetajwa katika tanbihi.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyoyafanya
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi husika, inayohifadhi msisitizo wa “yote”.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Muundo wa swali la balagha unaotarajia jibu la ndiyo umehifadhiwa. Upatanisho wa ngeli ya “haya-” unarejelea mambo na matendo yaliyotangulia.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni “juu ya,” Kiswahili cha kawaida husema habari zimeandikwa “katika” kitabu au hati.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Kitabu cha Mambo ya Nyakati
  rationale: Hiki ni kifungu cha kawaida kinachotaja kumbukumbu rasmi za kifalme. “Mambo ya Nyakati” huhifadhi maana ya rekodi za matukio kwa lugha yenye hadhi na inayoeleweka.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: za Wafalme wa Yuda
  rationale: לְ inaonyesha uhusiano wa kumbukumbu hizo na wafalme wa Yuda; “za Wafalme wa Yuda” ni muundo wa kawaida wa kichwa katika Kiswahili.
