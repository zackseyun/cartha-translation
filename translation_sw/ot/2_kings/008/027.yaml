base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: sw
  text: Aliufuata mwenendo wa ukoo wa Ahabu, akafanya maovu machoni pa Yahwe, kama ukoo wa Ahabu ulivyofanya, kwa maana alikuwa na uhusiano wa ndoa na ukoo wa Ahabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa mwana-mkwe wa ukoo wa Ahabu.” Neno la Kiebrania linaweza kumaanisha mwana-mkwe hasa, au mtu mwenye uhusiano wa ndoa kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Aliufuata mwenendo
  rationale: Muundo huu wa Kiebrania unaeleza namna ya kuishi na kutenda, si kutembea kimwili. “Aliufuata mwenendo” ni Kiswahili cha kawaida kinachohifadhi wazo la kufuata njia ya maadili ya wengine.
- source_word: בֵּית אַחְאָב
  choice: ukoo wa Ahabu
  rationale: Neno בַּיִת likiwa na jina la mtu linaweza kumaanisha familia, jamaa, au nasaba ya kifalme. “Ukoo” linafikisha maana hiyo kwa Kiswahili bila kuifanya nyumba halisi.
- source_word: וַיַּעַשׂ הָרַע
  choice: akafanya yaliyo maovu
  rationale: Huu ni usemi wa kawaida wa tathmini katika kitabu cha Wafalme; tafsiri hii inahifadhi tendo na uovu kama jambo lililotendwa.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ya kuwa “machoni” pa Mungu, yaani chini ya tathmini yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa moja kwa moja kwa umbo la Kiswahili “Yahwe” badala ya cheo “BWANA.”
- source_word: כְּבֵית אַחְאָב
  choice: kama ukoo wa Ahabu ulivyofanya
  rationale: Kitenzi kilichodokezwa katika Kiebrania kimewekwa wazi kwa Kiswahili ili ulinganisho usomeke kwa kawaida.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי linaanzisha sababu ya tathmini iliyotangulia.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: mkwe wa ukoo wa Ahabu
  rationale: חֲתַן huonyesha uhusiano wa ndoa na mara nyingi humaanisha mwana-mkwe. “Mkwe” huhifadhi kwa ufupi uhusiano huo bila kulazimisha aina mahususi ya undugu wa ndoa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Aina ya uhusiano unaoonyeshwa na חֲתַן
  choice: mkwe wa ukoo wa Ahabu
  alternative: mwana-mkwe wa ukoo wa Ahabu; mtu aliyehusiana kwa ndoa na ukoo wa Ahabu
  rationale: Neno linaweza kumaanisha mwana-mkwe hasa au uhusiano wa ndoa kwa upana zaidi. “Mkwe” linaacha upana huo bila kutatua kimyakimya utata wa kihistoria na wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Mwenendo” limetumiwa badala ya tafsiri ya kimwili ya kutembea; “ukoo” linahifadhi maana ya familia au nasaba ya kifalme; na “mkwe” linadumisha utata halisi wa neno la Kiebrania.
