base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: sw
  text: Basi yule mwanamke akaondoka, akafanya kama mtu wa Mungu alivyosema. Akaenda, yeye pamoja na watu wa nyumbani mwake, akaishi akiwa mgeni katika nchi ya Wafilisti kwa miaka saba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: akaondoka
  rationale: Katika mfululizo huu wa masimulizi, kitenzi קום kinaonyesha kwamba mwanamke alichukua hatua kuitikia agizo; “akaondoka” ni cha asili kwa Kiswahili na hakiashirii zaidi ya muktadha.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: na kufanya kama ... alivyosema
  rationale: Nahau hii ina maana ya kutenda kulingana na agizo lililonenwa. Muundo huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la kawaida la kibiblia kwa nabii au mjumbe aliyepewa utume na Mungu, na tafsiri hii hudumisha usemi wa Kiebrania bila kuubadili kuwa cheo tofauti.
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: akaenda pamoja na watu wa nyumbani mwake
  rationale: בַּיִת yenye kiambishi cha umilikaji hapa humaanisha watu wa kaya, si jengo tu. “Watu wa nyumbani mwake” huwasilisha maana hiyo wazi.
- source_word: וַתָּגָר
  choice: akakaa kama mgeni
  rationale: Kitenzi גור humaanisha kuishi katika nchi ambayo mtu si mwenyeji wake. “Kukaa kama mgeni” huhifadhi hali hiyo ya ukaaji bila kutumia neno la kizamani.
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: katika nchi ya Wafilisti
  rationale: Hii inatafsiri wazi muundo wa Kiebrania na kuhifadhi jina la watu pamoja na eneo lao.
- source_word: שֶׁבַע שָׁנִים
  choice: kwa miaka saba
  rationale: Kiswahili hutumia “kwa” kwa kawaida kuonyesha muda wa ukaaji.
