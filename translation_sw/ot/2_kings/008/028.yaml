translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Biblia. Majina ‘Aramu’ na ‘Waaramu’ yametumiwa kwa uwazi wa chanzo; ‘pamoja na’ linaondoa utata wa kisarufi, na ‘wakamjeruhi’ linaonyesha maana inayodokezwa na muktadha huku tanbihi ikihifadhi maana pana ya kitenzi.
