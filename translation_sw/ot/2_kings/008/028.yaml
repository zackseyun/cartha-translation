base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: sw
  text: Ahazia akaenda pamoja na Yoramu mwana wa Ahabu kupigana na Hazaeli, mfalme wa Aramu, katika Ramoth-Gileadi[b], nao Waaramu wakamjeruhi Yoramu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakampiga Yoramu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kupiga” kwa maana pana zaidi; “wakamjeruhi” limetumiwa kwa sababu muktadha wa vita na simulizi sambamba vinaonyesha jeraha, si kifo.
    reason: lexical_alternative
  - marker: b
    text: Kijadi, “mfalme wa Shamu” na “Washami”; Kiebrania kina “Aramu” na “Waaramu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אֶת יוֹרָם
  choice: akaenda pamoja na Yoramu
  rationale: Baada ya kitenzi ‘kwenda,’ אֵת inaonyesha kuandamana. Tafsiri hii inaweka wazi kwamba Ahazia alienda pamoja na Yoramu.
- source_word: לַמִּלְחָמָה עִם חֲזָהאֵל
  choice: kupigana na Hazaeli
  rationale: Katika muktadha wa vita, עִם inaonyesha upande unaopingwa. ‘Kupigana na’ ni Kiswahili cha kawaida kinachowasilisha kusudi la kwenda vitani dhidi yake.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: ‘Aramu’ linahifadhi jina la Kiebrania la taifa hilo badala ya kulibadilisha kuwa ‘Siria’ au ‘Shamu.’
- source_word: בְּרָמֹת גִּלְעָד
  choice: huko Ramoth-gileadi
  rationale: Kiambishi בְּ kinaonyesha mahali pa vita; ‘huko’ ni cha asili katika simulizi la Kiswahili.
- source_word: וַיַּכּוּ אֲרַמִּים אֶת יוֹרָם
  choice: nao Waaramu wakamjeruhi Yoramu
  rationale: נכה inaweza kumaanisha kupiga kwa ujumla, lakini muktadha wa vita na simulizi sambamba vinaonyesha kwamba Yoramu alijeruhiwa, si kwamba aliuawa.
