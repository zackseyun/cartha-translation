  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: sw
  text: Bali mtamcha Yahweh Mungu wenu, naye atawaokoa kutoka mikononi mwa adui zenu wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kutoka mkononi mwa adui zenu wote”; hii ni nahau yenye maana ya kutoka chini ya mamlaka au udhibiti wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Bali
  rationale: Kirai hiki kinaonyesha utofautishaji wenye uzito dhidi ya katazo la kuwaogopa miungu mingine katika mstari uliotangulia. “Bali” ni ya asili katika Kiswahili na inadumisha nguvu hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa umbo la אֱלֹהִים linaweza kuwa la wingi, hapa linamrejelea Yahweh na kwa hiyo lina maana ya umoja.
- source_word: תִּירָאוּ
  choice: mtamcha
  rationale: Katika muktadha huu ירא huonyesha hofu yenye heshima na utii kwa Mungu. “Mtamcha” ni kauli ya kawaida ya Kiswahili inayodumisha nguvu ya agizo la Kiebrania.
- source_word: וְהוּא
  choice: naye
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kinadumishwa kwa njia fupi na ya asili katika Kiswahili.
- source_word: יַצִּיל
  choice: atawaokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kukomboa kutoka hatarini; “atawaokoa” inafaa kwa ahadi hii.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Hii inadumisha taswira ya Kiebrania ya ‘mkono’ kama mamlaka au udhibiti, huku wingi wa Kiswahili ukipatana kwa kawaida na adui wengi.
- source_word: כָּל אֹיְבֵיכֶם
  choice: adui zenu wote
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya kishazi chenye kiashiria cha ujumla na nomino ya wingi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kumcha Mungu
  choice: mtamcha
  alternative: mtamheshimu
  rationale: “Mtamcha” hudumisha mvutano wa maana ya ירא, inayojumuisha hofu pamoja na heshima na utii; “mtamheshimu” pekee ingepunguza upande wa hofu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Bali” huendeleza utofautishaji wa muktadha, na “mikononi mwa” hudumisha nahau ya chanzo kwa namna inayoeleweka kwa wasomaji wa kawaida.
