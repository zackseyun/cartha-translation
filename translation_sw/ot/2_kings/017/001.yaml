  text: בִּ/שְׁנַת֙ שְׁתֵּ֣ים עֶשְׂרֵ֔ה לְ/אָחָ֖ז מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ הוֹשֵׁ֨עַ בֶּן אֵלָ֧ה בְ/שֹׁמְר֛וֹן עַל יִשְׂרָאֵ֖ל תֵּ֥שַׁע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: sw
  text: Katika mwaka wa kumi na mbili wa utawala wa Ahazi mfalme wa Yuda, Hoshea mwana wa Ela alianza kutawala Israeli huko Samaria, naye akatawala kwa miaka tisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לְאָחָז
  choice: Katika mwaka wa kumi na mbili wa utawala wa Ahazi
  rationale: Kirai cha Kiebrania kinaonyesha namna ya kuhesabu wakati kwa kurejelea utawala wa Ahazi; kuongeza ‘wa utawala’ kunafanya maana hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: מָלַךְ
  choice: alianza kutawala ... naye akatawala
  rationale: 'Kitenzi hicho kinatumika mara mbili: kwanza kuonyesha kuanza kwa utawala wa Hoshea, kisha kueleza muda wake. Tafsiri hii huhifadhi kazi hizo mbili kwa Kiswahili cha kawaida.'
- source_word: בְשֹׁמְרוֹן עַל יִשְׂרָאֵל
  choice: kutawala Israeli huko Samaria
  rationale: Inahifadhi tofauti kati ya eneo lililotawaliwa, Israeli, na makao ya kifalme, Samaria, bila kuifanya Samaria kuwa kitu cha moja kwa moja cha utawala.
- source_word: תֵּשַׁע שָׁנִים
  choice: kwa miaka tisa
  rationale: Hii ni njia ya kawaida na wazi ya kueleza muda wa utawala katika Kiswahili.
