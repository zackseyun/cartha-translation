base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: sw
  text: Mfalme wa Ashuru akagundua kwamba Hoshea alikuwa amefanya njama,[a] kwa sababu alikuwa ametuma wajumbe kwa So, mfalme wa Misri,[b] na hakuwa amempelekea mfalme wa Ashuru ushuru kila mwaka.[c] Basi mfalme wa Ashuru akamzuia, kisha akamfunga gerezani.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akagundua uhaini kwa Hoshea.” Kiebrania kinasema kihalisi, “akapata njama katika Hoshea,” nahau inayomaanisha kugundua mipango ya kutokuwa mwaminifu iliyokuwa kwake.
    reason: lexical_alternative
  - marker: b
    text: “So” ni unukuzi wa jina lililo katika maandishi ya Kiebrania. Haijulikani kwa uhakika kihistoria ni mfalme gani wa Misri anayetajwa.
    reason: cultural_note
  - marker: c
    text: Kiebrania kinaweza kutafsiriwa kihalisi zaidi, “hakuwa amepeleka juu ushuru ... mwaka baada ya mwaka”; maana yake ni ushuru wa kila mwaka.
    reason: lexical_alternative
  - marker: d
    text: 'Kiebrania kinatofautisha hatua mbili: kwanza mfalme wa Ashuru alimzuia au alimweka Hoshea kizuizini, kisha akamfunga gerezani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... קֶשֶׁר בְּהוֹשֵׁעַ
  choice: akagundua kwamba Hoshea alikuwa amefanya njama
  rationale: Muundo wa Kiebrania unasema kihalisi kwamba mfalme ‘alipata njama ndani ya Hoshea.’ Kiswahili hiki kinaeleza kwa njia ya kawaida kwamba aligundua njama ya kutokuwa mwaminifu iliyofanywa na Hoshea, bila kuibadili kuwa njama dhidi yake.
- source_word: שָׁלַח מַלְאָכִים
  choice: alikuwa ametuma wajumbe
  rationale: ‘Wajumbe’ hufaa kwa watu waliotumwa na pia inaendana na muktadha wa kidiplomasia bila kuongeza cheo kisichotajwa wazi.
- source_word: סוֹא
  choice: So
  rationale: Jina limeandikwa kwa kufuata umbo la Kiebrania kwa sababu utambulisho wa kihistoria wa mtawala huyu wa Misri hauna uhakika.
- source_word: מִנְחָה
  choice: ushuru
  rationale: Katika uhusiano wa kisiasa kati ya mfalme tegemezi na Ashuru, neno hili linamaanisha malipo ya lazima kwa dola tawala, si zawadi au sadaka ya kidini.
- source_word: הֶעֱלָה
  choice: amempelekea
  rationale: Kitenzi kina maana ya msingi ya ‘kupeleka juu,’ lakini katika Kiswahili ‘kumpelekea ushuru’ ni cha kawaida na bado kinadumisha wazo la kuuwasilisha kwa mfalme wa Ashuru.
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: kama alivyofanya kila mwaka
  rationale: Nahau hii inaonyesha kitendo kilichorudiwa kila mwaka. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha kwamba Hoshea aliacha utaratibu wake wa kawaida wa kulipa ushuru.
- source_word: וַיַּעַצְרֵהוּ
  choice: akamkamata
  rationale: Kitenzi kinaweza kumaanisha kumzuia, kumweka kizuizini, au kumkamata. ‘Akamkamata’ kinaeleza hatua ya kwanza kwa kawaida na kuitofautisha na kufungwa gerezani kunakofuata.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: akamfunga gerezani
  rationale: Kitenzi kinamaanisha kumfunga au kumtia vifungoni, na kirai kinachofuata hutaja gereza kuwa mahali alipowekwa. Kiswahili hiki ni wazi na cha kawaida.
