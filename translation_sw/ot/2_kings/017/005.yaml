  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: sw
  text: Ndipo mfalme wa Ashuru akapitia nchi yote, akaenda dhidi ya Samaria[a], akaizingira kwa miaka mitatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaenda Samaria.” Kitenzi cha Kiebrania kinaweza kumaanisha kwenda tu au kusonga mbele kijeshi; lakini kishazi kinachofuata, “akaizingira,” kinaunga mkono maana ya uhasama hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kimsingi humaanisha kupanda, lakini katika simulizi za kijeshi kinaweza kueleza kusonga mbele kwa jeshi. “Akapanda” kinahifadhi taswira ya Kiebrania bila kuficha muktadha wa uvamizi.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Huu ni uwasilishaji wa kawaida na wa asili wa muundo wa umilikaji wa Kiebrania.
- source_word: בְּכָל הָאָרֶץ
  choice: kupitia nchi yote
  rationale: Kihusishi ב katika muktadha huu kinaonyesha mwendo ndani ya eneo lote. “Kupitia nchi yote” kinaeleza ukubwa wa mwendo bila kuongeza tendo mahususi lisilotajwa wazi.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: akapanda kuishambulia Samaria
  rationale: Katika simulizi la kijeshi, עלה pamoja na jina la mji mara nyingi humaanisha kusonga dhidi yake. “Kuishambulia” kinaweka wazi maana ya uhasama inayothibitishwa na tendo linalofuata la kuzingira, huku “akapanda” kikihifadhi nahau ya chanzo.
- source_word: וַיָּצַר עָלֶיהָ
  choice: akaizingira
  rationale: Kitenzi צור katika muktadha huu humaanisha kuuzingira mji kwa vita. “Akaizingira” ni kifupi, wazi, na cha kawaida katika Kiswahili.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: kwa miaka mitatu
  rationale: “Kwa miaka mitatu” ni njia ya kawaida ya Kiswahili ya kuonyesha muda ambao tendo liliendelea.
