  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: sw
  text: Hili lilitokea kwa sababu Waisraeli walikuwa wamemkosea Yahweh, Mungu wao, aliyewatoa kutoka nchi ya Misri, kutoka chini ya mkono wa Farao, mfalme wa Misri,[a] nao walikuwa wameiogopa miungu mingine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka chini ya mamlaka ya Farao.” Kiebrania kinasema kihalisi, “kutoka chini ya mkono wa Farao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wameiabudu miungu mingine.” Kiebrania kinasema “waliogopa miungu mingine,” kwa kutumia kitenzi ambacho kinaweza pia kumaanisha kumcha au kuonyesha heshima ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Jambo hili lilitokea kwa sababu
  rationale: Kauli hii inaanzisha maelezo ya sababu ya matukio yaliyotangulia; tafsiri hii inadumisha nguvu ya kisababishi ya כִּי kwa Kiswahili cha sasa.
- source_word: חָטְאוּ ... לַיהוָה
  choice: walikuwa wamemtendea dhambi Yahweh
  rationale: Kitenzi חטא pamoja na kihusishi ל hapa humaanisha kumtendea mtu dhambi. Wakati timilifu uliotangulia unaonyesha tendo lililotangulia hukumu inayosimuliwa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa maana ya neno kwa neno ni ‘wana wa Israeli,’ ‘Waisraeli’ ni Kiswahili cha kawaida na sahihi kwa taifa linalokusudiwa.
- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: aliyewatoa kutoka nchi ya Misri
  rationale: העלה kwa neno kwa neno ni ‘kuwapandisha,’ lakini katika muktadha wa kutoka Misri humaanisha kuwatoa na kuwaongoza watoke huko; ‘aliyewatoa’ ni ya asili zaidi kwa Kiswahili bila kupoteza tendo la ukombozi.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: kutoka chini ya mkono wa Farao
  rationale: Taswira halisi ya Kiebrania imehifadhiwa katika matini; inamaanisha kutoka chini ya nguvu au utawala wa Farao.
- source_word: וַיִּירְאוּ
  choice: nao walikuwa wameiogopa
  rationale: Mzizi ירא kimsingi humaanisha kuogopa au kustahi. Hapa unahusisha utii wa kidini kwa miungu, lakini tafsiri ya msingi imehifadhiwa ili kutoifanya maana kuwa finyu kuliko Kiebrania.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo maana ya moja kwa moja ya kirai, na inadumisha lugha ya agano kuhusu miungu iliyo tofauti na Yahweh.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la agano יְהוָה; ‘Yahweh’ hulihamisha kwa uwazi bila kulibadilisha kuwa cheo.
- issue: Iwapo ירא kuhusu miungu mingine itafsiriwe kama ibada
  choice: walikuwa wameiogopa miungu mingine
  alternative: walikuwa wameiabudu miungu mingine
  rationale: Ingawa muktadha unaonyesha hofu yenye utii wa kidini na ibada, Kiebrania chenyewe kinatumia kitenzi kipana ‘kuogopa/kustahi’; matini kuu inadumisha mvutano huo, huku tanbihi ikieleza maana ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. ‘Waisraeli’ limetumiwa badala ya ‘wana wa Israeli’ kwa uasilia; taswira ya ‘chini ya mkono wa Farao’ imehifadhiwa na kufafanuliwa katika tanbihi.
