  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: sw
  text: Alifanya yaliyo maovu machoni pa Yahweh, lakini[a] si kama wafalme wa Israeli waliomtangulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ila si kama wafalme wa Israeli waliomtangulia.” Neno la Kiebrania linaweza kutafsiriwa kwa namna ya moja kwa moja zaidi kuwa “ila” au “tu,” likiingiza ukomo katika hukumu iliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Alifanya
  rationale: Wayyiqtol ya עשה inaendeleza simulizi. Kiswahili cha kawaida hakihitaji kuanza kwa kiunganishi “na” hapa.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino, yaani mambo au matendo maovu; “yaliyo maovu” ni ya asili katika Kiswahili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Inahifadhi taswira ya nahau ya Kiebrania inayomaanisha tathmini au maoni ya mtu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: רַק
  choice: lakini
  rationale: Hapa chembe hii inaleta ukomo au tahafifu katika hukumu iliyotangulia; “lakini” huwasilisha vizuri nguvu yake ya ukinzani katika Kiswahili cha kawaida.
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: si kama wafalme wa Israeli
  rationale: Inawakilisha moja kwa moja ulinganisho wenye ukanushi wa Kiebrania.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: waliomtangulia
  rationale: Maana katika muktadha ni wafalme waliokuwa kabla yake; “waliomtangulia” ni wazi na ya asili kuliko tafsiri ya neno kwa neno.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja; “Yahweh” huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Kiwango cha uovu wa mfalme kwa kulinganishwa na waliomtangulia
  choice: lakini si kama wafalme wa Israeli waliomtangulia
  alternative: ila si kama wafalme wa Israeli waliomtangulia
  rationale: Kauli haiondoi hukumu kwamba alifanya maovu, bali inaweka mpaka katika ulinganisho. Tafsiri haielezi ni kwa njia gani alikuwa tofauti, kwa kuwa mstari wenyewe hausemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama kauli ya kawaida ya tathmini ya wafalme; nahau “machoni pa” imehifadhiwa kwa kuwa inaeleweka vizuri.
