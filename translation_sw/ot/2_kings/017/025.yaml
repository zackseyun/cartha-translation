base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: sw
  text: Ikawa, mwanzoni mwa kukaa kwao huko, hawakumcha Yahwe[a]; basi Yahwe akatuma simba kati yao, nao wakawa wakiua baadhi ya watu hao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakumstahi Yahwe.” Neno la Kiebrania linalotafsiriwa “kumcha” linajumuisha staha na kumtambua Mungu inavyopasa, wala halimaanishi woga pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם
  choice: mwanzoni mwa kukaa kwao
  rationale: Kirai hiki kinaonyesha hatua ya kwanza ya wao kuishi katika nchi hiyo. Tafsiri hii inadumisha muundo wa wakati na maana ya kukaa mahali.
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: hawakumcha Yahwe
  rationale: Kitenzi ירא kinapotumiwa kumhusu Mungu hujumuisha hofu yenye staha na kumtambua inavyopasa, wala si woga wa hatari pekee. ‘Kumcha’ ni usemi wa kawaida wa kibiblia unaodumisha upana huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיְשַׁלַּח ... בָּהֶם אֶת הָאֲרָיוֹת
  choice: akatuma simba kati yao
  rationale: Kihusishi ב hapa kinaonyesha kwamba simba waliingia miongoni mwa watu hao; ‘kati yao’ ni ya kawaida na inafaa muktadha.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: wakawa wakiwaua baadhi yao
  rationale: Muundo wa היה pamoja na umbo la kushiriki unaonyesha tendo lililoendelea au kurudiwa. ‘Baadhi yao’ hudumisha maana ya kigawanyo ya בָּהֶם bila kudokeza kwamba wote waliuawa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kuliweka kama cheo, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya ירא kumhusu Mungu
  choice: kumcha
  alternative: kumstahi
  rationale: ‘Kumcha’ huhifadhi mvutano wa maana kati ya hofu na staha kwa Mungu. ‘Kumstahi’ ni ufafanuzi unaowezekana, lakini unaweza kupunguza kipengele cha hofu kilichomo katika neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Ikawa’ inadumisha mtindo wa kisimulizi wa Kiebrania; ‘wakawa wakiwaua’ huonyesha tendo lililoendelea au kurudiwa.
