base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: sw
  text: Hata Yuda[a] hawakuzitii amri za Yahwe, Mungu wao, bali walifuata sheria ambazo Israeli walikuwa wameziweka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pia Yuda.” Neno la mwanzo linasisitiza kwamba Yuda, kama Israeli, pia walikuwa na hatia.
    reason: lexical_alternative
  - marker: b
    text: Au, “walitembea katika sheria ambazo Israeli walikuwa wameziweka,” au, “walifuata desturi ambazo Israeli walikuwa wameanzisha.”
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Hata
  rationale: Katika muktadha huu neno lililotangulizwa linasisitiza kwamba si Israeli peke yao; Yuda pia walikuwa na hatia. “Hata” hudhihirisha msisitizo huo, huku “Pia” ikitajwa katika tanbihi.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la ufalme wa kusini limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: שָׁמַר
  choice: kuzishika
  rationale: Katika muktadha wa agano na amri, kitenzi hiki humaanisha kuzitii au kuzifuata kwa uaminifu; “kuzishika amri” ni usemi wa kawaida wa kibiblia katika Kiswahili.
- source_word: מִצְוֺת
  choice: amri
  rationale: Neno hili linadumisha maana rasmi ya maagizo ya Mungu bila kuwa zito au lisiloeleweka kwa msomaji wa kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.” Umbo “Yahwe” ni la kawaida na linalosomeka kwa Kiswahili.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Kiambishi cha Kiebrania ni cha wingi. Yuda inaeleweka hapa kama watu wa ufalme huo, hivyo “wao” inadumisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיֵּלְכוּ
  choice: bali waliishi kwa kufuata
  rationale: Kitenzi cha kwenda au kutembea pamoja na kihusishi hapa kinaeleza mwenendo wa maisha. “Waliishi kwa kufuata” hutoa sitiari hiyo kwa Kiswahili cha asili, na “bali” huonyesha utofautishaji uliomo katika muktadha.
- source_word: בְּחֻקּוֹת
  choice: masharti
  rationale: חֻקּוֹת inaweza kumaanisha sheria zilizowekwa, maagizo, au desturi. “Masharti” inadumisha ladha ya kanuni zilizowekwa huku “desturi” ikitolewa kama uwezekano katika tanbihi.
- source_word: יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Muktadha unarejelea ufalme wa kaskazini kama jumuiya ya watu. Kuongeza “watu wa” kunafanya upatanisho wa wingi uwe wa kawaida katika Kiswahili bila kubadili rejeleo.
- source_word: אֲשֶׁר עָשׂוּ
  choice: ambayo watu wa Israeli walikuwa wamejiwekea
  rationale: Kitenzi עשה pamoja na masharti kinaweza kumaanisha kuyaweka, kuyaanzisha, au kuyatenda. “Walikuwa wamejiwekea” huonyesha kwamba yaliwekwa na Israeli, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Mtendaji wa עָשׂוּ katika kishazi cha uhusiano
  choice: watu wa Israeli walikuwa wamejiwekea
  alternative: walikuwa wameyaweka; walikuwa wakiyafuata
  rationale: Kitenzi cha Kiebrania ni cha wingi, na Israeli inaweza kueleweka kama jumuiya ya watu; hata hivyo, עשה inaweza kueleza kuweka au kutenda masharti. Tafsiri kuu hufuata uwezekano wa kuyaweka, na tanbihi inadumisha upana wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Wingi katika “Yuda hawakuzishika” na “watu wa Israeli” unaonyesha falme hizo kama jumuiya za watu. Usemi wa Kiebrania wa kutembea umefasiriwa kwa njia ya asili kama mwenendo wa maisha, bila kuondoa maana yake ya kimaadili.
