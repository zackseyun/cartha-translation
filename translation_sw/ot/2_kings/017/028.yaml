base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: sw
  text: Kisha mmoja wa makuhani aliyehamishwa kutoka Samaria akaja, akaishi Betheli, naye akawafundisha jinsi walivyopaswa kumcha Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kisha ... akaja
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; “Kisha” ni ya asili katika Kiswahili na huhifadhi mfuatano huo.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: mmoja wa makuhani
  rationale: Nahau hii humtaja mtu mmoja kutoka katika kundi la makuhani.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: ambao walikuwa wamewahamisha kutoka Samaria
  rationale: Hifili ya גלה humaanisha kupeleka au kuhamisha watu uhamishoni. Muundo huu pia huhifadhi kiima kisichotajwa cha wingi, “wao,” bila kukibainisha.
- source_word: וַיֵּשֶׁב
  choice: kuishi
  rationale: ישב hapa humaanisha kukaa mahali kama makazi; “kuishi” ni Kiswahili cha sasa na cha kawaida.
- source_word: בְּבֵית אֵל
  choice: Betheli
  rationale: Jina la mahali בֵּית אֵל limetoholewa kwa namna iliyozoeleka katika Kiswahili; kitenzi “kuishi” tayari huonyesha uhusiano wa mahali bila kulazimisha kihusishi.
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: naye akawafundisha
  rationale: Muundo wa היה pamoja na kitenzi-jina unaonyesha tendo lililoendelea au jukumu la kawaida; “akawafundisha” hulitoa kwa mtiririko wa kawaida wa simulizi.
- source_word: אֵיךְ יִירְאוּ
  choice: jinsi walivyopaswa kumcha
  rationale: Kifungu hiki kinahusu kuwafundisha namna inayowapasa kumcha Mungu, hivyo huhifadhi maana ya maelekezo yenye wajibu.
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina mahsusi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo wazi kwa msomaji wa Kiswahili.
- issue: Maana ya kumcha Yahwe
  choice: kumcha
  alternative: kumwabudu
  rationale: Kitenzi ירא kimsingi ni “kuogopa/kumcha” na katika muktadha wa kidini kinaweza kujumuisha heshima na utiifu. “Kumcha” huhifadhi upana na mvutano huo bila kuifupisha maana kuwa ibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi kiima kisichotajwa cha tendo la kuwahamisha kwa kutumia “walikuwa wamewahamisha,” badala ya kutaja Waashuru kwa kuongeza taarifa kutoka nje ya mstari.
