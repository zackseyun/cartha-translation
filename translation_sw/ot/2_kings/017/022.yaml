  text: וַ/יֵּֽלְכוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/כָל חַטֹּ֥אות יָרָבְעָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה לֹא סָ֖רוּ מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: sw
  text: Nao wana wa Israeli wakaendelea kufuata dhambi zote za Yeroboamu alizofanya; hawakuziacha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “hawakugeuka kutoka kwake”; umoja huo huenda unarejelea kwa ujumla mwenendo wa dhambi uliotajwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: wakaendelea kufuata
  rationale: הלך pamoja na ב hapa inaeleza kufuata mwenendo fulani. Kiswahili cha ‘wakaendelea kufuata’ kinawasilisha sitiari kwa lugha ya kawaida na pia muktadha wa kudumu katika dhambi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kitaifa na wa agano wa Kiebrania, huku ukiwa wa heshima na unaoeleweka katika Kiswahili cha Biblia.
- source_word: בְּכָל חַטֹּאות
  choice: dhambi zote
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya wingi, ikirejelea matendo yote ya dhambi yaliyohusishwa na Yeroboamu.
- source_word: אֲשֶׁר עָשָׂה
  choice: alizofanya
  rationale: Kitenzi עשה kimsingi ni ‘kufanya.’ Kiswahili ‘dhambi ... alizofanya’ ni cha kawaida na hakiongezi maana isiyokuwapo katika chanzo.
- source_word: לֹא סָרוּ
  choice: hawakuziacha
  rationale: סור humaanisha kugeuka, kujitenga, au kuacha. Katika muktadha huu ‘hawakuziacha’ huonyesha wazi kwamba waliendelea katika dhambi hizo.
- source_word: מִמֶּנָּה
  choice: -ziacha
  rationale: Kiwakilishi cha Kiebrania ni umoja wa kike, lakini huenda kinarejelea kwa ujumla mwenendo wa dhambi uliotajwa. Katika Kiswahili, upatanisho wa wingi na ‘dhambi’ ni wa kawaida zaidi; tofauti ya umoja imebainishwa katika tanbihi.
theological_decisions:
- issue: Kirejeleo cha kiambishi cha mwisho מִמֶּנָּה, ambacho ni umoja baada ya ‘dhambi’ za wingi
  choice: Kutafsiri kwa upatanisho wa kawaida wa Kiswahili kama ‘hawakuziacha,’ yaani dhambi za Yeroboamu kwa ujumla.
  alternative: ‘Hawakuacha mwenendo huo,’ kwa kuichukulia kiambishi cha umoja kuwa kinarejelea mwenendo mmoja wa dhambi.
  rationale: Kiebrania kinahifadhi umoja unaoweza kueleweka kwa maana ya ujumla. Tafsiri kuu inafuata kirejeleo kilicho karibu, ‘dhambi zote,’ bila kuondoa uwezekano wa maana ya mwenendo wa pamoja, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Wakaendelea kufuata’ huepuka tafsiri ngumu ya moja kwa moja ‘kutembea katika’ huku ikihifadhi maana ya kufuata mwenendo; ‘wana wa Israeli’ huhifadhi usemi wa chanzo.
