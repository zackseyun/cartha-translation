  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: sw
  text: Walifuata desturi za mataifa ambayo Yahwe alikuwa ameyafukuza kutoka mbele ya Waisraeli,[a] na desturi ambazo wafalme wa Israeli walikuwa wameanzisha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli,” yaani, Waisraeli.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “na mambo ambayo wafalme wa Israeli waliyafanya.” Kishazi cha Kiebrania kimefupishwa.'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Wakaishi kwa kufuata
  rationale: Kitenzi הָלַךְ ni ‘kutembea/kwenda’ kwa maana halisi, lakini hapa ni sitiari ya mwenendo wa maisha. ‘Wakaishi kwa kufuata’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuifanya kana kwamba ni safari ya miguu.
- source_word: בְּחֻקּוֹת
  choice: desturi
  rationale: חֻקּוֹת inaweza kumaanisha masharti yaliyowekwa au desturi zinazofuatwa. Kwa kuwa hapa inahusu mwenendo wa mataifa, ‘desturi’ ni ya asili na sahihi zaidi kuliko ‘sheria’.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Neno גּוֹיִם hapa linamaanisha makundi yasiyo ya Israeli yaliyokuwa katika nchi; ‘mataifa’ ni tafsiri ya kawaida isiyoingiza maana ya ziada ya kidini.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: ambayo Yahwe alikuwa ameyafukuza kutoka mbele ya
  rationale: Hifili הוֹרִישׁ inaweza kumaanisha kuwafukuza au kuwanyang’anya milki. ‘Ameyafukuza kutoka mbele ya’ huhifadhi tendo la kuyaondoa mataifa hayo na uhusiano wa מִפְּנֵי.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa Kiebrania ni ‘wana wa Israeli,’ hapa ni jina la jumla la watu wa Israeli. ‘Waisraeli’ ni Kiswahili cha asili na kinajumuisha jamii yote inayokusudiwa.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: na desturi ambazo wafalme wa Israeli walikuwa wameanzisha
  rationale: Kishazi cha Kiebrania kimefupishwa na kinaendeleza wazo la חֻקּוֹת. Kurudia ‘desturi’ kwa Kiswahili hukamilisha sentensi; ‘walikuwa wameanzisha’ huonyesha kwamba wafalme walizifanya au kuziweka desturi hizo.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano יְהוָה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Maana ya kishazi cha mwisho kilichofupishwa
  choice: desturi ambazo wafalme wa Israeli walikuwa wameanzisha
  alternative: mambo ambayo wafalme wa Israeli walikuwa wamefanya
  rationale: Kisarufi, ‘desturi’ inachukuliwa kutoka kishazi cha awali ili kuonyesha kile ambacho watu walifuata. Hata hivyo, kwa kuwa עָשׂוּ ni ‘walifanya/walitengeneza,’ tanbihi huhifadhi uwezekano mpana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya Kiebrania ya ‘kutembea’ imewasilishwa kwa maana yake ya kimwenendo, huku ‘desturi’ ikibeba wazo la taratibu zilizowekwa na kufuatwa.
