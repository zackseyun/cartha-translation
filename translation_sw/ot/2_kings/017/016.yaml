language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: sw
  text: Wakaziacha amri zote za Yahweh, Mungu wao, wakajitengenezea sanamu za metali iliyoyeyushwa, yaani ndama wawili. Pia wakatengeneza Ashera[a], wakaliinamia jeshi lote la mbinguni, wakamtumikia Baali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kifaa cha ibada cha Ashera.” Neno la Kiebrania Ashera linaweza kumaanisha mungu wa kike wa Wakanaani au kifaa kilichotumiwa katika ibada yake.
    reason: Neno אֲשֵׁירָה lina utata wa kimsamiati ambao haupaswi kuamuliwa kimya kimya katika maandishi makuu.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: Wakaziacha
  rationale: Kitenzi עזב hapa kinaonyesha kuziacha kabisa amri katika uasi wa agano; kiambishi -zi- kinarejelea amri zote kwa Kiswahili cha kawaida.
- source_word: כָּל מִצְוֺת
  choice: amri zote
  rationale: Huhifadhi wingi na msisitizo wa כָּל, huku 'amri' ikiwa lugha ya asili na yenye heshima katika muktadha wa agano.
- source_word: יְהוָה אֱלֹהֵיהֶם
  choice: Yahweh, Mungu wao
  rationale: Jina la Mungu limewasilishwa kama Yahweh, na kiwakilishi cha umilikaji katika אֱלֹהֵיהֶם kimehifadhiwa kwa 'wao'.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: wakajitengenezea
  rationale: Umbo hili la Kiswahili linaonyesha kwamba walivitengeneza kwa matumizi na ibada yao wenyewe.
- source_word: מַסֵּכָה שנים עֲגָלִים
  choice: sanamu za metali iliyoyeyushwa, yaani ndama wawili
  rationale: מַסֵּכָה huelekeza kwenye sanamu iliyotengenezwa kwa kumimina metali iliyoyeyushwa, na 'yaani' huonyesha kwamba sanamu hizo zilikuwa ndama wawili. Wingi wa Kiswahili unafuata ndama wawili wanaotajwa wazi.
- source_word: אֲשֵׁירָה
  choice: Ashera
  rationale: Neno la Kiebrania limehifadhiwa kama jina bila kulazimisha maana ya mungu wa kike au kifaa chake cha ibada; tanbihi inaeleza uwezekano huo.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: wakaliinamia
  rationale: Huhifadhi tendo halisi la kuinama kwa ibada badala ya kulifanya moja kwa moja kuwa kitenzi cha jumla 'kuabudu'.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: jeshi lote la mbinguni
  rationale: Huu ni ulinganifu wa karibu unaohifadhi taswira ya צבא kama jeshi au mkusanyiko wa vitu vya mbinguni.
- source_word: וַיַּעַבְדוּ אֶת הַבָּעַל
  choice: na kumtumikia Baali
  rationale: ‘Kumtumikia’ huhifadhi maana ya huduma ya ibada katika עבד na kuitofautisha na tendo la kuinama lililotajwa kabla yake; Baali ni umbo la kawaida la Kiswahili la jina hilo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, יהוה; 'Yahweh' hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Maana ya אֲשֵׁירָה
  choice: Ashera, pamoja na tanbihi ya ufafanuzi
  alternative: nguzo ya Ashera au mungu wa kike Ashera
  rationale: Ingawa tendo la 'kutengeneza' linaelekea kuashiria kifaa cha ibada, neno lenyewe linaweza kumaanisha mungu huyo wa kike au kifaa chake; tafsiri haiamui zaidi ya chanzo.
- issue: Uhusiano wa מַסֵּכָה na ndama wawili
  choice: sanamu za metali iliyoyeyushwa, yaani ndama wawili
  alternative: sanamu moja ya metali iliyoyeyushwa—ndama wawili
  rationale: Nomino ya Kiebrania iko katika umoja lakini inafafanuliwa na 'ndama wawili.' Kiswahili cha wingi huepuka mgongano usio wa kawaida huku kikihifadhi utambulisho wa sanamu hizo kama ndama wawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetumia mfululizo wa vitenzi vya -ka- kwa mtiririko wa kawaida. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya ‘Ashera,’ neno linaloelezwa na tanbihi.
