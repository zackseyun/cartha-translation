translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ya kihistoria ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa maumbo yanayosomeka kwa urahisi: Ashuru, Hala, Habori, Gozani na Umedi.'
