base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: sw
  text: Katika mwaka wa tisa wa utawala wa Hoshea, mfalme wa Ashuru aliuteka Samaria, akawapeleka Waisraeli uhamishoni hadi Ashuru, na akawapa makao huko Hala, kando ya Habori, mto wa Gozani[b], na katika miji ya Umedi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au “kando ya Habori, mto wa Gozani.” Kiebrania kinaweza kueleza makazi kando ya Mto Habori katika sehemu ya Gozani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: Katika mwaka wa tisa wa utawala wa Hoshea
  rationale: Kirai hiki kinataja mwaka wa tisa wa utawala wa Hoshea. Kuongeza “wa utawala” kwa Kiswahili huweka wazi maana ya rejeo la kifalme bila kubadili taarifa.
- source_word: לָכַד ... אֶת שֹׁמְרוֹן
  choice: aliuteka Samaria
  rationale: Kitenzi לָכַד katika muktadha wa mji humaanisha kuutwaa kijeshi; “aliuteka” ni usemi wa kawaida na sahihi.
- source_word: וַיֶּגֶל אֶת יִשְׂרָאֵל אַשּׁוּרָה
  choice: akawahamisha Waisraeli kwa nguvu hadi Ashuru
  rationale: Hifili ya גלה inaonyesha kuondolewa na kupelekwa uhamishoni. “Kwa nguvu” huonyesha kuwa hawakuhama kwa hiari, huku “Waisraeli” ikiwakilisha Israel kama watu kwa lugha ya kawaida.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: Akawakalisha huko
  rationale: Hifili ya ישׁב humaanisha kuwafanya wakae au kuwapatia makao. “Akawakalisha” huhifadhi uhusiano wa kisababishi na muktadha wa kuhamishwa.
- source_word: בַּחְלַח
  choice: huko Hala
  rationale: Jina la mahali limetoholewa kuwa Hala; “huko” linaunganisha kwa kawaida maeneo yanayofuata na kitendo cha kuwakalisha.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: kando ya Mto Habori katika eneo la Gozani
  rationale: Habori hutambulishwa kama mto, na ב inaweza kuonyesha makazi kando yake. “Katika eneo la Gozani” huhifadhi uwezekano wa Gozani kuwa eneo linalohusishwa na mto bila kudai kwamba ndilo jina la mto.
- source_word: וְעָרֵי מָדָי
  choice: na katika miji ya Umedi
  rationale: Kirai kinataja miji ya Wamedi au nchi yao. “Umedi” ni jina la eneo linalofaa katika muundo “miji ya Umedi”.
