  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: sw
  text: Kwa hiyo Yahwe akawakasirikia sana Israeli, akawaondoa kutoka mbele ya uso wake[a]. Hakuna aliyebaki isipokuwa kabila la Yuda peke yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika uwepo wake.” Kiebrania kwa maana halisi zaidi ni “kutoka mbele ya uso wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: akawakasirikia sana
  rationale: Kitenzi אנף katika muundo huu kinaonyesha hasira kali iliyoelekezwa kwa mtu au kundi, huku מְאֹד ikiongeza nguvu. ‘Akawakasirikia sana’ ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּיִשְׂרָאֵל
  choice: Israeli
  rationale: Baada ya kitenzi cha hasira, בְּ huonyesha mlengwa wa hasira. ‘Israeli’ linahifadhi jina la taifa; kiambishi -wa- katika ‘akawakasirikia’ kinaonyesha watu wa taifa hilo kwa maana ya pamoja.
- source_word: וַיְסִרֵם
  choice: akawaondoa
  rationale: Hifili ya סור ina maana ya kusababisha waondoke au kuwaondoa. Tafsiri hii haiingizi wazi wazo la uhamisho, ingawa muktadha unalihusisha.
- source_word: מֵעַל פָּנָיו
  choice: mbele ya uso wake
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania kuhusu uso wa Mungu; maana laini zaidi ya ‘kutoka katika uwepo wake’ imewekwa katika tanbihi.
- source_word: לֹא נִשְׁאַר
  choice: Hakuna aliyebaki
  rationale: Nifali ya שׁאר inaonyesha kubaki. Umbo la mtu ‘aliyebaki’ linafaa kwa rejea ya watu wa Israeli.
- source_word: רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: isipokuwa kabila la Yuda peke yake
  rationale: ‘Isipokuwa’ huonyesha hali ya pekee baada ya kauli hasi, na ‘peke yake’ huhifadhi msisitizo wa לְבַדּוֹ.
theological_decisions:
- issue: Taswira ya kibinadamu kuhusu uwepo wa Mungu katika מֵעַל פָּנָיו
  choice: mbele ya uso wake
  alternative: kutoka katika uwepo wake; kutoka mbele zake
  rationale: Kiebrania kinatumia taswira halisi ya uso. Kuihifadhi katika matini kuu hudumisha uzito na ukaribu wa lugha ya agano bila kuifanya kuwa dhana ya jumla; tanbihi inatoa maana ya kawaida zaidi.
- issue: Mrejelewa wa ‘Israeli’ katika muktadha
  choice: Israeli kama watu wa ufalme wa kaskazini waliopata hukumu
  alternative: Israeli kama watu wote wa agano kwa maana pana
  rationale: Muktadha wa 2 Wafalme 17 ni kuanguka na kuhamishwa kwa ufalme wa kaskazini. Tafsiri haiongezi ufafanuzi huo ndani ya mstari wala kuupanua kuwa dai lisiloelezwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘akawakasirikia sana Israeli’ unalitendea jina ‘Israeli’ kama jamii ya watu, jambo linaloendana na kiambishi cha wingi katika ‘akawaondoa.’ Taswira ya ‘uso wake’ imehifadhiwa makusudi, huku tanbihi ikitoa usemi wa kawaida zaidi.
