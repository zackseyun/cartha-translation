base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: sw
  text: Yahweh aliwakataa wazao wote wa Israeli[a], akawatesa, akawatia mikononi mwa waporaji[b], mpaka akawafukuza kutoka mbele zake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uzao wote wa Israeli”; Kiebrania ni “mbegu/uzao wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuwakabidhi mikononi mwa waporaji.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kutoka mbele zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: aliwakataa
  rationale: Kitenzi מָאַס hapa kinaonyesha kukataa kwa uamuzi katika muktadha wa hukumu; “aliwakataa” ni wazi bila kuongeza wazo la kuwadharau kihisia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya kulitamka kwa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: wazao wote wa Israeli
  rationale: זֶרַע linaweza kumaanisha uzao au wazao; “wazao” ni Kiswahili cha kawaida na huhifadhi maana ya jamii inayotokana na Israeli bila kuifafanua zaidi ya Kiebrania.
- source_word: וַיְעַנֵּם
  choice: akawatesa
  rationale: Katika Piel, ענה lina maana ya kutesa, kudhulumu, au kunyenyekeza; “akawatesa” linafaa kwa mfululizo huu wa hukumu bila kuufanya kuwa ukandamizaji wa kijamii pekee.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: kuwatia mikononi mwa
  rationale: Nahau נתן ביד humaanisha kumweka mtu chini ya mamlaka ya mwingine; “kuwatia mikononi mwa” huhifadhi picha ya Kiebrania na inaeleweka kwa kawaida.
- source_word: שֹׁסִים
  choice: waporaji
  rationale: Neno hili linamaanisha watu wanaopora au kuteka mali kwa nguvu; “waporaji” ni la sasa, wazi, na lenye uzito unaofaa.
- source_word: עַד אֲשֶׁר
  choice: mpaka
  rationale: Muungano huu unaonyesha kikomo cha matendo yaliyotangulia; “mpaka” ni sahihi na wa kawaida.
- source_word: הִשְׁלִיכָם
  choice: alipowatupa mbali
  rationale: השליך maana yake ya msingi ni kutupa; “kuwatupa mbali” huhifadhi nguvu ya picha hiyo na kuonyesha kuondolewa bila kuingiza istilahi ya kimadhehebu.
- source_word: מִפָּנָיו
  choice: na uwepo wake
  rationale: Nahau hii, kihalisi “kutoka mbele ya uso wake,” humaanisha kuondolewa katika uwepo wake; usemi uliochaguliwa ni wa asili kwa Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kama jina.
- issue: Upeo wa “wazao wote wa Israeli”
  choice: Kuhifadhi maneno mapana bila kuyafinyanga
  alternative: Kuyafafanua kuwa ufalme wa kaskazini pekee au kila mzao wa Yakobo bila ubaguzi
  rationale: Kiebrania kinasema “wazao wote wa Israeli.” Muktadha wa kihistoria unaweza kusaidia kuelewa upeo, lakini tafsiri haipaswi kuamua kimya kimya jambo ambalo mstari wenyewe huliacha likiwa pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi mfululizo umehifadhi mwendo wa simulizi la Kiebrania, huku nahau zisizo za kawaida zikifanywa zieleweke bila kupoteza picha zake kuu.
