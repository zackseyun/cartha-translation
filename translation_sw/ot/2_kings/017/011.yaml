id: 2KI.17.11
reference: 2 Kings 17:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: sw
  text: Huko wakafukiza uvumba katika kila mahali pa juu pa ibada, kama mataifa ambayo Yahwe alikuwa ameyaondoa mbele yao[a]. Wakafanya mambo maovu ili kumkasirisha Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo Yahwe alikuwa ameyapeleka uhamishoni kutoka mbele yao.” Kitenzi cha Kiebrania kinaweza kumaanisha kupeleka uhamishoni au kuondoa; hapa kinayahusu mataifa yaliyoondolewa katika nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: wakafukiza uvumba
  rationale: Kitenzi קטר katika kauli ya piel humaanisha kufanya moshi wa ibada upande, na mara nyingi hasa kufukiza uvumba. Kauli hii ni ya kawaida na inaeleweka katika Kiswahili cha ibada.
- source_word: שָׁם
  choice: Huko
  rationale: Kielezi hiki hurejelea mahali pa juu pa ibada palipotajwa katika muktadha uliotangulia.
- source_word: בְּכָל בָּמוֹת
  choice: katika kila mahali pa juu pa ibada
  rationale: במות ni maeneo maalumu ya ibada yaliyokuwa juu. Nyongeza ya 'pa ibada' huweka wazi maana ya kidini bila kuyafanya kuwa milima tu.
- source_word: כַּגּוֹיִם
  choice: kama mataifa
  rationale: גוים hapa ni mataifa yaliyokuwako katika nchi kabla ya Israeli; 'mataifa' ni neno pana na la kawaida lisiloingiza maana ya baadaye ya kidini.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: ambayo Yahwe alikuwa ameyaondoa mbele yao
  rationale: הגלה inaweza kumaanisha kuhamisha au kupeleka uhamishoni. 'Ameyaondoa mbele yao' inafaa muktadha wa mataifa kunyang'anywa nchi na pia haifuti upana wa kitenzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: Wakafanya mambo maovu
  rationale: Tafsiri hii ya moja kwa moja huhifadhi hukumu pana ya kimaadili ya maneno ya Kiebrania.
- source_word: לְהַכְעִיס
  choice: ili kumkasirisha
  rationale: Kauli ya hiphil ya כעס ina maana ya kusababisha hasira au kuchokoza. 'Kumkasirisha' hutaja wazi matokeo yanayokusudiwa katika sentensi hii.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הֶגְלָה katika muktadha wa kunyang'anywa nchi
  choice: alikuwa ameyaondoa mbele yao
  alternative: alikuwa ameyapeleka uhamishoni kutoka mbele yao
  rationale: Muktadha unahusu mataifa yaliyoondolewa katika nchi mbele ya Israeli. Chaguo kuu ni pana na la kawaida, huku tanbihi ikihifadhi maana mahsusi ya kupelekwa uhamishoni.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mahali pa juu pa ibada' linafafanua istilahi ya kidini bila kutumia msamiati mgumu; muundo wa simulizi unabaki mfupi na wa moja kwa moja.
