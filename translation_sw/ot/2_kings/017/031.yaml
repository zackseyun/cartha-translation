base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: sw
  text: Waavi[a] walitengeneza Nibhazi na Tartaki, nao Wasefarvaimu walikuwa wakiwateketeza wana wao katika moto kwa ajili ya Adrameleki na Anameleki, miungu ya Sefarvaimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waavimu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, waliwatoa wana wao kuwa dhabihu kwa kuwateketeza katika moto kwa ajili ya miungu hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: Waavi
  rationale: Jina la kabila katika wingi limetoholewa kwa mfumo wa kawaida wa Kiswahili wa majina ya watu; tanbihi huhifadhi umbo mbadala Waavimu.
- source_word: עָשׂוּ
  choice: walitengeneza
  rationale: Kitenzi עשה kina maana ya kutengeneza hapa, huku majina ya miungu yakiwa yamefanywa kuwa vitu vya ibada; tafsiri haiongezi wazi ‘sanamu’ kwa kuwa neno hilo halipo katika Kiebrania.
- source_word: נִבְחַז וְאֶת תַּרְתָּק
  choice: Nibhazi na Tartaki
  rationale: Majina ya miungu yametoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: הַסְפַרְוִים
  choice: Wasefarvaimu
  rationale: Ni jina la wingi la watu wa Sefarvaimu, limetoholewa kwa kiambishi cha Kiswahili Wa-.
- source_word: שֹׂרְפִים
  choice: walikuwa wakiwateketeza
  rationale: Hali ya kushiriki ya Kiebrania inaonyesha tendo la kawaida au linaloendelea; muundo huu wa Kiswahili huhifadhi nguvu hiyo.
- source_word: אֶת בְּנֵיהֶם בָּאֵשׁ
  choice: wana wao motoni
  rationale: בנים imehifadhiwa kwa maana mahsusi ya wana wa kiume, na בָאֵשׁ imetafsiriwa kwa Kiswahili cha kawaida ‘motoni’.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: kwa ajili ya Adrameleki na Anameleki
  rationale: ל huonyesha kwamba dhabihu hizo zilielekezwa au kutolewa kwa miungu hii; ‘kwa ajili ya’ ni ya asili na haiongezi madai yasiyo katika matini.
- source_word: אלה ספרים
  choice: miungu ya Sefarvaimu
  rationale: Kirai cha uhusiano kinawatambulisha Adrameleki na Anameleki kuwa miungu inayohusishwa na mahali paitwapo Sefarvaimu.
theological_decisions:
- issue: Iwapo kueleza wazi kwamba Nibhazi na Tartaki walikuwa sanamu au mifano ya miungu
  choice: Kudumisha ‘walitengeneza Nibhazi na Tartaki’ bila kuongeza ‘sanamu’ katika matini kuu.
  alternative: walitengeneza sanamu za Nibhazi na Tartaki
  rationale: Kiebrania kinatumia tu ‘walitengeneza’ pamoja na majina. Muktadha unaonyesha utengenezaji wa vitu vya ibada, lakini kuongeza ‘sanamu’ kungefafanua zaidi ya maneno yenyewe.
- issue: Iwapo בְּנֵיהֶם itafsiriwe kwa neno la kijumla ‘watoto wao’
  choice: wana wao
  alternative: watoto wao
  rationale: Neno la Kiebrania ni la jinsia ya kiume katika kifungu hiki; ‘wana’ huhifadhi umahususi huo.
- issue: Iwapo שֹׂרְפִים iwe wakati uliopita sahili au tendo la mazoea/linaloendelea
  choice: walikuwa wakiwateketeza
  alternative: waliwateketeza
  rationale: Umbo la kushiriki linaweza kuonyesha desturi inayoendelea katika orodha hii ya matendo ya ibada; tafsiri iliyochaguliwa huhifadhi kipengele hicho bila kukifanya tukio moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametoholewa kwa urahisi wa matamshi ya Kiswahili; ‘wana wao’ huhifadhi umahususi wa Kiebrania, na ‘walikuwa wakiwateketeza’ huonyesha tendo la kidesturi.
