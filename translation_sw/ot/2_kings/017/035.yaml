source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: sw
  text: Yahwe akafanya agano nao, akawaamuru akisema, “Msiwaogope miungu mingine, wala msiisujudie, wala msiitumikie, wala msiitolee dhabihu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: akafanya agano
  rationale: Kirai cha Kiebrania כרת ברית ni nahau yenye maana ya kufanya agano; Kiswahili cha kawaida na sahihi ni ‘kufanya agano,’ si tafsiri ya neno kwa neno ‘kukata agano.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja kwa tahajia ya Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: אִתָּם
  choice: nao
  rationale: Huwakilisha kwa ufupi na kwa kawaida uhusiano wa agano ‘pamoja nao/nao.’
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: akawaamuru akisema
  rationale: Hudumisha kitenzi cha kuamuru na fomula ya Kiebrania ya kutambulisha maneno ya moja kwa moja.
- source_word: לֹא תִירְאוּ
  choice: Msiwaogope
  rationale: Kiswahili hutumia hali ya kukataza ‘msi-’ kwa amri yenye nguvu. ‘Kuogopa’ limehifadhiwa kwa sababu vitenzi vinavyofuata hutaja matendo ya ibada tofauti.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ‘other gods,’ bila kuibadili kuwa ‘miungu ya kigeni.’
- source_word: תִשְׁתַּחֲווּ לָהֶם
  choice: msiisujudie
  rationale: ‘Kusujudia’ huhifadhi tendo halisi la kuinama/kupiga magoti mbele ya miungu na kulitofautisha na vitenzi vingine vya ibada katika orodha.
- source_word: תַעַבְדוּם
  choice: kuitumikia
  rationale: ‘Kutumikia’ huhifadhi maana ya msingi ya עבד na tofauti yake na kusujudia na kutoa dhabihu.
- source_word: תִזְבְּחוּ לָהֶם
  choice: kuitolea dhabihu
  rationale: Hueleza wazi dhabihu inayotolewa kwa miungu hiyo na ni muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la agano la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi kwa tahajia inayofaa Kiswahili, badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya makatazo katika hotuba ya agano
  choice: Msiwaogope ... wala msiisujudie, wala kuitumikia, wala kuitolea dhabihu
  alternative: Hamtaogopa ... hamtaisujudia ...
  rationale: Muundo wa ‘msi-’ ni njia ya kawaida na yenye uzito ya kutoa katazo kwa wingi katika Kiswahili. ‘Wala’ huendeleza upeo wa katazo kwenye matendo yote yanayoorodheshwa.
- issue: Tofauti kati ya hofu na matendo ya ibada
  choice: kuogopa, kusujudia, kutumikia, na kutolea dhabihu zimetafsiriwa kwa maneno tofauti
  alternative: Kutumia ‘kuabudu’ kwa zaidi ya kitenzi kimoja
  rationale: Kiebrania kinaweka mfululizo wa vitenzi tofauti. Kuvihifadhi huepuka kufuta mvutano na upana wa katazo la agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wa agano bila kuwa mgumu kupita kiasi. Viwakilishi vya umoja katika ‘msiisujudie, kuitumikia, kuitolea’ vinarejelea nomino ya ngeli ya 4 ‘miungu,’ kama sarufi ya Kiswahili inavyotaka.
