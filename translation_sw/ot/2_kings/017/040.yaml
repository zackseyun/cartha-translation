  yaml_path: translation/ot/2_kings/017/040.yaml
  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: sw
  text: Lakini hawakusikiliza; badala yake, waliendelea kutenda kulingana na desturi yao ya zamani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliendelea kufanya kulingana na kanuni/mazoea yao ya zamani.” Neno la Kiebrania מִשְׁפָּט linaweza kumaanisha agizo, kanuni, au desturi; hapa linarejelea utaratibu wao wa ibada waliokuwa wameuzoea hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Lakini ... hawaku-
  rationale: Kiunganishi pamoja na ukanushi kinaonyesha tofauti ndogo na agizo lililotangulia; “Lakini” ni Kiswahili cha kawaida na fasaha katika muktadha huu.
- source_word: שָׁמֵעוּ
  choice: hawakusikiliza
  rationale: Kitenzi kinaweza kumaanisha kusikia, kusikiliza, au kutii. “Hawakusikiliza” huhifadhi wazo la kusikia kwa makini na kuitikia bila kulifafanua kupita kiasi kuwa kutotii.
- source_word: כִּי אִם
  choice: badala yake
  rationale: 'Nahau hii inatofautisha jambo lililokataliwa na tendo lililofuatwa: si X, bali Y. “Badala yake” huwasilisha tofauti hiyo kwa Kiswahili cha sasa.'
- source_word: כְּמִשְׁפָּטָם
  choice: kulingana na desturi yao
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, agizo, kanuni, au desturi. Katika muktadha wa mwenendo wa kidini, “desturi” huonyesha utaratibu wao uliozoeleka bila kuufanya lazima kuwa sheria rasmi.
- source_word: הָרִאשׁוֹן
  choice: ya zamani
  rationale: Kivumishi hiki hapa kinarejelea desturi yao ya awali. “Ya zamani” ni usemi wa kawaida na unaoeleweka kwa urahisi katika Kiswahili.
- source_word: הֵם עֹשִׂים
  choice: waliendelea kutenda
  rationale: Muundo wa hali ya kuendelea wa Kiebrania unaonyesha tendo la kudumu au la mazoea. “Waliendelea kutenda” huonyesha kuendelea kwa mwenendo huo.
