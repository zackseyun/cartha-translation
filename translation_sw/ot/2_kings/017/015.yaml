  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: sw
  text: Wakazikataa sheria zake na agano lake alilofanya na baba zao, pamoja na maonyo yake aliyowaonya nayo.[a] Wakafuata ubatili[b] nao wakawa batili,[c] na wakayafuata mataifa yaliyowazunguka, ambayo Yahweh alikuwa amewaamuru wasifanye kama wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shuhuda zake alizozitoa dhidi yao.” Kiebrania kinaweza kueleza shuhuda nzito zilizotolewa dhidi yao au maonyo waliyopewa.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha “utupu,” “jambo lisilo na thamani,” au, kwa kudokeza katika muktadha huu, “sanamu.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kinatumia maneno yenye mzizi mmoja: walifuata ubatili, nao wakawa batili—yaani, wakawa tupu au wasio na thamani kama kile walichokifuata.'
    reason: wordplay
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Wakazikataa
  rationale: Kitenzi hiki huonyesha kukataa au kutupilia mbali; “wakazikataa” ni cha kawaida na kinahifadhi uzito wa uasi wa kiagano.
- source_word: חֻקָּיו
  choice: sheria zake
  rationale: “Sheria” ni neno la kawaida la Kiswahili kwa masharti au amri zilizowekwa, na linafaa katika muktadha wa agano.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: agano lake alilofanya
  rationale: Kiebrania husema kihalisi “alikata agano,” lakini Kiswahili cha kawaida husema “kufanya agano.”
- source_word: אֲבוֹתָם
  choice: baba zao
  rationale: Huhifadhi usemi halisi wa Kiebrania na mtindo wa kawaida wa simulizi za agano.
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: maonyo yake aliyowaonya nayo
  rationale: Katika muktadha huu, ushuhuda huo una nguvu ya onyo zito. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi uwezekano wa “ushuhuda.”
- source_word: הַהֶבֶל
  choice: ubatili
  rationale: “Ubatili” huonyesha hali ya kuwa tupu, bure, au isiyo na thamani, na katika muktadha inaweza kudokeza sanamu.
- source_word: וַיֶּהְבָּלוּ
  choice: wakawa batili
  rationale: 'Huhifadhi mchezo wa maneno wa mzizi mmoja: walifuata ubatili, kisha wao wenyewe wakawa batili.'
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: mataifa yaliyowazunguka
  rationale: Ni tafsiri ya kawaida na iliyo wazi kwa mataifa jirani.
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: wasitende kama hayo
  rationale: Huhifadhi usemi mfupi wa Kiebrania, huku “hayo” likirejelea mataifa yaliyotajwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetolewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la Mungu lenye herufi nne; “Yahweh” hulihifadhi kama jina la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya הבל katika muktadha wa ibada
  choice: ubatili
  alternative: sanamu
  rationale: “Ubatili” huhifadhi maana ya msingi na mchezo wa maneno bila kuifanya maana iliyodokezwa ya “sanamu” kuwa maana pekee.
- issue: Nguvu ya עֵדוֹת / הֵעִיד
  choice: maonyo yake aliyowaonya nayo
  alternative: ushuhuda wake alioutoa dhidi yao
  rationale: Muktadha unaunga mkono onyo zito, lakini tanbihi inahifadhi uwezekano wa lugha ya ushuhuda dhidi yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Ubatili/batili” kimetumiwa kuhifadhi mchezo wa maneno wa Kiebrania; “maonyo yake aliyowaonya nayo” ni cha asili zaidi kuliko muundo mgumu wa “ushuhuda,” ambao umehifadhiwa katika tanbihi.
