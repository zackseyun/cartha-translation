  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: sw
  text: Bali mtamwogopa Yahweh[a], aliyewatoa katika nchi ya Misri kwa nguvu kuu na kwa mkono ulionyoshwa; mtamsujudia yeye, na kwake mtatoa dhabihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kumwogopa” hapa kunahusisha uchaji, ibada, na uaminifu kwa agano, si hofu ya kutishwa tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Bali
  rationale: Katika muktadha huu kirai kinaweka tofauti dhahiri kati ya miungu mingine iliyokatazwa na Yahweh anayepaswa kuogopwa; “Bali” ni ya heshima na huhifadhi nguvu hiyo ya upinzani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limeandikwa moja kwa moja katika Kiebrania; limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: הֶעֱלָה
  choice: aliyewapandisha
  rationale: Hifili ya עלה ina maana ya kusababisha kupanda. “Aliyewapandisha” huhifadhi taswira ya Kiebrania, ingawa katika muktadha huu ina maana ya kuwatoa Misri.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: kutoka nchi ya Misri
  rationale: Huhifadhi kirai kamili cha kawaida kinachohusishwa na tukio la kutoka Misri.
- source_word: בְּכֹחַ גָּדוֹל
  choice: kwa nguvu kuu
  rationale: Kihusishi kinaonyesha chombo au namna; tafsiri hii ni ya kawaida na huhifadhi ukubwa wa nguvu ya Mungu.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: na kwa mkono ulionyoshwa
  rationale: Ingawa זְרוֹעַ kihalisi ni “mkono wa juu” au “brachium,” katika Kiswahili “mkono ulionyoshwa” ni usemi wa asili unaohifadhi taswira ya nguvu ya wokovu inayotenda.
- source_word: אֹתוֹ תִירָאוּ
  choice: mtamwogopa Yahweh
  rationale: Kitenzi ירא kimehifadhiwa kama “kuogopa” ili kubakiza maana pana ya hofu yenye uchaji na uaminifu wa kiagano; nomino imerudiwa kwa uwazi wa Kiswahili.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: mtamsujudia yeye
  rationale: “Kusujudia” huhifadhi tendo la kuinama au kujitupa chini kwa ibada; “yeye” hudumisha msisitizo wa kiwakilishi cha Kiebrania.
- source_word: וְלוֹ תִזְבָּחוּ
  choice: na kwake mtatoa dhabihu
  rationale: Huhifadhi tendo la kutoa dhabihu na msisitizo kwamba dhabihu hizo ni kwa Yahweh pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahweh” hulihifadhi wazi.
- issue: Maana ya ירא katika muktadha wa ibada ya agano
  choice: mtamwogopa
  alternative: mtamheshimu kwa uchaji; mtamcha
  rationale: “Kuogopa” huhifadhi upeo na mvutano wa neno la chanzo badala ya kulipunguza kuwa heshima au ibada pekee; tanbihi inaeleza maana yake ya kimuktadha.
- issue: Taswira ya השתחוה
  choice: mtamsujudia
  alternative: mtamwabudu; mtainama mbele yake
  rationale: Tafsiri iliyochaguliwa huhifadhi tendo la kimwili la kujinyenyekeza katika ibada bila kulifanya kuwa dhana ya jumla tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku marudio ya msisitizo, taswira ya kutoka Misri, na lugha ya ibada vikihifadhiwa.
