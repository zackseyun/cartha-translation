  text: וַֽ֠/יַּעֲבִירוּ אֶת בְּנֵי/הֶ֤ם וְ/אֶת בְּנֽוֹתֵי/הֶם֙ בָּ/אֵ֔שׁ וַ/יִּקְסְמ֥וּ קְסָמִ֖ים וַ/יְנַחֵ֑שׁוּ וַ/יִּֽתְמַכְּר֗וּ לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: sw
  text: Waliwapitisha wana wao na binti zao katika moto[a], wakafanya uaguzi na wakatafuta ishara za uaguzi, wakajiuza ili kufanya yaliyo maovu machoni pa Yahwe, ili kumkasirisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana iliyo wazi zaidi katika muktadha, “waliwatoa wana wao na binti zao kuwa dhabihu katika moto.” Nahau ya Kiebrania inasema kihalisi, “waliwapitisha ... katika moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: waliwapitisha ... motoni
  rationale: Kauli hii inadumisha nahau ya Kiebrania ya kuwafanya wapite katika moto bila kuamua katika matini kuu namna hasa ibada hiyo ilivyotekelezwa. Tanbihi inaeleza maana inayowezekana sana katika muktadha.
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: wana wao na binti zao
  rationale: Kiebrania kinataja wana na binti kwa wazi; Kiswahili hiki kinahifadhi msisitizo huo badala ya kujumlisha kwa neno “watoto.”
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: wakafanya uaguzi
  rationale: Muundo wa kitenzi na nomino yenye mzizi mmoja unaonyesha kushiriki katika uaguzi. “Kufanya uaguzi” ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: וַיְנַחֵשׁוּ
  choice: na kutafsiri ishara
  rationale: Kitenzi kinahusu kutafuta au kufasiri dalili kama ishara za mambo yajayo. Tafsiri hii ni wazi na pia inaitofautisha na neno lililotangulia la uaguzi.
- source_word: וַיִּתְמַכְּרוּ
  choice: walijiuza
  rationale: Taswira halisi ya kujileta katika hali ya utumwa kwa uovu imehifadhiwa, badala ya kuilegeza kuwa “walijitoa.”
- source_word: לַעֲשׂוֹת הָרַע
  choice: ili kufanya yaliyo maovu
  rationale: Usemi huu ni wa asili katika Kiswahili na unaonyesha kwamba walijiuza kwa kusudi la kutenda yale yaliyohesabiwa kuwa maovu.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Nahau ya Kiebrania ya tathmini mbele za Mungu imehifadhiwa kwa taswira iliyo wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo, kwa uthabiti wa mradi.
- source_word: לְהַכְעִיסוֹ
  choice: na hivyo wakamkasirisha
  rationale: 'Hii inawasilisha nguvu ya kisababishi ya kitenzi: matendo yao yalisababisha hasira ya Yahwe. Kiunganishi “na hivyo” kinaonyesha matokeo hayo kwa Kiswahili cha kawaida.'
theological_decisions:
- issue: Asili ya ibada ya kuwapitisha watoto motoni
  choice: Kudumisha nahau “waliwapitisha wana wao na binti zao motoni” katika matini kuu.
  alternative: “Waliwatoa wana wao na binti zao kuwa dhabihu motoni” au “waliwachoma motoni.”
  rationale: Muktadha mpana unaelekeza sana kwenye dhabihu ya watoto, lakini maneno ya Kiebrania yenyewe yanasema kuwafanya wapite katika moto. Matini kuu haibani maana kupita ushahidi wa kifungu; tanbihi inaeleza maana iliyo wazi zaidi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kutumia “Yahwe” kunahifadhi jina binafsi katika matini ya chanzo na kuendana na kanuni ya mradi bila kuingiza mapokeo ya dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umegawanywa ili orodha ya matendo ibaki wazi; taswira muhimu za Kiebrania, hasa “walijiuza” na “machoni pa Yahwe,” zimehifadhiwa.
