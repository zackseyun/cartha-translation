  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: sw
  text: Shalmaneseri, mfalme wa Ashuru, alimwendea kupigana naye; naye Hoshea akawa mtumishi wake[a] na akamlipa ushuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “akawa mtumishi wake”; hapa ni lugha ya kujitiisha kisiasa chini ya mfalme mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: akapanda dhidi yake
  rationale: Nahau ya Kiebrania inaeleza kusonga kijeshi dhidi ya mtu. Tafsiri hii inadumisha taswira ya kupanda bila kudai wazi kwamba shambulio kamili lilitokea.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Shalmaneseri
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Kirai hiki kinamtambulisha Shalmaneseri kwa cheo na ufalme wake.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: akawa mtumishi wake
  rationale: Muundo unaonyesha Hoshea aliingia katika hali ya kumtii Shalmaneseri kisiasa. 'Mtumishi' huhifadhi neno la msingi bila kudokeza utumwa wa kumilikiwa.
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: akamlipa ushuru
  rationale: Katika muktadha wa kisiasa, usemi huu unamaanisha kutoa malipo yanayodaiwa na mtawala mkuu.
- source_word: מִנְחָה
  choice: ushuru
  rationale: Hapa neno halimaanishi sadaka ya ibada au zawadi ya kawaida, bali malipo ya kisiasa kutoka kwa mfalme aliyetiishwa.
theological_decisions:
- issue: Maana ya עֶבֶד katika uhusiano wa wafalme
  choice: mtumishi wake
  alternative: kibaraka wake
  rationale: Maandishi yanatumia lugha ya utumishi kueleza utiifu wa kisiasa. 'Mtumishi' huhifadhi lugha hiyo, huku tanbihi ikifafanua maana ya kuwa chini ya mamlaka ya mfalme mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. 'Akapanda dhidi yake' huhifadhi nahau ya kijeshi ya chanzo; tanbihi inaeleza maana ya kisiasa ya 'mtumishi.'
