  to: Mpaka leo wanafanya kulingana na desturi za awali[a]. Hawamchi Yahweh[b], wala hawafanyi kulingana na kanuni zao na hukumu zao, wala kulingana na Torati na amri ambayo Yahweh aliwaamuru wana wa Yakobo[c], ambaye Yahweh alimpa jina Israeli[d].
