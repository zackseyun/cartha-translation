  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: sw
  text: Mpaka leo wanafanya kulingana na desturi za awali[a]. Hawamchi Yahweh[b], wala hawafanyi kulingana na kanuni zao na hukumu zao, wala kulingana na Torati na amri ambayo Yahweh aliwaamuru wana wa Yakobo[c], ambaye Yahweh alimpa jina Israeli[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulingana na taratibu za awali” au “kulingana na mazoea ya awali.”
    reason: lexical_alternative
  - marker: b
    text: “Kumcha Yahweh” pia kunaweza kusemwa “kumheshimu Yahweh kwa kicho”; nahau ya Kiebrania inahusisha hofu pamoja na heshima na uaminifu wa agano.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni “wana wa Yakobo”; hapa usemi huo unarejelea kwa pamoja watu waliotokana na Yakobo.
    reason: lexical_alternative
  - marker: d
    text: Yaani, Yahweh alimpa Yakobo jina Israeli; linganisha Mwanzo 32:28; 35:10.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: kulingana na desturi za awali
  rationale: Katika muktadha huu מִשְׁפָּטִים inaelekea kumaanisha desturi au taratibu za kidini zilizotangulia, si hukumu za mahakama. Neno “desturi” linaeleweka kwa urahisi na bado tanbihi inahifadhi maana nyingine zinazowezekana.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: hawamchi Yahweh
  rationale: “Kumcha Yahweh” ni nahau ya kawaida ya kibiblia inayoweza kujumuisha hofu, heshima kuu, na uaminifu wa agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: kulingana na masharti yao na hukumu zao
  rationale: “Masharti” yanaonyesha kanuni zilizowekwa, huku “hukumu” ikihifadhi maana ya kisheria ya מִשְׁפָּט. Viwakilishi vya wingi “yao/zao” vinahifadhiwa bila kulazimisha rejeleo lake.
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: wala kulingana na Torati na amri
  rationale: “Torati” huhifadhi uzito wa neno תּוֹרָה katika muktadha wa agano, na “amri” inadumisha umoja wa מִצְוָה. “Wala” huunganisha orodha nzima na ukanushaji uliotangulia.
- source_word: בְּנֵי יַעֲקֹב
  choice: wana wa Yakobo
  rationale: Hii ni tafsiri ya karibu ya usemi wa Kiebrania, huku tanbihi ikifafanua kuwa kundi lote la wazao wa Yakobo linakusudiwa.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: Yakobo ambaye alimpa jina Israeli
  rationale: Kauli hii inarejelea kubadilishwa kwa jina la Yakobo. Neno “Yakobo” limerudiwa kwa uwazi wa Kiswahili, bila kubadili rejeleo la Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; kwa hiyo “Yahweh” huhifadhi jina hilo moja kwa moja.
- issue: Rejeleo la “masharti yao na hukumu zao”
  choice: Kiwakilishi cha Kiebrania kimehifadhiwa bila kufafanua mwenyewe rejeleo lake
  alternative: Kuyataja wazi kuwa masharti ya watu hao au masharti ya Yahweh
  rationale: Viwakilishi vya nafsi ya tatu wingi vinaweza kujadiliwa kimuktadha. Tafsiri haiongezi nomino ambayo Kiebrania hakijaitaja, hivyo inadumisha mvutano na uwezekano wa rejeleo.
- issue: Maana ya “kumcha Yahweh”
  choice: kumcha Yahweh
  alternative: kumheshimu Yahweh
  rationale: “Kumcha” huhifadhi kwa pamoja wazo la hofu na heshima ya kiagano, badala ya kulainisha nahau kuwa heshima pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. “Torati,” “amri,” “masharti,” na “hukumu” zinadumisha sajili ya kisheria na ya agano bila kufanya sentensi kuwa nzito kupita kiasi.
