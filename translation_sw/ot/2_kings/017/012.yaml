  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: sw
  text: Wakazitumikia sanamu[a], ambazo Yahweh alikuwa amewaambia, “Msifanye jambo hili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “sanamu” ni neno la dharau kali, lenye maana inayoweza kudokeza “sanamu chafu” au “sanamu za kinyesi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: Wakaitumikia
  rationale: Kitenzi עבד kimsingi humaanisha ‘kutumikia’ na katika muktadha huu hudokeza ibada. ‘Kuzitumikia’ huhifadhi lugha ya utumishi wa kidini bila kuibadili moja kwa moja kuwa ‘kuabudu.’
- source_word: הַגִּלֻּלִים
  choice: sanamu
  rationale: Neno גִּלּוּלִים ni jina la dharau kwa sanamu za ibada. ‘Sanamu’ ni tafsiri ya kawaida na wazi katika Kiswahili; dharau kali iliyomo katika Kiebrania imeelezwa katika tanbihi.
- source_word: אֲשֶׁר
  choice: ambazo
  rationale: Kiwakilishi hiki huunganisha sanamu na amri iliyotolewa kuzihusu, kwa sintaksia ya kawaida ya Kiswahili.
- source_word: אָמַר יְהוָה לָהֶם
  choice: Yahweh alikuwa amewaambia
  rationale: Kauli hii inatangulia kitendo chao katika simulizi, hivyo wakati uliotangulia ‘alikuwa amewaambia’ unaonyesha vizuri kwamba amri ilikuwa imetolewa kabla.
- source_word: לֹא תַעֲשׂוּ
  choice: Msifanye
  rationale: Hii ni njia ya kawaida, ya moja kwa moja, na yenye nguvu ya kutoa katazo kwa wingi katika Kiswahili.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: ‘Jambo hili’ huakisi maana pana ya דָּבָר kwa kitendo au mwenendo uliokatazwa na ni lugha ya asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa katazo na sanamu
  choice: ambazo Yahweh alikuwa amewaambia, “Msifanye jambo hili”
  alternative: ambazo Yahweh alikuwa amewaambia wasizitumikie
  rationale: Muundo wa moja kwa moja wa Kiebrania umehifadhiwa bila kufafanua zaidi kwamba katazo lilihusu hasa kuzitumikia; hivyo upeo wa ‘jambo hili’ unabaki kama ulivyo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Wakaitumikia’ unaendeleza simulizi, na ‘Msifanye’ ni katazo la sasa lisilo la kizamani.
