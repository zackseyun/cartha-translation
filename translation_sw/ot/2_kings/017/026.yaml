  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: sw
  text: Basi wakamwambia mfalme wa Ashuru, “Mataifa uliyoyapeleka uhamishoni na kuyakalisha katika miji ya Samaria hayajui desturi[a] ya mungu wa nchi[b]. Kwa hiyo, amewatuma simba kati yao, na tazama, wanawaua kwa sababu hawajui desturi ya mungu wa nchi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sheria,” “takwa,” au “utaratibu uliowekwa”; hapa neno hilo linarejelea namna iliyotarajiwa ya kumwabudu mungu wa nchi.
    reason: lexical_alternative
  - marker: b
    text: Au “Mungu wa nchi.” Kiebrania kinaweza kumrejelea Mungu wa Israeli, lakini herufi ndogo katika maandishi makuu zinahifadhi mtazamo wa kipagani wa wasemaji.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Neno hili linarejelea makundi mbalimbali ya kikabila yaliyohamishwa na Ashuru; ‘mataifa’ linahifadhi maana yake ya kijamii na kisiasa bila kuingiza dhana za baadaye za kidini.
- source_word: הִגְלִיתָ
  choice: uliyoyapeleka uhamishoni
  rationale: Hili linaonyesha kuondolewa kwa lazima na kupelekwa ugenini, kama ilivyo katika kausativi ya גלה.
- source_word: וַתּוֹשֶׁב
  choice: na kuyakalisha
  rationale: Uundaji wa kausativi unaonyesha kwamba mfalme aliwafanya wakae katika eneo jipya; ‘kuyakalisha’ linaendeleza pia upatanisho na ‘mataifa’.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: katika miji ya Samaria
  rationale: Tafsiri hii ya moja kwa moja inahifadhi rejeleo la miji ya eneo la Samaria, si mji mkuu pekee.
- source_word: מִשְׁפַּט
  choice: desturi
  rationale: Katika muktadha huu neno linamaanisha utaratibu au matakwa ya ibada yanayohusishwa na mungu wa nchi. ‘Desturi’ ni ya kawaida na haifanyi maana iwe ya sheria iliyoratibiwa kupita kiasi.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: mungu wa nchi
  rationale: Herufi ndogo zinahifadhi mtazamo wa wasemaji wanaomwona Mungu wa Israeli kwa dhana ya kipagani ya mungu wa eneo fulani, bila kukana utambulisho wa anayerejelewa katika simulizi.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: Kwa hiyo, amewatuma simba kati yao
  rationale: ‘Amewatuma’ linaonyesha tendo lililotangulia lenye matokeo yanayoendelea, ‘kati yao’ linaakisi בָּם, na ‘kwa hiyo’ linaweka wazi mantiki ya sababu iliyo katika taarifa yao.
- source_word: וְהִנָּם
  choice: na tazama
  rationale: ‘Tazama’ linahifadhi nguvu ya kuvuta fikira ya הִנֵּה kwa mtindo wenye hadhi unaofahamika katika simulizi la Biblia.
- source_word: מְמִיתִים אוֹתָם
  choice: wanawaua
  rationale: Umbo la hali endelevu linaonyesha kwamba simba wanaendelea kuwaua watu hao.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: kwa sababu hawajui
  rationale: Katika muktadha huu כַּאֲשֶׁר lina nguvu ya kisababishi, ambayo ‘kwa sababu’ linawasilisha kwa uwazi.
theological_decisions:
- issue: Iwapo ‘mungu’ katika ‘mungu wa nchi’ iandikwe kwa herufi kubwa
  choice: mungu wa nchi
  alternative: Mungu wa nchi
  rationale: Kauli imenukuliwa kutoka kwa watu wanaoeleza mungu kwa mtazamo wa kipagani wa eneo. Herufi ndogo zinahifadhi mtazamo wao; herufi kubwa bado ni tafsiri inayowezekana kwa kuwa anayerejelewa katika simulizi ni Mungu wa Israeli.
- issue: Maana ya מִשְׁפַּט katika muktadha wa ibada
  choice: desturi
  alternative: sheria; takwa; utaratibu uliowekwa
  rationale: Neno linaweza kuashiria sheria au takwa, lakini hapa linahusu namna inayotarajiwa ya kumwabudu mungu wa nchi. ‘Desturi’ huhifadhi upana huo bila kuamua kwamba ni kanuni iliyoandikwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa simulizi ulio wazi na wenye hadhi. ‘Basi wakamwambia’ ni ya asili katika simulizi; ‘tazama’ huhifadhi msisitizo wa Kiebrania. Muundo wa sentensi umegawanywa kidogo ili nukuu ndefu isomeke kwa urahisi bila kupoteza uhusiano wa kisababishi.
