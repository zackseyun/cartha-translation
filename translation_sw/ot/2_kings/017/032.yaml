base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: sw
  text: Walimcha Yahwe, na wakajiwekea makuhani wa mahali pa juu kutoka miongoni mwao[a]. Makuhani hao wakawa wakiwahudumia katika nyumba za mahali pa juu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya msingi, Kiebrania husema “kutoka katika miisho yao.” Huenda nahau hii ikimaanisha kwamba walichagua watu kutoka miongoni mwa jamii yao kwa upana, bila kuzingatia sifa zinazofaa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, makuhani waliotumikia katika maeneo ya ibada za kienyeji, badala ya patakatifu pa kati.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: Walimcha Yahwe
  rationale: Kitenzi ‘kumcha’ kinahifadhi maana ya hofu yenye heshima na uaminifu wa kiibada, bila kuifasiri moja kwa moja kuwa ‘kumwabudu.’ Hivyo mvutano kati ya kumcha Yahwe na desturi zao za ibada unabaki wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la kawaida la Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo kama ‘BWANA.’
- source_word: מִקְצוֹתָם
  choice: kutoka miongoni mwao[a]
  rationale: Usemi huu kwa msingi wake unahusiana na ‘miisho’ au ‘sehemu’ zao, lakini hapa ni nahau yenye maana inayoweza kuwa kuchagua watu kutoka katika jamii yao kwa upana. Tafsiri hii ya kawaida haibani maana kuwa walikuwa watu wa tabaka la chini pekee.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: makuhani wa mahali pa juu
  rationale: Hii inadumisha istilahi ya kiibada ya kitabu cha Wafalme kwa maeneo ya ibada ya kienyeji yaliyokuwa nje ya patakatifu pa kati.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: wakajiwekea
  rationale: Katika muktadha wa kuwapa watu madaraka, עשה ina maana ya kuwaweka au kuwateua. Umbo la kujirejelea linaonyesha kwamba waliwaweka kwa ajili yao wenyewe.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: Makuhani hao wakawahudumia
  rationale: Muundo wa Kiebrania unaonyesha shughuli iliyoendelea. Kutaja tena ‘makuhani hao’ kunaweka wazi kwa Kiswahili kwamba wao ndio waliotoa huduma kwa watu, bila kuongeza aina maalumu ya tambiko.
- source_word: בְּבֵית הַבָּמוֹת
  choice: katika nyumba za mahali pa juu[b]
  rationale: Tafsiri hii inadumisha picha ya majengo ya ibada yaliyounganishwa na mahali pa juu; umoja wa Kiebrania unaweza kutumiwa kwa maana ya kijumla.
theological_decisions:
- issue: Mvutano kati ya kumcha Yahwe na ibada katika mahali pa juu
  choice: Kuunganisha matendo hayo kwa ‘na’ bila kuyapatanisha wala kuyaita unafiki moja kwa moja
  alternative: Kutumia ‘lakini,’ ‘hata hivyo,’ au kusema kwamba walidai tu kumcha Yahwe
  rationale: Kiebrania kinatumia kiunganishi cha kawaida, huku muktadha wenyewe ukionyesha mvutano. Tafsiri haiongezi hukumu kuhusu unafiki wao wala kuondoa mgongano wa kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Mahali pa juu’ limetumiwa kama istilahi ya kawaida ya kibiblia; maelezo ya chini yanafafanua maana yake ya kitamaduni.
