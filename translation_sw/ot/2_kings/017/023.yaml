base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: sw
  text: mpaka Yahwe alipoiondoa Israeli kutoka mbele zake[a], kama vile alivyokuwa amesema kupitia watumishi wake wote, manabii[b]. Hivyo Israeli ikapelekwa uhamishoni kutoka katika nchi yake kwenda Ashuru, mpaka leo hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka katika uwepo wake.” Kiebrania kihalisi ni “kutoka mbele ya uso wake,” nahau inayoonyesha kuondolewa kutoka mbele za Yahwe.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi ni “kwa mkono wa watumishi wake wote, manabii,” yaani, kupitia kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: alipoiondoa
  rationale: Kauli ya kusababisha ya kitenzi סור ina maana ya kuondoa au kufanya iondoke. “Alipoiondoa” huhifadhi nguvu hiyo bila kuongeza wazo maalumu la kufukuza.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa moja kwa moja wa jina la Mungu YHWH kwa tahajia ya kawaida ya Kiswahili.
- source_word: מֵעַל פָּנָיו
  choice: mbele zake
  rationale: Ni Kiswahili cha kawaida kinachohifadhi nahau ya Kiebrania kuhusu kuondolewa mbele ya Yahwe, bila kuamua zaidi ikiwa mkazo ni uwepo, kibali, au hukumu yake.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama vile alivyokuwa amesema
  rationale: Huwakilisha ulinganisho wa כַּאֲשֶׁר na kutimizwa kwa yale yaliyotangulia kusemwa kupitia manabii.
- source_word: בְּיַד
  choice: kupitia
  rationale: Nahau ya Kiebrania “kwa mkono wa” huonyesha wakala; “kupitia” ni ya asili katika Kiswahili, huku maana halisi ikiwekwa katika tanbihi.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: watumishi wake wote, manabii
  rationale: Huhifadhi utambulisho wa manabii kuwa watumishi wa Yahwe na pia nguvu ya “wote.”
- source_word: וַיִּגֶל
  choice: ikapelekwa uhamishoni
  rationale: Kitenzi גלה katika muktadha huu kinamaanisha kuhamishwa kwa nguvu kwenda ugenini; umoja wa kisarufi unaendana na Israeli kama taifa la pamoja.
- source_word: אַדְמָתוֹ
  choice: nchi yake
  rationale: “Nchi” huwasilisha eneo la taifa kwa Kiswahili cha kawaida kuliko “udongo,” na kiwakilishi cha umoja kinafuata Israeli kama jamii moja.
- source_word: אַשּׁוּרָה
  choice: hadi Ashuru
  rationale: Kiishio cha mwelekeo katika Kiebrania kinaonyesha kwenda Ashuru; “hadi Ashuru” huonyesha mwendo huo kwa uwazi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaolingana na fomula ya wakati ya Kiebrania.
theological_decisions:
- issue: Maana ya מֵעַל פָּנָיו katika hukumu ya Mungu
  choice: mbele zake
  alternative: kutoka katika uwepo wake
  rationale: “Mbele zake” huhifadhi taswira ya kibinafsi na ya kihukumu ya Kiebrania bila kudai kwamba Mungu hayupo mahali walipopelekwa au kufafanua kupita kiasi hali ya uhusiano wao naye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Israeli imetumiwa kama jina la taifa la pamoja, kwa hiyo upatanisho wa ngeli ya umoja umetumika. Tanbihi zote mbili zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
