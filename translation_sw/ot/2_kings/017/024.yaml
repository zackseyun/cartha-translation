id: 2KI.17.24
reference: 2 Kings 17:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: sw
  text: Kisha mfalme wa Ashuru akaleta watu kutoka Babeli, Kutha, Ava[a], Hamathi na Sefarvaimu, akawakalisha katika miji ya Samaria badala ya Waisraeli[b]. Wakaitwaa Samaria, wakaishi katika miji yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia linaweza kuandikwa Awa.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “wana wa Israeli”; yaani, watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: akaleta watu
  rationale: Hifili ya בוא ina maana ya ‘kuleta’; ‘watu’ imedokezwa na muktadha wa wakazi waliohamishwa na inahitajika kwa Kiswahili cha kawaida.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Huu ni uwasilishaji wa kawaida na wa asili wa muundo wa Kiebrania wa nomino tegemezi.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: kutoka Babeli, Kutha, Ava, Hamathi na Sefarvaimu
  rationale: Haya ni majina ya mahali; yametoholewa kwa maumbo yanayotambulika katika Kiswahili cha Biblia bila kuyatafsiri kimaana.
- source_word: וַיֹּשֶׁב
  choice: akawakalisha
  rationale: 'Hifili ya ישׁב ni ya kisababishi: mfalme aliwafanya wakae huko. ‘Akawakalisha’ huhifadhi maana hiyo kwa Kiswahili cha asili.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: katika miji ya Samaria
  rationale: Wingi ‘miji’ umehifadhiwa; hapa Samaria inaelekea kumaanisha eneo, si mji mkuu pekee.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: badala ya Waisraeli
  rationale: תַּחַת humaanisha ‘badala ya’; בְּנֵי יִשְׂרָאֵל hapa ni jina wakilishi la jamii nzima, kwa hiyo ‘Waisraeli’ ni sahihi na la kawaida kuliko ‘wana wa Israeli’ katika Kiswahili.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: Wakaitwaa Samaria
  rationale: Katika muktadha wa uhamishaji na umilikaji wa eneo, ירשׁ humaanisha kutwaa au kumiliki; ‘wakaitwaa’ ni fupi na huhifadhi nguvu ya kitendo.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: wakaishi katika miji yake
  rationale: Qali ya ישׁב hapa ni ‘kuishi/kukaa’; kiambishi cha umoja wa kike kinarejelea Samaria.
theological_decisions:
- issue: Usemi wa kikabila wenye umbo la kiume בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli; watu wa Israeli
  rationale: Ingawa umbo halisi ni ‘wana wa Israeli,’ katika muktadha huu linawakilisha jamii ya Israeli kwa ujumla, si wanaume peke yao. ‘Waisraeli’ huhifadhi maana ya kikabila bila kuongeza dai la kijinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa leo. Viunganishi vya ‘aka-’ vimetumiwa kuonyesha mfululizo wa matendo. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
