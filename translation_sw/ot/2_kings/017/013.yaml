  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: sw
  text: Hata hivyo, Yahwe aliionya Israeli na Yuda[a] kupitia kila nabii wake na kila mwonaji, akisema, “Geukeni kutoka katika njia zenu mbaya, nanyi mshike amri zangu na kanuni zangu, kulingana na sheria yote niliyowaamuru baba zenu[b] na niliyowapelekea kupitia watumishi wangu, manabii[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alishuhudia dhidi ya Israeli na Yuda.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoa onyo zito au ushuhuda dhidi ya mtu.
    reason: lexical_alternative
  - marker: b
    text: “Baba zenu” hapa inaweza pia kumaanisha “mababu zenu” au “wahenga wenu.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “kwa mkono wa watumishi wangu, manabii”; maana yake ni “kupitia watumishi wangu, manabii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: aliionya
  rationale: Katika kausativi, kitenzi hiki kina maana ya kutoa onyo au ushuhuda mzito. ‘Aliionya’ ni Kiswahili cha kawaida kinachofaa mwito unaofuata na muktadha wa hukumu, huku uwezekano wa ‘kushuhudia dhidi ya’ ukitajwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo.
- source_word: בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: Israeli na Yuda
  rationale: Muundo huu unawataja waliolengwa na onyo bila kulazimisha maana finyu ya kihusishi cha Kiebrania.
- source_word: בְּיַד כָּל נְבִיאוֹ כָּל חֹזֶה
  choice: kupitia kila mmoja wa manabii wake na kila mwonaji
  rationale: ‘Kupitia’ huwasilisha nahau ya chombo בְּיַד kwa Kiswahili cha asili; ‘kila mmoja ... na kila’ huhifadhi msisitizo wa ugawaji, na ‘mwonaji’ hubaki tofauti na ‘nabii’.
- source_word: חֹזֶה
  choice: mwonaji
  rationale: Neno hili humaanisha mtu anayeona maono na hutofautishwa hapa na neno la kawaida la ‘nabii’.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: Geukeni, mziache njia zenu mbaya
  rationale: שׁוּב ni kugeuka au kurudi. Muundo wa Kiswahili ‘geukeni, mziache’ unaonyesha wazi kuondoka katika mwenendo mbaya bila kutumia moja kwa moja istilahi pana zaidi ya kitheolojia ‘tubuni’.
- source_word: וְשִׁמְרוּ
  choice: na mzishike
  rationale: Katika muktadha wa agano na sheria, שׁמר ni kutunza au kushika kwa utiifu; ‘mzishike’ ni wazi na ya kawaida kwa amri.
- source_word: מִצְוֺתַי חֻקּוֹתַי
  choice: amri zangu na masharti yangu
  rationale: 'Tafsiri hii inadumisha istilahi mbili tofauti za kisheria: amri zilizoagizwa na masharti yaliyowekwa.'
- source_word: כְּכָל הַתּוֹרָה
  choice: kwa kufuata sheria yote
  rationale: Katika muktadha huu תּוֹרָה ni mafundisho yenye mamlaka ya agano; ‘sheria yote’ huonyesha כָּל na husomeka kwa kawaida.
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבֹתֵיכֶם
  choice: niliyowaamuru baba zenu
  rationale: ‘Baba zenu’ huhifadhi taswira ya kihistoria ya אָבוֹת, huku tanbihi ikifafanua kuwa maana inaweza kuwa mababu au wahenga kwa ujumla.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: na niliyowapelekea kupitia watumishi wangu, manabii
  rationale: Muundo huu unaunganisha kishazi rejeshi na ‘sheria yote’ bila maelezo ya ziada, na ‘kupitia’ huwasilisha tena nahau ya Kiebrania ya uwasilishaji kwa mkono wa wajumbe.
theological_decisions:
- issue: Kirejelewa cha ‘niliyowapelekea’
  choice: Kishazi kimeunganishwa kisarufi na ‘sheria yote,’ hivyo sheria au mafundisho ya agano ndiyo yaliyowapelekea kupitia manabii.
  alternative: Kishazi kinaweza kueleweka kwa upana kuwa kinarejelea ujumbe wa kinabii, au mwito mzima wa kugeuka na kushika amri.
  rationale: Mfuatano wa Kiebrania unaunga mkono kurejelea ‘sheria,’ lakini tafsiri haiongezi ufafanuzi unaofunga kabisa uwezekano mpana wa ujumbe wa kinabii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Yahwe,’ ‘nabii,’ ‘mwonaji,’ ‘amri,’ na ‘sheria’ huhifadhi msamiati muhimu wa kifungu; sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili bila kufuta marudio na tofauti za istilahi za Kiebrania.
