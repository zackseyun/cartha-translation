base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: sw
  text: Walikuwa wakimcha Yahwe[a], lakini waliitumikia miungu yao wenyewe, kufuatana na desturi za mataifa ambayo walikuwa wamehamishwa kutoka humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walikuwa wakimcha Yahwe na kuitumikia miungu yao.” Kiunganishi cha Kiebrania ni “na”; hapa kimetafsiriwa “lakini” ili kuweka wazi ukinzani unaoonekana katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo ‘BWANA’.
- source_word: הָיוּ יְרֵאִים
  choice: walikuwa wakimcha
  rationale: Muundo wa היה pamoja na participle unaonyesha tendo la kawaida au linaloendelea; ‘walikuwa wakimcha’ huhifadhi maana hiyo na hofu yenye staha.
- source_word: אֱלֹהֵיהֶם
  choice: miungu yao wenyewe
  rationale: Kiambishi cha umilikaji kimehifadhiwa, na ‘wenyewe’ kinaweka wazi utofauti na Yahwe bila kuongeza dai jipya.
- source_word: הָיוּ עֹבְדִים
  choice: waliitumikia
  rationale: עבד katika muktadha wa miungu humaanisha huduma ya kidini au ibada; ‘tumikia’ ndiyo inayokaribia zaidi kitenzi cha Kiebrania.
- source_word: כְּמִשְׁפַּט
  choice: kufuatana na desturi
  rationale: Hapa מִשְׁפָּט inarejelea desturi au mwenendo uliozoeleka, si hukumu ya kisheria.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Neno linarejelea makundi ya kitaifa ambayo watu hawa walitoka; ‘mataifa’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: ambayo walikuwa wamehamishwa kutoka humo
  rationale: Kauli tendwa ya Kiswahili inawasilisha vizuri maana isiyotaja wazi wahamishaji; ‘wamehamishwa’ huonyesha uhamisho wa kulazimishwa bila kulazimisha neno la kiufundi.
theological_decisions:
- issue: Nguvu ya kimkinzano kati ya kumcha Yahwe na kuitumikia miungu mingine
  choice: lakini
  alternative: na
  rationale: Kiebrania kina kiunganishi cha kawaida ‘na’, ambacho katika muktadha kinaweza kubeba ukinzani. ‘Lakini’ huonyesha wazi mvutano wa ibada iliyochanganywa, huku tanbihi ikihifadhi uwezekano wa tafsiri ya kimuundo ya ‘na’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘walikuwa waki-’ umetumiwa kwa tendo la kawaida; lugha imewekwa wazi kwa msomaji wa kawaida bila kufuta utata wa kiunganishi cha Kiebrania.
