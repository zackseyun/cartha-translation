  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: tendo la kawaida/endelevu la kumcha Yahwe na kutumikia miungu yao, desturi ya mataifa, na uhamisho kutoka mataifa hayo. Kauli tendwa ya “walikuwa wamehamishwa” huwasilisha kwa usahihi mtendaji asiyeelezwa wazi katika kifungu hiki.'
