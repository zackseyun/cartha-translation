  terminology: “Yahwe” ni utohozi unaokubalika wa jina la Mungu katika Kiswahili. “Kumcha,” “kuitumikia,” “miungu,” “desturi,” “mataifa,” na “kuhamishwa” zinahifadhi maneno na maana muhimu bila kuingiza tafsiri ya kimafundisho. “Lakini” hutoa kwa kawaida ukinzani unaodokezwa na muktadha, huku tanbihi ikihifadhi kiunganishi cha msingi “na.”
