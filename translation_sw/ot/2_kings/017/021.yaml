  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: sw
  text: Kwa maana Israeli ilijitenga na nyumba ya Daudi[a], nao wakamtawaza Yeroboamu mwana wa Nebati kuwa mfalme; Yeroboamu akaipotosha Israeli, ikaacha kumfuata Yahwe, akawafanya watende dhambi kubwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “ilijirarua kutoka kwa nyumba ya Daudi.” Kitenzi cha Kiebrania kinatumia taswira ya kurarua kueleza mgawanyiko huo wa kisiasa.
    reason: lexical_metaphor
  - marker: b
    text: Au, “akaifukuza Israeli mbali na kumfuata Yahwe.” Kitenzi cha Kiebrania kinaweza kumaanisha kufukuza au kuongoza kando na njia, yaani kupotosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע
  choice: ilijitenga
  rationale: Kitenzi hiki kwa msingi humaanisha ‘rarua,’ lakini hapa kinaeleza kujitenga kisiasa kwa Israeli na nasaba ya Daudi. ‘Ilijitenga’ ni Kiswahili cha kawaida na wazi; taswira halisi imehifadhiwa katika tanbihi.
- source_word: מֵעַל בֵּית דָּוִד
  choice: na nyumba ya Daudi
  rationale: Kirai hiki kinaonyesha kujiondoa chini ya mamlaka ya nasaba ya Daudi. Katika Kiswahili, ‘kujitenga na nyumba ya Daudi’ huwasilisha maana hiyo kwa ufasaha bila kuongeza maelezo yasiyokuwapo wazi katika matini.
- source_word: וַיַּמְלִיכוּ
  choice: wakamtawaza ... kuwa mfalme
  rationale: Hifili ya מלך ina maana ya kumsimika mtu atawale. ‘Kumtawaza kuwa mfalme’ ni usemi wa kawaida unaohifadhi maana hiyo ya kisababishi.
- source_word: וַיַּדַּח
  choice: akaipotosha
  rationale: Kitenzi נדח kinaweza kueleza kufukuza au kuongoza pembeni na hivyo kupotosha. Katika muktadha wa kuiacha njia ya Yahwe, ‘akaipotosha’ ni fasiri ya asili, huku uwezekano wa maana yenye nguvu zaidi ukielezwa katika tanbihi.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: ikaacha kumfuata Yahwe
  rationale: Nahau ya Kiebrania ‘kutoka nyuma ya Yahwe’ humaanisha kuacha kumfuata. Fasiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la uaminifu kwa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
- source_word: וְהֶחֱטֵיאָם
  choice: akawasababisha watende
  rationale: Hifili ya חטא ni ya kisababishi. ‘Akawasababisha watende’ inaonyesha wazi kwamba Yeroboamu aliwasukuma watu wa Israeli kwenye dhambi na pia inaepuka kurudia neno ‘dhambi’ kama kitenzi na nomino.
- source_word: חֲטָאָה גְדוֹלָה
  choice: dhambi kubwa
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino na kivumishi, inayosisitiza uzito wa kosa bila kuingiza maelezo ya ziada.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina binafsi la Mungu, יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jukumu la Yeroboamu katika uasi wa Israeli
  choice: akaipotosha Israeli ... na akawasababisha watende dhambi
  alternative: Israeli iliacha kumfuata Yahwe na kutenda dhambi
  rationale: Miundo ya kisababishi katika וַיַּדַּח na וְהֶחֱטֵיאָם inamweka Yeroboamu wazi kuwa wakala aliyewaongoza watu katika uasi, bila kuondoa uwajibikaji wao wenyewe.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida na hadhi inayofaa matini ya Biblia. ‘Nyumba ya Daudi’ imehifadhiwa kama usemi wa kibiblia unaomaanisha nasaba ya Daudi; majina yametolewa kwa maumbo yaliyozoeleka ya Kiswahili: Israeli, Yeroboamu, Nebati, na Yahwe.'
