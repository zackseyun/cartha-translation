base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: sw
  text: Walisimamisha kwa ajili yao wenyewe nguzo za ibada na vitu vya ibada vya Ashera[a] juu ya kila kilima kirefu na chini ya kila mti wenye majani mabichi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Maashera”; neno la Kiebrania linarejelea vitu vya ibada vilivyohusishwa na Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ לָהֶם
  choice: Walijisimamishia
  rationale: Huwasilisha tendo la kusimamisha vitu pamoja na maana ya לָהֶם kwamba walifanya hivyo kwa matumizi yao wenyewe, kwa Kiswahili cha kawaida na kifupi.
- source_word: מַצֵּבוֹת
  choice: nguzo za ibada
  rationale: Neno hili humaanisha mawe yaliyosimamishwa kama vitu vya ibada. Nyongeza 'za ibada' huzuia kueleweka kama nguzo za kawaida bila kufafanua dhehebu fulani.
- source_word: וַאֲשֵׁרִים
  choice: nguzo za Ashera
  rationale: Hutaja vitu vya ibada vilivyohusishwa na Ashera, huku ikihifadhi uhusiano wa jina hilo na kutowafanya moja kwa moja kuwa mungu wa kike mwenyewe.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: juu ya kila kilima kirefu
  rationale: Tafsiri ya moja kwa moja na ya asili ya mahali palipotajwa katika Kiebrania.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: na chini ya kila mti wenye majani mabichi
  rationale: רַעֲנָן hueleza mti uliositawi, wenye majani mabichi. Kauli hii ni wazi na ya kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Tafsiri ya אֲשֵׁרִים
  choice: nguzo za Ashera
  alternative: Maashera; sanamu za Ashera
  rationale: Wingi wa Kiebrania unaelekea kutaja vitu vya ibada vinavyohusishwa na Ashera, lakini umbo na aina yake kamili havijulikani kwa hakika. Tafsiri kuu inafikika kwa msomaji, na tanbihi huhifadhi kutokuwa na uhakika huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. 'Walijisimamishia' huhifadhi maana ya kujifanyia; 'nguzo za ibada' hutofautisha mawe ya ibada na nguzo za kawaida. Tanbihi huhifadhi jina la wingi la Kiebrania na utata wa aina halisi ya vitu hivyo.
