  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: sw
  text: Waisraeli wakafanya kwa siri mambo yasiyofaa dhidi ya Yahwe Mungu wao[a]. Wakajijengea maeneo ya juu ya ibada[b] katika miji yao yote, kuanzia mnara wa walinzi hadi mji wenye ngome[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wakaficha mambo yasiyofaa kumhusu Yahwe Mungu wao.” Kitenzi cha Kiebrania ni nadra; kinaweza kumaanisha kuficha mambo au kutenda kwa siri.
    reason: lexical_alternative
  - marker: b
    text: “Maeneo ya juu ya ibada” yalikuwa maeneo ya ibada ya kienyeji, ambayo mara nyingi yalihusishwa na ibada isiyoruhusiwa.
    reason: cultural_note
  - marker: c
    text: Usemi “kuanzia mnara wa walinzi hadi mji wenye ngome” unaonyesha maeneo yote, kutoka kituo kidogo cha ulinzi hadi mji ulioimarishwa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: wakafanya kwa siri
  rationale: Kitenzi hiki cha Kiebrania ni nadra na kinaweza kumaanisha kutenda kwa siri au kuficha. Katika muktadha huu, “wakafanya kwa siri” ni Kiswahili cha kawaida na kinaonyesha kwamba walitenda mambo hayo kwa kujificha bila kuondoa uwezekano wa maana ya kufunika au kuficha.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: mambo yasiyofaa
  rationale: Kauli ya Kiebrania ni ya kimethali; tafsiri ya neno kwa neno, “mambo ambayo hayakuwa hivyo,” haingeeleweka vizuri. “Mambo yasiyofaa” huhifadhi hukumu ya kimaadili bila kubainisha matendo hayo zaidi ya chanzo.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: dhidi ya Yahwe Mungu wao
  rationale: Katika muktadha wa uasi na ibada isiyoruhusiwa, עַל ina nguvu ya upinzani. “Dhidi ya” huiwasilisha wazi, huku “Mungu wao” ikihifadhi uhusiano wa agano unaosisitizwa na maandishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: wakajijengea mahali pa juu pa ibada
  rationale: “Wakajijengea” huonyesha לָהֶם, yaani walijitengenezea vituo hivyo wenyewe. “Mahali pa juu pa ibada” huhifadhi istilahi ya kidini בָּמוֹת na wakati huohuo humsaidia msomaji kuelewa kwamba ni maeneo ya ibada, si miinuko ya kawaida tu.
- source_word: בְּכָל עָרֵיהֶם
  choice: katika miji yao yote
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi cha mahali, bila kupunguza wigo wake.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: kuanzia mnara wa walinzi
  rationale: נוֹצְרִים humaanisha walinzi au watu wanaokesha. “Mnara wa walinzi” ni usemi wa kawaida unaoonyesha kituo kidogo cha ulinzi.
- source_word: עַד עִיר מִבְצָר
  choice: hadi mji wenye ngome
  rationale: Kishazi hiki kinakamilisha usemi unaojumuisha maeneo ya kila aina, kutoka kituo kidogo hadi mji ulioimarishwa. “Mji wenye ngome” ni Kiswahili cha asili na sahihi kwa עִיר מִבְצָר.
theological_decisions:
- issue: Uzito wa kimaadili wa matendo ya siri ya Israeli
  choice: Mstari unaeleza matendo halisi yasiyofaa ambayo Waisraeli waliyafanya kwa siri dhidi ya Yahwe, Mungu wao.
  alternative: Kitenzi hicho kinaweza pia kueleweka kuwa walificha mambo yasiyofaa yanayomhusu Yahwe, huku mkazo ukiwa katika kuyafunika kuliko kuyatenda kwa siri.
  rationale: Kitenzi nadra, nomino “mambo,” na maelezo yanayofuata kuhusu kujenga mahali pa juu pa ibada yanaelekeza kwenye matendo ya ibada potovu. Tafsiri kuu huhifadhi siri na uasi, na tanbihi huhifadhi uwezekano halisi wa maana ya kuficha.
- issue: Maana ya עַל kuhusiana na Yahwe
  choice: dhidi ya Yahwe
  alternative: kumhusu Yahwe
  rationale: Muktadha mpana wa kuvunja agano unaunga mkono maana ya upinzani, lakini tafsiri mbadala ya “kumhusu” inabaki inawezekana kisarufi na imehusishwa na utata wa kitenzi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye heshima na unaosomeka kwa urahisi. Sentensi zimegawanywa mara mbili ili kuzuia msongamano. Istilahi ya kitamaduni “mahali pa juu” imehifadhiwa na kufafanuliwa kwa “pa ibada” pamoja na tanbihi.
