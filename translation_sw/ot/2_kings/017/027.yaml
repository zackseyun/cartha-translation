base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: sw
  text: Ndipo mfalme wa Ashuru akaamuru, akisema, “Mpelekeni huko[a] mmoja wa makuhani mliowapeleka uhamishoni kutoka huko[b]. Aende akaishi huko[c], naye awafundishe desturi[d] ya mungu wa nchi hiyo[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mleteni huko” au “Mtumeni huko.”
    reason: lexical_alternative
  - marker: b
    text: Au “mliowahamisha kwa nguvu kutoka huko.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kina vitenzi vya wingi hapa, yaani “waende” na “wakaishi,” ingawa muktadha unaelekeza kwa umoja: “mmoja wa makuhani” na baadaye “awafundishe.”'
    reason: textual_variant
  - marker: d
    text: Au “sheria” au “matakwa.”
    reason: lexical_alternative
  - marker: e
    text: Au “Mungu wa nchi hiyo.” Herufi ndogo katika “mungu” inaonyesha mtazamo wa msemaji Mwashuru.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: akaamuru
  rationale: Kitenzi צוה kina maana ya kutoa amri; “akaamuru” kinahifadhi uzito wa amri ya kifalme na kinaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa muundo wa Kiebrania unaotaja cheo na nchi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni fomula ya Kiebrania inayotanguliza maneno ya moja kwa moja; “akisema” ni ya asili katika simulizi la Kiswahili.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: Mpelekeni huko
  rationale: Hifili ya הלך humaanisha kumsababisha mtu aende; katika amri hii “mpelekeni huko” inaonyesha kuhamishwa kwa kuhani bila kuamua kupita kiasi kama ni ‘kumleta’ au ‘kumtuma.’
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: mmoja wa makuhani
  rationale: Huu ni muundo wa sehemu ya kundi, unaowasilishwa kwa kawaida kwa “mmoja wa.”
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: mliowapeleka uhamishoni kutoka huko
  rationale: Hifili ya גלה hapa inahusu kuhamisha watu kwa nguvu na kuwapeleka ugenini; “kuwapeleka uhamishoni” ni wazi na sahihi katika muktadha wa kihistoria.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: Aende akaishi huko
  rationale: Ingawa maumbo ya Kiebrania ni ya wingi, kitangulizi chake ni ‘mmoja wa makuhani,’ na kitenzi kinachofuata ni cha umoja. Kiswahili kinatumia umoja ili kuwasilisha maana inayokusudiwa, huku tanbihi ikihifadhi hitilafu ya kisarufi.
- source_word: וְיֹרֵם
  choice: naye awafundishe
  rationale: Hifili ya ירה inaweza kumaanisha kufundisha au kuelekeza, na kiambishi cha yambwa kinaonyesha watu wengi wanaofundishwa.
- source_word: מִשְׁפַּט
  choice: desturi
  rationale: Katika muktadha huu neno linahusu utaratibu au matakwa ya ibada yanayodhaniwa kuhusiana na mungu wa eneo, si lazima sheria iliyoandikwa kwa maana finyu.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: mungu wa nchi hiyo
  rationale: Usemi huo unaonyesha mtazamo wa mfalme wa Ashuru kuhusu mungu wa eneo fulani. Herufi ndogo huhifadhi mtazamo huo, na “hiyo” huifanya rejeo la nchi lisikike kwa kawaida kwa Kiswahili.
theological_decisions:
- issue: Iwapo אֱלֹהֵי הָאָרֶץ iandikwe “mungu wa nchi hiyo” au “Mungu wa nchi hiyo”
  choice: mungu wa nchi hiyo
  alternative: Mungu wa nchi hiyo
  rationale: Maneno ya mfalme yanaakisi dhana ya kipagani kwamba kila nchi ina mungu wake wa eneo. Herufi ndogo huhifadhi mtazamo wa msemaji bila kukana kwamba simulizi kwa upana linamhusu Mungu wa Israeli.
- issue: Kutolingana kwa idadi katika וְיֵלְכוּ / וְיֵשְׁבוּ na kitangulizi cha umoja
  choice: 'Maana ya umoja: “Aende akaishi huko”'
  alternative: 'Kudumisha wingi wa kimofolojia: “Waende wakaishi huko”'
  rationale: “Mmoja wa makuhani” na וְיֹרֵם ya umoja zinaonyesha kuwa kuhani mmoja ndiye anayekusudiwa. Umoja unatoa maana iliyo wazi kwa Kiswahili, huku tanbihi ikitaja maumbo ya wingi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Ashuru,” “makuhani,” na “uhamishoni” ni maneno yanayoeleweka katika sajili ya Biblia bila kuwa ya kizamani. Muundo wa sentensi umefanywa wa asili kwa Kiswahili huku urudiaji wa “huko” ukihifadhi uhusiano wa mahali uliopo katika Kiebrania.
