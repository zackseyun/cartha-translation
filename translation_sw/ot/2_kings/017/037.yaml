id: 2KI.17.37
reference: 2 Kings 17:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: sw
  text: Na kanuni, hukumu, sheria na amri[a] ambazo aliwaandikia, mtazishika na kuzitenda siku zote[b]; wala msiogope miungu mingine[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maagizo, maamuzi ya kisheria, mafundisho na amri.” Kiebrania kinatumia pamoja maneno kadhaa ya sheria ya agano, yenye maana zinazokaribiana lakini zenye tofauti fulani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaunganisha wazo la kushika au kuzingatia na lile la kutenda au kutekeleza.
    reason: lexical_alternative
  - marker: c
    text: Hapa “kuogopa” kunaweza kumaanisha kuwapa miungu heshima ya kidini, utii au ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: masharti
  rationale: Neno hili linaonyesha kanuni au maagizo yaliyowekwa rasmi; “masharti” linadumisha maana ya kisheria bila kulichanganya na maneno mengine katika orodha.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: “Hukumu” linaakisi maamuzi au masharti ya kimahakama na kutofautisha neno hili na sheria kwa ujumla.
- source_word: הַתּוֹרָה
  choice: sheria
  rationale: Ingawa תּוֹרָה pia linaweza kumaanisha “mafundisho,” katika orodha hii ya masharti ya agano “sheria” linafaa na linaeleweka kwa urahisi.
- source_word: הַמִּצְוָה
  choice: amri
  rationale: Umoja wa Kiebrania umehifadhiwa kwa neno la umoja “amri,” lenye uzito unaofaa katika muktadha wa kisheria.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: ambazo aliwaandikia
  rationale: Tafsiri hii inadumisha mtendaji wa nafsi ya tatu bila kuongeza wazi jina “BWANA,” ambalo linaeleweka kutokana na muktadha.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: mtazishika na kuwa waangalifu kuzitenda
  rationale: 'Kauli hii inabeba vipengele vyote viwili vya Kiebrania: kuzihifadhi au kuzizingatia, na kuzitekeleza kwa vitendo.'
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayowasilisha maana ya kudumu ya usemi halisi “siku zote.”
- source_word: תִירְאוּ
  choice: msiogope
  rationale: “Kuogopa” linahifadhi maana ya msingi ya kitenzi, huku muktadha ukionyesha kuwa hofu hiyo inahusisha heshima na utii wa kidini.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya deities wengine mbali na BWANA.
theological_decisions:
- issue: Kudumisha maneno manne ya sheria ya agano
  choice: masharti, hukumu, sheria na amri
  alternative: sheria na amri
  rationale: Kiebrania kinakusanya kwa makusudi istilahi nne zinazokaribiana lakini zisizofanana kabisa; kuzihifadhi kunadumisha uzito wa balagha na upeo wa wajibu wa agano.
- issue: Mtendaji katika kauli “ambazo aliwaandikia”
  choice: Kudumisha nafsi ya tatu “ali-” bila kutaja jina
  alternative: ambazo BWANA aliwaandikia
  rationale: Muktadha unamtambulisha mtendaji kuwa BWANA, lakini mstari huu wenyewe una kitenzi chenye mtendaji aliyedokezwa tu; kutolitaja jina huepuka kuongeza nomino isiyopo katika matini.
- issue: Maana ya “kuogopa” miungu mingine
  choice: msiogope, pamoja na tanbihi inayoeleza maana ya kidini
  alternative: msiiabudu miungu mingine
  rationale: “Kuabudu” pekee kungefafanua maana kwa njia finyu kuliko Kiebrania, ambacho kinaweza kujumuisha hofu, heshima ya kidini na utii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa orodha mwanzoni unadumisha mkazo wa Kiebrania; semikoloni inatenganisha wajibu chanya na katazo.
