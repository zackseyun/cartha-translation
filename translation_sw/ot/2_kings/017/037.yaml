  rationale: The revision uses 'kanuni' for prescribed statutes and removes the added phrase 'kuwa waangalifu,' preserving the Hebrew pairing of keeping/observing and doing. It also restores the initial connective 'Na,' which suits the verse's continuing discourse. Footnote markers remain attached to the relevant terms and clauses.
