base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: sw
  text: Lakini kila taifa liliendelea kutengeneza miungu yake, na likaweka miungu hiyo katika nyumba za ibada za mahali pa juu ambazo watu wa Samaria[a] walikuwa wamejenga, kila taifa katika miji yake ambamo liliishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wasamaria.”
    reason: Tafsiri mbadala ya הַשֹּׁמְרֹנִים; inaweza kutafsiriwa kwa jina la moja kwa moja, ingawa “watu wa Samaria” huepuka dhana za baadaye za kidini.
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: liliendelea kujitengenezea
  rationale: Muundo wa היה pamoja na kitenzi-shirikishi unaonyesha tendo la desturi au lililoendelea katika simulizi la wakati uliopita. Kauli hii inahifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: גּוֹי גּוֹי
  choice: kila taifa
  rationale: 'Kurudiwa kwa nomino kuna maana ya ugawaji: kila kundi la kitaifa lilitenda kivyake.'
- source_word: אֱלֹהָיו
  choice: miungu yake
  rationale: Wingi wa 'miungu' na umilikaji wa kila taifa umehifadhiwa bila kuongeza maelezo ya kitheolojia.
- source_word: וַיַּנִּיחוּ
  choice: kuweka
  rationale: Kitenzi kinamaanisha kuweka au kuacha kitu mahali; 'kuweka' ni wazi na cha kawaida katika muktadha huu.
- source_word: בְּבֵית הַבָּמוֹת
  choice: katika nyumba za ibada za mahali pa juu
  rationale: Kauli hii inaeleza majengo ya ibada yaliyoambatana na mahali pa juu. 'Nyumba za ibada' ni ya kueleweka kuliko tafsiri sisisi 'nyumba ya mahali pa juu,' huku ikihifadhi uhusiano na mahali pa juu.
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: ambazo watu wa Samaria walikuwa wamejenga
  rationale: '''Watu wa Samaria'' huonyesha wakazi wa eneo au mji huo bila kulazimisha maana ya baadaye ya kundi la kidini; wakati timilifu wa Kiswahili unaonyesha kwamba majengo hayo yalitangulia kuwekwa kwa miungu.'
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: katika miji yao walimoishi
  rationale: Tafsiri hii inahifadhi kiambishi cha umilikaji na kutaja wazi miji ambayo mataifa hayo yaliishi.
theological_decisions:
- issue: Maana ya הַשֹּׁמְרֹנִים
  choice: watu wa Samaria
  alternative: Wasamaria
  rationale: Katika mazingira haya ya kihistoria neno linaweza kuelekeza kwa wakazi wa Samaria. Chaguo hili huepuka kuingiza bila ulazima utambulisho wa baadaye wa kidini, huku mbadala wa moja kwa moja ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kurudia ‘kila taifa’ umehifadhiwa ili kuonyesha nguvu ya ugawaji katika Kiebrania. Alama ya tanbihi imewekwa mara moja baada ya kirai kinachohusika.
