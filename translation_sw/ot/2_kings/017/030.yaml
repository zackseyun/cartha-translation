  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: sw
  text: Watu wa Babeli walitengeneza Sukoth-benothi[a], watu wa Kuthi wakatengeneza Nergali, nao watu wa Hamathi wakatengeneza Ashima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sukoth-benothi huenda ni jina la mungu wa kigeni au kitu cha ibada. Maana ya jina hilo haijulikani kwa hakika, kwa hiyo limetoholewa badala ya kutafsiriwa.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: watu wa
  rationale: Ingawa umbo la Kiebrania ni wingi wa kiume, katika muktadha huu linawataja wakazi wa kila mahali kwa ujumla. Kiswahili cha kawaida hutumia “watu wa”; “wanaume wa” kingeweza kueleweka kuwa kinawatenga wanawake bila ulazima wa kimuktadha.
- source_word: עָשׂוּ
  choice: walitengeneza / wakatengeneza
  rationale: Kitenzi עשה kimsingi ni “kutengeneza/kufanya.” “Walitengeneza” kinahifadhi usemi wa chanzo bila kuongeza kwamba waliziweka au walizifanya kuwa miungu.
- source_word: סֻכּוֹת בְּנוֹת
  choice: Sukoth-benothi
  rationale: Jina hili lenye maana isiyo na uhakika limetoholewa badala ya kutafsiriwa kwa kubahatisha; tahajia imeboreshwa ili isomeke kwa kawaida katika Kiswahili.
- source_word: כּוּת
  choice: Kuthi
  rationale: Jina la mahali limetoholewa kwa mfumo unaosomeka kwa Kiswahili.
- source_word: נֵרְגַל
  choice: Nergali
  rationale: Jina la mungu wa Mesopotamia limetoholewa, si kutafsiriwa.
- source_word: חֲמָת
  choice: Hamathi
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֲשִׁימָא
  choice: Ashima
  rationale: Jina la mungu wa kigeni limehifadhiwa kwa utohozi bila kulipa tafsiri ya kubahatisha.
theological_decisions:
- issue: Iwapo vitu vya עָשׂוּ vitajwe wazi kuwa sanamu au miungu
  choice: Majina yametoholewa bila kuongeza “sanamu” au “mungu” katika matini kuu.
  alternative: Watu wa Babeli walitengeneza sanamu ya Sukoth-benothi; au walimfanya Sukoth-benothi kuwa mungu wao.
  rationale: Kiebrania kinasema tu “walitengeneza” kikifuatiwa na majina. Kuongeza “sanamu” au “mungu” kungeliweka wazi jambo linalodokezwa na muktadha, lakini kungezidi maneno ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Watu wa” ni cha kawaida na cha kijumla kuliko “wanaume wa.” Mfuatano wa vitenzi umetumia “walitengeneza ... wakatengeneza ... wakatengeneza” ili sentensi itiririke kwa kawaida huku ikihifadhi urudiaji wa Kiebrania.
