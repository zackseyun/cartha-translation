  edition: WLC
  text: וַ/יִּהְי֣וּ הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֶת פְּסִֽילֵי/הֶ֖ם הָי֣וּ עֹֽבְדִ֑ים גַּם בְּנֵי/הֶ֣ם וּ/בְנֵ֣י בְנֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עָשׂ֤וּ אֲבֹתָ/ם֙ הֵ֣ם עֹשִׂ֔ים עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: sw
  text: Basi mataifa hayo yalikuwa yakimcha Yahwe, lakini yalikuwa yakizitumikia sanamu zao za kuchongwa.[a] Watoto wao pia, na watoto wa watoto wao, wanafanya kama walivyofanya baba zao, mpaka leo hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu zao.” Neno la Kiebrania linarejelea hasa sanamu zilizotengenezwa kwa kuchonga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Basi ... walikuwa
  rationale: “Basi” linaonyesha hitimisho la simulizi, huku “walikuwa” pamoja na vitenzi vya hali endelevu likionyesha desturi iliyoendelea.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: mataifa hayo
  rationale: Kirai hiki kinarejelea makundi ya kigeni yaliyowekwa Samaria; “mataifa hayo” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: walikuwa wakimcha Yahwe
  rationale: “Kumcha Yahwe” huhifadhi nahau ya kidini ya Kiebrania, na muundo wa “walikuwa wakimcha” unaonyesha hali au desturi iliyoendelea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וְאֶת פְּסִילֵיהֶם
  choice: lakini pia ... sanamu zao za kuchonga
  rationale: פְּסִילִים ni sanamu za ibada zilizotengenezwa kwa kuchonga. “Lakini pia” huonyesha wazi mvutano wa kimuktadha kati ya kumcha Yahwe na kuzitumikia sanamu bila kudai kwamba kiunganishi cha Kiebrania chenyewe ni cha upinzani.
- source_word: הָיוּ עֹבְדִים
  choice: walikuwa wakitumikia
  rationale: Muundo huu unaonyesha tendo la kawaida na linaloendelea. “Kutumikia” huhifadhi upana wa עבד kuliko kulifasiri moja kwa moja kuwa “kuabudu.”
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: Watoto wao na watoto wa watoto wao pia
  rationale: Hii huhifadhi urudiaji wa vizazi katika Kiebrania na kueleweka kwa urahisi kama kurejelea wazao.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: kama walivyofanya baba zao
  rationale: Tafsiri hii huhifadhi ulinganisho na msisitizo wa mababu uliomo katika maandishi ya Kiebrania.
- source_word: הֵם עֹשִׂים
  choice: wanafanya
  rationale: Wakati wa sasa unaonyesha kwamba desturi hiyo iliendelea wakati wa mwandishi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayolingana na fomula ya wakati ya Kiebrania.
theological_decisions:
- issue: Kumcha Yahwe huku wakitumikia sanamu
  choice: 'Kudumisha kauli zote mbili: “walikuwa wakimcha Yahwe, lakini pia walikuwa wakitumikia sanamu zao za kuchonga.”'
  alternative: Kusema kwamba walijifanya tu kumcha Yahwe, au kwamba walimwabudu Yahwe kwa uaminifu pamoja na sanamu.
  rationale: Kiebrania kinataja matendo yote mawili bila kuamua wazi kama hofu yao ilikuwa ya kweli, ya nje tu, au ya mchanganyiko wa dini. Tafsiri haiongezi hukumu ambayo mstari wenyewe hauisemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Watoto wa watoto wao” limehifadhiwa badala ya “wajukuu” ili kuonyesha kwa karibu mwendelezo wa vizazi katika Kiebrania.
