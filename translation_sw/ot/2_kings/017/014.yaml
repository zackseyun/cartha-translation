base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: sw
  text: Lakini hawakusikiliza; wakashupaza shingo zao kama shingo za baba zao, ambao hawakumwamini[a] Yahweh Mungu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakumtumaini Yahweh Mungu wao.” Kitenzi cha Kiebrania kinaweza kumaanisha kuamini au kutumaini katika uhusiano wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  choice: Lakini hawakukubali kusikiliza
  rationale: Kiunganishi kinaonyesha utofautishaji na maonyo yaliyotangulia. Ingawa שׁמע kimsingi ni ‘kusikia/kusikiliza,’ katika muktadha huu inaashiria kukataa kwa makusudi; ‘hawakukubali kusikiliza’ huwasilisha upinzani huo bila kuibadili moja kwa moja kuwa ‘kutotii.’
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: wakashupaza shingo zao
  rationale: Hii ni nahau ya ukaidi inayohifadhi taswira halisi ya Kiebrania ya kuifanya shingo kuwa ngumu, huku ‘kushupaza shingo’ ikiwa usemi wa Kiswahili unaoeleweka.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: kama baba zao
  rationale: Katika Kiswahili, baada ya ‘wakashupaza shingo zao,’ kulinganisha na ‘baba zao’ huendeleza kwa kawaida kitendo na taswira ileile bila marudio mazito ya ‘kama shingo za baba zao.’
- source_word: הֶאֱמִינוּ בַּיהוָה
  choice: hawakumwamini Yahweh
  rationale: Hiphil ya אמן pamoja na ב inaweza kumaanisha kumwamini au kumtumaini mtu. ‘Kumwamini’ hufuata muundo wa Kiebrania kwa karibu, huku maana mbadala ya ‘kumtumaini’ ikiwekwa katika tanbihi.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Kirai hiki kinahifadhi wazi uhusiano wa agano unaomtambulisha Yahweh kuwa Mungu wao.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya הֶאֱמִינוּ katika uhusiano na Yahweh
  choice: hawakumwamini
  alternative: hawakumtumaini
  rationale: Maana zote mbili zina msingi wa kileksika. Maandishi makuu yanatumia ‘kumwamini,’ na tanbihi inahifadhi uwezekano wa maana ya kutumaini katika uhusiano wa agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakashupaza shingo zao’ ni nahau inayoeleweka na inayohifadhi taswira ya Kiebrania; sentensi imeepuka lugha ya kidhehebu.
