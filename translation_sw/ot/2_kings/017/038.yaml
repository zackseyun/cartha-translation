  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: sw
  text: Nanyi msilisahau agano nililofanya nanyi,[a] wala msiogope miungu mingine.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “agano nililokata nanyi.” Hii ni nahau ya Kiebrania yenye maana ya kufanya au kuanzisha agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala msiiche miungu mingine.” Neno la Kiebrania linaweza pia kueleza hofu yenye heshima au utii wa kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִית
  choice: agano
  rationale: Katika muktadha wa uhusiano wa Mungu na watu wake, neno hili linaonyesha ahadi na wajibu wa kudumu, si makubaliano ya kawaida tu.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: nililofanya nanyi
  rationale: Kiebrania husema kihalisi ‘nililokata nanyi,’ lakini ‘kufanya agano’ ndiyo nahau ya asili na inayoeleweka katika Kiswahili.
- source_word: לֹא תִשְׁכָּחוּ
  choice: msilisahau
  rationale: Muundo huu unatoa katazo kwa watu wengi; ‘msilisahau’ huhifadhi sauti ya agizo kwa Kiswahili cha kawaida.
- source_word: וְלֹא תִירְאוּ
  choice: wala msiiche
  rationale: ‘Kuogopa/kucha’ hapa huhusisha hofu yenye heshima na utiifu wa kidini. ‘Kucha’ huhifadhi maana hiyo ya kiagano bila kuifanya iwe hofu ya kihisia tu.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hili ni tafsiri ya moja kwa moja ya miungu mingine isipokuwa Mungu wa Israeli, na linahifadhi kauli ya kiagano ya uaminifu wa pekee.
theological_decisions:
- issue: Nahau ya kufanya agano
  choice: agano nililofanya nanyi
  alternative: agano nililokata nanyi
  rationale: Tafsiri iliyochaguliwa huwasilisha kwa kawaida tendo la kuanzisha agano, huku tanbihi ikihifadhi picha halisi ya Kiebrania.
- issue: Nguvu ya makatazo
  choice: msilisahau ... wala msiiche
  alternative: hamtalisahau ... wala hamtaiogopa
  rationale: Katika muktadha huu miundo ya Kiebrania inafanya kazi kama makatazo. Kiswahili cha hali ya kutegemea kilichokanushwa huonyesha agizo hilo kwa uwazi bila kugeuza maneno kuwa utabiri.
- issue: Maana ya ירא kuhusu miungu mingine
  choice: msiiche
  alternative: msiiogope au msiiabudu
  rationale: ‘Kucha’ huweza kujumuisha hofu yenye heshima na utii wa kidini. ‘Kuabudu’ pekee kungepunguza upana wa neno, na ‘kuogopa’ pekee kunaweza kueleweka kama woga wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Nanyi’ hudumisha muunganiko wa aya na yaliyotangulia; ‘wala’ huunganisha makatazo mawili kwa kawaida. Viambishi vya wingi vinaonyesha kwamba agizo linaelekezwa kwa jumuiya.
