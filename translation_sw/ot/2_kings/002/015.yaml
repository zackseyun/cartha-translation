source:
  edition: WLC
  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: sw
  text: Wanafunzi wa manabii waliokuwa Yeriko walipomwona kwa mbali[a], wakasema, “Roho ya Eliya[b] imetulia juu ya Elisha.” Kisha wakaenda kumlaki, wakainama hadi nchi mbele yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakiwa upande wa pili, mkabala naye.” Msemo wa Kiebrania huonyesha kuwa mtu yuko mkabala au anaonekana kutoka upande mwingine, mara nyingi kwa umbali fulani.
    reason: lexical_alternative
  - marker: b
    text: “Roho ya Eliya” hapa inarejelea roho au uwezeshaji wa kinabii wa Eliya, ambao sasa wanatambua kuwa umetulia juu ya Elisha.
    reason: cross_reference
  - marker: c
    text: Au “wakajilaza kifudifudi mbele yake.” Ishara hii inaonyesha heshima na kujitiisha; si lazima iwe ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: Wanafunzi wa manabii
  rationale: Ingawa kwa neno moja moja ni ‘wana wa manabii,’ msemo huu wa Kiebrania hutaja washiriki wa jumuiya ya kinabii; ‘wanafunzi wa manabii’ ni Kiswahili cha sasa kinachoeleweka bila kuwafanya waonekane kuwa watoto wao wa kuzaa.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: waliokuwa Yeriko
  rationale: Hulitambulisha kundi la kinabii lililokuwapo Yeriko; muundo huu ni wa kawaida na wa asili katika simulizi la Kiswahili.
- source_word: מִנֶּגֶד
  choice: kwa mbali
  rationale: Katika muktadha huu neno linaonyesha kuwa walikuwa upande wa pili au mahali walipoweza kumwona kutoka mbali. ‘Kwa mbali’ ni ya asili, huku tanbihi ikihifadhi maana ya nafasi iliyo mkabala.
- source_word: נָחָה
  choice: imetulia
  rationale: 'Kauli timilifu inaonyesha hali iliyotokea na sasa inayotambuliwa: roho hiyo imetua na kukaa juu ya Elisha.'
- source_word: רוּחַ אֵלִיָּהוּ
  choice: Roho ya Eliya
  rationale: Tafsiri ya moja kwa moja inahifadhi uwezekano wa maana ya roho au uwezeshaji wa kinabii wa Eliya bila kuingiza maelezo ya ziada ndani ya mstari.
- source_word: עַל אֱלִישָׁע
  choice: juu ya Elisha
  rationale: Kihusishi עַל pamoja na רוּחַ huonyesha roho ikitulia juu ya mtu; ‘juu ya’ huhifadhi picha hiyo ya Kiebrania.
- source_word: לִקְרָאתוֹ
  choice: kumlaki
  rationale: Nahau hii ina maana ya kwenda kukutana na mtu anayekuja; ‘kumlaki’ ni fupi, ya heshima, na ya kawaida katika simulizi.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: wakainama mpaka chini mbele yake
  rationale: Hueleza tendo la kuinama au kujilaza kuelekea ardhini mbele ya Elisha. Maneno haya yanaonyesha ishara ya heshima bila kuamua kimakosa kwamba walimwabudu kama Mungu.
theological_decisions:
- issue: Maana ya ‘Roho ya Eliya’
  choice: Kauli imeachwa kuwa ‘Roho ya Eliya,’ huku tanbihi ikieleza uwezekano wa roho au uwezeshaji wake wa kinabii sasa kutambuliwa katika Elisha.
  alternative: Kusema kwamba nafsi binafsi ya Eliya ilihamia ndani ya Elisha.
  rationale: Muktadha wa 2 Wafalme 2:9, 15 unahusu mwendelezo na uwezeshaji wa kinabii. Tafsiri haipaswi kudai uhamisho wa nafsi, lakini pia haipaswi kubadili msemo wa maandiko kuwa ufafanuzi pekee.
- issue: Aina ya heshima waliyoonyesha Elisha
  choice: Tendo limeelezwa kama kuinama mpaka chini mbele yake, yaani heshima na kujitiisha kwa mamlaka yake ya kinabii.
  alternative: Kutafsiri tendo hilo moja kwa moja kuwa ibada ya kidini kwa Elisha.
  rationale: Kitenzi cha Kiebrania kinaweza kutaja kusujudu mbele ya Mungu au kuinama kwa heshima mbele ya mwanadamu kulingana na muktadha. Hapa muktadha unaonyesha kumtambua Elisha kuwa mrithi wa kinabii wa Eliya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wanafunzi wa manabii’ huepuka dhana isiyokusudiwa ya watoto wa kuzaa, ‘kumlaki’ hudumisha mtiririko wa simulizi, na ‘wakainama mpaka chini’ huwasilisha tendo la kimwili bila kulipa maana ya ibada isiyolazimishwa na muktadha.
