base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: sw
  text: Walipokwisha kuvuka, Eliya akamwambia Elisha, “Niombe nifanye nini kwa ajili yako kabla sijachukuliwa kutoka kwako.” Elisha akasema, “Tafadhali, na fungu maradufu[a] la roho yako[b] iwe juu yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafungu mawili.” Nahau ya Kiebrania inamaanisha fungu maradufu, na huenda inadokeza fungu la urithi la mzaliwa wa kwanza.
    reason: lexical_alternative
  - marker: b
    text: “Roho yako” inahusu roho au uwezeshaji unaohusishwa na huduma ya Eliya kama nabii. Wengine huelewa ombi hili kuwa la kupata nguvu za kinabii mara mbili ya zile za Eliya.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: Baada ya wao kuvuka
  rationale: Kitenzi hiki kinawahusu Eliya na Elisha pamoja na kinaonyesha kuwa kuvuka kulitangulia mazungumzo. Kauli hii ni ya kawaida katika Kiswahili na inaweka wazi mfuatano wa matukio.
- source_word: שְׁאַל
  choice: Omba
  rationale: Ni amri ya moja kwa moja yenye maana ya kuomba jambo; “omba” ni rahisi na ya asili katika muktadha huu.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: unachotaka nikufanyie
  rationale: Kauli hii inaeleza nafasi aliyopewa Elisha ya kutaja ombi ambalo Eliya angemfanyia. Tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai mapema kuwa ombi hilo litatimizwa.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: kabla sijachukuliwa kutoka kwako
  rationale: 'Umbo la Kiebrania ni la kutendwa: Eliya ndiye atakayechukuliwa. “Kutoka kwako” huhifadhi wazo la kutenganishwa kwao.'
- source_word: וִיהִי נָא
  choice: Tafadhali, ... na iwe
  rationale: נָא hulainisha ombi, na umbo la ombi katika וִיהִי linawasilishwa kwa kawaida kwa “na iwe.”
- source_word: פִּי שְׁנַיִם
  choice: sehemu maradufu
  rationale: Hii ni nahau inayomaanisha fungu au sehemu maradufu na huenda inadokeza fungu la urithi la mzaliwa wa kwanza. “Sehemu maradufu” ni wazi huku ikihifadhi mwangwi huo.
- source_word: בְּרוּחֲךָ
  choice: ya roho yako
  rationale: Kiambishi cha umilikaji kinamhusu Eliya. Herufi ndogo na kutoongeza neno “ya kinabii” huepuka kulazimisha ufafanuzi wa kiteolojia usiotajwa moja kwa moja.
- source_word: אֵלָי
  choice: iwe juu yangu
  rationale: Ingawa maana ya msingi ni “kwangu,” kauli “iwe juu yangu” ni ya kawaida katika muktadha wa roho au uwezeshaji unaomjia mtu.
theological_decisions:
- issue: Maana ya ombi la פִּי שְׁנַיִם בְּרוּחֲךָ
  choice: Elisha anaomba sehemu maradufu ya roho ya Eliya, huenda kwa kutumia lugha ya fungu la urithi la mzaliwa wa kwanza.
  alternative: Elisha anaomba nguvu za kinabii zilizo mara mbili ya zile za Eliya.
  rationale: Nahau ya Kiebrania kimsingi huelekea kumaanisha fungu maradufu. Tafsiri haibadili ombi hilo kuwa dai dhahiri la kuwa na nguvu mara mbili kuliko Eliya.
- issue: Roho inayotajwa katika “roho yako”
  choice: Ni roho au uwezeshaji wa kinabii unaohusishwa na Eliya, bila kuufafanua zaidi katika matini.
  alternative: Maneno hayo yanamtaja moja kwa moja Roho Mtakatifu kwa maana mahsusi ya nafsi ya Utatu.
  rationale: Kiwakilishi “yako” huelekeza kwenye kile kilicho cha Eliya au kinachomtambulisha. Kudumisha “roho yako” huhifadhi upana wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo wa ombi umehifadhiwa bila kuongeza istilahi za kimadhehebu.
