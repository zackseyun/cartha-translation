  text: וֶ/אֱלִישָׁ֣ע רֹאֶ֗ה וְ/ה֤וּא מְצַעֵק֙ אָבִ֣/י אָבִ֗/י רֶ֤כֶב יִשְׂרָאֵל֙ וּ/פָ֣רָשָׁ֔י/ו וְ/לֹ֥א רָאָ֖/הוּ ע֑וֹד וַֽ/יַּחֲזֵק֙ בִּ/בְגָדָ֔י/ו וַ/יִּקְרָעֵ֖/ם לִ/שְׁנַ֥יִם קְרָעִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: sw
  text: Elisha alikuwa akitazama, naye alikuwa akipaza sauti, “Baba yangu, baba yangu! Gari la vita la Israeli na wapanda farasi wake!”[a] Kisha hakumwona tena. Akazishika nguo zake mwenyewe na akazirarua vipande viwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Gari la vita la Israeli na wapanda farasi wake.” Huenda kilio cha Elisha kinamtambulisha Eliya kuwa nguvu na ulinzi wa kweli wa Israeli, au kinarejelea gari na farasi wa mbinguni anaowaona.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאֶה
  choice: alikuwa akitazama
  rationale: Kauli ya kushiriki inaonyesha tendo lililokuwa likiendelea; tafsiri hii inadumisha hali ya Elisha kuendelea kutazama tukio.
- source_word: מְצַעֵק
  choice: alikuwa akilia kwa sauti
  rationale: Kauli ya kushiriki inaonyesha tendo endelevu lenye msukumo wa kihisia; ‘kulia kwa sauti’ ni Kiswahili cha kawaida kisichosisitiza kupita kiasi ukubwa wa sauti.
- source_word: אָבִי אָבִי
  choice: Baba yangu, baba yangu!
  rationale: Urudiaji na kiambishi cha nafsi ya kwanza umoja vimehifadhiwa ili kuonyesha uhusiano wa karibu na uzito wa hisia, si lazima ubaba wa kimwili.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Gari la vita la Israeli na wapanda farasi wake
  rationale: ‘Gari’ limewekwa katika umoja na ‘wapanda farasi’ katika wingi, kama ilivyo katika Kiebrania; kiwakilishi ‘wake’ kinahifadhi kiambishi cha umoja bila kufafanua kwa lazima kile kinachorejelewa.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: Kisha hakumwona tena
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba Elisha aliacha kabisa kumwona.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: Akazishika nguo zake mwenyewe
  rationale: ‘Kuzishika’ hutoa maana ya kushika kwa makusudi, na ‘mwenyewe’ huweka wazi kwamba zilikuwa nguo za Elisha katika tendo la maombolezo.
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: na kuzirarua vipande viwili
  rationale: Tafsiri hii ni ya kawaida na wazi kwa Kiswahili, huku ikihifadhi matokeo ya kuzigawa nguo katika sehemu mbili.
theological_decisions:
- issue: Maana ya kilio, ‘Baba yangu, baba yangu! Gari la vita la Israeli na wapanda farasi wake!’
  choice: Maneno yametafsiriwa moja kwa moja kama mshangao bila kuyaeleza katika aya yenyewe.
  alternative: Huenda Elisha anamwita Eliya nguvu na ulinzi wa kweli wa Israeli, au anarejelea gari na farasi wa mbinguni anaowaona.
  rationale: Kiebrania kinaruhusu maana zote mbili. Kutafsiri sitiari moja kwa moja na kueleza uwezekano katika tanbihi kunahifadhi utata halisi na mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida, huku hali endelevu ya vitenzi vya mwanzo, urudiaji wa kilio, na utata wa sitiari vikihifadhiwa.
