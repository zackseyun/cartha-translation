base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: sw
  text: Wanaume hamsini miongoni mwa wana wa manabii[a] wakaenda, wakasimama mkabala nao[c] kwa mbali[b], huku hao wawili wakiwa wamesimama kando ya Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa manabii,” jina la kundi lililotambulika la watu waliohusishwa na huduma ya kinabii.
    reason: cultural_note
  - marker: b
    text: Au “kutoka mbali.”
    reason: lexical_alternative
  - marker: c
    text: Au “wakikabiliana nao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: Watu hamsini
  rationale: Muundo huu unamaanisha watu wa kiume hamsini; katika Kiswahili, “watu hamsini” ni usemi wa kawaida kuliko “wanaume hamsini” katika muktadha huu, bila kubadili idadi au kurejelea kundi tofauti.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: kutoka miongoni mwa wana wa manabii
  rationale: “Wana wa manabii” huhifadhi taswira halisi ya Kiebrania na jina la kundi lililohusishwa na huduma ya kinabii; tanbihi inaeleza maana yake ya kitamaduni.
- source_word: הָלְכוּ
  choice: wakaenda
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoendeleza mfuatano wa matukio.
- source_word: וַיַּעַמְדוּ
  choice: wakasimama
  rationale: Hutafsiri עמד kwa urahisi na bila kuongeza wazo la kujipanga au kusimama kwa msisitizo.
- source_word: מִנֶּגֶד
  choice: kuelekeana nao
  rationale: Huonyesha mahali pa kukabiliana au kuwa upande unaoelekeana nao, huku tanbihi ikihifadhi uwezekano wa “upande wa pili kutoka kwao.”
- source_word: מֵרָחוֹק
  choice: mbali
  rationale: Ni Kiswahili cha kawaida na wazi kinachoonyesha utengano wa kimahali.
- source_word: וּשְׁנֵיהֶם
  choice: huku hao wawili
  rationale: Huhifadhi rejeo la wazi kwa wale wawili, Eliya na Elisha, na kuonyesha tukio linalofanyika wakati kundi la hamsini likiwa mbali.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: wakiwa wamesimama kando ya Yordani
  rationale: Katika muktadha wa mto, עַל ina maana ya kuwa karibu au kandokando yake, si juu ya maji.
