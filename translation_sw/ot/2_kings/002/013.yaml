  text: Akaliinua joho la Eliya[a], lililoanguka kutoka kwake, akarudi, akasimama ukingoni mwa Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vazi la nje.” Neno la Kiebrania linamaanisha vazi la nje lenye kutambulika.
