lexical_decisions:
- source_word: וַיָּרֶם
  choice: akalinyanyua
  rationale: Kitenzi רום kina wazo la kuinua; katika muktadha huu kinaeleza Eliya akilichukua vazi lililoanguka, na “akalinyanyua” huhifadhi tendo hilo halisi kwa Kiswahili cha kawaida.
- source_word: אַדֶּרֶת
  choice: joho
  rationale: Neno hili linamaanisha vazi la nje lenye kutambulika. “Joho” ni neno la sasa na linaloeleweka, huku maelezo ya chini yakifafanua aina ya vazi.
- source_word: אֵלִיָּהוּ
  choice: Eliya
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: lililoanguka kutoka kwake
  rationale: Usemi huu unadumisha maana kwamba joho lilitoka kwa Eliya na kuanguka, bila kuongeza maelezo yasiyosemwa katika Kiebrania.
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: שׁוב hapa inaeleza kurudi au kugeuka na kwenda nyuma; “akarudi” ni fupi na ya kawaida katika simulizi.
- source_word: וַיַּעֲמֹד
  choice: kusimama
  rationale: Neno hili linatoa moja kwa moja tendo la kusimama; limeunganishwa kwa kawaida na kitenzi kilichotangulia.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: ukingoni mwa Yordani
  rationale: שׂפה ni ukingo wa sehemu ya maji; “ukingoni mwa Yordani” ni usemi wa asili na unaohifadhi jina la mto kama lilivyo katika chanzo.
