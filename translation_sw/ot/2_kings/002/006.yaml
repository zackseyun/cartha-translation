id: 2KI.2.6
reference: 2 Kings 2:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: sw
  text: Kisha Eliya akamwambia, “Tafadhali baki hapa, kwa maana Yahwe amenituma kwenda Yordani[a].” Lakini Elisha akasema, “Kama Yahwe aishivyo, na kama wewe mwenyewe uishivyo[b], sitakuacha.” Basi wakaendelea wote wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda kwenye Mto Yordani.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa Kiebrania huu ni mfumo wa kiapo: “Kama Yahwe aishivyo, na kama uhai wako uishivyo, ikiwa nitakuacha…,” yaani, “Hakika sitakuacha.” Laana ambayo ingempata mvunja-kiapo haikutamkwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: Tafadhali baki
  rationale: Kitenzi ישׁב kinaweza kumaanisha kuketi, kukaa au kubaki. Katika muktadha huu Eliya anamwomba Elisha asiondoke mahali hapo, hivyo “baki” ndilo neno la kawaida na sahihi; נָא imewasilishwa kwa “tafadhali.”
- source_word: פֹה
  choice: hapa
  rationale: Ni kielezi cha mahali kinachotafsiriwa kwa kawaida na kwa uwazi kuwa “hapa.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: שְׁלָחַנִי
  choice: amenituma
  rationale: Kauli timilifu inaonyesha agizo ambalo tayari limetolewa na bado linaongoza safari ya Eliya; “amenituma” ni usemi wa Kiswahili wa asili.
- source_word: הַיַּרְדֵּנָה
  choice: kwenda Yordani
  rationale: Kiambishi cha mwelekeo -ה kinaonyesha mwendo kuelekea Yordani. Jina hilo linaweza kumaanisha mto wenyewe au eneo linalohusishwa nao, hivyo “Yordani” linahifadhi ufupi na kiasi cha utata wa Kiebrania.
- source_word: חַי יְהוָה
  choice: Kama Yahwe aishivyo
  rationale: Huu ni mfumo wa kiapo unaotaja uhai wa Yahwe. Tafsiri hii inadumisha muundo na uzito wa kiapo kwa Kiswahili kinachoeleweka.
- source_word: וְחֵי נַפְשְׁךָ
  choice: na kama wewe mwenyewe uishivyo
  rationale: Neno נֶפֶשׁ hapa linarejelea uhai wa mtu anayeambiwa, si lazima sehemu tofauti iitwayo “roho.” “Wewe mwenyewe” huwasilisha msisitizo wa kiapo bila kuingiza dhana ya uwili wa nafsi na mwili.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: sitakuacha
  rationale: 'Katika kiapo hiki אִם inaanzisha laana iliyoachwa bila kutamkwa, na maana yake ya kimatumizi ni kukataa kwa nguvu: “sitakuacha.” Tafsiri ya moja kwa moja “ikiwa nitakuacha” ingekuwa pungufu na ingeweza kupotosha.'
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: Basi wakaendelea wote wawili
  rationale: Maneno haya yanasisitiza kwamba Eliya na Elisha waliendelea na safari pamoja. “Wote wawili” huhifadhi msisitizo huo, na “wakaendelea” hufaa muktadha wa safari inayoendelea.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina binafsi la Mungu badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Maana ya נֶפֶשׁ katika mfumo wa kiapo
  choice: wewe mwenyewe uishivyo
  alternative: roho yako iishivyo; maisha yako yalivyo hai
  rationale: Katika kifungu hiki נֶפֶשׁ humaanisha mtu au uhai wake ndani ya mfumo wa kiapo. Uamuzi huu huepuka kufanya mstari utoe dai lisilokusudiwa kuhusu muundo wa mwanadamu, huku ukihifadhi msisitizo binafsi wa Kiebrania.
- issue: Kiapo chenye אִם na laana isiyotamkwa
  choice: sitakuacha
  alternative: ikiwa nitakuacha…
  rationale: Kiebrania kinaacha matokeo ya kuvunja kiapo bila kutamkwa. Kiswahili cha moja kwa moja kinaweza kuonyesha nguvu yake kwa kukataa kwa dhati, huku tanbihi ikihifadhi muundo halisi na mvutano wa kiapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Tafadhali baki,” “amenituma,” na “wakaendelea wote wawili” ni miundo ya sasa na ya asili. Mfumo wa kiapo umehifadhiwa kwa kiasi kikubwa, huku maana yake ikifafanuliwa katika tanbihi.
