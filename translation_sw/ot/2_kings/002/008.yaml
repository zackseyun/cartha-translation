  text: וַ/יִּקַּח֩ אֵלִיָּ֨הוּ אֶת אַדַּרְתּ֤/וֹ וַ/יִּגְלֹם֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֵּחָצ֖וּ הֵ֣נָּה וָ/הֵ֑נָּה וַ/יַּעַבְר֥וּ שְׁנֵי/הֶ֖ם בֶּ/חָרָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: sw
  text: Ndipo Eliya akachukua vazi lake la nje[a], akaliviringisha, akayapiga maji; maji yakagawanyika upande huu na upande ule[b], na wote wawili wakavuka katika nchi kavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joho lake.” Kiebrania kinamaanisha vazi la nje la Eliya.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “yakagawanyika huku na huku,” yaani kuelekea pande mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: vazi lake la nje
  rationale: Neno אַדֶּרֶת hapa linamaanisha vazi la nje la Eliya. Usemi huu ni wazi kwa msomaji wa kisasa na haubani maana kuwa aina moja maalumu ya vazi.
- source_word: וַיִּגְלֹם
  choice: akalikunja
  rationale: Kitenzi kinaeleza kulikusanya au kuliviringisha vazi ili litumike kupigia maji. “Akalikunja” ni cha kawaida na kinaeleweka bila kuongeza maelezo yasiyomo.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: akayapiga maji
  rationale: Kitenzi נכה kina maana ya kupiga; umbo hili linahifadhi nguvu na uwazi wa tendo katika Kiswahili cha kawaida.
- source_word: וַיֵּחָצוּ
  choice: yakagawanyika
  rationale: Kitenzi cha Kiebrania ni cha wingi na kinarejelea maji. Tafsiri hii inahifadhi tukio na hali ya kutenganishwa bila kulifafanua kiasili.
- source_word: הֵנָּה וָהֵנָּה
  choice: upande huu na upande ule
  rationale: Usemi huu unaonyesha maji kutengana kuelekea pande mbili zinazokabiliana; Kiswahili hiki ni wazi kuliko tafsiri ya moja kwa moja “hapa na hapa.”
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: wote wawili wakavuka
  rationale: Huhifadhi mkazo wa שְׁנֵיהֶם kwamba Eliya na Elisha wote wawili walivuka.
- source_word: בֶּחָרָבָה
  choice: katika nchi kavu
  rationale: חָרָבָה katika simulizi la kuvuka maji hueleza sehemu kavu iliyowezesha kuvuka. Usemi huu ni wa asili na unaendeleza mwangwi wa matukio mengine ya Biblia.
- source_word: וַיִּקַּח
  choice: Ndipo Eliya akalichukua
  rationale: “Ndipo” pamoja na mfululizo wa vitenzi vya -ka- huwasilisha mwendelezo wa matendo ya simulizi kwa Kiswahili sanifu.
theological_decisions:
- issue: Kugawanyika kwa maji kwa njia ya muujiza
  choice: 'Tukio limesimuliwa moja kwa moja: Eliya aliyapiga maji, yakagawanyika, nao wakavuka katika nchi kavu.'
  alternative: Kutumia maneno yanayolifanya tukio kuwa la kawaida kiasili au kuongeza ufafanuzi wa namna muujiza ulivyotokea.
  rationale: Kiebrania kinasimulia wazi tukio la muujiza bila kueleza utaratibu wake. Tafsiri inalihifadhi hivyo bila kulipunguza wala kulipamba kwa maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi kupitia “ndipo” na vitenzi vya -ka-. Lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida; “vazi la nje” limechaguliwa badala ya istilahi isiyo ya kawaida, huku “joho” likihifadhiwa kama mbadala katika tanbihi.
