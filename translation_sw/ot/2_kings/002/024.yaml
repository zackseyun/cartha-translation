base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: sw
  text: Akageuka, akawaona, akawalaani kwa jina la BWANA. Ndipo dubu wawili wa kike wakatoka msituni na kuwararua vijana arobaini na wawili kati yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: akawalaani
  rationale: Kitenzi cha Kiebrania קלל katika muktadha huu humaanisha kutamka laana; “akawalaani” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la BWANA
  rationale: Huhifadhi maana ya kutenda kwa kulitia jina la Mungu; “BWANA” linafuata desturi pana ya Kiswahili ya kuwakilisha Tetragramatoni.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: dubu wawili wa kike
  rationale: Namba ya kike inaonyesha wazi kuwa dubu hao wawili walikuwa wa kike; Kiswahili huhitaji usemi wa ufafanuzi.
- source_word: וַתְּבַקַּעְנָה
  choice: kuwararua
  rationale: Mzizi בקע una wazo la kupasua au kurarua; katika shambulio la wanyama, “kuwararua” ni asilia na huhifadhi ukali bila kudai kwamba wote waliuawa.
- source_word: יְלָדִים
  choice: vijana
  rationale: Neno linaweza kumaanisha watoto, wavulana, au vijana kulingana na muktadha. “Vijana” huhifadhi upana unaofaa na kuepuka kudai umri mdogo usiohakikishwa.
theological_decisions:
- issue: Asili na mamlaka ya laana
  choice: akawalaani kwa jina la BWANA
  alternative: akawaita laana katika jina la BWANA
  rationale: Tafsiri inahifadhi kauli ya simulizi bila kuongeza kwamba Elisha alitenda kwa hasira binafsi au kwamba Mungu aliidhinisha kila undani kwa maelezo yasiyomo katika aya.
- issue: Matokeo ya shambulio
  choice: kuwararua
  alternative: kuwaua
  rationale: Kiebrania kinaeleza kujeruhi kwa kupasua, si kwa uwazi kifo cha vijana wote arobaini na wawili; hivyo tafsiri haiongezi hitimisho la kifo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa matukio na ukali wa simulizi umehifadhiwa. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
