  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: sw
  text: Ikawa, Yahwe alipokuwa karibu kumchukua Eliya kwenda juu mbinguni[b] kwa kisulisuli[a], Eliya na Elisha wakaondoka Gilgali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kisulisuli,” au “katika dhoruba.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mbingu”; hapa limetafsiriwa “mbinguni” kama usemi wa kawaida wa Kiswahili katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya masimulizi inayoanzisha tukio jipya. “Ikawa” ni ya heshima na ya kawaida katika simulizi la Biblia bila kuongeza neno la wakati lisilokuwamo wazi katika Kiebrania.
- source_word: בְּהַעֲלוֹת
  choice: alipokuwa karibu kumchukua ... juu
  rationale: Muundo wa kitenzi-jina pamoja na בְּ unaonyesha wakati wa tukio. Muktadha unaonyesha tukio lililokuwa karibu kutokea, huku “juu” ikihifadhi wazi mwelekeo wa עלה.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֶת אֵלִיָּהוּ
  choice: Eliya
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בַּסְעָרָה
  choice: kwa upepo wa kisulisuli
  rationale: סְעָרָה inaweza kumaanisha dhoruba, tufani, au upepo wa kisulisuli. Hapa “upepo wa kisulisuli” ni usemi wa asili unaofaa muktadha; kihusishi בְּ kimeelezwa kwa “kwa,” kikionyesha njia au mazingira ya kupandishwa.
- source_word: הַשָּׁמָיִם
  choice: hadi mbinguni
  rationale: Ingawa umbo la Kiebrania ni la wingi, “mbinguni” ni usemi wa kawaida wa Kiswahili kwa mahali au mwelekeo unaokusudiwa hapa.
- source_word: וַיֵּלֶךְ
  choice: wakaondoka
  rationale: הלך inasimulia mwendo wao kutoka mahali fulani. “Wakaondoka” huunganika kiasili na “Gilgali” na kuonyesha kuanza au kuendelea kwa safari.
- source_word: וֶאֱלִישָׁע
  choice: na Elisha
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מִן הַגִּלְגָּל
  choice: Gilgali
  rationale: Pamoja na kitenzi “wakaondoka,” maana ya מן ya kuonyesha mahali walikotoka imewasilishwa kiasili bila kulazimika kuongeza “kutoka.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa הַשָּׁמָיִם itafsiriwe kama “mbingu” au “mbinguni”
  choice: hadi mbinguni
  alternative: hadi kwenye mbingu
  rationale: Umbo la Kiebrania linaweza kurejelea anga au mbingu, lakini “hadi mbinguni” ni Kiswahili cha kawaida katika muktadha huu wa kupandishwa. Uamuzi huu haukusudii kutatua mada ya kikosmolojia.
- issue: Maana ya בְּ katika בַּסְעָרָה
  choice: kwa upepo wa kisulisuli
  alternative: katika upepo wa kisulisuli
  rationale: Kihusishi kinaweza kueleweka kuwa cha njia (“kwa”) au mazingira (“katika”). Matini kuu inatumia “kwa,” huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Ikawa” huhifadhi mtindo wa kisimulizi; mpangilio wa sentensi umewekwa wa asili katika Kiswahili. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
