  text: וַ/יְהִ֗י הֵ֣מָּה הֹלְכִ֤ים הָלוֹךְ֙ וְ/דַבֵּ֔ר וְ/הִנֵּ֤ה רֶֽכֶב אֵשׁ֙ וְ/ס֣וּסֵי אֵ֔שׁ וַ/יַּפְרִ֖דוּ בֵּ֣ין שְׁנֵי/הֶ֑ם וַ/יַּ֨עַל֙ אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: sw
  text: Ikawa, walipokuwa wakiendelea kutembea huku wakizungumza, tazama, gari la moto na farasi wa moto vikawatenganisha hao wawili[b]; naye Eliya akapaa kwa kisulisuli[a] mpaka mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya kisulisuli.” Kihusishi cha Kiebrania kinaweza kuonyesha njia, kuambatana, au mahali.
    reason: lexical_alternative
  - marker: b
    text: Matini inasema kwamba gari la moto na farasi wa moto viliwatenganisha Eliya na Elisha, na kwamba Eliya akapaa kwa/ndani ya kisulisuli; haisemi wazi kwamba Eliya alipanda gari hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha hatua mpya ya simulizi kwa mtindo mfupi, wa heshima, usio wa kizamani kupita kiasi.
- source_word: הֹלְכִים הָלוֹךְ
  choice: walipokuwa wakiendelea kutembea
  rationale: Muundo wa Kiebrania unaonyesha tendo lililokuwa likiendelea; Kiswahili hiki kinadumisha hali hiyo ya mwendo.
- source_word: וְדַבֵּר
  choice: huku wakizungumza
  rationale: Huonyesha kwamba mazungumzo yalifanyika wakati huohuo walipokuwa wakitembea.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Hudumisha mwito wa kuelekeza fikira na uzito wa ghafla wa tukio bila kuongeza neno lisilokuwamo kama ‘ghafla.’
- source_word: רֶכֶב אֵשׁ
  choice: gari la moto
  rationale: Hufuata moja kwa moja muundo wa Kiebrania na kuepuka kuamua ikiwa moto ni kitu chake, mwonekano wake, au sifa yake ya ajabu.
- source_word: וְסוּסֵי אֵשׁ
  choice: farasi wa moto
  rationale: Hudumisha ulinganifu wa kishairi na ‘gari la moto’ pamoja na picha halisi ya Kiebrania.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: vikawatenganisha hao wawili
  rationale: Kitenzi cha wingi kinachukuliwa kuwa kinarejelea gari na farasi kwa pamoja, huku ‘hao wawili’ ikidumisha rejeo la wazi kwa Eliya na Elisha.
- source_word: וַיַּעַל
  choice: akapaa
  rationale: ‘Kupaa’ ni Kiswahili cha kawaida na chenye hadhi kwa mwendo wa kwenda juu katika muktadha huu.
- source_word: בַּסְעָרָה
  choice: kwa kisulisuli
  rationale: ‘Kwa’ huwasilisha maana inayowezekana ya njia au chombo cha kupaa, bila kuficha kwamba kihusishi cha Kiebrania kinaweza pia kueleweka kuwa ndani ya au pamoja na kisulisuli.
- source_word: הַשָּׁמָיִם
  choice: mpaka mbinguni
  rationale: Huonyesha kikomo cha mwendo wa kupaa kwa Kiswahili cha kawaida na hudumisha hadhi ya simulizi.
theological_decisions:
- issue: Ikiwa gari la moto ndilo lililombeba Eliya au kisulisuli ndicho kilichohusishwa moja kwa moja na kupaa kwake
  choice: Matini inasema gari na farasi wa moto viliwatenganisha watu hao wawili, kisha Eliya akapaa kwa kisulisuli.
  alternative: Eliya alipanda na kubebwa na gari la moto.
  rationale: Kiebrania hutenganisha kazi ya gari na farasi—kuwatenganisha Eliya na Elisha—na kupaa kwa Eliya, kunakohusishwa wazi na kisulisuli. Tafsiri haiongezi dai kwamba Eliya alipanda garini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ inadumisha msisitizo wa kifasihi; ‘huku wakizungumza’ na ‘wakiendelea kutembea’ vinafanya sentensi isikike kwa kawaida huku vikihifadhi mwendelezo wa matendo. Alama za tanbihi zimewekwa karibu na vifungu vinavyohusika.
