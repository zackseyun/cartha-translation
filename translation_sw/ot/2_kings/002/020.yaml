  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: sw
  text: Akasema, “Nileteeni bakuli jipya[a], na wekeni chumvi ndani yake.” Basi wakamletea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtungi mdogo” au “chupa”; neno la Kiebrania linataja kwa ujumla chombo kidogo, bila kubainisha umbo lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Akasema
  rationale: Kauli ya kawaida ya masimulizi inayotanguliza maneno ya Elisha; kiambishi cha mfuatano kinaeleweka kwa mtiririko wa simulizi bila kuongeza “kisha”.
- source_word: קְחוּ לִי
  choice: Nileteeni
  rationale: Ingawa לקח kimsingi ni ‘chukua’, katika ombi hili lenye לִי maana ya kawaida ni kumletea msemaji kitu.
- source_word: צְלֹחִית
  choice: bakuli
  rationale: Neno hilo hutaja chombo kidogo, lakini umbo lake halijaainishwa wazi. “Bakuli” ni neno la kawaida na linafaa kwa kuweka chumvi; tanbihi huhifadhi uwezekano wa aina nyingine za chombo.
- source_word: חֲדָשָׁה
  choice: jipya
  rationale: Tafsiri ya moja kwa moja ya kivumishi kinachoeleza chombo.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: mweke chumvi ndani yake
  rationale: שׂים ni ‘weka’, na שָׁם, yaani ‘humo/hapo’, inarejelea chombo kilichotajwa; “ndani yake” ni Kiswahili cha kawaida na wazi.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: Basi wakamletea
  rationale: Katika muktadha huu לקח inaeleza kutekeleza ombi kwa kukipeleka chombo kwa Elisha. Kitu kinacholetwa kinaachwa kidokezwe kama kilivyo katika Kiebrania.
