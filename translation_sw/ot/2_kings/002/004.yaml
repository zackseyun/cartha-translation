language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: sw
  text: Kisha Eliya akamwambia, “Elisha, tafadhali baki hapa, kwa maana Yahweh amenituma Yeriko.” Naye akasema, “Kama Yahweh aishivyo, na kama wewe mwenyewe uishivyo, sitakuacha.” Basi wakafika Yeriko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: tafadhali baki
  rationale: Kitenzi ישׁב kinaweza kumaanisha kuketi, kukaa, au kubaki. Katika muktadha huu Eliya anamwomba Elisha asiendelee pamoja naye, hivyo “baki” linaeleza maana hiyo kwa Kiswahili cha kawaida; נָא imewasilishwa kwa “tafadhali.”
- source_word: פֹה
  choice: hapa
  rationale: Ni kielezi cha mahali, na “hapa” ndilo neno la kawaida na la moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limehifadhiwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: שְׁלָחַנִי
  choice: amenituma
  rationale: 'Kauli timilifu ina tendo lililofanyika lakini lenye umuhimu wa sasa: Eliya yuko safarini kwa sababu ya utume huo.'
- source_word: יְרִיחוֹ
  choice: Yeriko
  rationale: “Yeriko” ni umbo la kawaida la jina hili la mahali katika Kiswahili.
- source_word: חַי יְהוָה
  choice: Kama Yahweh aishivyo
  rationale: Hii ni kauli maalumu ya kiapo. Tafsiri hii inahifadhi muundo, uzito, na rejeo lake kwa uhai wa Yahweh.
- source_word: וְחֵי נַפְשְׁךָ
  choice: na kama wewe mwenyewe uishivyo
  rationale: Katika kauli hii נֶפֶשׁ humaanisha uhai au mtu mwenyewe, si lazima nafsi isiyo ya mwili. “Wewe mwenyewe” ni ya asili na inadumisha ulinganifu wa kiapo.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: sitakuacha
  rationale: 'Katika muundo huu wa kiapo, אִם linaanzisha sharti lenye maana hasi iliyodokezwa: ‘nikikuacha...’; Kiswahili kinahitaji maana hiyo kutamkwa wazi. “Kuacha” inafaa kwa muktadha wa safari.'
- source_word: וַיָּבֹאוּ
  choice: Basi wakaenda
  rationale: Wayyiqtol inaendeleza masimulizi. Ingawa kitenzi בוא kinaweza kutafsiriwa ‘kuja’ au ‘kufika,’ kwa mtazamo wa wasafiri wanaoelekea Yeriko, “wakaenda Yeriko” ni Kiswahili cha asili na kinaeleza mwendo huo bila kulazimisha kwamba walikuwa tayari wamefika.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya נֶפֶשׁ katika kiapo
  choice: wewe mwenyewe uishivyo
  alternative: nafsi yako iishivyo au kwa uhai wako
  rationale: Katika muktadha huu neno linarejelea uhai wa Elisha au Elisha mwenyewe. Chaguo hili huepuka kulifanya neno hilo kuwa fundisho maalumu kuhusu nafsi na huhifadhi nguvu ya kiapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo yamewekwa kwa lugha rahisi lakini ya heshima; muundo wa kiapo umehifadhiwa kwa sababu una umuhimu wa kifasihi na kitheolojia. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
