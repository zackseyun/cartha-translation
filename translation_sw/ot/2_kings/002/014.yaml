base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: sw
  text: Kisha Elisha akachukua joho la Eliya lililoanguka kutoka kwa Eliya, akayapiga maji na kusema, “Yuko wapi Yahweh, Mungu wa Eliya?”[a] Akayapiga maji tena, nayo yakagawanyika, sehemu moja upande huu na nyingine upande ule; ndipo Elisha akavuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania huongeza kirai kifupi chenye utata, “hata yeye” au “yeye pia.” Kinaweza kusisitiza swali—yaani, Mungu wa Eliya mwenyewe—au kuhusishwa na tendo linalofuata: “Yeye pia akayapiga maji.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: joho
  rationale: Neno hili humaanisha vazi la nje la Eliya lililomtambulisha. “Joho” ni neno la kawaida, lenye heshima, na linahifadhi picha halisi ya vazi hilo.
- source_word: נָפְלָה מֵעָלָיו
  choice: lililoanguka kutoka kwake
  rationale: Huhifadhi kwa uwazi maana ya kwamba joho lilitoka kwa Eliya wakati alipochukuliwa.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: akayapiga maji
  rationale: “Kupiga” ni kitenzi cha kawaida na sahihi kwa נכה hapa; upatanisho wa “maji” katika Kiswahili ni wa wingi.
- source_word: אַיֵּה
  choice: Yuko wapi
  rationale: Ni swali la moja kwa moja kuhusu kuwapo kwa Mungu au kujidhihirisha kwake, bila kulipanua kwa tafsiri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa wazi katika Kiebrania.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: Mungu wa Eliya
  rationale: Huhifadhi kwa njia ya asili uhusiano wa maneno ya Kiebrania.
- source_word: אַף הוּא
  choice: imeonyeshwa kwa tanbihi [a]
  rationale: Kirai hiki ni kifupi sana na kina utata wa kisarufi. Kukilazimisha ndani ya sentensi kuu kungetoa Kiswahili kisicho cha kawaida au kungeamua tafsiri inayobishaniwa; tanbihi huhifadhi uwepo wake na uwezekano wake wa maana.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: yakagawanyika, sehemu moja upande huu na nyingine upande ule
  rationale: Hutoa kwa Kiswahili cha kawaida picha ya maji kugawanyika katika pande mbili, sawasawa na jozi ya mielekeo katika Kiebrania.
- source_word: וַיַּעֲבֹר
  choice: akavuka
  rationale: Ni kitenzi cha kawaida na sahihi katika muktadha wa kuvuka mto.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Maana na uhusiano wa אַף הוּא
  choice: Swali kuu linaachwa bila upanuzi, huku kirai hicho kikielezwa katika tanbihi
  alternative: “Yuko wapi Yahweh, Mungu wa Eliya—naam, yeye?” au “Yeye pia akayapiga maji”
  rationale: Kiebrania ni kifupi na kinaweza kueleweka kwa njia tofauti. Uamuzi huu hauondoi kirai kimya kimya, wala haulazimishi hitimisho kuhusu kama kinasisitiza kuwapo kwa Mungu yuleyule au tendo la Elisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetumia “aka-” kwa mtiririko wa matendo. “Tena” limeongezwa ili kuweka wazi kwamba Elisha aliyapiga maji mara ya pili, jambo linalotokana na kurudiwa kwa kitenzi katika Kiebrania.
