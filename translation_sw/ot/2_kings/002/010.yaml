  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: sw
  text: Akasema[a], “Umeomba jambo gumu. Ukiona nikichukuliwa kutoka kwako, itakuwa hivyo kwako; lakini ikiwa sivyo, haitakuwa hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ukiona nitakapochukuliwa kutoka kwako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: Umeomba jambo gumu
  rationale: Muundo huu wa Kiebrania ni nahau inayomaanisha kwamba ombi lililotolewa ni gumu au lenye masharti mazito; Kiswahili hiki ni cha kawaida na kinabaki karibu na maana.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: Ukiona nikichukuliwa kutoka kwako
  rationale: Kauli ya masharti na umbo tendwa la לקח vinahifadhiwa bila kutaja anayemchukua Eliya. Kiswahili hiki kinaweza kueleweka kuwa kumwona katika tukio la kuchukuliwa.
- source_word: יְהִי לְךָ כֵן
  choice: utapewa hilo
  rationale: Nahau hii inathibitisha kwamba jambo aliloomba Elisha litakuwa lake. Tafsiri ya moja kwa moja ‘iwe hivyo kwako’ si ya kawaida sana katika Kiswahili cha sasa, hivyo maana ya muktadha imeelezwa kwa uwazi.
- source_word: וְאִם אַיִן
  choice: lakini usipoona
  rationale: אַיִן ni usemi uliodondosha maneno yanayoeleweka kutokana na kishazi kilichotangulia. Kurudia ‘ona’ kwa Kiswahili kunafanya sharti liwe wazi.
- source_word: לֹא יִהְיֶה
  choice: hutapewa
  rationale: Kinachokataliwa ni kutimizwa kwa ombi la Elisha. Kiswahili hiki kinalingana na kishazi chanya na kueleza rejeo lililodokezwa na Kiebrania.
