  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: sw
  text: Ndipo wana wa manabii waliokuwa huko Yeriko wakamwendea Elisha na kumwambia, “Je, unajua kwamba leo Yahweh anamchukua bwana wako kutoka juu ya kichwa chako?[a]” Akasema, “Mimi pia ninajua; nyamazeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kuwa msimamizi wako.” Kiebrania kinasema halisi, “kutoka juu ya kichwa chako”; huenda huu ni usemi wa kuondolewa kwa mtu mwenye mamlaka juu ya mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: wakamsogelea
  rationale: Kitenzi hiki kinaonyesha kusogea karibu na mtu; “wakamsogelea” ni Kiswahili cha kawaida na kinahifadhi mwendo kuelekea kwa Elisha.
- source_word: בְנֵי הַנְּבִיאִים
  choice: wana wa manabii
  rationale: Tafsiri hii inahifadhi tamathali ya Kiebrania inayolitaja kundi la kinabii bila kuamua moja kwa moja kama walikuwa wanafunzi, wafuasi, au wanachama wa jumuiya ya manabii.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: waliokuwa Yeriko
  rationale: Kishazi hiki kinatambulisha kundi la manabii lililokuwapo Yeriko.
- source_word: הֲיָדַעְתָּ
  choice: Je, unajua
  rationale: Kauli hii inauliza hali ya sasa ya ufahamu, hivyo wakati wa sasa ni wa kawaida na sahihi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: לֹקֵחַ
  choice: anamchukua
  rationale: Umbo la kitenzi linaonyesha tendo lililo karibu au linalotazamwa kwa uhai kana kwamba linaendelea; wakati wa sasa unahifadhi uzito huo.
- source_word: אֲדֹנֶיךָ
  choice: bwana wako
  rationale: Katika muktadha huu neno linamhusu Eliya akiwa mwenye mamlaka juu ya Elisha; “bwana wako” ni tafsiri ya kawaida na yenye heshima kwa mtu.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: kutoka juu ya kichwa chako
  rationale: Maneno halisi na taswira ya Kiebrania vimehifadhiwa katika matini kuu, huku maana inayowezekana ya mamlaka ikielezwa katika tanbihi.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Mimi pia ninajua
  rationale: “Mimi” linahifadhi kiwakilishi cha mkazo, na “pia” linahifadhi chembe ya nyongeza.
- source_word: הֶחֱשׁוּ
  choice: nyamazeni
  rationale: Ni amri ya wingi yenye maana ya kukaa kimya; “nyamazeni” ni fupi, wazi, na ina nguvu sawa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu, si cheo; “Yahwe” linahifadhi jina hilo kwa ulitohaji unaokubalika.
- issue: Iwapo מֵעַל רֹאשֶׁךָ ifasiriwe kimaanisho katika matini kuu
  choice: kuhifadhi usemi halisi “kutoka juu ya kichwa chako”
  alternative: kutoka kuwa juu yako
  rationale: Usemi unaweza kuonyesha kuondolewa kwa mtu mwenye mamlaka juu ya mwingine, lakini taswira ya Kiebrania ina utata fulani. Matini kuu haiufungii katika fasiri moja, na tanbihi inatoa maana inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “wana wa manabii” na taswira “juu ya kichwa chako” zimehifadhiwa kwa uwazi wa kimatamshi na ili kuepuka kufuta utata wa matini ya Kiebrania.
