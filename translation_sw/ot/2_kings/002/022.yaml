translation:
  language: sw
  text: Basi maji yakaponywa hadi leo[a], kama alivyosema Elisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yakarejeshwa” au “yakawa mazuri kwa kunywa.” Kitenzi cha Kiebrania ni neno la kawaida linalomaanisha “kuponya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: yakaponywa
  rationale: Kitenzi cha Kiebrania רפא kwa kawaida humaanisha ‘kuponya.’ Hapa kinatumika kwa maji yaliyokuwa mabaya, hivyo ‘yakaponywa’ kinahifadhi sitiari ya chanzo na muktadha wa muujiza.
- source_word: הַמַּיִם
  choice: maji
  rationale: מַיִם lina umbo la wingi katika Kiebrania, lakini ‘maji’ ndilo neno la kawaida la Kiswahili na lina upatanisho wa kisarufi wa wingi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni nahau ya kawaida inayoonyesha kwamba hali hiyo iliendelea hadi wakati wa msimuliaji.
- source_word: כִּדְבַר
  choice: sawasawa na neno
  rationale: דבר hapa ni ‘neno,’ likirejelea tamko la Elisha katika mstari uliotangulia. ‘Sawasawa na’ huonyesha kwamba matokeo yalitimia kulingana na tamko hilo.
- source_word: אֱלִישָׁע
  choice: Elisha
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: אֲשֶׁר דִּבֵּר
  choice: alilosema Elisha
  rationale: Kishazi hiki kinabainisha tamko hususa la kinabii; mpangilio huu ni wazi na wa asili katika Kiswahili.
theological_decisions:
- issue: Lugha ya kuponywa kwa maji
  choice: 'Kuhifadhi sitiari ya uponyaji katika matini kuu: ‘maji yakaponywa.’'
  alternative: ‘maji yakawa mazuri tena’ au ‘maji yakawa salama’
  rationale: Kiebrania kinatumia רפא, kitenzi cha kawaida cha ‘kuponya.’ Kukihifadhi hakulazimishi tafsiri ya kimadhehebu, bali hudumisha picha ya chanzo kwamba neno la kinabii lilileta urejesho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Basi’ linaendeleza matokeo ya simulizi; ‘mpaka leo’ ni nahau ya kawaida. Sitiari ya maji kuponywa imehifadhiwa huku maelezo ya chini yakitoa maana mbadala za wazi.
