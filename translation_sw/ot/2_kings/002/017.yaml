  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: sw
  text: Lakini waliendelea kumsihi mpaka akaona aibu[a], naye akasema, “Watumeni.” Basi wakatuma watu hamsini, nao wakamtafuta kwa siku tatu, lakini hawakumpata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka akafedheheka.” Kiebrania kinasema kihalisi “mpaka akaona aibu,” kikieleza shinikizo la kijamii lililosababishwa na kusihi kwao tena na tena.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: waliendelea kumsihi
  rationale: Kitenzi פצר kinaonyesha kusihi au kushinikiza kwa kuendelea. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha kwamba walimsihi tena na tena.
- source_word: עַד בֹּשׁ
  choice: mpaka akaona aibu
  rationale: בוש huhusu aibu au kufedheheka. “Akaona aibu” ni usemi wa asili wa Kiswahili unaohifadhi shinikizo la kijamii bila kulifafanua kupita kiasi.
- source_word: שְׁלָחוּ
  choice: Watumeni
  rationale: Ni amri kwa wingi kutoka שלח. Kiambishi cha yambwa kinaweka wazi kwa Kiswahili wale waliopaswa kutumwa, kama muktadha unavyoonyesha.
- source_word: חֲמִשִּׁים אִישׁ
  choice: watu hamsini
  rationale: Kiebrania kinasema moja kwa moja “watu hamsini”; hakiongezi hapa utambulisho wao kutoka muktadha mpana.
- source_word: וַיְבַקְשׁוּ
  choice: wakamtafuta
  rationale: בקש hapa ni kutafuta. Kiambishi “-m-” kinaonyesha kwamba walimtafuta Eliya, jambo lililo wazi katika muktadha na katika kishamirisho cha sentensi inayofuata.
- source_word: שְׁלֹשָׁה יָמִים
  choice: kwa siku tatu
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza muda ambao tendo la kutafuta liliendelea.
- source_word: וְלֹא מְצָאֻהוּ
  choice: lakini hawakumpata
  rationale: מצא humaanisha kupata au kumwona aliyekuwa akitafutwa. “Lakini” linaonyesha kwa kawaida matokeo yaliyokuwa kinyume na jitihada zao za siku tatu.
