  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל אֱלִישָׁ֔ע הִנֵּה נָ֞א מוֹשַׁ֤ב הָ/עִיר֙ ט֔וֹב כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י רֹאֶ֑ה וְ/הַ/מַּ֥יִם רָעִ֖ים וְ/הָ/אָ֥רֶץ מְשַׁכָּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: sw
  text: Ndipo wanaume wa mji wakamwambia Elisha, “Tafadhali, tazama, mahali mji ulipo ni pazuri, kama bwana wangu anavyoona; lakini maji ni mabaya, nayo ardhi husababisha kuharibika kwa mimba[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nayo ardhi haina mazao.” Neno la Kiebrania lililotafsiriwa “husababisha kuharibika kwa mimba” linaweza kumaanisha kusababisha kupotea kwa uzao, na katika muktadha huu huenda likajumuisha pia ardhi kutokuwa na mazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... wakamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אַנְשֵׁי הָעִיר
  choice: wanaume wa mji
  rationale: Kirai cha Kiebrania ni cha kiume kwa uwazi, hivyo “wanaume” kinahifadhi maelezo hayo badala ya kuyafanya kuwa “watu.”
- source_word: הִנֵּה נָא
  choice: Tazama, tafadhali
  rationale: “Tazama” huvuta fikira, huku “tafadhali” ikihifadhi uzito wa ombi la heshima katika נָא.
- source_word: מוֹשַׁב הָעִיר
  choice: mahali mji ulipo
  rationale: מוֹשַׁב hapa inaelekea kumaanisha eneo au mahali mji ulipo; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: טוֹב
  choice: ni pazuri
  rationale: Kivumishi kinapatana kiasili na “mahali” na kuhifadhi tathmini ya moja kwa moja kwamba eneo hilo ni zuri.
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: kama bwana wangu anavyoona
  rationale: “Bwana wangu” ni namna ya heshima kwa Elisha, si cheo cha Mungu; “anavyoona” hufuata maana ya kitenzi cha Kiebrania.
- source_word: וְהַמַּיִם רָעִים
  choice: lakini maji ni mabaya
  rationale: Ingawa וְ kwa msingi ni “na,” hapa inaonyesha tofauti kati ya uzuri wa eneo na ubaya wa maji; “lakini” huwasilisha tofauti hiyo kiasili.
- source_word: וְהָאָרֶץ
  choice: nayo ardhi
  rationale: “Ardhi” inafaa kwa eneo au udongo wa mahali hapo na haifungi maana kwa nchi nzima.
- source_word: מְשַׁכָּלֶת
  choice: husababisha mimba kuharibika
  rationale: Umbo la kisababishi la שׁכל lina maana ya kusababisha kupotea kwa uzao. Tafsiri hii huhifadhi picha halisi ya kibayolojia, huku tanbihi ikitaja uwezekano mpana wa ardhi kutokuwa na mazao.
theological_decisions:
- issue: Tafsiri ya אֲדֹנִי inapomrejelea Elisha
  choice: bwana wangu
  alternative: mheshimiwa wangu / mkuu wangu
  rationale: Hiki ni kibainishi cha heshima katika jamii, wala si jina au cheo cha Mungu. “Bwana wangu” huhifadhi heshima na umilikishi wa nafsi ya kwanza uliomo katika Kiebrania.
- issue: Upeo wa מְשַׁכָּלֶת
  choice: husababisha mimba kuharibika
  alternative: haizai / haina mazao
  rationale: Kiebrania kinaweza kueleza kupotea kwa uzao na, katika muktadha huu, huenda kikahusu pia ukosefu wa mazao. Maandishi makuu yanahifadhi nguvu halisi ya neno, na tanbihi inalinda maana pana bila kutatua utata kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Tazama, tafadhali” huhifadhi mwito wa kuangalia na ombi la adabu; “mahali mji ulipo” huepuka usemi mzito au usio wa kawaida.
