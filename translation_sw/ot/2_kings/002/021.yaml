base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: sw
  text: 'Kisha akaenda kwenye chanzo cha maji[a], akatupa chumvi humo, akasema, “Yahweh asema hivi: ‘Nimeyaponya maji haya. Tangu hapo hakutatoka tena kifo wala mimba kuharibika[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye chemchemi ya maji.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha “kusababisha mimba kuharibika”; kwa upana linaweza pia kurejelea hali ya kutokuwa na uzao.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: chanzo
  rationale: Katika muktadha wa maji ya mji, neno hili linamaanisha mahali maji yanapotokea. ‘Chanzo’ ni Kiswahili cha kawaida kinachoweza pia kurejelea chemchemi bila kubana maana kupita kiasi.
- source_word: הַמַּיִם / לַמַּיִם הָאֵלֶּה
  choice: maji / maji haya
  rationale: Ingawa umbo la Kiebrania ni la wingi, ‘maji’ ndilo neno la kawaida la Kiswahili kwa ugavi huu wa maji.
- source_word: מֶלַח
  choice: chumvi
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Inahifadhi mtindo wa kawaida wa ujumbe wa kinabii na kulitaja jina la Mungu moja kwa moja.
- source_word: רִפִּאתִי
  choice: Nimeyaponya
  rationale: Kitenzi רפא humaanisha ‘kuponya.’ Matumizi yake kwa maji ni ya kimajazi, na tafsiri hii inahifadhi taswira hiyo hai.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: Hayatatokeza tena
  rationale: Kauli hii inaonyesha kwamba madhara hayatakuja tena kutoka katika maji hayo; ‘kutokeza’ ni ya asili kwa Kiswahili na inahifadhi dhana ya chanzo.
- source_word: מָוֶת
  choice: kifo
  rationale: Ni kisawe cha moja kwa moja; haipunguzi maana kuwa aina fulani tu ya kifo.
- source_word: מְשַׁכָּלֶת
  choice: kuharibika kwa mimba
  rationale: Neno hili la mzizi שׁכל linaonyesha kupotea kwa uzao au kutokuwa na matunda. Katika muktadha huu, ‘kuharibika kwa mimba’ huwasilisha athari halisi huku tanbihi ikihifadhi uwezekano mpana zaidi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la agano יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya ishara ya chumvi na uponyaji wa maji
  choice: Tamko linamhusisha Yahweh moja kwa moja na uponyaji
  alternative: Kudokeza kwamba chumvi yenyewe ndiyo iliyoyaponya maji
  rationale: Kauli ‘Nimeyaponya’ inaweka tendo kwa Yahweh. Tafsiri haiongezi maelezo yanayoifanya chumvi kuwa nguvu inayojitegemea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Humo’ hurejelea mahali maji yanapotokea. Taswira ya ‘kuponya maji’ imehifadhiwa badala ya kufafanuliwa kuwa kuyafanya yafae kunyweka.
