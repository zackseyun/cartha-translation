  text: Akatoka huko, akaenda Mlima Karmeli; na kutoka huko akarudi Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kisha akaondoka huko, akaenda
  rationale: Kitenzi hiki kinaendeleza simulizi na kueleza safari kutoka mahali pa awali. Muundo huu ni wa kawaida katika Kiswahili na unaunganika vizuri na מִשָּׁם.
- source_word: מִשָּׁם
  choice: huko
  rationale: Katika muundo ‘akaondoka huko,’ neno hili linaonyesha mahali alikotoka kwa Kiswahili cha kawaida na wazi.
- source_word: אֶל
  choice: akaenda
  rationale: Mwelekeo kuelekea mahali panapolengwa umeelezwa kwa kawaida katika Kiswahili kwa kitenzi ‘akaenda’ pamoja na jina la mahali.
- source_word: הַר הַכַּרְמֶל
  choice: Mlima Karmeli
  rationale: Hili ni jina la kijiografia; ‘Mlima Karmeli’ ni umbo la kawaida la Kiswahili.
- source_word: וּמִשָּׁם
  choice: na kutoka huko
  rationale: Huhifadhi kiunganishi na urudiaji wa mahali unaopatikana katika Kiebrania.
- source_word: שָׁב
  choice: akarudi
  rationale: Katika muktadha wa safari, kitenzi שׁוב humaanisha kurudi; ‘akarudi’ ni sawa, wazi, na cha kawaida katika simulizi.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hili la mahali.
