  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: sw
  text: Ndipo wakamwambia, “Tazama, miongoni mwa watumishi wako kuna wanaume hamsini wenye uwezo. Tafadhali waruhusu waende wakamtafute bwana wako. Huenda Roho wa Yahweh[a] amembeba na kumtupa juu ya mlima mmoja kati ya milima au ndani ya bonde moja kati ya mabonde.” Lakini akasema, “Usiwatume.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upepo wa Yahweh umembeba.” Neno la Kiebrania lililotafsiriwa “Roho” linaweza pia kumaanisha “upepo.”
    reason: Huhifadhi maana nyingine halisi ya רוּחַ bila kuondoa usomaji unaopendelewa na muktadha.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Tazama
  rationale: Ni neno la kuvuta fikira kwa heshima kabla ya ombi; Kiswahili cha sasa hakihitaji kutafsiri נָא mara mbili kwa kuwa ombi linalofuata lina ‘tafadhali.’
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: miongoni mwa watumishi wako kuna
  rationale: Muundo huu wa uwepo unaonyesha kwamba watu hao wanapatikana katika kundi la watumishi wa Elisha, na unasikika kwa kawaida katika Kiswahili.
- source_word: חֲמִשִּׁים אֲנָשִׁים בְּנֵי חַיִל
  choice: wanaume hamsini wenye uwezo
  rationale: בְּנֵי חַיִל hapa inaeleza wanaume hodari na wanaofaa kwa kazi ya kutafuta, bila kulazimisha maana ya kijeshi au nguvu za mwili pekee.
- source_word: יֵלְכוּ נָא
  choice: Tafadhali waruhusu waende
  rationale: Kauli ya ombi inaelekezwa kwa Elisha ili awape ruhusa wanaume hao waende; ‘tafadhali’ huhifadhi adabu ya נָא.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: wakamtafute bwana wako
  rationale: בקשׁ hapa ni kumtafuta mtu aliyepotea, na אֲדֹנֶיךָ humrejelea Eliya kama bwana au mkuu wa Elisha.
- source_word: פֶּן
  choice: Huenda
  rationale: Katika muktadha huu neno hilo linaanzisha maelezo yasiyo na uhakika kuhusu mahali Eliya alipo, si matokeo yanayotakiwa kuzuiwa.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: Roho wa Yahweh amembeba
  rationale: Muktadha wa kuondolewa kwa Eliya kwa njia isiyo ya kawaida unapendelea kuelewa רוּחַ kama Roho anayetenda; uwezekano wa maana ‘upepo’ umehifadhiwa katika tanbihi.
- source_word: וַיַּשְׁלִכֵהוּ
  choice: na kumtupa
  rationale: Kitenzi kina maana ya kutupa au kurusha; ‘kumtupa’ ni wazi, cha kawaida, na huhifadhi nguvu ya tendo.
- source_word: בְּאַחַד הֶהָרִים ... בְּאַחַת הַגֵּאָיוֹת
  choice: juu ya mmoja wa milima au ndani ya moja ya mabonde
  rationale: Vihusishi vya mahali vimewasilishwa kulingana na mazingira ya mlima na bonde, huku mwendo unaodokezwa na ‘kumtupa’ ukihifadhiwa.
theological_decisions:
- issue: Maana ya רוּחַ יְהוָה
  choice: Roho wa Yahweh
  alternative: upepo wa Yahweh
  rationale: Masimulizi yanaelekeza zaidi kwa utendaji wa kimungu katika kuondolewa kwa Eliya, lakini רוּחַ pia linaweza kumaanisha upepo; kwa hiyo maana hiyo mbadala haijaondolewa bali imetajwa katika tanbihi.
- issue: Jina la agano יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Jina binafsi la Mungu limeandikwa ‘Yahweh’ ili kulitofautisha na cheo ‘bwana’ kinachotumiwa kwa Eliya katika mstari huohuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Wenye uwezo’ huepuka maana ya kijeshi isiyohitajika; ‘Huenda’ huwasilisha dhana ya uwezekano; na tofauti kati ya ‘Yahweh’ na ‘bwana wako’ imehifadhiwa wazi.
