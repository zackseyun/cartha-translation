  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: sw
  text: Walipomrudia[a], alikuwa ameketi huko Yeriko, naye akawaambia, “Je, sikuwaambia, ‘Msiende’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao wakarudi kwake, naye alikuwa ameketi huko Yeriko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: Walipomrudia
  rationale: Muundo wa wakati unaunganisha kurudi kwao na hali ya Elisha iliyofuata; kiambishi cha yambwa -m- kinarejelea Elisha kwa kawaida katika Kiswahili.
- source_word: וְהוּא יֹשֵׁב
  choice: alikuwa ameketi
  rationale: Neno יֹשֵׁב linaweza kumaanisha kuketi, kukaa, au kuishi. Hapa ‘alikuwa ameketi’ linahifadhi picha ya msingi bila kuzuia maana ya kuendelea kuwapo Yeriko.
- source_word: בִּירִיחוֹ
  choice: huko Yeriko
  rationale: ‘Yeriko’ ni jina la mahali lililozoeleka katika Kiswahili; ‘huko’ huonyesha mahali alipokuwa wakati wao waliporudi.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: naye akawaambia
  rationale: Tafsiri ya kawaida na ya asili ya kitenzi cha kusema pamoja na walengwa wake katika simulizi la Kiswahili.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: Je, sikuwaambia
  rationale: Swali hasi la balagha linatarajia jibu la kukubali na linahifadhi sauti ya kukemea kwa upole.
- source_word: אַל תֵּלֵכוּ
  choice: Msiende
  rationale: Umbo la kukataza kwa nafsi ya pili wingi linawasilishwa moja kwa moja na kwa kawaida.
