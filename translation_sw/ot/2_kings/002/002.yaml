  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: sw
  text: Eliya akamwambia Elisha, “Tafadhali baki hapa, kwa maana Yahweh amenituma mpaka Betheli[a].” Lakini Elisha akasema, “Kama Yahweh aishivyo, na kama wewe uishivyo[b], sitakuacha.” Basi wakateremka kwenda Betheli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “amenituma mpaka Betheli”; katika muktadha huu inaweza pia kutafsiriwa, “amenituma kwenda Betheli.”'
    reason: lexical_alternative
  - marker: b
    text: Kiapo hiki kwa Kiebrania ni, “Kama Yahweh aishivyo, na kama nafsi yako iishivyo, nikikuacha”—yaani, “sitakuacha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: Tafadhali baki hapa
  rationale: Kitenzi ישׁב kinaweza kumaanisha ‘kuketi,’ ‘kukaa,’ au ‘kubaki.’ Katika muktadha huu Eliya anamwomba Elisha asiendelee kuandamana naye, kwa hiyo ‘baki hapa’ linaeleza maana hiyo kwa Kiswahili cha kawaida; נָא limetafsiriwa ‘tafadhali.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: amenituma mpaka Betheli
  rationale: עַד kwa kawaida huonyesha kikomo au mwisho wa safari, ‘mpaka/hadi.’ ‘Mpaka Betheli’ linahifadhi wazo hilo, huku tanbihi ikitaja uwezekano wa kuelewa kwa urahisi zaidi ‘kwenda Betheli.’
- source_word: חַי יְהוָה
  choice: Kama Yahweh aishivyo
  rationale: Hii ni kauli ya kawaida ya kiapo katika Kiebrania; tafsiri hii inahifadhi uzito wake kwa Kiswahili cha asili.
- source_word: וְחֵי נַפְשְׁךָ
  choice: na kama wewe uishivyo
  rationale: Katika kiapo hiki נֶפֶשׁ humrejelea mtu mwenyewe au uhai wake, si lazima ‘roho’ kama sehemu tofauti ya mwanadamu. ‘Wewe uishivyo’ ni ya asili na haileti ufafanuzi wa kianthropolojia usiokusudiwa.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: sitakuacha
  rationale: 'Baada ya kauli ya kiapo, אִם huanzisha kiapo hasi kilichofupishwa: kihalisi ‘nikikuacha ...,’ lakini maana yake ni ‘sitakuacha.’ Kiswahili kinahitaji kukanusha wazi ili maana ieleweke.'
- source_word: וַיֵּרְדוּ
  choice: wakateremka
  rationale: ירד humaanisha kushuka; ‘wakateremka’ linahifadhi mwelekeo wa safari uliotajwa katika simulizi.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hili ni umbo la kawaida la jina la mahali hapa katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, kwa hiyo limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- issue: Muundo wa kiapo אִם אֶעֶזְבֶךָּ
  choice: sitakuacha
  alternative: nikikuacha
  rationale: Kiebrania kinaacha adhabu ya kiapo bila kutajwa na hivyo hutumia ‘ikiwa’ kwa nguvu ya kukanusha. Tafsiri wazi ‘sitakuacha’ huhifadhi maana bila kuongeza aina ya adhabu ambayo haikutajwa.
- issue: Maana ya נֶפֶשׁ katika kiapo
  choice: wewe
  alternative: roho yako au uhai wako
  rationale: Katika msemo huu neno hilo humaanisha mtu mwenyewe au uhai wake. ‘Wewe’ huepuka kuamua kwamba kifungu kinatoa fundisho mahususi kuhusu ‘roho,’ huku tanbihi ikihifadhi umbo la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Baki hapa,’ ‘kama ... aishivyo,’ na ‘wakateremka’ huhifadhi mtiririko wa simulizi na uzito wa kiapo bila kuwa vya kizamani kupita kiasi. Alama zote za tanbihi zimewekwa mara moja katika maandishi makuu karibu na vifungu vinavyofafanuliwa.
