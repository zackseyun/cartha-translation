base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: sw
  text: Kisha akapanda kutoka huko kwenda Betheli. Alipokuwa akipanda njiani, wavulana wadogo[a] wakatoka mjini, wakamdhihaki na kumwambia, “Panda, ewe kipara! Panda[b], ewe kipara!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vijana wa kiume” au “vijana”; kirai cha Kiebrania kinaweza kutaja vijana wa kiume kwa upana zaidi, si lazima watoto wadogo sana.
    reason: lexical_alternative
  - marker: b
    text: Huenda kurudiwa kwa neno “Panda” ni kejeli tu, lakini pia huenda kunadokeza kupaa kwa Eliya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: Kisha akapanda
  rationale: Kitenzi cha Kiebrania kinaendeleza simulizi na kumaanisha kupanda. “Kisha” huleta mtiririko wa kawaida wa simulizi, huku “akapanda” kikihifadhi maana na urudiaji wa עלה.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali Bethel.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: Alipokuwa akipanda njiani
  rationale: Muundo wa kiwakilishi pamoja na kitenzi endelevu unaonyesha tendo lililokuwa likiendelea; tafsiri hii ni ya kawaida kwa Kiswahili na inadumisha mzizi wa maana wa “kupanda.”
- source_word: נְעָרִים קְטַנִּים
  choice: wavulana wadogo
  rationale: Kirai hiki hutaja vijana wa kiume wenye umri mdogo. Kwa kuwa נְעָרִים inaweza kuwa na maana pana kuliko watoto wadogo sana, uwezekano huo umeelezwa katika tanbihi.
- source_word: יָצְאוּ מִן הָעִיר
  choice: wakatoka mjini
  rationale: Hii ni tafsiri ya asili na fupi ya Kiswahili kwa kitendo cha kutoka katika mji.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: wakamdhihaki
  rationale: Kitenzi kinaonyesha kejeli au dharau; “kumdhihaki” kina uzito unaofaa na ni lugha ya kawaida yenye heshima.
- source_word: עֲלֵה
  choice: Panda
  rationale: Amri hii inatokana na mzizi uleule uliotumiwa kuhusu kupanda kwa Elisha. “Panda” inadumisha urudiaji huo bila kufafanua kimabavu kusudi la kejeli.
- source_word: קֵרֵחַ
  choice: ewe kipara
  rationale: Neno la Kiebrania humtaja mtu mwenye upara katika usemi wa dhihaka. “Ewe kipara” linafanya kazi kama mwito wa kejeli katika Kiswahili bila kuongeza maelezo yasiyokuwamo.
theological_decisions:
- issue: Maana inayoweza kudokezwa na amri iliyorudiwa “Panda”
  choice: Kudumisha tafsiri ya moja kwa moja “Panda” katika matini kuu
  alternative: Kuitafsiri kama “Ondoka hapa” au kuifanya wazi kuwa “Panda kama Eliya”
  rationale: Kiebrania kinasema wazi “panda,” lakini kusudi kamili la kejeli linabishaniwa. Matini kuu inadumisha usemi wenyewe, na tanbihi inalinda uwezekano wa dokezo kuhusu kupaa kwa Eliya.
- issue: Umri na uwajibikaji unaodokezwa na נְעָרִים קְטַנִּים
  choice: Kutumia “wavulana wadogo” na kuweka upana wa maana katika tanbihi
  alternative: vijana wadogo; vijana; vijana wa kiume
  rationale: Kirai cha Kiebrania kinaelekea kwa vijana wa kiume wenye umri mdogo, lakini hakilazimishi waeleweke kuwa watoto wadogo sana. Tanbihi inazuia hitimisho lisilo la lazima kuhusu umri wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. Urudiaji wa “akapanda/akipanda/Panda” umehifadhiwa kwa sababu ni muhimu katika Kiebrania na katika uwezekano wa dokezo la kejeli.
