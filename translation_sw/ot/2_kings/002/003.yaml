  text: וַ/יֵּצְא֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בֵּֽית אֵל֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: sw
  text: Ndipo wana wa manabii waliokuwa Betheli wakatoka kumwendea Elisha, wakamwambia, “Je, unajua kwamba leo Yahweh anamchukua bwana wako kutoka juu ya kichwa chako[a]?” Akasema, “Mimi pia ninajua; nyamazeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka juu yako.” Kiebrania kinasema kihalisi, “kutoka juu ya kichwa chako”; hii ni nahau ya kumwondoa mtu mwenye mamlaka juu ya mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: wana wa manabii
  rationale: Muundo huu unahifadhi nahau ya Kiebrania inayotaja jumuiya au wanafunzi wa kinabii bila kuamua kwa hakika kwamba walikuwa tu ‘wanafunzi’ au ‘kundi’ kwa maana rasmi.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: waliokuwa Betheli
  rationale: Kishazi hiki linatambulisha kundi kwa mahali lilipokuwa; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הֲיָדַעְתָּ
  choice: Je, unajua
  rationale: Wakati uliopo katika Kiswahili huwasilisha kwa kawaida swali la Kiebrania kuhusu ufahamu wa Elisha wakati huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi badala ya kubadilishwa na cheo, kwa kuwa maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja.
- source_word: לֹקֵחַ
  choice: anamchukua
  rationale: Wakati wa sasa unaonyesha tendo lililo karibu kutokea siku hiyo na kuhifadhi uhai wa participo ya Kiebrania.
- source_word: אֲדֹנֶיךָ
  choice: bwana wako
  rationale: Hapa neno linamtaja Eliya kama mkuu au mwalimu wa Elisha, si Mungu; herufi ndogo husaidia kuonyesha tofauti hiyo.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: kutoka juu yako
  rationale: Tafsiri hii inadumisha taswira ya mtu aliye juu ya mwingine katika mamlaka, huku maelezo ya chini yakitoa umbo halisi zaidi la Kiebrania.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Mimi pia ninajua
  rationale: ‘Pia’ linahifadhi kwa wazi maana ya גַּם אֲנִי, kwamba Elisha ana ujuzi huohuo.
- source_word: הֶחֱשׁוּ
  choice: nyamazeni
  rationale: Amri ya wingi inalingana na kundi linalosemewa na inahifadhi uzito wa agizo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya kumchukua Eliya kutoka juu ya Elisha
  choice: kutoka juu yako
  alternative: asiwe tena mkuu wako
  rationale: Usemi wa Kiebrania unaweza kuonyesha kuondolewa kwa Eliya, ambaye alikuwa katika nafasi ya mamlaka juu ya Elisha. Tafsiri kuu inadumisha taswira na mvutano wa usemi badala ya kuufafanua kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nyamazeni’ ni amri ya wingi; ‘bwana’ limeandikwa kwa herufi ndogo kwa kuwa linamtaja Eliya.
