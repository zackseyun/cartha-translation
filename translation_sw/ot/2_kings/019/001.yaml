  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: sw
  text: Mfalme Hezekia aliposikia hayo, alirarua mavazi yake, akajifunika nguo ya gunia, akaingia katika nyumba ya Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: aliposikia hayo
  rationale: Muundo wa simulizi unaanzisha tukio linalofuata kwa wakati. Kiswahili cha kawaida hutumia ‘aliposikia’; ‘hayo’ huonyesha kwa asili ujumbe uliotangulia bila kuiga kwa ugumu ‘ikawa’.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: Mfalme Hezekia
  rationale: Mpangilio wa cheo kabla ya jina ni wa kawaida na wazi katika Kiswahili.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: alirarua mavazi yake
  rationale: Huhifadhi kitendo halisi cha kurarua mavazi kama ishara ya huzuni na mshtuko; ‘mavazi’ ni lugha ya heshima na inayoeleweka.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: akajifunika nguo ya gunia
  rationale: Kitenzi cha kujirejelea kinawakilishwa na ‘akajifunika’; ‘nguo ya gunia’ hutaja kitambaa kigumu kilichovaliwa wakati wa maombolezo na kujinyenyekeza.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: akaingia katika nyumba ya Yahwe
  rationale: בוא pamoja na ‘nyumba’ hapa huonyesha kuingia ndani. ‘Nyumba ya Yahwe’ huhifadhi tamathali ya hekalu iliyomo katika Kiebrania badala ya kuibadilisha kuwa ‘hekalu’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH linatolewa kama jina binafsi ‘Yahwe’, kwa tahajia ya Kiswahili, badala ya kubadilishwa na cheo ‘BWANA’.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania lina jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi na hutumia tahajia ya kawaida ya Kiswahili, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na rahisi kueleweka. Mfululizo wa vitenzi ‘alirarua… akajifunika… akaingia’ unaendeleza hatua za simulizi la Kiebrania kwa mtiririko wa kawaida wa Kiswahili.
