  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano wa Kiebrania: Hezekia anaposikia ujumbe uliotangulia, anararuwa mavazi yake, anajifunika nguo ya gunia, na kuingia katika nyumba ya Yahwe. Neno ‘hayo’ ni urejeleaji wa kawaida wa Kiswahili kwa jambo lililosikiwa katika muktadha uliotangulia; haliongezi maana muhimu.'
