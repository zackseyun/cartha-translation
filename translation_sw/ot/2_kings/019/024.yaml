  text: אֲנִ֣י קַ֔רְתִּי וְ/שָׁתִ֖יתִי מַ֣יִם זָרִ֑ים וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: sw
  text: “Mimi mwenyewe nimechimba na kunywa maji ya ugenini, na kwa nyayo zangu nimekausha mikondo yote ya maji ya Misri.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mifereji yote ya Misri” au “mikondo yote ya Nile.” Neno la Kiebrania linaweza kurejelea hasa njia za maji zinazohusiana na Mto Nile.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Mimi mwenyewe
  rationale: Kiwakilishi kilichoandikwa wazi katika Kiebrania kinakazia majivuno ya msemaji; ‘Mimi mwenyewe’ kinahifadhi mkazo huo.
- source_word: קַרְתִּי
  choice: nimechimba
  rationale: Kitenzi hiki katika muktadha huu kinamaanisha kuchimba ili kupata maji. Tafsiri haiongezi ‘kisima,’ kwa kuwa hakikutajwa wazi.
- source_word: מַיִם זָרִים
  choice: maji ya ugenini
  rationale: Usemi huu unamaanisha maji yaliyo katika nchi zisizo za msemaji. ‘Ya ugenini’ ni Kiswahili cha kawaida kinachohifadhi maana ya ushindi katika nchi za kigeni bila kuyaita maji yenyewe ya ajabu.
- source_word: וְאַחְרִב
  choice: nitaikausha
  rationale: Hifili ya חרב humaanisha kufanya kitu kikauke. Umbo lisilotimilika hapa linaendeleza dai la msemaji kuhusu kile atakachofanya, hivyo wakati ujao umetumiwa.
- source_word: בְּכַף פְּעָמַי
  choice: kwa nyayo za miguu yangu
  rationale: כַּף inapohusishwa na miguu hurejelea upande wa chini wa mguu. ‘Nyayo za miguu yangu’ linahifadhi taswira halisi ya kukanyaga na kutawala kwa urahisi.
- source_word: יְאֹרֵי
  choice: mikondo yote ya maji
  rationale: יְאֹרֵי inaweza kumaanisha mikondo ya maji, hasa mifereji au matawi ya Nile. ‘Mikondo ya maji’ ni wazi na pana, huku tanbihi ikihifadhi maana mahususi zaidi.
- source_word: מָצוֹר
  choice: Misri
  rationale: Katika muungano huu na יְאֹרֵי, מָצוֹר inaeleweka vizuri kuwa jina la kishairi la Misri, si ‘kuzingirwa’ au ‘ngome.’
theological_decisions:
- issue: Mhusika na nguvu ya majivuno ya usemi wa nafsi ya kwanza
  choice: Usemi umetafsiriwa kama majivuno ya mfalme bila kuupunguza au kuufafanua kiteolojia ndani ya mstari.
  alternative: Kuutaja wazi ndani ya mstari kuwa ni mfalme wa Ashuru anayesema, au kuufafanua kama propaganda ya kijeshi tu.
  rationale: Muktadha humtambulisha msemaji, lakini mstari wenyewe unatumia majivuno mafupi na yenye taswira kali. Tafsiri inahifadhi usemi huo bila kuongeza ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. ‘Maji ya ugenini’ huepuka usemi usio wa kawaida ‘maji ya kigeni,’ na ‘mikondo ya maji’ huhifadhi upana wa neno la Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, yaani mikondo ya Misri.
