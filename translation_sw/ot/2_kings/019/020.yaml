base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: sw
  text: 'Ndipo Isaya mwana wa Amozi akatuma ujumbe kwa Hezekia, akisema, “BWANA, Mungu wa Israeli, asema hivi: Nimeyasikia maombi yako kwangu kuhusu Senakeribu mfalme wa Ashuru.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma ujumbe
  rationale: Kitenzi cha Kiebrania ni ‘akatuma’; kwa kuwa mpokeaji ni Hezekia na maneno yanafuata, ‘akatuma ujumbe’ ni Kiswahili cha kawaida kinachowasilisha maana bila kudai wazi kwamba Isaya alimtuma mtu fulani.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי ... שָׁמָעְתִּי
  choice: Nimeyasikia maombi yako kwangu ...
  rationale: Muundo wa asili ni halisi kwa karibu ‘ulichoniomba ... nimesikia.’ Kiswahili hiki huwasilisha kwa kawaida kwamba Mungu amesikia maombi ya Hezekia, bila kuongeza ahadi isiyotajwa ya kuyajibu.
- source_word: אֶל סַנְחֵרִב
  choice: kuhusu Senakeribu
  rationale: Kihusishi אֶל hapa kinaonyesha jambo lililohusu maombi, si kwamba Hezekia alimwomba Senakeribu.
theological_decisions:
- issue: Maana ya Mungu ‘kusikia’ maombi
  choice: Nimeyasikia maombi yako
  alternative: Nimejibu maombi yako
  rationale: Neno שָׁמָעְתִּי linasema ‘nimesikia’; tafsiri haipaswi kulipanua moja kwa moja kuwa ‘nimejibu,’ ingawa muktadha unaonyesha jibu linalofuata.
- issue: Uhusiano wa אֲשֶׁר na kauli kuu
  choice: Muundo wa maombi yaliyosikiwa
  alternative: Kwa sababu umeniomba ... nimesikia
  rationale: אֲשֶׁר hapa inaweza kutafsiriwa kwa namna ya ‘ulichoniomba’; kuifanya sababu kwa ‘kwa sababu’ kunaweza kuashiria uhusiano wa kisababishi ulio wazi zaidi kuliko Kiebrania.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Isaya, Amozi, Hezekia, Senakeribu, na Ashuru.'
