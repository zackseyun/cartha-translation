- source_word: בְּנִינְוֵה
  choice: Ninawi
  rationale: Jina la mahali limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Senakeribu mfalme wa Ashuru
  rationale: Hudumisha jina na cheo chake kwa mpangilio wa karibu na chanzo na kwa majina yaliyozoeleka katika Kiswahili cha Biblia.
