base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: sw
  text: 'Kwa hiyo, hivi ndivyo Yahwe asemavyo kuhusu mfalme wa Ashuru: “Hataingia katika mji huu, wala hatapiga mshale humo, wala hataukaribia akiwa na ngao[a], wala hatajenga tuta la kuuzingira[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatausogelea kwa ngao.” Huenda Kiebrania kinamaanisha kuukaribia mji huku askari wakijikinga kwa ngao wakati wa kuuzingira.
    reason: lexical_alternative
  - marker: b
    text: Au, “hatarundika tuta la kuuzingira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Inaonyesha kuwa tamko hili ni hitimisho linalotokana na ujumbe wa Mungu uliotangulia.
- source_word: כֹּה אָמַר
  choice: hivi ndivyo ... asemavyo
  rationale: Ni njia ya kawaida na yenye heshima ya Kiswahili ya kuwasilisha fomula ya kinabii, huku wakati wa sasa ukihifadhi nguvu ya tangazo hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inalihifadhi jina la Mungu lililo katika maandishi ya Kiebrania kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: kuhusu mfalme wa Ashuru
  rationale: Katika muktadha huu אֶל inamtambulisha yule ambaye ujumbe unamhusu, si lazima yule anayeambiwa moja kwa moja.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: Hataingia katika mji huu
  rationale: Kitenzi kinaeleza mwendo wa kuingia mjini; kauli ya wakati ujao yenye ukanushi ni ya kawaida na wazi kwa Kiswahili.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: hatapiga mshale humo
  rationale: ‘Kupiga mshale’ ni usemi wa kawaida wa Kiswahili unaohifadhi picha halisi ya shambulio.
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: hataukaribia akiwa na ngao
  rationale: Inahifadhi wazo la kuusogelea mji kwa ngao bila kufafanua kupita kiasi mbinu kamili ya kivita, ambayo Kiebrania haielezi wazi kabisa.
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: hatajenga tuta la kuuzingira
  rationale: Katika muktadha wa vita, usemi huu unamaanisha kuinua au kujenga tuta la udongo kwa ajili ya kuushambulia mji uliozingirwa.
- source_word: סֹלְלָה
  choice: tuta la kuuzingira
  rationale: Ni muundo wa udongo uliojengwa dhidi ya mji wakati wa kuuzingira; tafsiri hii inaeleweka kwa msomaji wa sasa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo, na ni tahajia inayofaa katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kinabii lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa vifungu vya ukanushi unaendelezwa kwa kurudia ‘wala’ ili kuhifadhi uzito na mfuatano wa Kiebrania.
