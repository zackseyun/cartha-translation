base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: sw
  text: 'Na hii ndiyo itakayokuwa ishara kwako: Mwaka huu, kula mazao yanayojimea[a], na mwaka wa pili yale yanayochipuka kutokana nayo[b]; na mwaka wa tatu pandeni mbegu na vuneni, pandeni mizabibu na kula matunda yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mazao yanayoota bila kupandwa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania hapa ni adimu; huenda likamaanisha “mazao ya pili,” yaani mazao yanayoota mwaka wa pili kutokana na yale yaliyojiotea mwaka uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: ishara
  rationale: Neno אוֹת kwa kawaida humaanisha ishara au uthibitisho; “ishara” ni neno la kawaida na linalofaa katika muktadha huu wa uhakikisho wa kinabii.
- source_word: אָכוֹל
  choice: mtakula
  rationale: Ingawa umbo hili linaweza kuwa na nguvu ya agizo, katika kauli ya ishara hapa linaeleweka kiasili kama utabiri wa kile watakachokula.
- source_word: סָפִיחַ
  choice: mazao yanayoota yenyewe
  rationale: Neno hilo linataja mimea au mazao yanayoota bila kupandwa; tafsiri hii ni wazi kuliko istilahi ya kitaalamu.
- source_word: סָחִישׁ
  choice: yanayochipuka kutokana nayo
  rationale: Neno hili adimu huenda likamaanisha mazao ya pili yanayotokana na yale yaliyojiotea mwaka uliotangulia; usemi huu unadumisha uhusiano huo bila kudai uhakika usiokuwapo.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: pandeni mbegu na kuvuna
  rationale: Vitenzi vya wingi vina nguvu ya amri; Kiswahili cha kawaida hutumia “pandeni mbegu” kwa kupanda mazao na “kuvuna” kwa kuyakusanya.
- source_word: וְנִטְעוּ כְרָמִים
  choice: pandeni mashamba ya mizabibu
  rationale: כְרָמִים ni mashamba ya mizabibu, na usemi huu ni wa kawaida na unaoeleweka katika Kiswahili.
- source_word: וְאִכְלוּ פִרְיָם
  choice: na kula matunda yake
  rationale: Kiambishi cha Kiebrania kinaelekeza kwa mashamba ya mizabibu; katika Kiswahili “matunda yake” hurejelea kwa kawaida zao la mizabibu hiyo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wingi katika “mtakula” na amri “pandeni” unaonyesha kwamba ingawa ishara inaelekezwa kwa mfalme, maelekezo yanahusu jamii. Viunganishi vya “na” vimehifadhiwa bila kuingiza utofautishaji usiokuwapo katika Kiebrania.
