  text: יַ֚עַן הִתְרַגֶּזְ/ךָ֣ אֵלַ֔/י וְ/שַׁאֲנַנְ/ךָ֖ עָלָ֣ה בְ/אָזְנָ֑/י וְ/שַׂמְתִּ֨י חַחִ֜/י בְּ/אַפֶּ֗/ךָ וּ/מִתְגִּ/י֙ בִּ/שְׂפָתֶ֔י/ךָ וַ/הֲשִׁ֣בֹתִ֔י/ךָ בַּ/דֶּ֖רֶךְ אֲשֶׁר בָּ֥אתָ בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: sw
  text: Kwa sababu ghadhabu yako dhidi yangu na hali yako ya kujiona salama vimefika masikioni mwangu[a], nitatia ndoana yangu puani mwako na hatamu yangu midomoni mwako; nami nitakurudisha kwa njia ile uliyokuja nayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiburi chako,” au “kujiamini kwako.” Neno la Kiebrania linaonyesha hali ya utulivu au ya kujiona salama; hapa linatumika katika muktadha wa uadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Kwa sababu
  rationale: Kinaanzisha sababu ya hukumu inayofuata kwa Kiswahili cha kawaida na wazi.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: ghadhabu yako dhidi yangu
  rationale: Kinaonyesha hasira kali na uadui wa mfalme dhidi ya Mungu bila kuongeza tafsiri ya kiburi ndani ya kirai hiki.
- source_word: שַׁאֲנַנְךָ
  choice: kujiona salama kwako
  rationale: Neno linahusu hali ya kuwa katika utulivu au usalama wa kujiamini; katika muktadha huu hali hiyo ina ladha ya majivuno. Chaguo hili linahifadhi kiini cha neno huku tanbihi ikitoa maana mbadala.
- source_word: עָלָה בְאָזְנָי
  choice: vimefika masikioni mwangu
  rationale: Hii ni njia ya asili ya Kiswahili ya kuwasilisha tamathali ya jambo kusikiwa na Mungu, huku ikidumisha picha ya masikio.
- source_word: חַחִי
  choice: ndoana yangu
  rationale: Ndoana ni kifaa kinachotiwa puani ili kumdhibiti mnyama au mateka, na inadumisha picha kali ya kufedheheshwa na kudhibitiwa.
- source_word: בְּאַפֶּךָ
  choice: puani mwako
  rationale: Hapa אַף ina maana halisi ya pua, si hasira, kwa sababu ya picha ya ndoana.
- source_word: מִתְגִּי
  choice: lijamu yangu
  rationale: Lijamu ni kifaa kinachowekwa kinywani ili kumwelekeza na kumdhibiti mnyama; kinafaa katika ulinganifu na ndoana.
- source_word: בִּשְׂפָתֶיךָ
  choice: midomoni mwako
  rationale: Inafuata kwa karibu neno la Kiebrania ‘midomo’ badala ya kulirahisisha kuwa ‘kinywani.’
- source_word: וַהֲשִׁבֹתִיךָ
  choice: nitakurudisha
  rationale: Kitenzi cha kisababishi kinaonyesha kuwa Mungu ndiye atakayemfanya adui arudi.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: kwa njia ile uliyokuja nayo
  rationale: 'Kinahifadhi ulinganifu wa hukumu: mvamizi atarudishwa kwa njia ileile aliyotumia kuja.'
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa sifa za kibinadamu katika kusikia na kumdhibiti mfalme wa Ashuru
  choice: Kuhifadhi picha za ‘masikioni mwangu,’ ‘ndoana yangu,’ na ‘lijamu yangu.’
  alternative: Kuzibadili kuwa kauli dhahania kama ‘nimesikia’ na ‘nitakudhibiti.’
  rationale: Picha hizi zinaonyesha kwa nguvu kwamba Mungu anajua uasi wa mfalme na ana mamlaka ya kumfedhehesha na kumrudisha nyuma, bila kutoa maelezo ya kinadharia kuhusu asili ya Mungu.
- issue: Maana ya שַׁאֲנַנְךָ
  choice: kujiona salama kwako
  alternative: kiburi chako; kujiamini kwako; hali yako ya kutokuwa na wasiwasi
  rationale: Neno kimsingi linaonyesha utulivu, usalama, au kujiamini. Muktadha unaifanya hali hiyo iwe ya lawama na majivuno, lakini tafsiri kuu haipaswi kuondoa wigo wake wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka, huku picha halisi za kishairi za ndoana, pua, lijamu, midomo, na masikio zikihifadhiwa.
