  text: כִּ֤י מִ/ירוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: sw
  text: Kwa maana mabaki yatatoka Yerusalemu, na walionusurika watatoka Mlima Sayuni. Shauku[a] ya Yahwe itafanya jambo hili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wivu wa Yahwe.” Neno la Kiebrania linaweza kumaanisha “shauku” au “wivu”; hapa linahusu kujitoa kwa Yahwe kwa moyo wote ili kuleta ukombozi wa Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au uhakikisho wa ahadi iliyotangulia kwa Kiswahili cha kawaida.
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: mabaki yatatoka Yerusalemu
  rationale: “Mabaki” huhifadhi maana ya wale waliobaki baada ya hukumu au janga; “yatatoka” hudumisha taswira ya mwendo kutoka mahali.
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: na walionusurika watatoka Mlima Sayuni
  rationale: “Walionusurika” ni Kiswahili cha kawaida kwa watu walioepuka maafa; kitenzi kimerudiwa ili kukamilisha kishazi sambamba kwa uwazi.
- source_word: קִנְאַת
  choice: Shauku
  rationale: Hapa neno linaonyesha msukumo wenye nguvu na kujitoa kwa Yahwe kutekeleza wokovu; tanbihi inadumisha maana nyingine halisi ya “wivu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: itafanya jambo hili
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayoonyesha kwamba shauku ya Yahwe ndiyo italeta matokeo yaliyotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, kwa hiyo tafsiri inalihifadhi kama jina badala ya kuweka cheo.
- issue: Maana ya קִנְאַת יְהוָה
  choice: Shauku ya Yahwe
  alternative: Wivu wa Yahwe
  rationale: Katika muktadha huu neno linaelekea kuonyesha kujitoa kwa nguvu kwa Yahwe kuwakomboa watu wake, lakini uwezekano wa maana “wivu” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio sambamba wa Yerusalemu na Mlima Sayuni umehifadhiwa, huku kitenzi cha pili kikiongezwa kwa uwazi wa kawaida wa Kiswahili.
