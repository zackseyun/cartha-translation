base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: sw
  text: Na sasa, Yahwe Mungu wetu, tafadhali utuokoe kutoka mkononi mwake[a], ili falme zote za dunia[b] zijue kwamba wewe, Yahwe, peke yako ndiye Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kutoka mkononi mwake”; huu ni msemo unaomaanisha kuokolewa kutoka katika nguvu au mamlaka yake.
    reason: cultural_note
  - marker: b
    text: Au “falme zote za nchi”; lakini katika muktadha huu “dunia” linafaa zaidi kwa sababu mazungumzo yanahusu falme za mataifa mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na alama ya wakati עַתָּה, inayotanguliza ombi kuu la sala.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Muundo huu una kiambishi cha nafsi ya kwanza wingi na unatafsiriwa kwa kawaida kuwa “Mungu wetu.”
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: tafadhali utuokoe
  rationale: Kitenzi cha amri הוֹשִׁיעֵנוּ kinaomba wokovu au ukombozi, na chembe נָא inaonyesha ombi la kusihi, linalowasilishwa kwa “tafadhali.”
- source_word: מִיָּדוֹ
  choice: kutoka mkononi mwake
  rationale: Huhifadhi sitiari ya Kiebrania ya kuokolewa kutoka katika mamlaka au nguvu ya mtu; maelezo mafupi yametolewa katika tanbihi.
- source_word: וְיֵדְעוּ
  choice: ili ... zijue
  rationale: Katika muktadha huu umbo la kitenzi linaonyesha kusudi au matokeo ya ombi, jambo linalowasilishwa kwa Kiswahili cha kawaida kwa “ili.”
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: falme zote za dunia
  rationale: Muktadha unahusu mataifa na falme mbalimbali, kwa hiyo “dunia” linafaa zaidi kuliko “nchi,” huku uwezekano huo mwingine ukitajwa katika tanbihi.
- source_word: כִּי
  choice: kwamba
  rationale: Hutanguliza maudhui ya jambo ambalo falme zinapaswa kulijua.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: wewe, Yahwe, peke yako ndiye Mungu
  rationale: Muundo huu huhifadhi jina Yahwe, kauli kwamba yeye ndiye Mungu, na msisitizo wa upekee unaotolewa na לְבַדֶּךָ.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia moja kwa moja jina la Mungu יהוה; “Yahwe” huhifadhi jina hilo badala ya kuliweka kwa cheo.
- issue: Nguvu ya לְבַדֶּךָ katika ungamo
  choice: wewe, Yahwe, peke yako ndiye Mungu
  alternative: wewe ndiwe Yahwe Mungu, wewe peke yako
  rationale: Chaguo hili huonyesha wazi upekee unaosisitizwa na Kiebrania bila kuongeza ufafanuzi wa kimadhehebu, na pia hudumisha uhusiano wa kisarufi kwamba Yahwe ndiye Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi mtiririko wa sala, sitiari ya “mkono,” jina Yahwe, na msisitizo wa “peke yako” bila kuwa nzito au ya kizamani.
