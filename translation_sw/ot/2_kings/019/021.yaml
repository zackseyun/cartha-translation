base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: sw
  text: 'Hili ndilo neno ambalo Yahweh amesema kumhusu: “Bikira, binti Sayuni, anakudharau[a]; anakudhihaki. Binti Yerusalemu anatikisa kichwa chake[b] nyuma yako.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bikira, binti Sayuni, amekudharau na amekudhihaki.”
    reason: Maumbo ya vitenzi vya Kiebrania yanaweza kutafsiriwa kwa wakati timilifu, ingawa wakati wa sasa unafaa katika kejeli hii ya kishairi.
  - marker: b
    text: Kutika kichwa hapa ni ishara ya dharau au dhihaka.
    reason: Nahau hii ya kutikisa kichwa inaweza isieleweke kwa msomaji wa sasa bila maelezo ya maana yake katika muktadha huu.
lexical_decisions:
- source_word: הַדָּבָר
  choice: neno
  rationale: Katika utangulizi wa ujumbe wa kinabii, “neno” ni tafsiri wazi na ya kawaida ya דָּבָר, huku ikihifadhi wazo la tamko la Mungu.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: Yahwe amesema kumhusu
  rationale: עַל pamoja na דִּבֶּר hapa inaonyesha anayehusu ujumbe. “Kumhusu” haiingizi kwa lazima maana ya “dhidi yake,” ingawa muktadha una hukumu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: בָּזָה
  choice: anakudharau
  rationale: Kitenzi hiki humaanisha kumwona au kumtendea mtu kwa dharau. Wakati wa sasa unafaa katika kejeli hii ya kishairi.
- source_word: לָעֲגָה
  choice: kukudhihaki
  rationale: “Kudhihaki” ni Kiswahili cha sasa na chenye heshima kinachoonyesha kejeli au kumfanyia mtu mzaha wa kumdunisha.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: Bikira, binti Sayuni
  rationale: Usemi huu wa kishairi unaipa Sayuni sura ya mwanamke na kuhifadhi maneno yote mawili, “bikira” na “binti,” bila kuyafanya kuwa jina lisiloeleweka katika Kiswahili.
- source_word: אַחֲרֶיךָ
  choice: nyuma yako
  rationale: Maana ya mahali “nyuma yako” inafaa kwa taswira ya adui anayeondoka huku Yerusalemu akimdhihaki.
- source_word: רֹאשׁ הֵנִיעָה
  choice: anakutikisia kichwa
  rationale: Hii huhifadhi kitendo halisi cha nahau ya Kiebrania; tanbihi inaeleza kwamba katika muktadha huo ni ishara ya dharau.
- source_word: בַּת יְרוּשָׁלִָם
  choice: Binti Yerusalemu
  rationale: Tafsiri hii fupi inadumisha uhusishaji wa mji na mwanamke pamoja na usambamba wake na “binti Sayuni.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya nyakati katika vitenzi vya kejeli
  choice: anakudharau … kukudhihaki … anakutikisia
  alternative: amekudharau … amekudhihaki … amekutikisia
  rationale: Maumbo ya Kiebrania yanaweza kusimulia tendo kama lililotimia, lakini ndani ya wimbo wa kejeli yanaweza kuwasilisha kitendo kwa uhai. Wakati wa sasa ni wa asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa wakati timilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na ya kishairi bila kuwa ya kizamani. Muundo wa usambamba kati ya Sayuni na Yerusalemu umehifadhiwa.
