  source_fidelity: 'Maana ya msingi imehifadhiwa: Yahweh ananena kumhusu mfalme wa Ashuru, Sayuni humdharau na kumdhihaki, na Yerusalemu hutikisa kichwa chake nyuma yake. Hata hivyo, jina la Mungu linapaswa kufuata uamuzi wa mradi na kutoholewa “Yahweh,” si “Yahwe.” Pia, kitenzi “anakutikisia kichwa” si uwasilishaji wa moja kwa moja na wa kawaida wa kitendo cha Kiebrania; “anatikisa kichwa chake” huweka wazi kiungo cha kichwa na mtenda.'
