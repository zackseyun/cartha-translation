source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: sw
  text: Hezekia akasali mbele ya Yahwe, akasema, “Yahwe, Mungu wa Israeli, uketiye juu ya makerubi[a], wewe peke yako ndiwe Mungu juu ya falme zote za dunia. Wewe umezifanya mbingu na dunia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uketiye kati ya makerubi.” Kiebrania husema “uketiye makerubi” na hakielezi wazi uhusiano wa mahali; ni taswira ya kifalme na ya ibada inayomwonyesha Yahwe akiwa ametawazwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: akasali
  rationale: Kitenzi hiki kimsingi humaanisha kusali; “akasali” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi maana ya kusali mbele au katika uwepo wa Yahwe kwa usemi wa kawaida wa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa herufi nne limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni muundo wa moja kwa moja wa umilikaji na unafaa katika sala ya kumwita Mungu.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: unayeketi juu ya makerubi
  rationale: “Kuketi” huhifadhi kitenzi cha Kiebrania, huku “juu ya” ikidokeza taswira ya kifalme ya Yahwe akiwa juu ya makerubi bila kuifanya kuwa maelezo marefu ndani ya mstari.
- source_word: אַתָּה הוּא הָאֱלֹהִים ... לְבַדְּךָ
  choice: wewe peke yako ndiwe Mungu
  rationale: Huwasilisha msisitizo wa Kiebrania na upekee wa Mungu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: wa falme zote za dunia
  rationale: Huhifadhi uhusiano wa Mungu na falme zote za dunia kwa usemi wa asili, bila kulazimisha kihusishi cha Kiebrania kuwa na maana moja finyu.
- source_word: עָשִׂיתָ
  choice: umezifanya
  rationale: Kitenzi עָשָׂה ni “kufanya/kutengeneza”; “umezifanya” ni cha moja kwa moja zaidi kuliko kutumia kitenzi mahususi cha “kuumba.”
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: mbingu na dunia
  rationale: Huhifadhi jozi ya kawaida ya uumbaji na wingi wa neno “mbingu” katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la Mungu, kwa hiyo limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- issue: Upekee wa Mungu na mamlaka yake kwa falme zote
  choice: wewe peke yako ndiwe Mungu wa falme zote za dunia
  alternative: wewe ndiwe Mungu, wewe peke yako, juu ya falme zote za dunia
  rationale: Uteuzi huu huhifadhi tamko la upekee wa Mungu pamoja na upeo wake wa ulimwengu wote, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Taswira ya Yahwe na makerubi
  choice: unayeketi juu ya makerubi
  alternative: unayeketi kati ya makerubi; unayetawala ukiwa juu ya makerubi
  rationale: Kiebrania kina taswira ya kifalme na ya ibada, lakini hakitaji wazi “kiti cha enzi” wala hakibainishi kikamilifu uhusiano wa mahali; tafsiri na tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mbele za Yahwe” na “wewe peke yako ndiwe Mungu” ni misemo inayoeleweka kwa urahisi huku ikihifadhi uzito wa sala. “Makerubi” limetumiwa kama wingi wa “kerubi.”
