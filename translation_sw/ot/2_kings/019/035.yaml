base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: sw
  text: Usiku huo, malaika wa Yahweh akatoka, akawaua watu 185,000 katika kambi ya Ashuru. Watu walipoamka asubuhi na mapema[a], tazama, wote walikuwa maiti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri ya moja kwa moja zaidi ni, “Nao wakaamka asubuhi na mapema.” Kiebrania hakitaji wazi ni nani walioamka.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mizoga, wafu”—usemi wa msisitizo kuhusu wale waliouawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Usiku huo
  rationale: Muundo wa simulizi wa Kiebrania, ‘ikawa usiku huo,’ umefupishwa kwa Kiswahili cha sasa bila kupoteza kiungo cha wakati.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ hapa humaanisha mjumbe wa mbinguni anayetekeleza hukumu; jina la agano יְהוָה limetoholewa kuwa ‘Yahweh.’
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Huwakilisha kwa kawaida mwendo wa יצא katika mfuatano wa simulizi.
- source_word: וַיַּךְ
  choice: akawaua
  rationale: Ingawa kitenzi נכה kimsingi ni ‘kupiga,’ muktadha na matokeo yaliyoelezwa wazi yanaonyesha pigo la kuua; ‘akawaua’ ni Kiswahili cha kawaida na sahihi hapa.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: katika kambi ya Ashuru
  rationale: Huhifadhi muundo wa chanzo; ‘Ashuru’ hapa huwakilisha jeshi la Waashuru.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: watu 185,000
  rationale: Nambari ni 185,000; ‘watu’ huwekwa ili nambari ya waliouawa isomeke kwa kawaida katika Kiswahili, kwa kurejelea wanajeshi kambini.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Walipoamka asubuhi na mapema
  rationale: Nafsi ya tatu wingi ya Kiebrania haina mtendaji aliyetajwa wazi. ‘Walipoamka’ huhifadhi kutotajwa huko badala ya kuongeza ‘watu.’
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Huhifadhi alama ya kisanaa inayovuta fikira kwenye jambo la kushangaza lililoonekana.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: wote walikuwa maiti
  rationale: Ni Kiswahili cha asili kinachowasilisha hali ya jumla ya waliopigwa; tanbihi inaonyesha msisitizo wa usemi wa Kiebrania ‘mizoga/maiti, wafu.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kina jina la Mungu lenye herufi nne moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Muktadha unaonyesha mtendaji wa mbinguni, lakini tafsiri haiongezi madai kuhusu asili yake zaidi ya yale yaliyomo katika kirai cha chanzo.
- issue: Mtendaji wa kuamka asubuhi
  choice: Walipoamka
  alternative: Watu walipoamka
  rationale: Kiebrania kina nafsi ya tatu wingi bila kutaja wazi ni akina nani; tafsiri huhifadhi hali hiyo badala ya kuamua kama ni Waashuru au watazamaji wengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Mfuatano wa ‘aka-’ umetumiwa katika matendo ya simulizi; ‘tazama’ huhifadhi nguvu ya וְהִנֵּה. Alama zote za tanbihi zimewekwa katika matini kuu.
