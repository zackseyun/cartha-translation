base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: sw
  text: Ndiyo maana wakaaji wao hawakuwa na nguvu[a]; walifadhaika na wakaibika. Walikuwa kama majani ya kondeni na mimea michanga ya kijani, kama majani juu ya paa, na kama mimea iliyoteketezwa kabla haijakomaa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wenye mikono mifupi,” nahau yenye maana ya kukosa uwezo au nguvu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania katika taswira hii ya kilimo ni kifupi. Inaweza pia kutafsiriwa, “kama ukame kabla ya nafaka kusimama,” au “kama mimea iliyoteketezwa kabla haijachipuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: wakaaji wake
  rationale: Kiambishi cha umilikaji kinarejelea miji iliyotajwa katika muktadha. “Wakaaji wake” ni Kiswahili cha kawaida na huhifadhi maana ya watu walioishi humo.
- source_word: קִצְרֵי יָד
  choice: hawakuwa na nguvu
  rationale: Nahau hii, kwa neno halisi “wenye mkono mfupi,” humaanisha kukosa uwezo au nguvu. Tafsiri hii hutoa maana ya nahau kwa uwazi.
- source_word: חַתּוּ
  choice: walifadhaika
  rationale: Kitenzi kinaweza kuonyesha kuvunjwa moyo, kutishwa, au kufadhaishwa. “Walifadhaika” ni ya asili na huhifadhi hali ya kushindwa bila kuongeza maelezo yasiyo katika maandishi.
- source_word: וַיֵּבֹשׁוּ
  choice: na kuaibika
  rationale: Kitenzi kinaonyesha kupata aibu au kufedheheshwa; “kuaaibika” ni usemi wa kawaida unaofaa katika ulinganifu huu.
- source_word: הָיוּ
  choice: Walikuwa kama
  rationale: Kitenzi kinaanzisha mfululizo wa mifano. “Walikuwa kama” ni cha karibu na muundo wa Kiebrania na ni cha asili kwa Kiswahili.
- source_word: עֵשֶׂב שָׂדֶה
  choice: majani ya kondeni
  rationale: Huhifadhi taswira ya mimea au majani yanayoota kondeni kwa lugha fupi na ya kishairi.
- source_word: וִירַק דֶּשֶׁא
  choice: mimea michanga ya kijani
  rationale: Kirai hiki kinaonyesha uoto mpya, laini na wa kijani. “Mimea michanga ya kijani” hufanya taswira hiyo ieleweke kwa msomaji wa sasa.
- source_word: חֲצִיר גַּגּוֹת
  choice: majani ya juu ya paa
  rationale: Taswira ni ya majani yanayoota katika udongo mwembamba juu ya paa na hivyo kukauka upesi. Tafsiri huhifadhi mahali bila kueleza maana iliyodokezwa.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: mimea iliyokauka kabla haijamea
  rationale: 'Kiebrania ni kifupi na kina taswira ya kilimo: ukavu au uharibifu unaotokea kabla nafaka haijasimama shambani. Tafsiri kuu ni ya asili, huku tanbihi ikihifadhi uwezekano mwingine wa kuelewa kirai hicho.'
