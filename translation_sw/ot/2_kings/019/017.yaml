  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת הַ/גּוֹיִ֖ם וְ/אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: sw
  text: Kweli[a], ee Yahwe, wafalme wa Ashuru wamefanya mataifa na nchi zao[b] kuwa ukiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Naam” au “Hakika.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “nchi yao”; umoja hapa huenda umetumiwa kwa maana ya kijumla au ya mgawanyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: Kweli
  rationale: Neno hili linaanzisha uthibitisho wenye mkazo wa jambo lililotangulia. “Kweli” ni Kiswahili cha kawaida na chenye hadhi; pia kinaweza kueleweka kwa maana ya “naam” au “hakika.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: הֶחֱרִיבוּ
  choice: wamefanya ... kuwa ukiwa
  rationale: Hifili ya חרב hapa ina maana ya kusababisha uharibifu au ukiwa. Usemi huu unaonyesha matokeo ya mashambulizi ya kijeshi bila kulazimisha maana ya kuangamiza kila kitu kabisa.
- source_word: מַלְכֵי אַשּׁוּר
  choice: wafalme wa Ashuru
  rationale: Huu ni uhamishaji wa wazi na wa kawaida wa mfuatano wa nomino za Kiebrania.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu wa kisiasa na kijeshi, neno hili linamaanisha mataifa yaliyoshindwa na Ashuru.
- source_word: אַרְצָם
  choice: nchi zao
  rationale: Ingawa “nchi” iko katika umoja kwenye Kiebrania, inarejelea kwa maana ya mgawanyo nchi za mataifa mengi; wingi ni wa kawaida na wazi zaidi katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kuliwakilisha kwa cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “wamefanya ... kuwa ukiwa” huhifadhi wazo la kusababisha ukiwa huku ukibaki wazi na wa kawaida kwa wasomaji.
