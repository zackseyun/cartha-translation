  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: sw
  text: 'Kwa njia ya wajumbe wako umemdhihaki Bwana na kusema,


    ‘Kwa magari yangu mengi ya vita,

    mimi mwenyewe nimepanda hadi vilele vya milima,

    hadi sehemu za mbali zaidi za Lebanoni.

    Nitakata mierezi yake mirefu

    na miberoshi yake iliyo bora zaidi[a].

    Nitaingia mahali pa mwisho kabisa pa kupumzikia,

    katika msitu wake wenye kustawi.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mifiri yake iliyo bora zaidi”; aina hususa ya mti unaotajwa na neno la Kiebrania haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: Kwa njia ya wajumbe wako
  rationale: Nahau בְּיַד inaonyesha njia au wakala wa tendo. “Kwa njia ya” ni Kiswahili cha asili, na “wajumbe” linafaa kwa muktadha wa kisiasa na kijeshi kuliko “malaika.”
- source_word: חֵרַפְתָּ
  choice: umemdhihaki
  rationale: Kitenzi hiki kina maana ya kumtukana, kumkejeli au kumvunjia heshima mtu kwa ujeuri. “Umemdhihaki” kinaonyesha dharau ya majivuno kwa lugha ya sasa.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Neno la Kiebrania hapa ni אֲדֹנָי, si jina יהוה. “Bwana” linadumisha tofauti hiyo bila kutumia umbo “BWANA” linalotumiwa kwa kawaida kuwakilisha jina la Mungu.
- source_word: ב/רכב רִכְבִּי
  choice: Kwa magari yangu mengi ya vita
  rationale: Kauli hii inajivunia wingi na nguvu ya magari ya vita ya msemaji. Uamuzi huu unafuata maana inayothibitishwa na muktadha na mapokeo ya usomaji, huku “magari ya vita” likiweka wazi aina ya magari yanayokusudiwa.
- source_word: אֲנִי עָלִיתִי
  choice: mimi mwenyewe nimepanda
  rationale: Kiwakilishi huru אֲנִי kinakazia mhusika. “Mimi mwenyewe” kinahifadhi mkazo wa majivuno, na “nimepanda” kinafaa kwa mwendo wa kijeshi kuelekea juu.
- source_word: מְרוֹם הָרִים
  choice: vilele vya milima
  rationale: מְרוֹם hueleza mahali palipoinuka. “Vilele vya milima” ni usemi wa kawaida unaohifadhi taswira ya kwenda juu kabisa.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: sehemu za mbali zaidi za Lebanoni
  rationale: יַרְכְּתֵי hueleza pembe, miisho au sehemu za ndani zilizo mbali. Tafsiri hii inaonyesha madai ya kufika hadi mwisho kabisa wa Lebanoni.
- source_word: קוֹמַת אֲרָזָיו
  choice: mierezi yake mirefu
  rationale: קוֹמָה ni kimo au urefu. “Mierezi yake mirefu” ni ya asili na inadumisha sifa ya miti hiyo pamoja na rejeo lake kwa Lebanoni.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: miberoshi yake iliyo bora zaidi
  rationale: מִבְחוֹר huonyesha kilichochaguliwa au bora zaidi. Utambulisho mahususi wa בְּרוֹשׁ hauna uhakika; “miberoshi” ni jina linalotumiwa kwa kundi la miti ya aina hii, na kutokuwa na uhakika kumeelezwa katika tanbihi.
- source_word: מְלוֹן קִצֹּה
  choice: mahali pake pa mwisho kabisa pa kupumzikia
  rationale: מָלוֹן ni mahali pa kukaa au kupumzikia, na קִצֹּה huonyesha mwisho wake. Tafsiri inadumisha picha isiyo ya kawaida badala ya kuibadili kimya kimya kuwa “maficho” au “sehemu ya ndani kabisa.”
- source_word: יַעַר כַּרְמִלּוֹ
  choice: msitu wake wenye rutuba
  rationale: יַעַר ni msitu, nayo כַּרְמִל inaweza kueleza eneo lenye mimea tele au lenye rutuba. “Msitu wake wenye rutuba” huwasilisha taswira hiyo kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Kutofautisha אֲדֹנָי na יהוה
  choice: Bwana
  alternative: BWANA
  rationale: Chanzo kina אֲדֹנָי badala ya tetragramatoni יהוה. Kwa hiyo “Bwana” limetumiwa ili kutohusisha kimakosa cheo hiki na jina la Mungu ambalo kwa kawaida huonyeshwa kwa “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kishairi lakini wazi na wa sasa. Mistari imepangwa kuonyesha mfululizo wa majivuno katika usemi wa moja kwa moja. Alama ya tanbihi [a] imewekwa baada ya jina la miti linalohusika, si baada ya “Bwana.”
