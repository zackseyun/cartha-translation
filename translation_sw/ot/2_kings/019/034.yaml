  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: sw
  text: Kwa maana nitaulinda mji huu ili kuuokoa, kwa ajili yangu na kwa ajili ya Daudi, mtumishi wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuukomboa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuokoa au kukomboa kutoka hatarini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: nitaulinda
  rationale: Kitenzi גנן hapa humaanisha kukinga au kulinda. “Nitaulinda” ni Kiswahili cha kawaida kinachofaa katika muktadha wa mji unaotishiwa kijeshi.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: mji huu
  rationale: Pamoja na גנן, אֶל huelekeza tendo la ulinzi kwa mji. Kiswahili cha asili hakihitaji kihusishi cha Kiebrania kutafsiriwa moja kwa moja.
- source_word: לְהוֹשִׁיעָהּ
  choice: na kuuokoa
  rationale: Kitenzi ישׁע kina maana ya kuokoa au kukomboa kutoka hatarini. “Kuuokoa” ni wazi na ya kawaida kwa mji; “na” linaonyesha kusudi/matokeo kwa mtiririko wa asili bila kupoteza infinitivu ya kusudi.
- source_word: לְמַעֲנִי
  choice: kwa ajili yangu mwenyewe
  rationale: Usemi huu unaonyesha kwamba msingi wa tendo hilo uko kwa Mungu mwenyewe. “Mwenyewe” hudhihirisha msisitizo uliomo katika kiambishi cha nafsi bila kuongeza ufafanuzi wa kimafundisho.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: na kwa ajili ya Daudi mtumishi wangu
  rationale: Huhifadhi sababu ya pili iliyoanzishwa na לְמַעַן pamoja na cheo cha Daudi kuwa mtumishi wa Mungu.
theological_decisions:
- issue: Sababu za Mungu kuuokoa Yerusalemu
  choice: Mstari unasema Mungu ataulinda na kuuokoa mji kwa ajili yake mwenyewe na kwa ajili ya Daudi mtumishi wake.
  alternative: Rejeo kwa Daudi lingeweza kueleweka kwa maana finyu kama kukumbusha tu ahadi za zamani, bila kusisitiza zaidi agano.
  rationale: Kiebrania kinataja wazi sababu mbili kwa kutumia לְמַעַן. Tafsiri inazihifadhi zote bila kufafanua zaidi namna uhusiano kati ya kusudi la Mungu na ahadi kwa Daudi unavyopaswa kueleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mji huu” na viambishi vya ngeli ya mji vimetumiwa kwa mtiririko wa kawaida; muundo unabaki mfupi na wa tamko la kiungu.
