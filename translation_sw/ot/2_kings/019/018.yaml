  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: sw
  text: Nao wakaitupa miungu yao ndani ya moto[a], kwa maana haikuwa miungu, bali kazi ya mikono ya wanadamu—mbao na mawe—hivyo wakaiangamiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaiweka miungu yao motoni.” Kitenzi cha Kiebrania kwa maana yake ya msingi ni “kutoa/kuweka,” lakini hapa kimetumiwa kwa maana ya kutupa kitu ndani ya moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: wakaitupa
  rationale: Ingawa נתן kimsingi humaanisha ‘kutoa/kuweka,’ pamoja na ‘motoni’ hapa ina maana ya kuitupa ndani ya moto. ‘Wakaitupa’ ni Kiswahili cha kawaida na hudumisha wazo la uharibifu.
- source_word: אֱלֹהֵיהֶם
  choice: miungu yao
  rationale: 'Maana ya moja kwa moja ni ‘miungu yao.’ Kutumia ‘miungu’ badala ya ‘sanamu’ huhifadhi nguvu ya hoja inayofuata: vitu vilivyoitwa miungu havikuwa miungu kwa kweli.'
- source_word: בָּאֵשׁ
  choice: motoni
  rationale: Katika muktadha wa kitendo cha kutupa, ‘motoni’ huonyesha kuelekezwa ndani ya moto kwa Kiswahili cha kawaida.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: kwa sababu haikuwa miungu
  rationale: 'Kishazi hiki kinatoa sababu ya kuweza kuiteketeza miungu hiyo: haikuwa miungu ya kweli. Upatanisho wa ‘miungu’ kama ngeli ya 4 unahitaji ‘haikuwa.’'
- source_word: כִּי אִם
  choice: bali
  rationale: '‘Bali’ huonyesha kwa ufupi utofautishaji mkali: si miungu, bali vitu vilivyotengenezwa.'
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: kazi ya mikono ya wanadamu
  rationale: Usemi huu unasisitiza kwamba vitu hivyo vilitengenezwa na watu. ‘Wanadamu’ huwasilisha maana ya jumla ya אָדָם bila kuifanya ihusu mwanamume mmoja.
- source_word: עֵץ וָאֶבֶן
  choice: miti na mawe
  rationale: Haya ndiyo malighafi ya vitu hivyo. Wingi ‘miti na mawe’ unapatana na viwakilishi vya wingi vinavyorejelea miungu hiyo.
- source_word: וַיְאַבְּדוּם
  choice: kwa hiyo waliiangamiza
  rationale: 'Umbo hili linaeleweka vyema kuwa na watenda wa wingi na yambwa inayorejelea miungu hiyo: Waashuru waliiangamiza. ‘Kwa hiyo’ huonyesha matokeo ya ukweli kwamba ilikuwa vitu vya miti na mawe tu.'
theological_decisions:
- issue: Jinsi ya kutafsiri אָדָם katika taarifa ya jumla kuhusu utengenezaji wa miungu ya uongo
  choice: wanadamu
  alternative: mwanadamu / watu
  rationale: Hapa אָדָם inawahusu binadamu kwa ujumla, si mwanamume fulani. ‘Mikono ya wanadamu’ huhifadhi tofauti kati ya Mungu aliye hai na vitu vilivyotengenezwa na binadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Motoni’ ni ya kawaida kuliko ‘ndani ya moto’; ‘bali’ huhifadhi utofautishaji wa sentensi ya Kiebrania. Umoja katika ‘haikuwa,’ ‘ilikuwa,’ na ‘waliiangamiza’ unatokana na upatanisho wa kisarufi wa nomino ‘miungu,’ ingawa maana yake ni wingi.
