base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: sw
  text: Kisha Hezekia akazipokea barua[a] kutoka mkononi mwa wale wajumbe[b] na kuzisoma. Akapanda kwenda katika nyumba ya Yahwe, naye Hezekia akaitandaza[c] mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maandishi,” “nyaraka,” au “hati-kunjo”; neno la Kiebrania lina maana pana kuliko barua za kawaida.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kutoka katika mkono wa wajumbe,” nahau yenye maana ya kupokea kutoka kwa wajumbe.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hubadilika kutoka wingi (“kuzisoma”) kwenda umoja (“akaitandaza”), huenda kikilitazama kundi la barua kama ujumbe mmoja. Kitendo cha kuitandaza mbele za Yahwe kinaonyesha kuuweka ujumbe huo mbele yake.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: barua
  rationale: Neno hili la Kiebrania linaweza kumaanisha maandishi, nyaraka, au hati-kunjo; katika muktadha huu ni ujumbe ulioandikwa ulioletwa na wajumbe, hivyo “barua” ni ya kawaida na sahihi.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: kutoka mkononi mwa wale wajumbe
  rationale: Huhifadhi taswira ya nahau ya Kiebrania, “kutoka katika mkono wa wajumbe,” huku “wajumbe” ikionyesha wazi kuwa hapa ni wanadamu waliotumwa, si malaika.
- source_word: וַיִּקְרָאֵם
  choice: na kuzisoma
  rationale: Kiambishi cha Kiebrania ni cha wingi, kikirejelea barua/maandishi hayo.
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: Huhifadhi maana ya kupanda kuelekea hekalu badala ya kuitafsiri kwa ujumla kuwa alienda tu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Ni tafsiri ya moja kwa moja ya usemi wa Kiebrania, inayobaki wazi na ya kawaida katika lugha ya Biblia.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: akaitandaza
  rationale: Kitenzi kinaeleza kuitandaza au kuieneza hati; kiambishi cha umoja katika Kiebrania kimehifadhiwa ili kuonyesha kwamba ujumbe mzima huenda unatazamwa kama kitu kimoja.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi nahau ya kutenda mbele au katika uwepo wa Yahwe.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Mabadiliko kutoka wingi kwenda umoja katika viwakilishi
  choice: “kuzisoma” lakini “akaitandaza”
  alternative: “akazitandaza”
  rationale: Kiebrania hutumia kiambishi cha wingi kwa kusoma, kisha kiambishi cha umoja kwa kutandaza. Tafsiri inadumisha mvutano huu wa kisarufi badala ya kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi umetiririshwa kwa viunganishi vya kawaida vya Kiswahili, huku picha muhimu za Kiebrania—kupokea kutoka mkononi, kupanda kwenda, nyumba ya Yahwe, na kutandaza mbele zake—zikihifadhiwa.
