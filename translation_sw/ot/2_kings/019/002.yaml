  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: sw
  text: Naye akawatuma Eliakimu, aliyekuwa msimamizi wa nyumba ya mfalme,[a] na Shebna mwandishi, pamoja na wazee wa makuhani, wakiwa wamevaa nguo za magunia,[b] waende kwa nabii Isaya mwana wa Amozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Msimamizi wa nyumba ya mfalme” alikuwa afisa mkuu aliyesimamia ikulu au shughuli za nyumba ya kifalme.
    reason: cultural_note
  - marker: b
    text: Au, “wakijifunika kwa nguo za magunia.” Umbo la Kiebrania linaweza kusisitiza tendo la kujifunika au hali ya kuwa wamevaa nguo hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Naye akawatuma
  rationale: Kauli ya wayyiqtol inaendeleza simulizi; “Naye akawatuma” ni ya asili katika Kiswahili na inadumisha mtiririko bila kuongeza maana mahususi ya wakati.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: aliyekuwa msimamizi wa nyumba ya mfalme
  rationale: Nahau hii humtaja afisa mkuu aliyesimamia nyumba au ikulu ya mfalme. “Nyumba ya mfalme” huweka picha ya Kiebrania huku “msimamizi” ikifafanua wajibu wake kwa msomaji wa sasa.
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: סֹפֵר inaweza kumaanisha mwandishi au katibu wa kifalme. “Mwandishi” ni kisawe cha moja kwa moja kisichobana cheo hicho kupita ushahidi wa maandishi.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: wazee wa makuhani
  rationale: Tafsiri hii inahifadhi muundo wa neno kwa neno na utofauti kati ya wazee na kundi la makuhani, badala ya kulirahisisha kuwa “makuhani wakuu.”
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: wakiwa wamevaa nguo za magunia
  rationale: Kirai hiki kinaeleza hali yao walipokuwa wakitumwa. “Nguo za magunia” ni usemi unaoeleweka unaohifadhi ishara ya maombolezo na kujinyenyekeza.
- source_word: אֶל יְשַׁעְיָהוּ הַנָּבִיא
  choice: waende kwa nabii Isaya
  rationale: Kitenzi “waende” kinadokezwa na tendo la kutumwa na hufanya mwelekeo wa אֶל kuwa wa asili katika Kiswahili; cheo “nabii” kinahifadhiwa wazi.
- source_word: בֶּן אָמוֹץ
  choice: mwana wa Amozi
  rationale: Hii inahifadhi utambulisho wa ukoo kwa mtindo wa kawaida wa Kiswahili na kuandika jina la Kiebrania אָמוֹץ kwa umbo linalotumika katika Biblia za Kiswahili.
