base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/027.yaml
  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: sw
  text: Lakini ninajua kuketi kwako[a], kutoka kwako na kuingia kwako, na hasira yako dhidi yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nahau ya Kiebrania “kuketi kwako, kutoka kwako na kuingia kwako” inaeleza kwa ujumla shughuli, mienendo na mwenendo wote wa mtu.
    reason: cultural_note
  - marker: b
    text: Au “ghadhabu yako dhidi yangu” au “msukosuko wako dhidi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: kuketi kwako
  rationale: Huhifadhi picha halisi ya kitenzi ישׁב katika mfululizo wa maneno unaoeleza kwa ujumla mwenendo na shughuli zote za mtu.
- source_word: וְצֵאתְךָ
  choice: kutoka kwako
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya יצא, inayolingana vizuri na ‘kuingia kwako.’
- source_word: וּבֹאֲךָ
  choice: kuingia kwako
  rationale: Hukamilisha jozi ya kinahau ‘kutoka na kuingia’ kwa Kiswahili cha kawaida.
- source_word: יָדָעְתִּי
  choice: ninajua
  rationale: Ingawa kitenzi ni timilifu katika Kiebrania, hapa kinaonyesha ufahamu thabiti na wa sasa wa Mungu; ‘ninajua’ huwasilisha nguvu hiyo kwa kawaida.
- source_word: הִתְרַגֶּזְךָ
  choice: jinsi unavyonikasirikia
  rationale: Muundo wa Hitpaeli wa רגז huonyesha msukosuko wa hasira au ghadhabu. Kauli hii ni ya kawaida katika Kiswahili na huhifadhi uhasama unaoelekezwa kwa Mungu bila kuongeza wazo la dharau.
- source_word: אֵלַי
  choice: -ni- katika ‘unavyonikasirikia’
  rationale: Kihusishi אֶל kwa kawaida ni ‘kwa/kuelekea,’ lakini pamoja na hasira hapa huonyesha kuwa Mungu ndiye anayelengwa; Kiswahili huiwasilisha kiasili kwa kiambishi cha yambwa ‘-ni-.’
- source_word: וְאֵת
  choice: na
  rationale: Kiunganishi pamoja na kiashiria cha yambwa huanzisha kitu cha mwisho kinachojulikana; ‘na’ huendeleza sentensi kwa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo halisi wa nahau ya Kiebrania umehifadhiwa katika mstari, huku maana yake ikifafanuliwa katika tanbihi. ‘Unavyonikasirikia’ ni ya asili zaidi kuliko nomino nzito, na tanbihi huhifadhi uwezekano wa maana ya msukosuko au ghadhabu.
