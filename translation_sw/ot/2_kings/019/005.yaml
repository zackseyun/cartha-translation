  language: sw
  text: Basi, watumishi wa Mfalme Hezekia wakaja kwa Isaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Basi, ... wakaja
  rationale: Kitenzi cha wayyiqtol kutoka בוא kinaendeleza mfululizo wa simulizi. “Basi” ni kiunganishi cha kawaida cha Kiswahili kinachoonyesha hatua inayofuata bila kulazimisha maana ya sababu; “wakaja” ndiyo maana ya msingi.
- source_word: עַבְדֵי
  choice: watumishi wa
  rationale: Wingi wa hali ya kutegemeana wa עבד unaweza kumaanisha watumishi, wahudumu wa kifalme, au maafisa. “Watumishi wa” huhifadhi upana wa neno la Kiebrania na inafaa katika mazingira ya ikulu bila kuongeza tafsiri finyu.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye uainisho ikifuatiwa na jina humtambulisha Hezekia kwa cheo chake; “Mfalme Hezekia” ni mpangilio wa kawaida na wa heshima katika Kiswahili.
- source_word: חִזְקִיָּהוּ
  choice: Hezekia
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֶל
  choice: kwa
  rationale: Kihusishi kinaonyesha mwendo unaomwelekea mtu. “Kwa Isaya” ni Kiswahili cha kawaida kwa maana ya kwenda mahali alipo mtu au kumfikia.
- source_word: יְשַׁעְיָהוּ
  choice: Isaya
  rationale: Umbo la jina la nabii linalotumika kwa kawaida katika Kiswahili.
