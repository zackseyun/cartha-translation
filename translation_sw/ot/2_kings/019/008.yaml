base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/008.yaml
  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: sw
  text: Ndipo Rabshake akarudi, akamkuta mfalme wa Ashuru akipigana dhidi ya Libna, kwa sababu alikuwa amesikia kwamba mfalme alikuwa ameondoka kutoka Lakishi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa ameanza safari kutoka Lakishi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuondoka, kuanza safari, au kung’oa kambi katika mazingira ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שׁוּב kinaonyesha kurudi kwa mtu au mahali alikokuwa awali; mfululizo wa vitenzi vya Kiswahili unaendeleza simulizi kwa kawaida.
- source_word: רַב שָׁקֵה
  choice: yule Rabshake
  rationale: Cheo hiki cha Kiashuru kinatumika kama utambulisho unaofanana na jina katika simulizi. Kukihifadhi kwa unukuzi huepuka tafsiri ya kiutendaji inayoweza kupotosha.
- source_word: וַיִּמְצָא אֶת
  choice: akamkuta
  rationale: מָצָא pamoja na alama ya yambwa ina maana ya kumpata au kumkuta; “akamkuta” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania.
- source_word: נִלְחָם עַל
  choice: akipigana dhidi ya
  rationale: Umbo la kitenzi linaonyesha tendo linaloendelea, na עַל pamoja na jina la mji huonyesha hatua ya kijeshi iliyoelekezwa dhidi yake.
- source_word: לִבְנָה
  choice: Libna
  rationale: Unukuzi wa kawaida wa jina la mahali katika Kiswahili.
- source_word: כִּי שָׁמַע
  choice: kwa maana alikuwa amesikia
  rationale: Kishazi hiki kinatoa sababu, na wakati uliopita timilifu unaonyesha kwamba kusikia kulitangulia kukutwa kwa mfalme.
- source_word: כִּי נָסַע
  choice: kwamba mfalme alikuwa ameondoka
  rationale: נָסַע inaweza kumaanisha kuondoka, kuanza safari, au kung’oa kambi. “Alikuwa ameondoka” ni wazi, huku “mfalme” ikirudia kiima kinachoeleweka ili kuzuia utata usio wa lazima katika Kiswahili.
- source_word: מִלָּכִישׁ
  choice: Lakishi
  rationale: Unukuzi wa kawaida wa jina la mahali, huku kiambishi מִן kikielezwa na maana ya kuondoka mahali hapo.
