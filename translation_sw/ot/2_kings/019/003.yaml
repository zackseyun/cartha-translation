base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: sw
  text: 'Wakamwambia, “Hezekia anasema hivi: ‘Leo ni siku ya dhiki, ya karipio, na ya dharau[a]. Watoto wamefika hatua ya kuzaliwa[b], lakini hakuna nguvu za kujifungua.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “ya kutukanwa” au “ya dharau ya matusi.” Neno la Kiebrania linaweza kumaanisha dharau, tukano, au, linapoelekezwa kwa Mungu, kufuru.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania halisi: “watoto wamefika kwenye mashber.” Neno mashber ni gumu; huenda linamaanisha hatua au mahali pa kujifungulia. Picha ni ya uchungu wa kuzaa uliofika wakati wa mtoto kuzaliwa, lakini nguvu za kujifungua zimekwisha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Wakamwambia
  rationale: Huwasilisha kwa kawaida mfuatano wa simulizi na maana ya ‘walisema kwake’; kiambishi -mw- kinamrejelea Isaya katika muktadha.
- source_word: כֹּה אָמַר חִזְקִיָּהוּ
  choice: Hezekia anasema hivi
  rationale: Ni fomula ya kuwasilisha ujumbe. Wakati wa sasa unaonyesha kwamba wajumbe wanatoa maneno ya mfalme wakati huo.
- source_word: יוֹם צָרָה
  choice: siku ya dhiki
  rationale: ‘Dhiki’ ni neno la kawaida lakini lenye hadhi linaloonyesha hali kali ya shida na shinikizo.
- source_word: וְתוֹכֵחָה
  choice: ya kukemewa
  rationale: Nomino hii inaweza kumaanisha karipio, kemeo, au adhabu ya kurekebisha. Umbo la kutendwa halimtaji moja kwa moja anayekemea na hivyo haliongezi ufafanuzi usio katika maandishi.
- source_word: וּנְאָצָה
  choice: ya kudharauliwa
  rationale: Mzizi huu hubeba wazo la dharau au tukano. Chaguo hili linaonyesha fedheha inayotokana na dharau bila kulifunga neno hilo kwa maana ya kufuru pekee.
- source_word: הַיּוֹם הַזֶּה
  choice: Leo
  rationale: Ni Kiswahili cha kawaida na cha moja kwa moja kwa msisitizo wa ‘siku hii’ katika ujumbe huu.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: Watoto wamefika hatua ya kuzaliwa
  rationale: Huhifadhi sitiari ya uchungu wa kuzaa uliovuka hadi wakati wa mwisho wa kujifungua. מַשְׁבֵּר ni neno gumu, hivyo tanbihi inahifadhi uwezekano wa kurejelea mahali pa kujifungulia.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: lakini hakuna nguvu za kuzaa
  rationale: '‘Lakini’ huonyesha tofauti iliyodokezwa na muktadha: wakati wa kujifungua umefika, ila nguvu zimekosekana. Usemi huu ni wa asili katika Kiswahili na unadumisha sitiari.'
- source_word: בָנִים
  choice: Watoto
  rationale: Ingawa umbo la Kiebrania ni la kiume kwa sarufi, katika sitiari hii linamaanisha watoto wanaozaliwa kwa ujumla, si lazima watoto wa kiume pekee.
theological_decisions:
- issue: Je, נְאָצָה itafsiriwe kuwa kufuru dhidi ya Mungu?
  choice: ya kudharauliwa
  alternative: ya kutukanwa; siku ya kufuru
  rationale: Katika muktadha mpana maneno ya adui yanamhusu Mungu, lakini neno lenyewe linaweza kumaanisha dharau au tukano. Tafsiri kuu inadumisha upana huo badala ya kuamua mapema kwamba hapa maana yake ni ‘kufuru’ tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ujumbe wa kifalme umewekwa wazi, huku sitiari ya kujifungua na utata halisi wa מַשְׁבֵּר na נְאָצָה vikihifadhiwa kwa tanbihi.
