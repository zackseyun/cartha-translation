source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: sw
  text: Huenda Yahweh Mungu wako akayasikia maneno yote ya Rabsheke[a], ambaye bwana wake, mfalme wa Ashuru, amemtuma kumdhihaki[b] Mungu aliye hai, na amkemee kwa sababu ya maneno ambayo Yahweh Mungu wako ameyasikia[c]. Basi inua sala[d] kwa ajili ya mabaki yaliyosalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rabsheke” huenda ni cheo cha ofisa wa Ashuru; wengine hukitafsiri “mnyweshaji mkuu.”
    reason: cultural_note
  - marker: b
    text: Au “kumtukana,” “kumkaidi,” au “kumkejeli.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinaweza pia kueleweka, “na ayakemee maneno ambayo Yahweh Mungu wako ameyasikia.” Mtendwa wa “amkemee” katika tafsiri kuu unadokezwa na muktadha kuwa ni Rabsheke.
    reason: syntactic_ambiguity
  - marker: d
    text: Nahau ya Kiebrania ni “inua sala”; maana yake pia inaweza kusemwa “toa sala” au kwa urahisi “omba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Huenda ... akayasikia
  rationale: Muundo huu wa Kiswahili unaonyesha uwezekano unaotumainiwa bila kuugeuza kuwa uhakika.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: כָּל דִּבְרֵי
  choice: maneno yote
  rationale: Huhifadhi wingi halisi wa דְּבָרִים na mtazamo wa hotuba iliyosikiwa.
- source_word: רַב שָׁקֵה
  choice: Rabsheke
  rationale: Cheo cha ofisa huyo kimetoholewa kwa tahajia inayosomeka kwa Waswahili, kwa kuwa maana kamili ya cheo hicho haijulikani kwa hakika.
- source_word: לְחָרֵף
  choice: kumdhihaki
  rationale: Kitenzi hiki huonyesha kumshutumu au kumtukana Mungu kwa dharau; ‘kumdhihaki’ ni cha kawaida na chenye nguvu katika Kiswahili cha sasa.
- source_word: אֱלֹהִים חַי
  choice: Mungu aliye hai
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayodumisha tofauti iliyodokezwa kati yake na miungu isiyo hai.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: na akakemea kwa sababu ya maneno
  rationale: Huhifadhi Mungu kuwa mtendaji wa ukemeo bila kuongeza kiima-tendwa kisichotajwa wazi, huku ikionyesha kuwa maneno yaliyosikiwa ndiyo sababu au msingi wa ukemeo.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: Basi inua sala
  rationale: Huhifadhi taswira ya nahau ya Kiebrania, ‘kuinua sala,’ na ‘Basi’ huonyesha kwa kawaida mwito unaofuata ombi lililotangulia.
- source_word: בְּעַד
  choice: kwa ajili ya
  rationale: Huonyesha kuwa sala inaombwa kwa niaba ya wale waliosalia.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: mabaki yaliyosalia
  rationale: Huhifadhi istilahi ‘mabaki’ na msisitizo wa Kiebrania kwamba kundi hilo bado lipo baada ya maafa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; ‘Yahweh’ hulihifadhi kama jina bila kuingiza mbadala wa kimapokeo.
- issue: Maana ya הַשְּׁאֵרִית
  choice: mabaki
  alternative: walionusurika au waliosalia
  rationale: ‘Mabaki’ hudumisha istilahi kuu ya kibiblia bila kusema zaidi ya kwamba sehemu ya watu bado ipo.
- issue: Kiima-tendwa cha וְהוֹכִיחַ
  choice: hakikuongezwa; ‘akakemea kwa sababu ya maneno’
  alternative: ‘akamkemee’ au ‘ayakemee maneno’
  rationale: Kiebrania hakitaji kiima-tendwa wazi. Tafsiri hii haifungii maana kwa ofisa wala kwa maneno yenyewe, na tanbihi inaonyesha uwezekano wa kisintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sauti ya ombi la mfalme kwa nabii, jina la Mungu ‘Yahweh,’ cheo cha Kiashuru kilichotoholewa, na uradidi wenye kusudi katika ‘mabaki yaliyosalia.’
