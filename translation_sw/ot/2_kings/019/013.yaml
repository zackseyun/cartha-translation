base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: sw
  text: Yuko wapi mfalme wa Hamathi, na mfalme wa Arpadi, na mfalme wa mji wa Sefarvaimu, Hena[a] na Iva?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia huandikwa “Henahi” katika baadhi ya mapokeo ya uandishi wa jina hili.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיּוֹ
  choice: Yuko wapi
  rationale: Kiulizi hiki chenye kiambishi cha nafsi ya tatu umoja wa kiume kinauliza aliko au yaliyompata mfalme; “Yuko wapi” ni Kiswahili cha kawaida na huhifadhi umoja wa sarufi ya Kiebrania.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa cheo hiki. Kurudiwa kwake kumehifadhiwa ili kudumisha msisitizo wa kejeli wa Kiebrania.
- source_word: חֲמָת
  choice: Hamathi
  rationale: Jina la mahali limetoholewa kwa umbo linalofahamika katika matumizi ya Biblia ya Kiswahili.
- source_word: אַרְפָּד
  choice: Arpadi
  rationale: Jina la mahali limetoholewa kwa kufuata mfumo wa majina ya Biblia katika Kiswahili.
- source_word: לָעִיר
  choice: wa mji wa
  rationale: Muundo huu unaonyesha uhusiano wa mfalme na mji huku ukihifadhi neno עִיר, “mji,” lililo wazi katika Kiebrania.
- source_word: סְפַרְוָיִם
  choice: Sefarvaimu
  rationale: Jina la mahali limetoholewa kwa umbo linalofaa matamshi ya Kiswahili.
- source_word: הֵנַע
  choice: Hena
  rationale: Jina limetoholewa moja kwa moja; lahaja za mapokeo zinaweza kuliandika Hena au Hena⁠h katika lugha nyingine.
- source_word: וְעִוָּה
  choice: na Iva
  rationale: Kiunganishi וְ kimetafsiriwa “na,” na jina la mahali limetoholewa kama “Iva.” Muundo wa orodha umeachwa bila kuongeza “mfalme wa” ambayo haijarudiwa katika chanzo.
theological_decisions:
- issue: Uhusiano wa Hena na Iva na kirai “mfalme wa mji wa Sefarvaimu”
  choice: Orodha imehifadhiwa kama “Sefarvaimu, Hena na Iva” bila kuongeza maneno yanayoamua uhusiano wake.
  alternative: “mfalme wa Sefarvaimu, wa Hena na wa Iva” au kurudia “mfalme wa” kwa kila jina
  rationale: Kiebrania kinaweka majina Hena na Iva baada ya “mfalme wa mji wa Sefarvaimu” bila kurudia מֶלֶךְ wala kihusishi. Kuongeza maneno hayo kungefanya tafsiri iwe wazi zaidi, lakini kungeondoa mvutano wa kisintaksia uliopo katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Kurudiwa kwa “mfalme” na swali la “Yuko wapi” kunadumisha nguvu ya kejeli ya kifungu; majina yametoholewa kwa maumbo yanayofaa matumizi ya Biblia ya Kiswahili.
