base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: sw
  text: 'Hivi ndivyo mtakavyomwambia Hezekia, mfalme wa Yuda: “Usikubali Mungu wako[a], unayemtumaini, akudanganye akisema, ‘Yerusalemu hautatiwa mkononi mwa mfalme wa Ashuru.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mungu wako”; Kiebrania hakitofautishi herufi kubwa na ndogo, na msemaji wa Ashuru anamdhihaki Hezekia kwa kumtumaini Mungu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: Hivi ndivyo mtakavyomwambia
  rationale: Kauli hii inahifadhi mtindo wa ujumbe rasmi na nguvu ya agizo kwa wingi, huku ikiwa ya kawaida katika Kiswahili cha sasa.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Hezekia, mfalme wa Yuda
  rationale: Majina ya kawaida ya Kibiblia katika Kiswahili yametumiwa, na cheo cha kifalme kimewekwa kama kibainishi.
- source_word: אַל יַשִּׁאֲךָ
  choice: Usikubali ... akudanganye
  rationale: Kitenzi נשׁא hapa kina maana ya kudanganya au kupotosha. Muundo huu wa Kiswahili unaonyesha katazo linalomhusu Hezekia bila kudai kwamba Mungu kwa kweli hudanganya.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako[a]
  rationale: Rejeleo ni kwa Mungu wa Hezekia; herufi kubwa inafuata desturi ya Kiswahili, huku tanbihi ikihifadhi uwezekano wa sauti ya dharau ya msemaji.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: unayemtumaini
  rationale: Kitenzi בטח pamoja na kihusishi ב huonyesha kumtumaini au kumtegemea mtu; ‘unayemtumaini’ ni fasaha na ya moja kwa moja.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Inatambulisha maneno yanayodaiwa kuwa njia au maudhui ya udanganyifu, bila kulazimisha uhusiano mwembamba kuliko ulivyo katika Kiebrania.
- source_word: לֹא תִנָּתֵן יְרוּשָׁלִַם
  choice: Yerusalemu hautatiwa
  rationale: Nifali ya נתן imehifadhiwa kwa umbo tendwa; upatanisho wa ‘Yerusalemu’ kama mji unafuata matumizi ya kawaida ya Kiswahili.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: mkononi mwa mfalme wa Ashuru
  rationale: Nahau ya Kiebrania ‘katika mkono wa’ imehifadhiwa kwa sitiari inayoeleweka katika Kiswahili, ikimaanisha kutiwa chini ya mamlaka.
theological_decisions:
- issue: Jinsi ya kutafsiri אֱלֹהֶיךָ katika kinywa cha mfalme wa Ashuru
  choice: Mungu wako
  alternative: mungu wako
  rationale: Kiebrania hakionyeshi tofauti ya herufi kubwa na ndogo. Kwa kuwa anayerejelewa ni Mungu wa Hezekia, maandishi makuu yanatumia ‘Mungu’; tanbihi inahifadhi uwezekano wa msemaji kumtaja kwa dharau.
- issue: Dai kwamba Mungu anaweza kumdanganya Hezekia
  choice: Kuhifadhi dai hilo kama kejeli ya msemaji wa Ashuru
  alternative: Kulilegeza kuwa ‘kukupotosha’ au kulifafanua kama dai la uongo
  rationale: Aya inanukuu propaganda ya adui, si kauli ya msimulizi kuhusu tabia ya Mungu. Tafsiri inahifadhi mvutano wa maneno hayo bila kuyaidhinisha wala kuyafafanua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ujumbe wa kifalme lakini kinachoeleweka kwa msomaji wa kawaida. ‘Hivi ndivyo’ na ‘mkononi mwa’ huhifadhi ladha ya matini ya Kiebrania bila kufanya sentensi kuwa ngumu.
