  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: sw
  text: Na mabaki ya nyumba ya Yuda yaliyosalia yatatia tena mizizi chini, na kuzaa matunda juu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָסְפָה
  choice: yatatia tena
  rationale: Kitenzi יסף hapa huonyesha tendo linalofanywa upya katika muktadha wa kurejeshwa; “tena” ni ya asili kuliko tafsiri sisisi ya “kuongeza.”
- source_word: פְּלֵיטַת
  choice: mabaki yaliyookoka
  rationale: פְּלֵיטָה hurejelea walioponyoka au kunusurika; “mabaki yaliyookoka” huhifadhi wazo la kuokoka pamoja na dhamira ya mabaki.
- source_word: בֵּית יְהוּדָה
  choice: ya nyumba ya Yuda
  rationale: Inahifadhi wazi usemi wa Kiebrania “nyumba ya Yuda,” ambao ni jina la kihistoria la watu wa Yuda.
- source_word: הַנִּשְׁאָרָה
  choice: yaliyookoka
  rationale: Kirai hiki hufafanua mabaki kuwa yale yaliyosalia baada ya maangamizi; kwa Kiswahili wazo hilo linaunganishwa kwa kawaida katika “mabaki yaliyookoka” bila marudio mazito.
- source_word: שֹׁרֶשׁ
  choice: yatatia ... mizizi
  rationale: Ingawa neno la Kiebrania ni nomino “mzizi,” muundo “kutia mizizi” ni nahau ya kawaida ya Kiswahili na huhifadhi taswira ya mmea.
- source_word: לְמָטָּה
  choice: chini
  rationale: Huhifadhi mwelekeo unaokinzana kishairi na “juu” katika kishazi kinachofuata.
- source_word: וְעָשָׂה
  choice: na kuzaa
  rationale: Pamoja na פְרִי, kitenzi humaanisha kuzaa au kutoa matunda; “kuzaa matunda” ni msemo wa kawaida wa Kiswahili.
- source_word: פְרִי
  choice: matunda
  rationale: Huhifadhi sitiari ya kilimo na picha ya kustawi na kurejeshwa.
- source_word: לְמָעְלָה
  choice: juu
  rationale: Hulingana kwa usawa na “chini” na kuhifadhi taswira ya mizizi chini na matunda juu.
theological_decisions:
- issue: Lugha ya mabaki katika ahadi ya kurejeshwa
  choice: mabaki yaliyookoka
  alternative: mabaki ya nyumba ya Yuda yaliyosalia
  rationale: Tafsiri hii huhifadhi wazo la watu walioponyoka na kubaki baada ya hukumu, bila kuingiza hitimisho la kimadhehebu au mafundisho ya baadaye ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na ulinganifu wa “mizizi chini” na “matunda juu” umehifadhiwa. Hakuna tanbihi iliyohitajika kwa kuwa maana ya הַנִּשְׁאָרָה imewasilishwa ndani ya “yaliyookoka” bila kupoteza wazo kuu.
