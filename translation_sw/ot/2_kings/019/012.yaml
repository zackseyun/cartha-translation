base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: sw
  text: Je, miungu ya mataifa ambayo baba zangu waliwaangamiza—Gozani, Harani, Resefu, na watu wa Edeni[a] waliokuwa katika Tel-asari—iliwaokoa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana wa Edeni waliokuwa katika Tel-asari.” Kiebrania kinasema kihalisi “wana wa Edeni,” jambo linaloweza kumaanisha watu au wakazi wa Edeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Je, ... iliweza kuwaokoa
  rationale: Kitenzi cha Hifili timilifu katika swali la balagha kinauliza kama miungu hiyo ilifanikiwa kuokoa. Muundo huu ni wa asili katika Kiswahili na unaendeleza dhihaka ya kihistoria.
- source_word: אֹתָם
  choice: kuwaokoa
  rationale: Kiwakilishi cha yambwa cha wingi kimejumuishwa katika kiambishi -wa-, kikirejelea watu wa maeneo yaliyotajwa.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: miungu ya mataifa
  rationale: Huu ni uhamisho wa moja kwa moja wa kishazi unganifu, ukimaanisha miungu iliyoabudiwa na mataifa hayo.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: ambayo baba zangu waliwaangamiza
  rationale: Katika muktadha wa ushindi wa kijeshi, שׁחת katika Pieli humaanisha kuangamiza au kuharibu kabisa. Upatanisho wa 'ambayo' unarejelea mataifa, na -wa- unaonyesha kuwa yaliyoangamizwa ni makundi ya watu.
- source_word: אֲבוֹתַי
  choice: baba zangu
  rationale: Tafsiri halisi inadumisha mtindo wa kifalme wa kuwarejelea watangulizi au mababu wa mfalme.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Gozani, Harani, Resefu
  rationale: Majina ya mahali yameandikwa kwa tahajia inayoweza kutamkwa kwa urahisi katika Kiswahili huku yakifuata maumbo ya Kiebrania.
- source_word: וּבְנֵי עֶדֶן
  choice: watu wa Edeni
  rationale: Ingawa בְּנֵי kihalisi ni 'wana wa,' hapa kwa kawaida humaanisha watu au wakazi wanaohusishwa na Edeni. Maana halisi imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: waliokuwa Tel-asari
  rationale: Kishazi husishi kinawatambulisha watu wa Edeni kwa mahali walipokuwa; katika Kiswahili jina la mahali linaweza kufuata kitenzi bila kihusishi.
