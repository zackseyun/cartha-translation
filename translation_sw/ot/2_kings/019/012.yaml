translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Swali la balagha na dhihaka ya msemaji vimedumishwa; vistari vinatanguliza orodha inayofafanua yambwa 'wao'.
