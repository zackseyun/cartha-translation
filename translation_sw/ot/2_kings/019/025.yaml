  text: הֲ/לֹֽא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אֹתָ֣/הּ עָשִׂ֔יתִי לְ/מִ֥/ימֵי קֶ֖דֶם וִֽ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵיאתִ֗י/הָ וּ/תְהִ֗י לַ/הְשׁ֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: sw
  text: Je, hujasikia? Tangu zamani nililifanya jambo hili; tangu siku za kale nililiunda. Sasa nimelitimiza, ili uifanye miji yenye ngome kuwa marundo ya magofu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania kinachotafsiriwa “marundo ya magofu” ni kigumu; kinaweza pia kutafsiriwa “marundo yaliyosimama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: Je, hujasikia?
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְמֵרָחוֹק
  choice: Tangu zamani
  rationale: Ingawa neno hilo linaweza kueleweka kwa maana ya mahali, hapa ulinganifu wake na 'tangu siku za kale' unaonyesha zaidi wakati wa mbali.
- source_word: אֹתָהּ עָשִׂיתִי
  choice: nililifanya jambo hili
  rationale: Kiwakilishi cha kike hakina rejeo la wazi ndani ya mstari huu; 'jambo hili' hutoa Kiswahili asilia bila kulibainisha kuwa mpango au tukio.
- source_word: לְמִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: tangu siku za kale nililiunda
  rationale: '''Kuliumba/kuliunda'' huhifadhi taswira ya יצר ya kutengeneza au kuunda, pamoja na usambamba wake na ''nililifanya.'''
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: Sasa nimelitimiza
  rationale: Katika muktadha, maana ni kulifanya kusudi la zamani litokee sasa, si kulileta tu kutoka mahali pengine.
- source_word: לַהְשׁוֹת
  choice: ili uyafanye
  rationale: Hueleza kusudi au matokeo yanayomhusu mfalme wa Ashuru na kuunganika moja kwa moja na hali ya miji baada ya kuharibiwa.
- source_word: עָרִים בְּצֻרוֹת
  choice: miji yenye ngome
  rationale: Ni usemi wa kawaida wa Kiswahili kwa miji iliyoimarishwa kwa ulinzi.
- source_word: גַּלִּים נִצִּים
  choice: marundo ya magofu
  rationale: Kirai cha Kiebrania ni kigumu; tafsiri hii huwasilisha kwa uwazi picha ya miji iliyobaki ikiwa marundo baada ya kuharibiwa.
theological_decisions:
- issue: Enzi ya Mungu juu ya ushindi wa Ashuru
  choice: Maneno yanaonyesha kwamba ushindi wa mfalme wa Ashuru ulitokea ndani ya kusudi ambalo Mungu alikuwa ameliamua tangu zamani na sasa akalitimiza.
  alternative: Kutafsiri kwa namna inayodai uamuzi kamili wa kifalsafa, au kwa namna inayopunguza kauli kuwa Mungu alijua tu mapema.
  rationale: Vitenzi vya Kiebrania vya kufanya, kuunda, na kutimiza vinaweka wazi utendaji na enzi ya Mungu, lakini mstari wenyewe haulazimishi hitimisho pana la kifalsafa wala kuhalalisha maovu ya Ashuru.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Usambamba wa kishairi umehifadhiwa bila kutumia miundo ya kizamani.
