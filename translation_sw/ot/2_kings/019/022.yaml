  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: sw
  text: “Umemdhihaki na kumkufuru nani[a]? Umepaza sauti yako dhidi ya nani, na umeinua macho yako juu? Dhidi ya Mtakatifu wa Israeli[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umemtukana na kumshutumu nani?” Vitenzi viwili vya Kiebrania vina maana zinazokaribiana za usemi wa dharau na matusi; cha pili kinaweza hasa kumaanisha kumkufuru Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “umeinua macho yako juu”; huu ni usemi unaoonyesha kiburi au kujikweza.
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: uliyemdhihaki
  rationale: Kitenzi hiki hapa kinaeleza kumtukana mtu kwa dharau. ‘Kumdhihaki’ ni Kiswahili cha sasa kinachoeleweka na kinahifadhi wazo la kejeli yenye dharau.
- source_word: גִדַּפְתָּ
  choice: kumkufuru
  rationale: Kwa kuwa maneno hayo yanaelekezwa hatimaye kwa Mungu, ‘kumkufuru’ linadumisha uzito wa kosa la kusema dhidi ya Mungu; hata hivyo tanbihi inaonyesha maana pana ya kumtukana.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: uliyeinua sauti yako
  rationale: Hii inafuata taswira ya Kiebrania huku ikiwa usemi wa kawaida wa Kiswahili kwa kusema kwa nguvu au kwa ukaidi.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: kuyainua macho yako juu
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania badala ya kuweka moja kwa moja ‘kwa kiburi’; tanbihi inafafanua maana ya kimethali.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: Mtakatifu wa Israeli
  rationale: Hili ni jina maalumu la Mungu katika Maandiko na linatafsiriwa moja kwa moja kwa namna iliyozoeleka na yenye heshima.
- source_word: עַל
  choice: dhidi ya
  rationale: Kihusishi hiki kinaonyesha mwelekeo wa uadui katika muktadha huu; ‘dhidi ya’ kinadhihirisha hilo bila kuongeza maana nyingine.
- source_word: מִי
  choice: nani
  rationale: ‘Nani’ ndilo neno la kawaida na la asili la Kiswahili katika maswali haya ya balagha.
theological_decisions:
- issue: Kudumisha uzito wa maneno yaliyonenwa dhidi ya Mungu
  choice: Kutumia ‘kumkufuru’ na kudumisha hitimisho lenye mkazo, ‘Ni dhidi ya Mtakatifu wa Israeli!’
  alternative: Kutumia neno pana zaidi kama ‘kumtukana’ au ‘kumshutumu.’
  rationale: Muktadha unatambulisha mlengwa kuwa Mungu wa Israeli, na kitenzi cha Kiebrania kinaweza kutaja usemi wa kumkufuru Mungu. Uchaguzi huu unadumisha uzito wa kitheolojia bila kuongeza fundisho lisilokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali ya balagha na marudio ya ‘dhidi ya’ unahifadhi mkazo wa Kiebrania, huku taswira ya kuinua macho ikibaki katika matini na kufafanuliwa katika tanbihi.
