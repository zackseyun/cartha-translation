base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: sw
  text: Ikawa, alipokuwa akiabudu katika nyumba ya Nisroki[a], mungu wake, Adrameleki na Sharezeri wakampiga kwa upanga, wakakimbilia nchi ya Ararati. Esar-hadoni, mwanawe, akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Nisrok”; katika tafsiri za Kiingereza za mapokeo: “Nisroch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni utangulizi wa kawaida wa tukio katika masimulizi ya Kiebrania; “Ikawa” huhifadhi mtiririko huo kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: מִשְׁתַּחֲוֶה
  choice: alipokuwa akiabudu
  rationale: Katika mazingira ya ibada na pamoja na “mungu wake,” kitenzi hiki kinamaanisha kuabudu; muundo huu pia huonyesha tendo lililokuwa likiendelea.
- source_word: בֵּית
  choice: katika nyumba ya
  rationale: Huhifadhi maana halisi ya “nyumba ya,” ingawa hapa ni mahali patakatifu pa mungu huyo.
- source_word: נִסְרֹךְ
  choice: Nisroki
  rationale: Ni unukuzi unaofuata matamshi ya maandishi ya Kiebrania yaliyowekewa irabu, huku umbo likirekebishwa kwa urahisi wa matamshi ya Kiswahili.
- source_word: אֱלֹהָיו
  choice: mungu wake
  rationale: Nomino ni umoja na ina kiambishi cha nafsi ya tatu umoja wa kiume, ikimtaja mungu wa Senakeribu.
- source_word: הִכֻּהוּ
  choice: wakamuua
  rationale: Kimsingi ni “wakampiga,” lakini katika muktadha huu pigo la upanga lilisababisha kifo; “wakamuua kwa upanga” hutoa maana kamili na ya kawaida kwa Kiswahili.
- source_word: בַּחֶרֶב
  choice: kwa upanga
  rationale: Herufi beth inaonyesha chombo kilichotumiwa; “kwa upanga” ni usemi wa kawaida wa Kiswahili.
- source_word: נִמְלְטוּ
  choice: wakatorokea
  rationale: Nifali ya מלט inaonyesha kufanikiwa kuponyoka; kwa kutaja mahali walipoenda, “wakatorokea” huwasilisha kutoroka na kufika kwao huko.
- source_word: אֶרֶץ אֲרָרָט
  choice: nchi ya Ararati
  rationale: Ni kirai cha kijiografia; “nchi ya Ararati” ni tafsiri ya moja kwa moja na ya asili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika muktadha wa urithi wa kifalme, kitenzi מלך humaanisha kutawala akiwa mfalme; kirai kinachofuata kinafafanua urithi huo.
- source_word: אֵסַר חַדֹּן
  choice: Esar-hadoni
  rationale: Jina la kifalme limenukuliwa kutoka Kiebrania na kupewa irabu ya mwisho kwa matamshi ya kawaida ya Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Nahau hii inaonyesha kwamba mwanawe alimrithi katika ufalme.
