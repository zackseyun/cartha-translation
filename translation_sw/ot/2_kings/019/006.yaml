  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: sw
  text: 'Isaya akawaambia, “Mwambieni bwana wenu hivi: ‘Yahwe asema hivi: Usiogope kwa sababu ya maneno uliyoyasikia, ambayo watumishi[a] wa mfalme wa Ashuru wamenikufuru.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vijana” au “wahudumu.” Neno la Kiebrania linaweza kumaanisha vijana, lakini hapa huenda linawataja wahudumu au maofisa wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Kauli ya kawaida ya kisimulizi; kiambishi cha yambwa kinaonyesha wazi kuwa Isaya alisema kwao.
- source_word: אֲדֹנֵיכֶם
  choice: bwana wenu
  rationale: Inamtaja Hezekia kama mkuu wao. ‘Bwana wenu’ ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa mamlaka bila kuuchanganya na jina la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha moja kwa moja jina la agano יהוה badala ya kulibadilisha kuwa cheo.
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Ni agizo hasi la kawaida na la asili katika Kiswahili, lenye nguvu ya kumtia moyo Hezekia.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: kwa sababu ya maneno
  rationale: מִפְּנֵי hapa inaonyesha sababu ya hofu, na הַדְּבָרִים inarejelea maneno ya vitisho yaliyosemwa.
- source_word: שָׁמַעְתָּ
  choice: uliyoyasikia
  rationale: Huhifadhi tendo lililokamilika la kusikia na uhusiano wake wa moja kwa moja na ‘maneno.’
- source_word: גִּדְּפוּ
  choice: wamenikufuru
  rationale: ‘Kukufuru’ huhifadhi uzito wa maneno ya dharau yaliyoelekezwa kwa Mungu mwenyewe.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: watumishi wa mfalme wa Ashuru
  rationale: Ingawa נַעֲרֵי inaweza kumaanisha vijana, katika muktadha huu wa kifalme inawataja wajumbe au maofisa walio chini ya mfalme; ‘watumishi’ linaeleza jukumu hilo kwa lugha ya kawaida.
- source_word: אֹתִי
  choice: -ni- katika ‘wamenikufuru’
  rationale: Kiambishi hiki kinahifadhi yambwa ‘mimi,’ yaani Yahwe ndiye aliyelengwa na kufuru hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya cheo.
- issue: Uzito wa גִּדְּפוּ wakati Mungu ndiye yambwa
  choice: wamenikufuru
  alternative: wamenitukana; wamenidhihaki
  rationale: Kwa kuwa maneno hayo yamemlenga Yahwe, ‘kufuru’ hudumisha uzito wa kidini wa kosa bila kuongeza maelezo yasiyomo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ujumbe ndani ya ujumbe umehifadhiwa kwa alama za kunukuu, huku ‘Mwambieni’ ikiwakilisha agizo la wingi kwa wajumbe kadhaa kuhusu bwana wao mmoja.
