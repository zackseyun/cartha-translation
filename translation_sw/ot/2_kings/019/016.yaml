  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: sw
  text: Ee Yahwe, tega sikio lako usikie; fungua macho yako, Ee Yahwe, uone; uyasikie maneno ya Senakeribu, ambayo ametuma ili kumtukana[a] Mungu aliye hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumkaidi”; kitenzi cha Kiebrania kinaweza kumaanisha kutukana, kudhihaki, au kukaidi kwa dharau.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: tega sikio lako
  rationale: Ni nahau ya kawaida ya Kiswahili inayoonyesha kusikiliza kwa makini, huku ikihifadhi umoja wa neno la Kiebrania ‘sikio’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina binafsi la Mungu, YHWH, kwa tahajia iliyozoeleka katika Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: וּשֲׁמָע ... וּשְׁמַע
  choice: usikie ... uyasikie
  rationale: Inahifadhi kurudiwa kwa kitenzi שמע; kiambishi ‘ya-’ katika matumizi ya pili kinaelekeza wazi kwa ‘maneno’.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: fungua macho yako ... uone
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayodumisha ulinganifu wa maombi haya.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: maneno ya Senakeribu
  rationale: ‘Maneno’ yanadumisha wingi wa דִּבְרֵי, na ‘Senakeribu’ ni umbo la jina linalotumika katika Kiswahili.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: ambayo ametuma
  rationale: Inafuata uhusiano wa kishazi na ‘maneno’ kwa Kiswahili cha kawaida, bila kuongeza wazi mjumbe ambaye maandishi ya Kiebrania hayamtaji hapa.
- source_word: לְחָרֵף
  choice: ili kumtukana
  rationale: ‘Kumtukana’ linaeleza tendo la kusema kwa dharau dhidi ya Mungu, huku uwezekano wa maana ya ‘kumkaidi’ ukihifadhiwa katika tanbihi.
- source_word: אֱלֹהִים חָי
  choice: Mungu aliye hai
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi tofauti inayodokezwa kati ya Mungu aliye hai na miungu isiyo na uhai.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; tafsiri inalihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya לְחָרֵף inapomhusu Mungu
  choice: kumtukana Mungu aliye hai
  alternative: kumkaidi Mungu aliye hai
  rationale: Kitenzi kinaweza kuonyesha kutukana, kudhihaki, au kukaidi. ‘Kumtukana’ linabeba maana yake pana ya dharau, na tanbihi inadumisha maana ya kukabiliana kwa ukaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Virai sambamba vya ‘sikio—kusikia’ na ‘macho—kuona’ vimehifadhiwa, pamoja na kurudiwa kwa ombi la kusikia.
