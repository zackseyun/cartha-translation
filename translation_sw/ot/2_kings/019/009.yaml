base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: sw
  text: 'Aliposikia habari kuhusu Tirhaka, mfalme wa Kushi[a], kwamba: “Tazama, ametoka ili kupigana nawe,” alirudi na kutuma wajumbe kwa Hezekia, akisema,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme wa Ethiopia.” Kiebrania kinasema “Kushi,” eneo la kale kusini mwa Misri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: Aliposikia habari za
  rationale: Muundo huu unaonyesha uhusiano wa wakati katika simulizi na kwa kawaida huleta jambo lililosikiwa kwa Kiswahili sanifu.
- source_word: תִּרְהָקָה
  choice: Tirhaka
  rationale: Jina limetoholewa kwa kuzingatia umbo la Kiebrania na matumizi ya kawaida ya Kiswahili.
- source_word: מֶלֶךְ כּוּשׁ
  choice: mfalme wa Kushi
  rationale: Huhifadhi jina la eneo la Kiebrania badala ya kulisawazisha moja kwa moja na Ethiopia ya kisasa.
- source_word: לֵאמֹר
  choice: kwamba / akisema
  rationale: Katika sehemu ya kwanza, 'kwamba' ni njia ya asili ya kuingiza taarifa iliyosikiwa; mwishoni, 'akisema' huhifadhi kiunganishi cha hotuba kinachoendelea katika mstari unaofuata.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huelekeza usikivu kwa taarifa inayofuata kwa lugha yenye hadhi lakini inayoeleweka.
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: ametoka ili kupigana nawe
  rationale: Huhifadhi kitenzi cha mwendo, kusudi la kijeshi, na maana ya uhasama; 'kupigana nawe' ni Kiswahili cha kawaida katika muktadha huu.
- source_word: וַיָּשָׁב
  choice: alirudi
  rationale: Hutoa maana ya msingi ya kurudi bila kuongeza dhana isiyotajwa wazi, kama vile kuondoka kabisa vitani.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: na kutuma wajumbe
  rationale: Katika mazingira haya מַלְאָכִים ni wajumbe wa kibinadamu, si malaika.
- source_word: אֶל חִזְקִיָּהוּ
  choice: kwa Hezekia
  rationale: Hii ni njia ya kawaida ya Kiswahili kuonyesha walikopelekwa wajumbe, huku jina likitoholewa kwa matumizi ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi huhifadhi mwendelezo wa taarifa hadi mstari unaofuata, na 'Kushi' huhifadhi jina la kihistoria bila kulichanganya moja kwa moja na taifa la kisasa la Ethiopia.
