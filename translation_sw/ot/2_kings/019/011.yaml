  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: sw
  text: Tazama, umesikia wafalme wa Ashuru wamefanya nini kwa nchi zote, wakiziangamiza kabisa[a]—je, wewe utaokolewa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiziweka wakfu kwa maangamizi.” Kiebrania kina wazo la kuziweka chini ya ḥerem, yaani, kuzitenga kwa ajili ya kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta fikira kwa mkazo; “Tazama” ni la heshima, linaeleweka, na linafaa katika kejeli hii ya moja kwa moja.
- source_word: שָׁמַעְתָּ
  choice: umesikia
  rationale: Kauli timilifu ya nafsi ya pili umoja wa kiume inaonyesha habari iliyosikiwa tayari na yenye umuhimu katika hali ya sasa.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: yale ambayo ... wameyatenda
  rationale: Inawasilisha kiambishi cha yambwa pamoja na kishazi rejeshi kwa Kiswahili cha kawaida huku ikidumisha wazo la matendo yaliyokwisha kufanywa.
- source_word: מַלְכֵי אַשּׁוּר
  choice: wafalme wa Ashuru
  rationale: Ni tafsiri ya kawaida na wazi ya muundo wa utegemezi wa Kiebrania.
- source_word: לְכָל הָאֲרָצוֹת
  choice: nchi zote
  rationale: Hapa אֲרָצוֹת humaanisha maeneo au mataifa ya kisiasa, si dunia nzima; “nchi” ni ya kawaida zaidi katika Kiswahili cha sasa.
- source_word: לְהַחֲרִימָם
  choice: wakiziangamiza kabisa
  rationale: Kitenzi חרם katika muktadha wa vita kina wazo la kuweka chini ya ḥerem kwa maangamizi. “Kuangamiza kabisa” huwasilisha matokeo na ukamilifu wake kwa lugha inayoeleweka; tanbihi huhifadhi maana mahususi zaidi.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: —je, wewe utaokolewa?
  rationale: Kiwakilishi huru אַתָּה kimehifadhiwa kwa “wewe” ili kuonyesha tofauti yenye mkazo. Swali la kejeli linadumisha dhihaka ya msemaji, na kauli tendwa “utaokolewa” inalingana na Niphal ya נצל.
theological_decisions:
- issue: Lugha ya חרם katika muktadha wa hukumu ya kijeshi
  choice: wakiziangamiza kabisa, pamoja na tanbihi kuhusu kuwekwa wakfu kwa maangamizi
  alternative: wakiwaweka chini ya marufuku; wakiwaweka wakfu kwa maangamizi
  rationale: Maandishi yanahusu zaidi ya uharibifu wa kawaida, lakini usemi wa moja kwa moja “kuweka wakfu kwa maangamizi” unaweza kusikika usio wa kawaida katika Kiswahili. Maandishi makuu yanaweka wazi uangamizi kamili, huku tanbihi ikihifadhi dhana mahususi ya ḥerem bila kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” hudumisha mkazo wa hotuba; “je, wewe” hudumisha swali la kejeli na tofauti iliyosisitizwa. Tanbihi imewekwa baada ya kirai husika na alama [a] ipo pia katika maandishi makuu.
