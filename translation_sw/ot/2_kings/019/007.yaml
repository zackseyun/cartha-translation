  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: sw
  text: Tazama, nitatia roho[a] ndani yake, naye atasikia taarifa[b], na atarudi katika nchi yake. Nami nitamwangusha kwa upanga katika nchi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwelekeo wa ndani” au “msukumo”; neno la Kiebrania pia linaweza kumaanisha “upepo” au “pumzi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “habari” au “uvumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Tazama
  rationale: Neno hili linavuta usikivu na kutanguliza tangazo la Mungu; “Tazama” linahifadhi msisitizo huo kwa Kiswahili cha heshima.
- source_word: נֹתֵן
  choice: nitatia
  rationale: Kitenzi kishirikishi baada ya הִנְנִי huonyesha tendo linalokaribia. Wakati ujao unafaa katika muktadha huu wa unabii, na “kutia ndani yake” ni usemi wa kawaida wa Kiswahili.
- source_word: רוּחַ
  choice: roho
  rationale: “Roho” linahifadhi upana wa neno la Kiebrania na halifafanui kupita kiasi ikiwa kinachokusudiwa ni kiumbe cha kiroho, msukumo, au mwelekeo wa ndani uliotumwa na Mungu.
- source_word: וְשָׁמַע
  choice: naye atasikia
  rationale: Huu ni mwendelezo wa matokeo yanayotabiriwa baada ya tendo la Mungu.
- source_word: שְׁמוּעָה
  choice: taarifa
  rationale: Neno linaweza kumaanisha taarifa, habari, au uvumi. “Taarifa” ni pana na halisemi mapema ikiwa ujumbe huo umethibitishwa.
- source_word: וְשָׁב
  choice: na kurudi
  rationale: Linahifadhi maana ya kurejea au kugeuka na kurudi, bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: לְאַרְצוֹ
  choice: katika nchi yake
  rationale: Kiambishi cha nafsi kinaonyeshwa kwa “yake”; “nchi” linafaa kwa mazingira ya kijiografia ya kifungu.
- source_word: וְהִפַּלְתִּיו
  choice: nitamwangusha
  rationale: Muundo wa Hifili ni wa kisababishi. “Nitamwangusha” unahifadhi wazi wazo la Mungu kusababisha kuanguka kwake.
- source_word: בַּחֶרֶב
  choice: kwa upanga
  rationale: Huu ni usemi wa kifo cha vurugu kwa silaha; “kwa upanga” linahifadhi maana ya chombo au njia iliyotumiwa.
- source_word: בְּאַרְצוֹ
  choice: katika nchi yake
  rationale: Kurudia msemo huu kunafuata Kiebrania na kuonyesha kwamba anguko lake litatokea katika nchi yake mwenyewe.
theological_decisions:
- issue: Maana ya רוּחַ katika tangazo la hukumu ya Mungu
  choice: roho
  alternative: msukumo; mwelekeo wa ndani; upepo
  rationale: Muktadha unaonyesha Mungu akielekeza matukio yanayomhusu mfalme wa Ashuru, lakini haufafanui namna hasa ya tendo hilo. “Roho” huhifadhi utata na mvutano wa Kiebrania bila kuamua kuwa ni hali ya kisaikolojia pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja, na urudiaji wa “katika nchi yake” umehifadhiwa kwa sababu ni wa kimakusudi katika chanzo. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
