  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר יָבֹ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָבֹ֖א נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: sw
  text: Atarudi kwa njia ileile aliyokuja nayo, wala hataufikia mji huu—asema Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: kwa njia ileile aliyokuja nayo
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba atarudia njia aliyotumia kuja, huku ukitoa kwa lugha ya kawaida maana ya kirai cha Kiebrania.
- source_word: יָשׁוּב
  choice: atarudi
  rationale: Kitenzi שׁוּב hapa kinaeleza kurudi au kurejea alikotoka; ‘atarudi’ ni sahihi na ya kawaida.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: wala hataufikia mji huu
  rationale: Kiebrania kinasema kwa msingi ‘hatakuja kwenye mji huu.’ ‘Hataufikia mji huu’ ni Kiswahili cha kawaida na hakiongezi dai lenye nguvu zaidi kwamba hataingia ndani ya mji.
- source_word: נְאֻם יְהוָה
  choice: asema Yahweh
  rationale: נְאֻם ni kauli maalumu ya kinabii inayothibitisha chanzo cha ujumbe; ‘asema Yahweh’ ni ya asili, yenye hadhi, na inahifadhi jina la Mungu lililoandikwa katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu YHWH moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa לֹא יָבֹא linamaanisha kutoukaribia au kutouingia mji
  choice: hataufikia mji huu
  alternative: hataingia katika mji huu
  rationale: Kitenzi בוא pamoja na אֶל kimsingi ni ‘kuja/kufika kwenye.’ Tafsiri haiongezi maana maalumu zaidi ya kuingia ndani, ingawa muktadha unaweza kuhusisha jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Njia ileile aliyokuja nayo’ ni ya kawaida kuliko kunakili kiwakilishi cha Kiebrania neno kwa neno. Alama ya mkato mrefu kabla ya kauli ya kinabii huweka mkazo bila kufanya sentensi kuwa nzito.
