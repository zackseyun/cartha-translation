  source_fidelity: 'Tafsiri inahifadhi maana ya Kiebrania: mvamizi atarudi kwa njia hiyo hiyo aliyotumia kuja, na hataufikia mji huu. “Kwa njia ileile aliyokuja nayo” huwakilisha vyema urejeshi wa kiwakilishi katika בָּהּ bila kulazimisha muundo wa Kiebrania. “Hataufikia mji huu” ni uwasilishaji unaokubalika wa לֹא יָבֹא אֶל, bila kuongeza dai mahsusi la kuingia ndani ya mji.'
