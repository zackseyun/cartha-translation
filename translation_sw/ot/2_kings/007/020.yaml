  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: sw
  text: 'Ikawa hivyo kwake: watu wakamkanyaga langoni[b], naye akafa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mambo yakampata sawasawa na yalivyokuwa yametabiriwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kwenye lango” au “katika njia ya lango.” Neno la Kiebrania linaweza kumaanisha eneo la lango la jiji au jengo/njia yake ya kuingilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: Ikawa hivyo kwake
  rationale: Hufuata kwa karibu nahau ya Kiebrania na kuonyesha kwamba yaliyokuwa yametabiriwa yalimpata kama yalivyosemwa, bila kuongeza maelezo ya kitheolojia katika matini.
- source_word: וַיִּרְמְסוּ
  choice: wakamkanyaga
  rationale: Kitenzi רמס humaanisha kukanyaga chini ya miguu; ‘wakamkanyaga’ ni cha moja kwa moja na cha kawaida katika Kiswahili.
- source_word: הָעָם
  choice: watu
  rationale: עם kwa kawaida ni ‘watu.’ Ingawa muktadha unaonyesha umati uliokuwa ukipita langoni, ‘watu’ huhifadhi maana ya nomino ya Kiebrania.
- source_word: בַּשַּׁעַר
  choice: langoni
  rationale: שַׁעַר inaweza kumaanisha mahali pa lango la jiji au njia/jengo lake la kuingilia; ‘langoni’ ni usemi wa asili unaohifadhi upana huo.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huwasilisha mfuatano rahisi wa simulizi; muktadha wenyewe unaonyesha kuwa kifo kilitokana na kukanyagwa.
theological_decisions:
- issue: Maneno ya kutimia kwa hukumu iliyotabiriwa
  choice: Ikawa hivyo kwake
  alternative: Hivyo hukumu ikampata
  rationale: Muktadha unaonyesha kutimia kwa neno la kinabii la Elisha, lakini mstari wenyewe unasimulia tukio bila kulitaja wazi kuwa hukumu ya Mungu. Tafsiri inadumisha namna hiyo ya simulizi na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida na wenye heshima. ‘Ikawa hivyo kwake’ huhifadhi ladha ya nahau ya Kiebrania, huku tanbihi ikiifafanua. Alama zote za tanbihi zimewekwa katika matini kuu.
