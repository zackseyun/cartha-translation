base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: sw
  text: Basi wakaondoka, wakakimbia wakati wa mwanga hafifu[a]. Wakaacha mahema yao, farasi wao, punda wao, na kambi yao kama ilivyokuwa[b], wakakimbia kuokoa maisha yao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa machweo” au “wakati wa giza-giza.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “kambi kama ilivyokuwa,” yaani, waliiacha katika hali yake ileile.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kihalisi, “wakakimbia kuelekea uhai wao,” nahau yenye maana ya kukimbia ili kuokoa maisha yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: wakati wa machweo
  rationale: Neno נֶשֶׁף humaanisha kipindi cha mwanga hafifu kati ya mchana na usiku; katika muktadha huu, “wakati wa machweo” ni Kiswahili cha kawaida bila kufafanua zaidi ya chanzo.
- source_word: וַיַּעַזְבוּ
  choice: wakaacha
  rationale: Kitenzi עזב kinaweza kumaanisha kuacha au kutelekeza; “wakaacha” ni cha moja kwa moja, huku kukimbia kwao kukionyesha kwamba walivitelekeza.
- source_word: אָהֳלֵיהֶם
  choice: mahema yao
  rationale: Hii ni tafsiri ya kawaida ya nomino ya wingi yenye kiambishi cha umilikaji katika muktadha wa kambi.
- source_word: סוּסֵיהֶם
  choice: farasi wao
  rationale: Ni kisawe cha kawaida na cha moja kwa moja katika Kiswahili.
- source_word: חֲמֹרֵיהֶם
  choice: punda wao
  rationale: “Punda” ni kisawe cha kawaida cha mnyama huyu wa kubebea mizigo.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: kambi kama lilivyokuwa
  rationale: Muundo huu huhifadhi wazo la kwamba kambi liliachwa katika hali yake ya wakati huo, bila kutumia neno la kufasiri zaidi kama “bila kuguswa.”
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: wakakimbia kuokoa maisha yao
  rationale: Hii ni tafsiri asilia ya nahau inayomaanisha kukimbia ili mtu asipoteze uhai wake.
- source_word: וַיָּקוּמוּ
  choice: wakaondoka
  rationale: Katika mfululizo huu wa masimulizi, קום huanzisha tendo la haraka; “wakaondoka” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: wakakimbia ... wakakimbia
  rationale: Kurudia kitenzi kilekile kunahifadhi msisitizo na kasi ya simulizi la Kiebrania.
