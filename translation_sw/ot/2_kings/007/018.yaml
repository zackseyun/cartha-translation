base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: sw
  text: 'Ikawa kama vile mtu wa Mungu alivyomwambia mfalme, akisema: “Kesho yapata saa kama hii, sea mbili[a] za shayiri zitauzwa kwa shekeli moja, na sea moja ya unga laini kwa shekeli moja, kwenye lango la Samaria[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sea ilikuwa kipimo cha kale cha vitu vikavu. Kiebrania kinataja vipimo hivyo moja kwa moja: sea mbili za shayiri na sea moja ya unga laini.'
    reason: cultural_note
  - marker: b
    text: Au “katika lango la Samaria.” Lango la mji lilikuwa mahali pa shughuli za biashara na utoaji wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Ikawa sawasawa na vile ... alivyokuwa amemwambia
  rationale: Muundo huu unaonyesha kwamba tukio lilitokea kwa kutimiza sawasawa neno lililokuwa limetamkwa; wakati uliopita timilifu unafaa kwa muktadha wa kutazama nyuma.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la cheo la moja kwa moja katika Kiebrania; halijabadilishwa kuwa ‘nabii,’ ili kuhifadhi usemi wa chanzo.
- source_word: סָאתַיִם שְׂעֹרִים
  choice: sea mbili za shayiri
  rationale: Umbo la Kiebrania ni la uwili na hutaja kipimo maalumu cha vitu vikavu. Jina la kipimo limehifadhiwa badala ya kubadilishwa kuwa neno lisilo mahususi.
- source_word: בְּשֶׁקֶל
  choice: kwa shekeli moja
  rationale: Katika kauli ya bei, kihusishi ב kinaonyesha bei inayolipwa. ‘Kwa shekeli moja’ ni usemi wa kawaida wa Kiswahili.
- source_word: וּסְאָה סֹלֶת
  choice: na sea moja ya unga laini
  rationale: ‘Sea moja’ huhifadhi tofauti ya idadi na ‘sea mbili,’ huku ‘unga laini’ ukitofautisha סֹלֶת na unga wa kawaida.
- source_word: יִהְיֶה
  choice: zitauzwa ... kwa
  rationale: Kitenzi cha Kiebrania kinatumika kwa hali ya bei itakayokuwapo. Kiswahili cha kibiashara ‘zitauzwa kwa’ huwasilisha maana hiyo kwa kawaida bila kuongeza bei nyingine.
- source_word: כָּעֵת מָחָר
  choice: Kesho yapata saa kama hii
  rationale: ‘Yapata’ huhifadhi wazo la ukaribu au makadirio lililomo katika כ, na usemi mzima ni wa kawaida katika Kiswahili.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: kwenye lango la Samaria
  rationale: ‘Kwenye’ linaweza kuonyesha eneo la lango bila kulazimisha maana finyu ya kuwa ndani yake; lango la mji lilikuwa eneo la shughuli za umma na biashara.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina la kipimo ‘sea’ limehifadhiwa kwa usahihi wa kihistoria na kufafanuliwa katika tanbihi; mpangilio wa sentensi umefanywa wa kawaida kwa msomaji wa Kiswahili huku uhusiano wa utimilifu na unabii ukihifadhiwa.
