base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: sw
  text: Kulikuwa na wanaume wanne waliokuwa na ugonjwa wa ngozi, nao walikuwa kwenye mwingilio wa lango[a]. Wakaambiana, “Kwa nini tunakaa hapa mpaka tufe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama ilivyotafsiriwa kimapokeo, “wenye ukoma.” Neno la Kiebrania linarejelea hali ya ngozi inayohusishwa na צָרַעַת, ambayo si lazima iwe sawa na ukoma wa kisasa (ugonjwa wa Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: Kulikuwa na wanaume wanne
  rationale: Muundo wa kuwepo unaowatambulisha wahusika wapya umetafsiriwa kwa Kiswahili cha kawaida. Nomino ya Kiebrania ni ya kiume na katika simulizi inarejelea wanaume.
- source_word: מְצֹרָעִים
  choice: waliokuwa na ugonjwa wa ngozi
  rationale: Neno hilo humaanisha walioathiriwa na hali inayohusishwa na צָרַעַת; si lazima iwe ugonjwa wa Hansen unaoitwa ukoma leo. Tafsiri hii huepuka usahihi wa kimatibabu usiokuwapo katika chanzo.
- source_word: פֶּתַח הַ/שָּׁעַר
  choice: kwenye mwingilio wa lango
  rationale: Kirai cha Kiebrania humaanisha sehemu ya kuingilia au uwazi wa lango; 'kwenye mwingilio wa lango' ni wazi na asilia.
- source_word: וַ/יֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: Wakaambiana
  rationale: Nahau ya umoja inayotumika kwa maana ya kufanyiana kitendo inaonyesha kuwa walisemezana wao kwa wao; 'wakaambiana' huwasilisha maana hiyo kwa ufupi na kwa kawaida.
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: Kwa nini tukae hapa
  rationale: מָה katika swali hili la balagha lina maana ya 'kwa nini.' Kitenzi cha kuketi pia kinaashiria kubaki bila kuchukua hatua; 'tukae' huhifadhi picha hiyo kwa Kiswahili asilia.
- source_word: עַד מָתְנוּ
  choice: mpaka tufe
  rationale: Kirai kinaonyesha kikomo au matokeo ya kuendelea kukaa hapo. 'Mpaka tufe' ni tafsiri ya moja kwa moja na ya kawaida.
