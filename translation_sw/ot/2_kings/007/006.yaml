reference: 2 Kings 7:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: sw
  text: Kwa maana Bwana alikuwa ameifanya kambi ya Waaramu isikie sauti ya magari ya vita, sauti ya farasi, na sauti ya jeshi kubwa. Basi wakaambiana[a], “Tazama, mfalme wa Israeli amewaajiri wafalme wa Wahiti na wafalme wa Misri ili waje dhidi yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kila mtu alimwambia ndugu yake.”
    reason: Muundo halisi wa Kiebrania ni nahau ya kusema wao kwa wao.
lexical_decisions:
- source_word: וַאדֹנָי
  choice: Bwana
  rationale: Ni jina la cheo la Mungu wa Israeli katika muktadha huu. “Bwana” ni tafsiri ya kawaida na yenye heshima, bila kulichukulia kana kwamba ni Tetragramatoni.
- source_word: הִשְׁמִיעַ
  choice: alikuwa ameifanya ... isikie
  rationale: 'Kauli ya Hifili ni ya kusababisha: Bwana ndiye aliyeifanya kambi isikie. Muundo “alikuwa ame-” unaonyesha kwamba tendo hilo linaeleza sababu ya kukimbia kwa Waaramu katika muktadha.'
- source_word: מַחֲנֵה אֲרָם
  choice: kambi ya Waaramu
  rationale: Hutaja kambi ya watu wa Aramu kwa Kiswahili cha kawaida, bila kutumia “Syria,” jina linaloweza kuleta maana ya kisiasa ya baadaye.
- source_word: קוֹל רֶכֶב
  choice: sauti ya magari ya vita
  rationale: רֶכֶב hapa ni magari ya kivita; “magari ya vita” ni wazi kwa msomaji wa sasa na hudumisha picha ya kijeshi.
- source_word: קוֹל סוּס
  choice: sauti ya farasi
  rationale: Huhifadhi urudiaji wa קוֹל na taswira halisi ya jeshi linalokaribia.
- source_word: קוֹל חַיִל גָּדוֹל
  choice: sauti ya jeshi kubwa
  rationale: חַיִל katika muktadha huu ni nguvu ya kijeshi au jeshi, si mali wala ushujaa.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: wakaambiana
  rationale: Hutoa maana ya usemi wa kurudiana kwa Kiswahili cha asili; maana halisi ya muundo wa Kiebrania imewekwa katika tanbihi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Hutoa nguvu ya kuvuta usikivu ya neno la Kiebrania kwa lugha yenye heshima na inayoeleweka.
- source_word: שָׂכַר עָלֵינוּ
  choice: amewaajiri ... dhidi yetu
  rationale: שׂכר ni kuajiri, na עַל katika muktadha huu ina maana ya uhasama. Hakuna kitu kama “mamluki” kilichoongezwa.
- source_word: מַלְכֵי הַחִתִּים
  choice: wafalme wa Wahiti
  rationale: Huhifadhi wingi wa maandishi ya Kiebrania na utambulisho wa watu hao.
- source_word: מַלְכֵי מִצְרַיִם
  choice: wafalme wa Misri
  rationale: Huhifadhi wingi wa Kiebrania ulivyo, hata kama usemi huo unaweza kuonekana usiotarajiwa kihistoria.
- source_word: לָבוֹא עָלֵינוּ
  choice: ili waje dhidi yetu
  rationale: Huhifadhi maana ya mwendo wa kiuadui bila kuufafanua zaidi kuwa shambulio lililokwisha kuanza.
theological_decisions:
- issue: Tafsiri ya jina la cheo אֲדֹנָי
  choice: Bwana
  alternative: bwana mkuu
  rationale: Mhusika anayesababisha Waaramu kusikia sauti ni Mungu wa Israeli. “Bwana” ni jina la cheo la kawaida la Mungu katika Kiswahili, lakini halibadilishi אֲדֹנָי kuwa jina יהוה lisilopo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Urudiaji wa “sauti ya” umehifadhiwa kwa sababu ni sehemu ya msisitizo na taswira ya maandishi ya Kiebrania.
