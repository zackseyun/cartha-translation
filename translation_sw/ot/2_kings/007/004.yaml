source:
  edition: WLC
  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: sw
  text: “Tukisema, ‘Tuingie mjini,’ njaa iko mjini, nasi tutakufa humo. Tukikaa hapa, tutakufa. Basi, twendeni, tukajisalimishe kwa kambi ya Aramu[a][b]. Wakituacha tuishi, tutaishi; na wakituua, tutakufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana ya neno kwa neno: “tukaiangukie kambi ya Aramu.” Nahau ya Kiebrania inaweza kumaanisha kwenda upande wa jeshi jingine au kujisalimisha kwake.'
    reason: lexical_alternative
  - marker: b
    text: Aramu ni jina la Kiebrania la eneo ambalo pia huitwa Shamu; watu wake huitwa Waaramu.
    reason: cultural_note
lexical_decisions:
- source_word: נָבוֹא
  choice: Tuingie
  rationale: Kauli hii iko ndani ya pendekezo linalotanguliwa na ‘tukisema’; ‘tuingie’ huwasilisha kwa kawaida wazo la mtu wa kwanza wingi katika Kiswahili.
- source_word: הָעִיר
  choice: mjini
  rationale: Ingawa neno la Kiebrania ni ‘mji,’ katika Kiswahili ‘kuingia mjini’ ni muundo wa kawaida. Muktadha unaonyesha kuwa mji huo ni Samaria bila kulazimika kuongeza jina lisilokuwapo katika mstari.
- source_word: הָרָעָב
  choice: njaa
  rationale: Hapa רָעָב ni hali ya ukosefu mkubwa wa chakula wakati wa kuzingirwa, si hisia ya kuwa na njaa tu.
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: tutakufa
  rationale: Katika sentensi hizi za masharti, kitenzi kinaonyesha matokeo yanayotarajiwa; wakati ujao wa Kiswahili unaeleza jambo hilo wazi na kwa kawaida.
- source_word: יָשַׁבְנוּ פֹה
  choice: Tukikaa hapa
  rationale: ישב inaweza kumaanisha kukaa, kubaki, au kuishi mahali. ‘Kukaa hapa’ huhifadhi picha halisi na pia maana ya kubaki.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Maneno haya yanahamisha hoja kutoka kupima njia mbalimbali hadi kutoa mwito wa kuchukua hatua.
- source_word: לְכוּ
  choice: njooni
  rationale: Ingawa maana ya msingi ni ‘nendeni,’ katika mwito unaofuatwa na pendekezo la pamoja, ‘njooni’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: וְנִפְּלָה אֶל
  choice: tukajisalimishe kwa
  rationale: Katika muktadha wa kijeshi, נפל אל inaweza kumaanisha kwenda upande wa jeshi jingine au kujisalimisha kwake. Tafsiri hii inatoa maana ya nahau kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi picha halisi na wigo wake.
- source_word: מַחֲנֵה אֲרָם
  choice: kambi ya Waaramu
  rationale: ‘Waaramu’ hutaja watu wa Aramu kwa kawaida katika Kiswahili; muundo huu pia huhifadhi neno ‘kambi’ la chanzo.
- source_word: יְחַיֻּנוּ
  choice: Wakituacha tuishi
  rationale: Kitenzi hiki humaanisha kuwaacha au kuwahifadhi watu hai. Muundo huu uko karibu na chanzo na huhifadhi urudiaji unaofuata wa ‘tutaishi.’
- source_word: נִחְיֶה
  choice: tutaishi
  rationale: Hili ni tokeo la moja kwa moja la kuachwa hai, na urudiaji wake umehifadhiwa kama katika Kiebrania.
- source_word: יְמִיתֻנוּ
  choice: wakituua
  rationale: Hifili ya מות ina maana ya kusababisha kifo au kuua. ‘Wakituua’ ni njia ya moja kwa moja na ya kawaida ya kusema hivyo katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa sasa na wenye heshima. ‘Njooni’ na ‘tukajisalimishe’ zinaonyesha mwito wa pamoja bila kuwa za mazungumzo kupita kiasi. Urudiaji wa ‘tuishi, tutaishi’ na ‘tutakufa’ umehifadhiwa kwa sababu ni sehemu muhimu ya mkazo na mpangilio wa chanzo.
