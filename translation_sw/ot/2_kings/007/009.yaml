base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: sw
  text: Kisha wakaambiana, “Tunachofanya si sawa. Leo ni siku ya habari njema, lakini sisi tunakaa kimya. Tukingoja mpaka mapambazuko, hatia itatupata.[a] Sasa basi, njooni, twende tukatoe habari hii kwa nyumba ya mfalme.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “adhabu itatupata,” au “tutakuwa na hatia.” Kiebrania kinasema kihalisi, “hatia/uovu utatupata.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya mfalme” inaweza pia kumaanisha “watu wa nyumbani mwa mfalme” au “ikulu ya kifalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: Tunachofanya si sawa
  rationale: Hutoa tathmini ya kimaadili ya nahau ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi, bila kuwa tafsiri ngumu ya neno kwa neno.
- source_word: יוֹם בְּשֹׂרָה
  choice: siku ya habari njema
  rationale: בְּשֹׂרָה hapa ni habari njema ya ukombozi au ushindi; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: מַחְשִׁים
  choice: tunakaa kimya
  rationale: Umbo hili linaonyesha ukimya unaoendelea na wa kukusudia, yaani kuwaficha wengine habari hiyo.
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: Tukingoja mpaka mapambazuko
  rationale: Muundo umetafsiriwa kama sharti kulingana na muktadha; “mapambazuko” huwasilisha kwa asili אור הבקר, nuru ya asubuhi.
- source_word: וּמְצָאנוּ עָוֹן
  choice: hatia itatupata
  rationale: Huhifadhi kwa karibu sitiari ya Kiebrania, “hatia/uovu utatupata,” huku tanbihi ikionyesha uwezekano wa maana ya adhabu.
- source_word: לְכוּ וְנָבֹאָה
  choice: njooni, twende
  rationale: Huhifadhi mwito wa kuchukua hatua mara moja unaotolewa na vitenzi viwili vya Kiebrania.
- source_word: וְנַגִּידָה
  choice: tukatoe habari hii
  rationale: נגד katika Hifili ni kusema, kutangaza, au kutoa taarifa; hapa ni habari ya dharura inayopaswa kufikishwa kwa upande wa mfalme.
- source_word: בֵּית הַמֶּלֶךְ
  choice: jamaa ya mfalme
  rationale: בית המלך inaweza kumaanisha nyumba au ikulu ya mfalme, lakini pia watu wa nyumba yake; “jamaa ya mfalme” huhifadhi maana pana ya kundi la kifalme bila kuifunga kwa jengo pekee.
theological_decisions:
- issue: Maana ya עָוֹן katika usemi וּמְצָאנוּ עָוֹן
  choice: hatia itatupata
  alternative: adhabu itatupata; tutajiletea hatia
  rationale: Neno linaweza kuelekea kwenye hatia yenyewe au matokeo yake ya adhabu. Tafsiri kuu huhifadhi taswira na mvutano wa maandishi ya Kiebrania, na tanbihi hutaja maana nyingine zinazowezekana bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida. “Njooni, twende” huhifadhi msisitizo wa mwito wa Kiebrania; tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
