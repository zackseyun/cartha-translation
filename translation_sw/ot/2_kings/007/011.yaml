  text: Then the gatekeepers called out and reported it inside the king’s house[a].
translation:
  language: sw
  text: Ndipo walinzi wa lango wakapaza sauti, nao wakatoa habari ndani ya nyumba ya mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawajulisha watu wa nyumba ya mfalme waliokuwa ndani”; Kiebrania kinasema kihalisi, “nyumba ya mfalme kuelekea ndani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: wakapaza sauti
  rationale: Kitenzi קרא hapa kina umoja ingawa kinafuatwa na kundi la walinzi; katika muktadha huu kinaeleza kuita kwa sauti ili habari isikike. Kiswahili hutumia wingi kulingana na mhusika wa pamoja.
- source_word: הַשֹּׁעֲרִים
  choice: walinzi wa lango
  rationale: Neno שֹׁעֲרִים humaanisha watu waliowekwa langoni. ‘Walinzi wa lango’ ni la kawaida na wazi zaidi katika Kiswahili cha sasa kuliko ‘wabawabu,’ ambalo linaweza kueleweka kwa maana finyu.
- source_word: וַיַּגִּידוּ
  choice: wakatoa habari
  rationale: Kitenzi נגד humaanisha kujulisha au kutoa taarifa. ‘Wakatoa habari’ linafaa kwa mfululizo wa simulizi, huku kile walichoripoti kikieleweka kutokana na muktadha bila kuongeza kiwakilishi kisicho katika Kiebrania.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Huhifadhi usemi halisi ‘nyumba ya mfalme’ bila kuamua kimya kimya kama kinachokusudiwa ni jengo la ikulu au watu wa nyumba ya kifalme.
- source_word: פְּנִימָה
  choice: ndani
  rationale: Kielezi hiki huonyesha mwelekeo kuelekea sehemu ya ndani. ‘Ndani’ ni kifupi, cha kawaida, na kinahifadhi utata wa mahali au walengwa wa taarifa.
theological_decisions: []
