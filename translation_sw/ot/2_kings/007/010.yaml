base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: sw
  text: Basi wakaenda, wakawaita walinzi wa lango la jiji, wakawaambia, “Tulikwenda kwenye kambi ya Aramu[b], na tazama, hakukuwa na mtu yeyote huko wala sauti ya binadamu[a]. Kulikuwa tu na farasi waliofungwa, punda waliofungwa, na mahema yakiwa kama yalivyokuwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala sauti ya mtu.” Neno la Kiebrania linaweza kumaanisha hasa sauti ya mtu anayesema au, kwa upana zaidi, sauti yoyote inayotokana na binadamu.
    reason: lexical_alternative
  - marker: b
    text: Kijadi, “kambi ya Wasyri[a].”
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: walinzi wa lango la jiji
  rationale: Ingawa nomino ya Kiebrania iko katika umoja, vitenzi na viwakilishi vya wingi vinavyoifuata vinaonyesha maana ya kikundi cha watu waliolinda lango. Tafsiri ya wingi ni ya kawaida na wazi katika Kiswahili.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: wakawaambia
  rationale: Muundo huu wa Kiebrania unaonyesha kutoa taarifa na kuanzisha maneno yanayonukuliwa. ‘Wakawaambia’ ni Kiswahili cha asili kisichorudia kwa uzito ‘wakiwaambia, wakisema.’
- source_word: מַחֲנֵה אֲרָם
  choice: kambi ya Aramu
  rationale: ‘Aramu’ huhifadhi jina la Kiebrania la mahali na watu badala ya kulibadilisha kuwa jina la kisasa au la kimapokeo ‘Siria.’
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: ‘Tazama’ huhifadhi nguvu ya uwasilishaji wa ghafla na wa wazi ya הִנֵּה, huku ikifaa katika lugha yenye hadhi ya simulizi la Biblia.
- source_word: אֵין שָׁם אִישׁ
  choice: hapakuwa na mtu yeyote huko
  rationale: אִישׁ hapa humaanisha mtu kwa ujumla, si mwanamume pekee. Tafsiri hii inaeleza kutokuwapo kwa mtu yeyote kambini.
- source_word: וְקוֹל אָדָם
  choice: wala sauti ya binadamu
  rationale: קוֹל inaweza kumaanisha sauti ya mtu anayesema au sauti yoyote inayotokana na mtu. ‘Sauti ya binadamu’ huhifadhi upana huo bila kuamua kimya kimya kati ya maana hizo.
- source_word: כִּי אִם
  choice: kulikuwa tu na
  rationale: Kirai hiki huanzisha vitu pekee vilivyokuwapo licha ya kutokuwapo kwa watu. Muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: farasi waliofungwa, punda waliofungwa
  rationale: Majina ya umoja katika Kiebrania yanaeleweka kwa maana ya jumla au ya kikundi. Wingi wa Kiswahili unafaa katika mazingira ya kambi, na ‘waliofungwa’ huwasilisha maana ya אסר kwa uwazi.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: na mahema yakiwa kama yalivyokuwa
  rationale: Tafsiri hii huhifadhi wazo kwamba mahema yaliachwa katika hali yao ileile bila kuongeza maelezo yasiyotajwa moja kwa moja.
- source_word: אָדָם
  choice: binadamu
  rationale: Hapa neno hili linahusu wanadamu kwa ujumla. ‘Binadamu’ ni sahihi na halileti maana finyu ya jinsia ya kiume.
