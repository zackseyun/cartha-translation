base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: sw
  text: Mfalme alikuwa amemweka afisa yule[a], ambaye alikuwa akijiegemeza mkononi mwake[b], awe msimamizi wa lango. Lakini watu wakamkanyaga langoni, naye akafa, kama vile mtu wa Mungu alivyokuwa amesema wakati mfalme aliposhuka kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamanda” au “msaidizi mkuu wa mfalme.” Neno la Kiebrania שָׁלִישׁ humaanisha afisa wa cheo cha juu aliye karibu na mfalme.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ambaye [mfalme] alikuwa akijiegemeza juu ya mkono wake”; hii ni nahau ya Kiebrania inayomtambulisha afisa huyo kuwa mhudumu wa karibu wa mfalme.
    reason: cultural_note
lexical_decisions:
- source_word: הִפְקִיד
  choice: alikuwa amemweka ... kuwa msimamizi
  rationale: Hifili ya פקד hapa inaonyesha kumpa mtu jukumu la usimamizi. Muundo huu pia unaonyesha kwamba uteuzi ulitangulia kukanyagwa kwake.
- source_word: הַשָּׁלִישׁ
  choice: afisa
  rationale: Neno hili humaanisha afisa wa cheo cha juu aliye karibu na mfalme; “afisa” huepuka kutaja cheo mahususi kisichothibitishwa na muktadha.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: ambaye alijiegemeza mkononi mwake
  rationale: Tafsiri hii inadumisha picha ya Kiebrania ya mfalme kujiegemeza kwenye mkono wa afisa, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: עַל הַשַּׁעַר
  choice: kuwa msimamizi wa lango
  rationale: Pamoja na הִפְקִיד, kihusishi עַל kinaonyesha mamlaka au jukumu la kusimamia, si mahali tu.
- source_word: וַיִּרְמְסֻהוּ
  choice: wakamkanyaga
  rationale: Kitenzi רמס kina maana ya kukanyaga; tafsiri hii ni ya moja kwa moja bila kuongeza maelezo yasiyokuwapo.
- source_word: בַּשַּׁעַר
  choice: langoni
  rationale: Huonyesha eneo la lango ambako watu walimkanyaga.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: kama vile ... alivyokuwa amesema
  rationale: Muundo huu unaonyesha wazi kwamba tukio hilo lilitimiza neno lililokuwa limetamkwa hapo awali.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina maalumu la kawaida katika simulizi na limehifadhiwa badala ya kubadilishwa kuwa “nabii.”
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: wakati mfalme aliposhuka kwenda kwake
  rationale: ב pamoja na kitenzi-jina huonyesha wakati; “aliposhuka kwenda kwake” huhifadhi mwendo wa kushuka na uelekeo kwa mtu wa Mungu.
theological_decisions:
- issue: Kutimia kwa neno la kinabii
  choice: Kifo cha afisa kimeunganishwa wazi na neno la awali la mtu wa Mungu kwa maneno “kama vile ... alivyokuwa amesema.”
  alternative: Kutaja tu kifo chake bila kusisitiza uhusiano wake na neno lililotangulia.
  rationale: Kiebrania kinaunganisha tukio hilo moja kwa moja na tamko la mtu wa Mungu kwa matumizi ya vifungu viwili vyenye דִּבֶּר; tafsiri inahifadhi msisitizo huo bila kuongeza dai jingine la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye heshima. Viunganishi “lakini” na “naye” vinaweka uhusiano wa matukio wazi bila kuongeza kishazi cha wakati kisichokuwapo katika chanzo. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
