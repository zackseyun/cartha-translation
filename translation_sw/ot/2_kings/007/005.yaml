id: 2KI.7.5
reference: 2 Kings 7:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: sw
  text: Basi wakaondoka wakati wa machweo ili waende kwenye kambi ya Waaramu. Walipofika ukingoni mwa kambi ya Waaramu, tazama, hapakuwa na mtu yeyote huko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: Basi wakaondoka
  rationale: Kitenzi קום katika mfululizo wa masimulizi kinaendeleza tukio; “wakaondoka” ni Kiswahili cha kawaida kinachoonyesha waliinuka na kuanza safari, huku “Basi” ikiakisi mwendelezo wa simulizi.
- source_word: בַנֶּשֶׁף
  choice: wakati wa machweo
  rationale: נֶשֶׁף hapa inaashiria kipindi cha jioni mwanga unapofifia; “wakati wa machweo” ni wazi na cha kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: לָבוֹא אֶל
  choice: ili waende kwenye
  rationale: Infinitivu לָבוֹא inaonyesha kusudi la kuondoka kwao. Kwa mtazamo wa msimulizi, “waende kwenye” ni ya kawaida zaidi kuliko tafsiri ya moja kwa moja “waje kwenye.”
- source_word: מַחֲנֵה אֲרָם
  choice: kambi ya Waaramu
  rationale: Ingawa muundo ni “kambi ya Aramu,” katika muktadha Aramu inawakilisha watu/jeshi la Waaramu; “kambi ya Waaramu” ni sahihi na ya kawaida katika Kiswahili.
- source_word: עַד קְצֵה
  choice: ukingoni mwa
  rationale: Kirai hiki kinaonyesha mpaka au sehemu ya nje kabisa ya kambi; “ukingoni mwa” huhifadhi taswira hiyo kwa lugha ya kawaida.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: הִנֵּה huvuta fikira kwenye jambo la kushangaza waliloligundua. “Tazama” huhifadhi nguvu hiyo ya kisimulizi bila kuifuta.
- source_word: אֵין שָׁם אִישׁ
  choice: hapakuwa na mtu yeyote huko
  rationale: אִישׁ ni nomino ya umoja wa kiume lakini hapa hutumiwa kwa maana ya jumla ya kutokuwapo kwa binadamu yeyote. “Mtu yeyote” ni ya asili, sahihi, na haiingizi dai kwamba wanaume pekee ndio waliokuwa hawapo.
theological_decisions:
- issue: אִישׁ ya umoja wa kiume katika muktadha unaomaanisha kutokuwapo kwa mtu yeyote
  choice: hapakuwa na mtu yeyote huko
  alternative: hapakuwa na mwanamume huko
  rationale: Katika kirai hasi אֵין שָׁם אִישׁ, אִישׁ ina maana ya jumla (“hakuna mtu”), si lazima mwanamume kwa kulinganisha na mwanamke. Kiswahili “mtu yeyote” huhifadhi maana ya muktadha bila kuondoa au kuongeza uzito wa kitheolojia.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo ni wa ulinganifu mwafaka: unafuata hatua za Kiebrania na huhifadhi “tazama,” huku ukitumia miundo ya kawaida ya Kiswahili kama “wakaondoka” na “mtu yeyote.”'
