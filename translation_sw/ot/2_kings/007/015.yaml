  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi ya simulizi la Maandiko. Muundo wa vitenzi vya mfululizo umehifadhiwa kwa 'waka-' pale unapofaa, huku sentensi zikibaki za kawaida kwa msomaji wa leo.
