  text: וַ/יֵּלְכ֣וּ אַחֲרֵי/הֶם֮ עַד הַ/יַּרְדֵּן֒ וְ/הִנֵּ֣ה כָל הַ/דֶּ֗רֶךְ מְלֵאָ֤ה בְגָדִים֙ וְ/כֵלִ֔ים אֲשֶׁר הִשְׁלִ֥יכוּ אֲרָ֖ם ב/החפז/ם וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יַּגִּ֖דוּ לַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: sw
  text: Basi wakawafuata mpaka Yordani. Tazama, njia yote ilikuwa imejaa mavazi na vifaa ambavyo Waaramu walikuwa wamevitupa katika haraka yao. Kisha wale wajumbe wakarudi na kumpa mfalme habari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: Basi wakawafuata
  rationale: Muundo huu unaonyesha mwendelezo wa simulizi na maana ya kuwafuata wale waliokimbia, bila kuongeza wazo kali zaidi la kuwafukuza.
- source_word: עַד הַיַּרְדֵּן
  choice: mpaka Yordani
  rationale: עַד inaonyesha ukomo wa safari; 'mpaka Yordani' ni Kiswahili cha kawaida na sahihi.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa jambo lililoonekana ghafla na kuhifadhi uhai wa simulizi ya Kiebrania.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: njia yote ilikuwa imejaa
  rationale: Tafsiri hii inahifadhi picha halisi ya vitu vilivyotapakaa katika njia nzima.
- source_word: בְגָדִים
  choice: mavazi
  rationale: '''Mavazi'' ni neno la kawaida lenye hadhi linalomaanisha vitu vya kuvaa.'
- source_word: וְכֵלִים
  choice: vifaa
  rationale: כֵלִים ni neno pana kwa vyombo, vitu, au zana; katika muktadha wa jeshi linalokimbia, 'vifaa' huhifadhi upana huo bila kulibana kuwa silaha au vyombo pekee.
- source_word: אֲשֶׁר הִשְׁלִיכוּ אֲרָם
  choice: ambavyo Waaramu walikuwa wamevitupa
  rationale: Ingawa Kiebrania kina jina la pamoja 'Aramu,' Kiswahili huhitaji jina la watu 'Waaramu' ili kuendana kwa kawaida na kitendo na kiwakilishi cha wingi.
- source_word: בְחָפְזָם
  choice: kwa haraka yao
  rationale: Huhifadhi maana ya kutenda kwa pupa au haraka chini ya shinikizo bila kuongeza kwa lazima wazo la hofu kuu.
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: Kisha wale wajumbe wakarudi
  rationale: מַלְאָכִים humaanisha kwa msingi 'wajumbe'; muktadha unaonyesha kuwa ndio watu waliotumwa kuchunguza, lakini 'wapelelezi' lingekuwa fasiri nyembamba zaidi.
- source_word: וַיַּגִּדוּ לַמֶּלֶךְ
  choice: na kumpa mfalme habari
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha maana ya kuripoti au kumweleza mfalme walichogundua.
theological_decisions: []
