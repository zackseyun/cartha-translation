base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: sw
  text: Ndipo yule ofisa ambaye mfalme alikuwa akiegemea mkono wa ofisa huyo akamjibu mtu wa Mungu, akasema, “Tazama, hata kama Yahweh angefanya madirisha mbinguni, je, jambo hili lingeweza kutokea?” Naye akasema, “Tazama, utaliona kwa macho yako mwenyewe, lakini hutakula chochote katika hayo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: ofisa
  rationale: Neno hilo humaanisha afisa wa juu wa kijeshi au wa kifalme; ‘ofisa’ ni wazi kwa msomaji wa sasa bila kubainisha cheo kisichotajwa moja kwa moja.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: ambaye mfalme alijiegemeza mkononi mwake
  rationale: Inahifadhi taswira halisi ya mfalme kumtegemea ofisa huyo na maana ya msingi ya יָד, ‘mkono.’
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni cheo cha kawaida cha Kiebrania kwa nabii, na tafsiri hii inakihifadhi bila kukifafanua zaidi ya maandishi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kiashiria hiki huvuta fikira na hapa kinatunza mkazo wa kauli ya kejeli na wa jibu la moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetafsiriwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: angefanya madirisha mbinguni
  rationale: Inahifadhi sitiari ya ‘madirisha’ au matundu ya mbinguni badala ya kuifasiri moja kwa moja kuwa milango ya mafuriko.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: je, jambo hili lingeweza kutokea?
  rationale: Muundo wa swali unaonyesha kutoamini uwezekano wa ahadi hiyo.
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: utaliona kwa macho yako mwenyewe
  rationale: Kiswahili hiki ni cha kawaida na kinatunza msisitizo wa kuona binafsi.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: lakini hutakula chochote kati ya hivyo
  rationale: Kifungu kinamnyima ofisa kushiriki katika chakula au mahitaji yaliyokuwa yameahidiwa; ‘kati ya hivyo’ kinaelekeza kwa kile kilichotajwa katika muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la agano יהוה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Nguvu ya kauli ya ofisa kuhusu madirisha ya mbinguni
  choice: hata kama Yahweh angefanya madirisha mbinguni
  alternative: ikiwa Yahweh angefungua malango ya mafuriko mbinguni
  rationale: Tafsiri inahifadhi picha ya Kiebrania na sauti ya shaka bila kuamua kwamba madirisha hayo lazima yahusu mvua au mafuriko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ofisa’ linaeleweka kwa upana, huku sentensi ikihifadhi taswira ya kifalme, kejeli ya swali, na jibu kali la mtu wa Mungu.
