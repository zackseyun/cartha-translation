    rationale: '"Mwake" inaweza kurejelea mfalme badala ya ofisa, ilhali Kiebrania humtaja afisa ambaye mkono wake mfalme alikuwa akiuegemea.'
  - severity: medium
    issue: '"Hutakula chochote kati ya hivyo" haisemi kwa kawaida "from it/from there."'
