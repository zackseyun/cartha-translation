  to: 'Kisha Elisha akasema, “Sikilizeni neno la Yahweh. Yahweh asema hivi: Kesho wakati kama huu, seah moja[a] ya unga laini itauzwa kwa shekeli moja, na seah mbili za shayiri kwa shekeli moja, kwenye lango la Samaria.”'
