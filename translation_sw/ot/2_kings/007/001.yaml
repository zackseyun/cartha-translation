language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: sw
  text: 'Kisha Elisha akasema, “Sikilizeni neno la Yahweh. Yahweh asema hivi: Kesho wakati kama huu, seah moja[a] ya unga laini itauzwa kwa shekeli moja, na seah mbili za shayiri kwa shekeli moja, kwenye lango la Samaria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Seah ilikuwa kipimo cha vitu vikavu; Kiebrania kinataja kipimo hiki mahususi badala ya kusema tu ‘kipimo.’
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akasema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida huku ukihifadhi maana ya tendo linalofuata.
- source_word: שִׁמְעוּ
  choice: Sikilizeni
  rationale: Ni amri ya wingi na hapa ni mwito rasmi wa kusikiliza tangazo la kinabii.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: Neno ‘neno’ linahifadhi mtindo wa kawaida wa tangazo la kinabii kuliko tafsiri pana zaidi ya ‘ujumbe’.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo linalopatana na tahajia na matamshi ya kawaida ya Kiswahili, badala ya kubadilishwa kuwa cheo ‘BWANA’.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahwe asema hivi
  rationale: Hili ni tamko rasmi la mjumbe wa kinabii; mpangilio huu ni wa asili katika Kiswahili na unahifadhi uzito wake.
- source_word: כָּעֵת מָחָר
  choice: Kesho karibu na wakati kama huu
  rationale: Neno כְּ linaweza kuonyesha ukaribu wa wakati; ‘karibu na wakati kama huu’ linahifadhi kutokuwa kamili kwa wakati uliotajwa.
- source_word: סְאָה
  choice: sea
  rationale: Ni kipimo maalumu cha vitu vikavu. Kutoholewa kwa jina la kipimo kunahifadhi taarifa mahususi ya kiuchumi badala ya kutumia ‘kipimo’ kwa ujumla.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno hili linamaanisha unga uliosagwa vizuri, si unga kwa ujumla.
- source_word: בְּשֶׁקֶל
  choice: kwa shekeli moja
  rationale: Katika muktadha wa soko, kihusishi kinaonyesha bei; usemi huu ni wa kawaida katika Kiswahili.
- source_word: וְסָאתַיִם
  choice: na sea mbili
  rationale: Umbo la Kiebrania ni la idadi mbili; kipimo kilekile kimetumiwa kwa uthabiti.
- source_word: שְׂעֹרִים
  choice: shayiri
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa nafaka inayotajwa.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: kwenye lango la Samaria
  rationale: Lango la mji lilikuwa mahali pa biashara na shughuli za umma; ‘kwenye lango’ ni usemi wa asili bila kuongeza maelezo hayo katika matini.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yahweh; Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi jina hilo kwa umbo linalofaa Kiswahili, badala ya kulibadilisha kuwa cheo au kutumia umbo jingine la kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tangazo la kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa bei umewekwa wazi kwa kitenzi ‘itauzwa,’ ambacho kinadokezwa na muktadha wa Kiebrania. Alama ya tanbihi imewekwa baada ya kutajwa kwa ‘sea,’ jambo linalolingana moja kwa moja na maelezo ya tanbihi.
