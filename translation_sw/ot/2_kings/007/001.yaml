  verdict: revise
  source_fidelity: 'Maana kuu imehifadhiwa: mwito wa kinabii, wakati wa kesho, vipimo vya nafaka, bei, na eneo la lango la Samaria vyote vipo. Hata hivyo, usemi “karibu na wakati kama huu” si wa kawaida katika Kiswahili na unaweza kudokeza ukaribu usio wa lazima; “kesho wakati kama huu” huwasilisha kwa ufasaha wakati uleule wa kesho huku ukiacha ukadiriaji wa Kiebrania usio wa kipimo sahihi.'
  naturalness: Tafsiri ina mtiririko mzuri kwa ujumla. “Kesho wakati kama huu” ni usemi wa kawaida zaidi wa Kiswahili Sanifu kuliko “Kesho karibu na wakati kama huu.”
  terminology: “Unga laini,” “shayiri,” “shekeli,” na “lango la Samaria” zinafaa. Jina la Mungu lirekebishwe kuwa “Yahweh” ili lilingane na uamuzi wa mradi wa kutafsiri יהוה na tahajia inayotumika katika mkondo wa ukaguzi wa POB. Kipimo maalumu kihifadhiwe kama “seah,” kwa tahajia iliyo wazi zaidi na inayolingana na tanbihi.
  issues:
  - severity: medium
    issue: 'Tahajia ya jina la Mungu: “Yahwe”'
    rationale: Matini chanzi ina יהוה, na mkondo wa POB umeamua “Yahweh.” Kutumia “Yahweh” huhifadhi jina hilo kwa uthabiti katika lugha za mradi bila kulibadilisha kuwa cheo.
  - severity: low
    issue: “Kesho karibu na wakati kama huu”
    rationale: Usemi huu si wa kawaida katika Kiswahili cha sasa na huongeza wazo la “karibu” kwa namna isiyo laini. “Kesho wakati kama huu” ni idiomatiki na hubeba maana ya muda unaolingana siku inayofuata.
  - severity: low
    issue: Tahajia ya kipimo “sea”
    rationale: “Seah” ni uhamishaji unaotambulika zaidi wa סאה na huondoa uwezekano wa kuchanganywa na neno la Kiingereza “sea”; tanbihi inaeleza kipimo hicho.
