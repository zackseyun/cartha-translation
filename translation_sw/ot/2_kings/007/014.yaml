  yaml_path: translation/ot/2_kings/007/014.yaml
  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: sw
  text: Basi wakachukua magari mawili ya vita pamoja na farasi[a], naye mfalme akawatuma waifuate kambi ya Aramu, akisema, “Nendeni mkaone.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “magari mawili ya farasi,” usemi uliobanwa ambao huenda unamaanisha magari mawili ya vita yaliyokokotwa na farasi au vikosi viwili vya magari na farasi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Basi wakachukua
  rationale: Kitenzi cha simulizi kinaendeleza mfululizo wa matukio; “Basi” kinaonyesha mwendelezo na matokeo ya uamuzi uliotangulia kwa Kiswahili cha kawaida.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: magari mawili ya vita pamoja na farasi
  rationale: Kirai cha Kiebrania kimebanwa na kinaweza kueleweka kuwa magari mawili yaliyokokotwa na farasi au vikosi viwili vya magari na farasi. Tafsiri hii ni wazi kwa msomaji bila kuficha hali hiyo, ambayo imeelezwa katika tanbihi.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: naye mfalme akawatuma
  rationale: Kiambishi cha watendewa katika “akawatuma” kinarejelea kwa kawaida watu wa msafara wa upelelezi wanaohusishwa na magari yaliyotajwa.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: waifuate kambi ya Aramu
  rationale: אַחֲרֵי hapa ina maana ya kuelekea nyuma ya au kufuata; “waifuate” ni Kiswahili cha asili kinachofaa kwa msafara wa upelelezi, bila kuongeza wazo la kushambulia.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la eneo au ufalme limetoholewa kwa namna iliyozoeleka katika Kiswahili; “Siria” lingeingiza jina la baadaye, na “Waaramu” lingebadili jina la eneo kuwa jina la watu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi muundo wa Kiebrania unaotanguliza usemi wa moja kwa moja na unasikika kawaida katika simulizi la Kiswahili.
- source_word: לְכוּ וּרְאוּ
  choice: Nendeni mkaone
  rationale: Huhifadhi amri mbili fupi na za moja kwa moja; umbo la “mkaone” linaonyesha kusudi na mfuatano wa kwenda kisha kuona.
theological_decisions: []
