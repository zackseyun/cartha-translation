  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: sw
  text: Watu hawa wenye ugonjwa wa ngozi[a] walipofika ukingoni mwa kambi, waliingia katika hema moja, wakala na wakanywa. Kisha wakachukua humo fedha, dhahabu, na mavazi, wakaenda wakavificha. Wakarudi, wakaingia katika hema lingine, wakachukua vitu humo, wakaenda wakavificha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “watu wenye ugonjwa wa ngozi” ni neno la kale linaloweza kuhusisha hali mbalimbali za ngozi; si lazima limaanishe tu ukoma unaojulikana leo kama ugonjwa wa Hansen.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: watu hawa wenye ugonjwa wa ngozi
  rationale: צָרַעַת ni neno la kale linaloweza kutaja magonjwa mbalimbali ya ngozi, si lazima ugonjwa wa kisasa wa Hansen pekee. Tafsiri hii ni wazi na huepuka utambuzi finyu wa kitabibu.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: ukingoni mwa kambi
  rationale: קָצֶה hueleza mwisho au ukingo wa mahali; usemi huu ni wa kawaida na huhifadhi maana ya mahali.
- source_word: אֹהֶל אֶחָד
  choice: hema moja
  rationale: Huhifadhi namba moja iliyo wazi katika Kiebrania na mtiririko halisi wa simulizi.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: wakala na kunywa
  rationale: Vitenzi hivi vinaendeleza mfululizo rahisi wa matukio ya simulizi bila kuongeza dhana ya kuanza ambayo haijaelezwa.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: wakachukua humo
  rationale: Katika muktadha huu נשא ina maana ya kuchukua na kuondoa mali. 'Wakachukua humo' ni ya asili katika Kiswahili na hueleza chanzo cha vitu hivyo.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: fedha, dhahabu na mavazi
  rationale: Maneno haya ya kawaida yanaeleweka vizuri katika Kiswahili cha sasa na yanawakilisha vitu vitatu vilivyotajwa katika chanzo.
- source_word: וַיַּטְמִנוּ
  choice: wakaenda kuvificha
  rationale: Kitenzi humaanisha kuficha; hakilazimishi maana maalumu zaidi ya kuvizika. Kiambishi 'vi-' kinarejelea vitu vilivyochukuliwa.
- source_word: וַיָּשֻׁבוּ
  choice: Wakarudi
  rationale: Huhifadhi hatua inayofuata katika mfululizo wa simulizi kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: אֹהֶל אַחֵר
  choice: hema lingine
  rationale: Ni tafsiri ya asili ya 'hema jingine/tofauti' katika mfululizo huu.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: wakachukua vitu humo
  rationale: Katika tukio la pili, Kiebrania hakitaji kitu moja kwa moja. 'Vitu' hufanya sentensi ieleweke katika Kiswahili bila kubainisha mali ambazo chanzo hakizitaji.
