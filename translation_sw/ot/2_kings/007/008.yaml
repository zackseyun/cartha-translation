translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa vitenzi vya simulizi umehifadhiwa kwa miundo ya mfululizo kama 'waka-', huku sentensi zikigawanywa kwa usomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara moja baada ya 'kambi'.
