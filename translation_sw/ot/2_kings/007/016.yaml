  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: sw
  text: Ndipo watu wakatoka, wakaipora kambi ya Aramu. Sea[a] moja ya unga laini ikauzwa kwa shekeli[b] moja, na sea mbili za shayiri kwa shekeli moja, sawasawa na neno la Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sea ni kipimo cha kale cha vitu vikavu.
    reason: cultural_note
  - marker: b
    text: Shekeli ilikuwa kipimo cha uzito kilichotumiwa pia kuonyesha thamani ya fedha.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: Ndipo watu wakatoka
  rationale: Muundo wa masimulizi unaendeleza tukio linalofuata; “ndipo” na “wakatoka” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: וַיָּבֹזּוּ
  choice: wakaipora
  rationale: Kitenzi בזז humaanisha kuchukua nyara kutoka kwa adui; “kupora” kinahifadhi maana hiyo ya kijeshi kwa lugha ya sasa.
- source_word: מַחֲנֵה אֲרָם
  choice: kambi ya Aramu
  rationale: Hili ni tafsiri ya karibu ya muundo wa Kiebrania “kambi ya Aramu,” huku jina la mahali likihifadhiwa badala ya kubadilishwa kuwa Siria.
- source_word: וַיְהִי
  choice: ikauzwa
  rationale: Katika muktadha wa bei ya sokoni, maana inayokusudiwa ni kwamba bidhaa hiyo ilipatikana au kuuzwa kwa bei iliyotajwa.
- source_word: סְאָה / סָאתַיִם
  choice: sea moja / sea mbili
  rationale: “Sea” ni kipimo maalumu cha vitu vikavu; umoja na umbo la uwili la Kiebrania vimeonyeshwa wazi.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Neno סֹלֶת linamaanisha unga uliosagwa vizuri, si unga kwa ujumla tu.
- source_word: בְּשֶׁקֶל
  choice: kwa shekeli moja
  rationale: Huu ni usemi wa kawaida wa Kiswahili wa kutaja bei, huku kipimo cha kale “shekeli” kikihifadhiwa.
- source_word: שְׂעֹרִים
  choice: shayiri
  rationale: Katika muktadha huu neno la wingi la Kiebrania hutaja shayiri kama bidhaa.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: Usemi huu unaonyesha kutimia kwa neno la kinabii lililotangulia na unahifadhi jina la Mungu יהוה kama “Yahwe.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  alternative: kama Yahwe alivyosema
  rationale: Tafsiri iliyochaguliwa inadumisha nomino “neno” iliyo katika Kiebrania na pia wazo la kutimia kwake bila kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na hadhi inayofaa maandiko. Vipimo vya kale vimehifadhiwa na kufafanuliwa kwa tanbihi; jina Aramu limetoholewa kwa mazoea ya Kiswahili.
