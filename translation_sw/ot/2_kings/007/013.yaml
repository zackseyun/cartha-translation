base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: sw
  text: Ndipo mmoja wa watumishi wake akajibu, akasema, “Tafadhali, na wachukue farasi watano miongoni mwa farasi waliobaki, waliosalia humo.[a] Tazama, hao ni kama umati wote wa Israeli waliosalia humo; tazama, hao ni kama umati wote wa Israeli ambao wameangamia.[b] Basi na tutume watu wakaone.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiwakilishi “humo” huenda kinarejelea mji wa Samaria, lakini jina la mji halirudiwi katika mstari huu wa Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kina ulinganisho mgumu na wenye kurudiwa: “hao ni kama umati wote wa Israeli waliosalia humo ... kama umati wote wa Israeli ambao wameangamia.” Tafsiri imehifadhi urudiaji huo badala ya kuulainisha.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: mmoja wa watumishi wake akajibu, akasema
  rationale: Muundo huu unahifadhi nahau ya simulizi ya Kiebrania ya kujibu na kusema; ‘watumishi’ ni neno pana linalofaa kwa mazingira ya kifalme bila kudai hadhi mahususi zaidi.
- source_word: וְיִקְחוּ נָא
  choice: Tafadhali, na wachukue
  rationale: נָא huonyesha ombi la heshima, na umbo la hiari linaelezwa kwa ‘na wachukue.’
- source_word: חֲמִשָּׁה מִן הַסּוּסִים
  choice: farasi watano kati ya wale
  rationale: Hii inaonyesha wazi matumizi ya מן yenye maana ya kuchagua baadhi kutoka katika kundi.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: wale waliobaki, ambao wameachwa humo
  rationale: Maneno ‘waliobaki’ na ‘wameachwa’ yanahifadhi kwa kadiri ya Kiswahili urudiaji wa mzizi שׁאר; ‘humo’ haiongezi nomino ‘mji’ ambayo haijatajwa tena katika mstari huu.
- source_word: הִנָּם
  choice: Tazama, hao ni
  rationale: ‘Tazama’ ni lugha yenye hadhi lakini inayoeleweka, na inahifadhi msisitizo wa kishazi hiki kinachorudiwa.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: kama umati wote wa Israeli
  rationale: ‘Umati’ huwasilisha maana ya kundi kubwa la watu bila kulainisha ulinganisho mgumu wa Kiebrania.
- source_word: אֲשֶׁר תָּמּוּ
  choice: ambao wameangamia
  rationale: Katika mazingira ya njaa na mauti, ‘wameangamia’ huwasilisha maana ya kufikia mwisho au kuisha.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: Basi na tutume watu wakaone
  rationale: Vitenzi vya nafsi ya kwanza vinaonyesha pendekezo la pamoja. Kiswahili huhitaji kwa kawaida kutaja ‘watu’ kama watakaotumwa; ‘wakaone’ huonyesha kusudi la kutumwa kwao.
