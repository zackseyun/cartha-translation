translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji na ulinganisho mgumu wa maandishi ya Kiebrania umehifadhiwa; ‘humo’ linaacha rejeleo la mji likiwa la kudokezwa kama katika chanzo.
