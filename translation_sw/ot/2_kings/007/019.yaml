  text: וַ/יַּ֨עַן הַ/שָּׁלִ֜ישׁ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ וְ/הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה כַּ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/ךָ֤ רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: sw
  text: Ndipo yule afisa akamjibu mtu wa Mungu, akasema, “Kama Yahwe angefanya madirisha mbinguni[a], je, jambo kama hili lingeweza kutokea?” Naye akasema, “Tazama, utaliona kwa macho yako mwenyewe, lakini hutakula kutoka huko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malango ya maji angani.” Kiebrania kinasema kihalisi “madirisha mbinguni,” picha ya matundu ya mbinguni ambayo kupitia hayo riziki au hukumu yaweza kuja.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: afisa
  rationale: Neno hili humaanisha afisa wa juu wa kijeshi au wa kifalme. ‘Afisa’ linaeleweka katika Kiswahili cha sasa bila kubainisha cheo kuliko Kiebrania.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hiki ni cheo cha kawaida cha kinabii, nacho kimehifadhiwa kwa namna rasmi na ya kawaida katika Kiswahili cha Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina badala ya kubadilishwa kuwa cheo; ‘Yahwe’ ni umbo la kawaida la Kiswahili.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: angefanya madirisha mbinguni
  rationale: Tafsiri hii huhifadhi picha halisi ya ‘madirisha’ au ‘matundu’ ya mbinguni na hali ya sharti katika kauli ya afisa.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: je, jambo kama hili lingeweza kutokea?
  rationale: Swali hili la balagha linaonyesha mashaka ya afisa kuhusu kutimia kwa unabii, huku likihifadhi hali ya uwezekano.
- source_word: הִנְּךָ
  choice: Tazama
  rationale: ‘Tazama’ huvuta fikira kwa uzito unaofaa bila kuwa neno geni katika mtindo wa Kiswahili cha Biblia.
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: utaliona kwa macho yako mwenyewe
  rationale: Kauli ya wakati uliopo katika Kiebrania ina maana ya kutabiri katika muktadha huu; ‘mwenyewe’ huhifadhi mkazo wa kuona binafsi.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: lakini hutakula chochote katika hayo
  rationale: Kiebrania halisi ni ‘hutakula kutoka huko.’ Tafsiri hii huonyesha kwa kawaida kuwa hatafaidika kwa kula sehemu yoyote ya chakula kilichoahidiwa, bila kuacha rejeo lisilo wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni, jina la agano. ‘Yahwe’ huhifadhi jina hilo na ni tahajia inayofaa Kiswahili.
- issue: Mashaka ya afisa kuhusu uwezo wa Yahwe
  choice: 'Kauli imehifadhiwa kama sharti la mashaka: ‘Hata kama Yahwe angefanya...’'
  alternative: ‘Kama Yahwe angefanya...’
  rationale: וְהִנֵּה katika muktadha huu huanzisha hali iliyotiwa chumvi kwa mashaka. ‘Hata kama’ huwasilisha vizuri dhihaka ya swali bila kudai kwamba jambo hilo haliwezekani kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa kinabii ‘mtu wa Mungu’ na picha ya ‘madirisha mbinguni’ zimehifadhiwa; tanbihi inaeleza maana mbadala ya picha hiyo.
