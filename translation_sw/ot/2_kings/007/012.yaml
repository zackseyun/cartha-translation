  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: sw
  text: Ndipo mfalme akainuka usiku, akawaambia watumishi wake, “Hebu niwaambie kile ambacho Waaramu[a] wametutendea. Wanajua kwamba tuna njaa, kwa hiyo wametoka kambini ili kujificha uwandani, wakisema, ‘Watakapotoka mjini, tutawakamata wakiwa hai, na tutaingia mjini.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Aramu.” Jina la nchi au taifa limetumiwa hapa kumaanisha watu au jeshi la Aramu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaamka
  rationale: Katika muktadha wa usiku, kitenzi hiki kinaeleweka kwa kawaida kuwa mfalme aliamka au aliinuka kutoka mapumzikoni; “akaamka” ni Kiswahili cha sasa na cha asili.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno hili linaweza kumaanisha watumishi, wahudumu, au maafisa wa mfalme; “watumishi wake” linabaki pana bila kuongeza cheo kisichotajwa.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: Hebu niwaambie
  rationale: Muundo wa Kiebrania unaonyesha pendekezo au ombi lenye msisitizo; “Hebu niwaambie” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֲרָם
  choice: Waaramu
  rationale: Jina la nchi au taifa limetumiwa kwa watu au jeshi lake. “Waaramu” linafanya rejeleo la watu liwe wazi na pia linaunganika kiasili na viwakilishi vya wingi vinavyofuata.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: Wanajua kwamba tuna njaa
  rationale: Kauli ya mfalme inaeleza maarifa ambayo anadhani adui anayo wakati huo; wakati uliopo ni wa asili katika Kiswahili.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: wametoka kambini
  rationale: Wakati timilifu unaonyesha kitendo cha karibuni ambacho matokeo yake yana umuhimu kwa hali ya sasa.
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: ili kujificha uwandani
  rationale: “Kujificha” huhifadhi maana ya kujisitiri wenyewe, na “uwandani” huonyesha eneo la wazi nje ya mji bila kudokeza lazima mashamba yaliyolimwa.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: Watakapotoka mjini
  rationale: Katika mpango unaodhaniwa wa kuvizia, kishazi hiki kinaonyesha wakati unaotarajiwa wa watu kutoka mjini.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: tutawakamata wakiwa hai
  rationale: Tafsiri hii huhifadhi kitendo cha kuwakamata pamoja na hali yao ya kuwa hai.
- source_word: וְאֶל הָעִיר נָבֹא
  choice: kisha tutaingia mjini
  rationale: “Kisha” huonyesha hatua inayofuata katika mpango wa adui, huku “tutaingia mjini” ikitoa kwa kawaida mwendo unaoelekezwa ndani ya mji.
