translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa urahisi. “Hebu niwaambie” ni ya asili kuliko tafsiri neno kwa neno ya chembe ya ombi, na “uwandani” huepuka picha finyu ya shamba lililolimwa.
