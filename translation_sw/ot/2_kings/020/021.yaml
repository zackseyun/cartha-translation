lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Kitenzi שׁכב humaanisha kulala au kujilaza, na katika taarifa za kifalme pamoja na ‘baba zake’ ni nahau ya kifo. ‘Akalala’ huhifadhi taswira ya Kiebrania bila kuifafanua moja kwa moja kuwa ‘akafa.’
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Huu ni usemi wa kawaida wa Kiebrania kuhusu kifo na kuungana na waliotangulia. ‘Baba zake’ hufuata maana ya אבותיו, huku tanbihi ikieleza matumizi yake ya kinahau.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika taarifa za urithi wa kifalme, מלך hapa huonyesha kuingia madarakani; ‘akawa mfalme’ huwasilisha tukio la kurithi ufalme kuliko muda wa kutawala.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Hutafsiri wazi uhusiano wa kifamilia uliotajwa katika chanzo.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa urithi wa ufalme, תחתיו humaanisha kuchukua nafasi yake; ‘mahali pake’ ni Kiswahili cha kawaida na huhifadhi wazo hilo.
