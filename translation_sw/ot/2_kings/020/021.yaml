  text: Hezekia akalala na baba zake[a], naye Manase, mwanawe, akawa mfalme mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafa.” Kiebrania hutumia usemi huu wa kawaida wa kifalme kuhusu kifo.
