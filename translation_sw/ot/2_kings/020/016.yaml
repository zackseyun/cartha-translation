translation:
  language: sw
  text: Ndipo Isaya akamwambia Hezekia, “Sikia neno la Yahwe[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutolewa kama “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa waw-consecutive unaendeleza simulizi kwa tukio linalofuata; “Ndipo” na kitenzi “akamwambia” ni Kiswahili cha asili kinachohifadhi mfuatano huo.
- source_word: יְשַׁעְיָהוּ
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אֶל חִזְקִיָּהוּ
  choice: akamwambia Hezekia
  rationale: Kihusishi אֶל kinaonyesha anayeambiwa; Kiswahili huwasilisha maana hiyo kwa kiambishi cha mtendewa -mw- katika “akamwambia.” “Hezekia” ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: שְׁמַע
  choice: Sikia
  rationale: Amri hii ya umoja inahifadhi mwito mfupi na wenye uzito wa kinabii. “Sikiliza” lingewezekana, lakini “Sikia” linafuata kwa karibu maana na mtindo wa נוסח ya Kiebrania.
- source_word: דְּבַר
  choice: neno
  rationale: Katika kauli ya kinabii, דָּבָר ni ujumbe ulionenwa na Mungu. “Neno” huhifadhi nahau ya kibiblia na uzito wake, bila kuzuia maana ya “ujumbe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni uwasilishaji wa kawaida wa Kiswahili wa jina la Mungu lililoandikwa YHWH, badala ya kulibadilisha kwa cheo “BWANA.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu YHWH moja kwa moja. “Yahwe” huhifadhi jina binafsi katika umbo linalofaa Kiswahili; tanbihi inataja desturi ya kulitafsiri kwa cheo “BWANA.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi inahifadhi uzito wa mwito wa kinabii. Alama ya tanbihi imewekwa baada ya “Yahwe,” kwa kuwa tanbihi inahusu jina la Mungu.
