  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipengele vya Kiebrania: mwito wa kinabii (הִנֵּה), tangazo la siku zijazo, jumla ya yaliyomo nyumbani na yaliyohifadhiwa na baba/watangulizi, kauli tendwa ya kupelekwa Babeli, na hitimisho kamili kwamba hakuna chochote kitakachosalia. “Kitachukuliwa kwenda Babeli” huhifadhi kauli tendwa na mwelekeo wa -ה katika בבלה bila kutaja mtekaji ambaye chanzo hakimtaji.'
