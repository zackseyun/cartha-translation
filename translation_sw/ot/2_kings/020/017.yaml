  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: sw
  text: Tazama, siku zinakuja ambapo kila kitu kilicho katika nyumba yako, pamoja na kile ambacho mababu zako wameweka akiba mpaka leo, kitachukuliwa kwenda Babeli. Hakuna kitu kitakachobaki, asema BWANA.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki kinavuta fikira kwa tangazo zito la kinabii; “Tazama” ni la hadhi na linaeleweka katika Kiswahili cha Biblia.
- source_word: וְנִשָּׂא
  choice: kitachukuliwa kwenda
  rationale: Kauli tendwa ya kitenzi נשׂא hapa inaeleza kuondolewa na kupelekwa uhamishoni; muundo huu ni wa kawaida na unaonyesha wazi mwelekeo unaofuata.
- source_word: בְּבֵיתֶךָ
  choice: katika nyumba yako
  rationale: “Nyumba” huhifadhi upana wa בַּיִת, unaoweza kumaanisha jumba au kaya na mali zake, bila kuufinya kuwa ghala pekee.
- source_word: אָצְרוּ
  choice: wameweka akiba
  rationale: Kitenzi אָצַר humaanisha kukusanya na kuhifadhi hazina au mali; “kuweka akiba” ni usemi wa sasa unaobaki mpana.
- source_word: אֲבֹתֶיךָ
  choice: mababu zako
  rationale: Katika muktadha huu neno linarejelea watangulizi wa kifalme wa Hezekia, si baba yake mmoja tu; “mababu” linaonyesha vizazi vilivyotangulia.
- source_word: בָּבֶלָה
  choice: kwenda Babeli
  rationale: He ya mwelekeo inaonyesha mwendo kuelekea Babeli; “kwenda” huiweka wazi kwa Kiswahili cha asili.
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: Hakuna kitu kitakachobaki
  rationale: דָּבָר hapa ni kitu chochote katika jumla ya mali iliyotajwa; tafsiri hii huhifadhi ukamilifu wa hukumu.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi pana ya Kiswahili ya kuwakilisha jina la agano YHWH kwa herufi kubwa, huku likitofautishwa na cheo cha kawaida “Bwana”.
theological_decisions:
- issue: Upeo wa mali itakayochukuliwa
  choice: kila kitu kilicho katika nyumba yako, pamoja na kile ambacho mababu zako wameweka akiba
  alternative: hazina zote za jumba lako na za mababu zako
  rationale: Tafsiri iliyochaguliwa hudumisha usemi mpana wa Kiebrania na haubadili “nyumba” kuwa “hazina” bila ulazima.
- issue: Nguvu ya tangazo la kinabii
  choice: siku zinakuja ambapo ... kitachukuliwa
  alternative: wakati utafika ... vitachukuliwa
  rationale: Muundo wa karibu na chanzo huhifadhi namna ya kawaida ya tangazo la hukumu ya baadaye bila kuongeza wakati maalumu au mhusika anayechukua mali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida huku ikihifadhi sauti nzito ya tangazo la kinabii na kauli tendwa ya chanzo.
