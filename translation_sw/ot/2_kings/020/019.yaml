  to: Ndipo Hezekia akamwambia Isaya, “Neno la Yahweh ulilolinena ni jema.” Naye akasema, “Je, si hivyo, ikiwa kutakuwa na amani na uthabiti[a] katika siku zangu?”
  rationale: Marekebisho yanarejesha kiunganishi cha simulizi cha וַיֹּאמֶר kama “Naye akasema,” badala ya kuongeza sababu kwa “Kwa maana,” na yanalinganisha uandishi wa jina la Mungu na sera ya mradi. Swali la balagha lenye “ikiwa” linahifadhi ule muundo wa Kiebrania ulioachwa wazi; tanbihi inaweka wazi tafsiri mbadala bila kuamua kwa lazima kwamba usemi huo ulikuwa wazo la moyoni au kwamba “uthabiti” ndio maana pekee ya אֱמֶת.
