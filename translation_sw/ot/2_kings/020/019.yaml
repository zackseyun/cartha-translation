base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: sw
  text: Ndipo Hezekia akamwambia Isaya, “Neno la Yahweh ulilolinena ni jema.” Naye akasema, “Je, si hivyo, ikiwa kutakuwa na amani na uthabiti[a] katika siku zangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amani na kweli katika siku zangu.” Neno la Kiebrania אֱמֶת linaweza kumaanisha “kweli,” “uaminifu,” au, katika muktadha huu, uthabiti unaotegemeka. Kauli ya mwisho ya Kiebrania ina muundo wa swali ulioachwa wazi; inaweza pia kutafsiriwa, “Je, si vema ikiwa kutakuwa na amani na kweli katika siku zangu?”
    reason: Huhifadhi maana mbalimbali za אֱמֶת na utata wa kisintaksia wa kauli ya mwisho ya Kiebrania bila kuufafanua kupita kiasi.
lexical_decisions:
- source_word: טוֹב
  choice: jema
  rationale: Hutoa maana ya moja kwa moja ya tathmini hiyo bila kudokeza kwamba unabii ulikuwa wa kumpendelea Hezekia.
- source_word: דְּבַר יְהוָה
  choice: Neno la Yahwe
  rationale: Hudumisha istilahi ya kawaida ya ujumbe wa kinabii na kulitaja jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: דִּבַּרְתָּ
  choice: ulilosema
  rationale: Ni usemi wa kawaida wa Kiswahili unaoelekeza maneno hayo kwa Isaya kama mnenaji wa ujumbe wa kinabii.
- source_word: הֲלוֹא אִם
  choice: Je, hakutakuwa na
  rationale: Huwasilisha nguvu ya swali la balagha kwa Kiswahili cha kawaida, huku ukikamilisha kwa kiasi kidogo tu muundo wa Kiebrania ulioachwa wazi.
- source_word: שָׁלוֹם
  choice: amani
  rationale: Ni tafsiri pana na ya kawaida inayoweza kujumuisha utulivu wa jamii pamoja na hali njema.
- source_word: אֱמֶת
  choice: uthabiti
  rationale: Katika muktadha huu wa ufalme na usalama wa taifa, neno hilo linaweza kumaanisha hali ya kudumu na kutegemeka; maana mbadala zimehifadhiwa katika tanbihi.
- source_word: בְיָמָי
  choice: katika siku zangu
  rationale: Hudumisha nahau ya chanzo na mkazo wa Hezekia juu ya kipindi chake mwenyewe.
theological_decisions:
- issue: Kauli ya mwisho ya Hezekia ina muundo wa Kiebrania ulioachwa wazi na inaweza kueleweka kama swali kamili au kama ‘Je, si vema ikiwa…?’
  choice: Kwa maana alisema, “Je, hakutakuwa na amani na uthabiti katika siku zangu?”
  alternative: Akasema, “Je, si vema ikiwa kutakuwa na amani na kweli katika siku zangu?”
  rationale: Tafsiri kuu inatoa mtiririko wa kawaida wa Kiswahili na kudumisha kauli hiyo kama maneno yaliyosemwa, kwa kufuata וַיֹּאמֶר. Tanbihi huhifadhi uwezekano wa muundo mwingine bila kuondoa mvutano kuhusu jibu la Hezekia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Katika siku zangu” imehifadhiwa kwa ladha ya kibiblia bila kuwa ngumu, na “Kwa maana alisema” huepuka kugeuza waziwazi usemi wa Kiebrania kuwa wazo la moyoni.
