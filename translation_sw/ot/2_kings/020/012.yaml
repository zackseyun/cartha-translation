reference: 2 Kings 20:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֡יא שָׁלַ֡ח בְּרֹאדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ כִּ֣י שָׁמַ֔ע כִּ֥י חָלָ֖ה חִזְקִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: sw
  text: Wakati huo, Berodaki-Baladani mwana wa Baladani, mfalme wa Babeli, alimtumia Hezekia barua na zawadi, kwa sababu alikuwa amesikia kwamba Hezekia alikuwa mgonjwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Isaya 39:1 jina hili linaonekana kwa umbo “Merodaki-Baladani”; hapa maandishi ya Kiebrania yanasomeka “Berodaki-Baladani.”
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni kiashiria cha kawaida cha wakati katika simulizi na ni Kiswahili cha sasa, cha kawaida na cha heshima.
- source_word: שָׁלַח
  choice: alimtumia
  rationale: Kitenzi hiki kinawasilisha tendo la kupeleka vitu kwa mpokeaji aliyetajwa; muundo wenye kiambishi cha mtendewa ni wa asili katika Kiswahili.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: Berodaki-Baladani
  rationale: Unukuzi huu unafuata moja kwa moja umbo la jina katika maandishi ya Kiebrania ya WLC; tofauti inayopatikana katika Isaya 39:1 imehifadhiwa katika tanbihi.
- source_word: בֶּן בַּלְאֲדָן
  choice: mwana wa Baladani
  rationale: Huu ni ujenzi wa kawaida wa nasaba; “mwana wa” hudumisha uhusiano uliotajwa na chanzo.
- source_word: מֶלֶךְ בָּבֶל
  choice: mfalme wa Babeli
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya cheo na eneo la utawala.
- source_word: סְפָרִים
  choice: barua
  rationale: Katika muktadha wa mawasiliano ya kidiplomasia, neno hili linaeleweka kwa kufaa kuwa barua, si vitabu kwa ujumla.
- source_word: וּמִנְחָה
  choice: na zawadi
  rationale: Katika muktadha huu מִנְחָה ni kitu kilichopelekwa pamoja na barua; “zawadi” ni wazi bila kulazimisha maana ya kodi au sadaka.
- source_word: כִּי שָׁמַע
  choice: kwa sababu alikuwa amesikia
  rationale: כִּי ya kwanza inaeleza sababu, na hali timilifu inaonyesha kwamba kusikia kulitangulia kutuma.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: kwamba Hezekia alikuwa mgonjwa
  rationale: כִּי ya pili inaanzisha yaliyosikiwa. Tafsiri hii inahifadhi taarifa ya ugonjwa bila kuongeza wazi kwamba alikuwa tayari amepona.
theological_decisions: []
