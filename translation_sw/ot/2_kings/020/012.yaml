  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Majina yamenukuliwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku umbo la WLC likipewa kipaumbele katika matini kuu.
