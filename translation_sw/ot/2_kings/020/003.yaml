base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: sw
  text: “Ee Yahwe, nakusihi, ukumbuke jinsi nilivyoenenda mbele zako kwa uaminifu[a] na kwa moyo wote[b], na jinsi nilivyofanya yaliyo mema machoni pako.” Kisha Hezekia akalia sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kweli.” Neno la Kiebrania linaweza kumaanisha ukweli au uaminifu; hapa linaelekea kueleza uaminifu wa mwenendo wa Hezekia mbele za Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa moyo usiogawanyika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: Ee ... tafadhali
  rationale: Viambishi hivi vinaonyesha ombi la dhati; “Ee” linafaa katika kumwita Mungu, na “tafadhali” linabeba nguvu ya kusihi bila kurudia ombi kwa namna nzito.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo.
- source_word: זְכָר
  choice: kumbuka
  rationale: Amri ya moja kwa moja katika ombi, yenye maana ya kukumbuka au kuweka akilini.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: nilivyoenenda mbele zako
  rationale: Inahifadhi sitiari ya Kiebrania kuhusu mwenendo wa maisha katika uwepo wa Mungu, huku ikibaki wazi katika Kiswahili cha kibiblia kinachoeleweka.
- source_word: בֶּאֱמֶת
  choice: kwa uaminifu
  rationale: Katika muktadha huu neno linaeleza uaminifu na unyoofu wa mwenendo, ingawa linaweza pia kumaanisha ukweli.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: kwa moyo mkamilifu
  rationale: “Mkamilifu” hapa hubeba wazo la moyo kamili, usiogawanyika katika uaminifu, si lazima kutokuwa na dhambi kabisa.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: niliyofanya yaliyo mema machoni pako
  rationale: Inahifadhi tamathali ya Kiebrania inayoweka tathmini ya Mungu kuwa kipimo cha mema.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: akalia sana
  rationale: Muundo wa jina na kitenzi wenye mzizi unaohusiana unasisitiza ukubwa wa kulia; “sana” ni wa asili na hauongezi wazo la uchungu lisilotajwa wazi.
- source_word: חִזְקִיָּהוּ
  choice: Hezekia
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maombi yanaelekezwa kwa jina binafsi la Mungu wa agano; kulihifadhi kama jina hakulibadilishi kuwa cheo.
- issue: Maana ya שָׁלֵם katika maelezo ya Hezekia kuhusu moyo wake
  choice: kwa moyo mkamilifu
  alternative: kwa moyo usiogawanyika
  rationale: Tafsiri kuu inahifadhi wazo la ukamilifu au utimilifu wa moyo, huku tanbihi ikifafanua kwamba jambo linalosisitizwa ni uaminifu usiogawanyika, si dai la kutokuwa na dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifungu cha maombi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari za “kuenenda mbele” na “machoni pako” zimehifadhiwa kwa sababu ni wazi na zina uzito wa matini asilia.
