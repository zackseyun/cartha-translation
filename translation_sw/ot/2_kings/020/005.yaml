  to: '“Rudi ukamwambie Hezekia, kiongozi wa watu wangu, ‘Yahweh, Mungu wa Daudi, baba yako, asema hivi: Nimeisikia sala yako na kuyaona machozi yako. Tazama, ninakuponya.[a] Siku ya tatu utapanda hadi nyumba ya Yahweh.’”'
