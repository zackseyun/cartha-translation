source:
  edition: WLC
  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: sw
  text: '“Rudi ukamwambie Hezekia, kiongozi wa watu wangu, ‘Yahweh, Mungu wa Daudi, baba yako, asema hivi: Nimeisikia sala yako na kuyaona machozi yako. Tazama, ninakuponya.[a] Siku ya tatu utapanda hadi nyumba ya Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakuponya.” Kiebrania kinasema kwa maana ya karibu zaidi, “Tazama, ninakuponya,” kikitumia umbo la participle ambalo linaweza kuonyesha tendo lililo karibu kutokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב וְאָמַרְתָּ
  choice: Rudi ukamwambie
  rationale: Imperative and sequential verb direct Isaiah to return and deliver the message; this is natural Swahili while preserving both actions.
- source_word: נְגִיד עַמִּי
  choice: kiongozi wa watu wangu
  rationale: Kiongozi clearly conveys an appointed leader without the potentially dynastic nuance of mkuu or mwana wa mfalme.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh ... asema hivi
  rationale: Preserves the prophetic messenger formula naturally in Swahili and renders the divine name directly.
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: Mungu wa Daudi baba yako
  rationale: Closely follows the Hebrew wording; baba can denote an ancestor, as in this dynastic context.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ רָאִיתִי אֶת דִּמְעָתֶךָ
  choice: Nimeisikia sala yako na kuyaona machozi yako
  rationale: Swahili perfect forms convey completed acts whose significance continues in the present divine response.
- source_word: הִנְנִי רֹפֶא לָךְ
  choice: Tazama, ninakuponya
  rationale: Tazama marks the emphatic deictic הִנְנִי, while the present form reflects the Hebrew participle and its imminent-action force.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Siku ya tatu
  rationale: Direct and idiomatic rendering of the temporal phrase without adding 'from now.'
- source_word: תַּעֲלֶה בֵּית יְהוָה
  choice: utapanda kwenda katika nyumba ya Yahweh
  rationale: Retains the upward movement expressed by עלה and the literal 'house of Yahweh'; kwenda makes the destination relation clear in natural Swahili.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: The Hebrew directly uses the covenant name; Yahweh transliterates it rather than replacing it with a title.
- issue: Aspect of רֹפֶא in the divine promise
  choice: ninakuponya
  alternative: nitakuponya
  rationale: The participle with הִנְנִי portrays the healing as present or imminent. The future sense is contextually possible and is retained in a footnote rather than silently selected.
- issue: Meaning of אָבִיךָ for Hezekiah's relation to David
  choice: baba yako
  alternative: babu yako / babu yako wa zamani
  rationale: The literal kinship term preserves the biblical dynastic idiom, in which 'father' can mean an ancestor, without explanatory expansion in the text.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na mdundo wa ujumbe wa kinabii. Muundo “asema hivi” ni rasmi lakini unaeleweka, na “nyumba ya Yahweh” huhifadhi taswira ya Kiebrania badala ya kuifasiri moja kwa moja kuwa hekalu.
