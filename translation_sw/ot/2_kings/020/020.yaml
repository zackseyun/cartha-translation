base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Hezekia, uweza wake wote, na jinsi alivyotengeneza bwawa[a] na mfereji[b], na alivyoleta maji mjini[c]—je, mambo hayo hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hifadhi ya maji”; neno la Kiebrania linaweza kumaanisha beseni kubwa la maji lililojengwa.
    reason: lexical_alternative
  - marker: b
    text: Au “njia ya maji”; neno la Kiebrania hurejelea njia au mfereji uliotengenezwa wa kupitishia maji.
    reason: lexical_alternative
  - marker: c
    text: Huenda hii inarejelea miradi maarufu ya Hezekia ya kuingiza maji Yerusalemu; linganisha 2 Mambo ya Nyakati 32:30.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Huu ni mtindo wa kawaida wa kihistoria katika Wafalme unaorejelea matendo na mambo mengine ya utawala; “matendo mengine” ni Kiswahili cha kawaida na chenye kueleweka.
- source_word: גְּבוּרָתוֹ
  choice: uweza wake wote
  rationale: Neno linaweza kumaanisha nguvu, ushujaa, au mafanikio makuu. “Uweza wake wote” huhifadhi maana pana bila kuufanya muktadha huu wa miradi ya maji kuwa wa kijeshi tu.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: na jinsi alivyotengeneza
  rationale: Kirai hiki kinaanzisha mfano maalumu wa mafanikio ya Hezekia; “jinsi alivyotengeneza” huunganisha kwa asili na miradi inayotajwa.
- source_word: הַבְּרֵכָה
  choice: bwawa
  rationale: Neno la Kiebrania humaanisha bwawa au hifadhi ya maji iliyojengwa. “Bwawa” ni neno la kawaida la Kiswahili, huku maana mbadala ikielezwa katika tanbihi.
- source_word: הַתְּעָלָה
  choice: mfereji
  rationale: Neno hili hurejelea njia au mfereji wa kupitishia maji; “mfereji” ni sahihi na linaeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: na kuyaleta maji mjini
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kuingizwa kwa maji ndani ya mji; “mjini” huwasilisha mwelekeo huo kwa Kiswahili cha kawaida.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, mambo hayo hayakuandikwa
  rationale: Utoaji huu huhifadhi swali la balagha la Kiebrania na kutumia “mambo hayo” kurejelea kwa uwazi matendo yote yaliyotangulia.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda
  rationale: Hiki ni kichwa cha kumbukumbu rasmi za kifalme. Herufi kubwa zinaonyesha kuwa ni jina la chanzo kinachotajwa.
theological_decisions:
- issue: Utambulisho wa “Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda”
  choice: Kukitafsiri kama jina la chanzo cha kumbukumbu za kifalme bila kukitambulisha zaidi
  alternative: Kukitambulisha moja kwa moja na kitabu cha Biblia cha Mambo ya Nyakati
  rationale: Kiebrania kinataja chanzo cha kumbukumbu za wafalme wa Yuda lakini hakisemi kwamba ni kitabu cha kikanoni kinachoitwa Mambo ya Nyakati; tafsiri haipaswi kuamua utambulisho huo kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa, na istilahi za uhandisi zimewekwa kwa maneno ya kawaida pamoja na tanbihi za mbadala.
