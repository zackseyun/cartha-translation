base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: sw
  text: Naye Hezekia akamwambia Isaya, “Ni ishara gani kwamba Yahweh ataniponya, na kwamba siku ya tatu nitapanda hadi nyumba ya Yahweh[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Yahweh.” Kihalisi, “nyumba ya Yahweh.”
    reason: Mbadala wa kileksika unaofafanua maana ya kimuktadha huku tafsiri kuu ikihifadhi usemi halisi wa Kiebrania.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye ... akamwambia
  rationale: Muundo huu unaendeleza mtiririko wa simulizi ya Kiebrania huku ukitumia Kiswahili cha kawaida kwa tendo lililofuatana.
- source_word: חִזְקִיָּהוּ
  choice: Hezekia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: יְשַׁעְיָהוּ
  choice: Isaya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: מָה אוֹת
  choice: Ni ishara gani
  rationale: אוֹת hapa ni ishara inayothibitisha ahadi ya Mungu; tafsiri hii ni ya kawaida na haibani maana kuwa uthibitisho wa kiakili tu.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaingiza yaliyomo katika ishara inayoombwa, yaani kuponywa na kwenda katika nyumba ya Yahweh.
- source_word: יִרְפָּא ... לִי
  choice: ataniponya
  rationale: Kauli ya wakati ujao pamoja na kiwakilishi cha nafsi imewasilishwa kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limeendelezwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְעָלִיתִי
  choice: na kwamba ... nitapanda kwenda
  rationale: עלה ina maana ya kupanda au kwenda juu, na hapa inaeleza kwenda kwenye nyumba ya Yahweh; kurudia ‘kwamba’ kunadhihirisha kuwa hili pia ni jambo litakalothibitishwa na ishara.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha wakati uliotajwa bila kuongeza maelezo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Tafsiri hii inahifadhi taswira halisi ya ‘nyumba’ huku tanbihi ikitoa maana ya kimuktadha, ‘hekalu.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi uhusiano wa sentensi mbili zinazoeleza ishara na pia wazo la kupanda kwenda hekaluni.
