  text: וַ/יָּבֹא֙ יְשַֽׁעְיָ֣הוּ הַ/נָּבִ֔יא אֶל הַ/מֶּ֖לֶךְ חִזְקִיָּ֑הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו מָ֥ה אָמְר֣וּ הָ/אֲנָשִׁ֣ים הָ/אֵ֗לֶּה וּ/מֵ/אַ֨יִן֙ יָבֹ֣אוּ אֵלֶ֔י/ךָ וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ מֵ/אֶ֧רֶץ רְחוֹקָ֛ה בָּ֖אוּ מִ/בָּבֶֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: sw
  text: Ndipo nabii Isaya akamwendea Mfalme Hezekia, akamwambia, “Watu hawa walisema nini, nao walikuja kwako kutoka wapi[a]?” Hezekia akajibu, “Walikuja kutoka nchi ya mbali[b], kutoka Babeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kufuata umbo la kitenzi cha Kiebrania kwa karibu zaidi, maneno haya yanaweza kutafsiriwa, “na wanakuja kwako kutoka wapi?” Hata hivyo, wakati uliopita unafaa muktadha wa simulizi.
    reason: lexical_alternative
  - marker: b
    text: Hezekia anasema kwanza kwamba walitoka “nchi ya mbali,” kisha anaitaja nchi hiyo kuwa Babeli. Mpangilio huu unahifadhi msisitizo wake juu ya umbali wa walikotoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ndipo ... akamwendea
  rationale: Kiunganishi cha simulizi kinaendeleza mfuatano wa matukio; “ndipo” na “akamwendea” ni Kiswahili cha kawaida kinachoonyesha kwamba Isaya alifika kwa mfalme.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: nabii Isaya
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi cheo cha Isaya pamoja na jina lake.
- source_word: אֶל הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: kwa Mfalme Hezekia
  rationale: Hutambulisha hadhi na jina la mfalme kwa mtindo wa kawaida wa Kiswahili.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: akamwuliza
  rationale: Ingawa kitenzi chenyewe ni “akamwambia,” maneno yanayofuata ni maswali; “akamwuliza” hutoa kazi yake katika muktadha kwa Kiswahili cha asili.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: Watu hawa walisema nini
  rationale: “Watu hawa” ni tafsiri ya kawaida ya אֲנָשִׁים katika rejeo la kikundi hiki, na wakati uliopita unafaa muktadha wa simulizi.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: nao walikuja kwako kutoka wapi
  rationale: Huhifadhi wazo la kuja kwa Hezekia na kutoa swali kwa mpangilio wa asili wa Kiswahili; wakati uliopita unaendana na tukio lililokwisha kutokea.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: kutoka nchi ya mbali
  rationale: Ni usemi wa kawaida unaohifadhi msisitizo wa umbali wa mahali walikotoka.
- source_word: בָּאוּ מִבָּבֶל
  choice: Walikuja ... kutoka Babeli
  rationale: Jibu la Kiebrania hutaja kwanza kwa ujumla nchi ya mbali, kisha hufafanua kuwa ni Babeli; mpangilio huo umehifadhiwa.
- source_word: בָּבֶל
  choice: Babeli
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapo katika Kiswahili cha Biblia.
