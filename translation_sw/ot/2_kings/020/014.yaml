translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Majina “Isaya,” “Hezekia,” na “Babeli” yanafuata matumizi ya kawaida ya Kiswahili. Tafsiri haijaongeza “kwangu” katika jibu la Hezekia kwa kuwa haimo wazi katika kishazi hicho cha Kiebrania.
