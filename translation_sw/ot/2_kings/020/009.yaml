base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: sw
  text: 'Isaya akasema, “Hii ndiyo ishara kwako kutoka kwa Yahwe kwamba Yahwe atatimiza jambo alilolisema: Je, kivuli kiende mbele hatua kumi[a], au kirudi nyuma hatua kumi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “digrii kumi.” Neno la Kiebrania humaanisha kihalisi “hatua” au “vipandio,” lakini katika muktadha huu kwa desturi limetafsiriwa “digrii” kwa sababu ya mwendo wa kivuli kwenye kifaa kinachohusishwa na Ahazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: ishara
  rationale: Neno אוֹת hapa ni ishara ya kuthibitisha ahadi ya Mungu; ‘ishara’ ni la kawaida na linaloeleweka katika Kiswahili.
- source_word: מֵאֵת יְהוָה
  choice: kutoka kwa Yahwe
  rationale: Kirai hiki kinaonyesha chanzo cha ishara, huku jina la agano יְהוָה likitoholewa kuwa ‘Yahwe’.
- source_word: כִּי
  choice: kwamba
  rationale: 'כִּי hapa linaanzisha maudhui yanayothibitishwa na ishara: Yahwe atatekeleza alilosema.'
- source_word: יַעֲשֶׂה ... אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: atatimiza jambo alilolisema
  rationale: ‘Atatimiza’ huwasilisha kwa Kiswahili cha asili wazo la kutenda au kutekeleza jambo lililonenwa, bila kupoteza uhusiano kati ya ahadi na utimilifu wake.
- source_word: הָלַךְ הַצֵּל
  choice: kivuli kiende mbele
  rationale: Ingawa kitenzi cha Kiebrania kina umbo la hali timilifu, katika swali hili kinaweka chaguo la mwendo wa kivuli; hali tegemezi ya Kiswahili inafaa katika muktadha huo.
- source_word: מַעֲלוֹת
  choice: hatua
  rationale: מַעֲלוֹת kwa msingi humaanisha hatua au vipandio. ‘Hatua’ huhifadhi picha hiyo bila kuamua kwa uhakika muundo wa kifaa cha Ahazi.
- source_word: אִם
  choice: au
  rationale: Katika swali lenye machaguo mawili, אִם linaanzisha chaguo la pili na kwa kawaida hutafsiriwa ‘au’ katika Kiswahili.
- source_word: יָשׁוּב
  choice: kirudi nyuma
  rationale: שׁוּב humaanisha kurudi; ‘kirudi nyuma’ linaonyesha wazi kugeuka kwa mwelekeo wa kivuli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה. ‘Yahwe’ hulihifadhi kama jina maalumu bila kulibadilisha kuwa cheo.
- issue: Uhakika wa aina ya ishara
  choice: hatua
  alternative: nyuzi; vipandio vya ngazi
  rationale: Maandishi hayafafanui kikamilifu kifaa au muundo ambao kivuli kilisogea juu yake. Tafsiri ‘hatua’ huhifadhi maana ya msingi na kutofafanua zaidi ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa swali umehifadhi machaguo mawili ya Kiebrania, na istilahi ‘hatua’ imechaguliwa ili kuhifadhi utata halisi kuhusu kifaa kinachorejelewa.
