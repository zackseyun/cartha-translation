  text: וַ/יֹּ֣אמֶר יְשַֽׁעְיָ֔הוּ קְח֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וַ/יִּקְח֛וּ וַ/יָּשִׂ֥ימוּ עַֽל הַ/שְּׁחִ֖ין וַ/יֶּֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: sw
  text: Isaya akasema, “Chukueni donge la tini zilizoshindiliwa[a].” Basi wakalichukua na kuliweka juu ya jipu[b], naye akapona[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate wa tini,” yaani tini zilizoshindiliwa kuwa donge.
    reason: lexical_alternative
  - marker: b
    text: Au “kidonda kilichovimba” au “donda.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “akaishi”; katika muktadha huu maana yake ni kwamba alipona.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Waw-consecutive inaendeleza simulizi; “akasema” ni mtiririko wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: יְשַׁעְיָהוּ
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Kiswahili.
- source_word: קְחוּ
  choice: Chukueni
  rationale: Ni amri ya wingi kutoka לקח. “Chukueni” huhifadhi idadi ya kisarufi bila kuongeza dhana ya kuleta au kwenda kuchukua.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: donge la tini zilizoshindiliwa
  rationale: דְּבֶלֶת ni donge lililotengenezwa kwa matunda yaliyobanwa au kushindiliwa, na תְּאֵנִים hutaja tini. Tafsiri hii ni wazi na haidokezi kimakosa kwamba ni mkate uliookwa.
- source_word: וַיִּקְחוּ
  choice: Basi wakalichukua
  rationale: Kitenzi ni cha wingi, na kiambishi “-li-” kinarejelea donge lililotajwa. “Basi” huonyesha utekelezaji wa amri katika mwendelezo wa simulizi.
- source_word: וַיָּשִׂימוּ עַל
  choice: na kuliweka juu ya
  rationale: שׂים ni kuweka au kutia, na עַל ni “juu ya.” Usemi huu wa kawaida unafaa kwa kuweka donge kwenye kidonda.
- source_word: הַשְּׁחִין
  choice: jipu
  rationale: שְׁחִין hurejelea jipu, kidonda kilichovimba, au donda la ngozi. “Jipu” ni neno fupi na la kawaida linalofaa katika muktadha huu.
- source_word: וַיֶּחִי
  choice: naye akapona
  rationale: Ingawa חיה kimsingi humaanisha kuishi, katika muktadha wa ugonjwa na tiba humaanisha kurudia afya. “Akapona” hutoa maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi zaidi.
theological_decisions:
- issue: Maana ya matokeo ya וַיֶּחִי
  choice: alipona ugonjwa
  alternative: aliishi; akapata uhai tena
  rationale: Muktadha wa kuwekwa donge la tini juu ya jipu unaonyesha kurudia afya. Tafsiri “akapona” haidai ufufuo wala kuingiza maelezo ya kimafundisho, na tanbihi inaonyesha maana halisi ya kitenzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja na inaendeleza mwendo wa simulizi. “Donge la tini zilizoshindiliwa” huepuka utata wa neno “mkate,” huku mbadala huo ukihifadhiwa katika tanbihi.
