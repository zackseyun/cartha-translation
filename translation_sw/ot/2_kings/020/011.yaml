base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: sw
  text: Ndipo nabii Isaya akamlilia Yahwe, naye akakirudisha kivuli kwa hatua kumi nyuma kwenye ngazi za Ahazi, ambako kilikuwa kimeshuka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamlilia
  rationale: Kitenzi קרא pamoja na אֶל־יְהוָה humaanisha kumlilia Mungu katika sala. ‘Akamlilia’ kinadumisha uzito na uhai wa tendo hilo bila kuongeza waziwazi neno ‘akasali.’
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: nabii Isaya
  rationale: Huu ndio mpangilio wa kawaida na wa asili katika Kiswahili kwa jina linalofuatana na cheo hiki.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa moja kwa moja kwa umbo linalofaa tahajia ya Kiswahili.
- source_word: וַיָּשֶׁב אֶת־הַצֵּל
  choice: akakirudisha kivuli nyuma
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi; ‘akakirudisha ... nyuma’ inaonyesha kwa kawaida kwamba Mungu alisababisha kivuli kibadili mwendo wake.
- source_word: בַּמַּעֲלוֹת ... עֶשֶׂר מַעֲלוֹת
  choice: hatua kumi ... kwenye ngazi
  rationale: מַעֲלוֹת humaanisha hatua au vipandio. ‘Hatua kumi’ huonyesha umbali wa kurudi kwa kivuli, na ‘ngazi za Ahazi’ huonyesha muundo kilimokuwa kimeshuka, bila kudai kwamba ulikuwa saa ya jua.
- source_word: אֲשֶׁר יָרְדָה
  choice: ambazo kilikuwa kimeshuka
  rationale: Kishazi hiki kinaeleza mwendo wa awali wa kivuli katika hatua hizo; wakati timilifu ‘kilikuwa kimeshuka’ unaweka wazi kwamba kushuka kulitangulia kurudishwa.
- source_word: אֲחֹרַנִּית
  choice: nyuma
  rationale: Kielezi hiki kinaonyesha mwendo wa kurudi kinyume na mwendo uliotangulia.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Asili ya מַעֲלוֹת אָחָז
  choice: ngazi za Ahazi
  alternative: saa ya jua ya Ahazi
  rationale: Kiebrania hutaja hatua au vipandio lakini hakisemi wazi kwamba kifaa hicho kilikuwa saa ya jua. Tafsiri kuu inadumisha kutokuwa na uhakika huko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa sentensi unadumisha mlolongo wa Kiebrania huku ukitumia ‘hatua’ na ‘ngazi’ kwa uwazi wa kawaida katika Kiswahili.
