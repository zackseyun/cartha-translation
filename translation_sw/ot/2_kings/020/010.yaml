  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: sw
  text: Hezekia akasema, “Ni rahisi kwa kivuli kusonga mbele hatua kumi[a]. Sivyo; kivuli kirudi nyuma hatua kumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “digrii kumi.” Neno la Kiebrania linaweza kumaanisha “hatua” au “vipandio,” na huenda likarejelea hatua au migawanyo ya kifaa cha Ahazi kinachotumia kivuli.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: Ni rahisi
  rationale: Huwasilisha maana ya urahisi au kutokuwa jambo gumu kwa Kiswahili cha kawaida.
- source_word: הַצֵּל / לַצֵּל
  choice: kivuli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno la Kiebrania צֵל katika muktadha huu.
- source_word: לִנְטוֹת
  choice: kusonga mbele
  rationale: Kitenzi kinaweza kumaanisha kunyoosha, kuelekeza, au kuenea. Katika muktadha wa mwendo wa kawaida wa kivuli, ‘kusonga mbele’ huonyesha mwelekeo bila kudai kwamba kivuli chenyewe kinarefuka.
- source_word: מַעֲלוֹת
  choice: hatua
  rationale: Neno la Kiebrania humaanisha hatua au sehemu za kupandia. ‘Hatua’ huhifadhi taswira halisi bila kuingiza moja kwa moja dhana ya nyuzi za kipimo.
- source_word: לֹא כִּי
  choice: La
  rationale: Hukataa chaguo la kwanza kwa ufupi na kuanzisha chaguo linalopendelewa kwa Kiswahili cha heshima na cha kawaida.
- source_word: יָשׁוּב
  choice: na kirudi
  rationale: 'Muundo huu wa Kiswahili unaonyesha ombi au pendekezo linalolingana na nguvu ya usemi wa Kiebrania: kivuli kirudi.'
- source_word: אֲחֹרַנִּית
  choice: nyuma
  rationale: Ni njia ya kawaida ya kueleza mwendo wa kurudi kinyume na mwelekeo wa awali.
