  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: sw
  text: Ndipo akageuza uso wake kuelekea ukutani, akasali kwa Yahweh[a], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: יהוה (YHWH), jina la Mungu.'
    reason: Kufafanua jina la Mungu lililo katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: Ndipo akageuza
  rationale: Kitenzi cha Hifili katika mfululizo wa masimulizi kinaonyesha tendo lililofuata na kukamilika; “Ndipo” na “akageuza” vinaendeleza mfululizo huo kwa Kiswahili cha kawaida.
- source_word: פָּנָיו
  choice: uso wake
  rationale: Neno פָּנִים hapa lina maana halisi ya uso na linahifadhi picha ya mtu kuuelekeza uso wake upande mwingine.
- source_word: אֶל הַקִּיר
  choice: kuelekea ukutani
  rationale: אֶל huonyesha mwelekeo na קִיר ni ukuta; usemi huu ni wa asili katika Kiswahili na unaweka wazi kwamba alielekeza uso wake upande wa ukuta.
- source_word: וַיִּתְפַּלֵּל
  choice: akamwomba
  rationale: Kitenzi פלל katika Hitpaeli hapa kinamaanisha kusali au kumwomba Mungu; “akamwomba” ni usemi wa kawaida, wenye heshima, unaofaa katika simulizi.
- source_word: אֶל יְהוָה
  choice: Yahwe
  rationale: Kihusishi אֶל kinamtambulisha anayeelekezewa sala, na יְהוָה ni jina la Mungu; kiambishi cha yambwa katika “akamwomba” kinawasilisha maana ya ‘kwa Yahwe’ kwa Kiswahili cha asili.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Muundo huu hutanguliza maneno yatakayofuata; “akisema” huhifadhi kazi yake ya kuanzisha sala ya mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku tanbihi ikifafanua msingi wake wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi vya “aka-” unaendeleza masimulizi kwa urahisi, na koma ya mwisho inaonyesha kuwa maneno ya sala yanafuata katika mstari unaofuata.
