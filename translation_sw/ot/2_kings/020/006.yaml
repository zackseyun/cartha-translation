base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: sw
  text: Nitaongeza miaka kumi na mitano ya kuishi kwako. Nitakuokoa wewe na mji huu kutoka mkononi mwa mfalme wa Ashuru[a], nami nitautetea mji huu[b] kwa ajili yangu na kwa ajili ya Daudi, mtumishi wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika mamlaka ya mfalme wa Ashuru”; kihalisi, “kutoka mkononi mwa mfalme wa Ashuru.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nitaulinda mji huu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: nitaongeza miaka kumi na mitano katika maisha yako
  rationale: Kiebrania husema kihalisi ‘nitaongeza juu ya siku zako miaka kumi na mitano.’ ‘Katika maisha yako’ huwasilisha maana ya kuongeza muda wa kuishi kwa Kiswahili cha kawaida bila kupoteza taswira ya ongezeko.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: kutoka mkononi mwa mfalme wa Ashuru
  rationale: ‘Mkono’ huhifadhi sitiari ya Kiebrania ya mamlaka au udhibiti, nayo inaeleweka katika Kiswahili cha kibiblia na cha kawaida.
- source_word: אַצִּילְךָ
  choice: nitakuokoa
  rationale: Hifili ya נצל ina maana ya kuokoa au kukomboa kutoka hatarini; ‘kuokoa’ ni ya asili na inafaa katika muktadha wa tishio la kijeshi.
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: wewe na mji huu
  rationale: Muundo huu unaunganisha mtu anayeahidiwa na mji kuwa vitu viwili vitakavyookolewa.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: nami nitautetea mji huu
  rationale: Kitenzi גנן humaanisha kukinga, kulinda au kutetea. ‘Kutetea’ kinafaa hasa kwa mji unaokabiliwa na adui, huku wazo la ulinzi likibaki wazi.
- source_word: לְמַעֲנִי
  choice: kwa ajili yangu mwenyewe
  rationale: Usemi huu unaonyesha sababu inayomhusu Mungu mwenyewe; ‘mwenyewe’ hudumisha msisitizo wa kiwakilishi.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: na kwa ajili ya Daudi, mtumishi wangu
  rationale: Tafsiri hii inahifadhi sababu iliyotajwa wazi katika matini pamoja na uhusiano wa Daudi kama mtumishi wa Mungu, bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Sababu ya Mungu kuuokoa na kuutetea Yerusalemu
  choice: kwa ajili yangu mwenyewe na kwa ajili ya Daudi, mtumishi wangu
  alternative: kwa ajili yangu na kwa sababu ya Daudi, mtumishi wangu
  rationale: Matini yenyewe inaweka sambamba kujali kwa Mungu jina au kusudi lake mwenyewe na kujali kwake Daudi mtumishi wake. Tafsiri haielezi zaidi namna sababu hizo zinavyohusiana, hivyo inadumisha mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Katika maisha yako’ ni cha kawaida zaidi kuliko kunakili kihalisi ‘juu ya siku zako.’ Viunganishi vimegawanywa katika sentensi mbili ili mstari mrefu usomeke kwa ufasaha, bila kubadili mfuatano wa ahadi.
