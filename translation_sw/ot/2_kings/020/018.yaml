base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: sw
  text: Na baadhi ya wana wako watakaotokana nawe, ambao utakuwa baba yao, watachukuliwa, nao watakuwa matowashi[a] katika jumba la mfalme wa Babeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maafisa wa ikulu” au “maafisa wa kifalme”; neno la Kiebrania linaweza kumaanisha matowashi halisi au, katika baadhi ya miktadha, maafisa wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: Na baadhi ya wana wako
  rationale: Kihusishi מִן kina maana ya sehemu ya kundi hapa, hivyo ‘baadhi ya wana wako’ ni Kiswahili cha asili kuliko tafsiri sisisi ‘kutoka kwa wana wako’; ‘wana’ linahifadhi neno בָּנִים.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: watakaotoka kwako
  rationale: Kauli hii ya Kiebrania inaonyesha uzao wa kimwili. Tafsiri hii inahifadhi taswira ya chanzo cha Kiebrania na inaeleweka katika muktadha.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: ambao utawazaa
  rationale: Hifili ya ילד ikielekezwa kwa baba ina maana ya kuzaa au kuwa baba wa watoto. ‘Utawazaa’ ni ya kawaida na inaendeleza maana ya uzazi wa upande wa baba bila kutumia neno la kizamani.
- source_word: יִקַּח
  choice: watachukuliwa
  rationale: Ingawa kitenzi cha Kiebrania ni cha umoja tendaji, mtendaji wake hakutajwa na ni wa jumla katika muktadha. Kauli tendwa ya Kiswahili inawasilisha maana hiyo bila kuongeza mhusika.
- source_word: וְהָיוּ
  choice: nao watakuwa
  rationale: היה pamoja na nomino ya kiarifu inaweza kumaanisha ‘kuwa’ au ‘kuwa na hali mpya.’ ‘Watakuwa’ ni ya asili na haifungi bila lazima kama hali hiyo ni cheo kipya au hali ya kimwili.
- source_word: סָרִיסִים
  choice: matowashi
  rationale: Maana ya msingi ni wanaume waliohasiwa, nayo inafaa katika muktadha wa wana wa kifalme waliopelekwa kwenye jumba la mfalme wa kigeni. Maana mbadala ya maofisa wa ikulu imehifadhiwa katika tanbihi.
- source_word: בְּהֵיכַל
  choice: katika jumba
  rationale: הֵיכָל linaweza kumaanisha hekalu au jumba; uhusiano wake na mfalme wa Babeli hapa unaonyesha wazi jumba la kifalme.
- source_word: מֶלֶךְ בָּבֶל
  choice: la mfalme wa Babeli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji wa Kiebrania.
theological_decisions:
- issue: Maana ya סָרִיסִים katika mazingira ya ikulu
  choice: ‘matowashi’ katika matini kuu
  alternative: ‘maofisa wa ikulu’ au ‘watumishi wa jumba la kifalme’
  rationale: Neno linaweza kumaanisha matowashi halisi au maofisa wa kifalme. Maana ya msingi na uzito wa hukumu katika muktadha vinaunga mkono ‘matowashi,’ lakini tanbihi inadumisha uwezekano wa maana ya cheo bila kuondoa mvutano wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unafuata kwa karibu mfuatano wa Kiebrania huku ukitumia kauli tendwa ya asili kwa mtendaji asiyeainishwa. ‘Jumba’ limetumiwa badala ya ‘hekalu’ kwa sababu muktadha ni makao ya mfalme.
