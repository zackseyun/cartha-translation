lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huwasilisha kiunganishi cha kisimulizi kinachoanzisha tukio jipya bila kutumia lugha ya kizamani kupita kiasi.
- source_word: יְשַׁעְיָהוּ
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: לֹא יָצָא
  choice: alikuwa bado hajatoka
  rationale: 'Huwakilisha wazi hali ya wakati huo: kuondoka kwa Isaya kulikuwa bado hakujakamilika kabla ya neno la Yahwe kumjia.'
- source_word: הָעִיר הַתִּיכֹנָה
  choice: uwanja wa kati
  rationale: Ingawa עיר kwa kawaida humaanisha ‘mji,’ muktadha huu unaeleweka kwa mapokeo kuwa eneo au uwanja wa jumba la kifalme. ‘Uwanja wa kati’ ni wa asili katika Kiswahili na haugeuzi תיכונה kuwa ‘wa ndani.’
- source_word: וּדְבַר יְהוָה
  choice: neno la Yahwe
  rationale: Huhifadhi fomula ya kinabii na nomino דבר kama ‘neno,’ huku jina la Mungu likitolewa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la Kiswahili la jina la agano YHWH.
- source_word: הָיָה אֵלָיו
  choice: likamjia
  rationale: Ni tafsiri ya kawaida na ya asili ya fomula ya Kiebrania inayosema kwamba mtu alipokea neno la Mungu.
- source_word: לֵאמֹר
  choice: likisema,
  rationale: Huhifadhi kiungo kinachoanzisha maneno ya moja kwa moja yatakayofuata katika mstari unaofuata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la Mungu YHWH moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘alikuwa bado hajatoka’ huweka wazi uhusiano wa wakati bila kuondoa ukanushaji wa Kiebrania.
