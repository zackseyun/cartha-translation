source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֥ה רָא֖וּ בְּ/בֵיתֶ֑/ךָ וַ/יֹּ֣אמֶר חִזְקִיָּ֗הוּ אֵ֣ת כָּל אֲשֶׁ֤ר בְּ/בֵיתִ/י֙ רָא֔וּ לֹא הָיָ֥ה דָבָ֛ר אֲשֶׁ֥ר לֹֽא הִרְאִיתִ֖/ם בְּ/אֹצְרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: sw
  text: Akasema, “Waliona nini katika nyumba yako[a]?” Hezekia akasema, “Waliona kila kitu kilicho katika nyumba yangu. Hakukuwa na kitu katika hazina zangu[b] ambacho sikuwaonyesha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikulu yako.” Neno la Kiebrania ni “nyumba yako.”
    reason: lexical_alternative
  - marker: b
    text: Au “maghala yangu.” Neno la Kiebrania linaweza kumaanisha mahali pa kuhifadhia vitu vya thamani au mahitaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: nini
  rationale: Kiwakilishi cha kuuliza kinachotanguliza swali moja kwa moja; “nini” ni cha kawaida na sahihi katika Kiswahili.
- source_word: רָאוּ
  choice: waliona
  rationale: Kitenzi ראה hapa kina maana ya kawaida ya kuona; wakati uliopita unafaa muktadha wa simulizi.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: katika nyumba yako / katika nyumba yangu
  rationale: בַּיִת kimsingi ni “nyumba.” Katika muktadha wa mfalme inaweza kumaanisha ikulu, lakini “nyumba” huhifadhi usemi wa Kiebrania bila kuufafanua kupita kiasi.
- source_word: חִזְקִיָּהוּ
  choice: Hezekia
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina hili la mtu.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: kila kitu kilicho katika nyumba yangu
  rationale: Kauli hii huhifadhi maana jumuishi ya כָּל אֲשֶׁר pamoja na kishazi chake cha uhusiano.
- source_word: לֹא הָיָה דָבָר
  choice: Hakukuwa na kitu
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya muundo wa Kiebrania unaokanusha kuwapo kwa kitu.
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: ambacho sikuwaonyesha
  rationale: Hifili ya ראה humaanisha kusababisha waone, yaani “kuonyesha”; kiambishi cha wingi cha nafsi ya tatu kimehifadhiwa katika “-wa-.”
- source_word: בְּאֹצְרֹתָי
  choice: katika hazina zangu
  rationale: אֹצָר inaweza kutaja hazina au mahali pa kuhifadhia vitu vya thamani na mahitaji. “Hazina” inafaa muktadha wa mali ya kifalme huku wingi ukihifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye staha. Urudiaji wa “akasema” umehifadhiwa ili kufuata muundo wa Kiebrania, na alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
