  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mpangilio wa simulizi la Kiebrania, lakini inatumia miundo ya kawaida ya Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
