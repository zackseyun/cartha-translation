source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: sw
  text: Hezekia akawasikiliza[a], akawaonyesha nyumba yake ya hazina yote—fedha, dhahabu, manukato, mafuta mazuri, ghala lake la silaha[b], na kila kitu kilichopatikana katika maghala yake. Hakukuwa na kitu chochote katika nyumba yake au katika eneo lote alilotawala[c] ambacho Hezekia hakuwaonyesha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawasikia” au “akawapokea kwa kuwapa nafasi.” Idiomu ya Kiebrania inaweza kumaanisha kuwasikiliza kwa makini au kuwapokea vyema.
    reason: lexical_alternative
  - marker: b
    text: Au, “ghala lake la vifaa.” Kiebrania ni “nyumba ya vyombo/vifaa vyake,” na katika muktadha huu huenda kinamaanisha ghala la silaha.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika mamlaka yake yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: akawasikiliza
  rationale: Kirai hiki kinaweza kumaanisha kuwasikiliza kwa kuwakubali au kuwapa nafasi; “akawasikiliza” ni cha asili na kinahifadhi upana huo kuliko kueleza kusikia kwa masikio tu.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: akawaonyesha / hakuwaonyesha
  rationale: Hifili ya ראה ina maana ya kusababisha waone, yaani kuwaonyesha; tafsiri ileile imedumishwa katika marudio ya mwisho.
- source_word: בֵּית נְכֹתֹה
  choice: nyumba yake yote ya hazina
  rationale: Kirai hiki kinaonyesha mahali pa kuhifadhi vitu vya thamani. “Nyumba ya hazina” ni wazi na kinawakilisha kiambishi cha umilikaji.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: Katika orodha hii neno linamaanisha madini ya thamani yaliyohifadhiwa, si pesa kwa maana finyu ya kisasa.
- source_word: הַזָּהָב
  choice: dhahabu
  rationale: Ni rejeo la moja kwa moja kwa dhahabu iliyohifadhiwa miongoni mwa mali za mfalme.
- source_word: הַבְּשָׂמִים
  choice: manukato
  rationale: Wingi huu unarejelea vitu vyenye harufu nzuri na vya thamani; “manukato” ni neno la kawaida la Kiswahili linalofaa katika muktadha huu.
- source_word: שֶׁמֶן הַטּוֹב
  choice: mafuta mazuri
  rationale: Hii inafuata kwa karibu maana ya “mafuta mema/mazuri” bila kubainisha matumizi ambayo maandishi hayataji.
- source_word: בֵּית כֵּלָיו
  choice: ghala lake la silaha
  rationale: Katika orodha ya mali ya kifalme, כֵּלִים inaweza kumaanisha silaha au vifaa; tafsiri hii inatoa maana inayowezekana zaidi huku tanbihi ikihifadhi maana pana zaidi.
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: kila kitu kilichopatikana katika maghala yake
  rationale: אֹצָר inaweza kuwa hazina au ghala; “maghala” ni ya asili hapa na inaepusha kurudia “nyumba ya hazina.”
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Hakukuwa na kitu chochote ... ambacho Hezekia hakuwaonyesha
  rationale: Muundo wa Kiebrania wa ukanushi maradufu umehifadhiwa kwa namna ya Kiswahili inayoeleweka na kusisitiza ukamilifu.
- source_word: בְּבֵיתוֹ
  choice: katika nyumba yake
  rationale: Huhifadhi maana halisi ya “nyumba”; kwa kuwa mhusika ni mfalme, inaweza kuhusisha jumba lake bila kulazimisha maana hiyo.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: katika eneo lote alilotawala
  rationale: מֶמְשָׁלָה huonyesha mamlaka au eneo la utawala. Kirai hiki ni Kiswahili cha kawaida na kinahifadhi wazo la kila kilichokuwa chini ya utawala wake.
