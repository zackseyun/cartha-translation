  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: sw
  text: 'Katika siku hizo, Hezekia aliugua, akawa karibu kufa. Nabii Isaya mwana wa Amozi akamjia na kumwambia, “Yahweh asema hivi: ‘Panga mambo ya nyumba yako, kwa maana unakufa[a]; hutaishi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utakufa.” Kiebrania, kwa maana halisi zaidi, kinaweza kutafsiriwa “unakufa” au “umekufa”; usemi huo unatangaza kifo cha hakika kilicho karibu.
    reason: Mbadala wa kimsamiati unaeleza nguvu ya usemi wa Kiebrania מֵת אַתָּה bila kuufanya umaanishwe kuwa Hezekia alikuwa tayari amekufa.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Katika siku hizo
  rationale: Ni tafsiri ya kawaida na ya asili ya kirai cha wakati kinachoanzisha tukio.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: Hezekia aliugua, akawa karibu kufa
  rationale: ‘Aliugua’ huonyesha kuingia katika hali ya ugonjwa, na ‘akawa karibu kufa’ hueleza uzito wa ugonjwa uliomfikisha kwenye ukingo wa kifo bila kudai kwamba tayari alikuwa amekufa.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: Nabii Isaya mwana wa Amozi
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi cheo, jina, na utambulisho wa baba.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Huhifadhi mtindo wa ujumbe wa kinabii na kulitaja jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: צַו לְבֵיתֶךָ
  choice: Panga mambo ya nyumba yako
  rationale: Kirai hiki kinamaanisha kutoa maagizo na kuweka sawa mambo ya familia au mali kabla ya kifo; tafsiri hii ni ya asili katika Kiswahili bila kuifanya ‘nyumba’ kuwa jengo tu.
- source_word: כִּי מֵת אַתָּה
  choice: kwa maana unakufa
  rationale: Inadumisha nguvu ya umbo la Kiebrania linalotangaza kifo kuwa cha hakika na karibu, badala ya kukifanya kuwa kifo kilichokamilika tayari.
- source_word: וְלֹא תִחְיֶה
  choice: hutaishi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kukataliwa kwa kuendelea kuishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Nguvu ya tangazo מֵת אַתָּה
  choice: unakufa
  alternative: utakufa; umekufa
  rationale: '‘Unakufa’ huhifadhi mvutano wa usemi wa Kiebrania: kifo kinatangazwa kuwa cha hakika na karibu, ingawa bado hakijatokea kikamilifu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Viunganishi vya masimulizi vimetolewa kwa mtiririko wa kawaida wa Kiswahili, na usemi wa kinabii umehifadhiwa kwa namna fupi na ya moja kwa moja.
