base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: sw
  text: Alifanya yaliyo maovu machoni pa Yahweh. Hakuacha dhambi yoyote ya Yeroboamu mwana wa Nebati[a], ambaye aliwafanya Israeli watende dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhambi za Yeroboamu mwana wa Nebati, ambazo Yeroboamu aliwafanya Israeli wazitende.” Kishazi cha Kiebrania kinaweza kueleweka kuwa kinahusishwa na dhambi hizo badala ya kumrejelea Yeroboamu moja kwa moja.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Alifanya yaliyo maovu
  rationale: Usemi huu wa Kiswahili ni wa kawaida na wenye heshima, nao unahifadhi tathmini ya kimaadili ya msemo wa Kiebrania ‘kufanya yaliyo maovu.’
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Unahifadhi taswira ya Kiebrania ya tathmini ya Mungu kwa Kiswahili kinachoeleweka, huku jina la agano יְהוָה likitoholewa kuwa ‘Yahweh.’
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Hakuacha dhambi yoyote
  rationale: Katika muktadha huu, סור מן humaanisha kuacha au kujitenga na mwenendo fulani. Muundo hasi pamoja na כָּל unawasilishwa kwa kawaida kama ‘dhambi yoyote,’ ukidumisha maana kwamba hakuacha hata moja.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametolewa kwa maumbo ya kawaida ya Kiswahili cha Biblia, na uhusiano wa ukoo umeonyeshwa kwa ‘mwana wa.’
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambayo kwa hizo aliwasababisha Israeli watende dhambi
  rationale: 'Hifili ya חטא ina nguvu ya kusababisha: ‘kuwasababisha watende dhambi.’ ‘Ambayo kwa hizo’ linaunganisha kishazi na dhambi au matendo hayo kama njia iliyotumiwa, bila kuficha kwamba Yeroboamu ndiye msababishaji.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kina jina la pekee la Mungu, si cheo. ‘Yahweh’ linahifadhi jina hilo kwa utaratibu wa kutoholewa badala ya kulibadilisha kuwa cheo.
- issue: Kirejeleo cha אֲשֶׁר katika kishazi cha mwisho
  choice: 'Kishazi kinahusishwa kimsingi na dhambi hizo kwa maana ya njia: ‘ambayo kwa hizo aliwasababisha Israeli watende dhambi.’'
  alternative: 'Kukihusisha moja kwa moja na Yeroboamu: ‘ambaye aliwasababisha Israeli watende dhambi.’'
  rationale: Kiebrania kinaruhusu uhusiano wa kisarufi na ‘dhambi’ au uhusiano wa kimantiki na Yeroboamu. Tafsiri kuu inafuata mtiririko wa karibu wa maneno na kuhifadhi Yeroboamu kama mtendaji wa kitenzi; tanbihi inaonyesha usomaji mwingine wa kweli.
- issue: Wigo wa לֹא ... מִכָּל
  choice: Hakuacha dhambi yoyote
  alternative: Hakuacha dhambi zote
  rationale: Katika sentensi hasi, ‘yoyote’ huonyesha kwa usahihi kwamba hakujitenga hata na dhambi moja, bila kudokeza kimakosa kwamba aliacha baadhi lakini si zote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Machoni pa’ huhifadhi nahau ya chanzo bila kuwa nzito; ‘Hakuacha dhambi yoyote’ ni ya kawaida na sahihi katika muundo hasi. Kiashirio [a] kimewekwa mara moja baada ya jina linalohusika.
