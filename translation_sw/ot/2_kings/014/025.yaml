  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: sw
  text: 'Yeye aliurejesha mpaka wa Israeli kutoka Lebo-hamathi[a] kufikia Bahari ya Araba[b], sawasawa na neno la Yahwe, Mungu wa Israeli, ambalo Yahwe alikuwa amelinena kupitia mtumishi wake Yona mwana wa Amitai, yule nabii aliyetoka Gath-heferi.


    [a] Au, kwa tafsiri ya moja kwa moja, “kutoka mahali pa kuingia Hamathi.”


    [b] Yaani, huenda ni Bahari ya Chumvi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja, “kutoka mahali pa kuingia Hamathi.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, huenda ni Bahari ya Chumvi.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵשִׁיב
  choice: aliurejesha
  rationale: Hifili ya שׁוב hapa inaeleza kurudishwa kwa mpaka wa kisiasa na kijiografia wa Israeli; “aliurejesha” ni ya kawaida na inadumisha maana hiyo.
- source_word: גְּבוּל
  choice: mpaka
  rationale: Neno hili humaanisha mpaka wa eneo. Umoja wa “mpaka” unafuata umbo la Kiebrania na unasikika kwa kawaida katika Kiswahili.
- source_word: מִלְּבוֹא חֲמָת
  choice: kutoka Lebo-hamathi
  rationale: Kirai hiki kinaweza kutumiwa kama jina maalumu la mahali. Jina limehifadhiwa katika matini, huku maana halisi zaidi ikitolewa katika tanbihi.
- source_word: יָם הָעֲרָבָה
  choice: Bahari ya Araba
  rationale: Hii inatafsiri moja kwa moja istilahi ya kijiografia ya Kiebrania bila kuamua kimya kimya kwamba ni Bahari ya Chumvi; utambulisho huo unaowezekana umetajwa katika tanbihi.
- source_word: כִּדְבַר
  choice: sawasawa na neno la
  rationale: Kirai hiki huonyesha kwamba jambo lilitokea kulingana na tamko la Mungu lililotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo linalolingana na tahajia na matamshi ya Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: בְּיַד
  choice: kupitia
  rationale: Nahau ya Kiebrania inaonyesha uwakala. “Kupitia” huwasilisha maana hiyo kwa Kiswahili cha asili bila kudai mkono halisi.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Katika muktadha wa utume wa kinabii, “mtumishi” linafaa zaidi kuliko “mtumwa” na bado linaonyesha uhusiano wake na Mungu.
- source_word: הַנָּבִיא
  choice: nabii
  rationale: Ni cheo cha Yona kinachoeleza kazi yake.
- source_word: מִגַּת הַחֵפֶר
  choice: kutoka Gath-heferi
  rationale: Kihusishi מן kinaonyesha asili; “kutoka” hutoa maana hiyo wazi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Matini inadumisha jina binafsi la Mungu; umbo “Yahwe” linafuata uhawilishaji unaolingana na Kiswahili bila kulibadilisha kuwa cheo.
- issue: Utambulisho wa יָם הָעֲרָבָה
  choice: Bahari ya Araba
  alternative: Bahari ya Chumvi
  rationale: Matini kuu inadumisha usemi wa Kiebrania na kutomlazimishia msomaji utambulisho wa kijiografia unaowezekana; “Bahari ya Chumvi” imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa karibu na Kiebrania pale unapobaki wa asili katika Kiswahili, huku nahau ya uwakala בְּיַד ikitafsiriwa kwa “kupitia” ili kuepuka ugumu usio wa lazima.
