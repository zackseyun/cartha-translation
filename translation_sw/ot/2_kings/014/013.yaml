  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini rahisi kueleweka. Majina yametoholewa kwa maumbo yanayotumika sana katika Biblia za Kiswahili; kipimo cha kale “dhiraa” kimehifadhiwa.
