  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: sw
  text: Naye Yehoashi, mfalme wa Israeli, akamkamata Amazia, mfalme wa Yuda, mwana wa Yehoashi, mwana wa Ahazia, huko Beth-shemeshi. Kisha akaenda Yerusalemu[a] na akabomoa ukuta wa Yerusalemu, kuanzia Lango la Efraimu hadi Lango la Kona, umbali wa dhiraa mia nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya konsonanti ya Kiebrania yanasema, “wakaenda Yerusalemu,” lakini muktadha na kitenzi kinachofuata katika umoja vinaunga mkono maana, “akaenda Yerusalemu,” ikimrejelea Yehoashi.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: akamkamata
  rationale: Katika muktadha huu wa kijeshi, kitenzi hiki kinaonyesha kumtia mfalme mikononi na kumfanya mateka; “akamkamata” ni wazi na cha kawaida.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: huko Beth-shemeshi
  rationale: Kiambishi בְּ hapa kinaonyesha mahali alikokamatwa; “huko” huleta locative ya asili katika Kiswahili.
- source_word: ו/יבאו
  choice: Kisha akaenda
  rationale: Maandishi ya konsonanti yana wingi, lakini muktadha na kitenzi kinachofuata katika umoja vinaunga mkono kurejelea Yehoashi katika umoja. “Akaenda” ni ya asili zaidi kwa kufika kwenye mji kutoka Beth-shemeshi.
- source_word: וַיִּפְרֹץ
  choice: na kuubomoa
  rationale: Kitenzi kina maana ya kuvunja au kutoboa sehemu ya ukuta. “Kuubomoa” huwasilisha wazi uharibifu wa sehemu iliyotajwa.
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: ukuta wa Yerusalemu
  rationale: Kiswahili cha kawaida hutumia yambwa moja kwa moja pamoja na “bomoa,” badala ya kutafsiri kihusishi בְּ kwa namna isiyo ya asili.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: kuanzia Lango la Efraimu hadi Lango la Pembeni
  rationale: Muundo huu unaonyesha mipaka ya sehemu ya ukuta iliyobomolewa; “kuanzia ... hadi ...” hueleza upeo huo kwa uwazi.
- source_word: הַפִּנָּה
  choice: Pembeni
  rationale: Katika jina la lango, “Lango la Pembeni” ni jina la mahali linaloeleweka na linaakisi wazo la kona au upande wa ukuta bila kuwa na Kiswahili kigumu.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: umbali wa dhiraa mia nne
  rationale: “Dhiraa” huhifadhi kipimo cha kale, huku “umbali wa” ikiweka wazi kuwa namba inaeleza urefu wa sehemu ya ukuta.
- source_word: בֶּן ... בֶּן ...
  choice: mwana wa Yehoashi, mwana wa Ahazia
  rationale: Kurudia “mwana wa” kunafuata muundo wa Kiebrania na hakubadili uhusiano wa nasaba kuwa “mjukuu,” ingawa huo ndio uhusiano unaoeleweka katika mlolongo.
