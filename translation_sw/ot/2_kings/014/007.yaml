lexical_decisions:
- source_word: הִכָּה
  choice: aliwaua
  rationale: Katika muktadha wa idadi ya watu waliopigwa vitani, kitenzi hiki kinaonyesha pigo lenye kuua; Kiswahili cha kawaida hutumia ‘kuua’ kwa uwazi na uasilia.
- source_word: אֱדוֹם
  choice: Waedomu
  rationale: Ingawa Kiebrania kinasema kihalisi ‘Edomu,’ idadi ya elfu kumi inadokeza watu wa Edomu; ‘Waedomu’ ni usemi wa kawaida wa Kiswahili.
- source_word: בְּגֵיא הַמֶּלַח
  choice: katika Bonde la Chumvi
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya jina la kijiografia.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: elfu kumi
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi hiyo kwa Kiswahili.
- source_word: וְתָפַשׂ
  choice: akauteka
  rationale: Katika muktadha wa vita, kitenzi kina maana ya kutwaa mahali kwa nguvu.
- source_word: הַסֶּלַע
  choice: mji wa Sela
  rationale: Muktadha unaelekeza kwenye jina la mahali; ‘mji wa’ huwekwa wazi kwa Kiswahili ili yambwa la kitenzi ‘kuteka’ lieleweke kwa urahisi, bila kubadili jina lenyewe.
- source_word: בַּמִּלְחָמָה
  choice: vitani
  rationale: Ni usemi mfupi, wa asili, na sahihi wa Kiswahili kwa tukio lililotokea katika mapigano.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: akauita
  rationale: Hutoa kwa Kiswahili cha kawaida fomula ya Kiebrania ya kumpa mahali jina.
- source_word: יָקְתְאֵל
  choice: Joktheeli
  rationale: Jina la mahali limetoholewa kwa muundo unaoweza kutamkwa kwa Kiswahili huku likihifadhi utambulisho wake.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni usawa wa kawaida wa Kiswahili wa fomula inayoonyesha kuwa jina liliendelea kutumiwa hadi wakati wa mwandishi.
