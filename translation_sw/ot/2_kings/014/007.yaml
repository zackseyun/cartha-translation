  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: sw
  text: Aliwapiga Waedomu elfu kumi katika Bonde la Chumvi, akaitwaa Sela[a] vitani, akaliita Yoktheeli, hata leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sela linaweza pia kueleweka kwa maana yake ya kawaida, “mwamba” au “jabali,” lakini hapa huenda ni jina la mahali.
