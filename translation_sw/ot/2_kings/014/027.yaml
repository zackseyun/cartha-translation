base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: sw
  text: Lakini Yahwe hakuwa amesema kwamba angelifuta[a] jina la Israeli kutoka chini ya mbingu; kwa hiyo aliwaokoa kupitia[b] Yeroboamu mwana wa Yoashi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulifutilia mbali” au “kuliondoa kabisa jina la Israeli.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kwa mkono wa Yeroboamu mwana wa Yoashi,” yaani, kupitia kwake au kwa njia yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu kwa namna ya unukuzi iliyozoeleka katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: וְלֹא דִבֶּר
  choice: Lakini Yahwe hakuwa amesema
  rationale: Kitenzi דבר humaanisha kusema au kunena; wakati timilifu wa Kiswahili unaonyesha kwamba kutotamka huku kulitangulia tendo la kuokoa. 'Lakini' linaunganisha mstari huu na muktadha wa awali.
- source_word: לִמְחוֹת
  choice: kwamba angeifuta
  rationale: מחה hapa hueleza kuondoa kabisa. 'Kufuta' ni Kiswahili cha kawaida na kinaendana kiasili na kitu 'jina' bila kuficha maana ya kuangamiza kabisa.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: jina la Israeli
  rationale: Linadumisha nahau ya Kiebrania ambamo 'jina' linawakilisha kuendelea kuwapo na utambulisho wa Israeli.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: kutoka chini ya mbingu
  rationale: Linahifadhi taswira na upeo wa nahau ya Kiebrania bila kuifasiri moja kwa moja kuwa 'duniani.'
- source_word: וַיּוֹשִׁיעֵם
  choice: kwa hiyo akawaokoa
  rationale: Hifili ya ישע ina maana ya kuokoa au kukomboa. 'Kwa hiyo' linaonyesha uhusiano wa kimantiki wa masimulizi kati ya kutotangaza kuangamizwa kwao na tendo la kuwaokoa.
- source_word: בְּיַד
  choice: kupitia
  rationale: Nahau ya Kiebrania 'kwa mkono wa' huonyesha wakala au njia. 'Kupitia' ni ya asili katika Kiswahili na inaweka wazi kwamba Yeroboamu alikuwa wakala wa kibinadamu.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: Yeroboamu mwana wa Yoashi
  rationale: Majina yametolewa kwa maumbo ya Kiswahili yanayotambulika, huku uhusiano wa mwana na baba ukihifadhiwa.
theological_decisions:
- issue: Kusudi la Mungu na tendo lake katika kuihifadhi Israeli
  choice: Mstari unasema kwamba Yahwe hakuwa ametamka kuifuta Israeli, kwa hiyo aliwaokoa kupitia Yeroboamu kama wakala wake.
  alternative: Kutafsiri vifungu hivi kama matendo mawili yanayofuatana bila kufanya uhusiano wa matokeo kuwa wazi.
  rationale: Kiebrania kinaweka kutotamka kwa Yahwe kwamba angeifuta Israeli kabla ya tendo lake la kuwaokoa. 'Kwa hiyo' linaonyesha mantiki hiyo bila kuongeza fundisho lisilomo katika matini, na linadumisha mvutano wa Mungu kuwaokoa kupitia mfalme mwenye dosari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni nyepesi kwa msomaji wa kawaida huku nahau muhimu ya 'jina la Israeli' na taswira ya 'chini ya mbingu' zikihifadhiwa. Alama za tanbihi zimewekwa karibu na vipengele vinavyoelezwa.
