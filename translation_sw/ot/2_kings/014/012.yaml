  yaml_path: translation/ot/2_kings/014/012.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: sw
  text: Yuda akashindwa mbele ya Israeli, na kila mtu akakimbilia hemani kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mmoja akakimbilia nyumbani kwake.” Kiebrania kinasema kihalisi, “kila mtu kwenye hema lake,” msemo wa kawaida unaomaanisha kutawanyika na kurudi makwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: akashindwa
  rationale: Kauli ya kutendwa ya נָגַף katika muktadha huu wa vita inaonyesha kushindwa vitani, si kupigwa kimwili tu.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa ufalme wa kusini.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Katika muktadha wa vita, msemo huu unaonyesha kushindwa mbele ya adui na unadumisha muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa ufalme wa kaskazini.
- source_word: וַיָּנֻסוּ
  choice: akakimbilia
  rationale: Kitenzi נוּס kinamaanisha kukimbia ili kujiokoa; pamoja na mahali panapoelekezwa, 'akakimbilia' ni ya asili katika Kiswahili.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Umoja wa kugawanya unaonyesha kwamba watu walitawanyika mmoja mmoja; 'kila mtu' ni Kiswahili cha kawaida bila kupoteza maana hiyo.
- source_word: לְאָהֳלוֹ
  choice: hemani kwake
  rationale: Tafsiri hii inadumisha picha halisi ya 'hema yake' huku ikitumia muundo wa Kiswahili unaoeleweka kwa urahisi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Muundo wa vitenzi vya mfululizo umetumiwa kuonyesha mwendelezo wa matukio. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
