  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת כָּל הַ/זָּהָב וְ֠/הַ/כֶּסֶף וְ/אֵ֨ת כָּל הַ/כֵּלִ֜ים הַ/נִּמְצְאִ֣ים בֵּית יְהוָ֗ה וּ/בְ/אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֵ֖ת בְּנֵ֣י הַ/תַּֽעֲרֻב֑וֹת וַ/יָּ֖שָׁב שֹׁמְרֽוֹנָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: sw
  text: Akachukua dhahabu yote na fedha yote, na vyombo vyote vilivyokuwamo katika nyumba ya Yahwe na katika hazina za nyumba ya mfalme, na mateka[a], kisha akarudi Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa dhamana” au “wana wa wadhamini”; huenda maana yake ni watu walioshikiliwa kuwa dhamana, yaani mateka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Akachukua
  rationale: Kitenzi cha masimulizi kinaendeleza mfuatano wa matukio; kiambishi “aka-” ni cha kawaida na cha asili katika masimulizi ya Kiswahili.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: dhahabu yote na fedha yote
  rationale: Huhifadhi wazo la kuchukuliwa kwa jumla kwa kila aina ya mali na pia husikika kwa uwazi katika Kiswahili.
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  choice: vyombo vyote vilivyopatikana
  rationale: “Vyombo” ni neno pana linalofaa kwa vifaa au vitu vya hekkaluni na ikulu; “vilivyopatikana” huakisi kirai elezi cha Kiebrania.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania “nyumba ya YHWH” na kulitaja jina la Mungu lililo katika matini chanzi.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: na katika hazina za nyumba ya mfalme
  rationale: “Hazina” linaweza kumaanisha mahali pa kuhifadhia mali za thamani; “nyumba ya mfalme” huhifadhi taswira ya Kiebrania bila kuibadili moja kwa moja kuwa “ikulu.”
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: mateka
  rationale: Kirai kigumu kwa maana halisi kinaelekea kutaja watu walioshikiliwa kuwa dhamana; “mateka” ni tafsiri ya kimuktadha inayoeleweka, huku maana halisi zaidi ikihifadhiwa katika tanbihi.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: kisha akarudi Samaria
  rationale: Hutoa kwa asili tendo linalofuata katika simulizi na huhifadhi maana ya kurudi kuelekea Samaria.
theological_decisions:
- issue: Uwasilishaji wa tetragramu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini chanzi ina jina binafsi יהוה; “Yahwe” hulitofautisha na cheo “Bwana” na kuendana na safu ya mashauriano ya POB iliyotolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi na wenye heshima. “Pamoja na” hutenganisha kwa uwazi watu waliotekwa na orodha ya vitu, bila kuongeza maana mpya.
