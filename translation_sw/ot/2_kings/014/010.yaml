base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: sw
  text: Kwa kweli umeipiga Edomu, na moyo wako umekuinua[a]. Jivunie heshima hiyo[b] na ukae nyumbani kwako. Kwa nini ujitafutie maafa, hata ukaanguke—wewe na Yuda pamoja nawe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, moyo wako umekuwa na kiburi. Nahau ya Kiebrania, kwa neno, ni “moyo wako umekuinua.”
    reason: lexical_alternative
  - marker: b
    text: Au, Jiheshimishe; au, Jisifu. Kiebrania huenda kinamaanisha kwamba ajipatie au afurahie heshima iliyotokana na ushindi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: Kwa kweli umeipiga
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichokamilika unatilia tendo mkazo. “Kwa kweli” huonyesha mkazo huo, na “umeipiga” hubaki karibu na maana ya נכה bila kuamua wazi kuwa ushindi kamili ndio unaokusudiwa.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: moyo wako umekuinua
  rationale: Huhifadhi taswira ya Kiebrania, ambamo moyo ndiye kiima; katika muktadha huu ni nahau ya kiburi au kujikweza. Tanbihi inaeleza maana hiyo.
- source_word: הִכָּבֵד
  choice: Jivunie heshima hiyo
  rationale: Amri ya Niphal ya כבד hapa inaelekea kumruhusu mfalme atosheke na heshima ya ushindi wake. Tafsiri hii ni ya asili katika Kiswahili lakini tanbihi huhifadhi uwezekano wa “jiheshimishe” au “jisifu.”
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: na ukae nyumbani kwako
  rationale: Ni onyo la kubaki nyumbani badala ya kutafuta mapambano mengine; “ukae nyumbani kwako” ni ya kawaida na yenye hadhi.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: uchokoze maafa
  rationale: Kitenzi kina maana ya kujichochea, kuchokoza, au kujiingiza katika ugomvi, huku רעה hapa ikimaanisha madhara au maafa badala ya uovu wa kimaadili. Usemi huu huhifadhi ukali wa swali la balagha.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: ukaanguka—wewe pamoja na Yuda
  rationale: “Ukaanguka” huonyesha matokeo yanayotarajiwa ya uchokozi huo, na kifungu cha mwisho husisitiza kuwa kuanguka kwa mfalme kungelihusisha taifa la Yuda pia.
