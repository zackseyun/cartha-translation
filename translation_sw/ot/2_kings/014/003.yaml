base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: sw
  text: Akafanya yaliyo sawa machoni pa Yahwe[a], lakini si kama Daudi baba yake[b]; alifanya sawasawa na yote aliyoyafanya Yoashi baba yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahwe” ni jina la Mungu linalowakilishwa na herufi יהוה katika maandishi ya Kiebrania.
    reason: divine_name
  - marker: b
    text: Hapa “baba yake” humaanisha babu au mtangulizi katika ukoo wa kifalme, si baba yake wa karibu.
    reason: cultural_note
  - marker: c
    text: Jina “Yoashi” pia huandikwa “Yehoashi” katika baadhi ya tafsiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Muundo huu unaendeleza simulizi na kueleza mwenendo wa mfalme; “akafanya” ni wa asili katika masimulizi ya Kiswahili.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Huwasilisha tathmini ya kimaadili ya kifalme kwa lugha ya kawaida na yenye heshima.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi nahau ya Kiebrania kuhusu tathmini ya Mungu, huku jina la agano יְהוָה likiwakilishwa kama Yahwe.
- source_word: רַק
  choice: lakini
  rationale: Katika muktadha huu neno linaweka mpaka au sifa ya kupunguza uzito wa tathmini chanya iliyotangulia.
- source_word: לֹא כְּדָוִד אָבִיו
  choice: si kama Daudi baba yake
  rationale: Huhifadhi ulinganisho wa moja kwa moja na matumizi mapana ya “baba” kwa babu wa ukoo wa kifalme.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: kama yote aliyoyafanya
  rationale: Huhifadhi wazo la kufuata mwenendo wote wa Yoashi bila kuongeza tafsiri ya sababu au nia.
- source_word: יוֹאָשׁ אָבִיו
  choice: Yoashi baba yake
  rationale: Yoashi ni uwakilishi wa kawaida wa Kiswahili wa jina יוֹאָשׁ; hapa “baba” humaanisha mzazi wake wa karibu.
theological_decisions:
- issue: Tathmini ya kifalme inayochanganya sifa na kikomo
  choice: Kauli ya kwamba Amazia alifanya yaliyo sawa imehifadhiwa kama tathmini chanya ya kweli, kisha imewekewa kikomo kwa kulinganishwa na Daudi na Yoashi.
  alternative: Kufanya mwanzo huo uwe sifa kamili bila kikomo, au kuufanya kuwa kauli tupu isiyo na sifa yoyote.
  rationale: Muundo wa Kiebrania unathibitisha mwenendo wake kwanza, lakini רַק na milinganisho inayofuata huonyesha kwamba hakufikia kiwango cha Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa simulizi, wa heshima, na unaoeleweka kwa msomaji wa kawaida. Nahau “machoni pa Yahwe” imehifadhiwa kwa sababu ni wazi katika Kiswahili na inaakisi kwa karibu lugha ya chanzo.
