reference: 2 Kings 14:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: sw
  text: Lakini hakuwaua wana wa wauaji[a], kama ilivyoandikwa katika Kitabu cha Sheria ya Musa, ambacho Yahwe aliamuru kwa maneno haya:[b] “Baba wasiuawe kwa sababu ya wana wao, wala wana wasiuawe kwa sababu ya baba zao; bali kila mtu atakufa kwa sababu ya dhambi yake mwenyewe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa wauaji.” Kiebrania kinasema hasa, “wana wa wale waliopiga”; katika muktadha huu inamaanisha wale walioua.
    reason: lexical_alternative
  - marker: b
    text: Maneno yanayofuata yamenukuliwa kutoka Kumbukumbu la Torati 24:16.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: wana wa wauaji
  rationale: “Wana” hufuata maana ya בְּנֵי kwa njia ya asili katika Kiswahili, na “wauaji” linaonyesha kwamba הַמַּכִּים hapa ni wale waliopiga na kuua. Tanbihi huhifadhi uwezekano wa kuelewa “wana” kwa maana pana ya watoto.
- source_word: לֹא הֵמִית
  choice: hakuwaua
  rationale: Hifili ya מות ina maana ya kusababisha kufa au kuua. Katika Kiswahili, “hakuwaua” ni wazi na ya kawaida katika simulizi hili la utekelezaji wa adhabu ya kifo, bila kutumia lugha nzito isiyo ya lazima.
- source_word: כַּכָּתוּב
  choice: kulingana na yaliyoandikwa
  rationale: Kirai hiki kinaonyesha kwamba tendo lake lilifuata sheria iliyoandikwa.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: katika Kitabu cha Sheria ya Musa
  rationale: Hili ni tamko la kawaida na linalotambulika, huku likihifadhi vipengele vya “kitabu” na “sheria” katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לֹא יוּמְתוּ
  choice: wasiuawe
  rationale: Muundo huu unaonyesha katazo la kisheria la kuwaua watu kama adhabu, si taarifa ya kawaida tu kwamba hawatakufa.
- source_word: אָבוֹת ... בָּנִים
  choice: baba ... wana
  rationale: Maneno haya yanadumisha uhusiano wa kifamilia na umbo la kiume lililo katika Kiebrania kwa lugha ya kawaida ya Kiswahili.
- source_word: עַל
  choice: kwa sababu ya
  rationale: Katika muktadha huu wa sheria, kihusishi kinaonyesha msingi wa adhabu—mtu kuuawa kwa sababu ya kosa la mwingine.
- source_word: כִּי אִם
  choice: bali
  rationale: “Bali” linaingiza kanuni tofauti inayofuata baada ya makatazo mawili.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Kirai hiki kinaonyesha maana ya kugawa wajibu kwa kila mmoja. “Mtu” ndilo neno la kawaida la Kiswahili kwa mwanadamu binafsi na haliondoi maana ya Kiebrania.
- source_word: בְּחֶטְאוֹ
  choice: kwa sababu ya dhambi yake mwenyewe
  rationale: “Kwa sababu ya” linaonyesha msingi wa kifo, na “yake mwenyewe” linaweka wazi kiambishi cha umilikaji na tofauti na kuadhibiwa kwa dhambi ya mwingine.
- source_word: יָמוּת
  choice: atakufa
  rationale: Kitenzi cha mwisho ni katika Qal na humaanisha “kufa,” tofauti na miundo ya awali inayomaanisha “kuuawa”; tafsiri inadumisha tofauti hiyo.
theological_decisions:
- issue: Wajibu binafsi dhidi ya wajibu wa kifamilia katika sheria ya agano
  choice: Aya inaweka kanuni ya kisheria kwamba baba hawapaswi kuuawa kwa sababu ya wana wao, wala wana kwa sababu ya baba zao; kila mmoja anakufa kwa dhambi yake mwenyewe.
  alternative: Kuielewa kama kukataa kwa ujumla matokeo yote ya kijamii au ya kifamilia yanayotokana na dhambi.
  rationale: Maneno ya aya yanahusu hukumu ya kifo na hatia binafsi. Tafsiri haipanui dai hilo hadi kukana kwamba mahali pengine Maandiko yanaonyesha dhambi ikiwa na matokeo kwa jamii au familia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Wasiuawe” linahifadhi sauti ya katazo la kisheria, huku “atakufa” likidumisha badiliko la kitenzi katika sehemu ya mwisho. Alama zote za tanbihi zimewekwa katika matini kuu.
