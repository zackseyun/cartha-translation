base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: sw
  text: Lakini Amazia hakukubali kusikia[a]. Ndipo Yehoashi, mfalme wa Israeli, akapanda; naye pamoja na Amazia, mfalme wa Yuda, wakakutana uso kwa uso[b] huko Beth-shemeshi, mji wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hakuzingatia” au “hakutii.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikia na kuitikia kwa vitendo, si kusikia sauti tu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wakaonana nyuso,” nahau inayomaanisha kukabiliana moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hakusikia
  rationale: Katika muktadha huu kitenzi kinamaanisha kusikia kwa kuitikia, yaani kuzingatia onyo, si kupokea sauti tu. Tanbihi inaweka wazi maana hiyo bila kuifanya moja kwa moja kuwa ‘kutii,’ ambayo ingeweza kuwa kali mno.
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Huhifadhi kitenzi cha kawaida cha Kiebrania ‘kupanda/kwenda juu.’ Muktadha unaashiria mwendo wa kijeshi, lakini si lazima kuongeza ‘akaandamana na jeshi’ katika matini.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: wakakutana uso kwa uso
  rationale: Ni Kiswahili cha kawaida kinachowasilisha nahau ya Kiebrania, kihalisi ‘wakaonana nyuso,’ na kuonyesha mkabiliano wa moja kwa moja.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-shemeshi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa kuwa ‘Nyumba ya Jua’; umbo hili linaendana na matamshi na tahajia ya kawaida ya majina ya kibiblia katika Kiswahili.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: mji ulio mali ya Yuda
  rationale: Huonyesha uhusiano wa kimamlaka au kimiliki na Yuda, badala ya kusema tu kwamba mji ulikuwa ndani ya eneo hilo.
- source_word: וְלֹא
  choice: Lakini
  rationale: Kiunganishi kina kazi ya kuonyesha tofauti na onyo lililotangulia, hivyo ‘Lakini’ ni cha asili na sahihi katika mtiririko wa Kiswahili.
