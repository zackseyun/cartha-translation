  text: וַ/יִּשְׁלַ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: sw
  text: Ndipo Yehoashi mfalme wa Israeli akatuma ujumbe kwa Amazia mfalme wa Yuda, akisema, “Kichaka cha miiba[a] kilichokuwa Lebanoni kilituma ujumbe kwa mwerezi uliokuwa Lebanoni, kikisema, ‘Mtoe binti yako kwa mwanangu awe mke wa mwanangu.’ Na mnyama wa porini[b] aliyekuwa Lebanoni akapita na kukanyaga kichaka hicho cha miiba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbigili” au “mmea wa miiba”; neno la Kiebrania hapa hutaja mmea wenye miiba.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno moja moja, “mnyama wa shambani,” yaani, mnyama wa porini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo ... akatuma ujumbe
  rationale: Waw-consecutive inaendeleza simulizi; “ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida, na “kutuma ujumbe kwa” hueleza kwa ufasaha kitendo cha mfalme kuwasiliana na mfalme mwingine.
- source_word: לֵאמֹר
  choice: akisema / kikisema
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kuanzisha maneno ya moja kwa moja, huku marudio ya Kiebrania yakihifadhiwa.
- source_word: הַחוֹחַ
  choice: kichaka cha miiba
  rationale: Neno חוֹחַ hutaja mmea wenye miiba bila kubainisha spishi; “kichaka cha miiba” huhifadhi picha ya mmea mdogo na dhaifu unaotofautishwa na mwerezi.
- source_word: הָאֶרֶז
  choice: mwerezi
  rationale: Ni tafsiri ya kawaida ya אֶרֶז na huhifadhi utofauti wa kimfano kati ya kichaka cha miiba na mti mkubwa wenye fahari.
- source_word: בַּלְּבָנוֹן
  choice: Lebanoni
  rationale: Mahali limetafsiriwa kwa namna ya kawaida ya Kiswahili, na marudio yake yamehifadhiwa kwa sababu ya athari ya kimtindo ya Kiebrania.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Mtoe binti yako kwa mwanangu awe mke wake
  rationale: Huhifadhi ombi la baba kumpa mwanawe binti katika ndoa, kwa Kiswahili kinachoeleweka na chenye hadhi.
- source_word: חַיַּת הַשָּׂדֶה
  choice: mnyama wa porini
  rationale: Kirai halisi ni “mnyama wa shambani/uwandani,” lakini katika muktadha humaanisha mnyama asiye wa kufugwa; “mnyama wa porini” ni cha asili na hakibainishi spishi.
- source_word: וַתַּעֲבֹר
  choice: akapita
  rationale: Huwakilisha mwendo wa mnyama uliotangulia kukanyagwa kwa kichaka bila kuongeza kwamba alikusudia kufanya hivyo.
- source_word: וַתִּרְמֹס
  choice: kukanyaga
  rationale: Kitenzi רמס humaanisha kukanyaga au kuponda kwa miguu; “kukanyaga” ni kifupi, wazi, na chenye picha hai.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mfano, marudio ya Lebanoni, na ulinganisho kati ya kichaka cha miiba na mwerezi vimehifadhiwa. Kiunganishi “Kisha” kinaendeleza tukio bila kuingiza nguvu ya upinzani ambayo haipo wazi katika Kiebrania.
