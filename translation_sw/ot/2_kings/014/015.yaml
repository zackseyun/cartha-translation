base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Yehoashi, yote aliyoyafanya, na nguvu zake, na jinsi alivyopigana na Amazia mfalme wa Yuda[a]—je, hayakuandikwa katika Kitabu cha Kumbukumbu za Wafalme wa Israeli?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alivyopigana dhidi ya Amazia mfalme wa Yuda.” Kihusishi cha Kiebrania ni “na,” lakini katika muktadha huu wa vita kinaweza kutafsiriwa wazi zaidi kuwa upinzani wa kivita.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika kitabu cha kumbukumbu za matukio ya wafalme wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika fomula ya muhtasari wa utawala katika Wafalme, דִּבְרֵי humaanisha mambo au matendo ya mfalme, si maneno yake tu; “matendo mengine” ni Kiswahili cha kawaida na wazi.
- source_word: יְהוֹאָשׁ
  choice: Yehoashi
  rationale: Huwakilisha umbo kamili la jina la Kiebrania יְהוֹאָשׁ na kulitofautisha na umbo fupi Yoashi.
- source_word: אֲשֶׁר עָשָׂה
  choice: yote aliyoyafanya
  rationale: Kifungu hiki kimetafsiriwa wazi ili kutokipoteza, huku “yote” ikitoa mtiririko wa asili katika orodha ya matendo ya mfalme.
- source_word: וּגְבוּרָתוֹ
  choice: ushujaa wake
  rationale: גְּבוּרָה hapa hujumuisha uwezo, nguvu, na uhodari wa kifalme, hasa vitani; “ushujaa” ni neno la kawaida lenye upana unaofaa.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: na jinsi alivyopigana na
  rationale: “Kupigana na” ni Kiswahili cha kawaida kwa mapambano dhidi ya mtu na pia huhifadhi kwa karibu kihusishi עִם, ambacho kimsingi ni “na/pamoja na.”
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Huhifadhi swali la balagha la fomula ya Kiebrania; upatanisho wa ngeli unarejelea “matendo.”
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: katika Kitabu cha Kumbukumbu za Wafalme wa Israeli
  rationale: Hutoa maana ya hati ya kifalme ya matukio ya kila mwaka kwa Kiswahili kinachoeleweka, bila kuichanganya moja kwa moja na kitabu cha Biblia kinachoitwa Mambo ya Nyakati.
