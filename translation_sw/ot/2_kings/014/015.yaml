translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na muundo wa muhtasari wa kifalme vimehifadhiwa; tanbihi zinaeleza badala ya kuondoa utata halisi wa עִם na wa jina la hati ya kifalme.
