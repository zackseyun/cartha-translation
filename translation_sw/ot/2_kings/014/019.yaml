  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: sw
  text: Wakamfanyia njama huko Yerusalemu, naye akakimbilia Lakishi; wakatuma watu wamfuate[a] hadi Lakishi, nao wakamuua huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “wakatuma baada yake,” bila kutaja waliotumwa.
