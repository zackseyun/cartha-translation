lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: Wakamfanyia njama
  rationale: Muundo huu wenye kitenzi na nomino ya mzizi mmoja ni nahau ya kupanga njama ya kisiasa dhidi ya mtu. “Kumfanyia njama” ni Kiswahili cha kawaida na kinabaki na maana hiyo ya uhasama.
- source_word: בִּירוּשָׁלִַם
  choice: huko Yerusalemu
  rationale: Kihusishi kinaonyesha mahali; “huko” hufanya simulizi lisikike la kawaida bila kubadili maana.
- source_word: וַיָּנָס
  choice: akakimbilia
  rationale: Kitenzi נוס humaanisha kukimbia ili kujiokoa. Pamoja na mahali anapoelekea, “akakimbilia Lakishi” ni usemi wa asili wa Kiswahili.
- source_word: לָכִישָׁה
  choice: Lakishi / hadi Lakishi
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea mji. “Lakishi” ni umbo la jina linalofaa katika Kiswahili, na “hadi” katika tukio la pili huonyesha walimfuata mpaka huko.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: Wakatuma watu wamfuate
  rationale: Kihalisi ni “wakatuma nyuma yake,” bila kutaja waliotumwa. Kiswahili cha kawaida huhitaji kukamilisha wazo; “watu” limetolewa kama jambo linalodokezwa, huku tanbihi ikihifadhi usemi halisi na utata wake.
- source_word: וַיְמִתֻהוּ
  choice: wakamuua
  rationale: Hili ni umbo la kusababisha la מות, yaani kumsababisha afe au kumuua. “Wakamuua” ni la moja kwa moja, la asili, na linaonyesha tendo la kukusudia.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki kinarejelea Lakishi, mahali alikouawa.
