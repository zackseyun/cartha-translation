  text: אָ֣ז שָׁלַ֤ח אֲמַצְיָה֙ מַלְאָכִ֔ים אֶל יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לְכָ֖/ה נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: sw
  text: Ndipo Amazia akatuma wajumbe kwa Yehoashi mwana wa Yehoahazi, mwana wa Yehu, mfalme wa Israeli, akisema, “Njoo, tukutane uso kwa uso.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “tuonane nyuso.” Hapa msemo wa Kiebrania unamaanisha kukutana moja kwa moja, katika muktadha huu kwa mapambano ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kiunganishi cha kawaida cha masimulizi kinachoonyesha tukio linalofuata.
- source_word: שָׁלַח
  choice: akatuma
  rationale: Kitenzi cha kawaida na cha asili katika simulizi kwa tendo la kuwatuma watu.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa kupeleka ujumbe, si malaika.
- source_word: יְהוֹאָשׁ
  choice: Yehoashi
  rationale: Unukuzi wa Kiswahili unaoakisi kwa karibu umbo la jina la Kiebrania na kulitofautisha na Yoashi.
- source_word: בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: mwana wa Yehoahazi, mwana wa Yehu
  rationale: Mlolongo wa ukoo umehifadhiwa kama ulivyo katika Kiebrania.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya cheo cha kifalme.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi muundo wa Kiebrania unaotanguliza maneno ya moja kwa moja.
- source_word: לְכָה
  choice: Njoo
  rationale: Amri hii ni mwito au changamoto inayoelekezwa kwa mhusika mwingine; ‘Njoo’ ni ya asili katika Kiswahili.
- source_word: נִתְרָאֶה פָנִים
  choice: tukutane uso kwa uso
  rationale: Huhifadhi picha ya ‘nyuso’ kwa Kiswahili cha asili bila kuweka ‘vitani’ moja kwa moja ndani ya matini, ingawa muktadha unaonyesha changamoto ya kijeshi.
