base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: sw
  text: Yeroboamu akalala na baba zake[a], pamoja na wafalme wa Israeli[b], na Zekaria mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akalala pamoja na baba zake”; hii ni nahau ya kawaida ya Kiebrania inayotaja kifo cha mfalme.
    reason: lexical_alternative
  - marker: b
    text: Au, “miongoni mwa wafalme wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Inahifadhi taswira ya fomula ya kawaida ya Kiebrania kuhusu kifo cha mfalme, badala ya kuifafanua moja kwa moja kuwa ‘alikufa’.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na babu zake
  rationale: ‘Babu zake’ ni usemi wa kawaida wa Kiswahili unaoweza kuwajumuisha waliomtangulia katika ukoo, na hapa unahifadhi fomula ya kifalme ya Kiebrania.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: pamoja na wafalme wa Israeli
  rationale: Inahifadhi kurudiwa kwa עִם na uhusiano wake na wafalme wengine wa Israeli bila kuamua kimyakimya ikiwa maana mahsusi ni kuzikwa miongoni mwao.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Ni tafsiri fupi na ya kawaida ya kitenzi cha kutawala kama mfalme katika taarifa za urithi wa ufalme.
- source_word: זְכַרְיָה
  choice: Zekaria
  rationale: Hili ndilo umbo la jina lililozoeleka katika Biblia za Kiswahili.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya uhusiano wa kifamilia.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa kurithi ufalme, usemi huu unaonyesha wazi kwamba Zekaria alimrithi Yeroboamu.
theological_decisions:
- issue: Taswira ya kulala katika fomula ya kifo
  choice: akalala pamoja na babu zake
  alternative: alikufa na kuungana na babu zake
  rationale: Tafsiri inahifadhi nahau ya chanzo bila kuingiza maelezo ya kitheolojia kuhusu hali ya wafu; tanbihi inaeleza matumizi yake ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa taarifa ya kifalme umehifadhiwa kwa ufupi; ‘akalala’ hudumisha nahau ya Kiebrania, huku tanbihi zikihifadhi uwezekano wa tafsiri nyingine.
