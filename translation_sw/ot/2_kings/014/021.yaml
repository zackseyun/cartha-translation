  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: sw
  text: Ndipo watu wote wa Yuda wakamchukua Azaria—naye alikuwa na umri wa miaka kumi na sita—wakamfanya kuwa mfalme mahali pa baba yake, Amazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahali pengine Azaria anaitwa pia Uzia; maandishi ya Kiebrania hapa yanasema Azaria.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakamchukua
  rationale: Kitenzi לקח kwa msingi humaanisha ‘chukua.’ Katika muktadha huu wa kumweka mfalme, ‘wakamchukua’ kinahifadhi tendo lililoelezwa bila kuongeza wazo la kuchagua au kutawaza kwa sherehe.
- source_word: כָּל עַם יְהוּדָה
  choice: watu wote wa Yuda
  rationale: Huhifadhi wazi maana ya jamii nzima ya watu wa Yuda kama wahusika wa tendo, badala ya kutumia ‘Yuda yote,’ ambayo inaweza kueleweka kama eneo.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Jina katika maandishi ya Kiebrania ya aya hii ni Azaria; jina jingine, Uzia, linaelezwa katika tanbihi.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: naye alikuwa na umri wa miaka kumi na sita
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili unaohifadhi taarifa ya umri yenye nguvu ya maelezo ya pembeni.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: wakamfanya kuwa mfalme
  rationale: Hifili ya מלך humaanisha kusababisha mtu atawale, yaani kumfanya mfalme. Tafsiri hii haiongezi sherehe ya kumvika taji wala kupunguza tendo kuwa tangazo tu.
- source_word: תַּחַת אָבִיו
  choice: mahali pa baba yake
  rationale: Katika muktadha wa urithi wa kifalme, תחת huonyesha kuchukua nafasi ya mtangulizi; ‘mahali pa’ huwasilisha hilo bila kuwa taarifa ya wakati tu.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mtu huyo.
