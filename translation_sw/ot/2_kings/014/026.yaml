  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: sw
  text: Kwa maana Yahweh aliona kwamba dhiki ya Israeli ilikuwa kali sana[a], wala hapakuwa na aliyefungwa wala aliyeachwa huru[b], wala hapakuwa na msaidizi kwa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilikuwa chungu sana” au “ilikuwa nzito sana.” Kauli ya Kiebrania hapa ni ngumu, lakini kwa wazi inasisitiza ukubwa wa dhiki ya Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, hii ni nahau ambayo maana yake sahihi haieleweki kwa uhakika. Huenda ikamaanisha kwamba hakubaki mtu yeyote wa kusaidia, au kwamba hakuna yeyote—wa hali yoyote—aliyepatikana kusaidia.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania.
- source_word: עֳנִי
  choice: mateso
  rationale: Katika muktadha wa taifa la Israeli, neno hili linaonyesha hali pana ya dhiki na taabu, si umaskini wa kiuchumi pekee.
- source_word: מֹרֶה מְאֹד
  choice: yalikuwa machungu sana
  rationale: Tafsiri hii inaonyesha uzito mkubwa wa mateso huku ikihifadhi taswira ya uchungu; kwa kuwa neno la Kiebrania hapa ni gumu, uwezekano mwingine umetajwa katika tanbihi.
- source_word: אֶפֶס
  choice: hapakuwa na
  rationale: Linaonyesha kutokuwapo kabisa kwa watu wanaotajwa katika jozi inayofuata.
- source_word: עָצוּר
  choice: aliyefungwa
  rationale: Linabaki karibu na maana ya msingi ya mtu aliyezuiliwa au kufungwa katika nahau hii ya Kiebrania.
- source_word: עָזוּב
  choice: aliyeachwa huru
  rationale: Linatolewa kama upande wa pili wa jozi inayokinzana na ‘aliyefungwa,’ bila kudai kwamba maana kamili ya nahau hiyo haina utata.
- source_word: עֹזֵר
  choice: msaidizi
  rationale: Ni tafsiri ya moja kwa moja ya neno linalomaanisha mtu anayetoa msaada.
theological_decisions:
- issue: Maana ya nahau עָצוּר וְעָזוּב
  choice: aliyefungwa au aliyeachwa huru
  alternative: hakubaki mtu yeyote, wa hali yoyote
  rationale: Maandishi makuu yanahifadhi jozi ya Kiebrania na utata wake, huku tanbihi ikieleza kwamba huenda nahau hiyo ikamaanisha kutokuwapo kabisa kwa mtu wa kusaidia.
- issue: Maana ya מֹרֶה מְאֹד
  choice: yalikuwa machungu sana
  alternative: yalikuwa makali sana; yalikuwa mazito sana
  rationale: Kauli ya Kiebrania ni ngumu, lakini kwa wazi inasisitiza ukubwa wa mateso ya Israeli; tanbihi inahifadhi tafsiri nyingine zinazowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na wenye heshima. Muundo wa jozi ya Kiebrania umehifadhiwa katika maandishi makuu, na utata wake umeelezwa kwa lugha rahisi katika tanbihi.
