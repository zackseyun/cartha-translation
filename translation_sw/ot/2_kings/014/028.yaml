source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Yeroboamu, na yote aliyofanya, na uhodari wake, jinsi alivyopigana vita na jinsi alivyozirejesha Dameski na Hamathi kwa Yuda katika Israeli[a]—je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa Yuda katika Israeli.” Kifungu hiki ni kigumu. Huenda kinamaanisha maeneo ambayo Yeroboamu aliyoyarejeshea Israeli na ambayo hapo awali yalikuwa ya Yuda, au huenda kinahifadhi jina la zamani la kisiasa au kijiografia. Tafsiri kuu inafuata maneno ya Kiebrania kwa karibu bila kuondoa utata wake.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine ya
  rationale: Hii ni fomula ya kawaida ya muhtasari wa utawala katika Wafalme. Ingawa דִּבְרֵי kihalisi inaweza kumaanisha maneno au mambo, hapa inahusu matendo na matukio ya utawala.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyofanya
  rationale: Tafsiri ya moja kwa moja inayohifadhi upana wa maana ya עשה.
- source_word: וּגְבוּרָתוֹ
  choice: na uhodari wake
  rationale: Katika muktadha unaofuatiwa na kupigana vita, גְּבוּרָה inaonyesha hasa uwezo na ushujaa wa kijeshi; “uhodari” ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: אֲשֶׁר נִלְחָם
  choice: jinsi alivyopigana vita
  rationale: Muundo huu wa Kiswahili unaonyesha nguvu ya ufafanuzi ya אֲשֶׁר na unaunganika kwa kawaida na “uhodari wake.”
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: na jinsi alivyozirejesha
  rationale: הֵשִׁיב humaanisha kurudisha au kurejesha; kiambishi “-zi-” kinarejelea sehemu mbili zilizotajwa, Dameski na Hamathi.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: Dameski na Hamathi
  rationale: Majina ya mahali yametolewa kwa maumbo yanayotumika kwa kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: kwa Yuda katika Israeli
  rationale: Kifungu cha Kiebrania ni kigumu na chenye maana isiyo wazi. Tafsiri hii inafuata mpangilio wake kwa karibu bila kulazimisha ufafanuzi wa kihistoria au kijiografia.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Huhifadhi swali la balagha la fomula ya kufunga simulizi; ngeli ya wingi inarejelea matendo na mambo yaliyotajwa.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: katika Kitabu cha Mambo ya Nyakati
  rationale: Hili ni jina la asili na linaloeleweka la kumbukumbu rasmi katika Kiswahili; “katika” hutoa maana ya kuandikwa ndani ya kitabu.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: Hutoa kwa kawaida uhusiano uliomo katika jina la kumbukumbu hiyo.
theological_decisions:
- issue: Maana ya לִיהוּדָה בְּיִשְׂרָאֵל
  choice: kwa Yuda katika Israeli
  alternative: kwa Israeli, maeneo yaliyokuwa ya Yuda; au kwa Yuda iliyokuwa katika Israeli
  rationale: Maandishi yenyewe yamebanwa na hayabainishi wazi uhusiano wa kisiasa au kijiografia. Tafsiri kuu haichagui mojawapo ya maelezo yanayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mtindo rasmi wa muhtasari wa kifalme, huku swali la mwisho likibaki la kawaida na linaloeleweka.
