base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: sw
  text: Katika mwaka wa pili wa utawala wa Yoashi mwana wa Yehoahazi, mfalme wa Israeli, Amazia mwana wa Yoashi alianza kutawala kama mfalme wa Yuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: Katika mwaka wa pili wa utawala
  rationale: Muundo huu ni fomula ya tarehe ya kifalme. Ingawa שְׁתַּיִם kimsingi ni namba ya kuhesabu ‘mbili,’ hapa ina maana ya mpangilio, ‘wa pili.’ Kuongeza ‘wa utawala’ kunafanya uhusiano na miaka ya mfalme uwe wazi na wa kawaida katika Kiswahili.
- source_word: לְ/יוֹאָשׁ
  choice: wa Yoashi
  rationale: Katika fomula hii לְ humtaja mfalme ambaye miaka ya utawala wake inahesabiwa; Kiswahili cha kawaida hutumia ‘wa.’
- source_word: בֶּן יוֹאָחָז
  choice: mwana wa Yehoahazi
  rationale: Ni jina la ukoo linalomtambulisha Yoashi kwa baba yake.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Muundo wa nomino katika Kiebrania unaonyesha cheo cha kifalme na eneo lake.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika taarifa hii ya wakati, kitenzi kinaashiria kuanza kwa utawala wa Amazia. ‘Alianza kutawala’ ni wazi na cha asili, bila kudokeza kwamba tukio la kutawazwa ndilo hasa linalosisitizwa.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶן יוֹאָשׁ
  choice: mwana wa Yoashi
  rationale: Ni jina la ukoo linalomtambulisha Amazia kwa baba yake.
- source_word: מֶלֶךְ יְהוּדָה
  choice: kutawala Yuda
  rationale: 'Cheo na eneo vimeunganishwa kwa kawaida na kitenzi: Amazia alianza kuwa mfalme wa Yuda, yaani alianza kuitawala Yuda.'
