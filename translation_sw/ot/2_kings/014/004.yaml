  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: sw
  text: Hata hivyo, mahali pa juu[a] hapakuondolewa; watu waliendelea kutoa dhabihu na kufukiza uvumba katika mahali pa juu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vituo vya ibada.” Neno la Kiebrania hurejelea mahali pa ibada za kienyeji, mara nyingi kwenye miinuko.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye mahali pa juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hata hivyo
  rationale: Neno hili linaweka mpaka au tahadhari juu ya tathmini iliyotangulia ya mfalme; “Hata hivyo” huonyesha ulinganifu huo kwa Kiswahili cha kawaida.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: mahali pa juu pa ibada / katika mahali hapo pa juu pa ibada
  rationale: בָּמוֹת ni vituo vya ibada vya mahali mbalimbali, ambavyo mara nyingi vilikuwa kwenye miinuko. Kauli hii inadumisha istilahi ya kihistoria bila kuviongezea moja kwa moja sifa ya kuwa halali au haramu.
- source_word: לֹא סָרוּ
  choice: hapakuondolewa
  rationale: Kwa kuwa בָּמוֹת ndiyo kiima, kitenzi kina maana ya kwamba vituo hivyo havikuondoshwa au kukomeshwa.
- source_word: עוֹד
  choice: waliendelea
  rationale: Huonyesha kwamba desturi hiyo iliendelea kuwapo; kwa Kiswahili maana hii inaunganishwa kwa kawaida na vitenzi vinavyofuata.
- source_word: הָעָם
  choice: watu
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya kijumla inayowarejelea wananchi.
- source_word: מְזַבְּחִים
  choice: kutoa dhabihu
  rationale: Hali ya kushiriki inaonyesha tendo la kawaida lililoendelea, ambalo limewasilishwa kwa “waliendelea kutoa dhabihu.”
- source_word: וּמְקַטְּרִים
  choice: na kufukiza uvumba
  rationale: Katika muktadha wa ibada, קטר mara nyingi humaanisha kufukiza uvumba, ingawa inaweza pia kurejelea kuteketeza sadaka mpaka moshi wake upande.
theological_decisions:
- issue: Tathmini ya ibada katika mahali pa juu
  choice: Kutumia maelezo ya kihistoria “mahali pa juu pa ibada” bila kukiita moja kwa moja kituo cha ibada kisichoruhusiwa
  alternative: vituo vya ibada visivyoruhusiwa
  rationale: Muktadha mpana unaonyesha kutokubalika kwa ibada hiyo, lakini mstari wenyewe unasema tu kwamba mahali hapo hapakuondolewa na kwamba watu waliendelea kuabudu huko. Tafsiri haipaswi kuongeza hukumu isiyotamkwa wazi katika mstari.
- issue: Maana ya קטר
  choice: kufukiza uvumba, huku maana pana ikiwekwa katika tanbihi
  alternative: kuteketeza sadaka ili moshi wake upande
  rationale: “Kufukiza uvumba” ndiyo maana inayowezekana zaidi katika muktadha huu, lakini tanbihi inahifadhi upana wa kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Mahali” halibadiliki wazi kwa umoja na wingi; muktadha na tanbihi zinaonyesha kwamba neno la Kiebrania ni la wingi. Muundo “waliendelea kutoa… na kufukiza…” unahifadhi hali ya matendo ya kawaida yaliyoendelea.
