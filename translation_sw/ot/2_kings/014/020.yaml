  text: Wakambeba juu ya farasi[a], naye akazikwa Yerusalemu pamoja na baba zake[b], katika Mji wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa farasi.” Maneno ya Kiebrania, kwa tafsiri ya moja kwa moja, ni “juu ya farasi”; huenda yakarejelea namna mwili wake ulivyosafirishwa.
    reason: lexical_alternative
  - marker: b
