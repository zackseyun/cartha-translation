lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: Wakamchukua
  rationale: Kitenzi נשׂא hapa kina maana ya kubeba au kuchukua; “wakamchukua” ni simulizi la kawaida la Kiswahili na linafaa kwa kusafirisha mwili uliotajwa katika muktadha.
- source_word: עַל הַסּוּסִים
  choice: juu ya farasi
  rationale: Huhifadhi kwa karibu kihusishi עַל (“juu ya”) na wingi “farasi,” bila kuamua kimya-kimya namna hasa mwili ulivyosafirishwa.
- source_word: וַיִּקָּבֵר
  choice: naye akazikwa
  rationale: Huhifadhi kauli ya kutendwa ya umbo la Kiebrania na kuendeleza mtiririko wa simulizi kwa Kiswahili cha asili.
- source_word: בִּירוּשָׁלַםִ
  choice: Yerusalemu
  rationale: Jina la mahali linalotumika kwa kawaida katika Kiswahili; muktadha wa kitenzi “akazikwa” tayari unaonyesha mahali.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Huhifadhi tamko la jadi la maziko na mvumo wake wa kifalme na kifamilia, badala ya kulifasiri moja kwa moja kuwa “mababu zake.”
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Tafsiri ya kawaida ya jina la eneo; “katika” linaonyesha mahali maalumu ndani ya Yerusalemu.
