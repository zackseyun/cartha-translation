  terminology: “Kutawala” na “Mama yake aliitwa” zinafaa. “Yehoadini” hufuata umbo la jina katika maandishi ya Kiebrania yaliyotolewa; tanbihi huhifadhi umbo la kimapokeo “Yehoadani.”
