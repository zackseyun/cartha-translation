base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: sw
  text: Alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, akatawala miaka ishirini na tisa Yerusalemu. Mama yake aliitwa Yehoadini[a], kutoka Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika mapokeo mengine jina hili huandikwa Yehoadani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; Kiswahili cha asili hutumia ‘alikuwa na umri wa miaka...’ badala ya tafsiri ya neno kwa neno.
- source_word: הָיָה בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Katika taarifa za kifalme, kirai hiki huonyesha umri wa mtu wakati alipoanza kuwa mfalme; ‘alipoanza kutawala’ ni wazi na ya kawaida kwa Kiswahili.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: akatawala miaka ishirini na tisa
  rationale: Kitenzi מָלַךְ katika taarifa hii kinaonyesha muda wa utawala wake.
- source_word: בִּירוּשָׁלָם
  choice: huko Yerusalemu
  rationale: Kiambishi בְּ kina maana ya mahali; ‘huko’ huunganisha kwa kawaida mahali pa utawala katika Kiswahili.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Huwasilisha kwa Kiswahili cha kawaida fomula ya Kiebrania inayosema kihalisi ‘na jina la mama yake lilikuwa.’
- source_word: יהועדין
  choice: Yehoadini
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa Kiswahili, huku umbo la konsonanti na matamshi ya maandishi ya Kiebrania yaliyotolewa yakifuatwa.
- source_word: מִן יְרוּשָׁלָם
  choice: alikuwa mwenyeji wa Yerusalemu
  rationale: מִן huonyesha alikotoka; ‘mwenyeji wa Yerusalemu’ ni Kiswahili cha asili kinachohifadhi maana ya asili au mahali alikotoka.
