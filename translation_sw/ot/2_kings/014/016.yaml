  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: sw
  text: Yehoashi akalala pamoja na mababu zake, akazikwa Samaria pamoja na wafalme wa Israeli, na Yeroboamu mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Katika taarifa za kifalme, kitenzi hiki pamoja na ‘mababu zake’ ni nahau ya kufa. ‘Akalala’ huhifadhi taswira na mtindo unaojirudia wa Kiebrania bila kuufafanua moja kwa moja kuwa ‘akafa’.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na mababu zake
  rationale: ‘Mababu zake’ ni Kiswahili cha kawaida kinachoonyesha vizazi vilivyomtangulia na huepuka maana finyu ya ‘baba zake’.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Huhifadhi hali tendwa ya umbo la Kiebrania na kuendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kiambishi ב ni cha mahali; ‘huko Samaria’ ni usemi wa asili unaorejelea mahali panapojulikana katika simulizi.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: pamoja na wafalme wa Israeli
  rationale: ‘Pamoja na’ huakisi עִם na kuonyesha kuzikwa kwa kushirikishwa na wafalme waliomtangulia, bila kuongeza maelezo yasiyomo.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya urithi wa ufalme, ‘akatawala’ ni ya kawaida na huonyesha utendaji wa kifalme; muktadha unaweka wazi kwamba Yeroboamu alikuwa mfalme.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Huhifadhi nahau ya kuchukua nafasi ya mtangulizi kwa karibu zaidi kuliko ‘baada yake,’ ambayo ingesisitiza wakati pekee.
