  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: sw
  text: Amazia mwana wa Yoashi[a], mfalme wa Yuda, aliishi miaka kumi na mitano baada ya kifo cha Yehoashi mwana wa Yehoahazi, mfalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Majina “Yoashi” na “Yehoashi” yanaakisi tahajia mbili tofauti za Kiebrania katika mstari huu. Yametofautishwa ili kuepuka kuchanganya mfalme wa Yuda na mfalme wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: aliishi
  rationale: Kitenzi hiki kinaeleza kwamba Amazia aliendelea kuwa hai kwa muda uliotajwa baada ya kifo cha mfalme mwingine. “Aliishi” ni tafsiri ya moja kwa moja na ya kawaida bila kuongeza wazo la kunusurika.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: בֶן
  choice: mwana wa
  rationale: Hapa neno hilo linaonyesha uhusiano wa moja kwa moja wa baba na mwana katika utambulisho wa kifalme.
- source_word: יוֹאָשׁ
  choice: Yoashi
  rationale: Tahajia hii inawakilisha jina la baba yake Amazia na kulidumisha tofauti na יְהוֹאָשׁ, jina la mfalme wa Israeli katika mstari huu.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Tafsiri ya kawaida ya muundo unaotaja cheo cha Amazia na ufalme wake.
- source_word: אַחֲרֵי מוֹת
  choice: baada ya kifo cha
  rationale: Inahifadhi muundo wa nomino wa Kiebrania na kueleza kwa kawaida wakati unaohusika.
- source_word: יְהוֹאָשׁ
  choice: Yehoashi
  rationale: Tahajia hii inawakilisha umbo tofauti la Kiebrania na humtofautisha mfalme wa Israeli na Yoashi, baba yake Amazia.
- source_word: יְהוֹאָחָז
  choice: Yehoahazi
  rationale: Unukuzi wa kawaida na unaoeleweka wa jina la Kiebrania katika Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Tafsiri ya moja kwa moja ya cheo na ufalme unaotajwa.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: miaka kumi na mitano
  rationale: Namna ya kawaida ya Kiswahili ya kutaja muda wa miaka kumi na mitano.
