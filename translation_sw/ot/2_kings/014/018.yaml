base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Amazia, je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kumbukumbu za wafalme wa Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika muhtasari huu wa kifalme, דִּבְרֵי humaanisha matendo na shughuli za mfalme, si maneno yake tu; יֶתֶר huonyesha yaliyobaki au mengine.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: Muundo huu ni swali la balagha linalotarajia jibu la ndiyo. Wakati wa hali timilifu katika Kiswahili unaonyesha kwamba matendo hayo yameandikwa na yanapatikana katika kumbukumbu.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi inaweza kumaanisha ‘juu ya,’ katika usemi huu wa kumbukumbu maana ya kawaida ni ‘katika kitabu.’
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Mambo ya Nyakati za Wafalme wa Yuda
  rationale: Hiki ni kichwa cha kumbukumbu za kifalme; ‘Mambo ya Nyakati’ ni tafsiri iliyo wazi na iliyozoeleka ya usemi wa Kiebrania.
