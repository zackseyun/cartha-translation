base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: sw
  text: Katika mwaka wa kumi na tano wa utawala wa Amazia mwana wa Yoashi, mfalme wa Yuda, Yeroboamu mwana wa Yoashi, mfalme wa Israeli, alianza kutawala katika Samaria, akatawala kwa miaka arobaini na mmoja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: Katika mwaka wa kumi na tano wa utawala
  rationale: Huu ni usemi wa kutaja mwaka wa kifalme; neno “utawala” linawekwa wazi kwa Kiswahili cha kawaida ili kuonyesha kuwa si umri wala kipindi cha miaka kumi na mitano.
- source_word: לַאֲמַצְיָהוּ
  choice: wa Amazia
  rationale: Katika fomula hii, ל huonyesha kwamba mwaka unahesabiwa kwa kurejelea utawala wa Amazia.
- source_word: בֶן יוֹאָשׁ
  choice: mwana wa Yoashi
  rationale: Ni muundo wa kawaida wa Kiebrania unaotaja baba wa mtu.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Muundo huu unatambulisha cheo cha Amazia na ufalme wake.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika taarifa za kupanda kwa mfalme, kitenzi hiki huashiria kuanza kwa utawala; tafsiri hii pia hukitofautisha na taarifa inayofuata ya muda wa utawala.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Muundo huu unatambulisha cheo cha Yeroboamu na ufalme wake.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: ב ni kiashiria cha mahali; “huko Samaria” ni usemi wa asili unaolitaja jiji kuu ambako alitawala.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: miaka arobaini na mmoja
  rationale: Hii ni idadi ya muda wa utawala; upatanisho wa kisarufi unafuata ngeli ya “miaka” katika Kiswahili sanifu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa taarifa ya kifalme umehifadhiwa, huku “wa utawala” ikiongezwa kwa uwazi wa maana na “alianza kutawala” ikitenganisha kupanda kwake kuwa mfalme na muda wa utawala wake.
