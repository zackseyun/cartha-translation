lexical_decisions:
- source_word: בָּנָה
  choice: aliujenga upya
  rationale: Kitenzi kwa msingi wake ni ‘alijenga,’ lakini katika muktadha wa mji uliokuwapo tayari, maana ya kuujenga upya ndiyo inayokusudiwa.
- source_word: אֵילַת
  choice: mji wa Elathi
  rationale: Jina la mahali limetoholewa kwa namna inayoeleweka katika Kiswahili; ‘mji wa’ huonyesha wazi kuwa ni mahali.
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: na kuurudisha kwa Yuda
  rationale: Huhifadhi maana ya kurejesha Elathi chini ya mamlaka au milki ya Yuda bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: שְׁכַב ... עִם אֲבֹתָיו
  choice: kulala pamoja na mababu zake
  rationale: Huhifadhi nahau ya Kiebrania kuhusu kifo, ambayo ni ya kawaida na yenye hadhi katika simulizi la kifalme.
theological_decisions:
- issue: Nahau ya kifo cha mfalme
  choice: kulala pamoja na mababu zake
  alternative: kufa na kuzikwa pamoja na mababu zake
  rationale: Matini inasema ‘kulala pamoja na mababu zake’; tafsiri haiongezi wazi habari ya kuzikwa wala kuondoa taswira ya asili.
- issue: Utambulisho wa ‘mfalme’
  choice: mfalme
  alternative: Amazia
  rationale: Kiebrania kinatumia cheo pekee katika aya hii; jina halijaongezwa ili kuhifadhi namna ya usemi na rejeo la muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida huku nahau ya kifalme ya Kiebrania ikihifadhiwa.
