base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: sw
  text: Ufalme ulipokuwa imara mikononi mwake, aliwaua watumishi wake waliokuwa wamemuua mfalme, baba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia kitenzi kilekile kwa tendo la Amazia na tendo la watumishi hao; kwa tafsiri ya neno kwa neno, ‘aliwapiga wale waliokuwa wamempiga’ baba yake. Katika muktadha huu maana yake ni kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ulipokuwa
  rationale: Muundo huu wa wakati unaingiza tukio linalofuata katika simulizi. Kiswahili cha asili hakihitaji kutafsiri וַיְהִי kando kwa maneno kama ‘ikawa kwamba’.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: Ufalme ulipokuwa imara mikononi mwake
  rationale: Huhifadhi taswira ya Kiebrania ya mamlaka kuwa ‘mkononi’ mwa mfalme huku ikionyesha kwamba utawala wake ulikuwa umeimarika na kuwa salama.
- source_word: וַיַּךְ
  choice: aliwaua
  rationale: Katika muktadha huu נכה inaonyesha kuwaua wauaji wa baba yake. ‘Aliwaua’ ni wazi na ya kawaida katika Kiswahili.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno hili linaweza kumaanisha watumishi au maafisa wa kifalme. ‘Watumishi wake’ ni la karibu na Kiebrania na linafaa katika mazingira ya ikulu.
- source_word: הַמַּכִּים
  choice: waliokuwa wamemuua
  rationale: Kitenzi kishirikishi kinawatambulisha watumishi kwa kitendo chao cha awali. Wakati timilifu ‘walikuwa wamemuua’ unaweka wazi mpangilio wa matukio.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: mfalme, baba yake
  rationale: Huhifadhi uhusiano wa viambatanisho katika Kiebrania na kueleza wazi kwamba mfalme aliyeuawa alikuwa baba yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘mikononi mwake’ umehifadhi taswira ya Kiebrania lakini unabaki wazi kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya sentensi kwa kuwa inaeleza urudiaji wa kitenzi katika vifungu vyote viwili.
