reference: 2 Kings 23:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: sw
  text: Naye mfalme akayanajisi mahali pa juu palipokuwa mbele ya Yerusalemu[a], upande wa kulia wa Mlima wa Uharibifu[d], ambako Solomoni, mfalme wa Israeli, alikuwa amejenga kwa ajili ya Ashtorethi, chukizo la Wasidoni, na kwa ajili ya Kemoshi, chukizo la Moabu, na kwa ajili ya Milkomu[c], chukizo la Waamoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mashariki mwa Yerusalemu.” Nahau ya Kiebrania inaweza kumaanisha mahali palipo mbele ya mji au upande unaoukabili.'
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema “Milkomu”; baadhi ya wasomaji huhusianisha mungu huyu na Moleki.
    reason: alternative_reading
  - marker: d
    text: 'Au: “kusini mwa Mlima wa Uharibifu,” ikiwa lugha ya mwelekeo inaeleweka kwa kutazama mashariki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: Ni istilahi ya kawaida ya kibiblia kwa maeneo ya ibada, mara nyingi ya sanamu; inadumisha maana ya kidini bila kuyafafanua tu kuwa madhabahu au mahekalu.
- source_word: עַל פְּנֵי יְרוּשָׁלַם
  choice: mbele ya Yerusalemu
  rationale: Inahifadhi kwa uwazi nahau ya Kiebrania ya kuwa mbele au kukabili mahali, bila kuifanya kwa lazima kuwa 'mashariki mwa Yerusalemu.'
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: upande wa kulia wa Mlima wa Uharibifu
  rationale: Inafuata maana ya msingi ya מִימִין, huku uwezekano wa maana ya kijiografia 'kusini' ukihifadhiwa katika tanbihi.
- source_word: הַר הַמַּשְׁחִית
  choice: Mlima wa Uharibifu
  rationale: Hutafsiri jina la Kiebrania lenye dharau badala ya kulibadilisha kuwa Mlima wa Mizeituni.
- source_word: לְעַשְׁתֹּרֶת
  choice: kwa ajili ya Ashtorethi
  rationale: Jina la mungu wa kike limetoholewa kwa kuzingatia umbo la Kiebrania.
- source_word: שִׁקֻּץ צִידֹנִים
  choice: chukizo la Wasidoni
  rationale: ‘Chukizo’ huhifadhi hukumu kali ya kidini iliyomo katika שִׁקּוּץ, na ‘Wasidoni’ ni namna ya kawaida ya kutaja watu hao kwa Kiswahili.
- source_word: לִכְמוֹשׁ
  choice: kwa ajili ya Kemoshi
  rationale: Jina la mungu limetoholewa kwa fonolojia na tahajia ya kawaida ya Kiswahili.
- source_word: שִׁקֻּץ מוֹאָב
  choice: chukizo la Moabu
  rationale: Hudumisha istilahi ileile ya polemiki na kutofautisha nchi ya Moabu na watu wake.
- source_word: לְמִלְכֹּם
  choice: kwa ajili ya Milkomu
  rationale: Maandishi ya Kiebrania yanasoma Milkomu; hayabadilishwi kimya kuwa Moleki.
- source_word: תּוֹעֲבַת בְּנֵי עַמּוֹן
  choice: chukizo la Waamoni
  rationale: ‘Waamoni’ ni tafsiri ya asili ya ‘wana wa Amoni’ kama jina la kabila, na ‘chukizo’ hudumisha nguvu ya hukumu ya תּוֹעֵבָה.
- source_word: טִמֵּא
  choice: akapatia unajisi
  rationale: Katika muktadha huu tendo hilo ni kuyafanya maeneo ya ibada yasifae tena kidini; ‘kupatia unajisi’ huwasilisha maana hiyo ya kiibada.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Huhifadhi cheo kilichotumiwa katika mstari; muktadha ndio unaomtambulisha kuwa Yosia.
theological_decisions:
- issue: Majina ya dharau kwa miungu ya mataifa
  choice: Kutumia ‘chukizo’ kwa שִׁקּוּץ na תּוֹעֵבָה
  alternative: kitu cha kuchukiza
  rationale: Neno hili linahifadhi hukumu ya wazi ya maandishi dhidi ya ibada hizi bila kulainisha lugha kuwa maelezo yasiyoegemea upande wowote.
- issue: Utambulisho wa הַר הַמַּשְׁחִית
  choice: Mlima wa Uharibifu
  alternative: Mlima wa Mizeituni; Mlima wa Ufisadi
  rationale: Jina lenyewe la Kiebrania linatafsiriwa ili kuhifadhi dharau na mvutano wa maandishi, badala ya kulinganisha moja kwa moja na jina lingine la kijiografia.
- issue: Milkomu na Moleki
  choice: Milkomu katika maandishi makuu
  alternative: Moleki
  rationale: Maandishi ya Kimasora yana Milkomu hapa; uhusiano unaowezekana na Moleki haupaswi kuondoa usomaji huo, hivyo unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kuwa Ashtorethi, Kemoshi, na Milkomu. Muundo mrefu wa mstari umerahisishwa kiasi bila kuondoa mahusiano yake ya kisarufi; viashiria vyote vya tanbihi vimewekwa katika maandishi makuu.
