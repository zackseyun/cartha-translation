  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: sw
  text: Kisha mfalme akatuma, na wazee wote wa Yuda na Yerusalemu wakakusanyika kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi שׁלח hapa kinaonyesha kwamba mfalme alituma wajumbe au alitoa wito. Kiswahili huhitaji kwa kawaida kitu kilichotumwa; ‘watu’ kinaeleza maana ya muktadha bila kuwataja kuwa wajumbe moja kwa moja. Tanbihi inahifadhi uwezekano wa kutafsiri kwa uwazi zaidi kuwa aliwaita wazee.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye kiambishi cha uainisho; muktadha unamtambulisha kuwa Yosia, lakini aya yenyewe inatumia cheo chake.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: nao wakawakusanya kwake
  rationale: 'Umbo la Kiebrania ni tendaji la wingi lenye mtendaji asiyeelezwa: ‘nao wakakusanya.’ Tafsiri hii inadumisha umbo hilo na kueleza kuelekezwa kwa mkusanyiko kwake, bila kumtaja mtendaji mahsusi.'
- source_word: כָּל
  choice: wote
  rationale: Huhifadhi msisitizo wa ujumuisho wa wazee.
- source_word: זִקְנֵי
  choice: wazee
  rationale: Katika muktadha huu, neno linamaanisha wazee wenye mamlaka au viongozi wanaotambuliwa, si wanaume wenye umri mkubwa tu.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la kawaida la Kiswahili la ufalme au eneo la Yuda.
- source_word: וִירוּשָׁלִָם
  choice: na Yerusalemu
  rationale: Jina la kawaida la Kiswahili la mji mkuu, likiunganishwa na Yuda.
