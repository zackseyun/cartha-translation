  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: sw
  text: Kisha mfalme akapanda hadi katika nyumba ya Yahweh[a], akiwa pamoja na wanaume wote wa Yuda, wakazi wote wa Yerusalemu, makuhani, manabii, na watu wote—kuanzia mdogo hadi mkubwa[b]. Naye akawasomea maneno yote ya Kitabu cha Agano kilichokuwa kimepatikana katika nyumba ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Yahweh.” Kihalisi, “nyumba ya Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuanzia aliye wa chini kabisa hadi aliye mkuu kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: Huhifadhi maana ya kuelekea juu iliyo katika עלה, huku ikiwa Kiswahili cha kawaida katika muktadha wa kwenda hekaluni.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Hufuata kwa karibu usemi wa Kiebrania ‘nyumba ya YHWH’; ‘hekalu la Yahweh’ ni tafsiri mbadala ya kimuktadha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina la agano linalowakilishwa na herufi יהוה badala ya kulibadilisha kuwa cheo.
- source_word: כָל אִישׁ יְהוּדָה
  choice: wanaume wote wa Yuda
  rationale: אִישׁ ni umbo la kiume linalotumiwa kwa maana ya kijumla hapa; tafsiri inahifadhi wazi umbo hilo bila kulipanua kimyakimya kuwa ‘watu wote wa Yuda.’
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: wakazi wote wa Yerusalemu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya wale wanaokaa mahali fulani.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Neno la kawaida la Kiswahili kwa כֹּהֲנִים katika muktadha wa ibada.
- source_word: הַנְּבִיאִים
  choice: manabii
  rationale: Tafsiri sanifu ya נְבִיאִים.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Hutoa kwa asili maana ya kundi zima linalotajwa.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: kuanzia mdogo hadi mkubwa
  rationale: Huhifadhi taswira pana ya Kiebrania bila kuibana kuwa tofauti ya umri pekee; maana ya kijamii ya ‘wa hali ya chini hadi wa hali ya juu’ inawezekana pia.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: akawasomea
  rationale: Kwa kuwa kinachosomwa ni maneno ya kitabu, kitenzi hiki huwasilisha kwa Kiswahili tendo la kusoma kwa sauti ili wasikie.
- source_word: סֵפֶר הַבְּרִית
  choice: Kitabu cha Agano
  rationale: Hutoa maana ya moja kwa moja ya jina la maandishi hayo na kuhifadhi uzito wake kama jina maalumu katika muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la Mungu mwenyewe, si neno la kawaida la cheo; ‘Yahweh’ hulihifadhi wazi.
- issue: Kundi la כָל אִישׁ יְהוּדָה
  choice: wanaume wote wa Yuda
  alternative: watu wote wa Yuda
  rationale: Uchaguzi huhifadhi lugha ya kiume ya chanzo na uwezekano wake wa kutumika kiuwakilishi, bila kuamua kimyakimya kwamba inawataja wakazi wote bila tofauti.
- issue: Maana ya לְמִקָּטֹן וְעַד גָּדוֹל
  choice: kuanzia mdogo hadi mkubwa
  alternative: kuanzia aliye wa chini kabisa hadi aliye mkuu kabisa
  rationale: Usemi unaweza kuonyesha hadhi au ukubwa wa kijamii, si umri tu; tafsiri kuu huhifadhi upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umerahisishwa kwa sentensi mbili ili kuepuka msururu mzito, huku mpangilio na maudhui ya Kiebrania yakihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
