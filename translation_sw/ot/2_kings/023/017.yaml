  text: וַ/יֹּ֕אמֶר מָ֚ה הַ/צִּיּ֣וּן הַלָּ֔ז אֲשֶׁ֖ר אֲנִ֣י רֹאֶ֑ה וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אַנְשֵׁ֣י הָ/עִ֗יר הַ/קֶּ֤בֶר אִישׁ הָֽ/אֱלֹהִים֙ אֲשֶׁר בָּ֣א מִֽ/יהוּדָ֔ה וַ/יִּקְרָ֗א אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר עָשִׂ֔יתָ עַ֖ל הַ/מִּזְבַּ֥ח בֵּֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: sw
  text: Kisha akauliza, “Ni alama[a] gani hii ninayoiona?” Wanaume wa mji wakamwambia, “Ni kaburi la mtu wa Mungu aliyekuja kutoka Yuda na kutangaza[b] mambo haya uliyoyatenda dhidi ya madhabahu ya Betheli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jiwe la ukumbusho,” “alama ya kumbukumbu,” au “alama ya kaburi.”
    reason: lexical_alternative
  - marker: b
    text: Au “aliita kwa sauti” au “alipaza sauti dhidi ya.” Kitenzi hiki kinarejelea tangazo la kinabii la mtu wa Mungu kuhusu madhabahu (linganisha 1 Fal. 13:1–2).
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: alama
  rationale: Neno hili linamaanisha kitu kilichowekwa kutambulisha au kukumbusha mahali fulani. Katika muktadha huu ni alama inayoonekana ya kaburi; ‘alama’ ni ya kawaida na haibainishi umbo la kitu hicho kuliko Kiebrania.
- source_word: הַלָּז
  choice: ile
  rationale: Kiwakilishi hiki kinaelekeza kwenye kitu kinachoonekana; ‘ile’ ni usemi wa kawaida wa Kiswahili kwa kitu kinachoonyeshwa kwa mbali kiasi.
- source_word: אֲנִי רֹאֶה
  choice: ninayoiona
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kitu ambacho msemaji anakiona wakati huo.
- source_word: הַקֶּבֶר
  choice: kaburi
  rationale: ‘Kaburi’ ni neno la kawaida na linalofaa kwa mahali pa kuzikia penye alama inayoonekana.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni tafsiri ya wazi ya cheo cha Kiebrania na halikifasiri kwa njia finyu zaidi kuwa ‘nabii,’ ingawa kazi yake ya kinabii inaonekana katika muktadha.
- source_word: מִיהוּדָה
  choice: kutoka Yuda
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha mahali alikotoka.
- source_word: וַיִּקְרָא
  choice: kutangaza
  rationale: Katika rejeo la 1 Wafalme 13, kitenzi kinaeleza tamko la wazi la kinabii. ‘Kutangaza’ huwasilisha maana hiyo bila kuongeza maelezo yasiyomo katika mstari.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mambo haya
  rationale: ‘Mambo’ yanaweza kurejelea maneno yaliyotamkwa na pia matukio yaliyotabiriwa, hivyo yanahifadhi upana wa maana ya Kiebrania.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: uliyoyatenda
  rationale: Wakati uliopita unaonyesha matendo ambayo Yosia alikuwa ameyafanya na ambayo ndiyo utimilifu wa tamko hilo.
- source_word: עַל הַמִּזְבֵּחַ
  choice: dhidi ya madhabahu
  rationale: Muktadha wa hukumu na kubomolewa kwa madhabahu unaunga mkono maana ya uadui ya kihusishi עַל hapa.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hili ni umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
theological_decisions:
- issue: Utambulisho wa tangazo la kinabii linalokumbukwa katika mstari huu
  choice: Kumtaja mtu wa Mungu kuwa ‘alitangaza’ mambo haya bila kuongeza maelezo kutoka 1 Wafalme 13
  alternative: ‘alipaza sauti’ au ‘alilia dhidi ya’
  rationale: Mstari unarejelea unabii wa awali dhidi ya madhabahu ya Betheli. ‘Kutangaza’ huonyesha uzito wa tamko la kinabii huku ikibaki ndani ya maelezo ya Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wakamwambia’ na ‘akauliza’ hudumisha mtiririko wa simulizi; msamiati wa kidini umewekewa mipaka ili kutokuingiza ufafanuzi wa kimadhehebu.
