base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/014.yaml
  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: sw
  text: Akazivunja-vunja nguzo, akazikata Asherimu[a], na akajaza mahali pao mifupa ya wanadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguzo za Ashera.” Neno la Kiebrania אֲשֵׁרִים linaweza kurejelea vitu vya ibada vilivyohusishwa na Ashera; neno lenyewe halibainishi umbo lake hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: akazivunjavunja
  rationale: Kitenzi kinaonyesha kuvunja vipandevipande kwa nguvu; “vunja-vunja” ni cha asili na chenye uzito unaofaa.
- source_word: הַמַּצֵּבוֹת
  choice: nguzo
  rationale: Neno linamaanisha mawe yaliyosimamishwa kama nguzo katika ibada. “Nguzo” ni fupi na wazi bila kuongeza neno la kifafanuzi lisilokuwamo moja kwa moja katika Kiebrania.
- source_word: וַיִּכְרֹת
  choice: akazikata chini
  rationale: Katika muktadha wa vitu vya ibada vinavyoweza kukatwa, usemi huu unaeleza kuviangusha kwa kuvikata.
- source_word: הָאֲשֵׁרִים
  choice: sanamu za Ashera
  rationale: Wingi huu unataja vitu vya ibada vilivyohusishwa na Ashera. “Sanamu za Ashera” inaeleweka kwa msomaji wa kawaida huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu umbo lake hasa.
- source_word: וַיְמַלֵּא
  choice: akapajaza
  rationale: Huhifadhi maana ya msingi ya kujaza na kupatana na nomino ya mahali katika Kiswahili.
- source_word: מְקוֹמָם
  choice: mahali pake
  rationale: Kiambishi cha Kiebrania kinarejelea vitu vya ibada vilivyotangulia kwa pamoja; Kiswahili cha kawaida hutumia “mahali pake” kwa eneo hilo bila kulazimisha wingi usio wa asili.
- source_word: עַצְמוֹת אָדָם
  choice: mifupa ya watu
  rationale: אָדָם hapa ni ya ujumla kuhusu wanadamu, si wanaume pekee; “mifupa ya watu” ni ya kawaida na sahihi katika Kiswahili.
theological_decisions:
- issue: Maana ya אָדָם katika עַצְמוֹת אָדָם
  choice: watu katika “mifupa ya watu”
  alternative: mwanadamu katika “mifupa ya mwanadamu”
  rationale: Katika muktadha huu neno hilo ni la jumla na halimtaji mwanamume mahsusi; “watu” huwasilisha maana hiyo bila kuweka jinsia isiyokusudiwa.
- issue: Utambulisho na umbo la הָאֲשֵׁרִים
  choice: sanamu za Ashera, pamoja na tanbihi
  alternative: nguzo za Ashera
  rationale: Neno linahusu vifaa vya ibada vinavyohusishwa na Ashera, lakini peke yake halibainishi umbo lake. Tafsiri kuu iwe inayoeleweka, na tanbihi ihifadhi uwezekano wa “nguzo.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi vya simulizi umehifadhiwa kwa “aka-”; msamiati unaepuka ufafanuzi wa kimadhehebu na kuhifadhi kutokuwa na uhakika kuhusu vitu vya Ashera.
