base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: sw
  text: Kwa maana Pasaka kama hii haikuwa imeadhimishwa tangu siku za waamuzi waliowahukumu Israeli, wala katika siku zote za wafalme wa Israeli na wafalme wa Yuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza sababu au maelezo ya kauli iliyotangulia kuhusu Pasaka ya Yosia.
- source_word: נַעֲשָׂה
  choice: haikuwa imeadhimishwa
  rationale: Ingawa kitenzi kwa msingi ni ‘kufanywa,’ kinapotumiwa kuhusu Pasaka maana ya kawaida ya Kiswahili ni kuadhimisha sikukuu hiyo.
- source_word: כַּפֶּסַח הַזֶּה
  choice: Pasaka kama hii
  rationale: Kiambishi כְּ־ kinaonyesha ulinganisho; tafsiri hii huhifadhi maana ya Pasaka inayolingana na hii, si kwamba Pasaka yoyote haikuwahi kuadhimishwa.
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: tangu siku za waamuzi
  rationale: מִן pamoja na ‘siku’ huonyesha mwanzo wa kipindi kinacholinganishwa.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: walioihukumu Israeli
  rationale: Huhifadhi uhusiano wa kitenzi שׁפט na jina ‘waamuzi,’ huku kiambishi cha yambwa kikirejelea Israeli.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: wala katika siku zote za wafalme wa Israeli na wafalme wa Yuda
  rationale: ‘Wala’ huendeleza ukanushaji, na kurudia ‘wafalme wa’ huhifadhi muundo wa Kiebrania na tofauti kati ya falme hizo.
theological_decisions:
- issue: Upeo wa ulinganisho wa kihistoria
  choice: Hakuna Pasaka iliyolingana na Pasaka ya Yosia iliyokuwa imeadhimishwa katika kipindi chote kilichotajwa.
  alternative: Hakuna Pasaka yoyote iliyokuwa imeadhimishwa kabisa katika kipindi hicho.
  rationale: Muundo כַּפֶּסַח הַזֶּה ni wa ulinganisho, ‘kama Pasaka hii’; kwa hiyo mstari unazungumzia kutokuwapo kwa Pasaka inayolingana nayo, bila kutatua zaidi kama kauli hiyo ni ya mkazo wa kifasihi au tathmini kamili ya kihistoria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Kuadhimishwa’ linafaa kwa sikukuu ya kidini; ‘Pasaka kama hii’ huhifadhi kwa uwazi ulinganisho wa maandishi ya Kiebrania.
