id: 2KI.23.3
reference: 2 Kings 23:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: sw
  text: 'Ndipo mfalme akasimama kando ya nguzo, akafanya agano hilo mbele za Yahweh: kwamba atamfuata Yahweh, atashika amri zake, shuhuda zake na sheria zake kwa moyo wake wote na kwa nafsi yake yote, na kuyatekeleza maneno ya agano hili yaliyoandikwa katika kitabu hiki.[a] Watu wote wakaingia katika agano hilo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hati-kunjo hii.” Neno la Kiebrania linaweza kumaanisha kitabu, hati au hati-kunjo.
    reason: cultural_note
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “Watu wote wakasimama katika agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: akasimama kando ya nguzo
  rationale: Kitenzi עמד ni ‘kusimama,’ na עַל hapa kinaweza kuonyesha mahali ‘penye/kando ya’ nguzo. ‘Kando ya nguzo’ kinaeleweka kwa kawaida kuliko kumweka mfalme juu ya nguzo.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: akafanya agano hilo
  rationale: כרת ברית ni nahau ya Kiebrania yenye maana ya kufanya agano. ‘Agano hilo’ linahifadhi hali ya uainisho wa הַבְּרִית na muktadha wa kufanywa upya kwa agano.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי humaanisha ‘mbele ya/katika uwepo wa.’ ‘Mbele za’ ni Kiswahili cha heshima kinachofaa uzito wa tukio hili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: atamfuata Yahweh
  rationale: Nahau ya Kiebrania ni ‘kutembea nyuma ya.’ Kiswahili ‘kumfuata’ kinawasilisha kwa kawaida utii na uaminifu unaokusudiwa bila usemi mgumu.
- source_word: לִשְׁמֹר
  choice: atashika
  rationale: Katika muktadha wa sheria na agano, שׁמר humaanisha kushika au kutii kwa uangalifu.
- source_word: מִצְוֺתָיו
  choice: amri zake
  rationale: מִצְוֹת ni amri; neno hili ni la kawaida na linafaa muktadha wa sheria ya agano.
- source_word: עֵדְוֺתָיו
  choice: shuhuda zake
  rationale: ‘Shuhuda’ linadumisha istilahi tofauti ya Kiebrania pamoja na ‘amri’ na ‘sheria,’ bila kuichanganya kimya kimya na makundi hayo.
- source_word: חֻקֹּתָיו
  choice: sheria zake
  rationale: חֻקִּים ni masharti au sheria zilizowekwa. ‘Sheria’ ni neno la kawaida la Kiswahili linaloeleweka katika mfululizo huu.
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: kwa moyo wake wote na kwa nafsi yake yote
  rationale: Tafsiri hii inadumisha jozi ya ‘moyo’ na ‘nafsi’ pamoja na msisitizo unaorudiwa wa ukamilifu wa kujitoa.
- source_word: לְהָקִים
  choice: kuyatekeleza
  rationale: Katika muktadha huu neno linaelekeza kwenye kuyafanya maneno ya agano yawe na nguvu kwa kuyatimiza; ‘kutekeleza’ linatoa maana hiyo kwa Kiswahili cha sasa.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: maneno ya agano hili
  rationale: ‘Maneno’ linadumisha maana halisi ya דִּבְרֵי na uhusiano wake na maandishi yaliyomo katika kitabu au hati-kunjo.
- source_word: הַסֵּפֶר הַזֶּה
  choice: kitabu hiki
  rationale: סֵפֶר inaweza kuwa kitabu, hati au hati-kunjo. ‘Kitabu’ ni neno la kawaida katika matini kuu, huku tanbihi ikihifadhi uwezekano wa hati-kunjo.
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: Watu wote wakaingia katika agano hilo
  rationale: Kifungu hicho, ambacho kwa umbo la moja kwa moja ni ‘wakasimama katika agano,’ kinaonyesha watu kukubali na kujiunga na agano. ‘Wakaingia katika agano’ ni cha kawaida zaidi na tanbihi inadumisha umbo halisi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi יהוה. ‘Yahweh’ linadumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya kujitoa kwa agano וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: Watu wote wakaingia katika agano hilo
  alternative: Watu wote wakasimama katika agano hilo
  rationale: Tafsiri kuu inaeleza kwa Kiswahili kinachoeleweka tendo la pamoja la kulikubali agano, huku tanbihi ikihifadhi sitiari na utata wa usemi halisi wa Kiebrania.
- issue: Upeo wa kujitoa ‘kwa moyo wake wote na kwa nafsi yake yote’
  choice: Maneno hayo yanamhusu mfalme kisarufi
  alternative: Kuyafanya yahusu mfalme na watu wote
  rationale: Viwakilishi vya umoja katika Kiebrania vinaendelea kumrejelea mfalme katika sentensi hiyo. Watu wanatajwa wazi katika kishazi cha mwisho, hivyo tafsiri haipanui viwakilishi kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Istilahi za kiagano ‘amri,’ ‘shuhuda,’ na ‘sheria’ zimedumishwa kama makundi tofauti. Viunganishi na mpangilio wa sentensi vimerahisishwa kiasi bila kuondoa muundo wa ahadi ya mfalme au hitimisho la watu.
