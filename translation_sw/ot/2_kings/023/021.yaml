  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: sw
  text: Kisha mfalme akawaamuru watu wote, akisema, “Msherehekee Pasaka kwa Yahweh, Mungu wenu, kama ilivyoandikwa katika kitabu hiki cha Agano.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kinaonyesha kutoa amri; muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: עם hapa ni jumuiya yote ya watu; ‘watu wote’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עֲשׂוּ פֶסַח
  choice: Msherehekee ... Pasaka
  rationale: Nahau hiyo, kwa neno kwa neno ‘fanyeni Pasaka,’ humaanisha kuiadhimisha sikukuu; ‘msherehekee Pasaka’ ni Kiswahili cha asili kinachohifadhi maana ya tendo la ibada.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: Yahweh Mungu wenu
  rationale: ל huonyesha kwamba Pasaka inaelekezwa au kuwekwa wakfu kwa Yahweh; mpangilio huu ni wa asili katika Kiswahili na unahifadhi jina la agano pamoja na ‘Mungu wenu.’
- source_word: כַּכָּתוּב
  choice: kama ilivyoandikwa
  rationale: Huu ni usemi wa kawaida unaoonyesha kufuata maagizo yaliyoandikwa.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: katika Kitabu hiki cha Agano
  rationale: Ingawa עַל kimsingi inaweza kuwa ‘juu ya,’ pamoja na kuandika katika hati maana ya kawaida ya Kiswahili ni ‘katika’; demonstrativi ‘hiki’ imehifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה; ‘Yahweh’ hulitambulisha kama jina maalumu bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa Pasaka na Yahweh unaoonyeshwa na ל
  choice: Msherehekee Yahweh Mungu wenu Pasaka
  alternative: Msherehekee Pasaka kwa ajili ya Yahweh Mungu wenu
  rationale: Muundo uliochaguliwa ni wa kawaida zaidi kwa Kiswahili na bado unaonyesha Pasaka inayoadhimishwa kwa Yahweh; mbadala hufanya wazo la kuwekwa wakfu liwe wazi zaidi lakini huongeza uzito wa maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msherehekee Pasaka’ limechaguliwa badala ya tafsiri ngumu ya neno kwa neno ‘fanyeni Pasaka.’ Hakuna tanbihi iliyohitajika kwa kuwa tofauti hiyo inaweza kushughulikiwa wazi katika uamuzi wa kileksika.
