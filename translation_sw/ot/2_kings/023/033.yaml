base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: sw
  text: Farao Neko akamfunga[a] huko Ribla, katika nchi ya Hamathi, ili asitawale Yerusalemu.[b] Kisha akaitoza nchi ushuru[c] wa talanta mia moja za fedha na talanta moja ya dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamweka kizuizini.”
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania unaweza pia kutafsiriwa “asipate kutawala Yerusalemu” au “kutoka katika kutawala Yerusalemu.”
    reason: alternative_reading
  - marker: c
    text: Au, “adhabu ya fedha” au “faini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: akamfunga
  rationale: Kitenzi אסר humaanisha kufunga au kuweka kizuizini. “Akamfunga” ni cha asili katika Kiswahili na kinahifadhi upana wa maana bila kulazimisha aina mahususi ya kifungo.
- source_word: פַרְעֹה נְכֹה
  choice: Farao Neko
  rationale: Jina na cheo yametoholewa kwa umbo linaloeleweka katika Kiswahili cha Biblia.
- source_word: בְרִבְלָה
  choice: huko Ribla
  rationale: Kiambishi ב kinaonyesha mahali; “huko Ribla” ni usemi wa kawaida wa Kiswahili kwa eneo lililotajwa.
- source_word: בְּאֶרֶץ חֲמָת
  choice: katika nchi ya Hamathi
  rationale: אֶרֶץ hapa ni eneo au nchi; umbo hili linahifadhi muundo wa Kiebrania kwa lugha ya kawaida.
- source_word: במלך בִּירוּשָׁלָם
  choice: ili asitawale Yerusalemu
  rationale: Muundo wenye ב na kitenzi-jina unaeleweka katika muktadha kama kuzuia kutawala; tafsiri hii inaonyesha kusudi au matokeo bila kuficha uwezekano wa kutafsiri ‘asipate kutawala.’
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: akaitoza ... ushuru
  rationale: עֹנֶשׁ inaweza kuwa adhabu, faini, au malipo yaliyolazimishwa. Kwa kuwa kiasi kinawekwa juu ya nchi na mfalme wa kigeni, “ushuru” linafaa kimuktadha, huku mbadala ukielezwa katika tanbihi.
- source_word: עַל הָאָרֶץ
  choice: nchi
  rationale: הָאָרֶץ hapa inarejelea nchi ya Yuda kama iliyobebeshwa malipo; “akaitoza nchi” ni Kiswahili fasaha kinachowasilisha uhusiano huo.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: talanta mia moja za fedha
  rationale: Talanta ni kipimo cha kale cha uzito; kukihifadhi huepuka ubadilishaji wa kisasa usio na uhakika.
- source_word: וְכִכַּר זָהָב
  choice: talanta moja ya dhahabu
  rationale: Umoja wa Kiebrania umehifadhiwa, pamoja na kipimo cha kale cha uzito.
theological_decisions:
- issue: Maana ya במלך בירושלם
  choice: ili asitawale Yerusalemu
  alternative: asipate kutawala Yerusalemu; kutoka katika kutawala Yerusalemu
  rationale: Muktadha wa kifalme unaunga mkono maana ya kuzuia utawala, lakini tanbihi inadumisha unyumbufu wa muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa tanbihi umewekwa karibu na maneno yanayohusika, na vipimo vya kale vimehifadhiwa.
