  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: sw
  text: Akanajisi Tofethi, iliyokuwa katika Bonde la Ben-Hinomu, ili mtu yeyote asimpitishe mwanawe wa kiume au wa kike motoni kwa Moleki.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi “kumpitisha mwanawe wa kiume na mwanawe wa kike motoni.” Hii ni nahau ya ibada inayohusu kuwatoa watoto katika desturi iliyohusishwa na Moleki, yaelekea kama dhabihu ya watoto.
    reason: cultural_note
  - marker: b
    text: Au “kwa mfalme.” Ingawa si uwezekano mkubwa, konsonanti za Kiebrania zinaweza pia kueleweka hivyo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  choice: Akaitia unajisi
  rationale: Kauli ya Piel ya טמא humaanisha kufanya kitu kiwe najisi. Katika muktadha huu Yosia aliifanya mahali pa ibada pasifae tena kwa matumizi hayo; “akaitia unajisi” ni sahihi na haiongezi maana ya ufafanuzi kupita kiasi.
- source_word: הַתֹּפֶת
  choice: Tofethi
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa.
- source_word: בְּגֵי בני הִנֹּם
  choice: katika Bonde la Ben-Hinomu
  rationale: גֵי ni “bonde,” na Ben-Hinomu limehifadhiwa kama jina la mahali linalotambulika, huku tahajia ikirekebishwa kwa Kiswahili.
- source_word: לְבִלְתִּי
  choice: ili ... asi-
  rationale: Muundo huu unaonyesha kusudi la kuzuia jambo; “ili ... asi-” ni wa kawaida na sahihi katika Kiswahili.
- source_word: לְהַעֲבִיר
  choice: asimpitishe
  rationale: Hiphil ya עבר ni kausativi, “kusababisha apite/kumpitisha.” Tafsiri hii inadumisha nahau ya Kiebrania badala ya kuiweka wazi moja kwa moja kuwa dhabihu.
- source_word: אִישׁ
  choice: mtu yeyote
  rationale: Nomino ya Kiebrania iko katika umoja wa kiume lakini hapa ina maana ya jumla. “Mtu yeyote” huwasilisha nguvu hiyo kwa Kiswahili bila kudokeza kwamba katazo liliwahusu wanaume pekee.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: mwanawe wa kiume wala wa kike
  rationale: Baada ya kitenzi cha ukanushi, “wala” huonyesha kwa kawaida kwamba hakuna mtoto wa jinsia mojawapo aliyepaswa kufanyiwa tendo hilo.
- source_word: בָּאֵשׁ
  choice: motoni
  rationale: Pamoja na “kumpitisha,” “motoni” ni usemi mfupi na wa asili unaohifadhi picha ya ibada iliyotajwa katika Kiebrania.
- source_word: לַמֹּלֶךְ
  choice: kwa ajili ya Moleki
  rationale: Katika muktadha huu, Moleki linaeleweka kwa kawaida kuwa jina la mungu aliyehusishwa na ibada hiyo. “Kwa ajili ya” huwasilisha mwelekeo au kusudi la ibada bila kulazimisha maana finyu ya kihusishi.
theological_decisions:
- issue: Jinsi ya kutafsiri nahau ya ibada ya kumpitisha mtoto motoni
  choice: Kudumisha nahau “asimpitishe motoni” katika matini kuu
  alternative: “asitoe mwanawe kuwa dhabihu kwa kumteketeza motoni”
  rationale: Muktadha unaonyesha ibada ya kutoa watoto, yaelekea dhabihu ya watoto, lakini maneno ya Kiebrania yenyewe yanatumia nahau ya “kupitisha motoni.” Matini kuu inadumisha namna hiyo ya usemi, na tanbihi inaeleza uwezekano wake bila kuondoa mvutano uliomo katika chanzo.
- issue: Utambulisho wa לַמֹּלֶךְ
  choice: kwa ajili ya Moleki
  alternative: kwa mfalme
  rationale: Usomaji wa kawaida na unaofaa zaidi katika muktadha wa ibada ni jina Moleki. Hata hivyo, konsonanti zinaweza kueleweka na baadhi ya wasomaji kuwa “kwa mfalme,” kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Majina Tofethi, Ben-Hinomu, na Moleki yametoholewa kwa mfumo wa sauti wa Kiswahili. Muundo “mwanawe wa kiume wala wa kike” umechaguliwa ili ukanushi usomeke kwa kawaida.
