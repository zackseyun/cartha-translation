source:
  edition: WLC
  text: בְּ/יָמָ֡י/ו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם עַל מֶ֥לֶךְ אַשּׁ֖וּר עַל נְהַר פְּרָ֑ת וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִ/קְרָאת֔/וֹ וַ/יְמִיתֵ֨/הוּ֙ בִּ/מְגִדּ֔וֹ כִּ/רְאֹת֖/וֹ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: sw
  text: Katika siku zake, Farao Neko, mfalme wa Misri, alipanda kupigana na mfalme wa Ashuru hadi Mto Frati.[a] Mfalme Yosia akaenda kukutana naye,[b][c] naye akamuua huko Megido alipomwona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina la Kiebrania ni Neko; kwa mapokeo huandikwa pia Necho.
    reason: Huonyesha tahajia mbadala ya kimapokeo ya jina bila kubadili matini.
  - marker: b
    text: 'Viwakilishi vya Kiebrania vinaweza kufafanuliwa hivi: “Farao Neko akamuua Yosia huko Megido, Yosia alipokwenda kukutana naye.”'
    reason: Huweka wazi usomaji mmoja unaowezekana huku matini kuu ikihifadhi utata wa viwakilishi.
  - marker: c
    text: Tazama pia 2 Mambo ya Nyakati 35:20–24 kuhusu simulizi linalolingana la kifo cha Yosia.
    reason: Rejeo sambamba hutoa muktadha zaidi bila kuingizwa katika tafsiri yenyewe.
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Katika siku zake
  rationale: Huhifadhi nahau ya Kiebrania inayorejelea wakati wa utawala wa Yosia, huku ikiwa ya kawaida katika Kiswahili cha Biblia.
- source_word: עָלָה ... עַל מֶלֶךְ אַשּׁוּר
  choice: alipanda kwenda dhidi ya mfalme wa Ashuru
  rationale: ‘Alipanda kwenda’ huhifadhi kitenzi cha mwendo עָלָה, na ‘dhidi ya’ huonyesha maana ya kijeshi ya עַל bila kuibadili kwa kuzingatia maelezo ya kihistoria.
- source_word: פַרְעֹה נְכֹה
  choice: Farao Neko
  rationale: ‘Farao’ ni cheo kilichozoeleka, na ‘Neko’ ni unukuzi wa karibu wa jina la Kiebrania.
- source_word: עַל נְהַר פְּרָת
  choice: mpaka Mto Frati
  rationale: Huwasilisha Mto Frati kama mwisho wa safari kwa Kiswahili cha kawaida.
- source_word: לִקְרָאתוֹ
  choice: kukutana naye
  rationale: Huhifadhi upana wa maana ya kwenda kumlaki au kukabiliana na mtu bila kuamua wazi nia ya Yosia.
- source_word: וַיְמִיתֵהוּ
  choice: naye akamuua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kausativi ya מות katika muktadha huu; kiwakilishi kinaachwa bila kutaja jina ili kuhifadhi msongamano wa Kiebrania.
- source_word: בִּמְגִדּוֹ
  choice: huko Megido
  rationale: ‘Huko’ huonyesha mahali pa tukio kwa lugha ya asili ya Kiswahili.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: alipomwona
  rationale: Muundo huu wa Kiswahili una viwakilishi visivyotaja wahusika kwa majina, hivyo kwa kadiri iwezekanavyo huhifadhi utata wa Kiebrania kuhusu ‘aliyeona’ na ‘aliyeonekana.’
theological_decisions:
- issue: Utata wa viwakilishi katika וַיְמִיתֵהוּ na כִּרְאֹתוֹ אֹתוֹ
  choice: naye akamuua huko Megido alipomwona
  alternative: Farao Neko akamuua Yosia huko Megido, Yosia alipokwenda kukutana naye
  rationale: Kiebrania kina viwakilishi vya nafsi ya tatu vya kiume vilivyobanwa na hakitaji wahusika tena kwa majina. Matini kuu hudumisha utata huo badala ya kuamua kimya kimya mhusika wa kila kitendo; tanbihi inatoa ufafanuzi unaowezekana.
- issue: Maana ya עַל מֶלֶךְ אַשּׁוּר
  choice: dhidi ya mfalme wa Ashuru
  alternative: kumsaidia mfalme wa Ashuru
  rationale: Maana ya kawaida ya kisarufi katika sentensi ya kijeshi ni ‘dhidi ya.’ Hali ya kihistoria inaweza kupendekeza tafsiri nyingine, lakini haipaswi kuingizwa katika matini kuu dhidi ya uso wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi hudumisha mfuatano wa simulizi wa Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu; [b] inafuata kishazi chenye utata na [c] inaelekeza kwenye simulizi sambamba.
