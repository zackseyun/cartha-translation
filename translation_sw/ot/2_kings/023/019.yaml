base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: sw
  text: 'Yosia pia aliondoa nyumba zote za mahali pa juu zilizokuwa katika miji ya Samaria, ambazo wafalme wa Israeli walikuwa wamefanya ili kuchochea hasira[a]. Akazitendea sawasawa na matendo yote aliyoyafanya Betheli.


    [a] Au, kwa uwazi zaidi kutokana na muktadha mpana, “ili kumkasirisha BWANA.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi kutokana na muktadha mpana, “ili kumkasirisha BWANA.”
    reason: Usomaji mbadala unaoweka wazi yule anayekasirishwa kulingana na muktadha, ingawa hatajwi katika kishazi cha Kiebrania.
lexical_decisions:
- source_word: וְגַם
  choice: pia
  rationale: Neno hili linaonyesha kwamba tendo hili linaongezwa kwa matendo yaliyotangulia; “pia” ni la kawaida na la asili katika Kiswahili.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: nyumba za mahali pa juu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya “nyumba” na istilahi ya maeneo ya ibada yaliyoitwa “mahali pa juu,” bila kuyafasiri moja kwa moja kuwa mahekalu au madhabahu.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: katika miji ya Samaria
  rationale: Ni tafsiri ya moja kwa moja; hapa Samaria inaeleweka kuwa eneo la ufalme wa zamani wa kaskazini.
- source_word: אֲשֶׁר עָשׂוּ
  choice: ambazo ... walikuwa wamejenga
  rationale: Katika muktadha wa nyumba za ibada, “kujenga” hutoa Kiswahili cha asili kwa maana ya kufanya au kuanzisha majengo hayo.
- source_word: לְהַכְעִיס
  choice: ili kuchochea hasira
  rationale: Huwasilisha kusudi au matokeo ya kitendo huku ikiacha mwenye kukasirishwa akiwa hajatajwa wazi, kama ilivyo katika kifungu cha Kiebrania.
- source_word: הֵסִיר
  choice: aliondoa
  rationale: Hutoa maana ya kuondoa maeneo hayo katika muktadha wa matengenezo ya ibada kwa lugha iliyo wazi na ya kawaida.
- source_word: וַיַּעַשׂ לָהֶם
  choice: Akazifanyia
  rationale: Huhifadhi kitenzi cha jumla cha Kiebrania na kurejelea nyumba hizo bila kuainisha zaidi tendo lisilotajwa katika kishazi hiki.
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשָׂה
  choice: sawasawa na yote aliyokuwa amefanya
  rationale: Ni Kiswahili cha asili kinachohifadhi nguvu ya ulinganisho na ukamilifu wa “matendo yote.”
- source_word: בְּבֵית אֵל
  choice: Betheli
  rationale: Jina la mahali linatosha baada ya kitenzi “alifanya”; muundo huu ni wa asili katika Kiswahili na unaonyesha mahali pa matendo yaliyotangulia.
theological_decisions:
- issue: Anayekasirishwa katika לְהַכְעִיס hajatajwa wazi
  choice: 'Kuacha mhusika bila kutajwa katika matini kuu: “ili kuchochea hasira.”'
  alternative: “ili kumkasirisha BWANA”
  rationale: Muktadha mpana unaonyesha kwamba BWANA ndiye anayekasirishwa, lakini kishazi hiki cha Kiebrania hakimtaji. Matini kuu huhifadhi hali hiyo, na tanbihi inatoa ufafanuzi wa kimuktadha bila kuuingiza kimya kimya katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa uwe rahisi kusomeka kwa wasomaji wa kawaida huku ukihifadhi istilahi ya kibiblia “mahali pa juu” na kutotatua kimya kimya utata wa mhusika anayekasirishwa.
