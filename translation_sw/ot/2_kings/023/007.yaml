base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: sw
  text: Akabomoa nyumba za makahaba wa kiume wa ibada[a] zilizokuwa katika nyumba ya Yahweh, ambako wanawake walikuwa wakifuma vitambaa kwa ajili ya Ashera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania ni la kiume wingi. Linaweza pia kutafsiriwa “watu waliowekwa wakfu,” lakini katika muktadha huu hurejelea watu waliohusishwa na desturi haramu za kingono katika ibada.
    reason: lexical_alternative
  - marker: b
    text: “Ashera” linaweza kumaanisha mungu wa kike Ashera au kitu cha ibada kilichohusishwa naye, ambacho mara nyingine huitwa “nguzo ya Ashera.” Neno lililotafsiriwa “vitambaa” kwa kawaida humaanisha “nyumba”; hapa huenda linarejelea vitambaa vya kuning'inizwa, vifuniko, au miundo iliyofumwa kama vibanda kwa ajili ya Ashera.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: Akabomoa
  rationale: Kitenzi נתץ kinaeleza kubomoa au kuangusha miundo; “akabomoa” ni Kiswahili cha kawaida chenye nguvu inayofaa.
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: vyumba vya makahaba wa ibada
  rationale: Ingawa בָּתֵּי kwa kawaida ni “nyumba,” hapa ni sehemu zilizo ndani ya eneo la hekalu, hivyo “vyumba” ni ya asili zaidi. הַקְּדֵשִׁים ni nomino ya kiume kwa watu waliohusishwa na ukahaba wa ibada.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: “Nyumba” hudumisha taswira ya Kiebrania, na jina la Mungu limetolewa kama Yahweh.
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: ambako wanawake walikuwa wakifuma
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea mahali hapo; “ambako” hujumuisha maana ya שָׁם kwa Kiswahili cha asili.
- source_word: בָּתִּים לָאֲשֵׁרָה
  choice: vitambaa kwa ajili ya Ashera
  rationale: בָּתִּים maana yake ya kawaida ni “nyumba,” lakini hapa kitu hicho kilifumwa; “vitambaa” huwasilisha kitu cha kufumwa bila kukibainisha mno. Tanbihi huhifadhi tafsiri halisi na uwezekano wa vitambaa vya kuning'inizwa au miundo kama vibanda.
theological_decisions:
- issue: Utoaji wa יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Yahweh linawakilisha jina binafsi la Mungu badala ya kulibadili kuwa cheo.
- issue: Maana ya אֲשֵׁרָה
  choice: Ashera
  alternative: sanamu/nguzo ya Ashera
  rationale: Neno la Kiebrania linaweza kumaanisha mungu wa kike Ashera au kifaa chake cha ibada; jina lisilo na ufafanuzi wa ziada linahifadhi utata huo.
- issue: Utambulisho wa הַקְּדֵשִׁים
  choice: makahaba wa ibada
  alternative: makahaba wa kiume wa ibada; watu waliowekwa wakfu
  rationale: Muktadha unaonyesha shughuli haramu ya kingono katika ibada. Umbo ni la kiume wingi, jambo linalowekwa wazi katika tanbihi bila kufanya sentensi kuu kuwa nzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Vyumba” huepuka picha isiyo ya kawaida ya nyumba tofauti ndani ya nyumba ya Yahweh, huku “vitambaa” kikidokeza kwa kawaida vitu vilivyofumwa. Alama zote za tanbihi zimewekwa katika matini kuu.
