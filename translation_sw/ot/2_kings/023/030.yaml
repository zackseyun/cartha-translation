  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: sw
  text: Watumishi wake wakamsafirisha[a] akiwa amekufa kutoka Megido, wakamleta Yerusalemu, na wakamzika katika kaburi lake. Kisha watu wa nchi[b] wakamchukua Yehoahazi mwana wa Yosia, wakamtia mafuta, na kumweka kuwa mfalme badala ya baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wakamsababisha apande”; hapa kitenzi hicho kinamaanisha kuusafirisha mwili wa Yosia.
    reason: lexical_alternative
  - marker: b
    text: “Watu wa nchi” ni usemi rasmi wa Kiebrania kwa wakazi wa eneo hilo waliotenda kama kundi lenye jukumu la kisiasa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: wakamsafirisha
  rationale: Hifili ya רכב kihalisi ni ‘kusababisha apande’; katika muktadha huu inaeleza kusafirishwa kwa mwili wa Yosia kutoka Megido. ‘Wakamsafirisha’ ni Kiswahili cha kawaida kinachohifadhi tendo bila kudokeza kwamba alikuwa hai.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עבד inaweza kumaanisha watumishi, wahudumu, au maofisa wa kifalme. ‘Watumishi wake’ ni tafsiri ya moja kwa moja, huku muktadha wa kifalme ukionyesha hadhi yao.
- source_word: מֵת
  choice: akiwa amekufa
  rationale: Neno hili linaonyesha hali ya Yosia wakati wa kusafirishwa. Kauli hii ni wazi na ya asili katika Kiswahili.
- source_word: מִמְּגִדּוֹ
  choice: kutoka Megido
  rationale: Hii ni kauli ya kawaida ya kuonyesha mahali safari ilipoanzia.
- source_word: וַיְבִאֻהוּ יְרוּשָׁלַם
  choice: wakamleta Yerusalemu
  rationale: בוא katika muundo huu humaanisha kumleta mtu mahali fulani; Kiswahili hakihitaji kihusishi cha ziada kabla ya jina la mji.
- source_word: וַיִּקְבְּרֻהוּ בִּקְבֻרָתוֹ
  choice: wakamzika katika kaburi lake
  rationale: ‘Kaburi’ linaweza kumaanisha kaburi au mahali pa maziko na linafaa katika muktadha wa maziko ya mfalme.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Huu ni usemi rasmi wa Kiebrania unaotaja wakazi wa nchi waliotenda kama kundi lenye jukumu la kisiasa. Tafsiri hii inahifadhi usemi huo bila kuufanya uwe tu ‘watu wa kawaida’.
- source_word: וַיִּקַּח
  choice: wakamchukua
  rationale: לקח kimsingi ni ‘kuchukua.’ Katika muktadha huu watu walimchukua Yehoahazi ili kumtawaza, bila kulazimisha maana maalumu zaidi kama ‘walimchagua.’
- source_word: יְהוֹאָחָז בֶּן יֹאשִׁיָּהוּ
  choice: Yehoahazi mwana wa Yosia
  rationale: Majina yameandikwa kwa namna inayotumika katika Kiswahili cha Biblia, na uhusiano wa kifamilia umehifadhiwa wazi.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: wakamtia mafuta
  rationale: משׁח ni tendo rasmi la kumpaka au kumtia mtu mafuta wakati wa kuwekwa katika ufalme. ‘Kumtia mafuta’ ni usemi wa kawaida wa kibiblia katika Kiswahili unaohifadhi tendo halisi na umuhimu wake wa kifalme.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: kumweka kuwa mfalme badala ya baba yake
  rationale: Kauli hii inaonyesha wazi kwamba Yehoahazi aliwekwa kutawala mahali pa Yosia baba yake.
theological_decisions:
- issue: Lugha ya kumweka mfalme kwa kumtia mafuta
  choice: wakamtia mafuta
  alternative: wakamtawaza / wakamweka rasmi
  rationale: Kiebrania kinataja wazi tendo la kumtia mafuta, lenye umuhimu wa kisiasa na wa kiibada katika ufalme wa Israeli. Tafsiri hailipunguzi kuwa uteuzi wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi wenye vitenzi vya ‘waka-’ umehifadhi mfuatano wa matendo ya Kiebrania bila kufanya sentensi kuwa ngumu.
