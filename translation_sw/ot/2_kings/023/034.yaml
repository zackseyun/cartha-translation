translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaendeleza ufupi wa simulizi la Kiebrania bila kufafanua ‘akamchukua’ kuwa ‘akamkamata.’
