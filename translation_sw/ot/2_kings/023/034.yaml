base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: sw
  text: Farao Neko akamweka Eliakimu mwana wa Yosia kuwa mfalme badala ya Yosia, baba yake, akalibadili jina lake kuwa Yehoyakimu. Lakini akamchukua Yehoahazi, naye akaja Misri[a] na kufia huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaenda Misri.” Kiebrania kinasema “akaja Misri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: akamweka ... kuwa mfalme
  rationale: Hifili ya מלך ina maana ya kusababisha au kumweka mtu atawale; kauli hii inaonyesha kwamba Farao Neko ndiye aliyemtawaza Eliakimu.
- source_word: תַּחַת
  choice: badala ya
  rationale: Katika muktadha wa urithi wa ufalme, neno hili linaonyesha kwamba Eliakimu alichukua nafasi ya Yosia.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: akalibadili jina lake
  rationale: Nahau ya Kiebrania ina maana ya kubadili jina la mtu; Kiswahili hiki ni cha kawaida na kinabaki karibu na muundo wa chanzo.
- source_word: יְהוֹיָקִים
  choice: Yehoyakimu
  rationale: Jina limetoholewa kwa kufuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: Lakini akamchukua Yehoahazi
  rationale: לקח kimsingi ni ‘chukua.’ Muktadha unaweza kudokeza kukamatwa au kuondolewa, lakini ‘akamchukua’ huepuka kuongeza maana isiyotajwa wazi; ‘lakini’ huonyesha mgeuko wa tendo.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: naye akaja Misri
  rationale: Kitenzi cha Kiebrania ni ‘alikuja,’ si ‘alikwenda.’ ‘Naye’ humtambulisha Yehoahazi, aliyetajwa mara moja kabla, kuwa mhusika wa kishazi hiki.
- source_word: וַיָּמָת שָׁם
  choice: na kufia huko
  rationale: 'Hii inawasilisha kwa ufupi hitimisho la simulizi: Yehoahazi alikufa Misri.'
