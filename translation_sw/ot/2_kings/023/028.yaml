  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Yosia na mambo yote aliyoyafanya, je, hayajaandikwa[a] katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hayajawekwa katika kumbukumbu.” Neno la Kiebrania linamaanisha kihalisi “yameandikwa,” lakini katika muktadha huu wa nyaraka linaweza pia kueleweka kuwa “yamewekwa katika kumbukumbu.”
    reason: lexical_alternative
  - marker: b
    text: “Kitabu cha Mambo ya Nyakati” hapa ni kumbukumbu ya kifalme inayotajwa kama chanzo katika kitabu cha Wafalme; si lazima kiwe vitabu vya Biblia vya 1–2 Mambo ya Nyakati katika umbo lake la mwisho la kikanoni.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: Matendo mengine ya Yosia
  rationale: Katika kauli hii ya muhtasari wa kifalme, יֶתֶר humaanisha yaliyobaki kutajwa, na דִּבְרֵי hurejelea matendo au shughuli za mfalme. “Matendo mengine” ni Kiswahili cha kawaida na chenye maana hiyo.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na mambo yote aliyoyafanya
  rationale: Tafsiri hii inahifadhi upana wa עשה na inaeleweka kwa urahisi bila kupunguza maana iwe mafanikio pekee.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: הֲלֹא huanzisha swali la balagha linalotarajia jibu la ndiyo. “Hayajaandikwa” linaonyesha hali ya mambo hayo kuwa tayari yameandikwa, sawasawa na kiambishi tendwa cha Kiebrania.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kimsingi ni “juu ya,” katika muktadha wa maandishi na kumbukumbu Kiswahili cha kawaida husema jambo limeandikwa “katika kitabu.”
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda
  rationale: Hili ni jina la kumbukumbu za kifalme linalotajwa mara kwa mara katika Wafalme. “Mambo ya Nyakati” linafikisha maana ya rekodi ya matukio yaliyopangwa kwa nyakati.
theological_decisions:
- issue: Utambulisho wa Kitabu cha Mambo ya Nyakati
  choice: Kichukuliwe kama chanzo cha kumbukumbu za kifalme kinachotajwa katika Wafalme.
  alternative: Kikitambulishe moja kwa moja na vitabu vya Biblia vya 1–2 Mambo ya Nyakati katika umbo lake la mwisho.
  rationale: Andiko lenyewe linataja chanzo cha kifalme lakini halisemi kwamba ni lazima kiwe vitabu vya kikanoni vya 1–2 Mambo ya Nyakati; tanbihi inahifadhi tofauti hiyo bila kutoa dai lisilothibitishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Muundo wa swali la balagha umehifadhiwa, na hakuna kiunganishi cha mwanzo kama “Basi” kilichoongezwa kwa kuwa hakina neno la wazi linalolingana nacho katika chanzo.
