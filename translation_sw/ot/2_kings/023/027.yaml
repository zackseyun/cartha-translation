  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: sw
  text: Yahwe akasema, “Pia nitaiondoa Yuda kutoka mbele yangu, kama nilivyoiondoa Israeli; nami nitaukataa[a] mji huu niliouchagua—Yerusalemu—na nyumba[b] ambayo nilisema, ‘Jina langu litakuwa humo.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nimeukataa mji huu niliouchagua—Yerusalemu.” Kitenzi cha Kiebrania kinaweza kusomwa kama tendo lililokamilika, ingawa hapa kimetafsiriwa kwa wakati ujao kulingana na tamko la hukumu linalokizunguka.
    reason: alternative_reading
  - marker: b
    text: Au, “hekalu.” Neno la Kiebrania ni “nyumba,” likirejelea hekalu la Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililo katika Kiebrania kwa umbo la kawaida na linalosomeka kwa Kiswahili.
- source_word: אָסִיר / הֲסִרֹתִי (סור katika Hiphil)
  choice: nitaiondoa / nilivyoiondoa
  rationale: Hiphil inaonyesha kusababisha kitu kiondoke. ‘Kuondoa’ ni ya asili katika Kiswahili na inadumisha ulinganifu wa hukumu kati ya Yuda na Israeli.
- source_word: מֵעַל פָּנַי
  choice: kutoka mbele yangu
  rationale: Inahifadhi picha ya nahau ya Kiebrania bila kutumia tafsiri pana zaidi kama ‘kutoka katika uwepo wangu.’
- source_word: גַּם
  choice: pia
  rationale: Inaonyesha kwamba Yuda itapatwa na hukumu inayolingana na ile ya Israeli.
- source_word: כַּאֲשֶׁר
  choice: kama ... -vyo-
  rationale: Muundo ‘kama nilivyoiondoa’ unaonyesha wazi ulinganisho wa tendo litakalofanywa kwa Yuda na lile lililofanywa kwa Israeli.
- source_word: וּמָאַסְתִּי
  choice: nami nitaukataa
  rationale: Ingawa kitenzi kina umbo la qatal, muktadha wa tamko la hukumu unaelekeza kwenye nguvu ya wakati ujao. ‘Kukataa’ huonyesha kuikataa Yerusalemu bila kuongeza hisia kali ya ‘kudharau.’
- source_word: אֲשֶׁר בָּחַרְתִּי
  choice: niliouchagua
  rationale: Wakati uliopita unaonyesha uchaguzi wa Yerusalemu uliofanywa hapo awali, na upatanisho wa ngeli unarejelea ‘mji.’
- source_word: אֶת יְרוּשָׁלִַם
  choice: —Yerusalemu—
  rationale: Jina hili linautambulisha mji uliotajwa; vistari virefu vinaonyesha kibainishi hicho kwa uwazi.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Hili ndilo neno halisi la Kiebrania na hapa linarejelea hekalu; kulitunza kunahifadhi msamiati na mwangwi wa kiteolojia wa chanzo.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: Jina langu litakuwa humo
  rationale: Tafsiri hii ni ya moja kwa moja na ya asili, huku ‘humo’ ikirejelea nyumba iliyotajwa.
theological_decisions:
- issue: Nguvu ya wakati ya וּמָאַסְתִּי katika tamko la kinabii la hukumu
  choice: 'Kutafsiri kwa wakati ujao: ‘nami nitaukataa’'
  alternative: nami nimeukataa
  rationale: Umbo la Kiebrania linaweza kueleweka kama tendo lililokamilika, lakini mtiririko wa tamko unaanza na hukumu ijayo, ‘nitaiondoa Yuda.’ Wakati ujao unadumisha mtiririko huo bila kuficha uwezekano mwingine, ambao umewekwa katika tanbihi.
- issue: Tafsiri ya הַבַּיִת
  choice: Kutumia ‘nyumba’ katika matini kuu
  alternative: hekalu
  rationale: Kiebrania kinasema ‘nyumba,’ ingawa kinarejelea hekalu la Yerusalemu. Neno la chanzo limehifadhiwa, na maana yake imefafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi ulinganifu wa Yuda na Israeli, huku ‘nyumba’ na ‘Jina langu litakuwa humo’ vikidumisha picha ya Kiebrania.
