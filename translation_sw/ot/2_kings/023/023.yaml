  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: sw
  text: Ila ilikuwa ni katika mwaka wa kumi na nane wa Mfalme Yosia tu ndipo Pasaka hii iliadhimishwa kwa Yahwe huko Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ilifanywa”; yaani, “iliadhimishwa” au “ilizingatiwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ila ... tu
  rationale: Muundo huu unaonyesha tofauti yenye maana ya upekee kwa kurejelea kauli ya mstari uliotangulia kwamba Pasaka ya namna hiyo haikuwa imeadhimishwa.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: katika mwaka wa kumi na nane wa utawala wa Mfalme Yosia
  rationale: Hii ni njia ya kawaida na iliyo wazi ya Kiswahili ya kutaja mwaka wa utawala wa mfalme.
- source_word: נַעֲשָׂה
  choice: iliadhimishwa
  rationale: Kitenzi hiki kwa maana ya msingi ni ‘ilifanywa,’ lakini Pasaka inapokuwa kiima humaanisha kwamba sherehe hiyo iliadhimishwa; hali ya kutendwa imehifadhiwa.
- source_word: הַפֶּסַח הַזֶּה
  choice: Pasaka hii
  rationale: Tafsiri ya moja kwa moja ya kirai chenye kiashiria, kwa kutumia jina la sherehe lililozoeleka katika Kiswahili.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Herufi ya uhusiano ל hapa inaonyesha kwamba maadhimisho yalielekezwa au kuwekwa wakfu kwa Yahwe.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Tafsiri ya mahali; ‘huko’ inasikika kwa kawaida baada ya taarifa iliyotangulia ya wakati na tendo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘ila ... tu ambapo’ umechaguliwa ili kuhifadhi msisitizo wa upekee uliomo katika כִּי אִם; ‘iliadhimishwa’ ni wa kawaida zaidi kwa Pasaka kuliko tafsiri halisi ‘ilifanywa.’
