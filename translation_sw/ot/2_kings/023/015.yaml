base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: sw
  text: Pia, madhabahu iliyokuwa Betheli, katika mahali pa juu palipotengenezwa na Yeroboamu mwana wa Nebati, aliyesababisha Israeli kutenda dhambi—madhabahu hiyo pamoja na mahali hapo pa juu aliibomoa. Akachoma moto mahali hapo pa juu, yaani kituo hicho cha ibada, akakiponda kuwa mavumbi, kisha akamchoma moto Ashera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo ya Ashera”; neno la Kiebrania linaweza kumaanisha kitu cha ibada kilichohusishwa na ibada ya Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa altar ya ibada, bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- source_word: בְּבֵית אֵל
  choice: iliyokuwa Betheli
  rationale: Muundo huu unaonyesha mahali ilipokuwa madhabahu kwa Kiswahili cha kawaida.
- source_word: הַבָּמָה
  choice: mahali pa juu
  rationale: Huhifadhi maana ya kiufundi ya eneo la ibada lililoinuka na pia tofauti yake na madhabahu iliyotajwa kando.
- source_word: עָשָׂה
  choice: palipotengenezwa
  rationale: Kitenzi cha jumla 'tengeneza' kinabaki karibu na maana ya עשה kuliko 'jenga'; hali ya kutendwa inawezesha sentensi ya Kiswahili iliyo wazi bila kubadili mhusika wa tendo.
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: aliyesababisha Israeli kutenda dhambi
  rationale: Huhifadhi nguvu ya kisababishi ya kitenzi cha Kiebrania bila kuipunguza kuwa ushawishi tu.
- source_word: הַמִּזְבֵּחַ הַהוּא
  choice: madhabahu hiyo
  rationale: Kirudiaji pamoja na kiashiria kinadumisha msisitizo wa madhabahu ileile iliyotajwa.
- source_word: נָתָץ
  choice: aliibomoa
  rationale: Kitenzi hiki kinaeleza kwa kawaida kuvunjwa na kuangushwa kwa jengo au kitu kilichojengwa.
- source_word: וַיִּשְׂרֹף אֶת־הַבָּמָה
  choice: akapachoma moto mahali hapo pa juu
  rationale: Kinarudia istilahi ileile ya במה na kuhifadhi mfuatano wa matendo katika simulizi.
- source_word: הֵדַק לְעָפָר
  choice: kukiponda mpaka kikawa mavumbi
  rationale: Huwasilisha tendo la kukivunjavunja kabisa na matokeo yake kuwa mavumbi; kiwakilishi kinarejelea kitu cha mahali hapo kilichochomwa.
- source_word: אֲשֵׁרָה
  choice: Ashera
  rationale: Jina la Kiebrania linahifadhiwa ili kutolazimisha uamuzi kati ya mungu wa kike na kifaa cha ibada kinachohusishwa naye; ufafanuzi umetolewa katika tanbihi.
theological_decisions:
- issue: Maana ya אֲשֵׁרָה
  choice: Ashera
  alternative: nguzo ya Ashera; nguzo takatifu
  rationale: Katika muktadha huu kitu cha ibada ndicho kinachoelekea kumaanishwa kwa kuwa kinachomwa moto, lakini neno lenyewe linaweza kumtaja Ashera au kitu cha ibada kinachohusishwa naye. Kutumia 'Ashera' katika matini na kuweka maelezo chini kunahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Maandiko. Sentensi ndefu ya Kiebrania imehifadhiwa kwa vistari virefu ili kuonyesha maelezo ya kati bila kupoteza mtiririko. Kiashiria cha tanbihi [a] kimewekwa baada ya 'Ashera', ambako maelezo yake yanahusika.
