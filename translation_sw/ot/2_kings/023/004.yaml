id: 2KI.23.4
reference: 2 Kings 23:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: sw
  text: Kisha mfalme aliwaamuru Hilkia, kuhani mkuu, makuhani wa daraja la pili, na walinzi wa kizingiti watoe kutoka hekalu la Yahweh vyombo vyote vilivyotengenezwa kwa ajili ya Baali, Ashera[a], na jeshi lote la mbinguni. Akaviteketeza nje ya Yerusalemu katika mashamba ya Kidroni, kisha akapeleka mavumbi yao Betheli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo ya Ashera”; neno la Kiebrania אֲשֵׁרָה linaweza kumaanisha mungu wa kike Ashera au kitu cha ibada kilichohusishwa naye.
    reason: Mbadala wa kileksia unaohifadhi utata halisi wa neno la Kiebrania.
lexical_decisions:
- source_word: וַיְצַו
  choice: akamwamuru
  rationale: Kitenzi hiki kinaonyesha amri yenye mamlaka ya mfalme na kinaendeleza simulizi kwa kawaida katika Kiswahili.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa cheo cha juu cha ukuhani.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: makuhani wa daraja la pili
  rationale: Huhifadhi wazo la cheo cha pili bila kudai kwa uhakika muundo maalumu wa taasisi.
- source_word: שֹׁמְרֵי הַסַּף
  choice: walinzi wa kizingiti
  rationale: Tafsiri hii huhifadhi taswira halisi ya kizingiti pamoja na maana ya jukumu rasmi la hekalu.
- source_word: מֵהֵיכַל יְהוָה
  choice: katika hekalu la Yahweh
  rationale: Muktadha wa makuhani na vyombo vya ibada unaonyesha kuwa הֵיכָל ni hekalu; jina la agano יְהוָה limetoholewa kuwa Yahweh.
- source_word: כָּל הַכֵּלִים
  choice: vyombo vyote
  rationale: Vyombo ni neno pana na la kawaida kwa vitu au vifaa vilivyotumiwa katika ibada.
- source_word: לַבַּעַל
  choice: kwa ajili ya Baali
  rationale: Muundo huu huonyesha kwamba vyombo vilikusudiwa kwa ibada ya Baali.
- source_word: לָאֲשֵׁרָה
  choice: kwa ajili ya Ashera
  rationale: Huhifadhi uwezekano kwamba neno linamtaja mungu wa kike, bila kufuta uwezekano wa kuwa kitu cha ibada kinachohusishwa naye.
- source_word: כֹל צְבָא הַשָּׁמָיִם
  choice: jeshi lote la mbinguni
  rationale: Hii ni tafsiri ya karibu ya usemi wa Kiebrania unaorejelea viumbe au miili ya angani iliyoabudiwa.
- source_word: וַיִּשְׂרְפֵם
  choice: akaviteketeza
  rationale: Kitenzi kinaonyesha kuvichoma kabisa; kiwakilishi cha ngeli ya vyombo kinaweka wazi rejeo lake.
- source_word: עֲפָרָם
  choice: mavumbi yake
  rationale: עָפָר humaanisha vumbi au mavumbi; hapa ni mabaki yaliyosagika baada ya kuteketezwa, si lazima majivu pekee.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano lenyewe; 'Yahweh' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Rejeo la אֲשֵׁרָה
  choice: Ashera katika maandishi, pamoja na tanbihi
  alternative: nguzo ya Ashera au sanamu ya Ashera
  rationale: Katika orodha ya 'kwa ajili ya Baali, Ashera, na jeshi lote la mbinguni,' tafsiri ya jina huhifadhi muundo wa walengwa wa ibada, huku tanbihi ikidumisha utata wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo wa simulizi umetumia viambishi vya mfululizo vya -ka-. 'Walinzi wa kizingiti' na 'jeshi la mbinguni' zimehifadhiwa kwa ukaribu na chanzo, huku mpangilio wa sentensi ukibaki wa kawaida katika Kiswahili.
