base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: sw
  text: Yehoahazi alikuwa na umri wa miaka ishirini na mitatu alipoanza kutawala, naye akatawala katika Yerusalemu kwa miezi mitatu. Mama yake aliitwa Hamutali, binti ya Yeremia wa Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na mitatu
  rationale: Nahau ya Kiebrania ya kutaja umri imetafsiriwa kwa Kiswahili cha kawaida na sahihi.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati wa kuanza kwa utawala wake.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi kinataja utawala wake na kinaunganishwa kiasili na muda wa miezi mitatu.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: kwa miezi mitatu
  rationale: Kihusishi “kwa” kinaonyesha kwa uwazi muda aliotawala katika Kiswahili cha kawaida.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Mahali pa utawala pamewasilishwa kwa jina la kawaida la Kiswahili; maana ya “katika” imo katika muundo “akatawala Yerusalemu.”
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba jina la mama yake lilikuwa fulani.
- source_word: חֲמוּטַל
  choice: Hamutali
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בַּת יִרְמְיָהוּ
  choice: binti ya Yeremia
  rationale: בַּת inaonyesha uhusiano wa mtoto wa kike na baba; “Yeremia” ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: מִלִּבְנָה
  choice: wa Libna
  rationale: מן hapa inaonyesha asili au uhusiano wa Yeremia na mji wa Libna; “wa Libna” ni fupi na ya asili katika taarifa ya ukoo.
