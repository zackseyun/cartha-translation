id: 2KI.23.24
reference: 2 Kings 23:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: sw
  text: Zaidi ya hayo, Yosia aliondoa waaguzi wa mizimu, wapiga ramli, miungu ya nyumbani, sanamu, na machukizo yote yaliyoonekana katika nchi ya Yuda na katika Yerusalemu, ili kutekeleza maneno ya Torati yaliyoandikwa katika kitabu[a] ambacho kuhani Hilkia alikipata katika nyumba ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye gombo.” Neno la Kiebrania linaweza kumaanisha hati iliyoandikwa katika umbo la gombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Zaidi ya hayo
  rationale: Inaendeleza orodha ya matendo ya mageuzi ya Yosia huku ikihifadhi nguvu ya nyongeza ya Kiebrania.
- source_word: הָאֹבוֹת
  choice: waaguzi wa mizimu
  rationale: Katika muktadha huu neno linaelekea kumaanisha watu waliotumiwa kuwasiliana na wafu; tafsiri hii ni wazi na ya kawaida kwa Kiswahili cha sasa.
- source_word: הַיִּדְּעֹנִים
  choice: wapiga ramli
  rationale: Ni neno linaloambatana na אֹבוֹת na kumaanisha watendaji wa uganga wa kiroho; uchaguzi huu unaepuka istilahi za kizamani au zisizoeleweka.
- source_word: הַתְּרָפִים
  choice: miungu ya nyumbani
  rationale: Inarejelea sanamu au miungu ya ibada za kifamilia; tafsiri ya maana inaeleweka kuliko kunukuu neno 'terafimu'.
- source_word: הַגִּלֻּלִים
  choice: sanamu
  rationale: Ni jina la dharau kwa vitu vya ibada ya sanamu. 'Sanamu' ni neno la kawaida, ingawa halibebi kikamilifu dharau kali ya Kiebrania.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: machukizo yote
  rationale: Inahifadhi upana na uzito wa kimaadili na kidini wa neno, bila kulibana kwa sanamu pekee.
- source_word: נִרְאוּ
  choice: yaliyoonekana
  rationale: Inafuata hali ya kutendwa ya Kiebrania na kuonyesha kuwa mambo hayo yalikuwa yakionekana au kuwapo wazi katika nchi.
- source_word: בִּעֵר
  choice: aliwaondoa
  rationale: Kitenzi kinaweza kumaanisha kufutilia mbali au kuondoa kabisa. Kwa kuwa orodha inajumuisha watu na vitu, 'aliwaondoa' haibainishi kimakosa njia moja ya utekelezaji.
- source_word: לְמַעַן הָקִים
  choice: ili kutekeleza
  rationale: Inaonyesha kusudi la kuyaweka maneno ya Torati katika matendo; ni ya asili zaidi kwa Kiswahili kuliko 'kuyasimamisha' na haidokezi unabii uliotimia.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: maneno ya Torati
  rationale: Katika muktadha huu תּוֹרָה ni mafundisho au sheria ya agano iliyo katika hati iliyopatikana; 'Torati' ni istilahi inayotambulika na yenye hadhi katika Kiswahili.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: yaliyoandikwa katika kitabu[a]
  rationale: Hutoa Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano wa hati hiyo kuwa gombo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Inahifadhi kwa karibu tamathali ya Kiebrania 'nyumba ya YHWH' badala ya kuifasiri moja kwa moja kuwa hekalu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Unawakilisha jina binafsi la Kiebrania moja kwa moja na kufuata sera ya mradi, bila kulibadilisha kuwa cheo.
- issue: Maana ya kutekeleza maneno ya Torati
  choice: ili kutekeleza
  alternative: ili kuyathibitisha; ili kuyatimiza
  rationale: Kiebrania kina wazo la kuyafanya maneno yasimame au yaanze kutumika. 'Kutekeleza' huonyesha utiifu wa vitendo bila kudokeza kwamba maneno hayo yalikuwa lazima unabii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ndefu ya Kiebrania imegawanywa mara mbili ili iwe rahisi kueleweka, huku uhusiano wa kusudi ukihifadhiwa kwa 'Alifanya hivyo ili'. Istilahi za mambo ya kiroho zimetafsiriwa kwa lugha inayoeleweka bila kuingiza msimamo wa dhehebu.
