  text: וְ/כָמֹ/הוּ֩ לֹֽא הָיָ֨ה לְ/פָנָ֜י/ו מֶ֗לֶךְ אֲשֶׁר שָׁ֤ב אֶל יְהוָה֙ בְּ/כָל לְבָב֤/וֹ וּ/בְ/כָל נַפְשׁ/וֹ֙ וּ/בְ/כָל מְאֹד֔/וֹ כְּ/כֹ֖ל תּוֹרַ֣ת מֹשֶׁ֑ה וְ/אַחֲרָ֖י/ו לֹֽא קָ֥ם כָּמֹֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: sw
  text: Kabla yake hakuwapo mfalme kama yeye, aliyemgeukia Yahwe[a] kwa moyo wake wote, kwa nafsi yake yote, na kwa nguvu zake zote[b][c], kwa kufuata Sheria yote ya Musa; wala baada yake hakuinuka mwingine kama yeye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyemrudia Yahwe.” Kitenzi cha Kiebrania kinaweza kumaanisha kumrudia Mungu kwa toba na uaminifu wa agano.
    reason: lexical_alternative
  - marker: b
    text: Maneno “kwa moyo wake wote, kwa nafsi yake yote, na kwa nguvu zake zote” yana mwangwi wa Kumbukumbu la Torati 6:5.
    reason: cross_reference
  - marker: c
    text: Au, “kwa uwezo wake wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: Kabla yake hakuwapo mfalme kama yeye
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unadumisha msisitizo wa Kiebrania kwamba hakuna mfalme wa awali aliyelingana na Yosia.
- source_word: שָׁב אֶל יְהוָה
  choice: aliyemgeukia Yahwe
  rationale: Kitenzi שׁוב pamoja na אֶל hapa kinaonyesha kumwelekea au kumrudia Mungu kwa toba na uaminifu wa agano. ‘Kumgeukia’ kinadumisha maana hiyo bila kuibana kuwa toba pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: בְּכָל לְבָבוֹ
  choice: kwa moyo wake wote
  rationale: Hii inadumisha nahau ya Kiebrania kuhusu nia, fikira, na mapenzi ya ndani.
- source_word: וּבְכָל נַפְשׁוֹ
  choice: kwa nafsi yake yote
  rationale: ‘Nafsi’ inadumisha neno la kifungu cha Kumbukumbu la Torati na wazo la mtu mzima au uhai wake.
- source_word: וּבְכָל מְאֹדוֹ
  choice: na kwa nguvu zake zote
  rationale: Katika kauli hii מְאֹד huonyesha uwezo au nguvu zote za mtu. Tafsiri hii ni ya kawaida na inahifadhi mwangwi wa Kumbukumbu la Torati 6:5.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: sawasawa na Sheria yote ya Musa
  rationale: כְּכֹל huonyesha kupatana na yote yaliyoagizwa, na תּוֹרָה katika muktadha huu inarejelea Sheria ya Musa.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: wala baada yake hakuinuka mwingine kama yeye
  rationale: ‘Hakuinuka’ huakisi קָם huku ‘mwingine’ ikifanya sentensi iwe wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Mwangwi wa Kumbukumbu la Torati 6:5 katika maelezo ya kujitoa kwa Yosia
  choice: Kudumisha utatu wa ‘moyo... nafsi... nguvu’ katika matini kuu
  alternative: moyo... uhai... uwezo
  rationale: Maneno hayo yanakusudia kuhusisha uaminifu wa Yosia na agizo la kumpenda Yahwe kwa ukamilifu; kudumisha utatu huo kunahifadhi uhusiano wa kimaandiko bila kuufafanua kupita kiasi.
- issue: Tafsiri ya jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שָׁב אֶל katika uaminifu wa Yosia
  choice: aliyemgeukia Yahwe
  alternative: aliyemrudia Yahwe; aliyetubu mbele za Yahwe
  rationale: ‘Kumgeukia’ huhifadhi maana pana ya kurudi katika uaminifu wa agano na toba bila kudai kwamba kitenzi kinamaanisha tu tendo maalumu la kutubu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Hakuwapo’ na ‘hakuinuka mwingine’ hudumisha hadhi ya simulizi la kifalme bila kuwa lugha ya kizamani kupita kiasi.
