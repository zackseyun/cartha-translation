source:
  edition: WLC
  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: sw
  text: Nazo madhabahu zilizokuwa juu ya paa la chumba cha juu cha Ahazi[a], ambazo wafalme wa Yuda walikuwa wamejenga, pamoja na madhabahu ambazo Manase alikuwa amejenga katika nyua mbili za nyumba ya Yahweh, mfalme alizibomoa, akaziponda hapo[b], kisha akatupa vumbi lao katika Bonde la Kidroni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chumba cha ghorofani cha Ahazi.” Neno la Kiebrania עֲלִיָּה linaweza kumaanisha chumba cha juu au chumba cha ghorofani.
    reason: lexical_alternative
  - marker: b
    text: Maana ya Kiebrania hapa si wazi. Katika muktadha huu yaelekea ni “akaziponda hapo”; usomaji wa irabu za Kimasora huweza kueleweka “akakimbia kutoka pale.”
    reason: textual_ambiguity
  - marker: c
    text: Au “kijito cha Kidroni.” Neno la Kiebrania נַחַל linaweza kumaanisha bonde, korongo lenye kijito cha msimu, au kijito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: madhabahu
  rationale: מִזְבֵּחַ humaanisha mahali au jengo la kutolea dhabihu; wingi wa neno umehifadhiwa kwa kutumia “madhabahu,” ambalo umbo lake halibadiliki katika umoja na wingi.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: juu ya paa la chumba cha juu cha Ahazi
  rationale: Tafsiri hii inahifadhi uhusiano wa kimuundo kati ya paa na עֲלִיָּה bila kuamua kwa nguvu kama lilikuwa chumba au ghorofa nzima.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: katika nyua mbili za nyumba ya Yahweh
  rationale: “Nyua” ni Kiswahili cha kawaida kwa חֲצֵרוֹת, na “nyumba ya Yahweh” huhifadhi nahau ya Kiebrania badala ya kuibadili kuwa “hekalu.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: נָתַץ
  choice: alizibomoa
  rationale: Kitenzi hiki huonyesha kubomoa au kuangusha miundo, maana inayofaa madhabahu.
- source_word: וַיָּרָץ מִשָּׁם
  choice: akaziponda hapo
  rationale: Katika mfuatano wa kubomoa madhabahu na kutupa vumbi lake, maana ya kuponda mabaki inafaa muktadha; ugumu wa umbo la Kiebrania umeonyeshwa katika tanbihi.
- source_word: עֲפָרָם
  choice: vumbi lake
  rationale: עָפָר ni vumbi au udongo laini; Kiswahili hutumia “vumbi” kama nomino ya jumla, na “lake” hurejelea kwa pamoja vumbi la madhabahu hizo.
- source_word: נַחַל קִדְרוֹן
  choice: Bonde la Kidroni
  rationale: נַחַל inaweza kuwa bonde, korongo, au kijito cha msimu; “Bonde la Kidroni” ni usemi wazi na wa kawaida kwa eneo hili.
- source_word: וְאֶת ... וְאֶת
  choice: Nazo ... pamoja na ...
  rationale: Muundo huu unaonyesha viambajengo vilivyotangulizwa kama yambwa kabla ya kitenzi kikuu, huku ukiendelea kuwa wa asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya וַיָּרָץ katika muktadha huu
  choice: akaziponda hapo
  alternative: akakimbia kutoka pale
  rationale: Usomaji wa kuponda unaendana na kubomolewa kwa madhabahu na vumbi linalotupwa baadaye, lakini umbo lililowekewa irabu katika maandishi ya Kimasora linaweza kueleweka kama “akakimbia”; tanbihi inalinda mvutano huo wa kimaandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Nyumba ya Yahweh” imehifadhiwa ili kufuata taswira ya Kiebrania, na sentensi ndefu imepangiliwa kwa viunganishi vya asili bila kupoteza utangulizi wa yambwa katika chanzo.
