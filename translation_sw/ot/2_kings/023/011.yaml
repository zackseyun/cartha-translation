revisions:
- from: Akawaondoa farasi ambao wafalme wa Yuda walikuwa wamewaweka wakfu kwa jua. Farasi hao walikuwa kutoka mwingilio wa nyumba ya Yahweh hadi chumba cha Nethan-Meleki, ofisa wa ikulu[a], kilichokuwa katika eneo la pembeni[b]. Pia akayateketeza kwa moto magari ya jua.
  to: Akawaondoa farasi ambao wafalme wa Yuda walikuwa wamewaweka wakfu kwa jua, kutoka kwenye mlango wa kuingilia wa nyumba ya Yahweh hadi chumba cha Nethan-meleki, afisa wa ikulu[a] aliyekuwa katika eneo la pembezoni[b]. Pia akayateketeza kwa moto magari ya jua.
  rationale: Marekebisho yanarejesha kirejeshi kwa Nethan-meleki, ambaye ndiye afisa anayeelezwa kuwa katika Parwarimu, na yanaunganisha kwa kawaida kirai "kutoka ... hadi ..." na tendo la Yosia la kuwaondoa farasi. Maana ya eneo adimu la Parwarimu imeachwa kwa tahadhari, huku tanbihi ikihifadhi mbadala.
