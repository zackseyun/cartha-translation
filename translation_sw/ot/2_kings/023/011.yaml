id: 2KI.23.11
reference: 2 Kings 23:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: sw
  text: Akawaondoa farasi ambao wafalme wa Yuda walikuwa wamewaweka wakfu kwa jua, kutoka kwenye mlango wa kuingilia wa nyumba ya Yahweh hadi chumba cha Nethan-meleki, afisa wa ikulu[a] aliyekuwa katika eneo la pembezoni[b]. Pia akayateketeza kwa moto magari ya jua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “towashi”; neno la Kiebrania linaweza kumaanisha towashi au afisa wa kifalme au wa ikulu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania hapa ni adimu, na huenda linataja sehemu ya nje au ya pembezoni mwa eneo la hekalu. Pia limetafsiriwa “viunga” au “baraza zenye nguzo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: Akawaondoa
  rationale: Hifili ya שׁבת humaanisha kukomesha au kuondoa katika matumizi; katika muktadha huu wa mageuzi ya ibada, “akawaondoa” ni ya kawaida na inaeleweka wazi.
- source_word: הַסּוּסִים
  choice: farasi
  rationale: Ni nomino ya wingi yenye maana ya moja kwa moja; Kiswahili hakihitaji kibainishi tofauti kuonyesha ule umaalumu.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: ambao wafalme wa Yuda walikuwa wamewaweka wakfu kwa jua
  rationale: Ingawa נתן kimsingi ni “kutoa,” muktadha wa ibada unaonyesha kuwa farasi hao waliwekwa kwa matumizi ya ibada ya jua; “kuweka wakfu” hueleza hilo bila kupanua maana kupita kiasi.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: kutoka mwingilio wa nyumba ya Yahweh hadi chumba cha
  rationale: Muundo wa מִן ... אֶל umehifadhiwa kama maelezo ya eneo linaloanzia mwingilioni na kuelekea chumbani, badala ya kuugeuza kimya kimya kuwa mahali pamoja tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: נְתַן מֶלֶךְ
  choice: Nethan-Meleki
  rationale: Jina binafsi limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata matamshi ya Kiebrania.
- source_word: הַסָּרִיס
  choice: ofisa wa ikulu
  rationale: סָרִיס inaweza kumaanisha towashi au ofisa wa kifalme; “ofisa wa ikulu” haidai hali ya kimwili ambayo muktadha hauithibitishi.
- source_word: בַּפַּרְוָרִים
  choice: katika eneo la pembeni
  rationale: Neno hili adimu linaonekana kutaja sehemu ya nje au ya pembezoni mwa eneo la hekalu; tafsiri hii inaepuka uhakika usiostahili.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: magari ya jua
  rationale: Tafsiri ya karibu huhifadhi taswira ya ibada iliyomo katika Kiebrania.
- source_word: שָׂרַף בָּאֵשׁ
  choice: akayateketeza kwa moto
  rationale: “Kutekeza kwa moto” huhifadhi kutajwa wazi kwa moto na kutoa Kiswahili cha asili chenye mkazo unaofaa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Kifungu kinatumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Kueleza matumizi ya farasi katika ibada ya jua
  choice: waliokuwa wamewaweka wakfu kwa jua
  alternative: waliokuwa wametoa kwa jua
  rationale: Muktadha unaonyesha kuwekwa kwa ajili ya ibada, lakini neno “jua” limeachwa kama nomino ya kawaida ili kutolitambulisha kwa uhakika usio katika maandishi kuwa jina maalumu la mungu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kiebrania imegawanywa ili maelezo ya mahali yasomeke kwa urahisi. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno husika, kwa kuwa mpangilio wa tanbihi katika safu ya Kiingereza haukulingana na viashiria vyake.
