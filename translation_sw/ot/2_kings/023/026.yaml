  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: sw
  text: Hata hivyo, Yahweh hakugeuka kutoka katika hasira yake kuu inayowaka[a], ambayo iliwaka dhidi ya Yuda[b], kwa sababu ya mambo yote ya kuchokoza ambayo Manase alikuwa amemchokoza nayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika ukali wa hasira yake kuu.” Kiebrania hutumia nahau inayosema kihalisi kuhusu kuwaka kwa pua/hasira, ikimaanisha hasira kali.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Yuda.” Kihusishi cha Kiebrania ni “katika,” lakini katika Kiswahili hasira kwa kawaida husemwa kuwaka “dhidi ya” mtu au taifa inapolengwa kwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Huonyesha tofauti kubwa kati ya mageuzi ya Yosia yaliyotangulia na kuendelea kwa hasira ya Yahweh.
- source_word: שָׁב
  choice: hakugeuka
  rationale: Huhifadhi sitiari ya Kiebrania ya kugeuka au kurudi, bila kuifafanua zaidi kuwa ‘hakughairi.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ni uwasilishaji wa moja kwa moja wa jina la Mungu YHWH kulingana na utaratibu wa mradi.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: kutoka katika hasira yake kuu inayowaka
  rationale: Huhifadhi picha ya Kiebrania ya hasira inayowaka na pia sifa ya ukubwa wake, kwa Kiswahili kinachoeleweka.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: ambayo iliwaka
  rationale: Huhifadhi urudiaji wa wazo la kuwaka kwa hasira uliomo katika Kiebrania badala ya kuufupisha.
- source_word: בִּיהוּדָה
  choice: dhidi ya Yuda
  rationale: Ingawa kihusishi cha Kiebrania kwa kawaida ni ‘katika,’ hapa Yuda ndiye anayelengwa na hasira; ‘dhidi ya’ ni Kiswahili cha kawaida katika muktadha huu.
- source_word: עַל כָּל הַכְּעָסִים
  choice: kwa sababu ya mambo yote ya kuchokoza
  rationale: Nomino hii inaelekea kumaanisha matendo yanayochochea hasira; kifungu hiki kinaonyesha sababu ya hasira hiyo.
- source_word: הִכְעִיסוֹ
  choice: alikuwa amemchokoza
  rationale: Huhifadhi maana ya kisababishi ya kitenzi—kumsababisha mtu akasirike—pamoja na mwangwi wa ‘mambo ya kuchokoza.’
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Lugha ya kibinadamu kuhusu hasira ya Mungu
  choice: Kudumisha picha ya ‘hasira inayowaka’
  alternative: ‘ghadhabu kali’ au ‘kutopendezwa sana’
  rationale: Kiebrania kinatumia wazi nahau za mwili na moto kueleza hasira. Tafsiri haizilegezi wala kuzipa ufafanuzi wa kimafundisho usiomo katika mstari.
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Jina maalumu יְהוָה limewasilishwa kama Yahweh badala ya kubadilishwa kuwa cheo.
- issue: Maana ya שָׁב katika muktadha wa hasira ya Mungu
  choice: hakugeuka
  alternative: hakughairi
  rationale: ‘Hakugeuka’ huhifadhi sitiari ya chanzo na haimalizi mvutano wa kifungu kwa kuingiza kwa uwazi zaidi dhana ya kughairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘hasira inayowaka … iliwaka’ umehifadhiwa kwa makusudi ili kuakisi msisitizo wa Kiebrania; ‘mambo ya kuchokoza … amemchokoza’ vilevile huhifadhi mchezo wa mzizi wa neno.
