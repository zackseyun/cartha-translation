  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: sw
  text: Kisha Yosia akageuka, akaona makaburi yaliyokuwa huko mlimani[a]. Akatuma, akachukua mifupa kutoka makaburini, akaichoma juu ya madhabahu na kuitia unajisi, sawasawa na neno la Yahwe ambalo mtu wa Mungu alilitangaza[b], yeye aliyekuwa ametangaza mambo haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahala pa kuzikia.” Neno la Kiebrania linaweza kurejelea mahali pa kuzikia kwa jumla, si makaburi yaliyojengwa tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “alilipaza sauti” / “aliliita kwa sauti.” Kitenzi cha Kiebrania kinaweza kusisitiza tangazo la hadharani kwa sauti kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: akageuka
  rationale: Kitenzi פנה hapa kinaonyesha kugeuka kwa Yosia kabla ya kuyaona makaburi; “akageuka” ni simulizi la kawaida na la moja kwa moja.
- source_word: הַקְּבָרִים
  choice: makaburi
  rationale: קבר inaweza kumaanisha kaburi au mahali pa kuzikia. “Makaburi” ni neno la kawaida la Kiswahili linalofaa kwa maeneo yanayoonekana mlimani.
- source_word: בָּהָר
  choice: mlimani
  rationale: הַר inaweza kuwa mlima au kilima; “mlimani” hudumisha maelezo ya eneo bila kuamua kwa usahihi ukubwa wa mwinuko.
- source_word: הָעֲצָמוֹת
  choice: mifupa
  rationale: עצמות ni “mifupa” kihalisi; neno hili mahsusi ni muhimu katika tendo la kuitia madhabahu unajisi.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: wakaiteketeza juu ya madhabahu
  rationale: Kiwakilishi cha umoja katika Kiswahili kinarejelea “mifupa” kama jumla; “kuteketeza” linafaa kwa kuichoma kabisa juu ya madhabahu.
- source_word: וַיְטַמְּאֵהוּ
  choice: kuitia unajisi
  rationale: טמא hapa ni istilahi ya uchafu wa kiibada. Kiwakilishi kinarejelea madhabahu, mtangulizi wa karibu na lengo la tendo hilo.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: Kauli hii inaonyesha kutimizwa kwa neno la Mungu lililotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja katika umbo la kawaida la Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hii inadumisha kwa karibu nahau ya Kiebrania na cheo cha kinabii bila kuifafanua kuwa “nabii.”
- source_word: קָרָא
  choice: alikuwa ametangaza / alipotangaza
  rationale: קרא inaweza kumaanisha kuita, kupaaza sauti, au kutangaza. “Kutangaza” linaonyesha tamko la wazi la kinabii na linafaa kwa marudio yote mawili.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mambo haya
  rationale: דברים inaweza kumaanisha maneno au mambo; hapa inarejelea yaliyotabiriwa na sasa kutimizwa, hivyo “mambo haya” hudumisha upana huo.
theological_decisions:
- issue: Kauli ya utimizo inayounganisha tendo la Yosia na unabii wa awali
  choice: “sawasawa na neno la Yahwe ambalo yule mtu wa Mungu alikuwa ametangaza”
  alternative: “sawasawa na neno la Yahwe ambalo yule mtu wa Mungu alikuwa amepaaza sauti”
  rationale: Muundo huu unaonyesha kwamba tendo la Yosia lilitimiza neno la Yahwe lililotolewa kupitia mtu wa Mungu, bila kuongeza maelezo yasiyomo katika Kiebrania.
- issue: Uhusiano wa kishazi cha mwisho אֲשֶׁר קָרָא אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: “alipotangaza mambo haya”
  alternative: “aliyekuwa ametangaza mambo haya”
  rationale: Kishazi kinamhusu mtu wa Mungu na kinarudia kitenzi קרא. Tafsiri inadumisha marudio hayo, huku “alipotangaza” ikifanya Kiswahili kiwe cha kawaida na kuonyesha tukio la tamko la awali.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina “Yahwe” kunadumisha jina binafsi lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfululizo wa vitenzi vya “aka-” umetumiwa kudumisha mwendo wa simulizi la Kiebrania. “Kutia unajisi” hudumisha maana ya kiibada, na jina “Yahwe” limetumiwa kwa יהוה.
