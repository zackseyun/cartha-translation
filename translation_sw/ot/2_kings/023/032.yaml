  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: sw
  text: Akafanya yaliyo mabaya machoni pa Yahwe, sawasawa na yote waliyofanya baba zake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “baba zake”; yaani, mababu zake au watawala waliomtangulia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza matukio; “Akafanya” ni wa kawaida na unaendana na kishazi kinachofuata.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Hii ni nahau ya Kiebrania yenye maana ya kufanya mambo yaliyo maovu, si tafsiri ya neno kwa neno “uovu ule.”
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Inahifadhi sitiari ya Kiebrania ya tathmini huku ikiwa nahau inayoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo la kawaida la Kiswahili, badala ya kubadilishwa na cheo.
- source_word: כְּכֹל אֲשֶׁר
  choice: sawasawa na yote
  rationale: Inawasilisha ulinganisho na ukubwa wa maana ya כֹּל, yaani mwenendo wote uliotangulia.
- source_word: עָשׂוּ
  choice: waliyofanya
  rationale: Muundo wa Kiswahili unaonyesha kwa kawaida kwamba matendo ya baba zake yalitangulia na ndiyo yanayolinganishwa na yake.
- source_word: אֲבֹתָיו
  choice: baba zake
  rationale: Inabaki karibu na neno la Kiebrania, huku tanbihi ikifafanua kwamba katika muktadha huu linaweza kumaanisha mababu au watawala waliomtangulia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kifungu kinatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Sitiari “machoni pa” imehifadhiwa kwa sababu inaeleweka na hubeba tathmini ya kiadili ya maandishi ya Kiebrania.
