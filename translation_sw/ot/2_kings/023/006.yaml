  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: sw
  text: Akalitoa Ashera[a] kutoka katika nyumba ya Yahweh na kulipeleka nje ya Yerusalemu, hadi Bonde la Kidroni. Akaliteketeza huko katika Bonde la Kidroni, akaliponda likawa mavumbi, kisha akayatupa mavumbi yake juu ya kaburi la watu wa kawaida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo ya Ashera” au “sanamu ya Ashera.” Neno la Kiebrania linaweza kumaanisha Ashera, mungu wa kike wa Wakanaani, au kitu cha ibada kilichohusishwa na ibada yake; hapa linamaanisha kitu kilichotolewa na kuharibiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: Ashera
  rationale: Jina limeandikwa kwa namna ya Kiswahili badala ya kufafanuliwa kuwa nguzo au sanamu, kwa sababu neno la Kiebrania linaweza kumaanisha mungu wa kike Ashera au kitu cha ibada kilichohusishwa naye; katika muktadha huu ni kitu kilichotolewa na kuharibiwa.
- source_word: מִבֵּית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: ‘Nyumba ya Yahweh’ inaakisi usemi wa Kiebrania kwa lugha ya asili na yenye kueleweka, huku ikidumisha picha ya hekalu kama nyumba yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa sauti badala ya kubadilishwa na cheo.
- source_word: מִחוּץ לִירוּשָׁלַם
  choice: nje ya Yerusalemu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kupelekwa hadi eneo lililokuwa nje ya mji.
- source_word: נַחַל קִדְרוֹן
  choice: Bonde la Kidroni
  rationale: נחל inaweza kuwa bonde au korongo lenye mkondo wa maji wa msimu; ‘Bonde la Kidroni’ ni wazi na linafaa kwa muktadha huu wa kijiografia.
- source_word: וַיִּשְׂרֹף אֹתָהּ
  choice: akaliteketeza
  rationale: Kiwakilishi cha ngeli ya kitu kinaonyesha kuwa kinachoharibiwa ni kitu cha ibada, si mungu wa kike aliyepewa uhai.
- source_word: וַיָּדֶק לְעָפָר
  choice: akaliponda likawa mavumbi
  rationale: Usemi huu unaonyesha kulivunja au kulisaga kabisa hadi vipande vidogo sana; tafsiri hii ni ya asili na yenye picha wazi kwa Kiswahili.
- source_word: עֲפָרָהּ
  choice: mavumbi yake
  rationale: עפר ni mavumbi, si lazima majivu pekee; neno hili halibani maana ingawa kitu hicho kiliteketezwa na kupondwa.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: juu ya makaburi ya watu wa kawaida
  rationale: Ingawa קבר iko katika umoja wa kimofolojia, katika usemi huu inaweza kuwa na maana ya pamoja ya mahali pa makaburi; ‘watu wa kawaida’ linaonyesha uwezekano wa tofauti ya kijamii bila kutumia tafsiri isiyoeleweka ya neno kwa neno.
theological_decisions:
- issue: Maana ya kitu kinachoitwa אֲשֵׁרָה
  choice: Ashera
  alternative: nguzo ya Ashera; sanamu ya Ashera
  rationale: Kutumia jina Ashera kunadumisha utata halisi kuhusu umbo kamili la kitu hicho bila kudhoofisha ukweli kwamba kilikuwa kitu cha ibada kilichokatazwa na kuharibiwa.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: ‘Yahweh’ linadumisha jina binafsi lililo katika matini ya Kiebrania badala ya kulibadilisha na cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kiebrania imegawanywa kwa kiasi ili isomeke kwa urahisi, lakini mfuatano wa vitendo umehifadhiwa. Jina ‘Kidroni’ limetumiwa katika umbo lililozoeleka katika Kiswahili.
