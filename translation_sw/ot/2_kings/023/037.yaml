  text: Akafanya yaliyokuwa mabaya machoni pa Yahweh, kama yote waliyofanya baba zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zake” au “watangulizi wake.” Kiebrania husema hasa “baba zake.”
