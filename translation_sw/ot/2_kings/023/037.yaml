lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Kiunganishi wa- pamoja na kitenzi kinaendeleza simulizi; “Akafanya” ni muundo wa kawaida wa Kiswahili unaohifadhi mfuatano huo.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Nahau עשה הרע inaeleza kutenda mambo yanayotathminiwa kuwa maovu; “yaliyo maovu” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi sitiari ya Kiebrania inayomaanisha jinsi jambo linavyotathminiwa na mtu fulani, na inaeleweka vizuri katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa Tetragramatoni badala ya kulibadili kuwa cheo.
- source_word: כְּכֹל אֲשֶׁר
  choice: kama vile
  rationale: Huwasilisha ulinganifu wa mwenendo wake na ule wa waliomtangulia bila kuzalisha Kiswahili kizito cha neno kwa neno.
- source_word: עָשׂוּ
  choice: walivyofanya
  rationale: Muundo huu unaonyesha kwamba matendo ya mababu yalitangulia na yalikuwa kielelezo cha mwenendo wake.
- source_word: אֲבֹתָיו
  choice: mababu zake
  rationale: Katika muktadha wa kifalme neno hilo linaweza kumaanisha baba wa zamani, wahenga, au watangulizi; “mababu zake” ni la asili na halielekezwi kwa baba yake wa moja kwa moja pekee.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ya Kiebrania ina jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya אֲבֹתָיו katika tathmini ya kifalme
  choice: mababu zake
  alternative: baba zake
  rationale: “Mababu zake” hudumisha wazo la vizazi au watangulizi bila kulazimisha maana ya baba wa karibu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtindo mfupi wa tathmini ya kifalme na sitiari “machoni pa” bila kuwa ngumu kueleweka.
