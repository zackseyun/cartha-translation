base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: sw
  text: Akawachinja makuhani wote wa mahali pa juu waliokuwa huko, juu ya madhabahu, kisha akateketeza mifupa ya watu juu ya madhabahu hizo. Kisha akarudi Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Akawachinja
  rationale: Kitenzi זבח kinaweza kumaanisha kuchinja au kutoa dhabihu. Katika muktadha huu wa kuondoa ibada haramu, “akawachinja” kinaonyesha mauaji ya kikatili huku dokezo la kidini likihifadhiwa katika tanbihi.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: makuhani ... wa mahali pa juu
  rationale: “Mahali pa juu” ni tafsiri ya moja kwa moja ya בָּמוֹת na istilahi inayotambulika kwa vituo vya ibada vya mahali mbalimbali katika simulizi la Wafalme.
- source_word: אֲשֶׁר שָׁם
  choice: waliokuwa huko
  rationale: Inahifadhi maana ya mahali ya kishazi cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: juu ya madhabahu
  rationale: Inafuata maana ya kawaida ya עַל na inaendana na tukio la kunajisi madhabahu.
- source_word: עַצְמוֹת אָדָם
  choice: mifupa ya watu
  rationale: אָדָם hapa inamaanisha binadamu kwa ujumla, si wanaume pekee; “mifupa ya watu” ni Kiswahili cha kawaida na sahihi.
- source_word: עֲלֵיהֶם
  choice: juu ya madhabahu hizo
  rationale: Nomino imerudiwa ili kuonyesha wazi kwamba kiwakilishi cha Kiebrania kinarejelea madhabahu, bila utata usio wa lazima katika Kiswahili.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: Halafu akarudi Yerusalemu
  rationale: “Halafu” huwasilisha kwa lugha ya kawaida mfuatano wa simulizi unaoonyeshwa na waw-consecutive.
theological_decisions:
- issue: Dokezo la kutoa dhabihu katika וַיִּזְבַּח linapotumiwa kuhusu kuuawa kwa makuhani wa mahali pa juu
  choice: akawachinja
  alternative: akawatoa dhabihu
  rationale: “Akawatoa dhabihu” lingeweza kudokeza kwamba tendo hilo lilikuwa dhabihu halali iliyotolewa kwa BWANA, jambo ambalo mstari hausemi wazi. “Akawachinja” linahifadhi ukali wa tendo, huku uwezekano wa maana ya kidini ukibaki katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umewekwa wazi na wa kawaida, huku istilahi ya kihistoria “mahali pa juu” na utata halisi wa kitenzi זבח vikihifadhiwa.
