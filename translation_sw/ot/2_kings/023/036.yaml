base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: sw
  text: Yehoyakimu alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, naye akatawala huko Yerusalemu kwa miaka kumi na mmoja. Mama yake aliitwa Zebida, binti ya Pedaya, kutoka Ruma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; tafsiri hii inatoa maana yake kwa Kiswahili cha asili bila kunakili muundo usio wa kawaida.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Kirai hiki kinaonyesha wakati wa kuingia kwake katika ufalme; uchaguzi huu ni wa kawaida katika Kiswahili na unafaa katika taarifa ya utawala wa mfalme.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki humaanisha kutawala kama mfalme, si kuwa na cheo cha mfalme tu.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Mahali pa utawala linaonyeshwa kwa Kiswahili kwa muundo ‘kutawala Yerusalemu’; maana ya kimahali inabaki wazi.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Huu ni usemi wa Kiswahili wa kawaida unaohifadhi taarifa ya jina la mama.
- source_word: זבידה
  choice: Zebida
  rationale: Jina limetoholewa kwa mwandiko na matamshi yanayofaa Kiswahili kutokana na umbo la Kiebrania katika WLC.
- source_word: בַת פְּדָיָה
  choice: binti Pedaya
  rationale: Huu ni uhusiano wa moja kwa moja wa kifamilia; ‘binti’ ni tafsiri ya kawaida ya Kiswahili.
- source_word: מִן רוּמָה
  choice: kutoka Ruma
  rationale: Kihusishi מִן kinaonyesha asili au mji alikotoka; ‘kutoka’ huwasilisha maana hiyo wazi.
