base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: sw
  text: Hata hivyo, makuhani wa mahali pa juu pa ibada[a] hawakupanda kwenda kwenye madhabahu ya Yahwe[b] huko Yerusalemu; bali walikula mikate isiyotiwa chachu miongoni mwa ndugu zao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makuhani wa maeneo ya juu ya ibada.”
    reason: lexical_alternative
  - marker: b
    text: Jina la Mungu katika Kiebrania ni YHWH, ambalo kwa kawaida limetafsiriwa “BWANA.”
    reason: alternative_reading
  - marker: c
    text: Kiebrania kinasema “miongoni mwa ndugu zao,” huenda kikimaanisha makuhani wenzao au jamaa zao za kikuhani.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Neno hili linaweka mpaka au tofauti na hatua za mageuzi zilizotangulia; “Hata hivyo” linaonyesha maana hiyo kwa Kiswahili cha kawaida.
- source_word: יַעֲלוּ
  choice: hawakupanda kwenda
  rationale: Kitenzi עלה humaanisha “kupanda” au “kwenda juu.” Usemi huu unahifadhi wazo la kupanda kwenda Yerusalemu bila kudokeza kwamba walipanda juu ya madhabahu yenyewe.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: makuhani wa mahali pa juu
  rationale: Hii ni tafsiri wazi ya muundo wa Kiebrania na inaacha “mahali pa juu” likimaanisha maeneo ya ibada ya kienyeji.
- source_word: מִזְבַּח יְהוָה
  choice: madhabahu ya Yahwe
  rationale: Inahifadhi uhusiano wa maneno katika Kiebrania kwa lugha ya kawaida na yenye heshima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי אִם
  choice: lakini
  rationale: Katika muktadha huu, muundo huo unaonyesha tofauti kati ya kutoruhusiwa kwenda kwenye madhabahu na kula mikate pamoja na wenzao.
- source_word: אָכְלוּ מַצּוֹת
  choice: walikula mikate isiyotiwa chachu
  rationale: Hii inaeleza מַצּוֹת kwa Kiswahili kinachoeleweka na inafaa katika muktadha wa chakula cha kikuhani.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: miongoni mwa ndugu zao
  rationale: Inafuata maana halisi ya “katikati ya ndugu zao” na haiongezi waziwazi neno “makuhani,” ambalo halipo katika Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kiebrania kinatumia jina la agano YHWH moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֲחֵיהֶם katika kundi la kikuhani
  choice: ndugu zao
  alternative: makuhani wenzao
  rationale: Kiebrania kinasema kihalisi “ndugu zao.” Muktadha huenda unawahusu makuhani wenzao au jamaa zao za kikuhani, lakini tafsiri kuu haibani maana hiyo zaidi ya maandishi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imehifadhi nahau ya kupanda kwenda Yerusalemu, istilahi ya maeneo ya ibada “mahali pa juu,” na kutokubainishwa kikamilifu kwa “ndugu zao.”
