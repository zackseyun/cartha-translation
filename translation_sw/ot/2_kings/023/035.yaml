base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: sw
  text: Naye Yehoyakimu akampa Farao fedha na dhahabu, lakini akaitoza nchi[a] ili kutoa fedha kulingana na amri ya Farao.[b] Aliwadai watu wa nchi fedha na dhahabu, kila mmoja kulingana na kadirio lake,[c] ili kumpa Farao Neko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaikadiria nchi” au “akaiwekea nchi ushuru.” Kitenzi cha Kiebrania kinaweza kumaanisha kuweka kadirio la kiasi kinachopaswa kulipwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa kinywa cha Farao,” yaani, kulingana na amri yake.
    reason: lexical_alternative
  - marker: c
    text: 'Au, “kila mmoja kulingana na kiasi alichokadiriwa.” Inawezekana pia kuelewa: “kila mmoja kulingana na uwezo wake,” lakini maana hiyo ni ya kufasiri zaidi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: akaitoza nchi
  rationale: Katika muktadha huu wa malipo, kausativi ya kitenzi hiki ina maana ya kuweka kadirio au ushuru juu ya nchi. ‘Akaitoza nchi’ ni Kiswahili cha kawaida kinachoonyesha wazi hatua ya kifedha bila kuifanya kuwa tathmini ya thamani tu.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: ‘Nchi’ linafaa kwa maana ya eneo la kisiasa hapa na pia linaendeleza uhusiano na kirai ‘watu wa nchi’ baadaye katika aya.
- source_word: עַל־פִּי פַרְעֹה
  choice: kulingana na amri ya Farao
  rationale: Kirai cha Kiebrania, kihalisi ‘kwa kinywa cha Farao,’ ni nahau inayomaanisha kufuata agizo au amri yake.
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: kila mmoja kulingana na kadirio lake
  rationale: Tafsiri hii inadumisha wazo la kiasi kilichokadiriwa kwa kila mtu bila kuamua kwamba msingi wake ulikuwa uwezo wa mtu wa kulipa.
- source_word: נָגַשׂ
  choice: aliwadai
  rationale: Kitenzi kinaweza kudokeza kushinikiza au kudai malipo. ‘Aliwadai’ kinahifadhi uzito huo kuliko ‘alikusanya,’ ambacho ni cha upande wowote zaidi.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Tafsiri hii ya karibu haibanishi bila sababu kwamba kirai kinamaanisha tabaka fulani la kijamii.
- source_word: פַרְעֹה נְכֹה
  choice: Farao Neko
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayosomeka kwa Kiswahili.
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: fedha na dhahabu
  rationale: Majina ya madini yamedumishwa moja kwa moja; ‘fedha’ pia ni neno la kawaida la Kiswahili katika muktadha huu.
- source_word: נָתַן
  choice: akampa
  rationale: Hii inadumisha maana ya msingi ya ‘kutoa/kumpa,’ huku kiambishi cha yambwa kikifanya sentensi iwe ya asili kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umewekwa wa asili kwa Kiswahili, huku marudio ya ‘fedha na dhahabu’ na utata wa msingi wa kadirio la kila mtu yakidumishwa.
