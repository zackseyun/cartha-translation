source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: sw
  text: Naye akawakomesha makuhani[a] ambao wafalme wa Yuda walikuwa wamewaweka ili wafukize uvumba katika mahali pa juu, katika miji ya Yuda na maeneo ya kandokando ya Yerusalemu; pia akawakomesha wale waliokuwa wakifukiza uvumba kwa Baali, kwa jua, kwa mwezi, kwa makundi ya nyota[b], na kwa jeshi lote la mbinguni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makuhani wa ibada za sanamu” au “makuhani wa kipagani.” Neno la Kiebrania linamaanisha makuhani waliohusishwa na ibada zisizokubalika au za sanamu, wala si makuhani halali wa BWANA.
    reason: lexical_alternative
  - marker: b
    text: Au, “alama za zodiaki.” Neno la Kiebrania huenda linamaanisha makundi ya nyota au migawanyo ya nyota angani.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “jeshi lote la mbingu.” Hapa usemi huo unahusu miili ya angani iliyoabudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: akawakomesha
  rationale: Hifili ya שׁבת ina maana ya kusababisha wakome au kukomesha shughuli yao. ‘Akawakomesha’ huhifadhi nguvu ya kisababishi bila kubainisha njia iliyotumiwa.
- source_word: הַכְּמָרִים
  choice: makuhani[a]
  rationale: כְּמָרִים ni neno maalumu kwa makuhani waliohusishwa na ibada zisizokubalika au za sanamu. Tafsiri kuu inabaki fupi, huku tanbihi ikieleza maana yake maalumu ili wasichanganywe na makuhani halali wa BWANA.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: ambao wafalme wa Yuda walikuwa wamewaweka
  rationale: נתן hapa ina maana ya kuwaweka au kuwateua katika nafasi hiyo; wakati uliotangulia unaonyesha kwamba wafalme walifanya hivyo kabla ya mageuzi haya.
- source_word: וַיְקַטֵּר
  choice: ili wafukize uvumba
  rationale: קטר kwa kawaida hueleza kufukiza uvumba au kutoa sadaka inayofukizwa. Muktadha wa ibada unaunga mkono ‘kufukiza uvumba.’
- source_word: בַּבָּמוֹת
  choice: katika mahali pa juu
  rationale: במות ni maeneo ya ibada ya kienyeji, mara nyingi yaliyoinuka. ‘Mahali pa juu’ ni istilahi ya kibiblia iliyo wazi na inayohifadhi taswira ya Kiebrania.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: katika miji ya Yuda na maeneo yanayozunguka Yerusalemu
  rationale: מְסִבֵּי hurejelea sehemu au mazingira yanayouzunguka mji; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְאֶת הַמְקַטְּרִים
  choice: Pia akawakomesha wale waliomfukizia uvumba
  rationale: Kirai cha nomino-kitenzi kinatambulisha kundi jingine kwa shughuli yao ya kufukiza uvumba. Kurudia kitenzi ‘akawakomesha’ huweka uhusiano wa kisarufi wazi katika Kiswahili.
- source_word: לַבַּעַל
  choice: Baali
  rationale: Jina la mungu בעל limetoholewa kwa umbo la Kiswahili ‘Baali.’ Kiambishi cha yambwa -m- katika ‘waliomfukizia’ kinaonyesha kwamba uvumba ulielekezwa kwake.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: jua, mwezi
  rationale: Orodha inataja vitu viwili tofauti vya angani vilivyoabudiwa; Kiswahili hakihitaji kurudia kihusishi baada ya kitenzi ‘kufukizia.’
- source_word: וְלַמַּזָּלוֹת
  choice: makundi ya nyota[b]
  rationale: מַזָּלוֹת huenda ikamaanisha makundi ya nyota au alama za zodiaki. ‘Makundi ya nyota’ ni sahihi bila kudai kwa uhakika zaidi ya ushahidi.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: na jeshi lote la mbinguni[c]
  rationale: צְבָא הַשָּׁמָיִם ni usemi wa kudumu unaowasilisha miili ya angani kama jeshi au safu iliyopangwa. Tafsiri ya moja kwa moja huhifadhi taswira hiyo.
theological_decisions:
- issue: Iwapo כְּמָרִים itafsiriwe moja kwa moja kama makuhani wa sanamu au kwa neno la jumla ‘makuhani’
  choice: makuhani, pamoja na tanbihi inayoeleza maana maalumu ya neno
  alternative: makuhani wa ibada za sanamu; makuhani wa kipagani
  rationale: Neno lenyewe humaanisha makuhani wa ibada zisizo halali au za kigeni, lakini kuongeza ‘wa ibada za sanamu’ katika matini kuu kunaweza kufunga zaidi maana yake. Tanbihi huhifadhi tofauti hiyo bila kuwachanganya na makuhani halali wa BWANA.
- issue: Maana ya צְבָא הַשָּׁמָיִם katika muktadha huu
  choice: jeshi lote la mbinguni, likifafanuliwa katika tanbihi kuwa miili ya angani iliyoabudiwa
  alternative: viumbe vyote vya mbinguni; nyota zote za angani
  rationale: Muktadha wa jua, mwezi, na makundi ya nyota unaonyesha kwamba hapa usemi huo unahusu miili ya angani katika ibada ya nyota, lakini matini kuu huhifadhi taswira pana ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Akawakomesha’ huhifadhi wazo la kusababisha shughuli ya makuhani ikome; ‘mahali pa juu’ na ‘jeshi la mbinguni’ huhifadhi istilahi na taswira muhimu za Kiebrania huku tanbihi zikisaidia msomaji wa kisasa.
