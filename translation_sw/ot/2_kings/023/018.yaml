  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya neno “mifupa” yamehifadhiwa kwa sababu ni dhahiri na muhimu katika Kiebrania. Katazo limetolewa kwa “mtu yeyote” ili kuwasilisha nguvu ya jumla ya אִישׁ bila kulazimisha jinsia ya kiume.
