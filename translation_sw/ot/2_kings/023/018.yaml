  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: sw
  text: Akasema, “Mwacheni; mtu yeyote asiisogeze mifupa yake.” Basi waliihifadhi mifupa yake[a], pamoja na mifupa ya nabii aliyekuwa amekuja kutoka Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliiokoa mifupa yake.”
    reason: Kitenzi מלט kinaweza kueleza kuokoa au kusalimisha kutokana na uharibifu; katika muktadha huu maana yake ni kuihifadhi mifupa isidhuriwe.
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: Mwacheni
  rationale: Amri hii ya wingi inaagiza watu waache kumfanyia chochote mtu huyo aliyekufa. “Mwacheni” ni ya kawaida na yenye heshima katika Kiswahili cha sasa.
- source_word: אִישׁ אַל יָנַע עַצְמֹתָיו
  choice: mtu yeyote asiisogeze mifupa yake
  rationale: אִישׁ ina maana ya jumla katika katazo hili, na נוע hapa inahusu kuiondoa au kuisogeza mifupa kutoka mahali ilipokuwa. “Asiisogeze” huhifadhi picha halisi ya mifupa bila kuongeza maelezo yasiyokuwamo.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: wakaiacha mifupa yake salama
  rationale: Katika muktadha huu piel ya מלט ina maana ya kuihifadhi au kuiokoa mifupa isidhuriwe. Usemi huu ni wa asili katika Kiswahili na unaonyesha kwamba mifupa haikuharibiwa wala kuondolewa.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: pamoja na mifupa ya nabii
  rationale: Kirai hiki kinaongeza mifupa ya nabii kuwa sehemu ya ile iliyohifadhiwa; “pamoja na” huonyesha uhusiano huo wazi.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: aliyekuwa amekuja kutoka Samaria
  rationale: Muundo huu unaonyesha kwamba kuja kwa nabii kutoka Samaria kulitangulia tukio linalosimuliwa, huku jina la mahali likihifadhiwa kwa umbo lake la kawaida la Kiswahili.
