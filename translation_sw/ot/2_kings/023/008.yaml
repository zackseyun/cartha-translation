  to: Aliwaleta makuhani wote kutoka miji ya Yuda, akapanajisi mahali pa juu ambako makuhani walikuwa wamefukiza uvumba, kuanzia Geba hadi Beer-sheba. Pia akabomoa mahali pa juu pa malango, palipokuwa kwenye mwingilio wa lango la Yoshua, mkuu wa mji, upande wa kushoto wa mtu katika lango la mji.[a]
  rationale: Marekebisho yanaondoa ufafanuzi wa “anapoingia” kutoka maandishi makuu na kuuhifadhi kama uwezekano katika tanbihi, hivyo yakidumisha utata wa Kiebrania. Pia “pa malango” imerejeshwa ili kuakisi kwa karibu zaidi muundo wa “mahali pa juu pa malango.” Tanbihi ya awali ya “mahali pa ibada karibu na malango” haikuhitajika, kwa kuwa maandishi makuu sasa yanafuata muundo wa chanzo kwa karibu.
