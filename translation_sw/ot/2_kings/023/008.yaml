  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: sw
  text: Aliwaleta makuhani wote kutoka miji ya Yuda, akapanajisi mahali pa juu ambako makuhani walikuwa wamefukiza uvumba, kuanzia Geba hadi Beer-sheba. Pia akabomoa mahali pa juu pa malango, palipokuwa kwenye mwingilio wa lango la Yoshua, mkuu wa mji, upande wa kushoto wa mtu katika lango la mji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “upande wa kushoto wa mtu katika lango la mji.” Kirai hiki ni kigumu; huenda kinamaanisha upande wa kushoto kwa mtu anapoingia langoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Aliwaleta
  rationale: Hifili ya בוא ina maana ya ‘kuleta’ au ‘kusababisha kuja’; ‘aliwaleta’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: מֵעָרֵי יְהוּדָה
  choice: kutoka miji ya Yuda
  rationale: עָרִים inaweza kumaanisha miji au miji midogo; ‘miji’ ni pana, ya kawaida, na hailazimishi ukubwa wa makazi.
- source_word: וַיְטַמֵּא
  choice: akapanajisi
  rationale: Pieli ya טמא humaanisha kufanya kitu kiwe najisi; ‘panajisi’ linafaa kwa kunajisi kimakusudi maeneo ya ibada.
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: Hili ndilo neno la kawaida la kibiblia kwa maeneo ya ibada yaliyoitwa בָּמוֹת, bila kuyafafanua zaidi kuliko chanzo.
- source_word: קִטְּרוּ שָׁמָּה
  choice: walikuwa wamefukiza uvumba
  rationale: קטר hapa huhusu kufukiza uvumba au sadaka inayotoa moshi; muundo huu unaonyesha tendo lililotangulia hatua ya Yosia.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: kuanzia Geba hadi Beer-sheba
  rationale: Kirai kinaonyesha eneo lote kutoka kaskazini hadi kusini mwa Yuda; majina ya mahali yamehifadhiwa kwa unukuzi unaotambulika.
- source_word: וְנָתַץ
  choice: Pia akabomoa
  rationale: נתץ humaanisha kubomoa au kuangusha; ‘akabomoa’ ni la kawaida na linaonyesha uharibifu wa miundo hiyo.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: mahali pa juu pa malangoni
  rationale: Muundo wa Kiebrania ni mfupi na wenye utata; tafsiri hii huhifadhi uhusiano na malango bila kuugeuza moja kwa moja kuwa ‘vibanda vya ibada’.
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: kwenye mwingilio wa lango la Yoshua
  rationale: פֶּתַח ni uwazi au mwingilio; Kiswahili hiki ni cha asili huku kikihifadhi kutajwa kwa lango.
- source_word: שַׂר הָעִיר
  choice: mkuu wa mji
  rationale: שַׂר ni mkuu au afisa mwenye mamlaka. ‘Mkuu wa mji’ huhifadhi upana wa cheo bila kudokeza ufalme au wadhifa mahususi usiotajwa.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: upande wa kushoto wa mtu anapoingia katika lango la mji
  rationale: 'Kiebrania halisi ni kigumu: ‘upande wa kushoto wa mtu katika lango la mji.’ Tafsiri kuu inaeleza mwelekeo unaowezekana ili iwe ya kawaida kwa msomaji, huku tanbihi ikihifadhi usemi halisi na utata wake.'
