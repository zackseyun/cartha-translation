  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֥ה אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: sw
  text: Alifanya yaliyo maovu machoni pa Yahweh[a], kama vile Manase baba yake alivyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “machoni pa Yahweh”; yaani, kwa kadiri ya tathmini yake.'
    reason: Ufafanuzi wa nahau ya Kiebrania.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Alifanya
  rationale: Kitenzi hiki kinaendeleza simulizi na kinaelezwa kwa wakati uliopita; kiunganishi cha mwanzo hakihitajiki katika Kiswahili cha kawaida.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Huhifadhi maana ya msemo wa Kiebrania ‘kufanya yaliyo maovu’ kwa Kiswahili cha kawaida na chenye heshima.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania na kueleza kwamba matendo hayo yalikuwa maovu kwa tathmini ya Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha kwa kawaida ulinganisho wa moja kwa moja kati ya mwenendo wake na wa baba yake.
- source_word: עָשָׂה
  choice: alivyofanya
  rationale: Muundo huu wa Kiswahili unaonyesha kitendo cha Manase kinachotumiwa kama msingi wa ulinganisho.
- source_word: מְנַשֶּׁה אָבִיו
  choice: Manase baba yake
  rationale: Jina limetoholewa kwa matumizi ya kawaida ya Kiswahili, na uhusiano wa kifamilia umehifadhiwa bila ufafanuzi wa ziada.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; ‘Yahweh’ hulihifadhi badala ya kuliwakilisha kwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inaendeleza nahau ya kibiblia ‘machoni pa’ bila kuwa ngumu kueleweka.
