reference: 2 Kings 21:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: sw
  text: Alimfanya mwanawe apite katika moto[a], akafanya uaguzi na kutafuta ishara[b], akajihusisha na waaguzi wa mizimu na wabashiri[c]. Akazidi sana kutenda maovu machoni pa Yahwe, akimkasirisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa uwazi zaidi, “Alimtoa mwanawe kuwa dhabihu katika moto.” Nahau ya Kiebrania kihalisi ni “alimfanya mwanawe apite katika moto.”
    reason: alternative_reading
  - marker: b
    text: “Kutafuta ishara” kunaweza pia kutafsiriwa “kupiga ramli.”
    reason: lexical_alternative
  - marker: c
    text: Au “akawaendea waaguzi wa mizimu na wabashiri.” Nahau ya Kiebrania ni ngumu na huenda ikamaanisha kujihusisha na watendaji hao kwa namna mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: Alimpitisha mwanawe motoni
  rationale: Inahifadhi nahau ya Kiebrania, ‘alimfanya mwanawe apite motoni,’ bila kuamua kimya-kimya namna kamili ya ibada hiyo; maana inayowezekana ya dhabihu ya mtoto imeelezwa katika tanbihi.
- source_word: וְעוֹנֵן
  choice: akafanya uaguzi
  rationale: Kitenzi hiki kinataja zoea lililokatazwa la kutabiri au kutafuta maarifa ya siri kwa njia za kichawi. ‘Kufanya uaguzi’ ni Kiswahili cha sasa kinachoeleweka na kisichopanua maana kuwa uchawi wa kila aina.
- source_word: וְנִחֵשׁ
  choice: na kutafuta ishara
  rationale: נחשׁ mara nyingi huhusu kubashiri kwa kuchunguza ishara. Tafsiri hii inalitofautisha zoea hilo na uaguzi uliotajwa kabla yake.
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: akajihusisha na waaguzi wa mizimu na wenye pepo
  rationale: Nahau ya Kiebrania ni ngumu na kihalisi husema ‘alifanya’ watu au mambo haya. ‘Akajihusisha na’ inaacha wazi kama aliwashauria, aliwatumia, au aliwaendeleza, huku majina yakionyesha watendaji wa mambo ya mizimu.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: Akaongeza sana kutenda
  rationale: Muundo wa רבה pamoja na kitenzi-jina unaonyesha kuzidisha au kuongeza sana tendo, si kusema tu kwamba alifanya maovu.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Kivumishi kilichotumiwa kama nomino kinaonyesha mambo yaliyohukumiwa kuwa maovu.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Inahifadhi sitiari ya Kiebrania ya tathmini ya Mungu na kulitaja jina la agano יְהוָה kama Yahwe kwa tahajia ya kawaida ya Kiswahili.
- source_word: לְהַכְעִיס
  choice: akimkasirisha
  rationale: Inawasilisha nguvu ya kisababishi na kuacha uhusiano wa kusudi au matokeo kwa namna ya asili katika Kiswahili.
theological_decisions:
- issue: Kiwango cha uwazi katika nahau ya kumpeleka mtoto motoni
  choice: Kuhifadhi ‘Alimpitisha mwanawe motoni’ katika matini kuu
  alternative: ‘Alimtoa mwanawe kuwa dhabihu motoni’ au ‘Alimteketeza mwanawe motoni’
  rationale: Muktadha unaelekeza kwa nguvu kwenye dhabihu ya mtoto, lakini maneno ya Kiebrania yenyewe ni nahau yasiyoeleza wazi kila tendo la ibada hiyo. Tanbihi inaonyesha maana inayowezekana bila kuifanya kuwa ndiyo tafsiri pekee.
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: ‘Yahwe’ linawakilisha jina binafsi la Kiebrania badala ya kulibadili kuwa cheo, na tahajia yake inafaa mfumo wa sauti wa Kiswahili.
- issue: Uhusiano na waaguzi wa mizimu na wenye pepo
  choice: akajihusisha na
  alternative: akawaendea au akawatumia
  rationale: Kitenzi עשה katika nahau hii hakibainishi kwa uhakika kama Manase aliwashauria, aliwaajiri, aliwaweka rasmi, au aliendeleza shughuli zao. Tafsiri pana inahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa vitenzi unaendeleza mfululizo wa matendo ya Manase; istilahi za mambo ya mizimu zimetofautishwa kadiri iwezekanavyo bila kutumia lugha ya kitaalamu kupita kiasi. ‘Machoni pa Yahwe’ kwa makusudi inahifadhi sitiari ya chanzo.
