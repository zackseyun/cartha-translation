base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: sw
  text: Manase alikuwa na umri wa miaka kumi na miwili alipoanza kutawala, naye akatawala huko Yerusalemu kwa miaka hamsini na mitano. Mama yake aliitwa Hefziba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Hefziba linamaanisha takribani, “Furaha yangu iko kwake.”
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: alikuwa na umri wa miaka kumi na miwili
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; tafsiri hii ni ya asili katika Kiswahili cha sasa na inahifadhi maana kamili.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati Manase alipoingia katika utawala; ‘alipoanza kutawala’ ni wazi na wa kawaida katika Kiswahili.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: miaka hamsini na mitano
  rationale: Huu ndio mpangilio wa kawaida wa namba hiyo katika Kiswahili cha sasa.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Katika taarifa ya kifalme, kitenzi hiki kinaeleza kutawala akiwa mfalme; ‘akatawala’ ni cha asili na sahihi.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo la kawaida la Kiswahili, huku kihusishi cha mahali kikieleweka moja kwa moja katika muundo wa sentensi.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida taarifa ya Kiebrania kwamba jina la mama yake lilikuwa fulani.
- source_word: חֶפְצִי בָהּ
  choice: Hefziba
  rationale: Jina limetoholewa badala ya kutafsiriwa ndani ya matini; maana yake imeelezwa katika tanbihi.
