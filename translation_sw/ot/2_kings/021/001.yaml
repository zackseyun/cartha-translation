  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa taarifa ya utawala umehifadhiwa bila kutumia lugha ya kizamani. Alama ya tanbihi imewekwa baada ya jina Hefziba, ambalo ndilo linalofafanuliwa.
