  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: sw
  text: Wakamzika katika kaburi lake katika bustani ya Uza, naye Yosia, mwanawe, akawa mfalme badala yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: Wakamzika
  rationale: Ingawa kitenzi cha Kiebrania ni nafsi ya tatu umoja, katika muktadha huu mtendaji hajatajwa na maana ni ya watu waliotekeleza maziko. Kiswahili hutumia wingi usiotaja wahusika kwa kawaida na kwa uwazi.
- source_word: קְבֻרָתוֹ
  choice: kaburi lake
  rationale: Neno linaonyesha mahali pake pa kuzikwa. ‘Kaburi lake’ ni la kawaida, wazi, na linafaa kwa simulizi hili.
- source_word: גַן עֻזָּא
  choice: bustani ya Uza
  rationale: Muundo huu unahifadhi moja kwa moja uhusiano wa Kiebrania kati ya bustani na Uza.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika taarifa ya urithi wa ufalme, kitenzi kinaonyesha kuingia madarakani; ‘akawa mfalme’ huwasilisha maana hiyo kwa usahihi kuliko kueleza kipindi chote cha kutawala.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Nahau hii inaonyesha kwamba Yosia alimrithi baba yake katika ufalme. ‘Mahali pake’ ni Kiswahili cha kawaida na huhifadhi picha ya kuchukua nafasi yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Wingi ‘Wakamzika’ umetumiwa kama uundaji wa kawaida wa Kiswahili kwa watendaji wasiotajwa, bila kulazimisha mtendaji mmoja asiyeainishwa.
