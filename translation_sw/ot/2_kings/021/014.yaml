review_pass:
  verdict: revise
  source_fidelity: The translation accurately conveys God's forsaking the remnant of his inheritance, handing them over to their enemies, and the comprehensive scope of the enemies. However, “mateka” means captives/prisoners and is not an accurate equivalent for מְשִׁסָּה, which continues the image of plunder/spoil rather than introducing captivity.
  naturalness: The wording is generally fluent Standard East African Swahili. “Kuwatia mikononi mwa adui zao” is natural and suitably preserves the source idiom. Replacing “mateka” with “vitu vya kuporwa” provides a clear, idiomatic expression of the paired spoil imagery.
  terminology: “Mabaki ya urithi wangu” appropriately retains the covenantal inheritance language without specifying whether the referent is people, land, or both. “Nyara na vitu vya kuporwa” preserves the Hebrew’s near-synonymous doubling more faithfully than “nyara na mateka.”
  issues:
  - severity: high
    issue: “Mateka” renders מְשִׁסָּה inaccurately.
    rationale: Mateka are captives, whereas מְשִׁסָּה denotes spoil, plunder, or something liable to be plundered. The source does not expressly say that the remnant will become captives in this clause.
  revised_text: Nami nitawaacha mabaki ya urithi wangu[a], na kuwatia mikononi mwa adui zao; nao watakuwa nyara na vitu vya kuporwa kwa adui zao wote.
  revised_footnotes:
  - marker: a
    text: Au, “mali yangu.”
    reason: lexical_alternative
