  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָטַשְׁתִּ֗י אֵ֚ת שְׁאֵרִ֣ית נַחֲלָתִ֔/י וּ/נְתַתִּ֖י/ם בְּ/יַ֣ד אֹֽיְבֵי/הֶ֑ם וְ/הָי֥וּ לְ/בַ֛ז וְ/לִ/מְשִׁסָּ֖ה לְ/כָל אֹיְבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: sw
  text: Nami nitawaacha mabaki ya urithi wangu[a], na kuwatia mikononi mwa adui zao; nao watakuwa nyara na vitu vya kuporwa kwa adui zao wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: Nami nitawaacha
  rationale: Kitenzi נטשׁ kina maana ya kuacha au kutelekeza. “Nitawaacha” ni cha kawaida na chenye uzito wa hukumu katika Kiswahili; kiambishi cha kuunganisha kimewakilishwa kwa “Nami.”
- source_word: שְׁאֵרִית
  choice: mabaki
  rationale: שְׁאֵרִית humaanisha wale au kile kilichobaki baada ya maangamizi au hukumu. “Mabaki” ni neno la kawaida la kibiblia na linaendana na kiwakilishi cha watu katika “kuwatia.”
- source_word: נַחֲלָתִי
  choice: ya urithi wangu
  rationale: נחלה ni urithi au sehemu iliyogawiwa, na hapa huonyesha watu walio mali ya agano ya Mungu. “Urithi wangu” huhifadhi lugha hiyo bila kuifafanua kupita maandishi.
- source_word: וּנְתַתִּים בְּיַד
  choice: na kuwatia mikononi mwa
  rationale: Muundo wa Kiebrania ni “kuwapa katika mkono wa.” Kiswahili cha “kuwatia mikononi mwa” huhifadhi picha ya mamlaka na udhibiti huku kikiwa cha asili.
- source_word: אֹיְבֵיהֶם
  choice: adui zao
  rationale: Tafsiri ya moja kwa moja na ya kawaida; imerudiwa kwa uthabiti katika sehemu zote mbili.
- source_word: וְהָיוּ
  choice: nao watakuwa
  rationale: היה inaweza kuwa “kuwa” au “kuja kuwa.” “Watakuwa” huonyesha matokeo yajayo bila kuongeza ufafanuzi usio lazima.
- source_word: לְבַז וְלִמְשִׁסָּה
  choice: nyara na mateka
  rationale: Maneno haya ni jozi ya karibu inayohusu vilivyoporwa na vilivyowekwa wazi kwa uporaji. “Nyara na mateka” huhifadhi uradidi wa balagha na kueleweka kwa wasomaji wa sasa.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: kwa adui zao wote
  rationale: 'Lamed huonyesha uhusiano au matokeo: watakuwa kitu cha kuporwa na adui wote. “Kwa adui zao wote” ni ya asili na huhifadhi upeo wa כָל.'
theological_decisions:
- issue: Maana ya kiagano ya “urithi wangu”
  choice: Kudumisha “urithi wangu” kama watu au sehemu iliyo ya Mungu bila kuibana maana zaidi.
  alternative: mali yangu; sehemu yangu
  rationale: Neno la Kiebrania huhifadhi wazo la urithi au sehemu ya Mungu katika uhusiano wa agano. Tafsiri hailazimishi iwapo msisitizo ni watu, nchi, au vyote kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kuwatia mikononi mwa” huhifadhi nahau ya Kiebrania kwa namna ya asili; alama ya tanbihi [a] ipo mara moja katika matini.
