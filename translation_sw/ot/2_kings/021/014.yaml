- from: Nami nitawaacha mabaki ya urithi wangu[a], na kuwatia mikononi mwa adui zao; nao watakuwa nyara na mateka kwa adui zao wote.
  to: Nami nitawaacha mabaki ya urithi wangu[a], na kuwatia mikononi mwa adui zao; nao watakuwa nyara na vitu vya kuporwa kwa adui zao wote.
  rationale: The sole substantive revision replaces “mateka” with “vitu vya kuporwa” to represent מְשִׁסָּה as spoil/plunder rather than captives. The revised pair, “nyara na vitu vya kuporwa,” retains the deliberate Hebrew doubling while using clear modern Kiswahili. The existing footnote anchor remains correctly placed after “urithi wangu.”
  reviewer_model: gpt-5.6-terra
