base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: sw
  text: Lakini watu wa nchi wakawaua wote waliokuwa wamefanya njama dhidi ya Mfalme Amoni, kisha watu wa nchi wakamfanya Yosia, mwanawe, kuwa mfalme mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: wakawaua
  rationale: Katika muktadha huu, נכה inaeleza shambulio lililosababisha kifo. ‘Wakawaua’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Tafsiri hii inadumisha usemi wa Kiebrania unaoweza kumaanisha wakazi au kundi la kijamii na kisiasa; pia inadumishwa katika marudio yote mawili.
- source_word: כָּל הַקֹּשְׁרִים
  choice: wote waliokuwa wamefanya njama
  rationale: Kirai hiki kinahifadhi nguvu ya kitenzi cha kishirikishi קשר na kuonyesha kuwa walihusika katika njama iliyotangulia.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: dhidi ya Mfalme Amoni
  rationale: Pamoja na קשר, עַל ina maana ya uhasama unaolengwa kwa mtu; ‘dhidi ya’ ni Kiswahili cha kawaida na wazi.
- source_word: וַיַּמְלִיכוּ
  choice: wakamtawaza ... kuwa mfalme
  rationale: Hifili ya מלך humaanisha kumfanya mtu awe mfalme. ‘Kumtawaza kuwa mfalme’ ni ya kawaida katika simulizi la kifalme bila kulazimisha maelezo ya ziada kuhusu sherehe.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: Yosia mwanawe
  rationale: Mpangilio huu unafuata Kiebrania na unabaki wa asili katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: badala yake
  rationale: Usemi huu unaonyesha Yosia kuchukua nafasi ya Amoni katika urithi wa kifalme.
- source_word: וַ
  choice: Lakini / kisha
  rationale: ‘Lakini’ huonyesha tofauti na kuuawa kwa Amoni katika mstari uliotangulia, huku ‘kisha’ ikiunganisha kwa kawaida hatua inayofuata ndani ya mstari huu.
