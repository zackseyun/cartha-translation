  text: וְ/גַם֩ דָּ֨ם נָקִ֜י שָׁפַ֤ךְ מְנַשֶּׁה֙ הַרְבֵּ֣ה מְאֹ֔ד עַ֛ד אֲשֶׁר מִלֵּ֥א אֶת יְרוּשָׁלִַ֖ם פֶּ֣ה לָ/פֶ֑ה לְ/בַ֤ד מֵֽ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יְהוּדָ֔ה לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: sw
  text: Zaidi ya hayo, Manase alimwaga damu nyingi sana ya watu wasio na hatia, hata akaijaza Yerusalemu kutoka upande mmoja hadi mwingine[a], mbali na dhambi yake ambayo kwa hiyo aliwasababisha Yuda kutenda dhambi na kufanya yaliyo maovu machoni pa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “akaijaza Yerusalemu kinywa kwa kinywa,” nahau inayomaanisha mji mzima, kutoka upande mmoja hadi mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Zaidi ya hayo
  rationale: Inaendeleza mashtaka kwa kuongeza kosa jingine kwa yale yaliyotangulia, huku ikihifadhi mkazo wa kiunganishi cha Kiebrania.
- source_word: דָּם נָקִי
  choice: damu ... ya watu wasio na hatia
  rationale: Hii ni nahau ya kisheria na kimaadili kuhusu kuwaua watu ambao hawakuwa na hatia inayostahili adhabu ya kifo; muundo huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: שָׁפַךְ
  choice: alimwaga
  rationale: Kitenzi ‘kumwaga damu’ ni nahau ya kawaida ya Kiswahili inayowasilisha tendo la kuua na inalingana kwa karibu na picha ya Kiebrania.
- source_word: הַרְבֵּה מְאֹד
  choice: nyingi sana
  rationale: Inahifadhi uradidi wa mkazo unaoonyesha ukubwa mkubwa wa umwagaji damu.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: mpaka akaijaza Yerusalemu kutoka upande mmoja hadi mwingine
  rationale: Inawasilisha maana ya nahau ya ‘kinywa kwa kinywa,’ yaani kuenea katika mji wote, kwa Kiswahili cha kawaida; tanbihi inahifadhi picha halisi.
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: Hilo lilikuwa juu ya dhambi yake
  rationale: Inaonyesha kwamba umwagaji damu ulikuwa kosa la ziada mbali na dhambi iliyotajwa, huku ikihifadhi umoja wa ‘dhambi.’
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: ambayo kwa hiyo aliwasababisha watu wa Yuda watende dhambi
  rationale: Inahifadhi nguvu ya kisababishi ya umbo la Hiphil na kuweka wazi kwamba ‘Yuda’ hapa ni watu wa ufalme huo.
- source_word: לַעֲשׂוֹת הָרַע
  choice: kwa kufanya yaliyo maovu
  rationale: Inaeleza matokeo au yaliyomo katika kutenda dhambi, sawasawa na kishazi cha kitenzi-jina cha Kiebrania.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Inahifadhi sitiari ya tathmini ya Kiebrania kwa usemi unaoeleweka na wenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawasilisha jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Nguvu ya uwajibikaji wa Manase katika הֶחֱטִיא
  choice: aliwasababisha watu wa Yuda watende dhambi
  alternative: aliwaongoza watu wa Yuda katika dhambi
  rationale: Umbo la kisababishi linamweleza Manase kuwa chanzo hai cha kutenda kwao dhambi; tafsiri hii haiupunguzi nguvu huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili kuepuka msongamano bila kupoteza uhusiano wa kosa la ziada. ‘Watu wa Yuda’ hufanya rejeleo la pamoja liwe wazi kwa msomaji wa kawaida.
