id: 2KI.21.12
reference: 2 Kings 21:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: sw
  text: 'Kwa hiyo, hivi ndivyo Yahweh, Mungu wa Israeli, anavyosema: “Tazama, ninaleta maafa juu ya Yerusalemu na Yuda[a], hivi kwamba masikio yote mawili ya kila mtu atakayesikia habari zake yatavuma[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhidi ya Yerusalemu na Yuda.”
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania, “masikio yake yote mawili yatavuma,” huonyesha mshtuko au hofu inayosababishwa na habari hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Huonyesha kuwa tangazo hili ni matokeo ya makosa yaliyotajwa katika muktadha uliotangulia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: כֹּה אָמַר
  choice: hivi ndivyo ... anavyosema
  rationale: Ni Kiswahili cha sasa na cha heshima kinachowasilisha kwa uwazi fomula ya mjumbe wa kinabii.
- source_word: הִנְנִי מֵבִיא
  choice: Tazama, ninaleta
  rationale: “Tazama” huhifadhi msisitizo wa tangazo, na kitenzi cha wakati wa sasa huonyesha tendo la Mungu lililo karibu na lililo hakika.
- source_word: רָעָה
  choice: maafa
  rationale: Katika muktadha huu neno linamaanisha janga la hukumu, si uovu wa kimaadili.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: juu ya Yerusalemu na Yuda
  rationale: Huhifadhi taswira ya hukumu inayowajia Yerusalemu na Yuda kwa Kiswahili cha kawaida.
- source_word: כָּל שֹׁמְעָיו
  choice: kila mtu atakayesikia habari zake
  rationale: Kiambishi cha Kiebrania kinaeleweka kwa kawaida kuwa kinarejelea habari ya maafa hayo; “kusikia habari zake” ni usemi wa asili wa Kiswahili.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: masikio yote mawili ... yatavuma
  rationale: Huhifadhi nahau ya mwitikio wa mwili unaosababishwa na habari ya kushtua au kutisha, bila kuifafanua ndani ya mstari.
theological_decisions:
- issue: Maana ya רָעָה katika hukumu ya Mungu
  choice: maafa
  alternative: uovu
  rationale: Muktadha unaeleza janga la adhabu analoleta Mungu, wala si kwamba Mungu analeta uovu wa kimaadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya tangazo la kinabii. “Tazama” limetumiwa kwa msisitizo wa הִנְנִי; “yatavuma” huhifadhi nahau ya Kiebrania huku tanbihi ikieleza maana yake.
