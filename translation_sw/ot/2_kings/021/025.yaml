base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Amoni[a], aliyoyafanya, je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati ya Wafalme wa Yuda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo mengine ya Amoni.” Neno la Kiebrania linaweza kumaanisha “maneno,” “mambo,” au, katika muundo huu wa taarifa za kifalme, matendo yaliyorekodiwa.
    reason: lexical_alternative
  - marker: b
    text: “Kitabu” hapa ni kumbukumbu ya kale iliyoandikwa, huenda kwenye gombo; jina hilo pia linaweza kutafsiriwa “Annali za Wafalme wa Yuda.”
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: mengine
  rationale: Katika muundo huu wa kuhitimisha taarifa ya mfalme, יֶתֶר hueleza yaliyosalia au mengine; Kiswahili cha kawaida husema “matendo mengine” bila kulazimika kuongeza kiunganishi cha mwanzo.
- source_word: דִּבְרֵי
  choice: matendo
  rationale: Ingawa neno hili kwa msingi linaweza kumaanisha “maneno” au “mambo,” katika muundo wa kumbukumbu za kifalme na pamoja na “aliyoyafanya,” linarejelea matendo ya mfalme.
- source_word: אָמ֖וֹן
  choice: Amoni
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyoyafanya
  rationale: Huhifadhi kishazi cha uhusiano kinachoeleza matendo yaliyotajwa na ni Kiswahili cha kawaida.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali, huku upatanisho wa ngeli ukirejelea “matendo.”
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni “juu ya,” kumbukumbu zilizomo katika hati huonyeshwa kwa Kiswahili kwa “katika”; “Kitabu” kinafuata jina la kumbukumbu hiyo.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Mambo ya Nyakati
  rationale: Ni tafsiri iliyozoeleka na sahihi ya usemi wa kumbukumbu za matukio ya siku au annali.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: za Wafalme wa Yuda
  rationale: Katika jina hili la chanzo, לְ huonyesha uhusiano; “za” ni muundo wa asili wa Kiswahili.
