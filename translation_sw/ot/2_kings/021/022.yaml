lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: Akamwacha
  rationale: Kitenzi עזב humaanisha kuacha au kutupilia mbali. “Akamwacha” ni Kiswahili cha kawaida na chenye nguvu inayofaa kwa kutokuwa mwaminifu kwa agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Mungu wa baba zake
  rationale: Huhifadhi muundo halisi wa kifamilia wa Kiebrania; “baba zake” hapa inaweza kuwataja mababu wa ukoo.
- source_word: וְלֹא הָלַךְ
  choice: wala hakuenenda
  rationale: “Kuenenda” huhifadhi sitiari ya הלך kuhusu mwenendo wa maisha, huku “wala” ikiendeleza ukanushi kwa Kiswahili sanifu.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: katika njia ya Yahweh
  rationale: Huhifadhi sitiari ya דֶּרֶךְ kama njia au mwenendo wa maisha unaopatana na mapenzi ya Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano יהוה moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya ukoo katika אֲבֹתָיו
  choice: baba zake
  alternative: mababu zake
  rationale: “Baba zake” hufuata umbo la kiume la Kiebrania na kuhifadhi usemi wa kifamilia na kiagano, huku tanbihi ikieleza maana pana ya ukoo.
- issue: Sitiari ya kutembea katika njia ya Yahweh
  choice: hakuenenda katika njia ya Yahweh
  alternative: hakufuata njia ya Yahweh
  rationale: Chaguo hili huhifadhi sitiari ya Kiebrania bila kuifafanua kupita kiasi kama utiifu au mwenendo mwema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Hakuenenda” imetumiwa kuhifadhi sitiari ya kibiblia ya kutembea kama mwenendo wa maisha; “akamwacha” ni ya kawaida zaidi kuliko “akamwasi,” ambayo ni tafsiri yenye ufafanuzi zaidi.
