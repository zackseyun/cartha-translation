  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: sw
  text: Akamwacha Yahweh[a], Mungu wa baba zake[b], wala hakuenenda katika njia ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtelekeza Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Mungu wa baba zake”; kwa maana pana, “Mungu wa mababu zake.”'
