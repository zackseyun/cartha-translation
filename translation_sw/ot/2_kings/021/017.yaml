  text: וְ/יֶ֨תֶר דִּבְרֵ֤י מְנַשֶּׁה֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וְ/חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Manase, na yote aliyoyafanya, na dhambi yake aliyoitenda—je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha Kumbukumbu za Wafalme wa Yuda.” Usemi wa Kiebrania unamaanisha chanzo cha kumbukumbu rasmi za kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Matendo mengine ya Manase
  rationale: Katika muhtasari wa utawala wa mfalme, דִּבְרֵי humaanisha matendo au mambo yaliyohusu utawala wake, si maneno aliyosema tu. Kiswahili cha sasa hutumia kwa kawaida ‘matendo mengine’ katika muktadha huu.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyoyafanya
  rationale: Huhifadhi maana ya jumla ya kishazi cha Kiebrania huku ikitumia muundo wa kawaida wa Kiswahili.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: na dhambi yake aliyoitenda
  rationale: ‘Dhambi yake’ huhifadhi kiambishi cha umilikaji, na ‘aliyoitenda’ huwasilisha kwa Kiswahili cha kawaida muundo wa Kiebrania unaorudia mzizi wa neno dhambi kwa msisitizo.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali badala ya kuligeuza kuwa taarifa ya moja kwa moja.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda
  rationale: ‘Katika’ ni matumizi ya kawaida kwa habari iliyoandikwa ndani ya kitabu. ‘Mambo ya Nyakati’ huwasilisha jina la kumbukumbu za kifalme bila kudai kwamba chanzo hicho ni lazima kiwe kitabu cha Biblia kinachoitwa Mambo ya Nyakati.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Swali la balagha na msisitizo wa ‘dhambi yake’ vimehifadhiwa.
