base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: sw
  text: Manase akalala pamoja na baba zake[a], akazikwa katika bustani ya nyumba yake, katika bustani ya Uza. Amoni mwanawe akawa mfalme mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hii ni nahau ya kawaida ya kifalme katika Kiebrania inayomaanisha kwamba alikufa. Au, “akapumzika pamoja na baba zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: akapumzika pamoja na mababu zake
  rationale: Hii ni nahau ya kawaida ya taarifa za vifo vya wafalme. “Akapumzika” ni lugha ya heshima na ya sasa inayoonyesha kifo bila kutumia tafsiri ya moja kwa moja “akalala pamoja na baba zake,” ambayo katika Kiswahili cha leo inaweza kueleweka vibaya. “Mababu zake” hapa humaanisha waliomtangulia katika ukoo.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Hutoa kwa kawaida na kwa usahihi hali ya kutendwa ya kitenzi קבר.
- source_word: בְּגַן בֵּיתוֹ
  choice: katika bustani ya nyumba yake
  rationale: Huhifadhi maana ya moja kwa moja ya גן na בית bila kuongeza dhana mahsusi ya ikulu, ingawa muktadha unahusu makao ya kifalme.
- source_word: בְּגַן עֻזָּא
  choice: katika bustani ya Uza
  rationale: Kirai cha pili kimehifadhiwa kama ufafanuzi wa mahali palepale, na jina עֻזָּא limetoholewa kuwa “Uza.”
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika kauli hii ya urithi wa ufalme, kitenzi kinaonyesha kuingia madarakani, si muda wa kutawala tu.
- source_word: תַּחְתָּיו
  choice: badala yake
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba Amoni alichukua nafasi ya Manase katika ufalme.
theological_decisions:
- issue: Nahau ya kifalme kuhusu kifo
  choice: akapumzika pamoja na mababu zake
  alternative: akafa; akalala pamoja na baba zake
  rationale: Chaguo hili linadumisha lugha ya heshima na uhusiano na waliomtangulia bila kuifanya kauli kuwa maelezo ya moja kwa moja kuhusu hali ya wafu. Tanbihi inaonyesha umbo la Kiebrania lililo halisi zaidi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Manase, Uza, na Amoni. Urudiaji wa “katika bustani” umehifadhiwa ili kuakisi muundo wa Kiebrania.'
