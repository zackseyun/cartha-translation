  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: sw
  text: 'Yahwe alinena kwa njia ya watumishi wake, manabii, akisema:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema
  rationale: Kitenzi דבר katika piel hapa kinaonyesha tendo la kusema katika simulizi. “Akasema” ni Kiswahili cha kawaida na kinaongoza kwa urahisi katika ujumbe unaofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בְּיַד
  choice: kupitia
  rationale: Nahau ya Kiebrania yenye maana halisi “kwa mkono wa” hapa inaonyesha uwakala; “kupitia” huwasilisha maana hiyo kwa Kiswahili cha asili bila kudokeza mkono wa kimwili.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha wa manabii waliopewa utume na Mungu, “watumishi” huonyesha huduma na utiifu wao bila kusisitiza hali ya utumwa.
- source_word: הַנְּבִיאִים
  choice: manabii
  rationale: Nomino hii ya wingi inawatambulisha watumishi wanaokusudiwa. Muundo wa ufafanuzi “watumishi wake, manabii” unadumisha uhusiano huo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kis infinitive hii hutanguliza maneno ya moja kwa moja katika mstari unaofuata; “akisema” inadumisha daraja hilo la kimuundo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi katika umbo linalotumika kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nahau ya Kiebrania “kwa mkono wa” imetafsiriwa kwa maana yake ya uwakala, “kupitia,” kwa kuwa tafsiri ya neno kwa neno si ya asili katika Kiswahili. Koma zinazozunguka “manabii” zinaonyesha kuwa ni ufafanuzi wa “watumishi wake.”
