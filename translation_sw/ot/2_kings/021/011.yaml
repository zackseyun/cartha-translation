base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: sw
  text: “Kwa sababu Manase, mfalme wa Yuda, amefanya machukizo haya, ametenda maovu kuliko yote waliyotenda Waamori waliomtangulia, na pia amewasababisha watu wa Yuda watende dhambi kwa sanamu zake[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “sanamu” ni neno la dharau; linaweza pia kutafsiriwa “sanamu chafu,” au kwa lugha kali zaidi, “sanamu za kinyesi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Kwa sababu
  rationale: Hutanguliza sababu ya hukumu inayotangazwa katika mstari unaofuata na kuhifadhi nguvu ya kisababishi.
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: Manase, mfalme wa Yuda
  rationale: Hutumia umbo la kawaida la jina katika Kiswahili na kuhifadhi cheo cha kifalme kama kirai cha ufafanuzi.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: machukizo haya
  rationale: Neno hili lina uzito wa kinabii na wa agano, likimaanisha matendo au vitu vinavyochukiza sana.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: ametenda maovu kuliko yote waliyotenda
  rationale: Huhifadhi ulinganisho wa Kiebrania kwamba uovu wa Manase ulizidi matendo yote ya Waamori waliotangulia.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa umbo la Kiebrania ni la umoja wa kimofolojia, hapa jina la taifa limetumiwa kwa maana ya jamii nzima.
- source_word: אֲשֶׁר לְפָנָיו
  choice: waliomtangulia
  rationale: Hutoa kwa Kiswahili cha asili maana ya wale waliokuwapo kabla yake bila kuongeza maneno yasiyomo katika chanzo.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: na pia amewasababisha watu wa Yuda watende dhambi
  rationale: 'Huhifadhi kausativi ya kitenzi: Manase si kwamba alitenda dhambi peke yake, bali aliwaongoza au kuwasababisha watu wa Yuda kutenda dhambi.'
- source_word: בְּגִלּוּלָיו
  choice: kwa sanamu zake
  rationale: Kihusishi kinaeleweka kama cha chombo au njia; 'sanamu' ni wazi katika matini kuu, huku dharau kali ya neno la Kiebrania ikielezwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya dharau katika גִּלּוּלִים
  choice: sanamu zake
  alternative: sanamu zake chafu; sanamu za kinyesi
  rationale: Neno la Kiebrania ni la kudharau sanamu. 'Sanamu zake' ni la kawaida na lenye hadhi katika matini kuu, huku tanbihi ikihifadhi maana yake kali bila kuifanya tafsiri kuu isikike ya kupita kiasi.
- issue: Yuda kama nchi au watu katika kausativi ya kutenda dhambi
  choice: watu wa Yuda
  alternative: Yuda
  rationale: Kiebrania hutaja Yuda kwa metonimia. Kiswahili 'watu wa Yuda' huweka wazi kwamba watu ndio waliotenda dhambi, bila kubadili maana ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umeachwa wazi kwenda katika tamko la hukumu la mstari unaofuata; kwa hiyo mstari huu unaishia kwa koma ndani ya nukuu.
