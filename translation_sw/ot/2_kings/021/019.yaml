  verdict: revise
  source_fidelity: The regnal age, accession, two-year reign in Jerusalem, maternal notice, and origin phrase are represented accurately. However, Haruz is incorrectly rendered “Harusi,” which changes the personal name into an unrelated Swahili word.
  naturalness: The wording is clear, idiomatic Standard East African Swahili, and appropriately concise for a royal regnal formula. “Mama yake aliitwa” and “naye akatawala” are natural.
  terminology: Amoni, Yerusalemu, Meshulemethi, and Yotba are suitable Swahili-style forms. Haruz should be rendered “Haruzi,” not “Harusi”; the latter normally means “wedding” in Swahili and does not represent the Hebrew name.
  issues:
  - severity: high
    issue: The name חָרוּץ (Haruz) is translated as “Harusi.”
    rationale: “Harusi” is not a faithful transliteration of the Hebrew personal name and introduces a different, ordinary Swahili lexical meaning. “Haruzi” preserves the name and follows common Kiswahili biblical name formation.
  revised_text: Amoni alikuwa na umri wa miaka ishirini na miwili alipoanza kutawala, naye akatawala Yerusalemu kwa miaka miwili. Mama yake aliitwa Meshulemethi, binti ya Haruzi kutoka Yotba.
