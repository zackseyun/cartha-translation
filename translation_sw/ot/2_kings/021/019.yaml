base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: sw
  text: Amoni alikuwa na umri wa miaka ishirini na miwili alipoanza kutawala, naye akatawala Yerusalemu kwa miaka miwili. Mama yake aliitwa Meshulemethi, binti ya Haruzi kutoka Yotba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: alikuwa na umri wa miaka ishirini na miwili
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; tafsiri hii ni ya asili na wazi katika Kiswahili.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati Amoni alipoingia katika ufalme; Kiswahili hiki huwasilisha maana hiyo kwa kawaida.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki humaanisha kutawala kama mfalme, si kuwa na cheo cha mfalme tu.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Jina la mahali limeandikwa kwa umbo linalotumiwa kwa kawaida katika Kiswahili, huku maana ya mahali ikibebwa na muundo wa kitenzi.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii ni njia ya asili ya Kiswahili ya kuwasilisha taarifa kwamba jina la mama yake lilikuwa fulani.
- source_word: מְשֻׁלֶּמֶת
  choice: Meshulemethi
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na muundo unaosomeka kwa urahisi katika Kiswahili.
- source_word: בַּת חָרוּץ
  choice: binti ya Harusi
  rationale: Huu ni usemi wa kawaida wa nasaba; majina yametoholewa kwa Kiswahili.
- source_word: מִן יָטְבָה
  choice: kutoka Yotba
  rationale: Kihusishi מִן kinaonyesha asili au mahali alikotoka; “kutoka” huhifadhi maana hiyo moja kwa moja.
