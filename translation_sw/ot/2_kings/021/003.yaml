base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: sw
  text: Akajenga tena maeneo ya juu ambayo Hezekia, baba yake, alikuwa ameharibu; akamjengea Baali madhabahu, akatengeneza nguzo ya Ashera kama alivyofanya Ahabu, mfalme wa Israeli, akaliinamia jeshi lote la mbinguni na kulitumikia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: Ni istilahi ya kawaida ya kibiblia kwa maeneo ya ibada yaliyoinuka; inahifadhi uwezekano kwamba yalikuwa maeneo ya ibada ya aina mbalimbali.
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: akamjengea Baali madhabahu
  rationale: Kihusishi ל־ hapa kinaonyesha madhabahu zilizowekwa kwa ajili ya ibada ya Baali; Kiswahili hiki ni cha asili na hakibadili wingi wa 'madhabahu'.
- source_word: אֲשֵׁרָה
  choice: nguzo ya Ashera
  rationale: Katika muktadha huu neno linaelekea kutaja kitu cha ibada kinachohusishwa na Ashera; 'nguzo ya Ashera' huepuka kukitambulisha moja kwa moja kuwa mungu wa kike, ingawa umbo hasa la kitu hicho halijaelezwa.
- source_word: כָּל־צְבָא הַשָּׁמַיִם
  choice: jeshi lote la mbinguni
  rationale: Tafsiri ya karibu inayohifadhi nahau ya Kiebrania kwa mkusanyiko wa viumbe au vitu vya angani vilivyoabudiwa.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: na kulitumikia
  rationale: Kitenzi עבד katika muktadha wa ibada kina maana ya kutoa huduma ya kidini au kuabudu; 'kulitumikia' kinahifadhi picha halisi na umoja wa kisarufi wa 'jeshi' katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa אֲשֵׁרָה kama mungu wa kike au kitu cha ibada
  choice: nguzo ya Ashera
  alternative: sanamu ya Ashera / Ashera
  rationale: Maandishi yanatumia jina linaloweza kumaanisha mungu wa kike au kitu chake cha ibada. Muktadha wa 'akatengeneza' unaunga mkono kitu kilichotengenezwa, lakini umbo lake halipaswi kufafanuliwa kupita ushahidi wa maandishi.
- issue: Maana ya 'jeshi la mbinguni'
  choice: kuhifadhi nahau bila kuibainisha
  alternative: nyota zote za angani
  rationale: Nahau inaweza kuhusisha jua, mwezi, nyota, na viumbe vingine vya angani; kuisema 'nyota' pekee kungepunguza wigo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Mfululizo wa vitenzi vya 'aka-' unahifadhi mwendo wa simulizi la Kiebrania. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
