base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: sw
  text: Nami nitanyoosha juu ya Yerusalemu kamba ya kupimia ya Samaria, na timazi ya nyumba ya Ahabu[a]. Nitaifuta Yerusalemu kama mtu afutavyo sahani[b], akiifuta na kuipindua kifudifudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kamba ya wajenzi ya Samaria, na timazi ya nyumba ya Ahabu.” Taswira ni ya kuipima Yerusalemu kwa ajili ya hukumu kwa kipimo kilekile kilichotumiwa kuwahukumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “bakuli” badala ya “sahani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: Nami nitanyoosha juu ya
  rationale: Kitenzi נָטָה kinamaanisha kunyoosha au kutandaza. Pamoja na קָו na עַל, kinadumisha picha halisi ya kunyoosha kamba ya kupimia juu ya Yerusalemu.
- source_word: קָו
  choice: kamba ya kupimia
  rationale: קָו ni kamba au mstari wa kupimia. ‘Kamba ya kupimia’ inaeleweka kwa urahisi na kuhifadhi taswira ya ujenzi au upimaji inayotumiwa hapa kutangaza hukumu.
- source_word: מִשְׁקֹלֶת
  choice: timazi
  rationale: מִשְׁקֹלֶת ni kifaa chenye uzito cha kupimia unyofu wa wima. ‘Timazi’ ni istilahi sahihi ya Kiswahili na inaendana na kamba ya kupimia.
- source_word: בֵּית אַחְאָב
  choice: nyumba ya Ahabu
  rationale: Huu ni usemi wa kawaida wa nasaba, ukimaanisha ukoo au nasaba ya kifalme ya Ahabu. Tafsiri ya moja kwa moja inahifadhi usemi wa Kiebrania.
- source_word: וּמָחִיתִי
  choice: Nitaifuta
  rationale: Muktadha wa sahani unaongoza maana ya מָחָה. ‘Kufuta’ huhifadhi kitendo halisi na pia dokezo la kuondoa kabisa katika hukumu.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: kama mtu afutavyo sahani
  rationale: Nafsi ya tatu ya kiume imetumiwa kwa maana ya jumla. ‘Kama mtu afutavyo’ ni ya kawaida na haimtambulishi mhusika zaidi ya chanzo; צַלַּחַת inaweza kuwa sahani au bakuli.
- source_word: מָחָה
  choice: akiifuta
  rationale: Kurudiwa kwa mzizi מָחָה kunasisitiza na kufafanua tendo. Kurudia ‘akiifuta’ kunadumisha msisitizo huo bila kuwa nzito.
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: na kuipindua kifudifudi
  rationale: Kihalisi ni ‘na kuigeuza juu ya uso wake.’ Kwa sahani, ‘kuipindua kifudifudi’ ni Kiswahili cha kawaida kinachohifadhi picha hiyo.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili.
theological_decisions:
- issue: Maana ya mfano wa kamba ya kupimia na timazi za Samaria na nyumba ya Ahabu
  choice: Yerusalemu itapimwa kwa hukumu ileile iliyotumiwa dhidi ya Samaria na nyumba ya Ahabu.
  alternative: Katika miktadha mingine vifaa vya kupimia vinaweza kuashiria ujenzi mpya au urejesho.
  rationale: Muktadha wa karibu ni wa hukumu, na mfano unaofuata wa kufuta sahani na kuipindua unaonyesha wazi kwamba upimaji hapa unahusu maangamizi, si urejesho. Maneno ‘iliyotumiwa kwa’ yanaweka wazi uhusiano huo bila kubadili taswira yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Timazi’ ni istilahi mahususi ya kifaa cha kupimia wima; tanbihi inasaidia kufafanua taswira. Muundo wa kishairi wa hukumu na marudio ya ‘kufuta’ umehifadhiwa.
