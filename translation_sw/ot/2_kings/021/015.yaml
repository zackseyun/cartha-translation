source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר עָשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינַ֔/י וַ/יִּהְי֥וּ מַכְעִסִ֖ים אֹתִ֑/י מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבוֹתָ/ם֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: sw
  text: kwa sababu wamefanya yaliyo mabaya machoni pangu, na wameendelea kunikasirisha tangu siku baba zao walipotoka Misri mpaka leo hii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu zao walipotoka Misri.” Kiebrania kinasema “baba zao,” neno la ukoo la kiume linalotumiwa hapa kwa vizazi vilivyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaonyesha sababu ya hukumu iliyotangazwa katika mstari uliotangulia; “kwa sababu” ni ya kawaida na wazi katika Kiswahili.
- source_word: עָשׂוּ אֶת־הָרַע
  choice: wamefanya yaliyo mabaya
  rationale: Nahau ya Kiebrania ina maana ya kufanya mambo yaliyo mabaya, si kwa ugumu wa maneno “kufanya ubaya.” Wakati timilifu unaonyesha matendo yaliyotendwa yenye umuhimu unaoendelea.
- source_word: בְּעֵינַי
  choice: machoni pangu
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini ya Mungu na ni usemi unaoeleweka katika Kiswahili.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: na wameendelea kunikasirisha
  rationale: Muundo wa היה pamoja na kitenzi-partisipio unaonyesha tendo la muda mrefu au la mazoea; “wameendelea” hudhihirisha hali hiyo.
- source_word: מַכְעִסִים
  choice: kunikasirisha
  rationale: Hifili ya כעס hapa humaanisha kusababisha hasira ya Mungu. Kiswahili cha moja kwa moja “kunikasirisha” ni wazi kuliko “kunichokoza,” ambalo linaweza lisibebe wazi matokeo ya hasira.
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: tangu siku
  rationale: Huonyesha mwanzo wa mwenendo unaoendelea na ni wa asili katika Kiswahili.
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: baba zao walipotoka Misri
  rationale: “Walipotoka Misri” huhifadhi kitenzi cha kawaida cha kutoka katika simulizi la Kutoka; “baba zao” hudumisha neno la ukoo la kiume katika Kiebrania.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kuendelea hadi wakati wa msemaji.
theological_decisions:
- issue: Mwendelezo wa pamoja wa hatia ya Israeli tangu kizazi cha kutoka Misri
  choice: Kuhifadhi mtazamo wa kihistoria na wa pamoja kwa kusema kwamba wameendelea kumkasirisha Mungu tangu kutoka Misri mpaka siku hiyo.
  alternative: Kufanya maneno yahusu tu dhambi za wafalme wa karibuni.
  rationale: Mstari wenyewe unafuatilia uasi kutoka kizazi cha kutoka Misri hadi wakati wa sasa; tafsiri haipunguzi mvutano huo kuwa makosa ya watu mmoja mmoja pekee.
- issue: Tafsiri ya neno la ukoo אֲבוֹתָם
  choice: baba zao
  alternative: mababu zao / wazee wao wa kale
  rationale: Neno la Kiebrania ni la kiume na kihalisi ni “baba zao,” ingawa katika muktadha linawahusu watu wa vizazi vilivyotangulia. Maana hiyo pana imeonyeshwa katika tanbihi bila kuibadili kimya kimya katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Usemi “machoni pangu” umehifadhi sitiari ya chanzo; “wameendelea kunikasirisha” unaonyesha tendo la kudumu au la mazoea.
