  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: sw
  text: Akajenga madhabahu kwa ajili ya jeshi lote la mbinguni katika nyua mbili za nyumba ya Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jeshi zima la mbinguni.” Nahau ya Kiebrania “jeshi la mbinguni” humaanisha viumbe au vitu vya angani; katika muktadha huu huenda ikarejelea miili au nguvu za mbinguni zilizoabudiwa katika ibada ya nyota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akajenga
  rationale: Kitenzi cha masimulizi katika Qal kinaendeleza mfuatano wa matukio; kiambishi “aka-” kinaonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: מִזְבְּחוֹת
  choice: madhabahu
  rationale: Nomino hii ni ya wingi katika Kiebrania; “madhabahu” ni neno la kawaida la Kiswahili linaloweza kuonyesha wingi kutokana na muktadha.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: kwa ajili ya jeshi lote la mbinguni
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania na maana yake ya pamoja bila kuipunguza iwe “nyota” pekee; katika muktadha inaweza kumaanisha miili au nguvu za mbinguni zilizoabudiwa.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: katika nyua mbili
  rationale: Namba ya Kiebrania inataja wazi nyua mbili; “nyua” ni Kiswahili cha asili kwa maeneo ya wazi yaliyozungukwa katika jengo la hekalu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Inahifadhi tamathali ya Kiebrania “nyumba” na kulitaja jina la agano יְהוָה moja kwa moja kama “Yahweh.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; “Yahweh” hulihifadhi kama jina bila kulibadilisha kuwa cheo.
- issue: Utambulisho wa צְבָא הַשָּׁמָיִם
  choice: jeshi lote la mbinguni
  alternative: nyota zote za mbinguni
  rationale: Nahau inaweza kuhusisha miili au nguvu za mbinguni. Tafsiri pana inadumisha utata halisi na haikazii nyota pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “Akajenga” unaendeleza masimulizi kwa ufasaha; “nyumba ya Yahweh” huhifadhi picha ya chanzo badala ya kuifafanua moja kwa moja kuwa hekalu.
