  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הָ/אֲשֵׁרָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה בַּ/בַּ֗יִת אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ אֶל דָּוִד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: sw
  text: Akaweka ndani ya nyumba sanamu ya kuchongwa ya Ashera[a] aliyotengeneza, nyumba ambayo Yahwe alikuwa amemwambia Daudi na Solomoni mwanawe, “Katika nyumba hii na katika mji wa Yerusalemu, ambao nimeuchagua kutoka makabila yote ya Israeli, nitaliweka jina langu milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu ya Ashera.” Kiebrania kinaunganisha “sanamu ya kuchongwa” na “Ashera,” kikimaanisha sanamu inayohusishwa na Ashera au inayomwakilisha. Wengine hutafsiri “nguzo ya Ashera,” lakini hilo si sahihi sana hapa kwa sababu andiko linataja wazi sanamu ya kuchongwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Akaweka
  rationale: Kitenzi hiki kinaendeleza simulizi na kueleza tendo lililokamilika la kuweka kitu mahali.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: sanamu ya kuchonga ya Ashera
  rationale: Huhifadhi maana halisi ya פֶּסֶל kama sanamu iliyochongwa na uhusiano wake na Ashera, bila kuibana kuwa nguzo pekee.
- source_word: בַּבַּיִת / בַּבַּיִת הַזֶּה
  choice: katika Hekalu / Katika Hekalu hili
  rationale: Ingawa neno la Kiebrania kimsingi ni ‘nyumba,’ hapa linarejelea wazi Hekalu la Yerusalemu; kurudia ‘Hekalu’ kunahifadhi mwangwi wa neno lilelile.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kwa namna iliyozoeleka katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וְאֶל שְׁלֹמֹה בְנוֹ
  choice: na kwa mwanawe Solomoni
  rationale: Kiambishi cha ‘mwanawe’ kinamrejelea Daudi; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וּבִירוּשָׁלִַם אֲשֶׁר בָּחַרְתִּי
  choice: na katika Yerusalemu, ambao nimeuchagua
  rationale: Kiwakilishi ‘ambao’ kinaweza kurejelea jozi ya Hekalu na Yerusalemu kama mahali palipochaguliwa, huku ‘nimeuchagua’ kikifuata ngeli ya Yerusalemu katika matumizi ya kawaida.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: miongoni mwa makabila yote ya Israeli
  rationale: Huonyesha uchaguzi kutoka ndani ya jumla ya makabila ya Israeli.
- source_word: אָשִׂים אֶת שְׁמִי לְעוֹלָם
  choice: nitaliweka jina langu milele
  rationale: Huhifadhi lugha ya agano kuhusu Mungu kuweka jina lake mahali fulani bila kuifafanua zaidi kiteolojia.
theological_decisions:
- issue: Utambulisho wa kitu cha ibada kinachohusishwa na אֲשֵׁרָה
  choice: sanamu ya kuchonga ya Ashera
  alternative: nguzo ya Ashera
  rationale: Andiko linatumia wazi פֶּסֶל, ‘sanamu ya kuchonga,’ pamoja na Ashera. Tafsiri iliyochaguliwa inahifadhi ushahidi huo na haidai kwamba kitu hicho kilikuwa nguzo tu.
- issue: Uwasilishaji wa יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina ‘Yahwe’ huhifadhi jina binafsi lililo katika matini ya Kiebrania; hakubadilishwi kimyakimya kuwa cheo.
- issue: Mahali pa kuwekwa kwa jina la Mungu
  choice: Katika Hekalu hili na katika Yerusalemu
  alternative: Katika Hekalu hili lililoko Yerusalemu
  rationale: Muundo wa Kiebrania unataja Hekalu na Yerusalemu kwa viunganishi, hivyo tafsiri haivifanyi kimyakimya kuwa kishazi kimoja cha mahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya maandiko. ‘Hekalu’ limetumiwa kwa uwazi wa muktadha, huku urudiaji wa neno la chanzo ukihifadhiwa. Alama ya tanbihi [a] imewekwa mara moja baada ya kirai kinachohusika.
