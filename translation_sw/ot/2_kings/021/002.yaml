  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: sw
  text: Akafanya yaliyo maovu machoni pa Yahweh, akifuata matendo ya kuchukiza ya mataifa[a] ambayo Yahweh alikuwa ameyafukuza mbele ya wana wa Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama machukizo ya mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “wana wa Israeli”; inaweza pia kutafsiriwa “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Akafanya yaliyo maovu
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida nahau ya Kiebrania ‘kufanya yaliyo maovu,’ huku ‘Aka-’ ikidumisha mwendelezo wa simulizi.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini inayofanywa mbele za Mungu na ni usemi unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: כְּתוֹעֲבֹת
  choice: akifuata matendo ya kuchukiza
  rationale: כְ hapa inaweza kuonyesha kufanana au kufuata mfano; ‘akifuata’ huleta wazi maana ya kuenenda kwa mfano wao, na ‘matendo ya kuchukiza’ hueleza kwa kawaida wingi wa תּוֹעֵבָה katika muktadha huu.
- source_word: הַגּוֹיִם
  choice: mataifa
  rationale: Neno hili linarejelea makundi ya watu wasio Waisraeli waliokuwa katika nchi, hivyo ‘mataifa’ linafaa bila kuingiza maana za baadaye za kidini.
- source_word: הוֹרִישׁ
  choice: alikuwa ameyafukuza
  rationale: Hifili ya ירש hapa ina maana ya kuwanyang’anya umiliki au kuwatoa katika nchi; ‘ameyafukuza’ ni ya kawaida na inafaa muktadha wa kihistoria.
- source_word: מִפְּנֵי
  choice: mbele ya
  rationale: Huhifadhi kwa karibu taswira ya Kiebrania ya kuondolewa mbele ya watu wa Israeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa Kiebrania wenye maana halisi ya ‘wana wa Israeli,’ badala ya kuugeuza moja kwa moja kuwa jina la kitaifa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo; ‘Yahweh’ hulihifadhi kwa unukuzi unaokubalika wa jina hilo.
- issue: Maana ya כְּתוֹעֲבֹת
  choice: akifuata matendo ya kuchukiza
  alternative: kama machukizo
  rationale: Kiswahili cha matini kuu kinaonyesha kwamba mfalme aliiga au alifuata desturi za mataifa. Tanbihi huhifadhi tafsiri iliyo rasmi zaidi na uzito wa neno ‘machukizo’ bila kuficha uwezekano wa kulisoma kama ulinganisho.
- issue: Usemi wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo kuu huhifadhi usemi wa kifamilia na umbo la kiume la chanzo; tanbihi inatoa namna ya kawaida zaidi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘Akafanya’ unaendeleza simulizi, na ‘matendo ya kuchukiza’ ni wa kawaida zaidi kuliko nomino dhahania ‘machukizo’ katika sentensi kuu.
