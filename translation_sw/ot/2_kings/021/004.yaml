  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: sw
  text: Akajenga madhabahu katika nyumba ya Yahweh[a]. Kuhusu nyumba hiyo Yahweh alikuwa amesema, “Yerusalemu nitaliweka jina langu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hekalu la Yahweh.” Kihalisi, “katika nyumba ya Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Kauli “nitaliweka jina langu” ni lugha ya agano kuhusu hekalu: mahali ambapo Yahweh anachagua kuhusisha jina lake na uwepo wake.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בָנָה
  choice: Akajenga
  rationale: Kitenzi cha masimulizi cha Kiebrania kinaendeleza mfuatano wa matukio; ‘Akajenga’ ni njia ya kawaida na ya asili ya kuonyesha mwendelezo huo kwa Kiswahili.
- source_word: מִזְבְּחֹת
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa maeneo ya kutolea dhabihu; umbo lake hutumika kwa umoja na wingi, huku muktadha ukionyesha wingi.
- source_word: בְּ/בֵית יְהוָה
  choice: katika nyumba ya Yahweh
  rationale: Huhifadhi taswira halisi ya Kiebrania, ‘nyumba ya Yahweh’; ‘hekalu la Yahweh’ ni tafsiri mbadala ya kimaana.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: ambayo Yahweh alikuwa amesema juu yake
  rationale: Kishazi rejeshi kinahusishwa na nyumba ya Yahweh, na ‘alikuwa amesema’ huonyesha kuwa kauli hiyo ilitangulia tendo la kujenga.
- source_word: בִּ/ירוּשָׁלַם
  choice: Yerusalemu
  rationale: Mahali pamewekwa mwanzoni mwa nukuu kama katika Kiebrania, jambo linalodumisha msisitizo wake.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: nitaliweka jina langu
  rationale: Huhifadhi nahau ya agano na hekalu bila kuipanua kitafsiri kuwa ‘uwepo wangu’; kiambishi cha ngeli katika ‘nitaliweka’ kinakubaliana na ‘jina’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano lenyewe. ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Teolojia ya hekalu katika ‘nitaliweka jina langu’
  choice: Kudumisha nahau ‘nitaliweka jina langu’
  alternative: Nitaweka uwepo wangu; nitalifanya jina langu likae huko
  rationale: Nahau inaashiria mahali Mungu alipochagua kuhusianisha na jina na uwepo wake, lakini tafsiri kuu haipaswi kufafanua zaidi ya maneno ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisasa. ‘Nyumba ya Yahweh’ imedumishwa kwa ukaribu na Kiebrania, huku ‘hekalu’ likitolewa katika tanbihi kwa uwazi. Alama zote za tanbihi zimewekwa katika matini kuu.
