  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: sw
  text: Wala sitasababisha tena mguu wa Israeli utange[a] kutoka katika nchi niliyowapa baba zao[b], ikiwa tu watakuwa waangalifu kutenda sawasawa na yote niliyowaamuru, na sawasawa na sheria yote[c] ambayo mtumishi wangu Musa aliwaagiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kusababisha mguu wa Israeli utange.” Usemi huo unaonyesha kuhamishwa kwa Israeli kutoka katika nchi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mababu zao.” “Baba zao” ni usemi wa kiagano unaowarejelea mababu wa kale wa Israeli.
    reason: lexical_alternative
  - marker: c
    text: Au, “mafundisho” au “maagizo.” Hapa neno hilo linarejelea Torati iliyotolewa kupitia Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: tena
  rationale: Katika muundo wa לֹא pamoja na יסף, neno hili linaonyesha kutorudiwa kwa tendo; “tena” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: kusababisha mguu wa Israeli utange
  rationale: Tafsiri hii inadumisha taswira halisi ya mguu wa taifa kutanga, huku muundo wa kusababisha ukionyesha Hiphil ya kitenzi. Maelezo ya “mbali na nchi” yanaweka wazi kwamba taswira inahusu kuhamishwa.
- source_word: הָאֲדָמָה
  choice: nchi
  rationale: Katika muktadha wa eneo ambalo Mungu aliwapa mababu wa Israeli, neno hili linamaanisha nchi, si udongo tu.
- source_word: לַאֲבוֹתָם
  choice: baba zao
  rationale: Hii inahifadhi usemi wa agano unaowarejelea mababu wa Israeli; tanbihi inatoa “mababu zao” kama njia nyingine ya asili ya kusema hivyo.
- source_word: רַק אִם
  choice: ikiwa tu
  rationale: Usemi huu unaonyesha sharti lenye nguvu ya kuweka mpaka, bila kuufanya kuwa matakwa yasiyo halisi.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: watakuwa waangalifu kutenda
  rationale: Muundo huu unadumisha wazo la kuzingatia kwa makini ili kutenda, badala ya kupunguza maana kuwa utii pekee.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִם
  choice: sawasawa na yote niliyowaamuru
  rationale: “Sawasawa na” linaonyesha kufuata kipimo au kiwango kilichowekwa na maagizo yote ya Mungu.
- source_word: הַתּוֹרָה
  choice: sheria
  rationale: Katika muktadha huu wa agano la Musa, “sheria” ni tafsiri ya kawaida na inayoeleweka, ingawa neno la Kiebrania linaweza pia kumaanisha “mafundisho” au “maagizo.”
- source_word: עַבְדִּי מֹשֶׁה
  choice: mtumishi wangu Musa
  rationale: Hii ni tafsiri ya moja kwa moja na ya heshima, bila kuongeza maana ya kidhehebu.
theological_decisions:
- issue: Sharti la Israeli kuendelea kukaa bila kuhamishwa katika nchi
  choice: ikiwa tu watakuwa waangalifu kutenda
  alternative: kuifanya kauli hii kuwa ahadi isiyo na sharti au sharti la kinadharia tu
  rationale: רַק אִם huweka sharti halisi la utii. Tafsiri inadumisha mvutano wa kiagano uliomo katika mstari bila kuupatanisha kimakusudi na mtazamo wa ahadi isiyo na masharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya Kiebrania ya “mguu wa Israeli” imehifadhiwa kwa makusudi, na tanbihi inaifafanua; muundo wa sharti umeachwa wazi bila kuondoa mvutano wa kitheolojia.
