  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: sw
  text: Watumishi wa Amoni wakafanya njama dhidi yake[a], wakamuua mfalme katika nyumba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapanga njama dhidi yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: wakafanya njama
  rationale: Katika muktadha wa kisiasa, kitenzi קשר kinamaanisha kufanya njama au kula njama. ‘Wakafanya njama’ ni Kiswahili cha kawaida na kinaonyesha mpango wa siri dhidi ya mfalme.
- source_word: עַבְדֵי אָמוֹן
  choice: Watumishi wa Amoni
  rationale: עבדים inaweza kumaanisha watumishi au wahudumu wa kifalme. ‘Watumishi’ huhifadhi maana pana bila kuamua kwamba walikuwa maofisa rasmi.
- source_word: עָלָיו
  choice: dhidi yake
  rationale: Pamoja na lugha ya kufanya njama, על inaonyesha kuwa njama hiyo ilielekezwa kwa uadui dhidi ya Amoni.
- source_word: וַיָּמִיתוּ
  choice: wakamuua
  rationale: Hifili ya מות ina maana ya kusababisha afe. ‘Wakamuua’ ni tafsiri ya asili na ya moja kwa moja katika Kiswahili; ‘wakamfisha’ si ya kawaida katika matumizi haya.
- source_word: אֶת־הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiebrania kinatumia cheo ‘mfalme,’ si jina lake, hivyo tafsiri inadumisha namna hiyo ya simulizi.
- source_word: בְּבֵיתוֹ
  choice: nyumbani mwake
  rationale: בְּבֵיתוֹ humaanisha ‘katika nyumba yake.’ ‘Nyumbani mwake’ ni Kiswahili cha kawaida na hakiongezi msisitizo usio wazi katika Kiebrania.
