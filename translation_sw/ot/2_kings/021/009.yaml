  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: sw
  text: Lakini hawakusikiliza, naye Manase akawapotosha kufanya maovu zaidi kuliko mataifa[a] ambayo Yahweh alikuwa ameyaangamiza mbele ya wana wa Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufanya uovu zaidi kuliko mataifa.” Kiebrania kinaonyesha ulinganisho kwa neno lenye maana ya “kutoka/kuliko.”
    reason: lexical_alternative
  - marker: b
    text: 'Au, “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: hawakusikiliza
  rationale: Kitenzi שׁמע hapa kinahusisha kusikia kwa kuitikia. “Hawakusikiliza” huhifadhi maana ya kusikia na kukataa kuitikia bila kuifanya moja kwa moja kuwa “hawakutii.”
- source_word: וַיַּתְעֵם
  choice: akawapotosha
  rationale: Muundo wa kisababishi wa תעה unaonyesha kwamba Manase aliwasababisha watu wapotee kimaadili na kiroho. “Akawapotosha” ni Kiswahili cha kawaida kinachoonyesha ushawishi huo wenye kusababisha.
- source_word: לַעֲשׂוֹת אֶת הָרָע
  choice: wafanye maovu
  rationale: Kauli hii ni ‘kufanya uovu’; wingi wa kawaida “maovu” unasikika vizuri katika Kiswahili, huku ulinganisho unaofuata ukionyesha kiwango kilichozidi.
- source_word: מִן הַגּוֹיִם
  choice: kuliko mataifa
  rationale: מִן hapa ni ya ulinganisho. “Kuliko mataifa” huonyesha kwamba matendo yao maovu yalizidi yale ya mataifa, bila kutumia neno la baadaye la kidini kama “Mataifa” kwa maana ya wasio Wayahudi.
- source_word: הִשְׁמִיד
  choice: alikuwa ameyaangamiza
  rationale: Kitenzi kina nguvu ya kuharibu au kuangamiza kabisa. Wakati uliotangulia unaonyesha kuwa tendo hilo lilitokea kabla ya utawala wa Manase.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: מִפְּנֵי
  choice: mbele ya
  rationale: Katika muktadha wa ushindi wa Kanaani, nahau hii inaonyesha mataifa kuangamizwa na kuondolewa mbele ya Israeli.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inahifadhi kwa karibu usemi wa Kiebrania ‘wana wa Israeli’; katika muktadha huo unamaanisha jamii yote ya Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; kwa hiyo “Yahwe” huhifadhi jina hilo.
- issue: Upeo wa usemi בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” hufuata muundo wa chanzo, lakini usemi huo wa agano unawahusu watu wa Israeli kwa ujumla, jambo linalobainishwa katika tanbihi.
- issue: Ulinganisho wa kiwango cha uovu
  choice: wafanye maovu kuliko mataifa
  alternative: wafanye uovu mwingi zaidi ya mataifa
  rationale: Kiebrania hutumia מִן ya ulinganisho. Tafsiri kuu inahifadhi muundo wenye mvutano wa kiasi, huku tanbihi ikieleza maana mbadala iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka mtiririko wa simulizi kwa “naye ... aka-,” na imeepuka istilahi nzito zisizo za lazima. “Maovu kuliko mataifa” ni ya kawaida lakini inadumisha ulinganisho wenye kubana uliopo katika Kiebrania.
