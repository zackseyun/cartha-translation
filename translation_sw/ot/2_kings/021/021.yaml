  text: וַ/יֵּ֕לֶךְ בְּ/כָל הַ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֣ךְ אָבִ֑י/ו וַֽ/יַּעֲבֹ֗ד אֶת הַ/גִּלֻּלִים֙ אֲשֶׁ֣ר עָבַ֣ד אָבִ֔י/ו וַ/יִּשְׁתַּ֖חוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: sw
  text: Akaifuata njia yote ambayo baba yake alikuwa ameifuata; akazitumikia sanamu[a] ambazo baba yake alikuwa amezitumikia, na akazisujudia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania גִּלֻּלִים ni jina la dharau kwa sanamu; pia linaweza kutafsiriwa “sanamu za kuchukiza” au, kwa ukali zaidi, “sanamu za kinyesi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ
  choice: Akaifuata njia yote ambayo ... alikuwa ameifuata
  rationale: Kirai hiki kinaeleza mwenendo wa maisha, si kutembea kimwili tu. ‘Kuifuata njia’ ni Kiswahili cha kawaida kinachohifadhi taswira ya njia na maana ya kuiga mwenendo.
- source_word: אָבִיו
  choice: baba yake
  rationale: Hili ni rejeo la moja kwa moja kwa baba yake; limerudiwa katika tafsiri kama lilivyorudiwa katika Kiebrania.
- source_word: וַיַּעֲבֹד
  choice: akazitumikia
  rationale: Kitenzi עבד kimsingi humaanisha ‘kutumikia.’ Hapa kinahusu ibada kwa sanamu, lakini ‘akazitumikia’ kinadumisha tofauti na tendo la kusujudu linalofuata.
- source_word: הַגִּלֻּלִים
  choice: sanamu
  rationale: Neno hili linarejelea sanamu za kuabudiwa na lina dharau kali katika Kiebrania. ‘Sanamu’ linaeleweka kwa urahisi katika Kiswahili; dharau ya neno la asili imeelezwa katika tanbihi.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: na akazisujudia
  rationale: Kitenzi hiki huonyesha kuinama au kujitupa chini kwa heshima ya kiibada. ‘Kusujudia’ ni cha asili na kinaweka wazi tendo hilo bila kulichanganya na ‘kutumikia.’
theological_decisions:
- issue: Dharau iliyomo katika neno גִּלֻּלִים kwa sanamu
  choice: sanamu
  alternative: sanamu za kuchukiza; sanamu za kinyesi
  rationale: ‘Sanamu’ linataja vitu vinavyokusudiwa kwa uwazi na kwa Kiswahili cha kawaida. Neno la Kiebrania lina dharau inayoweza kutafsiriwa kwa ukali zaidi, lakini kuiingiza moja kwa moja katika matini kungefanya sentensi isikike isiyo ya kawaida; kwa hiyo maana hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuifuata njia’ ni usemi wa kawaida unaowasilisha mwenendo wa maisha, huku ‘kutumikia’ na ‘kusujudia’ vikidumisha tofauti ya vitenzi viwili vya Kiebrania.
