base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: sw
  text: Katika mwaka wa hamsini wa utawala wa Azaria, mfalme wa Yuda, Pekahia mwana wa Menahemu alianza kutawala Israeli huko Samaria, naye akatawala miaka miwili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת ... חֲמִשִּׁים שָׁנָה
  choice: Katika mwaka wa hamsini wa utawala wa
  rationale: Muundo wa Kiebrania ni fomula ya kutaja mwaka wa utawala. Kiswahili cha kawaida huhitaji neno “utawala” ili kuonyesha wazi kuwa mwaka unahesabiwa tangu kuanza kwa utawala wa Azaria.
- source_word: לַ/עֲזַרְיָה
  choice: wa Azaria
  rationale: Kiambishi ל kinaonyesha kuwa mwaka unahesabiwa kwa kurejelea utawala wa Azaria; “wa Azaria” ni usemi wa kawaida katika fomula hii.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Tafsiri ya moja kwa moja ya mnyororo wa nomino unaotaja cheo na eneo la utawala wa Azaria.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika taarifa za kifalme, kitenzi hiki hapa kinaonyesha kuanza kwa utawala, huku muda wa utawala ukitajwa mwishoni mwa aya.
- source_word: פְּקַחְיָה
  choice: Pekahia
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili huku likihifadhi umbo la jina la Kiebrania.
- source_word: בֶן מְנַחֵם
  choice: mwana wa Menahemu
  rationale: Utambulisho wa moja kwa moja wa uhusiano wa baba na mwana; majina yametoholewa kwa Kiswahili.
- source_word: עַל יִשְׂרָאֵל
  choice: kutawala Israeli
  rationale: עַל pamoja na מלך huonyesha watu au nchi inayotawaliwa. Kiswahili hueleza jambo hili kwa kawaida kwa kitenzi “kutawala” bila kuhitaji kihusishi tofauti.
- source_word: בְּ/שֹׁמְרוֹן
  choice: akiwa Samaria
  rationale: ב ni ya mahali na Samaria ndiyo makao ya kifalme. “Akiwa Samaria” inaunganisha mahali pa kuanza na kuendesha utawala kwa Kiswahili cha kawaida bila kudai kwamba alitawala Samaria pekee.
- source_word: שְׁנָתָיִם
  choice: kwa miaka miwili
  rationale: Umbo la uwili linamaanisha miaka miwili; “akatawala kwa miaka miwili” ni sentensi kamili na ya kawaida katika Kiswahili.
