base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: sw
  text: Akafanya yaliyo maovu machoni pa Yahweh. Hakuacha[a] dhambi za Yeroboamu mwana wa Nebati, aliyesababisha Israeli kutenda dhambi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakujitenga na dhambi za Yeroboamu mwana wa Nebati.”
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyewafanya Israeli watende dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Akafanya yaliyo maovu
  rationale: Muundo huu unahifadhi kitenzi cha Kiebrania na maana ya kauli ya kawaida ya kutathmini utawala, huku ukisikika kwa kawaida katika Kiswahili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Hii inadumisha nahau ya Kiebrania ya tathmini ya Mungu na kutaja jina la Mungu, Yahweh, badala ya kulibadilisha kuwa cheo.
- source_word: לֹא סָר
  choice: Hakuacha
  rationale: Katika muktadha huu סור humaanisha kutogeuka au kutojitenga na mwenendo fulani; “hakuacha” ni ya kawaida na wazi katika Kiswahili.
- source_word: מֵחַטֹּאות
  choice: dhambi za
  rationale: Neno la wingi חַטֹּאות linarejelea matendo ya dhambi yanayohusishwa na Yeroboamu; “dhambi” ni tafsiri ya moja kwa moja.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili, na patronimia ya Kiebrania imehifadhiwa kwa “mwana wa.”
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: aliyesababisha Israeli kutenda dhambi
  rationale: Hifili ya חטא ina maana ya kusababisha; tafsiri hii inadumisha wazi uhusiano huo wa kisababishi bila kueleza zaidi namna alivyofanya hivyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, tetragramatoni; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Wajibu wa Yeroboamu katika dhambi ya Israeli
  choice: aliyesababisha Israeli kutenda dhambi
  alternative: aliyeiongoza Israeli katika dhambi
  rationale: Tafsiri iliyochaguliwa huhifadhi maana ya kisababishi ya הֶחֱטִיא bila kuongeza wazo mahsusi la njia ya uongozi ambalo halijasemwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wazi na wa sasa. Nahau “machoni pa Yahweh” imehifadhiwa kwa kuwa inaeleweka na inadumisha taswira ya maandishi ya Kiebrania.
