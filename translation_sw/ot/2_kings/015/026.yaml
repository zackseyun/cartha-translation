base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: sw
  text: Matendo mengine ya Pekahia[a], na yote aliyoyafanya, tazama, yameandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na matendo mengine ya Pekahia ... hakika yameandikwa katika kumbukumbu za wafalme wa Israeli.”
    reason: Kiebrania kina kiunganishi cha mwanzo ambacho kinaweza kutafsiriwa “Na”; neno la uwasilishaji linaweza kutolewa kama “hakika,” na jina la hati linaweza kutafsiriwa kwa maana yake kama “kumbukumbu.”
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine ya
  rationale: Katika muhtasari huu wa kawaida wa utawala, kifungu hiki kinamaanisha matendo au mambo yaliyobaki kuhusu mfalme, si maneno aliyoyasema. “Matendo mengine” ni Kiswahili cha kawaida kinacholeta maana hiyo kwa uwazi.
- source_word: פְקַחְיָה
  choice: Pekahia
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyoyafanya
  rationale: Tafsiri pana na ya moja kwa moja inayohifadhi marudio yaliyomo katika Kiebrania bila kufafanua aina ya mambo aliyofanya.
- source_word: הִנָּם
  choice: tazama
  rationale: Neno hili la uwasilishaji linavuta fikira za msomaji kwa taarifa inayofuata. “Tazama” linahifadhi msisitizo wake wa kifasihi.
- source_word: כְּתוּבִים
  choice: yameandikwa
  rationale: Huhifadhi maana ya hali ya kutendwa ya neno la Kiebrania na linapatana na wingi wa mambo yaliyotajwa.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa kihusishi kinaweza kutafsiriwa kihalisi kuwa “juu ya,” Kiswahili cha kawaida husema habari zimeandikwa “katika” kitabu. “Kitabu” linafaa kwa hati hii, ingawa huenda kimwili ilikuwa hati-kunjo.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Mambo ya Nyakati
  rationale: Ni usemi unaotaja kumbukumbu za matukio yaliyopangwa kwa nyakati; “Mambo ya Nyakati” ni tafsiri iliyo wazi na inayofaa kama sehemu ya jina la hati.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: Kihusishi cha Kiebrania hapa kinaonyesha kwamba kumbukumbu hizo zinawahusu wafalme wa Israeli; “za” ni muundo wa kawaida wa Kiswahili katika jina la hati.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kifasihi “tazama” umehifadhiwa kwa sababu unaakisi neno lililowekewa mkazo katika Kiebrania; uradidi wa “matendo ... yote aliyoyafanya” pia umeachwa ili kutopunguza muundo wa chanzo.
