translation:
  language: sw
  text: Mambo mengine ya Zekaria, tazama, yameandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kumbukumbu za wafalme wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Mambo mengine
  rationale: Katika kauli hii ya kawaida ya kuhitimisha habari za mfalme, maneno haya yanarejelea mambo au matendo yaliyosalia kusimuliwa. “Mambo mengine” ni Kiswahili cha kawaida na kinabaki na upana wa דִּבְרֵי.
- source_word: זְכַרְיָה
  choice: Zekaria
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: הִנָּם
  choice: tazama
  rationale: Neno hili la kuonyesha na kusisitiza linaelekeza fikira za msomaji kwenye maandishi yanayotajwa; “tazama” linahifadhi msisitizo huo wa kimtindo.
- source_word: כְּתוּבִים
  choice: yameandikwa
  rationale: Hutafsiri moja kwa moja hali ya kutendwa ya kitenzi ‘andika’ na kupatana na kiima ‘mambo.’
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi inaweza kumaanisha ‘juu ya,’ katika kauli hii ya kumbukumbu iliyoandikwa, “katika Kitabu” ni usemi wa asili katika Kiswahili.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Mambo ya Nyakati
  rationale: Ni tafsiri iliyo wazi ya jina la kumbukumbu za matukio ya kifalme na inaeleweka kwa wasomaji wa Kiswahili; “kumbukumbu” imehifadhiwa kama mbadala katika tanbihi.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: Kiunganishi “za” kinaonyesha kwa kawaida uhusiano wa kumbukumbu hiyo na wafalme wa Israeli.
