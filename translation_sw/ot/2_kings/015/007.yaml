  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: sw
  text: Azaria akalala na baba zake[a], nao wakamzika pamoja na baba zake katika Mji wa Daudi. Yothamu mwanawe akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pamoja na mababu zake.” Kauli ya Kiebrania “alilala na baba zake” ni njia ya kawaida ya kurejelea kifo na maziko miongoni mwa vizazi vilivyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Inahifadhi sitiari ya Kiebrania inayosema kwa upole kwamba alikufa, badala ya kuibadili moja kwa moja kuwa “akafa.”
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Inahifadhi kauli maalumu ya kifalme ya Kiebrania na uhusiano wake na vizazi vilivyotangulia; tanbihi inaeleza maana ya “mababu zake.”
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: nao wakamzika
  rationale: Inahifadhi kitenzi cha wingi chenye mtendaji ambaye hakutajwa wazi katika Kiebrania; “nao” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Ni namna iliyo wazi na ya kawaida ya kutaja mahali hapa pa maziko ya kifalme.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika kauli ya urithi wa ufalme, kitenzi hiki kinaeleza kwamba Yothamu alianza kushika mamlaka ya kifalme; “akatawala” ni kifupi na cha asili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Inaonyesha kuchukua cheo na mamlaka ya mtangulizi, si kufuata tu kwa wakati.
