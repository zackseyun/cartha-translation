lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Alifanya yaliyo sawa
  rationale: Kirai hiki cha Kiebrania humaanisha kutenda jambo linalofaa au lililo nyoofu. Kiswahili hiki ni cha kawaida na kinahifadhi tathmini ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu tathmini ya Mungu kwa lugha ya Kiswahili inayoeleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: כְּכֹל אֲשֶׁר
  choice: kama vile ... alivyokuwa
  rationale: Muundo huu unaonyesha kwamba mwenendo wake ulifuata kikamilifu mfano uliotangulia; Kiswahili cha ‘kama vile ... alivyokuwa’ kinawasilisha ulinganisho huo kwa kawaida.
- source_word: עֻזִיָּהוּ אָבִיו
  choice: baba yake Uzia
  rationale: Maandishi ya WLC hapa yana jina Uzia, na אָבִיו humaanisha baba yake katika muktadha huu wa kifalme na kizazi.
- source_word: עָשָׂה
  choice: alivyokuwa amefanya
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba matendo ya Uzia yalitangulia na yakawa kielelezo cha matendo ya mfalme anayezungumziwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Tathmini ya kwamba mfalme alifanya yaliyo sawa
  choice: Kuhifadhi kauli bila kuongeza sifa au mipaka
  alternative: Kufafanua kwamba alikuwa mwaminifu kabisa au kwamba alikuwa na kasoro fulani
  rationale: Mstari huu wenyewe unatoa tathmini ya jumla kwa kumlinganisha na Uzia; tafsiri haipaswi kuingiza maelezo ya madhehebu au maelezo kutoka mistari mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Kiunganishi cha mwanzo וַ־ hakikutafsiriwa kwa ‘Na’ kwa kuwa mstari unasomeka kwa kawaida bila hicho katika nukuu inayojitegemea. Alama ya tanbihi imewekwa baada ya ‘Uzia,’ neno ambalo tanbihi inalifafanua.
