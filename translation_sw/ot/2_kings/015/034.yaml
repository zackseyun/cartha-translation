  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: sw
  text: Alifanya yaliyo sawa machoni pa Yahwe, sawasawa na yote aliyofanya Uzia[a], baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahali pengine mfalme huyu pia anaitwa Azaria.
