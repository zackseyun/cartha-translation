  text: אָ֣ז יַכֶּֽה מְ֠נַחֵם אֶת תִּפְסַ֨ח וְ/אֶת כָּל אֲשֶׁר בָּ֤/הּ וְ/אֶת גְּבוּלֶ֨י/הָ֙ מִ/תִּרְצָ֔ה כִּ֛י לֹ֥א פָתַ֖ח וַ/יַּ֑ךְ אֵ֛ת כָּל הֶ/הָ֥רוֹתֶ֖י/הָ בִּקֵּֽעַ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: sw
  text: Ndipo Menahemu akaishambulia Tifsa, pamoja na watu wote waliokuwa humo[a] na eneo lake kuanzia Tirza[b], kwa sababu mji huo haukumfungulia[c]; akawapasua tumbo wanawake wake wote wenye mimba[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyote vilivyokuwa humo.” Usemi wa Kiebrania unaweza kuwahusu watu au kila kitu kilichokuwa ndani ya mji.
    reason: lexical_alternative
  - marker: b
    text: Kirai “kuanzia Tirza” kinaweza kuhusishwa na eneo la Tifsa. Pia huenda kikamaanisha kwamba Menahemu alianza mashambulizi kutoka Tirza.
    reason: syntactic_ambiguity
  - marker: c
    text: “Haukumfungulia” maana yake ni kwamba mji haukufunguka ili umruhusu Menahemu aingie; yaani, haukujisalimisha kwake.
    reason: cultural_note
  - marker: d
    text: Kitenzi cha Kiebrania kina maana ya “kupasua” au “kufungua kwa nguvu.”
    reason: lexical_note
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kiunganishi cha kawaida cha masimulizi kinachoonyesha tukio lililofuata.
- source_word: יַכֶּה / וַיַּךְ
  choice: akaushambulia / aliushambulia
  rationale: Kitenzi נכה hapa kinaonyesha shambulio la kijeshi; kurudia kitenzi kunahifadhi urudiaji uliopo katika Kiebrania bila kutumia neno la kizamani.
- source_word: תִּפְסַח
  choice: Tifsa
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili badala ya kutafsiriwa.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: wote waliokuwa humo
  rationale: Katika muktadha wa kuushambulia mji, usemi huu kwa kawaida unawahusu wakazi; tanbihi inadumisha uwezekano mpana wa kisarufi wa ‘vyote vilivyokuwa humo.’
- source_word: גְּבוּלֶיהָ
  choice: eneo lake
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo linalotawaliwa; hapa ‘eneo lake’ linafaa zaidi kuliko mistari ya mipaka pekee.
- source_word: מִתִּרְצָה
  choice: akitokea Tirza
  rationale: מן inaonyesha mahali alikotoka Menahemu katika usomaji unaofaa wa muktadha; tanbihi inadumisha uwezekano wa kuunganisha kirai hiki na eneo la Tifsa.
- source_word: כִּי לֹא פָתַח
  choice: Kwa sababu mji huo haukumfungulia malango
  rationale: Kufungua kunamaanisha kufungua mji au malango yake ili kumruhusu aingie, yaani kujisalimisha. ‘Malango’ na mtendewa ‘-m-’ vinaeleza maana iliyodokezwa na muktadha.
- source_word: הֶהָרוֹתֶיהָ
  choice: wanawake wote wenye mimba waliokuwa humo
  rationale: Hili ni jina linalotokana na הרה, ‘mwenye mimba’; kishazi cha mahali kinaonyesha uhusiano wao na mji bila utata wa kusema ‘wanawake wake.’
- source_word: בִּקֵּעַ
  choice: akipasua matumbo
  rationale: Katika Piel, בקע hueleza kupasua kwa nguvu. Kutaja matumbo kwa uwazi kunatoa Kiswahili cha kawaida kinachoeleza kitendo hicho cha kikatili bila kukipunguza.
