translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Lugha ya ukatili imewasilishwa moja kwa moja bila tasfida, huku sintaksia na tanbihi zikihifadhi utata halisi wa Kiebrania kuhusu ‘wote/vyote’ na uhusiano wa kirai ‘kutoka Tirza.’
