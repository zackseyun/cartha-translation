base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/022.yaml
  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: sw
  text: Menahemu akalala pamoja na baba zake[a], naye Pekahia mwanawe akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akapumzika pamoja na baba zake.” Hii ni nahau ya Kiebrania inayotumiwa kwa kawaida kueleza kifo cha mfalme na kufuatwa kwake na mrithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Katika kauli hii ya kifalme, kitenzi hiki ni nahau ya kifo. “Akalala” huhifadhi taswira ya Kiebrania bila kuifafanua moja kwa moja kuwa “alikufa.”
- source_word: עִם אֲבֹתָיו
  choice: pamoja na babu zake
  rationale: “Babu zake” ni Kiswahili cha kawaida kinachoweza kumaanisha waliomtangulia katika ukoo; hapa kinahifadhi maana ya kifamilia na ya nasaba ya kifalme.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa ya urithi wa ufalme, “akatawala” ni ya asili na inaonyesha kwamba Pekahia alianza kutawala baada ya baba yake.
- source_word: פְּקַחְיָה
  choice: Pekahia
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Huhifadhi wazi uhusiano wa mwana na baba katika taarifa ya urithi.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kauli ya urithi, ikionyesha kuchukua nafasi ya mtawala aliyetangulia.
