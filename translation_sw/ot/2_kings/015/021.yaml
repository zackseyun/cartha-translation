base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Menahemu na yote aliyoyafanya, je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitabu cha kumbukumbu za wafalme wa Israeli.”
    reason: Kirai סֵפֶר דִּבְרֵי הַיָּמִים kinaweza kutafsiriwa kwa maana ya kumbukumbu rasmi au annali za kifalme.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika muundo huu wa muhtasari wa utawala, דִּבְרֵי humaanisha mambo au matendo ya mfalme, si maneno yake tu; יֶתֶר ni yaliyobaki au mengine.
- source_word: מְנַחֵם
  choice: Menahemu
  rationale: Jina la mtu limetoholewa kwa namna inayofaa Kiswahili.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyoyafanya
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki, inayodumisha mtindo wa muhtasari wa Kiebrania.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: הֲלוֹא huanzisha swali la balagha linalotarajia jibu la ndiyo; hali timilifu ya Kiswahili inaonyesha kwamba matendo hayo yameandikwa na yanabaki katika kumbukumbu.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kimsingi ni ‘juu ya,’ katika kauli hii ya kurejelea kumbukumbu iliyoandikwa, ‘katika Kitabu’ ni Kiswahili cha kawaida na sahihi.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Kitabu cha Mambo ya Nyakati
  rationale: Kirai hiki kinataja kumbukumbu rasmi za matukio ya utawala; ‘Mambo ya Nyakati’ huhifadhi maana na mtindo wa jina hilo.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: לְ hapa huonyesha uhusiano wa kumbukumbu hizo na wafalme wa Israeli katika jina la hati.
