  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: sw
  text: Akafanya yaliyo maovu machoni pa Yahweh. Hakuacha dhambi za Yeroboamu mwana wa Nebati, aliyesababisha Israeli kutenda dhambi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Akafanya yaliyo maovu
  rationale: Kauli ya kawaida ya kutathmini utawala; 'akafanya yaliyo maovu' ni Kiswahili cha kawaida kinachohifadhi maana ya kitendo na tathmini ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Inahifadhi sitiari ya Kiebrania ya tathmini mbele za Mungu kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: לֹא סָר
  choice: Hakuacha
  rationale: Katika muktadha huu סור מן humaanisha kutogeuka au kutoacha mwenendo wa dhambi; 'hakuacha' ni ya asili na wazi katika Kiswahili.
- source_word: מִן חַטֹּאות
  choice: dhambi za
  rationale: Nomino ya wingi חַטֹּאות inaelezwa moja kwa moja kama 'dhambi'; muundo wa Kiswahili 'kuacha dhambi za' unaeleza chanzo au mfano wa dhambi hizo kwa kawaida.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yamenukuliwa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, huku patronimiki ikihifadhiwa.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: aliyesababisha Israeli kutenda dhambi
  rationale: Hifili ya חטא ni ya kisababishi; tafsiri hii inahifadhi wazi wajibu wa Yeroboamu katika kuifanya Israeli itende dhambi.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יְהוָה moja kwa moja; 'Yahweh' hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi kauli ya Kiebrania ya kutathmini mfalme na nguvu ya kisababishi katika הֶחֱטִיא.
