  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: sw
  text: Ndipo Menahemu akawatoza Waisraeli wote wenye mali[a] fedha, ili ampe mfalme wa Ashuru shekeli hamsini za fedha kutoka kwa kila mtu. Basi mfalme wa Ashuru akarudi, wala hakubaki huko nchini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mashujaa wote wa vita,” au, “watu wote wenye uwezo.” Kirai cha Kiebrania kinaweza kumaanisha watu wenye nguvu za kijeshi, hadhi, au mali; muktadha wa utozaji unaelekea kuonyesha watu wenye uwezo wa kifedha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא ... הַכֶּסֶף עַל יִשְׂרָאֵל
  choice: akaitoza Israeli fedha hizo
  rationale: Kitenzi hiki kwa msingi wake ni ‘kutoa/kusababisha itoke,’ lakini pamoja na fedha na עַל kinaonyesha kutoza au kukusanya kwa lazima. ‘Akaitoza Israeli’ ni Kiswahili cha kawaida kinachoonyesha mzigo uliowekwa juu ya taifa.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: akizikusanya kutoka kwa watu wote wenye uwezo[a]
  rationale: Kirai kinaweza kumaanisha mashujaa wa vita, watu mashuhuri, au watu wenye mali. Muktadha wa ushuru wa kiasi kikubwa kwa kila mtu unaelekea kuonyesha watu wenye uwezo wa kifedha, huku tanbihi ikihifadhi upana wa maana ya Kiebrania.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף
  choice: shekeli hamsini za fedha
  rationale: Huhifadhi kipimo cha uzito na kutaja metali iliyotumika bila kuibadili kuwa thamani ya kisasa.
- source_word: לְאִישׁ אֶחָד
  choice: kutoka kwa kila mtu
  rationale: Katika muktadha huu, kirai kinaonyesha kiasi kilichotozwa kila mmoja wa watu waliotajwa.
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya tendo la mfalme wa Ashuru kuondoka na kurudi alikotoka.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: wala hakubaki huko nchini
  rationale: Ingawa עמד kwa msingi ni ‘kusimama,’ hapa humaanisha kukaa au kuendelea kuwapo mahali.
