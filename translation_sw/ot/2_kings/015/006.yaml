  text: וְ/יֶ֛תֶר דִּבְרֵ֥י עֲזַרְיָ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Azaria, na yote aliyoyafanya, je, hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda” kilikuwa kumbukumbu au taarifa rasmi za kifalme zinazotajwa mara nyingi katika kitabu cha Wafalme.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: Katika muhtasari wa utawala wa mfalme, kirai hiki hurejelea mambo au matendo yaliyosalia bila kusimuliwa hapa; “matendo mengine” ni Kiswahili cha kawaida na huendana na kishazi kinachofuata.
- source_word: עֲזַרְיָהוּ
  choice: Azaria
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyoyafanya
  rationale: Huhifadhi upana wa kitenzi עשה na mtindo wa kifomula wa taarifa za kifalme.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: Huhifadhi swali la balagha la Kiebrania na maana ya moja kwa moja ya “kuandikwa,” badala ya kuligeuza kuwa kauli.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni “juu ya,” katika muktadha wa maandishi Kiswahili hutumia kwa kawaida “katika kitabu.”
- source_word: דִּבְרֵי הַיָּמִים
  choice: Mambo ya Nyakati
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya jina la kumbukumbu hizi za kihistoria.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: za Wafalme wa Yuda
  rationale: Hapa לְ ni sehemu ya jina la chanzo na huonyesha uhusiano wake na wafalme wa Yuda.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Swali la balagha la Kiebrania limehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya jina lote la chanzo kinachoelezwa.
