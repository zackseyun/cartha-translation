source:
  edition: WLC
  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: sw
  text: Katika siku za Peka, mfalme wa Israeli, Tiglath-Pileseri, mfalme wa Ashuru, alikuja na kuteka Iyoni, Abeli-Beth-Maaka, Yanoa, Kedeshi, Hazori, Gileadi na Galilaya—nchi yote ya Naftali—akawapeleka uhamishoni Ashuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawahamisha hadi Ashuru.”
    reason: Kitenzi cha Kiebrania kina maana ya kuwaondoa watu katika nchi yao na kuwapeleka uhamishoni; tafsiri hii mbadala hudumisha maana hiyo kwa mtindo mwingine wa Kiswahili.
lexical_decisions:
- source_word: בִּימֵי
  choice: Katika siku za
  rationale: Nahau hii ya wakati inadumisha muundo wa Kiebrania huku ikiwa ya kawaida na inayoeleweka katika Kiswahili.
- source_word: בָּא
  choice: alikuja
  rationale: Kitenzi hiki kimsingi humaanisha ‘alikuja’; muktadha wa kijeshi unaelezwa na tendo linalofuata la kuteka, hivyo hakuna haja ya kuongeza ‘alivamia.’
- source_word: וַיִּקַּח
  choice: na kuteka
  rationale: Katika muktadha wa mfalme kuchukua miji na maeneo kwa nguvu za kijeshi, ‘kuteka’ huwasilisha maana kwa uwazi kuliko ‘kuchukua.’
- source_word: עִיּוֹן
  choice: Iyoni
  rationale: Umbo la jina linalofaa matamshi na tahajia ya Kiswahili.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Beth-Maaka
  rationale: Unukuzi wa jina ambatani la mahali, wenye viungio vinavyoonyesha kuwa ni jina moja.
- source_word: יָנוֹחַ
  choice: Yanoa
  rationale: Unukuzi wa jina la mahali unaofuata mfumo wa sauti wa Kiswahili.
- source_word: קֶדֶשׁ
  choice: Kedeshi
  rationale: Umbo la Kiswahili la jina la mahali.
- source_word: חָצוֹר
  choice: Hazori
  rationale: Umbo la Kiswahili la jina la mahali.
- source_word: הַגִּלְעָד
  choice: Gileadi
  rationale: Jina la eneo limetolewa bila kifungu bainishi, kama ilivyo kawaida kwa majina ya kijiografia katika Kiswahili.
- source_word: הַגָּלִילָה
  choice: Galilaya
  rationale: Jina la eneo limetolewa kwa umbo linalotambulika katika Kiswahili.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: yaani, nchi yote ya Naftali
  rationale: ‘Yaani’ huonyesha kwamba kirai hiki ni muhtasari wa maeneo yaliyotajwa, bila kukifanya kuwa ushindi mwingine tofauti.
- source_word: וַיַּגְלֵם
  choice: akawapeleka watu wake uhamishoni
  rationale: Hifili ya גלה inaonyesha kuwa watu waliondolewa na kupelekwa uhamishoni. ‘Watu wake’ hufafanua kwa Kiswahili kwamba kiwakilishi cha wingi kinarejelea wakazi wa nchi ya Naftali, si majina ya maeneo yenyewe.
- source_word: אַשּׁוּרָה
  choice: Ashuru
  rationale: Kiambishi elekezi cha Kiebrania kinaeleza mahali walikopelekwa; Kiswahili huonyesha lengo hilo kwa mpangilio huu bila kulazimika kutumia kihusishi.
