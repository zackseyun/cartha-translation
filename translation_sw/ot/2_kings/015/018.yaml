base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: sw
  text: Alifanya yaliyo maovu machoni pa Yahweh. Siku zake zote, hakuacha dhambi za Yeroboamu mwana wa Nebati[a], ambazo Yeroboamu alisababisha Israeli kuzitenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeroboamu mwana wa Nebati, ambaye alisababisha Israeli kutenda dhambi.” Kishazi cha Kiebrania kinaweza kuhusishwa na “Yeroboamu” badala ya “dhambi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Alifanya yaliyo maovu
  rationale: Muundo huu wa kawaida katika Wafalme unaeleza tathmini ya maadili; Kiswahili hiki ni cha asili huku kikihifadhi maana ya kufanya lililo ovu.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini mbele za Mungu na kulitaja jina la agano יְהוָה kama Yahweh.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: hakuacha dhambi
  rationale: סור katika kanuni hii humaanisha kutogeuka au kutoachana na mwenendo wa dhambi; 'hakuacha' ni Kiswahili cha kawaida na wazi.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, na uhusiano wa ukoo umeonyeshwa moja kwa moja.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambazo kwa hizo aliisababisha Israeli kutenda dhambi
  rationale: Hifili ya חטא ina nguvu ya kusababisha. Kiwakilishi cha wingi kinaunganisha kishazi na 'dhambi' bila kuficha uwezekano mwingine wa kisarufi.
- source_word: כָּל יָמָיו
  choice: Siku zake zote
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha kipindi chote cha maisha au utawala wake, na imewekwa mwanzoni kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; 'Yahweh' huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kirejelewa cha kishazi אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Kishazi kimeunganishwa na ''dhambi'': ''ambazo kwa hizo aliisababisha Israeli kutenda dhambi.'''
  alternative: '''Yeroboamu mwana wa Nebati, ambaye aliisababisha Israeli kutenda dhambi.'''
  rationale: Kiebrania kinaweza kuruhusu kishazi kurejelea dhambi au Yeroboamu. Matini kuu inafuata dhambi kama kirejelewa, huku tanbihi ikihifadhi usomaji mwingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umewekwa wazi na wa kisasa bila kuondoa sitiari au utata halisi wa Kiebrania.
