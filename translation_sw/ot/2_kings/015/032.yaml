base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: sw
  text: Katika mwaka wa pili wa Peka mwana wa Remalia, mfalme wa Israeli, Yothamu mwana wa Uzia[b], mfalme wa Yuda, akawa mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaanza kutawala.” Kitenzi cha Kiebrania kinaweza kumaanisha mtu kuwa mfalme au kuanza kutawala.
    reason: lexical_alternative
  - marker: b
    text: Mahali pengine Uzia anaitwa pia Azaria.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: Katika mwaka wa pili
  rationale: Hii ni fomula ya Kiebrania ya kutaja mwaka wa utawala. Ingawa שְׁתַּיִם kwa umbo ni namba ya kuhesabu ‘mbili,’ hapa ina maana ya mpangilio, ‘wa pili.’
- source_word: לְ/פֶקַח
  choice: wa Peka
  rationale: Kihusishi לְ kinaonyesha mfalme ambaye miaka ya utawala wake inahesabiwa; Kiswahili cha kawaida hutumia ‘wa’ katika fomula hii.
- source_word: בֶּן רְמַלְיָהוּ
  choice: mwana wa Remalia
  rationale: Muundo wa kawaida wa nasaba umehifadhiwa kwa usahihi wa kihistoria.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Cheo na eneo la utawala wa Peka vimetafsiriwa moja kwa moja.
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika taarifa hii ya kupanda kwenye kiti cha enzi, kitenzi kinaweza kumaanisha kuwa mfalme au kuanza kutawala. ‘Akawa mfalme’ huonyesha kuingia kwake katika ufalme bila kukifanya kitenzi kionekane kuwa cha hali ya kuendelea tu.
- source_word: יוֹתָם
  choice: Yothamu
  rationale: Jina limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בֶּן עֻזִיָּהוּ
  choice: mwana wa Uzia
  rationale: Andiko la Kiebrania hapa lina עֻזִיָּהוּ, yaani Uzia; jina hilo limehifadhiwa badala ya kulibadili kuwa jina lake jingine, Azaria.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Cheo hiki kinamtambulisha Yothamu na eneo lake la utawala na kimehifadhiwa wazi kama katika Kiebrania.
