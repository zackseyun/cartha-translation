  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa na unaoeleweka. Vipashio vya maelezo ‘mfalme wa Israeli’ na ‘mfalme wa Yuda’ vimewekwa karibu na wahusika vinaowatambulisha ili sentensi isomeke kwa kawaida. Alama za tanbihi zimehamishwa karibu na maneno yanayohusika moja kwa moja.
