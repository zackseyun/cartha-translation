base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: sw
  text: Lakini mahali pa juu pa ibada hayakuondolewa; watu waliendelea kutoa dhabihu na kufukiza uvumba katika mahali pa juu[a]. Yeye alijenga lango la juu la nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoa sadaka kwa kuiteketeza mahali pa juu.” Kitenzi cha Kiebrania kinaweza kumaanisha hasa kufukiza uvumba au, kwa maana pana zaidi, kutoa sadaka kwa kuiteketeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika kauli hii ya kawaida ya kitabu cha Wafalme, neno hili linaonyesha kasoro iliyobaki licha ya tathmini nzuri iliyotangulia.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: mahali pa juu pa kuabudia / mahali hapo pa juu
  rationale: Hurejelea maeneo ya ibada ya mahali, si tu sehemu zilizoinuka kijiografia. Maelezo “pa kuabudia” yanaifanya maana hiyo iwe wazi kwa msomaji wa Kiswahili.
- source_word: לֹא סָרוּ
  choice: hapakuondolewa
  rationale: Kauli ya kutendwa inaonyesha kwamba mahali hapo paliendelea kuwapo bila kuondolewa.
- source_word: עוֹד
  choice: waliendelea
  rationale: Inaonyesha kwamba desturi hiyo iliendelea kufanywa.
- source_word: הָעָם
  choice: watu
  rationale: Ni rejeo la kawaida la pamoja kwa wananchi.
- source_word: מְזַבְּחִים
  choice: kutoa dhabihu
  rationale: Umbo la kitenzi linaonyesha tendo la kawaida lililoendelea kufanywa.
- source_word: וּמְקַטְּרִים
  choice: kufukiza uvumba
  rationale: Hii ni tafsiri ya kawaida na ya asili katika muktadha wa ibada, huku tanbihi ikihifadhi uwezekano wa maana pana zaidi ya kutoa sadaka kwa kuiteketeza.
- source_word: הוּא
  choice: Yeye
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo mdogo; “Yeye” kinauhifadhi kwa njia ya asili.
- source_word: בָּנָה
  choice: alijenga
  rationale: Hii ndiyo maana ya msingi; muktadha haulazimishi maana maalumu ya kujenga upya.
- source_word: שַׁעַר בֵּית יְהוָה
  choice: lango ... la nyumba ya Yahwe
  rationale: Inahifadhi tamathali ya Kiebrania “nyumba ya Yahwe” badala ya kuibadili kuwa “hekalu”.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetolewa moja kwa moja katika umbo la Kiswahili.
- source_word: הָעֶלְיוֹן
  choice: la juu
  rationale: Inaeleza mahali pa lango hilo na kulitofautisha na malango mengine.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Matini ya Kiebrania ina jina la Mungu moja kwa moja; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וּמְקַטְּרִים katika ibada
  choice: kufukiza uvumba
  alternative: kuteketeza sadaka ili moshi wake upande
  rationale: Maana mahsusi ya kufukiza uvumba inafaa na ni ya asili hapa, lakini kitenzi kinaweza pia kuwa na maana pana ya kuteketeza sadaka; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Mahali pa juu pa kuabudia” limetumiwa kama kirai cha pamoja cha maeneo ya ibada, kwa kuwa tafsiri ya neno kwa neno “mahali pa juu” pekee inaweza kueleweka kama maelezo ya kijiografia.
