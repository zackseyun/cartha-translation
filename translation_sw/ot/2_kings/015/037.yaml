  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: sw
  text: Siku zile Yahwe alianza kuwatuma dhidi ya Yuda[a] Resini, mfalme wa Aramu[b], na Peka mwana wa Remalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwatuma ndani ya Yuda.” Kihusishi cha Kiebrania kinaweza kumaanisha mahali; muktadha unaonyesha uadui.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Aramu”; kwa mapokeo, “Siria.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Siku hizo
  rationale: Ni nahau ya kawaida ya wakati inayotaja kipindi fulani katika simulizi; Kiswahili hiki ni cha asili na kinafuata muundo wa Kiebrania.
- source_word: הֵחֵל
  choice: alianza
  rationale: Hueleza mwanzo wa tendo; ‘alianza’ ni tafsiri wazi na ya kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: kuwatuma dhidi ya Yuda
  rationale: Kitenzi kinamaanisha ‘kutuma,’ na katika muktadha huu watu waliotumwa wana nia ya uadui. ‘Dhidi ya’ huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Resini mfalme wa Aramu
  rationale: Majina yametoholewa; ‘Aramu’ linaakisi moja kwa moja jina la Kiebrania kuliko ‘Siria.’
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: na Peka mwana wa Remalia
  rationale: Huyu ni mtu wa pili aliyeunganishwa na Resini kama mtendwa wa kitenzi ‘kuwatuma’; ‘mwana wa’ ni utambulisho wa kawaida wa nasaba.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; kulitohowa huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa utendaji wa Mungu na mashambulizi ya wafalme hao
  choice: alianza kuwatuma dhidi ya Yuda
  alternative: alianza kuwaruhusu waishambulie Yuda
  rationale: Kiebrania kinasema Mungu alianza ‘kutuma’; tafsiri haipunguzi kauli hiyo kuwa ruhusa tu, hivyo inadumisha uzito na mvutano wa kiteolojia wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa kutumia kiambishi cha watendwa katika ‘kuwatuma,’ kwa kuwa Resini na Peka ndio wanaotumwa. Tanbihi moja tu imetumika, na alama [a] ipo katika matini kuu.
