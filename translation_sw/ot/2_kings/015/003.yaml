  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: sw
  text: Alifanya yaliyo sawa machoni pa Yahweh, sawasawa na yote aliyofanya Amazia, baba yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Alifanya
  rationale: Kitenzi hiki kinaendeleza simulizi; Kiswahili cha kawaida hakihitaji kuanza na kiunganishi “na” hapa.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino, kikimaanisha jambo au matendo yaliyo sawa; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania ya kutathmini jambo kwa mtazamo wa Yahweh, huku ikiwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: כְּכֹל אֲשֶׁר
  choice: sawasawa na yote ambayo
  rationale: Huonyesha kwamba mwenendo wake ulifuata kikamilifu kielelezo cha matendo ya baba yake.
- source_word: עָשָׂה
  choice: alikuwa amefanya
  rationale: Muundo huu unaonyesha kwa kawaida kwamba matendo ya Amazia yalitangulia yale ya mhusika anayezungumziwa.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Hili ni umbo la jina lililozoeleka katika Biblia za Kiswahili.
- source_word: אָבִיו
  choice: baba yake
  rationale: Muktadha wa nasaba unaonyesha baba halisi, si babu au babu wa zamani.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Usemi “machoni pa” unahifadhi sitiari ya Kiebrania bila kufanya sentensi kuwa ngumu kwa msomaji wa kawaida.
