  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: sw
  text: Lakini maeneo ya juu ya ibada hayakuondolewa; watu waliendelea kutoa dhabihu na kufukiza sadaka[a] katika maeneo hayo ya juu ya ibada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufukiza uvumba.” Kitenzi cha Kiebrania kinaweza kumaanisha hasa kufukiza uvumba au, kwa upana zaidi, kuchoma sadaka ili itoe moshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Hutambulisha jambo lililokuwa kasoro au tofauti na tathmini chanya iliyotangulia; ‘Lakini’ ni ya kawaida na wazi katika Kiswahili.
- source_word: הַבָּמוֹת
  choice: mahali pa juu
  rationale: Ni istilahi iliyozoeleka katika tafsiri za Biblia kwa maeneo ya ibada yaliyoinuka, bila kuyafafanua moja kwa moja kuwa ya sanamu.
- source_word: לֹא סָרוּ
  choice: hapakuondolewa
  rationale: Kitenzi kinaonyesha kwamba maeneo hayo ya ibada hayakuondoshwa bali yaliendelea kuwapo.
- source_word: עוֹד
  choice: waliendelea
  rationale: Huonyesha kwamba matendo ya watu yaliendelea kufanyika.
- source_word: הָעָם
  choice: watu
  rationale: Ni rejeo la kawaida na la moja kwa moja kwa jumuiya ya watu.
- source_word: מְזַבְּחִים
  choice: kutoa dhabihu
  rationale: Huwasilisha kwa kawaida tendo la kutoa sadaka ya dhabihu.
- source_word: וּמְקַטְּרִים
  choice: kufukiza sadaka
  rationale: Huhifadhi wazo la kufanya sadaka itoe moshi bila kulazimisha maana finyu ya kufukiza uvumba pekee.
- source_word: בַּבָּמוֹת
  choice: katika mahali hapo pa juu
  rationale: Huonyesha mahali matendo hayo ya ibada yalipofanyika; ‘hapo’ hurejelea maeneo yaliyotajwa katika kishazi cha kwanza.
theological_decisions:
- issue: Aina ya ibada iliyofanywa katika mahali pa juu
  choice: Aya inaripoti kwamba watu waliendelea kutoa dhabihu na kufukiza sadaka katika maeneo hayo bila kutaja waliabudu mungu gani.
  alternative: Kusema wazi kuwa walikuwa wakiabudu sanamu, au kuwa walikuwa wakimwabudu BWANA katika maeneo yasiyoruhusiwa.
  rationale: Kiebrania hakimtaji anayelengwa na ibada katika aya hii; tafsiri inadumisha ukimya huo na haiongezi hukumu ya kitheolojia isiyosemwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Istilahi ya kibiblia ‘mahali pa juu’ imehifadhiwa; muundo wa sentensi umefanywa wa kawaida kwa Kiswahili.
