base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: sw
  text: Yothamu akalala pamoja na baba zake[a], naye akazikwa pamoja na baba zake katika Mji wa Daudi, baba yake[b]. Ahazi mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akapumzika pamoja na mababu zake.” Kiebrania kinasema kihalisi “akalala pamoja na baba zake,” kauli ya kawaida ya kifalme inayomaanisha kwamba alikufa.
    reason: lexical_alternative
  - marker: b
    text: Hapa “baba yake” humaanisha babu yake wa nasaba, si baba aliyemzaa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Neno hili linahifadhi taswira ya kitenzi cha Kiebrania katika kauli ya kawaida ya kifalme kuhusu kifo; muktadha wa kuzikwa na tanbihi huweka wazi kuwa linamaanisha kufa.
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Hii inafuata kwa karibu kauli ya Kiebrania na kuhifadhi maana yake ya kifamilia na ya nasaba; hapa “baba” inawahusu pia mababu.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Muundo wa kutendwa unalingana na Kiebrania na ni wa kawaida katika Kiswahili.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: katika Mji wa Daudi, baba yake
  rationale: Inahifadhi tamko la Kiebrania huku koma ikionyesha kuwa “baba yake” ni maelezo kuhusu Daudi; maana ya kinship hapa ni babu wa nasaba.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Ni tafsiri fupi na ya kawaida ya kitenzi מלך katika taarifa ya urithi wa kifalme.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Inahifadhi kwa kawaida wazo la kuchukua nafasi ya mtawala aliyetangulia.
theological_decisions:
- issue: Maana ya “baba yake” katika “Daudi, baba yake”
  choice: Daudi ni baba wa nasaba, yaani babu wa Yothamu, si baba yake wa kumzaa
  alternative: Daudi kuwa baba yake wa moja kwa moja
  rationale: Katika taarifa za kifalme, אָב inaweza kumaanisha babu au mwanzilishi wa nasaba. Baba wa moja kwa moja wa Yothamu alikuwa Uzia/Azaria, kwa hiyo hapa Daudi anatajwa kama babu wa ukoo wa kifalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa heshima na unaoeleweka. Kauli “akalala pamoja na baba zake” imehifadhiwa ili kuakisi nahau ya Kiebrania, huku tanbihi ikifafanua maana yake ya kifo na ya mababu.
