revisions:
- from: Ndipo Peka mwana wa Remalia, afisa wake,[a] akafanya njama dhidi yake na kumpiga huko Samaria, katika ngome ya jumba la mfalme,[b] pamoja na Argobu na Arie.[c] Pamoja naye walikuwa watu hamsini miongoni mwa Wagileadi.[d] Akamuua, akatawala mahali pake.
  to: Ndipo Peka mwana wa Remalia, afisa wake,[a] akafanya njama dhidi yake, akampiga huko Samaria, katika ngome ya makao ya mfalme,[b] na akawapiga pia Argobu na Arie.[c] Pamoja naye walikuwa watu hamsini miongoni mwa Wagileadi.[d] Akamuua, akatawala mahali pake.
  rationale: 'The revision resolves the main syntactic issue: Argob and Arieh are rendered as further objects of Pekah''s striking, rather than ambiguously as his companions. It retains the Hebrew''s separate subsequent statement that Pekah killed the king. It also improves the royal-residence wording and corrects the inaccurate Hebrew gloss in footnote d. No theological or denominational interpretation has been added.'
