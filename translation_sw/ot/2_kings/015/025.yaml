base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: sw
  text: Ndipo Peka mwana wa Remalia, afisa wake,[a] akafanya njama dhidi yake, akampiga huko Samaria, katika ngome ya makao ya mfalme,[b] na akawapiga pia Argobu na Arie.[c] Pamoja naye walikuwa watu hamsini miongoni mwa Wagileadi.[d] Akamuua, akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wake wa jeshi.” Neno la Kiebrania linamaanisha afisa wa cheo cha juu, lakini cheo kamili hakijulikani.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika jumba la makao ya mfalme.” Neno la Kiebrania linaweza kumaanisha jumba au makao ya kifalme yenye ngome.
    reason: lexical_alternative
  - marker: c
    text: Arie limechukuliwa hapa kuwa jina la mtu kama Argobu. Neno hilo la Kiebrania pia linaweza kumaanisha “simba.”
    reason: lexical_alternative
  - marker: d
    text: 'Kiebrania: “na pamoja naye watu hamsini miongoni mwa wana wa Gileadi.” Usemi huu unaeleweka kuwa watu hamsini waliokuwa pamoja na Peka.'
    reason: source_clarity
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: akafanya njama dhidi yake
  rationale: Katika muktadha wa kisiasa wa kitabu cha Wafalme, kitenzi hiki huonyesha njama ya kumpindua au kumsaliti mtawala.
- source_word: שָׁלִישׁוֹ
  choice: afisa wake
  rationale: Neno la Kiebrania humaanisha afisa wa cheo cha juu, mara nyingi wa kijeshi, lakini cheo chake mahususi hakijulikani; ‘afisa wake’ hakibainishi kupita ushahidi.
- source_word: וַיַּכֵּהוּ
  choice: na kumpiga
  rationale: נכה humaanisha kupiga au kuangusha kwa pigo. Tafsiri hii haitangulizi taarifa inayofuata kwamba Peka alimuua.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: katika ngome ya jumba la mfalme
  rationale: אַרְמוֹן inaweza kuwa jumba, ngome, au makao ya kifalme yenye ulinzi; ‘ngome ya jumba la mfalme’ inaonyesha sehemu yenye ulinzi ndani ya makao ya kifalme bila kurudia ‘jumba’.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: pamoja na Argobu na Arie
  rationale: Muundo sambamba wenye kiashiria cha yambwa unaunga mkono kuyachukua maneno yote mawili kuwa majina ya watu, ingawa אַרְיֵה pia humaanisha ‘simba’ kimsamiati.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: Pamoja naye walikuwa watu hamsini miongoni mwa Wagileadi
  rationale: Kishazi hiki kisicho na kitenzi kinaeleza watu waliokuwa pamoja na Peka; ‘miongoni mwa’ kinahifadhi maana ya sehemu ya kundi iliyo katika מִן.
- source_word: וַיְמִיתֵהוּ
  choice: Akamuua
  rationale: Hifili ya מות ina maana ya kusababisha afe, yaani kumuua; kauli hii inatofautishwa na tendo la awali la kumpiga.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: Hii ni kauli ya kawaida ya urithi wa ufalme katika Wafalme na inasomeka kwa kawaida katika Kiswahili.
