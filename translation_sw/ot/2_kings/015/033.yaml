base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: sw
  text: Alikuwa na umri wa miaka ishirini na mitano alipoanza kutawala, naye akatawala miaka kumi na sita katika Yerusalemu. Mama yake aliitwa Yerusha binti Sadoki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Alikuwa na umri wa miaka ishirini na mitano
  rationale: Hii ni nahau ya Kiebrania ya kutaja umri; tafsiri hii ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: הָיָה בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu wa taarifa za kifalme hutaja umri wa mtu alipoingia madarakani; Kiswahili hiki kinawasilisha maana hiyo kwa kawaida.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: naye akatawala miaka kumi na sita
  rationale: Inahifadhi taarifa ya moja kwa moja kuhusu muda wa utawala kwa mpangilio wa kawaida wa Kiswahili.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Yerusalemu ni umbo la kawaida la jina la mahali katika Kiswahili; 'huko' inaonyesha mahali pa utawala kwa lugha ya kawaida.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa kauli ya Kiebrania inayosema jina la mama yake.
- source_word: יְרוּשָׁא
  choice: Yerusha
  rationale: Ni unukuzi unaofaa wa jina la Kiebrania יְרוּשָׁא katika mfumo wa sauti na tahajia ya Kiswahili.
- source_word: בַּת צָדוֹק
  choice: binti Sadoki
  rationale: Inahifadhi wazi uhusiano wa kifamilia; 'Sadoki' ni umbo la jina linalotumika kwa kawaida katika Kiswahili cha Biblia.
