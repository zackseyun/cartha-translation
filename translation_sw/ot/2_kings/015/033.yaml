translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa taarifa ya kifalme umewekwa wazi bila kuwa wa kikale kupita kiasi. Tanbihi ya Kiingereza kuhusu tahajia mbadala ya Kiingereza Jerushah haijahamishwa, kwa kuwa haihusu tafsiri ya Kiswahili wala tofauti katika matini ya Kiebrania.
