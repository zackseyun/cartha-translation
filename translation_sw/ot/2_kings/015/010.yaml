  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ שַׁלֻּ֣ם בֶּן יָבֵ֔שׁ וַ/יַּכֵּ֥/הוּ קָֽבָלְ עָ֖ם וַ/יְמִיתֵ֑/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: sw
  text: Ndipo Shalumu mwana wa Yabeshi akafanya njama dhidi yake, akampiga mbele ya watu[a], akamuua, akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hadharani” au “mbele ya kusanyiko.” Usemi wa Kiebrania hapa ni mgumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: akafanya njama dhidi yake
  rationale: Katika muktadha wa kisiasa, קשר humaanisha kupanga njama ya uasi dhidi ya mtawala. Usemi huu ni wa kawaida na unaweka wazi uhasama wa njama hiyo.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: Shalumu mwana wa Yabeshi
  rationale: Majina yamenukuliwa kwa namna inayofaa Kiswahili, na בן limetafsiriwa kwa mtindo wa nasaba, “mwana wa.”
- source_word: וַיַּכֵּהוּ
  choice: akampiga
  rationale: נכה ni kumpiga au kumshambulia. Kwa kuwa kitenzi kinachofuata kinataja wazi kumuua, “akampiga” kinahifadhi mfuatano wa matendo bila kuyafanya maneno haya yenyewe yamaanishe kifo.
- source_word: קָבָל־עָם
  choice: mbele ya watu
  rationale: Huu ni usemi mgumu na nadra, lakini huenda unaonyesha tendo lililofanywa hadharani, watu wakiwa mbele yake. Tafsiri hii inafuata kwa ukaribu muundo wa Kiebrania huku ikibaki wazi kwa msomaji.
- source_word: וַיְמִיתֵהוּ
  choice: akamuua
  rationale: Hiphil ya מות humaanisha kusababisha mtu afe, yaani kumuua. Kiswahili cha kawaida hutumia “akamuua,” huku mfuatano baada ya “akampiga” ukihifadhi hatua zote mbili.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: מלך pamoja na תחתיו inaeleza kurithi utawala wa kifalme. “Akatawala mahali pake” ni ya asili katika Kiswahili na inadumisha wazo la kuchukua nafasi yake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wa heshima. Kiunganishi “Ndipo” kinaendeleza mfululizo wa simulizi; vitenzi vya kufuatana vinadumisha mpangilio wa matendo katika Kiebrania. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya usemi unaohusika.
