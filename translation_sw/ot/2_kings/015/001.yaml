  register: Lugha ni ya Kiswahili sanifu cha Afrika Mashariki, ya heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unahifadhi fomula ya kihistoria ya kutaja mwaka wa utawala huku ukiepuka tafsiri ngumu ya neno kwa neno.
