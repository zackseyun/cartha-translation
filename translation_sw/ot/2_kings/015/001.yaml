base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: sw
  text: Katika mwaka wa ishirini na saba wa utawala wa Yeroboamu, mfalme wa Israeli, Azaria mwana wa Amazia, mfalme wa Yuda, alianza kutawala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: Katika mwaka wa ishirini na saba
  rationale: Hii ni fomula ya Kiebrania ya kutaja mwaka wa utawala; Kiswahili cha kawaida hutumia namba ya mpangilio, ‘mwaka wa ishirini na saba.’
- source_word: לְיָרָבְעָם
  choice: wa utawala wa Yeroboamu
  rationale: Katika fomula hii, לְ huonyesha kwamba miaka inahesabiwa kulingana na utawala wa Yeroboamu. Kutaja ‘utawala’ huifanya maana iwe wazi na ya kawaida kwa Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Ni cheo cha kifalme kinachotafsiriwa kwa namna ya kawaida na ya moja kwa moja.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika taarifa za kupanda kwa mfalme, kitenzi hiki huashiria mwanzo wa utawala, si muda wote aliotawala.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Jina limenukuliwa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בֶן אֲמַצְיָה
  choice: mwana wa Amazia
  rationale: Ni usemi wa kawaida wa ukoo unaomtambulisha Azaria kuwa mwana wa Amazia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Ni cheo cha kifalme kinachofafanua nafasi na ufalme wa Azaria.
