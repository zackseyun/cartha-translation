base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: sw
  text: Ndipo Hoshea mwana wa Ela akafanya njama dhidi ya Peka mwana wa Remalia, akampiga, akamuua, akatawala mahali pake katika mwaka wa ishirini wa Yothamu mwana wa Uzia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema, “katika mwaka wa ishirini wa Yothamu mwana wa Uzia.” Hili linaleta ugumu katika mpangilio wa miaka ya utawala, kwa kuwa mahali pengine utawala wa Yothamu unaelezwa kuwa mfupi kuliko miaka ishirini. Tafsiri hii inafuata maneno ya Kiebrania bila kuyapatanisha na utawala wa Ahazi.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: akafanya njama
  rationale: Muundo wa Kiebrania unarudia mzizi mmoja kwa msisitizo, lakini Kiswahili cha kawaida hakiwezi kuiga marudio hayo bila kuwa kizito. “Akafanya njama” huwasilisha wazi kupanga kwa siri dhidi ya mfalme.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: Hoshea mwana wa Ela
  rationale: Majina yametoholewa kwa namna inayofaa Kiswahili, na uhusiano wa kifamilia umehifadhiwa.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: dhidi ya Peka mwana wa Remalia
  rationale: Katika muktadha wa njama, עַל huonyesha mtu anayelengwa na tendo la uhasama; “dhidi ya” ni sawa ya asili katika Kiswahili.
- source_word: וַיַּכֵּהוּ
  choice: akampiga
  rationale: Neno נכה linaeleza tendo la kumpiga. Kitenzi kinachofuata ndicho kinachosema wazi kwamba alimuua, hivyo mpangilio wa matendo umehifadhiwa.
- source_word: וַיְמִיתֵהוּ
  choice: akamuua
  rationale: Hiphil ya מות ina maana ya kusababisha afe. “Akamuua” ni usemi wa sasa, wazi, na wa kawaida katika Kiswahili.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: Huwasilisha kwa ufupi maana ya kumrithi mtu katika ufalme.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: katika mwaka wa ishirini wa Yothamu mwana wa Uzia
  rationale: Mfumo wa kuhesabu miaka ya utawala umetafsiriwa moja kwa moja bila kujaribu kutatua ugumu wa mpangilio wa miaka.
theological_decisions:
- issue: Mvutano wa kihistoria katika mwaka wa ishirini wa Yothamu
  choice: 'Kuhifadhi moja kwa moja tarehe ya maandishi ya Kimasoreti: “katika mwaka wa ishirini wa Yothamu mwana wa Uzia.”'
  alternative: Kulinganisha kimyakimya na utawala wa Ahazi au kurekebisha namba.
  rationale: Maandishi ya Kiebrania yana mwaka wa ishirini wa Yothamu, ingawa taarifa nyingine za Wafalme huleta ugumu wa mpangilio wa miaka. Tafsiri haipaswi kuondoa mvutano huo bila ushahidi wa kimatini; tanbihi inaufafanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya masimulizi ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya kimzizi ya Kiebrania katika kishazi cha njama yamewasilishwa kwa usemi wa kawaida wa Kiswahili badala ya marudio yasiyo ya asili.
