base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: sw
  text: Ndipo Menahemu mwana wa Gadi akapanda kutoka Tirsa, akafika Samaria. Akampiga Shalumu mwana wa Yabeshi katika Samaria na kumuua, kisha akatawala mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha kupanda au kwenda juu. “Akapanda” kinahifadhi taswira ya mwendo bila kuongeza wazi kwamba lilikuwa jeshi, ingawa muktadha ni wa mapinduzi.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahemu mwana wa Gadi
  rationale: Majina yametoholewa kwa namna inayofaa matamshi na matumizi ya Kiswahili, huku uhusiano wa kifamilia ukihifadhiwa.
- source_word: מִתִּרְצָה
  choice: kutoka Tirza
  rationale: Kihusishi מן kinaonyesha chanzo cha mwendo; “kutoka Tirza” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: akafika Samaria
  rationale: בוא pamoja na jina la mahali huonyesha kuja au kufika huko. “Akafika Samaria” ni Kiswahili cha asili na hudumisha mfuatano wa simulizi.
- source_word: וַיַּךְ אֶת
  choice: akampiga
  rationale: נכה humaanisha kupiga, na katika muktadha huu pigo linafuatiwa wazi na kumuua. Kutenganisha “akampiga” na “na kumuua” huhifadhi vitenzi viwili tofauti vya Kiebrania bila kurudia maana kwa maneno kama “akampiga na kumwangusha.”
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: Shalumu mwana wa Yabeshi
  rationale: Majina yametoholewa kwa mfumo unaoeleweka katika Kiswahili, na utambulisho wa ukoo umehifadhiwa.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kihusishi ב kinaonyesha mahali. “Huko Samaria” ni cha asili katika Kiswahili na kinahifadhi kurudiwa kwa jina la mahali kama ilivyo katika Kiebrania.
- source_word: וַיְמִיתֵהוּ
  choice: na kumuua
  rationale: Hifili ya מות ina nguvu ya kusababisha afe. Katika Kiswahili, “kumuua” huwasilisha maana hiyo kwa usahihi na kwa lugha ya kawaida bila kutumia tungo nzito isiyo ya lazima.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: kisha akatawala mahali pake
  rationale: מלך humaanisha kutawala akiwa mfalme, na תחתיו huonyesha kuchukua nafasi ya mtangulizi. “Akatawala mahali pake” huhifadhi maana ya urithi wa utawala bila kuongeza neno lisilokuwapo wazi katika kifungu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi vya simulizi umeonyeshwa kwa viambishi vya -ka-, huku “Ndipo” na “kisha” vikisaidia uwazi wa mtiririko. Kurudiwa kwa Samaria kumehifadhiwa kwa sababu kunapatikana katika matini ya Kiebrania.
