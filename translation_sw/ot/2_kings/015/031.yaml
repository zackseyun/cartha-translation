  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu fomula ya Kiebrania: “Mambo mengine ya Peka” hutoa וְיֶתֶר דִּבְרֵי, “na yote aliyofanya” huhifadhi וְכָל אֲשֶׁר עָשָׂה, na “tazama, yameandikwa” huhifadhi msisitizo wa הִנָּם pamoja na hali tendwa ya כְּתוּבִים. Kichwa cha hati, “Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli,” kinaonyesha kwa usahihi maana ya annali za wafalme wa Israeli.'
