base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: sw
  text: 'Mambo mengine ya Peka na yote aliyofanya—tazama, yameandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli.[a]


    [a] Au, “Kitabu cha Kumbukumbu za Wafalme wa Israeli.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha Kumbukumbu za Wafalme wa Israeli.”
    reason: Huonyesha tafsiri mbadala ya דִּבְרֵי הַיָּמִים kama kumbukumbu rasmi za kifalme badala ya “Mambo ya Nyakati.”
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Mambo mengine
  rationale: Katika muhtasari huu wa kifalme, דִּבְרֵי humaanisha mambo au matendo yaliyorekodiwa, na יֶתֶר huonyesha yaliyobaki. “Mambo mengine” ni Kiswahili cha kawaida na huhifadhi maana ya taarifa zilizobaki bila kuongeza neno la wakati lisilokuwapo katika Kiebrania.
- source_word: פֶקַח
  choice: Peka
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyofanya
  rationale: Huhifadhi upeo kamili wa כָל na maana rahisi ya kitenzi עָשָׂה kwa Kiswahili cha asili.
- source_word: הִנָּם
  choice: tazama
  rationale: Neno hili la uwasilishaji na msisitizo limehifadhiwa badala ya kufupishwa kuwa kiunganishi cha kawaida; “tazama” linaendana na hadhi ya simulizi la kibiblia.
- source_word: כְּתוּבִים
  choice: yameandikwa
  rationale: Huhifadhi maana halisi ya hali tendwa ya kuandika na kupatanisha kitenzi na “mambo” katika Kiswahili.
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל kwa msingi ni “juu ya,” katika rejeo la hati Kiswahili cha kawaida husema jambo limeandikwa “katika kitabu.”
- source_word: דִּבְרֵי הַיָּמִים
  choice: Mambo ya Nyakati
  rationale: Ni usawiri wa maana ya kumbukumbu za matukio ya siku mbalimbali na ni istilahi inayoeleweka kwa hati ya kihistoria ya kifalme.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: za Wafalme wa Israeli
  rationale: לְ hapa huonyesha kumbukumbu zinazowahusu wafalme wa Israeli; umilikishi wa “za” huunda kichwa cha hati kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kifalme umehifadhiwa, pamoja na msisitizo wa “tazama,” huku sentensi ikibaki wazi kwa msomaji wa kawaida.
