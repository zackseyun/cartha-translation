base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: sw
  text: Shalumu mwana wa Yabeshi akawa mfalme katika mwaka wa thelathini na tisa wa utawala wa Uzia, mfalme wa Yuda; naye akatawala kwa muda wa mwezi mmoja katika Samaria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwezi wa siku,” yaani, mwezi mmoja.'
    reason: Nahau ya asili imetafsiriwa kwa Kiswahili cha kawaida, huku umbo lake halisi likionyeshwa hapa.
lexical_decisions:
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika kauli hii kitenzi kinaonyesha kuingia kwake katika ufalme, si tu hali ya kutawala; “akawa mfalme” ni Kiswahili cha kawaida na sahihi.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה לְעֻזִיָּה
  choice: katika mwaka wa thelathini na tisa wa utawala wa Uzia
  rationale: Hii ni fomula ya kuhesabu miaka ya utawala wa mfalme; neno “utawala” limewekwa wazi ili maana iwe ya kawaida katika Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: Alitawala
  rationale: Kitenzi hiki kinaendeleza simulizi kutoka kuingia kwake madarakani hadi muda wa utawala wake.
- source_word: יֶרַח יָמִים
  choice: kwa mwezi mmoja
  rationale: Nahau ya Kiebrania ina maana ya kipindi cha mwezi mmoja; tafsiri hii ni ya asili katika Kiswahili, huku muundo wa asili ukihifadhiwa katika tanbihi.
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Kihusishi kinaonyesha mahali alipotawala; “huko” huunganisha mahali hapo kwa kawaida na kitenzi cha kutawala.
