  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: sw
  text: 'Hili ndilo neno la Yahwe alilomwambia Yehu: “Wana wako hadi kizazi cha nne wataketi kwenye kiti cha enzi cha Israeli.” Ndivyo ilivyotokea.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  choice: Hili ndilo neno la Yahwe
  rationale: Kiwakilishi הוּא kinaelekeza nyuma kwenye tukio lililotangulia kama utimilifu wa tamko la Mungu; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: alilomwambia Yehu
  rationale: Kiswahili huingiza nukuu kwa kawaida bila kutafsiri לֵאמֹר kwa neno tofauti; maana yake imewakilishwa kwa alilomwambia na alama ya nukta mbili.
- source_word: בְּנֵי רְבִיעִים
  choice: Wazao wako hadi kizazi cha nne
  rationale: Nahau ya Kiebrania inahusu mwendelezo wa ukoo wa Yehu kwa vizazi vinne. 'Wazao' huepuka dhana kwamba wana wa moja kwa moja pekee ndio wanaokusudiwa.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: wataketi kwenye kiti cha enzi cha Israeli
  rationale: Inahifadhi taswira halisi ya kuketi kwenye kiti cha enzi badala ya kuibadili moja kwa moja kuwa 'kutawala'.
- source_word: וַיְהִי כֵן
  choice: Ndivyo ilivyotokea
  rationale: Hutoa kwa Kiswahili cha sasa maana ya fomula ya simulizi inayothibitisha utimilifu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; 'Yahwe' hulihifadhi kwa umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Maana ya בְּנֵי רְבִיעִים
  choice: wazao hadi kizazi cha nne
  alternative: wana hadi kizazi cha nne
  rationale: Muktadha wa nasaba ya kifalme unaonyesha vizazi vinne vya ukoo, si lazima wana wa moja kwa moja tu; tafsiri haiongezi fundisho jingine kuhusu ahadi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida huku zikihifadhi lugha ya 'neno' na taswira ya 'kuketi kwenye kiti cha enzi'.
