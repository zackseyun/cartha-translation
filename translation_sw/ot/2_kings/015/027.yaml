base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: sw
  text: Katika mwaka wa hamsini na mbili wa utawala wa Azaria, mfalme wa Yuda, Peka mwana wa Remalia akawa mfalme wa Israeli katika Samaria; akatawala miaka ishirini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: Katika mwaka wa hamsini na mbili wa utawala
  rationale: Ni kauli ya kawaida ya kutaja mwaka wa utawala. Neno “utawala” limeongezwa kwa uwazi wa maana inayodokezwa katika muundo wa Kiebrania, huku hesabu ikitolewa kwa Kiswahili cha kawaida.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: wa Azaria, mfalme wa Yuda
  rationale: Inaonyesha kwamba mwaka huo unahesabiwa katika utawala wa Azaria na kuhifadhi wazi cheo chake cha kifalme.
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika taarifa za kifalme, kitenzi hiki hapa kinaashiria kuingia madarakani. Tafsiri hii pia inatofautisha kutawazwa kwake na muda wa kutawala unaotajwa baadaye.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: Peka mwana wa Remalia
  rationale: Majina yameandikwa kwa namna iliyozoeleka katika Kiswahili, na patronimia ya Kiebrania imehifadhiwa moja kwa moja.
- source_word: עַל יִשְׂרָאֵל
  choice: wa Israeli
  rationale: Pamoja na “akawa mfalme,” huu ndio usemi wa asili wa Kiswahili unaoonyesha kwamba alitawala Israeli, bila kulazimisha muundo wa Kiebrania “juu ya Israeli.”
- source_word: בְּשֹׁמְרוֹן
  choice: huko Samaria
  rationale: Huonyesha mahali pa makao ya utawala; “huko” hufanya kauli iwe wazi na ya kawaida katika Kiswahili.
- source_word: עֶשְׂרִים שָׁנָה
  choice: kwa miaka ishirini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muda wa utawala.
