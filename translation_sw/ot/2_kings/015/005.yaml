base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: sw
  text: BWANA akampiga mfalme, naye akawa na ugonjwa wa ngozi[a] mpaka siku ya kufa kwake; akaishi katika nyumba iliyotengwa[b]. Yothamu, mwana wa mfalme, akawa msimamizi wa jumba la kifalme, akiwahukumu watu wa nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa mwenye ukoma.” Neno la Kiebrania linaweza kumaanisha kwa upana zaidi ugonjwa mbaya wa ngozi, si lazima ukoma wa kisasa (ugonjwa wa Hansen).
    reason: lexical_alternative
  - marker: b
    text: Au, “katika nyumba ya kujitenga”; kihalisi, “katika nyumba ya uhuru.” Huenda usemi wa Kiebrania unamaanisha makao ya pekee au yaliyotengwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Namna ya kawaida na yenye heshima katika Biblia za Kiswahili ya kuwakilisha jina la agano יהוה; herufi kubwa hulitofautisha na cheo cha kawaida ‘Bwana’.
- source_word: וַיְנַגַּע
  choice: akampiga
  rationale: Katika muktadha huu נגע huonyesha pigo au mateso yaliyotoka kwa Mungu, si mguso wa kawaida; ‘akampiga’ huhifadhi uwakala wa Mungu bila kueleza njia ya pigo hilo.
- source_word: מְצֹרָע
  choice: na ugonjwa wa ngozi
  rationale: Neno la Kiebrania linahusu hali ya ngozi yenye athari za kijamii na kiibada, lakini si lazima ukoma wa kisasa (ugonjwa wa Hansen). Tafsiri hii inaepuka utambuzi wa kitabibu usiohakikishwa.
- source_word: עַד יוֹם מֹתוֹ
  choice: mpaka siku ya kufa kwake
  rationale: Huhifadhi nahau na uzito wa usemi wa Kiebrania kuliko kifupi ‘mpaka alipokufa’.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: katika nyumba ya kujitenga
  rationale: Usemi huu mgumu unaelekea kumaanisha makao yaliyotengwa; ‘nyumba ya kujitenga’ huhifadhi wazo la utengano bila kudai kwa uhakika kama alitengwa kwa lazima au aliishi huko akiwa huru kutokana na wajibu fulani.
- source_word: עַל הַבַּיִת
  choice: msimamizi wa jumba la kifalme
  rationale: Nahau hii humaanisha kuwa na usimamizi wa nyumba au ikulu ya mfalme; muktadha wa mwana wa mfalme unaunga mkono maana ya jumba la kifalme.
- source_word: שֹׁפֵט
  choice: akiwahukumu
  rationale: Huhifadhi maana ya moja kwa moja ya utoaji wa hukumu huku ikiruhusu dhana pana ya utawala katika muktadha.
- source_word: עַם הָאָרֶץ
  choice: watu wa nchi
  rationale: Huhifadhi usemi wa Kiebrania bila kuufanya kuwa istilahi ya kisasa ya kisiasa.
theological_decisions:
- issue: Aina ya hali inayoelezwa na מְצֹרָע
  choice: ‘na ugonjwa wa ngozi’ katika matini, pamoja na tanbihi inayoonyesha tafsiri ya jadi ‘mwenye ukoma’
  alternative: ‘akawa mwenye ukoma’
  rationale: Matini haitoi msingi wa kuitambulisha hali hii moja kwa moja na ugonjwa wa Hansen. Tafsiri pana huhifadhi kutokuwa na uhakika kwa neno la Kiebrania, huku tanbihi ikidumisha uhusiano na istilahi ya jadi.
- issue: Maana ya בְּבֵית הַחָפְשִׁית
  choice: ‘katika nyumba ya kujitenga’
  alternative: ‘katika nyumba iliyotengwa’ au, kihalisi, ‘katika nyumba ya uhuru’
  rationale: Maana kamili ya usemi wa Kiebrania si hakika. Chaguo hili linaonyesha kutengwa kwa makao kunakodokezwa na muktadha bila kugeuza ‘uhuru’ kuwa maana chanya isiyofaa hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘BWANA’ inafuata desturi iliyozoeleka ya Biblia za Kiswahili kwa jina יהוה. Majina na miundo imechaguliwa kwa uelewevu wa wasomaji wa kawaida bila kufuta utata halisi wa Kiebrania.
