  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ מְנַחֵ֨ם בֶּן גָּדִ֧י עַל יִשְׂרָאֵ֛ל עֶ֥שֶׂר שָׁנִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: sw
  text: Katika mwaka wa thelathini na tisa wa utawala wa Azaria, mfalme wa Yuda, Menahemu mwana wa Gadi akawa mfalme wa Israeli, naye akatawala miaka kumi huko Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/תֵשַׁע שָׁנָה
  choice: Katika mwaka wa thelathini na tisa wa utawala
  rationale: Hii ni fomula ya kuoanisha miaka ya tawala. Neno “utawala” limewekwa wazi kwa Kiswahili cha kawaida ili kuonyesha kuwa ni mwaka wa kutawala, si umri wa Azaria.
- source_word: לַ/עֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: wa Azaria, mfalme wa Yuda
  rationale: Kiambishi ל kinaonyesha kuwa mwaka huo unahesabiwa kwa kurejelea utawala wa Azaria; cheo chake kimetafsiriwa moja kwa moja.
- source_word: מָלַךְ
  choice: akawa mfalme
  rationale: Katika nafasi hii kitenzi kinaonyesha kuingia madarakani; muda wa kutawala unatajwa baadaye, hivyo “akawa mfalme” huepuka kurudia maana.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahemu mwana wa Gadi
  rationale: Majina yametoholewa kwa namna inayofaa matamshi ya Kiswahili, na בֶּן imetafsiriwa kwa “mwana wa”.
- source_word: עַל יִשְׂרָאֵל
  choice: wa Israeli
  rationale: Pamoja na “akawa mfalme,” Kiswahili hutumia kwa kawaida “mfalme wa Israeli” kueleza watu au eneo alilotawala.
- source_word: עֶשֶׂר שָׁנִים
  choice: miaka kumi
  rationale: Ni kirai cha moja kwa moja kinachoonyesha muda wa utawala.
- source_word: בְּ/שֹׁמְרוֹן
  choice: huko Samaria
  rationale: ב ni ya mahali; “huko Samaria” inaonyesha kwa kawaida na kwa uwazi mahali yalipokuwa makao ya utawala wake.
