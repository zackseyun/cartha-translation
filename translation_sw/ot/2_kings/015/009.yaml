base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: sw
  text: Akafanya yaliyo maovu machoni pa Yahwe, kama walivyofanya baba zake. Hakuziacha dhambi za Yeroboamu mwana wa Nebati, ambaye aliifanya Israeli itende dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhambi za Yeroboamu mwana wa Nebati, ambazo aliifanya Israeli itende dhambi.” Kishazi cha Kiebrania kinaweza kuhusishwa ama na Yeroboamu mwenyewe ama na dhambi zinazohusishwa naye.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Muundo wa simulizi unaendeleza mfululizo wa matukio; ‘akafanya’ ni wa kawaida na wa asili katika masimulizi ya Kiswahili.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: yaliyo maovu machoni pa Yahwe
  rationale: Inahifadhi nahau ya Kiebrania ya tathmini mbele za Mungu huku ikibaki wazi na yenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: kama walivyofanya baba zake
  rationale: Inahifadhi ulinganisho na nomino ya kiume ya Kiebrania katika muktadha wa kifalme.
- source_word: לֹא סָר
  choice: Hakuacha
  rationale: Hapa סור humaanisha kutengana na mwenendo au kuacha kuufuata; ‘hakuacha’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: מֵחַטֹּאות
  choice: dhambi za
  rationale: Inahifadhi wingi wa nomino ya Kiebrania na uhusiano wake na makosa ya Yeroboamu.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya Biblia ya Kiswahili, na uhusiano wa kifamilia umehifadhiwa.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambaye aliifanya Israeli itende dhambi
  rationale: Kitenzi cha umoja wa kiume kinaunga mkono kumchukua Yeroboamu kuwa rejeleo la karibu; ‘aliifanya ... itende’ linaonyesha wazi maana ya kisababishi ya hiphil.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania bila kulibadilisha kuwa cheo.
- issue: Rejeleo la kishazi אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ambaye aliifanya Israeli itende dhambi
  alternative: ambazo kwa hizo aliifanya Israeli itende dhambi
  rationale: Upatanisho wa kitenzi cha Kiebrania unaelekeza kwa Yeroboamu kama mtendaji, lakini kiwakilishi אֲשֶׁר chenyewe hakionyeshi jinsia wala idadi; kwa hiyo uwezekano wa kukihusisha kishazi na dhambi umeonyeshwa katika tanbihi badala ya kufutwa.
- issue: Neno la ukoo אֲבֹתָיו
  choice: baba zake
  alternative: mababu zake; waliomtangulia
  rationale: Uundaji wa kiume wa Kiebrania umehifadhiwa, pamoja na mvutano wa muktadha unaoweza kuhusisha baba au watangulizi wa kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ‘machoni pa’ inadumisha picha ya Kiebrania bila kuwa ngumu kueleweka; sentensi ya pili imewekwa kwa lugha rahisi huku utata halisi wa kishazi cha mwisho ukihifadhiwa katika tanbihi.
