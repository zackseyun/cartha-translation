source:
  edition: WLC
  text: בָּ֣א פ֤וּל מֶֽלֶךְ אַשּׁוּר֙ עַל הָ/אָ֔רֶץ וַ/יִּתֵּ֤ן מְנַחֵם֙ לְ/פ֔וּל אֶ֖לֶף כִּכַּר כָּ֑סֶף לִ/הְי֤וֹת יָדָי/ו֙ אִתּ֔/וֹ לְ/הַחֲזִ֥יק הַ/מַּמְלָכָ֖ה בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: sw
  text: Pulu, mfalme wa Ashuru, aliivamia nchi[a], naye Menahemu akampa Pulu talanta elfu moja za fedha ili Pulu amuunge mkono katika kuimarisha ufalme chini ya mamlaka yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nchi” huenda inamaanisha nchi ya Israeli.
    reason: cultural_note
  - marker: b
    text: Kiebrania kinasema kihalisi, “ili mkono wake uwe pamoja naye, kuutia nguvu ufalme mkononi mwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא פוּל מֶלֶךְ אַשּׁוּר עַל הָאָרֶץ
  choice: Pulu, mfalme wa Ashuru, aliivamia nchi
  rationale: בוא pamoja na עַל katika muktadha wa kijeshi huonyesha kuja kwa uhasama. ‘Aliivamia’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo kwa uwazi. Majina yamenukuliwa kwa maumbo yaliyozoeleka katika Kiswahili.
- source_word: וַיִּתֵּן מְנַחֵם לְפוּל
  choice: naye Menahemu akampa Pulu
  rationale: נתן ni ‘kutoa/kumpa’; ‘akampa’ huhifadhi maana ya msingi bila kuongeza wazi kuwa ilikuwa kodi au rushwa.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: talanta elfu moja za fedha
  rationale: ככר ni kipimo kikubwa cha uzito; ‘talanta’ ni istilahi ya kawaida ya kibiblia, huku ‘za fedha’ ikihifadhi metali inayotajwa.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: ili Pulu amuunge mkono
  rationale: Nahau ya Kiebrania ‘mkono wake uwe pamoja naye’ humaanisha kumpa msaada au uungwaji mkono. Kutaja Pulu huondoa utata wa viwakilishi unaoweza kutokea katika Kiswahili.
- source_word: לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ
  choice: katika kuimarisha ufalme chini ya mamlaka yake
  rationale: Hifili ya חזק humaanisha kufanya imara; בְּיָדוֹ ni nahau ya kuwa chini ya udhibiti au mamlaka ya mtu. Tafsiri hii ni ya asili na inaweka wazi kuwa mamlaka hiyo ni ya Menahemu.
