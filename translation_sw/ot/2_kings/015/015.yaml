  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: sw
  text: Matendo mengine ya Shalumu na njama yake aliyoipanga[a]—tazama, yameandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hurudia nomino na kitenzi cha mzizi mmoja, kwa msisitizo: kwa karibu, “njama yake aliyofanya.”'
    reason: lexical_alternative
  - marker: b
    text: Yaani, kumbukumbu rasmi za kifalme zilizotumiwa kama chanzo katika kitabu cha Wafalme.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: Matendo mengine ya Shalumu
  rationale: Katika muundo huu wa kawaida wa kutoa muhtasari wa utawala, דִּבְרֵי humaanisha matendo au mambo ya mfalme, si maneno aliyoyasema tu. “Matendo mengine” ni Kiswahili cha kawaida na hudumisha maana ya sehemu iliyobaki ya habari.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: na njama aliyoipanga
  rationale: קֶשֶׁר katika muktadha wa kisiasa ni njama. Kiebrania kinarudia nomino na kitenzi vya mzizi mmoja; Kiswahili cha kawaida hakiwezi kudumisha urudiaji huo bila kuwa kizito, kwa hiyo msisitizo wa asili umeelezwa katika tanbihi.
- source_word: הִנָּם כְּתֻבִים
  choice: tazama, yameandikwa
  rationale: הִנָּם ni kiashirio cha kimfumo chenye maana ya ‘tazama, yako/yame’; “tazama” huhifadhi mkazo wa kumwelekeza msomaji kwenye kumbukumbu zilizotajwa.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli
  rationale: Hili ni jina la chanzo cha kumbukumbu za kifalme kinachotajwa mara kwa mara katika Wafalme. “Katika” ni namna ya kawaida ya Kiswahili ya kusema kwamba habari imo kitabuni.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Jina Shalumu limefuata umbo la kawaida la kibiblia la Kiswahili. Muundo wa kumbukumbu za kifalme umehifadhiwa bila kudokeza kwamba chanzo hiki ndicho kitabu cha Biblia kinachoitwa Mambo ya Nyakati.
