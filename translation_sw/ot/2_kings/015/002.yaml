base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: sw
  text: Alikuwa na umri wa miaka kumi na sita alipoanza kutawala, naye akatawala huko Yerusalemu kwa miaka hamsini na miwili. Mama yake aliitwa Yekolia wa Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka Yerusalemu.”
    reason: Kihusishi מִן kinaweza pia kumaanisha “kutoka”; katika taarifa hii ya ukoo, “wa Yerusalemu” ni tafsiri ya asili zaidi.
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Alikuwa na umri wa miaka kumi na sita
  rationale: Nahau ya Kiebrania, kihalisi ‘mwana wa miaka kumi na sita,’ imetafsiriwa kwa Kiswahili cha kawaida huku umri kamili ukihifadhiwa.
- source_word: הָיָה בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha umri wake alipoingia madarakani; ‘alipoanza kutawala’ ni wa asili na sahihi katika Kiswahili.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: miaka hamsini na miwili
  rationale: Huu ndio mpangilio wa kawaida wa namba hiyo katika Kiswahili.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Katika taarifa za kifalme, kitenzi hiki humaanisha kutawala akiwa mfalme; muktadha tayari unaweka wazi ufalme wake.
- source_word: בִּירוּשָׁלָם
  choice: huko Yerusalemu
  rationale: Kihusishi ב ni cha mahali. ‘Huko’ kinaonyesha wazi kuwa Yerusalemu ndiko alikotawala.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Ni Kiswahili cha asili kinachowasilisha kikamilifu fomula ya Kiebrania, ‘jina la mama yake lilikuwa.’
- source_word: יְכָלְיָהוּ
  choice: Yekolia
  rationale: Jina limeandikwa kwa mfumo unaokaribia matamshi ya Kiebrania na unaofaa tahajia ya Kiswahili.
- source_word: מִירוּשָׁלָם
  choice: wa Yerusalemu
  rationale: מן hapa huonyesha asili au mahali alikotoka. ‘Wa Yerusalemu’ ni usemi mfupi wa kawaida unaohifadhi uwezekano huo bila kudokeza tendo la kusafiri.
