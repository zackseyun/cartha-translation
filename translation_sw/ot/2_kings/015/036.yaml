base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Yothamu, aliyoyafanya, je, hayakuandikwa[a] katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hayakuwekwa katika kumbukumbu.” Kiebrania husema kwa maana halisi, “yameandikwa,” lakini hapa maana yake ni kwamba matendo hayo yaliingizwa katika kumbukumbu rasmi za kifalme.
    reason: lexical_alternative
  - marker: b
    text: “Kitabu cha Mambo ya Nyakati” hapa ni kumbukumbu za kifalme, wala si lazima kirejelee kitabu cha Biblia kinachoitwa Mambo ya Nyakati.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Matendo mengine
  rationale: יֶתֶר ni ‘sehemu iliyobaki’ au ‘mengine,’ na דִּבְרֵי katika muhtasari huu wa utawala hurejelea matendo au shughuli za mfalme. ‘Matendo mengine’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kuongeza neno ‘sasa.’
- source_word: יוֹתָם
  choice: Yothamu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyoyafanya
  rationale: Inahifadhi kishazi rejeshi cha Kiebrania na kumtaja Yothamu kuwa mtendaji.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: je, hayakuandikwa
  rationale: הֲלֹא huanzisha swali la balagha linalotarajia jibu la ndiyo. ‘Hayakuandikwa’ huhifadhi wazo la msingi la כְּתוּבִים, ‘yaliyoandikwa.’
- source_word: עַל סֵפֶר
  choice: katika Kitabu
  rationale: Ingawa עַל ni ‘juu ya,’ katika muktadha wa habari zilizomo kwenye hati, Kiswahili cha kawaida hutumia ‘katika.’ סֵפֶר hapa ni hati au kitabu cha kumbukumbu.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Mambo ya Nyakati
  rationale: Kirai hiki kina maana ya kumbukumbu za matukio kwa mpangilio wa nyakati; tafsiri hii pia ni istilahi inayoeleweka kwa wasomaji wa Kiswahili.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: za Wafalme wa Yuda
  rationale: Katika jina hili la hati, לְ linaonyesha kwamba kumbukumbu hizo zinawahusu wafalme wa Yuda; ‘za’ ni uhusiano wa kawaida na wa wazi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Swali la balagha na uradidi wa kishazi cha Kiebrania vimehifadhiwa kwa kiwango ambacho bado ni cha asili katika Kiswahili. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja: [a] baada ya ‘hayakuandikwa’ na [b] baada ya jina la hati.'
