  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: sw
  text: Katika mwaka wa thelathini na nane wa utawala wa Azaria, mfalme wa Yuda, Zekaria mwana wa Yeroboamu alianza kutawala Israeli huko Samaria kwa miezi sita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה לַעֲזַרְיָהוּ
  choice: Katika mwaka wa thelathini na nane wa utawala wa Azaria
  rationale: Muundo wa Kiebrania ni fomula ya kutaja mwaka wa utawala; ‘wa utawala wa’ huweka wazi maana ya לַ katika Kiswahili cha kawaida bila kutafsiri kikakamavu.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Huu ni muundo wa kawaida unaotaja cheo cha Azaria na eneo alilotawala.
- source_word: מָלַךְ
  choice: alianza kutawala
  rationale: Katika fomula hii kitenzi kinaashiria kuingia madarakani; uchaguzi huu unatofautisha kuanza kwa utawala na muda wake unaotajwa baadaye.
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: Zekaria mwana wa Yeroboamu
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, na בֶן imetafsiriwa moja kwa moja kuwa ‘mwana wa’.
- source_word: עַל יִשְׂרָאֵל
  choice: kutawala Israeli
  rationale: עַל pamoja na מלך huonyesha mamlaka juu ya taifa; Kiswahili hutumia kwa ufasaha kitenzi ‘kutawala’ na yambwa ‘Israeli’.
- source_word: בְּשֹׁמְרוֹן
  choice: akiwa Samaria
  rationale: Kirai hiki kinaonyesha mahali au makao ya utawala. ‘Akiwa Samaria’ ni cha asili na hakidai kwamba alitawala Samaria pekee.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: akatawala kwa miezi sita
  rationale: Nomino hizi zinafanya kazi kama kishazi cha muda; ‘kwa miezi sita’ huonyesha wazi urefu wa utawala wake.
