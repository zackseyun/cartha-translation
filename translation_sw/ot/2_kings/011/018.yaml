language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: sw
  text: Kisha watu wote wa nchi wakaingia katika nyumba ya Baali[a] na kuibomoa. Wakavunja kabisa madhabahu zake na sanamu zake[b], wakamuua Matani, kuhani wa Baali, mbele ya madhabahu. Kisha kuhani akaweka wasimamizi juu ya nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu la Baali.” Kiebrania kinasema “nyumba ya Baali.”
    reason: lexical_alternative
  - marker: b
    text: Au “vinyago vyake” au “picha zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: watu wote wa nchi
  rationale: Huhifadhi nahau ya Kiebrania inayotaja jamii ya nchi bila kuifasiri kwa namna finyu kuwa watu wa kawaida pekee.
- source_word: בֵּית הַבַּעַל
  choice: nyumba ya Baali
  rationale: “Nyumba” hufuata neno la Kiebrania moja kwa moja na pia hudumisha ulinganifu na “nyumba ya Yahwe”; tanbihi inaonyesha maana ya kiutendaji ya hekalu.
- source_word: וַיִּתְּצֻהוּ
  choice: kuibomoa
  rationale: Kitenzi kinaonyesha kuangusha au kubomoa jengo; “kuibomoa” ni Kiswahili cha kawaida na wazi katika muktadha huu.
- source_word: מִזְבְּחֹתָיו
  choice: madhabahu zake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kinaelekezwa kwa Baali, kama ilivyo katika Kiebrania.
- source_word: צְלָמָיו
  choice: sanamu zake
  rationale: “Sanamu” hutoa maana ya picha au maumbo ya ibada kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyomo katika neno lenyewe.
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: wakavunja-vunja kabisa
  rationale: Urudiaji wa kitenzi pamoja na “kabisa” unaonyesha tendo la kuvunja kwa nguvu na kwa ukamilifu.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: Matani, kuhani wa Baali
  rationale: Ni utambulisho wa moja kwa moja wa mtu huyo na wadhifa wake wa kidini.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: mbele ya madhabahu hizo
  rationale: Huhifadhi maana ya mahali ya לִפְנֵי; “hizo” hurejelea kwa uwazi madhabahu zilizotajwa.
- source_word: וַיָּשֶׂם הַכֹּהֵן פְּקֻדּוֹת
  choice: kuhani akaweka wasimamizi
  rationale: Katika muktadha wa usimamizi wa hekalu, kifungu kinaeleweka kwa kawaida kuwa kuweka watu wenye wajibu wa kusimamia, huku kisidai zaidi ya ushahidi wa muktadha.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi neno la Kiebrania na ulinganifu wa kimakusudi na nyumba ya Baali; jina la agano YHWH limetolewa kama Yahwe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu YHWH moja kwa moja. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo, na ni umbo la Kiswahili linalotambulika.
- issue: Rejeo la viambishi katika “madhabahu zake na sanamu zake”
  choice: Viambishi vinamrejelea Baali
  alternative: Viambishi virejelee nyumba/hekalu la Baali
  rationale: Viambishi vya Kiebrania ni vya kiume umoja na vinaweza kurejelea Baali; tafsiri hii huhifadhi ubinafsishaji wa sarufi ya chanzo bila kubadili vitu hivyo kuwa mali ya jengo.
- issue: Maana ya פְּקֻדּוֹת katika nyumba ya Yahwe
  choice: wasimamizi
  alternative: majukumu, walinzi, au ofisi
  rationale: Neno linaweza kutaja usimamizi, madaraka, au waliokabidhiwa wajibu. Muktadha unaunga mkono watu waliowekwa kusimamia, lakini upeo wake kamili si hakika kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Masimulizi yametumia mfululizo wa vitenzi vya “waka-” kwa mtiririko wa asili. “Baali” na “Matani” yametumika kama maumbo yanayofaa kifonolojia katika Kiswahili; “Yahwe” limetumika kwa YHWH.
