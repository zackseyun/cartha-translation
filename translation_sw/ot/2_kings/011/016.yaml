  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: sw
  text: Basi wakamkamata[a], naye akaenda kwa njia ya kuingilia farasi katika nyumba ya mfalme[b], na huko akauawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “wakamwekea mikono.” Katika muktadha huu, huenda ikimaanisha, “wakamkamata.” Wengine huelewa maneno hayo kuwa, “wakampisha njia.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni, “mahali pa kuingilia farasi.” Huenda hii ilikuwa njia au mahali pa kuingilia ambapo farasi walitumia kuingia katika eneo la jumba la mfalme.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: wakamkamata
  rationale: Nahau hiyo ina maana ya kumwekea mikono mtu kwa kusudi la kumtia nguvuni. Katika muktadha huu, “wakamkamata” ni Kiswahili cha kawaida na huonyesha wazi kukamatwa kwake bila kudai kwamba walimwua papo hapo.
- source_word: וַתָּבֹא
  choice: akaenda
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kwenda kulingana na mtazamo wa msimuliaji. Hapa mwendo ni kutoka eneo la hekalu kuelekea nyumba ya mfalme, hivyo “akaenda” inafaa; umbo tendwa “akapelekwa” halimo wazi katika Kiebrania.
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: kwa njia ya lango la farasi kuingia
  rationale: דֶּרֶךְ huonyesha njia, na מְבוֹא ni mahali au njia ya kuingilia. Tafsiri hii inaeleza kwa Kiswahili sanifu kwamba hilo lilikuwa lango au njia ambayo farasi waliitumia kuingia, bila kulifanya jina rasmi la lango.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Hii inafuata kwa karibu maana ya maneno ya Kiebrania. Katika muktadha inahusu jumba au eneo la kifalme, jambo linalofafanuliwa katika tanbihi.
- source_word: וַתּוּמַת
  choice: akauawa
  rationale: Umbo la Hofali la מות lina maana ya kusababishwa kufa. “Akauawa” huwasilisha utendaji huo kwa ufupi na kwa kawaida; muktadha unaonyesha kuwa ilikuwa hukumu ya kifo, si kifo cha kawaida.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali alikopelekwa na kuuawa.
