  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/עֲתַלְיָה֙ אֵ֣ם אֲחַזְיָ֔הוּ ו/ראתה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֨קָם֙ וַ/תְּאַבֵּ֔ד אֵ֖ת כָּל זֶ֥רַע הַ/מַּמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: sw
  text: Athalia, mama yake Ahazia, aliona kwamba mwanawe alikuwa amekufa; basi akainuka na kuwaangamiza wazao wote wa kifalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “mbegu yote ya ufalme,” yaani, ukoo wa kifalme au wazao wa kifalme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה
  choice: Athalia
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili; kiunganishi cha simulizi וַ hakihitaji neno tofauti mwanzoni mwa sentensi.
- source_word: אֵם אֲחַזְיָהוּ
  choice: mama yake Ahazia
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi uhusiano wa Athalia na Ahazia.
- source_word: וַתָּרְאֶה כִּי מֵת בְּנָהּ
  choice: aliona kwamba mwanawe alikuwa amekufa
  rationale: Kitenzi ראה pamoja na כִּי kinaonyesha kutambua ukweli; wakati timilifu uliopita unaeleza kwamba kifo kilikuwa tayari kimetokea.
- source_word: וַתָּקָם
  choice: basi akainuka
  rationale: קום katika simulizi huonyesha kuanza kuchukua hatua kwa uamuzi; “basi” linaonyesha matokeo ya jambo aliloliona bila kuongeza sababu isiyosemwa.
- source_word: וַתְּאַבֵּד
  choice: kuwaangamiza
  rationale: Pieli ya אבד hapa ni kusababisha maangamizi; neno hili linahifadhi upana wa kitenzi huku muktadha ukionyesha kuuawa.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: wazao wote wa kifalme
  rationale: זֶרַע kwa maana halisi ni “mbegu,” lakini katika muktadha wa nasaba ya utawala humaanisha wazao; “wa kifalme” linawasilisha uhusiano na ufalme kwa Kiswahili cha kawaida.
