base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: sw
  text: Kisha Yehoyada akafanya agano kati ya Yahwe na mfalme na watu[a], ili wawe watu wa Yahwe[b], na pia kati ya mfalme na watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “akakata agano,” nahau ya kawaida yenye maana ya “akafanya agano.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ili wawe watu kwa ajili ya Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: akafanya agano
  rationale: Kitenzi כרת pamoja na ברית ni nahau ya kawaida ya Kiebrania yenye maana ya kufanya au kuweka agano; tafsiri ya neno kwa neno ‘akakata’ isingekuwa ya kawaida kwa Kiswahili.
- source_word: הַבְּרִית
  choice: agano
  rationale: ברית lina uzito wa uhusiano rasmi wa kiagano; ‘makubaliano’ lingedhoofisha maana hiyo. Ingawa lina kibainishi katika Kiebrania, Kiswahili hakihitaji kutofautisha ‘agano’ na ‘agano hilo’ kwa namna ileile.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: kati ya Yahwe na mfalme na watu
  rationale: Muundo huu unabaki karibu na urudiaji wa בֵּין na kuonyesha wahusika wa agano bila kuamua kimyakimya kama ni agano moja la pande tatu au uhusiano uliopangwa kwa namna nyingine.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo ‘BWANA’.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: ili wawe watu wa Yahwe
  rationale: ‘Ili wawe’ huonyesha kusudi au matokeo ya kishazi cha kitenzi-jina, na ‘watu wa Yahwe’ ni Kiswahili cha kawaida kinachohifadhi maana ya uhusiano na kuwa mali yake.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: na pia kati ya mfalme na watu
  rationale: ‘Pia’ humsaidia msomaji kuona kwamba mstari unaongeza uhusiano wa kiagano kati ya mfalme na watu.
- source_word: הָעָם
  choice: watu
  rationale: Hapa עָם ni jumuiya ya watu kwa pamoja; ‘watu’ ndiyo tafsiri ya kawaida na iliyo wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo.
- issue: Maana ya kanuni ya agano לִהְיוֹת לְעָם לַיהוָה
  choice: ili wawe watu wa Yahwe
  alternative: ili wawe watu kwa ajili ya Yahwe
  rationale: Chaguo hili ni la kawaida katika Kiswahili na linaonyesha kuwa watu hao ni wake Yahwe, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi urudiaji wa ‘kati ya’ kwa kiasi kinachoweka wazi muundo wa mahusiano ya agano, bila kuwa nzito kupita kiasi.
