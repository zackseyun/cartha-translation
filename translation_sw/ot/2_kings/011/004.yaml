reference: 2 Kings 11:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: sw
  text: Katika mwaka wa saba, Yehoyada akatuma kuwaita majemadari wa mamia wa Wakari[a] na wakimbiaji[b], akawaleta kwake katika nyumba ya Yahweh. Akafanya nao agano na kuwaapisha katika nyumba ya Yahweh, kisha akawaonyesha mwana wa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wakerethi.” Huenda neno la Kiebrania ni jina la kikosi cha walinzi wa mfalme, lakini utambulisho wake kamili hauna hakika.
    reason: alternative_reading
  - marker: b
    text: “Wakimbiaji” huenda walikuwa walinzi wa mfalme au wajumbe wake.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: Katika mwaka wa saba
  rationale: Kirai hiki kinaweka wakati wa tukio. Kiunganishi cha mwanzo hakihitaji kutafsiriwa kwa “na” katika Kiswahili, kwa kuwa mwendelezo wa simulizi unabaki wazi.
- source_word: שָׁלַח וַיִּקַּח
  choice: akatuma watu kuwaita
  rationale: Mfuatano halisi ni “akatuma, akawachukua/akawaleta.” Katika muktadha huu Yehoyada aliwatuma wajumbe ili kuwakusanya maofisa; tafsiri hii ya Kiswahili inaeleza tendo hilo kwa kawaida bila kubadili matokeo yake.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: majemadari wa vikosi vya watu mia
  rationale: Hawa ni maofisa waliokuwa na mamlaka juu ya vikundi vya watu mia. “Majemadari” ni neno la kijeshi linaloeleweka, nalo kirai kizima huepuka neno lenye mazingira maalumu ya jeshi la Roma.
- source_word: לַכָּרִי
  choice: vya Wakari
  rationale: Muundo wa Kiebrania unaunganisha majemadari hao na kikosi kinachoitwa Wakari. Jina hilo limehifadhiwa kwa kuwa utambulisho wake kamili hauna hakika; uwezekano wa “Wakerethi” umetajwa katika tanbihi.
- source_word: וְלָרָצִים
  choice: na wakimbiaji
  rationale: Maana ya moja kwa moja ni “wakimbiaji,” jina lililotumiwa kwa watumishi wa kifalme ambao huenda walikuwa walinzi au wajumbe. Neno la picha limehifadhiwa, huku kazi inayowezekana ikifafanuliwa katika tanbihi.
- source_word: וַיָּבֵא אֹתָם אֵלָיו בֵּית יְהוָה
  choice: akawaleta kwake katika nyumba ya Yahweh
  rationale: Tafsiri hii huhifadhi wingi wa wahusika, kuletwa kwao mbele ya Yehoyada, na usemi wa Kiebrania “nyumba ya Yahweh.”
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: Akafanya nao agano
  rationale: Kitenzi cha Kiebrania ni nahau ya “kukata agano.” “Kufanya agano” ni Kiswahili cha kawaida kinachohifadhi uzito wa kisiasa na kidini wa tendo hilo.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: na kuwaapisha
  rationale: Umbo la kitenzi lina maana ya kuwafanya waape; “kuwaapisha” huwasilisha maana hiyo kwa ufupi na kwa heshima.
- source_word: וַיַּרְא אֹתָם אֶת בֶּן הַמֶּלֶךְ
  choice: akawaonyesha mwana wa mfalme
  rationale: Yehoyada aliwaonyesha au aliwafunulia mrithi huyo wa kifalme. “Akawaonyesha” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה lenyewe. “Yahweh” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Uhusiano wa majemadari na Wakari pamoja na wakimbiaji
  choice: majemadari wa vikosi vya watu mia vya Wakari na wakimbiaji
  alternative: majemadari wa vikosi vya watu mia, Wakari, na wakimbiaji
  rationale: Vihusishi vya Kiebrania לַכָּרִי וְלָרָצִים vinaelekea kuwaunganisha majemadari na vikosi hivyo viwili, si kuorodhesha makundi matatu yaliyo sawa. Tafsiri haibadili sintaksia hiyo kuwa orodha ya makundi huru.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kama simulizi la kawaida, huku “nyumba ya Yahweh,” “agano,” na majina ya vikosi yakihifadhi uzito na taswira ya maandishi ya Kiebrania. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
