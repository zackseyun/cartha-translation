base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: sw
  text: Kisha akamtoa mwana wa mfalme, akamvika taji na kumpa ushuhuda huo.[a] Wakamfanya kuwa mfalme na kumtia mafuta; wakapiga makofi na kusema, “Mfalme na aishi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hati ya agano” au “amri.” Kiebrania kinasema “ushuhuda,” huenda kikimaanisha hati iliyoandikwa iliyohusiana na utawala wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: akamtoa
  rationale: Hifili ya יצא ina maana ya kusababisha atoke au kumtoa; “akamtoa” ni ya asili na huhifadhi maana ya kisababishi.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: mwana wa mfalme
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa umilikaji, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הַנֵּזֶר
  choice: taji
  rationale: Katika muktadha wa kifalme, נזר ni alama ya ufalme; “taji” ni neno wazi na linaloeleweka kwa urahisi.
- source_word: הָעֵדוּת
  choice: Ushuhuda
  rationale: Neno hilo kimsingi humaanisha ushuhuda au shahidi. Herufi kubwa husaidia kuonyesha kuwa hapa huenda ni kitu au hati maalumu, bila kulazimisha utambulisho wake hasa.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: wakamfanya kuwa mfalme
  rationale: Hifili ya מלך humaanisha kumfanya mtu awe mfalme; tafsiri hii ni ya moja kwa moja na haitangulizi wazo la kutangazwa au kutawazwa lisilotajwa wazi katika kitenzi.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: kumtia mafuta
  rationale: Hii ni tamko la kawaida la Kiswahili kwa tendo rasmi la משׁח katika kuwekwa wakfu kwa mfalme.
- source_word: וַיַּכּוּ כָף
  choice: wakapiga makofi
  rationale: Nahau hiyo kihalisi huhusu kupiga kiganja na katika muktadha huu inaonyesha shangwe ya hadhara; “kupiga makofi” ndiyo sawa ya kawaida ya Kiswahili.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Mfalme na aishi!
  rationale: Huhifadhi kwa karibu nguvu ya ombi au shangilio la kiyusivu la Kiebrania, huku ikiwa tamko la asili katika Kiswahili cha kibiblia kinachoeleweka.
theological_decisions:
- issue: Maana ya הָעֵדוּת katika tukio la kumweka mfalme
  choice: Ushuhuda katika matini kuu
  alternative: hati ya agano; amri
  rationale: Neno hilo huenda linamaanisha hati iliyoandikwa inayoshuhudia wajibu wa mfalme chini ya agano, lakini Kiebrania hakibainishi zaidi ya “Ushuhuda.” Tafsiri pana inalinda utata halisi wa matini, na uwezekano mahususi unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitendo umehifadhiwa, huku viunganishi vikigawanywa kwa ufasaha wa Kiswahili. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalofafanuliwa.
