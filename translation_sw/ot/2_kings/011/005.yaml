lexical_decisions:
- source_word: וַיְצַוֵּם
  choice: Akawaamuru
  rationale: Kitenzi cha Kiebrania katika Piel kina maana ya kutoa amri; “akawaamuru” kinahifadhi mamlaka ya agizo na mtiririko wa simulizi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huhifadhi kwa njia ya kawaida ya Kiswahili fomula ya Kiebrania ya kutanguliza maneno yanayonukuliwa.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: Hili ndilo jambo mtakalofanya
  rationale: Tafsiri hii inaakisi muundo wa Kiebrania huku ikitoa agizo kwa Kiswahili sanifu na cha asili.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: theluthi moja yenu
  rationale: Ni usemi wa kawaida na sahihi wa Kiswahili kwa sehemu moja kati ya tatu.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: mnaoingia zamu siku ya Sabato
  rationale: Katika muktadha, wanaokuja Sabato ni walinzi wanaoingia kazini wakati wa kubadilishana zamu; “mnaoingia zamu” huweka maana hiyo wazi bila kuondoa marejeo ya Sabato.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: watalinda
  rationale: Muundo huu unahusu kutekeleza wajibu wa ulinzi; wakati ujao unaonyesha nguvu ya agizo katika muktadha.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania na haibani maana kuwa jengo maalumu zaidi kuliko chanzo kinavyosema.
