base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: sw
  text: Athalia aliposikia kelele za walinzi[a] na za watu[b], akawaendea watu katika nyumba ya Yahwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakimbiaji”; huenda neno hilo linamaanisha kikosi cha walinzi wa mfalme.
    reason: lexical_alternative
  - marker: b
    text: Au “sauti za walinzi na za watu.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, katika eneo la hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: aliposikia
  rationale: Katika mfululizo huu wa simulizi, שׁמע inaonyesha kutambua kwa kusikia; “aliposikia” ni Kiswahili cha kawaida na huunganisha kwa kawaida tukio hili na hatua iliyofuata.
- source_word: עֲתַלְיָה
  choice: Athalia
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: קוֹל
  choice: kelele
  rationale: קוֹל inaweza kumaanisha sauti, kelele, au sauti ya mtu. Katika tukio la hadhara lenye walinzi na watu waliokusanyika, “kelele” inaeleza vizuri mshindo wa pamoja bila kuufanya kuwa sauti ya mtu mmoja.
- source_word: הָרָצִין
  choice: walinzi
  rationale: Neno hili, linalotokana na רוץ (“kukimbia”), kihalisi linaweza kuwa “wakimbiaji,” lakini katika mazingira ya kifalme humaanisha kikosi cha walinzi au walinzi wa mfalme. “Walinzi” huwasilisha kazi yao kwa uwazi; maana halisi imehifadhiwa katika tanbihi.
- source_word: הָעָם
  choice: watu
  rationale: עָם ni neno la kawaida kwa “watu”; hapa linawahusu watu waliokusanyika bila kulazimisha tafsiri maalumu zaidi kama “umati.”
- source_word: וַתָּבֹא אֶל
  choice: akawaendea
  rationale: בוא pamoja na אֶל huonyesha kwenda au kuja kwa mtu au kundi. “Akawaendea” ni ya asili katika mtazamo wa simulizi wa Kiswahili na inaonyesha mwendo kuelekea kwa watu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya “nyumba” na kulitaja jina la agano יְהוָה kwa umbo la Kiswahili “Yahwe”; muktadha wa hekalu umefafanuliwa katika tanbihi.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tahajia yake ikifuata matumizi ya kawaida ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Muundo “kelele za ... na za ...” unaonyesha wazi kuwa kelele zilitoka kwa makundi yote mawili. “Nyumba ya Yahwe” huhifadhi usemi wa chanzo, huku tanbihi ikifafanua muktadha.
