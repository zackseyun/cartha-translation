  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: sw
  text: Mzungukeni mfalme pande zote, kila mtu na silaha zake mkononi mwake. Yeyote anayeingia katika safu hizo[a] atauawa. Kaeni pamoja na mfalme anapotoka na anapoingia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya mistari hiyo.” Neno la Kiebrania huenda linamaanisha safu zilizopangwa za walinzi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “katika kutoka kwake na katika kuingia kwake,” msemo unaomaanisha kuandamana naye na kumlinda katika mienendo yake yote.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: Mzungukeni mfalme pande zote
  rationale: Kauli hii inawasilisha amri ya kuunda ulinzi unaomzunguka mfalme, huku “pande zote” ikihifadhi mkazo wa סָבִיב.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: kila mtu akiwa na silaha zake mkononi
  rationale: אִישׁ imetumiwa kwa maana ya ugawaji, yaani kila mlinzi mmoja mmoja; כֵּלָיו katika muktadha huu wa kijeshi inaelekea kumaanisha silaha.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: Yeyote atakayeingia katikati ya safu zenu
  rationale: Kirai elezi chenye kibainishi kina maana ya jumla, “yeyote”; שְּׂדֵרוֹת inaelekea kurejelea safu zilizopangwa za walinzi. Kiwakilishi “zenu” kinafafanua kwa kawaida kwamba ni safu za walinzi, bila kubadili maana ya msingi.
- source_word: יוּמָת
  choice: atauawa
  rationale: Umbo la Hophal linaonyesha kwamba mtu huyo atasababishiwa kifo; “atauawa” ni kauli tendwa ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Kaeni pamoja na mfalme
  rationale: Katika mfululizo huu wa maagizo, kitenzi kina nguvu ya amri, na אֶת pamoja na היה huonyesha kuandamana au kuwa pamoja naye.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: anapotoka na anapoingia
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha jozi ya Kiebrania inayohusu mienendo yote ya mfalme.
