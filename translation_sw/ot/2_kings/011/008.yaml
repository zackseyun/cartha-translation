  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfululizo wa amri katika Kiebrania: kuzunguka mfalme, kila mtu akiwa na silaha, hukumu kwa aingiaye katika safu, na kubaki naye atokapo na aingiapo. Hata hivyo, kiwakilishi “zenu” hakipo katika matini ya Kiebrania na huongeza taarifa isiyosemwa; pia “katikati ya” ni mahususi zaidi kuliko “katika/ndani ya safu.”'
