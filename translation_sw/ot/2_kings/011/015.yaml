  text: וַ/יְצַו֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י ה/מיאות פְּקֻדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הוֹצִ֤יאוּ אֹתָ/הּ֙ אֶל מִ/בֵּ֣ית לַ/שְּׂדֵרֹ֔ת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ הָמֵ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן אַל תּוּמַ֖ת בֵּ֥ית יְהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: sw
  text: Ndipo kuhani Yehoyada akawaamuru makamanda wa mamia, waliowekwa kusimamia jeshi, akawaambia, “Mtoeni nje katikati ya safu[a]; na yeyote atakayemfuata, muueni kwa upanga.” Kwa maana kuhani alikuwa amesema, “Asiuawe ndani ya nyumba ya Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtoeni nje kuelekea kwenye safu” au “mtoeni kutoka ndani ya nyumba kupitia safu.” Kirai cha Kiebrania ni kigumu na huenda kinamaanisha kumtoa kupitia safu zilizopangwa za walinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: makamanda wa vikosi vya askari mia
  rationale: Huwasilisha cheo cha kijeshi kwa lugha ya kawaida bila kutumia neno la Kirumi kama ‘maakida’ au ‘centurioni’; nyongeza ya ‘vikosi vya askari’ hufanya maana ya ‘mia’ ieleweke kwa msomaji wa leo.
- source_word: פְּקֻדֵי הַחַיִל
  choice: waliowekwa juu ya jeshi
  rationale: Huhifadhi wazo la kuteuliwa au kupewa usimamizi lililo katika umbo la kitenzi cha פקד, badala ya kulifanya tu kuwa cheo cha jumla.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: Mtoeni nje
  rationale: Hii ni amri ya kusababisha kutoka, na ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: nje kati ya safu za walinzi[a]
  rationale: Kirai cha Kiebrania ni kigumu. Tafsiri hii inafuata muktadha wa safu zilizopangwa za walinzi huku tanbihi ikihifadhi uwezekano mwingine wa kimuundo na kimaeneo.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: na yeyote atakayemfuata
  rationale: Kishiriki cha umoja chenye kiambishi cha utambulisho kina maana ya jumla. ‘Kumfuata’ huhifadhi uwezekano wa kufuata kwa mwendo au kwa kumuunga mkono.
- source_word: הָמֵת בֶּחָרֶב
  choice: muueni kwa upanga
  rationale: Huwasilisha nguvu ya amri ya kuua kwa upanga kwa Kiswahili cha moja kwa moja na chenye hadhi.
- source_word: אַל תּוּמַת
  choice: Asiuawe
  rationale: Huhifadhi katazo katika kauli ya kutendwa na kumtaja mhusika kwa kiambishi cha nafsi kinachoeleweka kutokana na muktadha.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: ‘Nyumba’ huhifadhi taswira ya Kiebrania, ingawa katika muktadha inamaanisha hekalu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Tetragramatoni limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Maana ya kumfuata Athalia
  choice: yeyote atakayemfuata
  alternative: yeyote atakayemfuata kwa kumuunga mkono
  rationale: Kiebrania hakisemi wazi ikiwa kufuata ni mwendo wa kimwili tu au kuandamana naye kwa uungaji mkono; tafsiri haiongezi ufafanuzi wa kitheolojia au kisiasa usiotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi wenye hadhi lakini unaoeleweka kwa urahisi. ‘Makamanda wa vikosi vya askari mia’ huepuka istilahi ya Kirumi, na ‘nyumba ya Yahweh’ huhifadhi usemi wa chanzo huku muktadha ukionyesha kuwa ni hekalu.
