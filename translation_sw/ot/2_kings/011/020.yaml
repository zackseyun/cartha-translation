  text: וַ/יִּשְׂמַ֥ח כָּל עַם הָ/אָ֖רֶץ וְ/הָ/עִ֣יר שָׁקָ֑טָה וְ/אֶת עֲתַלְיָ֛הוּ הֵמִ֥יתוּ בַ/חֶ֖רֶב בֵּ֥ית מלך־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: sw
  text: Na watu wote wa nchi wakafurahi, na jiji likatulia. Naye Athalia, wakamuua kwa upanga katika nyumba ya mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye nyumba ya mfalme,” yaani, “kwenye ikulu.” Kifungu cha Kiebrania ni kifupi, na kinaweza kueleweka kwa tofauti ndogo kuhusu mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: wakafurahi
  rationale: Kitenzi שׂמח huonyesha furaha; umbo la Kiswahili la wingi linaendana na nomino ya mkusanyiko ‘watu wote’.
- source_word: כָּל עַם הָאָרֶץ
  choice: watu wote wa nchi
  rationale: Tafsiri hii ni ya kawaida na inaeleweka, huku ikihifadhi usemi wa Kiebrania unaoweza kumaanisha watu wa nchi kama kundi la kijamii na kisiasa.
- source_word: וְהָעִיר שָׁקָטָה
  choice: na jiji likatulia
  rationale: שׁקט hapa huonyesha kukoma kwa vurugu na kurejea kwa utulivu; ‘likatulia’ ni ya asili katika simulizi la Kiswahili.
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: Naye Athalia
  rationale: Jina lililotangulizwa kama yambwa lina msisitizo wa mada; ‘Naye Athalia’ huhifadhi badiliko hilo la mkazo kwa Kiswahili cha asili.
- source_word: הֵמִיתוּ
  choice: wakamuua
  rationale: Hiphil ya מות humaanisha kusababisha afe au kumuua. ‘Wakamuua’ ni wazi na ya moja kwa moja bila kuongeza dhana ya hukumu rasmi ambayo maandishi hayasemi wazi.
- source_word: בַחֶרֶב
  choice: kwa upanga
  rationale: Herufi ב inaonyesha chombo kilichotumiwa; ‘kwa upanga’ ni tafsiri ya kawaida ya Kiswahili.
- source_word: בֵּית מלך
  choice: katika nyumba ya mfalme
  rationale: Kifungu hicho kwa halisi ni ‘nyumba ya mfalme.’ ‘Katika’ hutoa mahali kwa njia ya asili bila kuingiza kwa lazima tafsiri pana zaidi ya ‘ikulu.’
