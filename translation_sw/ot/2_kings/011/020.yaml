  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Naye Athalia’ unahifadhi msisitizo wa jina lililotangulizwa katika Kiebrania.
