base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: sw
  text: Basi, makamanda wa vikosi vya askari mia moja wakafanya yote kama Yehoyada kuhani alivyowaamuru. Kila mmoja akawachukua watu wake[a]—wale walioingia zamu siku ya Sabato pamoja na wale waliotoka zamu siku ya Sabato—nao wakaja kwa Yehoyada kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale walioingia siku ya Sabato pamoja na wale waliotoka siku ya Sabato.” Kiebrania kinasema kwa namna hii ya moja kwa moja; muktadha unaelekea kutaja vikundi vilivyoanza na vilivyomaliza zamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: makamanda wa vikosi vya askari mia moja
  rationale: Kirai hiki kinataja maofisa waliokuwa juu ya vikosi vya watu mia moja. Tafsiri hii inaweka wazi muundo wa kijeshi kwa Kiswahili cha sasa.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: yote kama ... alivyowaamuru
  rationale: Muundo huu unaonyesha kwamba walitii amri kikamilifu; Kiswahili hiki ni cha kawaida na kinahifadhi wazo la kufanya kila kilichoamriwa.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: Kila mmoja akawachukua watu wake
  rationale: 'אִישׁ ina nguvu ya mgawanyo hapa: kila kamanda aliwachukua watu waliokuwa chini yake.'
- source_word: בָּאֵי הַשַּׁבָּת
  choice: wale walioingia zamu siku ya Sabato
  rationale: Katika muktadha wa walinzi, kuingia kunaelekea kumaanisha kuanza zamu. Neno 'zamu' linafanya maana ya kimuktadha ieleweke bila kubadili kundi linalotajwa.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: wale waliotoka zamu siku ya Sabato
  rationale: Kirai hiki kinalingana kwa ukinzani na wanaoingia; katika muktadha huu linaelekea kutaja walinzi waliomaliza zamu.
- source_word: וַיָּבֹאוּ אֶל
  choice: nao wakaja kwa
  rationale: Hii ni tafsiri ya kawaida ya kitenzi cha mwendo katika simulizi, ikionyesha walifika mbele ya Yehoyada.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Cheo hiki kinamtambulisha Yehoyada moja kwa moja na kwa lugha ya kawaida ya Biblia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa sasa. 'Makamanda wa vikosi vya askari mia moja' huepuka usemi usio kamili wa 'wakuu wa mia' na kuweka wazi maana ya kijeshi. Alama ya tanbihi [a] imewekwa baada ya 'watu wake' kama katika safu ya ushauri, huku tanbihi ikihifadhi tafsiri halisi zaidi ya jozi ya vitenzi vya kuingia na kutoka.
