  yaml_path: translation/ot/2_kings/011/003.yaml
  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: sw
  text: Naye akawa pamoja naye katika nyumba ya BWANA, akijificha kwa miaka sita, huku Athalia akitawala nchi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יְהוָה
  choice: nyumba ya BWANA
  rationale: Hutafsiri neno la kawaida 'nyumba' kwa maana ya hekalu na kuwakilisha jina la agano יהוה kwa desturi ya Kiswahili ya 'BWANA'.
- source_word: מִתְחַבֵּא
  choice: akijificha
  rationale: Umbo hili ni participle ya hitpael yenye maana ya tendo linaloendelea la kujificha; 'akijificha' hudumisha hali hiyo badala ya kuigeuza kuwa tu 'alifichwa'.
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: akitawala nchi
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya Athalia kuwa akitawala juu ya nchi wakati huo.
theological_decisions:
- issue: Ikiwa Yoashi alijificha mwenyewe au alifichwa na wengine
  choice: akijificha
  alternative: akiwa amefichwa
  rationale: Kiebrania מִתְחַבֵּא ni umbo la kujirejelea linalosema 'akijificha.' Ingawa simulizi linaonyesha wengine walimficha, tafsiri haibadilishi kimya kimya umbo la mstari huu kuwa la kutendwa.
- issue: Uwakilishaji wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: Inafuata desturi pana ya Biblia za Kiswahili ya kuonyesha Tetragramatoni kwa 'BWANA,' bila kuingiza msimamo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na rahisi kueleweka. Muundo 'huku Athalia akitawala nchi' unaonyesha wazi matendo mawili yaliyoendelea kwa wakati mmoja.
