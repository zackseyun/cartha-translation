  to: Lakini Yehosheba, binti wa Mfalme Yoramu na dada ya Ahazia, alimchukua Yoashi mwana wa Ahazia, akamwatorosha kutoka miongoni mwa wana wa mfalme waliokuwa wakiuawa, pamoja na mwanamke aliyekuwa akimnyonyesha, hadi katika chumba cha kulala[a]. Kisha wakamficha[b] asionekane na Athalia, hivyo hakuuawa.
