source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: sw
  text: Lakini Yehosheba, binti wa Mfalme Yoramu na dada ya Ahazia, alimchukua Yoashi mwana wa Ahazia, akamwatorosha kutoka miongoni mwa wana wa mfalme waliokuwa wakiuawa, pamoja na mwanamke aliyekuwa akimnyonyesha, hadi katika chumba cha kulala[a]. Kisha wakamficha[b] asionekane na Athalia, hivyo hakuuawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa ukaribu zaidi: “katika chumba cha vitanda.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kitenzi cha Kiebrania kiko katika wingi: “wakamficha.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: alimchukua
  rationale: Kitenzi לקח katika usimulizi kina maana ya kawaida ya ‘kuchukua’; ‘alimchukua’ ni Kiswahili cha asili kisichoongeza tafsiri ya tendo.
- source_word: יְהוֹשֶׁבַע
  choice: Yehosheba
  rationale: Jina limeandikwa kwa namna inayokaribia umbo la Kiebrania na inayofaa matamshi ya Kiswahili.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: binti wa Mfalme Yoramu
  rationale: Muundo huu unaonyesha wazi kuwa Yehosheba alikuwa binti ya Yoramu, ambaye alikuwa mfalme.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: dada yake Ahazia
  rationale: אחות kwa kawaida humaanisha dada; maana hiyo ya moja kwa moja imehifadhiwa bila kuilegeza kwa sababu ya masuala ya ulinganishaji wa nasaba.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: akamwiba
  rationale: גנב humaanisha ‘kuiba’; hapa neno hilo pia linaonyesha kwamba mtoto aliondolewa kwa siri. Kiswahili ‘akamwiba’ kinahifadhi nguvu hiyo ya neno la asili.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: kutoka miongoni mwa wana wa mfalme
  rationale: Tafsiri hii inahifadhi maana halisi ya ‘wana wa mfalme’ badala ya kutumia ‘wana wa kifalme’ au ‘wakuu,’ ambayo ingeongeza tafsiri.
- source_word: הַמּוּמָתִים
  choice: waliokuwa wakiuawa
  rationale: Hii ni participio ya Hophal inayoonyesha watu waliokuwa wakisababishwa kufa; hali ya kuendelea katika Kiswahili inafaa tukio la mauaji lililokuwa likiendelea.
- source_word: מֵינִקְתּוֹ
  choice: mlezi wake aliyemnyonyesha
  rationale: Nomino hiyo humaanisha mwanamke aliyekuwa akimnyonyesha mtoto na kumtunza. Kauli hii ni wazi kwa msomaji wa sasa kuliko ‘mnyonyeshaji’ peke yake.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: katika chumba cha kulala
  rationale: Kirai hicho ni ‘katika chumba cha vitanda’ kwa ukaribu zaidi; ‘chumba cha kulala’ hutoa maana ya kawaida katika Kiswahili cha sasa, huku umbo halisi likiwekwa katika tanbihi.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: wakamficha
  rationale: Kitenzi cha Kiebrania kiko katika wingi, hivyo wingi umehifadhiwa badala ya kulainishwa kuwa ‘akamficha.’
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: asionwe na Athalia
  rationale: Katika muktadha wa kuficha, kirai ‘kutoka mbele ya Athalia’ kinaelezwa kwa Kiswahili cha asili kuwa kufichwa ili Athalia asimwone.
- source_word: וְלֹא הוּמָת
  choice: hivyo hakuuawa
  rationale: Kauli tendwa ya מות inaonyesha kwamba Yoashi hakusababishwa kufa; ‘hivyo’ huonyesha kwa kawaida matokeo ya kufichwa kwake.
theological_decisions:
- issue: Uhusiano wa kifamilia kati ya Yehosheba na Ahazia
  choice: dada yake Ahazia
  alternative: jamaa yake Ahazia
  rationale: Andiko la Kiebrania linatumia neno la kawaida linalomaanisha ‘dada.’ Tafsiri haipaswi kubadili uhusiano huo ili kuoanisha kimyakimya taarifa nyingine za nasaba.
- issue: Mtendaji wa tendo la kumficha Yoashi
  choice: wakamficha
  alternative: akamficha
  rationale: Kitenzi cha Kimasora ni cha nafsi ya tatu wingi. Wingi umehifadhiwa, ingawa Yehosheba ndiye mhusika mkuu wa sentensi; huenda unamhusisha yeye na mlezi au wasaidizi wengine bila kuwataja kwa uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa usimulizi ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa namna inayokaribia Kiebrania. Sentensi ndefu ya Kiebrania imegawanywa ili kuboresha usomaji bila kubadili mfuatano wa matendo.
