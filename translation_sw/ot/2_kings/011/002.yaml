    issue: Muundo wa ‘Akamweka Yoashi pamoja na mlezi wake’ unaongeza kitendo na kurudia nomino isivyohitajika.
    rationale: Kiebrania humhusisha Yoashi na mwanamke aliyemnyonyesha katika mazingira ya chumba cha vitanda, kisha hutumia kitenzi cha wingi ‘wakamficha.’ Tafsiri iliyorekebishwa huonyesha uhusiano huo kwa ufasaha bila kuifanya ‘akamweka’ ionekane kama taarifa huru ya chanzo.
  - severity: low
    issue: ‘dada yake Ahazia’ ina utata wa kisarufi.
    rationale: ‘Dada ya Ahazia’ ni muundo wa kawaida na wazi zaidi wa kumaanisha ‘sister of Ahaziah.’
