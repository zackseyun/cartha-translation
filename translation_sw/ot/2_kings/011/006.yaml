  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: sw
  text: na theluthi moja iwe kwenye Lango la Suri, na theluthi moja kwenye lango lililo nyuma ya wakimbiaji[a]. Nanyi mtashika zamu ya kulinda nyumba ili kuzuia kuingia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walinzi” au “walinzi wa mfalme”; Kiebrania kihalisi ni “wakimbiaji.”
    reason: lexical_alternative
  - marker: b
    text: Maana ya neno la Kiebrania hapa si hakika; huenda likamaanisha “kama kizuizi,” “kwa ajili ya ulinzi,” au “kuzuia kuingia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: na theluthi moja
  rationale: Nomino ya mpangilio yenye kibainishi inatumika hapa kwa maana ya sehemu moja kati ya sehemu tatu; “theluthi moja” ni Kiswahili cha kawaida na sahihi.
- source_word: בְּשַׁעַר סוּר
  choice: kwenye Lango la Suri
  rationale: שַׁעַר ni “lango,” na סוּר imechukuliwa kuwa jina la mahali; limetoholewa kuwa “Suri” kwa matamshi ya kawaida ya Kiswahili.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: kwenye lango lililo nyuma ya wakimbiaji
  rationale: אַחַר hapa kwa kawaida ni “nyuma ya.” Tafsiri hii inadumisha uhusiano wa mahali bila kuamua zaidi kuhusu mpangilio wa majengo.
- source_word: הָרָצִים
  choice: wakimbiaji
  rationale: Neno hili kihalisi humaanisha “wakimbiaji,” ingawa katika mazingira ya kifalme linaweza kutaja walinzi au walinzi wa mfalme; maana hiyo ya kiutendaji imewekwa katika tanbihi.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: Nanyi mtailinda
  rationale: Kitenzi na nomino yenye mzizi mmoja vinasisitiza wajibu wa kulinda. Kiswahili cha asili hakihitaji kurudia “linda ulinzi,” hivyo wazo limetolewa kwa “mtailinda.”
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Maana ya msingi ni “nyumba.” Ingawa muktadha unaweza kuelekeza kwenye jumba la kifalme au hekalu, tafsiri haibainishi jambo ambalo neno lenyewe halibainishi.
- source_word: מַסָּח
  choice: ili kuzuia watu kuingia
  rationale: Hili ni neno adimu na lenye maana isiyo hakika. Katika muktadha linaonekana kueleza kusudi la ulinzi—kuzuia kuingia—na tafsiri hii ni wazi na ya kawaida kwa Kiswahili; kutokuwa na uhakika kumehifadhiwa katika tanbihi.
