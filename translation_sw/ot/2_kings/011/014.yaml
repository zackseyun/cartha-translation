  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עֹמֵ֨ד עַֽל הָ/עַמּ֜וּד כַּ/מִּשְׁפָּ֗ט וְ/הַ/שָּׂרִ֤ים וְ/הַ/חֲצֹֽצְרוֹת֙ אֶל הַ/מֶּ֔לֶךְ וְ/כָל עַ֤ם הָ/אָ֨רֶץ֙ שָׂמֵ֔חַ וְ/תֹקֵ֖עַ בַּ/חֲצֹֽצְר֑וֹת וַ/תִּקְרַ֤ע עֲתַלְיָה֙ אֶת בְּגָדֶ֔י/הָ וַ/תִּקְרָ֖א קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: sw
  text: Akatizama, na tazama, mfalme alikuwa amesimama karibu na nguzo[a], kama ilivyokuwa desturi. Maofisa na tarumbeta walikuwa kando ya mfalme, nao watu wote wa nchi walikuwa wakifurahi na kupiga tarumbeta. Ndipo Athalia akararua mavazi yake na kupaza sauti, “Njama! Njama!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye nguzo.” Kihusishi cha Kiebrania hapa kinaweza kueleweka kwa namna zaidi ya moja kuhusu mahali.
    reason: lexical_alternative
  - marker: b
    text: Au, “Uhaini! Uhaini!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Akatizama, na tazama
  rationale: Muundo huu unahifadhi mfuatano wa simulizi na nguvu ya ghafla ya הִנֵּה, huku ukisomeka kwa Kiswahili cha sasa.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: mfalme alikuwa amesimama
  rationale: Hali ya kuendelea inayoonyeshwa na kirai cha Kiebrania inaelezwa kwa kawaida kwa 'alikuwa amesimama'.
- source_word: עַל הָעַמּוּד
  choice: karibu na nguzo
  rationale: עַל hapa yaelekea kuonyesha mahali panapohusiana na nguzo ya sherehe, si lazima juu yake; tanbihi inadumisha uwezekano mwingine wa kimahali.
- source_word: כַּמִּשְׁפָּט
  choice: kama ilivyokuwa desturi
  rationale: מִשְׁפָּט hapa inaelekea kumaanisha utaratibu wa kifalme uliozoeleka, wala si hukumu ya kisheria.
- source_word: וְהַשָּׂרִים
  choice: Maofisa
  rationale: שָׂרִים ni viongozi au wakuu; 'maofisa' inafaa muktadha wa kifalme na kijeshi bila kubainisha cheo kupita ushahidi.
- source_word: וְהַחֲצֹצְרוֹת
  choice: tarumbeta
  rationale: Kiebrania kinataja vyombo vyenyewe, si wapiga tarumbeta; tafsiri inadumisha metonimia hiyo badala ya kubadili rejeo kuwa watu.
- source_word: אֶל הַמֶּלֶךְ
  choice: kando ya mfalme
  rationale: Katika muktadha huu אֶל inaonyesha ukaribu au kuwa mbele ya mfalme katika sherehe.
- source_word: כָל עַם הָאָרֶץ
  choice: watu wote wa nchi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa Kiebrania unaowarejelea watu wa nchi.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: walikuwa wakifurahi na kupiga tarumbeta
  rationale: Kauli hii huwasilisha furaha inayoendelea pamoja na tendo la kupuliza au kupiga tarumbeta katika sherehe.
- source_word: וַתִּקְרַע עֲתַלְיָה אֶת בְּגָדֶיהָ
  choice: Athalia akararua mavazi yake
  rationale: Tafsiri hii inadumisha ishara ya wazi ya mshtuko na maombolezo kwa lugha yenye hadhi na inayoeleweka.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Njama! Njama!
  rationale: קֶשֶׁר humaanisha njama au uasi wa kisiasa; kurudia kunahifadhi mlio wa taharuki wa kilio chake.
