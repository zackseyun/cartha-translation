base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: sw
  text: Ndipo kuhani akawapa makamanda wa vikosi vya askari mia moja mikuki[a] na ngao za Mfalme Daudi, zilizokuwa katika nyumba ya Yahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mkuki”; umoja huo unaweza kuwa na maana ya mkusanyiko, yaani “mikuki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika hekalu la Yahwe.” Maana halisi ni “katika nyumba ya Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ndipo ... akawapa
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “ndipo” na umbo la kitenzi “aka-” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya umoja yenye kibainishi; muktadha unamtambulisha kuhani huyo.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: makamanda wa vikosi vya askari mia moja
  rationale: Kirai hiki kinamaanisha viongozi wa kijeshi wa vitengo vya watu mia moja. Tafsiri hii ni wazi kwa msomaji wa sasa kuliko “wakuu wa mamia,” huku ikihifadhi muundo wa kijeshi.
- source_word: הַחֲנִית
  choice: mikuki
  rationale: Ingawa neno la Kiebrania liko katika umoja, linaweza kutumiwa kwa maana ya mkusanyiko. Muktadha wa kugawa silaha kwa makamanda kadhaa na kutajwa kwa ngao katika wingi unaunga mkono wingi wa Kiswahili.
- source_word: הַשְּׁלָטִים
  choice: ngao
  rationale: Katika muktadha wa vifaa vya silaha vya kifalme vilivyohifadhiwa hekaluni, maana inayoungwa mkono zaidi ni ngao au vifaa vya kujikinga.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: zilizokuwa za Mfalme Daudi
  rationale: Kirai husika kinaonyesha umiliki. Kiswahili hiki ni cha kawaida na hakiongezi dai lisilokuwapo katika chanzo.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: Huhifadhi sitiari ya moja kwa moja ya Kiebrania, “nyumba ya Yahwe”; katika muktadha huo inarejelea hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa herufi YHWH limetolewa kama jina maalumu badala ya cheo; “Yahwe” ni umbo la kawaida la Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni yenyewe. “Yahwe” huhifadhi jina maalumu bila kulibadili kuwa cheo, huku likitumia tahajia inayosomeka kwa kawaida katika Kiswahili.
- issue: Umoja au maana ya mkusanyiko katika הַחֲנִית
  choice: mikuki
  alternative: mkuki
  rationale: Umbo la chanzo ni la umoja, lakini linaweza kuwa umoja wa mkusanyiko. Kugawiwa kwa makamanda wengi na kuunganishwa kwake na “ngao” za wingi kunafanya “mikuki” iwe maana inayowezekana zaidi, huku tanbihi ikihifadhi umbo halisi la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Makamanda wa vikosi vya askari mia moja” hufafanua cheo cha kijeshi bila kutumia usemi mgumu wa neno kwa neno. Muundo wa “nyumba ya Yahwe” umehifadhiwa katika maandishi, na “hekalu” limewekwa kama ufafanuzi wa tanbihi.
