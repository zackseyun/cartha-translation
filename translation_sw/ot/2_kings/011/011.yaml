base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: sw
  text: Walinzi[a] wakasimama, kila mmoja akiwa na silaha zake mkononi, kuanzia upande wa kulia wa nyumba hadi upande wa kushoto wa nyumba[b], kando ya madhabahu na kando ya nyumba[c], wakimzunguka mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakimbiaji,” yaani walinzi wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kuanzia upande wa kulia wa nyumba hadi upande wa kushoto wa nyumba.” Kwa kuzingatia uelekeo wa hekalu, hii inaweza pia kueleweka kuwa “kuanzia upande wa kusini ... hadi upande wa kaskazini.”'
    reason: alternative_reading
  - marker: c
    text: “Nyumba” hapa ni jengo au eneo la hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: walinzi
  rationale: Neno hili linatokana na kitenzi ‘kukimbia’ na kwa maana halisi linaweza kumaanisha ‘wakimbiaji,’ lakini katika muktadha huu wa kifalme linataja kikosi cha walinzi wenye silaha. ‘Walinzi’ hutoa maana ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: kila mmoja akiwa na silaha zake mkononi
  rationale: אִישׁ limetumiwa kwa maana ya mgawanyo, ‘kila mmoja.’ כְּלִי linaweza kumaanisha kifaa au chombo, lakini katika muktadha wa walinzi wenye silaha maana inayofaa ni ‘silaha.’ ‘Mkononi’ huhifadhi taswira ya utayari wao.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: kuanzia upande ... hadi upande
  rationale: כֶּתֶף kwa msingi ni ‘bega,’ lakini linapotumiwa kueleza jengo humaanisha ubavu au upande wake. ‘Upande’ ni sawa ya asili na iliyo wazi katika Kiswahili.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Kiebrania kinasema moja kwa moja ‘nyumba.’ Muktadha unaonyesha kuwa ni nyumba ya Mungu, yaani hekalu, lakini neno la chanzo limehifadhiwa katika matini na kufafanuliwa katika tanbihi.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: kulia ... kushoto
  rationale: Maneno haya humaanisha moja kwa moja kulia na kushoto. Ingawa katika maelezo ya uelekeo yanaweza kueleweka kama kusini na kaskazini, matini kuu huhifadhi maana yake ya moja kwa moja.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: karibu na madhabahu na nyumba
  rationale: Kiambishi ל katika maelezo haya mafupi ya mahali kinaweza kuonyesha mahali au mwelekeo. ‘Karibu na’ huwasilisha uwepo wao kandokando bila kuamua kwa ukali kama walielekea huko au waligusa maeneo hayo.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: wakimzunguka mfalme
  rationale: Kirai hiki kinaonyesha kuwa walinzi walikuwa pande zote za mfalme kwa ulinzi. ‘Wakimzunguka mfalme’ ni Kiswahili cha asili kinachohifadhi picha hiyo.
