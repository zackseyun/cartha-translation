translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umefanywa kuwa wa asili kwa kutumia ‘kila mmoja akiwa’ na ‘wakimzunguka,’ huku mpangilio wa maeneo na utata halisi wa maneno ya Kiebrania ukihifadhiwa katika matini na tanbihi.
