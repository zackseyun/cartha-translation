id: 2KI.11.19
reference: 2 Kings 11:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: sw
  text: Kisha akawachukua makamanda wa mamia, Wakari[a], wakimbiaji[b], na watu wote wa nchi. Nao wakamteremsha mfalme kutoka katika nyumba ya Yahweh, wakapitia lango la wakimbiaji hadi nyumba ya mfalme; naye akaketi juu ya kiti cha enzi cha wafalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wakerethi” au “walinzi.” Maana ya neno la Kiebrania si hakika.
    reason: alternative_reading
  - marker: b
    text: “Wakimbiaji” huenda walikuwa walinzi wa mfalme au wajumbe wake; neno hilo linatumika pia katika usemi “lango la wakimbiaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha akawachukua
  rationale: Kitenzi cha umoja kinamrejelea Yehoyada; ‘akawachukua’ kinadumisha maana ya kuwachukua pamoja naye bila kuifanya wazi kupita chanzo.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: makamanda wa mamia
  rationale: Hii inadumisha muundo wa kijeshi wa Kiebrania bila kuingiza cheo mahususi cha Kirumi.
- source_word: הַכָּרִי
  choice: Wakari[a]
  rationale: Neno hilo halina uhakika. Uhamishaji wa jina unadumisha hali hiyo badala ya kulifafanua moja kwa moja kuwa walinzi.
- source_word: הָרָצִים
  choice: wakimbiaji[b]
  rationale: Maana halisi ni ‘wakimbiaji,’ ingawa katika mazingira ya kifalme huenda walikuwa walinzi au wajumbe wa mfalme.
- source_word: כָּל עַם הָאָרֶץ
  choice: watu wote wa nchi
  rationale: Usemi huu wa kawaida unadumishwa bila kuamua kama unamaanisha raia wote au kundi maalumu la watu wa Yuda.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: Nao wakamteremsha mfalme
  rationale: Kitenzi cha wingi kinaonyesha kuwa kundi lililokusanywa ndilo lililomteremsha mfalme kutoka eneo la hekalu.
- source_word: מִבֵּית יְהוָה
  choice: kutoka katika nyumba ya Yahweh
  rationale: ‘Nyumba’ inadumisha ulinganifu wa chanzo na nyumba ya mfalme, huku jina la agano יְהוָה likitafsiriwa Yahweh.
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: wakapitia lango la wakimbiaji
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inadumisha taswira halisi ya neno la Kiebrania.
- source_word: בֵּית הַמֶּלֶךְ
  choice: hadi nyumba ya mfalme
  rationale: ‘Nyumba ya mfalme’ inadumisha ulinganifu wa kifasihi na ‘nyumba ya Yahweh’; katika muktadha ni ikulu.
- source_word: וַיֵּשֶׁב
  choice: naye akaketi
  rationale: Kitenzi cha umoja kinamrejelea mfalme na kinawasilisha tendo la kukalia kiti cha enzi moja kwa moja.
- source_word: עַל כִּסֵּא הַמְּלָכִים
  choice: juu ya kiti cha enzi cha wafalme
  rationale: Wingi ‘wafalme’ unadumishwa, ukiacha wazi maana ya kiti cha enzi cha kifalme au cha nasaba ya wafalme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania linahamishwa kama Yahweh badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahweh’ inadumisha jina binafsi la agano.
- issue: Maana ya כִּסֵּא הַמְּלָכִים
  choice: kiti cha enzi cha wafalme
  alternative: kiti cha enzi cha kifalme
  rationale: Wingi wa Kiebrania unadumishwa ili kutofuta dokezo la mwendelezo wa nasaba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umewekwa wa asili kwa Kiswahili huku ukidumisha marudio ya ‘nyumba,’ wingi wa ‘wafalme,’ na kutokuwa na uhakika kwa majina ya vikundi vya kifalme.
