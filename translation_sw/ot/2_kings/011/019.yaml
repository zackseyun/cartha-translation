  source_fidelity: 'Tafsiri inafuata kwa usahihi muundo wa Kiebrania: Yehoyada ndiye mtenda wa kitenzi cha umoja mwanzoni, kisha makundi yaliyotajwa ndiyo yanayomteremsha na kumpeleka mfalme. Mwelekeo kutoka nyumba ya Yahweh, kupitia lango la wakimbiaji, hadi nyumba ya mfalme umehifadhiwa. Wingi katika “kiti cha enzi cha wafalme” pia unalingana na כִּסֵּא הַמְּלָכִים.'
