  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: sw
  text: Na makundi mawili miongoni mwenu, yaani wote wanaomaliza zamu siku ya Sabato[a][b], watalinda nyumba ya Yahwe kwa ajili ya mfalme.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, neno kwa neno, “mikono miwili miongoni mwenu”; hapa huenda maana yake ni “makundi mawili” au “vikosi viwili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wote wanaotoka siku ya Sabato.” Katika muktadha, inaelekea kuwa ni wale wanaomaliza zamu wakati zamu zinapobadilishwa siku ya Sabato.
    reason: alternative_reading
  - marker: c
    text: Au, “watashika ulinzi wa nyumba ya Yahwe kumwelekea mfalme.” Kihusishi cha Kiebrania kina utata; katika muktadha, maana inayowezekana ni kulinda nyumba ya Yahwe kwa kusudi la kumlinda mfalme.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת
  choice: yale makundi mawili
  rationale: Neno kwa neno ni “mikono miwili,” lakini katika muktadha huu wa upangaji wa walinzi linamaanisha sehemu au makundi mawili. “Makundi mawili” ni wazi na ya kawaida kwa Kiswahili.
- source_word: בָּכֶם
  choice: kati yenu
  rationale: Kihusishi kinaonyesha kuwa makundi hayo yanatokana na watu wanaosemeshwa; “kati yenu” ni usemi wa asili wa Kiswahili.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: wote wanaomaliza zamu siku ya Sabato
  rationale: Kimsingi ni “wote wanaotoka siku ya Sabato.” Mistari inayozunguka inaonyesha mabadiliko ya zamu, hivyo “wanaomaliza zamu” huwasilisha maana ya kimuktadha bila kuficha tafsiri halisi, ambayo imeonyeshwa katika tanbihi.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: watalinda
  rationale: Muundo wa kitenzi na nomino zinazotokana na mzizi mmoja unamaanisha kutekeleza wajibu wa ulinzi. Kiswahili “watalinda” huepuka urudiaji usio wa kawaida huku kikidumisha nguvu ya agizo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” hudumisha picha halisi ya Kiebrania kuliko “hekalu,” na bado inaeleweka katika muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja badala ya kubadilishwa kuwa cheo. “Yahwe” ni umbo linalofaa tahajia ya Kiswahili.
- source_word: אֶל הַמֶּלֶךְ
  choice: kwa ajili ya mfalme
  rationale: Kihusishi אֶל hapa kina utata. Katika muktadha, ulinzi wa nyumba ya Yahwe unafanywa kwa manufaa na usalama wa mfalme; tafsiri hii ni ya kawaida kwa Kiswahili huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano יְהוָה. Kulitaja “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Uhusiano wa ulinzi wa nyumba ya Yahwe na mfalme
  choice: kwa ajili ya mfalme
  alternative: kuelekea kwa mfalme; karibu na mfalme
  rationale: אֶל linaweza kuonyesha mwelekeo au uhusiano. Muktadha unaunga mkono kusudi la kumlinda mfalme, lakini utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Dashi ndefu na “yaani” zinaonyesha kwamba wale wanaomaliza zamu ndio makundi mawili yanayotajwa. Jina “Yahwe” limetumiwa kwa tahajia inayolingana na Kiswahili.
