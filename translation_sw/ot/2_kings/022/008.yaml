base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: sw
  text: Ndipo Hilkia, kuhani mkuu, akamwambia Shafani mwandishi, “Nimekipata Kitabu cha Torati[a] katika nyumba ya Yahwe[b].” Hilkia akampa Shafani kitabu hicho, naye akakisoma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Gombo la Torati.” Neno la Kiebrania linaweza kumaanisha gombo au hati ya maandishi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, katika hekalu la Yahwe.
    reason: cultural_note
  - marker: c
    text: Au, ingawa si tafsiri inayoelekea zaidi, “akasoma kutoka humo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw ya masimulizi inaendeleza mfuatano wa matukio; “ndipo” na umbo la “aka-” huleta mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: kuhani mkuu
  rationale: Hili ndilo jina la kawaida la cheo cha mkuu wa ukuhani, na linaeleweka wazi katika Kiswahili cha sasa.
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: Neno hili linadumisha maana ya afisa aliyekuwa na kazi ya kuandika katika utawala wa kifalme bila kulibana kuwa “katibu” pekee.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Kitabu cha Torati
  rationale: “Torati” ni istilahi ya Kiswahili inayotambulika kwa תּוֹרָה katika muktadha huu wa maandishi ya agano na sheria; “kitabu” huwakilisha hati ambayo huenda ilikuwa gombo.
- source_word: מָצָאתִי
  choice: Nimekipata
  rationale: Wakati timilifu wa Kiswahili unaonyesha ugunduzi uliotokea na ambao matokeo yake ni muhimu sasa.
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: “Nyumba” inadumisha picha ya moja kwa moja ya Kiebrania, huku katika muktadha ikimaanisha hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר
  choice: akampa ... kitabu hicho
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya tendo la Hilkia kumpa Shafani hati iliyotajwa.
- source_word: וַיִּקְרָאֵהוּ
  choice: naye akakisoma
  rationale: Kiambishi cha yambwa kinaunga mkono maana ya “alikisoma”; Shafani ndiye mtendaji anayeelekea zaidi kwa kuwa ndiye aliyetoka kupewa kitabu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kwa umbo linalolingana na tahajia na matamshi ya Kiswahili.
- issue: Utambulisho wa סֵפֶר הַתּוֹרָה
  choice: Kitabu cha Torati
  alternative: gombo la sheria/mafundisho
  rationale: “Kitabu cha Torati” kinawasilisha hadhi ya maandishi hayo katika muktadha bila kudai kwa undani zaidi yaliyomo au ukubwa wake; uwezekano wa “gombo” umehifadhiwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Hilkia, Shafani, na Yahwe. Viambishi vya ngeli katika “nimekipata,” “kitabu hicho,” na “akakisoma” vinaweka marejeo wazi bila kufanya sentensi kuwa nzito.'
