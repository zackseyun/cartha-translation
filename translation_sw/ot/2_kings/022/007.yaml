  text: אַ֚ךְ לֹא יֵחָשֵׁ֣ב אִתָּ֔/ם הַ/כֶּ֖סֶף הַ/נִּתָּ֣ן עַל יָדָ֑/ם כִּ֥י בֶ/אֱמוּנָ֖ה הֵ֥ם עֹשִֽׂים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: sw
  text: Lakini hawatatakiwa kutoa hesabu ya fedha[a] wanazokabidhiwa,[b] kwa sababu wanafanya kazi kwa uaminifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pesa.” Neno la Kiebrania linalomaanisha kihalisi “fedha” (metali) hutumiwa mara nyingi kumaanisha pesa katika masuala ya kifedha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweza kutafsiriwa kwa karibu zaidi, “fedha wanazokabidhiwa hazitahesabiwa pamoja nao”; maana yake ni kwamba wale waliokuwa wakisimamia fedha hawakudaiwa kutoa hesabu yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini
  rationale: Neno hili linaweka tofauti au sharti la pekee dhidi ya maagizo yaliyotangulia; “Lakini” ni la kawaida na linaonyesha vizuri nguvu hiyo.
- source_word: יֵחָשֵׁב אִתָּם
  choice: hawatatakiwa kutoa hesabu
  rationale: Katika muktadha huu wa fedha, kauli hiyo inaonyesha kwamba watu waliokabidhiwa fedha hawakudaiwa kutoa hesabu yake. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: “Fedha” kwa Kiswahili inaweza kumaanisha pesa na pia metali ya fedha, hivyo inafaa vizuri kwa כֶּסֶף katika muktadha wa kifedha huku ikihifadhi mwangwi wa maana halisi.
- source_word: הַנִּתָּן עַל יָדָם
  choice: wanazokabidhiwa
  rationale: Hii inaeleza kwa Kiswahili cha kawaida fedha zilizowekwa mikononi mwao, yaani walizoaminiwa kuzisimamia.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya kutodai hesabu kutoka kwao.
- source_word: בֶאֱמוּנָה
  choice: kwa uaminifu
  rationale: Hapa אֱמוּנָה linahusu kutegemeka na uadilifu katika utendaji, si imani ya kimafundisho.
- source_word: הֵם עֹשִׂים
  choice: wanafanya kazi
  rationale: Katika muktadha, “wanafanya” linahusu utendaji wao katika kazi na usimamizi wa fedha; “wanafanya kazi” ni wazi na ya asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli “kutoa hesabu” ni ya kawaida katika muktadha wa uwajibikaji wa fedha. Muundo umechagua uwazi wa kimuktadha, huku tanbihi ikihifadhi usemi wa Kiebrania ulio wa karibu zaidi na uwezekano wake wa kimaana.
