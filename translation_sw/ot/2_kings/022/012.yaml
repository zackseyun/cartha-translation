  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֣ה הַ/כֹּהֵ֡ן וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַכְבּ֨וֹר בֶּן מִיכָיָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סֹּפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: sw
  text: Kisha mfalme akawaamuru Hilkia kuhani[a], Ahikamu mwana wa Shafani, Akbori mwana wa Mikaya, Shafani mwandishi[b], na Asaya mtumishi wa mfalme[c], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “Hilkia kuhani,” si kwa wazi “kuhani mkuu.”
    reason: lexical_alternative
  - marker: b
    text: Au “Shafani katibu.” Neno la Kiebrania linaweza kumaanisha mwandishi au katibu wa utawala wa kifalme.
    reason: lexical_alternative
  - marker: c
    text: Au “Asaya afisa wa mfalme.” Kiebrania kinasema kihalisi “mtumishi,” neno ambalo katika ikulu linaweza kumaanisha afisa aliye katika huduma ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kinaonyesha amri yenye mamlaka; umbo la masimulizi linawasilishwa kwa “akawaamuru,” likiwaelekezea watu waliotajwa.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye kibainishi imetafsiriwa kwa njia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: Hilkia kuhani
  rationale: Kiebrania kinasema “kuhani,” si kwa wazi “kuhani mkuu”; cheo cha juu hakijaongezwa.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikamu mwana wa Shafani
  rationale: “Mwana wa” ni namna ya kawaida ya Kiswahili ya kutafsiri utambulisho wa ukoo kwa בֶּן.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: Akibori mwana wa Mikaya
  rationale: Majina yamenukuliwa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili, huku utambulisho wa ukoo ukihifadhiwa.
- source_word: שָׁפָן הַסֹּפֵר
  choice: Shafani mwandishi
  rationale: סֹפֵר inaweza kumaanisha mwandishi au katibu wa utawala; “mwandishi” huhifadhi maana ya msingi bila kuficha uwezekano wa jukumu la kifalme.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaya mtumishi wa mfalme
  rationale: עֶבֶד maana yake ya moja kwa moja ni “mtumishi”; katika ikulu inaweza pia kumaanisha afisa aliye katika huduma ya mfalme.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Umbo hili linatanguliza maneno ya amri yanayofuata katika mstari unaofuata; “akisema” huhifadhi kiungo hicho cha mbele.
theological_decisions:
- issue: Cheo cha Hilkia
  choice: kuhani
  alternative: kuhani mkuu
  rationale: Mstari huu una הַכֹּהֵן, “kuhani,” bila neno linalosema wazi “mkuu”; tafsiri haiongezi cheo kutokana na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa sasa. Mpangilio wa orodha na kiungo cha maneno yanayofuata umehifadhiwa. Alama zote za tanbihi zimewekwa mara tu baada ya maneno husika.
