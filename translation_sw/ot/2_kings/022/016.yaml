  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: sw
  text: 'Yahwe asema hivi: “Tazama, ninaleta maafa[a] juu ya mahali hapa na juu ya wakazi wake, yaani, maneno yote ya kitabu ambacho mfalme wa Yuda amekisoma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msiba.” Neno la Kiebrania רָעָה hapa linamaanisha maafa ya hukumu, si ubaya wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahwe asema hivi
  rationale: Huhifadhi fomula rasmi ya ujumbe wa kinabii kwa Kiswahili cha kawaida na chenye hadhi, huku jina la agano יְהוָה likitolewa kama “Yahwe.”
- source_word: הִנְנִי
  choice: Tazama
  rationale: Ni alama ya kuvuta uangalifu kwa tangazo zito na la karibu; “Tazama” hudumisha sajili ya kinabii bila kuongeza maelezo.
- source_word: מֵבִיא
  choice: ninaleta
  rationale: Umbo la participle linaonyesha tendo lililo karibu au linaloendelea; wakati wa sasa wa Kiswahili unahifadhi nguvu hiyo kuliko “nitaleta” pekee.
- source_word: רָעָה
  choice: maafa
  rationale: Katika muktadha huu neno linamaanisha msiba wa hukumu, si ubaya wa kimaadili. “Maafa” ni la wazi na la kawaida katika Kiswahili cha kisasa.
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: juu ya mahali hapa na juu ya wakazi wake
  rationale: Hutoa kwa uwazi mwelekeo wa hukumu dhidi ya mahali na watu wake, huku “wakazi” likiwakilisha kwa kawaida wale wanaokaa humo.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: yaani, maneno yote ya kitabu
  rationale: “Maneno yote” hufuata kwa karibu lugha ya chanzo. “Yaani” huonyesha uhusiano wa ufafanuzi kati ya maafa na maneno ya kitabu bila kubadili maneno hayo kuwa tu “yaliyoandikwa” au kuongeza “kulingana na.”
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: ambacho mfalme wa Yuda amekisoma
  rationale: Huhifadhi kishazi husishi kinachoeleza kitabu na tendo la karibuni lenye umuhimu wa sasa; chanzo hakilazimishi kuongeza “kwa sauti.”
theological_decisions:
- issue: Maana ya רָעָה katika tangazo la hukumu ya Mungu
  choice: maafa
  alternative: ubaya; msiba
  rationale: Muktadha ni hukumu ya agano juu ya mahali na wakazi wake. “Maafa” huwasilisha janga la hukumu bila kudokeza kwamba Yahwe anatenda ubaya wa kimaadili.
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahwe” hulihifadhi kama jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa “maafa” na “maneno yote ya kitabu”
  choice: Uhusiano wa ufafanuzi umehifadhiwa kwa “yaani”
  alternative: maafa yote yaliyotamkwa katika kitabu; kulingana na maneno yote ya kitabu
  rationale: Muundo wa Kiebrania unaweka “maneno yote ya kitabu” baada ya tangazo la maafa kwa namna ya ufafanuzi/apposition. Tafsiri haiongezi wazi wazo la “kulingana na,” wala haibadili “maneno” kuwa “maafa,” hivyo inadumisha mkazo na mvutano wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Fomula “Yahwe asema hivi” na neno “Tazama” hudumisha uzito wa kinabii; sentensi nyingine imewekwa wazi kwa msomaji wa kawaida bila kufuta muundo usio wa kawaida wa kishazi cha mwisho.
