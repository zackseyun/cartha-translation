  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: sw
  text: 'Lakini kwa mfalme wa Yuda, aliyewatuma kumwuliza Yahweh, mtamwambia hivi: “Yahweh, Mungu wa Israeli, asema hivi: Kuhusu maneno uliyoyasikia—[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kishazi hiki cha Kiebrania kinaachwa bila kukamilika hapa, na kinakamilishwa katika mstari unaofuata.
    reason: Muundo wa kisintaksia unaoning’inia unaweza kuonekana kama sentensi iliyokatika; tanbihi inaeleza mwendelezo wake bila kuubadili katika matini.
lexical_decisions:
- source_word: וְאֶל
  choice: Lakini kuhusu
  rationale: Kiunganishi pamoja na kihusishi kinaonyesha uhamisho wa mazungumzo wenye utofautishaji kuelekea kwa mfalme; ‘Lakini kuhusu’ ni ya asili katika Kiswahili na hudumisha kazi hiyo ya kiusemi.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Huu ni uwasilishaji wa kawaida na wazi wa muundo tegemezi wa Kiebrania.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: aliyewatuma ninyi
  rationale: Partisipio linamtambulisha mfalme kwa tendo lake. Kiwakilishi ‘ninyi’ kinaonyesha wazi wingi wa אֶתְכֶם bila kulazimisha msisitizo usio wa lazima.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: kumwuliza Yahweh
  rationale: Katika muktadha huu, דרשׁ humaanisha kutafuta jibu au mwongozo wa Mungu kwa njia ya nabii; ‘kumwuliza’ ni Kiswahili cha kawaida na sahihi kwa mashauriano hayo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linatolewa kama jina binafsi ‘Yahweh,’ si kubadilishwa na cheo.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: mtamwambia hivi
  rationale: Hii huwasilisha kwa kawaida agizo la wingi na fomula ya kuanzisha ujumbe.
- source_word: כֹּה אָמַר
  choice: anasema hivi
  rationale: Ni uwasilishaji wa kawaida wa fomula ya mjumbe wa kinabii, huku wakati wa sasa ukionyesha ujumbe anaoutoa Mungu sasa.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi tegemezi, ikihifadhi utambulisho wa agano.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Kuhusu maneno uliyoyasikia—
  rationale: ‘Kuhusu’ huhifadhi mada iliyoachwa ikining’inia kisintaksia na inayokamilishwa katika mstari unaofuata; kistari kirefu huashiria mwendelezo huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha na cheo, bila kuingiza msimamo wa dhehebu.
- issue: Kishazi cha mwisho kisichokamilika
  choice: Kuhifadhi muundo unaoning’inia kwa ‘Kuhusu ...—’
  alternative: Kukamilisha maana kwa kuingiza yaliyomo katika mstari wa 19
  rationale: Kiebrania kinaanzisha mada ambayo inakamilishwa katika mstari unaofuata. Kuiacha wazi hudumisha mvutano na muundo halisi wa maandishi bila kuingiza maneno kutoka mstari mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kumwuliza Yahweh’ ni wazi kwa wasomaji wa kawaida katika muktadha wa kutafuta mwongozo wa Mungu. Fomula ‘anasema hivi’ ina uzito wa kinabii bila kuwa ya kizamani. Alama [a] imewekwa baada ya kishazi kinachoelezwa.
