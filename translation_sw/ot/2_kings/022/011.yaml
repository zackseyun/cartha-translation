base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: sw
  text: Mfalme aliposikia maneno ya Kitabu cha Sheria[a], akararua mavazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Gombo la Sheria.” Neno la Kiebrania סֵפֶר linaweza kumaanisha gombo, kitabu, au hati iliyoandikwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo wa וַיְהִי pamoja na כ na kitenzi-jina unaendeleza simulizi na kuonyesha wakati. Kiswahili cha ‘aliposikia’ huwasilisha uhusiano huo kwa kawaida bila kuongeza maneno yasiyo ya lazima.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye hali ya uainisho imetafsiriwa moja kwa moja; katika Kiswahili ‘Mfalme’ inamtaja mfalme ambaye tayari anajulikana katika muktadha.
- source_word: דִּבְרֵי
  choice: maneno ya
  rationale: דבר katika hali ya kutegemeana hapa inarejelea maneno au yaliyomo yaliyosomwa kutoka hati hiyo. ‘Maneno ya’ huhifadhi uhusiano rasmi wa Kiebrania na ni ya kawaida katika Kiswahili.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Kitabu cha Sheria
  rationale: סֵפֶר inaweza kumaanisha kitabu, hati, au gombo. ‘Kitabu cha Sheria’ ni wazi na kinafaa katika muktadha huu wa maandiko ya sheria ya agano; uwezekano wa ‘gombo’ umehifadhiwa katika tanbihi.
- source_word: וַיִּקְרַע
  choice: akararua
  rationale: קרע humaanisha kurarua. Umbo la ‘akararua’ linaendeleza mfuatano wa simulizi na kueleza tendo la huzuni na mshtuko kwa lugha ya kawaida yenye heshima.
- source_word: בְּגָדָיו
  choice: mavazi yake
  rationale: בגד ni vazi au nguo. ‘Mavazi yake’ ni tafsiri ya asili, yenye heshima, na inahifadhi wingi pamoja na umilikaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi huhifadhi kasi ya simulizi; ‘akararua mavazi yake’ hudumisha taswira ya kitamaduni ya huzuni na mshtuko bila kuifafanua kupita maandishi.
