  verdict: revise
  source_fidelity: Maana ya hukumu, ahadi kwamba Yosia hataona maafa yajayo, na taarifa ya wajumbe kwa mfalme zimewasilishwa kwa uaminifu. Hata hivyo, “nitakukusanya kwa baba zako” haitoi kwa kawaida tamathali ya kuunganishwa na waliotangulia; “pamoja na baba zako” huwakilisha idiomu hiyo kwa uwazi zaidi. Pia, “utakusanywa katika makaburi yako” haisikiki kiasili katika Kiswahili; muundo wa kuelekea mahali pa mazishi unafaa zaidi.
  naturalness: Kiswahili kwa ujumla ni sanifu na kina rejesta inayofaa. Marekebisho madogo ya vihusishi na ya sentensi ya mwisho yanaifanya lugha iwe ya kawaida zaidi bila kuondoa msisitizo wa Kiebrania.
  terminology: “Kwa amani,” “maafa,” na “macho yako hayataona” ni chaguo sahihi. “Makaburi yako” huhifadhi wingi wa Kiebrania, lakini inahitaji kihusishi cha mwelekeo, si “katika,” baada ya kauli ya kukusanywa.
