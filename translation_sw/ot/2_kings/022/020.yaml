base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: sw
  text: Kwa hiyo, tazama, nitakukusanya pamoja na baba zako, nawe utakusanywa kwenda makaburi yako kwa amani.[a] Macho yako hayataona maafa yote ninayoleta juu ya mahali hapa.” Nao wakampa mfalme jibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa utulivu.” Kiebrania kinasema “kwa amani,” jambo ambalo huenda likamaanisha kwamba Yosia angekufa kabla ya kuiona hukumu inayokuja, badala ya kueleza hasa namna ambavyo angekufa.
    reason: Mbadala wa kileksika unaohifadhi utata wa Kiebrania na mvutano na 2 Wafalme 23:29.
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na unyenyekevu na mwitikio wa Yosia katika muktadha uliotangulia.
- source_word: הִנְנִי
  choice: tazama
  rationale: Inahifadhi msisitizo mzito wa tangazo la kinabii kwa lugha ya Kiswahili inayotambulika katika mtindo wa kibiblia.
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  choice: nitakukusanya ... utakusanywa
  rationale: Inahifadhi mzizi uleule na tamathali ya Kiebrania inayohusu kufa na kuunganishwa na waliotangulia.
- source_word: עַל אֲבֹתֶיךָ
  choice: kwa baba zako
  rationale: Inahifadhi tamathali ya kifamilia ya Kiebrania bila kuipanua kimafafanuzi kuwa ‘mababu zako.’
- source_word: קִבְרֹתֶיךָ
  choice: makaburi yako
  rationale: Inahifadhi wingi wa nomino ya Kiebrania na maana yake ya moja kwa moja.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Inahifadhi nomino שָׁלוֹם na utata wake badala ya kuifasiri moja kwa moja kuwa namna tulivu ya kufa.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Macho yako hayataona
  rationale: Inahifadhi ‘macho yako’ kama kiima, kama ilivyo katika Kiebrania, na hivyo kudumisha uzito wa usemi.
- source_word: הָרָעָה
  choice: maafa
  rationale: Katika muktadha huu neno linamaanisha msiba au hukumu inayokuja, si uovu wa kimaadili.
- source_word: מֵבִיא עַל
  choice: ninayoleta juu ya
  rationale: Wakati wa sasa unaonyesha tendo linalokaribia, huku ‘juu ya’ ikihifadhi picha ya hukumu inayokuja juu ya mahali.
- source_word: הַמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Ni tafsiri pana na ya kawaida inayofaa kwa Yerusalemu na eneo linalolengwa katika muktadha.
- source_word: וַיָּשִׁיבוּ אֶת־הַמֶּלֶךְ דָּבָר
  choice: Nao wakamrudishia mfalme ujumbe
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba wajumbe walirudi na kumpa mfalme taarifa.
theological_decisions:
- issue: Maana ya ‘kwa amani’ ikilinganishwa na kifo cha Yosia vitani katika 2 Wafalme 23:29
  choice: Kudumisha tafsiri ya moja kwa moja ‘kwa amani’ bila kuondoa mvutano uliomo katika simulizi.
  alternative: Kutafsiri ‘kwa utulivu’ kana kwamba inaeleza moja kwa moja namna ya kifo, au kutumia maneno ya ufafanuzi kama ‘kabla amani haijaondolewa.’
  rationale: Kiebrania kinasema ‘kwa amani.’ Kishazi kinachofuata kinaweza kueleza kwamba Yosia hangeyaona maafa yanayokuja juu ya mahali pale, bila kulazimisha maana kwamba angekufa kwa namna tulivu. Tafsiri inapaswa kuhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usemi wa kinabii lakini kinachoeleweka kwa wasomaji wa kawaida. Tamathali muhimu za Kiebrania, kama ‘kukusanywa kwa baba zako,’ ‘makaburi yako,’ na ‘macho yako hayataona,’ zimehifadhiwa bila maelezo ya kimadhehebu.
