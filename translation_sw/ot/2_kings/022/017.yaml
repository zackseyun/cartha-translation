  variant: Standard East African Swahili
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: sw
  text: kwa sababu wameniacha na wamefukizia miungu mingine uvumba[a], ili wanikasirishe kwa kazi zote za mikono yao. Kwa hiyo, ghadhabu yangu imewaka dhidi ya mahali hapa, wala haitazimwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamechoma sadaka kwa miungu mingine.”
    reason: Kitenzi cha Kiebrania mara nyingi hurejelea kufukiza uvumba, ingawa kinaweza pia kuhusisha sadaka nyingine inayochomwa.
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinatoa sababu ya hukumu; “kwa sababu” ni cha kawaida na wazi katika Kiswahili.
- source_word: עֲזָבוּנִי
  choice: wameniacha
  rationale: Huhifadhi uzito wa kimahusiano wa kumwacha Mungu na hali ya tendo lenye matokeo ya sasa.
- source_word: וַיְקַטְּרוּ
  choice: wamewafukizia moshi wa dhabihu
  rationale: Kitenzi hiki katika piel hueleza tendo la ibada la kuchoma kitu ili moshi wake upande, mara nyingi uvumba lakini si lazima uvumba pekee. Tafsiri hii inahifadhi tendo la kuchoma bila kulibana kuwa uvumba tu.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Ni tafsiri ya moja kwa moja ya miungu isiyo YHWH.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: ili wanikasirishe
  rationale: Huhifadhi maana ya kusudi au matokeo na lugha ya wazi ya kuchochea hasira ya Mungu.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: kwa kazi zote za mikono yao
  rationale: Huhifadhi nahau ya Kiebrania na mwelekeo wake dhidi ya vitu au matendo ya ibada ya sanamu.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: ghadhabu yangu imewaka
  rationale: Huhifadhi taswira ya moto pamoja na uzito wa ghadhabu ya hukumu.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: dhidi ya mahali hapa
  rationale: Ingawa kihalisi kihusishi kinaweza kuwa “katika,” “dhidi ya” huonyesha kwa Kiswahili lengo la ghadhabu.
- source_word: וְלֹא תִכְבֶּה
  choice: wala haitazimwa
  rationale: Huhifadhi taswira ya moto usiozimwa na mtindo mzito wa hukumu.
theological_decisions:
- issue: Lugha inayomwelezea Mungu kuwa na hasira
  choice: Kuhifadhi kauli kwamba watu wanamkasirisha Mungu na kwamba ghadhabu yake imewaka
  alternative: Kulainisha kuwa lugha isiyo ya kibinafsi kuhusu hukumu
  rationale: Kiebrania kinatumia wazi lugha ya kimahusiano na ya hisia kuhusu hukumu ya Mungu; tafsiri haipaswi kuondoa mvutano huo.
- issue: Taswira ya moto katika hukumu ya Mungu
  choice: Kuhifadhi “imewaka” na “haitazimwa”
  alternative: Kufafanua tu kwamba adhabu ni hakika
  rationale: Mstari unakusudia kuonyesha ghadhabu kama moto usiozimika; taswira hiyo ihifadhiwe bila kuongezewa madai ya baadaye ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ghadhabu” huhifadhi uzito wa lugha ya hukumu, na “imewaka/haitazimwa” huhifadhi taswira iliyounganishwa ya moto.
