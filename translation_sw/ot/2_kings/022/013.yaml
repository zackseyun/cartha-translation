review_pass:
  verdict: revise
  source_fidelity: The draft conveys the command to seek Yahweh’s guidance, the threefold scope of representation, the discovered book, and the reason for alarm. However, ‘inayowaka’ presents the kindling of Yahweh’s wrath as ongoing, whereas נִצְּתָה is perfect (‘has been kindled’). The final ‘na kutenda’ can be read merely as a coordinate action rather than the purpose/result expressed by לַעֲשׂוֹת.
  naturalness: The register is generally clear Standard East African Swahili. ‘Yahweh’ is the more established and readily recognizable spelling in current Swahili Bible usage. ‘Mkatafute shauri kwa Yahwe’ in the footnote is not idiomatic; ‘mshauriane na Yahweh’ is natural for the alternative ‘consult Yahweh.’
  terminology: ‘Mkamwulize Yahweh,’ ‘ghadhabu,’ ‘baba zetu,’ and ‘kutuhusu’ are suitable source-near choices. The divine name is consistently rendered as a name, not a title.
  issues:
  - severity: medium
    issue: Aspect of Yahweh’s wrath
    rationale: ‘Inayowaka’ is a present participial expression, while Hebrew נִצְּתָה is a perfect verb. ‘Iliyowashwa dhidi yetu’ preserves the completed kindling and its continuing consequence.
  - severity: medium
    issue: Rendering of the infinitive לַעֲשׂוֹת
    rationale: The phrase ‘hawakuyasikiliza ... na kutenda’ may imply a simple coordination. ‘Ili watende kulingana na...’ clearly represents the infinitive’s purpose/result relation to listening.
  - severity: low
    issue: Divine-name spelling and footnote idiom
    rationale: Using ‘Yahweh’ aligns with the project rendering and common Swahili convention. The consultation alternative is more idiomatically stated as ‘mshauriane na Yahweh.’
  revised_text: “Nendeni mkamwulize Yahweh[a] kwa ajili yangu, kwa ajili ya watu, na kwa ajili ya Yuda yote, kuhusu maneno ya kitabu hiki kilichopatikana. Kwa maana ghadhabu ya Yahweh iliyowashwa dhidi yetu ni kubwa, kwa sababu baba zetu[b] hawakuyasikiliza maneno ya kitabu hiki ili watende kulingana na yote yaliyoandikwa kutuhusu.”
