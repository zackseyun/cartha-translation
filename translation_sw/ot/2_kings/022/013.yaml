  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: sw
  text: “Nendeni mkamwulize Yahweh[a] kwa ajili yangu, kwa ajili ya watu, na kwa ajili ya Yuda yote, kuhusu maneno ya kitabu hiki kilichopatikana. Kwa maana ghadhabu ya Yahweh iliyowashwa dhidi yetu ni kubwa, kwa sababu baba zetu[b] hawakuyasikiliza maneno ya kitabu hiki ili watende kulingana na yote yaliyoandikwa kutuhusu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkamtafute Yahweh” au “mshauriane na Yahweh.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtafuta Mungu kwa ujumla au kumwuliza ili kupata mwongozo; hapa muktadha unaelekea kwenye kumwuliza rasmi.
    reason: lexical_alternative
  - marker: b
    text: Au “mababu zetu” au “wazee wetu wa zamani.” Kiebrania kinasema kihalisi “baba zetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: mkamwulize Yahwe
  rationale: Katika muktadha huu, דרשׁ inaelekeza kwenye kumwendea Mungu ili kupata jibu au mwongozo kuhusu kitabu kilichopatikana. ‘Mkamwulize’ ni Kiswahili cha kawaida kinachoonyesha uchunguzi rasmi bila kuifanya kuwa kutafuta Mungu kwa ujumla tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limeandikwa kwa namna ya kawaida ya Kiswahili, ‘Yahwe’, badala ya kubadilishwa kuwa cheo.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: kwa ajili yangu, kwa ajili ya watu, na kwa ajili ya Yuda yote
  rationale: בְּעַד inaonyesha uwakilishi au tendo linalofanywa kwa niaba ya wengine. ‘Kwa ajili ya’ ni ya asili na inadumisha maana hiyo.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: kuhusu maneno ya kitabu hiki kilichopatikana
  rationale: Tafsiri hii inadumisha mkazo wa דִּבְרֵי kwenye maneno yaliyomo kitabuni, huku kishazi cha uhusiano kikitoa Kiswahili cha asili kwa הַנִּמְצָא.
- source_word: חֲמַת יְהוָה אֲשֶׁר הִיא נִצְּתָה בָנוּ
  choice: ghadhabu ya Yahwe inayowaka dhidi yetu
  rationale: חֵמָה ni hasira kali ya hukumu, nayo יצת hutumia taswira ya kuwashwa au kuwaka. ‘Inayowaka dhidi yetu’ huhifadhi taswira na mwelekeo wa uadui.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: baba zetu hawakuyasikiliza
  rationale: שׁמע hapa inahusisha kusikia kunakopaswa kuzaa utiifu. ‘Hawakuyasikiliza’ huhifadhi maana ya msingi, na kishazi kinachofuata kinaonyesha kutotii kwa vitendo.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: na kutenda kulingana na yote yaliyoandikwa
  rationale: ‘Kutenda kulingana na’ huhifadhi nguvu ya כְּ na kuonyesha kwamba kusikiliza kulipaswa kuambatana na utekelezaji wa yaliyoandikwa.
- source_word: עָלֵינוּ
  choice: kutuhusu
  rationale: עָלֵינוּ inaweza kueleza mambo yanayolihusu au kulikabili jumuiya. ‘Kutuhusu’ inadumisha upana huo bila kuamua kimbele kuwa maandishi hayo ni hukumu peke yake.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina maalumu la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Rejeo la אֲבֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu
  rationale: ‘Baba zetu’ ni tafsiri ya karibu ya nomino ya kiume na inaweza kurejelea watangulizi wa taifa; tanbihi inaeleza maana pana inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. ‘Nendeni mkamwulize’ ni amri ya asili inayobeba mfuatano wa kwenda na kuuliza. Muundo wa sentensi umehifadhi urudiaji wa ‘kwa ajili ya’ kwa msisitizo wa chanzo, na alama zote za tanbihi [a], [b] zimewekwa katika matini kuu.
