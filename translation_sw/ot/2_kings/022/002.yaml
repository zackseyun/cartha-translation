  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: sw
  text: Alifanya yaliyo sawa machoni pa Yahweh, akaenenda katika njia yote ya Daudi, baba yake[a], wala hakukengeuka kwenda kulia au kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Daudi baba yake.” Hapa “baba” linaweza kumaanisha mmoja wa mababu zake au mtangulizi wa nasaba ya kifalme.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Alifanya yaliyo sawa
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino; ‘yaliyo sawa’ ni Kiswahili cha kawaida kinachohifadhi tathmini ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya kupima jambo kwa mtazamo wa Yahweh, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetolewa kama jina binafsi ‘Yahweh’, badala ya kubadilishwa kuwa cheo.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: akafuata njia yote
  rationale: ‘Kufuata njia’ ni nahau ya kawaida ya Kiswahili kwa mwenendo unaoiga kielelezo; ‘yote’ huhifadhi wazo la ufuasi kamili lililo katika כָּל.
- source_word: דָּוִד אָבִיו
  choice: Daudi baba yake
  rationale: Huhifadhi mpangilio na lugha ya ukoo wa kifalme ya Kiebrania; tanbihi inaeleza kuwa ‘baba’ hapa ni babu wa ukoo, si mzazi wa moja kwa moja.
- source_word: וְלֹא סָר
  choice: wala hakukengeuka
  rationale: ‘Kukengeuka’ huonyesha kutoka katika njia inayofaa na kuhifadhi sitiari ya njia.
- source_word: יָמִין וּשְׂמֹאול
  choice: kwenda kulia au kushoto
  rationale: Huhifadhi usemi wa pande mbili unaomaanisha kutopotoka upande wowote.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la agano; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ‘Daudi baba yake’
  choice: Kuhifadhi ‘baba yake’ katika maandishi na kufafanua kwa tanbihi
  alternative: Daudi babu yake wa ukoo
  rationale: Huhifadhi usemi wa Kiebrania na umuhimu wake wa kidinastia bila kudokeza kimakosa kwamba Daudi alikuwa mzazi wa moja kwa moja wa Yosia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari za ‘machoni’ na ‘njia’ zimehifadhiwa bila kufanya sentensi iwe ngumu.
