base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: sw
  text: “Nenda kwa Hilkia, kuhani mkuu, naye akamilishe hesabu ya fedha iliyoletwa katika nyumba ya Yahwe, ambayo walinzi wa kizingiti[a] wamekusanya kutoka kwa watu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walinda milango”; kihalisi, “walinzi wa kizingiti.”
    reason: Hutoa mbadala wa asili zaidi kwa usemi wa Kiebrania שֹׁמְרֵי הַסַּף, huku maandishi makuu yakihifadhi taswira yake ya karibu.
lexical_decisions:
- source_word: עֲלֵה
  choice: Panda uende
  rationale: Kitenzi cha amri kina maana ya kupanda au kwenda juu. “Panda uende” huhifadhi mwelekeo huo na ni agizo linaloeleweka kwa Kiswahili.
- source_word: חִלְקִיָּהוּ
  choice: Hilkia
  rationale: Jina limetoholewa kwa namna inayotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa cheo cha kuhani mwenye wadhifa mkuu.
- source_word: וְיַתֵּם
  choice: naye ajumlishe
  rationale: Katika muktadha wa fedha, kitenzi kinamaanisha kukamilisha hesabu; “ajumlishe” huwasilisha tendo la kupata jumla bila kuongeza maelezo yasiyomo.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: Neno la Kiebrania humaanisha kihalisi “silver,” lakini pia hutumiwa kwa pesa. “Fedha” huhifadhi maana zote mbili kwa kawaida katika Kiswahili.
- source_word: הַמּוּבָא
  choice: iliyoletwa
  rationale: Umbo tendwa la kitenzi linaeleza fedha ambayo tayari imeletwa ndani; “iliyoletwa” ni fupi na ya kawaida.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi taswira ya moja kwa moja ya Kiebrania, huku muktadha ukionyesha kuwa ni hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa umbo la kawaida la Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אָסְפוּ
  choice: wamekusanya
  rationale: Huwasilisha ukusanyaji wa fedha uliotangulia agizo hili.
- source_word: שֹׁמְרֵי הַסַּף
  choice: walinzi wa kizingiti
  rationale: Huhifadhi usemi halisi wa Kiebrania; huenda hawa walikuwa walinda milango wa hekalu, jambo linalobainishwa katika tanbihi.
- source_word: מֵאֵת הָעָם
  choice: kutoka kwa watu
  rationale: Ni tafsiri ya moja kwa moja isiyopanua wala kubana kundi linalorejelewa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kiebrania kina jina la Mungu lenye herufi nne, si cheo. “Yahwe” huhifadhi jina hilo kwa namna ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “naye ajumlishe” huhifadhi mfuatano wa agizo la Kiebrania, na “fedha” hufaa kwa maana ya metali na pesa.
