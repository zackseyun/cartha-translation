  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: sw
  text: 'Naye akawaambia, “Yahwe, Mungu wa Israeli, asema hivi: Mwambieni mtu aliyewatuma kwangu:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: Naye akawaambia
  rationale: Kauli hii inaendeleza mfululizo wa simulizi na kumtaja Hulda kwa kiwakilishi cha kike; ‘akawaambia’ kwa kawaida hujumuisha wazo la kusema kwao.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni fomula ya kawaida ya ujumbe wa kinabii. Wakati wa sasa katika Kiswahili huwasilisha kwa kawaida tamko la Mungu linalotolewa sasa kupitia mjumbe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo ‘Bwana’.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu unatafsiri kwa uwazi mnyororo wa umilikaji wa Kiebrania na kumtambulisha Yahwe kuwa Mungu wa Israeli.
- source_word: אִמְרוּ לָאִישׁ
  choice: Mwambieni mtu
  rationale: Amri ya wingi inaelekezwa kwa wajumbe. ‘Mwambieni’ ni Kiswahili cha asili kwa ‘semeni kwa’; ‘mtu’ hapa humrejelea mwanamume maalumu katika muktadha bila kulazimisha neno ‘mwanaume’, ambalo lingesisitiza jinsia kuliko asili.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: aliyewatuma kwangu
  rationale: Kishazi hiki huhifadhi nafsi ya wingi ya wajumbe na Hulda akiwa ndiye walikotumwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Bwana; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi jina hilo kwa tahajia inayofaa Kiswahili.
- issue: Maana ya אִישׁ
  choice: mtu
  alternative: mwanaume
  rationale: Ingawa nomino ya Kiebrania ni ya kiume na katika muktadha inamhusu mfalme Yosia, ‘mtu’ ni tafsiri ya kawaida ya אִישׁ katika usemi huu na haibadili rejeleo lake kuwa lisilo la kiume. ‘Mwanaume’ ingeweka mkazo wa kijinsia usiokusudiwa na sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama ya nukuu ya ndani imeachwa wazi kwa sababu ujumbe unaendelea katika mstari unaofuata.
