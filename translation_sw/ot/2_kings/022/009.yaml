base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: sw
  text: Kisha Shafani, mwandishi, akamletea mfalme taarifa, akasema, “Watumishi wako wameimimina[a] fedha iliyopatikana katika nyumba[b], na wameikabidhi[c] kwa wafanyakazi waliowekwa kusimamia nyumba ya Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wameondoa fedha zote”; kihalisi, “wameimimina.”
    reason: lexical_alternative
  - marker: b
    text: Yaani hekalu; kihalisi, “katika nyumba.”
    reason: cultural_note
  - marker: c
    text: Kihalisi, “wameiweka mkononi mwa”; maana yake ni wameikabidhi chini ya uangalizi wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: Katika mazingira ya ikulu, neno hili humaanisha mwandishi au katibu wa kifalme; “mwandishi” huhifadhi maana ya msingi na ni la kawaida katika Kiswahili cha Biblia.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: akampelekea mfalme taarifa
  rationale: Nahau hii ina maana ya kurudi na taarifa au kuiwasilisha; tafsiri hii ni ya asili katika Kiswahili bila kupoteza wazo la ujumbe uliorudishwa.
- source_word: הִתִּיכוּ
  choice: wameimimina
  rationale: Katika muktadha huu si kuyeyusha chuma, bali kumimina au kuondoa fedha kutoka chombo kwa ajili ya kuhesabiwa au kukabidhiwa. Tanbihi huhifadhi uwezekano wa “kuitoa yote.”
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: “Fedha” katika Kiswahili inaweza kumaanisha madini ya fedha au pesa, hivyo inafaa kwa כֶּסֶף na muktadha wa hazina ya hekalu.
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: iliyopatikana hekaluni
  rationale: Ingawa Kiebrania husema kihalisi “katika nyumba,” muktadha unaonyesha wazi hekalu; “hekaluni” ni wazi na ya kawaida kwa msomaji wa sasa.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: wameikabidhi
  rationale: Nahau ya Kiebrania, kihalisi “kuiweka juu/katika mkono,” humaanisha kukabidhi kitu chini ya mamlaka au uangalizi wa mtu.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: wasimamizi wa kazi
  rationale: Muundo huu unawahusu watu waliowekwa kusimamia utekelezaji wa kazi; “wasimamizi wa kazi” ni fupi na wazi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Huhifadhi taswira ya Kiebrania ya hekalu kama nyumba ya Mungu na kutaja jina la Mungu moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Utoaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina maalumu la Mungu; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya בַּבַּיִת katika kauli ya kwanza
  choice: hekaluni
  alternative: ndani ya nyumba
  rationale: Muktadha unamaanisha hekalu la Yahweh. Tafsiri ya wazi huepusha dhana ya nyumba ya kawaida, huku tanbihi ikionyesha usemi halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa simulizi wa “aka-” umetumiwa kwa mfululizo wa matendo, huku kauli ya moja kwa moja ikitumia wakati timilifu. Tanbihi zote zimewekwa kwenye sehemu husika ya matini.
