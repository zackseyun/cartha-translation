base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: sw
  text: Naye aiweke mikononi mwa wafanyakazi waliowekwa katika nyumba ya Yahwe[a], na wao waipatie wafanyakazi walio katika nyumba ya Yahwe ili watengeneze sehemu zilizoharibika za nyumba hiyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye awape wafanyakazi waliowekwa katika nyumba ya Yahwe.” Kiebrania kina kitenzi “kutoa” pamoja na nahau inayomaanisha kuweka kitu chini ya dhamana ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Kwa maneno halisi, “ili waimarishe uharibifu wa nyumba.” Hii ni nahau inayomaanisha kutengeneza sehemu za jengo zilizoharibika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתנה עַל יַד
  choice: Nao waiweke mikononi mwa
  rationale: Kitenzi נתן pamoja na nahau עַל יַד kinaeleza kukabidhi kitu chini ya usimamizi wa mtu. “Waiweke mikononi mwa” ni Kiswahili cha kawaida kinachohifadhi wazo la dhamana na nguvu ya agizo.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: wasimamizi wa kazi waliowekwa kusimamia
  rationale: Kirai cha kwanza kwa kawaida ni “wanaofanya kazi,” lakini participio ya Hophal הַמֻּפְקָדִים inaonyesha waliowekwa kuwa na jukumu. Tafsiri hii inatofautisha kundi hili la usimamizi na wafanyakazi wanaotajwa baadaye bila kulifanya cheo maalumu.
- source_word: בבית יהוה
  choice: nyumba ya Yahwe
  rationale: בית ni “nyumba,” na hapa inarejelea hekalu. Kulihifadhi neno “nyumba” kunadumisha urudiaji wa Kiebrania; יהוה limetolewa kama jina la agano “Yahwe.”
- source_word: ויתנו אתו
  choice: kisha wao wawape
  rationale: נתן limetafsiriwa kwa maana yake ya kawaida “kutoa/kupa.” Kiambishi “-wa-” kinarejelea wafanyakazi, na kitu kinachotolewa kinaeleweka kutokana na fedha zilizotajwa katika muktadha uliotangulia.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר בְּבֵית יהוה
  choice: wafanyakazi walio katika nyumba ya Yahwe
  rationale: “Wafanyakazi” ni Kiswahili cha sasa na cha wazi kwa “wanaofanya kazi.” “Walio katika” hufuata kirai cha mahali bila kuongeza kitenzi “wanaofanya,” ambacho hakijaandikwa wazi katika kishazi husika.
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: ili watengeneze sehemu zilizoharibika za nyumba hiyo
  rationale: חזק ni “kuimarisha,” lakini pamoja na בדק katika muktadha wa jengo ina maana ya kutengeneza uharibifu. “Sehemu zilizoharibika” ni ya kawaida na inaonyesha kwamba kinachotengenezwa ni kasoro za jengo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina יהוה moja kwa moja. “Yahwe” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wasimamizi wa kazi” na “wafanyakazi” hutenganisha kwa uwazi kundi lililowekwa kusimamia na kundi linalofanya matengenezo. Viwakilishi vya wingi vinafuata muundo wa agizo la Kiebrania; “nyumba” limehifadhiwa badala ya “hekalu” ili kudumisha taswira na urudiaji wa chanzo.
