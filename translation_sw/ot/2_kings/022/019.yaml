    rationale: Kiebrania kina וַתִּקְרַע ('na ukararua'), kikiendelea kueleza matendo yanayoambatana na unyenyekevu wa Yosia, wala hakirudii kiunganishi cha kisababishi יַעַן.
  - severity: medium
    issue: '''Kwamba pangekuwa ukiwa na laana'' hakielezi kwa uwazi wigo wa ''mahali hapa na wakazi wake'' wala maana ya שַׁמָּה kama kitu cha kutisha.'
    rationale: Kwa kuwa mahali na wakazi wake wametajwa pamoja, usemi wa 'kitu cha kutisha na laana' unaweza kutumika kwa kundi hilo lote bila kulazimisha wakazi kuwa 'ukiwa.' Maana ya 'ukiwa' ihifadhiwe kama mbadala katika tanbihi.
  revised_text: Kwa sababu moyo wako ulikuwa mwororo, nawe ukajinyenyekeza mbele za Yahwe uliposikia yale niliyosema dhidi ya mahali hapa na wakazi wake, kwamba wangekuwa kitu cha kutisha[a] na laana, ukararua mavazi yako na kulia mbele zangu, mimi pia nimekusikia, asema Yahwe.
