id: 2KI.22.19
reference: 2 Kings 22:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: sw
  text: Kwa sababu moyo wako ulikuwa mwororo, nawe ukajinyenyekeza mbele za Yahwe uliposikia yale niliyosema dhidi ya mahali hapa na wakazi wake, kwamba wangekuwa kitu cha kutisha[a] na laana, ukararua mavazi yako na kulia mbele zangu, mimi pia nimekusikia, asema Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukiwa na laana.” Neno la Kiebrania שַׁמָּה linaweza kumaanisha ukiwa, hali ya kutisha, au kitu kinachowashangaza watu katika muktadha wa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Kwa sababu
  rationale: Inaendeleza wazi maana ya sababu inayotanguliza jibu la Mungu.
- source_word: רַךְ לְבָבְךָ
  choice: moyo wako ulikuwa mwororo
  rationale: Inahifadhi sitiari ya moyo ulio laini na wenye kuitikia, bila kuudokeza udhaifu.
- source_word: וַתִּכָּנַע
  choice: ukajinyenyekeza
  rationale: Muundo huu unaonyesha tendo la hiari la kujishusha mbele za Mungu.
- source_word: מִפְּנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kuwa katika uwepo wa Mungu.
- source_word: בְּשָׁמְעֲךָ
  choice: uliposikia
  rationale: Inatoa kwa kawaida maana ya wakati iliyomo katika muundo wa Kiebrania.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: yale niliyosema
  rationale: Inarejelea maudhui ya hukumu aliyotamka Mungu.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: dhidi ya mahali hapa na wakazi wake
  rationale: Katika muktadha wa hukumu, עַל lina nguvu ya uadui au hukumu, inayowasilishwa na “dhidi ya.”
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: kwamba pangekuwa ukiwa na laana
  rationale: “Ukiwa” linafaa kwa hukumu juu ya mahali, huku “laana” likihifadhi moja kwa moja neno קְלָלָה. Upatanisho wa mahali “pange-” unaruhusu mahali pamoja na wakazi wake kubaki katika wigo wa hukumu bila kugawa matokeo hayo isivyohitajika.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: ulirarua mavazi yako
  rationale: Ni usemi wa asili kwa ishara ya huzuni na toba katika mazingira ya kale.
- source_word: וַתִּבְכֶּה לְפָנַי
  choice: kulia mbele zangu
  rationale: Inahifadhi huzuni pamoja na mwelekeo wa tendo hilo kwa Mungu mwenyewe.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: mimi pia nimekusikia
  rationale: “Mimi pia” linahifadhi msisitizo wa kiwakilishi na גַם; “-ku-” linaweka wazi yule aliyesikiwa kutokana na muktadha.
- source_word: נְאֻם יְהוָה
  choice: asema Yahwe
  rationale: Ni fomula ya kinabii iliyo wazi, yenye hadhi, na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la agano יְהוָה; “Yahwe” linawakilisha jina hilo moja kwa moja badala ya kulibadili kuwa cheo.
- issue: Hali ya moyo wa Yosia
  choice: moyo wako ulikuwa mwororo
  alternative: moyo wako uliguswa / ulikuwa tayari kuitikia
  rationale: “Mwororo” linadumisha sitiari ya Kiebrania ya moyo laini huku muktadha wa kujinyenyekeza ukionyesha kwamba ni unyenyekevu na mwitikio, si udhaifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ndefu ya chanzo imehifadhiwa kwa mtiririko unaoeleweka; vistari virefu vinatenga maudhui ya hukumu. “Mavazi” na “kulia” ni maneno ya kawaida yasiyo ya kimadhehebu.
