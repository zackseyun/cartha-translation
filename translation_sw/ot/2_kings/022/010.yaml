base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: sw
  text: Ndipo Shafani, mwandishi, akamwarifu mfalme, akisema, “Hilkia, kuhani, amenipa kitabu[a].” Kisha Shafani akakisoma mbele ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hati-kunjo.” Neno la Kiebrania linaweza kumaanisha kwa ujumla hati iliyoandikwa na lenyewe halibainishi umbo lake halisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: akamwarifu
  rationale: Kitenzi נגד katika Hiphil humaanisha kumjulisha au kumweleza mtu jambo. “Akamwarifu” ni Kiswahili cha kawaida kinachofaa taarifa iliyotolewa kwa mfalme bila kuongeza uzito usiokuwamo katika maandishi.
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: סֹפֵר inaweza kumaanisha mwandishi au katibu wa kifalme. “Mwandishi” huhifadhi maana ya msingi na cheo cha kihistoria, huku ikieleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: סֵפֶר
  choice: kitabu
  rationale: סֵפֶר ni neno pana kwa maandishi au hati iliyoandikwa na halibainishi lenyewe umbo la kitu hicho. “Kitabu” ni chaguo la kawaida katika muktadha huu; tanbihi inadumisha uwezekano wa “hati-kunjo.” Kutokuwapo kwa kibainishi katika Kiebrania kumehifadhiwa kwa kutosema “kile kitabu.”
- source_word: נָתַן לִי
  choice: amenipa
  rationale: Kauli timilifu ya Kiebrania inaeleza tendo lililokamilika ambalo lina umuhimu wakati wa kusema. “Amenipa” huwasilisha hali hiyo kwa kawaida katika Kiswahili.
- source_word: וַיִּקְרָאֵהוּ
  choice: akakisoma
  rationale: קרא inapokuwa na maandishi kama yambwa kwa kawaida humaanisha kusoma, mara nyingi kwa sauti. “Akakisoma mbele ya mfalme” huonyesha tendo hilo kwa uwazi bila kulifanya kuwa tangazo rasmi.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Hii ni nahau ya kawaida ya kufanya jambo katika uwepo wa mtu. “Mbele ya mfalme” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika mapokeo ya Biblia ya Kiswahili.
- source_word: שָׁפָן
  choice: Shafani
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika mapokeo ya Biblia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Virai “akamwarifu” na “mbele ya mfalme” vinaendeleza mtiririko wa kifungu bila kuongeza urasmi usio katika chanzo.
