id: 2KI.22.3
reference: 2 Kings 22:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: sw
  text: Katika mwaka wa kumi na nane wa utawala wa Mfalme Yosia, mfalme alimtuma Shafani mwana wa Azalia, mwana wa Meshulamu, mwandishi, kwenda katika nyumba ya Yahwe[a], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu la Yahwe.” Kihalisi, “nyumba ya Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Katika
  rationale: Kitenzi hiki cha kisimulizi kinaanzisha tukio kwa kulitaja wakati wake. Katika Kiswahili, mwanzo wa moja kwa moja wa kishazi cha wakati ni wa kawaida kuliko tafsiri ngumu ya neno kwa neno, “Ikawa.”
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: Katika mwaka wa kumi na nane wa utawala wa Mfalme Yosia
  rationale: Hii ni namna ya kuhesabu mwaka wa utawala wa mfalme. Neno “wa utawala” linaweka wazi maana hiyo katika Kiswahili bila kubadili taarifa ya Kiebrania.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: mfalme alimtuma
  rationale: Inahifadhi kurudiwa kwa neno “mfalme” katika chanzo na kutumia muundo wa kawaida wa Kiswahili kwa kumtuma mtu.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: Shafani mwana wa Azalia, mwana wa Meshulamu
  rationale: Majina yameandikwa kwa maumbo yanayofaa matamshi ya Kiswahili, huku mfululizo wa nasaba ukihifadhiwa.
- source_word: הַסֹּפֵר
  choice: mwandishi
  rationale: Neno hili linaweza kumaanisha mwandishi au katibu wa kifalme. “Mwandishi” ni tafsiri pana na ya moja kwa moja isiyolazimisha cheo maalumu kuliko chanzo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Inahifadhi taswira halisi ya “nyumba” na jina binafsi la Mungu. Katika muktadha huu nyumba hiyo ni hekalu, jambo linalotajwa katika tanbihi.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Ni utangulizi wa moja kwa moja wa maneno yanayoendelea katika mstari unaofuata; koma inaonyesha kwamba sentensi haijakamilika.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza tafsiri ya kimadhehebu.
- issue: Maana ya בֵּית יהוה katika muktadha huu
  choice: nyumba ya Yahwe
  alternative: hekalu la Yahwe
  rationale: “Nyumba” ndiyo maana ya moja kwa moja ya neno la Kiebrania na inabaki wazi na ya kueleweka; “hekalu” ni ufafanuzi sahihi wa kimuktadha na umetolewa kama mbadala katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kisimulizi. Muundo ni wa kawaida kwa msomaji wa leo, huku kurudiwa kwa “mfalme,” mfululizo wa nasaba, na sentensi inayoendelea hadi mstari unaofuata vikihifadhiwa.
