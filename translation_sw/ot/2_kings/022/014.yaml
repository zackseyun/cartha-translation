base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: sw
  text: Ndipo Hilkia kuhani, Ahikamu, Akbori, Shafani na Asaya wakaenda kwa Hulda, nabii mwanamke, mke wa Shalumu mwana wa Tikva, mwana wa Harhasi, mtunza mavazi.[a] Hulda alikuwa akiishi Yerusalemu katika Eneo la Pili,[b] nao wakasema naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “mtunza nguo.” Huenda hii ilikuwa kazi au wadhifa rasmi wa kusimamia mavazi.'
    reason: lexical_alternative
  - marker: b
    text: Au “katika sehemu ya pili ya mji.” Huenda Kiebrania kinarejelea eneo maalumu la Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Ndipo ... wakaenda
  rationale: Kiunganishi cha masimulizi kinaendeleza mfululizo wa matukio; “Ndipo” na kitenzi cha wakati uliopita ni Kiswahili cha kawaida na cha wazi.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Kiebrania kinasema tu “kuhani,” si “kuhani mkuu”; cheo hakiongezwi kutokana na muktadha mpana.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: Hulda, nabii mwanamke
  rationale: Nomino ya Kiebrania ni ya kike na inamtambulisha Hulda wazi kuwa mwanamke mwenye huduma ya kinabii. “Nabii mwanamke” ni ya kawaida na yenye heshima katika Kiswahili cha sasa.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: mke wa Shalumu
  rationale: Kirai cha Kiebrania kinaonyesha moja kwa moja uhusiano wa ndoa.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: mwana wa Tikva, mwana wa Harhasi
  rationale: Mfuatano wa ukoo umehifadhiwa bila kuufupisha au kuufafanua zaidi.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: mtunza mavazi
  rationale: Hii inafuata maana ya moja kwa moja, “mtunza mavazi,” huku ikiweza pia kueleweka kuwa wadhifa rasmi; tanbihi inaonyesha uwezekano huo.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: Hulda alikuwa akiishi
  rationale: Katika taarifa ya mahali, kitenzi יָשַׁב humaanisha kukaa au kuishi mahali. Kurudia jina kunaleta uwazi katika Kiswahili.
- source_word: בַּמִּשְׁנֶה
  choice: katika Mtaa wa Pili
  rationale: Neno hilo huenda ni jina la eneo maalumu la Yerusalemu. Herufi kubwa zinaonyesha kuwa ni jina la eneo, huku tanbihi ikihifadhi tafsiri mbadala.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: nao wakasema naye
  rationale: Tafsiri hii inahifadhi tendo la kusema au kuzungumza lililoelekezwa kwake bila kuongeza maudhui ambayo hayakutajwa.
theological_decisions:
- issue: Kama cheo cha Hilkia kiongezwe kuwa “kuhani mkuu”
  choice: kuhani
  alternative: kuhani mkuu
  rationale: Mstari wenyewe una הַכֹּהֵן, “kuhani,” bila kivumishi “mkuu”; tafsiri haileti cheo kamili kutoka sehemu nyingine.
- issue: Jinsi ya kuonyesha umbo la kike la cheo cha kinabii
  choice: nabii mwanamke
  alternative: nabii
  rationale: Kiebrania kinatumia nomino ya kike kwa makusudi. Tafsiri inaonyesha jinsia hiyo wazi bila kupunguza au kubadili hadhi ya kinabii ya Hulda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wa heshima. Majina yameandikwa kwa maumbo yanayofaa mfumo wa sauti wa Kiswahili. Lugha imeepuka ukale usio wa lazima na pia haijaongeza cheo au ufafanuzi wa kiteolojia ambao haupo wazi katika Kiebrania.
