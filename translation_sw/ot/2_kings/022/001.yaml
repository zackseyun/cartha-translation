base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: sw
  text: Yosia alikuwa na umri wa miaka minane alipoanza kutawala, naye akatawala huko Yerusalemu kwa miaka thelathini na moja. Mama yake aliitwa Yedida, binti ya Adaya, kutoka Boskathi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: alikuwa na umri wa miaka minane
  rationale: Hii ni nahau ya Kiebrania ya kutaja umri; tafsiri hii ni ya kawaida na wazi katika Kiswahili huku ikihifadhi umri kamili.
- source_word: בְמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati Yosia alipoingia katika utawala; ‘alipoanza kutawala’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi hiki humaanisha kutawala akiwa mfalme, si kuwa na cheo tu.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: kwa miaka thelathini na moja
  rationale: Huu ni mpangilio wa kawaida wa namba katika Kiswahili na unahifadhi muda kamili wa utawala.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Mahali pa utawala paelezwa kwa jina la mji lililozoeleka katika Kiswahili; kiambishi cha mahali kinaeleweka kupitia muundo wa kitenzi.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Ni Kiswahili cha asili kwa fomula ya Kiebrania ‘jina la mama yake lilikuwa,’ bila kupoteza habari yoyote.
- source_word: יְדִידָה
  choice: Yedida
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili badala ya kutafsiriwa maana yake.
- source_word: בַת עֲדָיָה
  choice: binti ya Adaya
  rationale: Muundo huu unahifadhi wazi uhusiano wa kifamilia; jina limetoholewa badala ya kutafsiriwa.
- source_word: מִבָּצְקַת
  choice: kutoka Boskathi
  rationale: Kiambishi מִ־ kinaonyesha asili; ‘kutoka’ huwasilisha jambo hilo moja kwa moja, na jina la mahali limetoholewa kwa Kiswahili.
