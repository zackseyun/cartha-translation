lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: kwa ajili ya mafundi
  rationale: חָרָשִׁים ni wafanyakazi wenye ustadi kwa maana pana; “mafundi” haibani maana hiyo kwa maseremala peke yao.
- source_word: וְלַבֹּנִים
  choice: wajenzi
  rationale: Nomino hii ya kitendo kutoka בנה inawataja moja kwa moja watu wanaofanya kazi ya kujenga.
- source_word: וְלַגֹּדְרִים
  choice: waashi
  rationale: Katika muktadha wa ukarabati wa jengo, “waashi” ni jina la kawaida la mafundi wanaojenga kwa mawe au matofali, huku tanbihi ikihifadhi maana halisi zaidi ya kujenga au kukarabati kuta.
- source_word: וְלִקְנוֹת
  choice: na kwa kununua
  rationale: Muundo huu unaendeleza orodha ya matumizi ya fedha; “kwa kununua” huhifadhi uhusiano huo wa kusudi.
- source_word: עֵצִים
  choice: mbao
  rationale: Katika orodha ya vifaa vya ujenzi, “mbao” ni sahihi na ya kawaida zaidi kuliko “miti” au “kuni.”
- source_word: וְאַבְנֵי מַחְצֵב
  choice: na mawe yaliyochimbwa
  rationale: Kirai hiki kinataja mawe yaliyotolewa machimboni kwa matumizi ya ujenzi; tanbihi inaonyesha pia uwezekano wa kuelewa kuwa yamekatwa au kuchongwa.
- source_word: לְחַזֵּק
  choice: ili kuimarisha
  rationale: “Kuimarisha” huhifadhi maana ya msingi ya חזק, yaani kufanya kitu kiwe imara, na pia ni ya kawaida katika muktadha wa ukarabati.
- source_word: אֶת־הַבָּיִת
  choice: nyumba
  rationale: Kiebrania kinasema moja kwa moja “nyumba”; muktadha unaonyesha kuwa ni nyumba ya BWANA, yaani hekalu, jambo linalofafanuliwa katika tanbihi.
