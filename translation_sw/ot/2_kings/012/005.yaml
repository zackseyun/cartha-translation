id: 2KI.12.5
reference: 2 Kings 12:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: sw
  text: Naye Yehoashi akawaambia makuhani, “Fedha yote ya vitu vilivyowekwa wakfu inayoletwa katika nyumba ya Yahwe—fedha ya kila mtu anayehesabiwa[a], fedha ya tathmini ya watu[b], na fedha yote ambayo mtu anakusudia moyoni mwake[c] kuileta katika nyumba ya Yahwe—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “fedha ya kila mtu anayepita”; huenda ni malipo ya sensa yaliyotakiwa kutoka kwa waliohesabiwa (linganisha Kutoka 30:13–16).
    reason: lexical_alternative
  - marker: b
    text: Au “fedha kwa ajili ya tathmini ya watu”; huenda inahusu malipo yaliyohusiana na tathmini za nadhiri (linganisha Walawi 27:2–8).
    reason: cross_reference
  - marker: c
    text: Nahau ya Kiebrania ni “inayopanda juu ya moyo wa mtu,” yaani, kile ambacho mtu anakusudia kwa hiari kutoa.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: Fedha yote ya vitu vilivyowekwa wakfu
  rationale: Neno הַקֳּדָשִׁים hapa linahusu vitu au matoleo yaliyotengwa kwa matumizi matakatifu. Tafsiri hii ni ya asili kwa Kiswahili na inaruhusu vifungu vinavyofuata kufafanua aina za mapato ya hekalu.
- source_word: יוּבָא בֵית יְהוָה
  choice: inayoletwa katika nyumba ya Yahwe
  rationale: Kitenzi cha Kiebrania ni katika kauli ya kutendwa; “inayoletwa” huhifadhi hilo. “Nyumba ya Yahwe” ni hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: fedha ya kila mtu anayehesabiwa
  rationale: Ingawa kwa muundo wa moja kwa moja ni fedha ya mtu “anayepita,” katika muktadha wa malipo ya ibada inaelekea kumaanisha mtu anayepita kati ya wanaohesabiwa, kama katika Kutoka 30:13–16.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: fedha ya tathmini ya watu
  rationale: Fungu hili lililobanwa linahusu thamani iliyokadiriwa kwa watu, huenda kwa taratibu za Walawi 27, bila kuongeza wazi wazo la nadhiri lisilotajwa katika mstari.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: fedha yote ambayo mtu anakusudia moyoni mwake
  rationale: Nahau ya Kiebrania, kitu “kupanda juu ya moyo,” huonyesha kusudi la ndani au utoaji wa hiari. Kiswahili cha moja kwa moja kingekuwa kigumu, hivyo maana imewasilishwa kwa lugha ya kawaida huku tanbihi ikihifadhi picha ya asili.
- source_word: לְהָבִיא בֵּית יְהוָה
  choice: kuileta katika nyumba ya Yahwe
  rationale: Hiki ni kishazi cha kusudi kinachofafanua fedha ambayo mtu amekusudia kuitoa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kwa namna iliyo wazi na inayotamkika katika Kiswahili.
- issue: Maana ya כֶּסֶף עוֹבֵר אִישׁ
  choice: fedha ya kila mtu anayehesabiwa
  alternative: fedha ya kila mtu anayepita
  rationale: Muktadha wa malipo ya hekalu na mlingano wa Kutoka 30 unaunga mkono sensa, lakini tanbihi inaweka wazi maana halisi ya kitenzi na kutokamilika kwa uhakika huo.
- issue: Uhusiano wa כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ na nadhiri
  choice: fedha ya tathmini ya watu
  alternative: fedha ya tathmini za nadhiri za watu
  rationale: Walawi 27 huenda ndiyo msingi, lakini neno “nadhiri” halipo wazi katika mstari huu; kwa hiyo halijaingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Fedha” imetumiwa kwa כֶּסֶף kwa sababu hapa ni mapato au malipo, si lazima kusisitiza metali yenyewe. Sentensi imeachwa wazi kwa kistari mwishoni kwa sababu wazo linaendelea katika mstari unaofuata.
