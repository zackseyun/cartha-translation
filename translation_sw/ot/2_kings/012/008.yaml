  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: sw
  text: Mfalme Yehoashi akamwita Yehoyada, kuhani, na makuhani, akawaambia, “Kwa nini hamfanyi ukarabati wa nyumba[a]? Sasa msipokee fedha kutoka kwa watu mnaowajua[b], bali mzitoe kwa ajili ya ukarabati wa nyumba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hekalu la BWANA.
    reason: cultural_note
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “watu mnaowajua” ni gumu. Katika muktadha huu linaweza pia kumaanisha “wafadhili” au “wachangiaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Katika muktadha huu קרא ni kuita watu waje mbele ya mfalme; “akawaita” ni ya kawaida na inaendeleza simulizi kwa ufasaha.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: Mfalme Yehoashi
  rationale: Jina limetoholewa kwa namna inayofaa Kiswahili, huku cheo kikitangulia jina kwa mtindo wa kawaida.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: Yehoyada kuhani na makuhani
  rationale: Tafsiri inahifadhi kutajwa kwa Yehoyada na kisha kundi la makuhani bila kuongeza neno “wengine,” ambalo halimo wazi katika Kiebrania.
- source_word: אֵינְכֶם מְחַזְּקִים אֶת בֶּדֶק הַבָּיִת
  choice: hamrekebishi sehemu zilizoharibika za nyumba
  rationale: חזק hapa ina maana ya kufanya ukarabati, na בדק הבית huelekeza kwenye sehemu zenye uharibifu au nyufa zinazohitaji kurekebishwa. Usemi huu ni wazi na wa asili kwa Kiswahili.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito kutoka katika swali la kukemea kwenda katika agizo jipya.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: msipokee tena fedha
  rationale: כסף katika muktadha huu ni fedha, si lazima metali ya fedha. “Tena” inaeleza kwa kawaida kwamba utaratibu uliokuwapo unasitishwa, kama inavyodokezwa na muktadha.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: kutoka kwa wafadhili wenu
  rationale: מַכָּרֵיכֶם ni neno gumu; katika muktadha wa ukusanyaji wa fedha linaweza kueleweka kuwa watu waliowapa makuhani fedha. Tanbihi inadumisha uwezekano wa maana halisi zaidi ya “watu mnaowajua.”
- source_word: כִּי
  choice: bali
  rationale: Hapa כִּי inaleta agizo mbadala lenye utofautishaji, hivyo “bali” huwasilisha uhusiano huo vizuri.
- source_word: לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: mzikabidhi kwa ajili ya kuirekebisha nyumba
  rationale: Kiambishi cha wingi katika “mzikabidhi” kinarejelea fedha kama nomino ya ngeli ya 10; usemi unaonyesha kwamba fedha hizo zielekezwe kwenye ukarabati.
theological_decisions:
- issue: Maana ya הַבַּיִת katika muktadha
  choice: “nyumba” katika matini, ikiwa na tanbihi kwamba ni hekalu
  alternative: kutafsiri moja kwa moja “hekalu”
  rationale: Kiebrania kinasema “nyumba,” lakini muktadha unaonyesha nyumba ya BWANA, yaani hekalu. Kuhifadhi “nyumba” kunafuata tamathali ya chanzo bila kuficha maana kwa msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Sehemu zilizoharibika” huepuka usemi mgumu wa “mianya ya nyumba,” na “mzikabidhi” ni ya kawaida katika muktadha wa fedha za kazi maalumu.
