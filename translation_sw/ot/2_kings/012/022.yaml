base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: sw
  text: Yozabadi mwana wa Shimeathi na Yehozabadi mwana wa Shomeri, watumishi wake[a], walimpiga, naye akafa. Wakamzika pamoja na baba zake katika Mji wa Daudi, na Amazia mwanawe akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maafisa wake.” Neno la Kiebrania עֲבָדָיו linaweza kumaanisha watumishi au wahudumu wa ikulu, kutegemeana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד בֶּן שִׁמְעָת וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: Yozabadi mwana wa Shimeathi na Yehozabadi mwana wa Shomeri
  rationale: Majina yamenukuliwa kwa maumbo yanayofaa mfumo wa sauti na matumizi ya kawaida ya majina ya Biblia katika Kiswahili; muundo wa ukoo בֶּן umetafsiriwa kwa kawaida kuwa “mwana wa.”
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עֶבֶד inaweza kumaanisha mtumishi, mtumwa, au mhudumu/afisa wa kifalme. Katika muktadha huu wa njama ya ikulu, “watumishi wake” ni pana na ya kawaida bila kudai moja kwa moja kwamba walikuwa watumwa.
- source_word: הִכֻּהוּ וַיָּמֹת
  choice: walimpiga, naye akafa
  rationale: 'Tafsiri hii inadumisha mfuatano wa vitenzi vya Kiebrania: kwanza walimpiga, kisha akafa. Haijumlishi mapema וַיָּמֹת ndani ya maana ya “walimuua.”'
- source_word: וַיִּקְבְּרוּ אֹתוֹ עִם אֲבֹתָיו
  choice: Wakamzika pamoja na babu zake
  rationale: “Babu zake” hapa huwasilisha אֲבֹתָיו kama waliomtangulia katika ukoo wa kifalme, si baba yake wa karibu tu, huku ikihifadhi wazo la kuzikwa pamoja nao.
- source_word: בְּעִיר דָּוִד
  choice: katika Mji wa Daudi
  rationale: Hili ni jina la mahali linalotambulika; herufi kubwa inaonyesha matumizi yake kama jina maalumu.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: na Amazia mwanawe akatawala mahali pake
  rationale: מלך katika taarifa ya urithi wa ufalme imetafsiriwa kwa “akatawala”; תַּחְתָּיו ni “mahali pake,” yaani alimrithi katika ufalme.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumika kwa mtindo wa masimulizi ulio wazi, wa sasa na wenye hadhi. Kiunganishi cha mwanzo hakijatafsiriwa kwa “Na” kwa sababu mstari huu unaendelea moja kwa moja kutoka sentensi iliyotangulia; uhusiano wa majina na kitendo unabaki wazi. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
