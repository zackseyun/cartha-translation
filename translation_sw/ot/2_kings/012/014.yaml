  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: sw
  text: Hata hivyo, fedha iliyoletwa katika nyumba ya Yahwe haikutumiwa kutengeneza kwa ajili ya nyumba hiyo mabeseni ya fedha[a], vikatio vya tambi za taa[b], mabakuli ya kunyunyizia[c], tarumbeta, wala chombo chochote cha dhahabu au cha fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabakuli ya fedha.”
    reason: lexical_alternative
  - marker: b
    text: Au “vifaa vya kupunguzia tambi za taa.” Neno la Kiebrania huenda linamaanisha kifaa kilichotumiwa kutunza taa.
    reason: lexical_alternative
  - marker: c
    text: Au kwa ufupi, “mabakuli.” Tafsiri katika mstari inaonyesha matumizi yake yanayowezekana katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hata hivyo
  rationale: Inaonyesha utofautishaji na mstari uliotangulia kwa Kiswahili cha kawaida na chenye heshima.
- source_word: יֵעָשֶׂה
  choice: haikutumiwa kutengeneza
  rationale: Muundo huu wa Kiswahili unawakilisha hali ya kutendwa ya Kiebrania kwa njia ya asili, huku ukihusianisha fedha na orodha ya vitu vilivyokatazwa kutengenezwa nayo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Inahifadhi jina rasmi la hekalu kama ‘nyumba’ badala ya kulifafanua moja kwa moja kuwa hekalu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Umbo ‘Yahwe’ linaandika jina la Mungu kwa tahajia inayofaa Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: סִפּוֹת כֶּסֶף
  choice: mabeseni ya fedha
  rationale: ‘Mabeseni’ yanafaa kwa vyombo vya matumizi ya hekaluni na yanatofautisha neno hili na מִזְרָקוֹת linalofuata.
- source_word: מְזַמְּרוֹת
  choice: mikasi ya tambi za taa
  rationale: Katika muktadha wa vifaa vya hekaluni, neno hili linaelekea kumaanisha vifaa vya kupunguza au kutunza tambi za taa.
- source_word: מִזְרָקוֹת
  choice: mabakuli ya kunyunyizia
  rationale: Tafsiri hii inaonyesha aina ya chombo na matumizi yake yanayowezekana katika ibada bila kuyafanya kuwa hakika kabisa.
- source_word: חֲצֹצְרוֹת
  choice: tarumbeta
  rationale: Hili ni neno la kawaida la Kiswahili kwa tarumbeta za chuma zilizotumiwa katika ibada.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: chombo chochote cha dhahabu au cha fedha
  rationale: ‘Chombo’ linahifadhi upana wa כְּלִי na umoja wenye maana ya kila kimoja katika Kiebrania.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: fedha iliyoletwa katika
  rationale: ‘Fedha’ inaweza kueleweka kama mali ya thamani au pesa za matumizi, kama ilivyo katika muktadha huu wa usimamizi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kwa umbo linalosomeka kwa kawaida katika Kiswahili bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘haikutumiwa kutengeneza’ umechaguliwa ili kuepuka sentensi nzito ya kutendwa huku maana ya Kiebrania ikihifadhiwa.
