  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: sw
  text: Wakakabidhi fedha iliyopimwa[a] kwa wafanyakazi waliopewa usimamizi wa nyumba ya Yahwe[b]; hao wakazitoa kwa mafundi wa mbao na wajenzi waliokuwa wakifanya kazi katika nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fedha iliyopimwa kwa uzito”; neno la Kiebrania linaweza pia kueleweka kuwa fedha iliyohesabiwa au iliyopimwa kiasi.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, kihalisi, “katika mkono wa”; yaani, waliikabidhi chini ya uangalizi wao. Kiebrania kina jina la Mungu YHWH, lililohamishwa hapa kuwa “Yahwe.”
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: fedha iliyopimwa
  rationale: Neno מְתֻכָּן linaonyesha kitu kilichopimwa au kuandaliwa kwa kiwango maalumu. “Fedha iliyopimwa” huhifadhi wazo hilo bila kulazimisha kama kipimo kilikuwa cha uzito, hesabu, au kiasi kingine.
- source_word: עַל יַד
  choice: mikononi mwa
  rationale: Hii huhifadhi sitiari ya Kiebrania ya kukabidhi kitu katika mamlaka au uangalizi wa mtu, na bado ni usemi wa kawaida wa Kiswahili.
- source_word: עֹשֵׂי הַמְּלָאכָה הַפְּקֻדִים בֵּית יְהוָה
  choice: wafanyakazi waliowekwa kuisimamia nyumba ya Yahwe
  rationale: Kirai hiki kinawaeleza watu wa kazi walioteuliwa au kukabidhiwa wajibu kuhusu hekalu. “Kuisimamia” huonyesha wajibu wao bila kuwafanya tu kuwa vibarua wa kawaida.
- source_word: וַיּוֹצִיאֻהוּ
  choice: wakaitoa kama malipo
  rationale: Kitenzi kimsingi ni “kuitoa,” lakini katika muktadha wa fedha kinamaanisha kuitoa ili kulipa. Tafsiri hii huhifadhi picha ya kuitoa huku ikieleza matumizi yake ya kifedha.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: kwa mafundi wa mbao
  rationale: Kirai hicho kinawataja kwa wazi mafundi wanaofanya kazi ya mbao; “mafundi wa mbao” ni sahihi na ya kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: וְלַבֹּנִים
  choice: na wajenzi
  rationale: בֹּנִים ni neno pana kwa watu wanaojenga. “Wajenzi” huepuka kulibana kuwa waashi pekee.
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: waliokuwa wakifanya kazi katika nyumba ya Yahwe
  rationale: Tafsiri hii huonyesha shughuli yao katika jengo hilo bila kuongeza wazi kwamba walikuwa wakilikarabati, ingawa muktadha mpana unaonyesha hivyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kwa tahajia ya Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi YHWH. “Yahwe” hulihifadhi kama jina na hutumia tahajia inayosomeka kwa kawaida katika Kiswahili, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nyumba ya Yahwe” huhifadhi istilahi ya chanzo, ambayo katika muktadha huu ni hekalu. Kiambishi “nao” katika kishazi cha pili kimeachwa bila kufafanuliwa zaidi ili kutolazimisha utambulisho wa wahusika ambao Kiebrania kinauacha utegeme muktadha.
