  - severity: low
    issue: Dokezo b lasema Kiebrania "kwa neno moja moja" ni "akapanda kutoka juu ya Yerusalemu."
    rationale: Hii si uwakilishi sahihi wa moja kwa moja wa וַיַּעַל מֵעַל יְרוּשָׁלִָם. Dokezo liseme kwa uangalifu, "akaenda juu/akaondoka kutoka juu ya Yerusalemu," na lieleze kwamba ni usemi unaomaanisha kujiondoa mbali na mji.
