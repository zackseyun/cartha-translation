  to: Kisha Yehoashi mfalme wa Yuda akachukua vitu vyote vitakatifu ambavyo Yehoshafati, Yehoramu na Ahazia—mababu zake[a], wafalme wa Yuda—walikuwa wameviweka wakfu, pamoja na vitu vyake mwenyewe vitakatifu na dhahabu yote iliyopatikana katika hazina za nyumba ya Yahwe na za nyumba ya mfalme. Akavituma vyote kwa Hazaeli mfalme wa Aramu; kisha Hazaeli akaondoka kutoka Yerusalemu.[b]
