language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: sw
  text: Kisha Yehoashi mfalme wa Yuda akachukua vitu vyote vitakatifu ambavyo Yehoshafati, Yehoramu na Ahazia—mababu zake[a], wafalme wa Yuda—walikuwa wameviweka wakfu, pamoja na vitu vyake mwenyewe vitakatifu na dhahabu yote iliyopatikana katika hazina za nyumba ya Yahwe na za nyumba ya mfalme. Akavituma vyote kwa Hazaeli mfalme wa Aramu; kisha Hazaeli akaondoka kutoka Yerusalemu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mababu zake” hapa ni mababu au watangulizi wake katika ukoo wa kifalme.
    reason: cultural_note
  - marker: b
    text: Kiebrania kinasema, “akaenda juu kutoka juu ya Yerusalemu.” Huu ni usemi unaoonyesha kwamba Hazaeli alijiondoa mbali na Yerusalemu na kuacha hatua yake dhidi ya mji; pia unaweza kutafsiriwa, “akaondoka kutoka Yerusalemu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח katika muktadha huu kina maana ya moja kwa moja ya kuchukua; hakidokezi lazima uporaji au matumizi ya nguvu.
- source_word: הַקֳּדָשִׁים
  choice: vitu vyote vitakatifu
  rationale: Hurejelea vitu vilivyotengwa kwa matumizi matakatifu, bila kubainisha aina yake zaidi ya maandishi ya Kiebrania.
- source_word: הִקְדִּישׁוּ
  choice: walikuwa wameviweka wakfu
  rationale: Hifili ya קדש inaeleza kuweka vitu kando kwa kusudi takatifu; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: אֲבֹתָיו
  choice: mababu zake
  rationale: Katika muktadha wa ukoo wa kifalme, neno hili linamaanisha waliomtangulia katika nasaba, si baba zake wa moja kwa moja pekee.
- source_word: קֳדָשָׁיו
  choice: vitu vyake mwenyewe vitakatifu
  rationale: Kiambishi cha umilikaji kinaonyesha vitu ambavyo Yehoashi mwenyewe alikuwa ameweka wakfu, huku uchaguzi ukidumisha uhusiano wa kileksia na הַקֳּדָשִׁים.
- source_word: הַנִּמְצָא
  choice: iliyopatikana
  rationale: Hutoa maana ya moja kwa moja ya dhahabu iliyokuwamo au kupatikana katika hazina bila kuongeza dhana ya kuwa ‘inapatikana kwa matumizi.’
- source_word: בְּאֹצְרוֹת
  choice: katika hazina
  rationale: אוצרות hapa ni vyumba au mahali pa kuhifadhia mali za thamani; ‘hazina’ ni usemi wa kawaida wa Kiswahili katika muktadha wa hekalu na jumba la mfalme.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Inahifadhi picha halisi ya Kiebrania, ‘nyumba ya Yahwe,’ ambayo katika muktadha inarejelea hekalu.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Inahifadhi ulinganifu wa Kiebrania kati ya nyumba ya Yahwe na nyumba ya mfalme, ingawa nyumba ya mfalme ni jumba la kifalme.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: Akavituma vyote kwa Hazaeli
  rationale: Kiambishi cha ngeli ya vitu na ‘vyote’ hukusanya kwa uwazi vitu na dhahabu zilizotajwa katika orodha iliyotangulia.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: kisha Hazaeli akaondoka Yerusalemu
  rationale: Nahau hiyo inaonyesha kwamba Hazaeli aliacha kusonga dhidi ya Yerusalemu. ‘Kisha’ huwakilisha mfuatano wa waw bila kulazimisha uhusiano wa kisababishi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia jina binafsi la agano יהוה. ‘Yahwe’ hulitofautisha na cheo ‘Bwana’ na kulikaribia umbo la jina la Kiebrania bila kuingiza mapokeo ya dhehebu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Yehoashi, Yehoshafati, Yehoramu, Ahazia, Hazaeli, Aramu na Yerusalemu. Muundo umegawanywa katika sentensi mbili ili orodha ndefu ibaki wazi bila kupoteza mfuatano wa simulizi.'
