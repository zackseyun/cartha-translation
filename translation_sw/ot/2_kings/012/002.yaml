  text: בִּ/שְׁנַת שֶׁ֤בַע לְ/יֵהוּא֙ מָלַ֣ךְ יְהוֹאָ֔שׁ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּ/ירֽוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: sw
  text: Katika mwaka wa saba wa Yehu, Yehoashi akawa mfalme, naye akatawala miaka arobaini huko Yerusalemu. Mama yake aliitwa Sibia, mwenyeji wa Beer-sheba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: Katika mwaka wa saba wa Yehu
  rationale: Hii ni fomula ya kawaida ya kutaja wakati kwa kuhesabu miaka ya utawala wa mfalme; tafsiri hii ni ya asili katika Kiswahili na inadumisha rejeo la kihistoria.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: Yehoashi akawa mfalme
  rationale: Katika fomula ya kutawazwa, kitenzi מָלַךְ kina maana ya kuanza kuwa mfalme; “akawa mfalme” hutofautisha mwanzo wa utawala na muda wake unaotajwa baadaye.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: naye akatawala miaka arobaini
  rationale: Hapa מָלַךְ inaeleza muda wa utawala, hivyo “akatawala” ni sahihi na ya kawaida katika Kiswahili.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi בְּ kinaonyesha mahali; “huko” kinaunganisha kwa kawaida mahali pa utawala na sentensi iliyotangulia.
- source_word: וְשֵׁם אִמּוֹ
  choice: Mama yake aliitwa
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kuwasilisha taarifa ya Kiebrania kuhusu jina la mama yake.
- source_word: צִבְיָה
  choice: Sibia
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likibaki karibu na matamshi ya Kiebrania.
- source_word: מִבְּאֵר שָׁבַע
  choice: mwenyeji wa Beer-sheba
  rationale: Kihusishi מִן kinaonyesha asili yake ya mahali. “Mwenyeji wa” huepuka uwezekano wa kusoma “kutoka” kama safari ya muda mfupi na kueleza kwa asili kwamba alitoka Beer-sheba.
