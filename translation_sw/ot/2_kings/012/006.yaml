base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: sw
  text: Makuhani wachukue kwa ajili yao wenyewe[a], kila mmoja kutoka kwa mtoaji wake, nao watengeneze sehemu zilizoharibika za nyumba[b], popote uharibifu utakapopatikana humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa mfahamika wake.” Neno la Kiebrania linaweza kumaanisha, kwa maana halisi zaidi, mtu anayejulikana kwake; lakini katika muktadha huu wa ukusanyaji huenda linamaanisha mtu ambaye kila kuhani alipokea mchango kutoka kwake.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa ni hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם הַכֹּהֲנִים
  choice: Makuhani na wajichukulie
  rationale: Kauli ya Kiebrania ina nguvu ya agizo, na לָהֶם huonyesha kwamba makuhani wenyewe wanapokea fedha hizo. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: Neno hili limetumiwa kwa maana ya kugawa jukumu kwa kila kuhani mmoja mmoja; tafsiri hii ni ya asili zaidi kuliko ‘kila mwanamume’ hapa.
- source_word: מֵאֵת מַכָּרוֹ
  choice: kutoka kwa mtoaji wake
  rationale: Katika muktadha wa ukusanyaji wa fedha, neno מַכָּר huenda linamaanisha mtu ambaye kuhani alipokea mchango kutoka kwake. Maana halisi zaidi ya ‘mtu anayemfahamu’ imehifadhiwa katika tanbihi.
- source_word: יְחַזְּקוּ
  choice: warekebishe
  rationale: Ingawa kitenzi kimsingi humaanisha ‘kuimarisha,’ katika muktadha wa jengo humaanisha kufanya matengenezo.
- source_word: בֶּדֶק הַבַּיִת
  choice: sehemu zilizoharibika za nyumba
  rationale: בֶּדֶק ni ufa, kasoro, au hali ya uharibifu inayohitaji kurekebishwa. Kiswahili hiki kinaeleza kwa kawaida kile kinachotakiwa kutengenezwa huku kikihifadhi ‘nyumba.’
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: popote uharibifu utakapopatikana humo
  rationale: Kauli hii huhusisha matengenezo na kila mahali ndani ya jengo ambapo uharibifu utagunduliwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Warekebishe sehemu zilizoharibika’ ni usemi wa kawaida kuliko tafsiri ya neno kwa neno ya ‘waimarishe uharibifu,’ na ‘humo’ huepuka urudiaji usio wa lazima.
