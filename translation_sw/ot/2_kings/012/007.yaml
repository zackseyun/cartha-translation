lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kazi ya kifungu cha simulizi kinachoanzisha hatua mpya bila kuongeza neno la wazi la wakati lisilopatikana katika Kiebrania.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: katika mwaka wa ishirini na tatu
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa kutaja mwaka wa utawala.
- source_word: לַמֶּלֶךְ יְהוֹאָשׁ
  choice: wa Mfalme Yehoashi
  rationale: Herufi lamed katika fomula hii huonyesha mwaka unaohesabiwa katika utawala wa mfalme; muundo huu ni wa kawaida kwa Kiswahili.
- source_word: לֹא חִזְּקוּ
  choice: walikuwa bado hawajarekebisha
  rationale: Kitenzi חזק kwa msingi ni ‘kuimarisha,’ lakini pamoja na בדק הבית kinahusu kufanya matengenezo ya jengo. ‘Bado’ huonyesha kwamba kufikia mwaka huo kazi haikuwa imefanywa.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya nomino hii.
- source_word: בֶּדֶק הַבָּיִת
  choice: sehemu zilizoharibika za nyumba
  rationale: בדק hurejelea ufa, mwanya, au hali iliyoharibika inayohitaji matengenezo. Usemi huu unaeleweka kwa urahisi na hauichukulii nomino hiyo kuwa ‘matengenezo’ yenyewe.
