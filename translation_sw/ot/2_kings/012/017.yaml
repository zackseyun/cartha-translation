  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: sw
  text: Fedha za sadaka ya hatia na fedha za sadaka za dhambi hazikuletwa[a] katika nyumba ya Yahweh[b]; zilikuwa za makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “hazikupaswa kuletwa.”'
    reason: Huhifadhi uwezekano kwamba umbo la Kiebrania linaeleza kanuni ya utaratibu badala ya taarifa tu ya kilichofanyika.
  - marker: b
    text: Yaani, hekalu.
    reason: Hufafanua usemi wa karibu na Kiebrania, “nyumba ya Yahweh,” katika muktadha wake wa hekalu.
lexical_decisions:
- source_word: כֶּסֶף
  choice: fedha
  rationale: Neno linaweza kumaanisha ‘fedha’ kama metali au kama pesa. Katika muktadha huu wa mapato ya hekalu, ‘fedha’ linaeleweka kwa kawaida kuwa pesa huku likihifadhi upana wa neno la Kiebrania.
- source_word: אָשָׁם
  choice: sadaka ya hatia
  rationale: Katika muktadha wa dhabihu, neno hili linataja sadaka inayohusiana na hatia na fidia; ‘sadaka ya hatia’ ni tafsiri iliyo wazi na inayotambulika.
- source_word: חַטָּאוֹת
  choice: sadaka za dhambi
  rationale: Hapa wingi unataja aina ya sadaka, si dhambi zenyewe. Tafsiri hii inadumisha jina la kawaida la dhabihu bila kulifanya kuwa ‘sadaka za utakaso,’ ambalo pia huweza kupendekezwa katika miktadha ya kikuhani.
- source_word: לֹא יוּבָא
  choice: hazikuletwa
  rationale: Kitenzi ni hofali kisichotimilika chenye ukanushi. Katika muktadha huu wa simulizi, kinaweza kueleza utaratibu uliofuatwa; ‘hazikuletwa’ ni Kiswahili cha kawaida, huku uwezekano wa maana ya kanuni ukibainishwa katika tanbihi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Tafsiri ya karibu ya kirai cha Kiebrania ni ‘nyumba ya Yahweh’; katika muktadha huu ni hekalu.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: zilikuwa za makuhani
  rationale: Kirai kinaonyesha umiliki au mgao. Wingi ‘zilikuwa’ unarejelea fedha za makundi hayo mawili na kuhifadhi muundo wa Kiebrania kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; ‘Yahweh’ hulitofautisha na cheo ‘Bwana’ na kufuata safu ya ushauri iliyotolewa.
- issue: 'Nguvu ya לֹא יוּבָא: taarifa au kanuni'
  choice: hazikuletwa
  alternative: hazikupaswa kuletwa
  rationale: Umbo la Kiebrania linaweza kusomwa kama taarifa ya utaratibu uliokuwapo au kama agizo la kawaida. Muktadha wa simulizi unapendelea taarifa, lakini tanbihi inadumisha uwezekano wa maana ya wajibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na wazi; istilahi za dhabihu zimehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
