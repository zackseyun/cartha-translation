id: 2KI.12.10
reference: 2 Kings 12:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: sw
  text: Ndipo Yehoyada kuhani akachukua sanduku moja, akatoboa tundu katika kifuniko chake[a], na kuliweka kando ya madhabahu, upande wa kulia mtu anapoingia katika nyumba ya Yahweh[b]. Makuhani waliolinda kizingiti wakaweka humo fedha yote[c] iliyoletwa katika nyumba ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika mlango wake.” Katika muktadha huu yaelekea kinachomaanishwa ni kifuniko cha sanduku.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mtu anapoingia”; yaani, sanduku lilikuwa upande wa kulia kwa mtazamo wa mtu aliyeingia katika nyumba ya Yahweh.
    reason: lexical_clarification
  - marker: c
    text: Neno la Kiebrania linaweza kumaanisha metali ya fedha au pesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: sanduku
  rationale: Katika muktadha wa kukusanya michango ya hekalu, neno hili linamaanisha chombo cha kuhifadhia fedha; “sanduku” ni la kawaida na halileti maana maalumu ya Sanduku la Agano.
- source_word: וַיִּקֹּב חֹר
  choice: akatoboa tundu
  rationale: Muunganiko huu unaeleza kutengeneza uwazi kwa kutoboa, na usemi huu ni wa kawaida katika Kiswahili.
- source_word: בְּדַלְתּוֹ
  choice: katika kifuniko chake
  rationale: Ingawa דלת kwa kawaida ni “mlango,” hapa kinachokusudiwa yaelekea ni sehemu inayofunika sanduku. Maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: kando ya madhabahu
  rationale: אצל huonyesha ukaribu wa mahali; “kando ya” ni wazi na ya asili.
- source_word: בימין בְּבוֹא אִישׁ
  choice: upande wa kulia mtu anapoingia
  rationale: Usemi huu unaonyesha mahali pa sanduku kwa mtazamo wa mtu anayeingia, huku ukihifadhi umoja wa אִישׁ kwa Kiswahili cha kawaida.
- source_word: שֹׁמְרֵי הַסַּף
  choice: waliolinda kizingiti
  rationale: Huhifadhi picha halisi ya walinzi wa kizingiti na jukumu lao la kulinda mwingilio wa hekalu.
- source_word: כָּל הַכֶּסֶף
  choice: fedha yote
  rationale: '“Fedha” huhifadhi kwa kufaa maana mbili zinazowezekana za כסף: metali ya fedha na pesa.'
- source_word: הַמּוּבָא
  choice: iliyoletwa
  rationale: Huwakilisha kwa kawaida hali ya kutendwa ya participio ya Hophal ya בוא.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Huhifadhi sitiari ya Kiebrania ya “nyumba” badala ya kuibadilisha moja kwa moja kuwa “hekalu.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa tetragramatoni limetafsiriwa kama jina binafsi “Yahweh.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu, hivyo “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Umoja wa אִישׁ katika usemi wa kuelekeza mahali
  choice: mtu anapoingia
  alternative: unapoingia au yeyote anapoingia
  rationale: “Mtu” ni sawa la kawaida la Kiswahili kwa אִישׁ katika matumizi haya ya jumla; huhifadhi umoja bila kugeuza usemi kuwa nafsi ya pili au kuutia mkazo usiokuwapo wa “yeyote.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi umewekwa kwa “aka-” ili kudumisha mtiririko wa simulizi; “fedha” imechaguliwa kwa sababu huhifadhi utata halisi kati ya silver na money.
