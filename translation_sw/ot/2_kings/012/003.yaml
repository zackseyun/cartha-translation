base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: sw
  text: Yehoashi alifanya yaliyo sawa machoni pa Yahwe siku zote ambazo Yehoyada, kuhani, alimfundisha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: alifanya
  rationale: Katika kauli hii ya kutathmini mwenendo wa mfalme, kitenzi hiki huungana kwa kawaida na ‘yaliyo sawa.’
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Kivumishi kimetumika kama nomino kumaanisha jambo au matendo yanayokubalika kimaadili; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Inahifadhi sitiari ya Kiebrania ya tathmini ya Mungu kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo.
- source_word: כָּל יָמָיו
  choice: siku zake zote
  rationale: Tafsiri ya karibu na ya asili inayohifadhi upeo wa muda bila kuongeza maneno kama ‘maisha yake.’
- source_word: אֲשֶׁר
  choice: kwa sababu
  rationale: Katika sentensi kuu, kiunganishi hiki kimeelezwa kuwa kinaonyesha msingi wa mwenendo wa Yehoashi chini ya mafundisho ya Yehoyada; muundo wa karibu zaidi unaoweza kuifanya kauli ihusishe muda umehifadhiwa katika tanbihi.
- source_word: הוֹרָהוּ
  choice: alimfundisha
  rationale: Hifili ya ירה hapa ina maana ya kufundisha au kuelekeza; ‘alimfundisha’ ni ya kawaida na inafaa uhusiano wa mwongozo.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Utohozi wa jina la Kiebrania unaofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Cheo kimetangulizwa mbele ya jina kwa mpangilio wa kawaida wa Kiswahili.
theological_decisions:
- issue: Je, kauli ya mwisho inaeleza sababu ya uadilifu wa Yehoashi au inauwekea mpaka wa muda?
  choice: Matini kuu inaeleza kuwa mafundisho ya Yehoyada ndiyo sababu ya mwenendo wake unaofaa.
  alternative: Kauli inaweza kueleweka kwa ukaribu zaidi kuwa Yehoashi alitenda yaliyo sawa katika siku zote ambazo Yehoyada alimfundisha, hivyo ikipunguza upeo wa ‘siku zake zote.’
  rationale: אֲשֶׁר ni kiwakilishi husishi chenye uhusiano usioelezwa wazi katika muundo huu. Tafsiri ya sababu ni laini katika Kiswahili, lakini tanbihi huhifadhi uwezekano halisi wa uhusiano wa muda na mvutano wa simulizi bila kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Kauli ‘yaliyo sawa machoni pa Yahwe’ inahifadhi sitiari ya Kiebrania huku ikibaki wazi kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
