  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: sw
  text: Ndipo Hazaeli, mfalme wa Aramu,[a] akapanda na kupigana dhidi ya Gathi, akauteka. Hazaeli akaelekeza nia yake kupanda dhidi ya Yerusalemu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aramu ni jina la Kiebrania la eneo ambalo kwa desturi mara nyingi huitwa Siria.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania: “akauelekeza uso wake,” yaani, alijielekeza au aliazimia kupanda dhidi ya Yerusalemu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: יַעֲלֶה
  choice: akapanda
  rationale: Inahifadhi maana ya msingi ya kwenda juu na pia muktadha wa kusonga kijeshi kuelekea mji.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazaeli, mfalme wa Aramu
  rationale: Jina la mtu na jina la eneo yamenukuliwa kwa namna iliyozoeleka katika Kiswahili; Aramu huakisi moja kwa moja jina la Kiebrania.
- source_word: וַיִּלָּחֶם עַל
  choice: akapigana na
  rationale: Muundo huu unaonyesha kupigana dhidi ya mahali au watu wake; Kiswahili hiki ni wazi na cha asili.
- source_word: גַּת
  choice: Gathi
  rationale: Namna ya jina la mahali iliyozoeleka katika tafsiri za Kiswahili.
- source_word: וַיִּלְכְּדָהּ
  choice: na kuuteka
  rationale: Kitenzi kinaashiria kuutwaa mji kwa nguvu; kiambishi 'u-' kinarejelea mji wa Gathi.
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: akaelekeza nia yake
  rationale: Huwasilisha kwa Kiswahili cha asili nahau ya Kiebrania ya kuelekeza uso, yenye maana ya kujielekeza au kuazimia kufanya jambo, bila kuondoa kabisa wazo la mwelekeo.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: kupanda dhidi ya Yerusalemu
  rationale: Inahifadhi lugha ya kupanda kuelekea Yerusalemu na mwelekeo wa uhasama unaoonyeshwa na kihusishi.
