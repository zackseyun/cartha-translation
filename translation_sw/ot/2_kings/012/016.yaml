base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/016.yaml
  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: sw
  text: Lakini hawakufanya hesabu na watu[a] ambao waliokabidhiwa fedha[b] ili wawape wafanyakazi, kwa maana walitenda kwa uaminifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuwataka watu hao watoe hesabu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ambao walipewa fedha mikononi mwao,” nahau yenye maana ya kukabidhi fedha chini ya usimamizi wao.'
    reason: cultural_note
  - marker: c
    text: “Kwa uaminifu” pia inaweza kutafsiriwa “kwa unyoofu” au “kwa uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: hawakufanya hesabu na
  rationale: Kauli hii inadumisha wazo la kuhesabu au kusawazisha hesabu na wasimamizi wa fedha, bila kuipanua moja kwa moja kuwa dai rasmi la kutoa taarifa.
- source_word: הָאֲנָשִׁים
  choice: watu
  rationale: Katika Kiswahili sanifu, “watu” hurejelea kwa kawaida kundi mahususi la mawakala au wasimamizi; “wanaume” hapa ingesisitiza jinsia kuliko kazi yao katika muktadha.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: waliowakabidhi fedha
  rationale: Hii inatoa kwa Kiswahili cha kawaida maana ya nahau ya Kiebrania ya kuweka fedha “mikononi mwao,” yaani chini ya usimamizi wao.
- source_word: הַכֶּסֶף
  choice: fedha
  rationale: Neno la Kiebrania linaweza kumaanisha “fedha” kama madini au pesa; katika muktadha wa gharama za ukarabati, “fedha” kwa maana ya pesa ndiyo inayofaa.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: wale waliofanya kazi
  rationale: Hii inaonyesha wafanyakazi waliotekeleza kazi ya ukarabati na ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: בֶאֱמֻנָה
  choice: kwa uaminifu
  rationale: Uchaguzi huu unahifadhi maana ya kutegemeka na uadilifu katika kushughulikia fedha, bila kuifinya kuwa kutosema uongo pekee.
- source_word: הֵם עֹשִׂים
  choice: walitenda
  rationale: Kitenzi hiki kinaeleza mwenendo wao kwa ujumla na kinaungana kwa kawaida na kirai “kwa uaminifu.”
