base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: sw
  text: Matendo mengine ya Yoashi na yote aliyoyafanya, je, hayajaandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Yuda[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kitabu cha Kumbukumbu za Wafalme wa Yuda.” Usemi wa Kiebrania unaweza kumaanisha kumbukumbu rasmi ya kifalme au historia iliyoandikwa kwa mpangilio wa nyakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Matendo mengine ya Yoashi
  rationale: יֶתֶר hurejelea yaliyobaki au mengine, na דִּבְרֵי katika muhtasari huu wa utawala humaanisha mambo au matendo ya mfalme. “Matendo mengine” ni Kiswahili cha kawaida kinachowasilisha maana ya fomula hiyo bila kuitafsiri neno kwa neno kama “maneno mengine.”
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: na yote aliyoyafanya
  rationale: Tafsiri hii inadumisha maana jumuishi ya כָּל na muundo wa kishazi cha uhusiano, huku ikirejelea matendo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, hayajaandikwa
  rationale: הֲלוֹא huanzisha swali la balagha linalotarajia jibu la kukubali. “Hayajaandikwa” huonyesha hali ya mambo hayo kuwa yameandikwa na hupatana na nomino ya ngeli ya matendo.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: katika Kitabu cha Mambo ya Nyakati
  rationale: Ingawa עַל kwa msingi ni “juu ya,” katika fomula ya kumbukumbu kilichoandikwa huwa “katika” kitabu. דִּבְרֵי הַיָּמִים ni jina la kumbukumbu au historia ya matukio ya siku mbalimbali; “Mambo ya Nyakati” ni tafsiri sahihi na iliyozoeleka.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: za Wafalme wa Yuda
  rationale: לְ hapa huonyesha uhusiano wa kumbukumbu hizo na wafalme wa Yuda. Muundo wa “za Wafalme wa Yuda” ni wa asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Swali la balagha la Kiebrania limehifadhiwa. Alama ya tanbihi imewekwa baada ya jina la kitabu, kwa kuwa tanbihi inafafanua usemi דִּבְרֵי הַיָּמִים, si jina la Yoashi.
