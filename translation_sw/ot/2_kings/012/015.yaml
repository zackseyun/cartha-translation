  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: sw
  text: Kwa maana waliwapa wafanyakazi fedha hiyo, nao wakaitumia kuikarabati nyumba ya Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hekalu la Yahwe.
    reason: Ufafanuzi wa nahau ya Kiebrania ‘nyumba ya Yahwe.’
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu au maelezo ya kwa nini hawakutakiwa kutoa hesabu katika mstari uliotangulia.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: watu waliofanya kazi
  rationale: Inahifadhi maana ya moja kwa moja, ‘wale wanaofanya kazi,’ kwa Kiswahili cha kawaida bila kubainisha jinsia isiyobainishwa na Kiebrania.
- source_word: יִתְּנֻהוּ
  choice: waliwapa ... fedha hizo
  rationale: Kitenzi cha Kiebrania kina kiambishi cha yambwa cha umoja kinachorejelea fedha zilizotajwa katika muktadha; ‘fedha hizo’ huifanya rejea hiyo iwe wazi na ya asili katika Kiswahili.
- source_word: וְחִזְּקוּ
  choice: wakaitumia kuikarabati
  rationale: Ingawa maana ya msingi ni ‘kuimarisha,’ katika muktadha wa jengo kitenzi kinamaanisha kurekebisha au kukarabati sehemu zilizoharibika.
- source_word: בּוֹ
  choice: wakaitumia
  rationale: Kiwakilishi kinarejelea fedha; muundo huu unaonyesha kwa kawaida kwamba walitumia fedha hizo kufanya ukarabati.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Inahifadhi nahau ya Kiebrania ‘nyumba ya Yahwe’ na pia jina la agano יְהוָה; katika muktadha nyumba hiyo ni hekalu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja. ‘Yahwe’ hulitofautisha na cheo ‘Bwana’ na ni umbo la kawaida la Kiswahili linalokaribia matamshi ya jina hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeunganishwa kwa mtiririko wa simulizi, na ‘nao’ huonyesha kwa kawaida kwamba waliokarabati ni wale waliofanya kazi.
