  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּקֻ֥מוּ עֲבָדָ֖י/ו וַ/יִּקְשְׁרֽוּ קָ֑שֶׁר וַ/יַּכּוּ֙ אֶת יוֹאָ֔שׁ בֵּ֥ית מִלֹּ֖א הַ/יּוֹרֵ֥ד סִלָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: sw
  text: Watumishi wake wakainuka, wakafanya njama, wakampiga Yoashi huko Beth-Milo, kwenye mteremko unaoelekea Sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye njia inayoteremka kwenda Sila.” Kiebrania kinaeleza mahali hapo kuwa njia au sehemu ya kushukia kuelekea Sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha wa kifalme neno hili linamaanisha walio chini ya mfalme; “watumishi wake” ni la kawaida na haliongezi dhana mahsusi ya vyeo rasmi.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: wakafanya njama
  rationale: Muundo wa Kiebrania una kitenzi na nomino zenye mzizi mmoja na unaeleza kupanga njama. Kiswahili cha kawaida hutumia “kufanya njama” bila uradidi usio wa asili.
- source_word: וַיַּכּוּ
  choice: wakampiga
  rationale: Kitenzi נכה kimsingi ni kupiga. Ingawa muktadha mpana unaonyesha shambulio hilo lilisababisha kifo, mstari huu wenyewe hautumii kitenzi mahsusi cha kuua, hivyo “wakampiga” huhifadhi upana wa neno.
- source_word: בֵּית מִלֹּא
  choice: Beth-Milo
  rationale: Limechukuliwa kama jina la mahali na kutoholewa badala ya kutafsiriwa kuwa “nyumba ya Milo,” jambo ambalo lingeweza kuficha matumizi yake kama jina maalumu.
- source_word: הַיּוֹרֵד סִלָּא
  choice: kwenye mteremko unaoelekea Sila
  rationale: Kirai hiki kinaeleza sehemu ya kushukia au njia inayoteremka kuelekea Sila. Tafsiri hii ni ya asili na huhifadhi maana ya kijiografia.
- source_word: סִלָּא
  choice: Sila
  rationale: Ni jina maalumu la mahali, limetoholewa kwa tahajia inayofaa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya “waka-” unaakisi mtiririko wa simulizi la Kiebrania. Alama ya tanbihi imewekwa baada ya kirai cha mteremko, ambacho ndicho kinachofafanuliwa na tanbihi.
