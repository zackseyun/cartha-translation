  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: sw
  text: Hata hivyo, maeneo ya juu ya ibada[a] hayakuondolewa; watu waliendelea kutoa dhabihu na kufukiza uvumba katika maeneo hayo ya juu ya ibada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vituo vya ibada.” Kiebrania “maeneo ya juu” humaanisha maeneo ya kienyeji ya ibada, mara nyingi yaliyokuwa sehemu za juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hata hivyo
  rationale: Neno hili linaweka kikomo au tofauti na tathmini nzuri iliyotangulia; “Hata hivyo” huonyesha nguvu hiyo ya upinzani kwa Kiswahili cha kawaida.
- source_word: הַבָּמוֹת
  choice: mahali pa juu pa ibada
  rationale: בָּמוֹת ni maeneo ya kienyeji ya ibada, mara nyingi yaliyokuwa sehemu za juu. Tafsiri hii inahifadhi maana ya mahali na matumizi yake ya kidini bila kuyaeleza kupita kiasi.
- source_word: לֹא סָרוּ
  choice: hapakuondolewa
  rationale: Ingawa kitenzi cha Kiebrania kinaweza kumaanisha ‘kuondoka,’ hapa mahali pa juu ndiyo kiima; usemi wa Kiswahili ‘hapakuondolewa’ unaeleza kwa kawaida kwamba maeneo hayo yaliendelea kuwapo.
- source_word: עוֹד
  choice: bado
  rationale: Huonyesha kwamba tendo liliendelea kufanywa.
- source_word: הָעָם
  choice: watu
  rationale: Ni tafsiri ya kawaida ya nomino ya pamoja inayowarejelea watu wa taifa.
- source_word: מְזַבְּחִים
  choice: walikuwa wakitoa dhabihu
  rationale: Muundo huu unaonyesha tendo la kawaida lililokuwa likiendelea, kama participle ya Kiebrania.
- source_word: וּמְקַטְּרִים
  choice: na kufukiza uvumba
  rationale: Katika muktadha wa ibada, קטר kwa kawaida humaanisha kufukiza uvumba au kuteketeza sadaka ili itoe moshi; hapa ‘kufukiza uvumba’ ndiyo tafsiri ya kawaida na inayofaa muktadha.
- source_word: בַּבָּמוֹת
  choice: mahali hapo pa juu
  rationale: Inarudia eneo la ibada lililotajwa; ‘hapo’ hufanya marudio yawe ya kawaida katika Kiswahili bila kuondoa maana ya mahali pa juu.
theological_decisions:
- issue: Tathmini ya ibada katika mahali pa juu
  choice: Kudumisha usemi wa kihistoria ‘mahali pa juu pa ibada’ bila kuongeza hukumu ya kitheolojia katika maandishi makuu.
  alternative: ‘vituo vya ibada havikuondolewa; watu waliendelea kutoa dhabihu na kufukiza uvumba huko’
  rationale: Muktadha mpana unakosoa ibada katika maeneo yasiyoruhusiwa, lakini mstari huu wenyewe unaripoti tu kwamba maeneo hayo na matumizi yake yaliendelea. Tafsiri haiongezi maelezo ya kimadhehebu wala kutatua mvutano huo kimya-kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘walikuwa wakitoa’ umechaguliwa ili kuonyesha matendo yaliyoendelea au kufanywa kwa mazoea.
