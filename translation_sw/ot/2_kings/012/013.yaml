  text: וְ/לַ/גֹּֽדְרִים֙ וּ/לְ/חֹצְבֵ֣י הָ/אֶ֔בֶן וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת בֶּ֣דֶק בֵּית יְהוָ֑ה וּ/לְ/כֹ֛ל אֲשֶׁר יֵצֵ֥א עַל הַ/בַּ֖יִת לְ/חָזְקָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: sw
  text: na kwa ajili ya waashi[a] na wakataji wa mawe, na kwa ajili ya kununua mbao na mawe ya machimbo[b] ili kurekebisha uharibifu[c] wa nyumba ya Yahwe, na kwa ajili ya matumizi yote[d] ya nyumba hiyo ili kuikarabati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wajenzi wa kuta.” Neno la Kiebrania linaweza kumaanisha kwa upana zaidi wafanyakazi waliohusika na uashi au ukarabati wa kuta.
    reason: lexical_alternative
  - marker: b
    text: Au “mawe yaliyochongwa” au “mawe yaliyokatwa.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “ili kuimarisha ufa au uharibifu wa nyumba ya Yahwe.”
    reason: lexical_alternative
  - marker: d
    text: Kihalisi, “kwa yote yatokayo juu ya nyumba,” yaani matumizi yote yaliyotolewa kwa ajili ya kuikarabati.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּדְרִים
  choice: waashi
  rationale: Neno hili linarejelea wafanyakazi waliohusika na ujenzi au ukarabati wa kuta. “Waashi” ni neno la kawaida na linafaa katika muktadha wa ukarabati wa hekalu.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: wachongaji wa mawe
  rationale: Kirai hiki kinawataja watu waliokata au kuchonga mawe; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: לִקְנוֹת עֵצִים
  choice: kununua mbao
  rationale: Katika muktadha wa ujenzi, עֵצִים ni miti iliyotayarishwa kuwa vifaa vya ujenzi, hivyo “mbao” ni sahihi kuliko “kuni” au “miti.”
- source_word: אַבְנֵי מַחְצֵב
  choice: mawe ya machimboni
  rationale: Kirai hiki kinamaanisha mawe yaliyotolewa machimboni. Tafsiri hii huhifadhi uhusiano wake na machimbo bila kuamua kwa lazima kiwango ambacho mawe hayo yalikuwa yamechongwa.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: kukarabati sehemu zilizoharibika
  rationale: Ingawa חזק kimsingi ni “kuimarisha” na בֶּדֶק ni ufa, pengo, au uharibifu, kirai chote hapa kinaeleza ukarabati wa sehemu zilizoharibika. Tafsiri hii ni ya asili kwa Kiswahili huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi sitiari ya Kiebrania, ambayo katika muktadha huu inarejelea hekalu; jina la Mungu יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: na kulipia gharama zote zilizotumika kwa nyumba hiyo
  rationale: Usemi wa Kiebrania “yote yatokayo juu ya nyumba” ni nahau ya matumizi au gharama zilizotolewa kwa ajili ya jengo. Tafsiri hii hutoa maana yake wazi katika Kiswahili cha sasa.
- source_word: לְחָזְקָה
  choice: ili kuitengeneza
  rationale: Kitenzi hiki kinatokana na חזק, lakini hapa kinaonyesha kusudi la matumizi hayo, yaani kuitengeneza au kuiimarisha nyumba. “Kuitengeneza” ni wazi na huepuka urudiaji usio wa asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” hulitambulisha kama jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo; haliongezi msimamo wa dhehebu fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa aya umehifadhiwa kama mwendelezo wa sentensi inayotangulia. “Kuwalipa” hufanya mahusiano ya vihusishi yaeleweke katika Kiswahili, huku urudiaji wa kusudi la ukarabati katika sehemu ya mwisho ukihifadhiwa.
