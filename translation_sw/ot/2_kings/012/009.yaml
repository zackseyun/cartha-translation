  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּאֹ֖תוּ הַ/כֹּֽהֲנִ֑ים לְ/בִלְתִּ֤י קְחַת כֶּ֨סֶף֙ מֵ/אֵ֣ת הָ/עָ֔ם וּ/לְ/בִלְתִּ֥י חַזֵּ֖ק אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: sw
  text: Lakini makuhani wakakubali kutopokea fedha kutoka kwa watu, wala kutorekebisha sehemu zilizoharibika za nyumba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba” hapa ni nyumba ya BWANA, yaani hekalu. Kiebrania husema kwa maana halisi zaidi, “kuimarisha uharibifu wa nyumba,” nahau yenye maana ya kurekebisha sehemu zake zilizoharibika.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: wakakubali
  rationale: Kitenzi אבה hapa kinaonyesha kukubali au kuwa tayari; “wakakubali” ni Kiswahili cha kawaida na kinaendana na vitenzi-jina vinavyofuata.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wahudumu wa kikuhani katika muktadha wa hekalu.
- source_word: לְבִלְתִּי קְחַת
  choice: kutopokea
  rationale: לְבִלְתִּי pamoja na kitenzi-jina huonyesha tendo lililokanushwa. Katika muktadha wa ukusanyaji wa fedha, “kupokea” ni ya asili kuliko “kuchukua” na haidokezi unyang’anyi.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Ingawa neno hilo pia humaanisha “silver,” katika muktadha wa usimamizi na malipo linamaanisha pesa; “fedha” huhifadhi pia mwangwi wa maana yake halisi.
- source_word: מֵאֵת הָעָם
  choice: kutoka kwa watu
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kirai cha Kiebrania.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: wala kutorekebisha
  rationale: חזק kihalisi ni “kuimarisha,” lakini pamoja na בֶּדֶק הַבָּיִת ni nahau ya kufanya matengenezo; “kurekebisha” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: sehemu zilizoharibika za nyumba
  rationale: בֶּדֶק hurejelea ufa, pengo, au uharibifu unaohitaji matengenezo. Usemi huu unaeleweka vizuri kwa kurejelea sehemu zilizoharibika huku “nyumba” ikihifadhi msemo wa chanzo.
theological_decisions:
- issue: Maana ya הַבָּיִת (“nyumba”) katika muktadha
  choice: Kuhifadhi “nyumba” katika andiko na kueleza kuwa ni nyumba ya BWANA, yaani hekalu, katika tanbihi
  alternative: Kutafsiri moja kwa moja “hekalu”
  rationale: Hii huhifadhi taswira ya Kiebrania bila kumwacha msomaji asiyejua muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wala” huunganisha kwa kawaida vipashio viwili vilivyokanushwa. Tafsiri inadumisha “nyumba” kutoka chanzo lakini inaweka maelezo ya muktadha katika tanbihi.
