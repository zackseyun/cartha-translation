base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: sw
  text: Kila walipoona kwamba fedha katika sanduku ilikuwa nyingi, mwandishi wa mfalme na kuhani mkuu walipanda, wakaifunga katika mafungu na kuhesabu fedha iliyopatikana katika nyumba ya BWANA.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: mwandishi wa mfalme
  rationale: Neno סֹפֵר humaanisha mwandishi au karani mwenye wadhifa rasmi; “mwandishi wa mfalme” ni sahihi na linaeleweka katika muktadha wa utawala.
- source_word: וַיָּצֻרוּ
  choice: wakaifunga mafungumafungu
  rationale: Kitenzi hiki hapa kinaelekea kumaanisha kufunga fedha katika vifurushi au mafungu, si kuiweka tu katika mifuko; tafsiri hii huhifadhi tendo la kuifunga bila kubainisha chombo ambacho hakikutajwa.
- source_word: בֵית יְהוָה
  choice: nyumba ya BWANA
  rationale: “Nyumba” huhifadhi taswira ya Kiebrania ya hekalu, na “BWANA” linafuata desturi ya Kiswahili ya kuwakilisha jina la Mungu יהוה.
- source_word: וַיַּעַל
  choice: walipanda
  rationale: Maana ya msingi ni “akapanda”; imehifadhiwa kwa kuwa huenda inaonyesha kwenda mahali sanduku lilipokuwa, ingawa katika Kiswahili muktadha wake si wazi kabisa.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” ni uwakilishi uliozoeleka katika Biblia za Kiswahili na hauingizi msimamo wa kimadhehebu; herufi kubwa zinaonyesha kwamba chanzo kina jina la agano יהוה.
- issue: Cheo הַכֹּהֵן הַגָּדוֹל
  choice: kuhani mkuu
  alternative: kuhani mkubwa
  rationale: “Kuhani mkuu” ni usemi wa kawaida, wa asili na sahihi kwa cheo hiki katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “Kila walipoona” unaonyesha tukio lililojirudia; “mafungumafungu” hufanya tendo la kufunga fedha lieleweke bila kuongeza habari ya mifuko isiyokuwapo wazi katika chanzo.
