base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/018.yaml
  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: sw
  text: Kisha akasema, “Chukua mishale,” naye akaichukua. Akamwambia mfalme wa Israeli, “Piga ardhi,” naye akaipiga mara tatu, kisha akaacha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “akasimama”; hapa kitenzi cha Kiebrania kinamaanisha kwamba aliacha kupiga baada ya mara tatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: Chukua mishale
  rationale: Amri ya moja kwa moja imetafsiriwa kwa Kiswahili cha kawaida; nomino ya wingi inaeleweka kuwa mishale iliyotajwa katika muktadha bila kuhitaji kibainishi cha pekee.
- source_word: וַיִּקָּח
  choice: naye akaichukua
  rationale: Kiwakilishi cha ngeli ya mishale kinarejesha kitu kilichotajwa na kufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: Akamwambia mfalme wa Israeli
  rationale: Muundo huu unawasilisha kwa uwazi yule aliyeambiwa, huku ukidumisha mtindo wenye hadhi wa masimulizi.
- source_word: הַךְ אַרְצָה
  choice: Piga ardhi
  rationale: ‘Piga’ huhifadhi nguvu ya amri ya נכה, na ‘ardhi’ huonyesha uso wa chini unaopigwa bila kuongeza wazo la kufyatua mishale ambalo halijasemwa wazi katika kirai hiki.
- source_word: וַיַּךְ שָׁלֹשׁ פְּעָמִים
  choice: naye akaipiga mara tatu
  rationale: Kiwakilishi ‘-i-’ kinarejelea ardhi kwa njia ya kawaida, na ‘mara tatu’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: וַיַּעֲמֹד
  choice: kisha akaacha
  rationale: Ingawa kitenzi kwa msingi humaanisha ‘kusimama,’ katika mfuatano huu kinaonyesha kwamba aliacha kupiga baada ya mara tatu; ‘akaacha’ huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa sasa na wenye hadhi. Kiunganishi ‘naye’ kinaendeleza mtiririko na kutofautisha kwa urahisi vitendo vya nabii na vya mfalme.
