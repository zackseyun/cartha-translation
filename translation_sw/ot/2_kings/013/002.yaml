  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ֠/יֵּלֶךְ אַחַ֨ר חַטֹּ֜את יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל לֹא סָ֥ר מִמֶּֽ/נָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: sw
  text: Akafanya yaliyo maovu machoni pa Yahweh, akafuata dhambi za Yeroboamu mwana wa Nebati, aliyewasababisha Israeli kutenda dhambi; hakuyaacha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata umbo la Kiebrania kwa karibu zaidi: “hakuiacha.” Kiambishi cha Kiebrania ni cha kike umoja, na huenda kinarejelea kwa ujumla mwenendo wa dhambi wa Yeroboamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akafanya
  rationale: Ka- ya usimulizi inaendeleza mfululizo wa matukio na kuhifadhi tendo la עשה kwa Kiswahili cha kawaida.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: yaliyo maovu machoni pa Yahweh
  rationale: Huhifadhi tamathali ya Kiebrania ya tathmini ya maadili mbele za Mungu huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיֵּלֶךְ אַחַר
  choice: akafuata
  rationale: Ingawa Kiebrania kwa umbo la nje ni ‘akaenda/akitembea nyuma ya,’ maana ya nahau ni kufuata mwenendo au mfano; ‘akafuata’ ni ya asili na wazi.
- source_word: חַטֹּאת
  choice: dhambi
  rationale: Nomino ina umbo la wingi katika Kiebrania; ‘dhambi’ katika Kiswahili linaweza kuwa umbo la umoja au wingi kulingana na muktadha, hapa likimaanisha matendo ya dhambi ya Yeroboamu.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yeroboamu mwana wa Nebati
  rationale: Majina yametoholewa kwa mazoea ya Kiswahili, na patronimiki ‘mwana wa’ imehifadhiwa.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: aliyewasababisha Israeli kutenda dhambi
  rationale: Hiphil ya חטא ina nguvu ya kisababishi; ‘aliyesababisha ... kutenda dhambi’ huiwasilisha moja kwa moja. Upatanisho wa ‘aliwa-’ unaichukulia Israeli kama watu.
- source_word: לֹא סָר מִמֶּנָּה
  choice: hakuyaacha
  rationale: סור ina maana ya kugeuka au kuacha. Kiambishi ‘-ya-’ kinaelekeza kwa njia ya kawaida kwenye matendo ya dhambi yaliyotajwa, huku tanbihi ikihifadhi umoja wa kisarufi wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la agano; ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Kirejelewa cha kiambishi cha kike cha umoja katika מִמֶּנָּה
  choice: hakuyaacha, ikirejelea dhambi/matendo ya dhambi
  alternative: hakuiacha au hakuacha jambo hilo
  rationale: Kiambishi cha Kiebrania ni cha kike umoja, lakini kwa uwezekano kinarejelea kwa ujumla mfumo wa dhambi za Yeroboamu. Tafsiri kuu ni ya kawaida kwa Kiswahili, na tanbihi inahifadhi utata wa umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Machoni pa’ huhifadhi tamathali ya chanzo; ‘akafuata’ huepuka nahau isiyo ya kawaida ya ‘kutembea nyuma ya.’
