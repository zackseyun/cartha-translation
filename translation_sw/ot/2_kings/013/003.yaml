base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: sw
  text: Basi hasira ya Yahwe ikawaka dhidi ya Israeli, naye akawatia mikononi mwa Hazaeli, mfalme wa Aramu,[a] na mikononi mwa Ben-Hadadi, mwana wa Hazaeli, siku zote hizo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “katika mkono wa”; hii ni nahau yenye maana ya kuwa chini ya uwezo au udhibiti wa mtu.
    reason: lexical_alternative
  - marker: c
    text: Au “siku zote,” yaani, katika kipindi hicho chote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Inahifadhi sitiari hai ya Kiebrania ya hasira ‘kuwaka’ huku ikiwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa umbo linalosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: בְּיִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Baada ya kitenzi cha hasira, kihusishi kinaonyesha kuwa hasira ilielekezwa kwa Israeli; ‘dhidi ya’ huwasilisha maana hiyo wazi.
- source_word: וַיִּתְּנֵם
  choice: akawatia
  rationale: Katika muktadha wa kushindwa kijeshi, ‘akawatia mikononi mwa’ huwasilisha kitendo cha kuwaweka chini ya mamlaka ya adui bila kupanua maana kupita chanzo.
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Inahifadhi taswira ya nahau ya Kiebrania huku usemi wa Kiswahili ‘mikononi mwa’ ukieleweka kuwa chini ya uwezo au udhibiti wa mtu.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazaeli, mfalme wa Aramu
  rationale: Majina yametoholewa kwa maumbo yanayofaa Kiswahili, na jina la mahali Aramu limehifadhiwa badala ya kutumia jina la baadaye ‘Siria’.
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: Ben-hadadi mwana wa Hazaeli
  rationale: Jina binafsi na uhusiano wa kifamilia vimewekwa wazi kama katika Kiebrania.
- source_word: כָּל הַיָּמִים
  choice: siku zote hizo
  rationale: Usemi huu unaonyesha muda wote wa kipindi kinachozungumziwa na ni wa asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kiebrania kinatumia jina maalumu la Mungu, si cheo. ‘Yahwe’ hulihifadhi kama jina na hulitoa kwa umbo linalofaa matamshi ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Sitiari ya hasira kuwaka na taswira ya kuwa mikononi mwa mtu zimehifadhiwa, huku tanbihi zikifafanua nahau ya pili.
