  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: sw
  text: 'Yoashi akalala pamoja na baba zake[a], naye Yeroboamu akaketi kwenye kiti cha enzi. Yoashi akazikwa huko Samaria pamoja na wafalme wa Israeli.


    [a] Au, “akalala na baba zake”; hii ni nahau ya kawaida ya Kiebrania ya kutaja kifo cha mfalme.'
  philosophy: optimal-equivalence
