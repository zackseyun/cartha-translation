    rationale: “Yoashi” ndilo umbo la Kiswahili sanifu lililozoeleka katika tafsiri za Biblia za Kiswahili na linaendana na utoaji wa majina ya Kiebrania katika muktadha huu.
  - severity: low
    issue: “kiti chake cha enzi” hueleweka kwa kawaida kuwa ni kiti cha enzi cha Yeroboamu.
    rationale: Kiambishi -ake katika Kiswahili humrejelea kwa urahisi Yeroboamu, aliye kiima cha sentensi. “Akaketi kwenye kiti cha enzi” hudumisha kauli ya kutawazwa bila kuamua rejeleo la kiambishi cha Kiebrania kupita kiasi.
  - severity: low
    issue: Tanbihi ina “akajilaza pamoja na baba zake.”
    rationale: “Akajilaza” si mbadala wa karibu wa fomula ya Kiebrania katika muktadha huu; “akalala na baba zake” huhifadhi usemi wenyewe kwa usahihi zaidi.
