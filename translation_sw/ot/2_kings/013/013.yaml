lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Huhifadhi taswira ya nahau ya kifalme ya Kiebrania inayotaja kifo, badala ya kuirahisisha kuwa “akafa.”
- source_word: עִם אֲבֹתָיו
  choice: pamoja na baba zake
  rationale: Ni tafsiri ya karibu ya kauli ya kawaida ya ukoo; tanbihi inaeleza maana yake ya kimuktadha.
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: akaketi kwenye kiti chake cha enzi
  rationale: Huhifadhi taswira halisi ya kuketi katika kiti cha enzi, ambayo hapa inaonyesha kumrithi mfalme.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Kauli tendwa ya Kiswahili inalingana na umbo la Kiebrania bila kumtaja mzishi asiyeainishwa.
- source_word: בְּשֹׁמְרוֹן
  choice: Samaria
  rationale: Katika Kiswahili, jina la mahali linaweza kufuata kitenzi “akazikwa” moja kwa moja likiwa na maana ya mahali alikozikwa.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: pamoja na wafalme wa Israeli
  rationale: Hufuata Kiebrania kwa karibu na kuonyesha kuwa alizikwa katika kundi la wafalme waliomtangulia.
