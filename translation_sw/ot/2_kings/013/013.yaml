  verdict: revise
  source_fidelity: 'Tafsiri inafuata mfuatano na maana ya Kiebrania kwa jumla: fomula ya kifo, kutawazwa kwa Yeroboamu, na maziko Samaria pamoja na wafalme wa Israeli. Hata hivyo, jina la mfalme linahitaji umbo la Kiswahili sanifu lililozoeleka, “Yoashi,” na “kiti chake cha enzi” humrejelea Yeroboamu kisarufi kwa uwazi zaidi kuliko uwakilishi wa kiambishi cha Kiebrania unavyoruhusu. Kuacha kivumishi hicho hutoa kauli ya kawaida ya kutawazwa bila kuongeza ufafanuzi usio katika matini.'
  naturalness: “Yoashi akalala pamoja na baba zake” ni lugha ya Biblia yenye hadhi na inaeleweka; “huko Samaria” ni ya kawaida zaidi kwa mahali pa maziko. Tanbihi iwe na mbadala wa karibu na matini, “akalala na baba zake,” badala ya “akajilaza,” ambalo linaweza kudokeza kitendo cha kujilaza kuliko nahau ya kifo.
  terminology: “Yoashi,” “Yeroboamu,” “Samaria,” “Israeli,” “kiti cha enzi,” na “wafalme wa Israeli” ni istilahi na majina yanayofaa kwa Kiswahili sanifu cha Afrika Mashariki.
  issues:
