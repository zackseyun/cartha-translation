base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: sw
  text: Kisha akasema, “Fungua dirisha linaloelekea mashariki,” naye akalifungua. Elisha akasema, “Piga mshale,” naye akaupiga. Halafu akasema, “Mshale wa ushindi kutoka kwa Yahwe[a], mshale wa ushindi dhidi ya Aramu! Utaipiga Aramu huko Afeki mpaka uikomeshe kabisa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mshale wa wokovu kutoka kwa BWANA, mshale wa wokovu dhidi ya Aramu.” Neno la Kiebrania linaweza pia kumaanisha “wokovu” au “ukombozi.”
    reason: Hulinda maana mbadala ya תְּשׁוּעָה na huonyesha namna ya kitamaduni ya kutafsiri יהוה.
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: Fungua dirisha linaloelekea mashariki
  rationale: Amri ya kufungua imehifadhiwa, huku קֵדְמָה ikitafsiriwa kwa kawaida kama mwelekeo wa dirisha.
- source_word: יְרֵה
  choice: Piga mshale
  rationale: Katika muktadha wa upinde na mishale, Kiswahili cha kawaida huhitaji kutaja mshale ili amri ieleweke wazi; hakiongezi tendo tofauti na lile lililodokezwa na Kiebrania.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: mshale wa ushindi wa Yahwe
  rationale: תְּשׁוּעָה hapa linahusu ukombozi wa kijeshi, hivyo ‘ushindi’ linafaa katika ishara hii ya kinabii; לַיהוָה imewasilishwa kama chanzo na umiliki wa ushindi.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: mshale wa ushindi dhidi ya Aramu
  rationale: Kirai cha pili kinafafanua cha kwanza; בַאֲרָם lina maana ya kupingana na Aramu katika muktadha wa vita.
- source_word: וְהִכִּיתָ אֶת אֲרָם בַאֲפֵק
  choice: Utawashinda Waaramu huko Afeki
  rationale: נכה hapa hutabiri kuwashambulia na kuwashinda majeshi ya Aramu. Kiswahili hutofautisha kwa kawaida nchi ‘Aramu’ na watu wake ‘Waaramu’; ‘huko’ ni ya kawaida kwa mahali pa vita.
- source_word: עַד כַּלֵּה
  choice: mpaka uwaangamize kabisa
  rationale: Muundo huu unaonyesha kuufikisha ushindi hadi mwisho kamili; kielezi ‘kabisa’ kinabeba nguvu ya ukamilifu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina la pekee la Mungu limeandikwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kulibadilisha kuwa cheo; tanbihi inatoa desturi nyingine ya tafsiri.
- issue: Maana ya תְּשׁוּעָה katika unabii wa kijeshi
  choice: ushindi
  alternative: wokovu au ukombozi
  rationale: Muktadha wa mshale na vita dhidi ya Aramu unaelekeza hasa kwenye ushindi wa kijeshi, lakini tanbihi inalinda upana wa maana ya neno la Kiebrania.
- issue: Kiwango cha עַד כַּלֵּה
  choice: mpaka uwaangamize kabisa
  alternative: mpaka uwakomeshe
  rationale: Kauli hii inaahidi ushindi kamili katika vita, bila kuamua zaidi ya maandishi kuhusu namna au upeo wa kihistoria wa maangamizi hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa amri na utekelezaji umehifadhiwa kwa mtindo hai wa simulizi; majina yametoholewa kuwa Aramu, Waaramu, na Afeki.
