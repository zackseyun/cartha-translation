  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha muundo wa muhtasari wa kifalme na swali la balagha la Kiebrania, huku ikitumia mpangilio wa maneno unaoeleweka kwa msomaji wa kawaida.
