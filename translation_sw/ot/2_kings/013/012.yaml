base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: sw
  text: Matendo mengine ya Yoashi, mambo yote aliyoyafanya, na uhodari wake katika kupigana dhidi ya Amazia, mfalme wa Yuda[a]—je, mambo hayo hayakuandikwa katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kupigana na Amazia, mfalme wa Yuda.” Kihusishi cha Kiebrania kwa kawaida humaanisha “na” au “pamoja na,” lakini katika muktadha huu wa vita kinamaanisha kukabiliana na mpinzani.
    reason: lexical_alternative
  - marker: b
    text: Jina hili linarejelea kitabu cha kumbukumbu za kifalme kinachotajwa katika Wafalme, wala si kitabu cha Biblia cha Mambo ya Nyakati.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Matendo mengine ya Yoashi
  rationale: Katika muhtasari wa kifalme, יֶתֶר דִּבְרֵי humaanisha matendo yaliyobaki au matendo mengine ya mfalme, si maneno yake tu. Kiswahili hiki ni cha kawaida na kinaendeleza mtiririko bila kuongeza neno la wakati lisilokuwamo katika chanzo.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: mambo yote aliyoyafanya
  rationale: Huhifadhi maana pana ya כָל na עשה na pia marudio ya kimakusudi baada ya kutajwa kwa matendo mengine.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר נִלְחַם
  choice: na uhodari aliouonyesha alipopigana
  rationale: גְבוּרָה hapa ni uhodari au nguvu inayoonekana vitani. Muundo huu wa Kiswahili unaunganisha uhodari huo na pambano linalofuata bila kuufanya kuwa ushindi ambao chanzo hakisemi wazi.
- source_word: עִם אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: dhidi ya Amazia, mfalme wa Yuda
  rationale: Ingawa עִם kwa kawaida ni ‘na/pamoja na,’ baada ya kitenzi cha kupigana humtaja mpinzani; ‘dhidi ya’ huonyesha wazi uhusiano wa kiuadui katika muktadha huu. Koma hutenganisha jina na cheo kwa Kiswahili cha kawaida.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: je, mambo hayo hayakuandikwa
  rationale: Huhifadhi swali la balagha na hali ya kutendwa. ‘Mambo hayo’ huweka wazi kiwakilishi cha wingi kinachorejelea matendo na uhodari uliotajwa.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: katika Kitabu cha Mambo ya Nyakati za Wafalme wa Israeli
  rationale: ‘Katika’ ni Kiswahili cha kawaida kwa habari iliyoandikwa ndani ya kitabu. Jina hili linaonyesha kumbukumbu za kifalme za Israeli na kuhifadhi muundo wa kichwa cha chanzo.
